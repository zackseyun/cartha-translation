  text: וְ/אִ֡ם בְּ/אֶ֣בֶן יָד֩ אֲשֶׁר יָמ֨וּת בָּ֥/הּ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: zh_hans
  text: 或者，他若用一块足以致命的手持石头[a]击打那人，以致那人死了，他就是凶手；凶手必须被处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“手之石”，可指手中所拿的石头，或适合拿在手中作武器的石头。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 或者，他若
  rationale: 本句继续列举法律案例；“或者……若”自然表达与前例并列的另一种情形。
- source_word: בְּאֶבֶן יָד
  choice: 用手中的石头
  rationale: 原文直译近于“手之石”，指手持或适合拿在手中作武器的石头；正文保留具体形象，并以脚注说明其词义范围。
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: 那石头足以致命
  rationale: 关系从句说明石头具有致死能力，并非断言每次击打都必然致死；“足以致命”在现代汉语中准确自然。
- source_word: הִכָּהוּ
  choice: 击打那人
  rationale: נכה在此指击打；不预先把死亡结果含入动词，因为下文另说受害者死亡。
- source_word: וַיָּמֹת
  choice: 那人也死了
  rationale: 保留原文依次陈述击打与死亡的结构；补出“那人”以消除汉语代词歧义。
- source_word: רֹצֵחַ הוּא
  choice: 击打者就是凶手
  rationale: רֹצֵחַ在本法律语境中指应负罪责的杀人者；“凶手”体现司法定性，又比单纯“杀人者”更明确。补出“击打者”使主语清楚。
- source_word: מוֹת יוּמַת
  choice: 必须被处死
  rationale: 不定式绝对形与限定动词连用，强调处死判决的确定性和强制性；“必须被处死”简洁保留其法律力度。
- source_word: הָרֹצֵחַ
  choice: 这凶手
  rationale: 保留原文末尾对法律主体的名词重复；“这”承接前一句的司法认定。
theological_decisions:
- issue: 逃城律例中杀人者的法律定性
  choice: 将 רֹצֵחַ 译为“凶手”
  alternative: 杀人者；杀人犯
  rationale: 上下文把使用足以致命之物击打致死的行为，与误杀相区别。“凶手”传达原文在此作出的罪责判断，同时不引入后来的教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。正文避免生硬直译“手之石”，但用脚注保留原文表达；以“足以致命”呈现潜在致死能力，并保留“凶手”在判决句中的重复。
