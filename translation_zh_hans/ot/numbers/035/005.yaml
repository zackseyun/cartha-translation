  text: וּ/מַדֹּתֶ֞ם מִ/ח֣וּץ לָ/עִ֗יר אֶת פְּאַת קֵ֣דְמָ/ה אַלְפַּ֪יִם בָּֽ/אַמָּ֟ה וְ/אֶת פְּאַת נֶגֶב֩ אַלְפַּ֨יִם בָּ/אַמָּ֜ה וְ/אֶת פְּאַת יָ֣ם אַלְפַּ֣יִם בָּֽ/אַמָּ֗ה וְ/אֵ֨ת פְּאַ֥ת צָפ֛וֹן אַלְפַּ֥יִם בָּ/אַמָּ֖ה וְ/הָ/עִ֣יר בַּ/תָּ֑וֶךְ זֶ֚ה יִהְיֶ֣ה לָ/הֶ֔ם מִגְרְשֵׁ֖י הֶ/עָרִֽים־־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: zh_hans
  text: 你们要在城外量出：东边二千肘，南边二千肘，西边[a]二千肘，北边二千肘，城在中央。这一范围要归他们作各城的草场[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西边”原文直译为“海边”，即朝向地中海的一边；这是希伯来语表示西方的常用说法。
    reason: lexical_alternative
  - marker: b
    text: “草场”也可译作“公用地”或“空地”；原词指城周围的土地，常用于放牧。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם
  choice: 你们要量出
  rationale: 该动词在律法指令中带命令意味；“要量出”既保留实际测量的动作，也符合现代汉语表达。
- source_word: מִחוּץ לָעִיר
  choice: 在城外
  rationale: 表示测量是在城界以外进行；“在城外”自然简明，不额外限定测量起点。
- source_word: פְּאַת
  choice: 边
  rationale: 此处逐一列出四个方位，指所量区域的各边；译作“边”比“角”更符合勘界语境。
- source_word: קֵדְמָה / נֶגֶב / יָם / צָפוֹן
  choice: 东边／南边／西边／北边
  rationale: 按四方顺序直译。יָם字面为“海”，但在这里是以地中海方位为背景的惯用方向词，意为“西”。
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: 二千肘
  rationale: 保留原文的古代长度单位和明确数值，不擅自换算为现代单位。
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: 城在中央
  rationale: 简洁保留城市位于四边所围范围中央的空间关系。
- source_word: זֶה יִהְיֶה לָהֶם
  choice: 这一范围要归他们作
  rationale: “这一范围”承接前述量出的区域；“要归他们作”表达法律上的指定用途，但不将其过度解释为某种特定产权形式。
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: 各城的草场
  rationale: מִגְרָשׁ指城周围的空地，常可供放牧；正文采用易懂的“草场”，脚注保留“公用地、空地”等词义可能。复数“各城”自然呈现希伯来文复数。
theological_decisions: []
