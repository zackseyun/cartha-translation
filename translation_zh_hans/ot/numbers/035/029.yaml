  text: וְ/הָי֨וּ אֵ֧לֶּה לָ/כֶ֛ם לְ/חֻקַּ֥ת מִשְׁפָּ֖ט לְ/דֹרֹתֵי/כֶ֑ם בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/029.yaml
  text: And these shall be for you a statute of judgment throughout your generations in all your dwelling places[a][b].
translation:
  language: zh_hans
  text: 这些要作你们世世代代在一切住处施行的审判律例[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判律例”也可译作“司法条例”。希伯来语在这里把表示制定之律例和司法审判或程序的词连在一起。
    reason: lexical_alternative
  - marker: b
    text: “住处”也可译作“定居之地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: 要作
  rationale: 在法律条文中表达规定性和持续效力；“要作”既保留原文的将来/结果意味，也符合现代汉语法规语体。
- source_word: אֵלֶּה
  choice: 这些
  rationale: 复数指示词回指前述各项法律规定；译作“这些”简洁自然。
- source_word: לָכֶם
  choice: 你们
  rationale: 介词表示关联对象；结合汉语“作你们……的律例”的结构表达“给你们、对你们而言”。
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: 审判的律例
  rationale: חֻקָּה指制定并固定的律例，מִשְׁפָּט在本段涉及司法审理与裁决；此译保留两个法律词汇的组合及其可能的修饰关系，不将其单一化为泛指的“公义”。
- source_word: לְדֹרֹתֵיכֶם
  choice: 世世代代
  rationale: 表达该律例对接续各代持续有效；是现代汉语中自然、庄重的对应说法。
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: 在你们一切住处
  rationale: מוֹשָׁב可指居住之处或定居点；正文采用较宽泛的“住处”，并以脚注保留“定居之地”的可能译法。
- source_word: implicit application of the statute
  choice: 施行
  rationale: 原文以“在你们一切住处”限定律例的适用范围；汉语补出“施行”，使句意完整自然，并未增加新的法律内容。
theological_decisions:
- issue: מִשְׁפָּט在חֻקַּת מִשְׁפָּט中的含义
  choice: 审判的律例
  alternative: 公义的律例；司法条例
  rationale: 本章语境是误杀、逃城、见证与裁决程序，因此采用具有司法含义的“审判”；同时保留原文名词组合，不把它抽象化为一般道德意义上的“公义”，也不完全压缩成单一复合词。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“世世代代”体现持续适用性；为符合汉语表达，在句末补出隐含的“施行”。所有脚注标记均置于正文相应词语之后。
