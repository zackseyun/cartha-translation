  text: 此后，百姓从哈洗录出发，在巴兰旷野安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: 此后
  rationale: 表示紧接前文事件之后的时间顺序；“此后”简洁、自然，并保持叙事推进。
- source_word: נָסְעוּ
  choice: 出发
  rationale: נסע在旷野行程叙事中常指拔营启程；“出发”符合现代汉语表达，且不额外加入原文未明说的动作细节。
- source_word: הָעָם
  choice: 百姓
  rationale: 此处指以色列会众这一群体；“百姓”是圣经叙事中自然且庄重的集体称谓。
- source_word: מֵחֲצֵרוֹת
  choice: 从哈洗录
  rationale: חֲצֵרוֹת为地名，采用现代中文圣经中较通行的音译“哈洗录”，介词מִן译为“从”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה指停驻扎营；“安营”简明、庄重，也与旷野行程语境相符。
- source_word: בְּמִדְבַּר
  choice: 在……旷野
  rationale: מִדְבָּר表示荒野、旷野地带；“旷野”保留五经行程叙事中的地理与文学色彩。
- source_word: פָּארָן
  choice: 巴兰
  rationale: פָּארָן为地名，采用中文圣经中通行的音译“巴兰”。
