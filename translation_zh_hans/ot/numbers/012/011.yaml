  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: zh_hans
  text: 亚伦对摩西说：“我主啊，求你不要把罪加在我们身上[a]，因为我们行事愚昧，也犯了罪。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪”或译“罪责”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: 我主啊，求你
  rationale: בִּי在此表示恳求，译作“求你”；אֲדֹנִי是亚伦对摩西的尊称，译作“我主”，保留其恭敬和迫切的语气，并不指神。
- source_word: אַל נָא
  choice: 不要
  rationale: נָא所含的恳求语气已由前面的“求你”表达，因此此处用“不要”，避免汉语重复。
- source_word: תָשֵׁת עָלֵינוּ חַטָּאת
  choice: 把罪加在我们身上
  rationale: 保留“放置于……之上”的源语意象，同时采用自然、庄重的现代汉语。“罪”在此也可能侧重犯罪所带来的罪责，故以脚注说明。
- source_word: אֲשֶׁר נוֹאַלְנוּ
  choice: 因为我们行事愚昧
  rationale: נוֹאַלְנוּ表示行事愚昧、荒唐；“行事愚昧”既自然，也保留其道德判断。此处אֲשֶׁר结合语境表达亚伦恳求的缘由。
- source_word: וַאֲשֶׁר חָטָאנוּ
  choice: 也犯了罪
  rationale: 第二分句进一步明确承认过犯；“也”自然承接前句，同时避免汉语中机械重复“因为”。
theological_decisions:
- issue: אֲדֹנִי用于称呼摩西
  choice: 我主
  alternative: 大人
  rationale: 这里是对人的尊称，而非对神的称号。“我主”较好保留原文中的从属关系和恳求语气；“大人”虽可表达敬意，却带有较强的特定历史官制色彩。
- issue: חַטָּאת在恳求中的含义
  choice: 罪
  alternative: 罪责
  rationale: “罪”直接对应过犯本身，并与后面的“犯了罪”形成原文已有的词义呼应；但此处请求不要将其加在他们身上，也容许理解为犯罪所带来的“罪责”，故保留为脚注异译。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我主啊，求你”保留亚伦对摩西的恭敬与急切；“把罪加在我们身上”维持原文的空间隐喻，不把其含义完全改写为抽象的定罪措辞。
