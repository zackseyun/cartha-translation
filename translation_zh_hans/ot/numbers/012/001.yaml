base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: zh_hans
  text: 米利暗和亚伦因摩西所娶的古实女子[a]而非议摩西[b]，因为他娶了一个古实女子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实女子”指来自古实的女子；传统上也译作“埃塞俄比亚女子”。
    reason: lexical_alternative
  - marker: b
    text: 原文用“说话”一词并与“摩西”连用；在此语境中含有反对或责难的意思。该动词为阴性单数，可能表明米利暗在发言中居主导。
    reason: source_form_and_ambiguity
lexical_decisions:
- source_word: וַתְּדַבֵּר ... בְּמֹשֶׁה
  choice: 抨击摩西
  rationale: דבר 与介词 ב 连用，在此语境中带有敌对、责难之意。“抨击”自然表达负面言说，又不把内容具体化为经文未明说的“抱怨”。
- source_word: מִרְיָם וְאַהֲרֹן
  choice: 米利暗和亚伦
  rationale: 依照希伯来文次序保留两个人名。动词为阴性单数，可能显示米利暗在发言中居主导，但正文不额外明说。
- source_word: עַל אֹדוֹת
  choice: 因……而
  rationale: 该短语说明言说的缘由或场合；“因……而”简洁保留其因果意味。
- source_word: הָאִשָּׁה הַכֻּשִׁית / אִשָּׁה כֻשִׁית
  choice: 古实女子 / 一个古实女子
  rationale: אִשָּׁה 可指“女子”或“妻子”；与 לָקַח 的婚姻用法结合，中文用“所娶的……女子”既明确关系，又保留“女子”的措辞。כֻשִׁית 指来自古实的人，译作“古实女子”比“埃塞俄比亚女子”更贴近源文，避免时代错置。
- source_word: אֲשֶׁר לָקָח / לָקָח
  choice: 所娶的 / 娶了
  rationale: לקח 字面为“取”，在婚姻语境中是“娶、取为妻”的惯用表达。现代中文若直译“取了”容易含混，因此用自然明确的“娶”。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出解释性的重述。中文“因为”保留源文重复及其说明作用。
theological_decisions:
- issue: 摩西妻子的身份及族属称谓
  choice: 按源文译作“古实女子”，不将她与西坡拉等人物作调和性认定
  alternative: 传统译作“埃塞俄比亚女子”，或解释为西坡拉
  rationale: 本节明确使用“古实女子”这一族属或地域称谓，却没有进一步说明她的身份；译文应保留这种信息边界，不替经文解决历史与调和问题。
- issue: 米利暗在发言中的主导地位
  choice: 正文保留“米利暗和亚伦”，不据阴性单数动词增译“米利暗带头”
  alternative: 明确译成米利暗首先或带头发言
  rationale: 阴性单数动词可能表明米利暗居主导，也可能是语法一致方式；正文不应把这一线索提升为明说的叙事事实。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抨击”体现敌对言说；保留后半句对“娶了古实女子”的重复，以传达希伯来文的强调。所有脚注标记均置于正文相应位置。
