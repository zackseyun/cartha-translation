  terminology: “雅威”一致对应 יְהוָה；“形像”可承载 תְּמוּנָה 的“形状、样式、形像”范围，而不替文本解决神显的性质；“非议”在本段冲突语境中恰当地表达 לְדַבֵּר בְּ 的敌对性。“形像”脚注锚定在相应词语后，正确。英文审校记录中 b 脚注的锚点显示在“my servant”后、但脚注内容实际说明“form of Yahweh”；该英文锚点不影响本中文稿，中文稿已将 b 正确锚定于“形像”。
