id: NUM.12.8
reference: Numbers 12:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: פֶּ֣ה אֶל פֶּ֞ה אֲדַבֶּר בּ֗/וֹ וּ/מַרְאֶה֙ וְ/לֹ֣א בְ/חִידֹ֔ת וּ/תְמֻנַ֥ת יְהוָ֖ה יַבִּ֑יט וּ/מַדּ֨וּעַ֙ לֹ֣א יְרֵאתֶ֔ם לְ/דַבֵּ֖ר בְּ/עַבְדִּ֥/י בְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: zh_hans
  text: 我与他口对口说话[a]，清楚明白，不用谜语；他也得见雅威的形像[b]。你们怎么不惧怕，竟非议我的仆人摩西呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“面对面。”希伯来文直译为“口对口”，强调直接交谈。
    reason: lexical_alternative
  - marker: b
    text: “形像”也可译作“样式”或“显现的形态”。原文没有进一步说明摩西所见的性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: 口对口
  rationale: 紧贴希伯来文的具体表达，突出雅威与摩西直接交谈；虽可按习语译作“面对面”，正文保留原文独特的“口”这一意象。
- source_word: אֲדַבֶּר בּוֹ
  choice: 我与他说话
  rationale: דבר 与介词 ב 连用，在此表示同某人交谈；“与他”比单纯的“对他说”更能体现直接交流。
- source_word: וּמַרְאֶה
  choice: 清楚明白
  rationale: 此词与后面的“不用谜语”形成对照，语境着重说明启示方式清楚、显明；采用副词性表达，使现代汉语自然，同时不将其误解为另一个独立可见之物。
- source_word: וְלֹא בְחִידֹת
  choice: 不用谜语
  rationale: חִידֹת 指谜语、隐晦难解的话；“不用谜语”简洁地保留与清楚言说之间的对比。
- source_word: וּתְמֻנַת יְהוָה
  choice: 雅威的形像
  rationale: תְּמוּנָה 可指形像、形状或显现的样式。“形像”保留其具体性，又不进一步界定摩西所见的本体性质；神名 יְהוָה 音译为“雅威”。
- source_word: יַבִּיט
  choice: 得见
  rationale: 该动词在此含有注目观看之意。“得见”兼顾庄重语气和摩西蒙准看见的语境。
- source_word: וּמַדּוּעַ לֹא יְרֵאתֶם
  choice: 你们怎么不惧怕
  rationale: 保留反问和责备的力度；“惧怕”既表达畏惧，也容纳对神所立仆人应有的敬畏。
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: 竟非议我的仆人摩西
  rationale: 两次介词 ב 在语境中标示敌对言论的对象。“非议”比中性的“谈论”准确，又不强化为未经原文明确规定的“毁谤”；“我的仆人摩西”自然保留同位关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为现代汉语音译，保留其作为盟约之神专名的性质，而不以称号替代。
- issue: 摩西看见雅威之“形像”
  choice: 雅威的形像
  alternative: 雅威的样式；雅威的显现
  rationale: 原文肯定摩西以独特方式看见雅威的 תְּמוּנָה，却未解释这与神不可见性之间的全部关系。译文保留这一神学张力，不把它明确化为神的本体，也不弱化为纯粹内在异象。
- issue: 雅威向摩西启示的直接程度
  choice: 口对口说话，清楚明白，不用谜语
  alternative: 面对面说话；在异象中而不用谜语
  rationale: 正文保留“口对口”的原文意象，并按上下文将 וּמַרְאֶה 表达为清楚显明，突出摩西所得启示的直接性，同时不对其机制作额外解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“口对口”有意保留原文不寻常的具体表达；“清楚明白”“不用谜语”“非议”则确保句意对普通读者自然明确。反问句保留雅威责备米利暗和亚伦的力度。
