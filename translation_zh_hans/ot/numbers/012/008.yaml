  source_fidelity: 译文准确传达了本节的主要句法与语义：雅威与摩西“口对口”直接交谈，启示清楚而非借谜语；摩西得见雅威的“形像”；末句则保留了对亚伦和米利暗的责问，以及“非议/说攻击性的话”的对象是雅威的仆人摩西。将 וּמַרְאֶה 连同“非用谜语”译为“清楚明白，不用谜语”，是符合上下文的自然处理，未不当地限定其显现方式。
