base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: zh_hans
  text: 雅威在云柱中降临，站在帐幕的门口[a]，呼唤亚伦和米利暗；二人便上前来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“帐幕”按上下文指会幕。
    reason: cross_reference
  - marker: b
    text: 或译：“二人便走出来。”希伯来文动词的字面意思是“出去、出来”；这里可能指他们应雅威的呼唤走上前。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 降下
  rationale: 保留希伯来文“下去、降下”的具体移动意象，同时符合现代汉语叙事表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: בְּעַמּוּד עָנָן
  choice: 在云柱中
  rationale: 介词短语表示雅威降下时的显现方式；“在云柱中”直接而自然。
- source_word: וַיַּעֲמֹד
  choice: 站在
  rationale: 对应动词“站立”，并与地点短语自然衔接。
- source_word: פֶּתַח הָאֹהֶל
  choice: 帐幕门口
  rationale: פתח指入口或门口，אֹהֶל本节仅作“帐幕”；正文不擅自补入完整名称“会幕”。
- source_word: וַיִּקְרָא
  choice: 呼唤
  rationale: 保留קרא“呼叫、呼唤”的基本意义；语境本身已表明这是召他们近前。
- source_word: אַהֲרֹן וּמִרְיָם
  choice: 亚伦和米利暗
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: 二人便上前来
  rationale: שְׁנֵיהֶם明确指“两人”；יצא字面是“出去、出来”，此处按回应呼唤的语境译为“上前来”，并以脚注保留字面可能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 正文保留源文中的个人神名，不以“主”这一称号代替，也不借译名加入宗派立场。
- issue: 雅威“降下”的拟人性表述
  choice: 保留“降下”
  alternative: 显现
  rationale: 源文明确使用表示下降的动词；保留具体意象，不为协调神学概念而改写为较抽象的“显现”。
- issue: 帐幕的具体所指
  choice: 正文译“帐幕”，脚注说明语境所指
  alternative: 正文直接译“会幕”
  rationale: 本节希伯来文仅有“帐幕”，而上下文表明是会幕；正文与脚注兼顾字面形式和语境辨识。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。叙事动词简洁连贯；保留“云柱”“降下”等具体意象。脚注标记均置于相应正文词句之后，并纠正咨询层中脚注内容与标记位置的错配。
