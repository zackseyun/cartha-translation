  text: וַ/תִּסָּגֵ֥ר מִרְיָ֛ם מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים וְ/הָ/עָם֙ לֹ֣א נָסַ֔ע עַד הֵאָסֵ֖ף מִרְיָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/015.yaml
  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
translation:
  language: zh_hans
  text: 于是，米利暗被隔离在营外七天；百姓没有启程，直到米利暗被接回来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到米利暗被收回来。”希伯来文直译为“直到米利暗被聚集”，这里指她结束隔离后获准回到营中。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: 被隔离
  rationale: סגר 的尼斐尔式表示被关闭、禁闭或隔离。结合米利暗被置于营外的语境，“被隔离”既自然，也清楚表达她暂时不得进入营地的状态。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 在营外
  rationale: 直译为“在营地之外”；“在营外”简洁自然，符合旷野行程的叙事语境。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 表示持续时间；汉语在“被隔离在营外七天”中无需另加介词，时长意义明确。
- source_word: הָעָם
  choice: 百姓
  rationale: 这里指以色列共同体；“百姓”是圣经叙事中自然、庄重且易懂的对应词。
- source_word: לֹא נָסַע
  choice: 没有启程
  rationale: נסע 在旷野叙事中常指拔营上路。“没有启程”准确体现尚未继续行程，而非泛指没有移动。
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: 直到米利暗被接回来
  rationale: אסף 的尼斐尔式字面为“被聚集、被收回”；此处按上下文指她结束营外隔离后被接纳回营。“被接回来”以自然汉语表达恢复进入营中的含义，同时脚注保留原文的字面意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“隔离”贴合营外排除的具体情境；“启程”保留旷野行程中拔营上路的意味。句中使用分号，使米利暗受隔离与全体百姓暂停行程之间的关系清楚，但不额外解释其神学意义。
