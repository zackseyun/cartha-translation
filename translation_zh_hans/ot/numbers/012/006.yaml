  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: zh_hans
  text: 他说：“你们现在要听我的话：如果你们中间有先知[a]，我——雅威——就在异象中向他显明自己[b]，在梦中与他说话[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果你们中有谁是先知。”希伯来语直译近似“如果有你们的先知”。
    reason: 说明希伯来语所有格结构在此可能有的自然译法。
  - marker: b
    text: 或译：“向他启示自己。”
    reason: “显明自己”和“启示自己”都可表达此处动词的反身含义。
  - marker: c
    text: 或译：“在梦中对他说话”，也可能理解为“借着梦向他说话”。
    reason: 希伯来语介词结构可侧重交谈对象，也可结合“梦”理解为启示的媒介。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 以自然的汉语叙事形式承接上文；主语由语境确定为雅威。
- source_word: שִׁמְעוּ נָא דְבָרָי
  choice: 你们现在要听我的话
  rationale: 保留复数命令语气，并以“现在”表达 נָא 在此郑重催促、要求留意的作用。
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: 如果你们中间有先知
  rationale: 将字面较生硬的“你们的先知”按希伯来语习惯自然表达，同时保留条件句及群体范围。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，不以称号替代专名。
- source_word: בַּמַּרְאָה אֵלָיו אֶתְוַדָּע
  choice: 我雅威会在异象中向他显明自己
  rationale: “显明自己”体现 התודע 的反身意义；“在异象中”保留启示发生的方式或场域。
- source_word: בַּחֲלוֹם אֲדַבֶּר בּוֹ
  choice: 在梦中与他说话
  rationale: “与他说话”较贴近 דבר ב 的结构，也保留交流意味；בו 的确切功能仍可作不同理解，故列脚注。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名；音译可保留其专名性质，而不以“主”这一称号取代。
- issue: 先知领受启示的方式
  choice: 在异象中显明自己，在梦中与他说话
  alternative: 借异象显现，借梦向他说话
  rationale: 保留本节对异象和梦的并列表述，不把经文扩展成关于预言机制的系统性教义。
- issue: אִם 的条件意味
  choice: 如果
  alternative: 当……时
  rationale: “如果”直接保留条件句形式，也不排除这句话用于概括通常情形的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们现在要听我的话”保持神谕开头的郑重语气；“显明自己”兼顾原文形式与普通读者的可理解性。所有脚注标记均已置于正文相应位置。
