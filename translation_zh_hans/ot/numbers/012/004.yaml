  text: וַ/יֹּ֨אמֶר יְהוָ֜ה פִּתְאֹ֗ם אֶל מֹשֶׁ֤ה וְ/אֶֽל אַהֲרֹן֙ וְ/אֶל מִרְיָ֔ם צְא֥וּ שְׁלָשְׁתְּ/כֶ֖ם אֶל אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּצְא֖וּ שְׁלָשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: zh_hans
  text: 雅威忽然对摩西、亚伦和米利暗说：“你们三个[a]都出来[b]，到会幕去。”他们三人就出去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你们三个人”或“你们三人全都”。
    reason: lexical_alternative
  - marker: b
    text: 原文动词只表示从某处出去；按语境也可理解为“出去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字 YHWH 的现代汉语音译，不以“耶和华”或“上主”等称号替代原文中的专名。
- source_word: פִּתְאֹם
  choice: 忽然
  rationale: 既表达事情发生得迅速，也保留出人意料的叙事意味；“忽然”符合现代汉语叙事习惯。
- source_word: צְאוּ
  choice: 出来
  rationale: יצא 的命令式表示从所在之处出去；汉语“出来”自然地表达召唤，同时不额外断定说话者当时的空间位置。
- source_word: שְׁלָשְׁתְּכֶם
  choice: 你们三个
  rationale: 明确保留原文对三名受话者的共同指称；另用“都”体现三人无一例外。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该以色列敬拜场所的通行而简洁的现代汉语名称，对应“相会之帐幕”。
- source_word: וַיֵּצְאוּ
  choice: 就出去了
  rationale: 以“就”承接命令与执行，以“出去”如实表达 יצא 的移动含义，并保持自然的汉语叙事视角。
- source_word: שְׁלָשְׁתָּם
  choice: 他们三人
  rationale: 保留原文再次强调三人一同遵命的表达。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；译作“雅威”可将其作为以色列之神的专名呈现，而不以称号取代，也避免采用较晚形成的混合读音。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威忽然对……说”保持简洁的叙事节奏；直接引语中的“你们三个都”凸显三人共同受召，“他们三人”则保留原文有意的重复。
