base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“她父亲若吐在她脸上，她岂不蒙羞七天吗？让她在营外隔离七天；随后，她可以被接回来[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“随后，她可以重新被收纳。”
    reason: 原文动词可指被聚集、被收纳，即隔离期后重新进入营中群体。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，不以“主”这一称号替代专名。
- source_word: יָרֹק יָרַק
  choice: 若向……吐唾沫
  rationale: 不机械重复希伯来语不定式绝对形与限定动词；以自然中文保留假设语气及动作的强烈、羞辱性质。
- source_word: בְּפָנֶיהָ
  choice: 向她脸上
  rationale: 在吐唾沫的语境中，这是自然且具体的中文表达，传达当面羞辱。
- source_word: תִכָּלֵם
  choice: 岂不要蒙羞
  rationale: 该词的尼法勒形表示受辱、蒙羞；“蒙羞”兼顾外在社会羞辱和当事人的羞耻处境，并保留反问句式。
- source_word: תִּסָּגֵר
  choice: 要把她关在
  rationale: 用处置式中文表达希伯来语被动形的隔离、关闭含义，避免“囚禁”所带来的额外刑罚色彩。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 营外
  rationale: 简洁、自然地对应以色列营地之外。
- source_word: תֵּאָסֵף
  choice: 被接回来
  rationale: 保留尼法勒形的被动含义及重新纳入营中群体的方向，同时不把施事者明说出来。
theological_decisions:
- issue: 父亲吐唾沫这一分句的性质
  choice: 作为关于羞辱和隔离的假设性类比
  alternative: 视为对某件实际发生之事的回顾
  rationale: 希伯来语以假设条件和反问说明米利暗被隔离七天的合理性；译文不附加象征或教派性解释。
- issue: 七天蒙羞与七天营外隔离的关系
  choice: 保留经文本身的对应，不进一步解释其礼仪或惩戒机制
  alternative: 明说这是礼仪不洁期或司法刑期
  rationale: 本节只建立类比并发出隔离命令，未明确界定其完整神学机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“蒙羞”保留社会性羞辱；“关在营外”具体表达隔离，又不增添现代监禁制度的联想。脚注标记已置于相关主文之后。
