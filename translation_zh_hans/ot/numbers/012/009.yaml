  text: וַ/יִּֽחַר אַ֧ף יְהוָ֛ה בָּ֖/ם וַ/יֵּלַֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: zh_hans
  text: 耶和华向他们发怒[a]，就离去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“耶和华的鼻子向他们发热”，是表示耶和华向他们发怒的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 发怒
  rationale: 这是希伯来语以“鼻子发热”表达愤怒的惯用语。现代汉语用“发怒”最自然；脚注保留原文的热度意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”译出四字神名，不以称号代替。
- source_word: בָּם
  choice: 向他们
  rationale: 介词在发怒惯用语中标示愤怒所针对的对象；“向他们发怒”符合现代汉语搭配。
- source_word: וַיֵּלַךְ
  choice: 就离去了
  rationale: הלך在本段语境中表示耶和华说完话后离开；“离去了”简洁自然，并保留叙事的先后推进。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列之神的专名。中文正文采用广为人知且具有专名功能的“耶和华”，而不改译为“主”；“雅威”是较贴近学术重构读音的另一选择。
- issue: 是否把“离去”的方式具体化
  choice: 仅译“就离去了”
  alternative: 解释为云柱移开或神的临在撤去
  rationale: 本节动词本身只说“离去”，没有明说方式；正文不借上下文替原文补足，以保留其简洁和可能的神学张力。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。“向他们发怒”传达惯用义，脚注说明希伯来文的身体与热度意象；“就”体现两个连续叙事动词之间的推进关系。
