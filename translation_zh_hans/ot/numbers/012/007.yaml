source:
  edition: WLC
  text: לֹא כֵ֖ן עַבְדִּ֣/י מֹשֶׁ֑ה בְּ/כָל בֵּיתִ֖/י נֶאֱמָ֥ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: zh_hans
  text: 但我的仆人摩西不是这样；他在我的全家[a]中是忠信的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”也可理解为“家室”或“所属领域”。希伯来语的“家”不只指房屋建筑，也可指一个家庭、家族或其整体范围。
    reason: 说明希伯来语 בַּיִת 在此处可能具有的延伸意义，同时保留正文的“家”之意象。
lexical_decisions:
- source_word: לֹא כֵן
  choice: 不是这样
  rationale: 这是对上文所述方式的鲜明否定和对比；“不是这样”在现代汉语中自然，并保留原文简洁有力的纠正语气。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: עֶבֶד 可指奴隶或仆人，但此处是上帝对摩西的尊称，强调其受托服事的身份，而非受奴役状态。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בְּכָל בֵּיתִי
  choice: 在我的全家中
  rationale: 保留 בַּיִת 的“家”这一意象，同时以“全家”表达整个家庭、家室或所属领域；בְּ 直译为“在……中”，不额外解释为管理权。
- source_word: נֶאֱמָן
  choice: 忠信的
  rationale: נֶאֱמָן 表示可靠、可信和忠诚；“忠信”兼顾忠诚与可信，适合摩西在上帝面前受托的语境。
- source_word: הוּא
  choice: 他……是
  rationale: 独立代词明确强调摩西；中文以“他……是忠信的”自然表达其主语和判断功能。
theological_decisions:
- issue: “我的家”所指的范围及摩西在其中的角色
  choice: 正文保留“我的全家”这一比喻，不明确限定为建筑、家属、以色列民或摩西所管理的领域。
  alternative: 译作“我的整个家室中”“我所有的子民中”或“管理我的全家”。
  rationale: 原文使用“家”，其延伸意义可涵盖上帝的家室、群体或领域，但没有明说“管理”。保留这一意象可维持原文的开放性及其与其他经文的互文联系，避免过度解释摩西角色。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“但……不是这样”清楚承接上文的对比；“忠信”属于普通读者可理解的经文用语，并同时传达忠诚与可信。脚注标记紧随其所解释的“全家”。
