  text: אַל נָ֥א תְהִ֖י כַּ/מֵּ֑ת אֲשֶׁ֤ר בְּ/צֵאת/וֹ֙ מֵ/רֶ֣חֶם אִמּ֔/וֹ וַ/יֵּאָכֵ֖ל חֲצִ֥י בְשָׂרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: zh_hans
  text: 求你不要让她像一个死人[a]一样；他一出母腹，肉就已经被蚀去一半。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你不要让她像死胎一样；那死胎一出母腹，肉就已经被蚀去一半。”希伯来文把她比作出生时已经死去的人；有些译本在正文中明确译出死胎的意象。
    reason: 词义与意象的另一种明确表达
lexical_decisions:
- source_word: אַל נָא
  choice: 求你不要
  rationale: אַל表示禁止或否定请求，נָא加强恳求语气；“求你不要”自然传达亚伦急切的哀求。
- source_word: תְהִי
  choice: 让她……一样
  rationale: 这是阴性单数未完成式，在אַל之后表达否定愿望或请求；阴性所指是上下文中的米利暗。
- source_word: כַּמֵּת
  choice: 像那死去的人一样
  rationale: 按字面保留“像死人／死去的人”的比较，不在正文中直接限定为死胎，让后面的出生意象自行展开。
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: 一出母腹
  rationale: ב加不定词结构表示时间，“一……就／当……时”；简洁保留从母腹出来的鲜明画面。
- source_word: וַיֵּאָכֵל
  choice: 就被蚀去
  rationale: 该形式字面有“被吃掉、被吞噬”之意；在描述肉体毁坏时，“被蚀去”既保留被动和强烈画面，也比直译“被吃掉”更符合现代汉语。
- source_word: חֲצִי בְשָׂרוֹ
  choice: 肉身……一半
  rationale: בשר在此指实际的肉体；“肉身被蚀去了一半”自然呈现原文中一半肉体遭毁坏的可怖形象。
theological_decisions:
- issue: 阴性单数所指
  choice: 用“她”指米利暗
  alternative: 省略主语或译作“这人”
  rationale: 紧接上下文，亚伦是在为患病的米利暗恳求；明确译为“她”不增添教义解释。
- issue: 出生时已死的意象
  choice: 正文保留较宽泛的“死去的人”，脚注说明也可理解为死胎
  alternative: 正文直接译为“死胎”
  rationale: כַּמֵּת本身只说“像死者”，而后续从母腹出来的描述明显指向出生时死亡。正文保留词面的开放性，脚注交代更明确的语境理解。
translation_notes:
  register: 采用现代、庄重而易懂的恳求语气。“母腹”保留经文语体的凝练感；“被蚀去”传达肉体遭吞噬、毁坏的强烈意象，同时避免现代汉语中“肉被吃掉”可能造成的误解。
