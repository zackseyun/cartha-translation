revisions:
- from: 求你不要让她像那死去的人一样，一出母腹，肉身就被蚀去了一半。[a]
  to: 求你不要让她像一个死人[a]一样；他一出母腹，肉就已经被蚀去一半。
  rationale: 修订仅调整中文句法、指称清晰度和脚注锚点：正文仍按字面保留“像一个死人”，不将有争议或解释性的“死胎”提前写入正文；以“他”明确关系从句所修饰的对象，并用“肉”对应原文具体的בשר。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:43Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本保留了恳求语气、米利暗的阴性所指，以及出生时肉体毁坏的强烈比喻。不过“那死去的人”在现代汉语中指称不够自然，且其后“一出母腹”容易造成句法衔接不清。原文的关系从句明确修饰“死者”，宜在中文中显出该从句的主语关联。
  naturalness: “像那死去的人一样，一出母腹，肉身就被蚀去了一半”中，“一出母腹”的主语悬空；“肉身”也略偏抽象，原文此处是具体的“肉”。改为分号后的“他一出母腹，肉就已经被蚀去一半”，既保留原文刻意骇人的意象，也更通顺。
  terminology: “母腹”适合庄重经文语体；“蚀去”能恰当表达肉被吞噬／毁坏。“死人”比“死去的人”更简洁自然，但不在正文预先将כַּמֵּת限定为“死胎”。脚注保留“死胎”这一按上下文作出的明确化理解。
  issues:
  - severity: medium
    issue: 关系从句的主语在中文中不够明确
    rationale: 原文“其从母腹出来时，肉被蚀去一半”的描述修饰“像死人一样”中的该人。草稿将“一出母腹”直接逗号连接在主句后，中文读者容易误解为“她”出母腹，或感到主语悬空。
  - severity: low
    issue: “那死去的人”不够自然
    rationale: “死人”是现代汉语中对应“像死者／像一个死了的人”的常用表达；“那”在原文中无须特别体现，且会使措辞显得生硬。
  - severity: low
    issue: 脚注锚点位置过宽
    rationale: 脚注说明的是“死人”可按出生语境明确理解为“死胎”，锚点应紧随相关词语，方便读者对应。
