base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: zh_hans
  text: 于是，摩西向雅威呼求说：“神啊，求你医治她！求你了！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在“医治”前后各有一个表示恳求的语气词；译文以“求你”和“求你了”保留摩西祈求的迫切。
    reason: 说明原文重复的恳求语气词及其在自然汉语中的表达。
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: 呼求
  rationale: צעק表示强烈而急切的呼喊；这里是摩西向神发出的恳切祈求，“呼求”既保留力度，也符合现代汉语祷告语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文常用音译保留四字神名，而不以“主”这一称号代替。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出呼求的具体内容；译作“说”简洁自然。
- source_word: אֵל
  choice: 神啊
  rationale: אֵל在此作呼格；“神啊”自然表达直接呼唤。
- source_word: נָא…נָא
  choice: 求你……求你
  rationale: 两个נָא分别位于命令式动词前后，表达恳求和紧迫感；正文保留重复，以呈现原文短促、迫切的语气。
- source_word: רְפָא
  choice: 医治
  rationale: רפא的命令式在此指医治米利暗所受的病患；“医治”准确且符合经文语体。
- source_word: לָהּ
  choice: 她
  rationale: 阴性第三人称单数后缀指向米利暗，明确译为“她”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留其作为专名的性质，避免以称号“主”替代；“耶和华”是另一传统音译。
- issue: 两个נָא所表达的恳求
  choice: 正文保留两次“求你”
  alternative: 只译一次“求你”，在脚注说明重复
  rationale: 原文刻意重复恳求语气词，形成强烈而简短的代求。保留重复可避免削弱摩西祈求的迫切性。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“呼求”体现וַיִּצְעַק的强度；祷告末尾重复“求你”略显非常规，但有意保留希伯来文的急迫与短促。
