  text: וְ/הָ/אִ֥ישׁ מֹשֶׁ֖ה ענו מְאֹ֑ד מִ/כֹּל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: zh_hans
  text: 摩西这人极其谦和[a]，比地上的任何人都谦和。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谦和”也可译作“谦卑”或“温柔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הָ/אִישׁ מֹשֶׁה
  choice: 摩西这人
  rationale: 保留希伯来文“这人/那人摩西”的强调性表达，同时用自然的现代汉语语序呈现；句首וְ在此承接上下文，不必机械译成“并且”。
- source_word: ענו
  choice: 谦和
  rationale: 此处最自然地描述摩西谦卑温和、不自高的性情。“谦和”兼顾“谦卑”与“温柔”的语义，且不暗示软弱；“困苦”虽与相关词根的其他用法有关，却不合本句的性情描述。
- source_word: מְאֹד
  choice: 极其
  rationale: 准确表达强烈程度，比一般的“很”更能传达希伯来文的强调，同时仍属自然庄重的现代汉语。
- source_word: מִ/כֹּל הָאָדָם
  choice: 胜过……任何人
  rationale: מן与כֹּל构成比较，现代汉语以“胜过任何人”最为自然；אָדָם在这里泛指所有人，并非只指男性。
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: 地面上
  rationale: 保留希伯来语“在地面之上”的空间意象；较“全地”更贴近原文措辞，也符合现代汉语。
theological_decisions:
- issue: ענו所指的是性情谦卑温和，还是受苦、卑微的处境
  choice: 谦和
  alternative: 困苦／卑微
  rationale: 在本段摩西面对攻击却不自行辩护的语境中，形容其性情最为顺畅；但不把该词扩展成任何特定的神学美德体系。
- issue: הָאָדָם在比较句中的范围
  choice: 任何人
  alternative: 任何男人
  rationale: אָדָם在此为泛指人类个体的用法，比较范围包含所有人；译作“人”既准确又避免误限于男性。
- issue: 摩西自述自己极其谦和所形成的叙事张力
  choice: 直接保留原文陈述
  alternative: 通过释义说明为后人插入或替摩西辩护
  rationale: 经文本身没有交代作者层次或写作方式，翻译不应以解释消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“摩西这人”有意保留原文略带强调的名词结构；“地面上”保留希伯来语意象。正文中的[a]与脚注相对应。
