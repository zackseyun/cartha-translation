base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: zh_hans
  text: 云从帐幕上方移开了。看哪，米利暗患了严重的皮肤病[a]，像雪一样。亚伦转向米利暗，看哪，她患了严重的皮肤病。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“严重的皮肤病”的希伯来词，所指范围比现代医学所说的麻风病（汉森病）更广，也可指使人在礼仪上不洁的皮肤病症。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: 云
  rationale: 带定冠词，指本段语境中与耶和华临在相关的云；现代汉语用“云”自然明确。
- source_word: סָר
  choice: 移开了
  rationale: 该动词表示离开、移去或转离；“移开了”准确表达云从帐幕上方撤离。
- source_word: מֵעַל הָאֹהֶל
  choice: 从帐幕上方
  rationale: מֵעַל 表示从上方的位置离开；“帐幕”保留原文简洁措辞，不擅自扩写为“会幕”。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文突显眼前景象和惊异的语用力量，并在两处重复呈现。
- source_word: מְצֹרַעַת
  choice: 患了严重的皮肤病
  rationale: 该词所指范围比现代医学的麻风病（汉森病）更广；正文采用普通读者易懂且不造成医学误判的表达。
- source_word: כַּשָּׁלֶג
  choice: 像雪一样
  rationale: 贴近希伯来文简短比喻“如雪”，不在正文中额外补出“白”。
- source_word: וַיִּפֶן ... אֶל
  choice: 转向
  rationale: 准确表达亚伦朝米利暗转身或转过脸去的动作。
theological_decisions:
- issue: 米利暗所患疾病的性质
  choice: 译作“严重的皮肤病”
  alternative: 译作“麻风病”或“长了大麻风”
  rationale: 希伯来词 צָרַעַת 是古代礼仪与叙事范畴，不能无条件等同于现代医学的汉森病；采用较宽泛译法，避免把原文未作的医学界定强加进去。
- issue: “像雪一样”具体指什么
  choice: 保留开放式比喻
  alternative: 译作“白得像雪”
  rationale: 原文只说“像雪”，虽很可能突出外观的白色，却未明说；直译可保留原文的简洁和一定程度的含混。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”略带经文体色彩，用来保留 וְהִנֵּה 的突现与惊异效果。脚注标记置于正文第一处疾病描述之后，以说明相关希伯来词；不使用传统“长大麻风”，避免过时措辞及医学误解。
