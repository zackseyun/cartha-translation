id: NUM.12.2
reference: Numbers 12:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: zh_hans
  text: 他们说：“难道雅威果真只借着摩西说话吗？他不也借着我们说话吗？”[a]雅威听见了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“难道雅威果真只对摩西说话吗？他不也对我们说话吗？”这里的希伯来语介词既可指说话的对象，也可指传话的媒介。
    reason: 保留介词 בְּ 在此处可能表示受话者或媒介的真实歧义。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 该复数叙事动词承接上文并引出直接引语；现代汉语无需机械译出句首连接词。
- source_word: הֲרַק אַךְ
  choice: 难道……果真只……吗
  rationale: “难道”表达反问，“果真”和“只”共同传达原文两个限制、加强语气的成分。
- source_word: בְּמֹשֶׁה / בָּנוּ
  choice: 借着摩西／借着我们
  rationale: 介词 בְּ 在此可表示神说话所借的媒介；上下文涉及先知权柄，因此正文采用“借着”，同时用脚注保留“对……说话”的可能。
- source_word: דִּבֶּר
  choice: 说话
  rationale: 自然表达神的言说，并在两个平行问句中保持一致。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质。
- source_word: וַיִּשְׁמַע יְהוָה
  choice: 雅威听见了
  rationale: 原文没有明说宾语；汉语可自然省略，使所听见的是前述言论这一点由语境表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；正文采用较贴近学界通常重构读音 Yahweh 的“雅威”，而不以称号替代。
- issue: 介词 בְּ 表示受话者还是说话的媒介
  choice: 借着摩西／借着我们
  alternative: 对摩西／对我们
  rationale: 争议焦点是米利暗和亚伦是否也具有传达神言语的先知地位，故正文采用媒介义；但希伯来语介词本身容许受话者义，脚注予以保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“果真只”保留原文加强限制的反问语气；两个问句维持平行结构。脚注标记紧接相关引语，正文与脚注相互对应。
