base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: zh_hans
  text: 你们要把这头母牛交给祭司以利亚撒；他要把它带到营外；它要在他面前被宰杀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句的施事者没有明说。也可把末句动词的隐含主语理解为继续指以利亚撒，即“他要宰杀它”；不过“在他面前”也可表示宰杀是在以利亚撒在场时进行。
    reason: 原文末句使用第三人称阳性单数动词，却未明示施事者；其与“在他面前”的关系存在真实的句法解释空间。
lexical_decisions:
- source_word: וּנְתַתֶּם
  choice: 你们要把……交给
  rationale: 第二人称复数在律法指令中表达命令；“要”自然保留指令语气，“交给”准确表达 נתן 与间接宾语的关系。
- source_word: אֹתָהּ
  choice: 这母牛／母牛
  rationale: 阴性单数代词回指前文的红母牛。现代汉语不以代词标示阴性动物，明确说“母牛”既自然又避免指代不清。
- source_word: אֶל אֶלְעָזָר הַכֹּהֵן
  choice: 交给祭司以利亚撒
  rationale: 按现代汉语习惯将职衔置于人名前，保留专名和祭司身份。
- source_word: וְהוֹצִיא
  choice: 他要把母牛牵到
  rationale: יצא 的使役形表示使之出去。对象是活的母牛，“牵到”比笼统的“带到”更具体自然，同时保留使役意义。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 营外
  rationale: 简洁自然地表达“到营地以外”，方向义已由“牵到”体现。
- source_word: וְשָׁחַט
  choice: 母牛要……被宰杀
  rationale: 原文动词为第三人称阳性单数，但主语未明说。采用不指出施行者的被动表达，避免武断认定以利亚撒亲自宰杀。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 忠实保留“在他面前／在他在场时”的含义，并自然指向以利亚撒。
theological_decisions:
- issue: 末句宰杀者的身份
  choice: 用“母牛要在他面前被宰杀”不明说宰杀者
  alternative: 把以利亚撒理解为连续的隐含主语：“他要……宰杀母牛”
  rationale: 动词本身带第三人称阳性单数，但没有明示名词主语；“在他面前”又可能表明以利亚撒是现场监督者而非施行动作的人。正文不替原文消除这一张力，另以脚注说明另一种语法理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们要”符合律法指令语体；以“母牛”代替连续使用“它”，使指代清楚。末句使用自然的无施事被动句，保留原文关于宰杀者身份的歧义。
