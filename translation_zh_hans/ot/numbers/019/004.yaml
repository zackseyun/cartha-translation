  terminology: “祭司以利亚撒”“会幕”“弹洒”“七次”均恰当。“那母牛”明确回指上文的母牛，而不在本节额外加入“红”这一未明说的限定。脚注应相应说明“会幕前面”也可译为“会幕前”。
