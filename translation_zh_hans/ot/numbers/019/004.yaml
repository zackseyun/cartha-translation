base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: zh_hans
  text: 祭司以利亚撒要用手指蘸取那母牛的一些血，向会幕前面弹洒七次。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向会幕前”。原文短语强调弹洒的方向是朝着会幕的前方。
    reason: 词义和空间关系存在可译差异。
lexical_decisions:
- source_word: וְלָקַח
  choice: 要……蘸取
  rationale: 在礼仪程序中，连接词加完成式表达接续的指令性动作；汉语以“要”自然呈现，并用“蘸取”结合指头与血的具体动作。
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒
  rationale: 按现代汉语习惯将职衔置于人名前，同时保留其祭司身份。
- source_word: מִדָּמָהּ
  choice: 一些母牛的血
  rationale: 介词מִן在此具有部分义；“母牛”承接上文指代，避免汉语“它的血”指向不清。希伯来文第二次出现该词，但汉语将其融入“弹洒七次”，以免累赘。
- source_word: בְּאֶצְבָּעוֹ
  choice: 用指头
  rationale: 介词בְּ在此自然表示动作的工具；“用指头”准确而通顺，不额外断定血先停留在指头上。
- source_word: וְהִזָּה
  choice: 弹洒
  rationale: נזה指祭司礼仪中以指头将血或水弹出、洒出；“弹洒”比泛指的“洒”更具体，也符合本句用指头施行的动作。
- source_word: אֶל נֹכַח פְּנֵי
  choice: 朝向……的正面
  rationale: 保留该短语的方向性和空间意象，表明动作朝向会幕前面，并不表示进入会幕。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: “会幕”是现代中文圣经语境中简洁、通行的圣所名称，对应“相会之帐幕”。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七次
  rationale: 直接保留明确的礼仪次数。
theological_decisions:
- issue: 弹血相对于会幕的位置与方向
  choice: 朝向会幕的正面
  alternative: 在会幕前
  rationale: 原文强调朝向会幕正面这一方向；“在会幕前”可能只表达祭司所在位置，弱化弹洒方向，因此将另一读法置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“弹洒”体现用指头施行的祭礼动作；“母牛”承接本章上文的红母牛。脚注标记已置于相关短语之后。
