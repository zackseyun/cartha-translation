  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: zh_hans
  text: 但那沾染了不洁、却不洁净自己的人，必从会众中被剪除[a]，因为他玷污了耶和华的圣所。除污水没有洒在他身上[b]；他仍是不洁的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可直译“那魂（或‘那生命’）必被剪除”。这里的希伯来法律套语通常指整个人，并非只指非物质的灵魂。
    reason: lexical_alternative
  - marker: b
    text: 或译“除不洁之水”；传统译法为“分别之水”。这是指本章所配制、用来除去不洁的水。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: 人
  rationale: 此处虽为阳性单数，却泛指任何处于该情形的以色列人；现代汉语用“人”自然且准确。
- source_word: יִטְמָא
  choice: 染了不洁
  rationale: 表达进入礼仪性不洁状态，而非主动犯下道德罪恶。
- source_word: יִתְחַטָּא
  choice: 洁净自己
  rationale: 在本章礼仪语境中指接受除污洁净，不取通常的“犯罪”义。
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: 必……被剪除
  rationale: נפש在此法律套语中指整个人；“剪除”保留原文司法与盟约性用语，不擅自说明执行方式。
- source_word: מִתּוֹךְ הַקָּהָל
  choice: 从会众中
  rationale: קהל指立约群体；“会众”兼顾群体与宗教礼仪语境。
- source_word: מִקְדַּשׁ יְהוָה
  choice: 耶和华的圣所
  rationale: מקדש指神圣居所或圣域；按原文直接保留神名“耶和华”。
- source_word: טִמֵּא
  choice: 玷污了
  rationale: 此处为使圣所陷于不洁的使役含义；“玷污”自然传达礼仪上的严重性。
- source_word: מֵי נִדָּה
  choice: 除污水
  rationale: 指本章为除去尸体不洁而配制的礼仪用水；“除污水”简洁表达其用途，同时脚注保留较直译的可能。
- source_word: זֹרַק עָלָיו
  choice: 洒在他身上
  rationale: זרק在礼仪语境中指将液体洒上；此译符合现代汉语表达。
- source_word: טָמֵא הוּא
  choice: 他是不洁的
  rationale: 直接保留原文无系词判断句所宣告的法律与礼仪状态，不额外加入“仍然”。
theological_decisions:
- issue: “被剪除”所指惩罚的性质
  choice: 保留“必从会众中被剪除”的惯用表达
  alternative: 逐出群体；处死；由上帝直接施行审判
  rationale: 希伯来文在本节没有明确说明惩罚如何执行；保留原文张力，避免把有争议的解释写入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“染了不洁”“洁净自己”“除污水”维持本章礼仪语境；句末“他是不洁的”保留原文简短、有判定意味的语气。
