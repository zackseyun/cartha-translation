revisions:
- from: 要为不洁净的人取一些洁净祭牲烧成的尘末[a]，放在器皿里，再把活水[b]倒在上面。
  to: 要为不洁净的人取些洁净祭牲焚烧后的尘末[a]，把活水[b]倒在器皿里的尘末上。
  rationale: 修订仅改善汉语表达与动作关系的清晰度：“焚烧后的尘末”更自然地表达原文构词关系；“器皿里的尘末上”明确水加在尘末上且置于器皿中。保留原文的部分义、礼仪性“不洁净”、可有不同功能侧重的חַטָּאת，以及“活水”的字面表达和说明。
