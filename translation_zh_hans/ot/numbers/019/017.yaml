  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ לַ/טָּמֵ֔א מֵ/עֲפַ֖ר שְׂרֵפַ֣ת הַֽ/חַטָּ֑את וְ/נָתַ֥ן עָלָ֛י/ו מַ֥יִם חַיִּ֖ים אֶל כֶּֽלִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: zh_hans
  text: 要为不洁净的人取些洁净祭牲焚烧后的尘末[a]，把活水[b]倒在器皿里的尘末上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赎罪祭牲焚烧后的灰。”原文此处用“尘土、尘末”（עָפָר）一词，并非通常表示“灰”的词；חַטָּאת在祭司礼仪语境中可指“洁净祭”，传统上也常译为“赎罪祭”。
    reason: 保留עָפָר的词汇特点，并说明חַטָּאת在此礼仪语境中的译法选择及传统译法。
  - marker: b
    text: “活水”指泉水或来自流动水源的水。
    reason: 解释希伯来语习语מַיִם חַיִּים在本条例中的具体所指，同时保留字面措辞。
lexical_decisions:
- source_word: לָקְחוּ
  choice: 要……取
  rationale: 该形式在律法指令中具有命令或规定的语气；用“要……取”自然传达其法律性要求，并保留复数施事者不明说的特点。
- source_word: לַטָּמֵא
  choice: 为不洁净的人
  rationale: 介词加定冠词化形容词指处于礼仪性不洁状态的人；“不洁净”符合本段洁净条例的语境。
- source_word: מֵעֲפַר
  choice: 一些……尘末
  rationale: עָפָר本义为尘土、粉尘状物，并非通常表示“灰”的词；“一些”表达介词מִן的部分义，“尘末”兼顾物质形态和中文自然度。
- source_word: שְׂרֵפַת הַחַטָּאת
  choice: 洁净祭牲烧成的
  rationale: שְׂרֵפָה表示焚烧，חַטָּאת在祭司礼仪语境中可指发挥洁净作用的祭物；加“牲”说明此处承接被焚烧的红母牛，避免把抽象的“祭”说成被烧之物。
- source_word: וְנָתַן
  choice: 再把……倒
  rationale: 希伯来文由复数动词转为阳性单数，常可作不定施事者理解；中文省略主语可保留这种不确定性。“倒”贴合将水加在尘末之上的动作。
- source_word: עָלָיו
  choice: 在上面
  rationale: 代词最自然地回指前述尘末；“倒在上面”清楚表达水加于其上的关系。
- source_word: מַיִם חַיִּים
  choice: 活水
  rationale: 直译为“活水”，通常指来自泉源或流动水源的水；中文“活水”自然且保留该词组在圣经中的意象与互文。
- source_word: אֶל כֶּלִי
  choice: 放在器皿里
  rationale: 介词可表达进入器皿；按希伯来语词序，地点短语紧随加水动作，但整句所描述的结果是尘末和水置于器皿中。中文前置“放在器皿里”可避免误解为把水倒到器皿外的尘末上。
theological_decisions:
- issue: 礼仪洁净语境中חַטָּאת的译法
  choice: 洁净祭牲
  alternative: 赎罪祭牲
  rationale: 本节处理的是由接触死尸而来的礼仪性不洁，חַטָּאת在此可按祭物的洁净功能理解。译作“洁净祭牲”避免把重点限定为道德罪责；传统的“赎罪祭牲”仍属可能，列于脚注。
- issue: מַיִם חַיִּים的表达
  choice: 活水
  alternative: 流动的水／新鲜的水
  rationale: 保留希伯来文“活的水”的形象，同时脚注说明它在本条例中实际指泉水或流动水源的水，不把字面意象与具体所指混为一谈。
- issue: 单复数施事者的转换
  choice: 中文不明说施事者
  alternative: 他们……他／有人
  rationale: 原文先用复数“他们要取”，后用单数“他要放”，可能是律法文体中的不定施事转换。中文省略主语既自然，也不武断认定是同一个人或不同的人。
translation_notes:
  register: 采用现代、庄重而易懂的律法叙述语体。“不洁净”“器皿”“活水”保留经文的礼仪色彩；句法按中文习惯调整，并以省略主语的方式保留原文施事者由复数转为单数所产生的含混。
