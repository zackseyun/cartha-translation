review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达了为礼仪上不洁净者取焚烧物的尘末，并将活水加在其上的程序；“不洁净”“活水”“器皿”也与原文礼仪语境相称。不过，“洁净祭牲烧成的尘末”在汉语中容易被理解为祭牲本身被“烧成尘末”，表达略显生硬；将其改为“洁净祭牲焚烧后的尘末”可更清楚对应“洁净祭的焚烧之尘末”。此外，把器皿位置明确纳入加水动作，可更贴近原文的“把活水加在其上，入于器皿中”。
  naturalness: 原句的动作次序基本可懂，但“取……尘末，放在器皿里，再把活水倒在上面”使“放在器皿里”的受事需由读者自行补足，且“烧成的尘末”不够自然。改为“取些……焚烧后的尘末，把活水倒在器皿里的尘末上”更符合现代汉语，程序关系也更明确。
  terminology: “不洁净”适合礼仪不洁语境；“活水”保留原文措辞并由脚注解释其所指，处理良好。חטאת 可在此译为“洁净祭”，但为避免把“祭”抽象化为可焚烧之物，正文采用“洁净祭牲”，脚注保留传统“赎罪祭牲”的可行译法。
  issues:
  - severity: medium
    issue: “洁净祭牲烧成的尘末”搭配生硬，且“烧成”可能造成物质结果不够清楚的印象。
    rationale: שְׂרֵפַת הַחַטָּאת 是“洁净祭（牲）的焚烧”这一构词关系；中文以“洁净祭牲焚烧后的尘末”表达更自然、清楚，且仍保留 עָפָר 并非通常“灰”的词汇特点。
  - severity: low
    issue: “放在器皿里”与“倒在上面”分列，器皿与加水动作的关系略不明确。
    rationale: 原文的 אֶל־כֶּלִי 紧随“把活水加在其上”的动作。改为“把活水倒在器皿里的尘末上”明确尘末和水均在器皿中，不改变程序含义。
