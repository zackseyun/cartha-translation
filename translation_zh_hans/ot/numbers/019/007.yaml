base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/007.yaml
  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: zh_hans
  text: 然后，祭司要洗衣服，用水洗身；之后可以进入营地[a]，但祭司仍不洁净，直到晚上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“之后要进入营地。”希伯来语也可理解为完成规定的洗濯之后获准重新入营。
    reason: lexical_alternative
  - marker: b
    text: 这里的“不洁净”指礼仪上的不洁净，并不一定表示个人犯罪或道德过错。
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: 要洗净衣服
  rationale: כּבס 的 Piel 形在此指洗涤衣物；在礼仪法规的程序语境中用“要”自然表达规定，且“洗净衣服”符合现代汉语。
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: 用水洗身
  rationale: בשר 在此指人的身体，不宜机械译作“肉体”；“用水洗身”简洁自然，也保留了洗濯全身的礼仪动作。
- source_word: וְאַחַר
  choice: 之后
  rationale: 明确标示完成洗濯以后发生的下一步。
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: 可以进入营地
  rationale: 未完成体在此程序语境中可理解为准许洗濯后重新入营；“可以”表达许可，但脚注保留直陈式理解。
- source_word: וְטָמֵא
  choice: 仍不洁净
  rationale: 这里描述持续到晚上的礼仪状态；“仍”清楚显示洗濯和入营并未立刻终止该状态。
- source_word: עַד הָעָרֶב
  choice: 直到晚上
  rationale: 现代汉语中自然、准确地表达该状态持续的时间界限。
theological_decisions:
- issue: 不洁净的性质
  choice: 保留礼仪性“不洁净”的状态用语
  alternative: 理解为个人犯罪或道德污秽
  rationale: 民数记19章的上下文涉及洁净礼仪及暂时的礼仪状态；原文 טמא 本身并不表示祭司在道德上有罪。
- issue: 洗身后入营的语气
  choice: 译为许可性的“可以进入”
  alternative: 译为直陈或规定性的“要进入／将进入”
  rationale: 上下文支持洗身后获准重新入营，但希伯来语 יָבֹא 本身没有独立的“可以”一词，因此以脚注保留形式上的另一种译法。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述。“洗净衣服／用水洗身”避免生硬重复；“营地”贴近当代普通读者的表达。脚注标记均置于与其内容直接相关的正文位置。
