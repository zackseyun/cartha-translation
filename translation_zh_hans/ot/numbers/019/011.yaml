  text: הַ/נֹּגֵ֥עַ בְּ/מֵ֖ת לְ/כָל נֶ֣פֶשׁ אָדָ֑ם וְ/טָמֵ֖א שִׁבְעַ֥ת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/011.yaml
  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: zh_hans
  text: 凡触碰任何人的尸体[a][b]的，必不洁净七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尸体”或译“死人”；原文直译为“死者”。
    reason: lexical_alternative
  - marker: b
    text: “任何人”原文为“任何人的性命（即人）”，意指任何人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: 凡触碰……的
  rationale: 带定冠词的分词在此作名词性、泛指用法，表示凡处于这种情形的人；“凡……的”自然地保留律法条文的普遍效力。
- source_word: בְּמֵת
  choice: 尸体
  rationale: מֵת字面指死者；在“触碰”的语境中，“尸体”清楚、自然地表达具体的礼仪情境，同时脚注保留“死人”的直译可能。
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: 任何人的
  rationale: 该短语限定所触碰的是任何人类死者，而非动物尸体；“任何人”保留泛指范围，也不误加男性限定。
- source_word: וְטָמֵא
  choice: 必不洁净
  rationale: 连接词加完成式在律法语境中表达随之而来的确定结果；“必不洁净”兼顾法律语气与现代汉语的自然表达。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接表达不洁净状态持续的时段。
theological_decisions:
- issue: אָדָם在泛指律法语境中的译法
  choice: 人
  alternative: 男人；人类
  rationale: 此处אָדָם泛指任何人，并非特指男性；译作“人”准确涵盖律法所指范围，且不引入性别限定。
- issue: טָמֵא所表达的不洁性质
  choice: 不洁净
  alternative: 污秽
  rationale: 本节处于洁净礼仪条例中，“不洁净”保留礼仪状态这一含义，避免“污秽”被误解为道德败坏。
translation_notes:
  register: 采用现代、庄重而易懂的律法体。“凡……的，必……”体现普遍性与确定后果；以“不洁净”维持民数记礼仪术语的一致性。
