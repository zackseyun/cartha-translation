base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: zh_hans
  text: “这是耶和华所吩咐的律法条例：你要告诉以色列人，叫他们给你带来一头红母牛；这母牛必须完整无缺，身上没有残疾，也从未负过轭。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: 律法条例
  rationale: חֻקָּה 指规定、条例，תּוֹרָה 在此指上帝所颁的训令或律法；合译为“律法条例”，既保留两个名词的关系，也符合现代汉语。
- source_word: פָרָה אֲדֻמָּה
  choice: 纯红的母牛
  rationale: פָרָה 是母牛，אֲדֻמָּה 是红色；“纯红”结合后文的完整要求，简明表达此祭牲的颜色特征。
- source_word: תְּמִימָה
  choice: 完好无缺
  rationale: 该词可指完整、健全或无瑕；这里描述祭牲资格，译作“完好无缺”自然且不把它误解为道德意义的完美。
- source_word: מוּם
  choice: 残疾
  rationale: 指祭牲身体上的缺陷或瑕疵；“没有残疾”与前面的“完好无缺”共同保留原文近义叠加。
- source_word: עֹל
  choice: 轭
  rationale: 指加在役畜身上的轭；“从未负过轭”准确表达该母牛从未被用于负重劳作。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”，明确呈现原文的专有神名，同时不增添宗派性解释。
- issue: תְּמִימָה 与 מוּם 的关系
  choice: 保留“完好无缺，没有残疾”的叠加表达
  alternative: 合并为“没有任何残缺”
  rationale: 原文先用积极形容词，再以关系从句否定缺陷；保留两层措辞可呈现原文强调，不将二者静默合并。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“是这样”引出条例内容；将连续的希伯来语关系从句调整为自然汉语，但保留各项资格条件及其强调次序。
