base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/005.yaml
  text: And he shall burn the cow before his eyes; its hide[a], its flesh, its blood, along with its dung, he shall burn.
translation:
  language: zh_hans
  text: 要在他眼前把母牛焚烧；母牛的皮、肉、血，连同粪，都要焚烧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׂרַף
  choice: 要……焚烧
  rationale: 该形式在礼仪法规的连续指令中表达规定或义务；用“要”体现规范语气，并以“焚烧”准确表达以火烧尽。
- source_word: הַפָּרָה
  choice: 母牛
  rationale: פָּרָה指雌性牛，并不必然强调尚未生育或特定年龄；“母牛”在现代汉语中清楚自然，也符合上下文所指的红色雌牛。
- source_word: לְעֵינָיו
  choice: 在他眼前
  rationale: 保留希伯来语“在其眼目之前”的生动表达，意思是在他亲眼看见、监督之下，同时不将代词所指明说出来。
- source_word: עֹרָהּ
  choice: 母牛的皮
  rationale: עוֹר指动物的皮；以“母牛的”明确后续各项均属于该牛，符合汉语表达。
- source_word: בְּשָׂרָהּ
  choice: 肉
  rationale: בָּשָׂר在此指牛的肉体或肉；“肉”在动物焚烧的语境中直接自然。
- source_word: דָּמָהּ
  choice: 血
  rationale: דָּם直译为“血”；与皮、肉并列。
- source_word: עַל פִּרְשָׁהּ
  choice: 连同粪
  rationale: פֶּרֶשׁ具体指粪或排泄物；此处עַל表达附加、连同之意。“连同粪”准确说明粪也包括在焚烧之物内。
- source_word: יִשְׂרֹף
  choice: 都要焚烧
  rationale: 未完成式在法规中表达必须采取的行动；“都”收束前面的清单，“要焚烧”保留原文重复动词所形成的强调。
