base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: zh_hans
  text: 这要作他们永远的条例：洒除污秽之水[a]的人要洗衣服；触碰除污秽之水的人必不洁净，直到傍晚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为除去污秽的水”；直译“污秽之水”。传统上译作“分别水”。
    reason: 保留 מֵי הַנִּדָּה 的字面属格关系、在本章中的礼仪用途，以及传统译法。
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְחֻקַּת עוֹלָם
  choice: 这要作他们永远的条例
  rationale: 按上下文补出“这”，承接本段规定；“永远的条例”保留法律语体和持续约束力。
- source_word: וּמַזֵּה
  choice: 洒……的人
  rationale: 将作名词用的分词译为执行礼仪动作的人，表达自然，也不额外限定其身份。
- source_word: מֵי הַנִּדָּה
  choice: 除污水
  rationale: 该词组直译近于“污秽之水”，在本章指为解除尸体所致礼仪不洁而配制的水。“除污水”简洁地表达其礼仪用途，同时以脚注保留原文结构的歧义。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 要洗衣服
  rationale: 准确传达洗涤衣物的规定，采用现代汉语常用表达。
- source_word: וְהַנֹּגֵעַ
  choice: 触碰……的人
  rationale: 与前一作名词用的分词保持平行；“触碰”清楚表达实际接触。
- source_word: יִטְמָא
  choice: 必不洁净
  rationale: 使用礼仪洁净范畴的术语，不将其误解为道德上的罪责。
- source_word: עַד הָעָרֶב
  choice: 直到晚上
  rationale: 自然表达不洁状态持续至当日晚间这一时间界限。
theological_decisions:
- issue: 民数记十九章礼仪洁净用语的处理
  choice: 采用“不洁净”和“除污水”，按礼仪意义直译
  alternative: 将其解释为道德污秽，或采用较强解释性的“洁净水”
  rationale: 本节讨论接触死尸所致的礼仪不洁，不直接论述道德罪责；译文保留这一范畴，并避免把这种水本身简单称为洁净之水。
- issue: מֵי הַנִּדָּה 所含关系的歧义
  choice: 正文译“除污水”，脚注列出较直译的表达
  alternative: 正文译“污秽之水”或“除去污秽的水”
  rationale: 希伯来语属格关系可按字面理解，也可依本章功能解释。正文兼顾可懂性，脚注保留原文措辞及可能译法，不将歧义完全消除。
translation_notes:
  register: 采用现代、庄重而清楚的法规语体；用冒号引出条例内容，以分号呈现两个平行规定。脚注标记置于该术语首次出现处。
