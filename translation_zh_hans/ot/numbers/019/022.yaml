  text: וְ/כֹ֛ל אֲשֶׁר יִגַּע בּ֥/וֹ הַ/טָּמֵ֖א יִטְמָ֑א וְ/הַ/נֶּ֥פֶשׁ הַ/נֹּגַ֖עַת תִּטְמָ֥א עַד הָ/עָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/022.yaml
  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: zh_hans
  text: 凡不洁净的人所接触的一切东西，都成为不洁净；接触这些东西的人[a]也必不洁净，直到晚上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“接触的人”，没有明说所接触的对象；此处的“这些东西”是按上文语境补出的。“人”原文为נֶפֶשׁ（nephesh），字面可指“生命”或“性命”，这里指一个人。
    reason: 说明原文第二分句省略宾语，并交代נֶפֶשׁ在本节中的语义。
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: 凡……的，都
  rationale: כֹל与关系词אֲשֶׁר构成概括性表达；用“凡……的，都”自然保留其涵盖一切的语气。
- source_word: יִגַּע בּוֹ
  choice: 所触碰的
  rationale: נגע表示触摸或接触；“触碰”既符合现代汉语，也保留礼仪条例中因接触而传递不洁净的含义。
- source_word: הַטָּמֵא
  choice: 不洁净的人
  rationale: 带定冠词的形容词在此作名词用，指处于礼仪性不洁净状态的人；补出“人”使汉语清楚自然。
- source_word: יִטְמָא
  choice: 成为不洁净
  rationale: 此动词表示因接触而进入不洁净状态；“成为”体现状态的改变。
- source_word: וְהַנֶּפֶשׁ
  choice: 人
  rationale: נֶפֶשׁ字面义域包括生命、性命和人；在这类法律语境中指完整的个人，译作“人”最准确自然。
- source_word: הַנֹּגַעַת
  choice: 触碰那东西的人
  rationale: 分词修饰נֶפֶשׁ；希伯来文未明说触碰的宾语，汉语按上句语境补作“那东西”，同时以脚注说明。
- source_word: תִּטְמָא עַד הָעָרֶב
  choice: 也必不洁净，直到晚上
  rationale: 保留法律后果的确定语气和不洁净状态持续至晚上的时限。
theological_decisions:
- issue: טמא所表达的不洁净性质
  choice: 译作“不洁净”
  alternative: “污秽”或“有罪”
  rationale: 本节描述因接触而传递的礼仪性不洁净，并未断言道德罪责；“不洁净”可避免把礼仪状态误解为道德定罪。
- issue: 第二分句未明说的触碰对象
  choice: 正文按语境译为“那东西”，并用脚注说明原文省略宾语
  alternative: 直译为“触碰的人”
  rationale: 希伯来文仅作“触碰的人”，对象须由上文推知。正文补足对象使现代汉语清楚，但脚注保留原文的省略与潜在歧义。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“凡……的，都”呈现概括性规定；“必……直到晚上”保留确定的法律后果。避免用“有罪”等带有道德定罪色彩的措辞。
