base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: zh_hans
  text: 焚烧它的人要用水洗衣服，并用水洗身[a]；他必不洁净直到晚上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用水”两处，原文直译均为“在水中”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“不洁净”指礼仪上的不洁净，并不必然表示有道德罪责。
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף אֹתָהּ
  choice: 焚烧它的人
  rationale: 带定冠词的分词作名词使用，指执行焚烧的人；阴性单数宾语代词回指前文的母牛，译为“它”既自然，也保留原文的代词衔接。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 要用水洗衣服
  rationale: 未完成式在礼仪条例中表达规定；“要”自然传达规范性要求。“衣服”是בְּגָדִים在现代汉语中的常用表达。
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: 也要用水洗身
  rationale: רחץ用于身体的清洗，与前句表示洗衣的כבס形成词义区别；בשר在此指人的身体，译作“洗身”简洁自然。
- source_word: בַּמַּיִם
  choice: 用水
  rationale: 介词ב加定冠词，形式上可直译为“在水中”，但在洗衣、洗身的汉语语境中，“用水”最自然，并适用于本节两处重复表达。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: 他要不洁净到晚上
  rationale: טמא在祭司礼仪条例中表示不洁净的礼仪状态；“到晚上”准确表达该状态延续至עַד הָעָרֶב所指的时限，不把它进一步解释为日落。
theological_decisions:
- issue: 礼仪性不洁术语的表达
  choice: 不洁净
  alternative: 在礼仪上不洁净
  rationale: 原文טמא在本段指礼仪状态，不必然表示道德罪责。正文采用简洁且通行的“不洁净”，并以脚注说明其礼仪含义，避免在正文中加入原文没有明说的限定语。
translation_notes:
  register: 采用现代、庄重而易懂的条例性表达。“要”传达礼仪法规的规范语气；两次“用水”保留原文的重复结构。“洗衣服”与“洗身”体现原文洗涤衣物和清洗身体所用动词的区别。
