base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: zh_hans
  text: “这是律法：若有人死在帐篷里，凡进入那帐篷的，以及凡在帐篷里的[a]，都必不洁净七天。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“帐篷里所有的人或物。”希伯来语这一表达可以泛指人或物；但它与前面的“凡进入那帐篷的”平行，而且下一节另行提到器皿，因此这里较可能是指帐篷里的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: 这是律法
  rationale: תּוֹרָה在此引出有关尸体所致不洁净的约束性条例；“律法”简洁庄重，也符合本段的礼仪法规语境。
- source_word: אָדָם כִּי יָמוּת
  choice: 若有人死
  rationale: אָדָם在此为泛指，现代汉语用“有人”自然且不限定性别；כִּי引出法规中的情形，“若”符合汉语法律表述，也保留条件性。
- source_word: בְּאֹהֶל
  choice: 在帐篷里
  rationale: 首次出现的אֹהֶל无定冠词，提出一个一般情境；汉语无需另加“一座”也能自然表达泛指。
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: 凡进入那帐篷的
  rationale: 分词הַבָּא在כָּל之后表示所有进入者；“凡……的”符合现代汉语法规语体。“那帐篷”回指前面所说的帐篷。
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: 以及凡在帐篷里的
  rationale: אֲשֶׁר本身可泛指人或物。与前一分句平行及单数谓语较支持指在场的人，但原文仍有较宽泛的可能，因此正文采用可保留一定开放性的汉语表达，并加注说明。
- source_word: יִטְמָא
  choice: 都要不洁净
  rationale: 在礼仪洁净法规中，טמא表示处于礼仪上的不洁净状态；“要不洁净”清楚表达法规所规定的结果，而非一般卫生意义上的肮脏。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接表达原文所规定的不洁净期限。
theological_decisions:
- issue: “凡在帐篷里的”是仅指人，还是也包括物品
  choice: 正文采用“凡在帐篷里的”，不补出“人”或“物”，并以脚注说明歧义
  alternative: 译为“凡在帐篷里的人”或“帐篷里的一切”
  rationale: 希伯来语כָּל אֲשֶׁר可宽泛地指“凡……的／一切……的”。上下文的平行结构较支持指人，而下一节另论器皿；不过正文不宜完全消除原文的宽泛可能。
translation_notes:
  register: 采用现代、庄重而清楚的法规语体。“不洁净”作为礼仪术语保留民数记洁净条例的概念；句式以“凡……都……”呈现原文的普遍适用范围。
