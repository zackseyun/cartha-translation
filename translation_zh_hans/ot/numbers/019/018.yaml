id: NUM.19.18
reference: Numbers 19:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לָקַ֨ח אֵז֜וֹב וְ/טָבַ֣ל בַּ/מַּיִם֮ אִ֣ישׁ טָהוֹר֒ וְ/הִזָּ֤ה עַל הָ/אֹ֨הֶל֙ וְ/עַל כָּל הַ/כֵּלִ֔ים וְ/עַל הַ/נְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ שָׁ֑ם וְ/עַל הַ/נֹּגֵ֗עַ בַּ/עֶ֨צֶם֙ א֣וֹ בֶֽ/חָלָ֔ל א֥וֹ בַ/מֵּ֖ת א֥וֹ בַ/קָּֽבֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: zh_hans
  text: 要有一个洁净的人拿牛膝草蘸在那水里，把水洒在帐棚上、所有器具上、当时在那里的人身上，也洒在那摸过骨头、被杀之人[a]、死人或坟墓的人身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被杀之人”指遭暴力杀死的人；原文用词与后面的泛称“死人”不同。也可译作“被杀者的尸体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵזוֹב
  choice: 牛膝草
  rationale: 这是礼仪洁净经文中惯用的植物名称；保留传统译名，同时不把它泛化为普通枝条。
- source_word: בַּמַּיִם
  choice: 在那水里
  rationale: 希伯来文带定冠词，指向上下文已经制备的除污水，因此用“那水”体现其特指性。
- source_word: אִישׁ טָהוֹר
  choice: 一个洁净的人
  rationale: “洁净”准确体现礼仪状态而非道德品质；“人”在现代汉语中自然，并未改变原文单数个体的含义。
- source_word: וְהִזָּה
  choice: 把水洒在
  rationale: “洒”是中文礼仪语境中自然明确的表达；补出宾语“水”使动作关系清楚，其所指来自前文。
- source_word: הָאֹהֶל
  choice: 帐棚
  rationale: 本段所指是发生死亡事件的居住帐棚，并非会幕；“帐棚”既准确又符合圣经叙事语域。
- source_word: הַכֵּלִים
  choice: 所有器具
  rationale: כְּלִי 可泛指器皿、用具或物件；“器具”保留其宽泛范围，也符合现代汉语。
- source_word: הַנְּפָשׁוֹת
  choice: 当时在那里的人
  rationale: נֶפֶשׁ 此处指在帐棚内的人员，而非抽象的“灵魂”；译作“人”避免误导。
- source_word: הַנֹּגֵעַ
  choice: 那摸过……的人
  rationale: 将实体化分词译为具体受影响者，并用“摸过”自然表达此前导致不洁的接触。
- source_word: בָּעֶצֶם
  choice: 骨头
  rationale: 上下文明确是会造成尸体不洁的人骨；中文不必机械表现希伯来文定冠词。
- source_word: בֶחָלָל
  choice: 被杀之人
  rationale: חָלָל 特指遭暴力杀死者；此译保留它与随后泛指死者的 מֵת 之间的词义区别。
- source_word: בַמֵּת
  choice: 死人
  rationale: מֵת 泛指死者，范围比 חָלָל 更广；“死人”简洁自然，并保留两者差别。
- source_word: בַקָּבֶר
  choice: 坟墓
  rationale: 直接表达埋葬死者之处，是现代汉语中最自然的对应词。
theological_decisions:
- issue: 礼仪洁净术语
  choice: 洁净
  alternative: 清洁／纯洁
  rationale: 本节讨论因接触死亡而产生的礼仪不洁，并非道德品格；“洁净”可保留《民数记》的礼仪框架。
- issue: אִישׁ 的性别表达
  choice: 一个洁净的人
  alternative: 一个洁净的男人
  rationale: אִישׁ 为阳性单数，但在此句中核心要求是执行者处于礼仪洁净状态。现代汉语“人”可自然指称单个个体，且不额外断定这项任务仅限男性。
- issue: חָלָל 与 מֵת 的区别
  choice: 被杀之人／死人
  alternative: 尸体／死人
  rationale: 分别翻译可保留原文在暴力死亡者与一般死者之间的语义张力，不把两个术语合并。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“要有……拿……洒……”保留律例式指令语气；通过重复“洒在”澄清长串受词关系。
