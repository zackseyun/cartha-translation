  text: וְ/אָסַ֣ף אִ֣ישׁ טָה֗וֹר אֵ֚ת אֵ֣פֶר הַ/פָּרָ֔ה וְ/הִנִּ֛יחַ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה בְּ/מָק֣וֹם טָה֑וֹר וְ֠/הָיְתָה לַ/עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל לְ/מִשְׁמֶ֛רֶת לְ/מֵ֥י נִדָּ֖ה חַטָּ֥את הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: zh_hans
  text: 要有一个洁净的人收集母牛的灰，放在营外洁净的地方[a]；这灰要为以色列会众留存，供制备除污秽之水[b]使用；这是赎罪祭[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里两处的“洁净”都指礼仪上的洁净。
    reason: contextual_clarification
  - marker: b
    text: 直译可作“污秽之水”或“为污秽而用的水”。这里指用母牛灰制备、用来除去礼仪污秽的水。
    reason: lexical_alternative
  - marker: c
    text: “赎罪祭”也可译作“洁净祭”。希伯来语 חַטָּאת 可指赎罪祭；在祭司礼仪中也可侧重洁净的功用。
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: 一个洁净的人
  rationale: 保留 אִישׁ 的单数和 טָהוֹר 的礼仪语境；“洁净”在本章上下文中自然指礼仪上的洁净。
- source_word: וְאָסַף
  choice: 要……收起来
  rationale: 带连接词的完成式延续礼仪程序，汉语以“要”表达指令性质；“收起来”兼顾收集与留存。
- source_word: אֵפֶר הַפָּרָה
  choice: 母牛的灰
  rationale: אֵפֶר 是集合名词；פָּרָה 明指雌性牛，“母牛”准确而自然。
- source_word: וְהִנִּיחַ מִחוּץ לַמַּחֲנֶה בְּמָקוֹם טָהוֹר
  choice: 放在营外洁净的地方
  rationale: 按地点意义自然表达，并保留“营外”和“洁净地方”两个礼仪要素。
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל לְמִשְׁמֶרֶת
  choice: 为以色列会众保存
  rationale: עֲדָה 译作“会众”；לְמִשְׁמֶרֶת 表示留存、保管，用“保存”简洁传意。
- source_word: לְמֵי נִדָּה
  choice: 用来调制除污秽的水
  rationale: 该短语字面结构较含混，但本章语境表明灰被保存以配制用于除去礼仪污秽的水；“除污秽的水”保留功能意义，脚注注明较直译形式。
- source_word: חַטָּאת הִוא
  choice: 这是赎罪祭
  rationale: חַטָּאת 常指赎罪祭，但在祭司礼仪语境也可突出洁净作用；正文采用传统核心术语，并在脚注保留“洁净祭”的可能。
theological_decisions:
- issue: 净水短语 לְמֵי נִדָּה 的方向性
  choice: 除污秽的水
  alternative: 污秽水／为污秽而用的水
  rationale: נִדָּה 可表示污秽，也可在此复合语中指处理、除去污秽的用途。依据本章仪式功能，正文采用自然且不误导为“污水”的表达，脚注保留字面歧义。
- issue: חַטָּאת 在洁净礼仪中的含义
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词兼有“罪／赎罪祭”及祭司礼仪中的洁净功能。正文保留传统、词汇上有充分依据的“赎罪祭”，同时以脚注保存另一种理解，不消解神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。“以色列会众”与摩西五经群体称谓相协调；避免生硬照搬“以色列的众子”。正文以清楚的功能性措辞表达净水用途，同时用脚注保存希伯来文的词义张力。
