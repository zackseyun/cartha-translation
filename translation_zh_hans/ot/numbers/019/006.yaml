  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: zh_hans
  text: 祭司要拿香柏木、牛膝草和朱红线，把这些投进焚烧母牛[a]的火中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“小母牛”或“尚未生犊的母牛”；希伯来词本身泛指雌性牛，并未明确限定年龄或是否生育。
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: 要拿
  rationale: 这里的连续叙事形式承接前面的礼仪规程，表达下一项规定动作；用“要拿”自然体现规范性和顺序推进。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 符合祭祀礼仪语境，并保留定指意义。
- source_word: עֵץ אֶרֶז
  choice: 香柏木
  rationale: 该结构直译为“香柏的木材”；“香柏木”是现代汉语中自然、通行的对应表达。
- source_word: וְאֵזוֹב
  choice: 牛膝草
  rationale: 这是 אֵזוֹב 的传统汉语译名；其确切植物种类虽有争议，但本节不宜武断指定其他植物。
- source_word: וּשְׁנִי תוֹלָעַת
  choice: 朱红线
  rationale: 该词组指用虫源染料染成朱红色的材料；结合本处作为可投入火中的礼仪物件，译作“朱红线”简洁自然，也不把“虫”误解为物件本身。
- source_word: וְהִשְׁלִיךְ
  choice: 丢进
  rationale: 使役词形在此表示投掷、扔入；“丢进”是清楚而自然的现代汉语。
- source_word: אֶל תּוֹךְ
  choice: 进……中
  rationale: 表达进入内部的方向；汉语“丢进……中”自然保留其空间含义。
- source_word: שְׂרֵפַת הַפָּרָה
  choice: 焚烧母牛的火中
  rationale: שְׂרֵפָה 指焚烧过程，פָּרָה 指雌性牛。汉语若直译为“母牛的焚烧之中”较生硬，因此按场景译作“焚烧母牛的火中”，清楚表达投入焚烧过程内部。
theological_decisions:
- issue: 红母牛洁净礼中 פָּרָה 的译法
  choice: 母牛
  alternative: 小母牛；尚未生犊的母牛
  rationale: 该希伯来词明确是雌性牛，但本身不必然限定年龄或是否生育。“母牛”最直接地保留原词语义；脚注列出传统上较具体的理解，避免在正文中增加原文未明确说明的限制。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“祭司”“香柏木”“牛膝草”等沿用读者熟悉的礼仪和植物名称；句式简洁，符合律法礼仪规程的语体。
