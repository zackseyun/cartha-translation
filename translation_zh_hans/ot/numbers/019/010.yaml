base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: zh_hans
  text: 收集母牛的灰烬的人，要洗自己的衣服；他必不洁净直到晚上。这要作以色列人和寄居在他们中间的寄居者永远的条例。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֹסֵף
  choice: 收取……的人
  rationale: 带定冠词的Qal主动分词作名词用，指执行收集灰烬之事的人；“收取……的人”自然保留其分词性质。
- source_word: אֵפֶר הַפָּרָה
  choice: 母牛灰
  rationale: אֵפֶר在此为集合意义的“灰”；פָּרָה明确指雌性牛。结合本章礼仪语境，“母牛灰”准确而简洁。
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: 要洗净自己的衣服
  rationale: כִבֶּס在祭司礼仪洁净法规中指洗涤衣物；“要”符合现代汉语法规语体，“洗净”表达礼仪性洗涤而不增加道德含义。
- source_word: וְטָמֵא
  choice: 并且不洁净
  rationale: 这里描述礼仪上的不洁状态，而非道德污秽。“不洁净”沿用祭司法规中的清楚术语，并保留希伯来文简洁的状态表达。
- source_word: עַד הָעָרֶב
  choice: 到晚上
  rationale: 表达不洁状态持续至傍晚的时限，现代汉语自然简明。
- source_word: וְהָיְתָה
  choice: 这要作为
  rationale: 阴性单数动词回指上下文所规定的条例；用“这”明确承接前述规定。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，在此是指全体以色列民的固定群体称谓；现代标准汉语以“以色列人”自然准确地传达其集体所指。
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: 和寄居在他们中间的寄居者
  rationale: גֵּר指住在以色列社会中的非本族居民；名词与同根分词的重复在译文中以“寄居……的寄居者”保留。
- source_word: לְחֻקַּת עוֹלָם
  choice: 永远的条例
  rationale: חֻקָּה是固定的条例，עוֹלָם在律法公式中表示长久、持续的效力；“永远的条例”保留原文力度及其可能的契约性张力。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 原文形式虽为阳性复数“众子”，但在此作为固定的契约群体称谓，所指为以色列全体。现代汉语“以色列人”不误导为仅限男性，同时准确保留群体指向。
- issue: 礼仪不洁用语
  choice: 不洁净
  alternative: 不洁
  rationale: 本节论及礼仪身份而非道德罪污；“不洁净”能与“洁净”体系对应，也避免将其解释成伦理定罪。
- issue: עוֹלָם在条例公式中的时限
  choice: 永远的条例
  alternative: 长久的条例
  rationale: 保留原词可能表达永久或无定限持续的力度，不在正文中预先限定其契约框架或终止方式。
translation_notes:
  register: 采用现代、庄重且易懂的律法语体。保留“寄居……的寄居者”的同根重复，以反映原文措辞；不增添原文没有的解释。
