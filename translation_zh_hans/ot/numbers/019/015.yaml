source:
  edition: WLC
  text: וְ/כֹל֙ כְּלִ֣י פָת֔וּחַ אֲשֶׁ֛ר אֵין צָמִ֥יד פָּתִ֖יל עָלָ֑י/ו טָמֵ֖א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/015.yaml
  text: And every open vessel that does not have a tied cover on it is unclean.
translation:
  language: zh_hans
  text: 凡敞口的器皿，若上面没有系牢的盖子[a]，就是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“固定好的盖子”或“封好的遮盖物”；希伯来语这一表达指固定在器皿上的遮盖物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל כְּלִי
  choice: 凡……的器皿
  rationale: כֹל与单数名词连用，表达逐一涵盖的意思；中文用“凡”自然地呈现这一分配性范围。וְ承接上文，在本节中文独立成句时不必机械译出“并且”。
- source_word: פָתוּחַ
  choice: 敞口的
  rationale: 直译为“打开的”；用于器皿时，“敞口”比单说“开的”更自然，也与后文没有盖子相呼应。
- source_word: אֲשֶׁר אֵין
  choice: 若……没有
  rationale: 原文关系从句说明器皿成为不洁的条件；“若……没有”符合现代汉语法规性语境。
- source_word: צָמִיד פָּתִיל
  choice: 系牢的盖子
  rationale: 这一罕见组合指以捆系方式固定在器皿上的遮盖物。“系牢的盖子”保留固定、捆系的具体意象，同时不武断限定古代封闭装置的精确形式。
- source_word: עָלָיו
  choice: 上面
  rationale: 表示遮盖物位于器皿之上；中文“上面”简明自然。
- source_word: טָמֵא הוּא
  choice: 就是不洁净的
  rationale: 直接陈述不洁状态；不在正文中增添“礼仪上”等解释性限定。
theological_decisions:
- issue: 不洁的性质
  choice: 不洁净的
  alternative: 礼仪上不洁净的
  rationale: 上下文属于洁净条例，但希伯来文只说טָמֵא。正文保留原文简洁说法，不加入解释性神学类别。
- issue: 器皿遮盖装置的具体性质
  choice: 系牢的盖子
  alternative: 密封的盖子
  rationale: 原文强调遮盖物被固定或捆系，但未必明确表示现代意义的气密封闭，因此不将其收窄为“密封”。
translation_notes:
  register: 采用现代、庄重而易懂的法规性表述。“器皿”保持经文语体且涵盖面较广；“敞口”“系牢”使具体情形清楚。脚注标记已置于所释词语之后。
