  text: וְ/כֹ֨ל אֲשֶׁר יִגַּ֜ע עַל פְּנֵ֣י הַ/שָּׂדֶ֗ה בַּֽ/חֲלַל חֶ֨רֶב֙ א֣וֹ בְ/מֵ֔ת אֽוֹ בְ/עֶ֥צֶם אָדָ֖ם א֣וֹ בְ/קָ֑בֶר יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: zh_hans
  text: 凡在野外[a]触碰到被刀剑杀死的人、尸体[b]、人的骨头[c]或坟墓的，必不洁净七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在田野的表面上”，是指在露天的田野或野外。
    reason: 说明希伯来语习语及其译法。
  - marker: b
    text: 或译“死人”。
    reason: מֵת既可指死者，也可侧重尸体。
  - marker: c
    text: 原文为“人的骨头”；这里的“人”泛指人类，并非特指男性。
    reason: 澄清אָדָם的泛指意义。
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: 凡……触碰到……的
  rationale: כֹל与关系从句在此具有周遍、条件性的法律用法；“凡……的”自然地表达任何符合该情形的人。
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: 在野外
  rationale: 字面为“在田野表面上”，是指露天野外的习语；“在野外”比逐字翻译更符合现代汉语。
- source_word: בַּחֲלַל חֶרֶב
  choice: 被刀剑杀死的人
  rationale: חָלָל指被刺杀或杀死者，חֶרֶב说明致死的兵器；此译保留人的指称，也不把具体兵器范围缩窄为现代的“剑”。
- source_word: אוֹ בְמֵת
  choice: 尸体
  rationale: מֵת可指死人或尸体；在触碰导致礼仪不洁净的语境中，“尸体”清楚自然。
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: 人的骨头
  rationale: 原文为“人的一根骨头”；אָדָם在这里泛指人类，并非特指男性。汉语以“人的骨头”自然表达这一泛称。
- source_word: אוֹ בְקָבֶר
  choice: 或坟墓
  rationale: קֶבֶר指坟墓或埋葬之处；“坟墓”是本法律语境中最直接的对应词。
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: 都要不洁净七天
  rationale: יִטְמָא在祭司礼仪法规中表示处于不洁净状态；“要不洁净七天”兼顾法律语气和现代汉语可读性。
theological_decisions:
- issue: אָדָם是否应译成男性专称
  choice: 人（泛指人类）
  alternative: 男人
  rationale: 本节谈人的遗骨，性别并非语义焦点；אָדָם在此泛指人类。译作“人的骨头”准确保留范围，不引入男性限定。
- issue: יִטְמָא所指的不洁净性质
  choice: 不洁净
  alternative: 成为礼仪上不洁净
  rationale: 上下文属于洁净条例，但正文只明说“不洁净”。不在正文中加上“礼仪上”，可避免把解释写入经文，同时仍保留祭司法规中的术语张力。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“凡……的，都要……”体现普遍适用的条例结构；“触碰到”清楚表达实际接触，“不洁净”保留民数记礼仪法规的关键术语。
