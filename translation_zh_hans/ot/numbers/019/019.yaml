id: NUM.19.19
reference: Numbers 19:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: zh_hans
  text: 洁净的人要在第三天和第七天把这水洒在不洁净的人身上；第七天，他要使那人洁净[a]。那人要洗衣服，用水洗身，到晚上就洁净了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为那人除污”。这里的希伯来语动词与“罪”一词同根，但在本节中指除去礼仪上的不洁。
    reason: 保留 חטא 词根所带的罪／除污语言张力，同时避免把尸体不洁直接解释为道德罪责。
lexical_decisions:
- source_word: וְהִזָּה
  choice: 洒在……身上
  rationale: נזה 的使役式在本洁净礼仪中指把除污水洒在人身上；“洒”准确、自然，也符合民数记19章的仪式语境。
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: 洁净的人 / 不洁净的人
  rationale: 两个形容词均作名词使用，指礼仪状态；译作“人”保留法律条文中的泛指意义，不无根据地限定为男性。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: 在第三天和第七天
  rationale: 直接保留原文明确规定的两个仪式日期。
- source_word: וְחִטְּאוֹ
  choice: 他要使那人洁净
  rationale: חטא 的加强式在此指除去尸体所致的礼仪不洁，而非宣告道德上的罪得赦免。“使……洁净”符合上下文，同时脚注交代其词义张力。
- source_word: וְכִבֶּס בְּגָדָיו
  choice: 那人要洗衣服
  rationale: “洗衣服”是现代汉语中自然且准确的表达；以“那人”明示此处动作由接受洁净者完成，避免连续代词造成误解。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 用水洗身
  rationale: רחץ 在此仪式次序中指清洗身体；“用水洗身”比单说“洗”更清楚，并保留原文的“用水”。
- source_word: וְטָהֵר בָּעָרֶב
  choice: 到晚上就洁净了
  rationale: 表达经过规定洗濯后，礼仪上的洁净状态在晚上恢复；“到晚上”自然呈现时间界限。
theological_decisions:
- issue: חטא 与 טהר 在本节中的洁净含义
  choice: 按礼仪性洁净来翻译
  alternative: 译为“为他除罪”或“替他赎罪”
  rationale: 本章处理因接触尸体而有的不洁及除污水的使用。若译成道德罪责或赎罪，会加入本节上下文没有明说的神学判断。
- issue: הַטָּהֹר 与 הַטָּמֵא 的性别表达
  choice: 译为“洁净的人”和“不洁净的人”
  alternative: 译为“洁净的男人”和“不洁净的男人”
  rationale: 希伯来语虽用阳性单数形式，但在法律条文中具有代表性，并未把该仪式限定于男性。
- issue: 连续动词中的主语转换
  choice: 前句用“他”指洁净者，后句用“那人”指接受洁净者
  alternative: 全程沿用“他”，保留形式上的代词含混
  rationale: 希伯来语靠语境识别主语；现代汉语若连续使用“他”，容易误读为洒水者也要洗衣洗身。明示指称不改变礼仪流程。
translation_notes:
  register: 采用现代、庄重而易懂的法律礼仪语体。“洁净／不洁净”保持本章的核心术语一致；“把这水洒在……身上”根据上下文补出所洒的是除污水，中文表达完整自然。脚注标记紧随“洁净”，对应实际存在词义张力的 וְחִטְּאוֹ。
