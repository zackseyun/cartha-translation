  text: כָּֽל הַ/נֹּגֵ֡עַ בְּ/מֵ֣ת בְּ/נֶפֶשׁ֩ הָ/אָדָ֨ם אֲשֶׁר יָמ֜וּת וְ/לֹ֣א יִתְחַטָּ֗א אֶת מִשְׁכַּ֤ן יְהוָה֙ טִמֵּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/יִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא זֹרַ֤ק עָלָי/ו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥/וֹ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: zh_hans
  text: 凡触摸死人尸体而不使自己洁净的，就玷污了耶和华的帐幕；那人必从以色列中被剪除。因为除污之水[a]没有洒在他身上，他仍是不洁净的；他的污秽仍在他身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“污秽之水”；也可译作“洁净之水”或“洁净水”。这是指用来除去接触尸体所致不洁的水。
    reason: 保留希伯来语מֵי נִדָּה的字面表达，并说明其在本章中指用于除去尸体不洁的礼仪用水。
lexical_decisions:
- source_word: הַנֹּגֵעַ בְּמֵת
  choice: 触摸死人
  rationale: נגע在这里指实际接触；“触摸”直接自然。后面的同位语明确所指的是人的尸体。
- source_word: בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: 就是触摸死去之人的尸体
  rationale: נֶפֶשׁ通常可指生命或人，但在尸体所致礼仪不洁的语境中具体指死者的身体；“尸体”清楚表达此义。“人”保留אָדָם的泛指意义。
- source_word: יִתְחַטָּא
  choice: 洁净自己
  rationale: חטא的Hitpael形式在本章指履行礼仪洁净，并非悔改或道德上的赦罪。
- source_word: מִשְׁכַּן יְהוָה
  choice: 耶和华的帐幕
  rationale: מִשְׁכָּן指神居住的帐幕圣所；“帐幕”是准确而通行的中文表达。神名יהוה音译为“耶和华”。
- source_word: טִמֵּא
  choice: 玷污了
  rationale: Piel形式在涉及圣所时表示使之受到污秽；“玷污”保留礼仪和圣所层面的严重性。
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: 那人必……被剪除
  rationale: נֶפֶשׁ此处指具体的人；“被剪除”保留盟约制裁的固定表达，不擅自规定执行方式。
- source_word: מֵי נִדָּה
  choice: 除污水
  rationale: 该词组字面为“污秽之水”，在本章指为除去接触尸体所致不洁而预备的水。“除污水”简洁说明用途，同时以脚注保留字面形式及另一译法。
- source_word: זֹרַק עָלָיו
  choice: 没有洒在他身上
  rationale: זרה在该礼仪语境中指洒水；中文用被动意义自然表达水未施用于此人。
- source_word: טָמֵא יִהְיֶה
  choice: 他必不洁净
  rationale: 保留希伯来文对其礼仪状态的正式宣告；下句进一步说明这种污秽仍然持续。
- source_word: עוֹד טֻמְאָתוֹ בוֹ
  choice: 他的污秽仍在他身上
  rationale: עוֹד表示持续，“在他身上”保留污秽附着于人的希伯来语意象。
theological_decisions:
- issue: “被剪除”的具体含义
  choice: 保留“必从以色列中被剪除”的盟约制裁公式
  alternative: 处死；逐出会众；断绝后代
  rationale: 本节没有说明这一制裁通过何种方式实现。保留原有公式，可避免把有争议的法律与神学解释写入正文。
- issue: 尸体不洁与道德罪责的关系
  choice: 用“洁净自己”“不洁净”“污秽”等礼仪用语
  alternative: 洗清罪恶；赦免；道德败坏
  rationale: 上下文论述接触尸体所造成的礼仪不洁及其净化程序，不应把这种状态直接改写为道德犯罪。
- issue: 触摸尸体却未洁净为何玷污帐幕
  choice: 照原文直接陈述两者的关系，不补充机制
  alternative: 补明此人进入帐幕或接近圣物后才玷污帐幕
  rationale: 经文本身未在本节明说此人采取了何种后续行动；译文应保留这一紧张关系，不加入推断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“被剪除”与“玷污帐幕”保留律法文本的正式力度；“除污水”比生硬的“污秽之水”更易理解，并由脚注交代字面意义。句法保留原文的条件、罪责宣告、原因和持续状态之间的层次。
