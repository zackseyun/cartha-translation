revisions:
- from: 凡触摸死人，就是触摸死去之人的尸体，却不洁净自己的，就玷污了耶和华的帐幕；那人必从以色列中被剪除。因为除污水[a]没有洒在他身上，他必不洁净；他的污秽仍在他身上。
  to: 凡触摸死人尸体而不使自己洁净的，就玷污了耶和华的帐幕；那人必从以色列中被剪除。因为除污之水[a]没有洒在他身上，他仍是不洁净的；他的污秽仍在他身上。
  rationale: 修订只处理现代汉语中的语义歧义、句法重复和术语清晰度。“他仍是不洁净的”明确是状态宣告，而非禁止；“触摸死人尸体”自然表达原文在“死人”后对人体尸体的限定；“除污之水”保留功能性译法，脚注继续保留字面义和替代译法。未改变“被剪除”的开放性，也未把礼仪不洁改写为道德罪责。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:56:55Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了尸体不洁、未行洁净、玷污耶和华帐幕、被剪除及污秽持续的结构，也恰当保留了“被剪除”的未决具体含义。不过，“他必不洁净”在现代汉语中容易读成禁止性命令（不得洁净），未能准确表达希伯来文对其礼仪状态的宣告，须改正。
  naturalness: 开头“凡触摸死人，就是触摸死去之人的尸体”重复且句法不够自然；“触摸死人尸体”可简明、准确地表达原文同位性说明。“却不洁净自己的”也不如“却不使自己洁净”自然明确。
  terminology: “耶和华的帐幕”“玷污”“被剪除”“不洁净”“污秽”均合乎律法文本的庄重礼仪语域。“除污水”略显像日常清洁或废水术语，改为“除污之水”更清晰；脚注应说明其直译及本章的专门礼仪用途，避免将“洁净水”误解为普通洁净的水。
  issues:
  - severity: medium
    issue: “他必不洁净”具有歧义
    rationale: 现代汉语的“必不＋动词/形容词”通常可理解为“必定不应／不得……”。此处טָמֵא יִהְיֶה是其礼仪状态的宣告，应译为“他仍是不洁净的”或“他必是不洁净的”。
  - severity: low
    issue: 首句同位语处理重复且不够顺畅
    rationale: “触摸死人，就是触摸死去之人的尸体”把原文对“死人”的进一步限定处理成解释性重复。改为“凡触摸死人尸体而不使自己洁净的”更符合现代汉语，同时保留尸体这一具体所指。
  - severity: low
    issue: “除污水”用语可能引起非礼仪性的理解
    rationale: “除污水”在现代汉语中不够稳定，可能联想到清洁用水或污水处理。以“除污之水”表达其用途，并在脚注保留“污秽之水”的字面义，较为清楚。
