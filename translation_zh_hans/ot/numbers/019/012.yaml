base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: zh_hans
  text: 他要在第三天和第七天用这水洁净自己[a]，便得洁净；但他若不在第三天和第七天洁净自己[b]，便不得洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这水”指本章前文所制备的除污秽的水。
    reason: cross_reference
  - marker: b
    text: “洁净自己”也可译作“使自己得洁净”；这里的希伯来语动词指经过礼仪程序，除去不洁。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְחַטָּא
  choice: 洁净自己
  rationale: חטא 的 Hitpael 形式在本章礼仪语境中指除去因接触尸体而有的不洁，而不是指犯罪；“洁净自己”自然地保留了反身含义，也明确属于礼仪洁净。
- source_word: בּוֹ
  choice: 用这水
  rationale: 阳性单数代词所指最自然的是本章前文所制备的除污水。正文用“这水”明确承接对象，避免汉语“用它”指代不清。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: 在第三天和第七天
  rationale: 忠实保留两个指定日期及希伯来文的并列结构，表达礼仪程序须在两日进行。
- source_word: יִטְהָר
  choice: 就洁净了
  rationale: טהר 表示完成礼仪后达到洁净状态；与前面的“洁净自己”（יִתְחַטָּא）有所区分，又符合现代汉语表达。
- source_word: וְאִם לֹא
  choice: 但他若不
  rationale: 连词在此引入与前句相反的条件；“但……若不”自然表达警告性的对照。
- source_word: הוּא
  choice: 他
  rationale: 保留原文明确的阳性单数代词；上下文所指是前述沾染不洁的人。
theological_decisions:
- issue: 民数记19章洁净用语的性质
  choice: 按礼仪上的洁净与不洁来翻译，不解释为道德上的赦罪或内在成圣。
  alternative: 采用泛化的属灵洁净语言。
  rationale: 上下文讨论因接触尸体造成的不洁及用除污水施行的规定；经文所说的是礼仪身份的改变，不应加入原文未明说的后期神学范畴。
- issue: 两个日期是否都是洁净程序的必要部分
  choice: 保留“第三天和第七天”的并列，不弱化其中任何一天。
  alternative: 把第七天理解为仅陈述洁净结果发生的时间。
  rationale: 马所拉文本两处均以同样方式并列第三天和第七天；译文保留其结构和由此产生的礼仪要求。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“洁净”贯穿本节，以保持祭司法典的礼仪语域；通过“洁净自己”与“就洁净了／不会洁净”的句法差异，体现 יתחטא 与 טהר 分别侧重洁净过程和洁净状态。
