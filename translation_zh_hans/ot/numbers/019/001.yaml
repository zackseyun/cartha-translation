base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/001.yaml
  text: And Yahweh spoke to Moses and to Aaron, saying,
translation:
  language: zh_hans
  text: 雅威对摩西和亚伦说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事动词在这里引出新的神谕。现代汉语用“说”最自然，也符合后接直接引语的表达习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之神名字的性质，而不改用称号。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: 对摩西和亚伦
  rationale: 两个 אֶל 分别标明说话的对象；汉语以一个“对”统摄并列的两人，既准确又自然。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出下文话语的固定公式；汉语用“说：”及冒号自然连接下一节的直接引语，无需机械重复译作“说道”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号。正文保留专名性质；“耶和华”是现代中文读者最熟悉且可辨识的形式，同时不以“主”替代原文神名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留神谕引言的简洁性，并以冒号提示话语将在下一节继续。
