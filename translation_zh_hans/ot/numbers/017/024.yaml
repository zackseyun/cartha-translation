  text: וַ/יֹּצֵ֨א מֹשֶׁ֤ה אֶת כָּל הַ/מַּטֹּת֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּרְא֥וּ וַ/יִּקְח֖וּ אִ֥ישׁ מַטֵּֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: zh_hans
  text: 摩西就把所有的杖从耶和华面前拿出来，带到以色列众人那里[a]。他们看见了[b]，各人就拿了自己的杖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”，即以色列众人。
    reason: 说明希伯来语民族称谓的字面形式。
  - marker: b
    text: 也可译作“他们看了”或“他们察看了”。
    reason: ראה的基本义是“看、看见”；本处上下文容许理解为观看或察看。
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: 拿出来，带到
  rationale: 这是יצא的使役形，表示“使出来、拿出来”；结合后面的起点和终点，用“拿出来，带到”自然呈现完整动作。
- source_word: הַמַּטֹּת
  choice: 所有的杖
  rationale: מַטֶּה在本段指各支派首领先前放在耶和华面前的实物杖，并非“支派”。
- source_word: מִלִּפְנֵי יְהוָה
  choice: 从耶和华面前
  rationale: 贴近希伯来语的空间表达，指这些杖原先放置在耶和华面前。
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: 带到以色列众人那里
  rationale: בְּנֵי יִשְׂרָאֵל在这里是民族共同体的惯用称呼；“以色列众人”比逐字译作“以色列的众子”更符合现代汉语。
- source_word: וַיִּרְאוּ
  choice: 他们看了
  rationale: 保留ראה的基本义“看见、看”，不擅自把动作具体化为仔细检查；上下文仍容许“察看”的语感。
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: 各人便拿走自己的杖
  rationale: אִישׁ在此作分配用法，意为“各人”；“拿走”自然表达众人各自取回其杖，但不额外加入原文没有的“取回”一词。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且能明确标示此专名的“耶和华”，而不以“主”代替，因而保留它作为盟约之神专名的性质。
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“就”和“便”体现希伯来叙事中连续动作的推进；避免把“看”过度解释为检验，也避免将民族称谓生硬地逐字翻译。
