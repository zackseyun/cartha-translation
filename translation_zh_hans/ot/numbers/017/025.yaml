  terminology: “雅威”“杖”“怨言”恰当。“悖逆之子”可保留原文的亲属式、带标记表达，脚注说明其可指悖逆者且不限定男性。“见证”应取代正文的“法版”，以避免不必要地消除原文的简洁表达。
