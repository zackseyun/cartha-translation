source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הָשֵׁ֞ב אֶת מַטֵּ֤ה אַהֲרֹן֙ לִ/פְנֵ֣י הָ/עֵד֔וּת לְ/מִשְׁמֶ֥רֶת לְ/א֖וֹת לִ/בְנֵי מֶ֑רִי וּ/תְכַ֧ל תְּלוּנֹּתָ֛/ם מֵ/עָלַ֖/י וְ/לֹ֥א יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“把亚伦的杖放回见证前[a]，保存起来，作为给悖逆之子[b]的记号；借此止住他们向我发的怨言，免得他们死亡。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“见证”。在五经会幕语境中，这通常指作为圣约见证的法版，并与约柜相关。
    reason: cultural_note
  - marker: b
    text: “悖逆之子”也可译作“悖逆的人”或“叛逆者”；这里并非只指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文中的立约之名。
- source_word: הָשֵׁב
  choice: 放回
  rationale: 使役命令式在这里表示把杖恢复到先前存放的位置；“放回”自然且准确。
- source_word: מַטֵּה
  choice: 杖
  rationale: 指亚伦作为祭司和支派标志的杖；“杖”符合上下文，也比“棍”庄重。
- source_word: לִפְנֵי הָעֵדוּת
  choice: 法版前
  rationale: עֵדוּת在会幕语境中指存放于约柜内、作为圣约见证的法版；正文保持简洁，并用脚注说明其所指。
- source_word: לְמִשְׁמֶרֶת
  choice: 保存起来
  rationale: 表达留存、保管之目的，现代汉语清楚自然。
- source_word: לְאוֹת
  choice: 作记号
  rationale: אוֹת表示具有提醒和证明作用的标志；“作记号”保留其功能。
- source_word: לִבְנֵי מֶרִי
  choice: 给悖逆之子
  rationale: 较贴近原文“悖逆的众子”这一带有亲属称谓的希伯来表达，不在正文中将其完全平化为“悖逆的人”。
- source_word: וּתְכַל
  choice: 这样，你就能止住
  rationale: כלה的使役词干表示使某事终止；结合语境，将连接词表达为目的或结果，但仍保留摩西为第二人称行动者。
- source_word: תְּלוּנֹּתָם מֵעָלַי
  choice: 他们向我发的怨言
  rationale: “怨言”体现旷野叙事中反复出现的埋怨主题；מֵעָלַי在此表示怨言针对雅威。
- source_word: וְלֹא יָמֻתוּ
  choice: 使他们不至于死亡
  rationale: 表达预期结果：怨言止息，从而避免他们因悖逆而死亡。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；采用较贴近学界通常重构发音的“雅威”，而不以称号替代。
- issue: הָעֵדוּת的具体指涉
  choice: 法版
  alternative: 见证；约柜
  rationale: 五经会幕语境中的“见证”通常指立约法版；不直接译成“约柜”，以免把容器加入正文，但以脚注交代它与约柜的关系。
- issue: לִבְנֵי מֶרִי的亲属式表达
  choice: 悖逆之子
  alternative: 悖逆的人；叛逆者
  rationale: 保留原文有标记的“众子”表达及其严厉语气，同时以脚注给出自然汉语释义，不限定实际所指只包括男性。
- issue: וּתְכַל的目的或结果关系
  choice: 这样，你就能止住
  alternative: 你要止住；好使你止住
  rationale: 希伯来语连接可带结果或目的色彩；正文采用不把两者截然分开的表达，也保留第二人称单数所指的摩西。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“悖逆之子”这一较为突出的希伯来表达，并借脚注解释；其余句法适度汉语化，使目的和结果关系清楚而不过度释义。
