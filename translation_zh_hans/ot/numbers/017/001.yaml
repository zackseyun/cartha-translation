base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH（יהוה）；传统上常以“主”替代。
    reason: 说明神名的原文形式及传统替代译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事形式承接并推进上下文；现代汉语通常无须机械译出连接词。“说”自然表达 דּבר 的言说意义，并与后面的 לֵאמֹר 共同构成常见的引语公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的传统音译呈现四字神名，同时用脚注交代其希伯来文字形式及常见替代译法。
- source_word: אֶל
  choice: 对
  rationale: 在“对某人说”的汉语结构中，自然表达言语所指向的对象。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代汉语圣经传统中通行的人名译法。
- source_word: לֵאמֹר
  choice: 说（由冒号引出下文）
  rationale: 此不定式用于引出直接话语；汉语以“说”及冒号自然传达其功能，避免重复译成“说……说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用普通中文读者最熟悉的专名“耶和华”，不以称号取代；脚注保留原文信息，并说明其他常见处理。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语的叙事连接形式未机械译作“然后”；引语公式压缩为汉语惯用的“对摩西说：”。脚注标记紧接相关神名所在分句，但为避免割裂专名，置于“说”后。
