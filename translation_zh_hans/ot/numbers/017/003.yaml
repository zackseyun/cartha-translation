id: NUM.17.3
reference: Numbers 17:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: zh_hans
  text: 要把这些因犯罪而丧命之人的香炉[a]锤成薄片[b]，用来包覆祭坛；因为他们曾把这些香炉献在雅威面前，香炉已经成为圣物[c]。它们要给以色列人作记号。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“这些拿自己的性命犯罪之人的香炉”，意思是他们的罪使自己丧命。
    reason: lexical_alternative
  - marker: b
    text: 或译“锤成金属片”。
    reason: lexical_alternative
  - marker: c
    text: 或译“已经分别为圣”。这里的主语最自然地是香炉。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: 香炉
  rationale: 指叛乱者用来盛火烧香的礼仪器具；“香炉”是现代中文中清楚、自然的对应词。
- source_word: הַחַטָּאִים הָאֵלֶּה בְּנַפְשֹׁתָם
  choice: 这些因犯罪而丧命之人
  rationale: 分词称他们为犯罪者，בְּנַפְשֹׁתָם字面涉及“他们的性命”；结合他们死亡的上下文，译文表达其犯罪以丧失自己的性命为代价，同时用脚注保留较贴近字面的表达。
- source_word: רִקֻּעֵי פַחִים
  choice: 锤成薄片
  rationale: 该短语描写把金属捶打、延展成片；“锤成薄片”既传达制作过程，也符合现代中文表达。
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: 用来包覆祭坛
  rationale: 表示这些金属薄片要作为祭坛的覆层；“包覆”比笼统的“遮盖”更准确地体现贴覆用途。
- source_word: כִּי הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: 因为这些香炉曾献在雅威面前
  rationale: הקריב在礼仪语境中有“带近、献上”之意；补明“这些香炉”可避免中文代词歧义，并保留献到神面前的庄重含义。神名יהוה音译为“雅威”。
- source_word: וַיִּקְדָּשׁוּ
  choice: 已经成为圣物
  rationale: 复数动词最自然地回指香炉，说明它们因被献在雅威面前而取得神圣地位；“成为圣物”在中文中清楚表达这一结果。
- source_word: וְיִהְיוּ לְאוֹת לִבְנֵי יִשְׂרָאֵל
  choice: 它们要给以色列人作记号
  rationale: 保留“作记号”的简洁表述，不在正文中额外解释其纪念或警戒功能；“以色列人”自然表达集体称谓“以色列的子孙”。
theological_decisions:
- issue: “成为圣洁”的主语及含义
  choice: 主语是香炉；香炉因被献在雅威面前而成为圣物，只能转作神圣用途。
  alternative: 主语是献香炉的人，或这里只表示器物暂时在礼仪上被分别出来。
  rationale: 最近且最自然的复数先行词是香炉，整节的论证也在说明为何须将香炉改制成祭坛的覆层。这样既保留神圣性的真实结果，也不把叛逆者称为圣洁。
- issue: בְּנַפְשֹׁתָם所表达的关系
  choice: 他们的犯罪导致自己丧命。
  alternative: 他们是“拿自己的性命犯罪”或“伤害自己的性命”。
  rationale: 上下文明确记载叛逆者因罪死亡，因此结果性理解最合语境；脚注仍保留希伯来语较为直译的可能表达，避免把词组的张力完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首“要把”承接上一节的命令语气；适度重复“这些香炉”以消除中文代词歧义。神名יהוה按项目取向译为“雅威”，整体避免古奥文言和额外的教派性解释。
