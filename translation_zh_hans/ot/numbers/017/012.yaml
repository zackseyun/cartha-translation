base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: zh_hans
  text: 亚伦就照摩西所说的，拿起火盘[a]，跑到会众中间。看哪，瘟疫已经在百姓中发作；他便把香放在火上[b]，为百姓赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“拿了”，没有明说宾语；按上节语境，补作“火盘”。
    reason: implicit_object
  - marker: b
    text: 原文直译为“放置香”；“在火上”是按上节所述火盘中的火补出的语境信息。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 拿来
  rationale: 希伯来文直译为“拿了”，宾语未明说；依据上节语境，所拿的是备好的火盘。中文用“拿来”自然承接前文，同时不在正文中硬加原文未明说的名词。
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: 照摩西所说的
  rationale: דבר 的基本意思是“说、讲话”，此处虽有吩咐的功能，但不译成“所吩咐的”，以保留原文措辞。
- source_word: וַיָּרָץ אֶל־תּוֹךְ הַקָּהָל
  choice: 跑到会众中间
  rationale: רוץ 明确表示“跑”；קהל 指聚集的以色列群体，“会众”在中文圣经语境中准确、简洁，也不必限定为现代宗教聚会。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来叙事中唤起注意、凸显眼前危急景象的语篇作用。
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: 瘟疫已经在百姓中发作了
  rationale: נגף 在本段指造成死亡的灾疫；“已经……发作了”体现亚伦赶到时灾情业已开始的状态。
- source_word: וַיִּתֵּן אֶת־הַקְּטֹרֶת
  choice: 放上香
  rationale: נתן 本义为“给、放、置”，结合上节火盘中的火，译作“放上香”表现具体动作，又不提前解释为“献香”。
- source_word: וַיְכַפֵּר עַל־הָעָם
  choice: 为百姓赎罪
  rationale: כפר 在祭司礼仪语境中表示施行赎罪。“为……赎罪”是准确而易懂的中文礼仪用语，不额外规定其运作机制。
theological_decisions:
- issue: 祭司礼仪动词 כפר 的译法
  choice: 为百姓赎罪
  alternative: 为百姓施行遮罪／除罪
  rationale: 本节描述祭司借着香在灾祸中为百姓施行赎罪。“赎罪”保留礼仪与神学分量，同时避免把原文未阐明的具体机制解释进译文。
- issue: קהל 所指的群体
  choice: 会众
  alternative: 集会的人群／全体民众
  rationale: “会众”可自然指聚集起来的以色列群体，既保留其共同体性质，也不把该词直接等同于后来的教会概念。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“看哪”保留原文突显危急场面的叙事语气；“会众”“赎罪”则保留民数记祭司礼仪语境中的传统而易懂的关键词。
