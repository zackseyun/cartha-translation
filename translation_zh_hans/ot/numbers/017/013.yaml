base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: zh_hans
  text: 他站在死人和活人之间，瘟疫就止住了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 他站
  rationale: עמד的基本义是“站立”或“站住”；此处用“站”自然简洁，保留叙事中的具体动作，不额外赋予对抗或停留等含义。
- source_word: בֵּין ... וּבֵין
  choice: 在……和……之间
  rationale: 成对的介词表示处于两群人之间，译作“在……和……之间”准确而符合现代汉语。
- source_word: הַמֵּתִים
  choice: 死人
  rationale: 该形式在此作名词，指已经死去的人；“死人”与下文“活人”形成简洁、鲜明的对照。
- source_word: הַחַיִּים
  choice: 活人
  rationale: 该词在此实体化使用，指仍然活着的人；“活人”与“死人”结构对应，也符合现代汉语表达。
- source_word: וַתֵּעָצַר
  choice: 就止住了
  rationale: עצר在此为被动形态，表示瘟疫的发展受到制止；“止住了”既保留被制止的结果，又比单纯的“停止了”更贴近原文语态。
- source_word: הַמַּגֵּפָה
  choice: 瘟疫
  rationale: מגפה在本段指造成死亡的灾疫；“瘟疫”简明地表达其严重性和暴发性质，又不加入原文未明说的解释。
theological_decisions:
- issue: 审判语境中מַגֵּפָה的性质
  choice: 瘟疫
  alternative: 灾祸；疫病
  rationale: 上下文显示这是造成多人死亡的灾疫。“瘟疫”保留其致命性及传统语义，但不在本节中额外明说其神学成因。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“死人”和“活人”保留原文鲜明对照；“就”自然呈现动作之后紧接发生的结果。
