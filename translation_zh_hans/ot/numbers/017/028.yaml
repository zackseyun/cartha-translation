  text: כֹּ֣ל הַ/קָּרֵ֧ב הַ/קָּרֵ֛ב אֶל מִשְׁכַּ֥ן יְהוָ֖ה יָמ֑וּת הַ/אִ֥ם תַּ֖מְנוּ לִ/גְוֺֽעַ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/028.yaml
  text: Everyone who comes near[a], who comes near to the tabernacle of Yahweh, will die. Are we all to perish?
translation:
  language: zh_hans
  text: 凡靠近、靠近雅威的会幕的人，都必死。难道我们都要灭亡吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道我们都要死吗？”这里的希伯来文与前一句的“死”使用不同的动词，可能侧重于耗尽、终结或灭亡，而不只是重复“死”。
    reason: 词义有可成立的不同表达，并且原文刻意换用了动词。
lexical_decisions:
- source_word: כֹּל
  choice: 凡……的人
  rationale: 在这里表示任何一个如此行的人；“凡……的人”自然地保留了希伯来文的普遍涵盖力。
- source_word: הַקָּרֵב הַקָּרֵב
  choice: 靠近、靠近
  rationale: 保留原文分词的重复，以传达百姓说话时的强调、惊惧和急迫感，不把这种突出的重复抹平。
- source_word: אֶל
  choice: （靠近）……
  rationale: 其方向意义在现代汉语动词“靠近”与宾语的直接搭配中已经自然表达，无须另加介词。
- source_word: מִשְׁכַּן
  choice: 会幕
  rationale: 这是旷野时期圣所建筑的通行且准确的中文称呼，比泛称“居所”更符合本节语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: יָמוּת
  choice: 必死
  rationale: 未完成式在此表达确定的后果；“必死”简洁清楚，也具有警告的力度。
- source_word: הַאִם
  choice: 难道……吗
  rationale: 引出带有惊惧与绝望意味的反问；这一句式符合现代汉语表达。
- source_word: תַּמְנוּ
  choice: 都要灭亡
  rationale: תמם含有终结、耗尽之意；结合不定式לִגְוֹעַ，用“灭亡”表达全体走向终局的恐惧，同时不与前句“死”机械重复。
- source_word: לִגְוֹעַ
  choice: 灭亡
  rationale: גוע指断气、死亡；在תמם的结构中译作“灭亡”，既传达死亡结局，也保留与前句מות用词不同这一点。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近其通常重构读音的现代音译，以专名而非称号呈现。
- issue: 百姓问题的范围与语气
  choice: 难道我们都要灭亡吗？
  alternative: 难道我们都要死吗？
  rationale: 保留原文反问的绝望语气以及תמם所带出的全体终结意味，同时不把它简化成前句动词的重复。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“靠近、靠近”的重复在汉语中略显突兀，但这是有意保留原文强调式的复现，以呈现百姓惊恐急切的口吻。
