base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威对摩西说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH，通常音译为“雅威”，也有译作“耶和华”的。
    reason: 说明神名的原文形式及另一通行译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式在叙事中推进事件，并构成常见的神谕引入公式。现代汉语以“对……说”自然表达；虽然无法像希伯来语那样在此与后面的 אמר 保持词形上的区别，但语义和句法功能清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的可能读音音译，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: אֶל 标示言语所指向的对象；“对摩西”是现代汉语中自然、准确的表达。人名 מֹשֶׁה 采用通行译名“摩西”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式是引出随后直接引语的固定结构。汉语用“说：”并加冒号，简洁自然地标明下文是所说内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近学界通常拟音的“雅威”，同时在脚注列出中文传统译名“耶和华”，既保留专名性质，也不掩盖读音重构及译名传统。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以“对摩西说：”对应希伯来文固定的发言引入公式；不机械译出连接词 וַ，以免在单节中文中显得生硬。脚注标记紧随神名所处短语之后，便于读者识别注释对象。
