base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: zh_hans
  text: 摩西便对以色列人[a]说话；他们所有的首领都交给他一根杖，每位首领按各自的父家交一根，共十二根杖；亚伦的杖也在他们的杖中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”，是对以色列民的常用称呼。
    reason: 说明群体称谓的字面形式，同时避免正文被误解为只指男性。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说了
  rationale: דבר在此表示向人说话、传达吩咐；译作“说了”保留叙事动作，并避免加入原文没有明说的宾语。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人[a]
  rationale: 这是指以色列全体民众的固定群体称谓。正文采用现代汉语自然的“以色列人”，脚注注明其字面形式。
- source_word: נְשִׂיאֵיהֶם
  choice: 众首领
  rationale: נָשִׂיא在本段指各支派公认的领袖；“首领”既符合语境，也避免“王子”等容易误解的译法。
- source_word: מַטֶּה
  choice: 杖
  rationale: 此处指各首领交出的实体杖，并作为其群体的代表凭证；“杖”准确、简洁，也适合后文发芽的叙事。
- source_word: מַטֶּה לְנָשִׂיא אֶחָד מַטֶּה לְנָשִׂיא אֶחָד
  choice: 一位首领一根
  rationale: 希伯来语借重复表达逐一分配的意思；汉语用“一位首领一根”自然地保留这种分配性强调。
- source_word: לְבֵית אֲבֹתָם
  choice: 按着各自的父家
  rationale: “父家”指按父系归属的祖族或家族单位；保留这一古代以色列社会结构，而“各自”明确其分配关系。
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: 共十二根
  rationale: “共”清楚表达前述逐一收取后的总数；量词“根”与“杖”搭配自然。
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: 亚伦的杖也在这些杖中
  rationale: 希伯来语是无显式系词的名词句；汉语补出“在”，并以“这些杖”自然表达亚伦的杖列在众杖之中。
