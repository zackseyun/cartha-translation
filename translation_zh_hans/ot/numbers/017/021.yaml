revisions:
- from: 摩西就对以色列人[a]说了。众首领都把杖交给他，按着各自的父家，一位首领一根，共十二根；亚伦的杖也在这些杖中。
  to: 摩西便对以色列人[a]说话；他们所有的首领都交给他一根杖，每位首领按各自的父家交一根，共十二根杖；亚伦的杖也在他们的杖中。
  rationale: 修订仅改善现代汉语叙事的自然度和分配短语的修饰关系。“他们所有的首领”对应“他们的众首领”；“交给他一根杖”及“每位首领按各自的父家交一根”保留原文的逐一分配和父家归属。“亚伦的杖也在他们的杖中”保留其被列入众杖之中的意思。
