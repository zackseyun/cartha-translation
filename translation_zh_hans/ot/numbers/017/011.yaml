  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: zh_hans
  text: 摩西对亚伦说：“拿香炉[a]来，把坛上的火放在里面，再加上香，赶快到会众那里去，为他们赎罪；因为怒气已经从耶和华面前发出[b]，瘟疫已经开始了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“火盘”。
    reason: lexical_alternative
  - marker: b
    text: 直译“从耶和华面前”；即从他的临在中。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: 香炉
  rationale: 指祭司礼仪中盛放炭火和香的器具；“香炉”在本语境中自然清楚，同时以脚注保留“火盘”这一可能译法。
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: 把坛上的火盛在里面
  rationale: 既保留火取自祭坛，也按汉语容器表达习惯用“盛在里面”。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 这是祭祀语境中指焚烧之香的常用词；“放上香”简洁自然。
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: 赶快拿到
  rationale: 该使役式命令在上下文中指把香炉迅速带到会众那里；译文兼顾携带动作和紧迫感。
- source_word: הָעֵדָה
  choice: 会众
  rationale: 在《民数记》中指作为整体聚集的以色列群体；“会众”保留其正式、群体性的意味。
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: 为他们赎罪
  rationale: 保留祭司礼仪中 כפר 的核心祭祀和神学含义，同时避免加入经文本身未说明的具体赎罪理论。
- source_word: הַקֶּצֶף
  choice: 怒气
  rationale: 表达上帝发出的审判性烈怒；“怒气”庄重且为现代读者易懂。
- source_word: מִלִּפְנֵי יְהוָה
  choice: 从耶和华面前发出
  rationale: 保留希伯来文“从……面前／临在中”的空间意象，不将其简化为仅仅“从耶和华而来”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名最通行、最易识别的音译。
- source_word: הֵחֵל הַנָּגֶף
  choice: 瘟疫已经开始了
  rationale: 本处 נֶגֶף 指临到百姓、造成死亡的灾疫；“瘟疫”符合上下文，“已经开始了”保留完成式所表达的已然状态。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是现代中文可见的音译；“耶和华”在普通中文读者中辨识度更高，并明确保留专名而不改译为“主”。
- issue: 祭司语境中 כפר 的译法
  choice: 为他们赎罪
  alternative: 为他们施行遮罪礼／为他们除罪
  rationale: “赎罪”保留该词在祭司礼仪中的传统神学分量，却不进一步界定赎罪如何生效，从而保留经文本身的张力。
- issue: 怒气“从耶和华面前发出”的意象
  choice: 保留“面前”
  alternative: 怒气已经从耶和华那里发出
  rationale: 直译保留神圣临在与审判由其面前发出的希伯来意象；脚注帮助读者理解，避免误读为空间局限。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。短促的连续命令保留原文的紧迫节奏；“赶快拿到”明确香炉是被带往会众处的器具。脚注标记均紧随相关词句。
