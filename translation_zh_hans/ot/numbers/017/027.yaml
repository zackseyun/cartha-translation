  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
translation:
  language: zh_hans
  text: 以色列人[a]对摩西说：“看哪[b]，我们要死了！我们要灭亡了[c]！我们全都要灭亡了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”原文直译为“以色列的众子”，也可译作“以色列的子孙”。
    reason: lexical_alternative
  - marker: b
    text: “看哪”是表示警觉和惊恐的感叹语。
    reason: lexical_alternative
  - marker: c
    text: 原文接连使用两个不同的动词：“死”（גוע）和“灭亡”（אבד），强化了百姓的恐慌；“灭亡”随后又重复一次。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语表达该群体身份最自然、准确的说法；希伯来语字面为“以色列的众子”，在此指以色列全体民众，并非只强调男性后裔。
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: 对摩西说
  rationale: 希伯来叙事常用“说……说”引出直接引语；现代汉语只用一个“说”即可自然传达其功能，避免生硬重复。
- source_word: הֵן
  choice: 看哪
  rationale: 该感叹词在此引人注意并表达惊恐。“看哪”保留了突发、警醒的语气，同时保持庄重。
- source_word: גָּוַעְנוּ
  choice: 我们要死了
  rationale: גוע指断气、死亡；结合百姓惊慌的呼喊，“要死了”自然表达迫在眉睫的死亡感。
- source_word: אָבַדְנוּ
  choice: 我们要灭亡了
  rationale: אבד指毁灭、灭亡，在此比单纯的“死”更着重彻底毁灭；译文借此保留与前一动词的差别。
- source_word: כֻּלָּנוּ אָבָדְנוּ
  choice: 我们全都要灭亡了
  rationale: “全都”突出希伯来语 כֻּלָּנוּ 所强调的无一例外；重复“要灭亡了”保留原文因恐慌而产生的修辞反复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的惊呼句式。“要死了／要灭亡了”传达希伯来语完成式在危急呼喊中所表达的迫近结局，不把它机械处理成已经发生的过去事件；同时保留三个短句和末尾重复，呈现百姓不断加剧的惊慌。
