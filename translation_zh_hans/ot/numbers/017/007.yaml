source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: zh_hans
  text: 会众聚集起来反对摩西和亚伦的时候，他们转向会幕。看哪，云彩遮盖了它[a]，雅威的荣耀显现了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“云彩遮盖了它”；“它”最自然地指“会幕”。
    reason: 说明原文代词及其最可能的所指，同时保留指代上的轻微含混。
lexical_decisions:
- source_word: וַיְהִי
  choice: ……的时候
  rationale: 此处与后面的时间从句共同推进叙事；汉语不必另译成生硬的“事情发生了”，用“……的时候”自然表达事件背景。
- source_word: בְּהִקָּהֵל הָעֵדָה
  choice: 会众聚集起来的时候
  rationale: בְּ加不定式结构表示时间背景；נקהל为被动词干，表达众人聚集，עֵדָה指以色列整体会众。
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: 反对摩西和亚伦
  rationale: 结合叙事情境，עַל表示敌对、对抗，而非单纯朝向。
- source_word: וַיִּפְנוּ
  choice: 他们转向
  rationale: 保留פנה所表达的身体或视线转向，不进一步解释其动机。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: “会幕”是现代中文圣经语境中简洁而通行的名称，表达作为相会之帐幕的圣所。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留הִנֵּה引人注意、凸显突发景象的庄重语气。
- source_word: כִסָּהוּ הֶעָנָן
  choice: 云彩遮盖了它
  rationale: 动词后缀为阳性单数；用“它”保留原文代词形式，并以脚注说明其最自然的所指。
- source_word: וַיֵּרָא
  choice: 显现了
  rationale: ראה的被动词干在此表示变得可见；“显现”适合神圣荣耀可见彰显的语境。
- source_word: כְּבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: “荣耀”保留כָּבוֹד的神学分量；“雅威”直接音译四字神名，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”是现代汉语中贴近学界常用重构读音的音译，可保留其专名性质，不以称号代替。
- issue: כִסָּהוּ中阳性单数后缀的所指
  choice: 正文译作“它”，脚注说明最自然地指会幕
  alternative: 正文直接译作“会幕”；理解为遮盖会众或现场
  rationale: 最近的阳性单数先行词אֹהֶל“帐幕”最可能是所指，且符合云彩遮盖圣所的叙事图景；但原文使用代词，因此正文保留代词，以免消除语法上残存的指代空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”保留原文突显神圣景象的修辞力度；其余句法按自然现代汉语调整，避免仿古表达。
