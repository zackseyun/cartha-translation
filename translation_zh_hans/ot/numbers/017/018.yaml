base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/018.yaml
  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: zh_hans
  text: 你要把亚伦的名字写在利未的杖上，因为他们父系宗族的每位首领都有一根杖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为每位父系宗族首领有一根杖。”希伯来语短语可按分配意义理解，即一根杖对应一位父系宗族的首领。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: 要
  rationale: 连词承接上一节的指示；汉语命令句无需直译宾语标记，并以“要”自然表达指令语气。
- source_word: שֵׁם אַהֲרֹן
  choice: 亚伦的名字
  rationale: 按现代汉语习惯表达领属关系，并采用通行圣经人名译法。
- source_word: תִּכְתֹּב
  choice: 写
  rationale: Qal未完成式第二人称阳性单数在指令语境中具有命令意味，与“要”合用，准确而自然。
- source_word: עַל מַטֵּה לֵוִי
  choice: 在利未的杖上
  rationale: מַטֶּה在此首先指实际收取的杖，同时具有代表支派的功能；“杖”简洁保留两层含义。
- source_word: כִּי
  choice: 因为
  rationale: 引出把亚伦名字写在利未之杖上的理由。
- source_word: מַטֶּה אֶחָד
  choice: 一根杖
  rationale: 量词“根”符合现代汉语习惯，并保留“一根”的数量强调。
- source_word: לְ/רֹאשׁ
  choice: 各……的首领
  rationale: רֹאשׁ在此指宗族单位的负责人；介词短语可按分配意义理解，译作“各……的首领”使汉语关系清楚。
- source_word: בֵּית אֲבוֹתָם
  choice: 他们各宗族
  rationale: 希伯来语父系亲属单位若直译为“父家”在现代汉语中较生硬；“宗族”较自然地传达家族—氏族单位，保留“他们”的指代。
theological_decisions:
- issue: 利未之杖与亚伦代表身份的关系
  choice: 保留“利未的杖”并直接写“亚伦的名字”，不增添“祭司家族”等解释
  alternative: 译作“代表利未支派的杖”或补明亚伦的祭司身份
  rationale: 原文以象征性行动把亚伦与利未联系起来，却未在本句展开其神学意义；正文不应替原文补足解释。
- issue: 末句介词短语的分配关系
  choice: 正文采用“他们各宗族的首领都要有一根杖”
  alternative: “一根杖归他们父家的一位首领”或“一根杖代表一个宗族首领”
  rationale: 上下文要求每个父系宗族首领由一根杖代表，分配性理解最符合指令逻辑；脚注保留较贴近词序的另一种表达，避免掩盖希伯来语结构的简略性。
translation_notes:
  register: 采用现代、庄重而易懂的指令语体。“宗族”比“父家”更符合普通现代汉语；“首领”准确表达社会单位的负责人。脚注标记置于相关分句之后。
