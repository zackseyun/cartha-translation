revisions:
- from: 你要吩咐以色列人[a]，从他们那里取杖，每个父家一根；要从他们所有的首领那里，按着他们的父家，共取十二根杖[b]。你要把各人的名字写在各人的杖上。
  to: 你要吩咐以色列人[a]，从他们所有按父家而立的首领那里取杖：每个父家一根，共十二根杖[b]。你要把各人的名字写在相应的杖上。
  rationale: 修订将“从他们那里”“从所有首领那里”和“按父家”处理为同一取杖命令的相互补充限定，避免汉语中看似两次取杖的表达。“相应的杖”明确每个人的名字写在其对应的那根杖上；脚注删除未由本节明示的木质限定。
