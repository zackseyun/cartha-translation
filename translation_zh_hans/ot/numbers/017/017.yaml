base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: zh_hans
  text: 你要吩咐以色列人[a]，从他们所有按父家而立的首领那里取杖：每个父家一根，共十二根杖[b]。你要把各人的名字写在相应的杖上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: “杖”也可译作“棍”。这里指一根实体的杖。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的众子”，在这里是对以色列群体的惯用称呼；译作“以色列人”符合现代汉语习惯，又不改变所指。
- source_word: מַטֶּה
  choice: 杖
  rationale: 此处指可供写名、后来发芽的实体木杖；“杖”准确保留具体所指，也比“支派”更符合本节语境。
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: 每个父家一根
  rationale: 重复的 מַטֶּה 表达逐一分配，译为“每个……一根”自然呈现其分配意义；“父家”保留以父系祖先为组织单位的古代社会结构。
- source_word: נְשִׂיאֵיהֶם
  choice: 他们所有的首领
  rationale: נָשִׂיא 在这里指各支派或父家的领袖；“首领”比可能带有王室含义的“王子”准确。
- source_word: לְבֵית אֲבֹתָם
  choice: 按着他们的父家
  rationale: 该短语说明首领和杖是依照父家体系选取的；“按着”保留分类或组织依据。
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: 共取十二根杖
  rationale: “共取”在汉语中清楚表明前述逐家取杖的总数是十二根，未增添原文之外的对象。
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב
  choice: 你要把各人的名字写
  rationale: אִישׁ 在这里有逐一、分配的作用；“各人的名字”自然表达每位首领各有其名。
- source_word: עַל מַטֵּהוּ
  choice: 在各人的杖上
  rationale: 物主后缀指每个人相应的那根杖；重复“各人的”可避免汉语“他的”所指含混。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“你要吩咐”保留神对摩西命令的语气；分号和“共取”梳理原文较长的命令结构。“父家”作为古代以父系祖先为中心的宗族单位予以保留，不泛化为现代意义上的“家庭”。
