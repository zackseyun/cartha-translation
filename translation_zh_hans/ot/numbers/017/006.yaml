  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּלֹּ֜נוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִֽ/מָּחֳרָ֔ת עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת עַ֥ם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: zh_hans
  text: 第二天，以色列全会众都向摩西和亚伦发怨言，说：“你们害死了雅威的百姓！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: 发怨言
  rationale: 该动词在旷野叙事中常指群体对领袖不满并抱怨；“发怨言”既自然，又保留了敌对指责的语气。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列全会众
  rationale: עֵדָה 指作为整体聚集的共同体，译作“会众”；בְּנֵי יִשְׂרָאֵל 在现代汉语圣经语境中以“以色列”修饰会众即可准确指以色列人整体，避免生硬的“以色列的众子”。
- source_word: מִמָּחֳרָת
  choice: 第二天
  rationale: 准确表达相对于前述事件的次日，现代汉语简洁自然。
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: 向摩西和亚伦
  rationale: 介词 עַל 在此标明怨言针对的对象；汉语“向……发怨言”自然表达其敌对指向。希伯来文重复介词，但汉语无需机械重复。
- source_word: לֵאמֹר
  choice: 说
  rationale: 以现代汉语常用的引语引介词承接直接话语。
- source_word: אַתֶּם הֲמִתֶּם
  choice: 你们害死了
  rationale: הֲמִתֶּם 是 מות 的使役式完成体，表示“使……死亡”。“害死”保留直接归责和强烈控告的语气，也比“杀死”更能容纳造成死亡而未必亲手杀害的使役含义。
- source_word: עַם יְהוָה
  choice: 雅威的百姓
  rationale: “百姓”适合表达 עַם 所指与神有归属关系的群体；属格结构译为“雅威的百姓”，简洁而庄重。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所使用的专名，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用现代汉语常见的学术性音译“雅威”，使专名与“主”这一称号保持区别；“耶和华”属于传统混合读法。
- issue: 以色列共同体的性别表达
  choice: 以色列全会众
  alternative: 以色列的众子全会众
  rationale: בְּנֵי יִשְׂרָאֵל 是希伯来语对以色列民族的惯用名称，在此由 כָּל עֲדַת 明确指整个会众，并非只强调男性后裔。译成“以色列全会众”准确传达群体范围，同时避免现代汉语中可能误导为仅含男性的直译。
- issue: 会众对摩西、亚伦责任的指控
  choice: 害死了
  alternative: 杀死了；使……死了
  rationale: 使役式表达会众将死亡责任归给两位领袖，但原文未说明他们以何种方式导致死亡。“害死”保留控告力度，也不额外断定是亲手杀害。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“全会众”“发怨言”“百姓”保留经文语域，但避免文言化；直接引语以感叹号呈现原句强烈的控告语气。
