base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: zh_hans
  text: “你要吩咐以利亚撒，就是祭司亚伦的儿子：从焚烧之处取出那些香炉[a]，把火撒到远处，因为这些香炉已经成了圣物[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“火盘”。希伯来语所指的是盛放炭火或香料的器皿。
    reason: lexical_alternative
  - marker: b
    text: 或译“因为它们是圣的”。这里的希伯来语完成式也可着重表达所形成的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר אֶל
  choice: 你要吩咐
  rationale: 祈使式引出摩西要转达给以利亚撒的命令；“吩咐”自然表达这里的命令语气。
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: 祭司亚伦的儿子以利亚撒
  rationale: 按希伯来语词组最自然的关系，将“祭司”理解为修饰亚伦，同时保留完整的父子身份说明。
- source_word: וְיָרֵם
  choice: 捡起
  rationale: 该动词在此指从焚烧之处拿起、移走香炉；“捡起”比直译“举起”更符合具体动作和现代汉语习惯。
- source_word: הַמַּחְתֹּת
  choice: 香炉
  rationale: 该词指盛放炭火或香料的礼仪器皿；“香炉”是中文宗教语境中清楚而常见的对应词。
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: 从焚烧之处
  rationale: שׂרפה可指焚烧、烈火或焚烧后的区域；此译法保留现场含义，不武断限定为火焰或灰烬。
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  choice: 把火撒到远处
  rationale: זרה意为撒散，הָלְאָה表示更远处；保留原文的“火”，不将其解释性地改成“炭火”。
- source_word: כִּי קָדֵשׁוּ
  choice: 因为这些香炉已经成为圣物
  rationale: 复数动词最自然地回指香炉；完成式可突出先前献到耶和华面前之后形成的结果状态。
theological_decisions:
- issue: כִּי קָדֵשׁוּ中复数动词的所指
  choice: 明确回指香炉
  alternative: 理解为香炉与火，或笼统指与献祭有关的物件
  rationale: 最近且合适的复数先行词是“香炉”，叙事也要求保存香炉而把火撒掉，因此回指香炉最符合上下文。
- issue: קָדֵשׁוּ所表达的时间与状态
  choice: 已经成为圣物
  alternative: 它们是圣的
  rationale: 完成式可表达已发生之事所形成的当前状态；正文呈现这一结果性，同时用脚注保留单纯状态译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事命令语体。“焚烧之处”有意保留原词可指燃烧现场或焚烧区域的宽度；“圣物”比“圣洁的”更自然地表达礼仪器物归为神圣的状态。
