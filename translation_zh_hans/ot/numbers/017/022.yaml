revisions:
- from: 于是，摩西把杖[a]放在耶和华面前，安置在见证之帐[b]里。
  to: 摩西就把这些杖[a]放在耶和华面前，在见证的帐篷[b]里。
  rationale: 修订保留原文的叙事连接、神名、众数的实体杖、在耶和华面前的呈放含义，以及“见证之帐”的地点称谓。删除重复的“安置”谓语，并以现代而不失庄重的“见证的帐篷”取代较生硬的“见证之帐”。
