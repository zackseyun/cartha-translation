  text: וַ/יַּנַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֹּ֖ת לִ/פְנֵ֣י יְהוָ֑ה בְּ/אֹ֖הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: zh_hans
  text: 摩西就把这些杖[a]放在耶和华面前，在见证的帐篷[b]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杖杆”。这里指代表各支派的实体杖。
    reason: lexical_alternative
  - marker: b
    text: 或译“见证的帐幕”。原文直译为“见证的帐篷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: 放……安置
  rationale: 希伯来语使役形在此表示把物件放下或安置。用“放……安置”既自然，也清楚表达摩西将杖置于指定地点的动作。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经及一般读者熟悉的标准译名。
- source_word: הַמַּטֹּת
  choice: 杖
  rationale: מַטֶּה 可指杖、棍或支派；本段明确指代表各支派的实体杖，因此译为“杖”，并以脚注保留“棍”的可能表达。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 直接保留其空间及临在含义，表示这些杖被放在耶和华面前。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的形式音译四字神名，保留其作为专名而非称号的性质。
- source_word: בְּאֹהֶל
  choice: 在……帐里
  rationale: אֹהֶל 的基本义是“帐篷、帐幕”；此处采用简洁的“帐”，保留原文意象，脚注说明也可译作传统的“帐幕”。
- source_word: הָעֵדֻת
  choice: 见证
  rationale: עֵדוּת 在此指与约的法版及圣所有关的“见证”；译为“见证”可保留原文的传统称谓及其神学关联。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留为专名，并采用普通现代中文读者较熟悉的“耶和华”；“雅威”是另一种按学术重构发音的音译。
- issue: “见证之帐”的所指
  choice: 保留原文所有格结构
  alternative: 见证的帐幕／会幕
  rationale: 原文直译为“见证之帐”。不直接改译为“会幕”，以免把此处的“见证”含义消隐；脚注提供“见证的帐幕”这一传统表达。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接叙事；用“见证之帐”贴近原文，同时以脚注补充传统译法。
