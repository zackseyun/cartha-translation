revisions:
- from: 摩西就照耶和华所吩咐他的去做；他正是这样做的。
  to: 摩西就照耶和华所吩咐他的事去做；他就这样做了。
  rationale: 修订仅处理汉语句法与叙事体的自然度：补出“事”以明确“吩咐”的内容，并以“他就这样做了”对应原文末尾重复的“这样行了”。人名、神名、命令关系及强调性重复均予保留。
