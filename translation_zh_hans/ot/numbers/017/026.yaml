  text: וַ/יַּ֖עַשׂ מֹשֶׁ֑ה כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/026.yaml
  text: And Moses did just as Yahweh commanded him; so he did.
translation:
  language: zh_hans
  text: 摩西就照耶和华所吩咐他的事去做；他就这样做了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 去做
  rationale: עשה可表示“做、行”。本节语境是执行命令，用“去做”自然地表达摩西将吩咐付诸行动。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代汉语圣经传统中通行的人名译法。
- source_word: כַּאֲשֶׁר
  choice: 照……
  rationale: 此处表示行动与所受命令相符合；“照……去做”是自然、庄重的现代汉语表达。
- source_word: צִוָּה
  choice: 吩咐
  rationale: צוה表示权威性的命令。“吩咐”在上帝向人发令的语境中自然，并保留其权威意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉、通行的形式音译四字神名，保留其专名性质，而不以“主”这一称号替代。
- source_word: אֹתוֹ
  choice: 他
  rationale: 宾格标记所带的第三人称阳性单数后缀指摩西，译作“他”。
- source_word: כֵּן
  choice: 这样
  rationale: כֵּן回指前述按命令而行的方式；“这样”清楚承接上文。
- source_word: עָשָׂה
  choice: 做的
  rationale: 保留原文עשה的重复，以强调摩西确实完全照命令执行；与前句“去做”形成自然呼应。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名。正文保留专名而不改译为称号“主”；“耶和华”是现代中文最通行且普通读者最易识别的形式，“雅威”则更接近当代学界常见的拟音。
- issue: 末尾重复 עשה 的处理
  choice: 保留为“他正是这样做的”
  alternative: 省略重复，译作“摩西就遵命而行”
  rationale: 原文先说摩西照吩咐去做，随后再次确认“他这样做了”。保留重复可呈现其强调顺服的修辞效果，不将两句压缩为一句。
translation_notes:
  register: 采用自然、庄重、普通现代读者易懂的简体中文。“就……；他正是……”保留希伯来文叙事推进及末尾确认性的重复。
