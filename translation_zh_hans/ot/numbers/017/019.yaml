  text: וְ/הִנַּחְתָּ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵי֙ הָֽ/עֵד֔וּת אֲשֶׁ֛ר אִוָּעֵ֥ד לָ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/019.yaml
  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: zh_hans
  text: 你要把这些杖放在会幕内，置于见证前[a]；我在那里与你们相会[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“在见证前”。“见证”也可译为“立约的见证”；在此圣所语境中，很可能与约版及其所代表的立约见证有关。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我向你们显明自己的地方”，又或：“我指定在那里与你们相会的地方”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: 你要把这些杖放在
  rationale: 该词是使役形，带第三人称阳性复数宾语后缀，意为“你要把它们放置”。结合上文，宾语明确为各支派的杖，因此译出“这些杖”，使现代汉语自然清楚。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: אֹהֶל מוֹעֵד是圣所帐幕的固定称谓；“会幕”是简洁、通行且能表达相会功能的中文译法。
- source_word: לִפְנֵי הָעֵדוּת
  choice: 置于法柜前
  rationale: לִפְנֵי意为“在……面前”。הָעֵדוּת字面为“见证”，但在民数记这一圣所语境中指存放约版、作为立约见证的法柜；正文采用自然且具语境辨识度的“法柜”，脚注保留较直译的选择及所指范围。
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: 就是我与你们相会的地方
  rationale: אִוָּעֵד是יעד的被动式，在此表示按约定相会；לָכֶם依该固定搭配译为“与你们”。אֲשֶׁר与שָׁמָּה合起来自然表达为“……的地方”，避免生硬地重复“那里”。
theological_decisions:
- issue: הָעֵדוּת（“见证”）的具体所指
  choice: 正文译为“法柜”，并以脚注说明原文措辞及可能所指。
  alternative: 直译为“见证”或“立约的见证”，或明确译为“约版”。
  rationale: 本节的圣所语境表明这“见证”与存放约版之处密切相关，但原文没有明说“约版”或“柜”。“法柜”便于普通读者理解，脚注则避免把原文较宽的指称完全限定为柜本身。
- issue: אִוָּעֵד所表达的神圣相会
  choice: 译为“我与你们相会”。
  alternative: “我向你们显明自己”或“我指定在那里与你们相会”。
  rationale: “相会”保留了יעד在会幕语境中的约定会面含义，不额外加入“显现”或其他神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事命令语体。“你”指摩西，“你们”保留原文复数。正文将宾语按语境明确为“这些杖”，并将שָׁמָּה融入“……的地方”这一自然汉语结构。
