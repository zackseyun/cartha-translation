  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事形式推进上下文；现代汉语以“对……说”自然表达发言动作，无须机械加入“然后”或“又”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法“耶和华”，将其作为专名而非称号处理。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说结构中表示话语所指向的对象，汉语自然译为“对摩西”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出后续直接引语；中文用句末“说：”即可完整承载其篇章功能，避免重复译成“说话，说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文保留其专名性质；“耶和华”是现代中文读者最熟悉且庄重的传统音译，“雅威”则是较接近学术重构读音的另一译法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。按中文引出直接引语的习惯使用冒号；本节本身是引语导语，并与下一节内容相连。
