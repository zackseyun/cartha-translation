base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: zh_hans
  text: 亚伦回到在会幕门口的摩西那里，灾疫就止住了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “止住了”也可译作“被制止了”“受到了遏制”或“被阻止了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 亚伦回到
  rationale: וַ־推动叙事向前，中文以语序自然表达承接；שׁוּב在此指空间上的返回，译作“回到”简明准确。
- source_word: אֶל מֹשֶׁה
  choice: 摩西那里
  rationale: אֶל表示朝向摩西；与“回到”搭配时，“摩西那里”符合现代汉语习惯，也不重复加入“回去”等信息。
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕门口
  rationale: פֶּתַח指入口或门口；אֹהֶל מוֹעֵד直译为“相会之帐幕”，采用现代中文圣经语境中清楚简洁的“会幕”。此处作为“摩西那里”的位置说明。
- source_word: הַמַּגֵּפָה
  choice: 灾疫
  rationale: מַגֵּפָה在本段指造成死亡的灾害性疫病或击打；“灾疫”兼顾其灾难性质与疫病语境，比单说“瘟疫”略少加入病理限定。
- source_word: נֶעֱצָרָה
  choice: 止住了
  rationale: עצר的尼法勒式表示灾疫受到阻止、不再继续；“止住了”自然、直接，并且不明说施事者，保留原文的被动含义和叙事克制。
theological_decisions:
- issue: 灾疫停止背后的施事者
  choice: 采用“灾疫就止住了”，不明确补出施事者
  alternative: 耶和华止住了灾疫
  rationale: 上下文使读者可以理解神的作为，但希伯来文此句使用尼法勒式，没有明说施事者；译文不补出“耶和华”，以保留原文的语法表达和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“会幕”沿用简洁、易懂的通行称呼；整体保持叙事紧凑。脚注标记置于其实际说明的“止住了”之后，避免误指“会幕门口”。
