base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: zh_hans
  text: 第二天，摩西进了见证的帐幕[a]。看哪，代表利未家的亚伦之杖已经发了芽，又生出花朵，开了花，并结出了成熟的杏仁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“见证之帐幕”或“见证帐篷”。这一名称与帐幕中存放的法版有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: 第二天
  rationale: 自然、准确地表达事情发生在随后的那一天，并保留希伯来叙事的时间顺序。
- source_word: אֹהֶל הָעֵדוּת
  choice: 见证帐幕
  rationale: “见证”直接对应עֵדוּת所含的法律与盟约意味；“见证帐幕”作为名称简洁庄重，脚注保留另一种展开译法。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来叙事标记所传达的突然发现与引人注目的语气，突出神迹。
- source_word: מַטֵּה
  choice: 杖
  rationale: 这里指各支派首领所交出的杖；“杖”简洁自然，也与亚伦的身份和上下文相符。
- source_word: לְבֵית לֵוִי
  choice: 代表利未家族
  rationale: 介词短语表明亚伦的杖与利未家族的代表关系；在正文中明确这一隐含关系，同时以脚注说明较直译的表达。
- source_word: פָּרַח
  choice: 发了芽
  rationale: 在随后花苞、开花和果实成熟的连续图景中，此处译作“发了芽”最能体现最初的生长阶段。
- source_word: וַיֹּצֵא פֶרַח
  choice: 长出了花苞
  rationale: 按植物生长次序译为花苞，使这一阶段与前面的发芽及后面的开花有清楚区别，同时不削弱原文密集重复的生长意象。
- source_word: וַיָּצֵץ צִיץ
  choice: 开了花
  rationale: 自然表达花朵绽放，并保留原文在发芽、出苞之后进一步开花的层次。
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: 结出了成熟的杏仁
  rationale: גמל在这里表示果实达到成熟状态，不只是开始结果；“结出了成熟的杏仁”准确呈现神迹的高潮。
theological_decisions:
- issue: 亚伦之杖与利未家的关系
  choice: 代表利未家族的亚伦之杖
  alternative: 利未家的亚伦之杖
  rationale: 原文לְבֵית לֵוִי在上下文中说明这根杖代表利未家；明确译出“代表”可避免现代读者误以为只是所有权关系，却不加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”有意保留原文引人注目的语气；“发了芽—长出花苞—开花—结出成熟杏仁”体现原文逐步推进的神奇生长过程。
