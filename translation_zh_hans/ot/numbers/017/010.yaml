source:
  edition: WLC
  text: הֵרֹ֗מּוּ מִ/תּוֹךְ֙ הָ/עֵדָ֣ה הַ/זֹּ֔את וַ/אֲכַלֶּ֥ה אֹתָ֖/ם כְּ/רָ֑גַע וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: zh_hans
  text: “你们从这会众中间离开[a]，好让我顷刻间把他们灭尽[b]。”他们就俯伏在地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要从这会众中分别出来。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“把他们除灭。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: 离开
  rationale: 该词是 רום 的尼法勒命令式复数；在这里与 מִתּוֹךְ 连用，惯用意义是命令听者从会众当中撤离。译作“离开”自然清楚，同时在脚注保留更贴近分别意味的译法。
- source_word: מִתּוֹךְ
  choice: 从……中间
  rationale: 准确表达从一个群体内部移出的空间及群体关系。
- source_word: הָעֵדָה הַזֹּאת
  choice: 这会众
  rationale: עֵדָה 指聚集成群体的以色列民；“会众”既保留其整体性，也不过度限定为某次礼仪集会。
- source_word: וַאֲכַלֶּה
  choice: 好让我……灭尽
  rationale: כלה 的皮勒式在此表示彻底终结或消灭。“灭尽”传达完全毁灭的力度；“好让我”保留前一命令与随后行动之间的目的关系。
- source_word: אֹתָם
  choice: 他们
  rationale: 忠实保留指向会众的第三人称复数宾语。
- source_word: כְּרָגַע
  choice: 顷刻间
  rationale: 表示极短的时间；“顷刻间”简洁、庄重，也符合现代汉语。
- source_word: וַיִּפְּלוּ
  choice: 就俯伏
  rationale: “就”体现叙事中的紧接关系；结合后面的“在他们脸上”这一希伯来语惯用表达，译为“俯伏”比字面“倒下”更准确自然。
- source_word: עַל פְּנֵיהֶם
  choice: 在地
  rationale: 与“俯伏”组合成自然汉语“俯伏在地”，表达脸朝地伏下的动作，又不额外规定这是敬拜、恐惧还是代求。
theological_decisions:
- issue: 上帝命令的性质及审判的紧迫性
  choice: 将命令译为从会众中间离开，并直陈上帝要顷刻间将他们灭尽
  alternative: 译为较缓和的“站到一旁”或“退开”
  rationale: 原文是紧迫的复数命令，随后明确表达迅速而彻底的审判；正文不淡化其严厉程度，也不添加对审判原因或性质的解释。
- issue: 俯伏动作的具体含义
  choice: 仅译出“他们就俯伏在地”
  alternative: 明确译成“他们就俯伏代求”或“俯伏敬拜”
  rationale: 原文只记述俯伏动作，虽可由上下文理解为恐惧、代求或敬拜，却没有在本句中明说，因此保留其神学与叙事上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“会众”“顷刻间”“灭尽”保留经文语体的凝练与审判力度；避免生硬照译“起来”及容易误解为单纯跌倒的“倒在脸上”。
