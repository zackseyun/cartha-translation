  text: וַ/יִּהְי֗וּ הַ/מֵּתִים֙ בַּ/מַּגֵּפָ֔ה אַרְבָּעָ֥ה עָשָׂ֛ר אֶ֖לֶף וּ/שְׁבַ֣ע מֵא֑וֹת מִ/לְּ/בַ֥ד הַ/מֵּתִ֖ים עַל דְּבַר קֹֽרַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: zh_hans
  text: 死于这场瘟疫的共有一万四千七百人，此外还有因可拉的事而死的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因可拉的事”也可译作“因可拉而死”或“在可拉事件中死”。这里指先前因与可拉有关的事件而死的人。
    reason: 说明 עַל דְּבַר קֹרַח 可表达因由或事件关联，并避免正文过度限定。
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 共有
  rationale: 该叙事形式在这里引出死亡人数的统计结果；用“共有”自然承接上下文，不额外加入原文没有的时间副词。
- source_word: הַמֵּתִים בַּמַּגֵּפָה
  choice: 死于这场瘟疫的
  rationale: 将分词结构译为指人的“死于……的”，符合现代汉语；“这场”表明所指是上下文中的特定瘟疫。介词短语在语境中表达死亡发生于这场瘟疫之中，汉语用“死于”最为自然。
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 一万四千七百人
  rationale: 按现代汉语数字表达直译，并补出量词“人”。
- source_word: מִלְּבַד
  choice: 此外还有
  rationale: 表示前述数目不包括后一群死者；“此外还有”清楚表达另计之意。
- source_word: הַמֵּתִים עַל דְּבַר קֹרַח
  choice: 因可拉的事而死的人
  rationale: עַל דְּבַר 可表达“因为、由于”或“关于……的事”。译作“因可拉的事”既保留关联或因由，也不把原文进一步具体化为“叛乱”。
theological_decisions:
- issue: 与可拉有关的死者范围
  choice: 将一万四千七百名瘟疫死者与先前“因可拉的事而死的人”区分开来，但不在正文中细分后者。
  alternative: 译作“因可拉而死的人”或“在可拉事件中死的人”。
  rationale: 希伯来语 עַל דְּבַר קֹרַח 指向与可拉有关的先前审判，但没有在本节详列死者类别。“因可拉的事”保留了因果与事件关联之间的语义张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“死于这场瘟疫的共有……”适合人数统计语境；“因可拉的事”略带经文语体，但普通读者仍易理解，并能保留原文的语义幅度。
