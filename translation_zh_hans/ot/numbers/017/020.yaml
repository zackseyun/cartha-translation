base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: zh_hans
  text: 将会是这样：我所拣选的人的杖必发芽；我必使以色列人[a]正在向你们发的怨言不再临到我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”，也可译为“以色列民”。
    reason: 说明固定族群称谓的字面形式及可行译法。
lexical_decisions:
- source_word: וְהָיָה
  choice: 那时
  rationale: 这是承接前文、引出随后结果的表达；译为“那时”比逐字译作“事情将是”更符合现代汉语，同时保留将来指向。
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: 我所拣选之人
  rationale: 忠实表达上帝对该人的选择；上下文中的杖代表各支派的男性领袖，但汉语“之人”已能自然指称具体的人，无须额外强化性别。
- source_word: מַטֵּהוּ יִפְרָח
  choice: 他的杖必发芽
  rationale: מַטֶּה在本段指领袖的杖；יִפְרָח可指萌芽或开花，而下一节另述开花，因此此处采用“发芽”。
- source_word: וַהֲשִׁכֹּתִי
  choice: 我也要使……止息
  rationale: 该使役形式表达使怨言平息、停止；“使……止息”兼顾庄重语体与明确的使役含义。
- source_word: מֵעָלַי
  choice: 从我这里
  rationale: 保留介词短语所表达的“从我身上／从我这里移去”之意，不把它直接改释为怨言“反对我”。
- source_word: תְּלֻנּוֹת
  choice: 怨言
  rationale: 该词指带有不满和抗拒意味的抱怨；“怨言”在现代汉语圣经语境中自然、凝练。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该固定表达在这里集体指以色列民；“以色列人”自然清楚，脚注保留其字面形式。
- source_word: אֲשֶׁר הֵם מַלִּינִם עֲלֵיכֶם
  choice: 针对你们所发的
  rationale: 分词表达持续发怨言的行为，עֲלֵיכֶם表明怨言所针对的是摩西和亚伦；汉语定语结构可清楚修饰“怨言”。
theological_decisions:
- issue: 怨言与上帝、摩西和亚伦之间的关系
  choice: “针对你们所发的怨言从我这里止息”
  alternative: “他们向我发的、反对你们的怨言止息”
  rationale: 原文同时说怨言要“从我这里”止息，并说百姓正“针对你们”发怨言。译文保留这两个不同关系，不把מֵעָלַי解释成怨言明确“反对我”，也不抹去其落到上帝这里的含义。
- issue: בְּנֵי יִשְׂרָאֵל的表达
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 此处是对全体以色列民的固定集体称呼；正文采用现代汉语惯用表达，字面形式置于脚注，以兼顾可读性与形式透明度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“之人”和“止息”略带经文庄重感，但仍属普通读者易于理解的表达；句法明确区分怨言所针对的“你们”与怨言从上帝那里止息这两层关系。
