base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/008.yaml
  text: Then Moses and Aaron came before the Tent of Meeting[a].
translation:
  language: zh_hans
  text: 于是，摩西和亚伦来到会幕前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“到会幕的面前。”
    reason: 说明原文אֶל־פְּנֵי的字面表达；正文采用自然中文“来到会幕前”，并保留并未进入会幕的空间含义。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 于是……来到
  rationale: 该叙事性连接形式推动情节发展，用“于是”承接上文；בוא在此表示来到某处，不宜具体化为“进入”，因为后面的介词短语指向会幕前。
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: 摩西和亚伦
  rationale: 采用现代中文圣经传统中通行的人名译法。希伯来文动词虽为单数形式，但复合主语明确包括摩西和亚伦，中文自然译为二人一同来到。
- source_word: אֶל־פְּנֵי
  choice: 来到……前
  rationale: 该表达字面为“到……的面前”，在这里表示走近并到达会幕前；“来到……前”自然简洁，同时不暗示他们进入会幕。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所设施在现代中文圣经语境中的通行名称，准确表达作为相会之帐幕的专指含义。
theological_decisions: []
