base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: zh_hans
  text: 祭司以利亚撒拿了那些被火烧死的人[b]所献的铜香炉[a]；这些香炉被锤成薄片，作为祭坛的包层[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “香炉”或译“火盘”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“那些被烧的人”，指上文被火吞灭的人。
    reason: lexical_alternative
  - marker: c
    text: “包层”或译“覆盖层”“镶面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: 香炉
  rationale: 指盛放炭火和香料的礼仪器具；“香炉”在现代汉语中清楚自然，也符合本段献香的语境。
- source_word: הַנְּחֹשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת 可指铜或青铜；汉语圣经礼仪器物语境通常以“铜”概括表达，不武断限定合金成分。
- source_word: הִקְרִיבוּ
  choice: 献上
  rationale: קרב 的使役式在礼仪语境中有献上、呈献之意；“献上”准确表达这些香炉此前用于献香。
- source_word: הַשְּׂרֻפִים
  choice: 那些被火烧死的人
  rationale: 保留 שׂרף 被动分词“被烧的人”的具体含义，并依据上文用“被火烧死”清楚说明其结局，不直接加入他们的身份名称。
- source_word: וַיְרַקְּעוּם
  choice: 有人把这些香炉锤成薄片
  rationale: רקע 表示锤打、锤薄金属；希伯来文使用第三人称复数而未明说施事者，“有人”保留这种不确定性，并明确宾语是香炉。
- source_word: צִפּוּי
  choice: 包层
  rationale: 指覆盖或包覆在物体表面的金属层；“包层”比泛称“遮盖物”更符合金属加工及祭坛的语境。
- source_word: לַמִּזְבֵּחַ
  choice: 作为祭坛的包层
  rationale: 介词 לְ 在此表示用途或结果，即锤出的金属片用来包覆祭坛。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“有人”自然呈现希伯来文未明确指出施事者的复数动词；分号清楚区分取香炉与随后加工香炉两个连续动作。
