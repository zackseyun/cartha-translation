  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: zh_hans
  text: 作为给以色列人的提醒[a]，免得任何不是亚伦后裔的外人[b]接近，在雅威面前烧香，也免得他变得像可拉和他的会众一样，正如雅威借摩西[c]对他[d]所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提醒”也可译作“纪念物”或“记念”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“外人”指没有获准承担祭司职分的人，不一定是异族人。
    reason: cultural_note
  - marker: c
    text: 希伯来原文直译为“借摩西的手”，意思是“借着摩西”。
    reason: lexical_alternative
  - marker: d
    text: “他”很可能指亚伦。
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: 提醒
  rationale: 该名词指使人记住某事的事物，可译为“纪念”或“提醒”；本节用于警戒以色列人，“提醒”在现代汉语中自然，并保留其使人记念的功能。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 给以色列人
  rationale: “以色列人”是现代汉语对这一群体称谓的自然表达，也包含原文“以色列的子孙”所指的整体。
- source_word: אִישׁ זָר
  choice: 外人
  rationale: 祭司制度语境中的 זָר 指不属于获准执行该圣职之列的人，并非特指异族人；“外人”保留其相对于亚伦后裔的身份界线。
- source_word: מִזֶּרַע אַהֲרֹן
  choice: 不是亚伦后裔
  rationale: זֶרַע 在此表示血统与世系；“后裔”准确而符合现代汉语表达。
- source_word: יִקְרַב
  choice: 上前来
  rationale: 该动词表示靠近或上前，在敬拜礼仪语境中含有接近圣所、执行礼仪的意味；“上前来”兼顾空间动作和礼仪语境。
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: 烧香
  rationale: 这是指使香焚烧、献在神面前的祭司礼仪；“烧香”简洁、清楚。
- source_word: וְלֹא יִהְיֶה כְקֹרַח וְכַעֲדָתוֹ
  choice: 也免得他像可拉和他一党一样
  rationale: 保留原文“像……一样”的开放表达，不在正文中限定为行为相似或遭遇相同；“一党”自然表达与可拉结成一伙的群体。
- source_word: בְּיַד מֹשֶׁה
  choice: 借摩西
  rationale: “借……之手”是希伯来语表示中介或代理的惯用语；正文采用自然汉语“借摩西”，并以脚注说明字面形式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为专名的性质。
theological_decisions:
- issue: 祭司语境中 זָר 的身份范围
  choice: 外人
  alternative: 异族人／陌生人
  rationale: 本节明确以是否出自亚伦后裔为界，所禁止的是未经授权承担祭司职分的人；译作“异族人”会误导读者把重点理解为民族身份。
- issue: “像可拉和他一党一样”的含义
  choice: 保留比较表达，不明说是遭遇相同下场
  alternative: 落得与可拉及其同党一样的下场
  rationale: 上下文可能侧重可拉一党的结局，但原文只说“成为／像……一样”；正文不把这一可能含义扩充为唯一解释。
- issue: 末尾 לוֹ 的指代
  choice: 译作“对他”，保留代词
  alternative: 对亚伦／关于他
  rationale: 该阳性单数代词在语境中很可能指亚伦，但原句没有在此重提姓名；正文保留代词，并用脚注交代可能指向。
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名，音译为“雅威”可显明其专名性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“免得……也免得……”体现原文目的结构；末句保留“对他”的指代张力，并用脚注说明。所有脚注标记均置于相关正文词语之后。
