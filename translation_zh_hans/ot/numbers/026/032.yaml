base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/032.yaml
  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: zh_hans
  text: 示米大的，有示米大族；希弗的，有希弗族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: 属示米大的
  rationale: 本节承接人口统计名单中省略而重复的格式；用“属……的”补明由该祖先而出的宗族关系，比直译为“和示米大”更符合现代汉语。人名采用“示米大”。
- source_word: מִשְׁפַּ֖חַת
  choice: 族
  rationale: מִשְׁפָּחָה 在支派人口统计中指支派内部的亲族群体；“族”简洁自然，也能区别于一般意义上的家庭。
- source_word: הַ/שְּׁמִידָעִי
  choice: 示米大族
  rationale: 该派生形式表示与示米大相关、由他而出的群体。汉语不宜机械复制族称后缀，译作“示米大族”清楚自然。
- source_word: וְ/חֵפֶר
  choice: 属希弗的
  rationale: 连接词引出名单中的下一项；按上下文补出“属……的”，呈现希伯来文省略格式所表达的宗族来源。人名采用“希弗”。
- source_word: הַֽ/חֶפְרִי
  choice: 希弗族
  rationale: 该族称表示由希弗而出的群体，译作“希弗族”符合现代汉语族谱和人口统计语境。
theological_decisions: []
translation_notes:
  register: 采用庄重、简明的现代标准汉语，并保留原文人口统计名单的平行结构。两个分句均用“属某人的，有某族”，既补足希伯来文的省略关系，又避免把宗族误解为核心家庭。
