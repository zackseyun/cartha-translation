base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/025.yaml
  text: 'These are the clans of Issachar according to those numbered from them: sixty-four thousand and three hundred.'
translation:
  language: zh_hans
  text: 这些是以萨迦的各宗族；按其中被数点的人数[a]，共有六万四千三百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按他们的数目”或“按他们登记的人数”。希伯来文这一表达指从这些宗族中登记并数点的人。
    reason: 保留 לִפְקֻדֵיהֶם 在句法与词义上的可译空间，并说明其人口普查含义。
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 复数指示词引出总结句；希伯来文是无系词句，现代汉语自然补出“是”。
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: 在支派人口统计的语境中，指支派内部由亲族构成的群体；“宗族”比普通的“家庭”更准确，“各”体现复数。
- source_word: יִשָּׂשכָר
  choice: 以萨迦
  rationale: 采用现代中文圣经传统中通行的人名、支派名译法。
- source_word: לִפְקֻדֵיהֶם
  choice: 按其中被数点的人数
  rationale: 该词由介词 לְ、源自 פקד 的数点用语及第三人称阳性复数后缀构成，指这些宗族中登记受点的人。此译法既保留人口普查语境，也使现代汉语通顺；脚注保留结构上的其他理解。
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: 六万四千三百人
  rationale: 按现代汉语数词次序准确表达64,300，并补“人”说明人口统计的计量对象。
theological_decisions: []
