- source_word: לִפְקֻדֵיהֶם
  choice: 其中被数点的
  rationale: 该词指按登记、数点所得的人数；译文保留被动含义，并用“其中”表达所属范围，使现代汉语自然清楚。
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 四万零五百人
