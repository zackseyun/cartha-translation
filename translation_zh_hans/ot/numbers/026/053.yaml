  yaml_path: translation/ot/numbers/026/053.yaml
  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: zh_hans
  text: 要按名字的数目[a]，把这地分给这些人作产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按人数”；原文为“按名字的数目”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: 给这些人
  rationale: 介词 לְ 与复数指示代词连用，指明土地分配的领受者；译作“给这些人”符合现代汉语表达。
- source_word: תֵּחָלֵק
  choice: 要……分
  rationale: חלק 的尼法勒未完成式表达被动分配之意；汉语用“把”字句自然呈现这一命令性安排。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 定冠词修饰 אֶרֶץ，在本段语境中指将要分配的特定土地；“这地”简洁而明确。
- source_word: בְּנַחֲלָה
  choice: 作产业
  rationale: נַחֲלָה 指经分配而承受的世袭土地或产业；“作产业”兼顾土地分配和承受产业的含义。
- source_word: בְּמִסְפַּר
  choice: 按……的数目
  rationale: 介词 בְּ 在此表示分配所依据的标准；“按……的数目”准确传达计数原则。
- source_word: שֵׁמוֹת
  choice: 名字
  rationale: 原文直译为“名字”。正文保留这一具体措辞，不直接改写为“人数”，并用脚注说明其语境含义。
