base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: zh_hans
  text: 人数多的群体，你要多给产业；人数少的群体，你要少给产业。每个群体所得的产业，要按照其中被数点的人数分配。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末句较简练，直译近似“每一个，要按他被数点的人数给他的产业”。这里的单数表达具有分配作用，所指可能是各支派、宗族或其他受地群体。
    reason: 说明原文的单数集体表达及“群体”所保留的范围，不把它限定为某一级组织。
lexical_decisions:
- source_word: לָרַב
  choice: 人数多的群体
  rationale: רַב在数点并分地的语境中作名词性用法，指人数较多的一方；补出“群体”可使现代汉语清楚自然，又不限定为支派或宗族。
- source_word: תַּרְבֶּה
  choice: 多给
  rationale: 这是רבה的使役式，在分配土地的语境中表示使所得增多；“多给”比直译“增多”更符合现代汉语。
- source_word: נַחֲלָתוֹ
  choice: 产业
  rationale: נַחֲלָה在本段指依法分得并承受的土地产业；“产业”保留其继承和持有的含义。
- source_word: וְלַמְעַט
  choice: 人数少的群体
  rationale: מְעַט与前面的רַב平行，指人口较少的一方；译文明确比较的是数点人数。
- source_word: תַּמְעִיט
  choice: 少给
  rationale: 这是מעט的使役式，表示使所分得的份额较少；“少给”简洁地表达按人数缩小份额。
- source_word: אִישׁ
  choice: 每个群体
  rationale: אִישׁ字面为阳性单数“每一个”，此处作分配性用法，结合后面的复数“被数点的人”指各个受地群体。译作“每个群体”避免误解为每名男子单独领地。
- source_word: לְפִי פְקֻדָיו
  choice: 按照其中被数点的人数
  rationale: לְפִי表示“按照、依比例”，פְקֻדָיו直指属于该群体的被数点者；此译保留数点概念，并清楚表达产业与人口数相称。
- source_word: יֻתַּן
  choice: 获分
  rationale: נתן的被动式字面为“被给予”；在土地分配语境中，“获分产业”自然表达被动受领，又不把动作过度解释为特定制度术语。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“多给／少给”形成清楚对称；“群体”是语境性补足，用来承接单数集体表达，同时避免擅自限定为支派或宗族。
