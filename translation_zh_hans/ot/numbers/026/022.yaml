  text: 'These were the clans of Judah according to those numbered of them: seventy-six thousand five hundred[a].'
translation:
  language: zh_hans
  text: 这些是犹大的各宗族；按登记人数计算，共七万六千五百人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按其数目”。希伯来语 לִפְקֻדֵיהֶם 是人口统计用语，指登记或数点的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 复数指示词用于引出本段人口统计的总结；汉语无需为叙事语境另加过去时标记。
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: 在支派人口统计中，该词指支派内部按血缘划分的群体；“宗族”比现代汉语的“家庭”更准确。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的人名及支派名译法。
- source_word: לִפְקֻדֵיהֶם
  choice: 中被数点的人
  rationale: 保留 פקד 在人口统计语境中“登记、点数”的被动含义，并以“中”表达后缀所关联的群体范围，使中文自然清楚。
- source_word: שִׁשָּׁה וְשִׁבְעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 七万六千五百人
  rationale: 按现代汉语数词次序准确表达总数，并补出量词“人”以符合人口统计语境。
