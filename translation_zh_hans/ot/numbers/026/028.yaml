- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族来说
  rationale: מִשְׁפָּחָה在民数记人口统计和支派编组语境中指支派以下的宗族群体，不宜按现代核心家庭理解；前缀לְ表示依照宗族分类。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经人名及支派名的通行译法。
- source_word: וְאֶפְרָיִם
  choice: 和以法莲
  rationale: 直接表达连接词与专名，并采用现代中文圣经的通行译名。
