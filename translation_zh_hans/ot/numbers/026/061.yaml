base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/061.yaml
  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: zh_hans
  text: 但拿答和亚比户在雅威面前献凡火[a]时死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“异火”“外来的火”。这里的希伯来文指未经许可在雅威面前献上的火。
    reason: 说明 אֵשׁ זָרָה 的译法及其祭祀语境含义。
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 动词虽为单数形式，却位于复合主语“拿答和亚比户”之前，这是希伯来语常见句法；汉语按复合主语自然译为“死了”。
- source_word: נָדָב וַאֲבִיהוּא
  choice: 拿答和亚比户
  rationale: 采用现代中文圣经语境中通行且易辨认的人名音译。
- source_word: בְּהַקְרִיבָם
  choice: 献……时
  rationale: 介词 בְּ 与带人称后缀的不定式连用，在此表达时间关系；“献……时”既简洁自然，也保留祭祀语境。
- source_word: אֵשׁ זָרָה
  choice: 凡火
  rationale: 保留这一祭祀术语的传统简洁表达及原文中“异于合宜之物”的张力，不在正文中把含义完全解释为“未经许可”；脚注说明其语境含义。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 在礼仪语境中直译为“在……面前”；神名 יְהוָה 按其专名译作“雅威”。
- source_word: וַ
  choice: 但
  rationale: 连接词在此引出族谱叙述中的例外事件；“但”自然体现与上下文的转折关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；采用“雅威”作为现代汉语对 Yahweh 的音译，以保留其专名性质。
- issue: אֵשׁ זָרָה 所表达的礼仪性质
  choice: 正文译“凡火”，脚注说明为未经许可的火
  alternative: 正文直接译“未经许可的火”
  rationale: זָרָה 本身可表达陌生、外来或不合规定之意；正文保留词义张力，脚注结合祭祀语境说明，而不把解释性含义悄然写入正文。
translation_notes:
  register: 采用简洁、庄重而现代的叙事语体。“凡火”作为较凝练的礼仪用语由脚注释义，避免正文冗长；“雅威”保留神名的专名性质。
