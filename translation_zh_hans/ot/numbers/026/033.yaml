  text: וּ/צְלָפְחָ֣ד בֶּן חֵ֗פֶר לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/שֵׁם֙ בְּנ֣וֹת צְלָפְחָ֔ד מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: zh_hans
  text: 希弗的儿子西罗非哈没有儿子[a]，只有女儿；西罗非哈的女儿名叫玛拉、挪阿[b]、曷拉、密迦和得撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“没有儿子归他所有，只有女儿。”
    reason: lexical_alternative
  - marker: b
    text: 这里的“挪阿”是西罗非哈一个女儿的名字，不是洪水记载中的“挪亚”。这两个名字在希伯来文中也不相同。
    reason: cultural_note
lexical_decisions:
- source_word: וּצְלָפְחָד בֶּן חֵפֶר
  choice: 希弗的儿子西罗非哈
  rationale: 按现代汉语自然语序表达父子关系；句首 וּ 仅承接上下文，不另译为带有时间含义的“现在”。人名采用中文圣经中通行的音译。
- source_word: לֹא הָיוּ לוֹ בָּנִים כִּי אִם בָּנוֹת
  choice: 没有儿子，只有女儿
  rationale: 将希伯来语直译为“没有儿子归他所有，除女儿以外”的领有结构转换为自然汉语，同时保留儿子与女儿之间明确的对照。
- source_word: וְשֵׁם בְּנוֹת צְלָפְחָד
  choice: 西罗非哈的女儿名叫
  rationale: 希伯来语“名”为单数，但在此统领多个女儿的名字；“名叫”简洁自然，也准确引出名单。
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: 玛拉、挪阿、曷拉、密迦和得撒
  rationale: 依照中文圣经传统音译五个人名，并用现代汉语列举标点清楚呈现名单。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“没有儿子，只有女儿”保留原文对继承问题至关重要的性别对照；分号对应原文由家庭状况转入女儿名单的推进。
