base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: zh_hans
  text: 西布伦的子孙，按宗族：属西烈的，是西烈族；属伊伦的，是伊伦族；属雅利的，是雅利族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  choice: 西布伦的子孙
  rationale: בְּנֵי 字面为“儿子们”，但在本章人口统计的语境中指西布伦的部族后裔；译作“子孙”既保留谱系关系，也避免误解为仅指其亲生儿子。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族如下
  rationale: מִשְׁפָּחָה 在人口统计中指支派内部的宗族单位；前缀 לְ 带有分类、分列之意，译作“按宗族”自然准确。“如下”补足汉语列举句式。
- source_word: לְסֶרֶד
  choice: 属西列的
  rationale: 此处 לְ 引出宗族所源自的祖先；“属……的”符合中文人口统计名单的表达。西列采用现代中文圣经中常见的人名音译。
- source_word: מִשְׁפַּחַת הַסַּרְדִּי
  choice: 西列族
  rationale: 后半为由西列之名形成的宗族称谓；中文用“人名＋族”简洁表达该宗族。
- source_word: לְאֵלֹון
  choice: 属以伦的
  rationale: 沿用本节重复的名单公式，以“属……的”表达宗族源流。
- source_word: מִשְׁפַּחַת הָאֵלֹנִי
  choice: 以伦族
  rationale: 将源自以伦的宗族称谓译为“以伦族”，与全节格式一致。
- source_word: לְיַחְלְאֵל
  choice: 属雅利的
  rationale: יַחְלְאֵל 采用现代中文圣经较常见的传统音译“雅利”；前缀 לְ 按宗族来源译为“属……的”。
- source_word: מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: 雅利族
  rationale: 将由雅利之名构成的宗族称谓译为“雅利族”，保持重复结构清楚简练。
theological_decisions: []
