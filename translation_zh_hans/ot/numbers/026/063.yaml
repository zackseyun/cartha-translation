revisions:
- from: 这些就是摩西和祭司以利亚撒所数点的人。他们在摩押平原，就是约旦河边、耶利哥对面[b]，数点了以色列人[a]。
  to: 这些是摩西和祭司以利亚撒所数点的人；他们在耶利哥附近的约旦河边、摩押平原数点了以色列人[a][b]。
  rationale: 修订仅澄清地理短语的句法并保留其可争议的介词关系：正文采用较宽泛、自然的“耶利哥附近的约旦河边”，脚注保留“耶利哥对面”的传统理解。其余措辞维持草稿对原文重复的数点用语、普通“祭司”称号及“以色列人”民族称谓的忠实处理。
