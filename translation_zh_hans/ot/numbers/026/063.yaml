base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: zh_hans
  text: 这些是摩西和祭司以利亚撒所数点的人；他们在耶利哥附近的约旦河边、摩押平原数点了以色列人[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”原文直译为“以色列的众子”，也可译作“以色列子孙”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在约旦河边、耶利哥对面的摩押平原”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: 所数点的人
  rationale: 这是פקד的构造形式，在人口普查语境中指被登记、清点的人。“所数点的人”既保留人的指称，也与下文同词根的动词形成呼应。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 希伯来文仅称以利亚撒为“祭司”，没有使用“大祭司”这一称号，因此不增添原文未明说的职衔。
- source_word: פָּקְדוּ
  choice: 数点了
  rationale: 在民数记的人口普查语境中，“数点”准确而简洁，并与פְּקוּדֵי译法保持词汇呼应。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，这里作为民族和盟约群体称谓，现代汉语用“以色列人”自然清楚；脚注保留字面信息。
- source_word: בְּעַרְבֹת מוֹאָב
  choice: 在摩押平原
  rationale: עֲרָבוֹת在这一固定地理表达中指平原或旷野地带；“摩押平原”是清楚且通行的译法。
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: 约旦河边、耶利哥对面
  rationale: 该短语说明摩押平原相对于约旦河和耶利哥的位置。“约旦河边、耶利哥对面”符合叙事地理，也保留介词短语可能表达的邻近与相对位置。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的性别及盟约群体表达
  choice: 以色列人
  alternative: 以色列的众子／以色列子孙
  rationale: 本节承接人口普查，实际计数对象受上下文规定；此处民族称谓不宜在汉语中生硬译作“众子”，以免误解为雅各的亲生儿子。脚注说明原文字面形式，不抹去其男性、谱系性的表达。
- issue: 以利亚撒的职衔
  choice: 祭司
  alternative: 大祭司
  rationale: 原文明确使用普通称号“祭司”。即使上下文可表明以利亚撒承担大祭司职分，正文仍不加入原文没有的专门称号。
- issue: 耶利哥与约旦河的地理关系
  choice: 约旦河边、耶利哥对面
  alternative: 约旦河边、靠近耶利哥
  rationale: 希伯来语短语简略，介词关系可作邻近理解，也可结合地理位置理解为在耶利哥对面。正文采用较具体且符合当地地理的表达，脚注保留另一种译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“数点”符合《民数记》人口普查语境；用两个短句避免关系从句在汉语中显得拖沓。所有脚注标记均置于其所解释的词语或地理短语之后。
