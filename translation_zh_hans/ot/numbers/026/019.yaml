  text: 'The sons of Judah: Er and Onan[a]. But Er and Onan died in the land of Canaan.'
translation:
  language: zh_hans
  text: 犹大的儿子是珥和俄南[a]；但珥和俄南死在迦南地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大的儿子是珥和俄南；珥和俄南死在迦南地。”希伯来语连词也可直接译作“而”或不显明转折；正文用“但”表达上下文中的对比意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是“儿子”的复数构造形式，处于家谱名单中；译作“儿子”既直接自然，也保留男性后裔的具体含义。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 人名采用现代中文圣经读者熟悉的标准译名。
- source_word: עֵר
  choice: 珥
  rationale: 人名采用现代中文圣经传统中通行的译名。
- source_word: וְ/אוֹנָן
  choice: 和俄南
  rationale: 连词与人名直接译为并列结构；人名采用通行译名“俄南”。
- source_word: וַ/יָּמָת
  choice: 但……死了
  rationale: 该形式叙述过去发生的死亡事件。希伯来语连词本可直译为“而/和”，但上下文由列名转入说明二人死亡，具有转折意味，因此正文用“但”自然体现语篇对比，同时以脚注保留直译可能。
- source_word: בְּ/אֶרֶץ
  choice: 在……地
  rationale: 介词与“地、土地”构成地理表达，中文自然译为“在……地”。
- source_word: כְּנָעַן
  choice: 迦南
  rationale: 地名采用现代中文圣经传统中通行的译名。
