base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/043.yaml
  text: All the families of the Shuhamites[a], according to those numbered among them, were sixty-four thousand four hundred.
translation:
  language: zh_hans
  text: 书含族的各宗族，按被数点的人数计算，共有六万四千四百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל מִשְׁפְּחֹת
  choice: 各宗族
  rationale: כָּל修饰复数“宗族”，在这里概括书含族之下的全部宗族；“各宗族”符合现代汉语人口统计语境，也保留其支族、宗族层面的含义。
- source_word: הַשּׁוּחָמִי
  choice: 书含族
  rationale: 这是由“书含”构成的族称，指书含的后裔群体；译作“书含族”既保留专名，也清楚表达群体身份。
- source_word: לִפְקֻדֵיהֶם
  choice: 按其中被数点的人计算
  rationale: 该词来自פקד，在人口普查语境中指被登记、数点的人；此译法表明总数以受数点者为依据，而非抽象的编号。
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 六万四千四百人
  rationale: 依现代汉语数字顺序准确表达总数，并补出量词“人”，使人口统计表述自然清楚。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宗族”比“家庭”更准确地体现民数记人口普查中的谱系群体；句式简洁，并保留原文先指群体、后报数目的结构。
