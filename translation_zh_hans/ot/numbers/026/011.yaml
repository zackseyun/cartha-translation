- source_word: קֹרַח
  choice: 可拉
  rationale: 按现代中文圣经人名的通行译法音译该专名。
- source_word: לֹא
  choice: 没有
  rationale: 这是普通否定词，与完成式动词连用，表示所述死亡并未发生。
- source_word: מֵתוּ
  choice: 死
  rationale: מות的基本义是“死”；上下文无需强化为“灭亡”，保留简洁直接的叙事表达。
