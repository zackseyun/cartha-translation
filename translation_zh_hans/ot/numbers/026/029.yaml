  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: zh_hans
  text: 玛拿西的子孙：玛吉的后裔为玛吉族；玛吉生基列；基列的后裔为基列族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: 玛拿西的子孙
  rationale: בְּנֵי 字面为“儿子们”，但在支派人口统计和族谱语境中泛指后裔；译作“子孙”能避免误解为仅列亲生儿子，同时保留谱系关系。
- source_word: לְמָכִיר / לְגִלְעָד
  choice: 属玛吉的 / 属基列的
  rationale: 前缀 לְ 在本节的人口统计套语中引出相应的后裔支系；“属……的”自然呈现支系归属，并保持两处平行。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: 这里指支派之下按祖先划分的宗族单位；现代汉语“族”简洁自然，也符合本章反复出现的统计格式。
- source_word: הַמָּכִירִי / הַגִּלְעָדִי
  choice: 玛吉族 / 基列族
  rationale: 这两个定冠词加族称表示由玛吉、基列而出的宗族；汉语以祖名加“族”清楚表达。
- source_word: וּמָכִיר הוֹלִיד אֶת־גִּלְעָד
  choice: 玛吉生了基列
  rationale: הוֹלִיד 是使役形的标准族谱用语，表示生育或成为父亲；“生了”简明、庄重，并保留原文直接的父系谱系陈述。
