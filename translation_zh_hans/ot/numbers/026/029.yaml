revisions:
- from: 玛拿西的子孙：属玛吉的，有玛吉族；玛吉生了基列；属基列的，有基列族。
  to: 玛拿西的子孙：玛吉的后裔为玛吉族；玛吉生基列；基列的后裔为基列族。
  rationale: 修订仅调整汉语名册句法与语体：以“后裔为……族”清楚呈现原文两处祖先支系及宗族名称的对应关系，并将“生了”改为较适合族谱文体的“生”。未改变谱系次序、人物名称或原文的简略表达。
