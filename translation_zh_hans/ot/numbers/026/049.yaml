  yaml_path: translation/ot/numbers/026/049.yaml
  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: zh_hans
  text: 属耶色的，有耶色族；属示冷的，有示冷族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: 属耶色的
  rationale: 前缀 לְ 在人口统计的重复句式中引出宗族始祖；译作“属……的”既表达归属关系，也符合现代中文家谱式列举。人名 יֵצֶר 按通行圣经译名音译为“耶色”。
- source_word: מִשְׁפַּחַת הַ/יִּצְרִי
  choice: 有耶色族
  rationale: מִשְׁפָּחָה 在支派人口统计中指支派之下的宗族单位，译作“族”简洁准确；הַיִּצְרִי 是由耶色之名构成的宗族称谓，因此译为“耶色族”。
- source_word: לְ/שִׁלֵּם
  choice: 属示冷的
  rationale: 与本节前半句采用相同的人口统计句式，表达以示冷为始祖的归属关系；שִׁלֵּם 音译为通行的“示冷”。
- source_word: מִשְׁפַּחַת הַ/שִּׁלֵּמִי
  choice: 有示冷族
  rationale: 该短语指由示冷得名的宗族；“示冷族”保留了原文人名与宗族称谓之间的构词联系。
