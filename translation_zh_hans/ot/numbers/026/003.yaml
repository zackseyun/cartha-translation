base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/003.yaml
  text: Moses and Eleazar the priest spoke to them in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: zh_hans
  text: 摩西和祭司以利亚撒在摩押平原、耶利哥附近的约旦河边[a]，对他们说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约旦河边、耶利哥对面”。
    reason: 希伯来语短语以耶利哥说明这段约旦河的位置，也可理解为隔河与耶利哥相对。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事动词引出直接引语；现代汉语用“对他们说”自然明晰，也避免把后面的 לֵאמֹר 生硬重复译为“说道”。
- source_word: מֹשֶׁה וְאֶלְעָזָר הַכֹּהֵן
  choice: 摩西和祭司以利亚撒
  rationale: 保留两人并列作主语，并将 הַכֹּהֵן 译为以利亚撒的明确职衔“祭司”；原文没有在此称他为“大祭司”。
- source_word: אֹתָם
  choice: 对他们
  rationale: 此处宾语代词指受话者；配合“说”译为“对他们”符合现代汉语表达。
- source_word: בְּעַרְבֹת מוֹאָב
  choice: 在摩押平原
  rationale: עֲרָבוֹת 指平坦的草原或旷野地带；“摩押平原”是准确、通俗且自然的地理名称。
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: 耶利哥附近的约旦河边
  rationale: 该短语说明地点在约旦河边，并以耶利哥为地理参照。“耶利哥附近”保留这种关系而不使正文过于拗口；“耶利哥对面”作为可能的具体理解收入脚注。
- source_word: לֵאמֹר
  choice: 对他们说：
  rationale: 该不定式用于引出随后话语。汉语以冒号自然承接下一节的直接内容，无须重复译作“说”。
