  naturalness: 原文草稿中以分号连接“希斯仑；从他出了希斯仑族”的方式形成残句，现代标准汉语读来生硬。以冒号后的平行名词短语列举人物及其宗族，更符合本章普查名单的文体。
  terminology: “法勒斯、希斯仑、哈母勒”均为中文圣经传统中通行且可接受的人名；“族”能恰当地表达此处的 מִשְׁפָּחָה（支派内的宗族单位）。
