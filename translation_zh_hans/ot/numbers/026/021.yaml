  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: zh_hans
  text: 法勒斯的儿子如下：希斯仑，希斯仑族；哈母勒，哈母勒族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 是
  rationale: 在这段人口普查的族谱套语中，היה 是系词，用来引出法勒斯的儿子及由他们而出的宗族；汉语用“是”自然简洁。
- source_word: בְנֵי פֶרֶץ
  choice: 法勒斯的儿子
  rationale: בְנֵי 在此指直接列出的男性后裔兼宗族祖先；译作“儿子”既保留希伯来文形式，也符合本段族谱结构。
- source_word: פֶרֶץ
  choice: 法勒斯
  rationale: 采用现代中文圣经中较通行的人名译法，并与相关族谱名称保持一致。
- source_word: לְחֶצְרֹן
  choice: 希斯仑；从他出了
  rationale: 前缀 לְ 在人口普查公式中标明宗族归属或源流。汉语以人名后接“从他出了……族”清楚表达该宗族源自此人。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: מִשְׁפָּחָה 在民数记人口普查语境中指支派之下的亲族单位；“族”比现代汉语的“家庭”准确，也比“宗族”更贴合经文反复列举的简洁格式。
- source_word: הַחֶצְרֹנִי
  choice: 希斯仑族
  rationale: 该族称形式指希斯仑的后裔群体；以“人名＋族”构成自然、明确的现代中文族称。
- source_word: לְחָמוּל
  choice: 哈母勒；从他出了
  rationale: 与 לְחֶצְרֹן 相同，לְ 表示由此人形成或归属于他的宗族，译法保持两个分句平行。
- source_word: הֶחָמוּלִי
  choice: 哈母勒族
  rationale: 该族称形式指哈母勒的后裔群体；译作“哈母勒族”清楚保留其宗族含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用两个平行短句呈现希伯来文人口普查公式；“从他出了……族”明示 לְ 与族称所表达的源流关系，同时避免把 מִשְׁפָּחָה 误解为现代核心家庭。
