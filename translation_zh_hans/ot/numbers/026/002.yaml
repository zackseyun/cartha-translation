  rationale: 修订恢复בְּנֵי יִשְׂרָאֵל的家族性称谓，并重组中文句法，使年龄、父家和军事范围都明确修饰登记对象。“出去作战的”保留原文在军事人口统计公式中的简洁分词表达，未加入“能”或“适合”等原文未明说的资格判断。
