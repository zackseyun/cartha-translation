base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: zh_hans
  text: “你们要数点以色列众子孙全会众的人数[a]：从二十岁以上，按父家，凡以色列中出去作战的，都要登记。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“抬起以色列众子孙全会众的头”，这是“数点人数、进行人口统计”的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: 数点……的人数
  rationale: 原文直译为“抬起……的头”，是统计人口的惯用语。中文用“数点……的人数”既清楚表达其含义，也保留《民数记》人口登记的正式语体。
- source_word: כָּל־עֲדַת בְּנֵי־יִשְׂרָאֵל
  choice: 以色列全会众
  rationale: עֵדָה 指作为整体的共同体或会众；“以色列全会众”自然、庄重，并能涵盖“以色列子孙”这一群体称谓。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 凡二十岁以上的
  rationale: 准确表达年龄下限公式，在现代汉语中简洁自然。
- source_word: לְבֵית אֲבֹתָם
  choice: 按父家登记
  rationale: בֵּית אָב 是以父系家族为组织单位的“父家”；补出“登记”使它与数点人口的行动关系明确，而不改变原意。
- source_word: כָּל־יֹצֵא צָבָא
  choice: 所有出去作战的人
  rationale: 贴近原文“凡出去从军／作战者”的表达，不把隐含的服役资格进一步明确化为“适合服役”，从而保留原文措辞的范围。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列中
  rationale: 表达群体范围，比地理性的“在以色列境内”更符合这里的人口统计语境。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的家族性称谓及其性别含义
  choice: 以色列全会众
  alternative: 以色列众子孙／以色列人全会众
  rationale: 该短语在这里指以色列共同体，而实际登记范围随后由“二十岁以上”和“出去作战的人”限定。译作“以色列全会众”避免在中文中把固定民族称谓误解成仅强调直系儿子，同时没有消除后文军事登记所具有的男性语境。
- issue: כָּל־יֹצֵא צָבָא 是实际出战者还是具备服役资格者
  choice: 所有出去作战的人
  alternative: 所有能出去作战的人／所有适合服兵役的男子
  rationale: 原文分词结构直陈“出去作战的人”，在语境中可指承担军役者，但没有明说“有能力”或“适合”。正文保留这种简练和潜在张力，不加入资格判断。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“数点”“会众”“父家”保留摩西五经的制度性和家族组织色彩；句式按现代汉语调整，以避免生硬直译。
