  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: zh_hans
  text: 比利亚的子孙中：希别的后裔成了希别族；玛结的后裔成了玛结族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי בְרִיעָה
  choice: 比利亚的子孙
  rationale: 这里的 לִבְנֵי 引出比利亚一系的下属宗族。“子孙”既保留谱系关系，也比仅指亲生儿子的“儿子”更符合人口统计语境。人名 בְרִיעָה 按传统汉译作“比利亚”。
- source_word: לְחֶבֶר
  choice: 属希别的
  rationale: 在反复出现的人口统计句式中，前缀 לְ 标示以该祖先为名、归属于其谱系的群体；译作“属……的”自然地表达宗族归属。חֶבֶר 按传统汉译作“希别”。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: 此词在支派人口统计中指支派内部的亲族单位；“族”简洁、庄重，并与中文圣经谱系用语相称。
- source_word: הַחֶבְרִי
  choice: 希别族
  rationale: 这是由“希别”构成的宗族称谓，指从希别而出的群体；中文以“人名＋族”清楚表达。
- source_word: לְמַלְכִּיאֵל
  choice: 属玛结的
  rationale: 同前一分句，לְ 表示该宗族归于玛结一系。מַלְכִּיאֵל 按传统汉译作“玛结”。
- source_word: הַמַּלְכִּיאֵלִי
  choice: 玛结族
  rationale: 该派生称谓指从玛结而出的宗族，以“玛结族”保持与“希别族”平行的结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的人口统计体例；两个分句保持严格平行。“属……的，有……族”明确表达祖先与宗族的关系，同时避免把 מִשְׁפָּחָה 缩小为现代核心家庭。人名沿用现代中文圣经中常见的传统译名。
