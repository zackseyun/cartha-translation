base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/042.yaml
  text: 'These were the sons of Dan by their clans: of Shuham[a], the clan of the Shuhamites. These were the clans of Dan by their families.'
translation:
  language: zh_hans
  text: 以下是但的子孙[a]，按宗族而列：书含的后裔，是书含族。这些是但的各宗族，按他们的宗族而列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“但的儿子们”；在这里的宗族人口统计用语中，也可指但的后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְנֵי דָן
  choice: 以下是但的子孙
  rationale: בְנֵי 字面为“儿子们”，但在支派谱系和人口统计语境中可泛指后裔；译作“子孙”能自然表达这里的群体性含义，并以脚注保留字面信息。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה 在民数记的人口统计语境中指支派之下的宗族单位；“按宗族”简洁保留分类公式。
- source_word: לְשׁוּחָם
  choice: 属书含的
  rationale: 此处 לְ 在谱系公式中表示归属或出自某位祖先；“属书含的”符合中文宗族名单的表达。
- source_word: מִשְׁפַּחַת הַשּׁוּחָמִי
  choice: 书含族
  rationale: 族称 הַשּׁוּחָמִי 指书含的后裔群体；中文以祖名加“族”自然、明确。
- source_word: אֵלֶּה מִשְׁפְּחֹת דָּן
  choice: 这些就是但的各宗族
  rationale: 保留希伯来文总结性的重复，并将复数 מִשְׁפְּחֹת 明确译为“各宗族”。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 是按他们的家系划分的
  rationale: 原文末尾重复同一分类短语。为避免中文出现“各宗族按宗族”的生硬同语反复，以“家系”表达同一宗族谱系概念，同时保留总结公式。
