base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: zh_hans
  text: 亚设的子孙，按宗族如下：属音拿的，有音拿族；属亦施韦的，有亦施韦族；属比利亚的，有比利亚族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: 亚设的子孙
  rationale: בְּנֵי 字面为“儿子们”，但本节人口普查的谱系公式着眼于由这些祖先而出的宗族；译作“子孙”既符合现代汉语，也不误解为只列亚设的亲生儿子。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族如下
  rationale: מִשְׁפָּחָה 在民数记人口普查语境中指支派内部的宗族单位，并非现代意义上的小家庭；“按宗族”准确而自然。
- source_word: לְיִמְנָה ... מִשְׁפַּחַת הַיִּמְנָה
  choice: 属音拿的，有音拿族
  rationale: 前缀 לְ 在重复的谱系公式中引出宗族祖先；希伯来语后项为由人名派生的宗族称谓。汉语以“属……的，有……族”清楚呈现两者关系。
- source_word: לְיִשְׁוִי ... מִשְׁפַּחַת הַיִּשְׁוִי
  choice: 属亦施韦的，有亦施韦族
  rationale: יִשְׁוִי 为人名，按马所拉文本音译；宗族名在汉语中自然地用同一专名加“族”表示。
- source_word: לִבְרִיעָה ... מִשְׁפַּחַת הַבְּרִיעִי
  choice: 属比利亚的，有比利亚族
  rationale: 保留祖先名比利亚，并以“比利亚族”表达派生的宗族称谓；无需在汉语中人为制造英语式族名后缀的差异。
