  text: These are the clans of Manasseh, and those numbered from them were fifty-two thousand seven hundred.
translation:
  language: zh_hans
  text: 这些是玛拿西的各宗族；其中被数点的，共有五万二千七百人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们中被登记的”。希伯来文采用由 פקד 构成的人口统计用语，指被数点或编入名册的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 复数指示语用于概括前列宗族；中文以“这些是”自然引出总结。
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: 在民数记人口统计的语境中，指支派内部的亲族群体；“宗族”比日常家庭意义的“家”或“家庭”准确。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经传统中通行的人名及支派名译法。
- source_word: וּפְקֻדֵיהֶם
  choice: 其中被数点的
  rationale: 保留פקד在 census 公式中的被动含义，指这些宗族中受统计、登记的人；“其中”自然表达后缀与前述宗族的关联。
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 五万二千七百
  rationale: 按现代汉语数字次序准确表达原文总数。
