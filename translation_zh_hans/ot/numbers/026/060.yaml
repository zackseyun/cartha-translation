  text: 亚伦得了儿子：拿答、亚比户[a]、以利亚撒和以他玛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“给亚伦生了拿答、亚比户、以利亚撒和以他玛。”原文在这一家谱句式中用单数被动动词引出一组名字；正文用“得了儿子”作自然表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלֵד לְאַהֲרֹן
  choice: 亚伦生了
  rationale: 原文是尼法勒被动式，直译为“给亚伦生了”，属于家谱用语。现代汉语用“亚伦生了”自然简洁，也不改成强调主动生育行为的“亚伦作父亲生下”。
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: 列名之间用顿号及“和”连接
  rationale: 重复的 אֶת 是宾语标记，汉语无需逐一译出；四个人名按现代汉语列举方式连接。
- source_word: נָדָב
  choice: 拿答
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: אֲבִיהוּא
  choice: 亚比户
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: אִיתָמָר
  choice: 以他玛
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
