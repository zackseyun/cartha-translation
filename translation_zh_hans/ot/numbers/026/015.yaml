base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: zh_hans
  text: 迦得的子孙，按宗族：洗分的宗族，是洗分族[a]；哈基的宗族，是哈基族；书尼的宗族，是书尼族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些英文传统在这里作“Ziphon”及相应的族名（参创世记46:16）；但本节马所拉文本作“Zephon”（צפון），故正文译作“洗分”。
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: 迦得的子孙
  rationale: בְּנֵי在支派人口统计的谱系语境中指由迦得而出的后裔；译作“子孙”既保留谱系关系，也比字面的“儿子”更符合现代汉语，因为名单涉及后代宗族。人名גָד采用通行译名“迦得”。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族如下
  rationale: מִשְׁפָּחָה在民数记人口统计中指支派之下的宗族单位。“按宗族”准确表达分类方式；补出“如下”，使汉语名单的引介自然清楚。
- source_word: לִצְפוֹן
  choice: 属洗分的
  rationale: 前缀ל在此重复的谱系格式中表示归属或出自某一祖先。“属……的”自然表达宗族归属。צְפוֹן按本节马所拉文本音译为“洗分”。
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: 洗分族
  rationale: 该结构是由祖先洗分之名构成的宗族称号。现代汉语以“人名＋族”简洁表达，不必机械译出单数族称形式。
- source_word: לְחַגִּי / מִשְׁפַּחַת הַחַגִּי
  choice: 属哈基的，有哈基族
  rationale: 保持希伯来文谱系列举的平行格式；חַגִּי采用通行汉语音译“哈基”，族称译为“哈基族”。
- source_word: לְשׁוּנִי / מִשְׁפַּחַת הַשּׁוּנִי
  choice: 属书尼的，有书尼族
  rationale: 保持前两项的句法平行；שׁוּנִי采用通行汉语音译“书尼”，其宗族称号译为“书尼族”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的谱系名单体。“宗族”用于民数记人口统计中的支派下属群体；以“属……的，有……族”重现原文三组平行结构。所有人名按中文圣经传统兼顾原文读音处理，并以脚注保留洗分／西斐的文本差异。
