base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: zh_hans
  text: 他们中被数点的共有两万三千人，都是从满一个月起的男性。他们没有在以色列子孙[a]中被数点，因为在以色列子孙中，没有产业分给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”；本节两处同。
    reason: 说明בְּנֵי יִשְׂרָאֵל也可按现代汉语习惯译作“以色列人”，并明确该说明适用于本节两次出现的该短语。
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: 他们中被数点的
  rationale: 在户口统计的语境中，指他们当中被登记、数点的人；保留与下文同一词根的对应，同时使用自然的现代汉语。
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: 二万三千名
  rationale: 准确表达基数；“名”适合统计人数。
- source_word: כָּל זָכָר
  choice: 都是……男性
  rationale: 下文包括满一个月的婴儿，因此“男性”比“男丁”或“男人”更准确。
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: 一个月以上
  rationale: 以简洁自然的现代汉语表达“从满一个月起及以上”的年龄门槛。
- source_word: הָתְפָּקְדוּ
  choice: 被数点
  rationale: 与本节开头的פקד词根保持一致，也符合民数记户口统计的语境。
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 在以色列子孙中
  rationale: 保留בני ישראל的家族性、盟约性表达；“在……中”自然传达בְּתוֹךְ。
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: 没有产业分给他们
  rationale: “产业”符合נַחֲלָה在应许之地分配语境中的含义；汉语主动式更自然，同时不改变未获分配这一重点。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的译法
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 正文保留原文“以色列的众子”所含的家族与盟约色彩，脚注提供更通行的现代汉语表达，不额外限定其神学含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“数点”保留民数记户口统计的传统术语，但句式力求自然；避免使用可能只指成年人的“男丁”。
