base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: zh_hans
  text: 便雅悯的子孙，按宗族如下：属比拉的，有比拉族；属亚实别的，有亚实别族；属亚希兰[a]的，有亚希兰族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马所拉文本作“亚希兰”；有些文本传统和英文译本作“亚希安”。正文依此处的希伯来文读法。
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯的子孙
  rationale: בְּנֵי 字面意为“儿子”，但在按宗族统计的谱系语境中涵盖后裔；译作“子孙”既符合现代汉语，也清楚表达支派成员与祖先的关系。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族如下
  rationale: מִשְׁפָּחָה 在此指支派内部的宗族单位。“按宗族”准确保留人口统计的分类方式，加“如下”使后面的列举在汉语中自然连贯。
- source_word: לְבֶלַע
  choice: 属比拉的
  rationale: 前缀 לְ 在这一谱系名单中引出各宗族的祖先或归属。“属……的”比直译为“给……”更符合汉语宗族列举方式。
- source_word: מִשְׁפַּחַת הַבַּלְעִי
  choice: 有比拉族
  rationale: הַבַּלְעִי 是由“比拉”构成的宗族称谓；汉语用“比拉族”简洁表达由他而出的宗族。
- source_word: לְאַשְׁבֵּל / מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: 属亚实别的，有亚实别族
  rationale: 沿用同一列举格式，既反映 לְ 所表达的归属关系，也以“亚实别族”传达派生的宗族名称。
- source_word: לַאֲחִירָם / מִשְׁפַּחַת הָאֲחִירָמִי
  choice: 属亚希兰的，有亚希兰族
  rationale: 正文依马所拉文本 אֲחִירָם 译作“亚希兰”，并以相同句式呈现其宗族。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“属……的，有……族”保留希伯来文重复而规整的宗族名单结构，又避免生硬逐词直译。脚注标记置于其实际涉及的“亚希兰”之后。
