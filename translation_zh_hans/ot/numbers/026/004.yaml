base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: zh_hans
  text: 二十岁及以上的人[a]，正如雅威[b]吩咐摩西和从埃及地出来的以色列人[c]那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译近似“从二十岁的人起，往上”；这是年龄下限的惯用说法，包括年满二十岁的人。
    reason: idiom_explanation
  - marker: b
    text: “雅威”音译希伯来语中的上帝之名יהוה；传统上也译作“耶和华”或以“主”代称。
    reason: alternative_reading
  - marker: c
    text: 希伯来语直译为“以色列的众子”，这里是指以色列人全体。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: 二十岁以上的人
  rationale: 这是希伯来语表示年龄下限的惯用语，直译近似“从二十岁的人起，往上”。译作“二十岁以上的人”符合现代汉语，并保留包括二十岁的含义。
- source_word: כַּאֲשֶׁר
  choice: 照……的
  rationale: 表示与先前命令相符；结合本节承接上文的句法，用“照……的”自然地连接前文。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 该动词表达具有权威的命令。“吩咐”在现代中文圣经语体中庄重自然，且未削弱命令的力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名音译四字神名，保留原文使用上帝名字而非称号这一特点。
- source_word: אֶת מֹשֶׁה
  choice: 摩西
  rationale: אֶת是直接宾语标记，中文无需另译；摩西是“吩咐”的宾语。
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 和……以色列人
  rationale: 字面为“以色列的众子”，在这里是全体百姓的族群名称，现代汉语通常译作“以色列人”。
- source_word: הַיֹּצְאִים מֵאֶרֶץ מִצְרָיִם
  choice: 那些从埃及地出来的
  rationale: 定冠词加分词构成限定语，指从埃及出来的出埃及一代；“从埃及地出来”保留了介词和地理表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。音译为“雅威”既保留专名性质，也避免以称号“主”代替原文；“耶和华”是传统音译，但较不能反映现今通常重构的读音。
- issue: “从埃及地出来的”所修饰的对象
  choice: 修饰“以色列人”
  alternative: 把它视为引出下一段名单的独立主语
  rationale: 按本节现有马所拉文本的紧邻句法，定冠词分词短语最自然地限定“以色列人”。不过本节处于引语与名单交界处，句法较突兀，因此不在正文中补入原文没有的“如下”等成分。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“照……的”有意保留本节承接上一节“数点”的未完句式；不擅自补出“要数点”或“名单如下”，以免消除马所拉文本在段落交界处的句法张力。
