  text: וּ/בְ/אֵ֨לֶּה֙ לֹא הָ֣יָה אִ֔ישׁ מִ/פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אַהֲרֹ֖ן הַ/כֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/מִדְבַּ֥ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: zh_hans
  text: 但在这些人中，没有一个是从前摩西和祭司亚伦在西奈旷野数点以色列子孙时所数点的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “但”或译“并且”；原文连词本可作一般连接，但这里可能表示与上节的对比。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: 但在这些人中
  rationale: 前缀连词可译“并且”，但本节与上文形成对照，故用“但”；“在这些人中”保留介词所表达的范围。
- source_word: לֹא הָיָה אִישׁ
  choice: 没有一个
  rationale: 这是表示无一人存在的希伯来语表达；现代汉语用“没有一个”自然且保留强调作用。
- source_word: מִפְּקוּדֵי
  choice: 从前……所数点的人
  rationale: 该词源于表示清点、登记的 פקד，所指是先前人口统计中被数点的人，而不是抽象的统计数字。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 原文仅称亚伦为“祭司”，没有“⼤祭司”一词，因此不作增译。
- source_word: אֲשֶׁר פָּקְדוּ
  choice: 摩西和祭司亚伦……数点
  rationale: 关系从句的主语是摩西和亚伦；调整为符合现代汉语习惯的定语结构，同时保留施事关系。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文家族性称谓“以色列的众子”，采用中文圣经语体中清楚而庄重的“以色列子孙”。
- source_word: בְּמִדְבַּר סִינָי
  choice: 在西奈旷野
  rationale: מִדְבָּר 指旷野或荒野；“西奈旷野”简洁自然，并准确表达原文的属格关系。
theological_decisions:
- issue: אִישׁ 与 בְּנֵי יִשְׂרָאֵל 的性别及群体指向
  choice: 将 אִישׁ 译作“一个”，并将 בְּנֵי יִשְׂרָאֵל 译作“以色列子孙”
  alternative: 译作“一个人”和“以色列人”
  rationale: 上下文所指是先前被数点的成年男子。“没有一个”在汉语中已清楚承接“这些人”和“所数点的人”，不必生硬加入“男人”；“以色列子孙”则保留原文的家族性表达，不将其泛化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“数点”准确对应人口清点，并保持本段叙事用词的一致性；通过重组关系从句避免欧化句式。
