base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/047.yaml
  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
translation:
  language: zh_hans
  text: 这些是亚设子孙的各宗族；按其中被数点的人数，共有五万三千四百人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“按他们被数点的人。”希伯来语采用源自动词 פקד 的人口统计用语，指正式登记或清点的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 复数指示词用于引出本段人口统计的总结；现代汉语自然补出判断词“是”。
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: 此处指支派内部由血缘构成的较大群体，而非现代意义上的核心家庭；“宗族”较准确，“各”体现复数。
- source_word: בְּנֵי אָשֵׁר
  choice: 亚设子孙
  rationale: 该谱系表达在此泛指亚设支派的后裔；“子孙”既保留血统关系，也符合现代汉语圣经叙事的庄重语体。
- source_word: לִפְקֻדֵיהֶם
  choice: 按其中被数点的人数
  rationale: פ־ק־ד在本段是正式登记、清点人口的用语。“被数点的人数”保留受动和人口统计含义；“其中”自然表达后缀所指这些宗族中的人员。
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 五万三千四百人
  rationale: 依现代汉语数字顺序准确表达总数，并补“人”使统计对象清楚。
theological_decisions: []
