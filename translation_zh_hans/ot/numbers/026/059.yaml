base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: zh_hans
  text: 暗兰的妻子名叫约基别；她是利未的女儿[a]，是在埃及生给利未的[b]。她给暗兰生了亚伦、摩西和米利暗；米利暗是他们的姐妹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“利未的女儿”。在谱系语境中，“女儿”有时也可泛指女性后裔。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“她在埃及把她生给利未”；动词的阴性主语所指为何人，原文并未明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  choice: 暗兰的妻子名叫
  rationale: 将希伯来语“暗兰妻子的名字是”按现代汉语习惯表达为“暗兰的妻子名叫”，省略句首连接词而保留介绍人物姓名的功能。
- source_word: יוֹכֶבֶד
  choice: 约基别
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בַּת לֵוִי
  choice: 利未的女儿
  rationale: 直译“利未的女儿”，不在正文中改写为“利未的女性后裔”，从而保留原文的谱系措辞及其可能引起的年代问题。
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  choice: 是她母亲在埃及给利未生的
  rationale: 原文用阴性单数动词表达“她生了她给利未”，但未明说生母是谁。汉语为避免代词混乱，以“她母亲”明示语法上隐含的生育者，并用脚注说明原文并未明说。
- source_word: וַתֵּלֶד לְעַמְרָם
  choice: 她给暗兰生了
  rationale: 保留 ילד 与介词 ל 所表达的妻子为丈夫生育儿女的关系，同时符合自然现代汉语。
- source_word: וְאֵת מִרְיָם אֲחֹתָם
  choice: 和米利暗；米利暗是他们的姐妹
  rationale: 将同位结构拆成短分句，使“他们”明确指亚伦和摩西；“姐妹”不擅自判定米利暗年龄较长或较幼。
theological_decisions:
- issue: “利未的女儿”的谱系含义
  choice: 正文保留“利未的女儿”
  alternative: 利未的女性后裔
  rationale: 不为解决年代或谱系上的张力而把原文概括成“后裔”；脚注仅提示谱系语境中该词可能具有较宽含义。
- issue: 约基别出生句中未明说的母亲
  choice: 正文以“她母亲”使汉语指代清楚，并在脚注注明原文只含阴性主语而未明说身份
  alternative: 她是利未在埃及所得的女儿
  rationale: 前一种表达较完整地保留“生”的语义；脚注防止读者误以为原文明说了“她母亲”。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。人名沿用通行中文译名；避免用“姐姐”或“妹妹”给米利暗附加原文未表达的年龄关系。
