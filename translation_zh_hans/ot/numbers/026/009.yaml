base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: zh_hans
  text: 以利押的儿子是尼母利、大坍和亚比兰。这两人，就是大坍和亚比兰，是会众所召集的人[a]；他们在可拉的会众中与摩西和亚伦相争时，是在与雅威相争。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“会众所选立的人”。
    reason: “会众所召集的人”较直接表达קרואי העדה；该称谓也可理解为会众所认可或选出的代表。
lexical_decisions:
- source_word: וּבְנֵי אֱלִיאָב
  choice: 以利押的儿子是
  rationale: בנים在家谱式名单中指男性后裔；中文用“儿子”准确自然。连接词不机械译作“和”，以符合名单语体。
- source_word: הוּא דָתָן וַאֲבִירָם
  choice: 这大坍和亚比兰，就是
  rationale: הוּא虽为单数形式，在此作回指和辨认之用；译文保留“这……就是”的强调，同时按中文复数指称自然表达。
- source_word: קרואי הָעֵדָה
  choice: 会众中受召的人
  rationale: קרואי是קרא的被动分词，可指被召集、被选出或受认可的人。“受召的人”保留其基本词义及身份上的含混，不径自定为正式领袖；较具解释性的译法收入脚注。
- source_word: הִצּוּ עַל
  choice: 与……相争
  rationale: נצה表示争斗、抗争或敌对；“相争”简洁庄重，并保留针对摩西、亚伦以及雅威的对抗意味。
- source_word: בַּעֲדַת קֹרַח
  choice: 在可拉一党中
  rationale: 此处עֵדָה指与可拉结党的一群人，而非泛指全体以色列会众；“一党”自然表达其团体关联及对抗性质。
- source_word: בְּהַצֹּתָם
  choice: 那时他们是在……相争
  rationale: 介词ב加不定式结构表达时间背景；重复“相争”对应前后同一希伯来词根，并凸显他们反对摩西、亚伦实为反对雅威。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
theological_decisions:
- issue: 如何处理反对摩西、亚伦与反对雅威之间的关系
  choice: 他们曾在可拉一党中与摩西、亚伦相争，那时他们是在与雅威相争
  alternative: 他们在可拉一党中与摩西、亚伦相争，并与雅威相争
  rationale: 原文以时间性结构连接两者，既把同一事件描述为对雅威的抗争，又未使用普通并列连词；译文保持这种神学张力，不增添解释。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用专名四字神名；“雅威”较直接反映学界通常重构的发音，并避免以头衔代替专名。
- issue: קרואי העדה所指的身份
  choice: 会众中受召的人
  alternative: 会众所选立的人
  rationale: 原文可以指被召集、被选出或获会众认可的人。正文保留较形式对应且开放的表达，脚注列出较具解释性的可能译法，不把他们的正式职分说死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。人名使用简体中文圣经传统常见译名；用分号划分名单辨认与后续说明，避免英文式关系从句堆叠。
