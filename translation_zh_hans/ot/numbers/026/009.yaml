  to: 以利押的儿子是尼母利、大坍和亚比兰。这两人，就是大坍和亚比兰，是会众所召集的人[a]；他们在可拉的会众中与摩西和亚伦相争时，是在与雅威相争。
  rationale: 修订使“受召者”短语在中文中更明确而不引入属灵蒙召的含义；以“可拉的会众”对应עֲדַת קֹרַח，避免“一党”的附加贬义；并调整回指与末句语序，使其符合现代庄重汉语，同时保留原文将反对摩西、亚伦的争斗描述为反对雅威的时间性结构。
