base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/052.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“יהוה”（YHWH，四字神名）；中文传统常译作“耶和华”，也有译作“雅威”。
    reason: 说明神名的原文形式及主要中文译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事性动词形式承接并推进上下文；汉语圣经叙事中“对……说”自然、简洁，也准确表达正式发言。因本节紧接人口统计的总结，省略生硬的“然后”更符合现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名“耶和华”对应四字神名，并用脚注说明原文形式；不以“主”这一称号替代原文专名。
- source_word: אֶל
  choice: 对
  rationale: 在“对某人说”的汉语结构中自然标明说话对象。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该希伯来人名通行的现代中文译名。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出随后话语的内容。现代汉语以“说：”和冒号自然保留其引语导入功能，无须重复译作“说道”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名，而非“主”的称号。正文采用中文圣经传统中辨识度最高的专名“耶和华”，同时在脚注注明原文为 YHWH，以保留来源信息；“雅威”较接近学界常见的拟音，但在普通中文读者中不如“耶和华”通行。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“耶和华对摩西说”是通顺的叙事公式；冒号表明具体话语见下一节。
