base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/040.yaml
  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: zh_hans
  text: 比拉的儿子是亚勒和乃幔。属亚勒的，有亚勒族；属乃幔的，有乃幔族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 是
  rationale: 这里的叙事连接词引出家谱名单；中文在承接上文时无需机械译出“于是/并且”，用“是”自然表达其存在和认定关系。
- source_word: בְנֵי
  choice: 儿子
  rationale: 本节列出比拉名下的男性后裔；直译为“儿子”既符合家谱语体，也不把原文明确扩展为较宽泛的“后代”。
- source_word: בֶלַע
  choice: 比拉
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: אַרְדְּ
  choice: 亚勒
  rationale: 保留专名，并采用现代中文圣经中常见的音译形式。
- source_word: נַעֲמָן
  choice: 乃幔
  rationale: 保留专名，并采用现代中文圣经中常见的音译形式。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: 在民数记人口统计的语境中，此词指支派之下的宗族单位；“族”比现代汉语的“家庭”更准确。
- source_word: הָאַרְדִּי
  choice: 亚勒族
  rationale: 希伯来语是由“亚勒”派生的族属称谓；中文以“亚勒族”自然表达由他而出的宗族。
- source_word: לְנַעֲמָן
  choice: 属乃幔的
  rationale: 前缀 ל 在这一家谱格式中表示归属或源流；“属乃幔的”既保留归属关系，也符合本章名单的中文表达。
- source_word: הַנַּעֲמִי
  choice: 乃幔族
  rationale: 这是由“乃幔”派生的族属称谓；中文用“乃幔族”清楚表达，不必另造形容词形式。
theological_decisions: []
translation_notes:
  register: 采用简洁庄重的现代汉语家谱体。两个分句保持希伯来文平行结构，以“属……的，有……族”清楚呈现人物与宗族之间的归属关系。英文咨询层的脚注讨论英语族属形容词 Naamite/Naamanite 的形式差异；中文统一以“乃幔族”表达，不存在同样的歧义，因此不设脚注。
