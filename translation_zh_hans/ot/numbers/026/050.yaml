  text: These are the clans of Naphtali by their clans[b][a], and those numbered of them were forty-five thousand four hundred.
translation:
  language: zh_hans
  text: 以上是拿弗他利支派的各宗族，按宗族归类；他们中被数点的共有四万五千四百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以上是
  rationale: 复数指示词用于结束拿弗他利宗族名单的总结句；“以上是”符合现代汉语列举后的总结表达。
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: 在支派人口统计语境中，指支派内部按血缘划分的群体；“宗族”比现代家庭意义的“家”或“家庭”准确。
- source_word: נַפְתָּלִי
  choice: 拿弗他利
  rationale: 采用中文圣经传统中通行的支派名称译法。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按各自的宗族统计
  rationale: 前缀 לְ 在此表示按宗族分类；补出语境中隐含的“统计”，使汉语完整自然，同时保留分类意义。
- source_word: וּפְקֻדֵיהֶם
  choice: 他们当中被数点的
  rationale: פקד 在人口普查公式中指登记、清点的人；保留被动含义，不在本节所用词语之外明确添加“男丁”。
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 四万五千四百
  rationale: 按现代汉语数词习惯准确表达原文基数。
