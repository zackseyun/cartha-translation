  language: zh_hans
  text: 这些是西缅人的各宗族，共有二万二千二百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 这是指示复数形式，用来引出本次人口统计的汇总；译作“这些是”贴合希伯来文无动词名词句，也符合现代汉语表达。
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: 在支派谱系与人口统计语境中，该词指支派内部按血缘划分的群体；“宗族”比现代汉语中的“家庭”更准确，“各”则自然体现复数。
- source_word: הַשִּׁמְעֹנִי
  choice: 西缅人的
  rationale: 该带冠词的族称虽为单数形式，却具有集合意义，指西缅支派的人；译为“西缅人的”可自然修饰“各宗族”。
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: 二万二千二百
  rationale: 按现代汉语整数位值习惯表达人口统计总数，准确对应二十二千加二百。
