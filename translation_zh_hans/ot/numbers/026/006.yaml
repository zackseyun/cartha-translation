  text: from Hezron[a], the clan of the Hezronites; from Carmi, the clan of the Carmites.
translation:
  language: zh_hans
  text: 属希斯仑的，有希斯仑族；属迦米的，有迦米族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/חֶצְרֹן
  choice: 属希斯仑的
  rationale: 前缀 לְ 在人口统计和族谱句式中表示归属或世系关系；译为“属希斯仑的”既自然，也保留了希伯来文的分类意味。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: מִשְׁפָּחָה 在本段人口统计语境中指支派之下的亲族群体；现代汉语圣经语体以“族”简洁而准确。
- source_word: הַֽ/חֶצְרוֹנִי
  choice: 希斯仑族
  rationale: 该族称形式指与希斯仑相关、由他而出的群体；译作“希斯仑族”符合汉语族谱表达。
- source_word: לְ/כַרְמִי
  choice: 属迦米的
  rationale: 与 לְחֶצְרֹן 平行，表示族谱归属或后裔分类，故一致译为“属迦米的”。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: 重复的统计术语保持同一译法，以呈现原文的平行结构。
- source_word: הַ/כַּרְמִי
  choice: 迦米族
  rationale: 该族称形式指与迦米相关、由他而出的后裔群体；“迦米族”是自然明确的汉语表达。
