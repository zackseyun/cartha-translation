  text: בְּנֵ֤י נַפְתָּלִי֙ לְ/מִשְׁפְּחֹתָ֔/ם לְ/יַ֨חְצְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְצְאֵלִ֑י לְ/גוּנִ֕י מִשְׁפַּ֖חַת הַ/גּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: zh_hans
  text: 拿弗他利的众子，按宗族如下：属雅薛的，有雅薛族；属沽尼的，有沽尼族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: 拿弗他利的众子
  rationale: 保留希伯来文“……的众子”这一明确的父系谱系表达；“拿弗他利”采用现代中文圣经中较通行的人名译法。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族如下
  rationale: 介词短语表示按各宗族分类列举；“宗族”比“家庭”更符合民数记人口统计中的部族分支语境，加入“如下”使中文列举自然清楚。
- source_word: לְיַחְצְאֵל
  choice: 属雅薛的
  rationale: 此处 לְ 引出宗族所从出的祖先；译作“属……的”既体现分类关系，也符合中文谱系名单的表达。יַחְצְאֵל 按希伯来语形式音译为“雅薛”。
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: 雅薛族
  rationale: מִשְׁפַּחַת 指宗族，后接族称；中文以祖名加“族”简洁表达从雅薛而出的群体。
- source_word: לְגוּנִי
  choice: 属沽尼的
  rationale: 与前一分句采用相同的谱系分类结构。גוּנִי 按现代中文圣经较通行的形式译作“沽尼”。
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: 沽尼族
  rationale: 族称在中文中自然地表达为祖名加“族”，与“雅薛族”保持平行。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准书面语，并保留希伯来文名单的平行结构。以“宗族”呈现人口统计中的 מִשְׁפָּחָה，以“属……的，有……族”避免生硬直译介词，同时准确表达各支系与祖先的关系。
