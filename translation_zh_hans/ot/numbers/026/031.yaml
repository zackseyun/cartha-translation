  register: 采用庄重而简明的现代标准普通话，保留人口统计名单的平行结构。原文专名 אַשְׂרִיאֵל 中的 שׂ 为 sin，中文“亚斯列”已直接反映其读音，因此无需像英文稿那样另加拼写脚注。
