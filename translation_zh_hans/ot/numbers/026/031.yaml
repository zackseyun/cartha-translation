base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/031.yaml
  text: from Ashriel[a], the clan of the Ashrielites; and from Shechem, the clan of the Shechemites.
translation:
  language: zh_hans
  text: 属亚斯列的，有亚斯列族；属示剑的，有示剑族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׂרִיאֵל
  choice: 亚斯列
  rationale: 按希伯来语专名音译；שׂ在此读作 /s/，因此译作“斯”而非“什”，并采用现代中文圣经人名中自然、易读的形式。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: 在民数记人口统计和宗族谱系语境中，指支派之下的亲族单位；“族”简洁自然，并与本章名单体例相称。
- source_word: הָאַשְׂרִיאֵלִי
  choice: 亚斯列族
  rationale: 带定冠词的族称，表示亚斯列的后裔群体；中文以祖名加“族”自然表达。
- source_word: שֶׁכֶם
  choice: 示剑
  rationale: 沿用此希伯来专名在现代中文圣经中的通行译法；本节指宗族祖先的人名，并非地名。
- source_word: הַשִּׁכְמִי
  choice: 示剑族
  rationale: 由“示剑”派生的族称，指其后裔宗族；译为“示剑族”清楚而符合名单文体。
- source_word: וְ
  choice: ；属……的，有……
  rationale: 原文连接两个并列宗族条目；中文用分号衔接，并重复名单句式，使结构清楚自然。
theological_decisions: []
