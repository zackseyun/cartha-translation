base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: zh_hans
  text: 以下是按宗族被数点[a]的利未人：革顺：革顺族；哥辖：哥辖族；米拉利：米拉利族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“被统计的”或“被登记的”。希伯来语所指的是在人口统计中被列入并点算的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 承接上下文并引出名单；现代汉语中“以下是”比逐字译作“这些是”更自然，同时保留希伯来语连接语气。
- source_word: פְקוּדֵי
  choice: 被数点的
  rationale: 指在人口统计中被登记、点算的人，而非抽象的“数点”行为；保留原文以人员为对象的具体含义。
- source_word: הַלֵּוִי
  choice: 利未人
  rationale: 此处是利未支派的群体称谓。译作“利未人”符合现代汉语，也与后文各宗族的列举相衔接。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה 在支派人口统计语境中指宗族层级，并非现代意义上的核心家庭；“按宗族”准确表达分类方式。
- source_word: לְגֵרְשׁוֹן
  choice: 属革顺的
  rationale: 介词 לְ 在此表示归属或世系关系；“属革顺的”简洁自然。
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי
  choice: 革顺族
  rationale: 组合表达由革顺而出的宗族群体；汉语族谱式名单中以“革顺族”最为简明。
- source_word: לִקְהָת
  choice: 属哥辖的
  rationale: 与前后平行结构一致，表示归属哥辖世系。
- source_word: מִשְׁפַּחַת הַקְּהָתִי
  choice: 哥辖族
  rationale: 指哥辖后裔构成的宗族，采用自然的汉语宗族称谓。
- source_word: לִמְרָרִי
  choice: 属米拉利的
  rationale: 与前两项保持平行，表示归属米拉利世系。
- source_word: מִשְׁפַּחַת הַמְּרָרִי
  choice: 米拉利族
  rationale: 指米拉利后裔构成的宗族，以简洁的汉语宗族名称表达。
