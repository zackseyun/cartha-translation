  text: Of Shupham[a], the clan of the Shuphamites; of Hupham, the clan of the Huphamites.
translation:
  language: zh_hans
  text: 属书反[a]的宗族，是书反族；属户反的宗族，是户反族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处作“书反”；有些译本受其他文本传统或平行名单影响，采用相关的不同拼法。
    reason: 说明专名在不同文本传统和平行名单中的拼写差异。
lexical_decisions:
- source_word: לִשְׁפוּפָם
  choice: 属书反的
  rationale: 前缀 לְ 在人口统计名单的固定句式中表示归属或后裔关系；译作“属……的”符合现代汉语族谱名单的表达。专名 שְׁפוּפָם 依通行中文圣经人名译作“书反”。
- source_word: מִשְׁפַּחַת הַשּׁוּפָמִי
  choice: 是书反族
  rationale: מִשְׁפָּחָה 在支派人口统计语境中指支派以内的宗族；汉语以“某某族”简洁表达该宗族及其祖先名称。系词“是”使名单句式自然清楚。
- source_word: לְחוּפָם
  choice: 属户反的
  rationale: 与本节前半句保持一致，לְ 表示宗族归属；חוּפָם 依通行中文圣经人名译作“户反”。
- source_word: מִשְׁפַּחַת הַחוּפָמִי
  choice: 是户反族
  rationale: 族称 הַחוּפָמִי 表示从户反而出的宗族，译作“户反族”既保留专名，也自然传达集体含义。
theological_decisions: []
