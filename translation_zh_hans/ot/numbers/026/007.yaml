  yaml_path: translation/ot/numbers/026/007.yaml
  text: These are the clans of the Reubenites[a], and those numbered from them were forty-three thousand seven hundred thirty.
translation:
  language: zh_hans
  text: 这些是吕便人的各宗族；其中被数点的，共有四万三千七百三十人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: 在《民数记》的支派人口统计语境中，此词指支派内部按血缘划分的群体，而非现代意义上的核心家庭；“宗族”准确且自然。
- source_word: הָרֻאוּבֵנִי
  choice: 吕便人
  rationale: 该族称表示吕便的后裔及其支派成员；“吕便人”符合现代汉语圣经语体，也简明自然。
- source_word: פְקֻדֵיהֶם
  choice: 其中被数点的
  rationale: 该词源于פקד，在人口统计语境中指被清点、登记的人；此译保留其被动含义，并以“其中”表达希伯来语后缀所指的所属范围。
- source_word: וַיִּהְיוּ
  choice: 共有
  rationale: 在统计总数的陈述中，“共有”自然表达其总数为多少，比逐字译为“是”更符合现代汉语。
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: 四万三千七百三十
  rationale: 按希伯来文数目的实际数值译出，并采用汉字数字，以保持经文人口统计段落庄重、连贯的文体。
