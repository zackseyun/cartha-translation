  text: כִּֽי אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם מ֥וֹת יָמֻ֖תוּ בַּ/מִּדְבָּ֑ר וְ/לֹא נוֹתַ֤ר מֵ/הֶם֙ אִ֔ישׁ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: zh_hans
  text: 因为耶和华曾对他们说：“他们必定死[a]在旷野。”他们中间没有一个人留下[b]，只有耶孚尼的儿子迦勒和嫩的儿子约书亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“死，他们必死”，用同根词的重复结构加强语气，意思是“他们必定死”。
    reason: 说明原文的强调结构。
  - marker: b
    text: 希伯来文直译为“没有一人从他们中间留下”；也可译作“他们中间无人存留”。
    reason: 交代较直译的表达及自然的译法选择。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前那一代无人列入本次数点提供原因，保留解释和因果作用。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语中广为人知的音译来呈现四字神名，而不以“主”这一称号替代。
- source_word: אָמַר יְהוָה לָהֶם
  choice: 耶和华论到他们说
  rationale: לָהֶם 可直译为“对他们”，但上下文强调这判语是针对他们而发；“论到他们说”自然地保留这一所指关系。
- source_word: מוֹת יָמֻתוּ
  choice: 他们必死
  rationale: 希伯来语以绝对不定式配合同根限定动词加强语气；汉语“必死”简洁表达确定和强调。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是民数记语境中 מִדְבָּר 的自然译法，也不把地貌过度限定为沙漠。
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: 他们中间一个人也没有留下
  rationale: אִישׁ 为阳性单数并带逐一排除的意味；此译保留“一个人也没有”的强调，同时符合现代汉语表达。
- source_word: כִּי אִם
  choice: 只有
  rationale: 该惯用语在否定句后引出仅有的例外；“只有”准确而自然。
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: 耶孚尼的儿子迦勒
  rationale: 采用通行的中文圣经人名，并按自然汉语表达父子关系。
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: 和嫩的儿子约书亚
  rationale: 采用通行的中文圣经人名，保留连接词和父子关系。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”在现代中文中是广为人知的专名音译，明确呈现神的名字而非以“主”代替；“雅威”更接近常见学术拟音，但普通读者熟悉度较低。
- issue: 旷野死亡判语的强调程度
  choice: 他们必死
  alternative: 他们一定会死
  rationale: 原文同根结构表达强烈的确定性；“必死”保留庄重、简洁的判语语气，不额外说明死亡方式或时间。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。叙述关系以“因为”承接上文；神的判语简短有力。人名使用简体中文读者熟悉的传统译名，避免文言句式和不必要的神学解释。
