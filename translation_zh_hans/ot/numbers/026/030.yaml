  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: zh_hans
  text: 基列的子孙如下：以薛的，有以薛族；希勒的，有希勒族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי גִלְעָד
  choice: 以下是基列的子孙
  rationale: 希伯来语“儿子们”在本次人口统计的族谱语境中涵盖父系后裔，并非仅指基列的亲生儿子；译作“子孙”既符合现代汉语，也保留族谱关系。
- source_word: אִיעֶזֶר
  choice: 以以谢
  rationale: 按希伯来语人名音译，并采用现代中文圣经语境中清楚可辨的形式。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: 此词在民数记二十六章指支派之下、由共同父系祖先形成的宗族单位；“族”比现代汉语中的“家庭”准确。
- source_word: הָאִיעֶזְרִי
  choice: 以以谢族
  rationale: 希伯来语族称表示以以谢的后裔群体；汉语以祖名加“族”自然表达。
- source_word: לְחֵלֶק
  choice: 属希勒的
  rationale: 前缀 לְ 在重复的人口统计句式中引出相应祖先及其宗族；译作“属……的”可自然呈现归属关系。
- source_word: הַחֶלְקִי
  choice: 希勒族
  rationale: 这是由希勒之名形成的族称，译为祖名加“族”，与上半节保持一致。
