  yaml_path: translation/ot/numbers/026/056.yaml
  text: According to the lot[a], his inheritance shall be divided between the larger and the smaller.
translation:
  language: zh_hans
  text: 要按抽签的结果[a]，在人数多的和人数少的群体之间分配产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要凭签，在人数较多和人数较少的群体之间分配产业。”希伯来文在分配过程中对举人数较多和人数较少的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: 按
  rationale: 该习语在这里表示以抽签结果为依据；“按”简洁自然，也保留“依照其决定”的含义。
- source_word: הַגּוֹרָל
  choice: 所抽的签
  rationale: גּוֹרָל指用于分配土地的签；“所抽的签”比单说“签”更清楚地体现抽签分配的语境。
- source_word: תֵּחָלֵק
  choice: 分配
  rationale: 该动词为尼法勒式，表示产业被划分、分配。汉语“分配”在“要……分配”的结构中自然表达被动规定，无须生硬添加被动标记。
- source_word: נַחֲלָתוֹ
  choice: 产业
  rationale: 这里指分得并承受的土地份额。“产业”符合民数记土地分配语境；希伯来语第三人称阳性单数后缀在上下文中具有逐一分配的功能，汉语省略代词可避免误指某一男子，同时不改变意义。
- source_word: בֵּין
  choice: 在……之间
  rationale: 忠实保留两个相对群体之间进行分配的关系。
- source_word: רַב
  choice: 人数多的
  rationale: 在户口统计及土地分配的语境中，רַב与מְעָט形成数量对比；补出“人数”可使现代汉语读者明确这是群体规模，而非土地面积。
- source_word: לִמְעָט
  choice: 人数少的
  rationale: 与“人数多的”平行，准确表达两个群体在人数上的相对差异。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按所抽的签”明确分配依据；“人数多的和人数少的”自然呈现希伯来文的数量对举。正文保留脚注标记[a]。
