  language: zh_hans
  text: 这些是西布伦人的各宗族；按他们中被数点的人数，共有六万零五百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 保留指示代词和名词性判断句的结构，以自然的现代汉语引出本节汇总。
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: 在支派人口统计语境中，指支派内部由亲属关系构成的较大群体；“宗族”比“家庭”更准确。
- source_word: הַזְּבוּלֹנִי
  choice: 西布伦人
  rationale: 带冠词的族称单数在此作集合用法，指西布伦的后裔群体；汉语以“西布伦人”自然表达。
- source_word: לִפְקֻדֵיהֶם
  choice: 按他们中被数点的人数
  rationale: פקד在本段是人口普查意义；这一译法既保留“按……”的对应关系，也明确所说的是该群体中列入统计的人数。
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 六万零五百人
  rationale: 以现代汉语通常的整数表达呈现60,500，并补出量词“人”，使人口总数清楚自然。
