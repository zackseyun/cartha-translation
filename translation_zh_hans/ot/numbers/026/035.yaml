base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: zh_hans
  text: 以法莲的子孙，按宗族如下：属书提拉的，有书提拉族；属比结的，有比结族；属他罕的，有他罕族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי אֶפְרַיִם
  choice: 以法莲的子孙……如下
  rationale: בְנֵי 字面为“儿子”，但在支派人口统计和宗族谱系语境中包括后代；译作“子孙”既自然，也准确表达这里的群体范围。“如下”承接 אֵלֶּה 的列举功能。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה 在民数记人口统计中指支派之下的宗族单位；“按宗族”简洁保留分类列举的意思。
- source_word: לְשׁוּתֶלַח / לְבֶכֶר / לְתַחַן
  choice: 属书提拉的 / 属比结的 / 属他罕的
  rationale: 前缀 לְ 在此谱系公式中表示归属或源自某位祖先；汉语用“属……的”能自然表达宗族归属。
- source_word: מִשְׁפַּחַת הַשֻּׁתַלְחִי
  choice: 书提拉族
  rationale: 族称形式 הַשֻּׁתַלְחִי 指从书提拉而出的宗族；中文以祖名加“族”表达清楚而简练。
- source_word: מִשְׁפַּחַת הַבַּכְרִי
  choice: 比结族
  rationale: 族称 הַבַּכְרִי 指从比结而出的宗族；采用现代中文圣经人名惯用音译“比结”，加“族”表示族称。
- source_word: מִשְׁפַּחַת הַתַּחֲנִי
  choice: 他罕族
  rationale: 族称 הַתַּחֲנִי 指从他罕而出的宗族；用祖名加“族”保留原文的平行结构。
