base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/037.yaml
  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
translation:
  language: zh_hans
  text: 这些是以法莲子孙的各宗族；按所登记的人数，共有三万二千五百人[a]。这些是约瑟子孙的各宗族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按所登记的人数”也可译作“按他们被数点的人数”或“按登记数目计算”。希伯来原文采用人口普查登记的用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: 在民数记人口登记和支派结构的语境中，指支派内部按亲属关系组成的群体；“宗族”比现代汉语的“家庭”更准确。
- source_word: בְּנֵי אֶפְרַיִם
  choice: 以法莲子孙
  rationale: בְּנֵי 在族谱和支派名单中可涵盖后裔；译作“子孙”既保留谱系关系，又避免让现代读者误解为仅指以法莲的亲生儿子。
- source_word: לִפְקֻדֵיהֶם
  choice: 他们中被数点的
  rationale: 该词源于 פקד，在此属于人口普查登记用语，所指是宗族中被登记、计数的人；“被数点的”保留原文被动色彩和人口统计语境。
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 三万二千五百人
  rationale: 按现代汉语数字次序准确表达总数，并补出量词“人”，使句子自然明确。
- source_word: בְנֵי יוֹסֵף
  choice: 约瑟的子孙
  rationale: 这里概括约瑟所属后裔群体；“子孙”保留其谱系联系，并与前面的“以法莲子孙”一致。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着他们的宗族
  rationale: 保留结尾按宗族分类的总结公式，并与前文“各宗族”统一。
