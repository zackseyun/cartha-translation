base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/016.yaml
  text: of Ozni[a], the clan of the Oznites; of Eri[b], the clan of the Erites.
translation:
  language: zh_hans
  text: 属阿斯尼的，有阿斯尼族[a]；属以利的，有以利族[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“阿斯尼家族。”希伯来语在这里使用了亲族群体名和由人名构成的族称。
    reason: lexical_alternative
  - marker: b
    text: 或译：“以利家族。”希伯来语在这里使用了亲族群体名和由人名构成的族称。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָזְנִי
  choice: 属阿斯尼的
  rationale: 在本章人口统计的族谱格式中，前缀 לְ 引出某位祖先所属的后裔支系；译作“属……的”既符合汉语习惯，也保留其谱系关系。人名按希伯来语音译为“阿斯尼”。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: 此词在以色列支派的人口统计语境中指支派以下的亲族群体；“族”比现代汉语中的“家庭”更准确，也较为简洁自然。
- source_word: הָאָזְנִי
  choice: 阿斯尼族
  rationale: 带冠词的族称形式表示阿斯尼的后裔群体。汉语用祖先名加“族”自然表达这一族称。
- source_word: לְעֵרִי
  choice: 属以利的
  rationale: 与前一分句结构相同，לְ 在此引出以利的后裔支系，译作“属以利的”。人名 עֵרִי 按希伯来语音译为“以利”。
- source_word: הָעֵרִי
  choice: 以利族
  rationale: 带冠词的族称形式表示以利的后裔群体，译为“以利族”，并与前一分句保持对应。
theological_decisions: []
