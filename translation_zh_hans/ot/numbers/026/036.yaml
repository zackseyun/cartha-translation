  text: 书提拉的子孙如下：属以兰的，有以兰族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: 如下
  rationale: 该短语在户口统计名单中引出下一项；译作“如下”自然简洁，并保留其承接、列举功能。
- source_word: בְּנֵי
  choice: 后代
  rationale: 此处虽字面为“儿子们”，但下文只列以兰及由他得名的宗族，属于谱系用语，不一定指亲生儿子；“后代”能准确传达其实际所指。
- source_word: שׁוּתָלַח
  choice: 书提拉
  rationale: 按现代中文圣经人名音译惯例处理该希伯来人名。
- source_word: לְ/עֵרָן
  choice: 以兰
  rationale: 前缀 לְ 在本段统计公式中标示所属分支；中文直接列出人名最自然，后句“有以兰族”已明确宗族源流。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: 在《民数记》人口统计语境中，该词指支派之下的血缘宗族单位；“族”简明且符合中文名单体例。
- source_word: הָ/עֵרָנִי
  choice: 以兰族
  rationale: 该族称形式表示由以兰得名、从他而出的宗族；译作“以兰族”清楚自然。
