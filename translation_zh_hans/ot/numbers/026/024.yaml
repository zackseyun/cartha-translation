base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/024.yaml
  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: zh_hans
  text: 属雅述的，有雅述族；属伸仑的，有伸仑族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָשׁוּב
  choice: 属雅述的
  rationale: 介词 לְ 在这段人口普查名录中引出宗族所源自的人名；译作“属雅述的”既体现归属关系，也能自然衔接后面的宗族名称。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: מִשְׁפָּחָה 在支派人口普查语境中指支派以下的亲族单位；“族”比现代汉语中的“家庭”更准确，也符合家谱名录的简洁体例。
- source_word: הַ/יָּשׁוּבִי
  choice: 雅述族
  rationale: 该族称形容词表示由雅述而出的群体；汉语以祖名加“族”清楚表达此义，并避免生硬音译族名后缀。
- source_word: לְ/שִׁמְרֹן
  choice: 属伸仑的
  rationale: 与前一分句保持相同结构，以“属……的”引出同名祖先及其宗族。
- source_word: הַ/שִּׁמְרֹנִי
  choice: 伸仑族
  rationale: 该族称表示由伸仑而出的宗族；采用祖名加“族”的自然汉语形式。
