base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
translation:
  language: zh_hans
  text: 以萨迦的子孙，按宗族如下：属陀拉的，有陀拉族；属普瓦[a]的，有普尼族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “普瓦”在一些相关经文中写作“普阿”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: 以萨迦的子孙
  rationale: בְּנֵי在谱系和人口统计语境中可指由某人而出的后代，并非仅指亲生儿子；译作“子孙”符合本节的宗族名单语境，也自然承接支派祖先以萨迦。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族如下
  rationale: מִשְׁפָּחָה在此指支派内部的宗族单位。“按宗族”准确表达分类方式；补出“如下”使汉语名单结构清楚流畅。
- source_word: תּוֹלָע
  choice: 陀拉
  rationale: 这是人名，应音译；采用现代中文圣经读者较熟悉且可辨识的译名“陀拉”。
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: 陀拉族
  rationale: הַתּוֹלָעִי是由陀拉之名构成的族称，指其后裔形成的宗族；汉语以“陀拉族”简洁表达。
- source_word: לְפֻוָה
  choice: 属普瓦的
  rationale: 前缀לְ在名单中逐项引出宗族祖先；译作“属……的”可自然表达从该祖先而出的归属关系。פֻוָה按本节马所拉文本音译为“普瓦”。
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: 普尼族
  rationale: הַפּוּנִי是由普瓦之名派生的族称。译作“普尼族”既保留原文派生形式的区别，也符合中文族名表达习惯。
