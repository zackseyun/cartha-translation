  text: אַךְ בְּ/גוֹרָ֕ל יֵחָלֵ֖ק אֶת הָ/אָ֑רֶץ לִ/שְׁמ֥וֹת מַטּוֹת אֲבֹתָ֖/ם יִנְחָֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/055.yaml
  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: zh_hans
  text: 这地只能用抽签的方式来分配；他们要按父系各支派的名称承受产业。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: 只可
  rationale: 此处具限制作用，强调分地只能采用所指定的方式；“只可”既保留排他语气，也符合现代汉语表达。
- source_word: בְּגוֹרָל
  choice: 用抽签的方式
  rationale: גּוֹרָל 指用于作出分配决定的签；介词 בְּ 表示方式或手段，译作“用抽签的方式”清楚自然。
- source_word: יֵחָלֵק אֶת־הָאָרֶץ
  choice: 这地……分配
  rationale: חלק 的尼法勒未完成式表达被动分配；“这地”承接上下文所指将要承受的土地，“分配”准确体现按份划分的语境。
- source_word: לִשְׁמוֹת
  choice: 按……名称
  rationale: 介词 לְ 在此表示分配所依据的名目或标准；“按……名称”保留原文以各支派之名为依据的说法。
- source_word: מַטּוֹת
  choice: 各支派
  rationale: מַטֶּה 本义可指杖，但在本节族群语境中指以色列的支派；加“各”使汉语结构更自然，并未增加新的群体。
- source_word: אֲבֹתָם
  choice: 父辈
  rationale: 原词明确为阳性复数“父亲／父辈”，在土地继承语境中指父系祖先及其谱系；正文用“父辈”保留这一性别与宗族含义。
- source_word: יִנְחָלוּ
  choice: 他们要……承受产业
  rationale: נחל 表示取得或持有为产业；“承受产业”比单说“继承”更能体现土地作为所分产业的含义，同时保持庄重易懂。
theological_decisions:
- issue: אֲבֹתָם 的性别化祖系称谓
  choice: 父辈
  alternative: 祖先
  rationale: 希伯来文使用阳性亲属词，并处于支派土地继承的父系谱系语境中。正文保留“父辈”，不以中性的“祖先”消解原文重点；脚注说明可采用的宽泛译法。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。“只可用抽签的方式”突出 אַךְ 的限制语气；分号保留前后两个相关但各自完整的分句。
