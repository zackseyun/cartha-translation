  text: אֵ֗לֶּה פְּקוּדֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל שֵׁשׁ מֵא֥וֹת אֶ֖לֶף וָ/אָ֑לֶף שְׁבַ֥ע מֵא֖וֹת וּ/שְׁלֹשִֽׁים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/051.yaml
  text: 'These are the numbered men of the sons of Israel: six hundred one thousand seven hundred thirty[a][b].'
translation:
  language: zh_hans
  text: 这些是以色列子孙[a]中被数点的男丁[b]，共六十万一千七百三十人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”；原文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“被统计的人”；原文指在人口调查中登记、数点的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 复数指示词用于引出本次人口统计的总数；汉语补出“是”，表达自然。
- source_word: פְּקוּדֵי
  choice: 被数点的男丁
  rationale: 该词源于פקד，在本段人口调查语境中指登记、点算的人；结合本次统计对象为成年男子，译作“被数点的男丁”既保留具体所指，也传达人口登记含义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留希伯来语“以色列之子”的家族性、民族性表达，同时采用现代汉语圣经语体中自然且庄重的说法。
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: 六十万一千七百三十
  rationale: 按希伯来语各数项相加，合计为601,730；采用现代汉语标准数字表达。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的表达
  choice: 以色列子孙
  alternative: 以色列人；以色列的众子
  rationale: “以色列子孙”兼顾原文家族性称谓和现代汉语可读性，不将其完全化约为单纯族名；脚注说明其他可行表达。
- issue: 人口调查中פְּקוּדֵי的所指
  choice: 被数点的男丁
  alternative: 被统计的人；人口调查所得的总数
  rationale: 本节总结的是前文所登记的成年男子。译文保留“被数点”的受事含义，并用“男丁”明确上下文限定，避免把原文仅处理成抽象数字。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“数点”保留人口登记的圣经语境色彩，“共”自然引出统计总数。所有脚注标记均置于对应词语之后。
