  text: רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל בְּנֵ֣י רְאוּבֵ֗ן חֲנוֹךְ֙ מִשְׁפַּ֣חַת הַ/חֲנֹכִ֔י לְ/פַלּ֕וּא מִשְׁפַּ֖חַת הַ/פַּלֻּאִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/005.yaml
  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: zh_hans
  text: 流便是以色列的长子。流便的子孙[a]：属哈诺的，是哈诺族；属法路的，是法路族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子孙”直译为“儿子们”。
    reason: 保留 בְּנֵי 的字面意义，同时说明正文采用了符合人口统计语境的表达。
lexical_decisions:
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: 以色列的长子
  rationale: בְּכֹר 表示家庭中具有长子身份的人；与“以色列”构成所属关系。译作“以色列的长子”准确、自然，也不必补出原文未明说的“儿子”。
- source_word: בְּנֵי רְאוּבֵן
  choice: 吕便的子孙
  rationale: בְּנֵי 字面为“儿子们”，但在本章人口统计和宗族谱系的语境中，所列的是吕便后裔形成的宗族；“子孙”既符合语境，又保留血缘承继之意。字面译法收入脚注。
- source_word: חֲנוֹךְ
  choice: 哈诺
  rationale: 采用现代中文圣经中通行且易于辨认的音译。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: 此词在支派人口统计中指支派以下、由共同祖先而来的亲族群体。“族”简洁地对应这一谱系单位，并适合重复性的名单体裁。
- source_word: הַחֲנֹכִי
  choice: 哈诺族
  rationale: 该族称形式指由哈诺而出的宗族；中文以祖名加“族”自然表达。
- source_word: לְפַלּוּא
  choice: 属法路的
  rationale: 名单中的 לְ 引出以该人为祖先或归属于他的宗族，并非方向性的“给/向”。“属法路的”清楚表达其谱系归属。
- source_word: הַפַּלֻּאִי
  choice: 法路族
  rationale: 该族称形式指由法路而出的宗族；译为祖名加“族”，并与“哈诺族”保持平行。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，并保留希伯来文谱系名单的短促平行结构。人名采用“吕便、哈诺、法路”等通行中文形式；用“属……的，是……族”明确表达祖先与宗族之间的关系，而不扩写为原文没有明说的完整叙事句。
