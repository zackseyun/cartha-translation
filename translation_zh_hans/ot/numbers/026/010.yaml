base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/010.yaml
  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: zh_hans
  text: 大地张开了口，把他们和可拉吞了下去；那一群人死去时，火烧死了二百五十人；他们就成了一个标志。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “标志”也可译作“信号”或“旗号”。原文所用的词可指供人注意的标志、信号或旗号；在这里的审判语境中，它也具有警戒作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: 地张开了口
  rationale: אֶרֶץ在此可指“大地”或“地面”；结合裂地吞人的图景，译作“地”自然简洁，并保留“口”的拟人意象。
- source_word: וַתִּבְלַע אֹתָם וְאֶת־קֹרַח
  choice: 把他们和可拉都吞了下去
  rationale: 忠实保留希伯来文将“他们”和“可拉”并列为吞没对象的句法，不根据其他经文作协调性改写；“吞了下去”自然传达בלע的具体意象。
- source_word: בְּמוֹת הָעֵדָה
  choice: 那一伙人死去的时候
  rationale: ב加不定式表时间。עֵדָה在这里指参与叛乱的群体；“那一伙人”比容易被理解为全体以色列会众的“会众”更符合本句语境，同时保留群体含义。
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: 火也烧灭了
  rationale: אכל字面为“吃”，以火为主语时译作“烧灭”符合现代汉语，也表达彻底毁灭的结果；“也”呈现同一审判事件中的并列情形。
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: 二百五十人
  rationale: 直接、准确地表达原文数目及אִישׁ在数词后的集体用法。
- source_word: וַיִּהְיוּ לְנֵס
  choice: 他们就成了警戒的标志
  rationale: נֵס可指标志、信号或旗号；审判语境表明其警戒功能。“标志”保留基本词义，“警戒的”说明此处语用。
theological_decisions:
- issue: 末句复数“他们”的所指
  choice: 保留复数代词“他们”，不限定为某一更窄群体
  alternative: 明确译为“那二百五十人”或将整个事件概括为警戒
  rationale: 希伯来文复数主语的先行对象存在一定空间；直译为“他们”可保留这种含混，避免过度解释。
- issue: 可拉与被地吞没者的关系
  choice: 译为“把他们和可拉都吞了下去”
  alternative: 用解释性措辞将可拉与被吞没者分开
  rationale: 本节句法明确并列אֹתָם与אֶת־קֹרַח，因此按本节原文呈现，不借其他叙事细节加以协调。
- issue: נֵס是否显明警戒功能
  choice: 正文译为“警戒的标志”，脚注保留“标志”的较少解释性译法
  alternative: 正文仅译“标志”
  rationale: 上下文中的公开审判具有警戒作用，但נֵס本身的核心意义仍是“标志”；正文与脚注共同兼顾语境功能和词义透明度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原文“地张开了口”的鲜明拟人表达，并以分号理清连续审判事件及其结果。脚注标记置于完整末句之后，避免打断正文。
