base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: zh_hans
  text: 犹大的子孙[a]按宗族如下：属示拉的，是示拉族；属法勒斯的，是法勒斯族；属谢拉的，是谢拉族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“犹大的儿子们”；在本次人口统计中，所指的是按父系归入各宗族的犹大后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 如下
  rationale: 在本节人口统计名册的句式中，该词用于引出后面的宗族名单。译作“如下”比逐字译为“是”更符合现代汉语，同时保留列举功能。
- source_word: בְנֵי יְהוּדָה
  choice: 犹大的子孙
  rationale: בְנֵי字面为“儿子们”，但在族谱和人口统计语境中指犹大父系的后裔。“子孙”既保留宗族谱系色彩，也避免误解为仅指犹大的亲生儿子。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה在民数记二十六章指支派之下的宗族单位；“宗族”比现代汉语的“家庭”更准确。介词לְ在这里表示分类，译作“按”。
- source_word: לְשֵׁלָה / לְפֶרֶץ / לְזֶרַח
  choice: 属示拉的／属法勒斯的／属谢拉的
  rationale: 重复的לְ引出各宗族所出自的祖先。“属……的”自然表达谱系归属，并保留原文重复、整齐的名册结构。
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי
  choice: 示拉族
  rationale: 该短语指由示拉得名的宗族。汉语以“人名＋族”简洁自然地表达原文的族称。
- source_word: מִשְׁפַּחַת הַפַּרְצִי
  choice: 法勒斯族
  rationale: 译名“法勒斯”对应פֶרֶץ，并按现代中文圣经人名的通行形式处理；“法勒斯族”表达由该祖先得名的宗族。
- source_word: מִשְׁפַּחַת הַזַּרְחִי
  choice: 谢拉族
  rationale: 译名“谢拉”对应זֶרַח；加“族”表达原文由人名派生的族称，同时与本节其他宗族名称保持一致。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的名册体。以“按宗族如下”引出名单，并用三组平行的“属……的，是……族”保留希伯来文重复而规整的结构。人名采用简体中文圣经语境中较通行的“示拉、法勒斯、谢拉”。
