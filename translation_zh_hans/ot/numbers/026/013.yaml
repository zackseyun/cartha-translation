  text: of Zerah, the clan of the Zerahites; of Shaul, the clan of the Shaulites.
translation:
  language: zh_hans
  text: 谢拉的，有谢拉族；扫罗的，有扫罗族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/זֶרַח
  choice: 属谢拉的
  rationale: 前缀 לְ 在本段人口统计的固定句式中表示宗族归属或出自某位祖先；译作“属谢拉的”既保留原文关系，也符合中文名录体表达。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: מִשְׁפָּחָה 在支派人口统计语境中指支派之下的亲族群体；中文“族”简洁自然，也适合本段反复出现的公式。
- source_word: הַזַּרְחִי
  choice: 谢拉族
  rationale: 该族称形式指由谢拉而出的群体；以祖名加“族”清楚表达其宗族身份。
- source_word: לְ/שָׁאוּל
  choice: 属扫罗的
  rationale: 与本节前半句相同，לְ 表示谱系或宗族归属，采用平行译法以保留希伯来文结构。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: 沿用前半句的译法，保持人口统计名录的重复结构。
- source_word: הַשָּׁאוּלִי
  choice: 扫罗族
  rationale: 该族称指扫罗的后裔群体；译作“扫罗族”准确、简明，并与“谢拉族”构成平行。
