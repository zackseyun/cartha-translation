    rationale: 希伯来文 אַרְאֵלִי 的中间辅音为 ר（resh），音译应体现为“列”；“亚利利”遗漏了该成分，未能准确对应原文人名。
  - severity: low
    issue: “属……的，是……”略显生硬，且“属”可能使祖先与宗族的关系不够明确。
    rationale: 此处 לְ 在人口登记公式中引出宗族祖先；“从……而出的”能自然表达其来源/后裔关系，同时不把介词的形式功能过度实化。
  revised_text: 从亚律而出的，是亚律族；从亚列利而出的，是亚列利族。
