  text: From Arod[a], the clan of the Arodites; from Areli, the clan of the Arelites.
translation:
  language: zh_hans
  text: 从亚律而出的，是亚律族；从亚列利而出的，是亚列利族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַאֲרוֹד
  choice: 属亚律的
  rationale: 介词 לְ 在本章人口统计的固定句式中引出各宗族的祖先。译作“属……的”既贴近希伯来语“归于/属于”的形式，又能自然表达宗族与祖先之间的归属关系。
- source_word: מִשְׁפַּחַת
  choice: ……族
  rationale: מִשְׁפָּחָה 在支派人口统计中指支派之下的血缘宗族；现代中文圣经语境中用“族”简洁、自然。
- source_word: הָאֲרוֹדִי
  choice: 亚律族
  rationale: 带冠词的族名形容词表示由亚律而出的后裔群体；中文以祖名加“族”表达。
- source_word: לְאַרְאֵלִי
  choice: 属亚利利的
  rationale: 与前半句相同，介词 לְ 引出宗族祖先，并保留原文平行、重复的人口统计句式。
- source_word: הָאַרְאֵלִי
  choice: 亚利利族
  rationale: 该族名形容词指亚利利的后裔宗族，译为“亚利利族”清楚而简练。
