  source_fidelity: 原文以人口登记的公式性结构，将亚律和亚列利分别与其后裔宗族相连。草稿对“族”（מִשְׁפָּחָה）及两分句平行结构的处理基本准确；但第二个人名/族名“亚利利”未准确对应 אַרְאֵלִי（Areli），应作“亚列利”。
  naturalness: “属亚律的，是亚律族”可以理解，但现代汉语中“从……而出的，是……”更明确地表达祖先与后裔宗族的关系，也保留原文重复的登记体句式。
  terminology: “族”适合本节支派内部血缘宗族的语境。“亚律”可保留；אַרְאֵלִי 应统一译为“亚列利”，相应族名为“亚列利族”。
  issues:
