base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: zh_hans
  text: 西缅的众子[a]，按宗族[b]如下：属尼母利的，有尼母利族；属雅悯的，有雅悯族；属雅斤[c]的，有雅斤族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众子”也可理解为“后代”；原文使用的是父系家谱中“……的众子”这一表达。
    reason: lexical_alternative
  - marker: b
    text: 或译“按家族”。这里的“宗族”指人口统计中支派以下的血缘群体。
    reason: lexical_alternative
  - marker: c
    text: “雅斤”也可音译为“雅欣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעוֹן
  choice: 西缅的众子
  rationale: 保留希伯来文“……的众子”这一父系家谱表达；在本次人口统计的语境中，所指也包括由这些儿子繁衍而来的后代。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה 在支派人口统计中指支派以下、家室以上的血缘群体；“宗族”比现代汉语中的“家庭”更准确。
- source_word: לִנְמוּאֵל
  choice: 属尼母利的
  rationale: 前缀 לְ 在此引出宗族所出自的祖先；译作“属……的”能自然表达归属和世系关系。
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי
  choice: 尼母利族
  rationale: 族称表示由尼母利得名的后裔群体；汉语用“人名＋族”简洁地保留人口统计名录的格式。
- source_word: לְיָמִין / מִשְׁפַּחַת הַיָּמִינִי
  choice: 属雅悯的，有雅悯族
  rationale: 沿用平行句式，同时区分作为祖先的个人与以他命名的宗族。
- source_word: לְיָכִין / מִשְׁפַּחַת הַיָּכִינִי
  choice: 属雅斤的，有雅斤族
  rationale: 采用现代中文圣经中较易辨识的传统音译“雅斤”，并以“雅斤族”表达相应族称。
theological_decisions: []
