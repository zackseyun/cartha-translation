  text: 这些是按宗族划分的便雅悯子孙；被数点的共有四万五千六百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי בִנְיָמִן
  choice: 这些是便雅悯的子孙
  rationale: “בְנֵי”在本段家谱与人口统计语境中指便雅悯的后裔，译作“子孙”比仅指亲生儿子的“儿子”更准确。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族统计
  rationale: 介词לְ在此表达按宗族分类；补出“统计”以自然衔接后半句的人数，同时不增添实质信息。
- source_word: וּפְקֻדֵיהֶם
  choice: 其中被数点的
  rationale: 保留פקד在民数记人口清点语境中的被动含义；“其中”自然表达所数点者出自上述便雅悯各宗族。
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 四万五千六百人
  rationale: 按现代汉语数字表达转换，并补量词“人”。
