base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
translation:
  language: zh_hans
  text: 以下是利未的各宗族[a]：立尼族、希伯仑族、玛利族、母示族、可拉族。哥辖生了暗兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“家族”或“家族群体”；希伯来语 מִשְׁפָּחָה 指支派内部按血缘划分的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: 宗族 / ……族
  rationale: 在民数记的人口统计和支派谱系语境中，该词指支派内部以血缘为基础的分支群体。“宗族”比现代汉语通常所说的核心“家庭”范围更大；列举各名称时用简洁的“……族”自然表达同一概念。
- source_word: לֵוִי
  choice: 利未
  rationale: 采用现代中文圣经传统中通行的人名及支派祖先译名。
- source_word: הַלִּבְנִי
  choice: 立尼族
  rationale: 这是由“立尼”派生的族群称谓，指与立尼相关或由他而出的宗族。
- source_word: הַחֶבְרֹנִי
  choice: 希伯仑族
  rationale: 按其族群形态译为“希伯仑族”，并与上下各宗族名称保持平行。
- source_word: הַמַּחְלִי
  choice: 玛利族
  rationale: 该形式表示由玛利而出的族群，用“玛利族”简洁保留谱系关系。
- source_word: הַמּוּשִׁי
  choice: 母示族
  rationale: 该形式是与母示相关的族群称谓，译作“母示族”。
- source_word: הַקָּרְחִי
  choice: 可拉族
  rationale: 指可拉的后裔群体或与可拉相关的宗族，译作“可拉族”。
- source_word: וּקְהָת
  choice: 哥辖
  rationale: 连词在中文句间衔接中不必机械译出；“哥辖”采用通行音译。
- source_word: הוֹלִד
  choice: 生了
  rationale: 使役词形在家谱公式中表示男性生育或成为某人的父亲；“生了”是自然、简洁且不古奥的现代汉语表达。
- source_word: אֶת עַמְרָם
  choice: 暗兰
  rationale: 宾语标记不单独翻译；人名采用通行音译“暗兰”。
- source_word: אֵלֶּה
  choice: 以下是
  rationale: 希伯来文为无系词句；“以下是”适合引出随后列举的宗族，也符合现代汉语叙述习惯。
