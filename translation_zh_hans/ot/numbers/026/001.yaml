  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה וְ/אֶ֧ל אֶלְעָזָ֛ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/001.yaml
  text: And Yahweh spoke to Moses and to Eleazar son of Aaron the priest[a], saying,
translation:
  language: zh_hans
  text: 雅威对摩西和祭司亚伦的儿子以利亚撒说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“雅威对摩西和祭司亚伦的儿子以利亚撒说，说”。句末第二个“说”是引出下文话语的希伯来语惯用格式；中文以“说：”自然表达。
    reason: 说明希伯来语话语引介公式，及中文未重复“说”的表达方式。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该动词基本义为“说”；现代汉语用“对……说”自然引出下文的话语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行学术拟音译出其专名，不以“主”等称号替代。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בֶּן־אַהֲרֹן הַכֹּהֵן
  choice: 祭司亚伦的儿子
  rationale: 按最自然的邻接关系，将“祭司”理解为亚伦的同位称号，并用合乎现代汉语的次序表达亲属关系。
- source_word: לֵאמֹר
  choice: 说（以冒号引出下文）
  rationale: 这是引出直接引语的惯用不定式；汉语无需重复两个“说”，以一个“说”和冒号保留其话语引介功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；“雅威”较直接反映该名的通行拟音，也避免以称号替代专名。
- issue: הַכֹּהֵן（祭司）所修饰的人物
  choice: 理解为亚伦的称号
  alternative: 理解为以利亚撒的称号
  rationale: 该词紧接“亚伦”，且“祭司亚伦”是自然的身份说明；不过希伯来语结构也可能让这一称号指向整个人名短语的中心“以利亚撒”，因此在脚注保留另一种理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“对……说：”清楚承接下一节的直接话语；人名使用中文圣经传统中的通行形式，神名则按希伯来文专名拟音为“雅威”。
