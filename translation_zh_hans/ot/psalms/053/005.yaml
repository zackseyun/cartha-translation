  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שָׁ֤ם פָּֽחֲדוּ פַחַד֮ לֹא הָ֪יָה֫ פָ֥חַד כִּֽי אֱלֹהִ֗ים פִּ֭זַּר עַצְמ֣וֹת חֹנָ֑/ךְ הֱ֝בִשֹׁ֗תָה כִּֽי אֱלֹהִ֥ים מְאָסָֽ/ם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/005.yaml
  text: There they were in great fear[a], where there was no fear; for God scattered the bones of the one encamping against you. You put them to shame[c][b], for God rejected them.
translation:
  language: zh_hans
  text: 他们在那里大大惧怕[a]，原本并没有什么可怕的；因为神使那围攻你之人的骸骨四散[b]。你使他们蒙羞[c]，因为神弃绝了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“他们惧怕了一个惧怕”。希伯来文用同根的动词和名词连用，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: “那围攻你之人”直译为“那向着你安营之人”，也可译作“你的围困者”。原文为单数；这里的上下文表明其行动带有敌意。
    reason: lexical_alternative
  - marker: c
    text: 本节先以第三人称说“神使……四散”，这里忽然改用第二人称“你”，随后又说“神弃绝了他们”。译文保留了这一诗体人称转换；这里最自然可理解为诗人转而直接对神说话。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: 在那里
  rationale: 作地点副词，简洁地引出场景，也保留原诗突兀有力的开头。
- source_word: פָּחֲדוּ פַחַד
  choice: 大大惧怕
  rationale: 希伯来文以同根动词和名词连用来加强语气；“大大惧怕”既传达强调，也符合现代汉语表达。
- source_word: לֹא הָיָה פַחַד
  choice: 其实并没有什么可怕的
  rationale: 表达并无真实可惧之事；“其实”自然呈现前后反差，但不把原因具体化。
- source_word: כִּי
  choice: 因为
  rationale: 两处均引出前一句所述情况的根据，译作“因为”清楚保留解释关系。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 该复数形式在此指以色列的神，句法上按单数使用，常规译作“神”。
- source_word: פִּזַּר
  choice: 使……四散
  rationale: 该加强词干表示有力地驱散或散布；与“骸骨”搭配时，“使……四散”自然且保留战败死亡的图像。
- source_word: עַצְמוֹת
  choice: 骸骨
  rationale: 语境描绘敌军遭彻底击败，“骸骨”比一般的“骨头”更庄重，也符合诗歌语域。
- source_word: חֹנָךְ
  choice: 围攻你的人
  rationale: 源自动词“安营”；在骸骨被神驱散的敌对语境中指向敌军扎营围攻。用单数集合式“人”保留形式上的单数，不限定具体身份。
- source_word: הֱבִשֹׁתָה
  choice: 你使他们蒙羞
  rationale: 使役形式表示使人受辱、蒙羞；译文保留第二人称，不擅自把它改成第三人称“神使他们蒙羞”。
- source_word: מְאָסָם
  choice: 弃绝了他们
  rationale: מָאַס 表示拒绝、摒弃；“弃绝”保留其强烈而庄重的审判意味，又不额外加入情绪色彩。
theological_decisions:
- issue: 诗句中人称与称呼对象的突然转换
  choice: 保留“神使……四散”之后的第二人称“你使他们蒙羞”
  alternative: 统一改成第三人称“神使他们蒙羞”，或把“你”明确解释为锡安／耶路撒冷
  rationale: 马所拉文本先以第三人称谈论神，随后使用第二人称动词，再回到“神弃绝了他们”。译文保留这一诗体转换；脚注说明最顺畅的理解是转而直接对神说话，同时不把正文中并未明说的称呼对象写死。
- issue: חֹנָךְ 所描述者的敌对性质
  choice: 围攻你的人
  alternative: 在你旁边安营的人；你的围城者
  rationale: “骸骨四散”“蒙羞”“弃绝”等上下文清楚表明这是敌对的安营行动。“围攻”传达语境含义，同时比名词“围城者”更通俗。
- issue: “没有惧怕”与强烈恐惧之间的张力
  choice: 其实并没有什么可怕的
  alternative: 那里并没有惧怕；他们在从未有过惧怕之处惧怕
  rationale: 原文将强烈恐惧与“没有恐惧”并置，可能指没有真实可怕的缘由。译文保留这种反差，不把它神学化为特定种类的恐惧。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大大惧怕”保留希伯来文的强调，“骸骨四散”保持诗歌图像；分号和句号呈现原诗各分句的因果推进。正文不明确补出“锡安”“耶路撒冷”或其他称呼对象，以保留原文的人称张力。
