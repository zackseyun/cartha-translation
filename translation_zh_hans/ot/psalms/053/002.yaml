id: PSA.53.2
reference: Psalms 53:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱֽלֹהִ֗ים מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵ֫י אָדָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵ֗שׁ אֶת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/002.yaml
  text: God looks down from heaven on the children of man to see whether there is anyone who has understanding[a], who seeks God.
translation:
  language: zh_hans
  text: 上帝从天上俯视世人[a]，要看看有没有明白事理[b]、寻求上帝的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“人的众子”，是泛指人类的集合性表达。
    reason: 说明希伯来语惯用语的字面形式及范围。
  - marker: b
    text: 或译“有智慧”或“行事明智”。
    reason: 保留 מַשְׂכִּיל 在领悟与明智行事之间的语义幅度。
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为形态上的复数形式，却按上下文指以色列的独一上帝；“上帝”是现代汉语中自然、庄重的对应词。
- source_word: מִשָּׁמַיִם
  choice: 从天上
  rationale: 希伯来语采用复数形态，但在此为惯用表达；“从天上”符合现代汉语习惯，并保留由高处俯察的空间意象。
- source_word: הִשְׁקִיף
  choice: 俯视
  rationale: 该动词表示从高处向下察看。“俯视”简洁地保留方向和审察意味；虽为完成式，诗歌语境可用汉语现在时作生动陈述。
- source_word: בְּנֵי אָדָם
  choice: 世人
  rationale: 这是泛指全体人类的集合性惯用语。汉语若直译为“人的儿子们”会产生误解，因此正文采用自然且范围准确的“世人”，并以脚注说明原文形式。
- source_word: לִרְאוֹת
  choice: 要看看
  rationale: 不定式表示目的；“要看看”自然表达上帝俯视所要查明的事，同时保留诗句的观察意象。
- source_word: הֲיֵשׁ
  choice: 有没有
  rationale: 疑问词与存在词结合，询问这样的人是否存在；“有没有”是清楚自然的现代汉语表达。
- source_word: מַשְׂכִּיל
  choice: 明白事理
  rationale: 该分词可指有洞见、明智，且可能带有按智慧行事的意味。“明白事理”兼顾认知与道德判断，不把它缩减为智力高低。
- source_word: דֹּרֵשׁ
  choice: 寻求
  rationale: 该分词描写持续的取向或行为；“寻求上帝”是自然、准确且符合诗歌语体的表达。
theological_decisions:
- issue: בְּנֵי אָדָם 中 אָדָם 的集合性与字面形式
  choice: 正文译“世人”，脚注保留字面信息
  alternative: 人的儿子们／亚当的子孙
  rationale: 这里泛指人类，并非只指男性，也未必特指亚当的家系。现代汉语直译会造成范围或血统上的误读，因此正文传达集合意义，脚注说明原文表达。
- issue: מַשְׂכִּיל 的认知与实践含义
  choice: 明白事理
  alternative: 有智慧／行事明智
  rationale: 原词既可强调领悟，也可涉及明智行事。正文不把它限定为纯粹智力或单一行为表现，脚注保留“行事明智”的可能译法。
- issue: הִשְׁקִיף 的时态表达
  choice: 采用汉语无标记的生动陈述“俯视”
  alternative: 曾俯视／已经俯视
  rationale: 希伯来语完成式可陈述已经发生的察看，但诗篇平行段落也容许把场景生动呈现为当前或恒常的神圣审察。汉语无标记形式避免过度限定时间。
translation_notes:
  register: 采用现代、自然而庄重的诗歌散文体。“俯视”保留从天上向下察看的形象；“世人”避免生硬直译；“明白事理、寻求上帝的人”保持两个分词之间的紧密并列关系。
