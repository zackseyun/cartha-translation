  text: הֲ/לֹ֥א יָדְעוּ֮ פֹּ֤עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם אֱ֝לֹהִ֗ים לֹ֣א קָרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/004.yaml
  text: Do not the workers of wickedness know—those who eat up my people as they eat bread? They do not call on God[a][b][c].
translation:
  language: zh_hans
  text: 作恶的人[a]难道不知道吗？他们吞吃我的百姓[c]，就像吃饭一样[b]；他们不求告神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作恶的人”也可译作“作恶者”或“作孽的人”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“那些吞吃我百姓的人，他们吃饼”。意思是，他们吞吃百姓，就像吃日常食物那样轻易、平常。
    reason: lexical_alternative
  - marker: c
    text: “我的百姓”既可能是神说的话，也可能是诗人所说；本节的希伯来文没有明确指出说话者。
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: 岂不知道吗
  rationale: הֲלֹא引出预期肯定答案的反问；“岂不知道吗”保留反问语气，也自然传达这里对作恶者无知或不明事理的责问。
- source_word: פֹּעֲלֵי אָוֶן
  choice: 作恶的人
  rationale: 该结构直指行作邪恶之事的人。“作恶的人”既保留行为层面的含义，又比生硬的“行作罪孽者”更符合现代汉语。
- source_word: אֹכְלֵי עַמִּי
  choice: 吞吃我的百姓
  rationale: אָכַל在此构成掠夺、压迫的强烈比喻；“吞吃”保留吃食意象，并能自然表现其残酷与贪婪。
- source_word: אָכְלוּ לֶחֶם
  choice: 就像吃饭一样
  rationale: 希伯来文直陈“他们吃饼”，与“吞吃我的百姓”并置；汉语用明示比较的表达传达其视压迫百姓为日常、轻易之事的语义。
- source_word: אֱלֹהִים לֹא קָרָאוּ
  choice: 他们不求告神
  rationale: קרא与神为对象时表示呼求、求告或敬拜中的称求；“求告神”是准确、庄重且易懂的现代汉语表达。
theological_decisions:
- issue: “我的百姓”中第一人称说话者的身份
  choice: 保留“我的百姓”，不在正文中指定是神还是诗人发言
  alternative: 明确译成神所说的“我的百姓”，或解释为诗人称同胞为“我的百姓”
  rationale: 希伯来文有第一人称单数后缀，却没有在本行明确标示说话者；正文应保留这种真实歧义，不作超出文本的神学判定。
- issue: “吃饼”与“吞吃百姓”的关系
  choice: 在正文译为明示比较“就像吃饭一样”，并以脚注保留字面结构
  alternative: 直译为“他们吞吃我的百姓；他们吃饼”
  rationale: 原文以并置形成比较或方式意义。汉语若完全照搬，容易被误解成两个互不相关的动作；正文明确其惯常、轻易吞吃百姓的比喻，同时脚注交代原文形式。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“岂不知道吗”保留诗歌中的反问力度；“吞吃”维持原文鲜明的掠夺意象；分号使末句“不求告神”既承接对作恶者的描述，又保持诗句节奏。
