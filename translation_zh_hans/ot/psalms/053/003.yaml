  yaml_path: translation/ot/psalms/053/003.yaml
  text: All of them have turned aside; together they have become corrupt; there is none who does good[a], not even one.
translation:
  language: zh_hans
  text: 他们全都偏离了，一同变得败坏[a]；没有行善的，连一个也没有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “变得败坏”或译“变得污秽”。这个希伯来语动词可以表示在道德上变得污浊或受到玷污。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלּוֹ
  choice: 他们全都
  rationale: 表达整个群体无一例外的集合意义；现代汉语自然、明确。
- source_word: סָג
  choice: 偏离正路
  rationale: 该动词表示退后或偏离；补出“正路”使汉语中的道德方向清楚，同时不将其具体化为某种宗派性的“背道”概念。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 保留群体共同如此的诗歌强调，也符合庄重而自然的现代汉语。
- source_word: נֶאֱלָחוּ
  choice: 变得败坏
  rationale: 该词可指变得污秽、腐败或受玷污；“败坏”能自然传达这里的道德含义，同时以脚注保留其较具污秽色彩的词义。
- source_word: אֵין
  choice: 没有
  rationale: 准确表达希伯来文存在句的绝对否定，现代汉语简洁自然。
- source_word: עֹשֵׂה
  choice: 行
  rationale: 分词描写以某种行为为特征的人；“行善的”以自然的名词化结构传达这一点。
- source_word: טוֹב
  choice: 善
  rationale: 在“行善”中表达广泛的道德之善，保持原文简练。
- source_word: גַּם אֶחָד
  choice: 连一个也没有
  rationale: 保留原文在否定之后进一步加强的语气，明确表示无一例外。
theological_decisions:
- issue: 诗篇谴责中人类败坏的范围
  choice: 按经文全面性的措辞译为“他们全都……没有……连一个也没有”。
  alternative: 将范围仅限于上下文中某一类特定的作恶者。
  rationale: 原文连续使用“全都”“没有”和“连一个”等全面性表达。译文保留诗句本身的普遍谴责，但不据此添加本节没有明说的完整教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“偏离正路”保留道路隐喻及道德方向；分号呈现希伯来诗句层层推进的结构。脚注标记置于整节末尾，但其内容明确对应“变得败坏”。
