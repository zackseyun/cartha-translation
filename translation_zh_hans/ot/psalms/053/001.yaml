  text: אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽ֝שְׁחִ֗יתוּ וְ/הִֽתְעִ֥יבוּ עָ֝֗וֶל אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/001.yaml
  text: The fool says in his heart[a], “There is no God.” They are corrupt; they commit abominable injustice; there is no one who does good.
translation:
  language: zh_hans
  text: 愚顽人心里说：“没有上帝。”他们已经败坏，行可憎的恶事[a]；没有一个人行善。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“行可憎的不义”。这句希伯来文的动词与名词搭配有不同理解：动词可表示“使……成为可憎的事”或“行可憎之事”，名词指“不义、恶行”。
    reason: 说明 וְהִתְעִיבוּ עָוֶל 的不寻常搭配及其可行译法，同时避免把其受词过度限定为“恶行”。
lexical_decisions:
- source_word: נָבָל
  choice: 愚顽人
  rationale: 这个词所指的不只是智力不足，而是道德败坏、无视上帝的人。“愚顽人”既保留圣经语境中的伦理含义，也符合庄重而通俗的现代汉语。
- source_word: בְּלִבּוֹ
  choice: 心里
  rationale: 保留希伯来文“在他的心中”的内在思想与意向意象；汉语“心里说”自然明白，而“愚顽人”本身已承接阳性单数所指。
- source_word: אֵין אֱלֹהִים
  choice: 没有上帝
  rationale: 直译其存在性否认；在以色列信仰语境中，אֱלֹהִים指真正的上帝，因此采用“上帝”，而不译作泛指的“神明”。
- source_word: הִשְׁחִיתוּ
  choice: 他们已经败坏
  rationale: 希伯来文由单数的代表性“愚顽人”转为复数动词，泛指这一类人。“已经败坏”表达完成式所呈现的败坏状态，同时保留复数转折。
- source_word: וְהִתְעִיבוּ עָוֶל
  choice: 行可憎的恶事
  rationale: 动词表达可憎、令人厌恶的行为，עָוֶל表示恶事、不义。此译自然地保留二者的组合，同时以脚注说明可行的结构与词义处理。
- source_word: אֵין עֹשֵׂה טוֹב
  choice: 没有一个人行善
  rationale: 清楚表达希伯来文存在否定加分词的结构，即在所论群体中找不到行善者；现代汉语自然简洁。
theological_decisions:
- issue: 首句单数与后续复数动词之间的转换
  choice: 首句保留代表性的单数“愚顽人”，后句用复数“他们”
  alternative: 全句统一为单数，或把首句也改为复数“愚顽人们”
  rationale: 希伯来文本身从单数 נָבָל 转为复数动词，修辞上由典型人物扩展到这一类人；保留这一转换，避免把原文的张力抹平。
- issue: “没有上帝”的语义范围
  choice: 按直接的存在性否认翻译为“没有上帝”
  alternative: 译为“上帝不存在”或“没有神”
  rationale: “没有上帝”最贴近原文简洁有力的说法，也不额外限定这句话是在作哲学论证、实践性否认或其他更窄的解释。
- issue: 代表性单数中的性别表达
  choice: 译为不显式标注代词性别的“愚顽人心里”
  alternative: 译为“愚顽人在他心里”或改成复数“他们心里”
  rationale: 汉语无需所有格代词即可准确表达单数所指；这样既不把原文单数改成复数，也避免生硬重复，并未改变原文的代表性阳性形式。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。“愚顽人”体现道德与属灵层面的愚妄；分号呈现诗行后半的总结力度。脚注标记置于其实际说明的“行可憎的恶事”之后，而不是置于“心里”之后。
