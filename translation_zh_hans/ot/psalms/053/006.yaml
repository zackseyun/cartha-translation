  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשֻׁע֪וֹת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב אֱ֭לֹהִים שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/006.yaml
  text: Oh[a], that the salvation of Israel would come out of Zion! When God restores the fortunes of his people, let Jacob rejoice; let Israel be glad.
translation:
  language: zh_hans
  text: 但愿以色列的救恩从锡安而来！当上帝恢复他子民的境况时[a]，愿雅各欢欣，愿以色列喜乐！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当上帝使他子民从被掳之地归回时”，或“当上帝使他子民中被掳的人归回时”。这个希伯来语习语可泛指上帝使人脱离困境、恢复景况，也常包括从被掳之地归回。
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: 但愿
  rationale: 这是表达强烈愿望的希伯来语习语，并非真正询问“谁会赐下”；“但愿”自然、庄重地保留了祈愿语气。
- source_word: מִצִּיּוֹן
  choice: 从锡安而来
  rationale: 介词 מִן 表示来源；“从锡安而来”既准确表达起点，也符合现代汉语习惯。
- source_word: יְשֻׁעוֹת יִשְׂרָאֵל
  choice: 以色列的救恩
  rationale: יְשֻׁעוֹת 虽为复数形式，在这里可作抽象或加强意义理解；汉语用单数性集合概念“救恩”最自然，同时保留它属于或临到以色列的关系。
- source_word: בְּשׁוּב אֱלֹהִים שְׁבוּת עַמּוֹ
  choice: 上帝使他子民的境况复原时
  rationale: בְּ 加不定式表示时间。“使……境况复原”传达 שׁוּב שְׁבוּת 这一习语所指的困境逆转与恢复，又不把意义限定为字面的被掳归回。
- source_word: יָגֵל יַעֲקֹב
  choice: 愿雅各欢欣
  rationale: 承接开头的祈愿语气，将未完成式译作愿望表达；“欢欣”适合诗歌语体。
- source_word: יִשְׂמַח יִשְׂרָאֵל
  choice: 愿以色列喜乐
  rationale: 以“喜乐”与前句“欢欣”形成意义相近而措辞有别的诗歌平行，保留雅各与以色列的对应。
theological_decisions:
- issue: שׁוּב שְׁבוּת 的复原含义
  choice: 使他子民的境况复原
  alternative: 使他子民从被掳中归回；使他被掳的子民复原
  rationale: 该希伯来语搭配既可用于被掳归回，也常泛指扭转困境、恢复景况。正文采用较宽广的习语含义，不排除被掳归回的历史意涵；较字面的可能读法列入脚注，以保留原文张力。
- issue: 末两句未完成式的语气
  choice: 愿雅各欢欣，愿以色列喜乐
  alternative: 雅各必欢欣，以色列必喜乐
  rationale: 这些形式既可能表达祈愿，也可能陈述将来的结果。鉴于本节以强烈愿望开头，正文采用连续的祈愿语气，同时承认结果式理解在语法上可能成立。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“但愿……愿……”贯穿全节，显出热切盼望；“欢欣／喜乐”保留平行句的词汇变化。脚注标记紧接其所说明的复原习语。
