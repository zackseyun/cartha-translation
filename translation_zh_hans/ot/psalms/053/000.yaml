lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给音乐指挥
  rationale: 该词在诗篇标题中通常指负责音乐演出的人。“音乐指挥”是现代汉语中清楚、自然的职能称谓，又不把范围限定为诗班。
- source_word: עַל
  choice: 按
  rationale: 在音乐性标题中，该介词可引出曲调、演奏方式或礼仪提示。“按”保留这种关系，同时不武断确定其具体技术含义。
- source_word: מָחֲלַת
  choice: 麻哈拉
  rationale: 所指不确定，可能是曲名或音乐、礼仪术语。采用音译，避免根据其可能与“疾病”有关的词源作推测性翻译。
- source_word: מַשְׂכִּיל
  choice: 玛斯基勒诗
  rationale: 这是诗篇标题中的技术术语，确切含义有争议。音译并补出类别词“诗”，既保留术语，又使现代读者容易识别。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 在诗篇标题中可能表示作者、归属、奉献对象或文集关联。“大卫的”在汉语中简洁自然，并可借脚注保留希伯来文的多重可能。
theological_decisions:
- issue: 诗篇标题的经文地位及与大卫的关系
  choice: 把标题作为经文译出，并以“大卫的”保留 לְדָוִד 的宽泛归属关系。
  alternative: 明确译作“大卫所作”，或把标题视为不译的编辑材料。
  rationale: 希伯来文本把该标题作为诗篇的一部分。“大卫的”不排除作者身份，却也不把原文可能表达的关联、奉献或文集归属缩减为单一结论。
translation_notes:
  register: 采用现代、庄重而易懂的标题体。“音乐指挥”避免古雅难懂；对两个含义不确定的技术词采用音译，并用脚注说明。脚注标记分别紧随所解释的词语。
