  yaml_path: translation/ot/psalms/105/029.yaml
  text: He turned their waters to blood and caused their fish to die[a].
translation:
  language: zh_hans
  text: 他使他们的水变成血，又使他们的鱼死亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָפַךְ
  choice: 使……变成
  rationale: 该动词可指转变、改变；结合灾祸语境和结果补语 לְדָם，译为“使……变成”自然且准确。
- source_word: מֵימֵיהֶם
  choice: 他们的水
  rationale: 原文为复数形式并带第三人称复数所有格，集合性地指埃及人的各处水域；现代汉语用“他们的水”表达更自然。
- source_word: לְדָם
  choice: 变成血
  rationale: 介词 לְ 在此标示变化后的结果；汉语以“变成血”清楚表达这一结果状态。
- source_word: וַיָּמֶת
  choice: 又使……死亡
  rationale: 原文是使役词干，明确表示主语导致鱼死亡；“使……死亡”保留使役含义，也比单译“鱼死了”更贴近原文。
- source_word: דְּגָתָם
  choice: 他们的鱼
  rationale: 该名词集合性地指鱼类；“他们的鱼”简洁自然，并保留原文的所有格。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使……变成……，又使……”保留两分句共同主语及第二个动词的使役语气；无需脚注，因为“变成血”已自然涵盖 לְדָם 的结果义，且不存在影响理解的实质性歧义。
