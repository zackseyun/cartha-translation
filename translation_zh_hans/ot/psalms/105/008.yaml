  text: זָכַ֣ר לְ/עוֹלָ֣ם בְּרִית֑/וֹ דָּבָ֥ר צִ֝וָּ֗ה לְ/אֶ֣לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/008.yaml
  text: He remembers his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: zh_hans
  text: '他永远记念他的约；

    他所吩咐的话，直到千代。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他所吩咐的话，直到千代”或译：“他所吩咐的应许，直到千代。”
    reason: 保留דָּבָר可译为“应许”的词汇替代，同时维持原文中“所吩咐的话”及其延及“千代”的表达。
lexical_decisions:
- source_word: זָכַר
  choice: 记念
  rationale: 该词为完成式，但诗歌语境强调上帝持续信守盟约；汉语“记念”可自然表达这种恒常有效的记取与信实，而不局限于过去某一时刻。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 直接表达持续无尽的时间，符合现代汉语，也保留盟约恒久不变的含义。
- source_word: בְּרִיתוֹ
  choice: 他的约
  rationale: “约”是圣经语境中בְּרִית的常用且准确译法，既简洁，又不把含义缩窄为世俗条约。
- source_word: דָּבָר
  choice: 话
  rationale: 保留该词“话、言语”的宽泛含义及其与“约”的诗歌平行关系，不在正文中直接限定为“应许”。
- source_word: צִוָּה
  choice: 吩咐
  rationale: צוה的加强词干通常表示命令或吩咐；“吩咐”在此庄重自然，也保留上帝话语带有权威命定的意味。
- source_word: לְאֶלֶף דּוֹר
  choice: 直到千代
  rationale: 介词לְ在此表示延及的范围；“直到千代”比“为一千代”更符合现代汉语，并保留希伯来文所表达的世代延续。
theological_decisions:
- issue: 上帝“记念”的时态和体貌
  choice: 采用无显式时态的“记念”，在“永远”的修饰下表达持续的盟约信实
  alternative: 译作“曾记念”或“已经记念”
  rationale: 希伯来语完成式可从不同角度观察行动；本节的赞美语境重在上帝恒久信守其约。汉语无需强加过去时，可保留持续与完成性的张力。
- issue: דָּבָר在盟约平行结构中的含义
  choice: 正文译作“话”
  alternative: 译作“应许”
  rationale: 此词很可能指上帝所说的盟约之言，但原词含义较宽。正文用“话”保持词义透明和诗歌平行，脚注保留较具解释性的“应许”。
- issue: צִוָּה的盟约语境含义
  choice: 译作“吩咐”
  alternative: 译作“立定”或“颁定”
  rationale: 正文保留动词通常的命令义，同时不排除这里带有权威设立、命定的语气。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“记念”保留圣经文体的尊严且仍为现代读者所能理解；分行显示“他的约”与“他吩咐的话”的平行关系。
