  text: He spoke[a], and locusts came—young locusts without number.
translation:
  language: zh_hans
  text: 他说，蝗虫就来了；蝻虫[a]多得数不清。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蝻虫”所译的希伯来语词指吞食作物的昆虫，可能是某一生长阶段或种类的蝗虫；较早的译本有时译作“毛虫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: 他一说
  rationale: אָמַר本义是“说”。译作“他一说”既保留原文用词，也自然表达灾害随他的话而来的诗意关系，不加上原文没有明说的“命令”之意。
- source_word: וַיָּבֹא
  choice: 便来了
  rationale: בוא在这里叙述蝗灾来到；“便来了”符合现代汉语表达，并承接前句，体现事件随即发生。
- source_word: אַרְבֶּה
  choice: 蝗虫
  rationale: 该词虽为单数形式，却常作集合名词，指成群的蝗虫；汉语“蝗虫”可自然表达这一集合意义。
- source_word: יֶלֶק
  choice: 蝻虫[a]
  rationale: 该词指吞食作物的昆虫，属于蝗灾词汇，很可能是某一生长阶段或种类的蝗虫。“蝻虫”简洁地表达未成熟蝗虫的可能含义，同时以脚注保留词义上的不确定性。
- source_word: וְאֵין מִסְפָּר
  choice: 多得数不清
  rationale: 这是表示无法计数的惯用语。“多得数不清”在现代汉语中清楚自然，也保留原文的夸张诗意。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“他一说……便……”保留诗句中神的话与灾害来到之间的紧密关系；分号呈现“蝗虫”和“蝻虫”两个并列名称，又避免译文生硬。
