source:
  edition: WLC
  text: הִֽ֭תְהַלְלוּ בְּ/שֵׁ֣ם קָדְשׁ֑/וֹ יִ֝שְׂמַ֗ח לֵ֤ב מְבַקְשֵׁ֬י יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/003.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: zh_hans
  text: 要以他的圣名为荣[a]；愿寻求雅威的人，心里欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要因他的圣名欢欣。”希伯来语动词可表示欢欣，也可表示以某人或某事为荣、以之夸耀。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: 要……为荣
  rationale: 该词是הלל的Hitpael复数祈使式，在此表示因某人或某事而自豪、夸耀或欢欣。“以……为荣”既保留这种自豪之意，又比“夸口”更自然地适合敬拜语境。
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: 以他的圣名
  rationale: 介词ב与“名”连用，在汉语中自然译作“以……为荣”。“圣名”保留“名”这一重要意象及其所指向的身份、品格和声誉。
- source_word: יִשְׂמַח
  choice: 愿……欢喜
  rationale: 该词形态上是第三人称阳性单数未完成式；在诗歌语境中可表达愿望或劝勉。“愿……欢喜”保留这种语气，不把它处理成单纯的事实陈述。
- source_word: לֵב
  choice: 心里
  rationale: 原文用单数“心”作集合性表达，指人的内在生命。汉语“心里欢喜”自然，也能覆盖复数的“寻求者”，无需机械译成“众心”。
- source_word: מְבַקְשֵׁי יְהוָה
  choice: 寻求雅威的人
  rationale: 分词结构表示以寻求雅威为持续特征的人；此译法简明自然，并保留持续性的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在以现代汉语常见音译保留这一专名；“耶和华”是传统译名，但反映的是另一种历史读法。
- issue: יִשְׂמַח的语气
  choice: 愿……欢喜
  alternative: ……必欢喜／……欢喜
  rationale: 诗句承接前面的祈使式，可理解为愿望或劝勉。采用“愿”保留其语气张力，不将其确定为预言或直陈事实。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“以……为荣”避免“夸口”在现代汉语中可能过强的负面色彩；分号保留两行之间的平行关系。
