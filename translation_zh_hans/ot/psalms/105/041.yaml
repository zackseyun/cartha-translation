  text: פָּ֣תַח צ֭וּר וַ/יָּז֣וּבוּ מָ֑יִם הָ֝לְכ֗וּ בַּ/צִּיּ֥וֹת נָהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/041.yaml
  text: He opened the rock[a], and water gushed out; they flowed through the dry places like a river.
translation:
  language: zh_hans
  text: 他打开磐石，水就涌了出来；水流过干旱之地，宛如江河。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“水在干旱之地流淌，成了江河。”希伯来文没有明说“宛如”，更直译可把“江河”理解为对水流的直接描述。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַח
  choice: 打开
  rationale: 基本义为“打开”。虽然磐石出水的语境可使人联想到“劈开”，但原词本身不要求更强烈的动作，因此保留较为直接的表达。
- source_word: צוּר
  choice: 磐石
  rationale: 指旷野中上帝使之出水的那块磐石；“磐石”既符合诗体语域，也能自然承接这一历史典故。
- source_word: וַיָּז֣וּבוּ מָיִם
  choice: 水就涌了出来
  rationale: 动词表示水流出、涌出；“涌了出来”体现水从磐石中突然且充沛地流出。希伯来文“水”为复数形式的集合名词，汉语自然用单数集合概念。
- source_word: הָלְכוּ
  choice: 水流过
  rationale: 字面为“它们行去”，主语承接复数形式的“水”。按汉语习惯重提“水”并译作“流过”，清楚表达水的移动。
- source_word: בַּצִּיּוֹת
  choice: 干旱之地
  rationale: 该词指干燥、焦旱的地方；此译法保持范围宽泛，不把它限定为沙漠。
- source_word: נָהָר
  choice: 宛如江河
  rationale: 原文末尾仅有“江河”一词，可作同位或述谓成分，描述水流之势。正文补出比较语“宛如”，使现代汉语自然，同时用脚注保留更直译的可能。
theological_decisions:
- issue: 本节是否特指旷野中磐石出水的历史事件
  choice: 译为上帝使磐石出水、供应以色列人的历史诗歌叙述
  alternative: 将其泛化为上帝供应的抽象比喻
  rationale: 诗篇105篇在回顾以色列历史，本节主要指向旷野中的供水事件；译文保留历史画面，不额外明说其神学应用。
- issue: 末句“江河”的句法关系
  choice: 以明喻“宛如江河”表达水流浩大的景象
  alternative: 将“江河”直译为同位或述谓成分，如“水在干旱之地流淌，是一条河”
  rationale: 希伯来文未使用明确的比较词，因此两种理解均有可能。正文采用较自然的汉语明喻，脚注说明原文更简略的结构，避免把解释伪装成唯一读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“打开磐石”有意保留原文较朴素的动词；“水就涌了出来”传达事件的突然与丰沛；分号保留两小句的诗行推进。脚注标记置于其实际说明的末句之后。
