  text: The king sent and released him[b][a]; the ruler of peoples set him free.
translation:
  language: zh_hans
  text: 王派人释放了他[a]；众民的统治者使他得自由[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“解开了他的捆绑”，或“使他脱离束缚”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“打开了他”或“为他打开”；这里的意思是解除监禁，使他自由。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: 差人来
  rationale: 该词基本义为“派遣、差遣”。原文没有明说所差的是谁；汉语用“差人来”自然表达君王派人执行命令，同时不把“传令”等未明说的内容写入正文。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 上下文所指为法老，虽希伯来诗句中没有冠词，语境中的指称仍是确定的；汉语直接用“王”简洁自然。
- source_word: וַיַּתִּירֵהוּ
  choice: 释放了他
  rationale: 此处表示解除束缚、从监禁中放出。“释放了他”准确切合约瑟的处境，也符合现代汉语。
- source_word: מֹשֵׁל עַמִּים
  choice: 众民的统治者
  rationale: מֹשֵׁל是“统治者”，עַמִּים是复数“众民、各族之民”。“众民的统治者”保留复数群体意味，并与上句“王”形成诗歌平行。
- source_word: וַיְפַתְּחֵהוּ
  choice: 使他重获自由
  rationale: פתח通常意为“打开”，但此处以人为宾语，在监禁语境中表达为他打开牢门、解除拘禁。“使他重获自由”传达该习语的实际含义，避免生硬直译。
theological_decisions: []
