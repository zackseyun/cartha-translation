  text: דִּרְשׁ֣וּ יְהוָ֣ה וְ/עֻזּ֑/וֹ בַּקְּשׁ֖וּ פָנָ֣י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/004.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: zh_hans
  text: 要寻求耶和华和他的力量；要不断寻求他的面容[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要不断寻求他的同在。”希伯来文直译为“要不断寻求他的面容”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: 寻求
  rationale: 该复数命令式在敬拜语境中指主动转向并追求神；“寻求”自然保留其意志与敬虔意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名“耶和华”直接译出四字神名，而不以称号替代。
- source_word: וְעֻזּוֹ
  choice: 和他的力量
  rationale: עֹז 表示力量、能力或威力；“力量”直接而自然，并保留第三人称所属关系。
- source_word: בַּקְּשׁוּ
  choice: 寻求
  rationale: 该复数命令式强调主动寻找；与前一动词同译为“寻求”，可保留希伯来诗句的平行结构。
- source_word: פָנָיו
  choice: 他的面
  rationale: 原文直译为“他的面”，也可转指他的临在；正文保留具体而富关系性的希伯来意象，脚注说明习语含义。
- source_word: תָּמִיד
  choice: 不断
  rationale: 表达持续、经常不止的行动；“不断”在现代汉语中简洁自然，又不必机械理解为毫无间断。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用现代中文圣经传统中最广为人知的专名“耶和华”，保留其作为名字而非称号的性质。
- issue: פָנָיו 应直译为“他的面”还是意译为“他的同在”
  choice: 他的面
  alternative: 他的同在
  rationale: 该希伯来习语可指神的临在，但直译保留了诗歌中的拟人意象和关系张力；习语意义在脚注中交代，不在正文中提前消解。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“要……；要……”保留两个复数命令式的劝勉力度和平行结构；避免使用较古雅的“时常”或“仰求”。
