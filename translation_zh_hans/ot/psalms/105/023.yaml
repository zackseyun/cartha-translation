  text: וַ/יָּבֹ֣א יִשְׂרָאֵ֣ל מִצְרָ֑יִם וְ֝/יַעֲקֹ֗ב גָּ֣ר בְּ/אֶֽרֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/023.yaml
  text: Then Israel came to Egypt[b][a], and Jacob lived as a foreigner in the land of Ham.
translation:
  language: zh_hans
  text: 于是，以色列来到埃及；雅各寄居在含地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “含地”是对埃及的诗性称呼。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 于是……来到
  rationale: 该叙事性连接形式推进历史回顾；“于是”自然表达承接次序，“来到”保留 בוא 的基本意义。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用通行译名，并与下半句“雅各”并列，保留原诗以两个名字指称同一位先祖及其所代表群体的表达。
- source_word: מִצְרָיִם
  choice: 埃及
  rationale: 采用该地名的现代汉语通行译法。
- source_word: וְיַעֲקֹב
  choice: 雅各
  rationale: 采用通行译名；不改为代词，以保留“以色列／雅各”的诗歌平行结构。
- source_word: גָּר
  choice: 寄居
  rationale: גור 在此表示以非本地人身份居住；“寄居”简洁、庄重，也保留暂住或外来者身份的语义。
- source_word: בְּאֶרֶץ
  choice: 在……地
  rationale: אֶרֶץ 指土地或国土；与专名“含”结合译作“含地”，符合中文圣经诗歌用语。
- source_word: חָם
  choice: 含
  rationale: 保留专名，不在正文中直接改写为“埃及”，从而保存原文的诗性称谓。
theological_decisions:
- issue: 是否将“以色列／雅各”的诗歌平行表达合并为单一称谓
  choice: 正文保留两个名字
  alternative: 统一译作“雅各”或“以色列”
  rationale: 希伯来文有意在两个分句中分别使用“以色列”和“雅各”。保留二者既保存诗歌结构，也不额外限定先祖与其所代表民族之间的关系。
- issue: 是否把“含地”直接解释性翻译为“埃及”
  choice: 正文保留“含地”，脚注说明
  alternative: 正文译作“埃及”
  rationale: “含地”是原文的诗性称呼；保留它可维持措辞与平行结构，脚注则帮助现代读者理解其所指。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌体中文。“寄居”虽略带传统圣经语体，但在现代汉语中仍易懂，并准确表达以外来者身份居住的含义。正文以分号呈现两个平行分句。
