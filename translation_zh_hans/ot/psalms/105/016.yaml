  yaml_path: translation/ot/psalms/105/016.yaml
  text: He called for famine on the land[a]; he broke every staff of bread.
translation:
  language: zh_hans
  text: 他召来饥荒，使它降在那地；他断绝了一切粮食的供应[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切粮食的供应”直译“每一根粮食之杖”，是指维持生命的粮食供应。
    reason: 说明“粮食之杖”这一希伯来语惯用语，并保留原文的比喻意象。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召来
  rationale: קרא以“饥荒”为宾语时，表示召唤其临到或使其发生。“召来”既保留原文的拟人化表达，也自然传达上帝主动使饥荒临到。
- source_word: רָעָב
  choice: 饥荒
  rationale: 此处指波及全地的粮食匮乏，而非个人的饥饿。
- source_word: עַל הָאָרֶץ
  choice: 降在那地
  rationale: 介词短语表示饥荒临到该地；“那地”承接诗篇叙述中的特定地域，不扩大为全球性的“全地”。
- source_word: כָּל מַטֵּה לֶחֶם
  choice: 一切粮食的供应
  rationale: מַטֵּה לֶחֶם字面为“粮食的杖”，是以支撑生命之杖比喻赖以维生的粮食供应。中文若直译为“粮食之杖”难以自然传意，因此正文表达其惯用义，并在脚注保留原文意象。
- source_word: שָׁבָר
  choice: 断绝了
  rationale: שׁבר基本义为“折断”；因正文将其宾语按惯用义译作“粮食的供应”，用“断绝”可自然保留供应被彻底破坏的意义。
theological_decisions:
- issue: 饥荒中的神圣主体与能动性
  choice: 两句都以上帝为省略的主语：“他召来……他断绝……”
  alternative: 把事件处理成无人称的自然灾害描述
  rationale: 上下文叙述耶和华的作为，两个阳性单数动词自然延续这一主语。译文保留明确的神圣能动性，但不添加原文未说明的目的。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“召来饥荒，降在那地”保留诗歌的拟人化和节奏；“断绝了一切粮食的供应”使希伯来惯用语对普通读者清楚可懂。脚注标记置于与该惯用语相关的分句之后。
