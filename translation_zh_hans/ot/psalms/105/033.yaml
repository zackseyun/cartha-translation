  text: וַ/יַּ֣ךְ גַּ֭פְנָ/ם וּ/תְאֵנָתָ֑/ם וַ֝/יְשַׁבֵּ֗ר עֵ֣ץ גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/033.yaml
  text: He struck their vines and their fig trees[a], and shattered the trees of their territory.
translation:
  language: zh_hans
  text: 他击打他们的葡萄树和无花果树，又折断他们境内的树木。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: 他击打
  rationale: נכה表示击打、重创；“击打”简洁有力，也承接上下文中上帝施行灾害的叙述。
- source_word: גַּפְנָם
  choice: 他们的葡萄树
  rationale: גֶּפֶן指葡萄藤或葡萄树；此处为集合用法，“葡萄树”在现代汉语中自然明确。
- source_word: וּתְאֵנָתָם
  choice: 和无花果树
  rationale: תְּאֵנָה意为无花果树；虽在希伯来文中为单数形式并带复数物主后缀，此处与葡萄树并列，具有集合意义。汉语不必重复“他们的”。
- source_word: וַיְשַׁבֵּר
  choice: 又折断
  rationale: שׁבר的Piel词干表达强力破坏；针对树木，“折断”比“打碎”更自然，并保留毁坏的力度。
- source_word: עֵץ
  choice: 树木
  rationale: עֵץ可指树或木材；本节语境指生长着的树，集合性的“树木”贴合原文单数名词的类属用法。
- source_word: גְּבוּלָם
  choice: 他们境内的
  rationale: גְּבוּל可指边界或边界以内的疆域。与“树木”搭配时，“境内的”自然表达其地域范围，同时不误解为只在边界线上的树。
theological_decisions:
- issue: 两个动词的隐含主语
  choice: 译作“他”，依上下文指上帝
  alternative: 明确译作“上帝”或“耶和华”
  rationale: 希伯来文使用第三人称阳性单数动词，主语由上下文承接。中文补出“他”即可保持连贯，也避免在本节中加入原文未明说的神名。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“击打”保留审判行动的力度；“又折断”符合树木受毁坏的自然表达。原文“他们疆域的树木”与“他们境内的树木”之间不存在需要另设脚注的实质语义差异，因此正文直接采用自然译法。
