  yaml_path: translation/ot/psalms/105/042.yaml
  text: For he remembered his holy word to Abraham his servant[a][b].
translation:
  language: zh_hans
  text: 因为他记念自己的圣言，也记念他的仆人亚伯拉罕[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣言”在这里指神所说的应许。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此连词说明前文所述作为的原因；中文用“因为”自然承接，也保留希伯来文的因果关系。
- source_word: זָכַר
  choice: 记念
  rationale: 既保留“记得”的圣经表达，又可包含神按先前所说之话采取行动的盟约语境，不直接扩译为“实现”。
- source_word: דְּבַר קָדְשׁוֹ
  choice: 自己的圣言
  rationale: דָּבָר本义为“话、言语”，在此语境中带有应许的含义；“圣言”简洁地保留“圣”与“话”两层意义。
- source_word: אֶת אַבְרָהָם
  choice: 给……亚伯拉罕的话
  rationale: 第二个אֶת所表达的句法关系并不完全明朗；结合上下文，以“给”表达这圣言是向亚伯拉罕所说的，同时用“就是……的话”使现代中文通顺。
- source_word: עַבְדּוֹ
  choice: 他仆人
  rationale: “仆人”符合亚伯拉罕与神的关系及诗篇语体，比“奴隶”更贴合本处语境。
theological_decisions:
- issue: “记念”的盟约含义
  choice: 保留“记念”
  alternative: 实现他的应许
  rationale: 原文说神“记念”，在语境中暗含按应许行事，但不宜在正文中直接把含义收窄为“实现”。
- issue: “圣言”与亚伯拉罕之间的关系
  choice: 就是给他仆人亚伯拉罕的话
  alternative: 与他仆人亚伯拉罕所立的神圣应许
  rationale: 希伯来文没有显明的介词，关系存在一定句法含混；所选译法依据上下文表达“向亚伯拉罕所说”，却不加入“立约”等原文未明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语言。“记念”保留传统圣经语感；“就是给……的话”澄清中文句法，同时脚注说明“圣言”的应许含义。
