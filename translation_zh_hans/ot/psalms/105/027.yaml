  text: שָֽׂמוּ בָ֭/ם דִּבְרֵ֣י אֹתוֹתָ֑י/ו וּ֝/מֹפְתִ֗ים בְּ/אֶ֣רֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/027.yaml
  text: They performed among them the words of his signs[c][b][a], and wonders in the land of Ham.
translation:
  language: zh_hans
  text: 他们在那些人中施行了他的神迹[a]，在含地行了奇事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“他神迹的话”；“话”也可指“事情”。
    reason: 保留原文不寻常措辞及词义歧义。
  - marker: b
    text: “含地”是诗歌中对埃及的称呼。
    reason: 说明古代诗歌地名。
lexical_decisions:
- source_word: שָׂמוּ
  choice: 施行了
  rationale: שׂוּם本义为“放置、设立”，在这里以神迹奇事为宾语，表达把这些事实际行出来；“施行”符合现代汉语的圣经语体，也保留行动性的含义。
- source_word: בָם
  choice: 在那些人中
  rationale: 介词ב加复数代词后缀，所指是埃及人；译为“在那些人中”说明神迹发生在他们中间，避免误解为发生在人体内部。
- source_word: דִּבְרֵי אֹתוֹתָיו
  choice: 他的神迹[a]
  rationale: 该短语直译为“他神迹的话／事情”，希伯来语表达不寻常。正文按语境自然表达为“他的神迹”，并以脚注保留דִּבְרֵי可能表示“话”或“事情”的真实歧义。
- source_word: וּמֹפְתִים
  choice: 奇事
  rationale: מוֹפֵת常与אוֹת并列，表示令人惊异、具有征兆意义的作为；“神迹……奇事”是清楚而庄重的汉语搭配。
- source_word: בְּאֶרֶץ חָם
  choice: 在含地
  rationale: 保留诗歌中对埃及的称呼“含地”，而不直接以“埃及”替换；其所指由脚注说明。
theological_decisions:
- issue: “他神迹的话／事情”的不寻常结构
  choice: 正文译作“他的神迹”，脚注交代字面形式及词义歧义
  alternative: “他神迹的话”或“他神迹的事情”
  rationale: 直译在现代汉语中既生硬又容易被理解为神迹本身会说话；只译“神迹”能准确传达本节所述的行动，同时脚注避免掩盖原文中דִּבְרֵי的存在，也不武断认定它专指神的命令、神谕或事件。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“施行神迹”“行奇事”保持诗歌的平行结构；“含地”保留原文意象，并用脚注帮助普通读者理解。
