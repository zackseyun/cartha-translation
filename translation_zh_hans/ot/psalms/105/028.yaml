  text: שָׁ֣לַֽח חֹ֭שֶׁךְ וַ/יַּחְשִׁ֑ךְ וְ/לֹֽא מָ֝ר֗וּ אֶת דברו/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/028.yaml
  text: He sent darkness and made it dark[a], and they did not rebel against his words.
translation:
  language: zh_hans
  text: 他降下黑暗，叫一切都昏暗；他们没有抗拒他的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们没有抗拒他的命令。”“他的话”也可理解为“他的话语”（复数）。原文没有明说“他们”是谁；有人认为是埃及人，也有人认为是摩西和亚伦。
    reason: 说明“他的话”可作单数或集合性／复数理解，并保留隐含复数主语所指的歧义。
lexical_decisions:
- source_word: שָׁלַח
  choice: 降下
  rationale: 此处以黑暗为宾语，意为上帝使黑暗临到；“降下”在中文中自然，并保留灾祸从上帝而来的含义。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 这是该词在黑暗之灾语境中的直接、通行译法。
- source_word: וַיַּחְשִׁךְ
  choice: 使那里一片黑暗
  rationale: 保留使役含义，同时用“那里”自然补足中文表达；不具体限定变黑的对象，以免超出原文。
- source_word: וְלֹא
  choice: 没有
  rationale: 忠实表达并列否定，不添加“却”等更强的转折意味。
- source_word: מָרוּ
  choice: 违背
  rationale: 表达不服从、抗拒之意，也能自然地与“话”搭配；较“反叛”更符合现代中文语境。
- source_word: אֶת דברו/ו
  choice: 他的话
  rationale: “话”在中文中可作集合性表达，既贴近“他的话语”，也不强行排除希伯来文本可能具有的单数理解。
theological_decisions:
- issue: “他们没有违背”中隐含主语的所指
  choice: 保留“他们”，不明确其所指
  alternative: 明确译为埃及人，或明确译为摩西和亚伦
  rationale: 希伯来文只借动词形式表示复数主语，并未明说所指；上下文可产生不同理解，因此正文保留歧义。
- issue: אֶת דברו/ו 的数与语义
  choice: 译为“他的话”
  alternative: 译为“他的命令”
  rationale: “他的话”较贴近原文字面，也能在中文中涵盖集合性或单数意义；“命令”虽符合语境，却会进一步解释原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事诗体。“一片黑暗”使使役结构在中文中自然；分号保留两分句的并列关系。
