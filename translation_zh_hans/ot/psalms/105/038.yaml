  text: Egypt was glad when they departed[b][a], for dread of them had fallen upon them.
translation:
  language: zh_hans
  text: 他们离去时，埃及欢喜，因为对他们的惧怕临到埃及人身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂמַח
  choice: 欢喜
  rationale: 该词为Qal完成式第三人称阳性单数，与集合性主语“埃及”搭配，表示埃及因以色列人离去而感到欣喜；“欢喜”自然、庄重，也保留了原词的积极情感。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 原文以国名作集合性主语，既可指国家，也可转指埃及人民；正文保留“埃及”，贴近希伯来文的表达。
- source_word: בְּצֵאתָם
  choice: 因他们离去
  rationale: 介词ב与יצא的不定词构词连用，可表达时间或伴随情形；结合שׂמח，在汉语中译为“因他们离去而欢喜”自然地呈现埃及欢喜的契机和缘由。“他们”依上下文指以色列人。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出埃及欢喜的原因；“因为”在现代汉语中清楚自然。
- source_word: נָפַל
  choice: 临到了
  rationale: 原义为“落下”，与“惧怕”连用时表达惧怕降临并笼罩某人；“临到了”保留原文动态意象，同时符合庄重的现代汉语。
- source_word: פַּחְדָּם
  choice: 对他们的惧怕
  rationale: פַּחַד表示强烈的惧怕、畏惧；词尾代词在此按对象关系理解，即埃及人对以色列人的惧怕。译文避免“他们的惧怕”可能造成的所属关系歧义。
- source_word: עֲלֵיהֶם
  choice: 埃及人
  rationale: 介词על加第三人称复数词尾，直译为“在他们身上/临到他们”；其所指是埃及人。汉语中明确译出“埃及人”，可避免本节两组第三人称复数所造成的指代混乱。
