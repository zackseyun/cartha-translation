  text: אַֽל תִּגְּע֥וּ בִ/מְשִׁיחָ֑/י וְ֝/לִ/נְבִיאַ/י אַל תָּרֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/015.yaml
  text: Do not touch my anointed ones[a], and do my prophets no harm.
translation:
  language: zh_hans
  text: 不可触碰我所膏立的人[a]，也不可伤害我的先知。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我的受膏者”，是复数；这个词与“弥赛亚”一词相关，但这里指神所膏立、分别出来的人，并非特指那位独一的弥赛亚。
    reason: 说明原文复数形式及其与“弥赛亚”的词源关系，防止产生单数弥赛亚称号的误解。
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: 触碰
  rationale: 该词通常表示“触摸、触及”，在此禁令中保留原文的直接表达，不把含义限缩为“击打”或泛化为“伤害”.
- source_word: בִמְשִׁיחָי
  choice: 我所膏立的人
  rationale: 原文为复数并带第一人称单数所属后缀，指神所膏立、分别出来的众人；这样译既体现“受膏”的含义，也避免被误解为单数的弥赛亚称号。
- source_word: לִנְבִיאַי
  choice: 我的先知
  rationale: 准确体现“先知”的复数形式及第一人称单数所属关系。
- source_word: תָּרֵעוּ
  choice: 伤害
  rationale: 该使役形式在禁令中表示加害、使之受损；“伤害”符合现代汉语，并与上句形成清楚的诗歌平行。
- source_word: אַל
  choice: 不可
  rationale: אַל加未完成式表达禁止；“不可”简洁庄重，适合诗篇语体。
theological_decisions:
- issue: 非特指弥赛亚语境中复数מְשִׁיחַ的译法
  choice: 我所膏立的人
  alternative: 我的受膏者；我的弥赛亚们
  rationale: 此处形式明确为复数，语境指神所分别、保护的人，并非直接指独一的弥赛亚。“我所膏立的人”保留其词义和复数所指，同时避免输入后来的单数弥赛亚专称。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“不可……也不可……”保留希伯来诗歌的平行结构；脚注标记已置于相关短语之后。
