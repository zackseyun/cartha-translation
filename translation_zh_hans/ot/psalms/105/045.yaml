id: PSA.105.45
reference: Psalms 105:45
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/עֲב֤וּר יִשְׁמְר֣וּ חֻ֭קָּי/ו וְ/תוֹרֹתָ֥י/ו יִנְצֹ֗רוּ הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/045.yaml
  text: so that they might keep his statutes and observe his laws[b][a]. Praise Yah!
translation:
  language: zh_hans
  text: 为使他们遵守他的律例，谨守他的训诲。你们要赞美雅！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们要赞美雅”原文由“赞美”这一命令和神名的缩略形式“雅”组成；也常音译作“哈利路亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: 为使
  rationale: 引出目的或预期结果；“为使”在现代汉语中简洁自然，并保留原文的目的意味。
- source_word: יִשְׁמְרוּ
  choice: 遵守
  rationale: שׁמר与律例连用时表示持守、遵行；“遵守”符合现代汉语中法律与盟约语境。
- source_word: חֻקָּיו
  choice: 他的律例
  rationale: חֻקִּים指规定、律例；“律例”保留其法律和盟约色彩。
- source_word: וְתוֹרֹתָיו
  choice: 他的训诲
  rationale: תּוֹרָה复数既可指律法，也可指教导、训诲；“训诲”保留较宽语义，并避免与“律例”合并为同一概念。
- source_word: יִנְצֹרוּ
  choice: 谨守
  rationale: נצר含看守、保守并认真遵行之意；“谨守”体现细心持守，也与前句“遵守”形成有区别的平行表达。
- source_word: הַלְלוּ יָהּ
  choice: 你们要赞美雅
  rationale: הַלְלוּ是复数命令式，故明示“你们要赞美”；יָהּ是神名的缩略形式，音译为“雅”，不与完整的四字神名混同。
theological_decisions:
- issue: 结尾颂赞中神名缩略形式יָהּ的译法
  choice: 雅
  alternative: 耶和华；哈利路亚
  rationale: 原文使用יָהּ而不是完整的יהוה。“雅”保留其缩略神名形式；“哈利路亚”虽为通行音译，却会掩盖“赞美”这一命令与神名的内部结构。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。两组平行词分别译为“遵守他的律例”和“谨守他的训诲”，既保留诗句平行结构，也不抹平חֻקִּים与תּוֹרוֹת、שׁמר与נצר之间的词义差别。
