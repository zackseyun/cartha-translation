  text: הָפַ֣ךְ לִ֭בָּ/ם לִ/שְׂנֹ֣א עַמּ֑/וֹ לְ֝/הִתְנַכֵּ֗ל בַּ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/025.yaml
  text: He turned their heart to hate his people[b][a], to deal deceitfully with his servants.
translation:
  language: zh_hans
  text: 他使他们的心[b]转而憎恨他的百姓，并诡诈地对付他的仆人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诡诈地对付”也可译作“用计谋对付”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“他们的心”，其中“心”是单数，是把他们作为一个整体来表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפַךְ
  choice: 使……转而
  rationale: 该动词有“转变、翻转”之意；与“心”和后续不定式连用时，“使……转而”既保留明确的使动意味，也符合现代汉语表达。
- source_word: לִבָּם
  choice: 他们的心
  rationale: 原文“心”为单数，带复数属人后缀，是把群体视为整体的集合表达；保留单数也传达其共同的内在倾向。
- source_word: לִשְׂנֹא
  choice: 恨
  rationale: 不定式承接“使……转而”，可表达目的或结果；译作“恨”简洁直接，并保留原文在目的与结果之间的可能张力。
- source_word: עַמּוֹ
  choice: 他的百姓
  rationale: עַם在此指上帝的子民以色列；“百姓”是自然且庄重的对应表达。
- source_word: לְהִתְנַכֵּל
  choice: 诡诈地对付
  rationale: נכל的Hitpael形式表示以欺骗或计谋行事；“诡诈地对付”同时呈现其手段和敌对指向。
- source_word: בַּעֲבָדָיו
  choice: 他的仆人
  rationale: ב在此与“对付”搭配，表达行为所针对的对象；עבד在本语境中强调以色列人属于并服事上帝，故译“仆人”而非“奴隶”。
theological_decisions:
- issue: 上帝使埃及人的内在倾向转变
  choice: 保留直接的神圣主动性：“他使他们的心转而……”
  alternative: “他任凭他们的心转变”或“他们的心转变了”
  rationale: 原文以第三人称阳性单数动词直接陈述行动，按上下文主语是上帝。译文不将其弱化为许可或被动，以保留神的主权与人的敌意并存所形成的神学张力。
- issue: 两个不定式表达目的还是结果
  choice: 采用并列而紧凑的“恨……并……对付”，不明确限定为纯目的或纯结果
  alternative: “以致他们恨……”或“为要使他们恨……”
  rationale: 希伯来语ל加不定式在此可有目的或结果色彩；译文避免加入“以致”或“为了”，以保存原文的语义开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使……转而”保留原文强烈的使动语气；“诡诈地对付”比生硬的直译更自然，同时不淡化敌对和欺骗意味。脚注标记均置于正文相关分句之后。
