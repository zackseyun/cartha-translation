  text: זִכְר֗וּ נִפְלְאוֹתָ֥י/ו אֲשֶׁר עָשָׂ֑ה מֹ֝פְתָ֗י/ו וּ/מִשְׁפְּטֵי פִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/005.yaml
  text: Remember the wonders that he has done[a], his signs and the judgments of his mouth[c][b],
translation:
  language: zh_hans
  text: 要记住他所行的奇事[a]，他的神迹[b]，以及他口中的判决[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他奇妙的作为”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的异兆”或“他的奇迹”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他所宣告的判决”或“他口中的典章”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: 要记住
  rationale: 复数祈使式，呼吁群体主动铭记；“要记住”在现代汉语中直接、自然，并保留劝令语气。
- source_word: נִפְלְאוֹתָיו
  choice: 他所行的奇事
  rationale: 该词指令人惊叹的非凡作为；结合后面的关系从句 אֲשֶׁר עָשָׂה 译为“他所行的奇事”，既自然又明确指向行动。
- source_word: אֲשֶׁר עָשָׂה
  choice: 所行的
  rationale: 作为修饰“奇事”的关系从句，汉语用“所行的”简洁自然，也保留这些奇事是他施行的这一信息。
- source_word: מֹפְתָיו
  choice: 他的神迹
  rationale: מופת 可指作为凭证的异兆、奇迹或神迹；“神迹”在此语境中通顺，并与“奇事”形成有区别而彼此重叠的诗性平行。
- source_word: וּמִשְׁפְּטֵי פִיו
  choice: 以及他口中的判决
  rationale: מִשְׁפָּט 可指判决、审断或典章；“他口中的判决”保留希伯来文的口部意象，也不把含义限定为法规。
- source_word: פִיו
  choice: 他口中
  rationale: 直译口部意象，保留原文拟人化和诗歌表达；汉语“他口中的”比“他的口的”自然。
theological_decisions:
- issue: נִפְלְאוֹת 与 מֹפְתִים 所指神圣作为的关系
  choice: 分别译为“奇事”和“神迹”，视为有区别但彼此重叠的表达
  alternative: “奇妙作为”和“异兆”；或把两者都理解为一般性的奇迹
  rationale: 原文连续使用两个相关词来铺陈上帝的大能作为，却没有要求建立严格的神学分类；用两个不同词保留诗性平行和语义差异。
- issue: מִשְׁפְּטֵי פִיו 的含义
  choice: 译为“他口中的判决”，保留所宣告之审断的开放含义
  alternative: “他所宣告的判决”或“他口中的典章”
  rationale: 该短语可能指上帝说出的判决、审断或法令。较直译的表达保留“口”的意象，也避免过早把语义限定为司法裁决或律法典章。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首“要记住”保留群体劝令；三个宾语依次排列，以逗号和“以及”呈现诗歌的累积感。所有脚注标记均紧随对应词语。
