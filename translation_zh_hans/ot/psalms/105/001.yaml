  text: הוֹד֣וּ לַ֭/יהוָה קִרְא֣וּ בִּ/שְׁמ֑/וֹ הוֹדִ֥יעוּ בָ֝/עַמִּ֗ים עֲלִילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/001.yaml
  text: Give thanks to Yahweh[a]; call on his name; make his deeds known among the peoples.
translation:
  language: zh_hans
  text: 你们要称谢雅威[a]，求告他的名；在万民中传扬他的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 יהוה（YHWH），这里音译作“雅威”；中文传统也常译作“耶和华”，或以“上主”等称号代替。
    reason: 说明神名的原文形式及常见译法。
lexical_decisions:
- source_word: הוֹדוּ
  choice: 称谢
  rationale: 该词是 ידה 的使役式复数命令形，在诗篇敬拜语境中表示向上帝献上感谢和颂赞。“称谢”兼顾感谢与赞美的含义，也符合庄重而自然的现代中文表达。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 介词 ל 标明称谢的对象；יהוה 是上帝的专名，正文以“雅威”音译，避免将专名改写为称号。
- source_word: קִרְאוּ בִּשְׁמוֹ
  choice: 求告他的名
  rationale: קרא 与 בְּשֵׁם 连用，通常表示呼求或援引某人的名。“求告他的名”保留祷告和敬拜的意味，并符合汉语圣经语体。
- source_word: הוֹדִיעוּ
  choice: 传扬
  rationale: ידע 的使役式复数命令形本义为“使人知道”。结合其宾语“他的作为”和公开宣告的语境，“传扬”以自然中文表达其使他人知晓的使役含义。
- source_word: בָעַמִּים
  choice: 在万民中
  rationale: 介词 ב 表示范围或所在之处，עַמִּים 为复数，指众民族或众民。“在万民中”保留跨民族的广泛范围，不把它收窄为现代政治意义上的国家。
- source_word: עֲלִילוֹתָיו
  choice: 他的作为
  rationale: עֲלִילוֹת 指所行的事或行动。“作为”宽泛而庄重；不增添原词未明说的“大能”等修饰。
theological_decisions:
- issue: 如何译写神名 יהוה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名 יהוה。正文采用接近“Yahweh”的中文音译“雅威”，以保留其专名性质；脚注说明原文形式及常见中文译法，不将专名默默替换为称号。
- issue: קִרְאוּ בִּשְׁמוֹ 的敬拜含义
  choice: 求告他的名
  alternative: 宣告他的名；奉他的名呼喊
  rationale: 这一搭配可涉及呼求、援引或宣告；本句处于称谢与传扬的敬拜语境中，“求告”最自然地保留向上帝呼求的含义，同时不把它扩展成特定宗派教义。
translation_notes:
  register: 采用庄重、简洁而适合诵读的现代标准汉语。三个并列命令句保持原文的推进结构：“称谢—求告—传扬”。“万民”保留诗歌语体和普世范围；“作为”避免加入原文没有明说的“大能”之意。
