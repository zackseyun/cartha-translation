  yaml_path: translation/ot/psalms/105/024.yaml
  text: And he made his people very fruitful[b][a], and made them mightier than their adversaries.
translation:
  language: zh_hans
  text: 他使他的子民大大增多[a]，使他们比他们的敌人更强盛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他的子民极其繁衍。”原文动词可强调使结果实、繁衍，或使数量增多。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“使他比他的敌人更强盛”；单数代词回指作为集合名词的“他的子民”。
    reason: collective_singular
lexical_decisions:
- source_word: וַיֶּפֶר
  choice: 使……大大增多
  rationale: 希伯来语פרה的使役形表示“使结果实、使繁衍或增多”。结合本诗追述以色列人在埃及人数增长的语境，“使……增多”在现代汉语中自然清楚；脚注保留“繁衍兴盛”的意象。
- source_word: עַמּוֹ
  choice: 自己的子民
  rationale: עַם在此指上帝所属的群体以色列。“自己的子民”自然表达领属关系及群体含义，又不额外引入宗派性解释。
- source_word: מְאֹד
  choice: 大大
  rationale: מְאֹד是程度副词，表示“极其、非常”。“大大增多”简洁自然，并准确传达显著增长。
- source_word: וַיַּעֲצִמֵהוּ
  choice: 使他们……更强盛
  rationale: עצם的使役形表示“使强壮、使强盛”；后接מן比较结构，因此译作“更强盛”。原文宾语后缀为阳性单数，回指集合名词“他的子民”，现代汉语自然改用复数“他们”。
- source_word: מִצָּרָיו
  choice: 比敌人
  rationale: צַר可指敌人、对头或压迫者。此处语境指敌对以色列的人；“敌人”范围适当，不把所指过度限定为“压迫者”。מן表达比较关系，译作“比”。
theological_decisions:
- issue: 集合单数与复数指代
  choice: 正文用“他们”回指“自己的子民”
  alternative: 按字面保留单数：“使他比他的敌人更强盛”
  rationale: 希伯来语把“他的子民”视为集合单数，故后续代词为单数。现代汉语用“他们”指代这一群体更自然清楚；该调整属于语法转换，并未改变神学含义。
- issue: “强盛”的性质
  choice: 保留概括性的“更强盛”
  alternative: 解释为“人数更多且力量更强”
  rationale: 原文动词可表达强大或强盛，但没有明确限定为人数、军力或政治势力，因此不在正文中缩窄其含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大大增多”贴合叙事语境；“更强盛”保留原文未具体说明强盛方式的概括性。所有脚注标记均置于正文相应位置。
