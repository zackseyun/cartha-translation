  text: 他们的地满是青蛙，连他们诸王的内室里也有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文作“他们的诸王”。《出埃及记》的蛙灾叙事使用单数“他们的王”（如《出埃及记》第8章），但本诗使用复数，可能是诗歌性或集合性的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרַץ
  choice: 遍布
  rationale: 此动词表示大量滋生、成群充斥；以“遍布”配合“他们的地”作主语，既自然，又清楚呈现蛙灾蔓延全地的景象。
- source_word: אַרְצָם
  choice: 他们的地
  rationale: 名词带第三人称阳性复数后缀，直译为“他们的地”，在上下文中指埃及之地。
- source_word: צְפַרְדְּעִים
  choice: 青蛙
  rationale: 该名词的标准现代汉语译法。
- source_word: בְּחַדְרֵי
  choice: 内室
  rationale: בְּ 表示所在位置，复数附属形式 חַדְרֵי 指房间、内室；“内室”保留诗歌较庄重的语体，也突出青蛙侵入王宫深处。
- source_word: מַלְכֵיהֶם
  choice: 他们众王的
  rationale: 希伯来语明确为复数“王”并带第三人称阳性复数后缀；用“众王”保留原文复数，不按《出埃及记》灾祸叙事中的单数加以协调。
