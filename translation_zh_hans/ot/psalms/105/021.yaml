  terminology: 将אָדוֹן译为“主管”避免汉语“主”可能引起的神学性或身份性联想，同时仍保留其在家宅／宫廷管理中的权威。将קִנְיָן译为“财产”比“产业”更直接对应“所有物、财物”，且不额外暗示继承产业。
