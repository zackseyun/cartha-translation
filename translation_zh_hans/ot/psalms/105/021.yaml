  source_fidelity: 译文准确传达了שׂים“立／任命”、אָדוֹן“主管／主人”、משל“统管”及קִנְיָן“财产”的基本意义。上下文中两个第三人称后缀均指埃及王，明确译出“王”是可接受的。不过“王家”在现代汉语中较易理解为王室家族，而非国王的家宅、宫廷及其管理体系；“王室”更贴合此处的管辖范围。
