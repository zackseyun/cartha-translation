  yaml_path: translation/ot/psalms/105/021.yaml
  text: He made him lord of his house[a], and ruler over all his possessions.
translation:
  language: zh_hans
  text: 他立约瑟作王室的主管[a]，统管王的一切财产。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他任命约瑟管理王室，统管王所有的财产。”
    reason: 词汇与句法替代：שָׂמוֹ אָדוֹן לְבֵיתוֹ可较形式地译为“立……作王室的主管”，也可按职能译为“任命……管理王室”。
lexical_decisions:
- source_word: שָׂמוֹ
  choice: 他立约瑟作
  rationale: שׂים的Qal完成式带第三人称阳性单数宾语后缀，意为“他立／安置他”。结合上文，明示宾语“约瑟”可避免现代汉语中连续代词造成含混；“立……作”也自然表达任命某人担任职分。
- source_word: אָדוֹן
  choice: 主
  rationale: אָדוֹן指有权管理家宅的人。译作“主”保留诗体的庄重与“主人、主管者”的权威含义，并与下句“统管”平行。
- source_word: לְבֵיתוֹ
  choice: 王家之
  rationale: 字面为“他的家／家室”。这里的第三人称指法老；根据诗篇上下文译为“王家”既说明所指，也涵盖王室家宅，而不局限于一栋房屋。
- source_word: וּמֹשֵׁל
  choice: 统管
  rationale: מֹשֵׁל是משל的分词，指施行治理者。汉语用动词“统管”自然承接前句，也准确表达全面治理的职权。
- source_word: בְּכָל
  choice: ……的一切
  rationale: ב与משל连用，标明治理所及的范围；汉语以“统管……的一切”表达对全部对象的权柄。
- source_word: קִנְיָנוֹ
  choice: 王的……产业
  rationale: קִנְיָן指所得之物、财产或产业。译作“产业”范围较广，可包括法老名下的财物与庄业；用“王的”澄清后缀所指。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体语言。“王家”与“王的”依据上下文澄清两个第三人称阳性单数后缀均指法老；正文保留“主／统管”的平行权威意象，脚注提供更功能性的译法。
