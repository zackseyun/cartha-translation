  text: שָׁלַ֣ח לִ/פְנֵי/הֶ֣ם אִ֑ישׁ לְ֝/עֶ֗בֶד נִמְכַּ֥ר יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/017.yaml
  text: He sent a man before them[a]; Joseph was sold as a slave.
translation:
  language: zh_hans
  text: '他差遣一个人先于他们而去[a]；约瑟被卖为奴。


    [a] 或译：“在他们前面。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们前面。”
    reason: לִפְנֵיהֶם可指“在他们之前”或“在他们前面”；脚注保留其方位性表达，避免加入原文未明示的趋向意味。
lexical_decisions:
- source_word: שָׁלַח
  choice: 差遣
  rationale: 该词为Qal完成式第三人称阳性单数，依据上下文，隐含主语是上帝。“差遣”既准确表达有目的地派出，也符合诗篇庄重而自然的语体。
- source_word: לִפְנֵיהֶם
  choice: 先于他们而去
  rationale: 该短语字面义为“在他们前面”，在这里兼有时间上的先行和空间上的在前之意；正文用“先于他们而去”自然表达约瑟被预先送往埃及，同时以脚注保留较贴近字面的译法。
- source_word: אִישׁ
  choice: 一个人
  rationale: 保留原文单数阳性名词的明确表达，不泛化为“某人”。
- source_word: לְעֶבֶד
  choice: 为奴
  rationale: 介词לְ在此表示结果或身份状态；结合“被卖”，所指是受奴役的身份，而非一般性的服侍。“为奴”在现代汉语中简洁、准确。
- source_word: נִמְכַּר
  choice: 被卖
  rationale: 该词为Niphal完成式第三人称阳性单数，表达被动意义；“被卖”直接对应原文，并呼应约瑟被兄长卖掉的叙事。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经读者熟悉的标准人名译法。
theological_decisions:
- issue: עֶבֶד在约瑟被卖语境中的身份含义
  choice: 奴
  alternative: 仆人
  rationale: עֶבֶד可依语境指仆人或奴隶，但此处与“被卖”连用，受买卖和奴役的身份十分突出；译为“奴”比“仆人”更准确，且不额外引入任何宗派性解释。
- issue: 上帝主权与人类恶行之间的张力
  choice: 保留“他差遣”与“约瑟被卖”并列
  alternative: 将“差遣”弱化为“容许先去”
  rationale: 原文把上帝的差遣与约瑟被卖并置，却没有解释二者如何协调。译文保留这种神学张力，不把“差遣”改写为单纯的许可，也不暗示上帝亲自实施了出卖行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号保留希伯来诗句两分句的紧密关系；“为奴”简练有力，符合诗体表达。
