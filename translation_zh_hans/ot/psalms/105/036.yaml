  text: וַ/יַּ֣ךְ כָּל בְּכ֣וֹר בְּ/אַרְצָ֑/ם רֵ֝אשִׁ֗ית לְ/כָל אוֹנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/036.yaml
  text: He struck down every firstborn in their land[a], the firstfruits of all their strength.
translation:
  language: zh_hans
  text: 他击杀了他们境内一切头生者，就是他们一切力量的初果[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们一切力量最初的成果。”希伯来语这一说法指最早出生的后代；“力量”也可含生殖活力之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: 他击杀了
  rationale: נכה的使役式在本节所述长子之灾中指致命击打；“击杀”既保留“击打”的动作，也准确表达其死亡结果。
- source_word: כָּל בְּכוֹר
  choice: 所有头生的
  rationale: כָּל与单数בְּכוֹר合用，具有周遍、逐一的含义。“头生的”不把所指范围无根据地限于人的长子，也符合出埃及灾祸的语境。
- source_word: בְּאַרְצָם
  choice: 在他们境内
  rationale: אַרְצָם直指“他们的地”；“境内”在现代汉语中自然地表达发生在其国土范围之内。
- source_word: רֵאשִׁית
  choice: 初果
  rationale: רֵאשִׁית表示开端、最初部分；在此与后面的“力量”构成隐喻，指最早出生、作为生命力量首先成果的后代。“初果”简洁保留这一意象。
- source_word: לְכָל אוֹנָם
  choice: 他们一切力量的
  rationale: 此处לְ表达所属或关联；אוֹן可指力量、精力，也可含生殖活力之意。正文采用较宽的“力量”，不把希伯来语的意涵缩窄，并由脚注说明其生育语境。
theological_decisions:
- issue: 动词隐含主语
  choice: 以“他”指上帝
  alternative: 重复写明“上帝”
  rationale: 希伯来语动词为第三人称阳性单数，主语从上文延续，指施行灾祸的上帝；汉语补出“他”即可保持篇章衔接，而不额外强化原文未重复的名称。
- issue: “力量的初果”所指
  choice: 保留力量与初果的隐喻
  alternative: 直接意译为“他们精力旺盛时最先所生的”
  rationale: 原文以同位语解释“头生的”，既含最早后代，也保留力量、生殖活力及其最初成果之间的诗性张力；正文不把隐喻完全释义化。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“头生的”比“长子”范围更宽，避免把原文无根据地限定为人的男性长子；“初果”保留诗句后半行的隐喻，并以脚注补明其含义。
