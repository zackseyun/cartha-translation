  text: They afflicted his feet with shackles[b][a]; his neck came into iron.
translation:
  language: zh_hans
  text: 他们用镣铐伤他的脚；他的性命陷入铁中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文含义较难确定。也可译作“他的颈项进入铁中”，即他被套上铁项圈或铁链；“性命”一词也可泛指整个人，并可在此按喉咙或颈项理解。另有译法：“铁临到他的性命。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנּוּ
  choice: 人……折磨
  rationale: 该动词为ענה的Piel形式，可指“使受苦、压迫、苦待”。主语是未明确指出的复数施事者；汉语用泛指的“人”自然表达，又不擅自指定是谁。
- source_word: בַכֶּבֶל
  choice: 用脚镣
  rationale: כֶּבֶל指镣铐、脚镣；介词ב在此表示工具或手段。“脚镣”与后面的“双脚”相配，也符合囚禁约瑟的语境。
- source_word: רַגְלָיו
  choice: 他的双脚
  rationale: 该形式指他的脚；译作“双脚”准确而自然。
- source_word: בַּרְזֶל
  choice: 铁中
  rationale: בַּרְזֶל字面为“铁”。原文没有明说铁圈或铁链，因此正文保留凝练而含混的“铁”意象。介词ב最自然可理解为“进入/落入……之中”。
- source_word: בָּאָה
  choice: 落入
  rationale: בוא的阴性单数形式与后置的נַפְשׁוֹ在语法性别上相合，因此以“他的性命”为主语，不把“铁”误作主语。“落入”兼顾进入某种境况的动态及受苦语境。
- source_word: נַפְשׁוֹ
  choice: 他的性命
  rationale: נֶפֶשׁ可指生命、性命、自身，也可能在此按喉咙或颈项理解。“性命”保留整个人陷入铁制束缚的诗意，又避免现代汉语“灵魂”所可能带入的身心二分含义；具体的“颈项”解释置于脚注。
