  text: וַֽ֭/יּוֹצִיאֵ/ם בְּ/כֶ֣סֶף וְ/זָהָ֑ב וְ/אֵ֖ין בִּ/שְׁבָטָ֣י/ו כּוֹשֵֽׁל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/037.yaml
  text: He brought them out with silver and gold[a], and among his tribes there was no one who stumbled.
translation:
  language: zh_hans
  text: 他带领他们出来，带着金银；在以色列各支派中，没有一人踉跄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有一人软弱无力。”希伯来语分词可表示踉跄、跌倒或软弱。
    reason: 词义存在真实的多重可能；脚注保留在出行语境中合理的身体软弱之理解。
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: 他带领他们出来
  rationale: 使役式表达“使他们出去、把他们领出来”。“带领他们出来”既自然，也保留上帝主动施行出埃及拯救的含义。
- source_word: בְּכֶסֶף וְזָהָב
  choice: 带着金银
  rationale: 介词ב在这里表示伴随，说明他们出来时拥有金银；此译法呼应出埃及时所得财物，又不额外强调负载多少。
- source_word: וְאֵין
  choice: 没有一个
  rationale: 将存在否定词אין按现代汉语习惯译为“没有一个”，并与后面的分词自然衔接。
- source_word: בִּשְׁבָטָיו
  choice: 他的众支派中
  rationale: 保留原文第三人称阳性单数后缀“他的”，把以色列／雅各视为一个集合性的单数主体；שֵׁבֶט在此按上下文译为“支派”。
- source_word: כּוֹשֵׁל
  choice: 跌倒的
  rationale: 该分词可指跌倒、踉跄、衰弱。“跌倒的”保留具体意象，同时容许读者理解为无人因软弱而掉队。
theological_decisions:
- issue: “他的众支派”中单数所有格的所指
  choice: 保留单数“他的”，指作为集合性单数的以色列／雅各
  alternative: 译为“他们的众支派”，明确指前文的众人
  rationale: 希伯来原文使用第三人称阳性单数后缀。诗篇可将以色列作为一个整体用单数指称；保留这一形式可避免把原文的语法张力悄然消除。
- issue: כּוֹשֵׁל所表达的是动作还是身体状态
  choice: 正文译为“跌倒的”，保留动作意象
  alternative: 译为“软弱的”或“衰弱的”，明确表达身体状态
  rationale: 词义范围包括跌倒、踉跄和衰弱；上下文可能意指无人软弱到无法行走，但原文并未限定为纯粹的身体虚弱，因此正文保留较具体且开放的表达，并用脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。分号呈现两个并列行动／结果；“众支派”比单说“支派”更清楚地传达复数。脚注标记置于相关分句末尾。
