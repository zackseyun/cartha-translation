base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/019.yaml
  text: Until the time his word came to pass[b][a], the word of Yahweh tested him.
translation:
  language: zh_hans
  text: 直到他的话[a]应验之时，耶和华的话熬炼了他。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的话”可指约瑟所说的话或其预言；也有人理解为上帝关于约瑟所说的话。“应验”直译为“来到”。
    reason: alternative_reading
  - marker: b
    text: “熬炼”原指炼净金属；这里也可译作“考验”或“试炼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד עֵת
  choice: 直到……的时候
  rationale: 准确表达持续至某一时点的时间结构，也符合现代汉语习惯。
- source_word: בֹּא
  choice: 应验
  rationale: 原义为“来到”；以“话”为主语时，此处可自然理解为所说之事实现。译作“应验”传达语境意义，脚注保留直译可能。
- source_word: דְבָרוֹ
  choice: 他的话
  rationale: 保留第三人称后缀及原文指代上的含混；上下文较自然地可指约瑟所说的话或预言，也可能指上帝关于约瑟的话。
- source_word: אִמְרַת יְהוָה
  choice: 耶和华的话
  rationale: אִמְרָה 指言语、话语；采用“耶和华”呈现神名 יהוה，并保持上下两句“话”的对应。
- source_word: צְרָפָתְהוּ
  choice: 熬炼了他
  rationale: צרף 原指冶炼、炼净金属，转喻人在考验中受检验。“熬炼”既保留冶金意象，也能自然表达苦难中的试验。
theological_decisions:
- issue: “他的话”的指代
  choice: 正文保留“他的话”，不明说所指；语境中较自然地指约瑟的话或预言
  alternative: 上帝关于约瑟所说的话
  rationale: 希伯来语第三人称后缀本身未消除歧义；正文不擅自判定，脚注列出两种理解。
- issue: 耶和华的话如何“熬炼”约瑟
  choice: 保留“熬炼”的比喻及话语作为主语
  alternative: 意译为“考验了他”
  rationale: 原词带有炼净金属的鲜明意象；正文保留这一张力，脚注说明也可理解为“考验、验证”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“熬炼”略带经文语体，但现代读者仍易理解，并能保留原文冶金比喻。所有脚注标记均置于相关正文之后。
