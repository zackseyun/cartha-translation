  yaml_path: translation/ot/psalms/105/009.yaml
  text: which he made with Abraham[a], and his oath to Isaac,
translation:
  language: zh_hans
  text: 就是他与亚伯拉罕所立的约[a]，以及他向以撒所起的誓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他与亚伯拉罕所切的”；“约”承接上一节而省略。“切约”是表示“立约”的惯用说法。
    reason: 说明כָּרַת在盟约语境中的字面意义和惯用含义，并交代本节隐含的“约”。
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 就是……的
  rationale: 这是关系词，承接上一节的“约”。译作“就是……的”既保留衔接关系，也符合现代汉语表达。
- source_word: כָּרַת
  choice: 立
  rationale: 该动词本义为“切”，但在盟约语境中属于“切约／立约”的固定表达。现代汉语以“立约”自然传达其实际含义。
- source_word: אֶת אַבְרָהָם
  choice: 与亚伯拉罕
  rationale: אֶת在此标示与立约行动相关的人。汉语通常说“与某人立约”，因此译作“与亚伯拉罕”。
- source_word: וּשְׁבוּעָתוֹ
  choice: 也是他……所起的誓
  rationale: שְׁבוּעָה意为“誓言、誓约”，第三人称阳性单数后缀表示“他的”。“也是”自然呈现这一分句与前述“约”的平行同位关系。
- source_word: לְיִשְׂחָק
  choice: 向以撒
  rationale: 介词לְ表示誓言所指向的对象；“向以撒起誓”是自然、准确的现代汉语表达。
theological_decisions:
- issue: 本节省略“约”字，由上一节提供先行词
  choice: 在汉语正文中补出“约”，译为“他与亚伯拉罕所立的约”
  alternative: 译为“他与亚伯拉罕所立的”，完全依靠上一节补足宾语
  rationale: 希伯来文因承接上一节而可省略“约”，但汉语若不补出便显得残缺或含混。补出“约”只是明示原文语境已经包含的对象，并未增加新的神学内容。
- issue: “约”与“誓”之间的关系
  choice: 以“也是”表达平行同位关系
  alternative: 仅用“和”连接，译为“和他向以撒所起的誓”
  rationale: 诗句将上帝的约与誓并列描述。“也是”使汉语清楚自然，同时不把二者强行解释为完全相同或彼此分离的概念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“立约”“起誓”是普通读者容易理解且适合诗篇语体的传统表达；句式保留与上一节的承接，并呈现原文的平行结构。
