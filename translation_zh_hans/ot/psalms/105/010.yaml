  yaml_path: translation/ot/psalms/105/010.yaml
  text: He confirmed it to Jacob as a statute[b][a], to Israel as an everlasting covenant.
translation:
  language: zh_hans
  text: 他向雅各把这事定为律例[a]，向以色列定为永远的约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定为”或译“确立为”。希伯来语动词在这里有使某事坚立、稳固成立的意思。
    reason: lexical_alternative
  - marker: b
    text: “永远的约”也可译作“永久的约”或“长存的约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: 将这事……立定
  rationale: עמד的使役态在这里表示使某事坚立、确立。译作“立定”既保留使之稳固成立的含义，也符合盟约语境；“这事”承接上文，却不限定所指究竟是约、应许还是誓言。
- source_word: לְיַעֲקֹב
  choice: 向雅各
  rationale: 介词לְ在此标示对象；“向雅各”自然地表达立定律例所涉及的对象。
- source_word: לְחֹק
  choice: 为律例
  rationale: חֹק指规定、定例或法定之事。“律例”保留其正式、约法性的语气。
- source_word: לְיִשְׂרָאֵל
  choice: 向以色列
  rationale: 与“向雅各”构成诗歌平行，保留原文结构及称谓转换。
- source_word: בְּרִית עוֹלָם
  choice: 永远的约
  rationale: בְּרִית是“约”的常用词；עוֹלָם在此强调长久持续、永久有效。“永远的约”庄重、自然，也符合现代中文圣经语体。
theological_decisions:
- issue: וַיַּעֲמִידֶהָ中阴性单数后缀的所指
  choice: 以概括性的“这事”承接上文
  alternative: 明确译作“这约”“这应许”或“这誓言”
  rationale: 上下文同时提到约、所吩咐的话和誓言。本节自身没有把后缀严格限定为其中某一个近义概念，因此不作过度明确化。
- issue: עוֹלָם所表达的持续时间
  choice: 永远的
  alternative: 永久的；长存的
  rationale: 原词可表达永久、恒久或无期限的持续性。“永远的”保留其强度，但脚注提示其他可行译法，避免把词义范围收窄为单一哲学概念。
translation_notes:
  register: 采用现代、庄重而易懂的中文。以“向雅各……向以色列……”保留希伯来诗歌的平行结构；“律例”与“约”维持正式的盟约语域。
