  text: וַ/יִּתֵּ֣ן לָ֭/הֶם אַרְצ֣וֹת גּוֹיִ֑ם וַ/עֲמַ֖ל לְאֻמִּ֣ים יִירָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/044.yaml
  text: He gave them the lands of the nations[a], and they inherited the labor of the peoples.
translation:
  language: zh_hans
  text: '他把列国的土地赐给他们，

    他们承受了万民劳碌所得[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们占有了万民劳碌的成果。”希伯来语“劳碌”既可指劳作本身，也可指劳作所得。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 他……赐给
  rationale: נתן的Qal叙事形式表示“给、赐予”；结合上帝赐地的语境，用“赐给”自然体现这份土地是由上帝授予的。
- source_word: לָהֶם
  choice: 他们
  rationale: 第三人称阳性复数后缀，在句中作间接宾语。
- source_word: אַרְצוֹת גּוֹיִם
  choice: 列国的土地
  rationale: 保留אַרְצוֹת的复数集合意义；גּוֹיִם在领土与民族语境中译为“列国”，比“外邦人”更合适。
- source_word: וַעֲמַל לְאֻמִּים
  choice: 万民劳碌所得
  rationale: עָמָל可指劳碌本身，也可转指劳碌所得；“劳碌所得”在现代汉语中自然，也保留其与劳作成果的联系。לְאֻמִּים译为“万民”，与前句“列国”形成自然变化。
- source_word: יִירָשׁוּ
  choice: 承受了
  rationale: ירש可表示承受产业、取得或占有；“承受”既符合上帝赐予产业的语境，也避免把行动单纯描写为武力夺取。
theological_decisions:
- issue: ירש所含的承受产业与占有之义
  choice: 承受了
  alternative: 占有了；取得了
  rationale: 本节首先说明上帝把土地赐给他们，因此“承受”保留了因上帝授予而得产业的含义，同时不否认该词也可表示实际取得并占有。
- issue: עָמָל是劳碌本身还是劳碌所得
  choice: 劳碌所得
  alternative: 劳碌；劳碌的成果
  rationale: 希伯来词可指辛劳，也可借代辛劳所得。正文采用较自然的汉语表达，脚注注明词义张力，不把另一种理解排除。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；两行对应原文两个分句。“列国”与“万民”避免机械重复，并分别保留גּוֹיִם与לְאֻמִּים的群体含义。
