  text: לֵ/אמֹ֗ר לְ/ךָ֗ אֶתֵּ֥ן אֶת אֶֽרֶץ כְּנָ֑עַן חֶ֝֗בֶל נַחֲלַתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/011.yaml
  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: zh_hans
  text: 说：“我要把迦南地赐给你；那地就是你们[b]承受为业的那一份[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那一份”或译“你们产业的量地绳”；“绳”在这里引申指用绳量定、分配的一份土地。
    reason: lexical_alternative
  - marker: b
    text: 原文先用单数“你”，后改用复数“你们”，可能是把亚伯拉罕视为其后裔的代表。
    reason: alternative_reading
lexical_decisions:
- source_word: לֵאמֹר
  choice: 说
  rationale: 承接上一节，引出上帝所宣告的应许；“说”自然保留希伯来语不定式引语结构的功能。
- source_word: לְךָ
  choice: 赐给你
  rationale: 保留第二人称阳性单数，直接指受应许者；与后文复数“你们”形成原文所有的数的转换。
- source_word: אֶתֵּן
  choice: 我要……赐给
  rationale: 此处未完成式表达未来的应许；“要……赐给”在现代汉语中清楚传达其承诺意味。
- source_word: אֶרֶץ כְּנָעַן
  choice: 迦南地
  rationale: 准确而自然地指称迦南这片地域，也符合现代中文圣经地名的通行表达。
- source_word: חֶבֶל
  choice: 那一份
  rationale: 该词本义可指量地的绳索，在分地语境中转指划定、分配的一份土地；正文采用自然的转喻义，并以脚注保留字面意象。
- source_word: נַחֲלַתְכֶם
  choice: 你们承受为业的
  rationale: 既表达所分得并继承的产业，也明确保留原文第二人称复数后缀，与前面的单数“你”相区别。
theological_decisions:
- issue: 应许中受话者由单数转为复数
  choice: 保留“赐给你”与“你们承受为业”的转换
  alternative: 统一译成“赐给你们……你们的产业”，或解释性译为“赐给你和你的后裔”
  rationale: 原文先用单数称呼受应许者，随后改用复数物主后缀；这可能表明先祖代表其后裔领受应许。正文不加以统一或解释，以保留原文的张力。
- issue: חֶבֶל נַחֲלַתְכֶם 的句法关系
  choice: 译作同位说明：“那地就是你们承受为业的那一份”
  alternative: 译作方式结构：“作为你们产业的一份”
  rationale: 同位表达更贴近希伯来文名词短语的直接并置，同时在现代汉语中仍清楚自然。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“承受为业”保留土地作为所分产业的语义，又是普通读者能够理解的传统书面表达；分号帮助显明后半句是对“迦南地”的同位说明。
