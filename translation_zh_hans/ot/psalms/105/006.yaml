  text: offspring of Abraham[a], his servant, sons of Jacob, his chosen ones[c][b],
translation:
  language: zh_hans
  text: '他仆人亚伯拉罕的后裔[a]，

    雅各的众子[b]，就是他所拣选的人[c]哪！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚伯拉罕的种子”。希伯来语用单数“种子”集合性地指亚伯拉罕的后代。
    reason: lexical_alternative
  - marker: b
    text: 或译“雅各的儿女”。原文直译为“雅各的众子”。
    reason: lexical_alternative
  - marker: c
    text: 或译“他的蒙拣选者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: 后裔
  rationale: 此处是集合意义，指亚伯拉罕的子孙。“后裔”在现代汉语中自然明确，也保留了宗族延续的含义；希伯来语原词字面为单数“种子”。
- source_word: עַבְדּוֹ
  choice: 他仆人
  rationale: 后缀“他的”指上帝，亚伯拉罕是上帝的仆人。这里是尊称性的关系用语，“仆人”比“奴隶”更符合语境。
- source_word: בְּנֵי
  choice: 众子
  rationale: 原文为阳性复数“儿子们/众子”。“众子”既保留原文形式，也适合诗歌语体；此短语在语境中可代表雅各的后代群体。
- source_word: בְּחִירָיו
  choice: 他所拣选的人
  rationale: 复数形式指上帝所拣选的群体。“所拣选的人”清楚自然，并避免把后来的系统神学含义强加给经文。
- source_word: זֶרַע אַבְרָהָם // בְּנֵי יַעֲקֹב
  choice: 亚伯拉罕的后裔……雅各的众子
  rationale: 保留原文同义平行的两个称呼，不将它们合并，以呈现诗句的结构和族长谱系意象。
theological_decisions:
- issue: “他仆人”和“他所拣选的人”中所属后缀的所指
  choice: 两个“他”均指上帝：亚伯拉罕是上帝的仆人，雅各的众子是上帝所拣选的人。
  alternative: 若只按最近先行词机械理解，后缀也可能被误读为指相邻的族长。
  rationale: 诗篇的盟约语境及圣经常见用法支持以上帝为所指。译文用破折号标明同位修饰关系，但不额外补出“上帝的”，以保留原文代词表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以两个平行分句重现希伯来诗体；破折号帮助读者看出“他仆人的”修饰亚伯拉罕、“他所拣选的人”与雅各众子同位。末尾感叹号承接诗篇105:1—6的呼告语气。
