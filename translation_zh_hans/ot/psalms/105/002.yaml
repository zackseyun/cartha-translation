  text: שִֽׁירוּ ל֭/וֹ זַמְּרוּ ל֑/וֹ שִׂ֝֗יחוּ בְּ/כָל נִפְלְאוֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/002.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous works.
translation:
  language: zh_hans
  text: 你们要向他歌唱，向他颂赞；要述说他一切奇妙的作为。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “述说”也可译作“谈论”或“默想”。这个希伯来语动词既可指内心思想，也可指开口讲述；在这里赞美的语境中，正文采用“述说”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: 歌唱
  rationale: 该词是 שׁיר 的复数命令式，直接表达向上帝歌唱；“歌唱”自然、庄重。
- source_word: ל֭וֹ
  choice: 向他
  rationale: 介词 ל 加第三人称单数后缀，在此表示歌唱和颂赞所朝向的对象；“向他”符合现代汉语赞美语境。
- source_word: זַמְּרוּ
  choice: 颂赞
  rationale: זמר 在敬拜语境中指以歌唱或音乐赞美。“颂赞”保留赞美含义，又不额外限定是否使用乐器。
- source_word: שִׂיחוּ
  choice: 述说
  rationale: שׂיח 可指默想，也可指谈论、讲述。本节连续使用公开赞美的命令语气，因此正文采用传述性的“述说”，同时以脚注保留“默想”的可能。
- source_word: בְּכָל
  choice: 一切
  rationale: ב 在 שׂיח 后引出谈论的内容，כָל 表示全部范围；汉语以“述说……一切……”自然表达。
- source_word: נִפְלְאוֹתָיו
  choice: 他一切奇妙的作为
  rationale: נִפְלָאוֹת 指令人惊叹的奇事，诗篇中常特指上帝非凡的行动；“奇妙的作为”兼顾惊奇感与具体行动。
theological_decisions:
- issue: שִׂיחוּ 所表达的是公开述说还是内在默想
  choice: 正文译作“述说”
  alternative: “默想”或“谈论”
  rationale: 上下文是一连串群体性、公开性的赞美命令，因此“述说”较贴合语境；但希伯来词本身可涵盖沉思，故以脚注保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语言。两个前置的“向他”保留原文平行结构；末句以“奇妙的作为”表达上帝令人惊叹的行动。
