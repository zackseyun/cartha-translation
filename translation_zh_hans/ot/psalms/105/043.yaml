  yaml_path: translation/ot/psalms/105/043.yaml
  text: So he brought out his people with joy[b][a], his chosen ones with singing.
translation:
  language: zh_hans
  text: 他使自己的百姓欢欢喜喜地出来；使他所拣选的人在欢呼声中出来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢呼声”也可译作“歌唱”或“喜乐的欢呼”。原文可指欢唱，也可指高声的喜乐呼喊。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: 领出
  rationale: 该词是 יצא 的使役形，意为“使出去、带出来”。“领出”在现代汉语中自然，也保留了出埃及的语境。
- source_word: עַמּוֹ
  choice: 自己的百姓
  rationale: עַם 在此指上帝立约的子民；“自己的百姓”清楚表达所属关系，并符合诗篇语体。
- source_word: בְשָׂשׂוֹן
  choice: 欢欢喜喜地
  rationale: 该名词表示喜乐、欢欣；这里介词短语作方式状语，译为“欢欢喜喜地”自然流畅。
- source_word: בְּרִנָּה
  choice: 欢呼歌唱
  rationale: רִנָּה 可指喜乐的高声呼喊，也可指欢唱。“欢呼歌唱”保留其声音强烈而喜庆的语义范围。
- source_word: אֶת
  choice: 不另译（直接宾语标记）
  rationale: 该词是直接宾语标记，在汉语中无需对应词，其语法功能由句法体现。
- source_word: בְּחִירָיו
  choice: 他所拣选的人
  rationale: 该词指被他拣选的人。“他所拣选的人”透明地保留选择者与被选择者的关系，同时避免引入超出本节的教义术语色彩。
theological_decisions:
- issue: בְּחִירָיו 的表达
  choice: 他所拣选的人
  alternative: 他的选民
  rationale: 原文在出埃及语境中把这些人称为上帝所拣选的，并与“自己的百姓”平行。“他所拣选的人”忠实表达这一关系，又不把后来的系统神学含义强加于经文。
translation_notes:
  register: 采用现代、庄重且易懂的汉语。以“于是”承接叙事，以“欢欢喜喜地……欢呼歌唱”再现两个介词短语的平行喜庆色彩；脚注保留 רִנָּה 在歌唱与欢呼之间的语义幅度。
