  terminology: “自己的百姓”和“他所拣选的人”恰当、庄重，并避免把“选民”等可能带有额外传统术语色彩的表达强加于本节。“欢呼声”适合 רִנָּה 的喜庆呼喊义；脚注保留“歌唱”的可行译法。
