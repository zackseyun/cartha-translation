source:
  edition: WLC
  text: ה֭וּא יְהוָ֣ה אֱלֹהֵ֑י/נוּ בְּ/כָל הָ֝/אָ֗רֶץ מִשְׁפָּטָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/007.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: zh_hans
  text: 他是雅威[a]我们的神；他的审判[b]遍及全地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为神名 YHWH；其古代确切读音未完全保存，通常音译作“雅威”，传统上也译作“耶和华”。
    reason: alternative_reading
  - marker: b
    text: “审判”也可译作“裁决”、“法令”或“公正”；希伯来词可指司法决定、规定或公义的施行。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: 他是
  rationale: 独立人称代词带有强调意味；汉语补出判断词“是”，表达自然，同时保留“他”作为句首焦点。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接译出四字神名，而不以“主”这一称号代替；“雅威”是对通常拟定读音 Yahweh 的现代汉语音译。因古代确切读音并未完全保存，另在脚注说明。
- source_word: אֱלֹהֵינוּ
  choice: 我们的神
  rationale: 该词带第一人称复数所属后缀，直译为“我们的神”。
- source_word: בְּכָל הָאָרֶץ
  choice: 遍及全地
  rationale: 介词结构表示范围；本诗语境具有普世视野，因此取“全地”而非较局部的“全境”。“遍及”使汉语表达自然。
- source_word: מִשְׁפָּטָיו
  choice: 他的审判
  rationale: מִשְׁפָּט 可指司法裁决、法令、施行审判或公正。“审判”在此不把含义限缩为单纯法规或抽象正义，并以脚注保留其他可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以四个辅音书写的神名。正文采用其通常拟定读音的音译“雅威”，避免用称号“主”取代专名；脚注同时交代传统译名及读音的不确定性。
- issue: מִשְׁפָּטָיו 的语义范围
  choice: 他的审判
  alternative: 他的裁决；他的法令；他的公正
  rationale: 此词兼有裁决、规范和公正等司法含义；正文选用较宽的“审判”，不将经文限定为抽象属性或成文法令。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“遍及全地”比直译为“在全地”更符合现代汉语，同时保留原文的普世范围。所有脚注标记均紧接其所注释的词语。
