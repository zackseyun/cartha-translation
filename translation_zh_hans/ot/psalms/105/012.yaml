  yaml_path: translation/ot/psalms/105/012.yaml
  text: When they were few in number[a], very few, and sojourners in it,
translation:
  language: zh_hans
  text: 当他们人数稀少、寥寥无几，并且在那地寄居[a]时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“并且在那地作外乡人”。希伯来语词指人在不属于自己的土地上作为外来者或暂居者居住。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתָם
  choice: 当时他们
  rationale: ב 加上 היה 的不定式构造及第三人称复数后缀，引出时间从句；“当时他们”在现代汉语中自然地表达“当他们……的时候”。
- source_word: מְתֵי מִסְפָּר
  choice: 人数稀少
  rationale: 这是表示人数少、屈指可数的习语；“人数稀少”准确传达其意义，避免照字面译成生硬的“有数的人”。
- source_word: כִּמְעַט
  choice: 寥寥无几
  rationale: 此处进一步强调前面的“人数稀少”；“寥寥无几”保留加强语气，也符合庄重而通俗的现代汉语。
- source_word: וְגָרִים
  choice: 并且……寄居
  rationale: גור 在这里指以外来者身份住在不属于自己的土地上；“寄居”既简洁自然，也保留临时居住和异乡人的社会含义。
- source_word: בָּהּ
  choice: 在那地
  rationale: 阴性单数后缀所指的是上文的土地；汉语若只译“在其中”较含混，因此用“在那地”明示所指，但不改变原意。
