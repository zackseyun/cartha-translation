  yaml_path: translation/ot/psalms/105/039.yaml
  text: He spread out a cloud as a covering[a], and fire to give light by night.
translation:
  language: zh_hans
  text: 他铺开云彩作遮蔽[a]，又以火在夜间照明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作遮盖物”“作为屏障”或“作为帷幕”。希伯来语此词可指起保护作用的遮盖物、屏障或帷幕。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַשׂ
  choice: 铺开
  rationale: 该动词表示铺展、伸展开；“铺开”自然地呈现神将云彩展开的图景。
- source_word: עָנָן
  choice: 云彩
  rationale: 对应“云”的基本词义，也符合旷野旅程的语境。
- source_word: לְמָסָךְ
  choice: 作遮蔽
  rationale: מָסָךְ可指遮盖物、屏障或帷幕；“作遮蔽”保留功能性含义，同时不把具体形态说得过死。
- source_word: וְאֵשׁ
  choice: 又用火
  rationale: 保留“云彩”与“火”的平行意象；补出“用”使现代汉语表达顺畅，但不增添原文之外的解释。
- source_word: לְהָאִיר
  choice: 照亮
  rationale: 该不定式表达目的或功能；“照亮”简洁自然。
- source_word: לָיְלָה
  choice: 黑夜
  rationale: 表示夜间；在“照亮黑夜”中符合现代汉语习惯，并保留诗意。
theological_decisions:
- issue: 动词的隐含主语
  choice: 他（指神）
  alternative: 耶和华
  rationale: 希伯来文省略第三人称阳性单数主语，由上下文承接，所指为神；译作“他”保留原文的话语衔接，不将神名直接增补进本节。
- issue: 旷野显现的云火意象
  choice: 按原文保留云彩与火，不作解释性扩写
  alternative: 明确译为旷野中的云柱和火柱
  rationale: 本节使人联想到出埃及传统，但原文只陈述云彩、火及其功能；正文不增添“柱”等未明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他铺开云彩作遮蔽”保留诗歌的凝练和平行结构；“又用火照亮黑夜”符合自然汉语，同时呈现原文的目的关系。
