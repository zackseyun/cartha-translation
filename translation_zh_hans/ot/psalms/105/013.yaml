  text: they wandered from nation to nation[a], from one kingdom to another people.
translation:
  language: zh_hans
  text: 他们从一国辗转到另一国[a]，从一个王国到另一个民族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们从国到国，从一个王国到另一个民族。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: 游走
  rationale: 该词为הלך的Hitpael形式，在本段语境中表示辗转、往来式的移动，而非一次直达的行程。“游走”保留这种反复迁移的意味，同时避免把方向迷失过度强加于原文。
- source_word: מִגּוֹי אֶל גּוֹי
  choice: 从这国到那国
  rationale: גּוֹי可指国家或民族群体；此处与后半句构成地缘政治层面的平行表达。“从这国到那国”自然传达希伯来文“从……到……”的递进结构。
- source_word: מִמַּמְלָכָה
  choice: 从一个王国
  rationale: מַמְלָכָה意为“王国、国度”。原文没有明说数词，但现代汉语在“从一个……到另一个……”结构中补出“一个”，可清楚表达其分配关系。
- source_word: אֶל עַם אַחֵר
  choice: 到另一个民族
  rationale: עַם侧重作为社会或族群共同体的“民、民族”；译作“民族”既与מַמְלָכָה“王国”有所区别，也明确体现אַחֵר“另一个”。
