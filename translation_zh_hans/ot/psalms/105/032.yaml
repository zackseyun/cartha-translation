  text: נָתַ֣ן גִּשְׁמֵי/הֶ֣ם בָּרָ֑ד אֵ֖שׁ לֶהָב֣וֹת בְּ/אַרְצָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/032.yaml
  text: He gave them hail for rain[a], and flaming fire in their land.
translation:
  language: zh_hans
  text: 他降下冰雹代替他们的雨水，又使烈焰之火临到他们境内。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烈焰之火”也可理解为“闪电”或“火一般的电光”；原文直译为“火焰之火”或“烈焰之火”。
    reason: 保留 אֵשׁ לֶהָבוֹת 的字面意象及其在冰雹灾语境中的词义可能性。
lexical_decisions:
- source_word: נָתַן
  choice: 降下／使……临到
  rationale: 该动词基本义为“给、赐”，在此表达上帝使灾祸临到。按中文诗歌叙述习惯，结合冰雹译为“降下”，并在并列分句中译为“使……临到”，既传达神圣施动，也避免生硬直译。
- source_word: גִּשְׁמֵיהֶם
  choice: 他们的雨水
  rationale: 保留希伯来语第三人称复数所有格，表达冰雹取代了他们通常所得的雨水。
- source_word: בָּרָד
  choice: 冰雹
  rationale: 这是该词的通常含义，也与出埃及灾祸的背景一致。
- source_word: אֵשׁ לֶהָבוֹת
  choice: 烈焰之火
  rationale: 原文将“火”和“火焰”并置，形成加强语气。“烈焰之火”在现代汉语中庄重自然，并保留意象，不在正文中把它限定为闪电。
- source_word: בְּאַרְצָם
  choice: 在他们境内
  rationale: בְּ表示“在……中”，所有格指向上下文中的埃及人；“境内”简洁表达其国土范围。
theological_decisions:
- issue: 冰雹与雨水的关系
  choice: 译作“冰雹代替他们的雨水”
  alternative: “赐冰雹作他们的雨”
  rationale: 原文简练地并置“他们的雨”和“冰雹”，可理解为以冰雹取代雨水。正文采用自然中文明确这一基本关系，而不扩展灾祸细节。
- issue: אֵשׁ לֶהָבוֹת所指的自然现象
  choice: 正文译为“烈焰之火”
  alternative: “闪电”或“火箭般的电光”
  rationale: 出埃及记的冰雹灾背景可能使人联想到闪电，但希伯来语本身使用“火、火焰”的意象。正文保留较宽泛的措辞，脚注列出语境上的可能解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“降下……又使……临到”使希伯来诗句的两个灾祸意象在中文中连贯；保留“他们”和“他们境内”，让上下文确定其所指。
