  text: He spoke[a], and swarms of flies came[c][b], and gnats throughout all their territory.
translation:
  language: zh_hans
  text: 他说，蝇群[a]来了；小虫[b]遍布他们全境。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蝇群”或译“虫群”。希伯来语 עָרֹב 在灾祸记载中通常被理解为成群的苍蝇，但具体是哪一种昆虫并不确定。
    reason: lexical_alternative
  - marker: b
    text: “小虫”或译“虱子”“蚋虫”或“蚊子”；希伯来语 כִּנִּים 所指的确切虫类并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: 他一发话
  rationale: 保留原文“说、发言”的简洁含义，同时以自然汉语表达神一说话灾祸便来到；不译作“命令”，以免加入原文没有明说的命令语义。
- source_word: וַיָּבֹא
  choice: 就来了
  rationale: 该动词叙述灾祸随神的话临到；“就”自然呈现前后紧接的关系，但不额外规定具体空间方向。
- source_word: עָרֹב
  choice: 蝇群
  rationale: 在出埃及灾祸语境中通常理解为成群的苍蝇或类似飞虫；“蝇群”简洁自然，同时以脚注保留昆虫种类不确定之处。
- source_word: כִּנִּים
  choice: 虱蚋
  rationale: 原词指一种小型害虫，但确切种类无法确定。“虱蚋”可概括虱、蠓蚋一类小虫，并避免武断锁定为现代生物分类中的某一种；脚注列出常见译法。
- source_word: בְּכָל
  choice: 遍布……全
  rationale: 以“遍布……全境”表达分布在整个范围内，完整体现“在一切、遍及”的含义。
- source_word: גְּבוּלָם
  choice: 他们全境
  rationale: 此处指埃及人所辖地域的全部范围，而不只是边界线；“全境”符合灾祸覆盖范围的语境。
theological_decisions:
- issue: 神的话与灾祸临到之间的关系
  choice: “他一发话……就来了”
  alternative: “他一命令……就来了”
  rationale: 原文使用普通的“说”而非明确的“命令”动词。译文呈现神发话后灾祸立即临到的诗意关系，却不把这一关系解释为原文未明说的特定命令形式。
translation_notes:
  register: 采用现代、庄重而易懂的诗体叙述。“他一发话”比直译“他说”更自然地表现紧凑的神圣言语公式；两个虫灾以并列分句呈现。所有词类辨认上的不确定性均保留在脚注中。
