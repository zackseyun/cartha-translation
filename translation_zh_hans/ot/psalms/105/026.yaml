  text: שָׁ֭לַח מֹשֶׁ֣ה עַבְדּ֑/וֹ אַ֝הֲרֹ֗ן אֲשֶׁ֣ר בָּֽחַר בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/026.yaml
  text: He sent Moses his servant[a], Aaron whom he had chosen.
translation:
  language: zh_hans
  text: '他差遣自己的仆人摩西，

    也差遣他所拣选的亚伦。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“他先前所拣选的亚伦”。希伯来语动词在这里没有明确标示拣选与差遣之间的相对时间。
    reason: 保留原文完成式在相对时序上的含蓄性。
lexical_decisions:
- source_word: שָׁלַח
  choice: 他差遣
  rationale: 该词为Qal完成式第三人称阳性单数；主语由上下文可知是神。“差遣”自然、庄重，也适合神委派摩西和亚伦执行使命的语境。
- source_word: מֹשֶׁה עַבְדּוֹ
  choice: 自己的仆人摩西
  rationale: עֶבֶד带第三人称阳性单数后缀，意为“他的仆人”。在此处是对摩西的尊称和职分描述，译作“仆人”比“奴隶”更符合语境；用“自己的”清楚指回隐含主语。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: אֲשֶׁר בָּחַר בּוֹ
  choice: 他所拣选的
  rationale: 关系从句修饰亚伦；בחר与介词ב连用表示选中某人。“所拣选的”保留原文的简洁和神学语域，同时不强行规定这一选择与差遣之间的具体时序。
theological_decisions:
- issue: 动词的隐含主语
  choice: 译作“他”，不在本节补出“耶和华”或“神”
  alternative: 译作“耶和华差遣”或“神差遣”
  rationale: 希伯来文只有第三人称阳性单数动词，主语可从上下文认出。保留代词可避免加入本节原文没有明说的名词。
- issue: 亚伦蒙拣选与受差遣的时序
  choice: 正文用“他所拣选的”，不明说“先前”
  alternative: 译作“他先前所拣选的”
  rationale: 希伯来语完成式表明选择是完整事件，但在此并不以语法形式明确标示它相对于差遣的时间。正文保留这种含蓄性。
- issue: 是否为亚伦重复“差遣”
  choice: 译作“也差遣”，使两个并列受词在现代汉语中关系清楚
  alternative: 直译为“他差遣自己的仆人摩西、他所拣选的亚伦”
  rationale: 原文中摩西和亚伦同作“差遣”的受词。中文补出“也差遣”不增加新的事件，而是清楚呈现同一谓语统摄两人的句法关系。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“差遣”“仆人”“拣选”保留诗篇叙述神圣使命时的传统语域，同时句式简明，适合普通读者。分行并重复“也差遣”，使摩西和亚伦同为受差遣者这一结构更清楚。
