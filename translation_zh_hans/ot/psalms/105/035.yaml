  text: It ate all the vegetation in their land[b][a], and it ate the fruit of their ground.
translation:
  language: zh_hans
  text: 吃了他们境内的一切植物[a]，又吃了他们土地的果实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “植物”或译“青草”。希伯来语עֵשֶׂב既可特指草，也可泛指各类植物。
    reason: lexical_alternative
  - marker: b
    text: “土地的果实”或译“土壤的出产”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכַל
  choice: 吃尽了
  rationale: 希伯来语动词为第三人称阳性单数，承接上文作为集合性灾害的蝗虫；汉语省略主语，既自然，也不强行改成单数“它”或复数“它们”。“吃尽”保留具体的啃食意象，并结合כָּל表达彻底性。
- source_word: כָּל עֵשֶׂב
  choice: 一切草木
  rationale: עֵשֶׂב可特指草，也可泛指绿色植物；“草木”在现代汉语中自然地涵盖各类地上植物，并保留集合意义。
- source_word: בְּאַרְצָם
  choice: 他们境内
  rationale: בְּ表示所在范围，אֶרֶץ在这里指他们的国土；“境内”简洁表达“在他们的地中”，并与后面的אַדְמָה（土地、土壤）保持区别。
- source_word: פְּרִי אַדְמָתָם
  choice: 他们土地所出的果实
  rationale: פְּרִי本义为果实，也可泛指地里的出产；אַדְמָה指土地、土壤。“土地所出的果实”保留原文意象及两词关系，同时在中文中通顺。
theological_decisions: []
