  yaml_path: translation/ot/psalms/105/022.yaml
  text: to bind his princes at his pleasure[b][a], and to teach his elders wisdom.
translation:
  language: zh_hans
  text: 使约瑟能随自己的心意约束法老的臣宰，使法老的长老有智慧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使法老的长老有智慧”也可译作“教导法老的长老智慧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאְסֹר
  choice: 约束
  rationale: 该词是不定式，承接上节表达所授予权柄的目的或结果。原义可指捆绑、囚禁；此处用于治理臣宰，译作“约束”既保留控制之意，也避免无根据地限定为实际监禁。
- source_word: שָׂרָיו
  choice: 王的臣宰
  rationale: שַׂר可指首领、贵族或官员。这里第三人称后缀依上下文指法老；“王的臣宰”自然体现宫廷与政治语境，并避免现代读者误解代词所指。
- source_word: בְּנַפְשׁוֹ
  choice: 随自己的心意
  rationale: 字面为“按着/凭着他的 נפשׁ（生命、心意、愿望）”。此处作意愿或自主决定解；“随自己的心意”保留其主观意愿色彩，且符合现代汉语。
- source_word: וּזְקֵנָיו
  choice: 王的长老
  rationale: זָקֵן既可指年长者，也可指有地位的资深领袖。译作“长老”保留年龄与治理身份的双重可能；补出“王的”澄清后缀所指。
- source_word: יְחַכֵּם
  choice: 教导……有智慧
  rationale: חכם的Piel形态可表示“使有智慧”或“教导智慧”。正文采用自然且接近使役含义的“教导……有智慧”，脚注保留另一种直译可能。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“臣宰”保留宫廷语体，“随自己的心意”传达希伯来语“凭着他的心/愿望”的习语含义。为避免连续两个“他的”造成指代含混，按上文语境明确译为“王的臣宰”“王的长老”。
