  text: שָׁאַ֣ל וַ/יָּבֵ֣א שְׂלָ֑ו וְ/לֶ֥חֶם שָׁ֝מַ֗יִם יַשְׂבִּיעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/040.yaml
  text: They asked[a], and he brought quail[b]; he satisfied them with the bread of heaven.
translation:
  language: zh_hans
  text: 他们祈求[a]，他就带来鹌鹑；又用天上的粮食[b]使他们饱足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词是单数，直译为“他祈求”；这里很可能按集体意义指以色列民祈求。
    reason: alternative_reading
  - marker: b
    text: “天上的粮食”也可译为“从天上来的粮食”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאַל
  choice: 他们祈求
  rationale: 原文动词为第三人称阳性单数，直译是“他祈求”；但上下文以以色列民为集体主体，且本节末有复数宾语后缀，因此正文按集体意义译为“他们祈求”，同时用脚注保留原文单数形式。
- source_word: וַיָּבֵא
  choice: 他就带来
  rationale: בוא 的使役形在此意为“使……来到、带来”；上帝是隐含主语。“带来”自然地保留了使役含义。
- source_word: שְׂלָו
  choice: 鹌鹑
  rationale: 该词通常指“鹌鹑”，对应旷野中上帝所赐的飞禽。
- source_word: לֶחֶם שָׁמַיִם
  choice: 天上的粮食
  rationale: 该组合结构直译为“天之粮”。“天上的粮食”既保留诗歌意象，也符合现代汉语表达；“从天上来的粮食”则明确表达来源，是可取的另一译法。
- source_word: יַשְׂבִּיעֵם
  choice: 使他们饱足
  rationale: שׂבע 的使役形表示“使吃饱、使满足”。“使他们饱足”兼顾食物语境和充分供应之意，并保留诗体庄重感。
theological_decisions:
- issue: 开头动词 שָׁאַל 的主语
  choice: 按以色列民这一集体主体译为“他们祈求”
  alternative: 较形式对应地译为“他祈求”，把单数理解为对以色列整体或某位代表人物的指称
  rationale: 本段叙述上帝在旷野为以色列所行的事，末句“使他们饱足”的复数后缀也支持集体理解。正文采用复数以清楚表达语境中的意义，脚注则保留希伯来文本的单数形态，避免掩盖歧义。
- issue: לֶחֶם שָׁמַיִם 所表达的关系
  choice: “天上的粮食”，保留“天之粮”的属格式诗意表达
  alternative: “从天上来的粮食”，将其明确理解为来源
  rationale: 希伯来语组合关系既可保持较字面的“天之粮”，也可在语境中理解为“来自天上的粮食”。正文不把这种关系限定得过死，脚注列出来源性译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“祈求”适合向上帝求取的语境；“饱足”比口语化的“吃饱”更能兼顾诗体与 שׂבע 所含的充分满足之意。所有脚注标记均置于正文相应位置。
