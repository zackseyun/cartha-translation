base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/014.yaml
  text: He allowed no man to oppress them[a]; he rebuked kings on their account,
translation:
  language: zh_hans
  text: 他不容任何人欺压他们；他为了他们[a]斥责君王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因他们的缘故”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנִּיחַ
  choice: 容
  rationale: 使役形在此表示准许或任由某事发生；“不容”简洁自然，并能与后面的动词衔接。
- source_word: אָדָם
  choice: 任何人
  rationale: 这里是单数泛指，意思不是特指某个男人，而是任何一个人；现代汉语用“任何人”最清楚。
- source_word: לְעָשְׁקָם
  choice: 欺压他们
  rationale: עשק可指压迫、剥削或以不公手段侵害；“欺压”既保留广泛含义，也符合诗歌语体。
- source_word: וַיּוֹכַח
  choice: 斥责
  rationale: יכח在此指责备、谴责；“斥责”力度明确，适合上帝对君王的行动。
- source_word: עֲלֵיהֶם
  choice: 为了他们
  rationale: על加代词后缀在此表示因他们、为他们的缘故而采取行动；正文采用自然的“为了他们”，同时以脚注保留另一种关系性表达。
- source_word: מְלָכִים
  choice: 君王
  rationale: 原词明确指众王；“君王”准确而庄重。
theological_decisions:
- issue: 上帝保护族长的方式
  choice: 保留“不容”与“斥责”两项行动，不补充具体方式或事件
  alternative: 解释为上帝绝对阻止一切伤害，或指明某些历史事件
  rationale: 经文本身只陈述上帝不准人欺压他们，并为他们斥责君王；不宜把保护的机制或范围解释得超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“任何人”准确表达泛指的אָדָם；分号保留希伯来诗句两个平行分句之间的紧密关系。
