  source_fidelity: “雅威”准确对应四字神名；“察验我”适切表达בְּחָנֵנִי，且与后续动词形成可辨而平行的关系。“肾脏”和“心”保留了原文的人体意象，脚注也恰当说明其文化语义。惟“试炼我”在现代汉语中较常指使人经历磨难，较容易将נסה具体化为苦难性的试炼；“试验我”更直接、宽泛地对应原文的‘测试／考验’。
