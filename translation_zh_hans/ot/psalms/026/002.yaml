  text: בְּחָנֵ֣/נִי יְהוָ֣ה וְ/נַסֵּ֑/נִי צרופ/ה כִלְיוֹתַ֣/י וְ/לִבִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/002.yaml
  text: Examine me[a], O Yahweh, and test me; refine my mind and my heart.
translation:
  language: zh_hans
  text: 雅威啊，求你察验我，试验我；熬炼我的肾脏[a]和心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“肾脏”；在古希伯来人的表达中，肾脏可象征人内心最深处的思想、情感和意向。
    reason: cultural_note
lexical_decisions:
- source_word: בְּחָנֵנִי
  choice: 察验我
  rationale: בּחן表示查察、检验真伪。“察验”兼具审察和验证之意，也与下句的נסה有所区别。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: וְנַסֵּנִי
  choice: 试炼我
  rationale: נסה侧重借着试验来证明；“试炼”保留受考验的意味，并与“察验”形成平行而不完全重复。
- source_word: צְרוֹפָה
  choice: 熬炼
  rationale: צרף本是冶炼、精炼金属的用语；“熬炼”在现代中文中既保留冶金意象，也可自然用于人的内在生命。
- source_word: כִלְיוֹתַי
  choice: 我的肾脏
  rationale: 原文为复数“肾”，在古希伯来观念中指向人最深处的思想、情感或意向。正文保留具体身体意象，脚注说明其文化含义。
- source_word: וְלִבִּי
  choice: 和心
  rationale: לֵב指心，也可涵盖思想、意志和内在生命。“心”既忠实于身体意象，也在中文中保有广泛的内在含义。
theological_decisions:
- issue: 希伯来诗歌中的人体意象
  choice: 正文保留“肾脏”和“心”的并列意象，并以脚注解释“肾脏”的古代隐喻意义。
  alternative: 将כִלְיוֹתַי直接意译为“内心深处”“肺腑”或“思想”。
  rationale: 直译能保留原诗具体而强烈的表达，也避免把“肾脏”所涵盖的思想、情感和意向单一化；脚注则帮助现代读者理解。
- issue: 两个检验动词的关系
  choice: 分别译作“察验”和“试炼”。
  alternative: 两者都译作“考验”或“检验”。
  rationale: 两个希伯来动词语义重叠，却并非完全相同。采用近义而有区别的译词，既保留平行加强的诗体效果，也不过度消除其细微差异。
translation_notes:
  register: 采用现代、庄重的祷告语体。“求你”使连续的命令式在普通话祷告中自然得体；分号保留前两项查验与后两项熬炼之间的诗意推进。
