  text: שָׂ֭נֵאתִי קְהַ֣ל מְרֵעִ֑ים וְ/עִם רְ֝שָׁעִ֗ים לֹ֣א אֵשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/005.yaml
  text: I hate the assembly of evildoers[a], and I will not sit with the wicked.
translation:
  language: zh_hans
  text: 我恨恶作恶之人的聚会[a]，也不与恶人同坐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我一向恨恶作恶之人的群体。”希伯来语完成式可以从过去角度理解，但这里更可能表达诗人已经确立的持续立场。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: 我恨恶
  rationale: 该词是 שׂנא 的 Qal 完成式第一人称单数。在本诗语境中，完成式表达诗人已经确立并持续持守的态度；现代汉语用“我恨恶”自然地传达这种稳定立场，而不把重点局限于过去。
- source_word: קְהַל
  choice: 聚会
  rationale: קהל 指聚集起来的群体或集会。“聚会”保留集合性，又避免“会众”可能带来的敬拜群体色彩。
- source_word: מְרֵעִים
  choice: 作恶之人
  rationale: 这是 רעע 的分词作名词使用，指以行恶为特征的人。“作恶之人”清楚、自然，也保留其行为性的含义。
- source_word: וְעִם
  choice: 也不与
  rationale: 连词与介词把第二分句同第一分句并列起来；结合否定谓语，译作“也不与”符合现代汉语表达，并保留“与……一起”的关系。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 该词是指道德上邪恶之人的名词化形容词。“恶人”简洁庄重，并与“作恶之人”形成诗歌平行。
- source_word: לֹא אֵשֵׁב
  choice: 不……同坐
  rationale: ישב 的未完成式第一人称单数带否定，在此表达坚决拒绝或一贯不参与，而不只是单纯将来。“同坐”保留坐在一起、相互交往的具体意象；汉语现在时也可自然表达坚定立场。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“恨恶”比口语性的“讨厌”更准确地表达强烈的道德拒斥；“聚会”避免把该群体误解为宗教会众。第二分句用“同坐”保留原文意象，并自然传达拒绝与恶人为伍的决心。
