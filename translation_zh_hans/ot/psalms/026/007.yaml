  text: לַ֭/שְׁמִעַ בְּ/ק֣וֹל תּוֹדָ֑ה וּ֝/לְ/סַפֵּ֗ר כָּל נִפְלְאוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/007.yaml
  text: to proclaim with a voice of thanksgiving[b][a], and to recount all your wondrous deeds.
translation:
  language: zh_hans
  text: 好让人听见我感恩的声音[a]，并述说你一切奇妙的作为[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为要扬声感恩。”原文动词为使役式，直译是“使人听见”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你一切的奇事”或“你一切奇妙的工作”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשְׁמִעַ
  choice: 好让人听见
  rationale: 原文是使役式不定词，直译为“使人听见”。此译保留使役含义，也符合现代汉语表达。
- source_word: בְּקוֹל תּוֹדָה
  choice: 我感恩的声音
  rationale: בְּקוֹל 表示“以声音／在声音中”，תּוֹדָה 指感谢、感恩。汉语补出语境所含的第一人称领属，使表达自然；也保留“声音”这一具体意象，而不径直化为“高声宣告”。
- source_word: וּלְסַפֵּר
  choice: 并述说
  rationale: ספר 的加强式在此指讲述、数说；“述说”既能表达公开讲说，也与诗歌语体相称。
- source_word: כָּל
  choice: 一切
  rationale: 保留原文全面、概括的含义。
- source_word: נִפְלְאוֹתֶיךָ
  choice: 你奇妙的作为
  rationale: 该复数名词可指“奇事”或“奇妙作为”，在诗篇中常指上帝所行非凡之事；“奇妙的作为”自然地呈现其行动含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。句首“好让”承接本节在上下文中的目的关系；两个不定词结构译作“好让……并……”，保持平行。所有脚注标记均置于对应正文之后。
