lexical_decisions:
- source_word: אֶרְחַץ
  choice: 我要……洗
  rationale: 这是רחץ的Qal未完成式第一人称单数；在诗歌语境中可表达当前的决意或持续行动。结合下句带意愿色彩的形式，译作“我要……洗”自然地体现立志语气，同时不把动作限定为遥远的将来。
- source_word: בְּנִקָּיוֹן
  choice: 在清白中
  rationale: נִקָּיוֹן可指洁净、纯洁或无辜；此处既可能带有礼仪洁净的意象，也有道德清白的含义。“在清白中”保留主要的伦理意味，并以脚注说明词义范围。
- source_word: כַּפָּי
  choice: 手
  rationale: כף的双数形式直指双掌，但现代汉语在洗濯语境中通常说“洗手”，比“洗双掌”自然。
- source_word: וַאֲסֹבְבָה
  choice: 环绕
  rationale: סבב意为绕行、环绕；词尾形式可带意愿或决意色彩。“环绕”简洁地保留具体动作，并与前面的“我要”共同承载其意愿语气。
- source_word: מִזְבַּחֲךָ
  choice: 你的祭坛
  rationale: מזבח是“祭坛”，第二人称阳性单数后缀译作“你的”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以称号替代。
theological_decisions:
- issue: בְּנִקָּיוֹן所含道德清白与礼仪洁净的张力
  choice: 清白
  alternative: 纯洁；洁净
  rationale: 上下文强调诗人的正直，因此正文采用“清白”；但洗手和祭坛也唤起礼仪洁净的背景，故在脚注中保留其他可能含义，不将两者截然分开。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非一般称号；正文保留专名，并采用现代简体中文圣经传统中最通行、最易识别的形式。
- issue: 动词形式的时态与意愿色彩
  choice: 我要……洗……环绕
  alternative: 我洗手，并环绕；愿我……环绕
  rationale: 希伯来诗歌未完成式和带词尾形式可表示持续行动、鲜活陈述或决意。译文以“我要”呈现较自然的决意语气，但脚注提示也可理解为现时或惯常行动。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在清白中洗手”有意保留原文将内在清白与外在洗濯相联的表达；“环绕祭坛”保持具体的敬拜场景。所有脚注标记均置于正文相应位置。
