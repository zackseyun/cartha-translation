  text: 我要以清白洗手[a]，环绕你的祭坛[b]，耶和华啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “清白”也可译作“纯洁”或“洁净”；原词既可指道德上的无辜，也可带有礼仪洁净的意味。
