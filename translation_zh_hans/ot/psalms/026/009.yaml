  text: אַל תֶּאֱסֹ֣ף עִם חַטָּאִ֣ים נַפְשִׁ֑/י וְ/עִם אַנְשֵׁ֖י דָמִ֣ים חַיָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/009.yaml
  text: Do not gather my soul with sinners[b][a], nor my life with men of bloodshed.
translation:
  language: zh_hans
  text: '不要把我的性命与罪人一同收去[a]，

    也不要把我的生命与流人血的人一同收去[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收去”也可译作“聚在一起”或“扫除”。这里可能指在审判中与恶人一同被带走。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“血之人”，是希伯来语习语，指残暴或负有血债的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  choice: 收去
  rationale: אָסַף基本义为“聚集、收聚”，但在审判语境中可指将人一并带走或除去。“收去”既保留被归到同一结局中的意象，也符合现代汉语祈求语气。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ可指生命、自我或性命。此处不必赋予技术性的灵魂—身体二分含义；译作“性命”自然地表达诗人本人及其生命，同时与下句“我的生命”形成近义平行。
- source_word: חַטָּאִים
  choice: 罪人
  rationale: 该词直接指以犯罪为特征的人；“罪人”简洁、庄重，并保留原文的道德类别。
- source_word: אַנְשֵׁי דָמִים
  choice: 流人血的人
  rationale: 字面为“血之人／众血之人”，是指暴力或负有血债之人的希伯来习语。“流人血的人”保留血的意象，又不将所指过度限定为某一种杀人罪名。
- source_word: חַיָּי
  choice: 我的生命
  rationale: חַיִּים在这里与נַפְשִׁי平行，指诗人的生命。“我的生命”保持两行的诗性递进，又避免生硬重复为同一个中文词。
- source_word: אַל
  choice: 不要
  rationale: אַל加未完成式表达否定的祈求。“不要”是现代汉语中自然而庄重的恳求形式。
theological_decisions:
- issue: נַפְשִׁי与חַיָּי的人论含义
  choice: 分别译为“我的性命”和“我的生命”，保留近义而不完全相同的诗行平行。
  alternative: 将נַפְשִׁי译为“我的灵魂”，חַיָּי译为“我的生命”。
  rationale: 原文并不要求技术性的身心二分。“性命／生命”既保留两个相关词语，也避免把后期系统神学意义强加于נֶפֶשׁ。
- issue: 诗人所求是免受何种结局
  choice: 用“与……一同收去”保留可能指在审判中同被带走的含义。
  alternative: 明确译为“不要把我与……一同除灭”。
  rationale: אָסַף在此具有语义张力，既有“聚集”，也可能在上下文中含“收走、除去”。正文不明确限定为死亡或毁灭，并用脚注说明另一种表达。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。两行重复“一同收去”，反映希伯来诗歌的平行结构；“性命／生命”保留近义变化，不引入技术性的人论术语。
