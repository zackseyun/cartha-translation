id: PSA.26.1
reference: Psalms 26:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/001.yaml
  text: Of David[a]. Vindicate me, O Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: zh_hans
  text: '大卫的诗。[a]


    雅威啊，求你为我伸冤，[b]


    因为我一向行事纯全，[c]


    又倚靠雅威，必不失足。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“大卫的”。这里的“大卫的”可以表示由大卫所作、归于大卫、与大卫有关，或献给大卫。
    reason: 保留诗篇题署中 לְ 所表达关系的歧义。
  - marker: b
    text: 或译“求你审判我”或“求你判我有理”。这里的动词既可泛指审判，也可在诉讼语境中指作出有利裁决、为人伸冤。
    reason: 说明 שׁפט 的基本义及其在本节语境中的司法含义。
  - marker: c
    text: 或译“正直”或“无可指摘”。原词含有完整、纯正和品行无可责备之意，并不必然表示绝对无罪。
    reason: 保留 תֹּם 的词义范围和相关神学张力。
  - marker: d
    text: 或译“必不滑跌”“必不动摇”。原文描绘脚下打滑、站立不稳的形象。
    reason: 保留 מעד 的具体意象及可接受的中文表达。
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 诗篇标题中的 לְ 加人名可表示作者、归属、关联或题献。“大卫的诗”符合现代中文圣经标题习惯；脚注保留其关系范围的不确定性。原文没有“诗”字，但此处是诗篇题署，中文补出可使表达自然。
- source_word: שָׁפְטֵנִי
  choice: 求你为我伸冤
  rationale: שׁפט 的基本义是“审判”，在此是诗人基于自身纯全而请求雅威作出有利裁决。“为我伸冤”自然地表达司法语境中的昭雪、判我有理，同时以脚注保留“审判我”的直译。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文将其作为以色列之神专名使用的特点，而不以称号代替。
- source_word: בְּתֻמִּי
  choice: 按自己的纯全
  rationale: תֹּם 表示完整、正直、无可指摘的品行。“纯全”保留完整正直的道德含义，却不必然解作绝对无罪；“按……而行”也保留介词与“行走”隐喻的联系。
- source_word: הָלַכְתִּי
  choice: 我一向……而行
  rationale: 保留希伯来语以“行走”描述生活方式的惯用比喻；“一向”使完成式所表达的既往持续操守在中文中更清楚。
- source_word: בָּטַחְתִּי
  choice: 倚靠
  rationale: בטח 表示信赖并有所依靠。“倚靠”简洁、自然，也与下文不失足的身体意象相呼应。
- source_word: לֹא אֶמְעָד
  choice: 必不失足
  rationale: מעד 指脚下滑动、踉跄或失去立足处。“失足”保留具体意象；“必不”表达未完成式在此与信靠相连的确信语气。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。音译“雅威”既反映较通行的学术复原，也避免用称号“主”掩盖专名；“耶和华”是中文传统形式，但不如“雅威”接近通常复原的读音。
- issue: 诗人对 תֻם 的自我陈述
  choice: 纯全
  alternative: 正直；无可指摘；完全无罪
  rationale: 这里是司法与盟约语境中的操守申诉。“纯全”保留诗人强烈的道德主张，同时不把它扩张为绝对无罪，也不削弱原文的神学张力。
- issue: לֹא אֶמְעָד 的语气和逻辑关系
  choice: 必不失足
  alternative: 我没有动摇；愿我不失足
  rationale: 未完成式可表达将来或信心所产生的确信。在紧接“我倚靠雅威”之后，译作“必不失足”最自然；但不把它改写成神必保守的显式因果陈述，以免加入原文未明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。每行对应原文主要分句；保留“行”与“失足”的身体意象。用“求你”为祈使句增添符合现代汉语的礼敬语气，但不弱化命令式祈求。“大卫的诗”置于独立标题行，并以脚注交代原文未明说“诗”以及 לְ 的关系歧义。
