lexical_decisions:
- source_word: אֲשֶׁר בִּידֵיהֶם
  choice: 他们手中
  rationale: 承接上一节所说的人，以自然的现代汉语保留“手中”的希伯来意象，指他们所行、所掌握的事。
- source_word: זִמָּה
  choice: 恶谋
  rationale: 该词可指邪恶、罪行、败坏或邪恶的图谋；此处与“贿赂”并列，“恶谋”既保留其可能涉及蓄意策划的含义，也不把它限于性方面的罪恶。
- source_word: וִימִינָם
  choice: 右手
  rationale: 保留希伯来文单数集合式的“右手”意象，表示行动和权势的工具。
- source_word: מָלְאָה
  choice: 装满
  rationale: 表达完成后持续存在的状态，并与“右手”这一具体意象自然搭配。
- source_word: שֹׁחַד
  choice: 贿赂
  rationale: 原词虽为单数形式，但可作集合或泛指用；汉语“贿赂”自然涵盖受贿所得及惯常的腐败行为。
theological_decisions: []
