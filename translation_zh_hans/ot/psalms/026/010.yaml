  source_fidelity: 译文保留了“手”和“右手”的平行意象，并正确表达了右手与贿赂的关联。不过，“恶谋”将זִמָּה较宽的“邪恶／恶行／罪恶”义偏窄地限定为谋划；“右手装满贿赂”也未能以自然汉语表达原文的“满了贿赂”。
