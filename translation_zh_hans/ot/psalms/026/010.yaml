- from: 他们手中有恶谋[a]，右手装满贿赂。
  to: 他们手中有恶行[a]，右手满是贿赂。
  rationale: 修订避免将זִמָּה不必要地限缩为“恶谋”，并将“装满”改为“满是”，使汉语更自然且更贴合原文的静态“满了”表达。两处“手”的平行意象及“右手”单数集合用法均予保留。
