  text: יְֽהוָ֗ה אָ֭הַבְתִּי מְע֣וֹן בֵּיתֶ֑/ךָ וּ֝/מְק֗וֹם מִשְׁכַּ֥ן כְּבוֹדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/008.yaml
  text: O Yahweh[a], I love the habitation of your house, the place where your glory dwells.
translation:
  language: zh_hans
  text: 耶和华啊，我喜爱你所居住的殿宇，以及你荣耀居住的地方。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式地译作：“耶和华啊，我一向喜爱你殿宇的居所，以及你荣耀之居所所在的地方。”
    reason: 保留 אָהַבְתִּי 的完成式所可表达的持续色彩，并呈现原文 וּמְקוֹם 的显式并列，以及“荣耀之居所”的名词构造。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代中文通行的专名“耶和华”对应四字神名，并用“啊”表达希伯来诗歌中的直接呼告。
- source_word: אָהַבְתִּי
  choice: 我喜爱
  rationale: 完成式在此可表达诗人持久、确定的爱慕；译作现在时“我喜爱”符合语境，也比单纯过去时自然。
- source_word: מְעוֹן בֵּיתֶךָ
  choice: 你殿宇的居所
  rationale: מְעוֹן意为居所、住处；בֵּיתֶךָ直译“你的房屋”，在圣所语境中译作“你殿宇”，既保留建筑意象，也让现代读者容易理解。
- source_word: וּמְקוֹם
  choice: 就是……地方
  rationale: 原文有并列连词“和”；两组短语语义上近似同位，中文以“就是”自然呈现其解释关系，同时不改变两者的紧密并列。
- source_word: מִשְׁכַּן כְּבוֹדֶךָ
  choice: 你荣耀居住的地方
  rationale: 原文较形式化地说“你荣耀之居所的地方”。转为关系分句可避免中文名词堆叠，并保留神的荣耀临在、居住的空间意象。
- source_word: כְּבוֹדֶךָ
  choice: 你的荣耀
  rationale: כָּבוֹד在此指神显现的荣耀与威荣；“荣耀”是准确、自然且不过度解释的对应词。
theological_decisions:
- issue: 如何表达圣所而不把所指限定得超过原文
  choice: 你殿宇的居所
  alternative: 你的圣殿；你的家
  rationale: 原文使用“你的房屋/家”，语境指向敬拜圣所。“殿宇”保留实体建筑和神之居所的意象，却不进一步加入经文未明说的历史阶段或建筑名称。
- issue: 神的荣耀与圣所的关系
  choice: 你荣耀居住的地方
  alternative: 你荣耀设立宝座的地方；你荣耀的帐幕
  rationale: 原文明确使用“居所”一类词，却没有“坐王”或“宝座”的措辞。因此保留“居住”的意象，不将其扩展为特定的登基神学表达。
- issue: 完成式 אָהַבְתִּי 的时态力度
  choice: 我喜爱
  alternative: 我一向喜爱；我曾喜爱
  rationale: 诗人在当前申诉中陈明稳定的爱慕。“我喜爱”能表达现时且持续的倾向；脚注保留更形式化的完成时读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“殿宇”较“房屋”更贴合圣所语境，“居所”保留原文空间意象；正文以同位解释使中文流畅，脚注则呈现较形式对应的语序与时态。
