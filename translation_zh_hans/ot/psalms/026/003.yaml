  yaml_path: translation/ot/psalms/026/003.yaml
  text: For your steadfast love is before my eyes[b][a], and I have walked in your truth.
translation:
  language: zh_hans
  text: '因为你的慈爱[a]在我眼前；

    我行在你的真理[b]中。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“盟约忠诚之爱”或“坚定的爱”。
    reason: lexical_alternative
  - marker: b
    text: “真理”也可译作“信实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，为诗人所作的陈述提供理由；“因为”自然保留了希伯来语的解释性作用。
- source_word: חַסְדְּךָ
  choice: 你的慈爱
  rationale: חֶסֶד兼有爱、恩慈、忠诚和盟约关系中的坚定不移等含义。“慈爱”是庄重而通顺的现代汉语表达，同时以脚注保留其盟约忠诚的内涵。
- source_word: לְנֶגֶד עֵינָי
  choice: 就在我眼前
  rationale: 既贴近“在我眼前”的字面意象，也自然表达诗人始终将上帝的慈爱置于意识和注视之中；“就”强化当前在望之感，但不额外加入原文没有明说的时间副词。
- source_word: וְהִתְהַלַּכְתִּי
  choice: 我一直……行事
  rationale: הלך的反身词干在此指持续的生活方式或行为。“行事”在现代汉语中自然表达此义，“一直”体现完成式所呈现的截至目前的生活轨迹。
- source_word: בַּאֲמִתֶּךָ
  choice: 按你的真理
  rationale: אֱמֶת可指真理、真实、信实或可靠。译作“真理”保留较宽的语义范围；介词ב在此用“按”表达以此为生活准则，同时脚注保留“信实”的可能译法。
theological_decisions:
- issue: 上帝属性用语חֶסֶד与אֱמֶת的语义范围
  choice: 正文分别译作“慈爱”和“真理”，不把任何一词限定为单一的系统神学概念。
  alternative: 可分别理解或译作“盟约忠诚之爱”和“信实”。
  rationale: 两词共同描绘上帝可靠而施爱的品格，并构成诗人生活行为的依据。正文采用宽广、自然的汉语词，脚注提示其盟约性与信实性，避免消除原文的丰富含义。
- issue: 诗人的“行走”是身体动作还是生活操守
  choice: 译作“行事”，理解为生活方式与行为。
  alternative: 可较形式化地译作“行在你的真理中”。
  rationale: 该动词形式在此通常表示人的生活与操守；“行事”既传达隐喻的实际含义，也避免现代汉语读者误解为单纯步行。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；保留两行平行结构。正文中的[a]、[b]分别紧随相关词语，且所有脚注标记均已在正文出现。
