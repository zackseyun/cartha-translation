source:
  edition: WLC
  text: רַ֭גְלִ/י עָֽמְדָ֣ה בְ/מִישׁ֑וֹר בְּ֝/מַקְהֵלִ֗ים אֲבָרֵ֥ךְ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/012.yaml
  text: My foot stands on level ground[a]; in the assemblies I will bless Yahweh.
translation:
  language: zh_hans
  text: '我的脚站在平坦之地[a]；

    在众会中，我要称颂雅威。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“平正之处”；原文也可能含有正直、公正的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלִי
  choice: 我的脚
  rationale: 原文为单数名词并带第一人称单数后缀，直译为“我的脚”；中文诗歌中这样表达自然，也保留个人站立稳固的意象。
- source_word: עָמְדָה
  choice: 站在
  rationale: 该词为完成式，与阴性单数的“脚”一致；此处可表示已经确立并持续至今的状态，中文用“站在”自然呈现当前稳立之意，而不额外加入“站稳”等解释。
- source_word: בְמִישׁוֹר
  choice: 在平坦之地
  rationale: מִישׁוֹר首先指平坦、平正的地方；此译保留具体地形意象，同时不排除正直、公正的隐含意味。
- source_word: בְמַקְהֵלִים
  choice: 在众会中
  rationale: 原文为复数，指聚集起来的会众或集会；“众会”保留复数含义，并避免限定为某种后来的宗教组织形式。
- source_word: אֲבָרֵךְ
  choice: 我要称颂
  rationale: ברך的加强词干在此表示向上帝祝颂、颂赞；“称颂”比单用“赐福”更符合中文对人向上帝发言的习惯，同时保持该词的祝颂意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用四字神名；“雅威”按现代学界通常重构的读音音译，保留其专名性质，而不以“主”等称号替代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名。采用“雅威”可在现代普通话中较直接地音译通常重构的读音，也避免用称号取代专名；不把有争议的精确古代发音说成绝对确定。
- issue: מִישׁוֹר 是否明译为道德上的正直
  choice: 正文保留“平坦之地”的空间意象，在脚注说明正直含义
  alternative: 在正直中；在正道上
  rationale: 该词既可指平坦之处，也能带有平正、正直的意味。上下文的“脚站立”支持具体意象，因此不在正文中消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。分为两个对应分句，保留原文单数“脚”、复数“众会”及未来／决意语气“我要”。
