  text: I have not sat with men of falsehood[a], and I do not go in with those who conceal themselves.
translation:
  language: zh_hans
  text: 我没有与虚谎之人同坐，也不与隐藏真面目的人[a]来往。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐藏真面目的人”或译“隐藏的人”；末句也可译作“我不与他们一同进入”。希伯来语可能指掩饰自己真实品性的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: 同坐
  rationale: ישׁב 的基本义是“坐、居住、停留”；与“同/和”（עִם）连用时可表示结交、相处。“同坐”保留原文意象，在现代汉语中也能表达共同相处。
- source_word: מְתֵי שָׁוְא
  choice: 虚谎之人
  rationale: מְתֵי 是“……之人”的复数构造形式；שָׁוְא 可指虚假、虚空或欺骗。此处“虚谎之人”既保留其道德含义，也避免把语义缩窄为单一类型的欺骗。
- source_word: נַעֲלָמִים
  choice: 隐藏真面目的人
  rationale: 该词源于 עלם（隐藏），可指隐藏自己或掩饰真实品性的人。译作“隐藏真面目的人”比直译“隐藏的人”清楚，同时不像“伪君子”那样加入过强的解释。
- source_word: אָבוֹא
  choice: 来往
  rationale: בוא 的基本义是“来、去、进入”。本句与 עִם 连用，并与前句“同坐”平行，语境中指加入其行列或与其交往；“来往”是自然的现代汉语表达，但原文“进入”的意象另见脚注。
- source_word: וְעִם
  choice: 也不和
  rationale: 连接第二个否定平行分句。汉语用“也不和”自然承接前句，并清楚保留“与……一起”的关系。
