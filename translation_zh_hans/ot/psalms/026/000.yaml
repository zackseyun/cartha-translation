source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/000.yaml
  text: Of David[a]. Judge me, Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: zh_hans
  text: '大卫的诗。[a]


    耶和华啊，求你为我申辩，[b]

    因为我行事纯全，[c]

    又倚靠耶和华，必不动摇。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”也可译作“大卫所作”“属于大卫”或“关于大卫”。
    reason: 标题中的希伯来介词可表示作者、归属或关联。
  - marker: b
    text: “为我申辩”直译为“审判我”，这里可能指审理案件并判定诗人无辜。
    reason: 保留司法动词的字面意义及语境中的伸冤含义。
  - marker: c
    text: “纯全”也可译作“正直”或“无可指摘”，指完整、诚实的品行，并不必然表示绝对无罪。
    reason: 说明 תֹּם 的词义范围并避免过度神学化。
  - marker: d
    text: “不动摇”也可译作“不失脚”或“不滑跌”；原文采用脚下失稳的意象。
    reason: 保留希伯来语动词的具体形象及可能译法。
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 介词 לְ 可表示归属、作者或关联；“大卫的诗”是自然、庄重的标题译法，同时以脚注保留其语义范围。
- source_word: שָׁפְטֵנִי
  choice: 求你为我申辩
  rationale: 字面为“审判我”，但在此语境中是诗人请求上帝审理其案件并作出有利裁决；“为我申辩”传达了司法意象而不暗示诗人逃避审察。
- source_word: בְּתֻמִּי
  choice: 行事纯全
  rationale: תֹּם 表示完整、正直、行为无可指摘；“纯全”保留品格整体性的含义，且不等同于绝对无罪。
- source_word: לֹא אֶמְעָד
  choice: 必不动摇
  rationale: מעד 的基本意象是脚下失稳、滑跌；在倚靠耶和华的语境中，“不动摇”自然表达坚定站立的结果，并用脚注保留具体意象。
theological_decisions:
- issue: 诗人宣称自己“纯全”是否等于宣称绝对无罪
  choice: 采用“行事纯全”
  alternative: 我毫无罪过
  rationale: 原文强调正直、完整的行事为人，并未明确宣称道德上绝对无罪；译文保留这一张力，不将其扩大为无罪论。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／主
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”，并在同节两处保持一致，体现原文使用的是神的专名而非普通称谓。
- issue: לֹא אֶמְעָד 的时态或情态
  choice: 必不动摇
  alternative: 我没有动摇／愿我不动摇
  rationale: 未完成式可表达预期或确信的结果；这里最自然地承接“倚靠耶和华”，表达诗人的信赖与确信，同时不把它改成命令或祈愿。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体中文；标题独立成行，正文按三个平行分句排列。保留“耶和华”的专名形式，并避免使用可能暗示绝对无罪的措辞。
