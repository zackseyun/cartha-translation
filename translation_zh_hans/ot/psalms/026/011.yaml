    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我，我却
  rationale: 连词加独立代词带有对比和强调作用；“至于我，我却”自然地保留了这两层语气。
- source_word: בְּתֻמִּי
  choice: 按我的纯正
  rationale: תֻּם表示人格和行为上的完整、正直或无可指摘。“纯正”保留其积极的道德含义，又不必然暗示绝对无罪；“按……而行”也自然表达介词ב所指的行为准则。
- source_word: אֵלֵךְ
  choice: 我要……而行
  rationale: 保留הלך“行走”的生活道路隐喻，同时用现代汉语中庄重而可懂的表达呈现其持续或意向性的语气。
- source_word: פְּדֵנִי
  choice: 求你救赎我
  rationale: פדה有赎回、解救之意。“救赎”保留原词的赎回色彩和神学分量，比泛称“救我”更具体。
- source_word: וְחָנֵּנִי
  choice: 施恩给我
  rationale: חנן主要指赐下恩惠、以恩相待。“施恩给我”直接保留这一含义；“怜悯我”虽也可能，但更侧重同情怜恤。
theological_decisions:
- issue: 诗人宣称自己有תֻּם的含义
  choice: 译作“我的纯正”，指行为和品格上的正直完整
  alternative: 译作“我的无可指摘”或“我的清白”，形成更强的无过或无辜宣称
  rationale: 上下文中，诗人将自己的行事为人与恶人对照，同时仍求上帝救赎并施恩。“纯正”既不削弱希伯来文正面的道德宣称，也不把它解释成绝对无罪，从而保留经文中的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体汉语。“至于我，我却”体现对比与强调；“而行”保留行走作为生活方式的隐喻。脚注标记紧随各自所说明的词语。
