- source_word: לְשׁוֹן כְּלָבֶיךָ
  choice: 你那些狗的舌头
  rationale: “舌头”为单数集合用法，“狗”为复数；中文用“你那些狗的舌头”清楚表达这种关系。
- source_word: מֵאֹיְבִים
  choice: 从仇敌身上
  rationale: מן表示来源；“从仇敌身上”比生硬的“从仇敌”更符合现代中文，同时不说明狗具体取得什么。
- source_word: מִנֵּהוּ
  choice: 有所得
  rationale: 结尾形式艰深且表达省略。正文以“有所得”传达从仇敌而来的所得或份额，同时不武断补出“血”或“肉”；异读与困难见脚注。
theological_decisions:
- issue: 暴力和战争意象
  choice: 保留脚在血中踩碎仇敌及狗从仇敌身上有所得的具体图景
  alternative: 淡化为笼统的得胜描述
  rationale: 原文刻意使用强烈、具体的战争图景；翻译不因现代读者的不适而削弱其力度。
- issue: 动词隐含宾语
  choice: 按上下文补出“他们”，指前文及本句所说的仇敌
  alternative: 译作“你的脚在血中踩碎”，不补宾语
  rationale: תִּמְחַץ通常作及物动词，而宾语在诗句中省略；中文补出“他们”可避免误解，脚注注明原文未明说。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“踩碎”与“在血中”保留诗句强烈的战争意象；末句避免直接补成“舔血”或“吃肉”，以保存希伯来文结尾真实的含混和省略。
