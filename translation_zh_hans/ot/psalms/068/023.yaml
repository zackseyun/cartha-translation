lexical_decisions:
- source_word: לְמַעַן
  choice: 好使
  rationale: 引出目的或结果；“好使”既保留目的意味，也适合本节诗歌语气。
- source_word: תִּמְחַץ
  choice: 踩碎
  rationale: מחץ表示击碎、压碎；主语是“你的脚”，因此“踩碎”在中文中自然，并保留强烈的战场意象。
- source_word: רַגְלְךָ
  choice: 你的脚
  rationale: 原文为单数，照原文保留，不改成复数“你的双脚”。
- source_word: בְּדָם
  choice: 在血中
