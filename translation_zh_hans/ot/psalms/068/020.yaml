  yaml_path: translation/ot/psalms/068/020.yaml
  text: God is to us a God of salvations[b][a], and to the Lord GOD belong escapes from death.
translation:
  language: zh_hans
  text: 神是为我们成就种种拯救的神[a]；脱离死亡的种种出路，都属于雅威—主[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “种种拯救”也可译作“多次搭救”或“多样的拯救”。希伯来文在此使用复数，可能强调反复或多方面的拯救。
    reason: lexical_alternative
  - marker: b
    text: “出路”直译为“出去之处”或“出口”；这里指脱离死亡的途径。原文称“雅威—主”，同时使用神名和“主”的称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל ... אֵל
  choice: 神……神
  rationale: 保留原文两次出现的 אֵל 及其强调结构：这位神对我们而言，是施行拯救的神。
- source_word: לָנוּ
  choice: 为我们
  rationale: 这里的 ל 表示关系和惠益；“为我们”在现代汉语中自然地表达神对其子民施行拯救。
- source_word: לְמוֹשָׁעוֹת
  choice: 施行种种拯救
  rationale: מוֹשָׁעוֹת 是复数，指多次或多方面的救助；“种种拯救”保留复数意味，“施行”则使“拯救的神”在汉语中清楚自然。
- source_word: וְלֵיהוָה אֲדֹנָי
  choice: 主耶和华
  rationale: 原文同时有神名 יהוה 和称号 אֲדֹנָי；“主耶和华”在简体中文圣经语体中能简洁保留两项。
- source_word: לַמָּוֶת תּוֹצָאוֹת
  choice: 脱离死亡的种种出路
  rationale: תּוֹצָאוֹת 字面指“出去之处、出口”，在与“死亡”连用时表达从死亡中出去或逃脱的途径；“种种”也体现其复数形式。
theological_decisions:
- issue: “拯救”的复数所表达的范围
  choice: 种种拯救
  alternative: 救恩
  rationale: 原文使用复数，可能强调神反复或以多种方式施救；不把它收窄为单一、专门化的神学概念。
- issue: לַמָּוֶת תּוֹצָאוֹת 的关系
  choice: 脱离死亡的种种出路
  alternative: 死亡的出口／关乎死亡的结局
  rationale: 上下文以神为拯救者，最自然的语义是逃离死亡；但脚注保留名词“出口”和介词结构较为直译的可能性。
- issue: יהוה 与 אֲדֹנָי 连用时的译法
  choice: 主耶和华
  alternative: 耶和华—主
  rationale: 既保留神名，也保留“主”的称号；不用两个相同的“主”造成含混。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体汉语。保留“神……神”的重复、两个复数所带来的丰富意味，以及“出路”这一空间隐喻；分号对应原文两行平行结构。
