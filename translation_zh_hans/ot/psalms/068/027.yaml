  text: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
translation:
  language: zh_hans
  text: '那里有年幼的便雅悯，率领他们[a]；

    有犹大的首领，连同他们的一群人[b]；

    有西布伦的首领，

    有拿弗他利的首领。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“管辖他们”或“统治他们”。这个希伯来语分词可能表示治理或居先；正文按本节行列的语境译作“率领他们”。
    reason: lexical_alternative
  - marker: b
    text: 或译“在他们的群众中”、“他们的同伴”或“他们的众人”。这里的希伯来语词十分罕见，确切含义不明，大致指与犹大首领相关的一群人。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: 在那里，有
  rationale: 这是表示地点或指示的副词，意为“在那里”。加上“有”可自然引出行列中出现的各支派，同时保留其指示作用。
- source_word: בִּנְיָמִן
  choice: 便雅悯
  rationale: 采用现代中文圣经传统中通行的支派名称。
- source_word: צָעִיר
  choice: 小小的
  rationale: 该词可指“小、年幼、最小”。这里更可能强调便雅悯支派规模或地位较小，而非年龄；“小小的”保留诗歌的简洁和亲切语气。
- source_word: רֹדֵם
  choice: 率领他们
  rationale: 这是带第三人称复数宾语后缀的分词，通常涉及统治、管辖或居先。在礼仪行列的语境中，“率领他们”较为自然，同时将“统治他们”的词义可能保留在脚注中。
- source_word: שָׂרֵי
  choice: 首领
  rationale: 该词指官长、领袖或贵族。中文“首领”既能表达地位，又适合支派代表的语境，避免“王子”可能造成的血统误解。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的支派名称。
- source_word: רִגְמָתָם
  choice: 成群的
  rationale: 这是罕见而含义不完全确定的词，大致指聚集的一群、一队或众人。“成群的”简洁呈现犹大首领结队出现的画面；其他可能译法列入脚注。
- source_word: זְבֻלוּן
  choice: 西布伦
  rationale: 采用现代中文圣经传统中通行的支派名称。
- source_word: נַפְתָּלִי
  choice: 拿弗他利
  rationale: 采用现代中文圣经传统中通行的支派名称。
