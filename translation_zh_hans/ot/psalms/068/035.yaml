  text: נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽ/מִּקְדָּ֫שֶׁ֥י/ךָ אֵ֤ל יִשְׂרָאֵ֗ל ה֤וּא נֹתֵ֨ן עֹ֖ז וְ/תַעֲצֻמ֥וֹת לָ/עָ֗ם בָּר֥וּךְ אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/035.yaml
  text: Awesome is God from your sanctuaries; the God of Israel—he gives strength and mighty power to the people[a]. Blessed be God!
translation:
  language: zh_hans
  text: 上帝从你的众圣所[a]显为可畏；以色列的上帝，他赐力量和大能给百姓。上帝当受颂赞！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“圣所”为复数，可直译作“从你的众圣所”。这复数也可能以庄严或集合的方式指上帝的圣所；另可译作“从你的圣所”或“在你的圣所中”。
    reason: 保留原文复数形式及介词含义的真实歧义。
lexical_decisions:
- source_word: נוֹרָא
  choice: 彰显出令人敬畏的威严
  rationale: 该词表示使人敬畏、畏惧的特质。此译法用自然的现代汉语表达上帝震慑人心的威严，避免把它弱化为一般的“奇妙”，也避免“可怕”可能造成的负面误解。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为复数形态，却指以色列所敬拜的独一上帝，故用单数称谓“上帝”。
- source_word: מִמִּקְדָּשֶׁיךָ
  choice: 从你的众圣所
  rationale: 原文由介词“从”、复数名词“圣所”及第二人称阳性单数后缀组成。正文保留“从”和复数形式，不擅自改为单数；汉语用“众圣所”清楚标示复数。
- source_word: אֵל יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 这是同位语，进一步说明前面所称的上帝是谁；“以色列的上帝”符合现代汉语表达。
- source_word: הוּא
  choice: 上帝
  rationale: 原文显式使用第三人称代词以加强指称。汉语若直译为“他”容易出现指代停顿，重复“上帝”既自然，也在一定程度上保留强调。
- source_word: נֹתֵן
  choice: 赐
  rationale: 分词表示上帝一贯或特有的行动。“赐”比“给”更符合颂歌语体，又不显古奥。
- source_word: עֹז
  choice: 力量
  rationale: 该词常指力量、能力或刚强；“力量”准确且能与后面的“大能”区分。
- source_word: וְתַעֲצֻמוֹת
  choice: 和大能
  rationale: 该复数名词表达强盛的能力或极大的力量。“大能”保留其强化意味，并避免与前面的“力量”完全合并。
- source_word: לָעָם
  choice: 给百姓
  rationale: 原文只说“给这百姓/给百姓”，没有明说“他的”；正文不添加所有关系。
- source_word: בָּרוּךְ
  choice: 当受颂赞
  rationale: 这是颂赞上帝的固定祝颂语。“当受颂赞”在现代中文宗教诗歌语境中庄重自然，也保留感叹性质。
theological_decisions:
- issue: “圣所”的数与介词含义
  choice: 从你的众圣所
  alternative: 从你的圣所；在你的圣所中
  rationale: 马所拉文本的名词在形态上是复数，介词通常表示“从”。正文据此保留复数和来源义，不把它无声地解释成单数圣殿或处所义；较符合习惯或传统的单数及“在……中”读法列入脚注。
- issue: 上帝“令人敬畏”与“从圣所”的句法关系
  choice: 从你的众圣所彰显出令人敬畏的威严
  alternative: 上帝从你的众圣所而来，令人敬畏；上帝在你的众圣所中令人敬畏
  rationale: 原文是省略系词的诗歌短句，介词短语究竟表示来源还是处所，句法上存在张力。正文保留“从”的基本意义，以“彰显”使汉语成句，但不明确断定上帝是在移动“而来”；脚注说明其他可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“众圣所”略带书面色彩，但为准确保留希伯来语复数所必需；“力量和大能”保持两个近义词的并列与递进。
