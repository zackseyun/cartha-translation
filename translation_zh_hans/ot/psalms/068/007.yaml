  yaml_path: translation/ot/psalms/068/007.yaml
  text: God[a], when you went out before your people, when you marched through the wilderness—Selah
translation:
  language: zh_hans
  text: 神啊，当你在你百姓前面出发、在荒野[a]中行进时——细拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“荒漠”或“荒凉之地”。希伯来语所指的是荒凉的旷野地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 句首的“神”在上下文中是直接称呼；现代汉语用“啊”自然标明呼语，但不增加称谓或神学内涵。
- source_word: בְּצֵאתְךָ
  choice: 你……出发时
  rationale: 介词 בְּ 加带第二人称阳性单数后缀的不定式在此表示时间；“出发”保留 יצא 的外出、启程之意，也符合神走在百姓前面的语境。
- source_word: לִפְנֵי עַמֶּךָ
  choice: 在你百姓前面
  rationale: 直译 לִפְנֵי 的空间关系，保留神在百姓前方带领的图景。
- source_word: בְּצַעְדְּךָ
  choice: 行进时
  rationale: צעד 表示迈步或行进；“行进”兼顾庄重和自然，并与前句的“出发”形成平行。
- source_word: בִישִׁימוֹן
  choice: 在荒野
  rationale: יְשִׁימוֹן 指荒凉、无人烟的旷野或荒漠地带；介词 בְּ 本身可表处所，译作“在”避免强行确定移动所经的方向关系。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词的确切含义不明，可能是礼仪或音乐用语，因此按传统音译保留，不作确定性解释。
theological_decisions:
- issue: 神在百姓荒野行程中的行动
  choice: 译为对神的直接称呼，追忆他走在自己百姓前面。
  alternative: 将句首理解为较偏叙述性的“神”，不显明呼语语气。
  rationale: 第二人称后缀和诗篇上下文支持直接称呼；译文保留神引领百姓的历史图景，但不补入经文未明说的具体事件或教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“神啊”体现直接呼语；两个“时”构成平行句式。破折号将正文与含义未定的礼仪或音乐标记“细拉”区分开。
