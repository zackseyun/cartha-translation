  text: God rises up; his enemies are scattered[a], and those who hate him flee from before him.
translation:
  language: zh_hans
  text: 上帝兴起，他的仇敌四散[a]；恨他的人从他面前逃跑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按传统的祈愿式译法：“愿上帝兴起；愿他的仇敌四散，愿恨他的人从他面前逃跑。”
    reason: alternative_reading
lexical_decisions:
- source_word: יָקוּם
  choice: 起来
  rationale: קום的Qal未完成式第三人称阳性单数。诗歌语境中既可作生动的陈述，也可带祈愿意味；正文用“起来”保留动作意象，并以脚注保存祈愿式理解。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该词虽为复数形态，此处却与单数动词搭配，明确指以色列的上帝，因此译为单数“上帝”。
- source_word: יָפוּצוּ
  choice: 四散
  rationale: פוץ的Qal未完成式复数，表示仇敌分散、溃散；“四散”简洁自然，也符合诗歌中的军事图景。
- source_word: אֹיְבָיו
  choice: 他的仇敌
  rationale: 带第三人称阳性单数后缀的构造形式，直译为“他的仇敌”。
- source_word: וְיָנוּסוּ
  choice: 就……逃跑
  rationale: נוס的Qal未完成式复数，表示逃离；“逃跑”是现代汉语中清楚自然的表达。“就”使三个并列未完成式在陈述读法下的结果关系流畅。
- source_word: מְשַׂנְאָיו
  choice: 恨他的人
  rationale: 分词作名词用，带第三人称阳性单数后缀；译作“恨他的人”保留其主动的言语力量。
- source_word: מִפָּנָיו
  choice: 从他面前
  rationale: 字面为“从他的面／面前”，兼有离开其临在之意；“从他面前”既保留希伯来语的具体意象，又符合现代汉语。
theological_decisions:
- issue: 诗歌及军事性神显语境中开头几个未完成式的语气
  choice: 正文采用生动陈述式：“上帝起来，他的仇敌就四散……”
  alternative: 祈愿式：“愿上帝起来；愿他的仇敌四散，愿恨他的人从他面前逃跑。”
  rationale: 这些希伯来语未完成式既可理解为生动的陈述，也可在诗歌中表达愿望。正文不把它们处理成明确命令，而采用生动陈述；脚注保留传统的祈愿式译法，以呈现原文真实的语气张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“仇敌”保留诗篇的庄严语体，“四散”和“逃跑”则清楚自然。分号呈现后两分句的平行关系。
