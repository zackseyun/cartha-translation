source:
  edition: WLC
  text: תְּנ֥וּ עֹ֗ז לֵֽ/אלֹ֫הִ֥ים עַֽל יִשְׂרָאֵ֥ל גַּאֲוָת֑/וֹ וְ֝/עֻזּ֗/וֹ בַּ/שְּׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/034.yaml
  text: Ascribe strength to God[a]; his majesty is over Israel[b], and his strength is in the skies.
translation:
  language: zh_hans
  text: 要把力量归给上帝[a]！他的威荣在以色列之上，他的力量在高天之中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“要把力量给上帝”；这里是呼吁人承认并宣告力量属于上帝。
    reason: lexical_alternative
  - marker: b
    text: “高天”也可译作“云天”或“天空”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: 要……归给
  rationale: נתן的字面义是“给”，但在此诗歌劝勉中，与“力量”和“上帝”连用，意为承认并宣告力量属于上帝。“归给”既保留原文“给”的意象，也避免让人误以为人能为上帝增添力量。
- source_word: עֹז / עֻזּוֹ
  choice: 力量 / 他的力量
  rationale: עֹז表示力量、能力或威力。前后统一译作“力量”，以保留首尾呼应。
- source_word: לֵאלֹהִים
  choice: 给上帝
  rationale: 介词ל标示动作所指向的对象；与“归”组合成自然的现代汉语表达“归给上帝”。
- source_word: עַל יִשְׂרָאֵל
  choice: 在以色列之上
  rationale: עַל在此最自然地表达威荣彰显、覆盖或居于以色列之上；直译式表达也保留原诗的空间意象及潜在含义。
- source_word: גַּאֲוָתוֹ
  choice: 他的威荣
  rationale: גַּאֲוָה可指高昂、威严、荣美，也可在负面语境指骄傲。用于赞美上帝时，“威荣”兼顾崇高与荣耀的正面意义。
- source_word: בַּשְּׁחָקִים
  choice: 在高天之中
  rationale: שְׁחָקִים是诗体词，可指高空、天空或云层。“高天”自然庄重，并保留宇宙性的崇高意象；脚注列出“云天”的可能译法。
theological_decisions:
- issue: 命令语是否表示人把上帝原本没有的力量给予他
  choice: 译为“要把力量归给上帝”
  alternative: “要把力量给上帝”
  rationale: 原文使用“给”，但诗歌语用是在呼吁敬拜者承认、宣告力量属于上帝，而不是暗示上帝缺少力量、需要人补足。
- issue: גַּאֲוָתוֹ עַל יִשְׂרָאֵל所表达的关系
  choice: 保留为“他的威荣在以色列之上”
  alternative: “他的威荣临到以色列”或“他的威荣关乎以色列”
  rationale: 介词עַל容许空间、统摄或临到等语感；正文保留“在……之上”的空间关系，不把它进一步解释为护佑、统治或赐予。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“威荣”比“威严”更能兼顾גַּאֲוָה的崇高与荣耀；“高天之中”保留希伯来诗歌的高空意象。所有脚注标记均已置于正文。
