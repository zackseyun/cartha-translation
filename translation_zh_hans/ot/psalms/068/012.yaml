  yaml_path: translation/ot/psalms/068/012.yaml
  text: Kings of armies flee[a], they flee, and the woman at home divides the spoil.
translation:
  language: zh_hans
  text: 诸王和他们的军队逃跑，逃跑；家中的妇人[a]分配战利品。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“家中的主妇”，也可理解为“住在家中的女子”。希伯来语为阴性单数，很可能描绘留在家中的妇人领取并分配战争中夺得的财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי צְבָאוֹת
  choice: 统率军队的众王
  rationale: מַלְכֵי是“王”的复数构造形式，צְבָאוֹת在这里指军队。译文表达这些王与军队的军事关系，同时避免把该短语误读为神圣称号。
- source_word: יִדֹּדוּן יִדֹּדוּן
  choice: 逃跑，逃跑
  rationale: נדד在此表示逃离；原文重复同一动词以加强诗歌力度，因此中文也保留重复，不把它合并成一个加强语。
- source_word: וּנְוַת בַּיִת
  choice: 居家的妇人
  rationale: 该短语为阴性单数，描绘留在家中的女性。“居家的妇人”保留其性别与单数意象，也较符合现代汉语。
- source_word: תְּחַלֵּק
  choice: 分配
  rationale: 该词的Piel词形表示划分、分派或分发；“分配”清楚呈现对战利品进行分派的动作。
- source_word: שָׁלָל
  choice: 战利品
  rationale: 该词指战争中夺得的财物；“战利品”是现代汉语中自然、明确的对应表达。
