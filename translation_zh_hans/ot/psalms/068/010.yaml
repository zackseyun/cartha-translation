  text: חַיָּתְ/ךָ֥ יָֽשְׁבוּ בָ֑/הּ תָּ֤כִ֥ין בְּ/טוֹבָתְ/ךָ֖ לֶ/עָנִ֣י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/010.yaml
  text: Your creatures settled in it; in your goodness[a], O God, you provided for the poor.
translation:
  language: zh_hans
  text: '你的生灵[a]住在其中；

    神啊，你本着你的美善，为困苦人预备。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生灵”所译的希伯来语在这里含义难定，也可译作“你的活物”“你的群体”“你的会众”或“你的羊群”。
    reason: alternative_reading
lexical_decisions:
- source_word: חַיָּתְךָ
  choice: 你的生灵
  rationale: חַיָּה本指活物、动物，此处带第二人称单数属格，并可能作为集合名词指属于神的群体。“生灵”保留其有生命之物的基本含义和诗体色彩，又不把所指过早限定为“羊群”或“会众”。
- source_word: יָשְׁבוּ בָהּ
  choice: 住在其中
  rationale: יָשַׁב可指坐下、居住或定居；这里表达在上文所说之地安居。“其中”承接阴性后缀所指的上文之地，中文自然且不过度强化迁居过程。
- source_word: תָּכִין
  choice: 预备
  rationale: כון的使役形常指使稳固、备妥或预备。希伯来文没有明说所预备的宾语，因此中文也保留省略，避免擅自补成“供应”或“所需”。
- source_word: בְּטוֹבָתְךָ
  choice: 本着你的美善
  rationale: טוֹבָה可指美善、恩惠或丰盛；“本着你的美善”既表达介词ב所示的依据，也保留这是神之美善或恩泽的双重可能。
- source_word: לֶעָנִי
  choice: 为困苦人
  rationale: עָנִי可指贫穷、受苦或受压的人。“困苦人”比单指经济贫困的“穷人”更能涵盖其语义范围，并切合诗篇语境。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 句末的אֱלֹהִים在此作直接呼语；中文前置为“神啊”，使呼告关系清楚并符合现代汉语诗体表达。
theological_decisions:
- issue: חַיָּתְךָ在本节艰深诗句中的所指
  choice: 译作集合意义较开放的“你的生灵”
  alternative: 你的活物；你的群体；你的会众；你的羊群
  rationale: 该词可以按字面指属于神的活物，也可能在上下文中集合性地指神所聚集、安置的百姓。正文采用“生灵”以保留活物这一词源意义及集合性空间，不将其明确教会化或单一解释为牧群；主要解释选项列入脚注。
translation_notes:
  register: 采用现代、庄重而简洁的诗体汉语。“住在其中”与上文地点衔接；第二行保留原文“预备”之后宾语省略的凝练表达。脚注标记紧随真正存在词义难点的“生灵”，而非置于“美善”之后。
