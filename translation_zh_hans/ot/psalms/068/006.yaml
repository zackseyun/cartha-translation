base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/006.yaml
  text: God settles the solitary in a home; he brings out prisoners into prosperity[a], but the rebellious dwell in a parched land.
translation:
  language: zh_hans
  text: 上帝使孤身的人安居在家中；他领被囚的人出来，使他们得享丰足[a]；但悖逆的人住在干旱之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“进入丰裕之境”或“进入顺遂”；这个罕见的希伯来词也被一些人理解为“伴着欢唱”，或与喜乐地获释有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指以色列的上帝；后续分词所表达的动作要求按单数理解。
- source_word: מוֹשִׁיב
  choice: 使……安居
  rationale: 使役式分词表示使人居住、安顿；“使……安居”既保留使役意义，也符合现代汉语表达。
- source_word: יְחִידִים
  choice: 孤单的人
  rationale: 指独自、孤立无依的人；此译不把词义局限为纯粹的主观孤独感。
- source_word: בַּיְתָה
  choice: 家中
  rationale: בַּיִת 可指房屋或家庭；“家中”兼具居所和归属感，同时不擅自限定为血缘家庭。
- source_word: מוֹצִיא
  choice: 领……出来
  rationale: 使役式分词意为使之出去；“领……出来”自然地表达上帝使被囚者脱离囚禁。
- source_word: אֲסִירִים
  choice: 被囚的人
  rationale: 指受捆绑或监禁者；“被囚的人”清楚且贴近原词。
- source_word: בַּכּוֹשָׁרוֹת
  choice: 进入丰足
  rationale: 这是罕见且释义不确定的词形，可能与兴盛、丰裕或顺遂有关，也有人理解为伴着歌唱；正文采用符合正面平行关系的“进入丰足”，脚注保留歧义。
- source_word: אַךְ
  choice: 但……却
  rationale: 在此构成鲜明转折，对比上帝对困苦者的眷顾与悖逆者的处境。
- source_word: סוֹרֲרִים
  choice: 悖逆的人
  rationale: 分词表示顽梗抵抗、背逆的人；“悖逆”保留其道德与关系层面的含义。
- source_word: שָׁכְנוּ
  choice: 住
  rationale: 虽为完成式，在诗歌中可表达一般性的事实；现代汉语用“住”简洁自然。
- source_word: צְחִיחָה
  choice: 干旱之地
  rationale: 该词指干燥、焦旱之处；“干旱之地”保留与“家中”和“丰足”的诗意反差。
theological_decisions:
- issue: 上帝如何对待孤单的人
  choice: 上帝使孤单无依的人在家中安居，获得居所与归属。
  alternative: 上帝使孤独的人进入家庭。
  rationale: 原文明确使用“孤单的人”和“家／房屋”，并未明确说“家庭”或限定为血缘关系；译作“安居家中”保留原文意象及其开放性。
- issue: 被囚者获释后的处境
  choice: 进入丰足
  alternative: 在欢唱中出来／进入顺遂
  rationale: בַּכּוֹשָׁרוֹת 是罕见词，词源与确切含义存在争议。正文采用较可能且与上下文相称的“丰足”，但不在正文中消除其他可能，故以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现三部分诗句的平行与转折；“安居家中”兼顾使役语义和归属意象；对罕见词的真实不确定性以脚注保留。
