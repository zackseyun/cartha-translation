  text: 交给乐长[a]。大卫的[b]诗篇，一首歌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乐长”也可译作“音乐主管”“音乐指挥”或“伶长”。
    reason: lexical_alternative
  - marker: b
    text: “大卫的”也可理解为“大卫所作”“献给大卫”或“与大卫有关”；诗篇标题中的希伯来语介词可表示作者、归属、献呈或关联。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐长
  rationale: 该词在诗篇标题中通常指负责统筹音乐演唱的人。“圣乐长”简洁、庄重，也清楚体现其礼仪音乐职分；用“交给”表达前缀 לַ 的指向含义。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 标题中的介词 לְ 含义较宽，可表示作者、归属、献给或关联。“大卫的”在中文中自然，同时比“大卫所作”更能保留原文的多义性。
- source_word: מִזְמוֹר
  choice: 诗篇
  rationale: 这是诗篇标题中常见的体裁名称，通常指配合乐器演唱的诗歌。“诗篇”是中文读者熟悉而自然的对应词。
- source_word: שִׁיר
  choice: 一首歌
  rationale: 直接表达“歌”的含义，并保留原文将“诗篇”和“歌”两个体裁称谓并列使用的特点，不将二者合并。
theological_decisions:
- issue: לְדָוִד 是否明确表示大卫是作者
  choice: 译为“大卫的”，不明确限定为作者
  alternative: 大卫所作
  rationale: 介词 לְ 在诗篇标题中可表示作者、归属、献给或关联；原文没有排除这些可能，因此译文不宜把作者身份定死。
translation_notes:
  register: 采用简洁庄重的现代汉语诗篇标题体。“交给圣乐长”保留标题的礼仪音乐语境；“大卫的诗篇，一首歌”既自然，又保留原文两个体裁词的并列及 לְדָוִד 的语义开放性。
