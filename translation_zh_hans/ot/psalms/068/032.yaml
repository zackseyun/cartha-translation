  text: Kingdoms of the earth[a], sing to God; sing praises to the Lord—Selah
translation:
  language: zh_hans
  text: 世上的列国啊，要歌颂上帝；要向主唱诗赞美。细拉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细拉”是诗篇中的礼仪或音乐术语，确切含义不详。
