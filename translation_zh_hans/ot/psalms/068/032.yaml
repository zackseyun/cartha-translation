lexical_decisions:
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: 世上的列国
  rationale: 该组合指全地各政治国度；“世上的列国”既体现普世范围，也比“地上的王国”更符合现代汉语呼语习惯。
- source_word: שִׁירוּ
  choice: 要歌颂
  rationale: 复数命令式，号召列国以歌声赞美；“歌颂”自然表达向上帝歌唱的敬拜含义。
- source_word: לֵאלֹהִים
  choice: 上帝
  rationale: 介词 ל 指明歌唱的对象；汉语“歌颂上帝”已自然包含“向”的关系，无须逐字补出。
- source_word: זַמְּרוּ
  choice: 要……唱诗赞美
  rationale: זמר 的加强语干命令式表示以歌唱或音乐献上赞美；“唱诗赞美”保留音乐性和敬拜语境。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神圣称号 אֲדֹנָי，并非四字神名；译作“主”可保持这一区别。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该礼仪或音乐术语的确切功能不明，因此按传统音译，不武断解释。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 耶和华
  rationale: 本节读作 אֲדֹנָי，而不是 יהוה；译作“主”忠实保留称号与神名之间的文本区别。
- issue: 列国是否为直接受命者
  choice: 用呼语“列国啊”直接向各国发出命令
  alternative: 将其理解为关于各国的陈述
  rationale: מַמְלְכוֹת הָאָרֶץ 位于两个复数命令式之前，最自然地充当呼语，表达对普世列国的召唤。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜用语。“世上的列国啊”清楚呈现呼语；两个“要”保留原文平行的命令语气。分号对应两项平行召唤，末句保留传统音译“细拉”。
