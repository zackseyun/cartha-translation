  text: גֶּ֣שֶׁם נְ֭דָבוֹת תָּנִ֣יף אֱלֹהִ֑ים נַחֲלָתְ/ךָ֥ וְ֝/נִלְאָ֗ה אַתָּ֥ה כֽוֹנַנְתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/009.yaml
  text: You sent abundant rain[a], O God; when your inheritance was weary[b], you established it.
translation:
  language: zh_hans
  text: 上帝啊，你降下丰沛的雨水[a]；你的基业[b]疲乏时，你使它稳固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“丰厚的雨”或“慷慨赐下的雨”；希伯来语这一表达强调上帝丰盛慷慨的供应。
    reason: lexical_alternative
  - marker: b
    text: “你的基业”可能指上帝的百姓、土地，或在诗歌表达中兼指二者。
    reason: alternative_reading
lexical_decisions:
- source_word: גֶּשֶׁם נְדָבוֹת
  choice: 丰沛的雨水
  rationale: גֶּשֶׁם意为“雨”，נְדָבוֹת本与甘心、慷慨奉献相关；二词连用描写上帝慷慨而丰盛的供应。“丰沛的雨水”在现代汉语中自然，也保留了充足、厚赐的意味。
- source_word: תָּנִיף
  choice: 你降下
  rationale: 这是נוּף的使役式未完成态，在雨水语境中表示使雨落下。“降下”准确表达上帝主动赐雨，同时比直译“挥动、摇出”自然。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处是直接呼告；“上帝啊”保留诗歌的祷告语气，并符合现代庄重汉语。
- source_word: נַחֲלָתְךָ
  choice: 你的产业
  rationale: 该词可指承受或分得之物，并可诗意地涵盖上帝的百姓、土地，或二者。“产业”不将所指限定为其中之一。
- source_word: וְנִלְאָה
  choice: 疲乏时
  rationale: 阴性单数形式与“产业”呼应，表示疲惫、衰弱或困乏。用“时”自然表达上下文中的时间关系，但不改变其状态含义。
- source_word: כּוֹנַנְתָּהּ
  choice: 你使它稳固
  rationale: כּוּן的加强式可表示建立、坚固、安定；阴性宾语后缀指回“产业”。“使它稳固”既适用于土地，也适用于百姓，保留诗句的开放性。
theological_decisions:
- issue: “你的产业”所指为何
  choice: 保留“你的产业”，不明确限定为土地或百姓
  alternative: 译为“以色列地”或“以色列民”
  rationale: 希伯来诗句容许这一盟约性称谓同时联想到上帝的百姓和所赐之地；不作限定可保存原文的诗意压缩与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“降下丰沛的雨水”自然表达上帝主动且丰盛的供应；“产业”和“使它稳固”有意保留原文对土地与百姓两种指向的可能。
