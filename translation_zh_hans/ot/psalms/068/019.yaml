  yaml_path: translation/ot/psalms/068/019.yaml
  text: Blessed be the Lord[a], who day by day bears us up—God is our salvation. Selah
translation:
  language: zh_hans
  text: 愿主受颂赞！他天天托住我们[a]；神是我们的拯救。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他天天为我们担负。”传统译法作：“他天天把福分加给我们。”希伯来文动词有“装载、负载、背负”的意思，但这里没有明说所负载或背负的对象。
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 愿……受颂赞
  rationale: 这是颂赞公式中的被动分词；用“愿主受颂赞”既保留颂赞语气，也符合现代汉语的庄重表达。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是对神的称号；译作“主”简明自然，并保留其主权含义。
- source_word: יוֹם יוֹם
  choice: 天天
  rationale: 原文重复“日、日”，具有逐日、持续之意；“天天”自然地保留这种分配性强调。
- source_word: יַעֲמָס לָנוּ
  choice: 为我们背负重担
  rationale: עמס的基本意象是装载、负载或背负；原句没有明说所背负的宾语。“为我们背负重担”保留承载意象，同时借脚注说明句法上的歧义。
- source_word: הָאֵל
  choice: 神
  rationale: 此处是常见的神圣称谓；译作“神”最符合现代汉语。
- source_word: יְשׁוּעָתֵנוּ
  choice: 我们的拯救
  rationale: 该词涵盖救助、解救和得救；“我们的拯救”保留原文较宽的神学含义，也表达神本身是其子民的救恩。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切含义不明，沿用传统音译，避免作无把握的解释性翻译。
theological_decisions:
- issue: 压缩短语 יַעֲמָס לָנוּ 的解释
  choice: 神天天为我们背负重担
  alternative: 神天天托住我们；神天天把福分加给我们
  rationale: 动词明确涉及装载或承载，但宾语未明说。“背负重担”呈现神持续扶持其子民的图像，又不采用原文没有的“福分”；脚注保留其他真实可能的读法。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞体。“愿主受颂赞”体现祝颂公式；分号保留两小句之间紧密而未完全明说的关系。脚注标记置于歧义短语之后。
