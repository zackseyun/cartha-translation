  text: עָ֘לִ֤יתָ לַ/מָּר֨וֹם שָׁ֘בִ֤יתָ שֶּׁ֗בִי לָקַ֣חְתָּ מַ֭תָּנוֹת בָּ/אָדָ֑ם וְ/אַ֥ף ס֝וֹרְרִ֗ים לִ/שְׁכֹּ֤ן יָ֬הּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/018.yaml
  text: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
translation:
  language: zh_hans
  text: '你升上高处，掳了俘虏；


    你在人中接受了礼物[a]，


    甚至在悖逆者中间，


    好让雅威上帝住在那里。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在人中”或译“从人那里”。这里的希伯来语介词既可表示范围，也可能表示来源。
    reason: lexical_alternative
  - marker: b
    text: 本句也可理解为“好让雅威上帝住在他们中间”或“作为雅威上帝的居所”。希伯来语末句十分凝练，可有不同的句法理解。
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ לַמָּרוֹם
  choice: 你升上高处
  rationale: “升上”准确表达עלה的向上运动；“高处”保留מרום既可指高度、也可指崇高之地的空间意象，不进一步限定具体地点。
- source_word: שָׁבִיתָ שֶּׁבִי
  choice: 掳了俘虏
  rationale: 用同根意义相近的“掳—俘虏”再现希伯来语同源宾语结构的简洁和凯旋语气，同时避免增添“仇敌”等原文没有的成分。
- source_word: לָקַחְתָּ מַתָּנוֹת
  choice: 接受了礼物
  rationale: לקח基本义为“拿、取”，与“礼物”搭配时可自然理解为接受进献；“接受礼物”比“拿了礼物”更符合现代汉语，又不将礼物明确解释为贡物。
- source_word: בָּאָדָם
  choice: 在人中
  rationale: אָדָם在此泛指人类；介词ב可表范围，也可能表来源。正文采用较少解释性的“在人中”，并在脚注保留“从人那里”。
- source_word: וְאַף סוֹרְרִים
  choice: 连悖逆的人也包括在内
  rationale: וְאַף带有递进强调；סוֹרְרִים指抗拒、悖逆的人。此译使压缩的希伯来诗句在现代汉语中清楚可读，同时不把这些人明确设定为礼物的给予者。
- source_word: לִשְׁכֹּן
  choice: 使……住在那里
  rationale: 带ל的动词不定式在语境中可表达目的或结果。“使……住在那里”呈现这一可能关系，并以“那里”补足汉语所需成分；原文的省略与其他可能句法分析列入脚注。
- source_word: יָהּ אֱלֹהִים
  choice: 耶和华上帝
  rationale: יָהּ是神名的短式，与אֱלֹהִים并列。“耶和华上帝”采用现代中文读者熟悉且庄重的神名表达；不把两词改写成带额外解释的称号。
theological_decisions:
- issue: 礼物短语中בָּאָדָם的方向与含义
  choice: 在人中
  alternative: 从人那里
  rationale: 介词ב在这里既可能表示所在范围，也可能被理解为来源。正文不武断指定礼物由人献上，脚注则保留来源义，以呈现原文及其接受史中的真实歧义。
- issue: 末句לִשְׁכֹּן יָהּ אֱלֹהִים的句法和居住对象
  choice: 使耶和华上帝住在那里
  alternative: 使耶和华上帝住在他们中间；作为耶和华上帝的居所
  rationale: 希伯来语末句高度凝练，没有明说居住地点或介词短语所指。“在那里”提供自然汉语所需的最低限度补足，而不明确断定是高处、人群或悖逆者；其他主要理解保留于脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并保留诗行的紧凑节奏。“掳了俘虏”有意保留原文同源宾语的修辞力度；“连悖逆的人也包括在内”则适度展开压缩结构，以避免现代读者误解其句法关系。所有解释性补足均保持最低限度，关键歧义以脚注呈现。
