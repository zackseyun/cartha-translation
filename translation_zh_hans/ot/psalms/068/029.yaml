  text: מֵֽ֭/הֵיכָלֶ/ךָ עַל יְרוּשָׁלִָ֑ם לְ/ךָ֤ יוֹבִ֖ילוּ מְלָכִ֣ים שָֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/029.yaml
  text: From your temple above Jerusalem[c][b][a], kings will bring tribute to you.
translation:
  language: zh_hans
  text: 从你那座耸立在耶路撒冷之上的殿中[a]，君王必向你献上贡礼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“因你在耶路撒冷的殿，君王必向你献上贡礼。”原文“从你的殿”和“在耶路撒冷之上”的介词短语，其句法关系可有不同理解；“在耶路撒冷”也是一种较平顺的译法。
    reason: 保留מִן的因果理解，以及עַל的地点性理解。
  - marker: b
    text: “贡礼”也可译作“礼物”或“赠礼”。
    reason: שַׁי可指礼物、赠礼，亦可指献给尊者的贡物。
lexical_decisions:
- source_word: מֵהֵיכָלֶךָ
  choice: 因你……的殿
  rationale: מִן在这里既可理解为空间来源“从……”，也可理解为原因或缘由“因……”。结合“君王献礼”的整句关系，正文采用较自然的因果表达，同时用脚注保留空间性读法；הֵיכָל在本语境中译为“殿”。
- source_word: עַל יְרוּשָׁלִָם
  choice: 高踞耶路撒冷
  rationale: עַל基本含义为“在……上、凌驾于……之上”。“高踞”既保留圣殿位于高处的空间意象，也避免现代汉语“在耶路撒冷上面”可能引起的悬浮误解。
- source_word: לְךָ
  choice: 向你
  rationale: 该与格代词标明献礼的接受者；与“献上”搭配时，“向你”是自然准确的现代汉语。
- source_word: יוֹבִילוּ
  choice: 必……献上
  rationale: יבל的Hiphil词形可表示“带来、运来、引来”。以君王为主语、礼物为宾语时，“献上”自然传达带来并呈献给尊者的动作。
- source_word: מְלָכִים
  choice: 君王
  rationale: 该词明确指诸王；“君王”保留庄重的王权意象。
- source_word: שָׁי
  choice: 贡礼
  rationale: שַׁי可指礼物、赠礼，也常带向尊者进贡的含义。“贡礼”兼顾礼物和臣服致敬的政治色彩。
theological_decisions:
- issue: 圣殿短语与全句的句法关系
  choice: 正文将מִן理解为因果关系：“因你……的殿”。
  alternative: “从你那座高踞耶路撒冷的殿中，君王必向你献上贡礼。”
  rationale: 希伯来文容许因果和空间来源两种理解。正文采用在现代汉语中语义关系较清楚的因果读法，但脚注明示更贴近מִן基本空间义的另一译法，不把原文的句法张力悄然消除。
- issue: עַל所表达的圣殿与耶路撒冷的空间关系
  choice: 译作“高踞耶路撒冷”。
  alternative: “在耶路撒冷”或“位于耶路撒冷”。
  rationale: 这一表达保留עַל的“在……之上”意象，并以自然汉语呈现圣殿处于高地的空间关系，不加入额外的神学解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“高踞”保留原文空间意象而避免生硬直译；“贡礼”简洁呈现君王向上帝献礼的尊崇语气。
