  text: בְּֽ֭/מַקְהֵלוֹת בָּרְכ֣וּ אֱלֹהִ֑ים יְ֝הוָ֗ה מִ/מְּק֥וֹר יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/026.yaml
  text: In the assemblies[a], bless God, the Lord[b], from the fountain of Israel.
translation:
  language: zh_hans
  text: 在各会众中，要称颂上帝，就是雅威；你们这些出自以色列源头的人啊！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只作“从以色列的源头”，没有明说“人”，且句法省略。此处按对会众的呼语理解；也可较直译地理解为“在各会众中，要称颂上帝，就是雅威——从以色列的源头而来”，末语与前句的关系未明。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמַקְהֵלוֹת
  choice: 在众会中
  rationale: מַקְהֵלוֹת是复数，指聚集起来的群体或集会。“众会”保留复数含义，也避免赋予现代宗教组织色彩。
- source_word: בָּרְכוּ
  choice: 要称颂
  rationale: 这是复数祈使式；ברך以上帝为宾语时，表示在敬拜中称颂、颂赞他。“称颂”既保留该词的核心语义，也比直译“祝福上帝”更符合现代汉语习惯。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指独一的上帝，并与雅威这一神名并列同指。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文本直接音译四字神名，保留其专名性质，不以“主”这一称号代替。
- source_word: מִמְּקוֹר יִשְׂרָאֵל
  choice: 从以色列的源头而来的众人
  rationale: מָקוֹר本义为泉源、源头；此处表达省略，可能修饰受命称颂的人，指他们出自以色列的根源。正文以补出隐含对象的方式形成自然汉语，同时用脚注保留另一种句法理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。译作“雅威”能表明这是以色列上帝的专名；“主”会把专名改成称号，“耶和华”则是传统但较晚形成的混合读音。
- issue: מִמְּקוֹר יִשְׂרָאֵל所修饰的成分
  choice: 理解为呼语，指称颂者是从以色列源头而来的众人
  alternative: 理解为修饰称颂的动作：“要从以色列的源头称颂雅威”
  rationale: 希伯来语短语高度省略，两种理解均有可能。正文采用较易形成完整语义的呼语理解，但以脚注明示另一种读法，不消除原文的含混。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众会”体现原文复数；破折号呈现末句突出的诗性呼语，并保留希伯来语省略结构所带来的张力。
