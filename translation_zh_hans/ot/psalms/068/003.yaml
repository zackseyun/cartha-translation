    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַדִּיקִים
  choice: 但义人
  rationale: צַדִּיקִים指义人；前缀וְ本可译作“而／和”，但结合上一节恶人的结局，此处用“但”自然表达上下文的对比，同时以脚注保留其基本连接义。
- source_word: יִשְׂמְחוּ
  choice: 必欢喜
  rationale: שׂמח表示喜乐、欢喜。译作“欢喜”简明自然，并与后面的欢腾和加强语形成层次。
- source_word: יַעַלְצוּ
  choice: 必……欢腾
  rationale: עלץ表示强烈、洋溢的喜悦；“欢腾”能体现其兴高采烈的力度，又适合诗歌语体。
- source_word: לִפְנֵי אֱלֹהִים
  choice: 在上帝面前
  rationale: 原文直指“在上帝面前”，即处于上帝的临在中；直译既清楚又保留其空间和关系意象。
- source_word: וְיָשִׂישׂוּ
  choice: 必欢欢喜喜
  rationale: שׂוש表示欣喜、欢跃。结合随后的בְשִׂמְחָה，采用汉语叠词表达原文连续堆叠喜乐词汇的强化效果。
- source_word: בְשִׂמְחָה
  choice: 欢欢喜喜
  rationale: 该短语说明欢跃的方式并加强喜乐之情；融入“欢欢喜喜”比生硬的“以欢喜而欢喜”更符合现代汉语，同时保留强调。
