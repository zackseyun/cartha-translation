  text: But the righteous will be glad[a]; they will exult before God[b], and they will rejoice with gladness.
translation:
  language: zh_hans
  text: 但义人必欢喜[a]；他们必在上帝面前[b]欢腾，并欢喜快乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而义人必欢喜。”希伯来语连接词也可只表示“而”；正文译作“但”，是为了体现与上一节的对比。
    reason: alternative_reading
  - marker: b
