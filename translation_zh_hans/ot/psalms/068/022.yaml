  text: אָמַ֣ר אֲ֭דֹנָ/י מִ/בָּשָׁ֣ן אָשִׁ֑יב אָ֝שִׁ֗יב מִֽ/מְּצֻל֥וֹת יָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/022.yaml
  text: The Lord said[a], “I will bring them back from Bashan; I will bring them back from the depths of the sea,”
translation:
  language: zh_hans
  text: 主说：“我要从巴珊带回来[a]，我要从海的深处带回来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有说明要带回的是谁或什么，也可按上下文理解为“我要把他们从巴珊带回来”。
    reason: 说明希伯来文省略宾语，并保留其所指的含混性。
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是神的称号，不是神名יהוה；用现代中文圣经语体中自然、庄重的“主”来表达。
- source_word: אָמַר
  choice: 说
  rationale: 该完成式在这里直接引出神的言语，“说”简洁自然，不额外加入“宣告”等语气。
- source_word: מִבָּשָׁן
  choice: 从巴珊
  rationale: 介词מִן表示来源，译为“从”；地名בָּשָׁן按惯用音译作“巴珊”。
- source_word: אָשִׁיב ... אָשִׁיב
  choice: 我要……带回来……我要……带回来
  rationale: 使役词干在此有“使返回、带回”之意。中文可以自然地省略宾语，因此不必补出原文未明说的“他们”；同时保留动词的重复以传达强调。
- source_word: מִמְּצֻלוֹת יָם
  choice: 从海的深处
  rationale: מְצֻלוֹת指水域的深处；“海的深处”既自然，又保留极远、难以抵达之处的意象。这里的“海”按普通名词处理。
theological_decisions:
- issue: 重复动词אָשִׁיב的宾语未明说
  choice: 正文不补宾语：“我要从巴珊带回来……我要从海的深处带回来”
  alternative: 补作“我要把他们从巴珊带回来……”，并把“他们”理解为神的子民或仇敌
  rationale: 希伯来文没有明示宾语，而上下文可能使读者考虑不同所指。现代汉语容许在此省略宾语，虽稍显凝练，却能忠实保留原文的开放性，避免先行裁定是神的子民还是仇敌。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“从巴珊……从海的深处……”保留原文平行结构和重复强调；省略宾语在中文中可成立，也最能保存原文的真实含混。
