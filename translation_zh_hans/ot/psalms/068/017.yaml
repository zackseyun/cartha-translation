  text: רֶ֤כֶב אֱלֹהִ֗ים רִבֹּתַ֣יִם אַלְפֵ֣י שִׁנְאָ֑ן אֲדֹנָ֥/י בָ֝֗/ם סִינַ֥י בַּ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/017.yaml
  text: The chariots of God are myriads[a], thousands upon thousands; the Lord is among them[c][b], Sinai in holiness.
translation:
  language: zh_hans
  text: 神的战车数以万计，千千万万[a]；主在其间[b]——西奈——在圣洁中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“申安的千数”（אַלְפֵי שִׁנְאָן）；“申安”（שִׁנְאָן）是罕见词，词义未定，可能含有重复或众多之意，因此译作“千千万万”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“在他们中间”或“与他们同在”。
    reason: lexical_alternative
  - marker: c
    text: 本句希伯来语极为紧缩，意思难定。也可译作：“主在其中，如同在西奈，在圣洁中”；“主从西奈来到圣所”；或“主在他们中间，西奈也在圣所中”。“圣洁”也可译作“圣所”或“圣地”。
    reason: alternative_reading
lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  choice: 神的战车
  rationale: רֶכֶב在这里是集合用法，指战车或战车大军；属格结构最自然地表示这些战车属于神。“神的战车”保留原诗的具体意象，也符合现代汉语。
- source_word: רִבֹּתַיִם
  choice: 万万之多
  rationale: 该双数形式字面可指“两万”，在诗歌中也可作为极大数量的表达。“万万之多”不把它限定为精确数字，并保留宏大的诗意。
- source_word: אַלְפֵי שִׁנְאָן
  choice: 千千万万
  rationale: שִׁנְאָן罕见且词义不确定，可能表达重复或众多；“千千万万”自然传达层叠、繁多的数量，同时由脚注说明原文难点。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 作为神的尊称，译作“主”简洁、庄重，不额外加入专名。
- source_word: בָם
  choice: 在其中
  rationale: 介词ב加复数代词后缀可表示“在他们之中／在其中／与他们同在”。“在其中”既自然，又保留所指及关系上的一定开放性。
- source_word: סִינַי
  choice: 西奈
  rationale: 按现代汉语通行形式音译该地名。
- source_word: בַּקֹּדֶשׁ
  choice: 在圣洁中
  rationale: קֹדֶשׁ既可抽象指“圣洁”，也可具体指“圣所”。正文采用较少限定地点的“在圣洁中”，并在脚注列出具体地点性的可能译法。
theological_decisions:
- issue: 如何理解省略而紧缩的 אֲדֹנָי בָם סִינַי בַּקֹּדֶשׁ
  choice: 主在其中——西奈在圣洁中
  alternative: 主在其中，如同在西奈，在圣洁中；或：主从西奈来到圣所；或：主在他们中间，西奈也在圣所中
  rationale: 希伯来语缺少明确连接词，句法高度浓缩。正文保留其并置和张力，不擅自补入“如同”或“来到”等解释性成分；脚注则说明主要可能读法，使读者知道原文既可联想到西奈的显现，也可能涉及圣所。
translation_notes:
  register: 采用现代、庄重的诗体汉语。数量表达保留原文层叠的夸张气势；末句刻意保留希伯来诗句的并置和含混，以破折号提示关系而不替原文定论。
