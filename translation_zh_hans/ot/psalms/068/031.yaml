  text: Nobles shall come from Egypt[b][a]; Cush shall quickly stretch out its hands to God.
translation:
  language: zh_hans
  text: 有显贵[a]必从埃及前来；古实必急忙向上帝伸出双手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显贵”或译“使臣”或“王公”。原文词语罕见，可能泛指来自埃及的显要人物。
    reason: lexical_alternative
  - marker: b
    text: 原文“手”带第三人称阳性单数后缀，与被拟人化的单数地名“古实”相应。也可译为“古实必急忙向上帝伸手”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱתָיוּ
  choice: 必前来
  rationale: 该词为表示“来、到达”的未完成式；“必前来”既保留诗歌中的将来指向，也不擅自加入“进贡”等原文未明说的内容。
- source_word: חַשְׁמַנִּים
  choice: 显贵
  rationale: 这是罕见词，语境中最可能指埃及有地位的人。“显贵”保留其身份尊崇的含义，却不限定他们必是使臣或王公。
- source_word: מִנִּי מִצְרָיִם
  choice: 埃及的
  rationale: 介词表示来源。汉语用“埃及的显贵必前来”自然地表达“显贵从埃及而来”。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 采用希伯来地名的传统汉语音译“古实”，避免用后世地理名称“埃塞俄比亚”替代古代所指范围。
- source_word: תָּרִיץ
  choice: 必赶快……伸出
  rationale: 使役词形本有“使……奔跑、使……迅速行动”之意；与“手”连用时，以“赶快伸出”表达动作的急切，同时保持汉语自然。
- source_word: יָדָיו
  choice: 双手
  rationale: 原文为复数“手”，并带第三人称阳性单数后缀，与被拟人化的单数国名“古实”呼应。汉语无需用代词标明这一语法性别，译作“双手”即可保留拟人化动作。
- source_word: לֵאלֹהִים
  choice: 向上帝
  rationale: 介词表示动作朝向上帝；“向上帝伸出双手”自然表达祈求、归向或敬拜的姿态，而不限定其具体性质。
theological_decisions:
- issue: 古实向上帝伸手这一动作的含义
  choice: 保留为向上帝伸出双手的姿态，可涵盖降服、祈求或敬拜
  alternative: 明确译成进贡、政治臣服，或特指完全归入圣约群体
  rationale: 原文只描写向上帝伸手，并未明确界定这一姿态究竟是祈求、敬拜、降服还是进贡。直译动作可保存其神学开放性，避免加入经文没有明说的特定解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“显贵”适合诗篇中列国前来朝见的语境；分号保留两个平行诗行之间的对应关系。以“上帝”对应 אֱלֹהִים，并用“古实”保留古代地名。
