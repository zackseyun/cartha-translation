  text: אִֽם תִּשְׁכְּבוּ/ן֮ בֵּ֪ין שְׁפַ֫תָּ֥יִם כַּנְפֵ֣י י֭וֹנָה נֶחְפָּ֣ה בַ/כֶּ֑סֶף וְ֝/אֶבְרוֹתֶ֗י/הָ בִּֽ/ירַקְרַ֥ק חָרֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/013.yaml
  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver[b], and her pinions with yellow gold.
translation:
  language: zh_hans
  text: 即使你们躺卧在羊圈之间[a]，鸽子的翅膀覆着白银，它的翎羽覆着黄绿色的黄金[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在驮囊之间”，或“在炉石之间”；此处希伯来语词义不确定。
    reason: lexical_alternative
  - marker: b
    text: 直译“在黄绿色的黄金中”，也可理解为“带着黄金的黄绿色光泽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 即使
  rationale: 此处在诗歌中可表达条件或让步关系；“即使”较自然地传达可能的让步义，同时不把语意扩展得过多。
- source_word: תִּשְׁכְּבוּן
  choice: 你们躺卧
  rationale: 该词源自 שׁכב，意为“躺下、躺卧”；保留第二人称复数及具体的身体意象。
- source_word: בֵּין שְׁפַתָּיִם
  choice: 在羊圈之间
  rationale: שְׁפַתָּיִם 的确切含义有争议；“羊圈”是有悠久传统且适合上下文的译法，但其他主要解释在脚注中保留。
- source_word: כַּנְפֵי יוֹנָה
  choice: 鸽子的翅膀
  rationale: 按希伯来语结构直译，中文自然清楚，并保留诗歌意象。
- source_word: נֶחְפָּה בַכֶּסֶף
  choice: 披上了白银
  rationale: חפה 表示被覆盖或包覆；“披上”既呈现覆盖之意，也适合描写羽翼的诗性语境。
- source_word: אֶבְרוֹתֶיהָ
  choice: 翎羽
  rationale: אֶבְרָה 指翅上的长羽或飞羽；“翎羽”比泛称“羽毛”更准确，又比技术性的“飞羽”更具诗体庄重感。
- source_word: בִּירַקְרַק חָרוּץ
  choice: 黄绿色泽的黄金
  rationale: חָרוּץ 可指黄金，יְרַקְרַק 表示偏黄绿或绿黄色调；正文保留这一不寻常的颜色信息，避免仅译作普通“黄金”而丢失原文细节。
