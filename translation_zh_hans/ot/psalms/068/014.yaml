  text: 全能者在那里驱散列王时，撒们下起雪来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּפָרֵשׂ
  choice: 驱散……时
  rationale: 动词 פרשׂ 在此可表达使之分散、散开的意思；בְּ 加不定式结构表时间，译作“……时”。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是神的称号“沙代”，传统且自然地译为“全能者”。
- source_word: מְלָכִים
  choice: 列王
  rationale: 保留复数及诗体色彩，指众王。
- source_word: בָּהּ
  choice: 在那地
  rationale: 阴性单数代词的所指在本节内未明说；“在那地”自然表达地点意义，同时不擅自明确其具体所指。
- source_word: תַּשְׁלֵג
  choice: 就下起雪来
  rationale: 该形式通常理解为“下雪”；主语可作非人称，中文以“下起雪来”自然呈现，并以“就”连接诗句前后景象。
- source_word: בְּצַלְמוֹן
  choice: 撒们山
  rationale: צַלְמוֹן 为地名，通常指撒们山；采用音译并补“山”以符合中文地名表达及传统理解。
theological_decisions:
- issue: “驱散列王”的施事者
  choice: 以“全能者”为主语
  alternative: 将“沙代”理解为地点或其他称谓结构
  rationale: 希伯来语语序和传统句法最自然地把 שַׁדַּי 视为施事者；不额外说明驱散的手段或神学含义。
- issue: “下雪”的性质
  choice: 直译为实际的降雪意象
  alternative: 解释为尸骨、战利品或其他象征如雪般遍布
  rationale: 原文只说“下雪”，诗意及可能的象征保持开放，不在正文中加入未经明说的解释。
translation_notes:
  register: 采用庄重而自然的现代汉语，保留希伯来诗句突兀而凝练的意象。“在那地”维持代词所指的含混；“撒们山就下起雪来”不消解降雪究竟是实景还是诗性象征的张力。
