source:
  edition: WLC
  text: גְּעַ֨ר חַיַּ֪ת קָנֶ֡ה עֲדַ֤ת אַבִּירִ֨ים בְּ/עֶגְלֵ֬י עַמִּ֗ים מִתְרַפֵּ֥ס בְּ/רַצֵּי כָ֑סֶף בִּזַּ֥ר עַ֝מִּ֗ים קְרָב֥וֹת יֶחְפָּֽצוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/030.yaml
  text: Rebuke the beast of the reeds[a], the herd of bulls among the calves of the peoples, trampling on pieces of silver[b]. Scatter the peoples who delight in wars.
translation:
  language: zh_hans
  text: '斥责芦苇中的野兽[a]，

    以及各族牛犊中的那群公牛；

    它们践踏银块[b]。


    求你驱散喜爱争战的众民。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“芦苇中的猛兽”。这可能用来比喻埃及或另一敌对势力。
    reason: lexical_alternative
  - marker: b
    text: 这半句的希伯来文含义不明。也可译作“带着银块屈服”或“俯伏献上银条”，意思可能是进献贡物。
    reason: alternative_reading
lexical_decisions:
- source_word: גְּעַר
  choice: 斥责
  rationale: 这是第二人称阳性单数命令式，表示上帝以有力的斥责制服敌对势力。“斥责”既保留命令的力度，也不把含义扩展为“毁灭”或“消灭”。
- source_word: חַיַּת קָנֶה
  choice: 芦苇丛中的野兽
  rationale: 原文直译近于“芦苇的野兽”。“芦苇丛中的野兽”保留湿地猛兽的意象，不在正文中径直认定为河马、鳄鱼、埃及或某一敌对政权。
- source_word: עֲדַת אַבִּירִים
  choice: 那群公牛
  rationale: עֲדָה可指群体或会众，אַבִּירִים可指强者，也常以公牛为意象；上下文连续使用动物形象，因此译为“那群公牛”。
- source_word: בְּעֶגְלֵי עַמִּים
  choice: 万民的牛犊中
  rationale: 将介词בְּ理解为处所或群体关系，译作“中”；“牛犊”延续本句的牛群意象，“万民”则自然表达复数עַמִּים。
- source_word: מִתְרַפֵּס
  choice: 践踏
  rationale: 这个词形和语义存在争议。正文按敌对猛兽与好战众民的语境译为“践踏”，但在脚注中保留“屈服、俯伏并献银”的另一种重要理解。
- source_word: בְּרַצֵּי כָסֶף
  choice: 银块
  rationale: רַצֵּי含义不明，可能指碎块、银条或银锭。“银块”保留物质和经济意象，同时避免过度限定其形制。
- source_word: בִּזַּר
  choice: 求你驱散
  rationale: 此词按形态为完成式，但在诗歌语境中可顺承开头的命令语气，表达祈求。“求你驱散”在汉语中清楚呈现这一祷告功能，同时承认其形态张力。
- source_word: קְרָבוֹת יֶחְפָּצוּ
  choice: 喜爱争战
  rationale: 该短语描述对战事的持续偏好。“喜爱争战”自然、凝练，并保留原文对好战倾向的道德评价。
theological_decisions:
- issue: 是否在正文中把“芦苇丛中的野兽”明确认定为埃及或另一历史势力
  choice: 保留原文的动物隐喻，不在正文中明确指认
  alternative: 明确译解为埃及，或泛指某个敌对帝国
  rationale: 芦苇和湿地意象可能令人联想到埃及，诗篇整体语境也可能支持这一联系；但本节本身没有点名，因此正文不把可能的历史所指当作确定含义。
- issue: מִתְרַפֵּס表示敌对的践踏，还是卑躬屈服、献上贡银
  choice: 正文采用“践踏”，脚注保留屈服献银的读法
  alternative: 译为“带着银块屈服”或“俯伏献上银条”
  rationale: 词义本身艰涩。敌对猛兽、公牛和喜爱争战之民的语境支持暴力动作的理解；但“俯伏、屈服并献银”的解释在语言上也有重要依据，不能静默排除。
- issue: בִּזַּר的完成式形态与祈求语气之间的张力
  choice: 按上下文译作“求你驱散”
  alternative: 按形态译作“他已经驱散了”
  rationale: 开头的命令式以及本节祈求上帝制服敌人的整体走向，支持把该完成式理解为诗歌中的祈愿或命令延续；加入“求你”使现代汉语读者能辨明语气，但不据此引申额外教义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，以短行保留希伯来诗歌的并列推进。正文维持野兽、公牛和牛犊的连续意象；“万民”与“众民”兼顾自然表达及עַמִּים的复数群体含义。代词“它”按原文单数分词承接主要敌对形象，同时不强行解释各动物意象之间的具体政治对应。所有脚注标记均已置于正文相应位置。
