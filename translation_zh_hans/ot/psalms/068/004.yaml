  text: שִׁ֤ירוּ לֵֽ/אלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥/וֹ סֹ֡לּוּ לָ/רֹכֵ֣ב בָּ֭/עֲרָבוֹת בְּ/יָ֥הּ שְׁמ֗/וֹ וְ/עִלְז֥וּ לְ/פָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/004.yaml
  text: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
translation:
  language: zh_hans
  text: 你们要向上帝歌唱，歌颂他的名；要为那位在荒原上乘驾者修筑大道[a]。他的名是“雅”[b]；你们要在他面前欢欣雀跃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “修筑大道”所译的希伯来语动词可指堆筑、修整道路；也有人按本节赞美诗的排比理解为“高声颂扬”。“荒原”也可译作“旷野”或“草原”；有些译本按神显意象译作“云天”或“云彩”。
    reason: alternative_reading; lexical_alternative
  - marker: b
    text: “雅”是希伯来文神圣名字的短式。
    reason: name_clarification
lexical_decisions:
- source_word: שִׁירוּ לֵאלֹהִים
  choice: 你们要向上帝歌唱
  rationale: שִׁירוּ是复数命令式；补出“你们”可在现代汉语中清楚表达面向群体的直接呼吁。אֱלֹהִים在本诗语境中指以色列的上帝。
- source_word: זַמְּרוּ שְׁמוֹ
  choice: 歌颂他的名
  rationale: זמר在诗歌敬拜语境中表示以歌唱或音乐赞美；“歌颂”自然凝练，并保留“他的名”这一宾语。
- source_word: סֹלּוּ
  choice: 修筑大道
  rationale: סלל的基本图像是堆筑、筑起道路；这里采用道路预备的具体意象，而不把它直接释义为唱诗。因其在诗行中的确切运用存在分歧，另列脚注。
- source_word: לָרֹכֵב בָּעֲרָבוֹת
  choice: 为那乘驾荒原者预备
  rationale: רֹכֵב是“乘驾者”的分词称谓；עֲרָבוֹת通常指干旱的平原、荒漠或草原。“荒原”既简洁又保留旷野行进的意象；“预备”使中文明确表达所修道路是为这位乘驾者而筑。
- source_word: בְּיָהּ שְׁמוֹ
  choice: 他的名是“雅”
  rationale: יָהּ是神圣名字的短式，宜音译为“雅”，而不以称号替代。此短句按其表名功能译成自然汉语。
- source_word: וְעִלְזוּ לְפָנָיו
  choice: 你们要在他面前欢欣雀跃
  rationale: עלז表达强烈、外显的欢乐；“欢欣雀跃”比单说“喜乐”更能传达其热烈程度，同时保留“在他面前”。
theological_decisions:
- issue: 神圣名字短式יָהּ的译法
  choice: 音译为“雅”
  alternative: 译作“耶和华”或“主”
  rationale: 原文用的是יָהּ这一短式，而非完整四字神名；音译既保留其作为名字的性质，也反映原文形式上的区别。
- issue: סֹלּוּ所表达的行动
  choice: 保留“修筑大道”的道路意象
  alternative: 译作“高声颂扬”或“扬声歌唱”
  rationale: 词根סלל通常指堆起、筑路。诗歌平行结构可能促使解释者把它理解为赞歌呼吁，但不应在正文中无声消除原文具体而富神显色彩的道路图像。
- issue: בָּעֲרָבוֹת的神显意象
  choice: 译作“荒原”
  alternative: 译作“云天”或“云彩”
  rationale: 该词通常指荒漠平原或干旱草原，并与本诗旷野行进的背景相合；“云天”可形成崇高的神显图像，但词汇依据较弱，故置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以“你们要……”呈现连续的复数命令式。保留筑路、乘驾荒原及在上帝面前欢跃的诗性图像，不以解释性神学语言取代原文。
