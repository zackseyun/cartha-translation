  yaml_path: translation/ot/psalms/068/008.yaml
  text: The earth quaked; even the heavens dripped before God—this Sinai—before God, the God of Israel.
translation:
  language: zh_hans
  text: 大地震动；诸天也在上帝面前滴下雨水——这座西奈山——在上帝，就是以色列的上帝面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָשָׁה
  choice: 震动
  rationale: 保留大地因上帝显现而震颤的意象；较“摇动”更自然，也不把原文限定为现代意义上的一次地震。
- source_word: נָטְפוּ
  choice: 滴下雨水
  rationale: 动词本义为“滴下、滴落”；结合“诸天”可自然理解为降雨。补出“雨水”使现代汉语清楚，同时保留“滴下”的诗歌形象。
- source_word: מִפְּנֵי
  choice: 在……面前
  rationale: 直译其空间与临在意味，表达天地面对上帝显现时的反应。
- source_word: זֶה סִינַי
  choice: 这西奈
  rationale: 依照马所拉文本保留突兀而浓缩的指示结构，不擅自改成“西奈山本身”或补入谓语。
- source_word: אֱלֹהִים אֱלֹהֵי יִשְׂרָאֵל
  choice: 上帝、以色列的上帝
  rationale: 保留同位说明及原文重复，庄重而清晰。
theological_decisions:
- issue: “这西奈”与上帝显现的关系
  choice: 保留“这西奈”的语法张力
  alternative: 译作“西奈山也在上帝面前震动”
  rationale: 原文的 זֶה סִינַי 极其凝练，可能唤起西奈显现，也可能与前后成分形成插入式指示；不补出原文没有的动作或介词关系。
- issue: 诸天“滴下”的对象
  choice: 译为“滴下雨水”
  alternative: 仅译“滴落”或引申为“降雨”
  rationale: 上下文可能涉及神显与丰雨；译文明确自然现象，却不把它神学化为某种特定恩赐。
translation_notes:
  register: 采用现代、庄重的诗体汉语。保留原文两次“在上帝面前”的重复和“这西奈”的突兀结构，以呈现希伯来诗歌的强调与张力。
