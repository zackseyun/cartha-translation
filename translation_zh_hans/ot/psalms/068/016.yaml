  text: לָ֤/מָּה תְּֽרַצְּדוּ/ן֮ הָרִ֪ים גַּבְנֻ֫נִּ֥ים הָ/הָ֗ר חָמַ֣ד אֱלֹהִ֣ים לְ/שִׁבְתּ֑/וֹ אַף יְ֝הוָ֗ה יִשְׁכֹּ֥ן לָ/נֶֽצַח׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/016.yaml
  text: Why do you leap about[a], O many-peaked mountains, at the mountain God desired for his dwelling? Indeed, Yahweh will dwell there forever.
translation:
  language: zh_hans
  text: 多峰的群山哪，你们为何嫉妒地望着[a]上帝所喜爱、要作自己居所的那座山？是的，耶和华必永远住在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们为何跳跃？”这个希伯来语动词十分罕见，含义不能确定；它可能指跳跃，也可能指嫉妒地观看或侧目而视。
    reason: 说明罕见动词的词义不确定性及主要替代译法。
lexical_decisions:
- source_word: תְּרַצְּדוּן
  choice: 嫉妒地望着
  rationale: 此动词罕见且词义不确定。结合众山与上帝所中意之山的对比，译作“嫉妒地望着”能自然表达敌意或艳羡的目光；“跳跃”一义保留在脚注中。
- source_word: הָרִים גַּבְנֻנִּים
  choice: 群峰耸立的众山
  rationale: גַּבְנֻנִּים可能描绘隆起的山脊或多个峰头。“群峰耸立”保留其地貌意象，又符合现代汉语表达。
- source_word: הָהָר
  choice: 那座山
  rationale: 原文使用带定冠词的普通名词，指上下文中特定的山，却未在本节明说锡安，因此不将专名补入正文。
- source_word: חָמַד
  choice: 渴望
  rationale: 该词表示渴望、喜爱或以之为可悦；“渴望”贴近原词，比“拣选”少一层解释。
- source_word: לְשִׁבְתּוֹ
  choice: 作为自己居所
  rationale: 不定式加后缀表示上帝居住的目的或结果；此译简洁地说明那山是他的居所。
- source_word: אַף
  choice: 必
  rationale: 此处אַף加强随后陈述的肯定语气。汉语以“必”与完整断句传达强调，比机械译作“也”更合语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的四字神名译写，保留其专名性质，不以“主”这一称号替代。
- source_word: יִשְׁכֹּן לָנֶצַח
  choice: 必住在那里，直到永远
  rationale: שׁכן意为居住、安居；“在那里”由所说的山这一上下文自然补明，לָנֶצַח表示永远持续。
theological_decisions:
- issue: 是否明确把这座山称为锡安
  choice: 正文保留“那座山”
  alternative: 直接译为“锡安山”
  rationale: 全诗语境指向锡安，但本节原文本身只说带定冠词的“山”。保留普通名词可避免把语境推断写进正文。
- issue: 如何表达众山与上帝所中意之山之间的修辞对比
  choice: 正文译为“嫉妒地望着”，并用脚注说明动词也可能指跳跃
  alternative: 正文译为“跳跃”或“蹦跳”
  rationale: 罕见动词允许不同分析；敌意或嫉妒的目光符合本节的对比关系，但运动义也有词汇依据，故不将不确定性隐藏。
- issue: 如何处理神名四字母词
  choice: 译作“耶和华”
  alternative: 译作“雅威”或以“主”代替
  rationale: 保留个人神名而不换成称号；“耶和华”是现代中文圣经语境中最广为识别且庄重的译写。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“群峰耸立的众山哪”保留诗歌中的呼语和山岭意象；正文不点明锡安，以忠实保存原文在本节中的措辞范围。
