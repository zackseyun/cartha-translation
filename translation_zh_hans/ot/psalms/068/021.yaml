  to: 神必击碎他仇敌的头颅，以及那在自己罪孽中行走之人长满头发的头顶[a]。
  rationale: 修订只处理句法对应、定语语序和脚注术语。“以及”使单一的“必击碎”自然统领两个并列对象；“长满头发的头顶”比“毛发浓密的头顶”更直接反映“有毛发的头顶”这一意象，未断定发量或发长；“在自己罪孽中行走”保留持续性的生活方式隐喻及“罪孽”的语义张力。
