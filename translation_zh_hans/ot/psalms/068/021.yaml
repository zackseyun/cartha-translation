source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִמְחַץ֮ רֹ֤אשׁ אֹ֫יְבָ֥י/ו קָדְקֹ֥ד שֵׂעָ֑ר מִ֝תְהַלֵּ֗ךְ בַּ/אֲשָׁמָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/021.yaml
  text: Surely God will crush the head of his enemies[a], the hairy crown of the one who walks in his guilt.
translation:
  language: zh_hans
  text: 神必击碎他仇敌的头颅，以及那在自己罪孽中行走之人长满头发的头顶[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长满头发的头顶”也可译作“多毛的头盖骨”或“有头发的头顶”；“在自己罪孽中行走”也可译作“不断行在自己的过犯中”。
    reason: 说明 קָדְקֹד שֵׂעָר 指头部顶部的带发意象；并保留 בַּאֲשָׁמָיו 可指罪责或过犯、且与持续性分词搭配的语义范围。
lexical_decisions:
- source_word: אַךְ
  choice: 必
  rationale: 此处是加强断言的语气词；“必”以自然简洁的现代汉语表达确定而有力的肯定，不取限制义“只有”。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 虽为复数形态，但与单数动词搭配，在本节指以色列的神，故按单数译为“神”。
- source_word: יִמְחַץ
  choice: 击碎
  rationale: 原词表示猛烈压碎、砸碎；“击碎”保留神施行审判的强烈具体意象。
- source_word: רֹאשׁ
  choice: 头颅
  rationale: 保留身体部位的具体意象；“头颅”也能与下句的“头顶”形成诗歌平行。
- source_word: אֹיְבָיו
  choice: 他仇敌
  rationale: 原文为复数名词并带第三人称阳性单数后缀；依紧邻语境，“他”最自然地回指神。
- source_word: קָדְקֹד שֵׂעָר
  choice: 毛发浓密的头顶
  rationale: קָדְקֹד 指头的顶部，שֵׂעָר 描写其有毛发；此译保留鲜明意象，同时避免生硬的“多毛头顶”。
- source_word: מִתְהַלֵּךְ
  choice: 行在……中的人
  rationale: Hitpael 分词表达持续或惯常的行为方式；“行在”保留希伯来文以行走喻生活行为的伦理意象。
- source_word: בַּאֲשָׁמָיו
  choice: 在自己罪孽中
  rationale: 该词可指罪责、过犯或负罪行为；“罪孽”在中文中可兼顾罪责与罪行，不把原文的语义张力缩减为单一解释。
theological_decisions:
- issue: “他仇敌”中代词后缀的所指
  choice: 将“他”理解为回指本句主语神。
  alternative: 也可按更广的诗篇语境理解为与神的受膏者或神子民敌对的人。
  rationale: 紧邻的主语是 אֱלֹהִים，且动词为单数，因此神是最自然的先行词；译文不进一步限定为某一民族性或弥赛亚性所指。
- issue: בַּאֲשָׁמָיו 的意义
  choice: 译作“在自己罪孽中”，兼含罪责与过犯行为。
  alternative: 可译作“带着自己的罪责”或“行在自己的过犯中”。
  rationale: 该名词可表示罪责，也可表示导致罪责的罪行；与表示持续行为的分词连用时有生活方式的意味，但不宜把它完全解释成抽象状态或具体行为之一。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“击碎—击碎”保留原诗句的平行和力度；“行在……中”略带圣经诗歌色彩，但在上下文中清楚，并保存原文以行走比喻生活方式的表达。
