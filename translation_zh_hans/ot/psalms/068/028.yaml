revisions:
- from: 你的神已经命定你的力量。神啊，求你彰显大能[a]；你曾为我们行事。
  to: 你的神已经命定你有力量。神啊，求你显出力量[a]；你曾为我们行事。
  rationale: 修订仅处理两处安全且必要的汉语表达：首句改用“命定你有力量”来传达“神已命定你的力量”这一不寻常但可理解的希伯来语结构；第二句去除“大”这一非原文明确的强化语。脚注保留歧义，不裁定有争议的形态／句法问题。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:50:59Z'
review_pass:
  verdict: revise
  source_fidelity: 首句“命定你的力量”大体保留了 צִוָּה 与 עֻזֶּךָ 的关系，但在现代汉语中搭配生硬，容易被读成“预定某种力量”，而弱化“神已作出权威决定、使你有力量”的意思。将其改为“命定你有力量”以自然汉语表达原文的宾语结构，未具体化力量的性质。第二句的祈求语气及末句“为我们行事”均忠实反映 עוּזָה、זוּ、פָּעַלְתָּ 和 לָּנוּ。
  naturalness: “你的神已经命定你的力量”不符合现代汉语通常搭配；“你的神已经命定你有力量”更自然，仍保留庄重的诗歌语体。“求你彰显大能”中的“大”并非原文明确成分；改为“求你显出力量”更贴近原文，且自然。
  terminology: “神”“力量”“为我们行事”均合宜。“命定”可用于诗歌体的神圣命令／定旨，但须以“命定你有力量”的句式避免歧义。脚注应保留 עוּזָה 的不确定性，并明确后一替代读法是与下一节连读。
