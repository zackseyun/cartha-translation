source:
  edition: WLC
  text: צִוָּ֥ה אֱלֹהֶ֗י/ךָ עֻ֫זֶּ֥/ךָ עוּזָּ֥/ה אֱלֹהִ֑ים ז֝֗וּ פָּעַ֥לְתָּ לָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/028.yaml
  text: Your God has commanded your strength. Show strength[a], O God, you who have worked for us.
translation:
  language: zh_hans
  text: 你的神已经命定你有力量。神啊，求你显出力量[a]；你曾为我们行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显出力量”所译的希伯来语形式较难确定，也可理解为“神啊，求你刚强”，或与下一节连读，译作“神啊，求你坚固你为我们所成就的”。
    reason: 保留原文罕见形式所产生的主要替代读法，并说明最后一种读法须与下一节相连。
lexical_decisions:
- source_word: צִוָּה
  choice: 已经命定
  rationale: 该完成式表示已经发出的权威性命令或安排，并带有当前效力；“已经命定”比单纯“吩咐”更适合以“力量”为宾语的搭配。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: אֱלֹהִים 在这里以单数意义指以色列的神，附有第二人称阳性单数后缀。
- source_word: עֻזֶּךָ
  choice: 你的力量
  rationale: 保留名词“力量／能力”的基本意义和第二人称所属关系，不把它具体化为军事力量。
- source_word: עוּזָה
  choice: 求你彰显大能
  rationale: 此形式和句法较难确定。正文将其理解为向神发出的祈求，求神显出力量；中文加“求你”自然表达祈使语气，但不在正文补入原文没有明说的受词。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 上下文是直接向神祈求，中文以“啊”明确呼格。
- source_word: זוּ
  choice: 你
  rationale: 将古老的关系词理解为引出描述神的关系分句；中文直接以“你曾……”承接呼语，表达自然，同时不把它误作指示代词“这”。
- source_word: פָּעַלְתָּ
  choice: 曾……行事
  rationale: 该动词表示采取行动、施行作为；“行事”保留其宽泛意义，避免擅自补成“成就大事”。
- source_word: לָּנוּ
  choice: 为我们
  rationale: 介词在此最自然地表示受益关系，即神为百姓的益处采取行动。
theological_decisions:
- issue: עוּזָה 的形态和句法歧义
  choice: 理解为求神彰显大能：“神啊，求你彰显大能”
  alternative: 也可理解为“神啊，求你刚强”，或与后文连读为“神啊，求你坚固你为我们所成就的”
  rationale: 希伯来语形式罕见，句法关系并不明确。正文采用在本节内可独立成立的祈求语气，脚注保留其他主要理解，不借下一节的措辞消除原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“命定你的力量”略带陌生感，是为保留原文不寻常的搭配；后半句用分号维持祈求与关系分句之间的紧密联系。
