  text: רָא֣וּ הֲלִיכוֹתֶ֣י/ךָ אֱלֹהִ֑ים הֲלִ֘יכ֤וֹת אֵלִ֖/י מַלְכִּ֣/י בַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/024.yaml
  text: They have seen your processions[a], O God— the processions of my God, my King, into the sanctuary.
translation:
  language: zh_hans
  text: '他们看见了你的行列，神啊——

    就是我的神、我的王在圣所中的行列。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们看见了你的行进，神啊——就是我的神、我的王在圣洁中的行进。”
    reason: 保留 הֲלִיכוֹת 可指“行进、脚步或行动”的词义范围，并保留 בַקֹּדֶשׁ 可理解为“在圣洁中”的可能；主文的“在圣所中”反映礼仪／行列语境，但不增添“进入”的方向意义。
lexical_decisions:
- source_word: רָאוּ
  choice: 人们看见了
  rationale: 这是ראה的Qal完成式第三人称复数，表示已经发生、被人目睹的行动；希伯来文未明说主语，现代汉语用泛指的“人们”自然表达。
- source_word: הֲלִיכוֹתֶיךָ / הֲלִיכוֹת
  choice: 你的行列／……的行列
  rationale: הֲלִיכוֹת是复数，可指行走、行进或礼仪性的队列。上下文具有公开庆典和敬拜场景，“行列”能自然传达列队行进的形象；两处重复同一译词，以保留原文的强调和平行结构。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 结合后面的同位称谓，此处是直接呼告；“神啊”符合现代汉语诗歌与祷告语体。
- source_word: אֵלִי
  choice: 我的神
  rationale: 名词带第一人称单数词尾，直接表达所属关系。
- source_word: מַלְכִּי
  choice: 我的王
  rationale: 保留诗人用于称呼神的君王称号，不额外加入解释。
- source_word: בַקֹּדֶשׁ
  choice: 进入圣所
  rationale: 介词בְּ本义通常为“在……中”，קֹדֶשׁ可指圣洁或圣所；在行列行进的礼仪语境中，译作“进入圣所”最自然，但以脚注保留“在圣所中／在圣洁中”的可能性。
theological_decisions:
- issue: 行列所指及בַקֹּדֶשׁ的关系
  choice: 描写神以王的身份列队进入圣所
  alternative: 描写神在圣所中的行进，或更抽象地描写神在圣洁中的作为、道路
  rationale: 重复的הֲלִיכוֹת、对神的呼告，以及“我的神、我的王”的称谓共同支持礼仪行列的图景；然而介词和קֹדֶשׁ本身仍容许地点或抽象意义，因此不将其他读法完全排除，并在脚注中注明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以“行列”呈现礼仪性行进，并重复该词来反映希伯来文的平行结构；不用生硬的复数标记，因为汉语“行列”在此可自然涵盖原文复数。
