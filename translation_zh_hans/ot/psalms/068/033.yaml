  text: לָ֭/רֹכֵב בִּ/שְׁמֵ֣י שְׁמֵי קֶ֑דֶם הֵ֥ן יִתֵּ֥ן בְּ֝/קוֹל/וֹ ק֣וֹל עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/033.yaml
  text: to him who rides in the highest heavens[a], which are from ancient times—behold, he gives forth his voice[b], a mighty voice.
translation:
  language: zh_hans
  text: 归给那驾行在自古以来的至高诸天中的那一位[a]！看哪，他发出他的声音，是大有能力的声音。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在自古的诸天之天中。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“他发出他的声音，是能力之声。”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָ/רֹכֵב
  choice: 献给那驾行……之上的那一位
  rationale: 承接上一节“将能力归给上帝”的命令，前缀 ל 表示间接对象；分词 רֹכֵב 实词化，指驾行者。
- source_word: בִּ/שְׁמֵי שְׁמֵי
  choice: 驾行在至高诸天之上
  rationale: “诸天之天”是希伯来语最高级表达；结合神圣驾乘意象，译作“至高诸天”，并用“之上”自然表达驾行的空间关系。
- source_word: קֶדֶם
  choice: 自古已有的
  rationale: 此处取时间义“古时、亘古”，修饰诸天，不取方位义“东方”。
- source_word: הֵן
  choice: 看哪
  rationale: 保留提示注意的诗体语气，同时符合现代庄重汉语。
- source_word: יִתֵּן בְּ/קוֹל/וֹ
  choice: 他发出声音
  rationale: 字面为“他给出他的声音”；נתן קול 是发声的习语，汉语译作“发出声音”自然且贴近原意。
- source_word: קוֹל עֹז
  choice: 大有能力的声音
  rationale: 保留结构“能力之声”的力度，也避免把 עֹז 仅处理为音量上的“洪亮”。
theological_decisions:
- issue: 驾行者的所指
  choice: 按上下文指以色列的上帝，不在译文中进一步限定
  alternative: 按预表方式将这一神圣驾乘意象明确指向后来的弥赛亚应用
  rationale: 本节上下文直接颂赞上帝；译文保留该直接所指，不把后来的神学认同加入正文。
- issue: לָ/רֹכֵב 与上一节命令的句法联系
  choice: 用“献给”明确承接上一节“归给上帝”的命令
  alternative: 将其独立译为“那驾行者”
  rationale: ל 前缀最自然地受前节命令支配；即使单节展示，也应尽量显明其未完句法关系。
translation_notes:
  register: 采用现代、庄重而可懂的诗歌体。“献给”保留本节与上一节命令的连接；“看哪”保留原文的提示语气。两个脚注标记均置于正文对应句末。
