  yaml_path: translation/ot/psalms/068/025.yaml
  text: The singers went before[a], the musicians after[b], in the midst of young women beating tambourines.
translation:
  language: zh_hans
  text: 歌者在前，乐手在后；中间是击着手鼓的年轻女子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִדְּמוּ
  choice: 走在前面
  rationale: 该词是 קדם 的皮埃勒完成式三复，在这里描写队伍中的先后位置；“走在前面”自然地保留了行进场景。
- source_word: שָׁרִים
  choice: 歌唱的
  rationale: 源于 שׁיר“歌唱”，与后面的“奏乐的”平行，指歌者，而不是“首领”。
- source_word: אַחַר
  choice: 跟在后面
  rationale: 表示队伍中的后续位置；希伯来文此处省略动词，汉语补出“跟在”以使句意自然。
- source_word: נֹגְנִים
  choice: 奏乐的
  rationale: 源于 נגן，指演奏乐器的人；“奏乐的”既准确，又与“歌唱的”形成简洁的诗体平行。
- source_word: בְּתוֹךְ
  choice: 中间是
  rationale: 保留队伍的空间布局，同时用现代汉语自然表达希伯来文“在……中间”的结构。
- source_word: עֲלָמוֹת
  choice: 少女
  rationale: 指年轻女子，通常带有适婚年龄的含义；“少女”简洁自然，而译作“童女”会把原词可能并未明确表达的贞洁含义说得过满。
- source_word: תּוֹפֵפוֹת
  choice: 击手鼓的
  rationale: 这是由 תֹּף 构成的动作表达，意为击打或演奏这种手持打击乐器；“击手鼓”保留了鲜明的节奏动作。
