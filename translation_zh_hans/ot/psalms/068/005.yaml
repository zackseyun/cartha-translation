  yaml_path: translation/ot/psalms/068/005.yaml
  text: God is a father of the fatherless and a judge of widows in his holy dwelling[a][b][c].
translation:
  language: zh_hans
  text: 上帝在他的圣洁居所中，是孤儿的父亲，是寡妇的审判者[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孤儿”也可按字面译作“无父者”，指失去父亲、因而缺乏家庭保护的孩子。
    reason: lexical_alternative
  - marker: b
    text: “审判者”也可意译为“为寡妇主持公道者”；希伯来语更直接指施行审判、主持正义的人。
    reason: lexical_alternative
  - marker: c
    text: “在他的圣洁居所中”也可译作“在他神圣的住处中”；有些译法理解为“从他的圣洁居所”，但希伯来介词直译是“在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי
  choice: 父亲
  rationale: 这是“父亲”的构造形，在无动词句中与后置主语“上帝”构成表语关系；译为“是……的父亲”既保留所属关系，也符合现代汉语表达。
- source_word: יְתוֹמִים
  choice: 孤儿
  rationale: 该词指失去父亲、因而缺乏家庭保护的孩子。现代汉语“孤儿”自然易懂；其古代语境中的重点是无父者所处的社会弱势。
- source_word: דַיַּן
  choice: 审判者
  rationale: 该名词指施行审判、主持公道的人。“审判者”保留原文的司法意象，不把其含义直接解释为较具引申色彩的“保护者”或“伸冤者”。
- source_word: אַלְמָנוֹת
  choice: 寡妇
  rationale: 该复数名词通常指丧夫的妇女；译作“寡妇”准确且自然。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为形态上的复数形式，却具有单数意义，是整个无动词句的主语；“上帝”是庄重而通行的现代汉语译法。
- source_word: בִּמְעוֹן
  choice: 在……圣所中
  rationale: מָעוֹן指居所、住处，介词בְּ通常表示“在……中”。结合“他的圣”，译为“在他的圣所中”简洁自然，并保留原文的处所表达。
- source_word: קָדְשׁוֹ
  choice: 他的圣所
  rationale: 字面为“他的圣/圣洁”，与“居所”结合表达“他的圣洁居所”。汉语用“他的圣所”可自然传达这一关系，但“圣所”也可能让人联想到礼仪性圣殿，因此以脚注注明较直译的表达。
theological_decisions:
- issue: דַיַּן应译为司法性的“审判者”，还是保护性的“维护者”
  choice: 寡妇的审判者
  alternative: 为寡妇主持公道者／寡妇的保护者
  rationale: 上下文确实表现上帝为弱势者伸张正义，但该词本身首先指审判、主持司法的人。正文保留法律意象，脚注说明其在语境中可表达维护权益、主持公道的作用，避免过早消解原文张力。
- issue: בִּמְעוֹן קָדְשׁוֹ表示上帝所在的位置，还是他行动的来源
  choice: 在他的圣所中
  alternative: 从他的圣洁居所
  rationale: 希伯来介词בְּ通常是“在”。虽然“从”可把短语理解为上帝施行作为的出发处，但这不是介词最直接的意义，因此正文保留处所义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。将后置的“上帝”前移为汉语主语，使两个平行表语清晰自然；保留“父亲—审判者”的平行结构及原文司法意象。正文中的[a][b]均有对应脚注。
