  text: כְּ/הִנְדֹּ֥ף עָשָׁ֗ן תִּ֫נְדֹּ֥ף כְּ/הִמֵּ֣ס דּ֭וֹנַג מִ/פְּנֵי אֵ֑שׁ יֹאבְד֥וּ רְ֝שָׁעִ֗ים מִ/פְּנֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/002.yaml
  text: As smoke is driven away[a], so you drive them away; as wax melts before fire[c][b], so the wicked perish before God.
translation:
  language: zh_hans
  text: 烟如同被吹散，你也驱散；蜡如同在火面前熔化，恶人也在上帝面前灭亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/הִנְדֹּף עָשָׁן
  choice: 烟怎样被吹散
  rationale: כ 加不定式构成比较；“烟怎样被吹散”自然保留烟受风驱散的意象，并与下句同源动词相呼应。
- source_word: תִּנְדֹּף
  choice: 你也照样把他们驱散
  rationale: 该词为 נדף 的第二人称阳性单数未完成式，直接称呼上帝。“驱散”涵盖赶走、吹散之义；宾语按与“恶人”的诗意平行补为“他们”，但原文并未明说。
- source_word: כְּ/הִמֵּס דּוֹנַג
  choice: 蜡怎样……熔化
  rationale: כ 加不定式再次引入明喻；“熔化”是 דּוֹנַג 在火前变化的准确、自然表达。
- source_word: מִ/פְּנֵי אֵשׁ
  choice: 在火前
  rationale: מִפְּנֵי 字面涉及“从……面前”，此处描写蜡因面对或接近火而熔化；“在火前”既保留重复结构，也保持诗歌意象。
- source_word: יֹאבְדוּ רְשָׁעִים
  choice: 恶人……灭亡
  rationale: אבד 的 Qal 未完成式可指灭亡、消逝；“灭亡”不额外限定毁灭方式。רְשָׁעִים 译为“恶人”，简洁保留其道德范畴。
- source_word: מִ/פְּנֵי אֱלֹהִים
  choice: 在上帝面前
  rationale: 与“在火前”形成明显平行，表达恶人在上帝临在之下灭亡。אֱלֹהִים 在此指上帝。
theological_decisions:
- issue: 诗歌中未完成式的时态和语气
  choice: 采用一般现在式：“驱散……灭亡”
  alternative: 也可理解为将来式“必驱散……必灭亡”，或愿望式“愿你驱散……愿恶人灭亡”
  rationale: 希伯来诗歌中的未完成式可有将来、惯常或情态色彩。一般现在式能呈现鲜明的类比，又不武断地把经文限定为预言或咒愿。
- issue: תִּנְדֹּף 的隐含宾语
  choice: 按诗意平行补作“他们”，指向后句的恶人
  alternative: 也可补作“它”，承接“烟”；或不明说宾语
  rationale: 原文动词没有显式宾语。“他们”使上帝驱散恶人与恶人在上帝面前灭亡形成平行，但脚注保留语法上的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“烟怎样……蜡怎样……”保留两重明喻，“在火前……在上帝面前”保留原文的结构对应。称谓统一用“上帝”。
