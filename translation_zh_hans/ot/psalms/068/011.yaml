  text: אֲדֹנָ֥/י יִתֶּן אֹ֑מֶר הַֽ֝/מְבַשְּׂר֗וֹת צָבָ֥א רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/011.yaml
  text: The Lord gives the word[c][b][a]; the women who announce the good news are a great host.
translation:
  language: zh_hans
  text: 主赐下话语[a]；传好消息的妇女[b]是一大群[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话语”也可译作“信息”或“命令”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文使用阴性复数分词，直指“传好消息的妇女”或“女报信者”。
    reason: lexical_alternative
  - marker: c
    text: “一大群”也可译作“一大队”或“庞大的军队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这里是神的称号，并非四字神名；译作“主”简洁、庄重，也符合诗篇中的通常用法。
- source_word: יִתֶּן
  choice: 发出
  rationale: 该未完成式在诗歌语境中可表达当前或概括性的行动。“发出”与“话语”搭配自然，也保留神赐下或颁布信息的意思。
- source_word: אֹמֶר
  choice: 话语
  rationale: 该词可指所说的话、信息或命令。“话语”保持原文的简练和语义宽度，不预先限定为一般信息或军事命令。
- source_word: הַמְבַשְּׂרוֹת
  choice: 传好消息的妇女
  rationale: 这是阴性复数分词，意为传报好消息的人；明确译出“妇女”，保留原文标明的性别。
- source_word: צָבָא רָב
  choice: 人数众多，形成浩大的队伍
  rationale: צָבָא可指军队、队伍或群体，רָב表示众多、浩大。正文用“浩大的队伍”保留集体和潜在的军事色彩，同时加入“人数众多”使现代汉语表达完整自然。
theological_decisions:
- issue: הַמְבַשְּׂרוֹת的阴性复数形式
  choice: 明确译为“传好消息的妇女”
  alternative: 传报好消息的人／报信者
  rationale: 原文明确使用阴性复数；译出女性身份是保留其语法和文学特征，并不据此引申文本以外的教义结论。
- issue: יִתֶּן的时态体意义
  choice: 用无显式时态标记的“发出”
  alternative: 将要发出／赐下了
  rationale: 希伯来语未完成式在此可有现在、将来或诗歌叙述色彩。汉语“发出”不强行锁定时间，较好保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“主”保留神圣称号；分号呈现两分句的紧密关系。正文不把צָבָא单限定为“军队”，以保留“队伍／群体”与军事意象之间的语义空间。
