  text: יֵשֵׁ֣ב ע֭וֹלָם לִ/פְנֵ֣י אֱלֹהִ֑ים חֶ֥סֶד וֶ֝/אֱמֶ֗ת מַ֣ן יִנְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/007.yaml
  text: May he sit enthroned before God forever[b][a]; appoint steadfast love and truth to guard him.
translation:
  language: zh_hans
  text: 愿他永远在上帝面前坐在王位上[a]；求你派定慈爱和信实来守护他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他永远住在上帝面前。”原文动词可表示“坐着”“居住”或“长存”；在本诗的王室语境中，也可能含有安坐王位的意思。
    reason: lexical_alternative
  - marker: b
    text: “信实”也可译为“真实”或“真理”。“慈爱和信实”是原文常见的搭配，表达上帝慈爱而可靠的作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: 愿他……坐王位
  rationale: ישב可指坐、居住或安坐为王。王室诗篇的语境支持王权含义；未完成式在祈求语境中译为愿望句，同时以脚注保留“居住”的可能。
- source_word: עוֹלָם
  choice: 永远
  rationale: 表达持续无尽的时限；“永远”是现代汉语自然、庄重的对应。
- source_word: לִפְנֵי אֱלֹהִים
  choice: 在上帝面前
  rationale: 直接保留“在……面前、临在中”的空间与关系意涵。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: חסד包含仁慈、忠贞和坚定之爱的丰富含义；“慈爱”简洁自然，并与诗篇常见用语相称。
- source_word: אֱמֶת
  choice: 信实
  rationale: 在חסד ואמת这一固定搭配中，אמת侧重可靠、忠诚；“信实”比单译“真实”更贴合此处保护君王的语境。
- source_word: מַן
  choice: 求你派
  rationale: 按命令式理解为“指定、派定”。补出“求你”使对上帝的祈求在汉语中清楚自然。
- source_word: יִנְצְרֻהוּ
  choice: 守护他
  rationale: נצר意为看守、保全；复数动词把“慈爱和信实”人格化为守护君王的力量。
theological_decisions:
- issue: 王室祈祷中未完成式的语气
  choice: 译作愿望：“愿他……坐王位”
  alternative: 陈述将来：“他必……坐王位”
  rationale: 上下文为祈求，且下半句是向上帝发出的命令式请求；愿望语气使全节连贯，同时不把它处理成确定预言。
- issue: יֵשֵׁב是否明确指登基或统治
  choice: 正文采用“坐王位”
  alternative: “居住”或“长存”
  rationale: 王室语境支持安坐王位的含义，但该动词本身也可表示居住，因此用脚注保存真实的词义歧义。
- issue: חֶסֶד וֶאֱמֶת的表达
  choice: “慈爱和信实”
  alternative: “慈爱和真实”或“怜悯和真理”
  rationale: 这一词组常表达上帝坚定的爱与可靠忠诚；“信实”在此比抽象的“真实”更能体现关系性与守约意涵，但不额外加入原文没有明说的“盟约”。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“坐王位”显明王室语境，“求你派”保留下半句直接向上帝祈求的结构；避免使用较古奥的“施恩座前”“永世”等措辞。
