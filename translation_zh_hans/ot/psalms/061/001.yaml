  yaml_path: translation/ot/psalms/061/001.yaml
  text: Hear my cry[a], O God; listen to my prayer.
translation:
  language: zh_hans
  text: 上帝啊，求你听我的呼求[a]，留心听我的祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的高声呼喊”或“我的恳求”。希伯来语名词可指响亮的呼喊，在某些语境中也可指欢呼或歌声；这里因与祷告并列，更可能是迫切的求告。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: 求你听
  rationale: 这是向上帝发出的祈使语。汉语祷告中加“求你”既自然，也保留恳求语气；“听”保留原文具体的听觉意象。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 原文在此作直接呼语；“上帝啊”用现代、庄重且自然的汉语明确表达呼求。
- source_word: רִנָּתִי
  choice: 我的呼求
  rationale: רִנָּה可指响亮的呼喊、欢呼或歌声；本节与“我的祷告”平行，语境偏向迫切求告，因此译作“呼求”，同时以脚注保留词义范围。
- source_word: הַקְשִׁיבָה
  choice: 留心听
  rationale: 使役词干祈使式表达专注聆听；“留心听”是自然现代汉语，并体现其相对于前一“听”的加强语气。
- source_word: תְּפִלָּתִי
  choice: 我的祷告
  rationale: 这是表示祷告的常用名词；直译可保留与“我的呼求”的平行结构，并避免把两个词都译成“恳求”而抹平差异。
