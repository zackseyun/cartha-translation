source:
  edition: WLC
  text: יָמִ֣ים עַל יְמֵי מֶ֣לֶךְ תּוֹסִ֑יף שְׁ֝נוֹתָ֗י/ו כְּמוֹ דֹ֥ר וָ/דֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/006.yaml
  text: May you add days to the days of the king[b][a]; may his years be like generation after generation.
translation:
  language: zh_hans
  text: 愿你在王的年日上加添年日[a]；愿他的年岁如世世代代[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必在王的年日上加添年日；他的年岁必如世世代代。”希伯来语动词形式也可理解为对未来的陈述，而不是祈求。
    reason: alternative_reading
  - marker: b
    text: 希伯来语直译为“一代又一代”，表示世代相继、长久延续。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל יְמֵי מֶלֶךְ
  choice: 给王的年日加添年日
  rationale: 保留“日子加在日子上”的希伯来表达及其延年益寿之意，同时调整语序，使现代汉语自然清楚。
- source_word: תּוֹסִיף
  choice: 愿你……加添
  rationale: 该词为未完成式第二人称阳性单数；结合本诗祈求的语境，按表达愿望的祈使意味处理，但以脚注保留将其理解为将来陈述的可能。
- source_word: שְׁנוֹתָיו
  choice: 他的年岁
  rationale: 按马所拉读法理解为第三人称阳性单数后缀，指前句的王；“年岁”既庄重又符合寿命语境。
- source_word: כְּמוֹ דֹר וָדֹר
  choice: 延续一代又一代
  rationale: כְּמוֹ 表比较，דֹר וָדֹר 字面为“一代又一代”；补出“延续”以使汉语谓语完整，并传达世代相继、长久不绝的含义。
theological_decisions:
- issue: 本节是为王长寿而祈求，还是对未来作陈述
  choice: 正文译作祈求：“愿你……；愿……”
  alternative: “你必给王的年日加添年日；他的年岁必延续一代又一代。”
  rationale: תּוֹסִיף 形式上可作未完成式的未来陈述，也可在祷告语境中带愿望意味。上下文以向上帝祈求为主，因此正文采用祈愿式，同时用脚注保存语法上的另一可能。
- issue: 王的年岁“如一代又一代”的含义
  choice: 译为“延续一代又一代”
  alternative: “如同一代又一代”
  rationale: 不把这句话具体限定为个人永生、王朝延续或弥赛亚预言；译文只呈现原文所表达的跨越相继世代的长久性，保留其诗性张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“年日”“年岁”保留诗歌的平行结构；“加添年日”略带希伯来诗歌色彩，但在汉语宗教诗歌语境中清楚自然。脚注标记均置于对应正文之后。
