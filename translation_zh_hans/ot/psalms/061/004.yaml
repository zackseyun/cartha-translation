  text: Let me dwell in your tent forever[a]; let me take refuge in the shelter of your wings[b]. Selah
translation:
  language: zh_hans
  text: 愿我永远住在你的帐幕里[a]；愿我投靠在你翅膀的荫庇下。细拉[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿我……住”也可理解为“我要……住”；原文形式既可表达强烈的愿望，也可带有决意。“帐幕”可能使人联想到上帝的居所或圣所。
    reason: lexical_alternative
  - marker: b
    text: “细拉”是音译；这个词的确切含义不明，可能是一种礼仪或音乐标记。
    reason: textual_or_liturgical_note
lexical_decisions:
- source_word: אָג֣וּרָה
  choice: 愿我……住
  rationale: גור的Qal鼓励式第一人称单数在此表达强烈的愿望或意愿；“愿我……住”既体现祈愿语气，也比“寄居”更符合向上帝祷告的语境。
- source_word: בְ֭/אָהָלְ/ךָ
  choice: 在你的帐幕里
  rationale: אָהֶל本义为“帐棚、帐幕”，此处可能使人联想到上帝的居所或圣所；“帐幕”保留具体意象，又不直接将其解释为圣殿。
- source_word: עוֹלָמִ֑ים
  choice: 永远
  rationale: עוֹלָם的复数形式在此强调绵延不尽的时日；现代汉语用“永远”表达自然清楚。
- source_word: אֶֽחֱסֶ֨ה
  choice: 愿我藏身
  rationale: חסה意为投奔或寻求庇护。该未完成式承接前句的鼓励式，可理解为祈愿或决意；“愿我藏身”保持祷告语气，并与后面的隐蔽、保护意象自然衔接。
- source_word: בְ/סֵ֖תֶר
  choice: 在……的荫庇下
  rationale: סֵתֶר指隐蔽、受保护之处。“荫庇下”兼顾遮蔽与保护，并能与“翅膀”构成自然庄重的汉语意象。
- source_word: כְּנָפֶ֣י/ךָ
  choice: 你翅膀的
  rationale: 保留“翅膀”这一具体比喻，不将其改释为一般性的保护；所属结构与בְסֵתֶר共同构成“在你翅膀的荫庇下”。
- source_word: סֶּֽלָה
  choice: 细拉
  rationale: 该词的确切含义不明，采用圣经汉译中通行的音译，不作推测性解释。
theological_decisions:
- issue: “你的帐幕”所指的居所或圣所意象
  choice: 保留“你的帐幕”这一原文比喻
  alternative: 你的圣所／你的居所
  rationale: 该词可能暗示上帝临在的圣所，但原文使用具体的“帐幕”；不直接译成“圣所”可避免把可能的含义固定为单一的礼仪或神学解释。
- issue: 两个动词的语气
  choice: 均以“愿我”表达祈愿，并在脚注说明也可带有决意色彩
  alternative: 我要永远住……我要投靠……
  rationale: 首个动词明确是鼓励式，第二个未完成式在平行结构中很可能延续其祈愿意味；同时，希伯来语形式容许强烈意愿或决心的理解，因此不在正文或注释中排除该张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“帐幕”保留诗歌的具体圣所意象；“藏身在……荫庇下”自然呈现隐蔽和保护的双重含义。分号保留两行诗句的平行关系。
