  text: For you have been a refuge for me, a strong tower against the enemy.
translation:
  language: zh_hans
  text: 因为你曾作我的避难所，作抵御仇敌的坚固高塔。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַחְסֶה
  choice: 避难所
  rationale: 准确表达可供逃避危险、获得庇护之处的含义，也符合现代中文诗歌语体。
- source_word: מִגְדַּל עֹז
  choice: 坚固高塔
  rationale: מִגְדַּל意为“塔”，עֹז在此表示力量、坚固；合译为“坚固高塔”，保留防御性意象。
- source_word: מִפְּנֵי אוֹיֵב
  choice: 抵挡仇敌
  rationale: 介词短语可表达因仇敌威胁而得到保护、免受其害；“抵挡”在中文中自然呈现高塔的防御作用，同时避免生硬直译“从仇敌面前”。
- source_word: הָיִיתָ
  choice: 一直是
  rationale: 完成式回顾上帝以往并延续至今的庇护；“一直是”自然体现诗人的经验性陈述。
theological_decisions:
- issue: 上帝作为庇护者与防御堡垒的双重比喻
  choice: 保留“避难所”与“坚固高塔”两个并列意象
  alternative: 合并为单一的保护性表述
  rationale: 原文以两个名词性比喻强化上帝的保护，应保留其诗歌结构和神学张力。
- issue: מִפְּנֵי所表达的关系
  choice: 译作“抵挡仇敌”
  alternative: 译作“躲避仇敌”或“在仇敌面前”
  rationale: 此处既可着眼于远离仇敌，也可强调面对仇敌时的保护；结合“坚固高塔”的防御意象，“抵挡”最为自然，但不扩展为主动攻击。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；句式简洁，保留希伯来诗歌中两个保护性意象的并列关系。
