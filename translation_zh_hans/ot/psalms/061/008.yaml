base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/008.yaml
  text: So I will sing praise to your name forever[a], to fulfill my vows day by day.
translation:
  language: zh_hans
  text: 因此，我要永远歌颂你的名，以便天天履行我所许的愿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以便天天偿还我所许的愿”。这里的希伯来语动词与“愿”连用时，可指“偿还”或较广义的“履行”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: 这样
  rationale: 承接上文的祈求与信靠，表达由此得出的回应或决心；“这样”既保留推论色彩，也符合现代汉语诗歌语体。
- source_word: אֲזַמְּרָה
  choice: 我要……歌颂
  rationale: זמר 的 Piel 形式常指以歌唱或音乐赞美；“歌颂”自然传达敬拜含义，又不必额外补入原文没有明说的乐器。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 直译并保留希伯来语的表达；“名”在语境中可涵盖上帝所显明的品格与声誉，但正文不将这一内涵解释性展开。
- source_word: לָעַד
  choice: 永远
  rationale: 表达持续无尽的时间，现代汉语简洁自然。
- source_word: לְשַׁלְּמִי
  choice: 好……履行
  rationale: שלם 的 Piel 形式以“愿”为宾语时，可指偿付、还清或履行所许的愿；“履行”在现代汉语中清楚表达承担并完成许愿义务，同时以脚注保留“偿还”的词义可能。前置的“好”体现不定式结构可能带有的目的或结果关系。
- source_word: נְדָרַי
  choice: 我所许的愿
  rationale: 比单说“我的愿”更明确地表达 נדר 所指向上帝许下的誓愿，也符合现代汉语习惯。
- source_word: יוֹם יוֹם
  choice: 天天
  rationale: 对应原文“日、日”的重复形式，简洁传达每日持续、周而复始的意味。
theological_decisions:
- issue: 歌颂与还愿之间的关系
  choice: 用“好”保留目的或结果联系
  alternative: 译作并列的“并且天天履行”
  rationale: 原文介词 לְ 加不定式可表达目的或结果；“好”保留歌颂上帝之名与履行誓愿之间的紧密联系，而不进一步断定所许的愿本身必定就是赞美之愿。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“歌颂你的名”保留诗篇的传统意象；“天天”简洁再现原文重复所表达的持续性。脚注标记紧接存在词义选择的短语。
