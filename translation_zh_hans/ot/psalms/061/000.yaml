  text: For the choir director; with stringed instruments. Of David[a].
translation:
  language: zh_hans
  text: 交给乐长，用弦乐器。大卫的诗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大卫作”或“献给大卫”；这里的希伯来语结构可表示作者、关联或题献。
    reason: 保留 לְדָוִד 在诗篇标题中的语义弹性。
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇标题中通常指负责音乐演奏的人；“乐长”简洁、庄重，也不限定其必然是合唱团或乐队的指挥。前缀 לַ־ 以“交给”表达。
- source_word: עַל נְגִינַת
  choice: 用弦乐器
  rationale: עַל 在此类标题中可引出演奏方式或伴奏，נְגִינַת 指弦乐或弦乐伴奏；“用弦乐器”是自然、清楚的现代汉语表达。
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 标题中的 לְ 可表示作者、归属、关联或题献。“大卫的诗”在中文中自然，并较“大卫作”更能保留原文关系的宽泛性；“诗”由诗篇标题的体裁语境补出。
theological_decisions:
- issue: 大卫标题中 לְ 的含义
  choice: 大卫的诗
  alternative: 大卫作；献给大卫；与大卫有关
  rationale: 原文并不强制断定大卫直接执笔；采用较宽泛的所有格表达，并以脚注说明其他可能，避免把历史作者问题作过度确定的处理。
translation_notes:
  register: 采用简洁庄重的诗篇标题体。“乐长”保留古代礼仪音乐背景而不过度指定组织形式；标点将演奏指示与大卫标题分开。
