base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/002.yaml
  text: From the end of the earth I call to you when my heart grows faint[b][a]; lead me to a rock higher than I.
translation:
  language: zh_hans
  text: '我从地极向你呼求；


    当我心力衰竭时[a]，


    求你领我到那比我高的磐石那里[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当我心被压倒时。”
    reason: עָטַף可指内在力量衰竭、发昏，也可指被压倒或不胜负荷。
  - marker: b
    text: 或译：“求你领我到那对我来说太高的磐石那里。”
    reason: יָרוּם מִמֶּנִּי直译为“比我高”；该表达也可理解为“对我来说太高”，但不明确说明无法攀登。
lexical_decisions:
- source_word: מִקְצֵה הָאָרֶץ
  choice: 从地极
  rationale: קָצֶה表示边缘、尽头；“地极”是现代汉语中自然凝练的诗歌表达，保留了说话者身处遥远尽头的意象。
- source_word: אֵלֶיךָ אֶקְרָא
  choice: 向你呼求
  rationale: קרא可指呼喊、呼求；在祷告语境中，“呼求”既体现对象，也传达迫切感。
- source_word: בַּעֲטֹף לִבִּי
  choice: 我心衰弱时
  rationale: עטף在此表达内在力量衰退、发昏或被压倒；“心衰弱”保留身体与心灵交叠的诗性表达，脚注列出另一种合理理解。
- source_word: בְּצוּר
  choice: 到……磐石上
  rationale: צוּר是坚固的大岩石，具有安全与庇护的联想；“磐石”保留具体比喻，בְּ与引领动词结合，在汉语中自然表达为“领我到……磐石上”。
- source_word: יָרוּם מִמֶּנִּי
  choice: 比我高
  rationale: רוּם意为高、升高，מִמֶּנִּי构成比较；正文保留直接比较，不把可能蕴含的“我无法攀上”确定化。
- source_word: תַנְחֵנִי
  choice: 求你领我
  rationale: נחה的使役式意为带领、引导；加“求”符合汉语祷告语气，而“领我”准确体现依靠对方带领。
theological_decisions:
- issue: “磐石”的比喻意义
  choice: 正文保留“磐石”这一具体意象，不直接释为安全之地或上帝。
  alternative: 译作“避难所”或“安全之地”。
  rationale: 原文使用具体的צוּר；保留该意象既维持诗歌力量，也让其庇护和神学含义保持开放，不在翻译中提前解释。
- issue: 磐石的高度是否表示无法自行到达
  choice: 正文译作“比我高”，保留单纯比较的形式。
  alternative: 译作“我够不着的”或“对我来说太高的”。
  rationale: 原文可以暗示那磐石高得非靠带领不能到达，但比较结构本身未明确说“太高”；正文不强化这一推论，并在脚注中保存该读法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。以“地极”“呼求”“磐石”保持诗篇的凝练和意象；分行呈现呼求、困境与祈求的结构。所有脚注标记均置于相应词句之后。
