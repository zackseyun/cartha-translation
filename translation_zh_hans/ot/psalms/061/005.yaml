id: PSA.61.5
reference: Psalms 61:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אֱ֭לֹהִים שָׁמַ֣עְתָּ לִ/נְדָרָ֑/י נָתַ֥תָּ יְ֝רֻשַּׁ֗ת יִרְאֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you[a], O God, have heard my vows[b]; you have given me the inheritance of those who fear your name.
translation:
  language: zh_hans
  text: 因为你——上帝啊——已经听了我所许的愿；你已经赐下敬畏你名之人的产业。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：“你已经把敬畏你名之人的产业赐给我。”希伯来文没有明说“给我”，但上下文可以使人这样理解。
    reason: alternative_reading
  - marker: b
    text: “敬畏你名之人”指以虔敬和敬畏对待上帝、按此生活的人。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人祈求与确信的根据；“因为”自然保留其因果连接作用。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 上下文中的第二人称形式表明这是直接呼告；加“啊”符合现代汉语祷告语体。
- source_word: שָׁמַעְתָּ
  choice: 已经听了
  rationale: 完成式在此表示已经发生、且对当前仍有意义的行动；“听了”保留上帝垂听的含义，同时不额外明说愿已蒙应允。
- source_word: לִנְדָרָי
  choice: 我所许的愿
  rationale: נדר 指向上帝所许的愿；此译比略显生硬的“我的誓愿”更自然，也不将其限定为还愿祭物。
- source_word: נָתַתָּ
  choice: 你已经赐下
  rationale: 完成式表达已经成就、现今仍具效力的赐予；“赐下”适合上帝施予的语境。
- source_word: יְרֻשַּׁת
  choice: 产业
  rationale: 该词指承受所得的产业或基业。“产业”既简明，又保留所获归属与承受之物的意味。
- source_word: יִרְאֵי שְׁמֶךָ
  choice: 敬畏你名之人
  rationale: 保留“敬畏”所包含的畏惧与尊崇，不将其弱化为一般的尊敬；“你名”按原文保留。
theological_decisions:
- issue: 末句是否补出间接受词“给我”
  choice: 正文不补“给我”：“你已经赐下敬畏你名之人的产业”
  alternative: “你已经把敬畏你名之人的产业赐给我”
  rationale: 马所拉文本在 נָתַתָּ 后没有明确的第一人称间接受词。上下文可以使人理解为赐给诗人，但正文不应把这一推断写成明说；该理解收入脚注。
- issue: “敬畏你名”中的“敬畏”
  choice: 保留“敬畏”
  alternative: “尊崇”或“敬重”
  rationale: 原文 ירא 在此表达对上帝兼具畏惧和尊崇的虔敬态度；“敬畏”较完整地保留其神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“上帝啊”保留祷告中的直接呼告；“我所许的愿”和“产业”兼顾自然表达与原文用词。两个脚注标记均置于相关末句之后。
