  text: הִנֵּֽה שְׁמַֽעֲנ֥וּ/הָ בְ/אֶפְרָ֑תָה מְ֝צָאנ֗וּ/הָ בִּ/שְׂדֵי יָֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/006.yaml
  text: Look, we heard of it in Ephrathah; we found it in the fields of Jaar.
translation:
  language: zh_hans
  text: 看哪，我们在以法他听说过它；在雅珥的田野找到了它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意的语气，同时采用简洁、庄重且现代读者易懂的表达。
- source_word: שְׁמַעֲנוּהָ
  choice: 我们……听说过它
  rationale: 动词后缀为阴性单数，所指对象未在本节明说；用中性的“它”保留上下文指向，避免擅自补出“约柜”。
- source_word: בְאֶפְרָתָה
  choice: 在以法他
  rationale: 按地名音译，不把该名称解释性改写为其他地点。
- source_word: מְצָאנוּהָ
  choice: 找到了它
  rationale: 直接表达“找到”的完成动作，并以“它”对应同一阴性单数后缀。
- source_word: בִּשְׂדֵי יָעַר
  choice: 在雅珥的田野
  rationale: 将“雅珥”按专名处理，与本节的地理表达和英语审校层一致；“田野”为שְׂדֵי的自然对应。
theological_decisions:
- issue: 阴性单数后缀所指何物
  choice: 保留为“它”
  alternative: 明确译作“约柜”
  rationale: 原文在本节没有明说所指对象；虽然上下文通常使人联想到约柜，译文不应把这一解释直接写入正文。
- issue: “雅珥”是专名还是普通名词
  choice: 译作专名“雅珥”
  alternative: 译作“森林的田野”
  rationale: 该短语可让人联想到基列耶琳，但本节形式简略；采用专名音译可保留其地理指向，而不在正文中扩充为更完整的地名。
translation_notes:
  register: 采用现代、庄重而简明的诗歌语体；以分号呈现两个平行分句。“看哪”保留原文提示听者注意的功能，又不额外添加解释。
