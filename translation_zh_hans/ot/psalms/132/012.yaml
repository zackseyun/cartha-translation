  text: אִֽם יִשְׁמְר֬וּ בָנֶ֨י/ךָ בְּרִיתִ/י֮ וְ/עֵדֹתִ֥/י ז֗וֹ אֲלַ֫מְּדֵ֥/ם גַּם בְּנֵי/הֶ֥ם עֲדֵי עַ֑ד יֵ֝שְׁב֗וּ לְ/כִסֵּא לָֽ/ךְ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/012.yaml
  text: If your sons keep my covenant and my testimonies that I will teach them[a], then their sons also will sit on your throne forever.
translation:
  language: zh_hans
  text: 你的儿子们若遵守我的约和我的法度，就是我要教导他们的，他们的儿子们也必永远坐在你的宝座上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “法度”或译“训令”、“见证”。
    reason: עֵדֹתַי可指上帝所赐、为其旨意作见证的规定；不同汉语译词各突出其不同侧面。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 明确保留希伯来文真实的条件关系，且符合庄重、自然的现代汉语。
- source_word: יִשְׁמְרוּ
  choice: 遵守
  rationale: 与“约”和“法度”搭配自然，表达忠实持守并实行。
- source_word: בָנֶיךָ
  choice: 你的子孙
  rationale: 原文直译为“你的儿子们”，但在王朝承继语境中指大卫后世的男性王嗣；“子孙”在现代汉语中自然传达这一代际含义。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: “约”是בְּרִית在圣经盟约语境中的标准、清楚译法。
- source_word: וְעֵדֹתַי
  choice: 以及……法度
  rationale: עֵדוֹת指上帝所颁布、为其旨意作见证的约中规定；“法度”庄重且适合汉语经文语体，同时脚注保留其他可能译法。
- source_word: זוֹ אֲלַמְּדֵם
  choice: 我所教导他们的
  rationale: 将关系成分自然地修饰“法度”，保留这些法度由上帝教导他们的含义；希伯来文未必要求未来时，故不强加“将要”。
- source_word: גַּם
  choice: 也
  rationale: 准确表达递进的附加关系，即他们的后代同样承受应许。
- source_word: בְּנֵיהֶם
  choice: 他们的子孙
  rationale: 原文直译为“他们的儿子们”，在王位世袭语境中指后世王嗣；与前半句保持代际关系清楚。
- source_word: עֲדֵי עַד
  choice: 永远
  rationale: 自然表达该希伯来语短语所指的持久、无尽延续。
- source_word: יֵשְׁבוּ
  choice: 必……坐
  rationale: 条件成立后的结果带有确定性；“坐在宝座上”保留原文的登基执政意象。
- source_word: לְכִסֵּא לָךְ
  choice: 在你的宝座上
  rationale: 按王位承继语境自然处理该介词结构，指坐上属于大卫的王位。
theological_decisions:
- issue: 本节中大卫王朝应许的条件性
  choice: 译为真实条件：“若……也必……”。
  alternative: 将条件理解为修辞性的，或译得近乎无条件。
  rationale: 希伯来文אִם明确引入条件句；译文保留后代持续在位与守约之间的张力，不以更广泛的盟约神学消解本节措辞。
- issue: “儿子们”在王朝语境中的指向
  choice: 正文译作“子孙”，表达历代王嗣。
  alternative: 严格逐字译作“儿子们”。
  rationale: 上下两代的措辞和“永远坐在宝座上”表明这里关乎持续的王朝继承；“子孙”是现代汉语更自然的对应，但不将其泛化为与王位继承无关的所有后裔。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“若……也必……”清楚呈现条件与结果；避免生硬照搬希伯来语序。正文中的[a]与脚注完全对应。
