  text: צֵ֭ידָ/הּ בָּרֵ֣ךְ אֲבָרֵ֑ךְ אֶ֝בְיוֹנֶ֗י/הָ אַשְׂבִּ֥יעַֽ לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/015.yaml
  text: I will surely bless her provisions[a]; I will satisfy her poor with bread.
translation:
  language: zh_hans
  text: 我必大大赐福给她的粮食供应[a]；我要使她的穷人得饱足，有饼吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的食物”或“她的给养”。希伯来语这个词可指一座城的粮食供应或储备。
    reason: lexical_alternative
lexical_decisions:
- source_word: צֵידָהּ
  choice: 她的粮食储备
  rationale: צֵיד在此指供食用的储备或粮食供应；结合锡安这一城市语境，译作“粮食储备”既保留供应、储备之意，也避免“猎物”造成的误解。阴性单数后缀指向上文的锡安。
- source_word: בָּרֵךְ אֲבָרֵךְ
  choice: 我必大大赐福
  rationale: 不定式绝对形与限定动词连用，强化“赐福”的动作；“必大大赐福”以自然汉语同时表达确定性与强调语气。
- source_word: אֶבְיוֹנֶיהָ
  choice: 她的穷人
  rationale: אֶבְיוֹן通常指贫穷或有需要的人；“穷人”简洁自然，符合此处的社会经济含义。阴性单数后缀仍指锡安。
- source_word: אַשְׂבִּיעַ
  choice: 我要使……吃饱
  rationale: שׂבע的使役形表示使人饱足；结合宾语“饼/食物”，汉语“使……吃饱”具体自然，并准确传达饱足之意。
- source_word: לָחֶם
  choice: 吃饱（所吃的是粮食）
  rationale: לֶחֶם本义为饼、面包，也可在语境中泛指食物。因现代汉语中“用饼使穷人饱足”较生硬，正文以“吃饱”自然表达，所供应之食物已由上句“粮食储备”点明。
theological_decisions:
- issue: 阴性后缀所指
  choice: “她”指上文的锡安（耶路撒冷）
  alternative: 泛指耶和华的居所
  rationale: 诗篇132:13–14最近的阴性先行词是锡安，因此本节两个阴性单数后缀最自然地指向锡安；保留“她”也维持了诗歌中的拟人表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我必大大赐福”保留原文的强调结构；“粮食储备”贴合城市供应语境；后半句用“使她的穷人吃饱”表达使役形与饱足结果，避免生硬直译。
