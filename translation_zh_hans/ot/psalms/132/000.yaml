  yaml_path: translation/ot/psalms/132/000.yaml
  text: A Song of Ascents[a]. Remember, Yahweh[b], for David all his affliction.
translation:
  language: zh_hans
  text: '上行之歌。


    雅威啊，求你记念大卫[a]所受的一切苦难。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语此处可直译为“为大卫”；该介词也可表示“关于”或“涉及”大卫。
    reason: lexical_alternative
  - marker: b
    text: “苦难”也可译作“困苦”或“屈辱”；原词可指受苦、遭遇艰难或被压低。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 这是诗篇120—134篇标题的固定表达；“上行”保留了מעלות所含的上升、登行意象，也符合庄重而通行的中文诗篇用语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中较接近四字神名的音译来呈现专名性质，避免把专名改写成称号。
- source_word: לְדָוִד
  choice: 记念大卫
  rationale: 希伯来介词לְ可表示涉及、为了或归于；正文采用自然中文“记念大卫”，脚注保留“为大卫记念”的结构性可能。
- source_word: עֻנּוֹתוֹ
  choice: 他所受的一切苦难
  rationale: 该词在此指大卫所受的困苦、患难或屈辱；用“所受的苦难”清楚表达受苦含义，同时由“一切”对应כָּל。
theological_decisions:
- issue: “记念”所指的对象与内容
  choice: “记念大卫，记念他所受的一切苦难”
  alternative: “为大卫记念他所受的一切苦难”
  rationale: 前者在现代汉语中更自然，并可理解为求雅威顾念大卫及其受苦；但希伯来语לְדָוִד也容许“为大卫”的理解，因此以脚注保存歧义。
- issue: עֻנּוֹתוֹ的语义范围
  choice: 苦难
  alternative: 困苦、屈辱
  rationale: 马所拉读法主要指受苦或被压低的处境；“苦难”涵盖较广，不将其限定为内在谦卑或单一事件。
translation_notes:
  register: 采用简洁、庄重而可朗读的现代标准汉语。标题沿用“上行之歌”；祈求句用“雅威啊，求你……”体现诗歌呼告。为使中文自然，第二行重复“记念”，不改变希伯来文的语义关系；两处真实词义歧义均在脚注中保留。
