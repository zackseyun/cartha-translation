  text: אֲשֶׁ֣ר נִ֭שְׁבַּע לַ/יהוָ֑ה נָ֝דַ֗ר לַ/אֲבִ֥יר יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/002.yaml
  text: who swore to Yahweh and vowed to the Mighty One of Jacob:[a]
translation:
  language: zh_hans
  text: 他曾向雅威[a]起誓，向雅各的大能者许愿：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה 的音译；传统上也常译作“耶和华”或以“上主”代称。
    reason: 说明神名的原文形式及常见译法。
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 他曾
  rationale: 本词引出指向上一节“大卫”的关系从句。现代汉语若逐字译为“那……的”会显得残缺，因此用“他曾”自然承接上文，同时不改变所指。
- source_word: נִשְׁבַּע
  choice: 起誓
  rationale: נשׁבע 的尼法勒形在这里表示郑重宣誓；“起誓”简洁、庄重，也与下半句“许愿”形成平行。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 ל 表明起誓所面对的对象；יהוה 是以色列上帝的专名，音译为“雅威”，并以脚注说明。
- source_word: נָדַר
  choice: 许愿
  rationale: נדר 指许下誓愿；“许愿”直接传达其宗教语境中的郑重承诺，并保留与“起誓”的近义平行。
- source_word: לַאֲבִיר יַעֲקֹב
  choice: 向雅各的大能者
  rationale: אֲבִיר 在此是上帝的称号，意为“大能者、强者”；“雅各的大能者”既贴近原文结构，也保持诗歌的庄严语体。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，而非一般性的主名称号。“雅威”较直接地呈现这一专名；脚注保留必要说明，避免将专名与称号混同。
- issue: “雅各的大能者”所指
  choice: 保留为神圣称号“雅各的大能者”
  alternative: 雅各的强者
  rationale: 该短语是以色列上帝的传统称号。“大能者”在现代汉语中较自然、庄重，又不额外解释“雅各”究竟指个人还是其后裔，从而保留原文的称号形式。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“他曾”承接上一节的大卫；句末保留冒号，因为本节的誓愿内容在后续经文中展开。
