  text: נִשְׁבַּֽע יְהוָ֨ה לְ/דָוִ֡ד אֱמֶת֮ לֹֽא יָשׁ֪וּב מִ֫מֶּ֥/נָּה מִ/פְּרִ֥י בִטְנְ/ךָ֑ אָ֝שִׁ֗ית לְ/כִסֵּא לָֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/011.yaml
  text: 'Yahweh swore to David a sure oath[b][a]; he will not turn back from it: “From the fruit of your womb I will set one on your throne.”'
translation:
  language: zh_hans
  text: 耶和华向大卫起了真实可靠的誓[a]；他决不收回这誓言：“我要使你所生的后裔[b]坐在你的宝座上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“起了真实的誓”或“起誓说真实的话”；希伯来语用“真实”强调这誓言确定可靠。
    reason: lexical_alternative
  - marker: b
    text: 字面为“你腹中的果实”，指大卫自己所生的后代。参撒母耳记下7:12；使徒行传2:30；这应许在后来的经文中也有弥赛亚性的应用。
    reason: cross_reference
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: 起了誓
  rationale: 该词为 שבע 的尼法勒式，在这里表示起誓；“起了誓”自然、庄重，也符合诗歌对既成事实的陈述。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法“耶和华”，不以一般性称号代替专名。
- source_word: אֱמֶת
  choice: 这是信实的誓言
  rationale: אֱמֶת 字面可指“真实、信实”，在此紧接起誓的陈述，强调誓言真实可靠；独立译成判断句，既保留原词，又使中文清楚自然。
- source_word: לֹא יָשׁוּב מִמֶּנָּה
  choice: 他决不反悔
  rationale: שׁוב 与 מן 连用表示从所说的话转回或撤回；中文“决不反悔”准确传达不会撤回誓言的意思。
- source_word: מִפְּרִי בִטְנְךָ
  choice: 你亲生的后裔
  rationale: 希伯来语字面为“你腹中的果实”，是指血缘后代的具体表达。中文若直译为“腹中的果实”用于男性大卫会显生硬，“亲生的后裔”保留其血缘含义；字面意象列入脚注。
- source_word: אָשִׁית
  choice: 我要使……坐在
  rationale: שׁית 基本义为放置、安置；与宝座连用时，“使……坐在”在中文中自然表达立后裔为王，同时不过度引入原文未明说的称号。
- source_word: לְכִסֵּא לָךְ
  choice: 在你的宝座上
  rationale: 介词结构结合对大卫的第二人称后缀，在上下文中自然指大卫的王位；“你的宝座”比“为你的一个宝座”更符合现代汉语，也保留王朝承继之意。
theological_decisions:
- issue: 给大卫之应许的弥赛亚与圣约范围
  choice: 正文表述为上帝应许让大卫的血缘后裔坐上他的宝座，不在正文直接点明弥赛亚。
  alternative: 在正文中直接译成对弥赛亚的专指预言。
  rationale: 本节直接层面是给大卫的王朝应许；后续正典经文可赋予其弥赛亚性应用，但译文不应把后来的解释预先写入本节。
- issue: 后裔的单复数范围
  choice: 使用可作集合性理解的“后裔”，不明确限定为一个人或多人。
  alternative: 译为“你的一个子孙”或“你的众子孙”。
  rationale: “腹中之果”在形式上为单数集合表达，既可指某一位后代，也可承载王朝延续的范围；中文“后裔”保留这种开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华向大卫起了誓”保持诗篇叙述语气；“亲生的后裔”避免对男性使用“腹中果实”所造成的现代汉语障碍，同时以脚注保存原文意象。所有脚注标记均置于对应正文处。
