  text: זֹאת מְנוּחָתִ֥/י עֲדֵי עַ֑ד פֹּֽה אֵ֝שֵׁ֗ב כִּ֣י אִוִּתִֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/014.yaml
  text: This is my resting place forever; here I will dwell[a], for I have desired it.
translation:
  language: zh_hans
  text: 这是我永远的安歇之处；我要住在这里，因为我渴慕她[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我渴慕这地方。”这里的阴性后缀也可理解为指前面的安歇之处，而非指拟人化的锡安。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: 这是
  rationale: 阴性单数指示词在上下文中指向锡安，也就是随后的安歇之处；译作“这是”简洁自然。
- source_word: מְנוּחָתִי
  choice: 我安歇之处
  rationale: מְנוּחָה既可指“安歇”，也可指“安歇之处”；下句“这里”表明本节侧重地点，因此采用具体的处所义。
- source_word: עֲדֵי עַד
  choice: 永远
  rationale: 该固定表达表示持续到永久；“永远”准确而符合现代汉语习惯。
- source_word: פֹּה
  choice: 在这里
  rationale: 保留原文直接、明确的地点指示，并与“住”自然搭配。
- source_word: אֵשֵׁב
  choice: 我要住
  rationale: יָשַׁב本义可为“坐”，在神定居锡安的语境中表示居住或驻留；“住”与“安歇之处”及“这里”衔接自然，同时不额外引入登基含义。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出神住在锡安的理由；“因为”清楚保留因果关系。
- source_word: אִוִּתִיהָ
  choice: 我渴慕她
  rationale: 动词表达渴望、向往；阴性单数宾语后缀最自然地回指被拟人化的锡安。“她”保留原文的阴性指称和诗歌拟人色彩。
theological_decisions:
- issue: אִוִּתִיהָ中阴性单数宾语后缀的所指
  choice: 译作“她”，理解为拟人化的锡安。
  alternative: 译作“这地方”或“它”，理解为安歇之处或地点。
  rationale: 希伯来语后缀为阴性，最自然地指向诗歌中常以女性形象出现的锡安；正文保留这一拟人表达，同时用脚注说明也可能指安歇之处，以免消除原文真实的指称张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“安歇之处”保留诗歌的处所意象；“渴慕她”略带诗意，用以呈现锡安的女性拟人，脚注则保存另一种合理理解。
