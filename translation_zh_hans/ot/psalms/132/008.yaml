  text: קוּמָ֣/ה יְ֭הוָה לִ/מְנוּחָתֶ֑/ךָ אַ֝תָּ֗ה וַ/אֲר֥וֹן עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/008.yaml
  text: Arise[a], O Yahweh, to your resting place[b], you and the ark of your strength.
translation:
  language: zh_hans
  text: 耶和华啊，求你起来；你和你能力的约柜一同前往你的安歇之所[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的安歇”。希伯来词既可指安歇本身，也可指安歇之处；这里很可能指耶和华安然临在的地方。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“你能力的约柜”；也可理解为“彰显你大能的约柜”或“与你大能相连的约柜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: 求你起来
  rationale: 这是动词 קום 的祈使式，用于向耶和华发出礼仪性的恳求。“求你起来”既保留行动的召唤，也符合现代汉语向上帝祈求时庄重而自然的表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 将四字神名作为专名译出，而不以“主”这一称号替代；“耶和华”是现代中文读者广泛熟悉的音译形式。
- source_word: לִמְנוּחָתֶךָ
  choice: 到你的安歇之所去
  rationale: מְנוּחָה 既可指抽象的“安歇”，也可指安歇的地方。结合约柜与圣所的语境，正文采用“安歇之所”，同时以脚注保留另一种理解。
- source_word: אַתָּה
  choice: 你
  rationale: 希伯来文使用独立人称代词，强调耶和华亲自前往，并与后面的约柜并列；中文明确保留“你”。
- source_word: וַאֲרוֹן
  choice: 和……约柜
  rationale: אֲרוֹן 在此礼仪和圣所语境中指与耶和华同在相关的圣柜。中文采用约定俗成且易于识别的“约柜”。
- source_word: עֻזֶּךָ
  choice: 你大能的
  rationale: עֹז 可指力量、能力或威力。“你大能的约柜”保留原文紧凑的属格结构；其具体关系可能是约柜属于、承载或彰显耶和华的大能，正文不将其中一种解释绝对化。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名。正文以中文传统中广为人知的音译“耶和华”保留其专名性质，不用称号“主”取代。
- issue: “你大能的约柜”的关系
  choice: 保留紧凑的属格表达
  alternative: 彰显你大能的约柜；你大能的象征——约柜；你有力的约柜
  rationale: 原文“约柜＋你的大能”含义凝练，表明约柜与耶和华的大能密切相关，却没有明说是承载、象征还是彰显。正文不将这种神学和诗歌张力化约为单一解释。
- issue: מְנוּחָה 是“安歇”还是“安歇之所”
  choice: 安歇之所
  alternative: 安歇
  rationale: 介词 לְ 与移动命令及约柜语境使地点义较为合适，但该名词也可表达抽象的安歇，因此用脚注保留词义幅度。
translation_notes:
  register: 采用现代、庄重且可诵读的祈祷语体。“求你起来”体现恳求而非生硬命令；破折号清楚呈现“你和约柜”对前一行动主体的补充说明。为保持诗句的平行和强调，末尾补出“一同去”，没有增加新的神学内容。
