base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/017.yaml
  text: There I will cause a horn to sprout for David[b][a]; I have prepared a lamp for my anointed one.
translation:
  language: zh_hans
  text: 在那里，我要使大卫的角萌生[a]；我已为我的受膏者[b]预备一盏灯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角”是希伯来语中的形象说法，可象征力量或王权。整句也可译作“我要使大卫的角生长起来”。
    reason: lexical_alternative
  - marker: b
    text: “我的受膏者”也可译作“我的弥赛亚”。这里首先指大卫王系中蒙上帝膏立的君王，也可能带有更广的弥赛亚意蕴。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: 在那里
  rationale: 指回上文的锡安；既保留地点强调，也符合现代汉语表达。
- source_word: אַצְמִיחַ
  choice: 我要使……长出来
  rationale: 该使役形表达“使之萌生、长出”；此译保留原文生长的意象，而不直接解释为“兴起”。
- source_word: קֶרֶן
  choice: 角
  rationale: 原文直译为“角”，在希伯来诗歌中可象征力量或王权。正文保留具体意象，脚注说明其象征义。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 可表示归属、关联或为某人而有。结合汉语搭配，“使大卫的角长出来”自然地表达与大卫相关、为大卫而兴起的王权，同时不增补“后裔”等原文没有的词。
- source_word: עָרַכְתִּי
  choice: 我已……预备了
  rationale: 该词可指安排、陈设或预备；与“灯”搭配时，“预备”准确而自然。完成式译为“已”，保留行动已确立或已经完成的语气。
- source_word: נֵר
  choice: 灯
  rationale: 保留原文具体名词及其可能指向王朝延续、统治长存的诗性意象，不在正文中改译为“光”。
- source_word: לִמְשִׁיחִי
  choice: 为我的受膏者
  rationale: מָשִׁיחַ 的基本义是“受膏者”。这里首先指耶和华所膏立的大卫王系君王；此译也保留更广的弥赛亚意蕴，而不在正文中预先限定。
theological_decisions:
- issue: 大卫王权语境中 מְשִׁיחִי 的译法
  choice: 我的受膏者
  alternative: 我的弥赛亚
  rationale: 诗篇语境首先指大卫王系中蒙耶和华膏立的君王。“受膏者”忠实表达词义，并保留其可能具有的弥赛亚指向；“弥赛亚”作为备选列入脚注，以免正文过早消除所指范围的张力。
- issue: “角”的王权象征是否在正文中明说
  choice: 保留“角”的原始意象
  alternative: 译作“力量”或“王权”
  rationale: “角”是原文鲜明的诗歌意象，可象征力量或王权。正文不将比喻直接释义，以避免缩窄其意义；脚注为现代读者提供说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“角”“长出来”“灯”“受膏者”等希伯来诗歌的核心意象；脚注解释不易直观理解的象征和弥赛亚译法。脚注标记按其所解释词语就近放置。
