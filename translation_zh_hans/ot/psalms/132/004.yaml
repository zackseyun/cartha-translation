  text: אִם אֶתֵּ֣ן שְׁנַ֣ת לְ/עֵינָ֑/י לְֽ/עַפְעַפַּ֥/י תְּנוּמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/004.yaml
  text: I will not give sleep to my eyes[a], nor slumber to my eyelids—
translation:
  language: zh_hans
  text: 我必不容我的眼睛睡觉[a]，也不容我的眼皮打盹——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“若我给我的眼睛睡眠，给我的眼皮打盹……”这是誓言式表达，意思是“我必不容……”。
    reason: 说明誓言公式的字面形式与正文译法。
lexical_decisions:
- source_word: אִם
  choice: 以“必不”表达誓言式否定，不单独译作“若”
  rationale: 这里的 אִם 是誓言公式的一部分，隐含违誓后果，并非普通条件句。现代汉语用“必不”可自然传达郑重立誓的语气。
- source_word: אֶתֵּן
  choice: 让
  rationale: נתן 基本义为“给”；与“眼睛睡觉”搭配时，汉语译作“让”更自然，同时保留“不给眼睛睡眠”的意象。
- source_word: שְׁנַת
  choice: 睡觉
  rationale: 该词指睡眠。译作“睡觉”符合现代汉语表达，并与下句“打盹”形成近义平行。
- source_word: לְעֵינָי
  choice: 我的眼睛
  rationale: לְ 在 נתן 的结构中标示接受者；译文以“让我的眼睛……”自然重现原文身体部位的意象。
- source_word: לְעַפְעַפַּי
  choice: 我的眼皮
  rationale: עַפְעַף 指眼皮。保留这一身体部位，与“我的眼睛”构成诗体平行。
- source_word: תְּנוּמָה
  choice: 打盹
  rationale: 该词表示浅睡、瞌睡或困倦。译作“打盹”既区别于前面的“睡觉”，也保留原文近义递进的诗意。
theological_decisions:
- issue: 誓言公式中隐含的自我咒诅
  choice: 只译出誓言的否定效力“必不”，并以脚注说明字面形式
  alternative: 直译为“若我让我的眼睛睡觉……”或补出“愿我受罚”之类的后果
  rationale: 原文没有明说违誓后果。正文应传达誓言效力，但不宜擅自补入具体咒诅内容；脚注则保存希伯来语形式及其张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“睡觉／打盹”保留近义平行；句末破折号承接下一节尚未完成的誓愿内容。
