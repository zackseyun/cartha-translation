  text: כִּֽי בָחַ֣ר יְהוָ֣ה בְּ/צִיּ֑וֹן אִ֝וָּ֗/הּ לְ/מוֹשָׁ֥ב לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/013.yaml
  text: For Yahweh has chosen Zion[a]; he has desired it for his dwelling place.
translation:
  language: zh_hans
  text: 因为耶和华拣选了锡安，渴望以她为自己的居所。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她”也可按汉语习惯译作“锡安”或“它”。原文用阴性后缀回指锡安。
    reason: 说明希伯来语阴性后缀对锡安的回指，并保留中文代词或重复名词的表达选择；不改变“渴望”的语义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的宣告说明理由；现代汉语中“因为”自然保留这一因果连接。
- source_word: בָחַר
  choice: 拣选了
  rationale: 准确表达“选择、选定”；“拣选”符合庄重的经文语体，完成体“了”体现已经作出的选择。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，不用称号替代。
- source_word: בְּצִיּוֹן
  choice: 拣选了锡安
  rationale: 介词ב与בחר连用时标示被选中的对象；汉语宜直接以“锡安”作宾语。
- source_word: אִוָּהּ
  choice: 渴望以她
  rationale: אוה表达强烈的愿望或向往，比单纯“愿意”更充分；阴性单数后缀回指锡安，译作“她”保留希伯来语中可能存在的诗性人格化。
- source_word: לְמוֹשָׁב לוֹ
  choice: 为自己的居所
  rationale: מוֹשָׁב指居住之处；לוֹ兼有归属和为自身之意，合译为“自己的居所”自然且准确。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用现代中文圣经传统中最通行、可识别度最高的专名形式，而不以“主”等称号替代。
- issue: 锡安的代词
  choice: 她
  alternative: 它
  rationale: 原文阴性后缀明确回指锡安；中文诗歌中以“她”指城邑自然，也保留潜在的人格化意味，不把这一层张力悄然消除。
- issue: אוה的语义力度
  choice: 渴望
  alternative: 愿意
  rationale: 该动词含愿望、向往之意；“渴望”保留其较强的情感力度，同时不将它弱化为一般意愿。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“拣选”“居所”保持经文风格；“她”保留原文对锡安的阴性指称。脚注标记置于整句之后，涵盖相关译法说明。
