  text: א֭וֹיְבָי/ו אַלְבִּ֣ישׁ בֹּ֑שֶׁת וְ֝/עָלָ֗י/ו יָצִ֥יץ נִזְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/018.yaml
  text: I will clothe his enemies with shame[a], but on him his crown will flourish.
translation:
  language: zh_hans
  text: '我要使他的仇敌披上羞耻；

    他的冠冕却要在他身上绽放。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绽放”也可译作“发芽”“开花”或“繁盛”。希伯来文此处的动词带有植物生长的意象；“冠冕”也可译作“王冠”或“华冠”。
    reason: 说明动词的植物生长意象，以及冠冕名词的可选译法。
lexical_decisions:
- source_word: אֹיְבָיו
  choice: 他的仇敌
  rationale: 该词是带第三人称阳性单数词尾的复数名词；“他的仇敌”准确、自然。
- source_word: אַלְבִּישׁ
  choice: 我要使……披上
  rationale: 使役词形明确表达第一人称施事者，并保留“给人穿上”的比喻。
- source_word: בֹּשֶׁת
  choice: 羞耻
  rationale: 该名词表示羞耻、耻辱；与“披上”搭配可保留原文鲜明的衣着意象。
- source_word: וְעָלָיו
  choice: 他头上的……却
  rationale: 介词表示冠冕在他身上；汉语按冠冕的通常位置译作“他头上的”，并以“却”呈现上下两行的对比。
- source_word: יָצִיץ
  choice: 要绽放
  rationale: 动词本义涉及发芽、开花；“绽放”保留植物生长的诗歌意象，不把它仅抽象化为兴盛。
- source_word: נִזְרוֹ
  choice: 他的冠冕
  rationale: נֵזֶר可指冠冕、王冠，也可涉及分别为圣；本诗的君王语境支持“冠冕”，同时不额外加入特定弥赛亚解释。
theological_decisions:
- issue: 大卫之约与锡安语境中נִזְרוֹ的王权意象
  choice: 译作“他的冠冕”，保留君王意象，但不在正文中明说其弥赛亚含义。
  alternative: 译作“他的圣冠”或“他的分别为圣”
  rationale: 上下文谈到大卫王朝及耶和华的应许，“冠冕”最符合直接语境；更具体的神学认定并非本节词句本身所明说。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两行以“披上羞耻”与“冠冕绽放”形成鲜明对照；保留原文比喻，不将“绽放”解释性改写为王权兴盛。
