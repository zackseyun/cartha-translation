  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת זְכוֹר יְהוָ֥ה לְ/דָוִ֑ד אֵ֝ת כָּל עֻנּוֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/001.yaml
  text: A Song of Ascents[a]. Remember, O Yahweh[b], for David all his affliction.
translation:
  language: zh_hans
  text: 上行之歌。雅威啊，求你记念大卫[a]所受的一切苦难[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫”前的希伯来介词也可译作“为大卫”或“关于大卫”；这里可表示为大卫的缘故，也可表示与大卫有关。
    reason: lexical_alternative
  - marker: b
    text: “苦难”也可译作“艰辛”或“所受的屈辱”；原词可涵盖受苦、困顿或被降卑。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 这是该诗集标题的固定表达；“上行”贴近“上升、登上”的字面意义，同时避免武断确定其具体历史背景。
- source_word: זְכוֹר
  choice: 记念
  rationale: 命令式，向神发出祈求。“记念”既保留“记起”的基本意义，也能在祷告语境中表达采取眷顾行动的含意，而不将该含意直接扩写进正文。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通常拟音译出神的专名，不以“主”这一称号代替。
- source_word: לְדָוִד
  choice: 为大卫
  rationale: 介词 לְ 在这里可表示受益者或所关涉的对象；“为大卫”简洁地保留这两者之间的语义空间。
- source_word: עֻנּוֹתוֹ
  choice: 他所受的一切苦难
  rationale: 该词可涵盖困苦、患难及被降卑的经历。“苦难”在现代汉语中自然且范围较宽，不把意思限缩为自我克制或羞辱。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，而非“主”的称号；“雅威”较直接反映 YHWH 的通行拟音，同时保存其作为立约之神专名的性质。
- issue: לְדָוִד 所表达的关系
  choice: 为大卫
  alternative: 关于大卫；顾念大卫
  rationale: 原文可理解为替大卫、为大卫的缘故，也可表示与大卫有关。正文采用简洁而仍具一定开放性的“为大卫”，脚注注明另一种可能。
- issue: עֻנּוֹתוֹ 的语义范围
  choice: 他所受的一切苦难
  alternative: 他的一切艰辛；他一切受辱的经历
  rationale: 保留该词涉及受苦、艰辛或降卑的宽广含意，不将其专门解释为禁欲性的自我克制。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祷告语体。“雅威啊”保留直接呼求神名的形式；“记念”沿用现代汉语宗教及文学语境中仍可理解的庄重用词。
