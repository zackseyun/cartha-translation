base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/016.yaml
  text: And I will clothe her priests with salvation[b][a], and her faithful ones will shout for joy.
translation:
  language: zh_hans
  text: 我要使她的祭司披上救恩；她的忠信之民[a]必大大欢呼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她的圣民”或“她的虔诚人”；希伯来语所指的是以盟约忠诚和敬虔为特征的人。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语用同一词根的不定式绝对式和限定动词加强语气，直译近似“欢呼，他们必欢呼”，表示他们必大大欢呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹהֲנֶיהָ
  choice: 她的祭司
  rationale: 第三人称阴性单数后缀回指上下文中被拟人化为女性的锡安；“她的祭司”在现代汉语中自然，也保留原文指代。
- source_word: אַלְבִּישׁ
  choice: 我要使……披上
  rationale: 该使役式意为“使穿上、给……披上”；“披上”保留以衣服为喻的表达，并与“救恩”搭配自然。
- source_word: יֶשַׁע
  choice: 救恩
  rationale: 该词可指拯救、解救或胜利；“救恩”保留其宽广的神学含义，同时不排除现实解救与得胜的意味。
- source_word: חֲסִידֶיהָ
  choice: 她的忠信之民
  rationale: 该词指以盟约忠诚和敬虔为特征的人；“忠信之民”既表达忠诚与委身，也避免“圣徒”可能带入的后期宗派性联想。
- source_word: רַנֵּן יְרַנֵּנוּ
  choice: 必欢呼不已
  rationale: 不定式绝对形与限定动词连用，强化欢呼的动作；“欢呼不已”以自然汉语体现持续而强烈的喜乐呼声。
theological_decisions:
- issue: 盟约敬拜语境中 חֲסִידֶיהָ 的译法
  choice: 她的忠信之民
  alternative: 她的圣民；她的虔诚人
  rationale: “忠信之民”保留盟约忠诚和敬虔的双重意味，又不把该词限定为后期教会术语。
- issue: יֶשַׁע 的语义范围
  choice: 救恩
  alternative: 拯救；胜利
  rationale: 上下文容许神所赐的解救与得胜等含义；“救恩”作为较宽的译法，不将其过早收窄。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“披上救恩”保留原文隐喻；分号呈现两个平行分句。所有脚注标记均置于对应词句之后。
