  text: אִם אָ֭בֹא בְּ/אֹ֣הֶל בֵּיתִ֑/י אִם אֶ֝עֱלֶ֗ה עַל עֶ֥רֶשׂ יְצוּעָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/003.yaml
  text: Surely I will not enter the tent of my house[b][a]; surely I will not go up onto the bed of my couch—
translation:
  language: zh_hans
  text: 我必不进我家的帐棚[a]，也必不上我的床榻[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语采用重复“若……”的起誓格式，按语境意为“我必不……”。
    reason: lexical_alternative
  - marker: b
    text: “床榻”原文用了两个意义相近的词，都可指床、卧榻或躺卧之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 必不
  rationale: 这里是承接上文誓言的希伯来语起誓格式；字面虽为“若”，语境中的实际意思是坚决否定。译作“必不”既清楚又保留誓愿的力度。
- source_word: אָבֹא
  choice: 进
  rationale: בוא 在此为第一人称未完成式，指立誓者将要进入住所；“进”符合现代汉语搭配，并保留具体动作。
- source_word: בְּאֹהֶל בֵּיתִי
  choice: 我家的帐棚
  rationale: אֹהֶל 本义为“帐棚”，בֵּיתִי 为“我的家/房屋”。“我家的帐棚”保留原文将帐棚与家屋叠合的诗性表达，不擅自改成圣所或会幕。
- source_word: אֶעֱלֶה עַל
  choice: 上
  rationale: עלה 与 עַל 连用，字面有“上到……之上”的空间意味；中文说“上床”自然简洁，也准确表达动作。
- source_word: עֶרֶשׂ יְצוּעָי
  choice: 我的床榻
  rationale: 两个词都是卧具或躺卧之处的近义词。中文“床榻”以并列近义成分保留诗歌的叠加强调，同时避免生硬的“我卧榻的床”。
theological_decisions: []
