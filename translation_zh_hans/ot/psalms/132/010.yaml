  text: בַּ֭/עֲבוּר דָּוִ֣ד עַבְדֶּ֑/ךָ אַל תָּ֝שֵׁ֗ב פְּנֵ֣י מְשִׁיחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/010.yaml
  text: For the sake of David your servant[b][a], do not turn away the face of your anointed one.
translation:
  language: zh_hans
  text: 为了你仆人大卫的缘故，求你不要转脸不顾你所膏立的人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你不要拒绝你所膏立的人。”原文直译近于：“不要转离你所膏立之人的脸。”
    reason: lexical_alternative
  - marker: b
    text: “你所膏立的人”也可译作“你的弥赛亚”，尤其从大卫之约和整本圣经的弥赛亚语境来看。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: 为了……的缘故
  rationale: 该介词表达缘由或所依据的情分；在祈求语境中，“为了……的缘故”自然地呈现诗人以大卫为依据的恳求。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代中文通行的圣经人名译法。
- source_word: עַבְדֶּךָ
  choice: 你仆人
  rationale: 在君王、盟约和祷告语境中，译作“仆人”既自然，也保留对上帝顺服、归属的意味。
- source_word: אַל תָּשֵׁב
  choice: 求你不要转脸不顾
  rationale: אַל与未完成式在这里构成否定祈求；加入“求”符合中文祷告语气。“转脸不顾”保留 שוב 与“脸”构成的具体意象，同时使其含义清楚。
- source_word: פְּנֵי
  choice: 脸
  rationale: 希伯来文直译为“脸”；这里涉及接纳、眷顾或拒绝。中文“转脸不顾”保留这一形象而不将其完全抽象化。
- source_word: מְשִׁיחֶךָ
  choice: 你所膏立的人
  rationale: 该词本义为“受膏者”。“你所膏立的人”在现代中文中较自然，并保留其作为大卫家君王的直接所指及更广的弥赛亚意蕴，而不在正文中预先限定。
theological_decisions:
- issue: מְשִׁיחֶךָ 是否应直接译作弥赛亚称号
  choice: 你所膏立的人
  alternative: 你的弥赛亚
  rationale: 本诗直接语境关乎大卫及大卫家的君王。“你所膏立的人”保留希伯来文的王权用语，也容纳正典语境中的弥赛亚指向；脚注列出“你的弥赛亚”，以保留神学张力而不在正文中强行确定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你”明确祷告语气；“转脸不顾”保留原文有关“脸”的意象，又比生硬的逐字翻译更易懂。脚注标记按首次相关处依次列为[a][b]。
