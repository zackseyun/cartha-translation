  text: נָב֥וֹאָה לְ/מִשְׁכְּנוֹתָ֑י/ו נִ֝שְׁתַּחֲוֶ֗ה לַ/הֲדֹ֥ם רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/007.yaml
  text: Let us go into his dwelling place[b][a]; let us bow down at his footstool.
translation:
  language: zh_hans
  text: 让我们进入他的众居所[a]；让我们在他的脚凳前俯伏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的居所”。原文为复数。
    reason: lexical_alternative
  - marker: b
    text: 或译：“敬拜”。原文更直接描写俯伏下拜的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבוֹאָה
  choice: 我们进到
  rationale: בוא 的第一人称复数鼓励式表达共同的意愿或劝勉；“我们进到”自然体现“让我们进去”的语气，并与后面的地点相配。
- source_word: לְמִשְׁכְּנוֹתָיו
  choice: 他的居所
  rationale: מִשְׁכְּנוֹתָיו 在形式上是复数，但此处可作具有集合或强化意味的复数，指他的居住之处；正文用单数“居所”较符合现代汉语，脚注保留复数形式的可能。
- source_word: נִשְׁתַּחֲוֶה
  choice: 俯伏敬拜
  rationale: שׁחה 表示以俯伏、下拜的姿态表达崇敬；“俯伏敬拜”兼顾原文明确的身体动作及其敬拜语境。
- source_word: לַהֲדֹם רַגְלָיו
  choice: 在他的脚凳前
  rationale: הֲדֹם רַגְלָיו 直指“他双脚的凳子”，即“他的脚凳”；介词 ל 在此可按朝向或位置理解，用“在……前”符合汉语敬拜场景。
theological_decisions:
- issue: 两个第三人称单数阳性后缀所指为何
  choice: 仅译作“他的”，不在正文中明确所指
  alternative: 明确译作“耶和华的”或按约柜、锡安语境加以解释
  rationale: 本节原文只使用代词后缀，而诗篇上下文交织耶和华的居所、约柜与锡安主题；保留代词可避免替原文消除其文学与神学张力。
- issue: 俯伏动作与敬拜含义的关系
  choice: 译作“俯伏敬拜”，并以脚注说明可更直译为“俯伏”
  alternative: 正文只译“俯伏”或只译“敬拜”
  rationale: 原词明确描写俯伏动作，而语境又是敬拜；合译兼顾动作与功能，同时脚注让读者看见更严格的形式对应。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两个分句以逗号相连，保留希伯来诗句的平行结构；“脚凳”保留原有具体意象，不作神学化改写。
