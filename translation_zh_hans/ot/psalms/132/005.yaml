  yaml_path: translation/ot/psalms/132/005.yaml
  text: until I find a place for Yahweh[a], a dwelling place for the Mighty One of Jacob.
translation:
  language: zh_hans
  text: 直到我为雅威找到一处地方，为雅各的大能者找到居所[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “居所”在希伯来语中是复数，也可译作“住处”，传统上或译“帐幕”。
    reason: 说明原文的复数形式及词义选择，保留可能的理解。
lexical_decisions:
- source_word: עַד
  choice: 直到
  rationale: 承接上一节的誓言，表示誓言所指行动的终点；“直到”自然且准确。
- source_word: אֶמְצָא
  choice: 我……找到
  rationale: 这是מצא的Qal未完成式第一人称单数；在誓言语境中指说话者决意将要完成的行动。
- source_word: מָקוֹם
  choice: 一处地方
  rationale: 保留“地方、地点”的宽泛含义，不预先限定为圣所或圣殿。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词ל表示该地方是为他而寻；将四字神名יהוה音译为“雅威”，保留其专名性质。
- source_word: מִשְׁכָּנוֹת
  choice: 居所
  rationale: “居所”是现代中文中自然、庄重的表达；希伯来语原词为复数，但中文名词通常不标示单复数，因此以脚注说明，避免生硬地加上“多个”。
- source_word: לַאֲבִיר יַעֲקֹב
  choice: 为雅各的大能者
  rationale: אֲבִיר是表示强健、大能者的称号；“雅各的大能者”保留原文的称号结构及与前半句的平行关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其盟约专名的性质，也不以称号取代专名。
- issue: 复数מִשְׁכָּנוֹת如何体现在中文中
  choice: 正文译作“居所”，脚注注明原文为复数
  alternative: 多个居所；诸居所；帐幕
  rationale: 原文在“一个地方”之后使用复数名词，可能具有真实复数、集合性或诗歌性用法；正文不强行判定，脚注保留其数的形式与可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。重复“找到”以清楚呈现原文两行平行结构；“居所”在中文中不显式区分单复数，相关信息由脚注补足。
