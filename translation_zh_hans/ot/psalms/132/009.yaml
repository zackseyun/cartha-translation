  text: כֹּהֲנֶ֥י/ךָ יִלְבְּשׁוּ צֶ֑דֶק וַ/חֲסִידֶ֥י/ךָ יְרַנֵּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/009.yaml
  text: May your priests be clothed with righteousness[c][b][a], and may your faithful ones shout for joy.
translation:
  language: zh_hans
  text: 愿你的祭司披戴公义[a]，愿忠于你的人[b]欢呼[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”；希伯来语此词兼有道德正直和司法公平的含义。
    reason: lexical_alternative
  - marker: b
    text: “忠于你的人”也可译作“敬虔的人”或“忠信的人”；希伯来语指以忠诚和敬虔为特征的人。
    reason: lexical_alternative
  - marker: c
    text: “欢呼”也可译作“欢然歌唱”；希伯来语动词表示发声表达热烈的喜乐。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֶיךָ
  choice: 你的祭司
  rationale: כֹּהֵן明确指祭司；保留本诗圣所与敬拜的语境，并将第二人称阳性单数后缀译为“你的”。
- source_word: יִלְבְּשׁוּ
  choice: 披戴
  rationale: לבשׁ意为穿上、穿着；“披戴”自然保留以衣着为喻的表达，也适合庄重的祈愿语体。
- source_word: צֶדֶק
  choice: 公义
  rationale: צֶדֶק兼有道德正直与司法公平的含义；“公义”在此可涵盖两者，并与祭司如同披上衣服的意象相称。
- source_word: וַחֲסִידֶיךָ
  choice: 忠于你的人
  rationale: חָסִיד指以忠诚、敬虔和盟约之爱为特征的人；“忠于你的人”清楚表达其关系性的忠贞，避免“圣徒”可能带入的后期专门含义。
- source_word: יְרַנֵּנוּ
  choice: 欢呼
  rationale: רנן的加强词干表示以声音热烈喜乐；“欢呼”简洁自然，并保留其外显而高昂的喜悦。
theological_decisions:
- issue: 祷告语境中未完成式动词的意愿语气
  choice: 用两个“愿……”译作祈求
  alternative: 译作陈述或预告：“你的祭司必披戴公义，你忠于你的人必欢呼。”
  rationale: 本节在诗篇132篇的上下文中是向上帝发出的祈愿；“愿”准确传达希伯来语未完成式在此处的祈使、祷愿色彩，而不把它确定化为预言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“披戴公义”保留原文衣着隐喻；两个“愿”呈现祈祷语气。脚注标记按对应词语紧邻放置，未照搬英文咨询层中次序混乱的标记。
