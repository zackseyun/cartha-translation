id: PSA.5.11
reference: Psalms 5:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יִשְׂמְח֨וּ כָל ח֪וֹסֵי בָ֡/ךְ לְ/עוֹלָ֣ם יְ֭רַנֵּנוּ וְ/תָסֵ֣ךְ עָלֵ֑י/מוֹ וְֽ/יַעְלְצ֥וּ בְ֝/ךָ֗ אֹהֲבֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/011.yaml
  text: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
translation:
  language: zh_hans
  text: 但愿所有投靠你的人都欢喜，永远欢呼[a]！求你遮护他们[b]，使爱你名的人因你而欢欣雀跃！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢呼”也可译作“欢然歌唱”。希伯来语动词可指响亮的喜乐呼声，也可能包括歌唱。
    reason: lexical_alternative
  - marker: b
    text: “遮护他们”也可译作“遮盖他们”或“庇护他们”。希伯来语带有以覆盖来保护的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂמְחוּ
  choice: 但愿……都欢喜
  rationale: 该未完成式在祷告语境中可表达愿望；“但愿”保留祈愿语气，而非将其定为单纯的将来预告。
- source_word: חוֹסֵי בָךְ
  choice: 投靠你的人
  rationale: חסה 的分词表达寻求庇护、以某人为避难所；“投靠”兼具具体的保护意象与信赖含义。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 自然表达持续无尽的时间，与诗歌语体相称。
- source_word: יְרַנֵּנוּ
  choice: 欢呼
  rationale: רנן 的 Piel 形可指高声发出的喜乐呼喊，也可能包括歌唱；“欢呼”保留其热烈而不局限于歌唱。
- source_word: וְתָסֵךְ עָלֵימוֹ
  choice: 求你遮护他们
  rationale: סכך 的 Hiphil 形带有从上覆盖并保护的意象；“遮护”简洁保留覆盖与庇护两层含义。
- source_word: וְיַעְלְצוּ בְךָ
  choice: 使……因你而欢欣雀跃
  rationale: עלץ 表达强烈、振奋的喜悦；“欢欣雀跃”体现其力度，“因你”自然传达 בְךָ 所指以神为喜乐的根据与对象。
- source_word: אֹהֲבֵי שְׁמֶךָ
  choice: 爱你名的人
  rationale: 保留原文“你的名”，不将这一有关上帝所启示之身份、品格与声誉的表达简化为“爱你的人”。
theological_decisions:
- issue: 全节中的祈愿与预告之歧义
  choice: 将几个未完成式按祷告中的祈愿表达，译作“但愿”“求你”“使……”。
  alternative: 译为陈述性的将来时：“他们必欢喜……必欢呼……必欢欣雀跃。”
  rationale: 本诗的祷告语境支持祈愿读法；这种译法保留诗人的恳求语气，同时承认希伯来语未完成式也可能被理解为将来陈述。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。前半句用“但愿”，后接“求你……使……”，使中文祷告语气连贯；保留“投靠”“遮护”和“爱你名”等原文意象。
