  text: לֹֽא יִתְיַצְּב֣וּ הֽ֭וֹלְלִים לְ/נֶ֣גֶד עֵינֶ֑י/ךָ שָׂ֝נֵ֗אתָ כָּל פֹּ֥עֲלֵי אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/005.yaml
  text: The boastful will not stand before your eyes[b][a]; you hate all workers of wickedness.
translation:
  language: zh_hans
  text: 狂妄的人必不能在你眼前站立[a]；你恨恶一切作恶的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂妄的人”或译“自夸的人”、“傲慢的人”或“愚妄的人”。
    reason: lexical_alternative
  - marker: b
    text: “作恶的人”或译“行恶的人”或“作孽的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: 站立
  rationale: 该词的 Hitpael 形式表示站定、立于某人面前；“站立”既自然，也保留了人在上帝面前无法立足的临在或审判意味。
- source_word: הוֹלְלִים
  choice: 狂妄的人
  rationale: 此处指自夸、自负而狂妄的人，并非单指智力上的愚笨；“狂妄的人”与下半句的作恶者形成自然的道德平行。
- source_word: לְנֶגֶד עֵינֶיךָ
  choice: 在你眼前
  rationale: 保留希伯来文“眼前”的具体意象，同时在现代汉语中清楚表达处于上帝面前或视线之中的意思。
- source_word: שָׂנֵאתָ
  choice: 你恨恶
  rationale: 原词直接表达恨；“恨恶”不淡化经文的强烈措辞，又符合庄重而自然的汉语表达。
- source_word: פֹּעֲלֵי אָוֶן
  choice: 作恶的人
  rationale: 该结构直指施行或制造 אָוֶן 的人；此处 אָוֶן 具有邪恶、罪孽的道德含义。“作恶的人”简洁自然，并保留主动行恶的含义。
theological_decisions:
- issue: 上帝恨恶作恶之人的表述
  choice: 正文保留“你恨恶一切作恶的人”的直接陈述。
  alternative: 译作“你反对”或“你弃绝一切作恶的人”。
  rationale: 希伯来文 שָׂנֵאתָ 明确表示“恨恶”。不应为缓和神学张力而改弱原文措辞；译文保留其鲜明陈述，同时不作超出本节的解释。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“在你眼前”保留原文意象；分号呈现两个平行分句。所有脚注标记均置于正文相应词语之后。
