id: PSA.5.4
reference: Psalms 5:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י לֹ֤א אֵֽל חָפֵ֘ץ רֶ֥שַׁע אָ֑תָּה לֹ֖א יְגֻרְ/ךָ֣ רָֽע׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/004.yaml
  text: For you are not a God who delights in wickedness[a]; evil may not dwell with you.
translation:
  language: zh_hans
  text: 因为你不是喜爱邪恶的神；恶不能在你那里寄居。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人不能与你同住”或“作恶的人不能住在你那里”。
    reason: 原文רָע既可指抽象的“恶”，也可指“恶人”；יְגֻרְךָ含寄居、暂住之意。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的祈求并说明理由；“因为”自然呈现本节的论证关系。
- source_word: אֵל
  choice: 神
  rationale: 这里是诗人直接称呼独一的神；“神”是现代汉语中自然、庄重的对应词。
- source_word: חָפֵץ
  choice: 喜爱
  rationale: 该词不只是表示意愿，也含有以某事为乐、悦纳某事之意；“喜爱”简洁保留这种情感色彩。
- source_word: רֶשַׁע
  choice: 邪恶
  rationale: 这是表示恶行、罪恶或邪恶的抽象名词；“邪恶”保留其道德含义，并与下半句形成平行。
- source_word: יְגֻרְךָ
  choice: 不能在你那里寄居
  rationale: גור指寄居、暂住，常带客居意味；此处表达恶在神那里没有容身之处。“寄居”保留原文意象，“不能”则传达这种不相容与排斥。
- source_word: רָע
  choice: 恶
  rationale: 该词可指抽象的恶，也可实词化指恶人。正文采用“恶”，与上半句的“邪恶”形成紧密平行，同时借脚注保留人物性理解。
theological_decisions:
- issue: רָע应理解为抽象的“恶”，还是具体的“恶人”
  choice: 恶
  alternative: 恶人／作恶的人
  rationale: 希伯来语容许抽象与人物性两种理解。上半句的抽象名词“邪恶”支持正文采用“恶”，强调神与恶本身不相容；下一节则明确转向作恶者。脚注保留“恶人”的可能性，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在你那里寄居”保留希伯来语的客居意象；正文措辞简洁，以维持诗歌的平行结构。
