  yaml_path: translation/ot/psalms/005/003.yaml
  text: Yahweh[a], in the morning you hear my voice[b]; in the morning I lay my request before you and watch expectantly.
translation:
  language: zh_hans
  text: 雅威啊，清晨你必听见我的声音；清晨我向你陈明所求[a]，并且守望等候[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我向你摆列”或“我为你安排”。原文没有说明所摆列的对象；在这里可能是指把祷告或祈求呈到上帝面前。
    reason: lexical_alternative
  - marker: b
    text: 或译：“并且观看”或“并且怀着盼望等候”。原文动词可表示观看、守望，或期待地等候。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现上帝的专名，保留原文直接称呼圣名的特点，不以称号代替。
- source_word: בֹּקֶר
  choice: 清晨
  rationale: 该时间名词在此作状语；两次均译出，以保留诗句的重复、节奏和强调。
- source_word: תִּשְׁמַע
  choice: 你必听见
  rationale: 该未完成体可表达将来、惯常行为或带确信的期待；“必听见”自然传达诗人清晨祷告时的确信，同时不把它弱化为单纯听到声音。
- source_word: קוֹלִי
  choice: 我的声音
  rationale: 直译该词的基本义；“呼求”虽符合祷告语境，却比原文含义更强。
- source_word: אֶעֱרָךְ
  choice: 我向你陈明所求
  rationale: 该动词基本义为“排列、摆列、安排”。此处宾语省略，在祷告语境中很可能指诗人的祈求或申诉；译文以自然汉语表达呈到上帝面前之意，并用脚注保留较形式化的可能译法。
- source_word: לְךָ
  choice: 向你
  rationale: 保留介词“向你／为你”的方向性；与“陈明”搭配，在现代汉语中自然表达把祈求呈到上帝面前。
- source_word: וַאֲצַפֶּה
  choice: 并且警醒等候
  rationale: 该动词兼有观看、守望和期待之意；“警醒等候”在祷告语境中兼顾留意观看与怀着盼望等待的语义。
theological_decisions:
- issue: 如何译写神名 יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非“主”这一称号；采用“雅威”以直接保留其专名性质。
- issue: תִּשְׁמַע 所表达的时间与语气
  choice: 你必听见
  alternative: 你听见／你会听见
  rationale: 希伯来语未完成体在这里既可有将来指向，也可表达诗人确信上帝一向垂听；“必”传达确信，但不把经文扩展为关于应允方式的断言。
- issue: 省略的祷告对象如何处理
  choice: 陈明所求
  alternative: 向你摆列／为你安排
  rationale: 原文没有明说被“摆列”的对象。正文按祷告语境作最小限度补足，使汉语清楚；脚注同时保留原文较开放的表达，避免把它限定为某一特定祷告形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“清晨”重复两次，以保存希伯来诗歌的平行和强调；分号划分两个对应分句。“雅威啊”符合汉语直接呼告的习惯。
