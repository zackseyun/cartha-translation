source:
  edition: WLC
  text: כִּֽי אַתָּה֮ תְּבָרֵ֪ךְ צַ֫דִּ֥יק יְהוָ֑ה כַּ֝/צִּנָּ֗ה רָצ֥וֹן תַּעְטְרֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/012.yaml
  text: For you bless the righteous[a], O Yahweh; like a shield, favor surrounds him.
translation:
  language: zh_hans
  text: 因为你赐福给义人，耶和华啊；你的恩惠像盾牌一样环绕他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恩惠像盾牌一样给他加冠。”希伯来语动词可表示“加冠”，也可表示“围绕、环绕”；这里的盾牌意象较支持保护性环绕的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人祈求与确信的根据；“因为”自然保留其因果、解释作用。
- source_word: תְּבָרֵךְ
  choice: 赐福
  rationale: 未完成式在此表达惯常或确定的行动；汉语“赐福”无需明示时态，也能保留这种确信。
- source_word: צַדִּיק
  choice: 义人
  rationale: 单数形容词作名词，指具有代表性的义人，也可泛指义人这一类；“义人”简洁且保留单数形式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译神的专名，以区别于称号“主”，符合现代中文圣经读者熟悉的表达。
- source_word: כַּצִּנָּה
  choice: 像盾牌一样
  rationale: 前缀כְּ表示比拟；צִנָּה可指较大的盾牌，但正文用“盾牌”更自然，且不作不必要的具体化。
- source_word: רָצוֹן
  choice: 恩惠
  rationale: 这里指神悦纳、施恩的态度；“恩惠”既表达有利的眷顾，也适合保护性的意象。
- source_word: תַּעְטְרֶנּוּ
  choice: 环绕他
  rationale: 该动词可表示“加冠”或“围绕”；与盾牌意象结合时，“环绕”更自然地呈现保护性的包围，同时在脚注保留另一译法。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者广泛熟悉的专名“耶和华”，而不以“主”替代，从而保留其专名性质。
- issue: 义人与神赐福之间的陈述
  choice: 按原文直陈“你赐福给义人”
  alternative: 增译为有条件或功德性的因果关系
  rationale: 原文肯定神赐福给义人，却未在本节说明称义基础或赐福机制，因此不补入宗派性的解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“耶和华啊”保留呼语；后半句稍作汉语语序调整，以清楚表达“恩惠”如盾牌般环绕义人。
