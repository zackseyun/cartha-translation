source:
  edition: WLC
  text: כִּ֤י אֵ֪ין בְּ/פִ֡י/הוּ נְכוֹנָה֮ קִרְבָּ֪/ם הַ֫וּ֥וֹת קֶֽבֶר פָּת֥וּחַ גְּרוֹנָ֑/ם לְ֝שׁוֹנָ֗/ם יַחֲלִֽיקוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/009.yaml
  text: For there is nothing trustworthy in their mouth[a]; their inward part is destruction. Their throat is an open grave[c][b]; with their tongue they flatter.
translation:
  language: zh_hans
  text: 因为他们口中毫无可信的话[a]；他们的内在尽是毁灭[b]。他们的喉咙是敞开的坟墓；他们用舌头说谄媚的话[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 若严格保留本句开头的单数形式，也可译作“他口中毫无可信的话”。
    reason: alternative_reading
  - marker: b
    text: 或译：“他们里面尽是灾祸”，或“他们的内在是毁灭”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他们用舌头说圆滑的话。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人求上帝审断的理由；现代汉语用“因为”自然地表达因果关系。
- source_word: אֵין בְּפִיהוּ נְכוֹנָה
  choice: 他们口中毫无可信的话
  rationale: נְכוֹנָה 表示坚定、可靠或可信；在虚假言语的语境中译作“可信的话”既准确又自然。主文依照全节复数语境处理指称。
- source_word: קִרְבָּם
  choice: 他们里面
  rationale: 保留“内部、内在”的宽泛身体—人格隐喻，不把所指限定为“心”这一特定官能。
- source_word: הַוּוֹת
  choice: 尽是毁灭
  rationale: 该复数名词可指毁灭、灾祸或毁灭性的图谋；“尽是毁灭”保留谓语的强烈断言，并避免加入原文未明说的行为主体或方式。
- source_word: קֶבֶר פָּתוּחַ
  choice: 敞开的坟墓
  rationale: 直译并保存原诗关于死亡、吞噬和败坏言语的鲜明意象。
- source_word: גְּרוֹנָם
  choice: 他们的喉咙
  rationale: 言语意象中“喉咙”是自然且直接的对应，也与后面的“舌头”形成身体意象的连贯。
- source_word: לְשׁוֹנָם יַחֲלִיקוּן
  choice: 他们用舌头说谄媚的话
  rationale: יַחֲלִיקוּן 字面涉及“使光滑”，用于言语时表示说圆滑、奉承的话；主文明确表达其语用意义，脚注保留较贴近字面的译法。
theological_decisions:
- issue: בְּפִיהוּ 的单数形式与全节复数语境
  choice: 主文译作“他们口中”
  alternative: “他口中”
  rationale: 该词形本身是第三人称阳性单数，但随后“他们里面、他们的喉咙、他们的舌头”均为复数，整体显然描写一群恶人。主文采用复数以保持篇章连贯，同时用脚注保留形式上的单数。
- issue: קִרְבָּם 的人论隐喻
  choice: 他们里面
  alternative: 他们内心；他们内在的人
  rationale: 原词宽泛指人的内部或内在，不必专指情感、意志或思想。“里面”保存这种开放性，不以特定神学人论加以收窄。
- issue: הַוּוֹת 的含义范围
  choice: 毁灭
  alternative: 灾祸；毁灭人的图谋
  rationale: 原词可表达灾祸、毁灭或造成毁灭之事。选择较宽泛的“毁灭”，保留其既可能描述内在败坏、也可能指向害人图谋的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“喉咙是敞开的坟墓”这一具体诗歌隐喻；“口中、里面、喉咙、舌头”维持原文由内而外的身体与言语意象。主文不刻意仿古，也不将“毁灭”解释成某一特定教义概念。所有脚注标记均在主文对应位置出现。
