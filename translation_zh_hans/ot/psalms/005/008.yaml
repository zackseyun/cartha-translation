base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/008.yaml
  text: O Yahweh[a], lead me in your righteousness because of my enemies[b]; make your way straight before me.
translation:
  language: zh_hans
  text: 雅威啊，求你因我的仇敌[a]，在你的公义中引导我；求你使你的道路在我面前平直[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的仇敌”也可译作“那些窥伺我的人”或“埋伏等候我的人”；原词可能含有怀着敌意监视或伺机而动的意味。
    reason: lexical_alternative
  - marker: b
    text: “使……平直”也可译作“使……平坦”或“修直”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现神的专名，避免用称号取代原文的专名；呼格语气用“啊”表达。
- source_word: נְחֵנִי
  choice: 引导我
  rationale: נחה 表示带领、引导；“引导我”自然地表达祈求神指引方向的语境。
- source_word: בְצִדְקָתֶךָ
  choice: 在你的公义中
  rationale: 保留介词 ב 所表达的范围或准则，不把它单一解释为工具性的“凭借”；“公义”兼顾正直、公正及诗篇中的道德含义。
- source_word: לְמַעַן
  choice: 因
  rationale: 此处说明诗人面对敌对者而求神引导的缘由；“因”简洁地传达“由于、鉴于”的语义。
- source_word: שׁוֹרְרָי
  choice: 那些敌视、窥伺我的人
  rationale: 该词指敌对者，并可能带有怀着敌意监视或伺机而动的意味；正文同时保留敌意与窥伺的语义色彩。
- source_word: הושר
  choice: 使……平直
  rationale: ישר 的使役式命令语义为使之直、平或正；“使……平直”保留道路意象，也不排除“修直”或“铺平”的理解。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 直接、自然地对应原文方位短语，并与道路意象协调。
- source_word: דַּרְכֶּךָ
  choice: 你的道路
  rationale: דרך 既可指道路，也可引申为行事方式；“道路”在汉语诗歌语体中能保留这两层可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非“主”这一称号；“雅威”较直接地按学界通常重构的读音音译，不以传统混合读音或称号替代。
- issue: צדקה 在本节的含义
  choice: 公义
  alternative: 公正
  rationale: 这里所求的是符合神正直品格的引导；“公义”保留较宽广的道德含义，而不把原文限定为司法层面的公正。
- issue: “你的道路”与人的道路之间的关系
  choice: 保留“你的道路”
  alternative: 你要我走的路
  rationale: 原文明确使用第二人称所有格“你的”；不将其解释性改写为神为诗人指定的道路，从而保留原诗的表达张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以“求你”自然表达希伯来语命令式在祷告中的恳求语气。分号保留两项平行祈求。“在你的公义中”与“你的道路”尽量贴近原文，同时用脚注呈现 שׁוֹרְרָי 和 ישר 的真实词义幅度。
