id: PSA.5.1
reference: Psalms 5:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲמָרַ֖/י הַאֲזִ֥ינָ/ה יְהוָ֗ה בִּ֣ינָ/ה הֲגִֽיגִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/001.yaml
  text: Give ear to my words[a], O Yahweh; understand my groaning.
translation:
  language: zh_hans
  text: 雅威啊，求你侧耳听我的话，体察我的低吟[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的默想”、“我的喃喃低语”或“我的呻吟”。希伯来语可指内心的思量，也可指低声、含混的言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָרַי
  choice: 我的话
  rationale: 该词是“话语”一词的复数构造形式，带第一人称单数后缀；译作“我的话”直接、自然，也与后半句相呼应。
- source_word: הַאֲזִינָה
  choice: 求你侧耳听
  rationale: 该祈使形式表达恳求，含专心聆听之意。“侧耳听”保留希伯来语的形象性，“求你”则传达祷告语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用神的专名四字神名；采用常见音译“雅威”，不以称号替代专名。
- source_word: בִּינָה
  choice: 体察
  rationale: 该祈使形式源于“分辨、理解”。在祷告语境中，“体察”自然表达求神深入领会说话者未尽之意，同时不把动作弱化为单纯的“留意”。
- source_word: הֲגִיגִי
  choice: 我的低吟
  rationale: 该词可指内心思量、喃喃低语或含混的哀声。“低吟”兼顾内在思绪与低声发出的声音，适合哀诉语境，又避免把意义限定为明确的呻吟。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用专名而非称号。“雅威”较直接地音译该名，并保留以色列之神在经文中的个人、盟约性称呼。
- issue: הֲגִיגִי 的情感色彩
  choice: 低吟
  alternative: 默想；喃喃低语；呻吟
  rationale: 原词本身容许内在思量与低声出声两方面。正文采用“低吟”，保留哀歌氛围却不将其完全解释为痛苦呻吟；脚注列出主要可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你侧耳听”保留原文的诗歌意象；“体察”与“低吟”使上下两分句既对应又不机械重复。
