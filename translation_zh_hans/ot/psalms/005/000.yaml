lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐指挥
  rationale: 该词在诗篇标题中通常指负责音乐演奏或指导的人；“圣乐指挥”自然体现礼仪音乐语境，“交给”表达前缀 לְ 的题署用法。
- source_word: אֶל הַנְּחִילוֹת
  choice: 用吹管乐器
  rationale: אֶל 在音乐题署中可引出演奏方式、曲调或乐器；הַנְּחִילוֹת 的确切所指不明，可能泛指管类吹奏乐器，故正文采用较宽泛的译法并以脚注保留不确定性。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题的标准术语，指供歌唱并可能有乐器伴奏的诗歌；中文传统而自然的对应词为“诗”。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 标题中的 לְ 可表示作者、归属、奉献对象或与某一诗集的关联；“大卫的”保留这种范围，不强行限定为大卫亲自创作。
theological_decisions:
- issue: לְדָוִד 所表达的大卫与本诗的关系
  choice: 大卫的诗
  alternative: 大卫所作的诗；献给大卫的诗；与大卫有关的诗
  rationale: 原文的介词结构存在真实歧义；正文采用简洁的传统表达，脚注说明可能的关系，避免把作者身份当作唯一解释。
