  text: הַֽאֲשִׁימֵ֨/ם אֱֽלֹהִ֗ים יִפְּלוּ֮ מִֽ/מֹּעֲצ֪וֹתֵ֫י/הֶ֥ם בְּ/רֹ֣ב פִּ֭שְׁעֵי/הֶם הַדִּיחֵ֑/מוֹ כִּי מָ֥רוּ בָֽ/ךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/010.yaml
  text: Declare them guilty[a], O God; let them fall by their own counsels. Drive them away because of their many transgressions[b], for they have rebelled against you.
translation:
  language: zh_hans
  text: 上帝啊，求你定他们有罪；愿他们因自己的计谋而败倒[a]。因他们过犯累累，求你驱逐他们[b]，因为他们背叛了你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因自己的计谋而败倒”也可译作“愿他们因自己的计谋而跌倒”，即他们的谋划使他们归于失败。
    reason: lexical_alternative
  - marker: b
    text: “驱逐他们”也可译作“赶走他们”或“把他们逐出去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  choice: 定他们有罪
  rationale: אשם的使役式命令语气带有司法意味，是求上帝判定或认定他们有罪；此译保留审判语境，又不额外指定刑罚方式。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处是祷告中的直接呼告；“上帝啊”符合现代汉语诗歌与祷告语体。
- source_word: יִפְּלוּ
  choice: 愿他们……败倒
  rationale: 未完成式在此具有祈愿意味，承接对上帝的求告；“愿”明确表达祈愿，“败倒”则自然传达 נפל 的倒下、倾覆之意。
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: 因自己的计谋
  rationale: מֹעֵצוֹת 指谋划、计策；介词 מִן 在此可表示原因或来源，也可能理解为“从……中”。正文采用语境自然的因果理解，并以脚注保留另一种句法可能。
- source_word: בְּרֹב פִּשְׁעֵיהֶם
  choice: 他们过犯累累
  rationale: רֹב 表示众多、丰盛，פֶּשַׁע 指越界、悖逆性的过犯。此处的 ב 可作因由理解；“过犯累累”简洁而保留强烈的道德分量。
- source_word: הַדִּיחֵמוֹ
  choice: 驱逐他们
  rationale: נדח 的使役式命令语气表示使人被赶走、逐出；“驱逐”兼具力度与司法色彩。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述祈求的理由，现代汉语用“因为”衔接清楚自然。
- source_word: מָרוּ בָךְ
  choice: 他们背叛了你
  rationale: מרה 搭配 ב 表示反抗、悖逆某人；“背叛了你”直接传达他们针对上帝的反叛。
theological_decisions:
- issue: 咒诅诗中的审判祈求
  choice: 保留诗人直接求上帝定罪、使敌人败倒并驱逐他们的祈愿语气。
  alternative: 把这些句子弱化为单纯的预言或对后果的客观陈述。
  rationale: 希伯来文使用命令式和带祈愿色彩的未完成式，明确是向上帝提出审判的请求。直译其祈愿性质，既忠于文法，也不回避经文中的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保持诗篇祷告的直接性与力度。以“求你”和“愿”呈现命令式及祈愿语气；避免古奥表达，也不软化原文的审判语言。
