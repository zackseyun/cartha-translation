id: PSA.5.2
reference: Psalms 5:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַקְשִׁ֤יבָ/ה לְ/ק֬וֹל שַׁוְעִ֗/י מַלְכִּ֥/י וֵ/אלֹהָ֑/י כִּֽי אֵ֝לֶ֗י/ךָ אֶתְפַּלָּֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/002.yaml
  text: Pay attention to the sound of my cry for help[a], my King and my God, for to you I pray.
translation:
  language: zh_hans
  text: 求你留心听我呼救的声音，我的王、我的上帝，因为我向你祷告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我将向你祷告。”希伯来语形式可按语境表示现在、持续或将来的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: 求你留心听
  rationale: 该词是קשׁב的祈使式，要求专注聆听。“求你留心听”既保留命令式恳求的力度，也符合现代汉语祷告语体。
- source_word: לְקוֹל
  choice: ……的声音
  rationale: קוֹל指声音或嗓音；这里与“我的呼救”连用，译作“呼救的声音”保留原文结构，同时自然可懂。
- source_word: שַׁוְעִי
  choice: 我呼救
  rationale: שַׁוְעָה通常指在危难中求助的呼喊。“呼救”准确表达求援含义，强于泛指的“呼喊”。
- source_word: מַלְכִּי
  choice: 我的王
  rationale: 保留对上帝的君王称号及第一人称所属关系，不作额外神学发挥。
- source_word: וֵאלֹהָי
  choice: 我的上帝
  rationale: 直接表达带第一人称后缀的神圣称号，并与“我的王”构成并列呼语。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出恳求上帝垂听的理由；“因为”在现代汉语中清楚自然。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 准确表达祷告所指向的对象；现代汉语通常说“向你祷告”。
- source_word: אֶתְפַּלָּל
  choice: 我……祷告
  rationale: פלל的Hitpael未完成式第一人称单数。上下文可自然理解为当前或持续的祷告行为；汉语正文不强加明确时态。
theological_decisions:
- issue: 以君王称号称呼上帝
  choice: 我的王、我的上帝
  alternative: 我的君王、我的上帝
  rationale: 原文直接用“我的王”和“我的上帝”两个称号称呼同一对象。译文保留二者及其并列关系，不引入后期教义阐释。
- issue: אֶתְפַּלָּל的体貌与时间指向
  choice: 我向你祷告
  alternative: 我将向你祷告
  rationale: 希伯来语未完成式可按语境表示现在、持续、习惯或将来的行动。正文采用不标明时态的自然汉语，以保留主要歧义；脚注提示也可有将来含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”体现诗人的恳求，“留心听”传达专注垂听之意；“我的王、我的上帝”保留原文紧凑的双重呼语。脚注标记置于整句末，所释对象为“我向你祷告”。
