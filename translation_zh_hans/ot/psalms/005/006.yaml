  text: תְּאַבֵּד֮ דֹּבְרֵ֪י כָ֫זָ֥ב אִישׁ דָּמִ֥ים וּ/מִרְמָ֗ה יְתָ֘עֵ֥ב יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/006.yaml
  text: You destroy those who speak lies[b][a]; Yahweh abhors a man of bloodshed and deceit.
translation:
  language: zh_hans
  text: 你使说谎的人灭亡[a]；雅威憎恶好流人血又行诡诈的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必使说谎的人灭亡。”希伯来语动词在这里既可表示上帝一贯的作为，也可指将来的行动。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“流血和诡诈之人”，指以流血暴力和诡诈为特征的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאַבֵּד
  choice: 你使……灭亡
  rationale: 这是 אבד 的皮埃勒未完成式，第二人称阳性单数，直接称呼上帝，表达“使之灭亡、毁灭”。汉语不强加完成体或明确时态，可自然表达一般性的行动，同时由脚注保留将来义的可能。
- source_word: דֹּבְרֵי כָזָב
  choice: 说谎的人
  rationale: 原文直译为“说虚假之事的人”。“说谎的人”保留分词短语的行为意味，又符合现代汉语习惯，未压缩成单纯的身份标签。
- source_word: אִישׁ דָּמִים
  choice: 好流人血的人
  rationale: 该希伯来习语字面为“血之人”，指以流血、暴力为特征的人。“好流人血”既保留原文阳性单数所指的人，也不把含义过度缩窄为“杀人犯”。
- source_word: וּמִרְמָה
  choice: 又行诡诈
  rationale: מִרְמָה 可指欺骗、诡诈或背信。结合“人”来译作“行诡诈”，使并列结构在汉语中自然，并保留其行为与品格意味。
- source_word: יְתָעֵב
  choice: 憎恶
  rationale: תעב 的皮埃勒式表达强烈的厌弃和道德反感。“憎恶”庄重而自然，力度与原文相称。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译“雅威”呈现四字神名，而不以“主”这一称号代替。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近 Yahweh 的现代汉语音译“雅威”，保留其专名性质，不以称号替换。
- issue: תְּאַבֵּד 的时态与体貌
  choice: 你使……灭亡
  alternative: 你必使……灭亡
  rationale: 希伯来语未完成式在此既可理解为对上帝一贯行动的一般陈述，也可理解为将来的行动。正文采用不明确标注时态的汉语表述，并在脚注列出明确的将来读法，以保留歧义。
- issue: אִישׁ 的阳性单数表达
  choice: 好流人血又行诡诈的人
  alternative: 嗜血而诡诈者
  rationale: 原文用阳性单数 אִישׁ，但整个短语是品格习语。汉语“……的人”既可自然对应单数个体，也避免添加原文没有的复数含义；同时不将其狭义化为“杀人犯”。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“使……灭亡”保留使役力度；“好流人血又行诡诈的人”将希伯来习语自然化，同时由脚注交代其字面结构。分号对应原文两个平行分句。
