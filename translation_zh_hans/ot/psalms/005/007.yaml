  text: וַ/אֲנִ֗י בְּ/רֹ֣ב חַ֭סְדְּ/ךָ אָב֣וֹא בֵיתֶ֑/ךָ אֶשְׁתַּחֲוֶ֥ה אֶל הֵֽיכַל קָ֝דְשְׁ/ךָ֗ בְּ/יִרְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/007.yaml
  text: But as for me[a], by the abundance of your steadfast love I will enter your house[b]; I will bow down toward your holy temple in fear of you.
translation:
  language: zh_hans
  text: 但我却要凭你丰盛的慈爱[a]，进入你的居所；我要存着对你的敬畏[b]，向你的圣殿俯伏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“忠贞之爱”或“立约的信实”。
    reason: lexical_alternative
  - marker: b
    text: “敬畏”也可译作“惧怕”或“心存畏惧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 但我却
  rationale: 连词加独立代词在上下文中形成对比，把诗人与前文所说的恶人区别开来；“但我却”自然表达这一转折强调。
- source_word: בְּרֹב חַסְדְּךָ
  choice: 凭你丰盛的慈爱
  rationale: 介词 בְּ 在此可表达依据或凭借；חֶסֶד 指持久、忠贞而可靠的爱。“凭你丰盛的慈爱”表明诗人得以亲近上帝的根据，同时保留该词丰富的关系性内涵。
- source_word: אָבוֹא בֵיתֶךָ
  choice: 进入你的殿宇
  rationale: 未完成式在此表达决意或期待；בַּיִת 本义为“房屋、居所”，在敬拜语境中指上帝的居所。“殿宇”既符合现代汉语，也避免与下一分句的“圣殿”完全重复。
- source_word: אֶשְׁתַּחֲוֶה
  choice: 俯伏
  rationale: 该动词首先描写俯身、伏地的身体动作，并在语境中表达敬拜；译作“俯伏”保留了原文具体形象，而不只抽象地译为“敬拜”。
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: 向你的圣殿
  rationale: אֶל 表示朝向；הֵיכַל 可指宫殿或圣殿，在上帝居所的语境中译为“圣殿”最为恰当。
- source_word: בְּיִרְאָתֶךָ
  choice: 存着对你的敬畏
  rationale: יִרְאָה 涵盖惧怕、敬畏和震撼。“敬畏”在现代中文宗教语境中既保留面对上帝的严肃畏惧，也不把它缩减为惊恐；“存着”自然表达 בְּ 所表示的伴随状态。
theological_decisions:
- issue: 敬拜语境中 חֶסֶד 的表达
  choice: 慈爱
  alternative: 立约的信实／忠贞之爱
  rationale: “慈爱”是现代中文中自然、庄重且较为宽广的表达，可涵盖上帝持久而忠贞的恩爱；脚注提示其立约忠信的可能侧重，避免把词义缩窄为单纯怜悯。
- issue: 人在上帝面前的 יִרְאָה
  choice: 敬畏
  alternative: 惧怕／心存畏惧
  rationale: 原词同时具有惧怕、尊崇和震撼的张力。“敬畏”没有把它弱化为一般尊敬，也不会单方面解释为恐怖。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“但我却”凸显与前文恶人的对比；“殿宇／圣殿”分别对应 בֵיתֶךָ 与 הֵיכַל קָדְשְׁךָ；后半句调整为自然汉语语序，同时保留“敬畏”作为俯伏敬拜的伴随状态。
