id: PSA.7.11
reference: Psalms 7:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱ֭לֹהִים שׁוֹפֵ֣ט צַדִּ֑יק וְ֝/אֵ֗ל זֹעֵ֥ם בְּ/כָל יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/011.yaml
  text: God is a righteous judge[b][a], and a God who is indignant every day.
translation:
  language: zh_hans
  text: 神是公义的审判者[a]，也是天天愤怒的神[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神审判义人。”
    reason: syntactic_alternative
  - marker: b
    text: 或译：“神天天发怒。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处虽为形态上的复数形式，却以单数意义指独一的神；译作“神”符合诗篇语境和现代汉语习惯。
- source_word: שׁוֹפֵט צַדִּיק
  choice: 公义的审判者
  rationale: 分词 שׁוֹפֵט 可作名词性谓语，צַדִּיק 可修饰审判者，表达神的审判合乎正义；同时脚注保留另一种合乎语法的理解。
- source_word: וְאֵל
  choice: 也是……的神
  rationale: אֵל 在此与 אֱלֹהִים 平行，继续指同一位神；“也”体现连接词 וְ，并使两个描述在汉语中自然衔接。
- source_word: זֹעֵם
  choice: 愤怒
  rationale: 该分词表达持续或反复的强烈不悦。“愤怒”直接保留神震怒的语言，不作淡化；其较普通的译法“发怒”列于脚注。
- source_word: בְּכָל יוֹם
  choice: 天天
  rationale: 此短语通常指“每一天、日复一日”，而非单指某一天从早到晚；“天天”简洁自然地表达这种反复性。
theological_decisions:
- issue: 神震怒的表述
  choice: 天天愤怒
  alternative: 天天发怒
  rationale: 原文明确将持续或反复的愤怒归于神。正文不回避这一神学张力，也不增补愤怒的对象；脚注提供较直白的词汇替代。
- issue: 首句的句法关系
  choice: 神是公义的审判者
  alternative: 神审判义人
  rationale: 正文采用将 צַדִּיק 理解为修饰“审判者”的传统读法；但希伯来语也可能把它理解为“义人”，即审判的对象，因此以脚注保留真实的句法歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“审判者”保留司法意象；“天天”比“每一天”更自然，又不失诗歌的凝练。正文用“也是……的神”体现原文两个神名称谓之间的并列，同时避免生硬重复。
