  text: יְהוָ֣ה אֱ֭לֹהַ/י אִם עָשִׂ֣יתִי זֹ֑את אִֽם יֶשׁ עָ֥וֶל בְּ/כַפָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/003.yaml
  text: O Yahweh my God[a], if I have done this, if there is injustice in my hands—
translation:
  language: zh_hans
  text: 耶和华我的神啊，我若做了这事，我手中若有不义——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，保留直接呼求盟约之神的语气。
- source_word: אֱלֹהַי
  choice: 我的神
  rationale: 该词带第一人称单数后缀，直译为“我的神”；与前面的神名构成直接称呼。
- source_word: אִם
  choice: 若
  rationale: 两次出现均引出条件式的自我申辩；“若”简洁庄重，也自然衔接下文尚未结束的自咒条件句。
- source_word: עָשִׂיתִי זֹאת
  choice: 我做了这事
  rationale: 忠实表达עשה的第一人称单数完成式与指示代词“这”，且不擅自说明“这事”的具体所指。
- source_word: יֶשׁ
  choice: 有
  rationale: 以自然中文表达存在意义，与“我手中”组成“我手中若有……”的句式。
- source_word: עָוֶל
  choice: 不义
  rationale: 既涵盖不公、恶行与道德罪责，也保留本诗司法申诉语境中的庄重色彩。
- source_word: בְּכַפָּי
  choice: 我手中
  rationale: 保留希伯来文“在我的手掌／手中”的身体意象，同时在中文中可自然表示行为上的责任或罪责。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用现代中文圣经传统中最广为人知的专名“耶和华”，而不以“主”替代，从而保留专名性质。
- issue: “手中有不义”的罪责含义
  choice: 保留具体意象，不在正文解释为“我有罪”
  alternative: 我若犯了不义
  rationale: 原文以“手中”表达行为与罪责；保留这一意象，可避免把具有诗意和一定语义张力的说法压缩成抽象的罪责断言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“啊”体现直接呼告；重复“若”保留原文条件句的平行结构；破折号表明本节语意延续至后文。
