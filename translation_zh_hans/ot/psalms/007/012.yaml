  text: אִם לֹ֣א יָ֭שׁוּב חַרְבּ֣/וֹ יִלְט֑וֹשׁ קַשְׁתּ֥/וֹ דָ֝רַ֗ךְ וַֽ/יְכוֹנְנֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/012.yaml
  text: If he does not turn back[a], he will sharpen his sword[c][b]; he has bent his bow and made it ready.
translation:
  language: zh_hans
  text: 他若不回转[a]，他就要磨利他的剑[b]；他已经拉开他的弓，把它预备好了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回转”也可译作“悔改”。希伯来语动词的基本意思是“转回、返回”，在这里可含悔改之意。
    reason: lexical_alternative
  - marker: b
    text: 这些“他／他的”通常按上下文理解为：不回转的是恶人，磨剑、张弓的是施行审判的神；也有人认为后面的动作仍是恶人所做。原文没有明说主语已经转换。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: 若不
  rationale: 保留希伯来文条件句结构，简洁自然，不把条件改写成更强的断言。
- source_word: יָשׁוּב
  choice: 回转
  rationale: שׁוב 的基本义是“转回、返回”；在审判语境中可含悔改之意，但“回转”保留了较宽的词义。
- source_word: חַרְבּוֹ יִלְטוֹשׁ
  choice: 磨利他的刀
  rationale: לטש 在此指磨快、磨利刀刃；“磨利”既贴近原文，又符合现代汉语的庄重语体。
- source_word: קַשְׁתּוֹ דָרַךְ
  choice: 拉开他的弓
  rationale: דרך 与弓连用，表示把弓张开、拉开以备发射；“拉开”比机械直译更自然，同时保留原文动作意象。
- source_word: וַיְכוֹנְנֶהָ
  choice: 预备妥当
  rationale: כון 在此表达使弓准备就绪；阴性宾语后缀指向前面的“弓”。
theological_decisions:
- issue: 第三人称单数代词所指及条件句与主句之间可能的主语转换
  choice: 正文始终保留“他／他的”，不直接补明为“神”或“恶人”；脚注说明主流语境理解。
  alternative: 明确译为“他若不回转，神就要磨利自己的刀”；或把各处都理解为恶人。
  rationale: 上下文较自然的理解是：不回转者为恶人，而预备审判兵器者为神；但本节希伯来文本身没有在主句中明说“神”，连续的第三人称形式也容许读者理解为同一人。正文保留代词，避免消除真实的指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“回转”保留诗篇语体及悔改含义的开放性；“磨利”“拉开”“预备妥当”形成清楚有力的兵器预备画面。正文不补出“神”，以保存原文代词指向的歧义。
