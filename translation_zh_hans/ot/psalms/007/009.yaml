  text: יִגְמָר נָ֬א רַ֨ע רְשָׁעִים֮ וּ/תְכוֹנֵ֪ן צַ֫דִּ֥יק וּ/בֹחֵ֣ן לִ֭בּ֗וֹת וּ/כְלָי֗וֹת אֱלֹהִ֥ים צַדִּֽיק־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/009.yaml
  text: Please let the evil of the wicked come to an end, but establish the righteous—O righteous God who examines hearts and kidneys.
translation:
  language: zh_hans
  text: 愿恶人的恶止息，愿你坚立义人——公义的上帝啊，你察验人心和肾脏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肾脏”：希伯来文直译为“肾脏”；在古代希伯来语中常与“心”并列，指人最深的内在。
    reason: 保留כְלָיוֹת的字面身体意象，同时说明其在原语境中的惯用含义，避免将其误解为单纯现代解剖描述。
lexical_decisions:
- source_word: יִגְמָר נָא
  choice: 愿……终止
  rationale: יִגְמָר表达“结束、止息”，נָא使祈求语气更鲜明；中文用“愿”自然传达诗歌中的恳求。
- source_word: רַע רְשָׁעִים
  choice: 恶人的恶
  rationale: 保留原文“恶”与“恶人”的词根呼应，也不把所指限缩为行为、暴力或灾祸。
- source_word: וּתְכוֹנֵן צַדִּיק
  choice: 愿你坚立义人
  rationale: תְכוֹנֵן可指使之稳固、确立；补出原文动词中隐含的第二人称主语“你”，以符合现代汉语。צַדִּיק在此按集合性单数译为“义人”。
- source_word: וּבֹחֵן
  choice: 察验
  rationale: 兼具细察与检验之意，适合上帝洞察人的诗歌语境。
- source_word: לִבּוֹת וּכְלָיוֹת
  choice: 人心和肺腑
  rationale: לִבּוֹת为“心”，כְלָיוֹת字面为“肾脏”，在希伯来语人观中可指最深处的思想情感；“肺腑”既保留身体内在器官的意象，又是现代中文可理解的内心深处表达。
- source_word: אֱלֹהִים צַדִּיק
  choice: 公义的上帝啊
  rationale: 将צַדִּיק理解为修饰אֱלֹהִים，并用呼语形式承接整句祈求；不改变“上帝是公义的”这一陈述。
theological_decisions:
- issue: 末句צַדִּיק的句法归属
  choice: “公义的上帝啊”
  alternative: “察验人心和肺腑的上帝是公义的”
  rationale: 希伯来语词序允许末尾צַדִּיק作述语，也可与אֱלֹהִים紧密结合。结合诗句的祈求语气，采用呼语较自然，但不增加超出原文的神学解释。
- issue: “心和肾脏”的人论意象
  choice: “人心和肺腑”
  alternative: “人心和肾脏”或“人心和心思”
  rationale: 不将两者简单等同于现代心理学范畴，也避免“肾脏”在普通中文中造成纯解剖意义的突兀；“肺腑”保留古代身体意象所表达的内在深处。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留诗歌的平行结构和连续祈愿语气。用两个感叹句体现נָא及祈求的迫切感；末句作为对上帝的呼求，简洁有力。
