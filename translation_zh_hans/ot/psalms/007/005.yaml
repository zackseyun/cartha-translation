  text: יִֽרַדֹּ֥ף אוֹיֵ֨ב נַפְשִׁ֡/י וְ/יַשֵּׂ֗ג וְ/יִרְמֹ֣ס לָ/אָ֣רֶץ חַיָּ֑/י וּ/כְבוֹדִ֓/י לֶ/עָפָ֖ר יַשְׁכֵּ֣ן סֶֽלָה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/005.yaml
  text: let the enemy pursue my life and overtake it[a]; let him trample my life to the ground and make my glory dwell in the dust[b]. Selah
translation:
  language: zh_hans
  text: 愿仇敌追赶我的性命[a]，追上我；愿他把我的生命践踏在地上，使我的荣耀住在尘土中[b]。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”或译“灵魂”；希伯来语 נַפְשִׁי 可按语境指人的自我、灵魂或生命。
    reason: lexical_alternative
  - marker: b
    text: “荣耀”或译“尊荣”或“尊严”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרַדֹּף
  choice: 愿……追赶
  rationale: 此处承接上一节的条件性起誓，带有自我咒诅式的祈愿语气；“追赶”保留了动词的基本意义。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 希伯来语为单数，未带冠词；汉语名词通常不必用量词标明不定性，“仇敌”自然地保留其泛指而单数的语境意义。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נפשׁ在这里指遭追赶、可能被夺去的生命或整个活人，而非必然指与身体分离的“灵魂”；“性命”贴合具体危险的语境。
- source_word: וְיַשֵּׂג
  choice: 追上我
  rationale: 该动词意为追及、赶上。原文宾语省略，现代汉语补出“我”最自然，也符合追赶诗人的画面。
- source_word: וְיִרְמֹס
  choice: 愿他……践踏
  rationale: 保留祈愿语气及踩踏在脚下的强烈暴力意象。
- source_word: לָאָרֶץ
  choice: 在地
  rationale: 与“践踏”搭配时，“在地”比直译“向地/向大地”更符合现代汉语，同时保留原有空间意象。
- source_word: חַיָּי
  choice: 我的生命
  rationale: 此复数形式在诗歌中惯用于指“生命”；译作“生命”自然准确，并与前句“性命”形成近义复现。
- source_word: וּכְבוֹדִי
  choice: 我的荣耀
  rationale: כבוד可指荣耀、尊荣或尊严；“荣耀”保留诗句较宽广而高昂的隐喻，不把含义过早限定为社会名誉。
- source_word: לֶעָפָר
  choice: 在尘土中
  rationale: 与使役式“住”搭配，译为“在尘土中”自然，并保留受辱与死亡的诗歌意象。
- source_word: יַשְׁכֵּן
  choice: 使……住
  rationale: 这是שׁכן的使役式，意为使之居住或安置；译文保留其使役结构及原文刻意而强烈的诗性表达。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词的确切功能不明，采用传统音译，避免以意译造成虚假的确定性。
theological_decisions:
- issue: נַפְשִׁי所表达的人论含义
  choice: 我的性命
  alternative: 我的灵魂
  rationale: 上下文描写追赶、追上和践踏，重点是诗人的生命与全人遭受危险；“性命”避免把原词限定为非物质灵魂，也不否定“灵魂”这一可能的词义。
- issue: כְבוֹדִי在诗歌性自指中的含义
  choice: 我的荣耀
  alternative: 我的尊荣／我的尊严
  rationale: 原词可指诗人的荣耀、尊荣或有分量的自我。“荣耀”保留原文的诗性张力，其他较具体的理解列入脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“愿……”重现自我咒诅中的祈愿语气；“使我的荣耀住在尘土中”有意保留原文不寻常的使役结构和诗歌意象，未将其扁平化为“使我蒙羞”或“置我于死地”。
