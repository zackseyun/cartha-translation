  text: וַ/עֲדַ֣ת לְ֭אֻמִּים תְּסוֹבְבֶ֑/ךָּ וְ֝/עָלֶ֗י/הָ לַ/מָּר֥וֹם שֽׁוּבָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/007.yaml
  text: And let the assembly of peoples surround you[b][a]; and over them return on high.
translation:
  language: zh_hans
  text: 愿万民[a]的会众环绕你；求你在他们之上回到高处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万民”也可译作“列国”。
    reason: lexical_alternative
  - marker: b
    text: 原文此处为阴性单数，也可译作“在它之上”，把“会众”视为一个整体。
    reason: alternative_reading
lexical_decisions:
- source_word: עֲדַת
  choice: 会众
  rationale: 指聚集起来的群体。“会众”简洁庄重，并能表达此处由万民组成的集合体；语境并不要求赋予其特定宗教组织含义。
- source_word: לְאֻמִּים
  choice: 万民
  rationale: 指多个族群或人民。“万民”在现代中文诗歌体经文中自然，也保留复数群体的广泛含义；也可译作“列国”。
- source_word: תְּסוֹבְבֶךָּ
  choice: 愿……环绕你
  rationale: 动词意为“围绕、环绕”。结合上下文，将未完成式理解为祈愿语气较合适，而不是单纯陈述将来之事。
- source_word: וְעָלֶיהָ
  choice: 居于他们之上
  rationale: 介词表达“在……之上”；阴性单数后缀在形式上回指“会众”这个集合名词，但在中文里按其成员译为“他们”更自然。补入“居于”使空间关系与“回到高处”衔接清楚，却不具体解释为登基。
- source_word: לַמָּרוֹם
  choice: 到高处
  rationale: מָרוֹם表示高处或崇高之地。“到高处”保留原文的空间和尊荣双重意象，不将其限定为“天上”或“宝座”。
- source_word: שׁוּבָה
  choice: 求你回到
  rationale: 这是 שוב 的祈使形式，基本义为“返回、回到”。加“求你”自然表达诗人的恳求，同时避免采用“重新登基”等超出字面证据的解释。
theological_decisions:
- issue: 本节描写的是上帝在高处施行统治审判，还是实际向上移动
  choice: 保留为诗人恳求上帝回到高处、居于聚集万民之上的诗意图景
  alternative: 也可理解为请求上帝实际升到会众之上的天上；或把两个动词读成将来陈述
  rationale: 祈使式 שׁוּבָה 明确支持恳求语气，而“高处”和“在……之上”可兼含空间与尊荣、统治意象。译文不加入“宝座”“登基”或“升天”，以免消除原文的张力。
- issue: וְעָלֶיהָ 的单数集合指称如何在中文中呈现
  choice: 正文依意义译为“他们”，指聚集的万民
  alternative: 依语法形式译为“它”，回指作为整体的“会众”
  rationale: 原文后缀是阴性单数，语法上回指“会众”；但会众由人组成，现代中文通常以复数人称表达。脚注保留按集合整体理解的可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体中文。“愿”与“求你”呈现祈愿和祈使语气；分号保留两行诗意之间的推进关系。正文中的脚注标记均置于相关表达之后。
