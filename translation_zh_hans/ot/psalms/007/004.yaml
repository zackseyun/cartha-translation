  text: אִם גָּ֭מַלְתִּי שֽׁוֹלְמִ֥/י רָ֑ע וָ/אֲחַלְּצָ֖/ה צוֹרְרִ֣/י רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/004.yaml
  text: if I have repaid the one at peace with me with evil[a], or delivered my enemy for nothing—
translation:
  language: zh_hans
  text: 我若曾以恶报那与我和睦的人，或无故掠夺我的仇敌[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尽管我曾救出那无故与我为敌的人。”此处希伯来语动词通常意为“救出”；也有人在本句中理解为“剥夺、掠夺”。
    reason: 保留原文动词及句法所容许的重要替代解读。
lexical_decisions:
- source_word: אִם
  choice: 我若
  rationale: 引出自咒誓言的条件从句；“我若”既准确又符合现代汉语的庄重语体。
- source_word: גָּמַלְתִּי
  choice: 曾以……报
  rationale: 该动词在此有按对方行为施以回报的含义；“以恶报”保留其报偿意味，并与宾语和结果成分自然衔接。
- source_word: שׁוֹלְמִי
  choice: 那与我和睦的人
  rationale: 字面指与说话者处于和平关系中的人；此译比“盟友”或“朋友”更少增添原文没有明确表达的关系性质。
- source_word: רָע
  choice: 恶
  rationale: 保留原词的道德分量；“以恶报”也是自然、凝练的现代汉语表达。
- source_word: וָאֲחַלְּצָה
  choice: 或……掠夺
  rationale: 此处词义有争议。主文采用表示剥夺、掠夺的理解，使两个并列条件都指诗人否认做过的恶事；动词更常见的“救出”义则收入脚注。连接词译为“或”，清楚呈现同一条件誓言中的另一项可能罪行。
- source_word: צוֹרְרִי
  choice: 我的仇敌
  rationale: 该分词名词指敌对、攻击说话者的人；“仇敌”准确而庄重。
- source_word: רֵיקָם
  choice: 无故
  rationale: 在主文所采用的敌对行为解读中，此词表示没有缘由或正当理由，修饰“掠夺”最为自然。
theological_decisions:
- issue: וָאֲחַלְּצָה צוֹרְרִי רֵיקָם 的含义
  choice: 将其理解为第二项被否认的恶行：“或无故掠夺我的仇敌”
  alternative: 将动词按其常见义译为“救出”，如：“其实我曾救出那无故与我为敌的人”
  rationale: 希伯来语动词通常可表示“救出”，但本节也常被理解为“剥夺、掠夺”；后一理解与前半句并列，形成两项诗人否认的罪行。由于前一种解读在词汇上很有根据，不能静默排除，故在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“那与我和睦的人”贴近原文关系性表达；破折号表明条件从句尚未结束，并与下一节的自咒结果相连。
