base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/015.yaml
  text: He dug a pit and hollowed it out[a], and he fell into the hole he made.
translation:
  language: zh_hans
  text: 他挖了坑，又把它挖深；就掉进自己所造的陷坑里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בּוֹר
  choice: 坑
  rationale: בּוֹר可指坑或蓄水池；本节描写设下陷阱，采用较宽泛自然的“坑”最合语境。
- source_word: כָּרָה
  choice: 挖了
  rationale: 该动词直接表示挖掘；“挖了坑”是现代汉语中自然、具体的表达。
- source_word: וַיַּחְפְּרֵהוּ
  choice: 又把坑掘深
  rationale: חפר与前面的כרה语义重叠，连续使用可能强调进一步挖掘；“掘深”既保留递进，也避免生硬重复。
- source_word: וַיִּפֹּל
  choice: 自己反倒掉进
  rationale: 原文是简洁的连续叙述“他就掉进”；“自己反倒”在不改变事件的前提下，以自然汉语显出作恶者落入自设陷阱的反转。
- source_word: שַׁחַת
  choice: 陷坑
  rationale: 此处指挖成的捕捉性坑穴。译作“陷坑”保留具体意象，并与前面的“坑”略作区分；抽象义“毁灭”在挖坑语境中可能性较低。
- source_word: יִפְעָל
  choice: 所挖的
  rationale: פעל本义宽泛，可表示做成或造成；这里指他挖掘而成的陷坑，汉语用“所挖的”紧扣上下文，较“所造的”自然。
