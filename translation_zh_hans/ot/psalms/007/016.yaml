base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/016.yaml
  text: His trouble returns on his own head[b][a], and his violence descends on his own skull.
translation:
  language: zh_hans
  text: '他的祸患[a]必归到自己头上；

    他的暴行必落在自己头顶[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸患”或译“恶事”或“害人的作为”。希伯来语 עָמָל 按语境可指祸患、恶事或害人的作为。
    reason: lexical_alternative
  - marker: b
    text: “头顶”也可译作“头的顶部”或“头冠”。希伯来语 קָדְקֹד 指头的顶部或冠部。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: 必归到
  rationale: 这里的Qal未完成式描写恶人所造成的祸患反过来临到他本人；“归到”保留返回、反归的意味，“必”以自然汉语表达诗句中的确定陈述。
- source_word: עֲמָלוֹ
  choice: 他造成的祸患
  rationale: עָמָל可指祸患、恶行或害人的作为。结合报应语境，“他造成的祸患”既表明祸患源于他，又避免把它误解为他无辜承受的苦难。
- source_word: בְרֹאשׁוֹ
  choice: 自己头上
  rationale: 直译为“在他的头上”；“自己”自然地显明后果反归行为人本身，并保留头部意象。
- source_word: וְעַל
  choice: ；……在
  rationale: 用分号连接平行诗行，并以“在”自然表达介词关系，保留两个分句的对应结构。
- source_word: קָדְקֳדוֹ
  choice: 自己头顶
  rationale: קָדְקֹד特指头的顶部或头顶。“头顶”准确、自然，也与前句的“头上”形成递进式平行。
- source_word: חֲמָסוֹ
  choice: 他的暴行
  rationale: חָמָס常指暴力、残暴或暴力造成的不义；“暴行”既保留暴力含义，也适合指施暴者自己的行为。
- source_word: יֵרֵד
  choice: 必落在
  rationale: 该词是ירד的Qal未完成式，基本义为下降。汉语“落在……头顶”自然保留由上而下临到他的鲜明图像。
theological_decisions:
- issue: 诗歌中的报应意象
  choice: 译文表达恶人自己造成的祸患和暴行反过来临到他本人。
  alternative: 也可较笼统地理解为祸患临到某人，而不突出道德报应。
  rationale: “归到自己头上”和“落在自己头顶”两个平行图像明显呈现作恶者自食其果的诗性公义；译文保留这一力量，但不额外加入经文没有明说的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，并以分行和分号保留希伯来诗歌的平行结构。“归到”与“落在”分别呈现返回和下降的动作；所有脚注标记均置于所说明的词语之后。
