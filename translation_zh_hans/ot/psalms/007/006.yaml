  text: ק֘וּמָ֤/ה יְהוָ֨ה בְּ/אַפֶּ֗/ךָ הִ֭נָּשֵׂא בְּ/עַבְר֣וֹת צוֹרְרָ֑/י וְ/ע֥וּרָ/ה אֵ֝לַ֗/י מִשְׁפָּ֥ט צִוִּֽיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/006.yaml
  text: Rise up[a], O Yahweh, in your anger; lift yourself up against the fury of my enemies; awake for me[c][b]; you have appointed judgment.
translation:
  language: zh_hans
  text: 耶和华啊，求你在怒中兴起；求你挺身而起，抵挡我仇敌的暴怒；求你为我醒来[a]；你已命定审判[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为我”也可译作“向我”，即为了我而醒来、行动。
    reason: lexical_alternative
  - marker: b
    text: 或译：“求你醒来，为我施行你所命定的审判。”原文末句也可与前一句连读；其句法关系并不明确。
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: 兴起
  rationale: 这是קום的祈使式，呼求上帝采取行动。“兴起”既保留诗歌意象，也符合现代汉语祷告语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文中广为人知的专名形式音译四字神名，不以“主”这一称号替代。
- source_word: בְּאַפֶּךָ
  choice: 在怒中
  rationale: אַף本义与鼻孔有关，引申为怒气；此处明确指上帝的愤怒，译文保留介词结构。
- source_word: הִנָּשֵׂא
  choice: 挺身而起
  rationale: נשׂא的尼法勒祈使式与“兴起”平行；“挺身而起”表达抬升自身、起来行动的动态意义，而不把它仅理解为抽象的“受尊崇”。
- source_word: בְּעַבְרוֹת צוֹרְרָי
  choice: 抵挡我仇敌的暴怒
  rationale: עֶבְרָה表示猛烈、迸发的怒气，复数可强化或指多次暴怒；介词ב在敌对语境中自然译作“抵挡”。
- source_word: וְעוּרָה אֵלַי
  choice: 求你为我醒起
  rationale: 保留עור“醒起”的拟人化诗歌表达；אֵלַי字面是“向我”，语境中可表达“为我、为我的缘故”。
- source_word: מִשְׁפָּט צִוִּיתָ
  choice: 施行你所命定的审判
  rationale: מִשְׁפָּט指司法性的审判；צוה通常是“命令”，在此也可指上帝所规定、命定的审判。补出“施行”使汉语句法完整，同时将整短语理解为“你所命定的审判”。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 保留其作为上帝专名的性质，不以称号“主”代替；“耶和华”是现代中文读者最熟悉且可辨识的音译形式。
- issue: 对上帝使用拟人化祈使语
  choice: 保留“兴起、挺身而起、醒起”的意象
  alternative: 意译为“采取行动、介入”
  rationale: 原文以强烈的拟人化呼求推动诗句；直保留这些动作意象，并不意味着断言上帝真的沉睡。
- issue: 末句与“醒起”的句法关系
  choice: 理解为“施行你所命定的审判”
  alternative: 理解为独立陈述“你已经命定审判”
  rationale: 希伯来文省略关系标记，既可把“审判”视作前一句所求行动的目标，也可将末句读成独立陈述；正文采用较连贯的祈求结构，并以脚注保留另一可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以三个递进的祈求保留原诗的急迫感和排比。正文避免古奥词汇，但保留“醒起”这一有意的拟人化诗歌表达。
