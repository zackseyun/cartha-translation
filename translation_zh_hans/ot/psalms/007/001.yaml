  text: יְהוָ֣ה אֱ֭לֹהַ/י בְּ/ךָ֣ חָסִ֑יתִי הוֹשִׁיעֵ֥/נִי מִ/כָּל רֹ֝דְפַ֗/י וְ/הַצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/001.yaml
  text: O Yahweh my God[a], in you I have taken refuge; save me from all who pursue me, and deliver me.
translation:
  language: zh_hans
  text: 雅威，我的上帝啊，我投靠你[a]；求你救我脱离一切追赶我的人，搭救我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已经投靠你。”希伯来语完成式在祷告语境中既可强调已经采取、现今仍有效的行动，也可用汉语现在时表达当前的信靠。
    reason: 保留希伯来语动词完成式在祷告语境中的时体弹性。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见的音译直接呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: אֱלֹהַי 带第一人称单数词尾，意为“我的上帝”；与神名连用时构成直接呼告。
- source_word: בְּךָ חָסִיתִי
  choice: 我投靠你
  rationale: חסה 表示投奔某处寻求庇护；“投靠”在现代汉语中自然地表达信赖并寻求保护。完成式在祷告语境中可表达已经采取且持续有效的行动，也可按当前信靠来理解，故以脚注保留时体弹性。
- source_word: הוֹשִׁיעֵנִי
  choice: 求你救我
  rationale: 该使役式命令语表达恳求拯救；加“求”符合汉语祷告语气，又不削弱原文命令式的迫切感。
- source_word: מִכָּל רֹדְפַי
  choice: 脱离一切追赶我的人
  rationale: 分词 רֹדְפַי 描写持续追赶诗人的人；“追赶我的人”保留动作性，也避免用“迫害者”过度限定其动机。
- source_word: וְהַצִּילֵנִי
  choice: 搭救我
  rationale: נצל 的使役式可指解救、救拔。译作“搭救”既自然，又与前面的“救我”保持轻微词义区别。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在以专名音译呈现，而不是改译为“主”；“耶和华”是汉语传统中更熟悉的形式，但其读音源于较晚的混合读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“雅威我的上帝啊”保留直接呼告；“求你”体现祷告语气；两个救援动词分别译为“救”和“搭救”，尽量反映原文近义而不完全相同的表达。
