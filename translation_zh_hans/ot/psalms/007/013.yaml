  yaml_path: translation/ot/psalms/007/013.yaml
  text: And for him he has prepared weapons of death[a]; he makes his arrows fiery.
translation:
  language: zh_hans
  text: 他为那恶人预备了致命的武器；他使自己的箭燃烧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他把自己的箭制作为追赶者所用”，或“他把自己的箭制成用来对付追赶者的”。这里的希伯来词既可能与“燃烧”有关，也可能与“追赶”有关；主文按常见的燃烧之箭意象翻译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  choice: 他也为那恶人
  rationale: לֹו最自然地表示“为他”；结合上文，其所指是恶人。中文补出“那恶人”以明确代词所指，同时避免误解为上帝替自己预备武器。
- source_word: הֵכִין
  choice: 预备了
  rationale: כון的Hiphil词形表示“预备、使就绪”；“预备了”体现行动已经完成，并与当前审判图景相关。
- source_word: כְּלֵי מָוֶת
  choice: 致命的武器
  rationale: כְּלִי可指器具或武器；下句提到箭，故此处译作“武器”。“致命的”自然传达希伯来语“死亡的武器”这一属格结构的含义。
- source_word: חִצָּיו
  choice: 自己的箭
  rationale: 直译为“他的箭”；中文用反身领属“自己的”可清楚表明箭属于本句的行动者。
- source_word: לְדֹלְקִים
  choice: 火箭
  rationale: דלק可与“燃烧”或“追赶”相关。在箭的军事意象中，主文采用常见理解，即点燃的箭；因词形确有歧义，另义保留在脚注。
- source_word: יִפְעָל
  choice: 制成
  rationale: פעל在此表示“制作、造成”；“把……制成……”符合现代汉语表达，也保留上帝使箭成为火箭的动作。
theological_decisions:
- issue: 武器的预备者及其对象
  choice: 上帝为恶人预备致命武器，并把自己的箭制成火箭
  alternative: 恶人为自己预备武器
  rationale: 语境承接前一节以刀、弓描写上帝的审判；לֹו较自然地标示武器所针对或为之预备的对象，而非将恶人改作动作者。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“致命的武器”比“死亡的器具”更符合上下文的军事意象；“火箭”在此指点燃后射出的箭，脚注保留“追赶者”的词义可能。
