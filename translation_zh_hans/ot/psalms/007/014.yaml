lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 用现代而庄重的提示语引人注意后面的鲜明生育意象。
- source_word: יְחַבֶּל
  choice: 忍受产痛
  rationale: 该动词在这里表达临产、阵痛或生产之苦；译文保留这一层意象，不把它改译成属于下一动词的“怀孕”。
- source_word: אָוֶן
  choice: 奸恶
  rationale: 此词兼有道德上的邪恶与带来祸害之意；“奸恶”突出行为者的恶，同时与下文的“祸患”有所区别。
- source_word: הָרָה
  choice: 怀了
  rationale: 直接表达怀胎、受孕之意，并保留原文将产痛、怀胎和生产压缩排列的非线性顺序。
- source_word: עָמָל
  choice: 祸患
  rationale: 此处指恶行所孕育的伤害、苦难或祸害；“祸患”符合语境，也与生育比喻自然衔接。
- source_word: יָלַד שָׁקֶר
  choice: 生下虚假
  rationale: 保留“生下”的生产意象；“虚假”容纳 שָׁקֶר 所指的谎言、欺骗和虚妄，不将含义过度限定为一句具体的谎话。
