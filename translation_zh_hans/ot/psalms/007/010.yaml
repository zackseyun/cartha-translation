  text: מָֽגִנִּ֥/י עַל אֱלֹהִ֑ים מ֝וֹשִׁ֗יעַ יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/010.yaml
  text: My shield is with God[b][a], who saves the upright in heart.
translation:
  language: zh_hans
  text: 我的盾牌在上帝那里[a]；他拯救心里正直的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝是我的盾牌。”希伯来语原文十分紧凑，也可按此重组理解。
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנִּי
  choice: 我的盾牌
  rationale: 保留“盾牌”的具体意象，不抽象化为“保护”，以呈现诗篇原有的比喻。
- source_word: עַל
  choice: 在于
  rationale: 此处表示诗人的保障所依托、所在之处；“在于上帝”在现代汉语中既可表达依靠关系，也避免误解为盾牌的物理位置。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为形态上的复数形式，却明确指以色列所信的独一上帝，故用单数称谓。
- source_word: מוֹשִׁיעַ
  choice: 他拯救
  rationale: 分词描述上帝一贯的作为；用“他拯救”自然地保留其持续、特征性的意味。
- source_word: יִשְׁרֵי
  choice: 正直的人
  rationale: 该词指品格正直者；“正直”比“公义”更直接对应 ישר 的“直、正直”语义。
- source_word: לֵב
  choice: 心里
  rationale: “心”指人的内在品格与意念；“心里正直”是自然且贴近希伯来语意象的汉语表达。
theological_decisions:
- issue: 上半句无显式系词结构的句法关系
  choice: 译作“我的盾牌在于上帝”，表达诗人的保障在上帝那里、依托于上帝。
  alternative: “上帝是我的盾牌”；或较生硬的“我的盾牌在上帝之上”。
  rationale: 希伯来语 מָגִנִּי עַל אֱלֹהִים 结构紧凑且没有明说系词，存在多种理解。“在于上帝”尽量保留原有词序及依托意味，同时以脚注保留把上帝直接视为盾牌的解释，避免消除原文的句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“我的盾牌在于上帝”保留原文较为独特的表达；分号清楚呈现两个诗行之间的关系。
