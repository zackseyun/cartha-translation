  text: יְהוָה֮ יָדִ֪ין עַ֫מִּ֥ים שָׁפְטֵ֥/נִי יְהוָ֑ה כְּ/צִדְקִ֖/י וּ/כְ/תֻמִּ֣/י עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/008.yaml
  text: Yahweh judges the peoples[a]; judge me, O Yahweh[c][b], according to my righteousness and according to my integrity that is upon me.
translation:
  language: zh_hans
  text: 雅威审判万民；雅威啊，求你按我的公义，按我所具有的纯全审判我。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判我”也可译作“为我伸冤”；这里的希伯来语祈使式可以指作出有利的判决。
    reason: lexical_alternative
  - marker: b
    text: “纯全”也可译作“正直”或“无可指摘”；直译为“在我身上”，此处指我所具有的纯全。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现上帝向以色列启示的专名，而不以“主”这一称号替代。
- source_word: יָדִין
  choice: 审判
  rationale: 未完成式在诗歌中可表达恒常或概括性的行动；此处译作一般现在意义的“审判”，并与下句的祈求形成呼应。
- source_word: עַמִּים
  choice: 万民
  rationale: 该复数泛指众多族群或人民；“万民”在现代汉语圣经语体中自然、庄重，也保留广泛的集合意义。
- source_word: שָׁפְטֵנִי
  choice: 审判我
  rationale: 保留 שפט 最直接的司法含义，并与前句“审判万民”形成词语呼应；上下文可含求有利裁决、为自己伸冤之意，另以脚注说明。
- source_word: כְּצִדְקִי
  choice: 按我的公义
  rationale: 忠实保留第一人称所有表达，并用“按”体现前缀 כ 的准则意义；“公义”既庄重又不将原文缩窄为单纯的无罪申诉。
- source_word: וּכְתֻמִּי
  choice: 按我的纯全
  rationale: תֹּם/תֻּם 表示完整、正直或无可指摘；“纯全”保留道德完整性的含义，同时不必然宣称绝对无罪。
- source_word: עָלָי
  choice: 我身上的
  rationale: 较具体地保留 על“在……之上”的意象，并在汉语中自然地表明这种纯全属于或关乎诗人本人。
theological_decisions:
- issue: 诗人自称有“公义”和“纯全”是否应被弱化为仅在某件事上的相对无辜
  choice: 在正文中直接保留“我的公义”和“我身上的纯全”
  alternative: 意译为“我在这事上的清白”或“我的正当理由”
  rationale: 希伯来文明确使用第一人称所属形式。译文不擅自把这种宣称解释为绝对无罪，也不将其缩窄为某一特定案件，从而保留原文的神学张力。
- issue: שָׁפְטֵנִי 在祈求中是中性的“审判我”还是结果导向的“为我伸冤”
  choice: 正文译作“审判我”
  alternative: 为我伸冤
  rationale: 正文保留与前句 דין 司法行动的呼应及裁决结果的开放性；其在语境中可能期待有利判决，故在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈祷语体。“雅威啊，求你……”符合汉语呼告习惯；“按我身上的纯全”尽量保留希伯来语 עָלָי 的空间意象，又避免生硬的“在我之上”。
