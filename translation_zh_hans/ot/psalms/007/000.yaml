    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁגָּיוֹן
  choice: 细迦庸
  rationale: 这是一个罕见且含义不确定的诗歌或音乐术语。采用音译，既保留标题的专门用语性质，也避免武断地译作“哀歌”或“狂放之歌”；可能含义列于脚注。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 标题中的 לְ 可表示作者、归属、关联或奉献对象。“大卫的”保持原文的简练，也不把含义限定为单一的作者署名。
- source_word: אֲשֶׁר שָׁר
  choice: 是他……所唱的
  rationale: 直接表达关系从句和 שׁיר 的完成式，同时符合现代汉语诗篇标题的庄重语体。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词表示歌唱所面向的对象；神名 יהוה 采用“雅威”，保留其作为专名的性质。
- source_word: עַל
  choice: 论到
  rationale: 此处可表示主题或缘由。“论到”适合标题语体，并避免过度确定为“因为”或“由于”。
- source_word: דִּבְרֵי
  choice: ……的话
  rationale: דָּבָר 的复数构造式可指“话”“事情”或“事件”。译作“话”最贴近字面，不擅自具体化为“控告”。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 此处是人名，采用现代中文圣经传统中通行的音译。
- source_word: בֶּן יְמִינִי
  choice: 便雅悯人
  rationale: 该表达是指属于便雅悯支派的人；用“便雅悯人”自然清楚地传达其族属含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名 יהוה。“雅威”较贴近学界通常重构的读音，并明确将其作为神的专名处理；“耶和华”是中文传统中广泛使用的另一译法。
translation_notes:
  register: 采用简洁、庄重的诗篇标题语体。“细迦庸”保留技术术语的不确定性；“论到”保留 עַל 在主题与缘由之间的开放性；整体语序稍具书面色彩，但普通现代读者仍易理解。
