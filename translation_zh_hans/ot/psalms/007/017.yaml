base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/017.yaml
  text: I will give thanks to Yahweh according to his righteousness[a], and I will sing praise to the name of Yahweh Most High.
translation:
  language: zh_hans
  text: 我要按雅威的公义称谢雅威[a]，歌颂至高者雅威的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因他的公正”或“按他的公正”。希伯来语这个词兼有“公义”和“公正”的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: 称谢
  rationale: ידה的Hifil形式在诗篇敬拜语境中通常指向上帝献上感谢和赞美；“称谢”既保留感谢之意，也符合庄重的诗歌语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: כְּצִדְקוֹ
  choice: 按着他的公义
  rationale: 介词כְ表达依照、与之相称；צדק在此既可指上帝正直的品格，也可涵盖其公正的作为。“公义”能保留这一较宽的语义范围。
- source_word: וַאֲזַמְּרָה
  choice: 歌颂
  rationale: זמר在诗篇中指以歌唱或音乐赞美；“歌颂”在现代汉语中自然简洁，并明确表达敬拜含义。
- source_word: שֵׁם
  choice: 名
  rationale: 直译为“名”，保留圣经中名字所承载的身份、声誉和启示意义。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 该词在此是修饰雅威的神圣称号；“至高者”准确自然，也不额外补入原文没有的“上帝”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近当代学界对其读音的重构，并保留专名性质。“耶和华”是传统汉语形式，但源自较晚的混合读法。
- issue: צדק用于上帝时的语义
  choice: 公义
  alternative: 公正
  rationale: 此处既可能着重上帝正直的品格，也可能着重他施行公正审判的作为；正文采用范围较宽的“公义”，脚注保留“公正”的语义可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“按着”对应原文介词的依照含义；后半句省去重复主语，使汉语节奏简洁，同时保留两个并列的第一人称赞美行动。
