source:
  edition: WLC
  text: פֶּן יִטְרֹ֣ף כְּ/אַרְיֵ֣ה נַפְשִׁ֑/י פֹּ֝רֵ֗ק וְ/אֵ֣ין מַצִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/002.yaml
  text: lest he tear my soul like a lion[a], rending it apart with no one to rescue.
translation:
  language: zh_hans
  text: 免得他像狮子一样撕裂我的性命[a]，把它撕碎，无人搭救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我自己”。“性命”所译的希伯来语可指人的生命，也可指整个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 引出所惧怕的后果，既保留警告意味，也符合现代汉语的诗体表达。
- source_word: יִטְרֹף
  choice: 撕裂
  rationale: 该动词描写猛兽撕扯猎物；“撕裂”鲜明地保留了捕食意象。
- source_word: כְּאַרְיֵה
  choice: 像狮子
  rationale: 前缀כְּ表示比较；“像狮子”自然、准确地保留明喻。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ在这里指诗人受到死亡威胁的生命或整个自身；“性命”既贴合险境，也避免将其限缩为与身体相对的非物质“灵魂”。
- source_word: פֹּרֵק
  choice: 把我撕碎
  rationale: 分词延展并加强狮子撕扯猎物的画面。希伯来文未明说宾语；汉语补出“我”，自然地回指受威胁的诗人。
- source_word: וְאֵין מַצִּיל
  choice: 无人搭救
  rationale: 简洁保留“没有施救者”的存在否定；“搭救”符合眼前危难的语境。
theological_decisions:
- issue: נֶפֶשׁ所指的人论含义
  choice: 译作“性命”，并以脚注注明也可理解为“我自己”
  alternative: 灵魂
  rationale: 本节语境是猛兽威胁生命，并非专门论述身体与灵魂的区分；因此不应把原词的宽广含义收窄为非物质灵魂。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“撕裂……撕碎”有意保留原文连续加强的暴力意象；单数“他”保留希伯来文动词的单数主语。
