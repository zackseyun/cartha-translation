base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh[a], you brought up my soul from Sheol[c][b]; you kept me alive from among those going down to the pit.
translation:
  language: zh_hans
  text: 耶和华啊，你把我的性命[a]从阴间[b]带上来；你保全我活着，脱离下到深坑的人。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”也可译作“我的灵魂”或“我自己”。
    reason: lexical_alternative
  - marker: b
    text: “阴间”是希伯来语“示阿勒”所指死者的领域；也可译作“坟墓”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作：“你使我从下到深坑的人中活过来。”另一种句法理解是：“你保全我活着，使我不至下入深坑。”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 用现代汉语中通行的圣名音译“耶和华”，并以“啊”表达希伯来诗歌中的直接呼告。
- source_word: הֶעֱלִיתָ
  choice: 你使……上来
  rationale: 保留使役词形以及从死者领域向上获救的垂直意象，不将其弱化为笼统的“拯救”。
- source_word: מִן שְׁאוֹל
  choice: 从阴间
  rationale: “阴间”在此指死者的领域，比单纯的“坟墓”范围更广，也避免译成带有后期特定含义的“地狱”。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נפשׁ在此可指生命或整个人；“性命”既符合死亡威胁的语境，也避免把它限定为后期技术意义上的灵魂构成。
- source_word: חִיִּיתַנִי
  choice: 你保全我的生命
  rationale: 该词在此可表达使人活着或恢复生命；“保全我的生命”与脱离死亡的平行意象相称，同时不强行加入明确的复活论断。
- source_word: מִיּוֹרְדֵי בוֹר
  choice: 使我不落在下坑的人中
  rationale: 以自然汉语表达从下坑者之列中被分别出来的意思；脚注保留“从……中活过来”的另一种句法理解。
- source_word: בּוֹר
  choice: 坑
  rationale: 保留原文的坑穴意象；在诗歌语境中，它可象征坟墓或死亡之地。
theological_decisions:
- issue: 本节是否明确陈述复活或对来世作出完整界定
  choice: 保留“阴间”和“下坑”的希伯来死亡意象，将经文译为从死亡或濒死中获救。
  alternative: 译成“从死里复活”，或把“阴间”限定为“地狱”或单纯的“坟墓”。
  rationale: 原文以诗歌意象描述生命蒙保全，却没有明确界定经历的性质；译文因此不把这种张力化约为更具体的教义命题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“性命”“阴间”“下坑”保留诗歌的死亡与获救意象；避免过于技术化的神学术语，也不把希伯来诗歌压缩成抽象说明。
