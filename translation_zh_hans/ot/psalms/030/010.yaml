  text: שְׁמַע יְהוָ֥ה וְ/חָנֵּ֑/נִי יְ֝הוָה הֱֽיֵה עֹזֵ֥ר לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/010.yaml
  text: Hear[a], O Yahweh, and be gracious to me; O Yahweh, be my helper.
translation:
  language: zh_hans
  text: 雅威啊，求你垂听，恩待我[a]；雅威啊，求你作我的帮助者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“怜悯我”。希伯来语动词可指施恩或在求助时施以怜悯。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: 求你垂听
  rationale: 这是שׁמע的阳性单数祈使式，向上帝祈求时译作“求你垂听”自然庄重；希伯来文未明说宾语，因此正文不补出“我”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，避免用称号替代经文中的专名。
- source_word: וְחָנֵּנִי
  choice: 恩待我
  rationale: חנן的祈使式带第一人称单数后缀，核心意思是施恩、赐予恩惠；“恩待我”既简洁自然，也保留恩惠层面的词义。
- source_word: הֱיֵה
  choice: 求你作
  rationale: היה的祈使式在此表示请求对方担当某种身份或角色；汉语祷告语境用“求你作”比直译“要成为”自然。
- source_word: עֹזֵר לִי
  choice: 我的帮助者
  rationale: עזר的主动分词配לִי，指帮助诗人的那一位；“我的帮助者”保留分词所表达的施助者身份，而不抽象化为“我的帮助”。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次直接使用神名。正文采用现代中文圣经传统中辨识度最高的专名“耶和华”，不以“主”等称号替换；“雅威”是较接近学界常见拟音的另一选择。
- issue: חנן所表达的是恩惠还是怜悯
  choice: 恩待我
  alternative: 怜悯我
  rationale: 该动词可在求助语境中包含怜悯意味，但其词义重点在施恩、厚待。正文保留“恩”的语义，不把两者之间的张力收窄为单一的怜悯概念。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语祷告语体。原文两个并列祈使请求及两次神名呼求均予保留；不添加原文未明说的宾语，也不把“帮助者”抽象化。
