base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/009.yaml
  text: What profit is there in my blood[c][b][a], in my going down to the pit? Will the dust praise you? Will it declare your faithfulness?
translation:
  language: zh_hans
  text: 我的血流出、我下到深坑[a][b]，有什么益处呢？尘土岂能赞美你？岂能述说你的信实[c]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我死了”。原文直译近于“在我的血中”。
    reason: lexical_alternative
  - marker: b
    text: “深坑”也可译作“坟墓”。
    reason: lexical_alternative
  - marker: c
    text: “信实”也可译作“真实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה בֶּצַע
  choice: 有什么益处呢
  rationale: 保留原文询问“有何收益、益处”的反问语气，在现代汉语中自然凝练。
- source_word: בְּדָמִי
  choice: 我流血
  rationale: 原文直译近于“在我的血中”，语境指流血致死；译作“我流血”既保留具体的血之意象，又避免生硬的汉语。
- source_word: בְּרִדְתִּי אֶל שָׁחַת
  choice: 下到深坑
  rationale: 保留“下去”与“坑”的死亡意象；“深坑”在诗歌汉语中自然，也能表达通往死亡之地的形象。
- source_word: הֲיוֹדְךָ עָפָר
  choice: 尘土岂能赞美你
  rationale: 保留“尘土”这一指向人死亡归尘的转喻；ידה在向上帝发出的敬拜语境中译为“赞美”最贴切。
- source_word: הֲיַגִּיד
  choice: 岂能述说
  rationale: “述说”符合诗歌体裁，并表达公开讲述、宣扬之意。
- source_word: אֲמִתֶּךָ
  choice: 你的信实
  rationale: אמת兼有真实、可靠与信实之义；此处是向上帝祈求的关系性语境，“信实”较合适，同时以脚注保留“真实”的可能。
theological_decisions:
- issue: 是否把死亡意象直接解释为“死亡、坟墓、死人”
  choice: 正文保留“流血、深坑、尘土”等具体意象
  alternative: 意译为“我死了、下到坟墓，死人岂能赞美你”
  rationale: 原文借具体而彼此关联的意象表达死亡将终止诗人的赞美；保留这些意象可维持诗歌张力，避免把解释直接写入正文。
- issue: אֲמִתֶּךָ应译为“信实”还是“真实”
  choice: 信实
  alternative: 真实
  rationale: 两个义项在原文中均有依据；祷告所诉诸的是上帝可靠不变的品格，故正文采用“信实”，脚注注明另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两个“岂能”形成平行反问；正文保留希伯来诗中的死亡意象，并通过脚注说明较解释性的译法。
