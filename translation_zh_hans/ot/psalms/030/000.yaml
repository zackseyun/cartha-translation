lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 在诗篇题注中指配乐吟唱的诗篇；“诗”是现代中文圣经体裁中自然、简明的对应词。
- source_word: שִׁיר
  choice: 歌
  rationale: 明确保留希伯来文与“诗”并列的第二个体裁名称，不将二者合并。
- source_word: חֲנֻכַּת
  choice: 献……之
  rationale: 该词表示启用时的奉献礼；“献殿”是简洁而庄重的中文表达，也可理解为房屋落成奉献。
- source_word: הַבַּיִת
  choice: 殿
  rationale: בַּיִת本义宽泛，可指房屋、宫殿或圣殿；题注语境下用“殿”较自然，但不在正文中进一步限定为圣殿，并以脚注保留歧义。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 保留לְ在诗篇题注中可能表示作者、归属或关联的宽泛关系，避免用“大卫作”把作者身份定死。
theological_decisions:
- issue: 题注中“房屋”的所指
  choice: 正文作“殿”，脚注说明原文仅为“房屋”
  alternative: 房屋；圣殿；宫殿
  rationale: 希伯来文没有明确所指；正文采用自然的传统中文题注表达，同时由脚注保存可能是圣殿、宫殿或一般房屋的解释空间。
- issue: לְדָוִד所表达的大卫关系
  choice: 大卫的
  alternative: 大卫作；为大卫而作；属于大卫
  rationale: “大卫的”比“大卫作”更能保存作者、归属、关联或献予等语义可能。
translation_notes:
  register: 采用现代、庄重而简洁的诗篇题注体。“大卫的”置于开头符合自然中文；以两个短句呈现并列题注信息。所有脚注标记均已在正文出现。
