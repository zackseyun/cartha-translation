id: PSA.30.1
reference: Psalms 30:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲרוֹמִמְ/ךָ֣ יְ֭הוָה כִּ֣י דִלִּיתָ֑/נִי וְ/לֹא שִׂמַּ֖חְתָּ אֹיְבַ֣/י לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/001.yaml
  text: I will exalt you[a], O Yahweh, because you have drawn me up and have not let my enemies rejoice over me.
translation:
  language: zh_hans
  text: '我要尊崇你，雅威啊！

    因为你把我拉了上来[a]，

    没有让我的仇敌因我而欢喜。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把我提了上来”；希伯来文动词具体描绘把东西从低处汲取上来，如从井中打水。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  choice: 我要尊崇你
  rationale: 该动词源于 רום，在此表示在赞美中将对象高举、尊为至高。“尊崇”符合现代汉语敬拜语体，同时保留其高举的意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 יְהוָה 作音译，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出诗人尊崇雅威的理由；“因为”在现代汉语中清楚自然。
- source_word: דִלִּיתָנִי
  choice: 你把我拉了上来
  rationale: דלה 具有把某物从低处汲取或拉上来的具体意象，尤可使人联想到从井或坑中提上来。“拉了上来”既自然，又比笼统的“抬举”更能保留原文图像。
- source_word: וְלֹא שִׂמַּחְתָּ
  choice: 没有让……欢喜
  rationale: שׂמח 的使役形式在这里表示使仇敌欢喜；结合否定词，译作“没有让……欢喜”符合汉语表达。
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: 直接表达复数名词及第一人称所属关系，庄重且通俗。
- source_word: לִי
  choice: 因我而
  rationale: 介词短语指仇敌以诗人的处境为欢喜的缘由。“因我而”保留原文较简略的关系，没有擅自补入具体灾祸或胜败情形。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以现代汉语音译呈现此专名，避免用“主”这一称号取代神名。
- issue: 仇敌欢喜的具体缘由
  choice: 没有让我的仇敌因我而欢喜
  alternative: 没有让我的仇敌因胜过我而欢喜；没有让我的仇敌因我遭难而欢喜
  rationale: 原文 לִי 只简略表达仇敌的欢喜与诗人有关，并未明说是因胜利还是因诗人遭难；正文保留这一含蓄与开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；以三行呈现因果与平行结构。感叹号体现直接呼告与赞美语气。
