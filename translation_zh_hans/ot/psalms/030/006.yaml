  text: וַ֭/אֲנִי אָמַ֣רְתִּי בְ/שַׁלְוִ֑/י בַּל אֶמּ֥וֹט לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/006.yaml
  text: As for me[a], I said in my prosperity[b], “I will never be shaken.”
translation:
  language: zh_hans
  text: 至于我，我安稳时曾说：“我永不动摇。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我必不动摇，直到永远。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 连词加独立代词突出说话者本人，并带有与前后处境相对照的意味；“至于我”在现代汉语中自然保留这一强调。
- source_word: אָמַרְתִּי
  choice: 曾说
  rationale: 完成式在这里回顾过去的言语；“曾说”简洁体现回顾语气，而不强行规定为过去完成时。
- source_word: בְשַׁלְוִי
  choice: 我安稳时
  rationale: שַׁלְוָה可指安逸、平静、安全而顺遂的状态，不仅限于物质兴盛。“安稳”保留较宽的语义，也契合诗人因境况顺遂而自信的语境。
- source_word: בַּל אֶמּוֹט לְעוֹלָם
  choice: 我永不动摇
  rationale: 诗体否定词בַּל与לְעוֹלָם共同构成持续而强烈的否定；“永不”自然表达其时间力度，“动摇”保留מוט所含失去稳固的比喻。
theological_decisions: []
