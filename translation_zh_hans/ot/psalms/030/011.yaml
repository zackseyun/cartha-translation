  yaml_path: translation/ot/psalms/030/011.yaml
  text: You turned my mourning into dancing for me; you untied my sackcloth and clothed me with joy.
translation:
  language: zh_hans
  text: 你使我的哀哭变为舞蹈；你解下我的麻衣，用喜乐为我束腰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפְּדִי
  choice: 我的哀哭
  rationale: מִסְפֵּד 指哀悼、哀哭；保留第一人称所有格，并采用现代读者易懂而庄重的表达。
- source_word: לְמָחוֹל לִי
  choice: 为我变为舞蹈
  rationale: מָחוֹל 指舞蹈；לִי 可与前面的名词结构相连，表达“我的哀哭变为舞蹈”，也可带有“为我”的意味。正文以自然汉语表达所有格关系，不另重复“为我”。
- source_word: פִּתַּחְתָּ שַׂקִּי
  choice: 你解下我的麻衣
  rationale: פּתח 在此有松开、解开的意思；麻衣是哀悼的服饰。“解下”自然呈现由悲哀中获释的动作。
- source_word: וַתְּאַזְּרֵנִי שִׂמְחָה
  choice: 以喜乐给我束腰
  rationale: אזר 的基本意象是束腰、围束；保留希伯来文具体隐喻，而不简化为泛化的“使我喜乐”或直接改作“给我穿上”。
theological_decisions:
- issue: “以喜乐束腰”的隐喻是否解释为“披上喜乐”
  choice: 保留“以喜乐给我束腰”
  alternative: 给我披上喜乐／以喜乐给我穿上
  rationale: 原文使用 אזר（束腰），与前句解下麻衣形成衣着意象，但并非通常表示“穿衣”的动词。保留这一张力，避免把诗歌意象过度同化。
translation_notes:
  register: 采用现代、庄重且可朗读的诗歌语言。“麻衣”保留圣经时代哀悼服饰的文化意象；“束腰”略具古典色彩，但准确、简洁，并保留原文平行结构。
