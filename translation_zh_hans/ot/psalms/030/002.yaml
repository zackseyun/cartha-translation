  yaml_path: translation/ot/psalms/030/002.yaml
  text: O Yahweh my God[a], I cried out to you[c][b], and you healed me.
translation:
  language: zh_hans
  text: 雅威[a]，我的上帝啊，我向你呼求[b]；你医治了我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是神名“YHWH”，其古代准确读音不能完全确定；“雅威”是常见拟音，传统也译作“耶和华”或“上主”。
    reason: alternative_reading
  - marker: b
    text: “呼求”也可译作“呼喊求助”。
    reason: lexical_alternative
  - marker: c
    text: “医治”在这里可能指身体得到医治，也可能泛指复原或蒙拯救。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名YHWH，直接保留专名性质；其古代准确读音不能完全确定，故加注说明传统译法。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: אֱלֹהִים带第一人称单数词尾，直译为“我的上帝”；与前面的神名共同构成呼语。
- source_word: שִׁוַּעְתִּי
  choice: 我向你呼求
  rationale: שׁוע表示在困境中迫切呼喊、求助；“呼求”既体现求助意味，也保持诗句简洁。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词אֶל加第二人称阳性单数词尾，表达呼求所朝向的对象。
- source_word: וַתִּרְפָּאֵנִי
  choice: 你就医治了我
  rationale: רפא的基本义是“医治”；“就”自然表达叙事中的承接和回应，但不额外限定医治究竟是身体痊愈还是更广义的复原。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名YHWH。正文以“雅威”音译，避免将专名化为称号；脚注同时交代读音的不确定性和常见传统译法。
- issue: רפא所指的医治范围
  choice: 医治了我
  alternative: 使我复原；使我痊愈
  rationale: “医治”最贴近词义，并保留此处可能指身体康复，也可能指更广义拯救或复原的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留原文简洁的呼告与回应结构；不将“医治”窄化为纯粹医疗意义，也不将其泛化到掩盖原词的基本含义。
