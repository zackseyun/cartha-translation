base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/004.yaml
  text: Sing praise to Yahweh[a], you his faithful ones[c][b], and give thanks to the remembrance of his holiness.
translation:
  language: zh_hans
  text: 耶和华的忠信者啊，你们要向耶和华歌颂；要为记念他的圣洁而称谢。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为记念他的圣洁而称谢”也可译作“在提说他的圣洁时称谢”；原文没有“名”字。
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: 歌颂
  rationale: 该词是复数命令式，在敬拜语境中指以歌唱或乐音赞美；“歌颂”在现代汉语中兼具歌唱与赞美的含义。
- source_word: לַיהוָה
  choice: 向耶和华（在汉语句式中表述为“歌颂他”）
  rationale: יהוה是神的专名；采用中文传统且通行的音译“耶和华”。为使呼语和命令自然清晰，将对象以后置代词表达，所指仍明确为耶和华。
- source_word: חֲסִידָיו
  choice: 他的忠信之民
  rationale: חסיד指以忠诚、敬虔回应神的人。“忠信之民”既保留关系性的忠诚含义，又避免“圣徒”可能带来的后期宗派或制度性联想。
- source_word: וְהוֹדוּ
  choice: 献上感谢
  rationale: ידה的使役词干在颂赞语境中常表示感谢或称谢；“献上感谢”符合敬拜语域，也与并列命令相称。
- source_word: לְזֵכֶר
  choice: 因记念
  rationale: זֵכֶר可指记念、纪念或提说；介词לְ在此可表达关联、缘由或指向。“因记念”在中文中自然，同时保留其与回想神圣洁相关的意义。
- source_word: קָדְשׁוֹ
  choice: 他的圣洁
  rationale: 原文直译为“他的圣洁”，并未出现“名”字；因此不扩译为“他的圣名”，以保留原文措辞和诗意张力。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用历史悠久、普通读者最熟悉的专名“耶和华”，而不以“主”取代；“雅威”是另一种较接近学术重构读音的译法。
- issue: לְזֵכֶר קָדְשׁוֹ 的理解
  choice: 因记念他的圣洁
  alternative: 在提说他的圣洁时献上感谢；向他圣洁的记念献上感谢
  rationale: 该短语可指对神圣洁的记念，也可能指礼仪中提说与称颂其圣洁。正文采用自然且较少过度解释的“因记念”，脚注保留“提说”的可能。
translation_notes:
  register: 采用现代、庄重且适于诗歌诵读的汉语。以“……啊”明确标示呼语，并用分号呈现两个并列命令。
