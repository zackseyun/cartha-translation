  to: 因为他的怒气不过片刻，他的恩宠中有生命[a]；哭泣虽在夜晚投宿[b]，清晨便有欢呼。
  rationale: 修订后更紧贴两个希伯来文无动词分句：怒气只是一刻，生命在其恩宠中；同时避免把“生命”解释为“一生”或将其与恩宠的关系明确化为单一因果。下半句保留夜间投宿与清晨欢呼的时间和声音意象，并提升汉语顺畅度。
