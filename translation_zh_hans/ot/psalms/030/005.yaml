source:
  edition: WLC
  text: כִּ֤י רֶ֨גַע בְּ/אַפּ/וֹ֮ חַיִּ֪ים בִּ/רְצ֫וֹנ֥/וֹ בָּ֭/עֶרֶב יָלִ֥ין בֶּ֗כִי וְ/לַ/בֹּ֥קֶר רִנָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/005.yaml
  text: For his anger is for a moment[a]; life is in his favor. Weeping may stay for the night[b], but rejoicing comes in the morning.
translation:
  language: zh_hans
  text: 因为他的怒气不过片刻，他的恩宠中有生命[a]；哭泣虽在夜晚投宿[b]，清晨便有欢呼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的恩宠中有生命”也可译作“他的恩宠带来生命”或“生命在他的恩宠中”。
    reason: 原文为简洁的无动词分句；正文保留“生命”与“恩宠”的关系所具有的含蓄性，不把它限定为“一生”。
  - marker: b
    text: “投宿”原文直指像客旅一样住宿过夜；也可译作“哭泣虽停留一夜”。
    reason: 保留希伯来文将哭泣人格化为夜间住客的意象，同时提供较直白的表达。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明当称颂耶和华的缘由；现代汉语中用“因为”自然清楚。
- source_word: רֶגַע בְּאַפּוֹ
  choice: 他的怒气不过片刻
  rationale: אַף在此按习语指“怒气”，רֶגַע表示极短的时间；补入“不过”自然呈现与下句的对比。
- source_word: חַיִּים בִּרְצוֹנוֹ
  choice: 他的恩宠却带来一生
  rationale: חַיִּים通常作抽象或持续性的“生命”；רָצוֹן指恩宠、悦纳。此译在汉语中表达其恩宠赐予并维系生命，同时保留“一生”与“片刻”的诗性对照。
- source_word: בָּעֶרֶב
  choice: 夜晚
  rationale: 字面为“在晚上”；结合表示过夜的动词及与“清晨”的对照，译作“夜晚”最自然。
- source_word: יָלִין בֶּכִי
  choice: 虽有哭泣来投宿
  rationale: לין本指住宿、过夜；将哭泣人格化为夜间投宿的客人，保存原文鲜明意象。
- source_word: וְלַבֹּקֶר רִנָּה
  choice: 清晨便有欢呼
  rationale: ו在平行句中体现转折后的推进，以“便”自然表达；רִנָּה尤指喜乐的呼喊或歌声，译作“欢呼”保存其声音色彩。
theological_decisions:
- issue: “他的怒气”和“他的恩宠”中代词的所指
  choice: 按上下文指耶和华
  alternative: 仅保留未明说对象的第三人称表达
  rationale: 诗篇上下文明确以耶和华为对象；正文仍依原文使用“他”，不额外扩写神学解释。
- issue: 片刻的怒气与持久生命的关系
  choice: 保留真实的神圣怒气，并突出恩宠持久赐生命的对照
  alternative: 将后半句译作较静态的“生命在他的恩宠中”
  rationale: 原文是两个紧凑的无动词分句，关系存在一定含蓄性。“带来一生”使现代汉语通顺，并保存怒气短暂、恩宠长久的诗意张力，而不否定怒气的真实性。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分号保留两组时间对照；“片刻／一生”与“夜晚／清晨”形成递进。“欢呼”比笼统的“喜乐”更贴近רִנָּה的有声喜悦。
