  yaml_path: translation/ot/psalms/030/012.yaml
  text: so that my glory may sing praise to you and not be silent. O Yahweh my God[a], I will give thanks to you forever.
translation:
  language: zh_hans
  text: 为使我的荣耀[a]向你歌颂，而不缄默；雅威，我的上帝啊，我要永远称谢你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的荣耀”也可理解为“我的全人”或“我的舌头”；这是诗歌表达，所指可能是诗人的内在自我或发声赞美的舌头。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 为使
  rationale: 引出目的或结果；“为使”简洁自然，并保留原文的目的意味。
- source_word: יְזַמֶּרְךָ
  choice: 向你歌颂
  rationale: זמר 的 Piel 形式在此表示以歌声赞美；“歌颂”兼顾歌唱和赞美两层意思。
- source_word: כָבוֹד
  choice: 我的荣耀
  rationale: 原词直译为“荣耀、尊荣”。在诗歌中，它可能借指诗人的内在自我、全人或舌头；正文保留原有隐喻，并以脚注说明可能含义。
- source_word: וְלֹא יִדֹּם
  choice: 不再静默
  rationale: דמם 可指沉默或静止；与“歌颂”相对时，“静默”最贴合语境。“不再”自然表达歌颂持续而非沉默的对照。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现上帝的专名，避免用头衔替代原文中的名字。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 准确表达第一人称所属关系；在此为直接呼告。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 表达持续无尽的时间，在称谢语境中自然庄重。
- source_word: אוֹדֶךָּ
  choice: 我要称谢你
  rationale: ידה 的 Hiphil 形式在此指献上感谢和赞美；“称谢”符合诗篇感恩语境，也保持庄重。
theological_decisions:
- issue: 作为歌颂主体的 כָבוֹד 如何理解
  choice: 正文保留字面隐喻“我的荣耀”
  alternative: 我的全人；我的舌头；我的心灵
  rationale: 原文确实使用“荣耀”一词，而其诗性所指存在歧义。正文不替作者消解隐喻，脚注则向普通读者交代几种合理理解。
- issue: 如何译写神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”直接音译原文神名，既表明这里出现的是专名，也避免以“主”这一头衔遮蔽原文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“雅威—我的上帝啊”用破折号突出同位呼告；正文保留“我的荣耀”这一有意的诗性张力，并由脚注解释。
