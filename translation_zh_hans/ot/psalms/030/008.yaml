  text: אֵלֶ֣י/ךָ יְהוָ֣ה אֶקְרָ֑א וְ/אֶל אֲ֝דֹנָ֗/י אֶתְחַנָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/008.yaml
  text: To you, O LORD, I call, and to my Lord I plead for mercy.
translation:
  language: zh_hans
  text: 耶和华啊，我向你呼求；我向主恳求怜悯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词 אֶל 加第二人称单数后缀，表示呼求所指向的对象；译为自然清楚的现代汉语“向你”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 按现代中文圣经传统，以专名“耶和华”对应四字神名 YHWH，并用“啊”体现直接呼告。
- source_word: אֶקְרָא
  choice: 呼求
  rationale: קרא 在此语境中不是一般的“呼叫”，而是向上帝发出的求告；“呼求”既准确又庄重。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 此处为对上帝的尊称 Adonai；译作“主”，不把希伯来语形式机械展开为中文所有格“我的主”。
- source_word: אֶתְחַנָּן
  choice: 恳求怜悯
  rationale: חנן 的 Hitpael 形式表达恳切求恩、求垂怜；“恳求怜悯”兼顾动作的恳切和所求的恩惠。
theological_decisions:
- issue: 同一节中 יְהוָה 与 אֲדֹנָי 的区分
  choice: 分别译作“耶和华”和“主”
  alternative: 两者都译作“主”或将 אֲדֹנָי 译作“我的主”
  rationale: 保留原文神名与尊称的词汇区别，同时不从 אֲדֹנָי 的传统读形引申出原文语境未必强调的所有关系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言；以分号保留两个平行分句，重复“我向”以呈现希伯来诗句的结构与强调。
