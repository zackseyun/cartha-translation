  text: יְֽהוָ֗ה בִּ/רְצוֹנְ/ךָ֮ הֶעֱמַ֪דְתָּה לְֽ/הַרְרִ֫/י עֹ֥ז הִסְתַּ֥רְתָּ פָנֶ֗י/ךָ הָיִ֥יתִי נִבְהָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/007.yaml
  text: O Yahweh[a], by your favor you made my mountain stand strong; when you hid your face, I was dismayed.
translation:
  language: zh_hans
  text: 耶和华啊，你施恩，使我的山稳固有力[a]；你一隐藏你的面，我就惊惶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为我的山立定力量。”希伯来语措辞紧凑，也可能以“山”象征安稳、昌盛或稳固的处境。
    reason: 保留לְהַרְרִי עֹז的句法歧义及诗歌意象可能具有的象征范围。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代中文通行的专名“耶和华”表达四字神名；“啊”体现直接呼告。
- source_word: בִּרְצוֹנְךָ
  choice: 你施恩
  rationale: רָצוֹן在此指恩惠、悦纳；介词בְּ具有凭借或原因意味。译作“你施恩”比生硬的“因你的恩惠”更自然，同时保留稳定源于上帝恩宠的含义。
- source_word: הֶעֱמַדְתָּה
  choice: 使……稳固
  rationale: עמד的使役形表示“使站立、使确立”。在山的诗歌意象中，“使……稳固”自然传达其使役语义。
- source_word: לְהַרְרִי עֹז
  choice: 使我的山稳固有力
  rationale: 希伯来语结构紧凑且存在句法歧义。正文保留“我的山”及עֹז的力量含义，不把意象直接释为昌盛或保障。
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  choice: 你一隐藏你的面
  rationale: 直译这一常见的希伯来语神学意象，不将其解释性改写为“离弃”或“收回恩惠”；“一……就……”呈现两分句之间紧密的时序或结果关系。
- source_word: נִבְהָל
  choice: 惊惶
  rationale: 该词表示受惊、慌乱或困扰。“惊惶”保留较强烈的情绪冲击，又不限定为极端恐惧。
theological_decisions:
- issue: 神名的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代简体中文读者最熟悉、且明确作为专名的“耶和华”，不以“主”替代；“雅威”是可行的学术音译。
- issue: “我的山”的解释
  choice: 正文保留“我的山”这一意象
  alternative: 我的昌盛／我的保障
  rationale: “山”可能象征稳固、尊荣或安泰，但原文没有明说具体所指；保留意象可避免消除诗句本有的开放性。
- issue: לְהַרְרִי עֹז的句法关系
  choice: 使我的山稳固有力
  alternative: 为我的山立定力量
  rationale: 两种理解都能反映紧凑的希伯来语。正文采用较自然的述谓理解，同时以脚注保留更贴近形式的另一种分析。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“我的山”“隐藏你的面”等诗篇核心意象；用“稳固有力”避免过度解释，同时使紧凑的希伯来语在中文中可读。
