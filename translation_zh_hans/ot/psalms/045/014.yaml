  yaml_path: translation/ot/psalms/045/014.yaml
  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[c][b], are brought to you.
translation:
  language: zh_hans
  text: 她身穿刺绣衣裳，被领到王那里[a]；随在她身后的童女[b]——她的同伴——也被带到你那里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她穿着绣花衣裳，被带到王那里。”
    reason: lexical_alternative
  - marker: b
    text: “童女”也可译作“少女”或“年轻女子”；原文通常特指处女。
    reason: lexical_alternative
  - marker: c
    text: “你”在原文中为阴性单数；这里可能转而直接对新娘说话。有些译本则按上下文将其处理为指向王。
    reason: alternative_reading
lexical_decisions:
- source_word: לִרְקָמוֹת
  choice: 身穿刺绣衣裳
  rationale: רְקָמוֹת指刺绣或多彩的织物；结合婚礼行列与衣着语境，补出“衣裳”使现代汉语清楚自然，同时保留刺绣这一核心意象。
- source_word: תּוּבַל
  choice: 被领到
  rationale: 这是יבל的使役被动式，表示“被带去、被引领”；婚礼行列的语境中，“被领到”既保留被动意义，也体现仪式性的行进。
- source_word: לַמֶּלֶךְ
  choice: 王面前
  rationale: 介词ל表示朝向；汉语“领到王面前”自然表达被带往王所在之处，未将对象改作其他人物。
- source_word: בְּתוּלוֹת
  choice: 童女
  rationale: 该词具体指未婚的处女。现代经文语体中的“童女”兼顾词义准确、庄重和婚礼侍从的语境；脚注说明可采用的现代说法。
- source_word: אַחֲרֶיהָ
  choice: 跟随在她身后的
  rationale: 该词可表示“在她之后／身后”；在行列语境中译作“跟随在她身后的”最清晰。
- source_word: רֵעוֹתֶיהָ
  choice: 她的同伴
  rationale: רֵעוֹת表示女性朋友或同伴；“同伴”保留关系含义，不额外限定她们正式担任伴娘或侍女。
- source_word: מוּבָאוֹת
  choice: 也被带到
  rationale: 这是בוא的使役被动分词阴性复数，承接童女和同伴；“被带到”直接保留复数主体的被动移动，并避免与前句机械重复。
- source_word: לָךְ
  choice: 你面前
  rationale: 原文为第二人称阴性单数，指向新娘。正文保留“你”的直接称呼，不将其平顺化为“王”或“他”；“面前”使汉语搭配自然。
theological_decisions:
- issue: 末尾לָךְ所造成的称呼转换
  choice: 保留第二人称“你”，并在脚注指出原文是阴性单数，理解为转而直接对新娘说话。
  alternative: 按上下文改为“王面前／他面前”，或意译为“同她一起被带来”。
  rationale: 马所拉文本明确使用第二人称阴性单数。即使这使诗句从第三人称叙述突然转为直接称呼，也应保留原文的诗性张力，而不擅自消除人称转换。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“身穿刺绣衣裳”清楚呈现婚礼服饰；“童女”保持原词较具体的含义，并以脚注提供现代替代说法。两个分句分别用“被领到”和“被带到”，保留希伯来文的被动结构而避免汉语重复生硬。正文严格保留末尾第二人称的突转。
