source:
  edition: WLC
  text: יָפְיָפִ֡יתָ מִ/בְּנֵ֬י אָדָ֗ם ה֣וּצַק חֵ֭ן בְּ/שְׂפְתוֹתֶ֑י/ךָ עַל כֵּ֤ן בֵּֽרַכְ/ךָ֖ אֱלֹהִ֣ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/002.yaml
  text: You are more beautiful than the sons of men[a]; grace is poured upon your lips[c][b]; therefore God has blessed you forever.
translation:
  language: zh_hans
  text: 你比世人更俊美[a]；恩惠倾注在你嘴唇上[b]；因此，上帝永远赐福给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“你比人的众子俊美”，是说这位君王比其他人都俊美。
    reason: cultural_note
  - marker: b
    text: “恩惠”也可译为“恩宠”或“优雅”。原文以“倾注在你嘴唇上”的意象，关联君王言语所显出的蒙悦纳与优美。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפְיָפִיתָ
  choice: 你比……都俊美
  rationale: 该形式来自 יפה，是加强性的诗歌表达；结合介词 מִן 所引出的比较，译为“比……都俊美”，既保留超越众人的含义，也自然符合对男性君王的称颂。
- source_word: מִבְּנֵי אָדָם
  choice: 世人
  rationale: 字面为“人的众子”，在诗歌中泛指其他人类。现代汉语以“世人”简洁传达比较对象，不把希伯来语习语生硬直译为“人的众子”。
- source_word: הוּצַק
  choice: 倾注
  rationale: יצק 的被动完成式表示“被倾倒、被浇注”。汉语用“倾注”保留丰盛浇下的意象；句中采用无标记的受事结构，较“被倾注”更自然。
- source_word: חֵן
  choice: 恩言
  rationale: חֵן 可指恩惠、优美、亲切可喜之处。因其与“嘴唇”相连，此处主要关乎优雅而蒙悦纳的言语；“恩言”在现代中文圣经语体中自然，并保留“恩”与言语美善的双重意味。
- source_word: בְּשְׂפְתוֹתֶיךָ
  choice: 在你唇上
  rationale: 介词 בְּ 可依语境表达位置或关联。配合“倾注”的意象，“在你唇上”自然且形象。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 明确表达原文的推论关系，并保持庄重的诗歌逻辑。
- source_word: בֵּרַכְךָ אֱלֹהִים
  choice: 上帝赐福给你
  rationale: 动词为第三人称阳性单数完成式，带第二人称阳性单数后缀；אֱלֹהִים 最自然地作主语。中文不强制标示完成体，避免加入原文没有的“已经”，仍可表达既成并持续有效的赐福。
- source_word: לְעוֹלָם
  choice: 直到永远
  rationale: 表达持续无尽的时限，符合现代汉语庄重诗体，也保留王室诗篇的宏阔语气。
theological_decisions:
- issue: 末句 אֱלֹהִים 是主语还是呼语
  choice: 作主语：“因此，上帝赐福给你”
  alternative: 作呼语：“因此，上帝啊，他赐福给你”或借入下一节内容译作“上帝啊，你的上帝赐福给你”
  rationale: 就本节自身的词序和句法而言，אֱלֹהִים 最自然是 בֵּרַכְךָ 的主语。译文不借用下一节补足主语，也不为特定基督论解读而强行改变本节结构。
- issue: חֵן 指上帝的恩惠还是君王言语的优美亲切
  choice: 译作“恩言”，保留恩惠与优美言语的语义交叠
  alternative: “恩惠”或“优雅”倾注在你唇上
  rationale: 原词有意涵宽度，而“嘴唇”使言语层面突出。“恩言”不将其缩减为单纯神学术语或外在魅力，保留诗句的复合意味。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“俊美”适用于受称颂的男性君王；“世人”自然转换希伯来诗歌习语；分号保留三段平衡结构。所有脚注标记均置于对应正文之后。
