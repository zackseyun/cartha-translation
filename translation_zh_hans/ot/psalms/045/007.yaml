  text: אָהַ֣בְתָּ צֶּדֶק֮ וַ/תִּשְׂנָ֫א רֶ֥שַׁע עַל כֵּ֤ן מְשָׁחֲ/ךָ֡ אֱלֹהִ֣ים אֱ֭לֹהֶי/ךָ שֶׁ֥מֶן שָׂשׂ֗וֹן מֵֽ/חֲבֵרֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/007.yaml
  text: You have loved righteousness and hated wickedness[a]; therefore God, your God[b], has anointed you with the oil of gladness beyond your companions.
translation:
  language: zh_hans
  text: 你喜爱公义，恨恶邪恶；因此，上帝——你的上帝[a]，用喜乐的油膏你，胜过你的同伴。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以上帝啊，你的上帝用喜乐的油膏了你，胜过你的同伴。”第一个“上帝”也可读作呼格，而不是“膏了你”的主语。
    reason: alternative_reading
  - marker: b
    text: 《希伯来书》1:9引用本节。
    reason: cross_reference
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: 你喜爱
  rationale: Qal完成式第二人称阳性单数；在诗歌对君王的直接称述中表达一贯而确定的品格，现代汉语用“喜爱”自然呈现，不必机械标示过去时。
- source_word: צֶּדֶק
  choice: 公义
  rationale: 兼有正直、公正及合乎正道之意；“公义”保留本节伦理与神学分量，并与“邪恶”构成鲜明对照。
- source_word: וַתִּשְׂנָא
  choice: 恨恶
  rationale: 延续第二人称陈述；“恨恶”比单用“恨”更庄重，也自然指向对恶的道德拒斥。
- source_word: רֶשַׁע
  choice: 邪恶
  rationale: 指道德上的恶与不义；“邪恶”是现代汉语中自然、清楚的总括表达。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 明确表达前述品格与随后受膏之间的推论或因果关系。
- source_word: מְשָׁחֲךָ
  choice: 膏了你
  rationale: 保留 משׁח 的君王受膏及分别任命色彩；汉语“用……油膏了你”清楚呈现动作和媒介。
- source_word: אֱלֹהִים אֱלֹהֶיךָ
  choice: 上帝，就是你的上帝
  rationale: 正文把第一个 אֱלֹהִים 读作谓语动词的主语，第二个作同位说明；加入“就是”使现代汉语关系明确，同时以脚注保留呼格读法。
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: 喜乐的油
  rationale: 保留希伯来语属格结构及喜庆、尊荣的意象；“喜乐的油”庄重且易懂。
- source_word: מֵחֲבֵרֶיךָ
  choice: 使你胜过你的同伴
  rationale: מן 表比较；将比较关系自然连接到受膏所得的超越地位，避免生硬的“膏你超过同伴”。
theological_decisions:
- issue: אֱלֹהִים 在“膏了你”一语中的句法与神学含义
  choice: 正文读作主语：“上帝，就是你的上帝……膏了你”。
  alternative: 读作呼格：“所以上帝啊，你的上帝……膏了你”。
  rationale: 希伯来语在此允许主语和呼格两种分析。正文采用就本节动词结构而言较顺畅的主语读法，但脚注明确保留呼格读法，不借翻译消解其神学张力。
- issue: 本节与《希伯来书》1:9的关系
  choice: 正文按诗篇希伯来语语境翻译，另以脚注标明新约引用。
  alternative: 直接按《希伯来书》引用形式调整诗篇正文。
  rationale: 坚持原文优先，同时让读者知悉正典内部的引用关系，不以新约措辞覆盖诗篇本身可存的句法歧义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话书面语。“公义／邪恶”“喜乐的油”“膏了你”保留诗歌的伦理对比、礼仪意象与王室语境。脚注标记均置于正文中：[a]紧随存在歧义的“你的上帝”，[b]置于全节末尾以标示交叉引用。
