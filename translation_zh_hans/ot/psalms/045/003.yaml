  text: חֲגֽוֹר חַרְבְּ/ךָ֣ עַל יָרֵ֣ךְ גִּבּ֑וֹר ה֝וֹדְ/ךָ֗ וַ/הֲדָרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/003.yaml
  text: Strap your sword on your thigh[a], mighty warrior[b], in your splendor and your majesty.
translation:
  language: zh_hans
  text: 勇士啊，把你的剑佩在大腿一侧[a]，以你的荣美和威严[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“把你的剑束在你的大腿上。”此处指剑佩带在大腿部位。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“你的荣美和你的威严”，未明说这两个词与前面命令句的句法关系；也可理解为对这位勇士之王者威仪的同位描述。
    reason: alternative_reading
lexical_decisions:
- source_word: חֲגוֹר
  choice: 佩
  rationale: 该命令式动词本义是“束上、系上”。现代汉语说把剑“佩”在身旁，既自然，也保留了将武器系在身上的具体动作。
- source_word: חַרְבְּךָ
  choice: 你的剑
  rationale: 该词带第二人称阳性单数后缀，直指受话者的武器；在此王者、勇士的诗歌语境中译作“剑”庄重而自然。
- source_word: עַל יָרֵךְ
  choice: 在大腿旁
  rationale: 原文具体指大腿处，而非泛指“身边”。“在大腿旁”符合佩剑的位置，也避免汉语“在大腿上”可能引起的误解。
- source_word: גִּבּוֹר
  choice: 勇士
  rationale: 此处作呼语，可指大能者、英雄或勇猛战士。上下文明确涉及佩剑，因此“勇士”简洁自然，同时不额外限定其身份。
- source_word: הוֹדְךָ
  choice: 你的威荣
  rationale: הוֹד在王室诗歌中表示荣光、威仪与华美。“威荣”兼具威势和荣耀，适合此处庄严的诗体。
- source_word: וַהֲדָרֶךָ
  choice: 和尊贵
  rationale: הדר可表示尊荣、华美或威严。“尊贵”与“威荣”形成自然并列，并保留王者的高贵气象。
theological_decisions:
- issue: 诗篇45篇中王者称呼可能具有的弥赛亚意义
  choice: 按本节直接语境译为对一位佩剑勇士的呼语，不在正文中明说其为弥赛亚
  alternative: 依据后来的正典使用，在译文中直接采用明确的弥赛亚称谓
  rationale: 希伯来文本本身在本节直接称受话者为“勇士”，没有明确出现“弥赛亚”一词。译文保留其直接的王者与军事图景，也不排除读者从更广的正典脉络作进一步理解。
- issue: 末尾“你的威荣和尊贵”与命令句的句法关系
  choice: 以“带着”连接，理解为勇士佩剑时所显出的王者威仪
  alternative: 将两个名词视为同位成分，或理解为进一步命令所涉及的对象
  rationale: 希伯来语仅并列两个带第二人称后缀的名词，没有明示介词或谓语；“带着”在汉语中能自然联系前句，但脚注保留其他句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“佩剑”比“束剑”更符合当代汉语习惯；“大腿旁”保留原文具体意象。“威荣和尊贵”维持两个近义王室词语的并列，不将其合并为单一概念。
