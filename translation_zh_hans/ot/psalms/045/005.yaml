  text: חִצֶּ֗י/ךָ שְׁנ֫וּנִ֥ים עַ֭מִּים תַּחְתֶּ֣י/ךָ יִפְּל֑וּ בְּ֝/לֵ֗ב אוֹיְבֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/005.yaml
  text: Your arrows are sharp[a]; peoples fall beneath you; they are in the heart of the king’s enemies.
translation:
  language: zh_hans
  text: 你的箭锐利[a]；众民倒在你脚下；箭在王的仇敌心中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“你的箭锐利——众民倒在你之下——在王的仇敌心中。”希伯来文高度凝练；末句可承接“你的箭”。
    reason: 保留希伯来诗句的省略结构，以及“在……心中”的地点性字面表达；正文为使汉语句法完整而重提“箭”，但不补出“射入”一类动作。
lexical_decisions:
- source_word: חִצֶּיךָ
  choice: 你的箭
  rationale: חֵץ的复数形式带第二人称阳性单数后缀，直译为“你的箭”；现代汉语自然、清楚。末句再次以“箭”承接，以补足希伯来诗句中省略的主语。
- source_word: שְׁנוּנִים
  choice: 锋利
  rationale: 该词表示“锐利的、磨尖的”；译作“锋利”简洁地保留箭已磨锐的含义。
- source_word: עַמִּים
  choice: 众民
  rationale: עַם的复数指多个民族或民众群体。“众民”保留复数集合意味，又不把它限定为现代民族国家。
- source_word: תַּחְתֶּיךָ
  choice: 在你脚下
  rationale: 原义为“在你下面”。武功与降服的诗歌语境中，“在你脚下”是自然的汉语表达，同时保留上下方位意象。
- source_word: יִפְּלוּ
  choice: 倒下
  rationale: נפל的未完成式在此可表示将来动作或生动呈现的动作；汉语“倒下”不必硬性标注明确时态，保留其诗意张力。
- source_word: בְּלֵב
  choice: 直入……之心
  rationale: 字面为“在……心中”。希伯来文末句高度省略，语意上承接前面的箭；“直入……之心”使汉语完整，并保留箭位于敌人心中的图像。脚注另列较直译形式。
- source_word: אוֹיְבֵי הַמֶּלֶךְ
  choice: 王敌
  rationale: 该组合字面为“王的仇敌”。“王敌”是凝练的诗体表达，保留第三人称“王”，不改写成“你的仇敌”。
theological_decisions:
- issue: 王在王室诗篇中的所指及其弥赛亚意义
  choice: 正文保留“王”，不在译文中明说其为弥赛亚
  alternative: 在正文中直接译为弥赛亚或把“王的仇敌”改成“你的仇敌”
  rationale: 希伯来文本此处明确写“王”。本诗可以有历史性的王室语境，也可在基督教诠释中具有弥赛亚意义；翻译本身应保留原文称谓和解释空间。
translation_notes:
  register: 采用现代、庄重而凝练的诗体汉语。“众民”避免现代政治色彩较强的“各国”；“王敌之心”略带典雅色彩，与诗篇体裁相称，但普通读者仍易理解。
