  text: אַזְכִּ֣ירָה שִׁ֭מְ/ךָ בְּ/כָל דֹּ֣ר וָ/דֹ֑ר עַל כֵּ֥ן עַמִּ֥ים יְ֝הוֹדֻ֗/ךָ לְ/עֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/017.yaml
  text: I will cause your name to be remembered in every generation[b][a]; therefore the peoples will praise you forever and ever.
translation:
  language: zh_hans
  text: 我要使你的名在世世代代中被人记念[a]；因此，众民必永永远远赞美你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要提说你的名”，或“我要记念你的名”。希伯来语动词为使役式，着重主动使人记念其名。
    reason: lexical_alternative
  - marker: b
    text: 或译：“向你称谢”。这个希伯来语动词在敬拜语境中既可表示赞美，也可表示感谢。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּירָה
  choice: 我要使……被人记念
  rationale: זכר 的使役式在此突出主动促成纪念的含义，不只是说话者自己记得，也可包含传扬其名、使后世记念。此译保留使役意味，并符合现代汉语表达。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 直译“你的名”，在语境中也涵盖声名、名望及受纪念的身份，不必在正文中缩窄其含义。
- source_word: בְּכָל דֹּר וָדֹר
  choice: 世世代代
  rationale: 原文是逐代分配性的惯用表达；“世世代代”自然、庄重，并表达历代延续。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 明确表达前后两句的结果或推论关系，保留原文较正式的连接力度。
- source_word: עַמִּים
  choice: 万民
  rationale: 原文为复数，指多个民族或众民。“万民”在汉语诗歌及经文语体中自然凝练，同时保留群体的广泛性。
- source_word: יְהוֹדֻךָ
  choice: 赞美你
  rationale: ידה 的使役式在诗篇敬拜语境中可表示赞美或感谢；此处“赞美”与君王之名被传扬的语境契合，而脚注保留“称谢”的可能。
- source_word: לְעוֹלָם וָעֶד
  choice: 永永远远
  rationale: 原文叠加强调绵延无尽；“永永远远”保留强化的持续意味，也符合庄重而通顺的现代汉语。
theological_decisions:
- issue: 本节第二人称代词所指的对象
  choice: 保留“你的名”和“赞美你”的直接称呼，不在译文中进一步指明对象
  alternative: 明确译作对大卫王系君王的称呼，或明确作弥赛亚性称呼
  rationale: 本节本身只用第二人称直接称呼。在王室婚礼诗的历史语境及其后续正典和基督论理解之间，译文不应替读者预先消解张力。
translation_notes:
  register: 采用现代标准普通话的简体中文，保持诗歌所需的庄重与凝练。“世世代代”“万民”“永永远远”易于普通读者理解，也保留诗篇的节奏。所有脚注标记均置于其所说明的词句之后。
