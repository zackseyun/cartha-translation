- issue: לִבְנֵי קֹרַח 所表达的关系
  choice: 可拉子孙的诗
  alternative: 可拉子孙所作／为可拉子孙而作
  rationale: 原文介词不能单独确定作者身份或奉献对象，因此不在正文中断言明确作者关系。
- issue: מַשְׂכִּיל 的文类含义
  choice: 保留音译“玛斯基勒”
