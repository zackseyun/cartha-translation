    text: “百合花”希伯来文为 Shoshannim（音译“朔珊宁”），字面意思是“百合花”；在此通常被理解为曲调或其他音乐标记，确切所指不明。
    reason: lexical_alternative
  - marker: b
    text: “可拉子孙的”也可理解为“可拉子孙所作”或“为可拉子孙而作”；原文介词可表示归属、作者或奉献对象。
    reason: source_ambiguity
  - marker: c
    text: “玛斯基勒”是诗篇题记中的希伯来文技术术语，可能指默想性或训诲性的作品，确切含义不明。
    reason: lexical_alternative
  - marker: d
    text: 原文为“爱恋”复数形式的“歌”；也可理解为“一首情歌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 这是诗篇题记中的音乐职分用语；“乐长”简洁庄重，也不把职责限缩为合唱指挥。
- source_word: עַל שֹׁשַׁנִּים
  choice: 调用《百合花》
  rationale: עַל 在音乐题记中可引出曲调、演奏方式或乐器名称；“调用”自然表达按某一已知音乐设置演唱，同时不武断确定其具体性质。שֹׁשַׁנִּים 按字面译为“百合花”，并以书名号表明可能是曲调名。
- source_word: לִבְנֵי קֹרַח
  choice: 可拉子孙的诗
  rationale: 介词 ל־ 可表示归属、作者或献给对象；正文采用自然但相对宽泛的所属表达，并以脚注保留关系上的不确定性。
- source_word: מַשְׂכִּיל
  choice: “玛斯基勒”诗
  rationale: 这是诗篇题记中的技术术语，确切含义不明。音译可避免把它过早限定为“训诲诗”或“默想诗”；引号提示它是专门名称。
- source_word: שִׁיר יְדִידֹת
  choice: 一首爱情之歌
  rationale: שִׁיר 是“歌”；יְדִידֹת 为复数，可能指爱情、爱恋之事或情歌。正文采用自然的现代汉语表达，脚注说明其异常复数形式。
