id: PSA.45.11
reference: Psalms 45:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יִתְאָ֣ו הַ/מֶּ֣לֶךְ יָפְיֵ֑/ךְ כִּי ה֥וּא אֲ֝דֹנַ֗יִ/ךְ וְ/הִשְׁתַּֽחֲוִי לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/011.yaml
  text: and the king will desire your beauty[a], for he is your lord[b]; bow down to him.
translation:
  language: zh_hans
  text: 王必爱慕你的美貌[a]，因为他是你的主；你要向他俯伏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿王爱慕你的美貌。”这个希伯来语形式既可理解为将来的陈述，也可能带有愿望或劝勉的语气。
    reason: lexical_alternative
  - marker: b
    text: “俯伏”也可按语境译作“下拜”或“表示敬意”；这个动词既可指在君王或尊长面前俯身，也可用于敬拜上帝。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְאָו
  choice: 王必爱慕
  rationale: 该词为未完成式第三人称阳性单数，带连接词；在本诗语境中可作将来陈述，也可能带愿望或劝勉意味。正文采用较直接的将来陈述“必爱慕”，并以脚注保留语气上的歧义。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定冠词加“王”；汉语诗体中以“王”自然表达特指的君王，无须机械加“那位”。
- source_word: יָפְיֵךְ
  choice: 你的美貌
  rationale: 该词指美丽、容貌之美；“美貌”在婚礼诗歌语境中自然、庄重，同时保留身体与整体吸引力的开放性。
- source_word: כִּי
  choice: 因为
  rationale: 引出理由，明确保留原文的因果关系。
- source_word: הוּא
  choice: 他
  rationale: 保留独立人称代词所带的强调。
- source_word: אֲדֹנַיִךְ
  choice: 你的主
  rationale: 此处是 אָדוֹן 加第二人称阴性单数后缀，指王作为女子的“主”；不用“主人”，以免在现代汉语中增添过强的奴属色彩，也不将其处理为上帝的专称。
- source_word: וְהִשְׁתַּחֲוִי
  choice: 你要向他俯伏
  rationale: 该命令式动词本义是俯身、下拜。“俯伏”保留身体动作及尊崇含义，却不预先判定这是宫廷礼敬还是宗教敬拜。
- source_word: לוֹ
  choice: 向他
  rationale: 介词与第三人称阳性单数后缀在汉语中自然译为“向他”，与“俯伏”搭配。
theological_decisions:
- issue: 是否把 וְהִשְׁתַּחֲוִי לּוֹ 明确译成宗教性的敬拜
  choice: 你要向他俯伏
  alternative: 你要向他下拜／敬拜他
  rationale: 原动词既可用于向上帝俯伏，也可用于向君王或尊长表示臣服、敬意。诗篇45篇的王室婚礼语境不足以单凭此词断定其必为宗教敬拜，因此正文保留动作本身，并在脚注列出可能的语境性译法。
- issue: וְיִתְאָו 的未完成式语气
  choice: 王必爱慕
  alternative: 愿王爱慕／让王爱慕
  rationale: 该形式可自然理解为将来陈述，也可能因前文连续劝告而带愿望或劝勉色彩。正文采用将来陈述，不消除另一种语气可能，并以脚注说明。
- issue: אֲדֹנַיִךְ 是否应作神圣称号处理
  choice: 你的主
  alternative: 你的主人
  rationale: 希伯来文使用普通名词 אָדוֹן，并非神名；译作“主”既保留王室与婚姻关系中的权威称谓，也不擅自将其限定为神圣称号。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“王必爱慕”顺应最新审校所确认的简单将来读法；两个脚注分别保留动词语气及“俯伏”在宫廷礼敬与宗教敬拜之间的语义张力。
