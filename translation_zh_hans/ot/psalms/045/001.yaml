base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/001.yaml
  text: My heart overflows with a good word[a]; I say[c][b], “My work is for the king.” My tongue is the pen of a skillful scribe.
translation:
  language: zh_hans
  text: 我的心涌出美好的话语[a]；我说：“我的作品献给王[b]。”我的舌头是娴熟文士的笔[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“佳美的主题”或“高尚的事”。希伯来语可指所说的话，也可指话语表达的题旨。
    reason: lexical_alternative
  - marker: b
    text: 或译“论到王”或“对王说”。这里的介词可表示奉献、题旨或话语所指向的对象。
    reason: lexical_alternative
  - marker: c
    text: 或译“敏捷文士的笔”或“随时预备好的文士的笔”。希伯来语形容词既可强调迅速、敏捷，也可强调娴熟或准备就绪。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחַשׁ
  choice: 涌出
  rationale: 这个动词描写内心之物涌动、冒出；“涌出”既保留诗歌意象，也自然表达思想和言语从心中流露。
- source_word: לִבִּי
  choice: 我的心
  rationale: 保留希伯来文以“心”指人的思想、情感和内在自我的常见表达。
- source_word: דָּבָר טוֹב
  choice: 美好的话语
  rationale: דָּבָר 可指话语、事情或主题；正文采用自然且贴近字面的“美好的话语”，其他可能含义列入脚注。
- source_word: אֹמֵר אֲנִי
  choice: 我说
  rationale: 采用简洁直接的表达，不额外限定为吟诵或宣告。
- source_word: מַעֲשַׂי
  choice: 我的作品
  rationale: 在诗歌创作的语境中，很可能指诗人所作成的作品；“作品”比“诗篇”更少限定，也比“行为”更符合上下文。
- source_word: לְמֶלֶךְ
  choice: 献给王的
  rationale: 介词 לְ 可表示归属、方向、题旨或受词；正文按王室诗歌的语境表达为献辞，同时以脚注保留其他可能。
- source_word: לְשׁוֹנִי
  choice: 我的舌头
  rationale: 保留以舌头比作书写工具的身体意象，不弱化为“我的言语”。
- source_word: עֵט
  choice: 笔
  rationale: “笔”是现代中文最自然的书写工具名称，又能清楚保留原文比喻。
- source_word: סוֹפֵר
  choice: 文士
  rationale: 这里指受过训练、善于书写的人；“文士”保留古代文学语境，且比“书记”更适合诗体。
- source_word: מָהִיר
  choice: 娴熟
  rationale: 该词本义可突出迅速、敏捷或随时预备好；在书写者的语境中，“娴熟”自然传达因训练有素而行笔流畅的含义，其他侧重点保留于脚注。
theological_decisions: []
