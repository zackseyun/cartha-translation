  yaml_path: translation/ot/psalms/045/016.yaml
  text: In place of your fathers will be your sons[b][a]; you will appoint them as princes in all the earth.
translation:
  language: zh_hans
  text: 你的众子将接替你的列祖；你将立他们为全地[a]的首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译为“全境”或“国土”。希伯来语 אֶרֶץ 按语境可指“大地”，也可指一片“土地”或“国土”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: 由……接替
  rationale: 此处表示替代与王朝承继，而非空间上的“在……下面”；结合汉语语序译作“由……接替”自然清楚。
- source_word: אֲבֹתֶיךָ
  choice: 你的列祖
  rationale: 原词直指“父辈”，在王室承继语境中指先祖；“列祖”既保留父系、王朝色彩，也符合庄重诗体。
- source_word: יִהְיוּ בָנֶיךָ
  choice: 你的众子接替
  rationale: 未完成式在此表达将来的应许；“众子”保留阳性复数及王位继承人的含义，未来意义由整句语境自然呈现。
- source_word: תְּשִׁיתֵמוֹ
  choice: 你要立他们
  rationale: שׁית本义为“放置、设立”；在任命统治者的语境中，“立”简洁地表达设立、任命之意。
- source_word: לְשָׂרִים
  choice: 作首领
  rationale: שָׂרִים可指首领、统治者或官长；“首领”保留统治职分，又不额外断定他们具有王子身份。
- source_word: בְּכָל הָאָרֶץ
  choice: 在全地
  rationale: אֶרֶץ可指“大地”或特定的“土地、国土”；正文采用较具普世范围且保持经文风格的“全地”，并以脚注保留另一可能。
theological_decisions:
- issue: 王室诗篇中הָאָרֶץ的范围
  choice: 全地
  alternative: 遍及全境（或全境各处）
  rationale: 希伯来词本身容许普世性的“大地”或地域性的“国土”两种理解。正文采用范围较广的“全地”，但不借此强行确立后来的弥赛亚解释；脚注明确保留地域性读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“列祖—众子”突出王朝承继；“立……作首领”简练自然。正文脚注标记[a]置于相关短语所在句末。
