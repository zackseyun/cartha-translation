  text: תּ֭וּבַלְנָה בִּ/שְׂמָחֹ֣ת וָ/גִ֑יל תְּ֝בֹאֶ֗ינָה בְּ/הֵ֣יכַל מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/015.yaml
  text: They will be led with gladness and rejoicing[b][a]; they will enter the palace of the king.
translation:
  language: zh_hans
  text: 她们必带着欢喜和欢腾被引领[a]；她们必进入王宫[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她们必在喜乐和欢腾中被带去。”
    reason: lexical_alternative
  - marker: b
    text: “王宫”所译的希伯来词也可指“大厅”，在其他语境中还可指“圣殿”；这里的王室婚礼背景更适合译作“王宫”。
    reason: cultural_note
lexical_decisions:
- source_word: תּוּבַלְנָה
  choice: 她们必……被引领
  rationale: 该词是יבל的使役被动未完成式、第三人称阴性复数，表示“被领去／被带去”。“被引领”保留婚礼队伍行进的画面，也保留原文的被动语态。
- source_word: בִּשְׂמָחֹת
  choice: 在欢喜……中
  rationale: 介词ב与复数名词שְׂמָחוֹת在这里表示伴随情形或方式；汉语用“在欢喜……中”自然表达庆贺氛围，不机械复制复数形式。
- source_word: וָגִיל
  choice: 欢腾
  rationale: גיל指强烈、洋溢的喜悦。“欢腾”既与前面的“欢喜”有所区别，也保留两个喜乐词并列加强的效果。
- source_word: תְּבֹאֶינָה
  choice: 她们必进入
  rationale: בוא在来到建筑物的语境中可明确表达“进入”；阴性复数形式由“她们”体现。
- source_word: בְּהֵיכַל
  choice: 王的宫殿
  rationale: הֵיכָל可指宫殿、大厅，也可在其他语境中指圣殿。诗篇45篇的王室婚礼场景以“宫殿”最合适。
- source_word: מֶלֶךְ
  choice: 王的
  rationale: 虽无定冠词，但上下文所指是本诗特定的王；“王的宫殿”在汉语中自然，并保留原文领属结构。
theological_decisions:
- issue: 阴性复数动词所指的对象
  choice: 用“她们”保留阴性复数，按紧邻语境理解为新娘一行的女子，但正文不进一步指明身份。
  alternative: 明确译作“陪伴新娘的童女”或泛指“众女子”。
  rationale: 本节延续前文的婚礼行列画面；原文动词只明确阴性复数，正文不应加入本节没有明说的具体身份。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“欢喜欢腾”保留原文两个近义喜乐词的并列；分号呈现行进与进入宫殿两个连续动作。所有脚注标记均放在对应词句之后。
