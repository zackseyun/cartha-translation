  text: וַ/הֲדָ֬רְ/ךָ֨ צְלַ֬ח רְכַ֗ב עַֽל דְּבַר אֱ֭מֶת וְ/עַנְוָה צֶ֑דֶק וְ/תוֹרְ/ךָ֖ נוֹרָא֣וֹת יְמִינֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/004.yaml
  text: In your majesty ride on victoriously for the cause of truth and meekness and righteousness[b][a]; let your right hand teach you awesome deeds.
translation:
  language: zh_hans
  text: 你要以威严乘驾，得胜前行，为真理、谦和与公义而奋进；愿你的右手指教你可畏之事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿你的右手指教你可畏之事”或译：“你的右手必向你显明可畏之事。”
    reason: 原文动词可按命令语境理解为祈愿式的“愿……指教”，也可理解为陈述性的“必……指教／显明”；“可畏之事”可指令人惊惧或令人敬畏之事。
lexical_decisions:
- source_word: וַהֲדָרְךָ
  choice: 你当威严地
  rationale: הָדָר表示威严、荣美或尊荣；结合后面的命令式动词，译作“威严地”可自然修饰乘驾前行，并保留君王诗歌的庄重感。
- source_word: צְלַח רְכַב
  choice: 乘驾前行……得胜
  rationale: רכב是“骑乘、乘驾”，צלח可指顺利、成功或奋勇推进。将二者合译为“乘驾前行……得胜”，既保留骑乘图景，也表达胜利进军的语义。
- source_word: עַל דְּבַר אֱמֶת
  choice: 为真理
  rationale: עַל דְּבַר可表示“为了……的缘故／事业”。此处译作“为真理”，简洁表达君王为真理而行动，而不是把דְּבַר仅限于“话语”。
- source_word: וְעַנְוָה צֶדֶק
  choice: 谦和与公义
  rationale: עַנְוָה指谦卑、温柔或谦和，צֶדֶק指公义。希伯来语结构紧凑，可能是并列，也可能表示带有谦和特质的公义；正文采用自然的并列读法，避免在汉语中强行确定修饰关系。
- source_word: וְתוֹרְךָ
  choice: 愿……指教你
  rationale: 该词源于ירה的使役式，可表示“教导、指示”。其主语是后置的“你的右手”；“愿”保留此处可理解为祈愿式的语气，同时不排除陈述未来结果的可能。
- source_word: נוֹרָאוֹת
  choice: 行可畏之事
  rationale: נוֹרָאוֹת指令人敬畏、震慑或畏惧之事。结合“右手”所象征的能力与行动，汉语补出“行”，使句意自然；“可畏”保留敬畏与威慑并存的色彩。
- source_word: יְמִינֶךָ
  choice: 你的右手
  rationale: 直译以保留圣经诗歌中右手象征力量、技巧和得胜行动的意象。
theological_decisions:
- issue: 君王战士意象及其弥赛亚式后续解读
  choice: 保留诗篇对君王的直接称呼和骑乘得胜的图景，不在译文中明说弥赛亚身份。
  alternative: 将本节直接译成明确指向弥赛亚或基督的陈述。
  rationale: 本节在文学语境中直接称颂君王；保持这一历史—诗歌层面的表达，也让其在正典中的进一步神学解读保持开放。
- issue: עַנְוָה צֶדֶק的句法关系
  choice: 译为“谦和与公义”，按并列项理解。
  alternative: 译为“谦和的公义”或“公义的谦卑”。
  rationale: 原文高度压缩，两个名词的关系并不完全明确。并列译法在现代汉语中清楚自然，又不把不确定的修饰关系写死。
- issue: וְתוֹרְךָ的语气
  choice: 译为“愿你的右手指教你”。
  alternative: 译为“你的右手必指教你”。
  rationale: 希伯来语形式可作连续性的陈述，也可在命令语境中带祈愿色彩；正文采用祈愿式，脚注保留未来陈述的可能。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话书面语。“乘驾前行”保留古代君王骑乘的诗歌图景，但避免过度文言化；“谦和与公义”使用普通读者熟悉的宗教与伦理词汇。脚注标记[a]已置于相关分句之后。
