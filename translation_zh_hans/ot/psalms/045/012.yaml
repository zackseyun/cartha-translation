  text: וּ/בַֽת צֹ֨ר בְּ֭/מִנְחָה פָּנַ֥יִ/ךְ יְחַלּ֗וּ עֲשִׁ֣ירֵי עָֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/012.yaml
  text: And the daughter of Tyre will come with a gift[b][a]; the rich among the people will seek your favor.
translation:
  language: zh_hans
  text: 推罗的女儿必带着礼物[a]前来；民中的富人必求你的恩宠[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼物”或译“贡物”或“供物”；希伯来语 מִנְחָה 可随语境表示礼物、贡物或供物。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“求你的脸”，这是恳求施恩、求取好感的希伯来语惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת צֹר
  choice: 推罗的女儿
  rationale: “某地的女儿”是希伯来语将城市或其居民人格化的表达。保留这一诗歌意象，不直接释作“推罗人”。连接词 וּ 在中文中不必机械译出；分句承接关系已足够清楚。
- source_word: בְּמִנְחָה
  choice: 带着礼物
  rationale: מִנְחָה 可指礼物、贡物或供物；在王室场景中，“礼物”自然且不过度限定其性质。介词 בְּ 表示伴随，译作“带着”。
- source_word: פָּנַיִךְ יְחַלּוּ
  choice: 求你的恩宠
  rationale: 字面涉及“求你的脸”，但 חלה 的 Piel 形式与“脸”搭配，是恳求某人施恩、求取好感的惯用语。“求你的恩宠”自然表达其含义，并保留第二人称阴性单数所指的女性受话者。
- source_word: עֲשִׁירֵי עָם
  choice: 民中的富足人
  rationale: 该组合语表示一群人中的富有者。“民中的”保留 עָם 的概括性，不擅自指定某一民族；“富足人”符合庄重诗体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留“推罗的女儿”这一人格化意象；用分号呈现两个平行分句。脚注标记按其所解释的词语就近排列。
