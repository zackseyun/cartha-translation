base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/006.yaml
  text: Your throne[a], O God, is forever and ever[b]; the scepter of your kingdom is a scepter of uprightness.
translation:
  language: zh_hans
  text: 上帝啊，你的宝座[a]是永永远远的；你国度的权杖，是正直的权杖[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的宝座是上帝，直到永远”，或“你神圣的宝座永永远远”。希伯来语句法有争议；主文按呼格理解。
    reason: alternative_reading
  - marker: b
    text: 或译：“正直的权杖，是你国度的权杖。”
    reason: alternative_rendering
lexical_decisions:
- source_word: כִּסְאֲךָ
  choice: 你的宝座
  rationale: כִּסֵּא在君王诗篇的语境中指君王施行统治的宝座；“宝座”既准确又符合现代汉语的庄重诗体。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 主文把אֱלֹהִים理解为呼格，保留诗中直接称呼的语气，也符合此句重要的古代接受传统；由于希伯来语句法存在争议，其他读法列入脚注。
- source_word: עוֹלָם וָעֶד
  choice: 永永远远
  rationale: 这个组合强调恒久不止；“永永远远”自然凝练，并保留希伯来语叠加强调的诗意。
- source_word: שֵׁבֶט
  choice: 权杖
  rationale: 在王权语境中，שֵׁבֶט不是普通的杖，而是象征统治权柄的权杖。
- source_word: מִישֹׁר
  choice: 正直
  rationale: מִישֹׁר在这里表达伦理意义上的正直、公平；“正直”保留其道德向度，又不把含义限缩为司法层面的“公正”。
- source_word: שֵׁבֶט מַלְכוּתֶךָ
  choice: 你国度的权杖
  rationale: 这一译法保留希伯来语的属格关系和王权意象，比“你的王杖”更贴近原文结构。
theological_decisions:
- issue: 首句אֱלֹהִים的句法及神学意味
  choice: 按呼格译为“上帝啊，你的宝座……”。
  alternative: 也可能理解为“你的宝座永远是上帝”，或意译为“你神圣的宝座永永远远”。
  rationale: 呼格读法在上下文中自然，也有重要的古代及正典接受依据；但原文句法确有争议，因此主文不消解其直接称呼所形成的神学张力，同时在脚注中保存其他严肃提出的理解。
- issue: 后半句名词句的主语与表语关系
  choice: 译为“你国度的权杖，是正直的权杖”。
  alternative: 可按原文词序译为“正直的权杖，是你国度的权杖”。
  rationale: “你国度的权杖”在希伯来语中是限定成分，更适合作主语；主文据此采用自然的现代汉语语序，脚注则保存贴近原文次序的表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“上帝啊”前置，使汉语呼语自然清楚；分号对应两行诗意。“权杖”与“宝座”保留王权意象，并用重复的“权杖”再现原文的诗行结构。
