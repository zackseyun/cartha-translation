  text: שִׁמְעִי בַ֣ת וּ֭/רְאִי וְ/הַטִּ֣י אָזְנֵ֑/ךְ וְ/שִׁכְחִ֥י עַ֝מֵּ֗/ךְ וּ/בֵ֥ית אָבִֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/010.yaml
  text: Listen[a], daughter, and see; incline your ear, and forget your people and your father's house.
translation:
  language: zh_hans
  text: 女儿啊，你要听，要看；侧耳而听，忘记你的本族和你的父家。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעִי
  choice: 要听
  rationale: 这是שׁמע的阴性单数祈使式；“要听”简洁自然，并保留认真听从的呼召。
- source_word: בַת
  choice: 女儿啊
  rationale: 这是对女性受话者的直接称呼；加入语气词“啊”自然表达现代汉语中的呼格。
- source_word: וּרְאִי
  choice: 要看
  rationale: ראה的阴性单数祈使式，直译为“看”；与前面的命令并列，不把其具体所指解释得过窄。
- source_word: וְהַטִּי אָזְנֵךְ
  choice: 侧耳倾听
  rationale: 保留“使耳朵倾斜”的希伯来语意象，同时用现代汉语自然表达专心聆听。
- source_word: וְשִׁכְחִי
  choice: 忘记
  rationale: 保留שכח的直接词义和命令语气，不弱化为“离开”或“放下”。
- source_word: עַמֵּךְ
  choice: 你的族人
  rationale: עם在这里指女子所属的群体；“族人”比宽泛的“人民”更贴合婚嫁语境，同时不限定为近亲。
- source_word: וּבֵית אָבִיךְ
  choice: 和你的父家
  rationale: “父家”是简洁、可懂的汉语表达，保留希伯来语所指的父系家庭、家族或祖家意涵。
theological_decisions:
- issue: 婚嫁劝勉的力度
  choice: 保留新娘离开原有族群与父家的直接命令，呈现忠属关系的决定性转向。
  alternative: 将其泛化为智慧文学式的专心听从，或弱化为仅仅离开原居所。
  rationale: 连续的祈使语气以“忘记你的族人和你的父家”达到高潮，在诗篇的婚嫁背景中自然指向关系与忠属的重新定位；译文不进一步引入后来的教义性解释。
- issue: “看”的对象与含义
  choice: 保留未说明对象的“要看”。
  alternative: 译成“要思想”“要留意”，或补出所看的具体对象。
  rationale: 原文使用ראה但没有明说宾语；保留这一简洁和开放性，避免替原文消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“女儿啊”表达呼格；“侧耳倾听”保留原文意象；整体保留连续命令的力度与诗歌节奏。
