review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了四个阴性单数祈使语气，以及“看”未明示宾语的开放性。“忘记”也恰当地维持了שכח的直接力度。建议将“族人”调整为“本族”，因为עַמֵּךְ指所属的群体／民族，而不主要指群体中的个别成员。
  naturalness: 整体庄重自然。“侧耳而听”比“侧耳倾听”更紧凑，也更清楚地对应“使你的耳朵倾斜”这一习语；它同时保留了与首个“听”并列、递进的修辞。
  terminology: “父家”恰当对应בֵּית אָבִיךְ，既可指父系家庭，也可指原生家族。“本族”在此为现代读者可理解且庄重的群体称谓，较“族人”更贴近原文集合名词。
  issues:
