  text: כָּל כְּבוּדָּ֣ה בַת מֶ֣לֶךְ פְּנִ֑ימָה מִֽ/מִּשְׁבְּצ֖וֹת זָהָ֣ב לְבוּשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/013.yaml
  text: All glorious is the king’s daughter within[b][a]; her clothing is of woven gold.
translation:
  language: zh_hans
  text: 王的女儿在内极其荣美[a]；她的衣裳以金织纹装饰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王的女儿内里极其荣美。”这里的“在内”可能指她身在内室或宫中，也可能被理解为她内在的荣美。
    reason: lexical_alternative
  - marker: b
    text: 或译：“她的衣裳饰有金质镶饰”，或“她的衣裳绣有金线”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כְּבוּדָּה
  choice: 极其荣美
  rationale: כָּל在这里加强כְּבוּדָּה的程度，并非普通的数量词；“极其荣美”自然表达她满有尊荣与华美。
- source_word: בַת מֶלֶךְ
  choice: 王的女儿
  rationale: 按希伯来文直译，保留宫廷婚礼场景及原文表达；“公主”虽较简洁，却略微收窄了措辞。
- source_word: פְּנִימָה
  choice: 在宫内
  rationale: 该副词基本义为“向内、在里面”。结合王室婚礼语境，“在宫内”较自然，同时脚注保留“内在荣美”的句法与意义可能。
- source_word: מִמִּשְׁבְּצוֹת זָהָב
  choice: 以金线交织而成
  rationale: מִשְׁבְּצוֹת可指格状、镶嵌或精工编织的装饰。正文采用适合衣裳语境的织造成像，脚注保留镶饰与刺绣等可能。
- source_word: לְבוּשָׁהּ
  choice: 她的衣裳
  rationale: 该词泛指她所穿的衣服；“衣裳”庄重自然，又不限定为某一种袍服。
theological_decisions:
- issue: פְּנִימָה是地点描写还是内在品格
  choice: 正文按地点译为“在宫内”
  alternative: “王的女儿内里极其荣美”
  rationale: 该词通常是表示方向或地点的副词，婚礼场景也支持宫室内的理解；但希伯来语的简略句法可能让读者理解为内在荣美，因此不在正文中彻底排除，另以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体汉语。“荣美”兼顾王室的尊荣与外在华美；分号保留希伯来诗句两部分的并列关系。
