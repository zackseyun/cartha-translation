  yaml_path: translation/ot/psalms/045/008.yaml
  text: All your garments are fragrant with myrrh[a], aloes, and cassia; from ivory palaces[e][d][c][b], stringed instruments have made you glad.
translation:
  language: zh_hans
  text: 你的衣服都散发着没药、沉香和肉桂的芬芳；从象牙宫中[a]，他们使你欢喜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从象牙宫中”也可理解为“出自象牙宫”或“因象牙宫而”。这里的介词含义不十分确定。
    reason: alternative_reading
  - marker: b
    text: 原文没有明说“他们”的所指；也可能理解为乐声、乐师或其他复数事物。传统上常理解为弦乐或弦乐器。
    reason: alternative_reading
lexical_decisions:
- source_word: מֹר
  choice: 没药
  rationale: 指芳香树脂；“没药”是现代中文圣经语境中准确而通行的名称。
- source_word: וַאֲהָלוֹת
  choice: 沉香
  rationale: 此处指可作香料的芳香木材，并非现代所说的芦荟多肉植物；“沉香”能避免植物类别上的误解，并自然表达其香木含义。
- source_word: קְצִיעוֹת
  choice: 肉桂
  rationale: 指带香气的桂类树皮香料；“肉桂”是现代中文清楚、简洁的对应词。
- source_word: כָּל בִּגְדֹתֶיךָ
  choice: 你的衣服都散发着……的芬芳
  rationale: 希伯来文是无动词句，将三种香料与“你所有的衣服”并列。中文补出“散发着……的芬芳”，自然表达衣服带有这些香气的通常理解，而不误解为衣服由香料制成。
- source_word: מִן הֵיכְלֵי שֵׁן
  choice: 从象牙宫中
  rationale: הֵיכָל 可指宫殿、殿宇或大厅；本诗的王室婚礼场景支持“宫”。שֵׁן 字面为“牙”，在此指象牙。“从……中”保留来源或方位意义。
- source_word: שִׂמְּחוּךָ
  choice: 使你欢喜
  rationale: 这是使役意义的动词，直译为“他们／它们使你欢喜”；中文采用自然的使役表达。
- source_word: implicit subject of שִׂמְּחוּךָ
  choice: 弦乐
  rationale: 马所拉文本没有明说复数主语。结合宫廷庆典语境，传统上常理解为弦乐或乐器；正文采用“弦乐”以形成可读的中文句子，同时用脚注明确其推断性质。
theological_decisions:
- issue: 诗篇45篇的王室／弥赛亚语境
  choice: 按本节直接呈现的王室婚礼场景翻译，不在措辞中加入后来的弥赛亚解释
  alternative: 依照后来的正典或预表性理解，采用更明确的弥赛亚式措辞
  rationale: 本节本身描写君王的华服、宫殿与庆贺。后续正典传统可以赋予整首诗更深的弥赛亚意义，但译文不应把本节希伯来文未明说的解释直接写入正文。
- issue: “使你欢喜”的未明主语
  choice: 正文采用传统语境性补足“弦乐”，脚注明示原文未写出主语
  alternative: 补作“乐声”“乐师”，或完全不补出具体主语
  rationale: 希伯来文只用复数动词形式暗示一个复数主语，却没有将其写出。应保留这一文本上的不确定性，不把传统推断呈现为原文明说。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“衣服”比“袍服”更贴近 בגד 的一般含义；“散发着……的芬芳”清楚传达无动词句所表达的香气特征。分号保留两幅相关而有区分的宫廷意象。
