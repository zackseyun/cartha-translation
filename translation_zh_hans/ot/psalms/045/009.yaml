  text: בְּנ֣וֹת מְ֭לָכִים בְּ/יִקְּרוֹתֶ֑י/ךָ נִצְּבָ֥ה שֵׁגַ֥ל לִֽ֝/ימִינְ/ךָ֗ בְּ/כֶ֣תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/009.yaml
  text: Daughters of kings are among your honored women[b][a]; at your right hand stands the queen in gold of Ophir.
translation:
  language: zh_hans
  text: 列王的女儿在你尊贵的女子中[a]；王后身披俄斐的精金[b]，站在你右边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个短语较难确定，也可译作“在你珍爱的人中”或“在你的贵妇中”。
    reason: lexical_alternative
  - marker: b
    text: “俄斐的精金”指与俄斐有关的优质黄金；旧约中的俄斐以财富和黄金闻名。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹת מְלָכִים
  choice: 列王的女儿
  rationale: 按构造短语直译，保留希伯来诗句的王室意象；“公主们”虽较简洁，却不如本译法贴近原文形式。
- source_word: בְּיִקְּרוֹתֶיךָ
  choice: 在你所尊贵的女子中
  rationale: 该词形和具体所指较难确定。词根含“贵重、尊贵”之意；结合上下文中的王室女性，正文采用指人的译法，同时以脚注保留其他可能。
- source_word: נִצְּבָה
  choice: 站
  rationale: 该动词在诗歌场景描写中表示站立或就位；用现代汉语“站”自然呈现其状态。
- source_word: שֵׁגַל
  choice: 王后
  rationale: 此词指君王的女性配偶或后妃；“王后”简明、庄重，也符合王室婚礼语境。
- source_word: לִימִינְךָ
  choice: 在你右边
  rationale: 直接表达原文的方位关系，并保留宫廷中居于尊位的画面。
- source_word: בְּכֶתֶם אוֹפִיר
  choice: 佩戴俄斐的精金
  rationale: כֶּתֶם 指精金，俄斐说明其著名来源；介词短语在此表示以金饰装扮，译作“佩戴”使现代汉语自然，又未具体增添原文没有说明的饰物种类。
