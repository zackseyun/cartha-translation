  yaml_path: translation/ot/psalms/141/007.yaml
  text: As one plows and breaks up the earth[b][a], our bones have been scattered at the mouth of Sheol.
translation:
  language: zh_hans
  text: 正如人犁地、翻土一样[a]，我们的骨头散落在阴间之口[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好像人切开、劈开土地一样。”原文两个分词生动描写把地土分开的动作，也可用略有不同的耕作词语表达。
    reason: lexical_alternative
  - marker: b
    text: “阴间”是希伯来文对死者所在领域的称呼；传统上也译作“坟墓”，有些语境译作“地狱”则不够准确。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  choice: 正如……一样
  rationale: 明确引出比喻，符合现代汉语表达，也保留希伯来文的比较关系。
- source_word: פֹלֵחַ
  choice: 犁地
  rationale: 该词本义涉及切开、劈开；在与“破开”和“地土”并列的语境中，用“犁地”自然呈现耕作图景，同时保留切开土地的力度。
- source_word: וּבֹקֵעַ
  choice: 破土
  rationale: 该词表示劈开、裂开；“破土”在汉语中简洁自然，并与“犁地”形成动作上的递进和平行。
- source_word: בָּאָרֶץ
  choice: 地
  rationale: 此处指被翻动、破开的土地或土壤；译作“地”最符合农业语境。
- source_word: נִפְזְרוּ
  choice: 散落
  rationale: 保留Nifal形态所表达的被动或结果状态；“散落”能突出骨头四散、留在各处的惨烈景象。
- source_word: עֲצָמֵינוּ
  choice: 我们的骨头
  rationale: 直接保留原文具体而强烈的意象，不作弱化或抽象化。
- source_word: לְפִי
  choice: 在……之口
  rationale: 按字面保留“口”的意象，使阴间仿佛张口吞噬；“之口”也适合诗歌体裁的庄重语域。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 指死者所在的领域，而非必然带有后期教义中“地狱”的刑罚含义；“阴间”是现代中文中较准确且易懂的对应词。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 坟墓；死者之境；地狱
  rationale: “阴间”保留古代希伯来文所指死者领域的概念，又避免把后期关于“地狱”的特定刑罚观念带入经文。
- issue: “阴间之口”的意象
  choice: 保留拟人化的“口”
  alternative: 阴间的入口；坟墓边缘
  rationale: 原文使用פִי（口），形成阴间张口吞噬的强烈诗意；不将其平化为单纯的地点说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“正如……一样”清楚呈现比喻；“阴间之口”略带古雅色彩，以保留原文鲜明的拟人意象。所有脚注标记均置于相应正文词句之后。
