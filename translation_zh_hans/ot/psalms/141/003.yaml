  text: שִׁיתָ֣/ה יְ֭הוָה שָׁמְרָ֣ה לְ/פִ֑/י נִ֝צְּרָ֗/ה עַל דַּ֥ל שְׂפָתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/003.yaml
  text: Set a guard[a], O Yahweh, over my mouth; keep watch over the door of my lips.
translation:
  language: zh_hans
  text: '雅威啊，求你为我的口设立守卫；

    求你看守我嘴唇的门[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嘴唇的门”也可理解为“嘴唇的开口”或“嘴唇的门口”；希伯来文用“门”的意象。
    reason: 说明 דַּל 可指门、开口或门口；脚注锚定该词对应的“门”，并保留原文比喻。
lexical_decisions:
- source_word: שִׁיתָה
  choice: 设立
  rationale: 此处是向上帝发出的祈求，意为安置、设下；“设立”与后面的具体名词“守卫”搭配自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留经文对上帝名字的直接称呼。
- source_word: שָׁמְרָה
  choice: 守卫
  rationale: 此处为名词，指守望或看守者；译作“守卫”保留在口边设岗防守的具体意象。
- source_word: לְפִי
  choice: 在我口边
  rationale: 介词 לְ 表明守卫所针对或驻守的位置；“在我口边”在中文中清楚呈现这一空间意象。
- source_word: נִצְּרָה
  choice: 看守
  rationale: 祈使形式，与上句平行，表达谨慎守护、监看之意。
- source_word: דַּל שְׂפָתָי
  choice: 我嘴唇的门
  rationale: דַּל 在此指门或门扇；直译保留希伯来诗歌把嘴唇描绘成控制言语出入之门的鲜明比喻。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常重构的读音，并避免以称号代替专名。
- issue: 守口祈求的表达
  choice: 保留“守卫”与“门”的双重具体意象
  alternative: 意译为“求你约束我的言语”
  rationale: 原文以守卫和门描写对言语的管束；保留比喻，不将经文的诗性和祈求张力化约为抽象解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体；两行保持平行结构。“在我口边设立守卫”自然传达设岗看守之意，“我嘴唇的门”则有意保留原文略显突出的诗歌比喻。
