base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/001.yaml
  text: A psalm of David. O Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: zh_hans
  text: '大卫的诗。


    雅威[a]啊，我呼求你；

    求你快快来到我这里！


    我呼求你的时候，

    求你侧耳听我的声音。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH，传统常译“耶和华”或以“上主”代称；这里音译为“雅威”。
    reason: 说明神名的原文形式及主要汉语译法。
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中的常用体裁词；“诗”符合现代汉语《诗篇》的文体称呼，也不把它狭义化为仅供歌唱的“歌”。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 标题中的 לְ 可表示作者、归属、关联或献给某人；“大卫的”沿用自然、庄重的汉语表达，同时不过度限定其具体关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名 YHWH，而不以称号代替；正文加脚注说明传统译法。
- source_word: קְרָאתִיךָ
  choice: 我呼求你
  rationale: 该完成式在祷告语境中可表达已经发出的呼求，也可作为当前迫切的陈诉；“我呼求你”在汉语中自然，并保留时态语用上的开放性。
- source_word: חוּשָׁה לִּי
  choice: 求你快来我这里
  rationale: 保留“赶快、迅速”以及朝向祈求者的意思；没有擅自补入原文未明说的“帮助”或“拯救”。
- source_word: הַאֲזִינָה
  choice: 求你侧耳听
  rationale: 该使役命令式强调留心倾听；“侧耳听”比单说“听”更能传达诗体的恳求和专注意味。
- source_word: קוֹלִי
  choice: 我的声音
  rationale: 直接对应原文名词“声音”，不将其解释性地改成“哀求”或“呼喊”。
- source_word: בְּקָרְאִי לָךְ
  choice: 我呼求你的时候
  rationale: 介词 בְּ 与不定词结构在此自然表达时间关系；译文清楚保留与前句“呼求”的词语呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名 YHWH。“雅威”按通行的学术重构音译其名，避免以“上主”这一称号取代专名；脚注同时交代汉语传统译法“耶和华”及“上主”的替代传统。
- issue: חוּשָׁה לִּי 是否隐含帮助或拯救
  choice: 求你快来我这里
  alternative: 求你快来帮助我
  rationale: 上下文确有求助意味，但本节希伯来文本只明说迅速临到祈求者；正文不补出“帮助”，以保留原文的简洁和开放性。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。分行呈现平行结构；用“呼求”“侧耳听”保持诗歌和敬拜语域，但避免古奥表达。感叹号体现命令式祈求的急迫感。
