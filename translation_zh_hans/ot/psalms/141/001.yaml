review_pass:
  verdict: revise
  source_fidelity: 译文准确传达题注“大卫的诗”、对雅威的呼求、求其迅速来到，以及求其垂听祈祷者声音。惟“快来我这里”在现代汉语中略显生硬，宜调整语序；末两行也可按希伯来语语序先发出“侧耳听”的请求，再以时间从句修饰，保留原文推进。
  naturalness: 整体庄重、易懂，适合诗篇祷告体。“雅威啊”“呼求”“侧耳听”均自然。将“快来我这里”改为“快快来到我这里”，并将末句整合为“我呼求你的时候，求你侧耳听我的声音”，会更顺畅。
  terminology: “大卫的诗”恰当地保留标题中 לְדָוִד 的关联性，未武断限定为“大卫所作”。“雅威”是对 יהוה 的合宜音译；脚注说明原文神名及传统汉语译法，足够清楚。“侧耳听”“声音”与 הַאֲזִינָה、קוֹלִי 相称，未擅自将“声音”解释为哀号。
