    rationale: “来到我这里”是更常见、流畅的现代汉语搭配；加入“快快”也较好再现 חוּשָׁה 的急切语气，而不增添“帮助”等原文未明说的内容。
  - severity: low
    issue: 末两行的句法顺序可更贴近原文。
    rationale: 希伯来文先说“侧耳听我的声音”，后接“当我呼求你时”。调整为一个完整句，可保留祈求主句在前、时间从句在后的结构，同时避免分行造成轻微断裂。
