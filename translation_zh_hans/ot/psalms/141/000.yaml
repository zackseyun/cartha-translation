  yaml_path: translation/ot/psalms/141/000.yaml
  text: A psalm of David. Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: zh_hans
  text: '大卫的诗。


    耶和华[a]啊，我向你呼求；求你快快临到我！我向你呼求的时候，求你侧耳听我的声音！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为 YHWH（四字神名），传统译作“耶和华”；也可音译作“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: 大卫的诗
  rationale: 标题可指大卫所作、所属或相关的诗；中文传统而简洁的表达“大卫的诗”保留了介词 לְ 的一定宽度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名译出四字神名，并用脚注说明原文及另一常见译法。
- source_word: חוּשָׁה לִּי
  choice: 求你快来帮助我
  rationale: 直译近于“求你为我赶快”；按语境自然表达为迅速前来相助，但不增添具体的拯救方式。
- source_word: הַאֲזִינָה קוֹלִי
  choice: 求你侧耳听我的声音
  rationale: 保留“侧耳”这一表示留心倾听的具体意象，也忠实呈现“我的声音”。
theological_decisions:
- issue: 四字神名的译法
  choice: 正文采用“耶和华”，并加脚注
  alternative: 雅威；或以“主”代称
  rationale: 原文使用专名 YHWH，而非普通称谓“主”；正文采用中文圣经语境中最通行的专名形式，同时脚注交代原文与另一音译，避免把译名等同于确定的古代读音。
- issue: 标题中 לְדָוִד 的关系
  choice: 译为“大卫的诗”
  alternative: “大卫所作的诗”或“关于大卫的诗”
  rationale: 希伯来介词可表达作者、归属或关联；不明确加入“所作”，以保留原文可能的关系范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。标题独立成行；祷告句保留直接呼求和两个祈使语气。“侧耳听”延续希伯来诗歌意象，又为普通读者所能理解。
