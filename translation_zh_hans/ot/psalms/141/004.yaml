base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/004.yaml
  text: Do not incline my heart to any evil thing[a], to practice wicked deeds with men who work iniquity[c][b]; and let me not eat of their delicacies.
translation:
  language: zh_hans
  text: 不要使我的心偏向任何恶事[a]，也不要让我与作恶的人一同行邪恶的事[b]；也不要让我吃他们的美食[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶事”也可译作“恶言”或“邪恶的事情”；希伯来语 דָּבָר 可指“事”“事情”或“话”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“与行不义的人一起行邪恶的事”。
    reason: lexical_alternative
  - marker: c
    text: 指他们的佳肴或悦人之物；这句话也可能暗示参与他们罪恶的享乐。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּט
  choice: 使……偏向
  rationale: נטה在此以“我的心”为宾语，表示使内心倾向或转向；保留原文的使役表达及其意象。
- source_word: לִבִּי
  choice: 我的心
  rationale: 希伯来语“心”涵盖意志、欲望和思想；直译可保留其完整的人观意象。
- source_word: לְדָבָר רָע
  choice: 任何恶事
  rationale: דבר可指事、事情或话；上下文涉及恶行和参与恶人的享乐，因此用宽泛的“恶事”，并以“任何”自然表达不定意义。
- source_word: לְהִתְעוֹלֵל עֲלִילוֹת בְּרֶשַׁע
  choice: 行邪恶的事
  rationale: 该短语表示投身于邪恶行为；此译简洁自然，同时保留主动参与的意思。
- source_word: אֶת אִישִׁים פֹּעֲלֵי אָוֶן
  choice: 跟作恶的人一起
  rationale: 原文直译为“与行不义之人”；“作恶的人”准确表达其以恶行为特征，并清楚呈现共同参与。
- source_word: וּבַל אֶלְחַם
  choice: 也不要让我吃
  rationale: 保留否定祈愿和具体的“吃”这一意象，不预先把它完全解释为抽象的参与。
- source_word: בְּמַנְעַמֵּיהֶם
  choice: 他们的美食
  rationale: מנעמים指令人愉悦之物，在“吃”的语境中特指佳肴、美味；“美食”是自然现代的表达，也容许其暗含共享罪中享乐。
theological_decisions:
- issue: “不要使我的心偏向”中的道德能动性与上帝作用
  choice: 保留直接向上帝祈求“不要使我的心偏向”的使役措辞。
  alternative: 不要任凭我的心偏向；不要容许我的心转向。
  rationale: 希伯来文直接就诗人内心的趋向向上帝祈求。译文不以“任凭”或“容许”弱化这种措辞，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使我的心偏向”保留希伯来文的使役意象和祷告语气；“行邪恶的事”“作恶的人”“美食”则避免生硬仿古。脚注分别保留 דָּבָר、共同作恶的结构及 מַנְעַמִּים 的语义空间。
