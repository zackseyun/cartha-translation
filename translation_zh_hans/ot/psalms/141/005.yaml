id: PSA.141.5
reference: Psalms 141:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יֶֽהֶלְמֵֽ/נִי צַדִּ֨יק חֶ֡סֶד וְֽ/יוֹכִיחֵ֗/נִי שֶׁ֣מֶן רֹ֭אשׁ אַל יָנִ֣י רֹאשִׁ֑/י כִּי ע֥וֹד וּ֝/תְפִלָּתִ֗/י בְּ/רָעוֹתֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/005.yaml
  text: Let a righteous man strike me—it is a kindness[a]; let him rebuke me—it is oil for the head; let my head not refuse it[d][c][b]. For still my prayer is against their evils.
translation:
  language: zh_hans
  text: 愿义人击打我，这算是恩慈[a]；愿他责备我，这好比头上的膏油；愿我的头不拒绝[b]。因为我的祷告仍然是针对他们的恶行[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩慈”也可译作“慈爱”或“忠诚的爱”；本句也可理解为：“愿义人以忠诚的爱击打我。”
    reason: 保留חֶסֶד在一般善意与忠诚之爱之间的词义幅度，以及它在句中的不同连接方式。
  - marker: b
    text: 本句希伯来文含义较难确定；也可译作“愿我的头不推拒（这膏油）”或“愿我的头不避开它”。
    reason: 原文动词的词形与确切含义存在文本和词汇上的困难；括号中的“这膏油”是依上下文补足的指称。
  - marker: c
    text: 末句含义不确定，也可能是：“我的祷告仍在他们遭难的时候”，或“即使如此，我仍在他们受苦时为他们祷告。”
    reason: 介词ב可以有不同解释，רעות既可能指恶事，也可能指灾祸；代词所指及整句与上文的关系也不明确。
lexical_decisions:
- source_word: יֶהֶלְמֵנִי
  choice: 愿……击打我
  rationale: הלם指有力的击打；这里以具体动作比喻义人的严厉纠正。“愿”表达希伯来语祈愿语气，同时保留原文鲜明的意象。
- source_word: צַדִּיק
  choice: 义人
  rationale: 阳性单数形容词作名词使用，指一位具有代表性的义人；“义人”在现代中文圣经语体中自然简洁。
- source_word: חֶסֶד
  choice: 恩慈
  rationale: 此处描述义人击打、责备诗人的善意性质。“恩慈”既可表达具体善举背后的仁厚，也保留该词可能具有的忠诚之爱意味。
- source_word: וְיוֹכִיחֵנִי
  choice: 愿他责备我
  rationale: יכח的使役形在此指指出过错并加以纠正；“责备”保留其严肃和尖锐程度。
- source_word: שֶׁמֶן רֹאשׁ
  choice: 膏头的油
  rationale: 直译该结构，保留油使人舒畅、受尊荣的比喻，不擅自限定为正式的宗教膏立。
- source_word: אַל יָנִי רֹאשִׁי
  choice: 愿我的头不拒绝它
  rationale: 动词的词形和含义较难确定；此译依上下文理解为不推拒那如油一般的责备，并保留“我的头”这一原文意象。
- source_word: כִּי עוֹד
  choice: 因为……仍然
  rationale: 既承接前文并给出理由，也表达持续之意。
- source_word: וּתְפִלָּתִי
  choice: 我的祷告
  rationale: 直接传达带第一人称单数词尾的名词；连接词按中文句法融入句中。
- source_word: בְּרָעוֹתֵיהֶם
  choice: 抵挡他们的恶行
  rationale: 介词ב在此句中的作用不确定。正文依上下文取敌对或针对之意，并将复数רעות理解为恶事、恶行；其他可能读法列入脚注。
theological_decisions:
- issue: צַדִּיק的性别与代表性
  choice: 义人
  alternative: 一个公义的人
  rationale: 原文为阳性单数、作名词使用。中文“义人”无需额外添加性别词，却没有抹去原文的单数代表性，也符合庄重自然的圣经语体。
- issue: 末句בְּרָעוֹתֵיהֶם的解释
  choice: 我的祷告仍然抵挡他们的恶行
  alternative: 我的祷告仍在他们遭难的时候；即使如此，我仍在他们受苦时为他们祷告
  rationale: 介词ב及רעות所指是“恶行”还是“灾祸”均有歧义。正文所选读法较符合上下文中义人的纠正与恶人的行为之间的对照，但不将该读法视为唯一可能，故在脚注保留其他解释。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“击打”与“膏头的油”保留原诗强烈而具体的并列意象；“愿我的头不拒绝它”虽略带陌生感，却有意保存希伯来文的身体比喻及其难解之处。末句采用较通顺的正文读法，并用脚注明确呈现真实歧义。
