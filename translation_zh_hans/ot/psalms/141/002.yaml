  text: תִּכּ֤וֹן תְּפִלָּתִ֣/י קְטֹ֣רֶת לְ/פָנֶ֑י/ךָ מַֽשְׂאַ֥ת כַּ֝פַּ֗/י מִנְחַת עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/002.yaml
  text: May my prayer be established before you as incense[b][a], the lifting up of my hands as the evening offering.
translation:
  language: zh_hans
  text: 愿我的祷告如香陈设[a]在你面前；愿我举起双手，如晚间的供物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“预备妥当”或“安置稳固”。希伯来文表达愿祷告被稳妥地安置在上帝面前。
    reason: lexical_alternative
  - marker: b
    text: “晚间的供物”指傍晚按例献上的供物；这里的希伯来词也可特指谷物祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכּוֹן
  choice: 陈列
  rationale: 该词为כּוּן的尼法勒未完成式，在这里表达愿望，含有被安置稳妥、预备妥当之意。“陈列”既保留祷告被置于上帝面前的空间意象，又适合与祭祀语境中的“香”搭配；脚注保留“预备妥当、安置稳固”等可能含义。
- source_word: תְּפִלָּתִי
  choice: 我的祷告
  rationale: 直接体现名词及第一人称单数后缀，简明自然。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 指焚烧献在上帝面前的香；“香”是现代中文圣经语境中自然、庄重的表达，也保留明确的敬拜意象。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 准确保留原文表示处于上帝面前、在其临在之中的空间关系。
- source_word: מַשְׂאַת כַּפַּי
  choice: 我举起双手
  rationale: 原文直指“双手的举起”。中文采用动词结构，清楚呈现祷告时举手的身体动作，同时不改变其意象。
- source_word: מִנְחַת עָרֶב
  choice: 晚祭
  rationale: 指傍晚献上的供物；“晚祭”简洁地保留固定敬拜时段及献祭背景，而מִנְחָה可特指谷物祭的词义信息置于脚注。
theological_decisions:
- issue: 祷告与圣所献祭意象的关系
  choice: 保留“如香”“如同晚祭”的比较，把祷告和举手与敬拜中的供物并置。
  alternative: 将经文解释为祷告取代献祭，或淡化为不带礼仪背景的一般诗意比喻。
  rationale: 原文以“香”和“晚祭”明确唤起敬拜与献祭背景，但本节本身没有明说祷告取代献祭；比较式译法保留其神学张力而不作额外推论。
- issue: תִּכּוֹן是否表示蒙悦纳
  choice: 译为“陈列”，保留被安置、被预备在上帝面前的意义。
  alternative: 译为“蒙你悦纳”。
  rationale: “蒙悦纳”在语境中可能是隐含期待，却不是该动词直接表达的全部词义；避免把隐含意义提升为明说的判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如香，陈列在你面前”保留原文的祭祀意象和空间感；分号呈现两个平行诗句。第二句补出“愿”，使希伯来诗歌中省略的平行愿望在中文里清楚自然。“举起双手”比直译“双手的举起”更符合现代汉语。
