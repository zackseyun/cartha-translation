  text: Keep me from the hands of the trap they have set for me[b][a], and from the snares of the workers of wickedness.
translation:
  language: zh_hans
  text: 求你护卫我，使我脱离他们为我设下的陷阱[a]，也脱离作恶之人的圈套。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作：“脱离那为我设下的陷阱之手。”这里“手”表示陷阱的掌握或控制；正文按汉语习惯译为“使我脱离……陷阱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: 求你护卫我
  rationale: שׁמר在此为祈求式命令，意为看守、保护。“求你护卫我”既保留祷告语气，也符合现代汉语的庄重表达。
- source_word: מִידֵי פַח
  choice: 使我脱离……罗网
  rationale: 字面为“脱离罗网的手（掌握）”。“手”在这里表达控制或势力；正文采用自然汉语表达其功能，并以脚注保留具体意象和句法特点。
- source_word: יָקְשׁוּ לִי
  choice: 他们为我设下的
  rationale: יקשׁ在此表示设下罗网或陷阱；复数动词保留为“他们”，而不把其所指强行限定为后半句的“作恶之人”。
- source_word: וּמֹקְשׁוֹת
  choice: 脱离……圈套
  rationale: מֹקְשׁוֹת为复数，指诱捕人的圈套或陷阱。第二个“脱离”承接前置介词并使汉语平行结构清楚；用“圈套”与前面的“罗网”形成源文中的近义变化。
- source_word: פֹּעֲלֵי אָוֶן
  choice: 作恶之人
  rationale: 字面为“行作恶事的人”。אָוֶן可指邪恶、罪孽、祸害；本处描述设圈套者，以“作恶之人”准确、自然地传达其道德含义。
