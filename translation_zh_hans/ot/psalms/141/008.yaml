source:
  edition: WLC
  text: כִּ֤י אֵלֶ֨י/ךָ יְהֹוִ֣ה אֲדֹנָ֣/י עֵינָ֑/י בְּ/כָ֥ה חָ֝סִ֗יתִי אַל תְּעַ֥ר נַפְשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/008.yaml
  text: For my eyes are toward you[a], O Yahweh, my Lord; in you I take refuge[b]; do not pour out my life.
translation:
  language: zh_hans
  text: 因为我的眼目仰望你，耶和华，我的主啊；我投靠你。求你不要倒空我的性命。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”或译“灵魂”“我自己”。希伯来语 נֶפֶשׁ 可按上下文指生命、本人或灵魂。
    reason: lexical_alternative
  - marker: b
    text: “不要倒空我的性命”也可理解为“不要使我赤露无护”或“不要任我毫无防卫”；原文动词可有倒空、倾倒，也可有剥露的语义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: （不单独译出）
  rationale: 此处承接上文，为祈求提供理由。汉语独立成节时若直译“因为”会显得悬空，因此以语句衔接自然体现其承接功能。
- source_word: אֵלֶיךָ…עֵינַי
  choice: 我的眼目仰望你
  rationale: 保留“眼目”的希伯来意象，并以“仰望”自然表达目光转向上帝以及信赖、等候之意。
- source_word: יְהֹוָה אֲדֹנָי
  choice: 主耶和华啊
  rationale: 同时呈现神名与主权称谓；按现代中文圣经语域，以“主耶和华”避免把两个词合并为一个称号。
- source_word: בְּךָ חָסִיתִי
  choice: 我投靠你
  rationale: חסה 表示寻求并处于庇护之下；“投靠”简洁自然，也保留完成式所表达的既定信靠立场。
- source_word: אַל תְּעַר
  choice: 求你不要倾倒
  rationale: ערה 的使役形可指倒空、倾倒，也可能引申为使暴露无护；正文采用较直接的“倾倒”，不在正文中消解其隐喻。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: 此处 נֶפֶשׁ 指受威胁的生命或本人；“性命”符合求保全的语境，也避免将其限缩为与身体相分的“灵魂”概念。
theological_decisions:
- issue: 神圣称呼 יְהֹוָה אֲדֹנָי 的表达
  choice: 主耶和华啊
  alternative: 耶和华，我的主啊
  rationale: 原文并列神名与主权称谓。正文保留两者；中文“主耶和华”较自然，但 אֲדֹנָי 的第一人称领属意味亦可支持备选译法。
- issue: נֶפֶשׁ 在拯救祈求中的含义
  choice: 我的性命
  alternative: 我的灵魂／我自己
  rationale: 上下文关乎免遭死亡或毁灭，故按整体生命来译；不把后期身心二分观念强加于希伯来词。
- issue: אַל תְּעַר נַפְשִׁי 的隐喻
  choice: 不要倾倒我的性命
  alternative: 不要使我赤露无护／不要任我毫无防卫
  rationale: 动词可表达倒空、倾倒，也可能引申为剥露、使无防护。正文保留较具体而含混的原始图像，脚注交代另一种语境理解。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“眼目仰望”“投靠”保留诗篇意象；“求你”自然呈现希伯来语否定祈愿。两个脚注标记均置于相关末句之后。
