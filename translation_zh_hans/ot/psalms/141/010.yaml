  text: Let the wicked fall into their own nets together[c][b][a], while I pass by.
translation:
  language: zh_hans
  text: 愿恶人一同落入自己的网罗[a]，而我则经过[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“他的网罗”（“网罗”为复数），也可按恶人各自所设的网罗理解，因而译作“自己的网罗”。
    reason: alternative_reading
  - marker: b
    text: “而我则经过”更直译为“直到我经过”或“直到我越过去”。原文中“直到”与前后语句的关系较为含蓄。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְּלוּ
  choice: 愿……落入
  rationale: נפל 的 Qal 未完成式第三人称阳性复数在本诗祈求语境中可表达愿望；“愿……落入”自然传达祈愿语气。
- source_word: בְמַכְמֹרָיו
  choice: 落入自己的网罗
  rationale: מַכְמֹר 指捕捉用的网；该形式为带第三人称阳性单数后缀的复数“他的网罗”。因主语“恶人”为复数，这个单数所有者可按分配意义理解为各人，故正文译作“自己的网罗”，同时以脚注保留形式上“他的网罗”的可能读法。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数名词化形容词，指行为邪恶的人；“恶人”简洁、庄重，不额外限定性别。
- source_word: יַחַד
  choice: 一同
  rationale: 该副词可表示共同或同时发生；“一同”直接保留这种集合性，并自然修饰恶人的陷落。
- source_word: אָנֹכִי
  choice: 我则
  rationale: 独立人称代词带有强调和对比作用；“我则”显出诗人与恶人的鲜明对照。
- source_word: עַד
  choice: 而
  rationale: עַד 通常意为“直到”，但此处诗行高度凝练，结合对比关系可理解为恶人落网之际诗人得以经过。正文用“而”形成自然汉语对照，脚注保留更直译的“直到”。
- source_word: אֶעֱבוֹר
  choice: 从旁经过
  rationale: עבר 意为经过、越过或走过去；“从旁经过”表达诗人未落入网罗而继续前行，但不添加原文未明说的“安全地”。
