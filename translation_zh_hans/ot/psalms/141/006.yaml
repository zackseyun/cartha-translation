  text: נִשְׁמְט֣וּ בִֽ/ידֵי סֶ֭לַע שֹׁפְטֵי/הֶ֑ם וְ/שָׁמְע֥וּ אֲ֝מָרַ֗/י כִּ֣י נָעֵֽמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/006.yaml
  text: Their judges have been thrown down by the sides of the rock[a], and they have heard my words[b], for they are pleasant.
translation:
  language: zh_hans
  text: 他们的审判官被抛落在岩壁旁[a]；他们听见了我的话，因为这话令人愉悦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“沿峭壁被抛下。”希伯来语这一短语含义艰深；传统上也有人更按字面理解为“落入岩石的手中”。
    reason: alternative_reading
  - marker: b
    text: 或译：“甘美”或“可喜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְטוּ
  choice: 被抛下
  rationale: 该词的Niphal形式可表达被丢下、抛下或使之滑落；此处采用被动表达其突然且强烈的坠落，同时不过度解释具体方式。
- source_word: בִידֵי סֶלַע
  choice: 岩壁
  rationale: 这一短语语法艰深。结合无生命名词“岩石”，正文采用较自然的空间性理解，指岩石或峭壁的侧面；字面读法保留在脚注。
- source_word: שֹׁפְטֵיהֶם
  choice: 他们的审判者
  rationale: 该分词通常指施行审判的人，也可泛指统治者；“审判者”最直接地保留词义。
- source_word: וְשָׁמְעוּ
  choice: 他们就听
  rationale: 诗歌中的完成式可依语境具有过去、现在或结果性的意味；“就听”保持叙述关联，又避免把时间限定得过死。
- source_word: אֲמָרַי
  choice: 我的话
  rationale: 直接、自然地传达带第一人称后缀的复数名词。
- source_word: נָעֵמוּ
  choice: 悦耳
  rationale: 该动词表示令人愉悦、可喜或甘美；用于“话”时，“悦耳”在现代汉语中自然，也保留正面评价。
theological_decisions:
- issue: 艰深短语 בידי סלע 的解释
  choice: 按空间意义译作“岩壁”
  alternative: 较字面可理解为“落入岩石的手中”；也可译为“峭壁旁”或“沿峭壁而下”
  rationale: 本句的句法和意象确有歧义。正文采用较可能且自然的地形意象，不把“岩石”强行解释为司法或神学隐喻；其他读法在脚注中保留。
- issue: וְשָׁמְעוּ 的时态与关系
  choice: 译作“他们就听”
  alternative: “他们听见了”或“他们将听”
  rationale: 希伯来诗歌完成式的时间指向可有弹性；正文保留其与前句的关联，不武断限定为单一时态。
translation_notes:
  register: 采用现代、庄重而简明的诗体汉语。“审判者”保留原词的司法含义；分号呈现两小句之间紧密但未完全明说的逻辑关系。所有歧义均以正文加脚注呈现，未作教派化解释。
