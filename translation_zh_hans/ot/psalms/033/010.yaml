source:
  edition: WLC
  text: יְֽהוָ֗ה הֵפִ֥יר עֲצַת גּוֹיִ֑ם הֵ֝נִ֗יא מַחְשְׁב֥וֹת עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/010.yaml
  text: Yahweh frustrates the counsel of the nations[a]; he thwarts the plans of the peoples.
translation:
  language: zh_hans
  text: 耶和华[a]使列国的谋略落空，使万民的筹算不能实现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为神名YHWH，亦常音译作“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号代替；脚注说明原文形式。
- source_word: הֵפִיר
  choice: 使……落空
  rationale: 该词的使役形在此表示使谋略失效；“使……落空”既自然，也保留主动挫败的语义。
- source_word: עֲצַת
  choice: 谋略
  rationale: עֵצָה可指商议、谋划或计策；在列国这一集体主体下，“谋略”贴合语境，并与下句“筹算”形成诗歌平行。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 此处泛指众国；“列国”是庄重而通行的诗篇用语，也区别于下句的“万民”。
- source_word: הֵנִיא
  choice: 使……不能实现
  rationale: 该使役动词表达阻止、拦下，使所图之事不能成就；此译清楚传达结果而不过度限定具体方式。
- source_word: מַחְשְׁבוֹת
  choice: 筹算
  rationale: 本词虽可泛指思想，在与“谋略”平行的语境中指计划、谋算；“筹算”保留其谋划意味和诗体庄重感。
- source_word: עַמִּים
  choice: 万民
  rationale: 复数名词指众多民族或人民群体；“万民”自然呈现集合性复数，并保留与“列国”的近义变化。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名，应以专名而非称号呈现。“耶和华”在现代中文圣经语境中最为通行；脚注保留原文YHWH并提示另一常见音译“雅威”。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。两行以“列国／万民”和“谋略／筹算”保持希伯来诗歌的同义平行；两个动词分别译为“使……落空”和“使……不能实现”，既避免机械重复，也保留原文两个近义使役动词的推进。
