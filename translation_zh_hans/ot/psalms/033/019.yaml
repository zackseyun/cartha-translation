  text: לְ/הַצִּ֣יל מִ/מָּ֣וֶת נַפְשָׁ֑/ם וּ֝/לְ/חַיּוֹתָ֗/ם בָּ/רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/019.yaml
  text: to deliver their soul from death and to keep them alive in famine[a].
translation:
  language: zh_hans
  text: 要救他们的性命脱离死亡，在饥荒中使他们存活。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”或译“生命”；希伯来语“尼斐示”（נֶפֶשׁ）可指性命、生命、自我或魂。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּיל
  choice: 救……脱离
  rationale: 该词是 נצל 的使役式不定词，表示使人逃脱、搭救；“救……脱离死亡”准确保留其分离和解救之意，也符合现代汉语诗体。
- source_word: מִמָּוֶת
  choice: 脱离死亡
  rationale: 介词 מן 表示从某种处境中脱离；“死亡”比“死去”更贴近希伯来文紧凑的名词表达。
- source_word: נַפְשָׁם
  choice: 他们的性命
  rationale: נֶפֶשׁ 可指生命、性命、自我或魂；本句着重从死亡中蒙保全，“性命”在现代汉语中自然，又保留其指整个生命主体的宽度。希伯来文使用带第三人称复数词尾的集合性单数形式。
- source_word: וּלְחַיּוֹתָם
  choice: 使他们存活
  rationale: 该不定词在此表示使人继续活着、保全生命；“使他们存活”简洁地表达持续保守之意，并与前半句形成诗意平行。
- source_word: בָּרָעָב
  choice: 在饥荒中
  rationale: רָעָב 在这里更可能指造成生存危机的饥荒，而非个人主观的饥饿感；介词 בְּ 表示身处这种境况之中。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“救……脱离死亡”与“在饥荒中使他们存活”保留原文两个目的不定词的平行结构；正文用“性命”避免现代汉语中“他们的魂”可能引出的过度二分式理解，并以脚注保留原词较宽的语义范围。
