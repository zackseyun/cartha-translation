  text: שִֽׁירוּ ל֭/וֹ שִׁ֣יר חָדָ֑שׁ הֵיטִ֥יבוּ נַ֝גֵּ֗ן בִּ/תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/003.yaml
  text: Sing to him a new song[a]; play skillfully with a joyful shout.
translation:
  language: zh_hans
  text: 要向他唱一首新歌；要娴熟地弹奏，伴着欢呼声[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢呼声”所译的希伯来语也可指响亮的喝彩、呐喊，某些语境中还可指号角般的响声。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: 唱
  rationale: 这是שׁיר的复数祈使式，通常表示歌唱；“唱”直接、自然，并保留诗歌中的赞美语境。
- source_word: לוֹ
  choice: 向他
  rationale: 介词ל加第三人称阳性单数后缀，在这里自然表示歌唱所朝向的对象；根据上下文，“他”指耶和华。
- source_word: שִׁיר חָדָשׁ
  choice: 新歌
  rationale: 直译这一常见的诗篇表达，既保留词义，也保留其礼仪和诗歌色彩；汉语中无需添加不定冠词。
- source_word: הֵיטִיבוּ נַגֵּן
  choice: 巧妙地弹奏
  rationale: הֵיטִיבוּ在这里修饰נַגֵּן，表达把演奏做好、演奏纯熟；נגן常指弹奏弦乐器。“巧妙地弹奏”兼顾技艺精良与音乐语境。
- source_word: בִּתְרוּעָה
  choice: 伴以欢呼声
  rationale: בְּ表示伴随情形；תְּרוּעָה在赞美语境中可指响亮而喜悦的欢呼。“伴以欢呼声”保留演奏与欢呼相伴的句法关系，同时不把它限定为某种乐器声。
theological_decisions:
- issue: לוֹ中第三人称阳性单数后缀的所指
  choice: 译作“他”，按上下文指耶和华，是赞美所朝向的对象。
  alternative: 译作“为他”，强调为上帝献唱。
  rationale: 前后文都在呼召人赞美耶和华；“向他”更直接保留ל所表达的朝向，而不额外强调献呈含义。
- issue: בִּתְרוּעָה与弹奏动作的关系
  choice: 译作“伴以欢呼声”，使欢呼成为巧妙演奏的伴随情形。
  alternative: 译作“高声欢呼”，将其处理为并列的赞美行动。
  rationale: 介词בְּ更直接支持伴随关系；如此既保持希伯来文结构，也不排除演奏时众人发出欢呼。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“巧妙地弹奏”传达熟练优美的演奏要求；“伴以欢呼声”保留原文的伴随结构及其热烈、可听见的赞美氛围。
