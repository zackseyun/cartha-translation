base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/007.yaml
  text: He gathers the waters of the sea like a heap[b][a]; he puts the depths in storehouses.
translation:
  language: zh_hans
  text: 他把海水聚集成一堆[a]；他把深渊之水安放在库房中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如堆垒”。有人参照别处水竖立的意象，理解为“如墙”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“众深渊”。希伯来语复数可指浩瀚海洋的深处，也可指太初的深水。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּנֵס
  choice: 聚集
  rationale: 该词是כנס的Qal主动分词，描写持续或特征性的行动；“聚集”自然、准确，并保留诗歌的动态画面。
- source_word: כַּנֵּד
  choice: 如垒堆
  rationale: נֵד指堆积起来的一堆或隆起之物，用于水时呈现水被堆聚的形象。“垒堆”比单说“一堆”更具诗意，也不直接把意象限定为“墙”。
- source_word: מֵי הַיָּם
  choice: 海水
  rationale: 原文直译为“海的水”；“海水”是现代汉语中简洁自然的对应。
- source_word: נֹתֵן
  choice: 放在
  rationale: נתן语义宽泛，此处与地点短语连用，译为“放在”清楚自然，并保留具体的安置动作。
- source_word: בְּאֹצָרוֹת
  choice: 在仓库中
  rationale: אֹצָר可指仓库、宝库或储藏处；在宇宙诗歌意象中，“仓库”最直接地表达储存之所。
- source_word: תְּהוֹמוֹת
  choice: 深渊之水
  rationale: תְּהוֹם的复数可指海洋深处或太初的深水。“深渊之水”既保留深邃、浩瀚的意象，也避免现代汉语把“深渊”只理解为空洞或峡谷。
theological_decisions:
- issue: 上帝对海水和深渊之水的主权这一宇宙性意象
  choice: 保留“垒堆”和“仓库”的具体诗歌图景
  alternative: 意译为“他掌管海洋”或“他储存众水”
  rationale: 原文借具体而富张力的宇宙图景表达上帝对众水的秩序与主权；抽象化会削弱诗句本身的意象。
- issue: נֵד所描绘的水之形态
  choice: 正文译作“垒堆”，脚注保留“墙”的可能
  alternative: 正文直接译作“墙”
  rationale: 该词通常指堆积之物，但在其他水体意象中可被理解为竖立的墙；正文采用较直接的词义，同时不排除另一理解。
- issue: תְּהוֹמוֹת的宇宙论内涵
  choice: 译作“深渊之水”，不限定为普通海底或特定太初之海
  alternative: “海洋深处”或“太初的深水”
  rationale: 希伯来语复数既能指浩瀚海洋的深处，也可能唤起原初深水的意象；译文应保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两个分句保持平行结构；“聚集—放在”、“海水—深渊之水”、“垒堆—仓库”对应原文的动作与宇宙意象。所有脚注标记均置于正文相关词语之后。
