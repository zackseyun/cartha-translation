id: PSA.33.16
reference: Psalms 33:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֵֽין הַ֭/מֶּלֶךְ נוֹשָׁ֣ע בְּ/רָב חָ֑יִל גִּ֝בּ֗וֹר לֹֽא יִנָּצֵ֥ל בְּ/רָב כֹּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/016.yaml
  text: The king is not saved by a great army[b][a]; a warrior is not delivered by great strength.
translation:
  language: zh_hans
  text: 君王不能靠庞大的军队[a]得救；勇士[b]也不能凭强大的力量获救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众多的兵力”或“强盛的军力”；希伯来语“חַיִל”也可泛指力量或军事资源。
    reason: lexical_alternative
  - marker: b
    text: “勇士”也可译作“强者”或“勇猛的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: 不能
  rationale: 该词在这里否定君王藉某种手段得救的可能或事实；结合工具性的介词短语，译为“不能靠……得救”符合现代汉语，也保留箴言式的概括。
- source_word: הַמֶּלֶךְ
  choice: 君王
  rationale: 原文有定冠词，以单数定指形式陈述普遍真理；汉语用“君王”即可自然表达，无须另加指示词。
- source_word: נוֹשָׁע
  choice: 得救
  rationale: ישׁע 的尼法勒分词表示被拯救、蒙解救；“得救”保留其常见圣经用语，同时上下文明确是军事危难中的拯救。
- source_word: בְּרָב חָיִל
  choice: 靠庞大的军队
  rationale: בְּ 表示凭借的手段；חַיִל 可指力量、资源或军队，在君王与勇士的军事平行语境中，“军队”最具体自然，而脚注保留较宽泛的词义。
- source_word: גִּבּוֹר
  choice: 勇士
  rationale: 指强健、英勇、善战之人；“勇士”简洁庄重，适合诗歌中的军事语境。
- source_word: יִנָּצֵל
  choice: 获救
  rationale: נצל 的尼法勒式表示被解救、被救出；“获救”与上句“得救”形成近义平行，又避免机械重复。
- source_word: בְּרָב כֹּחַ
  choice: 凭强大的力量
  rationale: כֹּחַ 指能力、力量或体力；在勇士的语境中，“强大的力量”自然呈现其武力含义，בְּ 仍译出手段关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。两行以“靠／凭”和“得救／获救”构成平行；“也”补出汉语中的平行衔接，并未增加新的逻辑内容。脚注标记均置于相应词语之后。
