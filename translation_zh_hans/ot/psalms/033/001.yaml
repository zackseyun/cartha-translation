  text: רַנְּנ֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה לַ֝/יְשָׁרִ֗ים נָאוָ֥ה תְהִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/001.yaml
  text: Shout for joy in Yahweh[a], you righteous[b]; praise is fitting for the upright.
translation:
  language: zh_hans
  text: 义人哪，你们要在雅威里欢呼[a]；赞美与正直人相称[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人哪，你们要因雅威欢呼。”
    reason: 原文介词可表示在雅威里面欢欣，也可按上下文理解为以雅威为欢欣的缘由或对象。
  - marker: b
    text: 或译：“赞美对正直人来说是美好的”，或“赞美是正直人所合宜的”。
    reason: 原文形容词兼有合宜、美好、相称等意义。
lexical_decisions:
- source_word: רַנְּנוּ
  choice: 欢呼
  rationale: 该复数命令式表示以声音洋溢喜乐；“欢呼”既保留热烈、可听见的表达，也不把形式限定为歌唱。
- source_word: צַדִּיקִים
  choice: 义人哪
  rationale: 此词在命令式之后作呼语；“义人哪”自然地明确了称呼语气，并保留其名词化形容词的用法。
- source_word: בַּיהוָה
  choice: 因雅威
  rationale: 介词 ב 在这里可表示喜乐所系于的对象或缘由；“因雅威欢呼”在现代汉语中自然，也保留了以雅威为喜乐中心的含义。脚注同时提示可理解为“向雅威”欢唱。
- source_word: יְהוָה
  choice: 雅威
  rationale: 用“雅威”音译四字神名，保留经文中的专名，而不以称号替代。
- source_word: לַיְשָׁרִים
  choice: 正直人所
  rationale: 介词 ל 在本句表示关联或适宜性；“正直人所合宜的”准确表达赞美与正直人相称。
- source_word: נָאוָה
  choice: 合宜的
  rationale: 该词兼有合适、相称、优美之意；正文采用“合宜的”以清楚表达此处的适切性，脚注保留“美好”和“相称”的语义可能。
- source_word: תְהִלָּה
  choice: 赞美
  rationale: 该名词可指赞美本身或赞美之歌；不加限定的“赞美”适合本句概括性的陈述，并避免无根据地限定表达形式。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用现代学界常用的“雅威”音译，以保留其专名性质；“耶和华”是传统音译，“主”则是以称号代替神名。
- issue: בַּיהוָה 所表达的关系
  choice: 因雅威欢呼
  alternative: 向雅威欢唱
  rationale: ב 可表达欢喜所系于的对象或范围，中文“因雅威欢呼”兼顾自然与原文结构；脚注保留将其理解为朝向雅威发出欢唱的可能，不把诗句的关系过度限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“义人哪”保留诗歌中的直接呼告；后半句用“所合宜的”形成凝练、易懂的箴言式表达。
