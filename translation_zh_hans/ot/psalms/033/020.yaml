base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/020.yaml
  text: Our soul waits for Yahweh[a]; he is our help and our shield.
translation:
  language: zh_hans
  text: '我们的心[a]等候雅威；

    他是我们的帮助和盾牌。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“我们的魂／生命／自身”。这里的单数带“我们”的后缀，指整个群体；正文译作“我们的心”，用以保留其诗歌性的内在、全人等候之意，并非只指可与身体分离的非物质部分。
    reason: 说明נַפְשֵׁנוּ的语义范围及其集合性用法，并交代正文“我们的心”的译法。
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: 我们的心
  rationale: נֶפֶשׁ在此以单数并带第一人称复数后缀，代表整个群体的内在生命与全人。“我们的心”既保留诗歌中的整体性意象，也比直译“我们的魂”更符合现代汉语。
- source_word: חִכְּתָה
  choice: 等候
  rationale: חכה表示带着期待而等待。虽然原文为完成式，但在诗歌语境中可陈述群体当前且持续的信靠姿态；“等候”自然地保留期待意味，不必机械译成“已经等候”。
- source_word: לַיהוָה
  choice: 等候雅威
  rationale: 介词ל标明等候所指向的对象；汉语“等候雅威”自然表达这一关系。יהוה依指定原则音译为“雅威”，保留上帝的盟约之名。
- source_word: עֶזְרֵנוּ
  choice: 我们的帮助
  rationale: עֵזֶר是“帮助、援助”的名词。译作“我们的帮助”保留原文的名词表达，而不改释为“帮助者”。
- source_word: וּמָגִנֵּנוּ
  choice: 是我们的盾牌
  rationale: מָגֵן本义为“盾牌”；这一保护性的具体比喻在现代汉语中清楚可懂，宜予保留。重复“是”使两个并列谓语在汉语诗句中清晰而庄重。
- source_word: הוּא
  choice: 他是
  rationale: 独立代词הוּא在无系词句中带有一定强调。汉语补出“是”以构成自然判断句，但不增译原文未明说的“唯有”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה。采用“雅威”作为较贴近通常学术重构的音译，保留其专名性质；“耶和华”是汉语传统形式，但反映较晚形成的混合读法。
- issue: נֶפֶשׁ所指的人观
  choice: 我们的心
  alternative: 我们的魂
  rationale: 此处的נֶפֶשׁ代表群体的全体内在生命，并非专指与身体分离的非物质部分。“心”在现代汉语诗歌中能表达群体全心的等候，同时脚注说明其范围，避免导入灵魂—身体二分的特定解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。分作两行以显明等候与信靠根据之间的关系；保留“帮助”和“盾牌”的原文名词及比喻，不额外加入“唯有”等排他性措辞。
