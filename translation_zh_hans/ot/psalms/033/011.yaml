  to: 雅威的旨意永远稳固；他心中的计划世世代代长存。
  rationale: 修订以更自然的现代汉语表达原文的平行：雅威的עֲצַת（旨意、定意）永远稳固，他内心的מחשבות（计划、意念）持续于世世代代。“稳固”对应“站立／确立”的恒常状态；下句补出“长存”，清楚呈现原文省略而承接的谓语，未增添神学解释。
