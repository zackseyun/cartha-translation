  text: עֲצַ֣ת יְ֭הוָה לְ/עוֹלָ֣ם תַּעֲמֹ֑ד מַחְשְׁב֥וֹת לִ֝בּ֗/וֹ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/011.yaml
  text: The counsel of Yahweh stands forever[a], the plans of his heart from generation to generation.
translation:
  language: zh_hans
  text: 雅威的旨意永远稳固；他心中的计划世世代代长存。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצַת
  choice: 谋略
  rationale: 该词兼有商议所得的计策、计划和旨意之意。“谋略”既保留审慎筹划的意味，也能与下句“筹算”形成平行。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见汉语音译处理，保留经文中的专名，而不以称号替代。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 表达持续不变、没有止境，符合本节强调雅威谋略恒久稳固的语境。
- source_word: תַּעֲמֹד
  choice: 立定
  rationale: 该未完成式在这里陈述恒常事实；“立定”既保留“站立、稳固”的形象，也自然表达不会废去。
- source_word: מַחְשְׁבוֹת
  choice: 筹算
  rationale: 该词可指思想、构想或计划；在与“谋略”平行且涉及神的意愿时，“筹算”能体现有目的的思量，同时不完全抹去思想层面的含义。
- source_word: לִבּוֹ
  choice: 他心中
  rationale: 保留希伯来语以“心”指思想、意志和内在意向的表达，避免仅译为“头脑”而缩窄含义。
- source_word: לְדֹר וָדֹר
  choice: 世世代代
  rationale: 自然传达原文“代代相续”的分配性和延续性。
- source_word: תַּעֲמֹד（下半句省略承接）
  choice: 长存
  rationale: 原诗下半句省略谓语并承接上句；汉语补出“长存”，使句子自然完整，同时保留平行关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在以现代汉语常见的学术音译保留这一专名，不以“主”等称号代替；“耶和华”是传统汉语形式，但其读音源于较晚的混合读法。
- issue: “心”的拟人表达
  choice: 保留“他心中”
  alternative: 译作“他的意念”或“他的心意”
  rationale: 原文将“筹算”归于雅威的“心”，既涉及思想也涉及意志。保留这一表达可避免把经文仅限定为理性计划或情感愿望。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两分句保持希伯来诗歌的平行结构；下半句补出原文省略而由上句承接的谓语“长存”，以免现代汉语读来残缺。
