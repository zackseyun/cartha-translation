  text: אֹ֭הֵב צְדָקָ֣ה וּ/מִשְׁפָּ֑ט חֶ֥סֶד יְ֝הוָ֗ה מָלְאָ֥ה הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/005.yaml
  text: He loves righteousness and justice[a]; the earth is full of the steadfast love of Yahweh.
translation:
  language: zh_hans
  text: 他喜爱公义和公平；大地充满了雅威的慈爱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“忠贞的爱”，强调雅威持久、信实的爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: 他喜爱
  rationale: 阳性单数主动分词在这里描述雅威一贯的品性；用现代汉语有限动词“喜爱”自然地表达持续、恒常的含义。
- source_word: צְדָקָה
  choice: 公义
  rationale: 与מִשְׁפָּט并列时，主要指正直、合乎正道；“公义”既保留圣经语体，也避免与“公平”语义完全重复。
- source_word: מִשְׁפָּט
  choice: 公平
  rationale: 此处指公正的判断与秩序；“公平”与“公义”搭配自然，并保留两词之间相近而不相同的意义。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 该词兼含慈爱、信实和持久忠诚；“慈爱”简洁自然，脚注补明其忠贞不变的内涵。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名，以“雅威”音译，而不以称号替代。
- source_word: מָלְאָה
  choice: 充满了
  rationale: 完成式在本句表达现今成立的结果状态；“充满了”是自然的现代汉语表达。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 诗篇语境具有普世范围；“大地”比局部性的“土地”更合适，也符合庄重的诗歌语体。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的拟定读音，并保留这是专名而非称号。
- issue: חֶסֶד的内涵
  choice: 正文译“慈爱”，脚注说明“忠贞的爱”
  alternative: 信实之爱
  rationale: 原词同时涉及爱、恩慈、信实与关系中的忠诚；正文采用自然简洁的“慈爱”，脚注保留其持久忠贞的神学张力，而不把词义缩限为单一概念。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“公义和公平”保留希伯来文并列词的区别；分号对应原文两小句的平衡结构。
