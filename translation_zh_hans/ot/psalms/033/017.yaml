base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/017.yaml
  text: A horse is a false hope for deliverance[b][a], and by its great strength it cannot rescue.
translation:
  language: zh_hans
  text: 靠战马获救[b]，是虚妄的指望[a]；它纵有强大的力量，也不能救人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文十分凝练，直译近似“马对于拯救是虚假的”，意思是：把战马当作获救的手段并不可靠，终会使人失望。
    reason: lexical_alternative
  - marker: b
    text: “获救”也可译作“得救”或“得胜”，须按上下文理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: 虚妄的指望
  rationale: 该词本义为虚假、欺骗；这里不是说马在陈述谎言，而是说把马当作获救手段终必落空。“虚妄的指望”既自然，也保留其不可靠、会使人失望的含义。
- source_word: הַסּוּס
  choice: 战马
  rationale: 希伯来文用带定冠词的单数名词泛指一类事物。上下文涉及军事力量，因此译作“战马”比普通的“马”更明确，也符合汉语格言式表达。
- source_word: לִתְשׁוּעָה
  choice: 获救
  rationale: 该词可指拯救、解救或胜利。此处处于军事语境，“获救”范围适中，并通过脚注保留“得救”与“得胜”的可能。
- source_word: וּבְרֹב חֵילוֹ
  choice: 它纵有强大的力量
  rationale: חַיִל在这里最自然地指战马的力量，而非军队或财富。将介词结构译为“纵有”，清楚表达即使力量强大也不能施救的让步关系。
- source_word: לֹא יְמַלֵּט
  choice: 也不能救人
  rationale: מלט的Piel词干通常表示使人脱险、搭救。这里的主语承接战马；“不能救人”自然表达其无力施救，而不仅是一次未来事件。
