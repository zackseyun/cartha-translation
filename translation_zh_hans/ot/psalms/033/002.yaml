  text: הוֹד֣וּ לַ/יהוָ֣ה בְּ/כִנּ֑וֹר בְּ/נֵ֥בֶל עָ֝שׂ֗וֹר זַמְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/002.yaml
  text: Give thanks to Yahweh with the lyre[a]; make music to him with a ten-stringed harp.
translation:
  language: zh_hans
  text: 你们要用琴称谢雅威；要用十弦瑟[a]向他奏乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瑟”所译的希伯来词是נֵבֶל，确切指哪一种古代乐器并不确定，也可译作“竖琴”“琉特琴”或其他弦乐器。
    reason: 说明古代乐器名称在现代语言中没有确定的一一对应词。
lexical_decisions:
- source_word: הוֹדוּ
  choice: 你们要……称谢
  rationale: 该词是ידה的使役式复数祈使，在敬拜语境中通常表示“称谢、感谢”或“赞美”；“称谢”既保留礼仪色彩，也没有泛化为较宽泛的“赞美”。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 原文直接使用神名יהוה；译作“雅威”，以专名形式保留其盟约之名。
- source_word: בְּכִנּוֹר
  choice: 用琴
  rationale: כִּנּוֹר指古代弦乐器，通常认为近似里拉琴。正文用自然且概括的“琴”，避免让现代读者误以为能够精确判定其构造。
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: 用十弦瑟
  rationale: נֵבֶל是另一种古代弦乐器，עָשׂוֹר说明它有十弦。“十弦瑟”保留弦数，并在中文中与前面的“琴”形成区别；确切乐器类型则在脚注交代。
- source_word: זַמְּרוּ לוֹ
  choice: 向他奏乐
  rationale: זמר的加强式在敬拜语境中可指歌唱赞美或演奏音乐；紧接两种乐器时，“奏乐”最切合上下文，同时保留音乐敬拜的指向。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，而非普通称号；正文用“雅威”直接传达专名，不以“上主”替代，也不采用较晚形成的“耶和华”读音。
- issue: זמר在本节指歌唱还是器乐演奏
  choice: 奏乐
  alternative: 歌颂；唱诗赞美
  rationale: 该动词本身可涵盖歌唱或音乐赞美；由于本节明确提到两种弦乐器，译作“奏乐”顺应近处语境，但不据此建立超出经文的敬拜方式主张。
translation_notes:
  register: 采用现代、庄重而易懂的祈使句式。“你们”明示希伯来语复数命令；分号呈现两个平行分句。“琴／瑟”保持诗句简洁和音乐感，同时用脚注承认乐器辨识上的不确定性。
