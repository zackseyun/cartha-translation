  text: מִֽ/מְּכוֹן שִׁבְתּ֥/וֹ הִשְׁגִּ֑יחַ אֶ֖ל כָּל יֹשְׁבֵ֣י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/014.yaml
  text: From the place of his dwelling he looks out on all the inhabitants of the earth[a][b].
translation:
  language: zh_hans
  text: 他从他居住的地方俯察[a]全地[b]的居民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俯察”也可译作“注视”或“察看”；希伯来语动词含有专注观察的意思。
    reason: lexical_alternative
  - marker: b
    text: “全地”也可译作“那地”，若按地域理解；这里因上下文范围普遍而译作“全地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְּכוֹן
  choice: 从……居所
  rationale: מָכוֹן指安定、确立的所在；与שִׁבְתּוֹ连用时，现代汉语以“从自己的居所”自然表达其固定住处的方位意义。
- source_word: שִׁבְתּוֹ
  choice: 自己的居所
  rationale: 该词源于ישׁב，在此带第三人称单数后缀，指“他的居住之处”；“自己的居所”既清楚承接上文主语，也符合现代汉语习惯。
- source_word: הִשְׁגִּיחַ
  choice: 俯察
  rationale: שׁגח的Hiphil形式含专注观看、察看的意思，语境又呈现从居所向下观看的空间关系；“俯察”兼顾方向感与留意观察的语义。
- source_word: אֶל
  choice: （俯察）……
  rationale: אֶל标示观看所朝向的对象；汉语无需另译介词，可由“俯察”直接带宾语。
- source_word: כָּל
  choice: 所有的
  rationale: 在复数名词短语前具有总括意义，“所有的”直接保留其全面范围。
- source_word: יֹשְׁבֵי
  choice: 居民
  rationale: ישׁב的主动分词在此名词化，意为“居住的人”；“居民”自然、简洁，并保留集合意义。
- source_word: הָאָרֶץ
  choice: 地上
  rationale: הָאָרֶץ可指“地、土地”或“全地”；本诗语境范围普世，“地上”自然指全地，同时保留该词可能按地域理解的词义背景。
theological_decisions:
- issue: 上帝察看的范围
  choice: 普世范围：地上所有的居民
  alternative: 地域范围：那地所有的居民
  rationale: כָּל יֹשְׁבֵי הָאָרֶץ结合本诗上下文，强调察看全人类，而非仅限某一地区；脚注仍保留הָאָרֶץ可作“那地”理解的词汇可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“俯察”略带诗体色彩，适合诗篇语域，并简洁呈现从居所观看及专注观察两层含义；所有脚注标记均置于正文相关句末。
