  text: בִּ/דְבַ֣ר יְ֭הוָה שָׁמַ֣יִם נַעֲשׂ֑וּ וּ/בְ/ר֥וּחַ פִּ֝֗י/ו כָּל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/006.yaml
  text: By the word of Yahweh the heavens were made[a], and by the breath of his mouth all their host.
translation:
  language: zh_hans
  text: 诸天借着耶和华的话被造；天上的万象也借着他口中的气息[a]而成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”也可译为“灵”或“风”。
    reason: 保留希伯来词 רוּחַ 的词义幅度；在“他口中的”这一诗歌语境中，正文采用“气息”，但不排除其他可行译法。
lexical_decisions:
- source_word: בִּדְבַר
  choice: 因……的话
  rationale: 介词 בְּ 在此表示凭借的途径或施行的方式；“因耶和华的话”在现代汉语中自然地表达诸天借上帝发言而形成。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用简体中文圣经传统中对四字神名的通行音译，以保留此处的专名性质，而不以称号代替。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 保留希伯来语形式所表达的整体天界含义，也与创造语境相符。
- source_word: נַעֲשׂוּ
  choice: 造成
  rationale: עָשָׂה 是广义的“做、造”；“造成”保留其被动意义，又不强化为专用于创造的术语。
- source_word: וּבְרוּחַ
  choice: 因……气息
  rationale: רוּחַ 可指气息、风或灵；与“他口中”连用时，“气息”最直接地保留诗歌意象，并与上句的“话”构成平行。
- source_word: פִּיו
  choice: 他口中的
  rationale: 保留原文拟人化表达，并清楚呈现“话”与“口中气息”的诗性对应。
- source_word: כָּל־צְבָאָם
  choice: 天上的万象
  rationale: צָבָא 用于诸天时通常指天体的整体阵列；“万象”比直译“军队”更符合现代汉语，又表达 כָּל 的总体范围。
theological_decisions:
- issue: 创造语境中 רוּחַ 是否应明确译为“灵”
  choice: 正文译“气息”
  alternative: “灵”或“风”
  rationale: “他口中的”使“气息”成为本节平行结构中最贴切的主要语义；脚注保留“灵”的可能性，以免排除其在更广正典语境中的神学回响，也不把该回响直接写入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两分句保持希伯来诗歌的平行结构；第二分句补出“而成”，使原文省略的谓语在汉语中清楚自然。“天上的万象”传达诸天所属的一切天体，而避免“天军”在现代读者中可能引起的狭义人格化理解。
