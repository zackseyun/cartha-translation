  text: יִֽירְא֣וּ מֵ֭/יְהוָה כָּל הָ/אָ֑רֶץ מִמֶּ֥/נּוּ יָ֝ג֗וּרוּ כָּל יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/008.yaml
  text: Let all the earth fear Yahweh[a]; let all the inhabitants of the world stand in awe of him.
translation:
  language: zh_hans
  text: 愿全地都敬畏耶和华；愿世上所有的居民都因他而战兢[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战兢”也可译作“对他心生畏惧”或“在他面前战栗”；希伯来语此词表达因敬畏而生的惧怕。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירְאוּ
  choice: 愿……敬畏
  rationale: 该词是 ירא 的 Qal 未完成式第三人称复数，在本诗的平行句中带劝勉、祈愿语气。“敬畏”保留了既有惧怕又有崇敬的语义，不弱化为单纯的尊敬。
- source_word: מֵיְהוָה
  choice: 敬畏耶和华
  rationale: 介词 מן 跟在 ירא 之后，按希伯来语习惯标示敬畏的对象；神名 יְהוָה 音译为现代中文通行的“耶和华”。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: 与下句“世上所有的居民”平行，指普天下，而非某一地方或国土。
- source_word: מִמֶּנּוּ יָגוּרוּ
  choice: 都因他而战兢
  rationale: גור 在此表达由畏惧、震慑而生的战兢；מִמֶּנּוּ 指他是这种反应的缘由或对象。“因他而战兢”既保留介词表达，也与上句“敬畏”形成有变化的平行。
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: 世上所有的居民
  rationale: יֹשְׁבֵי 是“居住者、居民”，תֵבֵל 指有人居住的世界；此译自然地表达普世范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代简体中文圣经语境中“耶和华”最为通行且易于普通读者识别；同时不以“主”替代专名。
- issue: יִירְאוּ 与 יָגוּרוּ 所表达的敬畏性质
  choice: 敬畏／战兢
  alternative: 尊崇／肃然起敬
  rationale: 原文两词都包含真实的惧怕或震慑成分；译文不把它们淡化为仅有尊敬，也不限定为纯粹恐怖，从而保留敬畏中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两句均用“愿”呈现未完成式在此处的劝勉语气；以“敬畏／战兢”保留希伯来诗歌的同义平行和用词变化。
