  text: הַ/יֹּצֵ֣ר יַ֣חַד לִבָּ֑/ם הַ֝/מֵּבִ֗ין אֶל כָּל מַעֲשֵׂי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/015.yaml
  text: the one who forms the hearts of them all[a], who understands all their deeds.
translation:
  language: zh_hans
  text: 他塑造众人之心[a]，洞察他们一切所行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他一同塑造他们的心。”希伯来语 יַחַד 可译为“一同／共同”；正文按上下文将其理解为包括众人的心。
    reason: 保留 יַחַד 可译作“一同／共同”的词义及其与“塑造”相连的句法可能。
lexical_decisions:
- source_word: הַיֹּצֵר
  choice: 那位塑造……的
  rationale: 定冠词加Qal主动分词在此作名词用，描述上帝持续而具有特征性的作为；“塑造”保留יצר的造作意象。
- source_word: יַחַד
  choice: 众人
  rationale: יַחַד在此可表达整体、共同的范围，即上帝塑造所有人的心；正文以“众人之心”自然传达这一共同范围，同时用脚注保留“共同塑造”的句法可能。
- source_word: לִבָּם
  choice: 众人之心
  rationale: 原文“心”为单数并带第三人称阳性复数后缀，可按集合或分配意义理解；中文“众人之心”既贴近单数形式，也涵盖每个人的内心。
- source_word: הַמֵּבִין
  choice: 洞察
  rationale: בין的Hiphil分词表示理解、辨明；“洞察”既自然庄重，也适合上帝对人一切行为的彻底了解。
- source_word: אֶל
  choice: （不单独译出）
  rationale: אֶל标示理解所指向的对象，现代汉语中由“洞察”的宾语结构自然表达，无须机械译作“向着”。
- source_word: כָּל מַעֲשֵׂיהֶם
  choice: 他们一切所行
  rationale: מַעֲשִׂים指行为、作为；“一切所行”保留行动及其道德受察验的意味，并符合诗体语域。
theological_decisions:
- issue: 本节所指人群的范围
  choice: 理解为上帝塑造众人的心，并洞察他们的一切行为。
  alternative: 较窄地理解为紧邻语境中的君王或列国之人的心。
  rationale: 第13至15节从“世人”和“地上一切居民”推进到本节，因此保持广泛所指，不把对象限缩为某一群体。
- issue: יַחַד与塑造行为的关系
  choice: 正文表达上帝所塑造的是众人之心。
  alternative: 译作“共同塑造他们的心”，强调“共同／一并”的方式或时间。
  rationale: 原词允许“共同、一同”的理解；正文采用更符合上下文普遍范围的表达，但以脚注保留真实的词义与句法歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“众人之心”避免生硬的“他们所有人的心”，并保留希伯来语集合性单数；“所行”较“行为”更有诗篇语感。
