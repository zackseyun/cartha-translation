  text: כִּֽי יָשָׁ֥ר דְּבַר יְהוָ֑ה וְ/כָל מַ֝עֲשֵׂ֗/הוּ בֶּ/אֱמוּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/004.yaml
  text: For the word of Yahweh is upright[b][a], and all his work is done in faithfulness.
translation:
  language: zh_hans
  text: '因为雅威的话正直[a]；

    他一切所行的，无不信实[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正直”也可译作“正确”。
    reason: lexical_alternative
  - marker: b
    text: 直译：他一切的作为都在信实中。
    reason: formal_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文赞美的呼召，说明其根据；保留原文明确的因果关系。
- source_word: יָשָׁר
  choice: 正直
  rationale: 兼有端正、正确和合乎正道之意；“正直”既保留道德色彩，也适合诗歌语体。
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: דָּבָר在此指雅威所说的话或宣告；用“话”简洁自然。专名יהוה音译为“雅威”。
- source_word: וְכָל מַעֲשֵׂהוּ
  choice: 他一切所行的
  rationale: מַעֲשֶׂה虽为单数形式，在此具有集合意义；此译既表达全部行动，也符合现代汉语习惯。
- source_word: בֶּאֱמוּנָה
  choice: 无不信实
  rationale: אֱמוּנָה表示可靠、坚定、信实；结合无动词分句，以自然汉语表达雅威一切作为都具有信实可靠的性质。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近学界通常拟音的“雅威”，保留其专名性质，不以称号替代。
- issue: בֶּאֱמוּנָה所描述的是行为方式还是作为的性质
  choice: 他一切所行的，无不信实
  alternative: 他一切的作为都在信实中
  rationale: 希伯来文第二分句没有明写系词，介词短语既可描述其作为具有信实的性质，也可表达其行事全然信实。正文采用自然且不把含义收窄为单纯方式副词的译法，脚注保留较贴近形式的表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；以分行和分号呈现两个平行分句。“无不信实”保持简洁，并传达כָל的全面含义。
