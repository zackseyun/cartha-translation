id: PSA.33.21
reference: Psalms 33:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי ב֭/וֹ יִשְׂמַ֣ח לִבֵּ֑/נוּ כִּ֤י בְ/שֵׁ֖ם קָדְשׁ֣/וֹ בָטָֽחְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/021.yaml
  text: For our heart rejoices in him[b][a], because we have trusted in his holy name.
translation:
  language: zh_hans
  text: 因为我们的心因他而欢喜[b][a]，因为我们信靠了他的圣名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我们的心必因他而欢喜。”这里的希伯来语未完成式也可理解为将来，而不是现今惯常的状态。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为单数的“我们的心”，是集合性表达，指全体百姓共同的内在生命。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי（第一次）
  choice: 因为
  rationale: 引出本节对上文等候与蒙帮助的缘由；“因为”在现代汉语中自然地保留因果关系。
- source_word: בּוֹ
  choice: 因他而
  rationale: 阳性单数代词按上下文指向耶和华；“因他而欢喜”既表达欢喜与他的关联，也符合现代汉语习惯。
- source_word: יִשְׂמַח
  choice: 欢喜
  rationale: 未完成式在诗歌中可表示现今持续或惯常的状态，也可表示确信的将来；正文采用现时理解，并以脚注保留将来含义。
- source_word: לִבֵּנוּ
  choice: 我们的心
  rationale: 保留希伯来文单数集合表达，指全体百姓共同的内在生命，而不改写为复数“我们的心灵”。
- source_word: כִּי（第二次）
  choice: 因为
  rationale: 说明欢喜的根据，使两层因果关系在汉语中清楚可辨。
- source_word: בְשֵׁם
  choice: 信靠了……名
  rationale: 介词与“信靠”连用，表示信靠的对象；汉语无需另译介词即可自然表达。
- source_word: קָדְשׁוֹ
  choice: 他的圣名
  rationale: “圣”准确保留其分别为圣及神圣属性的含义；“圣名”也是自然、庄重的汉语表达。
- source_word: בָטָחְנוּ
  choice: 我们信靠了
  rationale: 完成式表达已经确立并对当前仍有意义的信靠；“信靠了”保留完成意味，同时不把它仅限于遥远过去。
theological_decisions:
- issue: בּוֹ与קָדְשׁוֹ中阳性单数代词的所指
  choice: 按上下文译为“他／他的”，指向耶和华
  alternative: 直接补出“耶和华”，或泛指“神”
  rationale: 邻近经文明确以耶和华为对象，因此代词自然回指他；但本节本身没有再次出现神名，故不在正文中补入“耶和华”或“神”。
- issue: יִשְׂמַח的时态力度
  choice: 正文按现今或惯常状态译为“欢喜”
  alternative: 按确信的将来译为“必欢喜”
  rationale: 希伯来语未完成式在诗歌中容许两种理解。正文顺应本节当前的信靠告白，脚注则明确保留将来解释，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因他而欢喜”保持诗歌感且不生硬；保留“我们的心”的单数形式与“圣名”的传统圣经语汇。两个“因为”对应原文两次כִּי，清楚呈现论证层次。
