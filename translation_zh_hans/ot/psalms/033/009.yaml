  text: כִּ֤י ה֣וּא אָמַ֣ר וַ/יֶּ֑הִי הֽוּא צִ֝וָּ֗ה וַֽ/יַּעֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/009.yaml
  text: For he spoke[a], and it came to be; he commanded[b], and it stood firm.
translation:
  language: zh_hans
  text: 因为他一说，就成了[a]；他一吩咐，就立定了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就有了”或“就存在了”。希伯来文非常简洁，直译可作“就成了／就有了”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“就站立了”或“就确立了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为敬畏耶和华提供理由；现代汉语用“因为”自然保留因果关系。
- source_word: הוּא
  choice: 他
  rationale: 独立代词带有强调意味；两小句重复“他”，既保留希伯来诗歌的平行结构，也自然体现强调。
- source_word: אָמַר
  choice: 说有
  rationale: 动词本义为“说”；结合紧接的“就有了”，译作“说有”以简洁、自然的汉语表达神发言而事物随即存在，同时不增添具体宾语。
- source_word: וַיְהִי
  choice: 就有了
  rationale: היה在此可指“存在、成为”；“就有了”保留原文极简的结果表达，也传达神一说便立即成就的意味。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 表示发出命令；“吩咐”庄重而通俗，并与前句“说有”形成自然平行。
- source_word: וַיַּעֲמֹד
  choice: 就立定了
  rationale: עמד字面为“站立”，此处具有确立、稳固存在的结果意味；“立定”兼顾具体意象和语境含义。
theological_decisions:
- issue: 神发言之后的创造／成就语言
  choice: 译为“他说有，就有了；他一吩咐，就立定了”
  alternative: “他说了，事就成了；他命令了，事就站立”或“他一说，就有；他一命令，就确立”
  rationale: 译文呈现神的话语立即而持久地成就其结果，但不把经文扩展为超出本节的系统性创造论陈述；两句仍保留“存在／成为”与“站立／确立”之间的诗意张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。两句重复“他”以保留原文平行和强调；“说有，就有了”简洁有力，“立定了”保留עמד的站立意象及稳固、确立之意。
