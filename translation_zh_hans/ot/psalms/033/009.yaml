  naturalness: “他说有，就有了”虽会令人联想到创世记的固定表达，但在此处句法上较为突兀，也将原文的“说—结果”结构改成“说‘有’—有”的引语式结构。“他一说，就成了”在现代庄重汉语中自然、凝练，并保留原文未明说结果主语的概括性。
  terminology: “吩咐”适切对应צוה；“立定了”适切表达ויעמד在此语境中的站立、确立和稳固。无需加入“万物”“事物”或任何教义性说明。
