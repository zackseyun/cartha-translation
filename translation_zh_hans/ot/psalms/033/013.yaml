  text: מִ֭/שָּׁמַיִם הִבִּ֣יט יְהוָ֑ה רָ֝אָ֗ה אֶֽת כָּל בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/013.yaml
  text: From heaven Yahweh looks[a]; he sees all the sons of man.
translation:
  language: zh_hans
  text: '雅威从天上俯视；

    他看见所有世人[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“人的众子”，是统指全体人类的诗歌表达。
    reason: 说明希伯来语习语的字面形式及其集合含义。
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: 从天上
  rationale: מִן表示视点或来源“从”，שָׁמַיִם在此指天上的所在；“从天上”符合现代汉语习惯，也保留了俯察人间的空间意象。
- source_word: הִבִּיט
  choice: 俯视
  rationale: 该动词的使役词干表示定睛观看、察看；结合“从天上”，译作“俯视”自然凝练，并传达由上而下察看的画面。希伯来语完成式在诗歌中可陈述恒常事实，故用汉语一般现在式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译保留四字神名，避免用称号替代专名。
- source_word: רָאָה
  choice: 他看见
  rationale: רָאָה是普通的“看见”；补出“他”使两个诗行的主语关系在汉语中清楚，同时保留与“俯视”的平行递进。完成式按诗歌中的一般性陈述处理。
- source_word: כָּל בְּנֵי הָאָדָם
  choice: 所有世人
  rationale: 字面近于“人的众子”，但这是希伯来诗歌中统指人类的集合表达。“所有世人”在现代汉语中自然、庄重，也准确涵盖全体人类；字面形式在脚注说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”保留专名性质，不以“主”这一称号替换；“耶和华”虽为汉语传统形式，但“雅威”更接近通常重构的读音。
- issue: בְּנֵי הָאָדָם 的集合含义
  choice: 所有世人
  alternative: 人的众子；所有人的儿子
  rationale: 该短语在这里不是专指男性后代，而是诗歌性地统指全体人类。采用“世人”避免在汉语中误解为某个人的儿子，同时以脚注保留其希伯来语字面意象。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体；分为两个短行以呈现原文两个平行动词。“俯视／看见”保留由定睛察看到实际看见的推进，不把上帝的察看进一步解释为审判或眷顾。
