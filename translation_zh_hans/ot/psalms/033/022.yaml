  yaml_path: translation/ot/psalms/033/022.yaml
  text: Let your steadfast love be upon us, O LORD, even as we hope in you.
translation:
  language: zh_hans
  text: 耶和华啊，愿你的慈爱临到我们，正如我们仰望你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 表达该词在盟约关系中忠贞、坚定而施恩的爱；“慈爱”自然庄重，也保留其丰富含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名译法呈现四字神名，区别于一般称谓“主”。
- source_word: עָלֵינוּ
  choice: 临到我们
  rationale: 希伯来文直译为“在我们之上”；中文用“临到”自然表达祈愿上帝的慈爱覆庇、施予众人。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 保留原文比较或对应关系，不把它明确解释为原因、程度或条件。
- source_word: יִחַלְנוּ לָךְ
  choice: 我们仰望你
  rationale: 该动词在此指带着盼望等候；“仰望你”符合诗歌语体，并自然表达将盼望寄托于上帝。
theological_decisions:
- issue: 上帝慈爱与人的盼望之间的关系
  choice: 正如我们仰望你
  alternative: 因为我们仰望你／照着我们对你的盼望
  rationale: 原文 כַּאֲשֶׁר 具有比较、对应的张力；采用“正如”避免断言人的盼望是获得慈爱的功德性原因，也不限定慈爱的程度。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈愿语体；句序略按中文呼语习惯调整，同时保留原文的祈求与对应结构。
