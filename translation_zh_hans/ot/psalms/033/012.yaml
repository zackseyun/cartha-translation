  text: אַשְׁרֵ֣י הַ֭/גּוֹי אֲשֶׁר יְהוָ֣ה אֱלֹהָ֑י/ו הָ/עָ֓ם בָּחַ֖ר לְ/נַחֲלָ֣ה לֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/012.yaml
  text: Blessed is the nation whose God is Yahweh[b][a], the people he has chosen for his inheritance.
translation:
  language: zh_hans
  text: 以雅威[a]为自己的上帝的国有福了[b]；这国就是他拣选作自己产业的民[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来语中上帝的名字 יְהוָה 的音译；传统汉译常作“耶和华”，有些译本以“耶和华”或“主”代替这个名字。
    reason: divine_name
  - marker: b
    text: “有福了”也可译作“真有福”或“多么幸福”；这里所说的不只是快乐的感受，更是蒙福的境况。
    reason: lexical_alternative
  - marker: c
    text: 这里很可能特别指雅威所拣选的以色列民，但原文只说“民”，正文因此没有直接增译“以色列”。
    reason: referent_ambiguity
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是诗篇中常见的祝福宣告用语，表示处于蒙福、可称颂的境况，不只描述主观的快乐；“有福了”既自然，也保留礼仪和盟约语气。
- source_word: הַגּוֹי
  choice: 国
  rationale: גּוֹי在此指具有共同身份的民族或国家群体，并与下句的הָעָם“民”构成诗意对应；“国”简洁地保留了这一群体性表达。
- source_word: אֲשֶׁר יְהוָה אֱלֹהָיו
  choice: 以雅威为自己上帝的
  rationale: 希伯来文直陈“雅威是它的上帝”。现代汉语用“以……为自己的上帝”表达更顺畅，同时保留第三人称单数所属关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名直接音译，表明这里使用的是上帝的专名，而非“主”这一称号。
- source_word: הָעָם
  choice: 民
  rationale: עָם强调共同体或盟约群体的身份；“民”与前句的“国”形成凝练的诗体对应。
- source_word: בָּחַר
  choice: 拣选
  rationale: 完成式表明拣选已经发生，其结果持续有效；汉语“拣选”准确保留经文中郑重的选择行动。
- source_word: לְנַחֲלָה לוֹ
  choice: 作自己产业
  rationale: נַחֲלָה可指承受的产业、基业或归属之物；此处“作自己产业”自然表达归属雅威的关系，又不把意象缩减为一般的“财产”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”以保留专名性质；脚注说明传统译法，避免把专名无声地改为称号。
- issue: “国”与“民”所指的范围
  choice: 正文保留“国／民”的诗意表述，不直接增译“以色列”
  alternative: 把两者都明确译成“以色列”；将其泛化为任何承认雅威的国家
  rationale: 上下文很可能特别指以色列，尤其“他拣选作自己产业的民”带有盟约意味；然而本节原文本身没有明说“以色列”。译文因此保留原有张力，并在脚注提示可能的具体所指。
- issue: 第二分句与第一分句的关系
  choice: 用“就是”表达同位说明
  alternative: 重复“有福了”，形成两个并列祝福句
  rationale: 希伯来文第二分句没有另一个“有福”或系词，更自然地把“他所拣选的民”理解为对前面“国”的同位说明；“就是”清楚呈现这一关系，但不增添新的断言。
- issue: נַחֲלָה的神学意象
  choice: 产业
  alternative: 基业；所有物
  rationale: “产业”保留分得、承受和归属的语义空间。这里并非暗示上帝从先辈继承，而是说这民是他为自己拣选、归他所有的产业。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“以……为自己的上帝”避免生硬直译，“国／民”保留希伯来诗歌的对应关系；“就是”使第二分句的同位结构在汉语中清楚可读。
