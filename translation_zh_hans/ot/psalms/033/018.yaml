  text: הִנֵּ֤ה עֵ֣ין יְ֭הוָה אֶל יְרֵאָ֑י/ו לַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/018.yaml
  text: Behold[a], the eye of Yahweh is on those who fear him, on those who wait for his steadfast love,
translation:
  language: zh_hans
  text: 看哪，耶和华的眼目在敬畏他的人身上，也在等候他慈爱的人身上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候他慈爱的人”也可译作“盼望他慈爱的人”。希伯来语动词兼有等候和盼望的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意并加强语气的话语标记；“看哪”保留诗歌中的指示和强调作用。
- source_word: עֵין
  choice: 眼目
  rationale: 保留原文“眼”的拟人化意象；现代汉语圣经语体中的“眼目”自然地表达关注与察看。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代简体中文读者最熟悉的专名形式呈现四字神名，不以头衔替代。
- source_word: אֶל
  choice: 看顾
  rationale: 与“眼目”连用时，原文表示目光朝向、关注某人；“看顾”以自然汉语传达带有关切的监察，但不扩展为具体行动。
- source_word: יְרֵאָיו
  choice: 敬畏他的人
  rationale: 保留圣经中“敬畏”的核心表达，兼含畏惧与尊崇，且符合分词所指的一类人。
- source_word: לַמְיַחֲלִים
  choice: 等候……的人
  rationale: יחל兼有等候和盼望之意；正文采用“等候”以保留持续、期待的姿态，并以脚注交代“盼望”的可能译法。
- source_word: לְחַסְדּוֹ
  choice: 他的慈爱
  rationale: “慈爱”在现代中文圣经语境中能较简洁地承载חֶסֶד所包含的恩慈、信实与守约之爱；介词与前面的动词相连，构成“等候他的慈爱”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名。中文正文保留专名，并采用普通现代读者更熟悉、较稳定的“耶和华”；不以“主”等称号替换。
- issue: חֶסֶד 的语义范围
  choice: 慈爱
  alternative: 信实之爱；忠贞的爱；怜悯
  rationale: 该词兼具恩慈、忠诚及关系中的信实；“慈爱”不把意义仅限于怜悯，也避免在正文中加入原文未明说的解释成分。
- issue: יחל 的等候与盼望双重含义
  choice: 正文译“等候”，脚注说明也可译“盼望”
  alternative: 盼望他的慈爱
  rationale: 原词本身容许期待中的等待和怀着信心的盼望；正文不将两者强行合并，脚注保存真实的词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”和“眼目”保留诗歌及圣经语体，“敬畏”“慈爱”则保持经文的神学厚度。用“就是”显明两个介词短语在诗行中的同位、平行关系。
