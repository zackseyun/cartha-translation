  text: לְ֭/מַכֵּה מְלָכִ֣ים גְּדֹלִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/017.yaml
  text: To him who struck down great kings[b][a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 要称谢那击打强大君王的[a]，因他的慈爱[b]永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那击败强大的君王的”。希伯来语在这里用带介词“向、给”的分词结构，承接本诗“要称谢……”的赞美格式。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来语 חֶסֶד（hesed）常指忠贞、守约的爱，也可译作“怜悯”或“信实之爱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: 要称谢那击杀……的
  rationale: 介词 לְ 加分词承接本诗反复出现的称谢格式；中文补出上文所支配的“要称谢”，使本节独立诵读时自然。“击杀”表达 נכה 在此历史语境中决定性击败并杀灭的含义。
- source_word: מְלָכִים גְּדֹלִים
  choice: 众大君王
  rationale: “众”明确复数；“大君王”保留 גְּדֹלִים 的基本意义，并可自然涵盖地位显赫、势力强大的含义，不赋予道德褒义。
- source_word: כִּי
  choice: 因
  rationale: 引出全诗反复的称谢理由；“因”简洁、庄重，适合礼仪性复句。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文意为持续到永远；中文以“长存”补足谓语，准确表达恒久延续。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חסד 包含仁慈、忠贞和盟约忠诚等意涵。“慈爱”是自然、凝练且适合反复句的中文表达，并由脚注保留其较宽的语义范围。
theological_decisions:
- issue: 反复句中 חַסְד 的译法
  choice: 他的慈爱永远长存
  alternative: 他的怜悯永远长存；他的信实之爱永远长存
  rationale: “慈爱”兼具爱与恩慈，且不把该词缩减为单纯的怜悯；脚注说明其忠贞、守约的色彩，以保留神学意涵而不把某一种解释写死在正文中。
- issue: לְמַכֵּה 所表达的行动强度
  choice: 击杀
  alternative: 击打；击败
  rationale: 下文历史语境涉及君王遭决定性消灭，“击杀”较能体现 נכה 的语境意义；脚注保留较宽泛的直译可能，避免掩盖词义范围。
translation_notes:
  register: 采用现代、庄重、适合会众诵读的书面普通话。保留诗篇136篇反复句的简洁节奏；“众大君王”既明确复数，也避免“伟大”可能带来的道德褒义。
