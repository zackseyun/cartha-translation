  text: the moon and stars to rule over the night[b][a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '造月亮和众星掌管黑夜的，[a]

    因他的慈爱[b]永远长存。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掌管”也可译作“治理”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语חֶסֶד也可按语境译作“忠贞的爱”“怜悯”或“盟约信实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，引出承接上文“造……”的宾语，在现代汉语中没有对应词。
- source_word: הַיָּרֵחַ
  choice: 月亮
  rationale: יָרֵחַ指月亮；汉语在此通常不需另译定冠词。
- source_word: וְכוֹכָבִים
  choice: 和众星
  rationale: כּוֹכָבִים意为“星辰、众星”；“众星”自然、庄重，并表达复数。
- source_word: לְמֶמְשְׁלוֹת
  choice: 管理
  rationale: 该词表示统管或治理的职能；“管理”保留其功能性含义，也与创世记一章的用语相呼应。
- source_word: בַּלָּיְלָה
  choice: 黑夜
  rationale: 介词与前面的“管理”结合，表达月亮和众星所管辖的时段；现代汉语可自然说“管理黑夜”。
- source_word: כִּי
  choice: 因
  rationale: 引出诗篇反复出现的理由句；“因”简洁庄重，适合礼仪式复句。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 与חַסְדּוֹ连用，表达持续到永远；“永远长存”兼顾汉语自然度和反复吟诵的节奏。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד涵盖忠贞、恩慈、怜悯及盟约信实；“慈爱”是简明、自然且不将词义限缩为单一层面的译法。
theological_decisions:
- issue: 诗篇136篇副歌中חֶסֶד的译法
  choice: 他的慈爱永远长存
  alternative: 他的信实之爱永远长存；他的怜悯永远长存；他的慈爱直到永远
  rationale: “慈爱”保留神恩慈与忠贞之爱的宽广含义，不把该词只限定为怜悯或明确的盟约术语；“永远长存”清楚表达其恒久性。
- issue: לְמֶמְשְׁלוֹת所表达的受造界职能
  choice: 管理黑夜
  alternative: 掌管黑夜；治理黑夜
  rationale: 原文把月亮和众星描写为承担管理夜间的职能。“管理”保留这一创造秩序的表达，同时避免赋予天体独立神性的暗示。
translation_notes:
  register: 采用现代、庄重而适合诗歌诵读的普通话。“造”承接上一节的句法，在本节补出以符合汉语表达；分行保留诗篇136篇陈述与副歌的节奏。
