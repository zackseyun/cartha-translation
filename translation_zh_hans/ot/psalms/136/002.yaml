  text: ה֭וֹדוּ לֵֽ/אלֹהֵ֣י הָ/אֱלֹהִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/002.yaml
  text: Give thanks to the God of gods[b][a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 你们要称谢万神之神[a]，因他的慈爱[b]永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“神中之神”，是表达至高无上的说法；也可译作“超越万神的上帝”。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来词也含有忠贞、信实和怜悯之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: 要称谢
  rationale: 这是 ידה 的使役词干复数祈使式，在此是向众人发出的劝召；“要称谢”保留命令语气，也符合诗篇反复句的庄重风格。
- source_word: לֵאלֹהֵי הָאֱלֹהִים
  choice: 万神之神
  rationale: 希伯来文直译为“神中之神”。“万神之神”是自然而庄重的汉语最高级表达，保留原文修辞，同时不对其他神明是否真实存在作本体论判断。
- source_word: כִּי
  choice: 因
  rationale: 此处引出称谢的理由；“因”简洁地维持诗歌结构及因果关系。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文意为“直到永远”，与无动词句中的隐含持续意义相连；“永远长存”在现代汉语中自然清楚。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד 涵盖忠贞、恩慈、怜悯及关系中的信实。“慈爱”是简明且熟悉的中文表达；脚注补明其忠贞信实的内涵，避免正文过度释义。
theological_decisions:
- issue: “神中之神”这一称号如何表达
  choice: 保留为“万神之神”，表达上帝至高无上
  alternative: 译作“超越万神的上帝”，明确解释其至高性
  rationale: 原文采用“神中之神”的最高级或至上性惯用语。保留这一修辞不等于断言其他神明真实存在，也不应由译者替原文解决该问题。
- issue: חֶסֶד 的神学内涵
  choice: 正文译“慈爱”，脚注说明其忠贞、信实的关系性内涵
  alternative: 正文译“立约的信实之爱”
  rationale: 原词意义丰富，但本节本身没有明说“约”。“慈爱”保持正文简洁，脚注则提示其稳定忠贞的内涵，而不把一种神学解释直接写入正文。
translation_notes:
  register: 采用现代、庄重、适合会众诵读的标准普通话。“要称谢”保留复数祈使的劝召力度；整句维持诗篇136篇反复句简洁、整齐的节奏。
