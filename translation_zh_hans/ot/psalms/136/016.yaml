  text: לְ/מוֹלִ֣יךְ עַ֭מּ/וֹ בַּ/מִּדְבָּ֑ר כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/016.yaml
  text: to him who led his people in the wilderness[b][a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '他带领自己的子民走过旷野[a]，

    因他的慈爱[b]永远长存。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在旷野中带领自己的子民。”希伯来文介词直译为“在……中”；这里与“带领”连用，也可表达行经旷野。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来词也含有忠贞、恩慈和守约之爱的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמוֹלִיךְ
  choice: 他带领
  rationale: 这是הלך的使役式不定词，前接לְ，在本诗连续的称谢句式中承接“要称谢……”。译作“他带领”以自然中文表达“使……行走、引领”的意思，并保留本节诗行的简洁性。
- source_word: עַמּוֹ
  choice: 自己的子民
  rationale: עַם在这里指属于上帝、与他有关系的百姓；“子民”比单纯的“人民”更能表达这种归属关系。“自己”清楚回指施行带领的上帝。
- source_word: בַּמִּדְבָּר
  choice: 走过旷野
  rationale: מִדְבָּר指旷野、荒野；介词בְ字面为“在……中”。与“带领”连用时，“走过旷野”是自然中文，也表达在旷野中行进的语境；脚注保留较直译的可能。
- source_word: כִּי
  choice: 因
  rationale: כִּי引出称谢的理由。“因”简洁庄重，适合全诗反复出现的礼仪性副歌。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: לְעוֹלָם表示持续到永远；与חֶסֶד连用时，中文用“永远长存”自然表达其恒久性。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有恩慈、忠贞和守约之爱的内涵。“慈爱”是简洁、庄重且易懂的中文表达，又不把词义局限为怜悯或抽象的契约术语；脚注说明其较宽的语义范围。
theological_decisions:
- issue: חֶסֶד在副歌中的译法
  choice: 他的慈爱永远长存
  alternative: 他的信实之爱永远长存；他的恩慈永远长存
  rationale: “慈爱”保留上帝仁爱施恩的核心，同时不排除其忠贞、守约的层面。正文避免用技术性较强的“圣约忠诚”缩窄诗歌用语，脚注则提示原词的丰富含义。
- issue: 上帝带领百姓与旷野的空间关系
  choice: 走过旷野
  alternative: 在旷野中带领自己的子民
  rationale: 希伯来介词本义允许理解为“在旷野中”，而出埃及行程的语境又自然包含穿行。正文采用流畅的动态表达，脚注保留形式上更贴近介词的译法，不将两者处理成互相排斥的神学判断。
translation_notes:
  register: 采用现代、庄重而适合诵读的诗歌语言。两行结构保留诗篇136篇行动陈述与固定副歌之间的节奏；“因他的慈爱永远长存”宜在全诗中保持一致。
