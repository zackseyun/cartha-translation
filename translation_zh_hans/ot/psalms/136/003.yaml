base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/003.yaml
  text: Give thanks to the Lord of lords[a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '要称谢万主之主，

    因他的慈爱[a]永远长存。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“坚定的爱”或“守约的爱”。希伯来语חֶסֶד可指忠贞不渝的爱，也可指恩慈或怜悯。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: 要称谢
  rationale: 这是ידה的使役形复数祈使式，在本诗反复出现的礼仪性呼召中，意为向上帝献上感谢和颂赞。“要称谢”既保留命令语气，也符合现代汉语诗歌体。
- source_word: לַאֲדֹנֵי הָאֲדֹנִים
  choice: 万主之主
  rationale: 该结构直译为“众主之主”，表达至高无上的主权。“万主之主”保留希伯来语的称号式结构，并在中文中自然、庄重。
- source_word: כִּי
  choice: 因
  rationale: 引出称谢的理由；“因”简洁地保留原文诗歌式因果关系。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文直义为“直到永远”；无动词句在中文中补出“长存”，自然表达持续不止的含义。
- source_word: חַסְדּוֹ
  choice: 他的信实慈爱
  rationale: חֶסֶד兼有慈爱、忠诚及守约不渝的内涵。“信实慈爱”力求保留其关系性的忠贞和恩慈，而不将其缩窄为单纯的怜悯。
theological_decisions:
- issue: 神圣称号אֲדֹנֵי הָאֲדֹנִים的表达
  choice: 万主之主
  alternative: 众主之主；万有的主宰
  rationale: “万主之主”保留原文属格式的至高称号，表达上帝超越一切掌权者的主权；不改写为“万有的主宰”，以免消除原文的重复修辞。
- issue: חֶסֶד的神学内涵
  choice: 信实慈爱
  alternative: 慈爱；怜悯；守约的信实
  rationale: 原词可涵盖恩慈、忠贞和盟约关系中的信实。“信实慈爱”保留这种复合张力，但不把“盟约”明说为原文此处未出现的名词。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“要称谢”保留会众呼召的语气；分行呈现命令与理由。脚注标记置于第一行末，但脚注内容说明第二行“信实慈爱”的词义。
