  text: '他赐食物给一切活物；

    因他的慈爱永远长存。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹתֵן
  choice: 他赐
  rationale: 分词描写上帝持续施行的供应；结合本诗连续颂赞的句式，译为“他赐”自然简洁，也保留持续行动的含义。
- source_word: לֶחֶם
  choice: 食物
  rationale: 本义是“饼”，在此可转指一般食物；面对所有活物的普遍供应，译为“食物”更符合现代汉语，字面译法收入脚注。
- source_word: לְכָל בָּשָׂר
  choice: 给凡有血肉的
  rationale: 介词表示领受者；“凡有血肉的”保留希伯来语习语及其经文呼应，不把范围无根据地缩窄为全人类。
- source_word: כִּי
  choice: 因
  rationale: 引出全诗反复出现的颂赞依据，并保持副歌简洁庄重的节奏。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文为无动词句；汉语补出“长存”，自然表达其恒久不止的意义。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有恩慈、忠贞和恒常之爱的意味；“慈爱”简洁、庄重且适合反复的礼仪性副歌，同时不把词义限定为怜悯或明确展开为盟约忠诚。
theological_decisions:
- issue: “凡有血肉的”的范围
  choice: 保留该习语，并由脚注说明它在此涵盖一切活物
  alternative: 译为“全人类”或“所有人”
  rationale: 希伯来语短语常可泛指一切有生命的受造物；本节强调上帝普遍的供应，不应在正文中无根据地将范围限于人类。
translation_notes:
  register: 采用现代、庄重而适合诗歌副歌的表达。“赐”体现上帝作为供应者的语境；分行呈现行动与反复的颂赞句。
