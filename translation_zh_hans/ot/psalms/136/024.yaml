  yaml_path: translation/ot/psalms/136/024.yaml
  text: and rescued us from our foes[a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 他救我们脱离仇敌，因他的慈爱永远长存。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרְקֵנוּ
  choice: 他救我们脱离
  rationale: פרק在此表示从危险、压迫或敌对势力中解救出来；“救……脱离”既自然，又保留宽泛的拯救含义。
- source_word: מִצָּרֵינוּ
  choice: 敌人的手
  rationale: צָרֵינוּ指“我们的敌人／仇敌”。原文没有“手”，但现代汉语“救我们脱离敌人的手”自然表达从敌人控制或威胁下获救；脚注保留更贴近形式的译法。
- source_word: כִּי
  choice: 因
  rationale: 这里引出诗篇反复出现的赞美理由；“因”简洁庄重，并维持礼仪性复沓的节奏。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: לְעוֹלָם表示永久、直到永远；与“慈爱”搭配时，“永远长存”在现代汉语中完整自然。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד涵盖仁慈、忠贞和持续不变的恩爱；“慈爱”是自然、庄重且范围较宽的中文表达，不将其缩减为单纯怜悯。
theological_decisions:
- issue: 诗篇136篇副歌中חֶסֶד的译法
  choice: 他的慈爱永远长存
  alternative: 他的信实之爱永远长存／他的怜悯永远长存
  rationale: “慈爱”能同时承载恩慈与持久眷爱的含义，又避免把词义限定为怜悯；“永远长存”突出这种爱的恒久性，但不额外加入原文未明说的神学限定。
translation_notes:
  register: 采用现代、庄重而适合诗篇复诵的表达。“因他的慈爱永远长存”保持全篇副歌应有的简洁和节奏；正文中的“敌人的手”属自然汉语补足，脚注给出更贴近希伯来文形式的译法。
