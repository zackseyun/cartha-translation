id: PSA.136.11
reference: Psalms 136:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יּוֹצֵ֣א יִ֭שְׂרָאֵל מִ/תּוֹכָ֑/ם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/011.yaml
  text: and brought Israel out from among them[b][a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 又把以色列从他们中间[a]领出来，因为他的慈爱[b]永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从他们当中”。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”也可译为“忠贞的爱”，传统上也常译为“怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: 又把……领出来
  rationale: יצא的使役式表示“使出来、带出来”。“领出来”在现代汉语中自然，并保留使役含义；“又”承接上节连续叙述。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 此处是专名，按上下文指以色列民，采用通行译名。
- source_word: מִתּוֹכָם
  choice: 从他们中间
  rationale: 该短语表示从一群人的内部或当中出来；代词“他们”承接上文的埃及人，不在正文中擅自明说。
- source_word: כִּי
  choice: 因为
  rationale: 在诗篇136篇反复出现的副歌中引出赞美的理由，保留其因果关系。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文副歌是无动词句；汉语补出“长存”，自然表达持续到永远的含义。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חסד兼有仁慈、信实和忠贞之爱的意涵。“慈爱”是简洁、庄重且通行的中文表达，并以脚注提示其较宽的语义范围。
theological_decisions:
- issue: 诗篇136篇副歌中חַסְדּוֹ的译法
  choice: 他的慈爱永远长存
  alternative: 他忠贞的爱永远长存；他的怜悯永远长存
  rationale: “慈爱”保留恩慈与爱的核心含义，又不把该词仅限于怜悯或明确限定为某一种约的术语；“长存”是为符合现代汉语而补出的谓语，不改变原文关于其永久性的宣告。
translation_notes:
  register: 采用现代、庄重而适合礼仪复诵的表达。“又……因为……永远长存”保持本诗连续叙事和反复副歌的节奏；代词“他们”保留原文的上下文指涉。
