lexical_decisions:
- source_word: אֶת
  choice: （不单独译出）
  rationale: 这是希伯来语的确定直接宾语标记；其功能由自然的汉语语序体现。
- source_word: הַשֶּׁמֶשׁ
  choice: 太阳
  rationale: 定冠词与名词合译为“太阳”，是现代汉语直接、自然的表达。
- source_word: לְמֶמְשֶׁלֶת
  choice: 掌管
  rationale: 原文使用表示“统治、权柄”的名词。结合上文创造并设立光体的语境，汉语用动词“掌管”更自然，同时保留其治理之意。
- source_word: בַּיּוֹם
  choice: 白昼
  rationale: 介词短语说明太阳掌管的时间或范围；“掌管白昼”与下节的昼夜对举简洁协调。
- source_word: כִּי
  choice: 因
  rationale: 引出赞美的理由；“因”既保留因果关系，也适合本诗反复出现的礼仪性副歌。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文直译近于“直到永远”，与无动词的名词短语连用；汉语补出“长存”，自然表达持续不止的意义。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有仁慈、忠贞之爱及信实守约等内涵。“慈爱”是简洁、庄重且易懂的汉语表达，但不能穷尽原词全部意涵，故加注说明。
theological_decisions:
- issue: 诗篇136篇副歌中חֶסֶד的译法
  choice: 他的慈爱永远长存
  alternative: 他的信实之爱永远长存；他的怜悯永远长存
  rationale: “慈爱”保留仁爱和恩慈的核心意义，又不把原词限定为单纯怜悯或只指盟约概念；脚注交代其忠贞、信实的内涵，以保存原文丰富的神学张力。
- issue: לְמֶמְשֶׁלֶת的语法形式
  choice: 掌管
  alternative: 为要掌管；作为白昼的统治者
  rationale: 希伯来文用“统治、权柄”的名词，而汉语在此用动词最为自然。此译法不额外断定具体的设立方式，只表达太阳对昼间领域的治理功能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“掌管白昼”保持与相邻经节昼夜对举的简洁节奏；副歌译作“因他的慈爱永远长存”，适合反复诵读。所有脚注标记均置于正文相关内容之后。
