  text: 使太阳掌管白昼[a]，因他的慈爱[b]永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处可直译为“为掌管白昼”，其中“掌管”是表示“统治、管辖”的名词；也可译作“使太阳在白昼掌权”。
