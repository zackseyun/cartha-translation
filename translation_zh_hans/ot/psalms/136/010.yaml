  text: לְ/מַכֵּ֣ה מִ֭צְרַיִם בִּ/בְכוֹרֵי/הֶ֑ם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/010.yaml
  text: To him who struck Egypt in their firstborn[a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '那击打埃及人长子的，

    因他的慈爱永远长存。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“在他们的长子中击打埃及”，也可理解为“借着击打他们的长子来击打埃及”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: 那击打……的
  rationale: לְ延续本诗礼赞对象的与格结构，מַכֵּה是带动词作用的分词；中文用“那击打……的”自然承接上下文省略的称谢语。
- source_word: מִצְרַיִם
  choice: 埃及人
  rationale: 此处“他们的长子”指埃及人的长子；译作“埃及人”可使中文所属关系清楚，同时保留对埃及整体施行打击的意思。
- source_word: בִּבְכוֹרֵיהֶם
  choice: 长子
  rationale: בְּ与“击打”结合，指出打击落在埃及的长子身上。正文按自然中文表达为“击打埃及人长子”，不额外加入原文没有明说的动作。
- source_word: כִּי
  choice: 因
  rationale: 引出全诗反复出现的理由句；“因”庄重、简洁，并适合诗歌复沓。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 在反复句中表达持续到永远的含义；补出“长存”符合现代汉语表达。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有恩慈、忠贞与持久之爱的内涵；“慈爱”是清楚、庄重且不把词义限缩为单纯怜悯的中文表达。
theological_decisions:
- issue: 如何呈现上帝击打埃及长子的审判而不弱化经文
  choice: 正文直接保留“击打埃及人长子”，并紧接“他的慈爱永远长存”的赞美复句。
  alternative: 用较缓和的措辞淡化审判，或在正文扩写为“借着击杀他们的长子”。
  rationale: 原文把这项审判作为出埃及救赎行动的一部分加以颂赞。译文不应减轻其严厉性，也不应添加解释来消除审判与慈爱并置所形成的神学张力。
translation_notes:
  register: 采用现代、庄重、可诵读的诗歌语言。“那……的”承接诗篇136篇连贯的称谢结构；保留简洁的两行复沓。脚注标记置于本节末，以免割裂正文，同时说明希伯来介词结构的真实歧义。
