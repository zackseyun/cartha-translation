  text: לְ֭/סִיחוֹן מֶ֣לֶךְ הָ/אֱמֹרִ֑י כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/019.yaml
  text: Sihon[a], king of the Amorites[c][b], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 亚摩利人的王西宏；因为他的慈爱[a]永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“信实之爱”，包含忠贞、信实地施爱的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְסִיחוֹן
  choice: 西宏
  rationale: לְ在这里承接上一节“击杀强大的君王”，标示受击杀的对象。现代汉语无需把该介词另译出来，直接以“西宏”承接上文最自然。
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: 亚摩利人的王
  rationale: מֶלֶךְ意为“王”；הָאֱמֹרִי在形式上是单数族称“那亚摩利人”，在王号中指所统治的族群，汉语惯用“亚摩利人的王”。
- source_word: כִּי
  choice: 因为
  rationale: 在本诗反复出现的礼仪性副歌中，כִּי说明称谢上帝的理由；“因为”准确清楚，也保留原文与前句的逻辑联系。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文副歌是无动词句；汉语补出“长存”，表达לְעוֹלָם的持续、永久之意。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有仁爱、信实和忠贞施恩的内涵。“慈爱”是自然、庄重且不过度限定其盟约含义的现代汉语表达。
theological_decisions:
- issue: 诗篇136篇副歌中חֶסֶד的译法
  choice: 他的慈爱永远长存
  alternative: 他的信实之爱永远长存
  rationale: “慈爱”保留上帝主动施恩与持久眷爱的核心意义；“信实之爱”更明确呈现忠贞层面，却也比原文更具解释性，因此列入脚注而不放入正文。
translation_notes:
  register: 采用现代、庄重而适合会众诵读的表达。分号体现本节前半句承接上一节“击杀”的列举结构，后半句则是全诗反复出现的称谢副歌。
