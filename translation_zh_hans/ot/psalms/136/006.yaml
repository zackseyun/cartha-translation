  text: לְ/רֹקַ֣ע הָ֭/אָרֶץ עַל הַ/מָּ֑יִם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/006.yaml
  text: to him who spread out the earth upon the waters[a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '铺展大地在众水之上的那一位[a]，

    因他的慈爱永远长存。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把大地伸展在众水之上的那一位”；希伯来语动词也可具体指像锤打金属那样将其打成宽广的薄片。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/רֹקַע
  choice: 铺展……的那一位
  rationale: לְ在本诗的颂赞连祷中指向受颂赞者；רֹקַע表示把某物铺开、展开，也可具体指锤打成片。“铺展”在现代汉语中自然地保留了宽广展开的形象。
- source_word: הָ/אָרֶץ
  choice: 大地
  rationale: 本节处于创造语境，并与“众水”相配，指整个大地而非某一特定地域；“大地”也符合诗歌语体。
- source_word: עַל הַ/מָּיִם
  choice: 在众水之上
  rationale: עַל可表示“在……上”或“在……之上”。“众水”保留מַיִם的诗性宇宙图景，不将其抽象化。
- source_word: כִּי
  choice: 因
  rationale: 引出颂赞的理由，并使反复出现的副歌在中文中简洁、庄重。
- source_word: לְ/עוֹלָם
  choice: 永远长存
  rationale: עוֹלָם表示永久；原文省略系词，中文用“长存”补足自然谓语，同时保留持续不息之意。
- source_word: חַסְדּֽ/וֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有慈爱、忠诚与信实的内涵。“慈爱”是简洁自然且适合反复副歌的中文表达，不把词义仅限于怜悯，也不在正文中过度解释其盟约层面。
theological_decisions:
- issue: 创造的宇宙图景
  choice: 保留“大地在众水之上”的诗性描写
  alternative: 概括为“奠定世界”或按现代科学概念加以解释
  rationale: 原文采用古代希伯来诗歌的宇宙图景。译文保留其具体意象，既不将它抽象化，也不额外作科学化或协调式解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“铺展”比“锤打”更适合正文中的创造语境，同时脚注保留原动词的具体金属加工意象。副歌译作“因他的慈爱永远长存”，便于全诗一致反复。
