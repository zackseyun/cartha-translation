  yaml_path: translation/ot/psalms/136/026.yaml
  text: Give thanks to the God of heaven[a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 你们要称谢天上的上帝，因为他的慈爱[a]永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“信实守约的爱”。希伯来语חֶסֶד含有忠贞、守约之爱的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: 你们要感谢
  rationale: 这是ידה的使役形复数祈使式，向群体发出感谢、称谢的呼召；“你们要感谢”在现代汉语中清楚自然，也保留了复数命令的语气。
- source_word: לְאֵל
  choice: 上帝
  rationale: אֵל在此指上帝，与后面的“天上的”构成称号；译作“上帝”自然庄重，不额外引入“全能者”等原文未明说的含义。
- source_word: הַשָּׁמָיִם
  choice: 天上的
  rationale: שָׁמַיִם形式上为复数，但希伯来语常以此指天空或属天领域；“天上的上帝”是自然的现代汉语称谓。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在副歌中说明感谢上帝的理由；“因为”明确保留因果关系。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文直译近于“直到永远”；本句没有明示系词，汉语用“永远长存”自然表达持续不止的含义。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有仁慈、忠贞和关系中的坚定之爱等内涵；“慈爱”简洁、庄重且适合诗篇语境，脚注补充其忠贞含义。
theological_decisions:
- issue: 诗篇136篇副歌中חֶסֶד的译法
  choice: 他的慈爱永远长存
  alternative: 他信实守约的爱永远长存
  rationale: “慈爱”保留爱的情感和恩慈层面，又不把该词缩窄为单纯的怜悯；脚注指出它也包含忠贞、守约的意味，以保存原词的神学张力而不在正文中过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“你们要”显明复数祈使语气；“天上的上帝”自然表达原文称号。脚注标记紧接相关称谓之后，内容解释本节后半句“慈爱”的词义范围。
