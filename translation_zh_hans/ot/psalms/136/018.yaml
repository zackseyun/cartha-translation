source:
  edition: WLC
  text: וַֽ֭/יַּהֲרֹג מְלָכִ֣ים אַדִּירִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/018.yaml
  text: and killed mighty kings[b][a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '他又杀死强大的君王[a]，

    因他的慈爱[b]永远长存。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有权势的君王”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语“赫塞德”（ḥesed）也可译作“信实之爱”、“怜悯”或“守约的信实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: 他又杀死
  rationale: 该连续叙事形式承接上文，表示过去发生的行动。“杀死”直接传达 הרג 的含义；补出上下文中明确的主语“他”，使现代汉语自然清楚。
- source_word: מְלָכִים
  choice: 君王
  rationale: 准确表达复数“王”，并保持诗篇叙述庄重而通俗的语体。
- source_word: אַדִּירִים
  choice: 强大的
  rationale: 此处形容这些君王势力强盛、令人畏惧；“强大的”比偏重威仪的译法更符合争战语境。
- source_word: כִּי
  choice: 因
  rationale: 引出本诗反复出现的解释性、因果性副歌，也保持简洁的礼仪节奏。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文意为“直到永远”；汉语补出“长存”，自然表达副歌中隐含的持续状态。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: “慈爱”在现代汉语中能够兼顾怜悯、忠贞之爱和关系中的信实，且适合全诗反复吟诵的副歌。
theological_decisions:
- issue: 副歌中 חֶסֶד 的译法
  choice: 他的慈爱永远长存
  alternative: 他的信实之爱永远长存；他的怜悯永远长存
  rationale: חֶסֶד 含有忠贞、恩慈、怜悯等相互交织的意义。“慈爱”不把它局限为单纯情感或仅仅怜悯，并保留本节中审判列王与施行慈爱并置所形成的神学张力。
translation_notes:
  register: 采用自然、庄重且适合诵读的现代标准汉语。两行结构保留诗篇副歌的节奏；“杀死”不弱化原文的暴力行动，“慈爱”则保留 חֶסֶד 丰富而不易由单一汉语词完全涵盖的含义。
