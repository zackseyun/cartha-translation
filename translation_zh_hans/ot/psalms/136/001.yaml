source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 你们要感谢雅威[a]，因为他是良善的；因为他的慈爱[b]永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文יהוה，是上帝的专名；传统译法常作“耶和华”或以“上主”代称。
    reason: alternative_reading
  - marker: b
    text: “慈爱”所译的希伯来词חֶסֶד，也含有忠贞的爱、持守关系的信实和怜悯等意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: 你们要感谢
  rationale: 这是ידה的使役词干复数命令式；在本诗礼仪性的呼召中，译为“你们要感谢”既表达命令语气，也符合现代汉语，且不将含义收窄为单纯的赞美。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 介词ל标明感谢的对象；יהוה是上帝的专名，采用常见的现代汉语音译“雅威”，而不以称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 两处כִּי都引出感谢雅威的理由；重复译作“因为”，保留原文平行、层递的结构。
- source_word: טוֹב
  choice: 良善的
  rationale: טוֹב在此直接陈述雅威的本性。“良善”比一般事物所用的“好”更自然庄重，同时没有把含义限定为仁慈或慷慨。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: לְעוֹלָם表示没有终止的持续时间。结合汉语表达，以“永远长存”自然传达其恒久不变，而不是机械译成“到永远”。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有爱、恩慈、忠贞和关系中的信实等意味。“慈爱”简洁自然，并保留较宽的语义范围；其盟约忠诚层面由脚注说明，避免正文过度释义。
theological_decisions:
- issue: יהוה这一神名的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译为“雅威”保留专名性质；“上主”是称号，“耶和华”则反映较晚形成的混合读音。
- issue: 盟约语境中חֶסֶד的译法
  choice: 慈爱
  alternative: 忠贞之爱；盟约信实；怜悯
  rationale: “慈爱”同时容纳爱与施恩的意味，又不把该词只限定为怜悯或抽象的信实。脚注指出其忠贞、持久和关系性内涵，以保留原词的神学张力。
- issue: לְעוֹלָם חַסְדּוֹ是否补出动词
  choice: 他的慈爱永远长存
  alternative: 他的慈爱直到永远
  rationale: 希伯来文是无明示动词的名词句。汉语补出“长存”可自然表达持续性，却不改变其核心断言；“直到永远”更贴近形式，但现代汉语中略显悬空。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语言。“你们要”明确复数命令语气；分号区分两项彼此相关的理由，并保留原文两次כִּי形成的重复节奏。所有脚注标记均置于相应词语之后。
