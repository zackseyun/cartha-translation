source:
  edition: WLC
  text: וְ/נִ֘עֵ֤ר פַּרְעֹ֣ה וְ/חֵיל֣/וֹ בְ/יַם ס֑וּף כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/015.yaml
  text: and shook off Pharaoh and his army into the Red Sea[a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '他把法老和他的军队抖落在芦苇海中[a]，

    因为他的慈爱永远长存。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“芦苇海”；传统译作“红海”。
    reason: 说明原文名称与传统译名之间的差异。
lexical_decisions:
- source_word: וְנִעֵר
  choice: 抖落
  rationale: נָעַר的具体意象是抖动而使某物脱落、甩落；这里呼应《出埃及记》14:27的表达。“抖落”保留了原文生动的动作意象，比“推翻”更贴近词义。
- source_word: פַּרְעֹה וְחֵילוֹ
  choice: 法老和法老的军队
  rationale: פַּרְעֹה采用现代中文圣经通行译名“法老”；חַיִל在军事语境中指军队。重复“法老”比“他的”更清楚地指明所属，同时保持自然。
- source_word: בְיַם־סוּף
  choice: 在芦苇海中
  rationale: יַם־סוּף按希伯来语构词直译为“芦苇海”。介词ב在此表示动作发生并以海中为落点，译作“在……中”自然且不过度增添方向含义。传统名称“红海”收入脚注。
- source_word: כִּי
  choice: 因为
  rationale: 引出诗篇136篇反复出现的赞美依据；“因为”在现代中文中清楚、自然。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: לְעוֹלָם表示直到永远；中文补出谓语“长存”，使副歌完整自然，并表达持续不止。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有慈爱、恩惠和忠贞不渝之意。“慈爱”是简洁、庄重且广为理解的译法，不把词义限定为某一种神学解释。
theological_decisions:
- issue: יַם־סוּף的译名
  choice: 正文译“芦苇海”
  alternative: 传统译名“红海”
  rationale: 原文优先要求正文直接反映יַם־סוּף的字面构词；“红海”是悠久而熟悉的传统名称，但并非该希伯来短语的字面意义，因此以脚注保存，避免混淆原文与翻译传统。
- issue: חֶסֶד的语义范围
  choice: 慈爱
  alternative: 信实的爱；怜悯；盟约之爱
  rationale: “慈爱”保留爱与恩慈的核心，同时不把本节未明说的盟约维度过度显化；该词所含的忠贞和恒久性也由“永远长存”共同传达。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪诗歌语体。保留原文“抖落”的鲜明意象，并将本篇固定副歌译为“因为他的慈爱永远长存”。
