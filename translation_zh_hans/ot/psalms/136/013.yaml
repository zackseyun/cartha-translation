  yaml_path: translation/ot/psalms/136/013.yaml
  text: to him who divided the Sea of Reeds into parts[a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '把芦苇海分成几部分的那一位[a]，

    因他的慈爱永远长存。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“红海”；希伯来原文直译为“芦苇海”。
    reason: alternative_reading
lexical_decisions:
- source_word: לְ/גֹזֵר
  choice: 把……分成……的那一位
  rationale: 介词 לְ 配合分词，在本诗的颂赞列举中指向受赞美的那一位；גזר 有切开、分开的意思。此处用“分成”既自然，也与后面的复数名词相呼应。
- source_word: יַם סוּף
  choice: 芦苇海
  rationale: 按希伯来语 יַם סוּף 的通常字面意义译为“芦苇海”，保留原文用语；传统译名“红海”列入脚注。
- source_word: לִ/גְזָרִים
  choice: 分成几部分
  rationale: גְזָרִים 指被分隔开的部分。中文用“几部分”表达复数而不武断指定数量，也保留海被分开的图景。
- source_word: כִּי
  choice: 因
  rationale: 在本诗反复出现的副歌中，כִּי 引出赞美的理由；“因”简洁、庄重，并适合诗歌体。
- source_word: לְ/עוֹלָם
  choice: 永远长存
  rationale: 原文是无动词结构，中文补出“长存”，自然表达持续到永远的含义。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד 包含忠贞、持久的恩爱与眷顾；“慈爱”是现代中文圣经语境中自然而庄重的表达，又避免把词义限缩为单纯的怜悯或直接加入“盟约”一词。
