lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: 要称谢那造了……的
  rationale: 介词 לְ 延续本诗反复出现的称谢对象结构；“要称谢”由诗篇136篇的礼仪性句式补出。分词 עֹשֵׂה 在这里指上帝已经完成的创造作为，因此译作“造了”。
- source_word: אוֹרִים גְּדֹלִים
  choice: 大光体
  rationale: אוֹרִים 在此指天上的发光体，与创世记1章的创造叙述相呼应；“大光体”既表达其为光源，也比单译“大光”更清楚地指向天体。
- source_word: כִּי
  choice: 因为
  rationale: 该词引出全诗反复的称颂理由；“因为”在现代汉语中清楚保留其因果和解释作用。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文意为“直到永远”；汉语补出“长存”，自然表达持续不止的含义，并适合反复吟诵的副歌。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד 包含仁慈、忠贞和持久委身等意义。“慈爱”简明、庄重且适合诗歌副歌，同时借脚注提示其忠贞信实的内涵，避免把词义缩窄为单纯情感或法律性盟约概念。
theological_decisions:
- issue: 诗篇136篇副歌中 חֶסֶד 的表达
  choice: 他的慈爱永远长存
  alternative: 他忠贞的爱永远长存；他的盟约信实永远长存
  rationale: “慈爱”保留上帝恩慈之爱的宽广含义；脚注说明其忠贞、信实和持久的层面，既不淡化原词的关系性内涵，也不把原文限定为单一的宗派性盟约术语。
translation_notes:
  register: 采用现代、庄重而便于会众诵读的表达。“要称谢”承接本诗反复的礼仪句式；“因为他的慈爱永远长存”保持副歌的简洁和节奏。
