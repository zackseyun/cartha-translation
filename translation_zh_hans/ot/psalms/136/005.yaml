  text: לְ/עֹשֵׂ֣ה הַ֭/שָּׁמַיִם בִּ/תְבוּנָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/005.yaml
  text: To him who made the heavens with understanding[b][a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '那以睿智创造诸天的[a]，

    因他的慈爱永远长存。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以睿智”也可译作“凭洞察力”或“以理解力”；希伯来语介词可表示方式或凭借。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来语 חֶסֶד 也包含忠贞、守约之爱和怜悯等意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: 那位……创造……的
  rationale: 介词לְ与分词组成诗篇连串的颂赞对象，可译为“那位……的”。此处用“创造”自然表达上帝创造诸天的作为；希伯来语分词本身也可有持续或一般性的意味。
- source_word: הַשָּׁמַיִם
  choice: 诸天
  rationale: שָׁמַיִם在创造语境中指天空、天界或整个天穹。“诸天”保留复数形式和庄重的宇宙性诗歌语域。
- source_word: בִּתְבוּנָה
  choice: 以聪明
  rationale: תְּבוּנָה表示聪明、理解力、洞察或巧思；介词בְּ在此可表示方式或凭借。“以聪明”既贴近原文，也不同于通常对应חָכְמָה的“智慧”。
- source_word: כִּי
  choice: 因
  rationale: כִּי引出颂赞的理由。简洁的“因”适合本诗反复出现的礼仪性副歌。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文直译近于“直到永远”；汉语需补出谓语。“永远长存”自然表达其持续不止的含义。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼含慈爱、恩惠、忠贞和守约可靠等意涵。“慈爱”是自然、庄重且较宽广的中文对应，并由所有格后缀译出“他的”。
theological_decisions:
- issue: 诗篇136篇副歌中חֶסֶד的译法
  choice: 他的慈爱永远长存
  alternative: 他的信实之爱永远长存；他的怜悯永远长存
  rationale: “慈爱”保留原词的爱与恩惠维度，同时不把其意义限定为怜悯；脚注说明它也包含忠贞、守约可靠的意味，以保存原词丰富的神学张力。
- issue: לְעֹשֵׂה分词的时间与体貌
  choice: 那位……创造……的
  alternative: 那位……造……的；那位不断创造……的
  rationale: 上下文颂述上帝的创造作为，中文“创造”无需明确标记过去时，因此既自然指向创世之举，也不强行消除希伯来语分词可能具有的一般性意味。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“诸天”呼应创造语境；两行结构保留本诗颂赞陈述与固定副歌的节奏。所有脚注标记均置于正文相关表达之后。
