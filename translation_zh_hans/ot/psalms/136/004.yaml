id: PSA.136.4
reference: Psalms 136:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְ/עֹ֘שֵׂ֤ה נִפְלָא֣וֹת גְּדֹל֣וֹת לְ/בַדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/004.yaml
  text: to him who alone does great wonders[b][a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 要称谢那独自施行大奇事[a]的，因他的慈爱[b]永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奇事”或译“奇妙的作为”。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”译自希伯来语 hesed；这个词常含忠贞不变的爱、守约的信实之意，也可译作“怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: 要称谢那……施行……的
  rationale: לְ־承接本诗反复出现的“称谢……”句式，分词 עֹשֵׂה 在这里作名词性用法；中文补出承前省略的“要称谢”，使本节单独诵读时也自然清楚。
- source_word: נִפְלָאוֹת
  choice: 奇事
  rationale: 该词指令人惊叹的非凡作为，常用于上帝大能的作为；“奇事”简洁、庄重，也保留其行动含义。
- source_word: גְּדֹלוֹת
  choice: 大
  rationale: 直接修饰“奇事”，保留原文“伟大、重大的”强调，并符合汉语诗歌的凝练表达。
- source_word: לְבַדּוֹ
  choice: 独自
  rationale: 突出唯有他施行这些奇事，也可表达他不依靠别者而行；“独自”保留了原文简洁而略具张力的排他意味。
- source_word: כִּי
  choice: 因
  rationale: 引出称谢的理由，保留副歌中的因果关系，同时适合庄重的礼仪节奏。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文是无显式动词的结构；中文补入“长存”，自然表达持续到永远的含义，也适合全诗反复的副歌。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有恩慈、忠贞和关系中的信实等内涵。“慈爱”是现代中文圣经语体中自然、凝练且覆盖面较广的译法；脚注提示其更丰富的含义。
theological_decisions:
- issue: חַסְדּוֹ לְעוֹלָם副歌的译法
  choice: 因他的慈爱永远长存
  alternative: 因他的怜悯永远长存；因他信实的爱永远长存
  rationale: “慈爱”既不把该词仅限于怜悯，也不在正文中强行加入“圣约”这一语境内涵；“永远长存”则自然补足原文省略的系词，保留持续性和礼仪性的节奏。
- issue: לְבַדּוֹ所表达的排他性
  choice: 独自施行
  alternative: 唯有他施行；他独力施行
  rationale: “独自”可同时保留“唯有他能行”与“不借助他者而行”的可能侧重，不把原文的简洁表达过度限定为其中一种解释。
translation_notes:
  register: 采用现代、庄重而适合会众诵读的普通话。以“要称谢”补明本节承接上文的句法关系；副歌保持简洁、稳定，便于在全诗中反复。
