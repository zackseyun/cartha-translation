  text: an inheritance to Israel his servant[b][a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '作他仆人以色列的产业[a]；

    因他的慈爱[b]永远长存。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基业”或“产业地”；也可指“所有物”。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来词常指忠贞、守约的爱；也可译作“信实之爱”或“怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  choice: 产业
  rationale: 该词指承受或分得的地产、基业；本节承接上文所说赐下列王之地，“产业”既贴合土地语境，也保留承受所得之物的含义。
- source_word: לְיִשְׂרָאֵל
  choice: 以色列的
  rationale: 介词 לְ 标示产业的领受者或归属者；结合汉语名词结构，译作“以色列的产业”自然表达“给以色列作产业”。
- source_word: עַבְדּוֹ
  choice: 他仆人
  rationale: 这里是以色列与上帝之间关系的称号，重点在归属与事奉，而非突出受奴役的社会身份。
- source_word: כִּי
  choice: 因
  rationale: 引出诗篇反复出现的赞美理由；“因”简洁庄重，适合反复句的礼仪和诗歌语气。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 表达无尽的持续性；与“慈爱”连用译为“永远长存”，符合现代汉语习惯。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד 包含仁慈、忠诚和守约不变的爱；“慈爱”是自然而庄重的中文表达，脚注补明其忠贞守约的内涵。
theological_decisions:
- issue: עַבְדּוֹ 所表达的以色列与上帝之关系
  choice: 他仆人
  alternative: 他的奴仆
  rationale: 经文把以色列称为属上帝并事奉上帝的群体，并未着重描写受强制奴役的身份；“仆人”更符合此处的圣约称谓。
- issue: חַסְדּוֹ 的翻译
  choice: 他的慈爱
  alternative: 他的信实之爱／他的怜悯
  rationale: “慈爱”兼顾爱与恩慈，并以脚注说明该词常包含忠贞、守约的意味，避免把它缩减为单纯情感或怜悯。
- issue: 本节与上节的句法衔接
  choice: 保留“作为……”的承接结构
  alternative: 补译“赐给……作产业”
  rationale: 希伯来文本本节没有另立“赐给”这一动词，而是以“产业”承接上文；保留承接式短语可避免无标记地增添动词，同时在中文中仍可理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体；分行呈现本节内容与全诗反复出现的副歌。首行刻意保留对上文的承接关系，不把本节改写成完全独立的句子。
