id: PSA.136.14
reference: Psalms 136:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הֶעֱבִ֣יר יִשְׂרָאֵ֣ל בְּ/תוֹכ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/014.yaml
  text: and brought Israel through the midst of it[b][a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 又使以色列从其中经过[a]，因他的慈爱[b]永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又带领以色列从其中经过。”原文动词是使役形式，直译为“使以色列经过”。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来语也可按语境译为“信实之爱”“守约的信实”或“怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֶעֱבִיר
  choice: 又使……经过
  rationale: הֶעֱבִיר是עבר的使役形，表示“使……经过”。“又”承接上节连续叙述，既保留使役意义，也符合现代汉语表达。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代汉语中通行的专名译法。
- source_word: בְּ/תוֹכ֑/וֹ
  choice: 从其中
  rationale: 字面义为“在其内部／当中”；结合移动动词，译作“从其中经过”自然地表达穿越之意，并保留阳性单数代词对上节之海的回指。
- source_word: כִּי
  choice: 因
  rationale: 在诗篇136篇的反复句中引出赞美的理由；“因”简洁、庄重，适合礼仪性诗歌。
- source_word: לְ/עוֹלָם
  choice: 永远长存
  rationale: 原文为无动词句，汉语补出“长存”，自然表达持续到永远的含义。
- source_word: חַסְדּֽ/וֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有仁慈、忠贞和守约之爱的内涵。“慈爱”是简明自然的现代汉语表达，同时以脚注保留其语义幅度。
theological_decisions:
- issue: 诗篇136篇反复句中חֶסֶד的译法
  choice: 他的慈爱永远长存
  alternative: 他的信实之爱永远长存／他的怜悯永远长存
  rationale: “慈爱”能自然表达上帝在拯救行动中显出的仁爱；脚注说明其也可强调忠于圣约或怜悯，避免把该词的丰富含义限定为单一神学解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“又”延续诗篇的排比叙述；“从其中经过”保留原文空间意象；反复句保持简洁、可诵读的节奏。
