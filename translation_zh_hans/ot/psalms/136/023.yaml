  yaml_path: translation/ot/psalms/136/023.yaml
  text: who remembered us in our low estate[b][a], for his steadfast love is forever.
translation:
  language: zh_hans
  text: '他在我们卑微的境况中记念我们，[a]

    因他的慈爱永远长存。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在我们卑微的境况中记念我们”也可译作“在我们低微之时记念我们”或“在我们受屈辱时记念我们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבְּשִׁפְלֵנוּ
  choice: 他在我们卑微的时候
  rationale: 该表达由关系词、介词和表示低微处境的名词构成，指“在我们卑微、受压或降卑的处境中”。“卑微的时候”自然易懂，同时不把含义限定为社会羞辱、患难或软弱中的任何一种。
- source_word: זָכַר לָנוּ
  choice: 顾念我们
  rationale: זכר的基本义是“记得”，但与人的对象连用时常含记念并施以关顾之意。中文“顾念”既保留记念的意味，也符合此处颂赞上帝施恩行动的语境；脚注保留较直译的“记念我们”。
- source_word: כִּי
  choice: 因
  rationale: 这里引出诗篇136篇反复出现的因由性副歌；“因”简洁庄重，并自然连接上帝的作为与他恒久的慈爱。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文直译为“直到永远”，且没有明写动词。中文需补足自然谓语；“永远长存”准确表达持续不止的意义。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חסד兼有恩慈、忠贞和信实之爱的内涵。“慈爱”是现代中文圣经语体中自然、庄重且涵盖面较广的对应词，不把它窄化为单纯怜悯或专门术语。
theological_decisions:
- issue: זכר在此是否明确译出伴随的施恩行动
  choice: 顾念我们
  alternative: 记念我们
  rationale: 原词本身是“记得、记念”，在此语境中可暗含上帝关注并采取行动。“顾念”以自然中文表达这种语用内涵，但没有扩写具体如何拯救；较形式对应的译法列入脚注。
- issue: 诗篇136篇副歌 כִּי לְעוֹלָם חַסְדּוֹ 的表达
  choice: 因他的慈爱永远长存
  alternative: 因为他的慈爱直到永远
  rationale: 原文强调上帝חסד的永久性。“永远长存”是中文中自然的补动词表达；没有将חסד限定为某一教派性的“盟约之爱”解释。
translation_notes:
  register: 采用现代、庄重而适合礼仪反复诵读的中文。“卑微的时候”保留原文所指低下处境的宽度；“因他的慈爱永远长存”保持全诗副歌的简洁与节奏。
