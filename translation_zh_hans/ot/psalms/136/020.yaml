  text: וּ֭/לְ/עוֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/020.yaml
  text: and Og king of Bashan[a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '又击杀巴珊王噩，

    因他的慈爱永远长存。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְעוֹג
  choice: 又把……噩交出
  rationale: וְ承接前行的列举，译为“又”；לְ在此延续上文动词“交出”的支配关系。原文省略动词，中文补出“把……交出”，使承接关系自然清楚。
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: 巴珊王
  rationale: מֶלֶךְ与地名构成“巴珊的王”之意；现代中文以“巴珊王”简洁自然。
- source_word: עוֹג
  choice: 噩
  rationale: 采用该圣经人名在现代中文中的通行译名。
- source_word: כִּי
  choice: 因
  rationale: 引出诗篇136篇反复出现的赞美理由；“因”兼具礼仪节奏与解释作用。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: לְעוֹלָם表示直到永远；与名词性短语חַסְדּוֹ合译时补出“长存”，符合自然中文并保留持续不息之意。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד包含忠贞、恩慈和关系中的信实。“慈爱”是简明庄重的通行译法，且不把含义收窄为单纯的怜悯；后缀־וֹ译为“他的”。
theological_decisions:
- issue: 诗篇136篇副歌中חֶסֶד的译法
  choice: 慈爱
  alternative: 信实之爱；忠贞的爱；怜悯
  rationale: “慈爱”在现代中文中自然且有圣经语体的庄重感，能兼顾恩慈与持久之爱；同时避免用“圣约之爱”把原词在本节未明说的神学关系完全显化。
- issue: 补出上一节所支配的动词
  choice: 交出
  alternative: 不补动词，译作“又有巴珊王噩”或“又给巴珊王噩”
  rationale: 本节希伯来文是接续前文的省略结构，לְעוֹג承接上一节动词的对象关系。补出“交出”可在中文中准确恢复句法联系，并保留神把敌王交在以色列人手中的含义。
translation_notes:
  register: 采用现代、庄重而适合诵读的中文。分行呈现本节陈述与固定副歌，以保持诗歌礼仪节奏；“又……因……”对应原文连续列举和反复回应的结构。
