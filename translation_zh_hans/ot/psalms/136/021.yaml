source:
  edition: WLC
  text: וְ/נָתַ֣ן אַרְצָ֣/ם לְ/נַחֲלָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/021.yaml
  text: and gave their land as an inheritance[b][a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 又把他们的土地赐作产业[a]，因他的慈爱永远长存。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业”指经分配而承受、持有的土地，也可译作“承受的产业”。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来语也含忠贞、信实相待的意味；也可译作“忠贞之爱”或“信实慈爱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: 又把……赐作
  rationale: וְ连接前文连续列举的作为；נתן是Qal完成时第三人称阳性单数。结合本诗反复铺陈上帝作为的结构，译作“又……赐”自然地承接上文。
- source_word: אַרְצָם
  choice: 他们的土地
  rationale: אֶרֶץ带第三人称阳性复数后缀，语境中指此前被击败的诸王或民族之地；“土地”比现代政治意味较强的“国家”更贴近原文。
- source_word: לְנַחֲלָה
  choice: 作产业
  rationale: נַחֲלָה指经分配而承受、长期持有的产业，尤其常用于土地。现代中文“作产业”简洁自然，并保留分地承受的含义；脚注补明“承受的产业”的意味。
- source_word: כִּי
  choice: 因
  rationale: 本诗叠句中的כִּי引出赞美的理由。“因”兼顾因果关系与诗歌节奏。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: לְעוֹלָם本义为“永远”；与חַסְדּוֹ搭配时，中文补出“长存”可自然表达其恒久不止。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有恩慈、忠贞和信实相待的意味。“慈爱”是庄重而易懂的现代中文表达，避免把词义收窄为单纯“怜悯”；脚注提示其忠贞不变的内涵。
theological_decisions:
- issue: 诗篇136篇叠句中חֶסֶד的译法
  choice: 他的慈爱永远长存
  alternative: 他的忠贞之爱永远长存；他的信实慈爱永远长存；他的怜悯永远长存
  rationale: 原词在此既表现上帝的恩慈，也带有忠贞、信实相待的意味。“慈爱”适合反复吟诵且为普通读者所懂；用脚注保留其较丰富的语义，避免在正文中以解释性较强的措辞单方面限定为专门的盟约术语。
translation_notes:
  register: 采用现代、庄重、适合诗歌诵读的简体中文。“又”承接前文连续列举的神圣作为；叠句保持简洁和节奏感。所有脚注标记均置于相应正文之后。
