  text: בְּ/יָ֣ד חֲ֭זָקָה וּ/בִ/זְר֣וֹעַ נְטוּיָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/012.yaml
  text: with a strong hand and an outstretched arm[b][a], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '以大能的手和伸出的膀臂；

    因他的慈爱永远长存。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “慈爱”所译的希伯来语 חֶסֶד，也可表达坚定忠诚的爱、盟约中的忠诚或怜悯。
    reason: 说明该核心词汇包含恩慈、忠诚和盟约关系等语义，不将其限定为单一含义。
lexical_decisions:
- source_word: בְּיָד חֲזָקָה
  choice: 以大能的手
  rationale: 介词 בְּ 表示凭借的手段；“大能的手”自然保留希伯来语的具体意象，也符合出埃及传统中的惯用表达。
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: 和伸出的膀臂
  rationale: 保留“膀臂”的身体意象及其与出埃及叙事的互文联系；“伸出的”直接反映被动分词 נְטוּיָה 所描写的动作状态。
- source_word: כִּי
  choice: 因
  rationale: 在本诗反复出现的副歌中引出赞美的根据；“因”简洁、庄重，并保留礼仪性节奏。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文直译为“直到永远”；汉语需要补出谓语，“永远长存”自然表达持续不止的含义。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד 涵盖仁慈、忠诚及关系中的持守。“慈爱”是现代中文圣经语境中简明而宽广的对应词，不将其局限为单纯怜悯或抽象契约忠诚。
theological_decisions:
- issue: 诗篇136篇副歌中 חֶסֶד 的译法
  choice: 他的慈爱永远长存
  alternative: 他的信实之爱永远长存；他的怜悯永远长存；他的盟约忠诚永远长存
  rationale: “慈爱”兼顾恩慈与关爱，也能在上下文中承载上帝对其子民持久忠诚的意涵；其他译法或较明确突出忠诚，或将词义收窄为怜悯。脚注保留其丰富语义。
- issue: 补出本节首行隐含的谓语
  choice: 施行这一切
  alternative: 不补谓语，译作“以大能的手和伸出的膀臂”
  rationale: 希伯来诗句承接上一节“领以色列从他们中间出来”，本节仅补充方式。单节中文若完全不补谓语会成为悬置短语；“施行这一切”使其可独立诵读，同时避免把动作过度限定为某一个事件。
translation_notes:
  register: 采用现代、庄重而易于诵读的诗歌语体。“膀臂”较“手臂”略具经文庄重感，并保留传统出埃及措辞；两行结构凸显诗篇136篇固定副歌。所有脚注标记均置于正文对应位置。
