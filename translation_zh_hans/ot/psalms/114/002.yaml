  text: Judah became his sanctuary[c][b][a], Israel his dominion.
translation:
  language: zh_hans
  text: '犹大成了他的圣所[a][b]；

    以色列成了他的统治权[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大是他的圣所。”希伯来语动词既可表达静态的“是”，也可表达事件性的“成为”。
    reason: lexical_alternative
  - marker: b
    text: “圣所”也可译作“圣地”或“他的圣洁领域”。原词既可指圣洁，也可指神圣的地方；此处具体意义与下句较为相称。
    reason: lexical_alternative
  - marker: c
    text: “他的统治权”也可译作“他的管辖之地”或“他的统治”。希伯来语名词在形式上是复数，但这里可能表达抽象或延展的意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: 成了
  rationale: 这里处于回顾出埃及事件的诗歌叙述中，“成了”自然表达历史进程所带来的转变或结果；希伯来语也可作静态的“是”。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用该支派及地域名称的现代汉语标准译名。
- source_word: לְקָדְשׁוֹ
  choice: 他的圣所
  rationale: קֹדֶשׁ既可指“圣洁”，也可具体指分别为圣之处；此处与下句“统治的疆域”平行，“圣所”较贴合具体空间意义，同时保留敬拜方面的内涵。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用该民族名称的现代汉语标准译名，并与“犹大”分别保留，以呈现原文的诗歌平行结构。
- source_word: מַמְשְׁלוֹתָיו
  choice: 他统治的疆域
  rationale: 该词可表示统治、管辖权或受统治的领域。原文虽为复数形式，此处很可能表达抽象或延展意义；译作“他统治的疆域”既自然，也保留“统治”与“领域”两层含义。
theological_decisions:
- issue: 两个第三人称阳性单数后缀所指为何
  choice: 用“他的”表达，按全诗语境指向上帝，但本节不补出“耶和华”或“上帝”
  alternative: 直接译成“耶和华的圣所”和“耶和华统治的疆域”
  rationale: 原文以后缀含蓄指称其对象；汉语需要所有格表达。“他的”既忠实呈现形式，也不在本节加入原文没有明说的称谓。
- issue: “犹大／以色列”这一平行组合
  choice: 分别保留两个名称
  alternative: 把二者合并或解释为同一个集体称谓
  rationale: 原文有意形成诗歌平行，不宜通过合并名称或改译为“圣民／国度”等方式加入后来的历史或神学解释。
- issue: מַמְשְׁלוֹתָיו的复数形式
  choice: 按抽象或延展意义译为单一的“统治的疆域”
  alternative: 译为“他的诸国”或“他的各个统治领域”
  rationale: 上下文描写以色列整体成为上帝掌权的领域；机械保留复数会在汉语中暗示多个国家或政权，可能过度具体化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并以分行保留诗歌平行。“成了”呈现叙事中的转变；第二行补出“成了”使汉语读来完整，也清楚显示两行共享同一谓语。“他统治的疆域”比单说“他的疆域”更明确保留原词的掌权含义。
