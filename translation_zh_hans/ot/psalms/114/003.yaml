  text: The sea saw and fled[b][a]; the Jordan turned back.
translation:
  language: zh_hans
  text: 海看见了，便逃走[b]；约旦河向后退去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“转向后方。”希伯来语直译为“转向后面／向后转”。
    reason: lexical_alternative
  - marker: b
    text: 本节以诗歌语言暗指出埃及时海水分开，以及约书亚时代约旦河水停住的事件。
    reason: cross_reference
lexical_decisions:
- source_word: הַיָּם
  choice: 海
  rationale: 定指名词，意为“海”。希伯来文本未在本节明说“红海”，因此正文不将其具体化。
- source_word: רָאָה
  choice: 看见
  rationale: 采用常用义“看见”，并保留海被人格化的诗歌表达；原文未说明所看见的对象，译文也不补出。
- source_word: וַיָּנֹס
  choice: 就逃走了
  rationale: נוּס意为“逃走、逃跑”；此处用“逃走”简洁而生动地表现海的退避，并以“就”自然连接所见与反应。
- source_word: הַיַּרְדֵּן
  choice: 约旦河
  rationale: 指约旦河；现代汉语通常以“约旦河”称呼该河流，比单称“约旦”清楚自然。
- source_word: יִסֹּב לְאָחוֹר
  choice: 倒流
  rationale: 该组合直译为“转向后面／向后转”。在描写河水时，“倒流”是自然凝练的汉语表达，但脚注保留较贴近字面的译法。
theological_decisions:
- issue: 历史事件的诗意暗指
  choice: 正文保留海与约旦河的人格化描写，不明说出埃及过海及约书亚时代过约旦河的事件。
  alternative: 在正文补明“红海”或说明两次过水事件。
  rationale: 希伯来诗句通过受造界的反应暗指这些历史事件，却未在本节直接点明；不在正文补充可避免过度解释。
- issue: “看见”的宾语
  choice: 不补出宾语。
  alternative: 译为“海看见他／这事，就逃走了”。
  rationale: 原文רָאָה在本句中没有明示宾语；保留省略可维持诗篇上下文所形成的悬念和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“海一看见就逃走了”保留鲜明的人格化；“约旦河倒流”符合普通读者对河水反向退去的自然理解。脚注标记均置于相应正文之后。
