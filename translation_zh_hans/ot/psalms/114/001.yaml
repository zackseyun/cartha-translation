  text: בְּ/צֵ֣את יִ֭שְׂרָאֵל מִ/מִּצְרָ֑יִם בֵּ֥ית יַ֝עֲקֹ֗ב מֵ/עַ֥ם לֹעֵֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/001.yaml
  text: When Israel went out from Egypt[a], the house of Jacob from a people of strange speech,
translation:
  language: zh_hans
  text: '以色列出埃及的时候，

    雅各家离开说外语的民；[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离开说陌生语言的民。”希伯来语形容埃及人所说的语言对以色列人而言是外来的或难以理解的。
    reason: “说外语的民”表达主要词义；脚注保留该词也可指语言陌生、难懂的语义幅度。
lexical_decisions:
- source_word: בְּ/צֵאת
  choice: ……出……的时候
  rationale: 介词 בְּ 加动词不定式构成时间从句；译为“……的时候”符合现代汉语，也保留原文的时间关系。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文圣经语境中通行的民族及盟约群体名称。
- source_word: מִ/מִּצְרָיִם
  choice: 出埃及
  rationale: מן 表示离开或来源；与 יצא 合译为“出埃及”简洁自然，并清楚表达离境。
- source_word: בֵּית יַעֲקֹב
  choice: 雅各家
  rationale: 保留希伯来语以“家”指雅各后裔整体的诗歌性称谓，并与上行“以色列”构成平行。
- source_word: מֵ/עַם
  choice: 离开……的民
  rationale: מן 表示分离；补出承接上行的动作“离开”，使汉语清楚，同时维持两行的平行关系。
- source_word: לֹעֵז
  choice: 说异族语言的
  rationale: 该词指言语对以色列人而言陌生、难懂，即说外族语言；“异族语言”兼顾语言差异及以色列视角，避免译成带贬义的称呼。
theological_decisions:
- issue: 两行诗句的关系
  choice: 将第二行译作与第一行同义平行的重述：“雅各家”对应“以色列”，“说异族语言的民”对应“埃及”。
  alternative: 把第二行仅视为同位说明，并完全保留原文谓语省略。
  rationale: 希伯来诗歌常用同义平行。中文补出“离开”可清楚呈现原文隐含的动作，却不改变第二行作为出埃及事件重述的意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并以分行呈现希伯来诗歌的平行结构。“雅各家”保留传统而易懂的群体称谓；分号显示本节句意尚承接下文。
