  yaml_path: translation/ot/psalms/114/005.yaml
  text: What is with you[a], O sea, that you flee—O Jordan, that you turn back?
translation:
  language: zh_hans
  text: 大海啊，你怎么了[a]，竟然逃跑？约旦河啊，竟然倒流？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处的惯用问法按词形可近似理解为“什么与你有关？”，意思是“你怎么了？”或“你有什么事？”，表达惊讶式的直接发问。也可译作“大海啊，你为何逃跑？”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לְּךָ
  choice: 你怎么了
  rationale: 保留希伯来语“你有什么／你怎么了”这一惊讶质问的直接称呼，比单译“为何”更能传达诗句的拟人色彩，同时符合现代汉语表达。
- source_word: הַיָּם
  choice: 大海啊
  rationale: הַיָּם意为“海”；本句直接向海发问，用“大海啊”自然体现呼语和庄严的诗歌语气。
- source_word: כִּי
  choice: 竟然
  rationale: 这里引出质问的内容；在“你怎么了”之后用“竟然”能自然表达惊异，而不把它误解为单纯的因果关系。
- source_word: תָנוּס
  choice: 逃跑
  rationale: נוּס的基本意义是“逃走、逃跑”；直译可保留把大海人格化的鲜明形象。
- source_word: הַיַּרְדֵּן
  choice: 约旦河啊
  rationale: 这是约旦河的专名；加“啊”体现与前半句平行的直接呼告。
- source_word: תִּסֹּב לְאָחוֹר
  choice: 倒流
  rationale: 该短语意为“转向后方、退回”；用于河流时，“倒流”是自然、简洁且形象准确的现代汉语表达。
theological_decisions: []
