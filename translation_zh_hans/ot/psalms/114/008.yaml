  yaml_path: translation/ot/psalms/114/008.yaml
  text: who turned the rock into a pool of water[a], the flint into a spring of water.
translation:
  language: zh_hans
  text: 他曾使磐石变成水池[a]，使燧石变成水泉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使磐石变成水池”；希伯来文用的是分词，也可按其形式译为“使……变成的”或“使……变成”。本诗追述神在旷野中的作为，所以正文译作“曾使”。
    reason: 词法与时态上的另一种译法
lexical_decisions:
- source_word: הַהֹפְכִי
  choice: 他曾使……变成
  rationale: 这是使役词干的分词，承接上一节所说的“雅各的神”。“曾”符合全诗追述旷野中神作为的语境；“使……变成”准确表达使役和结果，同时不重复补出“神”这一称谓。
- source_word: הַצּוּר
  choice: 磐石
  rationale: צוּר指岩石或巨大岩体。“磐石”自然、庄重，也符合旷野出水的诗歌意象。
- source_word: אֲגַם מָיִם
  choice: 水池
  rationale: אֲגַם指一片静止、汇聚的水；“水池”简明自然，并保留岩石变为蓄水之处的形象。
- source_word: חַלָּמִישׁ
  choice: 燧石
  rationale: חַלָּמִישׁ指燧石或极坚硬的岩石。“燧石”保留原文具体而鲜明的坚硬质感，突显这一作为的非凡。
- source_word: לְמַעְיְנוֹ מָיִם
  choice: 变成水泉
  rationale: 介词לְ在这里表示变化的结果，מַעְיָן指泉或泉源。“水泉”与前句“水池”形成简洁的诗歌平行，也反映原文再次出现“水”。
theological_decisions:
- issue: 分词所承接的神圣主语
  choice: 用“他”承接上一节，不再次明说“神”
  alternative: 译作“那位使磐石变成水池、使燧石变成水泉的”
  rationale: 希伯来文以带冠词的分词继续描述上一节的“雅各的神”。汉语用“他”能自然承接该主语，又避免把原文没有重复的称谓补入本节。
- issue: 分词的时间意味
  choice: 按诗篇追述神过去作为的语境译为“曾使”
  alternative: 译为一般性或持续性的“使”
  rationale: 分词本身不把时间限定为过去；然而本诗整体回顾出埃及及旷野事件，因此“曾使”在汉语中最合语境，同时以脚注保留一般性表达的可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“磐石—燧石”和“水池—水泉”保持两行意象的对应；正文以“他”自然承接上一节，适合连续诵读。
