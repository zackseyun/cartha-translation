  text: O mountains[a], why do you skip like rams, O hills[b], like lambs of the flock?
translation:
  language: zh_hans
  text: '群山啊，你们为何像公羊跳跃？[a]

    丘陵啊，你们为何像羊群中的羔羊跳跃？[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跳跃”也可译作“舞动”或“蹦跳”；这里采用“跳跃”，以配合公羊和羔羊的比喻。
    reason: lexical_alternative
  - marker: b
    text: “羊群中的羔羊”原文直译为“羊群之子”，是指幼羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָרִים
  choice: 群山哪
  rationale: הָרִים意为“群山”。本节延续上一节的问话和直接呼语，用“哪”自然表达诗歌中的呼告语气。
- source_word: תִּרְקְדוּ
  choice: 跳跃
  rationale: רקד可指跳跃、蹦跳或舞动；此处以公绵羊和羔羊作比，“跳跃”最贴合动物轻捷跃动的意象，同时保留诗句的生动感。
- source_word: כְאֵילִים
  choice: 像公绵羊一样
  rationale: אֵילִים在此最直接指公绵羊，与下半句的羊群和羔羊意象相互呼应。
- source_word: גְּבָעוֹת
  choice: 丘陵哪
  rationale: גְּבָעוֹת意为“丘陵、小山”；“丘陵”与“群山”形成自然、庄重的诗歌平行。
- source_word: כִּבְנֵי צֹאן
  choice: 像羊群中的羔羊一样
  rationale: 字面为“像羊群之子”，是指幼羊的希伯来语表达。“羊群中的羔羊”既传达实际含义，也保留צֹאן所表达的羊群意象。
