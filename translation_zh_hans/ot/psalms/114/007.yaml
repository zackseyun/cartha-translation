base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/007.yaml
  text: Tremble[a], O earth, before the Lord, before the God of Jacob,
translation:
  language: zh_hans
  text: 大地啊，要在主面前、在雅各的上帝面前震颤[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“剧烈扭动”。希伯来语动词可描绘剧烈扭动或震动。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלִּפְנֵי
  choice: 在……面前
  rationale: 原词组表示“从／在……面前（或临在中）”；此处译作“在……面前”，自然表达大地因面对上帝而震颤。
- source_word: אָדוֹן
  choice: 主
  rationale: 该词意为“主、主人”，此处指以色列的上帝；原文不是神名 יהוה，因此译作“主”，不译作对应神名的特殊形式。
- source_word: חוּלִי
  choice: 震颤
  rationale: 这是阴性单数命令式，与阴性名词“地”呼应；词义可指震颤、翻腾或剧烈扭动。“震颤”既符合对大地的诗性召唤，也保留强烈震动之意。
- source_word: אָרֶץ
  choice: 大地啊
  rationale: 该词可指“地、土地”；本诗描写海、约旦河和群山等受造界，故用范围较广的“大地”，并以“啊”体现直接呼告。
- source_word: אֱלוֹהַּ יַעֲקֹב
  choice: 雅各的上帝
  rationale: 按原文所属结构直译，表明这位上帝与雅各的关系；“上帝”是现代普通话中自然、庄重的称谓。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 区分 אָדוֹן 与神名 יהוה
  choice: 主
  alternative: 耶和华
  rationale: 本节使用的是称号 אָדוֹן，而不是神名 יהוה；译作“主”既忠于原文字词，也不将神名形式擅自带入。
- issue: 第二个 מִלִּפְנֵי 是否补出谓语
  choice: 重复“震颤”
  alternative: 只译“在雅各的上帝面前”
  rationale: 希伯来诗句的第二个介词短语与第一个平行，共同修饰同一命令。中文补出谓语可使平行结构清楚、朗读自然，并不改变命令只出现一次的语义事实。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“大地啊”保留呼告语气；两个“在……面前”形成平行，并重复“震颤”以符合自然中文节奏。
