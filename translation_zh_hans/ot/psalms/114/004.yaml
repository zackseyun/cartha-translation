base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/004.yaml
  text: The mountains skipped like rams[a], the hills like lambs of the flock.
translation:
  language: zh_hans
  text: '群山跳跃，如同公羊；

    丘陵跳跃，如同羊群中的羔羊。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“羊群之子”，即幼羊或羔羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: 群山
  rationale: 原文带定冠词，指场景中的群山；汉语用“群山”自然、凝练，也适合诗歌语体。
- source_word: רָקְדוּ
  choice: 跳跃
  rationale: 该动词可表示舞动或活泼跃动；结合公羊和羔羊的比喻，“跳跃”最自然地呈现山岭被拟人化的动态意象。
- source_word: כְאֵילִים
  choice: 如同公羊
  rationale: אֵילִים在此最自然地指公羊，并与下一分句的羊群意象相呼应。
- source_word: גְּבָעוֹת
  choice: 丘陵
  rationale: 准确表达较低的山地，并与“群山”构成平行诗句。
- source_word: כִּבְנֵי צֹאן
  choice: 如同羊群中的羔羊
  rationale: 原文字面为“羊群之子”，是指幼羊的表达；译作“羊群中的羔羊”既清楚自然，也尽量保留其群体关系和诗意。
