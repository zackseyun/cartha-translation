  text: מִ/קֹּל֨וֹת מַ֤יִם רַבִּ֗ים אַדִּירִ֣ים מִשְׁבְּרֵי יָ֑ם אַדִּ֖יר בַּ/מָּר֣וֹם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/004.yaml
  text: More majestic than the sound of many waters[a], than the mighty breakers of the sea[b], is Yahweh on high.
translation:
  language: zh_hans
  text: 胜过众水的轰鸣，胜过海上强劲的浪涛；雅威在高处更有威严。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֹּלוֹת
  choice: 胜过……的轰鸣
  rationale: מִן在此最自然地表达比较，קוֹלוֹת指众水发出的声音；“轰鸣”既符合水势语境，也保留听觉意象。
- source_word: מַיִם רַבִּים
  choice: 众水
  rationale: 保留希伯来诗歌中表示浩大、强劲水域的常见表达，同时使现代汉语简洁自然。
- source_word: אַדִּירִים מִשְׁבְּרֵי־יָם
  choice: 海中汹涌的巨浪
  rationale: אַדִּירִים表达强大、雄伟，מִשְׁבְּרֵי־יָם指海上的碎浪或巨浪；“汹涌的巨浪”传达其力量与壮阔。
- source_word: אַדִּיר
  choice: 更有威严
  rationale: 此词兼有强大、尊贵和雄伟之意；“威严”适合本诗的君王登临语境，而“更”明确承接前面的比较结构。
- source_word: בַּמָּרוֹם
  choice: 居于高处
  rationale: 保留空间上的崇高及超越意味，不把原文进一步限定为“在天上”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见形式音译四字神名，保留其作为以色列之神专名的性质，不以称号代替。
theological_decisions:
- issue: 开头מִן所形成的句法关系
  choice: 将全句理解为比较：雅威的威严胜过众水与海浪
  alternative: 把前半句理解为对众水和海浪之强大的独立描写，再宣告雅威在高处大有威严
  rationale: 句首מִן与末句的谓语形容词אַדִּיר自然形成比较结构，突出雅威胜过海水力量；但希伯来诗句高度凝练，另一种断句仍值得在脚注中保留。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名，正文采用音译以区别于一般称号；不借此加入经文未明说的教派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以“轰鸣—汹涌—威严”形成诗性递进；保留原文从浩大水势转向高处神圣威严的意象，不额外引入混沌神话等解释。
