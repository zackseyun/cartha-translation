  rationale: 将“海中”改为“海上”，以更准确自然地表达“海的碎浪”；将“居于高处的”调整为“在高处”，并删除削弱重复比较介词的替代译法脚注。修订保留原文的诗歌比较结构、神名和崇高语体。
