  yaml_path: translation/ot/psalms/093/003.yaml
  text: The rivers have lifted up[a], O Yahweh; the rivers have lifted up their voice[b]; the rivers lift up their pounding waves.
translation:
  language: zh_hans
  text: '江河[a]已经高涨，耶和华啊；

    江河已经扬起它们的声音；

    江河正扬起它们的轰鸣[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “江河”也可译作“洪流”。希伯来词通常指河流；在此诗的汹涌水势语境中，也可带有洪流的意象。
    reason: lexical_alternative
  - marker: b
    text: 这个希伯来词很少见，指水的猛烈拍击或轰鸣；也可理解为“碎浪”或浪涛的冲击。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשְׂאוּ / יִשְׂאוּ
  choice: 已经涨起／已经扬起／还要掀起
  rationale: נשׂא的基本义是“举起、抬起、扬起”。首句以“涨起”表达水势上升，使现代汉语自然；第二句保留“扬起声音”的拟人意象；末句以“掀起”与浪涛搭配。前两处完成式译为“已经”，末处未完成式译为“还要”，呈现诗句由既成景象走向持续或将临高潮的推进，同时不把它硬性限定为单纯将来时。
- source_word: נְהָרוֹת
  choice: 江河
  rationale: 该词通常指河流。“江河”在现代汉语中既自然又有诗体庄重感，并保留复数或集合性的广阔画面；“洪流”虽契合混沌水势，却不是最直接的词义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名，在直接呼语中译作“耶和华啊”，以专名而非称号表达原文。
- source_word: קוֹלָם
  choice: 它们的声音
  rationale: קוֹל可指声音、声响或嗓音。“它们的声音”保留江河仿佛会发声的拟人手法，也忠实表达第三人称复数后缀。
- source_word: דָּכְיָם
  choice: 澎湃的浪涛
  rationale: 这是罕见词，语境中指水浪拍击、冲撞或轰鸣的力量。“澎湃的浪涛”在现代汉语中清楚呈现水势及其冲击感，同时在脚注中保留“拍击声／轰鸣”的另一种理解。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华啊
  alternative: 雅威啊
  rationale: 原文直接使用四字神名，并在本节中构成呼语。中文采用广为人知的专名“耶和华”，不以“主”替代，从而保留神名与称号的区别；“雅威”是另一种可能的音译。
- issue: 末行未完成式 יִשְׂאוּ 的时态体貌
  choice: 还要掀起
  alternative: 正掀起／掀起
  rationale: 希伯来诗歌中的未完成式可以表达持续、反复、将临或生动展开的动作。“还要”体现相对于前两行完成式的推进，但不主张这里只能理解为时间上的未来。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。三行重复“江河”，保留原文的排比和递进；第二行保留拟人化的“声音”。首行用“涨起”避免汉语中无宾语的“扬起”显得残缺，末行用“掀起”与“浪涛”自然搭配。
