  edition: WLC
  text: עֵֽדֹתֶ֨י/ךָ נֶאֶמְנ֬וּ מְאֹ֗ד לְ/בֵיתְ/ךָ֥ נַאֲוָה קֹ֑דֶשׁ יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/005.yaml
  text: Your testimonies are very trustworthy[a]; holiness befits your house, O Yahweh[b], for length of days.
translation:
  language: zh_hans
  text: '你的见证极其可靠；

    雅威啊，圣洁与你的殿相称，直到永远。[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到永远”原文直译为“长久的日子”。这是表示持久延续的希伯来语表达，并且最自然地修饰“圣洁与你的殿相称”。
    reason: 说明希伯来习语及其最自然的句法连接
  - marker: b
    text: “雅威”是希伯来文神名 יהוה 的音译；传统中文常译作“耶和华”。
    reason: 说明神名的译法
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  choice: 你的见证
  rationale: 保留该词“见证、证言”的基本意义及其圣约色彩，不把它限缩为单纯的法规或命令。
- source_word: נֶאֶמְנוּ מְאֹד
  choice: 极其可信
  rationale: נֶאֶמְנוּ 表示坚定、可靠、值得信赖；“极其”自然传达 מְאֹד 的加强语气。
- source_word: לְבֵיתְךָ
  choice: 你的殿
  rationale: בַּיִת 字面为“家、房屋”，在此诗篇敬拜语境中指雅威的圣所；“殿”在现代中文中能自然表达这一含义。
- source_word: נַאֲוָה קֹדֶשׁ
  choice: 以圣洁为宜
  rationale: 表达圣洁与神的殿相配、相称之意，同时保持简洁庄重。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为专名而非称号的性质。
- source_word: לְאֹרֶךְ יָמִים
  choice: 直到永远
  rationale: 该短语字面为“日子长久”，在诗歌中表示恒久绵延；“直到永远”是自然清楚的现代汉语表达，字面形式在脚注交代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名；“雅威”较直接反映学界通常重构的读音，也避免以“主”这一称号替代专名。
- issue: לְאֹרֶךְ יָמִים 的所指与句法连接
  choice: 理解为修饰“圣洁与你的殿相称”这一分句，译作“直到永远”
  alternative: 保留较直译的“日子长久”，或将雅威与末尾短语连读
  rationale: 词序和诗意最自然地表明圣洁恒久适合神的殿；但希伯来语的简练结构容许不同停顿，因此在脚注中保留原文字面和句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“极其可信”直白自然；“以圣洁为宜”略带典雅色彩，以配合诗篇语体。分号保留两句平行而递进的结构。
