  text: נָכ֣וֹן כִּסְאֲ/ךָ֣ מֵ/אָ֑ז מֵֽ/עוֹלָ֣ם אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/002.yaml
  text: Your throne is established from of old[a]; you are from everlasting.
translation:
  language: zh_hans
  text: '你的宝座自古就已坚立[a]；

    你从亘古就存在。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的宝座从那时起就已坚立。”
    reason: מֵאָז既可泛指“自古”，也可指前文所暗示的某一时点，即“从那时起”。
lexical_decisions:
- source_word: נָכוֹן
  choice: 就已坚立
  rationale: 该词表达稳固、确立的状态。“坚立”既保留宝座坚定不移的意象，也与后面的时间短语自然衔接；“已”突出这状态早已成立。
- source_word: כִּסְאֲךָ
  choice: 你的宝座
  rationale: כִּסֵּא通常指“宝座”，第二人称阳性单数词尾直译为“你的”。
- source_word: מֵאָז
  choice: 自古
  rationale: 该短语可指“从那时起”，也可指遥远的古时；本节诗意语境侧重久远年代，译作“自古”简洁自然，同时在脚注保留另一种理解。
- source_word: מֵעוֹלָם
  choice: 从亘古
  rationale: עוֹלָם在此指无从追溯的久远过去，用于上帝时表达超越可追溯年代的存在；“亘古”庄重而为现代读者所能理解。
- source_word: אָתָּה
  choice: 你……存在
  rationale: 独立代词在此与前置的时间短语构成无动词句。汉语补出“存在”，清楚表达原文对上帝久远存在的断言，而不加入原文以外的形而上术语。
theological_decisions:
- issue: 上帝存在的时间性表述
  choice: 你从亘古就存在
  alternative: 你从永恒就存在
  rationale: “亘古”贴近מֵעוֹלָם从不可追溯的过去以来这一表达，肯定上帝先于一切可追溯年代而存在，又不将原诗的时间语言改写成后来的哲学术语。
- issue: 宝座坚立与上帝亘古存在之间的关系
  choice: 保留两个并列分句
  alternative: 将两句解释性合并为“你的宝座因你永恒存在而永远坚定”
  rationale: 原文以诗歌平行句并置宝座的稳固和上帝的亘古存在，并未明确说明因果关系，因此不作神学性的补充解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“坚立”保留原文的稳固意象；分行呈现希伯来诗歌的平行结构。脚注标记[a]已置于正文相应位置。
