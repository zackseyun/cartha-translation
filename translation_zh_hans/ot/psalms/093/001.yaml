language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֣ה מָלָךְ֮ גֵּא֪וּת לָ֫בֵ֥שׁ לָבֵ֣שׁ יְ֭הוָה עֹ֣ז הִתְאַזָּ֑ר אַף תִּכּ֥וֹן תֵּ֝בֵ֗ל בַּל תִּמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/001.yaml
  text: Yahweh reigns[a]; he is clothed with majesty; Yahweh is clothed with strength; he has girded himself. Indeed, the world is established[e][d][c][b]; it will not be moved.
translation:
  language: zh_hans
  text: 雅威作王[a]！他以威严为衣；雅威以力量为衣；他束紧自己[b]。世界的确坚立[c]，绝不动摇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作王”也可译作“已经作王”或“掌权”；原文既可作为对雅威现今王权的宣告，也可能带有“登基作王”的意味。
    reason: alternative_reading
  - marker: b
    text: 直译近于“他束紧了自己”；这里的意象是雅威把力量像腰带一样束在身上，表示已经装备妥当。
    reason: cultural_note
  - marker: c
    text: “世界”指有秩序、有人居住的世界。此处原文连接词可表加强或递进；也可译作“世界也坚立”或“世界的确坚立”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中通行的音译保留上帝的专名，而不以称号替代。
- source_word: מָלָךְ
  choice: 作王
  rationale: 既可自然宣告雅威现今掌权，也保留希伯来语完成式可能具有的登基意味，不把含义收窄为单纯状态。
- source_word: גֵּאוּת
  choice: 威严
  rationale: 在指雅威时表示崇高、庄严的王者气象，而非负面的骄傲。
- source_word: לָבֵשׁ
  choice: 以……为衣
  rationale: 保留诗句反复出现的穿衣意象，同时符合现代汉语诗体表达。
- source_word: עֹז
  choice: 力量
  rationale: 直接表达能力和大能，清楚自然，并与披衣、束腰的形象相配。
- source_word: הִתְאַזָּר
  choice: 束在自己腰间
  rationale: 保留反身的束腰动作；从上下文补明所束的是力量，但不扩展为原文未明说的盔甲。
- source_word: אַף
  choice: 也因此
  rationale: “也”表达强调性的推进；“因此”在汉语中自然呈现雅威掌权、披戴力量与世界坚立之间的诗意关联，但不将其处理为严格的逻辑论证。
- source_word: תִּכּוֹן
  choice: 坚立
  rationale: 表达被稳固、确立的含义，简练而庄重。
- source_word: תֵּבֵל
  choice: 世界
  rationale: 指有秩序、有人居住的世界；译作“世界”最自然，也避免与常译为“地”的其他希伯来词混同。
- source_word: בַּל תִּמּוֹט
  choice: 绝不动摇
  rationale: 准确表达不会摇晃、倾覆的稳定性，并以“绝不”体现否定语气的力度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其专名性质，不以称号取代。
- issue: מָלָךְ 的时态与体貌
  choice: 作王
  alternative: 已经作王；掌权
  rationale: “作王”在汉语中可作为当下的王权宣告，又不会排除“登基作王”的起始性读法，从而保留诗句的真实歧义。
- issue: 世界坚立与神统治之间的关系
  choice: 也因此坚立
  alternative: 世界也坚立；世界的确坚立
  rationale: 上下句明显相承，但希伯来语 אַף 本身并非明确的因果连词；正文采用自然的诗意衔接，并在注释中提示其也可仅作强调理解。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。以短分句和重复的“以……为衣”保存希伯来诗歌的平行结构；避免过度古雅的“腰束大能”等表达。正文保留王权、披衣和束腰三组核心意象，并用脚注交代动词体貌及连接词的歧义。
