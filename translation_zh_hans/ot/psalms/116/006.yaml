base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/006.yaml
  text: Yahweh preserves the simple[a]; I was brought low[c][b], and he saved me.
translation:
  language: zh_hans
  text: 雅威保护单纯的人[a]；我落到低微的地步[b]，他救了我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天真的人”“缺乏经验的人”。希伯来语指单纯、缺少戒心的人，不一定是道德上愚昧的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“我衰弱了”“我被降卑了”。希伯来语可指被削弱、降低或陷入低微状态。
    reason: lexical_alternative
  - marker: c
    text: 或译“他搭救了我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: 保护
  rationale: 该分词表示持续地看守、护卫；“保护”在现代汉语中自然，并符合本诗蒙拯救的语境。
- source_word: פְּתָאיִם
  choice: 单纯的人
  rationale: 指缺少阅历、戒心或世故的人，并不必然含有道德上愚昧的贬义；“单纯的人”保留了这一语义范围。
- source_word: יְהֹוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；以“雅威”音译，保留其专名性质，并与所给审校层的神学决定一致。
- source_word: דַּלּוֹתִי
  choice: 我落到卑微的境地
  rationale: 该形式可表达被降低、衰弱或陷于低微状态；此译法保留结果状态，又不把含义限缩为经济贫穷。
- source_word: וְלִי
  choice: 他就……我
  rationale: 介词加代词表达雅威为诗人施行拯救；汉语中自然地融入“他就救了我”，不生硬直译为“为我”。
- source_word: יְהוֹשִׁיעַ
  choice: 他就救了我
  rationale: 使役词干在此表示施行拯救或搭救；“救了我”直接、自然，并突出诗人的亲身获救。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 希伯来文使用神的专名。音译“雅威”保留专名性质；不以普通称号替代，也不在本节中增添解释。
- issue: פְּתָאיִם 所指是否带有道德谴责
  choice: 译作“单纯的人”，不明确判定为道德愚昧
  alternative: 愚蒙人；幼稚的人
  rationale: 该词可指天真、缺乏经验或戒心的人，语义本身不必然等同于邪恶或道德败坏，故保留其张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“落到卑微的境地”避免仅理解为贫穷；分号保留原文前后由普遍陈述转入个人见证的结构。所有脚注标记均置于对应正文之后。
