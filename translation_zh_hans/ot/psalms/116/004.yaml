  text: וּ/בְ/שֵֽׁם יְהוָ֥ה אֶקְרָ֑א אָנָּ֥ה יְ֝הוָ֗ה מַלְּטָ֥/ה נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/004.yaml
  text: 'Then I called on the name of the LORD: “Please, LORD, rescue my life!”'
translation:
  language: zh_hans
  text: '于是我求告耶和华的名：

    “耶和华啊，求你救我的性命！”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  choice: 于是我求告耶和华的名
  rationale: “求告……的名”直接保留希伯来语惯用表达；未将未完成式强行处理为持续或将来动作。连接词 וּ 依上下文译作“于是”。
- source_word: אָנָּה
  choice: 啊，求你
  rationale: 该恳求语气词表达迫切请求；汉语用呼语“啊”和“求你”自然呈现，不另设脚注。
- source_word: מַלְּטָה
  choice: 救
  rationale: 此处是祈使形式，意为使之脱险、搭救；“救”简明而符合诗歌祷告语体。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נפשׁ 在此指处于死亡威胁中的生命或本人，而非专指与身体分离的“灵魂”；“性命”贴合险境中的恳求。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文圣经读者熟悉的专名形式，同时将其作为神的专有名而非普通称号处理。
- issue: נַפְשִׁי 的人论含义
  choice: 我的性命
  alternative: 我的灵魂
  rationale: 上下文描述死亡的绳索与阴间的痛苦，此处重点是诗人的生命获救；避免把词义窄化为非物质灵魂，但不否定该词在其他语境中的更广含义。
translation_notes:
  register: 采用自然、庄重且易懂的现代标准汉语；保留“求告耶和华的名”这一重要的原文表达，并以直接引语呈现迫切祷告。
