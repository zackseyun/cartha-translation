  text: כִּ֤י חִלַּ֥צְתָּ נַפְשִׁ֗/י מִ֫/מָּ֥וֶת אֶת עֵינִ֥/י מִן דִּמְעָ֑ה אֶת רַגְלִ֥/י מִ/דֶּֽחִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/008.yaml
  text: For you have delivered my soul from death[a], my eyes from tears[b], my feet from stumbling.
translation:
  language: zh_hans
  text: 因为你救我的性命脱离死亡[a]，救我的眼睛免于流泪，救我的脚免于跌倒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的性命”或译“我的灵魂”或“我”；希伯来语“尼非希”（נֶפֶשׁ）可指生命、性命、灵魂或整个人。
    reason: lexical_alternative
  - marker: b
    text: “我的脚免于跌倒”或译“我的脚不致失足（或倒下）”；原文“脚”是单数，“跌倒”一词也可指踉跄或倒下。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，为诗人的回应提供理由；现代汉语用“因为”自然保留解释性的关系。
- source_word: חִלַּצְתָּ
  choice: 救……脱离／免于
  rationale: 此动词在这里表示从危险中搭救。首句译为“救……脱离”，后两句补出同一动词并按汉语习惯用“免于”，使三重拯救清楚而流畅。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ可指生命、性命或整个人；与“死亡”搭配时，“性命”最自然，同时不把它缩减为单纯的身体概念。
- source_word: מִמָּוֶת
  choice: 脱离死亡
  rationale: 直接表达从死亡中获救，保持原文庄重、诗性的措辞。
- source_word: אֶת עֵינַי מִן דִּמְעָה
  choice: 救我的眼睛免于流泪
  rationale: 原文省略重复的动词，汉语补出“救”可清楚呈现三联结构；将单数集合名词דִּמְעָה自然译为“流泪”。
- source_word: אֶת רַגְלִי מִדֶּחִי
  choice: 救我的脚免于跌倒
  rationale: 保留希伯来文单数“脚”；דֶּחִי可表示踉跄、跌倒或被推倒，此处用“跌倒”兼顾自然表达与诗境。
theological_decisions:
- issue: נַפְשִׁי所指的人论含义
  choice: 我的性命
  alternative: 我的灵魂；我
  rationale: 在“脱离死亡”的语境中，“性命”最贴切，但脚注保留该词可指“灵魂”或“我本人”的语义广度，避免把经文限定为某一种人论解释。
- issue: 拯救的三重对象与结果
  choice: 三句都明确补出“救”
  alternative: 仅首句出现“救”，后两句保留省略
  rationale: 希伯来诗句以后两项承接首项动词。现代汉语重复“救”能清楚保留排比和施救者的主动作为，并未增加新的神学主张。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以三次“救”显明希伯来原文的三联排比；保留单数“脚”，并用脚注呈现נֶפֶשׁ与דֶּחִי的真实语义范围。
