  text: יָ֭קָר בְּ/עֵינֵ֣י יְהוָ֑ה הַ֝/מָּ֗וְתָ/ה לַ/חֲסִידָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/015.yaml
  text: Precious in the eyes of Yahweh is the death of his faithful ones[a][b].
translation:
  language: zh_hans
  text: 在耶和华眼中，忠于他之人[b]的死极为宝贵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宝贵”也可译作“代价重大”；希伯来词兼有珍贵、贵重和代价高昂之意。
    reason: lexical_alternative
  - marker: b
    text: “忠于他之人”也可译作“圣民”或“敬虔之人”；希伯来语指那些以对上帝守约忠诚为特征的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקָר
  choice: 极其宝贵
  rationale: 该词可表示“珍贵、贵重、代价高昂”。正文采用自然庄重的“极其宝贵”，同时以脚注保留“代价重大”的可能含义，避免把经文窄化为单纯的情感喜爱。
- source_word: בְּעֵינֵי
  choice: 在……眼中
  rationale: 保留希伯来语“在某人眼中”的评判视角隐喻；这一表达在现代汉语中也自然易懂。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译四字神名，保留其作为以色列之上帝专名的性质，而不改用一般性称号。
- source_word: הַמָּוְתָה
  choice: 死
  rationale: 按上下文译作名词“死”，与“……之人的死”构成自然汉语；词尾形式在此不改变基本语义。
- source_word: לַחֲסִידָיו
  choice: 他忠信之人
  rationale: חָסִיד指以忠诚、敬虔及守约之爱为特征的人。“忠信之人”能清楚表达这种关系性的忠诚，并避免“圣徒”在现代语境中可能带入的后期宗派含义；“他”体现第三人称单数所属后缀。
theological_decisions:
- issue: 本节如何描述耶和华看待忠信之人的死
  choice: 表明忠信之人的死在耶和华眼中极其宝贵，强调他对此郑重看待
  alternative: 忠信之人的死对耶和华而言代价重大，或在他面前分量极重
  rationale: יָקָר兼有“宝贵”和“代价高昂”的语义。正文不把它解释成上帝喜悦死亡，也不排除“代价重大”的理解，而以脚注保留经文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在耶和华眼中”保留原文意象；语序略作汉语化处理。正文简洁，两个脚注分别保留 יָקָר 与 חָסִיד 的主要词义幅度。
