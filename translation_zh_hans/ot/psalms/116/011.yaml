  text: אֲ֭נִי אָמַ֣רְתִּי בְ/חָפְזִ֑/י כָּֽל הָ/אָדָ֥ם כֹּזֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/011.yaml
  text: I said in my alarm[b][a], “Every man is a liar.”
translation:
  language: zh_hans
  text: 我在惊慌中[a]说：“人人[b]都是说谎的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在匆忙中”或“在慌乱中”。希伯来语可表示急促、焦灼、惊慌等状态。
    reason: lexical_alternative
  - marker: b
    text: 或译“全人类”。希伯来语直译为“每一个人”，其中“人”是集合性的泛称。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי אָמַרְתִּי
  choice: 我……说
  rationale: 保留第一人称主语所带的强调；“说”自然对应常用动词 אָמַר，不过度增添“宣告”等庄严意味。
- source_word: בְחָפְזִי
  choice: 在惊慌中
  rationale: 该词在这里可指急促、慌乱或惊恐；上下文强调诗人在困境中的情绪反应，因此“惊慌”比单纯表示速度的“匆忙”更贴切，同时以脚注保留另一种可能。
- source_word: כָּל הָאָדָם
  choice: 人人
  rationale: 单数集合名词 הָאָדָם 与 כָּל 连用，泛指所有人；“人人”在现代汉语中自然、简洁，并保留普遍范围。
- source_word: כֹּזֵב
  choice: 都是说谎的
  rationale: 该分词表示说谎或以虚假为特征的人；“都是说谎的”保留原文强烈的判断，同时比生硬的“都是说谎者”更符合现代汉语表达。
theological_decisions:
- issue: “人人都是说谎的”是否应弱化为仅指“不可靠”
  choice: 保留“说谎”的强烈表述
  alternative: “世人都不可靠”或“全人类都是虚假的”
  rationale: כֹּזֵב 可以涉及虚假、不可靠或说谎；原句本身带有尖锐而概括性的判断，不宜在正文中预先弱化。其作为诗人在惊慌中所说的话这一语境也按原文保留，不进一步将其系统化解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我在惊慌中说”传达诗人的受困情绪；“人人都是说谎的”保留原文的普遍范围和道德力度。所有脚注标记均置于相应词语之后。
