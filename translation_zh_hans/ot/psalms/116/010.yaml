  yaml_path: translation/ot/psalms/116/010.yaml
  text: 'I believed[b][a], therefore I spoke: “I am greatly afflicted.”'
translation:
  language: zh_hans
  text: 我信靠，所以我说[a]：“我遭受了极大的苦难。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所以我说”或译“因为我说”；希伯来语 כִּי 可表达不同的关系，אֲדַבֵּר 的时间含义也可有不同理解。
    reason: lexical_alternative
  - marker: b
