    reason: alternative_reading
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: 我信靠
  rationale: אמן 的使役词干在这里表达相信、倚赖。“信靠”自然地保留了对某一对象的信任意味，同时不必补出原文未明说的对象。
- source_word: כִּי
  choice: 因而
  rationale: כִּי 可表示原因、说明等关系；结合诗句的推进及古代译本所反映的理解，这里以结果性连接“因而”译出，但在脚注保留“因为”等可能。
- source_word: אֲדַבֵּר
  choice: 说出
  rationale: 该未完成式可按诗歌语境理解为过去、现在或意向性的言说。“说出”在汉语中不强制标明时态，并自然连接后面的引语。
- source_word: אֲנִי
  choice: 我
  rationale: 独立人称代词具有强调作用；在引语中明确保留“我”。
- source_word: עָנִיתִי
  choice: 我受了……苦
  rationale: 这里的 ענה 表示遭受苦难或困苦。译作“受了苦”既符合完成式，又比“被谦卑”更准确地表达受苦含义。
- source_word: מְאֹד
  choice: 极大的
  rationale: 表示强烈程度；“极大的苦”是自然、庄重且易懂的现代汉语。
theological_decisions:
- issue: 信靠与说话之间的句法关系
  choice: 将 כִּי 理解为结果性连接：信靠引出说话，并把末句作为所说的内容。
  alternative: 也可理解为“我信靠，因为我说……”；或把整句理解为“即使我说‘我受了极大的苦’，我仍然信靠”。
  rationale: 希伯来语句法紧缩，כִּי 的功能和末句与前文的关系并不唯一。正文采用连贯而有古代接受史支持的读法，脚注保留真实歧义，不将其神学化地消解。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“信靠”兼顾信念与倚赖的语义；“受了极大的苦”避免生硬的“极其受苦”。所有真实的句法歧义均以脚注保存。
