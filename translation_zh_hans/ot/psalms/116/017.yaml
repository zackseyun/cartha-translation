source:
  edition: WLC
  text: לְֽ/ךָ אֶ֭זְבַּח זֶ֣בַח תּוֹדָ֑ה וּ/בְ/שֵׁ֖ם יְהוָ֣ה אֶקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/017.yaml
  text: To you I will offer a sacrifice of thanksgiving[a], and I will call on the name of Yahweh.
translation:
  language: zh_hans
  text: 我要向你献上感恩祭，并求告耶和华[a]的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；中文传统译作“耶和华”，也常音译为“雅威”。
    reason: 说明神名的原文形式及常见替代音译。
lexical_decisions:
- source_word: לְךָ
  choice: 向你
  rationale: 介词 לְ 加第二人称阳性单数后缀，表示献祭所朝向、归给的对象；“向你”符合现代汉语的敬拜语境。
- source_word: אֶזְבַּח
  choice: 我要……献上
  rationale: זבח 在祭祀语境中指献祭；与宾语“感恩祭”搭配译为“献上”，自然且保留礼仪行动的含义。
- source_word: זֶבַח תּוֹדָה
  choice: 感恩祭
  rationale: 该结构指为感谢而献的祭；“感恩祭”简洁保留祭祀术语及感谢之意，不将其弱化为一般赞美。
- source_word: וּבְשֵׁם
  choice: 并求告……的名
  rationale: קרא בשם 是固定表达，意为呼求或求告某人的名；汉语“求告……的名”准确体现祷告与倚靠的语义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式呈现四字神名，而不以“主”这一称号替代；脚注说明其希伯来文形式及另一常见音译。
- source_word: אֶקְרָא
  choice: 求告
  rationale: 在 בשם יהוה 的搭配中，קרא 表示祈求、呼求；“求告”比单纯“呼叫”更符合此处敬拜语境，同时不额外限定具体礼仪形式。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神名。正文采用中文传统且广为人知的音译“耶和华”，避免以称号“主”取代专名；脚注保留“雅威”这一更接近学界拟音的替代形式，以诚实反映读音问题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“感恩祭”保留古代以色列献祭背景；两个并列分句对应原文结构，适合诗歌与公共诵读。
