  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/018.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: zh_hans
  text: 我要向耶和华履行我的誓愿[a]，就在他所有的子民面前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“偿还我向耶和华所许的愿。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在……面前”；这里指在敬拜群体眼前公开履行誓愿。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: 我的誓愿
  rationale: נֶדֶר指向上帝所许的愿或郑重承诺；复数并带第一人称单数词尾，因此译作“我的誓愿”，不把它限定为祭物。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 介词ל标明履行誓愿的对象；יהוה按其专名译作“耶和华”。
- source_word: אֲשַׁלֵּם
  choice: 履行
  rationale: שׁלם的强意词干用于誓愿语境时，可指偿付或履行。现代汉语用“履行誓愿”自然清楚，也避免把意思误解为单纯支付金钱。
- source_word: נֶגְדָה־נָּא
  choice: 就在……面前
  rationale: נֶגֶד表示“在……面前”；נָא在此难以单独直译，可能带有强调作用，故以“就”表达强调，同时保留公开当众履行的意味。
- source_word: לְכָל עַמּוֹ
  choice: 他所有的子民
  rationale: כָּל明确表示“所有”；עַמּוֹ带第三人称阳性单数词尾，所指为耶和华的子民。与前面的“面前”连用，表示在整个敬拜群体眼前。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者广泛熟悉的专名“耶和华”，而不以“主”替代，从而保留这是上帝圣约之名这一点。
- issue: 誓愿的履行是否特指献祭或献上还愿祭
  choice: 不作具体限定
  alternative: 献上我所许的还愿祭
  rationale: 本节的נֶדֶר本身是“誓愿”，虽可能涉及献祭，原文却未明确说明具体履行方式，因此不在译文中加入“祭”或“祭物”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“履行誓愿”比“偿付誓愿”自然，也比单说“还愿”更明确；“就在”传达诗句中נָא可能具有的强调语气。所有脚注标记均置于正文对应位置。
