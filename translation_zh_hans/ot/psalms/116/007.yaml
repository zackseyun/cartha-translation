  yaml_path: translation/ot/psalms/116/007.yaml
  text: Return[a], my soul, to your rest, for Yahweh has dealt bountifully with you.
translation:
  language: zh_hans
  text: 我的心哪，回到你的安歇吧！因为耶和华厚待了你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厚待了你”也可译作“恩待了你”或“慷慨地待你”。原文动词可指对待、回报或施予；这里的上下文表明是正面的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  choice: 回到
  rationale: 这是阴性单数命令式，与所呼唤的“我的心”一致；“回到”保留返回先前安歇状态或所在之处的含义。
- source_word: נַפְשִׁי
  choice: 我的心哪
  rationale: נפשׁ可指生命、自我或心灵；这里是诗人对自己的直接呼唤。“我的心哪”符合现代汉语诗歌中的自我劝勉语气，又不把它限定为与身体相分离的实体。
- source_word: לִמְנוּחָיְכִי
  choice: 你的安歇之处
  rationale: 该词可表达安歇、安息或安歇之所；“安歇之处”自然呈现“回到”的趋向，也保留安稳休憩的意象。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出前面命令的理由；“因为”在现代汉语中清楚自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用汉语中广为人知的神名音译，不以“主”这一称号替代原文的专名。
- source_word: גָּמַל עָלָיְכִי
  choice: 厚待了你
  rationale: גמל本身可指对待、回报或施予，褒贬由语境决定；本篇感谢诗的语境明确为正面。“厚待”简洁表达慷慨施恩的意味，同时在脚注保留其他可能译法。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名，而不是称号，因此正文保留专名形式；“耶和华”是普通汉语读者最熟悉的专名音译，不译成“主”。
- issue: נפשׁ所指的人之内在主体
  choice: 我的心哪
  alternative: 我的灵魂哪；我自己
  rationale: 本节是诗人向自身说话。“心”在汉语中能自然承载自我劝勉的诗意表达，又避免把נפשׁ过度界定为某种特定的人论概念。
- issue: גמל的正面含义
  choice: 厚待了你
  alternative: 赐福给你；报答了你
  rationale: 动词本身可用于正面或负面的对待、回报；此处上下文显示是恩惠，却没有要求将其专门解释为奖赏或报偿。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“我的心哪”保留直接自我呼唤，“吧”表现劝勉式命令的自然语气；感叹号对应这一呼唤与劝勉的诗歌力度。
