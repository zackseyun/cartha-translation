  text: אָֽנָּ֣ה יְהוָה֮ כִּֽי אֲנִ֪י עַ֫בְדֶּ֥/ךָ אֲֽנִי עַ֭בְדְּ/ךָ בֶּן אֲמָתֶ֑/ךָ פִּ֝תַּ֗חְתָּ לְ/מוֹסֵרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/016.yaml
  text: Please[a], Yahweh, for I am your servant; I am your servant, the son of your maidservant[c][b]. You have loosed my bonds.
translation:
  language: zh_hans
  text: 雅威[a]啊，求你！因为我是你的仆人；我是你的仆人，是你婢女的儿子。你已经解开了我的束缚[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה 的音译；传统中文译本常译作“耶和华”，也有以“主”代称的。
    reason: divine_name
  - marker: c
    text: “束缚”也可译作“捆绑”“锁链”或“镣铐”；全句也可较意译地译为“你已经使我得自由”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנָּה
  choice: 求你垂听
  rationale: 这是表达恳切请求的语气词。原文没有明说所求的动作；中文若只译“求你”语意悬空，因此依诗歌祷告语境补出“垂听”，并以脚注说明原文的省略和其他理解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术读音音译，保留其作为以色列之神专名的性质，而不以“主”这一称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 保留该词引出恳求理由的因果或解释作用；它也可能带肯定语气，但这里与前面的恳求衔接时，“因为”最为自然。
- source_word: עַבְדֶּךָ / עַבְדְּךָ
  choice: 你的仆人
  rationale: עבד可指奴仆或奴隶；在诗人向神表明归属与忠诚的语境中，“仆人”庄重自然，同时仍保留服事和隶属的含义。
- source_word: בֶּן אֲמָתֶךָ
  choice: 你婢女的儿子
  rationale: 贴近字面，保留女性仆役以及“儿子”所表达的出生身份和世代归属。“婢女”比“女仆人”更凝练，且在庄重诗体中自然。
- source_word: פִּתַּחְתָּ לְמוֹסֵרָי
  choice: 你已经解开了我的捆索
  rationale: פּתח本义为“打开”，与“捆索、束缚”搭配时指解开或松开。此译保留具体的释放意象，不直接抽象化为“使我得自由”。
theological_decisions:
- issue: 诗人在神面前的身份用语
  choice: 仆人
  alternative: 奴仆／奴隶
  rationale: 本节强调诗人谦卑地属于雅威，并以“你婢女的儿子”强化这种归属。“仆人”在现代中文敬虔语境中较自然，又不排除原词所含的受约束身份。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用神的专名。音译“雅威”保留专名性质，也与目前较普遍接受的希伯来语读音相符；不以称号“主”取代。
- issue: אָנָּה 后省略的请求内容
  choice: 正文补出“垂听”，脚注保留省略
  alternative: “求你！”／“啊，雅威，我确是……”
  rationale: 希伯来文仅有恳求语气词，未明说请求动作。中文为避免突兀，按祷告语境最小幅度补出“垂听”，但不把这一补充当作原文明说的内容；脚注同时保留将其理解为感叹或强调的可能。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。重复两次“我是你的仆人”，以保留希伯来文的强调；“婢女的儿子”和“解开捆索”保留原文具体意象。
