  text: אָ֭הַבְתִּי כִּֽי יִשְׁמַ֥ע יְהוָ֑ה אֶת ק֝וֹלִ֗/י תַּחֲנוּנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/001.yaml
  text: I love that the LORD hears my voice, my pleas for mercy.
translation:
  language: zh_hans
  text: 我爱耶和华，因为他听见我的声音和我的恳求。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהַבְתִּי
  choice: 我爱
  rationale: 按希伯来语完成式直译，表达诗人已经形成并持续持有的爱；不补出原文没有明说的宾语。
- source_word: כִּי
  choice: 因为
  rationale: 这里最自然地引出诗人爱耶和华的缘由；虽可理解为“我爱耶和华听……这件事”，但后文诗篇116:2支持因果关系。
- source_word: יִשְׁמַע
  choice: 听
  rationale: 未完成式在此可表达耶和华一贯垂听；现代汉语用“听”简洁自然，且不额外强化为“应允”。
- source_word: קֹולִי תַּחֲנוּנָי
  choice: 我的声音，我恳求的声音
  rationale: 保留“声音”与“恳求”的并列/同位关系，并把后项自然地理解为对前项的具体说明；“恳求”也保留了向施恩者求怜悯的语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名对应四字神名，区别于一般称号“主”。
theological_decisions:
- issue: “爱”的宾语与כִּי从句的关系
  choice: 我爱耶和华，因为……
  alternative: 我爱耶和华听我声音这件事／我爱，因为……
  rationale: 原文在“我爱”后省略宾语，形式上保有一定歧义；结合诗篇语境和116:2，最自然的理解是宾语为耶和华，כִּי引出原因。译文作必要补足，但不把“听”解释成必然“应允”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我恳求的声音”略带诗歌重复感，用来保留原文“我的声音，我的恳求”的紧密并置。
