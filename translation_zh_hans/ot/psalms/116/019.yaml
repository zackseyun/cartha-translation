  text: בְּ/חַצְר֤וֹת בֵּ֤ית יְהוָ֗ה בְּֽ/ת֘וֹכֵ֤/כִי יְֽרוּשָׁלִָ֗ם הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/019.yaml
  text: in the courts of the house of Yahweh[a], in your midst, Jerusalem[b]. Praise Yah!
translation:
  language: zh_hans
  text: 在雅威[a]殿的院中，在你中间，耶路撒冷啊！你们要赞美雅[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译；传统译本常译作“耶和华”或“主”。
    reason: lexical_alternative
  - marker: b
    text: “雅”是神名的短式；“你们要赞美雅”的希伯来语表达，正是“哈利路亚”一词的来源。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַצְרוֹת
  choice: 在……院中
  rationale: חָצֵר的复数在此指圣殿范围内的院落；中文用“院中”自然简洁，并保留空间含义。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: 字面为“雅威的家”；在圣所语境中，汉语“雅威殿”既清楚指向圣殿，又不过度展开原文。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用四字神名YHWH的常见现代汉语音译，以区别于作为称号的“主”。
- source_word: בְּתוֹכֵכִי
  choice: 在你里面
  rationale: 保留第二人称阴性单数形式，体现诗人将耶路撒冷人格化并直接称呼；“里面”也贴近בְּתוֹךְ的空间意义。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代汉语通行地名译法。
- source_word: הַלְלוּ יָהּ
  choice: 你们要赞美雅
  rationale: הַלְלוּ是复数命令式，明确译出“你们要赞美”；יָהּ是神名短式，音译为“雅”，保留其与“哈利路亚”的词源联系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，正文以音译保留其专名性质，不用称号替代。
- issue: 结尾יָהּ的译法
  choice: 雅
  alternative: 雅威；主；哈利路亚
  rationale: יָהּ是神名的短式，不与本节前面的יְהוָה完全同形；译作“雅”保留这一差别。“哈利路亚”虽已通行，但会遮蔽命令式“赞美”的词义结构。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“在你里面，耶路撒冷啊”保留原文对城市的直接人格化称呼；结尾补出复数主语“你们”，使希伯来语命令式在中文中清楚可见。
