  text: מָֽה אָשִׁ֥יב לַ/יהוָ֑ה כָּֽל תַּגְמוּל֥וֹ/הִי עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/012.yaml
  text: What shall I return to Yahweh for all his benefits to me?[a]
translation:
  language: zh_hans
  text: 雅威赐给我的一切恩惠，我该拿什么回报雅威呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威向我所施的一切作为，我该拿什么回报雅威呢？”希伯来语这里译作“恩惠”的词也可指“对待、作为”或“回报”；正文根据本诗感恩的语境译作“恩惠”。
    reason: 词义有多种可能
lexical_decisions:
- source_word: מָה
  choice: 什么
  rationale: 这是引出诗人自问的疑问代词；“什么”直接对应希伯来语，也符合现代汉语表达。
- source_word: אָשִׁיב
  choice: 我拿什么回报
  rationale: 该词是שׁוב的使役形，基本义为“使返回、归还”。在回应上帝恩惠的语境中，“回报”既保留回返、回应的意味，又比“偿还”少一些债务交易色彩。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 介词ל表示动作所指向的对象；יהוה是上帝的专名，译作“雅威”。汉语为使句子自然，将对象置于后文代词“他”中表达。
- source_word: כָּל
  choice: 一切
  rationale: 表达完整的总括，修饰雅威向诗人所施的一切恩惠。
- source_word: תַּגְמוּלֹהִי
  choice: 恩惠
  rationale: 该词可指所得的待遇、回报或所受的作为。鉴于本诗是感恩之歌，此处取正面意义“恩惠”，同时在脚注保留“作为、对待”的较宽泛含义。
- source_word: עָלָי
  choice: 赐给我
  rationale: 介词עַל在此表示这些恩惠临到诗人、施于诗人。结合“恩惠”，译为“赐给我”是自然的现代汉语。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；正文以“雅威”音译，明确保留其作为立约之神专名的性质。
- issue: 人是否能够偿清上帝的恩惠
  choice: 回报
  alternative: 偿还
  rationale: 原文动词具有“归还、回返”的意义，但并未明确构成可偿清的债务关系；“回报”保留回应恩惠的张力，不把诗人的问题解释成交易性的偿债。
translation_notes:
  register: 采用自然、庄重而口语可懂的现代标准汉语。为符合汉语信息结构，先提出雅威所赐的恩惠，再表达诗人的自问；句末“呢”传达反思性的疑问语气。
