  text: אֶ֭תְהַלֵּךְ לִ/פְנֵ֣י יְהוָ֑ה בְּ֝/אַרְצ֗וֹת הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/009.yaml
  text: I will walk before Yahweh in the lands of the living[a].
translation:
  language: zh_hans
  text: 我要在活人之地，在耶和华面前行走。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要在活人之地，在耶和华面前生活。”原文“行走”也可表示生活或行事为人；“地”在希伯来文中是复数，也可理解为活人所在的诸地或领域。
    reason: 说明希伯来习语的双重含义，并保留复数名词的形式信息与替代译法。
lexical_decisions:
- source_word: אֶתְהַלֵּךְ
  choice: 我要……行走
  rationale: 该词是הלך的Hitpael未完成式第一人称单数，可表达将来的行动或意愿；保留“行走”这一具体意象，也让“生活、行事为人”的含义保持开放。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 既可表示空间上的“在……面前”，也可表示处于某位的临在或鉴察之下；此译法简洁并保留两层含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法“耶和华”，将四字神名作为专名呈现，而不以称号代替。
- source_word: בְּאַרְצוֹת
  choice: 在……之地
  rationale: 原文名词为复数，字面可译“诸地”；但在בארצות החיים这一诗性搭配中，所指更可能是活人所在的领域或世间。中文用单数集合性表达“活人之地”较自然，复数形式及其可能含义在脚注说明。
- source_word: הַחַיִּים
  choice: 活人
  rationale: 该复数形式在此作实体词，指“活着的人”；“活人之地”保留希伯来诗歌中与死亡领域相对的表达。
theological_decisions:
- issue: 本节侧重蒙拯救后继续存活，还是在上帝面前生活行事
  choice: 保留“在耶和华面前行走”的习语
  alternative: 我要在活人之地，在耶和华面前生活／行事为人。
  rationale: 希伯来语既可指诗人蒙救后继续活在人世，也可指他在上帝面前度日、行事；直译“行走”可保留这种神学张力，不把意义限定为肉身存活或伦理生活中的一项。
- issue: בְּאַרְצוֹת的复数是否必须在正文中显明
  choice: 正文采用自然的集合性单数“活人之地”，脚注交代字面复数
  alternative: 在活人的诸地／各地
  rationale: 原文虽为复数，但整句是指活人所在的领域；中文若机械使用“诸地”容易被理解为多个地理国家。正文优先传达诗性习语，脚注保留形态信息及另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“在耶和华面前行走”略带圣经诗体色彩，但中文意义清楚，并能保留原文意象；语序先交代“活人之地”，使“在耶和华面前行走”保持紧密和自然。
