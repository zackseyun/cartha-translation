  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/014.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: zh_hans
  text: 我要履行我向雅威所许的愿[a]，就在他所有的子民面前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “履行”也可译作“偿还”；原文动词可指完成或付清所许的愿。
    reason: lexical_alternative
  - marker: b
    text: “就”所对应的原文小词可表示强调，也可理解为“现在”或“确实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: 我所许的愿
  rationale: נֶדֶר指向神所许的愿或承诺；复数第一人称单数词尾表达“我的愿”。汉语用“我所许的愿”比直译“我的诸愿”自然，也没有擅自限定为祭物。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל标明许愿及履行承诺所指向的对象；神名יהוה按其专名译作“雅威”。
- source_word: אֲשַׁלֵּם
  choice: 履行
  rationale: שׁלם的Piel形式在此指完成、偿付所许之愿。“履行……所许的愿”既传达义务得到完成，也符合现代汉语表达。
- source_word: נֶגְדָה
  choice: 在……面前
  rationale: 该词表达面对某人或在其见证之下，点明履行誓愿的公开场合。
- source_word: נָא
  choice: 就
  rationale: 此处נָא较可能是加强语气的附着小词，而不是请求语气；“就在”自然地突出公开履行的场合，同时不把它误解为单纯的时间副词。
- source_word: לְכָל עַמּוֹ
  choice: 他所有的子民
  rationale: כָּל表达全体范围，עַמּוֹ为“他的民”；“他所有的子民”在现代汉语中清楚自然，并保留群体性的公共见证。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以专名形式呈现，不以称号替代，也不在经文中加入解释。
- issue: 履行誓愿的具体方式
  choice: 不具体说明是献祭还是其他行动
  alternative: 献上还愿祭
  rationale: 本节只说履行或偿付所许的愿，没有明确指出履行方式；译文保留这一开放性，避免将上下文可能包含的祭献含义写成明说。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“履行我向雅威所许的愿”避免生硬的“支付誓愿”，并保留原文关于具体还愿方式的含混；“就在……面前”凸显公开见证的场景。
