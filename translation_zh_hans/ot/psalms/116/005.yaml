  text: חַנּ֣וּן יְהֹוָ֣ה וְ/צַדִּ֑יק וֵ֖/אלֹהֵ֣י/נוּ מְרַחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/005.yaml
  text: Gracious is Yahweh[a], and righteous[b]; our God is compassionate.
translation:
  language: zh_hans
  text: 雅威有恩典，也公义[a]；我们的上帝满有怜悯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“公正”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“施怜悯”或“怜悯人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנּוּן
  choice: 有恩典
  rationale: 这是述谓形容词，描述雅威乐意施恩的性情。“有恩典”既保留恩惠与施恩的神学内涵，也比单纯译作“仁慈”更贴近原词。
- source_word: יְהֹוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文对以色列之上帝的专名指称。
- source_word: צַדִּיק
  choice: 公义
  rationale: 原词兼有道德正直与行事公正之意；“公义”适合本节赞美上帝属性的语境，同时不排除“公正”这一译法。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 保留第一人称复数所属后缀，呈现群体性的认信和关系。
- source_word: מְרַחֵם
  choice: 满有怜悯
  rationale: 该分词表达持续而具特征性的怜悯；“满有怜悯”在现代汉语中自然庄重，并保留持续性情的意味。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近其通常学术重构读音的“雅威”，而不以称号替代专名。
- issue: צַדִּיק 所表达的属性
  choice: 公义
  alternative: 公正
  rationale: “公义”较完整地涵盖道德正直和司法公正；脚注保留“公正”，避免把原词的语义范围限定为单一层面。
- issue: מְרַחֵם 是属性还是行动
  choice: 满有怜悯
  alternative: 施怜悯
  rationale: 分词既可刻画持续属性，也可突出反复行动；正文采用属性式表达，脚注保留行动式理解，不消除这一细微张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来文两组述谓结构及后半句“我们的上帝”的群体认信色彩；以“也”和分号使中文衔接自然。
