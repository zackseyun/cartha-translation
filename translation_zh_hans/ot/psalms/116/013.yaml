  text: כּוֹס יְשׁוּע֥וֹת אֶשָּׂ֑א וּ/בְ/שֵׁ֖ם יְהוָ֣ה אֶקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/013.yaml
  text: I will lift up the cup of salvations[a], and I will call on the name of Yahweh.
translation:
  language: zh_hans
  text: 我要举起救恩之杯[a]，求告雅威的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救恩”原文为复数，也可译作“诸般拯救”，可能是诗歌中加强语气的复数，也可能指上帝多次施行的拯救。
    reason: 保留יְשׁוּעוֹת的复数形态及其可能的语义范围。
lexical_decisions:
- source_word: כּוֹס
  choice: 杯
  rationale: 该词指饮用的器皿；“杯”是现代汉语中自然、庄重的对应词，也保留了诗句中的象征意味。
- source_word: יְשׁוּעוֹת
  choice: 救恩
  rationale: 原文为复数，字面可译“诸般拯救”；在这一诗歌结构中可能是加强语气的复数，也可能概括上帝多次施行的拯救。正文用自然的集合性单数“救恩”，并以脚注保留复数形态及其含义。
- source_word: אֶשָּׂא
  choice: 我要举起
  rationale: נשׂא可表示举起、抬起或携带；与“杯”搭配时，“举起”最符合这里的诗歌意象。
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  choice: 求告雅威的名
  rationale: קרא בשם是固定表达，在此指向上帝呼求、祷告，而非仅仅喊出或宣告其名；“求告……的名”准确而自然。连接词וּ在汉语并列句中无需机械译出。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留原文使用的专名，而不以称号替代。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名；“雅威”较贴近通常重建的读音，也避免以称号取代专名。
- issue: יְשׁוּעוֹת的复数含义
  choice: 正文译“救恩”，脚注说明原文为复数
  alternative: 诸般拯救；多次拯救
  rationale: 希伯来语复数可能具有诗歌性的加强作用，也可能指上帝多次施行的拯救。正文采用自然的汉语表达，脚注保留两种可能，不替原文消除其含义张力。
translation_notes:
  register: 采用现代、庄重且易懂的汉语。“举起……之杯”保留诗体凝练感；“求告雅威的名”沿用清楚的圣经表达，同时避免过度古雅。
