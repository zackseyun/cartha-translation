  text: כִּֽי הִטָּ֣ה אָזְנ֣/וֹ לִ֑/י וּ/בְ/יָמַ֥/י אֶקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/002.yaml
  text: Because he has inclined his ear to me[a], I will call on him in my days.
translation:
  language: zh_hans
  text: 因为他向我侧耳，我一生[a]都要求告他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在我的日子里”，意思是诗人有生之年都要继续求告耶和华。
    reason: 说明希伯来语时间表达的字面形式及语境含义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，说明诗人爱耶和华并向他呼求的原因；“因为”清楚表达因果关系。
- source_word: הִטָּה אָזְנוֹ לִי
  choice: 他向我侧耳
  rationale: 保留希伯来语“倾斜耳朵”的形象，表达留心聆听；“向我侧耳”在现代汉语中自然、庄重。
- source_word: וּבְיָמַי
  choice: 我一生
  rationale: 原文字面为“在我的日子里”，在此表示诗人在有生之年持续如此；“我一生”准确传达其时间范围。
- source_word: אֶקְרָא
  choice: 都要求告他
  rationale: קרא在祷告语境中可指向神呼求。原文未明说宾语，但由上下文可知对象是耶和华；补出“他”使汉语完整，“都要”与“一生”共同表达持续的决心。
