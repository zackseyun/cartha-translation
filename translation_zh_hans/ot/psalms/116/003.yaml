source:
  edition: WLC
  text: אֲפָפ֤וּ/נִי חֶבְלֵי מָ֗וֶת וּ/מְצָרֵ֣י שְׁא֣וֹל מְצָא֑וּ/נִי צָרָ֖ה וְ/יָג֣וֹן אֶמְצָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/003.yaml
  text: The cords of death encircled me[a], and the distresses of Sheol found me; I found trouble and sorrow.
translation:
  language: zh_hans
  text: 死亡的绳索缠绕着我，阴间[a]的困厄找到了我；我找到的是患难和愁苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“示奥勒”（Sheol），也可译作“坟墓”或“死者之境”。
    reason: 说明原文专有概念，并保留其可能的词义范围。
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: 缠绕着我
  rationale: 该动词表示环绕、包围；与“绳索”搭配时，“缠绕着我”既保留具体意象，也符合现代汉语表达。
- source_word: חֶבְלֵי מָוֶת
  choice: 死亡的绳索
  rationale: חֶבֶל 可指绳索；此处描绘死亡捆绑、围困人的力量。直译“绳索”可保留诗歌隐喻，避免解释成“网罗”。
- source_word: וּמְצָרֵי שְׁאוֹל
  choice: 阴间的困厄
  rationale: מֵצַר 含狭窄、逼迫、困境之意；“困厄”表达阴间带来的压迫与窘迫，又不把意象过度具体化。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל 指死者所在之境，不一定只是单个坟墓。“阴间”是现代中文圣经语境中较自然、宽泛的对应词，并以脚注保留其希伯来语概念及其他可能译法。
- source_word: מְצָאוּנִי
  choice: 找上了我
  rationale: 原义为“找到了我”。“找上了我”保留主动寻及的拟人化表达，也比直说“找到了我”更符合中文语感。
- source_word: צָרָה
  choice: 患难
  rationale: צָרָה 可指困苦、灾难或危难；“患难”简洁庄重，适合诗篇语体。
- source_word: וְיָגוֹן
  choice: 和愁苦
  rationale: יָגוֹן 表示悲伤、愁苦；“愁苦”与“患难”并列自然，并兼顾内在哀痛之意。
- source_word: אֶמְצָא
  choice: 我遇到
  rationale: 字面为“我找到”。中文若重复“找到”容易让人误解为主动寻找患难；“遇到”自然传达遭逢之意。虽然未完全复制希伯来语与 מְצָאוּנִי 的词根呼应，但前句“找上了我”仍保留了部分诗意关联。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死者之境
  rationale: “阴间”可指死者所在的领域，比“坟墓”宽泛，也不把经文直接解释为后世某一套来世教义。脚注注明原文词语及替代译法，以保留其宇宙观和神学含义的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“死亡的绳索”保留原文具体隐喻；“找上了我”带有拟人色彩，并与末句“我遇到”形成自然的语义呼应。脚注标记紧接“阴间”，准确对应所解释的词。
