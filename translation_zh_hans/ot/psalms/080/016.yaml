  text: שְׂרֻפָ֣ה בָ/אֵ֣שׁ כְּסוּחָ֑ה מִ/גַּעֲרַ֖ת פָּנֶ֣י/ךָ יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/016.yaml
  text: Burned with fire, cut down—at the rebuke of your face they perish.
translation:
  language: zh_hans
  text: 被火焚烧，被砍伐——他们因你面容所发出的斥责而灭亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂרֻפָה בָאֵשׁ
  choice: 被火焚烧
  rationale: 保留阴性单数被动分词的受害状态及“用火”的明确意象；中文不强行补出主语，使其自然承接上文的葡萄树。
- source_word: כְּסוּחָה
  choice: 被砍伐
  rationale: 表达该阴性单数被动形式所指的砍除、截断，且与前句构成平行。
- source_word: מִגַּעֲרַת פָּנֶיךָ
  choice: 因你面容的斥责
  rationale: 保留 מִן 的因果意味，也保留“你面容的斥责”这一具体而强烈的希伯来表达，不淡化为泛指的愤怒。
- source_word: יֹאבֵדוּ
  choice: 他们就灭亡
  rationale: 按复数未完成式译出“他们”，保留原文从前两个阴性单数形式转为复数谓语的张力，不擅自统一为单数。
theological_decisions:
- issue: 复数“他们”的所指
  choice: 保留“他们”，不明确指认对象
  alternative: 译作“它就灭亡”或明确为“你的百姓灭亡”
  rationale: 马所拉文本 יֹאבֵדוּ 为复数，而前文葡萄树意象及本节语法之间存在张力；译文不替原文消解这种含混。
- issue: “你面容的斥责”的神学意象
  choice: 直译保留“面容”与“斥责”
  alternative: 意译为“因你的怒气”
  rationale: “面容”在本诗中与求神使脸发光的祈求形成重要呼应，不能省略。
translation_notes:
  register: 采用庄重而现代的普通话。“焚烧—砍伐—灭亡”保持短促、强烈的诗行节奏；破折号呈现前两项状态与后面结果之间的推进关系。
