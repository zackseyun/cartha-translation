  text: יְהוָ֣ה אֱלֹהִ֣ים צְבָא֑וֹת עַד מָתַ֥י עָ֝שַׁ֗נְתָּ בִּ/תְפִלַּ֥ת עַמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/004.yaml
  text: O Yahweh God of hosts[a], how long will you smoke against the prayer of your people?
translation:
  language: zh_hans
  text: 雅威，万军之上帝啊，你向你子民的祷告发怒，怒气如烟上腾，要到几时呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现上帝的专名，不以“主”这一称号替代。
- source_word: אֱלֹהִים צְבָאוֹת
  choice: 万军之上帝
  rationale: 保留“万军”的军事及宇宙性意象，同时不限定所指是地上的军队还是天上的众军。
- source_word: עַד מָתַי
  choice: 要到几时呢
  rationale: 采用现代汉语哀歌中自然有力的问法，保留原文急切质问的语气。
- source_word: עָשַׁנְתָּ
  choice: 怒气冒烟
  rationale: 原动词本义涉及冒烟，在此以拟人化意象表达震怒；译文兼顾汉语可懂度并保留“烟”的诗性画面。
- source_word: בִּתְפִלַּת
  choice: 向……的祷告
  rationale: 介词 ב 在此随“冒烟／发怒”取针对、敌对关系，表示怒气所向。
- source_word: עַמֶּךָ
  choice: 你子民
  rationale: 表达盟约群体归属于上帝的含义，也保留群体共同哀求的层面。
theological_decisions:
- issue: 如何翻译 יְהוָה אֱלֹהִים צְבָאוֹת
  choice: 雅威，万军之上帝啊
  alternative: 耶和华万军之神啊
  rationale: 直接呈现神名，并将后面的称号作为同位语；“万军”保留原称号的广度，不武断限定为某一类军队。
- issue: 是否保留“冒烟”这一愤怒隐喻
  choice: 你向你子民的祷告怒气冒烟
  alternative: 你向你子民的祷告发怒
  rationale: 保留原文鲜明的拟人化意象及哀歌中的神学张力；脚注同时提供较平实的理解，避免读者误把“冒烟”当作字面现象。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“怒气冒烟”有意保留希伯来诗歌的陌生而强烈的意象；语序稍具诗性，但整体仍自然清楚。
