  text: תְּֽהִי יָ֭דְ/ךָ עַל אִ֣ישׁ יְמִינֶ֑/ךָ עַל בֶּן אָ֝דָ֗ם אִמַּ֥צְתָּ לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/017.yaml
  text: Let your hand be upon the man of your right hand[b][a], upon the son of man whom you have made strong for yourself.
translation:
  language: zh_hans
  text: 愿你的手临到你右手边的人[a]，临到你为自己所坚固的人子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“你右手的人”或“在你右手边的人”。这个希伯来语表达可指蒙神特别眷顾、扶持的人，也可指被安置在神右手边的人。
    reason: lexical_alternative
  - marker: b
    text: “人子”在这里可以泛指“人”或“凡人”，但在圣经语境中也可能带有君王或弥赛亚的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִי
  choice: 愿……
  rationale: 未完成式在此具有祈愿语气；“愿”自然地表达诗歌中的祈求。
- source_word: יָדְךָ
  choice: 你的手
  rationale: 保留具体的“手”这一意象，让它所含的能力、眷顾和扶助之意由上下文呈现。
- source_word: עַל
  choice: 扶持
  rationale: עַל本义为“在……上、临到”；与“手”搭配并结合本诗的求助语境，译作“扶持”符合现代汉语，同时保留神主动施力的意思。
- source_word: אִישׁ יְמִינֶךָ
  choice: 你右手边的人
  rationale: 表达此人同神的右手有特殊关联，同时避免把这种关联限定为地理位置、恩宠、支持或权柄中的某一种；希伯来语较直译的说法及其歧义在脚注说明。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留单数男性表达及其诗歌、王权和潜在弥赛亚回响，但不在正文中把它明确处理为专名或称号。
- source_word: אִמַּצְתָּ
  choice: 你……所坚固的
  rationale: אמץ的Piel形态表示使之刚强、坚定；“坚固”兼顾使强壮与使稳固的含义。
- source_word: לָּךְ
  choice: 为自己
  rationale: 体现介词加第二人称后缀在此所表达的归属或目的关系，即神为自己坚固此人。
theological_decisions:
- issue: “你右手边的人”与“人子”是否应明确译成弥赛亚称号
  choice: 保留为含有王权或弥赛亚可能回响的诗性人物称谓，不加专名化或解释性扩写
  alternative: 明确译为“弥赛亚”，或明确解释为以色列群体
  rationale: 本节在直接语境中可指神所拣选、扶持的代表人物，也可能具有群体、君王或弥赛亚层面的理解；希伯来文本本身没有要求译者排除其他可能，因此正文保留其神学张力。
translation_notes:
  register: 采用现代、庄重的祈祷诗体。“扶持”按语境传达神之手积极施助的作用；两个平行分句都保留动词，使普通读者易于把握结构。“人子”不加书名号、引号或专名化处理，以免预先裁定其所指。
