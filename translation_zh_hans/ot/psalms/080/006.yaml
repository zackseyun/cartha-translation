  text: תְּשִׂימֵ֣/נוּ מָ֭דוֹן לִ/שְׁכֵנֵ֑י/נוּ וְ֝/אֹיְבֵ֗י/נוּ יִלְעֲגוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/006.yaml
  text: You make us a cause of strife to our neighbors, and our enemies mock them.
translation:
  language: zh_hans
  text: 你使我们成了邻邦争斗的缘由；我们的仇敌都嘲笑他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”：希伯来原文如此，所指不明确；有古译本作“我们”。
    reason: 说明马所拉文本末尾第三人称复数代词的指代歧义，并交代古代文本传统的异读。
lexical_decisions:
- source_word: מָדוֹן
  choice: 争斗的对象
  rationale: 该词指争端、争执；结合“使我们成为……”的句式，译为“争斗的对象”自然表达以色列成了邻邦争竞或纷争的缘由，同时不具体限定争斗方式。
- source_word: לִשְׁכֵנֵינוּ
  choice: 邻邦
  rationale: 字面为“我们的邻居”；在民族共同体的语境中指周边民族或国家，译作“邻邦”较符合现代汉语诗体。
- source_word: יִלְעֲגוּ
  choice: 嘲笑
  rationale: 准确传达该动词“讥笑、嘲弄”的含义。
- source_word: לָמוֹ
  choice: 他们
  rationale: 马所拉文本是第三人称复数形式，直译为“他们”；具体所指并不明确，因此保留原文的人称及其张力，不按部分古译本改成“我们”。
theological_decisions:
- issue: 末尾代词לָמוֹ的所指
  choice: 译作“他们”，并以脚注说明所指不明确
  alternative: 依据部分古译本译作“我们”
  rationale: WLC的辅音及元音文本支持第三人称复数“他们”，但上下文容易期待“我们”。正文遵从希伯来文本，脚注呈现文本传统差异，不擅自消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“邻邦”体现群体和国际语境；分号保留两行诗意之间紧密并列的关系。
