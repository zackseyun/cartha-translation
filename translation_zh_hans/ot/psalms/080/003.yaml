  yaml_path: translation/ot/psalms/080/003.yaml
  text: God[a], restore us, and make your face shine[c][b], that we may be saved.
translation:
  language: zh_hans
  text: 上帝啊，求你使我们回转[a]，使你的脸发光[b]，好使我们得救[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我们回转”也可译作“使我们归回”或“复兴我们”。原文动词是使役形式，可指使人返回、回转，也可在此语境中指恢复原状。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“使你的脸发光”。这是上帝临在并施恩的意象；参民数记6:25中祭司祝福的用语。
    reason: cross_reference
  - marker: c
    text: 也可译作“我们就必得救”。原文形式可理解为祈求这样的结果，也可理解为确信这一结果。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为形态上的复数形式，却单数地指以色列的上帝，并在句中作直接呼语。“上帝啊”自然明确地表达呼求语气。
- source_word: הֲשִׁיבֵנוּ
  choice: 使我们回转
  rationale: שוב的使役式命令表达“使我们返回／回转”。“使我们回转”保留使役意义，也保留可能指归回上帝或恢复原状的语义张力。
- source_word: וְהָאֵר
  choice: 使……光照
  rationale: אור的使役式命令意为“使发光、使照耀”；结合“你的脸”，译成“使你的脸光照我们”既保留原文意象，也符合现代汉语表达。
- source_word: פָּנֶיךָ
  choice: 你的脸
  rationale: 直译为“你的脸”。这意象可指上帝的临在与恩宠，并与祭司祝福的措辞相呼应；不直接意译为“恩待”或“临在”，以免消解诗歌意象。
- source_word: וְנִוָּשֵׁעָה
  choice: 我们就必得救
  rationale: 该词为ישׁע的被动式第一人称复数意愿形，可表达所祈求的结果，也可听作对结果的确信。“我们就必得救”在汉语中自然承接前面的祈求，同时保留较强的结果意味；另一种理解在脚注中说明。
theological_decisions:
- issue: 末句意愿式与前面命令式之间的关系
  choice: 译作“我们就必得救”，表达上帝使人回转并施恩之后的结果。
  alternative: “好使我们得救”，把末句理解为祈求的目的或所盼望的结果。
  rationale: 希伯来语的连接词加第一人称复数意愿形，既可在祈祷语境中表示所求的结果，也可带出对此结果的确信。正文采用简洁的结果句，脚注保留目的／祈愿式理解，不把语法张力单向化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上帝啊，求你……”明确诗篇祈祷的呼语与请求语气；保留“脸光照”的圣经诗歌意象，并以脚注解释其含义。末句使用现代读者易懂的“得救”，避免将其窄化为单一类型的解救。
