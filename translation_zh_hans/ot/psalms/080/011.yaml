  yaml_path: translation/ot/psalms/080/011.yaml
  text: It sent out its branches as far as the sea[b][a], and its shoots to the River.
translation:
  language: zh_hans
  text: 它把枝条[a]伸展到海；把嫩枝伸到那大河[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “枝条”所译的希伯来词在这里较罕见，也可能泛指葡萄树蔓生的部分。
    reason: lexical_alternative
  - marker: b
    text: “那大河”很可能指幼发拉底河；“从海到大河”的表达呼应以色列疆域的理想范围。
    reason: cross_reference
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: 伸展
  rationale: 此处为使役加强词形，在葡萄树意象中描写枝条向外延伸；“伸展”符合现代汉语表达，也保留主动扩张的画面。
- source_word: קְצִירֶהָ
  choice: 枝条
  rationale: 该词在此较罕见，虽通常与“收割”相关，但在葡萄树的诗歌语境中应指它长出的枝干或蔓生部分；“枝条”自然，并与下句“嫩枝”形成平行。[a]注明其不确定性。
- source_word: עַד יָם
  choice: 直达海边
  rationale: עַד表示延伸所达到的界限；“直达”传达范围，“海边”在汉语中比“到海”更自然。这里的海很可能是地中海。
- source_word: וְאֶל נָהָר
  choice: 伸到那大河
  rationale: 该短语在应许之地疆界用语中通常指幼发拉底河；译作“那大河”既提示特定所指，又不把解释直接写成专名。
- source_word: יוֹנְקוֹתֶיהָ
  choice: 嫩枝
  rationale: 该词指新生的旁枝或幼芽；“嫩枝”既清楚自然，也保留葡萄树蓬勃生长的意象。
theological_decisions:
- issue: “海”与“大河”所暗示的疆域范围
  choice: 正文保留诗性的地理称谓，并以脚注说明其很可能分别指地中海和幼发拉底河。
  alternative: 在正文直接译作“地中海”和“幼发拉底河”。
  rationale: 原文只写“海”和“河”；保留原有措辞可避免把虽高度可能、却仍属解释性的辨认写死，同时呈现以色列疆域理想范围的呼应。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两个分句保持希伯来诗歌的平行结构，并补出第二分句省略的动词“伸到”。正文中的[a]、[b]均有对应脚注。
