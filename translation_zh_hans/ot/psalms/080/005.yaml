  text: You have fed them bread of tears[a], and given them tears to drink in full measure.
translation:
  language: zh_hans
  text: 你使他们吃眼泪的饼，又给他们满量的眼泪喝[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “满量”所译的希伯来语含义不确定，也可理解为“按第三量器”或“三倍的分量”；该词很可能指大量的分量。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱכַלְתָּם
  choice: 你使他们吃
  rationale: 使役形明确表达“使他们吃”；此处是在祷告中直接对上帝说话，中文用“你”自然地保留第二人称单数。
- source_word: לֶחֶם דִּמְעָה
  choice: 眼泪的饼
  rationale: 保留“饼”与“眼泪”的鲜明隐喻及两行之间吃、喝的平行结构，不泛化为“食物”。
- source_word: וַתַּשְׁקֵמוֹ
  choice: 又给他们……喝
  rationale: שׁקה 的使役形可指“给……喝”或“使……喝”；中文这样表达自然，同时保留使役含义。
- source_word: בִּדְמָעוֹת
  choice: 眼泪
  rationale: 介词在饮用语境中标明所喝之物；中文直接说“给他们眼泪喝”最自然。
- source_word: שָׁלִישׁ
  choice: 满满一量器
  rationale: 该词在本节可能指某种容量较大的量器，确切容量不明。“满满一量器”保留量器意象及泪水丰多的语意，又避免虚构具体单位。
theological_decisions: []
