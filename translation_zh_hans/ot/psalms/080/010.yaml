  text: כָּסּ֣וּ הָרִ֣ים צִלָּ֑/הּ וַ֝/עֲנָפֶ֗י/הָ אַֽרְזֵי אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/010.yaml
  text: The mountains were covered by its shade[a], and its branches were like the cedars of God.
translation:
  language: zh_hans
  text: 群山被它的荫影遮盖；上帝的香柏树[b]也被它的枝条遮盖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “上帝的香柏树”也可理解为“高大的香柏树”，即格外雄伟的香柏树。
    reason: “上帝的……”在希伯来语中可能是表示卓越、宏伟的说法；正文保留字面表达，以保留其可能的归属或庄严意味。
lexical_decisions:
- source_word: כָּסּוּ
  choice: 被……遮盖
  rationale: כסה的Qal完成式第三人称复数在本句中表达“遮盖”。结合诗句的倒装和并行结构，用汉语被动式自然呈现群山和香柏树受到葡萄树荫影、枝条覆盖的图景。
- source_word: הָרִים
  choice: 群山
  rationale: 复数名词，意为“山岭、群山”；“群山”简洁而有诗体感。
- source_word: צִלָּהּ
  choice: 它的荫影
  rationale: צֵל可指阴影或荫蔽之处。这里延续葡萄树枝叶扩展的意象，“荫影”兼顾可见的阴影和遮荫之意。
- source_word: וַעֲנָפֶיהָ
  choice: 也被它的枝条遮盖
  rationale: עָנָף意为树枝、枝条。按两个半句的平行关系，将前句的“遮盖”补入后句；“也”清楚表达并列。
- source_word: אַרְזֵי אֵל
  choice: 上帝的香柏树
  rationale: 直译该组合词，保留אֵל及其可能表达归属、庄严或最高程度的开放性；另以脚注说明也可理解为“高大的香柏树”。
theological_decisions:
- issue: אַרְזֵי אֵל中אֵל的含义
  choice: 正文保留“上帝的香柏树”
  alternative: 高大的香柏树
  rationale: 希伯来语有时以神名构成表示卓越或宏伟的说法，但此处也可保留与上帝直接相关的意象。直译可避免在正文中提前排除任何一种理解。
- issue: 后半句与כָּסּוּ的句法关系
  choice: 将“遮盖”补入后半句：上帝的香柏树也被它的枝条遮盖
  alternative: 它的枝条如同上帝的香柏树
  rationale: 希伯来文没有“如同”一词；把前面的动词延续到后半句，能形成“群山—荫影 / 香柏树—枝条”的平行结构，也符合葡萄树蔓延覆盖大地的上下文。不过，传统上也有人把后半句理解为枝条与香柏树相比，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“群山”“荫影”“香柏树”保留原诗宏阔的植物与地貌意象；补出的“被……遮盖”和“也”使希伯来诗的并行关系在汉语中清楚自然。
