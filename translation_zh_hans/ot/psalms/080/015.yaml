  text: וְ֭/כַנָּה אֲשֶׁר נָטְעָ֣ה יְמִינֶ֑/ךָ וְ/עַל בֵּ֝֗ן אִמַּ֥צְתָּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/015.yaml
  text: and the stock that your right hand planted[b][a], and the son whom you made strong for yourself—
translation:
  language: zh_hans
  text: 你右手所栽种的根株[a]，和你为自己所使之强壮的儿子[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “根株”或译“嫩芽”、“枝条”或“砧木”。原文用词罕见，出现在本诗的葡萄树意象中。
    reason: lexical_alternative
  - marker: b
    text: “儿子”或理解为“枝条”。希伯来原文作“儿子”，但有人按葡萄园意象作比喻理解，或认为这是群体性地指以色列。
    reason: alternative_reading
lexical_decisions:
- source_word: כַנָּה
  choice: 根株
  rationale: 这是罕见名词，位于葡萄树的比喻中。“根株”既符合植物意象，又不武断限定为嫩枝或枝条。
- source_word: נָטְעָה
  choice: 栽种
  rationale: 保留נטע常见的农业含义，并延续本诗的葡萄树意象。
- source_word: יְמִינֶךָ
  choice: 你右手
  rationale: 直译拟人化表达，保留上帝亲自施展能力的形象，不将其抽象化为“能力”。
- source_word: וְעַל
  choice: 和
  rationale: 此处承接上文支配两个平行对象；汉语用“和”自然协调“根株”与“儿子”，而不补入原文此节没有重复出现的动词。
- source_word: בֵּן
  choice: 儿子
  rationale: 保留该词通常的字面义及其在葡萄树意象中形成的人格化、群体性张力，不直接改译成植物术语。
- source_word: אִמַּצְתָּה
  choice: 坚固
  rationale: 表达אמץ的使役含义，即使其强壮、稳固；“所坚固的”简洁庄重，也能与对象“儿子”自然搭配。
- source_word: לָּךְ
  choice: 为自己
  rationale: 体现与格所含的归属或受益意味，表明这是上帝为自己的旨意而坚固的。
theological_decisions:
- issue: 葡萄树比喻中“儿子”的身份
  choice: 正文保留“儿子”，不明确指定其为某一弥赛亚人物。
  alternative: 可按葡萄园意象理解为“枝条”，或按群体意义理解为以色列，也可作预表性、弥赛亚式解读。
  rationale: 上下文以葡萄树象征以色列，但希伯来原文确实使用“儿子”。保留这一称谓既忠于原文，也不提前消除群体比喻与后续神学解读之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留本节承接上文的片段式结构，并以破折号显示诗句尚向后延展；不擅自补出上节的支配动词。
