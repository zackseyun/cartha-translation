  text: אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ וְ/הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/007.yaml
  text: God of hosts[a], restore us; make your face shine[c][b], and we will be saved.
translation:
  language: zh_hans
  text: 万军之神[a]啊，求你使我们回转[b]；愿你的脸发光[c]，使我们得救[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军”可指众军或天上的众军，强调神统管一切权能。
    reason: lexical_alternative
  - marker: b
    text: 或译“使我们归回”或“使我们复原”。原文动词兼有返回、回转和恢复的含义。
    reason: lexical_alternative
  - marker: c
    text: 直译“你的脸”。这是表示神恩慈临在和眷顾的惯用说法。
    reason: lexical_alternative
  - marker: d
    text: 或译“使我们蒙解救”。原文可泛指获救或得蒙拯救。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: 万军之神
  rationale: 这是对以色列之神的直接呼求。“万军”保留 צְבָאוֹת 所指众军、天上众军及各样权能的宽广内涵，不把称号局限于人间军队。
- source_word: הֲשִׁיבֵנוּ
  choice: 使我们回转
  rationale: שוב 的使役式意为“使我们返回／回转”，在本诗的副歌中也可包含恢复、复兴之意。“使我们回转”既保留动作意象，也不限定为地理、属灵或盟约意义上的归回。
- source_word: וְהָאֵר פָּנֶיךָ
  choice: 使你的脸发光
  rationale: הָאֵר 是使役形式，意为“使……发光”；פָּנֶיךָ 直译为“你的脸”。保留这一具体的希伯来语意象，以表达神恩慈的临在与眷顾。
- source_word: וְנִוָּשֵׁעָה
  choice: 我们就必得救
  rationale: ישׁע 的被动形式在此表示因神施恩而获救。“得救”可涵盖广义的拯救与解救，不把经文限制为现世脱险或属灵救恩中的某一种。
theological_decisions:
- issue: 神圣称号 אֱלֹהִים צְבָאוֹת 的译法
  choice: 万军之神
  alternative: 众军之神／天军之神
  rationale: “万军之神”保留神统管一切权能的含义和称号的庄重感，同时不把“军”仅理解为人间军队。
- issue: הֲשִׁיבֵנוּ 所表达的归回与恢复
  choice: 使我们回转
  alternative: 使我们复原／使我们归回
  rationale: 原文可以表达使人返回，也可在语境中表示恢复。正文保留“回转”的动作与神主动施行的意味，脚注说明“恢复”的可能性，不将其单独解释为悔改或复国。
- issue: וְנִוָּשֵׁעָה 中拯救的范围
  choice: 我们就必得救
  alternative: 我们就必蒙解救
  rationale: 原文可泛指获救、脱险或蒙拯救；“得救”保留其广阔的圣经神学内涵，却不排除本诗所关切的历史性解救。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体；以“求你”自然表达希伯来语祈使句在向神呼求时的语气。保留“脸发光”这一核心圣经意象，并用脚注解释其含义。
