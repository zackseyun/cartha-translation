  text: יְכַרְסְמֶ֣/נָּֽה חֲזִ֣יר מִ/יָּ֑ וְ/זִ֖יז שָׂדַ֣י יִרְעֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/013.yaml
  text: A boar from the forest tears it down[b][a], and the wild animals of the field feed on it.
translation:
  language: zh_hans
  text: 林中的野猪把它啃毁[a]，田野的走兽以它为食[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“糟蹋它”。原文动词较罕见，指动物啃食、剥食而造成毁坏。
    reason: lexical_alternative
  - marker: b
    text: 或译“田野的野兽在它上面吃草”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  choice: 把它啃毁
  rationale: 罕见动词 כרסם 描写动物以啃食、剥食造成毁坏；“啃毁”既保留进食动作，也传达葡萄树遭破坏的结果。
- source_word: חֲזִיר
  choice: 野猪
  rationale: חֲזִיר 可指猪或野猪；“从林中来”的语境明确指野生动物，译作“野猪”自然准确。
- source_word: מִיָּעַר
  choice: 林中的
  rationale: 介词 מִן 表示来源；汉语用“林中的野猪”简洁自然地表达“从森林而来的野猪”。
- source_word: זִיז
  choice: 走兽
  rationale: זִיז 是较少见的动物称谓，可能着重于活动的生物；在田野语境中，“走兽”保留其动物性与集合性，又比直译“活动之物”自然。
- source_word: שָׂדַי
  choice: 田野的
  rationale: 构词形式表示“田野／旷野的”；“田野的走兽”保留原文意象，也符合现代汉语。
- source_word: יִרְעֶנָּה
  choice: 以它为食
  rationale: רעה 在此指吃草或取食，阴性宾语后缀回指前文的葡萄树；“以它为食”既适用于野兽，也不把动作过度限定为温和的放牧。
