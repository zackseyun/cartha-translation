source:
  edition: WLC
  text: אֱלֹהִ֣ים צְבָאוֹת֮ שֽׁ֫וּב נָ֥א הַבֵּ֣ט מִ/שָּׁמַ֣יִם וּ/רְאֵ֑ה וּ֝/פְקֹ֗ד גֶּ֣פֶן זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/014.yaml
  text: God of hosts[a], please return; look down from heaven and see, and visit this vine.
translation:
  language: zh_hans
  text: '万军之神啊，求你回转！

    求你从天上垂看、察看，

    眷顾这葡萄树[a]！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷顾”或译“探访”“照料”或“察验”。希伯来语动词在这里指关注这葡萄树，并为它的益处介入。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: 万军之神
  rationale: 保留“军旅、众军”这一神圣称号的军事与宇宙性意象，不以解释性较强的“全能的神”取代。
- source_word: שׁוּב נָא
  choice: 求你回转
  rationale: “回转”保留שׁוּב既可指返回、也可指转而面向百姓的含义；“求你”自然表达נָא的恳求语气。
- source_word: הַבֵּט מִשָּׁמַיִם
  choice: 求你从天上垂看
  rationale: “垂看”自然表达从天上向下观看，也保持祷告诗庄重而易懂的语体。
- source_word: וּרְאֵה
  choice: 察看
  rationale: 与前面的“垂看”构成诗性递进，既保留“看见”的基本意义，也避免现代汉语中“看、看”连续出现的生硬感。
- source_word: וּפְקֹד
  choice: 眷顾
  rationale: פקד语义范围包括探访、关注、照料和察验；本节祈求上帝为葡萄树的益处介入，“眷顾”在现代中文中简洁、庄重且符合语境，同时以脚注保留其他可能含义。
- source_word: גֶּפֶן זֹאת
  choice: 这葡萄树
  rationale: 原文是单数“葡萄树”，并非“葡萄园”；如此译法准确延续本诗以葡萄树象征以色列的比喻。
theological_decisions:
- issue: 上帝称号的译法
  choice: 万军之神
  alternative: 全能的神
  rationale: 原文称号着重上帝统领众军；“万军之神”保留这一具体意象，避免把它概括成另一个较宽泛的神圣属性。
- issue: פקד所表达的介入性质
  choice: 眷顾
  alternative: 探访／察验
  rationale: 语境是一篇为遭破坏的葡萄树所作的哀求，因此正面照料的含义最为合适；脚注仍保留该动词本有的宽广语义，不把它限定为某种特定教义。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告诗语体。“垂看、察看、眷顾”保留原文连续三个祈使动作的节奏；分行呈现希伯来诗歌的呼求与递进。
