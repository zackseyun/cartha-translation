  text: לִ/פְנֵ֤י אֶפְרַ֨יִם וּ/בִנְיָ֘מִ֤ן וּ/מְנַשֶּׁ֗ה עוֹרְרָ֥/ה אֶת גְּבֽוּרָתֶ֑/ךָ וּ/לְכָ֖/ה לִ/ישֻׁעָ֣תָ/ה לָּֽ/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/002.yaml
  text: Before Ephraim and Benjamin and Manasseh[b][a], stir up your might and come to save us.
translation:
  language: zh_hans
  text: 在以法莲、便雅悯和玛拿西面前，求你唤起你的大能[a]，前来拯救我们！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能”也可译作“力量”或“威力”。
    reason: lexical_alternative
  - marker: b
    text: “前来拯救我们”也可译作“去为我们施行拯救”；“前来”所对应的希伯来语动词字面意思是“走、去”，在这里是求上帝采取行动、拯救他的子民。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留希伯来语的空间性表达，可指上帝在这些支派面前显现或行进；中文自然且不额外限定具体图景。
- source_word: אֶפְרַיִם וּבִנְיָמִן וּמְנַשֶּׁה
  choice: 以法莲、便雅悯和玛拿西
  rationale: 采用现代中文圣经语境中通行的专名译写，并以自然的中文并列形式呈现。
- source_word: עוֹרְרָה
  choice: 唤起
  rationale: 该祈使形式有唤醒、激发之意；“唤起”保留使力量发动起来的隐喻，也符合祷告语体。
- source_word: אֶת גְּבוּרָתֶךָ
  choice: 你的大能
  rationale: גְּבוּרָה可指能力、力量、威力；“大能”简洁庄重，在向上帝祈求的语境中自然。
- source_word: וּלְכָה
  choice: 前来
  rationale: 字面源自动词“走、去”；但此处是向上帝发出的祈求，结合“为我们施行拯救”，译作“前来”自然表达上帝向祈求者采取行动，同时以脚注保留字面可能。
- source_word: לִישֻׁעָתָה לָּנוּ
  choice: 拯救我们
  rationale: 该结构字面近于“为我们得救援/为了我们的拯救”；在中文中以动词短语表达其目的关系，清楚而自然。
theological_decisions:
- issue: 祷告中上帝行动的表达
  choice: 译为“求你唤起你的大能，前来拯救我们”
  alternative: “唤起你的力量，为我们的拯救而去”
  rationale: 本节是恳求上帝彰显能力并介入施救的祷告。正文传达其迫切性，却不将祈求扩展为额外的教义陈述；脚注保留动词“走、去”的字面张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”使希伯来语祈使式在中文祷告中自然呈现；末尾感叹号体现呼求的迫切，但不增加原文命题内容。
