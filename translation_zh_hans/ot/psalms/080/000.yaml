lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 这是诗篇题注中的常见格式，指交给负责音乐演奏或歌唱的人；“乐长”简洁、庄重，也不限于现代意义上的合唱指挥。
- source_word: אֶל
  choice: 调用
  rationale: 在诗篇题注中，这个介词很可能引出曲调或演唱方式。“调用”自然地表达按某一既定曲调演唱，同时不把具体音乐功能说得过满。
- source_word: שֹׁשַׁנִּים
  choice: 《百合花》
  rationale: 字面意思是“百合花”，此处很可能是曲调或礼仪名称；使用书名号表明它在题注中具有标题性质，而不是正文中的花卉意象。
- source_word: עֵדוּת
  choice: 见证
  rationale: 保留该名词的基本意义及其独立、简短的题注形式，不擅自判定它是诗歌体裁、礼仪说明，还是与前面的曲调名称连读。
- source_word: לְאָסָף
  choice: 亚萨的
  rationale: 希伯来语介词可表示作者、归属、关联或收集关系；汉语“亚萨的”保留这种归属上的宽泛性，不强行断定作者身份。
- source_word: מִזְמוֹר
  choice: 诗歌
  rationale: 这是用于歌唱并有乐器伴奏的诗篇体裁名称；“诗歌”在题注中自然清楚，并与“亚萨的”连成流畅短语。
theological_decisions:
- issue: לְאָסָף 所表示的关系
  choice: 译作“亚萨的”，不明确断定为亚萨亲自创作
  alternative: 亚萨所作的
  rationale: 原文可指作者、所属传统、合集或演唱关联；译文应保留这种真实歧义。
- issue: עֵדוּת 与前后词语的句法关系
  choice: 将“见证”单列，并用脚注说明
  alternative: 并入曲调名《百合花·见证》或译作“见证诗”
  rationale: 题注中的音乐和礼仪术语含义不确定；单列最能避免无根据地确定其功能。
translation_notes:
  register: 采用现代、庄重而简洁的诗篇题注体。“乐长”适合礼仪语境；《百合花》以标题形式呈现。“见证”刻意保持独立和略带技术性的表达，并由脚注交代其不确定性。
