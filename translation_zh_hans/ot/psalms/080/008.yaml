source:
  edition: WLC
  text: גֶּ֭פֶן מִ/מִּצְרַ֣יִם תַּסִּ֑יעַ תְּגָרֵ֥שׁ גּ֝וֹיִ֗ם וַ/תִּטָּעֶֽ/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/008.yaml
  text: You brought a vine out of Egypt[b][a]; you drove out nations and planted it.
translation:
  language: zh_hans
  text: 你从埃及移来一棵葡萄树[b][a]；你赶出列国，把它栽下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你使一棵葡萄树从埃及启程”，或“你从埃及拔出一棵葡萄树”。原文动词可以表示使之出发，也可以表示拔起、迁移或移植。
    reason: lexical_alternative
  - marker: b
    text: “葡萄树”比喻以色列。
    reason: cross_reference
lexical_decisions:
- source_word: גֶּפֶן
  choice: 一棵葡萄树
  rationale: 该词指葡萄藤或葡萄树，此处以葡萄树比喻以色列；中文用“一棵葡萄树”自然保留这一意象，不在正文中直接点明所指。
- source_word: מִמִּצְרַיִם
  choice: 从埃及
  rationale: 介词表示来源；“从埃及”准确自然，并保留出埃及的语境。
- source_word: תַּסִּיעַ
  choice: 移来
  rationale: נסע 的使役式可表示使之启程、拔起或迁移。结合葡萄树从埃及被带到另一处栽种的意象，“移来”既体现迁移，也与后文“栽下”自然衔接，同时不完全消除原词的多重意味。
- source_word: תְּגָרֵשׁ
  choice: 赶出
  rationale: גרש 的加强式表示驱逐、赶走；“赶出”简明有力，符合列国被逐出土地的语境。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 该词在这里指诸民族或诸国。“列国”庄重而常见，也避免使用带有后期特定宗教对照意味的称呼。
- source_word: וַתִּטָּעֶהָ
  choice: 把它栽下
  rationale: 动词意为“栽种”，阴性后缀回指阴性名词“葡萄树”。现代汉语用“它”指植物自然；“栽下”也传达使其在当地扎根的动作。
theological_decisions:
- issue: 葡萄树这一比喻的所指
  choice: 正文保留“葡萄树”的比喻，并在脚注说明它指以色列。
  alternative: 在正文中直接译为“以色列”。
  rationale: 希伯来文以葡萄树呈现以色列；若在正文中直接替换为“以色列”，就会把解释写进译文并损失原有意象。
- issue: תַּסִּיעַ 的语义张力
  choice: 译作“移来”，脚注列出“使……启程”和“拔出”等可能含义。
  alternative: 单译为“带出”或“拔出”。
  rationale: 该使役动词既可能强调使之出发，也可能在植物意象中暗示拔起、移植。“移来”适合上下文，但用脚注保留词义上的真实歧义。
- issue: 回指葡萄树的代词
  choice: 使用“它”。
  alternative: 使用“她”。
  rationale: 希伯来语阴性后缀源于名词的语法性别，并不必然构成拟人；现代汉语通常以“它”指植物，表达自然且不额外强化拟人化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“移来……栽下”维持整节的移植意象；脚注标记顺序依照所给英文审定层，在正文中写作[b][a]，且两个标记均有对应脚注。
