  text: פִּנִּ֥יתָ לְ/פָנֶ֑י/הָ וַ/תַּשְׁרֵ֥שׁ שָׁ֝רָשֶׁ֗י/הָ וַ/תְּמַלֵּא אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/009.yaml
  text: You cleared the ground before it[c][b][a], and it took root and filled the land.
translation:
  language: zh_hans
  text: 你为它清出了地方[a]；它扎下根来[b]，充满了那地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你为它腾出了地方。”希伯来语动词可表示清除障碍或预备空间。
    reason: lexical_alternative
  - marker: b
    text: 直译：“它使自己的根扎根。”这是重复词根的希伯来语表达，表示它牢固地扎下了根。
    reason: lexical_alternative
  - marker: c
    text: “那地”也可译为“大地”；希伯来词的范围须由上下文判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּנִּיתָ לְפָנֶיהָ
  choice: 你在它前面清理了地方
  rationale: פנה 的皮埃勒形与 לְפָנֶיהָ 连用，表示为葡萄树清除障碍、腾出空间。“在它前面清理了地方”既保留“在它面前”的意象，也以自然中文表达预备生长空间之意。
- source_word: וַתַּשְׁרֵשׁ שָׁרָשֶׁיהָ
  choice: 它扎下了根
  rationale: 原文近似直译为“它使它的根生根”，是强调葡萄树稳固生根的希伯来语表达。“扎下了根”自然、形象，并未加入原文没有的“深深”等程度词。
- source_word: וַתְּמַלֵּא
  choice: 遍满了
  rationale: מלא 的基本义是“充满”。在葡萄树扩展的诗歌图景中，“遍满”比单说“充满”更符合现代汉语搭配，同时保留其占满空间的含义。
- source_word: אָרֶץ
  choice: 那地
  rationale: אֶרֶץ 可指“地、土地、国土”或“全地”。上下文较可能指以色列所得之地，因此正文采用“那地”，但用脚注保留范围较广的可能。
theological_decisions:
- issue: 葡萄树意象的所指
  choice: 正文继续使用葡萄树的第三人称指代，不直接改写为“以色列”
  alternative: 解释性译为“以色列扎下了根”
  rationale: 上文已借葡萄树指以色列，但本节本身维持诗歌隐喻。保留意象可避免把上下文解释直接写入正文。
- issue: אָרֶץ 的范围
  choice: 译为“那地”
  alternative: 译为“全地”或“大地”
  rationale: 诗篇语境较支持应许之地或国土范围，但希伯来词本身也容许更广意义，故正文采用语境上较合适的译法，并以脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“清理了地方”“扎下了根”“遍满了那地”保持农业意象及平行推进；代词“它”承接上文的葡萄树，不在正文中明说以色列。
