  yaml_path: translation/ot/psalms/080/012.yaml
  text: Why have you broken down its walls[b][a], so that all who pass by the way pluck its fruit?
translation:
  language: zh_hans
  text: 你为什么拆毁它的围墙[a]，以致所有过路的人都摘取它的果子[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“篱笆”或“树篱墙”；希伯来语指葡萄园四周起保护作用的围护设施。
    reason: lexical_alternative
  - marker: b
    text: “果子”是按上下文补出的；也可译“摘取它”或“把它摘光”。这里的希伯来语动词侧重从葡萄树上摘取。
    reason: implicit_object_and_lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 这是引出哀诉和质问的疑问副词；“为什么”是现代汉语中自然、直接的对应表达。
- source_word: פָּרַצְתָּ
  choice: 拆毁
  rationale: פרץ有“冲破、拆开、攻破”之意；用于葡萄园的防护设施时，“拆毁”准确表达防护被破坏。
- source_word: גְדֵרֶיהָ
  choice: 它的围墙
  rationale: גדר指围护葡萄园的墙、篱笆或树篱；“围墙”既自然庄重，也保留其防护性，同时以脚注提示其他可能译法。
- source_word: וְאָרוּהָ
  choice: 摘取它的果子
  rationale: ארה表示摘取、采集，宾语后缀指前文的葡萄树；原文没有明说“果子”，但汉语若只说“摘取它”不自然，因此补出语境隐含的果子，并以脚注说明。
- source_word: כָּל עֹבְרֵי דָרֶךְ
  choice: 所有过路的人
  rationale: 直译为“所有经过道路的人”；此译法符合现代汉语，也保留全称和路人随意摘取的图景。
- source_word: וְ
  choice: 任凭
  rationale: 原文连接词字面为“而/于是”；在质问语境中，拆毁围护的结果是路人得以摘取，“任凭”自然呈现这种结果意味，但不将其强化为更具体的神学断言。
theological_decisions:
- issue: 阴性后缀的所指
  choice: 用“它”指代上下文中的葡萄树，并保留葡萄园意象
  alternative: 越过比喻，直接译为以色列遭人掠夺
  rationale: 本诗紧邻语境把以色列描绘为从埃及移来的葡萄树。保留“它”可维持诗歌比喻及其神学张力，不把意象改写成解释性散文。
- issue: 连接词所表达的关系
  choice: 译作“任凭”，呈现围墙拆毁后路人摘取的结果
  alternative: 较形式地译作“而所有过路的人都摘取它”
  rationale: 希伯来语只用连接词，因果或结果关系由语境产生。“任凭”符合中文哀诉语气，但没有明确断言这是许可、目的还是单纯结果。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“围墙”延续葡萄园的防护意象；“所有过路的人”比“凡过路者”更符合当代普通读者的语言习惯。两个脚注标记均置于正文相应词语之后。
