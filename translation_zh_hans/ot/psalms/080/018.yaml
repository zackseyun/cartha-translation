source:
  edition: WLC
  text: וְ/לֹא נָס֥וֹג מִמֶּ֑/ךָּ תְּ֝חַיֵּ֗/נוּ וּ/בְ/שִׁמְ/ךָ֥ נִקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/018.yaml
  text: Then we will not turn back from you; revive us[a], and we will call on your name.
translation:
  language: zh_hans
  text: 这样，我们就不背离你；求你使我们活过来[a]，我们就求告你的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赐我们生命”或“使我们存活”。
    reason: 希伯来语动词可指使人活过来、赐予生命，也可指保全性命。
lexical_decisions:
- source_word: וְלֹא
  choice: 这样……就不
  rationale: 连词与否定承接前文的祈求，表达随之而来的结果；用“这样……就不”符合现代汉语，也保留上下文的逻辑关系。
- source_word: נָסוֹג מִמֶּךָּ
  choice: 背离你
  rationale: סוג的基本意思是后退、退转；与表示离开的מִן连用时，“背离你”自然表达离开上帝的方向性，又避免采用带特定教义色彩的术语。
- source_word: תְּחַיֵּנוּ
  choice: 使我们活过来
  rationale: חיה的Piel形式表示使人活、使人恢复生机，也可涉及保全性命。“使我们活过来”保留其使役和复苏意味，其他可能语义列于脚注。
- source_word: וּבְשִׁמְךָ נִקְרָא
  choice: 我们就求告你的名
  rationale: קרא与בְּשֵׁם构成惯用表达，指呼求或求告某人的名；“求告你的名”在中文中庄重、清楚，并保留祷告与敬拜的语境。
theological_decisions:
- issue: 赐生命之祈求的范围
  choice: 译作“使我们活过来”，表达上帝使群体恢复生命与生机
  alternative: “赐我们生命”或“使我们存活”
  rationale: 希伯来语可涵盖复苏、赐生命和保全性命，不宜把它限定为单纯的属灵复兴或仅指肉身存活；正文采用自然表达，脚注保留其语义宽度。
- issue: “不背离”与“求告”之间的关系
  choice: 保留两个分句的顺承结果关系
  alternative: 把后半句理解为单纯并列的承诺
  rationale: 经文将上帝使人活与百姓忠诚、求告他的名紧密相连，但没有进一步界定因果机制，因此译文不作教义化扩展。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“背离”比直译为“从你退后”更符合汉语习惯；“求告你的名”保留诗篇祷告语体。
