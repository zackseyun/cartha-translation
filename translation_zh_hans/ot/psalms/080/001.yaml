  text: רֹ֘עֵ֤ה יִשְׂרָאֵ֨ל הַאֲזִ֗ינָ/ה נֹהֵ֣ג כַּ/צֹּ֣אן יוֹסֵ֑ף יֹשֵׁ֖ב הַ/כְּרוּבִ֣ים הוֹפִֽיעָ/ה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/001.yaml
  text: Shepherd of Israel[a], give ear, you who lead Joseph like a flock; you who are enthroned above the cherubim[c][b], shine forth.
translation:
  language: zh_hans
  text: '以色列的牧者啊，求你侧耳倾听！


    你带领约瑟[a]，如同带领羊群一样。


    你坐在基路伯之上[b]，


    求你发出光辉！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约瑟”在这里很可能代指以色列百姓，尤其是北方各支派；原文仍保留“约瑟”这一名字。
    reason: cultural_note
  - marker: b
    text: 或译：“你在基路伯中间坐着”或“你以基路伯为宝座”。希伯来原文直译为“坐着／居住在基路伯……”，没有明说具体的空间关系；这是描写上帝君王般临在的惯用意象。
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעֵה יִשְׂרָאֵל
  choice: 以色列的牧者
  rationale: רֹעֵה是作呼语使用的主动分词，意为“牧养者、牧者”；保留上帝牧养以色列的诗歌意象和称号性质。
- source_word: הַאֲזִינָה
  choice: 求你侧耳倾听
  rationale: 该命令式含专心垂听之意。“侧耳倾听”既保留身体意象，也符合现代汉语庄重祈求的语体；加“求你”自然表达希伯来文祈使语气。
- source_word: נֹהֵג
  choice: 带领
  rationale: 在牧羊语境中指引领、赶领牲畜；“带领”自然且不带“驱赶”可能产生的强硬色彩。
- source_word: כַּצֹּאן
  choice: 如同带领羊群
  rationale: צֹאן是集合名词，指羊群或小牲畜群。汉语补出第二个“带领”，使比较关系清楚，同时未改变原意。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 保留原文专名，不在正文中直接改写为“以色列”或“北方支派”，以保存其转喻空间。
- source_word: יֹשֵׁב הַכְּרוּבִים
  choice: 你坐在基路伯之上
  rationale: יֹשֵׁב可表示坐着、居住，也可在王权意象中表示坐于宝座；“坐在……之上”贴近原文字面，并以脚注说明空间关系与宝座意象的可能理解。כְּרוּבִים采用现代中文圣经中通行的“基路伯”。
- source_word: הוֹפִיעָה
  choice: 求你显出光辉
  rationale: 该使役式命令在神显现语境中兼有显现与放射荣光的意味；“显出光辉”保留两层含义，避免只译成一般的“出现”。
theological_decisions:
- issue: 上帝与基路伯的宝座／临在意象
  choice: 你坐在基路伯之上
  alternative: 你在基路伯中间坐着；你以基路伯为宝座
  rationale: 原文没有明示“之上”或“中间”的介词，且יֹשֵׁב既可按坐居理解，也带有登基掌权的王权意味。正文采用符合约柜宝座意象而又较简洁的表达，脚注保留其他可能理解。
- issue: “约瑟”的群体指代
  choice: 正文保留“约瑟”
  alternative: 以色列百姓；北方各支派
  rationale: 此处很可能以“约瑟”代指以色列民，尤其是与约瑟相关的北方支派；但原文仍使用专名，因此不在正文中消解其诗性和历史指涉。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以分行和标点呈现马所拉重音所显示的两组呼求：先求牧者垂听，再求坐在基路伯上的上帝显出光辉。保留“牧者—羊群”的隐喻、“约瑟”的专名以及基路伯意象，不作教派化解释。
