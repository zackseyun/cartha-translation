revisions:
- from: 耶和华，万军之上帝啊，求你使我们回转[a]；使你的脸发光，我们就必得救[b]。
  to: 耶和华，万军的上帝啊，求你使我们回转[a]；求你使你的脸发光，好叫我们得救[b]。
  rationale: 修订以“万军的上帝”改善现代汉语自然度，保留耶和华、上帝、万军及“脸发光”的原文意象。末句改为“好叫我们得救”，以反映祈使句之后意愿式的目的／结果语气；将结果式“我们就必得救”置于脚注，保留可行的另一理解。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:51:12Z'
review_pass:
  verdict: revise
  source_fidelity: 正文前两项祈使语气基本准确；但末句 וְנִוָּשֵׁעָה 是接续祈求的第一人称复数意愿式，译作“好叫我们得救”更能恰当地保留其目的／结果性质。“我们就必得救”较像确定的直陈式预言。
  naturalness: “万军之上帝”虽可理解，但现代汉语中“万军的上帝”更自然，同时仍保有庄重的祷告语体。“求你”重复于两项祈求，使句法关系清晰、诵读流畅。
  terminology: “耶和华”“上帝”“万军”及“你的脸发光”均适切地保留了原文的神名、称号和具体意象。将 הֲשִׁיבֵנוּ 的脚注替代译文改为“恢复我们”，比“使我们复兴”更准确且较少引入特定神学用语。
  issues:
