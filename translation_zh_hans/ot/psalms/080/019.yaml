  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/019.yaml
  text: O Yahweh God of hosts[a], restore us; make your face shine[b], that we may be saved.
translation:
  language: zh_hans
  text: 耶和华，万军的上帝啊，求你使我们回转[a]；求你使你的脸发光，好叫我们得救[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恢复我们”或“带我们归回”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们就必得救”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的音译呈现上帝的圣名，区别于通称“主”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处与耶和华同位，并与“万军”组成称呼；“上帝”自然、庄重，也清楚表达神圣称号。
- source_word: צְבָאוֹת
  choice: 万军
  rationale: 保留这一传统而宽广的称号，可涵盖天上的众军，避免用“军队”将含义过度收窄。
- source_word: הֲשִׁיבֵנוּ
  choice: 使我们回转
  rationale: 使役命令式可指使百姓转回，也可指带他们归回、恢复他们；正文采用较贴近原文且保留方向性歧义的表达。
- source_word: הָאֵר
  choice: 使……发光
  rationale: 保留希伯来语使役命令式的力量，而不把它弱化为单纯状态描写。
- source_word: פָּנֶיךָ
  choice: 你的脸
  rationale: 保留原文具体意象；它虽暗示上帝恩慈的临在和眷顾，却不在正文中解释性改写。
- source_word: וְנִוָּשֵׁעָה
  choice: 我们就必得救
  rationale: 连接词加第一人称复数意愿式可表达随前述祈求而来的结果；此译法自然呈现祈求与拯救之间的结果关系。
theological_decisions:
- issue: 神圣称号 יְהוָה אֱלֹהִים צְבָאוֹת 的结构
  choice: 耶和华，万军之上帝啊
  alternative: 万军之上帝耶和华啊
  rationale: 用同位结构保留圣名与神圣称号，既不把“耶和华”改作普通头衔，也不把“万军”狭义化为地上的军队。
- issue: הֲשִׁיבֵנוּ 所指的回转或复兴
  choice: 使我们回转
  alternative: 使我们复兴；带我们归回
  rationale: 原动词在使役形式中可涉及属灵回转、归回和处境恢复；选择“使我们回转”保留人的转向与上帝主动施行之间的张力。
- issue: 末句 וְנִוָּשֵׁעָה 的逻辑关系
  choice: 我们就必得救
  alternative: 好叫我们得救
  rationale: 该意愿式接在祈使命令之后，既可理解为目的，也可理解为结果；正文采用结果式表达，并用脚注保留目的式可能。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告语体。“求你”明确祈求语气；分号呈现两项祈求与末句结果之间的推进。正文保留“你的脸发光”这一具体希伯来意象，不增添原文没有的“向我们”。
