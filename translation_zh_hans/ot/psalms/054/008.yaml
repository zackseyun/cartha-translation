  text: כִּ֣י מִ/כָּל צָ֭רָה הִצִּילָ֑/נִי וּ֝/בְ/אֹיְבַ֗/י רָאֲתָ֥ה עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/008.yaml
  text: For he has delivered me from every trouble[a], and my eye has looked on my enemies.
translation:
  language: zh_hans
  text: 因为他救我脱离了一切患难；我亲眼看见了我的仇敌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我的眼睛看见了我的仇敌”。这里可能暗示仇敌败落或诗人得以伸冤，但原文没有明说。
    reason: 说明希伯来语的字面表达及其未明说的语境含义，保留原文的含蓄性。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出前述许愿与赞美的理由；“因为”自然保留其解释作用。
- source_word: מִכָּל צָרָה
  choice: 脱离了一切患难
  rationale: מִן与כָּל合用，表示从全部患难中获救；“一切患难”既保留总体范围，也不限定患难的具体性质。
- source_word: הִצִּילָנִי
  choice: 他救我脱离了
  rationale: נצל的使役式表示搭救、解救；“救我脱离”准确表达从困境中被救出的含义。
- source_word: וּבְאֹיְבַי
  choice: 我的仇敌
  rationale: 介词ב在ראה之后可标示观看所涉及的对象；汉语直接以“仇敌”作“看见”的宾语最自然，不额外加入败亡或胜过等意思。
- source_word: רָאֲתָה עֵינִי
  choice: 我也亲眼看见了
  rationale: 希伯来文直译为“我的眼睛看见了”。“亲眼看见”用自然现代汉语保留亲身目睹的鲜明意味，同时避免生硬措辞。
theological_decisions:
- issue: 诗人看见仇敌所暗示的含义
  choice: 只译作“亲眼看见了我的仇敌”，不明说仇敌败亡、诗人报仇或得胜。
  alternative: 我亲眼看见了仇敌的败亡／我得胜地看着我的仇敌
  rationale: 上下文可能暗示诗人获得伸冤或目睹仇敌败落，但本句原文只明说他的眼睛看见仇敌。正文保留这种含蓄与张力，不把可能的暗示扩写成明确事实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“患难”符合诗篇语域；“亲眼看见”比逐字的“我的眼睛看见”更自然，同时由脚注保存原文意象。
