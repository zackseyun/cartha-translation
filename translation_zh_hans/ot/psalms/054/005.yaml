base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/005.yaml
  text: Behold[a], God is my helper[b]; the Lord is among those who sustain my life.
translation:
  language: zh_hans
  text: 看哪，上帝是我的帮助者；主在那些扶持我生命[a]的人中间。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”所译的希伯来词也可指“灵魂”或“本人”。
    reason: lexical_alternative
  - marker: b
    text: 本句的希伯来语句法较难，也可译作：“主扶持我的生命”，或“主是维系我生命的那一位。”
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引起注意并加强断言语气的感叹词。“看哪”保留了诗歌的庄重和强调意味。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指独一的上帝，并作分句主语；按现代标准普通话译为“上帝”。
- source_word: עֹזֵר לִי
  choice: 是我的帮助者
  rationale: עֹזֵר是作名词性或表语用的主动分词，לִי表达与诗人的受益关系；“我的帮助者”既自然，也保留了施助者的主体性。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是用于上帝的尊称，不是指人间主人；简洁译作“主”，保留其神圣称号的分量。
- source_word: בְּסֹמְכֵי
  choice: 在那些扶持……的人中间
  rationale: 介词בְּ与复数主动分词的组合句法艰深。正文按关联或置身其中的意义翻译，同时保留复数“扶持者”；另在脚注列出把“主”直接理解为扶持者的译法。
- source_word: נַפְשִׁי
  choice: 我的生命
  rationale: נֶפֶשׁ在此处危险与保全的语境中可指人的生命或本人；“生命”比狭义的“灵魂”更贴合上下文，同时以脚注保留词义范围。
theological_decisions:
- issue: אֲדֹנָי作为上帝称号的译法
  choice: 主
  alternative: 主宰
  rationale: 此词在本节是对上帝的尊称。“主”是现代汉语圣经语体中庄重而清楚的称号，也不把它误作普通的人间主人。
- issue: נַפְשִׁי的语境意义
  choice: 我的生命
  alternative: 我的灵魂／我本人
  rationale: 本诗谈到敌害中的帮助与保全，因此“生命”最合语境；脚注保留“灵魂、本人”等可能义，避免把希伯来人的整体性用法缩减为后来的身魂二分观。
- issue: אֲדֹנָי בְּסֹמְכֵי נַפְשִׁי的句法关系
  choice: 主在那些扶持我生命的人中间
  alternative: 主扶持我的生命／主是维系我生命的那一位
  rationale: 希伯来语表面结构含复数分词，并由介词בְּ引入，可能表达主与扶持者同在或位列其中；但句法并不顺畅，也可把主理解为直接扶持者。正文保存较形式对应的复数表达，脚注明确另一种合理理解，不替原文消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“看哪”保留原文的强调；第二分句略显不寻常，是为保存希伯来语复数分词及其真实的句法歧义，并用脚注帮助普通读者理解。
