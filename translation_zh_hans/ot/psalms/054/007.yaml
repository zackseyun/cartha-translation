  text: בִּ/נְדָבָ֥ה אֶזְבְּחָה לָּ֑/ךְ א֤וֹדֶה שִּׁמְ/ךָ֖ יְהוָ֣ה כִּי טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/007.yaml
  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[c][b], for it is good.
translation:
  language: zh_hans
  text: 我要向你献上甘心祭[a]；雅威[b]啊，我要称谢你的名，因为你的名是美好的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “甘心祭”也可理解为“我甘心地／自愿地献祭”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”对应希伯来文神名 YHWH；传统译法常作“耶和华”或以“主”代称。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“因为是美好的”，没有明说主语。正文理解为“你的名是美好的”；也可理解为“因为他是美善的”，直接指雅威。
    reason: alternative_reading
lexical_decisions:
- source_word: בִּנְדָבָה
  choice: 甘心
  rationale: 名词 נְדָבָה 可指甘心祭，也可作方式意义，表示自愿、甘心。与“献祭”连用时译作“甘心献祭”，既保留祭祀语境，也避免把原文未明说的祭物宾语强行补出。
- source_word: אֶזְבְּחָה
  choice: 我要献祭
  rationale: זבח 表示献祭；未完成式在诗歌誓愿语境中表达将来的意愿或决心，译作“我要献祭”自然而准确。
- source_word: לָּךְ
  choice: 给你
  rationale: 介词 ל 标示献祭所向的对象，现代汉语以“给你”表达自然。
- source_word: אוֹדֶה
  choice: 我要称谢
  rationale: ידה 的 Hiphil 形式可表示感谢、称颂；“称谢”适合敬拜语境，同时保留感谢与颂赞的交叠意味。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 原文明说“你的名”，应予保留，以承载神所启示的身份、品格与声誉等含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式呈现四字神名，并用呼语“耶和华啊”反映其句法功能。
- source_word: כִּי טוֹב
  choice: 因为这名是美好的
  rationale: כִּי 引出称谢的理由；טוֹב 没有明说主语，正文按最近的“你的名”理解，并以“这名”补明汉语所需主语。另在脚注保留直接指耶和华为美善的理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用四字神名。中文正文采用广为人知、可直接辨认为专名的“耶和华”，不以称号取代；脚注说明其希伯来文字形及其他常见译法。
- issue: כִּי טוֹב 中“美好”的所指
  choice: 因为这名是美好的
  alternative: 因为他是美善的；因为这是美好的
  rationale: 希伯来文没有显式主语。“你的名”是最近的可能所指，因此正文如此处理；但语法上的省略保留了直接指耶和华为美善的可能，故列入脚注，不作教义性排除。
- issue: בִּנְדָבָה 的名词或方式意义
  choice: 甘心献祭
  alternative: 献上甘心祭
  rationale: 该词既可指自愿献上的祭物，也可表示甘心、自愿地行动。正文采用能保留一定开放性的表达，脚注列明较具体的祭物理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌敬拜语体。“甘心献祭”简洁并保留原文词义张力；“称谢”比日常的“感谢”更适合诗篇语域。所有脚注标记均在正文中出现。
