  yaml_path: translation/ot/psalms/054/003.yaml
  text: God[a], hear my prayer; give ear to the words of my mouth.
translation:
  language: zh_hans
  text: 神啊，求你听我的祷告；侧耳听我口中的言语。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 此处是祷告中的直接呼语；用“神啊”自然表达希伯来语的呼格功能，而不增添额外神学含义。
- source_word: שְׁמַע
  choice: 求你听
  rationale: 该词是阳性单数命令式，在祷告语境中表示恳求神垂听；“求你听”既保留请求语气，也符合现代汉语表达。
- source_word: תְּפִלָּתִי
  choice: 我的祷告
  rationale: תְּפִלָּה通常指向神所作的祷告；译作“我的祷告”准确清楚，并与下半句形成诗歌平行。
- source_word: הַאֲזִינָה
  choice: 侧耳听
  rationale: 该使役命令式含专心倾听之意；“侧耳听”保留原文鲜明的听觉意象，也与前句的“听”构成递进式平行。
- source_word: לְאִמְרֵי
  choice: 听……言语
  rationale: אֵמֶר的复数构造形式意为“言语”；介词לְ按汉语动词搭配融入“听”的结构中，避免生硬直译。
- source_word: פִי
  choice: 我口中的
  rationale: 原文直指“我的口”；“我口中的言语”保留其具体诗意，同时是自然、庄重的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。两句以“听”与“侧耳听”保留希伯来诗歌的同义平行，并用“求你”体现祷告中命令式所承载的恳求语气。
