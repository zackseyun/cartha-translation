  yaml_path: translation/ot/psalms/054/002.yaml
  text: God[a], save me by your name, and vindicate me by your might.
translation:
  language: zh_hans
  text: 上帝啊，求你凭你的名拯救我，凭你的大能为我伸冤。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“审判我”或“为我主持公道”。希伯来语动词可指在法庭上施行审判；这里很可能是求上帝主持正义、为诗人伸冤。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 这是祷告中的直接呼语。现代汉语用“啊”自然标明呼告语气，并不改变所指。
- source_word: בְּשִׁמְךָ
  choice: 凭你的名
  rationale: 介词 ב 在此取凭借、倚靠之意；“名”涵盖上帝所启示的身份、品格和声誉。此译保留原文的凝练表达，避免扩译为“为了你的名”。
- source_word: הוֹשִׁיעֵנִי
  choice: 拯救我
  rationale: ישׁע 的使役式在诗篇祷告中常表示施行救援；“拯救我”直接且保留其较宽的语义范围。
- source_word: וּבִגְבוּרָתְךָ
  choice: 凭你的大能
  rationale: גְּבוּרָה 指力量、威能或施展能力；“大能”符合庄重诗体，并与前句“凭你的名”形成平行。
- source_word: תְדִינֵנִי
  choice: 为我伸冤
  rationale: דִּין 可指审判或处理诉讼；在受敌者向上帝求助的语境中，这里是求上帝施行公正、判明其冤屈。“为我伸冤”自然表达这一司法性诉求，同时以脚注保留其他可能译法。
theological_decisions:
- issue: “审判我／为我伸冤”与上帝公义的关系
  choice: 为我伸冤
  alternative: 审判我；为我主持公道
  rationale: 诗人是在敌对处境中请求上帝作出公正裁断，而非单纯请求中立审查或定罪。“为我伸冤”符合上下文，但脚注保留希伯来动词较宽的司法含义，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告体。“上帝啊，求你……”符合普通现代汉语的直接呼告；两次使用“凭”保留希伯来文平行结构和凭借关系。脚注标记置于存在词义选择的“为我伸冤”之后。
