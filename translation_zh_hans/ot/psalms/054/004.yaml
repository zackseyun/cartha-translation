  yaml_path: translation/ot/psalms/054/004.yaml
  text: For strangers have risen against me[a], and ruthless men seek my life; they do not set God before them[c][b]. Selah
translation:
  language: zh_hans
  text: 因为外人起来攻击我[a]，强横的人[b]寻索我的性命[c]；他们不把上帝置于眼前。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外人”或译“外族人”。希伯来语 זָרִים 可指陌生、疏离或外来的人。
    reason: lexical_alternative
  - marker: b
    text: “强横的人”或译“强暴的人”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语为“寻索我的内弗什”；这里的“内弗什”指诗人的性命。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明诗人求救的缘由，保留因果关系。
- source_word: זָרִים
  choice: 外人
  rationale: 该词可指陌生、疏离或外来的人；“外人”既保留其与诗人群体相异的意味，也不武断限定为异族人。
- source_word: קָמוּ עָלַי
  choice: 起来攻击我
  rationale: 保留“起来”的动作意象，并以“攻击”自然表达介词结构所含的敌对意味。
- source_word: עָרִיצִים
  choice: 强横的人
  rationale: 表达这些人凶暴、无情、仗势压迫的特征，同时避免将其过度限定为正式掌权的“暴君”。
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: 寻索我的性命
  rationale: נֶפֶשׁ在受威胁的语境中指诗人的生命；“寻索”保留原文“寻求”的表达，而“性命”清楚传达其具体所指。
- source_word: לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  choice: 他们不把上帝置于眼前
  rationale: 尽量保留“把上帝放在自己面前”的原文意象，表达他们行事不顾念上帝，又不将隐喻直接解释为“不敬畏上帝”。
- source_word: סֶלָה
  choice: 细拉
  rationale: 沿用通行音译，因为这个礼仪或音乐标记的确切含义仍不确定。
theological_decisions:
- issue: 威胁语境中נֶפֶשׁ的人论含义
  choice: 译作“性命”
  alternative: 灵魂
  rationale: 上下文所说的是敌人企图夺取诗人的生命；译作“性命”符合该词在此处指整个人之生命的具体用法，避免引入原文未着重表达的灵魂与身体二分。
- issue: “不把上帝置于眼前”的道德含义
  choice: 保留原文空间隐喻
  alternative: 译作“他们目中无上帝”或“他们不敬畏上帝”
  rationale: 原文表达他们没有把上帝置于自己的考量之中；直保隐喻可让读者看见这种道德与神学张力，而不把它缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“置于眼前”有意保留原文隐喻，略带书面色彩；“细拉”按传统音译保留。
