  text: May evil return upon my adversaries[a]; in your faithfulness[b], destroy them.
translation:
  language: zh_hans
  text: 愿灾祸回到敌对我的人身上[a]；求你凭你的信实[b]灭绝他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“灾祸必回到敌对我的人身上。”第一个动词既可理解为陈述，也可理解为表达愿望。
    reason: alternative_reading
  - marker: b
    text: 或译“按你的真理”。这里的希伯来词可表示真理、可靠或信实。
    reason: lexical_alternative
lexical_decisions:
- source_word: ישוב
  choice: 愿……回到
  rationale: 这是שוב的Qal未完成式第三人称阳性单数；既可作陈述“必回到”，也可在祷告语境中表达愿望。下句使用祈使式，因此正文采用意愿式，同时在脚注保留陈述式可能。
- source_word: הָרַע
  choice: 灾祸
  rationale: רַע在此可指邪恶，也可指临到人的祸患或灾难。作为返回敌对者身上的后果，“灾祸”在现代汉语中自然，也不把它限定为敌人自身的道德邪恶。
- source_word: לְשֹׁרְרָי
  choice: 敌对我的人身上
  rationale: 该词指与诗人敌对的对手。译成“敌对我的人”保留关系性的敌意，又不擅自限定为军事仇敌；介词ל在“回到”结构中译作“身上”。
- source_word: בַּאֲמִתְּךָ
  choice: 凭你的信实
  rationale: אֱמֶת可表示真实、可靠或信实；这里直接向上帝祈求行动，“信实”突出其可靠不变。介词ב作凭借或依据解，译为“凭”。
- source_word: הַצְמִיתֵם
  choice: 灭绝他们
  rationale: 这是צמת的Hiphil祈使式第二人称阳性单数，带第三人称阳性复数后缀，意为毁灭、剪除或使其终止。“灭绝他们”直接保留原文强烈的审判祈求，不作弱化。
theological_decisions:
- issue: 本节咒诅性祈求的力度
  choice: 将首句译为愿望、末句译为直接祈求上帝施行毁灭性的审判。
  alternative: 将两句理解为预告：“灾祸必回到敌对我的人身上；你必凭你的信实灭绝他们。”
  rationale: 全诗处于向上帝直接祷告的语境，且末句明确使用祈使式。正文采用愿望式可保持祷告与咒诅的张力，不把它淡化为一般预言；脚注则保留首个未完成式可作陈述语气的真实歧义。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“愿……；求你……”清楚呈现祷告语气；“灭绝”保留原文祈使动词的强烈力度。所有脚注标记均已置于正文相应位置。
