source:
  edition: WLC
  text: כִּ֥י גָ֘בַ֤ר עָלֵ֨י/נוּ חַסְדּ֗/וֹ וֶֽ/אֱמֶת יְהוָ֥ה לְ/עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/002.yaml
  text: For his steadfast love has prevailed over us[a], and the faithfulness of Yahweh is forever. Praise Yah!
translation:
  language: zh_hans
  text: 因为他的慈爱在我们身上大有能力；雅威的信实[a]直到永远。你们要赞美雅！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“真实”。
    reason: אֱמֶת既可表示信实、可靠，也可表示真实；两种含义在此均有词义依据。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接第1节的赞美呼召，说明万民应当赞美的缘由。
- source_word: גָבַר עָלֵינוּ
  choice: 向我们显出大能
  rationale: 保留גבר“强盛、占优势”的动词力度，并以自然汉语表达这慈爱临到我们、为我们彰显其强大。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼含爱、忠诚与坚定不移的恩惠；“慈爱”简洁自然，也保留其丰富的盟约语感。
- source_word: וֶאֱמֶת
  choice: 信实
  rationale: אֱמֶת可指真实、真理或可靠忠信；与חֶסֶד并列时，“信实”最贴合语境，同时以脚注保留“真实”的可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其专名性质音译四字神名，不以称号代替。
- source_word: לְעוֹלָם
  choice: 存到永远
  rationale: 自然表达持续无尽的时间意义，并使希伯来文的名词句在汉语中完整通顺。
- source_word: הַלְלוּ יָהּ
  choice: 你们要赞美亚
  rationale: 译出复数命令语气，并保留神名短式יָהּ与完整形式יְהוָה的区别。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用神的专名；“雅威”较直接地呈现该名，避免以头衔取代专名。
- issue: אֱמֶת与חֶסֶד并列时的含义
  choice: 信实
  alternative: 真实
  rationale: 此处“信实”自然体现可靠、忠诚的语境义；脚注保留“真实”，不排除该词的真确性含义。
- issue: יָהּ短式神名的处理
  choice: 亚
  alternative: 雅威／耶和华
  rationale: 保留原文短式神名与完整四字神名之间的形式差别，不将二者无声合并。
translation_notes:
  register: 采用现代、庄重而适合诵读的普通话。“向我们显出大能”兼顾גבר的强烈动词意象与汉语自然度；末句明确译出复数命令，并保留短式神名“亚”。
