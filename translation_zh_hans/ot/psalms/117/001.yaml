  text: הַֽלְל֣וּ אֶת יְ֭הוָה כָּל גּוֹיִ֑ם שַׁ֝בְּח֗וּ/הוּ כָּל הָ/אֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/001.yaml
  text: Praise Yahweh[a], all nations; extol him, all peoples.
translation:
  language: zh_hans
  text: 万国啊，你们要赞美雅威[a]！万民哪，你们要颂扬他！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为神名 YHWH，通常重构读作“雅威”；传统中文译作“耶和华”，也有译本以“上主”代称。
    reason: 说明神名的原文形式、音译及常见替代译法。
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: 赞美
  rationale: 这是动词 הלל 的皮勒式复数命令语气，是直接向众人发出的赞美呼召；“赞美”自然、庄重，并保留命令意味。
- source_word: אֶת יְהוָה
  choice: 雅威
  rationale: אֶת 是直接宾语标记，יְהוָה 是神名 YHWH；“雅威”按其可能的古代读音音译，使经文中的专名保持可见。
- source_word: כָּל גּוֹיִם
  choice: 万国
  rationale: גּוֹיִם 指列国或各民族；“万国”简洁地表达普世性的呼召，并与下半句的“万民”形成对应。
- source_word: שַׁבְּחוּהוּ
  choice: 颂扬他
  rationale: 这是 שבח 的复数命令语气，附第三人称阳性单数后缀；“颂扬他”既传达称颂之意，也保留它与前句 הלל 用词上的变化。
- source_word: כָּל הָאֻמִּים
  choice: 万民
  rationale: אֻמִּים 指众民族、众民；“万民”与“万国”构成自然的诗歌平行，同时略微保留两个希伯来词的区别。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名 YHWH。“雅威”是依现代学界通常重构的读音所作音译，避免以称号取代专名；脚注同时交代传统中文译名及原文字母，以便不同背景的读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。以“万国啊……万民哪……”显明原文对所有族群的直接呼召；两个感叹句再现并行结构和命令力度，不额外补入解释性神学内容。
