  text: מֵ֥/אִתְּ/ךָ֗ תְֽהִלָּ֫תִ֥/י בְּ/קָהָ֥ל רָ֑ב נְדָרַ֥/י אֲ֝שַׁלֵּ֗ם נֶ֣גֶד יְרֵאָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/025.yaml
  text: From you comes my praise in the great assembly[a]; I will pay my vows before those who fear him.
translation:
  language: zh_hans
  text: 我的赞美从你而来，在大会中；我要在敬畏他[a]的人面前还我所许的愿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里从第二人称“你”转为第三人称“他”；有些译本为使人称一致，译作“敬畏你的人”。
    reason: 说明原文中的人称转换及常见的协调译法。
lexical_decisions:
- source_word: מֵאִתְּךָ
  choice: 从你而来
  rationale: מֵאֵת加第二人称阳性单数词尾表示来源。补出“而来”使现代汉语自然，同时保留赞美源于上帝的含义。
- source_word: תְהִלָּתִי
  choice: 我的赞美
  rationale: 该词指赞美、颂赞；直译为“我的赞美”，不额外加入“诗歌”或“祭物”等原文未明说的概念。
- source_word: בְּקָהָל רָב
  choice: 在大会中
  rationale: קָהָל指聚集的会众，רָב在此表示规模大；“大会”简洁地传达大型会众聚集的场景。
- source_word: נְדָרַי
  choice: 我所许的愿
  rationale: 复数形式指诗人向上帝所许的愿。汉语通常不必显明复数，“我所许的愿”比生硬的“我的诸愿”自然。
- source_word: אֲשַׁלֵּם
  choice: 还
  rationale: שׁלם的Piel形式与“愿”连用时表示履行、偿付所许之愿；“还愿”是自然且准确的现代汉语表达。
- source_word: נֶגֶד
  choice: 在……面前
  rationale: 该介词表示当着某些人的面或在其见证之下；“在……面前”清楚保留公开履行的意味。
- source_word: יְרֵאָיו
  choice: 敬畏他的人
  rationale: 分词带第三人称阳性单数词尾，字面为“敬畏他的人”。“敬畏”兼顾畏惧与尊崇的宗教语境，并保留第三人称。
theological_decisions:
- issue: 本节从第二人称“你”转为第三人称“他”
  choice: 保留马所拉文本的人称转换：“从你而来……敬畏他的人”
  alternative: 为保持人称一致，译作“敬畏你的人”
  rationale: 希伯来文本先直接称呼上帝，随后用第三人称词尾指上帝。诗篇中可见这种人称转换；保留它既忠于文本，也避免把解释性协调写入正文。上下文仍表明“他”指上帝。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大会”适合公共敬拜场景；“还我所许的愿”既自然，又清楚表达履行先前承诺。保留“你／他”的转换，并用脚注提示读者，避免在正文中消除原文张力。
