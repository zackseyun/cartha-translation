  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִזְכְּר֤וּ וְ/יָשֻׁ֣בוּ אֶל יְ֭הוָה כָּל אַפְסֵי אָ֑רֶץ וְ/יִֽשְׁתַּחֲו֥וּ לְ֝/פָנֶ֗י/ךָ כָּֽל מִשְׁפְּח֥וֹת גּוֹיִֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/027.yaml
  text: All the ends of the earth will remember and return to Yahweh[b][a], and all the families of the nations will bow down before you.
translation:
  language: zh_hans
  text: 大地的四极都必想起，归向耶和华；列国的万族都必在你面前俯伏下拜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俯伏下拜”也可译作“敬拜”。希伯来语动词本指俯身下拜，在这里是敬拜的举动。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכְּרוּ
  choice: 必想起
  rationale: 该词是זכר的Qal未完成式第三人称阳性复数，在本诗的展望中带将来语气。“想起”直接保留记起、忆及之意，也不额外补明所想起的具体内容。
- source_word: וְיָשֻׁבוּ
  choice: 归向
  rationale: שוב的基本义是返回、回转；与אֶל יְהוָה连用时表示转回并朝向耶和华。“归向”在现代汉语中自然，并避免直接译作“悔改”而过度限定其内在含义。
- source_word: אֶל יְהוָה
  choice: 归向耶和华
  rationale: אֶל表示趋向；专名יְהוָה译为汉语传统且通行的音译“耶和华”，作为名字而非称号处理。
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: 大地的四极都
  rationale: אַפְסֵי אָרֶץ是指大地尽头、最远各处的惯用语。“四极”简洁保留空间极远处的诗歌意象，并以“都”表达כָּל的全称范围。
- source_word: וְיִשְׁתַּחֲווּ
  choice: 都必……俯伏下拜
  rationale: שחה的这一词形描写俯身、伏地下拜的动作，语境中含敬拜意味。“俯伏下拜”保留具体姿态，不把词义仅抽象化为“敬拜”。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 按希伯来语习惯表达临到某人面前；保留第二人称阳性单数，使本句继续直接称呼上帝。
- source_word: כָּל מִשְׁפְּחוֹת גּוֹיִם
  choice: 列国的万族
  rationale: מִשְׁפְּחוֹת指家族或宗族群体，גּוֹיִם指诸国、万国。“列国的万族”兼顾诗体凝练和普世范围，且不引入后期技术意义上的“外邦人”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用历史悠久、普通读者熟悉的专名“耶和华”；“雅威”是较接近现代学界重构读音的另一译法。此选择不将神名改写为“主”这一称号。
- issue: וְיִשְׁתַּחֲווּ是否明译为“敬拜”
  choice: 俯伏下拜
  alternative: 敬拜
  rationale: 原词首先呈现俯伏行礼的身体动作，在对上帝的语境中确有敬拜含义。正文保留动作意象，脚注说明其敬拜含义，以免不必要地缩窄词义。
- issue: וְיָשֻׁבוּ是否译作“悔改”
  choice: 归向
  alternative: 悔改并归向
  rationale: 原词的核心语义是回转、返回；此处朝向耶和华，可能蕴含悔改，但正文不把这种蕴含直接扩写成特定的内在过程。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“大地的四极”“列国的万族”保持平行结构和普世视野；“想起，归向”保留原文两个相连而未明说宾语关系的动作。脚注标记置于相关分句之后。
