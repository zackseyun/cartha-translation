  text: הַצִּ֣ילָ/ה מֵ/חֶ֣רֶב נַפְשִׁ֑/י מִ/יַּד כֶּ֝֗לֶב יְחִידָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/020.yaml
  text: Deliver my life from the sword[c][b][a], my only one from the power of the dog.
translation:
  language: zh_hans
  text: 求你救我的性命[a]脱离刀剑，救我唯一的生命[c]脱离狗的权势[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”或译“灵魂”或“我自己”；希伯来语נפש可按语境指灵魂、自我或生命。
    reason: lexical_alternative
  - marker: b
    text: “权势”直译“手”；“从……手中”在这里指脱离其权势或控制。
    reason: lexical_alternative
  - marker: c
    text: “我唯一的生命”直译作“我独一者”；也可理解为“我宝贵的生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילָה
  choice: 求你救……脱离
  rationale: 这是נצל的祈使形式，在哀歌祷告中表达迫切的求救；“求你救……脱离”既自然，也保留直接恳求的语气。
- source_word: מֵחֶרֶב
  choice: 脱离刀剑
  rationale: 介词מן表示脱离危险；“刀剑”在此代表致命的武力威胁，不必理解为某一把特定的剑。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נפש在此处指活着的自我或生命；上下文是面对死亡威胁的求救，因此“性命”比带有身魂二分意味的“灵魂”更贴切。
- source_word: מִיַּד
  choice: 脱离……的掌控
  rationale: 字面为“从……的手中”，这里是表示权势或控制的惯用语；因修饰对象是“犬”，译作“掌控”可传达其实际意义，并避免汉语中“犬的手”这一不自然搭配。
- source_word: כֶּלֶב
  choice: 恶犬
  rationale: 原文为单数，并以犬的形象描绘敌对者；“恶犬”保留单数和鲜明的威胁形象，而不把隐喻具体解释为某类敌人。
- source_word: יְחִידָתִי
  choice: 我仅有的生命
  rationale: יְחִידָה本义为“唯一的一个”，在与נַפְשִׁי平行的诗句中指诗人仅有、不可替代的生命。“仅有的生命”在现代汉语中自然，并保留“唯一”的词义核心。
theological_decisions:
- issue: 哀歌语境中נַפְשִׁי的人论含义
  choice: 译为“我的性命”
  alternative: “我的灵魂”
  rationale: 本节所求的是从刀剑和仇敌权势下获救，所指最自然的是说话者的生命或整个自我。这样处理避免把原文限定为后期较技术化的灵魂概念。
- issue: יְחִידָתִי所指的对象
  choice: 译为“我仅有的生命”
  alternative: “我唯一的一个”或“我宝贵的生命”
  rationale: 原文保留了“唯一者”的诗性表达，但其与“我的性命”构成平行，语境指向诗人的生命。“仅有的生命”呈现这一指向，同时不额外加入“宝贵”这一评价色彩。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。保留希伯来诗歌的两行平行结构、单数“恶犬”的意象，以及“性命／仅有的生命”的递进呼应；脚注说明原文中“灵魂”“手”和“唯一者”的词义空间。
