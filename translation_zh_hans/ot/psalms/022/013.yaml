lexical_decisions:
- source_word: פָּצוּ
  choice: 张开
  rationale: פצה意为“张开、张大”；在猛兽意象中，“张开大口”自然传达其强烈意味。希伯来语完成式在诗歌画面中可呈现当前、鲜活的动作，故译作“张开”。
- source_word: עָלַי
  choice: 向我
  rationale: 介词עַל在这里表示带敌意的动作方向；“向我张开大口”既符合现代汉语习惯，也保留攻击意味。
- source_word: פִּיהֶם
  choice: 大口
  rationale: 原文名词“口”为单数，带复数后缀“他们的”。汉语“他们张开大口”可自然保留集合性的单数表达；“大”由动词פצה所含的“张大”意味体现。
- source_word: אַרְיֵה
  choice: 像……狮子
  rationale: 原文没有明示比较词，但“狮子”作为紧凑的同位意象，在语境中具有比喻功能；汉语加入“像”可清楚、自然地表达这一关系，同时以脚注保留原文形式上的歧义。
- source_word: טֹרֵף
  choice: 撕咬
  rationale: טרף的分词描写狮子撕裂猎物的动作。“撕咬”比单用“撕裂”更贴合狮子的捕食画面，也符合现代汉语。
- source_word: וְשֹׁאֵג
  choice: 吼叫
  rationale: שׁאג是描写狮子吼叫的常用动词；“吼叫”直接、通俗而有力度。
