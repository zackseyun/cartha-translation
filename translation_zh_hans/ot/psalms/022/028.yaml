  text: כִּ֣י לַ֭/יהוָה הַ/מְּלוּכָ֑ה וּ֝/מֹשֵׁ֗ל בַּ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/028.yaml
  text: For the kingdom belongs to Yahweh[b][a], and he rules over the nations.
translation:
  language: zh_hans
  text: 因为王权属于雅威[a]；他统治万国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王权”也可译作“统治权”“国度”或“王国”。“雅威”是希伯来文神名 יהוה 的音译，传统上常译作“耶和华”或“上主”。
    reason: 说明 מְלוּכָה 可指王权、王治或王国，并说明神名 יהוה 的译法。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出本节对前文赞美与劝勉的理由，保留希伯来文的因果关系。
- source_word: לַיהוָה
  choice: 属于雅威
  rationale: 介词 ל־在这里表达归属关系；יהוה按其专名译作“雅威”。
- source_word: הַמְּלוּכָה
  choice: 国权
  rationale: מְלוּכָה可指王权、统治或国度；“国权”在现代汉语中自然凝练，并突出掌权、作王之意，同时以脚注保留其他可能译法。
- source_word: וּמֹשֵׁל
  choice: 他统管
  rationale: משׁל的主动分词表达持续、普遍的统治事实；补出主语“他”，所指为雅威。
- source_word: בַּגּוֹיִם
  choice: 万国
  rationale: 介词 ב־与“统管”结合表达统治所及的对象或范围；גּוֹיִם泛指列国，以“万国”呈现诗歌语体中的普世范围。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”使读者看见这是专名，不以称号取代。
- issue: מְלוּכָה 的语义范围
  choice: 国权
  alternative: 国度；王权；统治权
  rationale: 原词既可偏重王权或作王，也可指国度。正文采用自然而能表达统治权归属的“国权”，脚注明确保留其语义幅度，避免将含义限定为领土性的国度。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“因为”承接前文；分号保持两小句紧密的因果与并列关系。“统管万国”兼具诗歌凝练感和普世统治的含义。
