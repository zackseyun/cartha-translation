  text: אֱֽלֹהַ֗/י אֶקְרָ֣א י֭וֹמָם וְ/לֹ֣א תַעֲנֶ֑ה וְ֝/לַ֗יְלָה וְֽ/לֹא דֽוּמִיָּ֥ה לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God[a], I cry out by day, but you do not answer, and by night[b], but I have no rest.
translation:
  language: zh_hans
  text: 我的上帝啊，我白天呼求，你却不应答；夜间，我也不得安宁。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“我没有安静（或静默）”；也可理解为“我并未静默”，即夜间仍不停地呼求。
    reason: 保留 דּוּמִיָּה לִי 的“安静／静默”词义范围，以及末句可能指诗人夜间未曾静默的理解。
lexical_decisions:
- source_word: אֱלֹהַי
  choice: 我的上帝啊
  rationale: 名词带第一人称单数词尾，表示“我的上帝”，在此作直接呼语；“啊”使现代汉语呼语自然庄重，并未增添独立的感叹内容。
- source_word: אֶקְרָא
  choice: 我呼求
  rationale: קרא 的 Qal 未完成式第一人称单数；在哀歌语境中不是普通的呼叫，而是向上帝迫切求告。“呼求”兼顾语义和语体。
- source_word: יוֹמָם
  choice: 白天
  rationale: 作时间副词，与下句“夜间”构成平行。
- source_word: וְלֹא תַעֲנֶה
  choice: 你却不应答
  rationale: וְ 在诉苦语境中带有转折效果；“却”自然表达呼求与没有回应之间的反差。“应答”保留上帝对呼求作出回应的含义。
- source_word: וְלַיְלָה
  choice: 夜间呼求
  rationale: 原文仅说“而在夜间”，省略了与上句相同的动词。汉语补出“呼求”，清楚呈现诗句的平行结构，不增加新的行为。
- source_word: וְלֹא דֽוּמִיָּה לִי
  choice: 我也不得安宁
  rationale: דומיה 可指静默、安静或安歇；原短语直译近于“我没有静默/安静”。“不得安宁”在现代汉语中自然表达诗人夜间仍无法平静或歇息，同时以脚注保留原文意象和可能的另一理解。
theological_decisions:
- issue: 末句 וְלֹא דֽוּמִיָּה לִי 的解释
  choice: 诗人夜间仍不得安宁
  alternative: 我并不静默／我没有停止呼求
  rationale: 名词 דומיה 的基本意象是静默、寂静或安静，而不是“回答”。上下文既可侧重诗人无法得着安宁，也可能表示他没有静默、昼夜不停呼求。正文采用自然且贴合哀歌处境的“不得安宁”，脚注保留另一种理解，不把该词改释为上帝没有回答。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“白天……夜间……”保留希伯来诗歌的平行结构；分号划分两个时段。“啊”用于自然标示呼语，正文不采用生硬的逐词直译，并以脚注交代末句的真实歧义。
