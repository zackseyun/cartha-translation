  text: כִּ֥י סְבָב֗וּ/נִי כְּלָ֫בִ֥ים עֲדַ֣ת מְ֭רֵעִים הִקִּיפ֑וּ/נִי כָּ֝/אֲרִ֗י יָדַ֥/י וְ/רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/016.yaml
  text: For dogs have surrounded me[a]; a company of evildoers has encircled me[b]; like a lion are my hands and my feet.
translation:
  language: zh_hans
  text: '因为狗群围住了我；

    一群作恶之徒围困我；

    如同狮子，我的手和脚[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马所拉文本此处的希伯来文为“如同狮子，我的手和脚”，句法艰涩，含义难定。一些死海古卷和《七十士译本》反映另一种古老读法，可译作“他们刺穿了我的手和脚”或“他们挖穿了我的手和脚”。
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为哀诉说明缘由；“因为”保留其解释或因果作用。
- source_word: סְבָבוּנִי כְּלָבִים
  choice: 群狗围住了我
  rationale: סבב 表示围绕、包围；“狗”的敌对比喻予以保留，不直接解释为仇敌。中文加“群”使复数意象自然。
- source_word: עֲדַת מְרֵעִים
  choice: 作恶之徒结伙
  rationale: עֲדָה 指聚集成群的人，מְרֵעִים 指行恶者；此译自然表达一伙作恶者聚集起来的含义。
- source_word: הִקִּיפוּנִי
  choice: 环绕我
  rationale: 保留“包围、环绕”之义，并与前句“围住”形成近义平行。
- source_word: כָּאֲרִי
  choice: 如同狮子
  rationale: 正文依照马所拉文本的读法，直译“如同狮子”；不擅自补入动作，保留希伯来文在此处的句法困难。
- source_word: יָדַי וְרַגְלָי
  choice: 我的手和脚
  rationale: 按原文直译身体部位，并保留它们与前面“如同狮子”之间难以确定的句法关系。
theological_decisions:
- issue: כָּאֲרִי 的争议文本及其句法
  choice: 正文采用马所拉文本“如同狮子”，并保留原文不完整、难解的表达
  alternative: “他们刺穿了我的手和脚”或“他们挖穿了我的手和脚”
  rationale: WLC 的正文读作 כָּאֲרִי（“如同狮子”），因此不以较顺畅且具有重要基督教诠释传统的异读取代它；但古代抄本和译本所见异读具有真实的文本批判价值，故在脚注中完整交代。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。前两分句保持希伯来诗歌的平行结构；末句刻意不补动词，以免把有争议的马所拉文本解释得过于确定，并用脚注说明异读。
