  text: 凡看见我的都嘲笑我；他们撇嘴[a]，摇头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按字面译为“张开嘴唇”。原文可能描述一种表示轻蔑的嘴部动作。
