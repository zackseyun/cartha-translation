lexical_decisions:
- source_word: כָּל רֹאַי
  choice: 凡看见我的
  rationale: כָּל概括所有看见诗人的人；רֹאַי是ראה的主动分词带第一人称单数后缀。译作“凡看见我的”既贴近结构，也符合现代汉语表达。
- source_word: יַלְעִגוּ לִי
  choice: 都嘲笑我
  rationale: לעג在此表示以轻蔑态度讥笑、嘲弄；“嘲笑我”清楚自然，并保留行为直接针对说话者的意思。
- source_word: יַפְטִירוּ בְשָׂפָה
  choice: 他们撇着嘴
  rationale: 该短语直译涉及嘴唇的张开或动作，语境表明这是轻蔑的面部姿态。“撇着嘴”是现代汉语中自然、形象的对应表达；脚注保留较直译的可能。
- source_word: יָנִיעוּ רֹאשׁ
  choice: 摇着头
  rationale: נוע使役式配“头”表示摇头的动作；在本节语境中是鄙夷、讥诮的姿态。“摇着头”准确而自然。
theological_decisions:
- issue: 后来的基督教诠释将本节用于弥赛亚受难叙事
  choice: 按诗篇本身的语境，译为受苦诗人描述旁观者的嘲弄，不在正文中加入明确的基督论措辞。
  alternative: 读者可从脚注所列福音书经文看出后来的呼应。
  rationale: 译文首先反映希伯来文本本身，同时不遮蔽本节在福音书受难叙事中的回响。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“凡……都……”呈现原文的总括结构；“撇着嘴，摇着头”保留两个连续的身体动作及其轻蔑意味。正文简洁，词义歧义和后世经文呼应置于脚注。
