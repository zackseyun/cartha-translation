source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה גֹחִ֣/י מִ/בָּ֑טֶן מַ֝בְטִיחִ֗/י עַל שְׁדֵ֥י אִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/009.yaml
  text: For you are the one who brought me out from the womb[a], making me secure at my mother’s breasts.
translation:
  language: zh_hans
  text: 因为是你使我从母腹出来，使我在母亲的乳房上安然无忧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使我在母亲的乳房上信靠。”
    reason: 保留 מַבְטִיחִי 可理解为“使……信靠”的词义可能，同时维持 עַל שְׁדֵי אִמִּי 所指母亲乳房的具体意象。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明理由；现代汉语中“因为”自然体现诗句的论证关系。
- source_word: אַתָּה
  choice: 是你
  rationale: 保留独立人称代词的强调意味，突出上帝亲自施行这一切。
- source_word: גֹחִי
  choice: 使我出
  rationale: 在生产语境中表示使婴儿从母腹出来；此译简洁地保留出生意象，不扩展为抽象的“拯救”。
- source_word: מִבָּטֶן
  choice: 母腹
  rationale: 准确表达出生所出的子宫，并以自然、庄重的汉语呈现。
- source_word: מַבְטִיחִי
  choice: 使我安然倚在
  rationale: 该使役形式可表达使人安稳或使人信靠；正文以“安然”贴合哺乳婴儿蒙照料的具体处境，同时借“倚在”保留信赖色彩。
- source_word: עַל שְׁדֵי אִמִּי
  choice: 倚在母亲怀中
  rationale: 希伯来文直指“在我母亲的双乳上”；汉语用“母亲怀中”自然表达吃奶婴儿所处的位置，避免生硬，但具体原文意象在脚注中注明。
theological_decisions:
- issue: מַבְטִיחִי 是指婴儿得到安稳，还是被使得信靠
  choice: 使我安然倚在
  alternative: 使我在母亲乳房上信靠
  rationale: 出生和哺乳的语境首先呈现上帝赐下安全与安稳；但该词也确可表示“使……信靠”。正文不把新生儿的状态明确解释为成熟、认知性的信心，脚注则保留词义和神学上的真实张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“母腹”保留出生意象；“安然倚在母亲怀中”符合现代汉语习惯。脚注补出更直译且具有神学张力的另一种理解。
