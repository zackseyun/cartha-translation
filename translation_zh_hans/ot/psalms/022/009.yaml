  revision_rationale: 修订补足“从母腹”的出处关系，并在正文保留希伯来文所明说的母亲乳房／哺乳意象。以“安然无忧”表达神所赐的安全感，避免将婴儿的状态过度诠释为认知性的信心；脚注则忠实保留“使我信靠”的另一可行理解。
