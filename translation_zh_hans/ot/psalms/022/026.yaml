source:
  edition: WLC
  text: יֹאכְל֬וּ עֲנָוִ֨ים וְ/יִשְׂבָּ֗עוּ יְהַֽלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑י/ו יְחִ֖י לְבַבְ/כֶ֣ם לָ/עַֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/026.yaml
  text: The afflicted will eat and be satisfied[a]; those who seek him will praise Yahweh[c][b]. May your hearts live forever.
translation:
  language: zh_hans
  text: 困苦的人[a]必吃得饱足[b]；寻求雅威的人必赞美他。愿你们的心[c]永远活着！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦的人”也可译作“谦卑的人”、“贫穷的人”或“柔和的人”。
    reason: lexical_alternative
  - marker: b
    text: 结合本诗的上下文，这里的“吃”可能暗指献祭或还愿后的筵席，但本节没有明说。
    reason: cultural_note
  - marker: c
    text: 原文“心”是单数，而“你们”是复数；这里可能用一个集体单数来指受话群体共同的内在生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: 困苦的人
  rationale: 该词可指受苦、贫穷、谦卑或温顺的人。结合本诗从苦难转向蒙拯救和共同敬拜的脉络，“困苦的人”较能保留其受压、被降卑的处境，同时不把词义仅限于性情上的谦卑。
- source_word: יֹאכְלוּ וְיִשְׂבָּעוּ
  choice: 必吃得饱足
  rationale: 两个未完成式在此指向将要发生的结果。“吃得饱足”是自然的现代汉语，也忠实表达吃和得到满足这两层意思。
- source_word: יְהַלְלוּ
  choice: 必赞美
  rationale: 准确表达强化词干所指的赞颂行动；“必”配合上下文表达预期或将来的敬拜回应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的音译，保留其作为以色列之神专名的性质，而不以“主”这一称号替代。
- source_word: דֹּרְשָׁיו
  choice: 寻求他的人
  rationale: 分词表达持续以神为寻求对象的人；“他”回指随后出现的“雅威”，中文清楚自然，并保留原文的代词形式。
- source_word: יְחִי
  choice: 愿……活着
  rationale: 形式上是第三人称阳性单数未完成式，在此宜理解为祈愿语气，构成对敬拜群体的祝愿，而不是直陈未来事实。
- source_word: לְבַבְכֶם
  choice: 你们的心
  rationale: 名词“心”是单数，附加的第二人称阳性复数词尾表明受话者为复数。译作“你们的心”既保留集体单数，也保留对群体的直接称呼；“心”在希伯来语中涵盖人的内在生命。
- source_word: לָעַד
  choice: 永远
  rationale: 简明、自然地表达持续无尽的时间。
theological_decisions:
- issue: 末句受话对象与“心”的单复数
  choice: 保留第二人称复数受话者和单数“心”：“愿你们的心永远活着。”
  alternative: 愿你们的心灵永远存活；愿你们的众心永远活着；他们的心必永远活着
  rationale: 原文“心”为单数，但其所属后缀是第二人称复数，很可能是指整个受祝福群体的集体单数。这样翻译既不把受话者改成第三人称，也不擅自把名词改成复数，并保留祝福式语气。
- issue: “吃”的性质
  choice: 正文只译作吃得饱足，不明说是献祭或还愿筵席。
  alternative: 困苦的人必吃祭筵而饱足
  rationale: 全诗上下文可能使人联想到献祭或还愿后的筵席，但本节本身没有明说。将这一可能背景留在脚注，可避免把合理推测写成正文事实。
- issue: 神圣四字名的表达
  choice: 译作专名“雅威”。
  alternative: 耶和华；上主；主
  rationale: 原文使用神的专名יהוה。音译“雅威”可明确区分专名与称号，同时避免以解释性称谓取代原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“困苦的人”贴近诗篇的受苦语境；“吃得饱足”口吻自然。“愿你们的心永远活着”保留原文略带诗性、祝福式的表达及其单复数张力，不将“心”窄化为情感，也不将末句改写为普通陈述。
