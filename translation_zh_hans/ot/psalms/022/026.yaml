  terminology: “雅威”一致反映 יהוה 作为专名；“困苦的人”是对 ענוים 在本诗语境下可接受的处理。脚注中的“温顺的人”可改为较贴近“meek”且更常用于圣经语境的“柔和的人”。“心”应保留，不宜擅自释义为“心灵”或改作复数。
