source:
  edition: WLC
  text: עָ֭לֶי/ךָ הָשְׁלַ֣כְתִּי מֵ/רָ֑חֶם מִ/בֶּ֥טֶן אִ֝מִּ֗/י אֵ֣לִ/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/010.yaml
  text: Upon you I was cast from the womb[b][a]; from my mother's belly you have been my God.
translation:
  language: zh_hans
  text: 我从母胎中就被交托给你[a]；从我母亲腹中起，你就是我的上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被交托给你”直译可作“被抛给你”或“被投向你”；原文以强烈的投掷意象描写诗人从母胎起便被置于上帝的看顾之下。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我的上帝，你（是）”，没有明示时态；也可理解为“从我母亲腹中起，你一直是我的上帝”。
    reason: alternative_reading
lexical_decisions:
- source_word: עָלֶיךָ
  choice: 给你
  rationale: 介词 עַל 在这里与“被投下、被交托”的意象相连，表示婴孩从母胎起便落在上帝的看顾之下。现代汉语用“给你”与“被交托”搭配最为自然，同时不增添“手中”“怀中”等原文没有的意象。
- source_word: הָשְׁלַכְתִּי
  choice: 我被交托
  rationale: 该词是 שלך 的被动式，字面可译“我被抛下”或“我被投给”。语境所表达的是从出生起便被置于上帝的看顾中；“被交托”保留被动含义，在现代汉语中也避免产生遭上帝丢弃的误解。字面意象在脚注中注明。
- source_word: מֵרָחֶם
  choice: 从母胎中
  rationale: רֶחֶם 指子宫、母胎。“母胎”既具体又符合庄重诗歌语体，并与下句 בֶּטֶן 的“腹中”保持词汇区别。
- source_word: מִבֶּטֶן אִמִּי
  choice: 从我母亲腹中起
  rationale: בֶּטֶן 可指腹部或子宫。“我母亲腹中”保留原文具体身体意象；“起”自然表达自生命最初阶段开始的关系，又不把该词与前句 רֶחֶם 合并为同一个汉语词。
- source_word: אֵלִי
  choice: 我的上帝
  rationale: אֵל 加第一人称单数词尾，直接表示“我的上帝”，保留个人关系的语气。
- source_word: אָתָּה
  choice: 你就是
  rationale: 原文是无系词名词句“我的上帝——你”，未明示时态。“你就是”在汉语中自然、郑重，并保留现时宣认与自出生以来持续关系之间的开放性。
theological_decisions:
- issue: 末句无系词结构 אֵלִי אָתָּה 的时间含义
  choice: 你就是我的上帝
  alternative: 你一直是我的上帝
  rationale: 希伯来文没有明示“现在”或“持续至今”的时态。上下文支持自母腹以来持续的关系，但正文采用“你就是”以免把隐含的时间关系解释得过满；“从我母亲腹中起”仍让持续含义自然可见，并在脚注中说明另一种理解。
- issue: הָשְׁלַכְתִּי 的投掷意象与托付含义
  choice: 被交托给你
  alternative: 被抛给你／被投向你
  rationale: 直译“被抛”在现代汉语中容易暗示遗弃，与上下文中的依靠和看顾产生非原意的冲突。“被交托”传达语境功能，同时用脚注保留原文更强烈的投掷意象，不据此引申特定教义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“母胎”与“我母亲腹中”保留原文 רֶחֶם／בֶּטֶן 的词汇变化；正文语序力求自然，并以脚注保存投掷意象及末句无系词结构的时态含混。
