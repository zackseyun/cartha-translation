  yaml_path: translation/ot/psalms/022/018.yaml
  text: They divide my garments among themselves[a], and for my clothing they cast lots.
translation:
  language: zh_hans
  text: 他们分我的衣服；又为我的衣裳抽签。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 福音书关于耶稣被钉十字架的记载呼应了这一句；见马太福音27:35；马可福音15:24；路加福音23:34；约翰福音19:24。
    reason: cross_reference
lexical_decisions:
- source_word: יְחַלְּקוּ
  choice: 分
  rationale: 这是 חלק 的 Piel 未完成式第三人称阳性复数；在诗歌的生动描写中，用现代汉语现在时态不另作标记，自然表达敌对者分配诗人衣物的动作。
- source_word: בְגָדַי
  choice: 我的衣服
  rationale: בגד 泛指衣服、衣物；“衣服”自然易懂，并与下半句的另一衣物词“衣裳”形成对应而不完全重复。
- source_word: לָהֶם
  choice: 彼此
  rationale: 字面为“给他们／归他们”；与“分”连用时表示在这群人中分配。“彼此”简洁传达相互分取的含义，不额外限定所得份额。
- source_word: לְבוּשִׁי
  choice: 我的衣裳
  rationale: לבוש 指衣着或衣物，并不必然特指袍子。“衣裳”保留诗体的庄重感，也维持与“衣服”的近义平行。
- source_word: יַפִּילוּ
  choice: 抽签
  rationale: נפל 的 Hiphil 与 גורל 连用构成以签决定归属的固定表达；现代汉语“抽签”比字面译作“使签落下”更准确自然。
- source_word: גוֹרָל
  choice: 签
  rationale: גורל 指用于决定或分配的签；在汉语固定搭配“抽签”中无需机械保留希伯来语单数形式。
theological_decisions:
- issue: 弥赛亚意涵与新约受难叙事的呼应
  choice: 正文直接翻译希伯来诗句，不加入“十字架”或“应验”等明示性措辞；以脚注列出新约呼应。
  alternative: 在正文中采用更受传统诠释影响的表达，直接凸显耶稣受难中的应验。
  rationale: 本节原文描写诗人的衣物被人分取并以抽签决定归属。新约受难叙事确实呼应此句，但应由正典互文和脚注呈现，不应改变希伯来文本本身的措辞或消解其原有诗境。
translation_notes:
  register: 采用现代、简洁而庄重的诗体汉语。“衣服／衣裳”对应原文两个近义衣物词，保留平行结构；“彼此分……又为……抽签”保持两分句的动作推进。
