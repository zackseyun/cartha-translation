  text: בְּ֭/ךָ בָּטְח֣וּ אֲבֹתֵ֑י/נוּ בָּ֝טְח֗וּ וַֽ/תְּפַלְּטֵֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/004.yaml
  text: In you our fathers trusted; they trusted[a], and you delivered them.
translation:
  language: zh_hans
  text: 我们的列祖[a]倚靠你；他们倚靠，你搭救了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我们的祖先”。希伯来文的字面亲属称谓是“我们的父辈”；此处指历代先辈。
    reason: 说明原文阳性复数亲属称谓的字面形式及其在本节中的历史性世系含义。
lexical_decisions:
- source_word: בְּךָ
  choice: 倚靠你
  rationale: 介词 בְּ־ 加第二人称阳性单数后缀，标明信靠的对象；汉语“倚靠你”自然表达对上帝的依赖，又不添加原文没有明说的排他含义。
- source_word: בָּטְחוּ
  choice: 倚靠
  rationale: בטח 表示信赖、安然依靠。“倚靠”符合诗篇语体，并保留其以“你”为对象的关系性含义。原文两次重复此动词，译文也照样重复。
- source_word: אֲבֹתֵינוּ
  choice: 我们的列祖
  rationale: 该词是“父亲”的阳性复数附属形，带第一人称复数后缀；“列祖”既保留男性先辈的历史表达，也比现代汉语“父辈”更适合指历代先人。
- source_word: וַתְּפַלְּטֵמוֹ
  choice: 你就搭救他们
  rationale: פלט 表示搭救、救出或使之逃脱。“搭救”自然且庄重；“就”呈现前文倚靠与随后蒙救之间的叙事承接，但不具体限定搭救方式。
theological_decisions:
- issue: אֲבֹתֵינוּ 是译作男性先辈，还是采用性别中性的总称
  choice: 我们的列祖
  alternative: 我们的祖先
  rationale: 原文采用阳性亲属称谓。“列祖”在现代中文中仍可理解，并保留原文的男性历史表述；脚注同时说明可按广义世系理解为“祖先”，避免把词义范围不必要地限于直接父辈。
translation_notes:
  register: 采用自然、庄重而易懂的现代汉语。“倚靠”重复两次，以保留希伯来诗句的强调；分号呈现两个紧密相连的分句。
