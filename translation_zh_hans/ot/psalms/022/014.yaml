  text: כַּ/מַּ֥יִם נִשְׁפַּכְתִּי֮ וְ/הִתְפָּֽרְד֗וּ כָּֽל עַצְמ֫וֹתָ֥/י הָיָ֣ה לִ֭בִּ/י כַּ/דּוֹנָ֑ג נָ֝מֵ֗ס בְּ/ת֣וֹךְ מֵעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/014.yaml
  text: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
translation:
  language: zh_hans
  text: 我如水被倾倒；我的骨头全都脱了节。我的心变得像蜡，在我里面融化了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在我的内脏中。”
    reason: 保留מֵעָי所指的具体身体意象；正文“在我里面”较符合现代汉语表达。
lexical_decisions:
- source_word: כַּמַּיִם
  choice: 如水
  rationale: 前缀כַּ־表示比较；“如水”自然、凝练，并保留诗歌中的明喻。
- source_word: נִשְׁפַּכְתִּי
  choice: 我被倾倒
  rationale: שׁפך的尼法勒完成式描绘说话者如液体被倒空的状态；被动表达保留原文的语态和鲜明意象。
- source_word: וְהִתְפָּרְדוּ כָּל עַצְמוֹתַי
  choice: 我的骨头全都脱了节
  rationale: התפרדו表示彼此分开；用于骨头时，“脱了节”是现代汉语中自然的身体意象，同时传达骨骼离散、错位的痛苦。
- source_word: הָיָה לִבִּי כַּדּוֹנָג
  choice: 我的心变得像蜡
  rationale: הָיָה在此表示进入一种结果状态；“变得像蜡”保留状态的转变和原文的明喻。
- source_word: נָמֵס
  choice: 融化了
  rationale: מסס意为融化或消解；与蜡的意象搭配时，“融化”最贴切。
- source_word: בְּתוֹךְ מֵעָי
  choice: 在我里面
  rationale: מֵעִים字面指内脏、腹中深处，也可承载内在感受的意涵；正文采用自然的“在我里面”，脚注保留其具体的身体表达。
theological_decisions:
- issue: 内在痛苦的身体性表达
  choice: 在我里面
  alternative: 在我的内脏中
  rationale: 原文采用具体而 visceral 的人体词语，不只是抽象地指心灵。正文保持现代汉语的自然度，脚注则保存其字面身体意象，避免将表达过度属灵化。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，并保留原诗连续的身体意象。分号区分倾倒与骨骼离散两个并列画面；第二句呈现心如蜡融化的递进意象。
