source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה אַל תִּרְחָ֑ק אֱ֝יָלוּתִ֗/י לְ/עֶזְרָ֥תִ/י חֽוּשָׁ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/019.yaml
  text: But you[a], O Yahweh, do not be far away; O my strength[b], hurry to help me.
translation:
  language: zh_hans
  text: 但你，雅威啊，求你不要远离[a]！我的力量[b]啊，求你快来帮助我！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要离我那么远。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文通常理解为“我的力量”；也有人译作“我的帮助”，或认为这个词的字面意义与“母鹿”有关，但后一种理解在这里可能性较小。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 但你
  rationale: 连词与独立人称代词连用，在上下文中形成强烈转折；“但你”自然地保留了诗人从苦境转向呼求雅威的语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，而不以“主”这一称号替代；“雅威”是现代普通话中对 Yahweh 的清楚音译。
- source_word: אַל־תִּרְחָק
  choice: 求你不要远离
  rationale: 否定祈使语气表达恳求；“不要远离”既贴近“成为遥远的”这一基本义，也符合现代汉语祷告语体。补出“求”以自然表达希伯来语命令式在此处的恳求功能。
- source_word: אֱיָלוּתִי
  choice: 我的力量
  rationale: 此词在本句中作为对雅威的呼称，语境最支持“我的力量”。其词形和词源解释存在困难，另有“我的帮助”以及与“母鹿”相关的理解，故用脚注保留歧义。
- source_word: לְעֶזְרָתִי
  choice: 来帮助我
  rationale: 介词短语直指“为了／到我的帮助”；结合后面的急切命令，译作“来帮助我”符合现代汉语，同时保留行动方向。
- source_word: חוּשָׁה
  choice: 求你快来
  rationale: 该命令式要求迅速行动；“快来”简洁自然地传达紧迫感，“求你”体现呼求语气。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，并避免以称号“主”代替；“耶和华”虽为传统形式，但不是对 Yahweh 的直接现代音译。
- issue: אֱיָלוּתִי 的含义
  choice: 我的力量
  alternative: 我的帮助；我的母鹿
  rationale: 上下文是诗人呼求上帝赶快施援，“我的力量”最能形成自然且有意义的呼称。不过该词罕见且词形可能关联不同词根，因此不把其他理解从文本传统中抹去，而在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。以两个感叹句保留原文急切呼求的节奏；“啊”和“求你”使希伯来语呼格及命令式在普通话中自然呈现。
