  text: גֹּ֣ל אֶל יְהוָ֣ה יְפַלְּטֵ֑/הוּ יַ֝צִּילֵ֗/הוּ כִּ֘י חָ֥פֵֽץ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/008.yaml
  text: “Commit yourself to Yahweh; let him rescue him; let him deliver him[a], since he delights in him!”
translation:
  language: zh_hans
  text: “把自己交托给耶和华吧[a]！愿耶和华搭救他；愿耶和华解救他，因为耶和华喜爱他！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交托”原文直译为“滚向耶和华”；这是把自己或自己的处境托付给他的习语。
    reason: 说明希伯来语字面意象及其习语含义。
lexical_decisions:
- source_word: גֹּל
  choice: 把自己交托
  rationale: 该命令式字面意为“滚、滚过去”，但与指向耶和华的介词短语连用时，是把自己或自己的处境托付给他的习语。译作“把自己交托”既符合现代汉语，也保留嘲讽中的命令语气。
- source_word: אֶל
  choice: 给
  rationale: אֶל表示朝向；在“交托给耶和华”这一自然汉语表达中，其方向性已得到体现。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以一般称号代替。
- source_word: יְפַלְּטֵהוּ
  choice: 搭救他
  rationale: פלט的Piel形式表示使人逃脱、救出。译作“搭救”清楚自然，并与下一动词有所区别。
- source_word: יַצִּילֵהוּ
  choice: 解救他
  rationale: נצל的Hiphil形式常指救出、夺回或使脱离危险；“解救”保留诗句的平行表达而不增添原文没有的细节。
- source_word: כִּי
  choice: 既然
  rationale: 该连词在这里引出嘲讽挑战所依据的理由；“既然……就……”自然地表达其因果关系。
- source_word: חָפֵץ בּוֹ
  choice: 喜爱他
  rationale: חפץ ב表示以某人为喜悦、喜爱某人。“喜爱他”简洁易懂，并保留关系性的含义。
theological_decisions:
- issue: 嘲讽话语中的人称与指代
  choice: 开头译作对受苦者的第二人称命令“把自己交托给耶和华”，随后以第三人称描述耶和华搭救他。
  alternative: 把开头处理成第三人称“把他交给耶和华”，或逐字译作“滚向耶和华”。
  rationale: גֹּל本身是第二人称阳性单数命令式，并没有第三人称宾语；后面两个动词则带第三人称单数宾语后缀。译文保留这种人称转换，同时为避免现代汉语连续多个“他”造成误解，明确重复“耶和华”作为后续分句的主语。
- issue: “喜爱”一语的主语
  choice: 明确为“耶和华喜爱他”。
  alternative: 保留为“因为他喜爱他”，使两个代词的所指停留在形式上的含混中。
  rationale: 希伯来语动词虽未明说主语，但最近且合乎语境的先行对象是耶和华；后续“搭救他、解救他”的主语也同样是耶和华。现代汉语若全用“他”会产生原文语境并不着重的混乱，因此明确所指而不改变命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的汉语，并保留敌人讥讽挑战的直接引语语气。“搭救／解救”体现两个近义动词的诗歌平行关系；重复“耶和华”是为消除汉语代词歧义。
