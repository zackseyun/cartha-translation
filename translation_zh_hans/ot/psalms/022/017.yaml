  text: אֲסַפֵּ֥ר כָּל עַצְמוֹתָ֑/י הֵ֥מָּה יַ֝בִּ֗יטוּ יִרְאוּ בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/017.yaml
  text: I can count all my bones[a]; they look[b], they stare at me.
translation:
  language: zh_hans
  text: 我能数清我所有的骨头[a]；他们看着我，盯着我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我数算我所有的骨头。”希伯来语动词可指“数算”，也可指“述说”；这里以“我所有的骨头”为宾语，较可能指逐一数算。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文连用两个表示观看的动词以加强语气，也可译作：“他们望着我，看着我。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפֵּר
  choice: 我能数清
  rationale: פִּעֵל词形在这里可指“数算”或“述说”；以“我所有的骨头”为宾语时，“数算”更合语境。“能数清”用自然汉语表达因骨头显露而可以逐一数出的意味，但不在正文中明说原因。
- source_word: כָּל
  choice: 所有的
  rationale: 直接保留希伯来文所表达的整体性。
- source_word: עַצְמוֹתָי
  choice: 我的骨头
  rationale: 采用直译，保留原诗鲜明的身体意象，不额外解释其成因。
- source_word: הֵמָּה
  choice: 他们
  rationale: 独立人称代词带有强调作用，指向观看诗人的人；现代汉语以明确的主语“他们”自然表达。
- source_word: יַבִּיטוּ
  choice: 看着
  rationale: 该词表示定睛观看；“看着”自然地表达持续注视，并与后一个视觉动词形成递进。
- source_word: יִרְאוּ
  choice: 盯着
  rationale: 字面义为“看见、看”，但与前一视觉动词并列时具有加强效果；“盯着”保留持续、强烈注视的语感，同时避免生硬重复。
- source_word: בִי
  choice: 我
  rationale: 介词与视觉动词连用，现代汉语自然译为“看着我、盯着我”。
theological_decisions:
- issue: 基督教传统中的弥赛亚意义
  choice: 按希伯来诗歌本身的哀歌语境翻译，保留身体受苦和旁人注视的意象，不加入钉十字架特有的措辞。
  alternative: 采用更受传统诠释影响的措辞，强化其与受难叙事的联系。
  rationale: 诗篇22篇在基督教传统中具有重要的基督论意义，但本节译文应首先忠实呈现希伯来文本；正典与基督论联系可由上下文显明，不应靠添加原文没有的表达来建立。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。以“数清”传达可逐一数出的惯用含义；以“看着我，盯着我”保留原文两个视觉动词的并列和递进，不额外加入“敌意”等解释性词语。
