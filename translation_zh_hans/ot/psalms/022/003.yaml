  source_fidelity: 正文“你以色列的颂赞为宝座”缺少必要介词，造成句法不通；即使补为“你以以色列的颂赞为宝座”，也会较明确地把“颂赞”界定为神所采用的宝座，较原文的“坐着／居住于……颂赞”意象更具释义性。改为“坐在以色列的颂赞之上”较直接保留 יֹשֵׁב 的坐席／登座图像及其与后项的关系。
