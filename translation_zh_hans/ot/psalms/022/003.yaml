  text: וְ/אַתָּ֥ה קָד֑וֹשׁ י֝וֹשֵׁ֗ב תְּהִלּ֥וֹת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/003.yaml
  text: Yet you are holy[a], enthroned on the praises of Israel.
translation:
  language: zh_hans
  text: 然而，你是圣洁的，坐在以色列的颂赞之上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“然而，你是圣洁的，居于以色列的颂赞中。”希伯来语分词可指“坐着”或“居住”；正文译法保留诗中的君王登座意象。
    reason: 说明 יֹשֵׁב 的词义范围，并保留其可作居住意象理解的可能。
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 然而，你
  rationale: 连词与独立代词形成对照，承接上文哀诉而转向对上帝的宣认；“然而”自然表达逆接意味，并保留明确的第二人称称呼。
- source_word: קָדוֹשׁ
  choice: 是圣洁的
  rationale: 该形容词在这里宣认上帝的圣洁；“圣洁”是现代汉语圣经语境中准确、庄重且易懂的表达。
- source_word: יֹשֵׁב
  choice: 以……为宝座
  rationale: 该分词本义为“坐着、居住”，用于上帝时可呈现君王登座的意象。“以……为宝座”在汉语中保留此诗性王权图景，同时在脚注中说明其本义所容许的另一种理解。
- source_word: תְּהִלּוֹת
  choice: 颂赞
  rationale: 复数名词指以色列一次次或多方面的赞美表达。汉语“颂赞”可作为集合性表达，既自然又保有诗体庄重感。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 依照现代汉语通行的专名译法。
theological_decisions:
- issue: יֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל 的意象与句法关系
  choice: 上帝以以色列的颂赞为宝座
  alternative: 上帝居于以色列的颂赞中
  rationale: 希伯来语最自然地把“以色列的颂赞”理解为分词“坐着／居住”的补足成分。正文采用王权性的登座意象，但借脚注保留“居住于其中”的真实词义可能，避免把诗句的含混性完全消除。
translation_notes:
  register: 采用现代、庄重而清晰的诗体汉语。“然而”凸显与上文哀诉的转折；分号保留两个并列宣认之间的停顿。“以……为宝座”比直译“坐在……之上”更自然，也保留王权意象。
