  text: אָכְל֬וּ וַ/יִּֽשְׁתַּחֲוּ֨וּ כָּֽל דִּשְׁנֵי אֶ֗רֶץ לְ/פָנָ֣י/ו יִ֭כְרְעוּ כָּל יוֹרְדֵ֣י עָפָ֑ר וְ֝/נַפְשׁ֗/וֹ לֹ֣א חִיָּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: All the prosperous of the earth will eat and bow down[c][b][a]; before him all who go down to the dust will kneel—even he who could not keep himself alive.
translation:
  language: zh_hans
  text: 地上一切丰足的人[a]都要吃，并俯伏敬拜；凡下到尘土中的人[b]，都要在他面前跪下；就连那不能保全自己性命的人，也要如此。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“地上一切肥壮的人”，大概指生活富足、饮食丰盛的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“凡下到尘土里的人”。“尘土”在希伯来诗歌中可象征人的必死性和死亡。
    reason: lexical_alternative
  - marker: c
    text: 末句希伯来文较难确定，字面近于“他的性命，他没有使之存活”，通常理解为“就连那不能保全自己性命的人”。
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: 都要吃喝
  rationale: 该词是“吃”的复数完成式；在本诗面向未来的诗性图景中，与后续敬拜动作相连，可自然表达为将来的“要吃喝”。中文“吃喝”在筵席语境中比单说“吃”更自然，但不额外限定筵席的性质。
- source_word: וַיִּשְׁתַּחֲווּ
  choice: 并俯伏敬拜
  rationale: שׁחה兼有身体俯伏和敬拜之意。“俯伏敬拜”保留身体动作，也明确呈现本段语境中的敬拜含义。
- source_word: כָּל דִּשְׁנֵי אֶרֶץ
  choice: 地上一切丰足的人
  rationale: דִּשְׁנֵי字面指“肥壮的人”，在此惯用地表示吃得饱足、生活富裕的人。“丰足的人”自然传达其社会处境，同时避免将形体肥胖误作重点。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 贴近希伯来语介词短语，并符合现代汉语表达。
- source_word: יִכְרְעוּ
  choice: 跪下
  rationale: כרע具体表示屈膝或跪下，与前句“俯伏”形成相关而不完全相同的身体意象。
- source_word: כָּל יוֹרְדֵי עָפָר
  choice: 凡下到尘土中的人
  rationale: 保留“下到尘土”这一希伯来诗歌关于死亡和必死性的意象，不直接解释成“坟墓”或“死人”。
- source_word: וְנַפְשׁוֹ לֹא חִיָּה
  choice: 就连那不能保全自己性命的人，也要如此
  rationale: 原句语法高度压缩，字面近于“他的性命，他没有使之存活”。正文采用常见理解，指无力维持自己生命的人；“也要如此”使其与前面的跪拜动作衔接，同时由脚注保留原文的不确定性。
theological_decisions:
- issue: 末句 וְנַפְשׁוֹ לֹא חִיָּה 的所指及句法关系
  choice: 理解为无力保全自己性命的人也在敬拜者之列
  alternative: 较直译为“他的性命，他未曾使之存活”，或将主语作非人称理解
  rationale: 上下文将地上丰足者与下到尘土者并列，常见理解是敬拜涵盖富足者和临近死亡者。正文采用可读的汉语表达，但以脚注明示希伯来文的困难，避免把有争议的句法包装成毫无歧义的教义断言。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。用“俯伏敬拜”和“跪下”分别呈现两个相关但有区别的希伯来动词；保留“尘土”这一诗性意象，并以脚注说明末句的句法歧义。
