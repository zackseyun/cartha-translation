  text: יָ֭בֹאוּ וְ/יַגִּ֣ידוּ צִדְקָת֑/וֹ לְ/עַ֥ם נ֝וֹלָ֗ד כִּ֣י עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/031.yaml
  text: They will come and declare his righteousness to a people yet to be born[c][b][a], that he has done it.
translation:
  language: zh_hans
  text: 他们必来，向尚未出生的民众[b]宣告他的公义[a]，说：“这是他所成就的。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的公正”。希伯来语所表达的公义含义较广，也可包括公正及施行拯救的行动。
    reason: lexical_alternative
  - marker: b
    text: 或译“将要出生的民众”。
    reason: lexical_alternative
  - marker: c
    text: 或译“因为他已经成就了这一切”。希伯来文末句十分简练，既可理解为所宣告的内容，也可理解为宣告的原因。
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹאוּ
  choice: 他们必来
  rationale: בוא 的 Qal 未完成式第三人称阳性复数，指向将来的行动；“必来”既保留前瞻意味，也符合诗歌庄重的语气。
- source_word: וְיַגִּידוּ
  choice: 宣告
  rationale: נגד 的 Hiphil 未完成式表示使人知道、公布；“宣告”体现公开传述的语气。
- source_word: צִדְקָתוֹ
  choice: 他的公义
  rationale: צדקה 可指公义、公正，也可涵盖上帝施行拯救的正义行动；正文采用较宽广且传统上易辨识的“公义”，不把含义限缩为单一层面。
- source_word: לְעַם
  choice: 向……的民
  rationale: 介词 לְ 在此标示宣告的对象；עַם 未带定冠词，所指是未来的一群民，而非语法上特指的某一民族。
- source_word: נוֹלָד
  choice: 尚未出生的
  rationale: ילד 的被动分词修饰“民”；结合全诗面向后世的语境，“尚未出生”自然表达其前瞻意义。
- source_word: כִּי
  choice: 说
  rationale: 将 כִּי 理解为引出所宣告的内容；汉语用“说”接直接引语，比直译为“即”更自然，同时保留内容从句的功能。
- source_word: עָשָׂה
  choice: 这是他所成就的
  rationale: עשה 的 Qal 完成式第三人称阳性单数表示“他做了／成就了”；希伯来文未明说宾语，汉语以“这”回指前文，并用“成就”保留结句简洁而有完成感的力度。
theological_decisions:
- issue: צדקה 在本诗中的含义
  choice: 正文译为“他的公义”
  alternative: 他的公正；他施行拯救的公义
  rationale: 该词兼有道德上的正直、公正及以正义施行拯救行动的意味。正文保留较宽广的“公义”，脚注列出“公正”，避免把神学含义缩窄。
- issue: 末句 כִּי עָשָׂה 的句法作用
  choice: 作为宣告的内容：“这是他所成就的”
  alternative: 作为原因：“因为他已经成就了这一切”
  rationale: 希伯来文结句极为简练；כִּי 可引出宣告的内容，也可能表示原因。正文采用较合上下文的内容用法，脚注保留因果读法，不消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“必来”“宣告”“成就”保持经文的公开见证与高潮感；正文不补入具体事件名称，以保留原文结句的概括性。所有脚注标记均置于正文相应词句之后。
