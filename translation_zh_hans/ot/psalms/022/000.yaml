- source_word: מִזְמוֹר
  choice: 诗
  rationale: 该名词指用于歌唱、常有乐器伴奏的诗歌；在诗篇题注中译作“诗”清楚而庄重。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 在诗篇题注中可表示作者、归属、关联或献呈；“大卫的”保留这种语义宽度，不武断限定为大卫亲自创作。
