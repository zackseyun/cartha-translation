base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/022.yaml
  text: I will declare your name to my brothers[a]; in the midst of the assembly I will praise you.
translation:
  language: zh_hans
  text: '我要向我的弟兄[a]述说你的名；

    在会众中，我要赞美你。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的弟兄姊妹”，若这里的亲属称谓在上下文中包括男女；希伯来文直译为“我的弟兄”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: 我要……述说
  rationale: ספר 的皮埃勒式在此表示讲述、宣告。译作“述说”既贴近原文，也自然传达公开见证的意味，并与下句“赞美”相呼应。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 保留希伯来语“名”的表达；这里不仅指称谓，也承载上帝所启示的身份、品格和声誉，中文圣经语境中自然可懂。
- source_word: לְאֶחָי
  choice: 向我的弟兄
  rationale: 原文是阳性复数名词并带第一人称单数后缀，直译为“我的弟兄”。正文保留其语法形式；可能包含群体中男女成员的语境意义则以脚注说明。
- source_word: בְּתוֹךְ
  choice: 在……中
  rationale: 准确表达处于聚集群体之中的位置和公开场景；现代中文中比“在……当中”更简洁自然。
- source_word: קָהָל
  choice: 会众
  rationale: קָהָל 指聚集起来的群体。“会众”在诗歌和敬拜语境中庄重而易懂，突出共同聚集的人群，不必限定为后来的教会制度。
- source_word: אֲהַלְלֶךָּ
  choice: 我要赞美你
  rationale: הלל 的皮埃勒式在此直接表示“赞美”，宾语后缀译为“你”；不增添原文未明确表达的歌唱含义。
theological_decisions:
- issue: 公共敬拜语境中的性别化亲属称谓
  choice: 我的弟兄
  alternative: 我的弟兄姊妹
  rationale: 原文 אֶחָי 在形式上是阳性复数“我的弟兄”。正文据实保留这一形式，不把可能存在的包容性所指直接写入正文；同时用脚注保留其在群体语境中也可能涵盖女性成员的理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体中文。两分句保留原文平行结构和第一人称将来／意愿表达；“你的名”“会众”等用语兼顾源语形式与中文圣经语域。
