  text: וְ/אָנֹכִ֣י תוֹלַ֣עַת וְ/לֹא אִ֑ישׁ חֶרְפַּ֥ת אָ֝דָ֗ם וּ/בְז֥וּי עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/006.yaml
  text: But I am a worm and not a man[c][b][a], scorned by mankind and despised by the people.
translation:
  language: zh_hans
  text: 但我是一条虫，不是人；受世人羞辱，被众人藐视。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אָנֹכִי
  choice: 但我
  rationale: אָנֹכִי是强调性的第一人称单数代词；连接词וְ在此承接上文并形成鲜明转折，译作“但”符合诗篇语境和现代汉语表达。
- source_word: תוֹלַעַת
  choice: 一条虫
  rationale: 该词指虫或幼虫，在此比喻极度卑微和受辱；“一条虫”自然、清楚，也不额外限定虫的种类。
- source_word: וְ/לֹא אִישׁ
  choice: 不是人
  rationale: 直译其强烈对比，表达说话者仿佛被剥夺了人的尊严和地位，而非作关于其本体的解释。
- source_word: חֶרְפַּת אָדָם
  choice: 受世人辱骂
  rationale: חֶרְפַּת可指羞辱、辱骂或受人嗤笑；אָדָם在此为集合意义的人类。此译把希伯来语名词结构自然地转为汉语动词结构，表达说话者成为众人羞辱对象的意思。
- source_word: וּ/בְזוּי
  choice: 被……藐视
  rationale: 被动分词表示遭人轻看、鄙弃；“被藐视”简洁庄重，并与前一分句构成诗意平行。
- source_word: עָם
  choice: 众民
  rationale: עָם指作为整体的民众；“众民”既保留集合意义，又适合诗歌体裁，避免与前面的“世人”完全重复。
theological_decisions:
- issue: 基督论及预表性解读
  choice: 按希伯来诗句本身呈现说话者所受的卑微与羞辱，不在正文中加入明确的弥赛亚解释。
  alternative: 使用带有更明显基督论指向的扩展措辞。
  rationale: 诗篇22篇在新约和基督教传统中具有基督论意义，但本节自身采用受辱者的第一人称诗歌语言；译文应忠实保留这一表达，让正典关联由上下文显明。
- issue: “不是人”的性质
  choice: 保留诗歌性的强烈夸张，不解释为字面上的非人身份。
  alternative: 意译为“不被当人看”或“不再有人的尊严”。
  rationale: 原文简洁而尖锐，既表达彻底受辱，也保留诗性张力；正文直译可避免过早消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“一条虫”保留原文鲜明意象；分号呈现两组平行陈述。“世人”与“众民”分别对应אָדָם和עָם，在汉语中既自然，又保留原文用词差异。
