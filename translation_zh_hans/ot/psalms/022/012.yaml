  text: סְ֭בָבוּ/נִי פָּרִ֣ים רַבִּ֑ים אַבִּירֵ֖י בָשָׁ֣ן כִּתְּרֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/012.yaml
  text: Many bulls surround me[a]; mighty bulls of Bashan encircle me.
translation:
  language: zh_hans
  text: '许多公牛围住我[a]；

    巴珊的壮牛环绕我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 巴珊是约旦河东的一个地区，以牧场肥沃、牛群强壮肥硕闻名；这里的公牛形象象征强大而凶猛的敌对者。
    reason: cultural_note
lexical_decisions:
- source_word: סְבָבוּנִי
  choice: 围住我
  rationale: 源自动词סבב，意为“围绕、包围”。完成式描绘诗人已陷入包围；“围住我”在现代汉语中简洁有力。
- source_word: פָּרִים רַבִּים
  choice: 许多公牛
  rationale: פָּרִים是פַּר的复数，可指公牛或幼壮公牛；רַבִּים意为“许多”。保留公牛意象，不解释性改写为“敌人”。
- source_word: אַבִּירֵי בָשָׁן
  choice: 巴珊的壮牛
  rationale: אַבִּירֵי可指强壮者、大能者；在前句公牛意象和巴珊牧牛背景中，译为“壮牛”既承接意象，也自然表达其威猛。בָשָׁן按地名音译为“巴珊”。
- source_word: כִּתְּרוּנִי
  choice: 环绕我
  rationale: 源自动词כתר，意为“围绕、环绕”。与前半句构成平行，同时用词略有变化，保留诗歌节奏。
theological_decisions:
- issue: 以公牛比喻敌对者的动物意象
  choice: 正文直接保留“公牛／壮牛”的比喻
  alternative: 解释性译为“许多敌人围住我；巴珊的强者环绕我”
  rationale: 希伯来文本以动物意象呈现威胁者。直接保留可维持诗歌的冲击力，并避免把隐喻在正文中提前解释。
- issue: אַבִּירֵי所指是“壮牛”还是较抽象的“强者”
  choice: 结合前句与巴珊背景译作“壮牛”
  alternative: “巴珊的强者”或“巴珊的大能者”
  rationale: 该词本身存在“强壮者／大能者”的语义范围，但与פָּרִים形成同位或延续关系，且巴珊以肥壮牲畜闻名，因此“壮牛”最能保持上下文意象，同时不排除其象征敌对强者。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两行以“围住／环绕”保持希伯来平行结构及词汇变化；“壮牛”比“强壮的公牛”更凝练，适合诗体。
