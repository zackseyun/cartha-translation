  text: יִרְאֵ֤י יְהוָ֨ה הַֽלְל֗וּ/הוּ כָּל זֶ֣רַע יַעֲקֹ֣ב כַּבְּד֑וּ/הוּ וְ/ג֥וּרוּ מִ֝מֶּ֗/נּוּ כָּל זֶ֥רַע יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/023.yaml
  text: You who fear Yahweh[a], praise him! All offspring of Jacob, honor him! Stand in awe of him, all offspring of Israel!
translation:
  language: zh_hans
  text: '敬畏雅威的人哪，要赞美他！


    雅各的所有后裔啊，要尊崇他！


    以色列的所有后裔啊，要在他面前战兢[a]！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要敬畏他”或“要惧怕他”。这里的希伯来语动词含有因敬畏而战兢的意思。
    reason: 说明 וְגוּרוּ 的词义范围，并保留敬畏、惧怕与战兢之间的翻译可能。
lexical_decisions:
- source_word: יִרְאֵי יְהוָה
  choice: 敬畏雅威的人
  rationale: 该结构指以敬畏雅威为特征的人；后面的复数命令语气表明这里是直接呼告。“敬畏”兼具畏惧与尊崇之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见现代音译处理，保留专名性质，不以“主”这一称号替代。
- source_word: הַלְלוּהוּ
  choice: 要赞美他
  rationale: 复数命令式带第三人称阳性单数后缀，直指前面的雅威；“赞美”符合敬拜语境，也简明自然。
- source_word: כָּל זֶרַע יַעֲקֹב
  choice: 雅各所有的后裔
  rationale: זֶרַע 在此为集合名词，指雅各全体后代；“所有的后裔”在现代汉语中自然，并保留呼召的全面性。
- source_word: כַּבְּדֻהוּ
  choice: 要尊崇他
  rationale: כבד 的加强词干命令式要求人将当得的分量和尊荣归给他；“尊崇”比单说“尊重”更符合对上帝的诗歌语域。
- source_word: וְגוּרוּ מִמֶּנּוּ
  choice: 要因他战兢
  rationale: גור 与 מִן 的组合表达因某位对象而畏惧、战兢。“因他战兢”保留强烈的敬畏和震惧感，也避免与首句 ירא 的“敬畏”完全合并。
- source_word: כָּל זֶרַע יִשְׂרָאֵל
  choice: 以色列所有的后裔
  rationale: 与“雅各所有的后裔”构成诗体平行，保留 זֶרַע 的集合意义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其为以色列之上帝专名的性质，而不以称号替代。
- issue: וְגוּרוּ מִמֶּנּוּ 所表达的敬畏程度
  choice: 要因他战兢
  alternative: 要敬畏他；要惧怕他
  rationale: 原文在首句“敬畏雅威的人”之后另用 גור，带有畏惧、震颤的色彩。“战兢”既保留这种力度，也不把它淡化为一般尊敬；脚注列出可行译法，以保存词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌呼告语体；以“哪”“啊”显明直接呼告，并用三个“要……”呈现原文连续命令的节奏。三行排列保留平行结构。
