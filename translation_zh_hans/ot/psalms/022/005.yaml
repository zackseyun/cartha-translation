source:
  edition: WLC
  text: אֵלֶ֣י/ךָ זָעֲק֣וּ וְ/נִמְלָ֑טוּ בְּ/ךָ֖ בָטְח֣וּ וְ/לֹא בֽוֹשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/005.yaml
  text: To you they cried out and were delivered[b][a]; in you they trusted and were not put to shame.
translation:
  language: zh_hans
  text: 他们向你呼求，就得了拯救[a]；他们信靠你，就没有蒙羞[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“就脱了险”或“就获救了”。希伯来语动词既可指逃脱，也可指得到解救；这里说的是他们向神呼求之后获救。
    reason: lexical_alternative
  - marker: b
    text: 或译“就没有羞愧”或“就没有失望”。这里的希伯来语常指信靠没有落空，因而未受羞辱。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词 אֶל 加第二人称阳性单数词尾表示呼求所朝向的对象；“向你”符合现代汉语表达。
- source_word: זָעֲקוּ
  choice: 呼求
  rationale: זעק 指人在危难中大声求助；“呼求”既保留求援意味，也适合诗篇祷告语境。
- source_word: וְנִמְלָטוּ
  choice: 就得了拯救
  rationale: מלט 的尼פעל式可指逃脱或获救；上下文是向神呼求后获得解救，因此译作“得了拯救”，同时以脚注保留“脱险”的词义可能。
- source_word: בְּךָ בָטְחוּ
  choice: 他们信靠你
  rationale: בטח 搭配 בְּ 表示以某人为信赖的对象；“信靠你”自然、凝练，也保留倚赖神的含义。
- source_word: וְלֹא בֹשׁוּ
  choice: 就没有蒙羞
  rationale: בוש 在信靠语境中常指因所倚赖的落空而受羞辱；“没有蒙羞”保留荣辱层面的结果意义，而不局限于内心羞愧。
theological_decisions:
- issue: נִמְלָטוּ 所表达的解救性质
  choice: 在向神呼求后得蒙拯救
  alternative: 仅指脱逃，不凸显施救者
  rationale: 经文把向神呼求与随后获救并列；“得了拯救”呈现这一神学逻辑，却不增添经文未说明的具体方式。
- issue: בֹשׁוּ 在信靠语境中的荣辱含义
  choice: 没有蒙羞
  alternative: 没有羞愧；没有失望
  rationale: 此处重点不只是主观情绪，也包括信靠没有落空、信靠者未受羞辱的结果；“蒙羞”较完整地保留这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“呼求—拯救”“信靠—蒙羞”形成两个平行分句；用“就”清楚表达呼求、信靠与结果之间的关系，而不额外说明拯救的具体形式。
