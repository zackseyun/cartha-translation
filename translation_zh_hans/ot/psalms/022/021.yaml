base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/021.yaml
  text: Save me from the mouth of the lion[b][a], and from the horns of the wild oxen—you have answered me.
translation:
  language: zh_hans
  text: '求你救我脱离狮子的口，

    脱离野牛[a]的角——

    你已经回应我了[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “野牛”也可译作“野公牛”或“原牛”；希伯来文所指的是一种强壮的野生牛科动物。
    reason: lexical_alternative
  - marker: b
    text: 原文在这里突然改用完成式，可理解为祷告已蒙回应的宣告：“你已经回应我了”，标志着诗歌由哀求转向确信；也有人将这句话与前面的求告连读。
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: 求你救我
  rationale: 这是ישׁע的使役式命令形，带第一人称单数后缀，表达直接而迫切的求救。“求你救我”既符合现代汉语祷告语气，也保留“拯救、搭救”的宽广含义。
- source_word: מִפִּי
  choice: 脱离……的口
  rationale: 原文直译为“从……的口”。保留“口”而不改作“利齿”或“虎口”，可忠实呈现诗中的具体意象。
- source_word: אַרְיֵה
  choice: 狮子
  rationale: 原文为单数且没有冠词；汉语无需添加指示或数量成分，“狮子”可自然地作泛指。
- source_word: וּמִקַּרְנֵי
  choice: 脱离……的角
  rationale: 介词与复数名词构成第二个危险意象。汉语中承接上句重复“脱离”更清楚自然；“角”按原文保留。
- source_word: רֵמִים
  choice: 野牛
  rationale: רְאֵם的复数指强壮的野生牛科动物，很可能是原牛一类，而不是后世传统所说的“独角兽”。“野牛”在现代汉语中清楚易懂，也保留了物种上的适度概括。
- source_word: עֲנִיתָנִי
  choice: 你已经回应我了
  rationale: 这是ענה的Qal完成式第二人称阳性单数，带第一人称单数后缀，基本义为“你回答了我”。“回应我”在汉语祷告语境中自然，又不像“应允”那样必然暗示所求完全照准；“已经……了”表现完成式及其当前结果，并保留语气突然由哀求转向确信的效果。
theological_decisions:
- issue: עֲנִיתָנִי应理解为继续求告，还是宣告祷告已蒙回应
  choice: 作为突然转折的宣告：“你已经回应我了”
  alternative: 把末句与前面的求告连读，理解为求上帝从野牛角前救援或回应
  rationale: 希伯来文使用完成式而非命令式，最直接的句法理解是“你回答了我”。这一突转也与本诗随后由哀求进入宣告和赞美相吻合。译文用破折号保留突兀感，脚注同时说明另一种连读可能，不把原文张力抹平。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。分行与破折号呈现希伯来诗句的节奏和末句的突然转折；避免使用带有特定宗派色彩的术语。
