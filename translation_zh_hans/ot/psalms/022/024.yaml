id: PSA.22.24
reference: Psalms 22:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/024.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
translation:
  language: zh_hans
  text: 因为他没有轻看，也没有厌恶受苦之人的苦难[a]；他没有向他掩面，他向他呼救时，他就垂听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“穷苦人的困境”，或“受苦之人的屈辱”。
    reason: עֱנוּת与עָנִי的组合可分别侧重苦难、困境或屈辱，以及受苦、贫穷或困苦者。
lexical_decisions:
- source_word: בָזָה
  choice: 轻看
  rationale: 表达以轻蔑态度看待，与后面语气更强的“厌恶”自然并列。
- source_word: שִׁקַּץ
  choice: 厌恶
  rationale: 保留视为可憎、令人嫌恶的较强语气，又符合现代汉语表达。
- source_word: עֱנוּת
  choice: 苦难
  rationale: 涵盖受苦、困顿或受压迫的状态，不把含义局限于内在感受或社会处境。
- source_word: עָנִי
  choice: 受苦之人
  rationale: 保留该词在本诗语境中受困苦、受压迫的宽泛意义，不限于经济贫穷。
- source_word: הִסְתִּיר פָּנָיו
  choice: 掩面
  rationale: 保留希伯来文关于不予眷顾或临在的形象，同时在中文圣经语体中清楚自然。
- source_word: מִמֶּנּוּ
  choice: 向他
  rationale: 依中文惯用搭配将“从他那里掩藏自己的脸”译作“向他掩面”，其中单数代词回指受苦之人。
- source_word: בְשַׁוְּעוֹ
  choice: 他向他呼救时
  rationale: 明确传达求助呼喊的急切含义，并将介词结构自然转化为时间从句。
- source_word: אֵלָיו
  choice: 向他
  rationale: 保留原文代词，由上下文指向上帝，不另行加入原文没有的神名。
- source_word: שָׁמֵעַ
  choice: 垂听
  rationale: 保留“听见、听取”的基本意义；“垂听”自然表达上帝听人的呼求，又不增译为“应允”。
theological_decisions:
- issue: 受苦之人的所指
  choice: 用单数“受苦之人／他”，既可承接诗人的亲身经历，也可表达较广的一般性陈述。
  alternative: 明确译为弥赛亚受苦者，或纯粹泛指任何贫穷者。
  rationale: 希伯来文的单数形式容许诗篇当下的第一人称处境与更广的原则并存；译文不强行排除任何一面。
translation_notes:
  register: 采用庄重而现代的标准普通话。“轻看／厌恶”保留两个动词的递进；“掩面”保留原文意象；“垂听”保持敬虔语域，但不把“听见”解释性扩展为“应允”。
