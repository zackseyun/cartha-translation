  text: אַל תִּרְחַ֣ק מִ֭מֶּ/נִּי כִּי צָרָ֣ה קְרוֹבָ֑ה כִּי אֵ֥ין עוֹזֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/011.yaml
  text: Do not be far from me[a], for trouble is near, for there is no helper.
translation:
  language: zh_hans
  text: '不要远离我，


    因为患难[a]临近，


    因为无人帮助。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难”也可译作“困苦”或“危难”。希伯来语这个词可泛指困境、痛苦或灾祸。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: 不要离我远
  rationale: 保留רחק与מן构成的空间意象及祈求语气；现代汉语中“离我远”自然庄重，也不擅自强化为“离弃我”。
- source_word: כִּי
  choice: 因为
  rationale: 两处כִּי都说明祈求的理由；重复译为“因为”，保留希伯来诗句的结构和层层迫近的语势。
- source_word: צָרָה
  choice: 患难
  rationale: 该名词可指患难、困苦或危难；“患难”既涵盖广，又符合哀歌的庄重语域，不限定痛苦的具体性质。
- source_word: קְרוֹבָה
  choice: 临近
  rationale: 该阴性形容词与צָרָה呼应，作谓语表示“近”；“临近”传达危难逼近的紧迫感，同时不添加原文没有的时态信息。
- source_word: אֵין עוֹזֵר
  choice: 无人帮助
  rationale: אֵין表示不存在，עוֹזֵר是实词化的主动分词，意为“帮助者/施助的人”；“无人帮助”是自然简洁的现代汉语，并保留人的施助含义。
theological_decisions:
- issue: 哀歌中上帝距离遥远的表达
  choice: 不要离我远
  alternative: 不要离弃我
  rationale: 原文采用空间性的רחק（远离），并未直接使用“离弃”的词；保留空间隐喻，可维持诗人感受到神遥远时的神学张力，而不把它解释为已遭遗弃。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。分为三行以呈现原文的祈求及两个理由；保留两次“因为”，避免把原文的重复结构抹平。
