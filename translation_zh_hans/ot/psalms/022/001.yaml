  text: אֵלִ֣/י אֵ֭לִ/י לָ/מָ֣ה עֲזַבְתָּ֑/נִי רָח֥וֹק מִֽ֝/ישׁוּעָתִ֗/י דִּבְרֵ֥י שַׁאֲגָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/001.yaml
  text: My God[a], my God[c][b], why have you forsaken me? Far from my salvation are the words of my roaring.
translation:
  language: zh_hans
  text: 我的上帝，我的上帝，你为什么离弃我？我的救援远离我吼叫的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可按延续上句的疑问来理解：“你为什么远离我，不来救援我，也不顾我吼叫的话？”希伯来语末句十分简练，句法关系有歧义。“救援”也可译作“拯救”“解救”或“帮助”；“吼叫”也可译作“呻吟”或“呼喊”。
    reason: 保留末句的句法歧义和主要词义选择。
lexical_decisions:
- source_word: אֵלִי אֵלִי
  choice: 我的上帝，我的上帝
  rationale: 保留第一人称所属后缀和重复呼告，传达诗人在痛苦中直接向上帝倾诉。
- source_word: לָמָה
  choice: 为什么
  rationale: 这是询问原因的常用词；译作“为什么”自然、直接，并保留哀歌的力度。
- source_word: עֲזַבְתָּנִי
  choice: 你……离弃我
  rationale: 该动词可指离开、抛弃或弃绝；“离弃”准确而庄重，也符合汉语哀歌语体。
- source_word: רָחוֹק מִישׁוּעָתִי
  choice: 远离我的拯救
  rationale: 尽量保留希伯来语压缩而突兀的谓语结构。יְשׁוּעָה 在此可指拯救、解救或帮助；“拯救”既保留词义广度，也不把经文限制为抽象的教义术语。
- source_word: דִּבְרֵי שַׁאֲגָתִי
  choice: 我呼吼的话
  rationale: דִּבְרֵי 是“……的话”，שַׁאֲגָה 本义为吼叫，并可描写人在极深痛苦中的大声呼喊；“呼吼”保留鲜明意象及强烈程度。
theological_decisions:
- issue: 在具有弥赛亚互文意义的诗篇中翻译 יְשׁוּעָה
  choice: 我的拯救
  alternative: 我的解救／我的帮助
  rationale: 本节首先表达诗人渴望实际获救的处境。“拯救”保留原词的广度及后续经文互文的可能性，却不强行加入某一特定教义解释。
- issue: 末句压缩句法的理解
  choice: 我呼吼的话，远离我的拯救
  alternative: 你远离对我的拯救，也远离我呼吼的话
  rationale: 希伯来语没有在末句明说“你”，也没有重复疑问词。正文保留“我呼吼的话”作前置主项的形式和原文的张力，不补入解释性的主语或第二个问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“呼吼”略带诗性，用来保留希伯来语中如猛兽吼叫般的强烈痛苦意象；末句刻意保留原文压缩、突兀的表达。
