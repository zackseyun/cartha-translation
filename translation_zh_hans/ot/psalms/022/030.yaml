  text: זֶ֥רַע יַֽעַבְדֶ֑/נּוּ יְסֻפַּ֖ר לַֽ/אדֹנָ֣/י לַ/דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/030.yaml
  text: A seed will serve him; it will be proclaimed about the Lord to the generation.
translation:
  language: zh_hans
  text: 后裔必事奉他；人必向后来的世代传讲主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶרַע
  choice: 后裔
  rationale: 该词字面为“种子”，用于人时常指后代或子孙；本诗语境谈及将来的世代，因此译作“后裔”比直译“种子”更自然，同时保留群体性的含义。
- source_word: יַעַבְדֶנּוּ
  choice: 必事奉他
  rationale: עבד 在以神为对象时表示敬奉、服事；未完成式在此表达将来的行动。宾语“他”按原文保留，不额外明确其所指。
- source_word: יְסֻפַּר
  choice: 人必……传讲
  rationale: 这是 ספר 的被动式，意为“被述说、被传讲”。中文用泛指主语“人”转为自然的主动表达，未把隐含讲述者具体化。
- source_word: לַאדֹנָי
  choice: 主
  rationale: 原文为 אֲדֹנָי（主），并非四字神名，故译“主”而不译“耶和华”。
- source_word: לַדּוֹר
  choice: 向后来的世代
  rationale: 字面为“向那世代”。定冠词所指并不完全明确；结合上下文，指将来的世代。译文以“后来的”传达时间关系，但不限定为某一个具体年代。
theological_decisions:
- issue: “后裔”的单数或集体含义
  choice: 采用可作集体名词理解的“后裔”
  alternative: 一个后裔／种子
  rationale: זֶרַע 语法上为单数形式，却常具有集合意义。此处不将其明确限定为单独一人，也不排除单数层面的理解。
- issue: 传讲的内容是“主”还是“关于主的事”
  choice: 译为“传讲主”
  alternative: 关于主的事必被传讲
  rationale: לַאדֹנָי 可与被动动词理解为“关于主／属主”。“传讲主”在中文中自然地表示以主为宣讲内容，同时保留原文关系上的简约与一定歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个分句保持希伯来诗句的简洁与将来指向；不加入原文未明说的弥赛亚身份、具体讲述者或特定历史世代。
