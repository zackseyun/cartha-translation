base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/015.yaml
  text: My strength is dried up like a potsherd[a], and my tongue sticks to my jaws; you lay me in the dust of death.
translation:
  language: zh_hans
  text: 我的力量干枯，如同陶片；我的舌头紧贴在我的颌骨上[a]；你把我置于死亡的尘土中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “颌骨”所译的希伯来词意义不确定；也可译作“上颚”或泛指口腔部位。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: 枯干
  rationale: 表达身体力量、活力如失去水分般衰竭的状态，也保留诗歌中的干枯意象。
- source_word: כַּחֶרֶשׂ
  choice: 如同瓦片
  rationale: חֶרֶשׂ可指陶器碎片；现代汉语“瓦片”简洁可懂，并能传达干硬易碎的形象。
- source_word: כֹּחִי
  choice: 我的力量
  rationale: 此处指身体的力量或活力，“力量”自然且不引入抽象权柄之意。
- source_word: וּלְשׁוֹנִי
  choice: 我的舌头
  rationale: 保留直接的身体部位表述。
- source_word: מֻדְבָּק
  choice: 紧贴
  rationale: 该被动分词表示被黏住、贴住的状态；“紧贴”自然地呈现极度干渴的身体感受。
- source_word: מַלְקוֹחָי
  choice: 上膛
  rationale: 该词所指口腔部位不确定；正文采用可指口腔上部的“上膛”，同时以脚注保留“颌骨”等可能。
- source_word: וְלַעֲפַר
  choice: 在……尘土中
  rationale: 介词ל在此可表示趋向或置于某处；结合动词译为“安置在……中”符合现代汉语。
- source_word: מָוֶת
  choice: 死亡的
  rationale: 保留“死亡的尘土”这一属格式诗意表达，不将其解释性地改写为“坟墓”。
- source_word: תִּשְׁפְּתֵנִי
  choice: 你把我安置
  rationale: 动词为第二人称阳性单数并带第一人称单数宾语，基本义是放置、安放；“安置”保留直接向上帝说话及其施事性。
theological_decisions:
- issue: 末句中的施事者
  choice: 直接向上帝陈说：“你把我安置在死亡的尘土中。”
  alternative: 采用非人称或结果式表达：“我被置于死亡的尘土中。”
  rationale: 希伯来文动词明确为第二人称阳性单数，带第一人称单数宾语，最自然的是诗人直接对上帝说话。这样保留受苦者把自己的绝境归于上帝行动的神学张力，而不解释这种神圣施事与敌对者行为之间的关系。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“枯干”“死亡的尘土”保留原文强烈意象；分号和句号呈现三重递进。正文脚注标记与脚注完全对应。
