  text: לָבְשׁ֬וּ כָרִ֨ים הַ/צֹּ֗אן וַ/עֲמָקִ֥ים יַֽעַטְפוּ בָ֑ר יִ֝תְרוֹעֲע֗וּ אַף יָשִֽׁירוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/013.yaml
  text: The pastures are clothed with flocks[a], and the valleys wrap themselves in grain; they shout for joy, yes[b], they sing.
translation:
  language: zh_hans
  text: 草场披上了羊群[a]，山谷也裹满五谷；草场和山谷都欢呼，也都歌唱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “草场”或译“草地”。这里的希伯来语名词按语境指牧草地；同一词形在别处也可指“公绵羊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבְשׁוּ
  choice: 披上了
  rationale: 保留“穿上、披上”的诗歌隐喻，并使草场作为主动主体的拟人表达在中文中自然成立。
- source_word: כָרִים
  choice: 草场
  rationale: 此处与“山谷”平行，又由“羊群”覆盖，语境支持指牧场或草地，而不是“公绵羊”；“草场”简洁自然。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: 该集合名词指小型牲畜，尤指绵羊和山羊；中文“羊群”保留集合意义，也适合本节的田园图景。
- source_word: וַעֲמָקִים
  choice: 山谷也
  rationale: “山谷”直接传达复数地貌名词；以“也”连接，体现平行诗句的递进关系。
- source_word: יַעַטְפוּ
  choice: 裹满
  rationale: 原词意为包裹、覆盖，主动形式以山谷为主语；“裹满”既保存拟人意象，也呈现丰收遍布山谷的画面。
- source_word: בָר
  choice: 五谷
  rationale: 原词泛指谷物，并不限定为小麦；“五谷”在现代中文诗体中自然庄重，表示各种庄稼谷物。
- source_word: יִתְרוֹעֲעוּ
  choice: 欢呼
  rationale: 该动词表示发出响亮呼声，语境带有喜乐意味；“欢呼”与后面的“歌唱”形成自然的诗歌平行。
- source_word: אַף
  choice: 且
  rationale: 此处粒子强化并推进后一句，不只是普通并列；“且”简练地表达“并且、甚至还”的强调延续。
- source_word: יָשִׁירוּ
  choice: 歌唱
  rationale: 直接表达“唱歌”，并与“欢呼”构成递进的结尾。
theological_decisions: []
