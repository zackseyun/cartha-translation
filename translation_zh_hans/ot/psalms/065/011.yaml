  text: עִ֭טַּרְתָּ שְׁנַ֣ת טוֹבָתֶ֑/ךָ וּ֝/מַעְגָּלֶ֗י/ךָ יִרְעֲפ֥וּ/ן דָּֽשֶׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/011.yaml
  text: You crown the year with your goodness[b][a], and your paths drip with abundance.
translation:
  language: zh_hans
  text: 你以你的美善为这一年加冠[a]；你的路径滴下丰饶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你以你的福泽使这一年圆满。”原文直译近于“你以你的美善为这一年加冠”。
    reason: lexical_alternative
  - marker: b
    text: 原文意为“肥美、丰腴”，用以描绘土地的富饶和供应的充足。“路径”也可译作“轨迹”或“车辙”；这意象或描绘上帝行经之处留下丰饶。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִטַּרְתָּ
  choice: 加冠
  rationale: 保留“戴冠、加冠”的鲜明比喻，表达上帝以恩惠使全年臻于丰盛；中文诗体中简洁庄重。
- source_word: שְׁנַת
  choice: 年岁
  rationale: 该词为“年”的构造形式；译作“年岁”既自然，又适合诗歌语体。
- source_word: טוֹבָתֶךָ
  choice: 你的美善
  rationale: טוֹבָה 可指美善、福惠或丰盛。主文采用较宽广的“美善”，既指向上帝的恩惠，也不把农业语境中的福泽缩窄为物质出产。
- source_word: וּמַעְגָּלֶיךָ
  choice: 你的路径
  rationale: מַעְגָּל 可指路径、轨迹或车辙。“路径”清楚自然，并保留上帝行经大地、所到之处留下丰饶的诗意空间。
- source_word: יִרְעֲפוּן
  choice: 滴下
  rationale: 该动词有滴落、滴流之意；“滴下”保留具体意象，不将其泛化为“充满”或“赐下”。
- source_word: דָּשֶׁן
  choice: 丰肥
  rationale: דָּשֶׁן 本义涉及肥美、丰腴，引申为富饶。“丰肥”在农业语境中兼顾原文的具体性和现代中文的可理解性。
theological_decisions:
- issue: 是否将农业祝福的诗歌意象改写为直白陈述
  choice: 保留上帝为年岁加冠、路径滴下丰肥的双重比喻
  alternative: 意译为“你使全年蒙福，使各处出产丰富”
  rationale: 原文刻意用加冠与滴流描绘上帝带来的丰饶；保留这些意象可避免把诗歌及其神学张力压平为说明性散文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“加冠”保存希伯来文的核心比喻；“丰肥”略带诗意，但在上下文中能自然传达土地肥沃、供应丰足。脚注标记均置于相关主文之后。
