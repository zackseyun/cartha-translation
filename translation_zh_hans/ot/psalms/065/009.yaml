  text: פָּקַ֥דְתָּ הָ/אָ֨רֶץ וַ/תְּשֹׁ֪קְקֶ֡/הָ רַבַּ֬ת תַּעְשְׁרֶ֗/נָּה פֶּ֣לֶג אֱ֭לֹהִים מָ֣לֵא מָ֑יִם תָּכִ֥ין דְּ֝גָנָ֗/ם כִּי כֵ֥ן תְּכִינֶֽ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/009.yaml
  text: You visit the earth and water it[a]; you greatly enrich it. The river of God is full of water; you prepare their grain[b], for so you prepare the earth.
translation:
  language: zh_hans
  text: 你眷顾大地，浇灌它，使它极其肥沃。神的河流[a]满了水；你为他们预备五谷[b]，因为你就是这样预备大地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神的溪流”或“神的水道”。原文是诗意表达，可能使人联想到从天而来的雨水与丰饶之源。
    reason: lexical_alternative
  - marker: b
    text: “预备”也可译作“供应”或“使……就绪”。原文动词可表示预备、使就绪或建立。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקַדְתָּ
  choice: 眷顾
  rationale: 该动词可表示“察看、临到、眷顾”。本节语境是上帝赐下雨水、使土地丰饶，因此“眷顾”既保留上帝主动临到的含义，也自然传达其恩惠性的作为。
- source_word: וַתְּשֹׁקְקֶהָ
  choice: 浇灌它
  rationale: 此处指给大地供应水分。“浇灌”符合农业意象，也比笼统的“使它丰足”更具体。
- source_word: רַבַּת תַּעְשְׁרֶנָּה
  choice: 使它极其肥沃
  rationale: רַבַּת 加强使役形态的 עשר，表达“使之非常丰足、富饶”。针对大地，用“肥沃”自然呈现土地因水而丰饶的含义。
- source_word: פֶּלֶג אֱלֹהִים
  choice: 神的河流
  rationale: 直译保留原文庄严而富有诗意的属格结构；פֶּלֶג 也可指溪流或水道，因此另以脚注说明。
- source_word: מָלֵא מָיִם
  choice: 满了水
  rationale: 直接保留原文简洁而鲜明的丰沛水量意象。
- source_word: תָּכִין דְּגָנָם
  choice: 你为他们预备五谷
  rationale: כון 的使役形态可指“预备、使就绪、建立”；农业语境下“预备”最贴切。דָּגָן 以“五谷”表达供人食用的谷物；复数阳性后缀译为“他们”，不把所指对象过度明确化。
- source_word: כִּי כֵן תְּכִינֶהָ
  choice: 因为你就是这样预备大地
  rationale: 重复“预备”以保留两次 כון 的词语呼应；阴性单数后缀回指“大地”，在中文中明说“大地”可避免指代不清。
theological_decisions:
- issue: “他们的五谷”中复数后缀的所指
  choice: 译作“你为他们预备五谷”，保留未明说所指对象的复数代词。
  alternative: 意译为“你使大地出产五谷”，或明确译作“你为世人预备五谷”。
  rationale: 原文后缀为阳性复数，不能直接回指阴性单数的“地”。它很可能指享用土地出产的人，但原文并未明确说“世人”；保留“他们”可维持这一语法区别与适度的指代开放性。
- issue: “神的河流”的意象
  choice: 保留“神的河流”这一诗性表达。
  alternative: 译作“神的溪流”“神的水道”，或解释为天上降雨的源头。
  rationale: 原文可唤起神所掌管、带来雨水与丰饶的水源意象，但没有明言其具体形态。直译并加脚注可避免将诗歌意象限定为某一种宇宙观解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“眷顾”“浇灌”“肥沃”“五谷”属于普通读者熟悉的书面词汇；句式保留希伯来诗歌中连续陈述上帝作为的节奏，并以分号呈现意象推进。
