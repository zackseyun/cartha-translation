- from: 你浇透地上的犁沟，压平田垄；你用甘霖使泥土松软，赐福地里的生长。
  to: 你浇透它的犁沟，使它的田垄平伏；你用阵雨使它软化，赐福它的生长。
  rationale: 修订恢复原文围绕同一片土地的代词连贯性，将土垄的动作译为较不强化的“平伏”，并以“阵雨”直译雨水意象。末句保留“生长”的宽泛性，不限定为幼苗、作物或收成。
