  text: תְּלָמֶ֣י/הָ רַ֭וֵּה נַחֵ֣ת גְּדוּדֶ֑י/הָ בִּ/רְבִיבִ֥ים תְּ֝מֹגְגֶ֗/נָּה צִמְחָ֥/הּ תְּבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/010.yaml
  text: Saturate its furrows; settle its ridges. With showers you soften it; you bless its growth.
translation:
  language: zh_hans
  text: 你浇透它的犁沟，使它的田垄平伏；你用阵雨使它软化，赐福它的生长。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּלָמֶיהָ
  choice: 地上的犁沟
  rationale: תלם指耕作形成的沟垄，此处与后面的“田垄”相对；以“犁沟”准确表达农耕图景，并用“地上的”自然承接上文所说的土地。
- source_word: נַחֵת גְּדוּדֶיהָ
  choice: 压平田垄
  rationale: נחת在此有使之降低、沉降之意；גדודיה在农耕语境中指地面隆起的土垄。“压平”保留使其降低的动作，比单纯“平整”更贴近原文。
- source_word: בִּרְבִיבִים
  choice: 用甘霖
  rationale: רְבִיבִים指充沛的阵雨或雨水；“甘霖”简洁、庄重，也符合雨水滋养土地的语境。
- source_word: תְּמֹגְגֶנָּה
  choice: 使泥土松软
  rationale: מוג的使役形式可指使之消融、软化；在雨水润土的语境中，“使泥土松软”是自然且具体的中文表达。
- source_word: צִמְחָהּ
  choice: 地里的生长
  rationale: צֶמַח可指萌发、生长之物或出产。“生长”保留过程与结果之间的宽度，不把它限定为幼苗或收成。
theological_decisions: []
