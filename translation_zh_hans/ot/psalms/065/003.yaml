base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/003.yaml
  text: Words of iniquity have prevailed against me[b][a]; our transgressions—you will atone for them.
translation:
  language: zh_hans
  text: 罪孽的事压倒了我[a]；我们的过犯——你必为它们施行赎罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“罪孽胜过了我。”原文开头的短语十分凝练，也可理解为“关于罪孽的事压倒了我”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你必赦免它们”“你必遮盖它们”或“你必除净它们”。这里的希伯来语动词指为罪施行赎罪，其具体侧重需由语境判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי עֲוֺנֹת
  choice: 罪孽之事
  rationale: דִּבְרֵי 是 דָּבָר 的复数附属形，与“罪孽”构成一个凝练短语。“罪孽之事”保留原文的表达形式及其含混性，不将其直接简化为“罪孽”或解释为“罪状”。
- source_word: גָּבְרוּ מֶנִּי
  choice: 压倒了我
  rationale: גבר 表示强盛、占上风；与带第一人称单数后缀的 מן 连用，表达胜过说话者。“压倒了我”在现代汉语中自然，也保留罪孽如强敌般占优势的意象。
- source_word: פְּשָׁעֵינוּ
  choice: 我们的过犯
  rationale: פֶּשַׁע 可指越界、悖逆或冒犯。“过犯”保留其道德与关系层面的分量，同时不把所有语义都收窄为公开的叛逆。
- source_word: אַתָּה
  choice: 你
  rationale: 原文显式使用第二人称代词，带有强调意味；译文以破折号和“你”共同体现这一转折与强调。
- source_word: תְכַפְּרֵם
  choice: 必为之赎罪
  rationale: כפר 的 Piel 形式在此以复数阳性宾语后缀指向“我们的过犯”，表示为罪施行赎罪、使罪得以除去。“为之赎罪”保留该词的祭祀与神学分量，而不把它仅仅处理成“遮掩”。
theological_decisions:
- issue: כפר 用于过犯时应如何表达
  choice: 你必为之赎罪
  alternative: 你必赦免它们／你必遮盖它们／你必除净它们
  rationale: “赎罪”保留 כפר 在罪与祭祀语境中的核心分量，却不进一步规定赎罪的具体机制。“赦免”较自然，但会淡化原词的赎罪色彩；“遮盖”可能被误解为仅仅隐藏罪；“除净”则更强调结果。
- issue: “我”与“我们”的人称转换
  choice: 保留“我”与“我们的”
  alternative: 统一译成“我们”
  rationale: 马所拉文本先用第一人称单数 מֶנִּי，随后转为第一人称复数 פְּשָׁעֵינוּ。译文保留这一真实张力，不按上下文擅自统一人称。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“罪孽之事”有意保留希伯来语开头的凝练与些许陌生感；破折号体现原文显式代词“你”的强调。正文保留单数“我”转为复数“我们的”的人称变化。
