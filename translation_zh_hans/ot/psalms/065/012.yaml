  yaml_path: translation/ot/psalms/065/012.yaml
  text: The pastures of the wilderness drip[b][a], and the hills gird themselves with rejoicing.
translation:
  language: zh_hans
  text: 旷野的草场滴着水珠[a]，山冈以欢欣束腰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“旷野的草场流溢。”希伯来语动词可描写水分滴落、滴沥，也可表示丰沛地倾注。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“山冈披上欢欣。”原文直译为“以欢欣束腰”。
    reason: metaphor_clarification
lexical_decisions:
- source_word: יִרְעֲפוּ
  choice: 滴淌着丰泽
  rationale: רָעַף描绘水分滴落、滴流，也可带有丰沛倾注之意。译作“滴淌着丰泽”保留诗中的水润意象，并以“丰泽”补足现代汉语表达所需的宾语，但不把景象限定为暴雨或洪流。
- source_word: נְאוֹת
  choice: 草场
  rationale: נָוֶה在此指可供放牧的草地；“草场”比“居所”更符合本节大地蒙润泽的景象。
- source_word: מִדְבָּר
  choice: 旷野
  rationale: מִדְבָּר可指荒野、草原或未开垦地，并不一定是寸草不生的沙漠；“旷野”保留这一较宽的范围。
- source_word: גִיל
  choice: 欢欣
  rationale: גִיל表示洋溢、欢腾的喜乐；“欢欣”既自然庄重，也适合群山拟人化的诗句。
- source_word: גְּבָעוֹת
  choice: 群山
  rationale: 该词直指复数的山冈、小山；“群山”在现代汉语诗歌中简洁自然，未将其缩减为山坡。
- source_word: תַּחְגֹּרְנָה
  choice: 束腰
  rationale: חָגַר本义是束上腰带、佩带在腰间。译作“束腰”保留原文拟人化的具体比喻，而不直接释义成一般的“充满”。
