  text: stilling the roar of the seas[a], the roar of their waves[b], and the tumult of the peoples.
translation:
  language: zh_hans
  text: 他平息诸海的轰鸣[a]、它们波浪的轰鸣，和众民的喧嚷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平息”也可译作“使安静”或“制伏”。
    reason: lexical_alternative
  - marker: b
    text: “喧嚷”也可译作“骚动”；原词在某些语境中也可表示“众多的人群”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּיחַ
  choice: 平息
  rationale: 这是使役分词，在本语境中表示使喧声止息。“平息”自然凝练，既可用于海浪，也可用于人群的骚动，并保留对上文所述上帝作为的连续描写。
- source_word: שְׁאוֹן
  choice: 轰鸣
  rationale: 该词表示巨大的声响或喧腾；用于海和海浪时，“轰鸣”能传达听觉意象。两处采用同一译词，以保留希伯来文的重复。
- source_word: יַמִּים
  choice: 诸海
  rationale: 原文为复数。“诸海”既反映复数形式，也符合诗歌语体。
- source_word: גַּלֵּיהֶם
  choice: 海浪
  rationale: 原文直译为“它们的浪”，其中复数代词回指“诸海”。汉语用“海浪”较自然，也不改变所指。
- source_word: הֲמוֹן
  choice: 喧嚷
  rationale: 该词可指嘈杂的骚动，也可指众多的人群。这里与海和海浪的轰鸣平行，“喧嚷”最能体现声音与动荡的双重色彩。
- source_word: לְאֻמִּים
  choice: 众民
  rationale: 该词可指各族人民或列国。“众民”保留群体性，同时避免把诗句过度限定为现代民族国家之间的政治冲突。
theological_decisions:
- issue: 自然界的混乱与人类群体骚动之间的平行关系
  choice: 把上帝描写为既平息诸海和海浪的轰鸣，也平息众民的喧嚷。
  alternative: 仅理解为对自然现象的描述，或强化为上帝征服列国的政治宣告。
  rationale: 希伯来诗歌的平行结构把海的轰鸣与众民的喧嚷并列。译文保留两者之间的张力和广度，不额外引入经文本身未明说的政治或末世论框架。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“诸海”保留原文复数及诗意；“轰鸣”重复两次，以再现希伯来文的声音效果；末句用“众民”维持自然混乱与人间骚动的平行。
