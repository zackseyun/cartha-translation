id: PSA.65.4
reference: Psalms 65:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַשְׁרֵ֤י תִּֽבְחַ֣ר וּ/תְקָרֵב֮ יִשְׁכֹּ֪ן חֲצֵ֫רֶ֥י/ךָ נִ֭שְׂבְּעָה בְּ/ט֣וּב בֵּיתֶ֑/ךָ קְ֝דֹ֗שׁ הֵיכָלֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/004.yaml
  text: Blessed is the one you choose and bring near to dwell in your courts[a]; we will be satisfied with the goodness of your house[b], the holiness of your temple.
translation:
  language: zh_hans
  text: '你所拣选、使他得以亲近你，住在你院中的人有福了！[a]


    我们必因你殿中的美善、你圣殿的圣洁而饱足。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你所拣选、使他得以亲近你，好住在你院中的人，多么有福！”
    reason: 原文“住”为第三人称未完成式；在此可表达拣选和使人亲近的目的或结果。“有福”带有感叹语气。
  - marker: b
    text: “美善”也可译作“福分”“美物”或“丰盛供应”。末句直译可作“你圣殿的圣洁”；原文句法简约。
    reason: טוּב语义可指美善本身或所赐的美好事物；קְדֹשׁ与“你的殿”的关系存在压缩性，故保留较宽的表达。
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是诗篇中常见的祝福宣告。译作“有福了”自然庄重，也比单纯表达心理感受的“快乐”更贴合原文。
- source_word: תִּבְחַר
  choice: 你所拣选
  rationale: 保留上帝主动选择的明确含义，同时不采用可能带入后期教义体系的专门术语。
- source_word: וּתְקָרֵב
  choice: 使他亲近
  rationale: 原文为使役形，表示上帝使这人得以靠近；“使他亲近”保留了这一使役意义。
- source_word: יִשְׁכֹּן
  choice: 住在
  rationale: 原文是第三人称阳性单数未完成式，可理解为拣选并使之亲近的结果或目的；正文用“住在”顺接前文，脚注保留目的式表达。
- source_word: חֲצֵרֶיךָ
  choice: 你院中
  rationale: 在圣殿语境中指圣所的院宇。中文“院中”简洁自然，并保留具体的敬拜场所意象。
- source_word: נִשְׂבְּעָה
  choice: 我们必……饱足
  rationale: 该形式带有意愿或确信的色彩；“必……饱足”表达诗人群体满有把握的期待。
- source_word: בְּטוּב
  choice: 因……美福
  rationale: טוּב兼有美善、福分和丰盛供应之意。“美福”在此兼顾其性质与所赐福惠，脚注列出更具体的可能译法。
- source_word: בֵּיתֶךָ
  choice: 你殿中
  rationale: 与后面的“殿宇”平行，所指是上帝的圣所；中文用“殿”比直译“房屋”更符合语境。
- source_word: קְדֹשׁ
  choice: 圣洁的
  rationale: 原文可作名词或修饰性表达，与“你的殿宇”构成同位或限定关系；译作“圣洁的”在中文中清楚自然，又不改变其神圣属性。
- source_word: הֵיכָלֶךָ
  choice: 你的殿宇
  rationale: הֵיכָל可指宫殿或圣殿；本节与院宇、上帝的殿并列，明确属于圣所语境，故译为“殿宇”。
theological_decisions:
- issue: 上帝拣选并使人亲近
  choice: 直接保留“你所拣选、使他亲近”的表述
  alternative: 将其明确解释为某种预定论，或仅解释为礼仪职分的选任
  rationale: 原文明确把亲近上帝的主动权归于上帝，却没有在本节限定这种拣选的系统教义范围；译文保留其张力，不作宗派化阐释。
- issue: 圣殿中的亲近与供应
  choice: 具体译出“院”“殿”“殿宇”
  alternative: 统一抽象化为“你的同在”或“你的居所”
  rationale: 原文扎根于以色列圣所敬拜的具体场景。保留空间和礼仪意象，可让其神学意义由经文本身自然呈现。
- issue: קְדֹשׁ与הֵיכָלֶךָ的句法关系
  choice: 译为同位解释“就是你圣洁的殿宇”
  alternative: 译作并列宾语“以及你殿的圣洁”，或译作“你殿中的圣物”
  rationale: 希伯来语短语简约，句法存在一定压缩。“就是”表达“你的殿”与“你圣洁的殿宇”的同位关系，同时不把“圣洁”过度实体化。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。用“拣选”保留经文语感，但避免术语化解释；以“殿、院、殿宇”维持圣所意象。分行呈现希伯来诗歌的推进：个人蒙福，继而群体饱足，末行以同位语强调圣殿的圣洁。
