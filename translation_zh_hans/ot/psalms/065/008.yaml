source:
  edition: WLC
  text: וַ/יִּ֤ירְא֨וּ יֹשְׁבֵ֣י קְ֭צָוֺת מֵ/אוֹתֹתֶ֑י/ךָ מ֤וֹצָֽאֵי בֹ֖קֶר וָ/עֶ֣רֶב תַּרְנִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/008.yaml
  text: Those who dwell at the ends of the earth fear because of your signs[b][a]; you make the dawn and the evening shout for joy.
translation:
  language: zh_hans
  text: 地极的居民因你的神迹而敬畏[a]；你使晨昏的出入之处欢呼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“惧怕”。原文动词可表示恐惧、畏惧或崇敬。
    reason: lexical_alternative
  - marker: b
    text: 直译：“早晨和晚上的出入之处。”这句诗可指黎明与黄昏，也可指晨昏出现的地方或时刻。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: 敬畏
  rationale: 希伯来语 ירא 可表达惧怕、畏惧或敬畏。此处“敬畏”在现代汉语中仍可兼含畏惧与崇敬，不将语义限定为恐惧或礼拜性的崇敬。
- source_word: יֹשְׁבֵי קְצָוֺת
  choice: 地极的居民
  rationale: 该短语直指居住在极远之处的人；“地极的居民”自然、凝练，并保留诗歌的普世视野。
- source_word: מֵאוֹתֹתֶיךָ
  choice: 因你的神迹
  rationale: 介词 מִן 接在表示惧怕的动词之后可表示原因，故译“因”。אוֹתֹתֶיךָ 直译为“你的记号/神迹”；在上帝大能作为的语境中，“神迹”比现代汉语的“记号”更自然，同时保留其作为彰显上帝能力之标志的意义。
- source_word: מוֹצָאֵי בֹקֶר וָעֶרֶב
  choice: 早晨和晚上出现之处
  rationale: מוֹצָאֵי 字面为“出发处、出现处”。译文保留这一不寻常的空间意象，不把它仅仅化约为“黎明和黄昏”；上下文仍可让人理解为晨昏出现的所在或时刻。
- source_word: תַּרְנִין
  choice: 你使……欢呼
  rationale: 使役形表达“使之发出喜乐的呼声”。“使……欢呼”既保留上帝为施事者，也传达拟人化的喜乐呼喊。
theological_decisions:
- issue: 人对上帝神迹的反应性质
  choice: 译为“敬畏”，不明确限定为恐惧或崇敬
  alternative: “惧怕”或“肃然起敬”
  rationale: 原文动词可涵盖畏惧、惧怕和崇敬；“敬畏”较能保留这种张力，避免将反应解释成纯粹的惊恐或单纯的礼拜情感。
- issue: 晨昏意象的所指
  choice: 保留“出现之处”的诗性表达
  alternative: 直接译为“黎明和黄昏”
  rationale: 原文复数构造 מוֹצָאֵי 可指晨昏的出现、出口、边界或所在。保留空间与时间之间的含混，避免过早确定为单纯时刻。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“地极的居民”保留诗篇的宏阔语域；“敬畏”保留原文语义张力；“出现之处”有意保存希伯来诗句中晨昏兼具空间与时间色彩的意象。
