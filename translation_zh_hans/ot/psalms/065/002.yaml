  yaml_path: translation/ot/psalms/065/002.yaml
  text: O you who hear prayer[a], to you all flesh will come.
translation:
  language: zh_hans
  text: 听祷告的主啊，所有人都要到你这里来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“所有肉身”或“所有血肉”；这是诗性说法，泛指全体人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵעַ
  choice: 垂听……的主
  rationale: 该词是动词“听”的主动分词，在此实词化并作呼语，所指为上帝。“垂听”符合现代汉语祷告语境，也体现不只是听见，更是留意、应允祈求；补出“主”使呼语自然，但不另加专名。
- source_word: תְּפִלָּה
  choice: 祷告
  rationale: 单数名词在这里具有类称或集合意义，指祷告这一整体，而非某一次特定祷告。
- source_word: עָדֶיךָ
  choice: 到你这里
  rationale: 介词עַד带第二人称阳性单数词尾，与移动动词连用，表示趋向受话者；“到你这里”自然保留了朝向并抵达的意味。
- source_word: כָּל־בָּשָׂר
  choice: 凡有血肉的
  rationale: 直译性地保留“所有肉身/血肉”的诗性表达，同时以“凡……的”使现代汉语可懂；在本节语境中泛指全体人类。
- source_word: יָבֹאוּ
  choice: 都要……来
  rationale: Qal未完成式第三人称阳性复数，可表达将来或尚未完成的行动；“都要……来”保留前瞻语气，并与“凡”呼应。
theological_decisions:
- issue: כָּל־בָּשָׂר的范围
  choice: 以“凡有血肉的”保留普遍指向与原文意象
  alternative: 所有人／全人类
  rationale: 此语在这里广泛指人类来到上帝面前。正文保留“血肉”这一诗性和神学张力，脚注说明其通常所指，避免把意象完全解释掉。
- issue: שֹׁמֵעַ是否暗含应允
  choice: 译作“垂听”，不明说每项祈求均按祈求者所愿实现
  alternative: 听祷告的／应允祷告的
  rationale: “垂听”能表达上帝留意祷告，又不像“应允”那样把回应方式明确化，因而较好地保存原词的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“垂听祷告的主啊”形成自然呼语；“凡有血肉的”有意保留希伯来诗歌意象。脚注标记置于整句末，所释对象在正文中明确可辨。
