- from: 上帝啊，在锡安，沉默就是献给你的赞美[a]；向你所许的愿必得偿还。
  to: 上帝啊，在锡安，沉默是献给你的赞美[a]；所许的愿必要向你偿还。
  rationale: 修订仅处理后半句的汉语施受关系，使“偿还”由隐含的许愿者施行，并调整脚注以完整呈现一种可行替代读法中的“静默”。首句保留原译对省略结构和诗性悖论的谨慎处理。
