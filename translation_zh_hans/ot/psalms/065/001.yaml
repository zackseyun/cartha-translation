    issue: “向你所许的愿必得偿还”主谓搭配不当。
    rationale: “偿还”通常由人偿还债务、恩情或所许的愿；“愿”本身说“得偿还”不自然，也模糊了希伯来文所指向上帝履行所许之愿的含义。
  - severity: low
