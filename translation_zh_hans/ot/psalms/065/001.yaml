  text: לְ/ךָ֤ דֻֽמִיָּ֬ה תְהִלָּ֓ה אֱלֹ֘הִ֥ים בְּ/צִיּ֑וֹן וּ֝/לְ/ךָ֗ יְשֻׁלַּם נֶֽדֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/001.yaml
  text: To you[a], silence is praise, O God, in Zion, and to you a vow will be paid.
translation:
  language: zh_hans
  text: 上帝啊，在锡安，沉默是献给你的赞美[a]；所许的愿必要向你偿还。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝啊，在锡安，赞美在静默中等候你”；又或：“上帝啊，在锡安，静默的赞美属于你。”希伯来原文的表达有所省略，可以有不止一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: דֻמִיָּה
  choice: 沉默
  rationale: 该名词通常指沉默、静默；此处直译可保留希伯来诗句突出的悖论意味，避免把它预先解释为“静候”或“安静信靠”。
- source_word: תְהִלָּה
  choice: 赞美
  rationale: 采用该词常见而直接的含义；在无显式动词的结构中，与“沉默”并置。
- source_word: לְךָ דֻמִיָּה תְהִלָּה
  choice: 沉默就是献给你的赞美
  rationale: 原文结构省略而含混。此译保留两个名词及其诗性张力，并以“献给”自然表达 לְךָ 的方向关系，而不加入原文没有的“等候”等动词。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 这里指以色列所敬拜的独一上帝，按单数意义翻译；“上帝”符合现代标准汉语的庄重经文语体。
- source_word: בְּצִיּוֹן
  choice: 在锡安
  rationale: 保留介词的地点意义，译法自然直接。
- source_word: יְשֻׁלַּם
  choice: 必得偿还
  rationale: 该动词的 Pual 形表示所许之愿将被偿付或履行；“偿还”保留把承诺归还、兑现给上帝的具体意味。
- source_word: נֶדֶר
  choice: 所许的愿
  rationale: 该名词指向上帝所立的誓愿；结合“偿还”译作“所许的愿”，在现代汉语中清楚自然。
theological_decisions:
- issue: 省略结构 לְךָ דֻמִיָּה תְהִלָּה 的解释
  choice: 把沉默本身呈现为献给上帝的赞美。
  alternative: 也可理解为“上帝啊，在锡安，赞美静候着你”，或“上帝啊，在锡安，静默的赞美属于你”。
  rationale: 希伯来文没有显式动词，容许不止一种句法理解。正文保留“沉默”与“赞美”之间的诗性张力，脚注则保存其他真实可行的读法，不将含混静默地消解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“沉默就是献给你的赞美”有意保留原文凝练且出人意料的表达；分号呈现两个平行的“向你”分句。
