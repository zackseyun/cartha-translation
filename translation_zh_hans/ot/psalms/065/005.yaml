  text: נ֤וֹרָא֨וֹת בְּ/צֶ֣דֶק תַּ֭עֲנֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ מִבְטָ֥ח כָּל קַצְוֵי אֶ֝֗רֶץ וְ/יָ֣ם רְחֹקִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/005.yaml
  text: With awesome deeds in righteousness you answer us[a], O God of our salvation[b], the confidence of all the ends of the earth and of the distant sea.
translation:
  language: zh_hans
  text: 你以可畏的作为，按公义应允我们[a]；拯救我们的上帝啊，你是全地极和远海所倚靠的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按公义”也可译作“按公正”。
    reason: lexical_alternative
  - marker: b
    text: “远海”原文为单数“海”，但在这里可能具有集合意义；也可译作“遥远的海”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֤וֹרָא֨וֹת
  choice: 可畏的作为
  rationale: 该词指令人敬畏、甚至生出畏惧的事；结合上帝施行拯救的语境，以“可畏的作为”既保留敬畏色彩，也自然补出希伯来文省略的“作为”。
- source_word: בְּצֶ֣דֶק
  choice: 按公义
  rationale: 介词בְּ在这里表示方式；“按公义”表明上帝的应允符合其公义，同时保留צֶדֶק兼具正直与公正的语义范围。
- source_word: תַּ֭עֲנֵנוּ
  choice: 应允我们
  rationale: ענה在祷告语境中意为回答、回应；后缀明确是第一人称复数。“应允我们”符合现代汉语祷告文体。
- source_word: אֱלֹהֵ֣י יִשְׁעֵ֑נוּ
  choice: 拯救我们的上帝啊
  rationale: 将构造短语自然表达为上帝是施行我们拯救的那一位；“啊”标明直接呼语，并避免较生硬的“我们救恩的上帝”。
- source_word: מִבְטָ֥ח
  choice: 倚靠
  rationale: 该名词指受信赖的对象或信心所系之处；“倚靠”在此可自然指人所信赖的对象，又不误收窄为具体的避难所。
- source_word: כָּל קַצְוֵי אֶ֝֗רֶץ
  choice: 地极之人
  rationale: “地极”是准确而自然的传统表达；依上下文补出“之人”，说明倚靠上帝的是遥远地区的居民，而非地理地点本身。
- source_word: וְיָ֣ם רְחֹקִֽים
  choice: 遥远海域之人
  rationale: יָם为单数，但可集合性地指海域；复数形容词רְחֹקִים支持理解为遥远的海上区域。补出“之人”与“地极之人”平行，表达海岛或远洋地区的居民，同时保留数上的歧义于脚注。
theological_decisions:
- issue: צֶדֶק在诗篇语境中的表达
  choice: 公义
  alternative: 公正
  rationale: 此处既可强调上帝行事的正直与信实，也可突出其公正审断；正文用涵盖面较广的“公义”，脚注保留“公正”的可能。
- issue: מִבְטָח所表达的关系
  choice: 倚靠
  alternative: 信赖／避难所
  rationale: 经文称上帝为远方众民所信靠的对象。“倚靠”不预设他们是否已有自觉的信仰，也不将词义具体化为物理避难所。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可畏”保留神圣作为令人敬畏的力度；句中补出两个“之人”，使“倚靠”的主体在汉语中清楚，并以脚注保留“海”的单数及集合性歧义。
