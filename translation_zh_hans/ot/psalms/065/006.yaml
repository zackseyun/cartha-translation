source:
  edition: WLC
  text: מֵכִ֣ין הָרִ֣ים בְּ/כֹח֑/וֹ נֶ֝אְזָ֗ר בִּ/גְבוּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/006.yaml
  text: who establishes the mountains by his power[a], being girded with might.
translation:
  language: zh_hans
  text: 他以能力使群山坚立[a]，以大能束腰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他以力量使群山坚立，以威能束腰。”
    reason: 词义可选译法：כֹּחַ和גְּבוּרָה都可表示力量、能力或威能。
lexical_decisions:
- source_word: מֵכִין
  choice: 使……坚立
  rationale: 使役分词在这里表示使群山稳固、确立；“使……坚立”既保留使役意义和稳固意象，也不额外限定为从无创造。
- source_word: הָרִים
  choice: 群山
  rationale: 该词明确指山岳；“群山”在现代汉语诗歌语体中自然地表达带定指意味的山岳整体。
- source_word: בְּכֹחוֹ
  choice: 以能力
  rationale: כֹּחַ可指能力、力量；介词ב在此表凭借或手段，译作“以能力”简洁自然。
- source_word: נֶאְזָר
  choice: 束腰
  rationale: אזר的被动分词描绘束带于腰、装备妥当的形象。汉语“束腰”保留原文的身体隐喻；与主语连用时可自然表达“腰间束有”的状态。
- source_word: בִּגְבוּרָה
  choice: 以大能
  rationale: גְּבוּרָה表示强大的力量、威能；“大能”与“束腰”的装备意象相配，也与前面的“能力”形成适度词汇区分。
theological_decisions:
- issue: 两个分词之间的关系
  choice: 将前一分词译为特征性行动“使群山坚立”，后一分词译为状态性描写“以大能束腰”
  alternative: 译作两个并列定语：“使群山坚立的那一位，他以大能束腰”
  rationale: 希伯来文连续使用两个分词，描写上帝一贯的作为和状态。中文不必机械复制分词形式，但保留其描写性和诗行的紧密衔接。
- issue: 神圣力量的身体隐喻
  choice: 保留“束腰”的形象
  alternative: 解释为“以大能装备自己”或抽象化为“满有力量”
  rationale: 原文以束腰表达力量与预备妥当。保留这一隐喻可维持诗意，也避免把经文提前解释为某种特定教义命题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“群山坚立”传达山岳稳固的诗意；“束腰”保留古代装备妥当的具象隐喻，虽略具古典色彩，但普通读者仍可理解。
