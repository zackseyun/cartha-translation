lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题注中通常指负责音乐演奏或歌唱的人；前缀 לַ־ 译为“交给”，保留交付其使用或指导演唱的含义。“乐长”简洁、庄重，也符合题注语体。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇题注中的常用体裁名称；译作“诗”自然明确，并与后面的 שִׁיר“歌”相区别。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 在诗篇题注中可能表示作者、归属、关联或献给某人。“大卫的”在中文中保留一定开放性，避免直接断定为“大卫所作”。
- source_word: שִׁיר
  choice: 一首歌
  rationale: 该词与 מִזְמוֹר 并列，是另一体裁说明；单独译出可保留希伯来文题注的完整表达。
theological_decisions:
- issue: לְדָוִד 是否明确宣称大卫为作者
  choice: 译作“大卫的”，并以脚注说明其可能范围
  alternative: 大卫所作的
  rationale: 原文介词关系并不只容许作者身份，也可能表达归属、关联或献呈；不宜在正文中排除这些可能。
translation_notes:
  register: 采用简洁庄重的诗篇题注体。“交给乐长”沿用现代中文易懂的礼仪音乐用语；以分号连接“诗”和“歌”两项体裁说明，既保留二者，又避免把“一首歌”处理成突兀的独立句。
