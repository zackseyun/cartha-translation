  text: אָ֭כֵן כְּ/אָדָ֣ם תְּמוּת֑וּ/ן וּ/כְ/אַחַ֖ד הַ/שָּׂרִ֣ים תִּפֹּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/007.yaml
  text: Nevertheless[a], you will die like men[b], and fall like one of the princes.
translation:
  language: zh_hans
  text: 然而，你们必像人一样死去[a]，也必像众首领[b]中的一个那样倒下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像人一样”也可译作“像亚当一样”；这里的 אָדָם 既可泛指人，也可能指第一个人亚当。
    reason: alternative_reading
  - marker: b
    text: “首领”也可译作“统治者”或“掌权者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: 然而
  rationale: 此词在这里强调转折：尽管受话者此前被称为“神”和“至高者的儿子”，他们仍要面对死亡与倾覆。“然而”自然地表达这种强烈反差。
- source_word: כְּאָדָם
  choice: 像人一样
  rationale: אָדָם 在此最自然地泛指必死的人类，与前文受话者的崇高称号形成对照；希伯来语也可能被理解为专名“亚当”，故在脚注保留这一歧义。
- source_word: תְּמוּתוּן
  choice: 你们必……死去
  rationale: 这是 מות 的 Qal 未完成式第二人称阳性复数，在审判宣告中表达确定的将来结果；“必……死去”既清楚又庄重。
- source_word: וּכְאַחַד
  choice: 也……像……中的一个那样
  rationale: 忠实表达“像某一群体中的一个”的比较结构，并使现代汉语行文自然。
- source_word: הַשָּׂרִים
  choice: 众首领
  rationale: שׂרים 可指首领、统治者或高官；“首领”保留其高位掌权者的宽泛含义，又不限定为特定政体中的王子。
- source_word: תִּפֹּלוּ
  choice: 倒下
  rationale: 保留 נפל 的“坠落、倒下”意象；在本处既可指死亡，也可指在审判中败落，不把隐喻过度解释为单一含义。
theological_decisions:
- issue: כְּאָדָם 中 אָדָם 的理解
  choice: 正文按泛指的“人”处理
  alternative: 理解为专名“亚当”
  rationale: 上下文的主要对比是受话者虽有崇高称号，却仍与普通人一样必死；但原文形式确实也容许对亚当的暗指，因此以脚注保留，不在正文中消除这一张力。
- issue: “倒下”的具体所指
  choice: 保留审判性“倒下”的隐喻
  alternative: 明确译成“灭亡”或“被打倒”
  rationale: 原文只用 נפל，并未明说倒下究竟专指死亡、失势还是二者兼有；直译意象可保留其解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必”体现审判宣告的确定性；两个“像……一样”保留希伯来诗句的平行结构。“众首领中的一个”虽略带书面色彩，但准确呈现 כְּאַחַד הַשָּׂרִים 的群体成员比较关系。
