  text: לֹ֤א יָֽדְע֨וּ וְ/לֹ֥א יָבִ֗ינוּ בַּ/חֲשֵׁכָ֥ה יִתְהַלָּ֑כוּ יִ֝מּ֗וֹטוּ כָּל מ֥וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/005.yaml
  text: They do not know[a], and they do not understand; they walk about in darkness[b]; all the foundations of the earth are shaken.
translation:
  language: zh_hans
  text: 他们不知道，也不明白；他们在黑暗中走来走去；大地[a]的一切根基都动摇[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”或“地”。
    reason: alternative_reading
  - marker: b
    text: “动摇”也可译作“摇晃”或“摇摇欲坠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָדְעוּ
  choice: 他们不知道
  rationale: ידע的Qal形式通常表示“知道”。这里虽为完成式，但与下句并列，描述他们当前无知的状态，译作“不知道”最自然。
- source_word: וְלֹא יָבִינוּ
  choice: 也不明白
  rationale: בין的Hiphil形式可表示“明白、辨明”。“明白”既符合现代汉语，也保留了与“不知道”的诗歌平行。
- source_word: בַּחֲשֵׁכָה
  choice: 在黑暗中
  rationale: 介词与名词共同构成处所表达；“在黑暗中”保留原文意象，并可兼指认知和道德上的昏暗而不将其明说。
- source_word: יִתְהַלָּכוּ
  choice: 走来走去
  rationale: הלך的Hitpael形式可表达持续、反复的行动；“走来走去”比单纯“行走”更能体现这种动态，又不额外断定其目的。
- source_word: יִמּוֹטוּ
  choice: 都动摇
  rationale: מוט的Niphal形式表示被摇动、摇晃或站立不稳。“动摇”传达根基失稳的意象，但不明确断言已经完全崩塌。
- source_word: כָּל מוֹסְדֵי אָרֶץ
  choice: 大地的一切根基
  rationale: מוֹסְדֵי指“根基、基础”；אָרֶץ既可指“大地”，也可指某一“土地、国土”。本诗的宏观诗歌语境支持“大地”，同时以脚注保留较局部的理解。
theological_decisions:
- issue: אָרֶץ的范围及宇宙秩序动摇的意象
  choice: 译作“大地”，使经文指向整个世界秩序的失稳
  alternative: 译作“土地”或“这地”，理解为较局部的范围
  rationale: 诗篇82篇把掌权者的不义与受造秩序的稳定相连；“大地”保留这一广阔的诗意和神学张力，却不把比喻进一步解释为特定制度或末世事件。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不知道，也不明白”保留平行结构；“走来走去”呈现持续行动；分号维持原文三段式诗行推进。
