source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/001.yaml
  text: A psalm of Asaph[a]. God stands in the divine assembly; in the midst of the gods he judges.
translation:
  language: zh_hans
  text: 亚萨的诗。上帝站在神圣的会众中；他在众神中施行审判。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众神”也可译作“神灵”。有些人认为这里所指的是人间的审判官或统治者。
    reason: 保留第二个 אֱלֹהִים 的主要词义与所指对象上的不同理解。
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中的常用体裁词；中文传统而自然的表达“诗”准确简洁。
- source_word: לְאָסָף
  choice: 亚萨的
  rationale: 标题中的 לְ 可表示作者、归属或关联；“亚萨的”自然保留这种关系上的含混，不进一步断定作者身份。
- source_word: אֱלֹהִים（第一次）
  choice: 上帝
  rationale: 其后搭配单数分词 נִצָּב，并作为单数动词 יִשְׁפֹּט 的主语，指独一的上帝。
- source_word: נִצָּב
  choice: 站
  rationale: 分词描绘上帝处于审判者的位置；“站”既保留空间画面，也不过度解释为正式开庭。
- source_word: בַּעֲדַת אֵל
  choice: 在神圣的会众中
  rationale: עֵדָה 指聚集的群体，אֵל 在此使整个词组带有神圣或属神领域的意味。“神圣的会众”保留其天上议会的可能语境，同时避免把“议会”这一解释直接写死。
- source_word: בְּקֶרֶב
  choice: 在……中
  rationale: 表达身处一群成员当中；现代中文用“在……中”自然清楚。
- source_word: אֱלֹהִים（第二次）
  choice: 众神
  rationale: 此处在句法和语境中是复数群体，与前面的单数“上帝”有别。“众神”最直接保留原词的词汇力度，其他可能理解置于脚注。
- source_word: יִשְׁפֹּט
  choice: 施行审判
  rationale: 该动词在此具有司法语义；“施行审判”庄重自然，并延续会众中的审判场景。
theological_decisions:
- issue: 本节第二个 אֱלֹהִים 所指为何
  choice: 正文译作“众神”，保留它作为神圣／天上存在群体的直接读法
  alternative: “神灵”；也有人理解为人间的审判官或统治者
  rationale: 本节用单数语法标明第一处 אֱלֹהִים 是上帝，又把第二处描写为上帝置身其中并加以审判的复数群体。正文保留原文用词造成的张力，不以解释性译法消除歧义；脚注列出主要替代理解。
- issue: עֲדַת אֵל 的性质
  choice: 译作“神圣的会众”
  alternative: “上帝的会众”或“神圣议会”
  rationale: 该短语可能指属上帝的集会，也可能突出天上的议会场景。“神圣的会众”兼顾词义和语境，又不把归属关系或组织形式规定得过死。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“上帝”与“众神”形成原文刻意保留的单复数和身份对照；分号呈现两个彼此紧密相关的审判场景。脚注标记置于相关整句之后。
