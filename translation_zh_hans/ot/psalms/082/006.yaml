source:
  edition: WLC
  text: אֲֽנִי אָ֭מַרְתִּי אֱלֹהִ֣ים אַתֶּ֑ם וּ/בְנֵ֖י עֶלְי֣וֹן כֻּלְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/006.yaml
  text: I said, “You are gods, and all of you are sons of the Most High.”
translation:
  language: zh_hans
  text: 我曾说：“你们是神明，你们都是至高者的儿子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי אָמַרְתִּי
  choice: 我曾说
  rationale: 保留第一人称主语及完成体所表达的既已说出之意；“曾”使现代汉语更自然，但不额外限定具体时间。
- source_word: אֱלֹהִים
  choice: 神明
  rationale: 此处是复数谓语名词，称呼受话者；译作“神明”既保留其超越凡人的称号，也避免现代汉语“你们是神”可能被误听为众人共同构成独一的神。具体所指仍由诗篇语境判断。
- source_word: וּבְנֵי עֶלְיוֹן
  choice: 你们都是至高者的儿子
  rationale: וּ 译为承接性的并列关系；בְנֵי 保留亲属隐喻“儿子”，עֶלְיוֹן 译作传统且清楚的称号“至高者”。
- source_word: כֻּלְּכֶם
  choice: 你们都是
  rationale: 准确表达第二人称阳性复数“你们全都”，并按自然汉语语序置于系词前。
theological_decisions:
- issue: 受话者被称为 אֱלֹהִים 的身份
  choice: 直译其称号为“神明”，不在正文中判定受话者究竟是天上众灵还是人间审判官
  alternative: 译作“诸神”“有权势者”或“审判官”
  rationale: 原文本身保留身份张力；将其明确解释为某一类对象会超出本节词面证据。
- issue: “至高者的儿子”的性质
  choice: 保留“儿子”这一原文隐喻
  alternative: 意译为“至高者所生的”“至高者的众使者”或“至高者的子民”
  rationale: 原文未明说生育、职分或群体归属的具体方式，故不在翻译中加以神学化解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留诗句直接宣告的力度和两分句的平行结构；不用解释性脚注，以免替正文消解 אֱלֹהִים 的真实歧义。
