  text: שִׁפְטוּ דַ֥ל וְ/יָת֑וֹם עָנִ֖י וָ/רָ֣שׁ הַצְדִּֽיקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/003.yaml
  text: Defend the weak and the fatherless; vindicate the afflicted and the poor.
translation:
  language: zh_hans
  text: 要为弱小者和孤儿主持公道；要为困苦者和穷人伸张正义。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁפְטוּ
  choice: 主持公道
  rationale: 该命令在此不是单指审判案件，而是要求掌权者为弱势者施行公正；“主持公道”既保留司法含义，也符合现代汉语表达。
- source_word: דַל
  choice: 弱小者
  rationale: 此词可指卑微、贫弱或无力自保的人；译作“弱小者”与后文“穷人”有所区分，并突出其弱势处境。
- source_word: יָתוֹם
  choice: 孤儿
  rationale: 指失去父亲、缺乏家庭保护的人；现代汉语以“孤儿”自然概括这一社会弱势身份。
- source_word: עָנִי
  choice: 困苦者
  rationale: 兼有受压、受苦和贫困之意；“困苦者”保留其处境性，不与下一词完全重叠。
- source_word: רָשׁ
  choice: 穷人
  rationale: 指贫穷、匮乏的人；译作“穷人”直接清楚。
- source_word: הַצְדִּיקוּ
  choice: 伸张正义
  rationale: 使役式在司法语境中可指判为正、证明无辜或维护正当权益；此处与前半句平行，译作“伸张正义”保留为弱者作出公正裁断的含义，而不暗示使其在道德上变为义人。
theological_decisions:
- issue: הַצְדִּיקוּ 是否表达使人称义的教义性含义
  choice: 按司法与社会公义语境译为“为……伸张正义”
  alternative: 宣告……为义／使……称义
  rationale: 本节是在命令审判者公正维护困苦贫穷者；上下文支持司法性的申冤和裁断，不宜在中文中引入超出语境的系统神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；两句均用“要为……”，保留希伯来诗歌的平行结构和命令语气，同时区分“弱小者／困苦者／穷人”三个彼此相关但不完全相同的称谓。
