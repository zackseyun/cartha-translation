  text: קוּמָ֣/ה אֱ֭לֹהִים שָׁפְטָ֣/ה הָ/אָ֑רֶץ כִּֽי אַתָּ֥ה תִ֝נְחַ֗ל בְּ/כָל הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/008.yaml
  text: Rise up[a], O God; judge the earth[b], for you will inherit all the nations.
translation:
  language: zh_hans
  text: 上帝啊，起来吧[a]！审判全地，因为你必承受万国为业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝啊，兴起吧！”
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为你必拥有万国。”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: 起来吧
  rationale: 这是向上帝发出的命令式呼求，表达恳求他采取行动；“起来吧”自然、庄重，并保留原文的紧迫感。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 单数命令式和代词表明此处是直接称呼独一的上帝；“啊”体现呼语。
- source_word: שָׁפְטָה
  choice: 审判
  rationale: 保留 שׁפט 在此处兼具司法裁断与君王治理的含义，不将其窄化为单纯的管理或申冤。
- source_word: הָאָרֶץ
  choice: 全地
  rationale: 下半句提到“万国”，显示这里指普世范围；“全地”比局部性的“这地”更合适。
- source_word: כִּי
  choice: 因为
  rationale: 引出前面祈求的理由，现代汉语中清楚自然。
- source_word: אַתָּה
  choice: 你
  rationale: 原文显式使用第二人称单数代词，带有强调作用；汉语直译为“你”，并借句式承载其强调。
- source_word: תִנְחַל
  choice: 必承受……为业
  rationale: נחל 表示承受或取得产业；此译既符合汉语表达，也保留产业、继承和合法所有权的意涵。
- source_word: בְּכָל הַגּוֹיִם
  choice: 万国
  rationale: 与 נחל 连用时，介词短语在语义上表示所承受产业的范围或对象；“万国”简洁地保留其普世、复数集合意义。
theological_decisions:
- issue: תִנְחַל בְּכָל הַגּוֹיִם 所表达的上帝与万国的关系
  choice: 因为你必承受万国为业
  alternative: 因为你必拥有万国
  rationale: 上帝审判全地的祈求，以他对万国的普遍权利为依据。“承受……为业”保留 נחל 的产业意象和君王权利色彩；脚注同时提供较直接的所有权表达，避免把原文限定为某一种神学体系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“起来吧”避免生硬古雅；“审判全地”保留诗篇中的法庭与王权语义；“承受万国为业”略带经文语感，但在现代汉语中仍清楚，并忠实传达原文 נחל 的产业意象。
