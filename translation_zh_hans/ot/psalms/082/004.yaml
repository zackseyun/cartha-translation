  yaml_path: translation/ot/psalms/082/004.yaml
  text: Rescue the poor and needy[a]; deliver them from the hand of the wicked.
translation:
  language: zh_hans
  text: 要援救贫弱者[a]和穷乏者；要从恶人手中救出他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贫弱者”也可译作“弱小者”或“贫穷的人”。希伯来语 דַּל 可指贫穷、弱小或无权无势的人，既强调困乏，也强调容易受欺压。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְּטוּ
  choice: 要救助
  rationale: 这是复数命令式，要求采取行动使人脱离危险。“救助”自然表达积极介入，也适合本节伸张公义的语境。
- source_word: דַל
  choice: 贫弱的人
  rationale: דַל可指贫穷、弱小或社会地位低下的人。“贫弱”兼顾经济困乏与无力自保的含义，并避免与后面的“穷乏”完全重合。
- source_word: אֶבְיוֹן
  choice: 穷乏的人
  rationale: 该词常指缺少生活所需、陷于贫困的人。“穷乏”保留其匮乏之意，与“贫弱”构成自然的并列。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 保留希伯来语以“手”表示权势、控制或掌握的意象；现代汉语中也清楚可懂。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 指在道德上有罪、欺压他人的人。“恶人”简洁有力，且不额外添加原文未明说的性别信息。
- source_word: הַצִּילוּ
  choice: 要救
  rationale: 这是另一复数命令式，强调从敌对势力和危险中解救。与前面的“救助”相呼应，同时保留两个平行命令。
theological_decisions:
- issue: 是否保留两个平行的命令式
  choice: 译作“要救助……；要救……”两个并列命令
  alternative: 合并为“要救贫弱和穷乏的人脱离恶人的手”
  rationale: 原文使用两个命令式，形成诗歌平行并加强道德上的迫切要求；分别翻译可保留这种力度。
- issue: דַל所表达的脆弱性质
  choice: 译作“贫弱的人”
  alternative: 译作“贫穷的人”或“弱小的人”
  rationale: 原词可兼指贫穷、弱小和社会上无权无势；“贫弱”保留这种语义张力，不把它单独限定为经济贫困或身体软弱。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恶人的手”保留原文意象；两个“要……”使复数命令的迫切语气和诗歌平行清楚可见。
