lexical_decisions:
- source_word: עַד מָתַי
  choice: 要到几时呢
  rationale: 这是带责问意味的时间疑问语；“要到几时呢”在现代汉语中自然地表达持续状态和抗议语气。
- source_word: תִּשְׁפְּטוּ עָוֶל
  choice: 不公正地审判
  rationale: עָוֶל虽为名词，在此修饰审判行为；译作“不公正地”既自然，也保留司法语境。
- source_word: וּפְנֵי רְשָׁעִים תִּשְׂאוּ
  choice: 偏袒恶人
  rationale: 字面为“抬起恶人的脸”，是表示优待、徇私的习语；在审判语境中，“偏袒”最准确简洁。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 保留该词对道德上作恶、应受谴责之人的概括性称呼，不将其限缩为某种特定法律身份。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词的确切含义和礼仪功能不确定，因此采用传统音译，避免把“停顿”等解释写入正文。
theological_decisions:
- issue: 对恶人的司法偏袒
  choice: 偏袒恶人
  alternative: 优待恶人；抬起恶人的脸
  rationale: 此处谴责审判中的徇私。“偏袒”清楚保留司法与伦理力度，又不额外引入教派性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“要到几时呢”保留责问力度；“细拉”用括号与诗句主体稍作区隔，并以脚注说明司法习语。
