  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/000.yaml
  text: A psalm of Asaph[a]. God stands in the assembly of God; in the midst of the gods he judges.
translation:
  language: zh_hans
  text: 亚萨的诗。上帝站在神的会众中；他在众神[a]当中施行审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神圣的存在者”。有人认为这里的“众神”是指人间的审判官或统治者。
    reason: 原词 אֱלֹהִים 在此可有不同理解；正文保留其复数表达，脚注列出主要解释。
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: 亚萨的诗
  rationale: 按希伯来诗篇标题的常见表达翻译；לְ 可表示归属、作者关系或关联，简洁译法保留这种宽泛关系。
- source_word: אֱלֹהִים נִצָּב
  choice: 上帝站在
  rationale: 此处 אֱלֹהִים 与单数分词 נִצָּב 搭配，指上帝；译为“上帝”并保留“站立”的法庭场景。
- source_word: בַּעֲדַת אֵל
  choice: 在神的会中
  rationale: עֲדָה 可指集会或议会；“神的会”既贴近原文，又不预先断定其成员是天上存在还是人间领袖。
- source_word: בְּקֶרֶב אֱלֹהִים
  choice: 在众神当中
  rationale: 这里 אֱלֹהִים 处于复数语境，直译为“众神”，同时以脚注说明可能所指，保留原文的歧义和张力。
- source_word: יִשְׁפֹּט
  choice: 施行审判
  rationale: 该动词可表示审判或治理；本句的法庭意象支持“施行审判”，主语承接前面的上帝。
theological_decisions:
- issue: 第二个 אֱלֹהִים 的身份
  choice: 正文译为“众神”，脚注列出“神圣众灵”及“人间审判官或统治者”等理解
  alternative: 直接译为“审判官”、“统治者”或“天上的众灵”
  rationale: 原文没有明确消除这些解释之间的张力；正文采用形式透明的译法，避免把某一种神学解释写入经文。
- issue: בַּעֲדַת אֵל 的性质
  choice: 译为“神的会”
  alternative: 译为“上帝的会众”或“天上的议会”
  rationale: “神的会”保留原文简洁结构，也避免预先界定这是以色列会众、司法会议还是天上议会。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上帝”与“神”分别反映本句中 אֱלֹהִים 和 אֵל 的语境功能；分号保留两个平行分句的结构。
