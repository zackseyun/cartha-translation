base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/007.yaml
  text: 'God has spoken in his holiness: “I will exult[b][a]; I will divide up Shechem and measure out the Valley of Succoth.”'
translation:
  language: zh_hans
  text: '上帝已经在他的圣洁中宣告[a]：


    “我要欢欣[b]；我要分配示剑，丈量疏割谷。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝已经从他的圣所宣告”，也可译“上帝已经凭自己的圣洁宣告”。希伯来语短语可指上帝的圣洁，也可指与他有关的圣所。
    reason: lexical_alternative
  - marker: b
    text: 或译“我要喜乐”。原文动词表达欢腾雀跃之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 单数动词表明此处指以色列的上帝；“上帝”是现代汉语中自然、庄重的单数称谓。
- source_word: דִּבֶּר
  choice: 曾……说
  rationale: 完成式陈述已经发出的神圣宣告；“曾……说”自然体现其既成事实，同时不排除当前效力。
- source_word: בְּקָדְשׁוֹ
  choice: 在他的圣洁中
  rationale: 保留希伯来语介词短语及קֹדֶשׁ可指上帝之圣洁的主要理解，也借脚注保留“圣所”和“凭自己的圣洁”等可能。
- source_word: אֶעְלֹזָה
  choice: 我要欢欣
  rationale: 表达高昂、喜悦的欢庆；“欢欣”在现代汉语中庄重自然，并比一般的“喜乐”更能体现振奋语气。
- source_word: אֲחַלְּקָה
  choice: 我要分配
  rationale: 在领土语境中表示划分并配给土地；“分配”既体现划分，也体现主权性的处置。
- source_word: שְׁכֶם
  choice: 示剑
  rationale: 采用该古代地名通行的中文译名。
- source_word: וְעֵמֶק סֻכּוֹת
  choice: 疏割谷
  rationale: 以自然简洁的中文表达“疏割的山谷”，并采用该地名通行译法。
- source_word: אֲמַדֵּד
  choice: 丈量
  rationale: 准确保留测量土地的具体意象；在与“分配”平行的领土语境中也自然暗示划定与掌管。
theological_decisions:
- issue: 说话者及引语范围
  choice: 把后面的第一人称动词理解为上帝亲自宣告他对土地的主权。
  alternative: 诗人先报告上帝说过话，随后改由自己用第一人称发言。
  rationale: “上帝曾……说”自然引出直接引语，接续的领土分配和丈量也符合上帝主权宣告的语境；但不在译文中额外添加解释性称谓。
- issue: בְּקָדְשׁוֹ所指
  choice: 正文译作“在他的圣洁中”，理解为上帝在其圣洁中发言。
  alternative: “从他的圣所”或“凭自己的圣洁”。
  rationale: 该词既可表示圣洁属性，也可表示圣所；正文采用属性义，同时以脚注明确保留原文真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。正文保持紧凑的平行结构；“分配—丈量”保留领土处置的具体意象。脚注标记按出现顺序置于相应词句之后。
