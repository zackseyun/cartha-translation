source:
  edition: WLC
  text: כִּֽי גָד֣וֹל מֵֽ/עַל שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/004.yaml
  text: For your steadfast love is great above the heavens[a], and your faithfulness reaches to the clouds.
translation:
  language: zh_hans
  text: '因为你的慈爱高过诸天，

    你的信实[a]上达云霄。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信实”或译“真实”。
    reason: אֱמֶת 既可表示忠诚可靠，也可表示真实；本处因与“慈爱”平行，正文采用“信实”。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出赞美与劝勉的理由；“因为”自然保留其因果作用。
- source_word: גָדוֹל מֵעַל שָׁמַיִם
  choice: 高过诸天
  rationale: 原文以空间高度表达超越与广大；“高过诸天”简洁保留诗歌意象，也体现 גָדוֹל 与 מֵעַל 共同形成的比较含义。
- source_word: חַסְדֶּךָ
  choice: 你的慈爱
  rationale: חֶסֶד 表示持久、忠诚而施恩的爱；“慈爱”是现代中文圣经语体中自然且庄重的表达，避免把经文本身未明说的“约”直接加入正文。
- source_word: וְעַד
  choice: 上达
  rationale: עַד 表示达到某一界限；根据平行句补出动态含义，以“上达”自然呈现向高处延伸的诗意。
- source_word: שְׁחָקִים
  choice: 云霄
  rationale: 该词在诗歌中指高空、云层；“云霄”既保留具体的高空意象，又符合现代中文诗体的庄重语感。
- source_word: אֲמִתֶּךָ
  choice: 你的信实
  rationale: אֱמֶת 可指真理、真实或可靠忠诚；与 חֶסֶד 并列并描述上帝的品格时，“信实”最自然，同时以脚注保留“真实”的词义可能。
theological_decisions:
- issue: 如何表达描述上帝品格的 חֶסֶד 与 אֱמֶת 这一诗歌对偶
  choice: 译作“慈爱”和“信实”
  alternative: “怜悯”和“真实”，或“慈爱”和“真理”
  rationale: “慈爱”和“信实”清楚传达上帝恒久施恩、可靠可信的品格，又不在正文中额外加入“圣约”等解释性概念。由于 אֱמֶת 本身也可表示“真实”，脚注保留这一词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的中文诗歌语体；两行结构对应希伯来文平行句。“诸天”与“云霄”保留垂直延展的意象，避免过度解释。
