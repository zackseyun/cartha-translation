  language: zh_hans
  text: 醒来吧，竖琴和里拉琴！我要唤醒黎明。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我要叫醒晨曦”或“我要唤起清晨”。原文运用鲜明的诗歌意象，描写诗人清早起来赞美上帝，仿佛是他唤醒了黎明。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרָה
  choice: 醒来吧
  rationale: 这是动词 עור 的祈使形式，以拟人手法召唤乐器发声；“醒来吧”自然、鲜明，并与下句同一词根的 אָעִירָה 相呼应。
- source_word: הַנֵּבֶל
  choice: 竖琴
  rationale: נבל 指一种弦乐器；“竖琴”是现代汉语中清楚易懂的近似名称，也与下一种乐器有所区别。
- source_word: וְכִנּוֹר
  choice: 和里拉琴
  rationale: כינור 通常指里拉琴一类的古代弦乐器；采用“里拉琴”可保留原文并列两种不同乐器的表达。
- source_word: אָעִירָה
  choice: 我要唤醒
  rationale: 这是 עור 的第一人称单数意愿式，表达诗人的决意；“我要唤醒”既保留主动意愿，也重现与开头“醒来吧”的词根呼应。
- source_word: שָּׁחַר
  choice: 黎明
  rationale: שחר 指破晓、黎明；“黎明”简洁庄重，并保留诗人把黎明人格化的诗歌意象。
