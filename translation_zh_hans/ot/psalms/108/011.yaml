  text: הֲ/לֹֽא אֱלֹהִ֥ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/011.yaml
  text: Have you not rejected us[a], O God? And do you not go out with our armies?
translation:
  language: zh_hans
  text: 上帝啊，你不是已经弃绝了我们[a]吗？你不与我们的军队一同出征吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“抛弃我们”。希伯来语动词可表达强烈的拒绝。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 不是……吗
  rationale: 引出预期肯定回答的反问，既保留疑问形式，也符合现代汉语表达。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 虽为形态上的复数形式，此处搭配单数动词并用作直接称呼，指以色列的上帝。
- source_word: זְנַחְתָּנוּ
  choice: 弃绝了我们
  rationale: זנח表示拒绝、撇弃；“弃绝”保留其强烈的盟约哀诉意味，又是现代中文圣经语体中可理解的表达。
- source_word: וְלֹא
  choice: 不再
  rationale: 连词与否定词承接前句；结合哀诉语境，“不再”自然表达上帝没有像从前一样随军出征，但不将其解释为永久停止。
- source_word: תֵצֵא
  choice: 出征
  rationale: 字面为“出去”；军事语境中译作“出征”自然且明确，表达随军行动之意。
- source_word: בְּצִבְאֹתֵינוּ
  choice: 与我们的军队一同
  rationale: צָבָא在此指军队；介词ב表达伴随关系，用“与……一同”清楚传达上帝随军出战的图景。
theological_decisions:
- issue: 哀歌中对上帝弃绝其子民的陈述
  choice: 保留“弃绝”这一强烈措辞，并以直接反问呈现
  alternative: 弱化为“离开我们”或“没有与我们同在”
  rationale: 希伯来文זנח表达强烈的拒绝或撇弃。译文不淡化诗人的盟约哀诉，也不替文本消解上帝弃绝与子民祈求之间的神学张力。
- issue: 第二分句的疑问范围
  choice: 将第二分句也译为反问
  alternative: 译为陈述句：“你不与我们的军队一同出征。”
  rationale: 句首הֲלֹא所引出的反问可理解为统摄并列的两个分句；用两个相连的反问符合中文韵律，也保留原文可能存在的句法连续性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上帝啊”清楚标示呼语；两个反问保持诗篇哀诉的力度。“弃绝”较正式但通俗可懂，且比“离弃”更贴近זנח的强烈拒绝意味。
