  yaml_path: translation/ot/psalms/108/010.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a][b][c]
translation:
  language: zh_hans
  text: 谁能领我进入坚固城[b]？谁能引我到以东？[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “到以东”所译的希伯来语介词也可译为“直到以东”或“远至以东”。
    reason: lexical_alternative
  - marker: b
    text: “坚固城”可能指以东境内某座特定的堡垒城；传统上常被认为是西拉（佩特拉），但希伯来原文没有写出城名。
    reason: cultural_note
  - marker: c
    text: “能引我”所译的希伯来语动词在形式上是完成式，也可直译为“曾引我”或“已经引我”；这里按它与上句的平行关系译为前瞻性的疑问。
    reason: previous_rendering
lexical_decisions:
- source_word: מִי
  choice: 谁能
  rationale: 疑问代词 מִי 是“谁”；结合两个动词所表达的前瞻性、修辞性疑问，译作“谁能”符合现代汉语，也保留诗人寻求带领的语气。
- source_word: יֹבִלֵנִי
  choice: 领我进入
  rationale: יבל 的使役形表示使人前往、带领或带到某处；与“坚固城”搭配时，“领我进入”清楚表达目的地关系，并与下句的“引我”形成自然平行。
- source_word: עִיר מִבְצָר
  choice: 坚固城
  rationale: 该结构直指设防、坚固的城。汉语“坚固城”简洁庄重，也不擅自补出原文未明说的城名。
- source_word: נָחַנִי
  choice: 能引我
  rationale: נחה 表示带领、引导。该动词形式上是完成式，但在诗歌平行结构中可承接上句未完成式的将来或情态意义；正文按平行关系译为“能引我”，并以脚注保留形式上的另一种理解。
- source_word: עַד אֱדוֹם
  choice: 直到以东
  rationale: עַד 表示所达到的界限或终点；“直到以东”保留这一范围意味。“以东”采用现代中文圣经传统中通行的专名译法。
theological_decisions:
- issue: 第二行完成式 נָחַנִי 的时态和语气
  choice: 按与第一行的诗歌平行关系译为前瞻性的情态疑问“谁能引我”
  alternative: 按形式直译为“谁曾引我”或“谁已经引我”
  rationale: 上下文是面向尚待实现之行动的修辞疑问，两行构成同义平行；采用前瞻性读法可避免制造突兀的时间转换，但脚注说明希伯来语的形式，以保留真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。两句均以“谁能”起首，显出希伯来诗歌的平行结构；“领我进入／引我直到”适度变化措辞，同时保留两个近义动词的区别。
