  choice: 采用含义较宽的“大卫的”，不在正文中断定作者身份
  alternative: “大卫所作”或“献给大卫”
  rationale: 希伯来文标题本身可表示作者、归属、题献或关联。正文不作更具体的历史判断，以保留原文的含混性。
