source:
  edition: WLC
  text: ר֣וּמָ/ה עַל שָׁמַ֣יִם אֱלֹהִ֑ים וְ/עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/005.yaml
  text: Be exalted above the heavens[a], O God[b], and your glory over all the earth.
translation:
  language: zh_hans
  text: 神啊，愿你受尊崇，高过诸天[a]；你的荣耀在全地之上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神啊，愿你升到诸天之上。”
    reason: 保留 רוּמָה 可表示“升高、升起”的空间性译法。
  - marker: b
    text: 本句直译为“在全地之上，你的荣耀”。原文没有明写动词；它既可承接上句，理解为祈愿，也可理解为陈述。
    reason: 说明第二诗行的无动词结构及其语气歧义。
lexical_decisions:
- source_word: רוּמָה
  choice: 愿你受尊崇
  rationale: 这是词根 רום 的祈使式，直接向神发出祈愿。在诗篇的颂赞语境中，“愿你受尊崇”自然表达尊荣上的高举，同时不完全排除空间上升高的意象。
- source_word: עַל שָׁמַיִם
  choice: 高过诸天
  rationale: עַל 与表示高举的动词连用，表达“在……之上”；שָׁמַיִם 是复数形式。“高过诸天”既保留垂直意象，也符合现代汉语诗体。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 此处是直接称呼；汉语用“啊”自然标明呼格。
- source_word: וְעַל כָּל הָאָרֶץ
  choice: 遍及全地
  rationale: 直译为“在全地之上”。汉语“遍及全地”自然表达神的荣耀覆盖全地；הָאָרֶץ 与“诸天”构成宇宙性的对应，因此译作“全地”而非局部的“全境”。
- source_word: כְּבוֹדֶךָ
  choice: 你的荣耀
  rationale: כָּבוֹד 在对神的颂赞中指其尊荣、威荣与彰显；“荣耀”是准确且通行的对应词。
theological_decisions:
- issue: 第二诗行省略谓语所形成的语气歧义
  choice: 你的荣耀遍及全地
  alternative: 愿你的荣耀高过全地
  rationale: 希伯来文第二行没有明写动词。正文保持简练的无标记表达，使其既可承接前行的祈愿语气，也可听作对神荣耀遍及全地的宣告；脚注说明这一语法张力，避免武断补入某一种语气。
- issue: רוּמָה 是尊荣上的高举还是空间上的升起
  choice: 愿你受尊崇，高过诸天
  alternative: 愿你升到诸天之上
  rationale: 颂赞语境较支持“受尊崇”，但该词本身仍可保有“升高、升起”的空间含义，因此正文采用尊荣义，脚注保留空间义的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“诸天”保留希伯来诗歌的复数与崇高语体；分号呈现两行平行结构。正文不强行补出第二行的祈愿动词，脚注则交代其语法开放性。
