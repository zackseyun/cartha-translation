  text: נָכ֣וֹן לִבִּ֣/י אֱלֹהִ֑ים אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה אַף כְּבוֹדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/001.yaml
  text: My heart is steadfast[a], O God; I will sing and make music, even with my glory.
translation:
  language: zh_hans
  text: 神啊，我的心坚定；我要歌唱，我要奏乐；连我的荣耀也要如此[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“我的荣耀”。在诗歌中，这个表达可能指说话者内在的自我或全人，也可能指作为赞美工具的舌头。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: 坚定
  rationale: 该词表示稳固、坚定或预备妥当；在立志赞美的语境中，“坚定”既保留内心稳固之意，也自然表达诗人的决心。
- source_word: לִבִּי
  choice: 我的心
  rationale: 希伯来语“心”常指人的内在自我、意志和情感；直译为“我的心”自然且保留原文意象。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 此处是直接称呼；用“神啊”准确传达呼语功能，并符合现代汉语祷告与诗歌语体。
- source_word: אָשִׁירָה
  choice: 我要歌唱
  rationale: 该鼓励式动词表达主动意愿和坚定决心；“我要歌唱”在现代汉语中清楚自然。
- source_word: וַאֲזַמְּרָה
  choice: 我要奏乐
  rationale: זמר 的加强词干可指奏乐、作乐或以音乐赞美；译作“奏乐”与“歌唱”形成平行，也保留可能的器乐意味。
- source_word: אַף
  choice: 连……也
  rationale: 此词在这里有递进或强调作用；“连……也”自然引出末尾出人意料而含义浓缩的诗句。
- source_word: כְּבוֹדִי
  choice: 我的荣耀
  rationale: 原文字面为“我的荣耀”。诗歌中它可能指说话者内在尊荣的自我、整个生命，或作为赞美工具的舌头。正文保留这一诗性表达，不把它固定解释为某一种含义。
theological_decisions:
- issue: 赞美诗语境中 כְּבוֹדִי 的解释
  choice: 我的荣耀
  alternative: 我的全人／我的灵魂／我的舌头
  rationale: 原文用语具有比喻性，具体所指并不确定。正文保留“我的荣耀”，并通过省略补足“也要歌唱”来呈现其与前句的诗性关联；脚注列出常见理解，以免把多义表达归结为单一神学解释。
translation_notes:
  register: 采用现代、庄重而可诵读的诗歌语言。“我要歌唱，我要奏乐”保留原文平行结构；末句补出原文省略而可由上文承接的“也要歌唱”，使汉语完整，同时用脚注保留“我的荣耀”的词义歧义。
