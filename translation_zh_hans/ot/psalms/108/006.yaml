  text: לְ֭מַעַן יֵחָלְצ֣וּ/ן יְדִידֶ֑י/ךָ הוֹשִׁ֖יעָ/ה יְמִֽינְ/ךָ֣ וַ/עֲנֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/006.yaml
  text: So that your beloved ones may be rescued[a], save with your right hand and answer me.
translation:
  language: zh_hans
  text: 为使你所爱的人得以脱险[a]，求你用右手拯救，并应允我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“得蒙解救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 为使
  rationale: 引出目的或结果，简洁自然地保留与后句的逻辑联系。
- source_word: יֵחָלְצוּן
  choice: 得以脱险
  rationale: חלץ的尼法勒式在此表示从危难中被救出；“脱险”符合祷告语境，也保留获救的含义。
- source_word: יְדִידֶיךָ
  choice: 你所爱的人
  rationale: 表达复数且带有亲爱之意；现代汉语自然明白，不额外加入特定神学限定。
- source_word: הוֹשִׁיעָה
  choice: 拯救
  rationale: 准确传达祈使语气，并与前半句的脱险主题相呼应。
- source_word: יְמִינְךָ
  choice: 用右手
  rationale: 保留希伯来文“右手”的形象，并自然表达施行拯救的方式。
- source_word: וַעֲנֵנִי
  choice: 并应允我
  rationale: 保留第一人称单数后缀；“应允”适合向上帝祈求的庄重语体。
theological_decisions:
- issue: 受益者为复数，而祈求者为单数
  choice: 保留“你所爱的人”与“应允我”的转换
  alternative: 协调为“应允我们”
  rationale: 希伯来文本从复数群体转到单数诗人；译文保留这一张力，不擅自统一人称。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言；保留“右手”的圣经意象及原文由复数转为单数的人称变化。
