  text: בֵּֽ/אלֹהִ֥ים נַעֲשֶׂה חָ֑יִל וְ֝/ה֗וּא יָב֥וּס צָרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/013.yaml
  text: With God we will do valiantly[a], and he will trample our foes.
translation:
  language: zh_hans
  text: 靠着上帝，我们必奋勇得胜[a]；他必践踏我们的敌人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们必施展大能”；这个希伯来习语可以强调力量、英勇表现或得胜的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: 靠着上帝
  rationale: 介词ב在这里可表达凭借和倚靠。“靠着上帝”自然地表明人的行动依赖上帝，同时不把含义限定为纯粹的工具关系。
- source_word: נַעֲשֶׂה חָיִל
  choice: 我们必奋勇得胜
  rationale: עשה חיל是表达力量、英勇表现或取得胜利的习语；在争战语境中，“奋勇得胜”兼顾勇武行动与胜利结果，也符合现代汉语诗歌体。
- source_word: וְהוּא
  choice: 正是他
  rationale: ו表示承接，显出的代词הוּא带有强调作用；调整为汉语强调句，突出从群体行动转向上帝决定性的行动。
- source_word: יָבוּס
  choice: 践踏
  rationale: בוס指踩踏、践踏；保留原文鲜明的军事性败敌意象，不弱化为一般的“制服”。
- source_word: צָרֵינוּ
  choice: 我们的敌人
  rationale: צָרֵינוּ指敌对者；“敌人”是现代汉语中清楚、庄重且自然的对应表达。
theological_decisions:
- issue: 得胜中的行动主体
  choice: 同时保留“我们必奋勇得胜”和“正是他”践踏敌人
  alternative: 只突出上帝的作为而淡化人的行动，或只把上帝描写为人的辅助者
  rationale: 希伯来文本既陈述群体靠着上帝奋勇得胜，又把践踏敌人的决定性行动归于上帝；译文保留两方面，不消解其中的神学张力。
translation_notes:
  register: 采用现代、庄重、易懂的诗体汉语。“奋勇得胜”传达争战语境中的勇武与胜利；分号和“正是他”重现两小句之间的承接及主体强调。
