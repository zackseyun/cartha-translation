base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/009.yaml
  text: Moab is my washbasin[a]; on Edom I throw my sandal[c][b]; over Philistia I shout in triumph.
translation:
  language: zh_hans
  text: 摩押是我的洗盆[a]；我要把我的鞋[b]扔在以东之上；我要向非利士地发出胜利的欢呼[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我洗涤用的锅”。这个意象把摩押比作洗涤器皿，表达其受辱或被制伏。
    reason: lexical_alternative
  - marker: b
    text: 或译“我要把我的鞋掷向以东”。这一动作可能象征对以东的支配或所有权。
    reason: lexical_alternative
  - marker: c
    text: 或译“我要向非利士地高声呼喊”或“我要向非利士地发出战吼”。原文动词可指欢庆或争战时的呼喊。
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: 我的洗盆
  rationale: סִיר指盆或锅一类的器皿，רַחְצִי限定其洗涤用途。“洗盆”在现代汉语中具体、简洁，并保留摩押受辱或被制伏的诗歌意象。
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: 我要把我的鞋扔在……之上
  rationale: שׁלך的使役形表示“扔、掷”，נַעַל指脚上所穿之物。译作“鞋”自然易懂，并保留原文象征支配或所有权的具体动作，不直接将其解释为抽象的征服。
- source_word: עַל / עֲלֵי
  choice: 在……之上／向
  rationale: 介词עַל可表达空间上的“在……上、越过”或动作所指向的对象。以东一句保留“之上”的空间画面；非利士一句按汉语表达译作“向”，同时不排除对其或在其上方欢呼的意象。
- source_word: אֶתְרוֹעָע
  choice: 发出胜利的欢呼
  rationale: 该动词表示高声呼喊，可带欢庆或争战色彩。上下文是列国被制伏，因此“胜利的欢呼”兼顾声音动作与得胜语境，但脚注保留较宽泛的可能。
- source_word: פְלֶשֶׁת
  choice: 非利士
  rationale: 此处是地区名称而非直接指称居民；“非利士”是现代中文圣经语境中通行的地名形式。
- source_word: מוֹאָב / אֱדוֹם
  choice: 摩押／以东
  rationale: 采用现代中文圣经中通行、稳定的专名译法。
theological_decisions:
- issue: 支配敌对列国的比喻语言
  choice: 保留“洗盆”“把鞋扔在……之上”“发出胜利的欢呼”等具体意象。
  alternative: 意译为“摩押服侍我；我占有以东；我战胜非利士”。
  rationale: 原文以受辱、占有和得胜的鲜明诗歌动作表达列国被制伏。正文不将这些动作压缩成抽象的政治征服，以免消解诗歌张力；可能的象征意义放入脚注说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。平行分句保留希伯来诗歌的节奏与第一人称宣告；专名使用简体中文圣经通行译名。脚注标记依正文出现顺序排列。
