  text: לִ֤/י גִלְעָ֨ד לִ֤/י מְנַשֶּׁ֗ה וְ֭/אֶפְרַיִם מָע֣וֹז רֹאשִׁ֑/י יְ֝הוּדָ֗ה מְחֹקְקִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/008.yaml
  text: Gilead is mine[a]; Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my ruler's staff.
translation:
  language: zh_hans
  text: 基列是我的，玛拿西是我的；以法莲是我头的保障[a]；犹大是我的权杖[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我头的堡垒”，是表示保护力量的诗歌意象。
    reason: 说明 מָעוֹז רֹאשִׁי 的字面属格结构及其保护性意象，避免将主文的“我头的保障”理解为普通地理描述。
  - marker: b
    text: 或译“犹大是我的颁法者”或“犹大是我的统治者”。原词也可指象征治理权柄的杖。
    reason: 保留 מְחֹקְקִי 可指颁法者、统治者或象征其权柄之杖的词义范围，不在主文中排除其他可成立的理解。
lexical_decisions:
- source_word: לִי
  choice: 是我的
  rationale: 介词 ל 加第一人称单数词尾在这里表达归属；“是我的”自然、简洁地保留神宣告主权和所有权的语气。
- source_word: גִלְעָד
  choice: 基列
  rationale: 采用现代中文圣经中通行的地名译法。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经中通行的支派及地域名称译法。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 采用现代中文圣经中通行的支派名称译法。
- source_word: מָעוֹז
  choice: 堡垒
  rationale: 该词可指坚固之处或防御力量；“堡垒”保留本节军事和王权诗歌中的具体意象。
- source_word: רֹאשִׁי
  choice: 我头上的
  rationale: 原文直指“我的头”；译作“我头上的”既保留身体意象，也使“堡垒”的比喻在中文中较为顺畅，不直接改译成解释性的“头盔”。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经中通行的支派名称译法。
- source_word: מְחֹקְקִי
  choice: 我的统治之杖
  rationale: 该词源与颁定、刻定有关，既可指施行统治或颁法的人，也可指象征其权柄的杖。“统治之杖”保留具体的王权器物意象，同时比单纯的“权杖”更贴近该词与治理、颁令的联系。
theological_decisions:
- issue: 犹大在 מְחֹקְקִי 一词中的王权角色
  choice: 犹大是我的统治之杖
  alternative: 犹大是我的颁法者
  rationale: 上下文把以色列各地域和支派描绘为神所拥有、用来施展统治的力量或器具。“统治之杖”突出王权象征，却不排除该希伯来词所含的颁令或治理意义；人物性译法“颁法者”列入脚注，以保留原词的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两个“是我的”保留原文重复所形成的主权宣告；后两分句保留“堡垒”和“杖”的平行政治—军事意象。脚注标记均置于相应主文之后，且未沿用英文材料中位置与内容不相符的脚注标记。
