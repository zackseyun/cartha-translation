  terminology: 基列、玛拿西、以法莲、犹大均为通行中文译名。“保障”在这里恰当传达 מָעוֹז 所指的防护力量，同时脚注保留“堡垒”的字面军事意象。将 מְחֹקְקִי 主文译作“权杖”，并在脚注保留“颁法者”和“统治者”的可能性，可避免将有争议的词义定死。
