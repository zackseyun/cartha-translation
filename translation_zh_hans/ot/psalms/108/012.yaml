base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/012.yaml
  text: Give us help against the adversary[b][a], for the salvation of man is vain.
translation:
  language: zh_hans
  text: 求你赐我们援助，抵挡敌人[a]；因为人的救助是徒然的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你赐我们援助，脱离困境。”希伯来语צַר既可指“敌人”，也可指“困境、患难”。
    reason: lexical_alternative
  - marker: b
    text: “人的救助”也可译作“人类的救助”；这里指人所能提供的帮助，而非人作为被拯救的对象。
    reason: alternative_reading
lexical_decisions:
- source_word: הָבָה
  choice: 求你……
  rationale: 这是祈求中使用的命令式；汉语用“求你”既自然，也保留向上帝恳求赐予的语气。
- source_word: לָּנוּ
  choice: 我们
  rationale: 作受益者，与“帮助我们”这一现代汉语常用表达相合。
- source_word: עֶזְרַת
  choice: 帮助
  rationale: 该词为附属形，意为“帮助”；此译简明自然，并与下句的“拯救”形成呼应。
- source_word: מִצָּר
  choice: 抵挡敌人
  rationale: צַר既可指“敌人”，也可指“困境”。结合本诗军事语境，正文采用人格性的“敌人”；介词מִן在“帮助”之后按汉语习惯译为“抵挡”。
- source_word: וְשָׁוְא
  choice: 因为……是虚空的
  rationale: שָׁוְא表示虚妄、空洞、无效；“虚空”保留诗意及神学张力。连接词在语境中可表达原因，译作“因为”使两分句关系清楚。
- source_word: תְּשׁוּעַת
  choice: 拯救
  rationale: 可指拯救、解救或胜利；“拯救”保留核心词义，不在正文中把它限定为某一种神学意义。
- source_word: אָדָם
  choice: 人
  rationale: 此处是泛指人类，与上帝的帮助相对；现代汉语“人”自然、简洁，且无需使用带男性限定意味的表达。
theological_decisions:
- issue: אָדָם在论及人类无力时的泛指意义
  choice: 人
  alternative: 人类
  rationale: 希伯来语此处泛指人所能提供的拯救，并非专指男性。“人”保留诗句的凝练表达，“人类”作为说明性替代译法列入脚注。
- issue: תְּשׁוּעַת在当前语境中的范围
  choice: 拯救
  alternative: 解救／胜利
  rationale: 该词在军事语境中可能偏向解救或胜利，但正文采用较宽泛的“拯救”，避免把含义过早限定，也不引入特定教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留原文两分句的祈祷和诗歌结构。正文中的“虚空”比“无用”更贴近שָׁוְא的意象，也让“人的拯救”这一刻意尖锐的表述保持张力。
