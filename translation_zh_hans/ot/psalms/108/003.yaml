base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/003.yaml
  text: I will give thanks to you among the peoples[a], O Yahweh[b], and I will sing praise to you among the nations.
translation:
  language: zh_hans
  text: '耶和华啊，我要在万民中称谢你[a]，

    我要在列国中歌颂你。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称谢”也可译作“赞美”。原文“万民”和“列国”使用两个平行词语，表明诗人的称谢与歌颂面向各民族。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: 我要……称谢你
  rationale: ידה的Hiphil形式在诗篇敬拜语境中可指称谢或赞美；“称谢”既保留向上帝表达感谢与承认的意味，也自然地带出第二人称宾语。
- source_word: בָעַמִּים
  choice: 在万民中
  rationale: עַמִּים是עַם的复数，指众多民族或人民群体；“万民”在现代中文圣诗语体中自然凝练，并保留国际性的范围。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是上帝专名四字神名יהוה；采用现代中文读者熟悉的专名形式“耶和华”，不以头衔替代。
- source_word: וַאֲזַמֶּרְךָ
  choice: 我要……歌颂你
  rationale: זמר的Piel形式通常指以歌唱或音乐赞美；“歌颂”同时表达音乐行动和赞美内容。
- source_word: בַּל
  choice: 在……中
  rationale: 此处是诗歌性介词用法，与上一分句的בָּ构成平行；译作“在……中”保留两行结构。
- source_word: אֻמִּים
  choice: 列国
  rationale: אֻמִּים指各民族、各国；“列国”与上一行“万民”形成有变化的同义平行，并保持面向众民族的范围。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，正文因此采用专名而非“主”等称号；“耶和华”是简体中文普通读者最熟悉且可辨识为专名的形式。
- issue: אוֹדְךָ表达称谢还是一般赞美
  choice: 称谢你
  alternative: 赞美你
  rationale: 该动词在诗篇中兼有感谢、承认和赞美的语义；此处选择“称谢”以保留其较具体的感恩意味，同时用脚注说明可译作“赞美”。
translation_notes:
  register: 采用自然、庄重而易懂的现代汉语，并以两行呈现希伯来诗歌的同义平行。“万民／列国”和“称谢／歌颂”既互相呼应，又保留原文词汇变化。
