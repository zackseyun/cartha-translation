base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/007.yaml
  text: They have hands[a], but cannot feel; feet, but cannot walk[b]; they do not make a sound in their throat.
translation:
  language: zh_hans
  text: 它们有手，却不能摸[a]；有脚，却不能走；喉咙里发不出声音[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们有手，却不摸……有脚，却不走。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“它们不能在喉咙里低声呢喃。”希伯来文动词可指低声发音或喃喃作声。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדֵיהֶם
  choice: 它们有手
  rationale: 希伯来文直译为“它们的手”，这里是无动词的诗句。汉语补出“有”，既自然，也与后面的“有脚”构成紧凑的平行结构。
- source_word: יְמִישׁוּן
  choice: 不能触摸
  rationale: 此动词在这里表示用手触摸、摸索或感知。上下文强调偶像虽有肢体却毫无能力，因此用“不能”表达其无能，用“触摸”保留手的具体功能。
- source_word: רַגְלֵיהֶם
  choice: 有脚
  rationale: 原文为“它们的脚”。承接“它们有手”的句式译作“有脚”，符合现代汉语，也保留诗歌的对应结构。
- source_word: יְהַלֵּכוּ
  choice: 不能行走
  rationale: 形式上是“不行走”，但语境并非描述偶像暂时没有动作，而是讽刺它们没有行走能力；“不能行走”准确传达这一语用含义。
- source_word: יֶהְגּוּ
  choice: 发不出声音
  rationale: הגה 可指低声发音、呢喃或其他喉音。此处不必限定为完整说话；“发不出声音”清楚表达偶像的喉咙不能产生任何声音，同时在脚注保留“低声呢喃”的词义可能。
- source_word: בִּגְרוֹנָם
  choice: 喉咙里
  rationale: 保留介词与“喉咙”的具体意象，并以自然汉语“喉咙里”表达声音本应从其中发出。
theological_decisions:
- issue: 偶像无行动能力的表达
  choice: 将否定句译为“不能触摸”“不能行走”“发不出声音”
  alternative: 较形式对应地译为“不触摸”“不行走”“不在喉咙里发声”
  rationale: 全段以身体部位与其缺失的功能形成反讽，所强调的是偶像的无能，而不只是它们当下没有行动。“不能／发不出”在现代汉语中更准确地传达这一含义，未增添原文之外的教义判断。
- issue: יֶהְגּוּ 所指声音的范围
  choice: 正文采用较宽泛的“声音”
  alternative: 译为“低声呢喃”或“喃喃出声”
  rationale: 该动词可表示低沉的发声或呢喃。正文不把含义收窄为某一种言语行为，脚注则保留更具体的词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“它们”指无生命的偶像；三组分句保持简洁的诗歌平行。“触摸—行走—发声”依次对应手、脚、喉咙的功能。
