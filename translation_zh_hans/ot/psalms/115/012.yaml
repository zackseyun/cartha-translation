  text: יְהוָה֮ זְכָרָ֪/נוּ יְבָ֫רֵ֥ךְ יְ֭בָרֵךְ אֶת בֵּ֣ית יִשְׂרָאֵ֑ל יְ֝בָרֵ֗ךְ אֶת בֵּ֥ית אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/012.yaml
  text: Yahweh has remembered us[a]; he will bless; he will bless the house of Israel; he will bless the house of Aaron.
translation:
  language: zh_hans
  text: 耶和华记念了我们[a]；他必赐福，必赐福给以色列家，必赐福给亚伦家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华一直眷顾我们。”
    reason: “记念”在这里可表达持续放在心上、眷顾之意；此译法突出该词在语境中的关怀含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，保留其作为盟约之神名字的性质，而不泛化为称号“主”。
- source_word: זְכָרָנוּ
  choice: 记念了我们
  rationale: 该词为完成式，带第一人称复数宾语后缀，直译为“记念了我们”；“记念”在此不只指想起，也包含眷顾、关怀之意。
- source_word: יְבָרֵךְ
  choice: 必赐福
  rationale: 结合前句完成式所表达的确信，将未完成式理解为将来或确定预告；保留三次重复，以呈现希伯来诗歌的强调和结构。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留“家”的群体、家族及盟约共同体意涵，也维持与下句“亚伦家”的平行结构。
- source_word: בֵּית אַהֲרֹן
  choice: 亚伦家
  rationale: 明确保留亚伦祭司家族这一群体称谓，并与“以色列家”构成整齐的平行表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知且具有专名功能的“耶和华”，以区别于一般称号“主”；“雅威”是较接近学界重构发音的可行替代。
- issue: יְבָרֵךְ 的语气
  choice: 确定预告：“必赐福”
  alternative: 祈愿：“愿他赐福”
  rationale: 上下文先宣告耶和华已经记念，随后反复陈述赐福，较自然地表达基于神眷顾的信心；但希伯来语未完成式本身容许祈愿理解，因此不把替代读法视为不可能。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“记念”保留圣诗语体和原词意象；“必赐福”清楚表达确信。保留原文三次“赐福”的重复，不作润饰删减。
