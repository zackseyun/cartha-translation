  text: וַ/אֲנַ֤חְנוּ נְבָ֘רֵ֤ךְ יָ֗הּ מֵֽ/עַתָּ֥ה וְ/עַד עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/018.yaml
  text: But we will bless Yah from now and forever[b][a]. Praise Yah!
translation:
  language: zh_hans
  text: 但我们要从现在直到永远颂赞雅[a]。你们要颂赞雅！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”是希伯来文神名的诗歌性短式；有些传统译本译作“耶和华”或“主”。
    reason: alternative_reading
  - marker: b
    text: “你们要颂赞雅”在希伯来文中就是传统礼仪用语“哈利路亚”的来源。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: 但我们
  rationale: 独立代词“我们”承接上节与死人形成对比；用“但”自然表达这里的转折意味，并保留明确的主语。
- source_word: נְבָרֵךְ
  choice: 要……颂赞
  rationale: Piel未完成式第一人称复数在此表达群体从现在起持续如此的决心；“要颂赞”兼顾将来指向与坚定语气。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的诗歌性短式，而非完整形式יהוה；音译为“雅”可保留原文区别，也与末句的礼仪性呼喊相呼应。
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: 从现在直到永远
  rationale: 按原文时间范围直译，表达由当下延续至永远，现代汉语清楚自然。
- source_word: הַלְלוּ יָהּ
  choice: 你们要颂赞雅！
  rationale: הַלְלוּ是复数命令式，明确译出“你们”；将短神名יהּ译作“雅”，并保留呼喊的力度。
theological_decisions:
- issue: 神名诗歌性短式יָהּ的译法
  choice: 雅
  alternative: 耶和华；主
  rationale: 原文两次使用יָהּ，而不是完整神名יהוה。采用简洁音译“雅”保留这一形式差异，不将它悄然等同于其他传统译法。
- issue: 末句הַלְלוּ יָהּ是翻译还是音译
  choice: 你们要颂赞雅！
  alternative: 哈利路亚！
  rationale: 直译可让普通读者看出复数命令式与神名短式的含义；脚注同时说明其传统音译“哈利路亚”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“颂赞”兼具诗篇语体和清晰度；首句保留群体决心，末句明确译出复数命令语气。脚注标记均置于相关正文之后。
