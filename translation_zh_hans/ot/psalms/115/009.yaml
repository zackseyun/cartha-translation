  text: יִ֭שְׂרָאֵל בְּטַ֣ח בַּ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/009.yaml
  text: Israel[a], trust in Yahweh; he is their help and their shield.
translation:
  language: zh_hans
  text: 以色列啊，要信靠雅威[a]；他是他们的帮助，是他们的盾牌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文中上帝的名字YHWH，传统上也译作“耶和华”。
    reason: 说明神名的原文形式及常见的另一种中文译法。
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 专名，指作为整体受呼召的以色列民；加“啊”自然表达希伯来语的直接呼语。
- source_word: בְּטַח
  choice: 要信靠
  rationale: בטח的阳性单数祈使式；这里把以色列作为一个整体来称呼。“信靠”简洁自然，并保留以雅威为倚靠对象的含义。
- source_word: בַּיהוָה
  choice: 信靠雅威
  rationale: 介词ב标明信靠的对象；יְהוָה是上帝的专名，正文音译为“雅威”。汉语“信靠雅威”已自然表达该介词关系，无须机械译出“在……里”。
- source_word: עֶזְרָם
  choice: 他们的帮助
  rationale: עֵזֶר带第三人称阳性复数后缀，直译为“他们的帮助”；保留名词表达，不扩译为“帮助者”。
- source_word: וּמָגִנָּם
  choice: 是他们的盾牌
  rationale: מָגֵן本义为“盾牌”，保留具体的保护性意象；重复“是”使现代汉语句式清楚而庄重。
- source_word: הוּא
  choice: 他是
  rationale: 独立代词在无系词名词句中带强调作用；汉语补出“是”，并以“他”指向雅威。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名YHWH。正文采用较贴近学界常见重构读音的“雅威”，脚注说明传统汉译“耶和华”，既保留专名性质，也帮助普通读者辨认。
- issue: “他是他们的帮助”是否改译为“他帮助他们”或“他是他们的帮助者”
  choice: 他是他们的帮助
  alternative: 他帮助他们；他是他们的帮助者
  rationale: 原文以名词“帮助”作谓语，与“盾牌”形成平行。保留这一较凝练的表达，避免把上帝与其行动之间的诗性陈述改写成单纯动作。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“以色列啊”明确直接呼语；分号保留命令与理由之间的紧密关系。后半句重复“是”，使两个并列谓语在现代汉语中更清晰，同时保留“帮助／盾牌”的平行结构。
