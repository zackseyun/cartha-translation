source:
  edition: WLC
  text: לֹ֤א לָ֥/נוּ יְהוָ֗ה לֹ֫א לָ֥/נוּ כִּֽי לְ֭/שִׁמְ/ךָ תֵּ֣ן כָּב֑וֹד עַל חַ֝סְדְּ/ךָ֗ עַל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/001.yaml
  text: Not to us[a], O Yahweh, not to us, but to your name give glory, because of your steadfast love, because of your faithfulness.
translation:
  language: zh_hans
  text: 耶和华啊，荣耀不要归给我们，不要归给我们；愿荣耀归于你的名，因你的慈爱，因你的信实。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信实”或译“真实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，避免用称号取代原文专名。
- source_word: לֹא לָנוּ ... לֹא לָנוּ
  choice: 不要把荣耀归给我们，不要归给我们
  rationale: 结合后面的“归给你的名”补出首句所省略的“荣耀”，并保留原文强调性的重复。
- source_word: תֵּן כָּבוֹד
  choice: 把荣耀归给
  rationale: 原义为“给荣耀”；此处指承认、归属荣耀，而非赋予神原本没有的荣耀。
- source_word: לְשִׁמְךָ
  choice: 归给你的名
  rationale: 保留“名”的具体意象；在希伯来语语境中也涵盖神所启示的品格与声誉。
- source_word: כִּי
  choice: 要
  rationale: 在双重否定后引出正面的对比请求；中文用分号和“要”自然呈现“不是给我们，而是给你的名”的转折。
- source_word: עַל
  choice: 因为
  rationale: 两个 עַל 短语说明求神使其名得荣耀的依据，译作“因为”清楚自然。
- source_word: חַסְדְּךָ
  choice: 你的慈爱
  rationale: “慈爱”在庄重而通行的现代中文中可表达 חֶסֶד 所含的恩慈、忠贞和持守；不在正文中额外加入“盟约”以免过度限定。
- source_word: אֲמִתֶּךָ
  choice: 你信实
  rationale: 与 חֶסֶד 并列时侧重可靠、忠信，中文以“信实”最能表达关系性的恒常可靠；“真实”作为可能义保留于脚注。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文圣经传统中最广为人知、可作为专名使用的“耶和华”；“雅威”是较接近现代学界重构读音的另一方案，但重构读音并非完全无争议。
- issue: אֲמִתֶּךָ 在 חַסְדְּךָ 并列结构中的含义
  choice: 信实
  alternative: 真实
  rationale: 此常见配对强调神慈爱而可靠的品格，因此正文译“信实”；同时该词确有“真实、真理”之义，以脚注保存词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留“不归给我们”的双重重复及“归给你的名”的核心意象；首句补出“荣耀”以符合自然中文并明确原文承前省略的宾语。
