id: PSA.115.16
reference: Psalms 115:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/שָּׁמַ֣יִם שָׁ֭מַיִם לַ/יהוָ֑ה וְ֝/הָ/אָ֗רֶץ נָתַ֥ן לִ/בְנֵי אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/016.yaml
  text: The heavens are Yahweh's heavens[c][b][a], but the earth he has given to the sons of man.
translation:
  language: zh_hans
  text: 天，是雅威的天[a]；地，他却赐给了世人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文连续两次使用“天”，可译作：“天——天属于雅威。”这种重复带有强调作用。
    reason: 说明原文的重复结构及可行译法。
  - marker: b
    text: “世人”原文直译为“人的子孙”，是泛指人类的希伯来表达。
    reason: 说明希伯来习语的字面形式和实际所指。
lexical_decisions:
- source_word: הַשָּׁמַיִם ... שָׁמַיִם
  choice: 天，是雅威的天
  rationale: 保留希伯来文“天”一词的重复及其话题—说明结构，以体现强调；现代汉语不必标明单复数。
- source_word: לַיהוָה
  choice: 雅威的
  rationale: 介词 לַ 在此表示归属；将神名 יְהוָה 音译为“雅威”，并用所有格结构自然表达“属于雅威”。
- source_word: וְהָאָרֶץ
  choice: 地……却
  rationale: 连接词 וְ 本可译作“而”或“和”，但上下两句构成对照，用“却”能自然显明诗句的反衬关系，又不改变原意。
- source_word: נָתַן
  choice: 他却赐给了
  rationale: 完成式动词表示已经成就的给予；主语由上句的雅威承接，故补出“他”。“赐给”符合神向人施予的语境，同时保持庄重自然。
- source_word: לִבְנֵי אָדָם
  choice: 给了世人
  rationale: 该希伯来习语泛指人类。译作“世人”在现代汉语中自然、准确，也避免把原本的泛称误解为只指男性；字面形式在脚注说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确保留专名性质。
- issue: בְנֵי אָדָם 所指的范围
  choice: 世人
  alternative: 人的子孙
  rationale: 该短语在这里泛指全体人类，不限于男性后裔；正文采用自然的意义对等表达，脚注保留其字面构词信息。
- issue: 天与地的归属关系
  choice: 保留“天属于雅威、地赐给世人”的对照，不补充所有权方面的解释
  alternative: 将后半句解释为人对地仅有受托管理权
  rationale: 原文只陈述雅威把地赐给世人，并未在本节明确界定这种赐予的法律或神学性质，因此不在译文中消解这一张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。分号呈现诗句两半的平行与对照；“天，是雅威的天”有意保留原文的重复强调，虽略带诗性，却仍易于普通读者理解。
