  text: בְּרוּכִ֣ים אַ֭תֶּם לַ/יהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/015.yaml
  text: May you be blessed by Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: zh_hans
  text: 愿你们蒙耶和华[a]赐福——他是天地的创造者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“你们是蒙耶和华赐福的”；这是祝福用语，因此译作“愿你们蒙耶和华赐福”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכִים אַתֶּם
  choice: 愿你们蒙……赐福
  rationale: בְּרוּכִים是ברך的被动分词，אַתֶּם明确是第二人称复数。在本诗的祝福语境中，用“愿你们蒙……赐福”自然表达希伯来语祝福公式的祈愿作用，同时由“你们”保留复数。
- source_word: לַיהוָה
  choice: 蒙耶和华赐福
  rationale: 介词ל在这一被动祝福公式中可表示祝福的来源或施行者；汉语“蒙耶和华赐福”清楚而自然地表达祝福来自יהוה。神名יהוה按其专名译作“耶和华”。
- source_word: עֹשֵׂה
  choice: 创造者
  rationale: 这是עשה的Qal主动分词，在此名词化，用作对神的称号。“创造者”保留称号性质，也避免把分词不必要地限定为一次过去行动。
- source_word: שָׁמַיִם וָאָרֶץ
  choice: 天地
  rationale: 这是表示整个受造世界的固定对举。现代汉语“天地”简洁自然，兼顾原文的两项结构与整体含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名יהוה。正文采用现代中文圣经读者熟悉的专名“耶和华”，而不以“上主”或“主”替代，从而保留其作为立约神名的性质。
- issue: בְּרוּכִים אַתֶּם לַיהוָה的语气与施事关系
  choice: 愿你们蒙耶和华赐福
  alternative: 你们是属耶和华而有福的
  rationale: 希伯来语表面上是无系词结构，介词ל也有一定语义张力；但在上下文中最自然地构成祝福公式。正文表达其祈愿功能，脚注保留较直译形式及介词可能体现的来源关系，不把语法张力完全隐藏。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿……蒙……赐福”符合汉语祝福语体；“天地的创造者”准确保留神圣称号，分号使祝福与随后对耶和华的说明关系清楚。
