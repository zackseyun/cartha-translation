  text: עֲֽ֭צַבֵּי/הֶם כֶּ֣סֶף וְ/זָהָ֑ב מַ֝עֲשֵׂ֗ה יְדֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/004.yaml
  text: Their idols are silver and gold[a], the work of human hands.
translation:
  language: zh_hans
  text: 他们的偶像是银和金，是人手所造的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצַבֵּיהֶם
  choice: 他们的偶像
  rationale: עָצָב在本诗以复数并带第三人称阳性复数后缀出现，指受人敬拜的人造神像；“偶像”既明确所指，也保留诗中的论辩意味。
- source_word: כֶּסֶף וְזָהָב
  choice: 银的、金的
  rationale: 按希伯来文次序保留“银、金”两种材质，并用现代汉语自然的形容结构说明偶像由何种材料构成。
- source_word: מַעֲשֵׂה
  choice: 所造的
  rationale: 该词指工作、作品或制成之物；在“人手”之后译作“所造的”，以自然汉语表达其为人手制作的成品。
- source_word: יְדֵי אָדָם
  choice: 人手
  rationale: יְדֵי是“手”的复数附属形，אָדָם在此为泛指人类；“人手”简洁保留具体意象及神与人造之物的对比。
theological_decisions:
- issue: אָדָם在泛指结构中的译法
  choice: 人手
  alternative: 人的双手／世人之手
  rationale: 这里的אָדָם并非特指某一男性，而是泛指人类；“人手”准确、自然，并保留“出于人而非神”的神学对比。
- issue: 是否加强对偶像无能的贬抑语气
  choice: 不添加“不过”“无非”等词
  alternative: 他们的偶像不过是金银
  rationale: 上下文确有讽刺和论辩意味，但本节希伯来文本身只陈述材质和制造者；不额外添加限制副词，以免超出本节明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“银的、金的”保留原文材质并列及次序；“是人手所造的”自然呈现原文名词短语“人手的作品”，同时保留具体的“手”这一意象。
