  text: יֹסֵ֣ף יְהוָ֣ה עֲלֵי/כֶ֑ם עֲ֝לֵי/כֶ֗ם וְ/עַל בְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/014.yaml
  text: May Yahweh give increase to you[b][a]—to you and to your children.
translation:
  language: zh_hans
  text: 愿雅威使你们增多[a]——使你们和你们的儿女增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使你们增多”也可较直译为“加增给你们”；原文没有说明所加增的具体是什么。
    reason: 说明动词的字面译法及其语义开放性。
lexical_decisions:
- source_word: יֹסֵף
  choice: 使……增多
  rationale: 该词在使役词干中有“增加、使增多”之意；在祝福语境中用“愿……使……增多”既表达祈愿语气，也保留增加的基本含义，不把增加的具体方面限定为人数、财富或福祉。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现上帝的专名，而不用称号替代。
- source_word: עֲלֵיכֶם ... עֲלֵיכֶם
  choice: 使你们……——使你们……
  rationale: 希伯来文重复“你们”，后一句是强调性的展开说明；破折号既保留重复，又使现代汉语结构清楚自然。
- source_word: וְעַל בְּנֵיכֶם
  choice: 和你们的儿女
  rationale: בָּנִים在家庭祝福中可泛指儿女；此处不扩大译为“后裔”，以免超出本节直接措辞。
theological_decisions:
- issue: 祝福语境中动词形式的语气
  choice: 译作祈愿：“愿雅威……”
  alternative: “雅威必使……”或“雅威使……”
  rationale: 上下文是祝福，动词在此最自然地表达祈愿；但不把它强化为无条件的预告。
- issue: “增多”的具体所指
  choice: 保留为未限定的“使……增多”
  alternative: “使你们人口增多”“使你们兴旺”
  rationale: 原文没有明确限定增加的是人数、财富还是整体福祉；直译式的“增多”保留这种开放性。
- issue: 重复的עֲלֵיכֶם与后半句的关系
  choice: 视后半句为强调并展开前半句
  alternative: 将三个介词短语并列处理
  rationale: 原文停顿和重复适合理解为先祝福“你们”，再明确扩展到“你们和你们的儿女”；破折号保留这种修辞张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“增多”略带直译色彩，但能避免“兴旺”所增加的解释，并保留原文未明说增加内容的特点。
