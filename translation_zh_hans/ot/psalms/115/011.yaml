source:
  edition: WLC
  text: יִרְאֵ֣י יְ֭הוָה בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/011.yaml
  text: You who fear Yahweh[a], trust in Yahweh; he is their help and their shield.
translation:
  language: zh_hans
  text: 敬畏雅威的人哪[a]，要信靠雅威；他是他们的帮助，是他们的盾牌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬畏雅威的人要信靠雅威。”希伯来语分词既可理解为直接呼语“敬畏……的人哪”，也可理解为第三人称称谓“敬畏……的人”。
    reason: 词法形式容许直接呼语和第三人称称谓两种表达。
lexical_decisions:
- source_word: יִרְאֵי
  choice: 敬畏……的人哪
  rationale: 这是动词 ירא 的复数构造分词，在此作名词用，意为“敬畏……的人”。结合后面的复数祈使式，译作直接呼语自然贴合诗篇的劝勉语气，同时以脚注保留第三人称理解。
- source_word: יְהוָה / בַיהוָה
  choice: 雅威 / 信靠雅威
  rationale: 以“雅威”音译四字神名 יְהוָה，保留其专名性质；介词 ב 与 בטח 连用表示信靠的对象，汉语自然译作“信靠雅威”。原文两次出现神名，译文照样重复。
- source_word: בִּטְחוּ
  choice: 要信靠
  rationale: 这是 בטח 的 Qal 复数祈使式。“要信靠”准确表达命令或劝勉，也符合现代汉语经文语体。
- source_word: עֶזְרָם
  choice: 他们的帮助
  rationale: עֵזֶר 可指“帮助”或“帮助者”。此处与“盾牌”并列作谓语，保留“帮助”这一名词表达，避免将其解释性地改写为“帮助者”。
- source_word: וּמָגִנָּם
  choice: 是他们的盾牌
  rationale: מָגֵן 的具体意象是“盾牌”，应保留，不泛化为“保护者”；重复“是他们的”使汉语结构清楚，并反映两个名词均带第三人称复数后缀。
- source_word: הוּא
  choice: 他是
  rationale: 独立代词 הוּא 带有强调作用。汉语以“他是”明确表达判断，并保留对雅威的强调。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”较直接地体现其作为以色列上帝专名的性质，而不是以“主”这一称号替代。
- issue: יִרְאֵי 的人称理解
  choice: 直接呼语：“敬畏雅威的人哪”
  alternative: 第三人称主语：“敬畏雅威的人要信靠雅威”
  rationale: 该复数分词本身可作“那些敬畏……的人”理解；后接复数祈使式，使直接呼语很自然，但希伯来文形式并未排除第三人称式的汉语表达，因此以脚注明示另一译法。
- issue: 命令对象与后句代词的人称转换
  choice: 保留“你们”式呼语与“他们”式物主后缀之间的转换
  alternative: 将后句协调为“他是你们的帮助，是你们的盾牌”
  rationale: 原文先以复数祈使式劝勉听众，随后使用第三人称复数后缀“他们的”。译文不擅自统一人称，以保存原诗的表达张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“人哪”标明直接呼语；“信靠”“帮助”“盾牌”均保留原文的核心词义和具体意象。刻意保留前半句对听众的直接劝勉与后半句“他们的”之间的人称变化。
