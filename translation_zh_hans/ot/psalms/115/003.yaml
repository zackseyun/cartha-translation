  yaml_path: translation/ot/psalms/115/003.yaml
  text: But our God is in the heavens[b][a]; he does all that he pleases.
translation:
  language: zh_hans
  text: 但我们的上帝在诸天；他凡所喜悦的，都做。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他愿意什么，就做什么。”
    reason: “喜悦”也可按语境译为“愿意”；此异译保留 חָפֵץ 的意愿含义及全句的总括语气。
lexical_decisions:
- source_word: וֵאלֹהֵינוּ
  choice: 但我们的上帝
  rationale: 连词 וֵ 在上下文中表示转折，把永活的上帝与不能作为的偶像形成对比；“但”自然传达这一语篇作用。
- source_word: בַשָּׁמַיִם
  choice: 在诸天之上
  rationale: שָׁמַיִם 在形式上为复数；“诸天”保留原文形式和庄重语感，而“之上”在现代汉语中自然表达上帝居于天上，并不意指他受空间限制。
- source_word: כֹּל אֲשֶׁר חָפֵץ
  choice: 随自己的心意
  rationale: 该结构涵盖上帝一切所喜悦、所愿意之事。“随自己的心意”在现代汉语中简洁自然，同时保留 חָפֵץ 可指喜悦、愿望或意愿的语义幅度。
- source_word: עָשָׂה
  choice: 而行
  rationale: 完成式在这里陈述恒常事实，而非仅指一次过去行动；汉语“而行”无需标明时态，能自然表达上帝确实实行其心意。
theological_decisions:
- issue: 上帝主权的措辞
  choice: 他随自己的心意而行
  alternative: 他凡所喜悦的，都能做成；他愿意什么，就做什么
  rationale: 本句强调上帝相对于偶像的自由与行动能力。“随自己的心意而行”保存这种主权宣告，也避免把 חָפֵץ 限定为某一套技术性的神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“诸天”略带诗体色彩，以呼应诗篇体裁并保留希伯来语复数形式；全句避免古奥句法。
