  text: אָזְנַ֣יִם לָ֭/הֶם וְ/לֹ֣א יִשְׁמָ֑עוּ אַ֥ף לָ֝/הֶ֗ם וְ/לֹ֣א יְרִיחֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/006.yaml
  text: They have ears, but do not hear; noses, but do not smell.
translation:
  language: zh_hans
  text: 它们有耳朵，却听不见；有鼻子，却闻不到。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְנַיִם
  choice: 耳朵
  rationale: 双数形式，指听觉器官；按现代汉语自然表达译为“耳朵”，并与下句身体器官的描写对应。
- source_word: לָהֶם
  choice: 它们有
  rationale: ל 加代词后缀字面为“对它们”，在此无动词的领属结构中表示拥有；现代汉语自然译作“它们有”。以“它们”指前文的偶像。
- source_word: יִשְׁמָעוּ
  choice: 听不见
  rationale: שׁמע 的 Qal 未完成式在此指听觉能力。与否定词连用，译作“听不见”，突出虽有器官却无感知能力。
- source_word: אַף
  choice: 鼻子
  rationale: 此处是身体器官“鼻子”，并非“怒气”。原文用单数集合性表达，汉语“有鼻子”自然适用于复数主语。
- source_word: יְרִיחוּן
  choice: 闻不到
  rationale: 该词在此表示嗅闻、闻到气味的能力；与否定词连用，译为“闻不到”，符合现代汉语并与“听不见”形成平行。
- source_word: וְלֹא
  choice: 却……不……
  rationale: 形式上是“而不”，语境中构成拥有器官与缺乏功能之间的反差；用“却”传达其讽刺性的转折关系。
theological_decisions:
- issue: 如何表达对偶像拟人化的描写
  choice: 照原文具体描写偶像虽有感官形体，却没有感知能力
  alternative: 解释性地译成偶像毫无属灵能力
  rationale: 希伯来文本以具体的身体器官和功能构成反偶像的讽刺；直译其意象能保留修辞力量，也避免把额外的神学解释写入正文。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“它们”承接上下文中的偶像；两分句结构平行，以“却听不见／却闻不到”重现原文的反差。
