id: PSA.115.5
reference: Psalms 115:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: פֶּֽה לָ֭/הֶם וְ/לֹ֣א יְדַבֵּ֑רוּ עֵינַ֥יִם לָ֝/הֶ֗ם וְ/לֹ֣א יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/005.yaml
  text: They have mouths, but they do not speak; eyes, but they do not see.
translation:
  language: zh_hans
  text: 它们有口，却不能说话；有眼，却不能看见。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּה
  choice: 口
  rationale: 原文为单数形式，但与复数代词搭配，按个体分配理解，指每个偶像都有口；汉语用“它们有口”自然且保留诗歌的简洁。
- source_word: לָהֶם
  choice: 它们有
  rationale: 介词 לְ 加代词后缀在此表达领有关系；译为“它们有”符合现代汉语习惯。
- source_word: וְלֹא
  choice: 却不能
  rationale: 连接词与否定词在上下句中形成鲜明反差；“却”体现转折。“不能”表达这些器官毫无相应功能，并不暗示仅仅当下没有行动。
- source_word: יְדַבֵּרוּ
  choice: 说话
  rationale: דבר 的加强词干未完成式在此指发声说话；“说话”通俗、准确，并与下句“看见”平行。
- source_word: עֵינַיִם
  choice: 眼
  rationale: 该词指眼睛；汉语固定表达“有眼”比“有眼睛”更凝练，也适合诗体。
- source_word: יִרְאוּ
  choice: 看见
  rationale: ראה 的基本义为“看见”；此处强调偶像虽有眼却无视觉能力。
theological_decisions:
- issue: 复数代词的所指
  choice: 用无生命事物代词“它们”，承接上文所说的偶像
  alternative: 采用更贴近希伯来语表层结构的“它们有口……它们有眼……”或省略代词
  rationale: 上下文明确在描写偶像。“它们”既自然承接所指，也避免把偶像人格化为“他们”，且未增添经文以外的解释。
- issue: וְלֹא 与未完成式所表达的无能力或不行动
  choice: 译为“不能说话……不能看见”
  alternative: 译为“不说话……不看见”
  rationale: 语境以讽刺方式指出偶像的器官没有功能；“不能”在现代汉语中更清楚地传达这种无能力，同时保持原文的对比张力。
translation_notes:
  register: 采用简洁、对称而庄重的现代汉语诗体。“有口……有眼……”保留原文平行结构；“说话／看见”清楚易懂。无需脚注。
