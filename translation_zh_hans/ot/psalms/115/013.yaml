source:
  edition: WLC
  text: יְ֭בָרֵךְ יִרְאֵ֣י יְהוָ֑ה הַ֝/קְּטַנִּ֗ים עִם הַ/גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/013.yaml
  text: He will bless those who fear Yahweh[a], the small together with the great.
translation:
  language: zh_hans
  text: 他必赐福给敬畏雅威的人，无论小的还是大的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “小的……大的”也可译作“卑微的……尊贵的”。希伯来文宽泛地对举较小者与较大者，很可能包括社会地位的高低，并不只是指体形大小。
    reason: 说明词义范围及可选译法，避免读者把这组对举仅理解为身体大小。
lexical_decisions:
- source_word: יְבָרֵךְ
  choice: 他必赐福
  rationale: 这是动词 ברך 的加强词干未完成式第三人称阳性单数；主语由上下文可知是上帝。“必赐福”自然表达诗中带有将来指向的确定应许，同时不把它改成祈愿语气。
- source_word: יִרְאֵי יְהוָה
  choice: 敬畏雅威的人
  rationale: 分词附属结构在句中作名词使用。“敬畏”兼顾畏惧与崇敬的含义，也符合现代汉语的经文语域。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为专名的性质，而不以称号代替。
- source_word: הַקְּטַנִּים
  choice: 小的
  rationale: 原词与“大的”相对，可泛指身份、地位、重要性等较低者，也可能保留更宽泛的意义；直译为“小的”可避免在正文中过早限定。
- source_word: עִם
  choice: 无论……还是……
  rationale: 原介词把两类人并列包括在内。汉语用“无论……还是……”自然传达两者都涵盖在赐福范围内。
- source_word: הַגְּדֹלִים
  choice: 大的
  rationale: 与“小的”形成对举，可能指较有地位、声望或重要性的人；“大的”保留原文概括性及平行结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的四字神名。采用较贴近学界通行重构读音的“雅威”，以专名呈现，不以“主”等称号替代。
- issue: יְבָרֵךְ 的语气
  choice: 确定陈述：“必赐福”
  alternative: 祈愿：“愿他赐福”
  rationale: 结合相邻经文反复出现的赐福保证，此处较适合作确定的陈述；但希伯来语未完成式本身可依语境承载不同情态。
- issue: “小的”和“大的”所指范围
  choice: 正文保留宽泛对举
  alternative: 明确译为“卑微的和尊贵的”
  rationale: 这组反义词很可能涵盖社会地位，却未明确局限于地位；保留宽泛表达可避免加入原文没有明说的社会分类。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他必赐福”简洁有力；“无论小的还是大的”有意保留希伯来诗歌的概括性对举，具体社会含义置于脚注说明。
