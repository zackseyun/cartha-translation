source:
  edition: WLC
  text: לֹ֣א הַ֭/מֵּתִים יְהַֽלְלוּ יָ֑הּ וְ֝/לֹ֗א כָּל יֹרְדֵ֥י דוּמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/017.yaml
  text: The dead do not praise Yah[b][a], nor do any who go down into silence.
translation:
  language: zh_hans
  text: 死人不赞美雅[a]；凡下到寂静[b]中的人，也不赞美他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”（Yah）是希伯来文神名的短形式；它不同于完整形式“耶和华”。
    reason: divine_name
  - marker: b
    text: “寂静”是对死亡状态或死亡领域的诗意表达；也有人理解为“坟墓”或“阴间”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֵּתִים
  choice: 死人
  rationale: 该词在这里名词化，泛指已经死去的人；“死人”是现代汉语中自然、直接的对应表达。
- source_word: יְהַלְלוּ
  choice: 不能赞美
  rationale: הלל 的 Piel 形式通常表示“赞美”。希伯来文以否定陈述表达死人不从事赞美；汉语用“不能赞美”可自然传达诗句所说的死亡状态，并与下半句衔接。
- source_word: יָהּ
  choice: 雅
  rationale: יָהּ 是神名的短形式，不等同于完整形式 יהוה；音译为“雅”可保留原文在诗歌中的特殊称呼，而不将其直接同化为“耶和华”或“主”。
- source_word: כָּל
  choice: 凡……的人，也不能
  rationale: כָּל 在否定结构中具有周遍、逐一排除的作用。汉语“凡……也不能”比生硬的“所有……不”更自然，同时保留“无一例外”的范围。
- source_word: יֹרְדֵי
  choice: 下到……中的人
  rationale: 该分词指那些下去的人；“下到……中的人”保留原文向下进入死亡领域的空间意象。
- source_word: דוּמָה
  choice: 寂静
  rationale: 该词表示寂静、无声，在本节中诗意地指向死亡的状态或领域。“寂静”保留隐喻，不在正文中把它限定为坟墓或阴间。
theological_decisions:
- issue: 本节是否是在教义上全面否认死后仍可赞美神，还是采用关于死亡寂静的诗歌语言
  choice: 保留原文直接而富有张力的诗句：“死人不能赞美雅；凡下到寂静中的人，也不能赞美他。”
  alternative: 在正文中明确解释为“坟墓里的死人不能赞美耶和华”或直接将“寂静”译作“阴间”
  rationale: 诗篇以死亡的寂静与活人的赞美形成对照。译文不应借此诗句替读者裁定有关死后状态的全部神学问题，也不应把诗歌隐喻缩窄为某一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“下到寂静中”刻意保留原文的空间意象和隐喻；下半句补出“赞美他”，使汉语句意完整清楚，但没有增加新的命题内容。
