  source_fidelity: 译文正确识别了本节为诗人对列国讥讽的反诘，并将הַגּוֹיִם译为“列国”、אֱלֹהֵיהֶם按上下文译为单数且大写指称的“上帝”，均符合原文。惟“容”在现代普通话中明显文言化且搭配生硬；改为“要让”能更自然地传达לָמָּה加未完成式所形成的“为什么竟让／为什么应让”的反诘。נָא在此带有“现在／如今”的即时性和讥讽强调，主文以“如今”较稳妥保留该成分。
