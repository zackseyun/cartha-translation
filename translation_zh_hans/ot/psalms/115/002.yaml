  yaml_path: translation/ot/psalms/115/002.yaml
  text: Why should the nations say[a], “Where now is their God?”
translation:
  language: zh_hans
  text: 为什么要让列国说：“他们的上帝如今在哪里？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么容
  rationale: 该词引出带有抗议意味的反问；结合未完成式 יֹאמְרוּ，译为“为什么容”自然表达“为何让这种事发生”的语气，同时不把它误解为单纯询问原因。
- source_word: יֹאמְרוּ
  choice: 说
  rationale: אמר 的 Qal 未完成式第三人称阳性复数；在反问中可表示可能发生或反复出现的讥讽，汉语用“说”即可自然涵盖。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 指以色列以外的各国或外族；“列国”直接、庄重，也避免带入后期语境中“外邦人”的特定色彩。
- source_word: אַיֵּה
  choice: 在哪里
  rationale: 地点疑问词；汉语以“在哪里”完整表达其谓语功能。
- source_word: נָא
  choice: 究竟
  rationale: 此处并非礼貌请求，而是加强追问和讥讽语气的语气词；“究竟”比时间性的“现在”更自然地传达其强调作用。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 虽 אֱלֹהִים 形式上为复数，此处带第三人称阳性复数后缀，按上下文指以色列所信的独一位上帝，故用单数“上帝”。
theological_decisions:
- issue: אֱלֹהֵיהֶם 的所指
  choice: 他们的上帝
  alternative: 他们的神
  rationale: 列国是在讥讽以色列，质问以色列的上帝在哪里或为何没有显明作为。译作“上帝”表明上下文中的特定所指，却不额外解释其隐而未现的原因。
- issue: לָמָּה 与未完成式 יֹאמְרוּ 的反问力度
  choice: 为什么容列国说
  alternative: 列国为什么说
  rationale: 上下文更可能是在向上帝抗议：为何让列国有机会如此讥讽，而不只是询问列国发言的原因；脚注保留后一个在语法上可行的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“容列国说”保留诗篇祈祷中向上帝提出抗议的张力；引语中的“究竟在哪里”呈现列国讥讽性的强调。
