source:
  edition: WLC
  text: כְּ֭מוֹ/הֶם יִהְי֣וּ עֹשֵׂי/הֶ֑ם כֹּ֭ל אֲשֶׁר בֹּטֵ֣חַ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/008.yaml
  text: Those who make them become like them[b][a], as does everyone who trusts in them.
translation:
  language: zh_hans
  text: 造这些偶像的人必像它们一样[a][b]；凡倚靠它们的人也必如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必变得像它们一样。”这里的希伯来语动词既可表示“是”，也可表示“成为”。
    reason: lexical_alternative
  - marker: b
    text: 即像上文所说的偶像一样：不能说、不能看、不能听，也无能为力。
    reason: cross_reference
lexical_decisions:
- source_word: כְּמוֹהֶם
  choice: 像它们一样
  rationale: 介词כְּ加第三人称复数后缀表示相似；“它们”承接上文的偶像，中文自然且保留比较关系。
- source_word: יִהְיוּ
  choice: 必像……一样
  rationale: היה既可表示“是”，也可在比较谓语中带有“成为”的意味。正文采用“必像……一样”，不强行排除状态或结果之意，并以脚注说明另一种自然译法。
- source_word: עֹשֵׂיהֶם
  choice: 造这些偶像的人
  rationale: עשה的分词加第三人称复数后缀，指制作它们的人；为避免中文代词所指不明，明示为“这些偶像”。
- source_word: כֹּל אֲשֶׁר
  choice: 凡……的人
  rationale: 准确表达“所有……者”的普遍范围，也符合庄重而自然的现代汉语。
- source_word: בֹטֵחַ בָהֶם
  choice: 倚靠它们
  rationale: בטח加ב表示信赖、倚仗某对象；“倚靠”保留宗教语境中的信赖与依赖意味。
theological_decisions:
- issue: 人与偶像相像的性质
  choice: 正文只陈述制造并倚靠偶像的人将与偶像相像，不具体界定这种相像的全部层面。
  alternative: 明确译为他们会变得在属灵上麻木、无能，或在道德上像偶像。
  rationale: 本节只说“像它们”，具体图景由前文偶像不能说、不能看、不能听等描述提供；不应把未明说的机制或完整神学解释加入正文。
- issue: יִהְיוּ表达状态还是结果
  choice: 正文译作“必像……一样”，保留“将是/将成为”的张力。
  alternative: 译作“必变得像它们一样”或“也和它们一样”。
  rationale: 希伯来语היה在此可理解为存在状态，也可带结果意味；避免在正文中过度锁定其中一种。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“造这些偶像的人”清楚交代代词所指；后半句以“也必如此”自然对应前句，并保留原文对所有倚靠偶像之人的概括。
