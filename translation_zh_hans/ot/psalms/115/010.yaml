source:
  edition: WLC
  text: בֵּ֣ית אַ֭הֲרֹן בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/010.yaml
  text: O house of Aaron[a], trust in Yahweh[b]; he is their help and their shield.
translation:
  language: zh_hans
  text: 亚伦家啊，你们要信靠雅威[a]；他是他们[b]的帮助，是他们的盾牌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יְהוָה 的音译，传统上也译作“耶和华”。
    reason: divine_name
  - marker: b
    text: 原文在“你们要信靠”之后转用第三人称“他们的帮助……他们的盾牌”。
    reason: grammatical_shift
lexical_decisions:
- source_word: בֵּית אַהֲרֹן
  choice: 亚伦家
  rationale: 保留希伯来语“亚伦之家”的集体称谓，指亚伦所属的祭司家族，也维持本诗相邻经文的平行结构。
- source_word: בִּטְחוּ
  choice: 你们要信靠
  rationale: 这是复数祈使式；“你们要信靠”在现代汉语中明确表达对群体的劝勉。
- source_word: בַיהוָה
  choice: 信靠雅威
  rationale: 介词 ב 标明信靠的对象；将四字神名 יְהוָה 音译为“雅威”，以保留其专名性质。
- source_word: עֶזְרָם
  choice: 他们的帮助
  rationale: עֵזֶר 加第三人称阳性复数后缀，直译为“他们的帮助”；不改成第二人称，以保留原文的人称转换。
- source_word: וּמָגִנָּם
  choice: 他们的盾牌
  rationale: מָגֵן 的本义是“盾牌”；保留诗篇中具体而常见的保护意象。
- source_word: הוּא
  choice: 他是
  rationale: 独立代词在无系词句中带有强调作用；汉语补出“是”，但不添加原文没有的“唯独”等排他含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；正文采用“雅威”以呈现其作为专名的性质，脚注列出中文读者熟悉的传统译名。
- issue: 命令对象与陈述对象之间的人称转换
  choice: 保留“你们”到“他们”的转换
  alternative: 统一译作“你们……你们的帮助……你们的盾牌”
  rationale: 希伯来文先用第二人称复数祈使式，随后用第三人称复数所有格后缀。保留转换可忠实呈现原文的语法张力，不将其静默协调。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“亚伦家啊”保留诗歌中的呼告语气；分号呈现劝勉与随后宣告之间的结构。保留原文第二人称到第三人称的转换，并以脚注帮助读者理解。
