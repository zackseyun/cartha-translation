id: PSA.20.5
reference: Psalms 20:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נְרַנְּנָ֤ה בִּ֘/ישׁ֤וּעָתֶ֗/ךָ וּ/בְ/שֵֽׁם אֱלֹהֵ֥י/נוּ נִדְגֹּ֑ל יְמַלֵּ֥א יְ֝הוָ֗ה כָּל מִשְׁאֲלוֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/005.yaml
  text: We will shout for joy in your salvation[a], and in the name of our God we will raise our banners[c][b]. May Yahweh fulfill all your requests.
translation:
  language: zh_hans
  text: 我们要因你的拯救[a]欢呼，奉我们上帝的名竖起旌旗[b]。愿耶和华成全你一切所求的[c]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因你的胜利”，或“因你得蒙解救”。希伯来语这个词含义较广，可指拯救、解救，也可指战争中的胜利。
    reason: lexical_alternative
  - marker: b
    text: 或译“立起我们的旗帜”。希伯来语动词很可能描绘在庆贺中举起或展示旗帜。
    reason: lexical_alternative
  - marker: c
    text: 末句也可译作“耶和华必成全你一切所求的”。希伯来语形式既可理解为祝愿，也可理解为将来的陈述；本诗的祈求语境较支持祝愿。
    reason: alternative_reading
lexical_decisions:
- source_word: נְרַנְּנָה
  choice: 我们要……欢呼
  rationale: 该词为 רנן 的第一人称复数鼓励式/未完成式，表达共同的喜乐欢呼；“欢呼”保留其高声庆贺的意味，同时不把动作限定为歌唱。
- source_word: בִּישׁוּעָתֶךָ
  choice: 因你的拯救
  rationale: יְשׁוּעָה 可指拯救、解救或胜利。此处君王和战争语境容许“胜利”，但“拯救”保留较宽的语义范围；介词 ב 在汉语中按语境自然译作“因”。
- source_word: וּבְשֵׁם אֱלֹהֵינוּ
  choice: 奉我们上帝的名
  rationale: “奉……的名”是自然、庄重的现代汉语表达，体现凭借上帝的权柄、归属于他并以他为夸耀的含义。
- source_word: נִדְגֹּל
  choice: 竖起旌旗
  rationale: 该动词很可能描绘举起或展示旗帜；“竖起旌旗”保留具体的庆胜意象，也符合诗歌语体。
- source_word: יְמַלֵּא
  choice: 愿……成全
  rationale: 该未完成式在本诗祈求语境中最自然地表达祝愿；“成全”与“所求的”搭配自然，也体现使所求完全实现之意。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，而不以称号代替。
- source_word: כָּל מִשְׁאֲלוֹתֶיךָ
  choice: 你一切所求的
  rationale: מִשְׁאֲלוֹת 指所请求之事；“一切所求的”简洁自然，并保留祈求语境。
theological_decisions:
- issue: 君王争战语境中 יְשׁוּעָה 的含义
  choice: 拯救
  alternative: 胜利；解救
  rationale: 上下文确实涉及君王得胜，但原词意义比军事胜利更宽。“拯救”既可涵盖战场上的搭救与胜利，也避免把经文过度收窄。
- issue: 末句 יְמַלֵּא 的语气
  choice: 祝愿/祈求：“愿耶和华成全”
  alternative: 将来陈述：“耶和华必成全”
  rationale: 形态上可作未完成式陈述，但在本诗连续的代祷与祝福语境中，祈愿语气更为自然；脚注保留另一种可能。
- issue: 神名 יהוה 的呈现
  choice: 耶和华
  alternative: 雅威；以“上主”代称
  rationale: 正文明确呈现专名，并采用现代简体中文圣经传统中最广为人知的形式；不以普通称号抹去原文的专名性质。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“欢呼”传达集体庆贺，以“旌旗”保留诗歌和战争庆胜意象；句末感叹号体现祝愿与欢庆语气。所有脚注标记均置于对应正文词句之后。
