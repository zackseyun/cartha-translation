base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/002.yaml
  text: May he send you help from the sanctuary and sustain you from Zion[a][b].
translation:
  language: zh_hans
  text: 愿他从圣所[a]给你送来帮助，从锡安扶持你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”原文也可译作“圣地”；字面上也有“圣洁”的意思。此处与“锡安”平行，很可能指上帝的圣所。
    reason: lexical_alternative
  - marker: b
    text: “扶持”也可译作“支持”或“托住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: 愿他……送来
  rationale: 这是שׁלח的Qal未完成式第三人称阳性单数。结合本诗祝祷、祈愿的语境，用“愿他”表达祈愿语气，而不直译为一般将来时。
- source_word: עֶזְרְךָ
  choice: 给你……帮助
  rationale: עֵזֶר带第二人称阳性单数后缀，可指“你的帮助”或“给你的帮助”。“给你送来帮助”符合现代汉语习惯，也保留帮助的受益者。
- source_word: מִקֹּדֶשׁ
  choice: 从圣所
  rationale: קֹדֶשׁ既可抽象地指“圣洁”，也可具体指“圣地、圣所”。这里与“从锡安”平行，地点义最自然，可能指上帝的圣所。
- source_word: וּמִצִּיּוֹן
  choice: 从锡安
  rationale: 保留地名“锡安”。连接词与前半句构成同义平行；汉语以逗号衔接即可自然表达。
- source_word: יִסְעָדֶךָּ
  choice: 扶持你
  rationale: סעד的Qal未完成式第三人称阳性单数加第二人称阳性单数后缀，可意为“扶持、支持、托住”。“扶持你”兼顾诗歌语体与现代可读性，并与前句同样表达祈愿。
theological_decisions:
- issue: 隐含主语所指
  choice: 保留“他”，由上下文理解为耶和华
  alternative: 在本节明说“耶和华”或“上帝”
  rationale: 希伯来文本本节只有第三人称阳性单数动词，没有明说主语。保留代词可避免添加原文在本行未出现的神名，同时维持与上文的衔接。
- issue: “圣所”与“锡安”的关系
  choice: 保留两个平行地点表达，不具体断定为天上居所或耶路撒冷圣殿
  alternative: 把“圣所”明确解释为耶路撒冷圣殿，或把它解释为天上的圣所
  rationale: 原文的同义平行显示二者密切相关，却没有在本节明确限定“圣所”的具体所指；译文不替文本消除这一空间与神学上的开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿他”保留诗篇祝祷语气；“给你送来帮助”避免生硬的“差遣帮助”，同时贴近原文“送出、送来”的动作意象。
