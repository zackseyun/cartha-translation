  text: These trust in chariots and those in horses, but we call on the name of the LORD our God.
translation:
  language: zh_hans
  text: 有人倚靠战车，有人倚靠战马；我们却称念耶和华我们上帝的名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בָרֶכֶב וְאֵלֶּה בַסּוּסִים
  choice: 有人靠战车，有人靠战马
  rationale: 原文是省略谓语的对称结构，直译近似“这些在战车中，那些在马匹中”。结合上下文，中文补出“靠”，自然表达倚仗军事力量的含义，同时保留两组人的对照。
- source_word: נַזְכִּיר
  choice: 求告
  rationale: 该词为זכר的使役式，在此可表达提说、称念或呼求上帝之名。“求告”符合诗篇中倚靠上帝的语境，但以脚注保留其词义幅度。
- source_word: בְּשֵׁם יְהוָה אֱלֹהֵינוּ
  choice: 耶和华我们上帝的名
  rationale: 保留“名”这一重要的原文意象；将四字神名按现代中文圣经通行传统译为“耶和华”，אֱלֹהֵינוּ译为“我们上帝”。
theological_decisions:
- issue: 人与军事力量及上帝之名的对照
  choice: 用“靠”与“求告”呈现两种倚赖对象的对比
  alternative: 将两处都译作“夸耀”
  rationale: 原文前半句没有明写动词，后半句נַזְכִּיר也不等同于通常表示“夸耀”的词。当前译法传达语境中的信靠对比，而不把同一个补入的概念强加给全句。
- issue: 神名的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: “耶和华”是简体中文普通读者熟悉的专名形式，能使专名יהוה与称号“上帝”保持区分；不借此加入宗派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以“有人……有人……我们却……”重现希伯来诗句的平行与转折。“战马”比单说“马”更清楚地呈现军事语境。
