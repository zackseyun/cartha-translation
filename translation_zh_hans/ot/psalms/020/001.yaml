id: PSA.20.1
reference: Psalms 20:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/001.yaml
  text: May Yahweh answer you in the day of trouble[a]; may the name of the God of Jacob protect you.
translation:
  language: zh_hans
  text: 愿雅威在患难之日应允你；愿雅各之上帝的名把你安置在高处，使你安稳[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“保护你。”原文动词描绘把人安置在敌害无法触及的高处，因而得到安全。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ
  choice: 愿……应允你
  rationale: ענה在此表示“回答、回应”；结合诗篇中祝祷的语境，以“愿”表达未完成式的祈愿语气，“应允”也自然传达对祷告的回应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: בְּיוֹם צָרָה
  choice: 在患难之日
  rationale: 保留原文“日”的时间意象；“患难”涵盖צָרָה所表达的困境与危急，且符合庄重的诗歌语体。
- source_word: יְשַׂגֶּבְךָ
  choice: 把你安置在高处，使你安稳
  rationale: שׂגב的加强词干描绘把人置于难以触及的高处，从而使其安全；译文兼顾空间隐喻及其保护含义，避免只译作较扁平的“保护”。
- source_word: שֵׁם
  choice: 名
  rationale: 保留原文的“名”，不将其化约为名声、权柄或临在，因为这一表达兼具诗意与神学分量。
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: 雅各之上帝
  rationale: 直译其组合结构，并保留这一称谓的历史与盟约意味。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留专名，不用称号替代，也不采用较晚形成的混合读音。
- issue: 两个动词形式在祝祷语境中的语气
  choice: 以“愿……”表达祈愿语气
  alternative: 直陈将来式：“雅威必应允你……必保护你”
  rationale: 本节处于群体祝祷或祈求的语境，未完成式在此宜理解为祈愿，而非无条件的未来预测。
- issue: “雅各之上帝的名”如何施行保护
  choice: 保留“名”为主语及置于高处的隐喻
  alternative: 解释为“雅各的上帝凭他的权能保护你”
  rationale: 原文让“名”作主语，并使用置于高处、使人不可侵犯的图像；不把这两层表达改写成解释性神学陈述。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以“患难之日”保留希伯来文意象；第二分句略作展开，使现代读者既能看见“置于高处”的隐喻，也能理解其安全、保护的含义。脚注标记已置于对应正文之后。
