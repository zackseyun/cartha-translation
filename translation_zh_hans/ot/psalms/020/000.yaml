lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题注中通常是给负责音乐演奏者的指示；“乐长”简洁庄重，也比泛指的“领袖”更准确地保留音乐职分。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 该名词指用于歌唱或配乐的诗歌；在诗篇题注中译作“诗”自然，并符合现代中文圣经语体。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 前置词 לְ 在题注中可表达作者、归属、关联或献呈；“大卫的”保留一定幅度的原文歧义，不武断限定为大卫所作。
theological_decisions:
- issue: 大卫题注的语义
  choice: 大卫的
  alternative: 大卫所作；献给大卫
  rationale: 希伯来语 לְדָוִד 本身不能强制确定作者身份或献呈关系，因此正文采用较宽泛的属格表达，并在脚注中说明其他可能。
translation_notes:
  register: 采用现代、简洁而庄重的诗篇题注体。“交给乐长”清楚表达题注的指向；脚注标记紧随“大卫的诗”，对应其所解释的 לְדָוִד。
