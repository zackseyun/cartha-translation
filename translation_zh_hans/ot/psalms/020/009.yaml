  text: יְהוָ֥ה הוֹשִׁ֑יעָ/ה הַ֝/מֶּ֗לֶךְ יַעֲנֵ֥/נוּ בְ/יוֹם קָרְאֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/009.yaml
  text: O Yahweh[a], save! May the King answer us in the day we call.
translation:
  language: zh_hans
  text: 耶和华啊，求你拯救！愿王在我们呼求的日子应允我们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华啊，求你拯救王；在我们呼求的日子，求你应允我们。”也可能译作：“耶和华啊，求你拯救！王在我们呼求的日子应允我们。”希伯来文句法简练，“王”与前后分句的关系可有不同理解。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语中通行的神圣名字音译“耶和华”，使其与普通称号“主”有所区别，并保留原文专名的性质。
- source_word: הוֹשִׁיעָה
  choice: 求你拯救！
  rationale: 这是直接祈求中的命令式；“求你拯救”在现代汉语祷告语体中自然庄重，并保留救援、解救及得胜的宽泛含义。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文是带冠词的普通名词“王”。中文不以大小写区分称号与专名，因此用“王”，不在正文中强行判定所指是人间君王还是上帝。
- source_word: יַעֲנֵנוּ
  choice: 愿……应允我们
  rationale: 未完成式在祈祷语境中可表达愿望或祈求。“愿……应允我们”保留这种语气；“应允”也符合向上帝祈求的诗歌语域。
- source_word: בְיוֹם
  choice: 在……的日子
  rationale: 较贴近原文的时间表达，并保留诗体的庄重节奏；现代汉语虽可简化为“当……时”，但会弱化原文意象。
- source_word: קָרְאֵנוּ
  choice: 我们呼求
  rationale: קרא 的基本义是“呼叫、呼求”；在祷告语境中，“呼求”自然且明确，又不额外加入原文未明说的强烈情绪。
theological_decisions:
- issue: “王”在本节中的所指及句法角色
  choice: 正文把“王”理解为“应允我们”的主语；在王室诗篇的语境中，可首先指人间君王，但不借中文措辞排除其指向上帝的可能。
  alternative: 也可断句理解为“耶和华啊，求你拯救王；在我们呼求的日子，求你应允我们”，或理解为“耶和华啊，求你拯救！王在我们呼求的日子应允我们”。
  rationale: 希伯来文句法高度压缩，动词语气和“王”的归属存在真实歧义。正文采取与马所拉停顿及祈求式平行较协调的读法，同时用脚注保留其他重要读法，不把神学张力暗中消解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌与祷告语体。“在我们呼求的日子”有意保留希伯来文的时间习语；脚注标记置于整节末尾，因为注释涉及全句句法，而不只涉及“耶和华”一词。
