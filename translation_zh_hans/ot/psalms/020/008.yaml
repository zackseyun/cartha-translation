base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/008.yaml
  text: They have bowed down and fallen[a], but we have risen and stand upright.
translation:
  language: zh_hans
  text: 他们屈膝倒下，我们却起来，站立得稳。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “站立得稳”或译“得以坚立”“重新振作”或“站立稳固”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: 他们
  rationale: 独立的第三人称复数代词带有强调作用，并与后面的“我们”形成鲜明对比；汉语用“他们”即可自然表达。
- source_word: כָּרְעוּ
  choice: 屈膝
  rationale: 该动词表示弯膝、跪下或身体下沉；“屈膝”保留了具体的身体意象，也能与“倒下”构成递进。
- source_word: וְנָפָלוּ
  choice: 倒下
  rationale: 直接表达坠落、倒下之意，并保持与前一动词的诗歌平行和动作进展。
- source_word: וַאֲנַחְנוּ
  choice: 我们却
  rationale: 连接词字面可译“而／和”，但上下句的“他们—我们”构成强烈反差，因此用“却”自然传达转折。
- source_word: קַּמְנוּ
  choice: 起来
  rationale: קום意为起来或站起；“起来”直接对应敌方“倒下”的意象，同时为末句的稳立作铺垫。
- source_word: וַנִּתְעוֹדָד
  choice: 站立得稳
  rationale: 这个较少见的反身形动词可表达重新挺立、得以坚固或振作起来；“站立得稳”兼顾身体恢复与稳固不动的含义，同时在脚注中保留其他合理理解。
theological_decisions: []
