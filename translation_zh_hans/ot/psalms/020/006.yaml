  text: עַתָּ֤ה יָדַ֗עְתִּי כִּ֤י הוֹשִׁ֥יעַ יְהוָ֗ה מְשִׁ֫יח֥/וֹ יַ֭עֲנֵ/הוּ מִ/שְּׁמֵ֣י קָדְשׁ֑/וֹ בִּ֝/גְבֻר֗וֹת יֵ֣שַׁע יְמִינֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/006.yaml
  text: I know that the LORD saves his anointed; he answers him from his holy heaven with the mighty saving deeds of his right hand.
translation:
  language: zh_hans
  text: 如今我知道，耶和华拯救他的受膏者；他必从自己的圣天应允他，用右手的大能施行拯救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: 如今
  rationale: 这是明确的时间副词，保留“现在、如今”的推进意味；中文诗体中“如今”比“现在”更庄重自然。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 完成式在此表达已经确知的状态；“我知道”自然简洁，也不额外限定获知过程。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的专名形式，以区别于普通称谓“主”。
- source_word: הוֹשִׁיעַ
  choice: 拯救
  rationale: 使役词干在此具有“使得救、施行拯救”之义；“拯救”准确且符合诗篇语域。
- source_word: מְשִׁיחוֹ
  choice: 他的受膏者
  rationale: 保留名词的基本含义及第三人称所有关系，不在本节中径直专名化为“弥赛亚”。
- source_word: יַעֲנֵהוּ
  choice: 他必……应允他
  rationale: 未完成式在此可表达确信将发生的行动；“应允”契合祷告蒙回应的语境，同时保留主语与宾语均为第三人称的结构。
- source_word: מִשְּׁמֵי קָדְשׁוֹ
  choice: 从自己的圣天之上
  rationale: 直译其复数形式与所有关系；希伯来语“诸天”在中文中自然表达为“天”，“圣天”保留其神圣居所含义。
- source_word: בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ
  choice: 以右手施展拯救的大能
  rationale: 将复数“强力、英勇作为”概括为“大能”，并保留工具性的介词、拯救含义和“右手”意象；“施展”使中文关系清楚而不把它收窄为某一具体神迹。
theological_decisions:
- issue: “受膏者”是否直接译作“弥赛亚”或“君王”
  choice: 他的受膏者
  alternative: 他的弥赛亚／他所膏立的君王
  rationale: 原文 מָשִׁיחַ 是普通名词并带所有后缀；诗篇语境可能首先指受膏君王，同时具有更广的神学回响。译为“受膏者”可保留这种张力，不预先限定指涉。
- issue: יַעֲנֵהוּ 的时态与语气
  choice: 他必……应允他
  alternative: 他……应允他／愿他应允他
  rationale: 本句以“我知道”表达确信，未完成式最自然地指向将来的确定回应；译作“必”呈现这一确信，但不把它解释成与上下文无关的普遍命题。
- issue: “右手”的施救能力是能力还是具体作为
  choice: 拯救的大能
  alternative: 大能的拯救作为
  rationale: גְבֻרוֹת 是复数，可指强大能力或大能作为。正文采用自然中文“大能”，但用“施展”保留其付诸行动的意味，避免过度区分两者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保持希伯来诗句的两个分句及神学意象。明确译出 עַתָּה 为“如今”；用“圣天”而非扩写为“圣所”，并保留“右手”这一拟人化意象。
