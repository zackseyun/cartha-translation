  yaml_path: translation/ot/psalms/020/004.yaml
  text: May he grant you according to your heart[a], and fulfill all your counsel.
translation:
  language: zh_hans
  text: 愿他照你的心愿赐给你，并成全你一切的谋划[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你一切的计划实现。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: 愿他……赐给你
  rationale: נתן基本义为“给、赐”。本诗语境是一连串祈愿，故以“愿”表达祈愿语气，并用庄重自然的“赐给”。
- source_word: לְךָ
  choice: 给你
  rationale: 保留希伯来语的间接受词关系；与“赐”搭配，在现代汉语中自然清楚。
- source_word: כִלְבָבֶךָ
  choice: 照你的心愿
  rationale: כ表示“照、按照”，לֵבָב在此涉及内心的愿望、意向。“心愿”既保留“心”的意象，又避免“照你的心”在现代汉语中的含混。
- source_word: וְכָל
  choice: 并……一切
  rationale: וְ连接两个并列祈愿，以“并”自然衔接；כָּל修饰集合意义的“谋划”，译作“一切”。
- source_word: עֲצָתְךָ
  choice: 你的谋划
  rationale: עֵצָה可指商议、计谋、计划或谋定之事。此处“谋划”保留审慎筹议的意味，也适合诗篇可能涉及君王或军事行动的语境。
- source_word: יְמַלֵּא
  choice: 成全
  rationale: מלא的Piel形式在此指使之完全实现。“成全”简洁表达使谋划得以实现，而非字面译为“充满”。
theological_decisions:
- issue: 祈愿语境中两个未完成式动词的语气
  choice: 将两个动词都译为祈愿：“愿他……赐给你，并成全……”
  alternative: 译为陈述将来：“他必……赐给你，并成全……”
  rationale: 虽然两词在形态上都是未完成式，但诗篇20篇上下文是一系列代求和祝愿，因此祈愿式更符合其礼仪和祷告语气，同时不把祝愿强化为无条件预言。
- issue: “心”在本节中的含义
  choice: 译作“心愿”，表达内在愿望或意向，并保留“心”的意象
  alternative: 译作“愿望”或“意志”
  rationale: 希伯来语“心”可涵盖愿望、意向和意志。中文“心愿”在本句中自然，又未将其窄化为纯情感或纯理性活动。
- issue: עֵצָה的语义范围
  choice: 正文译“谋划”，脚注保留“计划”这一可能译法
  alternative: 正文译“计划”或“主意”
  rationale: “谋划”体现该词所含的商议、筹算意味；“计划”则更通俗且同样符合语境，故以脚注保存这一词义选择，而不作神学化解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“愿他”保持诗歌祈愿语气；“照你的心愿”自然传达希伯来语表达；“谋划”略具诗体和审慎筹算色彩。脚注标记置于全句之后，因为脚注给出后半句整体的通顺替代译法。
