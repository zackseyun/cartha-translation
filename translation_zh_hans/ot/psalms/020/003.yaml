  yaml_path: translation/ot/psalms/020/003.yaml
  text: May he remember all your offerings and accept your burnt offering[b][a]. Selah
translation:
  language: zh_hans
  text: 愿他记念你一切的供物[a]，悦纳你的燔祭[b]。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你一切的素祭”。希伯来语מִנְחָה既可专指素祭，也可较广泛地指供物或礼物。
    reason: lexical_alternative
  - marker: b
    text: “悦纳”字面可作“使之肥美”或“看为丰厚”；在这里是表示神悦纳祭物的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכֹּר
  choice: 愿他记念
  rationale: 该词是זכר的Qal未完成式第三人称阳性单数，在祝祷语境中表达祈愿；“愿他记念”既保留祈愿语气，也符合庄重自然的现代汉语。
- source_word: כָּל
  choice: 一切
  rationale: 保留希伯来语数量词的完整涵盖意味，与“供物”搭配自然。
- source_word: מִנְחֹתֶךָ
  choice: 你一切的供物
  rationale: מִנְחָה既可泛指礼物或供物，也可专指素祭；正文采用较宽泛的“供物”，避免在原文可能含混之处过度限定，专门含义在脚注说明。
- source_word: וְעוֹלָתְךָ
  choice: 你的燔祭
  rationale: עוֹלָה是献祭术语，通常指全部焚烧的祭物；“燔祭”是简明、准确且通行的中文表达。
- source_word: יְדַשְּׁנֶה
  choice: 悦纳
  rationale: דשן的Piel形式字面涉及“使肥美”或“看为丰厚”，在献祭语境中是有利地接受祭物的习语；“悦纳”准确传达此处含义，并保留神对祭物表示认可的语气。
- source_word: סֶלָה
  choice: （细拉）
  rationale: 此术语的确切功能不明，采用传统音译而不武断解释；括号标示其可能属于礼仪或音乐提示。
theological_decisions:
- issue: 本节两个第三人称阳性单数动词的主语
  choice: 依上下文将隐含主语表达为“他”，所指为神。
  alternative: 完全不补出主语，只保留隐含的施事者。
  rationale: 希伯来语本节没有明说主语，但诗篇20篇的祝祷语境清楚指向神；现代汉语需要显出主语，“他”既使句意自然，也不增添原文以外的神学断言。
- issue: יְדַשְּׁנֶה的祭祀意象
  choice: 正文译作“悦纳”，脚注保留“看为肥美、丰厚”的字面意象。
  alternative: 正文直译为“使你的燔祭肥美”或“看你的燔祭为丰厚”。
  rationale: 直译在现代汉语中容易被误解为改变祭物的物理状态；“悦纳”传达献祭蒙神认可的语境意义，同时由脚注保存原文隐喻。
translation_notes:
  register: 采用现代、庄重而易懂的祝祷语体。“记念”保留圣经语境中不只是回想、也含顾念并采取行动的意味；“供物”“燔祭”“细拉”保留必要的祭祀与诗歌术语。所有脚注标记均置于正文对应词语之后。
