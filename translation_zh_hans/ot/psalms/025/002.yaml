id: PSA.25.2
reference: Psalms 25:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱֽלֹהַ֗/י בְּ/ךָ֣ בָ֭טַחְתִּי אַל אֵב֑וֹשָׁה אַל יַֽעַלְצ֖וּ אֹיְבַ֣/י לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/002.yaml
  text: My God[a], in you I trust; do not let me be put to shame[b]; do not let my enemies exult over me.
translation:
  language: zh_hans
  text: 我的上帝，我信靠你；不要让我蒙羞[a]，不要让我的仇敌因我而欢欣得意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要让我羞愧。”希伯来语动词既可指内心感到羞愧，也可指公开蒙羞、受辱。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不要让我的仇敌胜过我而欢喜”，或“不要让我的仇敌对我幸灾乐祸。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 名词带第一人称单数后缀，意为“我的上帝”；保留直接呼告，不另加原文没有明示的感叹词。
- source_word: בְּךָ
  choice: 你
  rationale: 介词 בְּ 与“信靠”连用，标明信靠的对象；现代汉语通常直接说“信靠你”，无需逐字译出介词。
- source_word: בָטַחְתִּי
  choice: 我信靠
  rationale: Qal完成式第一人称单数在此表达已经确立并持续至今的信赖；用现代汉语现在时自然传达坚定、持续的倚靠。
- source_word: אַל אֵבוֹשָׁה
  choice: 不要让我蒙羞
  rationale: אַל 引出祈求性的否定；בושׁ既可指内心羞愧，也可指在他人面前受辱。上下文提到仇敌，正文采用兼具公开受辱意味的“蒙羞”。
- source_word: אַל יַעַלְצוּ
  choice: 不要让……欢欣得意
  rationale: עלץ表示强烈、洋洋自得的欢喜；“欢欣得意”保留诗歌语气，并体现仇敌幸灾乐祸的色彩，而不直接把它解释成军事上的得胜。
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: 名词带第一人称单数后缀，直译为“我的仇敌”，准确而自然。
- source_word: לִי
  choice: 因我而
  rationale: 在欢喜类动词之后，לִי指仇敌以诗人的遭遇为欢喜得意的缘由；“因我而”保留关系的概括性，脚注列出更具解释性的译法。
theological_decisions:
- issue: 诗人所求免受的“羞耻”是内在感受还是公开受辱
  choice: 不要让我蒙羞
  alternative: 不要让我羞愧
  rationale: 仇敌在场的语境偏向公开受辱和盼望获得伸冤，但希伯来词也可指内心羞愧；正文采用“蒙羞”，脚注保留另一可能，避免把语义完全限定为主观情绪。
- issue: 仇敌的欢喜是否明确表示他们已经得胜
  choice: 因我而欢欣得意
  alternative: 胜过我而欢喜／对我幸灾乐祸
  rationale: 原文动词表示强烈欢喜，介词短语指向诗人，却没有明说仇敌以何种方式得胜；因此正文不补入具体的胜利情景，同时传达敌意的得意。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“我的上帝”保留直接呼告；分号呈现信靠宣告与两个祈求之间的诗行推进。正文中的脚注标记与各自所解释的词语紧邻。
