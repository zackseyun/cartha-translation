  yaml_path: translation/ot/psalms/025/010.yaml
  text: All the paths of Yahweh are steadfast love and faithfulness to those who keep his covenant and his testimonies[a][b].
translation:
  language: zh_hans
  text: 雅威的一切道路，对于[b]遵守他的约和他的法度的人，都是慈爱和信实[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信实”或译“真实”。在“慈爱和信实”这一盟约性搭配中，希伯来词通常侧重可靠、忠贞，而不只是抽象的真理。
    reason: lexical_alternative
  - marker: b
    text: “对于”也可译作“向”或“为”；这里的希伯来介词可表示关系指向或受益关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָרְחוֹת
  choice: 一切道路
  rationale: 保留“道路”的比喻意象，并以“一切”表达总括范围。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留希伯来文中的上帝专名，不以称号替代。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: “慈爱”在诗篇语境中自然地表达带有恩慈、忠贞和盟约色彩的爱。
- source_word: אֱמֶת
  choice: 信实
  rationale: 与“慈爱”并列时，重点在可靠、忠诚，而不只是抽象意义上的“真理”。
- source_word: לְנֹצְרֵי
  choice: 对于遵守……的人
  rationale: נצר含有谨慎持守之意；“遵守”符合现代汉语习惯，לְ在此译作“对于”，表达关系指向。
- source_word: בְרִיתוֹ
  choice: 他的约
  rationale: “约”是圣经盟约语境中准确、简洁的常用译法。
- source_word: וְעֵדֹתָיו
  choice: 和法度
  rationale: עֵדוֹת在诗篇中常指上帝所颁布、作为见证的规范；“法度”既保留律法语域，又符合汉语诗篇用语。
theological_decisions:
- issue: “道路”与“慈爱和信实”的谓语关系
  choice: 译作“一切道路……都是慈爱和信实的”
  alternative: “一切道路都通向慈爱和信实”或“一切作为都彰显慈爱和信实”
  rationale: 希伯来文无动词句最自然地把“慈爱和信实”述说为雅威一切道路的性质；直译式结构保留原文张力，避免增添“通向”或“彰显”等解释。
- issue: “对于遵守他约和法度的人”的限定作用
  choice: 保留为关系短语，不进一步说明其教义含义
  alternative: 明确解释为只有守约者才能得到慈爱，或解释为上帝的属性取决于人的顺服
  rationale: 原文指出雅威的道路与守约者之间的盟约性关系，却没有展开其与普遍神性或人的功德之间的系统关系，因此不作额外推论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“雅威”保留神名；“慈爱、信实、约、法度”保持诗篇的盟约与律法语域。句式略带诗性，同时避免古奥表达。
