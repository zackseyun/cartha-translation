  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/001.yaml
  text: Of David. To you[a], O Yahweh, I lift up my soul.
translation:
  language: zh_hans
  text: 大卫的。[b] 耶和华啊，我向你举起我的生命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我向你举起我的灵魂。”希伯来词“灵魂”也可指“生命”“自己”或整个人，并不只指非物质的一部分。
    reason: 说明 נֶפֶשׁ 的词义范围，并保留“举起”的原文意象。
  - marker: b
    text: “大卫的”也可理解为“为大卫”或“与大卫有关”；原文未说明其具体关系。
    reason: 保留诗篇标题中 לְדָוִד 的归属、作者或献呈等歧义，避免限定为“大卫所作”。
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 介词 לְ 加人名用于诗篇标题时可表示作者、归属、献给或关联。“大卫的诗”是汉语诗篇标题中自然而庄重的表达，但“诗”在希伯来原文中为补出成分，具体关联仍不完全确定。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: אֶל 加第二人称阳性单数后缀表示“向你、到你那里”，与“仰望”搭配自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接以现代中文通行的专名“耶和华”译出四字神名，不以称号替代。
- source_word: נַפְשִׁי
  choice: 我（融入“我向你仰望”）
  rationale: נֶפֶשׁ 可指灵魂、生命、自我或整个人；“举起我的נפשׁ”是把整个人转向并信靠上帝的希伯来习语。正文采用自然汉语“我向你仰望”，脚注保留字面意象及词义范围。
- source_word: אֶשָּׂא
  choice: 仰望
  rationale: נָשָׂא 字面为“举起”。在“向某位举起我的נפשׁ”这一习语中，“仰望”自然传达转向、寄望和信靠，同时脚注说明其字面形式，避免隐藏原文意象。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。正文保留中文读者最熟悉的专名形式“耶和华”，不以“主”等称号替代；“雅威”是学界常见的另一拟音。
- issue: “举起我的灵魂”所表达的人观与祷告动作
  choice: 我向你仰望
  alternative: 我向你举起我的心灵／灵魂
  rationale: נֶפֶשׁ 不必专指与身体分离的非物质部分，也可代表生命、自我或整个人。译为“仰望”避免把经文限定为某种二分式人观，同时脚注保存字面措辞和可能含义。
translation_notes:
  register: 采用现代、庄重且适合祷告诗的汉语。“耶和华啊”保留直接呼告；“我向你仰望”简洁自然。脚注标记置于整句之后，涵盖该习语。
