- from: '我的眼目时常仰望雅威，

    因为他必把我的脚从网罗中拉出来。[a]'
  to: '我的眼目常常仰望雅威，

    因为他必把我的脚从网罗中带出来。[a]'
  rationale: 修订仅处理两处词义精度：“常常”较好传达תָּמִיד所指的持续、惯常取向；“带出来”对应יוֹצִיא的使役义，避免“拉”所增添的动作方式。其余措辞、神名及诗歌意象均可保留。
