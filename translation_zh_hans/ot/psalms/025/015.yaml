  text: עֵינַ֣/י תָּ֭מִיד אֶל יְהוָ֑ה כִּ֤י הֽוּא יוֹצִ֖יא מֵ/רֶ֣שֶׁת רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/015.yaml
  text: My eyes are continually toward Yahweh[a], for he will bring my feet out of the net.
translation:
  language: zh_hans
  text: '我的眼目常常仰望雅威，

    因为他必把我的脚从网罗中带出来。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带出来”直译为“使……出来”，保留脚从网罗中脱离、获救的图像；也可译作“从网罗中带出我的脚”。
    reason: 说明יוֹצִיא的使役义，并保留“从网罗中出来”的具体意象。
lexical_decisions:
- source_word: עֵינַי
  choice: 我的眼目
  rationale: 保留希伯来文具体的复数身体意象；“眼目”在现代中文诗歌语体中自然、庄重，也能表达专注仰望。
- source_word: תָּמִיד
  choice: 时常
  rationale: 表达持续而一贯的取向，同时避免“永远”可能带来的绝对化理解。
- source_word: אֶל
  choice: 仰望
  rationale: 与“眼目”和神这一对象搭配时，“仰望”自然表达朝向、注目和倚望；虽略具语境含义，却没有脱离原文的方向性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译保留四字神名，而不以称号代替。
- source_word: כִּי
  choice: 因为
  rationale: 按上下文引出诗人持续仰望雅威的理由。
- source_word: הוּא
  choice: 他
  rationale: 独立代词在原文中带有一定强调；中文用明确主语“他”即可自然呈现，不额外强化为“他自己”。
- source_word: יוֹצִיא
  choice: 必……拉出来
  rationale: 该使役形动词意为“使出来、带出来”；“拉出来”保留脚被网缠住后获救的具体图像。
- source_word: מֵרֶשֶׁת
  choice: 从网罗中
  rationale: “网罗”准确保留捕捉用网的意象；“从……中”符合中文对脱离缠困状态的表达。
- source_word: רַגְלָי
  choice: 我的脚
  rationale: 直译身体部位，保留脚陷于网罗、继而被救出的具象比喻。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，避免以“主”这一称号替代。
- issue: 未完成体 יוֹצִיא 的时态与确信语气
  choice: 他必……拉出来
  alternative: 他会……拉出来；愿他……拉出来
  rationale: 上下文表达诗人因信靠而持续仰望；“必”自然传达对未来施救的确信，但不把句子改成祈愿。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，并保留希伯来诗歌中“眼目—脚—网罗”的具体意象。分行呈现原句的理由关系；不用古奥词序或宗派化术语。
