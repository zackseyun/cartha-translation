base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/021.yaml
  text: Integrity and uprightness may preserve me[b][a], for I wait for you.
translation:
  language: zh_hans
  text: 愿纯全和正直护卫我[a]，因为我等候你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“纯全和正直必护卫我。”这里的希伯来语动词既可表达祈愿，也可表达确信或期待。
    reason: lexical_alternative
  - marker: b
    text: “等候”含有怀着盼望等候的意思；也可译作“我仰望你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּם
  choice: 纯全
  rationale: 表示品格完整、无可指摘；“纯全”既保留道德完整之意，也不至于暗示绝对无罪。
- source_word: וָיֹשֶׁר
  choice: 和正直
  rationale: יֹשֶׁר在此指伦理上的正直，与“纯全”构成紧密而不完全重复的诗意配对。
- source_word: יִצְּרוּנִי
  choice: 愿……护卫我
  rationale: נצר意为守护、保全；未完成式在祷告语境中可表达愿望，也可表达确信。正文采用祈愿语气，并以脚注保留另一可能。
- source_word: כִּי
  choice: 因为
  rationale: 引出前句祈求的理由；现代汉语中“因为”清楚自然。
- source_word: קִוִּיתִיךָ
  choice: 我等候你
  rationale: קוה包含怀着盼望等候的意思；“等候你”保留动作意象，脚注说明其中的盼望意味。
theological_decisions:
- issue: 本节是否把诗人的道德品质视为赚取拯救的功德
  choice: 直译为纯全和正直护卫诗人的祈愿，不添加功德论或自义的解释。
  alternative: 把它强化为诗人凭自身义行获得拯救，或反过来改写为只有上帝直接护卫他。
  rationale: 希伯来文确实以“纯全和正直”为护卫的主语，同时又以诗人等候上帝为理由。译文保留这种伦理诉求与信靠上帝并存的张力。
- issue: יִצְּרוּנִי表达祈愿还是确信
  choice: 正文采用“愿……护卫我”的祈愿读法。
  alternative: “纯全和正直必护卫我”的确信读法。
  rationale: 未完成式在本诗祷告语境中可作祈愿，也可表示期待或确信；正文按祈求语气处理，脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体。“纯全”和“正直”保留两个相关伦理词的并列；“护卫”较“保全”更直接呈现保护意象。脚注标记按正文出现顺序排列。
