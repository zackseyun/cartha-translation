  text: יַדְרֵ֣ךְ עֲ֭נָוִים בַּ/מִּשְׁפָּ֑ט וִֽ/ילַמֵּ֖ד עֲנָוִ֣ים דַּרְכּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/009.yaml
  text: He guides the humble in justice[b][a], and he teaches the humble his way.
translation:
  language: zh_hans
  text: 他以公正[b]引导谦卑的人[a]，并教导谦卑的人他的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谦卑的人”也可译作“柔和的人”或“卑微的人”；按语境，希伯来语原词也可指困苦的人。
    reason: lexical_alternative
  - marker: b
    text: “以公正”也可译作“在审判中”或“按正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְרֵךְ
  choice: 引导
  rationale: דרך 的 Hiphil 形式表示使人行走、带领或指引；“引导”在现代汉语中自然，也保留主动带领的含义。
- source_word: עֲנָוִים
  choice: 谦卑的人
  rationale: 该词可指谦卑、温顺、卑微或受苦的人；本诗论及领受耶和华教导的人，译作“谦卑的人”较贴合语境。希伯来文重复两次，汉语后半句用代词承接，以免表达生硬；脚注保留其词义范围。
- source_word: בַּמִּשְׁפָּט
  choice: 按公正
  rationale: מִשְׁפָּט 可指审判、公正、正理或正确裁断。介词 ב 可表示领域、方式或准则；“按公正”自然地表达以上帝的公正为引导准则，同时不排除“按正理”的理解。
- source_word: וִילַמֵּד
  choice: 又……教导
  rationale: למד 的 Piel 形式意为教导；“又”体现连接词，且符合本句平行结构。
- source_word: דַּרְכּוֹ
  choice: 自己的道路
  rationale: 原文为单数名词并带第三人称阳性单数后缀，直指上帝的道路；“自己的道路”在汉语中明确其归属，并保留圣经中“道路”的伦理与生活方向意象。
theological_decisions:
- issue: עֲנָוִים 所指的谦卑、温顺、卑微或受苦者
  choice: 正文译作“谦卑的人”
  alternative: “温顺的人”“卑微的人”或“受苦的人”
  rationale: 上下文强调人以可受教的姿态领受耶和华的引导，因此采用“谦卑的人”；脚注说明原词也可能具有社会处境或受苦层面的含义，避免把词义限定为纯粹内在德性。
- issue: בַּמִּשְׁפָּט 中介词与 מִשְׁפָּט 的关系
  choice: “按公正”
  alternative: “在正理中”“按判断”
  rationale: 原语可描述引导的准则、方式或领域。“按公正”既传达上帝引导的正直标准，也保留司法和判断方面的语义张力，而不把它缩减为泛泛的“正确”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按公正引导”保留诗句的伦理和司法意味；后半句用“他们”承接重复出现的 עֲנָוִים，使中文流畅，同时维持两分句指向同一群人的平行关系。脚注标记依英语审校层的次序置为 [b][a]。
