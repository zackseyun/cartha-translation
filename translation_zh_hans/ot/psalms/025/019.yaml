  yaml_path: translation/ot/psalms/025/019.yaml
  text: Look at my enemies[a], for they are many, and they hate me with violent hatred.
translation:
  language: zh_hans
  text: 求你看看我的仇敌，因为他们人数众多；他们对我怀着残暴的仇恨。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的表达可直译为：“他们以（或带着）暴力的仇恨恨我。”这种名词与动词并用的表达强调：他们对我的仇恨带有暴力、凶狠的性质。
    reason: 说明希伯来文“שִׂנְאַת חָמָס שְׂנֵאוּנִי”的强调性表达，以及חָמָס所含暴力、残暴等语义。
lexical_decisions:
- source_word: רְאֵה
  choice: 求你看看
  rationale: 这是向上帝发出的阳性单数命令式祈求；“求你看看”在现代汉语中自然地表达恳求语气，同时保留“看、关注”的基本意义。
- source_word: אוֹיְבַי
  choice: 我的仇敌
  rationale: 该词带第一人称单数后缀，直译为“我的仇敌”；这一表达庄重、清楚，适合诗篇语体。
- source_word: כִּי רָבּוּ
  choice: 因为他们人数众多
  rationale: כִּי说明祈求的理由；רָבּוּ在此指仇敌数量多。译文明确补出“人数”，使现代汉语自然流畅。
- source_word: וְשִׂנְאַת חָמָס
  choice: 怀着残暴的仇恨
  rationale: 原文名词结构可直译为“暴力的仇恨”或“强暴之恨”。“残暴的仇恨”保留חָמָס所含的暴力、凶狠和不义色彩；加上“怀着”使其与后面的动词在汉语中自然衔接。
- source_word: שְׂנֵאוּנִי
  choice: 恨我
  rationale: 这是שנא的完成式第三人称复数，带第一人称单数宾语后缀。哀歌语境描述持续的敌意，汉语用“恨我”即可自然表达。
