translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”体现对上帝的恳求；分号呈现本节由处境与敌意构成的两部分。保留“仇恨恨我”的适度重复，以反映希伯来文的强调效果，并用脚注说明其字面结构。
