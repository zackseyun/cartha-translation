base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/004.yaml
  text: Make your ways known to me[a], O Yahweh; teach me your paths.
translation:
  language: zh_hans
  text: 耶和华啊，求你使我知道你的道路[a]；求你教导我你的路径。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“使我知道”；传统也译“指示我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיךָ
  choice: 你的道路
  rationale: דֶּרֶךְ既可指实际的道路，也可比喻行事方式或人生道路；译作“你的道路”保留原诗的道路意象及其开放含义。
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 原文直接使用以色列上帝的专名四字神名；采用现代中文读者熟悉的音译“耶和华”，不以头衔替代，并用“啊”体现呼语。
- source_word: הוֹדִיעֵנִי
  choice: 求你使我知道
  rationale: 这是ידע的使役式命令形，直义为“使我知道”；加“求你”符合中文祈祷语境，同时保留使役含义。
- source_word: אֹרְחוֹתֶיךָ
  choice: 你的路径
  rationale: אֹרַח常指路径、轨迹；译作“路径”既与“道路”形成诗歌平行，也避免把两个近义词完全合并。
- source_word: לַמְּדֵנִי
  choice: 求你教导我走
  rationale: למד的加强式命令形带第一人称宾语，基本义是“教导我”。中文若只说“教导我你的路径”较生硬，补出“走”自然表达学习遵行这些路径的意思。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用专名而非称号。中文圣经传统中“耶和华”辨识度最高，并明确作为专名呈现；不以“上主”替代。
- issue: “道路／路径”的含义
  choice: 保留道路比喻，不限定为道德诫命或上帝的作为
  alternative: 你的旨意；你的法则；你的行事方式
  rationale: 原文两个道路词可涵盖上帝的行事方式、指引及人当行的道路。直保留意象，可维持这种神学张力与语义宽度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语祈祷语体。“求你”补明命令式在祈求语境中的语用功能；分号保留两行平行结构。正文中的[a]与脚注对应。
