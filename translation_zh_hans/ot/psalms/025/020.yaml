  text: שָׁמְרָ֣/ה נַ֭פְשִׁ/י וְ/הַצִּילֵ֑/נִי אַל אֵ֝ב֗וֹשׁ כִּֽי חָסִ֥יתִי בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/020.yaml
  text: Guard my life and rescue me; let me not be put to shame, for I take refuge in you.
translation:
  language: zh_hans
  text: 求你守护我的性命，搭救我；不要让我蒙羞，因为我投靠你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ在这里指诗人本人及其生命，而非专指与身体相对的“灵魂”；结合“守护、搭救”的语境，译作“我的性命”准确而自然。
- source_word: וְהַצִּילֵנִי
  choice: 搭救我
  rationale: הציל表示从危险或敌害中救出；“搭救”保留危难中获救的具体语感。
- source_word: אַל אֵבוֹשׁ
  choice: 不要让我蒙羞
  rationale: בוש在诗篇语境中常涉及因失败、受敌压倒而公开蒙羞；此译保留被置于羞辱境地的含义。
- source_word: חָסִיתִי בָךְ
  choice: 我已投靠你
  rationale: חסה ב表示到某人那里寻求庇护、以其为避难所；“投靠”自然传达信赖与寻求保护，“已”体现完成式所表达的既成行动。
theological_decisions:
- issue: נֶפֶשׁ是否译为“灵魂”
  choice: 我的性命
  alternative: 我的灵魂
  rationale: 此处的祈求关乎从现实危险中得保全，נֶפֶשׁ指整个人或生命；译成“灵魂”容易引入原文未强调的身心二分。
- issue: בוש表达内在羞愧还是公开蒙羞
  choice: 不要让我蒙羞
  alternative: 不要让我羞愧
  rationale: 原文可涵盖羞愧与受辱，但本诗敌对和求救的背景更支持“蒙羞”；该表达仍保留其情感和社会层面的张力。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体；以“求你”明确希伯来语祈使句的恳求语气，并用分号保持原句两个祈求之间的紧密联系。
