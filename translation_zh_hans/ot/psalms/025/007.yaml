base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/007.yaml
  text: Do not remember the sins of my youth or my transgressions[a]; according to your steadfast love, remember me—for the sake of your goodness[b], O Yahweh.
translation:
  language: zh_hans
  text: 不要记念我年轻时的罪和我的过犯；雅威啊，求你按你的慈爱[a]记念我，因你的美善。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”所译的希伯来语词 חסד，也可译作“信实的爱”“盟约之爱”或“怜悯”，常包含忠贞不变、守约施恩的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטֹּאות נְעוּרַי
  choice: 我幼年时的罪
  rationale: 该短语指诗人年轻岁月中所犯的具体罪行。“我幼年时的罪”既保留原文的修饰关系，也符合现代汉语表达。
- source_word: וּפְשָׁעַי
  choice: 和我的过犯
  rationale: פשע常含越界、悖逆之意；“过犯”保留其道德与法律色彩。前缀וּ在此自然译作“和”。
- source_word: אַל תִּזְכֹּר
  choice: 不要记念
  rationale: 这是向上帝发出的否定祈求。“记念”在此不只是回想，也可含追究、据以处置之意。
- source_word: כְּחַסְדְּךָ
  choice: 按你的慈爱
  rationale: כְ表示以雅威的חסד为行动的准则；“慈爱”在现代中文圣经语体中自然，并能涵盖恩慈与忠贞之爱，细微语义另见脚注。
- source_word: זְכָר לִי אַתָּה
  choice: 求你……记念我
  rationale: 与前句“不要记念”形成鲜明对照：不记念罪，却记念诗人本人。加入“求”自然表达希伯来语祈求语气。
- source_word: לְמַעַן טוּבְךָ
  choice: 因着你的美善
  rationale: לְמַעַן在此指出祈求的根据或缘由；טוּב指上帝自身的良善。“美善”庄重自然，也避免将此语误解为仅仅对诗人有益。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代。
theological_decisions:
- issue: חסד的丰富含义
  choice: 慈爱
  alternative: 信实的爱；盟约之爱；怜悯
  rationale: 原词兼有恩慈、忠贞和关系中的信实等内涵。“慈爱”适合作正文用语，同时以脚注保留其语义广度，不把它限缩为单纯的怜悯。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。音译“雅威”保留其专名性质，不以“主”这一称号替代；“耶和华”是中文传统形式，但较不贴近通常重构的读音。
- issue: “记念”的神学语用
  choice: 保留“记念”的正反对照
  alternative: 将前半句释译为“不追究”，后半句译作“眷顾”
  rationale: 原文两次使用同一词根זכר，形成“不记念我的罪—记念我”的张力。正文保留这一重复，不把其司法及施恩含义分别解释进译文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈祷语体。“不要记念……求你……记念我”保留原文核心的修辞对照；“因着你的美善”表达祈求以雅威自身的品格为根据。脚注标记[a]已在正文相应词后出现。
