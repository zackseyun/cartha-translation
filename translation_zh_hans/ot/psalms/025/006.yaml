  text: זְכֹר רַחֲמֶ֣י/ךָ יְ֭הוָה וַ/חֲסָדֶ֑י/ךָ כִּ֖י מֵ/עוֹלָ֣ם הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/006.yaml
  text: Remember your mercies[a], O Yahweh, and your steadfast love[c][b], for they are from of old.
translation:
  language: zh_hans
  text: 雅威啊，求你记念你的怜悯[a]和慈爱[b]，因为它们自古以来就有[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的怜恤”。希伯来文为复数，可表示丰富的怜悯或一次次的怜悯。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”一词在希伯来文中为复数，可指雅威多次施行的忠贞之爱。
    reason: lexical_alternative
  - marker: c
    text: 或译“因为它们从亘古就有”。希伯来文可指遥远的古时，也可指永恒。
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: 求你记念
  rationale: 这是 זכר 的 Qal 命令式阳性单数第二人称。在祷告中译作“求你记念”，既保留直接祈求的语气，也符合现代汉语的庄重表达。
- source_word: רַחֲמֶיךָ
  choice: 你的怜悯
  rationale: רַחֲמִים 带阳性单数第二人称后缀，形式为复数，可表达丰富的怜恤或多次施怜悯；汉语以集合性名词“怜悯”自然涵盖此意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，不以称号代替。
- source_word: וַחֲסָדֶיךָ
  choice: 和慈爱
  rationale: חֶסֶד 在此为复数并带阳性单数第二人称后缀，指坚定、忠诚而持久的爱；“慈爱”在现代中文诗篇语体中自然庄重，复数形式另以脚注说明。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出祈求的根据；“因为”准确且符合现代汉语。
- source_word: מֵעוֹלָם
  choice: 自古以来
  rationale: 该表达可指遥远的古时，也可指永恒；正文采用语境中自然且不过度限定的“自古以来”，并以脚注保留“从亘古”的可能。
- source_word: הֵמָּה
  choice: 它们……就有
  rationale: 独立第三人称阳性复数代词，回指前面的“怜悯”和“慈爱”；中文以“它们”明确保留复数回指。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；正文以较贴近通常学术重构读音的“雅威”音译，保留其作为专名的性质，而不以“主”等称号替代。
- issue: מֵעוֹלָם 的时间范围
  choice: 自古以来
  alternative: 从亘古／从永恒
  rationale: 该词既可表示遥远的过去，也可能涵盖无始的永恒。上下文诉诸上帝历来彰显的怜悯与慈爱，故正文不将其限定为技术性的永恒论断，同时用脚注保留更强的时间含义。
- issue: רַחֲמִים 与 חֲסָדִים 的复数形式
  choice: 正文采用自然的中文集合性单数名词
  alternative: 你的种种怜悯和慈爱作为
  rationale: 希伯来文两词均为复数，可强调丰富、多次的施行；现代汉语若机械复数化会显得生硬，因此正文自然表达，并在脚注中说明形式。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你记念”保留诗人向上帝发出的直接恳求；“怜悯”和“慈爱”是自然的中文集合性表达，避免为复制希伯来文复数而造成生硬措辞。
