  text: טוֹב וְ/יָשָׁ֥ר יְהוָ֑ה עַל כֵּ֤ן יוֹרֶ֖ה חַטָּאִ֣ים בַּ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/008.yaml
  text: Good and upright is Yahweh[a]; therefore he instructs sinners in the way.
translation:
  language: zh_hans
  text: 雅威良善而正直；因此他向罪人指示道路[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “指示”也可译作“教导”或“引导”。原文也可理解为“他教导罪人道路”或“他教导罪人走在道路上”。
    reason: 希伯来语动词יוֹרֶה可表示教导、指示或引导；它与בַּדָּרֶךְ的搭配容许相近但不完全相同的表达。
lexical_decisions:
- source_word: טוֹב
  choice: 良善
  rationale: 此处指道德与品格上的善；“良善”与“正直”并列自然，也避免被理解为仅仅“好用”或“令人愉快”。
- source_word: וְיָשָׁר
  choice: 而正直
  rationale: יָשָׁר在此表达道德上的正直、公正；“正直”保留了“端正、不偏曲”的伦理含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，以专名呈现原文，而不以称号替代。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 该短语表示因果推论：正因为雅威良善而正直，他才教导罪人。
- source_word: יוֹרֶה
  choice: 教导
  rationale: ירה的使役形在此可表示教导、指示或引导；“教导”适合智慧诗篇的语境，并可与道路意象自然结合。
- source_word: חַטָּאִים
  choice: 罪人
  rationale: 原文为复数实体名词，直接指犯罪的人；“罪人”准确而简洁，不弱化其道德含义。
- source_word: בַּדָּרֶךְ
  choice: 走这条路
  rationale: 原文直译为“在这道路上／关于这道路”。汉语用“教导罪人走这条路”表达教导内容，保留道路隐喻，也不擅自加入“正确的”或“他所选择的”等限定。
theological_decisions:
- issue: 神圣四字名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”以专名形式对应原文的神名，既不以“主”这一称号替换，也不采用较晚形成的混合读音。
- issue: בַּדָּרֶךְ所指道路的性质
  choice: 这条路
  alternative: 正路；当走的路
  rationale: 上下文自然带有道德道路的含义，但本节希伯来文没有明说“正”或“当走”；因此不把这些解释性成分写入正文。
- issue: יוֹרֶה与道路短语的关系
  choice: 教导罪人走这条路
  alternative: 在道路上指教罪人；把道路指示给罪人
  rationale: 原文可兼有教导和指路的色彩。正文采用自然的现代汉语表达，同时用脚注保留“指示／引导”的词义可能性。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“良善而正直”保持诗歌式平衡；“走这条路”保留原文的道路隐喻，不额外限定为“正路”。
