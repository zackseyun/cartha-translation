  yaml_path: translation/ot/psalms/025/012.yaml
  text: Who is the man who fears Yahweh? He will instruct him in the way he should choose[a].
translation:
  language: zh_hans
  text: '谁是敬畏耶和华的人？


    耶和华必指教他应当选择的道路。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华必在他所选择的道路上指教他”，或“耶和华必在他将选择的道路上指教他”。希伯来语末尾的动词容许这些细微不同的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה הָאִישׁ
  choice: 谁是……的人
  rationale: “疑问词＋指示词＋人”在此构成修辞性提问；现代汉语用“谁是……的人”自然表达其力度，同时不生硬直译“这个人”。
- source_word: יְרֵא יְהוָה
  choice: 敬畏耶和华
  rationale: ירא 在诗篇与智慧文学中兼有畏惧、尊崇和虔敬之意；“敬畏”是现代汉语圣经语境中准确而庄重的对应。神名 יהוה 音译为“耶和华”，保留其专名性质。
- source_word: יוֹרֶנּוּ
  choice: 耶和华必指教他
  rationale: ירה 的使役式可指教导、指示或引导；“指教”兼顾教导与引路之意。动词虽未明说主语，但上下文最自然地指向耶和华；宾语后缀指前述敬畏他的人。
- source_word: בְּדֶרֶךְ
  choice: 道路
  rationale: דרך 既可指实际道路，也常比喻生活方向或行事方式；“道路”保留诗歌中的路径意象。
- source_word: יִבְחָר
  choice: 当选择的
  rationale: 未完成式在此可表达应当选择、实际选择或将要选择。正文采用“当选择的”，体现受教后应走之路，同时以脚注保留其他可能语气。
theological_decisions:
- issue: “必指教他”的主语身份
  choice: 在正文中补明“耶和华”是指教者
  alternative: 不明说主语，译作“他必蒙指教”或保留含混
  rationale: 希伯来语动词没有显式主语，但最近的合宜先行项及本诗语境都强烈支持耶和华为主语。补明主语使现代汉语清楚流畅，不引入经文之外的教派性解释。
- issue: 末尾动词 יִבְחָר 的主语与语气
  choice: 理解为敬畏耶和华的人“当选择”道路
  alternative: 可理解为“他所选择的道路”或“他将选择的道路”；其中“他”也可能被理解为耶和华
  rationale: 希伯来语允许不止一种细微理解。正文选取与训诲语境相称的义务语气，但用脚注保留原文的语法开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两行结构保留原句问答式推进；使用“敬畏”“指教”“道路”等普通读者熟悉且能承载诗篇神学意味的词语。脚注标记已在正文对应位置标出。
