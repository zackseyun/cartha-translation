  yaml_path: translation/ot/psalms/025/003.yaml
  text: Indeed[a], none of those who wait for you will be put to shame[b]; those who deal treacherously without cause will be put to shame.
translation:
  language: zh_hans
  text: '的确，凡等候你的人必不蒙羞；

    无故背信行诡诈的人必蒙羞。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无故”或译“徒然地”或“白白地”。希伯来语 רֵיקָם 的修饰范围和含义在此有歧义：可指他们无缘无故地背信行诡诈，也可指他们的诡诈是徒然的。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כָּל
  choice: 凡……必不
  rationale: גַּם在这里加强整体断言，כָּל与否定词连用，表达无一例外的意思。汉语用“凡……必不”自然地保留这一强调和普遍性。
- source_word: קֹוֶיךָ
  choice: 等候你的
  rationale: קוה指带着期待而等候；“等候”直接对应其基本义，也让盼望的含义由语境自然呈现。
- source_word: לֹא יֵבֹשׁוּ / יֵבֹשׁוּ
  choice: 必不蒙羞 / 必蒙羞
  rationale: בוש在本节指遭受羞辱或落入羞愧的结局。重复使用“蒙羞”，保留两行之间鲜明的对照和平行。
- source_word: הַבּוֹגְדִים
  choice: 行诡诈的
  rationale: בגד表示背信、奸诈地行事；“行诡诈的”保留分词所表达的主动行为，不把意义局限于某一种具体的背叛。
- source_word: רֵיקָם
  choice: 无故
  rationale: רֵיקָם可指徒然、空手或无缘无故；在此修饰行诡诈者，“无故”最自然地表达其行为没有正当理由，同时以脚注保留其他可能理解。
