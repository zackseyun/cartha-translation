source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֥ יְהוָ֑ה וְֽ/סָלַחְתָּ֥ לַ֝/עֲוֺנִ֗/י כִּ֣י רַב הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/011.yaml
  text: For the sake of your name[a], O Yahweh, forgive my iniquity[b], for it is great.
translation:
  language: zh_hans
  text: 为了你的名[a]，雅威啊，求你赦免我的罪孽[b]，因为它十分深重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的名”不只是指称呼本身，也包含雅威的品格、声誉以及他对盟约的信实。
    reason: cultural_note
  - marker: b
    text: “罪孽”所译的希伯来词也可指“罪责”或“罪”，并可包含罪责所带来的重担或后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  choice: 为了你的名
  rationale: לְמַעַן表示行动的缘由或所顾念的对象；“为了”自然地表达诗人以神的名誉和品格为恳求依据，同时保留“名”这一希伯来文的具体表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为以色列之神专名的性质，而不以“主”这一称号替代。
- source_word: וְסָלַחְתָּ
  choice: 求你赦免
  rationale: 该形式在此祷告语境中承担恳求功能；“求你赦免”比机械译作“你就赦免了”更符合现代汉语祷告表达。
- source_word: לַעֲוֺנִי
  choice: 我的罪孽
  rationale: עָוֹן可指不义行为、由此产生的罪责，或罪责所带来的重担与后果。“罪孽”保留其道德分量，也不把词义限定为主观罪疚感。
- source_word: כִּי רַב הוּא
  choice: 因为它十分深重
  rationale: כִּי引出恳求赦免的理由；רַב在单数名词之后表示程度或分量大。“十分深重”以自然汉语传达罪孽之严重，而不是误作数量众多。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”作音译，以保留专名，并避免用称号代替；正文加“啊”呈现直接呼求的语气。
- issue: עָוֹן的语义范围
  choice: 罪孽
  alternative: 罪；罪责
  rationale: 该词兼有恶行、罪责及其后果等可能含义。“罪孽”保持较宽的道德语义，脚注说明其他可能，避免在正文中把含义过度收窄。
- issue: 以罪孽深重作为赦免恳求的理由
  choice: 保留“因为它十分深重”的因果表达
  alternative: 译作“虽然它十分深重”
  rationale: כִּי通常在这里引出理由。原文具有强烈的神学张力：诗人不是淡化罪，而是在承认罪孽深重时诉诸雅威之名。译文不把这种张力改写成让步关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“为了你的名”保留原文意象；“求你赦免”清楚呈现祷告中的恳求。“十分深重”避免生硬的“它是大的”，并保持诗人坦承罪之严重的力度。所有脚注标记均已在正文对应位置出现。
