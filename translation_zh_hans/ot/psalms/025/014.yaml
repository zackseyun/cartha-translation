source:
  edition: WLC
  text: ס֣וֹד יְ֭הוָה לִ/ירֵאָ֑י/ו וּ֝/בְרִית֗/וֹ לְ/הוֹדִיעָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/014.yaml
  text: The counsel of the LORD is for those who fear him, and his covenant is to make it known to them.
translation:
  language: zh_hans
  text: '耶和华的密意[a]向敬畏他的人显明；

    他使他们明白自己的约。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “密意”也可译为“密议”或“亲密的相交”；希伯来词可指私密的商议，也可指亲密关系。
    reason: 保留 סוֹד 在隐秘商议与亲密关系之间的语义范围，避免正文将其单义化。
lexical_decisions:
- source_word: סוֹד
  choice: 亲密相交
  rationale: 此词可指秘密商议、密友间的交情或亲密交通。这里强调耶和华与敬畏他之人的亲近关系；译作“亲密相交”既自然，也不把含义收窄为单纯的“劝告”或“秘密”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的传统专名译法。
- source_word: לִירֵאָיו
  choice: 敬畏他的人
  rationale: 保留 ירא 的宗教伦理含义，即对上帝怀有敬畏、尊崇并顺服，而非普通的害怕。
- source_word: וּבְרִיתוֹ
  choice: 他也……他的约
  rationale: 保留“他的约”作为第二分句的主题，并以“也”自然衔接平行句。
- source_word: לְהוֹדִיעָם
  choice: 使他们明白
  rationale: 使役不定式意为“使他们知道/让他们认识”。“明白”在此可自然表达上帝使敬畏他的人认识其约。
theological_decisions:
- issue: 第二分句中不定式 לְהוֹדִיעָם 与“他的约”的句法关系
  choice: 理解为上帝使他们认识他的约
  alternative: 按较生硬的表层结构译为“他的约是要使他们知道”
  rationale: 希伯来诗句省略成分，通常可理解为耶和华使敬畏他的人知道他的约。中文补出隐含的施事者，可避免把“约”误读为执行“使知道”这一动作，同时不增添宗派性解释。
- issue: סוֹד 所表达的是信息还是关系
  choice: 采用兼顾亲密关系与私密交通的“亲密相交”
  alternative: “密旨”“奥秘”“劝告”
  rationale: 该词本身具有语义张力。上下文中的“敬畏他的人”支持亲密关系的含义，但没有把它具体化为某项秘密启示或单一劝告。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。以两个平行分句呈现诗句结构；不设脚注，因为正文已能自然传达主要语义，且没有必须在正文外说明的文本异读。
