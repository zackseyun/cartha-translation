  text: The troubles of my heart have multiplied[b][a]; bring me out of my distresses.
translation:
  language: zh_hans
  text: 我心里的患难增多了[a]；求你救我脱离困境。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “增多了”直译为“扩大了”或“变宽广了”。“救我脱离困境”或译“把我从困迫中领出来”；原文以“狭窄、困迫”的意象描绘苦难。
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹת
  choice: 患难
  rationale: 该复数名词指患难、逆境或令人痛苦的处境；“患难”庄重自然，也与下半句表示困厄的词相呼应。
- source_word: לְבָבִי
  choice: 我心里的
  rationale: לֵבָב 指人的内在，包括情感与思想；“心里”保留希伯来文的人体意象，同时符合现代汉语表达。
- source_word: הִרְחִיבוּ
  choice: 增多了
  rationale: 该动词本义是“使宽阔、扩大”；以“患难”为主语时，表达患难扩展或增加。“增多了”清楚传达语境中的意义，脚注则保留原文“扩大”的具体意象。
- source_word: מִמְּצוּקוֹתַי
  choice: 脱离困境
  rationale: מְצוּקוֹת 是复数，含狭窄、困迫与苦难之意；汉语“困境”可概括这种受困受压的处境，并与“救……脱离”自然搭配。
- source_word: הוֹצִיאֵנִי
  choice: 求你救我脱离
  rationale: 该使役动词直译为“把我带出来”。“救我脱离”既表达祈求和拯救，也保留从困境中出来的方向性。
