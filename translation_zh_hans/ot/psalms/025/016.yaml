  yaml_path: translation/ot/psalms/025/016.yaml
  text: Turn to me and be gracious to me[b][a], for I am lonely and afflicted.
translation:
  language: zh_hans
  text: 求你转向我，恩待我，因为我孤单[a]又困苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“独自一人”。希伯来语 יָחִיד 既可指孤单，也可指独自、孤立。
    reason: lexical_alternative
  - marker: b
    text: 或译“贫穷”或“受压迫”。希伯来语 עָנִי 可按语境指经济贫困、遭受压迫或一般的困苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: 转向我
  rationale: 祈使动词פּנה与方向介词אֶל连用，表示恳求上帝把注意和眷顾转向诗人；“转向我”既贴近原文，也符合现代汉语祷告语体。
- source_word: וְחָנֵּנִי
  choice: 恩待我
  rationale: חנן表示施恩、赐予恩惠。“恩待我”自然凝练，并保留诗人求上帝施恩的含义，而不将其限定为怜悯。
- source_word: כִּי
  choice: 因为
  rationale: 这里引出祈求的理由，采用明确的因果连词“因为”。
- source_word: יָחִיד
  choice: 孤单
  rationale: 该词可表示独自、孤立，在哀歌语境中也包含孤单无助之感。“孤单”能自然表达处境，同时以脚注保留“独自一人”的可能。
- source_word: וְעָנִי
  choice: 困苦
  rationale: עָנִי的语义涵盖贫穷、受压迫和遭受苦难。“困苦”在此不把含义局限于经济贫困，并适合与“孤单”并列。
- source_word: אָנִי
  choice: 我
  rationale: 独立人称代词带有强调作用；汉语句式中的“我孤单困苦”自然表达自述，语境已能承载这一强调。
