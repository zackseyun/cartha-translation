  text: Look on my affliction and my trouble[a], and forgive all my sins.
translation:
  language: zh_hans
  text: 求你垂顾我的困苦和患难，赦免我一切的罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文按字面可作“举起（或带走）我一切的罪”。这里的希伯来语动词可指“举起、承担或带走”；与“罪”连用时表示赦罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: 垂顾
  rationale: 这是向上帝发出的祈使请求，不只是请他“看见”，也含有求他关注、眷顾之意；“垂顾”自然、庄重，并保留祈祷语气。
- source_word: עָנְיִי
  choice: 我的困苦
  rationale: עֳנִי可指困苦、苦难或悲惨处境；这里不宜收窄为经济贫穷。“困苦”在诗篇祷告中清楚自然。
- source_word: וַעֲמָלִי
  choice: 和患难
  rationale: עָמָל可指劳苦、痛苦或艰难；与“困苦”并列时，“患难”表达诗人所承受的痛苦处境，也避免机械重复。
- source_word: וְשָׂא
  choice: 赦免
  rationale: נשׂא本义为举起、承担或除去，与“罪”搭配时是表示除罪、赦罪的惯用语；正文用“赦免”准确传达其语境意义。
- source_word: לְכָל
  choice: 一切的
  rationale: 这里的לְ与נשׂא构成惯用结构，引出“我一切的罪”；现代汉语无需逐字译出介词。
- source_word: חַטֹּאותָי
  choice: 我的罪
  rationale: חַטֹּאות为חַטָּאת的复数，在此指道德和宗教意义上的罪；“我的罪”是清楚、标准的表达。
theological_decisions:
- issue: נשׂא以“罪”为宾语时的译法
  choice: 正文译为“赦免我一切的罪”
  alternative: “除去我一切的罪”或“担当我一切的罪”
  rationale: 希伯来语以“举起、带走”表达除罪或赦罪。中文正文采用“赦免”可清楚传达诗人向上帝求宽恕的意思；脚注保留原文的具体意象，避免把“担当”可能引起的额外神学联想带入本节。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“垂顾”体现向上帝恳求关注的语气；“困苦和患难”保留原文两个近义名词的并列；脚注标记置于整句之后，与所解释的赦罪分句相连。
