  text: פְּדֵ֣ה אֱ֭לֹהִים אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל צָֽרוֹתָי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/022.yaml
  text: Redeem Israel[a], O God, from all his troubles.
translation:
  language: zh_hans
  text: 上帝啊，求你救赎以色列，救他脱离一切患难。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“救他们脱离一切患难。”这是把“以色列”按集合意义理解为以色列众民，而不保留希伯来文的单数语法形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדֵה
  choice: 救赎
  rationale: 该词是פדה的阳性单数祈使式，可指赎回、救赎或解救。“救赎”既保留其赎回的语义和神学分量，也符合向上帝发出的祈求。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处是对受祈求者的直接称呼；用“上帝啊”自然表达呼格。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 此处指作为整体的以色列民，而非仅指先祖雅各。
- source_word: מִכֹּל
  choice: 脱离……一切
  rationale: 介词מִן与כֹּל连用，表示从全部患难中得释放；汉语以“脱离……一切”表达最为自然。
- source_word: צָרוֹתָיו
  choice: 他一切的患难
  rationale: צָרוֹת可指患难、困苦或窘迫；“患难”庄重而通俗。其第三人称阳性单数后缀译作“他”，保留“以色列”作为集合单数的语法形式。
theological_decisions:
- issue: “以色列”作为集合名词时所对应的单数代词
  choice: 保留单数“他的患难”
  alternative: 译作“他们的患难”，按集合意义指以色列众民
  rationale: 希伯来文在“患难”后使用第三人称阳性单数后缀，与作为集合单数的“以色列”呼应。正文保留单数形式，以免消除原文的语法张力；脚注说明符合汉语集合意义的复数理解。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“上帝啊，求你……”符合当代汉语诗篇表达；正文保留原文集合单数所造成的“以色列—他”搭配，并用脚注交代较自然的复数译法。
