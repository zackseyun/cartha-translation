  text: Of David. To you[a], Yahweh, I lift up my soul.
translation:
  language: zh_hans
  text: '大卫的诗。


    耶和华啊，我向你举起我的生命[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“我的魂”（nephesh）；也可译为“我的生命”或“我自己”。这个词可指整个人，并不只指非物质的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 标题可表示“大卫所作／属于大卫／关于大卫”；按诗篇标题的自然中文惯例译为“大卫的诗”，同时不在正文中展开作者关系的全部歧义。
- source_word: אֵלֶיךָ
  choice: 我向你仰望
  rationale: 与后面的 אֶשָּׂא（举起）合译，使中文自然，并保留朝向耶和华的祷告姿态。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，区别于一般称谓“主”。
- source_word: נַפְשִׁי אֶשָּׂא
  choice: 全心投靠你
  rationale: 字面为“我举起我的生命／自己”；נפשׁ常指整个人或生命，并非仅指非物质的“灵魂”。“全心投靠你”在现代中文中传达把自己交托给神的整体行动；脚注保留字面意象及词义范围。
theological_decisions:
- issue: נפשׁ是否专指非物质灵魂
  choice: 正文译作“全心投靠你”
  alternative: “我向你举起我的灵魂／生命”
  rationale: 原词在此可指人的生命或整个自我。避免把经文限定为灵魂与身体二分的表达，同时借脚注保留原文的“举起”意象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将希伯来语倒装式拆成呼语和两行祷告；“仰望”与“投靠”使整体中文顺畅，但脚注明示原文较具体的“举起我的生命／自己”意象。
