base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/005.yaml
  text: Lead me in your truth and teach me[a], for you are the God of my salvation[b]; for you I wait all day long.
translation:
  language: zh_hans
  text: '求你在你的真理中引导我[a]，教导我；

    因为你是拯救我的神；

    我终日等候你[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你凭你的信实引导我。”希伯来语“真理”一词也可表示“信实”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我终日仰望你。”这里的希伯来语动词含有带着期待等候的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  choice: 引导我
  rationale: 该词是דרך的使役式祈使语，表示带领或使人行在道路上。“引导我”自然保留了方向与道路的意象。
- source_word: בַאֲמִתֶּךָ
  choice: 在你的真理中
  rationale: אֱמֶת可指真理、真实或信实。这里与“引导”和“教导”并列，“真理”较贴合受教与行路的语境；介词ב表达在其中或以其为准则。
- source_word: וְלַמְּדֵנִי
  choice: 教导我
  rationale: למד的加强式祈使语在此直接表示教导；此译简明自然。
- source_word: כִּי
  choice: 因为
  rationale: 该连词说明祈求的依据，即上帝是诗人得拯救的神。
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: 拯救我的神
  rationale: 希伯来语直译为“我救恩的神”，表明上帝是诗人救恩的源头；“拯救我的神”在现代汉语中更自然，同时保留其救助含义。
- source_word: קִוִּיתִי
  choice: 等候
  rationale: קוה兼有等候、盼望和期待之意。“等候”保留具体的持续动作，而期待的意味由脚注说明。
- source_word: אוֹתְךָ
  choice: 你
  rationale: 该代词是קוה的宾语；汉语习惯说“等候你”，无需另加介词。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 该短语指整日、一天之久。“终日”简洁庄重，并保留持续的时间意味。
theological_decisions:
- issue: אֱמֶת在上帝引导语境中的含义
  choice: 真理
  alternative: 信实
  rationale: “引导”与“教导”使“真理”成为较贴合上下文的内容或准则，但原词也确可表示上帝的信实，因此以脚注保留该读法。
- issue: קוה所含的等候与盼望意味
  choice: 等候
  alternative: 盼望；满怀期待地等候
  rationale: 原词同时含有等待与期待。“等候”保留其具体、持续的动作，不把期待意味完全解释性地写入正文；脚注补充其盼望色彩。
- issue: אֱלֹהֵי יִשְׁעִי的表达
  choice: 拯救我的神
  alternative: 我救恩的神；赐我救恩的神
  rationale: 选择自然现代汉语，表达上帝是诗人拯救的来源，不额外限定拯救的方式或范围。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“终日”略带诗体色彩但仍属通行表达。分行保留诗歌节奏，并用分号呈现各分句之间紧密而未被过度解释的关系。
