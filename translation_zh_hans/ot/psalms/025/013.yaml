  text: נַ֭פְשׁ/וֹ בְּ/ט֣וֹב תָּלִ֑ין וְ֝/זַרְע֗/וֹ יִ֣ירַשׁ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/013.yaml
  text: His soul will dwell in goodness[b][a], and his offspring will inherit the land.
translation:
  language: zh_hans
  text: 他必在福乐中安居[b]，他的后裔必承受那地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地”。希伯来语“地”既可指特定的土地，也可指大地；这里译作“那地”，是因“承受那地”很可能带有圣约背景。
    reason: alternative_reading
  - marker: b
    text: “安居”所译的希伯来语动词本有“住宿”或“过夜”的意思，在这里表示安然停留、居住。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: 他
  rationale: נֶפֶשׁ在这里可指人的自身或生命。直译“他的灵魂”在现代汉语中容易被理解为与身体相分离的部分；译作“他”自然地表达整个人，同时不额外引入二元论色彩。
- source_word: בְּטוֹב
  choice: 在福乐中
  rationale: טוֹב可指美善、福祉或昌盛。“福乐”兼顾蒙福与安好的意味，又不把含义收窄为物质上的富足。
- source_word: תָלִין
  choice: 安居
  rationale: לון本义涉及住宿、过夜，也可引申为停留、居住。“安居”保留持续居留的意象，并与בְּטוֹב所表达的福祉相协调；其较具体的本义列入脚注。
- source_word: וְזַרְעוֹ
  choice: 他的后裔
  rationale: זֶרַע在此不是字面的“种子”，而是指子孙后代；“后裔”简洁、庄重，也适合经文语体。
- source_word: יִירַשׁ
  choice: 必承受
  rationale: ירשׁ可指继承、占有或取得产业。“承受”能体现领受产业的圣约语感，同时避免只强调武力占领。
- source_word: אָרֶץ
  choice: 那地
  rationale: אֶרֶץ既可指特定的土地，也可泛指大地。与ירשׁ连用时，“那地”更能传达以色列圣约背景中的土地含义；较宽泛的解释保留在脚注。
theological_decisions:
- issue: נַפְשׁוֹ所指的是“灵魂”还是整个人
  choice: 以“他”表达整个人
  alternative: 他的灵魂／他的性命
  rationale: 希伯来语נֶפֶשׁ常指人自身或生命，不必然专指与身体相对的“灵魂”。正文采用自然汉语表达整个人，避免加入原文没有明确规定的人论区分。
- issue: אָרֶץ与יִירַשׁ连用时的范围
  choice: 那地
  alternative: 大地
  rationale: 这一搭配很可能呼应承受应许之地的圣约语言，但אָרֶץ本身也容许更广的“大地”之义，因此在脚注中保留该可能性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“福乐”保留טוֹב兼具福祉、美好和昌盛的宽度；“那地”提示特定土地的语境，却以脚注保留“大地”的可能读法。脚注标记均已置于正文相应词语之后。
