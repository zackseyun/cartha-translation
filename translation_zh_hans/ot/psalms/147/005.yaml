base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/005.yaml
  text: Great is our Lord[a], and abundant in power; his understanding is beyond number.
translation:
  language: zh_hans
  text: 我们的主伟大，满有能力；他的理解力无法数算。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּדוֹל
  choice: 伟大
  rationale: 作表语并置于句首，保留希伯来文颂赞性的强调；现代汉语中以“我们的主伟大”自然表达。
- source_word: אֲדוֹנֵינוּ
  choice: 我们的主
  rationale: אֲדוֹן是带第一人称复数后缀的称号，并非神名YHWH；译作“我们的主”既保留称号，也保留“我们”的所属关系。
- source_word: וְרַב כֹּחַ
  choice: 满有能力
  rationale: רַב表示程度或数量丰盛，כֹּחַ表示力量、能力；“满有能力”在现代汉语中凝练自然，并保留能力丰盛之意。
- source_word: לִתְבוּנָתוֹ
  choice: 他的智慧
  rationale: תְּבוּנָה可指理解力、洞察力或明智；用于神时，“智慧”是自然且通俗的中文表达，同时涵盖其洞察与理解。
- source_word: אֵין מִסְפָּר
  choice: 无法测度
  rationale: 字面为“没有数目”，表示不可计数、不可估量；与抽象名词“智慧”搭配时，“无法测度”比“无法数算”更符合现代汉语习惯，同时保存其无可计量的意象。
theological_decisions:
- issue: 颂赞诗中神圣称号 אֲדוֹנֵינוּ 的译法
  choice: 我们的主
  alternative: 我们的主人
  rationale: 原文使用的是אֲדוֹן加“我们的”后缀，而不是神名；“主”保留宗教语境中的称号意义，又不把它误作通常以特定形式表达的YHWH。
- issue: תְּבוּנָה所指神的属性
  choice: 智慧
  alternative: 理解力／洞察力
  rationale: 原词语义范围包括理解、洞察和明辨。“智慧”在中文颂赞语境中最自然，但不将其限定为单纯知识量；后句仍保留其不可测度的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句首保留“我们的主伟大”的颂赞重心；分号对应两组平行陈述。未加脚注，因为“无法测度”已自然承载 אֵין מִסְפָּר 的不可计量含义，且本节无需借脚注解决文本歧义。
