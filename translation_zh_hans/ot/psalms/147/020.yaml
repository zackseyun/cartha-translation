source:
  edition: WLC
  text: לֹ֘א עָ֤שָׂה כֵ֨ן לְ/כָל גּ֗וֹי וּ/מִשְׁפָּטִ֥ים בַּל יְדָע֗וּ/ם הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/020.yaml
  text: He has not done so for any nation; they have not known his judgments[a]. Praise Yah!
translation:
  language: zh_hans
  text: 他没有这样对待过任何一国；他们也未曾知道他的典章。你们要赞美雅[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按传统译为“你们要赞美耶和华！”；整句也常音译为“哈利路亚！”希伯来语הַלְלוּ־יָהּ（halelu-yah）直译为“你们要赞美雅”，其中“雅”是神名的短式。
    reason: 说明神名短式及传统译法。
lexical_decisions:
- source_word: לֹא עָשָׂה כֵן לְכָל גּוֹי
  choice: 他没有这样待任何一国
  rationale: 否定词与“任何一国”搭配，表达上帝没有以此前所述的方式对待别国；“待”自然承接上下文中的施行与赐予。
- source_word: וּמִשְׁפָּטִים
  choice: 至于他的典章
  rationale: מִשְׁפָּטִים在本段指上帝赐给以色列、具有裁判与规范性质的规定；“典章”保留法律和权威色彩，又不局限于个别判决。所有格“他的”由语境补明，希伯来语随后动词上的复数宾语后缀回指这些典章。
- source_word: בַּל יְדָעוּם
  choice: 他们并不知道
  rationale: בַּל是诗体否定词；יְדָעוּם意为“他们不知道它们”，其中“它们”回指前面的典章。中文为避免重复宾语，采用主题结构自然表达。
- source_word: הַלְלוּ יָהּ
  choice: 你们要赞美雅
  rationale: הַלְלוּ是复数命令式，故用“你们要赞美”；יָהּ是神名的短式，音译为“雅”，不把它扩展成源文未使用的全称。
theological_decisions:
- issue: 结尾神名短式יָהּ的译法
  choice: 雅
  alternative: 耶和华；哈利路亚
  rationale: 源文使用神名短式יָהּ，而非四字神名יהוה。“雅”直接反映短式；脚注同时说明传统译法，避免把音译短语误当作另一个称号。
- issue: 列国“不知道”上帝典章的陈述范围
  choice: 按原文保留“他们并不知道”
  alternative: 他们没有领受他的典章
  rationale: ידע的直接意义是“知道”，原文没有明说其原因仅在于未曾领受，因此不在正文中替作者解释，以保留陈述本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于……他们并不知道”保留希伯来诗句的主题突出结构；结尾补出复数命令式的“你们”，使劝告对象在中文中清楚。
