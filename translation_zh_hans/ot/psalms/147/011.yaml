  text: רוֹצֶ֣ה יְ֭הוָה אֶת יְרֵאָ֑י/ו אֶת הַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/011.yaml
  text: Yahweh delights in those who fear him[b][a], in those who hope for his steadfast love.
translation:
  language: zh_hans
  text: 雅威喜爱敬畏他的人，也喜爱盼望他的坚定慈爱的人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盼望”也可译作“等候”；希伯来语原词兼有怀着期待等候和盼望的意思。
    reason: lexical_alternative
  - marker: b
    text: 译作“坚定的慈爱”的希伯来语词是 hesed，常指雅威忠诚、持久的爱，也可包含怜悯与信实。
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹצֶה
  choice: 喜爱
  rationale: 此处分词表达悦纳、以某人为喜悦，而非单纯“想要”；“喜爱”自然简洁，也保留关系性的温度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作中文音译，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: יְרֵאָיו
  choice: 敬畏他的人
  rationale: 保留“畏惧”与“尊崇”并存的圣经用语张力，不弱化为单纯的尊敬。
- source_word: הַמְיַחֲלִים
  choice: 盼望……的人
  rationale: יחל可表达带着期待的等候或盼望；本句用“盼望”在现代汉语中更自然，同时以脚注保留“等候”的可能。
- source_word: לְחַסְדּוֹ
  choice: 他忠贞慈爱
  rationale: חסד兼含慈爱、忠诚和持久信实；“忠贞慈爱”以简洁中文保留这一丰富含义，避免仅译“怜悯”而缩窄语义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近通行学术重构读音 Yahweh 的“雅威”，以专名而非头衔呈现。
- issue: “敬畏”用语的张力
  choice: 敬畏他的人
  alternative: 尊崇他的人
  rationale: “敬畏”保留面对上帝时畏惧与尊崇相连的含义，不把经文简化为一般性的尊敬。
- issue: יחל 的等候与盼望
  choice: 盼望
  alternative: 等候
  rationale: 原词可兼有等候和怀着期待盼望之意；正文选择较自然的“盼望”，脚注明示另一可能，不武断排除其时间性的等候意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威”为神名音译；平行句中补出第二个“喜爱”并加“也”，使希伯来诗句的两部分在汉语中关系清楚。脚注标记均置于正文相关句末。
