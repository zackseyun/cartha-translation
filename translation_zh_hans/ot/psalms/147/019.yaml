  text: מַגִּ֣יד דבר/ו לְ/יַעֲקֹ֑ב חֻקָּ֥י/ו וּ֝/מִשְׁפָּטָ֗י/ו לְ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/019.yaml
  text: He declares his word to Jacob[b][a], his statutes and his judgments to Israel.
translation:
  language: zh_hans
  text: 他向雅各宣告自己的话[a]，向以色列宣告自己的律例和典章[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣告自己的话”也可译作“使雅各知道他的话”。
    reason: lexical_alternative
  - marker: b
    text: “典章”在这里也可译作“法令”“规例”或“法则”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַגִּיד
  choice: 宣告
  rationale: 这是 נגד 的使役分词，表示“使人知道、宣告”。“宣告”保留公开传达的语气；希伯来语分词在此可表达上帝一贯的作为。
- source_word: דברו
  choice: 自己的话
  rationale: דָּבָר 可指“话、言语、事情”。在与“律例、典章”的诗歌平行中，“话”既自然，又不把含义过早限定为某一条命令或某个信息。
- source_word: ליעקב
  choice: 向雅各
  rationale: 介词 ל 标示传达的对象；“雅各”与下句“以色列”平行，在这里共同指上帝的圣约子民。
- source_word: חקיו
  choice: 自己的律例
  rationale: חֹק 的复数带第三人称单数后缀，指他所制定的法规。“律例”是现代中文圣经语体中清楚而庄重的法律—圣约用语。
- source_word: ומשפטיו
  choice: 和典章
  rationale: מִשְׁפָּט 的复数在法律—圣约语境中可指判例、裁决、法则或规章。“典章”保留其规范性，并与“律例”构成自然的固定搭配；脚注注明其他可能译法。
- source_word: לישראל
  choice: 向以色列
  rationale: 介词 ל 再次标示领受者；“以色列”按标准中文译名处理，并与“雅各”形成诗歌同义平行。
theological_decisions:
- issue: “雅各／以色列”的群体含义
  choice: 正文直接译作“雅各”和“以色列”
  alternative: 译作“雅各的子孙／以色列民”
  rationale: 原文直接使用两个圣约名称。保留这些名称可维持诗歌的文学力度与平行结构，也避免在正文中加入解释性成分。
- issue: “话”与律法术语的关系
  choice: 保留较宽泛的“自己的话”
  alternative: 译作“自己的律法”或“自己的命令”
  rationale: דברו 本身并非专指“律法”；虽然后半句赋予明显的圣约—律法语境，正文仍应保留原词较宽的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“向……宣告……”在两行中补出谓语，以自然呈现希伯来诗歌的平行关系；第二处“宣告”属中文表达所需的省略补足。所有代词用“自己”明确回指上帝，同时不额外加入原文未明说的神名。
