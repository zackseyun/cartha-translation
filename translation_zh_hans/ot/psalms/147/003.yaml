  text: He heals the brokenhearted and binds up their wounds[a].
translation:
  language: zh_hans
  text: 他医治心碎的人，包扎他们的伤处[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的疼痛”或“他们的损伤”。这个希伯来词可指伤害或疼痛；正文译作“伤处”，是因为与“包扎”的意象相配。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹפֵא
  choice: 他医治
  rationale: רפא的Qal主动分词在本诗赞美语境中作描述性谓语，表达上帝一贯的作为；用现代汉语“他医治”自然清楚。
- source_word: לִשְׁבוּרֵי לֵב
  choice: 心灵破碎的人
  rationale: 原文直译为“心破碎的人”。“心灵破碎的人”保留破碎的比喻，同时自然表达内在的痛苦与创伤。
- source_word: וּמְחַבֵּשׁ
  choice: 包扎
  rationale: חבש的分词在医治语境中指包扎或裹伤；“包扎”保留具体的医疗意象，并与后面的“伤处”自然搭配。
- source_word: לְעַצְּבוֹתָם
  choice: 他们的伤处
  rationale: עַצֶּבֶת可指疼痛、伤痛或损伤。结合“包扎”的语境，“伤处”最贴合具体意象，同时不排除内心伤痛。
theological_decisions:
- issue: 医治意象的范围
  choice: 保留内心破碎与伤口包扎相互交织的意象，不限定为纯属灵医治或纯身体医治。
  alternative: 译成纯粹的内在安慰，或主要指身体医治。
  rationale: 诗句的平行结构把“心灵破碎”与“包扎伤处”并置，有意融合内在痛苦和身体受伤的意象；译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心灵破碎的人”比生硬的“心碎者”更自然；“包扎伤处”保留原文具体的医治图像。
