  text: שַׁבְּחִ֣י יְ֭רוּשָׁלִַם אֶת יְהוָ֑ה הַֽלְלִ֖י אֱלֹהַ֣יִ/ךְ צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/012.yaml
  text: Praise Yahweh[a], O Jerusalem; praise your God, O Zion.
translation:
  language: zh_hans
  text: 耶路撒冷啊，要颂赞雅威；锡安啊，要赞美你的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְּחִי
  choice: 要颂赞
  rationale: 这是阴性单数祈使式，呼唤拟人化的耶路撒冷。“颂赞”自然庄重，并与下半句的“赞美”形成近义平行，同时略微保留两个不同希伯来动词的差别。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代汉语通行的专名译法。
- source_word: אֶת יְהוָה
  choice: 雅威
  rationale: אֶת是直接宾语标记，不另行翻译；יְהוָה是神的专名，正文以“雅威”音译，直接保留原文的圣名。
- source_word: הַֽלְלִי
  choice: 要赞美
  rationale: 这是阴性单数祈使式，与前半句构成同义平行。“赞美”是现代汉语中清楚、自然的表达。
- source_word: אֱלֹהַיִךְ
  choice: 你的上帝
  rationale: 该词带阴性单数第二人称后缀；此处虽有复数形态，却指以色列的上帝，因此译作单数的“你的上帝”。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代汉语通行的专名译法；它与“耶路撒冷”平行，指拟人化的城市及其群体。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”可让读者看见此处是专名，而不是普通称号；同时不采用“上主”来替代原文神名，也不把学界通常重构的读音说成绝对确定。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。两个呼格分别以前置专名加“啊”呈现，保留希伯来诗歌的平行结构；用“颂赞／赞美”对应两个近义动词，避免机械重复，又不夸大其语义差异。
