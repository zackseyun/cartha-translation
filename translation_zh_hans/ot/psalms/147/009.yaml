  text: נוֹתֵ֣ן לִ/בְהֵמָ֣ה לַחְמָ֑/הּ לִ/בְנֵ֥י עֹ֝רֵ֗ב אֲשֶׁ֣ר יִקְרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/009.yaml
  text: He gives food to the animals[b][a], and to the young ravens that cry out.
translation:
  language: zh_hans
  text: 他赐食物给走兽，也赐给啼叫的雏鸦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雏鸦”原文直译为“乌鸦的众子”；“啼叫”原文没有明说它们向谁呼叫。
    reason: 说明希伯来语惯用表达，并保留呼叫对象未明的原文特点。
lexical_decisions:
- source_word: נוֹתֵן
  choice: 他赐
  rationale: 这是动词 נתן 的 Qal 主动分词；在本诗赞美上帝的语境中，用现代汉语现在时的“他赐”自然表达其持续、惯常的作为。
- source_word: לִבְהֵמָה
  choice: 给走兽
  rationale: בְּהֵמָה 可泛指兽类，也可特指牲畜；此处与雏鸦平行，宜取较宽泛的“走兽”，且较“动物”更具诗体庄重感。
- source_word: לַחְמָהּ
  choice: 食物
  rationale: לֶחֶם 字面可指“饼”，也常泛指食物；用于兽类时译作“食物”准确自然。原文阴性单数物主后缀与 בְּהֵמָה 呼应，汉语无需明说“它的”。
- source_word: לִבְנֵי עֹרֵב
  choice: 给……雏鸦
  rationale: בְּנֵי 加动物名称常表示其幼雏；“雏鸦”简洁自然，保留原文具体意象。
- source_word: אֲשֶׁר יִקְרָאוּ
  choice: 啼叫的
  rationale: קרא 在此表示发声呼叫；原文没有明说呼叫的对象。“啼叫的”符合鸟类语境，同时不增补“向他”。
theological_decisions:
- issue: 是否明确说雏鸦向上帝呼求
  choice: 保留呼叫对象未明说：“啼叫的雏鸦”
  alternative: “向他呼求的雏鸦”
  rationale: 希伯来文只说 אֲשֶׁר יִקְרָאוּ（它们呼叫），没有宾语。虽然上下文将供应归于上帝，但译文不应把隐含关系改成明说，以保留原文的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“走兽”比“牲畜”更符合此处与雏鸦并列的广义用法；句式以两个“赐给”清楚呈现平行关系。脚注标记置于相关分句之后。
