  text: בּוֹנֵ֣ה יְרוּשָׁלִַ֣ם יְהוָ֑ה נִדְחֵ֖י יִשְׂרָאֵ֣ל יְכַנֵּֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/002.yaml
  text: Yahweh builds Jerusalem[b][a]; he gathers the outcasts of Israel.
translation:
  language: zh_hans
  text: '雅威重建耶路撒冷[a]；

    他聚集以色列中被赶散的人[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“建造耶路撒冷。”原文使用主动分词，可表达持续或一贯的行动；本节语境突出耶路撒冷的复兴。
    reason: lexical_alternative
  - marker: b
    text: “被赶散的人”也可译为“流散的人”“被驱逐的人”或“被放逐的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹנֵה
  choice: 重建
  rationale: 这是בנה的Qal主动分词，在这里以雅威为主语，表达持续或一贯的行动。结合本诗所写的复兴处境，“重建”自然传达修复、重新建立耶路撒冷之意；字面也可译为“建造”。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代汉语中通行的专名译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: נִדְחֵי
  choice: 被赶散的人
  rationale: 该词源于נדח，指被驱逐、赶走或分散的人。“被赶散的人”同时保留被迫离开与流散两层含义，避免将其限缩为正式遭放逐者。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代汉语中通行的民族及专名译法。
- source_word: יְכַנֵּס
  choice: 聚集
  rationale: כנס的Piel未完成式，意为召集、收聚；“聚集”简洁自然，也符合上帝使流散者归回的语境。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，并较贴近通常重构的读音。
- issue: בּוֹנֵה是否明确表达复兴或重建
  choice: 重建
  alternative: 建造
  rationale: 动词本身通常是“建造”，但在耶路撒冷和流散者重新聚集的并行语境中具有复兴意味。正文采用自然的“重建”，脚注保留较严格的字面译法，避免掩盖原词的语义范围。
translation_notes:
  register: 采用庄重而明白的现代标准汉语，并以诗行呈现平行结构。用“他”承接“雅威”，保持原文第二分句的自然推进；不额外说明这些人聚集到何处。
