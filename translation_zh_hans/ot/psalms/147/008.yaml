  text: הַֽ/מְכַסֶּ֬ה שָׁמַ֨יִם בְּ/עָבִ֗ים הַ/מֵּכִ֣ין לָ/אָ֣רֶץ מָטָ֑ר הַ/מַּצְמִ֖יחַ הָרִ֣ים חָצִֽיר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/008.yaml
  text: who covers the heavens with clouds[a], who prepares rain for the earth, who makes grass sprout on the mountains.
translation:
  language: zh_hans
  text: 他用云彩遮盖天空，为大地预备雨水，使群山长出青草。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְכַסֶּה
  choice: 遮盖
  rationale: 该分词表示遮盖或遮蔽；“遮盖”直接而自然地描写云彩布满天空。
- source_word: שָׁמַיִם
  choice: 天空
  rationale: 此处与云彩和降雨相连，所指是可见的天空；现代汉语用“天空”自然清楚，同时不削弱诗意。
- source_word: עָבִים
  choice: 云彩
  rationale: 该词指云或浓云；原文未必要求明确译出“浓厚”，故采用庄重而常用的“云彩”。
- source_word: מֵּכִין
  choice: 预备
  rationale: 使役形可表示预备、备妥或确立；与雨水搭配时，“预备”保留了有目的供应之意，又不作过度解释。
- source_word: לָאָרֶץ
  choice: 为大地
  rationale: 在天空、云雨及群山的广阔语境中，אֶרֶץ宜理解为“大地”，而非局部的“土地”。
- source_word: מָטָר
  choice: 雨水
  rationale: 该词通常意为雨；“雨水”在“为大地预备”之后符合现代汉语表达。
- source_word: מַּצְמִיחַ
  choice: 使……长出
  rationale: 该使役分词表示使植物萌生或生长；“使群山长出青草”既保留使役意义，也符合汉语习惯。
- source_word: הָרִים
  choice: 群山
  rationale: 该复数名词通常指山岭；“群山”自然体现复数，并保持诗歌画面。
- source_word: חָצִיר
  choice: 青草
  rationale: 该词可指草或草本植物；“青草”清楚易懂，也呈现山间植被生长的鲜活意象。
theological_decisions:
- issue: 一连串分词所表达的上帝行动
  choice: 用同一主语下连续的谓语“遮盖……预备……使……”表达
  alternative: 重复译作“那……的，那……的，那……的”
  rationale: 希伯来文的分词链承接上文，描写上帝持续而典型的护理作为。汉语以同一主语统摄三个并列动作，既保存联系和持续性质，也避免生硬重复。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。三个并列动作紧凑推进，保留原文从天空、雨水到群山青草的意象次序。英文资料中的脚注内容实际上对应末句而非“云彩”，且只是正文的释义性改述，不构成需要标注的实质异文，因此未设脚注。
