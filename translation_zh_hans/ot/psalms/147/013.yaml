  text: כִּֽי חִ֭זַּק בְּרִיחֵ֣י שְׁעָרָ֑יִ/ךְ בֵּרַ֖ךְ בָּנַ֣יִ/ךְ בְּ/קִרְבֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/013.yaml
  text: For he has strengthened the bars of your gates[b][a]; he has blessed your children within you.
translation:
  language: zh_hans
  text: 因为他使你城门上的门闩坚固；他赐福给你城中的儿女。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿子”。希伯来语 בנים 既可专指男性子嗣，也可泛指儿女或后代；这里是对一座城市说话，译作“儿女”较符合整体语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出对上文赞美呼吁的理由，保留希伯来语的因果关系。
- source_word: חִזַּק
  choice: 使……坚固
  rationale: חזק 的 Piel 完成式表示使之强固；与城门的门闩搭配自然，也保留行动已经成就的语气。
- source_word: בְּרִיחֵי
  choice: 门闩
  rationale: 指用来固定、封闭城门的横闩或闩杠；“门闩”在现代汉语中准确而简明。
- source_word: שְׁעָרָיִךְ
  choice: 你城门的
  rationale: 原文为复数名词并带第二人称阴性单数后缀，所指是被拟人化的耶路撒冷；汉语以“你城门的”自然表达所属关系。
- source_word: בֵּרַךְ
  choice: 赐福给
  rationale: ברך 的 Piel 完成式直接表示赐福；此译法庄重、通顺，并保留动作的完成性。
- source_word: בָּנַיִךְ
  choice: 你的儿女
  rationale: בנים 可专指儿子，也可统指儿女或后代；此处向城市说话，较可能泛指城中的居民或后代，因此译为“儿女”，并以脚注保留较窄的可能。
- source_word: בְּקִרְבֵּךְ
  choice: 你城中的
  rationale: 字面为“在你里面／在你当中”，后缀指被拟人化的城市；“你城中的”在汉语中清楚自然，并保持空间意义。
theological_decisions:
- issue: 第二人称阴性单数所指的拟人化城市
  choice: 用“你城门的”和“你城中的”继续直接称呼这座城市，不在本节补入“耶路撒冷”或“锡安”。
  alternative: 在译文中明说“耶路撒冷”或“锡安”。
  rationale: 希伯来语通过阴性单数后缀延续对城市的拟人化称呼；直接保留“你”既忠于语法，也避免加入本节未明说的专名。
- issue: בנים 在城市语境中的范围
  choice: 译作“儿女”，理解为城中的居民或后代，性别不限。
  alternative: 译作“儿子”。
  rationale: 该词既可指男性子嗣，也可作集合性称呼；城市拟人语境支持较广义的理解，但脚注保留“儿子”这一真实词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“使……坚固”保留使役意味；“你城门的门闩”与“你城中的儿女”清楚呈现城市拟人化。未为“你城中的”另加字面脚注，因为该表达已自然传达 בְּקִרְבֵּךְ 的“在你里面／当中”之义。
