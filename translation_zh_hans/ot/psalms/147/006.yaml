  text: מְעוֹדֵ֣ד עֲנָוִ֣ים יְהוָ֑ה מַשְׁפִּ֖יל רְשָׁעִ֣ים עֲדֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/006.yaml
  text: Yahweh lifts up the humble[b][a]; he brings the wicked down to the ground.
translation:
  language: zh_hans
  text: 雅威扶起谦卑的人[a]；他使恶人降到地上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扶起”也可译作“扶持”或“坚固”；“谦卑的人”也可理解为“困苦卑微的人”。
    reason: 保留 מְעוֹדֵד 与 עֲנָוִים 的词义幅度。
  - marker: b
    text: 直译“直到地上”，意为彻底降到地面。
    reason: 说明 עֲדֵי אָרֶץ 的直译及加强语气。
lexical_decisions:
- source_word: מְעוֹדֵד
  choice: 扶起
  rationale: 该词表示扶持、坚固或使人恢复；译作“扶起”既保留扶助之意，也与下半句“降到地上”形成鲜明的上下对照。
- source_word: עֲנָוִים
  choice: 谦卑的人
  rationale: 该词可指谦卑、温顺的人，也常兼有受苦、卑微之人的社会处境；正文采用现代汉语中清楚自然的“谦卑的人”，并以脚注保留另一层可能含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，而不以称号代替。
- source_word: מַשְׁפִּיל
  choice: 使……降到
  rationale: 该使役分词表示使之降低、降卑；与“扶起”构成平行反义，并保留上帝主动施行的含义。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是诗篇中该伦理类别简洁、自然的标准汉语表达。
- source_word: עֲדֵי אָרֶץ
  choice: 到地上
  rationale: 该短语直指“直到地/地面”，强化恶人被彻底降卑的图景；“降到地上”在现代汉语中自然且保留原有意象。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名；音译为“雅威”保留其作为以色列之上帝专名的性质，不以“主”这一称号替换。
- issue: עֲנָוִים 的道德与社会含义
  choice: 正文译“谦卑的人”，脚注保留“困苦卑微的人”
  alternative: 困苦的人；卑微的人；温顺的人
  rationale: 该词既可描述谦卑温顺的品格，也可指受压、处境卑微的人。正文采用与“恶人”相对且通顺的译法，同时不在脚注中消除其社会处境含义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。上下两分句以“扶起／降到地上”保留希伯来诗歌的反义平行；神名采用“雅威”。
