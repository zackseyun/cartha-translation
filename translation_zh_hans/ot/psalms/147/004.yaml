  text: מוֹנֶ֣ה מִ֭סְפָּר לַ/כּוֹכָבִ֑ים לְ֝/כֻלָּ֗/ם שֵׁמ֥וֹת יִקְרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/004.yaml
  text: He counts the number of the stars; he calls all of them by name.
translation:
  language: zh_hans
  text: 他数点众星的数目，逐一按名呼唤它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹנֶה
  choice: 数点
  rationale: 该分词表示数算、点数；“数点”自然凝练，也符合诗歌语体，并保留逐一计算的意味。
- source_word: מִסְפָּר לַכּוֹכָבִים
  choice: 群星的数目
  rationale: מִסְפָּר意为“数目、总数”，与מוֹנֶה构成“数点……的数目”的表达，突出精确计数，而不只是笼统知道众星。
- source_word: לְכֻלָּם
  choice: 它们……一一
  rationale: 原文意为“给它们所有的／给每一个”，用“一一”自然表达无一遗漏的周全与逐个意味。
- source_word: שֵׁמוֹת יִקְרָא
  choice: 命名
  rationale: קרא与“名字”连用时可表示叫名或命名；此处译为“命名”简洁自然，并保留神逐一赋名的可能语义。
theological_decisions:
- issue: 原文未明说主语
  choice: 用“他”承接上下文中的耶和华
  alternative: 明译为“耶和华”或“神”
  rationale: 希伯来文由上下文确定主语，却未在本节重复神名；使用“他”既使中文句子完整，也不增加原文未明说的称谓。
- issue: קרא שׁמות可理解为命名或按名呼唤
  choice: 正文采用“命名”
  alternative: “按名呼唤它们”
  rationale: 该搭配容许“命名”和“按名呼唤”的语义张力；“命名”贴近“名字”作为直接宾语的句法，但不据此扩展特定神学解释。
translation_notes:
  register: 采用现代、庄重而简明的诗歌语言。“群星”比“星星”更凝练庄重；“数点……的数目”有意保留希伯来文的强调式表达，“一一”则使后半句自然流畅。
