  text: עֱנ֣וּ לַ/יהוָ֣ה בְּ/תוֹדָ֑ה זַמְּר֖וּ לֵ/אלֹהֵ֣י/נוּ בְ/כִנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/007.yaml
  text: Sing to Yahweh with thanksgiving[b][a]; make melody to our God with the lyre.
translation:
  language: zh_hans
  text: 你们要以感恩向雅威歌唱[a]；要用里拉琴[b]向我们的神奏乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以感恩回应雅威”；希伯来语这个动词可指“回答、回应”，在这里可能带有回应式歌唱的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“琴”或“竖琴”；希伯来语 כִּנּוֹר 指一种弦乐器，更确切地说是里拉琴。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֱנוּ
  choice: 歌唱
  rationale: 该动词的基本义是“回答、回应”，但在音乐和敬拜语境中可指回应式歌唱；与下半句 זַמְּרוּ 平行，因此正文采用自然的“歌唱”，并以脚注保留“回应”的词义张力。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 ל 表示歌唱所朝向的对象；יהוה 作为神的专名音译为“雅威”。
- source_word: בְּתוֹדָה
  choice: 以感谢
  rationale: תוֹדָה 可指感谢、感恩或赞美；此处 ב 表示伴随或方式，“以感谢”既保留感恩含义，也符合现代汉语表达。
- source_word: זַמְּרוּ
  choice: 颂扬
  rationale: זמר 可指歌唱赞美或奏乐；因后接乐器说明，译作“颂扬”，并由“弹奏里拉琴”明确其音乐方式，避免与上半句“歌唱”机械重复。
- source_word: לֵאלֹהֵינוּ
  choice: 向我们的神
  rationale: 介词 ל 标示颂扬的对象；“我们的神”保留原文第一人称复数的群体归属意味。
- source_word: בְכִנּוֹר
  choice: 弹奏里拉琴
  rationale: כִּנּוֹר 是古代弦乐器，较准确地说是里拉琴；结合中文习惯，将介词结构译为“弹奏里拉琴”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的古代发音重构，同时不以称号替代专名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以感谢”保留原文的感恩重点；“歌唱／颂扬”呈现平行关系而避免重复。“里拉琴”较传统的“竖琴”精确，并通过脚注提供较熟悉的译法。
