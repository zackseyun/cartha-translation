  text: לֹ֤א בִ/גְבוּרַ֣ת הַ/סּ֣וּס יֶחְפָּ֑ץ לֹֽא בְ/שׁוֹקֵ֖י הָ/אִ֣ישׁ יִרְצֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/010.yaml
  text: He does not delight in the strength of the horse; he takes no pleasure in the legs of the man.
translation:
  language: zh_hans
  text: 他不喜爱马的力量，也不以人的双腿为乐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֶחְפָּץ
  choice: 喜爱
  rationale: 表达以某事为所悦、所看重；与后半句近义呼应，同时保持自然中文。
- source_word: גְבוּרַת הַסּוּס
  choice: 马的力量
  rationale: 直译该属格结构，保留古代战马所象征的军事力量这一语境含义，不额外解释进正文。
- source_word: שׁוֹקֵי הָאִישׁ
  choice: 人的双腿
  rationale: שׁוֹקֵי为双数/复数形式，指腿部，语境强调人的体能；译作“双腿”既具体又自然。
- source_word: יִרְצֶה
  choice: 以……为乐
  rationale: 在此表示悦纳、喜悦；与יֶחְפָּץ构成诗体平行，避免误译成单纯的意愿或选择。
theological_decisions:
- issue: 经文是否否定马力和人体能力本身
  choice: 保留“并不以此为乐/喜爱”的陈述，不扩写为对受造能力本身的谴责
  alternative: 译成“他厌恶马的力量和人的体能”
  rationale: 原文动词表达上帝不以这些为喜悦或倚重的对象，并未直接说这些事物本身邪恶；应保留其与上下文中敬畏和盼望上帝者的对比。
- issue: הָאִישׁ的定指性
  choice: 译作泛指的“人”
  alternative: 译作“那人”或“这个人”
  rationale: 希伯来诗歌中的定冠词可指类别或典型人物；此处并无特定男性先行对象，中文用泛指“人”最自然，也保留一般性。
translation_notes:
  register: 采用现代、庄重而清楚的诗体表达；两分句以“喜爱”和“以……为乐”形成近义平行。“双腿”具体呈现原文身体意象，不改写为较抽象的“体力”或“勇力”。
