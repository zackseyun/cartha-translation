base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/015.yaml
  text: He sends his command to the earth[b][a]; his word runs swiftly.
translation:
  language: zh_hans
  text: 他向大地发出命令[a]；他的话飞速奔行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “命令”或译“言语”。
    reason: lexical_alternative
  - marker: b
    text: “飞速”也可译“极其迅速”；希伯来语表达强调快速的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: 他……发出
  rationale: 分词在上下文中描述上帝持续施行的作为；用现代汉语的限定动词表达更自然。
- source_word: אִמְרָתוֹ
  choice: 他的命令
  rationale: 该词本义为所说的话、言语；在上帝向受造界发话且话语立即生效的语境中，“命令”能传达其施行效力，同时与后句的 דְּבָרוֹ 保持措辞差异。
- source_word: אָרֶץ
  choice: 向大地
  rationale: 介词方向由“发出”的汉语搭配体现；全诗语境指向受造世界，故“大地”比局部性的“土地”合适。
- source_word: עַד מְהֵרָה
  choice: 飞速
  rationale: 这一表达强调迅疾；“飞速”在现代汉语中简洁自然，也能修饰后面的奔行意象。
- source_word: יָרוּץ
  choice: 奔行
  rationale: 保留“跑、奔跑”的基本意象及对上帝话语的诗性拟人，不弱化为抽象的“生效”。
- source_word: דְּבָרוֹ
  choice: 他的话
  rationale: “话”自然表达此处的言语，与前句“命令”语义呼应而不完全重复。
theological_decisions:
- issue: 诗歌平行句中上帝话语的性质
  choice: 译作具有施行效力的“命令”和迅速奔行的“话”，不加入后期神学范畴。
  alternative: 两处均译为“话语”，或在正文中作明确的基督论解读。
  rationale: 本节直接描写上帝在创造和护理中有效的话语；译文应保留这种神学分量，但不应加入希伯来文本没有明说的位格化“道”之解释。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。分号保留希伯来诗句的平行结构；“奔行”保留原文拟人化的运动意象。
