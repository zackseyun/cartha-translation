  text: He throws down his ice like crumbs[b][a]; who can stand before his cold?
translation:
  language: zh_hans
  text: 他把冰抛下，如同碎屑[a]；谁能在他的寒冷面前站立[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同碎块”或“如同一口大小的饼块”。希伯来语描绘的是零碎的小块，可能让人联想到掰碎的饼。
    reason: lexical_alternative
  - marker: b
    text: 或译：“谁能抵挡他的寒冷？”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁלִיךְ
  choice: 撒下
  rationale: 该词为“抛、掷、投下”的使役分词；结合冰粒四散的诗歌画面，“撒下”在现代汉语中自然且形象。
- source_word: קַרְחוֹ
  choice: 他的冰块
  rationale: קֶרַח可指冰或霜；这里与“碎屑”的比喻及“撒下”搭配，“冰块”较具体，并保留指向上帝的物主后缀。
- source_word: כְפִתִּים
  choice: 如同碎屑
  rationale: פִּתִּים指碎块、小块，常用于掰碎的饼；“碎屑”保留零碎散落的形象，又不把所指过度限定为面包屑。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 直译为“在……面前”；在反问句中既自然，也保留面对强大力量的空间意象。
- source_word: קָרָתוֹ
  choice: 他的严寒
  rationale: קָרָה意为寒冷；“严寒”表达此处足以令人无法站立或承受的强烈寒冷，并保留物主关系。
- source_word: מִי יַעֲמֹד
  choice: 谁能……站立
  rationale: 字面为“谁会站立”；上下文含有“谁能承受”的语用意义，正文保留“站立”的希伯来意象，并用脚注说明另一种自然译法。
