  yaml_path: translation/ot/psalms/147/018.yaml
  text: He sends out his word and melts them; he makes his wind blow[a], and the waters flow.
translation:
  language: zh_hans
  text: 他发出自己的话，使它们融化；他使自己的风吹起来[a]，水就流淌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风”也可译作“灵”或“气息”。希伯来语原词可表达这些含义，但这里的天气景象更支持译作“风”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: 发出
  rationale: 该词为 שׁלח 的 Qal 未完成式第三人称阳性单数；诗歌语境中可表达上帝一贯或生动呈现的行动。“发出”保留具体动词意象，也与“话”自然搭配。
- source_word: דְּבָרוֹ
  choice: 自己的话
  rationale: דבר 可指“话、事情、命令”。此处上帝的话产生自然界的效果；译作“话”保留诗意及其中隐含的命令效力，不把含义限定为“命令”。反身领属形式使现代汉语指代清楚。
- source_word: וְיַמְסֵם
  choice: 使它们融化
  rationale: מסס 的 Hiphil 未完成式带第三人称阳性复数宾语后缀，意为“使它们融化”。“它们”承接上一节所描写的冰冻之物，避免在正文中明确补成原文没有重复出现的“冰雪”。
- source_word: יַשֵּׁב
  choice: 使……吹起
  rationale: 此处是 נשׁב 的 Hiphil 形式，表达使役意义“使……吹”。“吹起”在现代汉语中自然，并保留上帝主动支配天气的含义。
- source_word: רוּחוֹ
  choice: 自己的风
  rationale: רוּחַ 可指“风、气息、灵”。融化与流水构成直接的气象语境，因此正文采用“风”；其余真实可能义在脚注中保留。
- source_word: יִזְּלוּ
  choice: 流淌
  rationale: נזל 的 Qal 未完成式复数表示液体流动。“流淌”既自然又有诗意，不额外限定为涓流或奔流。
- source_word: מָיִם
  choice: 水
  rationale: מַיִם 在希伯来语中形态为复数或双数式，但现代汉语通常以不可数的“水”表达；动词语义已充分传达水流，不宜生硬译作“众水”。
theological_decisions:
- issue: רוּחוֹ 所指及其与上帝行动的关系
  choice: 自己的风
  alternative: 自己的灵；自己的气息
  rationale: 本节描写上帝使冰冻之物融化、风吹起、水流淌，直接语境支持“风”。但 רוּחַ 本身具有“风、气息、灵”的语义宽度，故不将其他可能性排除，而以脚注保存其词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“发出自己的话”保留神的话语产生实效的意象；“使它们融化”忠实保留原文复数代词及其对上节的回指；分号呈现两个紧密相连的神圣行动，末句用“就”自然表达随之发生的结果。
