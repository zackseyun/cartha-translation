base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/016.yaml
  text: He gives snow like wool[a]; he scatters frost like ashes.
translation:
  language: zh_hans
  text: 他赐下雪，如同羊毛；他撒布霜[a]，如同灰烬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“白霜”。
    reason: 词语כְּפוֹר既可指一般的霜，也可较具体地指白霜。
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: 他赐下
  rationale: 该词是נתן的Qal主动分词，在赞美诗的连续描述中表达上帝一贯的作为。译为“他赐下”既自然，也保留“给予”的基本含义。
- source_word: שֶׁלֶג
  choice: 雪
  rationale: 采用该词通常而直接的词义。
- source_word: כַּצָּמֶר
  choice: 如同羊毛
  rationale: 介词כ表示比喻；“如同羊毛”保留原文关于雪之形态与覆盖景象的诗意比较。
- source_word: כְּפוֹר
  choice: 霜
  rationale: 该词可泛指霜，也可特指白霜；正文用现代读者易懂的“霜”，更具体的译法列入脚注。
- source_word: כָּאֵפֶר
  choice: 如同灰烬
  rationale: 介词כ构成明喻；“灰烬”自然表达אֵפֶר所指的灰，并保留其铺散的视觉意象。
- source_word: יְפַזֵּר
  choice: 他撒布
  rationale: פזר的Piel未完成式表示使之散开、四处分布；“撒布”兼顾动作的生动性与分布范围。
