  yaml_path: translation/ot/psalms/147/014.yaml
  text: He makes your borders peaceful[a]; he satisfies you with the finest wheat.
translation:
  language: zh_hans
  text: 他使你的边境得享平安；他用上好的麦子[a]使你饱足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上好的麦子”直译为“麦子的脂肪”；这是希伯来语的习语，指最丰美、最优质的麦子。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  choice: 他使
  rationale: שׂוּם在此为分词，承接上文指向上帝；汉语用限定动词“使”自然表达“置于、使成为”的语境义。
- source_word: גְּבוּלֵךְ
  choice: 你的边境
  rationale: גְּבוּל可指边界、边境或疆域；这里带第二人称阴性单数后缀，所称对象是耶路撒冷。“边境”既保留领土边界的意象，也适合与太平搭配。
- source_word: שָׁלוֹם
  choice: 安享太平
  rationale: שָׁלוֹם涵盖和平、安宁与福祉。原文简洁地将“边境”与“平安”并置；“使你的边境安享太平”在现代汉语中自然，并保留其和平安稳之意。
- source_word: חֵלֶב
  choice: 上好的
  rationale: 字面为“脂肪、肥美部分”，用于食物时指最丰美、最优质的部分；译作“上好的”可自然传达该希伯来习语。
- source_word: חִטִּים
  choice: 麦子
  rationale: חִטִּים特指小麦；“麦子”是现代汉语中自然、准确的集合性表达。
- source_word: יַשְׂבִּיעֵךְ
  choice: 使你饱足
  rationale: 这是שׂבע的使役式，意为使人吃饱、满足；“使你饱足”同时保留食物供应与充分满足的含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“安享太平”避免生硬直译为“把平安设为你的边界”，同时保留边境蒙赐和平安稳的诗意；“饱足”较“满足”更贴合麦子所表达的饮食语境。
