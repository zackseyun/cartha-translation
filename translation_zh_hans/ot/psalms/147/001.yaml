  text: הַ֥לְלוּ יָ֨הּ כִּי ט֭וֹב זַמְּרָ֣ה אֱלֹהֵ֑י/נוּ כִּֽי נָ֝עִים נָאוָ֥ה תְהִלָּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/001.yaml
  text: Praise Yah[a], for it is good to sing praises to our God[b]; for it is pleasant and praise is fitting.
translation:
  language: zh_hans
  text: 你们要赞美雅[a]！向我们的上帝歌颂是美好的；赞美是令人喜悦、合宜的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”是希伯来语神名的短式；“哈利路亚”含有“赞美雅”之意。许多译本译作“耶和华”或“主”。
    reason: alternative_reading
  - marker: b
    text: “合宜的”也可译作“美好的”或“优美的”；原词可表示相称得体，也可表示美观可爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: 你们要赞美
  rationale: 这是הלל的复数祈使式；用“你们要赞美”保留面向群体的直接呼召。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的短式，而非四字神名的完整形式；音译为“雅”既保留原文形式，也显明其与“哈利路雅”的联系。
- source_word: כִּי טוֹב
  choice: 实在美好
  rationale: כִּי在这里可引出理由，也带肯定语气；“实在美好”以自然汉语表达歌颂上帝这件事是好的。
- source_word: זַמְּרָה
  choice: 歌颂
  rationale: 该词源自זמר，兼有歌唱、奏乐赞美之意；“歌颂”简洁保留音乐性与敬拜指向。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 准确表达带第一人称复数后缀的形式。
- source_word: נָעִים
  choice: 令人喜悦
  rationale: 表达愉悦、甜美、可喜的性质；用现代汉语“令人喜悦”自然承接赞美这一行为。
- source_word: נָאוָה
  choice: 合宜
  rationale: 该词可指合适、相称，也可能侧重美好；正文采用“合宜”，保留其伦理与礼仪上的相称感。
- source_word: תְהִלָּה
  choice: 赞美他
  rationale: 名词意为“赞美”；汉语补出宾语“他”，使句子自然，并依上下文明确赞美的对象是上帝，而不改变所指。
theological_decisions:
- issue: 神名短式יָהּ的译法
  choice: 雅
  alternative: 耶和华；主
  rationale: 原文使用神名短式יָהּ。音译“雅”可避免把短式与完整四字神名混同，并保留“哈利路雅”中该成分的礼仪联系。
- issue: נָאוָה的语义侧重
  choice: 合宜
  alternative: 美好；优美
  rationale: 该词兼有相称、合适与美观之意。正文选“合宜”，但以脚注保留审美方面的真实词义可能性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。首句保留复数祈使语气；分号对应诗句两部分的推进。正文避免生硬复制希伯来语序，同时以脚注保存神名形式及נָאוָה的语义张力。
