  text: זָ֘כַ֤ר חַסְדּ֨/וֹ וֶֽ/אֱֽמוּנָת/וֹ֮ לְ/בֵ֪ית יִשְׂרָ֫אֵ֥ל רָא֥וּ כָל אַפְסֵי אָ֑רֶץ אֵ֝֗ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/003.yaml
  text: He has remembered his steadfast love and his faithfulness to the house of Israel[a]; all the ends of the earth have seen the salvation of our God.
translation:
  language: zh_hans
  text: '他记念了自己对以色列家的慈爱和信实；

    地极都看见了我们上帝的拯救[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们上帝的救援”；在诗篇语境中，这个希伯来词也可含有得胜施救的意味。
    reason: 说明יְשׁוּעָה的词义范围及其可能具有的得胜色彩。
lexical_decisions:
- source_word: זָכַר
  choice: 记念了
  rationale: 该词为Qal完成式第三人称阳性单数，表示已经成就的行动；“记念”保留了希伯来语中不只是想起、也包含顾念并采取行动的意味。
- source_word: חַסְדּוֹ
  choice: 自己的慈爱
  rationale: חֶסֶד在这里指持久可靠、带有盟约关系色彩的爱；“慈爱”自然庄重，并避免将含义缩窄为一般的怜悯。
- source_word: וֶאֱמוּנָתוֹ
  choice: 和信实
  rationale: אֱמוּנָה与חֶסֶד并列，强调可靠与忠诚；“信实”准确表达这种关系性含义。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 对以色列家
  rationale: 介词לְ在此表示关系或指向；“对以色列家”符合现代汉语，也保留了以色列作为上帝慈爱和信实所指向对象的含义。
- source_word: רָאוּ
  choice: 都看见了
  rationale: 该词为Qal完成式第三人称复数，描述全地已经目睹上帝施行拯救；“看见了”自然表达其完成性。
- source_word: כָל אַפְסֵי אָרֶץ
  choice: 大地四极
  rationale: 这是指世界最遥远各处的希伯来语表达；“大地四极”简洁、庄重，并传达普世范围。
- source_word: אֵת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，其语法功能由汉语语序体现。
- source_word: יְשׁוּעַת
  choice: 拯救
  rationale: יְשׁוּעָה可指拯救、救援，也可能带有得胜意味；正文采用含义较宽的“拯救”，不将其限定为军事胜利。
- source_word: אֱלֹהֵינוּ
  choice: 我们上帝的
  rationale: 与יְשׁוּעַת构成属格结构，直译为“我们上帝的拯救”，可指属于上帝或由上帝成就的拯救，而不必进一步限定关系。
theological_decisions:
- issue: חֶסֶד与אֱמוּנָה的盟约色彩
  choice: 译为“慈爱”和“信实”
  alternative: “怜悯”和“诚实”，或“守约的爱”和“信实”
  rationale: 所选词语保留上帝对以色列持久可靠的爱与忠诚，同时不在正文中加入原文未明说的“守约”一词。
- issue: יְשׁוּעַת אֱלֹהֵינוּ的意义范围
  choice: 译为“我们上帝的拯救”
  alternative: “我们上帝的救援”或“我们上帝的胜利”
  rationale: 原文容许广义的拯救、救援，并可能包含得胜色彩，但并未要求将其限定为军事胜利；“拯救”保留了原文的神学广度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“记念”保留圣诗语体及行动性含义；“大地四极”呈现原文的诗歌意象。脚注标记置于其实际说明的“拯救”之后。
