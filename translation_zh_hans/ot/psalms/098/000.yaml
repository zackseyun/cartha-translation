base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/000.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have brought him salvation.
translation:
  language: zh_hans
  text: 一篇诗。你们要向耶和华唱新歌，因为他行了奇妙的事；他的右手和圣洁的膀臂为他施行了拯救[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使他得胜”或“为他赢得了胜利”。希伯来文直译近于“为他施行了拯救”；此处表达耶和华以自己的能力成就拯救或胜利。
    reason: 说明 הוֹשִׁיעָה לּוֹ 的特殊表达，并保留“拯救”与“得胜／胜利”的可译语义范围。
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 一篇诗
  rationale: 作为诗题，简洁表达“诗歌、诗篇”，不额外补入作者或礼仪背景。
- source_word: יהוה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行的专名形式，明确对应神圣四字名。
- source_word: שִׁיר חָדָשׁ
  choice: 新歌
  rationale: 直接保留希伯来语意象，表达因上帝的新作为而发出的赞美。
- source_word: נִפְלָאוֹת
  choice: 奇妙的事
  rationale: 涵盖令人惊奇、超乎寻常的大能作为，不限缩为某一种神迹。
- source_word: יְמִינוֹ וּזְרוֹעַ קָדְשׁוֹ
  choice: 他的右手和圣臂
  rationale: 保留源文平行的人体意象，指向耶和华自己的能力；“圣臂”比解释性改写更贴近原文。
- source_word: הוֹשִׁיעָה לּוֹ
  choice: 为他成就了拯救
  rationale: 保留动词“拯救”和介词“为他”的不寻常结构，同时以自然中文表达他的能力亲自取得了拯救或胜利。
theological_decisions:
- issue: “为他成就了拯救”中受益者及其含义
  choice: 保留“为他”并译作“成就了拯救”
  alternative: “使他得胜”或“为他赢得了胜利”
  rationale: 希伯来语 הוֹשִׁיעָה לּוֹ 可表达“为他施行拯救”“使他得胜”。正文保留救恩词汇和指向耶和华自身的代词，脚注说明胜利层面的可能含义，避免把诗句只限定为军事得胜。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“你们要”明确复数命令语气；分号保留因由与结论之间的诗性推进。脚注标记置于其实际解释的末句之后。
