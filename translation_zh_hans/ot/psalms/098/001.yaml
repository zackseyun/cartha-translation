  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/001.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have worked salvation for him.
translation:
  language: zh_hans
  text: 一首诗。你们要向耶和华唱新歌，因为他行了奇妙的事；他的右手和他圣洁的膀臂为他成就了拯救。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“救了他”，或“为他赢得了拯救”。这里的希伯来语表达也可按诗歌语境理解为：耶和华以自己的右手和圣洁的膀臂成就了拯救或胜利。
    reason: 保留 הוֹשִׁיעָה לּוֹ 在字面句法和诗歌语境中的不同可能表达，避免正文将其受益关系或结果预先限定为单一解释。
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 一篇诗歌
  rationale: 这是诗篇标题中的体裁标记；“一篇诗歌”简明自然，也保留其音乐与诗体性质。
- source_word: שִׁירוּ לַיהוָה
  choice: 你们要向耶和华唱
  rationale: שִׁירוּ是复数命令式，明确译出“你们要”；ל表示歌唱的对象。神名按其专名译为“耶和华”。
- source_word: שִׁיר חָדָשׁ
  choice: 新歌
  rationale: 直译且符合现代汉语宗教诗歌语体；汉语中无须添加不定冠词。
- source_word: נִפְלָאוֹת עָשָׂה
  choice: 他行了奇妙的事
  rationale: 保留完成行动及令人惊奇的含义；“行了奇妙的事”庄重而通顺。
- source_word: הוֹשִׁיעָה לּוֹ
  choice: 为他施行了拯救
  rationale: 尽量贴近“为他成就/施行拯救”的希伯来语表达，不把其含义单一定为军事性的“得胜”；较直白的其他理解收入脚注。
- source_word: יְמִינוֹ וּזְרוֹעַ קָדְשׁוֹ
  choice: 他的右手和圣臂
  rationale: 保留原文拟人化的能力意象及诗句平行结构；“圣臂”简洁地表达“他圣洁的膀臂”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文圣经语境中“耶和华”广为人知，并清楚作为专名出现；不以“主”取代原文神名。
- issue: הוֹשִׁיעָה לּוֹ所表达的拯救对象或受益关系
  choice: 为他施行了拯救
  alternative: 救了他；为他赢得了胜利
  rationale: 原句字面形式可令人理解为“救了他”或“为他取得拯救/胜利”，而语境强调耶和华凭自己的能力成就拯救。正文保留“为他”的张力，不把它悄然解释成单一含义，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。正文保留“右手”“圣臂”的希伯来诗歌意象，并用“你们”体现复数命令。脚注标记置于相关末句之后。
