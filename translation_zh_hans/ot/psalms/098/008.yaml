  yaml_path: translation/ot/psalms/098/008.yaml
  text: Let the rivers clap their hands[a]; let the mountains sing for joy together,
translation:
  language: zh_hans
  text: 愿江河拍掌；愿群山一同欢呼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“欢唱”。这个希伯来语动词可指喜乐的呼喊，也可指欢欣的歌唱。
    reason: 保留יְרַנֵּנוּ可表示欢欣歌唱的词义可能。
lexical_decisions:
- source_word: נְהָרוֹת
  choice: 江河
  rationale: 该复数名词指河流；“江河”在现代汉语中自然庄重，也适合诗篇中受造界共同颂赞的宏阔意象。
- source_word: יִמְחֲאוּ כָף
  choice: 要拍掌
  rationale: מחא כף是“拍掌”的惯用表达。原文用单数“掌”构成习语，汉语直接译作“拍掌”最自然，并保留拟人化意象。“要”在上下文中表达诗歌性的号召。
- source_word: יַחַד
  choice: 一同
  rationale: 直译为“一同、一起”，修饰群山的欢唱，表现受造界齐声赞美。
- source_word: הָרִים
  choice: 群山
  rationale: 该名词意为“山”；复数译作“群山”，既准确又符合汉语诗歌语感。
- source_word: יְרַנֵּנוּ
  choice: 要……欢唱
  rationale: רנן的加强词干可指发出喜乐的呼声，也可指欢欣歌唱。“欢唱”与拍掌的诗歌平行结构协调；脚注保留“欢呼”这一真实的词义可能。
theological_decisions:
- issue: 受造界赞美上帝的诗歌性拟人
  choice: 直接保留“江河拍掌、群山欢唱”的拟人意象
  alternative: 抽象地解释为大自然激发人类赞美
  rationale: 希伯来文直接把江河和群山描写为参与欢庆的主体。保留这一意象忠实呈现诗歌力度，同时不额外引入神学解释。
- issue: יְרַנֵּנוּ所表达的是歌唱还是欢呼
  choice: 正文译为“欢唱”
  alternative: 译为“欢呼”
  rationale: 该动词的语义范围兼有欢欣歌唱和喜乐呼喊。正文采用符合诗歌平行关系的“欢唱”，并用脚注明确另一种可能，避免消除原文的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“江河”“群山”形成整齐对应；保留原文简洁有力的拟人表达。脚注标记置于其实际说明的“欢唱”之后。
