  terminology: “号筒”对应חֲצֹצְרוֹת，“角号”对应שׁוֹפָר，能保留两种乐器的区分；“耶和华”保留四字神名；“君王”恰当地呈现הַמֶּלֶךְ的神圣王权称号。脚注应避免将שׁוֹפָר绝对限定为羊角，说明其通常或常可指羊角号即可。
