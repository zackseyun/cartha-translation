  text: בַּ֭/חֲצֹ֣צְרוֹת וְ/ק֣וֹל שׁוֹפָ֑ר הָ֝רִ֗יעוּ לִ/פְנֵ֤י הַ/מֶּ֬לֶךְ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/006.yaml
  text: With trumpets and the sound of the horn[a], raise a shout before the King, Yahweh.
translation:
  language: zh_hans
  text: 用号筒和角号[a]的声音，在君王耶和华面前欢呼！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“羊角号”。希伯来语שׁוֹפָר常指羊角号，与本节前面提到的号筒不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲצֹצְרוֹת
  choice: 伴着号筒
  rationale: חֲצֹצְרוֹת指号筒，通常是直身的金属乐器，与后面的שׁוֹפָר有别。前缀ב在这里表示伴随或凭借的方式。原文没有“银”字，因此不增译“银号”。
- source_word: וְקוֹל שׁוֹפָר
  choice: 和角号的声音
  rationale: קוֹל意为“声音”，שׁוֹפָר指用兽角制成的号，常为羊角号。译作“角号”既保留与חֲצֹצְרוֹת“号筒”的区别，也不把器物材质或种类限定得超过原文；较具体的“羊角号”列入脚注。
- source_word: הָרִיעוּ
  choice: 欢呼
  rationale: 这是רוע的使役词干复数命令式，在本诗庆贺赞美的语境中表示发出响亮的欢呼或喝彩。“欢呼”简洁自然，也体现此处公开颂赞君王的语气。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: לִפְנֵי表示“在……面前”或“在……的临在中”；此译法直接、自然。
- source_word: הַמֶּלֶךְ
  choice: 君王
  rationale: 定冠词所标示的“王”在此用作神的称号。“君王”在现代汉语中庄重而清楚，并与随后的神名构成同位关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名יהוה，不用“主”这一称号替代神名。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代简体中文圣经语境中“耶和华”辨识度高，能保留其作为专名的性质；“雅威”是更贴近学界常见拟音的可行替代。
- issue: “君王”与“耶和华”的关系
  choice: 同位结构：“君王耶和华”
  alternative: 调整为“耶和华君王”或“耶和华这位君王”
  rationale: 希伯来语הַמֶּלֶךְ יְהוָה自然可理解为同位语，即认定耶和华就是那位君王。按原有次序译作“君王耶和华”，既保留这种关系，也不额外解释。
translation_notes:
  register: 采用现代、庄重而适合诗歌朗读的普通话。“伴着……的声音”保留原文对声音的明确表达；句末用感叹号体现复数命令式的庆贺呼召，但不另加原文没有明说的对象。
