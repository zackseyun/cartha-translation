base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/005.yaml
  text: Sing praises to Yahweh with the lyre[b][a], with the lyre and the sound of song.
translation:
  language: zh_hans
  text: 你们要用琴[a]向雅威歌颂；用琴和歌唱的声音[b]歌颂他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琴”：希伯来文为 kinnor，指古代的一种弦乐器，传统上也译作“竖琴”。
    reason: lexical_alternative
  - marker: b
    text: “歌唱的声音”：或译“乐曲的声音”或“旋律之声”；原文直译为“歌唱（或旋律）的声音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: 歌颂
  rationale: 该词是זמר的皮勒式复数祈使，表达以歌唱、奏乐来赞美；“歌颂”在现代汉语中自然地保留了赞美的指向。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל表示歌颂所朝向的对象；将四字神名יהוה音译为“雅威”，保留经文中的专名。
- source_word: בְּכִנּוֹר
  choice: 弹琴
  rationale: כִּנּוֹר指古代弦乐器，介词ב在此表示所用的乐器。正文用自然的汉语“弹琴”，脚注说明其历史含义；原文的重复也予以保留。
- source_word: וְקוֹל זִמְרָה
  choice: 伴着歌声
  rationale: קוֹל可指声音，זִמְרָה可指歌唱、乐曲或旋律。“伴着歌声”保留听觉意象，并使整行诗句在现代汉语中顺畅；脚注列出更贴近字面的译法。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近学界常见复原读音的“雅威”，不以称号替代专名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们要”明确复数祈使语气；分号和第二个“要弹琴”呈现希伯来诗歌的重复与节奏，不将两个“琴”合并。
