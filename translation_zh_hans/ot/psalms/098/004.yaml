base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/004.yaml
  text: Shout joyfully to Yahweh[a], all the earth[b]; break forth and sing for joy and make music.
translation:
  language: zh_hans
  text: 全地啊，要向雅威[a]欢呼！要放声欢唱，歌颂赞美[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译自希伯来文的神名 יהוה；传统上也译作“耶和华”或以“上主”代称。
    reason: divine_name
  - marker: b
    text: “歌颂赞美”也可译作“奏乐颂赞”；原词可指歌唱，并可能包含乐器伴奏。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִיעוּ
  choice: 欢呼
  rationale: 该词的使役式命令语气在敬拜语境中指发出响亮、喜乐或得胜的呼喊；“欢呼”自然简洁，并保留命令的力度。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 ל 表示呼喊所指向的对象；以“向”准确表达方向关系，并将四字神名音译为“雅威”。
- source_word: כָּל הָאָרֶץ
  choice: 全地啊
  rationale: 本诗召唤普世颂赞，אָרֶץ 在此宜理解为整个大地，而非某一局部地区；呼语形式符合希伯来诗歌语气。
- source_word: פִּצְחוּ
  choice: 放声
  rationale: פצח 描写突然迸发出歌声或欢呼；“放声”在现代汉语中自然地保留这种不受抑制、迸发而出的意象。
- source_word: וְרַנְּנוּ
  choice: 欢唱
  rationale: רן 的加强式可指发出喜乐的呼声或欢欣歌唱；“欢唱”既体现喜乐，也与前面的“欢呼”有所区分。
- source_word: וְזַמֵּרוּ
  choice: 歌颂赞美
  rationale: זמר 在颂赞语境中可指歌唱赞美，也可能包含乐器伴奏；正文采用自然、庄重的“歌颂赞美”，并在脚注保留较宽的音乐含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为专有名的性质，不以称号替代，也不在经文中加入原文没有的解释。
translation_notes:
  register: 采用现代、庄重而适合朗诵的诗歌语言。“全地啊”突出普世性的呼召；连续使用“欢呼、放声欢唱、歌颂赞美”，保留原文逐步铺陈的三个命令，同时避免生硬直译。
