  yaml_path: translation/ot/psalms/098/002.yaml
  text: Yahweh has made his salvation known[b][a]; before the eyes of the nations he has revealed his righteousness.
translation:
  language: zh_hans
  text: 耶和华使人知道他的拯救；他在列国眼前[a]显明了他的公义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在列国面前”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“正义”。希伯来语原词可依语境表示公义、正义，或被显明为正当、获得昭雪。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中广为识别的专名“耶和华”对应四字神名，避免用称号“主”取代原文中的名字。
- source_word: הוֹדִיעַ
  choice: 使人知道
  rationale: 保留ידע使役式“使……知道”的意义，同时符合现代汉语表达。
- source_word: יְשׁוּעָתוֹ
  choice: 他的拯救
  rationale: “拯救”既可指施救行动，也保留救恩含义；本诗语境虽容许“胜利”或“解救”，但不宜在正文中过度收窄。
- source_word: לְעֵינֵי
  choice: 在……眼前
  rationale: 保留希伯来语“在眼前”的形象，也自然表达公开可见之意。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 此处泛指以色列以外的各国；“列国”符合诗歌体裁，也避免“外邦人”可能带来的后期宗教色彩。
- source_word: גִּלָּה
  choice: 显明了
  rationale: 此处Piel词形表示揭示、公开显露；“显明”与上句“使人知道”形成自然平行。
- source_word: צִדְקָתוֹ
  choice: 他的公义
  rationale: צדקה在此可涵盖公义、正义以及上帝在拯救中彰显的正直；“公义”保留其较广的伦理与神学张力。
theological_decisions:
- issue: 拯救语境中צִדְקָה的译法
  choice: 他的公义
  alternative: 他的正义
  rationale: 正文采用“公义”，以免把词义限缩为司法性或报应性的正义；脚注保留“正义”这一合理译法，不把拯救、公义与伸张正当权利之间的张力静默消解。
- issue: 神名的表达
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非称号；中文正文保留专名。“耶和华”在现代中文圣经语境中识别度高，但“雅威”是更接近学界常见拟音的可行形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留希伯来诗句的平行结构。正文中的脚注标记按所注词语依次排列；分号呈现两个平行分句间的紧密关系。
