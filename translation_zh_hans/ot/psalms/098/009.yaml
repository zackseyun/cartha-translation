id: PSA.98.9
reference: Psalms 98:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לִֽ/פְֽנֵי יְהוָ֗ה כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בְּ/מֵישָׁרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/009.yaml
  text: before Yahweh[a], for he comes to judge the earth; he will judge the world with righteousness[e][d][c][b], and the peoples with equity.
translation:
  language: zh_hans
  text: 在雅威[a]面前，因为他来审判大地[b]；他必按公义审判世界[c]，按公正审判万民[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在雅威面前”也可译作“在雅威的临在中”。本句开头在语法和诗意上承接上一节的欢呼。
    reason: lexical_alternative
  - marker: b
    text: “他来”也可译作“他正要来审判大地”。希伯来文在诗歌中可用这种形式表达临近或确定的行动。
    reason: lexical_alternative
  - marker: c
    text: “世界”所译的希伯来词侧重有人居住的世界。
    reason: lexical_alternative
  - marker: d
    text: “按公正”也可译作“正直地”或“按公平”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 这个由“面”构成的介词短语表示“在某者面前、在某者的临在中”。译作“在……面前”自然且保留其空间与关系含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接译出四字神名，而不以称号代替；“雅威”是现代汉语中清楚、庄重的音译。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前文欢庆的原因；“因为”清楚表达因果关系。
- source_word: בָא
  choice: 他来
  rationale: 完成式在诗歌语境中可生动表达确定或临近的行动；“他来”保留这种鲜明表达，不武断限定为过去或将来。
- source_word: לִשְׁפֹּט
  choice: 审判
  rationale: שׁפט可涵盖施行判断、治理和伸张正义；本节以公义和公正为审判方式，因此“审判”最直接，也不把含义缩窄为定罪。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 与“世界”和“万民”平行，所指范围是全地，并非某一片土地；“大地”符合诗体且含义清楚。
- source_word: יִשְׁפֹּט
  choice: 他必……审判
  rationale: 未完成式承接“他来”，指向确定将施行的行动；“必”兼顾未来性与确定性。
- source_word: תֵּבֵל
  choice: 世界
  rationale: 该词通常指有人居住的世界；“世界”是自然简洁的现代汉语表达。
- source_word: בְּצֶדֶק
  choice: 按公义
  rationale: 介词 בְ 表示施行审判的方式或准则；“按公义”自然地表达其道德正直与合宜。
- source_word: עַמִּים
  choice: 万民
  rationale: 复数指各族群、各民；“万民”在汉语诗体中自然地表达众多不同人民，并与全地范围相称。
- source_word: בְּמֵישָׁרִים
  choice: 按公正
  rationale: 该复数名词表示正直、公平；在司法语境中，“按公正”清楚自然，并与“按公义”形成平行。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；以“主”代称
  rationale: 原文直接使用四字神名。音译为“雅威”保留其作为以色列之神专名的性质，不以称号替代。
- issue: שׁפט 所表达的神圣审判
  choice: 审判
  alternative: 治理；为人伸冤
  rationale: 本节描写雅威以公义和公正面对全地。“审判”同时容纳追究、裁断、伸张正义和恢复正当秩序的张力，不把含义限于定罪或行政治理。
- issue: בָא 的时间与体貌
  choice: 他来
  alternative: 他已经来了；他正要来
  rationale: 诗歌中的完成式可把临近或确定之事描写得如同已然发生。“他来”保留这种开放性；脚注说明其他可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。保留本节开头承接上一节的句法，不擅自把上一节的动词补入正文；以分号呈现因由与两行平行审判宣告。
