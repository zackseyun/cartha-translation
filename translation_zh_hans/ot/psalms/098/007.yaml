  text: יִרְעַ֣ם הַ֭/יָּם וּ/מְלֹא֑/וֹ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/007.yaml
  text: Let the sea roar[a], and all that fills it[b], the world and those who dwell in it.
translation:
  language: zh_hans
  text: 愿大海和其中所充满的一切[a]轰鸣；愿世界[b]和住在其中的人也轰鸣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其中所充满的一切”直译为“它的丰满”，指海里所有的一切。
    reason: lexical_alternative
  - marker: b
    text: “世界”也可译为“有人居住的世界”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  choice: 澎湃作响
  rationale: רעם表示发出雷鸣般的巨响；以“澎湃作响”配合“海”，既传达宏大的声响，也保持诗歌语言的自然。未完成式在赞美诗的劝愿语境中译为“愿……”。
- source_word: הַיָּם
  choice: 海
  rationale: יָם的常规对应词，简洁自然，符合诗歌语体。
- source_word: וּמְלֹאוֹ
  choice: 其中所充满的一切
  rationale: 字面为“它的丰满／充满之物”，后缀指向“海”；此译自然表达海中所有的一切，同时保留“充满”的意象。
- source_word: תֵּבֵל
  choice: 世界
  rationale: תֵּבֵל指有人居住、秩序井然的世界；“世界”简洁自然，且下句“住在其中的人”明确其有人居住的含义。
- source_word: וְיֹשְׁבֵי בָהּ
  choice: 住在其中的人
  rationale: 较贴近分词结构“其中的居住者”，并保留其动词意味。
theological_decisions:
- issue: 后半句是否补出表示发声的谓语
  choice: 补译“也都欢呼”
  alternative: 仅作名词性并列：“世界和住在其中的人”
  rationale: 希伯来文只在前半句明说“发出巨响”，后半句可理解为共用该谓语。中文若完全照搬会显得悬置；“欢呼”按赞美诗语境自然补明其诗意，但属于语境性补译，故加脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“愿……都……”表达赞美诗中未完成式的劝愿语气；分号呈现两组平行成分。
