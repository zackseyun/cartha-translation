  text: כִּֽי אָ֭מַרְתִּי פֶּן יִשְׂמְחוּ לִ֑/י בְּ/מ֥וֹט רַ֝גְלִ֗/י עָלַ֥/י הִגְדִּֽילוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/016.yaml
  text: For I said, “Otherwise they would rejoice over me; when my foot slips, they boast against me.”
translation:
  language: zh_hans
  text: 因为我说过：“免得他们因我欢喜；我的脚一滑，他们便在我面前自高。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: 不然……会
  rationale: 此处表示诗人所担心并力求避免的结果；用“不然……会”自然传达其预防性语气，而不把它误作单纯的时间或条件关系。
- source_word: יִשְׂמְחוּ לִי
  choice: 因我欢喜
  rationale: 介词 לִי 在此表达以诗人的遭遇为幸灾乐祸的缘由或对象；“因我欢喜”保留原文关系，措辞也庄重自然。
- source_word: בְּמוֹט רַגְלִי
  choice: 我的脚一滑
  rationale: מוֹט 指摇动、失稳或滑跌；“脚一滑”保留具体意象，也可承载受挫、失足的比喻意味。
- source_word: עָלַי הִגְדִּילוּ
  choice: 向我夸耀
  rationale: 该表达字面有“向我自大/逞强”之意，语境中指敌人在诗人失足时得意夸口；“向我夸耀”保留行为指向，避免增添原文未明说的内容。
theological_decisions:
- issue: “脚滑”的具体所指
  choice: 保留“我的脚一滑”的形象表达
  alternative: 译为“我一失败”或“我一跌倒”
  rationale: 原文既可描述困境中的失稳，也可能含道德或处境上的失足意味；不将其限定为某一种神学解释。
- issue: 敌人的反应
  choice: 译为“向我夸耀”
  alternative: 译为“在我面前妄自尊大”或“向我夸口”
  rationale: 原文强调敌人借诗人的失足而自高；当前译法保留这种张力，又不额外断定其夸耀的具体内容。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“因为我曾说”承接上文祈求的理由；引语内部以“不然”呈现诗人所惧怕的后果。
