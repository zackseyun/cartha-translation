  yaml_path: translation/ot/psalms/038/022.yaml
  text: Hurry to help me[a], Lord[b], my salvation.
translation:
  language: zh_hans
  text: 主啊，我的拯救[b]，求你快来[a]帮助我！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赶快来帮助我。”
    reason: lexical_alternative
  - marker: b
    text: “我的拯救”也可译作“我的解救”；原文以这个名词直接称呼主。
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּשָׁה
  choice: 快来
  rationale: 该祈使式表达催促、赶快之意。“快来”用现代汉语自然地传达诗人恳求上帝迅速施援的迫切感；其中“来”顺应下文“帮助我”的汉语表达。
- source_word: לְעֶזְרָתִי
  choice: 帮助我
  rationale: 原文直译近于“为着我的帮助／到我的援助这里”。译作“帮助我”符合现代汉语习惯，同时保留直接求助的含义。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是用于称呼上帝的神圣称号。译作“主啊”既准确表达呼格语气，也不额外强调原文在此处未着重凸显的领属意义。
- source_word: תְּשׁוּעָתִי
  choice: 我的拯救
  rationale: 该名词可指拯救、救助或解救。“我的拯救”保留原文以抽象名词称呼上帝的诗性表达和较宽广的神学含义，避免改写成“拯救我的那一位”而消除原有张力。
theological_decisions:
- issue: 如何处理 אֲדֹנָי 与 תְּשׁוּעָתִי 的并列称呼
  choice: “主啊，我的拯救”
  alternative: “主啊，你是我的拯救”
  rationale: 原文将“主”和“我的拯救”并列，用后者直接称呼上帝，没有明写系词。正文保留这一浓缩的诗性结构，不把它明确扩展成判断句。
- issue: “我的拯救”是抽象事物还是对上帝的称呼
  choice: 保留“我的拯救”这一名词性称呼
  alternative: “拯救我的主”或“拯救我的那一位”
  rationale: 原文将“我的拯救”置于对上帝的呼告中，既可表达上帝是拯救的源头，也可强调拯救本身在于上帝。直译能够保留这种神学厚度，而不限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈祷语体。将呼告置于句首，使中文节奏自然；保留“我的拯救”这一略带张力的名词性称呼，并用感叹号体现全诗结尾的迫切祈求。
