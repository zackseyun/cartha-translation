  text: כִּֽי אֲ֭נִי לְ/צֶ֣לַע נָכ֑וֹן וּ/מַכְאוֹבִ֖/י נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/017.yaml
  text: For I am ready to fall, and my pain is always before me.
translation:
  language: zh_hans
  text: 因为我快要跌倒，我的痛苦常在我面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְצֶלַע
  choice: 跌倒
  rationale: צלע在此处语义有争议，可指跛行、踉跄或失足跌倒；结合介词结构לְצֶלַע נָכוֹן，译作“快要跌倒”自然表达诗人濒临倒下的状态，也与本节平行的持续痛苦相称。
- source_word: נָכוֹן
  choice: 快要
  rationale: 该词基本义为“稳固、确定、预备好”；在此与לְצֶלַע连用，表示某事迫近、随时可能发生，汉语用“快要”表达最自然。
- source_word: מַכְאוֹבִי
  choice: 我的痛苦
  rationale: מַכְאוֹב可指身体疼痛或广义苦痛；上下文兼有身体与精神困苦，采用涵盖面较广的“痛苦”，不限定为单纯肉体疼痛。
- source_word: נֶגְדִּי תָמִיד
  choice: 常在我面前
  rationale: 保留希伯来语的空间隐喻，表示痛苦始终摆在诗人眼前、无法摆脱；“常”对应תָמִיד。
theological_decisions:
- issue: 诗人的“跌倒”应理解为身体倒下、道德失足还是遭灾败落
  choice: 保留“跌倒”的多义性
  alternative: 译作“跛行”或“踉跄”以限定为身体状态
  rationale: 原词及诗歌语境容许身体衰弱与处境败落相互交叠；正文不将其专门解释为道德犯罪，也不排除身体层面的含义。
translation_notes:
  register: 采用现代、凝练而庄重的诗体表达。“常在我面前”略带经典诗歌色彩，但在现代普通话中仍清楚自然，并保留原文意象。
