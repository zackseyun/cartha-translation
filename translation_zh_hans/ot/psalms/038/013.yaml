  text: וַ/אֲנִ֣י כְ֭/חֵרֵשׁ לֹ֣א אֶשְׁמָ֑ע וּ֝/כְ/אִלֵּ֗ם לֹ֣א יִפְתַּח פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/013.yaml
  text: But I[a], like a deaf man, do not hear; and like a mute man[b], I do not open my mouth.
translation:
  language: zh_hans
  text: 但我像聋人一样，听不见；又像不能说话的人一样——他不开口[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里从第一人称“我听不见”转为第三人称“他不开口”，可能是继续描述比喻中的不能说话的人。也可顺译为“我不开口”。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַאֲנִי
  choice: 但我
  rationale: 连词与独立代词结合，在上下文中突出诗人与敌对者的对比；“但我”自然表达这一转折。
- source_word: כְחֵרֵשׁ
  choice: 像聋人一样
  rationale: 前缀 כְּ 表示比拟，חֵרֵשׁ 指耳聋的人；译文保留明喻和单数人物形象。
- source_word: לֹא אֶשְׁמָע
  choice: 听不见
  rationale: שׁמע 的基本义是“听见”。这里也暗含诗人对指控不作回应，但译文保留听觉意象，不将含义明确化为“不理会”。
- source_word: וּכְאִלֵּם
  choice: 又像哑巴一样
  rationale: אִלֵּם 指不能说话的人，与“聋人”构成平行；“哑巴”是简洁、通俗且保留身体意象的现代汉语表达。
- source_word: לֹא יִפְתַּח פִּיו
  choice: 他不开口
  rationale: 希伯来文在此使用第三人称单数动词和第三人称物主后缀，直译为“他不开他的口”。译文以“他不开口”保留这一人称转换和原文惯用语。
theological_decisions: []
