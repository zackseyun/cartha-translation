  yaml_path: translation/ot/psalms/038/019.yaml
  text: And my enemies are alive and strong[a], and those who hate me falsely are many.
translation:
  language: zh_hans
  text: 我的仇敌活着，且强盛；虚假地恨我的人越来越多[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无故恨我的人越来越多。”希伯来语“虚假”也可表示他们的仇恨出于谎言，或没有根据。
    reason: 保留 שָׁקֶר 在“虚假地／出于谎言”与“无故、没有根据”之间的词义可能性。
lexical_decisions:
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: 该名词指与诗人敌对的人；“我的仇敌”直接、庄重，也符合现代汉语表达。
- source_word: חַיִּים
  choice: 活着
  rationale: 该形容词在此修饰“仇敌”，可指活着或充满活力；译作“活着”保留其基本词义，并与诗人自身衰弱的处境形成可能的对照。
- source_word: עָצֵמוּ
  choice: 强盛
  rationale: 该动词表示变得强大、有势力；“强盛”既可涵盖力量，也可涵盖势力，适合这里对仇敌现状的描述。
- source_word: רַבּוּ
  choice: 越来越多
  rationale: 该动词表示增多或成为众多；“越来越多”在现代汉语中自然地保留其动态意味。
- source_word: שֹׂנְאַי
  choice: 恨我的人
  rationale: 原文为作名词用的分词，译作“恨我的人”可保留其动作意味，而不与前面的“仇敌”简单重复。
- source_word: שָׁקֶר
  choice: 以虚假
  rationale: 该词本义为“虚假、谎言”，在这里带有副词性质。“以虚假”保留原词的语义范围，不把它单一定为“无故”；另一种理解见脚注。
