  text: וּ/מְשַׁלְּמֵ֣י רָ֭עָה תַּ֣חַת טוֹבָ֑ה יִ֝שְׂטְנ֗וּ/נִי תַּ֣חַת רדופ/י טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/020.yaml
  text: And those who repay evil for good oppose me[a], because I pursue what is good.
translation:
  language: zh_hans
  text: 那些以恶报善的人与我为敌[a]，因为我追求良善。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们因我追求良善而与我为敌。”更贴近原文可译作：“他们以与我为敌回报我对良善的追求。”
    reason: 保留第二个 תַּחַת 所表达的回报关系及其可作因由理解的语义幅度。
lexical_decisions:
- source_word: וּמְשַׁלְּמֵי
  choice: 那些……报……的人
  rationale: 分词指作出回报的人；“以恶报善”既保留报偿、回报之意，也符合现代汉语习惯。
- source_word: רָעָה
  choice: 恶
  rationale: 保留该词的道德含义，并与“善”形成鲜明对照。
- source_word: תַּחַת
  choice: 以……报……；因为
  rationale: 第一次表示交换或回报关系，译作“以恶报善”；第二次在正文中按语境显明其因由关系，译作“因为”，同时用脚注保留较贴近字面的表达。
- source_word: טוֹבָה
  choice: 善
  rationale: 指所受或所得的好处、善行；简洁的“善”与“恶”对应，又不过度限定为恩惠或利益。
- source_word: יִשְׂטְנוּנִי
  choice: 与我为敌
  rationale: שׂטן 在此表示敌对、作对；“与我为敌”保留其对抗性，不收窄为法律上的控告，也不强化为情感上的憎恨。
- source_word: רְדָפִי
  choice: 我追求
  rationale: רָדַף 的基本义是追赶、追求；此处表达积极追随良善，译作“追求”自然且忠实。
- source_word: טוֹב
  choice: 良善
  rationale: 形容词在此名词化，指良善之事或善道；“良善”可自然充当“追求”的宾语，并区别于前句作为回报对象的“善”。
theological_decisions:
- issue: 第二个 תַּחַת 短语的语义关系
  choice: 因为我追求良善
  alternative: 他们因我追求良善而与我为敌／他们以与我为敌回报我对良善的追求
  rationale: 此处可理解为敌对行为是对诗人追求良善的回应，并由此传达因由。正文采用自然的现代汉语“因为”，脚注则保留原文更明确的回报关系，避免把希伯来语的张力完全消解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以恶报善”是通行而准确的表达；“与我为敌”比“反对我”更能体现 שׂטן 的敌对意味，同时避免引入特定法律场景。
