  text: יְֽהוָ֗ה אַל בְּ/קֶצְפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וּֽ/בַ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], nor discipline me in your wrath.
translation:
  language: zh_hans
  text: 耶和华啊[a]，求你不要在怒气中责备我，也不要在烈怒中管教我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为神名“YHWH”（四字神名），传统音译作“耶和华”，也常音译作“雅威”。
    reason: 说明神名的原文形式及主要音译选择。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代中文通行的专名“耶和华”呈现四字神名，并用“啊”表达希伯来诗歌中的直接呼告。
- source_word: אַל
  choice: 求你不要
  rationale: אַל与未完成式动词构成禁止或恳求；在祷告语境中，“求你不要”自然地传达诗人的哀求语气。
- source_word: בְּקֶצְפְּךָ
  choice: 在怒气中
  rationale: 保留介词בְּ及קֶצֶף所表达的愤怒、震怒之意，同时采用自然庄重的现代中文。
- source_word: תוֹכִיחֵנִי
  choice: 责备我
  rationale: יכח的使役式在此指责备、申斥或纠正；“责备”准确且能与下半句“管教”形成诗体平行。
- source_word: וּבַחֲמָתְךָ
  choice: 也不要在烈怒中
  rationale: ו承接前面的否定，在中文中以“也不要”表达；חֵמָה比一般怒气更强，“烈怒”保留其强烈程度。
- source_word: תְיַסְּרֵנִי
  choice: 管教我
  rationale: יסר的加强式表示以惩戒施行纠正或训诲；“管教”在现代中文中清楚保留其纠正性，而不限定具体方式。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最为通行、普通读者最易辨识的专名“耶和华”，并以脚注说明原文形式及另一常见音译，不以“主”这一称号取代专名。
- issue: 诗人的请求是否反对一切责备与管教
  choice: 保留“在怒气中／在烈怒中”对两个动词的限定
  alternative: 理解为求神完全不要责备或管教
  rationale: 希伯来文的平行结构把重点放在责备与管教施行时的忿怒状态；译文不额外断定诗人拒绝一切神圣纠正，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言；两行以“在……中……我”保持希伯来诗歌的平行关系，并用“怒气／烈怒”和“责备／管教”体现词义递进。
