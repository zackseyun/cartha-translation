  text: כִּֽי כְ֭סָלַ/י מָלְא֣וּ נִקְלֶ֑ה וְ/אֵ֥ין מְ֝תֹ֗ם בִּ/בְשָׂרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/007.yaml
  text: For my loins are filled with burning[b][a], and there is no soundness in my flesh.
translation:
  language: zh_hans
  text: 因为我的腰间[a]满是灼热[b]，我的肉身没有一处完好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“胁腹”或“髋部”；希伯来语指腰、胁腹一带。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来语词含义疑难，也可理解为“炎症”或“烧灼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明诗人痛苦的缘由；现代汉语中“因为”自然保留解释关系。
- source_word: כְסָלַי
  choice: 我的腰间
  rationale: כֶּסֶל 指腰、胁腹或髋部一带；“腰间”既保留身体部位的具体性，也不把范围限定得过窄。
- source_word: מָלְאוּ
  choice: 充满
  rationale: 忠实表达 מלא 的“满了、充满”之意，并与后面的痛苦状态自然搭配。
- source_word: נִקְלֶה
  choice: 灼痛
  rationale: 此词含义疑难；在全节身体受苦的语境中，很可能指灼热、炎症一类痛苦。“灼痛”不擅自补出原文没有明确说出的“疮”，同时保留身体症状的具体感。
- source_word: וְאֵין מְתֹם
  choice: 没有一处完好
  rationale: מְתֹם 在身体语境中表示健全、完好。汉语用“没有一处完好”自然表达全身毫无健全部位。
- source_word: בִּבְשָׂרִי
  choice: 我的肉体
  rationale: 此处 בָּשָׂר 指诗人的实际身体；“肉体”保留原文的身体性和具体措辞，并非神学隐喻。
theological_decisions:
- issue: 身体受苦语境中 בְּשָׂרִי 的含义
  choice: 按字面译作“我的肉体”
  alternative: “我的身体”
  rationale: 本节描写腰间的病痛和身体毫无完好之处，没有理由将其解释为道德或神学意义上的“肉体”。
- issue: 疑难词 נִקְלֶה 是否明确指疮
  choice: 译作“灼痛”，不在正文补出“疮”
  alternative: “炎症”“灼热的疮”或抽象意义的“卑劣”
  rationale: 身体病痛的上下文支持灼热或炎症类含义，但该词本身并未明确说“疮”；正文保留适度含混，并以脚注交代其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文先陈述腰间病痛、再扩展至全身不完好的结构；“没有一处完好”比生硬的“没有健全”更符合现代汉语。
