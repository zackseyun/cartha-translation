  text: 大卫的[a]诗，为记念[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的”也可理解为“由大卫所作”“归于大卫”或“献给大卫”；希伯来文标题格式可表示作者、归属、关联或题献。
    reason: alternative_reading
  - marker: b
