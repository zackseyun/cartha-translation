    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中常见的体裁名称。现代中文《诗篇》的语境里，“诗”简洁、自然，也比“旋律”或泛称“歌曲”更合适。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 标题中的 לְ 可表示作者、归属、关联或题献。“大卫的”保留了这种范围，避免把意思限定为“由大卫所作”或“献给大卫”。
- source_word: לְהַזְכִּיר
  choice: 为记念而作
  rationale: 这是 זכר 的使役词干不定式，作目的说明。译文保留“记念”的宽泛含义，不具体断定是谁记念、使谁想起，或其礼仪用途为何；补入“而作”使中文标题自然。
