base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/012.yaml
  text: Those who seek my life set traps[a], and those who seek my harm speak destruction[d][c][b]; all day long they mutter deceit.
translation:
  language: zh_hans
  text: 那些要取我性命[a]的人设下圈套[b]；那些企图加害我的人说出毁灭之言[c]，终日喃喃说着诡诈的话[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“寻求我生命（或灵魂）的人”；这里指企图夺取我的性命。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“布下网罗”；原文动词带有设网诱捕的意象。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“说出败亡之言”或“说出灾祸的话”。原词可指毁灭、败亡或灾祸。
    reason: lexical_alternative
  - marker: d
    text: “喃喃说着”所译的动词也可表示“低声说”“默想”或“思谋”；这里与“诡诈”连用，指持续发出或盘弄诡诈的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: 要取我性命的人
  rationale: נפשׁ 字面可指“生命、性命、自己”或“魂”；在敌意语境中与“寻求”连用，意为企图夺取说话者的性命。译文采用现代汉语中清楚自然的“要取我性命”。
- source_word: וַיְנַקְשׁוּ
  choice: 设下圈套
  rationale: נקשׁ 在此带有设网罗、诱捕的意象。“设下圈套”既保留暗中捕害的画面，也比单说“陷害”更贴近原文。
- source_word: וְדֹרְשֵׁי רָעָתִי
  choice: 企图加害我的人
  rationale: דרשׁי רעה 表达追求或寻求使某人受害、遭祸。“企图加害我”自然地传达持续的恶意，而不把 רעה 窄化为某一种具体伤害。
- source_word: דִּבְּרוּ הַוּוֹת
  choice: 说着毁灭人的话
  rationale: הַוּוֹת 可指毁灭、灾祸或导致败亡之事。此译保留其强烈的破坏性，同时用“人的”补足现代汉语表达，避免生硬的“说毁灭”。
- source_word: וּמִרְמוֹת
  choice: 诡诈
  rationale: מִרְמוֹת 是复数形式，可指各种欺骗、诡计或奸诈之事；汉语“诡诈”可作集合表达，兼顾欺骗与阴险谋害。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁而庄重地表达“整天、一天到晚”的持续意味，适合诗歌语体。
- source_word: יֶהְגּוּ
  choice: 低声盘算
  rationale: הגה 可表示低声说、喃喃念叨、默想或思谋。结合宾语“诡诈”，译作“低声盘算”保留低声言语与内心筹谋之间的张力，而脚注注明其词义范围。
