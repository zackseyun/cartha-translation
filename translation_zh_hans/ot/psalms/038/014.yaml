  text: And I became like a man who does not hear[a], and in whose mouth there are no reproofs.
translation:
  language: zh_hans
  text: 我便像一个听不见的人，口中也没有辩驳的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“责备的话”“争辩”或“答辩”。希伯来语这个词既可指纠正、责备，也可指反驳性的回应。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: 我便像
  rationale: 该词是היה的第一人称单数连续式，可表示“我就成了／我便是”。汉语以“我便像”自然承接上下文，同时表达进入所述状态，不把连接词强解为转折。
- source_word: כְּאִישׁ
  choice: 像一个……的人
  rationale: אִישׁ为阳性单数，但此处是代表性的个体比较；现代汉语用“一个……的人”既保留单数，又自然庄重。
- source_word: אֲשֶׁר לֹא שֹׁמֵעַ
  choice: 没有听见的人
  rationale: שׁמע可指“听见”或“听从”。“没有听见”避免加入原文未明说的生理失聪能力，也与下半句不作回应相称；其语义张力仍保留。
- source_word: וְאֵין בְּפִיו
  choice: 口中也没有
  rationale: 保留אֵין的存在否定及“在他口中”的身体性言语意象；“也”自然表达两分句的并列关系。
- source_word: תּוֹכָחוֹת
  choice: 辩驳
  rationale: 该复数名词可指责备、争辩、答辩或反驳。在受人攻击却沉默的语境中，“辩驳”最自然地表达反驳性的言语，同时脚注保留其他可能。
theological_decisions: []
