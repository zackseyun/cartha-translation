  register: 采用现代、庄重而易懂的诗歌语言。“怦怦直跳”具体传达身体痛苦；“力量离开了我”和“眼中的光……不再与我同在”则保留希伯来语拟人化、略带陌生感的诗性表达。分号呈现本节由心、力量到眼睛的递进。
