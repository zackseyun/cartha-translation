  yaml_path: translation/ot/psalms/038/010.yaml
  text: My heart throbs[a]; my strength has left me[b], and the light of my eyes—even they are not with me.
translation:
  language: zh_hans
  text: 我的心悸动[a]；我的力量离开了我；我眼中的光，也不与我同在[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的心昏乱”或“我的心发晕”。原词含旋转、骚动之意；这里可能描写心跳的紊乱，也可能描写人眩晕不安。
    reason: lexical_alternative
  - marker: b
    text: “眼中的光”既可指视力，也可指眼中显出的光彩或生命活力。原文后接复数代词“他们／它们”，可能照应“眼睛”；本译文省略该代词，以在自然汉语中保留这一诗意表达的开放性。
    reason: lexical_and_grammatical_ambiguity
lexical_decisions:
- source_word: לִבִּי
  choice: 我的心
  rationale: לֵב在此指人的内在生命和身体感受；结合全节的病痛语境，译作“我的心”既直接又自然。
- source_word: סְחַרְחַר
  choice: 怦怦直跳
  rationale: 该词含旋转、躁动之意；在力量消失、眼中无光的身体困境中，很可能描写心脏剧烈而紊乱地跳动。“怦怦直跳”用现代汉语传达这种身体感，同时以脚注保留“昏乱、发晕”的可能。
- source_word: עֲזָבַנִי כֹחִי
  choice: 我的力量离开了我
  rationale: עָזַב意为离开、撇下；以“力量”为主语时，直译为“离开了我”自然且保留诗性，不额外加入关系性或盟约性的“离弃”含义。
- source_word: וְאוֹר עֵינַי
  choice: 我眼中的光
  rationale: 这一表达可指视力，也可指眼中显出的光彩与生命活力。“眼中的光”在中文中保留诗歌意象及原文的多义性。
- source_word: גַּם הֵם אֵין אִתִּי
  choice: 也不再与我同在
  rationale: 保留אֵין אִתִּי“并不与我同在”的空间性诗语；中文省去代词，可避免原文复数代词与“光”这一单数概念之间在译文中产生生硬冲突，同时由“也”传达גַּם的强调和递进。
theological_decisions: []
