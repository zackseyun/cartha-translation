  text: כִּֽי חִ֭צֶּי/ךָ נִ֣חֲתוּ בִ֑/י וַ/תִּנְחַ֖ת עָלַ֣/י יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/002.yaml
  text: For your arrows have sunk into me[b][a], and your hand has come down on me.
translation:
  language: zh_hans
  text: 因为你的箭已经刺入我身[a]，你的手[b]压在我身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词基本意为“降下、落下”；用于箭时，按上下文可表达箭已刺入或扎入诗人之中。
    reason: lexical_alternative
  - marker: b
    text: “你的手”保留原文的具体意象，描写神的手施加在诗人身上的力量；本节没有进一步明说这是审判、惩罚还是管教。
    reason: theological_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为诗人的哀诉说明缘由，保留因果关系。
- source_word: חִצֶּיךָ
  choice: 你的箭
  rationale: 直译复数名词及第二人称单数后缀，保留神施加痛苦的战争意象；汉语中“箭”可作集合性表达。
- source_word: נִחֲתוּ בִי
  choice: 射入我身
  rationale: נחת的基本意象是向下、降下；与“箭”和בִי连用时，语境描绘箭进入并留在诗人身上。“射入”在现代汉语中自然地传达这一画面，但“射”也略带由主语和语境补出的动作色彩，故附注说明原文。
- source_word: וַתִּנְחַת עָלַי
  choice: 重压在我身上
  rationale: 同一词根转用于“手”，表达从上而下落在诗人身上的力量。“重压”自然传达压迫感，同时不将其抽象解释为审判或管教。
- source_word: יָדֶךָ
  choice: 你的手
  rationale: 保留原文具体的拟人意象，不改译为“能力”“审判”等解释性词语。
theological_decisions:
- issue: 神行动的拟人化表达
  choice: 正文保留“你的手”
  alternative: 你的能力／你的审判
  rationale: 原文以具体身体意象描写神主动施加的力量；直保留该意象可避免把含义限定为某种教义解释。
- issue: 箭与手所指痛苦的性质
  choice: 不在正文中明确解释为惩罚、审判或管教
  alternative: 把意象明说为神的惩罚或管教
  rationale: 上下文可使读者联想到神所施的苦难，但本节本身只使用“箭”和“手”的诗性意象，应保留其张力与开放度。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两分句都保留向下施力的平行意象；前句用“射入”呈现箭进入身体的画面，后句用“重压”呈现手落下所带来的沉重力量。所有脚注标记均已置于正文相应位置。
