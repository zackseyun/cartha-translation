  yaml_path: translation/ot/psalms/038/005.yaml
  text: My wounds stink and fester because of my foolishness[a].
translation:
  language: zh_hans
  text: 我的伤口因我的愚妄而发臭、溃烂。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבְאִישׁוּ
  choice: 发臭
  rationale: 该词在使役词干中表示变得气味难闻；“发臭”自然、鲜明，保留希伯来文令人厌恶的感官力度。
- source_word: נָמַקּוּ
  choice: 溃烂
  rationale: 该动词表示消融、腐坏或朽烂；用于伤口时，“溃烂”符合现代汉语搭配，也准确传达伤势腐败恶化。
- source_word: חַבּוּרֹתַי
  choice: 我的伤口
  rationale: 此词可指伤痕、鞭痕、青肿或创伤。结合“发臭、溃烂”的语境，“伤口”最贴切；具体伤痕类型仍具一定词义弹性。
- source_word: מִפְּנֵי
  choice: 都是因
  rationale: 此处介词短语表达原因。“都是因”清楚连接伤口的状态与说话者的愚妄，并使中文语势自然。
- source_word: אִוַּלְתִּי
  choice: 我的愚妄
  rationale: 该名词指愚昧、愚妄，常含道德意味。“愚妄”比单纯的无知更能保留这种意味，又不把它窄化为某一特定罪行。
theological_decisions:
- issue: 苦难与个人愚妄之间的因果关系
  choice: 都是因我的愚妄
  alternative: 因我的愚昧
  rationale: 经文明说诗人的伤势与他自己的愚妄有关。译文保留这一自我归因，却不将其扩展为关于一切苦难来源的普遍教义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“发臭溃烂”简洁保留两个并列动词的强烈身体意象；“都是因”凸显原文的因果关系，但不作超出本节的神学推论。
