  yaml_path: translation/ot/psalms/038/008.yaml
  text: I am faint and utterly crushed; I roar because of the groaning of my heart.
translation:
  language: zh_hans
  text: '我衰弱不堪，被压垮到极点；

    我因内心的呻吟而吼叫。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְפוּגוֹתִי
  choice: 我衰弱不堪
  rationale: 该词表示衰弱、无力或麻木；“衰弱不堪”自然传达诗人精疲力竭的状态，同时不把含义限定为单纯昏厥。
- source_word: וְנִדְכֵּיתִי עַד־מְאֹד
  choice: 被压垮到极点
  rationale: נִדְכֵּיתִי 是受压、被碾碎的被动形态，עַד־מְאֹד 加强到极度；此译保留强烈的受创意象。
- source_word: שָׁאַגְתִּי
  choice: 我……吼叫
  rationale: 该动词常指狮子的吼叫，也可形容人在剧痛中的大声号叫；“吼叫”保留原文不同于普通呻吟的强度。
- source_word: מִנַּהֲמַת לִבִּי
  choice: 因内心的呻吟
  rationale: 介词 מִן 在此表达缘由；נַהֲמָה 可指呻吟、哀鸣或低吼。“内心的呻吟”保留内在痛苦与外在吼叫之间的张力。
