  text: אֲֽדֹנָ/י נֶגְדְּ/ךָ֥ כָל תַּאֲוָתִ֑/י וְ֝/אַנְחָתִ֗/י מִמְּ/ךָ֥ לֹא נִסְתָּֽרָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/009.yaml
  text: Lord[a], all my desire is before you[b], and my groaning is not hidden from you.
translation:
  language: zh_hans
  text: 主啊，我一切的渴望[a]都在你面前；我的叹息[b]也没有向你隐藏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“心愿”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“呻吟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 原文是对上帝的直接称呼，使用的是“主”这一称号，而非神名 יהוה；“主啊”自然保留了呼语语气。
- source_word: נֶגְדְּךָ
  choice: 在你面前
  rationale: 表达处于上帝面前、在其察看之中的意思；此译法自然，并保留诗人心愿完全向上帝敞开的意象。
- source_word: כָל
  choice: 一切
  rationale: 明确保留原文的整体性，表示诗人的渴望无一不在上帝面前。
- source_word: תַּאֲוָתִי
  choice: 我的渴望
  rationale: 在哀歌语境中指迫切的愿望或盼望，而非感官欲求；“渴望”既自然，又能传达其强度。
- source_word: וְאַנְחָתִי
  choice: 我的叹息
  rationale: 该词指痛苦中发出的叹息或呻吟；“叹息”适合现代汉语诗歌语体，同时保留内在与可听见的悲苦表达。
- source_word: מִמְּךָ
  choice: 向你
  rationale: 与“隐藏”连用，表示上帝是不能被隐瞒的对象；汉语惯用“向你隐藏”，比逐字译作“从你隐藏”自然。
- source_word: לֹא נִסְתָּרָה
  choice: 没有隐藏
  rationale: 原文尼法勒式表达被动或状态意义，即这叹息并未对上帝隐而不见；此译法在汉语中简洁自然。
theological_decisions:
- issue: 此处以 אֲדֹנָי 称呼上帝，而非使用神名 יהוה
  choice: 主啊
  alternative: 耶和华啊
  rationale: 原文使用的是表示主权的称号 אֲדֹנָי，不是四字神名；因此译为“主”，避免把两者混同。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“主啊”保留直接祷告的语气；分号呈现两个平行分句。“渴望”和“叹息”符合哀歌语境，并通过脚注保留可行的词义选择。
