  yaml_path: translation/ot/psalms/038/018.yaml
  text: For I confess my iniquity[b][a]; I am anxious because of my sin.
translation:
  language: zh_hans
  text: '因为我承认自己的罪孽[a]；

    我因自己的罪而忧虑[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我陈明自己的罪孽”。希伯来语动词的字面意思是“使人知道”或“陈明”；正文的“承认”反映本诗的悔罪语境。
    reason: lexical_alternative
  - marker: b
    text: 或译“我因自己的罪而不安”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 这里引出诗人前述言行的理由；“因为”在现代汉语中自然保留了原文的因果连接作用。
- source_word: עֲוֺנִי
  choice: 自己的罪孽
  rationale: עָוֹן可指罪行，也可兼含罪责；“罪孽”保留其较强的道德分量，而“自己的”清楚表达第一人称所属。
- source_word: אַגִּיד
  choice: 我要承认
  rationale: נגד的使役词干本义为“使人知道、陈明”。以个人罪孽为宾语，又处于悔罪诗的语境中，“承认”自然传达认罪之意；脚注保留较为字面的译法。
- source_word: אֶדְאַג
  choice: 忧虑
  rationale: דאג表示忧愁、挂虑或内心不安；“忧虑”简洁表达诗人因罪而有的持续内在困扰。
- source_word: מֵחַטָּאתִי
  choice: 因自己的罪
  rationale: 介词מִן在这里表示原因或缘由，因此译作“因”；חַטָּאת采用直接、通行的“罪”。
theological_decisions:
- issue: 悔罪语境中“陈明罪孽”与内心忧虑的关系
  choice: 译为诗人承认自己的罪孽，并因自己的罪而忧虑。
  alternative: 可较为字面地译作诗人“陈明”自己的罪孽，并为自己的罪“不安”或“愁苦”。
  rationale: “承认”符合以个人罪孽为宾语的悔罪语境，但正文没有增添完整的悔改教义或罪得赦免的结论；“忧虑”也保留诗人内在困扰的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。上下两行保持简洁平行；使用“罪孽”与“罪”对应原文两个不同名词，不将二者强行合并，也不在正文中添加原文未明说的神学结论。
