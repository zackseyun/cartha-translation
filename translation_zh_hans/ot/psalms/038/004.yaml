  text: כִּ֣י עֲ֭וֺנֹתַ/י עָבְר֣וּ רֹאשִׁ֑/י כְּ/מַשָּׂ֥א כָ֝בֵ֗ד יִכְבְּד֥וּ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/004.yaml
  text: For my iniquities have gone over my head; like a heavy burden[a], they are too heavy for me.
translation:
  language: zh_hans
  text: 因为我的罪孽[a]漫过我的头顶；它们如同沉重的担子，重得我承受不起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“罪责”；希伯来语这个词既可指罪孽，也可指由罪而来的罪责。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出诗人哀诉的缘由，保留原文的解释或因果作用。
- source_word: עֲוֺנֹתַי
  choice: 我的罪孽
  rationale: עָוֹן可指罪恶行为，也可指罪责或罪的后果；正文用“罪孽”保留其道德分量，并以脚注说明语义范围。
- source_word: עָבְרוּ רֹאשִׁי
  choice: 淹没了我的头
  rationale: 保留原文水涨过头的具体意象；“淹没了我的头”在现代汉语中自然，也传达不堪承受之感。
- source_word: כְּמַשָּׂא כָבֵד
  choice: 如同沉重的担子
  rationale: 准确延续负重的比喻；“担子”比单纯的“重物”更符合诗歌语境。
- source_word: יִכְבְּדוּ מִמֶּנִּי
  choice: 重得我承受不起
  rationale: 表达原文相对于说话者而言过重的比较意味，并自然承接“沉重的担子”这一意象。
theological_decisions:
- issue: 悔罪语境中עָוֹן的语义范围
  choice: 正文译作“罪孽”，主要指诗人的罪恶行为，同时可涵盖其罪责
  alternative: 译作“罪责”，着重因犯罪而承担的责任或后果
  rationale: 本节把说话者的עָוֹן描绘成淹过头顶、无法承受的重担。正文采用较能兼顾行为及道德负担的“罪孽”，脚注则保留“罪责”的可能性，不把原文的神学张力单一化。
translation_notes:
  register: 采用现代、庄重而易懂的诗体语言。两个分句分别保留水淹过头和重担难负的意象；避免用纯抽象的“压倒了我”抹去原文的双重比喻。
