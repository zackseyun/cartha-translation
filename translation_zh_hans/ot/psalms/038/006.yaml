lexical_decisions:
- source_word: נַעֲוֵיתִי
  choice: 我扭曲不直
  rationale: 该词源于 עוה，表示扭曲、弯曲或变形。译作“扭曲不直”保留身体与心灵受压而屈曲的强烈形象，又不限定具体原因。
- source_word: שַׁחֹתִי
  choice: 深深弯下
  rationale: 该词表示弯腰、低伏。与前一动词构成近义强化；用“弯下”自然呈现姿态低沉，并与程度语相连。
- source_word: עַד מְאֹד
  choice: 深深
  rationale: 这是强烈的程度表达。结合“弯下”译作“深深”，比抽象的“极其”更能保持向下屈身的画面。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁、庄重且符合现代汉语，表达整天持续不断。
- source_word: קֹדֵר
  choice: 哀伤
  rationale: קדר 可指昏暗、阴郁，也可描述哀悼的状态。诗篇哀歌语境中“哀伤”自然可懂，同时以脚注保留黑暗、阴郁的意象。
- source_word: הִלָּכְתִּי
  choice: 而行
  rationale: הלך 在此描述整日行走、度日的状态。“而行”既保留行走意象，也与“终日哀伤”自然衔接。
