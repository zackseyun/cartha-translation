  yaml_path: translation/ot/psalms/038/021.yaml
  text: Do not forsake me[a], O Yahweh my God; do not be far from me.
translation:
  language: zh_hans
  text: 耶和华啊，求你不要撇弃我；我的神啊，求你不要远离我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּעַזְבֵנִי
  choice: 求你不要撇弃我
  rationale: אַל与未完成式在祷告中构成否定祈求；加“求你”符合现代汉语祷告语体。“撇弃”保留עזב在哀歌中的沉重意味，又不额外强化为彻底遗弃。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中广为人知的专名“耶和华”对应四字神名，保留其作为以色列之神名字的功能，而不改译为称号“主”。
- source_word: אֱלֹהַי
  choice: 我的神
  rationale: 准确表达名词与第一人称单数所属后缀；与神名并列，构成直接而个人化的呼求。
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: 求你不要远离我
  rationale: רחק表示处于远处或变得疏远；“远离我”自然、简洁，并保留原文可能涉及空间距离或关系疏离的张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名，因此正文采用中文读者熟悉的专名“耶和华”，不以“上主”等称号替代。音译“雅威”也有学术依据，但并非唯一无争议的古代读音。
- issue: “远离”是空间还是关系性的表达
  choice: 保留“远离我”的开放表达
  alternative: 不要离弃我；不要与我疏远
  rationale: 原文רחק本身可传达距离，并在祷告语境中暗含关系上的缺席；直译“远离”可同时保留两层可能性，不作过度解释。
translation_notes:
  register: 采用庄重而自然的现代汉语祷告语体。两个分句均以“求你不要”呈现平行结构；“耶和华我的神啊”保留原文呼格的亲近与迫切。
