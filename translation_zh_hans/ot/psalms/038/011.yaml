  yaml_path: translation/ot/psalms/038/011.yaml
  text: My loved ones and my friends stand apart from my affliction[c][b][a], and my close kin stand far away.
translation:
  language: zh_hans
  text: 爱我的人和朋友都远离我的伤病[a]站着[c]；我的近亲[b]也远远站着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伤病”或译“灾病”、“击打”或“创伤”。原文所用的名词可指身体遭受的打击、疾病性的患难或伤口。
    reason: lexical_alternative
  - marker: b
    text: “近亲”也可译作“亲近的人”或“亲属”。
    reason: lexical_alternative
  - marker: c
    text: “远离我的伤病站着”按原文也可较直译为“在我的伤病对面站着”或“在我的伤病面前站着”。这里结合上下文表达他们与诗人保持距离。
    reason: source_ambiguity
lexical_decisions:
- source_word: אֹהֲבַי
  choice: 爱我的人
  rationale: 这是动词“爱”的分词形式并带第一人称单数词尾，指爱诗人的人；译作“爱我的人”准确自然，也不引入爱情关系的意味。
- source_word: וְרֵעַי
  choice: 和朋友
  rationale: רֵעַ可指朋友、同伴或相识的人；此处与“爱我的人”并列，“朋友”最符合现代汉语习惯。
- source_word: מִנֶּגֶד
  choice: 站在一旁
  rationale: נֶגֶד的基本空间义包括“在面前、对面”；介词מִן在此语境中可表达离开或保持距离。结合下半句“远远站着”，译为“站在一旁”自然呈现亲友疏离的空间画面，同时以脚注保留较直译的可能。
- source_word: נִגְעִי
  choice: 我的伤病
  rationale: נֶגַע可指击打造成的伤、创伤、灾病或病患。诗篇38篇兼有身体痛苦的语境，“伤病”既保留身体层面，又不把含义限定为某一种疾病。
- source_word: יַעֲמֹדוּ
  choice: 站
  rationale: עמד表示站立或采取、保持某一位置；“站”保留原文鲜明的空间动作。
- source_word: וּקְרוֹבַי
  choice: 我的近亲
  rationale: קָרוֹב本义为“近的”，用于人时可指近亲或亲近的人；此处译作“近亲”呈现很可能存在的亲属含义，并在脚注保留较宽泛的理解。
- source_word: מֵרָחֹק
  choice: 远远
  rationale: 该短语直接表示从远处或在远处；“远远”简洁自然，并强化与“近亲”的反差。
- source_word: עָמָדוּ
  choice: 站着
  rationale: 虽为完成式，但与上半句的未完成式构成诗歌平行，描绘同一持续场景；现代汉语用“站着”自然表达这种状态。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“爱我的人和朋友”保留原文两个并列群体；“站在一旁／远远站着”保留两行的空间意象与递进关系。标点采用分号呈现希伯来诗歌的平行结构。
