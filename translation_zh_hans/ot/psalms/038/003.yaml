id: PSA.38.3
reference: Psalms 38:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֵין מְתֹ֣ם בִּ֭/בְשָׂרִ/י מִ/פְּנֵ֣י זַעְמֶ֑/ךָ אֵין שָׁל֥וֹם בַּ֝/עֲצָמַ֗/י מִ/פְּנֵ֥י חַטָּאתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/003.yaml
  text: There is no soundness in my flesh because of your indignation[b][a]; there is no peace in my bones because of my sin.
translation:
  language: zh_hans
  text: 因你的愤怒，我的肉体没有一处完好[a]；因我的罪，我的骨头不得安宁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有健全之处”。
    reason: lexical_alternative
  - marker: b
    text: “安宁”也可译作“平安”或“安适”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתֹם
  choice: 一处完好
  rationale: 该词表示完整、健全的状态；与否定词连用时，“没有一处完好”自然表达全身受苦，同时保留身体意象。
- source_word: בִּבְשָׂרִי
  choice: 我的肉体
  rationale: בשר直指“肉体”；此处与“骨头”构成具体的身体诗歌意象，不宜一概改写为较宽泛的“身体”。
- source_word: מִפְּנֵי
  choice: 因
  rationale: 两处均表示原因；“因”简洁、庄重，并清楚保留平行结构。
- source_word: זַעְמֶךָ
  choice: 你的愤怒
  rationale: זעם表示强烈的怒气或震怒；“愤怒”在现代汉语中自然明确，又不额外引入专门神学术语。
- source_word: שָׁלוֹם
  choice: 安宁
  rationale: שָׁלוֹם在此身体受苦的语境中可指平安、安适或健全状态；“不得安宁”与“骨头”搭配自然，也保留其范围，不缩限为单纯疼痛。
- source_word: בַּעֲצָמַי
  choice: 我的骨头
  rationale: 按希伯来文保留“骨头”的具体意象，传达深入身体内部的痛苦。
- source_word: חַטָּאתִי
  choice: 我的罪
  rationale: חַטָּאתִי在此指诗人自己的罪；“我的罪”直接、自然，并保留个人责任。
theological_decisions:
- issue: 上帝的愤怒、诗人的罪与身体痛苦之间的关系
  choice: 直译两重因果：身体不完好是因上帝的愤怒，骨头不得安宁是因诗人自己的罪。
  alternative: 可把这理解为诗人在疏离与痛苦中的诗性体验，而非关于一切苦难成因的普遍教义。
  rationale: 经文同时陈述上帝的愤怒和人的罪，却没有解释二者作用的机制；译文保留这种张力，不把它扩展为对所有苦难的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两个“因……”分句保持希伯来诗歌的平行结构；“肉体”和“骨头”保留原文具体意象。所有脚注标记均置于正文相应词句之后。
