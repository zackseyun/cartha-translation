  source_fidelity: 译文准确对应希伯来文的两组因果陈述：肉体中“没有健全/完好”（אֵין מְתֹם בִּבְשָׂרִי）是因“你的愤怒”（מִפְּנֵי זַעְמֶךָ）；骨头“不得安宁”（אֵין שָׁלוֹם בַּעֲצָמַי）是因“我的罪”（מִפְּנֵי חַטָּאתִי）。没有擅自说明二者的神学机制。
