  text: כִּֽי לְ/ךָ֣ יְהוָ֣ה הוֹחָ֑לְתִּי אַתָּ֥ה תַ֝עֲנֶ֗ה אֲדֹנָ֥/י אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/015.yaml
  text: For I wait for you[a], O Yahweh; you will answer[c][b], O Lord my God.
translation:
  language: zh_hans
  text: 因为我等候你[a]，雅威[c]啊；主啊，我的上帝啊，你必回应[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“我为你等候”。这里的动词也可译作“我盼望”或“我怀着盼望等候”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“必回答”。原文没有明说回应的对象；按语意可理解为“回应我”。
    reason: lexical_alternative
  - marker: c
    text: “雅威”音译希伯来文的神名 YHWH；传统上也常译作“耶和华”或以“上主”代称。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出诗人信赖与静候的理由；“因为”自然保留其因果衔接功能。
- source_word: לְךָ
  choice: 你
  rationale: 介词 לְ 与 יחל 连用，表示等候或盼望的对象；汉语“等候你”已自然表达该关系，无须另译介词。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按音译呈现四字神名 YHWH，区别于随后作为称号的 אֲדֹנָי“主”。
- source_word: הוֹחָלְתִּי
  choice: 我等候
  rationale: 该动词兼有等候和怀着盼望期待之意；“等候”简洁自然，脚注保留“盼望”的词义可能。完成式在此表达已经确立并持续的信赖姿态，汉语用现在性的表述更自然。
- source_word: אַתָּה
  choice: 你
  rationale: 独立人称代词带有强调；汉语明确说出“你”，并置于“必回应”之前，可保留焦点而不额外加入“亲自”。
- source_word: תַעֲנֶה
  choice: 必回应
  rationale: ענה 表示回答或回应；原文没有明说宾语，因此不补入“我”。未完成式在此按信赖性的将来或确信译为“必”。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是对上帝的称号和直接呼语；“主”庄重自然，并与神名“雅威”有所区分。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 保留第一人称单数后缀，表达诗人与上帝的个人关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”既保留专名性质，也避免与本节的称号 אֲדֹנָי“主”混同。
- issue: תַעֲנֶה 是否补出宾语
  choice: 你必回应
  alternative: 你必回应我；你必应允我
  rationale: 希伯来文没有明示宾语；不补“我”可保存原文句法上的开放性，也避免把一般的“回答、回应”限缩为应允请求。
- issue: 未完成式 תַעֲנֶה 的语气
  choice: 必回应
  alternative: 会回应；愿回应
  rationale: 上下文是诗人等候上帝的信赖宣告，“必”自然体现其确信；但不将其解释为命令或愿望。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。用两个带“啊”的呼语呈现祷告语气；“主、我的上帝”以并列称呼处理 אֲדֹנָי אֱלֹהָי，既忠实又避免不自然的“主我的上帝”。
