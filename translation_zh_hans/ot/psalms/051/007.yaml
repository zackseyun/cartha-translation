id: PSA.51.7
reference: Psalms 51:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵן אֱ֭מֶת חָפַ֣צְתָּ בַ/טֻּח֑וֹת וּ֝/בְ/סָתֻ֗ם חָכְמָ֥ה תוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/007.yaml
  text: Behold[a], you desire truth in the inward parts[b], and in the hidden place you make wisdom known to me.
translation:
  language: zh_hans
  text: 看哪，你所喜爱的是内心的真实[a]；在隐秘之处，你使我明白智慧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内心的真实”或译“内在深处的诚实”。这里的希伯来语富有诗意，字面指里面、隐蔽的部分。
    reason: lexical_alternative
  - marker: b
    text: “使我明白智慧”也可译“使智慧向我显明”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 保留强调和引人注意的诗歌语气；在现代中文经文体中自然且庄重。
- source_word: אֱמֶת
  choice: 真实
  rationale: 此处指人在上帝面前内在的真诚与实在；“真实”既保留“真理／忠信”的语义空间，也较适合修饰内心状态。
- source_word: חָפַצְתָּ
  choice: 你所喜爱的是
  rationale: 该动词可指喜悦、乐意或渴望；“喜爱”保留其情感色彩，又不把意思收窄为单纯要求。
- source_word: בַטֻּחוֹת
  choice: 内心
  rationale: 该词指里面或隐蔽的部分，在这里比直译为“内脏”更自然，并表达人的内在生命；具体意象与可能译法在脚注说明。
- source_word: וּבְסָתֻם
  choice: 在隐秘之处
  rationale: 保留“隐藏、遮蔽”所形成的空间性诗歌意象，并与前句的“内心”平行。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 直接对应希伯来语，涵盖上帝所赐的道德与属灵洞见，而不额外限定其教义含义。
- source_word: תוֹדִיעֵנִי
  choice: 你使我明白
  rationale: 使役形式意为“使我知道”；中文“使我明白智慧”比“使智慧被我知道”自然，同时保留上帝使人认识的使役意义。
theological_decisions:
- issue: 上帝所喜爱的内在真实之性质
  choice: 译作上帝喜爱人内心的真实，并在隐秘之处使诗人明白智慧。
  alternative: 将“真实”明确译为“忠信”，或将全句解释为心理层面的自我认识。
  rationale: 希伯来诗句强调内在的真实与上帝所赐的智慧，但没有把它限定为某一后来的教义范畴；译文保留其道德和属灵张力。
- issue: 第二分句的句法关系
  choice: 将 תוֹדִיעֵנִי 理解为上帝使诗人明白智慧。
  alternative: 译作“你必使我明白智慧”或较直译的“你使智慧向我显明”。
  rationale: 未完成式在诗歌语境中可表达现实、意愿或期待；正文不加入“必”，避免过度确定其时态情态，并保留使役意义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“看哪”保留原文的强调；分号呈现两个平行分句。“内心”避免生硬的解剖式直译，“隐秘之处”则保留原文的空间意象。
