  yaml_path: translation/ot/psalms/051/017.yaml
  text: For you do not delight in sacrifice[a], or I would give it; you do not take pleasure in burnt offering.
translation:
  language: zh_hans
  text: 因为你不喜爱祭物[a]；若不然，我早已献上。燔祭你不悦纳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你不想要祭物；若不然，我早已献上。”希伯来语的连词和分句次序容许这种较贴近原文形式的表达。
    reason: 保留 חפץ 的词义选择及 וְ 所表达关系的翻译差异。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出本句对上文的解释或理由；“因为”自然保留希伯来语的论证关系。
- source_word: לֹא תַחְפֹּץ
  choice: 不喜爱
  rationale: חפץ 不仅表示想要，也含有以某事为乐、喜悦之意；“不喜爱”兼顾情感色彩和现代汉语的自然表达。
- source_word: זֶבַח
  choice: 祭物
  rationale: זֶבַח 指献祭或祭牲；此处“祭物”简洁自然，并与下句较具体的“燔祭”相配。
- source_word: וְאֶתֵּנָה
  choice: 不然我就献上
  rationale: 原文连词直译为“而且/那么”，但在上下文中表达反事实结果：若上帝喜爱祭物，诗人便会献上。用“不然”清楚呈现这一隐含关系，同时以脚注保留较形式对应的译法。
- source_word: עוֹלָה
  choice: 燔祭
  rationale: 这是指全部焚烧献上的专门祭祀用语；“燔祭”是准确且通行的中文圣经术语。
- source_word: לֹא תִרְצֶה
  choice: 不悦纳
  rationale: רצה 用于祭物时可表示喜悦、认可或接纳；“悦纳”兼具喜悦与接受之意，也保留其礼仪语境。
theological_decisions:
- issue: 本节是否否定一切献祭
  choice: 按原文直陈上帝不喜爱祭物、不悦纳燔祭，不在译文中扩大或限制其适用范围。
  alternative: 解释为上帝普遍废除一切献祭，或明确补入“只有内心不对时才不悦纳”。
  rationale: 诗篇语境突出悔改者的心胜过单有礼仪，但本句本身仍保持强烈而未加限定的表述。译文不把这种张力提前化解，也不引入超出原文的教义说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祭物”“燔祭”“悦纳”保留诗篇献祭语境所需的礼仪色彩；句式简洁，并以分号呈现两行诗歌的平行结构。
