  text: בְּֽ/בוֹא אֵ֭לָי/ו נָתָ֣ן הַ/נָּבִ֑יא כַּֽ/אֲשֶׁר בָּ֝֗א אֶל בַּת שָֽׁבַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/001.yaml
  text: when Nathan the prophet came to him[a], after he had gone in to Bathsheba.
translation:
  language: zh_hans
  text: 在他与拔示巴同房之后，先知拿单来见他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“来到（或进入）拔示巴那里”；这是指与她发生性关系的委婉说法。
    reason: 说明原文习语的字面形式及其在语境中的含义。
lexical_decisions:
- source_word: בְּבוֹא
  choice: 来……时／来见
  rationale: 介词 בְּ 加动词不定式结构在这里引出时间背景；结合 אֵלָיו，译为“来见他”既自然，也保留了朝向他的意思。
- source_word: אֵלָיו
  choice: 见他
  rationale: אֶל 加第三人称阳性单数后缀表示“到他那里”；中文用“来见他”比直译“来到他那里”更符合现代叙事表达。
- source_word: נָתָן הַנָּבִיא
  choice: 先知拿单
  rationale: 保留定冠词所标明的身份称谓，并按现代汉语习惯将称谓置于人名前。
- source_word: כַּאֲשֶׁר
  choice: 那是在……以后
  rationale: 该词可表示“当……时、正如、在……以后”；此处上下文显示拿单来见大卫是在大卫与拔示巴发生关系之后，因此用“以后”表达时间先后，同时不增添经文未明说的因果判断。
- source_word: בָּא אֶל בַּת שָׁבַע
  choice: 与拔示巴同房
  rationale: בוא אֶל 与女性连用在此是表示性关系的委婉语；“同房”准确传达语义，同时保持庄重克制的经文语体。
- source_word: בַּת שָׁבַע
  choice: 拔示巴
  rationale: 采用中文圣经传统中通行且易识别的人名译法。
theological_decisions:
- issue: 拿单来见大卫与大卫同拔示巴发生关系之间是否明确构成因果关系
  choice: 只表达先后关系：“那是在……以后”
  alternative: 译成“因为他与拔示巴同房，先知拿单就来见他”
  rationale: 希伯来文本明确提供时间背景，却没有在本句中使用显明的因果连接词；因此不把上下文中的因果理解写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同房”避免过度露骨，也不把原文的性关系含义含糊掉。句式保留这是诗篇题注中时间说明的一部分；“那是在……以后”使两个时间层次在中文中清楚自然。
