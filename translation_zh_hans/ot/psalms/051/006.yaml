id: PSA.51.6
reference: Psalms 51:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵן בְּ/עָו֥וֹן חוֹלָ֑לְתִּי וּ֝/בְ/חֵ֗טְא יֶֽחֱמַ֥תְ/נִי אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/006.yaml
  text: Behold[a], in iniquity I was brought forth[c][b], and in sin my mother conceived me.
translation:
  language: zh_hans
  text: 看哪[a]，我是在罪孽中出生的[b][c]；我母亲是在罪中怀了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译为“诚然”或“的确”。
    reason: lexical_alternative
  - marker: b
    text: “出生”也可译为“被生下来”。
    reason: lexical_alternative
  - marker: c
    text: 本节常被理解为诗人承认自己从受孕起就有罪，也有人视之为悔罪时的诗性夸张；希伯来文本身并未完全解决这一争议。
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 该语气词引出强调性的陈述；“看哪”保留了希伯来诗歌的郑重与强调，也符合现代中文圣经语体。
- source_word: בְּעָוֹן
  choice: 在罪孽中
  rationale: “罪孽”保留עָוֹן所含的道德乖谬和罪责意味；“在……中”对应介词בְּ，同时不预先判定这里所指的具体神学机制。
- source_word: חוֹלָלְתִּי
  choice: 我……出生
  rationale: 此处动词在该语态和上下文中指生产、被生下来；“出生”自然清楚，并保留与下一分句“怀了我”的出生—受孕平行关系。
- source_word: וּבְחֵטְא
  choice: 在罪中
  rationale: חֵטְא是通常表示“罪”的词；直译保留了它与“在罪孽中”的诗歌平行，也避免扩写为某种特定教义解释。
- source_word: יֶחֱמַתְנִי
  choice: 怀了我
  rationale: 这里最适合理解为受孕、怀胎；以“我母亲是在罪中怀了我”自然表达该意义，并与前句的出生意象相配。
- source_word: אִמִּי
  choice: 我母亲
  rationale: 直接对应第一人称所属形式，措辞清楚自然。
theological_decisions:
- issue: 本节是在论及母亲个人的罪、诗人从受孕起的罪性，还是悔罪诗中的夸张表达
  choice: 按希伯来文直接表达诗人的受孕和出生与罪之间的关联，不进一步界定这种关联的教义含义。
  alternative: 可理解为母亲在有罪的行为中受孕，也可理解为诗人承认自己从受孕起便有罪，或视为悔罪语境中的诗性夸张。
  rationale: 希伯来文把诗人的出生、受孕分别与עָוֹן和חֵטְא相连，却没有明确说明罪属于谁、如何传递，或是否意在建立系统教义。因此正文和注释保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“看哪”略具传统庄严感；其余措辞保持自然简洁。分号呈现两个平行分句。所有注脚标记均置于正文相应位置。
