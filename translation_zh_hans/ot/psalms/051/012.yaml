  text: אַל תַּשְׁלִיכֵ֥/נִי מִ/לְּ/פָנֶ֑י/ךָ וְ/ר֥וּחַ קָ֝דְשְׁ/ךָ֗ אַל תִּקַּ֥ח מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/012.yaml
  text: Do not cast me away from your presence[a], and do not take your Holy Spirit from me.
translation:
  language: zh_hans
  text: 不要把我从你面前赶走；不要从我身上收回你圣洁的灵。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的圣灵”；更直译作“你圣洁之灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: 把我……赶走
  rationale: 该词是 שלך 的使役式，带有使人被抛开、逐离之意。“赶走”在现代汉语中自然有力，也适合此处恳求的语气；相较“丢弃”，它更能与后面的“从你面前”顺畅搭配。
- source_word: מִלְּפָנֶיךָ
  choice: 从你面前
  rationale: 原文直译与“面”有关，也惯用于表示在某人的临在之中。“从你面前”既保留希伯来语的具体表达，也在中文中自然传达被逐离上帝临在的意思。
- source_word: רוּחַ קָדְשְׁךָ
  choice: 你圣洁的灵
  rationale: 该构词短语直译为“你圣洁的灵”或“你圣洁之灵”。这样译保留形容词与专名之间的原文张力，不仅限于后期专名化的理解；脚注列出通行译法“你的圣灵”。
- source_word: תִּקַּח
  choice: 收回
  rationale: לקח 的基本义为“拿、取”。在“从我身上”这一结构中，“收回”是自然中文，并传达把原先赐予或同在的灵取走之意，同时不增加原文没有的原因。
- source_word: מִמֶּנִּי
  choice: 从我身上
  rationale: 介词表示“从我这里”。与“灵”和“收回”搭配时，“从我身上”比单说“从我”更符合现代汉语习惯。
theological_decisions:
- issue: רוּחַ קָדְשְׁךָ 是否直接译为专名“圣灵”
  choice: 正文译“你圣洁的灵”，脚注注明“你的圣灵”
  alternative: 你的圣灵；你圣洁之灵
  rationale: 希伯来语字面为“你圣洁的灵／你圣洁之灵”，明确属于上帝，却未借大小写标明是否为专名。正文保留这一语法与神学张力，脚注提供中文传统中常见且合理的专名译法。
translation_notes:
  register: 采用现代、庄重而直接的祷告语言。分号对应原文两个平行的否定祈求；“你面前”保留诗歌的具象表达，“赶走／收回”使两个动词在中文中清楚有力。
