base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/014.yaml
  text: I will teach transgressors your ways[a], and sinners will return to you.
translation:
  language: zh_hans
  text: 我要把你的道路教给悖逆的人；罪人必回转归向你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“罪人必转向你”，或“罪人必回到你这里”。希伯来语动词既可表示转向，也可表示返回。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלַמְּדָה
  choice: 我要教导
  rationale: 该词是 למד 的使役形未完成式/鼓励式第一人称单数，在上下文中表达诗人蒙恢复之后的决心或预期行动；“我要教导”自然保留其意愿和将来指向。
- source_word: פֹשְׁעִים
  choice: 悖逆的人
  rationale: פשע 指有意的反叛或越界；“悖逆的人”比泛指的“作恶者”更能保留其道德与盟约关系中的反叛意味，同时符合现代汉语。
- source_word: דְּרָכֶיךָ
  choice: 你的道路
  rationale: דרך 的复数可指上帝的行事方式、旨意或所命定的生活道路；“你的道路”保留原文的复数道路意象及其经文语感，不作过度解释。
- source_word: חַטָּאִים
  choice: 罪人
  rationale: 这是 חטאים 的简洁、自然对应，与前半句“悖逆的人”构成平行。
- source_word: אֵלֶיךָ
  choice: 归向你
  rationale: 介词本义为“向着你”；与 שוב 组合时译作“归向你”，自然表达方向和关系上的回转。
- source_word: יָשׁוּבוּ
  choice: 会回转
  rationale: שוב 可表示转向、回转或返回；“回转”保留悔改语境中的方向改变，也避免把是否曾经属于或亲近上帝这一点说得过于确定。
theological_decisions:
- issue: שוב 所表达的悔改含义
  choice: 会回转归向你
  alternative: 会转向你；会回到你这里
  rationale: 原词既可表示“转向”，也可表示“返回”。正文用“回转归向”保留悔改及关系恢复的色彩，脚注说明其他可能，避免把它限定为某一种皈依或悔改理论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“悖逆的人”保留 פֹשְׁעִים 的主动反叛意味；“回转归向”兼顾中文自然度与 שוב 的词义张力。
