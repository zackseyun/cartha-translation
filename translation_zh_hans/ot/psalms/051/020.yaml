base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/020.yaml
  text: Then you will delight in righteous sacrifices[a], in burnt offerings and whole burnt offerings[c][b]; then bulls will be offered on your altar.
translation:
  language: zh_hans
  text: 那时，你必喜悦公义的祭物[a]、燔祭和全献祭[b]；那时，人必将公牛献在你的祭坛上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“公义之祭”。
    reason: lexical_alternative
  - marker: b
    text: “全献祭”指全部献上的祭；原文把“燔祭”和“全献”并列，也可理解为“全燔祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְפֹּץ
  choice: 你必喜爱
  rationale: חפץ 表示喜悦、乐意接纳；“喜爱”自然保留其情感和认可意味。
- source_word: זִבְחֵי צֶדֶק
  choice: 公义的祭物
  rationale: 保留构造短语中“公义”的道德及盟约意味，同时不把它缩减为仅仅合乎礼仪规定；其结构歧义由脚注注明。
- source_word: עוֹלָה
  choice: 燔祭
  rationale: 这是该标准祭祀术语在现代中文圣经语境中准确而通行的译法，指在坛上焚烧的祭。
- source_word: וְכָלִיל
  choice: 全献的祭
  rationale: כָלִיל 强调完整、全部献上。将其单独译出，保留它与 עוֹלָה 在原文中的并列及可能的强调关系，避免无依据地合并为同一种祭。
- source_word: יַעֲלוּ
  choice: 人必把……献在
  rationale: עלה 的使役形在献祭语境中指使祭牲上到坛上，即献上；中文以不定主语“人”表达原文第三人称复数而不擅自指定献祭者。
- source_word: מִזְבַּחֲךָ
  choice: 你的祭坛
  rationale: 直接保留诗人对上帝的第二人称称呼及祭祀场景。
- source_word: פָרִים
  choice: 公牛
  rationale: פָרִים 直接指公牛，在本节中是献祭牲畜。
- source_word: אָז ... אָז
  choice: 那时……那时
  rationale: 保留原文重复结构，显出前文复兴之后的时序与结果。
theological_decisions:
- issue: 本节的献祭与诗篇此前强调痛悔之心的关系
  choice: 按原文保留具体的献祭敬拜，表达复兴之后蒙悦纳的献祭。
  alternative: 把献祭完全解释为内在敬虔的比喻，或在译文中断定本节是后加的礼仪文字。
  rationale: 原文并未取消献祭，也未解释其成文层次。译文应保留痛悔与祭祀之间的张力，不在正文中代替诗篇作系统性调和。
- issue: עוֹלָה וְכָלִיל 的关系
  choice: 译作两个并列而紧密相关的表达：“燔祭和全献的祭”。
  alternative: 合并为“全燔祭”，或译成“燔祭和全燔祭”。
  rationale: 希伯来文形式上使用两个词并以连词相接，既可能指相关祭类，也可能是累加强调。正文保留区分，脚注说明可能的合并理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“燔祭”“祭坛”保留必要且通行的祭祀术语；用“人必把……”自然表达希伯来语未明说身份的复数施事者。
