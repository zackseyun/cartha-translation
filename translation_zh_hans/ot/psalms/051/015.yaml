base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/015.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation[b], and my tongue will sing aloud of your righteousness.
translation:
  language: zh_hans
  text: 神啊，我救恩的神啊，求你救我脱离血债[a]；我的舌头就必欢唱你的公义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“血”的复数形式；可指“流血”或“流血之罪”。在本篇悔罪的语境中，指因流人血而负的罪责。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“公正”；原词可兼有道德正直与司法公正的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: 求你救我脱离
  rationale: נצל 的使役命令式带第一人称单数宾语后缀，表达恳求神施行解救；与后面的介词短语连用，译为“求你救我脱离”自然清楚。
- source_word: מִדָּמִים
  choice: 流血之罪
  rationale: דמים 是“血”的复数形式，常用来指流血、杀人或由此产生的血债、罪责。本篇为悔罪诗，“流血之罪”较能表达因流人血而负罪，同时不排除“流血”的字面背景。
- source_word: אֱלֹהִים אֱלֹהֵי תְּשׁוּעָתִי
  choice: 神啊，拯救我的神啊
  rationale: 两个“神”均保留呼格语气；构造短语 אֱלֹהֵי תְּשׁוּעָתִי 以自然现代汉语译作“拯救我的神”，表达神是诗人救恩的来源。
- source_word: תְּרַנֵּן
  choice: 就要欢唱
  rationale: 该动词表示发出欢呼或喜乐歌唱；在祈求之后具有结果或将来意味。“就要欢唱”兼顾其高昂语气与句法关系。
- source_word: לְשׁוֹנִי
  choice: 我的舌头
  rationale: 保留原文以“舌头”为赞美主体的诗歌意象，不泛化为“我”或“我的口”。
- source_word: צִדְקָתֶךָ
  choice: 你的公义
  rationale: צדקה 可涵盖道德上的正直、司法上的公正以及神施行拯救时所显明的正义。“公义”是较宽广且庄重的对应词，可保留这些相关含义。
theological_decisions:
- issue: דמים 在大卫认罪语境中的含义
  choice: 流血之罪
  alternative: 流血；血债
  rationale: 复数“血”可指流血行为，也可指流血所带来的罪责。悔罪语境支持罪责含义，但脚注保留原词较宽的语义范围，避免过度限定。
- issue: צִדְקָתֶךָ 的含义
  choice: 你的公义
  alternative: 你的公正
  rationale: 原词兼有道德正直和司法公正等意味。“公义”作为正文译法较能维持其宽广的神学张力，脚注注明“公正”这一可能侧重。
- issue: אֱלֹהֵי תְּשׁוּעָתִי 的表达
  choice: 拯救我的神
  alternative: 我救恩的神
  rationale: 两种译法都能反映构造关系；“拯救我的神”在现代汉语中更自然，并未限定拯救的具体方式或范围。
translation_notes:
  register: 采用现代、庄重且适合诗歌诵读的简体中文。“神啊……神啊”保留原文重复呼告的力度；分号呈现祈求与随后赞美之间的结果关系。
