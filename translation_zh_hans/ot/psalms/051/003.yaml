base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/003.yaml
  text: Wash me thoroughly from my iniquity[c][b][a], and cleanse me from my sin.
translation:
  language: zh_hans
  text: 求你彻底[a]洗净我，除去我的罪孽[b]；洁净我，除去我的罪[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彻底”也可译作“大大地”或“一再地”；希伯来文的强化词表示充分、强烈的洗净，不必明确理解为反复多次。
    reason: lexical_alternative
  - marker: b
    text: “罪孽”也可译作“罪责”或“过错”；原词既可指所犯的恶，也可包含由此而来的罪责。
    reason: lexical_alternative
  - marker: c
    text: “洁净”也可译作“使……纯洁”或“使……清洁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה
  choice: 彻底
  rationale: 此词在这里作强化成分，修饰“洗净”，主要表达程度强烈、洗得充分。现代汉语用“彻底”自然地传达这种强化意义，同时不把原文明确解释为反复多次。
- source_word: כַּבְּסֵנִי
  choice: 洗净我
  rationale: כּבס本指洗涤衣物，也可比喻彻底除去污秽。“洗净我”既保留洗涤意象，也符合现代汉语表达；结合介词短语，译作“洗净我的罪孽”更自然。
- source_word: מֵעֲוֺנִי
  choice: 我的罪孽
  rationale: עָוֹן可指罪恶、过错，也可包含罪责。译作“罪孽”保留其道德分量，并与下句的“罪”形成相关而不完全相同的对应。
- source_word: וּמֵחַטָּאתִי
  choice: 我的罪
  rationale: חַטָּאת在此悔罪语境中直指“罪”。保留“罪孽／罪”两个不同用词，反映希伯来诗歌的平行结构。
- source_word: טַהֲרֵנִי
  choice: 洁净我
  rationale: טהר表示使之洁净或纯洁，可兼有礼仪和道德意味。“洁净我”在现代中文中庄重自然，也保留原文较丰富的语义。
theological_decisions:
- issue: 如何处理平行出现的עָוֹן与חַטָּאת
  choice: 正文分别译作“罪孽”和“罪”
  alternative: 将二者都泛译为“罪”，或把עָוֹן译作“罪责”
  rationale: 原文使用两个相关但不完全相同的悔罪词语。保留不同译词可呈现诗歌质感，也不把עָוֹן仅限缩为主观或法律意义上的罪责。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语体。正文保留“洗净／洁净”的同义平行，并以“罪孽／罪”呈现两个希伯来悔罪词的细微差别。
