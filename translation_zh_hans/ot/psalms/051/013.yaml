source:
  edition: WLC
  text: הָשִׁ֣יבָ/ה לִּ֭/י שְׂשׂ֣וֹן יִשְׁעֶ֑/ךָ וְ/ר֖וּחַ נְדִיבָ֣ה תִסְמְכֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/013.yaml
  text: Restore to me the joy of your salvation[c][b][a], and let a willing spirit sustain me.
translation:
  language: zh_hans
  text: 求你使我重得你救恩[c]的喜乐；愿乐意的灵[a]扶持我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“慷慨的灵”或“高尚的灵”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“托住我”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“你的拯救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשִׁיבָה
  choice: 使……重得
  rationale: 这是使役词干的祈使式，意思是使先前拥有的状态重新回来。“使我重得”在现代汉语中自然地表达恢复之意。
- source_word: לִּי
  choice: 我重得
  rationale: 介词及第一人称单数后缀标明领受者；汉语将其自然融入“使我重得”的结构。
- source_word: שְׂשׂוֹן
  choice: 喜乐
  rationale: 该名词表示喜悦、欢欣；“喜乐”简洁庄重，也适合祷告语境。
- source_word: יִשְׁעֶךָ
  choice: 你的救恩
  rationale: 该词可指拯救或救恩；“你的救恩”保留神施行拯救的广度，不把含义局限于某一种处境。
- source_word: וְרוּחַ
  choice: 愿……的灵
  rationale: 在此诗歌及内在更新的语境中，רוּחַ 宜译为“灵”，而不是“风”或“气息”；“愿”体现未完成式在此处的祈愿语气。
- source_word: נְדִיבָה
  choice: 乐意的
  rationale: 该形容词可表示乐意、慷慨或高尚；在求内在坚定的祷告中，“乐意的”较自然地表达甘心、主动回应的倾向，同时以脚注保留其他词义。
- source_word: תִסְמְכֵנִי
  choice: 扶持我
  rationale: סמך 表示支撑、托住或维持。“扶持我”既符合祷告语体，也保留持续支撑、不使跌倒的含义。
theological_decisions:
- issue: 悔罪诗中“你的救恩”的含义
  choice: 你的救恩
  alternative: 你的拯救
  rationale: 希伯来语兼有拯救、解救之义。鉴于本诗涉及罪、洁净与更新，“救恩”保留较宽广的神学内涵，却不引入本节未明说的后期教义细节。
- issue: “乐意的灵”所指为何
  choice: 不明确限定为上帝的灵或诗人里面的灵
  alternative: 明确译作“使我有乐意的心灵”或“愿你乐意的灵”
  rationale: 希伯来语只说“乐意的灵”，没有所有格。直译式表达保留它可能指诗人得更新的内在倾向，也可能与上帝所赐的扶持有关的开放性。
- issue: 第二分句的句法关系
  choice: 让“乐意的灵”作“扶持我”的主语
  alternative: 译成“求你以乐意的灵扶持我”
  rationale: 希伯来语中“灵”与第三人称阴性单数动词在语法上相配。采用“愿……扶持我”既反映祈愿语气，也避免额外补出上帝作主语或工具关系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“使我重得”比生硬的“归还给我”自然；分号呈现两个并列祈求。脚注标记紧随其对应词语，以清楚保留希伯来语的词义范围。
