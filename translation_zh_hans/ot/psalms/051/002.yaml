  text: חָנֵּ֣/נִי אֱלֹהִ֣ים כְּ/חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ מְחֵ֣ה פְשָׁעָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/002.yaml
  text: Be gracious to me[a], God, according to your steadfast love; according to your abundant mercies[c][b], blot out my transgressions.
translation:
  language: zh_hans
  text: 上帝啊，求你按你坚定的慈爱[b]恩待我[a]；求你按你丰盛[c]的怜悯，涂抹我的过犯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你怜悯我。”希伯来语动词主要指施恩、赐恩惠；正文将它与后面的“慈爱”和“怜悯”区别开来。
    reason: lexical_alternative
  - marker: b
    text: “坚定的慈爱”所译的希伯来语词常指忠贞、持久的爱，也常用于盟约关系中。
    reason: lexical_alternative
  - marker: c
    text: “丰盛”也可理解为“广大”或“众多”。因此本句也可译作：“按你极大的怜悯”或“按你众多的怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: 恩待我
  rationale: 该词是חנן的祈使式，带第一人称单数受词后缀，意为求赐恩惠、施恩。“恩待我”自然地保留施恩之意，也与后文“怜悯”所译的רחמים有所区别。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处是对以色列之神的直接称呼；“上帝”是现代普通话中庄重而通行的译法。
- source_word: כְחַסְדֶּךָ
  choice: 按你坚定的慈爱
  rationale: חסד包含忠贞、持久的慈爱之意，常见于盟约关系语境；“坚定的慈爱”既表达其持久可靠，也避免仅以术语化的“盟约之爱”缩窄词义。כְ译作“按”，表示祈求以上帝的慈爱为依据和尺度。
- source_word: כְּרֹב
  choice: 按你丰盛的
  rationale: רֹב可表示众多、广大或丰盛；与“怜悯”搭配时，“丰盛的”在现代汉语中自然，并保留数量或广大程度的含义。
- source_word: רַחֲמֶיךָ
  choice: 怜悯
  rationale: רחמים在形式上为复数，表达深切而丰富的慈悲怜悯。汉语抽象名词通常不以形态标示复数，因此用“怜悯”，并由“丰盛”传达其众多、充盈之意。
- source_word: מְחֵה
  choice: 涂抹
  rationale: מחה意为擦去、抹除；“涂抹”保留了将记录或污迹抹去的形象，也符合庄重的悔罪诗语体。
- source_word: פְשָׁעַי
  choice: 我的过犯
  rationale: פשע指越界、悖逆或反叛权威的行为。“过犯”保留道德与关系上的严重性，又是现代读者能够理解的庄重表达。
theological_decisions:
- issue: חנן、חסד与רחמים三个相关恩慈词语的处理
  choice: 分别译为“恩待”、“坚定的慈爱”和“怜悯”。
  alternative: 三个词都统一使用“怜悯”或“慈悲”一类措辞。
  rationale: 原文层叠使用意义相关却不完全相同的词：חנן强调施恩，חסד强调忠贞持久的慈爱，רחמים强调深切的怜悯。保留区别可呈现诗句的神学张力与语言层次，避免把不同侧面压平为一个概念。
- issue: רֹב修饰复数רחמים所表达的范围
  choice: 正文译作“丰盛的怜悯”。
  alternative: 译作“众多的怜悯”或“极大的怜悯”。
  rationale: רֹב兼有众多与广大之意，原文可从数量或程度理解。“丰盛”在正文中自然地涵盖两者，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈祷语体。两个“求你”使汉语句法清晰，并显明原文两个祈使动词的平行结构；分号保留两项祈求之间的紧密联系。避免以同一个“怜悯”统摄三个不同的希伯来语词。
