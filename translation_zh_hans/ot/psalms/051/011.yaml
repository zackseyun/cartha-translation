  text: לֵ֣ב טָ֭הוֹר בְּרָא לִ֣/י אֱלֹהִ֑ים וְ/ר֥וּחַ נָ֝כ֗וֹן חַדֵּ֥שׁ בְּ/קִרְבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/011.yaml
  text: Create in me a clean heart[a], O God[b], and renew a steadfast spirit within me.
translation:
  language: zh_hans
  text: 上帝啊，求你为我创造一颗洁净的心[a]，在我里面更新坚定的灵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“纯洁的心”。
    reason: lexical_alternative
  - marker: b
    text: “坚定”或译“正直”；希伯来语也含有稳固、确立的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב טָהוֹר
  choice: 洁净的心
  rationale: “心”保留希伯来人观中思想、意志与情感的整体内在生命；“洁净”呼应本诗洗净与洁除罪污的语境，也保留道德和礼仪层面的意味。
- source_word: בְּרָא לִי
  choice: 为我创造
  rationale: בָּרָא常用于上帝的创造行动；译作“创造”保留其强度。לִי直译为“为我”，中文自然，也避免把原文未明说的地点含义直接加入前半句。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 原句是祷告中的直接呼求；“上帝啊”在现代普通话中自然、庄重。
- source_word: רוּחַ
  choice: 灵
  rationale: “灵”保留רוּחַ在此处可指人的内在生命、心志或属灵状态的宽广含义，并与“心”形成平行。
- source_word: נָכוֹן
  choice: 坚定
  rationale: 该词核心意义包括稳固、确立、可靠；“坚定”在中文中自然表达持续稳定的内在状态，同时不把含义缩窄为单纯的道德正确。
- source_word: חַדֵּשׁ בְּקִרְבִּי
  choice: 在我里面更新
  rationale: “更新”既可表达恢复，也可表达重新焕发；“在我里面”准确呈现בְּקִרְבִּי所指的内在领域。
theological_decisions:
- issue: רוּחַ נָכוֹן所指的是人的灵、心志，还是某种内在倾向
  choice: 坚定的灵
  alternative: 正直的心志／稳固的灵
  rationale: 译文保留“灵”，不武断限定为心理倾向或另一个特定神学概念；“坚定”突出原词的稳固性，同时以脚注提示“正直”这一可能理解。
- issue: בְּרָא所表达的创造是否意味着从无到有
  choice: 创造
  alternative: 造就／塑造
  rationale: 沿用该希伯来动词常见且有力度的译法，但不在正文中额外说明其形而上意义，以免超出本节明确表达。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。句式保留两个祈使请求的诗歌平行结构；避免生硬的“更新一个灵”，因此译作“在我里面更新坚定的灵”。
