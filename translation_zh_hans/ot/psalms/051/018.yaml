  text: זִֽבְחֵ֣י אֱלֹהִים֮ ר֪וּחַ נִשְׁבָּ֫רָ֥ה לֵב נִשְׁבָּ֥ר וְ/נִדְכֶּ֑ה אֱ֝לֹהִ֗ים לֹ֣א תִבְזֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/018.yaml
  text: The sacrifices of God are a broken spirit[a]; a broken and crushed heart, O God[b], you will not despise.
translation:
  language: zh_hans
  text: 神所要的祭物，是破碎的灵[a]；破碎而压伤的心[b]，神啊，你必不轻看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“痛悔的灵”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“破碎而痛悔的心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי אֱלֹהִים
  choice: 神所要的祭物
  rationale: 希伯来语字面为“神的祭物”。结合上下文，此处指神所看重、悦纳的祭；译为“神所要的祭物”既符合现代汉语，也保留祭祀隐喻，而没有断言外在献祭本身已被废除。
- source_word: רוּחַ נִשְׁבָּרָה
  choice: 破碎的灵
  rationale: נִשְׁבָּרָה 表示被打破、破碎。“破碎的灵”直接保留原文的具体比喻；“痛悔”虽符合语境，但解释性较强，列入脚注作为替代译法。
- source_word: לֵב נִשְׁבָּר
  choice: 破碎的心
  rationale: לֵב 为“心”，נִשְׁבָּר 为“破碎的”；直译清楚自然，并与前句“破碎的灵”形成原文中的重复呼应。
- source_word: וְנִדְכֶּה
  choice: 而压伤的
  rationale: 该词表示被压碎、压伤或压低。“压伤”保留具体意象，又避免与“破碎”完全重复；表示悔罪的“痛悔”作为语境性替代译法收入脚注。
- source_word: לֹא תִבְזֶה
  choice: 必不轻看
  rationale: בזה 表示藐视、轻蔑、不屑。“轻看”在现代中文中自然庄重，并保留“不以为有价值”的语义；“必不”表达未完成式在祈祷语境中的确信。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处既用于“神所要的祭物”，也用作直接呼语“神啊”；统一译为“神”。
theological_decisions:
- issue: 悔罪语境中的祭物隐喻
  choice: 将破碎的灵和破碎、压伤的心表述为神所要的祭物，强调内在的悔改是神所看重的。
  alternative: 把本节理解为完全废除一切外在献祭，或只理解为一般性的情绪痛苦。
  rationale: 原文把“神的祭物”与内在状态并置，突出真诚悔改胜过徒具形式的礼仪；但本节本身并未完整论述或否定献祭制度，也不宜把“破碎”淡化为与悔改无关的普通悲伤。译文保留这一张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“破碎的灵”“破碎而压伤的心”保留希伯来语平行结构和具体意象；“轻看”较“鄙视”更符合祷告语体。
