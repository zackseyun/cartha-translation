lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给诗班长
  rationale: 该词在诗篇标题中通常指负责音乐或诗班的领袖；前缀 לְ 可表示交付或归属方向。译作“交给诗班长”自然简洁，并保留“给／交给”的标题功能。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中常见的体裁名称，通常与乐器伴奏有关；在中文圣经语境中译作“诗”简明而庄重。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 与人名连用时，可表示作者、归属、关联或奉献对象。“大卫的”较能保留原文关系上的含混，不像“大卫所作”那样明确限定为作者身份。
theological_decisions:
- issue: 大卫标题中 לְ 的关系
  choice: 大卫的
  alternative: 大卫所作；为大卫而作
  rationale: 希伯来文没有强制规定这里仅表示作者身份，也可能表示归属、关联或奉献。正文采用较宽泛的“大卫的”，避免消除原文真实的含混。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇标题体。“诗班长”比宽泛的“音乐指挥”更贴近传统诗篇礼仪语境；两个脚注标记均紧随其所说明的词组。
