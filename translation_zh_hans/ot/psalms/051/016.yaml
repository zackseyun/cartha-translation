base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/016.yaml
  text: Lord, open my lips, and my mouth will declare your praise.
translation:
  language: zh_hans
  text: 主啊，求你开启我的嘴唇，我的口就会述说对你的赞美。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝的直接称呼，用现代汉语自然的呼格“主啊”，既表达其神圣称号，也不把它与耶和华之名混同。
- source_word: שְׂפָתַי
  choice: 我的嘴唇
  rationale: 保留原文具体的身体意象，并与下句“我的口”形成平行。
- source_word: תִּפְתָּח
  choice: 求你开启
  rationale: 该未完成式在祷告语境中表达请求；加入“求你”使汉语祈求语气明确，“开启”保留“打开”的基本意象和庄重语体。
- source_word: וּפִי
  choice: 我的口就
  rationale: “我的口”对应原文，并与“我的嘴唇”平行；连接词译作“就”，自然表达前一祈求实现后产生的结果。
- source_word: יַגִּיד
  choice: 要述说
  rationale: 该词为Hiphil未完成式，表示宣告、传述；“述说”自然庄重，“要”保留后续或结果意味。
- source_word: תְּהִלָּתֶךָ
  choice: 对你的赞美
  rationale: 原文可指献给上帝的赞美；“对你的赞美”在现代汉语中比“你的赞美”更清楚，避免误解为上帝所发出的赞美。
theological_decisions:
- issue: 直接称呼中的神圣称号
  choice: 主啊
  alternative: 我的主啊
  rationale: אֲדֹנָי在此是尊崇上帝的称号。译作“主啊”符合现代汉语祷告用语，也不额外强调希伯来语形式中可能被汉语读者理解为所有关系的“我的”。
- issue: “赞美”的所属关系
  choice: 对你的赞美
  alternative: 你的赞美
  rationale: 后缀在此自然表示赞美所指向的对象。采用“对你的赞美”可避免汉语“你的赞美”被误读为由上帝发出的赞美，同时不添加特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。保留“嘴唇／口”的诗歌平行结构；以“求你……就要……”自然呈现祈求与随后赞美之间的关系。
