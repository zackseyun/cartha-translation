base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/005.yaml
  text: Against you—you alone—I have sinned[a], and I have done what is evil in your eyes[b], so that you may be justified in your words and blameless in your judgment.
translation:
  language: zh_hans
  text: 我得罪了你——唯独得罪了你[a]；我做了在你眼中为恶的事，以致你说话时显为公义，审判时显为清白[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我唯独得罪了你”。希伯来语强调上帝是罪最终所冒犯的那一位。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译作“好使你在你所说的话中显为公义，在审判时显为纯全”。希伯来语可容许目的或结果的理解；“你说话时”也可理解为“在你所说的话中”。
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ לְבַדְּךָ
  choice: 我得罪了你——唯独得罪了你
  rationale: 介词结构在认罪语境中表示罪所冒犯的对象；破折号和重复保留“唯独你”的强烈强调，不把它弱化为“主要得罪你”。
- source_word: חָטָאתִי
  choice: 我得罪了
  rationale: 完成式在此陈述已经犯下的罪；“得罪了”自然表达犯罪所针对的对象，并与前置的“你”相连。
- source_word: וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי
  choice: 我做了在你眼中为恶的事
  rationale: 保留“在你眼中”的希伯来语意象，同时用现代汉语自然表达上帝对此事的道德判断。
- source_word: לְמַעַן
  choice: 以致
  rationale: 该连词可表达目的或结果；“以致”保留上下文的逻辑联系，又避免断言犯罪本身以证明上帝为目的。
- source_word: תִּצְדַּק בְּדָבְרֶךָ
  choice: 你在所说的话上显为公义
  rationale: צדק在这里含被证明为正、站得住的司法意味；“显为公义”既保留这一意味，也避免现代汉语中“被称义”可能带来的特定教义联想。
- source_word: תִּזְכֶּה בְשָׁפְטֶךָ
  choice: 在审判时显为清白
  rationale: זכה可指纯洁、无可指摘或在诉讼中胜诉；“显为清白”与前句形成司法性的平行，“审判时”自然呈现בְּ加不定式结构的时间含义。
theological_decisions:
- issue: “唯独得罪了你”与人的受害事实之间的张力
  choice: 原样保留“唯独得罪了你”的绝对表述
  alternative: “我尤其得罪了你”或“我首先得罪了你”
  rationale: 希伯来文刻意强调上帝是罪所冒犯的终极对象；译文不加入“尤其”等解释性限制，以免消解原文的神学张力。
- issue: לְמַעַן所表达的目的或结果关系
  choice: 译作“以致”
  alternative: “好使”或“因此”
  rationale: 原词容许目的与结果色彩；此处采用较自然的结果表达，但在脚注中保留目的式译法，避免把潜在歧义完全封闭。
- issue: 末句关于上帝公义的司法含义
  choice: “显为公义……显为清白”
  alternative: “被判为公义……纯全无瑕”
  rationale: 译文保留上帝的话语和审判经得起裁断的含义，同时不引入经文本身没有明确提出的系统神学结论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以破折号和重复再现希伯来文开头的强调；保留“在你眼中”的原文意象及末句的司法语域。
