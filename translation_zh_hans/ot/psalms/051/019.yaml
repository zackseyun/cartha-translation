  text: הֵיטִ֣יבָ/ה בִ֭/רְצוֹנְ/ךָ אֶת צִיּ֑וֹן תִּ֝בְנֶ֗ה חוֹמ֥וֹת יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/019.yaml
  text: In your good pleasure[a], do good to Zion[b]; build up the walls of Jerusalem.
translation:
  language: zh_hans
  text: 求你按你的美意[a]善待锡安；愿你建造[b]耶路撒冷的城墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按你的恩惠”或“照你的旨意”。
    reason: lexical_alternative
  - marker: b
    text: “建造”在复兴的语境中也可理解为“重建”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: 善待
  rationale: 该词为 יטב 的使役式祈使形式，在这里是向上帝发出的祈求，意为施行有益之事。“善待”在现代汉语中自然、凝练，并明确表达锡安是蒙福的对象，同时避免采用解释性较强的“使……兴盛”或“赐福”。
- source_word: בִּרְצוֹנְךָ
  choice: 按你的美意
  rationale: רָצוֹן 可指恩宠、悦纳、善意或旨意。“美意”兼顾上帝的善意与意愿；介词 ב־ 译为“按”，表达行动与其美意相符。由于原词也可侧重“恩惠”或“旨意”，以脚注保留其语义幅度。
- source_word: אֶת צִיּוֹן
  choice: 锡安
  rationale: אֶת 是直接宾语标记；在“善待锡安”中，现代汉语无需另加介词，已能清楚表达锡安是所求善举的对象和受益者。
- source_word: תִּבְנֶה
  choice: 愿你建造
  rationale: Qal 未完成式承接前面的祈使祷告，在语境中表达请求或愿望，故以“愿你”显明其祈愿语气。בנה 基本义是“建造”，本身也可在修复语境中理解为“重建”，不在正文中预先限定。
- source_word: חוֹמוֹת
  choice: 城墙
  rationale: חוֹמָה 的复数指环绕城市的墙垣。汉语通常用集合名词“城墙”自然表达，无须机械保留复数形式；“防御工事”则超出原词的具体含义。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经与通行汉语中的标准地名译法。
theological_decisions:
- issue: 上帝的美意、恩惠与锡安复兴之间的关系
  choice: 将本节译作祈求上帝按其“美意”善待锡安，并实际建造耶路撒冷城墙。
  alternative: 可译为“求你施恩善待锡安”或“求你照你的旨意善待锡安”。
  rationale: 希伯来语 רָצוֹן 同时可涵盖恩惠、悦纳和意愿。“按你的美意”保留上帝善意与主权意愿之间的张力，而脚注列出其他可能，不将其限定为纯粹情感性的恩宠或抽象的旨意。
- issue: 建造与重建的历史含义
  choice: 正文采用“建造”，让上下文决定是否含有恢复、重建之意。
  alternative: 译为“重建”，明确理解为遭毁后恢复城墙。
  rationale: בנה 的基本义是建造；它在复兴语境中可以指重建，但该动词本身未明说城墙此前被毁。正文不锁定具体历史重建情境，脚注保留这一可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你……；愿你……”体现希伯来诗句由祈使式转入祈愿式的结构；“善待锡安”通顺且直接。“美意”兼具善意与意愿色彩，并用脚注保留原文的词义张力。所有脚注标记均置于正文相应词语之后。
