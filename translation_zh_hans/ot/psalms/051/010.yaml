source:
  edition: WLC
  text: הַסְתֵּ֣ר פָּ֭נֶי/ךָ מֵ/חֲטָאָ֑/י וְֽ/כָל עֲוֺ֖נֹתַ֣/י מְחֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/010.yaml
  text: Hide your face from my sins[b][a], and blot out all my iniquities.
translation:
  language: zh_hans
  text: 求你掩面不看我的罪，涂抹[b]我一切的罪孽[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”所译的希伯来词也可含有“罪责”的意思。
    reason: lexical_alternative
  - marker: b
    text: “涂抹”也可译作“擦去”或“抹除”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְתֵּר
  choice: 掩面不看
  rationale: 该词是סתר的使役式祈使语气，表达诗人恳求上帝不注目于他的罪；“掩面不看”既保留“遮掩”的具体意象，也使汉语表达自然清楚。
- source_word: פָּנֶיךָ
  choice: 你的面（在“求你掩面”中表达）
  rationale: פנים本义为“脸、面”，在这里以拟人方式表示上帝的注视；“掩面”保留了希伯来文的身体意象。
- source_word: מֵחֲטָאָי
  choice: 不看我的罪
  rationale: חטא指罪或过犯；介词מִן在汉语中结合“掩面”自然表达为“不看……”，没有把原文的请求解释成更具体的神学概念。
- source_word: וְכָל
  choice: 我一切的
  rationale: וְ连接两个祈求，כָּל强调全部；汉语依句法将“一切”置于所属词“我的”之后。
- source_word: עֲוֺנֹתַי
  choice: 我的罪孽
  rationale: עָוֹן可指邪恶、罪孽，也可涉及罪责；“罪孽”与前句的“罪”保持词汇区别，同时不把这里单一限定为主观罪疚或刑罚。
- source_word: מְחֵה
  choice: 涂抹
  rationale: 该词是מחה的祈使形式，可表示擦去、抹掉或除去；“涂抹”保留了将罪孽从记录中抹除的具体意象，也是庄重而易懂的现代汉语。
theological_decisions:
- issue: 保留两个不同的罪恶词汇
  choice: 将חטא译为“罪”，将עָוֹן译为“罪孽”
  alternative: 两词都译为“罪”，或将עָוֹן译为“罪责”
  rationale: 原文在平行句中使用两个不同词语。“罪／罪孽”保留诗歌中的词汇变化和递进感，又不强行建立超出经文的技术性教义区分；脚注说明עָוֹן也可能带有“罪责”的含义。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“求你”明确体现两个祈使形式的祷告语气；“掩面不看”避免生硬的“从我的罪掩面”，同时保留原文“面”的意象。脚注标记紧随各自说明的词语。
