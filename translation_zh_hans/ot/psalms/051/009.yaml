  text: תַּ֭שְׁמִיעֵ/נִי שָׂשׂ֣וֹן וְ/שִׂמְחָ֑ה תָּ֝גֵ֗לְנָה עֲצָמ֥וֹת דִּכִּֽיתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/009.yaml
  text: Let me hear joy and gladness[c][b][a]; let the bones you have crushed rejoice.
translation:
  language: zh_hans
  text: 求你使我听见欢喜快乐[a]；愿你所压伤[c]的骨头[b]欢腾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你让我听见欢喜快乐。”
    reason: “使我听见”可按现代汉语祈求表达译为“让我听见”；原文未明说“声音”。
  - marker: b
    text: 原文直译“骨头”；上下文指诗人自己的骨头。
    reason: 希伯来文此处没有第一人称所属后缀，正文不增译“我的”，但脚注说明语境所指。
  - marker: c
    text: “压伤”或译“压碎”、“折断”。
    reason: 原词可表达压碎、压伤或使之破碎的强烈意象。
lexical_decisions:
- source_word: תַּשְׁמִיעֵנִי
  choice: 求你使我听见
  rationale: 使役式带第一人称单数宾语后缀，直译为“使我听见”。加“求你”自然表达祷告中的祈求语气，同时保留上帝使人得闻的含义。
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: 欢喜快乐的声音
  rationale: 两个近义名词分别表示喜悦与欢乐；结合“听见”，补出汉语自然需要的“声音”，但不把它限定为某一种具体声响。
- source_word: תָּגֵלְנָה
  choice: 愿……欢腾
  rationale: 该未完成式在祷告和诗歌平行结构中可表达愿望；“愿”保留祈愿语气，“欢腾”传达 גיל 较强烈的喜乐。
- source_word: עֲצָמוֹת
  choice: 骨头
  rationale: 希伯来文原句没有第一人称所属后缀，因此正文不增译“我的”；上下文则表明是诗人自己的骨头。
- source_word: דִּכִּיתָ
  choice: 你所压伤的
  rationale: דכה 表示压碎、压伤或使之破碎。“压伤”保留强烈的受苦意象，并在现代汉语中可自然修饰“骨头”；第二人称明确保留上帝的施事角色。
theological_decisions:
- issue: 苦难直接归因于上帝的作为
  choice: 保留“你所压伤的骨头”
  alternative: 被压伤的骨头；你所折断的骨头
  rationale: 希伯来文第二人称阳性单数完成式直接把这一行动归于上帝。译文不改成被动表达，以免淡化原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“欢喜快乐”保留诗歌中的近义并列；“愿……欢腾”维持两行之间的祈愿平行。所有脚注标记均置于与其内容对应的正文位置。
