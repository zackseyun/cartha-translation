  yaml_path: translation/ot/psalms/051/008.yaml
  text: Purify me with hyssop[a], and I will be clean; wash me, and I will be whiter than snow.
translation:
  language: zh_hans
  text: 求你用牛膝草洁净我[a]，我便得洁净；求你洗净我，我便比雪更白。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你用牛膝草除净我的罪。”原文动词与“罪”同根，在这里有除去罪污、使人洁净的意思，并使人联想到礼仪性的洁净。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַטְּאֵנִי
  choice: 洁净我
  rationale: 此处חטא的Piel形式表达除去罪污、使之洁净的意思；与牛膝草连用，明显唤起礼仪洁净的语境。“洁净我”在现代汉语中自然，也兼顾礼仪与道德层面的含义。
- source_word: בְאֵזוֹב
  choice: 用牛膝草
  rationale: 介词בְּ表示所用的媒介或工具；牛膝草在希伯来圣经的洁净礼仪中用于洒取洁净之物。“用牛膝草”直接而自然。
- source_word: וְאֶטְהָר
  choice: 我就洁净
  rationale: טהר表示成为洁净，在此可兼指礼仪和道德上的洁净。保留与前句“洁净我”的词根呼应，并用“就”自然呈现祈求后的结果。
- source_word: תְּכַבְּסֵנִי
  choice: 洗净我
  rationale: כבס本指洗涤衣物，此处诗意地用于说话者本人。“洗净我”既保留洗涤隐喻，又符合现代汉语表达。
- source_word: וּמִשֶּׁלֶג
  choice: 比雪
  rationale: מִן在此具有比较义，与“白”连用表示白的程度超过雪，译作“比雪”准确呈现希伯来语比较结构。
- source_word: אַלְבִּין
  choice: 我就……更白
  rationale: לבן的Hiphil形式在此表示变白或呈现为白；结合比较结构，译作“我就比雪更白”，保留结果含义和诗歌意象，同时不强行判定是使役还是状态变化。
theological_decisions:
- issue: 把礼仪洁净意象用于罪的洁除
  choice: 保留“用牛膝草洁净我”这一礼仪性意象
  alternative: 求你用牛膝草除净我的罪；求你洁净我
  rationale: 原文借以色列洁净礼仪表达诗人从罪污中得洁净的祈求。明确保留“牛膝草”，可维持礼仪洁净与道德更新之间的张力，而不加入后来的教义解释。
- issue: 洁净结果的语气
  choice: 译为“我就洁净……我就比雪更白”
  alternative: 我必洁净……我必比雪更白
  rationale: 希伯来语未完成式在祈求语境中表达预期结果；“就”在现代汉语中能自然连接祈求与结果，同时避免把语气过度强化为独立的确定宣告。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个“求你”使并列祈求清楚流畅；重复“洁净”保留希伯来诗句的词义呼应，“比雪更白”保存鲜明而通俗的诗歌意象。
