  text: כִּֽי פְ֭שָׁעַ/י אֲנִ֣י אֵדָ֑ע וְ/חַטָּאתִ֖/י נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/004.yaml
  text: For I know my transgressions, and my sin is always before me.
translation:
  language: zh_hans
  text: 因为我知道我的过犯；我的罪常在我面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为诗人的恳求说明理由；“因为”自然保留了希伯来语的解释性或因果性。
- source_word: פְשָׁעַי
  choice: 我的过犯
  rationale: פשע常指越界、悖逆性的罪行。“过犯”既保留其道德分量，也与下半句的“罪”有所区别。
- source_word: אֲנִי אֵדָע
  choice: 我知道
  rationale: ידע在此表示诗人对自己罪责的切身认识。译作“知道”直接忠实，不额外加入“承认”的含义；显明主语“我”也对应原文的强调。
- source_word: וְחַטָּאתִי
  choice: 我的罪
  rationale: חטאת在认罪语境中指“罪”，不是“赎罪祭”。保留单数，以呈现原文把罪视为持续摆在诗人面前的现实。
- source_word: נֶגְדִּי
  choice: 在我面前
  rationale: 保留某物置于眼前、无法回避的空间隐喻，同时也是自然庄重的现代汉语。
- source_word: תָמִיד
  choice: 常
  rationale: 表达持续不断的状态；“常在我面前”简洁自然，并符合诗歌语体。
theological_decisions:
- issue: “过犯”与“罪”的关系
  choice: 分别译作“过犯”和“罪”
  alternative: 都统一译作“罪”或“罪过”
  rationale: 原文使用两个相关但不同的词，前者突出悖逆或越界，后者为较广义的罪。保留区别可避免抹平认罪语言的层次。
- issue: ידע是否带有公开认罪之意
  choice: 译作“知道”
  alternative: 译作“承认”
  rationale: 此处确有认罪语境，但动词本身首先表示知道、认识。“承认”会把语境中的含义直接写入词义，故不采用。
translation_notes:
  register: 采用现代、庄重且易懂的诗歌语言。以分号呈现两行平行结构；“常在我面前”保留原文意象，不作解释性扩写。
