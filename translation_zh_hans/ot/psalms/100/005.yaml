base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/005.yaml
  text: For Yahweh is good[a]; his steadfast love is forever[d][c][b], and his faithfulness endures from generation to generation.
translation:
  language: zh_hans
  text: 因为耶和华本为善；他的慈爱永远长存[a]，他的信实直到世世代代长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”所译的希伯来词也含怜悯、忠贞和坚定不移的爱等意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词引出前文呼召的理由；“因为”在现代汉语中自然保留其因果与解释作用。
- source_word: טוֹב
  choice: 本为善
  rationale: “善”直接表达道德与施惠意义上的美善；“本为”符合中文诗篇的庄重语体，并表明这是耶和华的恒常属性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的传统音译呈现神的专名，而不以“主”这一称号替代。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文是表示持续时间的“直到永远”；在中文中补出“长存”，使其与“慈爱”搭配自然，同时不改变其时限含义。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: “慈爱”在中文圣经语境中能兼顾怜悯、眷爱和忠贞之意；原词所含的盟约忠诚意味较丰富，另以脚注说明。
- source_word: וְעַד דֹּר וָדֹר
  choice: 直到世世代代
  rationale: “直到”保留 עַד 的延续方向，“世世代代”自然表达 דֹּר וָדֹר 所指连续不断的历代。
- source_word: אֱמוּנָתוֹ
  choice: 他的信实
  rationale: “信实”准确表达坚定、可靠、守信，并与前句“慈爱”构成合宜的平行。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用四字神名。中文正文采用通行且易懂的专名音译“耶和华”，既不以称号替代，也不声称解决其古代确切读音问题。
- issue: חֶסֶד 的丰富含义
  choice: 慈爱
  alternative: 坚定的爱；忠贞之爱；怜悯
  rationale: “慈爱”自然、庄重，并能承载施恩与眷爱；但该词也含忠贞、可靠等关系性意味，因此用脚注保留其语义张力，而不将正文收窄为单一神学术语。
- issue: 末句省略谓语的处理
  choice: 他的信实直到世世代代
  alternative: 他的信实世世代代长存
  rationale: 希伯来文末句没有明写动词，可由平行结构理解持续之意。中文保留无显式动词的简洁诗体，避免把解释性的“长存”重复加入末句。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。分号呈现两组平行陈述；“永远长存”与“直到世世代代”保留原文由永恒延伸至历代的节奏。正文中的脚注标记[a]与脚注完全对应。
