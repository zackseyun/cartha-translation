  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/שִׂמְחָ֑ה בֹּ֥אוּ לְ֝/פָנָ֗י/ו בִּ/רְנָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/002.yaml
  text: Serve Yahweh with gladness[a]; come before him with joyful shouting.
translation:
  language: zh_hans
  text: 要喜乐地事奉雅威；要带着欢呼[a]来到他面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“歌唱”。此希伯来语词可指欢呼或欢欣的歌唱。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: 事奉
  rationale: 这是复数命令式；用于人与雅威的关系时，兼有服事、敬拜和忠诚顺服之意。“事奉”保留其广度，不把含义局限于礼仪性的敬拜。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音译作“雅威”，保留经文中的专名，而不以称号替代。
- source_word: בְּשִׂמְחָה
  choice: 喜乐地
  rationale: 介词 בְּ 表示方式；此处要求人以喜乐的心态和方式事奉。“喜乐地”简洁自然。
- source_word: בֹּאוּ
  choice: 来到
  rationale: בוא 的复数命令式泛指前来或接近；“来到”符合上下文，又不额外限定为进入圣所。
- source_word: לְפָנָיו
  choice: 他面前
  rationale: 该短语字面涉及“他的面／在他面前”，表达来到他的临在之中；“他面前”既自然，也保留希伯来语的空间和关系意味。
- source_word: בִּרְנָנָה
  choice: 欢呼
  rationale: רְנָנָה 可指响亮的喜乐呼声，也可指欢欣的歌唱。“欢呼”突出其高昂、出声的赞美色彩，同时以脚注保留“歌唱”的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”较贴近现代学界对其古代读音的重构，并明确保留这是专名；“耶和华”是传统汉语形式，但源自较晚的混合读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“喜乐地事奉”保持诗歌劝勉的简洁；“欢呼着来到他面前”保留两个复数命令式的平行结构，并避免把场景过度限定为进入圣殿。
