source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/תוֹדָ֑ה הָרִ֥יעוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/001.yaml
  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: zh_hans
  text: '感恩诗[a]。


    全地都要向耶和华欢呼！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “感恩诗”也可理解为“献感谢祭时所唱的诗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 该词在诗篇标题中通常指配乐吟唱的诗歌；中文以“诗”表达最自然，也符合本书体裁。
- source_word: לְתוֹדָה
  choice: 感恩
  rationale: תּוֹדָה 可指感谢、赞美，也可指感谢祭。正文采用简洁自然的“感恩”，不把祭祀背景定死；其他可能含义收入脚注。
- source_word: הָרִיעוּ
  choice: 欢呼
  rationale: 这是复数命令式，要求发出响亮、喜乐的呼声。“欢呼”兼顾声音的力度与庆贺色彩。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 介词 לְ 表明欢呼所指向的对象；“向”准确体现这一关系。专名 יְהוָה 采用现代中文圣经语境中通行的“耶和华”。
- source_word: כָּל־הָאָרֶץ
  choice: 全地
  rationale: אֶרֶץ 可指土地、地域或全地；这里是普世性的呼召，因此译作“全地”，既简洁又保留诗体语感。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文保留专名形式，不以称号取代；“耶和华”是普通现代中文读者最熟悉的传统音译。
- issue: לְתוֹדָה 是否特指感谢祭
  choice: 正文译作“感恩”，脚注保留“感谢祭”的可能
  alternative: 献感谢祭时所唱的诗
  rationale: 该词既可表示感恩，也可作为祭礼术语表示感谢祭；仅凭标题无法确定是否专指献祭，故不在正文中消除这层歧义。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。标题独立成行，以保留希伯来文本的题记结构；正文使用“都要”传达面向“全地”的复数命令语气。
