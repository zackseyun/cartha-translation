  naturalness: 需修订。“当称谢进入”与“当赞美进入”不合自然现代汉语搭配，且会造成句法歧义。改为“带着感恩进入……，带着赞美进入……”既庄重可朗读，也准确表达希伯来语בְּ的伴随/方式意义与平行结构。
  terminology: “称颂他的名”恰当保留ברך与“赞美”“称谢”的区别。“院宇”比单独的“院”更自然地指圣所的庭院范围，同时不泛化原文意象。脚注应锚定在“感恩”而非原先不在正文中的“称谢”。
