  - severity: low
    issue: “他的院”在现代汉语中略显生硬且范围不够明确
    rationale: חֲצֵרֹתָיו为复数，指圣所的庭院/院落；“他的院宇”自然保留这一礼仪空间意象，无须机械标示复数。
  - severity: low
    issue: 脚注锚点与修订后的正文用词须一致
    rationale: 词汇替代说明应附在正文中对应תּוֹדָה的“感恩”后，以保持注释锚定准确。
