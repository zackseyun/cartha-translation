  text: בֹּ֤אוּ שְׁעָרָ֨י/ו בְּ/תוֹדָ֗ה חֲצֵרֹתָ֥י/ו בִּ/תְהִלָּ֑ה הֽוֹדוּ ל֝֗/וֹ בָּרֲכ֥וּ שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/004.yaml
  text: Enter his gates with thanksgiving[a], his courts with praise; give thanks to him; bless his name.
translation:
  language: zh_hans
  text: 带着感恩[a]进入他的门，带着赞美进入他的院宇；要称谢他，称颂他的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “感恩”或作“感谢祭”；希伯来语תּוֹדָה按语境既可指感谢，也可指感谢祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: 进入
  rationale: בוא为复数祈使式；与“门”和“院”连用时，“进入”自然准确地表达进入敬拜场所的动作。
- source_word: שְׁעָרָיו
  choice: 他的门
  rationale: 保留复数所表达的入口意象；现代汉语中集合性场所的“门”通常无需机械标出复数。
- source_word: בְּתוֹדָה
  choice: 当称谢
  rationale: בְּ表示伴随的方式；תּוֹדָה在此与“赞美”平行，抽象义“称谢”最合语境，同时以脚注保留“感谢祭”的可能。
- source_word: חֲצֵרֹתָיו
  choice: 他的院
  rationale: 指圣所范围内的院宇；“院”简洁地保留礼仪场所的空间意象，且不把原文泛化为“同在”或“殿”。
- source_word: בִּתְהִלָּה
  choice: 当赞美
  rationale: תְּהִלָּה意为赞美；采用与前半句对称的表达，保存希伯来诗歌的平行结构。
- source_word: הוֹדוּ לוֹ
  choice: 要称谢他
  rationale: ידה的Hiphil形式在敬拜语境中通常意为称谢；“称谢”也保留它与前文תּוֹדָה的词义联系。
- source_word: בָּרֲכוּ
  choice: 称颂
  rationale: ברך用于上帝及其名时，汉语“称颂”比容易引起下对上施福误解的“祝福”更自然，同时区别于一般的“赞美”。
- source_word: שְׁמוֹ
  choice: 他的名
  rationale: 直译并保留希伯来敬拜语言中“名”所承载的身份与声誉意涵，不作解释性改写。
theological_decisions:
- issue: 门与院的礼仪场所意象
  choice: 按原文保留“他的门”和“他的院”
  alternative: 意译为“他的殿”或“他的同在”
  rationale: 原文明说门和院，唤起进入圣所范围敬拜的图景；保留具体空间意象，可避免加入原文未明说的神学抽象。
- issue: 对上帝之名使用ברך
  choice: 译为“称颂他的名”
  alternative: 译为“祝福他的名”
  rationale: “称颂”在现代汉语中更清楚地表达敬拜者颂扬上帝，而不暗示人向上帝赐福；同时仍保留ברך与תְּהִלָּה、ידה之间的词汇区别。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。“当称谢……当赞美……”以紧凑方式表达两个בְּ介词短语的伴随方式，并维持诗句平行；分号划分进入圣所与随后的敬拜命令。
