  rationale: 修订仅调整中文语序和场所名词，使“感恩／赞美”明确作为进入的伴随方式，符合原文两个בְּ介词短语的平行关系。保留“称谢他，称颂他的名”以维持后半节两个不同敬拜动词的区分；脚注继续保留תּוֹדָה可指感谢祭的词义可能。
