  text: מִזְמ֥וֹר לְ/תוֹדָ֑ה הָרִ֥יעוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/000.yaml
  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: zh_hans
  text: '感恩诗[a]。


    普天下啊，要向耶和华[b]欢呼！[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “感恩诗”也可译作“感谢诗”，或理解为“献感谢祭时所唱的诗”。
    reason: lexical_alternative
  - marker: b
    text: “耶和华”译自希伯来文的神名יהוה；也常译作“雅威”，传统上亦以“上主”代称。
    reason: divine_name
  - marker: c
    text: “欢呼”直指发出响亮的呼声；也可译作“高声欢呼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְתוֹדָה
  choice: 感恩诗
  rationale: מִזְמוֹר指配乐吟唱的诗；לְתוֹדָה可指为感恩而作，也可与献感谢祭有关。“感恩诗”在中文中简洁自然，并在脚注保留原文可能的礼仪含义。
- source_word: הָרִיעוּ
  choice: 欢呼
  rationale: 该使役命令式表示发出响亮呼声，常带喜乐、赞颂或凯旋色彩；“欢呼”既传达声音洪亮，也符合本诗喜乐敬拜的语境。
- source_word: כָּל־הָאָרֶץ
  choice: 普天下
  rationale: 这里呼唤全地共同回应。“普天下”准确表达整体范围，并比“全地”更符合现代中文呼语的庄重节奏。
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，并用脚注说明其形式及常见替代译法。
theological_decisions:
- issue: 标题中的לְתוֹדָה究竟表示感恩主题还是感谢祭用途
  choice: 正文译作“感恩诗”
  alternative: “献感谢祭时所唱的诗”或“感谢诗”
  rationale: 原文介词לְ及名词תּוֹדָה允许主题性与礼仪性理解；正文采用简明、开放的表达，脚注列出可能与感谢祭有关的解释，不排除其礼仪背景。
- issue: 四字神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 正文保留神名的专名性质，同时不把其发音问题处理成确定无疑；脚注说明替代形式，避免把传统代称与原文专名混同。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“普天下啊”保留诗歌中的直接呼唤，“要……欢呼”清楚表达复数命令语气。标题独立成行，以符合诗篇题注的版式与功能。
