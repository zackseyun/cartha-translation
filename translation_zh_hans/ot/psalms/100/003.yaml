id: PSA.100.3
reference: Psalms 100:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: דְּע֗וּ כִּֽי יְהוָה֮ ה֤וּא אֱלֹ֫הִ֥ים הֽוּא עָ֭שָׂ/נוּ ו/לא אֲנַ֑חְנוּ עַ֝מּ֗/וֹ וְ/צֹ֣אן מַרְעִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/003.yaml
  text: Know that Yahweh[a], he is God. He made us, and not we ourselves; we are his people and the sheep of his pasture.
translation:
  language: zh_hans
  text: 你们要知道，雅威就是上帝。他造了我们，并不是我们自己造的[a]；我们是他的子民，是他草场上的羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按传统旁注的诵读形式译作：“他造了我们，我们也属于他。”
    reason: alternative_reading
lexical_decisions:
- source_word: דְּעוּ
  choice: 你们要知道
  rationale: 这是ידע的复数祈使式，要求全体听众认识并承认下文所宣告的事实。“你们要知道”既体现复数命令，也符合现代汉语表达。
- source_word: כִּי
  choice: （以宾语从句自然表达，不另译）
  rationale: כִּי在此引出“要知道”的内容。现代汉语无需加入“即/就是以下事实”等连接语，也能清楚表达其句法作用。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译保留四字神名，而不以“主”这一称号替代。
- source_word: הוּא אֱלֹהִים
  choice: 就是上帝
  rationale: 独立代词הוּא带有强调作用；“就是”自然传达这种确认和强调，但不额外加入“独一”等原文未明说的限定。
- source_word: הוּא עָשָׂנוּ
  choice: 他造了我们
  rationale: 保留הוּא的主语强调，并以简洁的“造”表达עשה在此处创造、造就的含义。
- source_word: וְלֹא אֲנַחְנוּ
  choice: 并不是我们自己造的
  rationale: 正文依照书写形式לא（“不”）。原文省略重复的动词，汉语补出“造的”，以清楚自然地表达“不是我们自己造了自己”。
- source_word: עַמּוֹ
  choice: 他的子民
  rationale: “子民”自然表达百姓与上帝之间的归属和群体关系，也保留其圣约语境中的庄重色彩。
- source_word: וְצֹאן מַרְעִיתוֹ
  choice: 是他草场上的羊
  rationale: 保留“羊”与“草场”的牧养意象；补出“是”使汉语并列谓语流畅，不改变原意。
theological_decisions:
- issue: 诗句中间的书写形式与诵读形式（Ketiv/Qere）
  choice: 正文采用书写形式לא：“他造了我们，并不是我们自己造的。”
  alternative: 传统诵读形式לו：“他造了我们，我们也属于他。”
  rationale: 马所拉正文的辅音书写形式לא自然表示“不”，而传统旁注诵读形式לו表示“属于他”。两者都历史悠久且语境通顺。正文优先保留书写文本，脚注则呈现传统诵读形式，以免掩盖真实的文本差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威”保留神名；全节以直接宣告的语气呈现。分号连接“受造”与“属神子民、羊群”的身份陈述，使诗句层次清楚。
