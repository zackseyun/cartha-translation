source:
  edition: WLC
  text: הִנֵּ֨ה כְ/עֵינֵ֪י עֲבָדִ֡ים אֶל יַ֤ד אֲֽדוֹנֵי/הֶ֗ם כְּ/עֵינֵ֣י שִׁפְחָה֮ אֶל יַ֪ד גְּבִ֫רְתָּ֥/הּ כֵּ֣ן עֵ֭ינֵי/נוּ אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ עַ֝֗ד שֶׁ/יְּחָנֵּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/002.yaml
  text: Look[a], as the eyes of servants are toward the hand of their masters, as the eyes of a female servant are toward the hand of her mistress, so our eyes are toward Yahweh our God[b], until he shows us favor.
translation:
  language: zh_hans
  text: 看哪，仆人[a]的眼睛怎样望着主人的手，婢女的眼睛怎样望着女主人的手，我们的眼睛也照样望着耶和华我们的上帝，直到他向我们施恩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“奴仆”；这里描绘的是他们依赖主人，留意主人的手势或供应。
    reason: lexical_alternative
  - marker: b
    text: “向我们施恩”也可译作“恩待我们”或“怜悯我们”。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意并引出比喻的语气词；“看哪”保留其指示和强调作用，也符合庄重的现代诗歌语体。
- source_word: כְעֵינֵי
  choice: 眼睛怎样……
  rationale: 前缀כְ表示比较；结合后文כֵּן，以“怎样……也照样……”自然呈现希伯来文的比喻结构。
- source_word: עֲבָדִים
  choice: 仆人
  rationale: 该词可指仆人或奴仆；此处比喻的重点是依赖并留意主人的手，因此正文采用较自然的“仆人”，另以脚注保留身份含义更强的译法。
- source_word: יַד
  choice: 手
  rationale: 直译保留原诗的具体意象；这里可使人联想到主人发出指示或给予供应的手。
- source_word: אֲדֹנֵיהֶם
  choice: 主人
  rationale: 这是复数名词带第三人称复数后缀，指仆人各自的主人；中文以集合性的“主人”配合“仆人的眼睛”，表达自然。
- source_word: שִׁפְחָה
  choice: 婢女
  rationale: 该词特指女性仆役或女奴；“婢女”简洁保留性别和家内服侍的语境。
- source_word: גְּבִרְתָּהּ
  choice: 女主人
  rationale: 指婢女的女性主人；“女主人”在现代中文中明确自然。
- source_word: כֵּן
  choice: 也照样
  rationale: 标明比喻的对应部分，与前面的“怎样”构成清楚而自然的汉语关联。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式表达四字神名，而不将其改作称号“主”。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 忠实表达第一人称复数所属关系，并采用现代标准普通话中清楚庄重的称谓。
- source_word: עַד שֶׁיְּחָנֵּנוּ
  choice: 直到他施恩给我们
  rationale: חנן表示恩待、施予恩惠；“施恩给我们”准确、简洁，并保留行动者主动赐恩的意味。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留为专名而非以“主”替代；“耶和华”是现代简体中文圣经语境中最广为人知且庄重的形式，“雅威”作为较贴近学术重构读音的替代形式予以承认。
- issue: 结尾חנן的语义范围
  choice: 施恩给我们
  alternative: 怜悯我们
  rationale: 该动词的核心是向人施予恩惠、恩待；“怜悯”在语境中也可能表达其效果，但更突出同情或解除苦难，故正文不将词义限缩为“怜悯”，并在脚注保留这一常见译法。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。以“怎样……也照样……”重现希伯来诗句的平行比喻，并重复“眼睛”和“手”以保留原文意象与节奏。正文没有解释“手”究竟专指命令、供应还是援助，以保留原诗的多义性。
