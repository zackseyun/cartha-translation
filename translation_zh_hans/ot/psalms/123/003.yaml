  text: חָנֵּ֣/נוּ יְהוָ֣ה חָנֵּ֑/נוּ כִּֽי רַ֝֗ב שָׂבַ֥עְנוּ בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/003.yaml
  text: Be gracious to us[a], O Yahweh; be gracious to us[b], for we have had more than enough of contempt.
translation:
  language: zh_hans
  text: 耶和华啊，求你恩待我们[a]，求你恩待我们！因为我们受尽了轻蔑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“怜悯我们”。希伯来语动词可表示施恩、眷顾或怜悯。
    reason: lexical_alternative
  - marker: b
    text: 直译：“因为我们大大饱尝了轻蔑。”这是说他们所受的轻蔑已经多得难以忍受。
    reason: idiom_explanation
lexical_decisions:
- source_word: חָנֵּנוּ
  choice: 求你恩待我们
  rationale: חנן的祈使式带第一人称复数后缀，意为请求施恩、眷顾或怜悯。“求你恩待我们”既保留施恩这一核心语义，也符合现代汉语祷告语体；原文重复两次，译文照样保留。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文使用四字神名יהוה；“耶和华”是现代简体中文圣经语境中通行且易懂的专名形式，不以“主”这一称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 引出前面恳求的理由，现代汉语以“因为”表达直接自然。
- source_word: רַב שָׂבַעְנוּ
  choice: 我们受尽了
  rationale: 字面意象是“我们大大饱足了”，与负面宾语“轻蔑”连用时表示已经承受得过多、到了极点。“受尽了”自然传达这种过量和不堪再受的语气。
- source_word: בּוּז
  choice: 轻蔑
  rationale: 指别人轻视、鄙弃的态度或待遇。“轻蔑”保留其抽象名词性质，并与下一节的讥诮主题相合。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 正文保留其作为神之专名的功能，不用称号“主”替代；采用简体中文读者最熟悉的传统音译“耶和华”。
- issue: חנן是否专译为“怜悯”
  choice: 恩待
  alternative: 怜悯
  rationale: 该词的语义范围包括施恩、眷顾和怜悯；上下文虽是困苦中的呼求，却未明确指向罪咎或赦免。“恩待”较完整地保留原词较宽的含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。以感叹号表现原文重复恳求的强烈语气；末句用“受尽了”自然传达希伯来语“饱足”与程度副词结合所形成的过量含义。
