base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/004.yaml
  text: Our soul has had more than enough of the mockery of those at ease[b][a], the contempt of the proud.
translation:
  language: zh_hans
  text: 我们的心已经饱受安逸之人的讥诮、骄傲之人的蔑视。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作：“我们的心已经受够了自满之人的嘲讽、傲慢之人的轻蔑。”
    reason: “安逸之人”也可能带有“自满、安然自得”的贬义；“骄傲之人”也可译作“傲慢之人”。
lexical_decisions:
- source_word: רַבַּת
  choice: 实在已经……够了
  rationale: 该词在此作加强语气的副词，表达程度之深甚至过量；用“实在已经受够了”自然传达这种不堪再受的意味。
- source_word: שָׂבְעָה
  choice: 饱受／受够了
  rationale: 源自动词 שבע，意为饱足、充满。此处所承受的是讥诮和蔑视，故以带有负面语感的“饱受”及“受够了”表达。
- source_word: נַפְשֵׁנוּ
  choice: 我们的心
  rationale: נפש在此指人的内在自我或整个生命。“我们的心”既保留原文的共同体单数意象，也符合现代汉语诗歌表达。
- source_word: הַלַּעַג
  choice: 讥诮
  rationale: לעג指嘲弄、讥笑；“讥诮”庄重而简明，适合诗篇语体。
- source_word: הַשַּׁאֲנַנִּים
  choice: 安逸之人
  rationale: שאנן可指安稳无忧、安逸自在，也可能含自满之意。“安逸之人”保留其基本语义，不把潜在的负面评价过度明说。
- source_word: הַבּוּז
  choice: 蔑视
  rationale: בוז表示轻蔑、鄙视；“蔑视”与前句“讥诮”形成清楚的平行。
- source_word: לִגְאֵיוֹנִים
  choice: 骄傲之人
  rationale: 该复数形式指高傲、骄横的人。“骄傲之人”简洁保留原文含义，并未扩大为更具体的敌对行为。
