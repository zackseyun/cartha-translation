  yaml_path: translation/ot/psalms/123/000.yaml
  text: 'A Song of Ascents[a].

    To you I have lifted up my eyes[b],

    you who sit in the heavens.'
translation:
  language: zh_hans
  text: '上行之歌。


    我向你举目，

    坐在诸天之上的你啊。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 沿用简明而熟悉的诗篇标题译法；“מעלות”可指上行、登阶或朝圣上耶路撒冷，其确切背景不必在正文中限定。
- source_word: נָשָׂאתִי אֶת־עֵינַי
  choice: 我向你举目
  rationale: 保留希伯来语“举起双眼”的身体意象，同时采用现代汉语自然表达；完成体在诗歌语境中可自然译为当前已经作出的仰望行动。
- source_word: הַיֹּשְׁבִי
  choice: 坐在……之上的
  rationale: 直译其“坐、居”的基本意义，并保留可能具有的君王临朝意味，不在正文中明确增译为“坐在宝座上”。
- source_word: בַּשָּׁמָיִם
  choice: 在诸天之上
  rationale: שמים为复数形式；“诸天”保留原文形式和宏阔意象，“之上”与中文“坐在”搭配自然。
theological_decisions:
- issue: 是否把“坐在诸天”明确译为“在天上掌权/坐在宝座上”
  choice: 坐在诸天之上
  alternative: 在天上坐着掌权／坐在天上的宝座上
  rationale: 原文动词可带王权含义，但没有明说“掌权”或“宝座”；正文保留字面意象及其神学张力，避免过度解释。
- issue: 是否在称呼中增补“主”
  choice: 以“主啊”使汉语呼语明确
  alternative: 坐在诸天之上的啊／你这坐在诸天之上的
  rationale: 原文以第二人称指向上帝，未出现神名或称号；但汉语若只说“坐在诸天之上的啊”极不自然。增补“主啊”明确隐含对象，不改变其身份指向。
translation_notes:
  register: 采用现代、庄重、适合诗歌朗读的简体中文。将呼语前置，使“坐在诸天之上的主啊，我向你举目”在汉语中自然清楚，同时保留原文由“向你”起句所表达的聚焦效果于整体句义中。
