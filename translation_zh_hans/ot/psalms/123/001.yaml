base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/001.yaml
  text: A Song of Ascents[a]. To you I lift up my eyes[b], O you who are enthroned in the heavens.
translation:
  language: zh_hans
  text: '上行之歌[a]。

    坐在天上的那一位啊[b]，

    我向你举目。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上行”也可理解为“登上”或“上升”。这是诗篇一二〇至一三四篇共有的标题；原文没有说明它具体指朝圣上耶路撒冷、登台阶，还是别的用途。
    reason: lexical_alternative
  - marker: b
    text: “坐”也可译作“住”；在这里也可能含有君王坐席掌权的意味，因此或译“在天上掌权的那一位”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: “歌”直接对应 שִׁיר；“上行”保留 מַעֲלוֹת 所表达的上升、登上意象，同时不武断限定为朝圣行程、台阶礼仪或音乐术语。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 保留介词 אֶל 的方向性，并与汉语“举目”的自然搭配相合。
- source_word: נָשָׂאתִי אֶת־עֵינַי
  choice: 我向你举目
  rationale: 按希伯来语具体意象译出“举起我的眼睛”；汉语用“举目”既简洁自然，也保留诗歌中仰望、求助的动作。完成式在此表达诗人当下已经采取的祷告姿态，汉语无需强加明确时态。
- source_word: הַיֹּשְׁבִי
  choice: 坐在……的那一位
  rationale: ישׁב 的基本义是“坐、居住”。正文采用“坐”以保留原文措辞及其可能具有的君王掌权意蕴，而不在正文中直接把该意蕴解释为“坐在宝座上”。
- source_word: בַּשָּׁמָיִם
  choice: 在天上
  rationale: שָׁמַיִם 在希伯来语中采用复数形态，但现代汉语通常以“天上”自然表达神所在的属天领域；译成“诸天之中”会显得生硬，并可能造成原文未必强调的层次感。
theological_decisions:
- issue: 如何翻译 הַיֹּשְׁבִי בַּשָּׁמָיִם 对神的称呼
  choice: 坐在天上的那一位啊
  alternative: 在天上掌权的那一位啊；住在天上的那一位啊
  rationale: 原文没有出现神的名号，也没有明说“宝座”。正文保留“坐”的基本义和直接呼告，使读者仍能感受到其中可能兼有的居住与君王掌权意蕴，而不把其中一种理解定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“那一位啊”自然呈现希伯来语定冠词分词结构所形成的直接呼告；分行突出称呼与祷告动作。正文避免补入原文没有的“主”“神”或“宝座”。
