lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐指挥
  rationale: 该词在诗篇题注中通常指负责音乐或礼仪演唱的领班；“圣乐指挥”自然表达其职能，且“交给”体现前缀 ל 的指向含义。
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 题注中的 ל 可表示作者、归属、关联或献给；汉语传统题注“……的诗”简洁自然，同时避免像“大卫所作”那样明确限定为作者身份。
- source_word: לְהַזְכִּיר
  choice: 为记念而作
  rationale: 这是 זכר 的使役式不定词，意为使人想起或带入记念；在题注中译作“为记念而作”保留目的意味，又不指定是谁记念或被提醒。
theological_decisions:
- issue: 题注用语 לְהַזְכִּיר 的功能
  choice: 中性地译为“为记念而作”
  alternative: 指记念祭；使上帝记起；供敬拜者记念
  rationale: 希伯来文没有说明记念的主体或对象，也可能是礼仪标记；中性译法保留其礼仪与神学上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇题注体。“圣乐指挥”明确音乐礼仪语境；脚注标记置于其所解释的“为记念而作”之后。
