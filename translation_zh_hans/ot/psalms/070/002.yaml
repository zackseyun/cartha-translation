  text: יֵבֹ֣שׁוּ וְ/יַחְפְּרוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/002.yaml
  text: Let those who seek my life be put to shame and confounded[a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: zh_hans
  text: 愿那些寻索我性命的人蒙羞受辱[a]；愿那些以我的灾祸为乐的人退后蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我性命”也可译作“我本人”。原文“性命”（נפש）在这里指整个人，尤其着重其生命受到威胁。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ
  choice: 蒙羞受辱
  rationale: 两个并列动词都属于羞耻语义域；分别译为“蒙羞”和“受辱”，既保留加强与并列关系，也避免完全重复。
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: 那些寻索我性命的人
  rationale: נפש在敌对、危及生命的语境中指人的性命或本人；“寻索我性命”保留希伯来语表达的力度，并清楚传达致命威胁。
- source_word: יִסֹּגוּ אָחוֹר
  choice: 退后
  rationale: סוג与אָחוֹר连用表示后退、败退；“退后”简洁自然，并保持祈愿语气。
- source_word: וְיִכָּלְמוּ
  choice: 抱愧
  rationale: כלם表示受羞辱、蒙羞；“抱愧”与前半句的“蒙羞受辱”有所区别，同时保留羞耻含义。
- source_word: חֲפֵצֵי רָעָתִי
  choice: 那些幸灾乐祸的人
  rationale: חפץ可指喜爱、乐于或以某事为乐，רעה在此指临到诗人的灾祸或伤害；“幸灾乐祸”自然表达因我的灾祸而欢喜的恶意，但不限定他们是否亲自实施伤害。
theological_decisions:
- issue: 一连串未完成式动词的祈愿／咒诅语气
  choice: 以重复的“愿”译作祷告中的祈愿
  alternative: 译作直陈将来时：“他们必……”
  rationale: 诗篇祷告语境表明这些形式表达诗人的请求或愿望，而非单纯预告未来；“愿”准确保留这种祈愿力度。
- issue: רָעָתִי所指的“恶”
  choice: 理解为临到诗人的灾祸或伤害
  alternative: 理解为诗人自身的道德邪恶
  rationale: 与敌人寻索诗人性命的平行语境支持“我的灾祸／所受伤害”，不应读成诗人的罪恶。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“寻索我性命”略带诗体色彩，贴近原文；“幸灾乐祸”是现代常用成语，凝练传达对诗人灾祸感到欢喜之意。
