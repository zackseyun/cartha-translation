id: PSA.70.4
reference: Psalms 70:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל אֱלֹהִ֑ים אֹ֝הֲבֵ֗י יְשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/004.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May God be magnified!”
translation:
  language: zh_hans
  text: 愿所有寻求你的人都因你欢喜快乐；愿爱慕你救恩[a]的人常常说：“愿上帝被尊为大！[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救恩”也可译作“拯救”。希伯来词既可指从患难中获救，也可泛指救恩。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“愿上帝显为伟大”或“当尊上帝为大”。希伯来文表达对上帝伟大的祈愿或颂赞。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: 欢喜快乐
  rationale: 两个近义动词分别表达踊跃的喜悦与内心的快乐；合译为“欢喜快乐”，既保留诗歌的并列加强，也符合现代汉语习惯。
- source_word: בְּךָ
  choice: 因你
  rationale: 介词 בְּ 在此可表示喜乐所依归的对象或缘由。“因你”在现代汉语中自然，同时保留以神为喜乐根源的含义；“在你里面”较为生硬，也可能显得过度术语化。
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: 所有寻求你的人
  rationale: כָּל 加分词表示以寻求神为特征的一类人；此译准确且通顺。
- source_word: וְיֹאמְרוּ תָמִיד
  choice: 常常说
  rationale: תָמִיד 与未完成式共同表达持续或反复的言说。“常常说”比“永远说”更自然，也不把时间含义绝对化。
- source_word: אֹהֲבֵי יְשׁוּעָתֶךָ
  choice: 爱慕你救恩的人
  rationale: יְשׁוּעָה 可指从患难中获救，也可有较广的救恩含义。“救恩”保留其神学广度；“爱慕”比单纯“爱”更适合以“救恩”为对象的现代汉语搭配。
- source_word: יִגְדַּל אֱלֹהִים
  choice: 愿上帝被尊为大
  rationale: 未完成式在此具有祈愿或欢呼语气。“愿……被尊为大”既保留意愿色彩，也表达对上帝伟大的公开承认；脚注列出更贴近字面的其他理解。
theological_decisions:
- issue: יְשׁוּעָה 的范围
  choice: 救恩
  alternative: 拯救
  rationale: 原词既可指眼前困境中的搭救，也可指更广义的救恩。正文采用“救恩”以保留较宽的神学含义，脚注注明具体“拯救”的可能。
- issue: יִגְדַּל אֱלֹהִים 的意愿语气
  choice: 愿上帝被尊为大
  alternative: 愿上帝显为伟大／当尊上帝为大
  rationale: 此句更像反复发出的祈愿或颂赞，而非单纯陈述“上帝是伟大的”。正文保留这种意愿和欢呼性质，同时不限定为某一套教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“欢喜快乐”保留希伯来诗歌的近义并列；两个“愿”对应诗句的祈愿语气。“上帝”对应 אֱלֹהִים。脚注标记均置于正文相关词句之后。
