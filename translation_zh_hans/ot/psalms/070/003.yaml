  text: 愿那些说“阿哈，阿哈！”的人，因自己的羞耻而退后！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: 愿……退后
  rationale: 这是שׁוב的Qal未完成式第三人称阳性复数，在祈愿、咒诅语境中带有意愿语气。“愿……退后”既保留祈愿力度，也直接表达撤退、退却之意，不强行译成被动。
- source_word: עַל עֵקֶב
  choice: 因
  rationale: 该组合在此表示原因或结果关系。“因”简洁自然，避免按字面译作“脚跟”而造成误解。
- source_word: בָּשְׁתָּם
  choice: 自己的羞耻
  rationale: 该词属于羞耻、蒙羞的语义范围。结合主语译作“自己的羞耻”，在现代汉语中清楚保留原文的第三人称复数领属关系。
- source_word: הָאֹמְרִים
  choice: 那些说……的人
  rationale: 带冠词的主动分词作名词用，指以这种言语为特征的一群人；此译自然地保留其描述性。
- source_word: הֶאָח הֶאָח
  choice: 哈哈！哈哈！
  rationale: 这是表示幸灾乐祸或得意嘲弄的重复感叹语。“哈哈”在现代汉语中能自然传达讥笑、幸灾乐祸的语气；标点体现重复呼喊。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祈愿式表达。“退后”比“转回”更符合敌对者受挫退却的语境；“哈哈”按上下文理解为幸灾乐祸的嘲笑，而非一般欢笑。
