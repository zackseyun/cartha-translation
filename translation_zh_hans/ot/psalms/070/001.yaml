base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/001.yaml
  text: O God[a], deliver me; O Yahweh, hurry to help me.
translation:
  language: zh_hans
  text: 神啊，求你救我！耶和华啊，求你快来帮助我！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 这是祷告中的直接呼求；“啊”自然体现希伯来诗歌的呼格语气。
- source_word: לְהַצִּילֵנִי
  choice: 求你救我
  rationale: נצל 的使役式表示使人脱离危险；“救我”简洁自然，且不把含义限定为永恒救恩。
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 正文直接呈现四字神名；“耶和华”是现代中文圣经语境中广为人知且庄重的传统音译。
- source_word: לְעֶזְרָתִי
  choice: 来帮助我
  rationale: לְ 与 עֶזְרָה 表达前来施助的方向和目的；补出“来”可自然承接后面的催促语气。
- source_word: חוּשָׁה
  choice: 求你快来
  rationale: 该祈使形式催促对方迅速行动；“快来”在现代汉语祷告中自然地传达紧迫感。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名，正文以中文传统且通行的专名“耶和华”呈现，不以称号替代；“雅威”是较贴近现代学界拟音的另一选择。
translation_notes:
  register: 采用简洁、急切而庄重的现代祷告语体。保留两个直接呼求及两项恳求的平行结构；第二分句以“快来帮助我”自然表达原文“为帮助我而赶快”的语序和紧迫感。
