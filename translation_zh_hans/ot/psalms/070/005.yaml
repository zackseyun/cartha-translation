  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֱלֹהִ֪ים חֽוּשָׁ֫/ה לִּ֥/י עֶזְרִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה יְ֝הוָ֗ה אַל תְּאַחַֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/005.yaml
  text: But as for me[a], I am poor and needy; O God, hurry to me. You are my help and my deliverer; O Yahweh[b], do not delay.
translation:
  language: zh_hans
  text: 至于我，我困苦穷乏；上帝啊，求你赶快到我这里来[a]！你是我的帮助，也是我的搭救者；雅威[b]啊，求你不要耽延！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “到我这里来”也可译作“为我赶快行动”。
    reason: lexical_alternative
  - marker: b
    text: 原文是希伯来文神名 יהוה（YHWH），这里译作“雅威”；中文圣经中也常译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 连词与独立代词共同标示转折和话题转换；“至于我”自然地突出诗人由前文转向自身处境。
- source_word: עָנִי וְאֶבְיוֹן
  choice: 困苦穷乏
  rationale: 两个近义词构成常见搭配，兼有受苦、卑微和缺乏之意；“困苦穷乏”既保留两词的层次，也符合现代汉语祷告语体。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处为直接呼语；加“啊”传达原文恳切呼求的语气。
- source_word: חוּשָׁה לִי
  choice: 求你赶快到我这里来
  rationale: 命令式表达紧迫请求；לִי最自然可理解为行动朝向诗人，译作“到我这里来”，同时以脚注保留“为我赶快行动”的可能。
- source_word: עֶזְרִי
  choice: 我的帮助
  rationale: עֵזֶר在此指帮助、援助本身；直译“我的帮助”保留原文名词性表述。
- source_word: וּמְפַלְטִי
  choice: 是救我脱险的
  rationale: 该词源于פלט，指使人逃脱或获救者；“救我脱险的”比生硬的“我的解救者”更自然，又保留施行拯救的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式音译四字神名，并用脚注说明原文形式及另一常见音译。
- source_word: אַל תְּאַחַר
  choice: 求你不要耽延
  rationale: 否定祈使表达不要推迟行动的恳求；“耽延”庄重而易懂，并与全句紧迫语气相称。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名，而非“主”这一称号。正文采用中文圣经传统中最广为人知的“耶和华”，脚注同时交代希伯来文字母及另一常见拟音，避免把拟定发音说成毫无争议。
- issue: “贫穷困苦”的含义范围
  choice: 困苦穷乏
  alternative: 贫穷卑微
  rationale: עָנִי可指贫穷、受苦或卑微，与אֶבְיוֹן并列时重点是无助而有需要的处境；译文不把它局限为纯经济贫困或属灵谦卑。
translation_notes:
  register: 采用现代、庄重而口语可懂的祷告语言。“求你”补出汉语恳求语气，不削弱原文命令式的迫切感；分号和感叹号呈现两组直接呼求。所有脚注标记均放在所说明的正文词句之后。
