  text: כֹּ֣ל הַ֭/נְּשָׁמָה תְּהַלֵּ֥ל יָ֗הּ הַֽלְלוּ יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/006.yaml
  text: Let everything that has breath praise Yah[a]. Praise Yah!
translation:
  language: zh_hans
  text: 凡有气息的，都要赞美耶和华。你们要赞美耶和华[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“哈利路亚！”希伯来语 הַלְלוּ־יָהּ 是“哈利路亚”的来源，字面意为“你们要赞美雅”；其中“雅”（Yah）是“耶和华”之名的诗歌性短式。
    reason: 说明传统礼仪音译，并保留原文神名短式及复数祈使语气的信息。
lexical_decisions:
- source_word: כֹּל הַנְּשָׁמָה
  choice: 凡有气息的
  rationale: כֹּל 与单数 הַנְּשָׁמָה 连用，涵盖一切有气息、能呼吸的生命。“凡有气息的”既保留希伯来语的呼吸意象和普遍范围，也符合现代汉语表达。
- source_word: תְּהַלֵּל
  choice: 都要赞美
  rationale: 此处未完成式在诗篇结尾的劝召语境中具有祈使、号召意味；“都要赞美”自然传达这一意愿语气，而不把它误读为单纯的将来陈述。
- source_word: יָהּ
  choice: 耶
  rationale: יָהּ 是神名的诗歌性短式，并非完整形式 יְהוָה。“耶”既简洁地保留短式，又与汉语礼仪用语“哈利路耶”中的传统音译相呼应。
- source_word: הַלְלוּ יָהּ
  choice: 你们要赞美耶！
  rationale: הַלְלוּ 是复数祈使式，直接向群体发出呼召；补出“你们”可在现代汉语中清楚体现复数受命者，同时把该短语的实际含义译出。
theological_decisions:
- issue: 神名短式 יָהּ 的译法
  choice: 耶
  alternative: 耶和华
  rationale: 原文特意使用诗歌性短式 יָהּ。译作“耶”保留其形式特征，也避免把短式无声扩展为完整神名。
- issue: 是否在正文保留传统礼仪音译
  choice: 正文译出“你们要赞美耶”
  alternative: 哈利路耶
  rationale: 正文直接表达希伯来语祈使短语的意义；同时在脚注保留广为人知的礼仪音译及其来源。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。首句用“凡有气息的”呈现普世性的高潮呼召；末句补出“你们”，显明复数祈使式的直接会众呼召。
