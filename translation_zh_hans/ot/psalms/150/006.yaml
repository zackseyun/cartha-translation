  rationale: 修订仅处理“耶”作为独立神名在汉语中的不可识别性和不自然性。正文采用可理解且符合汉语圣经庄重语域的“耶和华”；脚注明确标示原文实际使用的是诗歌性短式 Yah，并保留“哈利路亚”这一传统替代译法。首句的“凡有气息的”与劝召性“都要赞美”均予保留。
