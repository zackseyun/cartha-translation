review_pass:
  verdict: revise
  source_fidelity: 首句“凡有气息的”准确表达 כֹּל הַנְּשָׁמָה 的普遍范围与“气息／呼吸”意象；“都要赞美”可传达劝召性的未完成式。末句的“你们要”恰当反映复数祈使式。可是，将 יָהּ 单独译作“耶”在现代汉语中不是可辨认、可自然使用的神名，且“赞美耶”容易被误解，不能有效传达原文所指的以色列之神。正文改用通行神名“耶和华”，并在脚注说明原文此处使用其诗歌性短式，可兼顾可理解性与原文形式信息。
  naturalness: “赞美耶”及“你们要赞美耶”在现代标准汉语中生硬且语义不完整；“耶和华”是汉语圣经语域中稳定、庄重且广泛可识别的对应名称。修订后两句简洁自然，保留诗篇结尾的会众呼召语气。
  terminology: “耶和华”是现代汉语圣经文本中对应神名的既定、可识别术语。虽然 יָהּ 是短式，不宜把“耶”作为独立汉语神名；短式特征应以脚注说明，而非以不自然的单字音译承载。“哈利路亚”为汉语中通行的传统礼仪音译，可作为 הַלְלוּ־יָהּ 的脚注替代译法。
