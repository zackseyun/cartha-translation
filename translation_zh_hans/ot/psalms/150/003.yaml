base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/003.yaml
  text: Praise him with the blast of the trumpet[a]; praise him with harp and lyre.
translation:
  language: zh_hans
  text: 要用号角的响声赞美他[a]，要用琴和里拉琴赞美他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要用羊角号的响声赞美他。”“号角”指古代用于敬拜和传递信号的角制号，常以羊角制成。
    reason: 保留 בְּתֵקַע שׁוֹפָר 的另一种自然理解，并说明 שׁוֹפָר 的文化背景。
lexical_decisions:
- source_word: הַֽלְלוּ/הוּ
  choice: 赞美他
  rationale: 复数命令式加第三人称阳性单数后缀，是对敬拜群体的直接呼召；译作“赞美他”简洁自然，并保留两次重复。
- source_word: בְּ/תֵקַע
  choice: 用……的响声
  rationale: תֵּקַע 指吹奏所发出的声音或号声；“响声”着重表达原文中的发声事件，而不只提乐器本身。
- source_word: שׁוֹפָר
  choice: 号角
  rationale: שׁוֹפָר 是古代以兽角制成、用于敬拜和传递信号的号；“号角”在现代汉语中既自然，又比“喇叭”更能保留其历史文化特征。
- source_word: בְּ/נֵבֶל
  choice: 用琴
  rationale: נֵבֶל 指一种弦乐器，其确切形制难以确定；采用较宽泛的“琴”，避免作出无法证实的具体认定。
- source_word: וְ/כִנּוֹר
  choice: 和竖琴
  rationale: כִּנּוֹר 是另一种弦乐器；译作“竖琴”可与 נֵבֶל 的“琴”相区别，同时保持并列的两种乐器。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以两次“要用……赞美他”对应希伯来文的平行重复；不强行确定两种古代弦乐器的精确形制。
