  text: הַ֥לְלוּ יָ֨הּ הַֽלְלוּ אֵ֥ל בְּ/קָדְשׁ֑/וֹ הַֽ֝לְל֗וּ/הוּ בִּ/רְקִ֥יעַ עֻזּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/001.yaml
  text: Praise Yah! Praise God in his sanctuary[c][b][a]; praise him in the expanse of his strength.
translation:
  language: zh_hans
  text: '你们要赞美雅！[a]

    要在他的圣所赞美上帝；[b]

    要在他大能的穹苍中赞美他。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“雅”（Yah），即神名的短式；“哈利路雅”的意思就是“你们要赞美雅”。
    reason: alternative_reading
  - marker: b
    text: “他的圣所”也可译作“在他的圣洁中”或“在他的圣洁之处”。
    reason: lexical_alternative
  - marker: c
    text: 较直译为“在他力量的穹苍中”；也可译作“在他大能的穹苍中”或“在他有力的穹苍中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: 你们要赞美耶和华
  rationale: 这是复数命令式加神名短式 יָהּ，构成礼仪性呼召。中文用“你们要赞美”自然传达群体命令；正文采用读者熟悉的“耶和华”，脚注说明原文为神名短式“雅”。
- source_word: אֵל
  choice: 上帝
  rationale: 此处 אֵל 是对神的通称，与前面的神名相呼应；译作“上帝”简洁自然，不额外加入“全能”等原文未明说的限定。
- source_word: בְּקָדְשׁוֹ
  choice: 在他的圣所
  rationale: קֹדֶשׁ 可指圣洁，也可指圣洁之地。这里与下一分句的空间表达平行，地点义较合适；“圣所”保留其敬拜语境。
- source_word: בִּרְקִיעַ
  choice: 在……穹苍
  rationale: רָקִיעַ 指铺展开来的穹苍。“穹苍”保留古希伯来宇宙图景，且比“天空”更贴近词义。
- source_word: עֻזּוֹ
  choice: 彰显他大能的
  rationale: 字面结构是“他大能的穹苍”。中文若机械保留属格会较生硬；译作“彰显他大能的穹苍”表达该穹苍与神大能之间的关系，同时在脚注保留较直译形式。
theological_decisions:
- issue: 神名短式 יָהּ 的译法
  choice: 正文译“耶和华”，脚注注明原文为短式“雅”
  alternative: 正文音译“雅”
  rationale: יָהּ 确为神名的短式，不能与普通称号混同。现代中文圣经传统通常以“耶和华”使所指清楚，而脚注保存原文的短式及“哈利路雅”中的对应关系。
- issue: בְּקָדְשׁוֹ 的地点义或性质义
  choice: 他的圣所
  alternative: 他的圣洁中／他的圣洁之处
  rationale: 与“在……穹苍”形成地点平行，支持“圣所”的解释；但原词也可表示“圣洁”，故以脚注保留歧义。
- issue: רְקִיעַ עֻזּוֹ 的关系
  choice: 彰显他大能的穹苍
  alternative: 他大能的穹苍／他坚固的穹苍
  rationale: 希伯来语属格关系简练而有一定歧义，可指彰显其大能的穹苍，也可理解为他以大能设立或坚固的穹苍。正文采用自然中文，脚注保留较字面的可能。
translation_notes:
  register: 采用现代、庄重而适合诵读的诗歌语言。保留三次“赞美”的反复和两行平行结构；“你们”明确复数命令对象。脚注标记均置于相关正文之后。
