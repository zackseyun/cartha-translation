  yaml_path: translation/ot/psalms/150/004.yaml
  text: Praise him with tambourine and dancing[b][a]; praise him with strings and pipe.
translation:
  language: zh_hans
  text: '要用手鼓和舞蹈赞美他；

    要用弦乐[a]和管乐器[b]赞美他。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弦乐器”。
    reason: lexical_alternative
  - marker: b
    text: 传统上有译作“风琴”的；但这里的希伯来语很可能指管或簧管一类的吹奏乐器，并非现代的键盘管风琴。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: 赞美他
  rationale: 这是הלל的复数命令式，带第三人称阳性单数宾语后缀；汉语以自然的命令语气表达对敬拜群体的呼召，并保留“他”这一宾语。
- source_word: בְתֹף
  choice: 用手鼓
  rationale: תֹף指手持的打击乐器，通常是框鼓一类；“手鼓”比古雅或过于宽泛的译法更便于现代读者理解。
- source_word: וּמָחוֹל
  choice: 和舞蹈
  rationale: מָחוֹל可指舞蹈或跳舞；“舞蹈”与本节所列赞美方式相称，也保留原文名词式表达。
- source_word: בְּמִנִּים
  choice: 用弦乐
  rationale: מִנִּים泛指弦乐器；“弦乐”简洁自然，并避免无根据地限定某一种具体乐器。
- source_word: וְעוּגָב
  choice: 和管乐器
  rationale: עוּגָב指某种吹奏乐器，很可能是管或簧管；“管乐器”既易懂，也避免误解为现代键盘管风琴或武断指定某一种古代乐器。
