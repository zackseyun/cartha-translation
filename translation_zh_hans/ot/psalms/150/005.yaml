  text: Praise him with sounding cymbals[b][a]; praise him with clashing cymbals.
translation:
  language: zh_hans
  text: 要用响亮的钹赞美他[a]；要用轰响的钹赞美他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“发声的钹”。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来语词可指“欢呼、呼喊或号声”；与钹连用时，可能指响亮、轰鸣的撞击声。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: 赞美他
  rationale: 这是הלל的复数命令式，带第三人称阳性单数后缀；译为“赞美他”自然、清楚，并保留两次直接呼召的力度。
- source_word: בְצִלְצְלֵי
  choice: 用……的钹
  rationale: 介词ב在此表示工具或方式；现代汉语以“用……的钹”表达借乐器赞美最为自然。
- source_word: שָׁמַע
  choice: 响亮
  rationale: 该词在这一搭配中与可听见的声响有关，修饰钹所发出的清晰、宏亮之声；“响亮”简洁自然，同时在脚注保留“发声／鸣响”的较直译可能。
- source_word: תְרוּעָה
  choice: 铿锵
  rationale: תְרוּעָה可指呼喊、号声或欢呼；与钹连用时，重点应是强烈而振奋的撞击声。“铿锵”符合汉语乐器语境，又不把它误解成钹本身在口头欢呼。
