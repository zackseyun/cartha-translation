  text: הַֽלְל֥וּ/הוּ בִ/גְבוּרֹתָ֑י/ו הַֽ֝לְל֗וּ/הוּ כְּ/רֹ֣ב גֻּדְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/002.yaml
  text: Praise him for his mighty acts[b][a]; praise him according to the abundance of his greatness.
translation:
  language: zh_hans
  text: 要因着他大能的作为赞美他[a]；要按他无比的伟大赞美他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凭着他大能的作为赞美他”或“以他大能的作为赞美他”；希伯来语介词也可作较形式化的表达，但这里很可能是说明赞美他的缘由。
    reason: lexical_alternative
  - marker: b
    text: 或译：“按他伟大的丰盛赞美他”；也可理解为“以与他的伟大相称的程度赞美他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: 要……赞美他
  rationale: 这是הלל的复数命令式，带第三人称阳性单数宾语后缀。汉语以“要……赞美他”自然表达向敬拜群体发出的命令，并保留两行的重复结构。
- source_word: בִגְבוּרֹתָיו
  choice: 因他大能的作为
  rationale: גְּבוּרוֹת指彰显力量的大能作为；介词ב在这里最自然地表示赞美的缘由或根据，译作“因”，同时以脚注保留“凭着／以”的形式可能。
- source_word: כְּרֹב
  choice: 照……丰盛的
  rationale: 介词כ与רֹב组合，表达尺度、相称或按照丰富程度；“照……丰盛的”保留这种衡量或相称含义，而不把它简化为单纯的原因。
- source_word: גֻּדְלוֹ
  choice: 他的伟大
  rationale: 该词源自גדל，基本含义是伟大、宏大。“伟大”直接而庄重，避免将其限定解释为“威严”。
theological_decisions:
- issue: 赞美的根据与尺度
  choice: 第一行把上帝大能的作为作为赞美的缘由，第二行则要求赞美与他丰盛的伟大相称。
  alternative: 也可把第二行较宽泛地理解为因他极其伟大而赞美他，使两行都主要陈述赞美的缘由。
  rationale: ב与כ在两行中具有不同语义倾向：前者可表缘由，后者更明显地表达尺度或相称关系。译文保留两者之间的诗意张力，不把它们合并成完全相同的意思。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大能的作为”保留复数具体行动的含义；“照他丰盛的伟大”略带诗性，以保存原文כְּרֹב的尺度意味。两个脚注标记均置于相应主句之后。
