  text: which my lips uttered and my mouth spoke when I was in distress[a].
translation:
  language: zh_hans
  text: 就是我在患难中，我的嘴唇所吐露、我的口所说的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 就是……的
  rationale: 引出关系从句，回指上一节的“誓言”；采用现代汉语可自然承接上文的结构。
- source_word: פָּצוּ
  choice: 所发
  rationale: פצה字面指“张开”，这里与“嘴唇”连用，是开口说话、发出言语的习语。“所发”简洁表达言语从嘴唇发出，同时保留诗歌意象。
- source_word: שְׂפָתַי
  choice: 嘴唇
  rationale: 保留身体部位意象，并与下句“口中”构成希伯来诗歌的同义平行。
- source_word: וְדִבֶּר
  choice: 所说
  rationale: דבר在此意为“说、讲”；译作“所说”自然准确，并与“所发”形成平行。
- source_word: פִּי
  choice: 口中
  rationale: 保留“口”的具体意象；“口中所说”符合现代汉语表达，也对应“嘴唇所发”。
- source_word: בַּצַּר לִי
  choice: 我在患难中
  rationale: 该短语表示说话者遭受困苦时的处境，也带有时间意味；此译兼顾“在患难中”与“当我遭难时”的含义。
