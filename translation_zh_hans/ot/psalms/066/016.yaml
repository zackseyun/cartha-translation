source:
  edition: WLC
  text: לְכֽוּ שִׁמְע֣וּ וַ֭/אֲסַפְּרָה כָּל יִרְאֵ֣י אֱלֹהִ֑ים אֲשֶׁ֖ר עָשָׂ֣ה לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/016.yaml
  text: Come and hear[a], all you who fear God, and I will tell what he has done for my soul.
translation:
  language: zh_hans
  text: 凡敬畏上帝的人，都来听吧！我要述说他为我所做的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ שִׁמְעוּ
  choice: 都来听吧
  rationale: לְכוּ 字面有“去、行”的意思，但与“听”连用时构成邀请性的呼召，汉语译作“来听吧”自然准确；“都”与后面的 כָּל 相呼应。
- source_word: וַאֲסַפְּרָה
  choice: 我要述说
  rationale: ספר 在此指叙述、讲述；该形式表达诗人愿意或决意讲述，译作“我要述说”既保留语气，也符合诗篇的庄重文体。
- source_word: כָּל יִרְאֵי אֱלֹהִים
  choice: 凡敬畏上帝的人
  rationale: 保留“敬畏”所包含的敬重、畏惧与崇拜意味，不将其弱化为一般的尊重，也不强化为单纯恐惧。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 原文使用通用神称 אֱלֹהִים，而非神名 יהוה；“上帝”是现代普通话中自然、庄重的对应表达。
- source_word: אֲשֶׁר עָשָׂה
  choice: 他……所做的事
  rationale: 以自然汉语关系结构表达已经完成且在见证中仍具现实意义的作为。
- source_word: לְנַפְשִׁי
  choice: 为我
  rationale: נֶפֶשׁ 在这里可指“我本人、我的生命、我的性命”；现代汉语若直译“为我的灵魂”容易使读者误解为身心二分意义，因此正文用“为我”，并在脚注保留“为我的性命”的可能。
theological_decisions:
- issue: “敬畏上帝”的含义
  choice: 保留“敬畏”
  alternative: 尊崇上帝；惧怕上帝
  rationale: 原文既不只是泛泛的尊重，也不必限定为惊恐，而是指人在上帝面前带着畏惧、尊崇与敬拜的态度；“敬畏”能保留这种张力。
- issue: נֶפֶשׁ 的所指
  choice: 为我
  alternative: 为我的性命；为我的生命；为我的灵魂
  rationale: 此词语义范围包括人自身、生命或性命。上下文是诗人见证上帝为他所行之事，正文“为我”最自然且不过度限定；脚注提示较具体的“性命”读法，以保留原文幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……的人”适合公开呼召的诗体语境；感叹号传达两个命令式所具有的邀请和呼吁语气。
