base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/015.yaml
  text: I will offer to you burnt offerings of fattened animals[a], with the smoke of rams; I will prepare cattle and goats[d][c][b]. Selah
translation:
  language: zh_hans
  text: 我要把肥壮的牲畜作为燔祭献给你，伴随着焚烧公绵羊所升起的烟气[a]；我要献上牛和公山羊[b]。细拉[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烟气”也可理解为祭牲焚烧所发出的“气味”或“香气”。
    reason: lexical_alternative
  - marker: b
    text: “公山羊”原文特指雄性的山羊。
    reason: lexical_clarification
  - marker: c
    text: “细拉”含义不确定，可能是音乐或礼仪用的标记。
    reason: cultural_note
lexical_decisions:
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 这是献祭术语，指祭牲在坛上焚烧献上的祭；“燔祭”是简体中文圣经语境中准确而凝练的通行译法。
- source_word: מֵחִים
  choice: 肥美的牲畜
  rationale: 该词指肥壮、饲养良好而适合作贵重祭物的牲畜；此译比直译“肥者”更自然清楚。
- source_word: אַעֲלֶה לָךְ
  choice: 献给你
  rationale: עלה的使役形在献祭语境中指使祭物升上坛而献出；采用自然的祭祀用语，同时保留对上帝的直接称呼。
- source_word: עִם קְטֹרֶת אֵילִים
  choice: 并有公绵羊焚烧升起的烟气
  rationale: קְטֹרֶת在此可指焚烧祭牲所产生的烟气或气味；上下文明确提到公绵羊，故不译成容易让人误解为另加香料的“香”。
- source_word: אֶעֱשֶׂה
  choice: 我要献上
  rationale: עשה字面为“做”，但在献祭语境中可指办理、献上祭物；“献上”在现代汉语中自然，并明确表达这里的祭祀行为。
- source_word: בָקָר
  choice: 牛
  rationale: 这是指牛类牲畜的集合名词；“牛”保留其宽泛性，不擅自限定为公牛。
- source_word: עִם עַתּוּדִים
  choice: 和公山羊
  rationale: עַתּוּדִים特指雄性的山羊；正文直接译出性别信息，使祭牲种类清楚。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切意义不明，可能是音乐或礼仪标记；依传统音译，不作推测性解释。
theological_decisions:
- issue: 祭牲烟气的措辞是否带有蒙悦纳的“馨香”含义
  choice: 正文译为“烟气”，脚注说明也可理解为“气味”或“香气”
  alternative: 直接译为“香气”
  rationale: 原词在此可涉及焚烧所生的烟或气味，但经文本身没有明确使用表示“馨香”的固定搭配；保留较中性的正文可避免把神学评价提前写入译文。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀用语。“燔祭”和“细拉”保留必要的经文传统术语；其余表达避免古奥句式。分号对应诗句中两组献祭陈述，既体现平行结构，也保持朗读节奏。
