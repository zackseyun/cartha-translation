  yaml_path: translation/ot/psalms/066/010.yaml
  text: For you have tested us[a], O God[b]; you have refined us as silver is refined.
translation:
  language: zh_hans
  text: 因为你试验我们，上帝；你熬炼我们，如同熬炼银子一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出赞美上帝的理由；“因为”自然保留其解释性的因果作用。
- source_word: בְחַנְתָּנוּ
  choice: 你曾试验我们
  rationale: בּחן 指检验、察验，常含借测试显明真伪或品质之意；“试验”清楚易懂，并与下文熬炼银子的比喻相呼应。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处是直接呼语；“上帝啊”明确保留呼告语气，适合现代汉语诗体。
- source_word: צְרַפְתָּנוּ
  choice: 你熬炼我们
  rationale: צרף 描写以火提炼金属；“熬炼”保留冶金意象，也能自然用于比喻人经历考验。
- source_word: כִּצְרָף
  choice: 如同熬炼……一样
  rationale: 前缀 כְּ 表示比较，后接的形式泛指熬炼过程；此译法自然呈现明喻，而不额外指定熬炼者。
- source_word: כָּסֶף
  choice: 银子
  rationale: 直译为贵金属银；“银子”在现代汉语中能自然表达被熬炼的金属。
