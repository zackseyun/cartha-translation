  text: אָב֣וֹא בֵיתְ/ךָ֣ בְ/עוֹל֑וֹת אֲשַׁלֵּ֖ם לְ/ךָ֣ נְדָרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/013.yaml
  text: I will come into your house with burnt offerings[a]; I will fulfill my vows to you[c][b],
translation:
  language: zh_hans
  text: 我要带着燔祭来到你的家中[a]；我要向你履行我所许的愿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的家中”直译为“你的房屋中”。在献燔祭的语境中，这里很可能指上帝的圣所。
    reason: cultural_note
  - marker: b
    text: 也可译作“我要向你还愿”或“我要向你偿付我的誓愿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוֹא
  choice: 我要……来到
  rationale: בוא 的 Qal 未完成式第一人称单数，在此表达诗人将要或立意采取的行动。“来到”保留基本词义，也自然衔接目的地。
- source_word: בֵיתְךָ
  choice: 你的殿中
  rationale: 字面是“你的房屋/家”。在献燔祭的语境中，所指为上帝的圣所；现代汉语称上帝的“殿”既保留“房屋”的意象，也能自然传达礼拜场所。脚注注明较直译的表达。
- source_word: בְעוֹלוֹת
  choice: 带着燔祭
  rationale: עוֹלָה 是全部焚烧献上的祭物，通常译作“燔祭”；前缀 בְּ 在此表示伴随。“带着”符合现代汉语表达。
- source_word: אֲשַׁלֵּם
  choice: 还
  rationale: שלם 的 Piel 在 נדר（愿）这一固定搭配中意为履行、偿还所许的愿。汉语“还愿”准确而简洁，并保留义务已经产生、现予履行的含义。
- source_word: לְךָ
  choice: 向你
  rationale: 介词 לְ 标明履行誓愿所针对的对象；“向你还愿”是自然的现代汉语搭配。
- source_word: נְדָרָי
  choice: 我的愿
  rationale: 复数名词附第一人称单数后缀，意为“我的誓愿”。汉语在“还愿”搭配中用“我的愿”自然且忠实。
theological_decisions:
- issue: 是否在正文中把“你的房屋”明确译为圣殿或圣所
  choice: 译作“你的殿中”，并以脚注保留“你的家中”这一较直译形式
  alternative: 你的家中／你的房屋中
  rationale: 希伯来文确实是“你的房屋”，但献燔祭的直接语境表明这里指上帝的礼拜场所。“殿”在中文里既可承接上帝居所的意象，又避免让现代读者误解为普通住宅；脚注保留原文的具体措辞，不进一步限定为后期意义上的某一座圣殿。
- issue: אֲשַׁלֵּם נְדָרָי 应译为“履行誓愿”还是“还愿”
  choice: 还我的愿
  alternative: 履行我向你所许的愿
  rationale: 两者都表达所许之愿必须兑现。“还愿”是现代汉语中与献祭和履行许愿义务相配的固定说法，并未引入额外的功德或交换观念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“燔祭”和“还愿”是必要且通行的礼仪用语；句式简洁，保留希伯来诗句两个并列意向。所有脚注标记均置于正文相应位置。
