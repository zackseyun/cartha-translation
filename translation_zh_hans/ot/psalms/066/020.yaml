source:
  edition: WLC
  text: בָּר֥וּךְ אֱלֹהִ֑ים אֲשֶׁ֥ר לֹֽא הֵסִ֘יר תְּפִלָּתִ֥/י וְ֝/חַסְדּ֗/וֹ מֵ/אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
translation:
  language: zh_hans
  text: 上帝是当受称颂的！他没有拒绝我的祷告，也没有使他的慈爱离开我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他没有把我的祷告和他的慈爱从我这里移开。”这里的“慈爱”也含有忠贞、信实之意。
    reason: 说明原文中同一动词统摄两个宾语，并保留חֶסֶד的语义幅度。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 当受称颂的
  rationale: 该被动分词在这里构成颂赞性的感叹语；译为“当受称颂的”自然、庄重，也保留其颂赞功能。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指诗人所颂赞的以色列的上帝；“上帝”是现代普通话中清楚而庄重的称呼。
- source_word: אֲשֶׁר
  choice: 他
  rationale: 原词引出描述上帝的关系从句。中文分句用“他”承接，较“那位……”更自然。
- source_word: לֹא הֵסִיר
  choice: 没有拒绝……也没有使……离开
  rationale: הֵסִיר基本义为“移开、使离去”。同一个动词统摄“我的祷告”和“他的慈爱”，但中文若机械地共用一个动词会生硬，因此按两个宾语分别译出其语境含义，并以脚注保留原文结构。
- source_word: תְּפִלָּתִי
  choice: 我的祷告
  rationale: 直接对应诗人向上帝所献的祈求；“祷告”在现代汉语中准确自然。
- source_word: וְחַסְדּוֹ
  choice: 也没有使他的慈爱
  rationale: 在否定句中，וְ连接两个宾语，中文自然译作“也没有”。חֶסֶד在此兼有恩慈、忠贞和信实之意；正文用宽广且诗篇语体自然的“慈爱”，不把含义限缩为单纯情感。
- source_word: מֵאִתִּי
  choice: 离开我
  rationale: 该介词短语表达与说话者分离；结合使役动词译作“使……离开我”，准确而自然。
theological_decisions:
- issue: חֶסֶד的译法
  choice: 他的慈爱
  alternative: 他的忠贞之爱；他的信实慈爱；他的怜悯
  rationale: חֶסֶד可同时包含恩慈、忠诚、信实等关系性内涵。“慈爱”在中文诗篇语境中简洁、庄重且涵盖面较广；脚注说明其忠贞信实的层面，以免把它理解为仅仅一种情感。
- issue: 上帝未“移开”祷告的含义
  choice: 没有拒绝我的祷告
  alternative: 没有移开我的祷告；没有转开我的祷告
  rationale: 希伯来文以同一动词统摄“祷告”和“慈爱”，形成凝练而略带张力的表达。中文正文将前者按语境译为“拒绝”，即上帝没有把祷告撇开不顾；脚注保留直译信息，不进一步断言具体的应允方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。首句用感叹号呈现颂赞语气；后句为避免生硬直译，按中文搭配分别处理同一希伯来动词，同时借脚注保留原文的平行结构与词义张力。
