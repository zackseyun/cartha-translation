  text: הָ֤פַךְ יָ֨ם לְֽ/יַבָּשָׁ֗ה בַּ֭/נָּהָר יַֽעַבְר֣וּ בְ/רָ֑גֶל שָׁ֝֗ם נִשְׂמְחָה בּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/006.yaml
  text: He turned the sea into dry land[a]; they passed through the river on foot[b]; there we rejoiced in him.
translation:
  language: zh_hans
  text: 他使海变成干地；他们徒步过河[a]；我们在那里以他为乐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节很可能回顾两次拯救：出埃及时过海，以及以色列人进入那地时过约旦河。
    reason: cross_reference
  - marker: b
    text: 或译：“让我们在那里以他为乐吧。”希伯来语形式也可理解为劝勉。
    reason: alternative_reading
lexical_decisions:
- source_word: הָפַךְ
  choice: 使……变成
  rationale: 该动词表示转变或改变；“使海变成干地”自然地表达上帝使海的状态发生改变，也保留具体意象。
- source_word: יָם
  choice: 海
  rationale: 按希伯来词的一般词义直译为“海”；经文语境使人联想到出埃及时过海的事件，但正文不把具体海名补入。
- source_word: לְיַבָּשָׁה
  choice: 变成干地
  rationale: יַבָּשָׁה 指干地或旱地，前置介词 לְ 在此表示结果；“变成干地”准确且符合现代汉语。
- source_word: בַּנָּהָר
  choice: 过河
  rationale: 介词字面可作“在河中”，与 יַעַבְרוּ 连用时自然表达穿越河流；汉语用“过河”最为简洁。
- source_word: יַעַבְרוּ
  choice: 他们……过
  rationale: 该未完成式表示经过或越过；在追述上帝往昔作为的语境中采用叙事性表达“他们……过”，不把动作方式过度具体化。
- source_word: בְרָגֶל
  choice: 步行
  rationale: 希伯来语意为“用脚、徒步”；“步行”清楚表明他们不是乘船渡河。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留地点副词的开放性，既可指上述渡越之地，也可泛指那些蒙拯救的事件中。
- source_word: נִשְׂמְחָה
  choice: 我们……欢喜
  rationale: 该第一人称复数形式可带劝勉语气，也可在此语境中表达群体对往事的认同。正文依诗篇的回顾语境译为陈述句，并用脚注保留劝勉式理解。
- source_word: בּוֹ
  choice: 因他
  rationale: 阳性单数代词在上下文中最自然地指上帝；“因他欢喜”是现代汉语中表达以他为喜乐缘由的自然说法。
theological_decisions:
- issue: 历史事件的双重呼应
  choice: 正文分别保留“海”和“河”，脚注指出可能同时回顾出埃及时过海和进入应许之地时过约旦河。
  alternative: 只把整节理解为对单一渡水事件的诗意描写。
  rationale: 希伯来正文没有明说事件名称，因此正文不补入“红海”或“约旦河”；脚注说明较可能的历史呼应，而不将其写死在译文中。
- issue: נִשְׂמְחָה 的陈述或劝勉语气
  choice: 正文译作回顾性的“我们在那里因他欢喜”。
  alternative: “让我们在那里因他欢喜吧。”
  rationale: 全节正在追述上帝的拯救作为，陈述式可体现敬拜群体与先民共同认同这段历史；但希伯来形式容许劝勉语气，因此以脚注保留这一真实歧义。
- issue: בּוֹ 的指代对象
  choice: 译作“因他”，理解为指上帝。
  alternative: 把代词理解为指那地方或事件。
  rationale: 阳性单数形式与本诗以上帝为颂赞对象的语境最相称；仍承认从纯语法层面看，指向相关地点或事件并非绝无可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保持原文三个分句的紧凑并列；不在正文中补出“红海”“约旦河”或“以色列人”，以免超出原文明确所说。脚注标记均置于所说明的短语之后。
