  text: אִמְר֣וּ לֵ֭/אלֹהִים מַה נּוֹרָ֣א מַעֲשֶׂ֑י/ךָ בְּ/רֹ֥ב עֻ֝זְּ/ךָ֗ יְֽכַחֲשׁ֖וּ לְ/ךָ֣ אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/003.yaml
  text: Say to God[a], “How awesome are your works! Because of the greatness of your strength, your enemies cringe before you.”
translation:
  language: zh_hans
  text: 你们要对上帝说：“你的作为何等可畏！因你力量浩大，你的仇敌向你假意屈服[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在你面前畏缩”，或“不情愿地向你屈服”。希伯来语动词可指虚假或被迫的顺服。
    reason: 该动词在此兼有畏缩、勉强屈服和假意顺服等可能含义，正文无法同时完全呈现。
lexical_decisions:
- source_word: אִמְרוּ
  choice: 你们要……说
  rationale: 这是复数命令式，呼吁敬拜群体开口说话；用“你们要……说”自然表达现代汉语中的群体命令。
- source_word: לֵאלֹהִים
  choice: 对上帝
  rationale: 介词 לְ 标明说话的对象；“对上帝说”是自然、直接的现代汉语表达。
- source_word: מַה נּוֹרָא
  choice: 何等可畏
  rationale: מַה 在此构成感叹，נוֹרָא 兼有令人敬畏、令人惧怕之意；“何等可畏”保留诗歌语气及敬畏与惧怕并存的张力。
- source_word: מַעֲשֶׂיךָ
  choice: 你的作为
  rationale: מַעֲשֶׂה 指所做之事或行动；“作为”既符合诗篇赞颂语体，也比“工作”更自然庄重。
- source_word: בְּרֹב עֻזֶּךָ
  choice: 因你力量浩大
  rationale: בְּ 在这里可表达原因或根据，רֹב 表示丰盛、巨大，עֹז 表示力量、威力；此译简洁保留因果关系和力量之强盛。
- source_word: יְכַחֲשׁוּ לְךָ
  choice: 向你假意屈服
  rationale: כחש 的 Piel 形式与 לְ 连用，可指迫于威势而作出虚假、勉强或欺骗性的服从。“假意屈服”明确保留不真诚的负面意味，同时以脚注呈现畏缩或勉强屈服的可能表达。
- source_word: אֹיְבֶיךָ
  choice: 你的仇敌
  rationale: 准确表达复数名词及第二人称单数所属后缀，且符合现代汉语圣经语体。
theological_decisions:
- issue: 仇敌对上帝回应的性质
  choice: 译为迫于权能而作出的假意屈服，并以脚注保留其他表达方式。
  alternative: 较笼统地译为“向你屈服”，或侧重外在姿态译为“在你面前畏缩”。
  rationale: 希伯来动词常带否认、虚假或被迫顺服的色彩。正文呈现其不真诚的一面，但不把它解释成真心敬拜；脚注保留被迫、勉强和畏缩等语义可能，避免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语言。“何等可畏”保留敬畏与惧怕的双重意味；整体句式简洁，并用脚注说明关键动词的真实歧义。
