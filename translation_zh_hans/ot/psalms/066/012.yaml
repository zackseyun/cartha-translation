  text: הִרְכַּ֥בְתָּ אֱנ֗וֹשׁ לְ/רֹ֫אשֵׁ֥/נוּ בָּֽאנוּ בָ/אֵ֥שׁ וּ/בַ/מַּ֑יִם וַ֝/תּוֹצִיאֵ֗/נוּ לָֽ/רְוָיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/012.yaml
  text: You made a man ride over our heads; we went through fire and through water, yet you brought us out into abundance.
translation:
  language: zh_hans
  text: 你使人骑在我们头上；我们经过火与水，你却领我们出来，带到丰盛之地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丰盛之地”或译“富足之境”；原文所指可以是丰裕、充盈的境况。
    reason: 说明 לָרְוָיָה 的词义范围，避免把它过度限定为具体地点或单一类型的福分。
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: 人
  rationale: 此处是集合性或泛指的单数，指压迫者中的“人”，中文用不定的“人”既保留希伯来文单数形式，也避免误解为特指某一个男子。
- source_word: הִרְכַּבְתָּ ... לְרֹאשֵׁנוּ
  choice: 你使人骑在我们头上
  rationale: 贴近原文强烈而具体的受辱、受制意象；“使”也保留诗人把这场试炼归于上帝许可或安排的表达。
- source_word: בָאנוּ בָאֵשׁ וּבַמַּיִם
  choice: 我们经过火与水
  rationale: 保留原文成对的灾难意象及简洁诗体；介词在汉语中自然表达为“经过”。
- source_word: לָרְוָיָה
  choice: 到了丰盛之地
  rationale: 该词指丰裕、充盈或宽裕的境况；加“之地”使目标性表达在中文中自然，但不把含义收窄为某种特定物质福分。
theological_decisions:
- issue: 上帝与苦难的关系
  choice: 保留“你使人……”
  alternative: “你容许人……”
  rationale: 原文使用使役形，直接把事件置于上帝的主权之下；译为“容许”会加入原文未明说的解释，削弱其神学张力。
- issue: לָרְוָיָה 所指的福分性质
  choice: 译作“丰盛之地”并加注异译
  alternative: “宽阔之地”或“富足之境”
  rationale: 原词可指丰盛、充裕、饱足的境况，具体是地点、状态还是象征性福境并不完全确定，因此正文采用自然概括语，脚注保留歧义。
translation_notes:
  register: 采用庄重而现代的诗体汉语。“骑在我们头上”刻意保留原文鲜明意象；分号呈现从受压、历险到蒙拯救的推进。“你却”明确转折，符合上下文逻辑。
