source:
  edition: WLC
  text: זַמְּר֥וּ כְבֽוֹד שְׁמ֑/וֹ שִׂ֥ימוּ כָ֝ב֗וֹד תְּהִלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/002.yaml
  text: Sing the glory of his name[a]; make his praise glorious.
translation:
  language: zh_hans
  text: 要歌颂他名的荣耀，使他的颂赞满有荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他的颂赞满有荣耀”也可较直译为“把荣耀加给他的颂赞”。“他的颂赞”在这里主要指献给他的赞美。
    reason: 说明希伯来语“放置荣耀”的表达方式，并交代所属后缀的语义范围。
lexical_decisions:
- source_word: זַמְּרוּ
  choice: 歌颂
  rationale: 这是复数命令式，指以歌唱或音乐来赞美；“歌颂”既保留歌唱意味，也自然表达敬拜语境中的赞美。
- source_word: כְבוֹד שְׁמוֹ
  choice: 他名的荣耀
  rationale: 按希伯来语结构直译，保留“荣耀”属于“他的名”这一重点，而不简化为“他荣耀的名”。
- source_word: שִׂימוּ
  choice: 使……满有
  rationale: שׂים本义为“放置、赋予”；与“荣耀”连用时，“使……满有荣耀”较符合现代汉语，同时保留赋予或彰显荣耀的含义。
- source_word: כָבוֹד
  choice: 荣耀
  rationale: 采用名词“荣耀”，并在汉语句法中以“满有荣耀”表达，保留本节两次出现כבוד所形成的呼应。
- source_word: תְּהִלָּתוֹ
  choice: 他的颂赞
  rationale: 保留第三人称单数所属形式及其一定程度的语义开放性；在上下文中主要指献给他的赞美，也可带有他的美名或受颂扬之意。
theological_decisions:
- issue: “他的颂赞”中代词后缀的关系
  choice: 保留为“他的颂赞”
  alternative: “对他的赞美”
  rationale: 后者明确解释为以神为赞美对象，但希伯来语所属后缀本身较宽泛；正文保留其张力，脚注说明主要语境含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；以“歌颂”“颂赞”保持诗歌和敬拜语体，并保留原文两次“荣耀”的修辞呼应。
