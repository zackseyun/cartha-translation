  text: מֹ֘שֵׁ֤ל בִּ/גְבוּרָת֨/וֹ עוֹלָ֗ם עֵ֭ינָי/ו בַּ/גּוֹיִ֣ם תִּצְפֶּ֑ינָה הַ/סּוֹרְרִ֓ים אַל ירימו לָ֣/מוֹ סֶֽלָה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/007.yaml
  text: He rules forever by his might; his eyes watch the nations[a]. Let not the rebellious exalt themselves. Selah
translation:
  language: zh_hans
  text: '他以大能永远掌权；


    他的眼目注视列国。


    悖逆的人不可自高[a]。


    细拉'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可抬高自己”，或“不可起来”。希伯来语动词可表示抬高、高举或起来。
    reason: 保留 רום 在此处“自我高举”之外的“抬起／起来”词义可能，且不增添原文未明确表达的“反抗”。
lexical_decisions:
- source_word: מֹשֵׁל
  choice: 掌权
  rationale: 该词是 משל 的 Qal 主动分词，在此作谓语，表达持续的统治；“掌权”自然、庄重，也保留其延续意味。
- source_word: בִּגְבוּרָתוֹ
  choice: 以大能
  rationale: גְּבוּרָה 表示力量、威能；介词 בְּ 在此可表凭借或方式，“以大能”传达他凭自己的能力施行统治。
- source_word: עוֹלָם
  choice: 永远
  rationale: 在本句中作时间状语，表示没有终止的持续性；“永远”是现代汉语中简洁自然的表达。
- source_word: עֵינָיו
  choice: 他的眼目
  rationale: 保留原文关于上帝观看的拟人化诗歌意象，不将其简化为“他”。“眼目”较“眼睛”更符合庄重诗体。
- source_word: בַּגּוֹיִם
  choice: 列国
  rationale: גּוֹיִם 在此泛指各国、万邦，并非后期语境中特指“外邦人”；“列国”简洁且适合诗篇语体。
- source_word: תִּצְפֶּינָה
  choice: 鉴察
  rationale: צפה 表示观看、守望；该阴性复数动词与“眼目”呼应。“鉴察”既表达密切观看，也符合现代庄重宗教诗歌语域。
- source_word: הַסּוֹרְרִים
  choice: 悖逆的人
  rationale: סרר 的分词指固执反抗、悖逆的人；此译保留其持续的道德姿态，又比名词化的“叛徒”涵盖面更合适。
- source_word: אַל יָרִימוּ לָמוֹ
  choice: 不可自高
  rationale: אַל 加未完成式构成禁止或警告；רום 的 Hiphil 可指抬高、高举，לָמוֹ 在此支持反身理解。“自高”自然地表达自我抬举，同时不排除“起来反抗”的语义可能。
- source_word: סֶלָה
  choice: 细拉
  rationale: 这是意义未能确定的礼仪或音乐标记，采用通行音译，不作推测性解释。
theological_decisions:
- issue: 上帝观看列国的拟人化表达
  choice: 保留“他的眼目鉴察列国”
  alternative: 译作“他鉴察列国”
  rationale: 原文明确提到“他的眼目”；保留这一意象可维持诗歌力量，并不必然暗示上帝具有受造物的局限。
- issue: 对悖逆者的禁令所指为何
  choice: 译为禁止自我抬高：“不可自高”
  alternative: “不可抬头”或“不可起来反抗”
  rationale: יָרִימוּ לָמוֹ 可自然理解为自我高举，但 רום 也可能含“抬起、起来”之意。正文采用语境中较顺畅的自高义，脚注保留真实的词义张力，不把它处理为原文没有明确表达的被动“不可被高举”。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语，并保留诗行结构。“掌权”“眼目”“鉴察”“悖逆”“细拉”适合诗篇语域；“不可自高”比文言色彩更浓的倒装或生硬直译更清楚。脚注标记置于其实际说明的短语之后。
