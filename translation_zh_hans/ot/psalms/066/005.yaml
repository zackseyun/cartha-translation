id: PSA.66.5
reference: Psalms 66:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְכ֣וּ וּ֭/רְאוּ מִפְעֲל֣וֹת אֱלֹהִ֑ים נוֹרָ֥א עֲ֝לִילָ֗ה עַל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/005.yaml
  text: Come and see the works of God[a]; he is awesome in his deeds toward the children of man.
translation:
  language: zh_hans
  text: 你们来观看上帝的作为；他向世人[a]所行的事令人敬畏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“人的众子”，即“人类”。
    reason: 保留原文的字面表达，同时说明其泛指全人类。
lexical_decisions:
- source_word: לְכוּ
  choice: 来
  rationale: 这是复数命令式；虽然动词基本义可作“去”，但与后面的“观看”连用时构成邀请，现代汉语自然表达为“来观看”。
- source_word: וּרְאוּ
  choice: 观看
  rationale: 复数命令式，呼吁众人亲自察看上帝的作为；“观看”比单用“看”稍显庄重，同时保持通俗。
- source_word: מִפְעֲלוֹת
  choice: 作为
  rationale: 复数名词，指上帝已经成就的行动和工作；“作为”自然、庄重，也与后半句的“所行的事”保持适度的词汇区别。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处明确指以色列的上帝，故采用单数专称“上帝”。
- source_word: נוֹרָא
  choice: 令人敬畏
  rationale: 该词表达使人产生畏惧与崇敬的性质；“令人敬畏”保留了庄严、可畏的意味，避免现代口语中“可怕”偏向单纯负面的含义。
- source_word: עֲלִילָה
  choice: 所行的事
  rationale: 单数集合性或抽象用法，描述上帝的行动；汉语用“所行的事”可自然表达其整体行为。
- source_word: עַל
  choice: 向
  rationale: 介词标示行动所指向或涉及的对象；“向”不预先判定这些行动是施恩还是审判，保留原文的宽泛性。
- source_word: בְּנֵי אָדָם
  choice: 世人
  rationale: 字面为“人的众子”，在希伯来语中是泛指全人类的惯用表达；“世人”在现代汉语中简洁、自然且涵盖所有人，字面形式则收入脚注。
theological_decisions:
- issue: בְּנֵי אָדָם 作为泛指人类的表达
  choice: 世人
  alternative: 人的众子／人类
  rationale: 该短语虽采用阳性复数形式，语境中却泛指全体人类。“世人”准确传达所指范围，不把经文限制为男性；脚注保留其希伯来语字面意象。
- issue: עַל 所表达的上帝行动与人类的关系
  choice: 向世人所行的事
  alternative: 在人身上所行的事／对世人所做的事
  rationale: 原介词可按语境表达“向、对、临到、在……之上”等关系。正文采用中性的“向”，不擅自把上帝的行动解释为纯粹恩惠或敌对审判。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“来观看”保留诗歌中的公开邀请语气；分号呈现两小句的推进关系。
