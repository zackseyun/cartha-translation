base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/009.yaml
  text: the one who keeps our soul in life and has not allowed our feet to slip[a][b][c].
translation:
  language: zh_hans
  text: 他保全我们的性命[a][b]，不让我们的脚摇动[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “保全”直译可作“把……置于生命中”，也可理解为“使……列在活人之中”；希伯来语动词的基本义是“放置、安置”，在这里有保全生命的意思。
    reason: lexical_alternative
  - marker: b
    text: “性命”也可译作“生命”或“我们”；希伯来语 נֶפֶשׁ 的含义范围包括性命、生命、自我和人本身。
    reason: lexical_alternative
  - marker: c
    text: “摇动”也可译作“滑跌”或“站立不稳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  choice: 使……存活
  rationale: שׂוּם的基本义是“放置、安置”；此处分词实词化，指上帝是施行动作的那一位。它与“我们的性命”和“在生命中”连用，在语境中表达保全生命、使之存活的意思。“使……存活”既符合现代汉语，也保留上帝主动施行保守的含义。
- source_word: נַפְשֵׁנוּ
  choice: 我们的性命
  rationale: נֶפֶשׁ的语义范围包括性命、生命、自我和人本身。这里与בַּחַיִּים连用，重点在生命得以保存；“性命”比“灵魂”更能避免把原文限定为人的非物质部分，同时保留原文对人的生命本身的指称。
- source_word: בַּחַיִּים
  choice: 存活
  rationale: 字面可理解为“在生命中”或“在活人中”。汉语用“使……存活”自然表达整句的惯用意义，即使我们的性命仍处于活着的状态；脚注保留较贴近字面的译法。
- source_word: וְלֹא נָתַן
  choice: 不让
  rationale: נָתַן与后接的不定式连用时可表示“准许、任凭”。“不让”准确而自然地表达上帝没有容许脚发生摇动。
- source_word: לַמּוֹט
  choice: 摇动
  rationale: מוֹט表示摇晃、不稳、滑动或倾倒。与“脚”搭配时，“摇动”保留原文稳定与失稳的形象；“滑跌”是语境允许的另一种表达。
- source_word: רַגְלֵנוּ
  choice: 我们的脚
  rationale: 原文用“脚”这一具体形象表示人的立足与安稳。汉语保留该形象，不抽象改写为“我们的道路”或“我们的脚步”。
theological_decisions:
- issue: נֶפֶשׁ是否应限定为“灵魂”
  choice: 译作“性命”
  alternative: 灵魂
  rationale: 本节关注上帝保全人的生命，并未明确区分身体与非物质的灵魂。采用“性命”保留נֶפֶשׁ在此处“生命、自我”的广义，避免引入原文没有明说的人论区分。
- issue: הַשָּׂם בַּחַיִּים的动作应理解为“安置”还是“保全”
  choice: 正文按语境译为“使……存活”，脚注保留字面可能
  alternative: 把我们的性命安置在生命中／活人中
  rationale: 原文“放置”的词义与保全生命的语境含义彼此重叠。正文采用自然汉语表达其语境功能，同时用脚注保存原文措辞所容许的较字面理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使我们的性命存活”比逐字译作“把我们的性命放在生命中”更自然；“不让”清楚表达许可结构，“脚摇动”则保留诗歌中具体的稳定意象。脚注分别保存“安置”、נֶפֶשׁ的宽广语义及מוֹט的其他可能译法。
