  text: הֲבֵאתָ֥/נוּ בַ/מְּצוּדָ֑ה שַׂ֖מְתָּ מוּעָקָ֣ה בְ/מָתְנֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/011.yaml
  text: You brought us into the net[b][a]; you laid affliction on our loins.
translation:
  language: zh_hans
  text: 你使我们落入罗网[a]；你把重压加在我们的腰间[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罗网”或译“堡垒”“要塞”或“陷阱”；希伯来词可指捕捉、困禁之物或场所。
    reason: lexical_alternative
  - marker: b
    text: “腰间”直译指腰或腰胯部；这里描绘重压加在身体承重部位的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵאתָנוּ
  choice: 你使我们落入
  rationale: 该词是 בוא 的使役形，带第一人称复数宾语后缀，直指上帝使“我们”进入某种境地。结合“罗网”的意象，“使我们落入”既自然，也保留明确的神圣施事性。
- source_word: בַמְּצוּדָה
  choice: 罗网
  rationale: מְצוּדָה 可指捕捉、困禁之物或场所，也可指堡垒。诗歌此处描写受试炼和压迫，“罗网”最能体现被捕获、受困的意象；介词 ב 在使役移动动词之后表达进入其中。
- source_word: שַׂמְתָּ
  choice: 你把……加在
  rationale: שׂים 的基本义为“放、置”。汉语以“把重压加在……”自然表达将负担施于身体，同时保留第二人称主动语态。
- source_word: מוּעָקָה
  choice: 重压
  rationale: 该名词表达压迫、困苦、束缚或沉重负担。“重压”既保留压迫感，也能与下文身体承重的意象自然结合，而不把词义局限为抽象的“苦难”。
- source_word: בְמָתְנֵינוּ
  choice: 在我们的腰间
  rationale: מָתְנַיִם 指腰、腰胯部。“腰间”是现代汉语中自然、端庄且贴近身体意象的表达；介词 ב 在此按负担施加于身体的关系译为“在……上/间”。
theological_decisions:
- issue: 苦难意象中的上帝施事性
  choice: 保留“你使我们……你把……”的直接归因
  alternative: 弱化为“我们落入罗网”或“重压临到我们”
  rationale: 希伯来文连续使用第二人称动词，直接称上帝为使百姓进入困境并施加重压者。译文不弱化这一神学张力。
- issue: מוּעָקָה 的具体性质
  choice: 译为兼具负担与压迫意味的“重压”
  alternative: 明确译为“苦难”“锁链”或“重担”
  rationale: 原词涵盖困苦、压迫、约束等语义，具体所指并不完全确定。“重压”保留其开放性，并与加在腰间的身体图像相合。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。以“落入罗网”和“重压加在腰间”保存诗句的捕获与负重双重意象；分号对应两个平行分句。所有脚注标记均置于正文相应词语之后。
