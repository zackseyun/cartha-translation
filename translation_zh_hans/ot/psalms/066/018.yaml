source:
  edition: WLC
  text: אָ֭וֶן אִם רָאִ֣יתִי בְ/לִבִּ֑/י לֹ֖א יִשְׁמַ֣ע אֲדֹנָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/018.yaml
  text: If I had cherished iniquity in my heart[a], the Lord would not have listened.
translation:
  language: zh_hans
  text: 我若心里看重罪孽[a]，主就不会垂听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我若心里注视罪孽，主就不会听。”
    reason: 保留 ראה“看、注视”的较字面表达，以及 שׁמע“听”的基本词义。
lexical_decisions:
- source_word: אָוֶן
  choice: 罪孽
  rationale: 该词可指邪恶、恶行或罪孽；本节论到内心所容留的恶成为祷告蒙垂听的阻碍，因此译作“罪孽”准确而自然。
- source_word: אִם
  choice: 若
  rationale: 此处引出条件从句；“若”符合诗体的庄重语气，也清楚表达假设关系。
- source_word: רָאִיתִי
  choice: 看重
  rationale: 原义为“看见”，但“在心里看”这一表达在此并非仅指意识到罪，而是对罪加以看顾、认可或容留。“看重”既保留“看”的意象，也传达内心有意重视的含义。
- source_word: בְלִבִּי
  choice: 心里
  rationale: 直译为“在我心中”，指人的内在思想与意志；“我若心里……”是自然简洁的现代汉语表达。
- source_word: לֹא יִשְׁמַע
  choice: 就不会垂听
  rationale: שׁמע可指听见或听取；在祷告语境中，“垂听”自然表达主留意并悦纳祷告，又不把原文过度解释为必然“应允”。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是对上帝的尊称，现代中文圣经语体通常译为“主”；此处无需按词形机械译作“我的主”。
theological_decisions:
- issue: 是否把“在心里看罪孽”按字面翻译，还是表达其习语含义
  choice: 主文译作“心里看重罪孽”
  alternative: 我若心里看见罪孽／我若心里注视罪孽
  rationale: 上下文所指不只是觉察自己有罪，而是内心对罪有所看顾、认可或容留。“看重”保留原文视觉动词的痕迹，同时传达其道德与意志层面的含义；脚注列出更贴近字面的译法，以保留词义张力。
- issue: שׁמע应译为“听见”、“垂听”还是“应允”
  choice: 垂听
  alternative: 听见／应允
  rationale: “垂听”适合祷告语境，表示主留意并接纳祈求；它比单纯“听见”更符合语用，又不像“应允”那样把结果说得超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。“若……就……”清楚呈现条件关系；“罪孽”“主”“垂听”均为普通读者熟悉的圣经用语。
