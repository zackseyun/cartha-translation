  text: לַ֭/מְנַצֵּחַ שִׁ֣יר מִזְמ֑וֹר הָרִ֥יעוּ לֵ֝/אלֹהִים כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/000.yaml
  text: For the choir director[a]. A song, a psalm. Shout joyfully to God[b], all the earth.
translation:
  language: zh_hans
  text: 交给乐长[a]。一首歌，一篇诗。全地都要向上帝欢呼[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“交给音乐主管”，或“交给诗班长”。
    reason: lexical_alternative
  - marker: b
    text: 或译“全地都要向上帝高声呼喊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词用于诗篇题注，可能指负责或带领音乐者；“乐长”简洁庄重，并以脚注保留其他可行译法。
- source_word: שִׁיר מִזְמוֹר
  choice: 一首歌，一篇诗
  rationale: 分别呈现“歌”与“诗歌／诗篇”两个相邻体裁词，不将其合并。
- source_word: הָרִיעוּ
  choice: 欢呼
  rationale: 该祈使动词指高声呼喊或发出欢呼声；“欢呼”自然传达声音洪亮及喜庆色彩，而脚注保留较中性的译法。
- source_word: כָּל־הָאָרֶץ
  choice: 全地
  rationale: 既可涵盖整个大地，也可借此称呼地上万民；“全地”保留原文的简练与可能的双重指向。
theological_decisions:
- issue: “全地”是指大地本身还是全地居民
  choice: 保留“全地”的拟人化呼召
  alternative: 地上所有的人
  rationale: 原文直接呼唤“全地”，未明确改写为居民；直译能保留诗歌意象及范围上的张力。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话。“交给乐长”保持题注风格；“一首歌，一篇诗”保留原文并列结构；末句用感叹号体现祈使呼召的力度。
