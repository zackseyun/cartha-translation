  yaml_path: translation/ot/psalms/066/019.yaml
  text: Surely God has heard[a]; he has listened to the voice of my prayer.
translation:
  language: zh_hans
  text: 神确实听见了；他留心听了我祷告的声音。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָכֵן
  choice: 确实
  rationale: 表达确认和肯定的语气，现代汉语自然，同时保留原文的强调作用。
- source_word: שָׁמַע
  choice: 听见了
  rationale: 该完成式把行动呈现为已经发生；“听见了”在汉语中清楚表达这一点，并与下句的专心聆听形成递进。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 原文虽为复数形态，却与单数动词搭配，此处指独一的神；“神”是简体中文圣经语体中自然、通行的对应词。
- source_word: הִקְשִׁיב
  choice: 留心听了
  rationale: 该使役词形表达专注、留意地聆听；“留心听了”既保留刻意关注之意，也避免过于古雅。
- source_word: בְּקוֹל
  choice: ……的声音
  rationale: קוֹל本义为“声音”；此处保留原文具体表达，并在汉语中组成“听了我祷告的声音”。
- source_word: תְּפִלָּתִי
  choice: 我祷告
  rationale: 带第一人称单数后缀，意为“我的祷告”；在所属结构中译作“我祷告的声音”更符合现代汉语习惯。
