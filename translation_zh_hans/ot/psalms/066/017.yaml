  yaml_path: translation/ot/psalms/066/017.yaml
  text: I cried out to him with my mouth[a], and praise was under my tongue.
translation:
  language: zh_hans
  text: 我曾用口向他呼求；颂赞在我的舌下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “颂赞”原文也可译为“高举”或“高举之辞”。“在我的舌下”保留原文的诗性意象，可能指颂赞之言已经预备说出。
    reason: 说明 וְרוֹמַם 的词义选择，并保留 תַּחַת לְשׁוֹנִי 这一罕见希伯来表达的意象与可能含义。
lexical_decisions:
- source_word: אֵלָיו
  choice: 向他
  rationale: 介词加第三人称阳性单数后缀直译为“向他”；上下文所指为神，但本节保留代词。
- source_word: פִּי
  choice: 用口
  rationale: פֶּה 的本义是“口”；“用口”既保留具体意象，也符合现代汉语表达。
- source_word: קָרָאתִי
  choice: 我曾……呼求
  rationale: קרא 在祷告语境中可指呼喊、求告；“呼求”表达恳切向神求告，又不过度强化情绪。
- source_word: וְרוֹמַם
  choice: 颂赞
  rationale: 该形式较宜理解为与 רום（高举）相关的名词，指高举或赞美；汉语“颂赞”自然表达以言语高举神的意思。
- source_word: תַּחַת
  choice: 在……下
  rationale: 保留介词“在下、下面”的空间意象，不把这一罕见诗性表达解释性改写为“在舌上”或“由口说出”。
- source_word: לְשׁוֹנִי
  choice: 我的舌
  rationale: 保留“舌头”的身体意象，而不抽象化为“言语”。
theological_decisions:
- issue: וְרוֹמַם 的语法与语义
  choice: 按名词理解，译作“颂赞”
  alternative: 按动词理解为“他被高举”；或译作较直白的“高举”
  rationale: 马所拉文本的形式容许讨论，但在本句平行结构中，名词“颂赞／高举之辞”较为顺畅；脚注保留相关语义和罕见表达的张力，不据此引入额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留“口”和“舌下”的希伯来身体意象；“我曾……呼求”适合诗篇回述语气。脚注标记已在正文中出现。
