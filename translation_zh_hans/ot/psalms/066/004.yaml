  text: כָּל הָ/אָ֤רֶץ יִשְׁתַּחֲו֣וּ לְ֭/ךָ וִֽ/יזַמְּרוּ לָ֑/ךְ יְזַמְּר֖וּ שִׁמְ/ךָ֣ סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/004.yaml
  text: All the earth will bow down to you and sing praise to you[a]; they will sing praise to your name[b]. Selah
translation:
  language: zh_hans
  text: '全地都要向你俯伏，向你歌颂；

    都要歌颂你的名。细拉[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细拉”可能是音乐或礼仪用语，确切含义不明。
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: כָּל与带定冠词的הָאָרֶץ在本诗语境中表达普世范围；“全地”简洁庄重，也比“全境”更能保留其宇宙性视野。
- source_word: יִשְׁתַּחֲווּ
  choice: 俯伏
  rationale: 该动词指人在尊者或上帝面前屈身、俯伏，并可由此表达敬拜。“俯伏”保留具体的身体动作，不把其含义提前抽象化为“敬拜”。
- source_word: לְךָ
  choice: 向你
  rationale: 介词לְ表示动作朝向受词；配合“俯伏”和“歌颂”，“向你”是自然且准确的现代汉语表达。
- source_word: וִיזַמְּרוּ / יְזַמְּרוּ
  choice: 向你歌颂／歌颂
  rationale: זמר在诗篇中通常指以歌声赞美；“歌颂”兼顾歌唱与赞美之义。原文两次出现该词，译文也保留重复。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 直译保留圣经中“名”所承载的身份、声誉与启示性内涵，不改写为较窄的“美名”或“威名”。
- source_word: סֶלָה
  choice: 细拉
  rationale: 此词确切意义不明，可能是音乐或礼仪标记；采用传统音译，避免以推测性的释义取代原文。
theological_decisions:
- issue: יִשְׁתַּחֲווּ应译为明确的宗教行为“敬拜”，还是具体动作“俯伏”
  choice: 俯伏
  alternative: 敬拜
  rationale: “俯伏”保留希伯来文具象的身体姿态，同时让敬拜含义由上帝作为对象及赞歌语境自然呈现，避免消除原文动作与宗教意义之间的张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以分号体现两个平行分句，并保留“歌颂”的重复。正文中的脚注标记置于“细拉”之后。
