  text: בָּרְכ֖וּ עַמִּ֥ים אֱלֹהֵ֑י/נוּ וְ֝/הַשְׁמִ֗יעוּ ק֣וֹל תְּהִלָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/008.yaml
  text: Bless our God[a], O peoples[b], and make the sound of his praise heard.
translation:
  language: zh_hans
  text: 万民哪，要称颂我们的上帝；要使人听见他的颂赞之声。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的颂赞之声”也可译作“向他的颂赞之声”。原文“颂赞”所带的第三人称后缀可表示与他相关或归于他的颂赞；按语境，也可理解为以他为对象的颂赞。
    reason: 原文“颂赞”后的第三人称后缀在此可保留为较宽泛的“他的”，也可按语境理解为“向他的”；脚注保留此语义可能性。
lexical_decisions:
- source_word: בָּרְכוּ
  choice: 称颂
  rationale: 这是复数命令式，呼召万民对上帝发出祝颂；“称颂”既保留对上帝说美言、尊崇他的圣经用法，也比现代汉语中可能被理解为上帝赐福人的“祝福”更清楚。
- source_word: עַמִּים
  choice: 万民哪
  rationale: 原文为复数，作呼语，指多个民族或民众群体；“万民哪”自然地表达面向众民的广泛呼召。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 忠实表达第一人称复数后缀“我们的”，保留诗人所属群体与受呼召之万民之间的视角区别。
- source_word: וְהַשְׁמִיעוּ
  choice: 使……被人听见
  rationale: 该词是使役形命令式，基本意思是“使人听见”；此译法明确保留使役和命令的力度，避免弱化为仅仅容许某事发生。
- source_word: קוֹל
  choice: 声音
  rationale: קוֹל可指声音或嗓音；此处强调颂赞可被听见的表达，“声音”在现代汉语中准确自然。
- source_word: תְּהִלָּתוֹ
  choice: 他的颂赞
  rationale: 保留第三人称单数后缀与“颂赞”的直接关系，不在正文中完全限定为“他所发出的颂赞”或“向他发出的颂赞”；后者作为语义可能性列入脚注。
theological_decisions:
- issue: תְּהִלָּתוֹ中第三人称后缀的关系
  choice: 他的颂赞
  alternative: 颂赞他的声音／归给他的颂赞
  rationale: 希伯来语后缀可直接表达所属或关联，在语境中也很自然地指向归给上帝、以他为对象的颂赞。正文保留较直接的形式，脚注说明另一种自然理解，不把语法上的张力作教义化处理。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“万民哪”保留呼语色彩；“称颂”适合对上帝发出的祝颂；“使……被人听见”虽略显正式，却准确呈现原文使役命令式。
