base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/001.yaml
  text: For the choir director[a]. A song, a psalm. Shout to God[b], all the earth.
translation:
  language: zh_hans
  text: 交给乐长[a]。一首歌，一篇诗。全地啊，要向上帝欢呼[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“交给音乐指挥”或“交给诗班指挥”。
    reason: lexical_alternative
  - marker: b
    text: 或译“全地啊，要向上帝高声呼喊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐指挥
  rationale: 此诗题用语指负责、督导音乐演出的人；“圣乐指挥”在现代汉语中自然，也保留礼仪音乐语境。介词 לַ 可理解为交付或归给该负责人。
- source_word: שִׁיר
  choice: 一首歌
  rationale: 按体裁名称直译，并使用汉语中与“歌”自然搭配的量词。
- source_word: מִזְמוֹר
  choice: 一篇诗
  rationale: 这是诗篇标题中的音乐性诗歌术语；“诗”简明自然。保留“歌”与“诗”两个并列体裁名称，不将二者合并。
- source_word: הָרִיעוּ
  choice: 欢呼
  rationale: 该动词表示发出响亮的呼喊，常含欢庆或胜利意味；“欢呼”兼顾声音强度和喜庆色彩，且比单纯“呼喊”更符合本诗赞美语境。
- source_word: לֵאלֹהִים
  choice: 向上帝
  rationale: 介词标明欢呼所朝向的对象；“向上帝”是自然准确的现代汉语表达。
- source_word: כָּל הָאָרֶץ
  choice: 全地啊
  rationale: 在此赞美诗语境中，הָאָרֶץ 指普世大地而非某一地域；“全地”保留呼召的普遍范围，语气词“啊”清楚标示呼语。
theological_decisions:
- issue: כָּל הָאָרֶץ 所指范围
  choice: 对全地的普遍呼召
  alternative: 对全境或地上领域的呼召
  rationale: 本诗的赞美语境支持普世性的呼召；译作“全地”既呈现广阔范围，也不额外限定受召者的具体身份。
- issue: הָרִיעוּ 的情感色彩
  choice: 欢呼
  alternative: 呼喊；发出欢呼声
  rationale: 原词可指响亮呼喊，并常带欢庆或得胜意味。“欢呼”保留这种常见色彩，但脚注列出较形式对应的表达，以免遮蔽其声音动作本身。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。诗题保持简洁，并保留原文“歌／诗”的双重体裁标签；正文用呼语倒装增强诗歌号召力。
