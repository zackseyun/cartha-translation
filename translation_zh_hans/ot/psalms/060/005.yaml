  text: לְ֭מַעַן יֵחָלְצ֣וּ/ן יְדִידֶ֑י/ךָ הוֹשִׁ֖יעָ/ה יְמִֽינְ/ךָ֣ ו/ענ/נו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/005.yaml
  text: So that your beloved ones may be delivered[b][a], save with your right hand and answer me.
translation:
  language: zh_hans
  text: 为使你所爱的人得以解救[a]，求你用右手施救，并应允我们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “解救”也可译作“搭救”或“救出”。
    reason: lexical_alternative
  - marker: b
    text: 另有读法作“并应允我”。
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: 为使
  rationale: 表达目的或结果关系，既保留原文功能，也符合现代汉语表达。
- source_word: יֵחָלְצוּן
  choice: 得以解救
  rationale: חלץ 的尼法勒未完成式在此表示被救出、获救；“得以解救”自然地保留被动意义和祈愿语气。
- source_word: יְדִידֶיךָ
  choice: 你所爱的人
  rationale: 保留复数所指和亲爱之意；现代汉语中比直译为“你的爱人”更清楚，不易产生配偶之义。
- source_word: הוֹשִׁיעָה
  choice: 施救
  rationale: ישׁע 的使役式命令式是直接求神采取拯救行动；“施救”在不擅自补出宾语的情况下保持祈求力度。
- source_word: יְמִינְךָ
  choice: 用右手
  rationale: 按语境理解为施行拯救的凭借，保留原文“右手”的拟人性意象。
- source_word: וַעֲנֵנוּ
  choice: 并应允我们
  rationale: 所给 WLC 文本的词尾为第一人称复数宾语，“应允我们”符合祷告语境，也保留群体性的呼求。
theological_decisions:
- issue: 神的右手意象
  choice: 保留“用右手”
  alternative: 按意义释作“以你的大能”
  rationale: “右手”是原文重要的诗歌和神学意象，象征神施行拯救的能力，不宜在正文中抽象化。
- issue: 末尾动词的宾语人称
  choice: 正文采用“应允我们”
  alternative: “应允我”
  rationale: 所给 WLC 文本 וַעֲנֵנוּ 指向第一人称复数；“我”的读法可由相关异文或平行经文支持，故置于脚注而不取代正文。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“你所爱的人”避免“爱人”在现代汉语中常指配偶的歧义；“施救”使句子简洁，并避免给 הוֹשִׁיעָה 擅自补加原文未明说的宾语。
