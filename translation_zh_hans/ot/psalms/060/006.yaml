id: PSA.60.6
reference: Psalms 60:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶ֫עְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/006.yaml
  text: 'God has spoken in his holiness: “I will exult[a]; I will divide up Shechem[b], and measure out the Valley of Succoth.”'
translation:
  language: zh_hans
  text: '神在他的圣洁中宣告[a]：

    “我要欢欣[b]；

    我要划分示剑，

    丈量疏割谷。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他的圣所中宣告”，或“凭他的圣洁宣告”。希伯来语短语既可指神本身的圣洁，也可指他神圣临在的领域。
    reason: lexical_alternative
  - marker: b
    text: 有些人认为，“我要欢欣”是诗人听见神宣告后的回应，并不属于神接下来的话。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神
  rationale: 虽然词形为复数，但与单数动词“宣告”连用，明确指以色列的独一之神。
- source_word: דִּבֶּר
  choice: 宣告
  rationale: 完成式动词表示神已经发言；“宣告”既保留神谕的郑重语气，也符合本节引出直接引语的功能。
- source_word: בְּקָדְשׁוֹ
  choice: 在他的圣洁中
  rationale: 保留希伯来语的紧凑表达及其歧义，既可关乎神本身的圣洁，也可指其神圣临在的领域，不擅自限定为圣所。
- source_word: אֶעְלֹזָה
  choice: 我要欢欣
  rationale: 该词表达高昂、得胜的喜悦；“欢欣”自然庄重，并保留第一人称意愿式的语气。
- source_word: אֲחַלְּקָה
  choice: 我要划分
  rationale: 在领土语境中指划分或分配土地；“划分”兼顾土地分界的具体意象与主权含义。
- source_word: שְׁכֶם
  choice: 示剑
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
- source_word: וְעֵמֶק סֻכּוֹת
  choice: 疏割谷
  rationale: 按地名构词关系译出“疏割的谷地”，采用中文传统地名“疏割”，并以“疏割谷”保持诗行简洁。
- source_word: אֲמַדֵּד
  choice: 丈量
  rationale: Piel词形在此描绘丈量土地、划定疆域；“丈量”保留具体动作，也让领土分配的含义由上下文呈现。
theological_decisions:
- issue: 说话者转换及引语范围
  choice: 把“我要欢欣；我要划分……丈量……”作为神在引介语之后所说的直接引语。
  alternative: 把“我要欢欣”理解为诗人听见神宣告后的回应，而从“我要划分示剑”起才是神的话。
  rationale: 连续的第一人称动词最自然地构成同一段神谕，而划分示剑、丈量疏割谷的领土语言也符合神对土地宣示主权的语境；但希伯来文本没有引号，故以脚注保留说话者可能转换的理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；以分行呈现平行结构。“示剑”“疏割”沿用中文圣经地名传统。正文保留“在他的圣洁中”的源语歧义，并用脚注说明其他可能译法。
