  text: הִרְאִ֣יתָה עַמְּ/ךָ֣ קָשָׁ֑ה הִ֝שְׁקִיתָ֗/נוּ יַ֣יִן תַּרְעֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/003.yaml
  text: You have shown your people hard things[a]; you have made us drink wine of staggering.
translation:
  language: zh_hans
  text: 你使你的子民经历艰难；你使我们喝下令人踉跄的酒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִרְאִיתָה
  choice: 使……经历
  rationale: 该词是ראה的使役式，字面可译“使看见、显给看”；与宾语“艰难”搭配时，现代汉语用“使……经历”更自然，也准确表达上帝使百姓亲历困苦。
- source_word: עַמְּךָ
  choice: 你的子民
  rationale: עַם在这里指属于上帝的群体；“你的子民”既保留归属关系，也符合诗篇庄重而自然的汉语表达。
- source_word: קָשָׁה
  choice: 艰难
  rationale: 该阴性形容词在此作名词性用法，指严酷、艰苦的遭遇。“艰难”保留原文简练概括的表达，不具体限定灾祸的形式。
- source_word: הִשְׁקִיתָנוּ
  choice: 使我们喝下
  rationale: שׁקה的使役式表示“使喝、给……喝”；“使我们喝下”清楚保留施加于人的使役意味。
- source_word: יַיִן
  choice: 酒
  rationale: 通常义为“酒”，这里构成比喻意象；直译为“酒”可保留诗歌图景，而不把它直接释义成苦难或审判。
- source_word: תַּרְעֵלָה
  choice: 令人踉跄的
  rationale: 该名词表示因醉酒而摇晃、踉跄或神志错乱的状态。“令人踉跄的酒”以自然汉语表达结果，同时保留原文的酒与失稳意象。
theological_decisions:
- issue: “酒”的比喻含义
  choice: 保留“令人踉跄的酒”这一比喻，不在正文中直接改写为苦难或审判
  alternative: 释义为“使人困惑的苦难”或理解为实际饮酒
  rationale: 本节上下两句的平行关系表明，这酒描绘上帝使百姓遭受严酷而失序的经历；但原文并未明说“审判”，因此译文保留意象和神学张力，不把隐喻过度解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“经历艰难”避免生硬的“看见艰难之事”；“令人踉跄的酒”保留诗意及因酒失稳的形象。原文此处没有必须以脚注呈现的文本异读或不可兼容歧义，因此正文不设脚注。
