  text: You have given a banner to those who fear you[a], to be raised up because of the truth[b]. Selah
translation:
  language: zh_hans
  text: 你赐给敬畏你的人一面旌旗，使它因真理而高高扬起。[a][b]细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高高扬起”所译的希伯来语动词含义较难确定，也可理解为“展示出来”“聚集起来”，或可能是“逃走”。
    reason: lexical_alternative
  - marker: b
    text: “真理”所译的希伯来语 קֹשֶׁט（qoshet）最可能指“真理”或“信实”；一些古代译本和解释传统对本行有不同理解，因而可译作“因弓”。
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: 你把……赐给
  rationale: 这是 נתן 的 Qal 完成式第二人称阳性单数，受词对象是上帝；“赐给”自然表达上帝给予的行动，并保留完成性。
- source_word: לִירֵאֶיךָ
  choice: 敬畏你的人
  rationale: 该短语由介词 ל 与 ירא 的分词形式构成；“敬畏你的人”既符合现代汉语，也保留对上帝崇敬、顺服的含义，不缩减为单纯害怕。
- source_word: נֵס
  choice: 旌旗
  rationale: נֵס 指竖起供人观看、聚集的旗帜或标志；“旌旗”庄重而易懂，并适合本节公开高举的意象。
- source_word: לְהִתְנוֹסֵס
  choice: 使它……高高扬起
  rationale: 该不定式的词源与语态含义有争议；在 נֵס“旌旗”的语境中，理解为旗帜被举起、展示最连贯。主句补出“它”以使现代汉语清楚，其他可能译法收入脚注。
- source_word: מִפְּנֵי
  choice: 为
  rationale: מִפְּנֵי 本义与“从……面前／由于”有关；此处采用简洁的原因或缘由表达“为”，避免过度限定它究竟是目的、缘故还是面对某物。
- source_word: קֹשֶׁט
  choice: 真理
  rationale: קֹשֶׁט 是诗歌用词，最可能表示“真理、真实、信实”；正文用“真理”保留宽广含义，古译本及部分解释所支持的“弓”另见脚注。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切礼仪或音乐功能不明，依中文圣经惯例音译，保存原文标记而不臆断其意义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“旌旗”保留军事及召聚的公开意象；“高高扬起”使希伯来语中 נֵס 与疑难动词之间的词语呼应在中文中可感。脚注标记均置于相关正文之后；“细拉”以括号标明其礼仪／音乐标记性质。
