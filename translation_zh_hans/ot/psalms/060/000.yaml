    reason: lexical_alternative
  - marker: b
    text: “米克坦”是一个含义不明的希伯来诗歌体裁名称；也有人认为这是音乐或文学方面的术语。
    reason: lexical_alternative
  - marker: c
    text: “大卫的”也可理解为“大卫所作”或“献给大卫”；原文结构可以表示作者、关联或奉献对象。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐指挥
  rationale: 该词在诗篇题注中通常指负责礼仪音乐的领唱者或主管；“圣乐指挥”在现代汉语中简洁自然，也保留其礼仪职能。
- source_word: עַל
  choice: 按
  rationale: 在诗篇题注中，这个介词常引出曲调或音乐编排；“按”既自然，又不把不确定的技术含义解释得过死。
- source_word: שׁוּשַׁן עֵדוּת
  choice: 《见证的百合花》
  rationale: 这很可能是曲调名或礼仪标题；采用较直译的名称，并用书名号标明其标题性质。
- source_word: מִכְתָּם
  choice: 米克坦诗
  rationale: 该希伯来体裁术语含义不明；音译“米克坦”可避免采用“金诗”“铭刻”等推测性释义，加上“诗”便于普通读者理解其文类。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 希伯来介词结构可表示作者、归属、关联或奉献对象；“大卫的”比明确译成“大卫所作”更能保留这种歧义。
- source_word: לְלַמֵּד
  choice: 供教导之用
  rationale: 该目的性不定式表示作品的教导用途；此译法在现代汉语中清楚而庄重。
