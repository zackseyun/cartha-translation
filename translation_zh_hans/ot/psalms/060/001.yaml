id: PSA.60.1
reference: Psalms 60:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱ֭לֹהִים זְנַחְתָּ֣/נוּ פְרַצְתָּ֑/נוּ אָ֝נַ֗פְתָּ תְּשׁ֣וֹבֵ֥ב לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/001.yaml
  text: God[a], you have rejected us; you have broken us through; you have been angry[b]. Restore us.
translation:
  language: zh_hans
  text: 神啊，你弃绝了我们，使我们破败[a]；你曾向我们发怒。求你使我们复原[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你冲破了我们”或“你在我们中间打开了缺口”。希伯来语带有冲破防线、造成破口的意象。
    reason: alternative_rendering
  - marker: b
    text: 或译：“求你转回我们这里。”希伯来语既可指使百姓复原，也可指神转回他们。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 此处是直接呼告以色列的神。“神啊”自然明确地表达呼格，也保持诗歌庄重的语气。
- source_word: זְנַחְתָּנוּ
  choice: 你弃绝了我们
  rationale: זנח表示拒绝、抛弃。“弃绝”在现代中文中清楚而庄重，也保留圣约关系遭到拒斥的沉重意味。
- source_word: פְרַצְתָּנוּ
  choice: 使我们破败
  rationale: פרץ的核心意象是冲破、打开缺口。直译成“冲破我们”在中文里生硬且容易误解；“使我们破败”表达神使群体防线崩裂、整体受损的结果，并以脚注保留突破、缺口的具体意象。
- source_word: אָנַפְתָּ
  choice: 你曾向我们发怒
  rationale: 该动词表达发怒。补出语境隐含的对象“向我们”，使中文自然；“曾”对应前面一连串已经发生的审判行动。
- source_word: תְּשׁוֹבֵב לָנוּ
  choice: 求你使我们复原
  rationale: 该短语可理解为使百姓恢复，也可能表达神转回他们。“使我们复原”与前面的破败形成清楚对照，同时脚注保留关系层面的另一种理解。
theological_decisions:
- issue: 结尾祈求 תְּשׁוֹבֵב לָנוּ 的指向
  choice: 祈求神使受审判的百姓复原
  alternative: 祈求神转回他们、重新临到他们
  rationale: 希伯来文容许恢复百姓和神转回百姓两种相近而不同的理解。正文采用与“破败”相呼应的“使我们复原”，但不把关系性的另一层意义排除，故在脚注中说明。
- issue: פְרַצְתָּנוּ 的破口意象
  choice: 正文表达群体被神弄得破败
  alternative: 你冲破了我们／你在我们中间打开了缺口
  rationale: 经文把灾败直接归于神的审判行动。译文保留这一神学张力，不弱化为无人称的遭灾；具体的突破意象则由脚注补明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“弃绝”“破败”“复原”彼此呼应，呈现从拒斥、崩坏到求告恢复的推进；避免生硬照搬希伯来语句法，并用脚注保存原文的意象与歧义。
