source:
  edition: WLC
  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/011.yaml
  text: Give us help against the adversary[c][b][a], for the salvation of man is vain.
translation:
  language: zh_hans
  text: 求你帮助我们抵挡敌人[a]；人的[c]拯救[b]实属徒然。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“帮助我们脱离困境”。希伯来语צַר既可指“困境”，也可指“敌人”。
    reason: lexical_alternative
  - marker: b
    text: “拯救”或译“解救”或“胜利”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语作“人”（אָדָם），这里泛指全人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: 求你
  rationale: 这是祈求中使用的命令式；现代汉语以“求你”自然表达向上帝恳求赐予的语气。
- source_word: לָּנוּ
  choice: 我们
  rationale: 准确表达第一人称复数的受益对象。
- source_word: עֶזְרַת
  choice: 帮助
  rationale: 对应“帮助、援助”，在祷告语境中自然、庄重。
- source_word: מִצָּר
  choice: 抵挡敌人
  rationale: צַר既可指“困境”，也可指“敌人”。本诗的军事冲突语境较支持人格化的“敌人”；介词מִן与“帮助”搭配时，在汉语中意译为“帮助我们抵挡”更自然。
- source_word: וְשָׁוְא
  choice: 实属徒然
  rationale: שָׁוְא表示虚空、无效或徒劳；“实属徒然”保留诗句简洁有力的判断语气。连接词在分号所呈现的并列兼对照关系中得到体现，不强行限定为因果关系。
- source_word: תְּשׁוּעַת
  choice: 拯救
  rationale: 该词可指拯救、解救或战场上的胜利；“拯救”保留较宽的语义范围，其他可行译法列入脚注。
- source_word: אָדָם
  choice: 人
  rationale: 这里泛指人类，与来自上帝的帮助形成对照；现代汉语“人”既简洁又自然地具有泛指意义。
theological_decisions:
- issue: 人的援救与上帝的帮助之间的对照
  choice: 将本句译为“人的拯救实属徒然”，在本诗祈求上帝援助的处境中指出人的解救不足为恃。
  alternative: 将其理解为对一切人类努力毫无限定的普遍否定。
  rationale: 希伯来文直接对照向上帝求助与人的拯救之徒然；译文保留这一张力，但不把它扩展为本节未明说的系统性论断。
translation_notes:
  register: 采用现代、庄重而易懂的祷告与诗歌语体。“求你”体现恳求，“实属徒然”保留原文凝练的诗性判断。分号呈现两小句之间的紧密对照，并避免把连接词的逻辑关系过度限定为单一的因果关系。
