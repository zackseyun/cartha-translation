source:
  edition: WLC
  text: הֲ/לֹֽא אַתָּ֣ה אֱלֹהִ֣ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/010.yaml
  text: Have you not[a], O God, rejected us, and do you not go out, O God[c][b], with our armies?
translation:
  language: zh_hans
  text: 神啊，难道不是你弃绝了我们，又不与我们的军队一同出战吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出战”原文直译为“出去”，这里是军事用语，指同军队一起出去作战。
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא
  choice: 不正是……吗
  rationale: 引出预期肯定回答的反问；这一句式自然地保留希伯来文的反问力量，并统摄两个并列谓语。
- source_word: אַתָּה
  choice: 你
  rationale: 独立人称代词带有强调；中文借助“不正是你”明确表达这一强调。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 首处按直接呼语译出。希伯来文第二分句再次出现“神”，但现代中文在同一句反问中重复“神啊”较显生硬，故不机械重复，所指仍然清楚。
- source_word: זְנַחְתָּנוּ
  choice: 抛弃了我们
  rationale: זנח 表示拒绝、丢弃或离弃；“抛弃”保留哀歌中强烈而直接的措辞，不将其弱化为主观感受。
- source_word: וְלֹא
  choice: 不再
  rationale: 与前一分句并列，并处于 הֲלֹא 所引领的整体反问中；“不再”自然表达神没有随军出战这一现实，也与先前的抛弃相衔接。
- source_word: תֵצֵא
  choice: 出战
  rationale: 字面为“出去”，在与军队同行的军事语境中指随军出征；“出战”以自然现代汉语传达该语境含义。
- source_word: בְּצִבְאוֹתֵינוּ
  choice: 同我们的军队
  rationale: ב 在此表达伴随，צְבָאוֹת 指军事力量；“同我们的军队”准确表达伴随军队出征。
theological_decisions:
- issue: 哀歌中神抛弃百姓并不与军队同出的表述
  choice: 直接译作“你抛弃了我们，不再同我们的军队出战”
  alternative: 译作“你似乎抛弃了我们”或“你任由我们被抛弃”
  rationale: 希伯来文直接把抛弃和不随军出战归于神。译文保留哀歌的神学张力，不以“似乎”或使役式表达加以缓和。
- issue: הֲלֹא 对两个并列分句的统摄范围
  choice: 将全句译为一个反问：“不正是……吗”
  alternative: 把第二分句译成陈述句或祈使句
  rationale: 原文最自然地读作由 הֲלֹא 引领的单一反问，其中“抛弃了我们”和“不随军出战”共同构成询问内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不正是你……吗”保留反问和“你”的强调；“抛弃”保留哀歌的强烈语气；“出战”使军事语境清楚。脚注标记已置于正文。
