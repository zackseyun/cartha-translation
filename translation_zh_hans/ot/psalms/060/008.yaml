base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/008.yaml
  text: Moab is my washbasin[a]; on Edom I cast my sandal; over Philistia[b], shout in triumph for me.
translation:
  language: zh_hans
  text: 摩押是我的洗涤盆[a]；我把鞋扔到以东之上；非利士啊，你要为我高声欢呼！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洗涤盆”也可按传统译作“洗盆”或“洗涤用的罐”。这个意象表示摩押处于卑下、受支配的地位。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来文较难理解。按马所拉文本，动词是对阴性单数的命令式，非利士作为国家或土地可受此称呼；也可理解为“非利士啊，要因我欢呼”。另一种较传统的理解将动词视为第一人称：“我要在非利士之上欢呼得胜。”
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: 我的洗脚盆
  rationale: סִיר指盆或锅一类容器，רַחְצִי表明其用于洗涤。在本节征服、降服的意象中，“洗脚盆”既是自然的现代汉语，也能传达卑下服役的意味；“洗涤盆”虽较宽泛，却削弱了这一具体意象。
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: 我要把鞋扔
  rationale: שלך的使役形表示投、扔；נַעַל是脚上穿的鞋。现代汉语用“鞋”比“凉鞋”更自然，也不必过度限定其样式；“扔”准确保留动作感。
- source_word: עַל אֱדוֹם
  choice: 在以东上
  rationale: 保留עַל的空间关系，使鞋被扔在以东之上的支配意象可见。汉语略显突兀，正反映希伯来诗句本身浓缩的表达。
- source_word: עָלַי פְּלֶשֶׁת
  choice: 非利士啊……为我
  rationale: עָלַי的第一人称后缀与下一分句关系困难。译作“为我”能与指向阴性国家“非利士”的命令式连贯，同时不把它改成第一人称陈述。
- source_word: הִתְרֹעָעִי
  choice: 要为我欢呼胜利
  rationale: 该词是阴性单数命令式，源于רוע，表示高声呼喊，常带战斗或胜利色彩。此处对非利士的命令很可能具有讽刺性的降服意味；“欢呼胜利”保留呼喊及得胜语境。
- source_word: מוֹאָב / אֱדוֹם / פְּלֶשֶׁת
  choice: 摩押／以东／非利士
  rationale: 采用现代中文圣经读者熟悉的地名译法；פְּלֶשֶׁת在这里指土地或国家，故译“非利士”，不译作族群名称“非利士人”。
theological_decisions:
- issue: 对非利士所用命令式 הִתְרֹעָעִי 的语气和说话者
  choice: 按马所拉文本保留对非利士的第二人称阴性单数命令：“非利士啊，要为我欢呼胜利！”
  alternative: “我要向非利士欢呼胜利”或“我要在非利士之上高声欢呼”
  rationale: 马所拉元音所指向的是第二人称阴性单数命令式，国家可按阴性受称呼。在列国被征服的上下文中，这可能是讽刺性的命令，但正文不明确补入“讽刺地”等解释；脚注保留传统第一人称理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留三行征服宣告的紧凑诗体。“洗脚盆”使屈辱意象具体可感；末句保留希伯来文本的命令式及其讽刺或降服张力，并以脚注呈现语法上的其他理解。
