  yaml_path: translation/ot/psalms/060/009.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a]
translation:
  language: zh_hans
  text: 谁能带我到坚固城？谁能领我到以东？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁能领我到坚固城？谁曾领我到以东？”希伯来语动词的时体可有不同理解；正文按两个面向未来的平行问句翻译。
    reason: 词义及动词时体的另一种可能
lexical_decisions:
- source_word: מִי
  choice: 谁能
  rationale: 疑问代词引出修辞性问句；结合上下文所问的能力与带领者，译为“谁能”符合现代汉语表达。
- source_word: יֹבִלֵנִי
  choice: 带我进入
  rationale: יבל的使役式表示使人前往、带领；目的地是城，汉语以“带我进入”自然地表达抵达并进入该城。
- source_word: עִיר מָצוֹר
  choice: 坚固城
  rationale: 该组合指设有防御工事的坚城；“坚固城”简洁庄重，也避免误解为正在被围困的城。
- source_word: נָחַנִי
  choice: 能领我
  rationale: נחה意为引领、引导。其形式可有完成体理解，但诗歌平行结构容许把它理解为面向未来的问句；正文采用“能领我”维持两问的平行。
- source_word: עַד אֱדוֹם
  choice: 直到以东
  rationale: עַד表示所到的界限或终点；“直到以东”保留这一范围意味。
- source_word: אֱדוֹם
  choice: 以东
  rationale: 采用现代中文圣经语境中通行的专名译法。
theological_decisions:
- issue: 第二个动词נָחַנִי的时体
  choice: 正文按与前句平行、面向未来的修辞问句处理：“谁能领我……？”
  alternative: 也可按完成体译作“谁曾领我到以东？”
  rationale: 希伯来诗歌中的平行关系支持未来指向，但动词形态也容许完成体理解；以脚注保存这一真实歧义，不据神学预设加以消解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“坚固城”保留诗歌凝练感；两个“谁能”形成清楚的平行结构。
