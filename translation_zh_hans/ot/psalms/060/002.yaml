source:
  edition: WLC
  text: הִרְעַ֣שְׁתָּה אֶ֣רֶץ פְּצַמְתָּ֑/הּ רְפָ֖/ה שְׁבָרֶ֣י/הָ כִי מָֽטָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/002.yaml
  text: You have shaken the earth; you have split it open. Heal its fractures[a], for it is tottering.
translation:
  language: zh_hans
  text: 你使大地震动，使它裂开；求你医治它的裂缝[a]，因为它摇摇欲坠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“这片土地”。希伯来语אֶרֶץ既可指整个大地，也可指某一片土地；这里的诗歌语境容许两种意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְעַשְׁתָּה
  choice: 你使……震动
  rationale: 该词是רעש的使役式，表示使大地震动；此译保留使役含义，并符合现代汉语表达。
- source_word: אֶרֶץ
  choice: 大地
  rationale: אֶרֶץ既可指普遍意义的“大地”，也可指特定的“土地、国土”。正文采用“大地”以配合震裂的诗歌意象，同时用脚注保留另一可能。
- source_word: פְּצַמְתָּהּ
  choice: 使它裂开
  rationale: 该动词表达打破、劈裂之意；“裂开”与下句“裂缝”形成连贯而鲜明的地震图景。
- source_word: רְפָה
  choice: 医治
  rationale: 这是רפא的祈使式，通常意为“医治”。即使宾语是大地的裂缝，原诗的拟人化意象仍宜保留。
- source_word: שְׁבָרֶיהָ
  choice: 它的裂缝
  rationale: שֶׁבֶר可指破裂、裂口或缺口；“裂缝”最贴合本节大地震裂的意象。
- source_word: כִי
  choice: 因为
  rationale: 该词引出恳求医治的原因；“因为”在现代汉语中清楚自然。
- source_word: מָטָה
  choice: 摇摇欲坠
  rationale: 该动词可表示倾斜、摇晃或行将倒下；“摇摇欲坠”保留持续不稳、尚未完全倒塌的状态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；保留“大地”被震裂并需要“医治”的拟人化表达，也保留末句持续动荡、濒临倾覆的张力。
