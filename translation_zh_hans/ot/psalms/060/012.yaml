  yaml_path: translation/ot/psalms/060/012.yaml
  text: With God we will do valiantly[b][a], and he will trample our adversaries.
translation:
  language: zh_hans
  text: 我们靠着上帝必奋勇行事；他必践踏我们的敌人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: 靠着上帝
  rationale: 介词 בְּ 在这里可表达凭借、依靠，也可能包含与上帝同在而行动的意味。“靠着上帝”是自然的现代汉语，清楚表达得胜有赖于上帝，同时不排除同行之意。
- source_word: נַעֲשֶׂה חָיִל
  choice: 必大有作为
  rationale: עָשָׂה חַיִל 是表示奋勇行事、成就大事的习语。“大有作为”保留行动主体为“我们”，又自然传达勇力与成就，不把 חַיִל 生硬拆译为单一名词。
- source_word: וְהוּא
  choice: 他
  rationale: 独立代词 הוּא 突出上帝本人是施行决定性行动者。汉语用分号衔接并明说“他”，既保持并列关系，也保留强调。
- source_word: יָבוּס
  choice: 必践踏
  rationale: בּוּס 指踩踏、践踏。“践踏”保留鲜明的军事诗歌意象，避免用“击败”或“消灭”提前解释结果。
- source_word: צָרֵינוּ
  choice: 我们的敌人
  rationale: צַר 指敌对者、仇敌。诗篇的军事语境中，“敌人”比“对手”更准确自然，也不额外引入“压迫者”的特定关系。
theological_decisions:
- issue: 得胜中的人与上帝之行动
  choice: 保留“我们”靠着上帝有所作为，同时明确“他”亲自践踏敌人。
  alternative: 只突出人的英勇，或只突出上帝行动而淡化人的参与。
  rationale: 希伯来文把两方面并置：群体依靠上帝行动，而上帝本人施行决定性的制伏。译文不将二者合并或互相取代。
- issue: 介词 בְּ 所表达的关系
  choice: 正文译为“靠着上帝”，侧重依靠或凭借。
  alternative: “与上帝一同”或“在上帝里面”。
  rationale: 此处介词可表达手段或紧密关联。“靠着”在现代汉语中最自然地表达能力与胜利来自上帝，又没有把原文限定为抽象的空间或神秘联合概念。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语，保持诗歌的平行推进和军事意象。“必……；他必……”体现信心与强调，也避免冗长解释。
