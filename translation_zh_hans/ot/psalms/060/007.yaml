  yaml_path: translation/ot/psalms/060/007.yaml
  text: Gilead is mine[a], and Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my scepter.
translation:
  language: zh_hans
  text: 基列是我的，玛拿西也是我的；以法莲是我头的保障；犹大是我的权杖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的立法者”或“我的统治之杖”。希伯来语这个词既可指颁布命令的人，也可指象征统治权的杖或权杖。
    reason: alternative_reading
lexical_decisions:
- source_word: לִי
  choice: 是我的
  rationale: 介词加第一人称单数词尾表达归属；中文补出“是”，自然直接。
- source_word: גִלְעָד
  choice: 基列
  rationale: 采用现代中文圣经语境中通行的地名译法。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经语境中通行的支派及地域名称。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 采用现代中文圣经语境中通行的支派名称。
- source_word: מָעוֹז
  choice: 堡垒
  rationale: 该词指力量、防御之所；“堡垒”保留本节军事和政治性的意象。
- source_word: רֹאשִׁי
  choice: 我头上的
  rationale: 保留“我的头”这一身体意象，同时以自然中文表达堡垒对头部的保护关系，不把比喻解释掉。
- source_word: מְחֹקְקִי
  choice: 我的权杖
  rationale: 该词可指颁令者，也可指象征统治的杖；在本节王权和军事意象中，“权杖”简洁地表达犹大所象征的统治权。
theological_decisions:
- issue: 王权意象中 מְחֹקְקִי 的译法
  choice: 我的权杖
  alternative: 我的立法者／我的统治之杖
  rationale: 上下文为各支派赋予军事或王权角色。“权杖”保留政治与王权象征，又不把词义限缩为现代意义上的立法者；词语本身也可能指颁令者，因此在脚注保留该歧义。
translation_notes:
  register: 采用现代、庄重而清楚的诗歌语言。平行句保留重复的归属表达；“我头上的堡垒”既贴近希伯来语组合，也比“我头的堡垒”更符合现代汉语。
