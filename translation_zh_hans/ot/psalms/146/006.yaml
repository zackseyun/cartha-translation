  text: who made heaven and earth[a], the sea and all that is in them, who keeps faith forever,
translation:
  language: zh_hans
  text: 他创造天、地、海和其中的一切；他永远守信[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他永远持守真理。”希伯来语אֱמֶת可表示“真理、真实”，也可表示“信实、可靠”；在此与“持守”和“永远”连用，译作“守信”较贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: 创造了
  rationale: 该词是阳性单数主动分词，承接上一节对耶和华的描述，即“那创造……的”。汉语用“创造了”自然指向已经完成的创造行动，同时不妨碍整句继续描述他的恒常身份。
- source_word: שָׁמַיִם וָאָרֶץ
  choice: 天、地
  rationale: 这是概括受造秩序的常见并列表达；“天、地”简洁自然，并与后面的“海”构成完整的创造范围。
- source_word: אֶת הַיָּם
  choice: 海
  rationale: 原文为带定冠词的单数名词；现代汉语在此通常不需另译定冠词，用“海”即可准确表达。
- source_word: וְאֶת כָּל אֲשֶׁר בָּם
  choice: 和其中的一切
  rationale: בָּם为复数，回指天、地、海；“其中的一切”保留了原文涵盖所有受造内容的范围。
- source_word: הַשֹּׁמֵר
  choice: 信实
  rationale: 该主动分词本义为“守住、持守”；与אֱמֶת搭配时，整体表达始终守信、可靠。汉语以谓语“信实”自然传达这一组合意义，避免生硬的“持守信实”。
- source_word: אֱמֶת
  choice: 信实
  rationale: 该词可指“真实、真理”，也可指“可靠、忠信”。在שׁמר和“永远”的搭配中，重点更可能是上帝恒久可靠、守信的品格。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 表示没有终止的持续性；“永远”是现代汉语中自然、庄重且准确的对应表达。
theological_decisions:
- issue: אֱמֶת描述上帝品格时的含义
  choice: 信实
  alternative: 真理／真实
  rationale: 本句把创造主与他恒久可靠的品格并列称颂；“信实”较自然地呈现关系性的忠信与可靠，但原词也确可表示“真理”或“真实”，故以脚注保留这一语义可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。分号呈现原文两组分词描述之间的推进：他既是创造万有者，也是永远信实者。
