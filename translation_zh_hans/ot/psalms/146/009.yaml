  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֤ה שֹׁ֘מֵ֤ר אֶת גֵּרִ֗ים יָת֣וֹם וְ/אַלְמָנָ֣ה יְעוֹדֵ֑ד וְ/דֶ֖רֶךְ רְשָׁעִ֣ים יְעַוֵּֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/009.yaml
  text: Yahweh watches over the sojourners[a]; he upholds the fatherless and the widow[b], but he twists the way of the wicked.
translation:
  language: zh_hans
  text: 耶和华看顾寄居者[a]，扶持孤儿和寡妇；却使恶人的道路弯曲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外乡人”“外族居民”；希伯来语指住在当地的非本地居民。
    reason: lexical_alternative
  - marker: b
    text: 或译“扭曲恶人的道路”，也可理解为“使恶人的道路败亡”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，将专名与“主”这一称号区分开来。
- source_word: שֹׁמֵר
  choice: 看顾
  rationale: 此处分词表达持续的保护与照料；“看顾”在现代中文中自然、庄重，也保留主动守护之意。
- source_word: גֵּרִים
  choice: 寄居者
  rationale: 指居住在本族群之外、处于客居身份的非本地居民；“寄居者”既保留其社会处境，也避免把含义局限为短暂停留的旅客。
- source_word: יָתוֹם וְאַלְמָנָה
  choice: 孤儿和寡妇
  rationale: 这是希伯来圣经中常见的弱势群体组合；中文以类别性单数表达自然，无须机械复现希伯来语单数形式。
- source_word: יְעוֹדֵד
  choice: 扶持
  rationale: 该词在此表示支持、使站立稳固；“扶持”贴合上帝照料弱者的语境。
- source_word: דֶרֶךְ רְשָׁעִים
  choice: 恶人的道路
  rationale: “道路”保留诗歌及智慧文学中表示人生方向、行为方式或进程的隐喻；“恶人”准确表达复数集合概念。
- source_word: יְעַוֵּת
  choice: 使……弯曲
  rationale: 保留עוה的使役性弯曲、扭曲意象，不直接将其解释为毁灭或挫败。
theological_decisions:
- issue: 末句如何描述上帝对恶人的审判
  choice: 却使恶人的道路弯曲
  alternative: 却使恶人的道路败亡
  rationale: 原文动词首先呈现使之弯曲、扭曲的图像；正文保留这一隐喻及其张力，不把结果明确化为“败亡”。
- issue: גֵּרִים所指群体的范围
  choice: 寄居者
  alternative: 外乡人；外族居民
  rationale: 该词通常指居住在当地却非本族、本地出身的人，且常具有社会弱势含义。“寄居者”保留身份与处境，但不额外限定其法律地位或族裔。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体中文。三个分句保持平行节奏，以分号突出上帝对弱势者的扶持与对恶人的反向处置。“使……弯曲”略带陌生感，但有意保存原文鲜明且未完全解释的道路隐喻。
