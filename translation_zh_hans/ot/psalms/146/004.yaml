  text: תֵּצֵ֣א ר֭וּח/וֹ יָשֻׁ֣ב לְ/אַדְמָת֑/וֹ בַּ/יּ֥וֹם הַ֝/ה֗וּא אָבְד֥וּ עֶשְׁתֹּנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/004.yaml
  text: His breath goes out[a]; he returns to his ground; on that very day his plans perish.
translation:
  language: zh_hans
  text: 他的气息一离去，他就归回大地；就在那一天，他的谋算都归于无有。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּצֵא
  choice: 离开
  rationale: 此处指维系生命的气息在死亡时离去。“离开”在现代汉语中自然，也保留希伯来语“出去”的具体意象而不过度解释。
- source_word: רוּחוֹ
  choice: 他的气息
  rationale: רוּחַ 可指“气息”“风”或“灵”。在归回土地的死亡语境中，“气息”最直接表达生命之气，同时不预设更具体的人论立场；“他的灵”作为可能译法保留在脚注中。
- source_word: יָשֻׁב
  choice: 他就归回
  rationale: שׁוב 的基本义是“返回、归回”。这里主语自然转回到那个人；加“就”也呈现气息离开与人归土之间紧密的关系。
- source_word: לְאַדְמָתוֹ
  choice: 自己的土地
  rationale: אֲדָמָה 指土地、土壤或大地，且原文带第三人称单数所属后缀。“自己的土地”保留这一形式及人归于土的呼应；不译作“尘土”，以免引入本节未使用的词。
- source_word: בַּיּוֹם הַהוּא
  choice: 就在那一天
  rationale: 既保留“那一天”的指示意义，也以“就在”自然表达事情当日发生的即时性。
- source_word: אָבְדוּ
  choice: 都归于无有
  rationale: אבד 在此表示消亡、落空。“归于无有”能自然表达人的谋算随着死亡而失效，并符合诗歌庄重语体。
- source_word: עֶשְׁתֹּנֹתָיו
  choice: 他的谋算
  rationale: 这是罕见名词，可指思想、意图或计划。“谋算”兼具思量与筹划之意，适合本篇警告人不可倚靠必死之人的语境，又不带“阴谋”的必然贬义。
theological_decisions:
- issue: 死亡语境中 רוּחוֹ 的人论含义
  choice: 正文译作“他的气息”
  alternative: 他的灵
  rationale: 本节强调人的必死性及其能力终止。“气息”贴近具体生命意象，也避免对中间状态作本节没有明说的教义判断；因 רוּחַ 确可表示“灵”，故在脚注中保留该译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“气息一离开”“归回自己的土地”“谋算都归于无有”保持原文的死亡意象和句间推进；正文中的[a]与脚注对应。
