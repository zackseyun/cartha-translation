  text: עֹשֶׂ֤ה מִשְׁפָּ֨ט לָ/עֲשׁוּקִ֗ים נֹתֵ֣ן לֶ֭חֶם לָ/רְעֵבִ֑ים יְ֝הוָ֗ה מַתִּ֥יר אֲסוּרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/007.yaml
  text: who executes justice for the oppressed[a], who gives bread to the hungry[b]. Yahweh frees the prisoners.
translation:
  language: zh_hans
  text: 他为受欺压的人主持公道[a]，把饼赐给饥饿的人。雅威使被捆绑的人得自由[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为受欺压的人施行正义（或审判）”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“雅威释放囚犯。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: 主持公道
  rationale: 该搭配表示持续施行正义、为受屈者伸张公道；“主持公道”比生硬的“施行审判”更符合现代汉语，也保留纠正不义的含义。
- source_word: לָעֲשׁוּקִים
  choice: 为受欺压的人
  rationale: 保留被动受压迫的社会处境，并与“主持公道”自然搭配。
- source_word: נֹתֵן לֶחֶם
  choice: 赐食物
  rationale: לֶחֶם字面为“饼、食物”，此处可指维生之食；“赐食物”在现代汉语中自然，并传达实际供应，而不把意象限定为某种形制的饼。
- source_word: לָרְעֵבִים
  choice: 给饥饿的人
  rationale: 准确表达实词化形容词所指的饥饿人群，措辞通俗直接。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现上帝的专名，不用称号替代原文的四字神名。
- source_word: מַתִּיר אֲסוּרִים
  choice: 使被捆绑的人得自由
  rationale: מַתִּיר有解开、释放之意，אֲסוּרִים可指被捆绑或被囚的人；此译保留原文较宽的身体性意象，避免只限定为监狱中的囚犯。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用以色列上帝的专名；音译“雅威”较直接地保留专名性质，而不以称号替代。
- issue: אֲסוּרִים所指范围
  choice: 被捆绑的人
  alternative: 囚犯
  rationale: 该词字面指被绑住的人，也可在语境中指囚犯；正文保留较宽泛的原文意象，脚注说明具体化的可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前两句以“他”承接上文连续的分词结构，末句明确说出“雅威”，依照希伯来文句法形成强调。
