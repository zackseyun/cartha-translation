source:
  edition: WLC
  text: אַל תִּבְטְח֥וּ בִ/נְדִיבִ֑ים בְּ/בֶן אָדָ֓ם שֶׁ֤/אֵֽין ל֥/וֹ תְשׁוּעָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/003.yaml
  text: Do not trust in princes[a], in a son of man[b], in whom there is no salvation.
translation:
  language: zh_hans
  text: 不要倚靠权贵，也不要倚靠世人[a]；他们并无拯救之能[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译“人的儿子”，这里泛指必死的世人，并非弥赛亚称号。
    reason: 说明希伯来习语，防止把泛称误读为专名或称号。
  - marker: b
    text: “拯救”也可译作“救助”或“解救”。
    reason: 保留תְשׁוּעָה在本节中可能具有的现实救援与较广义拯救两层语义。
lexical_decisions:
- source_word: אַל תִּבְטְחוּ
  choice: 不要倚靠
  rationale: 否定词אַל与未完成式连用，表达禁止；“不要倚靠”自然、直接地传达不可把信赖寄托于某对象。
- source_word: בִנְדִיבִים
  choice: 权贵
  rationale: נְדִיבִים在此指有地位、有权势的显贵或领袖；“权贵”兼顾社会政治地位，也适合现代汉语，且不把词义过度限定为王室的“王子”。
- source_word: בְּבֶן אָדָם
  choice: 世人
  rationale: 字面为“亚当之子／人的儿子”，在本节是泛指必死的人，并非弥赛亚称号。“世人”自然地表达普通、有限的人类个体，并与上句的权贵形成从特殊到一般的并列。
- source_word: שֶׁאֵין לוֹ תְשׁוּעָה
  choice: 他并不能施行拯救
  rationale: 希伯来语字面近于“在他那里没有拯救”。此处强调人不具备救助、拯救的能力；该译法在汉语中清楚自然，同时保留“拯救”较宽广的语义。
theological_decisions:
- issue: “人子”（בֶן־אָדָם）的含义
  choice: 按泛指必死的世人理解
  alternative: 直译为“人子”，可能使现代读者误以为是特定的弥赛亚称号
  rationale: 上下文将权贵和一般人同上帝对照，主题是不可倚靠有限、必死的人；这里没有证据表明该短语用作但以理书式或新约式的称号。
- issue: תְשׁוּעָה的范围
  choice: 正文译作“拯救”，并注明也可译“救助”
  alternative: 仅译作“帮助”或“救助”
  rationale: “拯救”保留该词较强和较广的分量，但不限定为某一系统神学意义；脚注提示其在语境中也可指实际的救助或解救。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倚靠”延续诗歌和敬拜语体，又不显古奥；“权贵”比“王子”更准确涵盖有权势的显贵。“也不要”补出并列关系，使汉语节奏清楚。所有脚注标记均已置于正文。
