  yaml_path: translation/ot/psalms/146/001.yaml
  text: Praise Yah! Praise Yahweh[a], my soul!
translation:
  language: zh_hans
  text: 你们要赞美雅[a]！我的心哪，要赞美耶和华！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”是耶和华之名的诗歌性短式。此句传统上常按音译作“哈利路亚”，意为“你们要赞美雅”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: 你们要赞美
  rationale: 这是הלל的阳性复数祈使式，是向群体发出的呼召；汉语加入“你们”以明确原文的复数受众。
- source_word: יָהּ
  choice: 耶和华
  rationale: 这是神名יהוה的诗歌性短式。现代中文没有广为通行且自然的独立短式对应词，因此译作“耶和华”，避免使用不透明的音译口号。
- source_word: הַלְלִי
  choice: 你要赞美
  rationale: 这是הלל的阴性单数祈使式，与阴性名词נפש一致，直接命令诗人自己的心；“你要赞美”保留自我劝勉的语气。
- source_word: נַפְשִׁי
  choice: 我的心哪
  rationale: נפש可指生命、自我或内在的人；在诗歌中的自我呼语，现代汉语以“我的心哪”最自然庄重，也不把这里过度限定为哲学意义上的灵魂。
- source_word: אֶת
  choice: 不单独翻译
  rationale: 这是直接宾语标记，在汉语中由语序表达，无须另译。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经语境中通行的专名“耶和华”表达四字神名，保留其作为专名而非称号的性质。
theological_decisions:
- issue: 同一节中יָהּ与יְהוָה的译法
  choice: 两者均译作“耶和华”
  alternative: 将יָהּ音译为“雅”，或把开头合译为“哈利路亚”；也可用“上主”代替神名
  rationale: 原文确实分别使用神名短式与完整四字神名，但中文缺乏自然、通行的短式神名。统一译为“耶和华”既保留专名，也保持普通读者可理解性；不把开头合并为“哈利路亚”，以显明“赞美”这一祈使动作。
- issue: נפשי所指的人的内在整体
  choice: 译为“我的心哪”
  alternative: 译为“我的灵魂哪”或“我自己啊”
  rationale: 此处是诗人向自身发出的劝勉，并不意在界定人的构成。“心”在现代汉语诗体中自然承载内在自我的含义，同时避免引入灵魂与身体二分的额外主张。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。首句明确复数受众，次句以“我的心哪”保留直接自我呼语；两个感叹句再现原文连续而有力的赞美呼召。
