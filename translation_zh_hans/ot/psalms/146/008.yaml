  text: יְהוָ֤ה פֹּ֘קֵ֤חַ עִוְרִ֗ים יְ֭הוָה זֹקֵ֣ף כְּפוּפִ֑ים יְ֝הוָ֗ה אֹהֵ֥ב צַדִּיקִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/008.yaml
  text: Yahweh opens the eyes of the blind[a]; Yahweh raises up those who are bowed down; Yahweh loves the righteous.
translation:
  language: zh_hans
  text: 雅威使盲人的眼睛睁开[a]；雅威使弯腰的人挺直；雅威爱义人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使盲人看见。”希伯来语字面说“开启盲人”，即开启他们的眼睛。
    reason: 词义替代译法
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现上帝的专名，保留原文三次重复所形成的诗行节奏与强调。
- source_word: פֹּקֵחַ עִוְרִים
  choice: 使盲人的眼睛睁开
  rationale: 希伯来语字面为“开启盲人”，实际所指是开启他们的眼睛。译文补出汉语中自然且隐含的宾语“眼睛”，同时保留“开启”的具体意象。
- source_word: זֹקֵף
  choice: 扶起
  rationale: 该词表示使人挺直、使之站起；“扶起”在现代汉语中简洁自然，并能表达恢复与扶助之意。
- source_word: כְּפוּפִים
  choice: 被压弯的人
  rationale: 保留原文身体弯曲的形象，也不把其意义限于身体残疾；“被压弯”可同时容纳受苦、受压和屈身的含义。
- source_word: אֹהֵב
  choice: 爱
  rationale: 直接对应分词谓语，表达雅威持续且具有特征性的作为。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 这是现代中文圣经语体中简明而通行的表达，既可指行为正直者，也保留其盟约与伦理层面的广度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近其通常学术复原读音的现代汉语音译，而不以称号替代。
- issue: כְּפוּפִים 所描述的处境
  choice: 被压弯的人
  alternative: 弯腰的人／受压迫的人
  rationale: 原文可包含身体弯曲以及因困苦受压而屈身的形象。译文保留这种张力，不把它仅解释为身体状态或社会压迫。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。三次保留“雅威”，对应希伯来诗句的平行结构与强调；三个分句均用直接动词，保持原文紧凑有力的节奏。
