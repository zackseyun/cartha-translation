  text: אַשְׁרֵ֗י שֶׁ֤/אֵ֣ל יַעֲקֹ֣ב בְּ/עֶזְר֑/וֹ שִׂ֝בְר֗/וֹ עַל יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/005.yaml
  text: Blessed is the one whose help is the God of Jacob[a], whose hope is in Yahweh his God.
translation:
  language: zh_hans
  text: 以雅各的上帝为帮助[a]、把盼望寄托在雅威——他的上帝——身上的人，是有福的！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅各的上帝是他的帮助。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 是有福的
  rationale: 这是诗篇常见的称福句式，表达一种值得羡慕的蒙福状态；“有福”比单纯表示情绪的“快乐”更贴合原文语气。
- source_word: שֶׁאֵל יַעֲקֹב בְּעֶזְרוֹ
  choice: 以雅各的上帝为帮助
  rationale: 马所拉文本按书写形式呈现“雅各的上帝在他的帮助中”这一压缩结构，整体意为雅各的上帝是此人的帮助；中文以“以……为帮助”自然地保留名词性表达和“雅各的上帝”这一历史称号。
- source_word: שִׂבְרוֹ עַל
  choice: 仰望
  rationale: שֵׂבֶר 表示盼望、期待，עַל 指向所倚赖的对象；“仰望”在现代中文中兼具盼望和倚靠之意，并可自然带出宾语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的神名音译“耶和华”，明确呈现四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 保留第三人称阳性单数后缀所表达的个人关系，并以现代标准汉语“上帝”译出 אֱלֹהִים。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是神名的中文音译；正文采用中文圣经传统中辨识度更高的“耶和华”，同时不以“主”替代原文的专名。
- issue: 称福对象的表达
  choice: ……的人
  alternative: 他
  rationale: 原文未出现 אִישׁ 等明确性别名词，只以单数关系词及阳性后缀指称对象；译作“……的人”既保留单数泛指，也避免增添原文没有的“男人”。
- issue: 上帝作为帮助的句法关系
  choice: 以雅各的上帝为帮助
  alternative: 雅各的上帝帮助他
  rationale: 原文使用名词 עֵזֶר“帮助”，不是直接陈述一个帮助动作；采用“以……为帮助”可保留上帝本身作为其帮助和倚靠的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句首并列两个描述成分，末尾落在诗篇称福宣告“是有福的”，既贴近希伯来语焦点，也保持中文节奏。
