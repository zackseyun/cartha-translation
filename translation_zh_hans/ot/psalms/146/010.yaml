  text: יִמְלֹ֤ךְ יְהוָ֨ה לְ/עוֹלָ֗ם אֱלֹהַ֣יִ/ךְ צִ֭יּוֹן לְ/דֹ֥ר וָ/דֹ֗ר הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/010.yaml
  text: Yahweh will reign forever—your God[a], Zion, from generation to generation. Hallelujah!
translation:
  language: zh_hans
  text: 雅威——锡安哪，你的上帝——要永远作王，直到万代。哈利路亚[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语意为“赞美雅！”“雅”是“雅威”的简称；这里音译为“哈利路亚”。
    reason: 说明音译表达的字面意义及其中的神名简称。
lexical_decisions:
- source_word: יִמְלֹךְ
  choice: 要作王／要掌权
  rationale: 这是מלך的Qal未完成式第三人称阳性单数，在颂赞宣告中可表达将来并持续不断的统治。译文先用“要作王”保留君王意象，后用“要掌权”使中文句式自然，并承接同一个希伯来语谓语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名按其通常重构的读音音译为“雅威”，以保留专名性质，而不以“主”这一称号代替。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 介词לְ与עוֹלָם在此表示无尽、恒久的时间；“永远”是准确而自然的现代汉语表达。
- source_word: אֱלֹהַיִךְ
  choice: 你的上帝
  rationale: 第二人称阴性单数后缀指向被人格化并受呼告的锡安；“你的上帝”保留这一直接关系。
- source_word: צִיּוֹן
  choice: 锡安哪
  rationale: 专名采用现代汉语通行音译；“哪”明确表现希伯来语中锡安在句内的呼语功能。
- source_word: לְדֹר וָדֹר
  choice: 直到万代
  rationale: 该重复式习语表示一代接一代、持续不绝。“直到万代”简洁自然，并与前面的“永远”形成诗歌式呼应。
- source_word: הַלְלוּ יָהּ
  choice: 哈利路亚
  rationale: 采用汉语基督教及诗歌语境中通行的音译，同时在脚注中说明其字面意义以及יָהּ与神名的关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用神的专名。译作“雅威”保留其专名性质，并避免用称号“主”取代；“耶和华”虽为汉语传统译名，但源自较晚形成的混合读法。
- issue: 结尾הַלְלוּ יָהּ的译法
  choice: 哈利路亚
  alternative: 要赞美雅
  rationale: “哈利路亚”保留原文的礼仪性呼喊，且为现代汉语读者熟悉；脚注补明字面意义，不掩盖其中所含神名简称“雅”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“要永远作王”保留原文的君王意象；破折号呈现后半句对“雅威”的同位说明和对锡安的呼告。为避免汉语残句，在后半句以“要掌权”承接原文单一谓语的语义，不另行引入新的神学含义。
