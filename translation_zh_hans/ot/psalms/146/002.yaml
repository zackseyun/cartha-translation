  text: אֲהַלְלָ֣ה יְהוָ֣ה בְּ/חַיָּ֑/י אֲזַמְּרָ֖ה לֵֽ/אלֹהַ֣/י בְּ/עוֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/002.yaml
  text: I will praise Yahweh all my life[a]; I will sing praises to my God as long as I live.
translation:
  language: zh_hans
  text: 我要一生赞美雅威[a]；只要我还活着，就要歌颂我的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在我的生命中”和“在我尚存之时”；正文按表示持续时间的习语译为“一生”和“只要我还活着”。
    reason: 词义与习语说明
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: 我要赞美
  rationale: 第一人称单数的祈愿式，表达诗人坚定的意愿和决心；译作“我要赞美”自然地保留这种意愿色彩。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，避免用头衔取代原文中的名字。
- source_word: בְּחַיָּי
  choice: 一生
  rationale: 字面为“在我的生命中”，在此表示贯穿说话者一生的持续时间；“一生”符合现代汉语习惯。
- source_word: אֲזַמְּרָה
  choice: 要歌颂
  rationale: זמר 在诗篇中常指以歌唱或音乐赞美；“歌颂”兼顾歌唱和赞美两层含义。
- source_word: לֵאלֹהַי
  choice: 我的上帝
  rationale: 介词 ל 在歌唱、赞美的语境中表示对象；汉语“歌颂我的上帝”已自然体现这一关系。
- source_word: בְּעוֹדִי
  choice: 只要我还活着
  rationale: 该短语表示说话者仍然存活、存在的持续时期；此译文清楚传达“在我尚存之时”的惯用含义，并与上半句形成平行。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”较贴近其通行学术拟音，也保留这是专名而非“主”等头衔。
- issue: 两个祈愿式动词的语气
  choice: 译为表达决心的“我要……／就要……”
  alternative: 译为劝勉或愿望式“愿我……”
  rationale: 上下文最自然地表达诗人自我立志；同时，希伯来语形式所含的意愿色彩由“要”保留，不把它处理成单纯的时间预告。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一生……只要我还活着……”保留原诗两行的平行关系；“赞美／歌颂”体现两个希伯来动词在意义上的呼应与细微变化。
