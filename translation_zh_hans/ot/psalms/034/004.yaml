  text: דָּרַ֣שְׁתִּי אֶת יְהוָ֣ה וְ/עָנָ֑/נִי וּ/מִ/כָּל מְ֝גוּרוֹתַ֗/י הִצִּילָֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/004.yaml
  text: I sought Yahweh[a], and he answered me; he delivered me from all my fears.
translation:
  language: zh_hans
  text: 我寻求雅威，他回应了我；他救我脱离一切恐惧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切恐惧”或译“我所惧怕的一切”，或“我一切的惊恐”。
    reason: 原词 מְגוּרוֹתַי 可指诗人所经历的恐惧或惊恐，也可指令他惧怕的事物；正文保留概括表达。
lexical_decisions:
- source_word: דָּרַשְׁתִּי
  choice: 我寻求
  rationale: דרשׁ在此指在祷告和倚靠中寻求雅威，不只是向他询问；“寻求”简洁自然，也符合诗人的见证语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号代替。
- source_word: וְעָנָנִי
  choice: 他就应允我
  rationale: ענה连第一人称单数宾语后缀，意为“回答我”；在祷告语境中，“应允我”自然表达神对诗人呼求的回应。
- source_word: מִכָּל
  choice: 脱离……一切
  rationale: 介词מן与כל连用，表达从所述范围中的全部事物得释放，保留其周全含义。
- source_word: מְגוּרוֹתַי
  choice: 我的一切恐惧
  rationale: 此处מְגוּרוֹת指使人惧怕的恐怖或内心的恐惧，并带第一人称单数后缀；译文保留这一归属关系，同时以脚注呈现“所惧怕的事”等可能理解。
- source_word: הִצִּילָנִי
  choice: 他救我脱离
  rationale: נצל的使役形表示救出、解救；“救我脱离”既适合危险处境，也不把含义局限为单纯的肉身营救。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”这一较贴近学界通常重构读音的现代汉语音译，以专名而非称号呈现。
- issue: מְגוּרוֹתַי所指的是主观恐惧还是令人惧怕之事
  choice: 我的一切恐惧
  alternative: 我所惧怕的一切
  rationale: 该名词可指恐惧、惊恐，也可具体指所惧怕的事物；正文保留较概括的表达，脚注列出具体化的译法，避免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌见证语体；两个分句保留原文“寻求—应允”“恐惧—解救”的平行推进。“应允”结合祷告语境，但不增添原文没有的神学解释。
