base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/000.yaml
  text: Of David[a], when he changed his behavior before Abimelech, and he drove him away, and he went away.
translation:
  language: zh_hans
  text: 大卫的诗[a]：他在亚比米勒面前改变了自己的举止；亚比米勒把他赶走，他离去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 撒母耳记上21:10–15称这位王为“亚吉”；这里的“亚比米勒”可能是他的别名，也可能是王室称号。
    reason: 保留原文人名，同时说明与相关历史叙事中的不同称呼。
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 诗篇标题中“לְ＋人名”可表示作者、归属或关联；“大卫的诗”符合现代汉语标题习惯，同时不明确限定为“由大卫所作”。
- source_word: בְּשַׁנּוֹתוֹ
  choice: 他……改变了
  rationale: בְּ加不定式在此表示时间背景；译成“他……改变了”自然地引出事件发生时的情形。
- source_word: טַעְמוֹ
  choice: 自己的举止
  rationale: טַעַם本可指味觉、判断或理性，在此结合叙事语境指外在表现或神态；“举止”既自然，又避免直接解释为“神志”或“装疯”。
- source_word: לִפְנֵי אֲבִימֶלֶךְ
  choice: 在亚比米勒面前
  rationale: 直译该介词短语，表达在其面前或其在场时。
- source_word: וַיְגָרֲשֵׁהוּ
  choice: 亚比米勒把他赶走
  rationale: 该动词意为赶走、驱逐。希伯来语中的主语承接亚比米勒，宾语指大卫；汉语明确主语可消除连续代词造成的歧义。并列叙事形式译为陈述次序，不加入目的或结果关系。
- source_word: וַיֵּלַךְ
  choice: 他就离去了
  rationale: 基本义为“去、离开”；在被赶走的语境中，“离去了”自然，并保留主语为大卫。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 正文保留并音译马所拉文本中的名字，不以撒母耳记叙事中的亚吉替换。
theological_decisions:
- issue: 亚比米勒与亚吉的历史身份关系
  choice: 正文保留“亚比米勒”
  alternative: 将其理解或直接译为迦特王亚吉
  rationale: 希伯来文本明确写“亚比米勒”，应在正文中保留；与撒母耳记上21:10–15中“亚吉”的对应关系可能源于别名或王号，但文本未作解释，故在脚注呈现而不在正文中调和。
- issue: 标题中לְדָוִד的关系
  choice: 译为“大卫的诗”
  alternative: 译为“大卫所作”或“献给大卫”
  rationale: 该结构可表达作者、归属或关联，正文不把其语义收窄为确定的作者声明或受献对象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号划分背景与后续动作，并明确“亚比米勒”为“赶走”的主语，以免汉语代词含混；不把“改变举止”进一步解释为“装疯”。
