  text: שֹׁמֵ֥ר כָּל עַצְמוֹתָ֑י/ו אַחַ֥ת מֵ֝/הֵ֗נָּה לֹ֣א נִשְׁבָּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/020.yaml
  text: He keeps all his bones[b][a]; not one of them is broken.
translation:
  language: zh_hans
  text: 他守护[a]那人全身的骨头[b]；一根也没有折断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守护”也可译作“保护”或“保全”。
    reason: lexical_alternative
  - marker: b
    text: 《约翰福音》19:36在耶稣被钉十字架的叙述中引用了这句话。
    reason: cross_reference
lexical_decisions:
- source_word: שֹׁמֵר
  choice: 守护
  rationale: 该分词表示看守、保护或保全；“守护”既保留主动保护的含义，也符合诗歌语体。
- source_word: כָּל עַצְמוֹתָיו
  choice: 那人全身的骨头
  rationale: כָּל 表示全部，עַצְמוֹתָיו 是“他的骨头”。为避免现代汉语中连续两个“他”所造成的指代混乱，以“那人”承接上下文中的义人，并用“全身的骨头”自然表达整体意义。
- source_word: אַחַת מֵהֵנָּה
  choice: 一根也
  rationale: 这是从全部骨头中取一而加以否定的分取结构；汉语以“一根也”简洁自然地表达“其中一根也不”。
- source_word: לֹא נִשְׁבָּרָה
  choice: 没有折断
  rationale: נִשְׁבָּרָה 是 שׁבר 的尼法勒完成式，表示“被折断／折断”。诗句带有概括性的保护陈述，“没有折断”在汉语中自然，并保留完成式所呈现的结果状态。
theological_decisions:
- issue: 单数代词后缀所指的人物
  choice: 以“那人”指向诗篇直接语境中的义人，守护者则由上文承接为耶和华。
  alternative: 在正文中直接写成“义人”，或因《约翰福音》19:36的引用而明确指向耶稣。
  rationale: 希伯来文只用第三人称单数后缀，直接语境谈论蒙耶和华搭救的义人。译文不把后来的基督论应用写入正文，同时以脚注说明正典中的引用，保留诗篇本义与新约应用之间的张力。
- issue: 骨头未折断的时态和陈述性质
  choice: 译为“一根也没有折断”，表达受保护后的完整状态。
  alternative: 译为“一根也不会折断”，将其明确处理为普遍应许。
  rationale: 希伯来文采用完成式；“没有折断”较少把诗句绝对化为对每位义人的未来保证，也与周围关于义人受苦却蒙拯救的张力相容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那人”用来消除“他守护他……”在汉语中的指代含混，同时不在正文中添加“义人”或“耶和华”等原句未明说的名词。分号保留希伯来诗句两分句之间的紧密关系。
