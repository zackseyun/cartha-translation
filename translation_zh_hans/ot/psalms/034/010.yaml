id: PSA.34.10
reference: Psalms 34:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כְּ֭פִירִים רָשׁ֣וּ וְ/רָעֵ֑בוּ וְ/דֹרְשֵׁ֥י יְ֝הוָ֗ה לֹא יַחְסְר֥וּ כָל טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/010.yaml
  text: Young lions suffer want and hunger[a], but those who seek Yahweh lack no good thing.
translation:
  language: zh_hans
  text: 少壮狮子也会缺乏挨饿[a]；但寻求雅威的人，什么好处都不缺。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“少壮狮子也会变得贫乏饥饿。”希伯来语动词可指处于缺乏中，也可指变得贫乏。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפִירִים
  choice: 少壮狮子
  rationale: 该词指年轻而强健的狮子，并非泛指狮子；“少壮狮子”保留了强壮捕食者竟也会匮乏的鲜明反差。
- source_word: רָשׁוּ
  choice: 缺乏
  rationale: 该动词可表示陷入贫乏或处于匮乏之中；“缺乏”自然简洁，同时不与后面的“挨饿”完全重复。
- source_word: וְרָעֵבוּ
  choice: 挨饿
  rationale: 该动词表示饥饿；“挨饿”在现代汉语中自然地表达实际承受饥饿。
- source_word: וְדֹרְשֵׁי יְהוָה
  choice: 但寻求雅威的人
  rationale: 分词结构指一贯寻求雅威的人；“寻求”既可涵盖求问，也可涵盖转向并追求神。连接词按上下文译作“但”，显明两组人的对比。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: לֹא יַחְסְרוּ
  choice: 都不缺
  rationale: 未完成式在此表达格言式的一般事实或确信；“都不缺”与后面的范围表达搭配自然。
- source_word: כָל טוֹב
  choice: 什么好处
  rationale: כָל 与否定句结合具有“任何”的范围意义；טוֹב 可指好的事物或益处。“什么好处都不缺”自然地保留其广泛而未具体限定的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”较贴近学界通常重构的读音，也保留神名而非以“主”这一称号代替。
- issue: “什么好处都不缺”的性质
  choice: 保留格言式、概括性的陈述
  alternative: 明确解释为今生物质供应的绝对保证
  rationale: 原文作宽泛的诗歌性保证，并未界定“好处”的具体类别；译文不额外缩窄为物质利益，也不加入原文没有的系统性解释。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。“少壮狮子”保留诗歌意象；分号呈现前后鲜明对比。脚注保留 רָשׁוּ 在状态与过程之间的词义可能性。
