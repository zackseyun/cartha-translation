base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/005.yaml
  text: They looked to him and were radiant[b][a], and their faces were not put to shame.
translation:
  language: zh_hans
  text: 他们仰望他[a]，便容光焕发[b]；他们的脸必不蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处希伯来文书写作“我”，诵读为“他”。正文按诵读传统译作“他”；按书写传统可译为“他们仰望我”。
    reason: textual_variant
  - marker: b
    text: 或译：“就发光”。此处希伯来动词可表达明亮、焕发光彩。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: 仰望
  rationale: 该词的使役词干在这里表示朝向、注目；“仰望”自然地表达向上主寻求、倚望的语境，又不过分强调凝视的时长。
- source_word: אֵלָי/ו
  choice: 他
  rationale: 马所拉文本的书写与诵读传统在“我”和“他”之间存在差异；正文采用更符合上下文的第三人称“他”，并在脚注保留“我”。
- source_word: וְנָהָרוּ
  choice: 就容光焕发
  rationale: 此动词虽可有流动之意，但在与“脸”和“蒙羞”相对的诗歌语境中，表示发亮、焕发光彩；“容光焕发”保留面容明亮的具体意象。
- source_word: וּפְנֵיהֶם
  choice: 他们的脸
  rationale: 直接保留希伯来文“脸”的具体意象，不抽象化为整体状态。
- source_word: אַל יֶחְפָּרוּ
  choice: 必不蒙羞
  rationale: אַל与未完成式在此不是禁令，而表达强烈否定的结果或确信；“必不蒙羞”兼顾诗歌语气以及公开受辱、羞愧的含义。
theological_decisions:
- issue: אֵלָי/ו所反映的书写与诵读异文
  choice: 仰望他
  alternative: 仰望我
  rationale: 上下文描述众人仰望耶和华，第三人称读法衔接较顺；但第一人称读法有文本传统依据，并会改变说话视角，因此以脚注明确保留，不予消解。
- issue: אַל יֶחְפָּרוּ的时态与语气
  choice: 必不蒙羞
  alternative: 没有蒙羞
  rationale: 希伯来语未完成式配合אַל可表达强烈否定、愿望或结果。正文用“必不”保留其前瞻性和确信语气，而不将其限定为单纯过去叙事。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“仰望”呼应信靠和寻求的语境；“容光焕发”与“脸”构成自然意象。“蒙羞”保留圣经诗歌中的荣辱语义。脚注标记按相关词语紧邻排列。
