  text: רַ֭בּוֹת רָע֣וֹת צַדִּ֑יק וּ֝/מִ/כֻּלָּ֗/ם יַצִּילֶ֥/נּוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/019.yaml
  text: Many are the afflictions of the righteous man[b][a], but Yahweh delivers him out of them all.
translation:
  language: zh_hans
  text: 义人[b]的患难[a]很多，但雅威救他脱离这一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难”所译的希伯来词也可指“恶事”“祸患”或“灾难”；这里侧重义人所遭遇的困苦。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文是阳性单数“义人”，可代表一般的义人，并不一定只指某一位男子。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: 很多
  rationale: 该词是置于句首的阴性复数谓语形容词，与“患难”呼应；译作“很多”既保留数量上的强调，也符合现代汉语表达。
- source_word: רָעוֹת
  choice: 患难
  rationale: 此词可指恶事、灾祸或困苦；本节所说的是临到义人、而雅威将其救离的逆境，因此“患难”能准确表达处境性的苦难，又不误解为义人所行的道德之恶。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该词为阳性单数、名词化使用。“义人”是自然、庄重的汉语表达；后文用单数代词“他”保留其单数形式，同时不排除其代表性用法。
- source_word: וּמִכֻּלָּם
  choice: 但……脱离这一切
  rationale: 连接词在上下文中形成转折：患难虽多，拯救却涵盖全部。“这一切”保留כֻּלָּם的全面含义。
- source_word: יַצִּילֶנּוּ
  choice: 救他脱离
  rationale: נצל的使役形表示搭救、解救；“救他脱离”清楚呈现拯救者、受救者以及获救脱离患难的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
theological_decisions:
- issue: צַדִּיק的阳性单数及其代表性
  choice: 义人……他
  alternative: 义人（不使用有性别标记的代词）／一个义人
  rationale: 原文采用阳性单数，但在智慧诗歌中可代表一般的义人。正文以“义人……他”保留单数和阳性形式，脚注说明其可能具有代表性，避免把范围限定为某一位男子。
- issue: רָעוֹת在义人语境中的语义
  choice: 患难
  alternative: 恶事／祸患／灾难
  rationale: 该词本身语义宽广，既可涉及“恶”，也可指所遭遇的祸患。此处雅威救义人脱离“这一切”，上下文更偏向临到他的困苦；选用“患难”，同时以脚注保存其他词义可能。
- issue: יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名。音译为“雅威”可保留专名功能，不以“主”这一称号代替。
translation_notes:
  register: 采用现代、自然而庄重的标准普通话。“义人的患难很多”贴近原文名词结构；“但”明确呈现两分句之间的语境性转折。神名统一译作“雅威”。
