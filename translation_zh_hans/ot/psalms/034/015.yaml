  text: עֵינֵ֣י יְ֭הוָה אֶל צַדִּיקִ֑ים וְ֝/אָזְנָ֗י/ו אֶל שַׁוְעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/015.yaml
  text: The eyes of Yahweh are toward the righteous[a], and his ears toward their cry for help.
translation:
  language: zh_hans
  text: 雅威的眼目注视义人；他的耳朵垂听他们的呼救[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“呼求”。希伯来语指人在困苦中发出的求助呼声。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: 眼目
  rationale: 保留希伯来文复数“眼睛”的拟人化诗歌意象；“眼目”庄重自然，并与下半句“耳朵”形成平行。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: אֶל
  choice: 看顾／垂听
  rationale: 介词表示朝向、关注。若逐字两次译作“朝向”，现代汉语较生硬，因此依上下文分别译为“看顾”和“垂听”，同时保留上帝专注于义人及其呼声的含义。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词名词化，指行义的人；“义人”是自然、凝练且具有经文语体的现代汉语表达。
- source_word: וְאָזְנָיו
  choice: 他的耳朵
  rationale: 保留原文复数身体意象及第三人称单数领属关系，与“眼目”构成诗歌平行。
- source_word: שַׁוְעָתָם
  choice: 他们的呼救声
  rationale: 该词特指人在困苦中为求帮助而发出的呼喊；“呼救声”比一般的“呼声”更准确地传达危难与求助意味。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用上帝的专名；音译为“雅威”可保留专名性质，避免以称号取代。
- issue: 关于上帝感知的拟人化语言
  choice: 保留“眼目”和“耳朵”
  alternative: 释义为“雅威看顾并听取”
  rationale: 原文以具体身体意象表达上帝的关注与回应；保留这些意象可维持诗歌力度，也不把神学解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“看顾／垂听”使 אֶל 的方向与关注含义在汉语中自然呈现；上下两分句保持“眼目—耳朵”的平行结构。
