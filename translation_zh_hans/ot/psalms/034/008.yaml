  terminology: “雅威”恰当保留四字神名；“美善”可表达טוֹב的良善与美好；“投靠”准确表达חסה的避难、庇护意象；“有福了”适切传达אַשְׁרֵי的祝福式赞叹。脚注应说明原文的阳性单数形式，而不把中文“人”误说成正文译为“男子”。
