  text: טַעֲמ֣וּ וּ֭/רְאוּ כִּי ט֣וֹב יְהוָ֑ה אַֽשְׁרֵ֥י הַ֝/גֶּ֗בֶר יֶחֱסֶה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/008.yaml
  text: Taste and see that Yahweh is good[a]; blessed is the man who takes refuge in him.
translation:
  language: zh_hans
  text: 你们要尝尝，也要看看：雅威是美善的！那投靠他的人[a]有福了！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为阳性单数，字面作“男人”；这里具有代表性，指任何投靠雅威的人。
    reason: 说明原文阳性单数形式及其代表性用法。
lexical_decisions:
- source_word: טַעֲמוּ
  choice: 你们要尝尝
  rationale: 保留复数命令式和“品尝”的具体感官意象；该词在诗中也指亲身体验，但不宜直接抽象化为“体验”。
- source_word: וּרְאוּ
  choice: 也要看看
  rationale: 保留“看”的感官意象，与“尝尝”形成诗性的并列；中文重叠式使劝勉自然亲切。
- source_word: כִּי
  choice: ：
  rationale: 此处引出所要品尝并看明的内容。中文用冒号自然呈现这一内容关系，同时避免加入原文没有的解释。
- source_word: טוֹב
  choice: 美善
  rationale: טוֹב既可指良善，也可含美好、可喜和施恩惠的意味；“美善”比单用“好”更适合庄重诗体，并保留较宽的语义范围。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按通常重建的读音音译四字神名，保留其作为以色列之上帝专名的性质，而不以“主”这一称号替代。
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 表达蒙福、处境可羡的感叹，既保留祝福语气，也符合现代中文圣经诗体。
- source_word: הַגֶּבֶר
  choice: 男子
  rationale: 原文是阳性单数名词，字面指男子；正文保留其形式，并以脚注说明这里具有代表性用法。
- source_word: יֶחֱסֶה
  choice: 投靠
  rationale: 保留חסה寻求庇护、以某者为避难所的意象，比泛化为“信靠”更具体。
- source_word: בּוֹ
  choice: 他
  rationale: 代词回指雅威；中文用“他”自然承接，不必重复神名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名并较贴近通常重建的读音；不以称号替代，也不把传统的“耶和华”形式当作原始读音。
- issue: הַגֶּבֶר 的阳性单数与代表性含义
  choice: 正文译“男子”，脚注说明代表性用法
  alternative: 人；凡投靠他的人
  rationale: 这样既保留原文明确的阳性单数形式，也不把诗句的应许误限于男性；其广泛适用范围由脚注交代。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“尝尝／看看”保留原文鲜明的双重感官意象；冒号呈现כִּי所引出的内容。“有福了”以感叹号表现אַשְׁרֵי的赞叹语气。
