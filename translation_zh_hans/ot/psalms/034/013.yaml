  yaml_path: translation/ot/psalms/034/013.yaml
  text: Guard your tongue from evil[a], and your lips from speaking deceit.
translation:
  language: zh_hans
  text: 要约束你的舌头，不说恶言；管住你的嘴唇，不说诡诈的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצֹר
  choice: 约束
  rationale: 该命令式可表示看守、保守或管束；用于言语伦理时，“约束”自然地表达克制舌头、使之远离恶言的含义。
- source_word: לְשׁוֹנְךָ
  choice: 你的舌头
  rationale: 保留希伯来文具体的身体意象；现代汉语也能自然理解为言语。
- source_word: מֵרָע
  choice: 不说恶言
  rationale: 原文直译为“远离恶”；结合“舌头”的语境，以“恶言”明确其言语伦理所指，同时保留 רַע 的道德意味。
- source_word: וּשְׂפָתֶיךָ
  choice: 你的嘴唇
  rationale: 保留与“舌头”平行的身体意象和诗歌表达。
- source_word: מִדַּבֵּר
  choice: 不说
  rationale: 介词 מִן 与不定词连用，表示使嘴唇远离某种说话行为；汉语用“不说”简洁自然。
- source_word: מִרְמָה
  choice: 诡诈的话
  rationale: מִרְמָה 指欺骗、诡诈；“诡诈的话”既贴合说话语境，也保留其蓄意欺骗的道德力度。
