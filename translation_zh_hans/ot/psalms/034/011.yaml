source:
  edition: WLC
  text: לְֽכוּ בָ֭נִים שִׁמְעוּ לִ֑/י יִֽרְאַ֥ת יְ֝הוָ֗ה אֲלַמֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/011.yaml
  text: Come[a], children, listen to me[b]; I will teach you the fear of Yahweh.
translation:
  language: zh_hans
  text: 来吧，孩子们[a]，听我说；我要教导你们敬畏雅威[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“儿子们”；在智慧文学中，这常是教师对受教者的称呼，可泛指学习的人。
    reason: lexical_alternative
  - marker: b
    text: “敬畏雅威”是智慧文学中的重要表达，包括尊崇、顺服，以及在上帝面前应有的畏惧。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: 来吧
  rationale: 该词本义为“走、去”，但在这里用于直接招呼听众，具有邀请意味；译作“来吧”比直译“去吧”更符合上下文和现代汉语表达。
- source_word: בָנִים
  choice: 孩子们
  rationale: 字面义为“儿子们”，但在智慧文学的训诲语境中常用于称呼受教者；“孩子们”保留亲切的教导口吻，同时不把对象限定为男性。
- source_word: שִׁמְעוּ לִי
  choice: 听我说
  rationale: 这一结构要求听者留心并接受教导，不只是听见声音；“听我说”在现代汉语中自然地表达了这种劝勉。
- source_word: יִרְאַת יְהוָה
  choice: 敬畏雅威
  rationale: 保留“敬畏”这一智慧文学核心用语，使其同时包含尊崇、顺服与面对上帝应有的畏惧，不将含义缩减为单纯的“尊敬”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；译作“雅威”，以音译保留上帝的立约之名。
- source_word: אֲלַמֶּדְכֶם
  choice: 我要教导你们
  rationale: 此处皮耶勒未完成式在语境中表达说话者接下来的意愿和行动；“我要教导你们”清楚自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文出现四字神名，而非称号；音译“雅威”直接保留其专名性质，不以称号替代。
- issue: יִרְאַת יְהוָה 的语义张力
  choice: 敬畏雅威
  alternative: 尊崇雅威
  rationale: “敬畏”既含尊崇与顺服，也保留人在上帝面前应有的畏惧感；译成“尊崇”会缩窄原词的语义范围。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“来吧”体现开篇招呼的语气；“孩子们”保留智慧教师对受教者的亲切称呼；分号呈现邀请聆听与承诺教导之间的结构。
