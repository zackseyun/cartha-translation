  text: תְּמוֹתֵ֣ת רָשָׁ֣ע רָעָ֑ה וְ/שֹׂנְאֵ֖י צַדִּ֣יק יֶאְשָֽׁמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/021.yaml
  text: Evil will put the wicked to death[a], and those who hate the righteous will be held guilty.
translation:
  language: zh_hans
  text: 邪恶必使恶人丧命[a]；恨恶义人的必自招罪责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“灾祸必杀死恶人。”希伯来语 רָעָה 可指“邪恶”，也可指“祸患”或“灾祸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹתֵת
  choice: 必使……丧命
  rationale: 这是מות的使役形未完成式，主语是后置的阴性名词רָעָה。“使……丧命”既保留使役意义，也比“杀死”更适合庄重的诗歌语体。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 单数形容词名词化，指具有代表性的恶者；“恶人”是现代汉语中自然、简洁的对应表达，不额外突出性别。
- source_word: רָעָה
  choice: 邪恶
  rationale: 该词可指道德上的恶，也可指祸患、灾祸。正文采用“邪恶”，保留原文的简洁表达及恶反噬恶人的道德张力；“灾祸”这一语境上可行的理解收入脚注。
- source_word: שֹׂנְאֵי
  choice: 恨恶……的
  rationale: Qal主动分词复数构造式，表达持续或特征性的态度；汉语关系结构自然地传达此义。
- source_word: צַדִּיק
  choice: 义人
  rationale: 单数形容词名词化，在此可作代表性单数理解；“义人”简洁并符合诗篇语体。
- source_word: יֶאְשָׁמוּ
  choice: 必被定罪
  rationale: אשם的Qal未完成式可表达负罪、承担罪责或被判有罪。“被定罪”自然地传达其司法性后果；虽采用被动措辞，但不明说审判者。
theological_decisions:
- issue: רָעָה应理解为道德上的“邪恶”，还是临到恶人的“灾祸”
  choice: 邪恶
  alternative: 灾祸必杀死恶人
  rationale: “邪恶”保留原词可能具有的道德含义和诗句中恶反噬恶人的张力；“灾祸”也符合该词的语义范围及上下文，因此以脚注保留，不武断消除歧义。
- issue: יֶאְשָׁמוּ强调负罪状态还是定罪结果
  choice: 必被定罪
  alternative: 必担当罪责／必算为有罪
  rationale: 该动词兼有负罪、受罚或被判有罪的含义。“必被定罪”在现代汉语中清楚有力，同时未具体说明定罪的程序或施行者。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。两分句保持紧凑平行；“必”对应未完成式在此语境中的确定将来或必然后果。正文保留רָעָה的语义张力，并用脚注说明另一种可行译法。
