  text: בַּ֭/יהוָה תִּתְהַלֵּ֣ל נַפְשִׁ֑/י יִשְׁמְע֖וּ עֲנָוִ֣ים וְ/יִשְׂמָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/002.yaml
  text: In Yahweh my soul will boast[b][a]; the humble will hear and rejoice.
translation:
  language: zh_hans
  text: 我的心必以雅威夸耀；谦卑的人[a]听见了，就会欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谦卑的人”也可译作“受苦卑微的人”或“温柔的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: 以雅威为荣
  rationale: 介词 ב 在此表示夸耀所凭借、所归向的对象；结合 תתהלל，译为“以雅威为荣”自然地保留“在雅威里夸耀”的含义。神名 יהוה 按源文音译为“雅威”。
- source_word: תִּתְהַלֵּל
  choice: 必……为荣
  rationale: הלל 的 Hitpael 在此意为“夸耀、自豪”，不是一般意义的“赞美”。“以……为荣”符合现代汉语，也避免“夸口”可能带来的纯负面色彩。未完成体在诗歌宣告中译作“必”。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נפשׁ 在此指说话者内在的自我或整个人。中文诗体中“我的心”比“我的灵魂”更自然，同时保留拟人化表达，未简化为“我”。
- source_word: יִשְׁמְעוּ
  choice: 听见
  rationale: שׁמע 的 Qal 未完成体意为“听见”。与后句连用时，中文以“听见，就要……”自然表达相继关系。
- source_word: עֲנָוִים
  choice: 谦卑的人
  rationale: ענוים 可指谦卑、温柔或受苦卑微的人；正文取“谦卑的人”，并以脚注保留“困苦卑微的人”的语义可能。
- source_word: וְיִשְׂמָחוּ
  choice: 就要欢喜
  rationale: שׂמח 表示欢喜、喜乐；“就要”在现代汉语中自然连接听见与欢喜，并反映未完成体的预期语气。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 源文直接使用四字神名；正文采用“雅威”音译，以保留其作为专名的性质，不以称号替代。
- issue: ענוים 的身份与处境含义
  choice: 谦卑的人
  alternative: 困苦卑微的人
  rationale: 该词可侧重品格上的谦卑，也可指社会处境中的困苦、卑微者。上下文不足以完全排除任一层面，因此正文采用较宽泛的“谦卑的人”，脚注注明另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“以雅威为荣”既贴近希伯来语结构，又避免“夸口”在现代汉语中常有的贬义；分号保留两分句的诗行并列与因果推进。
