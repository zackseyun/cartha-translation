base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/018.yaml
  text: Yahweh is near to the brokenhearted[a], and he saves those crushed in spirit.
translation:
  language: zh_hans
  text: 耶和华亲近心碎的人，也拯救灵里被压碎的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“灵里痛悔的人。”希伯来语可描述内心被压碎或谦卑的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: 靠近
  rationale: 作谓语形容词，表示“近、接近”；“靠近”在现代汉语中自然，并保留空间与关系两方面的意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行且庄重的形式音译四字神名，保留其专名性质，不以称号替代。
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: 心碎的人
  rationale: 原文直译为“心被打碎的人”；“心碎的人”自然地保留内在遭受重创的比喻。
- source_word: דַּכְּאֵי רוּחַ
  choice: 灵里受压的人
  rationale: דכא可指被压碎、压倒或降卑；“灵里受压”保留强烈的内在压迫感，同时不把含义限定为悔罪。
- source_word: יוֹשִׁיעַ
  choice: 拯救
  rationale: 使役词形在此表示施行拯救或搭救；“拯救”既符合当下脱离困境的语境，也保留圣经中较广的救恩用语联系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文保留其专名性质。采用现代中文读者最熟悉的传统音译“耶和华”，而不以“主”替代。
- issue: דַּכְּאֵי רוּחַ 的语义侧重
  choice: 灵里受压的人
  alternative: 灵里痛悔的人
  rationale: 该词组可描写内在被压碎、被压倒或谦卑的人；本节并未明确要求悔罪含义，因此正文保留较宽的受苦与卑微之意，并在脚注列出另一可能。
translation_notes:
  register: 采用自然、凝练而庄重的现代标准汉语，保留希伯来诗句的两行并列结构。“心碎”与“灵里受压”形成意象呼应，同时避免将第二短语仅解释为悔罪。
