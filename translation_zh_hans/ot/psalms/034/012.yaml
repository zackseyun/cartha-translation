  yaml_path: translation/ot/psalms/034/012.yaml
  text: Who is the man who delights in life[b][a], loving days to see good?
translation:
  language: zh_hans
  text: 有谁[a]喜爱生命，爱慕长寿，盼望看见美好[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“谁是那人”；这里的“人”具有泛指意义。
    reason: lexical_alternative
  - marker: b
    text: “看见美好”也可理解为“经历美好”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הָאִישׁ
  choice: 有谁
  rationale: 希伯来文直译为“谁是那人”。这里是智慧文学式的设问，所指具有普遍性；现代汉语用“有谁”既自然，也保留了问句的邀请意味。
- source_word: הֶחָפֵץ חַיִּים
  choice: 喜爱生命
  rationale: חפץ可表示渴望、喜爱或以之为乐；“喜爱”兼顾愿望与正面倾向。חַיִּים虽为复数形式，在这里惯常表示“生命”。
- source_word: אֹהֵב יָמִים
  choice: 爱慕长寿
  rationale: 原文直译为“爱日子”，与“生命”平行，语境上指盼望有许多日子，即长寿。“爱慕长寿”是自然汉语，同时保留其积极渴望。
- source_word: לִרְאוֹת טוֹב
  choice: 愿看见美好
  rationale: ראה的基本义是“看见”，טוֹב泛指美好或福乐；保留“看见美好”这一希伯来语表达，不把含义收窄为物质兴旺。汉语增补“愿”以顺接前面的愿望表达。
theological_decisions:
- issue: 阳性单数 הָאִישׁ 的代表性用法
  choice: 有谁
  alternative: 谁是那人／哪个人
  rationale: 原文形式为阳性单数“那人”，但在此设问中具有泛指作用，并非排除女性。汉语“有谁”能自然表达普遍邀请；脚注保留原文形式供读者查考。
translation_notes:
  register: 采用现代、庄重而易懂的设问句式。“喜爱生命，爱慕长寿”保留原文的平行结构；“看见美好”保留希伯来语意象，并以脚注说明其体验性含义。
