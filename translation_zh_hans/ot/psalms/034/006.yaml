id: PSA.34.6
reference: Psalms 34:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זֶ֤ה עָנִ֣י קָ֭רָא וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗י/ו הוֹשִׁיעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/006.yaml
  text: This poor man cried out[a], and Yahweh heard[b], and saved him from all his troubles.
translation:
  language: zh_hans
  text: 这个困苦人[a]呼求，雅威听见了，救他[b]脱离一切患难。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦人”也可译作“穷人”或“卑微人”。希伯来词可指贫穷、受苦或处境卑微的人。
    reason: lexical_alternative
  - marker: b
    text: “救他”也可译作“搭救他”或“解救他”，指使他脱离危险或困境。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: 这个
  rationale: 指示词用来指出眼前所说的个体；“这个”在见证式陈述中自然，并保留原文的直接语气。
- source_word: עָנִי
  choice: 困苦人
  rationale: 该词可指贫穷、受苦或卑微的人。本节着重患难中的呼求与获救，“困苦人”既贴合语境，又不把含义局限于经济贫穷。
- source_word: קָרָא
  choice: 呼求
  rationale: 该动词本义为呼叫；在患难中向上帝发声的语境里，“呼求”准确表达带着恳求的呼喊。
- source_word: יהוה
  choice: 雅威
  rationale: 直接音译四字神名，表明这里使用的是上帝的专名，而非一般称号。
- source_word: שָׁמֵעַ
  choice: 听见了
  rationale: 此处在诗人的见证中叙述已经发生的回应，用过去完成的叙事语气最自然；“听见”也保留原文简洁措辞。
- source_word: מִכָּל צָרוֹתָיו
  choice: 脱离一切患难
  rationale: מִן与“所有”连用，表达从全部困境中获救；צָרוֹת指患难、困境或窘迫，“一切患难”符合诗体且通俗庄重。
- source_word: הוֹשִׁיעוֹ
  choice: 救他
  rationale: 使役形表达使人得救、脱险；“救他”保留圣经中“拯救”词汇的关联，同时适合此处具体脱离患难的语境。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；耶和华上主
  rationale: 原文直接使用四字神名。采用“雅威”以专名形式呈现，不以称号替代，也避免把本节未明说的解释加入正文。
- issue: עָנִי是否仅指经济上的穷人
  choice: 困苦人
  alternative: 穷人；卑微人
  rationale: 该词的语义范围包括贫穷、受压与卑微；上下文明确提到患难，因此正文采用较宽的“困苦人”，并以脚注保留其他可能。
- issue: 诗人自指与代表性用法
  choice: 保留单数的“这个……人／他”
  alternative: 泛化为“困苦的人／他们”
  rationale: 原文是阳性单数，首先可指诗人本人，也可能具有代表意义；保留单数，不在译文中预先裁定其代表范围。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语言；句式紧凑，保留原文“呼求—听见—拯救”的行动次序和单数见证语气。
