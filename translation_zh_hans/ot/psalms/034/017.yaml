  text: צָעֲק֣וּ וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗/ם הִצִּילָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/017.yaml
  text: They cried out[a], and Yahweh heard, and delivered them from all their troubles.
translation:
  language: zh_hans
  text: 他们呼求，雅威[a]就听见，救他们脱离他们一切的患难。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“YHWH”（יהוה）；此名常译作“耶和华”，这里音译为“雅威”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: צָעֲקוּ
  choice: 他们呼求
  rationale: צעק在此表示身处困境时急切求助；“呼求”比单纯的“呼喊”更自然地传达向上帝求援的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名YHWH，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: שָׁמֵעַ
  choice: 就听见
  rationale: 该词形为分词，夹在完成式动词之间；汉语“听见”无需明定时态，既能配合诗句所述的回应过程，也不抹去希伯来语在叙事与常态表达之间的张力。“就”自然呈现呼求与回应的衔接。
- source_word: מִכָּל צָרוֹתָם
  choice: 脱离他们一切的患难
  rationale: מן表达从困境中脱离，כָּל涵盖全部，צָרוֹת指各种困苦、危难；“患难”兼具现代可懂性和诗篇所需的庄重语体。
- source_word: הִצִּילָם
  choice: 救他们
  rationale: נצל的使役式表示救出、搭救，使人脱离危险；“救”简洁自然，并与后面的“脱离”共同传达原文含义，不额外限定为某种教义性的救恩。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用上帝的专名YHWH。“雅威”按现代学界通常重构的读音音译，可保留专名，不将其改作称号；脚注同时说明传统译法。
- issue: שָׁמֵעַ的时态与体貌
  choice: 采用不显明标注时态的“听见”
  alternative: 听；垂听了
  rationale: 希伯来语分词可呈现持续、常态或与上下文相连的动作，而相邻动词为完成式。现代汉语动词本身不强制标时，因而可保留这种张力；避免用“了”过度锁定为单次过去事件，也避免用“垂听”额外强化应允之意。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。句法保留“呼求—听见—救出”的诗意推进；不添加原文没有的“义人”，让“他们”的所指由上下文确定。
