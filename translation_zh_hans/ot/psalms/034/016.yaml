base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/016.yaml
  text: The face of Yahweh is against those who do evil[b][a], to cut off the memory of them from the earth.
translation:
  language: zh_hans
  text: 耶和华[a]敌对作恶的人，要从地上[b]除去他们的记念。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“耶和华的面……敌对作恶的人。”这里“面”可指他的临在或亲自转向；该表达表示耶和华主动敌对作恶的人。
    reason: lexical_alternative
  - marker: b
    text: “地上”或译“那地上”；若这里的 אֶרֶץ 指某一特定土地，而非普遍的大地。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי
  choice: 面
  rationale: 直译为“面”，保留希伯来文以具体形象表达耶和华亲自临在并敌对恶人的诗意；脚注说明也可按其惯用含义理解为“临在”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，不以称号替代。
- source_word: בְּעֹשֵׂי רָע
  choice: 敌对作恶的人
  rationale: 介词 בְּ 在本句表达敌对的指向；“作恶的人”保留分词所指持续以恶行事之人，同时比标签式的“恶人”更贴近原文结构。
- source_word: לְהַכְרִית
  choice: 要……断绝
  rationale: 使役式不定词表达耶和华敌对他们的目的或结果；“断绝”保留 כרת 的强烈、彻底意味，又适合与“记念”搭配。
- source_word: מֵאֶרֶץ
  choice: 从地上
  rationale: אֶרֶץ 可指特定的“土地”或普遍的“大地”；正文采用本智慧诗普遍性陈述中较自然的“地上”，并以脚注保留局部理解。
- source_word: זִכְרָם
  choice: 对他们的记念
  rationale: 保留“记念、记忆”的核心语义，表示他们在人间留下、被人记住的记忆，而不缩窄为名誉或仅仅姓名。
theological_decisions:
- issue: 如何呈现“耶和华的面”这一神人同形的表达
  choice: 保留“耶和华的面”，并直接说它“敌对”作恶的人
  alternative: 意译为“耶和华亲自敌对作恶的人”或“耶和华临在作恶的人那里，与他们为敌”
  rationale: 正文保留原文具体而有张力的形象，表达耶和华主动、亲自的敌对，并不据此断言上帝具有物质身体；脚注交代“面”可表示“临在”。
- issue: “断绝记念”的范围
  choice: 正文采用普遍性的“从地上”
  alternative: 理解为从某一特定“土地”上除去他们的记念
  rationale: 本诗的智慧训诲语境适合普遍性理解，但 אֶרֶץ 本身也可指“土地”，故不排除较局部的读法，并以脚注保留。
translation_notes:
  register: 采用现代、庄重而略具诗意的表达。“面敌对”有意保留希伯来文突出的身体意象；“断绝对他们的记念”保持审判语气及原文结构，同时在现代普通话中仍可理解。
