id: PSA.34.9
reference: Psalms 34:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְר֣אוּ אֶת יְהוָ֣ה קְדֹשָׁ֑י/ו כִּי אֵ֥ין מַ֝חְס֗וֹר לִ/ירֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/009.yaml
  text: Fear Yahweh[a], his holy ones[b], for those who fear him lack nothing.
translation:
  language: zh_hans
  text: 耶和华的圣民啊，要敬畏他！因为敬畏他的人一无所缺。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְר֣אוּ
  choice: 要敬畏
  rationale: 这是 ירא 的第二人称阳性复数祈使式。译作“敬畏”既保留对上帝的畏惧，也表达尊崇与虔敬，符合诗篇劝勉语境。
- source_word: אֶת יְהוָה
  choice: 耶和华
  rationale: אֶת 标明直接宾语，יְהוָה 是上帝的专名；采用现代中文圣经读者熟悉的“耶和华”。
- source_word: קְדֹשָׁיו
  choice: 他的圣民
  rationale: 该词是“圣洁者”的复数实体用法，带第三人称阳性单数后缀。此处指属上帝、分别为圣的群体；“圣民”比“圣者”更自然，也避免让人误解为超自然存在。
- source_word: כִּי
  choice: 因为
  rationale: 引出前面命令的理由，现代汉语用“因为”清楚自然。
- source_word: אֵין מַחְסוֹר
  choice: 一无所缺
  rationale: 这一结构表达没有缺乏；“一无所缺”凝练、自然，并保留原文概括性的应许。
- source_word: לִירֵאָיו
  choice: 敬畏他的人
  rationale: 介词 לְ 加 ירא 的复数分词及第三人称阳性单数后缀。译文重复“敬畏”，保留它与句首命令之间的词汇呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用长期通行且容易识别的“耶和华”，不以“主”替代专名。
- issue: “一无所缺”的范围
  choice: 保留概括性的陈述
  alternative: 增译为“不缺任何好处”或“不缺生活所需”
  rationale: 本节原文只说“没有缺乏”，未明确限定对象；译文不加入后文或特定神学解释，以保留原有张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以呼语“耶和华的圣民啊”明确 קְדֹשָׁיו 与神名的领属关系；后句保留诗歌式的简洁和重复。
