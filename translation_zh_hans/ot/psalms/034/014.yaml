translation:
  language: zh_hans
  text: 要远离恶，行善；要寻求平安，并竭力追求。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可译为“和平”“安康”或“完满”；希伯来语 שָׁלוֹם 的含义不只是不发生冲突。
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּר מֵרָע
  choice: 离开恶
  rationale: סוּר是命令式，表示转离、离开；介词מִן表示与恶分离。“离开恶”简洁自然，也保留主动远离邪恶的劝诫意味。
- source_word: וַעֲשֵׂה טוֹב
  choice: 行善
  rationale: 直译为“做善事／行美善之事”。“行善”是现代汉语中简练而庄重的表达，并与前句“恶”形成鲜明对照。
- source_word: בַּקֵּשׁ
  choice: 寻求
  rationale: 该加强词干命令式表达认真、积极地求取；“寻求”既自然，也保留持续努力的意味。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם可指和平、完整、安康与福祉。“平安”适合诗篇的语域，也比单指没有冲突的“和平”更能承载其较宽广的含义。
- source_word: וְרָדְפֵהוּ
  choice: 并且追求它
  rationale: רָדַף本义为追赶、追逐，在此强调积极而坚持不懈地追求；阳性单数后缀指回שָׁלוֹם，因此保留“它”以明确原文的照应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。四个命令以两个分句呈现，保留希伯来诗句的平行结构和由远离恶到积极追求平安的递进。脚注标记置于所说明的“平安”相关陈述之后。
