  text: אֲבָרֲכָ֣ה אֶת יְהוָ֣ה בְּ/כָל עֵ֑ת תָּ֝מִ֗יד תְּֽהִלָּת֥/וֹ בְּ/פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/001.yaml
  text: I will bless Yahweh at all times[a]; his praise will continually be in my mouth.
translation:
  language: zh_hans
  text: '我要时时称颂雅威[a]；

    对他的赞美常在我口中。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为יהוה（YHWH），这里译作“雅威”；也常译作“耶和华”。
    reason: 说明神名的原文形式及常见中文异译。
lexical_decisions:
- source_word: אֲבָרֲכָה
  choice: 我要……称颂
  rationale: 该词是ברך的第一人称单数形式，带诗歌中表意愿或决心的词尾；“我要……称颂”表达诗人立定心志持续赞美，而不只陈述当前行为。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按四字神名יהוה的常见学术拟音译作“雅威”，保留其作为以色列上帝之名的性质，不以称号替代。
- source_word: בְּכָל עֵת
  choice: 时时
  rationale: 原文直义为“在一切时候”；“时时”简洁自然，保留时间上的全面与持续性。
- source_word: תָּמִיד
  choice: 必常
  rationale: תמיד表示持续、恒常。“常”保留连续意味；配合前句的立志语气加“必”，使汉语诗句自然，并与“时时”形成相应而不完全重复。
- source_word: תְּהִלָּתוֹ
  choice: 赞美他的话
  rationale: 原文名词意为“他的赞美”，可指以他为对象或主题的颂赞。“赞美他的话”在现代汉语中较自然，并保留口头颂赞的具体含义。
- source_word: בְּפִי
  choice: 在我口中
  rationale: 直译为“在我的口中”，保留原文以口表达赞美的身体意象，也符合庄重的汉语诗歌表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近YHWH学术拟音的“雅威”，同时以脚注说明华语传统中常见的“耶和华”，不把神名改作“主”等称号。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。两行结构对应希伯来诗句的平行关系；“时时”与“必常”共同传达持续性，同时避免机械重复。
