  text: פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑י/ו וְ/לֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל הַ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/022.yaml
  text: Yahweh redeems the life of his servants[b][a], and none of those who take refuge in him will be held guilty.
translation:
  language: zh_hans
  text: 耶和华救赎他仆人的性命[a]；凡投靠他的，必不被定为有罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”原文也可译作“生命”或“整个人”；传统上有时译作“灵魂”。
    reason: lexical_alternative
  - marker: b
    text: “被定为有罪”也可译作“担当罪责”或“被定罪”；原文动词带有罪责和司法判定的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: פּוֹדֶה
  choice: 救赎
  rationale: פדה指藉着解救而赎回；“救赎”兼顾救援与赎回之意，也保留诗篇中的神学分量。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号代替。
- source_word: נֶפֶשׁ
  choice: 性命
  rationale: 此处指活着的整个人或生命，而非专指与身体相对的非物质“灵魂”；“性命”在救援语境中自然准确。
- source_word: עֲבָדָיו
  choice: 他仆人的
  rationale: עבד可指奴仆或仆人；诗篇此处着重人与耶和华的服事关系，“仆人”最合语境。
- source_word: יֶאְשְׁמוּ
  choice: 被定为有罪
  rationale: אשם在此带有罪责与司法判定意味；“被定为有罪”保留司法色彩，却不把含义收窄为末世性的“被定罪”。
- source_word: הַחֹסִים בּוֹ
  choice: 凡投靠他的
  rationale: חסה表达寻求庇护、以某人为避难所；“投靠”简洁自然，并保留避难的意象。
theological_decisions:
- issue: נֶפֶשׁ在拯救语境中的含义
  choice: 译作“性命”
  alternative: 译作“灵魂”或“生命”
  rationale: 本词常指生命或整个活人；本节强调耶和华救赎其仆人，不要求身心二分的人论。“性命”避免加入原文没有明说的二元含义。
- issue: יֶאְשְׁמוּ的语力
  choice: 译作“被定为有罪”
  alternative: 译作“担当罪责”“受惩罚”或“被定罪”
  rationale: 该动词具有罪责和司法层面的含义，与前句“救赎”形成呼应；此译保留司法语力，同时不擅自限定为最终审判。
- issue: 分词פּוֹדֶה的时态语气
  choice: 用无显式时态的“救赎”表达耶和华持续或惯常的作为
  alternative: 译作“必救赎”或“正在救赎”
  rationale: 希伯来语分词可描述持续、特征性或当下的行动；中文“救赎”不强行限定时间，保留原文弹性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“耶和华”作为神名符合通行中文圣经语域；句式简洁，并用分号呈现两分句之间救赎与无罪责的对应关系。
