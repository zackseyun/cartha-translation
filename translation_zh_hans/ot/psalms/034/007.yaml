  yaml_path: translation/ot/psalms/034/007.yaml
  text: The angel of Yahweh encamps around those who fear him[a], and rescues them.
translation:
  language: zh_hans
  text: 耶和华的使者在敬畏他的人四围安营[a]，搭救他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“天使”。希伯来语 מַלְאַךְ 两义皆有；这里较可能指天上的使者。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹנֶה
  choice: 安营
  rationale: 该词是חנה的Qal主动分词，描写持续或典型的行动；“安营”自然保留营地及护卫的空间意象。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ本义可指受差遣的“使者”，也可指天使；正文采用“使者”以保留希伯来词的词义张力，并在脚注说明传统译法。专名יְהוָה译作“耶和华”。
- source_word: סָבִיב
  choice: 在……四围
  rationale: 表达环绕的位置关系，与“安营”共同呈现保护性的空间图景。
- source_word: לִירֵאָיו
  choice: 敬畏他的人
  rationale: 保留“敬畏”的圣经用语，兼含畏惧与尊崇，不弱化为单纯的尊敬。
- source_word: וַיְחַלְּצֵם
  choice: 搭救他们
  rationale: חלץ在此语境表示使人脱离危险；“搭救”是清楚、自然且庄重的现代汉语。
theological_decisions:
- issue: מַלְאַךְ יְהוָה应译为“耶和华的使者”还是“耶和华的天使”，以及是否指明其更具体的神学身份
  choice: 正文译作“耶和华的使者”，不进一步界定其身份
  alternative: “耶和华的天使”；或将其明确认定为神显或基督显现
  rationale: מַלְאַךְ可指人间使者或天上使者；本节语境支持超自然使者的理解，但原文没有明确界定其身份。译文及脚注保留这种词义与神学张力，不作经文之外的认定。
- issue: 神名יְהוָה的呈现
  choice: 耶和华
  alternative: 雅威；主
  rationale: 采用现代中文圣经读者熟悉的专名形式“耶和华”，使其保持为神的名字而非以称号“主”替代。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“在……四围安营”保留原文护卫性的营地图景；“敬畏”保留其宗教与盟约语境中的丰富含义。
