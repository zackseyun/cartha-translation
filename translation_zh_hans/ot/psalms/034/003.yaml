  text: גַּדְּל֣וּ לַ/יהוָ֣ה אִתִּ֑/י וּ/נְרוֹמְמָ֖ה שְׁמ֣/וֹ יַחְדָּֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/003.yaml
  text: Magnify Yahweh with me[a], and let us exalt his name together.
translation:
  language: zh_hans
  text: 你们要和我一同尊雅威[a]为大；让我们一起尊崇他的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是四个希伯来辅音字母构成的神名“YHWH”。“雅威”是现代常用的学术转写；其古代实际读音不能完全确定。
    reason: 说明原文神名的形式，并交代“雅威”这一译名及其发音不确定性。
lexical_decisions:
- source_word: גַּדְּלוּ
  choice: 尊……为大
  rationale: 该复数祈使式在赞美语境中表示宣认、颂扬其伟大，并非使其在实际意义上变大；“尊……为大”既贴近原文意象，也符合现代汉语的敬拜表达。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 原文直接使用四字神名יהוה；采用现代中文圣经读者熟悉的“耶和华”，并以脚注说明其性质与可能读音。
- source_word: אִתִּי
  choice: 和我一同
  rationale: 准确表达介词与第一人称单数后缀所表示的共同参与。
- source_word: וּנְרוֹמְמָה
  choice: 让我们……尊崇
  rationale: 第一人称复数鼓励式表达邀请和劝勉，不宜处理为单纯将来时；“让我们”保留其意愿和号召语气。
- source_word: שְׁמוֹ
  choice: 他的名
  rationale: 保留希伯来文“名”的表达；这里既指称呼，也承载其所启示的身份和声誉。
- source_word: יַחְדָּו
  choice: 一起
  rationale: 自然、清楚地表达众人联合参与同一赞美行动。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以四个辅音字母构成的神名。其古代准确发音不能完全确定；正文采用中文传统且广为人知的“耶和华”，脚注保留“雅威”这一常见学术拟音，避免掩盖原文为专名这一事实。
- issue: “尊……为大”的含义
  choice: 理解为共同宣认并颂扬耶和华的伟大
  alternative: 使耶和华变得更大
  rationale: 在本诗赞美语境中，גדל并非暗示神的本体能够增大，而是呼召会众承认并高举他的伟大。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们要……；让我们……”保留两处劝勉形式及由听众转为共同参与的语气；分号呈现两句平行诗行的紧密关系。
