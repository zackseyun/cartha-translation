  text: זְכֹ֤ר יְהוָ֨ה לִ/בְנֵ֬י אֱד֗וֹם אֵת֮ י֤וֹם יְֽרוּשָׁ֫לִָ֥ם הָ֭/אֹ֣מְרִים עָ֤רוּ עָ֑רוּ עַ֝֗ד הַ/יְס֥וֹד בָּֽ/הּ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/007.yaml
  text: Remember[a], O Yahweh, against the sons of Edom the day of Jerusalem, those who were saying, “Lay it bare, lay it bare[b], down to its foundation!”
translation:
  language: zh_hans
  text: 雅威啊，求你记住以东子孙[a]在耶路撒冷遭难之日[b]所喊的话：“把它拆光！把它拆光[c]！一直拆到它的根基！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“记住”不只是指想起；原文的介词结构在哀歌和审判语境中带有记念并向以东追究的意味。
    reason: 说明希伯来语介词结构在此处的不利、司法含义，同时不在正文中过度明说惩罚。
  - marker: b
    text: 直译“耶路撒冷的日子”，指耶路撒冷遭受灾祸、被毁的时刻。
    reason: 保留原文简约表达所容纳的语义范围。
  - marker: c
    text: 也可译“把它剥光！把它剥光！”或“把它拆毁！把它拆毁！”原词着重于彻底剥除、暴露无遗。
    reason: 原动词兼有剥除、显露及在本语境中彻底拆毁的意象，单一汉语词难以涵盖全部色彩。
lexical_decisions:
- source_word: זְכֹר ... לִבְנֵי אֱדוֹם
  choice: 求你记住以东子孙
  rationale: 保留祈使语气和“记住”的核心意象；此处介词结构带有不利于以东、要求追究的司法意味，但不把这种含义直接扩写成“惩罚”，以免过度解释。脚注说明这一语用力量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行现代拟音处理为专名“雅威”，不以“主”这一称号替代。
- source_word: אֵת יוֹם יְרוּשָׁלִָם
  choice: 在耶路撒冷遭难之日
  rationale: 希伯来语直译为“耶路撒冷的日子”，语境指该城遭受灾祸和毁灭之时；正文采用现代汉语中清楚自然的表达，同时以脚注保留原文的简约和歧义。
- source_word: הָאֹמְרִים
  choice: 那时他们不断喊着
  rationale: 分词描写以东子孙当时持续发出的呼喊；“不断喊着”比简单的“说”更能传达重复命令的场景感。
- source_word: עָרוּ עָרוּ
  choice: 拆光！拆光！
  rationale: 重复两个祈使词，保留原文急迫、残酷的呼喊。“拆光”在汉语中自然地表达剥除、拆毁至一无所留；脚注列出更贴近字面的译法。
- source_word: עַד הַיְסוֹד בָּהּ
  choice: 一直拆到城的根基
  rationale: 保留单数“根基”以及彻底毁坏到底层的方向性；“城的”明确阴性代词所指的耶路撒冷。
theological_decisions:
- issue: 如何呈现四字神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用的是以色列上帝的专名，不是称号。采用“雅威”既保留专名性质，也较贴近现代对 YHWH 的拟音。
- issue: “记住以东子孙”的审判意味
  choice: 正文保留“记住”，脚注说明含有追究之意
  alternative: 求你惩罚以东子孙；求你追讨以东子孙的罪
  rationale: 诗句是带有咒诅色彩的哀歌祈求，但原文仍使用“记住”而非直接使用“惩罚”。保留这一表达可维护原文的修辞张力，不把记念与施行审判完全等同。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“所作所为”使“记住……那日”与后面的引语在汉语中衔接自然；感叹号和重复短句保留诗中强烈的控诉感。
