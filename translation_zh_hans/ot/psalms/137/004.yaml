  text: אֵ֗יךְ נָשִׁ֥יר אֶת שִׁיר יְהוָ֑ה עַ֝֗ל אַדְמַ֥ת נֵכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/004.yaml
  text: How can we sing the song of Yahweh on foreign soil?[a][b]
translation:
  language: zh_hans
  text: 我们怎能在异国的土地上唱雅威的歌呢？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“雅威的歌”；“雅威”传统上常译作“耶和华”。
    reason: alternative_reading
  - marker: b
    text: 或译“在异国”。希伯来文直译为“在异国的土地上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: 怎能
  rationale: 疑问副词在本句中构成带有哀叹意味的反问，既涉及如何，也暗含是否可能或合宜；“怎能”在现代汉语中自然地传达这种语气。
- source_word: נָשִׁיר
  choice: 我们……唱
  rationale: 这是动词“唱”的Qal未完成式第一人称复数；与“怎能”搭配，表达流亡者面对所设想行动的反问。
- source_word: שִׁיר יְהוָה
  choice: 雅威的歌
  rationale: 该结构指归于雅威、用于敬拜他的歌；以“雅威的歌”保留原文的简洁以及所属关系可能包含的丰富含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，而不以“主”这一称号代替；脚注同时说明传统译名。
- source_word: עַל אַדְמַת נֵכָר
  choice: 在异国的土地上
  rationale: 保留介词“在……上”和אֲדָמָה所带的土地、地面的具体意象；נֵכָר表示属于别国或外族的。“异国的土地”兼顾原文形象与自然汉语。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神名。正文采用较贴近YHWH可能读音的汉语音译“雅威”，避免用称号“主”取代专名；传统译名“耶和华”列入脚注，方便读者辨认。
- issue: “雅威的歌”所表达的关系
  choice: 保留所有格结构，不作进一步解释
  alternative: 献给雅威的歌；圣殿敬拜之歌
  rationale: 希伯来文构词关系可涵盖属于雅威、颂赞雅威或用于敬拜雅威的歌；正文不把这一关系限定为单一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“怎能……呢”传达流亡哀歌中的反问语气；“异国的土地”保留原文具体的土地意象，同时普通读者容易理解。
