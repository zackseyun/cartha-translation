  text: תִּדְבַּ֥ק לְשׁוֹנִ֨/י לְ/חִכִּ/י֮ אִם לֹ֪א אֶ֫זְכְּרֵ֥/כִי אִם לֹ֣א אַ֭עֲלֶה אֶת יְרוּשָׁלִַ֑ם עַ֝֗ל רֹ֣אשׁ שִׂמְחָתִֽ/י־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/006.yaml
  text: May my tongue cling to the roof of my mouth if I do not remember you[b][a], if I do not exalt Jerusalem above my highest joy.
translation:
  language: zh_hans
  text: 我若不记念你[a]，愿我的舌头紧贴上腭；我若不把耶路撒冷置于我最大的喜乐之上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你”指耶路撒冷；诗人在这里直接称呼这座城。
    reason: referent_clarification
  - marker: b
    text: 直译：“把耶路撒冷举到我喜乐的头上”；也可译作“把耶路撒冷列为我首要的喜乐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְבַּק
  choice: 愿……紧贴
  rationale: דבק表示“粘住、紧贴”。这里属于自我咒诅式誓言，以“愿”表达希伯来语未完成式在誓言中的祈愿语气；“紧贴”保留具体的身体意象，也符合现代汉语表达。
- source_word: לְשׁוֹנִי לְחִכִּי
  choice: 我的舌头紧贴上颚
  rationale: לָשׁוֹן是“舌头”，חֵךְ是“上颚、腭”。采用普通读者容易理解的“上颚”，不把无法说话的身体意象抽象化。
- source_word: אִם לֹא
  choice: 我若不
  rationale: 保留条件句结构及其与自我咒诅之间的关系，比译作一般性的“除非”更清楚。
- source_word: אֶזְכְּרֵכִי
  choice: 记念你
  rationale: זכר意为“记得、记念”；第二人称阴性单数后缀保留为直接称呼“你”。“记念”在庄重诗歌语体中自然，并体现有意识地牢记。
- source_word: אַעֲלֶה אֶת יְרוּשָׁלַם
  choice: 把耶路撒冷置于……之上
  rationale: עלה的使役形本义为“使上升、举起”；与后面的עַל רֹאשׁ连用时表达把耶路撒冷放在最高、最优先的位置。“置于……之上”既保留空间隐喻，也传达价值次序。
- source_word: עַל רֹאשׁ שִׂמְחָתִי
  choice: 我最大的喜乐之上
  rationale: 字面为“在我喜乐的头上”。这里的“头”表示首位或最高等级；译文用“最大的喜乐之上”传达耶路撒冷高于诗人其他最高喜乐的意思，同时以脚注保留原文意象。
theological_decisions:
- issue: “记念你”中阴性单数“你”的指代
  choice: 指被人格化并受到直接称呼的耶路撒冷
  alternative: 可较宽泛地理解为锡安或圣城
  rationale: 从本诗上下文看，耶路撒冷是最近且最自然的所指，阴性后缀也与城名的语法性别相合。保留第二人称直接称呼，不额外加入教派性解释。
- issue: 耶路撒冷与“我的喜乐”的关系
  choice: 耶路撒冷被置于诗人最大的喜乐之上
  alternative: 以耶路撒冷为“首要的喜乐”或“最高的喜乐”
  rationale: 原文的空间性表达容许略有不同的关系理解。正文保留“在……之上”的比较意象，脚注说明其字面形式，避免把诗句完全改写成单一的抽象排名。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。两个“我若不”形成平行结构，分号显明同一誓言中的两项条件；正文保留“舌头紧贴上颚”和“置于……之上”的具体意象。
