  text: בַּת בָּבֶ֗ל הַ/שְּׁד֫וּדָ֥ה אַשְׁרֵ֥י שֶׁ/יְשַׁלֶּם לָ֑/ךְ אֶת גְּ֝מוּלֵ֗/ךְ שֶׁ/גָּמַ֥לְתְּ לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/008.yaml
  text: Daughter Babylon[a], devastated one[b], blessed is the one who repays you with the recompense you dealt to us.
translation:
  language: zh_hans
  text: 巴比伦的女儿啊[a]，你这遭毁坏的[b]！按你待我们的报应你的人，有福了！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“巴比伦的女儿”；这是把巴比伦城（或其居民）人格化的诗歌称呼。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“被摧毁的”或“被劫掠的”；原词可着重已经遭受的毁坏，也可能指将要临到的毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת בָּבֶל
  choice: 巴比伦城啊
  rationale: 该结构直译为“巴比伦之女”，是把巴比伦城人格化的诗歌称呼。正文用“巴比伦城啊”使现代汉语读者能直接明白所指，脚注保留“女子／女儿”的原文意象。
- source_word: הַשְּׁדוּדָה
  choice: 你这遭毁灭的
  rationale: 源自动词שׁדד的被动形式，可表示遭受摧毁、劫掠，也可能带有即将遭此结局的意味。“遭毁灭的”保留被动受害／受审判的核心，不在正文中强行限定时间。
- source_word: אַשְׁרֵי
  choice: 这人有福了
  rationale: 这是诗篇常见的福乐宣告。“有福了”比“快乐”更能保留庄重的祝福语气，也不把原句改写成单纯的未来预言。
- source_word: שֶׁיְשַׁלֶּם לָךְ
  choice: 报应你的
  rationale: 此处שׁלם表示偿还、以相称行为回报。“报应”在本语境中自然表达惩罚性的回偿，并保留对等报偿的司法意味。
- source_word: אֶת גְּמוּלֵךְ שֶׁגָּמַלְתְּ לָנוּ
  choice: 照你待我们的
  rationale: גְּמוּל与גמל形成词根呼应，意为按巴比伦加给诗人群体的行为回报它。汉语以“照你待我们的”简洁表达以其人之道相还的关系，避免生硬重复，同时不增添原文未明说的具体罪行。
theological_decisions:
- issue: 对报应巴比伦者所作的有福宣告
  choice: 保留“这人有福了”的直接宣告，不弱化其冲击力
  alternative: 译成未来预测，或用释义淡化报复与报偿的意味
  rationale: 希伯来文明确使用אַשְׁרֵי福乐公式，宣告按巴比伦所行报应它的人有福。译文应保留咒诅诗中报偿正义与祷告张力，不替读者消解或美化。
translation_notes:
  register: 采用现代、庄重而可懂的诗篇语体。“巴比伦城啊”避免“巴比伦女子”被误解为某位来自巴比伦的女性；两个脚注分别保存原文的城市人格化意象及被动分词在状态与将临结局之间的含混。
