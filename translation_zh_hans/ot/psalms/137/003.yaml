  yaml_path: translation/ot/psalms/137/003.yaml
  text: 'For there our captors asked us for words of song[a], and our tormentors for gladness: “Sing for us one of the songs of Zion.”'
translation:
  language: zh_hans
  text: 因为在那里，掳掠我们的人向我们索要歌声，折磨我们的人[a]要我们作乐：“给我们唱一首锡安的歌吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“嘲弄我们的人”。这里的希伯来语词较为罕见，可能着重指欺压折磨，也可能着重指讥讽嘲弄。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，说明被掳者把琴挂起、不愿歌唱的原因，保留原文的因果或解释作用。
- source_word: שָׁם
  choice: 在那里
  rationale: 按上下文指身处巴比伦之地，采用自然明确的处所表达。
- source_word: שְׁאֵלוּנוּ
  choice: 向我们索要
  rationale: 该动词在此表示向人要求某物；“索要”既符合被掳处境中的强制意味，也没有擅自增添明确的暴力方式。
- source_word: שׁוֹבֵינוּ
  choice: 掳掠我们的人
  rationale: 源自动词“掳去、俘获”，用关系短语准确表达身份，比单说“仇敌”更贴近原文。
- source_word: דִּבְרֵי שִׁיר
  choice: 歌声
  rationale: 原文直译为“歌的言语/歌词”；中文若作“索要歌的话语”生硬。“歌声”自然表达要求他们开口唱歌，并保留有声表演的含义。
- source_word: וְתוֹלָלֵינוּ
  choice: 折磨我们的人
  rationale: 该词罕见，可能指施加虐待、蹂躏的人，也可能突出讥嘲者；正文采用较符合被掳哀歌语境的“折磨我们的人”，并用脚注保留另一解释。
- source_word: שִׂמְחָה
  choice: 欢乐
  rationale: 指喜乐、欢娱；这里是掳掠者要求被掳者提供欢快娱乐。“欢乐”简洁自然，并保留这种尖锐反差。
- source_word: שִׁירוּ לָנוּ
  choice: 给我们唱
  rationale: 复数命令式加介词ל表示为听者演唱；“给我们唱”是现代汉语自然说法。
- source_word: מִשִּׁיר צִיּוֹן
  choice: 一首锡安的歌
  rationale: 介词מִן在此具部分意义，即从锡安的众歌中选一首；“一首”在中文中自然体现这一点。
