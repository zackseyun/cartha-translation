base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/009.yaml
  text: Blessed is the one who seizes and dashes your little ones against the rock[a].
translation:
  language: zh_hans
  text: 抓住你的婴孩，把他们摔碎在磐石上的人有福了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婴孩”也可译作“小孩子”；希伯来语指年幼的孩子。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 该复数形式在此作惯用的福祉宣告。“有福了”保留诗篇语体中庄重的评价意味，不弱化为一般的快乐或幸运。
- source_word: שֶׁיֹּאחֵז
  choice: 抓住……的，那人
  rationale: 关系词与动词共同指实施动作的人；“抓住”自然、直接，也保留原文动作的强烈感。
- source_word: וְנִפֵּץ
  choice: 把他们摔碎
  rationale: 该动词表示猛烈击碎；“摔碎”与“在磐石上”搭配自然，并如实呈现原文残酷的暴力意象，不加淡化。
- source_word: עֹלָלַיִךְ
  choice: 你的婴孩
  rationale: 该词指年幼、幼小的孩子；“婴孩”在现代汉语中简明自然，并准确传达其幼弱。附注保留稍宽的词义可能。
- source_word: אֶל הַסָּלַע
  choice: 在磐石上
  rationale: 介词在撞击类动词后表示受撞击的表面或目标；汉语用“摔碎在磐石上”自然地表达 against the rock。“磐石”保留诗歌的庄重语域。
theological_decisions:
- issue: 咒诅诗语境中 אַשְׁרֵי 的伦理与神学张力
  choice: 直接译为“那人有福了”，不作弱化或道德化解释。
  alternative: 可译“那人真幸运”或“那人快乐”，也可在正文中解释为报应正义。
  rationale: 原文明确以福祉宣告描述针对巴比伦的报复。译文应保留诗人在苦难中呼求报应的尖锐张力，而不把它改写为抽象地赞同个人残暴，也不在正文中替原文消解其困难。
translation_notes:
  register: 采用现代、庄重而直白的诗篇语体。句序把两个暴力动作前置，以“那人有福了”收束，既符合现代汉语，也凸显原文福祉宣告与残酷意象之间未经化解的张力。
