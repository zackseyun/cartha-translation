  yaml_path: translation/ot/psalms/137/005.yaml
  text: If I forget you[a], Jerusalem, may my right hand forget.
translation:
  language: zh_hans
  text: 耶路撒冷啊，我若忘记你，愿我的右手也忘记[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译得更明确：“愿我的右手忘记技巧。”希伯来文在这里省略了“忘记”的对象；“技巧”是根据上下文推知的，有些译本也采用这种理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出带有起誓和自我咒诅意味的条件句；“若”简洁、庄重，也符合诗歌语体。
- source_word: אֶשְׁכָּחֵךְ
  choice: 我忘记你
  rationale: שׁכח 的 Qal 未完成式第一人称单数，带第二人称阴性单数后缀；保留对耶路撒冷的直接称呼。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷啊
  rationale: 按现代汉语专名惯例译作“耶路撒冷”，并用“啊”明确呼语关系，使语序自然。
- source_word: תִּשְׁכַּח
  choice: 愿……忘记
  rationale: 第三人称阴性单数未完成式在此具有祈愿式、自我咒诅的功能；“愿”能传达誓言后果。
- source_word: יְמִינִי
  choice: 我的右手
  rationale: יָמִין 在这里通常指“右手”，也是弹奏等技能的执行器官；直译既清楚又保留意象。
theological_decisions:
- issue: 下半句省略宾语的自我咒诅
  choice: 愿我的右手也忘记
  alternative: 愿我的右手忘记技巧；愿我的右手被忘记
  rationale: 马所拉文本直译为“愿我的右手忘记”，没有明说所忘记的对象。正文保留这种简省和张力，不把由语境推知的“技巧”直接补入；脚注说明较明确的理解。“也”用于自然呈现两次“忘记”的对应，并未增添新的命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“耶路撒冷啊”前置以符合自然汉语呼语习惯；保留原文下半句的简省表达，并以脚注交代语境性补足。
