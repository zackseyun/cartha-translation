lexical_decisions:
- source_word: עַל
  choice: 在……上
  rationale: 表达器物悬挂于树上的空间关系，符合现代汉语习惯。
- source_word: עֲרָבִים
  choice: 杨柳树
  rationale: 该希伯来语树名可指柳树或杨树一类；“杨柳树”既保留词义范围，也形成自然、易懂的中文意象。另以脚注说明可能译法。
- source_word: בְּתוֹכָהּ
  choice: 城中
  rationale: 阴性单数后缀承接上一节的“巴比伦”，在此按其城市所指译为“城中”，自然简洁；不在本节重复城名。
- source_word: תָּלִינוּ
  choice: 我们把……挂
  rationale: 忠实表达 תלה 的 Qal 完成式第一人称复数，并采用现代汉语自然的把字句。
- source_word: כִּנֹּרוֹתֵינוּ
  choice: 我们的琴
  rationale: כִּנּוֹר 是古代弦乐器，较可能属于里拉琴一类；正文用普通读者易懂的“琴”，脚注补充更具体的乐器说明。
