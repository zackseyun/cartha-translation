  text: עַ֥ל נַהֲר֨וֹת בָּבֶ֗ל שָׁ֣ם יָ֭שַׁבְנוּ גַּם בָּכִ֑ינוּ בְּ֝/זָכְרֵ֗/נוּ אֶת צִיּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/001.yaml
  text: By the rivers of Babylon[a], there we sat down[b]; we also wept when we remembered Zion.
translation:
  language: zh_hans
  text: 在巴比伦的河边[a]，我们坐在那里；想起锡安时，我们也哭了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河边”也可译作“河流旁”或“溪流旁”。
    reason: lexical_alternative
  - marker: b
    text: 原文在“哭了”前有“也”一词；该词也可用来加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל נַהֲרוֹת
  choice: 在……的河边
  rationale: עַל与地理名词连用可表示“在……旁边”；נַהֲרוֹת通常指“河流”。合译为“在……的河边”，既准确又符合现代汉语习惯。
- source_word: בָּבֶל
  choice: 巴比伦
  rationale: 采用该地名通行的中文译名。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留原文明确的指示副词，强调流亡者身处巴比伦而非锡安。
- source_word: יָשַׁבְנוּ
  choice: 我们坐
  rationale: ישׁב可指“坐”或“居住”；在河边哀哭的语境中，“坐”更贴合具体场景，又不额外补入动作过程。
- source_word: גַּם בָּכִינוּ
  choice: 我们就哭了
  rationale: בכה表示哭泣；גַּם具有添加或强调作用。正文以“就”自然连接回想与哭泣，脚注说明也可按原文结构理解为“也哭了”，以保留该小词的真实歧义。
- source_word: בְּזָכְרֵנוּ
  choice: 一想起
  rationale: 介词בְּ加不定式结构在此具有时间并隐含因果关系；“一想起”自然表达回忆锡安时随即哭泣的情形。
- source_word: אֶת צִיּוֹן
  choice: 锡安
  rationale: אֶת为直接宾语标记，不单独翻译；保留专名“锡安”，不释作“耶路撒冷”，以保存原文的地理及诗歌神学意蕴。
theological_decisions:
- issue: צִיּוֹן的译法
  choice: 锡安
  alternative: 耶路撒冷
  rationale: 原文明确使用“锡安”；保留此名可保存它在诗篇中的盟约、圣城与故土意蕴，避免用较宽泛的地名替换。
- issue: גַּם与哭泣分句的关系
  choice: 正文译为“一想起锡安，我们就哭了”，脚注保留“也哭了”的可能
  alternative: 我们也哭了，因为想起锡安
  rationale: גַּם可表示添加或强调，而希伯来诗句的分句关系并非完全单一。正文采用自然汉语表达时间—因果联系，脚注保留较形式对应的添加语气，避免把句法关系绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在巴比伦的河边”保留诗歌意象；分号再现两个紧密相连的动作。“一想起……就……”便于普通读者理解，同时借脚注保存原文גַּם的添加或强调作用及分句歧义。
