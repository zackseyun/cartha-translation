  text: מִ/פִּ֤י עֽוֹלְלִ֨ים וְֽ/יֹנְקִים֮ יִסַּ֪דְתָּ֫ עֹ֥ז לְמַ֥עַן צוֹרְרֶ֑י/ךָ לְ/הַשְׁבִּ֥ית א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/002.yaml
  text: From the mouths of infants and nursing babies you have established strength because of your foes[a], to silence the enemy and the avenger.
translation:
  language: zh_hans
  text: 你从婴孩和吃奶的孩子口中建立了力量[a]，因你的仇敌的缘故，使仇敌和报复的人止息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赞美”。七十士译本作“赞美”，《马太福音》21:16也反映这一译法；希伯来文本作“力量”。
    reason: 说明希伯来文本“力量”与七十士译本及《马太福音》21:16所反映的“赞美”之间具有经文互涉意义的不同译法。
lexical_decisions:
- source_word: מִפִּי
  choice: 从……的口中
  rationale: 保留介词“从”及“口”的具体意象；汉语用“从……的口中”自然表达言语由此发出。
- source_word: עוֹלְלִים
  choice: 婴孩
  rationale: 指年幼的孩子；“婴孩”简明、庄重，也能与后面的吃奶者相配。
- source_word: וְיֹנְקִים
  choice: 和吃奶孩子
  rationale: 该分词具体指仍在吃奶的人；此译法保留动作意象，且避免古旧表达。
- source_word: יִסַּדְתָּ
  choice: 你……建立了
  rationale: יסד的基本义是奠基、建立；与“力量”搭配虽具有诗意张力，却忠实保留原文隐喻。
- source_word: עֹז
  choice: 力量
  rationale: 希伯来文本的通常含义是力量、能力；主文据此直译，不以希腊传统的“赞美”取代。
- source_word: לְמַעַן צוֹרְרֶיךָ
  choice: 为要对付你的敌对者
  rationale: למען在此可表达目的或缘由；结合后续目的不定式，译为“为要对付”较自然，并保留针对敌对者而行动的含义。
- source_word: לְהַשְׁבִּית
  choice: 使……止息
  rationale: 使役式不定词意为使之停止、止息；此译法不限定究竟是使其言语沉默还是使其行动终止。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 单数名词在此可作集合性或代表性用法；汉语“仇敌”无需强加单复数。
- source_word: וּמִתְנַקֵּם
  choice: 和报复者
  rationale: 分词指实施或寻求报复的人；“报复者”简洁保留其主动角色，不预先判断其报复是否正当。
theological_decisions:
- issue: 希伯来文עֹז与七十士译本及《马太福音》21:16所反映的“赞美”
  choice: 主文译作“力量”
  alternative: 赞美
  rationale: 马所拉文本明确为עֹז，通常意为“力量、能力”。按原文优先原则，主文保留希伯来文读法；希腊传统具有重要的经文互涉意义，因此列入脚注，而不取代主文。
- issue: “使……止息”所指的方式
  choice: 保留宽泛的“使仇敌和报复者止息”
  alternative: 使仇敌和报复者闭口无言
  rationale: שׁבת的使役式基本义是“使停止”。上下文与“口”可能引出“使沉默”的理解，但原文本身未明确限定为言语，因此不在主文中收窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吃奶孩子”保留具体生活图景；“建立了力量”刻意保留希伯来诗句不寻常的搭配及其神学张力。脚注标记[a]已置于主文相应词后。
