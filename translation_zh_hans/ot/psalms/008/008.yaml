  yaml_path: translation/ot/psalms/008/008.yaml
  text: the birds of the heavens[a], and the fish of the sea[b], whatever passes along the paths of the seas.
translation:
  language: zh_hans
  text: 天空的飞鸟、海里的鱼，以及一切游经海洋[b]路径的生物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生物”为按语境补出。原文直译为“那游经海洋路径的”，其中分词是单数，也可按集合意义理解为修饰前面的鱼类。
    reason: lexical_alternative
  - marker: b
    text: “海洋”原文为复数，可直译为“众海”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צִפּוֹר שָׁמַיִם
  choice: 天空的飞鸟
  rationale: צִפּוֹר在形态上是单数，但在这里作集合名词，与受人治理的各类动物并列；译作“飞鸟”自然且保留诗意。“天空”准确表达שָׁמַיִם在此指鸟类活动的天域，现代读者也容易理解。
- source_word: וּדְגֵי הַיָּם
  choice: 海里的鱼
  rationale: 该结构直译为“海的鱼”；“海里的鱼”符合现代汉语习惯，并以集合意义表达鱼类。
- source_word: עֹבֵר
  choice: 一切游经……的生物
  rationale: 该阳性单数分词可作集合性概括，也可能承接前面的鱼类。正文用“一切……的生物”传达其概括作用；脚注保留其单数形式及句法歧义。
- source_word: אָרְחוֹת
  choice: 路径
  rationale: 该词表示道路、路径或行迹；“路径”保留海中仿佛有通道的诗歌意象。
- source_word: יַמִּים
  choice: 海洋
  rationale: 原文为复数“众海”。正文以汉语集合词“海洋”自然表达其广阔范围，并在脚注中注明数的形式。
theological_decisions:
- issue: עֹבֵר与前文“海里的鱼”的句法关系
  choice: 译为概括海中生物的“一切游经……的生物”
  alternative: 译为直接修饰鱼类的“游经海洋路径的鱼”
  rationale: 原文单数分词既可集合性地承接鱼类，也可视为对海中活动者的概括。正文不把它限制为某一种海洋生物，脚注则明确保留另一种理解，避免对人类治理范围作额外的神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“飞鸟”“路径”保留原诗的形象；标点呈现并列列举。正文适度补出“生物”以使孤立经节在汉语中完整，同时用脚注明示补词及原文的句法歧义。
