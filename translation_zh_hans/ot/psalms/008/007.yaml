  text: sheep and oxen[a], all of them, and also the beasts of the field.
translation:
  language: zh_hans
  text: 所有的羊群和牛群，以及田野的走兽。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹנֶה
  choice: 羊群
  rationale: 该词统指小型家畜群，尤其是绵羊和山羊。译作“羊群”既保留集合含义，也符合诗歌中与“牛群”并列的自然表达。
- source_word: וַאֲלָפִים
  choice: 和牛群
  rationale: 该词指家养的牛类；“牛群”比“公牛”或“耕牛”涵盖更广，并与“羊群”形成整齐自然的对应。
- source_word: כֻּלָּם
  choice: 所有的
  rationale: 原文明确强调前述羊群和牛群无一例外。汉语把“所有的”置于并列名词之前，能自然表达这一总括语气。
- source_word: וְגַם
  choice: 以及
  rationale: 原文以连接词和附加词把范围由家畜扩展至田野动物；“以及”简洁而清楚地保留递加关系。
- source_word: בַּהֲמוֹת
  choice: 走兽
  rationale: 此处结合“田野”泛指陆地上的野生动物。“走兽”具有适度的诗意，也能避免将该词误解为前面已经提到的家畜。
- source_word: שָׂדָי
  choice: 田野的
  rationale: 该词表示田野或开阔之地；“田野的走兽”自然保留原文关于非家养动物栖居之地的诗歌意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。通过“羊群和牛群”呈现两类家畜，以“田野的走兽”与之区别；语序略按自然汉语调整，同时保留“所有”所表达的全面强调。
