source:
  edition: WLC
  text: יְהוָ֥ה אֲדֹנֵ֑י/נוּ מָֽה אַדִּ֥יר שִׁ֝מְ/ךָ֗ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/009.yaml
  text: O Yahweh[a], our Lord[b], how majestic is your name in all the earth!
translation:
  language: zh_hans
  text: 雅威[a]——我们的主啊，你的名在全地何其威严[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“YHWH”（יהוה）；也可按传统译作“耶和华”或“上主”。
    reason: 说明四字神名的原文形式，并保留中文传统译名。
  - marker: b
    text: “威严”也可译作“宏伟”或“卓越”。
    reason: 保留 אַדִּיר 在此处的词义范围。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名“耶和华”译出四字神名 YHWH；脚注说明其希伯来文形式及另一种音译，以免把专名与随后表示主权的称号混同。
- source_word: אֲדֹנֵינוּ
  choice: 我们的主
  rationale: 该词由表示主权、权柄的“主”与第一人称复数领属后缀构成；“我们的主”既准确又符合中文敬拜用语。
- source_word: מָה
  choice: 何其
  rationale: 此处 מָה 引出赞叹句，并非询问；“何其”自然传达强烈赞叹，也保持诗歌的庄重语体。
- source_word: אַדִּיר
  choice: 威严
  rationale: 该词在此表达宏伟、尊荣和令人敬畏的卓越；“威严”比单纯的“强大”更能体现诗篇语境中的崇高气象，同时保留“何等卓越”等词义可能。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 直译为“你的名”，保留希伯来文中“名”所承载的声誉、尊荣与启示身份，不在正文中扩展解释。
- source_word: בְּכָל הָאָרֶץ
  choice: 在全地
  rationale: 本诗视野遍及受造世界，因此 הָאָרֶץ 在此译作“全地”，而不是可能带有地域局限的“全境”或“全地界”。
theological_decisions:
- issue: 神名与称号 יְהוָה אֲדֹנֵינוּ 的连续表达
  choice: 耶和华——我们的主啊
  alternative: 雅威——我们的主啊；上主——我们的主啊
  rationale: 原文先用 YHWH 这一专名，随后用“我们的主”这一称号直接呼求。正文采用中文通行的“耶和华”，并以破折号清楚呈现同位呼语，既不把二者合并，也不削弱专名与主权称号之间的区别。
- issue: אַדִּיר 的赞叹含义
  choice: 何其威严
  alternative: 何其卓越；何其宏伟
  rationale: “威严”体现神之名在全地彰显的崇高与尊荣，但该词也可强调卓越或宏伟，因此以脚注保留词义幅度，不将经文限定为单一神学解释。
translation_notes:
  register: 采用现代、庄重而可诵读的诗歌语言。“何其”准确表达赞叹语气；破折号标明“耶和华”与“我们的主”是连续的直接呼语。正文简洁，适合诗篇首尾呼应的结构。
