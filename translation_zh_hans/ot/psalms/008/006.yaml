  text: תַּ֭מְשִׁילֵ/הוּ בְּ/מַעֲשֵׂ֣י יָדֶ֑י/ךָ כֹּ֝ל שַׁ֣תָּה תַֽחַת רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/006.yaml
  text: You made him rule over the works of your hands[b][a]; you put everything under his feet.
translation:
  language: zh_hans
  text: 你使他统管你手所造之物[a]；你把万物都放在他脚下。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你赐他权柄管理你手所造之物。”
    reason: lexical_alternative
  - marker: b
    text: 本节的“他”承接上节希伯来文的阳性单数表达，以个体形式代表人类。
    reason: cultural_note
lexical_decisions:
- source_word: תַּמְשִׁילֵהוּ
  choice: 你使他统管
  rationale: 使役式表达“使某人治理、掌管”。“使他统管”既保留使役含义，也自然表达其治理范围。
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: 你手所造的
  rationale: 保留“手”的具体拟人意象，同时用现代汉语自然表达“你双手的工作/作品”。
- source_word: כֹּל
  choice: 万物都
  rationale: 此处绝对用法的“全、一切”在上下文中概括受造之物；“万物都”既体现全面性，又符合诗歌语体。
- source_word: שַׁתָּה
  choice: 你把……放在
  rationale: 该动词意为放置、安放；此译法直白自然，并与后面的方位短语顺畅衔接。
- source_word: תַחַת רַגְלָיו
  choice: 在他脚下
  rationale: 保留希伯来文“脚下”的具体图像，也保留置于权下、使之顺服的含义。
theological_decisions:
- issue: 诗篇第8篇以阳性单数指称人类代表
  choice: 保留单数阳性代词“他”
  alternative: 他们；世人……他们脚下
  rationale: 希伯来文承接前文，使用阳性单数形式，代表性地指向人类。正文保留这一语法特征，并以脚注说明其涵盖意义。
- issue: 治理权的表达
  choice: 译作“使他统管”
  alternative: 赐他权柄管理；使他治理
  rationale: 此译法保留使役式的语义，表明治理地位由上帝设立，同时不过度增添原文以外的神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“统管”凝练地表达治理范围；保留“你手所造的”和“在他脚下”的诗性意象。脚注标记均置于正文相关位置。
