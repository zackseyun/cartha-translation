  text: וַ/תְּחַסְּרֵ֣/הוּ מְּ֭עַט מֵ/אֱלֹהִ֑ים וְ/כָב֖וֹד וְ/הָדָ֣ר תְּעַטְּרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/005.yaml
  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
translation:
  language: zh_hans
  text: 你使他只比上帝低一点[a]，又用荣耀和尊荣为他加冕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天上的众灵”；七十士译本作“天使”，《希伯来书》2:7也采用这一译法。
    reason: 保留希伯来词 אֱלֹהִים 的可能含义，并说明具有正典意义的古希腊译法。
lexical_decisions:
- source_word: וַתְּחַסְּרֵהוּ
  choice: 你使他……低
  rationale: 使役式在这里表示使某人处于较低的地位；结合后面的比较结构，译为“使他……低”自然且贴近原文。
- source_word: מְּעַט
  choice: 只……一点
  rationale: 此处最自然地表示程度很小，而非时间短暂；“只……一点”清楚表达轻微的等级差距。
- source_word: מֵאֱלֹהִים
  choice: 比上帝
  rationale: אֱלֹהִים 在此可有歧义，但希伯来文本最直接可理解为“上帝”；“天上的众灵”和七十士译本的“天使”保留在脚注中。
- source_word: וְכָבוֹד
  choice: 荣耀
  rationale: כָבוֹד 可指荣耀、尊贵；“荣耀”符合诗歌的庄重语体。
- source_word: וְהָדָר
  choice: 尊荣
  rationale: הָדָר 可指威荣、华美、尊荣；“尊荣”与“荣耀”并列，表达获赐的高贵地位而不完全重复。
- source_word: תְּעַטְּרֵהוּ
  choice: 赐给他……作冠冕
  rationale: 该词表达加冠或环绕；此译保留王权与加冕意象，并让中文搭配自然。
theological_decisions:
- issue: 单数代词所指及其代表性
  choice: 保留单数“他”
  alternative: 他们；人类
  rationale: 希伯来文使用阳性单数代词，承接上文具有代表意义的“人／人子”。保留“他”既忠于语法，也不把其代表全人类的含义明说死。
- issue: אֱלֹהִים 的译法
  choice: 上帝
  alternative: 天上的众灵；天使
  rationale: 依原文优先原则，正文采用希伯来文最直接的读法“上帝”；同时以脚注保留词义歧义，以及七十士译本和《希伯来书》所见的“天使”传统。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“只比……低一点”表达程度比较；“赐给他荣耀和尊荣作冠冕”保留加冕意象，并维持诗句的节奏与尊贵语气。
