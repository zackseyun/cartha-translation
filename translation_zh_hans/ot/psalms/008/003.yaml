  text: כִּֽי אֶרְאֶ֣ה שָׁ֭מֶי/ךָ מַעֲשֵׂ֣י אֶצְבְּעֹתֶ֑י/ךָ יָרֵ֥חַ וְ֝/כוֹכָבִ֗ים אֲשֶׁ֣ר כּוֹנָֽנְתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/003.yaml
  text: When I look at your heavens[a], the work of your fingers, the moon and the stars, which you have set in place—
translation:
  language: zh_hans
  text: '当[a]我观看你手指所造的诸天，

    和你所安置的月亮和星辰——'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因为我观看你手指所造的诸天，和你所安置的月亮和星辰——”。
    reason: “当”按上下文将 כִּי 译为引出下一节发问的情境；该连词也可带有说明或因由意味。
lexical_decisions:
- source_word: כִּי
  choice: 当
  rationale: 这里引出诗人随后发问时所处的情境；“当”与下一节衔接自然，同时保留该连词在语境中可能具有的因由意味。
- source_word: אֶרְאֶה
  choice: 我观看
  rationale: ראה在此表示有意识地观察；“观看”比单纯的“看见”更能体现凝望思量，又不显古奥。
- source_word: שָׁמֶיךָ
  choice: 你的诸天
  rationale: 保留希伯来文的复数形式和第二人称所属关系，也维持诗歌宏阔、崇高的宇宙意象。
- source_word: מַעֲשֵׂי אֶצְבְּעֹתֶיךָ
  choice: 你指头所造的
  rationale: 保留“指头”这一拟人化意象；以“所造的”自然承接“诸天”，表达它们是上帝的作品。
- source_word: יָרֵחַ וְכוֹכָבִים
  choice: 月亮和星辰
  rationale: “月亮”是现代汉语常用词，“星辰”则与本诗庄重的诗体相称。
- source_word: אֲשֶׁר
  choice: ……的
  rationale: 将关系代词转化为自然的汉语定中结构“你安置的月亮和星辰”。
- source_word: כּוֹנָנְתָּה
  choice: 你安置的
  rationale: כון的Polel形在此可指设立、使稳固或安排就位；“安置”简洁表达天体被安排在其位置上的意思。
theological_decisions:
- issue: 上帝创造行动的拟人化表达
  choice: 保留“你指头”
  alternative: 你的手工／你所造的
  rationale: 原文以“指头”表现创造行动的亲近与从容。保留这一诗歌意象，并不额外主张上帝具有物质身体。
- issue: כִּי在本节中的逻辑关系
  choice: 译作情境性的“当”
  alternative: 因为／原来我观看
  rationale: “当”最自然地引向下一节的疑问，但原词也可能具有说明原因的功能，因此不把“因为”视为不可能的读法。
translation_notes:
  register: 采用现代、庄重而可懂的诗体。“诸天”和“星辰”保留经诗传统的崇高感；破折号表示本节句法尚未完结，并引向下一节。
