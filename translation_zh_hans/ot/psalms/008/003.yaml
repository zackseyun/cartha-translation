  naturalness: “诸天”“月亮和星辰”适合现代庄重诗体，但应将“手指所造的”明确作“诸天”的定语。改为并列宾语结构后自然、清楚，也保有原文的诗歌节奏。
  terminology: 保留“诸天”以对应שמים的复数及诗歌宇宙意象；以“手指”保留原文拟人化的“手指”意象；“安置”恰当表达כון在此的设立、安排之义。
  issues:
