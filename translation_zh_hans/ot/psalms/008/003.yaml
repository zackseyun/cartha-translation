revisions:
- from: '当我观看你的诸天——你指头所造的，

    以及你安置的月亮和星辰——'
  to: '当[a]我观看你手指所造的诸天，

    和你所安置的月亮和星辰——'
  rationale: 修订仅解决汉语中“所造的”悬置及并列对象不清的问题。将“手指所造的”前置为“诸天”的定语，既保留原文“手指”的拟人化诗歌形象，也避免把“作品”误增为独立名词；“安置”保留为对月亮和星辰的关系从句。句末破折号保留，以反映本节在语法和意义上继续至下一节。
