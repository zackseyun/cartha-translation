  yaml_path: translation/ot/psalms/008/001.yaml
  text: O Yahweh[a], our Lord[c][b], how majestic is your name in all the earth—you have set your splendor above the heavens.
translation:
  language: zh_hans
  text: 雅威，我们的主啊，你的名在全地何其威严！你把你的荣光置于诸天之上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 此处希伯来文动词的语法解读有争议；也可理解为祈愿或命令：“愿你将你的荣光置于诸天之上。”
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的中文音译呈现四字神名，保留原文直接称呼上帝之名的特点。
- source_word: אֲדֹנֵינוּ
  choice: 我们的主啊
  rationale: אֲדוֹן带第一人称复数词尾，意为“我们的主”；加“啊”自然体现诗歌中的直接呼告。
- source_word: מָה אַדִּיר
  choice: 何其威严
  rationale: מָה在此构成感叹，אַדִּיר表达强大、尊荣和威严；“何其威严”兼顾诗意与敬拜语境。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 直译其希伯来语表达，保留“名”所承载的身份、声誉和彰显等丰富内涵，不在正文中加以解释。
- source_word: בְּכָל הָאָרֶץ
  choice: 在全地
  rationale: 与下句“诸天”构成宇宙性的呼应；“全地”简洁庄重，也避免将 הָאָרֶץ 限缩为某一片土地。
- source_word: הוֹדְךָ
  choice: 你自己的荣光
  rationale: הוֹד可指尊荣、威荣或荣光；选“荣光”自然表达上帝显赫灿烂的尊荣。“自己的”明确第二人称所属关系，并使现代汉语流畅。
- source_word: עַל הַשָּׁמָיִם
  choice: 于诸天之上
  rationale: עַל在此最自然地表达超越、高于的空间意象；“诸天”保留 הַשָּׁמָיִם 的诗歌和宇宙语域。
- source_word: תְּנָה
  choice: 置
  rationale: 该形式按马所拉文本通常可分析为命令式，但在本句中的句法和含义存在困难；正文依上下文采用陈述式“置于”，脚注保留祈愿或命令式的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；以“主”代称
  rationale: 原文明确使用四字神名；音译“雅威”可与紧接的称号“我们的主”区分，也不把专名改作称号。
- issue: תְּנָה 的语气与时态
  choice: 陈述为“你把自己的荣光置于诸天之上”
  alternative: 祈愿或命令：“愿你将自己的荣光置于诸天之上”
  rationale: 马所拉辅音及元音形式带有命令式表象，但诗句常被理解为对上帝既有威荣的宣告。正文采用符合上下文赞美语气的陈述式，同时以脚注保存原文形态所容许的另一理解，避免消除文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“何其威严”保留感叹力度；破折号分开神名与称号，避免连续呼语显得生硬。末句维持简洁，不在正文中替原文的语法歧义作过度解释。
