source:
  edition: WLC
  text: מָֽה אֱנ֥וֹשׁ כִּֽי תִזְכְּרֶ֑/נּוּ וּ/בֶן אָ֝דָ֗ם כִּ֣י תִפְקְדֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/004.yaml
  text: What is man that you remember him[c][b][a], and the son of man that you attend to him?
translation:
  language: zh_hans
  text: 人算什么，你竟记念他[a]？人子[b]算什么，你竟眷顾[c]他？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”所译的希伯来词常含脆弱、必死之人的意味，也可译作“凡人”。
    reason: lexical_alternative
  - marker: b
    text: “人子”在这里是希伯来语中指人的表达，与上句“人”平行。后来的圣经用法中，这个称呼可以具有弥赛亚意义；但在本诗中，它首先泛指人类。
    reason: cross_reference
  - marker: c
    text: “眷顾”也可译作“察看”、“探访”或“留意”；原词可表示主动关注、看顾或介入。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: 算什么
  rationale: 希伯来文以“什么”引出反问，强调人在浩瀚受造界中的微小；“算什么”是现代汉语中自然、有力的对应表达。
- source_word: אֱנוֹשׁ
  choice: 人
  rationale: 该词指人，并常带有脆弱、必死之人的意味。“人”保留单数代表性，也与下句“人子”形成诗歌平行；其脆弱意味在脚注说明。
- source_word: כִּי
  choice: 竟
  rationale: 两处 כִּי 引出反问所惊叹的内容。汉语用“竟”比直译为“以致”或“因为”更自然，也准确传达人在微小与上帝关注之间的强烈反差。
- source_word: תִזְכְּרֶנּוּ
  choice: 你竟记念他
  rationale: זכר 的基本义是记得、记念；这里不是单指回忆，而是持续将人放在心上。“记念”简洁庄重，并保留原词意象。
- source_word: וּבֶן־אָדָם
  choice: 人子
  rationale: 直译保留希伯来诗歌的单数表达、与“人”的平行关系及经文之间的呼应；脚注说明此处是泛指人类的习语，避免把它在本诗中直接限定为弥赛亚称号。
- source_word: תִפְקְדֶנּוּ
  choice: 你竟眷顾他
  rationale: פקד 可表示察看、探访、关注或照料。上下文强调上帝对人的关注，“眷顾”在汉语中自然且符合语境，同时以脚注保留原词较宽的语义范围。
theological_decisions:
- issue: 代表全人类的阳性单数表达
  choice: 正文采用“人”和“人子”
  alternative: 凡人；世人；人类
  rationale: 希伯来文以阳性单数代表人类，且两句构成严整平行。中文“人”本身可泛指男女；“人子”则保留原文形象与单数形式。
- issue: “人子”在本节是否应明确译作弥赛亚称号
  choice: 按诗篇当前语境理解为泛指人类，不加专名化标记
  alternative: 通过特殊称号形式明确指向弥赛亚
  rationale: 本节首先论述人在上帝面前的微小及上帝对人的看顾。后来的经文可赋予这段话基督论意义，但本诗此处并未要求译文预先排除其一般人类含义。
- issue: פקד 所表达的上帝行动性质
  choice: 正文译为带正面语境色彩的“眷顾”，脚注保留其他可能义项
  alternative: 察看他；探访他；留意他
  rationale: 本诗上下文谈到上帝赐给人的尊荣和治理责任，正面关怀最符合当前语境；不过该动词本身语义宽广，不宜声称“眷顾”穷尽其含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两句均以“算什么……竟……”构成平行反问，既贴合希伯来句法功能，也保留惊叹语气。“记念”和“眷顾”略带经文语体，但在现代汉语中仍清楚自然。
