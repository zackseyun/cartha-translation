  text: For the choir director[a]; according to the Gittith[c][b]. A psalm of David.
translation:
  language: zh_hans
  text: 交给乐长，按“吉提特”[a]：大卫的诗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吉提特”是希伯来语的音译，可能是曲调名、乐器名或礼仪用语，确切含义不明。
    reason: cultural_note
  - marker: b
    text: “大卫的诗”也可理解为“大卫所作的诗”“献给大卫的诗”或“与大卫有关的诗”；希伯来语可表示作者身份或其他归属关系。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 在诗篇题注中，这个词通常指负责组织或指导音乐演奏的人。“乐长”简洁庄重，也符合敬拜音乐的语境；“交给”则自然表达前缀 לַ־ 所指的对象。
- source_word: עַל
  choice: 按
  rationale: 这里很可能引出曲调、乐器或其他演奏指示。“按”能表达依照某种音乐标记来演唱或演奏，同时不限定其确切性质。
- source_word: הַגִּתִּית
  choice: “吉提特”
  rationale: 此词的确切所指不明，可能是曲调名、乐器名或礼仪用语。采用音译可避免武断地译成某一种解释。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇题注中的体裁名称，指配合音乐的诗歌；中文以“诗”表达简洁自然，并符合《诗篇》的文体。
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: לְ־ 可表示作者、归属、关联或献予。“大卫的诗”保留一定弹性，并由脚注说明其可能含义，避免在正文中把作者问题定得过窄。
theological_decisions:
- issue: לְדָוִד 所表达的大卫与本诗的关系
  choice: 大卫的诗
  alternative: 大卫所作的诗；献给大卫的诗；与大卫有关的诗
  rationale: 希伯来语题注没有明确限定 לְ־ 在此只表示作者身份。正文采用自然的传统表达，脚注保留作者、归属或关联等可能性。
- issue: הַגִּתִּית 的音乐或礼仪性质
  choice: 音译为“吉提特”
  alternative: 迦特调；迦特乐器；酒榨曲
  rationale: 原词含义不确定。音译不把尚无定论的音乐术语解释成特定曲调、乐器或其他事物。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇题注语体。“乐长”比“合唱指挥”涵盖面更广，不预设只有合唱；“吉提特”保留原文术语的不确定性。分号连接受交者与演奏指示，句号则将体裁及归属说明分开。
