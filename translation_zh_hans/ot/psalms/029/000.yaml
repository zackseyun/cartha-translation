base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/000.yaml
  text: A psalm of David. Ascribe to Yahweh[a], sons of the mighty, ascribe to Yahweh glory and strength.
translation:
  language: zh_hans
  text: '大卫的诗。


    归给耶和华，神的众子啊；归给耶和华荣耀和能力。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: 大卫的诗
  rationale: 按诗篇标题的常用表达直译；לְ 可表示作者、归属或关联，简洁译法不额外限定其确切关系。
- source_word: הָבוּ
  choice: 要归给
  rationale: 该命令式在此意为承认并归给耶和华本有的荣耀与能力；保留原文两次重复的劝令。
- source_word: בְּנֵי אֵלִים
  choice: 神的众子
  rationale: 较直接地保留“众子”意象以及 אֵלִים 可指神明、大能者或天上存在者的语义张力，并以脚注列出主要理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，不用通称“主”取代。
- source_word: כָּבוֹד וָעֹז
  choice: 荣耀和能力
  rationale: 分别对应“分量、尊荣、荣耀”与“力量、能力”，在本句中采用自然且庄重的搭配。
theological_decisions:
- issue: בְּנֵי אֵלִים 所指对象
  choice: 正文译作“神的众子”，保留天上存在者的群体意象
  alternative: “大能者的众子”或“天上的众生”
  rationale: 原文很可能指天上议会中的成员，但词组本身容许不同分析；正文不把它改释成人间权贵或特定种类的天使。
- issue: “归给耶和华”是否表示耶和华从受命者获得能力
  choice: 保留原文“归给”的礼仪性表达
  alternative: 意译为“承认耶和华有荣耀和能力”
  rationale: 这里是呼吁受命者宣认、尊崇耶和华本有的荣耀和能力，并非暗示这些属性由他们赋予；直译可保留诗句的修辞力度。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留原文连续两次“要归给耶和华”的平行结构，并把标题独立成行，以符合诗篇排版习惯。
