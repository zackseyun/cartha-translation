source:
  edition: WLC
  text: יְ֭הוָה לַ/מַּבּ֣וּל יָשָׁ֑ב וַ/יֵּ֥שֶׁב יְ֝הוָ֗ה מֶ֣לֶךְ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/010.yaml
  text: Yahweh sat enthroned over the flood[a]; Yahweh sits enthroned as King forever.
translation:
  language: zh_hans
  text: 耶和华坐在洪水之上掌权[a]；耶和华坐着为王，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洪水”也可能特指挪亚时代的“大洪水”。
    reason: 保留מַבּוּל在本节中可能指向创世记大洪水的典故，同时不排除诗篇风暴语境中的一般洪水或混沌众水意象。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法“耶和华”，在正文中明确呈现专名，与普通称号“主”区分。
- source_word: לַמַּבּוּל
  choice: 在洪水之上
  rationale: מַבּוּל指洪水或大洪水；介词ל与表示坐下、居位的יָשַׁב连用，可表达所处范围或相关位置。译作“在洪水之上”既保留空间意象，也自然传达耶和华凌驾于洪水之上的主权。
- source_word: יָשָׁב
  choice: 坐在……掌权
  rationale: 基本义是“坐”，在君王语境中含登座掌权的意味。中文以“坐在……之上掌权”保留坐席意象，同时显明王权语境。
- source_word: וַיֵּשֶׁב
  choice: 坐着为王
  rationale: 该形式承接前句，而לְעוֹלָם表明持续性。译作“坐着为王”保留与前句重复的“坐”以及恒久统治的含义，不强行把动词时态限定为过去或现在。
- source_word: מֶלֶךְ
  choice: 为王
  rationale: מֶלֶךְ在此表明王者身份；“为王”是自然庄重的现代中文表达，并与“坐着”共同呈现登座统治的图景。
- source_word: לְעוֹלָם
  choice: 直到永远
  rationale: 清楚表达持续无尽的时间，符合现代中文圣经文体。
theological_decisions:
- issue: מַבּוּל是特指挪亚时代的大洪水，还是泛指洪水或汹涌水势
  choice: 正文译作“洪水”，不直接注明挪亚
  alternative: 译作“大洪水”，特指挪亚时代的洪水
  rationale: 该词在希伯来圣经其他用例中与挪亚洪水密切相关，但本诗紧接风暴与众水的语境。正文采用不加限定的“洪水”，让挪亚洪水的可能典故与当前诗篇中的混沌水势意象同时保留；脚注说明特指的可能性。
- issue: 两次יָשַׁב的时间与体貌关系
  choice: 首句“坐在……掌权”，次句“坐着为王，直到永远”
  alternative: 两句都明确译为过去时，或把第二句明确译为现在时
  rationale: 希伯来语先用完成式，随后用带ו的未完成式；其关系可理解为叙事承接，也可强调由洪水时彰显并持续到永远的王权。中文不必强加英语式时态对比，借“直到永远”自然表达持续性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“坐在……之上掌权”保留希伯来文坐席图像并补足其王权含义；“坐着为王”与前句形成诗意复沓。正文脚注标记[a]已在相应词语后出现。
