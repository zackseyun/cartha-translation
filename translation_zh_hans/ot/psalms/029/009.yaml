base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/009.yaml
  text: The voice of Yahweh makes the deer give birth and strips the forests bare[a], and in his temple all say[b], “Glory!”
translation:
  language: zh_hans
  text: 耶和华的声音使母鹿分娩[a]，使森林尽都裸露；在他的殿[b]中，众人都说：“荣耀！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使母鹿扭动”，或“使母鹿因产痛而扭动”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语“殿”既可指“圣殿”，也可指“王宫”。
    reason: alternative_reading
lexical_decisions:
- source_word: ק֤וֹל יְהוָ֨ה
  choice: 耶和华的声音
  rationale: 按希伯来语领属结构直译；以现代中文圣经语体通行的“耶和华”表达神名。
- source_word: יְחוֹלֵ֣ל אַיָּלוֹת֮
  choice: 使母鹿分娩
  rationale: חול可指扭动、阵痛或生产；אַיָּלוֹת特指雌鹿。“使母鹿分娩”在中文中自然，并准确呈现这一常见语境义，其他可能含义收入脚注。
- source_word: וַֽיֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת
  choice: 使森林尽都裸露
  rationale: חשׂף意为剥去遮蔽、使之显露；此译保留暴风威力造成森林被剥光的鲜明意象。
- source_word: וּבְהֵיכָלוֹ
  choice: 在他的殿中
  rationale: הֵיכָל既可指圣殿，也可指王宫；“殿”在中文中能自然承载敬拜场景，并在一定程度上保留两义，脚注予以说明。
- source_word: כֻּלּוֹ אֹמֵר
  choice: 一切都说
  rationale: כֻּלּוֹ具有集合意义，אֹמֵר虽为单数形式，也可与之构成集合性表达。“一切都说”既贴近形式，也保留所指究竟是众人还是殿中万有的诗性开放性。
- source_word: כָּבֽוֹד
  choice: 荣耀！
  rationale: 以单词感叹句表达敬拜中的欢呼，保留כבוד在赞美语境中的分量。
theological_decisions:
- issue: הֵיכָל指圣殿还是王宫
  choice: 正文采用可兼有“圣殿”与“宫殿”色彩的“殿”
  alternative: 明确译为“圣殿”或“王宫”
  rationale: 诗中的敬拜欢呼支持圣殿之义，而全诗对耶和华君王身份的强调也容许王宫之义；使用“殿”并加脚注，避免消除原文张力。
- issue: כֻּלּוֹ所指的范围
  choice: 一切
  alternative: 众人
  rationale: 原文的集合表达可理解为殿中所有人，也可呈现殿中一切共同宣告的诗性图景；“一切”不把这一开放性限缩为仅指人。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保持诗句的并行结构与风暴意象；“分娩”“尽都裸露”清楚易懂而不过分口语化。
