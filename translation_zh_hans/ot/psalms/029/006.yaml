  text: He makes Lebanon skip like a calf[c][b][a], and Sirion like a young wild ox.
translation:
  language: zh_hans
  text: 他使黎巴嫩像牛犊一样跳跃，使西连[a]像小野牛一样跳跃。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西连”是黑门山的另一个名称。
    reason: cross_reference
  - marker: b
    text: 或译：“像幼小的野牛。”希伯来文直译为“像野牛之子”，是指野牛的幼崽。
    reason: lexical_alternative
  - marker: c
    text: 另有较贴近希伯来文词序的译法：“他使它们像牛犊一样跳跃——黎巴嫩和西连像小野牛一样。”这种译法保留原文先用“它们”、后列出地名的表达；正文则按诗歌的平行关系补出省略的动词。
    reason: previous_rendering
lexical_decisions:
- source_word: וַיַּרְקִידֵם
  choice: 他使……跳跃
  rationale: רקד 的使役式表达“使……跳跃”。“跳跃”自然地呈现牛犊和幼年野牛活泼跃动的诗歌意象；第三人称复数后缀“它们”在下文由“黎巴嫩”和“西连”具体说明。
- source_word: כְּמוֹ עֵגֶל
  choice: 像牛犊
  rationale: עֵגֶל 通常指牛犊；这一译法准确、通俗，也符合跳跃的比喻。
- source_word: לְבָנוֹן
  choice: 黎巴嫩
  rationale: 按现代中文圣经地名的通行形式音译；本节在诗歌语境中指黎巴嫩的山地。
- source_word: וְשִׂרְיֹן
  choice: 西连
  rationale: 保留希伯来文本所用的专名，而不在正文中直接改为“黑门”；其地理身份在脚注说明。
- source_word: כְּמוֹ בֶן רְאֵמִים
  choice: 像野牛崽
  rationale: בֶן 在这里指幼崽、后代；רְאֵם 按当前词汇研究译为“野牛”。“野牛崽”既保留幼年之意，也自然呈现原文意象。
