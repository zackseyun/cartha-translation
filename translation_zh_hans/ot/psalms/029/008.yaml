  text: ק֣וֹל יְ֭הוָה יָחִ֣יל מִדְבָּ֑ר יָחִ֥יל יְ֝הוָ֗ה מִדְבַּ֥ר קָדֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/008.yaml
  text: The voice of Yahweh shakes the wilderness[a]; Yahweh shakes the wilderness of Kadesh.
translation:
  language: zh_hans
  text: 耶和华的声音使旷野震动[a]；耶和华使加低斯的旷野震动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使旷野战栗”或“使旷野翻腾”。
    reason: 词汇替代：希伯来语使役式可表示使之震动、战栗或剧烈翻腾。
lexical_decisions:
- source_word: ק֣וֹל
  choice: 声音
  rationale: 本诗反复使用“耶和华的声音”作为诗歌叠句，既指雷霆般的声响，也保留神亲自发声、临在并行动的意味；“声音”比单纯的“声响”更能传达这种文学和人格色彩。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的圣经专名“耶和华”呈现四字神名，保留其作为以色列之神专名的功能，而不以“主”这一称号代替。
- source_word: יָחִיל
  choice: 震撼
  rationale: חול的使役形在此可表示使之扭动、战栗或震动。“震撼旷野”符合现代汉语搭配，又能表现耶和华声音使整个旷野剧烈震动的力量；其他可能含义列入脚注。
- source_word: מִדְבָּר
  choice: 旷野
  rationale: “旷野”涵盖无人耕作、荒凉开阔之地，比气候意义较窄的“沙漠”更贴近希伯来词的范围及圣经地理语境。
- source_word: מִדְבַּר קָדֵשׁ
  choice: 加低斯的旷野
  rationale: 按希伯来语的构造关系译为“加低斯的旷野”，保留地点名称和地理限定；“加低斯”采用现代中文圣经中通行的音译。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文保留其专名性质，不以称号“主”替代；采用中文读者最熟悉且已固定化的圣经专名“耶和华”，同时不据此处理相关读音争议。
- issue: יָחִיל所描绘的受造界反应
  choice: 震撼
  alternative: 使旷野战栗；使旷野扭动
  rationale: 原词容许震动、战栗乃至如生产般扭动的意象。正文选择自然而有力度的“震撼”，脚注保留较强烈的其他可能，以免消除诗句本身的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留两行式平行结构和“耶和华……耶和华……”的重复；“震撼”兼顾自然表达与雷暴场景的力量感。
