  text: ק֥וֹל יְהוָ֗ה עַל הַ֫/מָּ֥יִם אֵֽל הַ/כָּב֥וֹד הִרְעִ֑ים יְ֝הוָ֗ה עַל מַ֥יִם רַבִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/003.yaml
  text: The voice of Yahweh is over the waters[a]; the God of glory thunders[b], Yahweh is over many waters.
translation:
  language: zh_hans
  text: '雅威的声音在众水之上；

    荣耀的上帝发出雷鸣；

    雅威在大水之上。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֥וֹל
  choice: 声音
  rationale: 保留“声音”的人格性和诗歌意象；全诗把雷鸣描绘为雅威的声音，而不只是自然界的声响。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，而不以“主”这一称号替代。
- source_word: עַל הַמָּיִם
  choice: 在水面之上
  rationale: עַל在风暴显现的图景中表示位于或运行于水之上；“水面之上”符合现代汉语表达。
- source_word: אֵל הַכָּבוֹד
  choice: 荣耀的上帝
  rationale: 希伯来文直译为“荣耀之上帝”；“荣耀的上帝”在现代汉语中自然，并保留荣耀与上帝之间的修饰关系。
- source_word: הִרְעִים
  choice: 发出雷声
  rationale: 该动词源于רעם，意为打雷、使雷鸣；此处用“发出雷声”既自然，也明确承接前句“声音”的风暴意象。
- source_word: מַיִם רַבִּים
  choice: 浩瀚的水域
  rationale: 该短语可直译为“众水”或“大水”，在诗歌中指广阔、丰沛的水体；“浩瀚的水域”传达其规模感，同时避免“许多水”在现代汉语中的生硬。
theological_decisions:
- issue: 如何译写神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名；音译“雅威”保留其作为专名的功能，不以称号代替。
- issue: 雷声与上帝声音的诗性关系
  choice: 同时保留“声音”和“发出雷声”
  alternative: 把首句直接意译为“雅威的雷声”
  rationale: 原诗有意先说雅威的“声音”，再说荣耀的上帝发雷声。保留两种表达，可维持拟人化的神显意象及其诗歌张力。
- issue: 末句省略系词的结构
  choice: 补出汉语所需的“在”
  alternative: 将末句处理为“在浩瀚水域之上的雅威”并与前句连读
  rationale: 马所拉重音在“发出雷声”后形成主要停顿，末句宜作为独立的平行分句；补出“在”使现代汉语清楚，同时不增加实质含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，以三个平行分句呈现希伯来诗歌节奏。“水面之上”与“浩瀚的水域之上”避免机械重复，同时保留首尾呼应。
