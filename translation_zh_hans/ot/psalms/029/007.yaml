  text: קוֹל יְהוָ֥ה חֹצֵ֗ב לַהֲב֥וֹת אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/007.yaml
  text: The voice of Yahweh hews out flames of fire[a].
translation:
  language: zh_hans
  text: 耶和华的声音劈出火焰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“劈出道道火光”，很可能指本诗风暴显现景象中的闪电。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: 声音
  rationale: 该词可指“声音”或“嗓音”。本诗反复使用“耶和华的声音”，把雷暴描绘成耶和华大能的发声；“声音”既自然，也保留这一诗意表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名形式呈现四字神名，避免用“主”这一称号取代原文中的名字。
- source_word: חֹצֵב
  choice: 劈出
  rationale: 该分词源自动词 חצב，基本义为凿、砍或劈开。此处“劈出”保留原文强烈而具体的动作感，又能自然搭配雷暴中的火焰或闪电意象。
- source_word: לַהֲבוֹת
  choice: 火焰
  rationale: 该复数名词通常指火焰、火舌；在风暴语境中可能形容闪电般的火光。正文采用直接词义“火焰”，把语境中的闪电含义留在脚注。
- source_word: אֵשׁ
  choice: 火
  rationale: 该词通常意为“火”。但在“火的火焰”这一希伯来语组合中，中文若逐词译出会显得累赘，因此用“火焰”整体传达 לַהֲבוֹת אֵשׁ，同时由脚注说明可能所指。
theological_decisions:
- issue: 如何呈现风暴显现中的神圣行动，同时不过度改写为现代气象描述
  choice: 正文采用具体诗意表达“劈出火焰”，让耶和华的声音保持直接施动者身份。
  alternative: 耶和华的声音劈出闪电；耶和华的声音使火焰闪射。
  rationale: 原文把耶和华的声音描写为劈开或凿出火焰，并未直接使用“闪电”一词。正文保留其陌生而有力的诗歌意象，脚注再提示风暴语境中很可能指闪电。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。“劈出”强化雷声与闪电骤然迸发的动态感；“耶和华”按现代中文圣经传统呈现神名。脚注标记已在正文对应出现。
