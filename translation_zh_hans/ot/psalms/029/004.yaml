  text: The voice of Yahweh is powerful[b][a]; the voice of Yahweh is majestic.
translation:
  language: zh_hans
  text: 雅威[a]的声音大有能力；雅威的声音满有威严。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名YHWH的音译；传统常译作“耶和华”或“主”。
    reason: alternative_reading
  - marker: b
    text: 或译：“雅威的声音带着能力；雅威的声音带着威严。”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: 声音
  rationale: קוֹל可指“声音”或“声响”；本诗反复使用这一表达，把雷鸣描写为雅威亲自发出的声音，因此译作“声音”既保留位格性，也符合上下文。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之上帝专名的性质，而不以“主”这一称号代替。
- source_word: בַּכֹּחַ
  choice: 大有能力
  rationale: 介词ב加名词כֹּחַ既可理解为“带着能力／在能力中”，也可作描述性表达。正文用自然的现代汉语“大有能力”，脚注保留较贴近形式的译法。
- source_word: הָדָר
  choice: 威荣
  rationale: הָדָר表示威严、尊荣或华美；“威荣”兼顾威严与荣耀，适合本诗庄严的神显语境，并与“能力”形成诗歌平行。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文以“雅威”音译，避免把专名改成称号；脚注说明传统译法，使读者知悉译名差异。
- issue: 介词短语בַּכֹּחַ与בֶּהָדָר的句法功能
  choice: 按描述性意义译为“大有能力／满有威荣”
  alternative: 按伴随或方式意义译为“带着能力／带着威荣”
  rationale: 希伯来语介词ב在此可作描述、状态或伴随方式理解。正文采用自然汉语，但以脚注保留原文结构所容许的另一种理解，不把歧义静默消除。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并保留原文两个分句的平行结构。正文以“大有能力／满有威荣”表达自然；“威荣”较“威严”更能兼顾הָדָר所含的尊荣与华美色彩。
