  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד הָב֣וּ לַֽ֭/יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/001.yaml
  text: A psalm of David. Ascribe to Yahweh[a], O sons of God, ascribe to Yahweh glory and strength.
translation:
  language: zh_hans
  text: '大卫的诗。


    神的众子[a]啊，当尊雅威为大；

    当将荣耀和能力归给雅威。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神的众子”也可译作“大能者的众子”或“天上的众灵”；这个希伯来语词组很可能指天上议会中的成员。
    reason: 保留 בְּנֵי אֵלִים 的多种可能理解，并说明其较可能的语境所指。
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题的常用术语；“诗”在现代汉语中自然、庄重，并符合《诗篇》的文体。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 在诗篇标题中可表示作者、归属或关联；“大卫的”保留这种简洁性，不武断限定为“大卫所作”。
- source_word: הָבוּ
  choice: 把当得的归给／把……归给
  rationale: 该命令在此不是指把某种物品交给神，而是承认荣耀和能力本来属于他。首句补出汉语所需的“当得的”，次句则依原文明确为“荣耀和能力”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中对四字神名的常见音译呈现其专名性质，而不以称号代替。
- source_word: בְּנֵי אֵלִים
  choice: 神的众子
  rationale: 贴近希伯来语“……之子”的意象，并保留 אֵלִים 在此所带来的解释张力；脚注说明其可能指天上议会中的众灵。
- source_word: כָּבוֹד
  choice: 荣耀
  rationale: 准确表达尊荣、威荣之意，也是诗歌语境中自然庄重的译法。
- source_word: עֹז
  choice: 能力
  rationale: 表达力量、权能；与“荣耀”并列时自然，并未将其缩窄为体力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用神的专名；音译“雅威”保留专名性质，也与当前较广泛接受的读音相符。
- issue: בְּנֵי אֵלִים 所指为何
  choice: 神的众子
  alternative: 大能者的众子／天上的众灵／众神之子
  rationale: 原文很可能指天上议会中的成员，但词组本身仍有词义与神学上的张力。正文保留其亲属式意象，脚注提供解释而不在正文中定死。
- issue: הָבוּ 的动作含义
  choice: 归给
  alternative: 献给／承认……属于
  rationale: 这里是呼吁受话者承认雅威本有的荣耀和能力，不暗示雅威原先缺少这些属性。用“归给”既保留“给予”的诗歌形式，也传达归属和承认之意。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。标题单列；正文保留原文两次“归给雅威”的递进和重复。脚注标记紧随其所解释的词组。
