  text: הָב֣וּ לַֽ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ הִשְׁתַּחֲו֥וּ לַ֝/יהוָ֗ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/002.yaml
  text: Ascribe to Yahweh the glory of his name[a]; worship Yahweh in holy splendor.
translation:
  language: zh_hans
  text: 要将雅威之名应得的荣耀归给他；要在圣洁的荣美中[a]敬拜雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在圣洁的华美中”；也可译“穿着圣洁的礼服”。
    reason: 原文短语 בְּהַדְרַת קֹדֶשׁ 可作抽象理解，也可指用于敬拜的神圣装束。
lexical_decisions:
- source_word: הָבוּ
  choice: 归给
  rationale: 该复数命令式在诗歌敬拜语境中指把荣耀归于、归给雅威，而不是实际交付某件物品。“归给”既符合现代汉语敬拜用语，也保留了命令的力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，表明经文直接使用的是上帝的立约之名，而非普通称号。
- source_word: כְּבוֹד שְׁמוֹ
  choice: 雅威之名的荣耀
  rationale: 紧贴希伯来语“他名的荣耀”这一结构，同时通过汉语语序明确“他”所指的是雅威；不在正文中加入“当得的”，以免把原文隐含义明说为字面内容。
- source_word: הִשְׁתַּחֲווּ
  choice: 敬拜
  rationale: 该词本义涉及俯伏下拜，在此以雅威为对象的礼仪语境中，“敬拜”自然传达其核心意义，又不把动作限定为某一种身体姿势。
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: 在圣洁的荣美中
  rationale: 这一表达保留原短语的诗意及其歧义，既可理解为圣洁本身的荣美，也不完全排除神圣装束或礼仪场景的具体含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地按学界通常重构的读音加以音译，避免以“主”这一称号取代专名。
- issue: בְּהַדְרַת קֹדֶשׁ 的解释
  choice: 在圣洁的荣美中
  alternative: 穿着圣洁的礼服
  rationale: 希伯来语可指圣洁的荣美，也可能具体指神圣装束。正文采用较开放的诗性表达，不把含义限于礼服，具体译法列入脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“归给”“敬拜”符合诗篇呼召敬拜的语域；“圣洁的荣美”刻意保留原文凝练、诗性的表达及解释空间。
