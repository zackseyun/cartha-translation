source:
  edition: WLC
  text: ק֣וֹל יְ֭הוָה שֹׁבֵ֣ר אֲרָזִ֑ים וַ/יְשַׁבֵּ֥ר יְ֝הוָ֗ה אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/005.yaml
  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
translation:
  language: zh_hans
  text: 雅威的声音[a]折断香柏树；雅威把黎巴嫩的香柏树击碎[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅威的声响”。希伯来语 קוֹל 可指发出的“声音”，也可指可听见的“声响”；正文采用“声音”，以保留本诗中雅威亲自发声的描绘。
    reason: lexical_alternative
  - marker: b
    text: 两句使用同一希伯来词根，意为“折断、打碎”；第二处采用加强形式，因此译作“击碎”。
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: קוֹל יְהוָה
  choice: 雅威的声音
  rationale: קוֹל既可指“声音”，也可指“声响”。“声音”在现代汉语中自然，并能保留本诗把雷霆描绘为雅威亲自发声的意味，同时不完全排除“声响”的理解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: שֹׁבֵר
  choice: 折断
  rationale: Qal分词在诗句中表达鲜明、持续呈现的动作；“折断”准确描写香柏树被强力摧折，简洁有力。
- source_word: אֲרָזִים
  choice: 香柏树
  rationale: 该复数名词泛指香柏；现代汉语用“香柏树”比单说“香柏”更清楚自然。
- source_word: וַיְשַׁבֵּר
  choice: 击碎
  rationale: 此处是同一词根 שׁבר 的Piel形式，可传达强烈或彻底的破坏；“击碎”既体现第二分句的力度，也避免生硬重复。
- source_word: אֶת אַרְזֵי הַלְּבָנוֹן
  choice: 把黎巴嫩的香柏树
  rationale: “把”字句自然承接主语和强力动作；“黎巴嫩的香柏树”准确保留原文的构造关系及地名意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，也避免以“主”这一称号替代；“耶和华”虽为传统形式，但“雅威”更接近学界通常采用的拟定读音。
- issue: “雅威的声音”的神显意味
  choice: 保留“声音”，不直接译成“雷声”
  alternative: 雅威的雷声；雅威的声响
  rationale: 全诗语境可使人联想到雷霆，但本节原文只用 קוֹל，并未明说“雷”。译文保留“声音”，避免把语境推论写进正文，同时维持雅威亲自发声的诗歌形象。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两分句维持原文平行结构，以“折断／击碎”表现力度递进；正文不补入原文未明说的“雷声”。
