  text: יְֽהוָ֗ה עֹ֭ז לְ/עַמּ֣/וֹ יִתֵּ֑ן יְהוָ֓ה יְבָרֵ֖ךְ אֶת עַמּ֣/וֹ בַ/שָּׁלֽוֹם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/011.yaml
  text: Yahweh gives strength to his people[b][a]; Yahweh blesses his people with peace.
translation:
  language: zh_hans
  text: 雅威赐力量给他的子民[a]；雅威以平安赐福给他的子民[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威必赐力量给他的子民；雅威必以平安赐福给他的子民。”希伯来语的两个未完成式动词也可表达未来意义。
    reason: alternative_reading
  - marker: b
    text: “平安”所译的希伯来语שָׁלוֹם，也可包含安康、健全和整体福祉。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用希伯来神名四字母的常见现代汉语音译，保留其作为专名的性质，不以称号代替。
- source_word: עֹז
  choice: 力量
  rationale: 该词表示力量、能力或威力；在“赐给子民”的搭配中，“力量”自然准确，也呼应全诗所彰显的神圣能力。
- source_word: לְעַמּוֹ
  choice: 给他的子民
  rationale: 介词לְ在此标示领受者；“给他的子民”符合现代汉语表达，并保留第三人称所属关系。
- source_word: יִתֵּן
  choice: 赐
  rationale: 未完成式在诗歌结语中可表达一贯或确定的行动；“赐”简洁庄重，适合神将力量给予子民的语境。未来义仍以脚注保留。
- source_word: יְבָרֵךְ
  choice: 赐福
  rationale: 准确表达“祝福、赐福”的动词意义，并与前半句形成自然的平行结构。该未完成式也可有未来意味，故在脚注说明。
- source_word: בַשָּׁלוֹם
  choice: 使他们平安
  rationale: 介词短语说明赐福所带来的平安状态或内容；这样译成现代汉语比直译“以平安”自然，同时保留שָׁלוֹם的核心意义。其较宽的语义范围在脚注说明。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；音译“雅威”保留这一专名，而不以“主”这一称号替代。
- issue: יִתֵּן与יְבָרֵךְ两个未完成式的时态和语气
  choice: 按现在的一贯性或宣告性行动译为“赐……赐福”
  alternative: 未来义：“必赐……必赐福”；祈愿义：“愿雅威赐……愿雅威赐福”
  rationale: 作为诗篇的总结，这两个平行动词可理解为对雅威如何恩待其子民的确信宣告。希伯来语形式也容许未来理解，故以脚注保留；祈愿义在语法上并非绝无可能，但此处宣告式理解更贴合上下文。
- issue: שָׁלוֹם的语义范围
  choice: 平安
  alternative: 安康；完整健全、福祉
  rationale: “平安”是该词在此处最简明且传统的核心译法，但原词不只指没有冲突，也可涵盖健全、安康与整体福祉，因此不在正文中把含义收窄为单纯的安宁。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“赐力量给”保留原文给予者、所赐之物和领受者的结构；后半句以“使他们平安”自然表达בַשָּׁלוֹם，同时不在正文中过度展开שָׁלוֹם的丰富含义。重复“雅威”和“他的子民”，以保存希伯来诗句的平行与强调。
