  text: שְׂאֽוּ יְדֵ/כֶ֥ם קֹ֑דֶשׁ וּ֝/בָרֲכוּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/002.yaml
  text: Lift up your hands to the holy place and bless Yahweh[a].
translation:
  language: zh_hans
  text: 要向圣所举起你们的手，称颂雅威。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向圣所”或译“以圣洁的方式”，也可译“在圣所”。希伯来语 קֹדֶשׁ 既可指圣洁，也可指圣所。
    reason: 保留原文中性质义、方向义和处所义之间的真实歧义。
lexical_decisions:
- source_word: שְׂאוּ
  choice: 举起
  rationale: 这是 נשׂא 的阳性复数祈使式，表达有意识地抬举双手；“举起”在现代汉语中自然，并保留具体动作。
- source_word: יְדֵיכֶם
  choice: 你们的手
  rationale: 按原文保留第二人称复数及“手”的具体意象；汉语无需勉强译成“你们的双手”。
- source_word: קֹדֶשׁ
  choice: 向圣所
  rationale: קֹדֶשׁ 可指“圣洁”，也可指“圣所”。结合上节“雅威的殿”及夜间圣殿事奉的语境，这里采用方向性的“向圣所”；但原文没有介词，其他理解仍有可能，故以脚注保留。
- source_word: וּבָרֲכוּ
  choice: 称颂
  rationale: ברך 以神为宾语时表示向神献上祝颂；“称颂”比现代汉语中容易误解为向神赐福的“祝福”更准确，同时保留敬拜语体。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，现代汉语没有对应词。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现神的专名，而不以称号替代。
theological_decisions:
- issue: קֹדֶשׁ 在“举起你们的手”之后的含义
  choice: 地点兼方向：“向圣所”
  alternative: 性质或方式：“怀着圣洁”；地点：“在圣所”
  rationale: 诗篇语境中的“雅威的殿”使圣所义很有可能；不过 קֹדֶשׁ 前没有明确介词，因此不能排除“圣洁”的性质义或“在圣所”的处所义。正文采用语境较强的读法，脚注明确保存其歧义。
- issue: 对神使用 ברך 的译法
  choice: 称颂雅威
  alternative: 祝福雅威；颂赞雅威
  rationale: “称颂”既反映 ברך 的传统神学用语，又避免现代读者误以为人向神赐予福分；“颂赞”虽自然，却略缩窄了词义。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语体。“要向……举起……，称颂……”保留原文两个复数祈使动作的并列关系；“雅威”呈现神的专名。
