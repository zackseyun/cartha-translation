id: PSA.134.0
reference: Psalms 134:0
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/000.yaml
  text: A Song of Ascents. Behold, bless the LORD, all you servants of the LORD, who stand in the house of the LORD by night!
translation:
  language: zh_hans
  text: 登阶之歌。看哪，耶和华的众仆人，你们这些夜间站在耶和华殿中的，都要称颂耶和华！[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“请看”或“注意”。
    reason: lexical_alternative
  - marker: b
    text: “耶和华殿”指耶和华的圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 登阶之歌
  rationale: 保留诗篇120—134篇标题的传统含义；“登阶”既可指上行，也与朝圣上耶路撒冷的背景相合，而不把具体所指定死。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 用庄重而仍可理解的提示语，保留原文引人注意和催促听者回应的功能。
- source_word: בָּרֲכוּ אֶת־יְהוָה
  choice: 称颂耶和华
  rationale: בּרך用于人对上帝时表示赞美、颂赞；“称颂”比直译为“祝福”更符合现代汉语搭配。
- source_word: עַבְדֵי יְהוָה
  choice: 耶和华的众仆人
  rationale: 保留“仆人”的事奉和归属含义，不额外限定为祭司或利未人。
- source_word: הָעֹמְדִים
  choice: 站在
  rationale: 形式上贴近原文，也可自然表达在圣殿中值守、供职；不把隐含职能写入正文。
- source_word: בְּבֵית יְהוָה
  choice: 在耶和华殿中
  rationale: “殿”在此自然指耶和华的圣殿，比逐字译为“家”更符合语境。
- source_word: בַּלֵּילוֹת
  choice: 夜间
  rationale: 希伯来语为复数形式，可泛指夜晚或各夜；汉语“夜间”自然保留其概括性。
theological_decisions:
- issue: “耶和华的众仆人”的具体身份
  choice: 不在正文中限定身份
  alternative: 译为“众祭司”或“祭司和利未人”
  rationale: 语境可能指夜间在圣殿供职者，但原文只说“仆人”；保留其明确措辞及身份范围上的开放性。
- issue: “称颂耶和华”的语义
  choice: 表达为人向上帝献上颂赞
  alternative: 直译为“祝福耶和华”
  rationale: 该动词在此不是人向上帝赐福，而是颂赞上帝；采用现代汉语中不易误解的等值表达。
translation_notes:
  register: 采用现代、庄重而清楚的诗歌语体。标题与正文完整呈现；以“看哪”保留原文的呼告力度，并用“称颂”“殿”形成自然的现代标准汉语表达。
