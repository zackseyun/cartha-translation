  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/001.yaml
  text: A Song of Ascents[a]. Behold, bless Yahweh, all you servants of Yahweh[b], who stand in the house of Yahweh by night.
translation:
  language: zh_hans
  text: '上行之歌。


    看哪[a]，雅威的众仆人啊，

    你们夜间站在雅威的殿中[b]，

    要称颂雅威！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“看”或“请看”。
    reason: lexical_alternative
  - marker: b
    text: “雅威的殿”原文直译为“雅威的家”，这里指雅威的圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 保留诗集标题中“上行”的基本意象，同时采用简洁、庄重且已有广泛认知的中文表达，不直接限定为朝圣或登殿。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 传达引起注意和加强呼召语气的作用，并保持诗歌体的庄重感。
- source_word: בָּרֲכוּ
  choice: 称颂
  rationale: 原词基本义为“祝福”，但用于人对上帝时，现代汉语以“称颂”更自然，也保留礼仪性赞美与宣认上帝当受尊崇的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留经文对上帝盟约之名的直接使用，而不以头衔替代。
- source_word: כָּל עַבְדֵי יְהוָה
  choice: 雅威的众仆人啊
  rationale: 命令式语境表明这是直接呼语；“仆人”符合圣殿服事场景，也避免“奴隶”在现代汉语中可能造成的不必要偏移。
- source_word: הָעֹמְדִים
  choice: 站在
  rationale: 保留分词所描绘的具体站立姿态，不在正文中解释性地改译为“供职”或“服事”。
- source_word: בְּבֵית יְהוָה
  choice: 在雅威的殿中
  rationale: “殿”在现代汉语中自然指向圣所；脚注说明其字面表达为“雅威的家”。
- source_word: בַּלֵּילוֹת
  choice: 夜间
  rationale: 以自然汉语表达希伯来语复数形式在此所指的夜间时段，不机械译成“在诸夜里”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，避免用“主”这一头衔取代，也比传统形式“耶和华”更贴近通常重构的读音。
- issue: 人对上帝使用 ברך 的译法
  choice: 称颂
  alternative: 祝福；赞美
  rationale: “祝福雅威”虽更贴近词形，却容易被现代读者误解为人把福赐给上帝；“称颂”适合礼仪呼召，同时不把含义仅缩减为一般性的赞美。
translation_notes:
  register: 采用现代、庄重的诗歌体。以“啊”和句末感叹号体现直接呼召，以分行保留希伯来诗句的推进；正文不把“站立”解释成祭司职务，以免超出原文。
