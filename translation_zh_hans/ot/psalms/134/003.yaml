base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/003.yaml
  text: May Yahweh bless you from Zion[c][b][a], maker of heaven and earth.
translation:
  language: zh_hans
  text: 愿雅威[a]——创造天地者[c]——从锡安赐福给你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文四字神名יהוה的常见拟音；其古代确切读音不能完全确定，传统上也常译作“耶和华”或以“主”代称。
    reason: divine_name
  - marker: b
    text: 或译：“雅威从锡安赐福给你”或“雅威必从锡安赐福给你”。希伯来文动词形式可表示未完成或将来的行动；在本诗结尾的祝福语境中，译作“愿……”较为合适。
    reason: alternative_reading
  - marker: c
    text: 也可译作：“那创造天地的（雅威）”或“天地的创造者”。原文的分词称谓用以说明雅威是天地的创造者。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: 愿……赐福给你
  rationale: 该词是ברך的Piel未完成式，带第二人称阳性单数宾语后缀。诗篇结尾的祝福语境支持将其理解为愿望或祈愿；“愿……赐福给你”在现代汉语中自然地传达这一语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的学术拟音“雅威”呈现四字神名，保留原文使用的专名，而不以“主”这一称号替代。
- source_word: מִצִּיּוֹן
  choice: 从锡安
  rationale: 介词מִן表示来源；“从锡安”准确保留福分由锡安而来的意象。
- source_word: עֹשֵׂה
  choice: 创造者
  rationale: עשה的Qal主动分词在此作同位性称谓，说明雅威的身份；“创造者”既保留分词的称谓功能，也符合自然汉语。
- source_word: שָׁמַיִם וָאָרֶץ
  choice: 天地
  rationale: “天与地”在希伯来语中构成涵盖全部受造界的固定组合；汉语“天地”简洁、庄重，并保留其宇宙性范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”可保留其专名性质；脚注说明其古代确切读音不能完全确定，避免把拟音当作无争议的定论。
- issue: 句首未完成式的语气
  choice: 祈愿语气：“愿……赐福给你”
  alternative: 陈述或将来语气：“雅威赐福给你／雅威必赐福给你”
  rationale: 本诗结尾具有礼仪性的祝福语境，因此祈愿语气最为贴切；同时在脚注中保留希伯来语形式也可作一般陈述或未完成动作理解的可能。
- issue: “创造天地者”与雅威的关系
  choice: 以同位说明句“他是天地的创造者”标明身份
  alternative: 定语式：“愿创造天地的雅威……”
  rationale: 希伯来语分词在神名之后作同位称谓。汉语用分号和说明句可清楚保留其身份说明功能，又不把它误解为另一个主语。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪性汉语。“愿……赐福给你”保持祝福语气；分号后的说明句自然承接希伯来文同位称谓。神名用“雅威”，并以脚注交代拟音与传统译法。
