source:
  edition: WLC
  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשׁוּעַ֪ת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב יְ֭הוָה שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָֽאֵל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/007.yaml
  text: Oh[a], that Israel’s salvation would come from Zion! When Yahweh restores the fortunes of his people, Jacob will rejoice; Israel will be glad.
translation:
  language: zh_hans
  text: 但愿以色列的救恩从锡安而来！耶和华恢复他子民的境况时[a]，雅各必欢欣，以色列必喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华使他子民从被掳之地归回时。”希伯来语这一惯用语常指恢复一个民族的境况或扭转其困境，不一定专指从被掳之地归回。
    reason: 保留 שׁוּב שְׁבוּת 较为字面的译法及其可能涉及被掳归回的含义。
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: 但愿
  rationale: 这是表达强烈愿望或盼望的希伯来语惯用语，并非真正询问“谁能赐下”；“但愿”在现代汉语中自然、庄重，也保留祈愿语气。
- source_word: מִצִּיּוֹן
  choice: 从锡安而来
  rationale: 介词 מִן 表示来源；“锡安”采用中文圣经传统通行译名。补出“而来”使汉语句法完整。
- source_word: יְשׁוּעַת יִשְׂרָאֵל
  choice: 以色列的救恩
  rationale: 属格结构直译为“以色列的救恩”，既可涵盖现实中的拯救，也保留较广的神学内涵。
- source_word: בְּשׁוּב יְהוָה שְׁבוּת עַמּוֹ
  choice: 耶和华使他子民的景况复原时
  rationale: שׁוּב שְׁבוּת 是恢复处境、扭转困境的惯用表达；此处未明确限定为历史上的被掳归回，因此主文采用较宽广的惯用义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名的通行专名译法，保留其作为名字而非普通称号的功能。
- source_word: יָגֵל
  choice: 必欢欣
  rationale: גיל 表示洋溢、雀跃的喜悦；“欢欣”比一般的“高兴”更符合诗歌语体。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用通行人名译法；在此作为全体以色列民的诗意称呼。
- source_word: יִשְׂמַח
  choice: 必喜乐
  rationale: שמח 表示喜悦；译作“喜乐”与前句“欢欣”形成同义平行，同时区分两个希伯来语动词。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用通行专名译法；此处与“雅各”平行，集体指神的子民。
theological_decisions:
- issue: שׁוּב שְׁבוּת 的含义
  choice: 使他子民的景况复原
  alternative: 使他被掳的子民归回；带回他子民中的被掳者
  rationale: 该搭配可以涉及被掳者归回，但也常泛指扭转困境、恢复原有福祉。诗篇第14篇本身没有明确的被掳历史背景，因此主文保留广义，脚注列出较贴近字面的理解。
- issue: “雅各”与“以色列”的所指
  choice: 保留两个名称，不改写为“以色列民”
  alternative: 将两者都解释性译为“以色列民”
  rationale: 两者构成诗歌同义平行，并共同指向神的子民；保留原有名称可保存诗体和经文意象，而不把两句压缩为同一表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“但愿”保留祈愿语气；“欢欣／喜乐”保存末句的同义平行。神名译作中文通行的“耶和华”。
