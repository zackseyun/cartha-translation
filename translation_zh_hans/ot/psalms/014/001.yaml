  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽשְׁחִ֗יתוּ הִֽתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/001.yaml
  text: For the choir director[a]. Of David. The fool says in his heart, “There is no God.” They are corrupt; they do abominable deeds[c][b]. There is no one who does good.
translation:
  language: zh_hans
  text: '交给乐长[a]。大卫的诗[b]。


    愚顽人心里说：“没有上帝。”


    他们败坏，行了可憎的事[c]；


    没有人行善。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“交给音乐指挥”或“交给诗班指挥”。
    reason: lexical_alternative
  - marker: b
    text: “大卫的诗”也可理解为“大卫所作”或“为大卫而作”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文先用单数“愚顽人”，随后转为复数“他们”，由一个代表性人物转指他所代表的一类人。
    reason: source_structure
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐指挥
  rationale: 该诗题术语指负责带领或统筹音乐者。“圣乐指挥”在现代中文中清楚自然，同时保留其礼仪音乐职能；介词 לַ 译作“交给”，表达诗篇交付其使用或指挥。
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 诗题中的 לְ 可表示作者、归属、关联或献呈。“大卫的诗”是自然且庄重的传统表达，但不把关系严格限定为现代意义的作者署名。
- source_word: נָבָל
  choice: 愚顽人
  rationale: 此词不只是智力不足，更指道德和属灵上的乖谬。“愚顽人”保留这一圣经伦理范畴，并体现原文的代表性单数。
- source_word: בְּלִבּוֹ
  choice: 心里
  rationale: 希伯来语“心”涵盖内在思想、判断和意志；“心里说”既贴近原文，也符合现代汉语。
- source_word: אֵין אֱלֹהִים
  choice: 没有上帝
  rationale: 按该短语最直接的存在性含义翻译，不将其弱化或解释为“上帝不管”或“没有审判”。
- source_word: הִשְׁחִיתוּ
  choice: 他们败坏
  rationale: 该动词可表达变坏、败坏或腐化。“他们败坏”简洁地保留动词性，也避免过度判定为反身意义“败坏自己”。
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: 所行的可憎
  rationale: הִתְעִיבוּ 表示行得可憎或成为可憎，עֲלִילָה 指行为、作为。“所行的可憎”在中文中凝练自然，并保留对其行为的强烈道德评价。
- source_word: אֵין עֹשֵׂה טוֹב
  choice: 没有人行善
  rationale: 贴近希伯来句法和普遍否定的力度，同时是清楚自然的现代中文。
theological_decisions:
- issue: אֵין אֱלֹהִים 所否认的范围
  choice: 没有上帝
  alternative: 上帝不管；没有审判
  rationale: 原文最直接陈述上帝不存在或不在；虽然上下文也揭露实际生活中的无神态度，正文不以解释性意译取代明确措辞。
- issue: 单数 נָבָל 后转为复数动词
  choice: 保留“愚顽人”单数，随后译作“他们”
  alternative: 全句统一为单数“他”，或开头改为复数“愚顽人们”
  rationale: 原文由代表性的单数个体转向其所代表的群体。保留这一数的转换，可呈现原文的修辞张力而不加以抹平。
- issue: לְדָוִד 在诗题中的关系
  choice: 大卫的诗
  alternative: 大卫所作；为大卫而作
  rationale: 介词 לְ 在诗篇标题中可涉及作者、归属、关联或献呈；采用不严格锁定作者关系的表达，并以脚注说明歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。诗题单独列行，正文按希伯来诗句分行。保留“心里说”的希伯来表达和单数转复数的结构，不以教义性释义替换原文。所有脚注标记均置于相应正文位置。
