source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽשְׁחִ֗יתוּ הִֽתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/000.yaml
  text: 'For the choir director[a]. Of David.


    The fool says in his heart, “There is no God.”

    They are corrupt; they do abominable deeds[c][b].

    There is none who does good.'
translation:
  language: zh_hans
  text: '交给圣乐指挥[a]。大卫的诗[b]。


    愚顽人心里说：“没有上帝。”

    他们败坏，所作所为可憎[c]；

    没有一个人行善。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“交给乐长”“交给诗班指挥”。
    reason: lexical_alternative
  - marker: b
    text: “大卫的诗”也可理解为“大卫所作的诗”或“为大卫而作的诗”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来原文在这里从单数的“愚顽人”转为复数的“他们”，由一个代表性人物转向他所代表的一类人。
    reason: source_form
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐指挥
  rationale: 该词用于诗篇题注，指负责音乐演奏或歌唱的人；“圣乐指挥”在现代汉语中自然明白，同时保留其礼仪音乐语境。
- source_word: נָבָל
  choice: 愚顽人
  rationale: 此词不只表示智力不足，更指道德和属灵上的愚昧悖逆；“愚顽人”较能传达这一含义。
- source_word: בְּלִבּוֹ
  choice: 心里
  rationale: 希伯来语“心”指内在思想与意志；直译为“心里”既自然又保留原文意象。
- source_word: הִשְׁחִיתוּ
  choice: 他们败坏
  rationale: 保留原文由单数“愚顽人”转为复数的变化，也传达道德败坏之意。
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: 所作所为可憎
  rationale: 原短语可理解为使行为变得可憎或行了可憎之事；此译简洁自然，并保留对其行为整体的道德判断。
- source_word: אֵין עֹשֵׂה טוֹב
  choice: 没有一个人行善
  rationale: 将希伯来语存在否定句自然译成现代汉语，并明确其普遍否定的语气。
theological_decisions:
- issue: “没有上帝”的言说性质
  choice: 按原文保留为愚顽人内心的直接断言
  alternative: 解释为“上帝不会理会”或“没有上帝审判”
  rationale: 原文 אֵין אֱלֹהִים 字面为“没有上帝”，没有明说这是实践上的否认还是哲学上的无神论，因此不在正文中替原文消除这一张力。
- issue: 从单数“愚顽人”转为复数“他们”
  choice: 保留数的转换
  alternative: 全句统一译成单数或泛称复数
  rationale: 这一转换使开头的代表性人物扩展为他所代表的一类人，属于原文重要的修辞与神学表达。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。诗题简洁保留；正文按希伯来诗歌分行，避免古奥词汇，同时以“愚顽人”“败坏”“可憎”等词保持诗篇的伦理力度。
