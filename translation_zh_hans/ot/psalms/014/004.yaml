  text: הֲ/לֹ֥א יָדְעוּ֮ כָּל פֹּ֪עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם יְ֝הוָ֗ה לֹ֣א קָרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/004.yaml
  text: Do not all the workers of wickedness know—those who eat up my people as they eat bread[a], and do not call on Yahweh?
translation:
  language: zh_hans
  text: 难道所有作恶的人都不明白吗？他们吞吃我的百姓，就像吃饭一样[a]；他们不求告雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似“吞吃我的百姓；他们吃饼”，以日常进食比喻他们对百姓的吞吃和残害。
    reason: 说明原文省略比较词的紧凑表达，并交代译文补出“像”的依据；同时更准确反映לֶחֶם“饼”的字面义。
lexical_decisions:
- source_word: הֲלֹא
  choice: 难道……不……吗？
  rationale: 表达预期肯定回答的反问语气，符合现代汉语习惯。
- source_word: יָדְעוּ
  choice: 明白
  rationale: ידע在此可指知道、认识或领悟；“明白”自然地表达作恶者对其行为与后果的无知或无视，同时不把含义限定为纯粹的知识认知。
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: 所有作恶的人
  rationale: 以自然、庄重的现代汉语表达分词结构和אָוֶן的道德含义，避免较古旧的“作孽之人”。
- source_word: אֹכְלֵי עַמִּי
  choice: 他们吞吃我的百姓
  rationale: “吞吃”保留强烈的进食隐喻，也清楚表达对百姓的残害与掠夺。
- source_word: אָכְלוּ לֶחֶם
  choice: 就像吃饭一样
  rationale: 原文直译近似“他们吃我的百姓；他们吃饭”，语境构成比较；汉语补出“像……一样”，使隐含比喻清楚而不过度解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质，而不以称号替代。
- source_word: לֹא קָרָאוּ
  choice: 不求告
  rationale: קרא与神名连用时通常指在祷告、敬拜或患难中呼求；“求告”准确且具有合宜的经文语体。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确保留专名，不用“主”等称号替代。
- issue: “不明白”的所指
  choice: 保留宾语未明说的表达
  alternative: 补成“不明白自己所做的吗”或“不知道神必审判吗”
  rationale: 希伯来文没有明说他们不知道什么；译文不补入特定的审判观念或心理状态，以保留原文的开放性和修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作恶的人”避免不必要的古旧感；“吞吃”“求告”则保留诗歌力度和敬拜语域。反问句后分列两项行为，使汉语清楚，同时保持原文对作恶者的控诉。
