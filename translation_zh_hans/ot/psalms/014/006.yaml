source:
  edition: WLC
  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/006.yaml
  text: You shame the counsel of the poor[a], because Yahweh is his refuge.
translation:
  language: zh_hans
  text: 你们使困苦人的谋算蒙羞[a]，因为雅威是他的避难所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们使困苦人的计划受挫。”希伯来语“谋算”也可指主意或计划，而“使……蒙羞”在这里也可能含有使其落空、受挫之意。
    reason: 词义存在多种可能
lexical_decisions:
- source_word: עֲצַת
  choice: 谋算
  rationale: 这是עֵצָה的构造形式，可指主意、谋略或计划。“谋算”保留了较宽的语义，没有限定为口头劝告或内心计划。
- source_word: עָנִי
  choice: 困苦人
  rationale: עָנִי可指贫穷、受苦或受压迫的人。“困苦人”在现代汉语中自然，也比单说“穷人”更能保留其脆弱、受压的含义。
- source_word: תָבִישׁוּ
  choice: 你们使……蒙羞
  rationale: 这是בוש的使役形第二人称阳性复数，可表示使其蒙羞或使其受挫。此译保留复数称呼和“羞耻”这一核心意象。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出原因，说明恶人这样对待困苦人的谋算是何等不当：雅威是他的保护。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名YHWH的常见现代汉语音译处理，保留其作为上帝专名的性质，而不以称号代替。
- source_word: מַחְסֵהוּ
  choice: 他的避难所
  rationale: מַחְסֶה意为避难处、庇护所，词尾为第三人称阳性单数。“他的避难所”自然地保留保护与安全的比喻。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”较贴近YHWH的学术重构读音，并明确保留专名，而不是以“主”等称号替代。
- issue: “因为”所说明的逻辑关系
  choice: 保留因果连接，不补明隐含结论
  alternative: 扩译为“但你们必不能得逞，因为……”
  rationale: 原文只以כִּי连接两个分句，没有明说雅威作避难所将怎样推翻恶人的行为；直译保留诗句本身的神学张力与含蓄。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“困苦人”兼顾贫穷、受苦和受压迫的语义；“谋算蒙羞”略带诗性，以保留希伯来文不寻常的搭配和真实歧义。
