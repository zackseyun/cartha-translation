  text: שָׁ֤ם פָּ֣חֲדוּ פָ֑חַד כִּֽי אֱ֝לֹהִ֗ים בְּ/ד֣וֹר צַדִּֽיק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/005.yaml
  text: There they were in great dread[b][a], for God is with the generation of the righteous.
translation:
  language: zh_hans
  text: 他们在那里大大惧怕[a]，因为神在义人的世代中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文以“惧怕”这个动词与同根名词连用，是加强语气的表达，表示他们陷入极大的恐惧。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“因为神与义人的世代同在”，或“因为神在义人的群体当中”。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: 在那里
  rationale: 保留地点副词的简洁和诗意，也可指向眼前所述的情景，而不擅自补明具体地点。
- source_word: פָּחֲדוּ פָחַד
  choice: 他们大大惧怕
  rationale: 希伯来文以同根动词和名词连用，直译近似“惧怕了惧怕”，作用是加强语气；“大大惧怕”在现代汉语中自然地保留这种强调。
- source_word: כִּי
  choice: 因为
  rationale: 在本句中引出惧怕的原因，因果关系明确。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处虽为形态上的复数形式，却按上下文单数指以色列的神，照常译为“神”。
- source_word: בְּדוֹר
  choice: 在……世代中
  rationale: בְּ可表达“在……中”或“在……当中”；主译尽量贴近希伯来文的空间、群体关系，同时以脚注保留“与……同在”的可能表达。
- source_word: צַדִּיק
  choice: 义人的
  rationale: צַדִּיק在形态上为单数，但与“世代”连用时可作类别性、集合性的描述；“义人的世代”既保留原文结构，也不局限为某一个义人。
theological_decisions:
- issue: 神与义人之世代的关系（בְּדוֹר צַדִּיק）
  choice: 神在义人的世代中
  alternative: 神与义人的世代同在／神在义人的群体当中
  rationale: 希伯来介词可表示处于某群体之中，也可在语境中传达神与义人同在。主译采用较形式对应的表达，避免把“同在、支持”的含义定得过满，并以脚注保留自然的另一译法。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“大大惧怕”保留诗歌的强调力度；“义人的世代”保留 דור 的世代、群体双重色彩。
