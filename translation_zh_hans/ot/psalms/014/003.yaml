  text: All have turned aside; together they have become corrupt. There is none who does good[a], not even one.
translation:
  language: zh_hans
  text: 众人都偏离了，一同变得败坏[a]；没有行善的，连一个也没有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “败坏”也可译为“受玷污”或“变得污秽”。希伯来语动词表达变质、腐坏。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: 众人都
  rationale: 定冠词加“全部”在此总括所有人；“众人都”在现代汉语中自然，并保留全面范围。
- source_word: סָר
  choice: 偏离了
  rationale: סור意为转开、离开；“偏离”保留原文未明说偏离何物的含蓄性，也不额外加入迷途意象。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 表达共同、整体性的行动，简洁而庄重。
- source_word: נֶאֱלָחוּ
  choice: 变得败坏
  rationale: 该词的尼法勒形式表达变坏、腐败的结果状态；“变得败坏”兼顾变化过程与道德语境。
- source_word: אֵין עֹשֵׂה טוֹב
  choice: 没有行善的
  rationale: 自然呈现不存在任何行善者的强调否定，并保留分词所表达的特征性行为。
- source_word: אֵין גַּם אֶחָד
  choice: 连一个也没有
  rationale: “连……也……”准确传达גַּם在否定句中的加强语气。
theological_decisions:
- issue: 关于人败坏的全称陈述范围
  choice: 保留“众人都”“没有”“连一个也没有”的全面谴责
  alternative: 弱化为对多数人或一般情形的描述
  rationale: 原文连续使用全面词和加强否定，译文不缩小其修辞与神学力度，也不借后来的教义体系进一步解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“偏离”保留原文宾语省略所形成的开放性；分号呈现两组相互强化的判断。脚注标记置于整节末，所释词为正文中的“败坏”。
