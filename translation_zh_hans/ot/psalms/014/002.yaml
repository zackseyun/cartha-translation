  text: יְֽהוָ֗ה מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵי אָ֫דָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵשׁ אֶת אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/002.yaml
  text: Yahweh looks down from heaven on the children of man to see whether there is one who has insight[a], one who seeks God.
translation:
  language: zh_hans
  text: 耶和华从天上俯察世人，要看是否有人明白事理，寻求上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式译出四字神名，而不以“主”这一称号替代。
- source_word: מִשָּׁמַיִם
  choice: 从天上
  rationale: 希伯来语虽为复数形式，中文“天上”自然表达上帝俯察的所在和视角。
- source_word: הִשְׁקִיף
  choice: 俯察
  rationale: 该动词表示从高处向下观看；“俯察”既保留方向意象，也符合诗歌的庄重语体。
- source_word: בְּנֵי אָדָם
  choice: 世人
  rationale: 该希伯来语代表性表达泛指全人类；中文直译为“人的儿子们”会造成误解，“世人”准确而自然。
- source_word: לִרְאוֹת הֲיֵשׁ
  choice: 要看看是否有
  rationale: 保留目的不定式和疑问成分，同时形成自然的现代汉语句法。
- source_word: מַשְׂכִּיל
  choice: 明智的人
  rationale: 表达由 שכל 而来的领悟、明辨之意，避免把它过度限定为知识层面的“聪明”。
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: 寻求上帝的人
  rationale: 保留主动分词所描写的持续取向，并直接译出其宾语“上帝”。
theological_decisions:
- issue: בְּנֵי אָדָם 的代表性阳性表达
  choice: 世人
  alternative: 人的众子／人类
  rationale: 原短语按希伯来语习惯泛指人类，而非只指男性；中文“世人”保留其普遍范围，且不引入不自然或可能误导的性别限定。
- issue: מַשְׂכִּיל 与 דֹּרֵשׁ 的关系
  choice: 译作两个并列描述：“明智的人，有寻求上帝的人”
  alternative: 将二者合并为“明智地寻求上帝的人”
  rationale: 原文可将第二个分词看作对前者的并列或进一步说明；保留重复的“人”维持诗句张力，不擅自把两者合并成单一条件。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“俯察”保留诗体色彩；其余措辞避免文言化。
