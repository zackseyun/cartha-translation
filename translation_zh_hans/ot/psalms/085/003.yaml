  text: אָסַ֥פְתָּ כָל עֶבְרָתֶ֑/ךָ הֱ֝שִׁיב֗וֹתָ מֵ/חֲר֥וֹן אַפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/003.yaml
  text: You withdrew all your wrath[a]; you turned back from the burning of your anger.
translation:
  language: zh_hans
  text: 你收回了一切震怒；你转离了你烈怒的火焰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָסַפְתָּ
  choice: 收回了
  rationale: אָסַף本义包括“聚集、收取、除去”。以“震怒”为宾语时，译作“收回”自然地表达撤去怒气，同时保留主动收取的意象。
- source_word: כָל
  choice: 一切
  rationale: 准确表达“全部、所有”，强调震怒被完全收回。
- source_word: עֶבְרָתֶךָ
  choice: 你的震怒
  rationale: עֶבְרָה表示强烈、涌发的怒气；“震怒”符合诗歌的庄重语体，也清楚传达其强度。
- source_word: הֱשִׁיבוֹתָ
  choice: 你止住了
  rationale: 这是שׁוּב的使役式，基本意象为“使返回、使转回”；在本句与מִן连用，表示使怒气退回、不再发作。“止住”在现代汉语中自然，同时不过度解释为情绪上的悔改。
- source_word: מֵחֲרוֹן
  choice: 如火的
  rationale: חָרוֹן源于灼热、燃烧的意象，用来加强怒气。“如火”保留其热力隐喻，并与汉语搭配自然。
- source_word: אַפֶּךָ
  choice: 你的怒气
  rationale: אַף本义为“鼻子”，在此惯用义为“怒气”。译出其语境义，燃烧的形象则由“如火”保留。
theological_decisions:
- issue: 如何表达上帝发怒的拟人和热力意象
  choice: 保留“如火的怒气”的鲜明意象
  alternative: 将整句抽象化为“你息去了烈怒”
  rationale: 原文用灼热意象描述上帝的怒气。译文不把审判性的怒气弱化为抽象的不悦，也避免机械直译“鼻子的燃烧”。
- issue: הֱשִׁיבוֹתָ的主宾关系与表达方式
  choice: 译为“你止住了你如火的怒气”
  alternative: 你转离了你如火的怒气
  rationale: 希伯来语使役式可表达使怒气转回或退去；汉语“止住”保留上帝主动使怒气不再发作的含义，也避免“转离自己的怒气”在汉语中的生硬与潜在误解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；两分句保持平行。“震怒／怒气”对应原文两个相关但不同的怒词，避免无谓重复，同时保留第二分句的燃烧意象。
