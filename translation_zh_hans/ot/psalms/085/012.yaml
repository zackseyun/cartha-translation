source:
  edition: WLC
  text: גַּם יְ֭הוָה יִתֵּ֣ן הַ/טּ֑וֹב וְ֝/אַרְצֵ֗/נוּ תִּתֵּ֥ן יְבוּלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/012.yaml
  text: Indeed[a], Yahweh will give what is good, and our land will yield its produce.
translation:
  language: zh_hans
  text: 雅威必定赐下美善[a]；我们的土地必结出土产。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那美善的事物”或“美好的事物”。希伯来语这一表达含义宽泛，在本段语境中可包括道德层面的美善和物质层面的福祉。
    reason: 词义有多种可能，需保留原文的宽泛性。
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: גַּם既可表示递进或附加，也可带强调意味。本句承接上文的应许；汉语用“也”自然衔接，并保留其附加义，而不把强调程度定得过死。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音译作“雅威”，保留经文中的专名，不以称号替代。
- source_word: יִתֵּן
  choice: 必赐
  rationale: 未完成式在此表达预期将实现的行动；“必赐”既传达将来意味，也符合诗歌中确信的语气。
- source_word: הַטּוֹב
  choice: 美善
  rationale: 带定冠词的טוֹב可泛指“那美善的”或“美好的事物”。“美善”保留其可涵盖道德与物质福祉的宽度，避免仅理解为农产或财富。
- source_word: וְאַרְצֵנוּ
  choice: 我们的土地
  rationale: אֶרֶץ在本句农业语境中指百姓的土地；译为“我们的土地”清楚自然。
- source_word: תִּתֵּן
  choice: 必结出
  rationale: 原义为“必给出”；用于土地与出产的搭配时，“必结出”是自然的汉语表达，也保留土地带来收成的图景。
- source_word: יְבוּלָהּ
  choice: 土产
  rationale: יְבוּל指土地的出产或收成。“土产”简洁地表达农业产出，且不局限于某一种作物。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”较贴近其通行学术拟音，并保留这是专名而非“主”等称号。
- issue: הַטּוֹב所指的范围
  choice: 美善
  alternative: 福分／美好的事物
  rationale: 原文可指抽象的美善，也可指具体的美好事物或福祉。正文采用较宽泛的“美善”，不把它限定为物质丰收，也不排除本句农业语境中的物质恩惠。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威必赐美善”保持诗体的凝练；分号呈现神赐美善与土地出产之间紧密而并列的关系。
