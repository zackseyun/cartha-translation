source:
  edition: WLC
  text: אֶשְׁמְעָ֗ה מַה יְדַבֵּר֮ הָ/אֵ֪ל יְה֫וָ֥ה כִּ֤י יְדַבֵּ֬ר שָׁל֗וֹם אֶל עַמּ֥/וֹ וְ/אֶל חֲסִידָ֑י/ו וְֽ/אַל יָשׁ֥וּבוּ לְ/כִסְלָֽה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/008.yaml
  text: I will hear what God Yahweh will speak[a], for he will speak peace to his people and to his faithful ones[b]; but let them not turn back to folly.
translation:
  language: zh_hans
  text: 我要听上帝——雅威将要说什么，因为他必向他的子民和忠信的人[a]说平安的话；愿他们不要再转向愚妄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的圣民”或“敬虔的人”。
    reason: lexical_alternative
  - marker: b
    text: “愚妄”或译“愚蠢”；另有较不可能的解释作“自恃”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁמְעָה
  choice: 我要听
  rationale: 该词为带意愿色彩的形式，表达诗人的决意；“我要听”既保留其意愿语气，也符合现代汉语表达。
- source_word: הָאֵל יְהוָה
  choice: 上帝雅威
  rationale: 原文同时包含表示“上帝”的 אֵל 和神名 יהוה；译文保留两个成分，以“雅威”音译神名。
- source_word: מַה יְדַבֵּר
  choice: 要说什么
  rationale: 未完成式在此指上帝即将说的话；这一译法也保留了与后一个 יְדַבֵּר 的呼应。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出诗人倾听的理由：他之所以倾听，是因为上帝要宣告平安。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: “平安”是 שָׁלוֹם 的常用对应词，也能涵盖安康、完整与关系和好的宽广含义。
- source_word: חֲסִידָיו
  choice: 忠信的人
  rationale: 该词指以忠诚、敬虔回应上帝慈爱的人；“忠信的人”保留其关系性和伦理意味，又避免赋予“圣徒”后期的专门含义。
- source_word: וְאַל יָשׁוּבוּ
  choice: 但愿他们不要再转向
  rationale: אַל 与未完成式构成禁止或劝诫语气；“但愿……不要”保留了警告而非单纯预言的力量，“再转向”则体现 יָשׁוּבוּ 的返回、复归之意。
- source_word: לְכִסְלָה
  choice: 转向愚妄
  rationale: כִסְלָה 通常表示愚妄或愚蠢，在此最自然地指蒙受平安之后又回到悖逆而无知的行为。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译为“雅威”可明确保留其作为上帝立约之名的性质，而不以称号替代。
- issue: חֲסִידָיו 所指的人
  choice: 忠信的人
  alternative: 圣民；敬虔的人
  rationale: 译文保留他们对上帝忠诚、敬虔的关系性含义，不把该词限定为后期教会传统中的技术性称谓。
- issue: 末句的语气
  choice: 劝诫或警告：但愿他们不要再转向愚妄
  alternative: 陈述或应许：他们必不再转向愚妄
  rationale: אַל 与未完成式强烈支持禁止或劝诫语气。这样也保留了经文中的张力：上帝宣告平安，他的子民仍受警戒，不可重陷愚妄。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宣告平安”准确传达“向……说平安”的希伯来语表达，同时避免生硬直译；末句使用“但愿”保留劝诫语气及其神学张力。
