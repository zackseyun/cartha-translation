source:
  edition: WLC
  text: אֱ֭מֶת מֵ/אֶ֣רֶץ תִּצְמָ֑ח וְ֝/צֶ֗דֶק מִ/שָּׁמַ֥יִם נִשְׁקָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/011.yaml
  text: Truth will spring up from the earth[b][a], and righteousness will look down from heaven.
translation:
  language: zh_hans
  text: 信实[a]要从地上萌发，公义[b]要从天上俯视。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“真理”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: 信实
  rationale: אֱמֶת可指真实、真理、忠信或可靠。诗篇85篇的语境强调盟约性的忠信与公义相会；“信实”既自然，又保留其关系与品格层面的含义。“真理”仍是合理译法，列入脚注。
- source_word: מֵאֶרֶץ
  choice: 从地上
  rationale: אֶרֶץ可指地、土地或大地。这里与“从天上”构成上下对应，“从地上”在现代汉语中简洁自然，并保留宇宙性的诗歌意象。
- source_word: תִּצְמָח
  choice: 萌发
  rationale: צמח描写植物发芽、生长。“萌发”保留植物意象，也适合抽象名词“信实”作主语的诗体表达。
- source_word: צֶדֶק
  choice: 公义
  rationale: צֶדֶק兼有公义、正义、公正等含义。此处作为与“信实”并列的拟人格化品格，“公义”较能涵盖广泛的道德正直；“正义”作为可行译法保留在脚注。
- source_word: מִשָּׁמַיִם
  choice: 从天上
  rationale: שָׁמַיִם可指天、诸天或天空。与“地上”相对时，“天上”是自然的现代汉语，并保留经文的神学诗意。
- source_word: נִשְׁקָף
  choice: 俯视
  rationale: שׁקף的尼法勒式常表示从高处向外或向下观看。“俯视”凝练地保留方向感和将公义人格化的意象，胜于较弱的“显现”。
theological_decisions:
- issue: אֱמֶת在复兴诗歌语境中应译为“信实”还是“真理”
  choice: 信实
  alternative: 真理
  rationale: 两者都在该词的语义范围内。结合本诗相邻经节中品格彼此相遇的图景，“信实”更突出可靠、忠诚的品格；脚注保留“真理”，避免排除客观真实这一层含义。
- issue: צֶדֶק应译为“公义”还是“正义”
  choice: 公义
  alternative: 正义
  rationale: 希伯来词可兼指道德正直和公平正义。主文采用范围较宽且符合庄重诗体的“公义”，脚注列出“正义”，以保留司法与社会公平的可能侧重。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。两个分句保持希伯来诗歌的平行结构：“从地上／从天上”与“萌发／俯视”相互呼应，并保留抽象品格的拟人格化意象。
