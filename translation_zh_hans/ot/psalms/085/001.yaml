  text: רָצִ֣יתָ יְהוָ֣ה אַרְצֶ֑/ךָ שַׁ֝֗בְתָּ שבות יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/001.yaml
  text: You have shown favor to your land[a], O Yahweh; you restored the fortunes of Jacob.
translation:
  language: zh_hans
  text: 耶和华啊，你恩待了你的土地；你恢复了雅各的境况。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你使雅各从被掳之地归回了”，或“你使雅各被掳的人归回了”。这个希伯来语惯用语既可指从流亡或被掳中归回，也可泛指境况得到扭转和恢复。
    reason: alternative_reading
lexical_decisions:
- source_word: רָצִיתָ
  choice: 恩待了
  rationale: רצה在此表示对某人或某物悦纳、施恩。“恩待了”符合现代汉语表达，并保留上帝向其土地施予恩惠的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名的通行音译“耶和华”，将其作为专名而非称号处理。
- source_word: אַרְצֶךָ
  choice: 你的土地
  rationale: אֶרֶץ在这里指归属于耶和华、与其子民相关的土地，很可能是以色列之地；“土地”既自然，也避免“国家”所带有的现代政治含义。
- source_word: שַׁבְתָּ שבות
  choice: 使……的境况复原
  rationale: שׁוּב שְׁבוּת是一个可表示恢复原状、扭转处境的惯用语。“使……的境况复原”传达其较宽泛的含义，同时不把经文限定为从被掳之地归回。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 按原文保留“雅各”这一名称；此处是诗歌中对以色列民族的整体称呼。
theological_decisions:
- issue: שׁוּב שְׁבוּת יַעֲקֹב这一惯用语的含义
  choice: 你使雅各的境况复原了
  alternative: 你使被掳的雅各归回了／你使雅各被掳的人归回了
  rationale: 该希伯来语惯用语既可泛指处境逆转、恢复原状，也可能唤起被掳归回的具体图景。正文采用较宽泛的译法，脚注保留与被掳和归回有关的理解，以免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耶和华啊”自然呈现呼语；分号保留两个平行诗句的结构。正文避免使用容易被理解为财富的“命运/福分”，以“境况复原”表达整体恢复，并用脚注保存被掳归回的可能含义。
