id: PSA.85.6
reference: Psalms 85:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲֽ/לֹא אַ֭תָּה תָּשׁ֣וּב תְּחַיֵּ֑/נוּ וְ֝/עַמְּ/ךָ֗ יִשְׂמְחוּ בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/006.yaml
  text: Will you not return and revive us[b][a], so that your people may rejoice in you?
translation:
  language: zh_hans
  text: 你岂不回转，使我们复苏[a][b]，好让你的子民因你欢喜吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回转”也可译作“返回”或“再次转回”；这里可能指上帝重新眷顾他的子民。
    reason: lexical_alternative
  - marker: b
    text: “使我们复苏”也可译作“再次赐我们生命”或“使我们活过来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 岂不……吗
  rationale: 保留原文期待肯定回答的反问形式，也传达祈求中的盼望。
- source_word: תָּשׁוּב
  choice: 回转
  rationale: שוב 基本义为“返回、回转”；此处主语是上帝，语境可能指他重新眷顾子民，但正文不补出原文未明说的“向我们”或“施恩”。
- source_word: תְּחַיֵּנוּ
  choice: 使我们复苏
  rationale: חיה 的 Piel 形表达“使活、恢复生机”；“使我们复苏”在群体祷告中自然，并保留身体、属灵及群体恢复等较宽泛的含义。
- source_word: וְעַמְּךָ
  choice: 好让你的子民
  rationale: 将连接词按上下文译为目的或结果关系，使现代汉语流畅，同时保留“你的子民”这一归属表达。
- source_word: יִשְׂמְחוּ
  choice: 欢喜
  rationale: 未完成式在此随祈求表达所盼望的结果；与“好让”连用，准确体现目的或结果语气。
- source_word: בָךְ
  choice: 因你
  rationale: 介词 בּ 与“欢喜”连用时可表示欢喜所系的对象或缘由；“因你欢喜”是自然的现代汉语，也保持欢喜以上帝为中心。
theological_decisions:
- issue: 是否明确上帝“回转”就是重新施恩或转向子民
  choice: 正文仅译“回转”
  alternative: 转向我们；重新施恩
  rationale: 语境支持重新眷顾之意，但原文未明说方向或“恩惠”，故保留隐喻和一定的开放性。
- issue: “使我们复苏”是否专指属灵复兴
  choice: 保留广义的“复苏”
  alternative: 使我们灵性复兴；恢复我们的民族生活
  rationale: 本诗涉及受审判后的群体恢复，但原文的使役动词含义较宽，不宜限定为纯属灵或纯政治性的复兴。
- issue: בָךְ 应译为“因你”还是“在你里面”
  choice: 因你
  alternative: 在你里面；以你为乐
  rationale: 希伯来语可表达以上帝为欢喜的对象或缘由；“因你欢喜”在现代汉语中自然，且不额外加入“以……为乐”的解释性成分。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“岂不……吗”保留诗歌祷告的反问语气；“子民”体现群体与归属关系。脚注标记按相关词语的出现顺序置于正文。
