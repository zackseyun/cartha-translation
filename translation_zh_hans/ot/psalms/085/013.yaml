  text: צֶ֭דֶק לְ/פָנָ֣י/ו יְהַלֵּ֑ךְ וְ/יָשֵׂ֖ם לְ/דֶ֣רֶךְ פְּעָמָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/013.yaml
  text: Righteousness will go before him and will make a path for his steps.
translation:
  language: zh_hans
  text: 公义必行在他前面，为他的脚步铺设道路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可译作：“公义必行在他前面，并使他的脚步成为道路。”
    reason: 希伯来语末句结构简练，可理解为“为他的脚步铺路”，也可较直译为“把他的脚步设为道路”；脚注保留这一真实歧义。
lexical_decisions:
- source_word: צֶדֶק
  choice: 公义
  rationale: 保留该词在诗篇中的道德与关系性内涵，并与本段的慈爱、信实、平安等拟人化主题相呼应。
- source_word: לְפָנָיו יְהַלֵּךְ
  choice: 必行在他前面
  rationale: 直接表达“在他面前行走／走在他前面”；“必”体现未完成式在此处的将来或确定语气。
- source_word: וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו
  choice: 为他的脚步铺设道路
  rationale: 用自然汉语表达希伯来语较为压缩的结构，即公义在他前面行，为他的脚步安排或预备道路，同时不把“他”具体指认为某一称谓。
theological_decisions:
- issue: 第二分句的主语
  choice: 承接“公义”，即公义为“他”的脚步铺路
  alternative: 以“他”（上帝）为主语，即他使自己的脚步成为道路
  rationale: 希伯来文动词“行”和“铺设”均为阳性单数，最自然的语法衔接是以“公义”为共同主语；但原文省略第二个主语，仍存在句法张力。
- issue: “他的脚步”所指
  choice: 保留代词“他”
  alternative: 明确译为“上帝／耶和华的脚步”
  rationale: 原文使用第三人称代词，虽然上下文很可能指向耶和华，正文仍保留原文表达，避免补入未明说的称谓。
translation_notes:
  register: 采用庄重而通顺的现代汉语。“铺设道路”比“造一条路”更贴合走在前面、为随后脚步预备路径的诗歌意象；正文中的脚注标记与脚注相对应。
