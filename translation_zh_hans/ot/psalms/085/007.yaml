  text: הַרְאֵ֣/נוּ יְהוָ֣ה חַסְדֶּ֑/ךָ וְ֝/יֶשְׁעֲ/ךָ֗ תִּתֶּן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/007.yaml
  text: Show us your steadfast love[a], O Yahweh, and grant us your salvation.
translation:
  language: zh_hans
  text: 雅威啊，求你让我们看见你的慈爱[a]，将你的救恩赐给我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向我们显明你的慈爱。”
    reason: 原词是使役式，可表达“使我们看见”，在汉语中也可自然理解为“向我们显明”。
lexical_decisions:
- source_word: הַרְאֵנוּ
  choice: 让我们看见
  rationale: 这是 ראה 的使役式祈使句，带第一人称复数后缀，直译为“使我们看见”。译作“求你让我们看见”既保留使役含义和祈求语气，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”是现代汉语中对该神名的常见音译，保留其专名性质，而不以称号替代。
- source_word: חַסְדֶּךָ
  choice: 你的慈爱
  rationale: חסד 表达坚定、忠诚而施恩的爱；“慈爱”在中文诗歌与信仰语境中自然庄重，并兼顾仁慈与爱的含义。其忠贞、持久的色彩由上下文承载，避免加入原文未明说的“盟约”等限定。
- source_word: וְיֶשְׁעֲךָ
  choice: 你的救恩
  rationale: ישע 可指拯救、解救；“救恩”保留其宽广的神学与诗歌含义，也适合向上帝祈求的语境。
- source_word: תִּתֶּן לָנוּ
  choice: 赐给我们
  rationale: נתן 加间接受词直译为“给我们”；“赐给我们”准确表达上帝的给予，并保持祷告语言的庄重自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用的是上帝的专名而非“主”这一称号。“雅威”按较通行的学术重构音译神名，保留原文的专名性质；“耶和华”虽在中文传统中更为熟悉，但源于较晚形成的混合读法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”补明汉语祈求语气；句式保持希伯来诗句中两个并列请求的结构。
