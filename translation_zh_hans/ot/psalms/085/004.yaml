  text: שׁ֭וּבֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ וְ/הָפֵ֖ר כַּֽעַסְ/ךָ֣ עִמָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/004.yaml
  text: Restore us[a], God of our salvation, and put away your anger from us.
translation:
  language: zh_hans
  text: 求你复兴我们[a]，拯救我们的神啊！求你止息对我们的怒气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使我们回转。”希伯来语动词更直译是“使我们返回”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבֵנוּ
  choice: 复兴我们
  rationale: 这是שׁוב的使役式命令式，直译可作“使我们回转”。结合本诗从神的震怒转向重新施恩的语境，“复兴我们”自然表达神使其子民恢复原有光景的恳求，同时以脚注保留“使我们回转”的字面可能。
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: 拯救我们的神
  rationale: 该结构直译为“我们救恩的神”。现代汉语用“拯救我们的神”更自然，也保留神是其子民拯救之源的含义。
- source_word: וְהָפֵר
  choice: 止息
  rationale: פרר的使役式可表示废除、破除或使之停止；以“怒气”为宾语时，“止息”准确、庄重地表达使怒气不再持续。
- source_word: כַּעַסְךָ
  choice: 怒气
  rationale: כעס在此指神的愤怒；“怒气”是清楚、自然且符合诗歌祈祷语体的译法。
- source_word: עִמָּנוּ
  choice: 对我们的
  rationale: 介词עם通常表示“与……同在”，但与止息怒气的表达连用时，汉语自然理解为神“对我们的怒气”；这样处理关系明确，又不增添“敌对”等原文未明说的概念。
theological_decisions:
- issue: 开头的祈求应侧重道德回转，还是神使群体恢复
  choice: 复兴我们
  alternative: 使我们回转
  rationale: 使役式突出行动由神发起，而全诗语境也关乎神重新施恩、恢复其子民。“复兴我们”不把祈求仅限于内在悔改；脚注则保留原动词“返回、回转”的真实语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“拯救我们的神”比“我们救恩的神”更符合自然现代汉语；两个“求你”形成清晰的平行祈求。
