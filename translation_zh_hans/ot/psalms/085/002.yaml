  text: נָ֭שָׂאתָ עֲוֺ֣ן עַמֶּ֑/ךָ כִּסִּ֖יתָ כָל חַטָּאתָ֣/ם סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/002.yaml
  text: You forgave the iniquity of your people[a]; you covered all their sin[b]. Selah
translation:
  language: zh_hans
  text: 你赦免了你子民的罪孽[a]，遮盖了他们的一切罪[b]。细拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“你担起了”或“你带走了你子民的罪孽”。希伯来文以举起、承担或带走罪孽的意象表达赦免。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们所有的罪过”。希伯来文使用带复数所属后缀的单数名词，既可集合地译为“罪”，也可分配地译为“罪过”。
    reason: alternative_reading
lexical_decisions:
- source_word: נָשָׂאתָ
  choice: 赦免了
  rationale: 该动词本义为“举起、承担、带走”，与“罪孽”连用时构成赦免罪孽的惯用表达；正文译出其语境意义，脚注保留“担起、除去”的具体意象。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: 此词可指罪孽、罪责或罪的后果；这里与赦免惯用语连用，译作“罪孽”既保留道德分量，也与后句的“罪”有所区别。
- source_word: עַמֶּךָ
  choice: 你的子民
  rationale: 在上帝与群体的关系语境中，“子民”自然表达其归属和关系意味。
- source_word: כִּסִּיתָ
  choice: 遮盖了
  rationale: 保留“覆盖、遮盖”的原文比喻，同时在诗篇的赦罪语境中传达罪不再被追究的意味。
- source_word: כָל
  choice: 一切
  rationale: 准确表达整体范围，并与集合意义的“罪”自然搭配。
- source_word: חַטָּאתָם
  choice: 他们一切的罪
  rationale: 原文是单数名词加第三人称复数后缀，可作集合意义理解；“罪”保留其单数形式，“罪过”则为可接受的分配性表达。此处与“罪孽”平行，不宜解作“赎罪祭”。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切含义不明，采用传统音译，避免加入“停顿”或“间奏”等未经确定的解释。
theological_decisions:
- issue: 如何表达 נָשָׂא עָוֹן 的赦罪惯用语
  choice: 你赦免了你子民的罪孽
  alternative: 你担起了你子民的罪孽；你除去了你子民的罪责
  rationale: 正文用“赦免”清楚表达该惯用语在本节中的意义，但脚注保留原文“举起、承担或带走”的意象，不把其神学张力限定为某一种具体机制。
- issue: חַטָּאתָם 应译为集合单数还是分配性复数
  choice: 他们一切的罪
  alternative: 他们所有的罪过
  rationale: 希伯来文采用单数名词配复数所属后缀，可指群体整体的罪，也可分配地指众多罪行；正文保留集合单数，脚注说明另一种合法理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“赦免”明确传达惯用语的主要语义，“遮盖”保留原文意象；“细拉”沿用通行音译并加括号，表现其诗歌或礼仪标记性质。
