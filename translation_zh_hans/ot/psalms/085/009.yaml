  text: אַ֤ךְ קָר֣וֹב לִ/ירֵאָ֣י/ו יִשְׁע֑/וֹ לִ/שְׁכֹּ֖ן כָּב֣וֹד בְּ/אַרְצֵֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/009.yaml
  text: Surely his salvation is near to those who fear him[b][a], so that glory may dwell in our land.
translation:
  language: zh_hans
  text: 他的救恩确实临近那些敬畏他的人，为使荣耀住在我们的地上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”可能指上帝显现的同在，也可能指这地重新获得的尊荣。
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: 确实
  rationale: 此处作强调肯定语气，而非严格限定；“确实”自然传达其郑重断言。
- source_word: קָרוֹב
  choice: 临近
  rationale: 表达空间或情势上的接近，也符合诗歌中救恩将近的语境。
- source_word: לִירֵאָיו
  choice: 敬畏他的人
  rationale: 保留 ירא 所含对上帝既敬且畏的宗教含义，不弱化为单纯尊敬。
- source_word: יִשְׁעוֹ
  choice: 他的拯救
  rationale: ישׁע 表示拯救、救助或得救；“他的拯救”保留宽广的神学含义及原文所属关系。
- source_word: לִשְׁכֹּן
  choice: 使……住在
  rationale: 带 ל 的不定式可表达目的或结果；“使……住在”在汉语中保留这一关系，同时不把目的与结果区分得过死。
- source_word: כָּבוֹד
  choice: 荣耀
  rationale: “荣耀”保留该词的诗意和神学分量，并不限定为上帝显现的临在或土地恢复的尊荣。
- source_word: בְּאַרְצֵנוּ
  choice: 在我们的地上
  rationale: 此处 אֶרֶץ 指诗人群体所属之地；“我们的地”比“全地”更符合上下文。
theological_decisions:
- issue: “荣耀”（כָּבוֹד）的所指
  choice: 正文只译作“荣耀”，不明说其所指
  alternative: 上帝显明的荣耀或临在；这地恢复的尊荣
  rationale: 希伯来文有意保持开放性；采用概括性译法可保存其神学张力，避免替原文作出单一解释。
- issue: לִשְׁכֹּן 所表达的是目的还是结果
  choice: 译为“使荣耀住在”，容纳目的与结果两种色彩
  alternative: “好让荣耀住在”；“以致荣耀住在”
  rationale: 原文结构可兼有目的和结果意味，正文不宜过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“敬畏”保留圣经宗教语境中的敬与畏；“住在”照应原文的居住意象。脚注仅说明“荣耀”所指的真实歧义。
