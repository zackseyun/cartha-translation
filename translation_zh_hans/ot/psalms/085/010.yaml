  text: Steadfast love and truth have met[b][a]; righteousness and peace have kissed.
translation:
  language: zh_hans
  text: 慈爱与信实[a]相遇；公义[b]与平安彼此亲吻。
  philosophy: optimal-equivalence
  footnotes:
