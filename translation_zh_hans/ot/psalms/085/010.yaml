    reason: lexical_alternative
  - marker: b
    text: “公义”或译“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 该词常指坚定、忠诚而持久的爱；“慈爱”在现代中文圣经语体中自然庄重，也保留其关系性与恩慈色彩，而不把含义局限为一般怜悯。
- source_word: אֱמֶת
  choice: 真理
  rationale: 该词可指真理、真实或信实。此处选“真理”，与拟人化诗句搭配自然，并保留较宽的语义范围；“信实”列入脚注。
- source_word: נִפְגָּשׁוּ
  choice: 相遇
  rationale: Nifal完成式复数表示相会、相遇。“相遇”简洁地保留两种品格被拟人化并彼此会合的图景。
- source_word: צֶדֶק
  choice: 公义
  rationale: 该词可表达公义或正义。这里以抽象品格拟人化，“公义”既庄重自然，也保留道德与关系秩序的含义；“正义”作为可行译法列入脚注。
- source_word: שָׁלוֹם
  choice: 和平
  rationale: 该词涵盖和平、完整与福祉。“和平”最直接、易懂，并适合与“公义”并列拟人化，同时不排除更丰满的希伯来语意蕴。
- source_word: נָשָׁקוּ
  choice: 彼此亲吻
  rationale: Qal完成式复数意为亲吻。中文若只说“亲吻”容易显得宾语残缺，译作“彼此亲吻”自然明确，并完整保留原文大胆的拟人图像。
theological_decisions:
- issue: 盟约性与道德性品格的拟人化
  choice: 照原文保留“相遇”和“彼此亲吻”的诗性拟人
  alternative: 意译为“和谐共存”“彼此结合”或“得以调和”
  rationale: 原文让这些抽象品格像行动者一样相会、亲吻。直译能保留复兴图景中的诗意和神学张力，不额外断定它们如何结合或调和。
translation_notes:
  register: 采用现代、庄重且易懂的诗歌语体；两个分句结构平衡。保留原文完成式所描绘的相会图景，但中文不强加英语式“已经”。脚注标记紧随对应词语，避免英文咨询层中标记位置与释词错配的问题。
