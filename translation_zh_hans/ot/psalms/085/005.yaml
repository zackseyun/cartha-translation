  text: הַ/לְ/עוֹלָ֥ם תֶּֽאֱנַף בָּ֑/נוּ תִּמְשֹׁ֥ךְ אַ֝פְּ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/005.yaml
  text: Will you be angry with us forever? Will you prolong your anger from generation to generation?[a][b]
translation:
  language: zh_hans
  text: 你要永远向我们发怒吗？你要使你的怒气延续到世世代代吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “延续”直译为“拉长”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָם
  choice: 永远
  rationale: 疑问词 הַ 与 לְעוֹלָם 连用，构成“要永远……吗”的反问；“永远”在现代汉语中自然简洁。
- source_word: תֶּאֱנַף בָּנוּ
  choice: 向我们发怒
  rationale: אנף 表示“发怒”，其后介词 בְּ 标明怒气所针对的对象；汉语“向我们发怒”既自然，也保留针对性的语义。
- source_word: תִּמְשֹׁךְ
  choice: 延续
  rationale: משך 本义为“拉长、拖长”，在此以怒气为宾语，表示使怒气在时间上持续；“延续”准确而自然。
- source_word: אַפְּךָ
  choice: 你的怒气
  rationale: אַף 本义为“鼻子”，并惯用来表示“怒气”；上下文明确要求其转义。
- source_word: לְדֹר וָדֹר
  choice: 直到世世代代
  rationale: 该希伯来语惯用语表示连续不断的各代；配合“延续”，译作“直到世世代代”符合汉语句法，并保留跨越历代的时间幅度。
theological_decisions:
- issue: 对上帝发怒的拟人性表达
  choice: 保留“发怒”和“怒气”
  alternative: 译为较弱的“不悦”或抽象的“敌对”
  rationale: 原文两次明确使用表示怒气的词语。直陈上帝的怒气，保留了哀歌中的神学张力，不加弱化或教义化解释。
- issue: 怒气延续时间的反问
  choice: 译为两个直接反问句
  alternative: 将其处理为断言或祈求，如“求你不要永远发怒”
  rationale: 原文形式是反问。保留问句可呈现诗人既忧惧又呼求的语气，而不替原文明确回答。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“向我们发怒”比照搬英语式“对我们生气”更凝练，也准确体现介词 בְּ 的对象意义；第二句以“直到世世代代”自然表达怒气被拉长、跨越历代的意象。
