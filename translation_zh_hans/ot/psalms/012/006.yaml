  yaml_path: translation/ot/psalms/012/006.yaml
  text: The words of Yahweh are pure words[a], like silver refined in a furnace on the earth[b], purified seven times.
translation:
  language: zh_hans
  text: 耶和华的话语是纯净的话语，如同在地上[b]的熔炉[a]中炼过、精炼了七次的银子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坩埚”或“熔炼锅”。这个希伯来词很少见，确切所指不能确定，但上下文显然采用冶金意象。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“在地上”。这短语可能说明冶炼的地点或环境，其确切意味不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמֲרוֹת / אֲמָרוֹת
  choice: 话语
  rationale: 两个同源名词在诗句中重复，泛指所说的话；译作“话语”自然、庄重，并保留原文的重复，不把含义缩窄为“应许”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的形式音译以色列上帝的专名，避免用称号取代原文中的专名。
- source_word: טְהֹרוֹת
  choice: 纯净
  rationale: 该词表示洁净、纯粹；“纯净”既适合描述话语，也与下文炼银的比喻相呼应。
- source_word: כֶּסֶף
  choice: 银子
  rationale: 该名词明确指银；“银子”在现代中文经文诗歌语体中自然易懂。
- source_word: צָרוּף
  choice: 炼过
  rationale: 该被动形式描述银已经历冶炼或精炼；“炼过”清楚表达其过程，并避免与后面的“精炼”机械重复。
- source_word: בַּעֲלִיל
  choice: 在熔炉中
  rationale: 此罕见词的确切所指不明，但银和提纯的语境显示它属于冶金意象；正文采用易懂的“熔炉”，脚注保留“坩埚、熔炼锅”等可能。
- source_word: לָאָרֶץ
  choice: 在地上
  rationale: 该短语句法和确切意味有争议；较直译的“在地上”保留地点或场景上的开放性，不擅自解释为“为大地”或“在泥炉中”。
- source_word: מְזֻקָּק
  choice: 精炼
  rationale: 该分词继续并加强炼银的意象；“精炼”表达去除杂质而达到纯净。
- source_word: שִׁבְעָתָיִם
  choice: 七次
  rationale: 直译为“七次”，既透明地呈现希伯来文，也保留七所表达的彻底、完全意味，而不把象征含义直接写入正文。
theological_decisions:
- issue: 耶和华话语之纯净的性质
  choice: 按原文宣告耶和华所说的话完全纯净，并以反复精炼的银作比喻。
  alternative: 将其仅限于道德上的纯洁，或扩展为有关后世文本保存方式的教义陈述。
  rationale: 本节明确陈述话语的纯净，并用冶金意象强调其毫无杂质、可靠；译文不应把诗句缩窄，也不应加入本节没有明说的后期教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。保留“话语……话语”的原文重复和“炼过／精炼”的递进冶金意象；对罕见词及“在地上”的句法疑点以脚注说明，不在正文中强行消除歧义。
