lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给诗班长
  rationale: 在诗篇题注中，此词通常指负责音乐演出的领班；“交给诗班长”简洁自然，也保留礼仪和音乐语境。
- source_word: עַל
  choice: 按
  rationale: 题注中常用来引出曲调、演奏方式或音乐设定；“按”既简洁，又不把具体所指说得过死。
- source_word: הַשְּׁמִינִית
  choice: “第八”
  rationale: 原词字面意为“第八”，但具体可能是曲调、乐器、音域或礼仪用语；加引号把它标示为专名式的音乐用语，同时保留原文的不确定性。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 此处是诗篇题注中的体裁名称；现代中文圣经语境以“诗”表达自然、庄重。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 可表示作者、归属、关联或献给某人；“大卫的”比“大卫所作”更能保留这种开放性。
theological_decisions:
- issue: 题注中 לְדָוִד 所表达的大卫与本诗的关系
  choice: 大卫的诗
  alternative: 大卫所作的诗；献给大卫的诗
  rationale: 希伯来文并未限定为作者关系，也可能表示归属、关联或献呈；正文采用较宽泛的“的”，脚注说明其他可能，避免替原文解决历史与作者问题。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇题注体。“交给诗班长”点明音乐职能；“第八”保留原文术语的不透明性，并借脚注解释；“大卫的诗”有意不把 לְ 的关系限定为作者身份。
