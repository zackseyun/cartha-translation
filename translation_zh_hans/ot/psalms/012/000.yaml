  text: 交给乐长，按“第八”[a]。大卫的诗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“第八”；可能是音乐或礼仪用语，或指某种曲调、乐器或八度音域。传统音译为“示米尼特”。
    reason: cultural_note
  - marker: b
