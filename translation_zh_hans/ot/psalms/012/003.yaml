  text: יַכְרֵ֣ת יְ֭הוָה כָּל שִׂפְתֵ֣י חֲלָק֑וֹת לָ֝שׁ֗וֹן מְדַבֶּ֥רֶת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/003.yaml
  text: May Yahweh cut off all flattering lips[b][a], the tongue that speaks great things.
translation:
  language: zh_hans
  text: 愿雅威剪除一切谄媚的嘴唇[a]，和说大话的舌头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“光滑的嘴唇”，形容圆滑、谄媚的言语。
    reason: lexical_alternative
  - marker: b
    text: 直译“说大事”；在这里指夸口、自大的言论。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְרֵת
  choice: 愿……剪除
  rationale: כרת 的使役未完成式在这里自然表达祈愿或咒诅；“愿……剪除”既保留“切断、除掉”的意象，也符合诗歌语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留原文所用的专名，而不以称号代替。
- source_word: כָּל שִׂפְתֵי חֲלָקוֹת
  choice: 一切谄媚的嘴唇
  rationale: 原文直译近于“一切光滑的嘴唇”；“谄媚”自然传达圆滑、讨好而带欺骗性的言语，同时以脚注保留原有意象。
- source_word: לָשׁוֹן
  choice: 舌头
  rationale: 保留原文由复数“嘴唇”转为单数“舌头”的鲜明身体意象和集合性表达，不改写为泛称的“人”。
- source_word: מְדַבֶּרֶת גְּדֹלוֹת
  choice: 说大话的
  rationale: “说大话”在现代汉语中自然表达夸口、自大的话，也较贴近原文“说宏大的事”的字面措辞；脚注说明其含义范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的四字神名；译作“雅威”旨在按其较普遍接受的读音音译，并保留专名性质。
- issue: יַכְרֵת 的语气
  choice: 愿雅威剪除
  alternative: 雅威必剪除
  rationale: 该未完成式可理解为祈愿，也可能被读作对未来行动的陈述；本诗语境中，祈愿语气较自然，但不将其扩写为更具体的刑罚。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“剪除”保留诗篇咒诅式祈愿的力度；“嘴唇”和“舌头”保留希伯来诗歌的身体意象及单复数转换。
