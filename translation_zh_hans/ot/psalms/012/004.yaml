  yaml_path: translation/ot/psalms/012/004.yaml
  text: who say[a], “With our tongue we will prevail[d][c][b]; our lips are with us—who is lord over us?”
translation:
  language: zh_hans
  text: 他们说：“我们凭舌头必能得胜[a]；我们的嘴唇在我们这边[b]——谁是我们的主人[c]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凭舌头必能得胜”也可译作“借着我们的舌头，我们必得胜”。希伯来语中的介词可理解为工具用法。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我们的嘴唇与我们同在”，也可理解为“我们的嘴唇属于自己”或“我们的嘴唇由自己掌握”。
    reason: lexical_alternative
  - marker: c
    text: “主人”也可译作“主宰”或“管辖者”；这里是普通的权柄称谓，并非神名。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: 他们说
  rationale: אֲשֶׁר承接上一节所说的人，אָמרו虽为完成式，在诗歌中刻画他们一贯的言论；现代汉语用“他们说”自然连贯。
- source_word: לִלְשֹׁנֵנוּ
  choice: 凭舌头
  rationale: 将前缀ל理解为工具用法，表示他们以言语作为争胜的手段，同时保留“舌头”的具体意象。
- source_word: נַגְבִּיר
  choice: 必能得胜
  rationale: גבר的使役形在此表达逞强、占优势或胜过对方；“必能得胜”传达夸口的语气，又不把对象补得过于具体。
- source_word: שְׂפָתֵינוּ
  choice: 我们的嘴唇
  rationale: 保留希伯来诗歌以“嘴唇”指言语能力的具体意象。
- source_word: אִתָּנוּ
  choice: 在我们这边
  rationale: 原文直译为“与我们同在”；此译既可表达嘴唇受自己支配，也可表达嘴唇是自己的优势，并以脚注保留其他理解。
- source_word: מִי אָדוֹן לָנוּ
  choice: 谁能作我们的主
  rationale: אָדוֹן在此泛指主人或掌权者，并非神名；“谁能作我们的主”自然表达他们否认任何权柄辖制自己的挑衅。
theological_decisions:
- issue: אָדוֹן是否应译作神的专称
  choice: 主
  alternative: 主人；谁能管辖我们
  rationale: 本句没有使用耶和华的名，אָדוֹן是普通权柄称谓。译作“主”保留其广义，不将说话者否认的权柄预先限定为神，同时上下文仍可让读者体会其属灵含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“凭舌头”“嘴唇”保留原文并列的人体意象；“在我们这边”保留אִתָּנוּ在拥有、掌控和助力之间的语义张力。破折号突出末句的傲慢反问。
