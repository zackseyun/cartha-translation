  text: הוֹשִׁ֣יעָ/ה יְ֭הוָה כִּי גָמַ֣ר חָסִ֑יד כִּי פַ֥סּוּ אֱ֝מוּנִ֗ים מִ/בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: Save[a], O Yahweh, for the godly are gone[b]; for the faithful have vanished from among the sons of man.
translation:
  language: zh_hans
  text: 耶和华啊，求你拯救！因为敬虔的人已不复存在[a]；忠信的人已从世人中消失[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已不复存在”也可译作“不再有”或“已经消逝”。原文“敬虔的人”为单数形式，也可能具有群体性含义。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从人的众子中”，是指人类社会的惯用说法。
    reason: cultural_note
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: 求你拯救
  rationale: 这是向上帝发出的祈使呼求；“求你拯救”在现代汉语祷告语体中自然、直接，也保留了原文的急迫感。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的音译呈现四字神名，避免用头衔替代原文专名。
- source_word: גָמַר חָסִיד
  choice: 敬虔的人已经绝迹
  rationale: גמר表示终止、耗尽或不复存在；חסיד指以忠贞、敬虔为特征的人。汉语“敬虔的人”不强行限定单数或复数，适合保留此处形式上的单数与群体性理解之间的张力。
- source_word: פַסּוּ אֱמוּנִים
  choice: 忠信的人已……消失
  rationale: פסס表达止息、消逝；אמונים为复数，指忠实、可靠的人。“忠信的人”兼顾其伦理和关系层面的含义。
- source_word: מִבְּנֵי אָדָם
  choice: 从世人中
  rationale: 原文字面为“从人的众子中”，在此是指人类社会的惯用表达；“从世人中”简洁自然，并保留“从……当中”的结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是四字神名的音译；采用“耶和华”是因其在现代中文圣经传统及普通读者中辨识度更高，同时仍将其作为专名而非头衔处理。
- issue: חָסִיד 的单数形式与群体性含义
  choice: 敬虔的人
  alternative: 敬虔者／那个敬虔的人
  rationale: 原文为阳性单数，但在诗歌哀叹中可作集合性或代表性用法。汉语“敬虔的人”在数上可保持开放，不把经文限定为某一个男子，也不抹去原文形式。
- issue: חָסִיד 与 אֱמוּנִים 的语义区分
  choice: 敬虔的人／忠信的人
  alternative: 忠贞者／可靠的人
  rationale: 前者侧重对上帝的虔敬与忠贞，后者侧重忠实可靠；分别翻译可保留诗句的同义呼应而不将两词完全等同。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以感叹号表现开篇呼求的急迫，后半句保留希伯来诗歌的平行结构；避免生硬照搬“人的众子”，同时用脚注说明原文意象。
