  text: סָבִ֗יב רְשָׁעִ֥ים יִתְהַלָּכ֑וּ/ן כְּ/רֻ֥ם זֻ֝לּ֗וּת לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/008.yaml
  text: The wicked walk all around[b][a], when vileness is exalted among the sons of man.
translation:
  language: zh_hans
  text: 恶人四处游荡；卑劣之事在人间受尊崇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在人间”原文直译为“在人之子中间”，泛指人类。全句也可译作：“当卑劣之事在人类中受尊崇时，恶人便四处游荡。”
    reason: 说明希伯来语的人类泛称，并保留时间性句法的另一种自然译法。
lexical_decisions:
- source_word: סָבִיב
  choice: 四处
  rationale: 作副词修饰“游荡”，表达周围各处、到处活动之意，符合现代汉语习惯。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是指邪恶之人的复数实体用法；“恶人”简洁、庄重，也不额外限定性别。
- source_word: יִתְהַלָּכוּן
  choice: 游荡
  rationale: הלך 的 Hitpael 形态表示来回行走、四处活动。“游荡”保留移动图景，也比“潜行”少一层掠食性的解释。
- source_word: כְּרֻם
  choice: 受尊崇
  rationale: 该结构较为困难；结合语境，将 כְּ 理解为伴随或时间情境，即卑劣之事被抬高时。“受尊崇”自然表达被高举、被推崇。分号保留两个分句之间可理解为伴随、时间或因果背景的张力，不把关系限定为单一连词。
- source_word: זֻלּוּת
  choice: 卑劣之事
  rationale: 该名词指低贱、无价值或道德上可鄙之物；“卑劣之事”在现代汉语中清楚传达其道德意味，同时避免将其误解为单指人的品格。
- source_word: לִבְנֵי אָדָם
  choice: 在人间
  rationale: 字面为“在人之子中间”，实指人类社会。“在人间”自然、凝练地表达群体范围，不把希伯来语的通性所指误限于男性；字面形式收入脚注。
theological_decisions:
- issue: לִבְנֵי אָדָם 的人类学表达
  choice: 在人间
  alternative: 在人之子中间／在人类中间
  rationale: 希伯来语使用阳性代表性表达，但所指泛指人类。正文采用自然且不误限性别的“在人间”，脚注保留其字面形式。
- issue: 两分句之间的逻辑关系
  choice: 用分号并列，保留情境关系的开放性
  alternative: 当卑劣之事在人间受尊崇时，恶人便四处游荡
  rationale: כְּרֻם 可表达时间或伴随情境，甚至容许读者感受到一定的因果关联。正文不用“当”或“因为”强行锁定其中一种关系。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“四处游荡”保留行动意象；分号使诗句紧凑，并避免过度解释两个分句的逻辑关系。
