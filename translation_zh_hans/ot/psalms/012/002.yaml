  text: 人人都向邻舍说虚妄的话；用谄媚的嘴唇[a]，怀着二心[b]说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用圆滑的嘴唇”；希伯来文描绘言语圆滑、谄媚，因而带有欺骗性。
