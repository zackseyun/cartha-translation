lexical_decisions:
- source_word: שָׁוְא
  choice: 虚妄的话
  rationale: 该词可指空虚、虚假或无价值之物。“虚妄的话”既符合言语语境，又保留其不仅限于事实性谎言的较宽语义。
- source_word: יְדַבְּרוּ / יְדַבֵּרוּ
  choice: 说……话 / 说话
  rationale: 两处均保留“说”的重复，以反映希伯来诗句的首尾呼应和对败坏言语的强调。
- source_word: אִישׁ אֶת רֵעֵהוּ
  choice: 人人都向邻舍
  rationale: אִישׁ在此作分配用法；“人人”自然传达“各人”的普遍性。רֵעֵהוּ译作“邻舍”，保留群体成员彼此交往的社会含义。
- source_word: שְׂפַת חֲלָקוֹת
  choice: 谄媚的嘴唇
  rationale: 原文意象直指“光滑的嘴唇”，用来形容圆滑、讨好而具有欺骗性的言语。“谄媚的嘴唇”在中文中自然，并保留身体意象。
- source_word: בְּלֵב וָלֵב
  choice: 怀着二心
  rationale: 原文字面为“以心和心”，表示内心不一、虚伪欺诈。“怀着二心”是简洁而庄重的中文表达，保留“心”的意象和原文的含混张力。
