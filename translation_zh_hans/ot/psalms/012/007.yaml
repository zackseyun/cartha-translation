  yaml_path: translation/ot/psalms/012/007.yaml
  text: You[a], O Yahweh, will keep them; you will guard us from this generation forever.
translation:
  language: zh_hans
  text: 你，耶和华啊，必保守他们；你必护卫他[a]，使他永远免受这世代的害。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里从复数（“保守他们”）转为单数（“护卫他”）；有些译本将后一句协调为“护卫他们”。
    reason: 说明原文代词数的变化及另一种译法。
lexical_decisions:
- source_word: אַתָּה
  choice: 唯有你
  rationale: 独立的第二人称阳性单数代词置于句首，带有强调意味；译作“唯有你”可在现代汉语中自然体现这一强调。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以一般称号替代。
- source_word: תִּשְׁמְרֵם
  choice: 必保守他们
  rationale: שׁמר在此表示保守、看顾；保留第三人称阳性复数后缀“他们”。
- source_word: תִּצְּרֶנּוּ
  choice: 必护卫他
  rationale: נצר表示护卫、守护；马所拉文本的后缀为第三人称阳性单数，因此保留“他”，不与前句复数代词协调。
- source_word: מִן הַדּוֹר זּוּ
  choice: 使他免受这世代的侵害
  rationale: מִן在保护语境中表示“使……免受”；הַדּוֹר זּוּ直译为“这世代”。补出“侵害”使汉语关系清楚，但不具体限定侵害形式。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 在诗歌和祷告语境中自然表达持续不止的时间。
theological_decisions:
- issue: 两个动词宾语的数发生变化（“他们”转为“他”）
  choice: 正文保留马所拉文本的变化：“保守他们……护卫他”
  alternative: 协调为复数：“保守他们……护卫他们”；或解释为“护卫他们每一个人”
  rationale: 希伯来文本先用复数后缀，随后改用阳性单数后缀，形成真实的语法张力。译文不暗中消除这一变化，也不在正文中断定单数所指。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华啊”保留呼告语气，“唯有你”体现句首独立代词的强调。正文保留原文复数转单数的张力，并用脚注提示读者。
