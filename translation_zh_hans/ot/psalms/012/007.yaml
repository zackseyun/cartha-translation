  to: 你，耶和华啊，必保守他们；你必护卫他[a]，使他永远免受这世代的害。
  rationale: 修订仅去除“唯有”所增加的排他含义，并将末句调整为更自然的现代汉语。保留“他们……他”的数变化、神名“耶和华”、保护意象及“永远”的持续性；脚注继续提示文本张力而不替读者作解释性裁断。
