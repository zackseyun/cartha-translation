source:
  edition: WLC
  text: מִ/שֹּׁ֥ד עֲנִיִּים֮ מֵ/אַנְקַ֪ת אֶבְי֫וֹנִ֥ים עַתָּ֣ה אָ֭קוּם יֹאמַ֣ר יְהוָ֑ה אָשִׁ֥ית בְּ֝/יֵ֗שַׁע יָפִ֥יחַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/005.yaml
  text: Because of the devastation of the poor[a], because of the groaning of the needy, now I will arise, says Yahweh; I will set him in the safety for which he longs.
translation:
  language: zh_hans
  text: '“因贫苦人遭受蹂躏，

    因穷乏人发出呻吟，

    现在我要起来，”耶和华说，

    “我要把他安置在他所渴望的安稳之处。”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句的希伯来原文含义不易确定。较直译可作：“我要安置在安全之中；他为此喘息般地急切渴望。”也有人理解为：“我要把他安置在安全之中，免受那向他喷气、嗤鼻之人的侵害。”
    reason: alternative_reading
lexical_decisions:
- source_word: מִשֹּׁד עֲנִיִּים
  choice: 因贫苦人遭受蹂躏
  rationale: מִן在此与下句构成平行，最自然地表示原因；שֹׁד指毁坏、暴行或掠夺。“遭受蹂躏”以自然汉语表达贫苦人受到的破坏性压迫，同时保留其严重程度。עֲנִיִּים兼有贫穷与受苦之意，译作“贫苦人”。
- source_word: מֵאַנְקַת אֶבְיוֹנִים
  choice: 因穷乏人发出呻吟
  rationale: מִן仍取原因义；אֲנָקָה指痛苦中发出的呻吟。אֶבְיוֹנִים强调缺乏和需要，译作“穷乏人”，以保留与“贫苦人”的诗意平行而不完全同词。
- source_word: עַתָּה אָקוּם
  choice: 现在我要起来
  rationale: “现在”保留行动的即时性；“起来”保留神拟人化地起身干预的意象。未完成体在此表达即将采取的行动。
- source_word: יֹאמַר יְהוָה
  choice: 耶和华说
  rationale: 将圣名音译为现代中文通行的“耶和华”，不以称号替代；语序符合庄重而自然的现代汉语引语格式。
- source_word: אָשִׁית בְּיֵשַׁע
  choice: 我要把他安置在……安全之中
  rationale: שׂים意为放置、安置；יֵשַׁע可指拯救、解救或安全，在此表示被安置进入的受保护状态，故译为“安全之中”。补出宾语“他”是依据后面的לוֹ及语境作出的自然汉语表达。
- source_word: יָפִיחַ לוֹ
  choice: 他所渴望的
  rationale: 该短语含义困难。正文采用פוח表示喘求、渴望的理解，并把לוֹ与受压迫者关联，形成“他所渴望的安全”。其他较直译的分析保留在脚注中，以免掩盖原文歧义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉、且作为专名而非称号的“耶和华”；“雅威”是较接近学术重构发音的另一音译。此选择不改变该词作为以色列之神专名的性质。
- issue: 末句的主语、指代与意义
  choice: 把受压迫者安置在他所渴望的安全之中
  alternative: “我要安置在安全之中；他为此喘求”，或“我要把他安置在安全之中，使他脱离向他喷气威吓的人”
  rationale: 希伯来语יָפִיחַ לוֹ句法和词义均有争议。正文选择在上下文中较连贯的“渴望”义，但用脚注明示更直译及敌对者解释的可能，不把疑难处定为唯一神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言，并以分行和引号呈现耶和华的直接发言。“贫苦人／穷乏人”保留原文近义平行；正文力求流畅，脚注则保留末句真实的文本与释义歧义。
