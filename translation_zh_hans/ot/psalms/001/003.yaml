id: PSA.1.3
reference: Psalms 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְֽ/הָיָ֗ה כְּ/עֵץ֮ שָׁת֪וּל עַֽל פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨/וֹ יִתֵּ֬ן בְּ/עִתּ֗/וֹ וְ/עָלֵ֥/הוּ לֹֽא יִבּ֑וֹל וְ/כֹ֖ל אֲשֶׁר יַעֲשֶׂ֣ה יַצְלִֽיחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/003.yaml
  text: He will be like a tree planted by streams of water[a], which yields its fruit in its season, and its leaf does not wither; in all that he does, he prospers.
translation:
  language: zh_hans
  text: 他要像一棵栽在溪水旁的树，按时结果子，叶子也不枯萎；他所做的一切，都顺利。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他无论做什么，都亨通。”希伯来语末句也可理解为以这个人为主语。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: 他要像
  rationale: 连词加完成式在本诗语境中承接上文，表达结果或前景；与比较前缀 כְּ 合译为“他要像”，自然且保留诗句推进。
- source_word: כְּעֵץ שָׁתוּל
  choice: 像一棵栽……的树
  rationale: כְּ 表示比较；שָׁתוּל 是被动分词，指被有意安置、栽种的树。“栽”简洁自然，并保留被栽植的意味。
- source_word: עַל פַלְגֵי מָיִם
  choice: 在溪水旁
  rationale: פַלְגֵי מָיִם 可指水流、水渠或分流的水道；“溪水旁”保留水源充足的图景，也符合现代汉语诗体表达。
- source_word: פִּרְיוֹ יִתֵּן
  choice: 结果子
  rationale: 希伯来文直译为“给出它的果子”；汉语说树“结果子”最自然，准确表达其生产果实。
- source_word: בְּעִתּוֹ
  choice: 按时
  rationale: 指在属于它的时节或适当的时候；“按时”简明，并保留合宜、既定时机的含义。
- source_word: וְעָלֵהוּ לֹא יִבּוֹל
  choice: 叶子也不枯萎
  rationale: עָלֵהוּ 为单数集合用法，可自然译作“叶子”；יבל 表示植物枯萎、凋残。
- source_word: וְכֹל אֲשֶׁר יַעֲשֶׂה יַצְלִיחַ
  choice: 他所做的一切，都顺利
  rationale: 保留“他所做的一切”的完整范围，并将 יַצְלִיחַ 理解为其所做之事进展顺利；该句法也可理解为人在一切所做的事上亨通，故以脚注保存另一种表达。
theological_decisions:
- issue: 末句 יַצְלִיחַ 的主语及成功所归属的对象
  choice: “他所做的一切，都顺利”，以“他所做的一切”为末句主语。
  alternative: “他无论做什么，都亨通”，以蒙福之人为承接的主语。
  rationale: 希伯来语允许把 כֹל אֲשֶׁר יַעֲשֶׂה 直接视为动词主语，也允许把人物理解为承接的主语。正文采用较贴近表层句法的读法，脚注保留以人为主语的合理读法，不把诗中的张力解释成绝对无条件的物质成功。
translation_notes:
  register: 采用现代、庄重而易懂的汉语；整体保持树、水、果子和叶子的具体诗歌意象。“顺利”避免生硬，“亨通”留在脚注中以呈现传统而合理的另一种句法理解。
