  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הָ/אִ֗ישׁ אֲשֶׁ֤ר לֹ֥א הָלַךְ֮ בַּ/עֲצַ֪ת רְשָׁ֫עִ֥ים וּ/בְ/דֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּ/בְ/מוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָֽׁב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/001.yaml
  text: Blessed is the man who does not walk in the counsel of the wicked[a], nor stand in the way of sinners[c][b], nor sit in the seat of scoffers.
translation:
  language: zh_hans
  text: '不随恶人的计谋而行，

    不站在罪人的道路上，

    不坐在讥诮者的座位上，

    这样的人[a]有福了！[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“那人”，是阳性单数；这里泛指具备这些特征的典范人物，并非只指男性。
    reason: cultural_note
  - marker: b
    text: 或译：“这样的人多么幸福！”原文的称福语表示一种真正可庆幸、蒙福的境况，不只是快乐的情绪。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是希伯来语智慧文学中的称福句式，表达一个人处于真正可庆幸、蒙福的佳境，不只是主观感到快乐。
- source_word: הָאִישׁ
  choice: 这样的人
  rationale: 原文是阳性单数，指本节所刻画的典范人物；中文用“这样的人”既保留单数代表性，也避免把适用范围误限于男性。
- source_word: הָלַךְ
  choice: 听从
  rationale: 与“计谋”搭配时，希伯来语“行走”意指依循或接受其引导。译作“听从”使现代汉语自然，同时后两项仍保留站、坐的递进意象。
- source_word: בַּעֲצַת
  choice: 计谋
  rationale: 兼有谋议、劝告和指导方针之意；在恶人的语境中，“计谋”比“劝告”更贴切。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 准确表达智慧文学中行为和道德上邪恶的人，不额外加入仅指不敬虔的宗教限定。
- source_word: דֶרֶךְ
  choice: 道路
  rationale: 保留具体路径与生活方式的双重意象，是诗篇智慧传统中的核心比喻。
- source_word: חַטָּאִים
  choice: 罪人
  rationale: 直接对应原文复数实词化用法，简洁而符合现代中文圣经语体。
- source_word: עָמָד
  choice: 站
  rationale: 保留原文由行走到站立、再到坐下的逐步停驻意象。
- source_word: מוֹשַׁב
  choice: 座位
  rationale: 该词可指座位、聚会或居所；“座位”最能与“坐”呼应并保存具体图像。
- source_word: לֵצִים
  choice: 讥诮者
  rationale: 指以嘲弄、轻蔑为特征的人；“讥诮者”庄重且准确，“嘲讽者”是较口语化的可选译法。
- source_word: יָשָׁב
  choice: 坐
  rationale: 保留具体动作，并完成行走、站立、坐下的诗性递进。
theological_decisions:
- issue: 智慧文学中的代表性阳性单数
  choice: 这样的人
  alternative: 那男人／那人
  rationale: 原文 הָאִישׁ 为阳性单数，但在此具有典范和代表作用，并非只论男性。现代汉语“这样的人”保留单数所指，又不造成性别范围的误解。
- issue: 称福语的含义
  choice: 有福了
  alternative: 多么幸福／真有福
  rationale: “有福”保留客观、整体的佳境及智慧文学的庄重感，不把含义缩减为一时的快乐情绪。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文，分行呈现三重否定和平行结构。把称福句置于末行，符合自然汉语的信息推进；保留“道路—站—座位—坐”的空间意象。
