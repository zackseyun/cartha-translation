  text: כִּֽי יוֹדֵ֣עַ יְ֭הוָה דֶּ֣רֶךְ צַדִּיקִ֑ים וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/006.yaml
  text: For Yahweh knows the way of the righteous[a], but the way of the wicked will perish.
translation:
  language: zh_hans
  text: 因为耶和华知道义人的道路[a]，恶人的道路却必灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“看顾”。希伯来文“知道”在这里可能含有关系上的眷顾或认可，不只是知晓。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明两种结局之所以不同的原因，保留希伯来语的解释性语气。
- source_word: יֹדֵעַ
  choice: 知道
  rationale: 直接对应 ידע 的基本词义，同时保留其在本语境中可能包含的眷顾、认可等关系性含义，避免在正文中过度阐释。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中通行的专名形式，明确表达希伯来文四字神名。
- source_word: דֶּרֶךְ
  choice: 道路
  rationale: 既可指人的生活方式，也可指其人生进程和最终走向；在两分句中重复使用，以保留原文平行结构。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 自然表达作名词用的复数形容词，保留智慧文学中的道德类别。
- source_word: וְ
  choice: 却
  rationale: 原词形式上是连接词“和”，但上下两行构成鲜明对比；“却”能自然表达这种转折关系。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 自然、通行地表达该词所指的邪恶之人，并与“义人”形成对照。
- source_word: תֹּאבֵד
  choice: 必灭亡
  rationale: 保留 אבד 的不及物意义，表明恶人的道路终将归于败亡；“必”自然传达未完成式在此处的确定将来意义。
theological_decisions:
- issue: 耶和华“知道”的含义
  choice: 正文译作“知道”，暗含关系性的眷顾或认可，但不把该含义直接写入正文。
  alternative: 耶和华看顾义人的道路；耶和华认可义人的道路。
  rationale: 此动词在盟约和关系语境中可能不只是认知事实，也可含眷顾、认可之意；然而“知道”最贴近原词，并能保留其神学张力与语义空间。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“义人的道路／恶人的道路”保留原文的重复和平行对照；“知道”配脚注，以兼顾形式对应和语境中的关系性含义。
