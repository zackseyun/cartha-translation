base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/002.yaml
  text: But his delight is in the law of Yahweh[b][a], and on his law he meditates day and night.
translation:
  language: zh_hans
  text: 惟有以耶和华的训诲[a]为乐，昼夜默想[b]他的训诲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲”也可译作“律法”。这里的希伯来语可泛指耶和华所赐的教导，并不限于法律条文。
    reason: lexical_alternative
  - marker: b
    text: “默想”所译的希伯来语也可指低声诵念或喃喃吟咏，包含反复思想之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 惟
  rationale: 承接第1节连续的否定，表达鲜明的转折和排他性；“惟”简洁庄重，意为“却只”。
- source_word: בְּתוֹרַת
  choice: 耶和华的训诲
  rationale: תּוֹרָה在智慧诗语境中不只指法规，也指上帝所赐的教导；“训诲”保留其广义，并适合现代汉语诗体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译四字神名，保留其专名性质，而不以称号替代。
- source_word: חֶפְצוֹ
  choice: 喜爱
  rationale: 原词指所喜悦、所乐于追求之事；汉语以动词“喜爱”自然表达此人的内在倾向，避免生硬的“喜悦在于”。
- source_word: וּבְתוֹרָתוֹ
  choice: 他的训诲
  rationale: 代词后缀最自然地回指耶和华；重复“训诲”保留希伯来文的平行与强调。
- source_word: יֶהְגֶּה
  choice: 低声诵念
  rationale: הגה兼有默想、低声念诵或喃喃吟咏之意；“低声诵念”较直接呈现其可听见的口诵色彩，同时不排除思想揣摩。
- source_word: יוֹמָם וָלָיְלָה
  choice: 昼夜
  rationale: 直接保留“白昼与黑夜”的首尾并举，表达持续不断，也保持诗句凝练。
theological_decisions:
- issue: 智慧诗中תּוֹרָה的译法
  choice: 训诲
  alternative: 律法
  rationale: 此词可包含律例，却不限于法律条文；在本节中指耶和华所启示、供人持续诵念遵行的教导。“训诲”避免不必要地缩窄词义，并以脚注保留传统译法。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列上帝的专名。正文保留专名而非改作“主”；采用现代简体中文圣经传统中最通行、最易辨识的“耶和华”，同时承认古代读音无法完全确定。
- issue: הגה所表达的操练方式
  choice: 低声诵念
  alternative: 默想
  rationale: 该动词可同时涉及口中低声念诵和内心思量。正文呈现较具体的低声诵读意象，脚注说明其中也含反复思想之意，避免将两方面割裂。
translation_notes:
  register: 采用凝练、庄重而可懂的现代标准汉语。“惟……昼夜……”保留诗歌节奏；“低声诵念”呈现原文具体意象，脚注补足“默想”的语义。所有脚注标记均置于正文对应词语之后。
