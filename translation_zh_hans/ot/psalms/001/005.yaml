source:
  edition: WLC
  text: עַל כֵּ֤ן לֹא יָקֻ֣מוּ רְ֭שָׁעִים בַּ/מִּשְׁפָּ֑ט וְ֝/חַטָּאִ֗ים בַּ/עֲדַ֥ת צַדִּיקִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/005.yaml
  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
translation:
  language: zh_hans
  text: 因此，恶人必不能在审判中站立[a]；罪人也不能在义人的会众中站立[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在审判时”。希伯来文可泛指司法性的审断，既可能涉及现世的裁断，也可能涉及最终的审判。
    reason: lexical_alternative
  - marker: b
    text: “会众”也可译作“集会”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 自然、简洁地表达本句从上文所得出的结论。
- source_word: יָקֻמוּ
  choice: 站立／立足
  rationale: 保留קום“站立”的形象，并传达在审判或群体中无法站得住的含义；后半句按汉语习惯补出“立足”，使省略的平行谓语清楚自然。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 符合智慧文学中的道德类别，也与“义人”形成鲜明对照。
- source_word: בַּמִּשְׁפָּט
  choice: 在审判中
  rationale: 保留מִשְׁפָּט的司法含义，同时不限定为现世审断或末日审判。
- source_word: חַטָּאִים
  choice: 罪人
  rationale: 直接表达那些以犯罪为特征的人，并与前句“恶人”构成平行。
- source_word: בַּעֲדַת
  choice: 在……的会众中
  rationale: עֵדָה指聚集而成的共同体；“会众”庄重而易懂，比泛化的“在……中间”更能保留群体意象。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 是简洁、通行的圣经用语，保留其道德与群体身份含义。
theological_decisions:
- issue: “审判”的范围
  choice: 译为不加限定的“审判”
  alternative: 现世的司法审断；末日的终极审判
  rationale: 希伯来文可泛指司法性的裁断，诗篇的智慧文学语境可能兼容现世与终极的追究，因此不在正文中排他性地确定其所指。
- issue: 恶人在义人会众中的处境
  choice: 补出平行谓语“立足”
  alternative: 直译为“罪人也不在义人的会众中”
  rationale: 原文后半句省略了与前半句共享的谓语；汉语补出“立足”既显明平行结构，也不额外规定他们是被排除、被定罪还是不能存留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必不能”表达未完成式在此处的确定性结果；“站立／立足”保留诗句的司法与群体双重意象。脚注标记依正文出现顺序排列。
