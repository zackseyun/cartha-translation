source:
  edition: WLC
  text: לֹא כֵ֥ן הָ/רְשָׁעִ֑ים כִּ֥י אִם כַּ֝/מֹּ֗ץ אֲֽשֶׁר תִּדְּפֶ֥/נּוּ רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/004.yaml
  text: Not so the wicked; rather[a], they are like chaff that the wind drives away.
translation:
  language: zh_hans
  text: 恶人却不是这样，反而像糠秕，被风吹散。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被风吹走”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: 却不是这样
  rationale: 保留希伯来文简短有力的否定，并自然承接上一节义人如树的比喻；“却”明确表达对比，而不补足原文省略的内容。
- source_word: הָרְשָׁעִים
  choice: 恶人
  rationale: 这是智慧文学中自然且通行的译法，指行为与品格邪恶的人，不局限于法律意义上的有罪者。
- source_word: כִּי אִם
  choice: 反而
  rationale: 该词组引出强烈的纠正性对比：恶人并非如上一节的树，而是像糠秕。
- source_word: כַּמֹּץ
  choice: 像糠秕
  rationale: מֹץ 指谷物脱粒扬场后被分离的轻薄废屑；“糠秕”准确保留农业意象，也适合庄重的诗歌语体。
- source_word: אֲשֶׁר
  choice: 被
  rationale: 将希伯来文关系从句自然转换为现代汉语被动结构，使“风”仍是驱散糠秕的施事者，不改变原意。
- source_word: תִּדְּפֶנּוּ
  choice: 吹散
  rationale: נדף 在此表示被风吹走、驱散；“吹散”兼顾风的作用与糠秕四散无定的图景。
- source_word: רוּחַ
  choice: 风
  rationale: 扬场的农业比喻明确要求具体义“风”，而不是“气息”或“灵”。
