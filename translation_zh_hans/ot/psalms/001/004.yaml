translation_notes:
  register: 采用现代、凝练而庄重的诗歌语言。“恶人却不是这样”保留原文突兀的对照；“糠秕”虽略具传统色彩，但在此农业意象中准确清楚。脚注标记置于整句末，说明动词的可行译法。
