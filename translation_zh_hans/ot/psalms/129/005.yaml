  text: יֵ֭בֹשׁוּ וְ/יִסֹּ֣גוּ אָח֑וֹר כֹּ֝֗ל שֹׂנְאֵ֥י צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/005.yaml
  text: May all who hate Zion be put to shame and turned backward[a].
translation:
  language: zh_hans
  text: 愿所有恨锡安的人都蒙羞退后。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有恨锡安的人都必蒙羞退后。”希伯来文的动词形式也可理解为对未来的陈述，而非祈愿。
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: 蒙羞
  rationale: בוש常表示遭受羞耻或落得羞愧；“蒙羞”简洁庄重，也能自然承载此处祈愿或咒诅式语气。
- source_word: וְיִסֹּגוּ
  choice: 退后
  rationale: 该动词表示后退、退却；“退后”自然贴合敌对者受挫的语境，又不额外指定使其后退的行动者。
- source_word: אָחוֹר
  choice: 后
  rationale: 此副词意为向后，与动词合译为“退后”，避免生硬重复，同时完整表达方向。
- source_word: כֹּל
  choice: 所有
  rationale: 直接表达全称范围，符合现代汉语习惯。
- source_word: שֹׂנְאֵי
  choice: 恨……的人
  rationale: 将希伯来语分词结构译成自然的汉语关系结构，保留持续敌视的含义。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经语境中通行的专名译法。
theological_decisions:
- issue: 句首两个未完成式动词的祈愿／预告语气
  choice: 译作祈愿：“愿……都蒙羞退后”
  alternative: 预告：“所有恨锡安的人都必蒙羞退后”
  rationale: 诗歌语境容许将这些形式理解为祈愿或咒诅式表达；正文采用较符合上下文的祈愿读法，并以脚注保留预告未来的可能性。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“蒙羞退后”保留原文两个并列动作及其诗歌力度；正文明确采用祈愿语气，脚注保存语法上的真实歧义。
