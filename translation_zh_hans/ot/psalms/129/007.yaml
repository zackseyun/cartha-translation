  text: with which the reaper has not filled his hand[a], nor the one who gathers sheaves, his arms.
translation:
  language: zh_hans
  text: 收割的人抓不满一把，捆禾的人也抱不满一怀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一怀”也可译作“胸前”“怀中”或“衣襟”；指收拢禾秆时在身前承托或兜纳禾秆的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁלֹּא
  choice: 用它……不
  rationale: 关系词加否定承接上一节的“房顶上的草”；“用它”在现代汉语中自然地明示所指，又保留本句与上文的从属联系。
- source_word: מִלֵּא
  choice: 装不满
  rationale: 该动词意为“使充满”。希伯来语完成式在这里描写这种草通常造成的结果；汉语用“装不满”自然表达，不必机械标示时态。
- source_word: כַפּוֹ
  choice: 手
  rationale: כַּף本指手掌，也可泛指手；收割场景中译作“手”简洁自然，并保留具体意象。
- source_word: קוֹצֵר
  choice: 收割的人
  rationale: 这是作名词用的分词，指从事收割者；此译清楚、通俗，也与下半句的人物称谓平行。
- source_word: וְחִצְנוֹ
  choice: 也装不满怀
  rationale: חֵצֶן可指胸怀、怀中或衣襟形成的兜纳处；这里指把禾秆聚拢在身前承托的位置。“满怀”保留身体意象并符合现代汉语习惯，其他具体可能性收入脚注。
- source_word: מְעַמֵּר
  choice: 捆禾的人
  rationale: 该分词指把割下的禾秆聚成捆或堆的人；“捆禾的人”明确呈现收获场景，并与“收割的人”形成自然对句。
