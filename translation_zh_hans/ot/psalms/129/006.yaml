  yaml_path: translation/ot/psalms/129/006.yaml
  text: May they be like grass on the rooftops[a], which withers before it grows up.
translation:
  language: zh_hans
  text: 愿他们像房顶上的草，还没被拔起[a]就枯干了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“还没长成就枯干了。”
    reason: “拔起”所对应的希伯来语动词在本诗意象中的具体含义存在解释分歧；部分译法按草尚未长成便枯萎来理解。
lexical_decisions:
- source_word: יִהְיוּ
  choice: 愿他们像……
  rationale: 此处承接上文对恨恶锡安之人的咒愿，用“愿”表达祈愿式语气，而不是一般将来时。
- source_word: כַּחֲצִיר גַּגּוֹת
  choice: 像房顶上的草
  rationale: 保留古代平顶房屋上浅土生草的具体意象；“房顶上的草”符合现代汉语习惯。
- source_word: שֶׁקַּדְמַת
  choice: 还没……就……
  rationale: 该结构表达某事在另一动作之前发生；“还没……就……”自然地突出了草过早枯干。
- source_word: שָׁלַף
  choice: 被拔起
  rationale: 该动词通常有“抽出、拔出”之意；在本句中指草尚未被人拔取，符合希伯来语较直接的词义。
- source_word: יָבֵשׁ
  choice: 枯干了
  rationale: 原词指变干、枯萎；“枯干”既准确又保留诗歌语体。
