  text: יְהוָ֥ה צַדִּ֑יק קִ֝צֵּ֗ץ עֲב֣וֹת רְשָׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/004.yaml
  text: Yahweh is righteous[a]; he has cut the cords of the wicked.
translation:
  language: zh_hans
  text: 雅威是公义的；他割断了恶人的绳索[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“粗绳”。
    reason: 希伯来词 עֲבוֹת 可指一般绳索，也可强调粗而结实的绳子。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通常汉语音译处理，保留其作为上帝专名的性质，不以称号替代。
- source_word: צַדִּיק
  choice: 是公义的
  rationale: 该形容词在此作谓语，宣告雅威的道德属性；“是公义的”在现代汉语中庄重自然，也保留了诗句的简洁。
- source_word: קִצֵּץ
  choice: 割断了
  rationale: 此动词表示砍断、切断；与“绳索”搭配时，“割断”清楚传达彻底解除捆绑的意象，并自然体现希伯来语完成式所表达的既成行动。
- source_word: עֲבוֹת
  choice: 绳索
  rationale: 该复数名词指绳子，常可特指粗绳；正文用“绳索”简洁自然，粗细方面的词义可能性留在脚注中。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 该阳性复数形容词在此名词化，泛指作恶的人；“恶人”是简洁、自然且不额外限定性别的汉语表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名。正文采用较贴近学界重构读音 Yahweh 的现代汉语音译“雅威”，而不以“主”等称号代替；“耶和华”虽是汉语传统译名，但反映的是另一种历史读法。
- issue: 雅威的“公义”与拯救行动之间的关系
  choice: 保留两个并列分句
  alternative: 译成因果关系，如“雅威因是公义的，所以割断……”
  rationale: 希伯来文只将“雅威是公义的”与“他割断了……”并置，并未明示因果连接词；并列译法保留其神学关联及原文未明说的逻辑张力。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。“割断”与“绳索”搭配自然，并保留受捆绑后获释放的意象。脚注标记置于其实际说明的“绳索”之后。
