  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת רַ֭בַּת צְרָר֣וּ/נִי מִ/נְּעוּרַ֑/י יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/001.yaml
  text: A Song of Ascents[a]. Greatly they have afflicted me from my youth—let Israel now say—
translation:
  language: zh_hans
  text: '上行之歌[a]。


    让以色列现在说：“从我年少时起，他们屡次苦害我。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上行之歌”也可理解为“登阶之歌”或与上耶路撒冷朝圣有关的歌；希伯来文标题本身只说“上行”，具体所指并不确定。本节“屡次”也可译作“极其”：原文 רַבַּת 既可强调反复发生，也可强调程度之深。
    reason: 保留标题含义和 רַבַּת 副词用法的真实歧义。
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 保留מַעֲלוֹת“上行”的字面意象和诗篇120—134篇标题的传统表达，不在正文中进一步解释为朝圣旅程。
- source_word: רַבַּת
  choice: 屡屡
  rationale: 该词在此作副词，可指反复发生，也可强调程度；“屡屡”在现代汉语中自然，并与以色列自幼以来反复受敌的语境相合，同时以脚注保留程度义。
- source_word: צְרָרוּנִי
  choice: 苦害我
  rationale: צרר在此表示敌对者施加的困苦和迫害；“苦害”既有哀歌语气，也不把含义局限为政治压迫。
- source_word: מִנְּעוּרַי
  choice: 从我幼年起
  rationale: 直接表达时间起点，并保留第一人称单数，使以色列共同体认领“我”的陈述。
- source_word: יֹאמַר נָא
  choice: 愿……现在这样说
  rationale: 用“愿”体现祈使性的号召，以“现在”传达נא在话语中的催促作用；“这样”自然引出共同体复述前句。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文通行专名；此处指受召共同宣认的以色列群体。
theological_decisions:
- issue: 共同体说话者与礼仪性号召
  choice: 先引述第一人称的受苦宣认，再以“愿以色列现在这样说”表明这是供整个以色列认领的话。
  alternative: 把“我”仅理解为一位个人说话者，后来才将其经历应用于以色列。
  rationale: 紧接着的“愿以色列……说”显示，这一第一人称陈述具有共同体用途；译文保留“我”，不直接改成“我们”，从而不消除个人声音与群体认同之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“苦害”适合诗篇哀歌语域；分行和引号明确“愿以色列说”所引述的内容，同时不改变希伯来文的第一人称单数。
