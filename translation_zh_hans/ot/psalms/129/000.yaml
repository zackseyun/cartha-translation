  yaml_path: translation/ot/psalms/129/000.yaml
  text: 'A Song of Ascents: “Greatly they have afflicted me from my youth”—let Israel now say—[a]'
translation:
  language: zh_hans
  text: '上行之歌。

    “他们从我年轻时就大大苦害我”——愿以色列这样说——[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们从我年轻时就屡屡苦害我。”希伯来语“רַבַּת”既可表示程度很深，也可表示次数很多。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 保留传统且简洁的译法；מַעֲלוֹת 可指上行、登阶或朝圣上耶路撒冷，正文不强行限定具体背景。
- source_word: רַבַּת
  choice: 大大
  rationale: 在此作副词理解，表达受苦害程度之深；同时用脚注保留其表示屡次、频繁的可能性。
- source_word: צְרָרוּנִי
  choice: 他们……苦害我
  rationale: 该动词表示敌对、压迫或使人受困；“苦害”自然地涵盖持续敌对和压迫，不额外指明施害者身份。
- source_word: מִנְּעוּרַי
  choice: 从我年轻时
  rationale: 准确表达“自我的青年时期以来”，并采用现代汉语的自然说法。
- source_word: יֹאמַר־נָא יִשְׂרָאֵל
  choice: 愿以色列这样说
  rationale: נָא 在此加强劝请语气；补出“这样”明确引出群体复诵，却不增添实质内容。
theological_decisions:
- issue: 第一人称“我”的指代
  choice: 保留“我”，不解释为个人或民族人格化
  alternative: 明确译作“我们以色列”或说明“我”代表以色列
  rationale: 原文先以第一人称单数发言，再呼吁以色列复述；保留这一张力，避免提前裁定说话者身份。
- issue: 施害者的身份
  choice: 仅译为“他们”
  alternative: 译为“仇敌”或具体历史民族
  rationale: 原文动词带复数主语但未明确命名，故不加入历史或神学上的具体认定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“上行之歌”作为诗篇标题单列；引号与破折号体现呼吁以色列复诵前句的结构。脚注标记[a]已置于正文中。
