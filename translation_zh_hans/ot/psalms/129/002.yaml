  text: רַ֭בַּת צְרָר֣וּ/נִי מִ/נְּעוּרָ֑/י גַּ֝ם לֹא יָ֥כְלוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/002.yaml
  text: Greatly they have afflicted me from my youth[b][a], yet they have not prevailed against me.
translation:
  language: zh_hans
  text: 从我年轻时，他们就屡次苦害我[a]，却没有胜过我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从我年轻时，他们就苦苦迫害我。”希伯来文开头既可强调受害次数多，也可强调程度深。
    reason: lexical_alternative
  - marker: b
    text: 或译：“却没有制服我。”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: 屡次
  rationale: 该词在这里作副词，可表示次数多或程度深。结合第1节重复的申述，“屡次”自然传达长期反复受害；脚注保留“苦苦”这一程度解法。
- source_word: צְרָרוּנִי
  choice: 他们就……苦害我
  rationale: צרר表示敌视、逼迫或使人受苦。“苦害”涵盖持续的敌对压迫，又不局限于军事攻击。
- source_word: מִנְּעוּרָי
  choice: 从我年轻时
  rationale: 保留希伯来文以年轻时期为起点、延续至今的时间表达；现代汉语自然易懂。
- source_word: גַּם
  choice: 却
  rationale: גַּם在否定句前具有让步、转折作用；“却”简洁表现虽屡受苦害仍未被制伏的反差。
- source_word: לֹא יָכְלוּ לִי
  choice: 没有胜过我
  rationale: יכל与介词ל连用，表示未能压倒或胜过某人。“没有胜过我”保留敌对较量中未能占上风的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语顺畅的诗体表达。“屡次苦害”保留长期反复受压迫的力度；句末“胜过我”简洁有力，并维持原文未说明具体施害者的概括性。
