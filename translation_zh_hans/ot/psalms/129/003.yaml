  text: Plowmen have plowed on my back[a]; they have made their furrows long.
translation:
  language: zh_hans
  text: '耕田的人在我背上[a]犁地；

    他们把自己的犁沟拉得长长的。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他们延长了自己的犁沟”。希伯来文保留耕犁的比喻，以此描绘严酷的欺压或在背上造成的创伤。
    reason: 保留英文审校记录的措辞替代，并说明隐喻，同时避免在正文中将其解释为某一种具体伤害。
lexical_decisions:
- source_word: עַל גַּבִּי
  choice: 在我背上
  rationale: 按空间意义直译，保留把受苦者的背比作田地的强烈意象。
- source_word: חָרְשׁוּ חֹרְשִׁים
  choice: 耕地的人……耕犁
  rationale: 动词与分词同源，译文用“耕地的人”和“耕犁”保留原文的重复及农业图景；“耕犁”在诗体中自然凝练。
- source_word: הֶאֱרִיכוּ
  choice: 犁出……长长的
  rationale: 该使役式表示使之延长；汉语以结果表达“犁出一道道长长的沟”，比机械直译“使……变长”自然。
- source_word: לְמַעֲנוֹתָם
  choice: 一道道长长的沟
  rationale: 此处指耕犁形成的犁沟；“一道道”使中文图像清楚，也与背上延伸的多道伤痕这一隐喻相称，但不在正文中直接解释为伤口。
theological_decisions:
- issue: 以耕犁描绘以色列所受的苦害
  choice: 正文保留“在我背上耕犁”和“长长的沟”这一完整农业隐喻。
  alternative: 直接译作“他们在我背上划出长长的伤痕”或“他们鞭打我的背”。
  rationale: 希伯来文只呈现耕地的比喻，并未明说鞭打或伤口；保留原始图像，既传达苦害的强烈程度，也不把隐喻限定为某一种具体刑罚。
translation_notes:
  register: 采用现代、庄重而具诗意的普通话。“耕地的人……耕犁”保留原文同根词的回响；分行和分号呈现希伯来诗歌的平行结构。
