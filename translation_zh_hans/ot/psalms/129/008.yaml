  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹ֤א אָֽמְר֨וּ הָ/עֹבְרִ֗ים בִּרְכַּֽת יְהוָ֥ה אֲלֵי/כֶ֑ם בֵּרַ֥כְנוּ אֶ֝תְ/כֶ֗ם בְּ/שֵׁ֣ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/008.yaml
  text: and those who pass by do not say[a], “The blessing of Yahweh be upon you; we bless you in the name of Yahweh.”
translation:
  language: zh_hans
  text: 路过的人也不说：“愿雅威[a]的福临到你们！我们奉雅威的名祝福你们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”对应希伯来文神名 YHWH（יהוה）；传统上也常译作“耶和华”，或以“主”代称。
    reason: 说明神名的原文形式及常见替代译法。
lexical_decisions:
- source_word: וְלֹא אָמְרוּ
  choice: 也不说
  rationale: 否定句承接上一节的描写；“也不说”在现代汉语中自然地表达这种延续关系，并按诗歌语境将完成式理解为一般性、典型性的陈述。
- source_word: הָעֹבְרִים
  choice: 路过的人
  rationale: 带定冠词的分词指一类经过此处的人；“路过的人”简洁自然，也保留其一般性含义。
- source_word: בִּרְכַּת יְהוָה אֲלֵיכֶם
  choice: 愿雅威的福临到你们
  rationale: 原文是省略限定动词的祝福语。“愿……临到……”补出汉语所需的祈愿语气，同时保留“雅威的福”这一名词结构。
- source_word: בֵּרַכְנוּ אֶתְכֶם
  choice: 我们……祝福你们
  rationale: 此处完成式用于实际施行祝福的惯用表达；用汉语现在时的施为句来传达说话即祝福的功能。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉雅威的名
  rationale: “奉……的名”是自然且庄重的汉语表达，兼具借其权柄和呼求其名而发言的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的学术音译呈现希伯来文四字神名，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文两次直接使用四字神名。正文采用“雅威”以呈现专名；脚注说明汉语传统译法和代称，避免把某一传统形式默认为原文的称号。
- issue: בִּרְכַּת יְהוָה אֲלֵיכֶם 的祈愿语气
  choice: 愿雅威的福临到你们
  alternative: 雅威的福在你们身上
  rationale: 希伯来文没有明写动词，形式上可以直译为名词句；但在收割场景的问候和祝福公式中具有祈愿作用，因此补入“愿”，同时不把“福”具体化为某一种恩惠。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“路过的人”保持叙述自然；两句直接引语以祝福公式呈现。保留复数“你们”，并用“奉……的名”表达传统宗教语境中的权柄与呼求含义。
