  text: כְּ/חִצִּ֥ים בְּ/יַד גִּבּ֑וֹר כֵּ֝֗ן בְּנֵ֣י הַ/נְּעוּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/004.yaml
  text: Like arrows in the hand of a warrior[a], so are the sons of one's youth.
translation:
  language: zh_hans
  text: 一个人年轻时所生的儿子，就像勇士手中的箭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“年轻时的儿子”。这里通常指一个人在年轻时所生的儿子。
    reason: 说明原文较简略的属格结构及其通常的习惯含义。
lexical_decisions:
- source_word: כְּ/חִצִּים
  choice: 箭怎样
  rationale: חִצִּים是חֵץ的复数，通常指“箭”；以“怎样”与后句“也怎样”相应，保留希伯来文的明喻结构。
- source_word: בְּ/יַד
  choice: 手中的
  rationale: בְּיַד在此表示箭处于勇士掌握和使用之下；“手中的”符合现代汉语表达。
- source_word: גִּבּוֹר
  choice: 勇士
  rationale: גִּבּוֹר可指强壮善战的人；在持箭的语境中，“勇士”既简洁又贴合军事意象。
- source_word: כֵּן
  choice: 也怎样
  rationale: כֵּן引出比喻的对应项；“怎样……也怎样”自然保留原文“如同……照样”的平衡结构。
- source_word: בְּנֵי
  choice: 儿子
  rationale: בְּנֵי是阳性复数“儿子们”的构造形式；中文集合性复数不必加“们”，译作“儿子”保留其明确的性别指向。
- source_word: הַ/נְּעוּרִים
  choice: 年轻时所生的
  rationale: נְעוּרִים本义为“青春、年轻岁月”；在“年轻时的儿子”这一关系中，按上下文自然表达为“年轻时所生的儿子”，同时以脚注说明较直译的形式。
theological_decisions:
- issue: בְּנֵי הַנְּעוּרִים的性别与关系含义
  choice: 人在年轻时所生的儿子
  alternative: 年轻时的儿子；人在年轻时所生的儿女
  rationale: 原文明确使用阳性复数“儿子”，不泛化为“儿女”。“所生的”表达该短语通常所指的出生时间关系，但脚注保留较字面的可能表达，避免把解释隐藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的格言式表达。“勇士手中的箭怎样……也怎样”保留诗句的对应结构；补出“人”使“年轻时”在汉语中有所归属。
