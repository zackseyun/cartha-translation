  text: שָׁ֤וְא לָ/כֶ֨ם מַשְׁכִּ֪ימֵי ק֡וּם מְאַֽחֲרֵי שֶׁ֗בֶת אֹ֭כְלֵי לֶ֣חֶם הָ/עֲצָבִ֑ים כֵּ֤ן יִתֵּ֖ן לִֽ/ידִיד֣/וֹ שֵׁנָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/002.yaml
  text: It is in vain for you to rise early[a], to sit up late, eating the bread of toil; for he gives sleep to his beloved.
translation:
  language: zh_hans
  text: 你们清早起来，深夜才歇息，吃劳碌得来的饭，都是徒然；因为他赐睡眠给他所爱的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他这样在睡眠中赐给他所爱的人。”希伯来文十分简练，既可指上帝赐下睡眠本身，也可指他在所爱的人睡眠时赐予。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁוְא
  choice: 都是徒然
  rationale: 表达所述辛苦奔忙的无益与枉然，并让这一判断自然涵盖前面的整个并列结构。
- source_word: מַשְׁכִּימֵי קוּם
  choice: 清早起来
  rationale: 准确传达早起之意，措辞自然简洁。
- source_word: מְאַחֲרֵי שֶׁבֶת
  choice: 深夜才歇息
  rationale: 与“清早起来”形成鲜明对照，表达延迟坐下休息、劳作到很晚；相比直译“很晚才坐下”，更符合现代汉语习惯。
- source_word: אֹכְלֵי לֶחֶם הָעֲצָבִים
  choice: 吃劳碌得来的饭
  rationale: 保留“吃饭”的意象，同时传达עֲצָבִים所含痛苦、辛劳或忧虑劳作的语义；不将其限定为单纯的悲伤。
- source_word: כֵּן
  choice: 因为
  rationale: 按上下文表达后一分句对前述徒劳奔忙所作的解释或反衬；希伯来词也可理解为“这样、照样”。
- source_word: יִתֵּן
  choice: 他赐
  rationale: 采用一般性陈述；主语承接本诗上文所指的耶和华，但不在本节明文增补神名。
- source_word: לִידִידוֹ
  choice: 给他所爱的人
  rationale: 保留单数关系和亲爱意味，同时采用普通现代读者易懂的表达。
- source_word: שֵׁנָא
  choice: 睡眠
  rationale: 主文将其理解为动词“赐”的直接宾语；原文压缩，也可能作副词性理解，相关歧义置于脚注。
theological_decisions:
- issue: כֵּן יִתֵּן לִידִידוֹ שֵׁנָא 的压缩句法
  choice: 因为他赐睡眠给他所爱的人
  alternative: 也可译作“因为他在所爱的人睡眠时仍赐给他”，或“因为他这样赐给睡着的所爱之人”
  rationale: “睡眠”既可作“赐”的直接宾语，也可能表示赐予发生于睡眠中。主文采用较自然且与前文早起晚歇形成对照的读法，脚注保留神在睡眠中赐予的可能解释，避免消除原文张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“深夜才歇息”传达原文“很晚才坐下”的劳作语境；“吃劳碌得来的饭”保留面包／饭食意象并使习语在中文中清楚。脚注标记已在正文中标出。
