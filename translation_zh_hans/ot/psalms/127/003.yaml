  text: הִנֵּ֤ה נַחֲלַ֣ת יְהוָ֣ה בָּנִ֑ים שָׂ֝כָ֗ר פְּרִ֣י הַ/בָּֽטֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/003.yaml
  text: Behold[a], children are a heritage from Yahweh, the fruit of the womb a reward.
translation:
  language: zh_hans
  text: 看哪，儿女是耶和华所赐的产业[a]；腹中的果实是赏赐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“儿女是耶和华的产业。”
    reason: 原文结构既可表示产业来自耶和华，也可表示产业属于耶和华。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意并带有感叹色彩的提示语气，同时符合现代汉语诗体经文的庄重表达。
- source_word: נַחֲלַת יְהוָה
  choice: 耶和华所赐的产业
  rationale: 该结构既可表示归属，也可表示来源；这里与下句“赏赐”平行，正文采用来源义，但以脚注保留归属义。“产业”兼顾承受之物与宝贵赠予的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式译出四字神名，不以普通称号替代。
- source_word: בָּנִים
  choice: 儿女
  rationale: 虽然原词为阳性复数，本处泛指后代，并非只指男性子嗣；“儿女”自然且准确。
- source_word: שָׂכָר
  choice: 赏赐
  rationale: 原词可指工价、报偿或奖赏；本处是正面的比喻，并与“产业”平行。“赏赐”避免过强的交易意味。
- source_word: פְּרִי הַבָּטֶן
  choice: 腹中所结的果实
  rationale: 保留“腹中之果”的诗歌意象，同时用“所结的”使表达在现代汉语中较自然，所指为胎儿或后代。
theological_decisions:
- issue: נַחֲלַת יְהוָה 的结构关系
  choice: 儿女是耶和华所赐的产业
  alternative: 儿女是耶和华的产业
  rationale: 希伯来语属格结构本身可表示来源或归属。上下句把“产业”与“赏赐”并列，较支持来源义；但归属义在语法上真实可行，因此不在正文中将其排除，而以脚注保留。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”保留诗歌中的提示语气；分号呈现两行平行关系。“腹中所结的果实”略带诗意，以保存原文比喻而不直接化约为“后代”。
