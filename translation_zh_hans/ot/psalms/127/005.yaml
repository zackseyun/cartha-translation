  text: אַשְׁרֵ֤י הַ/גֶּ֗בֶר אֲשֶׁ֤ר מִלֵּ֥א אֶת אַשְׁפָּת֗/וֹ מֵ֫/הֶ֥ם לֹֽא יֵבֹ֑שׁוּ כִּֽי יְדַבְּר֖וּ אֶת אוֹיְבִ֣ים בַּ/שָּֽׁעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/005.yaml
  text: Blessed is the man who fills his quiver with them[c][b][a]; they will not be put to shame when they speak with enemies in the gate.
translation:
  language: zh_hans
  text: 用他们装满自己箭袋的男子有福了！他们[a]在城门口[c]与仇敌说话[b]时，必不蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必不蒙羞……他……说话。”有些人认为主语只是父亲一人；但希伯来原文的两个动词都是复数。
    reason: alternative_reading
  - marker: b
    text: 也可理解为“与仇敌争辩”或“同仇敌申诉”。在这个场景中，原文动词可以带有司法或对抗意味。
    reason: lexical_alternative
  - marker: c
    text: 古代城市的城门口是公开审判和办理城务的地方。
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是智慧诗中宣告福分的惯用语；“有福了”既保留庄重语气，也比单指心理感受的“快乐”更贴近原意。
- source_word: הַגֶּבֶר
  choice: 人
  rationale: 此处指上文所说、以儿女为箭的男子或父亲。现代汉语用“……的人”构成自然的祝福句式；语境中的男性所指并未被改写。
- source_word: מִלֵּא אֶת־אַשְׁפָּתוֹ מֵהֶם
  choice: 拿他们装满箭袋
  rationale: 保留“他们”对上文儿女的回指，也延续儿女如箭的比喻；“拿……装满……”自然表达此处介词所标示的填充内容。
- source_word: לֹא יֵבֹשׁוּ
  choice: 他们必不蒙羞
  rationale: “蒙羞”体现 בושׁ 在公共场合受辱、败落的含义；依马所拉文本保留复数主语。
- source_word: כִּי
  choice: ……时
  rationale: 这里引出不蒙羞所处的情境，译为时间性的“……时”最符合汉语句法。
- source_word: יְדַבְּרוּ אֶת־אוֹיְבִים
  choice: 与仇敌说话
  rationale: 主文保留 דבר 的宽泛意义，不预先限定为诉讼、争辩或谈判；脚注说明此处可能带有对抗或司法语气。
- source_word: בַּשָּׁעַר
  choice: 在城门口
  rationale: “城门口”明确古城的公共空间，比直译“在门里”自然，同时由脚注交代其审判和城务功能。
theological_decisions:
- issue: 阳性代表性用语
  choice: 拿他们装满箭袋的人
  alternative: 拿他们装满箭袋的男子／那人
  rationale: 原文 הַגֶּבֶר 为阳性，并在上下文中指父亲；汉语“……的人”是自然的定语结构，并不否认该语境中的男性所指，也避免生硬重复。
- issue: לֹא יֵבֹשׁוּ 与 יְדַבְּרוּ 的复数主语
  choice: 他们必不蒙羞……他们……说话
  alternative: 他必不蒙羞……他……说话
  rationale: 原文两个动词都是复数，可能指父亲与众子或整个家庭。主文保留复数，不把文本中的张力化解为父亲一人的单数。
- issue: 城门场景的性质
  choice: 与仇敌说话
  alternative: 与仇敌争辩／同仇敌诉讼
  rationale: 城门背景容许司法或对抗性的理解，但动词本身仍是“说话”。主文不把可能的特定含义定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。以“有福了”保持诗篇智慧格言的语体；保留箭袋比喻、复数主语以及“说话”一词的语义宽度，并用脚注解释文本歧义和古代文化背景。
