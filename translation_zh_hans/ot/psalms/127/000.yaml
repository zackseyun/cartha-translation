base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/000.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor over it in vain. Unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: zh_hans
  text: '上行之歌，属所罗门[a]。


    若不是耶和华建造房屋[b]，

    建造它的人徒然劳力；

    若不是耶和华守护城池，

    守望者徒然警醒。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“所罗门作的”或“为所罗门而作”。希伯来文标题中的介词可表示作者、献给的对象，或与所罗门的其他关联。
    reason: alternative_reading
  - marker: b
    text: “房屋”在希伯来语中也可广义指“家室”“家族”或“王朝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 保留传统且简洁的诗篇标题译法；מַעֲלוֹת 字面涉及“上升、阶梯”，在此通常指上行之旅或相关诗歌集。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确呈现希伯来文本中的神圣四字名，而不泛化为“主”。
- source_word: בַיִת
  choice: 房屋
  rationale: 在建造者劳作的直接语境中，“房屋”最自然；同时用脚注保留其可能指家庭、家室或王朝的较广语义。
- source_word: שָׁוְא
  choice: 徒然
  rationale: 准确表达“虚空、无效、白费”的含义，并维持两行平行结构。
- source_word: שָׁקַד
  choice: 警醒
  rationale: 该动词含保持清醒、警觉之意；与“守望的人”搭配，既传达守夜不眠，也避免将其仅限于某个夜间时段。
- source_word: שׁוֹמֵר
  choice: 守望的人
  rationale: 保留单数集合性形象，指负责看守城池者；措辞自然，并与前句“建造的人”形成平行。
theological_decisions:
- issue: “所罗门的”所表达的关系
  choice: 正文保留简短属格“所罗门的”，脚注说明多种可能
  alternative: “所罗门作的”或“为所罗门而作”
  rationale: 希伯来介词 לְ 可表达作者、归属、奉献或关联；正文不武断确定作者身份，以脚注保存真实歧义。
- issue: “房屋”的语义范围
  choice: 正文按直接建筑意象译为“房屋”，脚注保留“家室/王朝”含义
  alternative: 正文译作“家室”或“王朝”
  rationale: 本节首先使用建造者劳作的具体图像，但 בַיִת 在希伯来语中也能承载家庭、后裔或王朝含义；不应在正文中提前消除这种张力。
- issue: 神的建造和守护与人的劳作之间的关系
  choice: 保持“若不是……就徒然……”的条件和平行结构
  alternative: 解释为人不应劳作，或解释为人的努力必然无用
  rationale: 原文并未否定建造者和守望者的工作本身，而是宣告若无耶和华的作为，人的劳作便归于徒然；译文不额外加入系统性解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。保留两组“若不是耶和华……就徒然……”的平行结构；“在其中”对应原文 בּוֹ，虽略显强调，但在中文诗行中尚自然，并忠实保留源文信息。所有脚注标记均置于正文相应位置。
