source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לִ/שְׁלֹ֫מֹ֥ה אִם יְהוָ֤ה לֹא יִבְנֶ֬ה בַ֗יִת שָׁ֤וְא עָמְל֣וּ בוֹנָ֣י/ו בּ֑/וֹ אִם יְהוָ֥ה לֹֽא יִשְׁמָר עִ֝֗יר שָׁ֤וְא שָׁקַ֬ד שׁוֹמֵֽר־׀־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/001.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor in vain; unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: zh_hans
  text: 上行之歌。所罗门的诗[a]。若不是耶和华建造房屋[b]，建造的人就徒然劳苦[c]；若不是耶和华守护城池，守望的人就徒然警醒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所罗门的诗”也可译作“为所罗门而作”或“属于所罗门”；希伯来文标题可以表示作者、题献对象或关联。
    reason: alternative_reading
  - marker: b
    text: “房屋”在希伯来文中也可泛指家室、家族或王朝。
    reason: lexical_alternative
  - marker: c
    text: 原文在“劳苦”之后还有“在其中”一词，即“建造的人在其中徒然劳苦”。
    reason: textual_detail
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 采用中文圣经传统且简洁的组诗标题；“上行”保留 מַעֲלוֹת 的上升、登行意象，不将其解释性地限定为朝圣。
- source_word: לִשְׁלֹמֹה
  choice: 所罗门的诗
  rationale: 中文标题中的惯用表达，简洁自然；希伯来介词 לְ 所含的作者、归属或关联等可能性另以脚注保留。
- source_word: אִם ... לֹא
  choice: 若不是
  rationale: 自然表达否定条件，准确传达“除非……否则……”的逻辑，并适合诗歌的对称句式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文最通行、可识别的专名形式呈现四字神名，而不以“主”这一称号替代。
- source_word: יִבְנֶה בַיִת
  choice: 建造房屋
  rationale: 保留具体的建筑图景，并与下半节的城池、守望者构成平行；בַיִת 也可能延伸指家室或王朝，但不在正文中提前解释。
- source_word: שָׁוְא
  choice: 徒然
  rationale: 准确表达无效、落空之意；两处重复使用，以保留希伯来诗句的平行和强调。
- source_word: עָמְלוּ
  choice: 劳苦
  rationale: 体现费力劳作，语体庄重而又为现代读者易懂。
- source_word: בּוֹנָיו
  choice: 建造的人
  rationale: 按房屋这一先行词理解为参与建造者；中文如此表达比“它的建造者”自然。
- source_word: יִשְׁמָר עִיר
  choice: 守护城池
  rationale: שׁמר 在此表示保护、防守；“城池”与守望的军事防卫语境相称。
- source_word: שָׁקַד
  choice: 警醒
  rationale: 保留该动词警觉不眠、保持戒备的含义，并避免与前面的“守护”和后面的“守望”完全重复。
- source_word: שׁוֹמֵר
  choice: 守望的人
  rationale: 在守城语境中指负责警戒的人；此译法自然，也与动词“守护”形成词义联系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 正文直接出现四字神名，应以专名呈现，不以称号“主”替代；“耶和华”是现代中文读者最熟悉且通行的形式。
- issue: בַיִת 在智慧诗语境中的含义
  choice: 房屋
  alternative: 家室；家族；王朝
  rationale: 与“城池”和守望者相平行的具体图景支持“房屋”；其较广的语义可能性以脚注保留，不在正文中将诗意限定为家族或王朝。
- issue: 人的劳作与耶和华行动之间的关系
  choice: 保留两个否定条件句，不增添因果解释
  alternative: 解释为人的努力完全无价值，或解释为神只是在人的努力之外赐福
  rationale: 原文同时提到耶和华的建造、守护以及人的劳苦、警醒，重点在没有耶和华时人的努力徒然；译文不进一步规定神与人行动关系的系统神学模式。
translation_notes:
  register: 采用现代、庄重而清楚的诗歌语言。两句都用“若不是……就徒然……”保持原文的严整平行；正文保留具体建筑与守城意象，不将其讲解性扩写。所有脚注标记均置于相关正文位置。
