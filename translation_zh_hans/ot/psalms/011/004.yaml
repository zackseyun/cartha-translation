  text: יְהוָ֤ה בְּֽ/הֵ֘יכַ֤ל קָדְשׁ֗/וֹ יְהוָה֮ בַּ/שָּׁמַ֪יִם כִּ֫סְא֥/וֹ עֵינָ֥י/ו יֶחֱז֑וּ עַפְעַפָּ֥י/ו יִ֝בְחֲנ֗וּ בְּנֵ֣י אָדָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/004.yaml
  text: Yahweh is in his holy temple[a]; Yahweh—his throne is in heaven. His eyes see[d][c][b]; his eyelids examine the children of man.
translation:
  language: zh_hans
  text: 耶和华在他的圣殿中；耶和华——他的宝座在天上。他的眼睛察看；他的眼睑察验世人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”直译为“人的儿女”，指全人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式“耶和华”，明确呈现专名，而不以“主”这一称号代替。
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: 在他的圣殿中
  rationale: הֵיכָל可指宫殿或圣殿；此处与神在天上的宝座并列，“圣殿”自然保留神圣居所的意象，同时不武断限定为地上的建筑。
- source_word: בַּשָּׁמַיִם כִּסְאוֹ
  choice: 他的宝座在天上
  rationale: 按希伯来语突显结构直译，并以中文自然语序保留重复神名及天上掌权的图景。
- source_word: עֵינָיו יֶחֱזוּ
  choice: 他的眼睛察看
  rationale: חזה意为看见、观看；“察看”既保留视觉动作，也适合上下文中神审视人的含义。
- source_word: עַפְעַפָּיו יִבְחֲנוּ
  choice: 他的眼目察验
  rationale: עַפְעַפָּיו字面为“他的眼睑”，但汉语说“眼睑察验”生硬；“眼目”保留与前句眼睛的诗歌平行和拟人图景。בחן兼有检验、考察之意，译为“察验”兼顾审视与试验。
- source_word: בְּנֵי אָדָם
  choice: 世人
  rationale: 该习语字面为“亚当之子／人的儿女”，在此统指人类；“世人”简洁、自然且不排除任何性别。
theological_decisions:
- issue: 神的圣殿与天上宝座之间的关系
  choice: 并列保留“在他的圣殿中”与“他的宝座在天上”两个陈述
  alternative: 把“圣殿”明确解释为地上的圣殿，或直接解释为天上
  rationale: 原文将两个图景并置，并未明确将两者等同或分开；译文不替原文消除这种诗意张力。
- issue: 神察看人的拟人表达
  choice: 保留“眼睛／眼目”及“察看／察验”的平行结构
  alternative: 意译为“他鉴察世人”
  rationale: 原文以眼睛和眼睑构成鲜明的拟人平行；保留该图景，同时用自然中文避免生硬。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。分号和破折号保留原文两次神名的并列及“耶和华——他的宝座在天上”这一突显结构；末句保留诗歌平行，但将字面上生硬的“眼睑”译为“眼目”。
