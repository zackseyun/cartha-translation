  to: '交给乐长。大卫的诗。[a]


    我投靠耶和华；

    你们怎能对我说：[b]

    “你要像鸟儿一样逃到你的山上去！”[c]'
  rationale: 修订仅处理诗句末尾的数与指向问题，并新增相应脚注。这样既避免把劝告错误地理解成说话者对自己的命令，也不隐藏希伯来书写文本所呈现的复数形式。其余用语维持原稿的现代、庄重风格。
