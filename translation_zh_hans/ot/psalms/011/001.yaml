  yaml_path: translation/ot/psalms/011/001.yaml
  text: For the choirmaster. Of David. In the LORD I have taken refuge; how can you say to me, “Flee to your mountain like a bird”?
translation:
  language: zh_hans
  text: '交给乐长。大卫的诗。[a]


    我投靠耶和华；

    你们怎能对我说：[b]

    “你要像鸟儿一样逃到你的山上去！”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”：原文也可理解为“献给大卫”或“与大卫有关”。
    reason: 标题中的 לְדָוִד 有真实的语义范围，正文采用中文诗篇标题的惯常表达。
  - marker: b
    text: “对我说”：原文直译为“对我的性命说”或“对我自己说”。
    reason: 说明 נֶפֶשׁ 在此的字面表达及其作为“我”的代称，同时正文采用自然现代汉语。
  - marker: c
    text: 原文书写文本的动词和“你们的山”呈复数形式；传统读法作单数：“你要逃到你的山上去。”
    reason: 此处的书写形式与传统读法之间存在真实的文本和语法问题。正文采用与上下文中“你们对我说”相连贯的单数读法，并保留该歧义。
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 指交给负责音乐演唱或演奏的人；“乐长”简洁庄重，也保留其具体职分未能完全确定的余地。
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 符合中文诗篇标题的自然表达；希伯来介词结构也可能表示献给大卫、属于大卫或与大卫有关，故加注说明。
- source_word: בַּיהוָה חָסִיתִי
  choice: 我投靠耶和华
  rationale: חסה 表示寻求庇护、以某人为避难所；完成式在此表达已经作出的信靠行动或当前确立的处境。
- source_word: לְנַפְשִׁי
  choice: 对我说
  rationale: נפשׁ 在此以“我的生命／我自己”代指本人；译作“对我”是自然汉语，同时以脚注保留字面意象。
- source_word: נוּדוּ הַרְכֶם צִפּוֹר
  choice: 像鸟一样逃到你们的山上去
  rationale: 保留复数命令“你们逃”和复数所有格“你们的山”，并将单数“鸟”作为方式比喻自然呈现。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主／雅威
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确呈现原文的盟约神名，而不把它泛化为普通称谓。
- issue: “我投靠”所表达的时间与状态
  choice: 不额外加入“已经”或“始终”
  alternative: 我已经投靠／我一向投靠
  rationale: 希伯来完成式可表达既成行动或确立状态；简洁译法避免过度限定时间或持续性。
translation_notes:
  register: 使用现代、庄重而易懂的普通话；诗行简洁，反问语气鲜明。引语中的“你们”严格反映原文复数形式，“山”则保持原文单数。
