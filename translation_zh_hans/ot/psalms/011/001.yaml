    rationale: 这会把命令施予引语的说话者本身，破坏上下文。该处存在书写文本与传统读法相关的文本问题；正文宜采用使句意连贯的单数读法，同时用脚注明确保留表面复数形式，避免掩盖歧义。
  - severity: low
    issue: 脚注 b 将 נפשׁ 释为“心灵”或“性命”。
    rationale: 在“对我的 נפשׁ 说”这一表达中，它主要是“我自己／我”的代称，也可关联生命；“心灵”会不必要地引入较狭窄的心理或二元论含义。
