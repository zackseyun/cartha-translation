review_pass:
  verdict: revise
  source_fidelity: 正文将 נודו／הַרכם 的表面复数形式理解为对说话者的命令，导致引语语义不通：说话者不可能自然地劝自己“逃到你们的山上去”。此处传统读法作单数命令，正与“你们对我说”及英语审校轨迹相合。应按该读法译为对诗人的直接劝告，并以脚注保留书写文本的复数形式。其余主要表达忠实：חסיתי译为“我投靠”，לנפשי在正文自然地译为“对我”，并保留字面注释。
  naturalness: “你们怎能对我说：‘你要像鸟儿一样逃到你的山上去！’”在现代汉语中清楚呈现复数说话者对单数诗人的劝告。原稿的“像鸟一样逃到你们的山上去”虽字面跟随表面形式，却使引语的指向不自然且逻辑失衡。
  terminology: “交给乐长”“大卫的诗”“耶和华”“投靠”均庄重、通顺，并适合诗篇标题及祷诗语域。“心灵”不宜作为 נפשׁ 在本句的首要字面释义；脚注改为“我自己／我的性命”，更贴近其在此的指称范围。
  issues:
  - severity: medium
