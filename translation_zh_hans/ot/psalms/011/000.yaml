base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/000.yaml
  text: For the choirmaster[a]. Of David. In Yahweh I take refuge; how can you say to my soul, “Flee to your mountain[b], bird” ?
translation:
  language: zh_hans
  text: '交给乐长[a]。大卫的诗。


    我投靠雅威；你们怎能对我[c]说：“逃到你们的山上去吧，鸟儿！”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交给乐长”所译的希伯来语题注用语通常与音乐带领有关，确切职分未能确定；也可译作“交给领唱者”。“大卫的诗”中的介词也可能表示“属于大卫”“献给大卫”或“关于大卫”。
    reason: superscription_ambiguity
  - marker: b
    text: 希伯来语措辞困难：动词和“你们的山”都是复数，而“鸟儿”是单数形式。可近于直译为“逃到你们的山上去吧，鸟儿！”；也可能理解为“像鸟一样逃到你们的山上去吧！”
    reason: alternative_reading
  - marker: c
    text: 希伯来语直译为“对我的性命／我自己说”。这里的词可指诗人本人、生命或内在自我。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐团指挥
  rationale: 该词通常见于诗篇题注，可能指负责音乐演奏或带领歌唱的人；译文采用现代读者容易理解、又保留礼仪音乐背景的表达。
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: לְ 可表示归属、作者关系、献给或关于；正文采用传统而简洁的题注表达，具体语义范围见脚注。
- source_word: בַּיהוָה חָסִיתִי
  choice: 我投靠雅威
  rationale: חסה 表示寻求庇护、以某人为避难所；完成式在此表达诗人已经作出的信靠选择及其当前立场。יהוה 以“雅威”音译，区别于作为称号的“主”。
- source_word: לְנַפְשִׁי
  choice: 对我的心灵
  rationale: נפשׁ 在此可指诗人本人、生命或内在自我；“心灵”保留原文的身体—生命表达，而不简单省略为“对我”。
- source_word: נודו הַרְכֶם צִפּוֹר
  choice: 逃到你们的山上去吧，鸟儿
  rationale: 按所给 WLC 字形保留复数命令和复数所属形式，并把“鸟儿”理解为呼语；由于希伯来语措辞困难，其他可能句法在脚注说明。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 采用较接近希伯来神名的现代音译，保留专名性质，不以称号替代，也不据此加入任何宗派性解释。
- issue: חָסִיתִי 的时态与信靠含义
  choice: 我投靠雅威
  alternative: 我已经投靠雅威；我信靠雅威
  rationale: “投靠”保留避难意象；汉语不强制标明完成体，可同时传达已作出的选择和持续的倚靠状态。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。题注独立成行；正文保留诗歌式简洁语气。“对我的心灵说”略带原文色彩，旨在保存 לְנַפְשִׁי 的表达，不把它完全平化为“对我说”。末句刻意不在正文中消除希伯来语的数与句法难点，而以脚注列出主要理解。
