id: PSA.11.7
reference: Psalms 11:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי צַדִּ֣יק יְ֭הוָה צְדָק֣וֹת אָהֵ֑ב יָ֝שָׁ֗ר יֶחֱז֥וּ פָנֵֽי/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/007.yaml
  text: For Yahweh is righteous[a]; he loves righteous deeds[b]; the upright will behold his face.
translation:
  language: zh_hans
  text: 因为耶和华是公义的；他喜爱公义的行为；正直人必得见他的面。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的面看顾正直人。”希伯来语末句的句法有不止一种理解；这种译法可能性较小。
    reason: alternative_reading
  - marker: b
    text: “他的面”是直译；这个说法也可含有他的同在或恩宠之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人确信耶和华施行公正判断的根据；“因为”自然保留了解释缘由的功能。
- source_word: צַדִּיק
  choice: 公义的
  rationale: 描述耶和华的道德属性，并与同节的צְדָקוֹת保持“公义”这一词根关联。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中广为人知的专名译法，使其与普通名词“主”有所区别。
- source_word: צְדָקוֹת
  choice: 公义的行为
  rationale: 复数形式在这里较自然地指具体的正直、公义之举，而不只是抽象属性；此译法也保留与“公义的”之间的词义联系。
- source_word: אָהֵב
  choice: 喜爱
  rationale: 表达耶和华一贯的意愿与悦纳；现代汉语自然庄重。
- source_word: יָשָׁר
  choice: 正直人
  rationale: 该形容词在此作名词用；虽为单数形式，后接复数动词，故可作集合性称谓，指正直的人。
- source_word: יֶחֱזוּ
  choice: 必得见
  rationale: 该动词意为看见、瞻仰；“必得见”既保留将来或确定语气，也适合诗歌中得见上帝之面的庄重语境。
- source_word: פָנֵימוֹ
  choice: 他的面
  rationale: 直译具体意象“他的面”，不在正文中提前解释为“同在”或“恩宠”。
theological_decisions:
- issue: 末句的主语、宾语及句法关系
  choice: 正直人必得见他的面
  alternative: 他的面看顾正直人
  rationale: 复数动词יֶחֱזוּ最自然地与集合性使用的יָשָׁר相配，使“正直人”作主语、“他的面”作宾语；这也符合圣经中“见上帝的面”可表达亲近与蒙恩的用法。不过，希伯来语句法容许另一种理解，故在脚注保留。
translation_notes:
  register: 采用现代、庄重而清晰的标准普通话。“公义的／公义的行为”保留原文词根呼应；“正直人”简洁表达集合意义。两个脚注标记都置于其实际涉及的末句之后，避免把句法或词义说明错误地系于前半节。
