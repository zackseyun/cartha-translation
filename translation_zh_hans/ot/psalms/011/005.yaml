base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/005.yaml
  text: Yahweh tests the righteous[a], but his soul hates the wicked and the one who loves violence.
translation:
  language: zh_hans
  text: 耶和华察验义人，却从心里恨恶恶人和喜爱暴力的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文更直译为“他的生命（即他自己）恨恶”。“生命”在这里是希伯来语的强调表达，指耶和华亲自而深切的憎恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神名音译，保留专名性质，不以“主”这一称号替代。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该词在此作名词用，泛指以公义为特征的人；“义人”简洁、庄重，也保留希伯来文代表性单数的表达。
- source_word: יִבְחָן
  choice: 察验
  rationale: בחן表示检验、考察或试验；“察验”兼顾审察和验证之意，又避免限定为诱惑或惩罚性的试炼。
- source_word: וְרָשָׁע
  choice: 恶人
  rationale: 作名词用，与“义人”相对，表达道德类别，并保留代表性单数的泛指作用。
- source_word: וְאֹהֵב חָמָס
  choice: 喜爱暴力的人
  rationale: 分词结构描述以喜爱暴力为特征的人；此译自然清楚，也保留持续或惯常倾向。
- source_word: חָמָס
  choice: 暴力
  rationale: 该名词常指暴力及暴虐的不义；本节中译为“暴力”最直接，也符合上下文。
- source_word: שָׂנְאָה נַפְשׁוֹ
  choice: 从心里恨恶
  rationale: 原文直译为“他的生命／灵魂恨恶”，נפש在此强调耶和华内在而深切的憎恶；“从心里恨恶”以自然现代汉语保留这种强调。
theological_decisions:
- issue: 末句“他的נפש恨恶”的所指与力度
  choice: 译作“从心里恨恶”，表明是耶和华亲自且深切地憎恶
  alternative: 较直译作“他的心恨恶”或简化为“他恨恶”
  rationale: 原文把恨恶归于耶和华的נפש，是希伯来语强调主体内在全然厌恶的表达。中文“从心里恨恶”既保留其神学力度，又不对神的情感性质作超出经文的推论。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“却”清楚呈现义人与恶人之间的对照；“从心里”传达נפש的强调作用，避免生硬的“他的灵魂恨恶”。
