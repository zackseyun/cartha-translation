source:
  edition: WLC
  text: יַמְטֵ֥ר עַל רְשָׁעִ֗ים פַּ֫חִ֥ים אֵ֣שׁ וְ֭/גָפְרִית וְ/ר֥וּחַ זִלְעָפ֗וֹת מְנָ֣ת כּוֹסָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/006.yaml
  text: He will rain down traps on the wicked; fire and sulfur and a scorching wind will be the portion of their cup.
translation:
  language: zh_hans
  text: 他要使网罗如雨降在恶人身上；火和硫磺，以及灼热的风，是他们杯中所得的份。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַמְטֵר
  choice: 如雨降在
  rationale: 该使役未完成式意为“使……如雨降下”。用“如雨降在”既保留诗歌意象，也符合现代汉语表达。
- source_word: פַּחִים
  choice: 网罗
  rationale: פַּחִים 可指捕捉猎物的网罗或陷阱；“网罗”保留具体捕猎意象，并与“如雨降下”所形成的突兀审判图景相容。
- source_word: אֵשׁ וְגָפְרִית
  choice: 烈火、硫磺
  rationale: 直译两个并列名词；“烈火”比单用“火”更自然地传达毁灭性语境，而不增添特定教义解释。
- source_word: רוּחַ זִלְעָפוֹת
  choice: 灼热的风
  rationale: זִלְעָפוֹת 表示炽烈、灼烧般的热度；“灼热的风”直接而自然，也保留该短语可能指毁灭性热风的含义。
- source_word: מְנָת כּוֹסָם
  choice: 他们杯中的份
  rationale: 保留“份”和“杯”的希伯来诗歌隐喻，指他们被分配、必须承受的命运或报应，而不在正文中将隐喻解释掉。
theological_decisions:
- issue: “杯中的份”的审判隐喻
  choice: 保留为“他们杯中的份”
  alternative: “他们命定要承受的报应”
  rationale: 原文借杯中所得表达被分配的命运；直保隐喻可维持诗歌张力，避免把审判意象过度释义。
- issue: פַּחִים 是实体网罗还是比喻性灾祸
  choice: 译作“网罗”
  alternative: “陷阱”或按古译传统理解为“炭火”
  rationale: 马所拉文本明确支持“网罗/陷阱”；不依替代读法改正文，也不说明这些网罗具体以何种方式临到恶人。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“如雨降下”“杯中的份”等核心诗歌意象。分号对应本节前后两组审判图景，使节奏清晰而不消解原文的紧凑并列。
