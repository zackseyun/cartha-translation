  text: כִּ֣י הַ֭/שָּׁתוֹת יֵֽהָרֵס֑וּ/ן צַ֝דִּ֗יק מַה פָּעָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/003.yaml
  text: If the foundations are destroyed[a], what can the righteous do?
translation:
  language: zh_hans
  text: 根基若被拆毁[a]，义人还能做什么呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为根基正被拆毁，义人做了什么呢？”末句的希伯来语动词在形式上也可译作过去时“做了什么”，但按上下文通常理解为“还能做什么”。
    reason: 保留 כִּי 的因果读法，以及 פָּעָל 较贴近形式的过去时译法。
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 此处可作因果连词“因为”，也可在诗歌语境中引出条件。与后面的反问相接时，“若”在现代汉语中自然清楚，同时在脚注保留因果读法。
- source_word: הַשָּׁתוֹת
  choice: 根基
  rationale: 保留希伯来语的具体意象，不把其所指限定为社会秩序、司法制度或道德基础。
- source_word: יֵהָרֵסוּן
  choice: 被拆毁
  rationale: 该词为 הרס 的尼法勒形，表达被动意义；“被拆毁”比笼统的“毁坏”更贴近拆除根基的图像。
- source_word: צַדִּיק
  choice: 义人
  rationale: 单数形容词名词化，泛指行义之人；“义人”简洁、庄重，并保留圣经语体。
- source_word: מַה
  choice: 什么
  rationale: 直接引出反问，不作不必要的扩充。
- source_word: פָּעָל
  choice: 还能做
  rationale: 形式上是完成式，可直译为“做了什么”；但在此条件句和反问的语境中，理解为现实能力或作为更为连贯。“还能做”自然传达处境中的无能为力，同时以脚注保留过去时读法。
theological_decisions:
- issue: “根基”的比喻范围
  choice: 在正文中保留“根基”这一开放性比喻
  alternative: 明确解释为社会秩序、正义体系或盟约结构
  rationale: 原文没有限定该意象的具体所指；保留比喻可避免把某一种社会或神学解释写入正文。
- issue: 末句完成式 פָּעָל 的时态与语用
  choice: 按语境译为“还能做什么”
  alternative: 按形式译为“做了什么”
  rationale: 前者使全句成为面对根基崩毁时的反问，符合常见语境理解；后者在语法上确有根据，可能指向义人已经做了什么，因此在脚注中明确保留。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“根基”保留诗歌意象；“义人”沿用清楚而通行的圣经用语；“还能做什么呢”体现反问语气。
