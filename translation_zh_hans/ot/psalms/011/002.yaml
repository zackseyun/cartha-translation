    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，为诗人所受劝告或面临的处境提出理由，保留原文的论证关系。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 用现代而庄重的提示语唤起注意，突出威胁迫在眉睫。
- source_word: הָרְשָׁעִים
  choice: 恶人
  rationale: 这是《诗篇》中该词常见且自然的对应，指道德败坏、敌对正直人的人。
- source_word: יִדְרְכוּן קֶשֶׁת
  choice: 已经拉开弓
  rationale: 希伯来语习语本义涉及踩住并弯曲弓；中文以“拉开弓”自然表达备射动作。结合后续完成式“把箭搭在弦上”，用“已经”呈现威胁已进入实际准备阶段。
- source_word: כּוֹנְנוּ חִצָּם עַל יֶתֶר
  choice: 把箭搭在弦上
  rationale: 具体呈现箭已安放在弓弦上的备射状态；原文“箭”为单数，中文单数也可作类指。
- source_word: לִירוֹת
  choice: 要……射
  rationale: 表达目的不定式，说明恶人备弓搭箭的意图。
- source_word: בְּמוֹ אֹפֶל
  choice: 在黑暗中
  rationale: 保留介词短语最直接的处境义，既可指黑暗环境，也暗含隐蔽袭击；“从黑暗中”亦有可能，故加脚注。
- source_word: לְיִשְׁרֵי לֵב
  choice: 那心里正直的人
  rationale: 保留“心”所表达的内在道德品格，并采用普通现代读者易懂的说法。
