  text: וְ/הַ/מַּטִּ֤ים עַֽקַלְקַלּוֹתָ֗/ם יוֹלִיכֵ֣/ם יְ֭הוָה אֶת פֹּעֲלֵ֣י הָ/אָ֑וֶן שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/005.yaml
  text: But as for those who turn aside to their crooked ways[a], Yahweh will lead them away with the workers of iniquity[c][b]. Peace be upon Israel.
translation:
  language: zh_hans
  text: 至于那些偏离正路、转向自己弯曲道路的人[a]，耶和华必领他们与作恶的人一同离去[b]。愿平安临到以色列！[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“转向自己弯曲的路径”，或“偏行自己乖僻的道路”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“耶和华必把他们连同作恶的人一起带走。”
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“平安在以色列之上”或“平安归于以色列”；这简洁的短句既可理解为祝福或祈愿，也可理解为宣告。
    reason: cultural_note
lexical_decisions:
- source_word: וְהַמַּטִּים
  choice: 至于那些偏向……的人
  rationale: 分词表示偏离、转向；结合上文与正直人的对比，将连接词理解为转折兼换题，并用“至于”自然呈现。
- source_word: עַקַלְקַלּוֹתָם
  choice: 自己弯曲的道路
  rationale: 该词可指弯曲、乖僻的道路；“道路”既保留路径意象，也能表达行为方式的道德含义。
- source_word: יוֹלִיכֵם
  choice: 必使他们……离去
  rationale: הלכה的使役形表示使之行走或领走；此译保留使役意义及审判语境，又不额外说明具体去处。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译，而不以“主”这一称号替代原文专名。
- source_word: אֶת פֹּעֲלֵי הָאָוֶן
  choice: 与作恶的人一同
  rationale: 此处אֶת具有伴随意义；פֹּעֲלֵי הָאָוֶן直指行恶之人，译为“作恶的人”自然且保留道德分量。
- source_word: שָׁלוֹם עַל יִשְׂרָאֵל
  choice: 愿平安临到以色列
  rationale: 原文是简洁的名词性短句；按诗篇结语的祝福语气补出“愿”，同时以脚注保留陈述式理解的可能。
theological_decisions:
- issue: 结尾“שָׁלוֹם עַל יִשְׂרָאֵל”的语气
  choice: 译作祝愿：“愿平安临到以色列！”
  alternative: 可理解为陈述：“平安临到以色列。”
  rationale: 在诗篇和礼仪语境中，这一省略动词的短句自然可作祝福或祈愿；脚注保留原文也可能是简洁宣告的歧义。
- issue: 恶人被带走的表达强度
  choice: “使他们……离去”
  alternative: “把他们赶走”或“领他们离去”
  rationale: 原文使役动词明确表示使其离开，却未具体说明驱赶方式或目的地，因此不把审判图景具体化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“弯曲的道路”保留希伯来文的路径隐喻；“作恶的人”比生硬的“作孽者”更易为普通读者理解。结尾使用感叹号体现祝福式收束，但不借此排除陈述式理解。
