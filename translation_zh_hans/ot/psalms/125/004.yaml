  text: הֵיטִ֣יבָ/ה יְ֭הוָה לַ/טּוֹבִ֑ים וְ֝/לִֽ/ישָׁרִ֗ים בְּ/לִבּוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/004.yaml
  text: Do good[a], O Yahweh, to the good[b], and to the upright in heart.
translation:
  language: zh_hans
  text: 耶和华啊，求你善待[a]良善的人和心里正直的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你赐福给”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“在他们心里正直的人”；“心里”强调内在的正直。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: 求你善待
  rationale: 该词是 יטב 的使役式祈使形，向耶和华发出祈求，可表示“行善于”或“善待”。“求你善待”在现代汉语中自然，也清楚表达祈求语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名。在现代简体中文圣经语境中，“耶和华”是最通行且易于普通读者辨识的专名译法，不以称号替代原文专名。
- source_word: לַטּוֹבִים
  choice: 良善的人
  rationale: 形容词 טוֹב 在此作名词使用，指品格良善的人；不译作“义人”，以免与后面的 ישרים 混同或增加原文没有的技术性神学含义。
- source_word: וְלִישָׁרִים
  choice: 就是……正直的人
  rationale: ישר 表示正直、端正。希伯来语以 וְ 并列两种描述；汉语“就是”可自然呈现第二短语对前一类人的平行说明，同时不强行断定两者是完全不同的群体。
- source_word: בְּלִבּוֹתָם
  choice: 心里
  rationale: 原文直译为“在他们的众心中／心里”，强调内在的正直。现代汉语用“心里正直”最自然，并保留内在品格的重点。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号。中文采用通行专名“耶和华”，既保留专名性质，也符合普通现代读者的辨识习惯。
- issue: 两个道德描述之间的关系
  choice: 良善的人，就是心里正直的人
  alternative: 良善的人和心里正直的人
  rationale: 原文用连接词并列“良善者”与“心里正直者”，既可视为两项并列，也可理解为平行重述。正文以自然汉语表达其紧密平行关系，并用脚注保留形式上的并列可能。
- issue: 正直的内在性质
  choice: 心里正直
  alternative: 正直的人
  rationale: 保留 בְּלִבּוֹתָם 所强调的内在完整与诚实，不把描述缩减为仅可从外表观察的行为。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“耶和华啊，求你……”符合汉语诗篇祈求句式；“善待”避免生硬重复“向良善的人行善”。所有脚注标记均已置于正文。
