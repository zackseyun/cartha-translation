source:
  edition: WLC
  text: כִּ֤י לֹ֪א יָנ֡וּחַ שֵׁ֤בֶט הָ/רֶ֗שַׁע עַל֮ גּוֹרַ֪ל הַֽ/צַּדִּ֫יקִ֥ים לְמַ֡עַן לֹא יִשְׁלְח֖וּ הַ/צַּדִּיקִ֨ים בְּ/עַוְלָ֬תָ/ה יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/003.yaml
  text: For the scepter of wickedness will not rest on the lot of the righteous[c][b][a], lest the righteous stretch out their hands to wrongdoing.
translation:
  language: zh_hans
  text: 因为恶人的权杖[a]不会停留在义人的份上[b]，免得义人伸手作恶[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“邪恶的权杖”。希伯来语的构式既可指邪恶这一性质，也可指持有权杖的恶人。
    reason: lexical_alternative
  - marker: b
    text: “份”也可译作“产业”，指分配给义人的那一份。
    reason: lexical_alternative
  - marker: c
    text: 或译：“伸手行不义”。这是指参与或从事不义之事。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为诗人所表达的信靠提供理由；在现代汉语中，“因为”能自然体现这里的解释关系。
- source_word: יָנוּחַ
  choice: 不会长久停留
  rationale: נוח可指安歇、落下、停留或安顿。上下文并非否认恶势力曾压迫义人，而是表明这种统治不会持续，因此用“不会长久停留”明确表达其非永久性。
- source_word: שֵׁבֶט
  choice: 权杖
  rationale: 该词本义可指杖、棍或权杖；本节涉及恶势力对义人的统治，“权杖”较能保留掌权和管辖的比喻。
- source_word: הָרֶשַׁע
  choice: 邪恶的
  rationale: רֶשַׁע在此可理解为抽象的“邪恶”，也可转指“恶人”。正文采用“邪恶的权杖”，同时以脚注保留“恶人的权杖”这一可能译法。
- source_word: גּוֹרַל
  choice: 所得的份
  rationale: 该词可指抽签所得之物，进而指被分配的份或产业。这里用“所得的份”既传达分配的含义，也适合现代读者理解。
- source_word: הַצַּדִּיקִים
  choice: 义人
  rationale: 以名词方式翻译复数形容词，保留其道德及盟约语境中的含义，并符合汉语圣经文体。
- source_word: לְמַעַן לֹא
  choice: 免得
  rationale: 简洁表达防止某种后果发生的目的或结果关系，与后文义人可能被迫走向恶行的含义相合。
- source_word: יִשְׁלְחוּ ... יְדֵיהֶם
  choice: 伸手
  rationale: 保留希伯来语“伸出双手”的具体意象；与“作恶”连用，在现代汉语中也能自然表达参与恶行。
- source_word: בְּעַוְלָתָה
  choice: 作恶
  rationale: עַוְלָה可指不义、邪恶或不公。这里与“伸手”构成行动性的表达，“作恶”自然涵盖参与不义之事的意思，同时脚注保留更贴近字面的译法。
theological_decisions:
- issue: 恶势力统治义人的应许具有什么范围
  choice: 经文应许邪恶的统治不会长久停留在义人所得的份上。
  alternative: 经文绝对否认恶人曾经或可能对义人掌权。
  rationale: 动词יָנוּחַ表达停留、安顿或持续；否定式在这里着重于恶势力不能永久占据。后面的目的从句说明这种压迫受到限制，以免义人也转而作恶。如此既保留诗篇的信靠，也不抹去义人可能暂时受压的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“权杖”保留统治的诗歌意象；“不会长久停留”使נוח所表达的持续、安顿之意清楚可懂；“所得的份”避免单用“阄”可能造成的晦涩，同时由脚注补充“产业”的含义。
