base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/000.yaml
  text: 'A Song of Ascents[a]. Those who trust in Yahweh are like Mount Zion: it will not be shaken; it abides forever.'
translation:
  language: zh_hans
  text: 上行之歌。信靠耶和华的人好像锡安山；锡安山永不动摇[a]，永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作：“永不被挪移”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 传统而简洁的译法，保留“上行/登阶”的意象；该标题的具体礼仪背景并不确定。
- source_word: הַבֹּטְחִים בַּיהוָה
  choice: 信靠耶和华的人
  rationale: בּטח 表示信赖、倚靠；以“信靠”自然表达持续把信心寄托于耶和华。神名 יהוה 译作“耶和华”，符合现代中文圣经读者熟悉的专名形式。
- source_word: כְּהַר צִיּוֹן
  choice: 好像锡安山
  rationale: 直接保留明喻及地名，不增添解释。
- source_word: לֹא יִמּוֹט
  choice: 永不动摇
  rationale: מוֹט 指移动、摇动或失稳；“不动摇”既贴近原义，也自然承接信靠者如山稳固的意象。
- source_word: לְעוֹלָם יֵשֵׁב
  choice: 永远长存
  rationale: יֵשֵׁב 字面可指坐、居住或持续存在；在锡安山的语境中，“长存”自然表达其恒久稳立。
theological_decisions:
- issue: 后半句单数动词的指向
  choice: 中文不另加明确关系代词，使“永不动摇，永远长存”在比喻结构中自然承接信靠者与锡安山。
  alternative: 明确译作“锡安山永不动摇，永远长存”或“他们永不动摇，永远长存”。
  rationale: 希伯来文以“锡安山”为紧邻的单数先行项，但整个比喻旨在说明信靠耶和华者的稳固；省略显式主语可保留这种修辞关联与张力。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。标题沿用通行的“上行之歌”；正文保持简洁的诗歌节奏，不加入原文没有的转折词。
