  text: יְֽרוּשָׁלִַ֗ם הָרִים֮ סָבִ֪יב לָ֥/הּ וַ֭/יהוָה סָבִ֣יב לְ/עַמּ֑/וֹ מֵ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/002.yaml
  text: As the mountains surround Jerusalem[a], so Yahweh surrounds his people from now and forever.
translation:
  language: zh_hans
  text: 群山怎样环绕耶路撒冷[a]，雅威也照样环绕他的子民，从今以后，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式对应地译作：“耶路撒冷——群山环绕着她；而雅威环绕他的子民，从今以后，直到永远。”
    reason: 保留原文名词起首结构、指向耶路撒冷的阴性代词所形成的城市人格化，以及连接词可较直接译出的句法。
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及通行用法中的标准地名译名。
- source_word: הָרִים
  choice: 群山
  rationale: הַר的复数可指山或丘陵；“群山”既符合耶路撒冷周围的地貌，也保留诗句中稳固保护的意象。
- source_word: סָבִיב לָהּ
  choice: 环绕耶路撒冷
  rationale: סָבִיב与ל连用表示在周围或环绕；阴性后缀指耶路撒冷。正文为中文自然表达而重述地名。
- source_word: וַיהוָה
  choice: 雅威也照样
  rationale: ו在诗行的平行结构中具有类比承接作用，译作“也照样”清楚呈现群山与雅威环绕之举的对比关系。神名יהוה音译为“雅威”。
- source_word: סָבִיב לְעַמּוֹ
  choice: 环绕他的子民
  rationale: 重复“环绕”以保留原文平行和保护意象；עַמּוֹ直译为“他的子民”，表达归属关系而不额外限定其范围。
- source_word: מֵעַתָּה
  choice: 从今时
  rationale: 表示从现在开始；“从今时”简明、庄重，并与后面的时间表达自然衔接。
- source_word: וְעַד עוֹלָם
  choice: 直到永远
  rationale: 该固定时间表达表示持续至无尽的将来；“直到永远”是自然且庄重的现代中文。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专有圣约名字的性质，不以称号取代。
- issue: 雅威前连接词ו的语义作用
  choice: 以“也照样”明示类比
  alternative: 仅译作“而”或“并且”
  rationale: ו本可作普通连接词，但上下两句以相同的סָבִיב形成清楚的类比平行；“也照样”使现代读者自然把握这种关系，同时脚注保留较形式对应的读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。“群山……环绕”与“雅威……环绕”保持原文关键词复现；“怎样……也照样”使隐含的类比关系清晰。正文将阴性代词明确为地名以免中文含混，脚注则保留“她”的形式特征。
