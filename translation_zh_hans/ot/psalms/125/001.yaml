  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/001.yaml
  text: A Song of Ascents. Those who trust in Yahweh are like Mount Zion[a], which cannot be shaken, but remains forever.
translation:
  language: zh_hans
  text: 上行之歌。倚靠雅威的人，好像锡安山：它绝不动摇[a]，永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它绝不会被挪移。”
    reason: מוֹט可表示动摇、倾覆，也可较形式对应地译为被移动或被挪移。
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 保留诗篇120—134篇共有标题的字面意象和传统文学名称；“歌”准确对应שִׁיר，也符合现代汉语诗歌体裁用语。
- source_word: הַבֹּטְחִים
  choice: 倚靠……的人
  rationale: 分词指一类以信靠为特征的人；“倚靠……的人”自然表达其持续、概括性的含义。
- source_word: בַּיהוָה
  choice: 倚靠雅威
  rationale: 介词ב标明信靠的对象；“雅威”直接音译四字神名יהוה，避免将专名改写为称号。
- source_word: כְּהַר צִיּוֹן
  choice: 好像锡安山
  rationale: כְּ表示比较；“锡安山”是该地名在现代中文中的通行译法。
- source_word: לֹא יִמּוֹט
  choice: 它绝不动摇
  rationale: מוֹט的尼法勒形可表示被移动、摇动或倾覆；“绝不动摇”既保留否定和稳固的意象，也符合现代汉语诗体表达。
- source_word: לְעוֹלָם יֵשֵׁב
  choice: 永远长存
  rationale: יָשַׁב本义为坐、居住，也可在此表达持续安定；与לְעוֹלָם连用时，“永远长存”清楚传达恒久不移。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地反映通常重构的读音，而“耶和华”虽为中文传统译名，却源于另一种读音传统。正文采用音译，不以“主”等称号取代专名。
- issue: 后半句所指对象
  choice: 以单数“它”指锡安山
  alternative: 理解为倚靠雅威的人永不动摇、永远长存
  rationale: 希伯来文两个谓语均为阳性单数，语法上最直接承接单数的“锡安山”；同时，整句比喻自然把锡安山的稳固性质应用于倚靠雅威的人，没有必要消除这种诗性关联。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以冒号保留希伯来诗句先作比较、再并列描述锡安山稳固长存的结构；避免改写成从句，以维持原文诗行的力度。
