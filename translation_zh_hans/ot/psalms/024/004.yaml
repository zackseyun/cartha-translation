  text: נְקִ֥י כַפַּ֗יִם וּֽ/בַר לֵ֫בָ֥ב אֲשֶׁ֤ר לֹא נָשָׂ֣א לַ/שָּׁ֣וְא נַפְשִׁ֑/י וְ/לֹ֖א נִשְׁבַּ֣ע לְ/מִרְמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/004.yaml
  text: The one who has clean hands and a pure heart[c][b][a], who has not lifted up his soul to falsehood or sworn deceitfully.
translation:
  language: zh_hans
  text: 就是手洁心清，不将我的性命举向虚妄[a][b]，也不以诡诈起誓的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“我的性命”；不少译本根据本节一贯的第三人称表述，采用异读“自己的性命”。
    reason: textual_variant
  - marker: b
    text: “虚妄”也可译作“虚假”或“虚空之物”；有人认为这里特指偶像。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקִי כַפַּיִם
  choice: 手洁
  rationale: 保留“手洁”的具体意象；“手”在此指外在行为，简洁而符合汉语圣诗语体。
- source_word: בַר לֵבָב
  choice: 心清
  rationale: 表达内在纯正，并与“手洁”形成凝练的外在行为与内在品格之对偶。
- source_word: נָשָׂא ... נַפְשִׁי
  choice: 举起我的性命
  rationale: 按WLC所载第一人称后缀译为“我的”，不静默改成语境较顺的“自己的”；“举起”保留原文动作意象，“性命”兼顾נֶפֶשׁ所指的生命、自我与内在之人。
- source_word: לַשָּׁוְא
  choice: 向虚妄
  rationale: שָׁוְא可指虚空、虚假或毫无价值之物；“虚妄”保留这种语义宽度，也没有直接限定为偶像。
- source_word: נִשְׁבַּע לְמִרְמָה
  choice: 以诡诈起誓
  rationale: 既可指以欺骗方式起誓，也可指怀着欺骗目的起誓；此译保留两者之间的开放性。
theological_decisions:
- issue: נַפְשִׁי中的第一人称“我的性命”与上下文第三人称描述之间的张力
  choice: 正文保留WLC的“我的性命”
  alternative: 自己的性命（或自己的心）
  rationale: 上下文以第三人称描写登耶和华山的人，因此“自己的”更顺；但所给马所拉文本明确为第一人称后缀。为尊重原文证据并保留文本张力，正文不作静默协调，另以脚注说明常见异读。
- issue: שָׁוְא是否特指偶像
  choice: 译作较宽泛的“虚妄”
  alternative: 偶像；虚假
  rationale: 此词可涵盖虚空、虚假、无价值之事，语境也可能让人联想到偶像，但并不足以强行限定为偶像。
translation_notes:
  register: 采用现代、庄重而凝练的诗歌语体。“手洁心清”自然保留希伯来文的对偶；“不向虚妄举起我的性命”刻意保留原文第一人称造成的突兀，并由脚注帮助普通读者理解。
