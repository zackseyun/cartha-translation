  yaml_path: translation/ot/psalms/024/006.yaml
  text: Such is the generation of those who seek him, who seek your face, O Jacob. Selah
translation:
  language: zh_hans
  text: 这就是寻求他的世代，是寻求你面的那些人——雅各啊。[a]（细拉）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅各啊”：原文句法简略；“雅各”可理解为呼语，也可能与前面的寻求者群体有关。有些古译本作“雅各的上帝”。马所拉文本此处没有“上帝”一词。
    reason: 句末“雅各”的句法关系和所指存在歧义。正文按可行的呼语理解译出，同时以脚注保留其他主要理解，且不补入马所拉文本未明说的“上帝”。
lexical_decisions:
- source_word: דּוֹר
  choice: 那一代人
  rationale: 既保留“世代、一代”的基本意象，也用现代汉语自然地指这一类寻求者。
- source_word: דרש/ו
  choice: 寻求他的
  rationale: 按马所拉文本所呈现的第三人称宾语理解，保留本节随后转为第二人称“你面”的人称变化。
- source_word: מְבַקְשֵׁי פָנֶיךָ
  choice: 寻求你面的
  rationale: 直译“寻求你的面”，保留希伯来语中求见、亲近并求恩眷的具体表达，不缩减为单纯“寻求你”。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 原文仅有“雅各”，没有“神”或“上帝”；正文不补入原文未明说的称谓。
- source_word: סֶלָה
  choice: 细拉
  rationale: 沿用音译，因为该礼仪或音乐术语的确切含义不确定。
theological_decisions:
- issue: “雅各”与前句的句法关系
  choice: 保留“雅各”本身，并以脚注说明歧义
  alternative: 译作“雅各的上帝”或明确译成“雅各啊”
  rationale: 马所拉文本没有“上帝”一词；“雅各”可能是呼语，也可能指称寻求者群体。正文避免以补词消除原有张力。
- issue: “寻求他的”与“寻求你面的”人称转换
  choice: 保留第三人称到第二人称的转换
  alternative: 统一译为“寻求你……寻求你面的”
  rationale: 原文确有这一转换；不以顺译为由将其抹平。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“寻求你面”略带诗体色彩，刻意保留原文的身体意象；“细拉”置于括号中，体现其与诗句正文不同的礼仪或音乐提示性质。
