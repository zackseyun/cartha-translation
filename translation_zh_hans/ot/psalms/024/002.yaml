base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/002.yaml
  text: For he founded it upon the seas[a], and established it upon the rivers.
translation:
  language: zh_hans
  text: 因为他在众海之上奠定大地，在江河之上使它稳立。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接第1节，为前述宣告说明理由；现代汉语中“因为”清楚自然，也保留原文的因果关系。
- source_word: הוּא
  choice: 他
  rationale: 保留原文独立人称代词所明确标出的主语；汉语不另加“亲自”，以免过度强化。
- source_word: עַל
  choice: 在……之上
  rationale: 保留大地奠基于众水之上的空间意象及诗歌语体，不将其抽象化。
- source_word: יַמִּים
  choice: 众海
  rationale: 对应 יָם 的复数，既准确表达“海洋”，又以凝练的诗性措辞保留复数形式和宇宙性水域意象。
- source_word: יְסָדָהּ
  choice: 把大地奠基
  rationale: יסד 表示奠定根基；宾语阴性后缀回指第1节的“地”。明说“大地”可使单节汉语自然清楚，同时保留奠基意象。
- source_word: וְעַל
  choice: 在……之上
  rationale: 第二分句省略显性的“并且”，以汉语对偶自然连接，同时重复“在……之上”来保存希伯来诗句的平行结构。
- source_word: נְהָרוֹת
  choice: 江河
  rationale: 这是该词通常而透明的意义；“江河”比单用“河流”更适合庄重诗体，并保留复数水道意象。
- source_word: יְכוֹנְנֶהָ
  choice: 把它稳立
  rationale: כון 在此含使之坚固、确立之意；“稳立”既区别于前句的“奠基”，也表达稳定牢固的语义。
theological_decisions:
- issue: 大地位于众海和江河之上的宇宙图景
  choice: 直接保留诗歌性的宇宙水域意象
  alternative: 将其解释为纯粹比喻性的稳定，或改写成符合现代科学表述的创造语言
  rationale: 原文以希伯来诗歌中的创造秩序图景颂扬耶和华；译文不应消解、科学化或替原文裁定其图景性质。
- issue: 阴性宾语后缀所指
  choice: 首处译作“大地”，次处译作“它”
  alternative: 两处均译作“它”或均重复“大地”
  rationale: 后缀自然回指第1节的 אֶרֶץ。首处明示“大地”有助于本节独立阅读，次处用“它”则避免汉语重复过重，同时不改变所指。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；以“奠基／稳立”和“众海／江河”形成平行。没有加入原文所无的科学解释或宗派性阐释。
