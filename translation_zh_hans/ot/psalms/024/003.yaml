  text: מִֽי יַעֲלֶ֥ה בְ/הַר יְהוָ֑ה וּ/מִי יָ֝קוּם בִּ/מְק֥וֹם קָדְשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/003.yaml
  text: Who may ascend the mountain of Yahweh? And who may stand in his holy place?[a]
translation:
  language: zh_hans
  text: 谁可登上雅威的山[a]？谁又可站在他的圣洁之处？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山”也可译作“山丘”。希伯来语 הַר 可指山或山丘；此处正文采用本诗中较常见的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 直接对应疑问代词，并自然引出关于谁具备资格的修辞性问题。
- source_word: יַעֲלֶה
  choice: 可登上
  rationale: עלה意为“上去、登上”；“可”在此保留未完成式在礼仪语境中所表达的许可或资格，不仅表示将来的动作。
- source_word: בְהַר
  choice: ……的山
  rationale: הַר可指山或山丘；正文采用简洁而常见的“山”，并以脚注保留另一可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文的四字神名作音译，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: וּמִי
  choice: 谁又
  rationale: “又”体现连接词וּ，并保持两个平行问句之间的递进与诗歌节奏。
- source_word: יָקוּם
  choice: 可站
  rationale: קום在此指站立、立于某处；与“登上”平行，并在敬拜语境中表达获准来到并立于上帝面前的资格。
- source_word: בִּמְקוֹם קָדְשׁוֹ
  choice: 在他的圣所
  rationale: 原文直义为“在他的圣洁之处”。“他的圣所”是自然、庄重的现代汉语，既表达属于他的神圣地方，也符合本节的敬拜场景。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名；音译“雅威”保留这一点，不以“主”这一称号替换。
- issue: 两个未完成式动词在问句中的语气
  choice: 可登上／可站
  alternative: 能登上／能站；将登上／将站立
  rationale: 本节所问侧重谁有资格或蒙许可来到雅威面前，而不只是能力或未来事实；“可”保留这种礼仪与道德层面的张力，不进一步界定资格如何获得。
- issue: קָדְשׁוֹ所指的神圣地点
  choice: 他的圣所
  alternative: 他的圣洁之地
  rationale: “圣所”自然传达属于雅威、因其同在而神圣的地方；同时不具体断定是圣殿中的哪一部分。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。两个“谁可”保留希伯来诗句的平行结构，“又”对应连接词并使汉语节奏自然。
