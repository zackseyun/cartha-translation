  text: מִ֥י זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְ֭הוָה עִזּ֣וּז וְ/גִבּ֑וֹר יְ֝הוָ֗ה גִּבּ֥וֹר מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/008.yaml
  text: Who is this King of glory? Yahweh[a], strong and mighty; Yahweh, mighty in battle.
translation:
  language: zh_hans
  text: 这位荣耀之王是谁？雅威[a]，刚强而勇猛；雅威，在争战中勇猛。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来语神名יהוה的音译；传统上也译作“耶和华”。
    reason: divine_name
  - marker: b
    text: 或译：“在战争中勇猛。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: 这位……是谁
  rationale: מִי与זֶה构成直接问句；用现代汉语“这位……是谁”保留礼仪性问答的语势，并与指人的“王”自然搭配。
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: 荣耀之王
  rationale: 按希伯来语联属结构直译，保留“荣耀”作为称号核心，也便于与本诗反复出现的问句呼应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见形式音译四字神名，保留其作为以色列之神专名的性质，不以称号代替。
- source_word: עִזּוּז וְגִבּוֹר
  choice: 刚强而勇猛
  rationale: 分别表达עִזּוּז的力量和גִבּוֹר的勇武色彩，避免把两个相邻词合并成同一概念，同时保持简洁有力的平行节奏。
- source_word: גִּבּוֹר מִלְחָמָה
  choice: 争战中勇猛
  rationale: 保留גִּבּוֹר与מִלְחָמָה的形容性和战争语境，不擅自增添原文未明说的身份名词；脚注列出自然的名词化译法。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名。正文采用较贴近学界通行复原读音的“雅威”，并在脚注说明汉语传统译名，以兼顾源文辨识和读者熟悉度。
- issue: גִּבּוֹר מִלְחָמָה是性质描述还是身份称谓
  choice: 争战中勇猛
  alternative: 善战的勇士
  rationale: 原短语容许形容性或名词化理解；正文不把它限定为身份称谓，脚注保留“勇士”这一可能读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以两个简短分句保留原诗问答式、宣告式的节奏。“刚强而勇猛”与“争战中勇猛”有意重现原文גִּבּוֹר的重复。
