base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/000.yaml
  text: A psalm of David[a]. Yahweh's is the earth and its fullness[b], the world and those who dwell in it.
translation:
  language: zh_hans
  text: '大卫的诗[a]


    大地和其中的一切，

    世界和住在其中的人，

    都属耶和华。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的”也可理解为“大卫所作的”、“献给大卫的”或“关于大卫的”；原文介词本身未明确限定这种关系。
    reason: source_ambiguity
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 指配以音乐或用于歌唱的诗篇；在现代中文诗篇标题中译作“诗”简洁自然。
- source_word: לַיהוָה
  choice: 都属耶和华
  rationale: 介词 לְ 表示归属；原文将“属耶和华”置于句首以突出主权，中文为清楚涵盖两个并列诗行，将“都属耶和华”置于末行。神名 יהוה 音译为“耶和华”。
- source_word: הָאָרֶץ וּמְלוֹאָהּ
  choice: 大地和其中的一切
  rationale: מְלוֹאָהּ 字面为“其所充满的”，意指大地所包含的一切；此译自然且保留范围的完整性。
- source_word: תֵּבֵל
  choice: 世界
  rationale: 指有人居住的世界或寰宇；“世界”是现代普通话中自然、庄重的对应表达。
- source_word: יֹשְׁבֵי בָהּ
  choice: 住在其中的人
  rationale: 分词复数意为居住者；补出“人”符合中文习惯，同时不改变所指。
theological_decisions:
- issue: יהוה 的译法
  choice: 耶和华
  alternative: 上主／主
  rationale: 原文使用专名 יהוה，并非普通称谓；采用传统中文音译以保留专名性质，不以称号取代。
- issue: לְדָוִד 所表达的关系
  choice: 大卫的诗，并加注说明歧义
  alternative: 大卫所作的诗／献给大卫的诗
  rationale: 标题中的 לְ 可表示作者、归属、关联或奉献对象；正文不把可能的作者关系说得过死，并以脚注保留其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。以三个短行呈现希伯来诗句的并列结构，并在末行统一表达归属关系；避免生硬直译“其中所充满的”。
