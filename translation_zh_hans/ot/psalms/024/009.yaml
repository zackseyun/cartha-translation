  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וּ֭/שְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָבֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/009.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: zh_hans
  text: 众门哪，抬起你们的头！亘古的[a]门户啊，也要抬起头来！愿荣耀之王进入！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亘古的”也可译作“永存的”。这里的希伯来语可指年代久远，也可指长久存留。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: 抬起
  rationale: 复数命令式，诗意地向城门发出呼召；“抬起”保留了原文鲜明的动作意象。
- source_word: שְׁעָרִים
  choice: 城门
  rationale: 可指城市或圣所的门；现代汉语中“城门”能自然承接拟人化呼语，并呈现宏伟入口的图景。
- source_word: רָאשֵׁיכֶם
  choice: 你们的头
  rationale: 直译为“你们的头”。保留城门有“头”的拟人和隐喻，不将其解释性改写为门楣或“敞开”。
- source_word: וּשְׂאוּ
  choice: 你们要被举起
  rationale: 与前一命令构成平行，并按照马所拉文本的拼写保留被动意味；不擅自补出未明说的施动者。
- source_word: פִּתְחֵי עוֹלָם
  choice: 古老的门
  rationale: עוֹלָם 在此可表达悠久年代，也可能带有长存的含义；正文采用自然的“古老”，并以脚注保留另一可能。
- source_word: וְיָבֹא
  choice: 好让……进来
  rationale: 承接命令表达目的或结果；“进来”自然体现穿过门进入。
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: 荣耀的王
  rationale: 保留原文属格结构所形成的庄严称号，也便于在本诗上下文中重复。
theological_decisions:
- issue: 是否保留城门“有头”的拟人和隐喻
  choice: 正文译作“众城门哪，抬起你们的头”
  alternative: 意译为“众城门哪，要大大敞开”
  rationale: 原文明确使用“头”并直接呼唤城门；保留这一意象更忠实地呈现诗歌和礼仪性的张力。
- issue: 如何理解 פִּתְחֵי עוֹלָם 中的 עוֹלָם
  choice: 正文译作“古老的门”
  alternative: “永存的门”或“永久的门”
  rationale: 该词既可指远古、悠久，也可指持续长存。正文选择符合建筑语境的“古老”，脚注保留真实的词义歧义，避免把门本身明确断定为形而上的永恒。
- issue: 第二个 שְׂאוּ 的语态
  choice: 译作“你们要被举起”
  alternative: “你们要抬起来”
  rationale: WLC 此处的 וּשְׂאוּ 按其形式可理解为被动命令式；采用被动译法，同时不补出施动者，以保留诗句的开放性。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体。以“众城门哪”“古老的门哪”呈现复数呼语；保留拟人、平行结构及“荣耀的王”这一称号。脚注标记紧随存在词义歧义的“古老的门哪”之后。
