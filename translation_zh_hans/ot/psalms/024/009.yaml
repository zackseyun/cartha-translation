- from: 众城门哪，抬起你们的头！古老的门哪[a]，你们要被举起，好让荣耀的王进来！
  to: 众门哪，抬起你们的头！亘古的[a]门户啊，也要抬起头来！愿荣耀之王进入！
  rationale: 修订纠正了将第二个 Qal 命令式误作被动的语法说明和译法，并以“也要抬起头来”在自然现代汉语中保留与前半节相应的重复命令及门被拟人化的“头”这一意象。“众门”不预设门属于城市或圣所；“亘古的门户”保留 עוֹלָם 的年代久远含义，脚注则保留其长久存留的另一可能。
