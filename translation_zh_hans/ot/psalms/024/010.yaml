  text: מִ֤י ה֣וּא זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְהוָ֥ה צְבָא֑וֹת ה֤וּא מֶ֖לֶךְ הַ/כָּב֣וֹד סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/010.yaml
  text: Who is this King of glory? Yahweh of hosts—he is the King of glory[b][a]. Selah
translation:
  language: zh_hans
  text: 这位荣耀的王是谁？万军之耶和华[a]——他就是荣耀的王。细拉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之耶和华”也可译作“众军之耶和华”；这里的“万军”可广泛指天上的军旅或有组织的力量。
    reason: lexical_alternative
  - marker: b
    text: “细拉”可能是音乐或礼仪用语，确切含义不详。
    reason: cultural_note
lexical_decisions:
- source_word: מִי הוּא זֶה
  choice: 这位……是谁
  rationale: 希伯来语的疑问词、代词和指示词共同构成强调性的问句；译为“这位……是谁”既自然，也保留庄严的反问语气。
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: 荣耀的王
  rationale: 保留“王”与“荣耀”的属格关系；现代汉语中“荣耀的王”自然、庄重，也不把短语解释性改写为“荣耀之王”以外的其他含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代中文读者熟悉的专名“耶和华”直接呈现四字神名，而不是以“主”这一称号替代。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 在神圣称号中采用中文已有且简洁的“万军之耶和华”；“万军”保持复数群军的广度，不限定为地上的军队。
- source_word: הוּא
  choice: 他就是
  rationale: 明译希伯来语中显出的强调代词，以“就是”突出身份确认，但不额外加入“唯独”等排他意义。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切含义不明，采用通行音译，避免把不确定的礼仪或音乐功能写入正文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列上帝的专名。中文正文以广为人知的传统音译“耶和华”呈现专名，不用“主”替代；“雅威”是更贴近学界常见重构发音的可选音译。
- issue: 称号 יְהוָה צְבָאוֹת 的范围
  choice: 万军之耶和华
  alternative: 众军之耶和华
  rationale: “万军”保留该称号可涵盖天上军旅或受统辖众军的宽泛性，不将所指缩窄为人间军队。
- issue: 重复确认 הוּא מֶלֶךְ הַכָּבוֹד 的强调
  choice: 他就是荣耀的王
  alternative: 他是荣耀的王
  rationale: “就是”传达显出的代词所带来的强调和认定，同时不添加原文没有明说的排他性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留问答式礼仪结构、神圣称号的重复和“细拉”的音译；脚注标记均置于相关正文之后。
