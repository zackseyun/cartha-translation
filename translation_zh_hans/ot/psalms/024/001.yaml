  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר לַֽ֭/יהוָה הָ/אָ֣רֶץ וּ/מְלוֹאָ֑/הּ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/001.yaml
  text: A psalm of David[a]. The earth and its fullness are Yahweh’s[b], the world and those who dwell in it.
translation:
  language: zh_hans
  text: '大卫的诗[a]。


    大地和其中的一切都属于雅威[b]；

    世界和住在其中的人也都属于他。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的”也可理解为“大卫所作的”或“为大卫而作的”。
    reason: 原文介词 לְ 可表示作者、归属或献呈，标题本身没有进一步限定。
  - marker: b
    text: “雅威”是希伯来文 יהוה 所表示的神名；有些译本译作“耶和华”或“上主”。
    reason: 说明神圣专名的原文形式及常见译法。
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 可表示作者、归属或献呈关系。“大卫的”适合中文诗篇标题，并保留原文未明确限定“由大卫所作”还是“为大卫而作”的含义；其他可能译法列入脚注。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中的常用术语，指配乐吟唱的诗歌；“诗”简洁自然，也符合中文《诗篇》的体裁称谓。
- source_word: לַיהוָה
  choice: 属于雅威
  rationale: 希伯来文以无动词句表达所有权。中文补出“属于”，清楚自然；神名 יהוה 按其专名译作“雅威”。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ 也可指某一片土地，但这里与 תֵּבֵל“世界”平行，语境具有普世范围，因此译作“大地”。
- source_word: וּמְלוֹאָהּ
  choice: 和其中的一切
  rationale: מְלוֹא 字面指“充满之物、全部内容”。“其中的一切”以自然现代汉语表达大地所包含的一切，而不把它误解为抽象的“丰满”或“丰盛”。
- source_word: תֵּבֵל
  choice: 世界
  rationale: תֵּבֵל 常指有人居住、秩序井然的世界；“世界”是自然准确的对应词，其有人居住的意味由下句进一步说明。
- source_word: וְיֹשְׁבֵי בָהּ
  choice: 和住在其中的人
  rationale: 保留分词 יֹשְׁבֵי 的动作意味，即“居住的人”，同时使用现代中文自然表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列神的专名 יהוה。音译“雅威”保留其作为神圣专名的性质，不以称号代替，也不采用较晚形成的混合读音。
- issue: 第二诗行中省略的所属关系
  choice: 补出“也都属于他”
  alternative: 世界和住在其中的人
  rationale: 希伯来诗歌第二行承接第一行的无动词所属句，谓语“属于雅威”在原文中省略。中文补出“也都属于他”可清楚呈现平行关系，并未增加新的神学主张。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以分行和分号呈现希伯来文的平行结构；“其中的一切”避免生硬直译“其丰满”，“住在其中的人”则保留原文分词的动态色彩。
