base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/005.yaml
  text: He will receive blessing from Yahweh[a], and righteousness from the God of his salvation.
translation:
  language: zh_hans
  text: 他必从雅威领受福分，也必从那位赐他救恩的上帝领受公义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“伸冤”或“公正”。希伯来语这个词既可指道德上的公义，也可带有司法裁决和施行拯救的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: 领受
  rationale: 该动词本义可指“举起、承担、携带”，但以“福分”为宾语时，语境中的习惯义是“得到、领受”。“领受”自然庄重，也体现福分由上帝赐下。
- source_word: בְרָכָה
  choice: 福分
  rationale: 保留希伯来语单数，指从雅威而来的恩惠。“福分”在现代汉语中比抽象的“祝福”更清楚地表示所得之福。
- source_word: מֵאֵת יְהוָה
  choice: 从雅威
  rationale: 介词短语表示来源；以“雅威”音译四字神名，保留经文直接使用的圣约之名。
- source_word: וּצְדָקָה
  choice: 也必……领受公义
  rationale: צְדָקָה可涵盖公义、正义以及司法性的申冤或判为义。正文采用较宽广的“公义”，并用脚注保留语境中可能的司法和拯救含义。汉语中补出第二个“领受”，使并列关系清楚自然。
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  choice: 从拯救他的上帝
  rationale: 原文直译为“从他救恩的上帝”。动态而不过度解释的表达“拯救他的上帝”在现代汉语中较自然，同时保留上帝是其救恩来源并施行拯救的意思。
- source_word: יִשְׁעוֹ
  choice: 拯救他的
  rationale: 该名词可指救恩、解救或胜利。这里转化为关系分句，表达“他的救恩”所蕴含的上帝施救之意，但不限定拯救的具体方式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近学界通常重构读音的“雅威”，以神名而非称号呈现；“耶和华”是汉语传统译名，但语音依据较间接。
- issue: צְדָקָה 在本节的含义
  choice: 公义
  alternative: 申冤（或公正）
  rationale: 本节说合宜敬拜者从上帝所得之物。“公义”保留道德、关系及圣约层面的宽度，不把含义预先限定为司法裁决；脚注指出它也可能强调上帝作出有利判决或施行拯救性的公正。
- issue: מֵאֱלֹהֵי יִשְׁעוֹ 的关系
  choice: 拯救他的上帝
  alternative: 赐他救恩的上帝（直译：他救恩的上帝）
  rationale: 希伯来语属格结构可以指上帝是救恩的来源，也可以突出上帝施行拯救。正文用自然汉语呈现施救关系，同时脚注无需强行区分这些相通含义。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“领受福分”体现赐予与接受关系；两个“领受”使希伯来诗句的并列结构在汉语中清晰。“拯救他的上帝”避免生硬的“他救恩的上帝”，同时不引入特定宗派解释。
