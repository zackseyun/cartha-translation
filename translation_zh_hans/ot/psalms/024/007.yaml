  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וְֽ֭/הִנָּשְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָב֗וֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/007.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: zh_hans
  text: 众门哪，抬起你们的头！亘古的门户[a]啊，你们要被举起，好让荣耀的王进来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永恒的门户”。希伯来语“亘古”一词既可表示久远的古昔，也可表示长久、永恒的持续。
    reason: 保留עוֹלָם在“古老”与“永恒”之间的词义张力。
lexical_decisions:
- source_word: שְׂאוּ
  choice: 抬起
  rationale: 这是复数祈使式，以拟人方式命令城门抬头；“抬起”自然有力，并保留诗歌意象。
- source_word: שְׁעָרִים
  choice: 众城门
  rationale: 该词通常指城门或圣所的门；“城门”符合此处君王入城的宏大图景，“众”体现复数。
- source_word: רָאשֵׁיכֶם
  choice: 你们的头
  rationale: 直译为“你们的头”。保留这一表达，可维持城门被人格化的鲜明意象，不将其解释性地改写为“门楣”或“门顶”。
- source_word: וְהִנָּשְׂאוּ
  choice: 你们要高高升起
  rationale: Nifal祈使式带有“被举起／升起来”的意味；汉语“高高升起”既呼应前句，又避免生硬的被动句式。
- source_word: פִּתְחֵי עוֹלָם
  choice: 亘古的门户
  rationale: פִּתְחֵי指入口、门洞或门户，与前句“城门”平行；עוֹלָם在这里既可指久远的古昔，也可能含持续长存之意。“亘古”保持庄严诗体，并以脚注保存“永恒”的可能。
- source_word: וְיָבֹא
  choice: 好让……进来
  rationale: 连接词加未完成式在祈使句之后自然表达目的或结果；“好让”是现代汉语中清楚自然的表达。
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: 荣耀的王
  rationale: 按希伯来语属格结构直译，保留其作为尊称的庄严和颂赞意味，而不简化为“荣耀之王”之外的解释性称谓。
theological_decisions:
- issue: 是否保留城门和门户受直接呼唤的拟人手法及君王入城意象
  choice: 保留“抬起你们的头”和“高高升起”的直接呼唤
  alternative: 意译为“打开城门，让荣耀的王进来”
  rationale: 原文直接向城门、门户发出命令，并赋予城门“头”。保留这一诗歌意象，可维持经文的礼仪感和君王进场的张力，同时不预先限定其历史性、末世性或弥赛亚性解释。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体。“众城门哪……门户啊”保留希伯来诗歌的平行呼语；“头”不作建筑学解释，以保存原文拟人意象。脚注标记置于其实际所说明的“亘古的门户”之后。
