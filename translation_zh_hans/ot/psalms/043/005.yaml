  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וּֽ/מַה תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֣וֹד אוֹדֶ֑/נּוּ יְשׁוּעֹ֥ת פָּ֝נַ֗/י וֵֽ/אלֹהָֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: zh_hans
  text: 我的心哪，你为何低落？为何在我里面烦乱？应当仰望上帝，因为我还要赞美他；他是我面容的拯救[a]，是我的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“我脸面的诸拯救和我的上帝”。“诸拯救”也可理解为“帮助”或“救助”；这句浓缩的表达可能指上帝的拯救使诗人低垂的面容重新抬起，也可按另一种句法理解为“我的拯救和我的上帝”。
    reason: 保留“拯救”的复数形式、面容意象及原文末句的句法含混，避免将一种解释当作正文唯一意思。
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: 低沉
  rationale: 该词描写向下弯曲、俯伏的状态；用于内心时也表达沮丧消沉。“低沉”在现代汉语中自然，并保留向下的意象。
- source_word: נַפְשִׁי
  choice: 我的心哪
  rationale: נֶפֶשׁ在此指诗人对其内在自我的称呼。汉语诗歌和祷告语体中，“我的心哪”比“我的灵魂哪”更自然，也不把该词限定为某种灵魂观。
- source_word: תֶּהֱמִי
  choice: 躁动
  rationale: 该动词表示喧腾、扰动或不安。“躁动”简洁地传达内在翻腾不宁。
- source_word: עָלַי
  choice: 在我里面
  rationale: 字面义为“在我之上”，但在自我对话的语境中指内心的扰动；汉语用“在我里面”表达最为通顺。
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: 要仰望上帝
  rationale: 该命令表示带着期待等候上帝。“仰望”是现代汉语中自然、庄重的表达，同时包含信靠与等候。
- source_word: עוֹד אוֹדֶנּוּ
  choice: 我还要赞美他
  rationale: עוֹד指尽管目前困苦，未来仍会赞美；“还要”保留这种面向未来且与现状相逆的意味。
- source_word: יְשׁוּעוֹת פָּנַי
  choice: 他拯救我，使我重新昂首
  rationale: 希伯来语字面为“我脸面的诸拯救”，属浓缩而含混的诗句。结合本节开头“低沉”的形象，此译自然表达上帝的拯救使诗人不再垂首，同时以脚注保留原文措辞及其他理解。
- source_word: וֵאלֹהָי
  choice: 他是我的上帝
  rationale: 将并列名词短语补成完整汉语分句，使结尾清楚庄重，不改变其认信内容。
theological_decisions:
- issue: יְשׁוּעוֹת פָּנַי的含义与句法关系
  choice: 他拯救我，使我重新昂首
  alternative: 我面容的拯救；我面容的帮助；我的拯救和我的上帝
  rationale: 马所拉文本直译为“我脸面的诸拯救和我的上帝”，可理解为上帝施行拯救，使诗人低垂的脸重新抬起。正文采用可懂的汉语表达这一意象，但不把含混处隐藏起来，脚注列出字面形式及主要译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“我的心哪”保留自我呼唤，“低沉—重新昂首”贯通全节的形象；避免古奥的“愁烦”“面光”等词，也不加入宗派性解释。
