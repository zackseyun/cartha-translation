id: PSA.43.2
reference: Psalms 43:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה אֱלֹהֵ֣י מָֽעוּזִּ/י֮ לָ/מָ֪ה זְנַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֶתְהַלֵּ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/002.yaml
  text: For you are the God of my refuge[b][a]; why have you rejected me? Why do I go about mourning under the oppression of the enemy?
translation:
  language: zh_hans
  text: '因为你是作我避难所的上帝[a]；

    你为什么弃绝我？

    我为什么因仇敌的欺压，

    黯然行走[b]？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你是我坚固保障的上帝”，或“你是赐我力量的上帝”。希伯来语名词可按语境指避难所、坚固堡垒或力量。
    reason: lexical_alternative
  - marker: b
    text: 或译“哀伤地行走”。希伯来语直指人在昏暗、阴沉的状态中行走，在这里可用来表达哀伤。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文祈求并说明其根据；保留因果关系，也符合现代汉语诗歌语流。
- source_word: אֱלֹהֵי מָעוּזִּי
  choice: 作我避难所的上帝
  rationale: מָעוֹז可指避难所、坚固堡垒或力量来源；此译保留保护意象，并以自然汉语表达原文的组合关系。
- source_word: זְנַחְתָּנִי
  choice: 弃绝我
  rationale: זנח表示拒绝、丢弃；“弃绝”保留哀歌中强烈的质问，又不擅自解释为彻底离弃。
- source_word: קֹדֵר
  choice: 黯然
  rationale: 该词本义与昏暗、变黑有关，在此可形容因悲哀而面色阴沉；“黯然”同时保留昏暗意象和哀伤含义。
- source_word: אֶתְהַלֵּךְ
  choice: 行走
  rationale: 保留הלך的行走意象及未完成式所表达的持续状态，不加入“不得不”等原文没有的必然意味。
- source_word: בְּלַחַץ אוֹיֵב
  choice: 因仇敌的欺压
  rationale: לַחַץ表示压迫、逼迫；介词בְּ在此可表达处境或原因，“因……的欺压”在汉语中清楚自然，同时承认也可理解为处于欺压之下。
theological_decisions:
- issue: 哀歌中对上帝弃绝诗人的直接质问
  choice: 你为什么弃绝我？
  alternative: 你为什么离开我？／你为什么丢弃我？
  rationale: 原文直接诉说诗人所感受到的上帝拒绝，不应弱化为一般的情绪低落，也不应加入教义解释来消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，保留两次“为什么”的平行质问。分行呈现原句的哀歌节奏；“黯然行走”刻意保留昏暗与哀伤之间的语义张力。
