  to: 神啊，求你为我伸冤，向不忠的民族申辩我的案件[a]；求你救我脱离诡诈不义的人。
  rationale: 将“国民”统一改为“民族”，以准确对应 גּוֹי 并符合现代汉语用法；将第二个法律祈求明示为“申辩我的案件”，以反映 וְרִיבָה רִיבִי 的同源法律习语。其余措辞保持原译的祷告语体、法律意象和语义范围。
