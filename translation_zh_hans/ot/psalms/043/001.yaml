  terminology: “神啊”“为我伸冤”“诡诈不义的人”“救我脱离”均恰当、庄重且符合现代标准汉语。“不忠的民族”保留 חָסִיד 被否定时的忠诚／忠贞维度；脚注保留“不敬虔”这一可行译法，且不将其狭义化。
