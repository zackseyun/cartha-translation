  text: שָׁפְטֵ֤/נִי אֱלֹהִ֨ים וְ/רִ֘יבָ֤/ה רִיבִ֗/י מִ/גּ֥וֹי לֹא חָסִ֑יד מֵ֤/אִישׁ מִרְמָ֖ה וְ/עַוְלָ֣ה תְפַלְּטֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/001.yaml
  text: Vindicate me[a], O God, and plead my cause against an unfaithful nation; deliver me from the deceitful and unjust man.
translation:
  language: zh_hans
  text: 神啊，求你为我伸冤，向不忠的民族申辩我的案件[a]；求你救我脱离诡诈不义的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不忠的民族”也可译作“不敬虔的民族”；希伯来文直译为“一个不忠诚的民族”。
    reason: 保留 לֹא חָסִיד 的词义幅度；该表达可指缺乏忠诚或忠贞，也可泛指不敬虔。
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: 求你为我伸冤
  rationale: 此处 שׁפט 是诉讼语境中的祈求，重在请求神作出有利裁决；“为我伸冤”自然地保留法庭意象，并避免被理解为单纯审察诗人。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 原文为祷告中的直接呼语；“神啊”符合现代汉语祷告语体。
- source_word: וְרִיבָה רִיבִי
  choice: 为我……争辩
  rationale: 动词 ריב 与同根名词 ריב 构成法律习语，指承担并申辩某人的案件；中文以“为我与……争辩”兼顾法律意象和自然表达。
- source_word: מִגּוֹי לֹא חָסִיד
  choice: 与不忠的国民争辩
  rationale: 在诉讼语境中，介词 מִן 标示对方；חָסִיד 的否定形式指缺乏忠诚或信实。“不忠”保留其关系与伦理层面的含义；גּוֹי 可指一国或其人民，此处“国民”能自然地作为诉讼对方。
- source_word: מֵאִישׁ מִרְמָה וְעַוְלָה
  choice: 脱离诡诈不义的人
  rationale: “人”保持 אִישׁ 的单数形式；两个抽象名词描述此人的特征，译为“诡诈不义”简洁而贴合语境。
- source_word: תְפַלְּטֵנִי
  choice: 求你救我脱离
  rationale: פלט 的加强词干表示使人逃脱、将人带到安全之处；“救我脱离”清楚表达紧迫的拯救祈求。
theological_decisions:
- issue: 否定表达 לֹא חָסִיד 中 חָסִיד 的译法
  choice: 不忠
  alternative: 不敬虔；没有忠贞之爱
  rationale: חָסִיד 与 חֶסֶד 的忠诚、忠贞和委身语义相关。“不忠”保留关系性与伦理性，同时不把原文限定为某一教义术语；脚注说明其他可能理解。
- issue: 诉讼祈求 שָׁפְטֵנִי 的含义
  choice: 为我伸冤
  alternative: 审判我；为我作出裁决
  rationale: 上下文中的“为我的案件争辩”表明诗人求神主持公道，而非仅求神评价自己；“伸冤”表达有利判决的语用含义，但不主张诗人在一切事上绝对无罪。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“神啊，求你……”保持祷告呼语；“伸冤、争辩、诡诈不义”保留原文的法律与伦理色彩。正文中的脚注标记与脚注条目对应。
