source:
  edition: WLC
  text: שְׁלַח אוֹרְ/ךָ֣ וַ֭/אֲמִתְּ/ךָ הֵ֣מָּה יַנְח֑וּ/נִי יְבִיא֥וּ/נִי אֶל הַֽר קָ֝דְשְׁ/ךָ֗ וְ/אֶל מִשְׁכְּנוֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/003.yaml
  text: Send out your light and your truth[a]; let them lead me[b]; let them bring me to your holy mountain and to your dwelling places.
translation:
  language: zh_hans
  text: 求你发出你的光和你的真理[a]，让它们引导我，带我到你的圣山，到你的居所[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真理”也可译作“忠信”；此希伯来词可表示真理、可靠性或忠信。
    reason: lexical_alternative
  - marker: b
    text: “居所”在希伯来文中是复数形式；传统译作“帐幕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: 求你发出
  rationale: 这是阳性单数第二人称的祈使式。译作“求你发出”既保留差遣而出的意味，也以现代汉语自然表达诗人的祈求。
- source_word: אוֹרְךָ
  choice: 你的光
  rationale: אוֹר的基本义是“光”。这里虽可能含有引导、拯救之意，正文仍保留具体诗歌意象，不改译为抽象解释。
- source_word: וַאֲמִתְּךָ
  choice: 和你的真理[a]
  rationale: אֱמֶת可指真理、真实、可靠或忠信。“真理”最直接，并以脚注保留“忠信”这一语义可能。
- source_word: הֵמָּה יַנְחוּנִי
  choice: 让它们引导我
  rationale: 独立复数代词הֵמָּה承接“光”和“真理”，后接复数动词；“它们”保留原文的强调和拟人化表达。未完成式在祈使句后带愿望、祈使语气，故译为“让它们……”。
- source_word: יְבִיאוּנִי
  choice: 带我到
  rationale: 该使役词形表达“使我来到／把我带到”。“带我到”自然简洁，并延续前句引导前行的动态意象。
- source_word: הַר קָדְשְׁךָ
  choice: 你的圣山
  rationale: 原文直译为“你圣洁的山／你之圣洁的山”。“你的圣山”符合现代汉语，也不在正文中擅自明确为锡安。
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: 你的居所[b]
  rationale: מִשְׁכָּן的复数形式可指居所、住处或帐幕。汉语“居所”庄重自然，但数的形式不显明，故用脚注注明希伯来文为复数，并保留传统译法。
theological_decisions:
- issue: “光”和“真理／忠信”应解释为抽象属性，还是保留为拟人化的引导者
  choice: 保留复数代词所表达的诗歌拟人：“让它们引导我，带我到……”。
  alternative: 解释性改写为“以你的光和真理引导我”。
  rationale: 希伯来文明确用复数代词和复数动词回指“光”与“真理”。保留这一结构可维持诗歌张力，避免把意象提前化解为说明。
- issue: 是否在正文中把“圣山”和“居所”具体解释为锡安和圣殿
  choice: 采用原文较宽泛的意象“你的圣山”和“你的居所”。
  alternative: 译作“锡安山”和“你的圣殿”。
  rationale: 语境很可能指向锡安及圣所，但原文没有在本节直接使用这些更具体的名称；正文不应添加其未明说的指认。
- issue: אֱמֶת在此应译为“真理”还是“忠信”
  choice: 正文译“真理”，脚注注明也可译“忠信”。
  alternative: 正文译“忠信”。
  rationale: 该词兼有真实、可靠、忠信等语义；与“光”并列时两种理解皆有根据。正文采用直接对应，脚注保存真正的词义歧义，不把它局限为某一种神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你发出”体现祈使句在祷告中的自然汉语表达；“它们”刻意保留原文以“光”和“真理”为复数主体的拟人手法。正文避免使用较古旧的“帐幕”，但在脚注中保存传统译法及原文复数信息。
