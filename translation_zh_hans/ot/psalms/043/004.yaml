  text: וְ/אָב֤וֹאָה אֶל מִזְבַּ֬ח אֱלֹהִ֗ים אֶל אֵל֮ שִׂמְחַ֪ת גִּ֫ילִ֥/י וְ/אוֹדְ/ךָ֥ בְ/כִנּ֗וֹר אֱלֹהִ֥ים אֱלֹהָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/004.yaml
  text: Then I will go to the altar of God[a], to God, the joy of my rejoicing; and I will praise you with the lyre, O God[b], my God.
translation:
  language: zh_hans
  text: 于是，我要到上帝的祭坛，到上帝那里——他是我欢欣的喜乐[a]。上帝啊，我的上帝，我要用里拉琴[b]赞美你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我极大的喜乐。”希伯来语直译为“我欢欣的喜乐”，以两个表示喜乐的词加强语气。
    reason: lexical_alternative
  - marker: b
    text: 也可笼统译作“琴”或“竖琴”。希伯来语 כִּנּוֹר 指一种古代弦乐器，形制可能更接近里拉琴。
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבוֹאָה
  choice: 于是，我要到
  rationale: 该词是בוא的第一人称单数意愿式，承接上文的祈求，表达预期结果和立定的心志。“于是，我要到”既体现上下文的推进，也保留将来和意愿色彩。
- source_word: אֶל מִזְבַּח אֱלֹהִים
  choice: 到上帝的祭坛那里
  rationale: 按原文的领属结构直译，并用“那里”使现代汉语表达自然清楚。
- source_word: אֶל אֵל
  choice: 到上帝那里
  rationale: אֵל在此是对独一上帝的称谓，与אֱלֹהִים平行；译作“上帝”可保持所指一致，不人为制造两个不同称号之间的教义差别。
- source_word: שִׂמְחַת גִּילִי
  choice: 我欢欣的喜乐
  rationale: 原文将两个意义相近的喜乐词组合，用重复加强语气。此译刻意保留双重喜乐用语及其诗意张力，而不直接化约成“我极大的喜乐”。
- source_word: וְאוֹדְךָ
  choice: 我要……赞美你
  rationale: ידה的使役词干在此可指感谢或赞美；祭坛、乐器和直接呼告构成敬拜语境，因此“赞美”最贴切，同时不排斥感谢之意。
- source_word: בְכִנּוֹר
  choice: 弹奏里拉琴
  rationale: כִּנּוֹר指古代弦乐器，形制可能更接近里拉琴而非现代竖琴；补出“弹奏”符合汉语搭配。
- source_word: אֱלֹהִים אֱלֹהָי
  choice: 上帝啊，我的上帝
  rationale: 用“啊”清楚呈现呼格语气，并保留原文重复称呼及个人归属的表达。
theological_decisions:
- issue: אֱלֹהִים与אֵל两个神圣称谓的译法
  choice: 均译作“上帝”，保留重复和平行结构
  alternative: 把אֵל译作“大能的上帝”，或音译为“以勒”
  rationale: 本节以不同希伯来称谓诗意地指向同一位上帝，并无意区分不同神祇或建立称号之间的教义层级。统一译作“上帝”最清楚，也不额外加入原文未明说的属性。
- issue: שִׂמְחַת גִּילִי中双重喜乐表达的理解
  choice: 正文译作“我欢欣的喜乐”，保留原文两个近义词的叠加强调
  alternative: 译作“我极大的喜乐”或“使我无比喜乐的上帝”
  rationale: 原文的领属关系和双重喜乐用语具有诗性压缩及一定解释空间；正文不把它完全改写成程度副词或使役关系，脚注提供较传统、较顺畅的替代译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝啊，我的上帝”保留诗歌中的直接呼告；破折号提示后半句是对上帝的同位说明。“我欢欣的喜乐”略带诗性陌生感，旨在保留希伯来语的重复强调，并由脚注帮助普通读者理解。
