  text: לֹא אֶקַּ֣ח מִ/בֵּיתְ/ךָ֣ פָ֑ר מִ֝/מִּכְלְאֹתֶ֗י/ךָ עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/009.yaml
  text: I will not take a bull from your house[a], or goats from your pens.
translation:
  language: zh_hans
  text: 我不从你家中取公牛，也不从你圈里取公山羊。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶקַּח
  choice: 我不……取
  rationale: לקח 的 Qal 未完成式第一人称单数受 לֹא 否定；在此神的宣告中，可自然译为“我不取”，既可表达当前原则，也不排除将来指向。
- source_word: מִבֵּיתְךָ
  choice: 从你家中
  rationale: בַּיִת 在这里最自然地指敬拜者的房舍或产业范围，而非家庭成员；“家中”保留具体的空间意象。
- source_word: פָר
  choice: 公牛
  rationale: פָר 指公牛，尤其常见于献祭语境；“公牛”直接、准确，也符合现代汉语。
- source_word: מִמִּכְלְאֹתֶיךָ
  choice: 从你圈里
  rationale: מִכְלָאָה 指圈养牲畜的围栏或畜圈；“圈里”简洁自然，并与后面的公山羊相配。
- source_word: עַתּוּדִים
  choice: 公山羊
  rationale: עַתּוּדִים 明确指雄性的山羊；汉语“公山羊”自然保留了原文的性别信息，无须降格为泛称“山羊”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的诗体表达；两个“从”构成平行句式，“公牛／公山羊”保留献祭牲畜的具体类别。原文的未完成式在否定宣告中兼有惯常或将来意味，正文用“我不……取”保留这种开放性。
