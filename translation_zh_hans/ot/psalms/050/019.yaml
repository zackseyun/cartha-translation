base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/019.yaml
  text: You let your mouth loose for evil[b][a], and your tongue frames deceit.
translation:
  language: zh_hans
  text: 你放纵自己的口说恶言[a]；又使自己的舌头紧贴诡诈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你放开口，趋向邪恶。”
    reason: שׁלח本义可指放出、伸出；与“口”和“恶”连用，表示放任口舌朝向恶，未必只限于特定种类的恶言。
  - marker: b
    text: 或译：“你使自己的舌头与诡诈相连”，或“使自己的舌头与诡诈结伴”。
    reason: צמד的使役式表示使之贴附、连接或结合；原文保留舌头与诡诈结连的意象，未必特指编造谎言。
lexical_decisions:
- source_word: פִּיךָ
  choice: 自己的口
  rationale: 保留希伯来文以身体部位指言语的形象，并与下句“舌头”形成诗歌平行。
- source_word: שָׁלַחְתָּ
  choice: 任凭……说
  rationale: 该动词本义为“放出、伸出、差出”；与“口”和“恶”连用时，表达放任口舌趋向恶事。此译法自然，同时保留不加约束的意味。
- source_word: בְרָעָה
  choice: 恶言
  rationale: 介词可表示方向或所处领域；结合“口”的语境，以“说恶言”传达趋向邪恶的言语行为，但不把具体恶行限定得过窄。
- source_word: וּלְשׁוֹנְךָ
  choice: 你的舌头
  rationale: 直译身体部位意象，保留与“口”的平行结构。
- source_word: תַּצְמִיד
  choice: 相连
  rationale: צמד 的使役形表达使之贴近、连接或结合。译作“相连”保留其连接意象，也避免把原文进一步解释成“编造”。
- source_word: מִרְמָה
  choice: 诡诈
  rationale: “诡诈”可涵盖欺骗、奸诈和虚假，适合诗篇中道德谴责的庄重语域。
