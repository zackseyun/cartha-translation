  yaml_path: translation/ot/psalms/050/013.yaml
  text: Do I eat the flesh of bulls[a], or drink the blood of goats?
translation:
  language: zh_hans
  text: 难道我会吃公牛的肉，喝公山羊的血吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹכַל
  choice: 难道我会吃
  rationale: 疑问词与第一人称未完成式构成反问；“难道我会”自然传达其反问语气。
- source_word: בְּשַׂר
  choice: ……的肉
  rationale: בשר指肉体或肉；祭牲语境中译作“肉”具体、自然，也保留献祭图景。
- source_word: אַבִּירִים
  choice: 公牛
  rationale: 该词本可指“强壮者”，但在祭牲语境中与公山羊并列，指强壮的牛，即公牛。
- source_word: וְדַם
  choice: 喝……的血
  rationale: 连接词直译为“和”；汉语可在同一反问句中直接并列两个谓语，无须另加“或”，既自然又贴近希伯来文结构。
- source_word: עַתּוּדִים
  choice: 公山羊
  rationale: 该词特指雄性的山羊；明确译出“公山羊”，准确保留原文信息。
- source_word: אֶשְׁתֶּה
  choice: 喝
  rationale: 第一人称未完成式延续前半句的反问；汉语由句首“难道我会”统摄，末尾“吗”收束全句。
theological_decisions:
- issue: 关于上帝的拟人化献祭饮食语言
  choice: 照原文保留“吃肉、喝血”的具体反问
  alternative: 意译为“难道我需要你们的祭物吗”
  rationale: 本节否认上帝像人或异教神祇那样依赖祭物为食；保留具体祭祀图景，才能维持原文的修辞力度和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……吗”清楚呈现反问；“公牛”“公山羊”准确传达祭牲类别。无需脚注，因为正文已明确译出 עַתּוּדִים 的雄性含义。
