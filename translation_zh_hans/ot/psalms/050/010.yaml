  text: כִּי לִ֥/י כָל חַיְת/וֹ יָ֑עַר בְּ֝הֵמ֗וֹת בְּ/הַרְרֵי אָֽלֶף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/010.yaml
  text: For every wild animal of the forest is mine[b][a], the cattle on a thousand hills.
translation:
  language: zh_hans
  text: 因为林中所有的野兽都属于我，千山上的牲畜[a]也属于我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牲畜”所译的希伯来词也可泛指大型走兽；“山”也可译作“山岭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明上帝不需要从人手中取祭牲的理由；“因为”在现代汉语中自然清楚。
- source_word: לִי
  choice: 属于我
  rationale: 此处介词短语表达所有权；译作“属于我”准确而自然，并在后一诗行按希伯来诗歌省略结构补出。
- source_word: כָל חַיְתוֹ יָעַר
  choice: 林中所有的野兽
  rationale: חַיְתוֹ יָעַר 指森林中的野生动物；“所有的”体现 כָל 的整体范围。
- source_word: בְּהֵמוֹת
  choice: 牲畜
  rationale: 在与林中野兽相对的诗歌意象中，“牲畜”能自然表达较大型、常为家养的陆生动物；原词也可泛指大型走兽，因此加注说明。
- source_word: בְּהַרְרֵי אָלֶף
  choice: 千山上的
  rationale: 保留希伯来文“一千”与“山”的诗性图像，不将其解释性改写为“无数”或“遍地”。
theological_decisions:
- issue: 上帝所有权的范围与“一千”的诗性表达
  choice: 保留“千山”的原文意象，表达上帝对野兽和牲畜的全面所有权
  alternative: 解释性译为“所有山岭上的牲畜”或将其严格限定为恰好一千座山
  rationale: 诗句以森林野兽和山上牲畜构成互补图景。“千山”应按原文保留，既不消解其丰富诗意，也不把诗歌数字误缩为精确清单。
- issue: 第二分句省略所有格谓语
  choice: 补出“也属于我”
  alternative: 仅以逗号并列“林中所有的野兽，千山上的牲畜”
  rationale: 希伯来文的 לִי 同时支配两个诗行成分；现代汉语补出谓语并用“也”能清楚传达平行关系，而不改变所有权的范围。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“千山”保留诗歌凝练感；重复“属于我”使希伯来文省略的平行结构在汉语中清楚可读。
