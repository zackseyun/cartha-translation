  text: וְ֭/אַתָּה שָׂנֵ֣אתָ מוּסָ֑ר וַ/תַּשְׁלֵ֖ךְ דְּבָרַ֣/י אַחֲרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/017.yaml
  text: For you hate discipline[b][a], and you cast my words behind you.
translation:
  language: zh_hans
  text: 但[a]你恨恶管教[b]，把我的话抛在身后。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 连接词也可译作“而”或“因为”；这里按上下文译作“但”。
    reason: lexical_alternative
  - marker: b
    text: “管教”也可译作“训诲”“纠正”或“责备”；希伯来语 מוּסָר 包含借着教导和纠正来塑造人的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 但你
  rationale: 连接词可表示转折、承接或解释；结合上文对恶人的责问，译作“但”自然呈现对比，同时保留明说的第二人称代词“你”。
- source_word: שָׂנֵאתָ
  choice: 恨恶
  rationale: 该词是第二人称阳性单数完成式。这里描述受责者一贯的态度；汉语不必标明时态。“恨恶”准确而庄重，也不额外加强原词语气。
- source_word: מוּסָר
  choice: 管教
  rationale: 该词兼有教导、纠正、责备和纪律塑造之意。“管教”能较完整地传达其纠正与塑造人的含义；其他可能译法列入脚注。
- source_word: וַתַּשְׁלֵךְ
  choice: 把……抛
  rationale: 原动词意为“扔、抛”。“抛”保留鲜明的动作意象，也符合本诗庄重而直接的责问语气。
- source_word: דְּבָרַי
  choice: 我的话
  rationale: 按原文直译，不把其含义擅自缩窄为命令、教训或训诲。
- source_word: אַחֲרֶיךָ
  choice: 在身后
  rationale: 保留“在你身后”的空间比喻，表达拒绝并置之不理；不改成可能带有秘密行事含义的“背着你”。
theological_decisions: []
