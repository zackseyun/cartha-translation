base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/000.yaml
  text: A psalm of Asaph. God[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: zh_hans
  text: 亚萨的诗。神[a]，神，耶和华，已经说话，呼唤大地，从日出之处直到日落之处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头的神圣称谓也可理解为“万神之神耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: 亚萨的诗
  rationale: מִזְמוֹר指配乐或歌唱的诗篇；לְאָסָף可表示归于、属于或出自亚萨，正文采用简洁且保留一定关系弹性的传统表达。
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: 神，上帝，耶和华
  rationale: 按马所拉文本将三个神圣称谓并列呈现，不把它们预先合并成“万神之神”；中文用“神／上帝”区分前两个词，并以“耶和华”表达圣名。
- source_word: דִּבֶּר וַיִּקְרָא אָרֶץ
  choice: 已经发言，召唤大地
  rationale: 保留两个连续动词“说话”和“呼召”；“召唤大地”自然表达向全地发出的权威传唤。
- source_word: מִמִּזְרַח שֶׁמֶשׁ עַד מְבֹאוֹ
  choice: 从日出之处直到日落之地
  rationale: 原文以太阳升起和落下表示大地的全部范围；采用形象清楚的中文对应。
theological_decisions:
- issue: 开头三个神圣称谓的句法关系
  choice: 神，上帝，耶和华
  alternative: 上帝中的神耶和华；神，神，耶和华
  rationale: 希伯来语אֵל אֱלֹהִים יְהוָה可被理解为三个并列称谓，也有人视前两词为“万神之神”一类结构。正文尽量贴近表层次序，脚注保留其他可能。
- issue: 圣名יהוה的译法
  choice: 耶和华
  alternative: 上主
  rationale: 采用现代中文圣经读者熟悉的音译，以区别于一般称谓אֵל和אֱלֹהִים，同时不在正文中改写为头衔。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“已经发言”体现完成式所呈现的宣告已然发出；“召唤大地”保留审判场景中权威传唤的语气。脚注标记[a]已置于正文相应位置。
