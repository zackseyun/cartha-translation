  text: אִסְפוּ לִ֥/י חֲסִידָ֑/י כֹּרְתֵ֖י בְרִיתִ֣/י עֲלֵי זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/005.yaml
  text: Gather to me my faithful ones[a], those who make my covenant by sacrifice.
translation:
  language: zh_hans
  text: “把我忠信的人聚集到我这里来，就是那些以祭牲与我立约的人。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“那些在／借着祭牲切我的约的人。”“切约”是希伯来语“立约”的惯用说法；“在／借着”保留原文介词所表达关系的歧义。
    reason: 保留“切约”的原文惯用语，并不将 עֲלֵי זָבַח 与祭牲之间有争议的关系过度限定。
lexical_decisions:
- source_word: אִסְפוּ
  choice: 聚集
  rationale: 这是אסף的阳性复数祈使式；“聚集”自然、庄重，并保留命令语气。
- source_word: לִי
  choice: 到我这里来
  rationale: ל加第一人称单数后缀可表示“给我”或“到我这里”；在召集到上帝面前的语境中，“到我这里来”最清楚。
- source_word: חֲסִידָי
  choice: 我忠信的子民
  rationale: חסיד在此突出对圣约的忠诚与虔敬；“忠信的子民”既体现与上帝的关系，也避免“圣徒”可能带入的后期专门含义。
- source_word: כֹּרְתֵי
  choice: 立
  rationale: כרת与ברית连用，字面是“切约”，实际是“立约”的希伯来语惯用表达；正文采用自然汉语。
- source_word: בְרִיתִי
  choice: 与我立约
  rationale: ברית带第一人称单数后缀，字面为“我的约”；现代汉语在此用“与我立约”更自然，并准确表达圣约关系。
- source_word: עֲלֵי זָבַח
  choice: 以祭牲
  rationale: על在这里表示立约与献祭仪式的关联；זבח可指祭牲或祭祀，“以祭牲”保留具体意象，也不把关系解释得过窄。
theological_decisions:
- issue: חֲסִידָי在圣约语境中的含义
  choice: 我忠信的子民
  alternative: 我的圣民／我的虔诚人
  rationale: 该词指以忠诚回应上帝之约的人；所选译法保留圣约忠诚的意味，同时避免导入后期教会术语。
- issue: “切约”惯用语的译法
  choice: 与我立约
  alternative: 切立我的约／在祭牲之上与我立约
  rationale: “切约”是希伯来语立约惯用语，直译在现代汉语中容易造成误解；正文译出实际含义，脚注保留原文意象。
- issue: עֲלֵי זָבַח所表达的关系
  choice: 以祭牲
  alternative: 在祭牲之上／借着献祭
  rationale: 介词על在此可表达依托、伴随或仪式关联；“以祭牲”保留一定开放性，不进一步断定具体祭仪方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“子民”补足汉语表达所需的群体指称；分号展现召集对象与其说明之间的关系。脚注标记已在正文中出现。
