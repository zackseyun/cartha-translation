  yaml_path: translation/ot/psalms/050/015.yaml
  text: And call on me in the day of distress; I will deliver you[a], and you will honor me.
translation:
  language: zh_hans
  text: 患难之日，你要呼求我；我必搭救你，你就必尊崇我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“荣耀我”。希伯来语动词可表示“尊崇”或“荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאֵנִי
  choice: 你要呼求我
  rationale: 此处 קרא 带第一人称宾语后缀，表示向上帝呼求援助；“呼求我”自然地表达祈求和求助之意。
- source_word: בְּיוֹם צָרָה
  choice: 患难之日
  rationale: 这是常见的希伯来语时间表达；“患难之日”既保留诗歌的凝练形式，也涵盖困苦、危难和逆境。
- source_word: אֲחַלֶּצְךָ
  choice: 我必搭救你
  rationale: חלץ 的 Piel 词干在此表示从危险中救出；“搭救”是自然、清楚而庄重的现代汉语。
- source_word: וּתְכַבְּדֵנִי
  choice: 你也要尊荣我
  rationale: כבד 的 Piel 词干可表示尊敬或使得荣耀；“尊荣我”兼具给予尊重与归荣耀的含义，并保留原词的语义宽度。
theological_decisions:
- issue: 蒙上帝搭救之后人的回应
  choice: 你也要尊荣我
  alternative: 你也要荣耀我
  rationale: 希伯来文表达蒙救者应当把上帝当得的尊重与荣耀归给他。“尊荣”保留较宽泛的意义，不把它限定为礼仪性或颂赞性的表达；“荣耀”仍是可能译法。
translation_notes:
  register: 采用现代、庄重且易懂的诗歌语言。“患难之日”保留原文的时间结构；两个“你要”与“我必”清楚呈现命令、应许和回应之间的推进。
