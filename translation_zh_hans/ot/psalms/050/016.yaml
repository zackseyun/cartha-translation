  text: וְ/לָ֤/רָשָׁ֨ע אָ֘מַ֤ר אֱלֹהִ֗ים מַה לְּ֭/ךָ לְ/סַפֵּ֣ר חֻקָּ֑/י וַ/תִּשָּׂ֖א בְרִיתִ֣/י עֲלֵי פִֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/016.yaml
  text: But to the wicked God says[b][a], “What right do you have to recount my statutes and to take my covenant on your lips?”
translation:
  language: zh_hans
  text: '但上帝对恶人说：

    “你有什么资格述说我的律例，

    又把我的约挂在嘴上[a]？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“又把我的约放在你的口上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָרָשָׁע
  choice: 但……对恶人
  rationale: 介词短语引出上帝转向另一类人说话；连接词在上下文中带有转折意味。“恶人”保留 רָשָׁע 的道德类别含义。
- source_word: אָמַר אֱלֹהִים
  choice: 上帝……说
  rationale: 希伯来语虽用完成式，但诗歌中的直接引语公式可译为生动的现在时；汉语“说”本身不强制标明时态。
- source_word: מַה לְּךָ
  choice: 你有什么资格
  rationale: 该习语在此不是单纯询问信息，而是质问对方如此行的身份、正当性或分际；“有什么资格”自然传达责斥语气。
- source_word: לְסַפֵּר חֻקָּי
  choice: 述说我的律例
  rationale: סַפֵּר 表示讲述、宣说或逐一陈述；“述说”兼具自然与庄重感。חֻקִּים 指制定的法规，“律例”保留法律与圣约语境。
- source_word: וַתִּשָּׂא בְרִיתִי
  choice: 又把我的约……
  rationale: נשׂא 本义为拿起、承载，在“口上”这一搭配中指把约拿来谈说；中文以“把”字结构自然承接其宾语。
- source_word: עֲלֵי פִיךָ
  choice: 挂在嘴上
  rationale: 字面为“在你的口上”。“挂在嘴上”保留口头谈说的意象，也符合现代汉语表达；脚注补明较直译形式。
theological_decisions:
- issue: 对恶人的质问性质
  choice: 质问恶人在生活悖逆时述说上帝律例、谈论其约的正当性
  alternative: 绝对禁止恶人在任何意义上提及上帝的约
  rationale: מַה לְּךָ 是对其资格和行为一致性的责问；本节针对虚伪与背约，不必扩大为对一切提及圣约行为的全面禁令。
- issue: “我的约”在口上的意象
  choice: 指口头宣称、背诵或谈论上帝的约
  alternative: 指正式起誓或承担圣约义务
  rationale: “在口上”的直接意象首先涉及言语。上下文本身没有要求将其专门限定为起誓，因此保留较宽的表达范围。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“上帝”对应 אֱלֹהִים；分行保留希伯来诗句的平行结构。正文中的“有什么资格”明示习语的责问功能，“挂在嘴上”则以自然汉语保存原文的口部意象。
