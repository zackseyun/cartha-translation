source:
  edition: WLC
  text: בִּֽינוּ נָ֣א זֹ֭את שֹׁכְחֵ֣י אֱל֑וֹהַּ פֶּן אֶ֝טְרֹ֗ף וְ/אֵ֣ין מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/022.yaml
  text: Understand this[a], please, you who forget God, lest I tear you apart, and there be no one to rescue.
translation:
  language: zh_hans
  text: 忘记上帝的人哪，请明白这事，免得我把你们撕碎，无人搭救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּֽינוּ
  choice: 明白
  rationale: 这是בין的复数命令式，要求听者领会并认真辨明；“明白”直接、自然，也保留命令语气。
- source_word: נָא
  choice: 请
  rationale: 该语气词在这里加强恳切和急迫的劝告意味；“请”适合现代汉语，同时不把它误解为单纯的时间副词。
- source_word: זֹאת
  choice: 这事
  rationale: 指向上文所说的警告；“这事”比单说“这”更符合现代汉语，又没有具体增添原文未明说的内容。
- source_word: שֹׁכְחֵי אֱל֑וֹהַּ
  choice: 忘记上帝的人哪
  rationale: 分词短语作呼语，描述那些不把上帝放在心上的人；采用呼语结构，保留直接点名受众的力度。
- source_word: אֱל֑וֹהַּ
  choice: 上帝
  rationale: 这是单数的神称，译作“上帝”准确自然，不作原文无依据的扩充。
- source_word: פֶּן
  choice: 免得
  rationale: 引出若不听劝便可能临到的负面后果；“免得”简洁地保留警告关系。
- source_word: אֶ֝טְרֹ֗ף
  choice: 我把你们撕碎
  rationale: טרף带有猛兽撕裂猎物的鲜明意象；宾语在希伯来文中省略，但由受话者清楚可知，汉语补出“你们”使句意自然，并保留审判的严厉形象。
- source_word: וְ/אֵ֣ין מַצִּֽיל
  choice: 无人搭救
  rationale: 存在否定词与使役分词共同表示没有任何施救者；“无人搭救”凝练、自然，并保留绝无救援的意味。
theological_decisions:
- issue: אֶטְרֹף中的神圣审判意象
  choice: 保留猛兽撕裂猎物般的直接隐喻：“我把你们撕碎”。
  alternative: 弱化为“我毁灭你们”或“我捉住你们”。
  rationale: 原文刻意使用强烈的撕裂意象来表达上帝的审判。改成较抽象的“毁灭”会削弱经文的震撼力，并替文本消解其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“忘记上帝的人哪”保留诗歌中的直接呼告；后半句简洁有力，体现警告的急迫与审判意象。原文没有需要另列脚注的文本或词义歧义；英文脚注实际对应其正文所补出的宾语，而中文正文已自然补出“你们”，故不另设脚注。
