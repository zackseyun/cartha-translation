  text: יִקְרָ֣א אֶל הַ/שָּׁמַ֣יִם מֵ/עָ֑ל וְ/אֶל הָ֝/אָ֗רֶץ לָ/דִ֥ין עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/004.yaml
  text: 'He calls to the heavens above and to the earth[a], that he may judge his people:'
translation:
  language: zh_hans
  text: 他呼唤高天和大地，为要审判他的子民。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקְרָא
  choice: 呼唤
  rationale: קרא 的 Qal 未完成式可表示“呼叫”或“召集”。“呼唤”在现代汉语中自然，也保留了司法场景中“传召”的潜在意味，而不把该意味定得过死。
- source_word: אֶל הַשָּׁמַיִם מֵעָל
  choice: 向上面的诸天
  rationale: אֶל 表示所呼唤的对象；מֵעָל 在此修饰“诸天”，意为“上面的”。“诸天”保留诗歌中的复数形式和宇宙性范围。
- source_word: וְאֶל הָאָרֶץ
  choice: 和大地
  rationale: “大地”与“诸天”构成诗歌性的天地对应；汉语中承接“向……呼唤”时，第二个“向”可自然省略。
- source_word: לָדִין
  choice: 为要审判
  rationale: 带 ל 的不定式表达目的。“为要审判”清楚呈现目的关系，并保持庄重语体。
- source_word: עַמּוֹ
  choice: 他的子民
  rationale: עם 带第三人称阳性单数词尾，指“他的人民”。“子民”在此能表达属于神的群体关系，又不引入现代政治国家的含义。
theological_decisions:
- issue: 隐含主语的身份
  choice: 保留为“他”
  alternative: 明确译作“上帝”
  rationale: 本节希伯来文只有第三人称阳性单数动词，并未明说主语；上下文指向上帝。译作“他”忠实保留本节的篇章衔接，避免补入原文未明说的名词。
- issue: 诸天和大地在司法场景中的角色
  choice: 不明确称其为“见证者”
  alternative: 译出“召诸天和大地作证”
  rationale: 上下文具有审判场景，天地可能被召作见证，但本节没有“作证”一词，因此不把这一解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“上面的诸天”较贴近原文结构；句末用句号，形成完整的中文经文句子。
