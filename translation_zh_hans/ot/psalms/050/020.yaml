lexical_decisions:
- source_word: תֵּשֵׁב
  choice: 你坐着
  rationale: 保留 ישׁב 的具体意象和控诉语气；这里描写人安坐着持续作恶，不仅是一般性的“你常常”。
- source_word: בְּאָחִיךָ תְדַבֵּר
  choice: 毁谤你的弟兄
  rationale: דבר 与介词 ב 在敌意言语的语境中表示针对某人说话；结合平行句，译为“毁谤”自然地传达这种敌对性质。
- source_word: בְּבֶן אִמְּךָ
  choice: 你同母的兄弟
  rationale: 按原文“你母亲的儿子”表达极亲近的血缘关系；“同母的兄弟”在现代汉语中简洁自然，并保留其强调。
- source_word: תִּתֶּן דֹּפִי
  choice: 诋毁
  rationale: 这是少见的希伯来语搭配，字面为“加上/给予 דֹּפִי”，语境指把污名、责难或毁谤之言加在某人身上；“诋毁”符合言语犯罪的上下文。
