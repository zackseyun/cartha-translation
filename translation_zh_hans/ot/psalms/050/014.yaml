source:
  edition: WLC
  text: זְבַ֣ח לֵ/אלֹהִ֣ים תּוֹדָ֑ה וְ/שַׁלֵּ֖ם לְ/עֶלְי֣וֹן נְדָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/014.yaml
  text: Offer to God a sacrifice of thanksgiving[a], and fulfill your vows to the Most High.
translation:
  language: zh_hans
  text: 要向上帝献上感恩祭[a]，又要向至高者还你所许的愿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把感恩作为祭献给上帝。”希伯来语“感恩”在这里既可指感恩本身，也可指感恩祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבַח
  choice: 献上
  rationale: 这是动词 זבח 的命令式，在此指献祭；译作“献上”与宾语“感恩祭”自然搭配，并保留礼仪语境。
- source_word: לֵאלֹהִים
  choice: 向上帝
  rationale: 介词 ל 在这里标明献祭所归向的对象；“向上帝”符合现代汉语表达。
- source_word: תּוֹדָה
  choice: 感恩祭
  rationale: תּוֹדָה 既可指感恩，也可在祭祀语境中指感恩祭。正文采用简洁且保留祭祀含义的“感恩祭”，脚注说明另一种可能理解。
- source_word: וְשַׁלֵּם
  choice: 又要……还
  rationale: שלם 在与“愿”搭配时指履行、偿还所许之愿；“还愿”是自然、准确的现代汉语表达。连接词 וְ 译作“又”，承接第二项命令。
- source_word: לְעֶלְיוֹן
  choice: 向至高者
  rationale: עֶלְיוֹן 是表示“至高者”的神圣称号；译出其意义，不作音译。介词 ל 译为“向”。
- source_word: נְדָרֶיךָ
  choice: 你所许的愿
  rationale: 复数名词带第二人称阳性单数后缀；汉语以“你所许的愿”清楚表达个人所承担的誓愿义务，而不必机械标出复数。
theological_decisions:
- issue: זבח 与 תודה 组合的祭祀表达
  choice: 正文译作“献上感恩祭”，并用脚注保留“把感恩作为祭献上”的理解
  alternative: 献上感恩；把感恩作为祭献上
  rationale: 希伯来语既可能指一种感恩祭，也可能强调将感恩本身作为祭献给上帝。正文保留祭祀语境，脚注避免把语义范围限制为单一的技术性祭类。
- issue: 神圣称号 עֶלְיוֹן
  choice: 至高者
  alternative: 以利昂
  rationale: 此处是表明上帝崇高地位的称号；意译既传达含义，也符合现代中文圣经语体。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上帝”与“至高者”分别对应原文的 אֱלֹהִים 和 עֶלְיוֹן；“还愿”是现代读者易懂且符合原义的固定搭配。
