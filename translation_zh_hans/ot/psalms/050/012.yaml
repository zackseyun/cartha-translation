base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/012.yaml
  text: If I were hungry[a], I would not tell you, for the world and its fullness are mine.
translation:
  language: zh_hans
  text: 我若饥饿，必不告诉你，因为世界和其中所充满的都属于我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世界”也可译作“有人居住的世界”；“其中所充满的”也可译作“其中的一切”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֶרְעַב
  choice: 我若饥饿
  rationale: אִם引出假设条件，未完成式אֶרְעַב在此表达设想情形；“我若饥饿”简洁自然，并保留修辞性的假设语气。
- source_word: לֹא אֹמַר לָךְ
  choice: 也不用告诉你
  rationale: אמר接间接宾语在此可自然译为“告诉”；“不用”贴合上下文所强调的神并不依赖人的供应，而“也”使汉语条件句衔接顺畅。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此说明前句的理由，现代汉语用“因为”最清楚自然。
- source_word: לִי
  choice: 都是我的
  rationale: 介词短语表示所有关系；与“世界和其中所充满的”搭配时，“都是我的”自然地表达归属。
- source_word: תֵבֵל
  choice: 世界
  rationale: תֵבֵל指有人居住或有秩序的世界；“世界”是简明、常用且不作过度限定的对应词。
- source_word: וּמְלֹאָהּ
  choice: 和其中所充满的
  rationale: מְלֹאָהּ字面涉及“它的丰满/充满它的”；此译保留原文紧凑的诗性表达，也涵盖世界中的一切所有。
theological_decisions:
- issue: 献祭语境中的神之自足
  choice: 将本节译作修辞性的假设，表明神不需要向人索取供应。
  alternative: 较为直译时态的表达：“我若饿了，也不会告诉你。”
  rationale: 上下文否定神靠献祭得食的观念。译文保留条件句及其理由，不额外加入原文没有的哲学术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我若饥饿”保留诗体凝练感；“世界和其中所充满的”尽量再现希伯来文的整体性与诗性。
