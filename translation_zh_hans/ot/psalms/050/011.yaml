  yaml_path: translation/ot/psalms/050/011.yaml
  text: I know every bird of the mountains[b][a], and the creatures of the field are with me.
translation:
  language: zh_hans
  text: 山中的飞鸟，我全都知道；我田野里的生灵[a]也都在我这里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生灵”：原文 זִיז 是一个含义不确定的词，也可译作“活动之物”或“野兽”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也都属于我。”原文较直译为“也都与我同在”或“也都在我这里”。
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: 我全都知道
  rationale: ידע 的 Qal 完成式第一人称单数在这里表达持续、确定的认知状态，现代汉语宜译为现在时“我知道”；结合 כָּל 译作“全都”，自然表达无一遗漏。
- source_word: כָּל עוֹף הָרִים
  choice: 山中的飞鸟……全都
  rationale: עוֹף 可泛指飞禽，这里译作“飞鸟”自然且符合诗歌语境；הָרִים 译作“山中”，保留山野背景；用“全都”传达 כָּל 对集合名词的周遍意义。
- source_word: וְזִיז שָׂדַי
  choice: 田野间的生灵
  rationale: זִיז 是含义不确定的罕见词，可能指田野中活动的动物或生物。“生灵”既保持宽泛性，又适合诗体，不武断限定为某一类走兽；שָׂדַי 依马所拉文本理解为“我的田野/田野”，在此按诗歌惯用法译作“田野间的”。
- source_word: עִמָּדִי
  choice: 在我这里
  rationale: 该词直译为“与我同在/在我身边”。“在我这里”在现代汉语中较自然，也保留原文措辞及其可能包含的隶属、掌管或随时可得之意，而不直接改译为“归我所有”。
theological_decisions:
- issue: עִמָּדִי 是否明确表达上帝对受造物的所有权
  choice: 译作“在我这里”
  alternative: “都属于我”或“都归我所有”
  rationale: 上下文确实可使该短语含有所有权或主权的意味，但希伯来文表面使用的是“与我/在我这里”，并未直接使用所有格。正文保留这一张力，脚注说明可能含义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“生灵”保持诗意并避免对疑难词 זִיז 作过度具体的判断；“在我这里”比“与我同在”更符合此处受造物语境，也较少引发关系性或宗教术语上的额外联想。
