  text: שִׁמְעָ֤/ה עַמִּ֨/י וַ/אֲדַבֵּ֗רָה יִ֭שְׂרָאֵל וְ/אָעִ֣ידָה בָּ֑/ךְ אֱלֹהִ֖ים אֱלֹהֶ֣י/ךָ אָנֹֽכִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/007.yaml
  text: 'Hear[a], my people, and I will speak; O Israel, and I will testify against you: I am God, your God.'
translation:
  language: zh_hans
  text: “我的子民啊，你要听，我要说话；以色列啊，我要指证你[a]。我是上帝，是你的上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要作见证反对你。”原文动词带有法律上作证、见证的意味。
    reason: 保留希伯来语动词的法律见证含义及其在本处针对以色列、带有不利方向的关系。
lexical_decisions:
- source_word: שִׁמְעָה
  choice: 你们要听
  rationale: 这是שׁמע的祈使式，要求郑重、专注地听；用“要听”既自然，也保留盟约宣告和司法传唤的语气。原文虽为阳性单数形式，但“我的子民”是集合称呼，现代汉语用复数“你们”更清楚。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 该词带第一人称单数后缀，既表达“属于我”，也带有盟约关系的意味；“我的子民”庄重而自然。
- source_word: וַאֲדַבֵּרָה
  choice: 我要说话
  rationale: 第一人称鼓励式接在祈使句之后，表达说话者郑重的意愿和随后的行动；“我要说话”比“让我说”更符合本处神圣宣告的语势。
- source_word: יִשְׂרָאֵל
  choice: 以色列啊
  rationale: 保留专名，并以语气词“啊”明确直接呼语，与前面的“我的子民啊”构成平行。
- source_word: וְאָעִידָה בָּךְ
  choice: 我要指证你
  rationale: עוד的使役式在此具有司法、作证的意味；בְּ加人称后缀在语境中可表达不利于对方的见证。“指证”简洁地保留法庭语境及针对性，但其介词关系仍有可译为“向你作证”的余地，故加脚注。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本处虽在形态上为复数形式，意义及句法上均指独一的说话者；译作单数称谓“上帝”。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 构造形式带第二人称阳性单数后缀，译文保留其盟约关系和直接针对以色列的称谓。
- source_word: אָנֹכִי
  choice: 我是
  rationale: 独立代词置于希伯来语句末，具有强调性的自我确认作用；汉语以“我是上帝，是你的上帝”自然补出判断关系，并借重复“是”维持郑重强调。
theological_decisions:
- issue: אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי 的神圣自我确认
  choice: 我是上帝，是你的上帝
  alternative: 上帝，你的上帝，就是我
  rationale: 原文是无系词的强调性身份宣告，并将“上帝”与“你的上帝”并置。所选译法在现代汉语中清楚、庄重，既表达神的身份，也保留他与以色列的盟约关系，不额外加入某一宗派的解释。
- issue: וְאָעִידָה בָּךְ 的司法关系
  choice: 我要指证你
  alternative: 我要向你作证
  rationale: 动词明确带有作证、见证的法律色彩；结合本诗审判场景，“指证你”较可能，但介词בְּ的关系允许较中性的“向你作证”，因此不在正文中彻底消除这一语义张力，而以脚注保留另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我的子民啊……以色列啊……”保留诗句的平行呼语；分号呈现两次呼唤及其后宣告之间的结构，句号则突出最后的神圣自我确认。
