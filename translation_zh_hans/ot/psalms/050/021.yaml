id: PSA.50.21
reference: Psalms 50:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֵ֤לֶּה עָשִׂ֨יתָ וְֽ/הֶחֱרַ֗שְׁתִּי דִּמִּ֗יתָ הֱֽיוֹת אֶֽהְיֶ֥ה כָמ֑וֹ/ךָ אוֹכִיחֲ/ךָ֖ וְ/אֶֽעֶרְכָ֣ה לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/021.yaml
  text: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
translation:
  language: zh_hans
  text: 这些事你做了，我却沉默不语；你竟以为我和你一样。[a] 我要责备你，把这一切摆在你眼前。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你竟以为我会像你一样。”原文结构也可这样表达这个错误设想。
    reason: lexical_alternative
  - marker: b
    text: “把这一切摆在”也可译作“排列在”或“陈列在”；原文没有明说所摆列的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשִׂיתָ
  choice: 这些事你做了
  rationale: 复数指示词回指上文所列罪行；保留希伯来语前置宾语所带的强调，同时用现代汉语可理解的表达。
- source_word: וְהֶחֱרַשְׁתִּי
  choice: 我却沉默不语
  rationale: 表示上帝面对这些行为暂时不发言；“却”呈现语境中的反差，但不把沉默解释为认可。
- source_word: דִּמִּיתָ
  choice: 你竟以为
  rationale: 表达错误的认定或设想；“竟”自然传达责问意味。
- source_word: הֱיוֹת אֶהְיֶה כָמוֹךָ
  choice: 我和你一样
  rationale: 将不定式与未完成式构造自然地转为内容从句；不额外加入原文并无明确对应词的“完全”，并以脚注保留“我会像你一样”的时态表达可能。
- source_word: אוֹכִיחֲךָ
  choice: 我要责备你
  rationale: יכח 的使役式在此具有揭露过错、斥责的意味；“责备”庄重自然，又不过度限定为法律定罪。
- source_word: וְאֶעֶרְכָה
  choice: 把这一切摆在
  rationale: ערך 的基本义是排列、陈列；宾语在原文中省略。“这一切”依上下文补出所陈列的罪行或指控，并用脚注说明原文的含蓄。
- source_word: לְעֵינֶיךָ
  choice: 在你眼前
  rationale: 保留希伯来语身体意象，表示公开、清楚地呈现在当事人面前。
theological_decisions:
- issue: 上帝的沉默与随后的责备
  choice: 把沉默与责备并置，不将沉默说成赞同，也不在正文中明确解释为宽容忍耐
  alternative: 可将沉默解释性译为“我一直容忍，没有作声”
  rationale: 原文只明说上帝沉默，随后责备；译文应保留其神学张力，不把沉默的动机写入正文。
- issue: 错误设想的时态与性质
  choice: 你竟以为我和你一样
  alternative: 你竟以为我会像你一样
  rationale: 希伯来语结构可用状态性或带将来色彩的汉语表达；正文采用自然且概括性的“和你一样”，脚注保留另一可能。
- issue: 陈列之物的司法意味
  choice: 把这一切摆在你眼前
  alternative: 把你的罪状陈列在你眼前
  rationale: 上下文具有审判和控诉色彩，但原文没有明说“案件”或“罪状”；正文采用较少解释性的译法，避免过度确定隐含宾语。
translation_notes:
  register: 采用现代、庄重而直接的诗体散文。前半句略保留希伯来语的强调语序；“沉默不语”“摆在你眼前”通俗清楚，同时保留原文意象。所有脚注标记均置于正文相应位置。
