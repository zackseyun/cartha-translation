  source_fidelity: 译文准确传达希伯来文本的主要语义：回指先前行为的“这些事”、上帝的沉默、受责者错误地设想上帝与自己相同、随后的责备，以及将隐含的事项公开摆在对方面前。“我和你一样”恰当地保留了 הֱיוֹת אֶהְיֶה כָמוֹךָ 在时态/状态表达上的可容许歧义；脚注也保留“我会像你一样”的替代处理。末句以“这一切”补足原文省略的宾语，但脚注明确说明该宾语未在原文说出，因此没有不当确定其为“罪状”或“案件”。
