base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/002.yaml
  text: From Zion[a], the perfection of beauty, God shines forth.
translation:
  language: zh_hans
  text: '从锡安——美丽的极致——

    上帝发出光辉。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝已经从锡安——美丽的极致——发出光辉”；也可译：“上帝从锡安在完美的美丽中显现。”
    reason: 希伯来语完成式的时体，以及“美丽的极致”与前后成分的句法关系，均可有不同理解。
lexical_decisions:
- source_word: מִצִּיּוֹן
  choice: 从锡安
  rationale: 介词 מִן 表示来源或起点；“从锡安”自然地表达上帝的显现由锡安而出。
- source_word: מִכְלַל יֹפִי
  choice: 美丽的极致
  rationale: מִכְלַל 在此与 יֹפִי 构成结构短语，表示美丽的完满、集大成或最高体现；“美丽的极致”既简明又保留诗意。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该词与单数动词 הוֹפִיעַ 搭配，在此为单数，指上帝。
- source_word: הוֹפִיעַ
  choice: 彰显荣光
  rationale: יפע 的使役式可表达发光、光辉显现或在荣光中显现；“彰显荣光”保留显现与光辉两层意象，并适合庄重诗体。
theological_decisions:
- issue: “美丽的极致”修饰锡安还是描述上帝显现的方式
  choice: 将其作为“锡安”的同位语
  alternative: 理解为方式状语：“上帝以完美的荣美从锡安显现”；或更直接地用来描述上帝
  rationale: 希伯来语词序最自然地允许该短语作为锡安的同位说明，但其他句法关联仍有可能，因此在脚注中保留歧义。
- issue: הוֹפִיעַ 的时体
  choice: 采用不限定于过去的诗性表述“彰显荣光”
  alternative: 译作完成式：“已经彰显荣光”
  rationale: 希伯来语完成式可指已经发生的显现，也可在诗歌中生动陈述；正文避免强行锁定时间，脚注列出完成式译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。破折号标明“美丽的极致”最可能是“锡安”的同位语；换行维持诗句节奏。脚注标记置于正文中。
