source:
  edition: WLC
  text: יָ֤בֹ֥א אֱלֹהֵ֗י/נוּ וְֽ/אַל יֶ֫חֱרַ֥שׁ אֵשׁ לְ/פָנָ֥י/ו תֹּאכֵ֑ל וּ֝/סְבִיבָ֗י/ו נִשְׂעֲרָ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/003.yaml
  text: Our God comes and does not keep silent[a]; a fire devours before him[b], and around him it storms violently.
translation:
  language: zh_hans
  text: 我们的神来临，绝不沉默[a]；烈火在他面前焚烧，他周围风暴猛烈翻腾[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们的神必来，并不沉默。”希伯来语的未完成式在这首诗中可带将来意味。
    reason: 时态与语气的另一种读法
  - marker: b
    text: 也可译：“他周围暴风猛烈呼啸”或“他周围极其狂暴。”原文以动词描写风暴翻腾的景象，没有明说“风暴”这个名词。
    reason: 词义与句法的另一种译法
lexical_decisions:
- source_word: יָבֹא
  choice: 来了
  rationale: 该词是בוא的Qal未完成式第三人称阳性单数；诗歌语境中既可指现在，也可带将来意味。正文用“来了”呈现神显现时鲜明而迫近的画面，并在脚注保留将来读法。
- source_word: אֱלֹהֵינוּ
  choice: 我们的神
  rationale: 准确表达אֱלֹהִים加第一人称复数后缀的含义，措辞自然庄重。
- source_word: וְאַל יֶחֱרַשׁ
  choice: 绝不沉默
  rationale: חרשׁ意为沉默、不作声；אַל通常带禁止或意愿色彩，但此处也可在诗歌中理解为伴随神来临的断然陈述。“绝不沉默”在中文中有力度，同时脚注保留祈愿式理解。
- source_word: אֵשׁ לְפָנָיו תֹאכֵל
  choice: 烈火在他面前吞噬
  rationale: אכל以火为主语时表示吞噬、烧尽。“烈火”自然呈现审判性神显的强烈意象，“在他面前”保留空间关系。
- source_word: וּסְבִיבָיו נִשְׂעֲרָה מְאֹד
  choice: 他四周风暴猛烈大作
  rationale: נִשְׂעֲרָה描写风暴翻腾、猛烈呼啸，מְאֹד加强程度。中文以“风暴猛烈大作”自然表达无明确主语的风暴景象，脚注保留较贴近其动词形式的其他译法。
theological_decisions:
- issue: 本节描写神在火与风暴中显现并施行审判，但没有明说任何后来的基督论或宗派框架。
  choice: 直接保留神来临、并不沉默以及火与风暴的神显意象。
  alternative: 把本节明确解释为预示末日审判或某一特定教义事件。
  rationale: 希伯来文本本身着重于神威严地来临；译文不应加入经文本节未明确说明的后期神学认定。
- issue: וְאַל יֶחֱרַשׁ的语气可理解为断言，也可理解为禁止式或祈愿式。
  choice: 正文译作断然陈述“绝不沉默”，并以脚注保留“愿他不要沉默”。
  alternative: 正文译作“愿他不要沉默”。
  rationale: 上下文首先宣告神来临，陈述式在中文中连贯有力；然而אַל的常见意愿语气是真实的语法可能，故不应隐去。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“来了”增强诗歌现场感；分号呈现神来临与随行自然威势之间的推进关系。避免古奥的“缄默”“烈焰噬食”等表达，也不扩展原文未明说的教义解释。
