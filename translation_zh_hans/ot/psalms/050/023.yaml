base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/023.yaml
  text: Whoever offers a sacrifice of thanksgiving honors me[c][b][a], and to the one who orders his way I will show the salvation of God.
translation:
  language: zh_hans
  text: 献上感谢祭[a]的人尊荣我；那妥善安排自己道路[b]的人，我必让他看见上帝的拯救[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“感恩祭”。希伯来语תּוֹדָה在这里指借着献祭表达感谢。
    reason: lexical_alternative
  - marker: b
    text: 或译“安排自己的行事”，也可能理解为“预备道路”。原文表达十分凝练，较可能指妥善安排自己的生活道路。
    reason: alternative_reading
  - marker: c
    text: “拯救”也可译作“解救”或“胜利”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ תּוֹדָה
  choice: 献上感谢祭的人
  rationale: זֹבֵחַ是作名词用的主动分词，泛指献祭者；תּוֹדָה在祭祀语境中指以祭物表达感谢。译作“献上感谢祭的人”兼顾祭祀行为和感恩含义，并符合现代汉语表达。
- source_word: יְכַבְּדָנְנִי
  choice: 尊荣我
  rationale: כבד的Piel词干在此意为尊崇、使得荣耀。“尊荣我”简洁庄重，也保留本诗中敬拜与实际生活之间的关联。
- source_word: וְשָׂם דֶּרֶךְ
  choice: 那端正自己道路的人
  rationale: 原文表达紧凑，字面近于“设置道路的人”。这里较可能以“道路”喻指生活行为；“端正自己道路”既保留道路意象，也使伦理含义在现代汉语中清楚，同时用脚注保留其他可能理解。
- source_word: אַרְאֶנּוּ
  choice: 我必让他看见
  rationale: ראה的Hiphil形式意为“使……看见、让……看见”，三单阳性后缀指前述端正道路的人；“必”体现此处应许性的未完成体语气。
- source_word: בְּיֵשַׁע אֱלֹהִים
  choice: 上帝的拯救
  rationale: יֵשַׁע可指拯救、解救或胜利；此处译作“拯救”最能保留诗篇中宽广的救助含义。בְּ在这一使役观看结构中自然译为所看见的内容。
theological_decisions:
- issue: וְשָׂם דֶּרֶךְ所指的是端正品行还是预备道路
  choice: 理解为端正自己的生活道路
  alternative: 也可理解为“预备道路”或较字面地说“设置道路”
  rationale: 全诗将合宜的献祭与顺服的生活相连，因此伦理性的理解较符合上下文；但原文措辞极为凝练，脚注保留其真实的解释空间，不把某一种神学推论写死在正文中。
- issue: יֵשַׁע אֱלֹהִים的含义
  choice: 上帝的拯救
  alternative: 上帝的解救或上帝的胜利
  rationale: “拯救”能涵盖脱离危难与得胜的语义范围，又不把本节限定为某一特定形式的救恩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“感谢祭”保留古代祭祀语境；“端正自己道路”保留原文的道路隐喻，同时避免生硬的“安排道路”。正文中的[a]、[b]、[c]均与脚注对应。
