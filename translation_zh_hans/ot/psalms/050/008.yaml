  text: לֹ֣א עַל זְ֭בָחֶי/ךָ אוֹכִיחֶ֑/ךָ וְ/עוֹלֹתֶ֖י/ךָ לְ/נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/008.yaml
  text: I do not rebuke you for your sacrifices[a]; your burnt offerings are continually before me.
translation:
  language: zh_hans
  text: 我不是因你的祭物责备你；你的燔祭常在我面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: 不是
  rationale: 与“因……责备”搭配，构成自然的现代汉语否定句，并保留神所否定的是责备的缘由。
- source_word: עַל
  choice: 因
  rationale: 在责备类动词后表示责备所针对的事项或缘由；“因”简洁自然。
- source_word: זְבָחֶיךָ
  choice: 你的祭物
  rationale: זֶבַח泛指祭献，通常涉及牲祭；“祭物”保留其较宽的礼仪含义，不作过度限定。
- source_word: אוֹכִיחֶךָ
  choice: 责备你
  rationale: יכח的使役式在此表达斥责、指责；“责备”符合神直接发言的语境，也不把词义收窄为法庭控告。
- source_word: וְעוֹלֹתֶיךָ
  choice: 你的燔祭
  rationale: עוֹלָה是整牲焚烧献上的专门祭类；“燔祭”是准确且通行的中文圣经术语。
- source_word: לְנֶגְדִּי
  choice: 在我面前
  rationale: 表示处于神面前、神眼前；这一表达自然，并保留临在与礼仪语境。
- source_word: תָמִיד
  choice: 常
  rationale: 表示持续或经常不断；“常在我面前”简洁地传达恒常呈现之意。
theological_decisions:
- issue: 本节对以色列献祭制度的态度
  choice: 本节否认神责备百姓是因为他们缺少祭物，并未说献祭本身不合法。
  alternative: 本节彻底否定献祭。
  rationale: 后半句说明燔祭常在神面前，表明问题不在礼仪的缺席；更深层的问题由上下文继续揭示。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“祭物”与“燔祭”区分原文的广义祭献词和特定祭类；分号呈现两个紧密相关、彼此阐明的分句。
