base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/006.yaml
  text: And the heavens declare his righteousness[a], for God himself is judge. Selah
translation:
  language: zh_hans
  text: 诸天宣告他的公义[a]，因为上帝亲自作审判者。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: 宣告
  rationale: 该词为נגד的使役形，在此表示公开传扬、使人知晓；“宣告”保留诗歌中庄严而公开的语气。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 希伯来语为复数形式，在诗歌中用“诸天”既保留形式，也符合庄重的现代中文表达。
- source_word: צִדְקוֹ
  choice: 他的公义
  rationale: צדק兼有公义、公正之义；“公义”较能涵盖上帝在审判中显明的道德正直，脚注保留“公正”这一语境上可行的译法。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出诸天宣告的依据；“因为”清楚保留其因果关系。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 尽管词形为复数，其谓语和代词明确表明这里是单数，故译为“上帝”。
- source_word: שֹׁפֵט
  choice: 施行审判
  rationale: 该主动分词可表示担任审判者或正在审判；现代中文用“施行审判”自然地表达其谓语功能，同时未加入定冠意义。
- source_word: הוּא
  choice: 亲自
  rationale: 独立人称代词带有强调作用；“亲自”在中文中自然体现“正是他”的强调。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该礼仪或音乐术语的确切含义不明，采用传统音译，避免作无把握的解释。
theological_decisions:
- issue: צדק在上帝审判语境中的译法
  choice: 他的公义
  alternative: 他的公正
  rationale: “公义”保留该词较宽的道德与关系性内涵，不把它缩限为司法层面的公平；但本节明确涉及审判，因此“公正”也是合理译法，列于脚注。
- issue: שֹׁפֵט הוּא的谓语性质与强调
  choice: 上帝亲自施行审判
  alternative: 上帝亲自是审判者
  rationale: 原文分词可作名词性或动作性理解，הוּא又加强主语。“施行审判”是较自然的现代汉语，并保留上帝亲自执行判断的重点；“是审判者”则更贴近名词性表达。
translation_notes:
  register: 采用庄重、简洁而适合现代读者的诗歌语言。“诸天”“公义”保持经文语体的崇高感；“因为”清楚表达逻辑关系；“细拉”沿用通行音译。
