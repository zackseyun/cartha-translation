base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/001.yaml
  text: A psalm of Asaph. The Mighty One[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: zh_hans
  text: 亚萨的诗。大能者[a]，上帝，雅威，已经说话，召唤大地，从日出之处直到日落之处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝，上帝，雅威”；也有人把开头的称谓理解为：“众神之神，雅威。”
    reason: 原文 אֵל אֱלֹהִים יְהוָה 的句法关系存在歧义，可视为三个并列或同位称谓，也可能把前两个词理解为组合表达。
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中的常用体裁词；现代中文以“诗”简洁自然，也符合《诗篇》的语境。
- source_word: לְאָסָף
  choice: 亚萨的
  rationale: 介词 לְ 在诗篇标题中可表示作者、归属或关联；“亚萨的”自然简洁，同时不限定具体关系。
- source_word: אֵל
  choice: 大能者
  rationale: 将 אֵל 与随后的 אֱלֹהִים 区分，保留三重神圣称谓层叠的修辞力量及其“有能力者”的词义色彩。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 其后接神名 יְהוָה，且动词为单数，所指为以色列的上帝；“上帝”是现代标准汉语中清楚、庄重的称呼。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名四字母的通行音译，以区别于“主”等称号，并保留原文中专名的性质。
- source_word: דִּבֶּר
  choice: 已经发言
  rationale: 完成式表达已经发生并对当前场景有效的庄严宣告；“发言”比一般的“说话”更契合公开召集的语境。
- source_word: וַיִּקְרָא
  choice: 召唤
  rationale: 该动词承接前句并推进动作；“召唤”保留呼叫全地前来、近似召集的含义，但不把司法背景明说进正文。
- source_word: אָרֶץ
  choice: 大地
  rationale: 日出至日落的范围表明普世视野；“大地”兼具整体性和诗体庄重感。
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: 从日出之处
  rationale: 保留太阳升起的原文意象，而不简化为“东方”。
- source_word: עַד מְבֹאוֹ
  choice: 直到日落之地
  rationale: 阳性单数后缀回指太阳；此译与“日出之处”构成自然对仗，并表达从东到西的全范围。
theological_decisions:
- issue: אֵל אֱלֹהִים יְהוָה 三重神圣称谓的理解
  choice: 大能者，上帝，雅威
  alternative: “上帝，上帝，雅威”或“万神之上帝雅威”
  rationale: 原文依次排列三个神圣称谓。正文将 אֵל 独立译作“大能者”，既保留词义差别，也呈现称谓逐层累加的庄严效果；但希伯来语句法容许其他理解，因此以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“已经发言，召唤大地”保持宣告与召集的气势；“从日出之处直到日落之地”保留原文的空间意象和首尾概括法。脚注标记[a]已置于正文对应称谓之后。
