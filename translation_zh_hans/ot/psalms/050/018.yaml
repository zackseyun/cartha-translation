base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/018.yaml
  text: If you saw a thief[a], you were pleased with him[b], and your portion was with adulterers.
translation:
  language: zh_hans
  text: 你若看见盗贼，就赞同他[a]；你与通奸的人有份[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就喜欢他”“就悦纳他”或“就乐意与他交往”。原文动词可表示喜悦、赞许或接纳。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“你的份与通奸的人在一起。”这里表示与他们站在一起、同属一伙，或参与他们的行列；原文并未明确说你亲自犯了同样的罪。
    reason: idiom
lexical_decisions:
- source_word: אִם רָאִיתָ גַנָּב
  choice: 你若看见盗贼
  rationale: אִם保留条件性、也可在语境中引出典型行为；רָאִיתָ为第二人称阳性单数完成式。现代汉语以“若看见”自然表达，不强行限定为一次过去事件。
- source_word: וַתִּרֶץ עִמּוֹ
  choice: 就与他同乐
  rationale: וַתִּרֶץ来自רצה，核心义为喜悦、赞许或接纳；结合עִמּוֹ，用“与他同乐”保留对盗贼行为感到认同和乐意相交的含义，同时不误作“跟他奔跑”。
- source_word: מְנָאֲפִים
  choice: 通奸的人
  rationale: 该词是נאף的复数分词实体化用法，指犯奸淫者；“通奸的人”比现代汉语中的名词化标签更自然、清楚。
- source_word: חֶלְקֶךָ
  choice: 同流
  rationale: 字面为“你的份”；在“与……同在”的结构中表示站在同一边、参与其行列。译作“同流”传达结伙和认同，同时以脚注保留原文“份”的比喻。
theological_decisions:
- issue: 本节所责备的是实际共同犯罪，还是对罪人的赞许与结交
  choice: 译文保留赞许、结伙和参与的语义范围，不限定为亲自实施相同罪行
  alternative: 明确译成“与他们一同犯罪”
  rationale: רצה表达喜悦或认可，חלק表达有份或同属一伙；原文没有明说被责备者亲自偷窃或通奸，因此不宜扩大断言。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“同乐”在此带有认同其行为的贬义，由脚注澄清；“同流”简洁传达原文“有份于其群体”的习语意义，并避免生硬直译。
