  text: כִּ֭/מְעַט אוֹיְבֵי/הֶ֣ם אַכְנִ֑יעַ וְ/עַ֥ל צָ֝רֵי/הֶ֗ם אָשִׁ֥יב יָדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/014.yaml
  text: In a little while I would subdue their enemies[b][a], and turn my hand against their adversaries.
translation:
  language: zh_hans
  text: 我不久便会制伏他们的仇敌[a]，把手转向他们的敌人，对付他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不久”或译“很快”。希伯来语 כִּמְעַט 也可表示“几乎”，但这里更可能指时间很短。
    reason: lexical_alternative
  - marker: b
    text: 直译“把我的手转回到他们的敌人身上”。这是指把能力转而用于攻击、审判这些敌人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: 很快
  rationale: 这里最自然地表示时间临近，即“过不多久、很快”；“几乎”虽是可能义项，但不太符合本节语境。
- source_word: אוֹיְבֵיהֶם
  choice: 他们的仇敌
  rationale: 准确表达军事或敌对语境中的“敌人”，也是现代汉语中清楚、庄重的说法。
- source_word: אַכְנִיעַ
  choice: 我就会制伏
  rationale: 使役词形表示使对方屈服、降卑；“制伏”既保留战胜并使其屈服之意，又不额外限定手段。结合上文未实现的条件，译作“就会”体现条件结果。
- source_word: וְעַל
  choice: 攻击
  rationale: 在“转手向着/临到”这一惯用表达中，介词表示力量针对敌方；汉语用“攻击”自然传达敌对行动。
- source_word: צָרֵיהֶם
  choice: 他们的敌人
  rationale: 指敌对、逼迫或使人困苦者。译作“敌人”清楚自然；前句用“仇敌”，在汉语中保留轻微措辞变化。
- source_word: אָשִׁיב יָדִי
  choice: 转手攻击
  rationale: 保留“转回/转动我的手”的身体隐喻，同时以“攻击”说明此处是把能力转而用于审判敌对者。
theological_decisions:
- issue: 本节神行动的语气与条件性
  choice: 采用“我很快就会……”，表达上文条件若满足便会发生的结果
  alternative: 采用简单将来式“我必……”
  rationale: 希伯来语未完成式本身可指将来，但本节承接前文“但愿我的百姓听从我”的未实现愿望；“就会”较清楚地保留这种条件性，而不把它改成无条件预告。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“制伏”保留敌人被迫屈服的含义；“转手攻击”尽量保留原文的“手”之隐喻。所有脚注标记均置于对应主文之后。
