  text: לֹֽא יִהְיֶ֣ה בְ֭/ךָ אֵ֣ל זָ֑ר וְ/לֹ֥א תִ֝שְׁתַּחֲוֶ֗ה לְ/אֵ֣ל נֵכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/009.yaml
  text: You must have no foreign god among you, and you must not bow down to an alien god[a].
translation:
  language: zh_hans
  text: 在你中间不可有外来的神；你也不可向外邦的神下拜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文用两个意义相近的词描述以色列敬拜之外的神，可译为“外来的”和“外邦的”或“陌生的”。不同译法保留诗歌平行中的措辞变化，并不表示两类不同的神。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיֶה
  choice: 不可有
  rationale: 否定词与未完成式在盟约劝诫中表达禁令，而非对将来的预测；“不可有”在现代汉语中直接而庄重。
- source_word: בְךָ
  choice: 在你中间
  rationale: 希伯来文以第二人称单数整体性地称呼以色列；“在你中间”既保留单数称呼，又自然表达群体范围。
- source_word: אֵל
  choice: 神
  rationale: 与下半句的敬拜行为平行，此处明确指受敬拜的神明；上下文已表明并非以色列的神。
- source_word: זָר
  choice: 外邦的
  rationale: 指以色列蒙准敬拜之外的神；“外邦的”自然体现其不属于以色列敬拜体系，并与下半句近义词形成诗歌变化。
- source_word: תִשְׁתַּחֲוֶה
  choice: 不可……下拜
  rationale: 否定未完成式具有禁止语气；“下拜”准确表达俯伏敬拜，而不只指一般鞠躬。
- source_word: לְאֵל
  choice: 向……神
  rationale: 介词 לְ 在敬拜语境中标明下拜的对象，现代汉语自然译作“向”。
- source_word: נֵכָר
  choice: 异族的
  rationale: 该词与 זָר 近义，表示外来的、非本族的；译作“异族的”保留诗行中的措辞变化，而不虚构两类不同的神。
theological_decisions:
- issue: 第二人称单数所指的是作为整体的以色列
  choice: 译作“在你中间”，保留“你”的单数整体称呼，同时表明群体范围
  alternative: 译作“你里面”或改用复数“你们中间”
  rationale: “你里面”在汉语中容易被理解为个人内在状态；“你们中间”虽自然，却会消除原文以单数称呼盟约群体的形式。
- issue: 两个近义词 זָר 与 נֵכָר 的关系
  choice: 分别译作“外邦的”和“异族的”
  alternative: 两处都译作“外邦的”或“别的”
  rationale: 原文借近义变换构成诗歌平行，两词并不必然指不同类别；采用两个近义汉语词可保留这种张力与修辞。
translation_notes:
  register: 采用现代、庄重而易懂的规范汉语。“不可”保持诫命语气；分号呈现两行平行关系。“下拜”明确指俯伏敬拜。脚注标记置于整节末尾，对两处近义词一并说明。
