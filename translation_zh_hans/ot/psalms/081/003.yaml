base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/003.yaml
  text: Blow the trumpet at the new moon[a], at the full moon, on the day of our feast.
translation:
  language: zh_hans
  text: '当新月时，要吹响号角；

    当满月[a]、我们节日的那一天，也要吹响号角。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在月亮被遮蔽时”，或“在指定的时候”。希伯来语 כֵּסֶה 的含义有争议；正文采用“满月”，因为这与“新月”形成历法上的对应，也符合节期的语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: 吹响
  rationale: 这是复数祈使式；与号角搭配时，“吹响”自然地表达发声动作，并保留命令语气。
- source_word: בַחֹדֶשׁ
  choice: 在新月
  rationale: חֹדֶשׁ 可指“月”或“新月”；在节期历法语境中，又与 כֵּסֶה 平行，译作“新月”最合适。
- source_word: שׁוֹפָר
  choice: 号角
  rationale: שׁוֹפָר 指用于礼仪和传讯的角制吹奏器；“号角”既通俗庄重，也比音译更清楚，且不必武断限定为公羊角。
- source_word: בַכֵּסֶה
  choice: 在满月
  rationale: כֵּסֶה 词义有争议；在与“新月”构成的历法平行句及节期背景下，“满月”最能形成连贯的时间指称，但其他可能义项保留在脚注中。
- source_word: לְיוֹם חַגֵּנוּ
  choice: 在我们过节的日子
  rationale: לְיוֹם 在此表达与节期日子的时间或目的关系；חַגֵּנוּ 是“我们的节期/节日”。合译为“在我们过节的日子”符合现代汉语，也保留群体性的“我们”。
theological_decisions:
- issue: 节期历法用语 בַכֵּסֶה 的含义
  choice: 在满月
  alternative: 在月亮隐没时；在指定的时候
  rationale: 这主要是词义与语境判断，并非教义裁决。“满月”与“新月”的诗歌平行及节期背景最协调；鉴于该词确有争议，脚注列出其他解释，不消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“号角”避免不必要的音译；末尾补出“也要吹响”，使希伯来诗句中由首行统摄后续时间短语的命令关系在汉语中清楚自然。
