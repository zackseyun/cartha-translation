source:
  edition: WLC
  text: וָֽ֭/אֲשַׁלְּחֵ/הוּ בִּ/שְׁרִיר֣וּת לִבָּ֑/ם יֵ֝לְכ֗וּ בְּֽ/מוֹעֲצוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/012.yaml
  text: So I gave them over to the stubbornness of their heart[c][b][a]; they walked in their own counsels.
translation:
  language: zh_hans
  text: 于是，我任凭他们[a]心里顽梗；他们照自己的谋算行事。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “任凭他们”：希伯来文直译为“任凭他”，用单数指作为一个整体的以色列；后半节则使用复数。
    reason: 说明原文由集体单数转为复数的现象。
  - marker: b
    text: “照自己的谋算行事”也可译作“按自己的主意而行”。
    reason: 说明מוֹעֲצוֹת的“谋议、计划、主意”以及整句结构的译法选择。
lexical_decisions:
- source_word: וָאֲשַׁלְּחֵהוּ
  choice: 于是我任凭他们
  rationale: שלח在此不是单纯“差遣”，而是放任、交由其固执支配；结合审判语境，“任凭”准确而自然。希伯来文宾语后缀为第三人称阳性单数，指作为整体的以色列；中文正文按随后复数形式译作“他们”，并以脚注说明。
- source_word: בִּשְׁרִירוּת לִבָּם
  choice: 他们心里顽梗
  rationale: שְׁרִירוּת表示顽固、刚硬或任性；“心里顽梗”保留其内在道德倾向，也符合现代中文圣经语体。לֵב为单数而带复数物主后缀，中文如此表达自然。
- source_word: יֵלְכוּ
  choice: 行事
  rationale: הלך在此具有行为方式的伦理含义，不只是实际步行；“行事”比直译“行走”更符合现代汉语，同时保留生活行为的意味。
- source_word: בְּמוֹעֲצוֹתֵיהֶם
  choice: 照自己的谋算
  rationale: מוֹעֵצָה可指谋议、计划或主意；“谋算”保留经过盘算、自作主张的色彩，“照”表达介词בְּ的规范或依据关系。
theological_decisions:
- issue: 首句单数宾语与后文复数形式之间的数转换
  choice: 正文采用复数“他们”，脚注交代原文首句为单数“他”
  alternative: 正文保留“他”，随后转为“他们”
  rationale: 希伯来文先以单数后缀将以色列视为一个整体，随即使用复数物主后缀和动词。现代中文若直保留转换，容易被误解为换了指称对象；复数正文更清楚，脚注则保存原文现象及其集体含义。
- issue: 上帝行动的审判意味
  choice: 任凭
  alternative: 让他们走；把他打发走
  rationale: 上下文描写上帝因百姓不听从而任由他们受自身顽梗支配。“任凭”保留司法性放任的力度，却不额外引入后来的教义术语。
- issue: יֵלְכוּ的时态和语气
  choice: 陈述为“他们……行事”
  alternative: 愿他们……行；让他们……行；他们就……行
  rationale: 未完成式在前一叙事动词之后可表达随之而来的持续行为或结果。正文不强行限定为命令或愿望，以保留语义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“任凭”“顽梗”“谋算”略带经文语体，但仍为普通读者可理解；分号保留原文两个紧密相连的分句。
