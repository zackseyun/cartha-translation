  text: וְ/לֹא שָׁמַ֣ע עַמִּ֣/י לְ/קוֹלִ֑/י וְ֝/יִשְׂרָאֵ֗ל לֹא אָ֥בָה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/011.yaml
  text: But my people did not listen to my voice[a], and Israel was not willing to obey me.
translation:
  language: zh_hans
  text: 但我的子民不听我的声音；以色列也不肯顺从我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的子民不肯听我的声音；以色列不愿意顺服我。”第二行的希伯来语动词表示“愿意、同意”，也可按上下文译为“拒绝我”。
    reason: 保留第一行“听／听从”的语义幅度，并说明第二行 אָבָה 的意愿／同意义及其在上下文中可表达的拒绝含义；避免“归向我”所加入的额外意象。
lexical_decisions:
- source_word: וְלֹא
  choice: 但……不
  rationale: 连词在上下文中承接此前上帝的呼唤与应许，并引出反差；译作“但”自然表达转折，同时保留否定。
- source_word: שָׁמַע
  choice: 听
  rationale: שׁמע 可表示听见、听从或顺服；与“我的声音”搭配时译作“听”既保留原文意象，也让是否听从的含义由语境呈现。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 保留第一人称所属关系及盟约性的群体称谓；“子民”符合现代中文庄重的经文语体。
- source_word: לְקוֹלִי
  choice: 我的声音
  rationale: קוֹל 的基本义是“声音”；保留这一表达，避免将富有关系性的原文简化为“听我”。
- source_word: וְיִשְׂרָאֵל
  choice: 以色列也
  rationale: 保留专名及与“我的子民”之间的平行结构；“也”自然呈现两个诗行的对应关系。
- source_word: לֹא אָבָה
  choice: 不肯
  rationale: אָבָה 表示愿意、同意；否定形式译作“不肯”，简洁而准确地表达意愿上的拒绝，不将其弱化为单纯未能行动。
- source_word: לִי
  choice: 顺从我
  rationale: 在 אָבָה 后，介词加代词的表达在中文中较为省略；结合“听我的声音”的平行语境，译作“顺从我”自然表达其关系和行动指向。
theological_decisions:
- issue: “我的子民”与“以色列”的盟约性平行称谓
  choice: 保留为两个平行诗行：“我的子民……以色列也……”
  alternative: 合并为“我的子民以色列不听我的声音”
  rationale: 原文用两个对应称谓构成平行，分别保留可维持诗歌结构和盟约强调，避免解释性压缩。
- issue: אָבָה לִי 所表达的意愿与顺从之间的关系
  choice: 正文译作“不肯顺从我”，并以脚注保留较形式对应的“不愿意归向我／不愿听从我”等可能性
  alternative: 直译为“不愿意我”或强化为“拒绝我”
  rationale: 原文明确涉及意愿，却以介词短语留下关系上的简约表达；正文需符合现代汉语，同时脚注保留其词汇张力，不把它完全等同于一般性的“拒绝”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的子民”保留盟约语感；“不听我的声音”保留原文意象；“不肯顺从我”使省略式希伯来表达在中文中通顺。脚注标记置于整节末尾，对两个诗行的相关译法一并说明。
