  text: מְשַׂנְאֵ֣י יְ֭הוָה יְכַֽחֲשׁוּ ל֑/וֹ וִ/יהִ֖י עִתָּ֣/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/015.yaml
  text: Those who hate Yahweh would cringe before him[b][a], and their time would be forever.
translation:
  language: zh_hans
  text: 恨耶和华的人必向他假意屈服[a]；他们的时日将延续到永远[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向他佯装顺服”或“在他面前畏缩”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“他们的时日直到永远”。“时日”也可能指他们的期限、命运或刑罚；本句具体所指并不明确。
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׂנְאֵי
  choice: 恨……的人
  rationale: 该分词作名词用，指持续以敌意对待耶和华的人；这一表达符合现代汉语习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中对四字神名的通行译法，明确保留专名性质。
- source_word: יְכַחֲשׁוּ לוֹ
  choice: 向他假意屈服
  rationale: כחשׁ 的强化词干与介词 ל 连用，可表示在强势者面前被迫而不真诚地顺服；“假意屈服”同时保留屈从和虚假两层含义。
- source_word: וִיהִי
  choice: 必存
  rationale: 在诗歌条件语境中表达随之而来的结果；用“必”承接其结果性，同时使中文自然。
- source_word: עִתָּם
  choice: 他们的时日
  rationale: עת 的基本义为“时候、时期”；“时日”保留时间含义，不在正文中把它具体解释为命运或刑罚。
- source_word: לְעוֹלָם
  choice: 到永远
  rationale: 准确表达持续无尽或无限延续的诗歌措辞，且符合庄重自然的现代汉语。
theological_decisions:
- issue: 末句 וִיהִי עִתָּם לְעוֹלָם 的含义
  choice: 他们的时日必存到永远
  alternative: 他们的刑罚必永远持续；他们所得的期限／命运必延续下去
  rationale: 希伯来文极为简练，עת 本身只表示“时候、时期”，所指可能是期限、命运，也可能在审判语境中暗指刑罚。正文保留其时间性和神学张力，不把含义限定为永刑。
- issue: יְכַחֲשׁוּ לוֹ 所表达的顺服性质
  choice: 假意屈服
  alternative: 畏缩在他面前；向他佯装顺服
  rationale: 该表达并非明确指真诚悔改，而更可能指受迫、虚假的臣服；译文避免将其神学化为真实归信。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“假意屈服”简洁呈现被迫且不真诚的顺服；“时日必存到永远”有意保留原文末句的凝练和歧义。所有脚注标记均已置于正文相应位置。
