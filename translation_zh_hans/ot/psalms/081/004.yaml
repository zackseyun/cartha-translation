base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/004.yaml
  text: For it is a statute for Israel[a], an ordinance of the God of Jacob.
translation:
  language: zh_hans
  text: 因为这是给以色列的律例，也是雅各的上帝所定的典章。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “也是雅各的上帝所定的典章”也可较形式地译为“也是为雅各的上帝而设的典章”。原文介词 לְ 可表示归属或来源，也可表示目的或对象；按上下文，正文采用权威来源的理解。
    reason: 保留 לֵאלֹהֵי יַעֲקֹב 中介词 לְ 的可行替代理解，并说明正文选择。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词在这里承接上文吹角守节的命令，说明其缘由；“因为”自然表达解释性的因果关系。
- source_word: חֹק
  choice: 律例
  rationale: 该词指由权威制定、固定当守的规例；“律例”保留其法律与圣约语域，同时适合诗歌体。
- source_word: לְיִשְׂרָאֵל
  choice: 以色列的
  rationale: 介词 לְ 在此表示归属或适用对象，即这项规定是给以色列、由以色列遵守的；汉语用领属结构表达更自然。
- source_word: הוּא
  choice: 这是
  rationale: 阳性单数代词回指上文所命定的节期礼仪；汉语以“这是”明确其指代并构成判断句。
- source_word: מִשְׁפָּט
  choice: 典章
  rationale: 在与 חֹק 平行的法律语境中，本词指具有权威的规定，而非定罪性的“审判”；“典章”既与“律例”有别，也保留庄重的圣约语气。
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: 雅各之上帝的
  rationale: 介词 לְ 可表示归属、关联或权威来源；领属表达自然地保留“属于或出于雅各之上帝”的主要含义，并避免把受益关系说得过实。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代简体中文圣经语境中通行的人名译法。
theological_decisions:
- issue: חֹק 与 מִשְׁפָּט 两个法律名词的关系
  choice: 分别译作“律例”和“典章”
  alternative: 将二者都泛译为“律法”或合并为一个概念
  rationale: 原文以两个相关却不同的法律词构成诗体平行；分别翻译可保留其圣约和礼仪意味，又不强行赋予两词过度技术化的区别。
- issue: לֵאלֹהֵי יַעֲקֹב 中介词 לְ 的语义
  choice: 译为领属或来源关系：“雅各之上帝的”
  alternative: 译为目的或对象关系：“为雅各的上帝”
  rationale: 希伯来语介词容许两种理解。上下文较可能指这典章属于或出于雅各的上帝，但译文以注释保留目的关系的真实可能性，不作教义化消解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌—法律语体。“律例／典章”保留原文平行结构；“雅各之上帝”保留圣约称号。
