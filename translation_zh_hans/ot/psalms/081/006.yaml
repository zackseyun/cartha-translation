lexical_decisions:
- source_word: הֲסִירוֹתִי
  choice: 我卸下了
  rationale: 这是使役词形，表示使某物离开或除去；与“肩头的重担”搭配时，“卸下”既贴合劳役图景，也符合现代汉语习惯。
- source_word: מִסֵּבֶל שִׁכְמוֹ
  choice: 他肩头的重担
  rationale: סֵבֶל 指重担、负荷，שׁכם 是肩；按自然汉语调整语序，表达从肩头除去重担，而不改变原句含义。
- source_word: כַּפָּיו
  choice: 他的双手
  rationale: כף 可指手掌或手；此处描述劳役，以“双手”最自然，并反映原文复数。
- source_word: מִדּוּד
  choice: 脱离了筐子
  rationale: דּוּד 是罕见且具体所指不确定的名词；在强迫劳动的平行意象中，“筐子”较合语境，但“锅”仍有词典依据，故列入脚注。
- source_word: תַּעֲבֹרְנָה
  choice: 脱离了
  rationale: עבר 的基本义是经过、离开；这里以“双手”为主语，表示不再从事与该器具相关的劳作。“脱离”保留离开的意象，也避免生硬的直译。
