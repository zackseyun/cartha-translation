  text: עֵ֤דוּת בִּֽ/יה֘וֹסֵ֤ף שָׂמ֗/וֹ בְּ֭/צֵאת/וֹ עַל אֶ֣רֶץ מִצְרָ֑יִם שְׂפַ֖ת לֹא יָדַ֣עְתִּי אֶשְׁמָֽע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/005.yaml
  text: 'He made it a testimony in Joseph when he went out over the land of Egypt[c][b][a]. I heard a language I had not known:'
translation:
  language: zh_hans
  text: '他在约瑟中设立这事作见证；


    当他出临埃及地时，[a]


    我听见了一种我素不熟悉的语言：[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出临埃及地”或译“出去攻击埃及地”。希伯来介词在这里可表达临到、遍及其上，也可带有敌对之意。
    reason: lexical_alternative
  - marker: b
    text: “我听见了”或译“我听见”。诗歌语境中的希伯来动词可按过去或现在理解。
    reason: alternative_reading
lexical_decisions:
- source_word: עֵדוּת
  choice: 见证
  rationale: 保留该词“见证、证言”的基本意义；在礼仪或律法语境中也可指所立的规章，但正文不将其窄化为“律例”。
- source_word: בִּיהוֹסֵף
  choice: 在约瑟中
  rationale: 保留介词 בְּ 的通常意义和“约瑟”这一原名，使其代表以色列民或北方支派的可能性不被正文直接解释掉。
- source_word: שָׂמוֹ
  choice: 立此
  rationale: שׂים 有“设立、安置”之意；“立此为见证”既简洁自然，也体现主动设立。
- source_word: בְּצֵאתוֹ
  choice: 当他出去……时
  rationale: 将介词加不定式结构按时间意义处理；第三人称单数所指仍由上下文判断，不在译文中明定。
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: 巡行埃及地
  rationale: עַל 可表示在……之上、遍及或敌对；结合 יצא，“出去巡行”较自然地表达行动遍及埃及地，同时以脚注保留“攻击”的可能。
- source_word: שְׂפַת
  choice: 言语
  rationale: 字面为“嘴唇”，此处转指语言或话语；“言语”可同时容纳陌生语言与未曾听闻之话两种理解。
- source_word: לֹא יָדַעְתִּי
  choice: 素不认识
  rationale: 表达此前并不知道或不熟悉，符合完成式在回顾语境中的意义。
- source_word: אֶשְׁמָע
  choice: 我听见了
  rationale: 未完成式在诗歌叙事中可作过去意义理解；用“听见了”衔接下文神谕，同时脚注保留现在时读法。
theological_decisions:
- issue: “约瑟”的所指
  choice: 正文保留“约瑟”，不直接改译为“以色列”。
  alternative: 理解为全体以色列民，或较窄地指以法莲及北方支派。
  rationale: 希伯来文明确使用“约瑟”；保留其名可避免把借代范围在翻译中预先固定。
- issue: בְּצֵאתוֹ 中“他”的所指
  choice: 保留第三人称“他”的含混性。
  alternative: 明确指上帝出去巡行或攻击埃及；或明确指约瑟所代表的以色列离开埃及。
  rationale: 语法形式本身没有明说所指，而两种理解都与出埃及背景相关，不宜在正文中擅自消除张力。
- issue: 末句说话者与时态
  choice: 保留第一人称而不补明说话者，并译作过去时“我听见了”。
  alternative: 理解为诗人自述，或译作现在时“我听见”。
  rationale: 原诗在此发生突兀的人称转换，并将要进入第一人称神谕；不添加主语身份最能保存诗歌结构。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体。“立此为见证”贴近原文措辞；“巡行”用于避免生硬的“出去在埃及地之上”。正文保留“约瑟”、“他”和第一人称转换所含的指代张力。
