  text: ל֗וּ עַ֭מִּ/י שֹׁמֵ֣עַֽ לִ֑/י יִ֝שְׂרָאֵ֗ל בִּ/דְרָכַ֥/י יְהַלֵּֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/013.yaml
  text: Oh[a], that my people would listen to me, that Israel would walk in my ways!
translation:
  language: zh_hans
  text: 但愿我的子民听从我，以色列行在我的道路上！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果我的子民听从我，以色列行在我的道路上……”
    reason: 保留 לוּ 可能具有的条件语气，以及本节与下文衔接时的另一种读法。
lexical_decisions:
- source_word: לוּ
  choice: 但愿
  rationale: 这里引出带有惋惜意味的愿望，而非单纯条件；“但愿”在现代汉语中自然、庄重，也保留原文的感叹语气。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 保留第一人称所属关系及其群体含义；“子民”适合神对以色列说话的语境。
- source_word: שֹׁמֵעַ לִי
  choice: 听从我
  rationale: שׁמע 与 ל 连用在此不只是听见声音，更有留心并顺从之意；“听从”简洁地表达这一含义。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: בִּדְרָכַי
  choice: 在我的道路上
  rationale: 保留“道路”这一生活方式与行为规范的隐喻，不将其过度解释为某一具体教义概念。
- source_word: יְהַלֵּכוּ
  choice: 行
  rationale: 承接“道路”隐喻，表达持续的生活行为；在“但愿”统摄下具有愿望语气。
theological_decisions:
- issue: 愿望语气还是条件语气
  choice: 译作“但愿……”，理解为神带着惋惜所表达的愿望。
  alternative: “如果我的子民听从我，以色列行在我的道路上……”
  rationale: לוּ 可带条件色彩，但本节句法与语境更自然地表现未实现的愿望。正文采用愿望式，同时用脚注保留条件式理解的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“听从”体现听见并顺从的语义；“行在我的道路上”保留希伯来文的行为隐喻。脚注标记置于整节末尾，对应整句的另一种句法理解。
