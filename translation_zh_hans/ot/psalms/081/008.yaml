  text: שְׁמַ֣ע עַ֭מִּ/י וְ/אָעִ֣ידָה בָּ֑/ךְ יִ֝שְׂרָאֵ֗ל אִם תִּֽשְׁמַֽע לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/008.yaml
  text: Hear[a], my people, and I will testify against you; O Israel[b], if you would listen to me!
translation:
  language: zh_hans
  text: 听啊，我的子民！我要指证你[a]。以色列啊，但愿你肯听从我[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要警告你”，或“我要向你作证”。
    reason: lexical_alternative
  - marker: b
    text: 原文也可较直译为：“如果你听从我！”这里的“如果”可带愿望语气。
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: 听啊
  rationale: 这是שׁמע的第二人称阳性单数命令式；“听啊”保留直接、郑重的呼召，也与后半句同一词根形成呼应。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 这是诗篇中常见的盟约性称呼；“我的子民”自然保留其关系性和神学分量。
- source_word: וְאָעִידָה בָּךְ
  choice: 我要作证指控你
  rationale: עוד的使役式可表示作证、郑重警告或告诫；与介词בְּ连用时可带不利于对方的司法意味。“作证指控你”保留这一意味，同时把其他可能译法列入脚注。
- source_word: יִשְׂרָאֵל
  choice: 以色列啊
  rationale: 原文为呼格；加“啊”表现直接呼唤和诗歌语气。
- source_word: אִם
  choice: 但愿
  rationale: אִם通常可表示“如果”，在此诗歌呼语中也可引出愿望或感叹。“但愿”使汉语句子完整自然，并体现恳切的愿望语气。
- source_word: תִּשְׁמַע לִי
  choice: 你肯听从我
  rationale: שׁמע与ל连用不只指听见，也有听从、留心遵从之意；“肯听从我”既与前句“听啊”呼应，也传达诉求意味。
theological_decisions:
- issue: אִם תִּשְׁמַע לִי的语气
  choice: 按愿望式译为“但愿你肯听从我”
  alternative: 较形式对应地译为“如果你听从我”，或感叹式译为“惟愿你听从我”
  rationale: 这里的אִם可能是条件标记，也可能在诗歌中表达愿望。正文采用自然的愿望式汉语，但用脚注保留形式上的条件式可能，避免把原文的语气张力完全消除。
- issue: וְאָעִידָה בָּךְ的司法意味
  choice: 译为“我要作证指控你”
  alternative: 译为“我要警告你”或“我要向你作证”
  rationale: עוד的使役式及其与בְּ的搭配容许作证、警告及不利见证等理解。上下文是上帝对其子民的郑重训诫，正文保留司法性的较强读法，脚注列出其他真实的词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以两个呼语“我的子民”“以色列啊”呈现平行结构；用“听啊／听从我”再现שׁמע的重复。正文保留警告中的司法力度，脚注则呈现词义和语气上的真实歧义。
