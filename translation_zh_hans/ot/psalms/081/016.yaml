  yaml_path: translation/ot/psalms/081/016.yaml
  text: But he would feed him with the finest wheat[b][a], and with honey from the rock I would satisfy you.
translation:
  language: zh_hans
  text: 他本会用上好的麦子喂养他[b][a]；我本会用从磐石而来的蜂蜜使你饱足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“麦子的脂油”；这是希伯来语习语，意思是最丰美、最上等的麦子。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在此转换人称：“他本会喂养他……我本会使你饱足。”其中的单数很可能把以色列民视为一个整体。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּאֲכִילֵהוּ
  choice: 他要……喂养他
  rationale: 使役形表达“使……吃、喂养”；承接上文未实现的条件，采用带假设结果意味的“要”。保留第三人称单数主语和宾语。
- source_word: מֵחֵלֶב חִטָּה
  choice: 用上好的麦子
  rationale: חֵלֶב 字面为“脂油”，用于农产品时指最丰美、最上等的部分；“上好的麦子”自然传达这一希伯来习语。
- source_word: וּמִצּוּר
  choice: 用磐石中的
  rationale: צוּר 指岩石或磐石；与后面的“蜂蜜”合译，保留从坚硬磐石中得供应的鲜明意象。
- source_word: דְּבַשׁ
  choice: 蜂蜜
  rationale: 采用该词在本语境中的通常含义，不泛化为糖浆或甜物。
- source_word: אַשְׂבִּיעֶךָ
  choice: 我要……使你饱足
  rationale: 该使役形意为使人吃饱、得到满足；明确保留第一人称主语和第二人称单数宾语。
theological_decisions:
- issue: 诗句中的人称转换
  choice: 保留“他要……喂养他”到“我要……使你饱足”的转换
  alternative: 统一译为“我要喂养你……使你饱足”
  rationale: 马所拉文本确有第三人称转为第一、第二人称的现象；保留此张力，不以协调性改写消除它。单数代词很可能把以色列作为一个整体来指称。
- issue: 丰盛供应的意象
  choice: 具体保留“上好的麦子”和“磐石中的蜂蜜”
  alternative: 把“磐石”在正文中直接解释为上帝
  rationale: 原文采用农业和荒野中的诗性意象；译文应呈现意象本身，而不在正文中加入寓意化解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“饱足”保留诗体色彩并准确表达满足至充足；正文保留原文突兀的人称转换，脚注加以说明。
