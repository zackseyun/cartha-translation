  text: הַ֭רְנִינוּ לֵ/אלֹהִ֣ים עוּזֵּ֑/נוּ הָ֝רִ֗יעוּ לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/001.yaml
  text: Sing for joy to God[a], our strength; shout aloud to the God of Jacob.
translation:
  language: zh_hans
  text: 你们要向上帝——我们的力量——欢呼歌唱！你们要向雅各的上帝高声欢呼！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高声欢呼”也可译作“发出欢呼声”。原词可指响亮的喝彩、欢呼，或号角般的呼喊。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: 欢呼歌唱
  rationale: 这是רנן的复数命令式，表达因喜乐而发出的颂赞歌声。“欢呼歌唱”兼顾其音乐性和欢欣、响亮的语气。
- source_word: לֵאלֹהִים
  choice: 向上帝
  rationale: 介词ל表示颂赞所指向的对象；本诗语境以及下句“雅各的上帝”都表明אֱלֹהִים在此指独一的上帝。
- source_word: עוּזֵּנוּ
  choice: 我们的力量
  rationale: עוֹז表示力量、能力或威势。直译为“我们的力量”，保留原文把上帝称为其子民力量的凝练表达，不扩展为较具解释性的“避难所”。
- source_word: הָרִיעוּ
  choice: 高声欢呼
  rationale: 这是רוע/ריע使役词干的复数命令式，指响亮的欢呼、喝彩或号角般的呼喊。“高声欢呼”自然地传达其公开而洪亮的赞颂意味。
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: 向雅各的上帝
  rationale: 保留原文的所属结构“雅各的上帝”，其中ל表示呼喊所指向的对象，יַעֲקֹב按人名译作“雅各”。
theological_decisions:
- issue: 两行中אֱלֹהִים的数与所指
  choice: 上帝／雅各的上帝
  alternative: 众神
  rationale: אֱלֹהִים在形态上可以是复数，但本节的平行结构和“雅各的上帝”明确表明所指是以色列的上帝，因此采用单数。
- issue: עוּזֵּנוּ与“上帝”的关系
  choice: 以上帝——我们的力量——保留同位表达
  alternative: 赐我们力量的上帝
  rationale: 原文直称上帝为“我们的力量”，并未明说只是力量的赐予者；同位结构保留这一较强而凝练的神学表述。
translation_notes:
  register: 采用现代、庄重而适合会众诵读的普通话。“欢呼歌唱”与“高声欢呼”再现两项复数命令的诗歌平行；破折号突出“我们的力量”是对上帝的同位称呼。
