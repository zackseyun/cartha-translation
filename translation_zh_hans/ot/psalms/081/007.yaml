base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/007.yaml
  text: In distress you called[a], and I rescued you; I answered you in the hiding place of thunder; I tested you at the waters of Meribah[b]. Selah
translation:
  language: zh_hans
  text: 你在患难中呼求，我就搭救你；我在雷鸣的隐秘处回应你[a]；我在米利巴水边考验你[b]。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我从雷鸣的隐秘处回应你”。这幅希伯来文意象可能描绘上帝隐于风暴中的临在。
    reason: lexical_alternative
  - marker: b
    text: “米利巴”让人想起旷野中因缺水而发生争闹的事件；在那里，上帝考验以色列，以色列也试探上帝。参出埃及记17:1–7；民数记20:1–13。
    reason: cross_reference
lexical_decisions:
- source_word: בַּצָּרָה
  choice: 在困苦中
  rationale: צָרָה表示困境、患难或苦难；“在困苦中”简洁自然，并保留介词短语所表达的处境。
- source_word: קָרָאתָ
  choice: 你呼求
  rationale: קרא在此指为求帮助而呼喊；“呼求”比普通的“呼叫”更符合语境，同时仍未明说希伯来文中省略的呼求对象。
- source_word: וָאֲחַלְּצֶךָּ
  choice: 我就搭救你
  rationale: חלץ的使役形在此意为救出、解救；“搭救”是现代汉语中自然且庄重的表达，也契合出埃及和旷野背景。
- source_word: אֶעֶנְךָ
  choice: 我回应你
  rationale: ענה意为回答、回应；“回应你”自然地承接前面的呼求。
- source_word: בְּסֵתֶר רַעַם
  choice: 在雷鸣的隐密处
  rationale: סֵתֶר可指隐密处、藏身处；按בְּ的通常意义译作“在”，保留上帝在风暴中隐而显现的诗歌意象，不把它限定为某一历史事件。
- source_word: אֶבְחָנְךָ
  choice: 我考验你
  rationale: בחן表示试验、察验；“考验”既可表达检验，也不预先断定其性质纯属惩罚。
- source_word: עַל מֵי מְרִיבָה
  choice: 在米利巴水边
  rationale: עַל在地点语境中可译为“在……边”；“米利巴”按专名音译，并保留“水”的明确所指。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该礼仪或音乐术语的确切含义不明，采用汉语圣经传统音译，以免作猜测性解释。
theological_decisions:
- issue: 雷鸣隐密处所指的神显背景
  choice: 保留“在雷鸣的隐密处”这一隐喻，不明确限定为西奈山或另一场风暴神显。
  alternative: 译作“从雷鸣的隐密处”，或在正文中明说西奈山。
  rationale: 介词בְּ首先支持“在”，而整个短语可能令人联想到西奈山、风暴中的神显或上帝隐密的临在；正文应保留这种开放性。
- issue: 米利巴事件中考验的主体与性质
  choice: 依马所拉文本直译为上帝“考验你”，不将考验解释成单纯惩罚。
  alternative: 根据相关旷野叙事，突出以色列试探上帝或把考验解释为惩罚。
  rationale: 本节语法明确以第一人称上帝为主语、以第二人称以色列为受词；相关叙事存在双向张力，译文不应改写本节的陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“呼求—搭救—回应—考验”保持诗句的紧凑平行结构；“雷鸣的隐密处”有意保留原文不寻常的诗歌意象；“细拉”沿用通行音译。
