  text: אָנֹכִ֨י יְה֘וָ֤ה אֱלֹהֶ֗י/ךָ הַֽ֭/מַּעַלְ/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַרְחֶב פִּ֝֗י/ךָ וַ/אֲמַלְאֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/010.yaml
  text: I am Yahweh your God[a], who brought you up from the land of Egypt. Open your mouth wide[b], and I will fill it.
translation:
  language: zh_hans
  text: 我就是雅威——你的上帝，曾把你从埃及地领上来。张大你的口，我就把它填满。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好让我把它填满。”
    reason: 原文动词形式及其与前句的连接，既可理解为命令之后的应许或结果，也可理解为目的。
lexical_decisions:
- source_word: אָנֹכִי
  choice: 我就是
  rationale: 独立人称代词带有强调作用；“我就是”既适合汉语无动词的身份宣告，也保留了强调语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之上帝的专名，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 该词带第二人称阳性单数后缀，直译为“你的上帝”，保留上帝与受话者之间的盟约关系。
- source_word: הַמַּעַלְךָ
  choice: 曾把你……领上来
  rationale: עלה的使役分词带第二人称单数后缀，指上帝使以色列从埃及上来；“领上来”自然且保留原文的上行意象。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 符合常见的出埃及表述，并准确表达介词מִן的起点意义。
- source_word: הַרְחֶב פִּיךָ
  choice: 张大你的口
  rationale: 使役命令式与“口”搭配，汉语自然表达为“张大……口”，保留具体意象和单数受话对象。
- source_word: וַאֲמַלְאֵהוּ
  choice: 我就把它填满
  rationale: 第一人称单数动词后的第三人称阳性单数后缀回指“口”；“就”自然表达命令之后的应许或结果，同时脚注保留目的性理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较接近学界通行重构读音的“雅威”，以专名而非称号呈现。
- issue: וַאֲמַלְאֵהוּ所表达的应许或目的
  choice: 我就把它填满
  alternative: 好让我把它填满
  rationale: 连接词与第一人称形式在命令句之后可表达随后的结果或应许，也可带目的意味；正文采用自然的应许式表达，脚注保留目的式读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我就是”体现开头代词的强调；破折号清楚标示“你的上帝”是对“雅威”的身份说明。“领上来”保留出埃及叙事中的上行意象。
