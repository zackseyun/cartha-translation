  yaml_path: translation/ot/psalms/081/002.yaml
  text: Raise a song and sound the tambourine[c][b][a], the pleasant lyre with the harp.
translation:
  language: zh_hans
  text: 唱起歌来[a]，敲响手鼓[b]；奏响悦耳的里拉琴，连同竖琴[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“扬起歌声”或“奏起乐歌”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语 תֹף 指一种打击乐器，可能是框鼓一类；传统上也译作“铃鼓”。
    reason: cultural_note
  - marker: c
    text: 译作“里拉琴”（כִּנּוֹר）和“竖琴”（נָבֶל）的两种古代弦乐器，确切形制及彼此区别难以确定；也有译作“竖琴”和“鲁特琴”等。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: 唱起
  rationale: 这是复数命令式，字面有“举起、扬起”之意；与“歌”连用时表示开始或扬起歌声。“唱起”符合现代汉语习惯，又保留发起音乐赞美的动作感。
- source_word: זִמְרָה
  choice: 歌
  rationale: 指歌唱、乐歌或赞美的音乐。“歌”含义宽泛自然，避免用“诗篇”而作过度限定。
- source_word: וּתְנוּ
  choice: 敲响
  rationale: 字面为“给、发出”；与手鼓连用时指使乐器发声。“敲响”在汉语中自然，也符合这种打击乐器的演奏方式。
- source_word: תֹף
  choice: 手鼓
  rationale: 指一种框鼓或类似铃鼓的打击乐器。“手鼓”比传统但较古旧的“鼗鼓”等称呼更易为现代读者理解，也不武断地断定其必带金属小钹。
- source_word: כִּנּוֹר
  choice: 里拉琴
  rationale: 通常指古代里拉琴一类的弦乐器，并非现代大型竖琴。采用音译兼类名的“里拉琴”，可与后面的נָבֶל区分。
- source_word: נָעִים
  choice: 悦耳的
  rationale: 意为令人愉悦、美好的；在音乐语境中译作“悦耳的”自然，并按希伯来语的就近修饰关系直接修饰“里拉琴”。
- source_word: עִם
  choice: 配上
  rationale: 基本义为“与、同”；此处表示两种乐器一同演奏。“配上”自然表达伴奏或合奏关系，而不改变其基本关联。
- source_word: נָבֶל
  choice: 竖琴
  rationale: 指一种与כִּנּוֹר有别的古代弦乐器。确切构造尚不确定；“竖琴”是清楚而传统的近似名称，并与“里拉琴”形成可理解的区分。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可诵读的表达。前半句用“唱起、敲响”形成并列命令，后半句补出汉语所需的演奏动词；“配上”保留עִם所表达的共同演奏关系。避免古奥乐器名称，并以脚注说明器物辨识上的不确定性。
