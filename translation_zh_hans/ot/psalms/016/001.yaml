  text: מִכְתָּ֥ם לְ/דָוִ֑ד שָֽׁמְרֵ֥/נִי אֵ֝֗ל כִּֽי חָסִ֥יתִי בָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/001.yaml
  text: A miktam of David. Preserve me[a], O God, for I take refuge in you.
translation:
  language: zh_hans
  text: 大卫的米克坦[a]。上帝啊，求你保守我，因为我已投靠你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米克坦”是一个含义不确定的希伯来语诗篇标题，可能指某一类作品；有译本译作“诗”“金诗”或“铭刻”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: 米克坦
  rationale: 这是含义不确定的诗篇标题术语。采用音译，避免把有争议的词义武断地译成“诗”“金诗”或“铭刻”。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 标题中的 לְ 可表示作者、归属、关联或献给某人。“大卫的”简洁自然，并比“由大卫所作”更能保留这种语义弹性。
- source_word: שָׁמְרֵנִי
  choice: 求你保守我
  rationale: 祈使式 שׁמר 表达看守、护卫、保存之意。“保守”既适合祷告语体，也不把所求的护佑局限为身体安全。
- source_word: אֵל
  choice: 上帝啊
  rationale: אֵל 是对神的常用称谓；加“啊”自然表达直接呼告。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出祈求的理由，明确表达因果关系。
- source_word: חָסִיתִי
  choice: 我已投靠
  rationale: חסה 带有寻求并得到庇护的意象。完成式译为“已投靠”，保留已经采取行动并持续倚赖的意味；“信靠”则会淡化避难所的形象。
- source_word: בָךְ
  choice: 你
  rationale: 介词 בְ 与 חסה 连用，表示投靠的对象。现代汉语中“投靠你”已自然表达这一关系，无须机械补出介词。
theological_decisions:
- issue: 标题术语 מִכְתָּם 的含义
  choice: 音译为“米克坦”
  alternative: 译作“诗”“金诗”或“铭刻”
  rationale: 该词确切含义无法确定；音译可保留原文形式和解释空间，不把推测当作定论。
- issue: 标题中 לְדָוִד 的关系
  choice: 译作“大卫的”
  alternative: 译作“大卫所作的”或“献给大卫的”
  rationale: 介词 לְ 在诗篇标题中可能表示作者、归属、关联或奉献对象，因此采用较少限定的表达。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“米克坦”保留原文标题术语的不确定性；“求你保守我”符合诗歌呼求的语气；“我已投靠你”兼顾希伯来语完成式与避难意象。
