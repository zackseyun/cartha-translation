  text: לִ֭/קְדוֹשִׁים אֲשֶׁר בָּ/אָ֣רֶץ הֵ֑מָּה וְ֝/אַדִּירֵ֗י כָּל חֶפְצִ/י בָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/003.yaml
  text: As for the holy ones who are in the land[c][b][a], they are the noble ones in whom is all my delight.
translation:
  language: zh_hans
  text: 至于在这地上的圣民[a][b]，他们是尊贵者；我全部的喜悦都在他们之中。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣民”也可译作“圣者”。
    reason: lexical_alternative
  - marker: b
    text: “在这地上”也可译作“在国土中”。
    reason: lexical_alternative
  - marker: c
    text: “尊贵者”也可译作“卓越者”或“威严者”。“我全部的喜悦都在他们之中”也可较自由地译作“他们是我所喜爱的尊贵者”。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: לִקְדוֹשִׁים
  choice: 至于……圣民
  rationale: 句首的 לְ 较难确定；结合语境，将其理解为引出话题的标记，译作“至于”。קְדוֹשִׁים 指分别为圣的人，译作“圣民”自然庄重，又避免直接采用带有较强后世传统色彩的称谓。
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: 地上的
  rationale: אֶרֶץ 可指“地、土地、国土”或“大地”。“地上的”在中文中简洁自然，并与属天存在形成潜在对照，同时不限定为某一国土。
- source_word: הֵמָּה
  choice: 他们是
  rationale: 保留独立代词的强调作用，并补出汉语判断词，使句意清楚。
- source_word: וְאַדִּירֵי
  choice: 尊贵的人
  rationale: אַדִּיר 可表达尊贵、威严、卓越或强大；此处侧重这些圣民受尊崇的地位，译作“尊贵的人”避免误解为军事力量。
- source_word: כָּל חֶפְצִי
  choice: 我所喜爱的一切
  rationale: חֵפֶץ 涵盖喜悦、爱慕、心愿等意义；此译保留“全部”的强度，也用现代汉语表达诗人的深厚喜爱。
- source_word: בָם
  choice: 都在他们身上
  rationale: 保留介词 בְ 的在内或所寄托之意；“在他们身上”比生硬的“在他们里面”更符合现代汉语。
theological_decisions:
- issue: “圣民”的身份
  choice: 正文按地上的敬虔之人来表达，但不进一步界定其群体身份
  alternative: 天上的圣者；泛指被分别为圣者
  rationale: “地上的”较自然地指向世上的人，不过原文的称谓本身仍有一定开放性，因此不加入“信徒”等更具体的神学身份。
- issue: “我所喜爱的一切，都在他们身上”的句法关系
  choice: 将 כָּל חֶפְצִי בָם 处理为诗人的全部喜爱寄托在他们身上
  alternative: 将“尊贵者”与“我所喜爱的一切”更紧密地同位连接，译为“他们是我所喜爱的尊贵者”
  rationale: 原文名词短语结构凝练，存在句法张力；正文尽量保留“全部”和介词短语，而不将其简化为一般性的“我喜爱他们”。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“至于”体现篇章转折；分号保留希伯来诗句两部分之间既并列又互释的关系。所有脚注标记均置于相关正文处。
