  text: תּֽוֹדִיעֵ/נִי֮ אֹ֤רַח חַ֫יִּ֥ים שֹׂ֣בַע שְׂ֭מָחוֹת אֶת פָּנֶ֑י/ךָ נְעִמ֖וֹת בִּ/ימִינְ/ךָ֣ נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/011.yaml
  text: You make known to me the path of life[a]; in your presence is fullness of joy[b]; at your right hand are pleasures forever.
translation:
  language: zh_hans
  text: 你使我知道生命的道路；在你面前有丰盛的喜乐，在你右手中有永远的福乐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹדִיעֵנִי
  choice: 你使我知道
  rationale: 保留ידע使役词干“使……知道”的意义；未完成式在诗歌中的确信语气可用现代汉语现在时表达，虽也可能带将来意味。
- source_word: אֹרַח חַיִּים
  choice: 生命的道路
  rationale: אֹרַח是“路径、道路”，חַיִּים虽为复数形式，却常作抽象名词“生命”；此译保留道路隐喻。
- source_word: שֹׂבַע שְׂמָחוֹת
  choice: 满足的喜乐
  rationale: שֹׂבַע可指饱足、满足或充盈；与复数שְׂמָחוֹת组合，表达喜乐达到充足饱满的状态。汉语用集合性的“喜乐”更自然。
- source_word: אֶת־פָּנֶיךָ
  choice: 在你面前
  rationale: 较贴近字面“与你的面同在／在你的面前”，同时现代汉语也能自然表达亲临其前、与神同在的含义。
- source_word: נְעִמוֹת
  choice: 福乐
  rationale: 该词指可喜悦之物、愉悦或乐趣；“福乐”在此兼顾诗体庄重感与从神而来的美好享受，不将其窄化为感官快乐。
- source_word: בִּימִינְךָ
  choice: 在你右边
  rationale: 介词ב可表示“在”；译作“在你右边”保留空间意象，不额外阐释右边所象征的尊荣或恩宠。
- source_word: נֶצַח
  choice: 永远
  rationale: 在此表示持续不息、长存；“永远”是现代汉语最自然的对应。
theological_decisions:
- issue: פָּנֶיךָ应按字面译作“在你面前”，还是按习语译作“在你同在中”
  choice: 在你面前
  alternative: 在你面前与你同在之处／在你同在中
  rationale: 原文以“面”表达亲身临在。正文保留具体意象，既不隐去其习语含义，也不把神学解释直接替代原文。
- issue: 未完成式תּוֹדִיעֵנִי的时间指向
  choice: 你使我知道
  alternative: 你必使我知道
  rationale: 上下文可表达当下信赖中的确信，也可含将来指向。汉语无标记形式保留一定开放性；不加“必”，避免过早锁定为纯将来。
- issue: “右边”是否应解释为尊荣、能力或恩宠的位置
  choice: 保留“在你右边”的空间意象
  alternative: 从你右手而来的福乐
  rationale: 原文容许“在右边”与“在右手中”等细微理解；直译空间意象可保留其神学丰富性，而不指定单一象征意义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分号与逗号呈现三小句及后两句的平行结构；避免生硬的“喜乐的丰满”，以“满足的喜乐”传达饱足与充盈。
