- from: 你使我知道生命的道路；在你面前有满足的喜乐，在你右边有永远的福乐。
  to: 你使我知道生命的道路；在你面前有丰盛的喜乐，在你右手中有永远的福乐。
  rationale: 修订仅澄清两处词义：以“丰盛的喜乐”传达שֹׂבַע的充盈，以“右手中”保留בִּימִינְךָ的“右手”意象。其余措辞保留原稿的现代庄重诗体与原文句法平行。
