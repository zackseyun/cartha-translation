id: PSA.16.10
reference: Psalms 16:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י לֹא תַעֲזֹ֣ב נַפְשִׁ֣/י לִ/שְׁא֑וֹל לֹֽא תִתֵּ֥ן חֲ֝סִידְ/ךָ֗ לִ/רְא֥וֹת שָֽׁחַת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/010.yaml
  text: For you will not abandon my soul to Sheol[b][a], nor will you let your faithful one see the pit.
translation:
  language: zh_hans
  text: 因为你不会把我的性命撇在阴间，也不会让你的忠信者[a]见到深坑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的圣者”。这个希伯来词可指忠信、忠诚、敬虔或圣洁的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“朽坏”。七十士译本以及新约引用本节时所用的措辞，强调腐朽、败坏。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人能够安心、满怀盼望的缘由；现代汉语用“因为”自然清楚。
- source_word: לֹא תַעֲזֹב
  choice: 不会……撇在
  rationale: עָזַב可指离开、撇弃；“撇在”既保留被留置于死亡权势中的意味，也符合中文诗歌语感。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ在此可指生命、本人或魂。“性命”避免把希伯来语过度限定为与身体分离的“灵魂”，同时保留生命遭死亡威胁的语境。
- source_word: לִשְׁאוֹל
  choice: 在阴间
  rationale: שְׁאוֹל指死人所在之境，并非仅指一座坟墓；“阴间”是现代中文圣经语境中较自然且能表达这一概念的用语。介词在本句中表达被留在或交付于阴间，故译“在”。
- source_word: לֹא תִתֵּן
  choice: 也不会让
  rationale: נָתַן字面为“给”，与不定式连用时可表达准许或任由；“不会让”符合现代汉语习惯。
- source_word: חֲסִידְךָ
  choice: 你的忠信者
  rationale: חָסִיד可描述忠诚、敬虔、蒙分别为圣的人；“忠信者”突出其关系性与忠诚含义，又不把词义只限定为礼仪性的“圣者”。重要的传统译法列入脚注。
- source_word: לִרְאוֹת
  choice: 见到
  rationale: 保留רָאָה“看见”的希伯来语表达；在这里也可含有亲历、遭遇之意。
- source_word: שָׁחַת
  choice: 深坑
  rationale: שַׁחַת可指坑、毁灭或朽坏；与“阴间”平行时，“深坑”最直接地体现马所拉文本语境中的死亡意象。七十士译本及新约引文所反映的“朽坏”列入脚注。
theological_decisions:
- issue: 本节在新约中的弥赛亚应用
  choice: 正文按希伯来诗篇本身的词义译为“忠信者”和“深坑”。
  alternative: 译为“圣者”和“朽坏”，以更直接呼应七十士译本及新约引文。
  rationale: 新约后来把本节应用于弥赛亚，但正文不应因此预先消除希伯来文本原有的词义幅度。脚注保留具有基督论意义的传统译法，使读者既能读到希伯来诗篇的直接表达，也能辨认后来的经文呼应。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“性命”比“灵魂”更能保留נֶפֶשׁ在此处可指整个人及其生命的宽度；“阴间”表达死者之境；两个分句以“不会……也不会……”构成清楚的平行结构。
