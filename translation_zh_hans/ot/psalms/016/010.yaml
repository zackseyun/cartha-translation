  source_fidelity: 正文准确对应希伯来文：כִּי译为“因为”；“不会把我的性命撇在阴间”恰当表达不把诗人/其生命留给阴间；“也不会让你的忠信者见到深坑”保留了两个否定分句及“看见”的原有意象。“性命”恰当地保留נפש可指生命、本人而不限定为脱离身体的“灵魂”；“阴间”适合表达Sheol这一死者之境；“深坑”可对应שחת在此与阴间平行的“坑”意象。
