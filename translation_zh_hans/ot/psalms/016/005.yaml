  text: יְֽהוָ֗ה מְנָת חֶלְקִ֥/י וְ/כוֹסִ֑/י אַ֝תָּ֗ה תּוֹמִ֥יךְ גּוֹרָלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/005.yaml
  text: Yahweh is the portion of my inheritance and my cup[a]; you uphold my lot.
translation:
  language: zh_hans
  text: 耶和华是我的产业，是我杯中的分；我所得的，你为我持守。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“耶和华是我产业的份和我的杯；你托住我的签。”本节接连使用“份”“产业”“杯”和“签”等分配或承受之物的意象；“签”指抽签所得之份。
    reason: 保留“杯”与“签”的字面意象，并说明末句可指神使诗人所分得之份得以稳固。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式译出四字神名，而不以“主”这一称号替代。
- source_word: מְנָת חֶלְקִי
  choice: 我所得的份
  rationale: מְנָת为“分得之份、配给之份”，与חֶלְקִי构成密集的分配、产业意象；中文以“我所得的份”自然表达整体关系，同时避免生硬重复“份中之份”。
- source_word: וְכוֹסִי
  choice: 我杯中的福分
  rationale: 保留“杯”的具体意象，并以“福分”点明这里所指领受的份；不直接消解为“命运”或“经历”。
- source_word: אַתָּה
  choice: 由你
  rationale: 原文显式代词具有强调作用；“由你”保留唯独神亲自施行保守的重点。
- source_word: תּוֹמִיךְ
  choice: 保守
  rationale: 该动词可表达扶持、维持、使稳固；“保守”适合产业被确保、不致失落的语境。
- source_word: גּוֹרָלִי
  choice: 我的产业
  rationale: גּוֹרָל本义为用于分配的“签”，进而指抽签所得之份。此处译“产业”使中文自然，并与上半句的分配、继承意象相连。
theological_decisions:
- issue: 耶和华自己是诗人所得之份
  choice: “耶和华是我所得的份”
  alternative: “耶和华是我的产业”或“耶和华是我所选择的份”
  rationale: 原文把耶和华直接说成诗人被分得的份，表达神自己就是其至宝；译文不增添“选择”这一原文未明说的观念。
- issue: 末句是神维持诗人的签，还是确保其所得产业
  choice: 按语境译为“我的产业由你保守”
  alternative: 较形式对应地译为“你托住我的签”或“你维持我的份”
  rationale: תּוֹמִיךְ גּוֹרָלִי字面可理解为“你托住／维持我的签”。在分地语境中，所指可能是确保抽签所得之份；主译文表达这一含义，脚注保留字面形象与歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所得的份—杯—产业”保留原诗密集的分配意象；借脚注呈现更直译的表达，避免正文过度生硬。
