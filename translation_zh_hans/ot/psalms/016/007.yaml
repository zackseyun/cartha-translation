source:
  edition: WLC
  text: אֲבָרֵ֗ךְ אֶת יְ֭הוָה אֲשֶׁ֣ר יְעָצָ֑/נִי אַף לֵ֝יל֗וֹת יִסְּר֥וּ/נִי כִלְיוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/007.yaml
  text: I will bless Yahweh[a], who counsels me; even at night my inner being instructs me.
translation:
  language: zh_hans
  text: 我要称颂雅威，他劝导我；甚至在夜间，我的内心[a]也告诫我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内心”直译为“我的肾脏”。在希伯来语中，肾脏可象征人的最深处，包括良知和深层情感。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָרֵךְ
  choice: 我要称颂
  rationale: ברך的强意词干用于人对上帝时，表示称颂、赞美；未完成式在这里自然表达诗人的意愿或决心。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为上帝专名的性质，而不以称号代替。
- source_word: יְעָצָנִי
  choice: 他劝导我
  rationale: יעץ的核心意义是出主意、劝告；“劝导”既保留劝告之意，也符合现代汉语诗歌语境。
- source_word: אַף לֵילוֹת
  choice: 即使在夜间
  rationale: אַף带强调、递进意味；לֵילוֹת虽为复数，却可表示反复或延续的夜间时段，汉语用“在夜间”更自然。
- source_word: יִסְּרוּנִי
  choice: 告诫我
  rationale: יסר可指管教、训诲或警戒。“告诫”保留内在纠正和训导的力度，不把它弱化为单纯传授知识。
- source_word: כִלְיוֹתָי
  choice: 我的内心
  rationale: 字面为“我的肾脏”，在希伯来语人体意象中指人最深处的思想、情感或良知。现代汉语以“内心”表达其功能意义，同时用脚注保留原有意象。
theological_decisions:
- issue: כִלְיוֹתָי所表达的人论意象
  choice: 正文译作“我的内心”，脚注说明字面为“我的肾脏”
  alternative: 直译“我的肾脏”，或改译“我的心”“我的思想”
  rationale: 直译在现代汉语中容易被理解为生理器官；“思想”过窄，“心”又可能混同希伯来文另一重要词汇。用“内心”可传达人的内在深处，又不限定为理智或情感中的某一方面。
- issue: 夜间告诫的主体
  choice: 依希伯来文语法保留“我的内心”作直接主体
  alternative: 解释为雅威在夜间借我的内心告诫我
  rationale: 上下文可以使读者理解内在告诫最终与雅威的劝导有关，但本节语法明确以“我的肾脏／内心”为动词主语；译文不把隐含的神学联系改写成明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称颂”保持诗篇敬拜语体；“劝导”和“告诫”分别体现יעץ与יסר的不同力度。脚注标记紧接“内心”，对应其所解释的词。
