id: PSA.16.9
reference: Psalms 16:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֤ן שָׂמַ֣ח לִ֭בִּ/י וַ/יָּ֣גֶל כְּבוֹדִ֑/י אַף בְּ֝שָׂרִ֗/י יִשְׁכֹּ֥ן לָ/בֶֽטַח׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/009.yaml
  text: Therefore my heart is glad[a], and my glory rejoices[b]; even my flesh will dwell securely.
translation:
  language: zh_hans
  text: 因此，我的心欢喜，我的荣耀[a]也欢腾；连我的肉身也必安然居住。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的荣耀”也可译作“我的尊荣”或理解为“我的全人”；有些古代解释者将它与“舌头”联系起来。
    reason: lexical_alternative
  - marker: b
    text: “安然居住”也可译作“安歇在安全之中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 保留承接上文并引出结论的推论语气，同时符合现代汉语表达。
- source_word: שָׂמַח לִבִּי
  choice: 我的心欢喜
  rationale: 直接保留“心”的意象；完成式在本语境中表达因上文所述确信而有的当前喜乐状态。
- source_word: וַיָּגֶל
  choice: 也欢腾
  rationale: גיל 表达强烈、洋溢的喜乐；“欢腾”比单纯重复“欢喜”更能体现平行句中的递进意味，“也”自然连接两个并列分句。
- source_word: כְּבוֹדִי
  choice: 我的荣耀
  rationale: 按字面保留“荣耀”，不在正文中径自判定它是“尊荣”“全人”或“舌头”，并保存与后续经文引用的词语联系。
- source_word: אַף
  choice: 连……也
  rationale: 表达从内在的欢喜推进到肉身安稳的强调和递进。
- source_word: בְּשָׂרִי
  choice: 我的肉身
  rationale: 保留 בשר 的具体身体意象及经文互文联系；这里不赋予“罪性”的含义。
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: 必安然居住
  rationale: “居住”直接对应 שכן，“安然”自然表达 לָבֶטַח 所指的安全、无忧状态；“必”体现未完成式在本语境中的将来确信。
theological_decisions:
- issue: כְּבוֹדִי 在本节及其后续基督论引用中的译法
  choice: 我的荣耀
  alternative: 我的尊荣；我的全人；我的舌头
  rationale: 希伯来语名词的字面意义是“荣耀”。正文保留这一措辞，可避免过早消解其习语可能性，也保留与《使徒行传》2章所引希腊语“我的荣耀”的联系；其他理解列入脚注。
- issue: בְּשָׂרִי 的译法
  choice: 我的肉身
  alternative: 我的身体
  rationale: “肉身”既忠实保留原文意象，也不会在此处自动引入“罪性”的神学含义；同时有助于保存与后续引用的互文关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我的荣耀”在汉语中略显不寻常，但这是有意保留原文真实的词义张力；脚注说明主要解释方案。“连……也……”呈现 אַף 的递进强调，分号保留诗句由内在喜乐转向身体安稳的结构。
