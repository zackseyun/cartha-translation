id: PSA.16.4
reference: Psalms 16:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִרְבּ֥וּ עַצְּבוֹתָ/ם֮ אַחֵ֪ר מָ֫הָ֥רוּ בַּל אַסִּ֣יךְ נִסְכֵּי/הֶ֣ם מִ/דָּ֑ם וּֽ/בַל אֶשָּׂ֥א אֶת שְׁ֝מוֹתָ֗/ם עַל שְׂפָתָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/004.yaml
  text: The sorrows of those who hurry after another god will multiply[a]; I will not pour out their drink offerings of blood[b], nor will I lift up their names on my lips.
translation:
  language: zh_hans
  text: 追随别神之人的愁苦必增多[a]；他们以血献的奠祭[b]，我必不浇奠；他们的名字，我也绝不挂在嘴上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的偶像必增多。”这里的希伯来词在某些语境中可与偶像有关，但本句译作“愁苦”更符合上下文。
    reason: alternative_reading
  - marker: b
    text: “以血献的奠祭”也可译作“血的奠祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְבּוּ
  choice: 必增多
  rationale: רבה 的 Qal 未完成式表达增加；“必增多”自然传达诗句所断言的后果。
- source_word: עַצְּבוֹתָם
  choice: 追随别神之人的愁苦
  rationale: 该词在此最自然地指拜偶像者所遭受的愁苦；与后文奠祭及名字的语境相连，同时在脚注保留“偶像”的可能。
- source_word: אַחֵר
  choice: 别神
  rationale: 原文直译为“另一个”；祭祀语境表明所指是别的神明，汉语用“别神”简洁清楚。
- source_word: מָהָרוּ
  choice: 追随
  rationale: מהר 通常表示急忙、赶快；这里结合 אַחֵר 表达热切趋附之意。正文用自然的“追随”，其急切色彩由语境承载。
- source_word: בַּל
  choice: 必不／绝不
  rationale: 这是诗体否定词；两处分以“必不”和“绝不”表达坚定拒绝，也使汉语避免机械重复。
- source_word: אַסִּיךְ
  choice: 浇奠
  rationale: נסך 的 Hiphil 指倒出奠祭。“浇奠”保留祭祀动作和专门含义。
- source_word: נִסְכֵּיהֶם
  choice: 他们……献的奠祭
  rationale: 该词是祭祀用语，指液体祭物；“奠祭”在现代汉语宗教文本中准确而简洁。
- source_word: מִדָּם
  choice: 以血献的
  rationale: 介词 מן 可表示材料或来源；“以血献的奠祭”在汉语中通顺，并保留血作为祭物材料的惊人意象。脚注列出“血的”这一较贴近形式的译法。
- source_word: אֶשָּׂא
  choice: 挂在嘴上
  rationale: נשא 与“名字”“嘴唇”连用，语用上指提说；“挂在嘴上”既保留口唇意象，又是自然现代汉语。
- source_word: שְׁמוֹתָם
  choice: 他们的名字
  rationale: 保持代词所指的原文含混；它可能指别神的名字，也可能指相关敬拜者的名字，不在正文中强行限定。
- source_word: עַל שְׂפָתָי
  choice: 挂在嘴上
  rationale: 将“在我的嘴唇上”的意象转化为自然汉语习语，表达绝不提说。
theological_decisions:
- issue: אַחֵר 后省略的对象
  choice: 别神
  alternative: 另一个／别的
  rationale: 奠祭和名字的祭祀语境指向别的神明；补出“神”可使现代汉语清楚，却不增添额外教义。
- issue: עַצְּבוֹתָם 的含义
  choice: 愁苦
  alternative: 偶像
  rationale: 本行最自然地陈述追随别神者的后果：愁苦增多。“偶像”也是相关词形在某些语境中的可能含义，故在脚注保留。
- issue: “他们的名字”的指代
  choice: 保留代词，不明确限定
  alternative: 明确译作“那些神的名字”或“那些人的名字”
  rationale: 希伯来语代词的指向可能是别神，也可能是其追随者；正文保留这一真实含混，避免替原文作神学定断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“浇奠”保留祭祀术语，“挂在嘴上”使原文的口唇意象在现代汉语中清楚可懂。所有脚注标记均已置于正文。
