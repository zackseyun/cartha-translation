  yaml_path: translation/ot/psalms/016/002.yaml
  text: I said to Yahweh[a], “You are my Lord; I have no good apart from you.”
translation:
  language: zh_hans
  text: 我对雅威说：“你是我的主；除了你，我没有福分。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“我的福分不在你以外。”原文十分凝练；末句较形式化地可表达为“我的福分并不超出你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתְּ
  choice: 我……说
  rationale: 马所拉文本的书写形式表面上是第二人称阴性单数，但上下文是诗人向上帝所作的第一人称宣认；古代译本与传统理解也支持第一人称。中文须明示主语，因此译为“我……说”。
- source_word: לַיהוָה
  choice: 对雅威
  rationale: 介词 ל 在此标示说话的对象，译为“对”；יהוה 按其专名译为“雅威”。
- source_word: אֲדֹנָי אָתָּה
  choice: 你是我的主
  rationale: אֲדֹנָי 带第一人称单数后缀，意为“我的主”；独立代词 אָתָּה 带有强调意味，中文以“你是”自然表达无系词句。
- source_word: טוֹבָתִי
  choice: 我的福分
  rationale: 该词可指属于诗人的好处、福祉或益处。“福分”在祷告与诗歌语境中自然庄重，并避免“我的良善”可能引出的道德含义。
- source_word: בַּל עָלֶיךָ
  choice: 不在你以外
  rationale: בַּל 是否定词；עַל 的基本空间意义在这一凝练诗句中可表达“超出、在……之外”。此译保留“我的福分并不延伸到雅威之外”的意象，也自然表达一切福分不离于他的宣认。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。音译“雅威”保留这是盟约神名，而不以“主”这一称号代替，也能与随后“我的主”清楚区分。
- issue: 末句的意义
  choice: 我的福分不在你以外
  alternative: 离了你，我就没有福分
  rationale: 希伯来文“טוֹבָתִי בַּל עָלֶיךָ”简练且存在句法张力。正文采用较贴近形式的表达，保留“我的好处不超出你”的空间性隐喻；脚注列出更顺畅的意义译法，而不把它扩大为对诗人自身道德良善的判断。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“雅威”与“我的主”分别呈现神名和称号；末句略保留希伯来诗歌的凝练与空间意象，并用脚注说明通顺译法。
