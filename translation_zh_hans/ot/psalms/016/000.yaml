  yaml_path: translation/ot/psalms/016/000.yaml
  text: A miktam of David. Preserve me[a], God, for I take refuge in you.
translation:
  language: zh_hans
  text: 大卫的金诗[a]。神啊，求你保护我，因为我投靠你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“米克坦”（miktam），是含义不确定的诗篇标题，可能指某一类作品；有译本译作“诗篇”或“金歌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: 金诗
  rationale: 这是诗篇标题中的专门术语，确切含义不明；采用简洁且有中文圣经传统依据的名称，同时以脚注保留不确定性，避免把它确定解释为普通“诗篇”或“金歌”。
- source_word: שָׁמְרֵנִי
  choice: 求你保护我
  rationale: 该祈使式意为看守、保守或保护；现代汉语用“保护”自然清楚，“求你”恰当地表达祈求语气。
- source_word: חָסִיתִי בָךְ
  choice: 我投靠你
  rationale: 动词表达寻求庇护、以某人为避难所；“投靠你”保留其具体的庇护意象，并符合现代汉语表达。
theological_decisions:
- issue: 对神的称呼 אֵל
  choice: 神啊
  alternative: 上帝啊／大能者啊
  rationale: 此处是直接呼求；“神啊”准确、自然，也不把一般神名额外解释为强调能力的称号。
- issue: כִּי 的逻辑关系
  choice: 因为
  alternative: 我既然／因为我已经
  rationale: 保留原文明确的理由关系，不额外判定投靠行为的时间重点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“金诗”作为标题术语保留传统感，其不确定含义由脚注说明；正文祈求句简洁直接。
