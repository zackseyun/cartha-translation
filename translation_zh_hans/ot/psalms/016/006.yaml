base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/006.yaml
  text: The boundary lines have fallen for me in pleasant places[a]; indeed[b], my inheritance is beautiful to me.
translation:
  language: zh_hans
  text: 界线为我落在佳美之地[a]；我的产业实在美好[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“量地的绳索为我落在佳美之地。”希伯来文描绘用绳索丈量并划定所得产业的景象。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我的产业对我何其佳美。”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבָלִים
  choice: 量给我的界线
  rationale: 该词本指绳索，也可指丈量土地的准绳、划定的界线或所得地业；结合“落在”和下句“产业”，译作“量给我的界线”，既保留土地分配的具体意象，也在现代汉语中较为清楚。
- source_word: נָפְלוּ
  choice: 落在
  rationale: 保留希伯来文“落下”的表达；在分地语境中暗含抽签或划定所得份额之意，不直接释译为“分得”，以免抹平原有图像。
- source_word: לִי
  choice: 给我的
  rationale: 表达受益者或归属关系；与“界线”搭配译作“量给我的”，比机械译成“向我”自然。
- source_word: בַּנְּעִמִים
  choice: 在佳美之地
  rationale: נעים 表示悦人、美好、可喜；复数形式配合介词，在分地意象中适合表达为地点性的“佳美之地”。
- source_word: אַף
  choice: 实在
  rationale: 在此用于加强并肯定前句；“实在”自然传达强调语气，而不只表示附加的“也”。
- source_word: נַחֲלָת
  choice: 我的产业
  rationale: 此处指所承受、所分得的份；“产业”保留土地承受与盟约分业的语感，同时与第5节的“份”意象相呼应。
- source_word: שָׁפְרָה
  choice: 令我喜悦
  rationale: 该动词可表示美好、悦人、合意。结合 עָלַי，译成“令我喜悦”是自然的现代汉语，同时保留评价性的含义。
- source_word: עָלַי
  choice: 令我
  rationale: 字面为“在我之上”，此处表达相对于说话者而言的合意或美好；融入“令我喜悦”可自然呈现这种关系。
theological_decisions:
- issue: 土地分配意象与诗人所得之份的关系
  choice: 保留“界线”“产业”等具体分地意象，不将其泛化为一般性的福分。
  alternative: 译为“我所得的福分尽都美好；我的份令我喜悦”。
  rationale: 本节的措辞呼应土地丈量、划界和承受产业，也与上文耶和华是诗人的“份”相关。保留具体意象可维持经文的神学层次，同时不预先断定这里专指实际土地还是比喻性的属神之份。
- issue: שָׁפְרָה עָלָי 的语义范围
  choice: 译为“令我喜悦”，突出产业在诗人看来美好、合意。
  alternative: 译为“对我何其佳美”或“对我十分美好”。
  rationale: 原文可同时带有美丽、可喜、合意的色彩；“令我喜悦”符合汉语习惯，但脚注保留“佳美”这一较贴近形式的可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“量给我的界线”保留原文分地意象；分号呈现两个平行分句，“实在”传达 אַף 的强调作用。所有脚注标记均置于正文对应位置。
