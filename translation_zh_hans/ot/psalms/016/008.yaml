  text: שִׁוִּ֬יתִי יְהוָ֣ה לְ/נֶגְדִּ֣/י תָמִ֑יד כִּ֥י מִֽ֝/ימִינִ֗/י בַּל אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/008.yaml
  text: I have set Yahweh before me continually[a]; because he is at my right hand[b], I will not be shaken.
translation:
  language: zh_hans
  text: 我常将雅威[a]置于我面前；因他在我右边，我必不动摇[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来语神名 YHWH 的音译；传统上也译作“耶和华”。
    reason: alternative_reading
  - marker: b
    text: 或译：“我必不被摇动。”原文可指不摇晃，或不从稳固的位置上被挪动。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: 我……摆
  rationale: 该词为 שׁוה 的 Piel 完成式，在此表示有意放置、安置。译作“摆”保留主动而坚定的行动；结合“始终”，也传达这一既定行动持续生效的意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是四字神名 YHWH。采用现代汉语中按可能读音音译的“雅威”，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: לְנֶגְדִּי
  choice: 在面前
  rationale: נגד 加第一人称后缀表示在说话者面前或视线之中。“在面前”自然简洁，并保留原文的空间和关注意象。
- source_word: תָמִיד
  choice: 始终
  rationale: 表示持续不断或恒常。“始终”在现代汉语中自然凝练，适合诗歌语体。
- source_word: כִּי
  choice: 因
  rationale: 这里引出诗人不会动摇的理由。“因”清楚表达因果关系，同时保持诗句简洁庄重。
- source_word: מִימִינִי
  choice: 在我右边
  rationale: 直译为“在我的右手边”，可表达临近、扶助和保护。“在我右边”保留原文意象，又符合现代汉语表达。
- source_word: בַּל
  choice: 不
  rationale: 这是诗体否定词。译作“不”不过度增加原文未明说的强调。
- source_word: אֶמּוֹט
  choice: 我必不动摇
  rationale: 源自动词 מוט，表示摇晃、踉跄或从稳固位置被挪动。“不动摇”既保留稳定性的意象，也自然传达诗人内在坚定的比喻义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”作为 YHWH 可能读音的现代汉语音译，以保留专名；脚注列出汉语传统译名“耶和华”，不把两种形式之间的选择提升为经文本身的神学断言。
- issue: “在我右边”的含义
  choice: 保留空间意象，不在正文中明说“保护”或“扶助”
  alternative: 他保护我／他扶助我
  rationale: 右边的位置在语境中可暗示支持和保护，但原文仍使用具体空间意象。保留该意象可避免把隐含意义变成明说内容。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留“摆在面前”和“在我右边”两组具体空间意象，并用“始终”“必不动摇”呈现诗句的持续专注与坚定信心。
