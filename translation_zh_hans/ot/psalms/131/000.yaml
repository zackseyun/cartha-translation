  text: A Song of Ascents[b][a]. Of David.
translation:
  language: zh_hans
  text: '上行之诗。大卫的诗[a]。


    耶和华啊，我的心不高傲，

    我的眼目也不高傲；

    我不追求大事，

    也不追求超乎我的奇妙之事[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“大卫作的诗”或“为大卫而作”。希伯来文标题可表示作者、归属、关联或献予。
    reason: alternative_reading
  - marker: b
    text: 或译“超过我的奇妙之事”。希伯来文所指的是超过说话者本分、范围或能力的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之诗
  rationale: 保留传统且简洁的译法；מעלות可指上行、登阶，作为诗集标题，其具体背景并不完全确定。
- source_word: גָבַהּ לִבִּי
  choice: 我的心不高傲
  rationale: גבה字面为“高”，用于心时表达骄傲、自高。
- source_word: רָמוּ עֵינַי
  choice: 我的眼目也不自大
  rationale: 保留“眼目高举”的身体意象所表达的傲慢，同时用现代汉语使含义清楚。
- source_word: הִלַּכְתִּי
  choice: 我不追求
  rationale: 此处字面为“行走”，语境中指涉足、追逐或经营某些事情；“追求”自然传达其引申义。
- source_word: בִגְדֹלוֹת
  choice: 宏大的事
  rationale: 保留复数名词的宽泛性，不限定为权力、事业或奥秘。
- source_word: בְנִפְלָאוֹת מִמֶּנִּי
  choice: 我力不能及的奇事
  rationale: נפלאות可指非凡、奇妙之事；ממני表达超出说话者的范围或能力，译文保留两层含义。
theological_decisions:
- issue: לְדָוִד所表示的关系
  choice: 大卫的诗
  alternative: 大卫作的诗／为大卫而作
  rationale: 希伯来语介词ל可表示作者、归属、关联或献予；正文采用自然的传统表达，并以脚注保留歧义。
- issue: 诗人所拒绝的是何种“大事”和“奇事”
  choice: 不具体限定其对象
  alternative: 解释为神学奥秘、政治野心或超越身份的事务
  rationale: 原文保持概括，强调不高傲和不涉足超过自身的事；不应导入特定教义或历史解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；分行呈现希伯来诗歌的平行结构。神名יהוה译作“耶和华”。脚注标记均置于正文相应位置；英文咨询层中[b]附在标题后，但其脚注内容实际对应末句，故依据希伯来原文将[b]置于“我力不能及的奇事”之后。
