source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לְ/דָ֫וִ֥ד יְהוָ֤ה לֹא גָבַ֣הּ לִ֭בִּ/י וְ/לֹא רָמ֣וּ עֵינַ֑/י וְ/לֹֽא הִלַּ֓כְתִּי בִּ/גְדֹל֖וֹת וּ/בְ/נִפְלָא֣וֹת מִמֶּֽ/נִּי׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/001.yaml
  text: 'A Song of Ascents[a]. Of David.

    Yahweh, my heart is not proud, and my eyes are not raised high[b]; I have not walked in things too great and too wondrous for me.'
translation:
  language: zh_hans
  text: '上行之歌。大卫的诗[a]。


    耶和华啊，我的心不高傲，我的眼目也不高抬；我没有涉足于超乎我能力的大事和奇事[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”也可译作“大卫所作”“献给大卫”，或理解为“与大卫有关”；希伯来文标题可表示作者、归属或献呈。
    reason: alternative_reading
  - marker: b
    text: “超乎我能力的”也可理解为“超出我应有地位或范围的”。希伯来文指超过说话者适当范围或能力的事；此处修饰“大事”和“奇事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: מַעֲלוֹת意为“上升、上行”，这里是诗篇组别的固定标题；“上行之歌”既保留原文意象，也符合现代中文圣经语体。
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 介词לְ在诗篇标题中可表示作者、归属或献呈；正文采用自然且传统的“大卫的诗”，并以脚注保留“大卫所作／献给大卫”等可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，而不以“主”这一称号替代；“耶和华”是现代简体中文读者最熟悉的神名音译。
- source_word: גָבַהּ לִבִּי
  choice: 我的心不高傲
  rationale: 原文直译为“我的心不高”，在语境中指骄傲自高；“不高傲”自然传达其道德含义。
- source_word: רָמוּ עֵינַי
  choice: 我的眼目也不高抬
  rationale: 保留“眼目抬高”的身体意象，同时表达傲慢、自视甚高之意。
- source_word: הִלַּכְתִּי
  choice: 我没有涉足于
  rationale: הלך的加强式在此可指行走、往来或从事；“涉足于”能自然连接后面的抽象事务，并保留主动介入之意。
- source_word: בִּגְדֹלוֹת
  choice: 太大的事
  rationale: 复数形容词名词化，指重大的事务；结合מִמֶּנִּי，译作“太大的事”体现超过说话者分量或能力的含义。
- source_word: וּבְנִפְלָאוֹת
  choice: 奇事
  rationale: נִפְלָאוֹת指非凡、奇妙或难以理解之事；“奇事”简洁保留其超常与令人惊异的色彩。
- source_word: מִמֶּנִּי
  choice: 我力所不及的
  rationale: 该短语表示相对于说话者而言过高、超出范围或能力；此译法使现代读者清楚理解，同时脚注说明也可理解为超出本人应有的地位或范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用以色列之神的专名，故正文保留专名而不换成称号“主”；采用中文读者最通行的音译“耶和华”。
- issue: 标题לְדָוִד的归属关系
  choice: 大卫的诗
  alternative: 大卫所作；献给大卫；与大卫有关
  rationale: 介词לְ本身不能明确裁定作者身份、关联或献呈关系；正文采用自然标题，脚注明确保留原文歧义。
- issue: 超出说话者的“太大的事”和“奇事”
  choice: 表达为超过本人能力的事务
  alternative: 超过本人应有地位或适当范围的事务
  rationale: מִמֶּנִּי可指超出能力，也可指超出合宜范围；正文选用自然中文，脚注保留另一层可能，避免把谦卑仅限于智力或能力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“心不高傲／眼目不高抬”保留希伯来诗歌的平行结构和身体意象；末句重复“涉足于”以明确两个并列介词短语的关系，并保持诗句节奏。
