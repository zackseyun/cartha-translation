  naturalness: 整体庄重、自然。“上行之歌”“耶和华啊”“心不高傲、眼目不高抬”合乎现代中文圣经语体。将末句改为“超乎我能力的大事和奇事”更紧凑，也避免重复“涉足于”。
  terminology: “上行之歌”适切；“耶和华”保留神名；“大卫的诗”在脚注说明下可保留 לְדָוִד 的归属歧义。“大事和奇事”对应 בִּגְדֹלוֹת וּבְנִפְלָאוֹת，且不作不当的神学限定。
