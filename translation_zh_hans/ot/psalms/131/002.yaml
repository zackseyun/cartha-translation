source:
  edition: WLC
  text: אִם לֹ֤א שִׁוִּ֨יתִי וְ/דוֹמַ֗מְתִּי נַ֫פְשִׁ֥/י כְּ֭/גָמֻל עֲלֵ֣י אִמּ֑/וֹ כַּ/גָּמֻ֖ל עָלַ֣/י נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/002.yaml
  text: Surely I have calmed and quieted my soul[a], like a weaned child with his mother[c][b]; like a weaned child is my soul within me.
translation:
  language: zh_hans
  text: 我确实使自己的心平静安稳[a]，好像断了奶的孩子依偎在母亲身旁[b]；我的心也像断了奶的孩子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我确实”原文直译为“我若没有”；这里是带有誓言色彩的强调说法。前一动词也可译为“使……平稳”或“使……平正”。
    reason: 说明希伯来语强调惯用语及词义选择。
  - marker: b
    text: 原文可直译为“像断了奶的孩子在母亲身上”。画面是孩子已经断奶，不再为吃奶躁动，安静地紧靠母亲。
    reason: 保留介词的字面表达，并说明古代生活图景。
  - marker: c
    text: 原文也可直译为“我的心像断了奶的孩子在我身上”或“于我”。这句话的句法和介词所指较难确定；正文只保留其重复的比较，没有进一步限定其含义。
    reason: 保留原句真实的句法困难和另一种可能译法。
lexical_decisions:
- source_word: אִם לֹא
  choice: 我确实
  rationale: 这里的“若不”是带有誓言色彩的强调惯用语，并非真正提出条件；“确实”能用自然的现代汉语表达诗人的郑重自述。
- source_word: שִׁוִּיתִי וְדוֹמַמְתִּי
  choice: 使……平静安稳
  rationale: שִׁוִּיתִי在此指使内在状态平稳、平正，וְדוֹמַמְתִּי指使之安静无声；合译为“平静安稳”，既保留主动克制的意味，也符合汉语搭配。
- source_word: נַפְשִׁי
  choice: 自己的心／我的心
  rationale: נפש在这里指诗人的内在自我与情感生命。“心”在现代汉语诗歌和经文语体中自然，也避免把该词限定为与身体相分离的技术性“灵魂”概念。
- source_word: כְּגָמֻל
  choice: 好像断了奶的孩子
  rationale: 该被动分词指已经断奶的人；上下文以幼儿不再因吃奶而躁动、安然与母亲同在为喻。
- source_word: עֲלֵי אִמּוֹ
  choice: 依偎着母亲
  rationale: 介词עַל在此表达孩子紧靠母亲的亲密位置。译作“依偎着”比生硬的“在母亲之上”更符合现代汉语，同时保留身体亲近的画面。
- source_word: כַּגָּמֻל עָלַי נַפְשִׁי
  choice: 我的心在我里面，就像断了奶的孩子
  rationale: 原句再次陈述比喻，但עָלַי字面为“在我身上”，句法和所指较难确定。正文采用自然汉语表达内心安定于自身的可能含义，脚注保留较直译的形式。
theological_decisions:
- issue: נַפְשִׁי所表达的人论含义
  choice: 译为“自己的心／我的心”，指诗人的内在自我，不把它技术化为可与身体分割的“灵魂”。
  alternative: 译为“我的灵魂”或“我的内在生命”。
  rationale: 本节着重描写诗人内在生命被安抚后的状态；“心”既能承载这一含义，又不替原文作超出语境的身心二分论断。
- issue: 断奶孩子的比喻
  choice: 保留“断了奶”的具体形象，不将其释义为信靠、满足或顺服。
  alternative: 直接译成“满足安静的孩子”或加入属灵解释。
  rationale: 原文以具体而含蓄的母子图景表达安稳；保留图景可避免把可能的神学寓意提前写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“平静安稳”形成舒缓节奏；“依偎着母亲”使母子画面自然可感。正文避免古奥的“我若不曾”和带技术性身心二分色彩的“灵魂”，同时借脚注保留希伯来语的字面结构与歧义。
