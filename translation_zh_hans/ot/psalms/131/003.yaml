  yaml_path: translation/ot/psalms/131/003.yaml
  text: Israel[a], hope in Yahweh from now and forever.
translation:
  language: zh_hans
  text: 以色列啊，要仰望耶和华，从今以后，直到永远！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחֵל
  choice: 要仰望
  rationale: 该未完成式在此具有劝勉语气。“仰望”自然表达带着信靠的期待，比单纯的“等候”更完整；加“要”体现呼吁语气。
- source_word: יִשְׂרָאֵל
  choice: 以色列啊
  rationale: 作为对圣约群体的直接呼语；“啊”清楚标示呼格，并符合诗歌劝勉的庄重语体。
- source_word: אֶל
  choice: 仰望耶和华
  rationale: 介词本义为“向、朝向”，与 יחל 连用时指把盼望投向某位对象；汉语以“仰望耶和华”自然传达这种信靠关系，无须逐字另译介词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名最通行、最易辨识的专名译法，而非以“主”这一称号替代。
- source_word: מֵעַתָּה
  choice: 从今时
  rationale: 准确保留时间起点；与后面的“直到永远”组成自然、庄重而易懂的固定表达。
- source_word: וְעַד עוֹלָם
  choice: 直到永远
  rationale: 表达延续至无尽将来的时间范围；汉语不机械翻出连接词 וְ，而以“从……直到……”完整呈现原文结构。
theological_decisions:
- issue: 句首劝勉性动词形式的表达
  choice: 以色列啊，要仰望耶和华
  alternative: 愿以色列仰望耶和华
  rationale: 希伯来语形式可理解为第三人称祈愿式，也可按面向群体的直接劝勉表达。诗篇结尾的共同体呼召用直接呼语在现代汉语中更自然，同时保留劝勉力度；不把它处理为关于以色列现状的陈述。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌劝勉语体。句式简洁，保留共同体呼召及从现在延伸到永远的时间张力。原文不存在必须以脚注标示的文本异读；英文脚注只是同一希伯来语劝勉形式的两种表达，因此在中文正文中选择直接呼语，不另设脚注。
