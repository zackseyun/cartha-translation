  text: יְֽהוָ֗ה אַל בְּ/אַפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וְֽ/אַל בַּ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], and do not discipline me in your wrath.
translation:
  language: zh_hans
  text: 耶和华啊，不要在怒中责备我，也不要在烈怒中管教我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名；句末“啊”自然表达祷告中的直接呼告。
- source_word: אַל
  choice: 不要
  rationale: 与未完成式动词连用，在此表达恳求式禁止；“不要”简洁自然。
- source_word: בְּאַפְּךָ
  choice: 在怒中
  rationale: אַף字面与“鼻”有关，此处惯用义为愤怒；介词בְּ译为“在……中”，保留诗人所求并非绝对免受责备，而是不要在盛怒中受责备这一张力。
- source_word: תוֹכִיחֵנִי
  choice: 责备我
  rationale: יכח的使役式在此指责备、谴责或纠正；“责备”庄重自然，也能与下句“管教”区分。
- source_word: וְאַל
  choice: 也不要
  rationale: 用“也”连接两个平行的否定祈求，使现代中文流畅，同时保存希伯来诗句的对应结构。
- source_word: בַּחֲמָתְךָ
  choice: 在烈怒中
  rationale: חֵמָה常指炽烈的愤怒；“烈怒”既与前句的“怒”有所区分，也反映词中较强的炽热色彩。
- source_word: תְיַסְּרֵנִי
  choice: 管教我
  rationale: יסר的加强式可指借纠正而管教，也可能含惩戒意味；“管教”保留教育性与惩戒性的语义范围，避免缩窄为单纯“惩罚”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且庄重的“耶和华”，不以称号“主”取代专名；“雅威”是较接近学界重构读音的另一种译法。
- issue: 诗人是否拒绝一切责备和管教
  choice: 保留“在怒中／在烈怒中”的修饰关系
  alternative: 理解为祈求完全免受责备和管教
  rationale: 两个介词短语直接修饰对应动词。译文不删去这些限定，从而保留诗人可能并非拒绝管教本身，而是求神不要在愤怒中施行的神学张力。
- issue: 两个表示神愤怒的平行词
  choice: 怒／烈怒
  alternative: 愤怒／震怒
  rationale: 原文使用אַף与חֵמָה两个相关而不完全相同的词。“怒／烈怒”维持平行与递进感，但不把两者解释成截然不同的神学类别。
translation_notes:
  register: 采用简洁、庄重而现代的祷告语言；保留两行平行结构及“责备／管教”“怒／烈怒”的词义差异。正文无需脚注，因各项选择均可在不妨碍可读性的情况下直接表达。
