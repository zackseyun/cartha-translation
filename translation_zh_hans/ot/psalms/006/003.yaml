  text: וְ֭/נַפְשִׁ/י נִבְהֲלָ֣ה מְאֹ֑ד ו/את יְ֝הוָ֗ה עַד מָתָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/003.yaml
  text: And my soul is greatly troubled—but you[a], O Yahweh[d][c][b], how long?
translation:
  language: zh_hans
  text: 我的心[a]也极其惊惶[b]；雅威[d]啊，你要到几时呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的心”原文也可理解为“我的性命”或“我自己”。
    reason: lexical_alternative
  - marker: b
    text: “惊惶”也可译作“惊恐”或“惶乱”。
    reason: lexical_alternative
  - marker: d
    text: 原文是四字神名“YHWH”；此处译作“雅威”。中文传统常译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: 我的心
  rationale: נֶפֶשׁ可指生命、自我或内在的人。上文提到身体和骨头，本句转向诗人内在的痛苦；“我的心”在现代汉语中自然，又保留诗歌中的身心层次。前缀连接词则以“也”承接上文。
- source_word: נִבְהֲלָה מְאֹד
  choice: 极其惊惶
  rationale: בהל表达受到强烈震动、惊恐或惶乱，מְאֹד加重程度。“极其惊惶”既传达强烈情绪，也不把词义限定为单纯的恐惧。
- source_word: וְאַתָּה
  choice: 可是你呢
  rationale: וְ形式上是“而／和”，但这里从诗人的痛苦急转为向上帝呼求，具有转折语气。“可是你呢”自然呈现这一转折，也保留原文未明说谓语的悬宕感。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名YHWH。采用现代中文读者熟悉的专名“耶和华”，不以“主”这一称号替代；脚注同时说明“雅威”这一译法。
- source_word: עַד מָתָי
  choice: 要到几时呢？
  rationale: 这是希伯来哀歌中常见的急切呼问。中文“要到几时呢？”保留其开放而未补足的语法，不擅自说明究竟要等候哪一行动。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；或按传统以“主”代称
  rationale: 原文直接使用上帝的专名而非称号。正文以中文通行的“耶和华”保留专名性质，脚注交代其希伯来字母及另一常见拟音，避免把某一拟音说成无争议的原始读音。
- issue: “要到几时”所期待的行动
  choice: 不补出具体谓语
  alternative: 补作“你才来搭救我”或“你才垂听”
  rationale: 希伯来文本在“而你，YHWH”之后直接说“到几时”，没有明说上帝将采取何种行动。保留省略可维持哀歌的张力与多义性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“极其惊惶”承接哀歌的强烈情绪；末句保留原文省略谓语的突兀呼问，不将隐含意思解释进正文。
