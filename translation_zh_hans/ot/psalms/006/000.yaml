lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 此词在诗篇题注中通常指负责统筹音乐演奏的人。“乐长”简洁庄重，也比泛称“领袖”更切合礼仪和音乐语境。
- source_word: בִּנְגִינוֹת
  choice: 用弦乐器
  rationale: 该词在音乐题注中指弦乐或弦乐器；此译法自然，并保留演奏方式的含义。
- source_word: עַל
  choice: 按
  rationale: 在诗篇题注中可引出曲调、调式或演奏安排。“按”不把所指限定为某件实体乐器。
- source_word: הַשְּׁמִינִית
  choice: “舍米尼特”
  rationale: 这是含义未能确定的音乐术语，字面与“第八”有关，可能指八度、某种调式或八弦乐器。音译可避免正文作出没有把握的具体判断。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 该词指供歌唱或配乐演奏的诗歌；在诗篇题注中译作“诗”简明自然。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 在题注中可表达作者、归属、关联或奉献对象。“大卫的”保留了这种宽泛关系，没有强行限定为“大卫所作”。
theological_decisions:
- issue: 题注 לְדָוִד 所表达的作者身份或关联
  choice: 大卫的诗
  alternative: 大卫所作的诗；为大卫而作的诗
  rationale: 希伯来语本身没有排除作者、归属或关联等不同理解，因此正文采用较宽泛的表达，并在脚注说明。
translation_notes:
  register: 采用现代、简洁而庄重的诗篇题注体。“乐长”保留音乐职分色彩；对意义不确定的技术术语采用音译，并借脚注交代可能含义。
