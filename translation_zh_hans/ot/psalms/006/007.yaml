  yaml_path: translation/ot/psalms/006/007.yaml
  text: My eye has wasted away from grief[a]; it has grown old because of all my enemies.
translation:
  language: zh_hans
  text: 我的眼睛因愁苦而衰残[a]；又因我所有的仇敌而衰老。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的眼睛因烦恼而昏花；又因我所有的敌对者而衰惫。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשְׁשָׁה
  choice: 衰残
  rationale: 该动词表示衰败、耗损或失去功能；与“眼睛”搭配时，“衰残”保留身体逐渐衰弱的意象，又不把含义限定为视力昏花。
- source_word: מִכַּעַס
  choice: 因愁苦
  rationale: כַּעַס 可指愁苦、烦恼、恼怒或受激惹；在个人哀歌中，“愁苦”自然表达导致眼睛衰败的情绪，同时以脚注保留“烦恼”的可能。
- source_word: עֵינִי
  choice: 我的眼睛
  rationale: 原文为单数并带第一人称单数词尾。现代汉语用“眼睛”并不明确区分单复数，既自然，也不必擅自增添双数概念。
- source_word: עָתְקָה
  choice: 衰老
  rationale: 该动词可表示变老、陈旧或耗损。以“衰老”保留原文鲜明而略带张力的拟人化身体意象。
- source_word: בְּכָל
  choice: 因……一切
  rationale: 此处介词可表达处境或原因；结合哀歌语境，译为“因”可自然说明仇敌是这种衰败的缘由。
- source_word: צוֹרְרָי
  choice: 我的仇敌
  rationale: 该词指敌对、逼迫诗人的人；“仇敌”庄重、简洁，符合诗篇哀歌语域。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；保留“眼睛”作主语以及“衰老”的原文意象。两个分句均以“因”呈现原因关系，并以脚注保留关键词及整体表达的其他合理译法。
