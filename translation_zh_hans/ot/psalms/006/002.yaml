  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥/נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/002.yaml
  text: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
translation:
  language: zh_hans
  text: 雅威啊，求你恩待我，因为我软弱无力[a]；雅威啊，求你医治我，因为我的骨头都惊惶不安[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我衰残”或“我萎靡”；原文形容耗损、软弱无力的状态。
    reason: lexical_alternative
  - marker: b
    text: 或译“我的骨头都战栗”“我的骨头都受惊”或“我的骨头都受扰”；“骨头”可表达深入身体乃至内里的痛苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: 求你恩待我
  rationale: 该命令式动词请求雅威施恩、眷顾。“恩待我”既保留恩惠之意，又符合现代汉语祈求语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常用的现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 两处均引出祈求的理由；“因为”清楚保留其因果关系。
- source_word: אֻמְלַל
  choice: 已衰弱
  rationale: 该词描述衰残、萎靡或虚弱的状态。“已衰弱”自然易懂，也保留逐渐耗损的语感；脚注列出可能译法。
- source_word: רְפָאֵנִי
  choice: 求你医治我
  rationale: רפא的直接意义是医治。此处可能兼有身体与全人受苦的含义，但不宜在正文中将范围限定或扩展。
- source_word: נִבְהֲלוּ
  choice: 都惊惶不安
  rationale: בהל表示受惊、惶恐、陷入强烈不安。以“惊惶不安”搭配“骨头”，保留原文鲜明的拟人化身体意象，而不把意义收窄为可见的颤抖。
- source_word: עֲצָמָי
  choice: 我的骨头
  rationale: 直译原文的身体意象；在诗歌中，它可表达深入身体乃至内里的痛苦，相关含义以脚注说明。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文两次直接使用四字神名。正文采用“雅威”音译，以保留其专名性质；“耶和华”是传统汉语形式，但较不贴近通常重构的读音。
- issue: “骨头惊惶”的指向
  choice: 保留身体意象及其开放性
  alternative: 译为“我全身战栗”或“我内心惊惶”
  rationale: 原文明确以“我的骨头”为主语，既可传达剧烈的身体苦楚，也可能涵盖深层的内在惊恐。正文不把它单独归为生理症状或心理状态。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈求语体；以两次“雅威啊，求你……”保存原文的平行结构和迫切语气，并保留“骨头”这一具体而强烈的希伯来诗歌意象。
