  text: I am weary with my groaning[a]; every night I drench my bed[b]; with my tears I soak my couch.
translation:
  language: zh_hans
  text: '我因叹息而疲惫不堪[a]；

    每夜我都把床榻浸透[b]；

    我用泪水湿透卧榻。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我因叹息已经困乏。”
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“我使我的床漂浮”，是形容泪水浸透床榻的诗意夸张。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: 我……疲惫不堪
  rationale: 该动词表示因长期劳苦或重压而困乏、耗尽；译文以现代汉语表达持续痛苦所造成的当前状态。
- source_word: בְּאַנְחָתִי
  choice: 因叹息
  rationale: אַנְחָה可指叹息、呻吟；此处介词ב可表达伴随或原因。结合汉语习惯译作“因叹息”，保留哀歌中身心俱疲的意味。
- source_word: אַשְׂחֶה
  choice: 使……浸透
  rationale: שׂחה的使役形在这里按字面是使床“漂浮”，属于夸张的诗歌意象；正文用“浸透”自然传达泪水泛滥的效果，脚注保留字面意象。
- source_word: בְכָל לַיְלָה
  choice: 每夜
  rationale: 此短语更自然地表示夜夜反复发生，而非仅指某一夜的全部时段。
- source_word: מִטָּתִי
  choice: 我的床榻
  rationale: מִטָּה指供人躺卧的床；“床榻”清楚而具有适度诗体色彩。
- source_word: בְּדִמְעָתִי
  choice: 用泪水
  rationale: 介词ב在此表示手段；“用泪水”准确保留泪水作为湿透卧榻之媒介的意象。
- source_word: עַרְשִׂי
  choice: 我的卧榻
  rationale: עֶרֶשׂ指卧榻、床铺；与前面的מִטָּה采用不同措辞，以保留希伯来诗歌平行句中的词汇变化。
- source_word: אַמְסֶה
  choice: 湿透
  rationale: מסס的使役形本义可指使融化、消解；在泪水语境中形象地表示彻底浸湿。“湿透”自然且保留夸张力度。
