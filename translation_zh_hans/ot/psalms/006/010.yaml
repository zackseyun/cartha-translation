  yaml_path: translation/ot/psalms/006/010.yaml
  text: Let all my enemies be ashamed and greatly terrified[a]; let them turn back and be ashamed in an instant.
translation:
  language: zh_hans
  text: 愿我的仇敌全都蒙羞，极其惊惶[a]；愿他们退去，顷刻蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都受羞辱……退去，忽然受羞辱。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: 愿……蒙羞
  rationale: 该词在诗歌语境中表达愿望或祈求；“蒙羞”既保留羞耻与受辱之意，也不限定羞辱发生的具体方式。
- source_word: וְיִבָּהֲלוּ
  choice: 极其惊惶
  rationale: בהל表示突然而强烈的恐惧、慌乱或惊惶；“惊惶”自然地兼顾恐惧和失措。
- source_word: מְאֹד
  choice: 极其
  rationale: 保留原文强烈的程度修饰，并与“惊惶”搭配自然。
- source_word: כָּל אֹיְבָי
  choice: 我所有的仇敌
  rationale: 准确表达全称范围及第一人称所属关系，符合现代汉语。
- source_word: יָשֻׁבוּ
  choice: 愿他们退去
  rationale: שׁוב可指返回或转身离去；在敌对语境中，“退去”表达其转身撤离，又不过度增添军事色彩。
- source_word: יֵבֹשׁוּ
  choice: 蒙羞
  rationale: 保留同一希伯来词在本节中的重复，体现诗句的强调与首尾呼应。
- source_word: רָגַע
  choice: 顷刻
  rationale: 此处作副词性用法，表示事情突然、迅速发生；“顷刻”简洁而庄重。
