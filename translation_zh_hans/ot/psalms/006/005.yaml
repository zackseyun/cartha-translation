id: PSA.6.5
reference: Psalms 6:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י אֵ֣ין בַּ/מָּ֣וֶת זִכְרֶ֑/ךָ בִּ֝/שְׁא֗וֹל מִ֣י יֽוֹדֶה לָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/005.yaml
  text: For in death there is no remembrance of you[a]; in Sheol who will give thanks to you?
translation:
  language: zh_hans
  text: '因为在死亡中，无人记念你；

    在阴间[a]，谁会称谢你呢？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”也可译作“坟墓”或“死人之地”；希伯来语为“示奥尔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的恳求并说明理由；“因为”自然保留了希伯来语的解释性连接。
- source_word: אֵין
  choice: 无人
  rationale: 将存在否定结合下文的“记念”译为自然的现代汉语，同时不改变诗句所表达的否定。
- source_word: בַּמָּוֶת
  choice: 在死亡中
  rationale: 保留介词结构及其与下半句“在阴间”的地点性平行，也避免将其限缩为“临死时”。
- source_word: זִכְרֶךָ
  choice: 记念你
  rationale: 该词可指记忆、记念或提说；“记念你”既简洁自然，也与下句公开称谢上帝的表达相呼应，同时不把含义限定为单纯的心理记忆。
- source_word: בִּשְׁאוֹל
  choice: 在阴间
  rationale: “阴间”是现代中文中对 שְׁאוֹל 较简洁且可理解的对应语，指死者所在之境；脚注列出其他可能译法，以免将其过度等同于坟墓或后世某一特定教义概念。
- source_word: מִי
  choice: 谁
  rationale: 直接保留反问代词及诗句的修辞力量。
- source_word: יוֹדֶה לָּךְ
  choice: 会称谢你
  rationale: ידה 的使役词干在此表示称谢或赞美；“称谢”准确、庄重，并保留向上帝表达感谢和颂赞的含义。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死人之地；示奥尔
  rationale: 原词指死者所在之境，其范围不宜被直接缩减为一座具体坟墓，也不应被解释成后世某一套完整的来世教义。“阴间”在中文中较为简明，脚注则保留其他词义可能。
- issue: “无人记念你”的范围
  choice: 保留诗歌中关于死亡与敬拜的陈述，不扩展为系统性的死后状态教义
  alternative: 将本句解释为死者完全没有意识，或解释为仅指不能在公共会众中赞美
  rationale: 本节是哀歌中的修辞性恳求，希伯来文本本身没有明确裁定这些进一步的神学解释，因此译文不替原文消除其张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两行保留“在死亡中／在阴间”的平行结构；用“称谢”而非较宽泛的“赞美”，以贴近 ידה לְ 的表达。脚注标记紧随“阴间”，与所解释的词准确对应。
