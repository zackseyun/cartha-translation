  text: ס֣וּרוּ מִ֭מֶּ/נִּי כָּל פֹּ֣עֲלֵי אָ֑וֶן כִּֽי שָׁמַ֥ע יְ֝הוָ֗ה ק֣וֹל בִּכְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/008.yaml
  text: Depart from me[a], all you workers of wickedness[b], for Yahweh has heard the sound of my weeping.
translation:
  language: zh_hans
  text: 所有作恶的人哪[a]，离开我！因为雅威已经听见我哭泣的声音[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作孽的人”或“恶人”。希伯来文为“作／行邪恶（或不义）的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“我的哭声”。
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ מִמֶּנִּי
  choice: 离开我吧
  rationale: סוּרוּ是复数命令式，要求受话者从诗人身边退去；“离开我吧”在现代汉语中自然、有力，并保留מִמֶּנִּי“从我这里”的个人指向。
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: 你们一切作恶的人
  rationale: כָּל涵盖全部受话者；פֹּעֲלֵי אָוֶן直指“行作恶事的人”。译为“作恶的人”既保留行为者的含义，也比“作孽者”等表达更符合现代普通话。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出命令的理由；“因为”清楚表达因果关系。
- source_word: שָׁמַע
  choice: 已经听见
  rationale: 完成式在此表达已发生且对当前具有意义的行动；“已经听见”体现诗人确信祷告蒙垂听后的转折。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见汉语音译处理，保留其作为专名的性质，不以称号替代。
- source_word: קוֹל בִּכְיִי
  choice: 我哭泣的声音
  rationale: קוֹל可指“声音”，בִּכְיִי指“我的哭泣”；该译法保留原文“哭泣之声”的可听意象，同时在现代汉语中通顺。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留专名，并避免用“主”这一称号取代原文神名；“耶和华”是传统汉译形式，但较不贴近通常重构的读音。
- issue: שָׁמַע所表达的确信程度
  choice: 已经听见
  alternative: 听见了；垂听了
  rationale: “已经听见”保留动词“听见”的基本意义及完成式带来的现实确信；不译作“垂听”，以免在正文中把“听到”进一步解释为明确应允。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“你们……都……”明确复数呼语和全称范围；用感叹号传达命令的力度。正文保留“哭泣的声音”这一希伯来诗歌意象，并以脚注提供更紧凑的汉语表达。
