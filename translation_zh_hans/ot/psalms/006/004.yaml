  text: שׁוּבָ֣/ה יְ֭הוָה חַלְּצָ֣/ה נַפְשִׁ֑/י ה֝וֹשִׁיעֵ֗/נִי לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/004.yaml
  text: Return, O LORD; rescue my life; save me for the sake of your steadfast love.
translation:
  language: zh_hans
  text: 耶和华啊，求你回转！搭救我的性命；因着你的慈爱，求你拯救我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּבָה
  choice: 求你回转
  rationale: 该词是“返回、转回”的祈使式；“回转”保留诗人恳求耶和华重新临近、施恩的空间，不擅自补明离开或转怒等语义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现神圣四字名。
- source_word: חַלְּצָה
  choice: 搭救
  rationale: 表达从危难中解救、拔出的动作，与后句“拯救”近义并形成诗歌式递进。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נפש 在这里指处于死亡威胁中的生命或本人，不宜仅按后期身心二分观念译作“灵魂”；“性命”贴合求生语境。
- source_word: הוֹשִׁיעֵנִי
  choice: 求你拯救我
  rationale: 准确表达第一人称受词与祈求语气；补出“求你”使现代汉语自然。
- source_word: לְמַעַן חַסְדֶּךָ
  choice: 因你慈爱
  rationale: למען 表示以某事为缘由或目的；חסד 指神信实、坚定而守约的慈爱。正文用凝练且传统可懂的“慈爱”，不把语义限定为人的功德。
theological_decisions:
- issue: “回转”是否解释为神停止发怒或重新同在
  choice: 保留为“求你回转”
  alternative: 求你息怒／求你回来帮助我
  rationale: 原文没有明说回转所离开的状态或对象；直译保留诗篇祈祷中的神学张力。
- issue: 拯救的依据
  choice: 因你慈爱
  alternative: 为了彰显你坚定不移的爱
  rationale: 原文把拯救诉诸耶和华的חסד，而非诗人的功德；简洁译法既保留依据关系，也避免额外加入“彰显”等未明说的目的。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留三个恳求分句的紧迫节奏；以感叹号标示首句呼求后的力度，以分号呈现平行推进。
