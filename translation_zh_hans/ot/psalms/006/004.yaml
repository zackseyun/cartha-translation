review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了三个祈使性的祈求：求耶和华回转、解救诗人的性命、并基于他的חסד施行拯救。将נפש译为“性命”恰当，避免了不必要的“灵魂”身心二分含义；“回转”也没有擅自说明耶和华从何处回转。惟“因你慈爱”在现代汉语中省略领属标记，虽可理解，却略显文言化且不够明确。
  naturalness: 整体庄重、流畅，适合诗篇祷词。“因着你的慈爱”比“因你慈爱”更符合现代标准汉语，并清楚表达原文“因／为着你的坚定慈爱”的依据关系。
  terminology: “耶和华”“性命”“慈爱”均为合宜且稳定的圣经术语。保留“慈爱”可涵盖חסד所含的信实、守约之爱，而不作过度阐释。
