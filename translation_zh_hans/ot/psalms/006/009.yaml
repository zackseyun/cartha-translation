  text: שָׁמַ֣ע יְ֭הוָה תְּחִנָּתִ֑/י יְ֝הוָ֗ה תְּֽפִלָּתִ֥/י יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/009.yaml
  text: Yahweh has heard my plea[a]; Yahweh will receive my prayer.
translation:
  language: zh_hans
  text: 耶和华听见了我的恳求；耶和华必收纳我的祷告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收纳”直译为“拿、取”，也可译作“接受”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: 听见了
  rationale: 完成式在这里表达诗人确信上帝已经垂听；“听见了”自然保留已完成并与当下相关的语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接呈现四字神名，在现代简体中文圣经语域中清楚、庄重且为普通读者熟悉。
- source_word: תְּחִנָּה
  choice: 恳求
  rationale: 该词指为蒙恩怜悯而发出的迫切请求；“恳求”既通俗又保留情感力度。
- source_word: תְּפִלָּה
  choice: 祷告
  rationale: 这是表示祷告的常用词；与前句的“恳求”区别翻译，保留希伯来诗句的平行变化。
- source_word: לָקַח
  choice: 收纳
  rationale: 该动词本义为“拿、取”，以“祷告”为宾语时表示接纳。未完成式在本语境中表达诗人对将来的确信，因此译作“必收纳”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次直接使用四字神名；译文不以“主”替代，而采用现代中文读者广泛熟悉的专名形式“耶和华”。
- issue: יִקָּח 所表达的确信及其含义
  choice: 必收纳
  alternative: 将拿取
  rationale: 保留未完成式所表达的未来确信，同时按“拿取祷告”的语境义译为“收纳”，不进一步限定为某种礼仪性或宗派性的“悦纳”观念。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“听见了……必收纳”保留原文由已蒙垂听转向未来确信的时态推进；分号呈现两句紧密的平行结构。
