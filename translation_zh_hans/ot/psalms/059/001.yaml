  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י אֱלֹהָ֑/י מִּ/מִתְקוֹמְמַ֥/י תְּשַׂגְּבֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/001.yaml
  text: Deliver me from my enemies[a], my God[b]; set me on high above those who rise up against me.
translation:
  language: zh_hans
  text: 我的上帝啊，求你救我脱离我的仇敌；求你把我安置在高处，脱离那些起来反对我的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把我安置在高处，脱离……”也可译为“保护我脱离……”。原文动词描绘人被置于高而难以接近之处，因此含有保护的意思。
    reason: 词义兼具具体的置高意象和由此引申的保护含义。
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: 求你救我脱离
  rationale: נצל的使役式命令形带第一人称单数词尾，表示把人从危险中解救出来。“救我脱离”既体现恳求语气，也明确表达与仇敌分离。
- source_word: מֵאֹיְבַי
  choice: 脱离仇敌
  rationale: אֹיֵב是“仇敌、敌人”的常用词；介词מִן表示脱离或远离。
- source_word: אֱלֹהָי
  choice: 我的上帝啊
  rationale: 保留第一人称单数所属关系和直接呼告的语气；句末语气词“啊”使现代汉语呼告自然庄重。
- source_word: מִּמִתְקוֹמְמַי
  choice: 远离那些起来攻击我的人
  rationale: 该分词形式指不断或公然起来与诗人作对的人；“起来攻击我”保留了קום“起来”的具体意象，并在上下文中自然表达敌对行动。
- source_word: תְּשַׂגְּבֵנִי
  choice: 求你把我安置在高处
  rationale: שׂגב的加强语态在此表示置于高处、使人难以接近，从而得到保护。译文保留“高处”的具体诗歌意象，不只抽象地译作“保护”。
theological_decisions:
- issue: 对אֱלֹהָי这一神圣称呼的处理
  choice: 我的上帝啊
  alternative: 我的神啊
  rationale: 这里是诗人对上帝的个人呼求，并无需要额外解释的教义限定。“上帝”是现代普通话中自然、庄重且广为理解的称呼，同时完整保留“我的”这一所属关系。
- issue: שׂגב所表达的保护方式
  choice: 把我安置在高处，远离攻击者
  alternative: 保护我不受攻击者伤害
  rationale: 原文用置于高而不可接近之处来表达安全。正文保留这一具体隐喻，同时不把它缩减为纯粹抽象的“保护”。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语体。用两个“求你”呈现希伯来诗句的平行结构；“安置在高处”保留原文的空间隐喻，“远离那些起来攻击我的人”明确其保护效果。
