  text: בְּֽלִי עָ֭וֺן יְרוּצ֣וּ/ן וְ/יִכּוֹנָ֑נוּ ע֖וּרָ/ה לִ/קְרָאתִ֣/י וּ/רְאֵה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/004.yaml
  text: Without guilt[a], they run and set themselves in place; awake to meet me and see.
translation:
  language: zh_hans
  text: 我并无过错，他们却奔跑，摆好阵势[a]；求你醒来，来与我相会，并且察看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摆好阵势”或译“做好准备”，也可理解为“站稳就位”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלִי עָוֺן
  choice: 我并没有罪
  rationale: 该短语表达罪责或过犯的缺失；结合上下文，补出第一人称“我”，自然呈现诗人申明自己并无招致攻击的罪责。
- source_word: יְרוּצוּן
  choice: 他们却奔跑
  rationale: 保留רוץ“跑、奔跑”的鲜明动态意象；“却”显明诗人无罪与敌人行动之间的反差。
- source_word: וְיִכּוֹנָנוּ
  choice: 摆好阵势
  rationale: כון在此可指站稳、就位或做好准备；此译保留敌人就位行动的具体感，但不把其目的说得过细。
- source_word: עוּרָה
  choice: 求你醒来
  rationale: 保留向上帝发出的拟人化命令及哀歌的迫切语气；加“求你”符合现代汉语祈求语体。
- source_word: לִקְרָאתִי
  choice: 迎接我
  rationale: 贴近该介词结构“出来与我相遇”的基本含义，同时不明说是援助还是审察，保留原文张力。
- source_word: וּרְאֵה
  choice: 并且察看
  rationale: ראה基本义为“看”；“察看”在祷告语境中自然表达求上帝留意眼前情形，又不额外指定所察看的对象。
theological_decisions:
- issue: 向上帝发出“醒来”的拟人化祈求
  choice: 保留“求你醒来”
  alternative: 求你起来／求你奋起
  rationale: 原文以醒来的意象呼求上帝采取行动。保留这一意象可维持哀歌的诗性与神学张力，而不暗示上帝真的睡着。
- issue: לִקְרָאתִי所表达的相遇关系
  choice: 迎接我
  alternative: 前来帮助我／前来对付他们
  rationale: 上下文可能暗示上帝前来援助诗人，但希伯来文本本身只明确说“来与我相遇”；因此不在正文中补入援助或对敌的对象。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。“奔跑，摆好阵势”保持短促有力的动作节奏；正文中的[a]与脚注对应，用来保留וְיִכּוֹנָנוּ的词义幅度。
