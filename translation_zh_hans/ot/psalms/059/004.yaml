  rationale: 修订“迎接我”为“来与我相会”，以消除汉语中“欢迎、接待”的非原文含义，并保留希伯来文仅说相会而未明说援助对象的含蓄性。将“没有罪”调整为“并无过错”，更贴近此处无可归责之罪咎的申明；将脚注锚点移至“摆好阵势”后，准确对应词汇备选义。
