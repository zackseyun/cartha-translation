base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/013.yaml
  text: Consume them in wrath[a]; consume them until they are no more, so that they may know that God rules in Jacob to the ends of the earth[b]. Selah
translation:
  language: zh_hans
  text: 求你在烈怒中除灭他们[a]；除灭他们，直到他们不复存在，使他们知道：上帝在雅各掌权；他的权柄直到地极[b]。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你在烈怒中灭尽他们；灭尽他们，他们就不复存在。”希伯来文可以译得更突兀、更贴近字面。
    reason: lexical_alternative
  - marker: b
    text: “在雅各”指上帝与雅各、也就是以色列相关的统治；也有人译作“统治雅各”。原文接着提到“地极”，宣告上帝的统治达至全地最远之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּלֵּה
  choice: 除灭
  rationale: 该词的皮勒命令式表示使之终结、消灭；“除灭”保留祈求的强烈程度，并按原文重复以加强语势。
- source_word: בְחֵמָה
  choice: 在烈怒中
  rationale: חֵמָה指炽烈的愤怒；此译保留介词ב所表达的方式或情态，也符合庄重诗歌语体。
- source_word: וְאֵינֵמוֹ
  choice: 直到他们不复存在
  rationale: 原文直译近于“他们就不在了”；结合前面的重复命令，此处译为结果所达到的终点，同时在脚注中保留更突兀的直译可能。
- source_word: וְיֵדְעוּ
  choice: 使他们知道
  rationale: 连词加未完成式在这一祈求语境中可表达目的或结果；“使他们知道”保留这一关联，也不消解除灭与知道之间的张力。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指以色列诗歌语境中的独一上帝；“上帝”是现代标准普通话中自然、庄重的对应词。
- source_word: מֹשֵׁל
  choice: 掌权
  rationale: 分词表示持续的统治；“掌权”简洁自然，并能表达正在施行的主权。
- source_word: בְּיַעֲקֹב
  choice: 在雅各
  rationale: 保留介词“在”的基本意义，也保留“雅各”作为约民称谓，不在正文中解释为“以色列”或改定为“统治雅各”。
- source_word: לְאַפְסֵי הָאָרֶץ
  choice: 直到地极
  rationale: 这是表示世界最远之处的惯用语；“直到地极”准确、简洁且符合诗体。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切含义不明，因此依照通行做法音译，不作推测性解释。
theological_decisions:
- issue: 针对仇敌的咒诅性祈求
  choice: 直接保留彻底除灭他们的祈求
  alternative: 弱化为限制、挫败或部分惩罚仇敌
  rationale: 原文重复命令式，并说他们将“不复存在”；译文不因现代读者的不适而减轻其严厉程度。
- issue: 被除灭者仍“知道”的张力
  choice: 译作“使他们知道”，不解释这种张力如何实现
  alternative: 将主语泛化为世人，或改成只有旁观者知道
  rationale: 原文动词为第三人称复数，表面上可回指仇敌；译文保留其语法联系及神学张力，不擅自改换主语。
- issue: 上帝在雅各中的统治与地极的关系
  choice: 正文保留“在雅各掌权，直到地极”的紧凑结构
  alternative: 明确改译为“统治雅各”，或将“直到地极”只限定为世人知道的范围
  rationale: 原文同时呈现上帝与雅各的特殊关系及延及地极的普世视野；保留结构上的开放性，避免把修饰关系解释得过死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话诗歌语体。保留命令的重复、咒诅祈求的力度及原文修饰关系的可能歧义；“细拉”按传统音译。
