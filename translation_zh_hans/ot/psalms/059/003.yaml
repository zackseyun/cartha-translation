source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה אָֽרְב֡וּ לְ/נַפְשִׁ֗/י יָג֣וּרוּ עָלַ֣/י עַזִ֑ים לֹא פִשְׁעִ֖/י וְ/לֹא חַטָּאתִ֣/י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/003.yaml
  text: For look, they lie in wait for my life; fierce men gather against me, for no transgression or sin of mine, O LORD.
translation:
  language: zh_hans
  text: 看哪，他们埋伏，要取我的性命；强横的人聚集起来攻击我。耶和华啊，这并不是因我的过犯，也不是因我的罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示注意、加强现场感的语用功能，同时采用庄重而通行的现代汉语表达。
- source_word: אָרְבוּ לְנַפְשִׁי
  choice: 他们埋伏，要取我的性命
  rationale: נפשׁ 在此指人的生命；将目的关系明说，使汉语自然，并保留敌人伺机杀害诗人的含义。
- source_word: יָגוּרוּ עָלַי
  choice: 聚集起来攻击我
  rationale: 该动词在此语境中指结集对付诗人；“攻击我”表达 עָלַי 的敌对方向，而不限定具体攻击方式。
- source_word: עַזִּים
  choice: 强横的人
  rationale: 保留“强有力、凶猛”的负面人物描写；“强横”兼具力量与暴烈色彩。
- source_word: פִשְׁעִי ... חַטָּאתִי
  choice: 我的过犯……我的罪
  rationale: 分别保留 פשע 的悖逆、过犯色彩与 חטאת 的一般罪责含义，不将两词合并。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确呈现希伯来文本中的神名。
theological_decisions:
- issue: 诗人否认罪责的范围
  choice: 这并不是因我的过犯，也不是因我的罪
  alternative: 我没有过犯，也没有罪
  rationale: 希伯来原句可按语境理解为敌人的袭击并非由诗人的过犯或罪所招致；此译法避免将其扩展成诗人绝对无罪的教义声明，同时保留原文简略结构所包含的张力。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。以短句呈现希伯来诗句的推进，并将呼语“耶和华啊”放在申诉句前，使中文语序自然，同时不改变其修辞功能。
