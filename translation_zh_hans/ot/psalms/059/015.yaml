  yaml_path: translation/ot/psalms/059/015.yaml
  text: They wander about for food[a]; if they are not satisfied[b], they spend the night.
translation:
  language: zh_hans
  text: 他们四处游荡，寻找食物；若吃不饱，就整夜逗留。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就低吼。”这里的希伯来语动词既可理解为“过夜、逗留”，也可能理解为“抱怨、低吼”；后者与本诗把敌人比作狗的上下文相呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: 他们
  rationale: 这是第三人称阳性复数独立代词，在此明确承接上文所描写的敌人；现代汉语用“他们”自然表达，毋须额外强化。
- source_word: ינועון
  choice: 四处游荡
  rationale: נוּעַ表示来回移动或飘荡；结合觅食的语境，“四处游荡”传达不安定地到处寻找，而不误解为因醉酒而摇晃。
- source_word: לֶאֱכֹל
  choice: 寻找食物
  rationale: אָכַל的不定式加לְ直译为“为了吃”；在本句中译作“寻找食物”，自然表达游荡的目的，并保留饥饿、觅食的图景。
- source_word: אִם לֹא יִשְׂבְּעוּ
  choice: 若吃不饱
  rationale: אִם לֹא构成否定条件，שׂבע在饮食语境中指吃饱、得到满足；“若吃不饱”简洁而具体。
- source_word: וַיָּלִינוּ
  choice: 就整夜逗留
  rationale: 按לוּן／לִין“住宿、过夜”理解，表示他们没有吃饱便留到夜间；“整夜逗留”比生硬的“住宿”更符合敌人如野狗徘徊的诗歌场景。该形式也可能按另一同形词理解为“抱怨／低吼”，故以脚注保留歧义。
