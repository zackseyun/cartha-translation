  text: אֱלֹהֵ֣י חסד/ו יְקַדְּמֵ֑/נִי אֱ֝לֹהִ֗ים יַרְאֵ֥/נִי בְ/שֹׁרְרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/010.yaml
  text: The God of his steadfast love will go before me[b][a]; God will let me look on my enemies.
translation:
  language: zh_hans
  text: 他信实之爱的上帝[b][a]必走在我前面；上帝必让我看见我的仇敌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另按一种元音标注或翻译传统，可译作：“我的上帝必以他信实的爱走在我前面”，或“有信实之爱的我的上帝必走在我前面。”
    reason: alternative_reading
  - marker: b
    text: “信实的爱”所译的希伯来词是 חֶסֶד，常指忠贞、坚定的爱，也可有怜悯或守约施慈爱的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: ……的上帝
  rationale: 这是“上帝”的构造形式，与后面的“他的慈爱”相连。中文主文用“彰显……的上帝”自然表达这一关系，同时在脚注中保留更贴近字面的译法及另一种读法。
- source_word: חסדו
  choice: 他信实的爱
  rationale: חֶסֶד可指坚定、忠诚、守信的爱，也可包含怜悯之意。“信实的爱”兼顾忠贞与慈爱；阳性单数第三人称后缀译为“他”。
- source_word: יְקַדְּמֵנִי
  choice: 必走在我前面
  rationale: קדם的这个词形可表示迎面而来、先到或走在前面；上下文期待上帝预先相助，因此译作“走在我前面”，同时不排除“迎接我”的空间意味。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 原文再次明确说“上帝”，译文保留重复，不改用代词。
- source_word: יַרְאֵנִי
  choice: 必让我看见
  rationale: ראה的使役词形表示“使我看见”或“让我看见”。这里不在主文中补入“胜过”或“遭报”，以免把语境可能暗含的结果说得过于明确。
- source_word: בְשֹׁרְרָי
  choice: 我的仇敌
  rationale: 该词指敌对者或仇敌；“我的仇敌”是清楚、自然的现代汉语表达。介词ב与“看见”连用时不宜机械直译。
theological_decisions:
- issue: חסדו中的人称后缀及短语אֱלֹהֵי חסדו的理解
  choice: 按所给马所拉文本译出第三人称“他”，主文作“彰显他信实之爱的上帝”
  alternative: 按另一种元音标注或翻译传统理解为“我的上帝以他信实的爱走在我前面”或“有信实之爱的我的上帝走在我前面”
  rationale: 所给WLC文本的后缀是阳性单数第三人称，但整个短语较为少见。主文优先依据该文本，脚注则保留流传较广的重要异读，不据某一神学立场消除张力。
- issue: 看见仇敌是否明确表示看见其败亡
  choice: 只译“让我看见我的仇敌”
  alternative: “让我看见我的仇敌遭报”
  rationale: 上下文可能暗含诗人得以目睹仇敌受挫，但原句没有明说“遭报”；主文保留含蓄表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彰显他信实之爱的上帝”避免生硬的“他慈爱之上帝”，但不把חֶסֶד过度限定为专门的教义术语。分号保留原句两个平行分句；脚注标记依照所给英文审校层的次序置于相关短语之后。
