  text: 'For the choir director: “Do Not Destroy.” Of David[a]. A miktam, when Saul sent men[d][c][b], and they watched the house to kill him.'
translation:
  language: zh_hans
  text: 交给乐长；用《不要毁灭》的曲调[a]。大卫的[b]。米克坦[c]。当扫罗派人监视那房子、要杀死他的时候[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《不要毁灭》很可能是曲调名或音乐标记。
    reason: cultural_note
  - marker: b
    text: “大卫的”也可理解为“大卫作的”“属于大卫的”或“献给大卫的”；原文没有进一步说明。
    reason: lexical_alternative
  - marker: c
    text: “米克坦”是音译；这个希伯来术语的确切含义不明。
    reason: lexical_alternative
  - marker: d
    text: 原文较直译为：“当扫罗派遣，而他们监视那房子、要杀死他的时候。”原文没有明说“人”，但“他们”所对应的复数动词表明扫罗派出了多人。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 这是诗篇标题中的固定用语，指交给负责音乐或诗班的人；“乐长”简洁、庄重，也不把其职责限定得过细。
- source_word: אַל תַּשְׁחֵת
  choice: 《不要毁灭》
  rationale: 此处很可能是曲调名或音乐标记，故用书名号表明它不是诗篇正文中的命令。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 标题中的介词 לְ 可表示作者、归属、关联或献给；“大卫的”保留一定幅度，不明确限定为“大卫所作”。
- source_word: מִכְתָּם
  choice: 米克坦
  rationale: 该术语的确切含义不明，采用音译比译作“金诗”“铭刻诗”等推测性名称更透明。
- source_word: בִּשְׁלֹחַ שָׁאוּל
  choice: 扫罗派人来……的时候
  rationale: בְּ 加不定式构成时间从句。“人”在希伯来文中没有明说，但后面的复数动词显示扫罗派出了不止一个行动者；汉语补出“人”可使句意自然。
- source_word: וַיִּשְׁמְרוּ
  choice: 他们监视
  rationale: שׁמר 在敌对目的语境中指盯守、监视，而非保护性的看守。
- source_word: אֶת הַבַּיִת
  choice: 那房子
  rationale: 原文直译为“那房子”，没有明说是“大卫的房子”；指示性译法自然地承接叙事情境而不补入所有关系。
- source_word: לַהֲמִיתוֹ
  choice: 要杀死他
  rationale: 目的不定式带第三人称阳性单数后缀，直译为“为了杀死他”；“要杀死他”符合现代汉语标题体。
theological_decisions:
- issue: 标题中 לְדָוִד 所表达的关系
  choice: 译作“大卫的”，不明确断定作者身份
  alternative: 大卫作的；献给大卫
  rationale: 希伯来文形式本身可涵盖作者、归属、关联或献呈等关系，译文不应把这种标题性的含混化为单一结论。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇标题体。各标题成分用短句分隔，以反映原文并列结构；不把不确定的音乐术语或大卫与诗篇的关系解释得过于确定。
