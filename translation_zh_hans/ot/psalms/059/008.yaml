  text: וְ/אַתָּ֣ה יְ֭הוָה תִּשְׂחַק לָ֑/מוֹ תִּ֝לְעַ֗ג לְ/כָל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/008.yaml
  text: But you[a], O Yahweh, laugh at them; you mock all the nations.
translation:
  language: zh_hans
  text: 但你，雅威啊，嗤笑他们；你嘲弄所有列国。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 但你
  rationale: 连词与独立代词连用，在诗歌语势中形成鲜明转折；“但你”自然传达这种对比。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名形式音译四字神名，不以“主”这一称号替代。
- source_word: תִּשְׂחַק לָ/מוֹ
  choice: 必嗤笑他们
  rationale: 动词本义是“笑”，介词短语指出笑所针对的对象；“嗤笑他们”既保留具体意象，也符合自然汉语。未完成式在此处按诗歌中的确定陈述译作“必”。
- source_word: תִּלְעַג
  choice: 必嘲弄
  rationale: 该词表达嘲笑、讥诮；“嘲弄”现代、清楚，并与前句构成同义平行。
- source_word: לְ/כָל גּוֹיִם
  choice: 万国
  rationale: גּוֹיִם在此泛指列国；“万国”简洁庄重，并表达“所有国家、民族”的总体范围。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名。正文保留专名而不以称号“主”代替；采用现代中文圣经读者最熟悉的“耶和华”，同时不借此裁定古代发音的全部细节。
- issue: 神对敌对者的嗤笑与嘲弄
  choice: 按原文直译为“嗤笑”“嘲弄”
  alternative: 意译为“藐视”或“使他们失败”
  rationale: 保留诗歌鲜明的拟人化和审判语气，不将其弱化为抽象态度，也不额外解释为具体行动。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；保留第二人称强调和两行同义平行结构。“耶和华啊”传达直接呼告；两个“必”使未完成式在此处的确定性与诗歌节奏更清楚。
