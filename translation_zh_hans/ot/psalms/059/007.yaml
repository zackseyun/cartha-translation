base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/007.yaml
  text: Look[a], they pour out from their mouths; swords are on their lips, for they say[b], “Who hears?”
translation:
  language: zh_hans
  text: 看哪[a]，他们口中话语如泉涌出；他们唇上有刀剑，因为他们说：“有谁听见呢？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看，他们口中不断喷涌。”希伯来文动词描绘像泉水冒出、涌流一样的话语。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文只说：“有谁听见？”没有说明所听见的对象，使这句傲慢的反问保持开放。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意的指示语。“看哪”既保留其突出的呼唤作用，也符合庄重而清楚的现代汉语经文语体。
- source_word: יַבִּיעוּן
  choice: 滔滔涌出
  rationale: 该动词使役式带有泉水冒出、喷涌而出的形象，用于言语时强调不断且强烈地倾吐。“滔滔涌出”保留这一动态图景，又不擅自补明原文未出现的宾语。
- source_word: בְּפִיהֶם
  choice: 他们口中
  rationale: 介词短语可表达言语由口中涌出；中文采用“口中”自然地呈现来源，同时与下句“唇上”构成诗歌平行。
- source_word: חֲרָבוֹת
  choice: 刀剑
  rationale: 原词通常指剑。这里比喻伤人、暴烈的言语；译文保留具体比喻，不直接释作“恶言”或“毁灭”。
- source_word: בְּשִׂפְתוֹתֵיהֶם
  choice: 就在他们唇上
  rationale: “在唇上”保留原文位置意象；“就”突出那些言语如刀剑般随时出口的力度。
- source_word: כִּי
  choice: 因为他们说
  rationale: כִּי 引出后面的理由或所说内容。希伯来文没有明写“他们说”，但汉语为清楚标示直接引语而补出，未改变问句内容。
- source_word: מִי שֹׁמֵעַ
  choice: 有谁听见呢？
  rationale: 分词表达正在听或能听见的人。“有谁听见呢？”保留反问的简短和傲慢语气，也不补入原文未说明的受词。
theological_decisions:
- issue: 反问句中“听见”的对象未明说
  choice: 有谁听见呢？
  alternative: 有谁听见我们呢？／有谁听见这些话呢？／上帝岂会听见？
  rationale: 希伯来文只说“谁听见”，没有交代听见谁或什么。保留这一省略，让恶人自以为无人听见、甚至暗含上帝不察听的张力继续存在，而不把某一解释写进正文。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“滔滔涌出”保留原文言语如水喷涌的诗性意象；分号呈现两行之间的平行关系。“刀剑就在他们唇上”保留暴烈言语的隐喻，不将其解释性改写。脚注标记均已置于正文相应位置。
