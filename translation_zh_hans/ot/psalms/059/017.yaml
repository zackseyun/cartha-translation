  text: עֻ֭זִּ/י אֵלֶ֣י/ךָ אֲזַמֵּ֑רָה כִּֽי אֱלֹהִ֥ים מִ֝שְׂגַּבִּ֗/י אֱלֹהֵ֥י חַסְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/017.yaml
  text: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
translation:
  language: zh_hans
  text: '我的力量啊，我要向你歌颂，


    因为上帝是我的高垒，


    是我慈爱之上帝[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我慈爱之上帝”。这是一种凝练的属格表达，也可理解为“向我施慈爱的上帝”或“我所倚靠之慈爱的上帝”。
    reason: 说明原文凝练的属格结构及其主要可能理解，避免正文将其限定为单一解释。
lexical_decisions:
- source_word: עֻזִּי
  choice: 我的力量啊
  rationale: עֹז表示“力量、能力”；此处带第一人称单数后缀，并在诗句中直接称呼上帝。用“啊”自然地显明呼格语气。
- source_word: אֵלֶיךָ אֲזַמֵּרָה
  choice: 我要向你歌颂
  rationale: אֶל表示朝向，זמר的Piel形式在诗篇中通常指以歌唱或音乐赞美。译为“向你歌颂”兼顾方向性和敬拜语境。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出歌颂上帝的理由；“因为”清楚保留因果关系，也符合现代汉语。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该词形式上为复数，但本节所指为以色列的上帝，语义为单数。两次出现均译出，以保留诗句的重复结构。
- source_word: מִשְׂגַּבִּי
  choice: 我的高垒
  rationale: מִשְׂגָּב指高处的坚固防御之地。“高垒”既保留其高峻意象，也表达安全保障，较笼统的“避难所”更贴近原词。
- source_word: אֱלֹהֵי חַסְדִּי
  choice: 我慈爱的上帝
  rationale: 原文是高度凝练的属格结构，近于“我慈爱之神”。“我慈爱的上帝”在现代汉语中仍保留一定诗意和关系上的含混，不完全限定为上帝所施的慈爱或上帝作为慈爱的源头；脚注列明主要理解。
theological_decisions:
- issue: חַסְדִּי与上帝之间的关系
  choice: 以“我慈爱的上帝”保留凝练的属格表达
  alternative: “向我施慈爱的上帝”或“我的仁慈上帝”
  rationale: חֶסֶד可指忠贞不渝的爱、恩慈或信实；第一人称后缀与“上帝”构成的关系可以理解为上帝向诗人所施的慈爱，也可描述上帝是这慈爱的源头或体现。正文不把这种神学张力限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言，并按希伯来诗行分行。“高垒”保留原文的高处防御意象；“我慈爱的上帝”刻意维持原文的诗意凝练与语义张力。脚注标记置于其实际说明的短语之后。
