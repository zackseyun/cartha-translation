  text: וַ/אֲנִ֤י אָשִׁ֣יר עֻזֶּ/ךָ֮ וַ/אֲרַנֵּ֥ן לַ/בֹּ֗קֶר חַ֫סְדֶּ֥/ךָ כִּֽי הָיִ֣יתָ מִשְׂגָּ֣ב לִ֑/י וּ֝/מָנ֗וֹס בְּ/י֣וֹם צַר לִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/016.yaml
  text: But I will sing of your strength[a]; I will sing aloud of your steadfast love in the morning, for you have been a stronghold for me[c][b], and a refuge in the day of my distress.
translation:
  language: zh_hans
  text: 但我要歌颂你的力量；清晨，我要因你不变的慈爱欢呼[a]，因为你一直是我的高垒，是我遭难之日的避难所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢呼”也可译作“欢唱”；原词可指喜乐地高声呼喊，也可指高声歌唱。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 但我要
  rationale: 独立代词与连接词在上下文中构成对比；“但我”自然显出诗人与前述仇敌的反差。
- source_word: אָשִׁיר עֻזֶּךָ
  choice: 歌颂你的力量
  rationale: אָשִׁיר表示歌唱，עֹז指力量、能力；“歌颂你的力量”在现代汉语中自然，并保留其赞美对象。
- source_word: וַאֲרַנֵּן
  choice: 我要……欢呼
  rationale: רנן可指喜乐地高声呼喊或欢唱；“欢呼”保留强烈、喜悦的发声意味，不把词义限定为普通歌唱。
- source_word: לַבֹּקֶר
  choice: 清晨
  rationale: 作时间状语，并与本诗前文的夜间情景形成呼应。
- source_word: חַסְדֶּךָ
  choice: 你坚贞的慈爱
  rationale: חֶסֶד兼有慈爱、忠诚和持久可靠之意；“坚贞的慈爱”力求保留这些层面，而不把它直接限定为某一神学术语。
- source_word: כִּי הָיִיתָ
  choice: 因为你一直是
  rationale: כִּי引出赞美的原因；完成式הָיִיתָ指向已经证实并对当下仍有意义的事实，“一直是”在汉语中传达其持续关联。
- source_word: מִשְׂגָּב לִי
  choice: 我的高垒
  rationale: מִשְׂגָּב本指高处的安全堡垒；“高垒”保留高而坚固、可供保护的意象。
- source_word: וּמָנוֹס
  choice: 避难所
  rationale: מָנוֹס指逃往以求安全之处；“避难所”简明自然，并与“高垒”保持意象差别。
- source_word: בְּיוֹם צַר לִי
  choice: 我遭难之日
  rationale: 直译意象为“在困厄临到我的日子”；“我遭难之日”既保留“日”的诗歌表达，也清楚体现个人困境。
theological_decisions:
- issue: 诗篇中חֶסֶד的译法
  choice: 你坚贞的慈爱
  alternative: 你的慈爱／你信实的爱／你的盟约之爱
  rationale: 该词在神施行拯救的语境中兼具仁爱、忠诚和持久可靠的意味。“坚贞的慈爱”避免只表达怜悯，也不把原文未明说的“盟约”直接加入正文。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“高垒”保留原文安全高处的具体意象；整体句法顺畅，同时保存“清晨”和“遭难之日”的时间意象。
