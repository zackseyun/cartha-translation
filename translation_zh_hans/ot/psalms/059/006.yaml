  yaml_path: translation/ot/psalms/059/006.yaml
  text: They return at evening[c][b][a]; they growl like dogs and go around the city.
translation:
  language: zh_hans
  text: 他们傍晚回来，像狗一样吼叫，在城里徘徊。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吼叫”也可译“咆哮”或“嚎叫”；“在城里徘徊”也可译“绕着城转来转去”。
    reason: 保留 יֶהֱמוּ 所指强烈兽类声响，以及 וִיסוֹבְבוּ 所指环绕、来回走动的词义空间。
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: 他们……回来
  rationale: שוב 的 Qal 未完成式第三人称阳性复数，基本义为“返回、回来”；这里描述敌人夜间再次出现。
- source_word: לָעֶרֶב
  choice: 晚上
  rationale: לְ 与“傍晚、晚上”连用，表示时间；现代汉语用“晚上”自然简洁。
- source_word: יֶהֱמוּ
  choice: 吼叫
  rationale: המה 可指发出响亮、喧闹或兽类般的声音；与狗的比喻相连时，“吼叫”既保留声音强烈的特征，也不过度限定为“狂吠”或“嗥叫”。
- source_word: כַכָּלֶב
  choice: 像狗一样
  rationale: 希伯来文用单数“狗”作类比，可按类别理解；汉语“像狗一样”自然保留其单数形式和形象。
- source_word: וִיסוֹבְבוּ
  choice: 在……四处游荡
  rationale: סבב 的基本义是“环绕、四处走动”；此处语境带有夜间徘徊觅食的色彩，“四处游荡”自然表达这一行动，同时不译成更强的“包围”。
- source_word: עִיר
  choice: 城中
  rationale: 虽无定冠词，语境指向诗人所在的特定城；“在城中”符合汉语诗句的自然表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。主句保持紧凑，以三个连续动作再现敌人夜间归来、发声和巡行的画面；不额外加入“潜行”“搜寻”等原文未明说的目的。
