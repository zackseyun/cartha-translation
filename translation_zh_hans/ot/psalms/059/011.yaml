  text: אַל תַּהַרְגֵ֤/ם פֶּֽן יִשְׁכְּח֬וּ עַמִּ֗/י הֲנִיעֵ֣/מוֹ בְ֭/חֵילְ/ךָ וְ/הוֹרִידֵ֑/מוֹ מָֽגִנֵּ֣/נוּ אֲדֹנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/011.yaml
  text: Do not kill them[a], lest my people forget; make them wander by your power and bring them down[b], O Lord our shield.
translation:
  language: zh_hans
  text: 不要杀死他们，免得我的百姓忘记；求你凭你的大能使他们漂泊[a]，把他们降卑。主啊，我们的盾牌！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们漂泊”或译“使他们摇动”或“使他们站立不稳”；希伯来语动词可表示使其不断移动或陷入不稳定。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּהַרְגֵמוֹ
  choice: 不要杀死他们
  rationale: 否定词 אַל 与未完成式连用，表达禁止；הרג 是普通的“杀死”，直译清楚自然。
- source_word: פֶּן יִשְׁכְּחוּ עַמִּי
  choice: 免得我的百姓忘记
  rationale: פֶּן 引出所担忧的结果；“免得”简洁保留了否定目的或结果的语气。
- source_word: הֲנִיעֵמוֹ
  choice: 使他们漂泊
  rationale: 使役形式可指使之移动、摇动或动荡不安；在不立即杀死而施行持续审判的语境中，“使他们漂泊”自然地表达无定与不安，同时以脚注保留其他可能。
- source_word: בְחֵילְךָ
  choice: 以你的能力
  rationale: חַיִל 可表示力量、能力或军力；此处带第二人称所有格并以工具性的 בְּ 引入，理解为上帝的能力最合语境。
- source_word: וְהוֹרִידֵמוֹ
  choice: 使他们降卑
  rationale: ירד 的使役式直义为“使下降”；“使他们降卑”保留由高处被降下的意象，又符合诗篇中审判与羞辱的语境。
- source_word: מָגִנֵּנוּ
  choice: 我们的盾牌
  rationale: 保留诗篇中称上帝为“盾牌”的具体隐喻，不将其抽象化为“保护者”。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是用于直接呼告的神圣称号，并非四字神名；“主啊”自然表达呼格。
theological_decisions:
- issue: 所求审判的性质
  choice: 诗人求上帝不要立即杀死仇敌，而要使他们经历可见且延续的动荡与降卑，使百姓不致忘记。
  alternative: 也可较宽泛地理解为求上帝使他们摇动、站立不稳并将他们打倒，而不特指漂泊。
  rationale: “不要杀死……使他们漂泊……使他们降卑”的次序形成即时死亡与持续受审之间的张力；正文保留这一张力，脚注则呈现动词的词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号保留祈求结构的推进；结尾将“主啊，我们的盾牌”处理为呼告与同位称谓，并用感叹号体现诗歌祷告语气。
