  text: חַטַּאת פִּ֗י/מוֹ דְּֽבַר שְׂפָ֫תֵ֥י/מוֹ וְ/יִלָּכְד֥וּ בִ/גְאוֹנָ֑/ם וּ/מֵ/אָלָ֖ה וּ/מִ/כַּ֣חַשׁ יְסַפֵּֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/012.yaml
  text: The sin of their mouth is the word of their lips[a]; let them be caught in their pride[b], because of the curse and the lie that they tell.
translation:
  language: zh_hans
  text: 他们口中的罪，就是他们嘴唇所出的话[a]；愿他们在自己的骄傲中被捉住[b]，因为他们所说的咒诅和谎言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他们因口中的罪、嘴唇所出的话，陷在自己的骄傲中；也因他们所说的咒诅和虚谎而被捉住。”
    reason: 原文的诗句断分和句法关系可有不同理解；“口中的罪、嘴唇的话”也可能与后面的“被捉住”相连。
  - marker: b
    text: “在自己的骄傲中”也可译作“因自己的骄傲”。
    reason: 介词 ב 可表示所处的范围，也可表达手段或原因。
lexical_decisions:
- source_word: חַטַּאת
  choice: 罪
  rationale: 此处指由言语表现出来的道德过犯，并非礼仪意义上的“赎罪祭”。
- source_word: פִּימוֹ
  choice: 他们口中
  rationale: 单数名词带第三人称复数后缀，具有集合意义；译为“他们口中”既自然，也保留口与嘴唇的平行意象。
- source_word: דְּבַר שְׂפָתֵימוֹ
  choice: 他们嘴唇所出的话
  rationale: 保留“嘴唇”的身体意象，同时用现代汉语自然表达希伯来语“嘴唇之言”的领属结构。
- source_word: וְיִלָּכְדוּ
  choice: 愿他们……被捉住
  rationale: 尼法勒未完成式在祈愿语境中具有祈使色彩；被动译法保留原文语态。
- source_word: בִגְאוֹנָם
  choice: 在自己的骄傲中
  rationale: 保留介词 ב 的范围或处境含义，并以“骄傲”表达 גָּאוֹן 在此处的傲慢、自高之意。
- source_word: מֵאָלָה
  choice: 因为……咒诅
  rationale: 介词 מִן 可在此表示原因；אָלָה 指咒诅或咒骂之言。
- source_word: מִכַּחַשׁ
  choice: 谎言
  rationale: כַּחַשׁ 可指虚假、欺骗；与“咒诅”并列时，“谎言”简洁而自然。
- source_word: יְסַפֵּרוּ
  choice: 他们所说的
  rationale: ספר 基本义为讲述、述说；此处概括他们不断说出的咒诅和虚假话语。
theological_decisions:
- issue: 诗人的祈愿性审判语言
  choice: 保留“愿他们……被捉住”
  alternative: 把它改写为对结果的陈述
  rationale: 原文是在祷告中发出的祈愿，而非单纯预言；直译可保留诗篇中的神学张力。
- issue: 前半句与“愿他们被捉住”的句法关系
  choice: 主文把前半句读作独立的名词句
  alternative: 将“他们口中的罪、嘴唇的话”一并读作他们被捉住的原因
  rationale: 希伯来诗行可容许两种断句；主文采用与马所拉重音及直接表层结构相符的读法，并以脚注保存另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；保留“口”“嘴唇”的平行意象和“被捉住”的被动祈愿。主文不强行消除希伯来语句法上的含混，相关替代读法列入脚注。
