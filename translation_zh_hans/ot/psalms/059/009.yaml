  text: עֻ֭זּ/וֹ אֵלֶ֣י/ךָ אֶשְׁמֹ֑רָה כִּֽי אֱ֝לֹהִ֗ים מִשְׂגַּבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/009.yaml
  text: O my strength[a], I will watch for you[c][b], for God is my stronghold.
translation:
  language: zh_hans
  text: 他的力量[a]——我要向着你守望[b]，因为神是我的高垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按常见的传统理解译作：“我的力量啊，我要向你守望。”也有人把后面的动词读作“歌颂”。
    reason: alternative_reading
  - marker: b
    text: 此处“守望”也可按语境理解为“等候”或“仰望”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזּוֹ
  choice: 他的力量
  rationale: 按所给WLC元音标注，该词带第三人称阳性单数后缀，直译为“他的力量”。虽然诗句开头突兀，但正文保留马所拉文本的形式，不擅自改作呼格“我的力量啊”。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词אֶל加第二人称阳性单数后缀，基本方向义为“向你、朝向你”；“向你”既保留方向感，也表明诗人转向神。
- source_word: אֶשְׁמֹרָה
  choice: 守望
  rationale: 源自动词שׁמר，基本义包括看守、留意、守望。这里用“守望”保留其警醒注视的诗歌意象；在语境中也可能含有“等候、仰望”的意思，列入脚注。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出诗人守望神的理由；“因为”在现代汉语中清楚自然。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 该复数形式在这里具有单数意义，指以色列的神；译作“神”符合上下文。
- source_word: מִשְׂגַּבִּי
  choice: 我的高垒
  rationale: מִשְׂגָּב指高处而坚固的避难、防守之地。“高垒”兼顾其高耸和安全保障的意象，比泛化的“避难所”更贴近原词。
theological_decisions:
- issue: 开头עֻזּוֹ应按第三人称“他的力量”理解，还是按传统释读作呼格“我的力量啊”
  choice: 正文采用“他的力量”
  alternative: “我的力量啊”或“我的力量”
  rationale: 所给WLC文本明确标为第三人称阳性单数后缀，因此正文首先忠于该文本。由于此读法句法突兀，而传统上常结合上下文和古代译本作呼格理解，脚注保留这一重要异读，不消除原文的张力。
- issue: אֶשְׁמֹרָה在此表示实际守望，还是带有期待神的“等候、仰望”之意
  choice: 正文译作“守望”
  alternative: “等候你”或“仰望你”
  rationale: “守望”较直接保留שׁמר的词义和警醒意象，同时让脚注说明语境中可能有期待、等候神的含义，避免将多义性过早收窄。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“他的力量——”刻意保留希伯来文本突兀、悬置的开头，以破折号呈现诗句的转折或话题停顿；“向你守望”略带诗性，但仍可理解，并由脚注补充更自然的语境义。
