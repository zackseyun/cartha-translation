  yaml_path: translation/ot/psalms/059/014.yaml
  text: They return at evening[c][b][a]; they growl like dogs and prowl around the city.
translation:
  language: zh_hans
  text: 他们傍晚回来，像狗一样吼叫[a]，绕城游荡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“嚎叫。”这里的希伯来文动词可指喧嚷、轰鸣或兽类发出的响声。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשׁוּבוּ
  choice: 他们……回来
  rationale: שׁוב的基本义是“返回、回来”；这里保留敌人傍晚再次出现的反复行动，不增添其动机。
- source_word: לָעֶרֶב
  choice: 傍晚
  rationale: עֶרֶב指傍晚、日暮时分；“傍晚”简洁自然，准确交代行动发生的时间。
- source_word: יֶהֱמוּ
  choice: 吼叫
  rationale: המה可表示喧嚷、轰鸣或兽类发出的响声。结合紧随其后的狗之比喻，“吼叫”既保留声音强烈而不安的特点，也不把词义过窄地限定为“吠”。
- source_word: כַכָּלֶב
  choice: 像狗一样
  rationale: 希伯来文用单数“狗”作代表性比喻；现代汉语中，即使主语为复数，“像狗一样”也自然，并可保留原文形式。
- source_word: וִיסוֹבְבוּ עִיר
  choice: 绕城游荡
  rationale: סבב表示环绕、四处转行；“绕城游荡”保留绕行的动作，也传达这些敌人如野狗般徘徊搜寻的语境意象，而没有明确限定是在城内还是城周。
theological_decisions:
- issue: וְיָשׁוּבוּ、יֶהֱמוּ、וִיסוֹבְבוּ的语气可理解为陈述，也可能带有祈使或任凭之意
  choice: 正文按陈述语气译为“他们……回来……吼叫……游荡”
  alternative: “任凭他们傍晚回来……吼叫……游荡”
  rationale: 这些未完成式在形态上容许语气歧义。与本诗前面相同夜间景象的描述相呼应时，陈述语气较顺；但上下文也可能承接前面的祈求而带任凭之意，因此以脚注保留另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“傍晚回来”简洁呈现反复的夜间行动；“像狗一样吼叫，绕城游荡”保留诗句连续而鲜明的兽群意象。
