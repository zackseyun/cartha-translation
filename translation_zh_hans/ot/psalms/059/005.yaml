source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָֽה אֱלֹהִ֥ים צְבָא֡וֹת אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל הָקִ֗יצָ/ה לִ/פְקֹ֥ד כָּֽל הַ/גּוֹיִ֑ם אַל תָּחֹ֨ן כָּל בֹּ֖גְדֵי אָ֣וֶן סֶֽלָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/005.yaml
  text: But you[a], O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers[c][b]. Selah
translation:
  language: zh_hans
  text: 但你——耶和华，万军之上帝、以色列的上帝啊——求你醒来，惩罚万国[a]！不要向任何背信作恶的人施恩[b]！细拉[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惩罚”也可译作“察看”“追究”或“临到”。原文动词可指探访、察看、处置或惩罚；在这里的审判语境中，含有追究问责之意。
    reason: lexical_alternative
  - marker: b
    text: “施恩”也可译作“恩待”或“怜悯”；原文直译为“显出恩惠”。
    reason: lexical_alternative
  - marker: c
    text: “细拉”可能是音乐或礼仪用语，确切含义不明。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，明确对应四字神名，不以普通称号取代。
- source_word: אֱלֹהִים צְבָאוֹת
  choice: 万军之上帝
  rationale: 保留“军队、众军”所含的军事及宇宙性范围；“万军之上帝”庄重且为中文读者所熟悉。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文附属结构，保留其圣约群体称号。
- source_word: הָקִיצָה
  choice: 醒来
  rationale: 保留诗歌中呼求上帝醒起行动的拟人隐喻，不改写成较抽象的“采取行动”。
- source_word: לִפְקֹד
  choice: 察问
  rationale: פקד语义广，可指临到、察看、处置或惩罚；此处审判语境明显，但“察问”既传达追究问责，也避免把该词的宽广语义完全收窄为刑罚。
- source_word: כָּל הַגּוֹיִם
  choice: 万国
  rationale: 表达所有列国的整体范围，且不导入后期“外邦人”一词可能带来的族群或神学限定。
- source_word: אַל תָּחֹן
  choice: 不要……施恩
  rationale: חנן的核心含义是施恩、恩待；此译比“不要怜悯”更贴近词义，同时保持咒诅诗的张力。
- source_word: בֹּגְדֵי אָוֶן
  choice: 行恶背信的人
  rationale: 同时保留בגד的背信、诡诈意味和און的邪恶、不义意味，中文表达自然。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切功能不明，依中文传统音译保留，不在正文中武断解释。
theological_decisions:
- issue: 咒诅语境中כָּל הַגּוֹיִם的范围
  choice: 万国
  alternative: 所有外邦人
  rationale: 原文可泛指列国；“万国”保留政治共同体及普遍范围，不把诗中的审判呼求转化为后期犹太人与外邦人的神学对立。
- issue: פקד在神圣审判语境中的力度
  choice: 察问
  alternative: 惩罚
  rationale: 上下文支持追究和审判，但该动词本身也可指临到、察看或处置；正文用“察问”保留语义幅度，脚注说明在此可理解为追究、惩罚。
- issue: 对背信作恶者的否定祈求
  choice: 不要……施恩
  alternative: 不要怜悯
  rationale: 直译保留诗人向上帝发出的强烈祈求及其神学张力，不在译文中缓和或重新解释。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体中文。以破折号划出连续的神圣称号，以两个祈使句保存原文呼求的力度；用“上帝”对应אֱלֹהִים，用“耶和华”对应神名。所有脚注标记均置于相关正文之后。
