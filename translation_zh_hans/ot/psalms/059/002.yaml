  text: הַ֭צִּילֵ/נִי מִ/פֹּ֣עֲלֵי אָ֑וֶן וּֽ/מֵ/אַנְשֵׁ֥י דָ֝מִ֗ים הוֹשִׁיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/002.yaml
  text: Deliver me from workers of wickedness[b][a], and save me from men of blood.
translation:
  language: zh_hans
  text: 求你救我脱离作恶的人[a]，拯救我脱离流人血的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作恶的人”对应“作恶（或行罪孽）的人”；אָוֶן 也可表示罪孽、祸患或虚妄。
    reason: 说明 פֹּעֲלֵי אָוֶן 的行动者构造及 אָוֶן 的语义范围。
  - marker: b
    text: 希伯来语直译为“血的人”；这是习语，可指嗜血的人、流人血的人，或背负血债的人。
    reason: 说明 דָמִים 的字面意象及其可能含义，避免把习语限定为单一解释。
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: 求你救我脱离
  rationale: 这是 נצל 的祈使式，表达诗人在危险中恳求被救出；加上“求你”使希伯来语祈求语气在现代汉语中自然显明。
- source_word: מִפֹּעֲלֵי אָוֶן
  choice: 脱离作恶的人
  rationale: פֹּעֲלֵי 是“做、行”的分词，אָוֶן 在此指道德上的恶。译作“作恶的人”既保留行动者的含义，也比直译“行作邪恶者”更符合现代汉语。
- source_word: וּמֵאַנְשֵׁי דָמִים
  choice: 脱离好流人血的人
  rationale: דָמִים 字面为“血”的复数，在此是涉及流血、嗜血或血债的习语。“好流人血的人”保留其强烈意象，同时在汉语中可理解为嗜好暴力杀戮的人。
- source_word: הוֹשִׁיעֵנִי
  choice: 拯救我
  rationale: 这是 ישׁע 的祈使式，表示从敌人的威胁中得救。“拯救我”与前句“救我脱离”形成自然平行，又保留原文所用两个不同动词。
theological_decisions:
- issue: דָמִים 所表达的流血与血债含义
  choice: 好流人血的人
  alternative: 杀人流血的人；背负血债的人
  rationale: 原文习语既可能侧重嗜血暴力，也可能暗含流血罪责。正文采用能体现暴力倾向的传统而清楚的汉语表达，脚注保留其语义范围，不把含义限定为单一解释。
- issue: אַנְשֵׁי 的阳性形式
  choice: 人
  alternative: 男人
  rationale: 现代汉语“人”本身不标示语法性别，且在这里自然指敌对者；译成“男人”会额外突出生理性别，而这并非诗句的论述重点。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“求你”体现祈求语气；“救我脱离……拯救我脱离……”保留诗句的平行结构和两个不同的救援动词。
