  yaml_path: translation/ot/psalms/058/002.yaml
  text: Even in your heart you work injustice[b][a]; on the earth your hands weigh out violence.
translation:
  language: zh_hans
  text: 甚至在心里，你们也行不义；在地上[b]，你们的手称量暴力[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称量”也可译作“量出”或“按量施予”。希伯来语动词含称重、衡量的意思。
    reason: lexical_alternative
  - marker: b
    text: “在地上”也可译作“在境内”或“在这地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: 不
  rationale: 结合上一节的反问，将强调语气译为断然否定的回应“ 不 ”，自然引出指控；该词也可理解为“甚至”或“确实”。
- source_word: בְּלֵב
  choice: 心里
  rationale: 保留介词的内在、处所意义，指向受话者内心的意图；希伯来文单数“心”可集合性地对应复数受话者。
- source_word: עוֹלֹת
  choice: 不义
  rationale: 该复数名词指道德上的邪恶或不公；中文以集合性的“不义”既符合司法语境，也避免生硬复数化。
- source_word: תִּפְעָלוּן
  choice: 行
  rationale: פָּעַל表示做、施行；“行不义”简洁自然，并保留主动实施的含义。
- source_word: בָּאָרֶץ
  choice: 在地上
  rationale: 可指“大地上”，也可指“境内/这地”；正文采用范围较广且自然的“在地上”，另以脚注保留“在境内”的可能。
- source_word: חֲמַס
  choice: 暴力
  rationale: חָמָס常指暴力及暴虐的不法行为；“暴力”最直接地保留其强烈意义。
- source_word: יְדֵיכֶם
  choice: 你们的手
  rationale: 保留具体意象，以“手”表示行为与施行者的能力。
- source_word: תְּפַלֵּסוּן
  choice: 称量
  rationale: פלס在此有称量、衡量之意；“称量暴力”保留司法语境中的衡器隐喻和反讽，也容许“量给”这一分配意味。
theological_decisions:
- issue: 末句动词在司法语境中的隐喻意义
  choice: 译作“称量暴力”，保留称重、衡量的形象
  alternative: 译作“量出暴力”或“分给人暴力”
  rationale: 本诗指控败坏的审判者；保留衡量隐喻，能显出他们本应衡量公正，却以双手称量暴力的反讽，不将其简化为一般的“施行”。
- issue: אַף与上一节反问的衔接
  choice: 译作“不”，理解为对上一节反问的断然回答
  alternative: 译作“甚至”或“确实”
  rationale: 希伯来文אַף具有强调作用，语境中可构成否定上一节自称公义的反诘。正文采用自然的中文篇章衔接，同时承认该词也可直接加强本节陈述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“行不义”符合诗歌与司法指控语域；“称量暴力”有意保留原文突出的衡器隐喻。所有脚注标记均置于正文相应词语之后。
