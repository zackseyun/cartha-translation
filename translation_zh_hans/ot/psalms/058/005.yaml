translation:
  language: zh_hans
  text: 它不听念咒者[a]的声音，就是那精于施咒者[b]的声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“低声念咒者。”希伯来语这个词与低声说话、念诵或咒语有关。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于：“结咒语者，精熟的。”这是指熟练施行咒术的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 它
  rationale: 这是关系从句，承接上一节所说的聋蛇；汉语用“它”自然延续这一比喻。
- source_word: לֹא יִשְׁמַע
  choice: 不听
  rationale: 未完成式在此描写这蛇一贯不理会、不响应的特征；“不听”兼顾听见声音与不予理会的含义。
- source_word: לְקוֹל
  choice: 声音
  rationale: קוֹל可指“声音”或“嗓音”；下文所指是施术者发出的念诵声，译作“声音”自然且不过度限定。
- source_word: מְלַחֲשִׁים
  choice: 行法术者
  rationale: 该词源与低声念诵、咒语有关；在蛇受术者声音影响的语境中，“行法术者”能表达施行咒术的人，同时脚注保留“低声念咒者”的词源色彩。
- source_word: חוֹבֵר חֲבָרִים
  choice: 念咒的人
  rationale: 原文是同根词构成的习语，字面近于“结合法术者”；现代汉语用“念咒的人”传达施行咒语的实际意义，而不把晦涩的字面结构硬译入正文。
- source_word: מְחֻכָּם
  choice: 善于
  rationale: 此词在这里表示娴熟、精通，而非道德意义上的智慧；“善于”清楚表达其技艺熟练。
