  language: zh_hans
  text: 交给音乐指挥。《不要毁坏》。[a] 大卫的米刻坦。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：“不要毁坏。”在诗篇题注中，这短语可能是曲调或音乐形式的名称；若如此，也可译作“按《不要毁坏》的曲调”。
    reason: alternative_reading
  - marker: b
    text: “米刻坦”是希伯来语题注术语的音译，其确切含义不明，可能指某种诗歌体裁、作品类别或音乐形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐团长
  rationale: 该词在诗篇题注中通常指负责音乐演唱或演奏的人。“圣乐团长”既体现礼仪音乐职能，也比泛称“领袖”更明确；“交给”自然表达前缀 ל־ 的指向。
- source_word: אַל תַּשְׁחֵת
  choice: 调用《不要毁坏》
  rationale: 该短语很可能是曲调或音乐形式的名称。以书名号标示名称，并用“调用”说明其可能的音乐功能；脚注同时保留将它直接理解为禁令的可能。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 希伯来语 ל־ 在诗篇题注中可表示作者、归属、关联或献给某人。“大卫的”在中文中同样保留一定范围的归属歧义，避免武断译成“大卫所作”。
- source_word: מִכְתָּם
  choice: 米刻坦
  rationale: 该题注术语的确切含义不明，可能表示某种诗歌体裁、作品类别或音乐形式。采用音译比译作含义未经证实的“金诗”或“铭刻诗”更稳妥。
theological_decisions:
- issue: 诗篇题注中各术语的性质
  choice: 将全句作为诗篇题注处理，并把 אַל תַּשְׁחֵת 主要呈现为曲调或音乐名称，同时保留不确定性。
  alternative: 把 אַל תַּשְׁחֵת 译为直接命令“不要毁坏”，或把 לְדָוִד 明确译为“大卫所作”。
  rationale: 原文没有明确说明该短语是曲名，也没有把 לְדָוִד 的关系限定为作者身份。正文采取符合诗篇题注惯例的读法，脚注则保留真实的语言歧义，不作不必要的神学或作者归属断定。
translation_notes:
  register: 采用简洁、庄重而现代的题注体。以“圣乐团长”传达礼仪音乐语境，以书名号标示可能的曲名；对含义不确定的专门术语采用音译，并在脚注中解释。
