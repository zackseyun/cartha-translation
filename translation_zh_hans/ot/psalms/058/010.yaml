source:
  edition: WLC
  text: יִשְׂמַ֣ח צַ֭דִּיק כִּי חָזָ֣ה נָקָ֑ם פְּעָמָ֥י/ו יִ֝רְחַ֗ץ בְּ/דַ֣ם הָ/רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/010.yaml
  text: The righteous will rejoice when he sees vengeance[b][a]; he will wash his feet in the blood of the wicked.
translation:
  language: zh_hans
  text: 义人看见报应，就必欢喜[a]；他要在恶人的血中洗脚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人必欢喜，因为他看见了报应。”希伯来语连词既可表示原因，也可表示时间。
    reason: lexical_alternative
  - marker: b
    text: “在恶人的血中洗脚”是诗歌意象，描绘审判的彻底，并不是命令人亲自施暴。
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׂמַח
  choice: 就必欢喜
  rationale: 该词为שׂמח的Qal未完成式第三人称阳性单数；结合诗歌语境，译作“必欢喜”保留将来或确定性的语气，并以“就”自然承接前面的情境。
- source_word: צַדִּיק
  choice: 义人
  rationale: 阳性单数形容词作名词用，可指代表性的义人；“义人”简洁、自然，并保留单数形式。
- source_word: כִּי
  choice: 看见……就
  rationale: כִּי在此可表达时间或原因关系；正文采用现代汉语的“看见……就”呈现时间—原因兼具的语感，并以脚注保留“因为”的可能。
- source_word: חָזָה
  choice: 看见
  rationale: 该词为完成式第三人称阳性单数；在面向将来的主句中，汉语用“看见”即可自然表达所见情境，无须标明完成体。
- source_word: נָקָם
  choice: 报应
  rationale: 该名词指报复、惩罚或施行报应。“报应”保留公正惩罚的严厉含义，同时不像“复仇”那样容易暗示义人亲自报私仇。
- source_word: פְּעָמָיו
  choice: 脚
  rationale: פּעם可指脚步、足或步伐；在“血中洗”这一意象里，具体译为“脚”最自然。汉语无需另译第三人称单数所有格。
- source_word: יִרְחַץ
  choice: 他要……洗
  rationale: 该词为רחץ的Qal未完成式第三人称阳性单数；“要……洗”保留其将来指向及诗歌中的鲜明动作。
- source_word: בְּדַם
  choice: 在……的血中
  rationale: 介词ב在此最自然地表达处所；“在血中”直接保留原文强烈而具体的诗歌画面。
- source_word: הָרָשָׁע
  choice: 恶人
  rationale: 阳性单数形容词作名词用，可作代表性单数理解；“恶人”是现代汉语中自然且准确的对应表达。
theological_decisions:
- issue: 本节是在描写个人报复，还是因公义审判而欢喜
  choice: 正文直译义人看见“报应”而欢喜，不增添“个人”或“上帝所施行”等解释性限定。
  alternative: 可解释为义人庆祝个人报复，或明确改写为义人因上帝伸冤而欢喜。
  rationale: 希伯来文本没有明说报应的施行者，却保留了严厉的审判意象。译文既不把它改成私人报复，也不在正文中补入“上帝的”来消解其张力。
- issue: “在恶人的血中洗脚”是否应弱化为抽象的胜利或伸冤
  choice: 保留血与洗脚的具体意象，并用脚注说明其诗歌功能。
  alternative: 意译为彻底战胜恶人或看见恶人受罚。
  rationale: 原文有意采用震撼性的审判图像；正文应予保留，而不是用抽象措辞弱化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“义人”“恶人”“报应”符合诗篇语体；保留原文平行结构和强烈意象，不使用古奥的“观看”“复仇雪恨”等措辞。
