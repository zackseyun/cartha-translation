id: PSA.58.8
reference: Psalms 58:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כְּמ֣וֹ שַׁ֭בְּלוּל תֶּ֣מֶס יַהֲלֹ֑ךְ נֵ֥פֶל אֵ֝֗שֶׁת בַּל חָ֥זוּ שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/008.yaml
  text: Like a snail that melts away as it goes[b][a], like a stillborn child that has not seen the sun.
translation:
  language: zh_hans
  text: 愿他们像蜗牛，爬行时渐渐消融；又像妇人流产的胎儿，未曾见过太阳。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句后半的希伯来语句法较难，直译近于“妇人的流产之物——他们未曾见过太阳”。“见过”在原文中是复数形式，可能按意义泛指这类未出生的胎儿；正文依汉语习惯译成单数。
    reason: 解释原文中单数名词与复数动词之间的句法张力，并避免把关系分句误接到“妇人”身上。
lexical_decisions:
- source_word: כְּמוֹ
  choice: 像
  rationale: 引出明喻，简洁自然地保留希伯来诗歌的比较关系。
- source_word: שַׁבְּלוּל
  choice: 蜗牛
  rationale: 传统且最有根据的理解是“蜗牛”；此处描绘它爬行时仿佛逐渐消融的诗意形象。
- source_word: תֶּמֶס
  choice: 渐渐消融
  rationale: 该词与“融化、溶解”有关；用“渐渐消融”既表达过程，也保留诗句强烈而奇特的意象。
- source_word: יַהֲלֹךְ
  choice: 爬行时
  rationale: 原义为“走、行进”；用于蜗牛时，现代汉语以“爬行”最自然，并以“时”呈现动作伴随关系。
- source_word: נֵפֶל
  choice: 流产的胎儿
  rationale: 该名词指流产之物或未足月而死的胎儿；“流产的胎儿”比单说“流产”更适合承接“未曾见过太阳”。
- source_word: אֵשֶׁת
  choice: 妇人
  rationale: 构成“妇人流产的胎儿”；“妇人”符合诗体，也不把词义不必要地限定为“妻子”。
- source_word: בַּל חָזוּ
  choice: 未曾见过
  rationale: 准确表达否定词与完成式“看见”；原文动词为复数，和前面的单数集合性名词存在数的不一致，正文按汉语习惯顺译，脚注说明。
- source_word: שָׁמֶשׁ
  choice: 太阳
  rationale: 直接保留原有意象，表示胎儿从未见到世上的日光。
theological_decisions:
- issue: 诗句是否补出祈愿语气
  choice: 用“愿他们”承接上下文
  alternative: 仅译为两个孤立的比较短语：“像蜗牛……；像胎儿……”
  rationale: 本节两个明喻在希伯来文中没有明说主句，但承接前文针对恶人的祈愿。汉语补出“愿他们”可使句子完整，同时不改变所祈求的内容。
- issue: “未曾见过太阳”的所指
  choice: 指流产的胎儿
  alternative: 误接为指妇人
  rationale: 语义上该分句描述未出生或死产的胎儿，而非母亲；如此处理也符合本诗死亡与消逝的意象。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“渐渐消融”保留原文异常鲜明的蜗牛意象；分号并列两个明喻。“愿他们”从上下文补足汉语所需的祈愿主句。
