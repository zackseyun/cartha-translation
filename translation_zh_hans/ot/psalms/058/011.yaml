  text: וְ/יֹאמַ֣ר אָ֭דָם אַךְ פְּרִ֣י לַ/צַּדִּ֑יק אַ֥ךְ יֵשׁ אֱ֝לֹהִ֗ים שֹׁפְטִ֥ים בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/011.yaml
  text: And people will say[a], “Surely there is fruit for the righteous[b]; surely there is a God who judges on the earth.”
translation:
  language: zh_hans
  text: 人必说：“义人确有报偿[a]；地上确有施行审判的上帝[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“果实”；这里比喻义人所得的结果或报偿。
    reason: lexical_alternative
  - marker: b
    text: “施行审判的”所对应的希伯来文分词是复数形式。多数人按语境理解为独一的上帝施行审判；也有人较少见地理解为“施行审判的诸神”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹאמַר אָדָם
  choice: 人必说
  rationale: אָדָם在此是泛指人类的单数名词；现代汉语用“人”既保留简洁的代表性单数，也自然涵盖众人。未完成式结合上下文可表达审判发生后的结果，因此译作“必说”。
- source_word: אַךְ
  choice: 果然
  rationale: 两处均表示强调与确认，而非“只有”的限制义；“果然”契合人目睹审判后所作的承认。
- source_word: פְּרִי לַצַּדִּיק
  choice: 义人有果报
  rationale: פְּרִי本义为“果实”，此处喻指行为所得的结果或报偿。“果报”在现代汉语中保留结果与报偿的双重意味，同时避免生硬直译为“果子”。
- source_word: יֵשׁ אֱלֹהִים
  choice: 有……上帝
  rationale: יֵשׁ是存在句。“有……上帝”自然表达上帝确实存在并行使审判，不暗示祂只是众神之一。
- source_word: שֹׁפְטִים
  choice: 施行审判的
  rationale: 该阳性复数分词与形态上为复数的אֱלֹהִים相连。正文依语境按独一上帝理解，用汉语不标数的定语结构，既通顺又不过度解释其异常复数形态。
- source_word: בָּאָרֶץ
  choice: 地上
  rationale: 此诗谈普世性的道德审判，“地上”比“那地”更符合范围，也自然表达上帝在世间施行审判。
theological_decisions:
- issue: אֱלֹהִים שֹׁפְטִים应理解为单数的上帝还是复数的诸神/审判者
  choice: 正文译作单数意义：“施行审判的上帝”
  alternative: “施行审判的诸神”或较直译的“上帝／审判者们”
  rationale: 本节是对神圣公义的承认，语境更支持独一的上帝为主语。不过，שֹׁפְטִים确为复数分词，故以脚注说明形态和较少采用的另一读法，不抹去原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人必说”保留诗句的凝练感；重复“果然”再现两个אַךְ的修辞呼应。正文中的[a]、[b]均与脚注对应。
