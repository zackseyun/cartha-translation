  text: הַֽ/אֻמְנָ֗ם אֵ֣לֶם צֶ֭דֶק תְּדַבֵּר֑וּ/ן מֵישָׁרִ֥ים תִּ֝שְׁפְּט֗וּ בְּנֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/001.yaml
  text: Do you indeed speak righteousness in silence? Do you judge uprightly[c][b][a], sons of man?
translation:
  language: zh_hans
  text: 你们果真在沉默中[a]讲说公义吗？你们秉公审判吗，世人哪[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沉默”所译的希伯来词较难确定。马所拉文本的元音标注可理解为“沉默”或“缄默”；不少解释者则采用另一种读法，理解为“大能者”，甚至“众神”，因而译作：“大能者哪，你们果真讲说公义吗？”
    reason: alternative_reading
  - marker: b
    text: 原文直译为“人的众子”，也可译作“人类”或“世人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: 果真……吗
  rationale: 保留强调语气和反问意味，表达诗人带有讽刺性的质问。
- source_word: אֵלֶם
  choice: 在沉默中
  rationale: 依照马所拉文本的元音标注，按“沉默、缄默”理解；虽然与“讲说”并列显得突兀，却忠实保留原文的困难和张力。
- source_word: צֶדֶק
  choice: 公义
  rationale: 保留该词的道德与司法含义，并与“讲说”自然搭配。
- source_word: תְּדַבֵּרוּן
  choice: 讲说
  rationale: 直接表达דבר的言说含义，也能承接“公义”这一宾语。
- source_word: מֵישָׁרִים
  choice: 秉公
  rationale: 在审判语境中自然表达正直、公平与不偏不倚，兼顾现代汉语可读性。
- source_word: תִּשְׁפְּטוּ
  choice: 审判
  rationale: 保留动词在本节中的司法意味。
- source_word: בְּנֵי אָדָם
  choice: 世人哪
  rationale: 这是对受质问者的称呼；用现代汉语自然表达“人的众子、世人”的集体意义，字面形式另见脚注。
theological_decisions:
- issue: אֵלֶם的困难读法
  choice: 正文依马所拉文本译作“在沉默中”
  alternative: “大能者哪”或“众神哪”
  rationale: 现存马所拉元音支持“沉默”一义，但另有悠久的异读或校读传统。正文不擅自改动文本，脚注则保留会显著影响解释的其他可能。
- issue: בְּנֵי אָדָם的所指与形式
  choice: 译作“世人哪”
  alternative: 直译为“人的众子哪”或理解为“人类”
  rationale: 该短语强调受责问者不过是人；中文正文采用自然的集合称呼，同时在脚注保存字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的诗体语言。保留两句平行反问，并把原文末尾的呼语“世人哪”置于第二问句末尾，以贴近希伯来语次序。“在沉默中讲说”虽在中文中带有刻意的反常感，但这是原文文本困难的一部分，不在正文中替作者消解。
