  text: בְּ/טֶ֤רֶם יָבִ֣ינוּ סִּֽירֹתֵי/כֶ֣ם אָטָ֑ד כְּמוֹ חַ֥י כְּמוֹ חָ֝ר֗וֹן יִשְׂעָרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/009.yaml
  text: Before your pots can feel the thornbush[a], whether green or burning, he will sweep them away.
translation:
  language: zh_hans
  text: 你们的锅还未感到荆棘的热力[a]，不论荆棘尚青还是正燃烧，他必将其卷走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文艰深，较直译可作：“你们的锅尚未察觉荆棘；如同活着的，如同燃烧（或：烈怒），他就把其（或：他）旋风般卷走。”大意可能是：火还来不及把锅烧热，除灭便突然临到。末句也有人理解为“他必在烈怒中把他们卷走”。
    reason: 保留原文在意象、חָרוֹן的含义及宾语指代上的歧义。
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: 还未
  rationale: 表示后一行动发生在前一情形出现之前；“还未”自然地呈现诗句所强调的突然中断。
- source_word: יָבִינוּ
  choice: 感到
  rationale: 本义通常是“明白、察觉”；以“锅”为主语时，“感到”保留察觉之意，也符合锅受热的语境。
- source_word: סִּירֹתֵיכֶם
  choice: 你们的锅
  rationale: 指烹煮用的器皿；“锅”是现代汉语中简洁、自然的对应词。
- source_word: אָטָד
  choice: 荆棘
  rationale: 指可作燃料的多刺灌木；“荆棘”保留具体的植物和燃火意象。
- source_word: כְּמוֹ חַי
  choice: 荆棘尚青
  rationale: “活的”在燃料语境中很可能指新鲜、未干的青枝；补出“荆棘”使中文关系清楚。
- source_word: כְּמוֹ חָרוֹן
  choice: 正燃烧
  rationale: חָרוֹן通常可指烈怒，但在锅、荆棘和火的意象中也可理解为炽热或燃烧；正文保留热力意象，另一理解收入脚注。
- source_word: יִשְׂעָרֶנּוּ
  choice: 他就要把它卷走
  rationale: 动词带有暴风般席卷、旋走之意；“卷走”表达迅猛除去，单数宾语“它”也尽量保留希伯来语指代不明的特点。
theological_decisions:
- issue: 本节艰深意象所表达的审判
  choice: 用锅尚未被荆棘燃料加热便被卷走的图景，表达突然而至的除灭。
  alternative: 末句可理解为“他必在烈怒中把他们卷走”，חָרוֹן也可直译为“烈怒”。
  rationale: 上下文指向恶人突然受审判，但希伯来文的句法、比喻和代词都不明确。正文保留具体的锅与荆棘意象，不把“烈怒”的神学含义强行写入正文；脚注交代其他可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保持诗歌的急迫感和锅、荆棘、燃烧、卷走等具体意象；对原文难解处不作过度阐释，并以脚注提供较直译形式及主要异读。
