  text: יִמָּאֲס֣וּ כְמוֹ מַ֭יִם יִתְהַלְּכוּ לָ֑/מוֹ יִדְרֹ֥ךְ חצ/ו כְּמ֣וֹ יִתְמֹלָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/007.yaml
  text: Let them melt away like water that runs off[a]; when he aims his arrows[c][b], let them be as though cut off.
translation:
  language: zh_hans
  text: 愿他们像流走的水消散[a]；他瞄准射箭时[b]，愿箭矢仿佛被截断[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像流去的水。”原文描绘水流走并消失。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“他踏（或拉）他的箭”；在箭矢语境中通常理解为拉弓或瞄准射箭。原文“他的箭”为单数，也可作集合性理解；“他”所指并不明确。
    reason: lexical_alternative
  - marker: c
    text: 末句的原文词形和词义都有困难；也可理解为“愿箭矢变钝”或“愿他们枯萎”。
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּאֲסוּ
  choice: 愿他们消散
  rationale: 此处词形和词义有难处；结合水流逝的意象和祈愿语气，译为“愿他们消散”，表达逐渐消失而不把具体方式说得过死。
- source_word: כְמוֹ מַיִם
  choice: 如……的水
  rationale: 保留希伯来诗歌中的明喻，并与后面的流动意象自然衔接。
- source_word: יִתְהַלְּכוּ לָמוֹ
  choice: 流逝
  rationale: 该表达描绘水移动、流走而消失；“流逝”简洁自然，也保留去而不返的诗意。
- source_word: יִדְרֹךְ
  choice: 搭箭张弓时
  rationale: דרך与箭矢语境相连，指张弓准备发射。原文省略“弓”，中文补出惯用动作“搭箭张弓”，避免不自然的“张他的箭”。
- source_word: חצו
  choice: 箭
  rationale: 马所拉读法为单数“他的箭”，在诗歌中可作集合或泛指；正文用不标数的“箭”，既自然又不强行定为复数。
- source_word: כְּמוֹ יִתְמֹלָלוּ
  choice: 仿佛被截断
  rationale: 末句词形罕见且释义有争议；“被截断”保留使箭失效的基本图像，同时以“仿佛”反映 כְּמוֹ，避免确定为“变钝”或“枯萎”。
theological_decisions:
- issue: 咒诅诗中的祈愿语气
  choice: 用“愿……”，将两个未完成式按语境表达为祈愿
  alternative: 译成陈述性的“他们必……”
  rationale: 本节处于求神审判恶人的诗歌语境，祈愿式更能传达话语功能；这只是语法与体裁判断，不额外指定行动者或神学机制。
- issue: 第二分句主语的指称
  choice: 保留“他”，不明确说明是神、恶人或其他对象
  alternative: 明确译作“神”或“恶人”
  rationale: 希伯来文仅有第三人称单数主语，所指存在解释空间；正文保留代词，以免消除原文的含混。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。“消散—流逝—截断”保持本节迅速消失、攻击失效的意象推进；正文保留原文第二分句主语及末句词义的不确定性，并用脚注说明主要异读。
