  yaml_path: translation/ot/psalms/058/004.yaml
  text: Their venom is like the venom of a serpent[a], like a deaf cobra that stops up its ear,
translation:
  language: zh_hans
  text: 他们的毒液如同蛇的毒液；他们又像一条聋的毒蛇[a]，把自己的耳朵塞住，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毒蛇”所译的希伯来语 פֶתֶן 指一种有毒的蛇；传统上常译作“asp”（阿斯普蛇），具体物种不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: 毒液
  rationale: 在“蛇”和特定毒蛇的平行意象中，此词自然指蛇毒，而不是“烈怒”；“毒液”准确而符合现代汉语。
- source_word: לָמוֹ
  choice: 他们的
  rationale: 此处代词形式与后面的名词构成领属关系，表达“他们的毒液”。
- source_word: כִּדְמוּת
  choice: 好像
  rationale: 该比较结构引出明喻；“好像”自然地保留相似关系。
- source_word: נָחָשׁ
  choice: 蛇
  rationale: 此词是较宽泛的蛇类称谓，与下一分句较具体的毒蛇名称形成层次。
- source_word: כְּמוֹ
  choice: 又像
  rationale: 译出比较词，并用“又”自然衔接诗歌中的平行分句。
- source_word: פֶתֶן
  choice: 眼镜蛇
  rationale: 原词指一种毒蛇，传统上也译作“虺蛇”或“角蝰”；“眼镜蛇”是现代读者易懂的近似对应，但具体物种不能完全确定，因此加注说明。
- source_word: חֵרֵשׁ
  choice: 聋
  rationale: 此形容词意为听不见；上下文所描绘的是不听弄蛇人声音的毒蛇，而非不能发声。
- source_word: יַאְטֵם
  choice: 塞住
  rationale: 该动词有封闭、堵住之意；“塞住耳朵”保留鲜明的身体动作意象。
- source_word: אָזְנוֹ
  choice: 耳朵
  rationale: 原文为单数“它的耳朵”；汉语在此可自然省略动物领属代词，同时保留单数意象。
