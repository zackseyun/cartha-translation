  text: אֱֽלֹהִ֗ים הֲרָס שִׁנֵּ֥י/מוֹ בְּ/פִ֑י/מוֹ מַלְתְּע֥וֹת כְּ֝פִירִ֗ים נְתֹ֣ץ יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/006.yaml
  text: God[a], break their teeth in their mouths; shatter the fangs of the young lions[b], O Yahweh.
translation:
  language: zh_hans
  text: 神啊，求你打断他们口中的牙齿；雅威[a]啊，求你击碎年轻的狮子的利齿[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为神的专名“YHWH”（四字神名）；这里按音译作“雅威”。
    reason: divine_name
  - marker: b
    text: “利齿”所译的希伯来词指用于咬碎的牙齿或颌齿；也可译作“臼齿”或“獠牙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 此处是直接呼告；加“啊”能以自然的现代汉语明确表达呼语。
- source_word: הֲרָס
  choice: 打断
  rationale: 该命令式本义为拆毁、破坏；以“牙齿”为宾语时，“打断”既自然又保留强烈而具体的意象。
- source_word: שִׁנֵּימוֹ
  choice: 他们的牙齿
  rationale: 保留复数名词及第三人称阳性复数后缀的直接含义。
- source_word: בְּפִימוֹ
  choice: 他们口中的
  rationale: בְּ在此表示牙齿所在的位置；“口中的”贴近原文，未解释为“从口中”。
- source_word: מַלְתְּעוֹת
  choice: 利齿
  rationale: 该词指用于咬碎的牙齿或颌齿；在狮子的意象中，“利齿”自然、有力，也避免把词义过窄地限定为现代解剖意义上的犬齿。
- source_word: כְּפִירִים
  choice: 少壮狮子
  rationale: 该词通常指年轻而强健、已具捕食能力的狮子；“少壮狮子”比“幼狮”更能体现其威胁性。
- source_word: נְתֹץ
  choice: 击碎
  rationale: 该命令式有拆毁、打碎之意；与“利齿”搭配时，“击碎”保留暴烈的祈求，并与前句“打断”构成诗性平行。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，保留其作为以色列之神专名而非普通称号的性质。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名。正文采用现代中文圣经传统中广为人知的“耶和华”，并以脚注说明其对应四字神名，避免将专名无声改作称号。
- issue: 咒诅诗中的暴力意象
  choice: 保留打断牙齿、击碎利齿的具体祈求
  alternative: 意译为“除去他们的能力”
  rationale: 希伯来文刻意使用强烈的身体意象；将其抽象化会削弱诗句的力度，也会消解原文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个“啊”明确两处平行呼告；“求你”使希伯来语命令式在向神祈求的语境中符合汉语习惯，同时不减弱其迫切性。分号保留两行诗意的平行结构，感叹号体现强烈的祈求语气。
