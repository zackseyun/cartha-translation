  naturalness: 原译整体庄重顺畅。“一出母胎就走迷了路”较自然，但正文弱化了原文重复的母腹意象；改为“从腹中就走迷”可更紧贴平行结构，仍属现代诗歌语体。“说谎”比“口说谎言”更简洁，并保留分词的特征性描写。
