  text: זֹ֣רוּ רְשָׁעִ֣ים מֵ/רָ֑חֶם תָּע֥וּ מִ֝/בֶּ֗טֶן דֹּבְרֵ֥י כָזָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/003.yaml
  text: The wicked are estranged from the womb; they go astray from birth[a], speaking lies.
translation:
  language: zh_hans
  text: 恶人从母腹就已疏离；他们从腹中就走迷[a]，说谎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为：“从母腹……从腹中（或母腹）。”两个平行短语以强烈的诗性说法描写恶人在生命最早阶段就已如此；这并非以系统神学术语界定道德罪责从何时开始。
    reason: 说明第二个短语的字面母腹意象及本节的诗性夸张，避免把“从腹中”误解为对胎儿期道德罪责的技术性教义断言。
lexical_decisions:
- source_word: זֹרוּ
  choice: 与正道疏远
  rationale: 该动词表示疏离、成为外人。中文若只说“疏远”容易缺少所疏离的对象；补出“正道”使语意自然，并与下句“走迷了路”形成诗意对应，同时不把它窄化为单纯的“败坏”。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是现代中文圣经诗歌中自然、简洁的类别称呼，准确表达作恶者。
- source_word: מֵרָחֶם
  choice: 从母腹
  rationale: 贴近希伯来文的空间兼时间意象，保留诗句“自最早生命阶段即如此”的强烈夸张表达。
- source_word: תָּעוּ
  choice: 走迷了路
  rationale: 表达偏离正路、迷失方向；采用现代汉语自然说法，并与前句的疏离意象相呼应。
- source_word: מִבֶּטֶן
  choice: 一出母胎
  rationale: בטן本义为腹、母腹；这里以自然中文表达自出生之初，同时保留与“从母腹”的平行而不机械重复。
- source_word: דֹּבְרֵי כָזָב
  choice: 口说谎言
  rationale: 参与式短语刻画恶人的持续特征；“口说谎言”简洁清楚，也使其与前面的主语顺畅衔接。
- source_word: כָזָב
  choice: 谎言
  rationale: 在言语语境中，“谎言”是最直接、通俗的现代汉语对应词；“虚假”也可，但较抽象。
theological_decisions:
- issue: 本节是否应译成关于胎儿期道德罪责或原罪的明确教义命题
  choice: 保留诗篇以“从母腹”“一出母胎”描写恶人自生命最早阶段便偏离正道的强烈诗性说法。
  alternative: 将经文强化为从受孕时便有道德罪责的技术性教义陈述，或弱化为毫无人论意义的纯粹辱骂。
  rationale: 希伯来文借平行结构作强烈谴责，但没有以系统神学术语界定罪责从何时开始。译文应保留其力度及神学张力，不额外裁定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“与正道疏远”与“走迷了路”保留希伯来诗歌的平行和道德方向意象；分号呈现两个诗行单位。脚注标记[a]已置于相关短语之后。
