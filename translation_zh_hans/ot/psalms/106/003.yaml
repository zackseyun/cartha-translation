  text: אַ֭שְׁרֵי שֹׁמְרֵ֣י מִשְׁפָּ֑ט עֹשֵׂ֖ה צְדָקָ֣ה בְ/כָל עֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/003.yaml
  text: Blessed are those who keep justice[a], who do righteousness at all times.
translation:
  language: zh_hans
  text: 持守公正、时时行义的人有福了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“持守正义、始终做正直之事的人有福了。”
    reason: 词义与表达方式的可选译法：אַשְׁרֵי 可作福祉宣告；מִשְׁפָּט 和 צְדָקָה 也可分别用“正义”和“正直之事”表达。
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是复数感叹式的福祉宣告。“有福了”保留《诗篇》中庄重的祝福语气，又不把含义缩减为主观的快乐。
- source_word: שֹׁמְרֵי
  choice: 遵守
  rationale: 分词表达持续、惯常的实践；“遵守”与伦理规范语境中的“公正”搭配自然。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 此处主要指合乎公平正义的原则和行为，而不是法庭裁决。“公正”在现代汉语中清楚自然。
- source_word: עֹשֵׂה
  choice: 行
  rationale: 单数分词在这里具有集合性、泛指作用，与前面的复数表达共同描述一类人；“行”保留持续实践的意味，也符合庄重经文语体。
- source_word: צְדָקָה
  choice: 义
  rationale: 指正直、合宜的道德行为。“义”保留其伦理和神学分量，并与“公正”有所区别。
- source_word: בְּכָל עֵת
  choice: 时时
  rationale: 表达持续或惯常的行动；“时时”简洁自然，并保留原文对时间范围的强调。
theological_decisions:
- issue: מִשְׁפָּט 与 צְדָקָה 的关系
  choice: 分别译为“公正”和“义”
  alternative: 将两者都译成“公义”或其他重叠的正义用语
  rationale: 原文使用两个相关却不完全相同的伦理词。分别翻译既保留诗句的平行关系，也避免将两者合并为同一概念。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“遵守公正”略带经文凝练感；“时时行义”保留希伯来诗歌的简洁和平行结构。
