base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/046.yaml
  text: He caused them to receive compassion before all who had taken them captive.
translation:
  language: zh_hans
  text: 他使他们在所有掳掠他们的人面前蒙怜悯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן אוֹתָם לְרַחֲמִים
  choice: 他使他们……蒙怜悯
  rationale: 希伯来语直译近于“他将他们置于怜悯中”，这里表达上帝使被掳者得到怜悯；“蒙怜悯”自然、凝练，也保留受惠的被动意味。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留该介词的常用空间与关系性表达，不额外解释为“从……那里”。
- source_word: כָּל־שׁוֹבֵיהֶם
  choice: 所有掳掠他们的人
  rationale: שׁבה 指掳走、俘获；分词带所属后缀，指那些将他们掳去的人。
theological_decisions:
- issue: 上帝在被掳者所得怜悯中的作用
  choice: 他使他们……蒙怜悯
  alternative: 他们在……面前蒙了怜悯
  rationale: 保留 וַיִּתֵּן 的使动主体性，明确怜悯的临到是上帝促成的，而非仅陈述一种结果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“掳掠他们的人”贴近原文分词含义；全句保持诗篇叙事的简洁节奏。
