  text: וַ/יִּזְבְּח֣וּ אֶת בְּ֭נֵי/הֶם וְ/אֶת בְּנֽוֹתֵי/הֶ֗ם לַ/שֵּֽׁדִים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/037.yaml
  text: They sacrificed their sons and their daughters to demons[a].
translation:
  language: zh_hans
  text: 他们把自己的儿子和女儿献祭给鬼魔[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给那些鬼魔。”
    reason: 保留לַשֵּׁדִים所含冠词可能表达的定指意味。
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: 献祭
  rationale: זבח在这里指祭祀性的宰杀或奉献；“献祭”自然简洁，并保留宗教礼仪语义。
- source_word: בְּנֵיהֶם
  choice: 自己的儿子
  rationale: בֵּן的复数附属形式明确指“儿子”；加“自己的”自然表达所属关系，并突出控诉的骇人性质。
- source_word: בְּנוֹתֵיהֶם
  choice: 女儿
  rationale: בַּת的复数附属形式明确指“女儿”；与“儿子”并列，保留原文涵盖两者的表达。
- source_word: לַשֵּׁדִים
  choice: 给鬼魔
  rationale: שֵׁדִים指超自然的邪恶灵体；“鬼魔”是现代中文圣经语体中清楚而庄重的对应，ל־则标明献祭的对象。
theological_decisions:
- issue: שֵׁדִים的译法
  choice: 鬼魔
  alternative: 邪灵；假神
  rationale: 原词指邪恶的超自然存在，而不只是抽象的偶像或假神；“鬼魔”保留这一主张，同时不加入后期关于其性质的推测。
- issue: לַשֵּׁדִים中冠词的表达
  choice: 正文译作“给鬼魔”，脚注说明也可译作“给那些鬼魔”
  alternative: 正文直接译作“给那些鬼魔”
  rationale: 希伯来语形式含介词与冠词的缩合；中文类指表达通常不必明示定指，但原文的定指可能性值得在脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把……献祭给……”符合自然汉语，并准确呈现受事与接受者；保留“儿子和女儿”的性别并列，不概括成“儿女”。
