  text: הוֹשִׁיעֵ֨/נוּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ/קַבְּצֵ/נוּ֮ מִֽן הַ/גּ֫וֹיִ֥ם לְ֭/הֹדוֹת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ לְ֝/הִשְׁתַּבֵּ֗חַ בִּ/תְהִלָּתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/047.yaml
  text: Save us[a], O Yahweh our God, and gather us from among the nations[b], that we may give thanks to your holy name and glory in your praise.
translation:
  language: zh_hans
  text: 耶和华我们的上帝啊，求你拯救我们[a]，从列国中聚集我们，使我们称谢你的圣名，并以颂赞你为荣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“搭救”。
    reason: lexical_alternative
  - marker: b
    text: “以颂赞你为荣”也可译作“因颂赞你而欢欣”或“以颂赞你为夸耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנוּ
  choice: 求你拯救我们
  rationale: 该词是ישׁע的使役式命令形，带第一人称复数宾语后缀，表达直接恳求上帝施行拯救；“拯救”兼具危难获救与救恩语感。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名；“耶和华”是现代汉语圣经传统中最广为人知且可辨识的专名形式。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 忠实表达第一人称复数所属关系，并保留祷告中的群体性与盟约性呼求。
- source_word: וְקַבְּצֵנוּ
  choice: 召聚我们
  rationale: קבץ的加强式命令形在此指把分散的人聚集起来；“召聚”自然体现上帝主动使流散者归聚。
- source_word: מִן הַגּוֹיִם
  choice: 从列国中
  rationale: מן可表达从众民之中出来；“列国”保留גוים的集体政治民族含义，也避免“外邦人”可能附带的后期神学色彩。
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  choice: 使我们称谢你的圣名
  rationale: 带ל的不定式承接两个命令，表达目的；ידה使役式在此主要是称谢、颂谢。“你的圣名”自然保留原文对上帝圣洁身份的强调。
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: 以赞美你为荣耀
  rationale: שבח的反身式可表示夸耀、以某事为荣；“以赞美你为荣耀”保留这种自我投入的欢庆意味，同时在现代汉语中避免误解为自夸。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非称号，因此正文保留专名。鉴于简体中文普通读者的辨识度，采用传统音译“耶和华”；“雅威”是较接近学术重构读音的可行替代。
- issue: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ的含义
  choice: 以赞美你为荣耀
  alternative: 因颂赞你而欢欣；夸耀于对你的赞美
  rationale: 该短语既有夸耀、以之为荣的反身意味，也带欢庆色彩。正文不将其淡化为一般的“喜乐”，又避免让“夸口”被误读为人的自我炫耀。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“耶和华—我们的上帝啊”用破折号标示同位呼语，避免将神名与称号割裂。两个目的不定式以“使我们……”统摄，保持汉语流畅；正文中的[a]、[b]均与脚注对应。
