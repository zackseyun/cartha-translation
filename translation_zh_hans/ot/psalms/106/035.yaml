  text: but they mixed with the nations and learned their practices[a][b].
translation:
  language: zh_hans
  text: 反倒与列国混杂[a]，学习他们所行的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“混在列国中”。
    reason: lexical_alternative
  - marker: b
    text: 直译“他们所做的事”或“他们的作为”；这里指列国惯常所行的事和行事方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעָרְבוּ
  choice: 与……混杂
  rationale: 希伯来语 hitpael 形式在此表示与周围族群彼此混合、交往并趋于同化。“混杂”简洁保留这种社会性混合的含义，又不额外加入“玷污”等原文未明说的评价。
- source_word: בַגּוֹיִם
  choice: 与列国
  rationale: גּוֹיִם 指各国或各族，在本诗历史语境中指迦南地周围的非以色列族群。“列国”庄重而清楚，也避免“外邦人”可能带入的后期宗教色彩。介词 ב 与该动词结合可理解为“与”或“在……中”。
- source_word: וַיִּלְמְדוּ
  choice: 学了
  rationale: qal 形式直接表示主动学习。“学了”保留以色列人主动采纳那些行为的意味，不译成被动的“受了教导”。
- source_word: מַעֲשֵׂיהֶם
  choice: 他们的行为
  rationale: מַעֲשִׂים 字面为“行为、作为”。这里指列国惯常所行的事，并由下文显出其宗教和偶像崇拜背景；译作“行为”保留原词宽度，不提前把含义收窄为特定礼俗。
theological_decisions:
- issue: 以色列与列国混合所具有的道德和宗教意味
  choice: 直译其混合并学习列国行为，负面评价由诗篇上下文显明
  alternative: 译作较中性的“住在列国中”，或强化为“因列国玷污自己”
  rationale: 原文陈述他们混合并学习，后文则揭示这种行为的罪责。译文不应淡化为单纯共居，也不应加入原文此处没有明说的“玷污”。
translation_notes:
  register: 采用现代、凝练而庄重的诗体汉语。“反倒”承接上一节未遵行命令的转折；“列国”符合诗篇语域。“行为”比“习俗”更贴近原文字面，并保留上下文逐步揭示其宗教性质的空间。
