  text: כִּֽי הִמְר֥וּ אֶת רוּח֑/וֹ וַ֝/יְבַטֵּ֗א בִּ/שְׂפָתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/033.yaml
  text: For they embittered his spirit[b][a], and he spoke rashly with his lips.
translation:
  language: zh_hans
  text: 因为他们使他心中苦恼[a]，他就冒失地开口说话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们激怒了他”；希伯来语动词可表示使人心中苦涩，也可表示激惹。
    reason: lexical_alternative
  - marker: b
    text: 这里指摩西在米利巴一时冲动地说话；参《民数记》20:10。
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此连词说明前文所述事件的缘由；“因为”自然保留了希伯来文的解释关系。
- source_word: הִמְרוּ
  choice: 使……苦恼
  rationale: 该使役形在这里可表达使人心中苦涩、受到激惹；这一译法与宾语“他的灵”搭配自然，同时以脚注保留“激怒”的可能。
- source_word: אֶת רוּחוֹ
  choice: 使他心里
  rationale: רוּחַ在此指摩西内在的心灵或情绪状态，不是圣灵；汉语用“心里”能自然表达此义，又不把含义限定为单纯的脾气。
- source_word: וַיְבַטֵּא
  choice: 冒失……说出了话
  rationale: 该动词表示发言或说出话；结合米利巴事件，语境带有负面意味，“冒失”传达未经慎思便出口的含义。
- source_word: בִּשְׂפָתָיו
  choice: 嘴唇
  rationale: 保留希伯来文具体的身体意象，而不是笼统译作“开口”或“用嘴”。
theological_decisions:
- issue: “他的灵”和“他的嘴唇”中代词所指
  choice: 两个代词都指摩西
  alternative: 指百姓整体或另一位先行词
  rationale: 诗篇106:32–33回顾米利巴事件：百姓的行为使摩西受到激惹，结果摩西冒失发言；这与民数记20:10的叙事相符，也避免无根据地把“灵”解释为圣灵。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心里苦恼”自然传达内在状态；“嘴唇冒失，说出了话”刻意保留原文“嘴唇”的具体意象及略带诗意的表达。
