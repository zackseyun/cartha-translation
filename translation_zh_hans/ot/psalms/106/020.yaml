base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/020.yaml
  text: They exchanged their glory for the image of an ox that eats grass[a][b].
translation:
  language: zh_hans
  text: 他们把自己的荣耀换成一头吃草的牛的像[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己的荣耀”也可理解为“他们荣耀的上帝”。希伯来文直译为“他们的荣耀”，以含蓄的方式指向上帝。
    reason: lexical_alternative
  - marker: b
    text: “牛”也可译作“公牛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמִירוּ
  choice: 他们把……换成
  rationale: 动词 מוּר 表示交换或以一物替代另一物；“把……换成”自然地表达以偶像取代原有对象的谴责意味。
- source_word: כְּבוֹדָם
  choice: 自己的荣耀
  rationale: 希伯来文直译为“他们的荣耀”，语境中指向上帝，但正文保留其含蓄表达，不直接增补“上帝”。现代汉语用“自己的”可清楚回指主语。
- source_word: בְּתַבְנִית
  choice: ……的像
  rationale: תַּבְנִית 可指形状、样式或形像；偶像语境中译作“像”简洁自然，并保留可见造像的含义。
- source_word: שׁוֹר
  choice: 牛
  rationale: שׁוֹר 可指牛、公牛或阉牛；“牛”保留原词较宽泛的语义，不因金牛犊背景而过度限定，脚注说明“公牛”这一可能。
- source_word: אֹכֵל עֵשֶׂב
  choice: 吃草的
  rationale: 分词短语直译为关系性修饰语“吃草的”，自然保留诗句的讽刺：他们竟以食草的受造物之像取代自己的荣耀。
theological_decisions:
- issue: “他们的荣耀”的所指
  choice: 正文保留“自己的荣耀”
  alternative: 他们荣耀的上帝／上帝
  rationale: 上下文表明其所指是上帝，但原文采用抽象而含蓄的“他们的荣耀”。保留这一措辞可维持其互文意义和神学张力，避免在正文中把解释写成明说。
translation_notes:
  register: 采用现代、庄重而简明的普通话。“把……换成……”符合当代汉语表达；“自己的荣耀”保留原文的含蓄与诗性；“吃草的牛”突出偶像不过是受造物的讽刺效果。
