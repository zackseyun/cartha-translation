  text: וַ/תֵּחָ֣שֶׁב ל֭/וֹ לִ/צְדָקָ֑ה לְ/דֹ֥ר וָ֝/דֹ֗ר עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/031.yaml
  text: And it was counted to him as righteousness from generation to generation forever[a][b].
translation:
  language: zh_hans
  text: 这就算为他的义[a]，世世代代，直到永远[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “算为”也可译作“认定为”或“记为”。希伯来语使用一种惯用表达，指某事被看作或归算为义。
    reason: lexical_alternative
  - marker: b
    text: “世世代代”原文直译为“一代又一代”，指历代延续；“直到永远”进一步强调其永久性。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּחָשֶׁב
  choice: 这就算为
  rationale: 尼斐勒式表达被动意义，即某事被认定、算作某种价值；“算为”既保留核算、归认的语感，也符合现代汉语的圣经表达习惯。
- source_word: לוֹ לִצְדָקָה
  choice: 他的义
  rationale: חשב + ל 的结构表示某事被算给某人、算作义。“算为他的义”自然简洁，并保留“义”可能涉及评价、地位或正当行为的张力，不将其窄化为单一的“义行”。
- source_word: לְדֹר וָדֹר
  choice: 世世代代
  rationale: 原文直译为“一代又一代”，是指历代延续的惯用语；“世世代代”准确而自然。
- source_word: עַד עוֹלָם
  choice: 直到永远
  rationale: 保留 עַד 的“直到”以及 עוֹלָם 的长久、永远之意，也延续诗句的庄重节奏。
theological_decisions:
- issue: 本节与创世记15:6“算为义”用语的呼应及其神学含义
  choice: 保留“算为他的义”，不加入后来的教义性解释
  alternative: 算作他的一件义行
  rationale: 原文采用“חשב + ל + צדקה”的归算表达，具有广泛的圣经互文意义；译文应保留这种共鸣，同时不预先裁定这里专指行为评价、身份地位或某套后期称义理论。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“这”承接上文非尼哈的行动；“世世代代，直到永远”保留希伯来诗句层层加强的时间表达。
