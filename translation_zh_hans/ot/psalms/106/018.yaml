  text: וַ/תִּבְעַר אֵ֥שׁ בַּ/עֲדָתָ֑/ם לֶ֝הָבָ֗ה תְּלַהֵ֥ט רְשָׁעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/018.yaml
  text: And fire burned among their company[c][b][a]; a flame consumed the wicked.
translation:
  language: zh_hans
  text: 有火在他们的会众中燃起[a][b]；烈焰吞灭了恶人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “燃起”或译“烧起来”；希伯来语动词可侧重火被点燃、突然燃烧起来。
    reason: lexical_alternative
  - marker: b
    text: “会众”或译“群体”；希伯来语指聚集在一起的共同体。
    reason: lexical_alternative
  - marker: c
    text: “吞灭”或译“烧尽”；原文动词表达猛烈、毁灭性的焚烧。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְעַר
  choice: 燃起
  rationale: בער在此指火燃烧或被点燃；“燃起”自然地表达火在群体中爆发，同时保留起火与燃烧之间的语义空间。
- source_word: אֵשׁ
  choice: 火
  rationale: 采用该词直接、具体的基本义，不作隐喻化扩展。
- source_word: בַּעֲדָתָם
  choice: 在他们的会众中
  rationale: עֵדָה指聚集的群体或会众；“会众”保留其集体含义，בַּ־按语境译为“在……中”。
- source_word: לֶהָבָה
  choice: 烈焰
  rationale: 该名词指火焰或烈火；“烈焰”与后面的强烈焚烧动词相称，也保持与上句“火”的诗体平行。
- source_word: תְּלַהֵט
  choice: 吞灭
  rationale: להט的强化词形表达猛烈且具有毁灭性的焚烧；“吞灭”在中文中自然凝练，并传达其结果。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是该复数名词化形容词的常见中文对应，保留道德定性且不额外限定性别。
theological_decisions:
- issue: 审判之火的所指
  choice: 按历史回顾的具体叙述，表达火临到以色列群体中的恶人
  alternative: 把火泛化为审判的纯粹比喻
  rationale: 本诗语境追述悖逆事件及其审判；希伯来文使用具体的火与烈焰意象，因此正文不将其寓意化，也不扩展为更广泛的教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两分句保持“火／烈焰”的平行结构；分号体现希伯来诗句的对应关系。
