  text: וַ/יְכַסּוּ מַ֥יִם צָרֵי/הֶ֑ם אֶחָ֥ד מֵ֝/הֶ֗ם לֹ֣א נוֹתָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/011.yaml
  text: The waters covered their adversaries[b][a]; not one of them remained.
translation:
  language: zh_hans
  text: 水淹没了他们的敌人[a]；他们中间一个也没有剩下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仇敌”。
    reason: lexical_alternative
  - marker: b
    text: 直译“他们中的一个也没有留下”。
    reason: literal_rendering
lexical_decisions:
- source_word: וַיְכַסּוּ
  choice: 淹没了
  rationale: כסה的基本义是“遮盖、覆盖”；在红海的叙事背景中，“淹没”自然、具体地表达水覆盖敌人的情景，又不增添原文没有明说的细节。
- source_word: מַיִם
  choice: 水
  rationale: 希伯来语形式为复数，但现代汉语通常以集合名词“水”指这里特定的海水；译成“众水”会显得较古雅。
- source_word: צָרֵיהֶם
  choice: 他们的敌人
  rationale: צָר可指敌对者、仇敌；“敌人”是现代汉语中自然且忠实的表达，“仇敌”亦可，故列入脚注。
- source_word: אֶחָד מֵהֶם
  choice: 他们中间一个也没有
  rationale: 字面为“他们中的一个”，与否定词连用时表达全然没有例外；此译保持原文强调个体无一留下的语气。
- source_word: לֹא נוֹתָר
  choice: 没有剩下
  rationale: נוֹתָר是יתר的尼法勒式，意为“被留下、剩余”；“没有剩下”直接表达其意义，避免用“没有幸存”进一步解释其死亡结局。
