  text: They joined themselves to Baal of Peor and ate sacrifices of the dead[a][b].
translation:
  language: zh_hans
  text: 他们依附于毗珥的巴力[a]，吃了死者的祭物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们与毗珥的巴力同负一轭。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“死者的祭物”；这句话可能指无生命偶像的祭物，也可能指与亡者有关的祭祀仪式。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצָּמְדוּ
  choice: 与……结盟
  rationale: צמד表示紧密相连、联结；在此敬拜背叛的语境中，“结盟”自然地表达他们主动依附巴力，同时脚注保留更形象的“与……同负一轭”。
- source_word: לְבַעַל פְּעוֹר
  choice: 与毗珥的巴力
  rationale: 按地点关联理解为“毗珥的巴力”，既保留神名与地名，也清楚表达二者关系。
- source_word: וַיֹּאכְלוּ
  choice: 吃了
  rationale: 采用简洁的叙事过去表达，准确对应其基本义，并与祭物语境自然衔接。
- source_word: זִבְחֵי
  choice: 祭物
  rationale: זֶבַח指献祭之物或祭牲；“祭物”简洁保留祭祀含义，又不将其过度具体化为祭宴。
- source_word: מֵתִים
  choice: 死者
  rationale: 原文直译为“死者／死去的”，所指可能是无生命的偶像，也可能涉及与亡者有关的仪式；正文保留其开放性，脚注说明可能含义。
theological_decisions:
- issue: “死者”（מֵתִים）的所指
  choice: 正文译作“献给死者的祭物”，不明确限定所指
  alternative: “献给无生命偶像的祭物”或“与亡者仪式有关的祭物”
  rationale: 希伯来文仅说“死者的祭物”，没有明示究竟指无生命的神像还是亡者相关礼仪。中文需补出关系才能通顺，但不应在正文中消除原有歧义；脚注同时列出主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“结盟”呈现主动依附的含义；“毗珥的巴力”沿用清晰的圣经专名表达。正文保持简洁，借脚注保留原文在“死者”所指及צמד形象上的歧义。
