source:
  edition: WLC
  text: אֲב֘וֹתֵ֤י/נוּ בְ/מִצְרַ֨יִם לֹא הִשְׂכִּ֬ילוּ נִפְלְאוֹתֶ֗י/ךָ לֹ֣א זָ֭כְרוּ אֶת רֹ֣ב חֲסָדֶ֑י/ךָ וַ/יַּמְר֖וּ עַל יָ֣ם בְּ/יַם סֽוּף׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/007.yaml
  text: Our fathers in Egypt did not understand your wondrous deeds[a]; they did not remember the abundance of your steadfast love[b], but rebelled at the sea—the Red Sea.
translation:
  language: zh_hans
  text: 我们的列祖在埃及没有明白你所行的奇事，也没有记念你丰盛的慈爱，反倒在海边，就是红海[a]，悖逆了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “红海”也可译为“芦苇海”。希伯来名称“亚姆·苏夫”（Yam Suph）传统上译作“红海”。
    reason: 保留地名 יַם־סוּף 的词汇替代译法，并更正原脚注误作“盐海”的地名错误。
lexical_decisions:
- source_word: אֲבוֹתֵינוּ
  choice: 我们的列祖
  rationale: 原文直译为“我们的父辈”。“列祖”在现代中文圣经语境中自然而庄重，既保留阳性亲属称谓，也指以色列先前的世代。
- source_word: הִשְׂכִּילוּ נִפְלְאוֹתֶיךָ
  choice: 没有明白你所行的奇事
  rationale: שׂכל 的使役式在此表示领悟、明白；נִפְלָאוֹת 指令人惊奇的作为。译文保留他们未能领会神作为的意思，而不额外说明其具体意义。
- source_word: לֹא זָכְרוּ
  choice: 没有记念
  rationale: זכר 的基本含义是记得、记念；“记念”在此既忠于原文，也可自然承载回想后作出忠信回应的语境含义。
- source_word: רֹב חֲסָדֶיךָ
  choice: 你丰盛的慈爱
  rationale: רֹב 表示丰富、众多；חֶסֶד 包含坚定、忠诚而施恩的爱。“丰盛的慈爱”简洁自然，并保留其宽广的盟约性内涵。
- source_word: וַיַּמְרוּ
  choice: 反倒……悖逆了
  rationale: מרה 表示悖逆；连接词在上下文中有转折意味。“反倒”突出他们虽见神的奇事和慈爱却仍悖逆的反差。
- source_word: עַל־יָם בְּיַם־סוּף
  choice: 在海边，就是红海
  rationale: 两个地点短语构成同位说明。中文用“就是”清楚呈现后一短语对前一短语的具体说明；יַם־סוּף 的传统地名译法“红海”置于正文，字面相关译法收入脚注。
theological_decisions:
- issue: חֶסֶד 的译法
  choice: 慈爱
  alternative: 忠贞的爱；怜悯；信实之爱
  rationale: 此词兼有恩慈、忠诚和盟约关系中的坚定之爱。“慈爱”是自然、庄重且涵盖面较广的中文表达，避免只突出怜悯或将盟约内涵解释得过满。
- issue: יַם־סוּף 的地名译法
  choice: 红海
  alternative: 芦苇海
  rationale: “红海”是通行且易识别的地名译法；由于 סוּף 通常与“芦苇”相关，脚注保留“芦苇海”，避免隐藏原文的词汇信息。
- issue: 悖逆发生地点的句法关系
  choice: 在海边，就是红海
  alternative: 在海边，在红海那里
  rationale: 原文连续使用两个介词短语，通常理解为同位地点说明。译文不把“海”解释为悖逆的对象，也不将两处地点误作先后两个场景。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语言。“列祖”“记念”“悖逆”保留经文所需的历史与道德分量；句法以“反倒”和“就是”明确转折及同位关系，避免生硬照搬希伯来语介词。
