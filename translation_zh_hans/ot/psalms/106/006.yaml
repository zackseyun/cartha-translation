base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/006.yaml
  text: We have sinned with our fathers[a]; we have done wrong[b]; we have acted wickedly.
translation:
  language: zh_hans
  text: 我们与祖先一同犯了罪[a]；我们行了不义[b]；作了恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祖先”原文直译为“我们的父辈”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们作了孽。”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: 我们……犯了罪
  rationale: חטא的Qal完成式第一人称复数，在认罪语境中概括群体所犯的罪；现代汉语用“犯了罪”自然、明确。
- source_word: עִם
  choice: 与……一同
  rationale: 介词עִם表示伴随、共同；“与……一同”保留本代人与先辈在认罪中的连带关系，而不弱化为单纯的相似。
- source_word: אֲבוֹתֵינוּ
  choice: 我们的祖先
  rationale: 字面为“我们的父辈”，在此历史回顾和群体认罪的语境中指先辈；“祖先”是自然且不限定于直接父亲的现代汉语表达。
- source_word: הֶעֱוִינוּ
  choice: 我们做了错事
  rationale: עוה的Hiphil完成式第一人称复数表示行事不正、悖谬；“做了错事”通俗自然，并保留道德过错的含义。
- source_word: הִרְשָׁעְנוּ
  choice: 行了恶
  rationale: רשע的Hiphil完成式第一人称复数表示邪恶地行事；“行了恶”简洁有力，并使三重认罪在末句达到加强。
theological_decisions:
- issue: 认罪中的群体与跨世代连带
  choice: 译作“我们与祖先一同犯了罪”，表达说话群体在认罪中将自己与先辈相联。
  alternative: 可译作“我们像祖先一样犯了罪”，但这会把共同关联收窄为行为相似。
  rationale: עִם通常表示“与、同”，而不是比较性的“像”；译文保留经文的群体性和跨世代张力，不进一步推导特定的罪责传递教义。
- issue: 三重认罪的递进
  choice: 保留“犯了罪—做了错事—行了恶”三个并列而有所加强的表达。
  alternative: 可将三词合并为一句概括性的认罪。
  rationale: 原文连续使用三个动词，形成庄重而强烈的认罪节奏；分别翻译能保存其修辞和神学分量。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“与祖先一同”保留原文的共同关联；三个短句维持希伯来文认罪的节奏与递进。所有脚注标记均已置于正文相应位置。
