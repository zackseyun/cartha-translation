id: PSA.106.41
reference: Psalms 106:41
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּתְּנֵ֥/ם בְּ/יַד גּוֹיִ֑ם וַֽ/יִּמְשְׁל֥וּ בָ֝/הֶ֗ם שֹׂנְאֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/041.yaml
  text: He gave them into the hand of the nations[b][a], and those who hated them ruled over them.
translation:
  language: zh_hans
  text: 他把他们交在列国手中[a]，恨他们的人就统治他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在……手中”是指交给对方掌控。也可译作“交在列国的权下”。
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: 他把他们交在
  rationale: נתן在“交在……手中”的结构里表示交付、交给对方掌控；“交在”既保留原文简洁，也自然表达主动交付。
- source_word: בְּיַד
  choice: 手中
  rationale: 保留希伯来语以“手”表示权力或控制的惯用比喻；现代汉语“交在……手中”同样自然易懂。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 此处指以色列以外的各国；“列国”符合诗篇的庄重语体，又避免“外邦人”可能带入的传统神学色彩。
- source_word: וַיִּמְשְׁלוּ
  choice: 统治
  rationale: 准确表达 משל 的“治理、管辖”之义；结合仇恨者这一主语，负面语境已很清楚，无须加强为“压制”或“奴役”。
- source_word: בָהֶם
  choice: 他们
  rationale: 与 משל 连用时，介词 ב 表示统治的对象；汉语直接说“统治他们”最自然。
- source_word: שֹׂנְאֵיהֶם
  choice: 恨他们的人
  rationale: 保留分词所表达的主动仇恨，比概括为“敌人”更贴近原文。
theological_decisions:
- issue: 上帝在以色列受审判中的主动作用
  choice: 译为“他把他们交在列国手中”，直接保留上帝主动交付的表述。
  alternative: 译成上帝只是容许他们落入列国权下。
  rationale: 原文以 נתן 明确陈述隐含主语“他”的行动，并非仅仅许可；译文不应缓和这一神学张力，也不应添加原文没有说明的内容。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。“列国”简洁凝练；“交在……手中”保留原文意象，并以脚注说明其权力含义。
