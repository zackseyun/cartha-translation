  text: וַ/יֵּרָגְנ֥וּ בְ/אָהֳלֵי/הֶ֑ם לֹ֥א שָׁ֝מְע֗וּ בְּ/ק֣וֹל יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/025.yaml
  text: So they grumbled in their tents[b][a]; they did not listen to the voice of Yahweh.
translation:
  language: zh_hans
  text: 于是，他们在自己的帐篷里发怨言[a]，不听雅威的声音[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发怨言”也可译作“低声抱怨”或“发牢骚”；原文动词表达因不满而嘀咕、抱怨。
    reason: lexical_alternative
  - marker: b
    text: “不听雅威的声音”也可译作“不听从雅威”或“不顺服雅威”。这里的希伯来语习语既有听见、聆听之意，也常包含听从、服从之意。“雅威”传统上也译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרָגְנוּ
  choice: 于是……发怨言
  rationale: רגן表示因不满而低声抱怨、发牢骚；“发怨言”自然庄重，也保留其负面含义。句首“于是”体现וַ所承接的叙事结果。
- source_word: בְאָהֳלֵיהֶם
  choice: 在自己的帐篷里
  rationale: אֹהֶל具体指“帐篷”，符合旷野背景，不宜泛化为“住处”；“自己的”清楚表达第三人称复数所属关系。
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: 不听……的声音
  rationale: שׁמע בקול既保留“听声音”的意象，又常含听从、顺服之意。正文采用较贴近原文的表达，并以脚注说明其语用含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
theological_decisions:
- issue: שׁמע בקול是否直接译为“顺服”
  choice: 正文译作“不听雅威的声音”
  alternative: “不听从雅威”或“不顺服雅威”
  rationale: 该希伯来习语确实蕴含听从、服从，但正文保留听觉意象和原文张力，脚注再交代其可指不听从或不顺服。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非一般称号；“雅威”是现代汉语中较直接的学术性音译。为便于熟悉传统译名的读者辨认，在脚注说明“耶和华”这一传统译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“帐篷”保留旷野叙事的具体图景；“发怨言”符合现代圣经语体而不过分古雅。正文保持原文两个并列分句的简洁力度，并把词义范围及神名传统译法置于脚注。
