  text: מִֽ֭הֲרוּ שָׁכְח֣וּ מַעֲשָׂ֑י/ו לֹֽא חִ֝כּ֗וּ לַ/עֲצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/013.yaml
  text: They quickly forgot his works[a]; they did not wait for his counsel.
translation:
  language: zh_hans
  text: '他们很快就忘了他所做的事；

    不等候他的指引。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “指引”或译“谋略”“计划”或“旨意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהֲרוּ
  choice: 很快就
  rationale: 该词表达急速、仓促；与“忘了”连用，译为“很快就忘了”自然地保留了行动之迅速，不仅表示时间先后。
- source_word: שָׁכְחוּ
  choice: 忘了
  rationale: שכח 的 Qal 完成式第三人称复数，直译为“忘了”，符合诗篇叙事语境。
- source_word: מַעֲשָׂיו
  choice: 他所做的事
  rationale: מעשה 指行为、作为；此处指上帝先前的作为。“他所做的事”比“他的工作”更符合现代汉语，也清楚保留原义。
- source_word: לֹא חִכּוּ
  choice: 不等候
  rationale: חכה 的基本义是“等候”。译作“不等候”保留原文简洁的否定陈述及较庄重的诗体语域。
- source_word: לַעֲצָתוֹ
  choice: 他的指引
  rationale: עצה 可指劝告、谋略、计划或旨意。结合“不等候”，这里的“指引”自然表达他们没有等候上帝指示，同时避免把词义限定为预定的计划。
theological_decisions:
- issue: עֵצָה 在本节所指的上帝之意
  choice: 他的指引
  alternative: 他的谋略／计划／旨意
  rationale: “指引”保留以色列没有等候上帝引导的关系性含义，又不把该词收窄为神学意义上的预定计划。脚注列出原词可含“谋略、计划或旨意”，保留其语义和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。两行结构对应希伯来诗句的平行表达；“很快就”传达仓促感，“等候”保留经文语体。脚注标记置于相关词句之后。
