base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/043.yaml
  text: Many times he delivered them[b][a], but they were rebellious in their counsel, and they were brought low by their iniquity.
translation:
  language: zh_hans
  text: 他屡次搭救他们；他们却按自己的谋算行悖逆之事[a]，因自己的罪孽而陷入卑微[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在自己的谋算中悖逆”或“按自己的主意悖逆”。这里的希伯来语可指谋算、计划、主意或意图。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被降为卑微”“沉陷下去”或“日渐衰弱”。这里的希伯来语动词可表示变得低微、下沉或衰弱。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעָמִים רַבּוֹת
  choice: 屡次
  rationale: 该短语表示许多次、反复发生；“屡次”简洁自然，并保留重复性。
- source_word: יַצִּילֵם
  choice: 搭救他们
  rationale: נצל 的使役形表示救出、解救；“搭救”在现代汉语中自然，也准确表达从危难中救出的意思。
- source_word: וְהֵמָּה
  choice: 他们却
  rationale: 独立代词强化主语，并与上句形成鲜明转折；“却”体现这种对比。
- source_word: יַמְרוּ
  choice: 悖逆
  rationale: מרה 表示反抗、悖逆；用动词“悖逆”贴近希伯来语形式，同时保留其道德分量。
- source_word: בַעֲצָתָם
  choice: 在自己的谋算中
  rationale: עֵצָה 可指谋算、计划、主意或意图；此译保留介词结构及词义的开放性，不把它限定为单一方案或正式劝告。
- source_word: וַיָּמֹכּוּ
  choice: 衰败
  rationale: מוך 可表示变得低微、下沉或衰弱；“衰败”自然地表达因罪孽而陷入低落、败坏的结果，其他可能含义列入脚注。
- source_word: בַּעֲוֺנָם
  choice: 因自己的罪孽
  rationale: עָוֹן 可指罪孽、罪责或罪所招致的后果；“罪孽”保留其道德和神学分量，“因”表达此处很可能具有的原因关系。
theological_decisions:
- issue: 搭救者的身份
  choice: 用“他”承接上下文，不在本节重复补出“耶和华”或“上帝”
  alternative: 他（耶和华）屡次搭救他们
  rationale: 希伯来语动词只有第三人称阳性单数主语，未在本节重述神名；上下文已表明搭救者是上帝，因此保留原文的简约。
- issue: עָוֹן 的道德含义及因果关系
  choice: 译作“因自己的罪孽”
  alternative: “在自己的罪责中”或“因自己的罪所受的惩罚”
  rationale: 原词兼有罪孽、罪责及罪果等含义。正文保留道德重量和最自然的因果理解，但不把衰败明确解释为某一种特定惩罚机制。
- issue: 悖逆是行动还是持续倾向
  choice: 采用动词“悖逆”，不额外限定为一次行为或固定性情
  alternative: “顽梗悖逆”或“存着悖逆的心”
  rationale: 希伯来语是动词形式，语境可暗示反复或顽梗，但正文不添加原文未明说的心理状态，从而保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“屡次……却……”突出上帝反复搭救与百姓悖逆之间的反差；分号保留两部分的诗性转折。正文中的[a]、[b]分别紧随存在词义选择的位置。
