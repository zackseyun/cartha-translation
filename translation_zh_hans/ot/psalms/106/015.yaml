    rationale: 汉语中“消瘦”通常形容人或身体；“生命消瘦”易造成语义和表达上的阻滞。原文的 בְּנַפְשָׁם 指向他们的生命、本人或整个存在，宜以“整个人”一类自然表达处理。
  - severity: low
