  text: וַ/יִּתֵּ֣ן לָ֭/הֶם שֶׁאֱלָתָ֑/ם וַ/יְשַׁלַּ֖ח רָז֣וֹן בְּ/נַפְשָֽׁ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/015.yaml
  text: So he gave them what they asked for[c][b][a], but sent leanness into their soul.
translation:
  language: zh_hans
  text: 他就把他们所求的赐给他们，却使他们整个人衰弱消瘦[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “整个人”原文也可指“生命”“自身”或“性命”。
    reason: lexical_alternative
  - marker: b
    text: “衰弱消瘦”也可译作“衰耗”或“瘦弱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 赐给
  rationale: נתן的基本义是“给”；在上帝回应人所求的语境中，“赐给”自然、庄重，又不增加“应允”等解释性成分。
- source_word: שֶׁאֱלָתָם
  choice: 他们所求的
  rationale: שֶׁאֱלָה可指“请求”或“所求之物”。“他们所求的”既符合现代汉语，也保留两者之间的语义联系。
- source_word: וַיְשַׁלַּח
  choice: 却使
  rationale: 动词字面为“差遣、送出”。此处后句与蒙赐所求形成明显反差，因此用“却”；汉语说“使……消瘦”比“把消瘦送入……”自然，同时保留其施加审判的含义。
- source_word: רָזוֹן
  choice: 消瘦
  rationale: רָזוֹן表示瘦弱、消瘦或衰耗。“消瘦”保留身体衰减的意象，且不将其过度具体化为某种疾病。
- source_word: בְּנַפְשָׁם
  choice: 他们的生命
  rationale: נֶפֶשׁ可指生命、自身、性命或人本身，不必专指与身体分离的“灵魂”。此处“生命”能自然表达审判深入其生存与全人的意味。
theological_decisions:
- issue: 审判语境中נֶפֶשׁ的含义
  choice: 正文译作“生命”
  alternative: 灵魂；自身；全人
  rationale: 希伯来词的范围比现代汉语“灵魂”更广。译作“生命”避免把经文限定为非物质灵魂所受的影响，同时脚注保留“自身、全人”等可能。
- issue: 两分句之间的关系
  choice: 用“却”表达转折
  alternative: 用“并且”保留纯并列形式
  rationale: 原文连接词形式上可译“并且”，但上下文呈现上帝赐下所求之物同时施行审判的强烈反差。“却”将这一语用关系自然地带入汉语，而不消除其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“于是”承接叙事，“赐给……却使……”保持两个动作的紧凑对照。脚注标记均置于相关短语之后。
