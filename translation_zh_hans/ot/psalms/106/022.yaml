  text: wondrous things in the land of Ham[b][a], awesome things by the Red Sea.
translation:
  language: zh_hans
  text: 在含地[b]所行的奇事，在红海[a]边所行的可畏之事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“芦苇海”，传统译作“红海”。
    reason: lexical_alternative
  - marker: b
    text: “含”在这里是埃及的诗歌称呼。
    reason: cultural_note
lexical_decisions:
- source_word: נִפְלָאוֹת
  choice: 奇事
  rationale: 该词指超乎寻常、令人惊奇的作为；“奇事”简洁自然，并与下句“可畏之事”形成诗歌平行。
- source_word: בְּאֶרֶץ
  choice: 在……地
  rationale: 介词 בְּ 与 אֶרֶץ 在此表示地点；“在含地”既准确又符合中文诗体表达。
- source_word: חָם
  choice: 含
  rationale: 保留希伯来文本中的专名，不直接以解释性的“埃及”替换；脚注说明其在本语境中的所指。
- source_word: נ֝וֹרָאוֹת
  choice: 可畏之事
  rationale: 该词源于 ירא，表示使人敬畏或震惧的作为；“可畏”保留敬畏与威严的色彩，避免“可怕”可能带来的纯负面意味。
- source_word: עַל
  choice: 在……边
  rationale: עַל 与地理实体连用可表示在其旁边或临近之处；“在红海边”是自然的现代汉语。
- source_word: יַם סוּף
  choice: 红海
  rationale: 采用中文圣经传统且广为人知的名称“红海”；原文也可能理解为“芦苇海”，在脚注中保留这一词义可能性。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，以“奇事／可畏之事”再现原文平行结构。为免首行成为不完整的名词短语，补出原文语境蕴含的“所行的”；脚注标记均紧随其所说明的词语。
