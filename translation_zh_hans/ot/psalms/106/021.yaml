  text: שָׁ֭כְחוּ אֵ֣ל מוֹשִׁיעָ֑/ם עֹשֶׂ֖ה גְדֹל֣וֹת בְּ/מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/021.yaml
  text: They forgot God their Savior[a], who had done great things in Egypt.
translation:
  language: zh_hans
  text: 他们忘了神，就是他们的救主[a]；他曾在埃及行了大事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“拯救他们的那一位”或“他们的解救者”。希伯来语分词可强调神是施行拯救的那一位。
    reason: 词义与语法形式的另一种表达
lexical_decisions:
- source_word: שָׁכְחוּ
  choice: 他们忘了
  rationale: 该词是完成式，诗篇在追述以色列过去的行为；用“忘了”自然表达已经发生的动作。
- source_word: אֵל
  choice: 神
  rationale: 此处是对以色列之神的称呼；译作“神”准确自然，也不额外强化原句未特别突出的“大能者”含义。
- source_word: מוֹשִׁיעָם
  choice: 他们的救主
  rationale: 该词是使役词干分词，并带第三人称阳性复数后缀，既可表示“他们的救主”，也可展开为“拯救他们的那一位”。正文采用简洁而有尊严的名词表达，并以脚注保留分词的动态意味。
- source_word: עֹשֶׂה
  choice: 他曾……行了
  rationale: 该分词修饰神，指神在埃及所施行的作为。汉语用独立分句表达更自然；“曾”交代这些大事先于百姓忘记神。
- source_word: גְדֹלוֹת
  choice: 大事
  rationale: 这是形容词复数的名词化用法，指伟大、非凡的作为；“大事”简洁并保留原文较宽泛的表达。
- source_word: בְּמִצְרָיִם
  choice: 在埃及
  rationale: 介词在此表示地点，直译为“在埃及”清楚自然。
theological_decisions:
- issue: 神的称号 אֵל 是否应明确译出“大能者”的意味
  choice: 神
  alternative: 大能者；大能的神
  rationale: 上下文主要是在指出以色列忘记了拯救他们的神，而不是刻意建立一个强调能力的特殊称号；“神”既忠实又避免增加原文未凸显的神学强调。
- issue: מוֹשִׁיעָם 译作身份称号还是动态描述
  choice: 他们的救主
  alternative: 拯救他们的那一位；他们的解救者
  rationale: “他们的救主”保留神作为拯救者的持续身份，同时简洁自然；脚注说明分词也可突出正在或一贯施行拯救的那一位，以保留原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就是”清楚表达“神”与“他们的救主”之间的同位关系；分号把神的身份与他在埃及的作为连接起来，避免汉语长定语显得生硬。
