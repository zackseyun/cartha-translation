  text: וַֽ֭/יּוֹשִׁיעֵ/ם מִ/יַּ֣ד שׂוֹנֵ֑א וַ֝/יִּגְאָלֵ֗/ם מִ/יַּ֥ד אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/010.yaml
  text: So he saved them from the hand of the one who hated them[b][a], and redeemed them from the hand of the enemy.
translation:
  language: zh_hans
  text: 他从那恨他们的人手中拯救了他们[a]，又从仇敌手中救赎了他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“解救”；这里的希伯来语动词可指使人脱离危险。
    reason: lexical_alternative
  - marker: b
    text: “救赎”也可译作“搭救”或“赎回”；这里的希伯来语含有介入而将人取回或解救出来的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: 拯救了他们
  rationale: ישׁע在此表示从危险或辖制中施行救助。“拯救”既符合叙事语境，也保留神施行救恩的分量；完成体叙事形式译为“了”。
- source_word: מִיַּד
  choice: 从……手中
  rationale: 保留希伯来语以“手”表示权势或控制的惯用意象；现代汉语“从……手中”自然清楚，两处均照应原文。
- source_word: שׂוֹנֵא
  choice: 恨他们的那一位
  rationale: 原文是单数的实体化分词。译文保留单数，不将其顺译为复数；宾语“他们”由上下文自然补明。
- source_word: וַיִּגְאָלֵם
  choice: 救赎了他们
  rationale: גאל含有介入搭救、赎回或取回之意。“救赎”保留其与一般解救有别的词义和神学色彩，同时不额外规定赎价等原文未明说的细节。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 保留原文单数，并与前半句单数的敌对者形成诗意平行；汉语无须添加不定或定冠词。
theological_decisions:
- issue: 是否把ישׁע与גאל两个平行动词合并为同一个“解救”概念
  choice: 分别译作“拯救”和“救赎”
  alternative: 两处都译作“解救”或“救出”
  rationale: 原文刻意并用两个相关而不完全相同的词。分别翻译可保存诗歌平行结构及救助与赎回之间的语义张力，又不引入特定宗派解释。
- issue: 敌对者的语法数是否顺译为复数
  choice: 保留单数：“恨他们的那一位”与“仇敌”
  alternative: 译作“恨他们的人”或“仇敌们”
  rationale: 两处希伯来语均为单数。虽然语境可能把埃及或法老视为集体性的敌对权势，译文仍不消除原文的单数表达及其可能的集体指向。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“从……手中”保留原文意象且符合汉语习惯；用“又”连接两个平行分句，体现诗句的递进与对应。所有注脚标记均紧随其所说明的词语。
