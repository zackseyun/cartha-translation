  naturalness: 修订后以“在他面前站在破口处”清楚表达地点与对象；“使他的烈怒转回，免得毁灭他们”在现代庄重书面语中自然，并保留原文的反事实句式和意象。
  terminology: “拣选”“烈怒”“破口”均适合圣经庄重语体。“烈怒”可传达חֵמָה的强烈怒气；不应以“审判”等抽象词替换。
