base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/023.yaml
  text: So he said he would destroy them—had not Moses[a], his chosen one, stood in the breach before him to turn back his wrath from destroying.
translation:
  language: zh_hans
  text: 于是他说要消灭他们；若不是他所拣选的摩西在他面前站在破口处[a]，使他的烈怒转回，免得毁灭他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “站在破口处”也可译作“站在缺口中”。希伯来文的图像是站在城墙的破口处；这里用来描述摩西的代求。
    reason: 说明原文比喻及词义替代译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 所以他说
  rationale: 叙事性的连接词承接上文并带出结果；“所以”自然表达其后果关系。
- source_word: לְהַשְׁמִידָם
  choice: 要消灭他们
  rationale: לְ 加不定式在“说”之后表示拟采取的行动；“消灭”准确传达 השמיד 的审判语境，又不额外强调彻底灭绝的哲学含义。
- source_word: לוּלֵי
  choice: 若不是
  rationale: 该词引入反事实条件；“若不是”在现代汉语中清楚而庄重。
- source_word: בְחִירוֹ
  choice: 他所拣选的
  rationale: 保留摩西蒙上帝选择的含义，同时避免引入后世教义术语的额外负载。
- source_word: עָמַד בַּפֶּרֶץ
  choice: 站在……破口上
  rationale: 保留城墙出现破口、有人挺身堵住的具体意象，而不直接释义为“代求”。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 代词在语境中自然指上帝；此译保留摩西在上帝面前介入的关系与场景。
- source_word: לְהָשִׁיב חֲמָתוֹ
  choice: 使他的烈怒转回
  rationale: 使役式 שוב 表示使之转回；“烈怒”传达 חֵמָה 的强度，并保留拟人化的神圣震怒语言。
- source_word: מֵהַשְׁחִית
  choice: 不施毁灭
  rationale: 介词 מִן 与不定式在此表达阻止结果；汉语用“不施毁灭”自然呈现烈怒被转回、毁灭因而没有实施。
theological_decisions:
- issue: 上帝震怒的拟人化表述
  choice: 保留“他的烈怒”及其“转回”的说法
  alternative: 改译为“免去审判”或弱化为“怒气”
  rationale: 原文明确描绘上帝的烈怒因摩西介入而转回；译文不将这一神学张力抽象化或解释掉。
- issue: 摩西站在破口上的代求意象
  choice: 正文保留“站在……破口上”的比喻
  alternative: 直接译为“为他们代求”
  rationale: 原文采用守住城墙破口的具体图像来描述摩西的中保性介入；正文保留图像，脚注说明其含义。
- issue: 反事实条件与毁灭宣告的关系
  choice: 译作“若不是……”，表明摩西的介入阻止了毁灭
  alternative: 译作一般条件“除非……”
  rationale: לוּלֵי 表达与实际情况相反的条件：摩西确实挺身而出，毁灭因而未实施。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“破口”“烈怒”“转回”等原文核心意象；以分号分隔毁灭宣告与反事实条件，使较长句式清楚流畅。
