  text: וַ/יְקַנְא֣וּ לְ֭/מֹשֶׁה בַּֽ/מַּחֲנֶ֑ה לְ֝/אַהֲרֹ֗ן קְד֣וֹשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/016.yaml
  text: They became jealous of Moses in the camp[a], and of Aaron, the holy one of Yahweh.
translation:
  language: zh_hans
  text: 他们在营中嫉妒摩西，也嫉妒亚伦——雅威的圣者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“归雅威为圣的人。”
    reason: 原文קְדוֹשׁ יְהוָה既可理解为“雅威的圣者”，也可侧重亚伦是“归雅威为圣的”。
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: 嫉妒
  rationale: קנא在此以摩西和亚伦为对象，结合《民数记》16章的背景，表示因不满其地位而产生嫉妒；现代汉语用“嫉妒”直接、自然。希伯来语的连续式在诗篇的历史回顾中主要推进叙事，不必机械译出“开始”。
- source_word: לְמֹשֶׁה … לְאַהֲרֹן
  choice: 嫉妒摩西，也嫉妒亚伦
  rationale: 介词לְ在קנא之后标示嫉妒所针对的对象；汉语及物结构无需另译介词，并重复“嫉妒”以清楚呈现两个并列对象。
- source_word: בַּמַּחֲנֶה
  choice: 在营中
  rationale: מַחֲנֶה指旷野中的以色列营地；“在营中”简洁保留地点信息。
- source_word: קְדוֹשׁ יְהוָה
  choice: 雅威的圣者
  rationale: 该短语同位说明亚伦是特别归属于雅威、分别为圣的人。“雅威的圣者”保留原文简练结构及其可能兼具的归属和奉献含义；另一种关系可译为“归雅威为圣的人”，收入脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用神的专名四字神名；以“雅威”音译，区别于“主”这一称号。
theological_decisions:
- issue: 亚伦的称号קְדוֹשׁ יְהוָה所表达的关系
  choice: 雅威的圣者
  alternative: 归雅威为圣的人
  rationale: 原文的名词并置/属格式关系可以突出亚伦是雅威所分别为圣的圣者，也可侧重他归雅威为圣。正文保留较凝练的“雅威的圣者”，脚注呈现后一种理解，不把祭司身份等未明说的信息加进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。将地点置于句首附近，使汉语语序自然；破折号标明“雅威的圣者”与“亚伦”是同位关系。脚注标记紧随实际存在译法差异的称号，而非置于“营中”之后。
