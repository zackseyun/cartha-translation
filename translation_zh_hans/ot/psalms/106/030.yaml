    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 站出来
  rationale: עמד本义为“站立、起来”；在叙事推进中，“站出来”既保留动作，也自然表达采取果断行动的意味。
- source_word: פִּינְחָס
  choice: 非尼哈
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וַיְפַלֵּל
  choice: 干预
  rationale: 此处פלל的Piel形式可能具有司法裁断或居间代求的意味；结合《民数记》25章的背景，“干预”以较宽泛的方式保留其语义张力，不把行动仅限定为祷告或行刑。
- source_word: וַתֵּעָצַר
  choice: 止住了
  rationale: עצר的Niphal形式表示被遏止、停下；“止住了”自然清楚，并保留被动结果的含义。
- source_word: הַמַּגֵּפָה
  choice: 瘟疫
  rationale: מגפה指致命的灾疫或疫病；“瘟疫”符合本处语境，也与《民数记》25章的事件呼应。
theological_decisions:
- issue: וַיְפַלֵּל所指非尼哈行动的性质
  choice: 正文采用含义较宽的“干预”
  alternative: 施行裁断；祷告（代求）
  rationale: 诗篇回顾《民数记》25章时，此动词既可从司法处置角度理解，也可带有居间代求的力量。正文不将其窄化，脚注保留主要备选理解。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“站出来干预”适合诗篇叙事性回顾的语气；“便……就……”清楚呈现行动与瘟疫停止之间的紧密承接关系。
