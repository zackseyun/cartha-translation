  text: לֹֽא הִ֭שְׁמִידוּ אֶת הָֽ/עַמִּ֑ים אֲשֶׁ֤ר אָמַ֖ר יְהוָ֣ה לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/034.yaml
  text: They did not destroy the peoples whom Yahweh had told them to destroy[a].
translation:
  language: zh_hans
  text: 他们没有消灭耶和华曾告诉他们要消灭的那些民族[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于：“他们没有消灭那些民族，就是耶和华对他们说的那些。”原文在“耶和华对他们说”之后省略了所说的内容；正文按上下文补出“要消灭”。
    reason: 原文存在省略，正文为使汉语清楚而补出隐含内容。
lexical_decisions:
- source_word: לֹא
  choice: 没有
  rationale: 以现代汉语常用的否定完成式表达过去未曾实行的行动。
- source_word: הִשְׁמִידוּ
  choice: 消灭
  rationale: שׁמד 的使役形表示使之毁灭或除去；“消灭”力度充分，又不额外限定具体手段。
- source_word: אֶת הָעַמִּים
  choice: 那些民族
  rationale: עַמִּים 是“民、民族”的复数；“那些民族”自然保留多个族群的含义，且由定冠词表明所指明确。
- source_word: אֲשֶׁר
  choice: ……的那些
  rationale: 用汉语定语结构自然表达关系从句，使“那些民族”成为前述行动及后述命令所涉及的对象。
- source_word: אָמַר
  choice: 吩咐
  rationale: 该词本义为“说”，但此处后接“对他们”且内容省略；上下文显示这是要求他们采取行动的话。“吩咐”在汉语中自然表达此语境，同时脚注保留原文的省略现象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名的通行音译“耶和华”，将其作为专名而非以称号代替。
- source_word: לָהֶם
  choice: 他们
  rationale: 在“吩咐他们消灭”的结构中自然表达希伯来文的间接宾语。
theological_decisions:
- issue: “耶和华对他们说”的内容在原文中省略
  choice: 正文补出“消灭”
  alternative: 译作“耶和华对他们所说的那些民族”，不补出命令内容
  rationale: 希伯来文直译近于“他们没有消灭耶和华对他们说的那些民族”，句意留有省略。根据本节前半句及诗篇所回顾的背景，所隐含的是消灭这些民族的要求。正文补出“消灭”使现代汉语通顺，但用脚注明示这是按上下文补足，避免掩盖原文形式上的含混。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那些民族”比“列国”更直接呈现复数族群含义；句式简洁，适合诗篇叙事性回顾的语气。
