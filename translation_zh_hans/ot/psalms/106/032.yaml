  text: וַ֭/יַּקְצִיפוּ עַל מֵ֥י מְרִיבָ֑ה וַ/יֵּ֥רַע לְ֝/מֹשֶׁ֗ה בַּ/עֲבוּרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/032.yaml
  text: They provoked anger at the waters of Meribah[b][a], and it went badly for Moses because of them.
translation:
  language: zh_hans
  text: 他们在米利巴[a]的水边激起怒气[b]，摩西也因他们而遭遇不幸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米利巴”意为“争闹”或“争竞”。
    reason: cultural_note
  - marker: b
    text: 或译：“他们在米利巴的水边惹他发怒。”本行希伯来文没有明确说出被激怒的是谁。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְצִיפוּ
  choice: 惹起了怒气
  rationale: 该词是קצף的使役形式，表示使怒气发作或引起愤怒。原文没有明说谁发怒，因此正文不补出宾语。
- source_word: עַל מֵי מְרִיבָה
  choice: 在米利巴水边
  rationale: עַל在此与地点短语连用，指事件发生之处；מְרִיבָה作为地名音译为“米利巴”，מֵי则译为“水边”，使现代汉语表达自然，同时保留地点意象。
- source_word: וַיֵּרַע לְמֹשֶׁה
  choice: 摩西也……遭遇不幸
  rationale: רעע在这里表达对摩西产生了不利后果，却没有具体说明是什么；“遭遇不幸”保留这种宽泛的负面结果，也避免将其误解为摩西本身变得邪恶。
- source_word: בַּעֲבוּרָם
  choice: 因他们而
  rationale: 该短语在此表示原因，说明摩西的不利遭遇与众人的行为有关。
theological_decisions:
- issue: 摩西遭遇不幸的性质与责任归属
  choice: 只说明摩西因众人而遭遇不幸，不在本节内进一步界定责任。
  alternative: 明确解释为摩西在米利巴犯罪所受的惩罚，或只强调百姓有罪而排除摩西的责任。
  rationale: 本节希伯来文仅陈述事情对摩西产生了不利后果，并将其与众人联系起来；究竟侧重摩西的过失、百姓的激怒，还是两者兼有，须由上下文呈现，不应在译文中预先消解这种张力。
- issue: 被激怒者的身份
  choice: 正文用“惹起了怒气”，不明确补出对象。
  alternative: 译作“惹他发怒”或明确写成“惹上帝发怒”。
  rationale: 动词本身带有使人发怒的含义，但本行没有明说宾语。虽然语境可能指向上帝，正文仍保留原文的省略，并在脚注列出自然的另一译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“惹起了怒气”保留原文未明说受事者的特点；“遭遇不幸”清楚表达不利后果，却不擅自补充具体惩罚。地名采用通行音译“米利巴”，并以脚注说明其含义。
