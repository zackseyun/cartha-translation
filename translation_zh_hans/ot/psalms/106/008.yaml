base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/008.yaml
  text: Yet he saved them for the sake of his name[c][b][a], to make his might known.
translation:
  language: zh_hans
  text: 然而[a]，他为了自己的名[b]拯救他们，好使人知道他的大能[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “然而”也可译作“并且”或“但”；希伯来语连接词可有不同译法，此处与上一节形成转折。
    reason: lexical_alternative
  - marker: b
    text: “为了自己的名”也可理解为“为了自己的名声”或“为了自己的声誉”；不过，希伯来语的“名”常含有上帝所启示的身份、品格与尊荣等更丰富的意义。
    reason: lexical_alternative
  - marker: c
    text: “大能”也可译作“能力”或“威力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: 然而，他……拯救他们
  rationale: ישׁע意为“拯救、解救”。结合上一节以色列人的悖逆，句首ו在此具有明显的转折作用；“然而”自然传达这种对比，同时保留叙事诗歌的庄重感。
- source_word: לְמַעַן שְׁמוֹ
  choice: 为了自己的名
  rationale: לְמַעַן可表示目的或缘由；“为了”兼顾这两方面。保留“名”，不缩减为“名声”，因为希伯来表达还包含上帝所启示的身份、品格与尊荣。
- source_word: לְהוֹדִיעַ
  choice: 好使人知道
  rationale: ידע的使役形不定式表示“使……知道”。原文未明说认知者是谁，中文用泛指的“人”补足自然句法，而不限定具体对象。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，现代汉语中由语序体现。
- source_word: גְּבוּרָתוֹ
  choice: 他的大能
  rationale: גְּבוּרָה可指能力、威力或英勇作为；此处单数抽象义较合适。“大能”在现代中文圣经语体中庄重而易懂，也能表达上帝彰显出来的强大能力。
theological_decisions:
- issue: “为了自己的名”的含义
  choice: 保留“名”，表达上帝施行拯救是为了他自己的名，即其所启示的身份、品格与尊荣。
  alternative: 译作“为了自己的名声”或“为了自己的声誉”。
  rationale: “名声”能体现公开声誉，却容易将希伯来语“名”的神学内涵缩窄为公众形象；直译“名”可保留其丰富含义和经文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为了自己的名”保留原文核心意象；“好使人知道”以中文自然表达原文使役结构，并让“人”保持泛指。
