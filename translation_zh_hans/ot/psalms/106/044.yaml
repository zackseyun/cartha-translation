  text: וַ֭/יַּרְא בַּ/צַּ֣ר לָ/הֶ֑ם בְּ֝/שָׁמְע֗/וֹ אֶת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/044.yaml
  text: Yet he saw their distress when he heard their cry,[a]
translation:
  language: zh_hans
  text: 然而，他听见他们的呼求时，就看见他们的困苦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“然而，他听见他们的呼求时，就看见临到他们的苦难。”
    reason: 短语בַּצַּר לָהֶם可理解为领属关系“他们的困苦”，也可较明确地表达为“临到他们的苦难”。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 就看见
  rationale: ראה在叙事形式中基本义为“看见”；此处也含留意、顾念之意，但正文保留希伯来语直接而有力的表达。
- source_word: בַּצַּר לָהֶם
  choice: 他们的困苦
  rationale: צַר表示困境、苦难或患难；לָהֶם可按汉语习惯与前词合译为领属结构“他们的困苦”。
- source_word: בְּשָׁמְעוֹ
  choice: 他听见……时
  rationale: 介词ב与不定词结构在这里自然表达时间关系，译为“……时”既贴近原文，也符合现代汉语。
- source_word: רִנָּתָם
  choice: 他们的呼求
  rationale: רִנָּה可指响亮的喊声；在受苦的语境中是向神发出的呼喊或求告，“呼求”准确传达这一语用含义。
- source_word: וַ
  choice: 然而
  rationale: ו基本义为连接词“而、并且”，但本节承接以色列悖逆受罚的叙述，转入神施怜悯的回应；“然而”恰当地显出逆转而不增添新内容。
theological_decisions:
- issue: 开头连接词在审判之后转向怜悯时的语篇作用
  choice: 译作带转折意味的“然而”
  alternative: 译作一般连接词“于是”或“他就”
  rationale: 希伯来语ו可只表示连接或顺承，但上下文突出神在百姓悖逆、受压之后仍垂听呼求；转折译法保留审判与怜悯之间的张力。
- issue: “看见”是否解释为神主动眷顾
  choice: 正文保留“看见”
  alternative: 译作“看顾”或“留意”
  rationale: 上下文确有神眷顾之意，但原词首先是“看见”。保留直译可避免在正文中提前解释神行动的具体性质。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“困苦”“呼求”是普通读者易懂且适合诗篇语体的词；句序按汉语习惯将时间从句前置，同时保留原文的核心谓语“看见”。
