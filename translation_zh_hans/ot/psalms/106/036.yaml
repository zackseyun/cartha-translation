  text: They served their idols[a], and they became a snare to them.
translation:
  language: zh_hans
  text: 他们事奉他们的偶像[a]；这些偶像就成了他们的网罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们敬拜他们的偶像；这些偶像就成了他们的陷阱。”
    reason: 说明עבד在此宗教语境中可译作“敬拜”，而מוֹקֵשׁ也可译作“陷阱”。
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: 敬奉
  rationale: עבד在此指向假神所作的宗教性服事。“敬奉”既保留服事、事奉之意，也让现代读者清楚看出敬拜语境；比单用“服事”更自然，又不像“敬拜”那样完全收窄词义。
- source_word: עֲצַבֵּיהֶם
  choice: 自己的偶像
  rationale: עֲצַבִּים在此通常指受崇奉的偶像，并带有论战性的贬义。“偶像”比“雕像”或“形像”更准确地表达其宗教所指；“自己的”自然呈现第三人称复数所有后缀。
- source_word: וַיִּהְיוּ
  choice: 就成了
  rationale: היה与לְמוֹקֵשׁ连用，表达结果或所起的作用。“成了”体现这些偶像最终对敬奉者产生的后果；“就”自然连接前后两分句，但不额外说明因果机制。
- source_word: לָהֶם
  choice: 他们的
  rationale: 介词ל表示与这些人相关并临到他们的作用。中文“成了他们的网罗”比直译“对他们成了网罗”更自然，意义仍是这网罗使他们受害。
- source_word: לְמוֹקֵשׁ
  choice: 网罗
  rationale: מוֹקֵשׁ指捕捉猎物的套索或陷阱，也常比喻使人在道德或宗教上陷入祸患之物。“网罗”保留经文形象和庄重语体。
theological_decisions:
- issue: “这些偶像就成了他们的网罗”中主语的所指
  choice: 明确补出“这些偶像”，指偶像成了敬奉者的网罗。
  alternative: 保留“它们/他们就成了他们的网罗”的代词表达，或理解为敬奉偶像这件事成了网罗。
  rationale: 希伯来文复数动词וַיִּהְיוּ最自然地承接最近的复数名词עֲצַבֵּיהֶם“他们的偶像”。中文若只写“它们”虽可理解，却较含混，因此补出名词，但不进一步解释偶像如何成为网罗。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“敬奉”兼顾原文“服事”与宗教敬拜的语境；“网罗”保留诗篇的传统比喻。为避免中文代词所指不清，第二分句重复“这些偶像”。
