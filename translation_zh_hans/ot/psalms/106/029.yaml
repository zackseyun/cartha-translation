  text: וַ֭/יַּכְעִיסוּ בְּ/מַֽעַלְלֵי/הֶ֑ם וַ/תִּפְרָץ בָּ֝֗/ם מַגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/029.yaml
  text: They provoked him to anger by their deeds[a], and a plague broke out among them.
translation:
  language: zh_hans
  text: 他们因自己的所作所为惹他发怒，瘟疫就在他们中间暴发了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכְעִיסוּ
  choice: 惹他发怒
  rationale: 希伯来语使役形式表达“使……发怒、激怒”。原文未明说宾语，但上下文所指是上帝；中文补出“他”既自然，也不比语境过度具体化。
- source_word: בְּמַעַלְלֵיהֶם
  choice: 因自己的所作所为
  rationale: מַעֲלָלִים 指行为、作为，在此带有负面的道德色彩；介词 בְּ 表明引发愤怒的凭借或缘由。此译法符合现代汉语表达。
- source_word: וַתִּפְרָץ
  choice: 暴发了
  rationale: פרץ 有冲破、突然发生之意；与“瘟疫”搭配时，“暴发”自然地保留了突然而猛烈发生的意味。
- source_word: בָּם
  choice: 在他们中间
  rationale: 这里表示瘟疫发生并蔓延于这一群体之中。“在他们中间”比解释性更强的“攻击他们”更贴近原文结构。
- source_word: מַגֵּפָה
  choice: 瘟疫
  rationale: מַגֵּפָה 可指造成死亡的灾疫或击打；结合本诗所回顾的事件，“瘟疫”是清楚而准确的现代汉语对应词。
theological_decisions:
- issue: “惹怒”一词未明说的神圣宾语
  choice: 补出代词“他”，按上下文指上帝。
  alternative: 不补宾语，或明确译为“惹上帝发怒”。
  rationale: 希伯来文此句未明说宾语，但诗篇上下文清楚指向上帝。补“他”满足中文表达需要，同时避免把原文隐含信息过度明说。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所作所为”传达行为的道德分量；“暴发”用于瘟疫突发，简洁自然。
