  text: וַ/יִּתְאַוּ֣וּ תַ֭אֲוָה בַּ/מִּדְבָּ֑ר וַ/יְנַסּוּ אֵ֝֗ל בִּֽ/ישִׁימֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/014.yaml
  text: But they craved intensely in the wilderness[b][a], and tested God in the wasteland.
translation:
  language: zh_hans
  text: 他们却在旷野贪欲大发[a]，在荒漠[b]试探神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文将同根的动词和名词连用以加强语气，字面近于“他们贪求了一种贪求”；也可译作“他们极其贪求”。
    reason: lexical_alternative
  - marker: b
    text: 或译“荒凉之地”。原词强调土地荒芜、贫瘠，与前面的“旷野”是相关但不同的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוּוּ תַאֲוָה
  choice: 贪欲大发
  rationale: 动词与同根名词连用，直译近于“贪恋一种贪欲”，作用是加强语气。“贪欲大发”以自然、凝练的现代汉语保留强烈而失序的欲求，也不把含义局限于性欲。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר指人烟稀少的旷野或荒野；“旷野”既符合此处地貌，也保留以色列旷野经历的经文语境。
- source_word: וַיְנַסּוּ
  choice: 试探
  rationale: נסה可指试验、考验或试探；这里的主体是悖逆的以色列人，宾语是神，故“试探”自然传达带有冒犯意味的考验行为。
- source_word: אֵל
  choice: 神
  rationale: אֵל在此是对以色列之神的称呼；译作“神”清楚、庄重，也避免不必要地扩写为“大能者”。
- source_word: בִּישִׁימוֹן
  choice: 在荒漠
  rationale: יְשִׁימוֹן强调荒凉、贫瘠之地。“荒漠”与前句“旷野”有所区别，保留原文两个相关而不相同的地理词。
theological_decisions:
- issue: 如何表达动词与同根名词构成的强调结构
  choice: 译为“贪欲大发”
  alternative: 直译为“贪恋贪欲”或译为“极其贪恋”
  rationale: 原文的同根宾语主要加强欲求的力度。采用汉语惯用表达可保留强调效果，同时不把这种欲求限定为某一种具体罪欲。
- issue: וַיְנַסּוּ在神为宾语时译作“试探”还是“考验”
  choice: 试探
  alternative: 考验、试验
  rationale: 上下文是在谴责以色列人的悖逆；“试探神”保留他们企图让神受验证、受挑战的负面意味，但不进一步解释其具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“他们却”承接上文的反转语气；两小句结构平衡。“贪欲大发”避免生硬复制希伯来语同根结构，又保留其强调作用；“旷野／荒漠”对应原文两个不同词。
