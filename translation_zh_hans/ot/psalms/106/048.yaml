id: PSA.106.48
reference: Psalms 106:48
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּר֤וּךְ יְהוָ֨ה אֱלֹהֵ֪י יִשְׂרָאֵ֡ל מִן הָ֤/עוֹלָ֨ם וְ/עַ֬ד הָ/עוֹלָ֗ם וְ/אָמַ֖ר כָּל הָ/עָ֥ם אָמֵ֗ן הַֽלְלוּ יָֽהּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/048.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. And let all the people say[b], “Amen!” Praise Yah!
translation:
  language: zh_hans
  text: '雅威[a]——以色列的上帝——当受颂赞，

    从永远到永远[b]！

    愿所有百姓都说[c]：“阿们！”

    赞美雅[d]！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文的上帝之名 יהוה（YHWH）。传统译本常译作“耶和华”或以“耶和华／主”代替。
    reason: divine_name
  - marker: b
    text: 也可译作“从亘古到永恒”或“世世代代”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文形式也可直译为“所有百姓都说了”；这里按礼仪中的号召语理解。
    reason: grammatical_ambiguity
  - marker: d
    text: “雅”音译神名的短式 יָהּ（Yah）。全句传统上音译为“哈利路亚”，也常译作“你们要赞美耶和华”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 当受颂赞
  rationale: 这是颂赞礼仪中使用的被动分词表达；“当受颂赞”既保留“被称颂、蒙颂赞”的语义，也符合现代汉语颂赞文体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之上帝专名的功能，不以称号代替。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达希伯来语构词链的所属关系，现代汉语自然清楚。
- source_word: מִן הָעוֹלָם וְעַד הָעוֹלָם
  choice: 从永远到永远
  rationale: 保留原文重复 עוֹלָם 所形成的时间跨度和颂赞公式，同时不强行限定为“时代”或抽象哲学意义上的“永恒”。
- source_word: וְאָמַר
  choice: 愿……都说
  rationale: 该形式在此诗篇结尾的礼仪语境中通常发挥号召会众回应的作用；“愿……都说”保留其劝请语气。
- source_word: כָּל הָעָם
  choice: 所有百姓
  rationale: 指作为整体回应的会众；“所有百姓”既保留集合性，也符合现代汉语。
- source_word: אָמֵן
  choice: 阿们
  rationale: 采用汉语礼仪中通行的音译，保留会众确认和响应的功能。
- source_word: הַלְלוּ יָהּ
  choice: 赞美雅
  rationale: 直译复数命令式 הַלְלוּ，并把神名短式 יָהּ 音译为“雅”，使其与本节的完整神名“雅威”有所区别。
theological_decisions:
- issue: 同一节中完整神名 יְהוָה 与短式 יָהּ 的译法
  choice: 分别译作“雅威”和“雅”
  alternative: 两者都译作“耶和华”或“主”；也可将 הַלְלוּ יָהּ 整体音译为“哈利路亚”
  rationale: 原文有意使用完整神名与其短式。分别音译可以保留两者的关联与形式差异，也避免用称号取代专名。
- issue: וְאָמַר 的时态／语气
  choice: 按礼仪号召译为“愿所有百姓都说”
  alternative: 按完成式表面形态译为“所有百姓都说了”
  rationale: 上下文是诗篇卷末的颂赞和会众回应公式，号召语气最合乎语篇功能；脚注仍说明其形态容许另一种理解，避免掩盖语法张力。
translation_notes:
  register: 采用现代、庄重而可朗诵的诗歌语言；破折号标明“以色列的上帝”是对“雅威”的同位说明。保留四行礼仪结构，使颂赞、时间范围、会众回应和末尾呼召层次清楚。
