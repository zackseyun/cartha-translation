base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/040.yaml
  text: So Yahweh’s anger burned against his people[b][a], and he abhorred his inheritance.
translation:
  language: zh_hans
  text: 雅威向自己的子民燃起怒火[a]；他厌恶自己的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威的怒气向自己的子民发作。”
    reason: lexical_alternative
  - marker: b
    text: “产业”也可译作“基业”或“产业份”；这里指属于雅威的子民。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 怒火燃烧
  rationale: 希伯来语以“鼻子发热”的惯用表达描写愤怒被点燃；“怒火燃烧”在现代汉语中自然，并保留原文的热力隐喻。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留四字神名，呈现原文所用的专名，而不以称号代替。
- source_word: בְּעַמּוֹ
  choice: 向他的子民
  rationale: 介词 בְּ 在发怒语境中标示愤怒所针对的对象；“向……怒火燃烧”符合现代汉语表达。
- source_word: וַיְתָעֵב
  choice: 厌恶了
  rationale: תעב 表达强烈的嫌恶、憎恶；“厌恶”庄重而易懂，“了”承接叙事中的连续动作。
- source_word: נַחֲלָתוֹ
  choice: 自己的产业
  rationale: נחלה 指所得之份、产业或继承所得；这里指雅威的子民。“产业”保留其归属和盟约意味，不将其平化为一般的“财产”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，避免用称号替代。
- issue: 神愤怒的拟人性热力意象
  choice: 怒火燃烧
  alternative: 发怒；烈怒发作
  rationale: 原文把愤怒描绘为发热、燃起。保留这一鲜明意象，而不把经文所呈现的神圣愤怒弱化或作系统化解释。
- issue: 神“厌恶”自己产业的张力
  choice: 厌恶了自己的产业
  alternative: 弃绝了自己的产业
  rationale: תעב 表示厌恶而非必然表示最终弃绝；直译保留神对其子民施行审判与他们仍被称作“他的产业”之间的张力。
translation_notes:
  register: 采用现代、庄重而通顺的诗歌叙事语体。“因此”承接上文因果关系；“子民”与“产业”保留群体及盟约语感。所有脚注标记均置于对应正文之后。
