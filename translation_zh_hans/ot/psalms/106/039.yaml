  yaml_path: translation/ot/psalms/106/039.yaml
  text: So they became unclean by their deeds[a], and they prostituted themselves by their acts.
translation:
  language: zh_hans
  text: 他们因自己的所作所为成为污秽；又因自己的行径行淫[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以自己的行径不忠。”希伯来文在这里以淫乱的意象表达道德上和圣约上的不忠。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטְמְאוּ
  choice: 成为污秽
  rationale: טמא在此表达进入污秽状态；“成为污秽”保留其结果性和非明确被动的语义，不增添外在施事者。
- source_word: בְמַעֲשֵׂיהֶם
  choice: 因自己的所作所为
  rationale: מַעֲשֶׂה指行为、作为；介词בְּ在此可表原因或手段。“因自己的所作所为”在现代汉语中自然地表明，他们的行为使他们成为污秽。
- source_word: וַיִּזְנוּ
  choice: 行了淫乱
  rationale: זנה具有鲜明的性意象，并常用来比喻对上帝和圣约的不忠。“行了淫乱”保留原文意象，不在正文中直接将其解释为“不忠”。
- source_word: בְּמַעַלְלֵיהֶם
  choice: 因自己的行径
  rationale: מַעֲלָל指行为、行径，常带道德色彩；译作“行径”既保留与前半句“所作所为”的诗性变化，也符合本节负面的语境。
theological_decisions:
- issue: 是否把זנה直接解释为圣约上的不忠或背道
  choice: 正文保留性化隐喻，译为“行了淫乱”
  alternative: 对上帝不忠；以自己的行径背弃了上帝
  rationale: 上下文涉及以色列因偶像崇拜而败坏，זנה可比喻宗教和圣约上的不忠；但原文刻意采用性意象，正文不宜把这一神学张力完全解释掉，因此保留隐喻，并在脚注说明其可能含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“成为污秽”保留礼仪与道德污秽之间未被原文明确消解的张力；“所作所为／行径”体现两组近义词的诗性变化。
