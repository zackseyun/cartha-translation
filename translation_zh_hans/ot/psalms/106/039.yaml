  rationale: 将“行了淫乱”改为“行淫”，以改善现代汉语搭配，并更准确地再现זנה作为动词的性化比喻。脚注的替代译法避免在正文中预先限定为“对上帝”不忠，同时保留其在本诗篇语境中可表达道德和圣约不忠的说明。
