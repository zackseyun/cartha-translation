  text: Their enemies oppressed them[a], and they were subdued under their hand.
translation:
  language: zh_hans
  text: 他们的仇敌欺压他们；他们在仇敌手下受制。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在仇敌手下”也可译作“在仇敌的权势之下”或“受仇敌控制”；原文直译为“在他们的手下”。
