lexical_decisions:
- source_word: וַיִּלְחָצוּם
  choice: 欺压他们
  rationale: לחץ的Qal形态带第三人称阳性复数宾语后缀，表示施压、压迫或苦害；在仇敌辖制的语境中，“欺压”自然传达持续的压迫。
- source_word: אֹיְבֵיהֶם
  choice: 他们的仇敌
  rationale: אויב带第三人称阳性复数后缀，通常指“他们的仇敌”；“仇敌”符合诗篇庄重而易懂的语体。
- source_word: וַיִּכָּנְעוּ
  choice: 他们便屈服
  rationale: כנע的Niphal形态表示被制伏、降服或处于屈从状态；“屈服”保留其结果性，并与下文“在……手下”自然衔接。
- source_word: תַּחַת יָדָם
  choice: 在仇敌手下
  rationale: 字面为“在他们的手下”，是处于某人权势或控制之下的惯用表达。为避免连续两个“他们”造成所指含混，以“仇敌”明确代词指向，同时保留“手下”的形象。
