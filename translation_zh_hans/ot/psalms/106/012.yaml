base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/012.yaml
  text: Then they believed his words[a]; they sang his praise.
translation:
  language: zh_hans
  text: 于是，他们信了他的话[a]；他们歌唱赞美他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们信了他的话。”希伯来语的叙事形式可用“和”或“并且”连接，也可较明确地表达先后关系，译为“于是”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: 那时，他们信了
  rationale: 该词是 אמן 的使役词干叙事式，表示相信、信靠；前接的 waw 推进叙事。译作“那时”自然表达上下文中的先后关系，同时脚注保留“于是”的可能译法。
- source_word: בִדְבָרָיו
  choice: 他的话
  rationale: דבר 为复数并带第三人称阳性单数后缀，直译为“他的话”；现代汉语中此形式自然，也保留了原文的复数形态。
- source_word: יָשִׁירוּ
  choice: 他们歌唱
  rationale: 虽在形式上是未完成式，但在此叙事序列中表达随后的已发生行动；汉语“歌唱”无需以时态形态标记，能自然承接前句。
- source_word: תְּהִלָּתוֹ
  choice: 赞美他
  rationale: תְּהִלָּה 带第三人称阳性单数后缀，字面可作“他的赞美”。现代汉语通常不说“歌唱他的赞美”，故以“歌唱赞美他”表达向他献上颂赞之意，不额外加入神学解释。
