  yaml_path: translation/ot/psalms/106/026.yaml
  text: So he raised his hand against them[a], to make them fall in the wilderness.
translation:
  language: zh_hans
  text: 他向他们举手[a]，要使他们倒在旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他起誓要使他们倒在旷野。”希伯来语“举手”可指举手起誓；在这里尤其带有宣告审判的意味。
    reason: 说明希伯来语惯用表达的另一种译法及其誓言、审判含义。
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: 举起
  rationale: נשׂא的基本义是“举起、抬起”。与“手”连用时可构成起誓的动作性表达；正文保留原文意象，不直接把隐含意义写死为“起誓”。
- source_word: יָדוֹ
  choice: 他的手
  rationale: 直译单数名词及第三人称单数后缀；按上下文，所指为上帝的手。
- source_word: לָהֶם
  choice: 向他们
  rationale: ל字前缀基本表示方向或对象。译作“向他们”既符合中文表达，也保留这动作究竟是针对他们、还是就他们起誓的语义空间。
- source_word: לְהַפִּיל
  choice: 要使……倒毙
  rationale: נפל的使役式不定词表示“使之倒下”。在旷野审判的语境中，“倒毙”自然传达倒下而死的含义，同时保留原文的使役结构。
- source_word: אוֹתָם
  choice: 他们
  rationale: 直接宾语代词，按其复数意义直译。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר在出埃及及旷野漂流语境中通常译为“旷野”，比“沙漠”更准确，也保留圣经叙事中的常用意象。
theological_decisions:
- issue: “举起手来”这一表达的惯用含义
  choice: 正文保留“向他们举起手来”的希伯来语动作意象，并以脚注说明起誓含义。
  alternative: 译作“他起誓要惩罚他们”或“他举手向他们起誓”。
  rationale: 这里很可能指上帝郑重起誓，宣告对旷野悖逆者的审判；但原文只明说“举手”，没有另用“起誓”一词。保留意象并加注，既不掩盖其司法性、誓言性的语境，也不把解释完全并入正文。
- issue: “使他们倒下”是否明确指死亡
  choice: 译作“使他们倒毙”，表达在旷野死亡。
  alternative: 译作“使他们倒下”或“使他们仆倒”。
  rationale: 本诗回顾旷野世代因审判而死亡；中文“倒下”可能只表示跌倒，语义过轻。“倒毙”符合上下文，但仍保留נפל的“倒下”意象。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“于是”承接前文并引出审判结果；“旷野”沿用出埃及叙事的通行用语。脚注标记[a]已置于相关短语之后。
