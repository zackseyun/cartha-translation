  yaml_path: translation/ot/psalms/106/019.yaml
  text: They made a calf at Horeb and bowed down to a cast image[a][b].
translation:
  language: zh_hans
  text: 他们在何烈山造了一头牛犊，向铸像下拜[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铸像”指用熔化的材料浇铸而成的像，通常是金属像。
    reason: lexical_alternative
  - marker: b
    text: 这里回顾出埃及记32章中以色列人在何烈山（西奈山）制造牛犊的事件。
    reason: cross_reference
lexical_decisions:
- source_word: יַעֲשׂוּ
  choice: 造了
  rationale: עשה在此指制作；“造了”简洁自然，也符合偶像制造的语境，但不额外强调工艺。
- source_word: עֵגֶל
  choice: 一头牛犊
  rationale: עֵגֶל通常指幼牛；量词“头”符合现代汉语习惯。不增添本节未明说的“金”。
- source_word: בְּחֹרֵב
  choice: 在何烈山
  rationale: 介词ב在此表示事件发生的地点；“在何烈山”自然，并保留传统地名“何烈山”。
- source_word: וַיִּשְׁתַּחֲווּ
  choice: 向……下拜
  rationale: 该动词表示俯伏、下拜，可用于敬拜语境；“下拜”既保留身体动作，也让上下文呈现其偶像崇拜含义。
- source_word: לְמַסֵּכָה
  choice: 向铸像
  rationale: מַסֵּכָה特指经熔铸制成的像；“铸像”比泛称“偶像”更准确，也比“熔铸的像”简练自然。
theological_decisions:
- issue: 是否将牛犊明确译为“金牛犊”
  choice: 仅译“一头牛犊”
  alternative: 一头金牛犊
  rationale: 出埃及记32章说明它是金制的，但本节只说“牛犊”和“铸像”；正文不补入“金”，以忠实保留本节措辞。
- issue: וַיִּשְׁתַּחֲווּ是否直接译作“敬拜”
  choice: 译作“下拜”
  alternative: 敬拜
  rationale: “下拜”保留原词所表达的身体动作，同时由对象和叙事语境显明这是偶像崇拜，避免在译文中提前消解词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“造了一头牛犊”贴近原文，“向铸像下拜”简洁保留动作及偶像崇拜语境；两个脚注标记均置于正文对应句末。
