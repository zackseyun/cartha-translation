id: PSA.106.1
reference: Psalms 106:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַֽלְלוּ יָ֨הּ הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/001.yaml
  text: Praise Yah! Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: '要赞美雅[a]！

    要称谢雅威，

    因为他本为善，

    因为他的慈爱永远长存。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”是神名“雅威”的诗体短式。希伯来语“哈利路亚”的意思就是“要赞美雅”。
    reason: 说明短式神名及礼仪用语，帮助读者理解正文中较不熟悉的音译。
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: 要赞美
  rationale: 这是הלל的复数祈使式，向群体发出赞美的呼召；用“要赞美”既明确命令语气，也符合现代汉语诗歌体。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的诗体短式，与本节后面的יהוה形式相关但不完全相同；音译为“雅”可保留原文的区别。
- source_word: הוֹד֣וּ
  choice: 要称谢
  rationale: ידה的使役式在诗篇礼仪语境中表示向神献上感谢和颂赞；“称谢”庄重、简明，也适合诗篇体裁。
- source_word: לַ/יהוָ֣ה
  choice: 雅威
  rationale: 介词ל标示称谢的对象；将יהוה音译为“雅威”，保留原文所用的专名，并与短式“雅”相区别。
- source_word: כִּי טוֹב
  choice: 因为他本为善
  rationale: כִּי在此引出称谢的理由；טוֹב是以雅威为省略主语的谓语形容词。“本为善”自然表达其固有的良善。
- source_word: לְ/עוֹלָם
  choice: 永远长存
  rationale: 字面意义为“直到永远”；汉语需要补出合宜的谓语，“永远长存”自然表达持续不止的意义。
- source_word: חַסְדּֽ/וֹ
  choice: 他的慈爱
  rationale: חסד涵盖慈爱、忠诚和坚定不移的恩惠；正文用通顺而庄重的“慈爱”，不把其丰富含义过度限定为某一种神学解释。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；音译“雅威”既保留专名性质，也避免用称号替代原文。
- issue: 短式神名יָהּ的译法
  choice: 雅
  alternative: 哈利路亚；耶和华
  rationale: 原文先用短式יָהּ，随后用完整形式יהוה。分别译作“雅”和“雅威”，可保留这一诗体和词形上的差异。
- issue: חסד的语义范围
  choice: 慈爱
  alternative: 信实的爱；忠贞之爱；怜悯
  rationale: “慈爱”在汉语中简洁且适合敬拜语境，同时仍容纳恩慈、忠诚与恒久之爱的多重内涵。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体；四行排布呈现原文的呼召及两个并列理由。保留两次כִּי，均译为“因为”，以维持希伯来文的平行结构和节奏。
