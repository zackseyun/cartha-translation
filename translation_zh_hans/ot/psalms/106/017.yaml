  yaml_path: translation/ot/psalms/106/017.yaml
  text: The earth opened and swallowed Dathan[c][b][a], and covered the company of Abiram.
translation:
  language: zh_hans
  text: 大地裂开[a]，吞下了大坍[c]；又覆盖了亚比兰的会众[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“张开”。这里的希伯来语动词可直译为“打开”或“张开”；“裂开”则更鲜明地呼应民数记16章所记的事件。
    reason: lexical_alternative
  - marker: b
    text: “会众”或译“群体”或“聚集的人”。
    reason: lexical_alternative
  - marker: c
    text: 关于这次审判的叙事背景，见民数记16:31–33。
    reason: cross_reference
lexical_decisions:
- source_word: תִּפְתַּח
  choice: 裂开
  rationale: 该词是פתח的Qal未完成式第三人称阴性单数，以“大地”为主语；在诗体追述中表达过去发生的动作。结合民数记16章的事件，“裂开”比单说“打开”更自然具体，但不额外扩充叙事细节。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 此处指叛逆者脚下裂开的地面，不是疆域意义上的“土地”；“大地”既自然，也符合诗歌庄重的语体。
- source_word: וַתִּבְלַע
  choice: 吞下了
  rationale: 这是בלע的叙事性连续式，表示接续发生的过去动作；“吞下”直接保留希伯来文的形象。
- source_word: דָּתָן
  choice: 大坍
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: וַתְּכַס
  choice: 又掩盖了
  rationale: 源自动词כסה，意为遮盖、覆盖；“掩盖”在此自然表达大地覆在众人之上的图景。
- source_word: עַל
  choice: （融入“掩盖”句式）
  rationale: 该介词标示被覆盖的对象；现代汉语无需另译为“在……之上”，其关系已由“掩盖了”自然表达。
- source_word: עֲדַת
  choice: 党众
  rationale: עֵדָה的构造形，指一群结党聚集的人。“党众”简洁地表达特定派系或群体，避免“会众”在此可能产生的敬拜群体色彩。
- source_word: אֲבִירָם
  choice: 亚比兰
  rationale: 采用现代中文圣经人名的通行译法。
theological_decisions:
- issue: 本节与民数记16章完整叙事的关系
  choice: 按诗篇本身作概括性翻译，只提大坍和亚比兰的党众
  alternative: 依据民数记16章增补“他们的家属”或其他叛逆者
  rationale: 本节是在诗歌中概述审判；翻译不应加入希伯来文本没有明说的人物或细节。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“大地裂开，吞下”保留原文简洁有力的拟人化诗歌意象；分号呈现两个并列的审判动作。脚注标记均紧接相关词语，其中交叉参照置于“大坍”之后。
