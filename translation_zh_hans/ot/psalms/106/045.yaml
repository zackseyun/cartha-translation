  text: וַ/יִּזְכֹּ֣ר לָ/הֶ֣ם בְּרִית֑/וֹ וַ֝/יִּנָּחֵ֗ם כְּ/רֹ֣ב חסד/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/045.yaml
  text: He remembered his covenant for their sake[a], and relented according to the abundance of his steadfast love.
translation:
  language: zh_hans
  text: 他为他们的缘故记念他的约，并照着他丰盛的慈爱转意[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“改变心意”或“动了怜悯之心”。这个希伯来动词既可表示转意，也可表示受怜悯触动。
    reason: 保留וַיִּנָּחֵם的词义范围及其神学张力。
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: 记念
  rationale: זכר在圣约语境中不只是心里想起，也含有顾念既有承诺并据此行动的意味；“记念”既简洁自然，也保留这种圣约色彩。
- source_word: לָהֶם
  choice: 为他们
  rationale: 介词ל加代词后缀表明记念圣约是关乎他们、为着他们的益处；“为他们”贴近原文且符合现代汉语表达。
- source_word: בְּרִיתוֹ
  choice: 自己的约
  rationale: בְּרִית是圣经中表示“约”的核心用语；在“他……自己的约”结构中，使用“自己的”能自然、明确地指回上帝。
- source_word: וַיִּנָּחֵם
  choice: 转意
  rationale: נחם的Nifal形式在此可表达转变原定行动，也可含受怜悯触动之意。“转意”保留上帝对百姓所采取的处置发生真实转变这一文本张力，又不额外暗示先前的判断有误。
- source_word: כְּרֹב
  choice: 照着……丰盛的
  rationale: כ加רֹב表达尺度或相称关系；“照着……丰盛的”自然地传达其行动与慈爱之丰富相称。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חסד兼有恩慈、忠贞和守约之爱的内涵；“慈爱”是现代中文中自然且庄重的表达，并能在圣约语境中承载这些含义。
theological_decisions:
- issue: 如何翻译וַיִּנָּחֵם中用于上帝的拟人化情感与行动语言
  choice: 转意
  alternative: 改变心意；动了怜悯之心
  rationale: 原文描述上帝因记念圣约而在对待百姓的行动上发生真实转变。“转意”既不抹去这种变化，也不强行解释为上帝获得新信息或纠正错误；脚注保留该动词所含“改变心意”和“受怜悯触动”的语义可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体散文。“记念自己的约”保留圣约用语，“照着他丰盛的慈爱”贴近原文的比例关系；脚注标记紧随存在词义歧义的“转意”。
