  yaml_path: translation/ot/psalms/106/027.yaml
  text: and to make their offspring fall among the nations[b][a], and to scatter them through the lands.
translation:
  language: zh_hans
  text: 使他们的后代在列国中倒下，并把他们分散在各地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְהַפִּיל
  choice: 使……倒在
  rationale: 该词是 נפל 的使役式不定词，表达“使……倒下”。此处保留宽泛的审判含义，不限定为死亡或军事败亡。
- source_word: זַרְעָם
  choice: 他们的后代
  rationale: זֶרַע 字面为“种子”，用于人时指后裔；“后代”在现代汉语中自然清楚，并保留世代延续之意。
- source_word: בַּגּוֹיִם
  choice: 列国之中
  rationale: גּוֹיִם 在此指以色列以外的诸国；“列国”符合诗篇的庄重语体，也不引入后期“外邦人”的特定宗教含义。
- source_word: וּלְזָרוֹתָם
  choice: 把他们分散
  rationale: זרה 可指扬散、簸散或驱散；结合流散语境及后面的地点短语，“分散”最自然地表达其结果。
- source_word: בָּאֲרָצוֹת
  choice: 到各地
  rationale: אֶרֶץ 的复数指多个地域或国家；与“分散”搭配时，“到各地”是自然的现代汉语表达。
theological_decisions:
- issue: 这里所描述之审判的性质
  choice: 译作后代“倒在列国之中”，并被分散到各地，保留败落、遭难或死亡等可能范围。
  alternative: 可具体理解为使其后代死在列国中，或使其后代在列国中败亡。
  rationale: 使役式 נפל 的语义比“死亡”更宽。下半句明确说到分散，而上下文涉及盟约审判，因此不宜把第一句无依据地限缩为死亡。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“列国”保留诗篇语体；“倒在”刻意维持原文的宽泛性。“各地”避免生硬直译，同时表达复数地域中的广泛流散。
