  text: זָכְרֵ֣/נִי יְ֭הוָה בִּ/רְצ֣וֹן עַמֶּ֑/ךָ פָּ֝קְדֵ֗/נִי בִּ/ישׁוּעָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/004.yaml
  text: Remember me[a], O Yahweh, when you show favor to your people[b]; attend to me with your salvation.
translation:
  language: zh_hans
  text: 雅威啊，求你在恩待你子民的时候[a]，也记念我；求你以你的拯救眷顾我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你以恩待你子民的恩惠记念我。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“求你带着你的拯救临到我。”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרֵנִי
  choice: 记念我
  rationale: זכר 的 Qal 祈使式带第一人称单数后缀，表示诗人直接求雅威顾念自己。“记念我”保留祷告语气，也符合现代汉语圣经语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: בִּרְצוֹן עַמֶּךָ
  choice: 恩待你子民时
  rationale: רָצוֹן 表示恩惠、悦纳或善意；此处将介词 בְּ 理解为时间或伴随处境，即诗人求神在向其子民施恩时也顾念他。脚注保留较形式对应的关联性读法。
- source_word: פָּקְדֵנִי
  choice: 眷顾我
  rationale: פקד 在祷告语境中可指神察看、临到并采取有利行动。“眷顾”既表达关注，也包含施行帮助的意味，避免仅指空间上的探访。
- source_word: בִּישׁוּעָתֶךָ
  choice: 以你的拯救
  rationale: יְשׁוּעָה 指拯救或救助；“以你的拯救”保留名词及介词所表达的凭借或伴随关系，不把含义缩窄为某一种具体脱险。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为音译，保留其专名性质，不以称号取代。
- issue: בִּרְצוֹן עַמֶּךָ 的句法关系
  choice: 时间／处境义：“恩待你子民时”
  alternative: 关联／伴随义：“带着对你子民的恩惠”
  rationale: 希伯来语结构简洁，可表示诗人求神在恩待其子民之际也记念他，也可较形式地理解为带着向子民所施的恩惠记念他。正文采用自然且合乎语境的时间读法，脚注保留另一可能。
- issue: פָּקְדֵנִי 的行动含义
  choice: 眷顾我
  alternative: 带着你的拯救临到我
  rationale: פקד 可含探访、察看、关注并介入之意；此处由“你的拯救”限定，显然是正面的施救性临到。“眷顾”保留这种丰富含义，脚注提示更具动作感的译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“雅威啊”保留呼告形式；“也”明确诗人盼望与群体一同蒙恩的语境，但不加入个人功德或特殊拣选等解释。两个脚注分别保存介词结构和 פקד 的真实语义弹性。
