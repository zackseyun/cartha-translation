  text: וַ/יִּֽשְׁפְּכ֨וּ דָ֪ם נָקִ֡י דַּם בְּנֵ֘י/הֶ֤ם וּֽ/בְנוֹתֵי/הֶ֗ם אֲשֶׁ֣ר זִ֭בְּחוּ לַ/עֲצַבֵּ֣י כְנָ֑עַן וַ/תֶּחֱנַ֥ף הָ֝/אָ֗רֶץ בַּ/דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/038.yaml
  text: They poured out innocent blood—the blood of their sons and daughters[c][b][a], whom they sacrificed to the idols of Canaan—and the land was polluted with blood.
translation:
  language: zh_hans
  text: 他们流了无辜人的血，就是自己儿女的血；他们把儿女献祭给迦南的偶像。那地因流血[a]而被玷污。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流血”原文为复数形式，也可理解为“流血之事”或“流血罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפְּכוּ
  choice: 他们流了
  rationale: שׁפך用于血时通常表示“流血、使血倾出”。现代汉语“流了……的血”自然表达杀害，同时保留原文的血之意象。
- source_word: דָם נָקִי
  choice: 无辜人的血
  rationale: 准确保留“无辜”这一明确的道德判断；较“无辜的血”更自然，也清楚指向被杀害的人。
- source_word: דַּם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: 就是自己儿女的血
  rationale: 保留原文同位语式重复的“血”，明确说明所流的无辜之血正是他们儿女的血。
- source_word: אֲשֶׁר זִבְּחוּ
  choice: 他们把儿女献祭
  rationale: זבח在此为祭祀语境中的宰献；“献祭”准确而自然。重复“儿女”可避免汉语关系从句指代含混。
- source_word: לַעֲצַבֵּי כְנָעַן
  choice: 给迦南的偶像
  rationale: עֲצַבִּים在此指受敬拜的偶像，并带有贬斥意味；“迦南的偶像”保留地域限定。
- source_word: וַתֶּחֱנַף
  choice: 于是……被玷污
  rationale: חנף在此描述土地因流血而陷入道德与宗教性的污秽。“玷污”比现代汉语“污染”更适合此语境。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 上下文所指是迦南地，并非整个地球；“那地”自然且范围准确。
- source_word: בַּדָּמִים
  choice: 因这些血
  rationale: 保留原文复数“血”的异常表达及全节反复出现的血之意象；“这些”使中文可读，并可涵盖多起流血事件。
theological_decisions:
- issue: 被献祭儿女的道德地位
  choice: 译作“无辜人的血”
  alternative: “无辜的血”
  rationale: 原文明说דָם נָקִי，明确谴责这些杀害；译文不削弱也不扩展这一判断。
- issue: 土地受污的性质
  choice: “那地因这些血而被玷污”
  alternative: “那地因流血罪而被玷污”
  rationale: “流血罪”能揭示血债含义，却会更明确地解释复数דָּמִים。正文保留“血”的意象和一定语义张力，并以脚注说明可能的抽象含义。
- issue: 儿女献祭与偶像的关系
  choice: “献祭给迦南的偶像”
  alternative: “宰献给迦南的神像”
  rationale: “偶像”保留诗篇的负面宗教评价；“献祭”传达祭仪行为，而不加入具体仪式细节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号和句号拆开希伯来语长句，避免关系从句在中文中产生指代歧义；保留“血”的三重回响及土地被玷污的强烈道德意象。
