  text: וַֽ֭/יִּמְאֲסוּ בְּ/אֶ֣רֶץ חֶמְדָּ֑ה לֹֽא הֶ֝אֱמִ֗ינוּ לִ/דְבָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/024.yaml
  text: Then they despised the pleasant land[b][a]; they did not believe his word.
translation:
  language: zh_hans
  text: 他们竟厌弃那令人向往之地[a]，不相信他的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那美地”或“那可悦之地”。
    reason: lexical_alternative
  - marker: b
    text: 或译“不信赖他”；“他的话”在这里也可理解为“他的应许”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: 他们竟厌弃
  rationale: מָאַס表示拒绝、鄙弃或厌弃；“厌弃”保留了诗人谴责语气的强度。“竟”自然承接上文，并凸显他们出人意料的悖逆，而不把连接词处理成单纯的时间副词。
- source_word: בְּאֶרֶץ חֶמְדָּה
  choice: 那可喜爱之地
  rationale: אֶרֶץ在此指应许之地；חֶמְדָּה表达令人向往、可喜爱或可悦之意。“可喜爱之地”较贴近原文，也保持庄重而易懂。介词בְּ受מָאַס支配，汉语自然译为直接宾语，不另译“在”。
- source_word: לֹא הֶאֱמִינוּ
  choice: 不信
  rationale: אמן的使役式在此可表示相信或信赖。“不信”与“他的话”搭配自然，并保留“相信”与“信靠”之间的语义张力。
- source_word: לִדְבָרוֹ
  choice: 他的话
  rationale: דָּבָר可指话语、所说的话，并可在语境中带有应许之意。正文采用较宽泛的“他的话”，不把含义限定为“应许”。
theological_decisions:
- issue: 是否明确把“他的话”解释为上帝有关那地的应许
  choice: 正文保留“他的话”
  alternative: 他的应许
  rationale: 原文使用דָּבָר，语境确实指向上帝的应许，但词义本身较宽。保留“他的话”可避免过度限定，并在脚注中说明“他的应许”这一语境性理解。
- issue: הֶאֱמִינוּ侧重“相信”还是“信赖”
  choice: 不信
  alternative: 不信赖
  rationale: 两者都在该动词的语义范围内；“不信”更直接贴合“他的话”，同时未否定其中信靠的含义，故将另一可能保留在脚注。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“厌弃”保留原文强烈的否定评价；“可喜爱之地”略带诗体色彩，却仍为普通读者易懂。脚注标记均置于所说明的词组之后。
