base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/009.yaml
  text: He rebuked the Red Sea[a], and it dried up; he led them through the depths as through the wilderness.
translation:
  language: zh_hans
  text: 他斥责红海[a]，海便干涸了；他领他们穿过海的深处，如同穿过旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“芦苇海”。希伯来文为 yam suph。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְעַר
  choice: 斥责
  rationale: גער通常表示“斥责、责备”。这里将海人格化，描绘上帝以权能制伏水域；“斥责”保留了这一鲜明的诗歌意象。
- source_word: בְּיַם סוּף
  choice: 红海
  rationale: יַם סוּף是《出埃及记》相关叙事中该海域的惯用希伯来名称。中文圣经传统通常译作“红海”，能使读者清楚辨认此处的出埃及事件；其词面可理解为“芦苇海”，故在脚注保留。
- source_word: וַיֶּחֱרָב
  choice: 海就干了
  rationale: חרב在此为不及物意义，表示“变干、干涸”。补出“海”使现代汉语衔接自然，“就”也呈现斥责之后随即发生的结果。
- source_word: וַיּוֹלִיכֵם
  choice: 他领他们走过
  rationale: הלך的使役形式在此表达带领人前行。“领他们走过”既自然，也准确呈现上帝引导他们穿越的动作。
- source_word: בַּתְּהֹמוֹת
  choice: 走过深渊
  rationale: תְּהֹמוֹת是“深渊、深处”的复数形式，指广大的水之深处。“深渊”保留诗歌力度；“走过”结合介词和前面的移动动词，表达穿行其中。
- source_word: כַּמִּדְבָּר
  choice: 如同走过旷野
  rationale: 此比喻强调，上帝使穿越海中深处变得像穿越旷野一样可行。补出“走过”符合汉语表达，并与前半句的移动动作呼应。
theological_decisions:
- issue: 出埃及典故中יַם סוּף的译法
  choice: 红海
  alternative: 芦苇海
  rationale: “红海”是现代中文读者熟悉的传统地名，能明确指向出埃及事件；“芦苇海”较贴近希伯来语词面，也有词汇依据，因此以脚注保存这一可能译法，不将争议静默消除。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“斥责”保留对海的拟人化描写，以“深渊”维持诗歌的宏阔意象；句式简洁，并让两次“走过”清楚呈现原文的比较关系。
