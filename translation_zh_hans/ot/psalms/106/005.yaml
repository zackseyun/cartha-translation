base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/005.yaml
  text: that I may see the good of your chosen ones[a], rejoice in the joy of your nation[b], and glory with your inheritance.
translation:
  language: zh_hans
  text: 使我得以看见你所拣选之人的福乐，在你国民的喜乐中欢喜，并与你的产业一同夸耀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夸耀”或译“以……为荣”或“引以为荣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִרְאוֹת
  choice: 好让我看见
  rationale: 承接上一节的祈求，ל加不定式表示目的；保留“看见”这一具体动词，也自然体现“得以经历”的含义。
- source_word: בְּטוֹבַת
  choice: 福乐
  rationale: טוֹבָה在这里指蒙福所得的美好境况、福祉；“福乐”比抽象的“美善”更符合群体蒙福的语境，又不局限于物质繁荣。
- source_word: בְּחִירֶיךָ
  choice: 你所拣选之人
  rationale: 忠实表达由בחר而来的复数称谓，保留上帝拣选其群体的盟约含义，同时避免额外引入后世系统神学术语。
- source_word: לִשְׂמֹחַ בְּשִׂמְחַת
  choice: 因……的喜乐而欢喜
  rationale: 保留同根词“欢喜／喜乐”的修辞呼应；介词ב可表达参与其中或因之而欢喜，此译文自然涵盖两者。
- source_word: גּוֹיֶךָ
  choice: 你的国民
  rationale: גּוֹי本义为民族、国族；“国民”既区别于泛称的“百姓”，又在现代汉语中比单说“你的国”更明确指群体。
- source_word: לְהִתְהַלֵּל
  choice: 夸耀
  rationale: הלל的Hitpael形在此表示以某事为荣、欢然夸耀；“夸耀”保留原词可能带有的“自夸／引以为荣”张力，而上下文使其成为正面的共同庆贺。
- source_word: עִם נַחֲלָתֶךָ
  choice: 与你的产业一同
  rationale: עִם明确表示共同参与；נַחֲלָה是盟约性称谓，指归上帝所有的子民，直译“产业”可保存其意象。
theological_decisions:
- issue: 如何处理本节连续出现的三个盟约群体称谓
  choice: 你所拣选之人……你的国民……你的产业
  alternative: 你的选民……你的百姓……你的子民
  rationale: 分别保留בְּחִירֶיךָ、גּוֹיֶךָ、נַחֲלָתֶךָ的不同意象，不把三者统一改写成“百姓”，也不借“选民”等词额外强化后世教义体系。
- issue: לְהִתְהַלֵּל的正面语境与词义张力
  choice: 夸耀
  alternative: 欢欣／以……为荣
  rationale: 原动词可以表示夸口、夸耀；此处与上帝的产业共同出现，语境积极，但译文不应完全抹去该词本身的语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“福乐”兼顾טוֹבָה的美好与福祉含义；“产业”保留圣经中的盟约意象。主文中的脚注标记置于相关分句之后。
