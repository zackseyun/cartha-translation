  text: מִ֗י יְ֭מַלֵּל גְּבוּר֣וֹת יְהוָ֑ה יַ֝שְׁמִ֗יעַ כָּל תְּהִלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/002.yaml
  text: Who can recount the mighty deeds of Yahweh[b][a], or proclaim all his praise?
translation:
  language: zh_hans
  text: 谁能述说雅威[a]的大能作为，又能使人听见对他的一切赞美[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译；传统汉译常作“耶和华”。
    reason: divine_name
  - marker: b
    text: “对他的一切赞美”也可理解为“他一切可赞美之处”；原文直译为“使人听见他全部的赞美”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: 谁能
  rationale: 疑问代词在这里引出反问，所问的是谁有能力穷尽述说，因此译为“谁能”既自然又保留语气。
- source_word: יְמַלֵּל
  choice: 述说
  rationale: 该词的 Piel 形式表示把事情说出来、讲述；“述说”符合诗歌语体，也适合以大能作为为宾语。
- source_word: גְּבוּרוֹת
  choice: 大能作为
  rationale: 复数名词指彰显力量的行动，而非抽象的“能力”；“大能作为”兼顾力量与具体行动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留希伯来文中的神圣名字，而不以称号替代。
- source_word: יַשְׁמִיעַ
  choice: 使人听见
  rationale: Hiphil 形式直指“使……被听见”；此译保留使役意味及公开宣告的画面，避免仅译作一般性的“传扬”。
- source_word: כָּל
  choice: 一切
  rationale: 保留原文涵盖全部的强烈语气，与反问所表达的无法穷尽相呼应。
- source_word: תְּהִלָּתוֹ
  choice: 对他的一切赞美
  rationale: 原文为单数“他的赞美”，可集合性地指一切对他的颂赞；汉语以“对他的赞美”明确这是以他为对象的赞美，同时不将其直接解释为“可赞美的作为”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，故采用较贴近 Yahweh 的现代汉语音译“雅威”，保留其专名性质，不以“上主”这一称号替代。
- issue: תְּהִלָּתוֹ 是指献给神的赞美，还是神可赞美的事迹
  choice: 对他的一切赞美
  alternative: 他一切可赞美的事；他一切当受的赞美
  rationale: 希伯来语可容纳“对他的赞美”及“他可赞美之处”等相关理解。正文采用较形式对应的“对他的赞美”，脚注保留另一种可能，不把含义局限为具体事迹。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“述说—使人听见”保留希伯来诗句中两个言说动词的递进和平行关系；不补入原文没有的“或”。
