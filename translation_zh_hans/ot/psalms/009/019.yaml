  text: קוּמָ֣/ה יְ֭הוָה אַל יָעֹ֣ז אֱנ֑וֹשׁ יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/019.yaml
  text: Rise up[a], O Yahweh; do not let man prevail; let the nations be judged before you.
translation:
  language: zh_hans
  text: 耶和华啊，求你起来！不要让人[a]得胜；愿列国在你面前受审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”或译“必死的人”；希伯来语 אֱנוֹשׁ 常强调人的脆弱或必死性。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: 求你起来
  rationale: 这是向上帝发出的命令式呼求；加“求”符合现代汉语祷告语体，同时保留恳求上帝介入的力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”对应四字神名，避免用称号替代原文专名。
- source_word: אַל־יָעֹז
  choice: 不要让……得胜
  rationale: אַל配合未完成式表达禁止或祈愿；“得胜”在敌对与审判语境中自然传达“显强、占上风”的意思。
- source_word: אֱנוֹשׁ
  choice: 世人
  rationale: 该词在诗歌中常突出人的脆弱和必死性；“世人”可自然表达作为整体的人类，并与上帝形成对照。
- source_word: יִשָּׁפְטוּ
  choice: 愿……受审判
  rationale: 尼法勒式在此宜理解为被动的司法意义；“愿”保留祈愿语气，“受审判”清楚表明列国处于上帝的审判之下。
- source_word: גּוֹיִם
  choice: 列国
  rationale: “列国”是诗篇语体中自然、庄重的集合性表达，指各民族国家。
- source_word: עַל־פָּנֶיךָ
  choice: 在你面前
  rationale: 既贴近原文“在你面前”的空间意象，也自然表达列国来到上帝面前受审。
theological_decisions:
- issue: אֱנוֹשׁ的人论含义
  choice: 世人
  alternative: 必死的人／凡人
  rationale: 正文保留其代表整个人类的集合意义，不把单数机械译成某一个男人；脚注说明该词可特别强调人的脆弱和必死性。
- issue: יִשָּׁפְטוּ的司法或治理含义
  choice: 受审判
  alternative: 受治理
  rationale: 上下文是祈求上帝制止人的得胜，并使列国来到他面前，因此司法性的“受审判”最切合，同时没有具体说明判决结果。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇祷告语体。“求你起来”不是描写上帝改变姿势，而是呼求他采取行动；标点强化两项平行祈求。脚注标记置于整节末尾，对应“世人”的词义说明。
