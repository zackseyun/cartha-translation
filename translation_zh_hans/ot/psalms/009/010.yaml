source:
  edition: WLC
  text: וְ/יִבְטְח֣וּ בְ֭/ךָ יוֹדְעֵ֣י שְׁמֶ֑/ךָ כִּ֤י לֹֽא עָזַ֖בְתָּ דֹרְשֶׁ֣י/ךָ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/010.yaml
  text: And those who know your name will trust in you[a], for you, O Yahweh[c][b], have not forsaken those who seek you.
translation:
  language: zh_hans
  text: 认识你名的人必信靠你[a]，因为你没有离弃[b]寻求你的人，雅威啊[c]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “认识你名”不只是知道这个名字的读音，也包括认识雅威所启示的身份、品格和声誉。
    reason: cultural_note
  - marker: b
    text: “离弃”也可译作“抛弃”。
    reason: lexical_alternative
  - marker: c
    text: 原文是希伯来神名 YHWH；这里音译为“雅威”，传统上也译作“耶和华”或以“上主”代称。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִבְטְחוּ בְךָ
  choice: 必信靠你
  rationale: בטח 的 Qal 未完成式表达对上帝有把握的倚赖；“必信靠”既保留其将来或特征性的意味，也符合现代汉语诗体。介词 ב 所标示的信靠对象自然译入“信靠你”。
- source_word: יֹדְעֵי שְׁמֶךָ
  choice: 认识你名的人
  rationale: 分词结构指一类以认识上帝之名为特征的人。“认识你名”保留原文措辞及其关系性、启示性的内涵，不在正文中过度解释。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前述信靠的根据；“因为”清楚呈现因果关系。
- source_word: לֹא עָזַבְתָּ
  choice: 从未离弃
  rationale: עזב 可指离开、离弃或抛弃；完成式在这里陈述上帝一贯可靠的作为。“从未离弃”以自然汉语表达其持续至今的效力。
- source_word: דֹּרְשֶׁיךָ
  choice: 寻求你的人
  rationale: דרש 以上帝为对象时，通常指在敬拜、祷告和信靠中寻求他；“寻求你的人”准确而自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用四字神名 YHWH，而非称号；“雅威”是现代汉语中对其常见的音译，并由脚注说明传统译法。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 正文以音译保留原文的专名性质，不用称号取代；脚注同时交代传统汉语译法，避免把音译上的选择变成宗派性断言。
- issue: “认识你名”的含义
  choice: 正文保留“认识你名”
  alternative: 认识你的品格；承认你
  rationale: “名”承载上帝所启示的身份、品格和声誉，但原文仍保有“名”的诗意与盟约关联；因此不在正文中化约为单一解释，而用脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。保留“认识你名”“寻求你”等圣诗性的关系用语；将呼格“雅威啊”置于句末，贴近希伯来原文的强调位置。所有脚注标记均在正文中出现。
