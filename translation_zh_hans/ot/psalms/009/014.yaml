  text: so that I may recount all your praises in the gates of Daughter Zion[a]; I will rejoice in your salvation.
translation:
  language: zh_hans
  text: 好让我在锡安的女儿的城门内，述说一切对你的颂赞；我要因你的拯救[a]而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“救恩”。希伯来语既可指从当前危险中获救，也可指更广义的救恩。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 好让我
  rationale: 保留目的含义，并与后面的第一人称意愿式自然衔接。
- source_word: אֲסַפְּרָה
  choice: 述说
  rationale: 该词为ספר的Piel形式，表示讲述、数说或宣扬；“述说”兼顾具体叙说和公开传扬的意味。
- source_word: כָּל־תְּהִלָּתֶיךָ
  choice: 你一切可颂的作为
  rationale: תְּהִלּוֹת在此既可指献给上帝的颂赞，也可转指使他受颂赞的作为；此译在现代汉语中自然，并贴合“述说”的宾语关系。
- source_word: בְּשַׁעֲרֵי
  choice: 在……的城门口
  rationale: ב可表示“在”或“于”；古代城门区域是公共活动场所，“城门口”比直译“城门里”更符合现代汉语空间表达。
- source_word: בַת־צִיּוֹן
  choice: 锡安女子
  rationale: 保留希伯来诗歌中将锡安人格化为女子的称谓，避免直接改释为“耶路撒冷居民”。
- source_word: אָגִילָה
  choice: 我要……欢喜
  rationale: גיל表达强烈的喜悦；此处意愿式可自然译作“我要欢喜”，既可表示决心，也保留诗人的热切意愿。
- source_word: בִּישׁוּעָתֶךָ
  choice: 因你的拯救
  rationale: ישועה可指从眼前危难中获救，也具有更广的救恩含义；“拯救”在本诗受敌人威胁的语境中自然，同时不排除较广含义。介词ב在汉语中按原因或喜乐的根据译为“因”。
theological_decisions:
- issue: ישועה的范围
  choice: 拯救
  alternative: 救恩
  rationale: 本段直接语境强调脱离仇敌和死亡之门，“拯救”更贴近具体搭救；但原词也可具有广义救恩色彩，因此用脚注保留这一张力。
- issue: תְּהִלָּתֶיךָ所指
  choice: 你一切可颂的作为
  alternative: 对你的一切颂赞
  rationale: 希伯来语可指向上帝发出的赞美，也可指他值得称颂之处或可颂的作为。结合“述说”及全诗叙述上帝作为的语境，正文采用后者，但不把它限制为某一种特定神学类别。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“锡安女子”保留原文人格化意象；分号对应两行诗意推进。脚注标记置于其实际解释的“拯救”之后，而非“锡安女子”之后。
