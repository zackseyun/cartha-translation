  yaml_path: translation/ot/psalms/009/009.yaml
  text: And Yahweh will be a stronghold for the oppressed[b][a], a stronghold in times of trouble.
translation:
  language: zh_hans
  text: 雅威必[c]作受欺压之人[b]的坚垒[a]，在患难的时候作坚垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“避难所”或“高处的避难所”；希伯来语所指的是安全、居高而难以攻取的庇护之地。
    reason: lexical_alternative
  - marker: b
    text: 或译“被压碎的人”或“受践踏的人”。
    reason: lexical_alternative
  - marker: c
    text: 或译“愿雅威作”。这里的希伯来语形式既可按将来的宣告理解，也可能带有祈愿意味。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וִיהִי
  choice: 必作
  rationale: 结合本诗上下文的宣告语气，将该形式译作将来性的“必作”；其形式也可理解为祈愿语气，故以脚注保留“愿……作”的可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见现代汉语音译处理，保留其专名性质，不以称号代替。
- source_word: מִשְׂגָּב
  choice: 坚垒
  rationale: 该词指安全、难以攻取的高处或庇护之所。“坚垒”兼顾防护和坚固据点的意象，并保留原文两次重复。
- source_word: לַדָּךְ
  choice: 受欺压之人
  rationale: דַּךְ可指被压碎、遭压迫或受践踏的人；“受欺压之人”在现代汉语中自然，并保留其受苦和受压迫的含义。
- source_word: לְעִתּוֹת בַּצָּרָה
  choice: 患难时
  rationale: 以简洁自然的汉语表达复数“时候”及其处境性含义，即在一次次患难临到之时。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名；正文采用较贴近学界通行重构读音 Yahweh 的“雅威”，而不以“主”等称号替代。
- issue: וִיהִי 的陈述或祈愿语气
  choice: 必作
  alternative: 愿……作
  rationale: 上下文以审判与庇护的确定事实为宣告，宜译为“必作”；但希伯来语形式容许祈愿理解，因此不在正文中排除，而以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“坚垒”保留诗歌中的防御意象及重复结构；“患难时”简洁自然。正文采用“受欺压之人”而非较口语的“受欺负的人”，以符合诗篇体裁。
