  yaml_path: translation/ot/psalms/009/020.yaml
  text: Put fear in them, O LORD; let the nations know that they are only man. Selah
translation:
  language: zh_hans
  text: 耶和华啊，求你使他们恐惧；愿列国知道自己不过是凡人。细拉
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָה
  choice: 求你使
  rationale: 该词是动词“放置、设立”的祈使形式；结合呼语和诗歌祈求语境，用“求你使”自然表达向耶和华发出的请求。
- source_word: מוֹרָה
  choice: 恐惧
  rationale: 此处指临到列国、使其认清自身限度的惧怕或震慑；译作“恐惧”保留原文力度，又不额外指定其来源或方式。
- source_word: לָהֶם
  choice: 他们
  rationale: 介词短语字面为“给他们／在他们身上”，在汉语中与“使……恐惧”合译为“使他们恐惧”。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 诗篇语境中通常指各国或外邦民族；“列国”简洁庄重，并保留集体性。
- source_word: אֱנוֹשׁ
  choice: 凡人
  rationale: 该词表示人，常带脆弱、必死之人的意味；“凡人”比单纯的“人”更能传达与上帝相对的有限性。
- source_word: סֶּלָה
  choice: 细拉
  rationale: 其确切功能不明，可能是礼仪或音乐术语；采用传统音译，避免猜测性解释。
theological_decisions:
- issue: 列国所需认识的人类身份
  choice: 自己不过是凡人
  alternative: 他们只是人
  rationale: 原文“他们是 אֱנוֹשׁ”强调列国并非拥有神圣或无限权能，而是有限、必死的人；“不过是凡人”保留这种对比，同时不扩展为特定教义判断。
- issue: מוֹרָה 的含义
  choice: 使他们恐惧
  alternative: 为他们设立一位教师／统治者
  rationale: 在本节审判列国并使其认识自身有限的平行语境中，“恐惧、震慑”最合适；其他词源或释读虽曾被提出，但语境支持较弱。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈求语体。“耶和华啊”保留圣名的传统中文形式；分号呈现两个紧密相连的祈愿句。“细拉”独立置于句末，不对其未定含义作解释性增译。
