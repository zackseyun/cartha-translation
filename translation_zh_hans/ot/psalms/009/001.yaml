  text: אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לִבִּ֑/י אֲ֝סַפְּרָ֗ה כָּל נִפְלְאוֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/001.yaml
  text: I will give thanks to Yahweh with all my heart[a]; I will recount all your wondrous deeds.
translation:
  language: zh_hans
  text: 我要全心称谢雅威；我要述说你一切奇妙的作为。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文也可译作“你一切的奇事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: 我要……称谢
  rationale: ידה的使役词干在敬拜语境中常表达感谢、颂赞；“称谢”既保留感恩意味，也符合庄重而通顺的现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为专名的性质，不以称号替代。
- source_word: בְּכָל לִבִּי
  choice: 全心
  rationale: 自然传达“用我的全心”的希伯来语习语，强调毫无保留、全心全意。
- source_word: אֲסַפְּרָה
  choice: 我要述说
  rationale: ספר在此表示讲述、数说；“述说”适合诗人宣告上帝作为的语境，并具现代而庄重的语体。
- source_word: כָּל
  choice: 一切
  rationale: 明确保留原文的周全范围，修饰雅威奇妙的作为。
- source_word: נִפְלְאוֹתֶיךָ
  choice: 你一切奇妙的作为
  rationale: 该词可指令人惊叹的奇事，也可着重上帝施行的非凡作为；正文采用自然且兼具行动意味的表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”较直接反映学界通常采用的读音重构，同时不把专名改成“耶和华”等传统形式或“主”这一称号。
- issue: נִפְלְאוֹתֶיךָ是“奇事”还是“奇妙的作为”
  choice: 奇妙的作为
  alternative: 奇事
  rationale: 选择兼顾该词的惊奇性质和上帝行动的意味；脚注保留较简练的另一种理解，避免把词义范围收窄。
translation_notes:
  register: 采用现代、庄重、易懂的诗歌语言；两句都保留“我要”的平行结构，并明确呈现第二句的“一切”。脚注标记置于相关短语之后。
