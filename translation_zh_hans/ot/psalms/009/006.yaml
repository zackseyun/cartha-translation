  naturalness: 修订后使用“归于荒凉”“对它们的记念”等现代而庄重的诗歌表达；“连……也……”自然传达句末独立代词的强调。
  terminology: “仇敌”“城邑”可保留。“拔除了”恰当保留 נתשׁ 的连根除去意象。“记念”比“名号”更完整地涵盖 זֵכֶר 的语义范围，且不把城邑拟人化为拥有记忆。
