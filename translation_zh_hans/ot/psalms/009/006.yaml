source:
  edition: WLC
  text: הָֽ/אוֹיֵ֨ב תַּ֥מּוּ חֳרָב֗וֹת לָ֫/נֶ֥צַח וְ/עָרִ֥ים נָתַ֑שְׁתָּ אָבַ֖ד זִכְרָ֣/ם הֵֽמָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/006.yaml
  text: The enemy has come to an end in everlasting ruins[a]; you have uprooted cities; the very memory of them has perished.
translation:
  language: zh_hans
  text: 仇敌已经灭绝，永远归于荒凉[a]；你拔除了城邑，连对它们的记念也消逝了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仇敌啊，毁灭永远止息了。”希伯来文开头也可理解为直接向仇敌说话。
    reason: alternative_reading
lexical_decisions:
- source_word: הָאוֹיֵב
  choice: 仇敌
  rationale: 定冠词表明是“那仇敌／仇敌”；中文用“仇敌”自然地表达特指，也保留其可作呼语的句法可能，另见脚注。
- source_word: תַּמּוּ
  choice: 灭亡了
  rationale: 源自动词 תמם，表示终结、耗尽。与“仇敌”相连时译作“灭亡了”，在现代汉语中清楚传达彻底终结之意；希伯来文复数形式及其与后续名词的关系使开头句法存在歧义。
- source_word: חֳרָבוֹת
  choice: 废墟
  rationale: 该词可指毁坏、荒凉之处或废墟。“废墟”保留具体的毁灭景象，并与城邑被拔除的语境相合。
- source_word: לָנֶצַח
  choice: 永远
  rationale: 表达持续到永久；放在“沦为废墟”之前，中文自然且保留毁灭不可逆转的意味。
- source_word: וְעָרִים
  choice: 城邑
  rationale: עִיר 通常指城市或城镇。“城邑”庄重而易懂，也适合诗歌语体。
- source_word: נָתַשְׁתָּ
  choice: 你拔除了
  rationale: נתשׁ 带有连根拔起、彻底除去的形象。“拔除”保留这一强烈隐喻，不弱化为一般的“毁坏”。
- source_word: אָבַד
  choice: 消逝了
  rationale: 表示灭亡、消失或不复存在；用于名号时，“消逝了”符合中文表达，并传达彻底被遗忘的结果。
- source_word: זִכְרָם
  choice: 它们的名号
  rationale: זֵכֶר 可指记忆、纪念或留存的名声。“名号”在此表达城邑在人间留下的记念，避免“它们的记忆”在中文中被误解为城邑自身具有记忆。
- source_word: הֵמָּה
  choice: 连它们的
  rationale: 句末独立代词带强调作用；用“连……也”在中文中自然体现强调，并将所指理解为前面的城邑。
theological_decisions:
- issue: 开头分句的句法理解
  choice: 将“仇敌”理解为陈述的对象：仇敌灭亡，永远沦为废墟。
  alternative: 将“仇敌”理解为呼语：“仇敌啊，毁灭永远终止了。”
  rationale: 希伯来文开头可有不同切分；上下文较自然地宣告仇敌遭受最终毁灭，但呼语读法确有文本依据，故在脚注保留，不把句法选择提升为教义判断。
- issue: זִכְרָם הֵמָּה 的所指与强调
  choice: 理解为城邑的名号也消逝，并用“连……也”表达 הֵמָּה 的强调。
  alternative: 理解为仇敌或被毁之物的记忆消失，或较直译作“对它们的记念也灭亡了”。
  rationale: 最近的复数先行词是“城邑”，因此以其为所指最自然；但希伯来诗歌的代词所指可有一定开放性，译文不附加具体历史对象。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“沦为废墟”使中文连贯，同时保留 חֳרָבוֹת 的具体毁灭意象；“城邑”“名号”略带庄重色彩，但仍属现代读者熟悉的词语。脚注标记已在正文“废墟”后以 [a] 标出。
