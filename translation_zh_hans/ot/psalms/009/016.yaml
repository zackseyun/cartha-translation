base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/016.yaml
  text: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
translation:
  language: zh_hans
  text: 耶和华已显明自己[a]；他施行了审判。恶人被自己亲手所做的事缠住。希迦永[b]。细拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华为人所知；他施行了审判。”希伯来语“נודע”既可理解为状态性的被动（“为人所知”），也可理解为结果性的意思（“已显明自己”）。
    reason: alternative_reading
  - marker: b
    text: “希迦永”可能是音乐或礼仪术语；也可能意为“默想”，或是一种音乐提示，如“乐声响起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נודע
  choice: 彰显了自己
  rationale: 该词为ידע的尼法勒式，可表达被认识、显明或使自己为人所知；结合后面的审判行动，“彰显了自己”自然地传达借行动显明自身这一结果，同时用脚注保留静态被动的理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名最通行、最易识别的音译，以专名而非称号呈现。
- source_word: מִשְׁפָּט עָשָׂה
  choice: 施行了审判
  rationale: 该搭配指实施司法性的判断或裁决；“施行审判”在现代中文中庄重自然，并保留法律语义。
- source_word: בפעל כפיו
  choice: 被自己双手所做的事
  rationale: 介词短语说明恶人陷落的媒介或处境，即他亲手所做之事；“自己”明确原文第三人称所属关系在语境中的反身意味。
- source_word: נוקש
  choice: 绊住
  rationale: 该词表达落入网罗、被捕捉；“绊住”保留陷阱意象且适合与行为造成的反噬相连。
- source_word: רשע
  choice: 恶人
  rationale: 单数形容词名词化，指具有代表性的恶者；“恶人”简洁并保留单数类别称谓。
- source_word: הגיון
  choice: 希迦永
  rationale: 含义不确定，可能是音乐或礼仪术语，因此正文采用音译，可能含义列于脚注。
- source_word: סלה
  choice: 细拉
  rationale: 其确切功能不明，通常视为音乐或礼仪标记；沿用中文常见音译，不武断解释。
theological_decisions:
- issue: 上帝借审判彰显自己
  choice: 译作“耶和华彰显了自己；他施行了审判”，使神的显明与审判行动紧密相连，但不扩展为更广泛的教义陈述。
  alternative: “耶和华为人所知；他施行了审判。”
  rationale: 原文נודע既可作状态性被动，也可带结果或反身意味。正文采用借审判彰显自己的理解，脚注保留“为人所知”的可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留诗歌的简洁分句以及两个未能确定含义的礼仪或音乐术语。“双手所做的事”比抽象的“作为”更能保存原文כפיו的具体意象。
