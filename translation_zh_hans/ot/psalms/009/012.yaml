  text: כִּֽי דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣/ם זָכָ֑ר לֹֽא שָׁ֝כַ֗ח צַעֲקַ֥ת עניים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/012.yaml
  text: For the one who avenges bloodshed remembers them[a]; he does not forget the cry of the afflicted.
translation:
  language: zh_hans
  text: 因为那位追讨血债的记念他们；他不忘记受苦的人[a]的呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“穷苦人”。这个希伯来词可指贫穷、受苦、卑微或受压迫的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出本节作为前文陈述的理由，符合诗歌的论证衔接。
- source_word: דֹרֵשׁ דָּמִים
  choice: 那追讨血债的
  rationale: 该短语指追究流血之罪、使其承担责任；“追讨血债”既保留司法追偿的意味，也避免误解为单纯寻找鲜血或特指律法中的某一法定角色。
- source_word: אוֹתָם
  choice: 他们
  rationale: 保留希伯来文本的复数宾语，所指应为遭受苦难、向上帝呼求的人群。
- source_word: זָכָר
  choice: 记念
  rationale: 该完成式在诗歌平行结构中表达上帝一贯的作为；“记念”也含有顾念并采取行动的意味。
- source_word: לֹא שָׁכַח
  choice: 不忘
  rationale: 与“记念”形成正反平行，简洁地表达上帝持续不忽略他们的呼求。
- source_word: צַעֲקַת
  choice: 呼求
  rationale: 表示人在苦难中发出的求救呼声；“呼求”自然体现其向上帝求助的语境。
- source_word: עניים
  choice: 困苦人
  rationale: 此词可指贫穷、受苦、卑微或受压迫的人；本节涉及流血与伸冤，“困苦人”能较宽广地涵盖受难者，而不局限于经济贫困。
theological_decisions:
- issue: דֹרֵשׁ דָּמִים 所表达的神圣公义
  choice: 上帝追究流血之罪，为无辜受害者伸张公义
  alternative: 仅指上帝注意到流血事件，或按字面理解为寻求鲜血
  rationale: 该希伯来惯用语强调对血罪的追责与报应；译文保留上帝施行公义的含义，同时不把它过度限定为某种特定法律职分。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“追讨血债”保留司法公义的力度；分号呈现两句之间的平行关系。脚注标记置于其实际说明的“困苦人”之后。
