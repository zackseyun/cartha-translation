source:
  edition: WLC
  text: וַֽ֭/יהוָה לְ/עוֹלָ֣ם יֵשֵׁ֑ב כּוֹנֵ֖ן לַ/מִּשְׁפָּ֣ט כִּסְאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/007.yaml
  text: But Yahweh sits enthroned forever[b][a]; he has established his throne for judgment.
translation:
  language: zh_hans
  text: 但雅威永远坐着为王[a]；他已为审判立定宝座[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“坐着”；这里的语境带有坐在宝座上执掌王权的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他已为公正预备好他的宝座。”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: 但雅威
  rationale: 连接词在上下文中表达与恶人败亡相对的转折，故译为“但”；神名 יהוה 按其专名译作“雅威”。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 表达持续无尽的时间意义；“永远”是自然、庄重的现代汉语。
- source_word: יֵשֵׁב
  choice: 坐着为王
  rationale: 该动词本义是“坐”，结合下半句的“宝座”和审判语境，含有君王临朝的意味；译文明确这种王权意象，同时用脚注保留字面形式。
- source_word: כּוֹנֵן
  choice: 立定
  rationale: Polel 形式表达使之稳固、设立妥当；“立定”兼顾建立与稳固之意。
- source_word: לַמִּשְׁפָּט
  choice: 为审判
  rationale: מִשְׁפָּט 可指审判或公正；此处宝座是施行司法裁断之处，“为审判”保留直接的法律行动含义。
- source_word: כִּסְאוֹ
  choice: 他的宝座
  rationale: 这是带第三人称阳性单数后缀的名词，直指雅威的宝座；汉语正文承接同一主语，可自然省去“他的”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近该名可能读音的音译，不以称号替代专名。
- issue: יֵשֵׁב 所含的神圣王权意味
  choice: 坐着为王
  alternative: 坐着
  rationale: 原词字面为“坐”，但紧接“宝座”和“审判”，呈现君王临朝施行审判的图景；“坐着为王”使语境中的王权意味清楚，又以脚注保留原文字面。
- issue: מִשְׁפָּט 的审判与公正双重语义
  choice: 审判
  alternative: 公正
  rationale: 宝座语境首先突出司法裁断，因此正文用“审判”；“公正”作为结果或性质仍是真实可行的理解，列于脚注以保存语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坐着为王”保留希伯来文坐席意象并显明王权语境；分号对应诗句两半的平行结构。
