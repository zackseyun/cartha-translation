id: PSA.9.18
reference: Psalms 9:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י לֹ֣א לָ֭/נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן תִּקְוַ֥ת ענוים תֹּאבַ֥ד לָ/עַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/018.yaml
  text: For the needy will not be forgotten forever[b][a]; the hope of the afflicted will not perish forever.
translation:
  language: zh_hans
  text: 因为贫困的人不会永远被遗忘；受苦之人[a]的盼望也不会永远破灭。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受苦之人”也可译作“谦卑的人”或“温柔的人”。
    reason: lexical_alternative
  - marker: b
    text: 原文用两个意义相近的时间说法，分别相当于“永远”和“直到永久”，以平行的两句强调：贫困的人不会永远被遗忘，受苦之人的盼望也不会永远破灭。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为此前的祈求提供理由或确信；“因为”自然保留其连接和说明根据的作用。
- source_word: לֹא לָנֶצַח יִשָּׁכַח
  choice: 不会永远被遗忘
  rationale: 保留希伯来文的否定、时间状语和被动语态，不把语境中隐含的施事者明说出来。
- source_word: אֶבְיוֹן
  choice: 贫困的人
  rationale: 该词指缺乏、贫穷而有需要的人；此译既体现经济与社会处境，也采用现代汉语中自然且尊重人的表达。
- source_word: תִּקְוַת
  choice: ……的盼望
  rationale: 构造形要求与后面的名词相连；“盼望”符合诗篇语体，也自然表达期待与所盼之事。
- source_word: ענוים
  choice: 受苦之人
  rationale: 该词可指受压迫、困苦的人，也可指谦卑或温柔的人；在与“贫困的人”平行的语境中，受苦的社会处境较为突出。
- source_word: תֹּאבַד
  choice: 也不会……破灭
  rationale: אבד基本义为灭亡、消失或失落；以“盼望”为主语时，“破灭”是自然的现代汉语搭配。第二分句沿用第一分句的否定关系，补出“不会”以免误解。
- source_word: לָעַד
  choice: 永远
  rationale: 与לָנֶצַח构成近义诗歌平行，重复“永远”保留原文的强调效果。
theological_decisions:
- issue: “被遗忘”的施事者
  choice: 采用被动式“不会永远被遗忘”，不明说是谁遗忘
  alternative: 译为“上帝不会永远忘记贫困的人”
  rationale: 原文使用被动动词，语境虽暗示上帝的眷顾，却没有在本句明列施事者；保留被动可避免把隐含主语写入正文。
- issue: ענוים的语义取向
  choice: 受苦之人
  alternative: 谦卑的人／温柔的人
  rationale: 该词兼有社会困苦与品格谦卑的语义可能；本节与אֶבְיוֹן形成平行，因此正文突出受苦处境，同时以脚注保留其他真实可能。
- issue: 第二分句的否定关系
  choice: 补出“不会”
  alternative: 按表层形式译作“受苦之人的盼望将永远破灭”
  rationale: 马所拉文本第二分句没有重复לֹא，但诗歌平行结构通常使第一分句的否定延续到第二分句；汉语若不补出否定会表达相反意思。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两行均保留“永远”，呈现希伯来诗歌的近义平行与强调；使用“贫困的人”而非标签化较强的名词，并以分号表现两个诗行的紧密对应。
