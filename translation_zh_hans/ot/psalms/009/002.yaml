  text: אֶשְׂמְחָ֣ה וְ/אֶעֶלְצָ֣ה בָ֑/ךְ אֲזַמְּרָ֖ה שִׁמְ/ךָ֣ עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/002.yaml
  text: I will rejoice and exult in you[a]; I will sing praise to your name[b], Most High.
translation:
  language: zh_hans
  text: 我要因你欢喜雀跃[a]；至高者啊，我要歌颂你的名[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要因你欢喜、快乐。”
    reason: lexical_alternative
  - marker: b
    text: “至高者”是对神的称号。
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂמְחָה
  choice: 我要……欢喜
  rationale: שׂמח 表达欢喜、喜乐；第一人称形式在此带有意愿或决心意味，用“我要”自然体现这种语气。
- source_word: וְאֶעֶלְצָה
  choice: 快乐
  rationale: עלץ 表示洋溢、雀跃的喜乐。与“欢喜”并列为“欢喜快乐”，既保留两个近义动词的加强作用，也符合现代汉语表达。
- source_word: בָךְ
  choice: 因你
  rationale: 介词 ב 在喜乐类动词后可表示喜乐所系的对象或缘由。“因你”在现代汉语中自然，同时保留喜乐以神为中心的含义；“在你里面”虽较贴近字面，却较不自然。
- source_word: אֲזַמְּרָה
  choice: 我要歌颂
  rationale: זמר 的 Piel 形式常指以歌唱或音乐赞美；“歌颂”简洁地传达赞美性的歌唱，并保留第一人称的意愿语气。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 直译“你的名”，保留希伯来文中“名”所承载的身份、声誉和启示之意，不另作解释性扩展。
- source_word: עֶלְיוֹן
  choice: 至高者啊
  rationale: עֶלְיוֹן 在此是对神的称号，并具有呼语功能。“至高者啊”清楚、庄重地呈现直接称呼。
theological_decisions:
- issue: 神圣称号 עֶלְיוֹן 的译法
  choice: 至高者啊
  alternative: 至高者；至高的主啊
  rationale: 原文只用“至高者”这一称号，并未出现“主”。采用呼语“至高者啊”既显明这里是在直接称呼神，也避免添加原文没有的神名称谓。
- issue: בָךְ 所表达的喜乐关系
  choice: 因你
  alternative: 在你里面；以你为乐
  rationale: 原文可以强调神是喜乐的对象、范围或缘由。“因你”是自然简洁的汉语表达，但不应把这一介词结构限定为单一神学概念，因此脚注保留较贴近字面的译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“欢喜快乐”保留原文两个喜乐动词的并列加强；分号呈现两组平行陈述。将呼语“至高者啊”前置于第二分句，使现代汉语更顺畅，同时脚注说明原文语序。
