  text: גָּעַ֣רְתָּ ג֭וֹיִם אִבַּ֣דְתָּ רָשָׁ֑ע שְׁמָ֥/ם מָ֝חִ֗יתָ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/005.yaml
  text: You rebuked nations[a]; you destroyed the wicked[b]; you blotted out their name forever and ever.
translation:
  language: zh_hans
  text: 你斥责列国，消灭恶人[a]；你将他们的名永永远远地抹去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那恶人”或“恶者”。希伯来文为单数，既可指一个人，也可泛指一类人。
    reason: alternative_reading
  - marker: b
    text: “名”在这里也可含有“记忆”或“声名”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּעַרְתָּ
  choice: 你斥责
  rationale: גּער表示有权能、带审判意味的严厉责斥；“斥责”既保留直接言语行动，也不过度解释其结果。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 在诗篇的审判语境中，גוים指各国或各民族；“列国”自然、庄重，也避免引入后期特定宗教语境中的“外邦人”含义。
- source_word: אִבַּדְתָּ
  choice: 消灭了
  rationale: אבד的Piel词干表达使之灭亡、毁灭；“消灭了”准确体现其使动和强烈的审判意味。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词形态上是单数，但可作类称或集合性用法；结合前句“列国”及后文复数后缀“他们的”，主文用“恶人”保留汉语中可泛指一类人的表达。
- source_word: שְׁמָם
  choice: 他们的名
  rationale: 希伯来文直译为“他们的名”；这里的“名”可延伸指记忆或声名，但主文保留原有意象。
- source_word: מָחִיתָ
  choice: 抹去
  rationale: מחה表示擦除、涂抹或除灭；“抹去”保留了将名字从记录或记忆中除掉的鲜明比喻。
- source_word: לְעוֹלָם וָעֶד
  choice: 永远
  rationale: 该叠加强调持续无尽；现代汉语“永远”已自然承载这一强调，比机械译作“永永远远”更简洁流畅。
theological_decisions:
- issue: רָשָׁע是集合性类称还是个体单数
  choice: 集合性或类称：恶人
  alternative: 个体性：那恶人／恶者
  rationale: 该单数名词可指一类人，也可指某个恶人。上下文先提“列国”，随后使用复数后缀“他们的名”，因此集合性理解更连贯；脚注保留个体性读法，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“列国”“斥责”保留诗篇审判语域；分号呈现两个平行审判行动。所有脚注标记均置于主文对应词句之后。
