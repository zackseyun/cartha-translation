  text: זַמְּר֗וּ לַ֭/יהוָה יֹשֵׁ֣ב צִיּ֑וֹן הַגִּ֥ידוּ בָ֝/עַמִּ֗ים עֲלִֽילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/011.yaml
  text: Sing praises to Yahweh[a], who dwells in Zion; declare his deeds among the peoples.
translation:
  language: zh_hans
  text: 你们要歌颂雅威——住在锡安的那一位[a]；要在万民中宣扬他的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坐在锡安的那一位”。
    reason: יֹשֵׁב可表示“住”或“坐”；在此诗篇语境中后者可伴随王权联想，但原文并未明说“宝座”。
lexical_decisions:
- source_word: זַמְּרוּ
  choice: 你们要歌颂
  rationale: 这是复数命令式；“歌颂”自然表达以歌声赞美的含义，也符合诗歌体庄重而易懂的语域。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 原文直接使用神的名字יהוה；采用“雅威”音译，以保留其专名性质。
- source_word: יֹשֵׁב צִיּוֹן
  choice: 住在锡安的那一位
  rationale: יֹשֵׁב可指居住，也可含坐着、登座之意。正文采用自然且较少解释性的“住在”，不排除其王权意象。
- source_word: הַגִּידוּ
  choice: 宣扬
  rationale: Hifil复数命令式，表示公开讲述、使人知道；“宣扬”适合面向万民的公开宣告。
- source_word: בָעַמִּים
  choice: 在万民中
  rationale: 介词ב表示“在……中”；עַמִּים为复数群体。“万民”是现代中文圣经语域中自然、简洁的集合表达。
- source_word: עֲלִילוֹתָיו
  choice: 他的作为
  rationale: 该词指所行之事或行动；“作为”简洁庄重，不额外加入“伟大”或“大能”等原文未明说的修饰。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 正文以“雅威”音译四字神名，直接保留其作为圣约之神专名的性质；“耶和华”是传统汉译，但较不贴近通常重构的读音。
- issue: יֹשֵׁב צִיּוֹן的居住与登座含义
  choice: 住在锡安的那一位
  alternative: 坐在锡安宝座上的那一位
  rationale: 分词יֹשֵׁב本身可表达居住或坐着，在诗篇的神圣君王语境中也可能暗含登座掌权。正文保留较宽泛的“住在”，脚注注明王权性读法，以保存原文张力。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“你们要……；要……”重现两个复数命令式；破折号使“住在锡安的那一位”清楚指向雅威。
