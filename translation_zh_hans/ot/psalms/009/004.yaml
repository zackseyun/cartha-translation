  text: כִּֽי עָ֭שִׂיתָ מִשְׁפָּטִ֣/י וְ/דִינִ֑/י יָשַׁ֥בְתָּ לְ֝/כִסֵּ֗א שׁוֹפֵ֥ט צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/004.yaml
  text: For you have upheld my justice and my cause[a]; you sat on the throne[b], judging righteously.
translation:
  language: zh_hans
  text: 因为你维护了我的权利和案件[a]；你坐在宝座上，按公义审判[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的判决和我的诉讼”，或“我的权利和我的案件”。原文用两个成对的法律词语，表达诗人的权利和案件得到伸张、维护。
    reason: lexical_alternative
  - marker: b
    text: 或译“公正地审判”。原文用名词“公义”作副词性表达，即“以公义审判”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人赞美的理由，保留原文的因果关系。
- source_word: עָשִׂיתָ
  choice: 维护了
  rationale: 该动词本义为“做、施行”，与法律词语“公理、案件”连用时，表达维护或伸张某人的合法权利；“维护了”自然保留司法语境。
- source_word: מִשְׁפָּטִי
  choice: 我的公理
  rationale: מִשְׁפָּט可指判决、公正或合法权利；这里与דִּין并列，指诗人得到申明的正当权利。“公理”保留道德与司法两方面的含义。
- source_word: וְדִינִי
  choice: 我的案件
  rationale: דִּין在此指诉讼、案情或争讼中的主张；译作“案件”可与“公理”区分，并保持成对的法律用语。
- source_word: יָשַׁבְתָּ
  choice: 你坐
  rationale: 完成式描绘上帝就座审判；汉语“坐在宝座上”简洁自然，也保留原文的王权及法庭图景。
- source_word: לְכִסֵּא
  choice: 在宝座上
  rationale: 介词与“宝座”结合表示就座于宝座；定指表达符合此处上帝作为君王和审判者的语境。
- source_word: שׁוֹפֵט
  choice: 施行审判
  rationale: 分词描述上帝坐在宝座上履行审判者的职分；译成动词短语符合现代汉语表达。
- source_word: צֶדֶק
  choice: 按公义
  rationale: 原文名词“公义”在这里具有副词作用，修饰“审判”；“按公义”既自然，也保留名词形式及其神学张力。
theological_decisions:
- issue: 上帝作为审判者的司法意象
  choice: 明确呈现上帝坐在宝座上，以审判维护诗人的公理和案件。
  alternative: 笼统译为上帝替诗人行事或帮助诗人。
  rationale: מִשְׁפָּט、דִּין、כִּסֵּא和שׁוֹפֵט共同构成鲜明的法庭与王权意象，因此不应弱化为一般性的帮助；同时不引入原文以外的教义范畴。
- issue: צֶדֶק的语法与意义
  choice: 译为“按公义”，把名词理解为副词性用法，说明审判的方式或准则。
  alternative: 译为“公义的审判者”，使“公义”直接修饰审判者。
  rationale: 原文可直译为“审判公义”，通常理解为“按公义审判”；采用“按公义”清楚自然，同时以脚注提示“公正地”的可能表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“公理和案件”保留原文成对的司法术语及一定程度的歧义；“按公义施行审判”比生硬直译更自然，同时不削弱宝座、审判与伸冤的整体意象。
