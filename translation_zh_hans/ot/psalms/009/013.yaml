  text: חָֽנְנֵ֬/נִי יְהוָ֗ה רְאֵ֣ה עָ֭נְיִ/י מִ/שֹּׂנְאָ֑/י מְ֝רוֹמְמִ֗/י מִ/שַּׁ֥עֲרֵי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/013.yaml
  text: Be gracious to me[a], O Yahweh; see my affliction from those who hate me[b], you who lift me up from the gates of death.
translation:
  language: zh_hans
  text: 雅威啊，求你恩待我[a]；求你察看那些恨我的人所加给我的苦难。你这位将我从死亡之门救拔出来的[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你怜悯我。”
    reason: lexical_alternative
  - marker: b
    text: “死亡之门”是希伯来语意象，表示临近死亡或处在死亡权势之下。
    reason: cultural_note
lexical_decisions:
- source_word: חָנְנֵנִי
  choice: 求你施恩于我
  rationale: 该词是חנן的祈使式，带第一人称单数宾语后缀，表达恳求上帝赐下恩惠；“施恩于我”直接而庄重，也保留“怜悯我”这一可行词义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: רְאֵה
  choice: 求你察看
  rationale: ראה的祈使式本义是“看”；祷告语境中的“察看”既自然，又表达诗人恳求上帝关注其处境，但未扩展为“解决”。
- source_word: עָנְיִי
  choice: 我的苦难
  rationale: עֳנִי可指困苦、患难或受压迫的悲惨处境；“苦难”不限定为身体、经济或情绪层面。
- source_word: מִשֹּׂנְאַי
  choice: 那些恨我的人所加给我的
  rationale: 介词מִן在此最自然地说明苦难的来源，即苦难来自恨诗人的人；译文显明这一关系，同时不把他们泛化为一般的“仇敌”。
- source_word: מְרוֹמְמִי
  choice: 你这位……举起来的
  rationale: 这是רום的Polel主动分词，带第一人称单数宾语后缀，并以呼语或同位语称呼雅威；译文保留持续施行“举起”的形象和直接称呼。
- source_word: מִשַּׁעֲרֵי מָוֶת
  choice: 从死亡之门
  rationale: 直译保留希伯来诗歌中处于死亡门槛或死亡权势之下的鲜明意象；原文没有“阴间”一词，因此不将其加入正文。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的读音，并明确呈现专名，而非用“主”这一称号取代。
- issue: “从那些恨我的人”与上下文的句法关系
  choice: 修饰“我的苦难”，即苦难是那些恨诗人的人所加给他的
  alternative: 较松散地理解为“察看我的苦难，也察看那些恨我的人”
  rationale: 该介词短语紧接“我的苦难”，最自然地表示苦难的来源；这样也无需补出原文没有的第二个“察看”。
- issue: מְרוֹמְמִי的语用功能
  choice: 保留为对雅威的呼语：“你这位……的”
  alternative: 改写为独立陈述：“你把我从死亡之门救拔上来”
  rationale: 希伯来文使用分词形式，可作呼语或同位语；呼语译法保留其语法形态，也避免把它静默改成一个有明确时态的陈述句。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语言。“所加给我的”使介词短语与“苦难”的关系在汉语中清楚；末句保留原文分词呼语的诗性张力，因此未直接改写为“你救了我”。所有脚注标记均置于正文对应位置。
