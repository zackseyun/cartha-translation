base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/017.yaml
  text: The wicked will return to Sheol—all the nations that forget God[a][b].
translation:
  language: zh_hans
  text: 恶人，即所有忘记上帝的列国，都必归回阴间[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“转回阴间。”希伯来语动词可表示“归回”或“转回”。
    reason: lexical_alternative
  - marker: b
    text: “阴间”对应希伯来语“示奥尔”，指死者的领域；其含义并不等同于后来意义更具体的“地狱”。
    reason: cultural_note
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: 必归回
  rationale: שוב 的 Qal 未完成式第三人称阳性复数可表示“返回、转回”。“必归回”既保留朝向阴间的动态，也在诗歌语境中自然表达将来的确定性；脚注注明“转回”这一可能译法。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是形容词复数作名词用，指道德上邪恶的人；“恶人”简洁、自然，并保留其类别性含义。
- source_word: לִשְׁאוֹלָה
  choice: 阴间
  rationale: שְׁאוֹלָה 带方向意义，表示“到示奥尔去”。汉语圣经传统中的“阴间”可指死者所在之处，比“坟墓”宽泛，也不像“地狱”那样引入后期更具体的神学含义。脚注解释其范围。
- source_word: כָּל גּוֹיִם
  choice: 所有……的列国
  rationale: כָּל 加复数名词表示整体性的“所有列国”。“列国”保留民族、邦国的群体含义，避免译成“外邦人”而额外引入以色列与外邦的对比。
- source_word: שְׁכֵחֵי אֱלֹהִים
  choice: 忘记上帝的
  rationale: 这是附属结构中的主动分词短语，用作对列国的描述。“忘记上帝的”在现代汉语中自然，也保留其持续或特征性的意味。
theological_decisions:
- issue: 审判语境中 שְׁאוֹל 的含义
  choice: 译作“阴间”，并以脚注说明是死者所在之处
  alternative: 坟墓；示奥尔；地狱
  rationale: 本节确实宣告恶人的结局，但希伯来词本身并不必然等同于后来意义更具体的“地狱”。“阴间”既可读懂，又保留原文的概念范围，避免把经文未明确表达的教义细节加入译文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“恶人”“列国”“阴间”具有适度的诗体和经文语域，但普通读者仍可理解。破折号后补出“都必如此”，明确后置的“所有忘记上帝的列国”与前一谓语共用，未改变原文判断。所有脚注标记均置于正文相关词语之后。
