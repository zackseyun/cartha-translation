    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 诗篇标题中，这一形式通常是给负责领唱或统筹圣乐者的演奏指示。“乐长”简洁、庄重，也比泛称“音乐主管”更符合礼仪语境。
- source_word: עַלְמוּת לַבֵּן
  choice: 调用《儿子之死》
  rationale: 该短语含义很不确定，可能是曲调名或演奏指示。“调用”表达按某一曲调演唱的标题功能，《儿子之死》则反映马所拉读法下常见的词义理解；不确定性在脚注中明确保留。
- source_word: מִזְמוֹר
  choice: 诗篇
  rationale: 该名词在标题中通常标明诗歌或圣歌体裁；“诗篇”是自然且通行的现代汉语表达。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 在诗篇标题中可表示作者、归属、关联、献给或所属诗集。“大卫的”保留一定的关系性含义，避免明确译成“大卫所作”而排除其他可能。
theological_decisions:
- issue: לְדָוִד 所表达的大卫与本诗的关系
  choice: 大卫的诗篇
  alternative: 大卫所作的诗篇／献给大卫的诗篇
  rationale: 原文只用关系范围较广的介词 לְ，不能仅凭标题确定为作者署名或题献；因此采用较宽泛的属格表达，不作超出原文的神学或历史判断。
translation_notes:
  register: 采用简洁庄重的现代标准汉语，保留诗篇标题的分句结构。“调用”是普通读者可理解的曲调指示；脚注紧跟其所解释的疑难短语。
