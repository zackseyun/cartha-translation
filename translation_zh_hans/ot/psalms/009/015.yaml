source:
  edition: WLC
  text: טָבְע֣וּ ג֭וֹיִם בְּ/שַׁ֣חַת עָשׂ֑וּ בְּ/רֶֽשֶׁת ז֥וּ טָ֝מָ֗נוּ נִלְכְּדָ֥ה רַגְלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/015.yaml
  text: The nations have sunk into the pit they made; in the net they hid[a], their own foot has been caught.
translation:
  language: zh_hans
  text: '列国陷入自己挖的坑中；

    他们的脚[a]被自己暗设的网罗缠住了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“脚”是单数，可能是把列国视为一个整体的集合单数。
    reason: 说明原文数的一致性及其可能的集合用法。
lexical_decisions:
- source_word: טָבְעוּ
  choice: 陷入
  rationale: 该词为Qal完成式，表达下沉、沉没；与“坑”搭配时，“陷入”既自然，也保留落入毁灭之境的意象。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 该词通常指各国、列邦；诗篇语体中“列国”简洁庄重，也适合此处集合性的敌对 nations。
- source_word: בְּשַׁחַת
  choice: 坑中
  rationale: שַׁחַת在此指坑，也可能带有陷阱坑的意味；“坑中”保留具体意象，不额外限定其用途。
- source_word: עָשׂוּ
  choice: 自己挖的
  rationale: 原义是“做、造”；汉语说“挖坑”最自然。“自己”明确呈现本节所强调的反讽：列国落入亲手预备的祸患。
- source_word: בְּרֶשֶׁת
  choice: 被……网罗缠住
  rationale: רֶשֶׁת指捕捉用的网；结合后面的被动动词，以“被网罗缠住”自然表达落网的图像。
- source_word: זוּ
  choice: 自己暗设的
  rationale: זוּ是关系词“所……的”；在汉语中融入定语结构，不另行直译。
- source_word: טָמָנוּ
  choice: 暗设
  rationale: 该词意为隐藏、暗藏，常用于秘密布置圈套；“暗设”适合网罗的语境，并保留隐秘设伏的含义。
- source_word: נִלְכְּדָה
  choice: 被……缠住了
  rationale: Niphal完成式表达“被捕获、被困住”；被动句式保留原文语态，“缠住”也与网罗的形象自然相合。
- source_word: רַגְלָם
  choice: 他们的脚
  rationale: 原文是单数“他们的脚”，可理解为指列国的集合单数。正文保留汉语中形式相同而可作单复理解的“脚”，并用脚注说明。
theological_decisions: []
