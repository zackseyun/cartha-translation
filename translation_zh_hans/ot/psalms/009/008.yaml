  text: וְ/ה֗וּא יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק יָדִ֥ין לְ֝אֻמִּ֗ים בְּ/מֵישָׁרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/008.yaml
  text: And he will judge the world in righteousness[b][a]; he will govern the peoples with fairness.
translation:
  language: zh_hans
  text: 他要按公义审判世界[a]，以公平裁断万民[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世界”也可理解为“有人居住的世界”。
    reason: lexical_alternative
  - marker: b
    text: “以公平”也可译为“以正直”或“按公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: 他
  rationale: 代词在上下文中承接前文，并略带强调；现代汉语无须机械译出连接词，也不必加“亲自”而强化原文语气。
- source_word: יִשְׁפֹּט
  choice: 要……审判
  rationale: שׁפט在此指施行司法性的判断；未完成式可表达将来或一贯行动，“要”保留这种开放性，不限定具体末世时间表。
- source_word: תֵּבֵל
  choice: 世界
  rationale: תֵּבֵל通常指有人居住的世界或整个世上人类生活的范围；“世界”自然简明，较“地土”更符合此处普世范围。
- source_word: בְּצֶדֶק
  choice: 按公义
  rationale: 介词短语表示审判所依据的准则或方式；“按公义”保留צֶדֶק的名词形式及其道德、司法分量。
- source_word: יָדִין
  choice: 裁断
  rationale: דין与前句的שׁפט语义相近，均有审判、断定之意；“裁断”既保留司法含义，也体现诗句平行中的词语变化，避免将其泛化为单纯的行政治理。
- source_word: לְאֻמִּים
  choice: 万民
  rationale: לְאֻמִּים指众民族、众民；“万民”是现代汉语中庄重而易懂的集合表达，不限于现代民族国家。
- source_word: בְּמֵישָׁרִים
  choice: 按正直
  rationale: מֵישָׁרִים可指正直、公平或公正；“按正直”较贴近名词形式，并与前句“按公义”构成平行。
theological_decisions:
- issue: 上帝对全人类的审判及其时间指向
  choice: 译作“要……审判／裁断”，肯定其普世而公义的司法统治，同时不限定为某一特定末世时间点。
  alternative: 可理解为上帝持续、惯常的审判，也可侧重将来的终极审判。
  rationale: 诗歌中的希伯来语未完成式既可具有将来指向，也可表达特征性或持续性的行动；译文保留这种张力，不额外建立时间体系。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“审判／裁断”对应原文两个近义动词，保留诗歌平行与细微变化；两个“按……”短语则呈现原文对公义、公平准则的强调。
