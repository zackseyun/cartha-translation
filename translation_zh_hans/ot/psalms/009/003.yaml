  text: בְּ/שׁוּב אוֹיְבַ֥/י אָח֑וֹר יִכָּשְׁל֥וּ וְ֝/יֹאבְד֗וּ מִ/פָּנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/003.yaml
  text: When my enemies turn back[a], they stumble and perish before you.
translation:
  language: zh_hans
  text: 我的仇敌退后时，他们在你面前[a]绊倒、灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译：“在你的临在中”；原文直译“从你面前”。
    reason: 词义与句法存在可成立的不同理解。
lexical_decisions:
- source_word: בְּשׁוּב
  choice: ……转身……时
  rationale: 介词 בְּ 加不定词附属形构成时间从句；译作“……时”自然地保留了时间关系。
- source_word: אוֹיְבַי
  choice: 我的仇敌
  rationale: אוֹיֵב 加第一人称单数词尾，直指“我的仇敌”；此译简洁、庄重。
- source_word: אָחוֹר
  choice: 退后
  rationale: 该词在此作副词，与“转身”连用，表示向后退却；“转身退后”既保留方向性，也符合现代汉语表达。
- source_word: יִכָּשְׁלוּ
  choice: 绊倒
  rationale: כשל 的尼法勒未完成式表达失足、踉跄或跌倒；“绊倒”保留原文意象，又不提前把它等同于随后所说的灭亡。
- source_word: וְיֹאבְדוּ
  choice: 灭亡
  rationale: אבד 的 Qal 词干可指灭亡或毁灭；“灭亡”符合诗歌中的递进关系，同时不额外规定其具体方式。
- source_word: מִפָּנֶיךָ
  choice: 在你面前
  rationale: 原文可直译为“从你面前”，也可表达“在你的面前／临在中”。正文采用自然的“在你面前”，脚注保留“因你的临在”这一可能理解。
theological_decisions:
- issue: 仇敌败亡中上帝作为的具体方式
  choice: 表述仇敌在上帝面前绊倒、灭亡，不进一步说明上帝施行审判的机制。
  alternative: 明确译成上帝亲自毁灭他们，或译成他们仅因看见上帝的显现便倒下。
  rationale: 希伯来文只说他们“从／在你面前”绊倒、灭亡；本译保留上帝临在与其败亡之间的强烈联系，却不把原文未明说的因果方式具体化。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“转身退后”清楚表达撤退动作；“绊倒、灭亡”保留原文两个动词的递进。脚注标在“你面前”之后，使标记与其实际说明的希伯来语短语对应。
