base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/008.yaml
  text: Do not harden your hearts as at Meribah[d][c][b][a], as on the day at Massah in the wilderness.
translation:
  language: zh_hans
  text: 不要使你们的心刚硬，像在米利巴那样，像在旷野玛撒的那一天那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּקְשׁוּ
  choice: 不要使……刚硬
  rationale: אַל与未完成式构成禁止语气；תַּקְשׁוּ是קשׁה的使役式，直指“使……刚硬”。
- source_word: לְבַבְכֶם
  choice: 你们的心
  rationale: לֵבָב为单数，后缀为第二人称阳性复数；汉语以“你们的心”自然表达对群体中众人的劝诫，同时保留“心”这一核心意象。
- source_word: כִּמְרִיבָה
  choice: 像在米利巴
  rationale: מְרִיבָה既有“争闹、争竞”之义，也在此唤起旷野事件的地名；正文采用音译以保存历史互文，词义收入脚注。
- source_word: כְּיוֹם מַסָּה
  choice: 像在……玛撒那一天
  rationale: כְּיוֹם表示“像……那一天”；מַסָּה可作“试探、试验”，在此也指相关旷野事件或地点。译作专名并保留时间性的比较。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר在出埃及叙事语境中指荒野地带；“旷野”是准确且具有经文关联的现代汉语表达。
theological_decisions:
- issue: מְרִיבָה和מַסָּה应译作普通名词还是历史专名
  choice: 正文译作专名“米利巴”和“玛撒”，脚注说明其普通词义
  alternative: “像争闹时一样，像在旷野试探的那一天”
  rationale: 两个词指向以色列人在旷野中的具体事件，同时各自带有解释事件性质的词义。专名译法保存与出埃及记17:7及民数记20:13的互文联系，脚注则避免遮蔽希伯来语的双关。
- issue: לְבַבְכֶם中单数“心”与复数受话者的关系
  choice: 译作“你们的心”
  alternative: “你们各人的心”或“你们的心灵”
  rationale: 原文以单数名词配复数所属后缀，可同时涵盖群体与个体；“你们的心”不额外规定二者之间的关系，也保留圣经中“心”的完整语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要使你们的心刚硬”贴近希伯来语使役结构；两个地名保留传统且易辨认的音译。句中重复“像”以再现原文平行结构，并让劝诫保持有力。
