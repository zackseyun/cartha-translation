source:
  edition: WLC
  text: כִּ֘י ה֤וּא אֱלֹהֵ֗י/נוּ וַ/אֲנַ֤חְנוּ עַ֣ם מַ֭רְעִית/וֹ וְ/צֹ֣אן יָד֑/וֹ הַ֝/יּ֗וֹם אִֽם בְּ/קֹל֥/וֹ תִשְׁמָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/007.yaml
  text: For he is our God[a], and we are the people of his pasture, and the sheep of his hand. Today, if you hear his voice—
translation:
  language: zh_hans
  text: '因为他是我们的上帝；


    我们是他草场上的子民，


    也是他手中的羊群。


    今天，你们若[a]听见他的声音——'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但愿你们今天听见他的声音！”希伯来语中的这个词既可引出条件句，也可在此类劝诫语境中表达愿望。
    reason: 保留 אִם 的愿望式语气这一有根据的词义选择。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出前面呼召敬拜的理由；“因为”自然表达其解释和因果作用。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 准确表达名词及第一人称复数所有格，也符合现代汉语中常见而庄重的圣经用语。
- source_word: עַם מַרְעִיתוֹ
  choice: 他牧场的子民
  rationale: 保留“子民”与“牧场”的牧养意象，同时使领属结构在现代汉语中清楚自然。
- source_word: צֹאן יָדוֹ
  choice: 他手中的羊群
  rationale: 较贴近原文“他手的羊群”，保留“手”的具体比喻及其照管、保护和掌管的含义，而不把这些含义直接解释进正文。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 是现代汉语最自然的对应词，并保留本词作为下文警告之修辞转折点的突出位置。
- source_word: אִם
  choice: 若
  rationale: 保留条件式读法，顺畅引向下一节“不可硬着心”的劝诫；其也可能表达愿望式劝告，故在脚注中说明。
- source_word: בְּקֹלוֹ תִשְׁמָעוּ
  choice: 你们听见他的声音
  rationale: שׁמע 可表示听见、听从或顺服；正文采用较基本的“听见”，保留上下文所暗含的听从要求，而不提前消除词义张力。
theological_decisions:
- issue: 末句 הַיּוֹם אִם בְּקֹלוֹ תִשְׁמָעוּ 的语气
  choice: 译作条件兼劝诫性的开句：“今天，你们若听见他的声音——”
  alternative: 译作愿望或迫切劝告：“但愿你们今天听见他的声音！”
  rationale: אִם 通常可引出条件句，在诗歌和劝诫语境中也可能带有愿望语气。此处条件式能自然衔接下一节的禁令，但愿望式亦有语言依据，因此不在正文中武断排除，而以脚注保留。
- issue: “听见”是否应直接译为“听从”
  choice: 正文译作“听见”，由后文显明顺服的要求
  alternative: 译作“听从他的声音”或“听他的话”
  rationale: שׁמע 的语义范围包括听见、聆听与顺服。采用“听见”可保存听到与回应之间的张力，避免把语境含义完全并入词面。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以分行保留诗体节奏和平行结构；“牧场”“羊群”“手中”等具体意象均予保留。破折号显示本节句意在下一节继续展开。
