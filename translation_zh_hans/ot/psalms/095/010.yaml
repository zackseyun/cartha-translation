base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/010.yaml
  text: For forty years I loathed that generation[a], and said, “They are a people who go astray in heart, and they have not known my ways.”
translation:
  language: zh_hans
  text: 四十年之久，我厌恶那一代人[a]，说：“他们是心里走迷的百姓；他们不认识我的道路。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我厌烦那一代人”或“我因那一代人忧伤。”希伯来文这个动词可以表达厌恶、厌烦或忧伤；正文采用较强的译法，以体现上下文的力度。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年来
  rationale: 前置时间短语并用“来”明确持续时段，符合现代汉语，也忠实表达希伯来文的时间范围。
- source_word: אָקוּט
  choice: 我厌恶
  rationale: קוט可表达反感、厌烦或忧伤；“厌恶”保留此处强烈的排斥与不悦，同时不额外引入愤怒等原文未明说的概念。
- source_word: בְּדוֹר
  choice: 那一代人
  rationale: 介词ב在情感动词之后标明所针对的对象；结合旷野世代的语境，译为“那一代人”自然且明确。
- source_word: עַם תֹּעֵי לֵבָב
  choice: 他们是心里迷误的百姓
  rationale: תֹּעֵי是表示持续特征的主动分词；“心里迷误”保留“心”所指的内在意向，也体现不断偏离的状态。
- source_word: לֹא יָדְעוּ דְרָכָי
  choice: 不认识我的道路
  rationale: ידע基本义为“认识、知道”；“我的道路”保留原有比喻，可涵盖上帝的作为与旨意，不将含义缩窄为单纯的理解。
- source_word: וָאֹמַר
  choice: 我说
  rationale: 直译叙事中的连续动作；汉语另起一句即可自然表达希伯来文连词所承接的关系。
theological_decisions:
- issue: קוט所表达的上帝态度
  choice: 采用较强的“厌恶”
  alternative: “厌烦那一代人”或“因那一代人忧伤”
  rationale: 该动词的语义范围包括厌恶、厌烦和忧伤。正文保留语境中的强烈不悦，脚注同时呈现较柔和的可能译法，避免把词义限定得过窄。
- issue: לֹא יָדְעוּ דְרָכָי的时体与含义
  choice: “不认识我的道路”
  alternative: “没有认识我的道路”或“不明白我的道路”
  rationale: 希伯来文完成式在此构成对这一群体的概括性判定。现代汉语用“不认识”自然表达其一贯、定型的失败，同时保留ידע的关系性与认知性张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“百姓”对应集体名词עַם，并保持诗篇语体；“心里迷误”和“我的道路”保留原文的内在取向及道路隐喻。脚注标记[a]已置于正文相应位置。
