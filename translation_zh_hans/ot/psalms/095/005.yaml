base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/005.yaml
  text: The sea is his[a], for he made it[b], and his hands formed the dry land.
translation:
  language: zh_hans
  text: 海是他的[a]，因为他造了它[b]；他的双手塑造了干地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“海属于他。”希伯来文直译近似“那海是归他的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“而他造了它。”希伯来文连接词形式上是“而／和”，这里很可能表示原因。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לוֹ
  choice: 属于他
  rationale: 这个关系结构加介词 ל 表达归属，直译近似“海是属他的”。现代汉语用“属于他”自然清楚，也保留所有权的含义。
- source_word: הַיָּם
  choice: 海
  rationale: יָם 的常用义是“海”；译作“海洋”会稍显扩展，故采用简洁的“海”。
- source_word: וְהוּא
  choice: 因为是他
  rationale: וְ 形式上是“而／和”，但此处承接“海属于他”，很可能说明其原因。正文按语义关系译为“因为”，脚注保留形式对应的另一种理解。
- source_word: עָשָׂהוּ
  choice: 造的
  rationale: עָשָׂה 表示制造、创造；宾语后缀回指“海”。汉语以“是他造的”自然表达，同时保留神是行动者。
- source_word: וְיַבֶּשֶׁת
  choice: 旱地
  rationale: יַבֶּשֶׁת 指与海相对的干地。“旱地”简洁而有经诗庄重感，且能清楚呈现海陆对比。
- source_word: יָדָיו
  choice: 他亲手
  rationale: 原文为复数“他的双手／他的手”。汉语“亲手”自然保留以手施作的拟人意象，并强调行动出于他自己；不抽象化为“能力”。
- source_word: יָצָרוּ
  choice: 塑成
  rationale: יָצַר 含有塑造、成形之意。“塑成”与前面的“造”有所区分，保留两个创造动词的词汇变化和诗歌平行。
theological_decisions:
- issue: 描述上帝行动的拟人语言
  choice: 译作“他亲手塑成”，保留“手”的诗意形象
  alternative: 译作“他塑成”或“他的能力塑成”
  rationale: 希伯来文明确说“他的手”塑成旱地。保留这一拟人表达忠于诗歌质地，也避免把具体意象解释性地改成抽象的“能力”。
- issue: עשה 与 יצר 两个创造动词的区别
  choice: 分别译作“造”和“塑成”
  alternative: 两处都译作“造”或都译作“塑造”
  rationale: 使用不同汉语动词可保存原文的词汇变化；“塑成”传达 יצר 的成形意味，但不据此推导原文未明说的神学差别。
- issue: וְהוּא 的逻辑关系
  choice: 正文采用原因关系“因为是他”
  alternative: 按形式译作“而它是他造的”或“并且是他造的”
  rationale: 上下文最自然地以创造说明海为何属于上帝，但连接词本身形式上只是 וְ，因此以脚注保留并列理解，避免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“海……旱地”呈现鲜明对举；分号维持两部分的平衡。“亲手塑成”兼顾自然汉语与原文拟人意象。所有脚注标记均已置于正文。
