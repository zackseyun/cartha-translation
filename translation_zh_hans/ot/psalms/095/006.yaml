  text: בֹּ֭אוּ נִשְׁתַּחֲוֶ֣ה וְ/נִכְרָ֑עָה נִ֝בְרְכָ֗ה לִֽ/פְנֵי יְהוָ֥ה עֹשֵֽׂ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/006.yaml
  text: Come[a], let us bow down in worship and kneel; let us bless[b] before Yahweh, our Maker.
translation:
  language: zh_hans
  text: 来吧，让我们俯伏敬拜，屈膝；让我们在雅威[a]——我们的创造者——面前跪下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה的音译；汉语传统常译作“耶和华”。
    reason: 说明神名的音译及常见传统译法。
lexical_decisions:
- source_word: בֹּאוּ
  choice: 来吧
  rationale: 复数祈使式在这里是对会众的邀请；“来吧”自然保留了呼召语气。
- source_word: נִשְׁתַּחֲוֶה
  choice: 让我们俯伏敬拜
  rationale: 该词既表示身体俯伏，也常表达对上帝的敬拜；译文兼顾动作与宗教含义。
- source_word: וְנִכְרָעָה
  choice: 屈身下拜
  rationale: 该动词表示屈身、跪下；此处用“屈身下拜”与下一分句的“跪”有所区分，同时保留连续的敬拜姿态。
- source_word: נִבְרְכָה
  choice: 让我们跪在
  rationale: 此形式是ברך的Qal cohortative，语境义为“跪下”，并非表示“祝福”的Piel形式；因此不依照英文咨询层的“let us bless”。
- source_word: לִפְנֵי
  choice: 面前
  rationale: 直接表达在某位面前、临在中的空间与敬拜关系，符合现代汉语习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代；脚注说明传统译名。
- source_word: עֹשֵׂנוּ
  choice: 造我们的主
  rationale: 分词加第一人称复数后缀意为“造我们的那一位”；译作“造我们的主”在汉语中自然庄重，并清楚指向雅威。
theological_decisions:
- issue: נִבְרְכָה究竟表示“祝福”还是“跪下”
  choice: 让我们跪在
  alternative: 让我们祝福／颂赞
  rationale: 马所拉文本的נִבְרְכָה是Qal cohortative，源自动词ברך在Qal中的“跪下”义；若是“让我们祝福”，通常应采用Piel形态נְבָרֵךְ。上下文连续描述俯伏、屈身和跪下，也支持此读法。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 正文保留专名性质，不以称号替换；“雅威”较直接反映学界通常重构的读音，同时脚注交代汉语传统译名。
translation_notes:
  register: 采用现代、庄重而适合会众诵读的语体。三个近义动词分别译为“俯伏敬拜”“屈身下拜”“跪在……面前”，尽量保留希伯来诗句中连续而略有重叠的身体动作。破折号标明“造我们的主”是对“雅威”的同位说明。
