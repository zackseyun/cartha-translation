  text: in whose hand are the depths of the earth[b][a], and the heights of the mountains are his.
translation:
  language: zh_hans
  text: 大地的深处在他手中[a]；群山的高处也属于他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地的深处”或译“地的隐秘之处”。
    reason: lexical_alternative
  - marker: b
    text: “群山的高处”或译“山的高峰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: 在他手中
  rationale: 承接上一节所指的耶和华；保留希伯来语“在手中”的具体意象，同时表达掌管和所有权。
- source_word: מֶחְקְרֵי אָרֶץ
  choice: 地的深处
  rationale: מֶחְקְרֵי 可指难以探测、隐秘而深邃之处；与下句山的高处形成鲜明的上下对照。此处语境涵盖受造界，故 אָרֶץ 译作“地”而非局部的“土地”。
- source_word: וְתוֹעֲפוֹת הָרִים
  choice: 山的高峰
  rationale: תוֹעֲפוֹת 在此指山的高耸之处；“高峰”自然明确，并保存与“深处”的诗性对照。
- source_word: לוֹ
  choice: 属于他
  rationale: 直接表达希伯来语简短的所属谓语；现代汉语中比“是他的”更自然，也清楚呈现神对山峰的所有权。
theological_decisions:
- issue: 受造界所有权的范围
  choice: 将深处与高峰理解为概括全地的两极意象，宣告耶和华对整个受造界的主权和所有权。
  alternative: 将 אָרֶץ 理解为特定地区或以色列地，描写局部地貌。
  rationale: 上下文是普世性的敬拜呼召，而“地的深处”与“山的高峰”构成两极并举，因此以宇宙性范围理解更符合诗歌语境。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；保留“在他手中”的圣经诗歌意象，并用“深处—高峰”再现希伯来文的纵向对照。脚注仅标明 תוֹעֲפוֹת 的合理词义选择。
