source:
  edition: WLC
  text: אֲשֶׁר נִשְׁבַּ֥עְתִּי בְ/אַפִּ֑/י אִם יְ֝בֹא֗וּ/ן אֶל מְנוּחָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/011.yaml
  text: so I swore in my anger[b][a], ‘They shall not enter my rest.’
translation:
  language: zh_hans
  text: 因此，我在怒中起誓说：“他们绝不可进入我的安息[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“若他们进入我的安息”，这是誓言用语，意思是“他们绝不可进入我的安息”。“安息”也可译作“安歇之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 因此
  rationale: 此处承接上文，表达以色列悖逆所导致的结果；“因此”在现代汉语中自然清楚。
- source_word: נִשְׁבַּעְתִּי
  choice: 我……起誓说
  rationale: נשבע 的尼法勒词干通常表示“起誓”；加入“说”可自然引出后面的誓言内容。
- source_word: בְאַפִּי
  choice: 在怒中
  rationale: אַף 本义与“鼻”有关，在此是表示愤怒的惯用语；“在怒中”简洁庄重，也保留原文的表达方式。
- source_word: אִם
  choice: 绝不可
  rationale: אִם 在誓言之后构成省略式否定誓言，字面虽为“若”，实际语力是强烈否定；“绝不可”明确传达这一功能。
- source_word: יְבֹאוּן אֶל
  choice: 进入
  rationale: בוא 与 אֶל 连用表示进入某处；合译为“进入”符合现代汉语习惯。
- source_word: מְנוּחָתִי
  choice: 我的安息
  rationale: מְנוּחָה 可指安息的状态，也可指安歇之处；“我的安息”保持原文的简洁及其状态与处所之间的开放性。
theological_decisions:
- issue: אִם 构成的省略式誓言
  choice: 以强烈否定译为“他们绝不可进入”
  alternative: 较为直译作“若他们进入”，并由读者补足誓言中的否定含义
  rationale: 希伯来语在起誓语境中用 אִם 表示强烈否定。现代汉语若照字面译为“若”，会造成意思不完整，因此明确表达否定语力而不增添新的解释。
- issue: מְנוּחָה 的语义范围
  choice: 我的安息
  alternative: 我的安歇之处
  rationale: 原词既可侧重安息本身，也可指安息之所；“我的安息”避免将含义限定为空间地点，保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在怒中”保留诗歌的凝练感；“绝不可”传达誓言公式的强烈否定。“安息”兼顾状态与处所两种可能含义。
