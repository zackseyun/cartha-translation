  text: where your fathers tested me and tried me[b][a], though they had seen my work.
translation:
  language: zh_hans
  text: 在那里，你们的先祖试探我，又考验我[b]，尽管他们已经看见我的作为。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那里，你们的先祖试探我；他们考验我，也看见了我的作为。”原文也可较为直译成并列关系；正文则表达语境中较可能的让步含义。
    reason: lexical_alternative
  - marker: b
