lexical_decisions:
- source_word: אֲשֶׁר
  choice: 在那里
  rationale: 关系词在上下文中回指上一节所说的地方；译为“在那里”既保留地点含义，也使中文衔接自然。
- source_word: נִסּוּנִי
  choice: 试探我
  rationale: נסה在此指人把上帝置于试验之下；“试探”能表达这种带有挑战意味的行为。
- source_word: אֲבוֹתֵיכֶם
  choice: 你们的先祖
  rationale: 原文直译为“你们的父辈”；现代汉语以“先祖”自然地指受话群体在旷野时期的祖辈，并保留圣约历史的语气。
- source_word: בְּחָנוּנִי
  choice: 又考验我
  rationale: בחן与נסה语义相近，含检验、验证之意；“考验”与“试探”形成紧密平行，同时避免完全重复。
- source_word: גַּם
  choice: 尽管
  rationale: גם通常可译为“也”或“甚至”，但此处结合语境可表达让步关系：先祖虽见过上帝的作为，仍试探他。脚注保留更为字面的并列读法。
- source_word: רָאוּ
  choice: 已经看见
  rationale: 完成式表示他们见过上帝的作为；“已经”在中文中清楚呈现这经历先于、并加重其后试探行为的语境关系。
- source_word: פָעֳלִי
  choice: 我的作为
  rationale: פעל指工作、行动或所行之事；“作为”贴近原文单数集合意义，也符合诗篇中描述上帝大能行动的庄重语体。
theological_decisions:
- issue: 末句的让步含义
  choice: 尽管他们已经看见我的作为
  alternative: 他们也看见了我的作为
  rationale: 原文גם可按字面理解为“也”，但上下文很可能强调他们虽亲历上帝的作为仍试探他。正文采用自然的让步表达，脚注保留并列解释，以免消除原文可能的歧义。
- issue: אֲבוֹתֵיכֶם的称谓
  choice: 你们的先祖
  alternative: 你们的父辈
  rationale: 原词为阳性复数，但现代汉语“先祖”最自然地表达群体历史中的祖辈，且不额外引入特定宗派含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“试探……考验……”保留两个希伯来语动词的平行结构；“在那里”承接上一节地点。正文不刻意复制希伯来语代词结构，但保留直接对听众说“你们”的责备语气。
