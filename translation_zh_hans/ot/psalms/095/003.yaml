  text: כִּ֤י אֵ֣ל גָּד֣וֹל יְהוָ֑ה וּ/מֶ֥לֶךְ גָּ֝ד֗וֹל עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/003.yaml
  text: For Yahweh is a great God[a], and a great King above all gods.
translation:
  language: zh_hans
  text: 因为雅威是伟大的上帝，是高过所有众神[a]的伟大君王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切神圣存在”或“一切属天者”。希伯来语 אֱלֹהִים 依语境可指众神、神圣存在或属天者。
    reason: 词义存在真实的语境歧义；正文采用“众神”，脚注保留其他合理理解。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节敬拜的呼召并说明理由，保留希伯来语的因果关系。
- source_word: אֵל גָּדוֹל
  choice: 伟大的上帝
  rationale: אֵל在此指雅威为神；“伟大的”保留גָּדוֹל所表达的尊崇与崇高，也与下半句形成重复和平行。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: וּמֶלֶךְ גָּדוֹל
  choice: 是……伟大君王
  rationale: 将连接词所引出的第二个谓语自然译入汉语，并保留“伟大”在两个分句中的重复。
- source_word: עַל
  choice: 高过
  rationale: 在比较和尊崇的语境中表达位居其上、超越其余众神的意思，同时避免把关系过度具体化为治理。
- source_word: כָּל אֱלֹהִים
  choice: 众神
  rationale: 保留复数אֱלֹהִים的直接表达及其神学张力，不在正文中断定所指是假神、偶像还是属天存在。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通行学术重构的读音，并明确保留专名，不以“主”替换。
- issue: “众神”（אֱלֹהִים）的所指
  choice: 众神
  alternative: 一切神圣存在／一切属天者
  rationale: 正文保留原文可能带有的比较与论战意味，同时不替读者判定这些对象究竟是假神、偶像，还是属灵存在；脚注说明词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”清楚连接上文；两次使用“伟大”以保存原文平行结构。“高过众神”简洁自然，并保留原文的至高性表达与指称上的开放性。
