  text: לְ֭כוּ נְרַנְּנָ֣ה לַ/יהוָ֑ה נָ֝רִ֗יעָה לְ/צ֣וּר יִשְׁעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/001.yaml
  text: Come[a], let us sing for joy to Yahweh; let us shout aloud to the Rock of our salvation.
translation:
  language: zh_hans
  text: 来吧！让我们向雅威[a]欢呼歌唱；让我们向我们救恩的磐石高声欢呼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“雅威”（יהוה）；这个神圣的名字传统上常译作“耶和华”或“上主”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: לְכוּ
  choice: 来吧
  rationale: 这是הלך的复数命令式，在此作邀约、号召用；“来吧”自然传达共同敬拜的劝勉语气，而非表示空间方向的“去”。
- source_word: נְרַנְּנָה
  choice: 让我们……欢呼歌唱
  rationale: 该复数鼓励式表达喜乐而响亮的赞美；“欢呼歌唱”兼顾歌唱与欢欣的含义。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词לְ标明赞美的对象；神名יהוה音译为“雅威”，以保留经文直接使用的盟约之名。
- source_word: נָרִיעָה
  choice: 让我们……高声欢呼
  rationale: 该复数鼓励式指发出响亮的呼声，常用于凯旋或敬拜；“高声欢呼”保留公开、响亮的表达，并符合现代汉语。
- source_word: לְצוּר
  choice: 向……磐石
  rationale: צוּר本义为坚固的岩石，此处是指向上帝的隐喻，表达稳固、保护与力量；保留“磐石”这一诗歌意象。
- source_word: יִשְׁעֵנוּ
  choice: 我们救恩的
  rationale: 名词יֵשַׁע带第一人称复数后缀，并与“磐石”构成属格关系；“我们救恩的磐石”保留名词形式及其涵盖拯救、解救的宽广含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。“雅威”是较贴近其可能古代读音的现代音译，既保留专名性质，也不以称号替代；脚注说明传统译法。
- issue: “救恩的磐石”的关系
  choice: 我们救恩的磐石
  alternative: 拯救我们的磐石
  rationale: 原文使用名词“救恩”，不是分词或动词从句；保留属格结构，避免把该表达收窄为单一动作，同时保存其神学与诗歌张力。
translation_notes:
  register: 采用现代、庄重而适合会众诵读的诗歌语言。“来吧”形成直接号召；两个“让我们”对应原文两个复数鼓励式，并以“欢呼歌唱／高声欢呼”保留平行结构及递进的声音力度。
