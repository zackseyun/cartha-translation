source:
  edition: WLC
  text: נְקַדְּמָ֣ה פָנָ֣י/ו בְּ/תוֹדָ֑ה בִּ֝/זְמִר֗וֹת נָרִ֥יעַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/002.yaml
  text: Let us come before his face with thanksgiving[a]; let us shout joyfully to him with songs.
translation:
  language: zh_hans
  text: 让我们怀着感恩来到他面前[a]；让我们用诗歌向他欢呼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“来到他的脸前”；“脸”在希伯来语中常表示一个人的亲自临在。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקַדְּמָה
  choice: 让我们……来到……面前
  rationale: קדם 的使役式第一人称复数意愿式在此发出共同劝勉，表示来到某人面前或迎见某人；结合 פָנָיו，译为“来到他面前”自然准确。
- source_word: פָנָיו
  choice: 他面前
  rationale: 字面为“他的脸”，但希伯来语常以“脸”表示亲自临在。中文“来到他的脸前”生硬，因此正文采用自然的惯用表达“来到他面前”，脚注说明原文意象。
- source_word: בְּתוֹדָה
  choice: 怀着感恩
  rationale: תּוֹדָה 可指感谢、赞美或感恩祭；本节与诗歌欢呼平行，较可能表示感谢赞美的态度。“怀着感恩”清楚表达伴随方式，而不把它限定为祭物。
- source_word: בִּזְמִרוֹת
  choice: 用诗歌
  rationale: זְמִרוֹת 指可歌唱的乐歌，常用于赞美；“诗歌”在现代中文圣经语境中兼顾音乐性和庄重感，又不狭义限定为《诗篇》中的篇章。
- source_word: נָרִיעַ
  choice: 让我们……欢呼
  rationale: רוע/ריע 的使役式第一人称复数意愿式表示发出喜乐、庆贺的呼喊；“欢呼”同时传达声音和喜悦色彩。
- source_word: לוֹ
  choice: 向他
  rationale: 介词 ל 加第三人称阳性单数后缀，指欢呼所朝向的对象；译为“向他”直接自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个“让我们”保留原文连续的共同劝勉；正文用“他面前”表达希伯来语惯用义，并由脚注保留“脸”的具体意象。
