  terminology: “感恩”“诗歌”“欢呼”在中文圣经语境和现代一般用语中都恰当，且没有把 תּוֹדָה 武断译成“感恩祭”，也没有把 זְמִרוֹת 过度限定为《诗篇》。代词“他”及介词结构“向他”忠实、自然。
