  text: וְ/כָל קַרְנֵ֣י רְשָׁעִ֣ים אֲגַדֵּ֑עַ תְּ֝רוֹמַ֗מְנָה קַֽרְנ֥וֹת צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/010.yaml
  text: And I will cut off all the horns of the wicked[a], but the horns of the righteous will be lifted up.
translation:
  language: zh_hans
  text: 我必砍断恶人的一切角[a]；义人的角却必被高举。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角”在这里比喻力量、权势或尊荣。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: 一切
  rationale: כָל译为“一切”；句首וְ承接上文，但在汉语诗句中不必机械译出，并以分号及“却”自然呈现两句的连接和对照。
- source_word: קַרְנֵי / קַרְנוֹת
  choice: 角
  rationale: 保留קֶרֶן的具体意象；这里“角”比喻力量、权势或尊荣，不在正文中将其简化为单一抽象含义。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数实体化形容词，集体指作恶的人；“恶人”简洁、庄重，并与下句“义人”形成对应。
- source_word: אֲגַדֵּעַ
  choice: 我要砍掉
  rationale: גדע意为砍断、砍掉；“砍掉”与“角”的意象搭配自然，也表达彻底除去其力量。
- source_word: תְּרוֹמַמְנָה
  choice: 要高高扬起
  rationale: 该形式表达升高或被高举；“高高扬起”既保留角被举起的诗歌画面，也传达尊荣和势力上升的含义，同时不强行明确施事者。
- source_word: צַדִּיק
  choice: 义人
  rationale: 原文虽为单数，却在与复数“恶人”的诗歌对仗中泛指义人这一类；汉语“义人”可自然承担这种集合性和代表性用法。
theological_decisions:
- issue: “角”作为力量、权势和尊荣的隐喻
  choice: 正文保留“角”，并用脚注说明其隐喻意义。
  alternative: 将两处“角”直接译为“力量”“权势”或“尊荣”。
  rationale: 保留圣经中确立的“角”之意象，可维持诗歌的具体画面和神学张力，避免把兼具力量、地位与尊荣的隐喻限缩为一个抽象概念。
- issue: 义人的角被高举时施事者是否明确
  choice: 译为“要高高扬起”，不补出“上帝使之”。
  alternative: 译为“必被高举”或“上帝必高举义人的角”。
  rationale: 原文动词表达升高或被高举，但本节没有明说施事者；不补出主语可保留原文的语法开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“砍掉”保持动作的力度；“高高扬起”使“角”的具体意象在现代汉语中更自然，并与前句形成鲜明对照。
