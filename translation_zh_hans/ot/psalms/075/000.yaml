  text: 'For the choirmaster: “Do Not Destroy.”[a] A psalm of Asaph[b]. A song.'
translation:
  language: zh_hans
  text: 交给乐长：“不要毁坏”。[a]亚萨的诗[b]，一首歌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不要毁坏”也可能是曲调名或音乐指示。
    reason: cultural_note
  - marker: b
    text: “亚萨的”可以表示亚萨所作、与亚萨有关，或属于亚萨诗集。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题注中通常指负责统筹音乐演奏的人。“乐长”简洁自然，保留其礼仪和音乐职能；介词 לַ־ 译作“交给”。
- source_word: אַל תַּשְׁחֵת
  choice: 按《不要毁坏》
  rationale: 字面意思是“不要毁坏”，在此很可能是曲调名或演唱指示。用书名号标示其题名性质，“按”则自然连接音乐指示，同时以脚注保留具体功能的不确定性。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇题注中的常用体裁名称。译作“诗”简明庄重，并与后面的“歌”分别表达。
- source_word: לְאָסָף
  choice: 亚萨的
  rationale: 前缀 לְ־ 在诗篇题注中可表示作者、归属、关联或所属诗集。“亚萨的”保持中文简洁，并以脚注说明其范围，不把它限定为作者署名。
- source_word: שִׁיר
  choice: 一首歌
  rationale: 这是第二个体裁名称。单独译作“一首歌”，保留原文“诗……歌”的双重称谓，而不将二者合并。
theological_decisions:
- issue: “亚萨的”是否明确表示亚萨亲自创作
  choice: 正文采用“亚萨的”，脚注保留作者、关联及诗集归属等可能
  alternative: 亚萨所作的诗
  rationale: 原文的 לְ־ 并不必然只表示作者身份；避免在题注所容许的多种关系中作出过度确定的判断。
translation_notes:
  register: 采用现代、简洁而庄重的诗篇题注体。“乐长”比“合唱团指挥”涵盖面更广，也不过度限定具体演奏形式；书名号帮助普通读者识别“不要毁坏”在此不是诗篇正文中的命令。
