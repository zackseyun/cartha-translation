  text: ה֘וֹדִ֤ינוּ לְּ/ךָ֨ אֱֽלֹהִ֗ים ה֭וֹדִינוּ וְ/קָר֣וֹב שְׁמֶ֑/ךָ סִ֝פְּר֗וּ נִפְלְאוֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/001.yaml
  text: We give thanks to you[a], O God; we give thanks, for your name is near[c][b]; your wondrous deeds are recounted.
translation:
  language: zh_hans
  text: 上帝啊，我们感谢你，我们感谢你；你的名临近[a]；人们述说你奇妙的作为[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的名临近”也可能使人联想到上帝的临在、所启示的品格或声名；这里保留原文的表达，不限定为其中一种意思。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他们述说”，但没有明说“他们”是谁；也可译为“你奇妙的作为被人述说”。
    reason: source_ambiguity
lexical_decisions:
- source_word: הוֹדִינוּ
  choice: 我们感谢你
  rationale: 此处是 ידה 的使役词干完成式第一人称复数，在诗歌中表示向上帝献上感谢或赞美；译作“感谢”自然准确，并保留原文的重复。
- source_word: לְּךָ אֱלֹהִים
  choice: 上帝啊……你
  rationale: 将 אֱלֹהִים 按直接呼语译为“上帝啊”，并以“你”明确保留 לְךָ 所指的对象。
- source_word: וְקָרוֹב שְׁמֶךָ
  choice: 你的名临近
  rationale: 保留“名”与“临近”这一希伯来语表达，不将其限定为“同在”或“声名”；省略生硬的系词，使中文简洁自然。连接词 וְ 在中文分句并列中可由标点承载。
- source_word: סִפְּרוּ
  choice: 人们述说
  rationale: 该动词是第三人称复数，原文没有明说主语；“人们”自然表达不定复数主语，“述说”则保留讲述、传扬之意。
- source_word: נִפְלְאוֹתֶיךָ
  choice: 你奇妙的作为
  rationale: 该词通常指上帝令人惊叹的行动；“奇妙的作为”比抽象的“奇事”更清楚地传达具体行动。
theological_decisions:
- issue: “你的名临近”的含义
  choice: 保留“名临近”的原文意象
  alternative: 你的同在临近；你的声名近在眼前
  rationale: “名”可以承载上帝所启示的品格、名声或临在等多重含义。原文未限定其中一种，因此译文不以解释性措辞消除其神学张力。
- issue: סִפְּרוּ 的未明主语
  choice: 译为不定主语“人们述说”
  alternative: 译为被动句“你奇妙的作为被人述说”或不明所指的“他们述说”
  rationale: 希伯来文使用无明确主语的第三人称复数。中文以“人们”表达不定主语，既不指定某一群体，也避免被动句改变原句的叙述视角。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。重复“我们感谢你”以保留诗歌强调；在“你的名临近”后用逗号衔接末句，并以分号标示马所拉重音所反映的主要诗句分界。
