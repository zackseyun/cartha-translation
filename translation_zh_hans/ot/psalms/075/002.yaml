  text: כִּ֭י אֶקַּ֣ח מוֹעֵ֑ד אֲ֝נִ֗י מֵישָׁרִ֥ים אֶשְׁפֹּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/002.yaml
  text: For when I choose the appointed time[b][a], I myself will judge with uprightness.
translation:
  language: zh_hans
  text: 到了我所定的时刻[a]，我必亲自秉公[b]审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所定的时刻”所依据的希伯来文动词直译为“取”；这句话也可译作“当我选定时机时”。
    reason: lexical_alternative
  - marker: b
    text: “秉公”也可译作“按正直”或“以公平”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接上文，说明前述宣告的根据；译作“因为”保留其解释性连接作用。时间关系则由后面的“到了……时刻”表达。
- source_word: אֶקַּח
  choice: 选定
  rationale: לקח本义为“拿、取”，但与“指定的时刻”连用时，表示取定或选择某一时刻。“选定”在现代汉语中自然，也避免生硬直译。
- source_word: מוֹעֵד
  choice: 时刻
  rationale: מוֹעֵד在这里指指定、确定的时间；结合“选定”译为“时刻”，既简洁自然，也保留特定时机的含义。
- source_word: אֲנִי
  choice: 我必亲自
  rationale: 独立人称代词在已有第一人称动词之外带有强调作用；“亲自”传达这一强调。“必”同时配合语境表达未完成式所指向的将来行动。
- source_word: מֵישָׁרִים
  choice: 秉公
  rationale: 该复数名词表达正直、公正、公平的司法准则。“秉公”符合现代汉语的审判语境，又保留道德与司法含义。
- source_word: אֶשְׁפֹּט
  choice: 审判
  rationale: שׁפט在此表示司法性的判断或施行审判；“审判”准确保留其庄严语气。
theological_decisions:
- issue: 说话者及其审判宣告
  choice: 保留第一人称说话者的直接宣告，不在正文中增添“神”这一称谓
  alternative: 明确译成“神说：……”，或把说话者泛化为未指明的人物
  rationale: 诗篇语境通常将此话理解为神的宣告，但本节希伯来文本本身只以第一人称表达。译文保留“我”的强调和主权审判语气，不把语境判断额外写入正文。
- issue: 审判准则 מֵישָׁרִים 的表达
  choice: 译为“秉公”，强调公正地施行审判
  alternative: 译为“按正直”或“以公平”
  rationale: 原词兼有正直、公平与端正之意。“秉公”贴合司法语境，但脚注保留较形式对应的译法，以免把词义范围压缩为单一术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“到了……时刻”自然表达时间条件，“亲自”保留希伯来文独立代词的强调；正文避免生硬的“拿取时间”，并以脚注交代其字面形式。
