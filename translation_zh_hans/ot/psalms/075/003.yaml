  yaml_path: translation/ot/psalms/075/003.yaml
  text: The earth and all who dwell in it melt away[a]; I myself have set its pillars firm[c][b]. Selah
translation:
  language: zh_hans
  text: 大地和住在其上的众人都消融[a]；我亲自使它的柱子稳固[b]。细拉[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“摇摇欲坠”、“瓦解”或“震动”。希伯来语的意象是融化、失稳或崩溃。
    reason: lexical_alternative
  - marker: b
    text: 或译“立定了它的柱子”。
    reason: lexical_alternative
  - marker: c
    text: “细拉”是希伯来语 סֶלָה 的传统音译；其确切含义不明。
    reason: cultural_note
lexical_decisions:
- source_word: נְמֹגִים
  choice: 都在消融
  rationale: 该词源自 מוג，可表达融化、消解或崩溃。译作“消融”保留诗歌中鲜明的失稳意象；“都”使复数分词与“大地和……居民”这一复合主语自然衔接。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 结合“其中所有的居民”和“大地的柱子”这一宇宙性图景，“大地”比局部性的“土地”更合适。
- source_word: יֹשְׁבֶיהָ
  choice: 其中所有的居民
  rationale: ישב 的分词在此指居住者；此译法自然、清楚，并保留“所有”的范围。
- source_word: אָנֹכִי
  choice: 我亲自
  rationale: 独立人称代词带有强调作用；“我亲自”传达这一强调，却不额外引申为排他性的“惟有我”。
- source_word: תִכַּנְתִּי
  choice: 使……稳固
  rationale: כון 的 Piel 形态可指建立、固定或使之坚稳；与“柱子”搭配时，“使……稳固”准确表达稳定作用。
- source_word: עַמּוּדֶיהָ
  choice: 它的柱子
  rationale: 该名词通常指柱子或立柱；直译保留原文的诗性宇宙图景。
- source_word: סֶּלָה
  choice: 细拉
  rationale: 该词确切含义不明，因此沿用中文圣经传统中的音译，不在正文中加入推测性的解释。
theological_decisions:
- issue: 大地之柱的宇宙性意象
  choice: 按原文保留“它的柱子”
  alternative: 它的根基；它的支撑
  rationale: 此处以古代诗歌意象表达上帝使动荡世界稳定的作为。保留原有图像，既不将其科学化，也不在正文中将其抽象改写。
- issue: 说话者“我”的强调程度
  choice: 译作“我亲自”
  alternative: 我；惟有我
  rationale: אָנֹכִי 明确带有强调，但本身不必然表达绝对排他性；“我亲自”既传达强调，也避免加入原文未明说的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“消融”保留原文诗性隐喻，“我亲自”体现代词强调；分号呈现前后失稳与稳固的鲜明对照。所有脚注标记均置于相应词句之后。
