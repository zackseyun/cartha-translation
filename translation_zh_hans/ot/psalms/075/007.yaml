  text: כִּֽי אֱלֹהִ֥ים שֹׁפֵ֑ט זֶ֥ה יַ֝שְׁפִּ֗יל וְ/זֶ֣ה יָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/007.yaml
  text: 'For God is the judge: he brings one down[b][a], and lifts up another.'
translation:
  language: zh_hans
  text: 因为上帝是审判者[a]：他使一个人降卑，又使另一个人升高。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝施行审判。”希伯来语分词既可理解为动词，也可理解为近似谓语名词的表达。
    reason: alternative_reading
  - marker: b
    text: 直译：“他使这人降卑，又使这人升高。”这是分配式表达，意思是“使一个人……使另一个人……”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接上文，说明其根据；“因为”自然表达解释或因由关系。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 单数谓语和上下文表明这里指独一的上帝；“上帝”是现代汉语中庄重、通行的译法。
- source_word: שֹׁפֵט
  choice: 是审判者
  rationale: 该分词可作谓语性的名词表达，强调上帝审判者的身份；同时以脚注保留“施行审判”的动词性理解。
- source_word: זֶה … וְזֶה
  choice: 一个人……另一个人
  rationale: 两个指示词在此构成分配式对举。汉语用“一个人……另一个人”自然表达这种对照，脚注保留其较直译的形式。
- source_word: יַשְׁפִּיל
  choice: 使……降卑
  rationale: שׁפל 的使役形表示使之降低或卑微；“使……降卑”保留使役意义及与“升高”的垂直意象。
- source_word: יָרִים
  choice: 使……升高
  rationale: רום 的使役形表示使之升高或高举；“使……升高”与“使……降卑”形成清晰平行。
theological_decisions:
- issue: אֱלֹהִים שֹׁפֵט 中上帝的审判角色
  choice: 上帝是审判者
  alternative: 上帝施行审判
  rationale: 希伯来语分词兼有名词性和动词性可能。正文采用“是审判者”，突出上帝的身份与权柄，但以脚注明示另一种合乎原文的理解，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“降卑／升高”保留原文成对的垂直意象和使役结构；正文流畅表达分配关系，脚注则交代希伯来语的字面形式与句法歧义。
