  text: אָמַ֣רְתִּי לַֽ֭/הוֹלְלִים אַל תָּהֹ֑לּוּ וְ֝/לָ/רְשָׁעִ֗ים אַל תָּרִ֥ימוּ קָֽרֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/004.yaml
  text: I said to the boastful[a], “Do not boast,” and to the wicked, “Do not lift up your horn.”
translation:
  language: zh_hans
  text: 我对夸口的人说：“不要夸口！”又对恶人说：“不要高举你们的角[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角”在希伯来文中常作力量、地位或骄傲地自我抬高的比喻。本句也可意译为“不要抬高自己的力量”或“不要骄傲自大”。
    reason: 说明原文“角”的比喻，并列出不作为正文的可能意译。
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: 我……说
  rationale: 该词是אמר的Qal完成式第一人称单数。汉语“我……说”自然表达诗歌中的陈述，不必另加时态词。
- source_word: הוֹלְלִים
  choice: 夸口的人
  rationale: 此处指自我炫耀、夸耀的人；与下句同词根的תָּהֹלּוּ译作“夸口”，保留原文的重复和对应。
- source_word: אַל תָּהֹלּוּ
  choice: 不要夸口
  rationale: אַל加未完成式表达禁止；“不要夸口”简洁自然，并与“夸口的人”保持词语呼应。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是诗篇中רְשָׁעִים的常用对应，保留其道德含义而不将其限缩为法律上的罪犯。
- source_word: אַל תָּרִימוּ
  choice: 不要高举
  rationale: רום的Hiphil形式表示使之升高；“高举”既贴近动作意象，也能承载自我抬高的隐含意义。
- source_word: קָרֶן
  choice: 你们的角
  rationale: 原文直译为“角”，是力量、地位或傲慢自抬的诗歌意象。原文虽无显式物主成分，但汉语在此补出“你们的”，可明确命令对象并使表达自然；脚注说明其比喻义。
theological_decisions:
- issue: “角”的比喻含义
  choice: 正文保留“角”的意象，并用脚注解释
  alternative: 不要抬高自己的力量／不要骄傲自大
  rationale: 原文的“角”可同时涉及力量、地位和自我高抬。保留意象可避免把多重含义缩减为单一解释，也保存诗歌色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“夸口的人／不要夸口”保留原文词根呼应；引号内用感叹号体现直接禁令的力度。
