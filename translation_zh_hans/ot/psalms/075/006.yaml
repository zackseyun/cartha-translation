  text: כִּ֤י לֹ֣א מִ֭/מּוֹצָא וּ/מִֽ/מַּעֲרָ֑ב וְ֝/לֹ֗א מִ/מִּדְבַּ֥ר הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/006.yaml
  text: For not from the east or from the west[c][b][a], and not from the wilderness comes lifting up.
translation:
  language: zh_hans
  text: 因为高升[a]不是来自东方，也不是来自西方，也不是来自旷野。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高升”也可较意译地译作“升迁”或“被抬举”。希伯来文的表达简略而难解；下一节说上帝使一人降卑、使另一人升高，有助于说明这里的意思。
    reason: lexical_alternative
  - marker: b
    text: 末尾的希伯来词也有人理解为“群山”，整句末尾便可译成类似“也不是来自群山的旷野”。不过，结合下一节的“升高”，这里译作“高升”更符合上下文。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并引出解释；中文用“因为”自然呈现诗句的论证关系。
- source_word: מִמּוֹצָא
  choice: 来自东方
  rationale: 该词本指太阳出来、升起之处，在此以“东方”表达其方向意义，简洁自然。
- source_word: וּמִמַּעֲרָב
  choice: 也不是来自西方
  rationale: מַעֲרָב指日落之处，即西方；在否定并列结构中用“也不是”符合现代汉语表达。
- source_word: מִמִּדְבַּר
  choice: 更不是来自旷野
  rationale: מִדְבָּר可指旷野或沙漠；“旷野”既保留圣经语体，也涵盖较广。
- source_word: הָרִים
  choice: 高升
  rationale: 按马所拉元音将其理解为与רוּם（升高）有关的形式。上下文紧接着说上帝使人降卑、使人升高，因此“高升”既保留词根意象，也适合本节省略谓语的表达。
theological_decisions:
- issue: 难解末词הָרִים的解释
  choice: 理解为“高升”，即人的升高并非来自任何地上的方位或来源
  alternative: 将הָרִים理解为名词“群山”，译成类似“也不是来自群山的旷野”
  rationale: 马所拉元音和下一节“使这人降卑，使那人升高”的直接语境支持动词性理解；但原文句法简略且存在真实歧义，因此在脚注保留“群山”的另一种理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“东方—西方—旷野”保留原文的地理排比；“高升”避免把经文过度限定为官职上的“升迁”，并与下一节“升高”的意象相连。
