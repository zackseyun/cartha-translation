  text: וַ֭/אֲנִי אַגִּ֣יד לְ/עֹלָ֑ם אֲ֝זַמְּרָ֗ה לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/009.yaml
  text: But as for me[a], I will declare forever; I will sing praise to the God of Jacob.
translation:
  language: zh_hans
  text: 至于我，我要永远宣扬[a]；我要歌颂雅各的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句开头也可译作：“而我，我要永远宣扬。”希伯来语连词既可表示一般承接，也可在这里表达对比。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 独立代词强化主语，并在语境中形成对比。“至于我”自然保留强调与对照；希伯来语连词本身也可直译为“而我”。
- source_word: אַגִּיד
  choice: 我要宣扬
  rationale: נגד 的使役式表示宣告、使人知道。此处宾语未明说，“宣扬”既保留公开表达之意，也能自然承接诗歌中的赞美语境。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 表示持续不止的久远时段；“永远”符合诗人持续宣告的誓愿语气。
- source_word: אֲזַמְּרָה
  choice: 我要歌颂
  rationale: זמר 的加强式指以歌唱或音乐发出赞美；“歌颂”兼顾歌唱与赞美两层含义。
- source_word: לֵאלֹהֵי
  choice: ……上帝
  rationale: 介词 ל 标示歌颂所指向的对象；汉语“歌颂上帝”无需另译介词，表达自然且意义准确。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经人名的通行译法，并保留“雅各的上帝”这一称谓。
theological_decisions:
- issue: 说话者与上下文中恶人的对照
  choice: 用“至于我”表达强调性的对照
  alternative: 译作“而我”或“我却”
  rationale: 独立代词与连词在本节语境中强调诗人的立场，与恶人的结局形成对照；不过连词的对比强度并非唯一确定，因此以脚注保留另一种译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“宣扬”保留原文未说明宾语的开放性；分号呈现两个平行的第一人称宣告。
