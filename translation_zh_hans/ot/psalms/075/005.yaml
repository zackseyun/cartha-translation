  text: אַל תָּרִ֣ימוּ לַ/מָּר֣וֹם קַרְנְ/כֶ֑ם תְּדַבְּר֖וּ בְ/צַוָּ֣אר עָתָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/005.yaml
  text: Do not lift up your horn on high[b][a]; do not speak with an arrogant neck.
translation:
  language: zh_hans
  text: 不要把你们的角高高举起[a]，不要昂着傲慢的颈项说话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角”在希伯来诗歌中常比喻力量、权势或自高。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“以傲慢的颈项说话”，保留了以身体姿态表现骄傲抗拒的意象；也可译作“不要硬着颈项说狂妄的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: 不要
  rationale: 与未完成式连用构成禁令；现代汉语用“不要”自然、准确。
- source_word: תָּרִימוּ לַמָּרוֹם
  choice: 高高举起
  rationale: 保留“举起、升高”的空间意象；“高高”自然表达 לַמָּרוֹם 所强调的高处或向上。
- source_word: קַרְנְכֶם
  choice: 你们的角
  rationale: 原文直译为“角”，在诗歌中可象征力量、权势或自高；正文保留具体意象，脚注说明其含义。
- source_word: תְּדַבְּרוּ
  choice: 说话
  rationale: 准确对应常用动词“说”，并适合现代汉语诗篇的庄重语体。
- source_word: בְצַוָּאר עָתָק
  choice: 昂着傲慢的颈项
  rationale: 保留原文“颈项”的身体隐喻，并以“昂着”自然呈现其所表达的骄横姿态；עָתָק 可指傲慢或狂妄。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。正文保留“角”和“颈项”两个希伯来身体意象，同时用“高高举起”和“昂着”使其在现代汉语中自然连贯。
