id: PSA.75.8
reference: Psalms 75:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י כ֪וֹס בְּֽ/יַד יְהוָ֡ה וְ/יַ֤יִן חָמַ֨ר מָ֥לֵא מֶסֶךְ֮ וַ/יַּגֵּ֪ר מִ֫/זֶּ֥ה אַךְ שְׁ֭מָרֶי/הָ יִמְצ֣וּ יִשְׁתּ֑וּ כֹּ֝֗ל רִשְׁעֵי אָֽרֶץ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/008.yaml
  text: For a cup is in the hand of Yahweh[a], and the wine foams, full of mixed spices; he pours from it[c][b], and surely all the wicked of the earth will drain its dregs and drink.
translation:
  language: zh_hans
  text: 因为耶和华手中有一只杯，杯中盛满翻腾起沫、调和好的酒[a]；他从杯中倒出酒来。地上所有的恶人连杯底的渣滓也必吸尽喝下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “调和好的酒”也可译作“盛满调和之物”或“满了混合的酒”。这里指经过调配的酒，可能加入了香料或其他成分。
    reason: 保留מָלֵא מֶסֶךְ可指盛满调和之物或经过调配的酒这一表达幅度，并说明可能的古代调酒背景。
  - marker: b
    text: “渣滓”指沉在杯底的酒渣；这里的画面是恶人必须把杯中之物连渣滓都喝尽。
    reason: 帮助现代读者理解酒渣意象及恶人饮尽杯中之物的彻底性，而不把隐喻直接解释写入正文。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的宣告说明根据；“因为”在现代汉语中自然体现这一论证关系。
- source_word: כּוֹס בְּיַד יְהוָה
  choice: 耶和华手中有一只杯
  rationale: 保留杯在耶和华掌控之中的具体意象，并用自然汉语语序表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式呈现四字神名，同时保留其专名性质。
- source_word: יַיִן חָמַר
  choice: 酒翻腾起沫
  rationale: חָמַר在此描写酒起沫、翻腾的状态；译文保留其强烈而鲜明的动态画面。
- source_word: מָלֵא מֶסֶךְ
  choice: 调和得十足
  rationale: 表达酒经过充分调和、配制；不在正文中限定究竟掺入香料还是其他成分，以保留原词的语义幅度。
- source_word: וַיַּגֵּר מִזֶּה
  choice: 他从杯中倒出酒来
  rationale: מִזֶּה直指前述杯；汉语补出“杯中”和“酒”可使动作及其对象清楚，而不改变意象。
- source_word: אַךְ
  choice: 都必
  rationale: 将其强调和确定语气融入“都必”，自然表达审判不可避免且无一例外。
- source_word: שְׁמָרֶיהָ
  choice: 杯底的渣滓
  rationale: 指酒沉在杯底的酒渣；“渣滓”准确而易懂，并以“杯底”交代画面。
- source_word: יִמְצוּ יִשְׁתּוּ
  choice: 吸尽喝下
  rationale: 保留יִמְצוּ所含吸取、榨尽至一滴不剩的力度，并与“喝下”连用，呈现饮尽渣滓的彻底性。
- source_word: כֹּל רִשְׁעֵי אָרֶץ
  choice: 地上所有的恶人
  rationale: 直接对应原文，明确承担饮杯行动的是全地的恶人。
theological_decisions:
- issue: 杯的意象
  choice: 正文保留耶和华手中的酒杯，不直接增译为“愤怒之杯”或“审判之杯”
  alternative: 把杯明确译作“愤怒之杯”或“审判之杯”
  rationale: 上下文清楚指向神的审判，但本节以酒杯画面表达，并未明说“愤怒”；保留隐喻可避免把解释写入正文。
- issue: 神名的译法
  choice: 耶和华
  alternative: 上主；雅威
  rationale: “耶和华”是现代简体中文圣经语境中广为识别的神名形式，能保留原文专名而不将其普通称号化。
- issue: 恶人饮尽渣滓的施事关系
  choice: 让“地上所有的恶人”明确作“吸尽喝下”的主语
  alternative: 译成由耶和华使恶人喝下
  rationale: 原文动词为复数，语法上由“地上所有的恶人”承担；虽有神施行审判的语境，正文不额外补入使役结构。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句子依照希伯来诗句的推进分为酒杯、倒酒和恶人饮尽三个画面；保留“杯”“起沫”“渣滓”等具体意象，不把隐喻解释性地改写成抽象神学术语。
