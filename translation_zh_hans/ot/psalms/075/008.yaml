revisions:
- from: 因为耶和华手中有一只杯，杯里的酒翻腾起沫，调和得十足[a]；他从杯中倒出酒来。地上所有的恶人都必把杯底的渣滓吸尽喝下[b]。
  to: 因为耶和华手中有一只杯，杯中盛满翻腾起沫、调和好的酒[a]；他从杯中倒出酒来。地上所有的恶人连杯底的渣滓也必吸尽喝下[b]。
  rationale: 修订仅处理两处汉语表达和词组呈现：以“杯中盛满翻腾起沫、调和好的酒”自然对应酒、起沫、盛满和调和的连续意象；以“连……也必吸尽喝下”使末句合乎现代汉语，同时维持原文强调恶人彻底饮尽渣滓的力度。脚注标记均仍紧邻其所说明的词语。
