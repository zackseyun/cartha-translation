  text: יְֽהוָ֗ה יִ֭סְעָדֶ/נּוּ עַל עֶ֣רֶשׂ דְּוָ֑י כָּל מִ֝שְׁכָּב֗/וֹ הָפַ֥כְתָּ בְ/חָלְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/003.yaml
  text: Yahweh will sustain him on his sickbed[a]; in his illness you restore his whole bed.
translation:
  language: zh_hans
  text: 耶和华必在病榻上扶持他；你在他患病时翻整他的床铺。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你在他患病时，把他的整个床榻翻转过来。”希伯来文动词直译为“翻转、改变”；此处可能指照料病人时翻整床铺，也可能是指病人的状况转变或复原的形象说法。
    reason: 保留הָפַכְתָּ的字面义、כָּל的“整个”以及该短语的语义含混性。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中通行的神名音译“耶和华”，以保留专名性质，而非以“主”这一称号代替。
- source_word: יִסְעָדֶנּוּ
  choice: 必扶持他
  rationale: סעד表示在软弱中支撑、扶助；“扶持”自然贴合病中受助的语境，并保留动词的具体感。
- source_word: עַל עֶרֶשׂ דְּוָי
  choice: 在病榻上
  rationale: עֶרֶשׂ דְּוָי直指患病时所卧之床；“病榻”简洁、庄重，也符合现代中文表达。
- source_word: כָּל מִשְׁכָּבוֹ
  choice: 他的病床
  rationale: מִשְׁכָּב是躺卧之处，此处与前半句平行，可译为“病床”。כָּל的整体意味在“使……焕然一新”中得到自然体现，避免生硬的“整个病床”。
- source_word: הָפַכְתָּ
  choice: 使……焕然一新
  rationale: הפך本义为“翻转、改变”。在病床语境中可能指整理、更换或使病人的处境转好；正文以较自然的结果性表达传达照料与复原之意，同时用脚注保留直译可能。
- source_word: בְחָלְיוֹ
  choice: 他患病时
  rationale: ב加חֳלִי表示动作发生的处境；“他患病时”比“在他的疾病中”更符合现代汉语。
theological_decisions:
- issue: 本节中称述与直接呼告的转换
  choice: 保留从第三人称“耶和华……他”转为第二人称“你”的变化
  alternative: 统一为第三人称：“耶和华必……他必……”
  rationale: 希伯来文后半句明确使用第二人称动词，诗人从谈论耶和华转为直接向他祷告；保留这一转换可呈现原诗的祷告张力。
- issue: 后半句是否明确指医治病人
  choice: 译作“使他的病床焕然一新”，但不直接增译“医治他”
  alternative: 译作“使他康复”或“医治他”
  rationale: 原文以“床”和“翻转／改变”为意象，虽可能暗示复原，却没有直接使用“医治”一词；正文保留病床意象，以免消除原文含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“病榻”略带诗体色彩，与诗篇体裁相称；后半句保留第二人称突转。脚注标记置于正文相关句末。
