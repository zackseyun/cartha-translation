  text: וַ/אֲנִ֗י בְּ֭/תֻמִּ/י תָּמַ֣כְתָּ בִּ֑/י וַ/תַּצִּיבֵ֖/נִי לְ/פָנֶ֣י/ךָ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/012.yaml
  text: But as for me[a], in my integrity you have upheld me[b], and you have set me before your face forever.
translation:
  language: zh_hans
  text: 至于我，你因我的纯全[a]扶持我，使我永远站立在你面前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我的纯全中”；“纯全”也可译作“正直”或“无可指摘”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在你的脸面前”；意为“在你面前”或“在你的同在中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 独立代词带连接词，在上下文中形成转折和对照；“至于我”自然保留这一话语转向。
- source_word: בְּתֻמִּי
  choice: 因我的纯全
  rationale: תֻּם表示完整、正直或无可指摘；“纯全”保留其道德完整性的含义，又不暗示绝对无罪。介词בְּ在此可表达依据或处境，正文采用通顺的“因”，并以脚注保留“在……中”的可能。
- source_word: תָּמַכְתָּ בִּי
  choice: 你扶持我
  rationale: תמך与ב连用表示支撑、托住某人；“扶持”兼具支持和使之稳固的关系性含义。
- source_word: וַתַּצִּיבֵנִי
  choice: 使我……站立
  rationale: נצב的使役形表示使某人站立、安置或立定；“使我站立”保留动词的具体意象，少于“坚立我”的解释性。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 直译为“在你的面前/脸前”，惯用含义是处于你的临在中；中文“在你面前”既自然又保留希伯来语的空间意象。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: עוֹלָם在此表达持续不止的时长；“永远”符合诗歌语体和现代汉语习惯。
theological_decisions:
- issue: 诗人声称自己有תֻּם的含义
  choice: 理解为诗人的纯全、正直，即品格和行事上的完整性，而非绝对无罪。
  alternative: 理解为绝对无罪，或认为上帝的恩待由道德完美赚取。
  rationale: 原词可指完整、纯全或无可指摘。译作“纯全”保留诗人的真实道德宣称及经文中的神学张力，同时不额外引入无罪完美或功德交换的观念。
- issue: בְּתֻמִּי中介词בְּ的语义关系
  choice: 正文译作“因我的纯全”，表达依据或缘由。
  alternative: 译作“在我的纯全中”，表达诗人处于纯全的状态。
  rationale: 希伯来语介词容许两种理解，语境不能完全排除状态性读法，因此用脚注明确保留另一可能。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“纯全”略带诗篇所需的典雅色彩，但仍可由普通读者理解；“扶持”和“站立在你面前”保留原文具体、关系性的意象。
