  yaml_path: translation/ot/psalms/041/007.yaml
  text: Together all who hate me whisper against me[b][a]; against me they devise evil for me.
translation:
  language: zh_hans
  text: 凡恨我的人都一同低声议论我[a]；他们针对我，谋划要加在我身上的恶事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “议论我”也可译作“针对我低语”。本节两处相应的希伯来语介词可表示敌对的方向，也可表示言谈或思想所涉及的对象；上下文较支持敌对的意味。
    reason: lexical_alternative
  - marker: b
    text: “谋划要加在我身上的恶事”也可译作“图谋伤害我”或“谋划恶事害我”。希伯来语以“思想／筹划”一词与“恶事”连用，表达敌意的谋算。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: 一同
  rationale: 表达众仇敌共同采取行动，简洁保留原文的集体意味。
- source_word: עָלַי
  choice: 要对付我／针对我
  rationale: 介词既可表示谈论或思想的对象，也可带有敌对方向；本节上下文明确具有敌意，因此正文采用敌对含义，同时在脚注保留另一可能。
- source_word: יִתְלַחֲשׁוּ
  choice: 低声密议
  rationale: 该反身形态描写众人彼此低声交谈；“低声密议”既保留低语的画面，也自然表现其暗中商议的语境，而不明确断定为正式阴谋。
- source_word: כָּל שֹׂנְאָי
  choice: 所有恨我的人
  rationale: 保留分词“恨我的人”的动作意味，比泛化为“我的仇敌”更贴近原文。
- source_word: יַחְשְׁבוּ
  choice: 图谋
  rationale: 该词可指思想、筹划或设计；与“恶事”连用时，“图谋”自然体现有意的恶意筹划。
- source_word: רָעָה
  choice: 恶事
  rationale: 保留原词兼具邪恶与伤害的宽广含义，不将其缩窄为单纯的实际损害。
- source_word: לִי
  choice: 加害我
  rationale: 原文直译近于“为我／给我”，在敌对语境中指恶事以诗人为承受对象；“加害我”在现代汉语中自然呈现这一关系，并与前面的“针对我”有所区分。
