  text: בְּ/זֹ֣את יָ֭דַעְתִּי כִּֽי חָפַ֣צְתָּ בִּ֑/י כִּ֤י לֹֽא יָרִ֖יעַ אֹיְבִ֣/י עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/011.yaml
  text: 'By this I know that you delight in me: because my enemy does not triumph over me[a][b].'
translation:
  language: zh_hans
  text: 我由此知道你喜悦我[a]：因为我的仇敌没有在我之上欢呼夸胜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你以我为乐”“你悦纳我”。希伯来语动词表示喜爱、以……为乐。
    reason: lexical_alternative
  - marker: b
    text: 或译“我的仇敌没有向我发出胜利的呼喊”。原文动词更直接地指发出喊声，这里很可能是胜利的欢呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: 我由此
  rationale: בְּ与指示词זֹאת在这里表示据以得知的证据；“由此”自然地保留这一依据关系。
- source_word: יָדַעְתִּי
  choice: 知道
  rationale: 虽为完成式，但语境表达诗人根据眼前证据所得的现有认知，现代汉语用“知道”最为自然。
- source_word: חָפַצְתָּ בִּי
  choice: 你喜悦我
  rationale: חפץ表示以某人为乐、对某人感到喜悦；“喜悦我”贴近原文，又不额外引入称义或功德等含义。
- source_word: כִּי（第二处）
  choice: （以冒号表达原因）
  rationale: 第二个כִּי引出诗人判断的依据。汉语以冒号连接，简洁而清楚地表达后句对前句的说明和佐证。
- source_word: לֹא יָרִיעַ
  choice: 没有……欢呼
  rationale: רוע的使役式在此指发出欢呼，语境很可能是胜利的欢呼；用“欢呼”保留原文的声音意象，“没有”则表达当前作为证据的情形，避免把它强化为绝对的未来应许。
- source_word: אֹיְבִי
  choice: 我的仇敌
  rationale: 保留原文单数及第一人称所属关系。
- source_word: עָלַי
  choice: 因胜过我
  rationale: עַל在胜利欢呼的语境中表示以诗人的败落为庆贺对象；“因胜过我而欢呼”以自然汉语传达“在我之上夸胜”的含义。
theological_decisions:
- issue: 本节是否宣告诗人的义或得救地位
  choice: 只陈述诗人把仇敌未能胜过自己视为上帝喜悦他的证据。
  alternative: 可将本节强化理解为上帝对诗人之义的正式昭雪。
  rationale: 希伯来文确实把上帝的喜悦与仇敌不能夸胜联系起来，却没有说明上帝喜悦诗人的根据；译文保留这一逻辑，不补入更完整的功德、称义或救恩教义。
- issue: 仇敌的欢呼所指为何
  choice: 译为仇敌因胜过诗人而发出的欢呼。
  alternative: 较抽象地译为仇敌“胜过”或“向我夸胜”。
  rationale: 原动词直接描写发出喊声，语境则赋予它胜利欢呼的意味；正文兼顾声音意象和语境含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“我由此知道”保留诗句的证据关系；正文用“因胜过我而欢呼”自然呈现胜利欢呼的画面，同时不把未完成式误写成无条件的未来保证。
