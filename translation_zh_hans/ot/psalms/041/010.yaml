id: PSA.41.10
reference: Psalms 41:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָ֗ה חָנֵּ֥/נִי וַ/הֲקִימֵ֑/נִי וַֽ/אֲשַׁלְּמָ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/010.yaml
  text: But you[a], O Yahweh, be gracious to me and raise me up, that I may repay them.
translation:
  language: zh_hans
  text: 但你，耶和华啊，求你恩待我，使我起来，好让我报复他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我就要报复他们。”希伯来语的祈愿式既可表示前面祈求的目的或结果（“好让我报复他们”），也可表示紧接这些祈求而作出的决意。
    reason: 句法歧义
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 但你
  rationale: 连词加独立代词与上文的仇敌和密友形成鲜明对比；“但你”在现代汉语中自然保留这一转折。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文中通行的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: חָנֵּנִי
  choice: 求你恩待我
  rationale: חנן表示施恩、施惠；“恩待我”保留祈求恩惠的核心意义，不把含义缩窄为怜悯。
- source_word: וַהֲקִימֵנִי
  choice: 使我起来
  rationale: קום的使役式直指“使……起来/站起”；此译保留具体意象，同时可涵盖从疾病或受压境况中恢复。
- source_word: וַאֲשַׁלְּמָה
  choice: 好让我报复
  rationale: שלם的加强式在此表示回报、报偿；结合对象是敌对者，“报复”自然传达负面的偿还含义。“好让我”把祈愿式理解为前述祈求的目的或结果，同时以脚注保留另一种句法可能。
- source_word: לָהֶם
  choice: 他们
  rationale: 介词ל标示回报的对象；现代汉语直接说“报复他们”最自然。
theological_decisions:
- issue: 是否淡化诗人请求获准报复敌人的祈愿
  choice: 保留“报复他们”
  alternative: 译作“使我在他们面前得伸冤”或“照他们应得的对待他们”
  rationale: 原文שלם直接表达偿还或报偿。译文不把它柔化为单纯的伸冤，也不规定报复的具体方式，从而保留经文本身的审判性和祈愿张力。
- issue: 祈愿式וַאֲשַׁלְּמָה与前面两个祈求的关系
  choice: 按目的或结果译为“好让我报复他们”
  alternative: 按后续决意译为“我就要报复他们”
  rationale: 希伯来语祈愿式可表示前面祈求所导向的目的或结果，也可表达随后的决意；正文采用语境衔接较自然的前者，脚注明确保留后者。
translation_notes:
  register: 采用现代、庄重而清楚的祷告语体。“恩待”比“开恩”更易懂，又保留宗教语境；“使我起来”刻意保留原文的具体意象；“报复”虽语气尖锐，却忠实呈现原文未被淡化的报偿意味。
