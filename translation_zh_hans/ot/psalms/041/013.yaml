  text: בָּ֘ר֤וּךְ יְהוָ֨ה אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל מֵֽ֭/הָ/עוֹלָם וְ/עַ֥ד הָ/עוֹלָ֗ם אָ֘מֵ֥ן וְ/אָמֵֽן׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/013.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Amen and Amen.
translation:
  language: zh_hans
  text: 愿雅威——以色列的神——受称颂，从亘古直到永远[a]！阿们，阿们！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从永恒到永恒”。希伯来语这一表达指无边无际的久远时间。
    reason: 说明原文时间短语的另一种译法及其语义范围。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 愿……受称颂
  rationale: 这是颂赞文中的被动分词祝颂公式；译为“愿……受称颂”既保留其礼仪性语气，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 忠实表达该领属结构，并以自然的现代汉语呈现。
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: 从亘古直到永远
  rationale: 该颂赞公式表达无边无际的时间跨度；“亘古”与“永远”兼顾庄重文体和普通读者的可理解性。
- source_word: אָמֵן וְאָמֵן
  choice: 阿们，阿们
  rationale: 保留礼仪用语的音译及原文重复，以传达强调性的共同确认。
theological_decisions:
- issue: 如何翻译神名 יהוה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名；“雅威”较直接地按其通行学术发音音译，可保留这是专名而非称号。
- issue: מֵהָעוֹלָם וְעַד הָעוֹלָם 的时间含义
  choice: 从亘古直到永远
  alternative: 从永恒到永恒；从世世代代直到永远
  rationale: 原表达具有不受限制的久远时间含义；正文保留由不可追溯的过去延伸到无尽将来的张力，而不把它化约为某一套哲学性的永恒概念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿……受称颂”保留颂赞公式的礼仪色彩；破折号标明“以色列的神”是“雅威”的同位说明；重复“阿们”以保存原文的强调和卷末颂赞语气。
