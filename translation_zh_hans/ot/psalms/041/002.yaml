  text: יְהוָ֤ה יִשְׁמְרֵ֣/הוּ וִֽ֭/יחַיֵּ/הוּ יאשר בָּ/אָ֑רֶץ וְ/אַֽל תִּ֝תְּנֵ֗/הוּ בְּ/נֶ֣פֶשׁ אֹיְבָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/002.yaml
  text: Yahweh will keep him and preserve his life[a]; he will be blessed in the land[d][c][b], and may you not give him over to the desire of his enemies.
translation:
  language: zh_hans
  text: 耶和华必看顾他，保全他的生命[a]；他在这地上必被称为有福[b]。愿你不要把他交在他仇敌的意愿之下[c]。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他存活。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“他在这地上必蒙福。”希伯来语动词既可指“被称为有福”，也可较宽泛地指“蒙福”。
    reason: lexical_alternative
  - marker: c
    text: 直译：“交在他仇敌的心愿之下”；也可译作“交在他仇敌的欲望之下”。
    reason: lexical_alternative
  - marker: d
    text: 本句也可译作：“不要把他交在他仇敌的意愿之下。”
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: יִשְׁמְרֵהוּ
  choice: 必看顾他
  rationale: שׁמר在此指守护、看顾；“看顾”自然庄重，也避免与下一动词重复。
- source_word: וִיחַיֵּהוּ
  choice: 保全他的生命
  rationale: חיה的加强词干在此有使之存活、保住性命之意；“保全他的生命”准确表达持续存活。[a]
- source_word: יאשר
  choice: 必被称为有福
  rationale: 该形式可表达被人称为有福，也可能较宽泛地表示蒙福；正文保留宣称、认定为有福的语义。
- source_word: בָּאָרֶץ
  choice: 在这地上
  rationale: אֶרֶץ可指地、土地或国土；“在这地上”既自然，又不把所指过度限定为全世界或某一国家。
- source_word: וְאַל תִּתְּנֵהוּ
  choice: 愿你不要把他交给
  rationale: אַל加第二人称短式表达否定祈愿；“愿你不要”保留从第三人称陈述转为直接向耶和华祈求的变化。
- source_word: בְּנֶפֶשׁ אֹיְבָיו
  choice: 任凭他的仇敌称心
  rationale: נֶפֶשׁ在此习语中指愿望、欲望；中文以“任凭……称心”自然表达“交给仇敌的欲望/意愿”。
- source_word: אֹיְבָיו
  choice: 他的仇敌
  rationale: “仇敌”是诗体中清楚、庄重的对应词。
theological_decisions:
- issue: 前半节陈述与末句第二人称祈愿之间的人称转换
  choice: 前半节译作对耶和华的第三人称陈述，末句译作“愿你不要……”的直接祈求
  alternative: 把全节统一译成第三人称，如“他也不把他交给……”
  rationale: תִּתְּנֵהוּ是第二人称阳性单数；保留人称转换，忠实反映希伯来文本的语法和诗歌张力。
- issue: יאשר所表达的是被称为有福还是实际蒙福
  choice: 必被称为有福
  alternative: 必蒙福
  rationale: 正文采用较能体现宣称或认定含义的译法，同时用脚注保留较宽泛的理解，不将词义张力消除。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语言。“耶和华”保留神名；“看顾”“保全生命”“仇敌”符合经文语域。标点将末句另起为祈愿，以帮助读者察觉希伯来语由第三人称陈述转为第二人称呼求；脚注标记均置于正文相应位置。
