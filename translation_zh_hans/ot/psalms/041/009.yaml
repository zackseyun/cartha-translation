  text: גַּם אִ֤ישׁ שְׁלוֹמִ֨/י אֲשֶׁר בָּטַ֣חְתִּי ב֭/וֹ אוֹכֵ֣ל לַחְמִ֑/י הִגְדִּ֖יל עָלַ֣/י עָקֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/009.yaml
  text: Even my close friend[a], in whom I trusted, who ate my bread[d][c][b], has lifted up his heel against me.
translation:
  language: zh_hans
  text: 连我亲近的朋友[a]，就是我所信赖、吃我饼的人[b]，也向我高抬脚跟[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我和平的人”或“与我和睦的人”，指与我和睦相处的亲近朋友或可信赖的同伴。
    reason: lexical_alternative
  - marker: b
    text: 直译“吃我饼的人”。这使人想到同席相交和彼此信任；也可译作“与我同席吃饭的人”。
    reason: lexical_alternative
  - marker: c
    text: 直译“向我高抬脚跟”。这是表示敌对或背信行为的形象说法。
    reason: lexical_alternative
  - marker: d
    text: 本节在约翰福音13:18中被引用，与犹大背叛耶稣有关。
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: 连……也
  rationale: 表达强调性的递进：不只是一般的仇敌，连亲近而受信任的人也背叛了诗人。
- source_word: אִישׁ שְׁלוֹמִי
  choice: 我知心的朋友
  rationale: 原意近于“与我和平的人”，是指与诗人关系亲密、彼此和睦并受其信任的人；“知心的朋友”在现代汉语中自然传达这种关系。
- source_word: אֲשֶׁר בָּטַחְתִּי בוֹ
  choice: 我所信赖
  rationale: 保留בטח ב所表达的把信任寄托于某人的个人性意味。
- source_word: אוֹכֵל לַחְמִי
  choice: 吃我饭的人
  rationale: 保留“吃我的饼/食物”的具体席间意象；汉语“吃我饭”既自然，也能表现受款待与亲密相交，未直接抽象化为“与我一同吃饭”。
- source_word: הִגְדִּיל ... עָקֵב
  choice: 抬起脚跟
  rationale: 希伯来语字面近于“使脚跟高大”；译作“抬起脚跟”保留身体动作的意象，并由上下文显出敌对意味。
- source_word: עָלַי
  choice: 攻击我
  rationale: 该介词在这一敌对习语中有“向着我、与我为敌”的含义；“攻击我”使现代读者能明白脚跟动作所指的敌意。
theological_decisions:
- issue: 本节的背叛语言在约翰福音13:18中被引用，并与犹大背叛耶稣相联
  choice: 正文按诗篇本身的处境翻译，不在正文中明说弥赛亚或犹大
  alternative: 按照新约引用传统调整正文，使其更直接指向犹大背叛耶稣
  rationale: 希伯来文本首先述说诗人遭可信赖的亲近者背叛；保留其具体意象，并用脚注指出新约引用，既尊重原初语境，也让正典关联保持可见。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“连……也”形成自然的强调结构；“知心的朋友”传达亲密与信赖；正文保留“吃我饭”和“抬起脚跟”的具体意象，同时以“攻击我”交代其敌对方向。脚注标记均按正文出现顺序排列。
