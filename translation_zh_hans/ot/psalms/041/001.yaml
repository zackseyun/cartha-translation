reference: Psalms 41:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֭שְׁרֵי מַשְׂכִּ֣יל אֶל דָּ֑ל בְּ/י֥וֹם רָ֝עָ֗ה יְֽמַלְּטֵ֥/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/001.yaml
  text: Blessed is the one who considers the poor[c][b][a]; in the day of trouble Yahweh will deliver him.
translation:
  language: zh_hans
  text: 体恤贫弱者的人有福了[a][b]！遭难之日[c]，耶和华必搭救他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“明智地对待贫弱者”。希伯来语动词可指带着洞察力留意其处境，并明智地相待。
    reason: lexical_alternative
  - marker: b
    text: “贫弱者”也可译作“穷人”“软弱者”或“困苦者”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译“祸患之日”；这里指灾祸、患难，并非道德上的邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是希伯来语智慧文学中常见的祝福宣告。译作“有福了”既保留庄重的经文语气，也比单纯表达主观感受的“快乐”更准确。
- source_word: מַשְׂכִּיל אֶל
  choice: 体恤
  rationale: שׂכל 的使役词干在此可指有洞察力地关注、明智地对待；与介词 אֶל 连用，表示这种关切指向贫弱者。“体恤”自然简洁，兼具留心其处境和以明智关怀相待的含义；脚注保留另一种较显明的译法。
- source_word: דָּל
  choice: 贫弱者
  rationale: 该词的语义范围包括贫穷、软弱和处境卑微的人。“贫弱者”比单独译作“穷人”更能保存原词兼有经济贫困与社会脆弱的幅度。
- source_word: בְּיוֹם רָעָה
  choice: 遭难之日
  rationale: 字面为“祸患之日／恶之日”，此处 רָעָה 指灾祸、困境，而不是道德上的邪恶。“遭难之日”在现代汉语中自然，并保留诗体的凝练。
- source_word: יְמַלְּטֵהוּ
  choice: 必搭救他
  rationale: מלט 的加强词干表达使人逃脱危险、施行救援。“搭救”准确传达从危难中救出的动作；“必”体现未完成式在这一祝福宣告中的将来或确定性语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中最通行、最易识别的上帝专名译写，保留其作为专名而非普通称号的功能。
theological_decisions:
- issue: 应许对象的代表性单数与阳性后缀
  choice: 保留单数结构“……的人……他”
  alternative: 改为复数“体恤贫弱者的人……他们”，或用重复名词回避代词
  rationale: 希伯来文以代表性的单数人物陈述，并在动词后缀中使用阳性单数。现代汉语的“他”在这种格言式结构中可承接该单数人物，不必擅自改成复数，也不要求对象必为男性。
- issue: 这一应许是智慧诗歌的宣告，还是机械性的顺遂保证
  choice: 直接保留“耶和华必搭救他”的完整力度，不在正文加以限定
  alternative: 弱化为“耶和华或会搭救他”，或扩写成无条件、即时免除一切灾难的保证
  rationale: 原文郑重宣告耶和华的搭救，却没有说明实现方式和时间。译文既不削弱其应许，也不加入原文没有的成功神学解释。
- issue: מַשְׂכִּיל אֶל 所表达的是思想关注还是明智行动
  choice: 正文译“体恤”，脚注注明“明智地对待”这一可能含义
  alternative: 仅译“想到”或仅译“明智地帮助”
  rationale: 原短语兼有洞察、留意和明智相待的张力。“体恤”可自然覆盖关切与对待，脚注则明确较贴近词形的行动性读法，避免把含义限缩为内心同情或具体施舍。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。前半句以“有福了”保留祝福宣告的力量；“遭难之日”与“必搭救他”保持凝练的平行节奏。所有脚注标记均置于正文相应词语之后。
