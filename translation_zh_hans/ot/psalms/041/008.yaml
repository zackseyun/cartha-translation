  text: דְּֽבַר בְּ֭לִיַּעַל יָצ֣וּק בּ֑/וֹ וַ/אֲשֶׁ֥ר שָׁ֝כַ֗ב לֹא יוֹסִ֥יף לָ/קֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/008.yaml
  text: A wicked thing is poured out upon him; now that he lies down[a], he will rise no more.
translation:
  language: zh_hans
  text: “有一件邪恶的事加在他身上[a]；他既已躺下，就再也起不来了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有一件邪恶的事加在他身上”也可译作“有一种恶毒的祸患临到他身上”或“有人把恶毒的罪名加在他身上”。希伯来语原文较难确定，可能是指一种恶性的祸患，也可能是指毁灭性的指控。
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר בְּלִיַּעַל
  choice: 恶事
  rationale: 这一紧缩短语可指恶性的祸患，也可指恶毒的指控；“恶事”简洁地保留两者之间的歧义，不把它明确译成疾病、诅咒或罪名。
- source_word: יָצוּק
  choice: 缠住
  rationale: 该词本义涉及倾倒、铸成或固定；在此与介词短语连用，可能描写某种祸患临到并牢牢附着于人。“缠住”在现代汉语中自然，也能兼顾恶疾与恶意指控挥之不去的可能性；脚注交代其他理解。
- source_word: בּוֹ
  choice: 他
  rationale: 在“缠住他”中作为动词宾语，自然表达希伯来语‘在他身上／临到他’的关系。
- source_word: וַאֲשֶׁר שָׁכַב
  choice: 他既已躺下
  rationale: 保留 שָׁכַב ‘躺下’的基本意象；“既已”使其与后句的结果关系清楚，同时不直接解释为卧病或死亡。
- source_word: לֹא יוֹסִיף לָקוּם
  choice: 就再也起不来了
  rationale: 准确表达‘不再起来’的惯用意义；“起不来了”既可指不能从病榻起身，也可暗示不能复原，语气庄重而易懂。
theological_decisions:
- issue: 本节意象究竟指恶疾还是恶意指控
  choice: 正文用“恶事缠住他了”保留双重可能
  alternative: 可明确译作“恶疾缠住他”或“恶毒的罪名落在他身上”
  rationale: 希伯来语 דְּבַר בְּלִיַּעַל יָצוּק בּוֹ 含义压缩且解释有争议；上下文不足以断定说话者所指是致命疾病、咒诅，还是毁灭性的指控，因此不在正文中消除这一张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“恶事”保留原文的概括性；“缠住”比生硬的“浇在他身上”更符合汉语习惯，同时由脚注说明原文也有倾倒、固定或加诸其身的可能。“再也起不来了”传达敌人断言诗人无法恢复的沉重语气。
