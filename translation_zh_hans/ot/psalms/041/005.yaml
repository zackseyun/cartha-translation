  yaml_path: translation/ot/psalms/041/005.yaml
  text: 'My enemies say evil against me: “When will he die and his name perish?”[a][b]'
translation:
  language: zh_hans
  text: 我的仇敌恶意议论我：[a]“他何时死去，他的名何时消灭？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“说害我的话。”希伯来原文直译为“向我说恶”。
    reason: lexical_alternative
  - marker: b
    text: “他的名消灭”也可指他的名声或人们对他的记念不复存在，并非只指无人再提起这个名字。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹיְבַי
  choice: 我的仇敌
  rationale: 该词是复数名词“仇敌”，带第一人称单数词尾；译为“我的仇敌”自然、准确，并保留敌对意味。
- source_word: יֹאמְרוּ
  choice: 说
  rationale: 未完成体在诗歌语境中可表示当前或惯常行为；汉语用“说”即可自然表达。
- source_word: רַע לִי
  choice: 说恶言攻击我
  rationale: רַע 的基本义为“恶、坏”，לִי 表明恶意所针对的对象。此译既保留“恶”的词义，也用现代汉语清楚传达敌意言论的指向。
- source_word: מָתַי
  choice: 什么时候才
  rationale: 基本义为“什么时候”；加入“才”自然表现仇敌急切盼望诗人死亡的语气，但不把句子改译成直接的愿望式。
- source_word: יָמוּת
  choice: 他……死
  rationale: מות 的第三人称阳性单数未完成体置于疑问词之后，宜按将来指向译为“他什么时候才死”。
- source_word: וְאָבַד שְׁמוֹ
  choice: 他的名……消失
  rationale: 直译保留“名”，不在正文中径自解释成“名声”或“记忆”；אבד 在此表示不复存在、消失，与前句形成并列的将来指向。
theological_decisions:
- issue: “他的名消失”的含义范围
  choice: 正文保留“名”，脚注说明可涉及名声或后世记念。
  alternative: 直接译为“他的名声／人们对他的记念消失”。
  rationale: 希伯来文本明确使用“名”；保留这一意象可避免把其丰富含义限定为某一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恶言攻击我”比生硬的“向我说恶”自然，同时由脚注保留原文表达。“什么时候才”传达敌人的恶意期待；两个问句在汉语中比机械并列更流畅，并未改变希伯来诗句的意义关系。
