- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题注中通常指负责音乐演奏的人；“乐长”简洁庄重，而前置的 לַ־ 用“交给”表达题献或演奏指示的功能。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇题注中的体裁术语；在中文圣经语境中译作“诗”自然、准确，也与整卷书名相协调。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 希伯来语介词 לְ־ 在题注中可表示作者、归属、关联或题献；“大卫的”保留这种语义宽度，不强行限定为大卫亲笔所作。
theological_decisions:
- issue: 大卫题名的含义
  choice: 大卫的
  alternative: 大卫所作；献给大卫
  rationale: 原文 לְדָוִד 的关系含义较宽，正文采用自然但仍开放的表达，并在脚注中列出主要可能，以免把作者身份或题献关系定得过死。
