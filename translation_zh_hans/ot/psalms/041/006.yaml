  yaml_path: translation/ot/psalms/041/006.yaml
  text: And if he comes to see me[a], he speaks falsehood; his heart gathers wickedness to itself; when he goes out to the street[c][b], he speaks it.
translation:
  language: zh_hans
  text: 他若来看我[a]，就说虚谎的话；他心里积聚着恶意。他出去以后，便说出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“来看”；“我”是根据上下文补出的受词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 他若
  rationale: 保留条件语气；中文以“若”自然承接上文，无须机械译出连接词“和”。
- source_word: בָּא לִרְאוֹת
  choice: 来看我
  rationale: 按字面为“来观看”；受词由上下文隐含。补出“我”使现代汉语完整，同时在脚注说明。
- source_word: שָׁוְא יְדַבֵּר
  choice: 说虚谎的话
  rationale: שָׁוְא兼有虚空、虚假、欺骗之意；此处描述敌意来访者的言谈，“虚谎的话”既保留虚假性，也不把含义限缩为某一种具体谎言。
- source_word: לִבּוֹ
  choice: 他的心
  rationale: 保留希伯来文以“心”指人的内在思想、意图和意志的表达。
- source_word: יִקְבָּץ אָוֶן לוֹ
  choice: 为自己积聚恶念
  rationale: יִקְבָּץ意为聚集、积聚；אָוֶן可指邪恶、祸害或罪孽。结合内心蓄意及随后外传的语境，译作“积聚恶念”。לוֹ按其自然反身关系译为“为自己”。
- source_word: יֵצֵא לַחוּץ
  choice: 一到外面
  rationale: 直译“出去到外面”。“一到外面”自然表达从探访现场转到外部的动作，不额外限定为街道。
- source_word: יְדַבֵּר
  choice: 就把这些说出去
  rationale: 第二次出现דבר，与前面的“说”形成呼应；“这些”指其内心积聚的恶念，是中文为语意连贯而补出的隐含受词。“说出去”也贴合向外传播的语境。
theological_decisions: []
