source:
  edition: WLC
  text: אֲֽנִי אָ֭מַרְתִּי יְהוָ֣ה חָנֵּ֑/נִי רְפָאָ֥/ה נַ֝פְשִׁ֗/י כִּי חָטָ֥אתִי לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/004.yaml
  text: As for me[a], I said, “O Yahweh, be gracious to me; heal my soul, for I have sinned against you.”
translation:
  language: zh_hans
  text: 至于我，我说：“雅威啊，求你恩待我；求你医治我[a]，因为我得罪了你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的受词为“我的 נפש”；נפש可指“性命”“生命”或“我自己”，也可按较传统的说法译为“我的灵魂”。
    reason: 保留נפש的宽广语义，避免现代读者把它仅理解为与身体分离的“灵魂”。
lexical_decisions:
- source_word: אֲנִי
  choice: 至于我
  rationale: 独立人称代词在此带有轻微强调和话语转折作用；“至于我”比单用“我”更能自然传达这一强调。
- source_word: אָמַרְתִּי
  choice: 我曾说
  rationale: Qal完成式第一人称单数在此回述诗人所说的话；“曾说”简洁地表达过去的言说，又不额外限定具体时间。
- source_word: יְהוָה
  choice: 雅威啊
  rationale: 按希伯来文直接呈现四字神名，并用呼语助词“啊”表达祷告中的直接称呼；“雅威”是现代汉语对YHWH的常见音译。
- source_word: חָנֵּנִי
  choice: 求你恩待我
  rationale: 该命令式请求施予恩惠或怜悯；“恩待”保留恩惠的广义，也符合现代汉语祷告语体。
- source_word: רְפָאָה
  choice: 医治
  rationale: 直接保留רפא的医治意象，不预先判定所求的是身体、内在生命，还是整个人的复原。
- source_word: נַפְשִׁי
  choice: 我
  rationale: נפש在此可指性命、生命或本人。译作“我”在现代汉语中与“医治”搭配最自然，并能涵盖整个人；脚注保留希伯来文较具体的表达及其其他可能含义。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出恳求的理由；“因为”清楚、自然。
- source_word: חָטָאתִי
  choice: 我得罪了
  rationale: 完成式表达已经发生、并与当前认罪有关的行为；结合后面的对象，“得罪了”自然传达犯罪所造成的关系性冒犯。
- source_word: לָךְ
  choice: 你
  rationale: 与חטא连用时标明被冒犯的一方；汉语“得罪了你”准确表达“向你犯罪／犯罪得罪你”的关系含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威啊
  alternative: 耶和华啊；上主啊
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之神专名的性质，不以称号取代；“啊”仅体现呼语功能。
- issue: “医治我的נפש”的范围
  choice: 求你医治我
  alternative: 求你医治我的心灵；求你医治我的性命；求你医治我的生命
  rationale: נפש并不必然指与身体分离的“灵魂”，也可表示生命、性命或整个人。正文译作“我”避免把医治限缩为纯属身体或纯属内在的医治，脚注则保留原文措辞及其语义张力。
- issue: 罪与医治之间的关系
  choice: 保留“因为”的因由关系，不进一步解释
  alternative: 将其解释为疾病必由个人犯罪造成，或仅解释为属灵医治
  rationale: 原文以כִּי连接认罪与恳求，但未系统说明罪、疾病和医治的因果机制；译文不应加入原文没有明说的教义结论。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“至于我”保留句首独立代词的强调；两个“求你”使并列祈求清晰而符合汉语祷告表达。正文避免生硬的“医治我的性命”，以“医治我”表达整全含义，并借脚注交代希伯来文。
