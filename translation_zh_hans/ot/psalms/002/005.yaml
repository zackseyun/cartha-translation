  text: אָ֤ז יְדַבֵּ֣ר אֵלֵ֣י/מוֹ בְ/אַפּ֑/וֹ וּֽ/בַ/חֲרוֹנ֥/וֹ יְבַהֲלֵֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/005.yaml
  text: Then he will speak to them in his anger[a], and in his burning wrath he will terrify them.
translation:
  language: zh_hans
  text: 那时，他必在怒气中向他们说话，在烈怒中使他们惊惶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并在他愤怒的炽热中使他们惶恐。”
    reason: “烈怒”所译的词含有燃烧、炽热之怒的意味；“惊惶”亦可译为“惶恐”。此注保留第二分句的词汇性替代译法。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 这是表示时间推进的副词，承接前文列国与君王的反叛，引出上帝随后的回应；“那时”自然且保留叙事次序。
- source_word: יְדַבֵּר
  choice: 必……说话
  rationale: דבר 的 Piel 未完成式在此指接下来发生的回应；“必……说话”既传达后续性，也符合诗歌中庄严的宣告语气。
- source_word: אֵלֵימוֹ
  choice: 向他们
  rationale: 介词与第三人称阳性复数后缀指向前文反叛的君王和统治者；“向他们”是自然、明确的现代汉语。
- source_word: בְאַפּוֹ
  choice: 在怒气中
  rationale: אַף 字面与“鼻子”有关，但在此是表示发怒的惯用语；译作“怒气”忠实传达其实际意义，同时与下句更强烈的 חָרוֹן 区分。
- source_word: וּבַחֲרוֹנוֹ
  choice: 在烈怒中
  rationale: חָרוֹן 表示炽烈、燃烧般的愤怒；“烈怒”在现代汉语中简洁有力，保留强度，而不把希伯来语的热度意象过度展开。
- source_word: יְבַהֲלֵמוֹ
  choice: 使他们惊惶
  rationale: בהל 的 Piel 形表示使人突然恐惧、慌乱或震惊；“使他们惊惶”兼顾恐惧与失措，比单纯“惊吓”更庄重，也不把程度限定得过窄。
theological_decisions:
- issue: 对上帝愤怒的拟人性表达
  choice: 保留“怒气”和“烈怒”的强烈表达
  alternative: 弱化为“不悦”或概括为“审判”
  rationale: 原文明确以强烈的愤怒语言描绘上帝对反叛者的回应。译文不淡化这种张力，也不另行解释其性质，只忠实保留经文本身的神学分量。
- issue: 上帝话语与使人惊惶之间的关系
  choice: 按原文并列结构译为“向他们说话，在烈怒中使他们惊惶”
  alternative: 解释为“借着所说的话使他们惊惶”
  rationale: 希伯来文呈现两个相连的动词，但未明确说明惊惶仅是说话的结果；保持并列可避免加入原文未明说的因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必”体现未完成式在上下文中的后续和确定语气；两个“在……中”保留希伯来诗句的平行结构。脚注标记置于主文句末。
