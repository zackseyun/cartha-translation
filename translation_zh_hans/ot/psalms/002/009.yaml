source:
  edition: WLC
  text: תְּ֭רֹעֵ/ם בְּ/שֵׁ֣בֶט בַּרְזֶ֑ל כִּ/כְלִ֖י יוֹצֵ֣ר תְּנַפְּצֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/009.yaml
  text: You will break them with an iron scepter[b][a]; like a potter’s vessel you will shatter them.
translation:
  language: zh_hans
  text: '你必用铁杖[b]击碎他们[a]；

    你必把他们摔碎，如同陶匠的器皿。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有一种古老的文本传统见于部分古代译本，并在《启示录》中有所呼应，可译作：“你必用铁杖牧养他们”或“你必用铁杖治理他们。”
    reason: alternative_reading
  - marker: b
    text: “杖”也可译作“权杖”；希伯来语这个词既可指象征权威的杖，也可指施行惩戒的杖。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרֹעֵם
  choice: 你必……击碎他们
  rationale: 马所拉文本的元音标注支持“击碎”，且与下半句“摔碎他们”构成同义平行，突出毁灭性的审判。辅音文本也可关联“牧养”，这一古老异读保留在脚注[a]。
- source_word: בְּשֵׁבֶט
  choice: 用……杖
  rationale: שֵׁבֶט可指杖、棍或王权之杖。“杖”在中文中既保留具体器具的形象，也能承载管治与惩戒的含义；若译“权杖”，王权意味更明确，见脚注[b]。
- source_word: בַּרְזֶל
  choice: 铁
  rationale: 直译其材质，表现力量与审判的严厉。
- source_word: כִּכְלִי
  choice: 如同……的器皿
  rationale: כְּלִי含义较广，可指器具或器皿；与“窑匠”连用时，“器皿”自然且准确。
- source_word: יוֹצֵר
  choice: 窑匠的
  rationale: יוֹצֵר本义为塑造者，在制作陶器的语境中指窑匠；“窑匠的器皿”是现代中文中清楚、自然的表达。
- source_word: תְּנַפְּצֵם
  choice: 你必把他们摔碎
  rationale: 该动词表达猛烈撞碎、摔碎；“摔碎”与陶制器皿的比喻贴合，并保留动作的强烈程度。
theological_decisions:
- issue: 首个动词描写的是毁灭性审判，还是君王的牧养与治理
  choice: 正文采用毁灭性审判：“击碎他们”
  alternative: “牧养他们”或“治理他们”
  rationale: WLC所据马所拉文本的读音及其与“摔碎他们”的平行关系支持“击碎”。但部分古代译本以及《启示录》中的呼应反映“牧养／治理”的传统，因此不将张力消除，而在脚注中注明。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“击碎／摔碎”再现希伯来诗歌的同义平行，并保留审判意象的力度；“窑匠”比“陶匠”更符合常见现代圣经语体，同时普通读者也容易理解。脚注标记均置于正文相应词句之后。
