id: PSA.2.2
reference: Psalms 2:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִ֥תְיַצְּב֨וּ מַלְכֵי אֶ֗רֶץ וְ/רוֹזְנִ֥ים נֽוֹסְדוּ יָ֑חַד עַל יְ֝הוָה וְ/עַל מְשִׁיחֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/002.yaml
  text: The kings of the earth take their stand[b][a], and rulers gather together against Yahweh and against his Anointed.
translation:
  language: zh_hans
  text: 地上的君王摆开阵势，统治者一同聚集，要敌对耶和华，敌对他的受膏者。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受膏者”也可译作“弥赛亚”。“一同聚集”也可译作“一同商议”或“一同结盟”；原文强调他们联合采取敌对行动。
    reason: 保留 מְשִׁיחוֹ 的称号译法及 נוֹסְדוּ יָחַד 的词义范围。
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: 摆开阵势
  rationale: 该词为 יצב 的 Hitpael 形式，表示主动站定位置、列阵而立；结合敌对语境，“摆开阵势”既保留刻意采取立场的意味，也符合自然现代汉语。
- source_word: מַלְכֵי אֶרֶץ
  choice: 地上的君王
  rationale: 该结构在本诗的普世政治语境中指世上的诸王；“地上的君王”直接、庄重，也不把 אֶרֶץ 局限为某一片土地。
- source_word: רוֹזְנִים
  choice: 统治者
  rationale: 该词指掌权者或高级政治领袖；“统治者”清楚且涵盖面适当，避免“王公”等较古旧或范围较窄的表达。
- source_word: נוֹסְדוּ יָחַד
  choice: 一同聚集
  rationale: 此处表示领袖们联合采取协调行动。“一同聚集”保留集体联合的含义，而不在正文中径直强化为“密谋”。
- source_word: עַל
  choice: 敌对
  rationale: 在本节明确的对抗语境中，עַל 表示反对、攻击的关系；配合“要”译作“要敌对”，使两个并列对象在汉语中清楚自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，保留其作为名字而非一般称号的性质。
- source_word: מְשִׁיחוֹ
  choice: 他的受膏者
  rationale: 字面意为“他的受膏者”，在本诗直接语境中首先指受膏立的君王，同时保留其弥赛亚意义的发展空间，不在正文中预先把含义限定为专称“弥赛亚”。
theological_decisions:
- issue: מְשִׁיחוֹ 在王权诗篇及其弥赛亚脉络中的译法
  choice: 他的受膏者
  alternative: 他的弥赛亚
  rationale: “受膏者”直接反映希伯来词义，并能同时容纳当下的大卫王权所指与更广的弥赛亚指向，避免在正文中消解两者之间有意保留的张力；脚注列出传统音译称号。
- issue: 神名 יְהוָה 的中文呈现
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 采用中文圣经传统中广为人知的专名形式，明确这是神的名字；不以“上主”这一称号取代原文专名。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“摆开阵势”传达诸王刻意列阵对抗的动态；“一同聚集”避免把原文过度解释为秘密阴谋。句中重复“敌对”以对应两个 עַל，并突出耶和华与其受膏者并列成为反抗对象。
