source:
  edition: WLC
  text: וַ֭/אֲנִי נָסַ֣כְתִּי מַלְכִּ֑/י עַל צִ֝יּ֗וֹן הַר קָדְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/006.yaml
  text: But as for me[a], I have installed my king on Zion, my holy mountain.
translation:
  language: zh_hans
  text: 至于我，我已经在锡安——我的圣山上立了我的王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立了”也可译作“设立了”；有人把这个动词理解为“膏立了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 独立代词带有强调作用，并在语境中与列国和世上君王的反叛形成对照；“至于我”自然地保留这种强调和转折意味。
- source_word: נָסַכְתִּי
  choice: 已经……立了
  rationale: 此处指把王设立在王位或指定为王。“立了”在现代汉语中简洁、庄重，并保留“设立、立为王”的幅度；不直接译作“膏立”，以免与通常表示膏抹的 משׁח 混同。
- source_word: מַלְכִּי
  choice: 我的王
  rationale: 忠实表达第一人称单数所属后缀；“王”不额外添加原文没有明示的解释性称号。
- source_word: עַל
  choice: 在……上
  rationale: 与地名及“圣山”连用时主要表达所在位置；译作“在……上”比“统治”类措辞更贴近原文。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的地名音译。
- source_word: הַר קָדְשִׁי
  choice: 我的圣山
  rationale: 自然、直接地表达该结构短语，保留 הַר 的“山”义和第一人称所属关系。
theological_decisions:
- issue: נָסַכְתִּי 是否应译成带有礼仪性膏抹含义的措辞
  choice: 译作“立了”，表达君王的设立或登位
  alternative: 译作“膏立了”或“安置了”
  rationale: 上下文描写耶和华面对列王反叛而宣告自己所立的王，因此君王的设立是核心含义。“立了”既不把词义收窄为膏抹礼仪，也不排除本节在更广正典语境中的弥赛亚意义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“锡安——我的圣山”以同位说明呈现两者关系；保留“我的王”的重复所属表达，以体现希伯来原文的强调。
