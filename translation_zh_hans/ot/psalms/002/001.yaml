  text: Why do the nations rage[a], and the peoples plot in vain?
translation:
  language: zh_hans
  text: 列国为什么喧嚷？万民为什么图谋虚妄之事[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“思量空虚之事”“低声念叨虚妄之事”，或按传统译作“徒然图谋”。希伯来语动词既可指低声念叨、默想，也可指谋划；名词则指空虚、虚妄或徒劳之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 标准疑问副词；在本节平行问句中译为“为什么”，自然保留反问语气。
- source_word: רָגְשׁוּ
  choice: 喧嚷
  rationale: 该动词表示群体骚动、喧腾；“喧嚷”保留动荡声势及敌对氛围，又不把词义过度限定为“密谋”或单纯的内在“愤怒”。
- source_word: גוֹיִם
  choice: 列国
  rationale: 指众政治民族；“列国”简洁庄重，也不引入后期“外邦人”的宗教身份对比。
- source_word: לְאֻמִּים
  choice: 万民
  rationale: 与“列国”构成近义平行，同时保留复数群体概念；现代中文读者容易理解。
- source_word: יֶהְגּוּ
  choice: 图谋
  rationale: 原词可指低声念叨、思量或谋划；在列国反叛的语境中，“图谋”自然表达蓄意谋划，较符合上下文，但其较宽的语义范围在脚注中保留。
- source_word: רִיק
  choice: 虚妄之事
  rationale: 该名词指空虚、虚妄或徒劳之物；译作“虚妄之事”保留其作为动词宾语的句法，不直接改写成副词性的“徒然”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用两个“为什么”显明希伯来诗歌的平行结构；“列国／万民”保留近义对应。“图谋虚妄之事”兼顾上下文与原文宾语结构，脚注则保留 יֶהְגּוּ רִיק 的真实词义张力。
