  text: וְ֭/עַתָּה מְלָכִ֣ים הַשְׂכִּ֑ילוּ הִ֝וָּסְר֗וּ שֹׁ֣פְטֵי אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/010.yaml
  text: So now[a], O kings, be wise; be warned, O judges of the earth.
translation:
  language: zh_hans
  text: 如今，君王啊，要明智；世上的审判官啊，要接受管教。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要听从训诫”“要接受纠正”。希伯来语动词可指领受管教、训诲或劝诫，并不只是受到警告。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以，现在
  rationale: 既保留连接词所表达的推论承接，也保留“现在”的时间意味，自然地从上文转入劝诫。
- source_word: מְלָכִים
  choice: 君王啊
  rationale: 此处是直接呼语；用“啊”在现代汉语中清楚标示呼告，并保持诗歌的庄重语气。
- source_word: הַשְׂכִּילוּ
  choice: 要明智
  rationale: 该使役式命令可指获得洞见并据此谨慎行事；“要明智”简洁自然，同时不过度限定为单纯的理解或具体行动。
- source_word: הִוָּסְרוּ
  choice: 要接受管教
  rationale: 该被动式命令源自 יסר，可表示接受训诲、管教或纠正。“接受管教”保留受教与受纠正的幅度，也契合对君王和审判官的郑重告诫。
- source_word: שֹׁפְטֵי אָרֶץ
  choice: 世上的审判官啊
  rationale: “审判官”保留 שֹׁפְטִים 的司法治理含义；诗篇第二篇具有列国范围，因此 אָרֶץ 译为“世上”而非特定的“地”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的呼告句式。两个平行分句均用“啊”标示直接称呼，并用“要”表达复数命令的劝诫力度；不引入超出希伯来文本的特定神学解释。
