  text: יוֹשֵׁ֣ב בַּ/שָּׁמַ֣יִם יִשְׂחָ֑ק אֲ֝דֹנָ֗/י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/004.yaml
  text: The one enthroned in the heavens laughs[a]; the Lord mocks them.
translation:
  language: zh_hans
  text: 坐在天上的那位发笑[a]；主讥诮他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发笑”也可结合下半句译作“嗤笑”；“坐在天上的那位”也可译作“在诸天中端坐的那位”。
    reason: 词义与诗歌语气的可选译法
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: 坐在……的那位
  rationale: 该分词本义为“坐着、居住”。本诗语境含有君王般掌权的意味，但原文并未明说“宝座”，因此正文保留“坐在”的形象，避免把语境含义写成明示内容。
- source_word: בַּשָּׁמַיִם
  choice: 在天上
  rationale: שָׁמַיִם在希伯来语中形态为复数，但现代汉语通常以“天上”自然表达其所在领域；直译“诸天中”虽可行，却较不自然，列入脚注备选。
- source_word: יִשְׂחָק
  choice: 发笑
  rationale: 保留动词“笑”的基本词义，不把下半句所显明的讥诮意味提前并入；未完成式在诗歌中表达鲜明、持续或常态性的动作，汉语用无时态标记的“发笑”最自然。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 此处是神的称号אֲדֹנָי，并非神名יהוה；“主”是现代中文圣经语体中自然、庄重的对应词。
- source_word: יִלְעַג
  choice: 讥诮
  rationale: 该词表示嘲笑、讥讽或轻蔑。“讥诮”既保留诗体的庄重，也清楚表达对叛逆者的蔑视，并与上句较中性的“发笑”形成递进。
- source_word: לָמוֹ
  choice: 他们
  rationale: 该代词回指前文叛逆的列国及君王；“讥诮他们”符合现代汉语表达。
theological_decisions:
- issue: 对上帝的君王式及拟人化描写
  choice: 保留“坐在天上”“发笑”“讥诮”等具体形象，不在正文中增添“登基”或“宝座”。
  alternative: 译作“在诸天中端坐掌权的那位嗤笑他们”。
  rationale: 诗篇语境确有上帝主权和王权的意味，但יוֹשֵׁב本身只明说“坐着”。正文保留原文形象及其张力，让王权含义由上下文呈现，同时不淡化上帝“发笑、讥诮”这一鲜明的拟人表达。
translation_notes:
  register: 采用现代、庄重而清楚的诗歌语体。“坐在天上的那位”自然易懂；分号对应希伯来诗歌的平行结构。“发笑”与“讥诮”既避免无根据地合并两个动词，也呈现由动作到含义的递进。
