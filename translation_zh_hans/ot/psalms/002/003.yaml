lexical_decisions:
- source_word: נְנַתְּקָה
  choice: 让我们挣断
  rationale: 第一人称复数祈愿式，表达共同的决意或彼此号召；“挣断”既体现用力摆脱，也保留将束缚扯断的鲜明意象。
- source_word: מֹוסְרוֹתֵימוֹ
  choice: 他们的锁链
  rationale: 该复数名词指捆绑物、束缚或镣铐；“锁链”在现代汉语中具体易懂，并保留诗句中的实体束缚意象。
- source_word: וְנַשְׁלִיכָה
  choice: 把……甩掉
  rationale: 同为第一人称复数祈愿式，表示强行抛开；结合 מִמֶּנּוּ 译作“从身上甩掉”，中文自然，也传达坚决排斥。
- source_word: מִמֶּנּוּ
  choice: 从身上
  rationale: 介词加第一人称复数后缀，意为“从我们这里／从我们身上”；中文用“从身上”明确绳索原本加在说话者身上的意象。
- source_word: עֲבֹתֵימוֹ
  choice: 他们的绳索
  rationale: 该词可指粗绳、绳索或捆绑用的带子；“绳索”庄重而通俗，并与“锁链”构成诗歌平行。
theological_decisions:
- issue: 上帝及其受膏者之权柄被叛逆者描述为束缚
  choice: 按原诗的具体意象译为“锁链”和“绳索”，不在正文中判定这种约束是压迫还是保护。
  alternative: 改用较抽象的“束缚”“捆绑”，或在译文中明说这是对上帝统治的反抗。
  rationale: 上下文表明说话者是反抗耶和华及其受膏者的列国君王，但本节只以他们自己的口吻使用束缚隐喻。保留具体意象，可维持原文的神学张力而不替读者作额外解释。
translation_notes:
  register: 采用现代、庄重而有力度的直接引语。“让我们”对应两个第一人称复数祈愿式；“挣断……甩掉……”形成简洁有力的平行结构。所有脚注标记均置于正文句末。
