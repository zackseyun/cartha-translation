source:
  edition: WLC
  text: נַשְּׁקוּ בַ֡ר פֶּן יֶאֱנַ֤ף וְ/תֹ֬אבְדוּ דֶ֗רֶךְ כִּֽי יִבְעַ֣ר כִּ/מְעַ֣ט אַפּ֑/וֹ אַ֝שְׁרֵ֗י כָּל ח֥וֹסֵי בֽ/וֹ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/012.yaml
  text: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[c][b]. Blessed are all who take refuge in him.
translation:
  language: zh_hans
  text: 你们要亲吻那位儿子[a][b]，免得他发怒，你们便在路上灭亡；因为他的怒火顷刻就会燃起[c]。凡投靠他的，都是有福的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要向那位儿子致敬。”原文动词直译为“亲吻”；在君王场合，这动作可表示臣服或尊崇。
    reason: lexical_alternative
  - marker: b
    text: 原文 בַר（bar）在这里用法特殊。通常据本诗第7节译为“儿子”，但也有人提出“纯洁”或“纯洁地”等解释。
    reason: alternative_reading
  - marker: c
    text: 或译：“因为他的怒火不久便会燃起”或“因为他的怒气只会燃烧片刻。”原文十分凝练，既可能强调怒火即将突然爆发，也可能表示其燃烧短暂或仅稍微燃起。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְּׁקוּ
  choice: 当亲吻
  rationale: 这是 נשׁק 的复数命令式，基本义为“亲吻”。在君王语境中，这一动作可表达臣服或致敬；正文保留具体意象，脚注说明其语用含义。
- source_word: בַר
  choice: 那位儿子
  rationale: בַר 在此处用法特殊且历来有争议。结合本诗第7节的“你是我的儿子”以及全诗的君王语境，译作“那位儿子”最能衔接上下文；指示性表达也避免现代汉语把“亲吻儿子”误解为一般亲子动作。
- source_word: פֶּן יֶאֱנַף
  choice: 免得他发怒
  rationale: פֶּן 表示所警戒的负面结果，יֶאֱנַף 表示发怒。此译保留人称主语及警告语气。
- source_word: וְתֹאבְדוּ דֶרֶךְ
  choice: 你们便在途中灭亡
  rationale: אבד 表示灭亡，דֶרֶךְ 无介词，形成凝练的诗句。“在途中”保留其可指行程或人生道路的开放性，不把含义限定为“偏离正道”。
- source_word: כִּי יִבְעַר כִּמְעַט אַפּוֹ
  choice: 因为他的怒火顷刻就会燃起
  rationale: בער 保留燃烧、燃起的意象；כמעט 的紧凑表达可强调迅速、临近，也可能表示程度轻微。正文按迅速爆发理解，脚注保留其他可能。
- source_word: אַשְׁרֵי
  choice: 都是有福的
  rationale: 这是《诗篇》常见的福乐宣告。译作“有福”比单纯“快乐”更能保留其宗教与诗歌语感。
- source_word: כָּל חֹוסֵי בוֹ
  choice: 凡投靠他的
  rationale: חסה 指寻求庇护、以某人为避难所。“投靠”在现代汉语中自然，并保留寻求保护与信赖的含义。
theological_decisions:
- issue: 诗篇2:12中 בַר 的身份与含义
  choice: 正文译作“那位儿子”，与第7节的王室儿子称谓及本诗的受膏君王语境相连。
  alternative: 也可把 בַר 理解为“纯洁”或副词性的“纯正地”；亦有人视其为难解的文本或语言问题。
  rationale: 上下文较有力地支持君王之子的所指，但该词在希伯来语诗句中确实罕见。正文采用最符合篇章脉络的译法，同时用脚注保留文本的不确定性，不把后来的系统神学结论直接写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体。“当……免得……”保留命令与警告的结构；“怒火……燃起”保存原文火焰意象；不将“那位儿子”进一步明确为任何后期教义称号，以保留诗篇自身的君王与弥赛亚张力。
