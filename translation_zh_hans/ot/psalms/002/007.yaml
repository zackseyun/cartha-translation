base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/007.yaml
  text: 'I will declare the decree of Yahweh: He said to me[a], “You are my Son[b]; today I have begotten you.”'
translation:
  language: zh_hans
  text: 我要宣告耶和华的谕旨：他对我说：“你是我的儿子[a]；我今日生你[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的儿子”在本诗的直接语境中指耶和华所立的君王，并具有王室和弥赛亚意义；本节在新约中也被用于耶稣。希伯来文没有英文式的大小写区别。
    reason: alternative_reading
  - marker: b
    text: 或意译“今日我成为你的父亲”。原文直用“生”的说法，可能使人联想到君王登基或被立为儿子的图景，因此正文保留这一意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: 我要宣告
  rationale: 此处的形式引出庄严的王室宣告；“宣告”比“讲述”更符合语境和语体。
- source_word: אֶל חֹק
  choice: 谕旨
  rationale: אֶל在此随ספר引出所宣告的内容；חֹק在君王登基语境中指具有权威的既定宣告。“谕旨”自然体现王权语境，同时避免译成泛指法律条文的“律例”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，而不以头衔替代。
- source_word: אָמַר אֵלַי
  choice: 他对我说
  rationale: 主语自然承接前面的“耶和华”；用代词可使中文流畅，所指也清楚。
- source_word: בְּנִי אַתָּה
  choice: 你是我的儿子
  rationale: 直接保留希伯来语的父子关系用语。现代汉语没有以大小写标示弥赛亚称谓的机制，因此不额外加入原文没有的形式标记。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 保留明确的时间强调；“今日”在诗歌和庄严宣告中自然、凝练。
- source_word: יְלִדְתִּיךָ
  choice: 我生了你
  rationale: 直接保留ילד的生育意象，不把它预先解释为登基、收养或“成为你的父亲”，从而保留原句的神学张力与互文意义。
theological_decisions:
- issue: “我的儿子”的王室及弥赛亚意义
  choice: 正文译作“我的儿子”，在脚注说明其王室—弥赛亚意义及后来的经典引用。
  alternative: 用特殊形式标作“我的圣子”或加入“弥赛亚”等解释性称谓。
  rationale: 直接语境指受膏的君王，后续经典用法又赋予此句明确的弥赛亚关联。中文无法像英文借大小写同时标示这种层次，因此正文从原文，脚注交代语境和经典关联，不把解释写进经文本身。
- issue: “今日我生了你”的含义
  choice: 保留“生”的意象，不判定“今日”专指登基、盟约性立嗣或弥赛亚应验中的某一事件。
  alternative: 译作“今日我成为你的父亲”或“今日我立你为儿子”。
  rationale: 原文使用生育动词。直译可以保存王室登基、父子盟约和弥赛亚应验之间真实存在的解释张力，避免由译者单方面消解。
translation_notes:
  register: 采用现代、庄重而可读的普通话。“谕旨”保留王室宣告色彩；“今日”与“我生了你”保持诗句的凝练和互文张力。所有脚注标记均已置于正文对应位置。
