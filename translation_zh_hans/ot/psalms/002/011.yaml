  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/יִרְאָ֑ה וְ֝/גִ֗ילוּ בִּ/רְעָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/011.yaml
  text: Serve Yahweh with fear[b][a], and rejoice with trembling.
translation:
  language: zh_hans
  text: 当以敬畏[a]事奉耶和华，又当战兢欢呼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”也可译作“惧怕”；原词兼有畏惧和肃然尊崇之意。
    reason: lexical_alternative
  - marker: b
    text: “欢呼”也可译作“欢喜”或“雀跃”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: 事奉
  rationale: 这是עבד的复数命令式；以耶和华为对象时，表示向他效忠并服事，也可包含敬拜之意。“事奉”保留其较宽的含义，不把它局限于礼仪性的敬拜。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的专名形式“耶和华”，将四字神名作为名字表达，而不以“主”这一称号代替。
- source_word: בְּיִרְאָה
  choice: 存敬畏
  rationale: יִרְאָה可指惧怕、敬畏或畏惧。“存敬畏”在自然中文中兼顾对神权威的畏惧与尊崇，且不削弱本节庄严、警戒性的语气。
- source_word: וְגִילוּ
  choice: 又当……欢呼
  rationale: גיל表示欢喜、雀跃或欢呼；“欢呼”比一般的“欢喜”更能体现强烈的喜乐和公开表达，并与“战兢”形成原文刻意保留的张力。
- source_word: בִּרְעָדָה
  choice: 战兢
  rationale: רְעָדָה指因惧怕或敬畏而颤抖。“战兢”凝练而庄重，准确保留身体颤抖及肃然畏惧的意味。
theological_decisions:
- issue: 如何表达喜乐与惧怕并置的两项命令
  choice: 保留“存敬畏事奉”与“战兢欢呼”的张力
  alternative: 将整句协调为单一的敬虔喜乐，如“虔敬地敬拜，肃然庆贺”
  rationale: 希伯来文把敬畏、战兢与欢呼直接并置，并未解释或消解其中的张力；译文因此同时保留顺服中的畏惧和面对神时的喜乐。
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主；主
  rationale: “耶和华”是现代中文圣经传统中最广为人知的专名形式，能明确表示此处是神的名字，而非一般称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“当……又当……”明确传达两个复数命令；“存敬畏”“战兢”是普通读者可理解的圣经语体，并保留希伯来诗句中喜乐与畏惧并置的力度。脚注标记依其所注词语分别置于“耶和华”和句末相关表达之后。
