  text: שְׁאַ֤ל מִמֶּ֗/נִּי וְ/אֶתְּנָ֣ה ג֭וֹיִם נַחֲלָתֶ֑/ךָ וַ֝/אֲחֻזָּתְ/ךָ֗ אַפְסֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/008.yaml
  text: Ask of me[a], and I will give the nations as your inheritance, and the ends of the earth as your possession.
translation:
  language: zh_hans
  text: 你向我求，我就把列国赐给你作产业，把地极赐给你作属地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地极”或译“大地最遥远之处”。
    reason: 说明אַפְסֵי אָרֶץ这一习语可采用较展开的译法；脚注标在其对应的正文短语之后。
lexical_decisions:
- source_word: שְׁאַל מִמֶּנִּי
  choice: 你向我求
  rationale: שְׁאַל是阳性单数祈使式，מִמֶּנִּי指出请求的对象；“向我求”在现代汉语中自然、庄重，也保留直接命令的语气。
- source_word: וְאֶתְּנָה
  choice: 我就把……赐给你
  rationale: נתן的鼓励式接在祈使句之后，在此表达应允和承诺；“就……赐给你”清楚呈现请求与赐予之间的关系。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 指众民族或众国家；“列国”简洁庄重，并避免用“外邦人”引入后来的族群或宗教对照。
- source_word: נַחֲלָתֶךָ
  choice: 作产业
  rationale: נַחֲלָה指所承受或分得的恒久产业；“作产业”准确表达表语关系，也符合王室宣告的语境。
- source_word: וַאֲחֻזָּתְךָ
  choice: 作属地
  rationale: אֲחֻזָּה指占有之地或所属的产业；“属地”与王权语境相合，并与前句“产业”形成有区别的平行表达。
- source_word: אַפְסֵי אָרֶץ
  choice: 地极
  rationale: 该词组指大地最远的边界或尽头；“地极”是准确、凝练而为现代读者熟悉的表达。
theological_decisions:
- issue: 这项应许的君王性与弥赛亚性范围
  choice: 按原文直译为上帝对受话者赐下普世疆域的应许，不在正文中明说受话者的最终身份。
  alternative: 在正文中明确称受话者为弥赛亚或基督。
  rationale: 本节希伯来文本直接向诗中的“你”应许列国与地极；正典中的弥赛亚解读虽重要，却不应借增词提前消除原文在历史君王与弥赛亚应验之间的解释张力。
translation_notes:
  register: 采用现代、庄重而简洁的标准普通话。“列国—地极”和“产业—属地”保留原诗的平行结构；不使用过度古雅的虚词，也不加入特定宗派解释。
