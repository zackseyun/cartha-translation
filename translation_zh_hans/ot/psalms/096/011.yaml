  text: יִשְׂמְח֣וּ הַ֭/שָּׁמַיִם וְ/תָגֵ֣ל הָ/אָ֑רֶץ יִֽרְעַ֥ם הַ֝/יָּ֗ם וּ/מְלֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/011.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; let the sea thunder, and all that fills it.
translation:
  language: zh_hans
  text: 愿诸天欢喜，愿大地欢腾；愿海洋及其中的一切轰鸣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轰鸣”或译“发出雷鸣”。
    reason: רעם可指雷鸣，也可指宏大、雷霆般的轰响；用于海洋时，“轰鸣”较合现代汉语，同时保留其强烈声响的意象。
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: 愿……欢喜
  rationale: שׂמח的Qal未完成式在本诗歌劝颂语境中带有祈愿、呼吁意味；用“愿”表达其意愿式功能，而不处理为单纯将来时。
- source_word: הַשָּׁמַיִם
  choice: 诸天
  rationale: 该复数形式可指天空或诸天；“诸天”既保留复数和宇宙性的范围，也符合庄重的诗歌语体。
- source_word: וְתָגֵל
  choice: 愿……欢腾
  rationale: גיל表达欣喜、欢跃；“欢腾”与前句“欢喜”平行而不重复，并保留较强的喜乐动态。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 在诸天—大地—海洋的宇宙性并列中，指全地而非某一地区；“大地”自然地体现这一范围。
- source_word: יִרְעַם
  choice: 发出雷鸣
  rationale: רעם表示打雷、轰响；“发出雷鸣”保留海洋被拟人化、以宏大声响参与颂赞的诗意，也保留其雷霆意象。
- source_word: הַיָּם
  choice: 海洋
  rationale: ים在此指宇宙图景中的海；“海洋”是现代汉语中自然且范围宽广的表达。
- source_word: וּמְלֹאוֹ
  choice: 和充满其中的一切
  rationale: 字面为“和它的丰满／所充满的”，是指海中所容纳的一切；此译既传达希伯来语的“充满”意象，也让现代读者容易理解。
theological_decisions:
- issue: 诗歌中未完成式的意愿语气
  choice: 将一连串动词译为劝愿式：“愿诸天……愿大地……愿海洋……”
  alternative: 将其译为预告性的将来时：“诸天必……大地必……海洋必……”
  rationale: 本诗上下文是在召唤受造界颂赞；这些平行动词在此更自然地具有祈愿、号召功能。采用“愿”不额外加入神学解释，也没有消除诗歌本身的拟人张力。
- issue: 海洋及其中万物作为发声主体
  choice: 保留“海洋和充满其中的一切”共同发出宏大声响的拟人图景
  alternative: 只让海洋发声，并把“其中的一切”弱化为地点说明
  rationale: וּמְלֹאוֹ与“海”并列，诗句把海及其所充满的一切一同纳入受造界的欢呼；中文因此保留共同参与的表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“诸天—大地—海洋”保持原文的宇宙性层次；以“欢喜／欢腾”呈现近义平行，以“发出雷鸣”保留原文强烈的听觉意象。
