  text: יַעֲלֹ֣ז שָׂ֭דַי וְ/כָל אֲשֶׁר בּ֑/וֹ אָ֥ז יְ֝רַנְּנ֗וּ כָּל עֲצֵי יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/012.yaml
  text: Let the field exult[a], and all that is in it; then all the trees of the forest will sing for joy.
translation:
  language: zh_hans
  text: 愿田野欢腾，其中的一切也都欢腾；那时，林中所有的树木都要欢呼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都要欢唱”。原文动词可指发出响亮的喜乐呼声，也可按诗歌语境理解为欢唱。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֹז
  choice: 愿……欢腾
  rationale: 该未完成式在诗歌平行结构中表达愿望或呼召；“愿……欢腾”既保留意愿语气，也传达强烈喜乐之意。
- source_word: שָׂדַי
  choice: 田野
  rationale: 原文虽为单数，在此具有集合意义；“田野”自然凝练，并适合受造界拟人化的诗歌意象。
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: 其中的一切也都欢腾
  rationale: 原文直指田野中的一切；中文补出承前省略的“欢腾”，使并列呼召清楚自然，“也都”体现 וְ 与 כָל 的总体意义。
- source_word: אָז
  choice: 那时
  rationale: 标示诗意推进或随后的响应；“那时”比单用“于是”更少强加因果关系。
- source_word: יְרַנְּנוּ
  choice: 都要欢呼
  rationale: 该 Piel 形式表示发出响亮的喜乐呼声。“欢呼”直接保留其语义，并不把树木的声音限定为歌唱。
- source_word: כָּל עֲצֵי יָעַר
  choice: 林中所有的树木
  rationale: 自然对应整个结构，保留 כָל 的周全范围和整座森林一同响应的意象。
theological_decisions:
- issue: 受造界以赞美回应的拟人化
  choice: 直接保留田野及树木欢腾、欢呼的诗歌拟人手法
  alternative: 将其解释性改写为自然景象使人喜乐，或自然显出繁盛
  rationale: 原诗明确让非人的受造界参与喜乐的响应；直译此意象可保留其神学广度，同时不额外规定这是字面事件还是诗性描写。
- issue: אָז 所表达的关系
  choice: 译作“那时”，保留时间推进而不明确断定因果
  alternative: 译作“于是”，强调前后因果或结果
  rationale: אָז 可以推进诗歌场景，但本节本身不足以要求严格因果关系；“那时”保留原文张力。
translation_notes:
  register: 采用现代、庄重而清楚的诗歌语言。“愿”保留呼召或愿望语气；前半句补出“欢腾”以符合自然中文并显明省略关系。全句保留受造界的拟人化，不作解释性淡化。
