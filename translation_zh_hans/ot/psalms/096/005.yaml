  text: כִּ֤י כָּל אֱלֹהֵ֣י הָ/עַמִּ֣ים אֱלִילִ֑ים וַֽ֝/יהוָ֗ה שָׁמַ֥יִם עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/005.yaml
  text: For all the gods of the peoples are idols[c][b][a], but Yahweh made the heavens.
translation:
  language: zh_hans
  text: 因为列邦[a]的神全是偶像[b]，但雅威[c]造了诸天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“众民”或“列邦”；也可译作“各民族”或“列国”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“毫无价值的偶像”。这个希伯来词可带有“虚无”或“毫无价值”的贬斥意味。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文是 YHWH（יהוה），传统上也译作“耶和华”或“上主”。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明为何当把荣耀归给雅威；“因为”在现代汉语中自然地表达理由。
- source_word: כָּל
  choice: 全是
  rationale: 保留该量词涵盖无遗的力量，同时与汉语判断句自然结合。
- source_word: אֱלֹהֵי הָעַמִּים
  choice: 万民的神
  rationale: 直译为各族群所敬奉的诸神；“万民”兼具诗意和集合意义。
- source_word: אֱלִילִים
  choice: 偶像
  rationale: 准确表达所指对象，同时不把该词所含“虚无、无价值”的贬义直接扩写进正文。
- source_word: וַיהוָה
  choice: 但雅威
  rationale: 连词在此形成强烈对比，译作“但”；神名יהוה按其专名译作“雅威”。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 保留希伯来语的复数形式和诗歌语体，也自然表达受造的天宇。
- source_word: עָשָׂה
  choice: 造了
  rationale: 对应一般性的“做、制造”，在创造天地的语境中，“造”简洁自然，又不将其强化为更专门的术语。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；正文采用“雅威”，保留其作为以色列之神专名的性质。
- issue: אֱלִילִים 的论战色彩
  choice: 正文译“偶像”，脚注说明可含“虚无、毫无价值”之意
  alternative: 毫无价值的偶像；虚无之物
  rationale: 原词既指偶像，也带贬斥意味。正文采用清楚而不过度解释的译法，脚注保留其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“万民”与“诸天”保留诗篇的凝练和宏阔感；“全是……但……”清楚呈现原文中偶像与创造主之间的强烈对比。
