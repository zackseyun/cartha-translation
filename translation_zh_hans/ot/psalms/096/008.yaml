  text: הָב֣וּ לַ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ שְׂאֽוּ מִ֝נְחָ֗ה וּ/בֹ֥אוּ לְ/חַצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/008.yaml
  text: Ascribe to Yahweh the glory of his name[a]; bring an offering and come into his courts.
translation:
  language: zh_hans
  text: 要把他名所当得的荣耀归给雅威；要带上供物[a]，进入他的院宇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“礼物”或“贡礼”。希伯来语 מִנְחָה 可按语境指礼物、贡礼或献给神的供物。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: 归给
  rationale: 该命令式在诗歌呼召中不是说雅威缺少什么，而是要求敬拜者承认并归给他当得的荣耀；“归给”既保留“给”的意象，也符合现代汉语表达。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 按原文直接保留神的专名 יהוה，以“雅威”音译，不以称号替代。
- source_word: כְּבוֹד שְׁמוֹ
  choice: 他名的荣耀
  rationale: 贴近原文的属格结构，保留“名”所承载的身份、声誉与启示性内涵，而不增译为“他名所当得的荣耀”。
- source_word: שְׂאוּ
  choice: 带上
  rationale: נשׂא 本义为拿起、携带；与供物连用时指把供物带来。“带上”自然地保留了携带并前来的动作。
- source_word: מִנְחָה
  choice: 供物
  rationale: 该词可指礼物、贡礼或献给神的供物；本节敬拜语境中“供物”最为宽泛稳妥，不限定为素祭。
- source_word: וּבֹאוּ לְחַצְרוֹתָיו
  choice: 进入他的院宇
  rationale: חֲצֵרוֹת 指圣所的院落；“院宇”具有庄重的敬拜语域，“进入”清楚表达朝向并进入其中的动作。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，音译“雅威”保留其专名性质，避免以称号替换。
- issue: כְּבוֹד שְׁמוֹ 的关系
  choice: 他名的荣耀
  alternative: 他名所当得的荣耀
  rationale: 原文只说“他名的荣耀”，未明说“所当得的”；正文保留较紧凑且可能多义的结构，不在翻译中补足解释。
- issue: מִנְחָה 的祭祀含义
  choice: 供物
  alternative: 礼物；贡礼；素祭
  rationale: 语境明显涉及敬拜，但该词本身语义范围较宽；采用“供物”而以脚注保留其他可能，避免过度限定祭物种类。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌命令语气。两个“要”再现并列命令；“归给”“供物”“院宇”适合公共诵读及敬拜语境，同时避免过于古奥。
