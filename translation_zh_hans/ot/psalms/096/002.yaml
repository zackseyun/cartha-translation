id: PSA.96.2
reference: Psalms 96:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁ֣ירוּ לַ֭/יהוָה בָּרֲכ֣וּ שְׁמ֑/וֹ בַּשְּׂר֥וּ מִ/יּֽוֹם לְ֝/י֗וֹם יְשׁוּעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/002.yaml
  text: Sing to Yahweh[a]; bless his name; proclaim his salvation from day to day.
translation:
  language: zh_hans
  text: 你们要向雅威歌唱，称颂他的名；日复一日传扬他的救恩。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “传扬他的救恩”也可译作“传报他救恩的好消息”。
    reason: 保留בשר常含“宣告好消息”的词义色彩。
lexical_decisions:
- source_word: שִׁירוּ
  choice: 歌唱
  rationale: 这是שׁיר的复数命令式，直接呼召众人歌唱；不补入原文没有明说的“赞美”等宾语。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל在此标明歌唱的对象；用“雅威”音译יהוה，保留经文中的神圣名字。
- source_word: בָּרֲכוּ
  choice: 称颂
  rationale: 这是ברך的复数命令式。“称颂他的名”既符合现代汉语中的敬拜语境，也保留了它与前一句“歌唱”之间的词义区别；直译“祝福他的名”在现代汉语中容易产生误解。
- source_word: שְׁמוֹ
  choice: 他的名
  rationale: 按原文保留“名”的表达，兼含其所彰显的身份、名声与品格，不在正文中展开解释。
- source_word: בַּשְּׂרוּ
  choice: 传扬
  rationale: 这是בשר的复数命令式，指公开传报，并常带有宣告好消息的意味。“传扬”在正文中简洁自然，其“传报好消息”的语义由脚注保留。
- source_word: מִיּוֹם לְיוֹם
  choice: 日复一日
  rationale: 这一表达表示持续、逐日反复发生；“日复一日”既贴近原文结构，又是自然庄重的现代汉语。
- source_word: יְשׁוּעָתוֹ
  choice: 他的救恩
  rationale: יְשׁוּעָה可指拯救、解救或胜利。“救恩”在此敬拜语境中范围较广，并保留所属代词“他的”，不限定为某一次具体解救。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。正文采用“雅威”作为其音译，以保留专名性质，而不以称号替代；其他汉语传统译法虽常见，但不用于本节正文。
- issue: יְשׁוּעָתוֹ所指的拯救范围
  choice: 他的救恩
  alternative: 他的拯救；他的胜利
  rationale: 本节没有把拯救限定为属灵、政治或军事层面，因此采用含义较宽的“救恩”，保留诗句的神学张力与适用范围。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语言。三个复数命令依次译为“歌唱、称颂、传扬”，保留原诗的排比与推进；分号对应诗句内部的节奏转换。
