base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/007.yaml
  text: Ascribe to Yahweh[a], families of the peoples[c][b], ascribe to Yahweh glory and strength.
translation:
  language: zh_hans
  text: 万民中的各族[b]啊，要把荣耀和能力归给雅威[a]；要把荣耀和能力归给雅威！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自上帝的专名 יהוה（YHWH）；也常音译作“耶和华”。犹太诵读传统通常以“主”代读此名；一些中文译本相应采用“上主”等称号。
    reason: alternative_reading
  - marker: b
    text: “万民中的各族”也可译作“列国的各宗族”或“万民的各宗族”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: 要归给
  rationale: 该复数命令式字面意为“要给”，在敬拜语境中指承认并归给上帝所当得的荣耀。译作“要归给”既保留原文的动作意象，也避免暗示人能为上帝增添本来没有的荣耀或能力。首个命令在原文中没有明说宾语，译文也保留这种诗性省略。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 介词 לְ 标明动作所指向的对象；יהוה 是上帝的专名，音译为“雅威”，以区别于称号“主”。
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: 万民的各族
  rationale: מִשְׁפָּחוֹת 指家族、宗族或族群，עַמִּים 是复数“众民、万民”。“万民的各族”保留两个词的群体性和复数层次，同时符合现代汉语诗歌式呼语。
- source_word: כָּבוֹד
  choice: 荣耀
  rationale: 在敬拜语境中指上帝当受承认和颂扬的尊荣；“荣耀”是庄重、自然且贴合诗篇用语的译法。
- source_word: וָעֹז
  choice: 和能力
  rationale: עֹז 可指力量、能力或威力；“能力”与“荣耀”并列自然，也表达对上帝大能的承认。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用较能反映学界通常复原读音的“雅威”，并以脚注说明中文传统音译及以称号替代的译法，不把任何一种汉语传统等同于唯一确定的古代发音。
- issue: הָבוּ 是否表示人把某种本来没有的东西给予上帝
  choice: 译作“归给”，理解为承认上帝本有且当得的荣耀和能力
  alternative: 直译“给”或译作“献给”
  rationale: 敬拜语境与宾语“荣耀和能力”表明，这里主要是呼召万民公开承认并颂扬上帝的属性；“归给”保留原文“给”的表达，又不消解其修辞张力。
translation_notes:
  register: 采用现代、庄重的诗歌语体。“万民的各族啊”保留原文呼语的群体层次；首句“要归给”按原文保留宾语省略，第二分句再明确“荣耀和能力”，形成递进和平行。分号呈现两个重复命令之间的诗行关系，句末感叹号体现敬拜呼召的力度。
