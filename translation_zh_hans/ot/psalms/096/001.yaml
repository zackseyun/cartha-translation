  yaml_path: translation/ot/psalms/096/001.yaml
  text: Sing to Yahweh a new song; sing to Yahweh[a], all the earth.
translation:
  language: zh_hans
  text: 你们要向雅威唱一首新歌；全地的人哪，都要向雅威歌唱[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（上帝的专名）；这里音译为“雅威”。传统汉语译本常译作“耶和华”，也常以“主”这一称号代称。
    reason: 说明上帝专名的原文形式，以及音译和传统代称的不同译法。
lexical_decisions:
- source_word: שִׁירוּ
  choice: 要……唱／要……歌唱
  rationale: 这是动词 שׁיר 的阳性复数祈使式，直接呼吁众人歌唱。用“要……唱”既自然，也保留命令和劝召的语气；不增添原文没有明说的“赞美”。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 ל 表明歌唱所朝向的对象；“向”符合现代汉语表达。יהוה 是上帝的专名，音译为“雅威”，不以称号代替。
- source_word: שִׁיר חָדָשׁ
  choice: 一首新歌
  rationale: שִׁיר 意为“歌”，חָדָשׁ 意为“新的”。汉语量词“一首”使表达自然，并未改变原意。
- source_word: כָּל הָאָרֶץ
  choice: 全地啊
  rationale: כָּל הָאָרֶץ 在本诗的普世敬拜语境中指全地，而非某一片土地。加语气词“啊”清楚呈现其作为呼语的功能。
theological_decisions:
- issue: 上帝专名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 יהוה。正文采用“雅威”，以音译保留这一专名；脚注说明汉语传统译法和代称，避免把专名与称号混同。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要向……唱”与“全地啊”保留希伯来诗句的祈使语气、平行结构和普世呼召；分号呈现两小句紧密相连的关系，叹号传达劝召的力度。
