id: PSA.96.13
reference: Psalms 96:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לִ/פְנֵ֤י יְהוָ֨ה כִּ֬י בָ֗א כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בֶּ/אֱמוּנָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/013.yaml
  text: before Yahweh[a], for he is coming, for he is coming to judge the earth. He will judge the world with righteousness[c][b], and the peoples with his faithfulness.
translation:
  language: zh_hans
  text: 在耶和华面前，因为他来了，他来了[a]，要审判全地。他必按公义审判世界，按他的信实[c]审判万民[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他要来，他要来。”原文重复“来”这个动词，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: “万民”也可译作“列国”。
    reason: lexical_alternative
  - marker: c
    text: “信实”也可译作“真实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 这是介词与“面”构成的常见表达，既可表示空间上的“在……面前”，也可表示处于某者临在之中；此处保留其简洁而庄重的诗歌表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名音译，以区别于“主”这一称号，并表明原文使用的是上帝的专名。
- source_word: כִּי בָא ... כִּי בָא
  choice: 因为他来了，他来了
  rationale: 原文两次使用完成式“来”，在诗歌语境中生动宣告其来临的确定性与迫近性；保留重复，不将强调效果合并。
- source_word: לִשְׁפֹּט
  choice: 要审判
  rationale: שׁפט也可含治理之意，但下文以公义和信实说明其行动，译作“审判”最直接地保留司法和道德含义。
- source_word: הָאָרֶץ
  choice: 全地
  rationale: 与下句“世界”平行，所指范围是普世性的，不限于某一片土地；“全地”自然体现这一范围。
- source_word: יִשְׁפֹּט
  choice: 他必……审判
  rationale: 未完成式承接上文来临的宣告，表示随后确定将发生的行动；“必”体现其将来性和确定性。
- source_word: תֵּבֵל
  choice: 世界
  rationale: 该词常指有人居住、秩序井然的世界；中文“世界”简明自然，并与“全地”形成诗歌平行。
- source_word: בְּצֶדֶק
  choice: 按公义
  rationale: 介词ב在此表示审判所依循的准则或方式；“按公义”比直译“以公义”更符合现代汉语，同时保留צֶדֶק的道德正直含义。
- source_word: וְעַמִּים
  choice: 万民
  rationale: 复数עַמִּים指众多人民群体；“万民”是自然、庄重的中文诗体表达，并体现普世范围。
- source_word: בֶּאֱמוּנָתוֹ
  choice: 按他的信实
  rationale: אֱמוּנָה表达坚定、可靠、忠实；“信实”强调上帝审判可靠且忠于其本性，同时保留“真实”这一可能译法于脚注。
theological_decisions:
- issue: 诗歌语境中上帝审判的性质
  choice: 保留“审判”，不弱化为单纯的“治理”，也不扩展为完整的末世审判教义。
  alternative: 译作“治理”，突出君王统治的层面。
  rationale: 本节明确宣告耶和华来审判全地，但没有进一步界定审判的全部时间和教义细节；译文应保留经文本身的普世性与庄严张力。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”是现代中文读者普遍识别的专名形式，可明确反映原文使用神的专名，而非一般称号；不借此加入关于发音或宗派惯例的额外主张。
- issue: 完成式בָא的时间表达
  choice: 译为“来了”，以完成式呈现确定而迫近的来临。
  alternative: 译为“要来”或“正在来”。
  rationale: 上下文指向即将发生的审判，而原文却用完成式生动宣告；中文“来了”能保留这种仿佛已经临到的确定感，脚注同时说明其他自然理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留原文“他来了，他来了”的诗歌重复，并使两个平行分句都明确带出“审判”，以符合中文表达。起首“在耶和华面前”承接上一节，保留本节在原诗中的句法连续性。
