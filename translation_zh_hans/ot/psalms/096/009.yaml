  yaml_path: translation/ot/psalms/096/009.yaml
  text: Worship Yahweh in the splendor of holiness; tremble before him[a], all the earth.
translation:
  language: zh_hans
  text: 你们要在圣洁的荣美中[a]敬拜雅威；全地都要在他面前战兢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在圣洁的荣美中”或译“穿着圣洁的装束”或“在圣洁的华美中”。希伯来语短语既可指圣洁所具有的荣美，也可指敬拜时的神圣装饰或装束。
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁתַּחֲווּ
  choice: 敬拜
  rationale: 该动词本义是俯伏、下拜，在这里表达向神俯伏敬拜；“敬拜”在现代汉语中自然，也保留宗教语境。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 直接音译四字神名 יְהוָה，以保留经文所用的专名。
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: 在圣洁的荣美中
  rationale: הֲדָר可指荣美、华美或装饰；此译保留它与“圣洁”结合时的诗意及开放性，不在正文中限定为礼服。
- source_word: חִילוּ
  choice: 战兢
  rationale: 该动词可表示颤抖、震动或因敬畏而不安；“战兢”适合神临在的语境，并比单纯“惧怕”更贴近身体颤动的意象。
- source_word: מִפָּנָיו
  choice: 在他面前
  rationale: 字面涉及“他的面／临在”；“在他面前”既符合现代汉语，也保留面对神临在的含义。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: 本诗向万民发出普世性的呼召，因此译作“全地”比局部性的“全境”更合适。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；正文采用音译“雅威”，不以称号替代专名。
- issue: בְּהַדְרַת קֹדֶשׁ 的理解
  choice: 在圣洁的荣美中
  alternative: 穿着圣洁的礼服／在圣洁的华美中
  rationale: 该短语既可描述圣洁本身的荣美，也可能指敬拜时的神圣装束。正文采用较宽广的诗性表达，脚注保留装束读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“敬拜”传达俯伏尊崇的宗教含义；“战兢”保留诗歌中面对神临在而颤抖的强烈意象。脚注标记置于全句末，所注释的是前半句的歧义短语。
