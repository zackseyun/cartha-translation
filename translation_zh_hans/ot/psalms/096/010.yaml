language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִמְר֤וּ בַ/גּוֹיִ֨ם יְה֘וָ֤ה מָלָ֗ךְ אַף תִּכּ֣וֹן תֵּ֭בֵל בַּל תִּמּ֑וֹט יָדִ֥ין עַ֝מִּ֗ים בְּ/מֵישָׁרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/010.yaml
  text: Say among the nations[a], “Yahweh reigns! Indeed, the world is established; it shall not be moved[c][b]. He will judge the peoples with equity.”
translation:
  language: zh_hans
  text: 你们要在列国中宣告：“雅威作王[a]！的确，世界[b]坚立，绝不动摇；他必按公正[c]审判万民。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“雅威是王”或“雅威已经作王”。希伯来语既可理解为宣告他现今掌权，也可能带有登基、开始作王的意味。
    reason: alternative_reading
  - marker: b
    text: 也可译作“有人居住的世界”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“以正直”或“以公平”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: 宣告
  rationale: 这是复数命令式；结合“在列国中”的公开场景，“宣告”比单纯的“说”更自然地表达公开传扬，同时不额外增强为正式诏令。
- source_word: בַגּוֹיִם
  choice: 在列国中
  rationale: 介词 בְּ 在此表示宣告所处的范围；“列国”保留 גּוֹיִם 的国际性，也与后文“万民”形成词汇区别。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其专名性质，而不以“主”这一称号替代。
- source_word: מָלָךְ
  choice: 作王了
  rationale: 此完成式用于王权宣告，可表达当前作王，也可能带有登基或开始作王的意味；正文采用有宣告力度的“作王了”，并以脚注保留其他理解。
- source_word: אַף
  choice: 的确
  rationale: 表达承接并加强语气的作用，不把雅威作王与世界稳固之间明确改写为因果关系。
- source_word: תִּכּוֹן
  choice: 坚立
  rationale: 保留 כון 的被确立、稳固之意；汉语诗体中“坚立”简洁而庄重。
- source_word: תֵּבֵל
  choice: 世界
  rationale: 该词常指有居民、秩序井然的世界；正文用自然简洁的“世界”，脚注说明较具体的词义。
- source_word: בַּל תִּמּוֹט
  choice: 绝不动摇
  rationale: בַּל 是诗体否定词，מוֹט 表示失去稳固、摇动；“绝不动摇”兼顾强调语气和诗歌节奏。
- source_word: יָדִין
  choice: 他必……审判
  rationale: דין 可指审判或治理；在王权及公正的语境中，“审判”直接保留司法含义，“必”体现未完成式在此的确定将来意味。
- source_word: עַמִּים
  choice: 万民
  rationale: 表达复数群体的普世范围，并以自然汉语呈现；同时避免与前文 גּוֹיִם 的“列国”完全同词。
- source_word: בְּמֵישָׁרִים
  choice: 按公正
  rationale: מֵישָׁרִים 可表示正直、公平、公正；“按公正”切合审判语境，又不限定为现代法律术语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文以“雅威”音译，保留神的专名，不以称号替换；“耶和华”是传统汉语音译，但较不贴近通常重建的读音。
- issue: 王权宣告 מָלָךְ 的时态与体貌
  choice: 雅威作王了
  alternative: 雅威是王；雅威掌权作王；雅威已经作王
  rationale: 希伯来语完成式在此既可作为对当前王权的宣告，也可读出登基或开始作王的色彩。正文保留宣告式张力，并在脚注列明主要读法，不断言神的王权始于某一时刻。
- issue: 世界稳固与神作王之间的逻辑关系
  choice: 以“的确”承接
  alternative: 所以世界坚立；世界也坚立
  rationale: אַף 具有强调、确认或递进作用，但并不明确标示因果。采用“的确”避免把隐含关联强化为明说的因果命题。
- issue: יָדִין 的审判与治理含义
  choice: 审判
  alternative: 治理
  rationale: 神的王权可包含治理与裁判；由于 בְּמֵישָׁרִים 强调公正，正文采用“审判”，但不否认该动词在君王语境中的治理内涵。
translation_notes:
  register: 采用现代、庄重而易懂的汉语诗歌语体。“列国—万民”保留原文 גּוֹיִם—עַמִּים 的词汇变化；分号呈现王权宣告、世界稳固与公正审判之间紧密但未被明确规定为因果的关系。所有脚注标记均置于正文对应词语之后。
