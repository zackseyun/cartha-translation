  text: כִּ֥י גָ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד נוֹרָ֥א ה֝֗וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/004.yaml
  text: For Yahweh is great and greatly to be praised[c][b][a]; he is to be feared above all gods.
translation:
  language: zh_hans
  text: 因为雅威伟大，当受极大的赞美[a]；他比一切神明[c]更可畏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“极其受赞美。”希伯来文较直译为“极其受赞美”；正文用“当受极大的赞美”按汉语习惯表达其在颂赞语境中的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“令人敬畏”或“威严可畏”。希伯来文表示他使人产生畏惧和崇敬；“可畏”保留了这层较强的意味。
    reason: lexical_alternative
  - marker: c
    text: “一切神明”可指列国所敬奉的神明；下一节说明它们都是虚无之物。
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出前文呼召人敬拜雅威的理由；“因为”自然保留了解释和论证作用。
- source_word: גָדוֹל
  choice: 伟大
  rationale: 表达雅威在地位和威严上的崇高；“伟大”在现代汉语赞美语境中自然，也不把词义缩限为能力强大。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其专名性质，而不以称号代替。
- source_word: וּמְהֻלָּל מְאֹד
  choice: 极其配受赞美
  rationale: מְהֻלָּל是“受赞美”的被动分词，מְאֹד加强程度；汉语用“极其配受赞美”自然表达应当大大赞美他的含义，同时脚注保留较直译的可能。
- source_word: נוֹרָא
  choice: 令人敬畏
  rationale: 该词表示使人产生畏惧与崇敬；“令人敬畏”兼顾敬拜语境中的敬畏和原文较强的畏惧意味。
- source_word: הוּא
  choice: 他
  rationale: 保留希伯来文明确出现的第三人称代词，并使后半句在汉语中顺畅。
- source_word: עַל כָּל אֱלֹהִים
  choice: 比万神更
  rationale: עַל在这里表达超越或优越；比较结构自然呈现“高过一切神”的意思，并保留אֱלֹהִים的直接词义“神”，不预先改译为“偶像”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其作为以色列上帝专名的性质，避免用“主”这一称号取代专名。
- issue: 本节אֱלֹהִים的所指
  choice: 万神
  alternative: 一切神明；一切偶像；众属灵存在
  rationale: 本节原文直接说“神”；下节才明确称万民的神为虚无之物。因此正文保留原文的措辞和论争张力，不在本节先行解释为“偶像”。
- issue: נוֹרָא所表达的敬畏
  choice: 令人敬畏
  alternative: 可畏；威严可畏；当受敬畏
  rationale: 此词可表示使人畏惧、可畏，也适用于对上帝的崇敬。选择“令人敬畏”既不弱化成泛泛的“令人惊叹”，也不把它单纯处理为恐怖。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。前半句以“极其配受赞美”避免生硬的被动结构；后半句用比较句式自然表达雅威超越万神，同时保留“万神”一词及其语境中的神学张力。
