base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/006.yaml
  text: Splendor and majesty are before him[a]; strength and beauty are in his sanctuary.
translation:
  language: zh_hans
  text: 尊荣和威严在他面前；力量和荣美[a]在他的圣所中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣美”也可译作“荣耀”、“华美”或“光辉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: 尊荣
  rationale: 该词表示庄严显赫、尊贵荣耀；“尊荣”自然凝练，并与下文“威严”形成近义并列而不完全重合。
- source_word: הָדָר
  choice: 威严
  rationale: 该词可指威荣、庄严或华美；在与 הוֹד 的诗歌搭配中，“威严”突显王者般崇高庄重的意味。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 直译这一空间兼临在性的表达，不将其解释性地改写为“在他的同在中”。
- source_word: עֹז
  choice: 能力
  rationale: 该词指力量、能力或大能；“能力”在现代汉语中清楚自然，也与“荣美”构成庄重的诗歌对句。
- source_word: תִפְאֶרֶת
  choice: 荣美
  rationale: 该词兼有美丽、荣华、荣耀和光彩之义；“荣美”保留其审美与荣耀两方面的语义，也避免简单重复前半句。
- source_word: בְּמִקְדָּשׁוֹ
  choice: 在他的圣所中
  rationale: מִקְדָּשׁ 泛指分别为圣之处或圣所；“圣所”保留神圣空间的广度，不将其过度具体化为“圣殿”。
theological_decisions:
- issue: 第三人称代词所指
  choice: 保留“他／他的”，按诗篇上下文指向耶和华
  alternative: 将代词明说为“耶和华／耶和华的”
  rationale: 本节虽未重述神名，但上下文清楚以耶和华为所指；保留代词更忠实于希伯来诗歌的衔接与节奏。
- issue: תִפְאֶרֶת 的语义侧重
  choice: 译作“荣美”，同时保留荣耀与美丽的张力
  alternative: 译作“荣耀”“华美”或“光辉”
  rationale: 原词语义宽广，不宜只限定为纯粹视觉之美或抽象荣耀；“荣美”能较好涵盖两者。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体；两组近义词保持平行：“尊荣和威严／能力和荣美”。脚注标记置于整节末尾，说明 תִפְאֶרֶת 的真实词义幅度。
