  text: סַפְּר֣וּ בַ/גּוֹיִ֣ם כְּבוֹד֑/וֹ בְּ/כָל הָֽ֝/עַמִּ֗ים נִפְלְאוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/003.yaml
  text: Declare his glory among the nations[a], his wondrous deeds among all the peoples.
translation:
  language: zh_hans
  text: 要在列国中述说他的荣耀，在万民中述说他的奇妙作为。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  choice: 述说
  rationale: 此词是ספר的皮耶勒命令式复数，要求公开讲述、传扬；“述说”既保留反复讲明其作为的意味，也符合诗歌中庄重的劝勉语气。
- source_word: בַגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם在本诗普世赞美的语境中指众国家、众民族；“列国”简洁庄重，并避免引入后期“外邦人”的宗教性含义。介词ב译为“在……中”，体现于各国之中宣讲。
- source_word: כְּבוֹדוֹ
  choice: 他的荣耀
  rationale: כָּבוֹד含尊荣、威荣、荣光等义；赞美语境中“荣耀”自然且能表达其厚重的尊荣含义。
- source_word: בְּכָל הָעַמִּים
  choice: 在万民中
  rationale: עַמִּים与前半句גּוֹיִם形成近义平行；译作“万民”既与“列国”有所区分，也保留כָל所强调的全面范围。
- source_word: נִפְלְאוֹתָיו
  choice: 他的奇妙作为
  rationale: 该词源于פלא，指令人惊叹的非凡之事或作为；“奇妙作为”同时表达其惊奇性质和行动层面。
theological_decisions:
- issue: 宣告对象的普世范围
  choice: 经文命令人在列国和万民中述说他的荣耀与奇妙作为。
  alternative: 将所指范围较窄地理解为主要限于以色列周边国家。
  rationale: גּוֹיִם与כָּל הָעַמִּים并列，尤其“万民”鲜明强调广泛范围；译文保留这一普世向度，但不加入本节未明说的后期宣教术语。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“列国／万民”和两次“述说”保留希伯来文的平行结构与普世范围；本节无需脚注，因为“奇妙作为”已自然涵盖נִפְלְאוֹתָיו的核心语义。
