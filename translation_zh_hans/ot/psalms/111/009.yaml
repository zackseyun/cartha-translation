  text: פְּד֤וּת שָׁ֘לַ֤ח לְ/עַמּ֗/וֹ צִוָּֽה לְ/עוֹלָ֥ם בְּרִית֑/וֹ קָד֖וֹשׁ וְ/נוֹרָ֣א שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/009.yaml
  text: He sent redemption to his people[a]; he has commanded his covenant forever[b]. Holy and awesome is his name.
translation:
  language: zh_hans
  text: 他向他的子民赐下救赎；他命定他的约永远长存[a]。他的名圣洁而可畏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “命定”所译的希伯来语通常意为“吩咐、命令”；本句也可较直译为“他吩咐他的约直到永远”。
    reason: lexical_alternative
  - marker: b
    text: 或译“令人敬畏”。原文兼有使人肃然敬畏和心生畏惧的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּת
  choice: 救赎
  rationale: 该名词表示借着代价或介入而实现的释放；“救赎”既保留诗篇中的神学分量，也涵盖解救、赎回等语义。
- source_word: שָׁלַח
  choice: 赐下
  rationale: 该动词本义为“差遣、送出”。汉语若直译为“发送救赎”不自然；“赐下”保留救赎由上帝主动送达其子民的意象。
- source_word: לְעַמּוֹ
  choice: 向自己的子民
  rationale: 介词 לְ 在此标示接受者或方向；“向自己的子民”自然表达救赎所临到的对象。
- source_word: צִוָּה
  choice: 命定
  rationale: 该动词通常意为“吩咐、命令”，也可表达权威性的指定。与“约”搭配时，“命定”比“吩咐自己的约”更符合现代汉语，同时保留上帝权威颁定的意味。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 该词表示无定限、持续久远；结合“约”，“永远长存”自然表达其持久效力。
- source_word: בְּרִיתוֹ
  choice: 自己的约
  rationale: “约”是 בְּרִית 在圣经语境中的标准对应词，保留其关系性及承诺性的含义。反身形式使汉语指代清楚。
- source_word: קָדוֹשׁ
  choice: 圣洁
  rationale: 用于上帝之名时，“圣洁”准确表达其神圣、分别为圣的属性，也是庄重而通行的现代汉语。
- source_word: וְנוֹרָא
  choice: 可畏
  rationale: 该词描述令人敬畏、使人心生畏惧者。“可畏”比口语化的“令人惊叹”更能保留敬虔畏惧与威严并存的含义。
- source_word: שְׁמוֹ
  choice: 他的名
  rationale: 保留希伯来诗歌中的“名”，指向上帝所显明的品格与声誉，而不将其解释性改写。
theological_decisions:
- issue: צִוָּה 与“他的约”的搭配
  choice: 他命定自己的约永远长存
  alternative: 他吩咐自己的约直到永远
  rationale: 原文动词具有“命令”的明确词汇力量，但逐字译成汉语会显得语义关系不清。“命定”传达上帝以权威颁定其约；脚注保留更贴近字面的表达，避免把含义完全收窄为“建立”。
- issue: וְנוֹרָא 对上帝之名的描述
  choice: 可畏
  alternative: 令人敬畏
  rationale: “可畏”保留原文既有敬畏又有惧怕的张力，不把它弱化为一般的赞叹；脚注说明其语义范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“赐下救赎”避免生硬的逐字表达，同时保留上帝主动将救赎送达子民的图像；“可畏”维持诗歌赞颂中的威严和敬虔畏惧。全句保持三个平行陈述的简洁节奏。
