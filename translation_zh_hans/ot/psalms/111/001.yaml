base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/001.yaml
  text: Praise Yah! I will give thanks to Yahweh with my whole heart[b][a], in the council of the upright and in the congregation.
translation:
  language: zh_hans
  text: '你们要赞美雅！[a]


    我要全心称谢耶和华，


    在正直人的议会中，也在会众中。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“哈利路亚”或“你们要赞美耶和华”。原文作“赞美雅”；“雅”是神名的短式。
    reason: lexical_alternative
  - marker: b
    text: “议会”也可译作“亲密圈子”或“集会”。原词可指议事群体、亲密圈子或聚集的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: 你们要赞美雅！
  rationale: 复数祈使式 הַלְלוּ 加神名短式 יָהּ，构成开篇的呼召。“赞美雅”既直接传达原意，也保留它与本节后文 יְהוָה 的形式区别。
- source_word: אוֹדֶה
  choice: 我要称谢
  rationale: ידה 的 Hiphil 形式在诗篇敬拜语境中常指感恩称谢；未完成式在此表达诗人的决意或誓愿。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是神的专名；采用现代中文读者熟悉的音译“耶和华”，并与前面的短式“雅”相区别。
- source_word: בְּכָל לֵבָב
  choice: 全心
  rationale: 表达内心毫无保留、专一投入；“全心”自然简洁，并保留整体性的含义。
- source_word: בְּסוֹד
  choice: 在……密友会中
  rationale: סוֹד 可指亲密圈子、议事群体或聚集；“密友会”突出其亲密群体的意味，也与后面的 עֵדָה 区分。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 指在品格和行事上正直的人；“正直人”直接、自然。
- source_word: וְעֵדָה
  choice: 也在会众里
  rationale: עֵדָה 指聚集的共同体或会众；“会众”符合公开敬拜的语境，并与 סוֹד 所指的较亲密群体保持区别。
theological_decisions:
- issue: 同一节中 יָהּ 与 יְהוָה 的译法
  choice: 分别译作“雅”和“耶和华”
  alternative: 两者都译作“主”；或将 הַלְלוּ יָהּ 音译为“哈利路亚”
  rationale: 原文有意使用神名的短式与完整形式。分别译出可保留这一文本特征，避免把二者无声合并；脚注同时提供传统音译和意译。
- issue: סוֹד 与 עֵדָה 的关系
  choice: 译作两个相联而有区别的群体：“密友会”与“会众”
  alternative: 将二者都理解并译作“集会”
  rationale: 两个近义词并列，可能指正直人的亲密圈子和更公开的会众，也可能是平行指称同一聚集。正文保留词汇区别，不把两者强行等同。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以分行呈现呼召、个人称谢和敬拜场合；“密友会”保留 סוֹד 的亲密群体色彩，“会众”则表达 עֵדָה 的公共共同体含义。
