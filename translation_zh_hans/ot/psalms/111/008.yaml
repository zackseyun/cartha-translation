  text: סְמוּכִ֣ים לָ/עַ֣ד לְ/עוֹלָ֑ם עֲ֝שׂוּיִ֗ם בֶּ/אֱמֶ֥ת וְ/יָשָֽׁר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/008.yaml
  text: They are established forever and ever[b][a], done in truth and uprightness.
translation:
  language: zh_hans
  text: 它们永永远远坚立[a]，是以真实[b]和正直成就的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“永永远远受到扶持”；希伯来语分词可着重表示受到支撑或被使之稳固。
    reason: lexical_alternative
  - marker: b
    text: “真实”也可译作“信实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: סְמוּכִים
  choice: 坚立
  rationale: 该词是 סמך 的被动分词，表示受到支撑、被使之稳固；“坚立”既保留被确立而稳固的含义，也自然表达上文所指训词的恒久可靠。
- source_word: לָעַד לְעוֹלָם
  choice: 永永远远
  rationale: 两个表示长久持续的词语连用，强化永久性；“永永远远”保留这种叠加强调，并符合中文诗歌语体。
- source_word: עֲשׂוּיִם
  choice: 制定的
  rationale: עשה 的被动分词基本义为“被做成、被施行”。因本节承接第7节的“训词”，译作“制定的”能自然说明这些训词如何被确立，同时保留被动意味。
- source_word: בֶּאֱמֶת
  choice: 在真实中
  rationale: אֱמֶת 可指真实、可靠或信实；正文采用“真实”，保留其核心语义，并以脚注注明“信实”这一同样可能的含义。
- source_word: וְיָשָׁר
  choice: 和正直中
  rationale: יָשָׁר 为“正直、正当”的形容词；在此与前面的介词短语 בֶּאֱמֶת 并列，中文用“在真实和正直中”表达二者共同构成制定这些训词的品格与准则。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“永永远远”保留原文双重时间表达的强调；句法承接上文复数的“训词”，故以“它们”为主语。
