  text: זֵ֣כֶר עָ֭שָׂה לְ/נִפְלְאֹתָ֑י/ו חַנּ֖וּן וְ/רַח֣וּם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/004.yaml
  text: He has caused his wondrous works to be remembered[a]; Yahweh is gracious and compassionate.
translation:
  language: zh_hans
  text: 他使他奇妙的作为被记念[a]；雅威有恩惠，有怜悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他为他奇妙的作为设立了纪念。”
    reason: זֵכֶר可指“记念”或“纪念物”；此处可按动词性结果理解为“使……被记念”，也可按较具体的名词性意义理解为“设立纪念”。
lexical_decisions:
- source_word: זֵכֶר עָשָׂה
  choice: 使……被人铭记
  rationale: זֵכֶר意为“记念、纪念物”，与עָשָׂה连用可表达使某事长久为人记念。译作“使……被人铭记”在现代汉语中自然，并保留其功效性含义。
- source_word: לְנִפְלְאֹתָיו
  choice: 自己奇妙的作为
  rationale: נִפְלָאוֹת在此指上帝施行的非凡作为，而不只是抽象的“奇事”；“奇妙的作为”兼顾具体行动和诗歌语体。
- source_word: חַנּוּן
  choice: 有恩典
  rationale: 该词描述施恩、厚待人的性情；“有恩典”保留传统神学用语，同时普通读者也容易理解。
- source_word: וְרַחוּם
  choice: 有怜悯
  rationale: רַחוּם强调怜恤、同情；与“有恩典”并列，可保留两个形容词之间相近而不完全相同的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中最广为人知的神名音译，以神名而非称号来对应四字神名。
theological_decisions:
- issue: 动词עָשָׂה的主语
  choice: 以“他”指向本节末尾所称的耶和华
  alternative: 采用非人称表达：“他的奇妙作为有了纪念”
  rationale: 希伯来文动词为阳性单数，主语在前半句未明说，末尾的יְהוָה自然可回指为其主语；中文以“他”呈现这种衔接，但不额外引入身份解释。
- issue: זֵכֶר עָשָׂה所指的行动
  choice: 使奇妙作为被人铭记
  alternative: 为奇妙作为设立纪念
  rationale: 原文可指造成持久的记念，也可较具体地理解为设立纪念。正文采用较自然且语义宽广的功效性表达，脚注保留具体的“纪念”读法。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文正文保留专名，并采用普通现代中文读者最熟悉的传统音译；不以“主”替代。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“被人铭记”明示隐含的人类记念者，使中文通顺；分号保留两小句的诗行关系。“有恩典，有怜悯”维持原文两个并列神性形容词的简洁节奏。
