revisions:
- from: 他使自己奇妙的作为被人铭记[a]；耶和华有恩典，有怜悯。
  to: 他使他奇妙的作为被记念[a]；雅威有恩惠，有怜悯。
  rationale: 修订仅处理神名与汉语指代：以“雅威”对应 Yahweh，并以“他奇妙的作为”避免原文未有的反身强调。正文保留原文的诗性简洁、隐含的记念者以及两个并列的神性形容词；脚注继续保存可成立的“设立纪念”译法。
