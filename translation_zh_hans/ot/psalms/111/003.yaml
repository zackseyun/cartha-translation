  text: הוֹד וְ/הָדָ֥ר פָּֽעֳל֑/וֹ וְ֝/צִדְקָת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/003.yaml
  text: Splendor and majesty are his work[a], and his righteousness stands forever.
translation:
  language: zh_hans
  text: 他的作为满有尊荣和威严；他的公义[a]永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的正义永远长存。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: 尊荣
  rationale: 该词表示荣耀、尊贵或光辉；与הָדָר并列时译作“尊荣”，既保留诗歌的崇高语气，也不与后一词合并。
- source_word: הָדָר
  choice: 威严
  rationale: 该词可指庄严、华美或尊贵；在此与הוֹד构成近义并列，“威严”自然地表达庄重宏伟之感。
- source_word: פָּעֳלוֹ
  choice: 他的作为
  rationale: פֹּעַל可指工作、行动或所做之事；单数在这里具有集合意义，“作为”适合概括上帝所行的一切。
- source_word: צִדְקָתוֹ
  choice: 他的公义
  rationale: 该词涵盖合乎正直标准的“公义”，并可依语境侧重公平施行的“正义”；正文采用语义范围较广、符合颂赞语境的“公义”。
- source_word: עֹמֶדֶת
  choice: 长存
  rationale: 该分词字面为“站立”，在此表达持续、存留；现代汉语用“长存”更自然，同时保留恒久不变的含义。
- source_word: לָעַד
  choice: 永远
  rationale: 该短语表示永久、直到永远；“永远”清楚而自然。
theological_decisions:
- issue: צִדְקָתוֹ描述上帝及其作为时应译为“公义”还是“正义”
  choice: 他的公义
  alternative: 他的正义
  rationale: 此处是在总体颂赞上帝的作为及其恒久的正直属性，并未明确聚焦司法审判，因此正文采用范围较广的“公义”；“正义”仍是原词在此可能包含的合法侧重，列入脚注以保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。首句将希伯来语名词句自然处理为“他的作为尊荣而威严”，保留הוֹד与הָדָר的并列，同时避免生硬的“尊荣和威严是他的作为”。分号呈现两个平行分句。
