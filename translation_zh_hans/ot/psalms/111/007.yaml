id: PSA.111.7
reference: Psalms 111:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַעֲשֵׂ֣י יָ֭דָי/ו אֱמֶ֣ת וּ/מִשְׁפָּ֑ט נֶ֝אֱמָנִ֗ים כָּל פִּקּוּדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/007.yaml
  text: The works of his hands are truth and justice[b][a]; all his precepts are trustworthy.
translation:
  language: zh_hans
  text: 他手所做的都真实、公正；他的一切训令都可靠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲשֵׂי יָדָיו
  choice: 他手所做的
  rationale: 保留“手”的诗歌意象，表达上帝亲自施行的作为；用“所做的”比生硬的“手的工作”更符合现代汉语。
- source_word: אֱמֶת
  choice: 真实
  rationale: 此处作名词性表语，描述上帝作为的性质；“真实”保留真确、可信的语义，同时避免与后半句“可靠”完全重合。
- source_word: וּמִשְׁפָּט
  choice: 公正
  rationale: מִשְׁפָּט在这里与אֱמֶת并列，指合乎正义、公平的性质；“公正”在现代汉语中自然清楚。
- source_word: נֶאֱמָנִים
  choice: 可靠
  rationale: 该词描述上帝训令坚定可信、可倚赖；“可靠”简洁表达其谓语意义。
- source_word: כָּל
  choice: 一切
  rationale: 完整保留原文的全称范围。
- source_word: פִּקּוּדָיו
  choice: 他的训令
  rationale: 该词指上帝所规定、交付遵行的命令或指示；“训令”保留其规范性与权威性，又较“律例”少添特定体裁色彩。
theological_decisions:
- issue: אֱמֶת应译为“真实”还是“信实”
  choice: 真实
  alternative: 信实
  rationale: 原文以אֱמֶת和מִשְׁפָּט两个名词并列刻画上帝的作为。“真实、公正”较贴近其形式与诗歌平衡；后半句נֶאֱמָנִים已明确表达可靠性，因此不将两处合并为同一概念。
- issue: פִּקּוּדָיו应采用特定规范性词语还是泛称
  choice: 他的训令
  alternative: 他的指示
  rationale: “训令”比“指示”更能保存该希伯来词所含的规定、托付与应当遵行之意，但不额外限定为某一种法典类别。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前半句保留“他手”的具象表达，并以“真实、公正”呈现两个并列性质；后半句措辞简洁，保持希伯来诗句的平衡。
