  text: 耶和华的作为伟大；凡喜爱这些作为的人，都探究它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּדֹלִים
  choice: 伟大
  rationale: 保留复数谓语所表达的总体赞叹；中文以“伟大”自然修饰“作为”。
- source_word: מַעֲשֵׂי יְהוָה
  choice: 耶和华的作为
  rationale: “作为”涵盖上帝所行之事；以“耶和华”对应神名 יהוה，清楚区别于一般称号“主”。
- source_word: דְּרוּשִׁים
  choice: 悉心探究
  rationale: 该被动分词源于 דרש，有寻求、查考、探究之意；这里按中文习惯转为主动表达，并用“悉心”体现持续、用心考察的意味。
- source_word: לְכָל חֶפְצֵיהֶם
  choice: 凡以此为乐的人
  rationale: חפץ 可指喜爱、乐于；代词所指最自然地回指耶和华的作为。“凡……的人”准确表达 לְכָל 的普遍范围。
theological_decisions:
- issue: יהוה 的译法
  choice: 耶和华
  alternative: 上主／主
  rationale: 原文使用以色列上帝的专名而非称号；正文音译可保存这一词汇区别，不额外引入宗派性解释。
- issue: דְּרוּשִׁים 所表达的行动
  choice: 悉心探究
  alternative: 寻求／查考
  rationale: 上下文赞美耶和华的作为，原词容许“寻求”与“研究”两层意味；“探究”在现代汉语中兼顾认真查考和深入寻索，且不把经文限制为纯学术研究。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。语序先宣告耶和华作为的伟大，再描写喜爱这些作为之人的回应；不添加原文没有的解释性限定。
