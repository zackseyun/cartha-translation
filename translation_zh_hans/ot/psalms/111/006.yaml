source:
  edition: WLC
  text: כֹּ֣חַ מַ֭עֲשָׂי/ו הִגִּ֣יד לְ/עַמּ֑/וֹ לָ/תֵ֥ת לָ֝/הֶ֗ם נַחֲלַ֥ת גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/006.yaml
  text: He has declared to his people the power of his works[a], in giving them the inheritance of the nations.
translation:
  language: zh_hans
  text: 他向自己的子民显明他作为的大能[a]，把列国的产业赐给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他向自己的子民显明他作为的大能，为要把列国的产业赐给他们。”希伯来语的不定式既可表示手段或结果，也可表示目的。
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּחַ
  choice: 大能
  rationale: 该词表示力量、能力或威力；“大能”既符合诗歌的庄重语体，也自然表达上帝借其作为彰显的能力。
- source_word: מַעֲשָׂיו
  choice: 他的作为
  rationale: מַעֲשֶׂה可指工作、行为或所行之事；“作为”在现代中文中庄重而自然，并与本诗赞美上帝所行之事的语境相合。
- source_word: הִגִּיד
  choice: 显明
  rationale: נגד的使役形可表示告知、宣告或使人知道；结合下句，上帝藉历史行动使其子民认识他作为的大能，因此译作“显明”，同时不把表达局限为口头宣告。
- source_word: לְעַמּוֹ
  choice: 向自己的子民
  rationale: 介词ל在此标示间接受词；“向”准确表达对象关系，“自己的子民”清楚保留第三人称所属关系。
- source_word: לָתֵת
  choice: 把……赐给
  rationale: 带ל的不定式可表达目的、结果或手段。正文采用与手段或结果相容的连接方式，但不添加明确的“借着”，以免过度消除原文歧义。
- source_word: לָהֶם
  choice: 给他们
  rationale: 所指回到前面的“自己的子民”，在中文中明确保留。
- source_word: נַחֲלַת
  choice: 产业
  rationale: נַחֲלָה表示继承所得、分得之地或产业；此处涉及列国之地成为以色列所得的份，“产业”简洁且符合土地承受的语境。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 指以色列以外的各国及其土地；“列国”符合诗歌语体，也避免“外邦人”可能带来的新约化联想。
theological_decisions:
- issue: 末尾不定式短语לָתֵת לָהֶם נַחֲלַת גּוֹיִם与主句的关系
  choice: 正文按手段或结果理解：上帝把列国的产业赐给子民，从而显明他作为的大能
  alternative: 目的理解：上帝向子民显明他作为的大能，为要把列国的产业赐给他们
  rationale: 希伯来语带ל的不定式可表达目的、结果或手段。上下文回顾上帝在历史中的大作为，赐地本身很可能就是其大能的彰显；正文以并列承接保留这种理解，脚注则明确交代目的读法，以保存真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“子民”“大能”“作为”“列国”保留赞美诗的正式感；句法尽量简洁。正文中的[a]与脚注对应。
