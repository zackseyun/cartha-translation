id: PSA.111.10
reference: Psalms 111:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רֵ֘אשִׁ֤ית חָכְמָ֨ה יִרְאַ֬ת יְהוָ֗ה שֵׂ֣כֶל ט֭וֹב לְ/כָל עֹשֵׂי/הֶ֑ם תְּ֝הִלָּת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/010.yaml
  text: The fear of Yahweh is the beginning of wisdom[a]; good understanding belongs to all who practice it[c][b]. His praise stands forever.
translation:
  language: zh_hans
  text: 敬畏耶和华是智慧的开端；凡遵行这些的，都有良好的悟性[a]。他的赞美永远长存[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“凡实行它们的，都有良好的悟性”；“它们”所指没有明说，可能是本诗上文提到的耶和华的训词，也可能泛指敬畏他所包含的实践。
    reason: 保留原文复数代词及其未明说先行词的歧义。
  - marker: b
    text: “他的赞美”也可理解为“他的美名”或“他当受的赞美”；“永远长存”直译为“站立到永远”。
    reason: 说明 תְּהִלָּתוֹ 的语义范围和希伯来语动词意象。
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: 智慧的开端
  rationale: רֵאשִׁית 在此表示起点或奠基性的开端；“开端”既自然，也不把含义限缩为纯粹的时间先后或“最重要部分”。”
- source_word: יִרְאַת יְהוָה
  choice: 敬畏耶和华
  rationale: “敬畏”保留 יִרְאָה 所含的畏惧、敬重与崇敬，不弱化为单纯的“尊敬”；“耶和华”采用现代中文圣经读者熟悉的神名形式。
- source_word: שֵׂכֶל טוֹב
  choice: 良好的悟性
  rationale: שֵׂכֶל 指明辨、领悟或健全的判断力；“良好的悟性”保留认知与实践两方面的含义，并对应 טוֹב 的评价意味。
- source_word: לְכָל עֹשֵׂיהֶם
  choice: 凡遵行这些的，都有
  rationale: 原文为复数“凡实行它们的”，但本节没有明说其复数对象。“这些”保留这种复数和一定程度的含蓄，可能回指诗中上文所述耶和华的训词，也可能泛指敬畏他所体现的遵行。中文补出“都有”，使省略系词的希伯来语句式自然通顺。
- source_word: תְּהִלָּתוֹ עֹמֶדֶת לָעַד
  choice: 他的赞美永远长存
  rationale: “他的赞美”保留 תְּהִלָּתוֹ 既可指归给他的赞美，也可指他的美名或可赞颂之处的张力；“永远长存”自然表达 עֹמֶדֶת לָעַד 所指的永久持续。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用普通读者最熟悉、且明确作为专名的“耶和华”，不以“主”替代神名。
- issue: יִרְאָה 是否弱化为单纯的崇敬
  choice: 敬畏
  alternative: 尊崇
  rationale: 智慧文学中的固定表达不只是尊敬，也含对神的畏惧和肃然敬重；“敬畏”较完整地保留其神学分量。
- issue: עֹשֵׂיהֶם 的隐含对象
  choice: 保留复数含蓄，译作“遵行这些”
  alternative: 解释为“践行敬畏之道”
  rationale: 希伯来语使用阳性复数后缀，却没有在本节明示先行词。正文不把它强行限定为单数的“敬畏”或某一组具体命令。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“智慧的开端”“敬畏”“永远长存”延续中文智慧文学的熟悉语体；对原文难解的复数宾语不在正文中擅自消解，而以“这些”和脚注保留其开放性。
