  text: טֶ֭רֶף נָתַ֣ן לִֽ/ירֵאָ֑י/ו יִזְכֹּ֖ר לְ/עוֹלָ֣ם בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/005.yaml
  text: He has given food to those who fear him[a]; he will remember his covenant forever.
translation:
  language: zh_hans
  text: 他赐给敬畏他的人食物[a]；他必永远记念他的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”或译“猎物”；希伯来语这个词可指捕获的猎物或由此所得的食物，此处大概泛指食物或供应。
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶף
  choice: 食物
  rationale: 该词可指“猎物”或由捕猎所得的食物；本节述说上帝恩待敬畏他的人，译作“食物”最自然，也保留了具体的供应含义。另以脚注注明“猎物”这一词义。
- source_word: נָתַן
  choice: 赐
  rationale: 希伯来语完成式表示已经成就的行动；中文诗歌语境中“赐”可自然概括上帝已经施行并显明的供应，且符合庄重语体。
- source_word: לִירֵאָיו
  choice: 给敬畏他的人
  rationale: 分词指以敬畏上帝为特征的人。“敬畏”兼具畏惧与尊崇的分量，比单译“尊敬”更完整。
- source_word: יִזְכֹּר
  choice: 必记念
  rationale: 未完成式结合“永远”可表达面向未来的确定性。“必”传达此处陈述性的将来意义；“记念”保留圣经中上帝按其约采取行动的惯用表达，而不直接释义为“遵守”。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 这是现代汉语中表达持续无尽最自然、庄重的说法，适合盟约语境。
- source_word: בְּרִיתוֹ
  choice: 他的约
  rationale: “约”是希伯来语 בְּרִית 在圣经盟约语境中的标准译法，既简洁又保留其关系与承诺的神学内涵。
theological_decisions:
- issue: 上帝“记念”其约的含义
  choice: 译作“他必永远记念他的约”，保留“记念”的圣经惯用语，含有按约施行的意味
  alternative: 译作“他永远信守他的约”或“他永远记得他的约”
  rationale: 原文用“记念”而非直接用“遵守”或“信守”；直译可保留上帝记念与实际行动之间的经文张力，也避免使其仅成为心理上的回想。
- issue: יִזְכֹּר 的时态或体貌
  choice: 以“必”表达确定的未来陈述
  alternative: 译作“永远记念”，理解为恒常或格言式现在
  rationale: 未完成式与“永远”连用，既可涉及持续性，也具有前瞻意味；正文采用确定的未来表达，但不增添时间副词以外的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赐”体现上帝施予的语境；“敬畏”“记念”“约”保留重要的圣经用语。句式简洁，并以分号呈现原文两分句的诗性并列。
