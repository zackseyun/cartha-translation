  text: סָמ֣וּךְ לִ֭בּ/וֹ לֹ֣א יִירָ֑א עַ֖ד אֲשֶׁר יִרְאֶ֣ה בְ/צָרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/008.yaml
  text: His heart is steadfast[b][a]; he will not fear until he looks on his adversaries.
translation:
  language: zh_hans
  text: 他心坚定，必不惧怕，直到他看见敌对他的人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“直到他看见敌对他的人。”在这类诗篇语境中，“看见”也可指亲眼见证敌对者的结局；原文没有明说该结局的具体性质或观看者的情绪。
    reason: 说明原文时间结构及语境可能含义，同时不把隐含结果写入正文。
  - marker: b
    text: “敌对他的人”也可译作“他的仇敌”。希伯来语 צַר 可指敌手、对手或怀有敌意的人。
    reason: 说明词义范围及常见译法。
lexical_decisions:
- source_word: סָמוּךְ
  choice: 坚定
  rationale: 该词是 סמך 的被动分词，表示被扶持而稳固、坚定；用于“心”时，“坚定”自然地表达内在的稳定。
- source_word: לִבּוֹ
  choice: 他心
  rationale: לֵב 指人的内在，包括思想、意志和情感；诗歌语境中译作“心”既简洁又保留其宽广含义。
- source_word: לֹא יִירָא
  choice: 毫不惧怕
  rationale: 未完成式在此可表达持续或将来的状态；“毫不惧怕”与前句的坚定相称，又不限定为单一时点。
- source_word: עַד אֲשֶׁר
  choice: 终必
  rationale: 原短语通常表示“直到”，但本句并非说见到敌对者后便开始害怕，而是指坚定无惧一直持续到最终亲见结局；“终必”在中文中表达这一时间上的终点而避免反向误解，并以脚注保留直译。
- source_word: יִרְאֶה בְצָרָיו
  choice: 看见敌对他之人的下场
  rationale: ראה 加 בְ 和敌对者作宾语，在此诗篇的伸冤语境中可指亲眼看到敌手受挫的结局。“下场”将希伯来语在语境中隐含的结果表达出来，但不加入“得意”或“报复”等心理描写。
theological_decisions:
- issue: 义人观看敌对者的含义
  choice: 译为看见敌对者的“下场”
  alternative: 看着敌对他的人／胜利地看着敌人
  rationale: 上下文表达坚定持续到伸冤实现，而非鼓励幸灾乐祸。“下场”说明结果性含义，同时避免把“胜利”或满足感等原文未明说的态度写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。“他心坚定”保持希伯来诗句的凝练；分号呈现两部分的推进关系。“终必”避免中文读者误以为他的无惧只维持到见敌之时，同时通过脚注交代原文较直的“直到”结构。
