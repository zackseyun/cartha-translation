id: PSA.112.1
reference: Psalms 112:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ אַשְׁרֵי אִ֭ישׁ יָרֵ֣א אֶת יְהוָ֑ה בְּ֝/מִצְוֺתָ֗י/ו חָפֵ֥ץ מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/001.yaml
  text: Praise Yah! Blessed is the man who fears Yahweh[b][a], who greatly delights in his commandments.
translation:
  language: zh_hans
  text: '你们要赞美雅！[a]

    敬畏雅威、极其喜爱他诫命的人[b]有福了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按传统音译为“哈利路亚！”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“那人”，使用阳性单数形式；在这则智慧格言中泛指这样的人。
    reason: cultural_note
lexical_decisions:
- source_word: הַ֥לְלוּ יָ֨הּ
  choice: 你们要赞美雅
  rationale: הַלְלוּ是复数命令式，译作“你们要赞美”；יָהּ是神名的短式，音译为“雅”，既保留其独特形式，也不把它与完整形式יְהוָה混同。
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是智慧文学常见的福乐宣告，表达一种值得羡慕的蒙福景况；“有福了”兼顾庄重、自然和诗篇语体。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来文为阳性单数，但在这则智慧格言中具有代表性和泛指作用。现代汉语“人”自然保留单数代表性，不必强加男性限定；脚注说明原文形式。
- source_word: יָרֵא אֶת יְהוָה
  choice: 敬畏雅威
  rationale: “敬畏”兼有惧怕、敬重与肃然尊崇之意，保留智慧文学中的神学张力；יְהוָה按其专名译作“雅威”。
- source_word: בְּמִצְוֺתָיו
  choice: 喜爱他的诫命
  rationale: 介词ב在חפץ的搭配中标示喜爱的对象；“诫命”保留מִצְוֺת的正式分量，代词“他”指雅威。
- source_word: חָפֵץ מְאֹד
  choice: 极其喜爱
  rationale: חָפֵץ表示以某事为喜悦、乐意于某事，מְאֹד加强程度；“极其喜爱”在现代汉语中简洁自然，并保留强烈语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常重建的读音，并明确将其作为专名呈现，而不是以称号替代。
- issue: 短式神名יָהּ与完整神名יְהוָה的区别
  choice: 分别译作“雅”和“雅威”
  alternative: 两者均译作“耶和华”
  rationale: 本节同时出现短式יָהּ和完整形式יְהוָה，分别处理能够保留原文有意呈现的形态差别。
- issue: 泛指用法的阳性单数אִישׁ
  choice: 人
  alternative: 男子
  rationale: 原文语法形式是阳性单数，但智慧格言中的功能是代表性泛指。译作“人”避免让现代读者误以为福乐宣告只针对男性，同时以脚注交代原文形式。
- issue: יָרֵא的语义张力
  choice: 敬畏
  alternative: 尊敬
  rationale: “敬畏”不把该词弱化为一般尊重，而能同时传达面对神的畏惧、崇敬与顺服。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。首句保留复数呼吁和短式神名；第二句按汉语信息结构将条件性描述置于“有福了”之前。标点和分行体现赞美呼吁与福乐宣告的两部分结构。
