  text: גִּבּ֣וֹר בָּ֭/אָרֶץ יִהְיֶ֣ה זַרְע֑/וֹ דּ֭וֹר יְשָׁרִ֣ים יְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/002.yaml
  text: His offspring will be mighty in the land[b][a]; the generation of the upright will be blessed.
translation:
  language: zh_hans
  text: 他的后裔[b]必在这地强盛[a]；正直人的世代必蒙福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在全地上”。希伯来语 אֶרֶץ 既可指某一片“地、土地”，也可指“全地”。
    reason: lexical_alternative
  - marker: b
    text: “后裔”在希伯来语中是集合名词，也可译作“子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹר
  choice: 强盛
  rationale: 此处作表语，描述后裔有力量、有地位或兴旺，并不特指“勇士”。“强盛”既保留宽广语义，也符合诗歌的庄重语气。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: אֶרֶץ 可指特定的“地、土地”，也可泛指“全地、世上”。定冠词支持“这地”的表达，而脚注保留其更广泛的可能含义。
- source_word: יִהְיֶה
  choice: 必……
  rationale: 未完成式在祝福与智慧诗语境中表达将来的结果或确信；“必”简洁自然，并传达肯定语气。
- source_word: זַרְעוֹ
  choice: 他的后裔
  rationale: זֶרַע 在此为集合名词，指一个人的子孙后代。“后裔”自然庄重，且避免将其误解为字面的“种子”。
- source_word: דּוֹר
  choice: 世代
  rationale: 与 יְשָׁרִים 构成属格关系，可指正直者所属或延续的世代；“世代”保留这种概括性。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: יָשָׁר 强调道德上的正直，译作“正直人”可与诗篇中常见的“义人”用词保持词义区别。
- source_word: יְבֹרָךְ
  choice: 必蒙福
  rationale: 该词是 ברך 的被动式，明确表达领受祝福。“蒙福”保留神圣恩惠的语域，不把意义缩减为物质兴旺。
theological_decisions:
- issue: 智慧诗中“强盛”与“蒙福”的范围
  choice: 按原文保留概括而肯定的祝福陈述，不限定为纯物质繁荣，也不解释为后代必然得救。
  alternative: 将其仅理解为今世物质兴旺，或理解为每一位后代都必然获得救恩。
  rationale: 原文以智慧与祝福语言概括正直人的后裔，却没有界定祝福的具体形式或作出个体救恩的明确保证；译文应保留这一宽度与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“强盛”比“勇猛”更能避免无根据的军事含义；分号保留希伯来诗句两分句之间的平行结构。
