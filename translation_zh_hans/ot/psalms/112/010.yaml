source:
  edition: WLC
  text: רָ֘שָׁ֤ע יִרְאֶ֨ה וְ/כָעָ֗ס שִׁנָּ֣י/ו יַחֲרֹ֣ק וְ/נָמָ֑ס תַּאֲוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/010.yaml
  text: The wicked man will see and be angry[a]; he will gnash his teeth and melt away; the desire of the wicked will perish.
translation:
  language: zh_hans
  text: 恶人看见，就恼怒[a]；他咬牙切齿，消融；恶人的愿望终必消亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文这里用单数“恶人”，具有代表性；也可按泛指译作“恶人看见，就恼怒”。
    reason: 说明原文阳性单数的代表性用法，并保留汉语泛指表达；汉语“恶人”本身可泛指一类人，无须使用不够自然的“恶人们”。
lexical_decisions:
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词是阳性单数的名词化形容词，指一个具有代表性的恶人。正文用“恶人”，并以“他”体现单数；脚注说明其代表性用法。
- source_word: יִרְאֶה
  choice: 看见
  rationale: ראה的Qal未完成式第三人称阳性单数；在本诗的结果性语境中指恶人将看见前文所述义人的福分与尊荣。
- source_word: וְכָעָס
  choice: 就恼怒
  rationale: כעס表达因所见而恼怒、烦恼或受刺激；“就恼怒”自然呈现诗句中的先后与反应关系，又不将其弱化为一般忧愁。
- source_word: שִׁנָּיו יַחֲרֹק
  choice: 他咬牙切齿
  rationale: 直译意象为磨牙，是愤怒与挫败的惯用表达；“咬牙切齿”在现代汉语中准确而有力度。
- source_word: וְנָמָס
  choice: 消融而去
  rationale: 该词传达融化、消解或衰残的形象；“消融而去”保留诗歌隐喻，并表达最终归于消失，不把它具体化为某一种死亡方式。
- source_word: תַּאֲוַת
  choice: 愿望
  rationale: 该词可指愿望、欲求或贪求；“愿望”保持语义宽度，使上下文界定这是恶人的企图和所求。
- source_word: רְשָׁעִים
  choice: 恶人们
  rationale: 原文为复数，与本节开头具有代表性的单数形成可见区别；用“恶人们”保留这一数的转换。
- source_word: תֹּאבֵד
  choice: 必灭亡
  rationale: אבד表示灭亡、消失或彻底落空；“必灭亡”保留其庄重力度，并与阴性单数主语“愿望”相合。
theological_decisions:
- issue: 单数“恶人”的代表性及性别表达
  choice: 正文译作“恶人”，随后用“他”体现原文阳性单数，并以脚注说明其具有代表性
  alternative: 泛指译作“恶人们看见，就恼怒”
  rationale: 原文开头是阳性单数，但其作用是代表一类恶人，并非断言只有男性如此。正文保留语法形态，脚注同时防止把代表性单数误解为只指某一个人或仅指男性。
- issue: 恶人“消融”的性质
  choice: 保留“消融而去”的诗歌隐喻
  alternative: 译作“渐渐衰残”或“消逝”
  rationale: 原文没有明确说明这是身体衰败、心理崩溃还是最终灭亡；保留融化、消解的意象，可避免加入原文未明说的具体解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分号保留三组递进画面：“看见而恼怒—咬牙并消融—愿望灭亡”。“咬牙切齿”使用通行成语呈现原文意象；“消融而去”则保留较鲜明的诗性隐喻。
