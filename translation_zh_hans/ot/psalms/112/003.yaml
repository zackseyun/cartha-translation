  text: הוֹן וָ/עֹ֥שֶׁר בְּ/בֵית֑/וֹ וְ֝/צִדְקָת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/003.yaml
  text: Wealth and riches are in his house[a], and his righteousness stands forever.
translation:
  language: zh_hans
  text: 他家中有财宝和财富；他的公义[a]永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的公正永远长存。”
    reason: צְדָקָה兼有“公义、正直”和“公正、正义”的语义范围；正文采用较宽的“公义”，脚注保留另一可行侧重。
lexical_decisions:
- source_word: הוֹן
  choice: 财宝
  rationale: 该词指物质财富、财物或产业。“财宝”保留具体的财物意象，并与后面的“财富”构成希伯来诗歌中的近义并列。
- source_word: וָעֹשֶׁר
  choice: 和财富
  rationale: עֹשֶׁר常指财富、富足或丰盛。译作“财富”既自然，也保留它与הוֹן两个相近而不完全相同的名词。
- source_word: בְּבֵיתוֹ
  choice: 他家中有
  rationale: בַּיִת既可指房屋，也可延伸指家室或家庭领域。这里采用“家中”，保留具体表达，同时容纳较广的家庭范围。
- source_word: וְצִדְקָתוֹ
  choice: 他的公义
  rationale: צְדָקָה可指公义、公正或正直。“公义”保留其较宽的道德含义，不把此处限定为单一层面的司法公正；“公正”作为可行译法列入脚注。
- source_word: עֹמֶדֶת
  choice: 长存
  rationale: 该分词字面有“站立、保持”的意思；汉语以“长存”自然表达其稳固、持续的比喻意义。
- source_word: לָעַד
  choice: 永远
  rationale: 该词表达持续不止、恒久存在；“永远”是现代汉语中自然且庄重的对应表达。
theological_decisions:
- issue: 物质福分语境中“他的公义”的所指
  choice: 保留直陈的所有格“他的公义”，首先指这位敬畏耶和华之人的正直、公正及其持久果效。
  alternative: 也可能侧重“他的公正”，或在更宽意义上涉及他蒙上帝确认的义。
  rationale: 本诗的直接对象是蒙福的义人，原文并未明说后来的系统神学范畴。因此译文不加入“归算之义”等技术性解释，也不排除“公正”的词义色彩。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分号对应两个平行分句；“财宝和财富”有意保留原文近义名词的并列，不将其完全合并。脚注标记置于其实际说明的“公义”之后。
