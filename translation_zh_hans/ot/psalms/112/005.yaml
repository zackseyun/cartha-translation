  text: טֽוֹב אִ֭ישׁ חוֹנֵ֣ן וּ/מַלְוֶ֑ה יְכַלְכֵּ֖ל דְּבָרָ֣י/ו בְּ/מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/005.yaml
  text: Good is the man who is gracious and lends[a]; he conducts his affairs with justice.
translation:
  language: zh_hans
  text: 恩待人、借钱给人的人是有福的；他秉公处理自己的事务[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他以公正处理自己的言语。”希伯来语דְּבָרָיו可指“事务”或“言语”；在借贷和公正行事的上下文中，译为“事务”较为自然。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 是有福的
  rationale: 此处形容词置于句首作表语，表示这样的人处境美好、值得称许。译为“是有福的”较自然地传达近似福言的语气，又不把它单纯缩减为道德评价“是好人”。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来文为阳性单数，但在这里泛指具有所述品格的人。现代汉语用“人”即可保留代表性单数，无须添加原文没有强调的性别信息。
- source_word: חוֹנֵן
  choice: 恩待人
  rationale: 该分词表示向人施恩、施惠。“恩待人”保留恩惠之意，也避免“慷慨”把词义局限于金钱。
- source_word: וּמַלְוֶה
  choice: 借钱给人
  rationale: 使役词形在此意为借出、放贷。结合上下文，译作“借钱给人”是清楚自然的现代汉语，且不额外暗示利息或商业放贷。
- source_word: יְכַלְכֵּל
  choice: 处理
  rationale: 该动词在此与“事务”和“公正”连用，表示安排、管理或办理。“处理”简洁自然，并能涵盖日常事务的治理。
- source_word: דְּבָרָיו
  choice: 自己的事务
  rationale: דבר可指言语，也可指事情、事务。借贷和公正行事的语境更支持“事务”，但另一词义保留在脚注中。
- source_word: בְּמִשְׁפָּט
  choice: 秉公
  rationale: 该短语表达依照公正、正义而行。“秉公”在现代汉语中凝练地保留其伦理和裁判色彩。
theological_decisions:
- issue: טוֹב的福言色彩与道德评价
  choice: 译为“是有福的”
  alternative: 译为“是好的”或“有福乐”
  rationale: “是好的”在汉语中容易只被理解为品德评断；“是有福的”更能表达此人蒙受美好境遇、值得称许的综合含义，同时没有增加具体的应许内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“恩待人”保留原文施恩的宽广含义；“借钱给人”直陈经济行为；分号呈现原文两小句之间紧密而平衡的关系。
