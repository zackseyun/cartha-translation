base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/004.yaml
  text: Light dawns in the darkness for the upright[a]; he is gracious and compassionate and righteous.
translation:
  language: zh_hans
  text: 在黑暗中，有光为正直人升起[a]；他有恩慈和怜悯，也公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在黑暗中，有光为正直人升起；这光是恩慈、怜悯且公义的。”末后三个形容词也可能呼应诗篇111:4所述耶和华的品格。
    reason: 保留末后三个单数形容词在句法所指上的歧义，以及与前一篇诗篇的神学呼应。
lexical_decisions:
- source_word: זָרַח
  choice: 升起
  rationale: 该动词描述光的升起或破晓。中文“升起”自然凝练，既可表达已经出现的光，也适合诗歌中概括性的陈述，不强行限定时态。
- source_word: בַּחֹשֶׁךְ
  choice: 在黑暗中
  rationale: 直接保留介词结构，并保有“黑暗”可能兼具实际处境与比喻意义的张力。
- source_word: אוֹר
  choice: 光
  rationale: 原文中“光”是动词的单数主语；中文无需添加不定冠词，能保持诗句的概括性。
- source_word: לַיְשָׁרִים
  choice: 为正直人
  rationale: יְשָׁרִים指品行正直的人。“正直人”与后文צַדִּיק所表达的“公义”保持词义区分。
- source_word: חַנּוּן
  choice: 有恩慈
  rationale: 该词指乐意施恩、厚待人的品格。“有恩慈”在现代中文中清楚自然，并与后面的品格词并列。
- source_word: רַחוּם
  choice: 有怜悯
  rationale: 该词着重怜恤、同情之心；“有怜悯”既通俗又保持经文语体，并与חַנּוּן有所区别。
- source_word: צַדִּיק
  choice: 公义
  rationale: 该词表达合乎正义、为人正直的品格。“公义”保留其道德与神学分量，并避免与יְשָׁרִים重复译作“正直”。
theological_decisions:
- issue: 末后三个单数形容词（חַנּוּן וְרַחוּם וְצַדִּיק）的所指
  choice: 正文补出“他”，理解为描述本诗所说的那位义人。
  alternative: 三个形容词可与“光”连读，也可能借诗篇111:4的措辞呼应耶和华的品格。
  rationale: “正直人”在原文为复数，而三个形容词均为阳性单数，因此句法所指并不完全明确。诗篇112篇上下文多次以单数描写敬畏耶和华的人，故正文用“他”是连贯的理解；但与诗篇111:4的明显呼应不应被抹去，故在脚注中保留另一种读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“在黑暗中”前置以贴近原文焦点；分号区分光升起的陈述与对“他”的品格描写。
