  text: כִּֽי לְ/עוֹלָ֥ם לֹא יִמּ֑וֹט לְ/זֵ֥כֶר ע֝וֹלָ֗ם יִהְיֶ֥ה צַדִּֽיק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/006.yaml
  text: For he will never be shaken[a]; the righteous will be remembered forever.
translation:
  language: zh_hans
  text: 因为他永不动摇；义人[a]必永远被记念。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为阳性单数，指一位“义人”；这里具有代表性，泛指正直的人。
    reason: 说明原文的语法性别、单数形式及其泛指作用，避免把“义人”误解为复数或仅限男性。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前述内容提供根据；“因为”自然保留了希伯来文的解释性连接作用。
- source_word: לְעוֹלָם לֹא יִמּוֹט
  choice: 永不动摇
  rationale: לְעוֹלָם与否定式连用，表达永久不发生的意思；“永不动摇”既保留持续性，也传达诗篇中稳固不移的意象。
- source_word: יִמּוֹט
  choice: 动摇
  rationale: מוט的Niphal形式可指被摇动、挪移或倾倒；“动摇”在现代汉语中自然，并符合智慧诗歌所描绘的稳固状态。
- source_word: לְזֵכֶר עוֹלָם
  choice: 永远为人所记念
  rationale: 原短语直指长存的记念；译为被动式的“永远为人所记念”，清楚表达义人的名声不会被遗忘。
- source_word: צַדִּיק
  choice: 义人
  rationale: 这是阳性单数、作名词用的形容词，指智慧文学中具有代表性的正直之人；汉语“义人”自然保留其类别称谓，而不额外加入原文没有的“男人”。
- source_word: יִהְיֶה
  choice: 必……为
  rationale: 该未完成式在此表达将来或确定的结果；“必”体现陈述的确定性，“为”配合汉语被动结构。
theological_decisions:
- issue: צַדִּיק的阳性单数及其代表性
  choice: 义人[a]
  alternative: 正直的人／那个义人
  rationale: 原文用阳性单数，却是在智慧文学中泛指具有这种品格的人。“义人”既不把单数强行扩成复数，也不额外限定为男性；脚注说明其语法形式和代表性用法。
- issue: “永远被记念”的含义
  choice: 永远为人所记念
  alternative: 永远在记念中／留下永远的记念
  rationale: 保留原文关于长久记念的陈述，不进一步限定记念者是谁，也不把它专门解释为神的记念或人的名誉。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“永不动摇”与“永远为人所记念”形成平衡；分号保留两个对应分句。
