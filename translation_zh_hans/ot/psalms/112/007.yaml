id: PSA.112.7
reference: Psalms 112:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ/שְּׁמוּעָ֣ה רָ֭עָה לֹ֣א יִירָ֑א נָכ֥וֹן לִ֝בּ֗/וֹ בָּטֻ֥חַ בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/007.yaml
  text: He will not fear bad news[a]; his heart is steadfast[b], trusting in Yahweh.
translation:
  language: zh_hans
  text: 他不怕坏消息[a]；他的心坚定[b]，信靠耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不怕凶信。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“稳固。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׁמוּעָה רָעָה
  choice: 坏消息
  rationale: שְׁמוּעָה 指所听见的消息或传闻，רָעָה 在此描述消息带来不利、令人忧虑的内容，而非强调道德上的邪恶；合译为“坏消息”自然、准确。介词 מִן 与“不怕”连用，在汉语中无需另译。
- source_word: לֹא יִירָא
  choice: 不怕
  rationale: 未完成式在智慧诗语境中表达此人的一贯特征；汉语“不怕”既可作一般陈述，也保留面对将来坏消息时不惧怕的含义。
- source_word: נָכוֹן
  choice: 坚定
  rationale: 该词表示牢固、稳妥、已经确立；“坚定”能自然描述内心稳定而不动摇，同时脚注保留“稳固”的词义可能。
- source_word: לִבּוֹ
  choice: 他的心
  rationale: “心”对应 לֵב，指人的内在思想、意志和性情；直译在现代汉语中自然。
- source_word: בָּטֻחַ
  choice: 信靠
  rationale: 该形式表达有把握、安然信赖的状态，后接 בַּיהוָה 指明信赖的对象；“信靠”简洁呈现其关系性含义。
- source_word: בַּיהוָה
  choice: 耶和华
  rationale: 介词 ב 标示信靠的对象；以现代中文读者熟悉的专名“耶和华”呈现四字神名，并保留其作为专名的功能。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文正文采用广为人知且具有专名功能的“耶和华”；“雅威”是较接近学界常见拟音的另一选择，但原始发音并非完全确定。
- issue: “心坚定”与“信靠”之间的关系
  choice: 并列呈现为“他的心坚定，信靠耶和华”
  alternative: 解释为“他的心因信靠耶和华而坚定”
  rationale: 原文以 נָכוֹן 和 בָּטֻחַ 相继描述“心”的状态，并未明示因果连接词。正文不增添“因……而”，从而保留坚定与信靠之间紧密但语法上未被明确界定的关系。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留希伯来诗句的两分结构。正文避免文言化的“凶信”，但在脚注中保留这一较凝练的传统表达；不将两个分句之间的关系扩写为原文未明确标出的因果关系。
