  text: פִּזַּ֤ר נָ֘תַ֤ן לָ/אֶבְיוֹנִ֗ים צִ֭דְקָת/וֹ עֹמֶ֣דֶת לָ/עַ֑ד קַ֝רְנ֗/וֹ תָּר֥וּם בְּ/כָבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/009.yaml
  text: He has distributed freely[a]; he has given to the poor. His righteousness stands forever[c][b]; his horn will be lifted up in honor.
translation:
  language: zh_hans
  text: 他广行施舍，周济穷人；他的公义永远长存[a]；他的角[b]必在尊荣中被高举[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”；这里可包括他的正直品格和合乎正道的行为。
    reason: lexical_alternative
  - marker: b
    text: “角”是希伯来诗歌中的比喻，可象征力量、尊严或受高举的地位。
    reason: cultural_note
  - marker: c
    text: “在尊荣中被高举”也可译作“尊荣地被高举”或“在荣耀中被高举”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּזַּר
  choice: 广行施舍
  rationale: 该动词本义有“撒开、散布”之意，在本节向穷人给予的语境中表达广泛而慷慨地分送；译为“广行施舍”自然地传达其语境义，同时保留施予不吝的意味。
- source_word: נָתַן
  choice: 周济
  rationale: 基本义为“给、给予”。与前句构成诗歌平行，“周济穷人”在现代汉语中自然，并明确表达给予的对象和目的。
- source_word: לָאֶבְיוֹנִים
  choice: 穷人
  rationale: אֶבְיוֹן指贫穷或缺乏之人；“穷人”简明、通俗，未把含义限定为某一种需要。
- source_word: צִדְקָתוֹ
  choice: 他的公义
  rationale: צְדָקָה可涵盖公义、正直和合乎正道的行为；“公义”保留其道德与神学广度，不将其仅缩减为慈善行为。
- source_word: עֹמֶדֶת לָעַד
  choice: 永远长存
  rationale: 分词与לָעַד共同表达持续、永久的状态；“永远长存”是自然庄重的汉语，也传达原文“站立不移”的持久性。
- source_word: קַרְנוֹ
  choice: 他的角
  rationale: “角”在希伯来诗歌中象征力量、尊严或受高举的地位。正文保留原有意象，并以脚注说明，避免直接以某一种解释取代比喻。
- source_word: תָּרוּם
  choice: 必……高举
  rationale: 该词表示升高或被尊崇；“必高举”既贴近原文意象，又能与“角”自然搭配。
- source_word: בְּכָבוֹד
  choice: 在尊荣中
  rationale: כָּבוֹד可指尊荣、荣耀。“在尊荣中”符合智慧诗篇中义人获尊崇的语境，同时以脚注保留其他可行表达。
theological_decisions:
- issue: “他的公义”与施舍行为之间的关系
  choice: 指这位慷慨之人的公义品格及合乎正道的行为长存，不把它限定为赚取救恩的功德，也不只等同于社会慈善。
  alternative: 可较窄地理解为他的善举长久蒙记念，或主要指他所行的公平正义。
  rationale: 上下文确实赞扬他对穷人的慷慨，但צְדָקָה本身具有更宽广的道德和关系性含义；保留“公义”可避免加入原文未明说的功德论，也不将其缩减为单一伦理类别。
- issue: “角被高举”的含义
  choice: 保留希伯来诗歌比喻，表达义人的力量、尊严或地位将获高举。
  alternative: 可直接意译为“他的尊荣必被高举”或“他必大有力量”。
  rationale: 原文有意使用“角”的具体形象；保留它可维持诗歌色彩及多重象征空间，脚注则帮助现代读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“广行施舍，周济穷人”保持两个动词的平行结构；正文保留“角”的希伯来意象，并借脚注解释，兼顾原文形式与普通读者的理解。
