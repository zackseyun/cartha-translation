source:
  edition: WLC
  text: כְּ/רַחֵ֣ם אָ֭ב עַל בָּנִ֑ים רִחַ֥ם יְ֝הוָ֗ה עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/013.yaml
  text: As a father has compassion on his children[a], so Yahweh has compassion on those who fear him.
translation:
  language: zh_hans
  text: 父亲怎样怜悯自己的儿女[a]，雅威也照样怜悯敬畏他的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“父亲怎样怜悯自己的儿子，雅威也照样怜悯敬畏他的人。”
    reason: 原文 בָּנִים 是阳性复数，可形式对应地译为“儿子”，但在这里也可泛指儿女。
lexical_decisions:
- source_word: כְּרַחֵם
  choice: 怎样怜悯
  rationale: 前缀 כְּ 表示比较；רָחַם 表达深切的怜悯与慈爱。“怎样怜悯”自然引出后半句“也照样”，并保留希伯来诗句的比较结构。
- source_word: אָב
  choice: 父亲
  rationale: 原文为泛指单数，描述一般父亲对子女的态度；现代汉语用“父亲”即可自然表达这种泛指。
- source_word: עַל
  choice: 怜悯……
  rationale: עַל 在 רָחַם 之后标示怜悯的对象；汉语无需另译介词，直接以宾语表达。
- source_word: בָּנִים
  choice: 自己的儿女
  rationale: 该阳性复数在亲子关系中可泛指子女。“儿女”准确表达后代而不局限于男性；“自己的”明确原文语境中父亲与儿女的所属关系。
- source_word: רִחַם
  choice: 怜悯
  rationale: 与上半句采用同一译词，以保留 רָחַם 的诗意重复。希伯来语完成式在这里陈述一贯事实，汉语用无时态标记的“怜悯”最自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”按通行学术重构音译此专名，不以“主”等称号替代。
- source_word: יְרֵאָיו
  choice: 敬畏他的人
  rationale: 该形式指以敬畏雅威为特征的人。“敬畏”同时保留畏惧与尊崇的语义张力，比单译“尊敬”更贴近原文。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非称号。“雅威”较直接地音译学界通常重构的读音，也避免把专名改成“主”；“耶和华”则是中文传统中广为人知的形式。
- issue: בָּנִים 的性别范围
  choice: 儿女
  alternative: 儿子
  rationale: 语境是父亲对子女的一般性怜悯，阳性复数可涵盖所有子女；译作“儿女”不人为把所指限于男性，同时脚注保留较形式对应的译法。
- issue: “敬畏”所包含的语义张力
  choice: 敬畏他的人
  alternative: 尊崇他的人
  rationale: 原词 ירא 不仅表示尊崇，也保留畏惧的成分；“敬畏”兼顾两者，不把经文弱化为一般敬重。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。以“怎样……也照样……”重现希伯来文的比较和平行结构，并重复“怜悯”以保留诗歌修辞。
