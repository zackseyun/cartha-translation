id: PSA.103.19
reference: Psalms 103:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְֽהוָ֗ה בַּ֭/שָּׁמַיִם הֵכִ֣ין כִּסְא֑/וֹ וּ֝/מַלְכוּת֗/וֹ בַּ/כֹּ֥ל מָשָֽׁלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/019.yaml
  text: Yahweh has established his throne in the heavens[b][a], and his kingdom rules over all.
translation:
  language: zh_hans
  text: 雅威在诸天[a]立定了他的宝座；他的国度[b]统管万有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天上”。希伯来语采用复数形式，直译为“诸天”。
    reason: lexical_alternative
  - marker: b
    text: “国度”也可译作“王权”或“统治”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语神名的通常学术拟音译出其专名性质，不以“主”等称号替代；“耶和华”是中文传统译法。
- source_word: בַּשָּׁמַיִם
  choice: 在诸天
  rationale: 保留 שָׁמַיִם 的复数形式和诗歌的崇高语体；中文也可惯用地译作“在天上”。
- source_word: הֵכִין
  choice: 立定了
  rationale: 使役词形在这里表示使之稳固、确立；“立定”兼顾宝座意象和完成体所表达的既成事实。
- source_word: כִּסְאוֹ
  choice: 他的宝座
  rationale: כִּסֵּא 在君王语境中通常指宝座，此处所带第三人称单数阳性后缀译作“他的”。
- source_word: וּמַלְכוּתוֹ
  choice: 他的国度
  rationale: מַלְכוּת 可指国度、王权或统治；正文采用自然且常见的“国度”，同时以脚注保留其他可能。
- source_word: בַּכֹּל
  choice: 万有
  rationale: 与表示统治的动词连用时，指其管辖范围遍及一切；“万有”简洁而符合诗体。
- source_word: מָשָׁלָה
  choice: 统管
  rationale: 该完成式在此作概括性、状态性的宣告，表达持续有效的普世统治；现代汉语用无时态标记的“统管”自然传达这一点。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 正文以拟音呈现以色列之神的专名，避免用称号替代；“耶和华”虽是中文传统形式，却并非当代对该希伯来神名的通常学术拟音。
- issue: מַלְכוּת 的语义范围
  choice: 国度
  alternative: 王权；统治
  rationale: 正文保留具体而常见的“国度”，但原词也可强调君王身份或施行统治这一事实，因此不以正文排除这些理解，并在脚注注明。
- issue: מָשָׁלָה 的完成式如何表达
  choice: 统管
  alternative: 已经统管；施行统治
  rationale: 此处可理解为诗歌中的概括性或状态性完成式，宣告雅威统治万有这一恒常现实；中文动词本身不强制标示时态，因而既不把它局限于过去，也保留其既成、有效的意味。
translation_notes:
  register: 采用现代、庄重而易懂的诗体语言。“立定”“宝座”“统管万有”保持王权意象和经文的崇高感；分号对应原文两个紧密相连的分句。所有脚注标记均已置于正文相应词语之后。
