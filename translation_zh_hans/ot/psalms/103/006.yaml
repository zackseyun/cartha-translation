  text: עֹשֵׂ֣ה צְדָק֣וֹת יְהוָ֑ה וּ֝/מִשְׁפָּטִ֗ים לְ/כָל עֲשׁוּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/006.yaml
  text: Yahweh works righteousness and justice for all who are oppressed[a].
translation:
  language: zh_hans
  text: 耶和华为一切受欺压的人施行公义和公正的审判[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华为所有受欺压的人施行公义之事和公正的审判。”
    reason: 保留צְדָקוֹת和מִשְׁפָּטִים作为复数、较具体的公义作为与司法裁断的词义可能。
lexical_decisions:
- source_word: עֹשֵׂה
  choice: 施行
  rationale: 该词是עשה的Qal主动分词，在此描述耶和华一贯、持续的作为；“施行”与“公义”自然搭配，并保留行动含义。
- source_word: צְדָקוֹת
  choice: 公义
  rationale: צדקה的复数在此可指合乎公义的作为；正文用集合性的“公义”，脚注保留“公义之事”这一较具复数行动色彩的译法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，而不以称号代替。
- source_word: וּמִשְׁפָּטִים
  choice: 和正直
  rationale: מִשְׁפָּטִים可表示判决、司法行动或公正；“正直”在此与“公义”并列，表达上帝为受欺压者秉公处理。脚注保留“公正的判决”这一更具司法色彩的可能。
- source_word: לְכָל
  choice: 为一切
  rationale: 介词ל在此表示受益对象；“为一切”自然体现行动是为他们而行。
- source_word: עֲשׁוּקִים
  choice: 受欺压的人
  rationale: 该被动分词指遭受压迫、剥削或亏负的人；“受欺压的人”清楚保留被动状态和人的指称。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用广为人知且庄重的“耶和华”，不以“主”等称号替换专名。
- issue: צְדָקוֹת与מִשְׁפָּטִים的关系
  choice: 公义和正直
  alternative: 公义之事和公正的判决
  rationale: 两个复数名词既可集合性地表示上帝的公义与公正，也可具体指其公义作为和司法裁决。正文采用自然简洁的抽象表达，脚注保留具体行动性的译法，不把两词合并为单一概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“施行公义”是自然的经文语体；“受欺压的人”比名词化的“受欺压者”更口语可懂，同时保持尊严。
