source:
  edition: WLC
  text: בָּרֲכ֥וּ יְהוָ֗ה מַלְאָ֫כָ֥י/ו גִּבֹּ֣רֵי כֹ֭חַ עֹשֵׂ֣י דְבָר֑/וֹ לִ֝/שְׁמֹ֗עַ בְּ/ק֣וֹל דְּבָרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/020.yaml
  text: Bless Yahweh[a], his angels, mighty in strength, who do his word[b], obeying the voice of his word.
translation:
  language: zh_hans
  text: 大有能力、遵行他的话、听从他话语的声音的天使啊，你们要称颂耶和华！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: 称颂
  rationale: 这是复数祈使式；“称颂”既保留“祝颂”的核心含义，也符合现代汉语中受造者向上帝发出的赞美，并与本诗反复出现的呼召相呼应。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不以“主”这一称号替代。
- source_word: מַלְאָכָיו
  choice: 他的众天使
  rationale: 本节所指是天上的使者；“众天使”在现代汉语中自然明确。倒装为“耶和华的众天使啊”，清楚表达他们是命令的受话者。
- source_word: גִּבֹּרֵי כֹחַ
  choice: 大有能力
  rationale: 自然表达“在力量上刚强”的含义，避免译作“勇士”而加入不必要的军事色彩。
- source_word: עֹשֵׂי דְבָרוֹ
  choice: 遵行他的话
  rationale: 比逐字的“行他的话”更符合现代汉语，同时保留 דָּבָר 的“话”而不收窄为“命令”。
- source_word: לִשְׁמֹעַ בְּקוֹל דְּבָרוֹ
  choice: 听从他话语之声
  rationale: שׁמע בקול 常有听而顺从之意；“听从”兼顾听见与服从，“话语之声”则保留原文中“声音”与“话语”的听觉意象和略带诗性的表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 正文保留神的专名而不以称号替代；“耶和华”是现代中文语境中最广为人知、可直接识别的专名形式。
- issue: לִשְׁמֹעַ 的听见与顺服语义
  choice: 听从
  alternative: 聆听；听见
  rationale: 上下文描写天使遵行上帝的话，“听从”体现 שׁמע בקול 常见的回应性顺服含义，同时没有增添原文以外的教义内容。
- issue: 两个分词性描述与命令对象的关系
  choice: 将“大有能力、遵行他的话、听从他话语之声”都处理为修饰众天使的描述
  alternative: 把末句处理为遵行话语的方式或目的
  rationale: 希伯来语允许这些短语连续描述天使；中文用并列修饰保留其关系上的一定开放性，不强行判定听从是手段、目的还是伴随情形。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用呼语“……啊”明确复数祈使句的受话者，并以句末“都要称颂他”避免中文长定语后主干不清；整体保留诗歌的排比和力度。
