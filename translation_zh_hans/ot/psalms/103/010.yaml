  text: לֹ֣א כַ֭/חֲטָאֵי/נוּ עָ֣שָׂה לָ֑/נוּ וְ/לֹ֥א כַ֝/עֲוֺנֹתֵ֗י/נוּ גָּמַ֥ל עָלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/010.yaml
  text: He has not dealt with us according to our sins[a], nor repaid us according to our iniquities.
translation:
  language: zh_hans
  text: 他没有按我们的罪过对待我们，也没有照我们的罪孽报应我们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他没有按我们罪过所应得的来对待我们，也没有照我们罪孽所应得的来报应我们。”
    reason: 说明 כ 所表达的比较、相称或应得尺度；正文保留原文简练的平行结构，脚注明示其隐含的“应得”意义。
lexical_decisions:
- source_word: כַּחֲטָאֵינוּ
  choice: 照我们的罪过
  rationale: 前缀 כ 表示比较或相称的尺度，即“照着、按着”。חטאים 在此指所犯的罪；“罪过”自然易懂，并与下句“罪孽”保持词汇区别。
- source_word: עָשָׂה לָנוּ
  choice: 待我们
  rationale: עשה 含义宽泛，可指“做、行”。与 לָנוּ 连用并置于上帝如何对待人的语境中，译作“待我们”简洁自然，也不额外说明具体惩罚方式。
- source_word: וְלֹא
  choice: 也没有
  rationale: 连接第二个否定分句，与首句构成紧密而平衡的诗歌并行。现代汉语用“也没有”比生硬的直译更自然。
- source_word: כַּעֲוֺנֹתֵינוּ
  choice: 按我们的罪孽
  rationale: עון 可指罪孽、罪责及其后果。“罪孽”保留其较宽语义，也与前句 חטאים 的“罪过”有所区别；כ 再次表达相称的尺度。
- source_word: גָּמַל עָלֵינוּ
  choice: 报应我们
  rationale: גמל 在这里表示按行为给予相应回报；否定语境中“报应”清楚传达没有按罪孽施予应得后果。עָלֵינוּ 在汉语中自然并入动词宾语“我们”。
- source_word: לֹא ... וְלֹא
  choice: 没有……也没有
  rationale: 保留希伯来文重复否定和两个分句的平衡，同时符合现代汉语表达。
theological_decisions:
- issue: 如何表达上帝的怜悯而不引入特定的赎罪理论或审判时序
  choice: 概括陈述上帝没有按人的罪过和罪孽所相称的程度对待、报应他们
  alternative: 将本节限定为今世的惩罚，或理解为绝对否认任何形式的神圣审判
  rationale: 希伯来文宽泛陈述上帝满有怜悯的作为，并未限定后果发生的时间或种类。译文既不把意思缩窄为今世刑罚，也不扩展为上帝绝不审判，从而保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“照……待”与“按……报应”保留两分句的平行结构；“罪过／罪孽”体现原文近义词的变化。
