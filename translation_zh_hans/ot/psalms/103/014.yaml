  text: כִּי ה֖וּא יָדַ֣ע יִצְרֵ֑/נוּ זָ֝כ֗וּר כִּי עָפָ֥ר אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/014.yaml
  text: For he knows our frame[a]; he remembers that we are dust.
translation:
  language: zh_hans
  text: 因为他知道我们是怎样被塑造的[a]；他记得我们是尘土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的构造”。希伯来语可指被塑造之物，或被塑造的方式。
    reason: 词义存在可真实保留的表达差异；正文采用自然的过程性说法，脚注注明较形式对应的译法。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为上帝怜悯人的原因提供解释，保留因果说明的作用。
- source_word: הוּא
  choice: 他
  rationale: 保留希伯来文的显式代词；所指的上帝可由上下文明确判断。
- source_word: יָדַע
  choice: 知道
  rationale: 此处完成式表达确定而持续有效的认识，现代汉语用“知道”自然准确。
- source_word: יִצְרֵנוּ
  choice: 我们是怎样被塑造的
  rationale: 该词源于“塑造、陶造”，可指所形成的构造或形成方式；此译既保留塑造意象，也用自然汉语表达上帝了解人的受造状况。
- source_word: זָכוּר
  choice: 他记得
  rationale: 该形式在句中表明上帝持续把人的状况记在心上；译作“他记得”与前句“他知道”构成自然平行。
- source_word: כִּי
  choice: （引出内容，不另译）
  rationale: 第二个כִּי引出“记得”的内容；汉语可直接接宾语从句，无须添加“那”或“因为”。
- source_word: עָפָר
  choice: 尘土
  rationale: 保留字面意象及其关于人受造、脆弱和必死性的经文联想，不增添“不过是”等解释性强调。
- source_word: אֲנָחְנוּ
  choice: 我们是
  rationale: 以汉语判断句“我们是尘土”准确表达希伯来文无系词句。
theological_decisions:
- issue: 人的受造性与脆弱意象
  choice: 我们是尘土
  alternative: 我们不过是尘土
  rationale: 保留原文对人受造、脆弱和必死处境的强调，同时不添加“不过”所带来的贬抑或额外强调。
- issue: יִצְרֵנוּ所指的范围
  choice: 我们是怎样被塑造的
  alternative: 我们的构造
  rationale: 不把该词窄化为身体结构、性情或罪性，而保留其关于人如何被形成、整体受造状况的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前后两个分句保持“他知道／他记得”的平行；“被塑造”保留希伯来文的陶造意象，脚注说明名词性理解。
