  source_fidelity: 译文准确反映希伯来文的两个说明性分句：首个“因为”保留 כִּי 的因果/解释作用；“他知道”对应 יָדַע；“我们是怎样被塑造的”以自然汉语表达 יִצְרֵנוּ 所指的人的形成、构造或受造状况；“他记得我们是尘土”忠实保留 זָכוּר 和 עָפָר אֲנָחְנוּ 的持续眷念及尘土意象。没有将“尘土”额外强化为“不过是尘土”。
