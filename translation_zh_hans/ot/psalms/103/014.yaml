  terminology: “尘土”保留诗篇及创世记关联的传统意象，准确自然。“被塑造”适当地传达 יצר 词根的塑造/形成意味；脚注给出“我们的构造”这一较名词化的可行译法，并说明词义范围，处理得当。脚注标记 [a] 紧随相关词组，锚点明确。
