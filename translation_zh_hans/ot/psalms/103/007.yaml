  text: יוֹדִ֣יעַ דְּרָכָ֣י/ו לְ/מֹשֶׁ֑ה לִ/בְנֵ֥י יִ֝שְׂרָאֵ֗ל עֲלִילֽוֹתָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/007.yaml
  text: He made his ways known to Moses[a], his deeds to the sons of Israel.
translation:
  language: zh_hans
  text: 他向摩西显明自己的道路，向以色列子孙[a]显明自己的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”也可译作“以色列的儿女”或“以色列民”。
    reason: 词义与表达方式的可选译法。
lexical_decisions:
- source_word: יוֹדִיעַ
  choice: 显明
  rationale: 该词是 ידע 的使役式，表示“使人知道、使之为人所知”。“显明”在现代中文中自然庄重，也保留主动启示的使役含义。
- source_word: דְּרָכָיו
  choice: 自己的道路
  rationale: דֶּרֶךְ 本义为“道路”，此处比喻上帝行事的方式。“道路”保留了希伯来语的意象；用“自己”清楚指回本节的主语。
- source_word: לְמֹשֶׁה
  choice: 向摩西
  rationale: 介词短语标明领受显明的对象；“向摩西”与中文动词“显明”搭配自然。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 向以色列子孙
  rationale: 这是指以色列群体的传统族称。“以色列子孙”既贴近原文的亲属称谓，又是现代中文读者能够理解的圣经用语。
- source_word: עֲלִילוֹתָיו
  choice: 自己的作为
  rationale: 该名词指所行的事或行动。“作为”简明自然，不额外加入原词未明说的“大能”等评价色彩。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的性别化群体称谓
  choice: 以色列子孙
  alternative: 以色列的儿女；以色列民
  rationale: 原文采用阳性复数亲属称谓，但作为固定族称指整个以色列群体。“以色列子孙”保留原文的家族与后裔意象，同时不把所指范围误限为男性；脚注列出较直译及较意译的说法。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。上下两句在希伯来文中共享动词；中文重复“显明”以清楚呈现平行结构，不改变原意。
