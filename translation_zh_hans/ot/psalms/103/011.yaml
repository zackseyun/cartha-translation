base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/011.yaml
  text: For as high as the heavens are above the earth[a], so great is his steadfast love toward those who fear him.
translation:
  language: zh_hans
  text: 正如天离地有多高，他向敬畏他的人所施的慈爱也有多大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“怜悯”或“忠贞的爱”。希伯来语 חֶסֶד 指在盟约关系中持久、忠诚的爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: （不单独译出）
  rationale: 本节在上下文中承接并说明前文；单独呈现本节时，现代汉语无需硬译“因为”，即可自然表达诗句的比较关系。
- source_word: כִגְבֹהַּ שָׁמַיִם עַל־הָאָרֶץ
  choice: 天离地有多高
  rationale: 以自然的现代汉语“有多……也有多……”结构表达希伯来语的程度比较，同时保留天地之间的垂直意象。
- source_word: גָּבַר
  choice: 有多大
  rationale: 该动词有强盛、占优势之意；在此与天高地远的比较相应，表达慈爱的浩大，不引入争战或冲突的含义。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: “慈爱”在简体中文圣经语体中自然而庄重，可兼顾怜悯、忠贞之爱与关系中的信实；脚注补充其盟约忠诚的内涵。
- source_word: עַל־יְרֵאָיו
  choice: 向敬畏他的人
  rationale: “向”自然表达慈爱的对象；“敬畏”保留 ירא 所含的畏惧与崇敬，不将其弱化为单纯尊敬。
theological_decisions:
- issue: 诗篇中 חֶסֶד 的译法
  choice: 慈爱
  alternative: 怜悯；忠贞的爱；盟约之爱
  rationale: “慈爱”简洁、可读，也能承载上帝持久而忠诚的爱；脚注说明其丰富语义，以免将其缩减为一般情感或仅仅怜悯。
- issue: “敬畏他”的语义力度
  choice: 敬畏他
  alternative: 尊崇他
  rationale: 原文 ירא 不仅指尊敬，也包含人在上帝面前的敬惧；保留“敬畏”可避免淡化原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“有多高……也有多大”重现原文的程度比较；正文保留传统且清楚的关键词“慈爱”和“敬畏”。
