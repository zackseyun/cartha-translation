  text: בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/אַל תִּ֝שְׁכְּחִ֗י כָּל גְּמוּלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/002.yaml
  text: Bless Yahweh[a], O my soul, and do not forget all his benefits.
translation:
  language: zh_hans
  text: 我的心哪，要颂赞雅威；不要忘记他一切的恩惠[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他一切的恩待”或“他一切的报偿”。这里的希伯来词可泛指一方给予另一方的待遇或报偿；根据下文列举的慈爱作为，正文译作“恩惠”。
    reason: 保留 גְּמוּלָיו 可指待遇或报偿的较宽语义，并反映本段语境所要求的正面含义。
lexical_decisions:
- source_word: בָּרֲכִי
  choice: 要颂赞
  rationale: 这是阴性单数命令式，与“我的心”呼应。希伯来语 ברך 以神为宾语时，表示称颂、赞美；“颂赞”在现代汉语中自然庄重，也保留敬拜语境。
- source_word: נַפְשִׁי
  choice: 我的心哪
  rationale: נפש 在这里指诗人向其整个自我发出的呼唤，并非专指与身体相对的灵魂。“我的心哪”体现呼格和诗歌语气，且符合现代汉语宗教诗体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；采用“雅威”音译，以区别于称号“主”，并保留经文中的专名性质。
- source_word: וְאַל תִּשְׁכְּחִי
  choice: 不要忘记
  rationale: אַל 加未完成式在此表达禁止或劝阻；“不要忘记”简明自然。连接词 וְ 以分号所表达的并列关系呈现，无须另加转折。
- source_word: כָּל גְּמוּלָיו
  choice: 他一切的恩惠
  rationale: גמול 可泛指一方给予另一方的回报、待遇或作为；下文列举雅威赦免、医治和救赎等善行，因此正文取正面的“恩惠”，同时以脚注保留其较宽的语义范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非普通称号。音译“雅威”较直接地呈现该专名；不将其改作“上主”，以免抹去专名与称号的区别。
- issue: נפש 所指的人观含义
  choice: 我的心哪
  alternative: 我的灵魂哪；我自己啊
  rationale: 此处是诗人对自身的诗性呼唤，不要求把人划分为彼此分离的组成部分。“心”在现代汉语中能自然表达内在自我的呼唤，同时不把某一种人论强加给原文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我的心哪”保留诗歌中的自我呼唤；分号呈现两个劝勉之间紧密的并列关系。脚注标记紧随存在词义歧义的“恩惠”之后。
