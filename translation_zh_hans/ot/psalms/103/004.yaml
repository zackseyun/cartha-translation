  text: הַ/גּוֹאֵ֣ל מִ/שַּׁ֣חַת חַיָּ֑יְ/כִי הַֽ֝/מְעַטְּרֵ֗/כִי חֶ֣סֶד וְ/רַחֲמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/004.yaml
  text: who redeems your life from the pit[a], who crowns you with steadfast love and compassion[b],
translation:
  language: zh_hans
  text: 他救赎你的生命脱离深坑[a]，以慈爱和怜悯作你的冠冕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “深坑”或译“毁灭”，也可译“坟墓”。
    reason: lexical_alternative
  - marker: b
    text: “怜悯”或译“慈悲”；原文为复数形式，可表达丰盛的怜悯。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹאֵל
  choice: 他救赎
  rationale: גאל在此为带定冠词的分词，描写上主持续施行救赎、挽回；“救赎”保留其救援与神学意蕴，又不把语境限定为亲属赎回制度。
- source_word: מִשַּׁחַת
  choice: 脱离深坑
  rationale: שחת可指坑、坟墓或毁灭。“深坑”保留具体的诗歌意象，也能涵盖死亡与败亡的含义；其他可能译法收入脚注。
- source_word: חַיָּיְכִי
  choice: 你的生命
  rationale: 此处指受拯救之人的生命整体；译作“生命”比“灵魂”更少引入希伯来语本身未必具有的灵肉区分。阴性单数第二人称后缀在承接本诗对“我的心”说话的拟人语境中，现代汉语无需标示性别。
- source_word: הַמְעַטְּרֵכִי
  choice: 作你的冠冕
  rationale: עטר可指加冠、以冠冕装饰，也可含环绕之意。“以……作你的冠冕”使慈爱与怜悯成为冠冕内容，保留诗歌隐喻，并符合现代汉语表达。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: חסד兼有恩慈、忠贞和恒久之爱的意涵。“慈爱”庄重自然，在汉语圣经语域中也较为熟悉；不直接加译“盟约”，以免过度限定。
- source_word: וְרַחֲמִים
  choice: 和怜悯
  rationale: רחמים为复数形式，但常作集合或抽象意义，表示丰盛的怜恤。“怜悯”在现代汉语中自然，并保留其情感与施恩含义；“慈悲”作为可行替代收入脚注。
theological_decisions:
- issue: 救赎意象的范围
  choice: 用“救赎你的生命脱离深坑”表达从死亡、败亡或致命困境中蒙拯救的宽广诗意，不限定为某一种救恩层面。
  alternative: 明确译为从坟墓中救出，或专指属灵及终末救恩。
  rationale: שחת本身容许“坑、坟墓、毁灭”等理解；正文保留具体而开放的意象，脚注呈现词义范围，避免替诗句预先解决其神学张力。
- issue: “冠冕”与“环绕”的隐喻
  choice: 保留“冠冕”意象，将慈爱和怜悯理解为上主所赐的尊荣与恩惠。
  alternative: 译为“以慈爱和怜悯环绕你”。
  rationale: עטר两种理解均有词汇依据；“冠冕”较直接保留诗歌中授予尊荣的形象，但不排除环绕保护的联想。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“他”承接诗篇上文所称的上主；两个分句保持平行。正文用“作你的冠冕”避免生硬的“给你加冠”，同时保留希伯来诗歌的核心隐喻。
