  terminology: “雅威”正确处理神名；“称颂”适合人对神的 בָּרַךְ，避免“祝福上帝”的现代汉语歧义；“圣名”自然且准确对应 שֵׁם קָדְשׁוֹ。题注和脚注术语均保持审慎，不将大卫关系、נפש 或 קֶרֶב 的解释过度确定化。
