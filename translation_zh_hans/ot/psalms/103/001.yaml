id: PSA.103.1
reference: Psalms 103:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְ/דָוִ֨ד בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/כָל קְ֝רָבַ֗/י אֶת שֵׁ֥ם קָדְשֽׁ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/001.yaml
  text: Of David. Bless Yahweh[a], O my soul, and all that is within me, bless his holy name.
translation:
  language: zh_hans
  text: '大卫的诗。[a]


    我的心哪，要称颂雅威！

    我里面的一切[b]，都要称颂他的圣名！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”：原文也可表示“大卫所属的”“为大卫而作的”或“关于大卫的”；这里的关系不能完全确定。
    reason: 保留题注 לְדָוִד 在作者、归属或献予等方面的真实歧义。
  - marker: b
    text: 原文直译“我所有的内在部分”，也可译作“我的整个内在”。
    reason: 说明 קְרָבַי 的字面意象和可行译法。
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 诗篇题注中，介词 לְ 加人名表示与该人有关，但可能涉及作者、归属、献予等关系。“大卫的诗”符合现代中文诗篇题注的自然表达，同时以脚注保留原文关系上的含混。
- source_word: בָּרֲכִי
  choice: 要称颂
  rationale: ברך 的强化词干在这里指人向上帝献上尊崇和赞美。中文“称颂”既保留“颂扬、祝颂”的语义，也避免用“祝福”上帝所产生的不自然含义。
- source_word: נַפְשִׁי
  choice: 我的心哪
  rationale: נפשׁ 在此是诗人对整个自我的呼唤，并非专指与身体分离的灵魂。“我的心哪”是自然庄重的中文呼语，能表达内在自我的自我劝勉。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用上帝的四字神名。译作“雅威”，以中文音译保留其专名性质，不以称号代替。
- source_word: וְכָל קְרָבַי
  choice: 我里面的一切
  rationale: קְרָבַי 字面为“我所有的内在部分”，在此概括人的整个内在生命。“我里面的一切”自然可懂，并保留其全面强调。
- source_word: שֵׁם קָדְשׁוֹ
  choice: 他的圣名
  rationale: 该结构字面为“他圣洁的名”或“他 holiness 之名”；“他的圣名”是简洁自然的中文表达，保留“名”及其圣洁属性。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 此处是上帝的专名而非一般称号；“雅威”较直接地音译原文神名，同时不把它替换为“上主”。
- issue: נפשׁ 是否应理解为独立于身体的“灵魂”
  choice: 我的心哪
  alternative: 我的灵魂哪／我自己啊
  rationale: 本节的平行句“我里面的一切”表明诗人在呼唤整个内在自我；译文不引入原文未明确表达的身心二分观。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；以“哪”和感叹号呈现自我呼唤与劝勉的力度。两行重复“称颂”，保留希伯来诗句的平行结构。题注单列，以符合诗篇版式。
