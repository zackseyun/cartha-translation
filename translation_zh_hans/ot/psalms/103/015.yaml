source:
  edition: WLC
  text: אֱ֭נוֹשׁ כֶּ/חָצִ֣יר יָמָ֑י/ו כְּ/צִ֥יץ הַ֝/שָּׂדֶ֗ה כֵּ֣ן יָצִֽיץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/015.yaml
  text: As for man[a], his days are like grass; he flourishes like a flower of the field.
translation:
  language: zh_hans
  text: 至于人，他的年日如草；他像田野的花一样绽放[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“发旺”。希伯来语动词描绘花朵开放、生长的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: 人
  rationale: 该词在此泛指脆弱、必死的人。译作“人”保留单数的诗歌形象；上下文中草与花的比喻已表达生命短暂，无须扩译为“必死的人”。
- source_word: כֶּחָצִיר
  choice: 如草
  rationale: 前缀כ表示比较；“如草”简洁自然，也符合诗体语域。
- source_word: יָמָיו
  choice: 他的年日
  rationale: 保留复数名词及第三人称阳性单数后缀，并以“年日”表达一生在世的时日。
- source_word: כְּצִיץ הַשָּׂדֶה
  choice: 像田野的花一样
  rationale: צִיץ指花或花朵，הַשָּׂדֶה是“田野”；此译保留原文的比较和属格意象，不将其具体化为某一种野花。
- source_word: כֵּן
  choice: 一样
  rationale: כֵּן意为“这样、如此”，在汉语中放入“像……一样”的比较结构，既自然又保留其承接作用。
- source_word: יָצִיץ
  choice: 绽放
  rationale: 该动词描写植物发芽、开花；“绽放”清楚呈现花朵开放的意象，也能自然地用于诗歌中对人的比拟。
