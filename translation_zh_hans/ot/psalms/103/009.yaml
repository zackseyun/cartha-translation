  text: לֹֽא לָ/נֶ֥צַח יָרִ֑יב וְ/לֹ֖א לְ/עוֹלָ֣ם יִטּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/009.yaml
  text: He will not contend forever[b][a], nor will he keep his anger for all time.
translation:
  language: zh_hans
  text: 他不长久责备[a]，也不永远怀怒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“相争”“争讼”或“指控”。原词可指争辩、相争，也可带有提出控诉的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“记恨”或“存留怒气”。原词的基本意思是“保留、守住”，此处指不让怒气一直存留。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֶצַח
  choice: 长久
  rationale: 该词表示持续不止的时段；在否定句中译作“不长久”，符合现代汉语表达，也与下句“不永远”形成自然的诗句平行。
- source_word: יָרִיב
  choice: 责备
  rationale: ריב可指争辩、相争、提出控诉或责难。这里按上帝对人施行责治的语境译作“责备”，同时以脚注保留争讼、控诉等可能含义。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: עוֹלָם表示无尽或不可限定的久远时段；“永远”准确、自然，并保留第二分句的持续性。
- source_word: יִטּוֹר
  choice: 怀怒
  rationale: נטר的基本意思是保留、守住；用于人际或神人关系时，可指把怒气留在心中、持续记恨。译作“怀怒”符合本诗语境，也不补出希伯来文未明说的宾语。
theological_decisions:
- issue: 是否明确补出上帝争讼或怀怒的对象
  choice: 不补出对象，保留原文的省略与诗歌凝练性。
  alternative: 译作“他不永远指责我们，也不永远向我们怀怒”。
  rationale: 希伯来文两句都没有明说宾语；上下文虽指向上帝对人的不悦，正文仍不宜把“我们”直接补入。
- issue: 是否把יִטּוֹר解释为持续发怒或记恨
  choice: 正文用较宽泛的“怀怒”。
  alternative: “记恨”或“存留怒气”。
  rationale: “怀怒”既表达该动词在此处保留怒气的惯用含义，又避免把上帝描写为带有人类报复意味的“记仇”，同时不削弱经文本身关于怒气的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“不长久……不永远……”既避免汉语中机械重复，又保留两个平行分句都否定持续不止之意。
