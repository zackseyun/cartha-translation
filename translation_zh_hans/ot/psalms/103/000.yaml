  yaml_path: translation/ot/psalms/103/000.yaml
  text: Of David. Bless the LORD, O my soul, and all that is within me[a], bless his holy name.
translation:
  language: zh_hans
  text: '大卫的诗。


    我的心哪，要称颂耶和华！我里面的一切[a]，都要称颂他的圣名！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“我所有的内在部分”，也可译“我的整个内在生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 介词לְ与人名构成诗篇标题，可表示归属、作者关系或关联；中文沿用简洁自然的诗篇标题表达，但不进一步断定具体关系。
- source_word: בָּרֲכִי נַפְשִׁי
  choice: 我的心哪，要称颂
  rationale: נֶפֶשׁ在此是诗人对自身生命与内在自我的呼唤；译作“我的心哪”符合现代中文诗歌语体。“称颂”准确表达人在敬拜中向上帝所作的בָּרַך。
- source_word: כָל־קְרָבַי
  choice: 我里面的一切
  rationale: 字面为“我所有的内脏/内在部分”，在诗歌中指人的全部内在存在；正文采用自然且包容原意的表达，并以脚注保留字面意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，区别于表示称号的“主”。
- source_word: שֵׁם קָדְשׁוֹ
  choice: 他的圣名
  rationale: 保留原文“他的圣名”的名词结构及其敬拜语气。
theological_decisions:
- issue: 诗篇标题לְדָוִד所表达的关系
  choice: 大卫的诗
  alternative: 关于大卫的诗／献给大卫的诗
  rationale: 原文介词所表达的关系具有一定范围；传统而简洁的译法不在正文中额外规定作者身份，也不排除关联或归属的语义。
- issue: “心”与“里面的一切”的关系
  choice: 保留平行呼唤，不把二者解释成灵魂与身体的二分
  alternative: 我的灵魂和我的身体都要称颂
  rationale: 原文以נֶפֶשׁ和“内在各部分”强化全人称颂的意思，并未建立系统性的二元人观。
translation_notes:
  register: 采用现代、庄重且适合诵读的诗歌语言；以“我的心哪”保留自我呼唤，以重复“称颂”呈现希伯来诗句的强调和节奏。标题单列，正文使用感叹号增强劝勉式敬拜语气。
