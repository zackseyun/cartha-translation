source:
  edition: WLC
  text: וְ/חֶ֤סֶד יְהוָ֨ה מֵ/עוֹלָ֣ם וְ/עַד ע֭וֹלָם עַל יְרֵאָ֑י/ו וְ֝/צִדְקָת֗/וֹ לִ/בְנֵ֥י בָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/017.yaml
  text: But the steadfast love of Yahweh is from everlasting to everlasting on those who fear him[a], and his righteousness to children's children.
translation:
  language: zh_hans
  text: 但雅威的忠贞之爱，从亘古直到永远，临到敬畏他的人；他的公义[a]也临到子子孙孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”或译“公正”。希伯来语在这里可以包含这两方面的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶסֶד
  choice: 但……忠贞之爱
  rationale: חֶסֶד表示持久、信实而带有盟约色彩的爱。“忠贞之爱”兼顾其爱与忠诚两方面；句首וְ依上下文与前节人生短暂形成对比，译作“但”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: 从亘古直到永远
  rationale: 保留原文前后无尽的时间表达及诗歌的对称感，同时符合现代汉语宗教诗文语体。
- source_word: עַל יְרֵאָיו
  choice: 临到敬畏他的人
  rationale: עַל在此表示慈爱所及的对象；“敬畏”保留יָרֵא兼具畏惧与尊崇的含义，不弱化为一般的尊敬。
- source_word: וְצִדְקָתוֹ
  choice: 他的公义
  rationale: צְדָקָה可指公义或公正；“公义”在此较能保留上帝正直、信实之作为的宽广含义，另一可能以脚注注明。
- source_word: לִבְנֵי בָנִים
  choice: 临到子子孙孙
  rationale: 原文直译为“儿女的儿女”；“子子孙孙”自然地保留世代延续的意象，且不局限于孙辈一代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”是较贴近主流学术重构读音的现代汉语音译，并保留专名性质。
- issue: צִדְקָה在本节中的含义
  choice: 公义
  alternative: 公正
  rationale: 本节以雅威跨越世代的忠贞之爱为平行语境，“公义”可涵盖其正直和守信的品格与作为；“公正”也是原词可能表达的侧面，故不将其排除，列于脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“亘古”“敬畏”“公义”虽属较正式词汇，但在现代汉语宗教与文学语境中通行易懂。分号体现希伯来诗歌两行的平行结构；第二行补出“临到”，使汉语通顺而不改变原意。
