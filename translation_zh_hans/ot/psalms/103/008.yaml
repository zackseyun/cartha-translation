  text: רַח֣וּם וְ/חַנּ֣וּן יְהוָ֑ה אֶ֖רֶךְ אַפַּ֣יִם וְ/רַב חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/008.yaml
  text: Yahweh is compassionate and gracious[b][a], slow to anger and abounding in steadfast love.
translation:
  language: zh_hans
  text: 雅威有怜悯，有恩典[a]；他不轻易发怒，并有丰盛的慈爱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有恩典”也可译作“乐意施恩”。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来词常含忠贞、信实和守约之爱的意味，也可译作“信实的爱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: 有怜悯
  rationale: 该形容词表示深切的怜悯与同情。“有怜悯”在现代汉语中自然清楚，也保留了对受苦者动恻隐之心的意味。
- source_word: חַנּוּן
  choice: 有恩典
  rationale: 该词表示乐意施恩、赐予不配得的恩惠；与“有怜悯”并列而不混同两者。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接译出四字神名，而不以“主”这一称号代替；“雅威”是现代汉语中清楚、常见的音译。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒
  rationale: 希伯来语字面为“鼻孔长”，是延迟发怒的习语；“不轻易发怒”准确而自然地传达其含义。
- source_word: רַב
  choice: 丰盛
  rationale: 此处修饰 חָסֶד，表示数量充盈、极其丰富；“丰盛”简洁地传达这种丰富程度。
- source_word: חָסֶד
  choice: 慈爱
  rationale: 该词兼有仁爱、忠诚和持久委身的内涵。“慈爱”符合诗篇的庄重语体，脚注则提示其忠贞、守约的语义层面。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用以色列上帝的专名，而非一般称号；采用音译可保留专名性质，又不把有争议的元音重构表述得过度确定。
- issue: 盟约语境中 חָסֶד 的译法
  choice: 慈爱
  alternative: 信实的爱；守约之爱；忠诚
  rationale: “慈爱”保留爱的核心，也适合现代中文经文语体；以脚注说明忠贞和守约色彩，避免正文采用过窄的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。前半句保留两个相邻但不等同的品格词；后半句以“他”补明主语，使汉语行文自然。分号呈现原文两组并列描述的节奏。
