base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/018.yaml
  text: to those who keep his covenant[a], and to those who remember his precepts[b], to do them.
translation:
  language: zh_hans
  text: 就是临到那些谨守他的约[a]、记念他的训令[b]并遵行这些训令的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“守护他的约”。
    reason: lexical_alternative
  - marker: b
    text: 或译“他的指示”或“他的吩咐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמְרֵי
  choice: 遵守
  rationale: שׁמר可指看守、守护或遵行；与“约”搭配时，“遵守”自然表达忠实守约的含义。
- source_word: בְרִיתוֹ
  choice: 他的约
  rationale: בְּרִית在此指上帝与其子民之间的约；“约”保留其圣经语境和神学分量。
- source_word: וּלְזֹכְרֵי
  choice: 记得
  rationale: זכר不只指头脑中的回想，也含铭记在心并据此行动之意；后面的“付诸实行”显明其实践指向。
- source_word: פִקֻּדָיו
  choice: 他的训令
  rationale: פִּקּוּדִים指上帝所交付、规定的指示或要求；“训令”既传达权威性，也避免与其他律法术语完全混同。
- source_word: לַעֲשׂוֹתָם
  choice: 并付诸实行
  rationale: 该带ל的动词不定式把“记得”与实际遵行连接起来；中文用“并付诸实行”自然呈现‘记住而去行’的关系，同时不把具体逻辑过度限定为单一的目的或结果。
theological_decisions:
- issue: “记得”与遵行上帝训令之间的伦理关系
  choice: 译作“记得他的训令并付诸实行”
  alternative: “记得他的训令，为要遵行”或“记得他的训令，去实行”
  rationale: 希伯来文把记念与实行紧密相连，所指并非仅是认知上的回忆。此译保留顺服的实践含义，却不额外引入靠行为得义等神学判断。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“就是向……”承接上节所说耶和华的慈爱所临到的对象；“付诸实行”使末尾不定式在中文中清楚自然。
