  text: בָּרֲכ֣וּ יְ֭הוָה כָּל צְבָאָ֑י/ו מְ֝שָׁרְתָ֗י/ו עֹשֵׂ֥י רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/021.yaml
  text: Bless Yahweh[a], all his hosts, his ministers[b], who do his will.
translation:
  language: zh_hans
  text: 耶和华的众军，就是遵行他旨意的侍从啊，要称颂耶和华！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: 称颂
  rationale: 这是复数祈使式，呼吁受话者称颂耶和华。“称颂”既准确表达对上帝的祝颂，也保留本诗第20—22节反复出现的同一动词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，不用“主”这一称号替代。
- source_word: כָּל צְבָאָיו
  choice: 耶和华的众军
  rationale: צָבָא可指军队或成群的天上众军。上下文指向天上的受造者，但正文保留“众军”的宽度，避免把语义限定得超过原文。中文把代词明确为“耶和华的”，使呼语关系清楚。
- source_word: מְשָׁרְתָיו
  choice: 他所有的侍从
  rationale: שׁרת表示服侍、供职，常带有正式侍奉的意味。“侍从”符合天上宫廷的语境，并比一般的“仆人”更能体现这种正式职分。
- source_word: עֹשֵׂי רְצוֹנוֹ
  choice: 凡遵行他旨意的
  rationale: 分词短语描述这些受召者是实行上帝旨意的人。“遵行”比单纯“做”更自然庄重；“旨意”兼顾רָצוֹן所含的意愿和喜悦之事。
theological_decisions:
- issue: “众军”和“侍从”所指的对象
  choice: 正文采用可涵盖天上众军的表达，并由上下文引导读者理解为天上侍奉者。
  alternative: 明确译作“天军”或扩大解释为地上一切服侍上帝的人。
  rationale: 第20节刚提到耶和华的使者，因此这里很可能继续呼召天上的群体；然而צְבָא本身并未明说“天上”，故正文不把这一解释绝对化。
- issue: “遵行他旨意的”与前面名词短语的关系
  choice: 译作描述前述“众军、侍从”的关系从句，同时保留其较宽泛的呼召语气。
  alternative: 加上“就是”，将其明确限定为同位解释。
  rationale: 希伯来文连续使用名词性表达，既可视为同位描述，也具有层叠呼召的修辞效果；不用“就是”可避免过度锁定句法关系。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句末用“都要称颂耶和华”重现诗歌式号召，并将神名放在句首所属结构和句末命令中，使中文指代清楚，同时保持原文的反复与节奏。
