id: PSA.103.22
reference: Psalms 103:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּרֲכ֤וּ יְהוָ֨ה כָּֽל מַעֲשָׂ֗י/ו בְּ/כָל מְקֹמ֥וֹת מֶמְשַׁלְתּ֑/וֹ בָּרֲכִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/022.yaml
  text: Bless Yahweh[a], all his works, in all the places of his dominion. Bless Yahweh[c][b], O my soul.
translation:
  language: zh_hans
  text: 凡耶和华所造的，在他统治所及的各处，都要颂赞耶和华[a]。我的心哪，你要颂赞耶和华！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “颂赞”也可译作“称颂”。本节两处使用同一个希伯来动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ / בָּרֲכִי
  choice: 颂赞
  rationale: ברך在此以受造物和诗人自己的心为主语、以耶和华为宾语，表示称颂、赞美。译作“颂赞”既符合现代汉语，也保留全诗反复出现的礼仪性呼召。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译四字神名，区别于表示称号的“主”，并与中文圣经读者熟悉的用法相衔接。
- source_word: כָּל מַעֲשָׂיו
  choice: 凡耶和华所造的
  rationale: מַעֲשֶׂה可指所做之事或所造之物；在这里它们被直接呼召颂赞神，语境指向他一切的作为或受造物。正文采用自然的拟人化表达“凡耶和华所造的”。
- source_word: בְּכָל מְקֹמוֹת מֶמְשַׁלְתּוֹ
  choice: 在他统治所及的各处
  rationale: מֶמְשָׁלָה表示统治或管辖权；此译保留“各处”的空间表达，同时说明这些地方是其统治所达到之处，不把它局限为一个地理王国。
- source_word: נַפְשִׁי
  choice: 我的心哪
  rationale: נֶפֶשׁ在这种自我呼告中指诗人内在的整个自我。现代汉语诗歌中“我的心哪”比直译“我的灵魂哪”更自然，也保留呼格语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文明确使用四字神名。正文采用中文传统且广为识别的专名“耶和华”，不以称号替代，也不借此加入宗派性解释。
- issue: כָּל מַעֲשָׂיו所指范围
  choice: 凡耶和华所造的
  alternative: 他一切的作为
  rationale: 该短语本身可指神所做的一切或他所造的一切；因复数命令直接向它们发出，正文采用能自然承载拟人呼告的“所造的”，但不把范围缩窄到某一类受造物。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“都要”明确复数命令是向“凡耶和华所造的”发出；末句以“我的心哪”保留诗人的自我呼告和全诗首尾呼应。
