  text: כִּ/רְחֹ֣ק מִ֭זְרָח מִֽ/מַּֽעֲרָ֑ב הִֽרְחִ֥יק מִ֝מֶּ֗/נּוּ אֶת פְּשָׁעֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/012.yaml
  text: As far as the east is from the west[b][a], so far he has removed our transgressions from us.
translation:
  language: zh_hans
  text: 东离西有多远，他就使我们的过犯离我们有多远。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使我们的过犯远离我们。”
    reason: lexical_alternative
  - marker: b
    text: “过犯”所译的词也可指“悖逆”或“冒犯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְחֹק
  choice: 有多远……也有多远
  rationale: 该结构表达程度上的类比；汉语用前后呼应的“有多远……也有多远”自然保留比较力度。
- source_word: מִזְרָח מִמַּעֲרָב
  choice: 东离西
  rationale: 指日出与日落的方向，并以两者的距离表现极远；“东离西”简洁、自然地保留空间意象。
- source_word: הִרְחִיק
  choice: 使……离……有多远
  rationale: 这是 רחק 的使役式，意为使远离、移到远处；此译法既保留使役意义，也与上半句的距离比较相呼应。
- source_word: מִמֶּנּוּ
  choice: 离我们
  rationale: 第一人称复数后缀明确表示“从我们这里”，保留过犯与群体分离的含义。
- source_word: פְּשָׁעֵינוּ
  choice: 我们的过犯
  rationale: פשע 可指越界、冒犯或悖逆；“过犯”在现代汉语中庄重而可懂，并比泛称“罪”更能保留原词的故意违犯色彩。
theological_decisions:
- issue: 以空间距离比喻赦免
  choice: 保留东西相离的空间意象，并将其直接用于神使过犯远离人。
  alternative: 弱化为“他完全赦免了我们的罪”。
  rationale: 原文刻意以东西之间的距离描绘过犯被挪去；保留这一比喻可传达神除去过犯之彻底，而不进一步界定其机制。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；用“有多远……也有多远”保存希伯来文的平行比较，并避免把空间比喻解释性改写为抽象的赦免陈述。
