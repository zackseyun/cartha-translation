  text: הַ/סֹּלֵ֥חַ לְ/כָל עֲוֺנֵ֑/כִי הָ֝/רֹפֵ֗א לְ/כָל תַּחֲלֻאָֽיְ/כִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/003.yaml
  text: who forgives all your iniquity[a], who heals all your diseases[b],
translation:
  language: zh_hans
  text: 他赦免你一切的罪孽[a]，医治你一切的疾病[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“罪责”或“罪”。希伯来语 עָוֹן 可指罪孽、罪责，也可指过犯所带来的后果。
    reason: lexical_alternative
  - marker: b
    text: 或译“病患”或“病症”。本句可具体指身体的疾病；在诗歌语境中，也有人作更广泛的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּלֵחַ
  choice: 他赦免
  rationale: 带定冠词的分词在此实词化，与下一分句平行，描述耶和华一贯的作为；现代汉语用“他赦免”自然、庄重，也保留其特征性和持续性的意味。
- source_word: לְכָל
  choice: 一切
  rationale: 与后面的集合性名词搭配，“一切”自然地表达无所遗漏的完整范围。
- source_word: עֲוֺנֵכִי
  choice: 你的罪孽
  rationale: עָוֹן 可指罪孽、罪责或过犯所带来的后果；“罪孽”保留其道德分量，同时脚注说明其他可能含义。希伯来语第二人称阴性单数在诗中是诗人对自己“我的心/灵”的称呼，汉语按语境译作“你”。
- source_word: הָרֹפֵא
  choice: 医治
  rationale: 与前一分词平行，描述耶和华的特征性作为；“医治”准确而自然，并保留具体治疗疾病的基本意义。
- source_word: תַּחֲלֻאָיִכִי
  choice: 你的疾病
  rationale: 该词指疾病或病患；“疾病”清楚保留其具体身体层面的通常含义，又不排除诗歌语境可能引发的更广理解。
theological_decisions:
- issue: 是否在译文中把医治属灵化
  choice: 正文保留具体的“医治你一切的疾病”，不限定为纯身体或纯属灵的医治。
  alternative: 译作“医治你一切属灵的疾病”，或以更宽泛的“病患”明确涵盖比喻性患难。
  rationale: 希伯来语通常指疾病；诗歌语境虽可能容许更广的神学理解，翻译却不应替原文预先限定其范围。
- issue: עָוֹן 的罪行、罪责与后果含义
  choice: 正文采用“罪孽”，脚注保留“罪责”“罪”的可能性。
  alternative: 正文译作“罪责”或“罪”。
  rationale: “罪孽”较能保留原词的道德力度，但原词语义范围确实也包括罪责及犯罪后果，故不在正文中武断消除其张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“赦免……医治……”保持两个希伯来语分词结构的平行。按诗篇103篇上下文，第二人称阴性单数是诗人对自己的心/灵说话，中文自然地用“你”，不标示语法性别。
