  text: who satisfies you with good[b][a], so that your youth is renewed like the eagle’s.
translation:
  language: zh_hans
  text: 他以美物使你满足[a]；你的青春如鹰般重新焕发[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文按马所拉元音直译为“你的妆饰（或华饰）”，全句含义不易确定。许多人理解为“他以美物使你一生满足”；另有解释传统读作“他以美物使你的口满足”。
    reason: alternative_reading
  - marker: b
    text: 或译“如一只鹰”。这里的希伯来词指一种大型猛禽，传统译作“鹰”，也有人认为是某种秃鹫。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂבִּיעַ
  choice: 使你满足
  rationale: 这是שׂבע的使役分词，延续上文对耶和华作为的描述；“使你满足”既表达充分供应，也符合现代汉语。
- source_word: בַּטּוֹב
  choice: 以美物
  rationale: טוֹב在此作名词性用法，指美好之物或福惠；“美物”简洁地保留其集合性含义，不限定具体所指。
- source_word: עֶדְיֵךְ
  choice: 你（整句译作“使你满足”）
  rationale: 按马所拉元音，这个词通常意为“你的妆饰／华饰”，但本句语义艰深。正文按上下文表达受惠者“你”得到满足，并以脚注保留字面形式及主要解释传统。
- source_word: תִּתְחַדֵּשׁ
  choice: 焕然更新
  rationale: חדש的Hitpael未完成式带有自反或被动意味；“焕然更新”自然表达重新变得新鲜、有活力，同时不强行规定施事方式。
- source_word: כַּנֶּשֶׁר
  choice: 如鹰一般
  rationale: נֶשֶׁר指大型猛禽，传统译作“鹰”；正文沿用诗歌中清晰自然的形象，物种上的不确定性见脚注。
- source_word: נְעוּרָיִכִי
  choice: 你的青春
  rationale: 复数抽象名词带第二人称阴性单数后缀，表示青春或青春活力；“你的青春”保留原诗的凝练与意象。
