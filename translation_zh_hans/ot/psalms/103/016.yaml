  yaml_path: translation/ot/psalms/103/016.yaml
  text: For the wind passes over it[a], and it is gone[c][b], and its place knows it no more.
translation:
  language: zh_hans
  text: 因为风吹过它[a]，它便不在了[b]；它所在之处也不再认得它[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风”也可译作“气息”或“灵”；上下文描写草和花，因此译作“风”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“它不在了。”
    reason: lexical_alternative
  - marker: c
    text: 希伯来文把“所在之处”拟人化，说那地方不再“认得”已经消逝的对象；本节延续前文花草的意象。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 省略显式连词
  rationale: 本节承接上一节花草易逝的比喻；现代汉语可直接陈述原因或情形，不必机械译出“因为”，以保持诗句自然紧凑。
- source_word: רוּחַ
  choice: 风
  rationale: 该词也可指“气息”或“灵”，但在草与花的诗歌意象中，“风”最切合上下文。
- source_word: עָבְרָה בּוֹ
  choice: 一吹过它
  rationale: עבר表示经过、越过；介词加代词指向前文的花草意象。“一……就……”自然表达风吹过后随即消逝的普遍情形。
- source_word: וְאֵינֶנּוּ
  choice: 它就不在了
  rationale: 贴近希伯来文直义“它不存在了”，同时符合现代汉语表达，比单译“没有了”更清楚。
- source_word: וְלֹא יַכִּירֶנּוּ עוֹד
  choice: 也不再认得它
  rationale: 保留 נכר 的“辨认、认得”之意及原文把地方人格化的诗意，不扁平化为“再也找不到”。
- source_word: מְקוֹמוֹ
  choice: 它所在之处
  rationale: 既准确表达“它的地方”，又比“它的位置”更自然庄重，并保留与后面“认得”相连的人格化意象。
theological_decisions: []
