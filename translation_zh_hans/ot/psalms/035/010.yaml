  text: כָּ֥ל עַצְמוֹתַ֨/י תֹּאמַרְנָה֮ יְהוָ֗ה מִ֥י כָ֫מ֥וֹ/ךָ מַצִּ֣יל עָ֭נִי מֵ/חָזָ֣ק מִמֶּ֑/נּוּ וְ/עָנִ֥י וְ֝/אֶבְי֗וֹן מִ/גֹּזְלֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/010.yaml
  text: All my bones will say, “O LORD, who is like you, delivering the poor from one stronger than he, and the poor and needy from the one who robs him?”
translation:
  language: zh_hans
  text: '我的骨头都要说：


    “耶和华啊，谁能像你？


    你救穷苦人脱离比他强的人，


    救穷苦人和贫乏人脱离抢夺他们的人。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַצְמוֹתַי
  choice: 我的骨头都
  rationale: 保留希伯来文以全身骨头发声来表达整个人由衷颂赞的鲜明意象；“都”自然对应 כָּל。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 按现代中文圣经传统，以专名“耶和华”呈现四字神名，并保留直接呼告语气。
- source_word: עָנִי
  choice: 穷苦人
  rationale: 该词可指贫穷、受苦或受压迫的人；“穷苦人”兼顾物质匮乏与困苦处境，不把含义限缩为单一层面。
- source_word: אֶבְיוֹן
  choice: 贫乏的人
  rationale: 突出缺乏、急需帮助之意，并与 עָנִי 构成自然的并列加强。
- source_word: גֹּזְלוֹ
  choice: 抢夺他的人
  rationale: 准确表达 גזל 所含以强力夺取、掠夺之意，也与本节强者欺压弱者的语境相合。
theological_decisions:
- issue: “谁能像你”的修辞性质
  choice: 保留反问，不补写“没有谁”
  alternative: 译作“没有谁能像你”
  rationale: 原文以 מִי כָמוֹךָ 发问；反问已表达耶和华无可比拟，同时保留诗歌形式和原文张力。
- issue: 神施行拯救的对象
  choice: 译作“穷苦人”与“穷苦贫乏的人”
  alternative: 统一译作“受苦者”或“穷人”
  rationale: 原文词义兼涉贫穷、困苦与受压迫；采用较宽广的中文措辞，避免把经文限定为纯经济意义或纯精神意义。
- issue: “比他强的人”中代词的所指
  choice: 保留单数比较结构“比他强的人”
  alternative: 改写为“强暴者”
  rationale: 原文明确是“比他强壮/强大者”，保留受害者与加害者之间力量悬殊的关系，不额外界定强者身份。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文；分行呈现平行结构。保留“骨头都要说”的具体意象，不意译成“我要全心说”，以免抹去原文的身体性表达。
