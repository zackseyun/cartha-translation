  text: וְ/הָ֘רֵ֤ק חֲנִ֣ית וּ֭/סְגֹר לִ/קְרַ֣את רֹדְפָ֑/י אֱמֹ֥ר לְ֝/נַפְשִׁ֗/י יְֽשֻׁעָתֵ֥/ךְ אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/003.yaml
  text: Draw the spear and block the way against those who pursue me[a]; say to my soul[b], “I am your salvation.”
translation:
  language: zh_hans
  text: 抽出长矛，拦住追赶我的人的去路[a]；对我的心说[b]：“我是你的拯救。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“抽出长矛和战斧，对付追赶我的人。”若把וּסְגֹר理解为一种兵器的名称，而不是“封住、拦住”这个动词，就可这样翻译。
    reason: alternative_reading
  - marker: b
    text: “我的心”也可译作“我”或“我的生命”；希伯来语נֶפֶשׁ可指人的自我、生命或内在的人。“你的拯救”也可译作“你的救援”；该词既可指具体危难中的解救，也可指较广义的救恩。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרֵק
  choice: 抽出
  rationale: 这是ריק的使役式命令形式，在这里指抽出武器。“抽出”自然明确，并保留军事意象。
- source_word: חֲנִית
  choice: 长矛
  rationale: חֲנִית是常见的矛类兵器；“长矛”符合现代汉语习惯，也不作过度细分。
- source_word: וּסְגֹר
  choice: 挡住
  rationale: 若按动词סגר理解，基本义是关闭、封住；此处结合追赶者，译为“挡住”自然地表达截断其去路。
- source_word: לִקְרַאת
  choice: 迎向／对付（体现在“挡住追赶我的人”中）
  rationale: 该词可表示迎面而去或朝向；在战斗语境中带有迎敌之意，汉语句法中无需另行直译。
- source_word: רֹדְפָי
  choice: 追赶我的人
  rationale: 分词加第一人称单数后缀，表示持续追赶诗人的人；此译清楚自然。
- source_word: אֱמֹר
  choice: 说
  rationale: 直接保留אמר命令式的普通意义，不增加“宣告”等原文没有明说的语气。
- source_word: לְנַפְשִׁי
  choice: 对我的心灵
  rationale: נֶפֶשׁ可指生命、自我或内在的人；“心灵”保留诗意和内在安慰的意味，避免简单压缩成“对我”。
- source_word: יְשֻׁעָתֵךְ
  choice: 你的拯救
  rationale: יְשׁוּעָה既可指具体危难中的解救，也可有较广的救恩含义。“拯救”在现代汉语中兼顾动作结果与较广含义。
- source_word: אָנִי
  choice: 我就是
  rationale: 独立人称代词具有强调作用；“我就是”自然体现“是我”的强调语气。
theological_decisions:
- issue: 在求脱离追赶者的语境中如何翻译יְשׁוּעָה
  choice: 拯救
  alternative: 救援；救恩
  rationale: 眼前语境首先是现实危难中的解救，但该词的意义并不限于一次军事救援。“拯救”既符合本节处境，也不排除诗篇更广的神学内涵。
- issue: 如何理解לְנַפְשִׁי
  choice: 对我的心灵
  alternative: 对我；对我的生命
  rationale: “心灵”保留נֶפֶשׁ的诗性和内在维度，同时不把它限定为一种后期的身心二分观念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。主句保留简短有力的命令语气；“我就是”体现希伯来语独立代词的强调。正文中的[a]、[b]均与脚注对应。
