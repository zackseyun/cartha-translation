    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּמוּנִי
  choice: 他们……报我
  rationale: 该词在此表示偿还、报偿；结合后面的宾语，译为“以恶报善”最符合现代汉语习惯，也保留敌意回报的含义。
- source_word: רָעָה תַּחַת טוֹבָה
  choice: 以恶报善
  rationale: תַּחַת在此表示交换或回报关系。“以恶报善”简洁自然，并保留希伯来文“恶／善”的鲜明对照。
- source_word: שְׁכוֹל
  choice: 如遭丧亲
  rationale: 该名词通常指丧亲、丧子或痛失所爱；这里用于描写诗人内在生命所受的惨痛剥夺。加上“如遭”表明这是对内心处境的诗性描述，不武断认定发生了实际丧亲。
- source_word: לְנַפְשִׁי
  choice: 使我的心灵
  rationale: נֶפֶשׁ可指心灵、生命或整个人。“心灵”在此保留诗句的内在情感力度；介词短语与前面的“丧亲”构成受影响者或结果关系，汉语用“使”使句法自然。
