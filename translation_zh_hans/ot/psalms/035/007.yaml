source:
  edition: WLC
  text: כִּֽי חִנָּ֣ם טָֽמְנוּ לִ֭/י שַׁ֣חַת רִשְׁתָּ֑/ם חִ֝נָּ֗ם חָפְר֥וּ לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/007.yaml
  text: For without cause they hid their net's pit for me[d][c][b][a]; without cause they dug it for my life.
translation:
  language: zh_hans
  text: 因为他们无故为我暗设网罗陷坑[a]；无故挖坑要害我的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “网罗陷坑”所对应的希伯来语把“陷坑”和“他们的网罗”紧密相连，二者的确切关系不明确；也可理解为“藏下带网罗的陷坑”或“为他们的网罗藏下陷坑”。
    reason: lexical_alternative
  - marker: b
    text: “我的性命”直译为“我的生命（נֶפֶשׁ）”，这里可指诗人本人或他的生命，不一定是狭义的“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明诗人呼求上帝干预的缘由，保留因果关系。
- source_word: חִנָּם
  choice: 无故
  rationale: 表示毫无正当理由、无缘无故；两处均照原文重复，突出敌意的不公。
- source_word: טָמְנוּ
  choice: 暗设
  rationale: 原义为隐藏、藏匿；在捕猎陷阱的语境中译作“暗设”，自然传达把陷阱隐蔽布置起来的动作。
- source_word: לִי
  choice: 为我
  rationale: 保留介词结构，表示诗人是陷阱所针对的对象。
- source_word: שַׁחַת רִשְׁתָּם
  choice: 网罗陷坑
  rationale: שַׁחַת是陷坑，רֶשֶׁת是网罗。原文将两者紧密相连，但具体关系并不明确；正文以简洁的复合表达保留两种捕猎意象，并用脚注说明其他可能理解。
- source_word: חָפְרוּ
  choice: 挖坑
  rationale: 原词表示挖掘；结合前面的陷坑意象，汉语补出“坑”使动作对象清楚。
- source_word: לְנַפְשִׁי
  choice: 要害我的性命
  rationale: נֶפֶשׁ在此指诗人本人或生命，并非狭义的非物质“灵魂”；译文表达敌人意图危害他的生命。
theological_decisions:
- issue: נֶפֶשׁ的含义
  choice: 我的性命
  alternative: 我的灵魂／我
  rationale: 本节描述致命陷阱，语境指诗人的生命或本人；避免把该词限定为后期神学意义上的“灵魂”。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“暗设网罗陷坑”保留捕猎意象，同时避免正文过度解释希伯来语中“陷坑”与“网罗”的歧义；两个“无故”对应原文的重复。
