  text: אַֽל יִשְׂמְחוּ לִ֣/י אֹיְבַ֣/י שֶׁ֑קֶר שֹׂנְאַ֥/י חִ֝נָּ֗ם יִקְרְצוּ עָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/019.yaml
  text: Do not let my enemies falsely rejoice over me[b][a], nor let those who hate me without cause wink the eye.
translation:
  language: zh_hans
  text: 不要让那些虚假地与我为敌的人因我而欢喜[a]；不要让那些无缘无故恨我的人挤眼示意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚假地与我为敌的人”也可译为“我虚假的敌人”或“我的敌人虚假地欢喜”。希伯来语表达紧凑；其中“虚假”可描述敌人的性质，也可描述他们敌对或欢喜的方式。
    reason: lexical_alternative
  - marker: b
    text: “挤眼示意”是希伯来语习语，指带着恶意或暗中串通而使眼色，也可表达嘲弄和敌视。
    reason: cultural_note
lexical_decisions:
- source_word: אַל יִשְׂמְחוּ
  choice: 不要让……欢喜
  rationale: אַל与未完成式构成祈愿性的禁止语气；“不要让”自然体现诗人向上帝发出的祈求。
- source_word: לִי
  choice: 因我遭难而
  rationale: 字面为“向我／对我”，在敌对者欢喜的语境中指因诗人受挫或遭难而幸灾乐祸；补出“遭难”使现代汉语含义清楚，但不限定具体灾情。
- source_word: אֹיְבַי שֶׁקֶר
  choice: 那些以虚假与我为敌的人
  rationale: 希伯来语结构紧凑，שֶׁקֶר既可描述敌人的虚假性质，也可修饰其敌对行为。“以虚假与我为敌”保留虚假与敌意之间的联系，并避免误解为“不是真正的敌人”。
- source_word: שֹׂנְאַי חִנָּם
  choice: 那些无缘无故恨我的人
  rationale: 分词שֹׂנְאַי表示持续恨恶者；חִנָּם在此表示没有正当缘由，译为“无缘无故”自然准确。
- source_word: יִקְרְצוּ עָיִן
  choice: 挤眼示意
  rationale: 保留眼部动作的具体意象，同时用“示意”传达该习语所含的恶意、嘲弄或暗中串通意味。
