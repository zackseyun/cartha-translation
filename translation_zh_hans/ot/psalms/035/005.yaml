source:
  edition: WLC
  text: יִֽהְי֗וּ כְּ/מֹ֥ץ לִ/פְנֵי ר֑וּחַ וּ/מַלְאַ֖ךְ יְהוָ֣ה דּוֹחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/005.yaml
  text: May they be like chaff before the wind[a], with the angel of Yahweh driving them away.
translation:
  language: zh_hans
  text: 愿他们像风前的糠秕[a]，雅威的使者驱赶他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他们像风前的糠秕，并有雅威的使者驱赶他们。”希伯来语连接词也可直译为“并且”；这里的分词可表示“驱赶”或“推开”。
    reason: 保留连接词וּ的显性并列译法，以及分词דּוֹחֶה在词义上的可能译法。
lexical_decisions:
- source_word: יִהְיוּ
  choice: 愿他们……
  rationale: 该动词形式在本篇祈求审判的语境中带祈愿、咒诅语气；“愿”比简单将来时更准确。
- source_word: כְּמֹץ
  choice: 像……糠秕
  rationale: מֹץ指扬场时会被风吹散的谷壳、糠秕；此译保留原文比喻。
- source_word: לִפְנֵי רוּחַ
  choice: 风前的
  rationale: 贴近希伯来语“在风面前”，并以自然汉语呈现糠秕随风飘散的图景。
- source_word: וּמַלְאַךְ יְהוָה
  choice: 任雅威的使者
  rationale: “任”在汉语中自然连接前面的风吹糠秕意象与使者主动驱赶的动作；“雅威”音译神名，“使者”保留מַלְאָךְ的基本意义，又不对该角色的身份作超出经文的界定。
- source_word: דּוֹחֶה
  choice: 把他们赶走
  rationale: 该分词表示推开、赶逐；根据上下文补出宾语“他们”，以“赶走”表达持续而有力的驱逐。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见形式音译，保留其专名性质。
- issue: מַלְאַךְ יְהוָה所指角色
  choice: 雅威的使者
  alternative: 雅威的天使
  rationale: מַלְאָךְ本义可指使者，在此语境中很可能是超自然使者；正文采用较贴近词义且不额外判定其身份的表达。
- issue: וּ与分词短语的关系
  choice: 任雅威的使者把他们赶走
  alternative: 并有雅威的使者驱赶他们
  rationale: 正文以自然汉语表达使者参与驱逐的画面，同时用脚注保留将וּ直接理解为并列连接词的可能。
translation_notes:
  register: 采用现代、庄重而易懂的祈愿句式。“风前的糠秕”保留诗歌意象；“任……把他们赶走”避免生硬直译，并由脚注交代原文较直接的并列读法。
