base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/000.yaml
  text: Of David[a]. Contend, Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: zh_hans
  text: '大卫的诗。[a]


    耶和华啊，求你与那些同我争讼的人争讼；

    与那些同我作战的人交战。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”也可译作“大卫所作”或“关于大卫”；希伯来文题署本身可以表示作者、归属或关联。
    reason: source_ambiguity
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 介词短语可表示作者、归属或关联；作为诗篇题署，采用简洁自然的传统表达，同时以脚注保留其语义范围。
- source_word: רִיבָה ... אֶת־יְרִיבַי
  choice: 与那些同我争讼的人争讼
  rationale: ריב兼有争辩、争讼和抗争之义；上下文以法律性措辞与军事性措辞构成平行，此处保留其可能的诉讼语感。
- source_word: לְחַם אֶת־לֹחֲמָי
  choice: 与那些攻击我的人交战
  rationale: לחם表示作战；分词形式指与诗人作战或攻击诗人的人。中文避免机械重复，同时保留军事意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译神圣四字名，清楚区别于一般称号“主”。
theological_decisions:
- issue: 诗人祈求上帝对抗敌人的措辞
  choice: 直译为请求耶和华争讼并交战
  alternative: 弱化为“帮助我应付敌人”
  rationale: 原文以法律和战争两个强烈意象平行展开，不宜把其张力解释性弱化。
- issue: 题署לְדָוִד的关系
  choice: 正文采用“大卫的诗”，脚注保留其他可能
  alternative: “大卫所作”或“关于大卫”
  rationale: 希伯来介词לְ并不单独确定作者关系，因此避免在脚注中排除归属或关联之义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“争讼”保留法律语感，“交战”保留下半句的军事意象；以“求你”自然表达希伯来语祈使句在祷告中的恳求语气。
