id: PSA.35.23
reference: Psalms 35:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָעִ֣ירָ/ה וְ֭/הָקִיצָ/ה לְ/מִשְׁפָּטִ֑/י אֱלֹהַ֖/י וַֽ/אדֹנָ֣/י לְ/רִיבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/023.yaml
  text: Awake and rise up for my judgment[a], my God and my Lord[c][b], for my cause.
translation:
  language: zh_hans
  text: 求你奋起，求你醒来，为我伸张公道[a]！我的上帝，我的主啊，求你介入我的争讼[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为我施行审判”或“为我昭雪”。希伯来语可指审判、公正、裁决，也可在诉讼语境中指洗雪冤屈。
    reason: lexical_alternative
  - marker: b
    text: 或译“我的案件”或“我的诉讼”。希伯来语指争端、争讼或法律案件。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִירָה
  choice: 求你奋起
  rationale: 这是源自动词 עור 的使役式祈使语气，呼求上帝从看似静止中采取行动。“奋起”保留了催促上帝行动的比喻，又比直译“唤醒自己”更符合现代汉语。
- source_word: וְהָקִיצָה
  choice: 求你醒来
  rationale: קיץ／יקץ 是醒来的动词，与前一祈使语构成强化性的并列。译作“醒来”保留两个近义命令的诗歌张力，不将其合并。
- source_word: לְמִשְׁפָּטִי
  choice: 为我伸张公道
  rationale: מִשְׁפָּט 可指审判、公正、裁决或法律上的昭雪。上下文是诗人求上帝在争讼中为他行动；“伸张公道”自然表达司法语境，同时脚注保留其他可能。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 按第一人称单数领属形式直译，并保留直接呼语。
- source_word: וַאדֹנָי
  choice: 我的主
  rationale: אֲדֹנָי 在此是对上帝的尊称。“主”符合现代汉语圣经语体，不额外引入基督论含义。
- source_word: לְרִיבִי
  choice: 为我的争讼
  rationale: רִיב 可指争端、诉讼或案件。“争讼”保留法律性而不把情景限定为现代制度意义上的诉讼；为使汉语句法完整，以“介入”表达两个介词短语共同依附于呼求上帝行动的语势。
theological_decisions:
- issue: 以 אֱלֹהַי וַאדֹנָי 两个称号呼求上帝
  choice: 我的上帝，我的主
  alternative: 我的上帝，我的主人
  rationale: 原文以两个并列称号直接呼求上帝。“主”既体现敬称，也符合汉语中的既定神圣语域；不据此节加入特定的基督论解释。
- issue: 诗人所求的是审判、公正还是昭雪
  choice: 为我伸张公道
  alternative: 为我施行审判／为我昭雪
  rationale: 原词 מִשְׁפָּט 的语义范围同时容纳司法裁决、公正和有利判决。正文采用自然而不失司法色彩的表达，脚注明确保留其他解释，避免断定诗人已经被宣告无罪。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。保留“奋起／醒来”两个近义祈使语的加强效果，并以两个感叹句再现急切呼求。正文不机械复制希伯来语介词结构，而以“伸张”“介入”使汉语完整自然；脚注保留关键司法词汇的真实歧义。
