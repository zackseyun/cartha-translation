  text: תְּבוֹאֵ֣/הוּ שׁוֹאָה֮ לֹֽא יֵ֫דָ֥ע וְ/רִשְׁתּ֣/וֹ אֲשֶׁר טָמַ֣ן תִּלְכְּד֑/וֹ בְּ֝/שׁוֹאָ֗ה יִפָּל בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/008.yaml
  text: Let destruction come upon him unawares[a], and let the net that he hid catch him[c][b]; into that very destruction let him fall.
translation:
  language: zh_hans
  text: '愿毁灭在他毫无察觉时临到他[a]；

    愿他暗藏的网罗捕住他；

    愿他落入那毁灭之中[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿灾祸出乎意料地临到他。”希伯来文直译为“愿毁灭临到他；他不知道”。
    reason: lexical_alternative
  - marker: b
    text: “其中”也可能指他暗藏的网罗；末句因而可理解为：“愿他落入其中，遭到毁灭。”
    reason: alternative_reading
lexical_decisions:
- source_word: תְּבוֹאֵהוּ
  choice: 临到他
  rationale: 该词由“来、进入”加第三人称阳性单数宾语后缀构成，主语是阴性名词“毁灭”。在祈愿性的咒诅语境中，“愿……临到他”既贴近原文，也符合现代汉语表达。
- source_word: שׁוֹאָה
  choice: 毁灭
  rationale: 此词表示突然而严重的灾祸、毁坏或倾覆。“毁灭”可自然用于本节两处，并保留其强烈程度。
- source_word: לֹא יֵדָע
  choice: 在他毫无察觉时
  rationale: 原文直译为“他不知道”。这里表达灾祸临到时当事人并未察觉；此译保留时间关系和认知含义，同时比逐字译法自然。
- source_word: וְרִשְׁתּוֹ אֲשֶׁר טָמַן
  choice: 他暗藏的网罗
  rationale: רֶשֶׁת 是捕捉用的网，带第三人称阳性单数所属后缀；טמן 表示隐藏、暗中埋设。“他暗藏的网罗”简洁地保留了所属关系及设伏意味。
- source_word: תִּלְכְּדוֹ
  choice: 捕住他
  rationale: לכד 表示捉住、擒获；与“网罗”搭配时，“捕住”是自然且准确的现代汉语。
- source_word: בְּשׁוֹאָה יִפָּל בָּהּ
  choice: 愿他落入那毁灭之中
  rationale: 将前置的“在/入毁灭”与后面的阴性代词“在其中”理解为前置成分及其复指，译为“那毁灭之中”以传达强调并避免汉语赘复；代词也可能回指“网罗”，故以脚注保留歧义。
theological_decisions:
- issue: 本节祈愿性动词的语气
  choice: 连续采用“愿……”
  alternative: 译作确定的预告，如“毁灭必临到他”
  rationale: 诗篇此处处于求告和咒诅语境，未完成式适合按祈愿语气处理；这样不把请求默默改成确定预言。
- issue: 末句阴性代词 בָּהּ 的指代
  choice: 正文理解为复指阴性名词“毁灭”
  alternative: 理解为回指阴性名词“网罗”
  rationale: 紧邻的 שׁוֹאָה 为阴性名词，且“在毁灭中……在其中”可构成前置后复指的强调结构；但“网罗”同为阴性且在上句出现，因此脚注保留另一种可能，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；三个“愿”呈现原文祈愿语气和平行结构。“网罗”保留诗篇中设陷阱的传统意象，但句法保持现代自然。
