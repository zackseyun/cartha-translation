  yaml_path: translation/ot/psalms/035/020.yaml
  text: For they do not speak peace[a], but against the quiet ones of the land they devise deceitful words.
translation:
  language: zh_hans
  text: 因为他们不说和平的话[a]，却针对地上安居的人，谋划诡诈的话语。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们不说和睦的话”或“他们不谈和平”。希伯来语保留“和平”作为所说的内容，含义可能是他们的话不以和平或和解为目的。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为诗人的申诉或祈求说明理由；现代汉语中“因为”自然清楚。
- source_word: לֹא שָׁלוֹם יְדַבֵּרוּ
  choice: 他们不说和平的话
  rationale: 保留“和平”作为言说内容，而不改写成副词“平和地”；既贴近希伯来语结构，也保留其言语不以和平、和解为旨归的含义。
- source_word: שָׁלוֹם
  choice: 和平
  rationale: 表达核心义“和平”，同时可涵盖和睦、安宁等关联意义。
- source_word: וְעַל
  choice: 反倒……攻击
  rationale: וְ在上下文中带有转折对照作用，עַל指向敌对行为的对象；此译法在汉语中明确呈现“他们不谈和平，反而针对某些人”的对比。
- source_word: רִגְעֵי אֶרֶץ
  choice: 地上安静度日的人
  rationale: 该罕见短语很可能指在当地安静、平和生活的人；“安静度日”比单说“安静的人”更自然，也避免与前面的“和平”完全重叠。
- source_word: דִּבְרֵי מִרְמוֹת
  choice: 诡诈的言语
  rationale: 自然表达由欺骗、奸诈构成的言语内容，同时保留其恶意性质。
- source_word: יַחֲשֹׁבוּן
  choice: 谋划
  rationale: 此处חשׁב表示有意筹谋、设计，而非仅仅思想；“谋划”适合敌对语境。
