  text: שָׁפְטֵ֣/נִי כְ֭/צִדְקְ/ךָ יְהוָ֥ה אֱלֹהָ֗/י וְ/אַל יִשְׂמְחוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/024.yaml
  text: Vindicate me according to your righteousness[a], O Yahweh my God, and do not let them rejoice over me.
translation:
  language: zh_hans
  text: 雅威——我的上帝啊，求你按你的公义[a]为我申冤；不要让他们在我身上欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按你的公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: 为我申冤
  rationale: שׁפט在本节的祈求和敌对语境中，不只是中性地“审判我”，而是求上帝作出有利裁决。“为我申冤”自然地表达其司法性和恳求意味，同时不额外说明裁决的具体方式。
- source_word: כְצִדְקְךָ
  choice: 按你的公义
  rationale: צדק既可指公义品格，也可指公正裁断。“公义”保留较宽的道德与司法内涵；“公正”作为可行译法列入脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见的音译呈现四字神名，使其保持为专名，而不以“主”等称号代替。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 明确保留第一人称单数所属后缀，并采用自然、庄重的现代汉语表达。
- source_word: וְאַל יִשְׂמְחוּ
  choice: 不要让他们……欢喜
  rationale: אַל加未完成式在这里表达向上帝提出的否定祈求；“不要让”清楚表明祈求对象是上帝，而所涉及的行为主体是敌人。
- source_word: לִי
  choice: 因我而
  rationale: לִי与“欢喜”连用，在敌对语境中表示敌人因诗人的遭遇而得意。“因我而欢喜”保留原文较简练的表达，不进一步加入“幸灾乐祸”等解释性措辞。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名。正文采用较贴近YHWH可能读音的“雅威”，不以称号代替；传统汉语形式“耶和华”虽广为人知，但音译依据较弱。
- issue: צִדְקְךָ应译为“公义”还是“公正”
  choice: 公义
  alternative: 公正
  rationale: “公义”能同时承载上帝正直的品格和公正裁断的含义，避免把词义仅限于司法程序；“公正”仍是真实的语境性可能，故保留在脚注中。
- issue: שָׁפְטֵנִי是中性审判还是有利裁决
  choice: 为我申冤
  alternative: 审判我
  rationale: 在诗人求上帝制止仇敌欢喜的语境中，这一命令式更自然地表示求上帝作出有利裁决。“审判我”较贴近字面，却可能在现代汉语中被误解为求上帝定罪。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈求语体。“雅威——我的上帝啊”用破折号呈现同位呼语；分号保留两项祈求之间紧密而清楚的关系。
