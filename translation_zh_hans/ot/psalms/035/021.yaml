  yaml_path: translation/ot/psalms/035/021.yaml
  text: They opened their mouths wide against me; they said[a], “Aha, aha! Our eyes have seen it!”
translation:
  language: zh_hans
  text: 他们向我大大张口，说：“啊哈！啊哈！我们亲眼看见了！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我们的眼看见了。”希伯来语以单数动词搭配具有集合意义的“我们的眼”。
    reason: 说明希伯来语集合名词与单数动词的形式，并保留较直译的可能。
lexical_decisions:
- source_word: וַיַּרְחִיבוּ ... פִּיהֶם
  choice: 大大张口
  rationale: 希伯来语直译为“使他们的口张大”；此处描写敌人向诗人张口讥笑、幸灾乐祸。“大大张口”保留具体意象，也符合现代汉语表达。
- source_word: עָלַי
  choice: 向我
  rationale: 介词עַל在敌意言语的语境中表示针对诗人；“向我张口”既保留方向感，也自然传达敌对意味。
- source_word: הֶאָח הֶאָח
  choice: 哈！哈！
  rationale: 这是表示恶意得意或幸灾乐祸的感叹词；“哈！哈！”保留重复和嘲弄语气。
- source_word: רָאֲתָה עֵינֵינוּ
  choice: 我们亲眼看见了
  rationale: 字面为“我们的眼看见了”，其中“眼”是集合性表达，动词为单数。“亲眼看见”以自然汉语表达目击和得意宣称，并保留其未明说宾语的特点。
theological_decisions: []
