  text: וַ/אֲנִ֤י בַּ/חֲלוֹתָ֡/ם לְב֬וּשִׁ/י שָׂ֗ק עִנֵּ֣יתִי בַ/צּ֣וֹם נַפְשִׁ֑/י וּ֝/תְפִלָּתִ֗/י עַל חֵיקִ֥/י תָשֽׁוּב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/013.yaml
  text: But as for me[a], when they were sick, my clothing was sackcloth; I humbled myself with fasting[c][b], and my prayer returned to my own bosom.
translation:
  language: zh_hans
  text: 至于我，他们患病时，我以麻布为衣[b]；我借禁食使自己谦卑[c]；我的祷告归回我怀中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的祷告归回我怀中”是含义不完全确定的希伯来语表达；也可理解为“我的祷告未蒙应允而返回”，或“祷告的益处回到我自己”。
    reason: alternative_reading
  - marker: b
    text: 麻布是一种粗糙的布料；人穿麻衣常用来表达哀伤、苦痛或悔罪。
    reason: cultural_note
  - marker: c
    text: 原文直译为“我借禁食使自己受苦（或自卑）”。这是借禁食克己、自卑的希伯来语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹתָם
  choice: 他们患病时
  rationale: ב 加不定词附第三人称阳性复数词尾，表达“他们患病的时候”；译文保留时间关系，并采用自然的现代汉语。
- source_word: לְבוּשִׁי שָׂק
  choice: 我以麻布为衣
  rationale: 原文是无系词名词句，直译为“我的衣服是麻布”。“我以麻布为衣”保留以麻布作哀服的状态，也较符合庄重而自然的汉语表达。
- source_word: עִנֵּיתִי בַצּוֹם נַפְשִׁי
  choice: 我禁食，使自己谦卑
  rationale: ענה 的 Piel 形式可指使受苦或使卑微；与禁食和 נֶפֶשׁ 连用时，表示借禁食克己、自卑。译文传达习语意义，脚注补充其字面形态。
- source_word: וּתְפִלָּתִי
  choice: 我的祷告
  rationale: 按名词本义翻译；前置连词在汉语分号连接的并列结构中无需机械译出。
- source_word: עַל חֵיקִי
  choice: 归回我怀中
  rationale: חֵיק 可指胸怀、怀抱或衣襟形成的兜处。“怀中”保留原文意象，不预先判定这是祷告未蒙应允，还是福分回到诗人自己。
- source_word: תָשׁוּב
  choice: 归回
  rationale: שׁוב 的基本义是返回、回转。此处保留其第三人称阴性单数形式与“祷告”相配，也保留该短语的含混性。
theological_decisions:
- issue: “我的祷告归回我怀中”的含义
  choice: 正文保留希伯来语的“归回怀中”意象，不明确判定祷告为何归回。
  alternative: 可理解为祷告未蒙应允而返回，也可理解为祷告的益处回到诗人自己，或他像为自己祈求那样恳切地代求。
  rationale: 该希伯来语表达的具体所指并不确定；直接选定某一种解释会消除原文真实存在的含混和神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“至于我”承接上下文的对比；分号呈现诗句中三个紧密相关的行动。“归回我怀中”略带诗性，刻意保留原文意象及其多义性。
