  text: יָרֹ֣נּוּ וְ/יִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥/י וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה הֶ֝/חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
translation:
  language: zh_hans
  text: 愿那些乐见我得到昭雪[a]的人欢呼喜乐；愿他们常常说：“愿雅威被尊为大！他喜爱自己的仆人得享平安[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我得到昭雪”也可译作“我的公义”或“我的正义”。希伯来词既可指道德或司法意义上的公义；本诗的争讼语境表明，这里很可能是指诗人被判为有理、冤屈得到昭雪。
    reason: lexical_alternative
  - marker: b
    text: “平安”也可指“安康”“福祉”或“兴盛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ וְיִשְׂמְחוּ
  choice: 欢呼喜乐
  rationale: רנן表示高声发出的喜悦欢呼，שמח表示欢喜快乐；合译为“欢呼喜乐”，既保留两个动词的并列表达，也符合现代汉语习惯。
- source_word: חֲפֵצֵי צִדְקִי
  choice: 喜爱我得伸冤的人
  rationale: חפץ表示喜爱、乐见；צדק在本诗受控告和求审判的语境中主要指诗人被判为有理、冤屈得到昭雪，因此译作“得伸冤”，同时以脚注保留“公义／正义”的语义可能。
- source_word: וְיֹאמְרוּ תָמִיד
  choice: 愿他们常常说
  rationale: 承接本节祈愿语气；תמיד强调持续、经常，译作“常常”自然清楚。
- source_word: יִגְדַּל יְהוָה
  choice: 愿雅威被尊为大
  rationale: יִגְדַּל在这里具有祈愿性的赞美语气，不只是陈述“雅威伟大”；“被尊为大”传达גדל的被高举、被承认为大的含义。神名יהוה按其专名译为“雅威”。
- source_word: הֶחָפֵץ שְׁלוֹם עַבְדּוֹ
  choice: 他喜爱他仆人享有平安
  rationale: חפץ再次表达喜爱、乐见；שלום涵盖平安、安康和福祉。“享有平安”使汉语关系清楚，又不增添“赐予”等原文未明说的动作；עבד在诗人与上帝的关系中自然译作“仆人”。
theological_decisions:
- issue: צִדְקִי所指的是诗人的道德公义，还是司法性的伸冤
  choice: 我得伸冤
  alternative: 我的公义／我的正义
  rationale: 全诗处在诗人遭敌对者控告并祈求公正裁断的语境中，司法性的“得伸冤”最贴合此处；但希伯来词本身仍可指公义或正义，因此不把其他含义排除，而在脚注中说明。
- issue: 祈愿式יִגְדַּל的表达
  choice: 愿雅威被尊为大
  alternative: 雅威是伟大的／愿雅威受尊崇
  rationale: 选择祈愿式以保留希伯来语未完成式在赞美公式中的意愿色彩；“被尊为大”也较直接保留“成为大／显为大”的词义，而不将它简化为静态陈述。
- issue: שלום的范围
  choice: 平安
  alternative: 安康／福祉／兴盛
  rationale: “平安”是直接且传统的对应词，但שלום在此可能广指仆人的完整福祉，而不限于没有冲突，故以脚注保留较宽的语义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“欢呼喜乐”保留希伯来诗歌的平行结构；两个“喜爱”呼应原文חפץ词根的重复。“享有平安”用于明确自然的汉语关系，但避免加入原文没有明说的“赐给”。所有脚注标记均置于其所解释的词语之后。
