  yaml_path: translation/ot/psalms/035/017.yaml
  text: Lord, how long will you look on? Restore my life from their ravages, my only one from the young lions.
translation:
  language: zh_hans
  text: 主啊，你还要看着多久呢？求你从他们的残害中救回我的性命，使我宝贵的生命脱离少壮狮子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 原文是称号“主”，并非神名יהוה；用现代汉语自然的呼格表达。
- source_word: כַּמָּה תִרְאֶה
  choice: 你还要看着多久呢
  rationale: 保留“看着”的原始意象和质问语气；在语境中暗含眼见苦难却尚未行动，但不把这一含义明说为“袖手旁观”。
- source_word: הָשִׁיבָה נַפְשִׁי
  choice: 救回我的性命
  rationale: הָשִׁיבָה本义为“使返回、带回”，在此是求救脱险；נֶפֶשׁ在死亡威胁的语境中指人的生命，而不宜窄化为与身体相对的“灵魂”。
- source_word: מִשֹּׁאֵיהֶם
  choice: 从他们的残害中
  rationale: 该词表示毁坏、蹂躏或造成的灾害；“残害”既能指敌人的暴行，也保留其毁灭性。
- source_word: מִכְּפִירִים
  choice: 脱离少壮狮子
  rationale: כְּפִירִים指年轻而强健的狮子；照原文保留诗歌意象，不直接解释为仇敌。
- source_word: יְחִידָתִי
  choice: 我仅有的生命
  rationale: 字面为“我唯一的（一个）”，在诗篇中与נַפְשִׁי平行，指诗人唯一、因而极其宝贵的生命。
theological_decisions:
- issue: 诗人对上帝迟延行动的质问
  choice: 保留“你还要看着多久呢”的直接质问
  alternative: 译作“你还要袖手旁观多久呢”
  rationale: 原文容许对上帝似乎迟延的强烈申诉，却没有明确使用“袖手旁观”这种带判断色彩的措辞；直译能保留诗篇中的张力。
- issue: נֶפֶשׁ的生命／灵魂含义
  choice: 译为“性命”
  alternative: 译为“灵魂”
  rationale: 上下文涉及遭残害和狮子威胁，焦点是从死亡中获救；“性命”更符合此处整体的人与生命意义，也避免导入身灵二分的特定理解。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“看着多久”保留申诉的力度；两个“生命”对应原文平行结构，并以“性命／仅有的生命”略作变化，避免误解为抽象的灵魂。
