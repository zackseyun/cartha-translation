  text: וּ/בְ/צַלְעִ/י֮ שָׂמְח֪וּ וְֽ/נֶאֱ֫סָ֥פוּ נֶאֶסְפ֬וּ עָלַ֣/י נֵ֭כִים וְ/לֹ֣א יָדַ֑עְתִּי קָֽרְע֥וּ וְ/לֹא דָֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/015.yaml
  text: But at my stumbling they rejoiced and gathered together[a]; they gathered against me—strangers whom I did not know[d][c][b]. They tore at me and did not stop.
translation:
  language: zh_hans
  text: '我踉跄时，他们却欢喜，并聚在一起[a]；

    他们聚集起来攻击我——一群我素不相识的袭击者[b][c]。

    他们撕扯我，毫不停歇[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我跛行时”“我失足时”。希伯来语既可指身体跛行，也可广指软弱、受挫或败落之时。
    reason: lexical_alternative
  - marker: b
    text: “袭击者”所译的希伯来词十分罕见，含义不确定；也可理解为“击打者”，或可能指“受苦的人、残疾的人”。
    reason: lexical_alternative
  - marker: c
    text: “我素不相识的”也可理解为：“他们聚集起来攻击我，我却毫不知情。”
    reason: syntactic_alternative
  - marker: d
    text: 或译：“他们撕扯我，并不住口。”若“撕扯”比喻恶毒的言语攻击，这一译法更能体现他们不断辱骂。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצַלְעִי
  choice: 我失足时
  rationale: צלע在这里可指跛行、蹒跚，也可广指遭遇软弱、挫折或败落。“失足”在现代汉语中既能表达跌倒、步履不稳的形象，也能涵盖处境上的挫败；其他可能性在脚注中保留。
- source_word: שָׂמְחוּ
  choice: 他们却欢喜
  rationale: שמח的常见义是“欢喜”。加入“却”自然呈现诗人与敌人反应之间的强烈反差，不增添新的命题内容。
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  choice: 聚在一起；他们聚集起来
  rationale: 原文连续重复אסף，形成强调和层层推进的效果，因此中文也保留两次“聚集”，而不合并处理。
- source_word: עָלַי
  choice: 攻击我
  rationale: עַל直译可作“在我之上”，但在敌对语境中表示冲着某人而来、与某人为敌；“攻击我”是自然且明确的现代汉语表达。
- source_word: נֵכִים
  choice: 袭击者
  rationale: 这是罕见且词义不确定的形式。若联系נכה“击打”，可理解为“击打者、袭击者”；上下文的敌对聚集和撕扯支持此解，但“受苦者、残疾者”等可能性仍在脚注中说明。
- source_word: וְלֹא יָדַעְתִּי
  choice: 我素不相识的
  rationale: 把该短语理解为修饰前面的袭击者，即诗人不认识这些人。希伯来语也可能表示诗人对他们的聚集或阴谋毫不知情，因此脚注保留另一种句法理解。
- source_word: קָרְעוּ
  choice: 他们撕扯我
  rationale: קרע的基本义是“撕裂、扯破”。原文宾语未明说；中文补出由上下文可知的“我”，同时“撕扯”仍可让读者理解为身体攻击或猛烈的言语伤害。
- source_word: וְלֹא דָמּוּ
  choice: 毫不停歇
  rationale: דמם既可表示“停止”，也可表示“沉默”。正文采用与持续攻击相合的“毫不停歇”，而把“并不住口”的言语性解释列入脚注。
theological_decisions: []
