  text: וּ֭/לְשׁוֹנִ/י תֶּהְגֶּ֣ה צִדְקֶ֑/ךָ כָּל הַ֝/יּוֹם תְּהִלָּתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/028.yaml
  text: And my tongue will meditate on your righteousness[d][c][b][a], and on your praise all day long.
translation:
  language: zh_hans
  text: 我的舌头要述说你的公义[a][b]，终日赞美你[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“公正”；这里特别涉及上帝公正地为人伸冤。
    reason: lexical_alternative
  - marker: b
    text: “述说”所译的希伯来语也可指低声念说或思想；以“舌头”为主语时，这里更可能指说出来。
    reason: lexical_alternative
  - marker: c
    text: “赞美你”原文直译为“你的赞美”，也可理解为述说你可颂可赞之处。
    reason: source_ambiguity
lexical_decisions:
- source_word: וּלְשׁוֹנִי
  choice: 我的舌头
  rationale: 保留希伯来语以“舌头”代指言语的表达，并以承接性的语气联系上文；中文无需机械译出句首连接词。
- source_word: תֶּהְגֶּה
  choice: 要述说
  rationale: הגה可指低声念说、思想或发声；因主语是“舌头”，此处以有声述说最合语境，同时不限定音量或方式。
- source_word: צִדְקֶךָ
  choice: 你的公义
  rationale: “公义”保留该词兼具正直与公正审判、伸冤的宽广含义；“你的公正”亦是语境上可成立的译法。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁自然地表达贯穿整日的持续意义，并保留诗歌语体。
- source_word: תְּהִלָּתֶךָ
  choice: 赞美你
  rationale: 希伯来语字面为“你的赞美”，可指归给上帝的赞美；中文译为动宾结构更自然，也与省略而共用前一动词的诗句结构相称。
theological_decisions:
- issue: 在上帝为诗人伸冤的语境中如何翻译צִדְקֶךָ
  choice: 你的公义
  alternative: 你的公正
  rationale: 原词可同时涵盖上帝本性的正直和他施行公正、为诗人伸冤的行动；正文采用较宽广的“公义”，脚注保留“公正”。
- issue: תְּהִלָּתֶךָ的受词关系
  choice: 赞美你
  alternative: 述说你的可颂可赞
  rationale: “你的赞美”在希伯来语中可表示献给上帝的赞美，也可表示上帝可颂可赞的名声；正文采用自然中文，但用脚注保留另一理解。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。“终日”保留原文持续性和第二诗行的强调；正文避免将הגה窄化为纯粹内在的“默想”，因为其主语是“舌头”。
