  text: יְֽהִי דַרְכָּ֗/ם חֹ֥שֶׁךְ וַ/חֲלַקְלַקּ֑וֹת וּ/מַלְאַ֥ךְ יְ֝הוָ֗ה רֹדְפָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/006.yaml
  text: May their way be dark and slippery[a], with the angel of Yahweh pursuing them.
translation:
  language: zh_hans
  text: 愿他们的道路黑暗、滑溜；愿雅威的使者追赶他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: 愿……
  rationale: 未完成式在此具有祈愿、咒诅语气；“愿”自然保留这一意愿色彩。
- source_word: דַרְכָּם
  choice: 他们的道路
  rationale: דֶּרֶךְ既可指实际道路，也可含人生道路的比喻义；“道路”保留两层可能。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 作道路的表语，描绘看不清方向、充满危险的处境；汉语用“黑暗”简洁自然。
- source_word: וַחֲלַקְלַקּוֹת
  choice: 湿滑
  rationale: 该复数名词表示光滑、易滑之处；译作“湿滑”以自然汉语表达危险路况，但不另加原文没有明说的具体地形。
- source_word: וּמַלְאַךְ יְהוָה
  choice: 同时雅威的使者
  rationale: וּ可作简单并列，也可表达伴随情形；正文用“同时”体现使者追赶与道路险恶相伴发生，并以“雅威”呈现神名。
- source_word: רֹדְפָם
  choice: 追赶他们
  rationale: רדף表示追逐、追赶；“追赶”保留主动而敌对的动态，不额外限定追赶方式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见音译呈现其专名性质，而不以头衔替代。
- issue: 连接词 וּ 所表达的关系
  choice: 同时
  alternative: 并且
  rationale: 上下文可理解为雅威的使者在他们行于黑暗湿滑之路时追赶他们；但希伯来语也容许单纯并列，因此以脚注保留该歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“黑暗湿滑”保持诗句紧凑，“追赶”则保留原文鲜明的动作感。
