  yaml_path: translation/ot/psalms/035/018.yaml
  text: I will give thanks to you in the great assembly[b][a]; among a mighty people I will praise you.
translation:
  language: zh_hans
  text: 我要在众多的会众[a]中称谢你；我要在强盛的民众[b]中赞美你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众多的会众”也可译作“大的会众”。
    reason: lexical_alternative
  - marker: b
    text: “强盛的民众”也可译作“众多的民众”。原文形容词可强调力量强盛，也可强调人数众多。
    reason: lexical_alternative
lexical_decisions:
- source_word: א֭וֹדְךָ
  choice: 我要……称谢你
  rationale: ידה 的 Hiphil 在敬拜语境中常指称谢或赞美；译作“称谢”可与下半句 הלל 的“赞美”保持词义区分。
- source_word: בְּקָהָל רָב
  choice: 在大会中
  rationale: קָהָל 指召集起来的会众或集会，רָב 在此表示规模大或人数多；“大会”简洁自然，并体现公开聚集的场景。
- source_word: בְּעַם עָצוּם
  choice: 在众多的民中
  rationale: עָצוּם 可表示强大，也可表示数量众多。与上句“大会”平行时，人数众多较符合语境，但原词的“强大”含义保留于脚注。
- source_word: אֲהַלְלֶךָּ
  choice: 我要……赞美你
  rationale: הלל 的 Piel 常指赞美、颂扬；“赞美”是现代汉语中直接、自然的敬拜用语。
theological_decisions: []
