  text: וְ֭/נַפְשִׁ/י תָּגִ֣יל בַּ/יהוָ֑ה תָּ֝שִׂישׂ בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/009.yaml
  text: Then my soul will rejoice in Yahweh[b][a]; it will exult in his salvation.
translation:
  language: zh_hans
  text: 而我的心灵必因耶和华欢喜，必因他的救恩欢腾。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “救恩”或译“拯救”。
    reason: יְשׁוּעָה可指救恩或解救；在本诗仇敌威胁的语境中，“拯救”特别贴切。
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: 那时，我的心
  rationale: נֶפֶשׁ在这里指诗人内在的自我；“我的心”符合现代汉语诗歌表达，也保留个人全心欢喜的意味。连接词וְ承接上文所盼望的拯救，译作“那时”以显明语境关系，但原文也可单纯理解为“而／我的心”。
- source_word: תָּגִיל
  choice: 必……欢喜
  rationale: גיל表示喜乐、欢欣；“欢喜”自然清楚，并与下半句较强烈的“欢腾”形成递进式平行。
- source_word: בַּיהוָה
  choice: 因耶和华
  rationale: 介词ב可表示喜乐所依归的对象或缘由；现代汉语用“因耶和华欢喜”自然表达这种关系。יהוה以汉语圣经传统中通行的专名“耶和华”呈现。
- source_word: תָּשִׂישׂ
  choice: 必……欢腾
  rationale: שׂושׂ／שׂישׂ表示强烈、洋溢的喜乐；“欢腾”保留其热烈程度，并避免与上句机械重复。
- source_word: בִּישׁוּעָתוֹ
  choice: 因他的救恩
  rationale: יְשׁוּעָה既可指具体的解救，也可有较广的拯救含义；正文用“救恩”保留语义宽度，脚注注明“拯救”。介词ב按自然汉语译作“因”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代简体中文读者最熟悉、可辨识为专名的“耶和华”；“雅威”是依据学界常见拟音的另一译法，但原始发音不能完全确定。
- issue: יְשׁוּעָה在本节中的范围
  choice: 救恩
  alternative: 拯救
  rationale: 本诗语境侧重从仇敌手中获救，但该词本身也能表达较宽泛的救助与得救；因此正文不把含义限缩为一次具体的脱险，并在脚注保留语境性译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“欢喜／欢腾”保留希伯来诗歌的同义平行及后半句较强的喜乐语气；两个“必”体现未完成式在语境中的将来／确信意味。
