  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/001.yaml
  text: Of David[a]. Contend, O Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: zh_hans
  text: '大卫的诗[a]。


    雅威啊，求你与那些和我争讼的人争讼[b]；

    与那些和我争战的人争战。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”也可理解为“大卫所作的诗”或“与大卫有关的诗”。希伯来文标题中的介词并未明确限定具体关系。
    reason: 标题归属存在语法歧义
  - marker: b
    text: “争讼”也可译作“相争”。这个希伯来语动词既可指一般争执，也可指法律上的争辩或为案件申诉。
    reason: 保留词义中的司法色彩与较广的敌对含义
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 诗篇标题中，介词 לְ 加人名可表示作者、归属或关联。“大卫的诗”符合现代中文诗篇标题的惯用表达，同时不像“大卫所作”那样把作者身份绝对化；相关含义保留在脚注中。
- source_word: רִיבָה
  choice: 争讼
  rationale: ריב 可指一般争执，也常带法律上的争辩、诉讼意味。“争讼”兼顾司法语境和敌对冲突，并与后面的同根表达形成对应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文音译呈现四字神名，保留其作为以色列之神专名的性质，而不以“主”这一称号替代。
- source_word: אֶת יְרִיבַי
  choice: 同与我争讼的人
  rationale: 该形式指与诗人争讼或相争的人。译作关系短语，既自然，也保留与命令式 רִיבָה 的词根呼应。
- source_word: לְחַם
  choice: 争战
  rationale: 该命令式表示作战、交战。“争战”保留军事力度，并适合诗歌体裁。
- source_word: אֶת לֹחֲמָי
  choice: 同与我争战的人
  rationale: 主动分词加第一人称单数后缀，指那些与诗人交战的人。中文重复“争战”，重现原文命令式与分词的修辞对应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”作为现代学界较常见的音译，以保留专名性质；“耶和华”是中文教会传统中广为使用的另一音译。
- issue: 祈求的司法与军事双重意象
  choice: 前半译“争讼”，后半译“争战”
  alternative: 前半可译“相争”或“为我申诉”，后半可译“作战”
  rationale: 原文先用 ריב 的司法兼冲突语汇，再用 לחם 的战争语汇。译文保留两者之间的递进，不把整节单一化为法庭申诉或军事冲突。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两行祈求保留原文“动词—同根参与者”的平行与重复，以呈现诗歌力度；不用古雅的“与……相争者相争”等表达。
