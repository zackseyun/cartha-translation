  text: רָאִ֣יתָה יְ֭הוָה אַֽל תֶּחֱרַ֑שׁ אֲ֝דֹנָ֗/י אֲל תִּרְחַ֥ק מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/022.yaml
  text: You have seen[a], O Yahweh; do not be silent. O Lord, do not be far from me.
translation:
  language: zh_hans
  text: 雅威啊，你已经看见了；不要沉默。主啊，不要远离我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתָה
  choice: 你已经看见了
  rationale: 这是动词 ראה 的 Qal 完成式第二人称阳性单数，直接对上帝说话，以上帝已经看见诗人所遭遇之事作为恳求的依据。“已经看见了”自然地表达其完成意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文的四字神名作音译，以区别于本节随后出现的称号 אֲדֹנָי（“主”）。
- source_word: אַל תֶּחֱרַשׁ
  choice: 不要沉默
  rationale: חרשׁ 在此意为“沉默、不作声”；结合上下文，也暗含不要置之不理，但正文保留原文的沉默意象，不直接释作“不要袖手旁观”。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝的称号“主”，在此按其固定用法处理，不将其形式中的历史性第一人称成分强化译为“我的主”。
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: 不要远离我
  rationale: רחק 与介词 מן 表达“离……远”；译文保留空间和关系兼具的隐喻，并用自然的现代汉语表达恳求。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名，而同节又使用称号 אֲדֹנָי。音译为“雅威”既保留专名性质，也清楚呈现两者的区别；不以“主”替代神名，以免抹平原文措辞。
- issue: “不要沉默”是否解释为“不采取行动”
  choice: 保留“不要沉默”的原文意象
  alternative: 不要置之不理
  rationale: 诗人的呼求很可能同时指向上帝的回应与行动，但原文以“沉默”表达这种张力。正文不把隐含意义限定为单纯的不作为。
translation_notes:
  register: 采用简洁、庄重而现代的祈求语体。两次呼语分别译作“雅威啊”和“主啊”，保留希伯来诗句的平行结构及神名与称号之别；标点分成两个紧密相连的祈求句。
