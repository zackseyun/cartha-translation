  text: הַחֲזֵ֣ק מָגֵ֣ן וְ/צִנָּ֑ה וְ֝/ק֗וּמָ/ה בְּ/עֶזְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/002.yaml
  text: Take hold of shield and buckler[a], and rise up for my help.
translation:
  language: zh_hans
  text: 拿起盾牌和大盾[a]，起来帮助我！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里用了两个不同的盾牌名称；后一个通常指遮护范围较大的盾。
    reason: 说明原文的词汇区别，并解释“大盾”的译法。
lexical_decisions:
- source_word: הַחֲזֵק
  choice: 拿起
  rationale: 此处是祈使式，描写上帝拿起武器准备应战；“拿起”在现代汉语中自然、具体，也保留了军事意象。
- source_word: מָגֵן
  choice: 盾牌
  rationale: מָגֵן是常用的盾牌名称，译作“盾牌”准确自然。
- source_word: צִנָּה
  choice: 大盾
  rationale: צִנָּה通常指能遮护身体的较大型盾，与前面的מָגֵן有别；“大盾”既保留两词的区别，也避免“圆盾”等可能与大小不符的表达。
- source_word: וְקוּמָה
  choice: 起来
  rationale: קום的祈使式带呼求语气，敦促上帝立即介入；“起来”简洁有力，符合诗歌和战斗语境。
- source_word: בְּעֶזְרָתִי
  choice: 帮助我
  rationale: 介词ב与עֶזְרָה在这里表示为诗人施援；汉语用动词短语“帮助我”最为自然，同时准确传达行动指向。
theological_decisions:
- issue: 以军事形象描写上帝
  choice: 保留上帝拿起两种盾并起来援助诗人的具体形象。
  alternative: 弱化为一般性的保护或援助请求。
  rationale: 希伯来文本明确采用战士和防御兵器的意象。直译其核心形象，可保留诗篇中上帝作为争战护卫者的描写，而不将其抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语言。“拿起……起来……”保留两个祈使动作及原文的紧迫感；句末用感叹号体现呼求语气。
