  text: Let them not say in their heart[a], “Aha, our desire!” Let them not say, “We have swallowed him up.”
translation:
  language: zh_hans
  text: 不要让他们心里说：“啊哈，正合我们的心愿[a]！”不要让他们说：“我们已经把他吞了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的心愿”“正是我们所想要的”。希伯来词 נֶפֶשׁ 可指魂、性命、自身或欲望；此处很可能指内心所愿或欲望得到满足，而非与身体相对的灵魂。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יֹאמְרוּ
  choice: 不要让他们说
  rationale: אַל与未完成式在祷告中表达否定的祈愿；译为“不要让他们说”既体现诗人向上帝的恳求，也符合现代汉语。
- source_word: בְלִבָּם
  choice: 心里
  rationale: 希伯来文直译为“在他们的心中”，表示内在的念头；“心里说”是自然、简洁的汉语表达。
- source_word: הֶאָח
  choice: 哈哈
  rationale: 这是幸灾乐祸、得意欢呼的感叹词；“哈哈”能传达敌人恶意庆幸的语气。
- source_word: נַפְשֵׁנוּ
  choice: 正合我们的心愿
  rationale: נֶפֶשׁ本义范围包括生命、自我、咽喉、欲望等；在此得意的感叹中，最可能指愿望得到满足。“正合我们的心愿”自然地表达这一语用含义，同时以脚注保留原词的多义性。
- source_word: בִּלַּעֲנוּהוּ
  choice: 我们已经把他吞灭了
  rationale: בלע意为吞下、吞没或毁灭；“吞灭”保留生动的吞噬意象，也表达敌人自夸已彻底击败诗人的语气。
