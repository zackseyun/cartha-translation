source:
  edition: WLC
  text: יֵבֹ֣שׁוּ וְ/יִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָח֣וֹר וְ/יַחְפְּר֑וּ חֹ֝שְׁבֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/004.yaml
  text: Let those who seek my life be put to shame and humiliated[b][a]; let those who devise my harm turn back and be disgraced.
translation:
  language: zh_hans
  text: 愿那些寻索我性命的人蒙羞受辱[a]；愿那些图谋害我的人退后抱愧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寻索我性命”也可直译为“寻索我生命（נפש）”；这里的希伯来习语指企图取我的性命。
    reason: lexical_alternative
  - marker: b
    text: “图谋害我”也可译为“图谋恶事攻击我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: 蒙羞
  rationale: בוש在此表达遭受羞耻；“蒙羞”自然、庄重，并与祈愿语气相合。
- source_word: וְיִכָּלְמוּ
  choice: 受辱
  rationale: כלם的尼法勒形态带有被动或结果意味；“受辱”既保留这一点，也避免与“蒙羞”完全重复。
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: 寻索我性命的人
  rationale: נפש在敌意性的“寻索”语境中指人的性命，而非抽象的灵魂；“寻索我性命”也保留了希伯来表达的力度。
- source_word: יִסֹּגוּ אָחוֹר
  choice: 退后
  rationale: סוג与אָחוֹר合用表示后退、败退；汉语“退后”简洁地保留了行动方向和受挫意味。
- source_word: וְיַחְפְּרוּ
  choice: 抱愧
  rationale: חפר在此指羞愧而非字面上的挖掘；“抱愧”与前半句的羞辱词汇相呼应，又有所区别。
- source_word: חֹשְׁבֵי רָעָתִי
  choice: 图谋害我的人
  rationale: חשב表示筹划、谋算，רעה加第一人称后缀在这里指针对诗人的祸害；“图谋害我”自然并明确表达敌意。
theological_decisions:
- issue: 祈愿或咒诅性的未完成式
  choice: 用“愿……愿……”表达祈求
  alternative: 译作陈述性的将来：“他们必蒙羞……”
  rationale: 这些未完成式单独看可有形式上的歧义，但在向上帝求助的诗歌语境中，最自然地表达祈愿。采用“愿”保留诗人求上帝施行审判的语气，而不将其化为单纯预言。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈愿语体。“蒙羞受辱”与“退后抱愧”保留原文两组平行的羞耻词汇；不把几个近义动词压平为同一措辞。所有脚注标记均置于对应正文之后。
