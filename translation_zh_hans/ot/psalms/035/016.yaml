    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַנְפֵי
  choice: 在……不敬神的……中
  rationale: חנף可指亵渎、不敬虔或虚伪的人；此处描述敌意嘲弄者，译作“不敬神”既保留其道德—宗教意味，也避免把含义缩窄为表里不一。前缀בְּ按处所或关联义译为“在……中”。
- source_word: לַעֲגֵי
  choice: 嘲笑者
  rationale: 源自לעג，指嘲弄、讥笑他人的人；“嘲笑者”是自然、清楚的现代汉语表达。
- source_word: מָעוֹג
  choice: 席间
  rationale: 此词罕见且词义不确定，可能与宴饮、饼或一口食物有关。正文采用“席间”，表达可能的宴席场景，同时以脚注保留其他词源和释义可能。
- source_word: חָרֹק
  choice: 咬牙切齿
  rationale: חרק表示磨牙或切齿，是敌意的表现；汉语成语“咬牙切齿”准确而自然。
- source_word: עָלַי
  choice: 向我
  rationale: 与“咬牙切齿”搭配，“向我”自然地表达敌意所针对的对象。
- source_word: שִׁנֵּימוֹ
  choice: （含于“咬牙切齿”）
  rationale: 原文直指“他们的牙齿”；汉语“咬牙切齿”已明确包含牙齿的动作，若另译“他们的牙齿”会显得累赘。主语“他们”则显明复数后缀所指。
