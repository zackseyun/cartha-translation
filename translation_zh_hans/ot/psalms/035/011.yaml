  text: 凶暴的证人起来[a]，问我所不知道的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译“强暴的证人”“恶意的证人”或“作假见证的人”；希伯来文直译为“暴力的证人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקוּמוּן
  choice: 起来
  rationale: 源自动词קום；在敌对、近似诉讼的语境中，指证人起身作证或站出来控告。“起来”保留原文鲜明而简洁的表达。
- source_word: עֵדֵי חָמָס
  choice: 凶恶的证人
  rationale: 字面为“暴力／强暴的证人”。חָמָס可指暴力、恶行或不公；“凶恶的证人”在现代汉语中自然，并保留其加害、不义的色彩，而没有直接限定为“作假见证”。
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: 我所不知道的事
  rationale: 希伯来文关系从句没有明说宾语；汉语补出“事”，既符合语法，又保留所问内容未明确的含混性。
- source_word: יִשְׁאָלוּנִי
  choice: 盘问我
  rationale: שׁאל通常表示询问、求问或索求；此处有敌对证人和控告的司法语境，“盘问”比普通的“问”更能体现压力，同时未强化到正式审讯的程度。
