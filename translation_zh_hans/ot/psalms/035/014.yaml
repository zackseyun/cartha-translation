base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/014.yaml
  text: I walked about as though he were my friend[a], as though he were my brother; I bowed down in gloom[c][b], like one mourning for a mother.
translation:
  language: zh_hans
  text: 我待他如同待自己的朋友、弟兄[a]；我屈身低头，神情阴郁[b]，如同为母亲哀悼的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“我像朋友、像对我而言的弟兄那样行走（或行事）”。这简略的比较语在上下文中表示：我待他如亲密的朋友或弟兄。
    reason: lexical_alternative
  - marker: b
    text: “神情阴郁”所译的希伯来语本有“昏暗、变黑”的意思；在这里形容哀伤时黯淡、沮丧的容貌。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֵעַ כְּאָח לִי
  choice: 仿佛他是我的朋友、我的弟兄
  rationale: רֵעַ意为“朋友、同伴”，אָח意为“弟兄”；两个比较前缀כְּ并列，表达亲密关系。לִי直译为“对我而言”，汉语以“我的”自然传达其关系意义；“他是”由上下文补出，并用脚注保留原文表达的简略性。
- source_word: הִתְהַלָּכְתִּי
  choice: 我来往行事
  rationale: הלך的Hitpael形式在这里既可描写来来往往，也可指一贯的行为方式。“来往行事”兼顾具体行动与待人方式。
- source_word: כַּאֲבֶל אֵם
  choice: 如同为母亲哀悼的人
  rationale: אֲבֶל指哀悼者，אֵם为“母亲”；比较前缀כַּ表明这是明喻。译文不添加“他的”，保留希伯来文仅说“母亲”的简洁表达。
- source_word: קֹדֵר
  choice: 神情阴郁
  rationale: קדר本义涉及昏暗、变黑，在哀悼语境中描写忧郁黯淡的外貌。“神情阴郁”既传达哀容，也避免把它与前面的“哀悼者”合并为同一成分。
- source_word: שַׁחֽוֹתִי
  choice: 我低头弯腰
  rationale: 该动词表达俯身、屈身或低垂的姿态。“低头弯腰”具体呈现悲痛使人身体低伏的形象。
theological_decisions: []
