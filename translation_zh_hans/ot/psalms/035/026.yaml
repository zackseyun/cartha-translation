  text: יֵ֘בֹ֤שׁוּ וְ/יַחְפְּר֨וּ יַחְדָּו֮ שְׂמֵחֵ֪י רָעָ֫תִ֥/י יִֽלְבְּשׁוּ בֹ֥שֶׁת וּ/כְלִמָּ֑ה הַֽ/מַּגְדִּילִ֥ים עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/026.yaml
  text: Let those who rejoice at my harm be put to shame and humiliated together[a]; let those who magnify themselves against me be clothed with shame and disgrace.
translation:
  language: zh_hans
  text: 愿那些为我的祸患而欢喜的人一同蒙羞受辱；愿那些向我自高自大的人[a]披上羞愧和耻辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向我自高自大”也可译作“在我之上自抬身价”或“向我夸耀”。希伯来文直译是“在我之上使自己为大”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ
  choice: 蒙羞受辱
  rationale: 两个未完成式在祈愿语境中表达愿望；“蒙羞受辱”自然保留两个彼此加强的羞辱概念及咒诅性祈求的力度。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 表达这一群人共同承受同一结局。
- source_word: שְׂמֵחֵי רָעָתִי
  choice: 那些因我遭祸而欢喜的人
  rationale: רָעָתִי 在此指临到诗人的祸患或伤害，而非诗人所行的道德之恶；“因我遭祸而欢喜”符合现代汉语表达。
- source_word: יִלְבְּשׁוּ
  choice: 披上
  rationale: 保留希伯来文以衣物比喻羞辱临身、将人包裹的意象。
- source_word: בֹשֶׁת וּכְלִמָּה
  choice: 羞耻和耻辱
  rationale: 以两个近义词对应原文的加强表达，同时保持庄重、清楚。
- source_word: הַמַּגְדִּילִים עָלָי
  choice: 那些向我自高的人
  rationale: גדל 的使役分词与 עַל 连用，描写人在诗人面前或针对诗人抬高自己；“向我自高”保留傲慢自抬的含义，并避免把意象限缩为言语上的夸口。
theological_decisions:
- issue: 祈愿句的审判力度
  choice: 用“愿……蒙羞受辱；愿……披上……”保留诗人的祈求
  alternative: 改写为对仇敌将来结局的陈述
  rationale: 原文未完成式在此具有祈愿或祷告色彩，不宜弱化为一般预测，也不额外说明审判如何实现。
translation_notes:
  register: 采用现代、庄重且易懂的祷告体。“遭祸”避免把 רָעָה 误解为诗人的道德邪恶；“披上”保留原文鲜明的衣着隐喻。脚注标记置于相关分句之后。
