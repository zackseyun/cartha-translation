  text: דִּבְרֵי פִ֭י/ו אָ֣וֶן וּ/מִרְמָ֑ה חָדַ֖ל לְ/הַשְׂכִּ֣יל לְ/הֵיטִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/003.yaml
  text: The words of his mouth are wickedness and deceit; he has ceased to act wisely[a], to do good.
translation:
  language: zh_hans
  text: 他口中的话尽是罪恶和诡诈；他已不再明智行事[a]，不再行善。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他已不再有行善的智慧。”希伯来文的两个不定式也可理解为关系紧密的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִיו
  choice: 他口中的话
  rationale: 保留“口”这一具体的希伯来语表达，同时用现代汉语自然地表达从他口中说出的话。
- source_word: אָוֶן
  choice: 罪恶
  rationale: 该词可指祸患、邪恶或罪孽；此处与“诡诈”并列，描述言语的道德败坏，译为“罪恶”较准确。
- source_word: וּמִרְמָה
  choice: 和诡诈
  rationale: מִרְמָה 表示欺骗、诡诈或背信；在言语语境中，“诡诈”既凝练又保留其道德意味。
- source_word: חָדַל
  choice: 已不再
  rationale: 表达 Qal 完成式所指的停止、放弃某种行为，也符合现代汉语习惯。
- source_word: לְהַשְׂכִּיל
  choice: 明智行事
  rationale: שׂכל 的 Hiphil 在此侧重实践上的洞察与审慎行动；“明智行事”比单纯“有智慧”更贴合语境。
- source_word: לְהֵיטִיב
  choice: 行善
  rationale: יטב 的 Hiphil 不定式可指做好事、行得好；此处采用简洁而具有道德含义的“行善”。
theological_decisions:
- issue: 两个不定式 לְהַשְׂכִּיל 与 לְהֵיטִיב 的句法关系
  choice: 作为“已不再”的两个并列补语，译作“不再明智行事，不再行善”
  alternative: 将二者紧密结合，译作“不再有行善的智慧”或“不再善于行善”
  rationale: 希伯来文容许把两个不定式视为并列，也可能把后者理解为与前者关系紧密。正文采用较直接的并列分析，脚注保留另一种可能，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“他口中的话”保留原文具象表达；重复“不再”使两个并列动作在中文中清楚自然。
