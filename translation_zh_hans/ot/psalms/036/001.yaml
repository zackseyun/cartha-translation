  yaml_path: translation/ot/psalms/036/001.yaml
  text: 'Transgression speaks to the wicked within my heart: there is no fear of God before his eyes[a][b].'
translation:
  language: zh_hans
  text: 在我心中，过犯向恶人宣告：他眼前没有对上帝的敬畏。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“在我心中”。有些古代译本和现代译本将其调整为“在他心中”，或意译为“我心里得知有关恶人的信息”。
    reason: alternative_reading
  - marker: b
    text: 直译式语序可作：“过犯在我心中向恶人宣告。”此处“我心中”与下文“他眼前”的人称转换保留了希伯来文本的困难表达。
    reason: alternative_construal
lexical_decisions:
- source_word: נְאֻם
  choice: 发言
  rationale: 该词通常指庄重的言说、宣告或神谕。这里将名词性表达自然地译为“发言”，既保留拟人化语气，也避免把过犯的话误解为来自上帝的神谕。
- source_word: פֶּשַׁע
  choice: 过犯
  rationale: 该词表示悖逆、蓄意越界或作恶。“过犯”保留其道德与盟约层面的分量，又不过度限定为法律意义上的罪行。
- source_word: לָרָשָׁע
  choice: 向恶人
  rationale: 介词לְ最自然地表示言说的对象；“恶人”保留希伯来文单数的代表性用法。
- source_word: בְּקֶרֶב לִבִּי
  choice: 在我心中
  rationale: 马所拉文本明确为第一人称单数“我的心”。译文保留这一困难读法，不擅自改成“他的心”；中文将其置于动词前，使之较自然地表示诗人内心所听见或领会的言语。
- source_word: אֵין פַּחַד אֱלֹהִים
  choice: 毫无对上帝的敬畏
  rationale: “敬畏上帝”是该希伯来语表达的惯常含义，兼有敬重与畏惧，不应窄化为单纯的恐怖。
- source_word: לְנֶגֶד עֵינָיו
  choice: 在他眼前
  rationale: 直译并保留“摆在眼前、纳入考量”的希伯来语意象，同时在现代汉语中通顺可懂。
theological_decisions:
- issue: לִבִּי（“我的心”）所造成的人称与视角张力
  choice: 保留马所拉文本的第一人称“在我心中”，同时以“他眼前”继续指向恶人。
  alternative: 依古代译本或校勘改作“在他心中”，或意译为“我心里得知有关恶人的信息”。
  rationale: 现存希伯来文本支持“我的心”。虽然这一读法语义困难，但不应为求顺畅而无提示地改动人称；译文与脚注共同保留诗人在自己心中察知恶人悖逆的张力。
- issue: פֶּשַׁע的拟人化
  choice: 把“过犯”作为发言者，译作“过犯……向恶人发言”。
  alternative: 把整句解释为诗人所得的“有关恶人过犯的宣告”。
  rationale: 希伯来语表面结构容许将“过犯”视为宣告的来源或发言者；保留拟人化可避免提前消解原文的句法含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“过犯”与“敬畏上帝”保持诗篇的宗教伦理语域；保留原文拟人化以及“我的心／他的眼”之间不寻常的人称转换，并以脚注说明主要异读和句法可能性。
