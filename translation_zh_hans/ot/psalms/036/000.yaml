base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/000.yaml
  text: For the choirmaster[a]. Of David[d][c][b], the servant of Yahweh.
translation:
  language: zh_hans
  text: 交给乐长[a]。雅威的仆人、大卫的诗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“交给音乐指挥”。原词指圣殿或礼仪音乐的负责人。
    reason: lexical_alternative
  - marker: b
    text: “大卫的诗”也可理解为“属于大卫”“为大卫而作”或“与大卫有关”。希伯来语的介词表示宽泛的归属或关联，仅凭这个标题不能完全断定它专指作者身份。原文的结构为“雅威的仆人，大卫的”，通常理解为“大卫”是“雅威的仆人”的同位说明。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇标题中指负责圣殿或礼仪音乐的领唱、指挥者；“乐长”简洁庄重，也比泛称“领袖”更能体现音乐职分。
- source_word: לְעֶבֶד
  choice: ……的仆人
  rationale: עֶבֶד 在这里是尊荣性的身份称号，强调大卫事奉雅威，并非突出受奴役的社会身份，因此译作“仆人”而非“奴隶”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名，译作其常见的现代汉语音译“雅威”，保留其作为专名的性质，不以“主”这一称号替代。
- source_word: לְדָוִד
  choice: 大卫之作
  rationale: 诗篇标题中的 לְדָוִד 表示与大卫有关的归属或署名；正文采用自然的标题表达“之作”，同时用脚注说明希伯来语本身并未完全限定为作者署名。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”直接保留原文中的神名，避免把专名改成称号；“耶和华”是传统汉译音译，“主”则属于替代性读法。
- issue: 标题中 עֶבֶד 的语义
  choice: 仆人
  alternative: 奴仆；奴隶
  rationale: 此处是“大卫”所得的尊荣性宗教称号；“仆人”符合标题语域，又不额外突出法律或社会上的奴隶身份。
- issue: לְדָוִד 所表达的归属关系
  choice: 大卫之作，并以脚注保留宽泛归属义
  alternative: 为大卫而作；属于大卫；与大卫有关
  rationale: 传统标题语境支持作者署名式理解，但介词 לְ 本身范围较宽，不能仅凭这一形式排除献给、属于或与大卫相关等可能，因此不在脚注中消除歧义。
translation_notes:
  register: 采用简洁、庄重的诗篇标题体。“交给乐长”保留礼仪音乐背景；“雅威的仆人大卫”自然地表达同位关系。正文使用“之作”使现代读者容易理解，同时脚注明确保留 לְדָוִד 的真实语义宽度。
