source:
  edition: WLC
  text: אַל תְּ֭בוֹאֵ/נִי רֶ֣גֶל גַּאֲוָ֑ה וְ/יַד רְ֝שָׁעִ֗ים אַל תְּנִדֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/011.yaml
  text: Let not the foot of pride come against me[b][a], and let not the hand of the wicked drive me away.
translation:
  language: zh_hans
  text: 愿骄傲的脚不要逼近我[a]；愿恶人的手不要把我赶走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“临到我”。希伯来语直译是“愿骄傲的脚不要来到我这里”。
    reason: lexical_alternative
  - marker: b
    text: 或译“使我流离”或“迫使我逃走”。这个动词可表示使人离开原处。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבוֹאֵנִי
  choice: 逼近我
  rationale: בוא的基本意思是“来、到达”；以“骄傲的脚”为主语时，语境带有敌对逼迫之意。“逼近我”既保留移动意象，也自然传达威胁性，而不把动作具体化为“践踏”。
- source_word: רֶגֶל גַּאֲוָה
  choice: 骄傲的脚
  rationale: 直译为“骄傲的脚”。保留抽象名词“骄傲”及原文的身体意象，不直接解释成“骄傲人的脚”，使诗歌的凝练和拟人色彩得以保留。
- source_word: יַד רְשָׁעִים
  choice: 恶人的手
  rationale: “手”可指实际行动，也可象征力量或权势；译文保留这一开放性。“恶人”自然对应复数实体化形容词 רְשָׁעִים。
- source_word: תְּנִדֵנִי
  choice: 把我赶走
  rationale: 该使役形式表示使人离开原处、流离或逃走。“把我赶走”清楚表达强制性的驱离，同时不限定具体手段。
- source_word: אַל
  choice: 愿……不要
  rationale: אַל配合祈愿式动词，在此表达向上帝发出的祈求。“愿……不要”兼具祷告语气、诗体庄重感和现代汉语的可懂度。
theological_decisions: []
