  yaml_path: translation/ot/psalms/036/002.yaml
  text: For he flatters himself in his own eyes too much to find his iniquity and hate it[a].
translation:
  language: zh_hans
  text: 因为他在自己眼中奉承自己，以致察觉不到自己的罪孽，也不恨恶它。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“因为他在自己眼中向自己说圆滑话，去发现自己的罪孽并恨恶。”希伯来文句法较难，末尾两个不定式之间的关系也不完全确定；大意可能是，他的自我奉承使他不能认清并弃绝自己的罪。
    reason: 说明 הֶחֱלִיק 的“圆滑”字面意象，并保留 לִמְצֹא……לִשְׂנֹא 的句法歧义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，为恶人不敬畏上帝的状态提出解释；现代汉语用“因为”自然清楚。
- source_word: הֶחֱלִיק אֵלָיו
  choice: 奉承自己
  rationale: החליק 的基本意象是“使光滑”，在此与 אֵלָיו 连用，宜理解为对自己说圆滑、讨好的话，即自我奉承。
- source_word: בְּעֵינָיו
  choice: 在自己眼中
  rationale: 保留希伯来语惯用表达，指按他自己的看法或自我评价。
- source_word: לִמְצֹא
  choice: 察觉
  rationale: 在道德语境中，“察觉”比字面的“找到”更自然，表达认清自身罪孽。
- source_word: עֲוֹנוֹ
  choice: 自己的罪孽
  rationale: עָוֹן 可指罪恶或罪责；“罪孽”保留其较强的道德分量，同时不把含义限缩为单纯的罪责。
- source_word: לִשְׂנֹא
  choice: 恨恶它
  rationale: 以“它”明确回指“罪孽”；“恨恶”符合庄重的诗篇语体。
- source_word: לִמְצֹא עֲוֹנוֹ לִשְׂנֹא
  choice: 以致察觉不到自己的罪孽，也不恨恶它
  rationale: 希伯来语句法压缩且困难。正文采用与上下文相符的阻碍性理解：自我奉承使他不能认罪并弃绝罪；脚注保留较直译的结构及其歧义。
theological_decisions:
- issue: 本节的道德心理含义
  choice: 恶人因自我奉承而不能察觉并恨恶自己的罪孽。
  alternative: 他奉承自己，直到他的罪孽被发现为可恨；或他在自己眼中向自己说圆滑的话。
  rationale: 上下文描写恶人内心不敬畏上帝及其败坏行为，故自欺的理解最连贯；但原文两个不定式的关系并不完全明确，因此在脚注中保留其他理解空间。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语言。“奉承自己”自然传达自欺意味；“在自己眼中”保留原文意象。正文为清晰而补出否定含义，脚注提示原文并无显式否定词且句法存在歧义。
