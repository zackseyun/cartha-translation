base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/008.yaml
  text: They are filled from the richness of your house[b][a], and you give them drink from the river of your delights.
translation:
  language: zh_hans
  text: 他们饱享你家中的丰盛[a]；你使他们畅饮你欢愉的河水[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们从你家中的丰盛得享饱足。”
    reason: lexical_alternative
  - marker: b
    text: “欢愉”也可译作“乐趣”或“愉悦”；这里的希伯来语可能与“伊甸”一词形成文字回响。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְוְיוּן
  choice: 饱享
  rationale: 该词是רוה的Qal未完成式第三人称阳性复数，表示喝足、饱足或充分满足。“饱享”既传达丰足满足的结果，也与下半句饮水的意象自然呼应。
- source_word: מִדֶּשֶׁן
  choice: 丰盛
  rationale: דֶּשֶׁן本指“肥美、丰厚”，在此比喻丰富充裕。“丰盛”在现代汉语中自然，并保留其富足意象。
- source_word: בֵּיתֶךָ
  choice: 你家中
  rationale: 原文直译为“你的家/房屋”。译作“你家中”保留这一开放意象，不限定为圣殿、天上居所或家属。
- source_word: וְנַחַל
  choice: 河水
  rationale: נַחַל可指河流、溪流或河谷中的水道；此处描绘从上帝而来的丰沛供应，用“河水”能自然呈现充盈、赐生命的诗歌意象。
- source_word: עֲדָנֶיךָ
  choice: 你喜乐的
  rationale: 该词表示欢愉、愉悦、享乐，与“伊甸”在词形和语义上可能形成回响。“喜乐”保留正面的愉悦含义，而不把可能的伊甸联想直接写入正文。
- source_word: תַשְׁקֵם
  choice: 你使他们畅饮
  rationale: 这是שקה的Hiphil形式，表示“使他们喝、给他们喝”。“你使他们畅饮”保留上帝主动供应的含义，也在汉语中传达喝得充足的语境。
theological_decisions:
- issue: “上帝的家”的意象
  choice: 保留“你家中”，不具体指明圣殿或天上居所
  alternative: 你的圣殿中／你的居所中／你的家室中
  rationale: 原文以“你的家”描绘亲近上帝并领受供应，但没有明定其制度性、空间性或末世性的所指；正文因此保留其诗意和神学上的开放性。
- issue: “喜乐”与伊甸的潜在回响
  choice: 正文译作“你喜乐的河水”，将伊甸联想置于脚注
  alternative: 你伊甸般喜乐的河水
  rationale: עֲדָנֶיךָ确实可能使读者联想到“伊甸”，但原文并未明确写出专名；不宜在正文中把可能的文字回响确定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“饱享”与“畅饮”形成平行，传达原文丰足供应的意象；分号呈现两小句紧密相连的希伯来诗歌结构。
