  text: כִּֽי עִ֭מְּ/ךָ מְק֣וֹר חַיִּ֑ים בְּ֝/אוֹרְ/ךָ֗ נִרְאֶה אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/009.yaml
  text: For with you is the fountain of life[b][a]; in your light we see light.
translation:
  language: zh_hans
  text: 因为生命的泉源在你那里[a]；在你的光中，我们得见光[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泉源”也可译作“泉”或“生命的源头”。
    reason: lexical_alternative
  - marker: b
    text: “在你的光中”也可译作“借着你的光”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明此前赞美与祈求的根据；“因为”自然保留因由关系。
- source_word: עִמְּךָ
  choice: 在你那里
  rationale: עִם带第二人称单数阳性后缀，直译为“与你同在”；结合“泉源”的存在与归属意象，“在你那里”是自然的中文表达，同时不将其限缩为单纯空间或经验意义。
- source_word: מְקוֹר
  choice: 泉源
  rationale: 该词指泉、泉眼或源头；“泉源”既保留具体诗歌意象，也能表达生命由此而出的来源意义。
- source_word: חַיִּים
  choice: 生命
  rationale: 该词形态上为复数，但在此惯用作抽象名词，中文以单数概念“生命”表达最自然。
- source_word: בְּאוֹרְךָ
  choice: 在你的光中
  rationale: 介词בְ可表示“在……中”或“借着”；正文采用“在……中”以保存希伯来文的空间性诗歌意象，不将其缩减为纯工具意义。
- source_word: נִרְאֶה
  choice: 我们得见
  rationale: ראה的Qal未完成式第一人称复数在诗歌语境中表达一般事实；“得见”自然庄重，并略微体现这种看见是在上帝之光中成为可能。
- source_word: אוֹר
  choice: 光
  rationale: 直接译作“光”，并保留原文前后重复“光”的修辞和神学意象。
theological_decisions:
- issue: 上帝之光与生命意象的隐喻力量
  choice: 保留“生命的泉源”和“在你的光中，我们得见光”的隐喻
  alternative: 释义为“你是一切生命的源头”或“借着你的真理，我们才能明白”
  rationale: 原文以开放而丰富的诗歌意象表达上帝与生命、光照的关系；直保留这些隐喻，避免将其限定为某一种教义解释。
- issue: בְּאוֹרְךָ中介词בְ的语义
  choice: 正文译为“在你的光中”
  alternative: “借着你的光”
  rationale: 两者在语法上均有可能；正文保留较具诗意和包容性的处境性表达，并以脚注注明工具性理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文；保留“生命—泉源”与“光—见光”的平行和重复。脚注标记均置于正文相关词句之后。
