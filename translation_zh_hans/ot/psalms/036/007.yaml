  text: מַה יָּקָ֥ר חַסְדְּ/ךָ֗ אֱלֹ֫הִ֥ים וּ/בְנֵ֥י אָדָ֑ם בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ יֶחֱסָיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/007.yaml
  text: How precious is your steadfast love[b][a], O God! The children of man take refuge in the shadow of your wings.
translation:
  language: zh_hans
  text: 神啊，你的慈爱[a]何其宝贵！世人投靠在你翅膀的荫下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”所译的希伯来语也可包含忠诚、怜悯、信实之爱或守约不渝的爱等意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּקָר
  choice: 何其宝贵
  rationale: מַה在这里引出感叹，并非疑问；“何其宝贵”既保留诗体的赞叹语气，也表达极高的价值。
- source_word: חַסְדְּךָ
  choice: 你的慈爱
  rationale: חֶסֶד兼有爱、怜悯、忠诚与守约不渝等意涵；“慈爱”是简洁、自然且具有尊严的中文表达，并以脚注提示其丰富语义。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 此处是直接呼语；“神啊”自然呈现希伯来语的呼格作用。
- source_word: וּבְנֵי אָדָם
  choice: 世人
  rationale: 该短语直译为“人的众子”，在这里泛指人类；“世人”准确、简练，也符合现代汉语诗歌表达，不把所指限于男性。
- source_word: בְּצֵל כְּנָפֶיךָ
  choice: 在你翅膀的荫下
  rationale: 保留翅膀遮蔽保护的诗性比喻；“荫下”自然传达צֵל的阴影、庇护之意。
- source_word: יֶחֱסָיוּן
  choice: 投靠
  rationale: חסה表示寻求或取得庇护；“投靠”保留主动信赖并寻求保护的含义，且没有把未明说的结果过度具体化。
theological_decisions:
- issue: חֶסֶד的多重关系性含义
  choice: 慈爱
  alternative: 信实的爱；守约之爱；怜悯
  rationale: 正文采用普通读者容易理解的“慈爱”，但不把该词仅限于情感或怜悯；脚注保留其可能包含的忠诚、信实和守约内涵。
- issue: בְנֵי אָדָם的集体所指
  choice: 世人
  alternative: 人的众子；人类
  rationale: 该阳性复数习语在语境中泛指人，不只指男性。“世人”既忠实表达集体所指，又避免生硬直译造成性别范围误解。
- issue: 神之“翅膀”的意象
  choice: 保留“翅膀的荫下”
  alternative: 你的庇护下
  rationale: 原文以翅膀的荫影描绘神的保护；保留比喻，不将其消解为抽象的“庇护”，也不据此规定具体形象或形体。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“何其宝贵”保留感叹力度；“世人”自然表达全体人类；全句保留“翅膀的荫下”这一核心诗歌意象。
