  text: שָׁ֣ם נָ֭פְלוּ פֹּ֣עֲלֵי אָ֑וֶן דֹּ֝ח֗וּ וְ/לֹא יָ֥כְלוּ קֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/012.yaml
  text: There the workers of wickedness have fallen[b][a]; they are thrust down and cannot rise.
translation:
  language: zh_hans
  text: 在那里，作恶的人[a]已经倒下；他们被推倒，不能再起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作恶的人”也可译作“行邪恶之事的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们被击倒，无法站起来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: 在那里
  rationale: 按其通常的地点副词义翻译，指向作恶者败亡的所在；不改译为时间性的“那时”。
- source_word: נָפְלוּ
  choice: 倒
  rationale: נפל 的完成式描写已经发生并显出结果的倒下；汉语用“倒在那里”自然地呈现这一完成状态。
- source_word: פֹּעֲלֵי אָוֶן
  choice: 作恶的人
  rationale: 该结构直指实行、制造 אָוֶן 的人。“作恶的人”在现代汉语中自然简洁，并保留其主动行恶的含义。
- source_word: אָוֶן
  choice: 恶
  rationale: 此处主要是道德意义上的邪恶、罪恶，而非单指灾祸或烦恼。
- source_word: דֹּחוּ
  choice: 被推倒
  rationale: 按被动意义处理，表达他们遭到外力推倒或击倒；同时不擅自补出施动者。
- source_word: וְלֹא יָכְלוּ קוּם
  choice: 再也不能起来
  rationale: 表达倒下之后无力重新起身的结果。“再也”使汉语中的结果意味清楚，但不改变其无法起立的基本意象。
theological_decisions:
- issue: “被推倒”的施动者是否明确为上帝
  choice: 保留被动句，不明说施动者
  alternative: 译作“上帝把他们推倒”
  rationale: 希伯来文本使用被动形式而未明示施动者；上下文可能使读者联想到上帝的审判，但本节本身没有直接补出主语，因此译文保留这一开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“倒在那里”保留地点强调；分号呈现两行之间由败亡事实到彻底不能复起的推进。所有代词与被动结构均避免添加原文未明说的施动者。
