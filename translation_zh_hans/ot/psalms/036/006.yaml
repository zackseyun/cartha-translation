  text: צִדְקָֽתְ/ךָ֨ כְּֽ/הַרְרֵי אֵ֗ל מִ֭שְׁפָּטֶ/ךָ תְּה֣וֹם רַבָּ֑ה אָ֤דָֽם וּ/בְהֵמָ֖ה תוֹשִׁ֣יעַ יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/006.yaml
  text: Your righteousness is like the mountains of God[a]; your judgments are a great deep. O Yahweh[b], you save man and beast.
translation:
  language: zh_hans
  text: 你的公义如同上帝的群山[a]；你的审判如同浩瀚的深渊。雅威啊，你拯救人和兽类。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“上帝的群山”，也可能意为“巍峨的高山”或“至高的山岭”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“你保全人类和动物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: 你的公义
  rationale: “公义”兼顾道德正直与秉公行事的含义，也保留诗句中与“审判”相关而不完全相同的概念。
- source_word: כְּהַרְרֵי אֵל
  choice: 如同上帝的群山
  rationale: 直译“上帝的群山”，保留该结构既可指属于上帝的山，也可能是表示极高、极其雄伟的希伯来语表达这一歧义；惯用解释列入脚注。
- source_word: מִשְׁפָּטֶךָ
  choice: 你的审判
  rationale: 该词在此可指上帝的司法裁断或施行审判；译作“审判”可与前句“公义”保持词义区别。
- source_word: תְּהוֹם רַבָּה
  choice: 浩瀚的深渊
  rationale: “深渊”保留深不可测、与深水相关的诗歌意象，“浩瀚”自然表达 רַבָּה 在此所强调的广大。
- source_word: אָדָם
  choice: 人
  rationale: 这里是泛指人类的集合性用法；现代汉语“人”既简洁又能自然表达这种通称，不限定性别。
- source_word: וּבְהֵמָה
  choice: 和走兽
  rationale: 该词泛指兽类，常可特指牲畜；在“人和走兽”的诗歌配对中，“走兽”保留与人类相对的动物范畴，同时不把范围限定为家畜。
- source_word: תוֹשִׁיעַ
  choice: 你拯救
  rationale: 使役词形在此可表达拯救、搭救或保全；“拯救”保留其宽广含义和神学力度，不排除护理、保全之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代；呼格语气由“啊”表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威啊
  alternative: 耶和华啊；主啊
  rationale: 原文直接使用四字神名。正文采用“雅威”作为较贴近 Yahweh 的现代汉语音译，以保留专名性质；不用称号“主”替换。
- issue: אָדָם 的泛指范围
  choice: 人
  alternative: 世人；人类
  rationale: 原文以集合性的“人”与“走兽”并列，泛指整个人类而非某一男性个体。汉语“人”可自然保留简练的诗体和泛指意义。
- issue: “上帝的群山”的语义
  choice: 正文保留字面结构
  alternative: 巍峨的高山；至高的山岭
  rationale: אֵל 既可按“上帝”理解，也可能在这种结构中加强程度。正文不替读者消解这一真实歧义，脚注提供可能的惯用含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。平行句式保留希伯来诗歌的对称感；“群山—深渊”维持高与深的鲜明意象。“雅威啊”明确呈现呼告语气。
