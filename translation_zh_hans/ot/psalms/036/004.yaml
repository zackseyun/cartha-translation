  text: אָ֤וֶן יַחְשֹׁ֗ב עַֽל מִשְׁכָּ֫ב֥/וֹ יִ֭תְיַצֵּב עַל דֶּ֣רֶךְ לֹא ט֑וֹב רָ֝֗ע לֹ֣א יִמְאָֽס׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/004.yaml
  text: He devises wickedness on his bed[a]; he sets himself on a way that is not good; he does not reject evil.
translation:
  language: zh_hans
  text: 他在床上图谋恶事；他执意走在不善的道路上；他不厌弃邪恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָוֶן
  choice: 恶事
  rationale: 该词可指罪孽、邪恶或祸患；此处与“图谋”搭配，并与末句“邪恶”呼应，主要表达道德上的恶。“恶事”在现代汉语中自然，也体现所谋划之事。
- source_word: יַחְשֹׁב
  choice: 图谋
  rationale: חשב可表示思想、筹划或设计；以אָוֶן为宾语，并置于床上的场景中，强调有意谋划。“图谋”保留其蓄意性，又不过度增添具体阴谋内容。
- source_word: עַל מִשְׁכָּבוֹ
  choice: 躺在床上
  rationale: 原文直译为“在他的床上”。汉语译作“躺在床上”自然地呈现人在床上谋划的画面；“躺”是由床这一语境自然引出的最低限度补足。
- source_word: יִתְיַצֵּב
  choice: 执意走在
  rationale: 该词的反身形式可指使自己站定、站稳或选定立场。结合后面的“道路”，这里表达有意识地置身并坚持于某种行径；“执意走在”以自然汉语传达主动选择和定意坚持。
- source_word: עַל דֶּרֶךְ לֹא טוֹב
  choice: 在不善的道路上
  rationale: 保留“道路”这一行为方式的隐喻，并按原文保留“不善”的否定表达，不直接强化为“邪恶的道路”。
- source_word: רָע
  choice: 邪恶
  rationale: 此处作“厌弃”的宾语，指道德意义上的恶。“邪恶”直接清楚，并与前面的“恶事”有所区分。
- source_word: לֹא יִמְאָס
  choice: 不厌弃
  rationale: מאס可指拒绝、鄙弃或厌恶。这里“不厌弃”兼顾拒斥与憎恶的意味，符合对邪恶缺乏道德排斥的语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。三句保持原文由内心图谋、选择道路到不厌弃邪恶的递进；保留“不善”这一含蓄否定，没有将其直接改写为“恶”。
