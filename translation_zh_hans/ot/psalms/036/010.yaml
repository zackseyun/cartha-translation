  text: מְשֹׁ֣ךְ חַ֭סְדְּ/ךָ לְ/יֹדְעֶ֑י/ךָ וְ֝/צִדְקָֽתְ/ךָ֗ לְ/יִשְׁרֵי לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/010.yaml
  text: Continue your steadfast love to those who know you[b][a], and your righteousness to the upright in heart.
translation:
  language: zh_hans
  text: 求你向认识你的人延续你的慈爱[a]，也向心里正直的人延续你的公义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “延续”或译“伸展”或“施展”；原文直译为“拉长你的慈爱”。
    reason: lexical_alternative
  - marker: b
    text: “公义”或译“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשֹׁךְ
  choice: 延续
  rationale: 该命令式字面意为“拉、牵引、伸展”。以“慈爱”和“公义”为宾语时，“延续”自然表达诗人祈求上帝使这些恩惠持续临到人；脚注保留“伸展、施展”的空间意象。
- source_word: חַסְדְּךָ
  choice: 你的慈爱
  rationale: חֶסֶד在此指上帝忠贞、持久的恩爱。“慈爱”是简洁庄重且为普通中文读者易懂的表达，也不把词义限缩为单纯的怜悯。
- source_word: לְיֹדְעֶיךָ
  choice: 向认识你的人
  rationale: 保留“那些认识你的人”的关系性含义，并用“向”表达介词ל所指的施予对象。
- source_word: וְצִדְקָתְךָ
  choice: 也……你的公义
  rationale: צְדָקָה既可指公义，也可侧重正义。正文采用范围较宽的“公义”，与“慈爱”形成平行；另一译法列入脚注。
- source_word: לְיִשְׁרֵי לֵב
  choice: 向心里正直的人
  rationale: 该希伯来语习语描述内在品格正直；“心里正直的人”符合现代汉语，也保留了“心”的意象。
theological_decisions:
- issue: 如何呈现上帝两种属性的诗歌平行
  choice: 将חֶסֶד译为“慈爱”，将צְדָקָה译为“公义”，并让“延续”在两个平行分句中都明确出现。
  alternative: 将חֶסֶד译为“怜悯”或“信实之爱”，将צְדָקָה译为“正义”；也可只在首句写出动词，让第二句承前省略。
  rationale: 此译法保持原文对上帝慈爱与公义的并列祈求，不将二者套入后来的特定教义体系。汉语重复动词可清楚表明同一命令式同时支配两个宾语。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”明确呈现希伯来语命令式在祈求语境中的语气；两个分句重复“延续”，使希伯来诗歌的平行关系在中文中清楚自然。
