  text: יְ֭הוָה בְּ/הַ/שָּׁמַ֣יִם חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ עַד שְׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/005.yaml
  text: O Yahweh[a], your steadfast love is in the heavens; your faithfulness reaches to the clouds.
translation:
  language: zh_hans
  text: 耶和华啊，你的慈爱在诸天之中[a]；你的信实直达云霄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的慈爱高达诸天”；希伯来文也可理解为表示所达的范围，而不只是所在的位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代中文通行的专名“耶和华”直译神名，并用“啊”表达句首的呼告语气。
- source_word: בְּהַשָּׁמַיִם
  choice: 在诸天之中
  rationale: בְּ最自然地表示位置；“诸天”保留希伯来文复数及诗歌语体，“之中”使中文表达完整自然。原文也可能表示延伸所达的范围，故加注说明。
- source_word: חַסְדֶּךָ
  choice: 你的慈爱
  rationale: חֶסֶד在此指坚定、忠诚且持久的爱；“慈爱”是自然庄重的现代圣经用语，可兼顾恩慈与忠贞的内涵。
- source_word: אֱמוּנָתְךָ
  choice: 你的信实
  rationale: אֱמוּנָה在与חֶסֶד平行时着重可靠、忠诚的品格；“信实”准确而简洁。
- source_word: עַד
  choice: 直达
  rationale: עַד表示达到某一界限；“直达”在中文诗句中自然地表达延伸至高处的范围。
- source_word: שְׁחָקִים
  choice: 云霄
  rationale: שְׁחָקִים可指云层或高空；“云霄”保留具体的高天意象，并与“诸天”形成自然的诗歌平行。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。采用现代中文读者最熟悉的专名“耶和华”，不以“主”替代，从而保留其作为神圣专名的功能；“雅威”是较接近学界重构发音的另一译法。
- issue: 首句介词短语表示位置还是范围
  choice: 正文译为位置：“在诸天之中”
  alternative: 范围：“高达诸天”
  rationale: בְּ通常首先表示位置，因此正文保留其直接句法意义；但诗歌平行关系可能使该短语表达慈爱延伸所达的高度，故用脚注保存这一真实歧义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。两个分句保持希伯来诗歌的平行结构；“诸天”和“云霄”保留高天意象，避免过度解释其神学含义。
