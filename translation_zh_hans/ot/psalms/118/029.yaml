source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/029.yaml
  text: Give thanks to Yahweh[a], for he is good, for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 你们要称谢雅威，因为他是良善的；他的慈爱永远长存[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文更直译为：“他的慈爱直到永远。”原文没有明写“长存”一词。
    reason: 说明末句无显式动词的字面句法；正文补出“长存”以符合现代汉语表达。
lexical_decisions:
- source_word: הוֹדוּ
  choice: 你们要称谢
  rationale: 这是 ידה 的使役词干复数祈使式；“称谢”既表达感谢，也保留诗篇礼仪性赞美的语气。明说“你们”体现希伯来文的复数命令。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 介词 ל 标明称谢的对象；יהוה 是上帝的专名，采用现代汉语音译“雅威”，不以称号代替专名。
- source_word: כִּי טוֹב
  choice: 因为他是良善的
  rationale: כִּי 引出称谢的理由；希伯来文省略系词和主语，汉语自然表达需补出“他是”。“良善”准确表达 טוֹב 在此对上帝品格的描述。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 字面义为“直到永远”。汉语正文补入“长存”，使无动词的希伯来文名词句读来自然；脚注保留更贴近原句结构的译法。
- source_word: חַסְדּוֹ
  choice: 他的忠贞之爱
  rationale: חֶסֶד 兼有慈爱、忠诚和持守关系的意味。“忠贞之爱”避免只突出怜悯或情感，同时不把经文限定为某一套神学术语。
theological_decisions:
- issue: 如何译写神名 יהוה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质；“耶和华”是传统但较不符合该名较通行的读音重构，“上主”则属于称号。
- issue: 如何表达 חֶסֶד
  choice: 忠贞之爱
  alternative: 慈爱；信实的爱；怜悯
  rationale: 该词的语义既涉及恩慈之爱，也涉及忠诚与持守；“忠贞之爱”较能兼顾这些层面，而不把含义收窄为单纯怜悯。
- issue: 末句是否补出“长存”
  choice: 正文补出“长存”，脚注注明字面结构
  alternative: 他的忠贞之爱直到永远
  rationale: 原文 כִּי לְעוֹלָם חַסְדּוֹ 是无显式动词的名词句。补出“长存”符合现代汉语，也不改变其持续到永远的意义；脚注让读者看见原文保留的简练表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们要称谢”保留复数祈使语气；分号呈现两个理由之间的诗歌节奏。避免古奥词语，同时保留礼仪性复唱的庄严感。
