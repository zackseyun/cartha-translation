  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 你们要称谢雅威[a]，因为他是良善的；因为他的慈爱永远长存[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝专名 יהוה（YHWH）的音译；传统中文译本常译作“耶和华”，也有译作“上主”的。
    reason: alternative_reading
  - marker: b
    text: “慈爱”所译的希伯来词 חֶסֶד，也可译作“坚定的爱”或“盟约忠诚”；它含有慈爱、恩惠和忠贞不渝之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: 你们要称谢
  rationale: 这是 ידה 的使役词干复数命令式，在礼仪语境中表示向上帝献上感谢和赞美。“称谢”简洁庄重，并保留复数呼吁的意味。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 原文直接使用上帝的专名 YHWH；“雅威”按通常学术重构音译，避免把专名改成称号。
- source_word: כִּי טוֹב
  choice: 因为他是良善的
  rationale: כִּי 引出称谢的理由；טוֹב 概括上帝的美善，用“良善”既直接又符合现代汉语宗教语体。
- source_word: כִּי לְעוֹלָם
  choice: 因为……永远长存
  rationale: 第二个 כִּי 再次引出理由；לְעוֹלָם 表示无尽、永久。补出“长存”使无动词的希伯来语名词句在汉语中自然完整。
- source_word: חַסְדּוֹ
  choice: 他的信实之爱
  rationale: חֶסֶד 包含慈爱、恩惠、忠诚和关系中的坚定不移。“信实之爱”兼顾爱的温度与忠贞持久的含义，同时不把盟约内涵绝对化。
theological_decisions:
- issue: 上帝专名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用专名而非普通称号。“雅威”较直接地呈现该名；脚注列出华语读者熟悉的传统译法，避免读者误认作另一位神。
- issue: חֶסֶד 的丰富含义
  choice: 信实之爱
  alternative: 慈爱；盟约忠诚；怜悯
  rationale: 本节强调上帝持久而忠贞的爱。“信实之爱”保留感情与忠诚两面，也不将该词缩窄为单纯的怜悯或明确限定为盟约术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要”明确复数命令；两个“因为”保留原文重复结构和礼仪节奏。分号区分上帝本性的良善与其永存之爱的两个理由。
