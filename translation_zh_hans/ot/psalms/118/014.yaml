base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/014.yaml
  text: Yah is my strength and song[a], and he has become my salvation.
translation:
  language: zh_hans
  text: 雅[a]是我的力量和诗歌；他成了我的拯救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”（Yah）是希伯来文神名的短式；这里不是通常译作“耶和华”的完整形式。
    reason: 说明原文神名的特殊短式及其音译。
lexical_decisions:
- source_word: עָזִּי
  choice: 我的力量
  rationale: עֹז表示力量、能力；“我的力量”自然地保留了诗人对上帝的个人认信。
- source_word: וְזִמְרָת
  choice: 是我的诗歌
  rationale: זִמְרָה在此固定诗歌表达中宜译为“诗歌”，比“赞美”更贴近词义；补出第二个“是我的”，使现代汉语节奏清楚自然。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的短式Yah，而非四字神名יהוה；音译为“雅”以保留原文中特有的短式，并用脚注说明。
- source_word: וַיְהִי
  choice: 也成了
  rationale: 该动词表达已经实现并延续其结果的状态；“成了”保留动态变化，不弱化为单纯的“是”，“也”承接前一分句。
- source_word: לִי
  choice: 我的
  rationale: 介词לִי直译为“对我／为我”，在此名词结构中以领属表达“我的”最符合现代汉语，同时保留个人性的强调。
- source_word: לִישׁוּעָה
  choice: 拯救
  rationale: יְשׁוּעָה可指拯救、救助或胜利；“拯救”既适合眼前脱险的语境，也保留较宽广的神学含义。
theological_decisions:
- issue: 神名短式יָהּ的译法
  choice: 雅
  alternative: 耶和华
  rationale: 原文特意使用神名短式יָהּ，而不是יהוה。保留音译“雅”能反映这一形式差别；脚注帮助不熟悉该名称的读者理解。
- issue: “成了我的拯救”的比喻表达
  choice: 保留“他也成了我的拯救”
  alternative: 他使我得救
  rationale: 原文把上帝本身表述为诗人的“拯救”，而不只说他实施拯救。直译保留了这一较强的认信和诗性张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。平行句式“是我的力量，是我的诗歌”保留希伯来诗歌节奏；“成了我的拯救”略带诗性，但清楚且忠于原文的名词性比喻。
