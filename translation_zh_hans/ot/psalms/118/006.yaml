  text: יְהוָ֣ה לִ֭/י לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה לִ֣/י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/006.yaml
  text: Yahweh is for me[a]; I will not fear[b]. What can man do to me?
translation:
  language: zh_hans
  text: 耶和华帮助我，我必不惧怕。人能把我怎么样呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，不以称号“主”代替。
- source_word: לִי
  choice: 帮助我
  rationale: 此处介词短语表达站在诗人一边、支持他的关系；中文若直译为“为我”不够自然，“帮助我”在本诗求助与信靠的语境中准确传达其功能。
- source_word: לֹא אִירָא
  choice: 我必不惧怕
  rationale: 未完成体在此表达坚定的决意和信靠；“必不惧怕”兼具未来信心与宣告语气。
- source_word: מַה יַעֲשֶׂה לִי
  choice: 能把我怎么样呢
  rationale: 希伯来文形式上是“会对我做什么”，但这是反问，强调人的能力有限；此译为自然现代汉语，并保留反问力度。
- source_word: אָדָם
  choice: 人
  rationale: 单数 אָדָם 在此作泛指，指任何人或凡人；中文“人”自然保留其泛指意义，无须限定为男性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且具有专名功能的“耶和华”，既不以“主”替代，也避免在经文中加入解释。
- issue: לִי 所表达的支持关系
  choice: 帮助我
  alternative: 站在我这边
  rationale: “帮助我”符合本诗上下文，也避免把关系具体化为较口语的阵营表达；它没有进一步说明帮助的方式。
- issue: 反问中人的能力
  choice: 人能把我怎么样呢
  alternative: 人会对我做什么呢
  rationale: 原文动词形态本身没有“能”字，但反问语境明确凸显人的局限；正文按中文习惯表达此语用意义，同时不引申为人绝对不能造成任何伤害。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。两句保持希伯来诗句的信靠宣告与反问结构；“把我怎么样”通俗易懂，但仍适合诗篇此处坚定有力的语气。
