  text: פִּתְחוּ לִ֥/י שַׁעֲרֵי צֶ֑דֶק אָֽבֹא בָ֝/ם אוֹדֶ֥ה יָֽהּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/019.yaml
  text: Open to me the gates of righteousness[c][b][a]; I will enter through them and give thanks to Yah.
translation:
  language: zh_hans
  text: 请为我敞开公义之门[c]；我要进入其中，向雅[a]称谢[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”（Yah）是希伯来文神名的短式；有些译本以“耶和华”或“主”处理这一名称。
    reason: alternative_reading
  - marker: b
    text: “称谢”也可译作“赞美”；原文动词依语境可表示感谢或颂赞。
    reason: lexical_alternative
  - marker: c
    text: “公义”也可译作“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ
  choice: 敞开
  rationale: 这是פתח的Qal祈使式阳性复数，直接吩咐多人开门；“敞开”符合庄重诗歌语体。
- source_word: לִי
  choice: 为我
  rationale: 介词ל加第一人称单数词尾可表示“给我、为我”；中文说“为我敞开……门”自然，也准确表达说话者是受益者。
- source_word: שַׁעֲרֵי צֶדֶק
  choice: 公义之门
  rationale: שַׁעֲרֵי是“门”的复数附属形式；צֶדֶק兼有公义、正义之义。此处采用适合敬拜语境且保留传统意象的“公义之门”。
- source_word: אָבֹא בָם
  choice: 我要从门中进去
  rationale: בוא的未完成式表达说话者随后要采取的行动；בָם指前述复数的门，表示经由这些门进入。中文将代词明示为“门”，可避免“从它们中”生硬。
- source_word: אוֹדֶה
  choice: 称谢
  rationale: ידה的Hiphil未完成式在敬拜语境中可指感谢或颂赞；“称谢”简洁地保留以感谢来颂扬神的语义。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的短式，而非完整的四字神名；音译为“雅”，保留原文所用名称形式。
theological_decisions:
- issue: 神名短式יָהּ的译法
  choice: 雅
  alternative: 耶和华；主
  rationale: 原文特意使用神名的短式יָהּ。音译“雅”可保留短式与完整神名之间的区别，不把它改写成称号。
- issue: צֶדֶק在门之意象中的含义
  choice: 公义
  alternative: 正义
  rationale: 该词确可表达公义或正义；“公义之门”较贴合诗篇敬拜语境，但脚注保留“正义”的可能，避免排除原词的司法维度。
- issue: אוֹדֶה所表达的敬拜行为
  choice: 称谢
  alternative: 赞美
  rationale: 该动词在此可涵盖感谢与赞美。“称谢”更直接呈现感恩之意，同时不否认其颂赞色彩。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“之门”保留诗篇的凝练感；“从门中进去”比机械复现复数代词更符合现代汉语。脚注标记均置于相关词语之后。
