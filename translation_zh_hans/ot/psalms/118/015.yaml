source:
  edition: WLC
  text: ק֤וֹל רִנָּ֬ה וִֽ/ישׁוּעָ֗ה בְּ/אָהֳלֵ֥י צַדִּיקִ֑ים יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/015.yaml
  text: 'The sound of joyful shouting and salvation is in the tents of the righteous: “The right hand of Yahweh does valiantly!”[a][b]'
translation:
  language: zh_hans
  text: '义人的帐棚里响起欢呼和得救的声音[a]：

    “雅威的右手大显威能！”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得救”也可译作“拯救”或“胜利”。
    reason: lexical_alternative
  - marker: b
    text: “大显威能”是希伯来语惯用表达，也可译作“以大能行事”或“成就大事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל רִנָּ֬ה
  choice: 欢呼的声音
  rationale: קוֹל指可听见的声音，רִנָּה指喜乐、欢庆的呼喊；合译为“欢呼的声音”，保留公开发声庆贺的意味。
- source_word: וִֽישׁוּעָ֗ה
  choice: 得救
  rationale: יְשׁוּעָה可指拯救、得救或胜利。正文采用“得救”，既适合诗篇中蒙神解救的语境，也不把含义限于军事胜利。
- source_word: בְּ/אָהֳלֵ֥י צַדִּיקִ֑ים
  choice: 义人的帐棚里
  rationale: 保留אֹהֶל“帐棚”的具体意象；צַדִּיקִים译为简明而具有伦理及盟约含义的“义人”。
- source_word: יְמִ֥ין יְ֝הוָה
  choice: 雅威的右手
  rationale: “右手”保留原文对神施展能力和拯救行动的形象表达；יהוה按其专名译为“雅威”。
- source_word: עֹ֣שָׂה חָֽיִל
  choice: 大显威能
  rationale: 该希伯来语惯用表达指以大能行事、建立功绩。“大显威能”在现代汉语中自然有力，并保留其英勇、强有力行动的含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”较直接地保留神的盟约专名，不以称号代替。
- issue: יְשׁוּעָה在胜利诗歌中的含义
  choice: 得救
  alternative: 拯救；胜利
  rationale: 此词兼具脱离危难和取得胜利的语义。正文用“得救”保留较宽的救援含义，脚注列出“拯救”和“胜利”，不排除军事胜利的语境。
- issue: עֹשָׂה חָיִל的表达
  choice: 大显威能
  alternative: 奋勇行事；成就大事
  rationale: 原文是带有力量、英勇和成就意味的惯用语。“大显威能”将行动主体仍归于雅威，同时避免过度限定为单纯军事行为。
translation_notes:
  register: 采用现代、庄重且适合诵读的简体中文。“响起”自然表达声音出现在帐棚中的动态感；引号表明后半句是帐棚里欢呼的内容。所有脚注标记均置于正文相应位置。
