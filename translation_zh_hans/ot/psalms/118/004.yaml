  text: יֹֽאמְרוּ נָ֭א יִרְאֵ֣י יְהוָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/004.yaml
  text: Let those who fear Yahweh now say[a], “His steadfast love endures forever.”
translation:
  language: zh_hans
  text: 愿敬畏雅威的人现在说：“他的慈爱[a]永远长存。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他忠贞守约的爱”。希伯来语“慈爱”包含忠诚、信实和守约之爱的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: 愿……说
  rationale: 此处第三人称复数未完成式在礼仪呼召中带劝勉语气；“愿……说”自然传达邀请众人宣告的意味，而非单纯预告将来。
- source_word: נָא
  choice: 现在
  rationale: נָא在这里加强呼召的即时性；译作“现在”符合诗篇相邻经节反复召唤各群体回应的结构。
- source_word: יִרְאֵי יְהוָה
  choice: 敬畏雅威的人
  rationale: 该短语指以敬畏、尊崇雅威为特征的人；“敬畏”保留希伯来语兼有畏惧与崇敬的宗教含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名处理四字神名，以“雅威”音译，而不以“主”这一称号代替。
- source_word: כִּי
  choice: 不单独译出
  rationale: 这里כִּי引出受召者所说的宣告内容。现代汉语直接引语无需另加“因为”或“的确”，省译可避免产生并不存在的因果关系。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 字面义为“直到永远”；与省略系词的חַסְדּוֹ连用时，“永远长存”以自然汉语表达持续不止的含义。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד涵盖忠贞、恩慈及盟约关系中的信实。“慈爱”简洁自然，并保留爱与恩慈的核心意义；脚注补明其忠贞、守约层面。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见形式音译该专名，既不改成称号，也不采用较传统但语音依据较弱的“耶和华”。
- issue: חֶסֶד的盟约内涵
  choice: 正文译“慈爱”，脚注说明“忠贞守约的爱”
  alternative: 信实；盟约之爱；怜悯
  rationale: 单译“信实”会弱化爱的维度，单译“怜悯”又会弱化忠诚与持久性；正文与脚注结合，可保留该词丰富而未完全定于一义的内涵。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“愿……现在说”保留礼仪性呼召；引语简洁有力，适合诗篇反复应答的语境。
