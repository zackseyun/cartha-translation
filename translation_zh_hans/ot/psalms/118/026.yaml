base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/026.yaml
  text: Blessed is the one who comes in the name of Yahweh[c][b][a]; we bless you from the house of Yahweh.
translation:
  language: zh_hans
  text: 奉雅威之名而来的那一位，是蒙福的！[a][b][c] 我们从雅威的殿中祝福你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “而来的那一位”也可译作“那位来者”。希伯来语使用阳性单数分词；汉语正文不另行标示语法性别。
    reason: lexical_alternative
  - marker: b
    text: “奉……之名”也可表示“凭……的权柄”或“作为……的代表”。
    reason: lexical_alternative
  - marker: c
    text: 新约后来在记述耶稣进入耶路撒冷时引用本句（如太21:9；可11:9；路19:38；约12:13）。诗篇正文仍按本句自身的措辞翻译，不把后来的具体应用直接写入译文。
    reason: cross_reference
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 蒙福了
  rationale: 这是动词 ברך 的被动分词或形容词性形式，在此构成宣告祝福的礼仪用语。“蒙福了”保留被动含义，并以自然的现代汉语表达当下的祝福宣告。
- source_word: הַבָּא
  choice: 而来的那一位
  rationale: 带定冠词的阳性单数实体化分词，字面为“那位正来的人”。“而来的那一位”既保留单数所指和分词性质，也不预先限定其在本诗中的具体身份。
- source_word: בְּשֵׁם
  choice: 奉……之名
  rationale: 此介词短语可指凭某人的权柄、作为其代表或呼求其名而来。“奉……之名”是自然、庄重且语义开放的汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名 יְהוָה 音译为“雅威”，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: בֵּרַכְנוּכֶם
  choice: 我们……祝福你们
  rationale: 第一人称复数完成式动词带第二人称阳性复数后缀；在礼仪语境中可作施行性的当前宣告。“祝福你们”清楚体现宾语为复数。
- source_word: מִבֵּית
  choice: 从……的殿中
  rationale: מִן 加 בַּיִת 的结构字面为“从……的家/房屋”。在“雅威的殿”这一固定圣所语境中，“殿”是自然准确的汉语对应，同时保留发言者从圣所中发出祝福的空间意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；耶和华上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不将其转换为一般称号。
- issue: “而来的那一位”在本节中的身份
  choice: 正文保留开放的礼仪性称呼，不明说其为弥赛亚或普通朝圣者
  alternative: 明确译成弥赛亚；明确译成前来敬拜的朝圣者
  rationale: 本诗原文祝福一位奉雅威之名而来者，并未在本句中明定其身份。新约后来将此句用于耶稣，但不应把后来的具体应用直接写进诗篇正文；现有措辞仍与该应用相容。
- issue: בָּרוּךְ 是宣告还是祈愿
  choice: 蒙福了
  alternative: 愿……蒙福
  rationale: 希伯来语采用被动分词式祝福公式，本身可带宣告和祝愿的张力。“蒙福了”优先保存其陈述形式，而不完全改写为祈愿句。
translation_notes:
  register: 采用现代、庄重而可朗读的礼仪语体。“奉……之名”兼顾传统可识别性与现代可懂度；“你们”明确反映希伯来语复数宾语。感叹号表现祝福欢呼的语气，但不扩充原文内容。
