  text: מִֽן הַ֭/מֵּצַ֥ר קָרָ֣אתִי יָּ֑הּ עָנָ֖/נִי בַ/מֶּרְחָ֣ב יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/005.yaml
  text: Out of my distress I called on Yah[a]; Yah answered me with spaciousness.
translation:
  language: zh_hans
  text: 我从困境中向雅呼求；雅以宽阔之处回应我。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”是希伯来文神名的诗体短式。
    reason: divine_name
  - marker: b
    text: 或译：“我从狭窄之地呼求雅；雅在宽阔之地回应我。”希伯来文以“狭窄”和“宽阔”的空间图像表达困苦与解脱；末句也可理解为雅以宽广、释放来回应我。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמֵּצַר
  choice: 从困境中
  rationale: מִן表示来源；מֵצַר既可指狭窄、受困之地，也可比喻困苦。“从困境中”自然表达诗人的处境，同时由后半句的“宽广”保留空间意象的对照。
- source_word: קָרָאתִי
  choice: 我呼求
  rationale: קרא在祷告语境中指向神呼喊、求告。“呼求”在现代汉语中简洁自然，也符合诗歌语体。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的诗体短式，而非完整形式יהוה。音译为“雅”以保留原文中特有的短式及其重复所形成的诗歌力量；脚注说明其身份，避免读者误解。
- source_word: עָנָנִי
  choice: 回应我
  rationale: 该动词及宾语后缀直译为“回答我”。“回应我”既准确，也适合神垂听呼求的语境。
- source_word: בַמֶּרְחָב
  choice: 以宽广
  rationale: מֶרְחָב表示宽阔之处或宽广、自由，与前面的מֵצַר形成鲜明对照。介词ב可作工具性或处所性理解；“以宽广”保留其表达张力，而不直接增添“使我脱困”等因果解释。
theological_decisions:
- issue: 神名短式יָהּ的译法
  choice: 雅
  alternative: 耶和华；主
  rationale: 原文两次使用神名的诗体短式יָהּ。音译既保留其作为名字的性质，也使它与完整神名יהוה保持词形上的区别；不以称号“主”取代。
- issue: בַמֶּרְחָב所表达的拯救图景
  choice: 以宽广回应我
  alternative: 在宽阔之地回应我；领我进入宽阔之地
  rationale: 原文可表达神在“宽阔之境”回应，也可表达他以宽广、释放回应。正文不把它明确改写为移动或使役动作，以免消除介词结构本有的含混与诗意。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。“困境”传达מֵצַר的惯用比喻义，“宽广”则保留原文前后相反的空间图像。分号呈现两个平衡分句；神名“雅”的重复照应希伯来文。
