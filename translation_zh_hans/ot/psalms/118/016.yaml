  yaml_path: translation/ot/psalms/118/016.yaml
  text: The right hand of Yahweh is exalted[b][a]; the right hand of Yahweh does valiantly.
translation:
  language: zh_hans
  text: 雅威的右手被高高举起[a]；雅威的右手施展大能[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被高举”“被尊崇”，也可按上下文理解为“得胜”。希伯来语动词可表示被升高或被尊崇，在这里也可能含有凯旋之意。
    reason: lexical_alternative
  - marker: b
    text: 或译“彰显威力”“大有作为”或“赢得胜利”。希伯来语这一说法直译近于“行出勇力”，指大能或得胜的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִין
  choice: 右手
  rationale: 保留希伯来诗歌中的具体形象；此处“右手”象征力量和得胜的作为，但正文不将其抽象化为“能力”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行学术拟音译出专名，而不以“主”这一称号替代，也不采用源于后期混合读法的“耶和华”。
- source_word: רוֹמֵמָה
  choice: 高高举起
  rationale: 该词表达升高、被高举或居高的状态；“高高举起”自然地保留右手被举高的诗性画面，同时不在正文中直接限定为“得胜”。
- source_word: עֹשָׂה חָיִל
  choice: 施展大能
  rationale: 这一搭配表达有力、英勇或得胜的行动。“施展大能”符合现代汉语习惯，也保留其强有力行动的核心含义；胜利意味留在脚注中说明。
theological_decisions:
- issue: 描写上帝行动的拟人化语言
  choice: 保留“右手”的具体形象
  alternative: 译为“雅威的能力”
  rationale: 原文以“右手”描绘雅威的大能和得胜介入。保留这一意象可维持诗歌表现力及其与其他经文的呼应，避免把拟人表达直接抽象化。
- issue: רוֹמֵמָה 是否直接表达得胜
  choice: 正文译作“高高举起”，脚注列出“得胜”的语境性理解
  alternative: 正文直译为“得胜”
  rationale: 词本身首先涉及升高或被高举；上下文虽有凯旋意味，却不宜在正文中把这种隐含意义定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。重复“雅威的右手”以保存原文的平行结构和强调效果；两个分句以分号连接。脚注标记按正文出现顺序排列。
