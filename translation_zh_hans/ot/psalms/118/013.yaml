  text: דַּחֹ֣ה דְחִיתַ֣/נִי לִ/נְפֹּ֑ל וַ֖/יהוָ֣ה עֲזָרָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/013.yaml
  text: You pushed me hard so that I might fall[b][a], but Yahweh helped me.
translation:
  language: zh_hans
  text: 你猛力推我[a]，要使我跌倒；但[b]雅威帮助了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“推，你推了我”，以同词根的重复结构加强语气，意思是“你猛力推我”或“你狠狠推搡我”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“而雅威帮助了我。”希伯来语连接词也可只表示一般连接，不过上下文支持“但”所表达的转折。
    reason: alternative_reading
lexical_decisions:
- source_word: דַּחֹה דְחִיתַנִי
  choice: 你猛力推我
  rationale: 希伯来语以不定式绝对式配合同词根的限定动词加强语气。现代汉语用“猛力”自然表达这种强调，同时保留敌意推动的动作。
- source_word: לִנְפֹּל
  choice: 要使我跌倒
  rationale: ל 加不定式可表示目的或结果；“要使我跌倒”在汉语中既顺畅，也保留攻击者意图与预期结果之间的张力。
- source_word: וַיהוָה
  choice: 但雅威
  rationale: 连接词 וְ 本可直译为“而／和”，上下文则明显形成攻击与援助的对照，因此正文译作“但”；יהוה 按其专名音译为“雅威”。
- source_word: עֲזָרָנִי
  choice: 帮助了我
  rationale: עזר 的 Qal 完成式带第一人称单数宾语后缀，直接表示“他帮助了我”；“了”自然传达已经发生的援助。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神专名的性质，不以称号替代。
- issue: 连接词 וְ 的关系
  choice: 但
  alternative: 而／和
  rationale: 原词本身可作一般连接，但本节前后构成强烈转折。正文采用“但”，脚注保留较中性的可能译法，避免把语法可能性完全抹去。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“猛力推我”传达原文强调结构而不作生硬重复；分号凸显攻击与神援助之间的对照。
