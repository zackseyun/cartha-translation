  text: סַבּ֥וּ/נִי גַם סְבָב֑וּ/נִי בְּ/שֵׁ֥ם יְ֝הוָ֗ה כִּ֣י אֲמִילַֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/011.yaml
  text: They surrounded me[a], yes, they surrounded me[c][b]; in the name of Yahweh I cut them down.
translation:
  language: zh_hans
  text: 他们围住我[a]，实在把我团团围住；我奉雅威[b]的名，必将他们剪除[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们环绕我。”下句同样如此。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来文神名 יְהוָה 的音译；传统上也译作“耶和华”或“上主”。
    reason: alternative_reading
  - marker: c
    text: 或译：“必将他们挡退”或“必将他们击倒”。原文动词含义罕见，可能着重于果断地割除或挫败敌人。
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי / סְבָבוּנִי
  choice: 他们围住我／把我团团围住
  rationale: 两处都源于 סבב，表示围绕、包围。译文保留重复，并用“团团”自然传达第二次陈述所加强的压迫感。
- source_word: גַם
  choice: 实在
  rationale: 此处不是简单添加另一项，而是强化重复的陈述；“实在”能以自然、庄重的现代汉语表达强调语气。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉雅威的名
  rationale: 介词 בְּ 与“名”连用，在这里表达凭借、诉诸并倚靠雅威的权能与权柄；“奉……的名”是清楚自然的汉语表达。
- source_word: כִּי
  choice: 必
  rationale: כִּי 在诗歌叠句中可有断言或强调作用，不必机械译为“因为”；“必”与未完成式相配，表达坚定确信。
- source_word: אֲמִילַם
  choice: 将他们剪除
  rationale: 该词在此语境中表达对围敌采取决定性行动，并带有“割除、剪除”的鲜明意象；“剪除”既保留力度，也避免把具体战斗方式说得过死。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其作为以色列之神专名的性质，而不以称号替代；脚注列出中文传统常见形式。
- issue: אֲמִילַם 所表达行动的性质
  choice: 剪除
  alternative: 挡退／击倒
  rationale: 原词罕见，既可能强调割除敌人，也可能在语境中泛指挫败、挡退他们。正文采用较贴近词形意象且有决定性的“剪除”，脚注保留语义上的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。通过“围住／团团围住”保留希伯来文的重复和递进，以分号呈现围困与凭神名反击之间的转折；避免添加原文没有明说的战斗细节。
