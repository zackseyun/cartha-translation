  yaml_path: translation/ot/psalms/118/028.yaml
  text: You are my God[a], and I will give thanks to you; my God[b], I will exalt you.
translation:
  language: zh_hans
  text: 你是我的上帝，我要称谢你；我的上帝，我要尊崇你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלִי
  choice: 我的上帝
  rationale: אֵל带第一人称单数后缀，在此是直接称呼；译为“我的上帝”自然、庄重，并保留诗人的个人敬拜语气。
- source_word: אַתָּה
  choice: 你是
  rationale: 独立代词在无系词句中带有强调作用；现代汉语补出“是”，形成自然的“你是我的上帝”。
- source_word: וְאוֹדֶךָ
  choice: 我要称谢你
  rationale: ידה的Hiphil形式在诗篇敬拜语境中通常表示向上帝感谢、称谢；“称谢”兼具感谢与公开颂赞的色彩，且保留第二人称宾语。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 这是与前句אֵלִי平行的直接称呼；重复译作“我的上帝”，保留希伯来诗句的平行、反复和个人委身。
- source_word: אֲרוֹמְמֶךָ
  choice: 我要尊崇你
  rationale: רום在此表达高举、尊荣之意；“尊崇”是现代汉语敬拜语境中自然庄重的说法，也避免把空间性的“举高”误解为字面动作。
theological_decisions:
- issue: 两个神圣称谓אֵלִי与אֱלֹהַי的译法
  choice: 我的上帝……我的上帝
  alternative: 我的大能者……我的上帝
  rationale: 两者在本节都是诗人对以色列之上帝的直接称呼。统一译作“我的上帝”既不额外加入“大能”等原文此处未明说的限定，也保留平行重复所表达的个人敬虔。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语言。“称谢”比日常的“感谢”更适合诗篇体裁；“尊崇”准确表达颂扬并尊为至高之意。原文结构简洁有力，译文用分号保留两组平行分句。
