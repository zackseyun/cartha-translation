  yaml_path: translation/ot/psalms/118/007.yaml
  text: Yahweh is among my helpers[b][a]; I myself will look on my haters.
translation:
  language: zh_hans
  text: 耶和华在帮助我的人中间[a]；至于我，我必观看那些恨我的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华为我，在帮助我的人中间。”原文的结构也可能强调耶和华与诗人的帮助者同在，而非只把他表述为单独的帮助者。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我必看见那些恨我的人。”这一希伯来习语可暗示目睹仇敌的败亡或受挫，但原文并未明说他们的结局。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行的专名“耶和华”译出四字神名，而不以“主”这一称号代替。
- source_word: לִי
  choice: （在）帮助我的人中间
  rationale: לִי 字面为“对我／为我”；在无系词句中结合后面的复数短语理解，使中文自然表达耶和华与帮助诗人的人同在。
- source_word: בְּעֹזְרָי
  choice: 在帮助我的人中间
  rationale: בְּ 加复数分词及第一人称单数词尾，直译近于“在帮助我的人中间／与帮助我的人同在”；保留复数，不压缩为单数“我的帮助者”。
- source_word: וַאֲנִי
  choice: 至于我，我
  rationale: 独立人称代词带出主语强调；“至于我，我”在中文中自然保留这种转折或聚焦语气。
- source_word: אֶרְאֶה
  choice: 必看着
  rationale: ראה 基本义为“看见／观看”；与 בְּ 引出的对象连用时，可暗示目睹仇敌的结局，但正文不把这一含义明说。
- source_word: בְשֹׂנְאָי
  choice: 那些恨我的人
  rationale: 该形式指“恨我的人”，比泛化为“仇敌”更贴近原词，同时符合现代汉语习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用以色列上帝的专名。中文正文采用读者熟悉的专名“耶和华”，避免以称号“主”取代；“雅威”是另一种可能的音译。
- issue: 诗人观看恨他之人的含义
  choice: 保留“必看着”的含蓄表达
  alternative: 必得意地看着他们败亡
  rationale: 原文可暗示诗人将目睹敌对者受挫或败亡，却没有明确说出“得意”或“败亡”；正文保留神学与修辞张力，不作扩写。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。分号保留两个分句的平衡；用“至于我，我”表达独立代词的强调。所有脚注标记均置于相关正文之后。
