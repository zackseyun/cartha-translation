  text: The stone the builders rejected has become the cornerstone[a][b].
translation:
  language: zh_hans
  text: 建造的人所弃绝的石头，已成了房角石[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“成了房角的头（首要部分）。”
    reason: lexical_alternative
  - marker: b
    text: 新约后来引用本节，并将其应用于弥赛亚／基督（例如太21:42；徒4:11；彼前2:7）。
    reason: cross_reference
lexical_decisions:
- source_word: אֶבֶן
  choice: 石头
  rationale: 该普通名词指石头；此译自然、准确，也不额外限定石块的大小或用途。
- source_word: מָאֲסוּ
  choice: 弃绝
  rationale: 动词 מאס 表示拒绝、厌弃；“弃绝”体现匠人有意不用这块石头，并保留原文较强的拒斥意味。
- source_word: הַבּוֹנִים
  choice: 匠人
  rationale: 原文直指“建造的人”。建筑语境下，“匠人”简洁自然；“建造者”虽更直译，却不如前者符合现代汉语表达。
- source_word: הָיְתָה
  choice: 竟成了
  rationale: 完成式描述已经发生并形成的结果。“成了”表达状态转变；“竟”自然凸显被弃之石反成关键石头的强烈逆转，但不添加具体神学解释。
- source_word: לְרֹאשׁ פִּנָּה
  choice: 房角石
  rationale: 该短语直译为“角的头（首要部分）”。“房角石”保留建筑比喻，且不武断判定它究竟是墙角的基石还是顶部的压顶石。
theological_decisions:
- issue: 后来的弥赛亚／基督论引用
  choice: 正文只呈现原诗的建筑比喻与逆转，不直接加入弥赛亚身份说明；以脚注提示新约引用。
  alternative: 按照新约的引用，在正文中直接作基督论解释。
  rationale: 希伯来文本本身并未明说弥赛亚，翻译不应把后来的正典应用写入正文；脚注则可帮助读者看见后续经文关联。
- issue: לְרֹאשׁ פִּנָּה所指建筑构件
  choice: 译作“房角石”，同时用脚注保留字面表达。
  alternative: 译作“基石”或“压顶石”。
  rationale: 原短语可指位于角部、具有首要地位的石头，但具体建筑位置并不完全确定；“房角石”较能保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“匠人弃绝的石头”保留希伯来文前置宾语所突出的对象；“竟”表现诗句的出人意料和地位逆转。“房角石”为读者熟悉的圣经建筑用语，脚注说明其字面形式及可能的语义宽度。
