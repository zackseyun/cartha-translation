  text: ט֗וֹב לַ/חֲס֥וֹת בַּ/יהוָ֑ה מִ֝/בְּטֹ֗חַ בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/008.yaml
  text: It is better to take refuge in Yahweh than to trust in man[a].
translation:
  language: zh_hans
  text: 投靠雅威，胜过倚靠世人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人”或“人类”；希伯来文用泛指人类的单数词。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 该形容词在此与后面的 מִן 构成比较评价；中文用“……胜过……”自然、简洁地表达“更好”。
- source_word: לַחֲסוֹת
  choice: 投靠
  rationale: חסה 描绘到保护者那里寻求庇护；“投靠”保留避难、寻求保护的意象，又符合现代汉语表达。
- source_word: בַּיהוָה
  choice: 雅威
  rationale: 介词 בְּ 标明投靠的对象；专名 יהוה 音译为“雅威”，保留经文中的神圣名字。
- source_word: מִבְּטֹחַ
  choice: 胜过倚靠
  rationale: מִן 加不定式构成比较；בטח 表示信赖、把把握寄托于某对象。“倚靠”与前面的“投靠”既有语义联系，又保留两动词的区别。
- source_word: בָּאָדָם
  choice: 世人
  rationale: אָדָם 是泛指人类的单数集合性用法，与雅威形成对比。“世人”在中文中自然表达泛指的人，并避免被误解为某一个男性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以通行的学术音译保留其专名性质，不把它替换为称号。
- issue: 泛指单数 אָדָם 的译法
  choice: 世人
  alternative: 人；人类
  rationale: 这里不是特指某一个男人，而是将对人的倚靠与投靠雅威作普遍对比。“世人”准确传达泛指意义；脚注说明原文形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保持诗歌式的简洁和平衡；“投靠”保留庇护意象，“倚靠”表达信赖，避免把两个希伯来动词完全同化。
