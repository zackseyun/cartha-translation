  text: כָּל גּוֹיִ֥ם סְבָב֑וּ/נִי בְּ/שֵׁ֥ם יְ֝הוָ֗ה כִּ֣י אֲמִילַֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/010.yaml
  text: All the nations surrounded me; in the name of the LORD, I surely cut them off.
translation:
  language: zh_hans
  text: 列国都包围了我；我奉耶和华的名，必将他们剪除。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: 列国都
  rationale: כָּל 表示全体，גּוֹיִם 在此指敌对的众国；“列国都”自然且保留诗句的概括性。
- source_word: סְבָבוּנִי
  choice: 包围了我
  rationale: 该动词意为环绕、围住；第一人称宾语后缀译为“我”。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉耶和华的名
  rationale: 介词 בְּ 在此表达凭借或倚靠；“奉……的名”是自然、庄重的汉语表达，并保留神名。
- source_word: כִּי אֲמִילַם
  choice: 必将他们剪除
  rationale: אֲמִילַם 的具体词源和语感存在讨论，但上下文显然表达对敌人的决断性处置；כִּי 在本诗重复句式中带强调或确证作用，以“必”体现，同时避免误译为单纯因果关系。
theological_decisions:
- issue: “奉耶和华的名”与行动者之间的关系
  choice: 保留诗人亲自“剪除他们”的表述，同时说明其行动凭借耶和华的名
  alternative: 译成“耶和华必剪除他们”，将耶和华直接作为行动者
  rationale: 希伯来语动词为第一人称单数，宾语为第三人称复数，因此不应改变语法主语；“奉耶和华的名”保留诗人倚靠神而行动的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“列国都包围了我”保持原文语序和压迫感；分号呈现两分句之间从危局到确信的转折。“剪除”比“消灭”更贴近可能的植物修剪意象，也符合诗篇语域。
