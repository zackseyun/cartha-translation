  text: א֭וֹדְ/ךָ כִּ֣י עֲנִיתָ֑/נִי וַ/תְּהִי לִ֝֗/י לִֽ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/021.yaml
  text: I will give thanks to you[a], for you answered me and became my salvation.
translation:
  language: zh_hans
  text: 我要称谢你，因为你应允了我，又成了我的拯救[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“救恩”。希伯来词既可指具体处境中的解救，也可泛指更广的救恩。
    reason: lexical_alternative
lexical_decisions:
- source_word: אודך
  choice: 我要称谢你
  rationale: ידה的Hiphil形式在此表示向上帝称谢或赞美；“我要”保留未完成式可能具有的意愿或前瞻语气，“称谢”符合感恩诗的庄重语境。
- source_word: כי
  choice: 因为
  rationale: 此处引出称谢的原因，现代汉语用“因为”清楚自然。
- source_word: עניתני
  choice: 你应允了我
  rationale: 源自动词ענה“回答、回应”，并非“使受苦”；在祷告蒙回应的语境中，“应允了我”自然地传达上帝回应祈求之意。
- source_word: ותהי
  choice: 又成了
  rationale: ויהי的连续叙事形式推进事件；“成了”保留היה在此的动态含义，“又”自然连接前一分句。
- source_word: לי
  choice: 我的
  rationale: לִי直译为“对我、为我”；与“成了……拯救”搭配时，译作“我的”符合现代汉语习惯，同时保留其关系意义。
- source_word: לישועה
  choice: 拯救
  rationale: ישועה可指具体处境中的解救，也可承载更广的救恩含义；正文用“拯救”兼顾当下获救的语境与较宽的神学分量。
theological_decisions:
- issue: ישועה在具体获救与广义救恩之间的含义
  choice: 拯救
  alternative: 救恩
  rationale: 希伯来词既可指现实危难中的解救，也可具有更广的救赎意味。“拯救”在现代汉语中较自然，并不把经文限定为后期系统神学意义；脚注提示“救恩”这一可能译法，以保留原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“称谢”保留礼拜与感恩语气；句式简洁，并维持原文“回应—成为拯救”的动态次序。
