  text: יַסֹּ֣ר יִסְּרַ֣/נִּי יָּ֑הּ וְ֝/לַ/מָּ֗וֶת לֹ֣א נְתָנָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/018.yaml
  text: Yah has surely disciplined me[a], but he has not given me over to death.
translation:
  language: zh_hans
  text: 雅[a]确实管教了我，却没有把我交给死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”（Yah）是神名的诗歌短式；不是完整形式“耶和华”。
    reason: 保留原文 יָהּ 的短式神名，并为现代中文读者说明其含义和与完整神名形式的区别。
lexical_decisions:
- source_word: יַסֹּר יִסְּרַנִּי
  choice: 确实管教了我
  rationale: 同根词的不定式绝对式置于限定动词前，起加强语气的作用；“确实”自然传达这种强调。“管教”兼有纠正和塑造之意，不把含义缩窄为纯粹惩罚。
- source_word: יָּהּ
  choice: 耶和华
  rationale: 这是神名的诗歌短式 יָהּ。中文圣经传统通常以“耶和华”表达该神名，正文采用这一读者熟悉且庄重的形式，同时以脚注说明原文的短式，以保留词形差异。
- source_word: וְלַמָּוֶת
  choice: 却……给死亡
  rationale: 连词在否定句中与前句形成转折，故译为“却”。לַמָּוֶת 表示交付所指向的结局或权势，即“给死亡”。
- source_word: לֹא נְתָנָנִי
  choice: 没有把我交给
  rationale: נתן 带人称宾语并与 ל 短语连用，可表示“把某人交给”某种权势或结局；这一表达比单纯的“给”更符合上下文。
theological_decisions:
- issue: 神名诗歌短式 יָהּ 的译法
  choice: 正文译作“耶和华”，脚注注明原文为神名的诗歌短式“雅”
  alternative: 正文音译为“雅”
  rationale: יָהּ 确实不同于完整形式 יהוה，应当保留这一语言事实；但直接在现代中文正文中写“雅”容易被误解为普通汉字或陌生专名。正文使用通行神名，脚注交代短式，兼顾准确性、可读性与诗歌语体，不据此引申任何教义差别。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“确实……却没有……”保留原文强调与转折；“管教”避免过度强调刑罚，“交给死亡”保留死亡被拟作权势或结局的张力。
