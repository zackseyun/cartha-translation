  text: יֹֽאמַר נָ֥א יִשְׂרָאֵ֑ל כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/002.yaml
  text: Let Israel now say[b][a], “His steadfast love endures forever.”
translation:
  language: zh_hans
  text: 愿以色列现在说：“他的慈爱永远长存。”[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿以色列现在说：‘因为他的慈爱永远长存。’”希伯来语 כִּי 可译作“因为”，也可用来引出所宣认的内容。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来语 חֶסֶד，常指忠贞不变、信守盟约的爱；也可译作“信实的爱”“盟约之爱”或“怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמַר נָא
  choice: 愿……现在说
  rationale: 未完成式在此具有祈使、劝勉语气；נָא加强呼召的迫切感。合译为“愿……现在说”，既保留礼仪性召唤，也符合现代汉语。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 按通行译名保留专名；此处集合性地指以色列民。
- source_word: כִּי
  choice: 以直接引语的冒号表达
  rationale: כִּי在此可引出宣认的内容，也可作“因为”理解。正文用冒号和直接引语自然呈现内容关系，脚注保留“因为”的可能。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: לְעוֹלָם表示持续到永远；与חֶסֶד搭配时，“永远长存”在汉语中自然、庄重，并明确表达持续性。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有恩慈、忠贞和盟约忠诚等含义。“慈爱”是简明自然且有圣经语域的现代汉语表达；脚注补明其忠贞不变的内涵，避免将词义窄化为一般情感。
theological_decisions:
- issue: 盟约赞美宣言中חֶסֶד的译法
  choice: 慈爱
  alternative: 信实的爱；盟约之爱；怜悯
  rationale: “慈爱”兼顾可读性和庄重语体，又不把词义限定为怜悯或技术性的“盟约之爱”；脚注说明其可包含忠贞、守约的爱。
- issue: כִּי与后句的句法关系
  choice: 作为所宣认的内容，用冒号引出
  alternative: 译作“因为”，即“愿以色列说：‘因为他的慈爱永远长存。’”
  rationale: 两种理解均有语言依据。正文采用汉语较自然的内容引语，同时以脚注保存因果连词的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪性汉语。“愿……现在说”保留原文的劝勉力量；诗行分行呈现群体呼召与回应。所有脚注标记均置于正文相应位置。
