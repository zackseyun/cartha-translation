base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/027.yaml
  text: Yahweh is God[a], and he has given light to us. Bind the festal sacrifice with cords[d][c][b], up to the horns of the altar.
translation:
  language: zh_hans
  text: 耶和华是上帝；他赐光给我们。用绳索捆住节期的祭牲[a][b]，直到祭坛的角[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “节期的祭牲”原文直译为“节期”。这里可能借指节期所献的祭牲；也有人理解为节庆行列。
    reason: alternative_reading
  - marker: b
    text: “绳索”也可译作“粗绳”；另有人解释为“树枝”。
    reason: lexical_alternative
  - marker: c
    text: “直到祭坛的角”也可理解为“绑在祭坛的角上”。原文没有明确说明具体如何系结；“角”指祭坛四角凸起的部分。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֵל יְהוָה
  choice: 耶和华是上帝
  rationale: 这是一个无系词句，以“上帝”为谓语，认定耶和华为上帝；中文补出“是”最自然。
- source_word: וַיָּאֶר לָנוּ
  choice: 他赐光给我们
  rationale: אור 的使役式通常表示“使有光、赐光”；此处也可能含有上帝向人发光、施恩的意象。
- source_word: אִסְרוּ
  choice: 绑起来
  rationale: 复数命令式直指“捆绑、系住”；“绑起来”符合现代汉语命令语气。
- source_word: חַג
  choice: 节期的祭牲
  rationale: חַג 通常指节期或筵席，但与“绑”和“祭坛”连用时，最可能借指节期所献的祭牲；脚注保留“节庆行列”等理解。
- source_word: בַּעֲבֹתִים
  choice: 用绳索
  rationale: 该复数名词通常指粗绳或绳索；“树枝”的解释词义依据较弱。
- source_word: עַד קַרְנוֹת הַמִּזְבֵּחַ
  choice: 一直牵到祭坛的角那里
  rationale: עַד 表示达到某处。“牵到……那里”使中文句法自然，同时避免武断断定祭牲直接绑在坛角上；“角”指祭坛四角凸起的部分。
theological_decisions:
- issue: חַג 在祭祀命令中的所指
  choice: 译作“节期的祭牲”
  alternative: 译作“节期”，并理解为节庆行列或礼仪活动
  rationale: “绑”通常要求可捆系的宾语，而本句以祭坛为终点，因此借代为节期祭牲最合语境；但希伯来词本身通常意为“节期”，故用脚注保留歧义。
- issue: וַיָּאֶר לָנוּ 所表达的光
  choice: 译作“他赐光给我们”
  alternative: 译作“他向我们发光”，理解为施恩眷顾
  rationale: 使役词形支持“赐光”，但上下文也容许“照耀我们／向我们施恩”的形象，不应排除。
- issue: 祭牲与祭坛角的空间关系
  choice: 译作“一直牵到祭坛的角那里”
  alternative: 译作“绑在祭坛的角上”或“直到祭坛的角”
  rationale: עַד 清楚表示“直到／到达”，却没有独立说明绑缚动作是否直接以坛角为系结点；正文保留这一空间上的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华是上帝”保留宣告式力度；后半句通过“绑起来……牵到”呈现礼仪行动，同时以脚注交代原文在节期、祭牲或行列之间的真实歧义。
