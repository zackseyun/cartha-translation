source:
  edition: WLC
  text: סַבּ֤וּ/נִי כִ/דְבוֹרִ֗ים דֹּ֭עֲכוּ כְּ/אֵ֣שׁ קוֹצִ֑ים בְּ/שֵׁ֥ם יְ֝הוָ֗ה כִּ֣י אֲמִילַֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/012.yaml
  text: They surrounded me like bees[a]; they went out like a fire among thorns. In the name of Yahweh[b], I surely cut them down.
translation:
  language: zh_hans
  text: '他们像蜜蜂一样围住我；

    他们又像荆棘的火一样熄灭[a]。

    我奉雅威的名，

    必将他们剪除[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“像荆棘的火”。也可译为“像荆棘丛中的火”；这一凝练的比喻描绘火焰迅速腾起、又很快熄灭的景象。
    reason: 说明כְּאֵשׁ קוֹצִים的压缩关联表达，并避免将其限定为“烧荆棘的火”。
  - marker: b
    text: “剪除”也可译作“砍倒”或“割除”。
    reason: 保留אֲמִילַם的词义范围，不把动作过度限定。
lexical_decisions:
- source_word: סַבּוּנִי
  choice: 围住我
  rationale: סבב表示包围、环绕；“围住我”自然简洁，也保留敌对势力四面逼近的画面。
- source_word: כִדְבוֹרִים
  choice: 像蜜蜂一样
  rationale: 前缀כְ表示比较；此译保留蜂群聚集围攻的鲜明比喻。
- source_word: דֹּעֲכוּ
  choice: 熄灭
  rationale: דעך通常指火焰熄灭或渐灭。这里虽以敌人为主语，但紧接“荆棘的火”的比喻，因此直译为“熄灭”既忠实又可理解。
- source_word: כְּאֵשׁ קוֹצִים
  choice: 像烧荆棘的火一样
  rationale: 原文是高度凝练的“像荆棘之火”，可指燃烧荆棘的火；这样的火迅速腾起，也迅速熄灭。中文以“烧荆棘的火”明确意象而不添加结论。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉雅威的名
  rationale: 该短语表示凭借、求告或倚靠雅威之名而行动；“奉……的名”是庄重自然的现代汉语表达。
- source_word: כִּי
  choice: 必
  rationale: 此处כִּי在反复句式中具有强调、确证作用，不宜机械译作因果连词；以“必”表达确定语气。
- source_word: אֲמִילַם
  choice: 剪除他们
  rationale: מול的使役形在此可表示割除、砍除。“剪除”兼顾敌人被除灭的语境及紧邻荆棘火意象可能产生的修剪联想，同时避免过度具体化。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以称号替代，也不依赖较晚形成的混合读音。
- issue: “奉雅威的名”所表达的行动根据
  choice: 保留“奉……的名”的开放表达
  alternative: 靠着雅威的能力；求告雅威之后
  rationale: בְּשֵׁם既可涉及求告其名，也可表示凭其权柄或倚靠其名；正文不把这一含义限定为单一神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；分行为三组意象保留原诗节奏。正文避免古奥词语，“奉……的名”和“剪除”则维持诗篇所需的肃穆感。
