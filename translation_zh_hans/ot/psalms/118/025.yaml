  text: Please, LORD, save us! Please, LORD, grant us success[a]!
translation:
  language: zh_hans
  text: 耶和华啊，求你拯救我们！耶和华啊，求你赐我们成功[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的两个命令式都没有明说宾语；“我们”是根据群体祷告的语境补出的。
    reason: implicit_object
lexical_decisions:
- source_word: אָנָּא ... נָּא
  choice: 求你
  rationale: 该恳求语气词表达迫切而恭敬的请求，并非时间副词“现在”；现代汉语用“求你”自然传达其语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应希伯来文中的神名。
- source_word: הוֹשִׁיעָה
  choice: 拯救
  rationale: 保留该使役命令式的核心意义，即请求施行救助或解救。
- source_word: הַצְלִיחָה
  choice: 使……顺利
  rationale: 该使役命令式意为使事情顺遂、赐予成功；“使我们顺利”比带有财富联想的“使我们亨通”更适合普通现代读者，同时不限定成功的具体领域。
theological_decisions:
- issue: 两个命令式的宾语均未在希伯来原文中明说
  choice: 正文依群体祷告语境补出“我们”，并加注说明
  alternative: 直译为“求你拯救！求你使顺利！”
  rationale: 汉语通常需要补出受事者才能自然清楚；“我们”与诗篇的群体祈求语境相符，但注脚保留原文在语法上的未明说状态。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两句保持平行结构，以“求你”传达重复恳求的力度；避免把语气词误译成表示时间的“现在”。
