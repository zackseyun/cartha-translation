  text: מֵ/אֵ֣ת יְ֭הוָה הָ֣יְתָה זֹּ֑את הִ֖יא נִפְלָ֣את בְּ/עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/023.yaml
  text: This has come from Yahweh[b][a]; it is marvelous in our eyes.
translation:
  language: zh_hans
  text: 这是出于雅威[a]；在我们眼中，实在奇妙[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是雅威所成就的”，也可译：“这事是从雅威而来的。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“令人惊叹。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת
  choice: 出于
  rationale: 该词组表示来源或起因。“出于”自然地表达这事源自雅威，也没有加入原文未明说的“手”等意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译保留四字神名，使其作为以色列上帝的专名呈现，而不以称号代替。
- source_word: הָיְתָה זֹּאת
  choice: 这是
  rationale: 原文直译可作“这是／这事成了”，结合前文指向所发生之事。“这是出于……”简洁自然，并保留其来源于雅威的意思，不把具体事件解释得过满。
- source_word: הִיא
  choice: （由“这”承接）
  rationale: 独立代词带有强调和承接作用。汉语不必机械重复“它”；分号后的陈述自然承接前句所指之事。
- source_word: נִפְלָאת
  choice: 实在奇妙
  rationale: פלא 的尼פעל形式表示令人惊叹、非同寻常。“奇妙”符合赞美诗的语气；“实在”传达独立代词及述语所形成的强调。
- source_word: בְּעֵינֵינוּ
  choice: 在我们眼中
  rationale: 保留希伯来语的形象化表达，清楚呈现说话群体亲眼看为奇妙的经验视角。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”以保留专名性质；“耶和华”是传统音译，“上主”则是称号替代，均可见于其他译本，但不是本稿的首选。
- issue: “这”所指事件的表达
  choice: 保留概括性的“这”
  alternative: 译作“这事发生了”或明确解释为前节所说的房角石事件
  rationale: 原文用指示代词回指上下文，却未在本节重新明确其所指。保留“这”可维持原文的概括性和上下文张力，避免加入过度具体的神学解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留“在我们眼中”这一清晰的希伯来语意象；用分号呈现原文两个紧密相连的分句。
