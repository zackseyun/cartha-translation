  text: זֶה הַ֭/יּוֹם עָשָׂ֣ה יְהוָ֑ה נָגִ֖ילָה וְ/נִשְׂמְחָ֣ה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/024.yaml
  text: This is the day that Yahweh has made; let us rejoice and be glad in it.
translation:
  language: zh_hans
  text: 这是雅威[a]所造的日子；让我们在这日欢欣喜乐！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译，传统上也译作“耶和华”。
    reason: 帮助熟悉传统中文译名的读者识别该专名，并说明译名依据。
lexical_decisions:
- source_word: זֶה הַיּוֹם
  choice: 这是……的日子
  rationale: זֶה是指示代词，הַיּוֹם是带定冠词的“日子”；采用现代汉语判断句式，既保留“这”的指示作用，也使表达自然。
- source_word: עָשָׂה
  choice: 所造的
  rationale: עָשָׂה为Qal完成式第三人称阳性单数。在“日子”作宾语的语境中译作“造”最自然，并用“所……的”结构体现已经成就、如今在眼前的行动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名YHWH；译作“雅威”以保留专名性质，而不以称号代替。
- source_word: נָגִילָה
  choice: 让我们……欢欣
  rationale: 第一人称复数鼓励式表达共同意愿和劝勉，故用“让我们”，而不译成单纯的将来陈述。
- source_word: וְנִשְׂמְחָה
  choice: 喜乐
  rationale: 同为第一人称复数鼓励式，与前一动词并列。“欢欣喜乐”保留两个近义动词的叠加强调，又符合现代汉语宗教诗歌语体。
- source_word: בּוֹ
  choice: 在这日
  rationale: 介词בּ加第三人称阳性单数后缀，最自然地回指前面的“日子”。明确译为“在这日”，避免汉语“在其中”的生硬与可能误解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 此处是以色列上帝的专名，而非一般称号。“雅威”较直接地音译YHWH；脚注说明其传统译名，方便读者辨认。
- issue: בּוֹ的指代对象
  choice: 回指“这日”
  alternative: 指向“他”
  rationale: 阳性单数后缀在语法上可以表示“他”或“它”，但紧邻的阳性单数名词הַיּוֹם（这日）提供了最自然的先行词；因此正文明确为“在这日”，不据神学联想改指雅威。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“欢欣喜乐”保留希伯来诗句两个并列近义动词的节奏；句末用感叹号体现两个鼓励式动词的共同劝勉语气。
