  text: לֹֽא אָמ֥וּת כִּי אֶֽחְיֶ֑ה וַ֝/אֲסַפֵּ֗ר מַֽעֲשֵׂ֥י יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/017.yaml
  text: I will not die[a], but I will live and recount the deeds of Yah.
translation:
  language: zh_hans
  text: 我必不死，反要活着，并要述说雅[a]的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”是希伯来文神名的诗体缩略形式；有些译本译作“耶和华”或“主”。
    reason: 说明神名的特殊形式及常见替代译法。
lexical_decisions:
- source_word: לֹא אָמוּת
  choice: 我必不死
  rationale: 否定词与第一人称未完成式构成充满信心的宣告；“必不死”在现代汉语中简洁有力，并与下句形成对照。
- source_word: כִּי
  choice: 反要
  rationale: 此处连接“不死”与“活着”这两个相反结果，语境中的转折功能突出；“反要”自然保留诗句的对照力度。
- source_word: אֶחְיֶה
  choice: 活着
  rationale: 第一人称主语承前省略；与“反要”连用，表达将要继续存活的确信。
- source_word: וַאֲסַפֵּר
  choice: 并要述说
  rationale: ספר的Piel形式表示讲述、宣扬或数说；“述说”既可表达叙述，也保留公开宣告上帝作为的意味。
- source_word: מַעֲשֵׂי
  choice: 作为
  rationale: 该词为复数构造式，指所行的事；“作为”是现代中文宗教诗歌语境中自然且庄重的表达。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的诗体缩略形式，而非完整形式יהוה；音译为“雅”可保留原文在名称形式上的区别。
theological_decisions:
- issue: 神名יָהּ的译法
  choice: 雅
  alternative: 耶和华；主
  rationale: 原文特意使用神名的诗体缩略形式。采用音译并加注，既不把名称泛化为称号“主”，也不将其规范化为完整神名“耶和华”，从而保留原文形式。
- issue: כִּי在本节中的逻辑关系
  choice: 转折：“反要”
  alternative: 因果：“因为”
  rationale: כִּי可表达因果，也可在否定句后引出相反陈述。这里“不死”与“活着”构成鲜明的诗体对照，因此正文采用转折；这一选择不改变诗人确信将存活并述说神作为的核心意思。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“我必不死，反要活着”保留希伯来诗歌的对照和平衡；“并要述说”自然衔接诗人存活后的行动。
