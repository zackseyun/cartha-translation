  text: ט֗וֹב לַ/חֲס֥וֹת בַּ/יהוָ֑ה מִ֝/בְּטֹ֗חַ בִּ/נְדִיבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/009.yaml
  text: It is better to take refuge in Yahweh than to trust in nobles[a].
translation:
  language: zh_hans
  text: 投靠雅威，胜过信赖权贵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王侯”。希伯来语 נְדִיבִים 可指显贵、权势人物或统治者；传统上也常译作“王侯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 此处 טוֹב 与比较介词 מִן 构成“……比……更好”的比较句。汉语用“胜过”简洁自然，也保留智慧格言式语气。
- source_word: לַחֲסוֹת
  choice: 投靠
  rationale: חסה 表示寻求庇护、以某者为避难所；“投靠”在本句中兼具寻求保护与倚赖之意。
- source_word: בַּיהוָה
  choice: 雅威
  rationale: 介词 ב 标明投靠的对象；יהוה 作为上帝的专名，音译为“雅威”。
- source_word: מִבְּטֹחַ
  choice: 胜过信赖
  rationale: מִן 表示比较，בטח 表示信任、倚靠；译作“胜过信赖”与前半句构成清晰对照。
- source_word: בִּנְדִיבִים
  choice: 权贵
  rationale: נְדִיבִים 在此指有地位、有权势的显贵或统治人物；“权贵”比“王子”范围更宽，也适合本节对人间精英的泛指。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以称号替代。
- issue: 比较对象的性质
  choice: 信赖权贵
  alternative: 信赖王侯
  rationale: 原文 נְדִיבִים 并不必然专指具有王族身份的“王侯”，故采用较宽泛的“权贵”，避免把所指范围缩窄。
translation_notes:
  register: 采用简洁、庄重的格言式表达。“投靠……胜过信赖……”保持原文两个不定式结构的平衡，并适合现代普通话朗读。
