  text: יֹֽאמְרוּ נָ֥א בֵֽית אַהֲרֹ֑ן כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/003.yaml
  text: Let the house of Aaron now say[a], “His steadfast love endures forever.”
translation:
  language: zh_hans
  text: '现在，愿亚伦家说：

    “他的慈爱[a]永远长存。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的盟约信实永远长存”。希伯来语 חֶסֶד（ḥesed）可指忠贞的爱、怜悯或盟约信实。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: 愿……说
  rationale: אמר的Qal未完成式第三人称阳性复数在相邻礼仪呼召中带祈使、劝勉语气；“愿……说”既保留第三人称形式，也自然表达呼召。
- source_word: נָא
  choice: 现在
  rationale: 该语气词在此加强催促和劝勉；“现在”比礼貌性的“请”更符合公开礼仪呼召。
- source_word: בֵית אַהֲרֹן
  choice: 亚伦家
  rationale: 该构造短语集体指亚伦的家族，即祭司群体；“亚伦家”保留原文的圣经意象和诗篇排比。
- source_word: כִּי
  choice: 不单独译出
  rationale: 此处כִּי引出所宣告的内容；现代汉语在冒号和直接引语后无需另加“因为”，省译可避免误读为因果关系，同时保留宣告功能。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原义为“直到永远”；与חסד搭配时译作“永远长存”，符合自然汉语，也表达持续不止。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חסד涵盖忠贞之爱、怜悯及盟约信实；“慈爱”简洁庄重，在汉语中能兼顾慈怜与持久忠诚，脚注说明其更广的语义范围。
theological_decisions:
- issue: 盟约颂赞公式中חסד的译法
  choice: 慈爱
  alternative: 盟约信实；怜悯；忠贞之爱
  rationale: 本节赞美上帝恒久的忠诚与恩慈。“慈爱”保留此词的宽广神学内涵，不把它仅限于情感之爱、法律层面的信实或对困苦者的怜悯；脚注呈现盟约层面的可能译法。
translation_notes:
  register: 采用现代、庄重而适合会众诵读的汉语。“现在，愿亚伦家说”保留原文第三人称劝勉和礼仪呼召；两行排版突出呼召与回应的诗歌结构。
