  text: זֶֽה הַ/שַּׁ֥עַר לַ/יהוָ֑ה צַ֝דִּיקִ֗ים יָבֹ֥אוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/020.yaml
  text: This is the gate of Yahweh[a]; the righteous will enter through it.
translation:
  language: zh_hans
  text: 这是雅威的门[a]；义人必从这门进入。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“这是为雅威而设的门”或“这是通向雅威的门”。希伯来语介词ל可表示归属或关联、用途，也可表示方向。
    reason: 保留介词ל在本句中可表达归属、用途或方向的词义与句法歧义；同时修正原脚注替代译文的汉语语法。
lexical_decisions:
- source_word: זֶה
  choice: 这是
  rationale: 指示代词用于指认眼前或刚提到的门；汉语自然补出判断词“是”。
- source_word: הַשַּׁעַר
  choice: 门
  rationale: שַׁעַר通常指城门、院门或门道；此处保留具体的“门”这一意象。
- source_word: לַיהוָה
  choice: 雅威的
  rationale: ל可表达归属、关联、用途或方向；正文采用自然且不排除关联含义的“雅威的”，并以脚注保留“为雅威”及“通向雅威”的可能。יהוה作为专名音译为“雅威”。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 形容词复数作名词，指具有公义品格或被视为正直的人；“义人”简洁、庄重，并保留其伦理与神学分量。
- source_word: יָבֹאוּ
  choice: 要……进去
  rationale: בוא的未完成式在此可表达将来、许可或确定将发生之事；“要进去”在汉语中自然，也不过度限定为命令。
- source_word: בוֹ
  choice: 从这门
  rationale: ב与“门”连用表示经由、穿过；汉语用“从这门进去”清楚表达路径，并明确代词所指。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用现代汉语中可辨识的音译“雅威”，以保留其专名性质，不把它改写为称号。
- issue: לַיהוָה与“门”的关系
  choice: 雅威的门
  alternative: 为雅威的门；通向雅威的门
  rationale: 介词ל在此可以表示归属或关联、用途，也可能表示方向。正文取最简洁的关联表达，脚注列出其他真实可能，避免把经文的空间或礼仪含义定死。
- issue: יָבֹאוּ的语气
  choice: 要……进去
  alternative: 可以进去；将要进去
  rationale: 希伯来语未完成式本身未明确区分单纯将来、许可与带确定性的陈述；“要”较自然，并保留一定语气空间。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“门”的具体意象，以分号呈现原文两个紧密相连的分句；“义人”沿用简洁且广为理解的圣经用语。
