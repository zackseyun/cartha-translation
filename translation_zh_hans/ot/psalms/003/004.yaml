  text: ק֭וֹלִ/י אֶל יְהוָ֣ה אֶקְרָ֑א וַ/יַּֽעֲנֵ֨/נִי מֵ/הַ֖ר קָדְשׁ֣/וֹ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/004.yaml
  text: With my voice I cry to Yahweh[a], and he answers me from his holy mountain[b]. Selah
translation:
  language: zh_hans
  text: '我出声向雅威呼求，


    他从他的圣山[b]回应我[a]。


    细拉'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：“他从他的圣山回应了我。”希伯来语动词在这里可以按过去发生的动作来翻译。
    reason: alternative_reading
  - marker: b
    text: 传统译法也常作“圣冈”或“圣岭”。原词的基本义是“山”，这里很可能指锡安山。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: 我出声
  rationale: 原文直译为“我的声音”，在句首突出有声呼求；“我出声”既保留这一含义，也符合现代汉语表达。
- source_word: אֶל יְהוָה אֶקְרָא
  choice: 向雅威呼求
  rationale: אֶל 表示呼求的方向；קרא 在祷告和危难语境中可指呼喊、求告。“呼求”兼顾发声与祈求之意。神名 יְהוָה 音译为“雅威”，不以称号代替专名。
- source_word: וַיַּעֲנֵנִי
  choice: 回应我
  rationale: 该形式可按叙事性过去动作理解，也可在诗歌中表达鲜明或惯常的行动。现代汉语不标明时态的“回应我”自然保留了这种开放性。
- source_word: מֵהַר קָדְשׁוֹ
  choice: 从自己的圣山
  rationale: הַר 的基本义是“山”；“自己的”自然指回雅威，并保留其圣山很可能是锡安山的背景。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词的确切功能不明，因此采用传统音译，避免加入未经证实的解释。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用以色列上帝的专名；音译“雅威”保存这一点，而不以称号“主”替代。
- issue: וַיַּעֲנֵנִי 的时体含义
  choice: 用不标明时态的“回应我”
  alternative: “回应了我”，明确译作过去发生的动作
  rationale: 希伯来诗歌中的动词形式容许过去事件与鲜明、惯常行动等理解。汉语正文保留其含混性，脚注列出明确的过去时理解。
- issue: “圣山”的所指
  choice: 不在正文中直接增译为“锡安山”
  alternative: 从他的圣山，就是锡安山
  rationale: 语境很可能指锡安，但本节原文只说“他的圣山”；正文避免把合理推断写成明说。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。首行“我出声”传达原文句首“我的声音”的强调；分行保留诗体节奏。“回应我”刻意不加“了”或“常常”，以保存希伯来诗歌动词的时体张力。
