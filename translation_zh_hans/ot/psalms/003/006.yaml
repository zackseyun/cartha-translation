  yaml_path: translation/ot/psalms/003/006.yaml
  text: I will not fear myriads of people who have set themselves all around me[a].
translation:
  language: zh_hans
  text: 我不惧怕成千上万的人；他们四面围住我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们从四面向我列阵。”
    reason: 原文 עָלָי 可表达“向着我、敌对我”，而 שָׁתוּ 有“安置、列阵”之意；此译更明确呈现敌对的指向，但不加入原文未明说的“攻击”动作。
lexical_decisions:
- source_word: לֹא אִירָא
  choice: 我不惧怕
  rationale: 否定词与未完成式合用，在本诗语境中表达信靠之下的坚定态度；“不惧怕”自然庄重，也不必强行限定为单纯将来时。
- source_word: מֵרִבְבוֹת עָם
  choice: 成千上万的人
  rationale: רְבָבוֹת 表示极大的数目，字面可指“万万／许多个万”；“成千上万”在现代汉语中自然地保留人数众多的意象，而不把它误解为精确数字。介词 מִן 在 ירא 后标示惧怕的对象，汉语无需另译。
- source_word: אֲשֶׁר
  choice: 他们
  rationale: 关系词引出描述这些人的从句。拆成分句并用“他们”承接，符合现代汉语表达。
- source_word: סָבִיב
  choice: 四面
  rationale: 表达从周围各方包围的空间意象；“四面”简洁而有诗体感。
- source_word: שָׁתוּ עָלָי
  choice: 围住我
  rationale: שָׁתוּ 是“放置、安置”的完成式；与 סָבִיב 和 עָלָי 连用，表示众人已在诗人周围列阵或站定。“围住我”保留空间图景；עָלָי 所含的敌对意味另见脚注。
theological_decisions: []
