  text: יְ֭הוָה מָֽה רַבּ֣וּ צָרָ֑/י רַ֝בִּ֗ים קָמִ֥ים עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/001.yaml
  text: O Yahweh[a], how many are my adversaries! Many are rising up against me.
translation:
  language: zh_hans
  text: 雅威[a]啊，我的敌人何其多！许多人起来反对我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为四字神名 יהוה（YHWH）；此处按其常见学术拟音译作“雅威”。
    reason: 说明原文神名及其中文译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名；脚注注明其希伯来文形式及常见拟音。
- source_word: מָה רַבּוּ
  choice: 何其多
  rationale: מָה 在此为感叹用法，修饰表示众多的 רַבּוּ；“何其多”自然、庄重，并保留哀叹语气。
- source_word: צָרָי
  choice: 我的敌人
  rationale: 指与诗人敌对、使其受困的人；“敌人”是现代中文中简明自然的对应，也不把敌对方式限定为军事行动。
- source_word: רַבִּים
  choice: 多得很
  rationale: 该词在第二分句句首强调人数众多；中文用“多得很”重现强调，并避免与前句机械重复。
- source_word: קָמִים עָלָי
  choice: 起来攻击我的人
  rationale: קום 与 עַל 连用表示起来敌对某人；“起来攻击我”传达其敌对方向，但不具体限定攻击手段。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的四字神名。正文采用现代中文圣经传统中最为人熟悉的专名“耶和华”，不以“主”这一称号替代；脚注保留“雅威”这一较接近学术重构发音的拟音，以透明呈现差异。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。两句以“何其多”和“多得很”形成递进式重复，保留希伯来诗句的感叹与并行结构。
