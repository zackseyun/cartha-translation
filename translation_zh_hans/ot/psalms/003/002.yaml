  text: רַבִּים֮ אֹמְרִ֪ים לְ/נַ֫פְשִׁ֥/י אֵ֤ין יְֽשׁוּעָ֓תָ/ה לּ֬/וֹ בֵֽ/אלֹהִ֬ים סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/002.yaml
  text: Many are saying of me[c][b][a], “There is no salvation for him in God.” Selah
translation:
  language: zh_hans
  text: '许多人不断议论我[a]，说：

    “他在上帝那里得不到拯救。”

    细拉。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向我的性命说”或“对我这个人说”；这里是指“议论我”或“谈论我”。
    reason: lexical_alternative
  - marker: b
    text: “细拉”可能是音乐或礼仪用语，确切含义不明。
    reason: cultural_note
lexical_decisions:
- source_word: רַבִּים
  choice: 许多人
  rationale: 该形容词在此作名词用，指人数众多而未具体指明的一群人；“许多人”自然保留其复数和不定性质。
- source_word: אֹמְרִים
  choice: 不断议论
  rationale: 分词表达持续或反复的言说；结合 לְנַפְשִׁי，此处译为“不断议论我”比生硬的“对我的性命说”更符合现代汉语。
- source_word: לְנַפְשִׁי
  choice: 我
  rationale: 字面为“向我的生命／魂”，但 נֶפֶשׁ 可指整个人；在此结构中意思是“论到我／对我说”。正文采用自然的代词表达，脚注保留字面形式和句法歧义。
- source_word: אֵין
  choice: 不会
  rationale: אֵין 否定某物的存在或可能；在“拯救”这一事件性名词结构中，汉语“不会拯救他”自然表达敌人所断言的无救结局。
- source_word: יְשׁוּעָתָה
  choice: 拯救
  rationale: 该词指救援、解救，也具有诗篇中较广的救恩意涵；“拯救”既适合眼前危难，又不排除其神学分量。
- source_word: לּוֹ
  choice: 他
  rationale: 引语中的第三人称后缀指诗人；汉语以“他”自然保持敌人谈论诗人的视角。
- source_word: בֵאלֹהִים
  choice: 上帝不会拯救
  rationale: 介词 בְ 的具体关系可理解为“在上帝那里／靠着上帝”，而汉语直译“在上帝里没有给他的拯救”不自然；将上帝表达为施救者，传达语境中的核心断言，同时在神学说明中注明较贴近形式的替代译法。
- source_word: סֶלָה
  choice: 细拉
  rationale: 这是意义未明的音乐或礼仪术语，采用惯常音译，不武断译作“停顿”等。
theological_decisions:
- issue: יְשׁוּעָה 应译作具体的“解救”还是较具神学分量的“拯救／救恩”
  choice: 拯救
  alternative: 解救；救恩
  rationale: 上下文首先涉及从敌人和危难中获救；动词“拯救”能表达具体救援，也保留更广的救恩共鸣。“救恩”在本句中较抽象，“解救”则可能稍弱化诗篇中的关键词联系。
- issue: בֵאלֹהִים 所表达的施救关系
  choice: 上帝不会拯救他
  alternative: 他在上帝那里得不到拯救；他靠上帝也无从得救
  rationale: 原文介词 בְ 可表达在、靠着或关联范围，存在一定张力。正文采用自然汉语陈述敌人的主张，不把它扩展成关于诗人信心的判断；替代译法更显明保留介词形式。
- issue: לְנַפְשִׁי 是指“我的魂”还是整个人
  choice: 议论我
  alternative: 对我说；对我的性命说
  rationale: נֶפֶשׁ 在此可代指诗人本人。按字面译“我的魂”容易造成灵魂与身体二分的额外含义，因此正文采用人称表达，并以脚注说明原文。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以分行和引号呈现敌人的持续言论；“不断”体现希伯来语分词的持续或反复意味。正文避免生硬照搬“在上帝里没有给他的拯救”，同时用脚注和决策说明保留原文的词汇及介词张力。
