  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中的体裁名称，指配乐吟唱的诗歌；中文圣经传统以“诗”表达，简洁自然，也符合正典语境。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 在诗篇标题中可表示作者、归属、奉献对象或关联；“大卫的”保留这种语义幅度，不武断限定为“大卫所写”或“献给大卫”。
- source_word: בְּבָרְחוֹ
  choice: 他逃避……时
  rationale: 介词 בְּ 加带第三人称阳性单数后缀的不定式结构在此表达时间背景；译为“他逃避……时”符合现代汉语。
- source_word: מִפְּנֵי
  choice: 逃避
  rationale: 该词组字面为“从……面前”，与“逃跑”连用时表示躲避某人；合译为“逃避”自然准确。
- source_word: אַבְשָׁלוֹם
  choice: 押沙龙
  rationale: 采用现代中文圣经中通行且易识别的人名译法。
- source_word: בְּנוֹ
  choice: 儿子
  rationale: 名词附第三人称阳性单数后缀，表示“他的儿子”；汉语以“大卫……儿子押沙龙”自然呈现所属关系。
theological_decisions:
- issue: 大卫标题的含义
  choice: 译作“大卫的诗”，保留关联范围的开放性
  alternative: “大卫所作的诗”或“献给大卫的诗”
  rationale: 希伯来语 לְדָוִד 可指作者、归属、奉献对象或其他关联，原文没有明确限定其中一种，因此正文不替原文消除歧义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。正文保持诗篇标题的简洁形式；“他逃避儿子押沙龙时所作”自然交代历史处境，其中“所作”承接“诗”，但不把 לְדָוִד 本身单独限定为作者标记。
