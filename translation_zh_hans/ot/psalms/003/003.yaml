  text: וְ/אַתָּ֣ה יְ֭הוָה מָגֵ֣ן בַּעֲדִ֑/י כְּ֝בוֹדִ֗/י וּ/מֵרִ֥ים רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/003.yaml
  text: But you[a], O Yahweh, are a shield around me, my glory[b], and the one who lifts up my head.
translation:
  language: zh_hans
  text: 然而你，雅威啊，是环绕我的盾牌[a]，是我的荣耀，又是抬起我的头的那一位[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为我作盾牌”或“在我周围作盾牌”。这里的希伯来介词可表示为某人、替某人施行保护；与“盾牌”连用时，也可能带有四面环护的意味。
    reason: lexical_alternative
  - marker: b
    text: “抬起我的头”是希伯来语的形象说法，可表示使人恢复尊严、信心，或使人得以伸冤、重新昂首。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 然而你
  rationale: 连词与独立人称代词连用，在上下文中形成强烈转折，并突出“你”；“然而你”自然保留这种对比和强调。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行拟音译出其专名性质，不以“主”等称号替代，也不采用源自另一种传统读法的“耶和华”。
- source_word: מָגֵן
  choice: 盾牌
  rationale: 该名词指防御用的盾牌；保留诗歌中具体而有力的保护意象。
- source_word: בַּעֲדִי
  choice: 环绕我
  rationale: 该介词可表示“为我、护卫我”，与“盾牌”连用时也可传达四面保护的空间意象；正文采用“环绕我”，同时以脚注保留其他可能。
- source_word: כְּבוֹדִי
  choice: 我的荣耀
  rationale: כבוד 可指荣耀、尊荣或分量；“我的荣耀”保留原文凝练的诗性表达，不把雅威仅仅解释为赐予尊严者。
- source_word: וּ/מֵרִים
  choice: 也是抬起……的那一位
  rationale: 分词表达持续或具有特征性的行动；“那一位”在汉语中自然呈现这一分词谓语。
- source_word: רֹאשִׁי
  choice: 我的头
  rationale: 正文保留“我的头”这一具体意象，不把其尊严、信心或伸冤得以恢复的含义缩减为单一解释。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”既保留专名，也较符合 Yahweh 的拟音；不用称号替代神名。
- issue: “抬起我的头”这一惯用语的处理
  choice: 在正文保留字面意象“抬起我的头”
  alternative: 使我恢复尊严；使我重拾信心；使我得以昂首
  rationale: 该意象可能包含恢复尊严、勇气或得以伸冤等多重含义；正文不将其限定为其中一种，脚注说明其文化语义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。用“然而你”突出与前文困境的转折；保留“盾牌”“荣耀”“抬起我的头”等具体诗歌意象。脚注标记均紧接其所说明的词组。
