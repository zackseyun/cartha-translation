  text: I lay down and slept[a]; I awoke[b], because Yahweh sustains me.
translation:
  language: zh_hans
  text: 我躺下，睡着了；我醒来，因为雅威扶持我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“托住我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכַבְתִּי
  choice: 我躺下
  rationale: שׁכב在此表示躺下，和下文“睡觉”构成简洁自然的动作次序。
- source_word: וָאִישָׁנָה
  choice: 睡觉
  rationale: ישׁן的基本义是睡觉；汉语承接前面的主语“我”，无需重复主语。
- source_word: הֱקִיצוֹתִי
  choice: 又醒了过来
  rationale: קיץ在此为不及物用法，指诗人自己醒来；“醒了过来”符合现代汉语，“又”表现前后动作的推进。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此自然地引出诗人能够安然醒来的原因。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号代替原文中的专名。
- source_word: יִסְמְכֵנִי
  choice: 扶持我
  rationale: סמך可表示支撑、托住或扶持；“扶持我”自然庄重，也能表达雅威持续保护诗人的含义。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用上帝的专名；“雅威”较直接地按通常重构的读音音译，并避免以“主”等称号替代。
- issue: יִסְמְכֵנִי所表达的神圣扶持
  choice: 扶持我
  alternative: 托住我
  rationale: 两者都符合סמך的语义；正文采用较自然、庄重的“扶持”，不把这种支持进一步限定为某一种具体方式。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语，保留原文“躺下—睡觉—醒来—说明原因”的诗性推进。
