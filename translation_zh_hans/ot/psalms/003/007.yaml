  text: ק֘וּמָ֤/ה יְהוָ֨ה הוֹשִׁ֘יעֵ֤/נִי אֱלֹהַ֗/י כִּֽי הִכִּ֣יתָ אֶת כָּל אֹיְבַ֣/י לֶ֑חִי שִׁנֵּ֖י רְשָׁעִ֣ים שִׁבַּֽרְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/007.yaml
  text: Rise up[a], O Yahweh; save me, my God. For you have struck all my enemies on the cheek; you have broken the teeth of the wicked.
translation:
  language: zh_hans
  text: 耶和华啊，求你起来！我的神啊，求你救我！因为你击打了我所有仇敌的脸颊[a]，打断了恶人的牙齿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “脸颊”也可译作“下颌”。希伯来语这两个完成式也可在诗歌中理解为确信将成或一贯的行动： “因为你击打我所有仇敌的下颌，打断恶人的牙齿。”
    reason: 保留 לֶחִי 可指“脸颊”或“下颌”的词义范围，并明确呈现两个完成式可作非完成式理解的时体可能。
lexical_decisions:
- source_word: קוּמָה
  choice: 求你起来
  rationale: 这是קום的祈使式，直接呼求上帝采取行动；加“求”符合现代汉语祷告语气，又保留命令式呼求的力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”等称号替代。
- source_word: הוֹשִׁיעֵנִי
  choice: 求你救我
  rationale: ישׁע的使役式祈使语态带第一人称单数宾语；“救我”保留其广义的拯救、解救含义。
- source_word: אֱלֹהַי
  choice: 我的神
  rationale: 直接保留第一人称所属关系和诗人亲自向神发出的呼求。
- source_word: כִּי
  choice: 因为
  rationale: 在这里自然地引出请求的依据，保留其因果或解释功能。
- source_word: הִכִּיתָ
  choice: 你击打了
  rationale: 按希伯来语完成式的表层时体译为已经发生的行动，同时不削弱诗歌中对神介入的确信。
- source_word: אֶת כָּל אֹיְבַי
  choice: 我所有仇敌
  rationale: 透明呈现全称范围和第一人称所属关系。
- source_word: לֶחִי
  choice: 脸颊
  rationale: לֶחִי可指脸颊或下颌；正文采用自然、具体的“脸颊”，另一可能在脚注说明。
- source_word: שִׁנֵּי רְשָׁעִים
  choice: 恶人的牙齿
  rationale: 保留具体的身体意象；“恶人”自然地表达作名词用的复数形容词所指群体。
- source_word: שִׁבַּרְתָּ
  choice: 打断了
  rationale: 完成式按已完成行动表达；“打断牙齿”在现代汉语中自然，并保留原文猛烈、具体的意象。
theological_decisions:
- issue: 祷告语境中הִכִּיתָ和שִׁבַּרְתָּ两个完成式的时体
  choice: 译作已完成行动：“击打了……打断了”
  alternative: 可理解为确定将成之事或神一贯的行动：“你击打……你打断”
  rationale: 希伯来诗歌的完成式可指过去完成的事，也可能表达确信或特征性行动。正文贴近其完成式形态，不在中文中额外判定具体发生时间；保留诗人以神的行动作为祈求依据的张力。
- issue: 针对仇敌的暴力意象
  choice: 保留击打脸颊和打断牙齿的具体图像
  alternative: 抽象化为“你击败恶人”
  rationale: 原文借身体受击描绘仇敌受辱并失去伤害能力；将其弱化为抽象的失败会损失诗歌意象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以两个“求你”传达祷告式祈使语气；保留平行结构、神名和原文强烈的身体意象，避免古奥措辞。
