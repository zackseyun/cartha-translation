  text: לַ/יהוָ֥ה הַ/יְשׁוּעָ֑ה עַֽל עַמְּ/ךָ֖ בִרְכָתֶ֣/ךָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/008.yaml
  text: Salvation belongs to Yahweh[a]; your blessing be on your people[b]. Selah
translation:
  language: zh_hans
  text: 救恩属于雅威；你的祝福在你的子民身上[a]。细拉[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿你的祝福临到你的子民。”希伯来文此句没有明示动词，既可理解为陈述，也可理解为祈愿。
    reason: alternative_reading
  - marker: b
    text: “细拉”可能是礼仪或音乐方面的标记，确切含义不详。
    reason: cultural_note
lexical_decisions:
- source_word: לַיהוָה
  choice: 属于雅威
  rationale: 介词 לַ 在无动词分句中表达归属或来源；“属于雅威”自然传达救恩归于雅威。神名 יהוה 按其专名译作“雅威”。
- source_word: הַיְשׁוּעָה
  choice: 救恩
  rationale: 该词指拯救、解救；“救恩”既适合诗篇中的现实解救语境，也保留较广的神学含义。
- source_word: עַל
  choice: 临到
  rationale: 与“赐福”和“子民”连用时，表达福分落在或停留于人身上；“临到”是自然、庄重的现代汉语。
- source_word: עַמְּךָ
  choice: 你的子民
  rationale: עַם 在这里指与神有群体关系的百姓；“子民”比泛称“人民”更能保留这种归属关系。
- source_word: בִרְכָתֶךָ
  choice: 你的赐福
  rationale: בְּרָכָה 意为祝福、福分；“赐福”在此与“临到”搭配自然，并明确这是来自神的福。
- source_word: סֶּלָה
  choice: 细拉
  rationale: 其确切功能不明，可能是礼仪或音乐标记，因此音译而不作推测性解释。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质。
- issue: 第二分句无明示动词所产生的语气
  choice: 愿你的赐福临到你的子民
  alternative: 你的赐福临到你的子民
  rationale: 希伯来文是无动词分句，既可理解为祈愿，也可理解为陈述。正文依诗篇祈祷语境采用祈愿式，同时以脚注保留陈述式的真实可能。
translation_notes:
  register: 采用现代、庄重且易懂的诗歌语言。“救恩属于雅威”保留首句的无动词归属结构；第二句以祈愿式入正文，并用脚注保存其陈述式歧义。
