  source_fidelity: 首句“救恩属于雅威”准确表达 לַיהוָה הַיְשׁוּעָה 的归属关系。原文第二分句为无动词名词句，既可能是陈述，也可能在祈祷语境中带祈愿色彩。正文“愿……临到……”将祈愿语气明示化，虽有语境依据，却未在正文保留原文的句法歧义。改为陈述式，并在脚注保留祈愿读法，较能忠实呈现原文。
