  terminology: “雅威”一致呈现 יהוה 为专名；“救恩”“子民”“祝福”均符合诗篇庄重语域，也不对 הַיְשׁוּעָה 或 בִּרְכָתֶךָ 作过度神学化扩展。“细拉”保留音译，并说明其功能不确定，恰当。
