  yaml_path: translation/ot/psalms/071/021.yaml
  text: May you increase my greatness and comfort me again[a][b][c].
translation:
  language: zh_hans
  text: 愿你使我更加尊荣，并转过来安慰我[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必使我更加尊荣，并必转过来安慰我。”希伯来语的未完成时在诗歌中既可表示将来的陈述，也可表达愿望或祈求。
    reason: alternative_reading
  - marker: b
    text: “尊荣”原文直译为“我的伟大”，也可指尊贵、显赫、威严或尊严。
    reason: lexical_alternative
  - marker: c
    text: “转过来”原文直译为“转”或“环绕”；在这里可理解为“转向我”或“转回来”，因而可能含有再次安慰我的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּרֶב
  choice: 愿你使……越发
  rationale: 这是 רבה 的使役式未完成时，意为“使增多、使增大”。诗歌祈祷语境容许愿望或祈求语气；译作“愿你使……越发”自然表达这一语气，同时不把形式本身限定为命令。
- source_word: גְּדֻלָּתִי
  choice: 我越发尊荣
  rationale: גְּדוּלָּה 可指伟大、显赫、尊贵或尊严。直译“我的伟大”在现代汉语中较生硬，且易被理解为自夸；“使我越发尊荣”保留地位或尊严获得提升的含义。
- source_word: וְתִסֹּב
  choice: 又转身
  rationale: סבב 的基本意象是“转、转身、转向”。这里与“安慰我”相连，可能表示转向诗人或再次转来；正文保留“转身”的意象，不直接消除其方向和重复意味的含混。
- source_word: תְּנַחֲמֵנִי
  choice: 安慰我
  rationale: נחם 的加强式在此指安慰、慰藉。“安慰我”是现代汉语中自然、庄重且准确的表达。
theological_decisions:
- issue: 两个未完成时动词的语气
  choice: 按祈愿译为“愿你……又……”
  alternative: 按将来或信心陈述译为“你必……又必……”
  rationale: 希伯来诗歌中的第二人称未完成时既可表达将来的确信，也可带有祈愿色彩。上下文的直接呼求支持祈愿读法，但脚注保留将来陈述的可能，以免消除原文张力。
- issue: “转身”与再次安慰的关系
  choice: 正文保留“转身”的动作意象
  alternative: 意译为“再次安慰我”
  rationale: 原文明确使用 סבב，而非表示“再次”的普通副词。保留转身或转向的意象更贴近原文；其在语境中可能包含“转回来再次安慰”的意思，故在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语言。“使我越发尊荣”避免“增大我的伟大”一类生硬表达；“又转身安慰我”有意保留希伯来语的动作意象及其可能的重复意味。
