  yaml_path: translation/ot/psalms/071/008.yaml
  text: My mouth will be filled with your praise[b][a], with your splendor all day long.
translation:
  language: zh_hans
  text: 我的口必终日充满对你的赞美[a]和你的荣美[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的口满是对你的赞美”，也可能译作：“愿我的口充满对你的赞美。”希伯来语未完成式在诗歌语境中可表达将来、现在或祈愿的意味。
    reason: alternative_reading
  - marker: b
    text: “荣美”或译“荣耀”“华美”或“威荣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלֵא
  choice: 必充满
  rationale: 该词是מלא的尼法勒未完成式；“必充满”保留被动意味，并按上下文表达将来或持续结果，同时不把可能的祈愿语气写死。
- source_word: פִי
  choice: 我的口
  rationale: 直译为“我的口”，自然表达口中发出的赞美，也保留希伯来诗歌的身体意象。
- source_word: תְּהִלָּתֶךָ
  choice: 对你的赞美
  rationale: 后缀可表达属于或指向上帝的赞美；“对你的赞美”在现代汉语中明确而自然。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁、庄重地表达整日持续不断的时间含义。
- source_word: תִּפְאַרְתֶּךָ
  choice: 你的荣美
  rationale: תפארת兼有荣光、美丽、尊荣和威严等含义；“荣美”能较好保留荣耀与美丽并存的诗意。
theological_decisions:
- issue: יִמָּלֵא在诗歌语境中的语气和时态
  choice: 正文采用陈述性的“必充满”
  alternative: “满是”或“愿……充满”
  rationale: 未完成式可有将来、现在持续或祈愿意味。正文依语境采用自然的结果性陈述，脚注保留其他真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“终日颂扬”自然补出希伯来诗句后半句省略的言说动作，同时维持“赞美”与“荣美”的平行关系。
