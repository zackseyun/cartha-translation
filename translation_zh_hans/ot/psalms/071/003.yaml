  text: הֱיֵ֤ה לִ֨/י לְ/צ֥וּר מָע֡וֹן לָ/ב֗וֹא תָּמִ֗יד צִוִּ֥יתָ לְ/הוֹשִׁיעֵ֑/נִי כִּֽי סַלְעִ֖/י וּ/מְצוּדָתִ֣/י אָֽתָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/003.yaml
  text: Be for me a rock of refuge[a], to which I may always come; you have commanded salvation for me[b], for you are my crag and my fortress.
translation:
  language: zh_hans
  text: 求你作我避难的磐石[a]，使我能常常来投奔；你已经下令拯救我[b]，因为你是我的岩石、我的堡垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作我的磐石、居所”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“你已经命令要拯救我”；也可译：“你已经命定要拯救我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱיֵה לִי
  choice: 求你作我
  rationale: 祈使式是在祷告中直接向上帝发出恳求；用“求你作我”既保留祈求语气，也符合现代汉语表达。
- source_word: לְצוּר מָעוֹן
  choice: 避难的磐石
  rationale: צוּר是“磐石、岩体”；מָעוֹן通常指“居所”，但在保护意象中可表达可安身避难之处。“避难的磐石”自然呈现上下文功能，同时以脚注保留“居所”的字面可能。
- source_word: לָבוֹא תָּמִיד
  choice: 让我随时都可以投奔
  rationale: בוא意为“来、进入”，תמיד表示持续或经常；依托避难所意象，“投奔”比单说“来”更自然，“随时都可以”保留持续可接近的含义。
- source_word: צִוִּיתָ לְהוֹשִׁיעֵנִי
  choice: 你已经下令拯救我
  rationale: צוה的加强词干明确带有“命令、下令”的意义；后接“拯救我”的不定式。此译法保留原文强烈的命令措辞，不将其预先解释为较抽象的“命定”。
- source_word: כִּי
  choice: 因为
  rationale: 引出诗人提出恳求的根据，现代汉语用“因为”清楚自然。
- source_word: סַלְעִי
  choice: 我的岩石
  rationale: סלע可指岩石、峭壁；译为“岩石”既保留保护性的岩体意象，也与前面的צוּר“磐石”略作区分。
- source_word: וּמְצוּדָתִי
  choice: 我的堡垒
  rationale: מצודה指堡垒或坚固保障之所；“堡垒”形象鲜明，并与全节的保护意象一致。
theological_decisions:
- issue: צִוִּיתָ לְהוֹשִׁיעֵנִי应保留“命令”的强烈措辞，还是解释为“命定要拯救”
  choice: 你已经下令拯救我
  alternative: 你已经命定要拯救我
  rationale: 原文明确使用“命令”一词。正文保留这一措辞，可呈现上帝发令施行拯救的力度，却不进一步限定其系统神学含义；脚注列出较解释性的“命定”译法。
- issue: מָעוֹן在“磐石”之后是按功能译作“避难”，还是按通常词义译作“居所”
  choice: 避难的磐石
  alternative: 作我的磐石、我的居所
  rationale: 上下文中的岩石与堡垒都指向保护，“避难”适合现代汉语并呈现该搭配的功能；然而“居所”是מָעוֹן更直接的词义，因此以脚注保留，不消除原文的词汇歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保持诗篇祷告的直接恳求语气。用“磐石—岩石—堡垒”延续并适度区分原文的防护意象；不以教派术语解释“下令拯救”。
