base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/009.yaml
  text: Do not cast me off in the time of old age[a]; when my strength fails[c][b], do not forsake me.
translation:
  language: zh_hans
  text: 在我年老的时候，求你不要丢弃我[a]；我的力量衰竭时[b]，求你不要离弃我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丢弃”也可译作“抛弃”或“弃绝”。希伯来语动词带有把人抛开或丢掉的意味。
    reason: lexical_alternative
  - marker: b
    text: “衰竭”也可译作“耗尽”。
    reason: lexical_alternative
  - marker: c
    text: “离弃”也可译作“撇下”或“抛弃”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: 丢弃我
  rationale: 该词是 שׁלך 的使役式，可表达把人抛开、丢掉或弃绝。“丢弃我”既保留被当作无用之物弃置的意象，也符合诗篇恳求的语气。
- source_word: לְעֵת זִקְנָה
  choice: 我年老的时候
  rationale: עֵת 指时候、时期，זִקְנָה 指年老或老年。“我年老的时候”在现代汉语中自然，也明确保留时间含义。
- source_word: כִּכְלוֹת
  choice: ……衰竭时
  rationale: כלה 在此表示耗尽、终止；前置的 כִּ 构成时间情境。“衰竭时”自然表达力量逐渐耗尽，而不把过程解释得过细。
- source_word: כֹּחִי
  choice: 我的力量
  rationale: כֹּחַ 可指力量、能力或精力；在年老的语境中，“力量”最直接、宽泛，也保留原词的普通意义。
- source_word: תַּעַזְבֵנִי
  choice: 离弃我
  rationale: עזב 可表示离开、抛弃或弃绝。“离弃”适合诗歌祷告的庄重语域，同时为现代读者所理解。
- source_word: אַל
  choice: 求你不要
  rationale: אַל 与未完成式连用，在这里表达迫切的否定祈求。汉语祷告中用“求你不要”比单纯命令式更自然，并准确传达恳求语气。
theological_decisions:
- issue: 年老、力量衰竭与上帝同在之间的恳求
  choice: 译为诗人在年老、力量衰竭之际，直接恳求上帝不要丢弃或离弃他
  alternative: 理解为一般性的受苦哀诉，不特别突出年老
  rationale: 原文明确提到“年老的时候”和“我的力量衰竭时”。译文保留诗人在具体软弱处境中对上帝的倚赖，不加入经文本身未说明的教义推论。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。两处“求你不要”对应原文重复的否定恳求；“丢弃”与“离弃”保留两个希伯来动词之间相关但不完全相同的表达。
