base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/004.yaml
  text: My God[a], rescue me from the hand of the wicked[c][b], from the grasp of the unjust and violent man.
translation:
  language: zh_hans
  text: 我的神啊，求你救我脱离恶人之手，脱离行不义、残暴之人的掌控[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掌控”原文直译为“手掌”；这里指权势或控制。
    reason: lexical_alternative
  - marker: b
    text: “残暴”也可译作“凶暴”或“欺压人的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: 我的神啊
  rationale: 这是带第一人称单数词尾的直接呼告；“我的神啊”既准确表达所属关系，也符合现代汉语祷告语体。
- source_word: פַּלְּטֵנִי
  choice: 求你救我脱离
  rationale: 该祈使形式表达从危险或控制中获救；结合后面的介词短语，译为“救我脱离”自然清楚，并保留恳求语气。
- source_word: מִיַּד רָשָׁע
  choice: 脱离恶人的手
  rationale: 保留“手”的希伯来语意象；此处“手”也表示恶人的权势和控制。רָשָׁע是单数实体化形容词，译作“恶人”。
- source_word: מִכַּף
  choice: 脱离……的掌控
  rationale: כף字面指“手掌”，在此惯用表达中指落在某人的控制之下；“掌控”传达其含义，同时与前句的“手”形成自然变化。
- source_word: מְעַוֵּל
  choice: 行不义……之人
  rationale: 该分词描写施行不公、不义行为的人；用“行不义”保留其道德及司法色彩。
- source_word: וְחוֹמֵץ
  choice: 和强暴
  rationale: 该词描写暴烈、残酷或压迫人的行为特征；“强暴”较贴近其暴力和欺压意味，并与“行”共同支配，形成自然汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“我的神啊，求你……”体现直接呼求；前半保留“手”的原文意象，后半用“掌控”表达“手掌”在此处的惯用含义。将两个分词理解为对同一单数迫害者的并列描写，不额外限定其性别。
