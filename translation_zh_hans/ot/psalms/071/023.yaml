base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/023.yaml
  text: My lips will shout for joy when I sing praise to you[a], and my soul[c][b], which you have redeemed.
translation:
  language: zh_hans
  text: 我向你歌颂时，我的嘴唇必欢呼[a]；我这蒙你救赎的性命[b]也必欢呼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欢然歌唱”；希伯来语动词既可表示喜乐的呼喊，也可表示欢快的歌唱。
    reason: lexical_alternative
  - marker: b
    text: “性命”或译“灵魂”“自己”或“全人”；希伯来语词可指人的内在生命、性命或本人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַנֵּנָּה
  choice: 必欢呼
  rationale: 该词是 רנן 的加强式，可指欢快的呼喊，也可指欢然歌唱；“欢呼”保留其高昂、喜乐的声音意象，不把它限定为纯粹歌唱。
- source_word: שְׂפָתַי
  choice: 我的嘴唇
  rationale: 直译为“我的嘴唇”，保留诗中以身体器官表达赞美之声的形象。
- source_word: כִּי
  choice: ……时
  rationale: כִּי 通常可表“因为”，但此处也可自然理解为引出欢呼发生的时机；译作“……时”符合诗句关系，同时不改变赞美与欢呼的紧密联系。
- source_word: אֲזַמְּרָה לָּךְ
  choice: 我向你歌颂
  rationale: זמר 的加强式常指以歌声或乐声赞美；“向你歌颂”自然表达上帝是赞美的对象。
- source_word: וְנַפְשִׁי
  choice: 我的生命也
  rationale: נֶפֶשׁ 可指生命、自我、整个人或内在生命。此处与“嘴唇”平行，“生命”既保留全人参与赞美的意味，也与下文蒙救赎相配；“也”把希伯来语并列所暗含的平行关系明示出来。
- source_word: פָּדִיתָ
  choice: 蒙你救赎
  rationale: פדה 指付赎价使之得释放，或从危难、奴役中解救；“救赎”保留其释放与属上帝拯救行动的分量，却不限定其具体机制。
theological_decisions:
- issue: 敬拜语境中 פדה 的译法
  choice: 救赎
  alternative: 赎回；解救
  rationale: 本节以耶和华已经施行的拯救作为赞美的根基。“救赎”能保留 פדה 的赎回、释放意涵及诗篇中的神学分量，同时不把经文收窄为某一种后期教义解释。
- issue: נֶפֶשׁ 所指的人的层面
  choice: 生命
  alternative: 灵魂；自己；全人
  rationale: נֶפֶשׁ 的语义范围宽广，未必专指与身体分离的“灵魂”。译作“生命”保留其可指活着的本人或整个自我的含义，并与“你所救赎的”自然衔接。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。为避免后半句在汉语中成为没有谓语的残句，将首句的“必欢呼”在平行分句中补出；这反映希伯来诗歌中共享谓语的省略。保留“嘴唇”的具体意象，并以“生命”呈现 נֶפֶשׁ 的宽广含义。
