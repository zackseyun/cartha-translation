  text: גַּם אֲנִ֤י אוֹדְ/ךָ֣ בִ/כְלִי נֶבֶל֮ אֲמִתְּ/ךָ֪ אֱלֹ֫הָ֥/י אֲזַמְּרָ֣ה לְ/ךָ֣ בְ/כִנּ֑וֹר קְ֝ד֗וֹשׁ יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/022.yaml
  text: I also will praise you with the harp for your faithfulness[a], my God; I will make music to you with the lyre[c][b], Holy One of Israel.
translation:
  language: zh_hans
  text: 我的上帝啊，我也要用瑟赞美你，赞美你的信实[a]；以色列的圣者啊，我要弹琴歌颂你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的真实”。希伯来语这个词既可表示真实，也可表示信实。
    reason: lexical_alternative
  - marker: b
    text: 这里所说的“瑟”和“琴”都是古代弦乐器，两者的确切形制及区别已难以确定。
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: 我也
  rationale: 既承接上文，也保留独立代词所加强的语气；现代汉语中自然简洁。
- source_word: אוֹדְךָ
  choice: 我要……赞美你
  rationale: ידה 的 Hiphil 在敬拜语境中可指称谢或赞美；本节与奏乐歌颂平行，译作“赞美”更贴合诗歌语境。
- source_word: בִכְלִי נֶבֶל
  choice: 用瑟
  rationale: כְּלִי 是器具或乐器的通称，后由 נֶבֶל 具体说明；“瑟”是中文圣经传统中较自然的古代弦乐器名称，但确切形制不明。
- source_word: אֲמִתְּךָ
  choice: 你的信实
  rationale: אֱמֶת 可表达真实、真理或信实；此处作为赞美上帝的内容，“信实”较能表现其可靠可信的品格，同时以脚注保留“真实”的可能。
- source_word: אֱלֹהָי
  choice: 我的上帝啊
  rationale: 保留第一人称所属关系，并用“啊”自然标明直接呼告。
- source_word: אֲזַמְּרָה לְךָ
  choice: 我要……歌颂你
  rationale: זמר 的 Piel 在诗篇中常指以歌唱或奏乐来颂赞；结合紧随其后的乐器，译作“歌颂”兼顾音乐与赞美含义。
- source_word: בְכִנּוֹר
  choice: 弹琴
  rationale: כִּנּוֹר 指一种古代弦乐器；汉语“弹琴”表达以该乐器伴随歌颂，也与前半句的“瑟”有所区分。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 保留这一神圣称号，并以呼告助词“啊”体现其在句中的呼语功能。
theological_decisions:
- issue: 上帝的 אֱמֶת 应译作“信实”还是“真实”
  choice: 信实
  alternative: 真实
  rationale: 语境是在赞美上帝及其拯救作为，“信实”较自然地表达其可信可靠的品格；但原词也可指真实，因此不排除该含义，并在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。用两个呼告“我的上帝啊”和“以色列的圣者啊”呈现希伯来文称谓与直接呼语；以“瑟”和“琴”保持两个不同乐器词的对应，同时用脚注说明其辨识并不确定。
