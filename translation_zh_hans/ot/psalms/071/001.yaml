source:
  edition: WLC
  text: בְּ/ךָֽ יְהוָ֥ה חָסִ֑יתִי אַל אֵב֥וֹשָׁה לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame.
translation:
  language: zh_hans
  text: 雅威[a]啊，我投靠你；愿我永不蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：יהוה（YHWH），通常拟音为“雅威”；“耶和华”为传统中文译名。
    reason: 说明正文所译神名的原文形式，并标明常见传统中文译名。
lexical_decisions:
- source_word: בְּךָ
  choice: 投靠你
  rationale: 介词 בְּ 与动词 חָסָה 连用，指出避难、信靠的对象。中文将宾语自然地并入“投靠你”，保留寻求庇护的意象，不添加原文没有的“单单”等强调。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文使用以色列之神的专名 יהוה，而非一般称号。“耶和华”是现代中文读者最熟悉的传统音译；脚注同时说明其希伯来文形式与另一常见拟音“雅威”。
- source_word: חָסִיתִי
  choice: 我投靠
  rationale: חסה 表示寻求或得到庇护。完成式在这里可表达已经作出的、持续有效的信靠行动；汉语“我投靠你”自然地涵盖这种既成而持续的关系，不必机械加上“已经”。
- source_word: אַל אֵבוֹשָׁה
  choice: 求你……不要让我蒙羞
  rationale: אַל 配第一人称意愿式表达否定祈愿。“求你不要让我”符合汉语祷告语体；“蒙羞”既可指遭受羞辱，也可指所信靠的盼望落空，比单指内心感受的“害羞”更准确。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: לְעוֹלָם 表示恒久、永远；在否定祈愿中，中文“永远不要”自然表达“绝不要、永不”的含义，同时保留原文的时间词。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名，正文因此保留专名而不以称号“上主”替代。“耶和华”顾及现代中文圣经传统与普通读者的辨识度；“雅威”是按学界常见拟音所作的另一译法，相关信息置于脚注，避免声称古代读音已完全确定。
- issue: “蒙羞”的含义
  choice: 不要让我蒙羞
  alternative: 不要使我失望；不要让我羞愧
  rationale: 诗篇中的 בושׁ 不仅涉及主观羞愧，也常包含信靠落空、在敌人面前受辱的层面。“蒙羞”保留这种神学与语义张力，不把它缩减为内心感受或单纯失望。
translation_notes:
  register: 采用自然、庄重而易懂的现代汉语祷告语体。“耶和华啊”保留呼告；分号呈现信靠宣告与祈求之间的结构。
