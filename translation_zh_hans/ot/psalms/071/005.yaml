  text: כִּֽי אַתָּ֥ה תִקְוָתִ֑/י אֲדֹנָ֥/י יְ֝הוִ֗ה מִבְטַחִ֥/י מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/005.yaml
  text: For you are my hope[a], Lord Yahweh[c][b], my confidence from my youth.
translation:
  language: zh_hans
  text: 因为你是我的盼望，主耶和华，是我自幼所倚靠的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出诗人向上帝祈求的理由，保留原文的因果或解释作用。
- source_word: אַתָּה
  choice: 你
  rationale: 保留原文明确的第二人称单数代词及其强调意味。
- source_word: תִקְוָתִי
  choice: 我的盼望
  rationale: 既准确表达“希望、期待”，也符合现代中文祷告语境。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现称号“主”和神名YHWH；“耶和华”是现代中文圣经读者熟悉的神名形式。
- source_word: מִבְטַחִי
  choice: 我所倚靠的
  rationale: 该词可指信赖、信心或所信赖的对象；此处把上帝表述为诗人所倚靠的对象，中文自然且保留关系性含义。
- source_word: מִנְּעוּרָי
  choice: 自幼
  rationale: 表达从青年时期开始并延续至今的时间起点，简洁而庄重。
theological_decisions:
- issue: 复合称呼 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时包含“主”的称号和YHWH神名，正文予以区分，不把神名泛化为普通称谓；采用中文读者较熟悉的“耶和华”，不借此解决神名古音的争议。
- issue: מִבְטַחִי 是主观信赖还是信赖对象
  choice: 我所倚靠的
  alternative: 我的信心；我的倚靠
  rationale: 该名词可兼具“信赖”和“所信赖者”的含义。句法上它与“你是我的盼望”平行，故译作上帝是诗人所倚靠的对象，同时不扩展为特定教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祷告语体。“自幼”比“从我年轻时”凝练自然；句式保留原文两个平行表语：“我的盼望”和“我所倚靠的”。
