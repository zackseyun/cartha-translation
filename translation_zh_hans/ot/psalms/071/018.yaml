base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/018.yaml
  text: Even to old age and gray hairs[a], O God, do not forsake me, until I declare your arm to the next generation[b], your might to everyone who is to come.
translation:
  language: zh_hans
  text: 神啊，即使我年老、头发花白，也不要离弃我，直到我向下一代宣扬你的膀臂[a]，向所有后来的人[b]宣扬你的大能。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “膀臂”也可译作“力量”或“能力”；希伯来原文保留以神的膀臂表示他主动施展大能的比喻。
    reason: lexical_alternative
  - marker: b
    text: “所有后来的人”也可理解为“未来所有世代”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם עַד זִקְנָה וְשֵׂיבָה
  choice: 即使我年老发白
  rationale: “年老”和“白发”共同描写高龄；用现代汉语的自然表达保留白发这一具体意象，并以“即使……也……”体现承接上文的强调语气。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 原文为直接呼告；“神啊”符合现代汉语祷告及诗歌语体。
- source_word: אַל תַּעַזְבֵנִי
  choice: 不要离弃我
  rationale: “离弃”准确表达עזב的弃置、抛下之意，也保持诗篇祈求的庄重语气。
- source_word: עַד אַגִּיד
  choice: 直到我……宣扬
  rationale: 保留עַד的界限表达；“宣扬”体现公开讲述、传扬的含义。
- source_word: זְרוֹעֲךָ
  choice: 你的膀臂
  rationale: 直译“膀臂”，保留希伯来诗歌以身体意象表达神施展能力的比喻。
- source_word: לְדוֹר
  choice: 向下一代
  rationale: 单数“世代”在语境中指诗人之后的一代；“下一代”在现代汉语中清楚自然。
- source_word: לְכָל יָבוֹא
  choice: 向所有后来的人
  rationale: כָּל与单数形式构成集合意义，指所有将要来到的人；译文保留其面向未来且范围广泛的表达。
- source_word: גְּבוּרָתֶךָ
  choice: 你的大能
  rationale: גְּבוּרָה可指能力、威力，也可涵盖大能作为；“大能”保留这种属性与行动之间的语义张力。
theological_decisions:
- issue: 是否保留“你的膀臂”这一神人同形的诗歌比喻
  choice: 正文保留“你的膀臂”
  alternative: 你的力量；你的能力
  rationale: 原文以“膀臂”描绘神主动施展的能力。保留比喻能维持诗歌和神学意象，同时下句“你的大能”说明其含义。
- issue: לְדוֹר ... לְכָל יָבוֹא所指未来听众的范围
  choice: 先译“下一代”，再扩展为“所有后来的人”
  alternative: 下一代……世世代代；未来所有世代
  rationale: 原文似乎先指紧接的一代，再扩展到所有后来者；译文不把两个平行短语合并为同一范围。
- issue: עַד אַגִּיד所表达的关系
  choice: 译作“直到我……宣扬”
  alternative: 好让我……宣扬
  rationale: “直到”保留עַד的字面时间界限及其语境中隐含的使命目的，不将二者之间的张力单一化为目的关系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗歌语体。“年老发白”自然保留具体意象；“离弃”“宣扬”“大能”维持诗篇的尊严。正文保留“膀臂”的源语比喻，并用脚注说明。
