  text: אֱ֭לֹהִים אַל תִּרְחַ֣ק מִמֶּ֑/נִּי אֱ֝לֹהַ֗/י לְ/עֶזְרָ֥תִ/י חיש/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/012.yaml
  text: God[a], do not be far from me; my God, hurry to help me.
translation:
  language: zh_hans
  text: 神啊，求你不要远离我；我的神啊，求你快来帮助我！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 这里是直接呼告；现代汉语通常用句末语气词“啊”自然地标示呼语，并保留祷告的恳切语气。
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: 求你不要远离我
  rationale: אַל与未完成式动词构成否定请求；加入“求你”明确其祈求功能。“远离我”保留原文兼具空间与关系意味的表达。
- source_word: אֱלֹהַי
  choice: 我的神啊
  rationale: 准确表达第一人称单数所属后缀，并以“啊”标示再次直接呼告。
- source_word: לְעֶזְרָתִי
  choice: 来帮助我
  rationale: 原文直译近于“为帮助我／到我的帮助这里”；汉语与“快”连用时，“来帮助我”自然表达诗人盼望神迅速施援。
- source_word: חִישָׁה
  choice: 求你快来
  rationale: 该形式表达催促、赶快之意；译作“求你快来”符合现代祷告语言，其中“来”由救助语境自然补出，而非另立新的行动内容。
theological_decisions:
- issue: 两次神名在直接呼告中的译法
  choice: 神啊……我的神啊
  alternative: 神……我的神
  rationale: 希伯来文两处均为直接称呼。现代汉语用“啊”并不显得古旧，且能清楚传达诗人急切而亲近的呼求；第二处保留“我的”，不弱化个人倚靠之意。
- issue: 是否把“远离”解释为离弃
  choice: 保留“远离”
  alternative: 不要离弃我
  rationale: “离弃”会把原文的空间／关系隐喻收窄为明确的弃绝。保留“远离”可维持原文的含义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两句均用“求你”呈现祈求语气，以分号连接原文两个紧密并列的呼求，并用感叹号体现结尾催促的急切感。
