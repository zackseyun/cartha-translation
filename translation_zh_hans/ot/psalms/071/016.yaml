  text: I will come in the mighty deeds of the Lord GOD[a]; I will proclaim your righteousness[c][b], yours alone.
translation:
  language: zh_hans
  text: 我要凭着主耶和华大能的作为前来[a]；我要述说[b]你的公义——唯独你的公义[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凭着……前来”也可译作“带着……而来”或“在主耶和华大能的作为中前来”。希伯来语前置词既可表示凭借或伴随，也可表示处于其中。
    reason: lexical_alternative
  - marker: b
    text: “述说”也可译作“提说”或“宣告”。
    reason: lexical_alternative
  - marker: c
    text: “你的公义”也可理解为“你的公正”，或在本段语境中指“你公义的作为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוֹא
  choice: 我要……而来
  rationale: בוא 的未完成式第一人称单数可表示“来、去、进入”。这里保留基本的动态表达“而来”，不把诗人所指的具体行动解释得过细。
- source_word: בִּגְבֻרוֹת
  choice: 带着……大能的作为
  rationale: גְּבוּרוֹת 是复数，既可指“大能”，也常指彰显大能的作为。译作“大能的作为”与本诗述说上帝作为的语境相合；前置词 ב 的工具性与处所性歧义在脚注中保留。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: אֲדֹנָי 表示“主”，יְהוִה 是上帝的专名；“主耶和华”既区分二者，也符合现代中文圣经语体。
- source_word: אַזְכִּיר
  choice: 我要述说
  rationale: זכר 的使役式在此可表示“提及、 recount、宣告”。“述说”自然庄重，既可涵盖提说，也适合公开传扬上帝公义的诗歌语境。
- source_word: צִדְקָתְךָ
  choice: 你的公义
  rationale: צְדָקָה 的核心义为“公义”，也可在语境中指“公正”或具体的“公义作为”。正文保留核心词，其他可能性收入脚注。
- source_word: לְבַדֶּךָ
  choice: 唯独你的公义
  rationale: לְבַדֶּךָ 强调“唯独你／只属于你”。结合前面的宾语“你的公义”，重复译出“你的公义”，使中文指向清楚，并保留原文的排他性强调。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中上帝专名的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 正文将 אֲדֹנָי 译为“主”，并以中文传统音译“耶和华”标示 יְהוִה，避免把两个不同成分都泛化为称号，同时不引入宗派性解释。
- issue: צִדְקָתְךָ 所表达的公义
  choice: 你的公义
  alternative: 你的公正；你公义的作为
  rationale: “公义”保留该词可指上帝属性、治理原则及其具体行动的语义张力，不在正文中限定为其中一种。
- issue: לְבַדֶּךָ 的强调对象
  choice: 唯独你的公义
  alternative: 唯独你
  rationale: 原文紧接“你的公义”，可理解为强调诗人只述说上帝的公义，也可听作强调这公义唯独属于上帝。正文采用与前一名词短语衔接最自然的读法，但不扩展为关于其他对象的系统性断言。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。分号对应原文两个平行分句；末尾重复“你的公义”，使 לְבַדֶּךָ 的强调在中文中明确有力。所有脚注标记均置于正文相关词句之后。
