source:
  edition: WLC
  text: כִּֽי אָמְר֣וּ אוֹיְבַ֣/י לִ֑/י וְ/שֹׁמְרֵ֥י נַ֝פְשִׁ֗/י נוֹעֲצ֥וּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/010.yaml
  text: For my enemies speak against me[b][a], and those who watch for my life consult together.
translation:
  language: zh_hans
  text: 因为我的仇敌议论我，那些窥伺我性命的人一同商议[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一同商议”也可译作“一同图谋”。上下文带有敌意，但原词本身着重于共同谋议。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人恳求的缘由；现代汉语用“因为”自然保留解释性的因果关系。
- source_word: אָמְרוּ ... לִי
  choice: 议论我
  rationale: אָמְרוּ本义为“说”，לִי在敌对语境中指言语针对诗人。“议论我”在汉语中自然表达敌意言谈，同时不过度具体化其内容。
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: 直接对应带第一人称单数后缀的名词，并保持诗篇庄重的语体。
- source_word: וְשֹׁמְרֵי נַפְשִׁי
  choice: 那些窥伺我性命的人
  rationale: שׁמר在此敌对语境中不是保护，而是怀有恶意地盯梢、伺机加害；נֶפֶשׁ在这里指处于危险中的生命。
- source_word: נוֹעֲצוּ
  choice: 商议
  rationale: 该词表示共同谋议；“商议”保留基本词义，不把语境所暗示的阴谋意味直接写死。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 准确表达众人协调一致地采取行动。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“仇敌”“性命”保留诗篇语感；“窥伺”明确敌意，却没有把动作具体化为已经实施的谋杀。
