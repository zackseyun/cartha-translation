base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/006.yaml
  text: Upon you I have leaned from the womb; from my mother’s inward parts you are the one who brought me out[a]. In you is my praise continually.
translation:
  language: zh_hans
  text: 我从母腹起就倚靠你；从我母亲的腹中，是你把我带出来的。[a]我常常赞美你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这里所用的词与前一句译作“母腹”的词不同，字面可指“我母亲的内里”。按出生的语境，正文译作“从我母亲的腹中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ נִסְמַכְתִּי
  choice: 我……倚靠你
  rationale: 保留סמך所表达的倚靠、依托意象，同时用现代汉语自然表达对上帝的依赖；不改译为较被动的“蒙你扶持”。
- source_word: מִבֶּטֶן
  choice: 从母腹中
  rationale: בטן在这里指母腹；“从母腹中”保留出生意象，也符合庄重的诗歌语体。
- source_word: מִמְּעֵי אִמִּי
  choice: 从我母亲腹中
  rationale: מֵעֶה字面指内脏、腹内；此处按生育语境译作“腹中”，避免现代汉语中“内脏”造成不当的生理突兀。原文与前句使用不同词语，相关差异在脚注说明。
- source_word: אַתָּה
  choice: 是你
  rationale: 独立人称代词带有强调作用；“是你”自然地突出上帝是施行这一行动的那一位。
- source_word: גוֹזִי
  choice: 把我带出来的
  rationale: 按出生语境理解为使诗人从母腹出来。此译保留具体意象，不扩展为泛义的“拯救者”，也不采用语义存疑且生硬的“割出”。
- source_word: בְּךָ תְהִלָּתִי תָמִיד
  choice: 我常常赞美你
  rationale: 将紧凑的希伯来语关系按自然现代汉语表达为持续以神为对象的赞美；“常常”传达תָמִיד的延续性。
theological_decisions:
- issue: 出生意象中的施事者
  choice: 把上帝表述为将诗人从母腹中带出来的那一位
  alternative: 侧重上帝自出生以来一直扶持诗人，而不具体描写生产
  rationale: 原文的分词和母腹意象自然地把诗人的出生归于上帝的护理作为；译文保留这种表达，却不额外引入本节没有明说的教义推论。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“倚靠”保留具体依托意象；末句为使汉语自然，将原文较紧缩的“在你里面／关于你的，是我的赞美”表达为“我常常赞美你”。脚注标记已置于相关主句之后。
