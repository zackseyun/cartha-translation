  text: גַּם לְשׁוֹנִ֗/י כָּל הַ֭/יּוֹם תֶּהְגֶּ֣ה צִדְקָתֶ֑/ךָ כִּי בֹ֥שׁוּ כִֽי חָ֝פְר֗וּ מְבַקְשֵׁ֥י רָעָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/024.yaml
  text: My tongue also will speak of your righteousness all day long[a], for those seeking my harm have been put to shame; they have been disgraced.
translation:
  language: zh_hans
  text: 我的舌头也要终日述说你的公义[a]，因为那些谋求加害我的人已经蒙羞，已经受辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的公正”。这里的希伯来语也可包含上帝施行拯救、为人申冤的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 承接上文持续赞美的语境，表明诗人的舌头也加入赞美。
- source_word: לְשׁוֹנִי
  choice: 我的舌头
  rationale: 保留原文具体的身体意象，不抽象化为“我的言语”。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 以自然、庄重的现代汉语保留整日持续不断的时间强调。
- source_word: תֶּהְגֶּה
  choice: 要……述说
  rationale: הגה 可指低声吟咏、默想或发声谈论；以“舌头”为主语时，“述说”自然表达可听见的赞美，同时不失反复思想、传讲的意味。
- source_word: צִדְקָתֶךָ
  choice: 你的公义
  rationale: “公义”保留 צדקה 在诗篇中兼具道德正直、公正审判及拯救申冤的宽广含义。
- source_word: כִּי
  choice: 因为
  rationale: 引出诗人终日赞美上帝的理由。
- source_word: בֹשׁוּ
  choice: 已经蒙羞
  rationale: 以带有当前结果的完成表达对应希伯来语完成式，并传达敌对者落入羞耻的结局。
- source_word: כִּי חָפְרוּ
  choice: 已经受辱
  rationale: 第二个 כִּי 与相邻动词紧密相连；汉语不机械重复“因为”，而用并列递进的结果句表达。חפר 与“蒙羞”意义相近，却更突出受辱、丢脸。
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: 那些谋求加害我的人
  rationale: 保留分词所表达的持续敌意；“谋求加害”自然呈现对方蓄意使诗人遭祸的含义。
theological_decisions:
- issue: 诗篇语境中 צִדְקָתֶךָ 的译法
  choice: 你的公义
  alternative: 你的公正
  rationale: 正文采用含义较宽的“公义”，避免把该词仅限于司法层面的公正；脚注说明其可包含上帝施行拯救和为人申冤的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“终日述说”适合诗歌语体；“蒙羞，受辱”保留原文近义平行而不合并其修辞力度。
