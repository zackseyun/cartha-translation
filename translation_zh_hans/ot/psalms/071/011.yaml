  text: לֵ֭/אמֹר אֱלֹהִ֣ים עֲזָב֑/וֹ רִֽדְפ֥וּ וְ֝/תִפְשׂ֗וּ/הוּ כִּי אֵ֥ין מַצִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/011.yaml
  text: saying[a], “God has forsaken him; pursue and seize him, for there is no one to rescue him.”
translation:
  language: zh_hans
  text: 他们说[a]：“上帝已经离弃他了！追赶他，抓住他！因为没有人救他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们说”原文直译为“说”或“说道”，用于引出所说的话。
    reason: source_form
lexical_decisions:
- source_word: לֵאמֹר
  choice: 他们说
  rationale: 该不定式结构用于引出所说的话；结合上文敌人的言论，译为“他们说”在现代汉语中自然，也清楚标明引语性质。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 虽为复数形式，所搭配的动词为单数，显然是指独一的上帝。
- source_word: עֲזָבוֹ
  choice: 已经离弃他了
  rationale: Qal完成式带第三人称阳性单数宾语后缀，表达敌人声称上帝的离弃已经发生，并与当前处境相关；“离弃”保留哀歌语境的力度。
- source_word: רִדְפוּ
  choice: 追赶他
  rationale: 复数命令式；“追赶”直接表达敌人趁其脆弱而采取的行动，不额外限定为一般性的“迫害”。
- source_word: וְתִפְשׂוּהוּ
  choice: 抓住他
  rationale: 复数命令式带第三人称阳性单数后缀，基本义是抓住或捉拿；“抓住他”自然、鲜明，又不把含义收窄为正式逮捕。
- source_word: כִּי
  choice: 因为
  rationale: 引出追赶和抓捕他的理由，现代汉语用“因为”清楚自然。
- source_word: אֵין מַצִּיל
  choice: 没有人救他
  rationale: אֵין表示不存在，מַצִּיל为使役分词“施救者”；译文保留“无人施救”的个人性含义，并符合现代汉语表达。
theological_decisions:
- issue: 如何表达敌人关于上帝离弃诗人的断言
  choice: 上帝已经离弃他了
  alternative: 上帝已经抛弃他了
  rationale: 这是诗人敌人的言论，并非叙述者对上帝实际作为的神学确认。“离弃”保留嘲讽的沉重语气和哀歌中的张力，却不替读者判定该断言为真。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。引语中连续使用短促命令句，保留希伯来文敌人言辞的急迫和凶狠；不以文言化措辞增加距离感。
