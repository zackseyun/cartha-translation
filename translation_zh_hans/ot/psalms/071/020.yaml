id: PSA.71.20
reference: Psalms 71:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲשֶׁ֤ר הראית/נו צָר֥וֹת רַבּ֗וֹת וְ/רָ֫ע֥וֹת תָּשׁ֥וּב תחיי/נו וּֽ/מִ/תְּהֹמ֥וֹת הָ֝/אָ֗רֶץ תָּשׁ֥וּב תַּעֲלֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/020.yaml
  text: You[a], who have made us see many troubles and calamities, will return and revive us[d][c][b]; and from the depths of the earth you will return and bring me up.
translation:
  language: zh_hans
  text: 你曾使我们见到许多患难和灾祸[a][b]；你必再次使我们复苏[c]，也必再次从大地深处[d]把我带上来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我们见到”也可译作“让我们经历”。希伯来语动词带有使役意味。
    reason: lexical_alternative
  - marker: b
    text: “灾祸”直译可作“恶事”；这里指灾难、苦楚等有害的遭遇，不是道德上的邪恶。
    reason: lexical_alternative
  - marker: c
    text: 希伯来原文在本节先说“我们”，末尾则转为“我”：“使我们复苏……把我带上来。”
    reason: textual_note
  - marker: d
    text: “大地深处”可能比喻极度卑微或濒临死亡的境况，也可能令人联想到下入坟墓或阴间。
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 你曾
  rationale: 此处承接上文，以关系从句指向上帝。现代汉语不宜硬译为“那一位……的你”，因此用“你曾”自然衔接，同时保留直接称呼。
- source_word: הראיתנו
  choice: 使我们见到
  rationale: ראה 的使役式表示“使……看见”或“让……经历”。“使我们见到”保留使役意味，也能自然表达遭遇苦难。
- source_word: צָרוֹת רַבּוֹת
  choice: 许多患难
  rationale: צָרוֹת 指困苦、患难；רַבּוֹת 在这里主要表示数量多。
- source_word: וְרָעוֹת
  choice: 和灾祸
  rationale: 本语境中的 רָעוֹת 指有害而痛苦的遭遇，并非道德意义上的恶行；“灾祸”既清楚又保留其严重性。
- source_word: תָּשׁוּב
  choice: 必再次
  rationale: שוב 在本节连续出现两次，和后面的动词连用，表达重新施行某事。两处都译作“必再次”，保留重复和诗歌结构。
- source_word: תְּחַיֵּנוּ
  choice: 使我们复苏
  rationale: חיה 的加强式在此表示恢复生命或活力。“使我们复苏”不把含义限定为肉身复活。
- source_word: וּמִתְּהֹמוֹת הָאָרֶץ
  choice: 也必再次从大地深处
  rationale: תְּהֹמוֹת 是深处、深渊。译文保留空间意象，不将其直接解释为坟墓。
- source_word: תַּעֲלֵנִי
  choice: 把我带上来
  rationale: עלה 的使役式意为使之上升。“带上来”与“大地深处”的上下空间意象相配，也避免过早限定为复活。
- source_word: ־נוּ ... ־נִי
  choice: 我们……我
  rationale: 马所拉文本先用第一人称复数，末尾转为第一人称单数；译文照原文保留这一人称转换。
theological_decisions:
- issue: רָעוֹת 是指道德上的“恶”，还是人所经历的灾难
  choice: 灾祸，即痛苦的遭遇
  alternative: 恶事；灾难
  rationale: 上下文谈论诗人所遭受的患难。“灾祸”保留伤害和痛苦的含义，却不暗示上帝施行道德上的恶。
- issue: “从大地深处带上来”是否应明确译成复活
  choice: 保留原有的深处与上升意象
  alternative: 从坟墓中使我复活；使我从死里复生
  rationale: 这幅图像可以指极度卑微、濒临死亡或类似阴间的境况，也可能带有复活的回响；原文并未在此明确限定，故不在正文中消除这种张力。
- issue: 原文由“我们”转为“我”是否应统一人称
  choice: 保留“我们……我”的转换
  alternative: 统一译为“我……我”或“我们……我们”
  rationale: 人称转换属于所据马所拉文本，可体现群体经历转入个人祈求；不宜为求表面流畅而抹平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“患难和灾祸”自然表达苦难语境；两次“必再次”对应原文两次 תָּשׁוּב，保留诗行的回环。正文不将“大地深处”收窄为明确的复活术语，并保留“我们”转为“我”的人称变化。
