source:
  edition: WLC
  text: פִּ֤/י יְסַפֵּ֬ר צִדְקָתֶ֗/ךָ כָּל הַ/יּ֥וֹם תְּשׁוּעָתֶ֑/ךָ כִּ֤י לֹ֖א יָדַ֣עְתִּי סְפֹרֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/015.yaml
  text: My mouth will recount your righteousness and your salvation all day long[b][a], for I do not know their number.
translation:
  language: zh_hans
  text: 我的口要终日述说你的公义和你的拯救[a]，因为我不知道其数目。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其数目”指上帝公义与拯救的彰显多得无法数算；“公义”也可译作“正义”或理解为“公义的作为”。
    reason: 说明原文末句隐含的指向，并保留 צְדָקָה 的词义张力。
lexical_decisions:
- source_word: פִּי
  choice: 我的口
  rationale: 保留希伯来文的身体意象，突出以口述说、赞美。
- source_word: יְסַפֵּר
  choice: 述说
  rationale: 此处 piel 形态表示讲述、数说；“述说”自然庄重，也与末句有关数目的语义相呼应。
- source_word: צִדְקָתֶךָ
  choice: 你的公义
  rationale: 保留单数抽象名词的基本意义，不把它直接具体化为“公义的作为”；在诗篇语境中也可涵盖上帝施行公正、信实拯救的行动。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁自然地表达整日、不断持续之意。
- source_word: תְּשׁוּעָתֶךָ
  choice: 你的拯救
  rationale: 既可指救恩，也可指具体的解救；“拯救”在本诗求救与赞美的语境中较为自然，并保留行动意味。
- source_word: כִּי
  choice: 因
  rationale: 按因果连词理解，引出终日述说的理由。
- source_word: לֹא יָדַעְתִּי
  choice: 我无法知晓
  rationale: 字面为“我不知道”；结合后面的“数目”，这里表达数量多得无法掌握，而非单纯未曾获知。
- source_word: סְפֹרוֹת
  choice: 数目
  rationale: 该复数形式可指数字、总数或计数；在此以“数目”表达上帝公义与拯救之彰显多得难以数算。
theological_decisions:
- issue: צִדְקָתֶךָ 应译作抽象属性“公义”，还是具体的“公义作为／正义”。
  choice: 正文采用“你的公义”
  alternative: 你的正义；你公义的作为
  rationale: 希伯来文为单数抽象名词，宜在正文保留“公义”；同时不排除它在诗篇中包含上帝施行公正和拯救的具体行动。
- issue: 末句是否把“数目”明确限定为上帝公义和拯救的作为之数。
  choice: 以代词“其”保留上下文所指，并用脚注说明
  alternative: 直译为“因为我不知道数目”；意译为“因你的作为多得无法数算”
  rationale: 原文没有显明的第三人称复数后缀，也没有写出“作为”，但语境表明诗人无法计数上帝公义与拯救的彰显；正文避免过度补足，脚注说明隐含关系。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“我的口”保留原文意象；“终日述说”简洁流畅。脚注标记置于“拯救”之后，以覆盖前面的“公义”和“拯救”以及末句的计数意象。
