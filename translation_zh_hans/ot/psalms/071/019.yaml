source:
  edition: WLC
  text: וְ/צִדְקָתְ/ךָ֥ אֱלֹהִ֗ים עַד מָ֫ר֥וֹם אֲשֶׁר עָשִׂ֥יתָ גְדֹל֑וֹת אֱ֝לֹהִ֗ים מִ֣י כָמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/019.yaml
  text: And your righteousness[a], O God, reaches to the heights—you who have done great things. O God[b], who is like you?
translation:
  language: zh_hans
  text: 上帝啊，你的公义[a]达到高处[b]；你行了大事。上帝啊，谁像你呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正义”。希伯来语“צדקה”可按语境表示公义或正义。
    reason: lexical_alternative
  - marker: b
    text: 或译“高达天上”。希伯来语原文直译为“直到高处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צִדְקָתְ/ךָ
  choice: 你的公义
  rationale: צדקה在此赞美上帝的品格及作为，主要指其正直、公正的属性；“公义”比单指司法层面的“正义”涵盖更广。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 两处均为直接呼语；用“上帝啊”自然保留诗歌中的呼告语气。
- source_word: עַד מָרוֹם
  choice: 高达穹苍
  rationale: 原文直译为“直到高处”，表达上帝公义达到极高之处；“高达穹苍”保留空间意象，同时脚注说明也可理解为“高达天上”。
- source_word: אֲשֶׁר עָשִׂיתָ גְדֹלוֹת
  choice: 你成就了大事
  rationale: אֲשֶׁר引出与前文相连的关系分句；中文采用独立分句更自然，且不把关系强行解释为因果。
- source_word: גְדֹלוֹת
  choice: 大事
  rationale: 阴性复数形容词在此作名词用，泛指上帝伟大的作为；“大事”简洁并保留原文的宽泛性。
- source_word: מִי כָמוֹךָ
  choice: 谁能与你相比？
  rationale: 这是表达上帝无可比拟的修辞问句；“谁能与你相比”符合现代汉语并保留其力度。
theological_decisions:
- issue: 如何翻译指上帝属性的צדקה
  choice: 公义
  alternative: 正义
  rationale: 此处所赞美的不仅是上帝的司法行为，也包括他整体的正直与信实；“公义”保留较广的道德和关系层面，而“正义”作为可行词义列于脚注。
- issue: עַד מָרוֹם所指的范围
  choice: 高达穹苍
  alternative: 高达天上／直到高处
  rationale: מָרוֹם本义为高处，语境可能使人联想到天上，却没有明确限定为“天”；正文保留诗性空间意象，脚注保存词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以分号呈现前后紧密联系，以短句加强末尾修辞问句的赞颂力度；所有脚注标记均置于对应正文词语之后。
