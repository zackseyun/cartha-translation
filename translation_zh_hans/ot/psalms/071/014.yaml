  text: וַ֭/אֲנִי תָּמִ֣יד אֲיַחֵ֑ל וְ֝/הוֹסַפְתִּ֗י עַל כָּל תְּהִלָּתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/014.yaml
  text: But as for me[a], I will continually hope[c][b], and I will add to all your praise.
translation:
  language: zh_hans
  text: 至于我，我要不断地盼望；我要越发赞美你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“我要加添在一切对你的赞美上”；也可译作“我要增加对你的赞美”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 连词加独立代词突出说话者，并与前文形成对比；“至于我”在现代汉语中自然保留了这种强调与转折意味。
- source_word: תָּמִיד
  choice: 常常
  rationale: 表示持续不断；与“盼望”搭配自然，也保留持续性的语义。
- source_word: אֲיַחֵל
  choice: 我要……盼望
  rationale: יחל 的 Piel 形式表达带着期待的等候或盼望；未完成式在此表达面向未来的持续决心。
- source_word: וְהוֹסַפְתִּי
  choice: 并要更多地
  rationale: יסף 的基本意义是“添加、增多、继续”；结合赞美这一宾语，汉语用“更多地”表达增添之意，避免生硬的“加添于”。
- source_word: עַל כָּל תְּהִלָּתֶךָ
  choice: 赞美你
  rationale: 该结构可直译为“加在你一切的赞美之上”，但“你的赞美”在汉语中容易误解为神发出的赞美；这里采用宾语化表达“赞美你”，以自然语言传达对神的赞美，同时将原文中 כָּל 的范围及增添意象保留在脚注中。
theological_decisions:
- issue: “你的赞美”所指的方向
  choice: 赞美你
  alternative: 你一切的赞美／一切对你的赞美
  rationale: 希伯来语名词附加第二人称后缀，可指属于神、归给神或神所当得的赞美。正文选择现代汉语中方向明确的“赞美你”，不将其解释为神自己发出的赞美。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于我”保留主语的强调和对比；后半句避免“加添于你一切的赞美”这一不自然且易歧义的直译，并用脚注呈现原文意象。
