source:
  edition: WLC
  text: יֵבֹ֣שׁוּ יִכְלוּ֮ שֹׂטְנֵ֪י נַ֫פְשִׁ֥/י יַֽעֲט֣וּ חֶ֭רְפָּה וּ/כְלִמָּ֑ה מְ֝בַקְשֵׁ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/013.yaml
  text: Let those who are hostile to my life be put to shame and come to an end[b][a]; let those who seek my harm be clothed with reproach and disgrace.
translation:
  language: zh_hans
  text: 愿那些与我性命[a]为敌的人蒙羞、消亡[b]；愿那些图谋加害我的人披上羞辱和羞耻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”也可译作“生命”或“自己”。这里的希伯来语常指一个人的生命或本人，并非专指非物质的灵魂。
    reason: lexical_alternative
  - marker: b
    text: “消亡”也可译作“被耗尽”或“灭亡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: 愿……蒙羞
  rationale: 未完成式在诗篇祈求语境中带愿望、祈求意味；“蒙羞”既表达羞耻的结果，也保留咒诅性祈愿的力度。
- source_word: יִכְלוּ
  choice: 消亡
  rationale: כלה在此可指耗尽、完结或灭亡；“消亡”保留其宽泛含义，不限定为肉身死亡。
- source_word: שֹׂטְנֵי נַפְשִׁי
  choice: 与我的性命为敌的人
  rationale: שׂטן的分词表示敌对者；נפש在这里主要指人的性命或自身，而不是特指非物质的灵魂。
- source_word: יַעֲטוּ
  choice: 披上
  rationale: עטה本指披裹衣物；“披上”自然地保留了以凌辱和羞耻为衣的诗歌比喻。
- source_word: חֶרְפָּה
  choice: 凌辱
  rationale: 该词包含公开受辱、遭人讥诮的意味；“凌辱”与后面的“羞耻”有所区分。
- source_word: וּכְלִמָּה
  choice: 和羞耻
  rationale: כְּלִמָּה表示羞耻、羞愧或受辱；译作“羞耻”与“凌辱”构成近义强化。
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: 谋害我的人
  rationale: 分词与רעה的组合表示主动图谋给诗人带来祸害；“谋害我”简洁自然，并保留敌意和行动意图。
theological_decisions:
- issue: 祈愿式咒诅语气
  choice: 用两个“愿”把动词译为向上帝发出的祈求和愿望
  alternative: 译作简单将来陈述：“……必蒙羞、消亡”
  rationale: 在本诗的祷告语境中，连续的未完成式最适合理解为祈愿式，而非对未来的客观预告；这样也不削弱原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言；以“愿”明确祈愿语气，并保留“披上”的原文衣着比喻。
