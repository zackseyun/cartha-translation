  text: כְּ֭/מוֹפֵת הָיִ֣יתִי לְ/רַבִּ֑ים וְ֝/אַתָּ֗ה מַֽחֲסִ/י עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/007.yaml
  text: I have become like a portent to many[a], but you are my strong refuge.
translation:
  language: zh_hans
  text: 我在许多人眼中仿佛成了奇异的兆头[a]，但你是我坚固的避难所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奇事”“征兆”，或“令人惊异的对象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹפֵת
  choice: 仿佛成了奇异的兆头
  rationale: מוֹפֵת可指兆头、奇事或令人惊异之事；כְ明确表达“如同、仿佛”。“奇异的兆头”保留其引人惊异及具有标志性的含义，又不限定为吉兆或凶兆。
- source_word: הָיִיתִי
  choice: 成了
  rationale: היה的完成式第一人称单数在此表达诗人已经进入、并仍处于某种受人注目的状态；现代汉语“成了”自然简洁。
- source_word: לְרַבִּים
  choice: 在许多人眼中
  rationale: 字面可译“对许多人”；结合汉语表达，此处译作“在许多人眼中”，清楚说明诗人在众人看来如同兆头。
- source_word: מַחֲסִי
  choice: 我的避难所
  rationale: מַחֲסֶה指躲避危险、获得保护之处；“避难所”准确保留以神为庇护之地的比喻。
- source_word: עֹז
  choice: 坚固的
  rationale: עֹז意为力量、能力。希伯来语“我力量的避难所”在汉语中自然表达为“我坚固的避难所”，保留保护有力、可靠的含义。
theological_decisions:
- issue: מוֹפֵת描述诗人在众人面前的处境时所含的褒贬色彩
  choice: 译为“奇异的兆头”，不确定它主要是奇事、征兆，还是令人惊异的对象。
  alternative: 可理解为“奇事”“征兆”或“令人惊异的对象”，也可能带有警示意味。
  rationale: 原词语义范围较宽；正文与脚注共同保留其含混性，不把众人的反应限定为正面或负面。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“仿佛”对应比较前缀，“在许多人眼中”使介词关系符合汉语习惯；转折句保留诗人受人惊异与神作可靠庇护之间的张力。
