source:
  edition: WLC
  text: אֱֽלֹהִ֗ים לִמַּדְתַּ֥/נִי מִ/נְּעוּרָ֑/י וְ/עַד הֵ֝֗נָּה אַגִּ֥יד נִפְלְאוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/017.yaml
  text: God[a], you have taught me from my youth, and to this day I declare your wondrous deeds.
translation:
  language: zh_hans
  text: 神啊，你从我幼年就教导我；直到如今，我仍述说你奇妙的作为。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你所行的奇事”，或“你的奇事”。
    reason: נִפְלְאוֹתֶיךָ 可概括指神奇妙非凡的行动，也可较简练地译为“奇事”。
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 此处后接第二人称阳性单数动词和代词后缀，最自然地构成直接呼告；“神啊”符合现代汉语祷告语体。
- source_word: לִמַּדְתַּנִי
  choice: 你……教导我
  rationale: למד 的 Piel 完成式带第一人称单数宾语后缀，意为“你教导了我”；结合从幼年至今的语境，“教导我”自然表达持续至今的影响。
- source_word: מִנְּעוּרָי
  choice: 从我幼年
  rationale: 介词 מִן 表示起点，נְעוּרִים 指年少时期；“从我幼年”既贴近原文，也庄重自然。
- source_word: וְעַד־הֵנָּה
  choice: 直到如今
  rationale: 该短语表示时间延续至说话当下；“直到如今”准确而符合现代书面汉语。
- source_word: אַגִּיד
  choice: 我仍述说
  rationale: נגד 的 Hiphil 未完成式可指述说、宣告；“述说”适合诗篇见证和颂赞的语境，“仍”承接“从幼年……直到如今”的时间跨度。
- source_word: נִפְלְאוֹתֶיךָ
  choice: 你奇妙的作为
  rationale: נִפְלָאוֹת 常指神令人惊奇的行动或奇事；译作“奇妙的作为”使隐含的行动含义在现代汉语中清楚，同时在脚注保留更简练的译法。
theological_decisions:
- issue: אֱלֹהִים 是直接呼告还是关于神的陈述
  choice: 按直接呼告译作“神啊”
  alternative: 译作关于神的陈述，如“神从我幼年就教导我”
  rationale: 紧随其后的“你教导我”和“你的”均为第二人称形式，祷告性的直接呼告最符合希伯来语句法与诗篇语境。
- issue: נִפְלְאוֹתֶיךָ 是否明确为神所行的事
  choice: 译作“你奇妙的作为”
  alternative: 较字面地译作“你的奇事”或“你的奇妙之事”
  rationale: 该词在诗篇中常表示神奇妙非凡的行动；“作为”自然传达这一含义，但脚注保留较简练的可能译法，避免把词义限定得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的祷告与见证语体。“神啊”保留直接呼告；分号呈现前后两小句的时间与行动关系。
