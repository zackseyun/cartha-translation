  yaml_path: translation/ot/psalms/071/002.yaml
  text: In your righteousness rescue me and deliver me[a]; incline your ear to me and save me.
translation:
  language: zh_hans
  text: 求你按你的公义[a]搭救我，使我脱身；求你侧耳听我，拯救我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按你的公义”或译“凭你的公义”；“公义”也可理解为“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתְךָ
  choice: 按你的公义
  rationale: 介词 בְּ 可表示凭借、依据或范围；“按你的公义”自然地表达诗人以神公义的品格和作为为恳求依据，同时保留一定的语义宽度。
- source_word: תַּצִּילֵנִי
  choice: 搭救我
  rationale: נצל 的使役形常指从危险中救出；“搭救”贴合具体危难处境，也与后面的近义动词有所区分。
- source_word: וּתְפַלְּטֵנִי
  choice: 救我脱离患难
  rationale: פלט 的加强形含使人逃脱、使其安全脱身之意；补出语境隐含的“患难”，使现代汉语通顺，并保留脱离险境的方向性。
- source_word: הַטֵּה אֵלַי אָזְנְךָ
  choice: 求你侧耳听我
  rationale: 直译意象为“向我侧耳”；“侧耳听我”保留身体意象，也自然表达恳求神垂听。
- source_word: וְהוֹשִׁיעֵנִי
  choice: 拯救我
  rationale: ישע 的使役形是常见的“拯救”用语；既适用于眼前危难，也保留较广的神学内涵。
theological_decisions:
- issue: 祈求中 צְדָקָה 的译法
  choice: 公义
  alternative: 正义；凭你的公义
  rationale: 此词既可强调神正直、信实的品格，也可带有施行正义之意。“公义”在诗篇语境中涵盖面较广；脚注保留“正义”以及工具性介词译法，避免把含义限于单一理解。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“搭救—救……脱离—拯救”尽量呈现原文三个相关而不完全相同的救援动词；“侧耳”保留希伯来诗歌的具体意象。
