  text: עַמְּ/ךָ֣ נְדָבֹת֮ בְּ/י֪וֹם חֵ֫ילֶ֥/ךָ בְּֽ/הַדְרֵי קֹ֭דֶשׁ מֵ/רֶ֣חֶם מִשְׁחָ֑ר לְ֝/ךָ֗ טַ֣ל יַלְדֻתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/003.yaml
  text: Your people will offer themselves freely on the day of your power[a], in holy splendor; from the womb of the dawn[c][b], to you belongs the dew of your youth.
translation:
  language: zh_hans
  text: 你的百姓在你施展大能的日子甘心献上自己[a]，在圣洁的荣美中[b]；从黎明的母腹而来，属于你的是你青春的甘露[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你大能（或军力）的日子，你的百姓是甘心祭。”希伯来文直用“甘心祭、甘愿奉献之物”来诗意地描写百姓自愿献身；“大能”也可译作“力量、军力、军队”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“身披圣洁的华服”“在圣洁的华美中”或“带着神圣的装束”。
    reason: lexical_alternative
  - marker: c
    text: 末句的希伯来文含义艰深。它可能是说，君王的年轻人如同从黎明母腹而生的甘露；也可能描写君王青春常新的活力。正文保留原文压缩的意象。
    reason: alternative_reading
lexical_decisions:
- source_word: עַמְּךָ
  choice: 你的人民
  rationale: עַם通常指“人民、百姓”。本诗虽有君王征战的背景，却不宜直接窄化为“军队”或“军兵”。
- source_word: נְדָבֹת
  choice: 甘心献上自己
  rationale: 该复数名词本义为“甘心祭、甘愿奉献之物”，在这里作谓语，诗意地描写人民自愿献身；用动词性表达较符合现代汉语，同时保留“甘心”和“献上”的双重意味。
- source_word: בְּיוֹם חֵילֶךָ
  choice: 在你彰显大能的日子
  rationale: חַיִל可指力量、军力或军队。“彰显大能”保留力量与军事威势的语境，又不把多义词限定为“军队”。
- source_word: בְּהַדְרֵי קֹדֶשׁ
  choice: 带着圣洁的荣美
  rationale: 该短语可指圣洁的华美、神圣的装束，或圣洁所具有的荣美。“圣洁的荣美”保留诗意和修饰关系上的开放性。
- source_word: מֵרֶחֶם מִשְׁחָר
  choice: 从黎明的母腹而来
  rationale: 直译其鲜明的出生意象：黎明仿佛母腹，是随后“甘露”意象的来源。加入“而来”使汉语句法完整，但不指定究竟是谁或什么从中出来。
- source_word: לְךָ טַל יַלְדֻתֶיךָ
  choice: 属于你的是你青春的甘露
  rationale: לְךָ表达归属；טַל是“甘露”；יַלְדֻתֶיךָ通常可指“你的青春、年轻时期”，也可能在此诗句中关联年轻人。译文保留压缩而含混的属格意象，不擅自改成“你的青年人如甘露”。
theological_decisions:
- issue: 末句“你青春的甘露”的所指
  choice: 保留“黎明的母腹”“青春的甘露”和归属关系，不把它明确解释为君王的青春活力、年轻战士或受生。
  alternative: 可理解为君王的年轻人如晨露般众多清新；也可理解为君王青春常新的诗意描写；传统中另有与受生意象相联系的基督论解读。
  rationale: 希伯来文高度凝练，句法和意象的关系均有争议。正文不借后来的教义体系消除原文张力，脚注说明主要可能性。
translation_notes:
  register: 采用庄重而可理解的现代标准汉语，保留希伯来诗歌的平行、母腹与甘露意象。正文略带诗性凝练；三个脚注分别交代“甘心祭”、圣洁装束以及末句疑难，不在正文中强行消除歧义。
