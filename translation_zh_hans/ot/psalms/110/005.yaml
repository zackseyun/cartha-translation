  text: אֲדֹנָ֥/י עַל יְמִֽינְ/ךָ֑ מָחַ֖ץ בְּ/יוֹם אַפּ֣/וֹ מְלָכִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/005.yaml
  text: The Lord is at your right hand[a]; he will shatter kings on the day of his wrath.
translation:
  language: zh_hans
  text: 主在你右边[a]；在他发怒的日子，他必击碎列王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你右边的主”可能指本诗所谈到的君王或弥赛亚；也有人认为这里的“主”是施行审判的上帝。
    reason: 保留原文中“主”的指代歧义，避免正文替读者排除其中一种理解。
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主
  rationale: 该词按马所拉元音读作 אֲדֹנָי（“主”），不是本节所用的神名 יהוה。译作“主”既符合现代汉语圣经语体，也不在正文中预先判定所指是谁。
- source_word: עַל
  choice: 在
  rationale: 与“右手”连用时表示位于某人的右侧；汉语用“在……右边”最自然。
- source_word: יְמִינְךָ
  choice: 你右边
  rationale: 原词直译为“你的右手”，此处是位置表达。汉语“在你右边”保留右侧的具体意象，同时避免把它误解为手掌之上。
- source_word: מָחַץ
  choice: 必击碎
  rationale: 该动词表示猛击、压碎或击溃。这里的完成式处于诗歌性的审判宣告中，译为将来意味的“必击碎”，表达行动的确定性和彻底性。
- source_word: בְּיוֹם
  choice: 在……的日子
  rationale: 保留原文“在……之日”的时间结构，同时采用自然的现代汉语表达。
- source_word: אַפּוֹ
  choice: 他发怒
  rationale: אַף 本义与“鼻子”有关，常用作愤怒的习语。译成动词性结构“他发怒”比“他的烈怒之日”更贴近日常现代汉语，仍保留审判的强烈意味。
- source_word: מְלָכִים
  choice: 列王
  rationale: 该复数名词明确指多位君王。“列王”简洁庄重，并保留审判对象的政治身份。
theological_decisions:
- issue: 诗篇110:5中“主”所指的对象
  choice: 正文只译作“主”，不明确指定其为上帝或诗中受话的君王／弥赛亚。
  alternative: 可理解为上帝亲自施行审判；也可理解为站在受话者右边的那位主，即诗中所说的君王／弥赛亚。
  rationale: 原文使用 אֲדֹנָי，而不是本节中的神名 יהוה；本诗的人称和说话对象又容许不同的句法与指代判断。正文保留“主”的宽度，并用脚注说明主要理解，以免把争议性的神学判断写进译文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“主在你右边”保留希伯来诗句简洁有力的语序；“必击碎列王”传达审判宣告的确定性。脚注标记[a]已置于相关短语之后。
