  yaml_path: translation/ot/psalms/110/007.yaml
  text: He will drink from the brook by the way[b][a]; therefore he will lift up his head.
translation:
  language: zh_hans
  text: 他将在路上从溪流中饮水[a]；因此必抬起头来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪流”也可译作“干河床”或“季节性水道”。希伯来语 נחל 可指溪流、溪床或季节性水道。
    reason: lexical_alternative
  - marker: b
