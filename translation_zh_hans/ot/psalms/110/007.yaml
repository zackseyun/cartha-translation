    reason: lexical_alternative
lexical_decisions:
- source_word: מִנַּחַל
  choice: 喝溪水
  rationale: נחל可指溪流、溪床或季节性水道；“溪水”在现代汉语中自然易懂，也保留行进途中饮水得力的诗歌意象。介词מִן以“喝溪水”这一自然汉语结构表达其来源义。
- source_word: בַּדֶּרֶךְ
  choice: 在路上
  rationale: דרך可指道路或行程；“在路上”简洁自然，并可表示行进途中，不额外限定为路旁。
- source_word: יִשְׁתֶּה
  choice: 喝
  rationale: 未完成式在本诗行动序列中可有将来意味；汉语以无时态标记的“喝”配合后句“必”来保持诗句流畅，也不排除生动叙述或惯常意味。
- source_word: עַל־כֵּן
  choice: 因此
  rationale: 清楚表达结果或因果联系，同时保持希伯来诗句的紧凑。
- source_word: יָרִים רֹאשׁ
  choice: 必抬起头来
  rationale: 直译并保留希伯来语意象；此语可暗示重新得力、昂然自信或被高举，不在正文中将多重含义化约为单一解释。
theological_decisions:
- issue: 本节阳性单数动词所指的人物
  choice: 使用“他”，不在译文中明确其身份
  alternative: 明确译为大卫王系君王、诗中的祭司君王或弥赛亚
  rationale: 希伯来文只有未明说身份的阳性单数主语。译文不把后来的正典或神学认定直接加入正文，从而保留君王诗及弥赛亚解读之间的张力。
- issue: “抬起头来”的神学与诗歌含义
  choice: 保留身体意象，不解释为单一结果
  alternative: 译作“重新得力”“昂首得胜”或“被高举”
  rationale: 原文习语可能涉及恢复力量、信心、胜利或高举；直译能保存其诗意与神学开放性。
translation_notes:
  register: 采用现代、庄重而自然的标准普通话。“在路上喝溪水”符合汉语语序；后半句保留“抬起头来”的具体诗歌意象。“必”承接全诗预示性的行动序列，但不额外明确主语身份。
