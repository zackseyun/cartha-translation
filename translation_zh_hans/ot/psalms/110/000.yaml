  yaml_path: translation/ot/psalms/110/000.yaml
  text: Of David[a]. A psalm. Yahweh says to my Lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: zh_hans
  text: '大卫的诗。[a]


    耶和华对我主说：[b]“你坐在我右边，直到我使你的仇敌作你的脚凳。[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的”也可理解为“属于大卫的”“关于大卫的”或“献给大卫的”；希伯来语介词本身没有明确说明这种关系。
    reason: lexical_alternative
  - marker: b
    text: “说”所译的希伯来词用于庄严的宣告或神谕。原文也明确区分“耶和华”（YHWH）与“我主”（adoni）。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“作你脚的脚凳”；意思是使仇敌完全屈服，但正文保留原有意象。
    reason: idiom_explanation
lexical_decisions:
- source_word: לְדָוִד מִזְמוֹר
  choice: 大卫的诗
  rationale: 以自然简洁的中文表达诗篇题记；לְדָוִד 的关系可指作者、归属或关联，因此在脚注保留其可能范围。
- source_word: נְאֻם יְהוָה
  choice: 耶和华……说
  rationale: נְאֻם 是引出庄严神谕或宣告的用语；正文采用现代中文自然说法，并以脚注说明其庄严语气。神名 יהוה 音译为“耶和华”。
- source_word: לַאדֹנִי
  choice: 对我主
  rationale: 准确保留第一人称所属关系，并与神名 יהוה 区分；“我主”既自然，也不预先断定所指者的身份。
- source_word: שֵׁב לִימִינִי
  choice: 你坐在我的右边
  rationale: 保留原文的王权与尊荣方位意象，不扩写其含义。
- source_word: הֲדֹם לְרַגְלֶיךָ
  choice: 作你的脚凳
  rationale: 采用简明、可懂的中文意象，保留“脚凳”这一原文比喻，而不直接释为“被你征服”。
theological_decisions:
- issue: “我主”的身份
  choice: 正文译作“我主”，不加身份说明
  alternative: 译作“我的主上”或直接解释为弥赛亚
  rationale: 原文只写 אֲדֹנִי（我主），没有在本句内明说其具体身份；译文应保留这一开放性及其神学张力。
- issue: יהוה 与 אֲדֹנִי 的区分
  choice: 分别译作“耶和华”和“我主”
  alternative: 两者都译作“主”
  rationale: 希伯来文明确区分神的专名与带所属后缀的尊称；中文也应维持这一区别。
- issue: 仇敌成为脚凳的意象
  choice: 保留“脚凳”比喻
  alternative: 解释为“把仇敌制伏在你脚下”
  rationale: 解释性译法虽能说明征服含义，却会消除原文具体而有张力的王权意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。题记保持简洁；神名与尊称清楚区分；直接引语流畅自然，同时借脚注保存题记、神谕用语和“脚凳”意象中的词义范围。
