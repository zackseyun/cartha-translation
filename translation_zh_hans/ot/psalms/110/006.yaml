id: PSA.110.6
reference: Psalms 110:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יָדִ֣ין בַּ֭/גּוֹיִם מָלֵ֣א גְוִיּ֑וֹת מָ֥חַץ רֹ֝֗אשׁ עַל אֶ֥רֶץ רַבָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/006.yaml
  text: He will judge among the nations[a]; he will fill them with corpses[d][c][b]; he will crush the head over a broad land.
translation:
  language: zh_hans
  text: 他要在列国中施行审判[a]；他要使那里满是尸体[b]；他要击碎辽阔之地上的头[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在列国中”也可理解为“向列国施行审判”。
    reason: 介词 בְּ 在这里可侧重审判发生的范围，也可带出针对列国的意味。
  - marker: b
    text: 原文直译近于“使满是尸体”，没有明说什么被填满；“那里”是按上下文为使汉语通顺所作的补足。也可理解为“使列国满是尸体”。
    reason: 保留 מָלֵא גְוִיּוֹת 的简约句法和宾语省略所产生的歧义，避免把未明说的受事扩大为“遍地”。
  - marker: c
    text: “头”原文为单数；也可理解为“一个首领”，或以单数统称“众首领”。
    reason: 说明 רֹאשׁ 可能具有具体、代表性或集体性含义，而不在正文中定论。
  - marker: d
    text: “辽阔之地上的”也可译为“全地之上的”或“辽阔之地的”。
    reason: אֶרֶץ 可指“地、国土”或“全地”，עַל 也可能表达位置或管辖关系。
lexical_decisions:
- source_word: יָדִין
  choice: 施行审判
  rationale: 该词为 דין 的 Qal 未完成式第三人称阳性单数；在诗歌语境中指将要执行审判。“施行审判”既保留司法含义，也不把它缩减为一般的判断。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם 指“列国”；介词 בְּ 在这里自然表示审判发生于列国之中，而不必明确译成“攻击列国”。
- source_word: מָלֵא גְוִיּוֹת
  choice: 使遍地满是尸体
  rationale: 马所拉文本短促，מָלֵא 的形式和句法关系存在困难，且未明说被填满的对象。正文补出较自然的“遍地”，但用脚注保留希伯来文省略宾语的特点。
- source_word: גְוִיּוֹת
  choice: 尸体
  rationale: 该复数名词在此指战场上的死尸；“尸体”准确保留原文强烈、暴力的意象。
- source_word: מָחַץ
  choice: 击碎
  rationale: 该动词表示猛烈打击、压碎或击破；“击碎”适合本节的战争审判语境，也符合现代汉语诗体。
- source_word: רֹאשׁ
  choice: 头
  rationale: 原文为单数，正文保留具体的单数“头”，不擅自解释为“首领”、集体性的“众首领”或某个特定仇敌。
- source_word: עַל אֶרֶץ רַבָּה
  choice: 辽阔之地上的
  rationale: עַל 保留为空间或管辖关系均可感知的“……上的”；אֶרֶץ 可指土地、国土或全地，רַבָּה 在此可表达广阔。正文避免直接扩大为“全地”。
theological_decisions:
- issue: 王权诗篇中单数“头”的所指
  choice: 保留单数具体表达“头”，不在正文中指明其身份。
  alternative: 译为“一个首领”“众首领”，或解释为某位终极仇敌。
  rationale: 原文没有明确说明这个“头”是谁。保留单数意象，可避免把基督教传统中的某一具体解释直接写入译文。
- issue: אֶרֶץ 的范围
  choice: 正文译为“地”，并以“辽阔”表达 רַבָּה。
  alternative: 译为“全地”“大地”或“许多地方”。
  rationale: אֶרֶץ 既可指一片土地或国土，也可指全地；本节本身不足以唯一确定范围，因此正文采用较少扩张性的译法。
- issue: מָלֵא 的句法与省略宾语
  choice: 按上下文理解为第三人称行动，并在中文正文补出“遍地”作为承受填满动作的范围。
  alternative: 直译为“满是尸体”，或补作“使列国满是尸体”。
  rationale: 希伯来文极其简练，动词形式及其未明说的宾语造成真实歧义。中文需要适度补足才能通顺，但脚注必须说明补足并非原文明说。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“列国”“施行审判”保持诗篇的王权与审判语域；“尸体”“击碎”不弱化原文的战争暴力。分号呈现三个紧凑、平行的动作。所有解释性补足和关键歧义均以脚注交代。
