base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/001.yaml
  text: Of David[a]. A psalm. Yahweh says to my lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: zh_hans
  text: '大卫的诗。[a]


    雅威对我主宣告：[b][c]


    “你坐在我的右边，


    直到我使你的仇敌作你的脚凳。”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的”也可理解为“为大卫的”或“与大卫有关的”。希伯来文标题中的介词可表示作者、归属或关联。
    reason: lexical_alternative
  - marker: b
    text: “宣告”所译的希伯来词可指庄严的宣言或神谕；在此也可较平实地译作“说”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文在此明确区分神名“雅威”（יהוה）和尊称“我主”（אֲדֹנִי）。
    reason: lexical_alternative
  - marker: d
    text: 字面上是“使你的仇敌成为给你的脚的脚凳”；也可按这比喻的含义译作“把你的仇敌放在你脚下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 诗篇标题中的 לְ 可表示作者、归属或关联。“大卫的”是自然简洁的中文，同时不像“由大卫所作”那样把作者身份确定为唯一解释。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是该诗歌体裁标题在中文圣经语境中最通行、自然的表达。
- source_word: נְאֻם
  choice: 宣告
  rationale: 该词常用于庄严的神谕或郑重宣言；“宣告”保留其分量，正文再用“说”自然引出直接引语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之神专名的性质，不以“主”这一称号取代，并与本节的 אֲדֹנִי 清楚区分。
- source_word: לַאדֹנִי
  choice: 我主
  rationale: אֲדֹנִי 是带第一人称单数后缀的尊称，意为“我的主”或“我的主人”。“我主”庄重简洁，并不以排版预先判定其后续弥赛亚解释。
- source_word: שֵׁב
  choice: 你坐
  rationale: 准确表达 ישׁב 的命令式；中文直接引语中补出“你”，表达自然，也保持命令语气。
- source_word: לִימִינִי
  choice: 在我的右边
  rationale: 保留王权、尊荣和同席掌权的空间意象；“右边”是现代中文自然说法。
- source_word: עַד
  choice: 直到
  rationale: 直接保留时间界限表达，不把它解释为此后地位必然改变。
- source_word: אָשִׁית
  choice: 我使……作
  rationale: שׁית 基本义为安置、设立；与“脚凳”搭配时，“使……作”自然表达结果意义。
- source_word: אֹיְבֶיךָ
  choice: 你的仇敌
  rationale: 直接对应复数名词及第二人称阳性单数后缀，措辞庄重而通俗。
- source_word: הֲדֹם לְרַגְלֶיךָ
  choice: 你的脚凳
  rationale: 中文“脚凳”本身已包含“给脚使用”的关系，简洁保留君王战胜并制服仇敌的意象，而不扩写为“践踏在脚下”。
theological_decisions:
- issue: 神名 יְהוָה 与尊称 אֲדֹנִי 的区别
  choice: 分别译为“雅威”和“我主”
  alternative: 分别译为“耶和华”和“我的主”；或译为“主”和“我主”
  rationale: 希伯来文明确使用神的专名和另一个尊称。采用不同译语既忠实保留区别，也避免因两个“主”而造成不必要的混淆。
- issue: “我主”的弥赛亚含义
  choice: 保留词汇层面的“我主”，不在正文直接写成特定身份或加神性称号
  alternative: 译为“我的主基督”或以其他方式明确其弥赛亚身份
  rationale: 本节希伯来文本使用的是尊称而非专名。后续正典对本节的弥赛亚运用十分重要，但译文不应把该解释预先写进词语本身。
- issue: “直到”的神学含义
  choice: 直译为“直到”
  alternative: 解释为“等到……之后就不再坐在右边”或“在……期间”
  rationale: עַד 标示时间达到某一事件，并不自行说明该事件之后座位或权柄是否终止；保留原文张力。
- issue: 仇敌成为脚凳的意象
  choice: 保留“作你的脚凳”
  alternative: 解释为“被你踩在脚下”
  rationale: 直译保存古代王权与得胜的具象比喻，不把比喻完全化为解释性语言。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。标题依中文习惯合为“大卫的诗”；正文保留神谕的郑重语气、右边的尊荣意象和脚凳的得胜比喻。分行帮助读者看出宣告与引语结构，但不增添原文没有的身份说明。
