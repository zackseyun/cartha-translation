  text: נִשְׁבַּ֤ע יְהוָ֨ה וְ/לֹ֥א יִנָּחֵ֗ם אַתָּֽה כֹהֵ֥ן לְ/עוֹלָ֑ם עַל דִּ֝בְרָתִ֗י מַלְכִּי צֶֽדֶק׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/004.yaml
  text: 'Yahweh has sworn and will not change his mind: “You are a priest forever after the manner of Melchizedek.”[a]'
translation:
  language: zh_hans
  text: 耶和华已经起誓，绝不改变心意：“你永远为祭司，照着麦基洗德的样式。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“照我的话（或谕令），麦基洗德。”这句希伯来语较难理解；也有人译作“照着麦基洗德的等次”。
    reason: 保留 עַל־דִּבְרָתִי מַלְכִּי־צֶדֶק 的句法及词义歧义。
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: 已经起誓
  rationale: 完成式表达已经作出的庄严誓言；“已经起誓”在现代汉语中自然，并保留誓言的郑重性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名形式，明确指向以色列之神的圣名，而不以“主”替代。
- source_word: וְלֹא יִנָּחֵם
  choice: 绝不改变心意
  rationale: 此处 נחם 的尼法勒式表示不会反悔或撤回誓言；“绝不改变心意”清楚表达这项誓言的坚定不移。
- source_word: אַתָּה כֹהֵן
  choice: 你是……祭司
  rationale: 保留直接的第二人称称谓和身份宣告；中文无需另加不定冠词。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 简洁、自然地表达持续无尽的时间意义。
- source_word: עַל דִּבְרָתִי
  choice: 照着……的等次
  rationale: 该短语疑难。在本诗语境及古代释读传统中，可理解为与麦基洗德相关的类型、方式或序列；“等次”是中文圣经语体中熟悉且凝练的表达，但脚注保留更贴近字面的其他可能。
- source_word: מַלְכִּי־צֶדֶק
  choice: 麦基洗德
  rationale: 按现代中文圣经通行形式音译此专名，不将其字面义译入正文。
theological_decisions:
- issue: 疑难短语 עַל דִּבְרָתִי מַלְכִּי־צֶדֶק 的理解
  choice: 照着麦基洗德的等次
  alternative: 照我的话（或谕令），麦基洗德
  rationale: 希伯来语的句法和词义均有困难。“照着麦基洗德的等次”在诗篇语境中连贯，也符合古代译读与后来的经典引用；不过，原文可能更直译为“照我的话／谕令，麦基洗德”，因此以脚注保留真实歧义，不把一种神学理解说成唯一可能。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“绝不改变心意”避免“后悔”可能引起的误解；“等次”略带传统经文语感，但在此祭司身份语境中简洁、可懂。
