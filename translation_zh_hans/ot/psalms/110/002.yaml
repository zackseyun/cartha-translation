  text: מַטֵּֽה עֻזְּ/ךָ֗ יִשְׁלַ֣ח יְ֭הוָה מִ/צִּיּ֑וֹן רְ֝דֵ֗ה בְּ/קֶ֣רֶב אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/002.yaml
  text: 'Yahweh sends forth from Zion the scepter of your strength: rule in the midst of your enemies[a][b][c].'
translation:
  language: zh_hans
  text: 耶和华必从锡安发出你大能的权杖[a][b]；你要在仇敌中间[c]掌权。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权杖”也可译作“杖”或“棍”。
    reason: lexical_alternative
  - marker: b
    text: “必……发出”也可译作“发出”，或较具解释性地译作“伸展”。
    reason: lexical_alternative
  - marker: c
    text: “在仇敌中间”也可译作“在仇敌当中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: 权杖
  rationale: 该词可指杖、棍或王权之杖。本诗语境涉及登基与掌权，因此“权杖”既保留具体意象，也自然传达王权含义。
- source_word: עֻזְּךָ
  choice: 你大能的
  rationale: עֹז表示力量、能力或大能。“你大能的权杖”在现代汉语中较为自然，并保留这权杖彰显或承载受话者力量的含义。
- source_word: יִשְׁלַח
  choice: 必……发出
  rationale: 该动词基本义为“差出、发出”。未完成式在此可表达将来的行动；“必……发出”符合诗歌中的宣告语气，又不采用较具解释性的“伸展”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的圣名音译“耶和华”，将其作为专名呈现，而不以“主”这一称号替代。
- source_word: מִצִּיּוֹן
  choice: 从锡安
  rationale: 直接表达来源或起点，并保留“锡安”这一具有王权和神学关联的专名。
- source_word: רְדֵה
  choice: 掌权
  rationale: 祈使式表示统治、管辖。“掌权”在现代汉语中简洁自然，并与王权语境相称；不译为“征服”，以免加强原词并未明确表达的武力意味。
- source_word: בְּקֶרֶב
  choice: 在……中间
  rationale: 该短语可指“在……中间”或“在……当中”。保留“中间”能呈现受膏君王处于敌对势力环绕之中仍掌权的鲜明图景。
- source_word: אֹיְבֶיךָ
  choice: 你的仇敌
  rationale: 直接呈现复数名词及第二人称阳性单数后缀，所指为本诗中受话君王的仇敌。
theological_decisions:
- issue: 诗篇110篇的君王与弥赛亚意象
  choice: 保留“权杖”和“掌权”等君王语言，不在正文中明说受话者的最终身份。
  alternative: 将正文明确译成弥赛亚预言，或弱化王权意象而作泛化处理。
  rationale: 希伯来文本本身描绘一位蒙耶和华支持并受命掌权的君王。此译法既容纳诗篇原有的君王语境，也为正典中的弥赛亚理解保留空间，而不把后续神学结论直接写入本节。
- issue: יִשְׁלַח的时态与语气
  choice: 译作“必……发出”，呈现将来或确定性宣告。
  alternative: 译作一般现在时“发出”，或较具解释性地译作“伸展”。
  rationale: 希伯来语未完成式可依诗歌语境表达将来、持续或未完成的行动。此处与祈使句相接，“必发出”自然体现神将采取行动的宣告，同时以脚注保留其他可能。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“权杖—掌权”保留原文的王权意象；分号体现先有耶和华的行动，继而向君王发出命令的诗句结构。所有脚注标记均置于正文相应位置。
