  text: שִׁ֥יר הַֽ/מַּעֲל֑וֹת מִ/מַּעֲמַקִּ֖ים קְרָאתִ֣י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/001.yaml
  text: A Song of Ascents[a]. Out of the depths I cry to you[b], O Yahweh.
translation:
  language: zh_hans
  text: '上行之歌[a]。


    耶和华啊，我从深处向你呼求[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上行之歌”是这一组诗篇的传统标题；“上行”的具体历史所指并不确定。
    reason: cultural_note
  - marker: b
    text: “呼求”也可译作“曾呼求”；希伯来语动词可理解为简单过去时，正文则保留这篇祷告的当下感。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: 歌
  rationale: 该词本义为“歌”，标题中译作“歌”简明自然，也不额外引入“诗篇”这一较具体的体裁名称。
- source_word: הַמַּעֲלוֹת
  choice: 上行
  rationale: 该复数名词源于“上去、上升”，在这组诗篇的传统标题中译作“上行”，既保留约定俗成的称呼，也不武断判定其具体历史背景。
- source_word: מִמַּעֲמַקִּים
  choice: 从深处
  rationale: 原文为复数“深处、深渊”，在此形象地表达极深的困苦；汉语“从深处”自然凝练，并保留空间隐喻。
- source_word: קְרָאתִיךָ
  choice: 我……向你呼求
  rationale: קרא 的核心义是呼叫、呼求；此处带第二人称宾语。完成式可理解为过去发生的呼求，也可在祷告诗中呈现为当下的呼告。正文用现在语境自然的“呼求”，脚注保留时态上的另一种理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代中文读者熟悉的专名“耶和华”直接呈现四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。正文采用现代简体中文圣经语境中最广为人知的音译“耶和华”，保留其专名性质，不译作称号“主”；“雅威”是较贴近学术重构读音的另一音译。
- issue: קְרָאתִיךָ 的时体
  choice: 以祷告当下的“我……呼求”呈现
  alternative: 我曾向你呼求／我向你呼求了
  rationale: 希伯来语完成式可指已发生的行动，但诗歌中的直接呼告也可作为正在施行的祷告来理解。正文保留祷告的临场感，脚注说明简单过去式的可能性，不把歧义消除。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。标题沿用熟悉的“上行之歌”；正文以“耶和华啊”形成自然的直接呼告。“深处”保留原文的诗性意象，不解释为某一种具体苦难。
