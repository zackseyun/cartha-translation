  text: אֲדֹנָ/י֮ שִׁמְעָ֪/ה בְ/ק֫וֹלִ֥/י תִּהְיֶ֣ינָה אָ֭זְנֶי/ךָ קַשֻּׁב֑וֹת לְ֝/ק֗וֹל תַּחֲנוּנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/002.yaml
  text: Lord[a], hear my voice; let your ears be attentive to the voice of my pleas for mercy.
translation:
  language: zh_hans
  text: 主啊，求你听我的声音；愿你侧耳，留心听我恳求怜悯的声音。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恳求怜悯”或译：“我的恳求。”希伯来语所用的词指为求恩惠或怜悯而发出的迫切恳求。
    reason: 说明 תַּחֲנוּנָי 的词义范围，并保留仅针对该词的较简洁译法。
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝的呼格称谓，并非四字神名；“主啊”在现代汉语祷告中自然、庄重，也保留直接呼求的语气。
- source_word: שִׁמְעָה
  choice: 求你听
  rationale: 该形式在这里表达向上帝发出的祈求。“求你听”既传达命令式的请求力量，也符合汉语祷告语体。
- source_word: בְּקוֹלִי
  choice: 我的声音
  rationale: 保留 קוֹל 的具体意象，并与下半句“……的声音”形成原文中的重复和平行。
- source_word: תִּהְיֶינָה אָזְנֶיךָ קַשֻּׁבוֹת
  choice: 愿你侧耳留心听
  rationale: 原文直指“你的耳朵要留心”。汉语以“侧耳留心听”自然地保留耳朵的身体意象、祈愿语气和专注聆听之意，避免生硬的“愿你的耳朵留心”。
- source_word: לְקוֹל
  choice: 听……的声音
  rationale: 以自然汉语表达介词与“声音”的组合，同时保留本节两次出现“声音”所形成的诗歌呼应。
- source_word: תַּחֲנוּנָי
  choice: 我恳求怜悯
  rationale: 该词指迫切求取恩惠或怜悯的恳求。“恳求怜悯”清楚传达其语义和诗篇中的悔罪、求恩语气；脚注保留较简洁的译法。
theological_decisions:
- issue: 上帝聆听祷告的拟人化表达
  choice: 采用“侧耳留心听”，保留耳朵的身体意象
  alternative: 意译为“求你认真听我”
  rationale: 希伯来文明确使用“你的耳朵”，诗歌借此强调上帝亲自关注祈求者；译文不把这一关系性意象抽象化。
- issue: תַּחֲנוּנָי 所表达的求恩含义
  choice: 译为“我恳求怜悯”
  alternative: 译为“我的恳求”或“我的祈求”
  rationale: 此词不只是一般请求，而是迫切求取恩惠或怜悯；译文明确这一语义，但不加入超出经文的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“主啊”体现直接呼求；分号保留两行诗句的平行结构；重复“声音”以反映希伯来文的刻意复现。脚注标记置于其实际说明的“恳求怜悯的声音”之后。
