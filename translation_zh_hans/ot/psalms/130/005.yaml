source:
  edition: WLC
  text: קִוִּ֣יתִי יְ֭הוָה קִוְּתָ֣ה נַפְשִׁ֑/י וְֽ/לִ/דְבָר֥/וֹ הוֹחָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/005.yaml
  text: I wait for Yahweh[a]; my soul waits[b], and in his word I hope.
translation:
  language: zh_hans
  text: 我等候雅威[a]；我的心等候，我仰望他的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已经等候雅威；我的心已经等候。”这里的希伯来语完成式在上下文中既可表达已经确立的决心，也可表达现在持续的姿态。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我等候他的话”或“我仰望他的应许”。希伯来语既可泛指上帝所说的话，也可按语境理解为他的应许。
    reason: lexical_alternative
lexical_decisions:
- source_word: קִוִּיתִי
  choice: 我等候
  rationale: קוה表示带着期待等候。中文用现在时自然表达诗人当下持续的姿态，同时在脚注中保留希伯来语完成式可能具有的“已经等候”或坚定立场之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文本直接音译四字神名，不以“主”这一称号替代。
- source_word: קִוְּתָה
  choice: 等候
  rationale: 与前句的קוה同根，保留原诗刻意的重复和平行结构。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נפש在这里指人的内在生命或整个自我；“我的心”在现代中文诗歌语体中自然，也避免把它狭义化为与身体分离的“灵魂”。
- source_word: לִדְבָרוֹ
  choice: 他的话
  rationale: דבר可指所说的话，也可在语境中蕴含应许；正文采用较宽泛、直接的“话”，不把含义限定为“应许”。
- source_word: הוֹחָלְתִּי
  choice: 我仰望
  rationale: יחל表达怀着希望的等候。“仰望”既与前两处“等候”保持语义关联，又反映原文换用另一个动词。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。正文采用现代学界通常据其可能读音所作的音译“雅威”，以保留专名性质；“耶和华”是传统汉语形式，“主”则是称号替代。
- issue: “他的话”是否特指应许
  choice: 保留为“他的话”
  alternative: 他的应许
  rationale: דבר本身可泛指言语，也可能在本诗语境中暗含上帝的应许。正文不将这种语境推论固定为唯一含义。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语体。保留“等候”的重复，以呈现希伯来诗句的平行结构；用“我的心”自然表达נפש所指的内在自我。
