  text: יַחֵ֥ל יִשְׂרָאֵ֗ל אֶל יְה֫וָה כִּֽי עִם יְהוָ֥ה הַ/חֶ֑סֶד וְ/הַרְבֵּ֖ה עִמּ֣/וֹ פְדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/007.yaml
  text: Israel[a], wait for Yahweh, for with Yahweh there is steadfast love, and with him is abundant redemption.
translation:
  language: zh_hans
  text: 以色列啊，要等候[a]雅威！因为雅威那里有不变的慈爱，他那里有丰盛的救赎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要盼望雅威”。希伯来语动词兼有怀着盼望等候的意思。
    reason: 保留 יחל 在“等候”与“盼望”之间的词义幅度。
lexical_decisions:
- source_word: יַחֵל
  choice: 等候
  rationale: 该动词兼有“等候”和“盼望”的含义。正文用“等候”保留耐心期待的动作感，并在脚注中说明“仰望”这一合宜译法。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 按现代汉语通行形式音译此专名；这里指受劝勉的以色列群体。
- source_word: אֶל יְהוָה
  choice: 等候雅威
  rationale: 介词 אֶל 本义为“向、朝着”；与 יחל 连用时，现代汉语自然表达为“等候雅威”，也可理解为“仰望雅威”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述劝勉的理由，译作“因为”清楚自然。
- source_word: עִם יְהוָה
  choice: 雅威那里有
  rationale: 保留 עִם“与……同在、在……那里”的空间性表述，同时符合现代汉语习惯。
- source_word: הַחֶסֶד
  choice: 不变的慈爱
  rationale: חֶסֶד 包含慈爱、忠贞与恒久可靠的内涵；“不变的慈爱”以通俗而庄重的方式兼顾这些意味。
- source_word: וְהַרְבֵּה
  choice: 丰盛的
  rationale: 表达数量充足、极其丰富，并与“救赎”自然搭配。
- source_word: עִמּוֹ
  choice: 他那里有
  rationale: 与前句“雅威那里有”形成平行，保留原文重复的介词结构。
- source_word: פְדוּת
  choice: 救赎
  rationale: 该词指付代价赎回或使人脱离困境；“救赎”保留其词义和诗篇语境中的神学分量。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用“雅威”作为其现代汉语音译，以保留专名性质。
- issue: יחל 在劝勉句中的语义
  choice: 等候雅威
  alternative: 仰望雅威
  rationale: 希伯来语动词同时涉及等候和盼望。正文选择“等候”，脚注保留“仰望”，避免抹去原词的语义张力。
- issue: חֶסֶד 的关系性内涵
  choice: 不变的慈爱
  alternative: 慈爱；忠贞的爱
  rationale: 此词既有慈爱，也含恒久忠诚之意；“不变的慈爱”避免把它仅缩减为情感或抽象契约术语。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“雅威那里有……他那里有……”保留原文平行结构；用“以色列啊”明确呼语。
