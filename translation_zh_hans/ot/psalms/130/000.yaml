source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֑וֹת מִ/מַּעֲמַקִּ֖ים קְרָאתִ֣י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/000.yaml
  text: A Song of Ascents[a]. Out of the depths I have called to you[b], Yahweh.
translation:
  language: zh_hans
  text: '上行之歌。[a]


    耶和华啊，我从深处向你呼求。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上行之歌”是诗篇第120—134篇共有的传统标题；“上行”也可理解为“登阶”，具体所指未能确定。
    reason: cultural_note
  - marker: b
    text: “呼求”也可按希伯来语的完成体译作“曾呼求”；正文不标明“曾”或“正”，以保留其既可回顾、又有当下祷告迫切感的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 直译为“上行／登阶之歌”，也是这组诗篇标题在中文中的自然传统表达；不进一步限定其具体礼仪或朝圣背景。
- source_word: מִמַּעֲמַקִּים
  choice: 从深处
  rationale: 保留复数名词所表达的极深困境意象；中文用集合性的“深处”更自然，同时不把它具体解释为某一种苦难。
- source_word: קְרָאתִיךָ
  choice: 我……向你呼求
  rationale: קרא在此指向耶和华发出恳切呼喊；“呼求”比普通的“呼叫”更符合祷告语境。中文未加“曾”或“正在”，可在一定程度上保留完成式既可回顾呼求、又可作为眼前祷告陈述的张力。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名对应四字神名YHWH，而不以“主”替代，从而保留原文使用神名的特点。
theological_decisions:
- issue: 诗人呼求的时间与体貌
  choice: 正文采用不带明确体貌标记的“我……呼求”
  alternative: “我曾向你呼求”或“我正向你呼求”
  rationale: 希伯来语完成式可侧重已经发出的呼求，但整句又构成诗篇当下的祷告开端；不添加“曾”或“正”可避免过早消除这种张力。
- issue: “深处”的性质
  choice: 保留为未具体说明的“深处”
  alternative: 解释为“苦难深渊”“绝望深处”或阴间
  rationale: 原文使用诗性空间隐喻而未明确指定苦难类别或神学领域，因此不作教义化扩展。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祷告语体。称呼语“耶和华啊”置于句首，使中文自然，并不改变原文呼求的对象；正文保持简洁，避免补入原文没有的苦难类型或礼仪背景。
