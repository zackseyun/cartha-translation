  text: וְ֭/הוּא יִפְדֶּ֣ה אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל עֲוֺנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/008.yaml
  text: And he will redeem Israel from all his iniquities[a].
translation:
  language: zh_hans
  text: 他必救赎以色列，脱离他一切的罪孽。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作较符合现代汉语习惯的“脱离他们一切的罪孽”。希伯来文把“以色列”视为一个集合整体，因此使用单数代词“他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: 他
  rationale: 独立代词带有轻微强调，并承接上文；现代汉语用“他”即可自然表达，若译作“他自己”则可能过度强化。句首连接词 וְ 在单节呈现中不必机械译出。
- source_word: יִפְדֶּה
  choice: 必救赎
  rationale: פדה 表示从束缚、债责或困境中赎出；“救赎”既保留赎回的语义，也符合本诗关于耶和华施行拯救的语境。未完成式在此表达将来的确信，译作“必”。
- source_word: אֶת
  choice: （直接宾语标记，不另译）
  rationale: 该词标明“以色列”为确定的直接宾语，现代汉语无需用独立词语对应。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代汉语圣经传统中通行的专名形式，在本句中集体指以色列民。
- source_word: מִכֹּל
  choice: 脱离……一切的
  rationale: 介词 מִן 与 כֹּל 合用，表示从随后所说的全部事物中获释；与“救赎”搭配时，“脱离……一切的”自然且完整。
- source_word: עֲוֺנֹתָיו
  choice: 他一切的罪孽
  rationale: עָוֹן 可指罪孽，也可兼含罪责；此处复数名词带第三人称阳性单数后缀，照应作为集合整体的“以色列”。“罪孽”比泛称的“罪”更能保留原词的严重性及罪责色彩。
theological_decisions:
- issue: “以色列”之后的集合单数代词
  choice: 正文保留单数“他”，把以色列视为一个集合整体。
  alternative: 按现代汉语习惯译作“他们”，指以色列众民。
  rationale: 希伯来文本在单数专名“以色列”之后使用第三人称阳性单数后缀。正文保留这一语法特征，以维持以色列作为整体的群体性描写；脚注提供更符合日常汉语习惯的复数表达，避免读者误解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必救赎”表达诗篇中的确信；保留“他”虽略带非日常感，却准确反映希伯来文的集合单数，并以脚注说明自然的复数译法。
