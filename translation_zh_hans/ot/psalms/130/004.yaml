  text: כִּֽי עִמְּ/ךָ֥ הַ/סְּלִיחָ֑ה לְ֝מַ֗עַן תִּוָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/004.yaml
  text: But with you there is forgiveness[a], so that you may be feared.
translation:
  language: zh_hans
  text: 但在你那里有赦免，为要使人敬畏你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”也可译作“尊崇”。希伯来文直译为“你被惧怕”，常指人对神怀有敬畏之情。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 但
  rationale: 本词常可译为“因为”，但此处承接上节人在严格审判下无法站立的处境，语境具有明显转折作用；译作“但”自然表达这一对比。
- source_word: עִמְּךָ
  choice: 你有
  rationale: 字面为“与你同在”，这里表示赦免在神那里、由神掌有。现代汉语用“你有”比“与你有”自然，同时保留赦免唯独出于神的含义。
- source_word: הַסְּלִיחָה
  choice: 赦免之恩
  rationale: 该名词指赦免或宽恕。“赦免”准确表达罪责得以免除；加“之恩”使“你有……”在汉语中庄重自然，但不把赦免抽象化为人的行为。
- source_word: לְמַעַן
  choice: 为要使
  rationale: 该介词短语引出目的，也可能带结果意味。“为要使”在现代庄重汉语中清楚保留目的指向。
- source_word: תִּוָּרֵא
  choice: 使人敬畏你
  rationale: 源自动词 ירא 的尼法勒式，直义是“你被敬畏”。汉语被动式“你被敬畏”生硬，改用“使人敬畏你”自然表达同一语义，并保留“敬畏”所含的畏惧与崇敬张力。
theological_decisions:
- issue: 神的赦免所带来的回应
  choice: 赦免使人敬畏神
  alternative: 赦免使人尊崇神／对神心生敬畏
  rationale: 希伯来文明确使用 ירא（惧怕、敬畏），不宜只译成“尊敬”而消除其中的畏惧成分；中文“敬畏”能较自然地兼顾畏惧、崇敬与肃然之感。脚注说明其含义不是单纯恐慌。
- issue: לְמַעַן 所表达的逻辑关系
  choice: 保留目的表达“为要使”
  alternative: 按结果理解为“因此人敬畏你”
  rationale: 原文可涉及目的或结果，但目的义更直接；正文保留这一指向，不进一步解释神赦免与人敬畏之间的系统神学关系。
translation_notes:
  register: 采用现代、庄重且易懂的诗歌语言。“赦免之恩”避免口语化，同时不使用生僻或宗派性术语；“敬畏”保留圣经原文中畏惧与崇敬并存的张力。
