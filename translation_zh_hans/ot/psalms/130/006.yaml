  text: נַפְשִׁ֥/י לַֽ/אדֹנָ֑/י מִ/שֹּׁמְרִ֥ים לַ֝/בֹּ֗קֶר שֹׁמְרִ֥ים לַ/בֹּֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/006.yaml
  text: My soul waits for the Lord more than watchmen for the morning[a], more than watchmen for the morning.
translation:
  language: zh_hans
  text: 我的心等候主，胜过守夜的人等候早晨[a]，胜过守夜的人等候早晨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的心向着主，胜过守夜的人向着早晨。”希伯来文此处没有明示动词；“等候”是根据本诗上下文补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נֶפֶשׁ加第一人称单数后缀，字面可作“我的灵魂”，在诗篇中常指带着渴望和倚赖的整个自我。现代汉语诗歌语境中“我的心”自然庄重，也保留内在渴望的意味。
- source_word: לַאדֹנָי
  choice: 等候主
  rationale: 介词ל表示等候或向往的对象；希伯来文此处省略动词，依据第5节语境补出“等候”。אֲדֹנָי是对上帝的尊称，译作“主”。
- source_word: מִשֹּׁמְרִים
  choice: 胜过守夜的人
  rationale: מן在此表示比较，即“胜过”；שֹׁמְרִים是复数分词，指值夜警醒、盼望天明的人。“守夜的人”准确呈现此诗歌意象，且比“守望者”更清楚地显出夜间背景。
- source_word: לַבֹּקֶר
  choice: 等候早晨
  rationale: בֹּקֶר意为“早晨”；结合守夜者的意象，ל表示其期待所向。补出“等候”使现代汉语完整自然，同时保留“早晨”这一基本词义。
- source_word: שֹׁמְרִים לַבֹּקֶר
  choice: 守夜的人等候早晨
  rationale: 原文第二次重复此语，形成强调；译文照样重复，不将其省略或合并。
theological_decisions:
- issue: אֲדֹנָי作为对上帝的称号
  choice: 主
  alternative: 我的主
  rationale: 此处明确指上帝。“主”是现代中文圣经语言中自然而庄重的神圣称号；词形虽源自带第一人称形式的称谓，语境中作为固定神名代称使用，不必机械译出“我的”。
- issue: 无明示动词的理解
  choice: 按上下文补出“等候”
  alternative: 保留为“我的心向着主”
  rationale: 马所拉文本本节前半没有明示动词，但第5节的“等候”以及后面的守夜者盼望早晨之比喻强烈支持补出“等候”。脚注保留原文语法上的开放性，避免把补词误当成明文。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“我的心”兼顾נֶפֶשׁ的诗性与现代可读性；完整保留原文末尾的重复，以传达迫切盼望的加强语气。
