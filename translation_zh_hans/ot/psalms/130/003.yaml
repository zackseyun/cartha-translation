  text: אִם עֲוֺנ֥וֹת תִּשְׁמָר יָ֑הּ אֲ֝דֹנָ֗/י מִ֣י יַעֲמֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/003.yaml
  text: If you[a], Yah, should keep watch over iniquities, Lord, who could stand?
translation:
  language: zh_hans
  text: 耶和华啊，你若追究[a]罪孽，主啊，谁能站立得住呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“察看罪孽”或“把罪过一一记下”。希伯来语动词本义为“保守、看守、留意”，这里指把人的罪记在账上并予以追究。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出假设条件，简洁自然，也保留“倘若如此”的语气。
- source_word: עֲוֺנוֹת
  choice: 罪孽
  rationale: 此词不只泛指犯罪行为，也可包含罪责；“罪孽”保留了原文较重的道德与司法意味。
- source_word: תִּשְׁמָר
  choice: 究察
  rationale: שׁמר本义为保守、看守、留意；在这里指上帝把人的罪记在账上并予以追究。“究察”兼顾审察和追究之意，同时脚注保留更直译的可能。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的诗歌短式，与本节后面的神圣称号 אֲדֹנָי 不同；音译为“雅”以保留原文两种称呼的区别。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这里是直接称呼上帝的惯用尊称；“主”自然、庄重。
- source_word: מִי
  choice: 谁
  rationale: 直接表达反问代词。
- source_word: יַעֲמֹד
  choice: 能站立得住
  rationale: 既保留“站立”的原始意象，也传达在上帝审判面前无人能够承受的反问力量。
theological_decisions:
- issue: 同一节中 יָהּ 与 אֲדֹנָי 的译法
  choice: 分别译为“雅”和“主”
  alternative: 两者都用“主”类称呼，或把 יָהּ 译作“耶和华”
  rationale: 原文有意使用两个不同的神圣称呼。分别译出可避免抹平诗句的称呼变化；“雅”反映 יָהּ 是神名的诗歌短式。
- issue: תִּשְׁמָר 所表达的神圣审察
  choice: 译为“究察”，表示把罪记下并追究
  alternative: 译为“察看”“记住”或“记录”
  rationale: 上下文所问的不是上帝是否看见罪，而是若上帝把罪一一算在人的账上，谁还能经受审判。“究察”保留这一司法意味，又不把含义过度解释进正文。
translation_notes:
  register: 采用现代、庄重的诗歌语言。“究察”略带书面色彩，但在现代汉语宗教诗文中仍易理解；“能站立得住”保留原文意象，也符合自然汉语。
