id: PSA.31.12
reference: Psalms 31:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נִ֭שְׁכַּחְתִּי כְּ/מֵ֣ת מִ/לֵּ֑ב הָ֝יִ֗יתִי כִּ/כְלִ֥י אֹבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/012.yaml
  text: I am forgotten like a dead man[a], out of mind[b]; I have become like a vessel that is lost.
translation:
  language: zh_hans
  text: 我被人遗忘，如同死人，不再被人记在心上[a]；我变得像一件丢失的器皿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记在心上”原文直译为“从心中”；这里指不再被人想起或记念。
    reason: lexical_alternative
  - marker: b
    text: “丢失的”也可译作“毁坏的”或“正在消亡的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכַּחְתִּי
  choice: 我被人遗忘
  rationale: 该词是שׁכח的尼斐勒完成式第一人称单数，表达说话者已经落入“被遗忘”的状态；中文用“被人遗忘”自然呈现这一结果状态。
- source_word: כְּמֵת
  choice: 如同死人
  rationale: כְּ表示比较，מֵת为单数“死者”；“如同死人”保留了单数、具象的比喻。
- source_word: מִלֵּב
  choice: 不再被人记在心上
  rationale: 字面为“从心中”，这里的“心”涉及记忆和意识；此译传达从人的记念中消失这一希伯来语表达，同时以脚注保留字面形式。
- source_word: הָיִיתִי
  choice: 我变得
  rationale: היה的完成式在此说明诗人已处于某种结果状态；“我变得”兼顾变化及当前处境。
- source_word: כִּכְלִי
  choice: 像一件……器皿
  rationale: כְּלִי可指器具、物件或容器；“器皿”保留意象而不过度限定其具体种类，量词“一件”符合现代汉语。
- source_word: אֹבֵד
  choice: 丢失的
  rationale: אבד的分词可表示失落、毁坏或趋于灭亡；与“器皿”连用时，“丢失的”是自然且贴近基本词义的译法，并以脚注保留其他可能。
theological_decisions:
- issue: אֹבֵד所描绘的是丢失、毁坏，还是正在消亡
  choice: 正文译作“丢失的”，脚注说明也可理解为“毁坏的”或“正在消亡的”
  alternative: 直接译作“毁坏的器皿”或“正在消亡的器皿”
  rationale: 原词本身具有较宽的语义范围，语境没有要求把意象限定为物件已破损或正在灭亡，因此不在正文中消除这种张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不再被人记在心上”把希伯来语的心智与记忆习语自然化；分号保留原诗两幅彼此呼应的弃绝意象。
