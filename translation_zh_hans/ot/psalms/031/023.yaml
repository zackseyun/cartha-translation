  text: אֶֽהֱב֥וּ אֶת יְהוָ֗ה כָּֽל חֲסִ֫ידָ֥י/ו אֱ֭מוּנִים נֹצֵ֣ר יְהוָ֑ה וּ/מְשַׁלֵּ֥ם עַל יֶ֝֗תֶר עֹשֵׂ֥ה גַאֲוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/023.yaml
  text: Love Yahweh[b][a], all his faithful ones! Yahweh preserves the faithful and fully repays the one who acts proudly.
translation:
  language: zh_hans
  text: '你们所有忠于耶和华的人[a]哪，要爱他！


    耶和华守护忠信的人，


    却重重报应[b]骄傲行事的人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他所有的圣民”或“他所有的敬虔人”。希伯来语此词指以盟约忠诚回应耶和华的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“充分报应”或“丰丰富富地报应”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהֱבוּ
  choice: 要爱
  rationale: אהב的Qal命令式阳性复数，是对敬拜群体的直接劝勉；“要爱”在现代汉语中清楚保留命令语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式表达四字神名，并在本节中保持一致。
- source_word: כָּל־חֲסִידָיו
  choice: 所有忠于耶和华的人
  rationale: חסיד指以忠诚、敬虔回应上帝盟约之爱的人；“忠于耶和华的人”自然表达其关系性和伦理含义，同时将第三人称单数后缀的所指明示出来。
- source_word: אֱמוּנִים
  choice: 忠信的人
  rationale: אמן的复数形容词在此作名词使用，表示可靠、忠诚的人；“忠信的人”简洁保留其品格与盟约语境。
- source_word: נֹצֵר
  choice: 保护
  rationale: נצר有谨慎看守、护卫之意；“保护”符合本诗中上帝施行护佑的语境，也适合现代汉语。
- source_word: וּמְשַׁלֵּם
  choice: 报应
  rationale: שלם的Piel分词在此表示按行为施予回报；因宾语是骄傲行事者，“报应”自然传达审判性的偿还含义。
- source_word: עַל־יֶתֶר
  choice: 足足
  rationale: 该短语加强偿还的程度，可指充分或有余地偿还；“足足”既自然又保留其强化作用。
- source_word: עֹשֵׂה גַאֲוָה
  choice: 骄傲行事的人
  rationale: 原文直译为“行骄傲的人”；此译保留主动、持续表现骄傲的含义，并符合现代汉语表达。
theological_decisions:
- issue: 盟约身份词חֲסִידָיו的表达
  choice: 所有忠于耶和华的人
  alternative: 他所有的圣民／所有敬虔属他的人
  rationale: 所选译法突出这些人对耶和华的忠诚，避免“圣民”可能带来的后期制度性联想，也不把该词仅缩减为个人宗教虔诚。
- issue: 上帝保护与报应的并置
  choice: 耶和华保护忠信的人，却足足报应骄傲行事的人
  alternative: 耶和华看守忠信的人，并过量偿还骄傲行事的人
  rationale: 原文并置对忠信者的护佑和对骄傲者的充分报偿；“却”明示语义对照，但不削弱保护或审判任何一面。
- issue: עַל־יֶתֶר的程度含义
  choice: 足足报应
  alternative: 加倍报应／有余地报应
  rationale: 该短语确有加强程度的作用，但未必精确表示数学意义上的双倍；“足足”保留充分乃至有余的张力，避免过度限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们……哪，要……”保留诗歌劝勉的呼告语气；分行呈现劝勉、保护与审判之间的诗性结构。
