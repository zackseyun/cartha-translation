  rationale: 修订“隐秘处”的表达，使之更清楚地对应“你面前／你的面”的原文措辞，而不排除其“临在”的引申意义；同时以更自然的现代诗体措辞保留“众舌”与“棚”的具体意象。脚注锚点仍分别紧随“图谋”和“纷争”，与相应词汇说明一致。
