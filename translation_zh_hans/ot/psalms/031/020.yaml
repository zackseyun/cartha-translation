base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/020.yaml
  text: You hide them in the shelter of your presence from the schemes of man[b][a]; you conceal them in a shelter from the strife of tongues.
translation:
  language: zh_hans
  text: 你把他们藏在你面前的隐秘处，免受人的图谋[a]；你把他们藏在棚内，免受众舌的纷争[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “图谋”所译的希伯来词较罕见，含义不完全确定；也可译作“阴谋”或“结党谋划”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“众舌的争竞”，指敌对、争吵或毁谤的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵם
  choice: 你把他们藏
  rationale: 该词是סתר的使役式，表示使人隐藏起来；译文保留上帝主动遮护的含义。
- source_word: בְּסֵתֶר פָּנֶיךָ
  choice: 在你同在的隐密处
  rationale: סֵתֶר指隐密处或藏身处；פָּנִים本义为“面”，在此可表达临在。“你同在的隐密处”兼顾亲近与庇护，也避免生硬的“你脸的隐密处”。
- source_word: מֵרֻכְסֵי אִישׁ
  choice: 躲开人的图谋
  rationale: רֻכְסֵי罕见且含义不完全确定，语境指敌对者的联合、筹谋或阴谋；“图谋”自然，并保留其概括性。אִישׁ为单数，在这里作泛指，译作“人”。
- source_word: תִּצְפְּנֵם
  choice: 你把他们隐藏
  rationale: צפן可指隐藏、收藏或珍藏；此处与前句平行，核心含义是为保护而藏匿。
- source_word: בְּסֻכָּה
  choice: 在棚中
  rationale: סֻכָּה本义是棚、棚屋，也可作临时遮蔽之所；译作“棚”保留具体意象，而不预先将其解释为圣幕。
- source_word: מֵרִיב לְשֹׁנוֹת
  choice: 免受口舌的争竞
  rationale: רִיב指争竞、争执；לְשֹׁנוֹת直指“舌头”，在此喻指敌对或毁谤的话。“口舌的争竞”既保留诗歌意象，也符合现代汉语。
theological_decisions:
- issue: אִישׁ的泛指单数及性别表达
  choice: 人
  alternative: 男人／众人
  rationale: 原文是阳性单数，但在此代表一般敌对者，并非强调男性身份；“人”保留单数泛指，不额外限定性别。
- issue: פָּנֶיךָ的关系性含义
  choice: 你同在
  alternative: 你的面／你面前
  rationale: “面”在此可转喻上帝的临在。译作“你同在”表达保护来自亲近上帝，同时不把它具体化为物质处所。
translation_notes:
  register: 采用现代、庄重而易懂的诗体语言。“隐密处”“棚”“口舌的争竞”保留原文的庇护和言语攻击意象；两个平行分句分别用“藏”和“隐藏”，维持希伯来诗歌的对应关系。
