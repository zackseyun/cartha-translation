  text: Bring me out of this net that they have hidden for me[a], for you are my stronghold.
translation:
  language: zh_hans
  text: 求你使我脱离他们为我暗藏的网罗[a]，因为你是我的堡垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你使我脱离这张他们为我暗藏的网。”原文的זוּ可理解为指示词“这”，也可在此作关系词；正文按后者处理。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצִיאֵנִי
  choice: 求你使我脱离
  rationale: 该词是 יצא 的使役形，表示“使……出来、带……出来”。在祈求语境中加“求你”，并以“使我脱离”自然表达其使役意义。
- source_word: מֵרֶשֶׁת
  choice: 脱离……网罗
  rationale: רֶשֶׁת 本指捕捉猎物的网，也可比喻圈套。“网罗”保留具体意象及其比喻作用，不直接改译为较抽象的“陷阱”。
- source_word: זוּ
  choice: 他们为我……的
  rationale: זוּ 在这里可有指示或关系作用；汉语用关系从句自然连接“网罗”和后面的动作，同时不必强行判定为单纯的“这”或“那”。
- source_word: טָמְנוּ לִי
  choice: 他们为我暗藏的
  rationale: טמן 的基本义是“隐藏、藏起”。“暗藏”保留遮掩、不让人察觉的含义；“为我”表达 לִי 所指向的敌意目标。
- source_word: כִּי
  choice: 因为
  rationale: כִּי 在此引出祈求的理由，现代汉语用“因为”清楚自然。
- source_word: מָעוּזִּי
  choice: 我的坚固堡垒
  rationale: מָעוֹז 指提供力量与保护的坚固处所。“坚固堡垒”保留防御和庇护的具体意象，也自然表达诗人对上帝的信靠。
theological_decisions:
- issue: 以上帝为保护者的比喻
  choice: 你是我的坚固堡垒
  alternative: 你是我的保障／避难所
  rationale: 原文以坚固、防护之处比喻上帝。“坚固堡垒”保留这一空间和防御意象，不把它缩减为抽象的帮助，也不增添特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“求你”体现祈求语气；“网罗”与“坚固堡垒”保留原文彼此对照的危险和保护意象。
