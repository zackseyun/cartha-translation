base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/013.yaml
  text: For I have heard the whispering of many—terror on every side!—as they conspired together against me[a], plotting to take my life.
translation:
  language: zh_hans
  text: 因为我听见许多人的谗言[a]——四面都是恐惧！——他们一同密谋害我，图谋夺取我的性命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谗言”也可译作“私下议论”、“流言”或“毁谤的话”；希伯来语这个词可指暗中传说、流言或毁谤性言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人陷于愁苦的缘由；“因为”自然保留了解释关系。
- source_word: שָׁמַעְתִּי
  choice: 我听见
  rationale: 希伯来语完成式叙述诗人已经听到、且影响仍切身的事；现代汉语用“听见”即可自然表达。
- source_word: דִּבַּת רַבִּים
  choice: 许多人的谗言
  rationale: דִּבָּה可指流言、毁谤或恶意传话；敌对语境中“谗言”兼具背后议论与诋毁之意，但其词义范围需以脚注保留。
- source_word: מָגוֹר מִסָּבִיב
  choice: 四面都是恐惧
  rationale: 保留原文简短突出的惊叹语气及被恐惧包围的意象，现代汉语也清楚自然。
- source_word: בְּהִוָּסְדָם יַחַד עָלַי
  choice: 他们一同密谋害我
  rationale: 该结构表达众人聚议、共同筹谋，语境明显敌对；“密谋害我”自然呈现其针对性。
- source_word: לָקַחַת נַפְשִׁי זָמָמוּ
  choice: 图谋夺取我的性命
  rationale: נֶפֶשׁ在此指人的生命而非抽象的灵魂；“图谋”准确体现זמם所含蓄意策划之义。
