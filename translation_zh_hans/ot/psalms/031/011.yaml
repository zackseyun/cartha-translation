revisions:
- from: 因我所有的仇敌，我成了受辱的人[a]，在邻舍中更是如此；在熟人眼中，我成了可怕的人。那些在外面[b]看见我的，都躲开我[c]。
  to: 我因一切仇敌的缘故，成了受人羞辱的对象[a]；在我的邻舍中尤其如此。我成了我的熟人所惧怕的对象；那些在街上[b]看见我的人，都逃离我[c]。
  rationale: 修订使开头的因果/来源歧义和比较理解仍由脚注保留，同时避免把“成为羞辱的对象”误改为单纯“受羞辱”。“所惧怕的对象”较准确呈现“恐惧”与熟人之间的关系；“街上”在正文中自然表达公开场所，脚注保留“外面”的字面义。
