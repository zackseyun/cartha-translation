base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/011.yaml
  text: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances[c][b]; those who see me in the street flee from me.
translation:
  language: zh_hans
  text: 我因一切仇敌的缘故，成了受人羞辱的对象[a]；在我的邻舍中尤其如此。我成了我的熟人所惧怕的对象；那些在街上[b]看见我的人，都逃离我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从我一切仇敌而来，我成了受人羞辱的对象”；也有人把开头理解为比较：“我比我一切仇敌更受羞辱。”
    reason: alternative_reading
  - marker: b
    text: 原文直译“在外面”，此处指街上或其他公共场所。
    reason: cultural_note
  - marker: c
    text: 也可译作“躲开我”“远离我”或“离我而去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל צֹרְרַי
  choice: 因我所有的仇敌
  rationale: מִן在此最可能表示原因或缘由，即仇敌使诗人成为受辱的对象；译作“因”在现代汉语中自然，同时以脚注保留来源义及比较义的可能。
- source_word: הָיִיתִי חֶרְפָּה
  choice: 我成了受辱的人
  rationale: היה的完成式与名词连用，表达已经形成并延续至今的状态。חֶרְפָּה可指羞辱、辱骂或受人鄙弃的处境；“受辱的人”比直译“羞辱”更符合汉语谓语表达。
- source_word: וְלִשֲׁכֵנַי מְאֹד
  choice: 在邻舍中更是如此
  rationale: מְאֹד强化诗人在邻舍当中所受的羞辱。“更是如此”自然承接前句，避免生硬的“极其成为羞辱”。
- source_word: וּפַחַד לִמְיֻדָּעָי
  choice: 在熟人眼中，我成了可怕的人
  rationale: פַּחַד表示惧怕、惊恐；מְיֻדָּעַ指认识诗人的熟人或相识者，不必然是密友。此译保留他成为别人惧怕对象的关系含义。
- source_word: רֹאַי בַּחוּץ
  choice: 那些在外面看见我的
  rationale: בַּחוּץ字面为“在外面”，语境中指公开场合；正文保留较贴近原文的表达，并用脚注说明可理解为街上或公共场所。
- source_word: נָדְדוּ מִמֶּנִּי
  choice: 都躲开我
  rationale: נָדַד可表示逃离、游离或移开。这里描写人们见到诗人便与他拉开距离；“躲开我”自然表达社会性的回避，同时以脚注保留“逃离”与“远离”的语义幅度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“邻舍”保留诗篇语域中的关系色彩；“熟人”与“邻舍”形成清楚区分。分号呈现原文前半的并列递进，句号则突出后半公开遭人回避的场景。
