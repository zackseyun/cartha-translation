review_pass:
  verdict: revise
  source_fidelity: 草稿大体准确地表达了诗人因仇敌而受辱、在邻舍和熟人中遭弃绝、以及在公共场所被回避的意思。但“可怕的人”较弱，未充分表达“成为熟人所惧怕的对象”；开头脚注所给的“受……羞辱”也把“成为羞辱/讥诮的对象”改成了受害动作，未能准确保留原文结构。
  naturalness: 整体通顺庄重；不过“因我所有的仇敌”不如“因我一切仇敌的缘故”自然，“在外面看见我的”也不如语境化的“在街上看见我的人”顺畅。
  terminology: “邻舍”与“熟人”的区分恰当。“受人羞辱的对象”和“所惧怕的对象”能分别较清楚地传达 חֶרְפָּה 与 פַּחַד 的关系性含义，且不增添神学解释。
  issues:
