  source_fidelity: 译文准确传达了原文的结构与语义：诗人在惊惶中作出“从你眼前被隔绝”的主观判断，随后以“然而”转出上帝实际垂听其呼救。"被隔绝"虽比字面“被剪除”稍平和，但在此处充分表达了Nifal形式所指的被除去、与上帝眼前隔离的意象，且未擅自强化为神学性的“被弃绝”。
