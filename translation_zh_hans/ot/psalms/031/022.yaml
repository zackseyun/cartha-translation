language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנִ֤י אָ֘מַ֤רְתִּי בְ/חָפְזִ֗/י נִגְרַזְתִּי֮ מִ/נֶּ֪גֶד עֵ֫ינֶ֥י/ךָ אָכֵ֗ן שָׁ֭מַעְתָּ ק֥וֹל תַּחֲנוּנַ֗/י בְּ/שַׁוְּעִ֥/י אֵלֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/022.yaml
  text: As for me[a], I said in my alarm[b], “I am cut off from before your eyes.” Yet you heard the sound of my pleas when I cried to you for help.
translation:
  language: zh_hans
  text: 至于我，我在惊慌中[a]曾说：“我从你眼前[b]被隔绝了。”然而，我向你呼救时，你听见了我恳求的声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“匆忙中”。希伯来文可指匆忙、躁动或恐慌。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“从你的视线中”。直译为“从你眼前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחָפְזִי
  choice: 在惊慌中
  rationale: חפז可表示匆忙、躁动或恐慌；哀歌语境着重危急中的惊惶，而非单纯动作仓促。“在惊慌中”自然地表达这一心理状态，同时以脚注保留“匆忙中”的可能。
- source_word: נִגְרַזְתִּי
  choice: 我……被隔绝了
  rationale: גזר的Nifal形在此表达被剪断、隔离或排除。“被隔绝了”在现代汉语中自然，也保留诗人当时认定自己已无法处于上帝眷顾之下的感受，而不直接解释为“被弃绝”。
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: 从你眼前
  rationale: 直译为“从你眼前”，保留希伯来文具体的视觉意象；其语境意义是离开上帝的视线或眷顾。
- source_word: אָכֵן
  choice: 然而
  rationale: 此处在诗人的恐惧判断与上帝实际垂听之间形成鲜明转折，“然而”准确呈现这种反差。
- source_word: קוֹל תַּחֲנוּנַי
  choice: 我恳求的声音
  rationale: 保留קוֹל“声音”和תַּחֲנוּנִים“恳求、求恩”的两个语义成分，同时避免古奥表达。
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: 我向你呼救时
  rationale: שׁוע表示在困境中呼喊求助；“向你呼救”既明确呼喊的对象，也自然传达动词本有的求助意味。
theological_decisions:
- issue: 自觉被上帝隔绝与上帝实际垂听之间的张力
  choice: 保留诗人的原话“我从你眼前被隔绝了”，随后以“然而”引出上帝垂听的事实。
  alternative: 解释性地译为“我以为你已经弃绝我”。
  rationale: 原文描述诗人在危急中的主观感受，却没有明确宣告上帝在神学意义上弃绝了他。当前译法保留人的感受与上帝实际回应之间的张力，不将其提前化解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于我”对应原文显明的主语转折；“呼救”“恳求”便于普通读者理解，又保留哀歌的迫切语气。脚注标记均置于所说明的词语之后。
