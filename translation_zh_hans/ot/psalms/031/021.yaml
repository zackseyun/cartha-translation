source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה כִּ֥י הִפְלִ֘יא חַסְדּ֥/וֹ לִ֝֗/י בְּ/עִ֣יר מָצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/021.yaml
  text: Blessed be Yahweh[a], for he has wonderfully shown his steadfast love to me in a fortified city.
translation:
  language: zh_hans
  text: 雅威当受称颂！因为他在被围困的城中[a]，奇妙地向我彰显了他的慈爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在坚固城中。”希伯来语短语既可指一座被围困的城，也可指一座设防坚固的城。
    reason: 保留 בְּעִיר מָצוֹר 的词汇歧义。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 当受称颂
  rationale: 这是用于颂赞上帝的被动分词感叹句；“当受称颂”既保留祝颂语气，也符合现代汉语敬拜用语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名音译处理四字神名，保留经文对以色列之上帝盟约之名的直接使用，而不以称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 引出诗人称颂雅威的原因，汉语用“因为”关系清楚自然。
- source_word: הִפְלִיא
  choice: 奇妙地……彰显
  rationale: 该词的使役形表达以非凡、奇妙的方式施行或显明某事；与“慈爱”搭配时，“奇妙地彰显”兼顾词义和自然汉语。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חסד包含忠贞、坚定而守约的爱；“慈爱”是简洁自然且有圣经语体色彩的汉语表达，不把其丰富含义限缩为单一概念。
- source_word: לִי
  choice: 向我
  rationale: 标明慈爱彰显的对象，与汉语动词“彰显”搭配自然。
- source_word: בְּעִיר מָצוֹר
  choice: 在被围困的城中
  rationale: מָצוֹר可指围困、围城工事，也可指设防之处；正文采用符合本诗危难处境的“被围困的城”，并以脚注保留“坚固城”的可能。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，避免以“主”这一称号代替；“耶和华”是传统汉译音形，但“雅威”更贴近当前通行的学术复原读音。
- issue: בְּעִיר מָצוֹר 的含义
  choice: 在被围困的城中
  alternative: 在坚固城中
  rationale: 该短语在词汇上确有歧义。正文采用与本诗受困和蒙救背景相符的“被围困”，但不把另一种合理读法排除，故在脚注中注明。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“当受称颂”保留诗歌颂赞语体；“奇妙地向我彰显了他的慈爱”清楚表达原文结构，同时避免生硬直译。
