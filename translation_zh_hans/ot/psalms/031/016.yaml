  yaml_path: translation/ot/psalms/031/016.yaml
  text: Make your face shine on your servant[a]; save me in your steadfast love.
translation:
  language: zh_hans
  text: 求你使你的脸光照你的仆人；求你凭着你坚定的慈爱[a]拯救我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因着你坚定的慈爱”，或“照着你坚定的慈爱”。这里的希伯来语介词可表达几种彼此相关的意思。
    reason: 保留前缀 ב 在此可能表示凭借、原因或准则的语义歧义。
lexical_decisions:
- source_word: הָאִירָה
  choice: 求你使……光照
  rationale: 这是动词 אור 的使役式祈使语气，表达诗人恳求上帝使他的脸发光。“求你使……光照”既保留使役和祈求语气，也符合现代汉语表达。
- source_word: פָנֶיךָ
  choice: 你的脸
  rationale: 原文直译为“你的脸”。“使脸光照”是希伯来语中表示上帝施恩眷顾的具体意象；正文保留这一形象，不将其抽象化为“同在”或“恩待”。
- source_word: עַל
  choice: 光照……
  rationale: 介词 עַל 表示光照所朝向的对象。汉语以“光照你的仆人”自然表达这一方向关系，无须另译介词。
- source_word: עַבְדֶּךָ
  choice: 你的仆人
  rationale: עבד 可指奴隶或仆人；在向上帝祷告的语境中，“仆人”最自然地表达说话者与上帝的从属关系，也避免加入本节并未突出的奴隶制度含义。
- source_word: הוֹשִׁיעֵנִי
  choice: 拯救我
  rationale: 这是 ישׁע 的使役式祈使语气，带第一人称单数宾语。“拯救我”保留广义的救援含义，同时适合诗篇祷告的庄重语域。
- source_word: בְחַסְדֶּךָ
  choice: 凭着你忠贞的爱
  rationale: חסד 在这里指上帝持久、可信的恩爱与忠诚；“忠贞的爱”兼顾“爱”和坚定忠诚的层面。前缀 ב 可表示凭借、原因或准则，正文采用自然的“凭着”，并以脚注保留其他可能理解。
theological_decisions:
- issue: חסד 的译法
  choice: 忠贞的爱
  alternative: 慈爱；怜悯；坚定的爱
  rationale: “忠贞的爱”既表达上帝的恩爱，也保留 חסד 所含的持久忠诚，不把它缩减为单纯情感或怜悯；同时不额外引入某一宗派对“约”的特定体系。
- issue: “使你的脸光照”的意象
  choice: 保留具体的“脸”与“光照”
  alternative: 恩待我；向我显出慈颜
  rationale: 原文借上帝发光的脸表达悦纳和眷顾。保留具体意象可让读者直接接触希伯来诗歌语言，而不在正文中替读者解释其全部神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。两个分句均以“求你”明确表达希伯来语祈使语气；保留“使你的脸光照”这一核心诗歌意象。
