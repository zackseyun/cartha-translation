source:
  edition: WLC
  text: מָ֤ה רַֽב טוּבְ/ךָ֮ אֲשֶׁר צָפַ֪נְתָּ לִּֽ/ירֵ֫אֶ֥י/ךָ פָּ֭עַלְתָּ לַ/חֹסִ֣ים בָּ֑/ךְ נֶ֝֗גֶד בְּנֵ֣י אָדָם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/019.yaml
  text: How abundant is your goodness[a], which you have stored up for those who fear you, which you have worked for those who take refuge in you before the sons of man.
translation:
  language: zh_hans
  text: '你的美善何其丰盛！


    你为敬畏你的人积存了这美善，


    又当着世人的面，


    为投靠你的人成就了这美善。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה רַב
  choice: 何其丰盛
  rationale: מָה与形容词רַב构成感叹，既表达惊叹，也突出数量与程度；“何其丰盛”庄重自然，并保留诗歌语气。
- source_word: טוּבְךָ
  choice: 你的美善
  rationale: טוּב可指良善、美好或所赐的福惠。“美善”兼顾上帝的良善属性及其惠泽的具体表现。
- source_word: צָפַנְתָּ
  choice: 珍藏
  rationale: 该动词表示藏起、储存或留存备用；“珍藏”保留为将来存留美善的意象，但不把重点限于隐秘。
- source_word: לִירֵאֶיךָ
  choice: 敬畏你的人
  rationale: 保留希伯来文“惧怕”的传统表达，同时“敬畏”在现代汉语中能表达对上帝既敬重又畏惧的态度。
- source_word: פָּעַלְתָּ
  choice: 将它施行出来
  rationale: פעל表示做成、施行或产生效果。补出代词“它”回指“美善”，“施行出来”与前面的“珍藏”形成由存留到公开实现的对照。
- source_word: לַחֹסִים בָּךְ
  choice: 为投靠你的人
  rationale: חסה的基本意象是寻求庇护；“投靠”比抽象的“信靠”更能保留避难、寻求保护的图景。
- source_word: נֶגֶד
  choice: 在……面前
  rationale: נגד在此表示当着、面对或公开可见；“在……面前”简洁地保留这种公开性。
- source_word: בְּנֵי אָדָם
  choice: 世人
  rationale: 字面为“亚当之子／人的众子”，是泛指人类的惯用语。“世人”在现代汉语中自然、庄重，并准确表达其集合性含义；脚注保留字面形式。
theological_decisions:
- issue: טוּב既可侧重上帝的良善，也可指他赐下的福惠
  choice: 美善
  alternative: 恩惠／福分
  rationale: “美善”不将词义单独限定为道德属性或物质福分，使后续“珍藏”和“施行”共同说明其惠及人的实际表现。
- issue: בְּנֵי אָדָם的代表性人类称谓
  choice: 世人
  alternative: 人的众子／人类
  rationale: 该短语在希伯来语中通常泛指人类，并非特指男性。“世人”准确传达所指，同时以脚注交代原文形式。
- issue: נֶגֶד בְּנֵי אָדָם与前句的修饰关系
  choice: 将“在世人面前”置于“为投靠你的人将它施行出来”之中
  alternative: 理解为投靠行为是在世人面前发生
  rationale: 希伯来语语序允许一定附着歧义；本译文按较自然的理解，将其与上帝公开施行美善相连，但不增加“显明”等会彻底排除其他理解的词。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，以四行呈现原文的感叹及两个平行关系从句。第二次补出“这美善／它”以使汉语指代清楚，并以“珍藏—施行出来”表现原文由储备到实现的动态。脚注标记[a]置于其实际说明的“世人”之后。
