source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י צַ֫ר לִ֥/י עָשְׁשָׁ֖ה בְ/כַ֥עַס עֵינִ֗/י נַפְשִׁ֥/י וּ/בִטְנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/009.yaml
  text: Be gracious to me[a], O Yahweh, for I am in distress[c][b]; my eye has wasted away with grief—my soul and my belly as well.
translation:
  language: zh_hans
  text: 雅威啊，求你恩待我，因为我正陷在困苦中；我的眼睛因愁烦而衰残[a]，我的心灵[b]和腹中[c]也都衰残。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衰残”也可译作“衰弱”“失去光彩”或“失明”；“愁烦”也可理解为“烦恼”“恼怒”或“忧愁”。
    reason: lexical_alternative
  - marker: b
    text: “心灵”也可译作“生命”或“我自己”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“我的腹部”或“我的腹中”，也可较广义地指人的内在部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: 求你恩待我
  rationale: 该命令式是向雅威恳求施恩、赐下眷顾；“恩待我”自然且保留了“施恩”的核心含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: צַר לִי
  choice: 我正陷在困苦中
  rationale: 该短语表达受困、窘迫的处境；此译法符合现代汉语祷告语体，也传达持续的切身苦难。
- source_word: עָשְׁשָׁה
  choice: 衰弱
  rationale: 此动词可表示消损、衰残或失去光彩；“衰弱”能自然地统摄眼睛、心灵和身体三个并列项，同时不把具体表现限定得过窄。
- source_word: בְכַעַס
  choice: 因愁苦
  rationale: כעס可指恼怒、烦恼或悲苦；在哀歌语境中，“愁苦”较贴合诗人的内在痛楚，同时在脚注保留其他可能。
- source_word: עֵינִי
  choice: 我的眼睛
  rationale: 希伯来文为单数，但汉语通常以“眼睛”自然表达视觉器官，无须机械标示单数。
- source_word: נַפְשִׁי
  choice: 我的心灵
  rationale: נפש在此可指生命、自我或内在生命；“心灵”与“身体”形成自然诗性并列，但脚注保留其语义宽度。
- source_word: וּבִטְנִי
  choice: 我的身体
  rationale: בטן本义为腹部，也可延伸指内在部分或身体；正文采用自然的“身体”，脚注说明较字面的表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，也避免用称号替代。
- issue: נַפְשִׁי 的人论含义
  choice: 我的心灵
  alternative: 我的生命／我自己
  rationale: 原词含义宽广，不必在此断定为与身体完全分离的实体；正文采用自然的诗性表达，脚注保留“生命”和“自己”的可能。
- issue: בִטְנִי 的身体意象
  choice: 我的身体
  alternative: 我的腹中／我的内在部分
  rationale: “身体”使三个并列项在现代汉语中流畅可懂；脚注保留原文具体的腹部意象，避免掩盖原词。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌祷告语体。“雅威啊”保留直接呼告；后半句用重复的“衰弱”明确原文中省略而承接的谓语，使汉语读者容易把握三个并列项。
