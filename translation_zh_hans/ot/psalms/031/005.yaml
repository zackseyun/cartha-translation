  text: בְּ/יָדְ/ךָ֮ אַפְקִ֪יד ר֫וּחִ֥/י פָּדִ֖יתָה אוֹתִ֥/י יְהוָ֗ה אֵ֣ל אֱמֶֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/005.yaml
  text: Into your hand I commit my spirit; you have redeemed me[a], O Yahweh, God of truth.
translation:
  language: zh_hans
  text: 我把我的灵交托在你手中；耶和华，信实的上帝[a]啊，你已经救赎了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“真理的上帝”。希伯来语词可表示真实、可靠或信实。
    reason: 保留אֱמֶת的词义范围及另一种合理译法。
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: 在你手中
  rationale: 介词ב与“手”连用，在交托的语境中表示把自己置于对方的掌管和看顾之下；“在你手中”是自然、庄重的现代汉语表达。
- source_word: אַפְקִיד
  choice: 我把……交托
  rationale: פקד的使役形在此表示将某物托付给另一位看管；“交托”既传达信赖与托付，也符合祷告语体。
- source_word: רוּחִי
  choice: 我的灵
  rationale: רוּחַ可指灵、气息或生命；在这段向上帝交托自己的祷告中，“我的灵”保留了原文的个人性及其神学分量，同时不把含义缩减为单纯的呼吸。
- source_word: פָּדִיתָה
  choice: 你已经救赎了
  rationale: פדה表示赎回、救赎。希伯来语完成式指向已经成就的行动；“已经救赎了”清楚表达其完成性及当前意义。
- source_word: אוֹתִי
  choice: 我
  rationale: 直接宾语代词按现代汉语句法译为“我”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文直接使用四字神名；“耶和华”是现代汉语圣经语境中广为人知的专名译法，不以“主”这一称号替代。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל在此与神名构成同位说明；“上帝”在现代标准汉语中清楚、庄重。
- source_word: אֱמֶת
  choice: 信实的
  rationale: אֱמֶת可表示真实、可靠或信实。此处用来描述上帝值得倚靠的品格，“信实的上帝”最自然地契合交托与救赎的语境；“真理的上帝”这一较形式对应的译法保留在脚注中。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 主
  rationale: 原文使用上帝的专名，而非一般称号；正文保留专名，以呈现以色列之上帝的立约身份。
- issue: אֵל אֱמֶת中אֱמֶת的语义
  choice: 信实的上帝
  alternative: 真理的上帝
  rationale: 该词兼有真实、可靠和信实的语义。上下文强调诗人因上帝的救赎而把生命交托给他，因此正文采用自然的“信实”；脚注保留“真理”这一可能译法，不把原文的语义幅度默默消解。
- issue: רוּחִי所指的范围
  choice: 我的灵
  alternative: 我的气息／生命
  rationale: 原词可涉及气息、生命或人的灵。正文采用最直接且能承载祷告分量的“我的灵”，但不据此进一步界定灵与身体的关系。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“我把……交托在你手中”保持祷告的肃穆感，又避免古奥句式；呼语“啊”明确“耶和华，信实的上帝”是对上帝的直接称呼。
