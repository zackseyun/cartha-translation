base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/018.yaml
  text: Let lying lips be silenced[d][c][b][a], which speak arrogantly against the righteous with pride and contempt.
translation:
  language: zh_hans
  text: '愿说谎的嘴都哑口无声[a]！

    它们怀着骄傲和蔑视，

    狂妄地出言攻击义人[b][c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“都变成哑巴”；原文动词既可指变得无声，也可指被迫不能出声。
    reason: lexical_alternative
  - marker: b
    text: 或译“一个义人”；原文为单数，既可指某一位义人，也可作代表性称呼。
    reason: lexical_alternative
  - marker: c
    text: “狂妄地”所译的原文名词可指傲慢、放肆或骄横的言语态度。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּאָלַמְנָה
  choice: 愿……都哑口无声
  rationale: 该词为אלם的尼法勒未完成式第三人称阴性复数，在此具有祈愿或命令意味。“愿……都哑口无声”既表达诗人的祈求，也保留“变得无声／被迫无声”的语义范围。
- source_word: שִׂפְתֵי שָׁקֶר
  choice: 说谎的嘴
  rationale: 原文直译为“虚假的嘴唇”。“说谎的嘴”是自然的现代汉语表达，并保留以发声器官代指说谎者之言语的意象。
- source_word: הַדֹּבְרוֹת
  choice: 它们……口出
  rationale: 阴性复数分词与“嘴”一致，修饰那些正在发言的嘴。汉语分行后以“它们”承接，再用“口出”表达其言说行为，避免生硬的关系从句。
- source_word: עַל צַדִּיק
  choice: 向义人
  rationale: עַל在言说语境中表示言语针对的对象；结合敌对内容，“向义人”自然地保留“针对／反对”的方向性。צַדִּיק为单数，可指某一位义人，也可作代表性单数。
- source_word: עָתָק
  choice: 口出狂言
  rationale: 该名词可指狂妄、骄横或傲慢之言。“口出狂言”保持其名词性言语内容，也与后面的“骄傲”有所区分，同时传达原文叠加强调的修辞力量。
- source_word: בְּגַאֲוָה
  choice: 以骄傲
  rationale: 介词בְּ加名词表示说话的方式或态度；“以骄傲”保留原文的名词形式和傲慢意味。
- source_word: וָבוּז
  choice: 和蔑视
  rationale: בּוּז表示轻蔑、鄙视。“蔑视”与“骄傲”并列，准确呈现说话者对义人的态度。
theological_decisions:
- issue: “义人”是特指个人还是代表性称谓
  choice: 保留单数形式“义人”
  alternative: “一个义人”或“义人们”
  rationale: 希伯来文צַדִּיק为单数，但上下文不能完全确定是特指诗人或泛指义者；“义人”在汉语中可以兼具个体和代表性称谓的功能，因而不作过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，以三行呈现希伯来诗句的推进。“说谎的嘴”保留原文的身体意象；“口出狂言”与“骄傲和蔑视”共同保留原文中相关意义的层叠，而不把它们合并或削弱。所有代词均指前文的“嘴”，体现原文阴性复数分词与其一致的关系。
