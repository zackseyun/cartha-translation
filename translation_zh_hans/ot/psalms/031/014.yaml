  text: וַ/אֲנִ֤י עָלֶ֣י/ךָ בָטַ֣חְתִּי יְהוָ֑ה אָ֝מַ֗רְתִּי אֱלֹהַ֥/י אָֽתָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/014.yaml
  text: But as for me[a], I trust in you, O Yahweh; I say, “You are my God.”
translation:
  language: zh_hans
  text: 但我信靠你，雅威；我说：“你是我的神。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“我曾信靠你，雅威；我曾说：‘你是我的神。’”希伯来语的两个完成式可表达过去或现在完成的意义；在这里，正文将其译为诗人当前持续的信靠和认信。
    reason: 保留希伯来语完成式在过去、完成与当前持续状态之间的真实解释空间。
lexical_decisions:
- source_word: וַאֲנִי
  choice: 但我却
  rationale: 连接词与独立代词共同形成转折和强调；“但我却”以自然的现代汉语突出诗人与前文处境或他人的对比。
- source_word: עָלֶיךָ בָטַחְתִּי
  choice: 信靠你
  rationale: בטח 与介词 על 连用表示把倚赖寄托于某对象；“信靠你”既符合现代汉语习惯，也保留其倚赖、投靠之意。希伯来语完成式在此可表达既成而持续的信靠状态，正文采用现在时。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来辅音神名 YHWH 的通行学术重构音译为“雅威”，保留专名性质，不以称号替代；加“啊”表达直接呼告。
- source_word: אָמַרְתִּי
  choice: 我说
  rationale: 该完成式与前句的信靠宣告平行；上下文是祷告中的当前认信，因此正文用“我说”，同时在脚注说明过去时或现在完成意义的可能性。
- source_word: אֱלֹהַי אָתָּה
  choice: 你是我的神
  rationale: 名词带第一人称单数后缀，意为“我的神”；独立代词 אָתָּה 有强调作用，汉语以句首“你”自然呈现。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用以色列上帝的专名，而非“主”这一称号；“雅威”较直接反映当代学界对该神名读音的通常重构，同时不把专名替换为称谓。
- issue: 两个完成式的时态与体貌
  choice: 以当前、持续的信靠和认信表达：“我信靠……我说……”
  alternative: 译为过去或现在完成：“我曾信靠……我曾说……”或“我已经信靠……我已经说……”
  rationale: 希伯来语完成式本身容许过去或已然意义，但本节祷告语境可将它们理解为诗人此刻持守的信靠与认信。正文采用自然的汉语现在陈述，并以脚注保留其他可能。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“但我却”体现原文的转折与主语强调；“雅威啊”保持祷告中的直接呼告；分号呈现两个平行宣告之间的紧密关系。
