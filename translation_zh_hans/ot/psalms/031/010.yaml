  text: כִּ֤י כָל֪וּ בְ/יָג֡וֹן חַיַּ/י֮ וּ/שְׁנוֹתַ֪/י בַּ/אֲנָ֫חָ֥ה כָּשַׁ֣ל בַּ/עֲוֺנִ֣/י כֹחִ֑/י וַ/עֲצָמַ֥/י עָשֵֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/010.yaml
  text: For my life is spent with grief[a], and my years with sighing; my strength has failed because of my iniquity[b], and my bones waste away.
translation:
  language: zh_hans
  text: '因为我的生命在愁苦中耗尽，

    我的年岁在叹息中消逝；

    我的力量衰败[a]，是因我的罪孽[b]，

    我的骨头也衰残了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衰败”原文可直译为“绊倒”或“踉跄”，这里比喻力量不支、衰竭。
    reason: lexical_alternative
  - marker: b
    text: “罪孽”也可指“罪责”或罪孽所带来的后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为诗人的哀叹说明缘由，保留因果或解释意味。
- source_word: כָלוּ בְיָגוֹן חַיַּי
  choice: 我的生命在愁苦中耗尽
  rationale: כָלוּ 表示完结、耗尽；“耗尽”既保留生命被消磨殆尽的意象，也符合现代汉语诗体。יָגוֹן 译作“愁苦”，涵盖悲伤与痛苦。
- source_word: וּשְׁנוֹתַי בַּאֲנָחָה
  choice: 我的年岁在叹息中消逝
  rationale: 原文第二分句省略谓语，承接“耗尽”；汉语补出“消逝”，使平行句自然清楚。אֲנָחָה 译作“叹息”，保留持续哀伤的声音意象。
- source_word: כָּשַׁל ... כֹחִי
  choice: 我的力量衰颓
  rationale: כָּשַׁל 本义可指绊倒、蹒跚或摇摇欲坠；用于“力量”时，“衰颓”既表达力量失效，也尽量保留倾颓不支的动态意象。
- source_word: בַּעֲוֺנִי
  choice: 是因我的罪孽
  rationale: 介词 בְּ 在此按原因理解；עָוֹן 可指罪孽、罪责或罪的后果，正文采用“罪孽”保留明确的道德含义，并以脚注交代歧义。
- source_word: וַעֲצָמַי עָשֵׁשׁוּ
  choice: 我的骨头也渐渐枯瘦
  rationale: 直译“骨头”以保存希伯来诗歌深入身体的意象；עָשֵׁשׁוּ 表示衰弱、消瘦或枯损，“渐渐枯瘦”自然呈现持续耗损。
theological_decisions:
- issue: עָוֹן 在诗人自述中的含义
  choice: 正文译为“罪孽”
  alternative: “罪责”或“罪孽所带来的后果”
  rationale: 该词的语义范围包括罪行、罪责及其后果。正文保留道德层面的“罪孽”，但不进一步断定诗人是在陈述某种特定的报应机制；脚注保存其他可能。
- issue: 力量衰颓与罪孽之间的关系
  choice: 保留原文的因果表达
  alternative: 较宽泛地译为“在我的罪孽中”
  rationale: בְּ 可表达处境或原因；上下文中因果理解自然，但不把这种关联扩展成超出本节的系统性教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，按希伯来诗歌的平行结构分为四行。“耗尽／消逝”和“衰颓／枯瘦”形成递进的身心衰败图景；避免古奥措辞，也不消解 עָוֹן 的神学张力。
