    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: 在你手中
  rationale: 保留希伯来语“手”的比喻，表达权能与掌管，也与下半句“仇敌的手”形成有意的对应。
- source_word: עִתֹּתָי
  choice: 我的年日
  rationale: עֵת的复数可指人生中的时期、时节和际遇。“年日”在现代中文中自然而庄重，能概括一生各阶段，又不把含义收窄为“命运”或仅指预定时刻。
- source_word: הַצִּילֵנִי
  choice: 求你救我脱离
  rationale: 该使役命令式表达从现实危险中搭救；加“求”符合中文祈祷语气，“救我脱离”清楚呈现宾语及其危险来源。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 保留“手”所表示的控制与权势，并维持上半句在神手中、下半句脱离敌手的诗意反差。
- source_word: אֹיְבַי
  choice: 仇敌
  rationale: 直接而庄重地表达敌对者，符合诗篇语体。
- source_word: וּמֵרֹדְפָי
  choice: 脱离那些追赶我的人
  rationale: 准确呈现分词所指持续追逐诗人的人；比“迫害我的人”更保留具体追赶的画面。
theological_decisions:
- issue: “我的年日”的解释范围
  choice: 广泛指诗人一生的各个时期、遭遇和境况都在神手中
  alternative: 专指预定的时刻，或译为“我的命运”
  rationale: 希伯来语表达具有诗意的宽广性。正文保留这种张力，不把它限定为严格的宿命概念，也不缩窄为某些特定时刻。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇祈祷语体。“在你手中”与“仇敌的手”保留原文的关键词呼应；后一个并列成分补出“脱离”，使中文结构清楚自然。
