  yaml_path: translation/ot/psalms/031/003.yaml
  text: For you are my rock and my fortress[c][b][a]; and for your name’s sake you will lead me and guide me.
translation:
  language: zh_hans
  text: 因你是我的磐石，我的堡垒；为你名的缘故，你必引导我，带领我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你必引导我，带领我”也可译作“求你引导我，带领我”。两个希伯来动词意思相近，诗句用它们构成平行表达。
    reason: 语法与词义备选
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出祈求的根据；现代汉语用“因为”自然地承接前文，也保留“因/因为”的解释可能。
- source_word: סַלְעִי
  choice: 我的磐石
  rationale: 既保留岩石的具体意象，也传达安全、稳固的庇护这一诗歌隐喻。
- source_word: מְצוּדָתִי
  choice: 我的堡垒
  rationale: 指设防的坚固之处；“堡垒”在现代汉语中直观地保留防御意象。
- source_word: וּלְמַעַן שִׁמְךָ
  choice: 为了你的名
  rationale: 保留希伯来文以神之“名”为其行动根据的表达，不把它缩窄为仅指名声，也不在正文中扩释。
- source_word: תַּנְחֵנִי
  choice: 你必引领我
  rationale: נחה 的使役式表示引导、领行；“必”将未完成式表达为祷告中的确信，同时“引领”保留方向性。
- source_word: וּתְנַהֲלֵנִי
  choice: 带领我
  rationale: נהל 与前一动词意义相近；另用“带领”保留希伯来诗歌的平行结构，而不将两个动词合并。
theological_decisions:
- issue: “为了你的名”的含义
  choice: 原样保留以神的名作为行动根据的说法
  alternative: 释为“为了维护你的名声”或扩写为“因你的品格和信实”
  rationale: “名”可涉及神所启示的身份、尊荣与信实；直译保留其丰富性，避免把含义限定在单一解释上。
- issue: 两个未完成式动词的语气
  choice: 用“必”表达确信：“你必引领我，带领我”
  alternative: 祈使式：“求你引领我，带领我”；或一般现在式：“你引领我，带领我”
  rationale: 在“你是我的磐石，我的堡垒”这一宣认之后，未完成式可表达有把握的期待；同时脚注说明祈求式理解也有可能，以保留语气上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“磐石—堡垒”保留原文并列的庇护意象；“引领—带领”刻意保留近义平行。脚注标记置于所说明的分句之后。
