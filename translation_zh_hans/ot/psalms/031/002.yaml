base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/002.yaml
  text: Incline your ear to me[a]; quickly rescue me. Be for me a rock of refuge[b], a fortified house to save me.
translation:
  language: zh_hans
  text: 求你侧耳听我，快快搭救我！求你作我避难的磐石[a]，作我坚固的居所[b]，拯救我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坚固的磐石”。希伯来语把“磐石”与指强固保护或避难处的词连用。
    reason: lexical_alternative
  - marker: b
    text: 或译“堡垒”或“坚固的房屋”。希伯来语保留“房屋、居所”的意象，同时以表示堡垒或防御工事的词加以描述。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה אֵלַי אָזְנְךָ
  choice: 求你侧耳听我
  rationale: 原文直译为“向我侧下你的耳朵”，是恳求上帝留心垂听的具体比喻。“侧耳听我”自然保留了这一意象。
- source_word: מְהֵרָה
  choice: 快快
  rationale: 副词表达迫切感；“快快”简洁自然，并与诗歌祈求的急切语气相称。
- source_word: הַצִּילֵנִי
  choice: 搭救我
  rationale: נצל表示从危险中救出；“搭救”突出眼前危难中的救援，也与后文 ישׁע 的译法有所区分。
- source_word: הֱיֵה לִי
  choice: 求你作我
  rationale: 保留命令式祈求和“为我、作我的”这一关系性表达；加“求你”符合现代汉语祷告语气。
- source_word: לְצוּר מָעוֹז
  choice: 我避难的磐石
  rationale: צוּר是“磐石”，מָעוֹז指提供强力保护的避难处或堡垒；此译同时呈现坚固与庇护的意象。
- source_word: לְבֵית מְצוּדוֹת
  choice: 我的坚固居所
  rationale: בַּיִת具有“房屋、居所”意象，מְצוּדוֹת指堡垒或防御工事；“坚固居所”在自然汉语中兼顾居所和防卫含义。
- source_word: לְהוֹשִׁיעֵנִי
  choice: 拯救我
  rationale: ישׁע的不定式表示目的或结果；“拯救我”直接表达此意，并与前面的“搭救我”形成措辞上的区分。
theological_decisions: []
