  text: אָגִ֥ילָה וְ/אֶשְׂמְחָ֗ה בְּ/חַ֫סְדֶּ֥/ךָ אֲשֶׁ֣ר רָ֭אִיתָ אֶת עָנְיִ֑/י יָ֝דַ֗עְתָּ בְּ/צָר֥וֹת נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/007.yaml
  text: I will rejoice and be glad in your steadfast love[a], because you have seen my affliction; you have known the distresses of my soul.
translation:
  language: zh_hans
  text: 我要因你的慈爱欢喜快乐，因为你看见了我的苦难，也知道我心灵所受的困苦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我心灵所受的困苦”也可译作“我生命中的患难”或“我整个人所受的困苦”；希伯来语 נֶפֶשׁ 可按语境指心灵、生命或整个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָגִילָה וְאֶשְׂמְחָה
  choice: 我要……欢喜快乐
  rationale: 两个第一人称祈愿式动词并列，表达诗人面向未来的欢欣决意；“欢喜快乐”自然保留诗歌中的强化和平行结构。
- source_word: בְחַסְדֶּךָ
  choice: 因你的慈爱
  rationale: חֶסֶד 表示坚定、忠诚的爱，在此也可含立约信实之意；“慈爱”是简洁庄重且为现代中文读者熟悉的表达。介词 בְּ 在语境中自然表示欢喜的根据或缘由。
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 该关系词在此引出诗人欢喜的原因，译作“因为”清楚呈现其语境中的因果功能。
- source_word: רָאִיתָ אֶת עָנְיִי
  choice: 你看见了我的苦难
  rationale: עֳנִי 指受苦、困顿或悲惨处境；“苦难”既涵盖外在患难，也符合诗篇的庄重语体。
- source_word: יָדַעְתָּ
  choice: 知道
  rationale: ידע 可表示知道、认识或留意；保留“知道”的宽广语义，不擅自缩减为单纯观察，也能传达上帝对诗人处境的亲知。
- source_word: בְצָרוֹת נַפְשִׁי
  choice: 我心灵所受的困苦
  rationale: צָרוֹת 为复数，指种种困境、患难；נֶפֶשׁ 可指心灵、生命或整个人。“心灵所受的困苦”在中文中自然，并保留内在、切身受苦的意味。
theological_decisions:
- issue: 诗篇哀歌中 נֶפֶשׁ 的译法
  choice: 心灵
  alternative: 生命；我整个人
  rationale: נֶפֶשׁ 的语义可涵盖生命、自我或心灵。此处采用“心灵”以表达苦难切入人的内在与全人经验，但不将其限定为与身体分离的技术性“灵魂”；脚注保留其他可行理解。
- issue: חֶסֶד 的盟约内涵
  choice: 慈爱
  alternative: 信实的爱；忠贞之爱
  rationale: “慈爱”在中文诗篇语体中自然且庄重，兼具怜爱与恩慈；其忠诚、恒久乃至盟约性的色彩由原词语境承载，不在正文中作解释性扩写。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。“欢喜快乐”保留原文两个近义动词的诗性强化；两个“你”引领的分句保持希伯来诗句的平行感。脚注标记置于相关短语之后。
