source:
  edition: WLC
  text: שָׂנֵ֗אתִי הַ/שֹּׁמְרִ֥ים הַבְלֵי שָׁ֑וְא וַ֝/אֲנִ֗י אֶל יְהוָ֥ה בָּטָֽחְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/006.yaml
  text: I hate those who keep worthless idols[a], but as for me, I trust in Yahweh.
translation:
  language: zh_hans
  text: 我恨恶那些执守虚妄之物的人[a]；至于我，我信靠耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“持守虚妄之物的人”“依附虚假空幻之物的人”。此短语在语境中也可能指虚妄的偶像或其他虚假的倚靠对象。
    reason: 保留 הַשֹּׁמְרִים“持守／看守／执守”及 הַבְלֵי שָׁוְא“虚妄、空幻之物”的词义范围，避免在正文将其所指限定为偶像。
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: 我恨恶
  rationale: 该词是 שׂנא 的 Qal 完成式第一人称单数；诗歌语境中可表达已经确立并持续至今的立场。“我恨恶”自然、庄重，也保留原文的强烈语气。
- source_word: הַשֹּׁמְרִים
  choice: 那些持守……的人
  rationale: שמר 的基本义包括看守、保守、遵守；此处以“虚妄偶像”为宾语，表示对其执守或依附。“持守”较贴近原词，又不把含义限定为实际保管。
- source_word: הַבְלֵי שָׁוְא
  choice: 虚妄偶像
  rationale: הבל 与 שׁוא 组合表达空虚、虚妄、虚假之意；语境中指人所依附、敬奉的虚假对象。“虚妄偶像”点明可能的宗教指向，同时用脚注保留较抽象的译法。
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 连词加独立人称代词形成强调性对比。“至于我”自然体现诗人与前述之人的鲜明对照。
- source_word: אֶל יְהוָה בָּטָחְתִּי
  choice: 我信靠耶和华
  rationale: בטח 与 אֶל 连用表达把信赖投向某一对象；汉语用“信靠”即可自然传达。完成式在此表达已经确立、持续有效的信赖立场。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式译出四字神名，而不以称号替代，保留原文所使用的神的名字。
theological_decisions:
- issue: הַבְלֵי שָׁוְא 的所指
  choice: 正文译作“虚妄偶像”
  alternative: “虚妄之物”“虚假的空虚之物”
  rationale: 该短语字面上具有空虚、虚假、徒然的含义，在与“信靠耶和华”对照的语境中很可能指偶像或虚假的敬拜、倚靠对象。正文点明“偶像”，脚注则保留原文较宽泛的语义，避免把其所指说得毫无余地。
- issue: 两个完成式的时间与体貌
  choice: 均用现代汉语现在时表达持续立场：“我恨恶”“我信靠”
  alternative: “我曾恨恶”“我已经信靠”
  rationale: 诗歌中的完成式可呈现已经确立而现今仍有效的态度；不强加过去时标记，更符合上下文的宣告性质。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“恨恶”保留原文力度；分号与“至于我”凸显两类人的对照。正文避免古奥堆砌，脚注承载原短语的词义歧义。
