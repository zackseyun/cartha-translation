  text: בְּ/ךָ֖ יְהוָ֣ה חָ֭סִיתִי אַל אֵב֣וֹשָׁה לְ/עוֹלָ֑ם בְּ/צִדְקָתְ/ךָ֥ פַלְּטֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame. In your righteousness deliver me.
translation:
  language: zh_hans
  text: '雅威啊，我已投靠你；

    愿我永不蒙羞。

    求你凭你的公义[a]搭救我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你凭你的公正搭救我。”
    reason: “公义”所译的希伯来词也可侧重公平、公正；介词在这里表示施救所依据或凭借的属性。
lexical_decisions:
- source_word: בְּךָ
  choice: 投靠你
  rationale: 与 חָסִיתִי 合并表达“以你为避难之处”的意象；“投靠”在现代汉语中自然，也保留了寻求庇护而非仅仅抽象“信靠”的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按通常重构的读音音译以色列上帝的专名，避免以“主”这一称号代替原文专名。
- source_word: חָסִיתִי
  choice: 我已投靠
  rationale: “已”体现完成式所表达的既成行动或确立状态；“投靠”保留 חסה 的避难、寻求庇护意象。
- source_word: אַל אֵבוֹשָׁה לְעוֹלָם
  choice: 愿我永不蒙羞
  rationale: “愿”体现 אַל 所引出的祈愿；“蒙羞”兼顾失败后受辱的外在结果，“永不”自然表达否定语境中的 לְעוֹלָם。
- source_word: בְּצִדְקָתְךָ
  choice: 凭你的公义
  rationale: “凭”体现介词 ב 的根据或凭借含义；“公义”保留 צְדָקָה 的广度，既可指上帝正直的品格，也可指与此相符的拯救行动。
- source_word: פַלְּטֵנִי
  choice: 搭救我
  rationale: 准确表达加强式命令所要求的主动营救；“搭救”简洁自然，并符合诗篇祈祷的庄重语体。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用音译“雅威”，以保留其作为专名的性质，不以称号“主”替代。
- issue: 上帝的 צְדָקָה 与拯救行动的关系
  choice: 公义
  alternative: 公正
  rationale: “公义”能保留该词在此处较宽的语义张力，即上帝正直的品格及其施行拯救时所显出的正直；“公正”是可能的语境义，但范围相对较窄。
translation_notes:
  register: 采用自然、庄重的现代汉语诗歌祈祷体。分行对应三个祈祷意群；以“啊”“愿”“求你”传达呼告和恳求语气，不额外补入原文没有的神学限定。
