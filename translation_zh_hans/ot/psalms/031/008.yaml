id: PSA.31.8
reference: Psalms 31:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹ֣א הִ֭סְגַּרְתַּ/נִי בְּ/יַד אוֹיֵ֑ב הֶֽעֱמַ֖דְתָּ בַ/מֶּרְחָ֣ב רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/008.yaml
  text: and you have not delivered me into the hand of the enemy[b][a]; you have set my feet in a broad place.
translation:
  language: zh_hans
  text: 你没有把我交在仇敌手中[a]；你使我的双脚站在宽阔之地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有把我交在仇敌的权势下。”
    reason: lexical_alternative
  - marker: b
    text: “宽阔之地”与受困、受压的处境相对，使人联想到自由、安全和脱离困境。
    reason: cultural_note
lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  choice: 没有把我交在
  rationale: 此处סגר的使役式表示把某人交由他者掌控。“把我交在……手中”既符合现代汉语，也保留落入敌对权势之下的含义。
- source_word: בְּיַד
  choice: 在……手中
  rationale: 保留希伯来语“手”的具体意象；“交在某人手中”在汉语中也自然表示置于其权势或控制之下。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 原文为无冠词单数，可指眼前的敌对者，也可作概括性称呼；“仇敌”保持诗歌语体而不额外限定其身份。
- source_word: הֶעֱמַדְתָּ
  choice: 使……站在
  rationale: 准确体现עמד使役式“使站立、安置”的意义，并与“我的双脚”构成自然、具体的汉语表达。
- source_word: בַמֶּרְחָב
  choice: 在宽阔之地
  rationale: 保留“宽阔空间”与困窘、围困相对的空间隐喻；“宽阔之地”庄重而易懂。
- source_word: רַגְלָי
  choice: 我的双脚
  rationale: 体现原文复数，并传达得以稳立和自由行动的具体图像。
- source_word: וְלֹא
  choice: 没有
  rationale: 汉语无需机械译出句首连接词；承接关系可由上下文和分号自然表达，同时完整保留否定意义。
theological_decisions:
- issue: “宽阔之地”的隐喻是否应解释性展开
  choice: 正文保留空间隐喻，脚注说明其联想
  alternative: 直接译为“安全自由之处”
  rationale: 原文以空间图像表达脱离困境后的自由、安全与舒展；保留隐喻可避免把丰富含义缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而自然的诗歌语体。“交在仇敌手中”保留原文惯用意象；“使我的双脚站在宽阔之地”兼顾使役结构与空间隐喻。
