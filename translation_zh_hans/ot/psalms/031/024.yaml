  text: חִ֭זְקוּ וְ/יַאֲמֵ֣ץ לְבַבְ/כֶ֑ם כָּל הַ֝/מְיַחֲלִ֗ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/024.yaml
  text: Be strong[a], and let your heart be courageous, all you who wait for Yahweh.
translation:
  language: zh_hans
  text: 所有等候[a]雅威的人啊，你们要刚强；愿你们的心坚强！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“盼望”。希伯来语这个分词兼有等候和盼望的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ
  choice: 你们要刚强
  rationale: 这是复数祈使式，直接劝勉听众刚强；“要刚强”简洁自然，并保留命令语气。
- source_word: וְיַאֲמֵץ
  choice: 愿……坚定勇敢
  rationale: 使役式未完成体在祈使句之后带劝勉或祝愿意味。“愿”保留这种语气；“坚定勇敢”表达内心坚强有勇气的含义，也避免与前句机械重复。
- source_word: לְבַבְכֶם
  choice: 你们的心
  rationale: לֵבָב在此指人的内在生命，包括意志、信心和勇气；“心”是中文诗歌体中自然且含义宽广的对应词。
- source_word: כָּל
  choice: 所有……的人
  rationale: 准确表达对整个群体的概括，并以自然的现代汉语构成呼语。
- source_word: הַמְיַחֲלִים
  choice: 等候
  rationale: 该分词兼有等候和盼望之意。“等候”保留原词的动态意象，而期待与信靠的含义通过脚注说明。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 介词ל在此标明等候所指向的对象；中文可直接说“等候雅威”。专名“雅威”呈现原文的神圣名字יהוה。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用“雅威”，以音译方式保留其作为立约神名的性质，而不以称号替代。
- issue: יַחֵל所表达的等候与盼望
  choice: 正文译“等候”，脚注保留“盼望”
  alternative: 正文译“仰望”或“盼望”
  rationale: 原词在本节兼具耐心等候和怀着希望期待的含义；正文与脚注共同保留这一语义张力，不把它收窄为单一心理状态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将“所有等候雅威的人”前置为呼语，使复数劝勉对象清楚；“你们的心”保留希伯来诗歌以内心代表意志和勇气的表达。
