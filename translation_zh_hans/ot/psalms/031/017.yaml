id: PSA.31.17
reference: Psalms 31:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְֽהוָ֗ה אַל אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑י/ךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִ/שְׁאֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: O Yahweh[a], let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol.
translation:
  language: zh_hans
  text: 耶和华啊，求你不要让我蒙羞，因为我呼求你；愿恶人蒙羞，愿他们在阴间[a]沉寂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沉寂”也可译作“静止”，或把末句译作“愿他们默默下到阴间”。这里的“阴间”指死者之境，不一定是“地狱”。
    reason: 说明יִדְּמוּ的沉默／静止语义，以及לִשְׁאוֹל可能具有的趋向含义；同时避免把שְׁאוֹל误解为后世意义上的地狱。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行、庄重的专名“耶和华”译出四字神名，并用“啊”表达呼格。
- source_word: אַל אֵבוֹשָׁה
  choice: 求你不要让我蒙羞
  rationale: אַל与此处动词形式构成否定祈愿；“求你不要让我”自然表达诗人的祷告语气，“蒙羞”保留受辱、愿望落空而遭羞耻的含义。
- source_word: כִּי קְרָאתִיךָ
  choice: 因为我呼求你
  rationale: כִּי引出祈求的依据；完成式在祷告诗歌语境中可指诗人已经并正在向神求告，汉语用“呼求”简洁传达向神求助。
- source_word: יֵבֹשׁוּ רְשָׁעִים
  choice: 愿恶人蒙羞
  rationale: 以“愿”表达祈愿或咒诅式语气，并重复“蒙羞”，保留与前半节的词汇平行。
- source_word: יִדְּמוּ
  choice: 愿他们……沉寂
  rationale: 该动词可指沉默或静止；“沉寂”能兼顾两层含义，又不把它强化为使役性的“被消灭”。
- source_word: לִשְׁאוֹל
  choice: 在阴间
  rationale: שְׁאוֹל指死者所在之境，并不必然等同于后世观念中的地狱；“阴间”是中文圣经语境中较自然且能保留其概念范围的译法。介词ל在这里结合“沉寂”按状态或所在处译作“在”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知的专名“耶和华”，而不以“主”替代，从而保留其专名性质；“雅威”是较接近学术拟音的另一选择。
- issue: שְׁאוֹל的概念范围
  choice: 阴间
  alternative: 死者之境；坟墓
  rationale: 此词所指超出单一坟墓，也不应直接解释为受刑罚的“地狱”。正文保留传统且自然的“阴间”，脚注说明其范围，以免导入后期教义概念。
- issue: יִדְּמוּ所表达的结局
  choice: 沉寂
  alternative: 静止；默默下到阴间
  rationale: 原文可表达沉默或静止，并与阴间产生所在或趋向上的关联。正文不把这种含混性明确化为“灭亡”，脚注保留其他可能理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留希伯来诗歌中“蒙羞”的反复和平行结构。以“求你”表达前半句祷告，以“愿”表达后半句针对恶人的祈愿；不使用生僻音译，并通过脚注保存末句的词义与句法歧义。
