lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词指负责或主持音乐演奏的人；“乐长”简洁庄重，适合诗篇标题。前缀 לַ־ 译作“交给”，体现标题中的交付对象。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 该词是诗篇标题中的常用体裁名称，通常指配合音乐演唱的诗歌；在中文《诗篇》语境中译作“诗”自然简明。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ־ 在诗篇标题中可表示作者、归属、关联或题献；“大卫的”保留这种关系上的开放性，不武断限定为作者身份。
theological_decisions:
- issue: 大卫标题中介词关系的含义
  choice: 大卫的诗
  alternative: 大卫所作的诗；为大卫而作的诗
  rationale: 希伯来文 לְדָוִד 并不必然只表示作者身份，也可能表示关联、归属或题献；正文采用“大卫的诗”，并以脚注说明其他可能，以保留原文的含混性。
translation_notes:
  register: 采用现代、简洁而庄重的诗篇标题体。“乐长”是略带礼仪色彩但普通读者可理解的称谓；脚注标记紧接“大卫的诗”，与所解释的希伯来文短语对应。
