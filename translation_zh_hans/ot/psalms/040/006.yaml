  text: זֶ֤בַח וּ/מִנְחָ֨ה לֹֽא חָפַ֗צְתָּ אָ֭זְנַיִם כָּרִ֣יתָ לִּ֑/י עוֹלָ֥ה וַ֝/חֲטָאָ֗ה לֹ֣א שָׁאָֽלְתָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/006.yaml
  text: Sacrifice and offering you did not desire[a]; ears you have opened for me[b]; burnt offering and sin offering you did not ask for.
translation:
  language: zh_hans
  text: 祭牲和素祭，你不喜悦；你开通了我的耳朵[a]；燔祭和赎罪祭，你也不索求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “开通了我的耳朵”按字面可译为“你为我挖了耳朵”；这可能是指使人能够听见或顺从的说法。七十士译本作“你为我预备了身体”，《希伯来书》10:5也采用这一表述。
    reason: 说明希伯来语独特意象，并保留七十士译本及《希伯来书》引文所反映的不同读法。
lexical_decisions:
- source_word: זֶבַח
  choice: 祭牲
  rationale: 指宰杀献上的祭物；“祭牲”在中文中既保留献祭语境，也比泛称“祭物”更贴近该词。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在此献祭语境中通常指以谷物为主的供献；采用现代中文圣经读者较易识别的专门用语“素祭”。
- source_word: לֹא חָפַצְתָּ
  choice: 你都不喜悦
  rationale: חפץ可表示喜爱、乐意或以某事为乐；“不喜悦”自然地表达其意，并与末句“不求取”保持区别。
- source_word: אָזְנַיִם כָּרִיתָ לִּי
  choice: 你却为我开通了耳朵
  rationale: כרה本义为“挖、凿”，与“耳朵”连用形成鲜明而不完全透明的表达。“开通了耳朵”在中文中保留开凿意象，同时传达使人能够听从的可能含义；原文直译及古希腊译本异文收入脚注。
- source_word: עוֹלָה
  choice: 燔祭
  rationale: 准确对应全然焚烧献上的祭物，也是中文中约定俗成的礼仪术语。
- source_word: חֲטָאָה
  choice: 赎罪祭
  rationale: 在与燔祭并列的礼仪语境中，所指是为罪献上的祭，而非抽象的“罪”。
- source_word: לֹא שָׁאָלְתָּ
  choice: 你也不求取
  rationale: 保留שאל“求、索求”的基本意义，避免用“要求”过度强化义务或命令色彩。
theological_decisions:
- issue: 希伯来文本“你为我挖了耳朵”与《希伯来书》10:5所引“你为我预备了身体”之间的关系
  choice: 正文按希伯来文本译作“你却为我开通了耳朵”，并在脚注说明其字面形象。
  alternative: 古希腊译本作“你为我预备了身体”，《希伯来书》10:5沿用这一译法。
  rationale: 诗篇正文以马所拉希伯来文本为翻译依据，不以新约引文或古希腊译本取代它；脚注则保留重要的文本与正典关联，不消解两者之间的张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体中文。分号保留原句三组献祭陈述的结构；“却”凸显神不喜悦祭物与为诗人开通耳朵之间的对照。礼仪术语采用“素祭、燔祭、赎罪祭”，兼顾准确性与读者熟悉度。
