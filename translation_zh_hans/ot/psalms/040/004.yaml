id: PSA.40.4
reference: Psalms 40:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הַ/גֶּ֗בֶר אֲשֶׁר שָׂ֣ם יְ֭הֹוָה מִבְטַח֑/וֹ וְֽ/לֹא פָנָ֥ה אֶל רְ֝הָבִ֗ים וְ/שָׂטֵ֥י כָזָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/004.yaml
  text: Blessed is the man who has made Yahweh his trust[a], and has not turned to the proud[d][c][b], to those who turn aside to falsehood.
translation:
  language: zh_hans
  text: 以雅威为自己所信靠的那人[b]，不转向狂傲之辈[c]，也不转向偏向虚假的人[d]，是有福的[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“是快乐的”。希伯来语称福用语 אַשְׁרֵי 兼有幸福与蒙福的含义；正文用“有福”以保留诗篇的智慧文学语气。
    reason: lexical_alternative
  - marker: b
    text: 原文用阳性单数“那人”，在这里具有代表性。
    reason: cultural_note
  - marker: c
    text: 或译“傲慢的人”。这里的希伯来词 רְהָבִים 最可能是指狂傲的人，而不是专名“拉哈伯”。
    reason: lexical_alternative
  - marker: d
    text: “虚假”也可译作“谎言”或“欺骗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 是有福的
  rationale: 这是智慧文学中宣告福分的惯用语；“有福”兼顾蒙福与处于可喜境况两层含义，比单说“快乐”更能保留原文语气。
- source_word: הַגֶּבֶר
  choice: 那人
  rationale: 原词为阳性单数，指一个成年男子，但在这类智慧格言中具有代表性。现代汉语用“那人”既自然，也不把其普遍适用性误限于男性。
- source_word: שָׂם
  choice: 以……为
  rationale: 该动词意为“放置、设立”。“以雅威为自己所信靠的”自然表达把信赖置于雅威身上的完成性行动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，不以称号替代。
- source_word: מִבְטַחוֹ
  choice: 自己所信靠的
  rationale: 该名词可指信赖或信赖的对象；此处与 שָׂם 连用，译为“以……为自己所信靠的”兼顾其对象性和中文表达。
- source_word: פָנָה אֶל
  choice: 转向
  rationale: 保留“转身朝向”的意象，同时可表达寻求、倚赖或归附。
- source_word: רְהָבִים
  choice: 狂傲之辈
  rationale: 此处复数形式最自然地理解为狂傲的人，而非专名“拉哈伯”；“之辈”保留群体含义，并符合诗歌语体。
- source_word: שָׂטֵי
  choice: 偏向
  rationale: 分词表达偏离、转离的持续倾向；“偏向”保留其动态含义，而不额外断定他们是正式背道者。
- source_word: כָזָב
  choice: 虚假
  rationale: 该单数抽象名词涵盖谎言、虚妄和欺骗；“虚假”保留这种语义宽度。
theological_decisions:
- issue: 智慧文学称福句中的代表性阳性单数
  choice: 那人
  alternative: 那男子；这样的人
  rationale: 原文确为阳性单数，但在称福格言中具有代表作用。“那人”在现代汉语中自然，并以脚注说明原文形式，避免将经文适用范围不必要地限于男性。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 正文保留希伯来文的专名性质，不以“主”这一称号替换；“雅威”较直接反映通常重构的读音。
- issue: רְהָבִים 是普通名词还是专名
  choice: 狂傲之辈
  alternative: 拉哈伯一类；拉哈伯
  rationale: 复数形态及本节与“虚假”的伦理性并列，更支持将其理解为狂傲的人；但脚注保留“傲慢”的近义表达。
- issue: שָׂטֵי כָזָב 的关系
  choice: 偏向虚假的人
  alternative: 偏离而追随谎言的人；背道者
  rationale: 译文保留原文“偏离/转向”与“虚假”之间较紧凑而略有张力的关系，不用“背道者”等更强的神学标签加以限定。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。句序略作汉语化调整，将称福宣告置于句末以清楚统摄前面的条件，同时保留原文两组“转向”的并列关系。
