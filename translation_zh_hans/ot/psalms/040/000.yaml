lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 此词指负责统筹音乐演唱或演奏的人；“乐长”简洁庄重，前缀 לַ־ 译作“交给”，符合诗篇标题中的题献或演出指示用法。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ־ 在诗篇标题中可表示作者、归属、关联或题献；“大卫的”较能保留这种开放性，避免直接断定为“大卫所作”。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: מִזְמוֹר 是带有音乐意味的诗篇体裁名称；在中文诗篇标题中译作“诗”自然简明，并与“大卫的”构成通顺表达。
theological_decisions:
- issue: 大卫标题中 לְדָוִד 的语义
  choice: 译作“大卫的”
  alternative: “大卫所作”或“献给大卫”
  rationale: 希伯来文并未要求在作者身份、关联或题献之间作出唯一判断；正文采用较宽泛的表达，并以脚注说明其他可能。
translation_notes:
  register: 采用现代、简洁而庄重的诗篇标题体。“乐长”便于普通读者理解；将“大卫的”与“诗”合并表达，以免逐词断句造成生硬，同时用脚注保留原文介词的真实歧义。
