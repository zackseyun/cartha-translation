source:
  edition: WLC
  text: אָ֣ז אָ֭מַרְתִּי הִנֵּה בָ֑אתִי בִּ/מְגִלַּת סֵ֝֗פֶר כָּת֥וּב עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/007.yaml
  text: Then I said[a], “Behold, I have come[b]; in the scroll of the book it is written about me.”
translation:
  language: zh_hans
  text: 于是我说：“看哪，我来了；书卷上有关于我的记载[a]。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为我写着”，也可理解为“为我所规定的”。希伯来语既可指关于说话者的记载，也可指为他写下的规定。
    reason: alternative_reading
  - marker: b
    text: 《希伯来书》10:7在论及弥赛亚时引用本节。
    reason: cross_reference
lexical_decisions:
- source_word: אָז
  choice: 于是
  rationale: 表示承接上文的时间与顺序，也带出诗人的回应；“于是”在现代汉语中自然简洁。
- source_word: אָמַרְתִּי
  choice: 我说
  rationale: 按第一人称单数完成式直译，清楚引出后面的直接引语。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示词提醒听者注意、加强语气的功能，同时维持诗歌的庄重语体。
- source_word: בָאתִי
  choice: 我来了
  rationale: 在自我呈现的语境中，表达说话者已经来到并在场；现代汉语“我来了”自然地保留这一完成并具有现实结果的意味。
- source_word: בִּמְגִלַּת סֵפֶר
  choice: 书卷上
  rationale: מְגִלָּה指卷轴，סֵפֶר指书写的文献；“书卷”既保留古代卷轴的意象，也符合现代中文圣经诗歌语体。介词在中文里自然表达为“上”。
- source_word: כָּתוּב
  choice: 有……记载
  rationale: 表达被动分词所指的既成书写状态；比生硬的“被写着”更符合现代汉语。
- source_word: עָלָי
  choice: 关于我
  rationale: עַל加人称后缀在此最直接可理解为“关于／论到”；另有“为我”或“为我规定”的可能，保留于脚注。
theological_decisions:
- issue: 后来在《希伯来书》10:7中用于弥赛亚语境的 עָלָי 应如何理解
  choice: 关于我
  alternative: 为我；为我所规定的
  rationale: 正文依希伯来诗篇的直接句法采用“关于我”，不把后来的基督论引用预先嵌入译文；同时以脚注保留该短语可能表示为说话者所写或为他所规定的含义，并另注新约引用。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“看哪”保留原文的强调语气；“书卷”保留古代卷轴意象。脚注标记均置于正文相应位置，其中[a]紧随具有语义歧义的“关于我的记载”，[b]置于整句之后标示跨经文引用。
