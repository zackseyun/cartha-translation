id: PSA.40.12
reference: Psalms 40:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י אָפְפ֥וּ עָלַ֨/י רָע֡וֹת עַד אֵ֬ין מִסְפָּ֗ר הִשִּׂיג֣וּ/נִי עֲ֭וֺנֹתַ/י וְ/לֹא יָכֹ֣לְתִּי לִ/רְא֑וֹת עָצְמ֥וּ מִ/שַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗/י וְ/לִבִּ֥/י עֲזָבָֽ/נִי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/012.yaml
  text: For evils beyond number have surrounded me[a]; my iniquities have overtaken me, and I am not able to see. They are more than the hairs of my head[c][b], and my heart fails me.
translation:
  language: zh_hans
  text: 因为数不尽的祸患围住了我[a]；我的罪孽追上了我[b]，我无法看见。它们比我头上的发丝还多，我的心离弃了我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “数不尽”也可译作“无法数算”或“多得不可胜数”。
    reason: lexical_alternative
  - marker: b
    text: “罪孽”也可译作“罪”或“罪责”；希伯来词既可指人的恶行，也可包含由此而来的罪责与重担。
    reason: lexical_alternative
  - marker: c
    text: 直译：“我的心离弃了我。”此语可表达内在力量或勇气的丧失。
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为诗人的呼求说明缘由；“因为”自然保留了解释关系。
- source_word: אָפְפוּ עָלַי
  choice: 围住了我
  rationale: 保留从四面包围、使人受困的意象，同时符合现代汉语表达。
- source_word: רָעוֹת
  choice: 祸患
  rationale: 该词可指邪恶、灾祸或伤害；此处“祸患”保留诗人遭受患难的含义，又不把范围缩窄为单纯的情绪困扰。
- source_word: עַד אֵין מִסְפָּר
  choice: 数不尽的
  rationale: 这是表示无法计数的惯用语；译法简洁自然，并与后文“比……发丝还多”呼应。
- source_word: הִשִּׂיגוּנִי
  choice: 追上了我
  rationale: 保留“追赶而及”的动态意象，也表达罪孽终于临到并压倒诗人。
- source_word: עֲוֹנֹתַי
  choice: 我的罪孽
  rationale: עָוֹן可涵盖罪行、罪责及其重担；“罪孽”保留道德分量，同时以脚注提示其语义幅度。
- source_word: וְלֹא יָכֹלְתִּי לִרְאוֹת
  choice: 我便无法看见
  rationale: 忠实表达看不见或无力观看的状态；不进一步断定这是生理失明、因惊惧而目眩，还是比喻性的失去判断力。
- source_word: עָצְמוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: 它们比我头上的发丝还多
  rationale: 依上下文将עָצְמוּ理解为数量众多，保留希伯来诗歌中以头发比喻不可胜数的表达。
- source_word: וְלִבִּי עֲזָבָנִי
  choice: 我的心也衰竭了
  rationale: 原文直译为“我的心离弃了我”，是力量、勇气或内在支撑消失的形象说法；“衰竭”在现代汉语中自然表达其效果，同时脚注保留原始意象。
theological_decisions:
- issue: עֲוֹנֹתַי是指诗人自己的罪孽、罪责，还是罪所带来的惩罚与患难
  choice: 译作“我的罪孽”，保留诗人对自身罪恶的承认
  alternative: “我的罪责”或“我犯罪的后果”
  rationale: 带第一人称所有格的עָוֹן最自然地指说话者自己的罪孽或罪责。经文把外在祸患与内在道德责任并列；不把它化约为单纯的受苦，也不排除罪责重担及其后果的意味。
- issue: “无法看见”的具体含义
  choice: 不补明原因或对象
  alternative: 解释为因罪孽遮蔽而看不清、因灾祸目眩，或无法正视自己的罪
  rationale: 希伯来文只陈述“我无法看见”，没有明确说明所见对象或不能看的原因，因此保留其诗意和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。句式尽量贴近希伯来文的推进：祸患包围、罪孽追上、视力或意识受压、数量多于发丝，最后心力衰竭。保留“围住”“追上”等具体意象，并避免把“无法看见”解释得过于确定。
