id: PSA.40.3
reference: Psalms 40:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּתֵּ֬ן בְּ/פִ֨/י שִׁ֥יר חָדָשׁ֮ תְּהִלָּ֪ה לֵֽ/אלֹ֫הֵ֥י/נוּ יִרְא֣וּ רַבִּ֣ים וְ/יִירָ֑אוּ וְ֝/יִבְטְח֗וּ בַּ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/003.yaml
  text: He put a new song in my mouth[a], a song of praise to our God. Many will see and fear[c][b], and will trust in Yahweh.
translation:
  language: zh_hans
  text: '他把一首新歌放在我口中，

    就是赞美我们上帝的歌。

    许多人必看见，便会惧怕[a]，

    并信靠雅威[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“便心生敬畏。”希伯来语这个动词可表示惧怕、敬畏或震撼。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为“YHWH”，是上帝的专名；传统上也译作“耶和华”或以“上主”代称。
    reason: divine_name
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 他把……放在
  rationale: נתן本义常为“给”，但与“在我口中”连用时，译作“放在”既符合现代汉语习惯，也保留上帝将诗歌置于诗人口中的具体意象。
- source_word: בְּפִי
  choice: 在我口中
  rationale: 按希伯来文直译为“在我口中”，保留身体意象，不改写为较抽象的“使我歌唱”。
- source_word: שִׁיר חָדָשׁ
  choice: 一首新歌
  rationale: 直接、自然地保留“新”修饰“歌”的结构，表达因上帝施行拯救而生出的崭新颂赞。
- source_word: תְּהִלָּה לֵאלֹהֵינוּ
  choice: 就是赞美我们上帝的歌
  rationale: 该短语与“一首新歌”构成同位说明，指出这歌的性质或内容。补出“就是”和“歌”，使同位关系在现代汉语中清楚自然，并未增加新的命题内容。
- source_word: יִרְאוּ רַבִּים
  choice: 许多人必看见
  rationale: 未完成式在这里表达随之发生的结果或将来的反应；不补出“看见”的宾语，以保留原文的简洁和开放性。
- source_word: וְיִירָאוּ
  choice: 便会惧怕
  rationale: ירא可涵盖害怕、敬畏和震撼。正文采用“惧怕”以保留原文较强的情感和神学张力，脚注提示“心生敬畏”这一语境上合理的译法。
- source_word: וְיִבְטְחוּ
  choice: 并信靠
  rationale: בטח表示信任、倚靠；“信靠”在现代中文宗教语境中自然，也准确表达把可靠性寄托于某对象。
- source_word: בַּיהוָה
  choice: 雅威
  rationale: 介词ב与בטח连用，汉语用“信靠雅威”即可自然表达；יהוה作为上帝的专名，以“雅威”音译，区别于称号“主”。
theological_decisions:
- issue: 看见之后的反应וְיִירָאוּ应译为惧怕还是敬畏
  choice: 惧怕
  alternative: 心生敬畏
  rationale: 该动词同时可以表示恐惧与敬畏，而上下文又把这种反应与随后信靠上帝相连。正文保留“惧怕”的力度，不把张力单向化解为较柔和的崇敬；脚注交代另一种可能。
- issue: 上帝专名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名而非普通称号。正文以“雅威”呈现其专名性质，并用脚注说明希伯来文字形及传统译名。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。保留“放在我口中”的具体意象和原文三个反应动作“看见—惧怕—信靠”的推进；通过“就是”明确同位关系，避免译文突兀。
