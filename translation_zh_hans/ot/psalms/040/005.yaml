  text: רַבּ֤וֹת עָשִׂ֨יתָ אַתָּ֤ה יְהוָ֣ה אֱלֹהַ/י֮ נִֽפְלְאֹתֶ֥י/ךָ וּ/מַחְשְׁבֹתֶ֗י/ךָ אֵ֫לֵ֥י/נוּ אֵ֤ין עֲרֹ֬ךְ אֵלֶ֗י/ךָ אַגִּ֥ידָה וַ/אֲדַבֵּ֑רָה עָ֝צְמ֗וּ מִ/סַּפֵּֽר׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/005.yaml
  text: You have done many things[a], O Yahweh my God—your wonders and your plans for us; none can be compared to you. If I would declare and speak of them, they are too many to recount.
translation:
  language: zh_hans
  text: 耶和华—我的神啊，你所行的奇事和你为我们所怀的心意[a]何其多！没有什么能与你相比。我想述说、谈论，却多得数不尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你为我们所定的计划”。
    reason: מַחְשָׁבוֹת可指“思想、意念、心意”或有目的的“计划、筹划”；正文采用语义较宽的译法，脚注保留“计划”的可能。
lexical_decisions:
- source_word: רַבּוֹת עָשִׂיתָ
  choice: 你所行的何其多
  rationale: רַבּוֹת在此强调上帝所行之事数量繁多；中文以“何其多”自然表达感叹和丰富性，不必补出过度具体的宾语。
- source_word: יְהוָה אֱלֹהַי
  choice: 耶和华—我的神啊
  rationale: 以通行的中文专名“耶和华”呈现四字神名，并保留诗人直接呼告“我的神”的语气。
- source_word: נִפְלְאֹתֶיךָ
  choice: 你的奇事
  rationale: 该词指令人惊奇的作为；“奇事”简洁庄重，也保留其作为实体名词的表达。
- source_word: וּמַחְשְׁבֹתֶיךָ אֵלֵינוּ
  choice: 你为我们所定的计划
  rationale: מַחְשָׁבוֹת可指思想、意念或计划；结合上帝已经施行的奇事，“计划”自然表达有目的的意向，同时用脚注保留较为字面的可能译法。
- source_word: אֵין עֲרֹךְ אֵלֶיךָ
  choice: 无人能与你相比
  rationale: 该希伯来语表达比较或排列时无可匹敌；中文以“无人能与你相比”清楚传达上帝的无可比拟。
- source_word: אַגִּידָה וַאֲדַבֵּרָה
  choice: 我要述说、谈论这些事
  rationale: 两个鼓励式形式可表达说话者的意愿；不强加原文没有明示的条件连词，并让后半句说明为何无法尽述。
- source_word: עָצְמוּ מִסַּפֵּר
  choice: 它们多得数不尽
  rationale: עָצְמוּ在此与“数算”连用，表示数量极多，而非力量强大；“多得数不尽”准确且符合现代中文习惯。
theological_decisions:
- issue: 上帝对其子民的מַחְשָׁבוֹת所指为何
  choice: 译作“你为我们所定的计划”
  alternative: “你对我们的意念”或“你为我们所怀的心意”
  rationale: “计划”表达原词可能具有的目的性，但不把本节套入特定的预定论或护理观；脚注保留原词较宽泛的“意念”义。
- issue: 本节比较对象的句法理解
  choice: 译作“无人能与你相比”
  alternative: “没有什么能与你的奇事和计划相比”
  rationale: אֵלֶיךָ字面指向“你”，因此正文保留对上帝本身无可比拟的宣告；不擅自改成只比较其作为。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体中文。“耶和华—我的神啊”保留直接呼告；末句用“但”显明想要述说与无法数尽之间的转折。
