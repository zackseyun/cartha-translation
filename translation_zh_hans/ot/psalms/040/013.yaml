  text: רְצֵ֣ה יְ֭הוָה לְ/הַצִּילֵ֑/נִי יְ֝הוָ֗ה לְ/עֶזְרָ֥תִ/י חֽוּשָׁ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/013.yaml
  text: Be pleased[a], O Yahweh, to deliver me; O Yahweh[b], hurry to help me.
translation:
  language: zh_hans
  text: 耶和华啊，求你乐意搭救我；耶和华啊，求你快来帮助我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְצֵה
  choice: 求你乐意
  rationale: רצה的祈使式在祷告语境中请求上帝欣然允准、愿意施行；“求你乐意”既保留意愿与恩允的意味，也符合现代汉语祷告语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 将四字神名按现代简体中文圣经传统音译为“耶和华”，保留其作为专名的功能，而不以“主”这一称号替代。
- source_word: לְהַצִּילֵנִי
  choice: 搭救我
  rationale: נצל的使役式意为从危险中救出；“搭救我”自然、庄重，并清楚表达从困境中解救的含义。
- source_word: לְעֶזְרָתִי
  choice: 帮助我
  rationale: 原文直译近于“来作我的帮助”；汉语用“帮助我”更自然，且准确传达求援之意。
- source_word: חוּשָׁה
  choice: 快来
  rationale: חושׁ的祈使式表示赶快、迅速行动；结合“帮助我”译作“快来”，自然地表达紧迫求助，同时不把行动方式具体化过度。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文两次直接使用四字神名。中文正文采用广为读者熟悉的专名音译“耶和华”，既区别于称号“主／上主”，也避免因改用称号而掩盖原文的专名。
- issue: רְצֵה所表达的神圣意愿
  choice: 求你乐意
  alternative: 求你愿意；求你喜悦搭救我
  rationale: 原词可指愿意、悦纳或喜悦。正文保留“乐意”这一开放表达，不将其缩减为单纯礼貌用语，也不强化为上帝以搭救本身为享乐对象。
translation_notes:
  register: 采用自然、庄重的现代汉语祷告语体。两个呼语“耶和华啊”对应原文的重复，分号保留两段平行恳求；“求你”补足汉语祈求表达，但不增加实质内容。
