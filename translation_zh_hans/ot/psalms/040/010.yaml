  text: צִדְקָתְ/ךָ֬ לֹא כִסִּ֨יתִי בְּ/ת֬וֹךְ לִבִּ֗/י אֱמוּנָתְ/ךָ֣ וּ/תְשׁוּעָתְ/ךָ֣ אָמָ֑רְתִּי לֹא כִחַ֥דְתִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ לְ/קָהָ֥ל רָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/010.yaml
  text: I have not hidden your righteousness within my heart[a]; I have spoken of your faithfulness and your salvation[d][c][b]. I have not concealed your steadfast love and your truth from the great assembly.
translation:
  language: zh_hans
  text: 我没有把你的公义藏在心里[a]；我已述说你的信实和你的拯救[b]。我没有向广大的会众[d]隐瞒你的慈爱[c]和真理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“公正”；希伯来词可指合乎正义的品格，也可侧重公正的行动或伸冤。
    reason: lexical_alternative
  - marker: b
    text: “拯救”也可译作“解救”。
    reason: lexical_alternative
  - marker: c
    text: “慈爱”也可译作“守约的慈爱”，强调忠贞不变的爱。
    reason: lexical_alternative
  - marker: d
    text: “向广大的会众”也可理解为“在广大的会众面前”。
    reason: syntactic_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: 你的公义
  rationale: “公义”保留צדקה的道德与盟约含义；本词在语境中也可能侧重上帝施行公正或为人伸冤，故以脚注注明。
- source_word: לֹא כִסִּיתִי בְּתוֹךְ לִבִּי
  choice: 我没有……藏在心里
  rationale: כסה本义为“遮盖”，此处与“心里”连用，表达没有将所知留在内心、不予宣扬；“藏在心里”自然并保留原文意象。
- source_word: אֱמוּנָתְךָ
  choice: 你的信实
  rationale: אֱמוּנָה在这里指上帝可靠、可信的品格，而非人的信念；“信实”准确而简洁。
- source_word: וּתְשׁוּעָתְךָ
  choice: 和你的拯救
  rationale: תשועה可指拯救、解救或胜利；“拯救”既符合诗篇中上帝搭救人的语境，也避免把含义限定为抽象教义术语。
- source_word: אָמָרְתִּי
  choice: 我述说了
  rationale: 该动词字面为“我说了”，但其宾语是上帝的信实与拯救；“述说”自然呈现公开宣告之意。
- source_word: לֹא כִחַדְתִּי
  choice: 我没有……隐瞒
  rationale: כחד在此表示隐藏或不让人知道；“隐瞒”与前面的“藏”形成适度措辞区别，同时保留诗歌平行。
- source_word: חַסְדְּךָ
  choice: 你的慈爱
  rationale: חסד包含恩慈、忠贞和盟约忠诚。“慈爱”是现代中文圣经语域中自然、宽广的对应词；“守约的慈爱”可进一步明示其盟约色彩。
- source_word: וַאֲמִתְּךָ
  choice: 和真理
  rationale: אמת可表示真理、真实、可靠或信实。译作“真理”可与本节较早的אֱמוּנָה“信实”保持词汇区分，同时以脚注保留“信实”的可能义。
- source_word: לְקָהָל רָב
  choice: 向大会众
  rationale: 在כחד“隐瞒”之后，לְ可标示被隐瞒的对象，即“向/对大会众”；此结构也可能按公开宣告的场景理解为“在大会众面前”，故脚注保留。
theological_decisions:
- issue: 如何区分 אֱמוּנָה 与 אֱמֶת 这两个意义相近的神圣属性词
  choice: 分别译为“信实”和“真理”
  alternative: 将后者译为“真实”或“信实”，使两词含义更明显重叠
  rationale: 原文有意并列相关但不同的词。分别译出可保存诗句的修辞丰满度，又不否认אמת也具有可靠、信实的含义。
- issue: צדקה在此指一般的“公义”，还是上帝公正的作为、伸冤
  choice: 正文译“公义”
  alternative: 译“公正”或“伸冤的作为”
  rationale: 与信实、拯救、慈爱和真理并列时，“公义”最能保留其宽广的道德与盟约意义；脚注保留更具行动性的解释，不把张力消除。
- issue: 完成体动词在中文中的时体表达
  choice: 用“没有……；……了；没有……”表达已作出的见证
  alternative: 全部不加“了”，读作一般性陈述
  rationale: 希伯来语完成体将这些行动作为已完成的事实陈述。中文在肯定句“述说了”中加“了”较自然，否定句则无需机械添加时态标记。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大会众”保留公开敬拜群体的规模感；整体保持希伯来诗歌中“藏在心里／向会众隐瞒”和“公义／信实／拯救／慈爱／真理”的平行铺陈。
