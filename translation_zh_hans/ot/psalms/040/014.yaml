  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יֵ֘בֹ֤שׁוּ וְ/יַחְפְּר֨וּ יַחַד֮ מְבַקְשֵׁ֥י נַפְשִׁ֗/י לִ/סְפּ֫וֹתָ֥/הּ יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/014.yaml
  text: Let those who seek to sweep away my life be put to shame and humiliated together[c][b][a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: zh_hans
  text: 愿那些寻索我性命、要将它除灭的人一同蒙羞受辱[a][b]；愿那些以我遭害为乐的人退后蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”原文也可译作“生命”或“自己”；这里指敌人想要夺去诗人的性命。
    reason: lexical_alternative
  - marker: b
    text: “除灭”也可译作“毁灭”或“吞灭”；原文动词有使其终结之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ יַחַד
  choice: 一同蒙羞受辱
  rationale: 两个近义动词并列，表达羞耻与受辱的加强语气；יַחַד直译为“一同”。“愿……的人”体现祈愿或咒诅语气。
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: 寻索我性命的人
  rationale: נפשׁ在敌人图谋杀害的语境中指人的性命，而非抽象的“灵魂”；“寻索我性命”保留希伯来语措辞及敌意含义。
- source_word: לִסְפּוֹתָהּ
  choice: 要将它除灭
  rationale: ספה在此指使之终结、毁灭；阴性单数后缀自然回指语法上为阴性的נפשׁ。“除灭”兼顾力度与庄重语体。
- source_word: יִסֹּגוּ אָחוֹר
  choice: 退后
  rationale: סוג与אחור连用表示后退、败退；中文“退后”自然保留其方向与祈愿语气。
- source_word: וְיִכָּלְמוּ
  choice: 蒙羞
  rationale: כלם表示受羞辱、陷于羞耻；“蒙羞”符合诗歌语体，并与前半句形成刻意的平行回响。
- source_word: חֲפֵצֵי רָעָתִי
  choice: 以我遭害为乐的人
  rationale: חפץ可指喜爱、乐见；רעה在此指临到诗人的祸害，而不是诗人本人的道德邪恶。
theological_decisions:
- issue: 本节祈愿语气的处理
  choice: 用两次“愿”明确表达诗人的祈求
  alternative: 译成直接陈述“他们必……”
  rationale: 这些未完成式在诗篇祈祷语境中带有祈愿或咒诅色彩；译为“愿”既不弱化张力，也不把祈求改写成确定预言。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留原文两组羞辱词的平行结构，不为避免重复而抹去诗体回响；“寻索我性命”略带诗体色彩，但在现代汉语中仍清楚可懂。
