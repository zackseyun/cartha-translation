  terminology: “性命”恰当处理נפשׁ在敌对杀害语境中的含义，避免误译为抽象的“灵魂”。“蒙羞受辱”保留前半句两个近义羞辱动词的强化；末句“蒙羞”保留平行回响而不造成不自然的重复。“以我遭害为乐”准确表达敌人乐见诗人遭祸。脚注内容与所锚定的词语相符。
