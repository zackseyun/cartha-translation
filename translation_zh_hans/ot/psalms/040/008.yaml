id: PSA.40.8
reference: Psalms 40:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לַֽ/עֲשֽׂוֹת רְצוֹנְ/ךָ֣ אֱלֹהַ֣/י חָפָ֑צְתִּי וְ֝/ת֥וֹרָתְ/ךָ֗ בְּ/ת֣וֹךְ מֵעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/008.yaml
  text: I delight to do your will[a], my God, and your law is within my inner being.
translation:
  language: zh_hans
  text: 我的上帝啊，我乐意遵行你的旨意；你的律法[a]在我内心深处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“教导”；希伯来语“妥拉”所指可比法律条文更广。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: 遵行
  rationale: 此处不定式与“你的旨意”搭配，表达诗人所乐意实行的事。“遵行你的旨意”在现代汉语中自然，也保留实际付诸行动的含义。
- source_word: רְצוֹנְךָ
  choice: 你的旨意
  rationale: רָצוֹן可指意愿、喜悦或恩宠；与“行”连用时，“旨意”准确表达上帝的意愿。
- source_word: אֱלֹהַי
  choice: 我的上帝啊
  rationale: 保留第一人称单数所属关系，并以“啊”自然呈现直接呼告。
- source_word: חָפָצְתִּי
  choice: 我乐意
  rationale: חפץ兼有喜爱、愿意和以之为乐的意味。“乐意”在本句中同时表达意愿与喜悦，且符合现代汉语习惯。
- source_word: וְתוֹרָתְךָ
  choice: 你的律法
  rationale: תּוֹרָה可指律法，也可广指教导。“律法”保留其在诗篇中的盟约与经文分量，脚注注明较宽泛的可能含义。
- source_word: בְּתוֹךְ מֵעָי
  choice: 在我内心深处
  rationale: מֵעַי字面指“我的内脏”，在此比喻人的内在自我、思想与情感深处。“内心深处”避免生硬的身体意象，同时没有简单缩减为单一心理官能。
theological_decisions:
- issue: 灵修语境中 תּוֹרָה 的译法
  choice: 律法
  alternative: 教导
  rationale: “律法”保留该词的盟约性和经文性分量；但希伯来词义域不限于法规，因此以脚注保存“教导”这一真实可能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“我的上帝啊”保留祷告式呼告；分号体现两分句紧密并列。“内心深处”传达希伯来语身体隐喻所指的内在生命，而不采用现代汉语中易显突兀的“内脏”。
