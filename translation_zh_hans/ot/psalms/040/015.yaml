lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: 愿……惊骇
  rationale: 该词为שׁמם的Qal未完成式第三人称复数，在此表达愿望，含荒凉、震惊或惊骇之意。“惊骇”在现代汉语中自然，也保留了因受辱而震惊败落的语气。
- source_word: עַל עֵקֶב
  choice: 因
  rationale: 这一表达字面涉及“在……的脚跟上”，在本句中表示原因或后果。“因”简洁传达其因果含义，同时以脚注保留字面意象和可能的后果义。
- source_word: בָּשְׁתָּם
  choice: 自己的羞耻
  rationale: בֹּשֶׁת表示羞耻、耻辱；“自己的羞耻”直接传达原文第三人称复数所属关系，并保留公开蒙羞的意味。
- source_word: הָאֹמְרִים לִי
  choice: 那些对我说……的人
  rationale: 定冠词加分词在此名词化，指“那些对我说的人”；此译符合现代汉语表达。
- source_word: הֶאָח הֶאָח
  choice: 哈！哈！
  rationale: 该感叹语表达幸灾乐祸或嘲弄。“哈！哈！”在现代汉语中能自然表现恶意讥笑的口吻，而非单纯表示发现。
