  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֲדֹנָ֪/י יַחֲשָׁ֫ב לִ֥/י עֶזְרָתִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה אֱ֝לֹהַ֗/י אַל תְּאַחַֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/017.yaml
  text: But I am poor and needy; the Lord thinks of me. You are my help and my deliverer; my God[a], do not delay.
translation:
  language: zh_hans
  text: 但我困苦穷乏，主却顾念我[a]。你是我的帮助，是我的拯救者。我的上帝啊，不要迟延！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主关怀我”；又或：“主必顾念我。”
    reason: 原文动词可表示想到、看重或关怀，其未完成式也可具有将来指向。
lexical_decisions:
- source_word: וַאֲנִי
  choice: 但我
  rationale: 独立代词与连接词在上下文中形成对比；“但我”自然传达转折和强调。
- source_word: עָנִי וְאֶבְיוֹן
  choice: 困苦穷乏
  rationale: 两个近义词并列，描写受压、贫乏而需要援助的处境；分别译作“困苦”和“穷乏”，保留其重叠而不完全相同的含义。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神圣称号“主”，并非四字神名יהוה；中文以“主”准确而简洁地表达。
- source_word: יַחֲשָׁב לִי
  choice: 却顾念我
  rationale: חשב与ל连用可表示想到、看顾或把某人放在心上。“顾念我”保留关系性的关切，又不强化为具体筹划；“却”显明诗句中的反差。
- source_word: עֶזְרָתִי
  choice: 我的帮助
  rationale: 原词是“帮助、援助”的名词，并非明确指“帮助者”；直译为“我的帮助”可保留诗歌的简练。
- source_word: וּמְפַלְטִי
  choice: 是我的拯救者
  rationale: פלט的分词在此作名词使用，指使诗人脱险的那一位；“拯救者”保留其施行搭救的动态含义。
- source_word: אֱלֹהַי
  choice: 我的上帝啊
  rationale: 人称后缀表示“我的上帝”，语境是直接呼告；加“啊”使现代汉语的呼语清楚自然。
- source_word: אַל תְּאַחַר
  choice: 不要迟延
  rationale: 否定祈使表达恳求上帝立即行动；“不要迟延”简洁保留原文的迫切感。
theological_decisions:
- issue: 神圣称号אֲדֹנָי的译法
  choice: 主
  alternative: 我的主
  rationale: 马所拉文本为אֲדֹנָי，不是יהוה；因此译作称号“主”，不把它处理为四字神名，也不从词形中添加原文没有的人称领属。
- issue: יַחֲשָׁב לִי的语义与时态
  choice: 主却顾念我
  alternative: 主关怀我；主必顾念我
  rationale: 未完成式在诗歌祷告中可从现在持续的顾念或将来的行动来理解，动词也可侧重思想、看重或关怀。正文采用含义宽广的“顾念”，脚注保留关怀和未来指向的可能性，避免把神学张力单一化。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。保留希伯来诗歌的简洁和平行结构；“困苦穷乏”呈现两个相近词的叠加强调，“我的帮助／我的拯救者”则保留名词性对应。
