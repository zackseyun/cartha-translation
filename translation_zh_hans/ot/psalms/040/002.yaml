source:
  edition: WLC
  text: וַ/יַּעֲלֵ֤/נִי מִ/בּ֥וֹר שָׁאוֹן֮ מִ/טִּ֪יט הַ/יָּ֫וֵ֥ן וַ/יָּ֖קֶם עַל סֶ֥לַע רַגְלַ֗/י כּוֹנֵ֥ן אֲשֻׁרָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/002.yaml
  text: He brought me up out of the pit of tumult[a], out of the miry clay; he set my feet on a rock, making my steps secure.
translation:
  language: zh_hans
  text: 他把我从喧腾的深坑[a]、从黏滑的淤泥中拉上来；他使我的双脚站在磐石上，使我的脚步稳固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喧腾的深坑”也可译作“轰鸣的深坑”或“喧嚣的深坑”；有些译本按含义解释为“毁灭的深坑”。
    reason: 说明שָׁאוֹן的词义范围，并保留这一罕见短语的歧义。
lexical_decisions:
- source_word: וַיַּעֲלֵנִי
  choice: 他把我……拉上来
  rationale: 希伯来语עלה的使役形表示“使上去、带上来”。“拉上来”在深坑的语境中自然呈现具体的营救画面。
- source_word: מִבּוֹר
  choice: 从……深坑
  rationale: בּוֹר可指坑、蓄水池或地牢般的洞穴；此处译作“深坑”，既自然，也保留诗歌中的险境意象。
- source_word: שָׁאוֹן
  choice: 喧腾的
  rationale: שָׁאוֹן主要表示响声、轰鸣或喧腾；“喧腾的深坑”保留原文不寻常的声音意象，不直接解释成“毁灭”。
- source_word: מִטִּיט הַיָּוֵן
  choice: 从黏滑的淤泥中
  rationale: טִיט指泥、泥浆，יָוֵן指泥沼或黏滑的泥泞；合译为“黏滑的淤泥”，自然地体现两词叠加的湿滑、陷落之感。
- source_word: וַיָּקֶם עַל־סֶלַע רַגְלָי
  choice: 他使我的双脚站在磐石上
  rationale: קום的使役形是“使站立、安置”；“使……站在”保留动作含义，סֶלַע译为“磐石”以表达坚固岩石的形象。
- source_word: כּוֹנֵן אֲשֻׁרָי
  choice: 使我的脚步稳固
  rationale: כון的Polel形表示使之牢固、确立；אֲשֻׁרָי指“我的脚步”。译文保留它与前句“双脚”的平行关系。
theological_decisions:
- issue: 应保留具体的营救意象，还是将隐喻抽象解释为属灵或道德上的拯救
  choice: 正文保留深坑、淤泥、双脚、磐石和脚步等具体意象
  alternative: 将整句意译为“他救我脱离毁灭，使我安稳”
  rationale: 原文以鲜明的物象表达获救和安稳，却未明说其具体处境或神学层面的对应意义；保留意象可避免替诗人消解这种开放性。
- issue: שָׁאוֹן在此是声音意象还是“毁灭”的转喻
  choice: 正文译为“喧腾”，脚注列出“轰鸣、喧嚣”以及解释性的“毁灭之坑”
  alternative: 正文直接译为“毁灭的深坑”
  rationale: 该词的直接词义指响声、轰鸣或骚动；虽可在上下文中联想到灾祸或毁灭，但不宜在正文中确定原文没有明确说出的解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“喧腾的深坑”略显陌生，是为忠实保留希伯来语独特的声音意象；以脚注帮助普通读者理解其他可能译法。正文分号对应从险境被拉出与在磐石上得稳固这两个相连的动作。
