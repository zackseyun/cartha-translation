  text: בִּשַּׂ֤רְתִּי צֶ֨דֶק בְּ/קָ֘הָ֤ל רָ֗ב הִנֵּ֣ה שְׂ֭פָתַ/י לֹ֣א אֶכְלָ֑א יְ֝הוָ֗ה אַתָּ֥ה יָדָֽעְתָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/009.yaml
  text: I have proclaimed righteousness in the great assembly[a]; behold, I have not restrained my lips; O Yahweh[b], you know.
translation:
  language: zh_hans
  text: 我在众多的会众中传扬了公义[a]；看哪，我没有闭住嘴唇[b]。耶和华啊，你知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公正”。希伯来语צֶדֶק兼有道德正直与司法公正的含义。
    reason: lexical_alternative
  - marker: b
    text: 或译“我没有抑制我的嘴唇”，即没有闭口不言。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשַּׂרְתִּי
  choice: 传扬了
  rationale: 该动词表示公开报信或宣告，常含好消息的意味；“传扬”保留了公开宣告的色彩，又不把本句限定为后来的专门宗教术语。
- source_word: צֶדֶק
  choice: 公义
  rationale: 此词兼有道德正直与司法公正的含义；“公义”适合诗篇语境，同时以脚注保留“公正”这一可能译法。
- source_word: בְּקָהָל רָב
  choice: 在大会中
  rationale: קָהָל指聚集的会众，רָב表示人数众多或规模盛大；“大会”简洁自然地传达公开、群体性的场合。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意并加强语气的诗歌性话语标记。
- source_word: שְׂפָתַי לֹא אֶכְלָא
  choice: 我没有封住双唇
  rationale: 保留“嘴唇”的具体意象，并以自然的汉语表达没有约束自己、没有闭口不言。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的专名形式，明确将四字神名作为名字而非普通称号处理。
- source_word: יָדָעְתָּ
  choice: 你知道
  rationale: 完成式在此表达上帝已经知晓并处于知道的状态；汉语现在时“你知道”最自然。
theological_decisions:
- issue: צֶדֶק兼具“公义”与“公正”的语义
  choice: 正文译作“公义”
  alternative: 公正
  rationale: 上下文可以指上帝正直、公正的作为或属性；正文不将其缩窄为纯司法概念，脚注则保留司法色彩。
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名；中文正文保留专名，并采用普通读者最熟悉的传统音译，不以“主”这一称号替代。
- issue: 诗人没有约束嘴唇的含义
  choice: 保留身体意象，译作“没有封住双唇”
  alternative: 没有闭口不言
  rationale: 原文以“嘴唇”转指发言；保留意象能呈现诗歌质感，同时不把它解释成更具体的讲论方式。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“看哪”保留原文的强调语气；“双唇”保留身体意象。“耶和华啊”以呼语呈现原文直接称呼。
