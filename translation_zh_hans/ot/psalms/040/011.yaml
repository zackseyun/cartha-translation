  text: אַתָּ֤ה יְהוָ֗ה לֹא תִכְלָ֣א רַחֲמֶ֣י/ךָ מִמֶּ֑/נִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ תָּמִ֥יד יִצְּרֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/011.yaml
  text: You[a], O Yahweh, will not withhold your compassion from me[b]; your steadfast love and your faithfulness will continually preserve me.
translation:
  language: zh_hans
  text: 雅威啊，你必不向我止住你的怜悯[b]；你的慈爱和信实[a]必常常守护我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“真实”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“求你不要向我止住你的怜悯。”这里的动词也可理解为带祈愿意味的请求，而不是表达确信的陈述。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留经文直接使用上帝立约之名的特点。
- source_word: תִכְלָא
  choice: 必不……收回
  rationale: כלא在此表示扣留、抑制或不予施与；“收回”与“怜悯”搭配自然，并将未完成式理解为祷告中的确信。命令式语气仍有可能，故以脚注保留。
- source_word: רַחֲמֶיךָ
  choice: 你的怜悯
  rationale: 该复数名词在此概括上帝深切、慈悲的怜悯；汉语用集合性单数表达最自然。
- source_word: מִמֶּנִּי
  choice: 向我
  rationale: 与“收回”组合为自然汉语，表达“不使我得着／不向我施予”的关系，而不机械直译为“从我”。
- source_word: חַסְדְּךָ
  choice: 你的慈爱
  rationale: “慈爱”兼顾恩慈、忠贞和立约关系中的坚定委身，是现代中文圣经语体中自然且凝练的表达。
- source_word: אֲמִתְּךָ
  choice: 信实
  rationale: אמת与חסד并列并作为守护诗人的主体，在此侧重上帝可靠、忠诚的品格；“真实”仍是可行译法，收入脚注。
- source_word: תָּמִיד
  choice: 常常
  rationale: 表达持续不断的守护，现代汉语自然易懂。
- source_word: יִצְּרוּנִי
  choice: 必……守护我
  rationale: נצר表示看守、护卫、保全；“守护”保留其主动保护色彩，复数动词所对应的并列主语在汉语中无需形态标示。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保存其专名性质，而不以称号“主”代替。
- issue: תִכְלָא的陈述或祈求语气
  choice: 陈述确信：“你必不……收回”
  alternative: 祈求：“求你不要……收回”
  rationale: 该形式是第二人称阳性单数未完成式，可自然表达诗人在祷告中的确信；但上下文也容许将其理解为带祈愿意味的请求，因此不在正文中消除这一张力，以脚注注明。
- issue: אמת在חסד ואמת组合中的含义
  choice: 信实
  alternative: 真实
  rationale: 在此并列结构中，两者被描述为持续守护诗人的上帝属性，“信实”较能体现可靠与忠贞；“真实”作为词义上的可能性予以保留。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“雅威啊”保留呼告语气；“慈爱和信实”“守护我”兼具诗歌凝练感与普通读者可理解性。脚注标记分别紧随其所说明的“信实”和前半句动词结构。
