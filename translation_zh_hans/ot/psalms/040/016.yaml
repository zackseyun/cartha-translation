source:
  edition: WLC
  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה אֹֽ֝הֲבֵ֗י תְּשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/016.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May Yahweh be magnified!”
translation:
  language: zh_hans
  text: 愿所有寻求你的人都因你欢喜快乐；愿爱慕你救恩[a]的人常常说：“愿雅威显为大！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救恩”也可译作“拯救”。希伯来语 תְּשׁוּעָה 既可指具体的解救，也可指较广义的救恩。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“愿雅威为大”。这是颂赞的呼声，表达愿雅威的伟大得到公开承认。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: 愿……欢喜快乐
  rationale: 两个未完成式在祈愿语境中表达愿望；“欢喜快乐”既保留同义并列的诗歌节奏，也符合现代汉语表达。
- source_word: בְּךָ
  choice: 因你
  rationale: 介词 בְּ 可表示喜乐的对象、范围或缘由。“因你”自然地表达以上帝为喜乐之源，同时不把含义收窄为单纯的外在原因。
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: 所有寻求你的人
  rationale: 将实词化分词译为持续以寻求上帝为特征的人，准确且通顺。
- source_word: אֹהֲבֵי תְּשׁוּעָתֶךָ
  choice: 爱慕你救恩的人
  rationale: “爱慕”比一般的“爱”更适合诗歌和敬拜语境；תְּשׁוּעָה 译为“救恩”，同时以脚注保留“拯救”的具体语义。
- source_word: יֹאמְרוּ תָמִיד
  choice: 不断地说
  rationale: 表达未完成式与 תָמִיד 所体现的反复、持续行动，且比“常常说”更明确。
- source_word: יִגְדַּל יְהוָה
  choice: 愿雅威被尊为大
  rationale: 将 יִגְדַּל 视为祈愿式，保留这句话作为颂赞呼声的愿望语气；“被尊为大”表达愿上帝的伟大得到公开承认，而不是暗示上帝本身有所增长。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中通行的音译呈现四字神名，区别于作为称号的“主”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，不以称号代替，也避免沿用较不贴近现今学界重构读音的“耶和华”。
- issue: תְּשׁוּעָה 的语义范围
  choice: 救恩
  alternative: 拯救；救助
  rationale: “救恩”适合敬拜语境，并能容纳具体解救与较广的救赎含义；脚注注明“拯救”，保留原词的具体性。
- issue: יִגְדַּל 的祈愿含义
  choice: 愿雅威被尊为大
  alternative: 雅威是伟大的；愿雅威显为尊大
  rationale: 上下文中的未完成式具有祈愿色彩，因此不改成单纯陈述；此译法把重点放在众人公开承认雅威的伟大，而非暗示他的本体增大。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“欢喜快乐”保留原文两个近义动词的并列；两个“愿”清楚呈现本节的祈愿结构。神名用“雅威”，救赎术语用“救恩”并以脚注保留具体“拯救”的可能性。
