  text: קַוֺּ֣ה קִוִּ֣יתִי יְהוָ֑ה וַ/יֵּ֥ט אֵ֝לַ֗/י וַ/יִּשְׁמַ֥ע שַׁוְעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/001.yaml
  text: I waited patiently for Yahweh[a], and he turned to me and heard my cry for help.
translation:
  language: zh_hans
  text: 我切切等候雅威[a]；他转向我，听见了我求救的呼声。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“等候，我等候雅威”，用重复结构加强语气；也可理解为“我耐心等候”或“我满怀期待地等候”。
    reason: 说明原文强调结构及其可能的语义幅度。
lexical_decisions:
- source_word: קַוֺּה קִוִּיתִי
  choice: 我切切等候
  rationale: 原文以同词根的不定式绝对式配合限定动词，加强“等候”的语气。“切切等候”在现代汉语中自然、庄重，既表达持续和专注，也不把原文可能包含的盼望意味缩减为单纯忍耐。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留原文所用的专名，而不以称号代替。
- source_word: וַיֵּט אֵלַי
  choice: 他转向我
  rationale: נטה 在此表示朝向或俯就说话者；“转向我”清楚自然，并保留雅威关注诗人的关系性动作。
- source_word: וַיִּשְׁמַע
  choice: 听见了
  rationale: שׁמע 在求告语境中含有留意、垂听之意；“听见了”忠实呈现基本动词，同时由上下文传达回应性的含义。
- source_word: שַׁוְעָתִי
  choice: 我求救的呼声
  rationale: שַׁוְעָה 特指困苦中为求援助而发出的呼喊；“求救的呼声”比单说“呼声”更准确。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之神专名的性质，不以称号替换；“耶和华”是传统汉译形式，但“雅威”更贴近学界通常采用的重构读音。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“切切等候”保留诗歌语气和原文的强调；分号体现等候与雅威回应之间的推进关系。
