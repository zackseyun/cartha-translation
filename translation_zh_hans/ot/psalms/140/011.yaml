  naturalness: “口舌之徒”和“追猎”有适当的诗体色彩，但“毁谤人的人”表达重复而不自然；改为“诽谤者”更合乎现代汉语。“在这地上不得立足”比“必不能在这地立稳”更自然，同时仍传达不得安稳存立的意思。
