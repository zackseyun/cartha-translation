base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/011.yaml
  text: A man of tongue will not be established in the land[c][b][a]; evil will hunt down a man of violence to thrustings.
translation:
  language: zh_hans
  text: '口舌之徒[a]必不得在这地上立足；祸患[c]必追猎强暴之人，使他屡遭击打[b]。


    [a] “口舌之徒”也可译作“诽谤者”。


    [b] 句末也可译作“愿反复的推击追捕他”；希伯来文含义难以确定。


    [c] 也可按另一种有争议的句法理解为：“邪恶的强暴之徒——愿它追捕他。”即把“邪恶”与“强暴之人”相连，并把动词理解为祈愿语气。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “口舌之徒”也可译作“诽谤者”。
    reason: lexical_alternative
  - marker: b
    text: 句末也可译作“愿反复的推击追捕他”；希伯来文含义难以确定。
    reason: lexical_alternative
  - marker: c
    text: 也可按另一种有争议的句法理解为：“邪恶的强暴之徒——愿它追捕他。”即把“邪恶”与“强暴之人”相连，并把动词理解为祈愿语气。
    reason: previous_rendering
lexical_decisions:
- source_word: אִישׁ לָשׁוֹן
  choice: 口舌之徒
  rationale: 直译为“舌头之人”。“口舌之徒”保留希伯来文鲜明而简洁的意象，同时在现代汉语中可理解为以言语伤人的人；脚注列出“毁谤人的人”这一较明确的解释。
- source_word: בַּל יִכּוֹן
  choice: 必不能……立稳
  rationale: בַּל 是诗歌体否定词，יִכּוֹן 为 כון 的尼法勒未完成式，表示被建立、站稳或安定；“必不能立稳”兼顾否定的预期语气和处境上的稳固。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: אֶרֶץ 可指土地、国土或大地。本诗关注人在社会共同体中的存立，“在这地”保留其范围上的含混，也比宇宙性的“在地球上”自然。
- source_word: אִישׁ חָמָס
  choice: 强暴的人
  rationale: 直译为“强暴之人”，既可包括暴力，也可涵盖欺压和不法伤害；“强暴的人”自然且未将含义收窄为单一行为。
- source_word: רָע
  choice: 祸患
  rationale: 将 רָע 作为 יְצוּדֶנּוּ 的主语，按名词化用法译为“祸患”，保留恶事反过来追猎作恶者的拟人意象；此词也可理解为“邪恶”。
- source_word: יְצוּדֶנּוּ
  choice: 必追猎……
  rationale: צוד 表示猎取、追捕或设法捕获。未完成式在此可作预言式陈述；“必追猎”与前半节“必不能”平行，并保留狩猎意象。
- source_word: לְמַדְחֵפֹת
  choice: 接连把他推倒
  rationale: 这是罕见的复数名词，词根意象为推、撞或驱赶。译文用“接连”体现复数或反复动作，用“推倒”表达其结果；脚注保留另一种句法分析并注明原文困难。
theological_decisions:
- issue: רָע 在后半句中的句法身份
  choice: 把“祸患”作为“追猎”的主语
  alternative: 把 רָע 当作形容词，构成“邪恶的强暴之徒”，并把动词理解为祈愿句
  rationale: 马所拉文本的词序允许把 אִישׁ חָמָס 视为提前的话题，而以 רָע 为动词主语；这也形成“祸患追猎强暴者”的有力拟人表达。不过原文句法并非毫无歧义，因此在脚注中保留另一读法。
- issue: יִכּוֹן 与 יְצוּדֶנּוּ 的语气
  choice: 译作带确定意味的将来陈述“必不能……；必……”
  alternative: 把后半句译成祈愿语气“愿……追捕他”
  rationale: 上下两分句可自然读为对恶人结局的断言；希伯来诗歌中的未完成式也容许祈愿理解，相关可能性由脚注保留，避免把神学语气绝对化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“口舌之徒”“立稳”“追猎”保留诗体的凝练和原文意象；对后半句罕见词及句法歧义不在正文中展开，而用脚注明确保存。
