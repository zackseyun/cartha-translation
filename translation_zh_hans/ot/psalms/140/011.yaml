  to: '口舌之徒[a]必不得在这地上立足；祸患[c]必追猎强暴之人，使他屡遭击打[b]。


    [a] “口舌之徒”也可译作“诽谤者”。


    [b] 句末也可译作“愿反复的推击追捕他”；希伯来文含义难以确定。


    [c] 也可按另一种有争议的句法理解为：“邪恶的强暴之徒——愿它追捕他。”即把“邪恶”与“强暴之人”相连，并把动词理解为祈愿语气。'
  rationale: 修订保持正文采用“祸患／恶追猎强暴之人”的拟人化读法，不将 רָע 误作“强暴之人”的普通修饰语。将末语译为“使他屡遭击打”，保留复数和推击意象，但不武断地断言为“推倒”。同时改善现代汉语表达，并以脚注明确保留有争议的替代句法。
