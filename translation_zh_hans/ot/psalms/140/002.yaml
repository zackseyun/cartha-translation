lexical_decisions:
- source_word: אֲשֶׁר
  choice: 他们
  rationale: 承接上一节所说的恶人和强暴之人；汉语以代词继续描述，比直译关系词更自然。
- source_word: חָשְׁבוּ
  choice: 图谋
  rationale: 表达有意策划、筹谋的含义，不只是一般的思想活动，并保留恶意谋划的语气。
- source_word: רָעוֹת
  choice: 恶事
  rationale: 概括复数所指的邪恶、有害之事；现代汉语自然简洁。
- source_word: בְּלֵב
  choice: 心里
  rationale: 保留希伯来语“心”的人观用语，同时符合现代汉语表达。
- source_word: כָּל יוֹם
  choice: 终日
  rationale: 传达持续不断的时间意味，并保持诗歌语言的凝练庄重。
- source_word: יָגוּרוּ
  choice: 挑起
  rationale: 该动词在此语境中含义困难；结合宾语“争战”及上半句的恶意谋划，主文采用煽动、引发冲突之义，同时以脚注保留其他可能。
- source_word: מִלְחָמוֹת
  choice: 争战
  rationale: 保留战争、战斗的强烈意味；“争战”也可涵盖诗歌语境中的多次敌对冲突。
