  text: שָׁמְרֵ֤/נִי יְהוָ֨ה מִ֘/ידֵ֤י רָשָׁ֗ע מֵ/אִ֣ישׁ חֲמָסִ֣ים תִּנְצְרֵ֑/נִי אֲשֶׁ֥ר חָ֝שְׁב֗וּ לִ/דְח֥וֹת פְּעָמָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/004.yaml
  text: Keep me[a], O Yahweh, from the hands of the wicked; guard me from the violent man[b], who has planned to trip up my feet.
translation:
  language: zh_hans
  text: 雅威啊，求你保守我脱离恶人的手；求你守护我脱离暴虐之人[a]，他们图谋使我失足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶人”和“暴虐之人”在希伯来语中都是单数形式，但下句“图谋”是复数形式。这些单数可以指某一个人，也可以泛指或代表一群人。
    reason: 保留原文单复数之间的张力，避免擅自确定为单个敌人或一群敌人。
  - marker: b
    text: 也可译作“要使我的脚步受挫”或“要使我的脚步偏离”。这里可描写使人跌倒，也可比喻阻挠人的行事或道路。
    reason: 说明דחה与פְּעָמַי所含的具体意象及可能的比喻意义，同时避免将有争议的细微语义定为唯一解释。
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: 求你保护我
  rationale: שׁמר在此为祈求保护的命令式；“求你保护我”符合现代汉语祷告语体，也保留恳求意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现上帝的专名，而不以“主”这一称号替代。
- source_word: מִידֵי רָשָׁע
  choice: 脱离恶人的手
  rationale: 保留希伯来语“手”所表达的权势、控制或伤害能力；“恶人”在汉语中可指个体，也可作类称。
- source_word: מֵאִישׁ חֲמָסִים
  choice: 脱离强暴之人
  rationale: אִישׁ为单数，חֲמָסִים在这里表达强暴的性质或强烈程度；“强暴之人”既贴近结构，又庄重自然。
- source_word: תִּנְצְרֵנִי
  choice: 求你守护我
  rationale: נצר与前句שׁמר构成同义平行；“守护”既保留保护含义，也避免完全重复。
- source_word: חָשְׁבוּ
  choice: 他们图谋
  rationale: חשב在敌意语境中指谋划、筹算；动词为复数，因此用“他们”明确反映原文数的一致关系及其张力。
- source_word: לִדְחוֹת פְּעָמָי
  choice: 要使我失足
  rationale: דחה有推开、推倒之意，פְּעָמַי可指脚或脚步；合起来描绘使诗人跌倒。“使我失足”在现代汉语中自然，并保留具体与比喻双重含义。
theological_decisions:
- issue: 如何译写神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用接近YHWH传统读音重构的汉语音译，以保留经文中的专名；不把专名改成称号，也不据此加入宗派性解释。
- issue: 敌对者的单复数张力
  choice: “恶人／强暴之人”保留单数或类称表达，随后按复数动词译为“他们图谋”
  alternative: 全译为单数：“他图谋”；或全译为复数：“恶人们／强暴的人们”
  rationale: 原文רָשָׁע和אִישׁ在形态上为单数，而חָשְׁבוּ为复数。正文不强行统一，脚注说明单数可有个体、代表性或集合性理解。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“保护／守护”呈现希伯来诗歌的同义平行；分号保留三小句的推进关系。神名用“雅威”，敌对者的数不作过度统一，并借脚注交代语法张力。
