  text: אַ֣ךְ צַ֭דִּיקִים יוֹד֣וּ לִ/שְׁמֶ֑/ךָ יֵשְׁב֥וּ יְ֝שָׁרִ֗ים אֶת פָּנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/013.yaml
  text: Surely the righteous will give thanks to your name[a]; the upright will dwell before your face.
translation:
  language: zh_hans
  text: 义人必称谢你的名；正直人必居住在你面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正直人必坐在你面前。”希伯来语直译为“在你的面前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 必
  rationale: 此处作强调、确认结论的语气词；用“必”自然表达诗人确信之意，并与后续两个未完成式所表达的确定前景相呼应。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词名词化，指行义的人；“义人”是现代中文圣经语体中自然、庄重且准确的表达。
- source_word: יוֹדוּ
  choice: 称谢
  rationale: ידה 的使役式在诗篇语境中常指向上帝献上感谢或赞美；“称谢”兼具感谢和颂赞意味。
- source_word: לִשְׁמֶךָ
  choice: 你的名
  rationale: 与“称谢”组成自然中文搭配；虽未逐字译出介词 ל，但仍清楚表达称谢所指向的是上帝的名。
- source_word: יֵשְׁבוּ
  choice: 必住
  rationale: ישׁב 可指坐、居住或停留；此处与“在你面前”连用，表达安稳、持续地居于上帝面前，“住”比单纯姿态性的“坐”更合语境。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 复数形容词名词化，强调品格正直的人；译法简洁并保留其伦理含义。
- source_word: אֶת פָּנֶיךָ
  choice: 在你面前
  rationale: 保留希伯来文“你的面”的具体意象，同时采用现代中文自然的空间表达；也可按其功能理解为“在你面光之中／在你面前蒙悦纳”。
theological_decisions:
- issue: 上帝“面”的拟人性临在意象
  choice: 在你面前
  alternative: 在你面光之中；在你面前蒙悦纳
  rationale: 原文保留“面”的具体诗歌意象，表达亲近上帝、处于其临在之中的状态。正文不将其简化为抽象的“同在”，也不额外判定这句话专指敬拜、蒙悦纳或永恒居所。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。两个分句以“义人／正直人”平行，以“必”传达 אַךְ 所引出的坚定确信；保留“面前”的希伯来诗歌意象，并以脚注提示 ישׁב 的字面义及可能语感。
