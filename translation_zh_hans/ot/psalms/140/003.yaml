  text: They sharpen their tongue like a snake[a]; the venom of a viper is under their lips[b]. Selah
translation:
  language: zh_hans
  text: 他们磨利舌头，如蛇一般；毒蛇[a]的毒液在他们嘴唇底下。细拉[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蝮蛇”或“虺蛇”；希伯来语指一种毒蛇，但确切蛇种无法确定。
    reason: lexical_alternative
  - marker: b
    text: “细拉”可能是礼仪或音乐上的标记，确切含义无法确定。
    reason: cultural_note
lexical_decisions:
- source_word: שָׁנֲנוּ
  choice: 磨利
  rationale: 该词在此意为磨快、使锋利；“磨利舌头”保留原文把恶毒言语比作利器的诗歌意象。
- source_word: לְשׁוֹנָם
  choice: 舌头
  rationale: 原文用单数名词并带第三人称复数所属后缀；中文“他们磨利舌头”自然地保留其集合性单数表达。
- source_word: כְּמוֹ נָחָשׁ
  choice: 如蛇一般
  rationale: נָחָשׁ是泛指的蛇；此译简明自然，不额外引入特定蛇种或其他象征含义。
- source_word: חֲמַת
  choice: 毒液
  rationale: 该词虽可表示烈怒，但与毒蛇连用时指毒液；如此翻译符合上下文，并保留致命言语的比喻。
- source_word: עַכְשׁוּב
  choice: 毒蛇
  rationale: 该词所指的确切蛇种无法确定，但显然是有毒的蛇；“毒蛇”既清楚又避免作出证据不足的物种判定。
- source_word: תַּחַת שְׂפָתֵימוֹ
  choice: 藏在他们嘴唇底下
  rationale: תַּחַת意为“在……下面”。补入“藏”使中文诗句自然，并传达原文中毒物潜伏于唇下、随时可借言语伤人的意象。
- source_word: סֶלָה
  choice: 细拉
  rationale: 此词的确切含义不明，可能是礼仪或音乐标记；采用中文圣经传统音译，不贸然解释。
