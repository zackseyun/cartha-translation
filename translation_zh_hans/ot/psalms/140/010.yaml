  text: ימיטו עֲלֵי/הֶ֗ם גֶּֽחָ֫לִ֥ים בָּ/אֵ֥שׁ יַפִּלֵ֑/ם בְּ֝/מַהֲמֹר֗וֹת בַּֽל יָקֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/010.yaml
  text: Let burning coals fall on them[a]; let him cast them into the fire, into deep pits[b], never to rise again.
translation:
  language: zh_hans
  text: 愿炭火降在他们身上[a]；愿他把他们抛入火中，抛入深坑[b]，使他们永不能再起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿炭火如雨降在他们身上。”希伯来文动词可表示使某物落下或如雨降下。
    reason: lexical_alternative
  - marker: b
    text: 或译：“深渊”或“水的深处”。这里的希伯来词十分罕见，确切含义不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: ימיטו
  choice: 愿……降
  rationale: 此处是使役词干未完成式，结合咒诅祈愿的语境，表达“使……落下、降下”的愿望。“愿……降”在现代汉语中自然，也不明确添加希伯来文没有明说的施事者。
- source_word: גחלים
  choice: 炭火
  rationale: 该名词指煤炭、余烬；上下文紧接“火中”，用“炭火”既保留具体意象，也自然传达燃烧着的炭。
- source_word: בָּאֵשׁ
  choice: 入火中
  rationale: 与使役动词“使他们落下”连用时，介词短语在语境中具有方向性；译为“入火中”符合现代汉语表达。
- source_word: יַפִּלֵם
  choice: 愿他把他们抛入
  rationale: 这是 נפל 的使役词干、第三人称阳性单数形式，带第三人称复数宾语后缀。译文保留单数主语“他”，但不擅自明确为“上帝”。“抛入”传达使其坠落的使役含义。
- source_word: בְּמַהֲמֹרוֹת
  choice: 投入深坑
  rationale: מהמרות 是罕见且含义不完全确定的词。传统理解及坠落、毁灭的语境支持“深坑”；在汉语中补出与前句平行的“投入”，使句法顺畅。
- source_word: בַּל יָקוּמוּ
  choice: 使他们永不能再起来
  rationale: בל 表示强烈否定，קום 表示起来、站起。受抛下和深坑的意象制约，“永不能再起来”自然传达其最终性。
theological_decisions:
- issue: 咒诅祈愿及单数动词的隐含主语
  choice: 保留向审判者发出的祈愿，并将单数动词译作“愿他……”，不明确补出“上帝”。
  alternative: 可将后半句译成被动式“愿他们被抛入……”，或明确译为“愿上帝把他们抛入……”。
  rationale: 希伯来文由复数形式转为单数形式，单数施事者很可能隐指上帝，但经文本身没有明说。保留“他”既反映原文数的变化，也避免消除其含蓄性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“炭火”“抛入”“深坑”保持诗歌中连续的审判与坠落意象；分号呈现两个祈愿分句，“使他们永不能再起来”清楚表达末句的结果或目的。
