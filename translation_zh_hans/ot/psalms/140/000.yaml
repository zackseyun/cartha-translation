lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题注中通常指负责或督导圣乐演奏的人；“乐长”简洁、庄重，也比仅指合唱的称谓更能涵盖音乐表演。前缀 לַ־ 按题注用法译为“交给”。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇题注中的常见体裁名称，通常指配乐吟唱的诗歌；中文圣经语境以“诗”表达自然准确。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ־ 在题注中可表达作者、归属、关联或献予；“大卫的”保留这种关系上的开放性，不强行限定为“大卫所作”或“献给大卫”。
theological_decisions:
- issue: 题注中诗篇与大卫的关系
  choice: 大卫的
  alternative: 大卫所作；献给大卫
  rationale: 希伯来文 לְדָוִד 本身未必只表示严格的作者身份；采用“大卫的”既保留传统表达，也避免加入原文未明确规定的历史判断。
translation_notes:
  register: 采用现代、简洁而庄重的诗篇题注体。“交给乐长”保留原文的交付或指向意味；脚注标记紧接“大卫的诗”，准确对应 לְדָוִד 的歧义。
