  text: אָמַ֣רְתִּי לַ֭/יהוָה אֵ֣לִ/י אָ֑תָּה הַאֲזִ֥ינָ/ה יְ֝הוָ֗ה ק֣וֹל תַּחֲנוּנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/006.yaml
  text: I say to the LORD, “You are my God.” O LORD, listen to the voice of my pleas.
translation:
  language: zh_hans
  text: 我对耶和华说：“你是我的上帝。”耶和华啊，求你垂听我恳求的声音。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: 我……说
  rationale: 希伯来语完成式在诗歌语境中可表达已经作出的宣告，也可呈现当前持守的立场；汉语用“我对……说”自然保留时态上的一定开放性。
- source_word: לַיהוָה / יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的传统形式呈现神的专名，在两处保持一致。
- source_word: אֵלִי
  choice: 我的上帝
  rationale: 准确表达带第一人称单数后缀的“我的神”，并采用现代普通话中清楚、庄重的称谓。
- source_word: הַאֲזִינָה
  choice: 求你垂听
  rationale: 该祈使式表示恳切请求聆听；“求你垂听”兼顾祷告语气与庄重文体。
- source_word: קוֹל תַּחֲנוּנָי
  choice: 我恳求的声音
  rationale: 较贴近原文“我的恳求之声”，同时调整为自然的现代汉语表达；保留“声音”这一具体意象。
theological_decisions:
- issue: 神的专名如何呈现
  choice: 耶和华
  alternative: 上主／雅威
  rationale: 原文明确使用四字神名；“耶和华”既区别于通称“上帝”，又是简体中文读者广泛熟悉的传统译法。
- issue: אָמַרְתִּי的时间指向
  choice: 我对耶和华说
  alternative: 我曾对耶和华说／我要对耶和华说
  rationale: 不加入“曾”或“要”，以免过度限定原文完成式在诗歌中的时间和体貌含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。前句为信仰宣告，后句为直接呼求；保留原文两次神名及“恳求的声音”这一诗性表达。
