source:
  edition: WLC
  text: רֹ֥אשׁ מְסִבָּ֑/י עֲמַ֖ל שְׂפָתֵ֣י/מוֹ יכסו/מו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/009.yaml
  text: As for the head of those who surround me[b][a], let the trouble of their lips cover them.
translation:
  language: zh_hans
  text: 至于围住我的人的头[a]，愿他们嘴唇所生的祸患[b]遮盖他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿围住我的人的头被他们嘴唇所生的祸患遮盖。”希伯来文十分紧缩；“头”可能是集合性单数，也有人按复数意义理解。
    reason: alternative_reading
  - marker: b
    text: “祸患”也可译作“恶事”或“伤害”，指他们的言语所产生的恶果。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: 头
  rationale: 保留原文单数名词“头”的具体意象，不径自解释为“首领”或改成复数；其集合性或省略式用法另以脚注说明。
- source_word: מְסִבָּי
  choice: 围住我的人
  rationale: 该词源于סבב，带第一人称单数后缀，指围在诗人四周的人；“围住”在现代汉语中自然，也符合上下文中的敌对意味，而不额外限定为军事围攻。
- source_word: עֲמַל
  choice: 祸患
  rationale: 此词可指劳苦、患难、恶事或所造成的伤害；与“嘴唇”连用时，“祸患”既能表达言语产生的恶果，又保留其较宽的语义范围。
- source_word: שְׂפָתֵימוֹ
  choice: 他们嘴唇
  rationale: 按原文保留“嘴唇”这一身体部位意象，不抽象化为“言语”；“所生的”使其与“祸患”的构造关系在汉语中清楚自然。
- source_word: יכסומו
  choice: 愿……遮盖他们
  rationale: כסה的基本义为“遮盖”；结合本诗祈求惩治仇敌的语境，将未完成式译为祈愿语气“愿”，并保留复数受词“他们”。
theological_decisions:
- issue: 紧缩句法与咒诅祈愿语气
  choice: 把本节译作祈愿：“至于围住我的人的头，愿……遮盖他们。”
  alternative: 也可把“头”理解为集合用法或按复数意义表达：“愿围住我的人的头被他们嘴唇所生的祸患遮盖”；动词也可理解为陈述将来：“……必遮盖他们。”
  rationale: 希伯来文句式紧缩，单数“头”、单数性质的“祸患”与复数受词之间存在张力。上下文是向上帝祈求审判，因此祈愿语气较合适；正文仍保留单数“头”，不消除原文的歧义。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。“至于”标示原文前置主题；保留“头”“嘴唇”“遮盖”等具体诗歌意象。正文不将“头”解释成“首领”，并用脚注呈现原文紧缩句法所容许的另一种理解。
