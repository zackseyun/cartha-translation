  text: חַלְּצֵ֣/נִי יְ֭הוָה מֵ/אָדָ֣ם רָ֑ע מֵ/אִ֖ישׁ חֲמָסִ֣ים תִּנְצְרֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/001.yaml
  text: Rescue me[a], O Yahweh, from the evil man; guard me from the violent man.
translation:
  language: zh_hans
  text: 耶和华啊，求你救我脱离恶人；保护我脱离凶暴的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַלְּצֵנִי
  choice: 求你救我脱离
  rationale: 该词是 חלץ 的使役式命令形，带第一人称单数后缀，表示把人从危险中救出。“求你救我脱离”自然表达诗人的紧急恳求，并与后面的介词短语衔接。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是以色列上帝的专名四字神名。现代中文圣经语境中“耶和华”是普通读者最熟悉且明确作为专名的译法。
- source_word: מֵאָדָם רָע
  choice: 脱离恶人
  rationale: אָדָם 在此与下半句的 אִישׁ 平行，指敌对作恶者，而非泛指全人类。中文“恶人”简洁保留了单数类称和诗歌平行。
- source_word: מֵאִישׁ חֲמָסִים
  choice: 脱离强暴的人
  rationale: חֲמָסִים 是表示强暴、暴行的强化或抽象复数；“强暴的人”既保留“人＋强暴”这一语义关系，也比生硬的“强暴之人”更符合现代汉语。
- source_word: תִּנְצְרֵנִי
  choice: 保护我
  rationale: נצר 表示守护、保全。“保护我”与前句“救我”有所区分，传达持续看守、免受伤害之意。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应译作专名而非以“主”代替。“耶和华”在现代中文基督教及一般读者中辨识度最高；“雅威”更接近常见学术拟音，但中文传统接受度较低。
- issue: אָדָם 与 אִישׁ 的性别和数
  choice: 恶人／强暴的人
  alternative: 邪恶者／暴力之徒
  rationale: 原文两处均为阳性单数，并以诗歌平行描写敌对者。中文“人”本身不强制标明生理性别，既不额外扩大为全人类，也不武断断定特定男性；单数可作为类称理解。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。以“耶和华啊，求你……”自然呈现希伯来语呼告和命令式恳求；两分句保持平行，同时用“救……脱离”和“保护……脱离”区分两个动词。
