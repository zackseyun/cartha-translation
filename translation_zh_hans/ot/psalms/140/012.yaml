  text: ידעת כִּֽי יַעֲשֶׂ֣ה יְ֭הוָה דִּ֣ין עָנִ֑י מִ֝שְׁפַּ֗ט אֶבְיֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/012.yaml
  text: I know that Yahweh will uphold the cause of the afflicted[b][a], and justice for the needy.
translation:
  language: zh_hans
  text: 我知道，雅威必为困苦人伸冤[a]，为穷乏人主持公道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我知道”也可理解为“我已经知道”。按马所拉元音，希伯来语形式通常意为“你知道”；这里传统上多理解为诗人的宣告：“我知道。”
    reason: textual_variant
lexical_decisions:
- source_word: ידעת
  choice: 我知道
  rationale: 马所拉文本的元音形式在形态上通常读作第二人称阳性单数完成式“你知道”，但本节传统上多按诗人的自白理解为“我知道”；正文采用符合结尾宣信语境的读法，并以脚注保留形态上的歧义。
- source_word: כִּי
  choice: （引出宾语从句，不另译）
  rationale: 这里引出“知道”的内容；现代汉语用逗号直接承接比硬译为“即”或“因为”自然。
- source_word: יַעֲשֶׂה … דִּין
  choice: 必为……伸冤
  rationale: 字面为“施行……的案件/申诉”，在司法语境中表示维护受苦者的诉求、为其讨回公道；“伸冤”简洁地保留这一法庭意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代。
- source_word: עָנִי
  choice: 困苦人
  rationale: 该词可指贫穷、受苦或受压迫的人；本诗涉及暴力压迫，“困苦人”兼顾苦难与弱势处境。
- source_word: מִשְׁפַּט
  choice: 公道
  rationale: 此处与前半句“伸冤”平行，指穷乏人应得的司法正义；“主持公道”是自然且庄重的现代汉语表达。
- source_word: אֶבְיוֹנִים
  choice: 穷乏人
  rationale: 该复数名词指贫困而有需要的人；“穷乏人”既保留经济匮乏含义，也适合诗体语域。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；正文采用音译“雅威”，保留其作为专名的性质。
- issue: ידעת 的人称与时态理解
  choice: 我知道
  alternative: 你知道；我已经知道
  rationale: 辅音文字可容许不同理解，而马所拉元音所示形态通常为“你知道”。不过在诗篇结尾的语境中，传统和多数译法将其理解为诗人的确信宣告。正文采用“我知道”，脚注明确保存文本歧义，不将其掩盖。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“伸冤”与“主持公道”保留两组司法用语的平行关系，同时避免生硬直译“施行案件”。唯一脚注标记已置于正文相关短语之后。
