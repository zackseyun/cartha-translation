  text: טָֽמְנֽוּ גֵאִ֨ים פַּ֡ח לִ֗/י וַ/חֲבָלִ֗ים פָּ֣רְשׂוּ רֶ֭שֶׁת לְ/יַד מַעְגָּ֑ל מֹקְשִׁ֖ים שָֽׁתוּ לִ֣/י סֶֽלָה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/005.yaml
  text: The proud have hidden a trap for me[a], and with cords they have spread a net beside the path; they have set snares for me[c][b]. Selah
translation:
  language: zh_hans
  text: 狂傲的人[a]为我暗设陷阱，又用绳索在路旁[b]张开罗网；他们又为我设下圈套。细拉[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“骄傲的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“在小径旁”或“在行路的轨迹旁”。
    reason: lexical_alternative
  - marker: c
    text: “细拉”可能是礼仪或音乐方面的标记，确切含义不明。
    reason: cultural_note
lexical_decisions:
- source_word: טָמְנוּ
  choice: 暗暗……设下
  rationale: 该动词表示隐藏、藏匿；在捕捉意象中译作“暗暗……设下”，自然地表达陷阱被隐蔽安放。
- source_word: גֵאִים
  choice: 骄傲的人
  rationale: 指骄傲、狂妄之人；“骄傲的人”简明自然，也不额外加入原文未明确表达的性别。
- source_word: פַּח
  choice: 陷阱
  rationale: 指捕捉猎物的网罗或机关；译作“陷阱”可与后文“圈套”略作区分，同时保留捕猎意象。
- source_word: וַחֲבָלִים
  choice: 又用绳索
  rationale: חֲבָלִים 的基本意义是绳索；结合下文张网的动作，以工具性短语“用绳索”表达最符合汉语习惯。
- source_word: פָּרְשׂוּ רֶשֶׁת
  choice: 张开罗网
  rationale: 该搭配意为铺开或张开网；“张开罗网”既自然，也保留具体的捕捉画面。
- source_word: לְיַד מַעְגָּל
  choice: 在路旁
  rationale: לְיַד 表示“在……旁边”，מַעְגָּל 指道路、路径或行走的轨迹；“在路旁”准确而通顺。
- source_word: מֹקְשִׁים
  choice: 圈套
  rationale: 指诱捕用的套索或陷阱；译作“圈套”既延续捕猎意象，又避免与前面的“陷阱”机械重复。
- source_word: שָׁתוּ
  choice: 安设
  rationale: 该动词表示放置、设置；“安设”与“圈套”搭配自然，并带有蓄意布置之意。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切含义不明，可能是礼仪或音乐术语；采用传统音译，避免作无根据的解释性翻译。
theological_decisions: []
