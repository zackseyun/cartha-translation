  rationale: 修订仅改善现代汉语的搭配和末句的语义范围：“成全恶人的心愿”自然表达原文所求不要应允恶人欲望；“得以高举”避免“高升”的职业晋升含义，同时保留原文末句复数及“升高／被高举”的意象。脚注锚点及其所说明的文本歧义均予保留。
