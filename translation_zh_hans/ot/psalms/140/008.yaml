source:
  edition: WLC
  text: אַל תִּתֵּ֣ן יְ֭הוָה מַאֲוַיֵּ֣י רָשָׁ֑ע זְמָמ֥/וֹ אַל תָּ֝פֵ֗ק יָר֥וּמוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/008.yaml
  text: O Yahweh[a], do not grant the desires of the wicked; do not advance his scheme, lest they be exalted[b]. Selah
translation:
  language: zh_hans
  text: 雅威啊，不要成全恶人的心愿；不要使他的计谋得逞[a]，免得他们得以高举[b]。细拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要推进他的计谋”或“不要使他的计划实现。”本句的希伯来动词含义较难确定。
    reason: lexical_alternative
  - marker: b
    text: 或译：“免得他得以高举。”希伯来文本的动词是复数形式“他们得以高举”，但按前文单数的“恶人”和“他的计谋”，也可能理解为单数。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝的专名，保留希伯来文本中的名字，而不以称号替代。
- source_word: מַאֲוַיֵּי
  choice: 愿望
  rationale: 该词表示愿望、欲求；“愿望”自然清楚，也不额外强化原文的贬义程度。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 原文为单数，可指一个恶人，也可作类别性称谓；“恶人”在汉语中保留了这种弹性。
- source_word: זְמָמוֹ
  choice: 他的计谋
  rationale: 该词指筹划，在本诗语境中带有恶意；“计谋”比中性的“计划”更贴合。
- source_word: תָּפֵק
  choice: 使……得逞
  rationale: 此处动词意义较难确定；结合上下文，所求的是不要让恶人的计谋实现或推进。“使……得逞”在现代汉语中自然，并保留使役意味。
- source_word: יָרֻמוּ
  choice: 他们高升
  rationale: 马所拉文本使用复数动词，意为他们升高或被抬高。正文保留复数及“高升”的形象，不顺改为单数。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切功能不明，按传统音译，避免作出未经证实的解释。
theological_decisions:
- issue: 上帝专名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较直接地音译希伯来专名，使读者看见此处是名字而非“主”等称号。
- issue: 从单数“恶人／他的计谋”转为复数“他们高升”
  choice: 正文保留复数“他们”
  alternative: 按上下文顺为单数“他高升”
  rationale: 希伯来文本确实由单数转为复数；这种转换可能把视野从一个恶人扩展到恶人及其同伙或恶人群体，因此不在正文中消除这一张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“遂……愿望”略带诗体色彩但仍属通行表达；保留原文后半句单复数转换及“高升”的意象。“细拉”按传统音译。
