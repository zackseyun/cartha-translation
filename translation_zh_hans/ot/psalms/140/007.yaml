  text: יְהֹוִ֣ה אֲ֭דֹנָ/י עֹ֣ז יְשׁוּעָתִ֑/י סַכֹּ֥תָה לְ֝/רֹאשִׁ֗/י בְּ/י֣וֹם נָֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/007.yaml
  text: O Yahweh[a], my Lord, the strength of my salvation, you have covered my head in the day of battle.
translation:
  language: zh_hans
  text: 雅威，我的主，你是我救恩的力量；在争战之日[a]，你曾遮护我的头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争战之日”也可译作“兵器之日”或“武装冲突之日”。希伯来语 נָשֶׁק 可指兵器、武器；这里很可能指发生武装冲突的时候。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוִה
  choice: 雅威
  rationale: 直接音译上帝的圣名，保留其作为专名的性质，并与紧接其后的“我的主”相区别。
- source_word: אֲדֹנָי
  choice: 我的主
  rationale: 该形式含第一人称单数所属意义；译作“我的主”，既准确又适合诗篇中的直接呼求。
- source_word: עֹז יְשׁוּעָתִי
  choice: 我救恩的力量
  rationale: 保留原文“力量”与“我的救恩”之间的属格关系；“救恩”也兼容本节具体的获救、蒙保护语境。
- source_word: סַכֹּתָה
  choice: 你曾遮护
  rationale: 该动词兼有遮盖、庇护之义；“遮护”保留具体的覆盖意象，也自然传达保护作用。“曾”体现完成体所指的既成行动。
- source_word: לְרֹאשִׁי
  choice: 我的头
  rationale: 按汉语中“遮护”的自然搭配表达，同时保留原文头部受到遮蔽保护的形象。
- source_word: בְּיוֹם נָשֶׁק
  choice: 在交战之日
  rationale: נָשֶׁק可指兵器、武器；在“……之日”这一短语中，很可能指动用兵器的武装冲突时期。“交战之日”清楚自然，同时将较字面的可能译法收入脚注。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名；译作“雅威”保留其专名性质，不以称号取代，也与אֲדֹנָי“我的主”形成原文已有的区别。
- issue: עֹז יְשׁוּעָתִי的关系
  choice: 我救恩的力量
  alternative: 使我得救的大能；我得救的保障
  rationale: 采用较形式对应的表达，不把“力量”进一步解释为施救能力或保障，从而保留短语本身的凝练和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“啊”置于整组呼语末尾，使“雅威—我的主—我救恩的力量”自然连贯；“遮护”保留原文的具体意象，避免仅译成较抽象的“保护”。
