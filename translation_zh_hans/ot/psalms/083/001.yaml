base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/001.yaml
  text: O God[a], do not be silent; do not be still[b], O God.
translation:
  language: zh_hans
  text: 神啊[a]，不要缄默；不要默不作声，也不要安静不动，神啊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头和结尾使用了两个不同的希伯来语神圣称谓：אֱלֹהִים（“神”）和 אֵל（“神”，也可理解为“大能者”）。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 此处是祷告中的直接呼告；“神啊”符合现代汉语的自然表达，并保留庄重语气。
- source_word: אַל דֳּמִי לָךְ
  choice: 不要缄默
  rationale: דמי 在此表达静默、不作回应；“缄默”简洁而庄重，并为后续两个近义动词保留递进空间。
- source_word: אַל תֶּחֱרַשׁ
  choice: 不要默不作声
  rationale: חרשׁ 在此可指沉默不语，也可能带有不听、不回应的意味；正文采用较自然的“默不作声”，不把歧义明确化为生理意义的“耳聋”。
- source_word: וְאַל תִּשְׁקֹט
  choice: 也不要静止不动
  rationale: שׁקט 表示安静、平静或不行动；在呼求神介入的语境中，“静止不动”显出所祈求的是神不要继续不采取行动。
- source_word: אֵל
  choice: 神啊
  rationale: 结尾再次直接呼告神。虽与开头 אֱלֹהִים 所用称谓不同，正文统一译作“神”，以保持汉语祷告自然流畅；差异收入脚注。
theological_decisions:
- issue: 同一节中 אֱלֹהִים 与 אֵל 两个神圣称谓的处理
  choice: 两者正文均译作“神啊”
  alternative: 将 אֵל 译作“大能者啊”
  rationale: אֵל 可以含力量方面的联想，但本节未必有意强调“大能者”这一限定意义。统一译为“神啊”避免过度释义，同时用脚注保留原文称谓有别这一事实。
- issue: תֶּחֱרַשׁ 的沉默与不听之歧义
  choice: 译作“默不作声”
  alternative: 译作“不要充耳不闻”
  rationale: 该词在此可与沉默相关，也可让人联想到不听、不回应。正文遵循诗句三个平行动词的静默—无声—不动意象，不把含义限定为“充耳不闻”。
translation_notes:
  register: 采用现代、庄重而可懂的祷告体。“缄默—默不作声—静止不动”保留希伯来诗歌的三重平行与逐步加强；不使用古雅的“休要”“静默无声”等表达。
