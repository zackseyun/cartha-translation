  yaml_path: translation/ot/psalms/083/017.yaml
  text: Let them be put to shame and be terrified forever[a]; let them be disgraced and perish.
translation:
  language: zh_hans
  text: 愿他们永远蒙羞惊惶[a]；愿他们受辱灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他们永远羞愧惊惶……愿他们蒙羞灭亡。”原文用了两个意义相近的羞耻词（בוש、חפר），语气略有不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: 愿他们蒙羞
  rationale: בוש 的 Qal 未完成式第三人称阳性复数在此承接祈愿、咒诅语气；“蒙羞”自然表达陷入羞耻、受挫败的结果。
- source_word: וְיִבָּהֲלוּ
  choice: 惊惶
  rationale: בהל 的 Niphal 未完成式表示受到惊扰而惶恐；“惊惶”兼顾恐惧与慌乱，并与前句共用“愿他们”的祈愿语气。
- source_word: עֲדֵי עַד
  choice: 永远
  rationale: 该强化性时间短语意为直到永久；“永远”是现代汉语中最自然、庄重的对应表达。
- source_word: וְיַחְפְּרוּ
  choice: 愿他们受辱
  rationale: חפר 与 בוש 都涉及羞耻，但更可突出羞辱、丢脸；用“受辱”保留两个近义词之间细微而真实的差别。
- source_word: וְיֹאבֵדוּ
  choice: 灭亡
  rationale: אבד 的 Qal 在此表示灭亡、消逝；“灭亡”保留广义结果，不额外限定毁灭方式。
theological_decisions:
- issue: 一连串未完成式的祈愿／咒诅语气
  choice: 以两次“愿他们”表达祈愿语气
  alternative: 译作陈述性的将来结果：“他们必……他们必……”
  rationale: 结合诗篇语境，这些动词表达对敌人的祈求，而非单纯预告未来；“愿他们”既保留咒诅诗的力度，也不增添解释。
- issue: 两个羞耻词的关系
  choice: 分别译为“蒙羞”和“受辱”
  alternative: 两者都译为“羞愧”
  rationale: בוש 与 חפר 语义相近却不完全重合；采用不同而相邻的汉语词，保留原文的重复与层次，不把心理羞愧或公开受辱绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的祈愿句式。“蒙羞惊惶”保持希伯来诗歌紧凑的并列节奏；分号对应两组平行祈愿。
