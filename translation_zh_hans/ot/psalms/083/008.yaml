  text: גַּם אַ֭שּׁוּר נִלְוָ֣ה עִמָּ֑/ם הָ֤י֥וּ זְר֖וֹעַ לִ/בְנֵי ל֣וֹט סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/008.yaml
  text: Even Assyria joined with them[a]; they became an arm for the sons of Lot[b]. Selah
translation:
  language: zh_hans
  text: 连亚述也与他们联合；他们成了罗得子孙[a]的臂膀[b]。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罗得子孙”指由罗得而出的族群，尤其是摩押人和亚扪人。
    reason: cross_reference
  - marker: b
    text: “臂膀”直译希伯来文的比喻，意思可理解为力量或军事援助。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 连……也
  rationale: 在列举敌对联盟的语境中表达强调，突出亚述也加入其中。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 此处指作为政治实体的亚述，采用现代中文圣经和历史叙述中的通行名称。
- source_word: נִלְוָה
  choice: 联合
  rationale: 该词的尼法勒形表示加入、依附或联合；“联合”自然地传达结盟之意，又不额外说明联盟方式。
- source_word: עִמָּם
  choice: 与他们
  rationale: 直译介词及第三人称阳性复数后缀，所指为上文列出的群体。
- source_word: הָיוּ
  choice: 他们成了
  rationale: 保留希伯来文的复数形式以及由 הָיָה 表达的状态形成；不强行消除其主语指向上的张力。
- source_word: זְרוֹעַ
  choice: 膀臂
  rationale: 保留“手臂”作为力量和军事支援象征的希伯来语隐喻；“膀臂”在现代中文中仍庄重且可理解。
- source_word: לִבְנֵי לוֹט
  choice: 罗得子孙
  rationale: 既保留希伯来语的亲属表达，也自然指向由罗得而出的族群。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切含义不明，采用传统音译，避免把不确定的礼仪或音乐功能解释为确定含义。
theological_decisions:
- issue: “他们”所指的范围
  choice: 保留复数代词“他们”，不明确限定为亚述或整个联盟
  alternative: 改为“亚述成了”或“这些民族成了”
  rationale: 原文 הָיוּ 为复数，而紧邻的“亚述”在形式上是单数地名，却也可能具有集合意义；译文保留这种语法和指称张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“连……也”传达强调；分号呈现两个紧密相连的分句；保留“膀臂”的原文意象和“细拉”的传统音译。
