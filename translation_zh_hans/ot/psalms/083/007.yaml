  text: Gebal[a], Ammon, and Amalek[b]; Philistia with the inhabitants of Tyre.
translation:
  language: zh_hans
  text: 迦巴勒[a]、亚扪和亚玛力；非利士地[b]，以及推罗的居民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 迦巴勒可能指与比布罗斯相对应的腓尼基城。
    reason: cultural_note
  - marker: b
    text: 或译“非利士人”，即把地域名称转指当地居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבָל
  choice: 迦巴勒
  rationale: 按希伯来语地名音译；可能是腓尼基城比布罗斯，但正文保留希伯来语名称的形式。
- source_word: וְעַמּוֹן
  choice: 亚扪
  rationale: 采用现代中文圣经中通行的民族或地域名称。
- source_word: וַעֲמָלֵק
  choice: 亚玛力
  rationale: 采用现代中文圣经中通行的民族或国家名称。
- source_word: פְּלֶשֶׁת
  choice: 非利士地
  rationale: 该希伯来语形式首先指地域，而非明确指非利士人；译作“非利士地”保留这一形式上的区别。
- source_word: עִם
  choice: 以及
  rationale: 在名单末项中自然表达“同、与”的并列关系。
- source_word: יֹשְׁבֵי צֽוֹר
  choice: 推罗的居民
  rationale: 准确表达“推罗的居住者”，同时采用自然、简洁的现代汉语。
- source_word: צֽוֹר
  choice: 推罗
  rationale: 采用该地名在现代中文圣经中的通行译名。
