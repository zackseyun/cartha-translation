  yaml_path: translation/ot/psalms/083/015.yaml
  text: So pursue them with your storm[a], and terrify them with your tempest.
translation:
  language: zh_hans
  text: 求你照样用你的暴风追赶他们，用你的狂风使他们惊惶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: 也照样
  rationale: 承接上一节的比喻，表达“按这种方式”的关联；“也照样”在现代汉语中自然，并清楚连接上下文。
- source_word: תִּרְדְּפֵם
  choice: 追赶他们
  rationale: רדף的基本义是追逐、追赶；此处保留争战与审判诗歌中的力度，又避免“迫害”在现代汉语中的特定含义。
- source_word: בְּסַעֲרֶךָ
  choice: 用你的暴风
  rationale: סער指猛烈的风暴；介词ב在此适合按工具义译为“用”，表明风暴是追赶的手段。
- source_word: וּבְסוּפָתְךָ
  choice: 用你的狂风
  rationale: סוּפָה可指猛烈风暴或旋风。“狂风”与前面的“暴风”形成近义递进，同时不把两个希伯来词完全合并。
- source_word: תְבַהֲלֵם
  choice: 惊吓他们
  rationale: בהל的加强词干表达使人惊惶、恐惧。“惊吓”保留使役意义，措辞自然；其强度由“狂风”和祈求审判的语境共同体现。
theological_decisions:
- issue: 咒诅诗中上帝的行动
  choice: 以“求你”引出直接祈求上帝追赶并惊吓仇敌
  alternative: 照样，你必用你的暴风追赶他们，用你的狂风惊吓他们
  rationale: 两个未完成式在祷告语境中自然具有祈愿色彩。加上“求你”可在现代汉语中明确这是祈求而非预言，同时不淡化诗人诉求上帝施行审判的张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。句式保持希伯来诗歌的平行结构，以“暴风／狂风”和“追赶／惊吓”呈现递进；本节无须脚注，因为相关词义差异已可在正文中自然保留。
