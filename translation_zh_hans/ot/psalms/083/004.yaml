  naturalness: “让以色列的名不再被人记念”可理解，但与前面的“使”并列时，“让”稍显口语化且句式不够匀称。改为“使以色列的名不再被人记念”更自然、庄重，也清楚表达原文的目的／结果关系。
  terminology: “以色列的名”和“被人记念”妥当，保留了שֵׁם与Niphal被动式的身份、记忆意味。“一个民族”比“不再成国”更稳妥地对应此处的גּוֹי，且不将古代民族共同体直接等同于现代国家。
