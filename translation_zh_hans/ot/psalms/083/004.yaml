lexical_decisions:
- source_word: אָמְרוּ
  choice: 他们说
  rationale: 该词是אמר的Qal完成式第三人称复数；诗歌叙事中用现代汉语现在时“说”可生动呈现仇敌当前的图谋，同时不必强行限定为一次过去事件。
- source_word: לְכוּ
  choice: 来吧
  rationale: הלך的复数命令式在此作劝诱、号召用语，并非强调空间移动；“来吧”自然引出共同谋划。
- source_word: וְנַכְחִידֵם
  choice: 我们把他们灭掉
  rationale: כחד的Hiphil第一人称复数意愿式带第三人称阳性复数后缀，表示使其消失或除灭；“灭掉”保留彻底毁灭的强烈语气，又符合现代汉语。
- source_word: מִגּוֹי
  choice: 使他们不再成国
  rationale: 介词מִן与גּוֹי结合，表达从民族或国家存续状态中被除去；结合前一动词译为“不再成国”，清楚传达其目标是使以色列不再作为一个民族存在。
- source_word: וְלֹא יִזָּכֵר
  choice: 让……不再被人记念
  rationale: זכר的Niphal未完成式保留被动含义“被记念”；“让”在汉语中自然表达与前句相连的图谋或预期结果。
- source_word: שֵׁם יִשְׂרָאֵל
  choice: 以色列的名
  rationale: 按希伯来语组合结构直译，保留“名”所承载的身份与存续意味，也保持诗体庄重感。
- source_word: עוֹד
  choice: 不再
  rationale: עוֹד在否定结构中意为“不再、再也不”，这里用“不再”简洁自然。
