source:
  edition: WLC
  text: עֲשֵֽׂה לָ/הֶ֥ם כְּ/מִדְיָ֑ן כְּֽ/סִֽיסְרָ֥א כְ֝/יָבִ֗ין בְּ/נַ֣חַל קִישֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/009.yaml
  text: Do to them as to Midian[a], as to Sisera, as to Jabin, at the Kishon Brook[b],
translation:
  language: zh_hans
  text: 求你对付他们，如同对付米甸，如同在基顺河边对付西西拉和耶宾一样。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为：“求你向他们行，像米甸，像西西拉，像耶宾，在基顺河边。”正文补出“对付”，使希伯来文省略的比较关系在中文中清楚。
    reason: lexical_alternative
  - marker: b
    text: 关于西西拉和耶宾在基顺河一带败亡的事，参看《士师记》4:7、13；5:21。
    reason: cross_reference
lexical_decisions:
- source_word: עֲשֵׂה לָהֶם
  choice: 求你对付他们
  rationale: 祈使式直译为“向他们行”，但在这里是求上帝照过去的先例采取敌对行动；“求你对付他们”符合现代汉语祈祷语气，也保留了行动的概括性。
- source_word: כְּמִדְיָן
  choice: 如同对付米甸
  rationale: 比较词כְּ引出过去的先例。汉语补出“对付”，使省略结构自然清楚；“米甸”既可指族群，也可指其势力，不额外限定。
- source_word: כְּסִיסְרָא כְיָבִין
  choice: 如同……对付西西拉和耶宾
  rationale: 两个专名构成平行比较，沿用前文补出的“对付”，表达他们过去所受的败亡，而不扩写具体事件。
- source_word: בְּנַחַל קִישׁוֹן
  choice: 在基顺河边
  rationale: נַחַל可指溪流、季节河或河谷中的水道；此处是具名水道及相关战场。“基顺河”是清楚自然的中文地名表达，“边”体现地点关系而不过度限定是在水中或河谷内。
theological_decisions:
- issue: 祈求上帝照历史先例对待仇敌的敌对含义
  choice: 用“对付”表达语境中的敌对行动，但不说明具体惩罚方式
  alternative: 直译作“待他们”或强化作“毁灭他们”
  rationale: “待他们”在现代汉语中含义过弱且不自然；“毁灭”则超出本节动词本身。采用“对付”既反映上下文，也不把未明说的结果写死。
- issue: 比较结构中省略的动作
  choice: 在各比较项中补出“对付”
  alternative: 保留字面形式“像米甸、像西西拉、像耶宾”
  rationale: 希伯来文依靠省略表达“照你从前对他们所行的而行”；中文若完全保留省略，容易误解为使敌人成为这些人。补词只使比较关系显明，不增加新的神学判断。
translation_notes:
  register: 采用庄重而自然的现代祈祷语体。“求你”传达直接祈使而不显生硬；句式保留米甸、西西拉、耶宾三个历史先例的平行关系。
