  text: They were destroyed at En-dor[b][a]; they became dung for the ground.
translation:
  language: zh_hans
  text: 他们在隐·多珥被消灭[a]，成了土地的粪肥[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在隐·多珥”也可译作“在隐·多珥附近”。希伯来语介词在地名前可表达多种地点关系。
    reason: lexical_alternative
  - marker: b
    text: 直译：“成了给土地的粪肥。”也可译作“成了地面上的粪便”，描绘尸首沦为粪肥般的废物。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְדוּ
  choice: 被消灭
  rationale: 该词是 שׁמד 的尼法勒完成式第三人称复数，表达遭毁灭、被除灭的结果；“被消灭”保留其被动和结果意味，又不额外强化为“灭绝净尽”。
- source_word: בְּעֵין דֹּאר
  choice: 在隐·多珥
  rationale: עֵין דֹּאר 是地名，前缀 בְּ 表示地点；“在隐·多珥”是自然的中文地点表达，但原介词也可按语境理解为“隐·多珥附近”。
- source_word: הָיוּ
  choice: 成了
  rationale: היה 虽可表示“是”，但此处接表语名词，具有进入某种状态的意味；“成了”自然呈现这一变化和结果。
- source_word: דֹּמֶן
  choice: 粪土
  rationale: 该名词指粪便、粪肥；“粪土”在现代中文中庄重而鲜明，也适合诗歌中尸首如废弃物、肥料般受辱的意象。
- source_word: לָאֲדָמָה
  choice: 地上的
  rationale: אֲדָמָה 指土地、地面；לְ 字面表示“给、归于”，构成“给土地作粪肥”的图像。正文译作“地上的粪土”较自然，脚注保留更贴近原文的关系表达。
