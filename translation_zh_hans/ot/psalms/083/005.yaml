source:
  edition: WLC
  text: כִּ֤י נוֹעֲצ֣וּ לֵ֣ב יַחְדָּ֑ו עָ֝לֶ֗י/ךָ בְּרִ֣ית יִכְרֹֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/005.yaml
  text: For they have conspired together with one heart[b][a]; against you they make a covenant.
translation:
  language: zh_hans
  text: 因为他们一心合谋[b]，立约反对你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“割约反对你”；“割约”是希伯来语表示“立约”的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 或译：“同心商议”。
    reason: previous_rendering
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明诗人呼求的缘由，保留原文的因果、解释作用。
- source_word: נוֹעֲצוּ
  choice: 合谋
  rationale: 该动词为尼法勒形态，表示共同商议、彼此谋划；结合敌对上帝并立约的语境，“合谋”自然地传达共同筹划及其敌意。
- source_word: לֵב יַחְדָּו
  choice: 一心
  rationale: 保留“心”所表达的共同意志和意向，同时以现代汉语自然表达齐心一致之意。
- source_word: עָלֶיךָ
  choice: 反对你
  rationale: 在敌对谋划和立约的语境中，עַל具有对抗含义；“反对你”明确保留其敌对指向。
- source_word: בְּרִית יִכְרֹתוּ
  choice: 立约
  rationale: 希伯来语惯用语字面为“割约”；现代汉语“立约”既准确表达缔结有约束力的盟约，也避免生硬直译。
theological_decisions:
- issue: 敌对者联合对抗上帝的盟约语言
  choice: 立约反对你
  alternative: 结盟反对你
  rationale: “立约”保留בְּרִית的正式、约束性意味，也维持本节将敌对行动直接指向上帝的神学张力；“结盟”虽自然，却会弱化“约”的用词。
- issue: נוֹעֲצוּ所表达的商议与阴谋色彩
  choice: 合谋
  alternative: 商议
  rationale: 词本身可指共同商议，但本节语境明确敌对；“合谋”传达这种语境含义，同时以脚注保留较中性的词义可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一心合谋”简洁呈现共同意志和敌对筹划；后半句保持“立约”这一重要圣经用语，不以较宽泛的“结盟”取代。
