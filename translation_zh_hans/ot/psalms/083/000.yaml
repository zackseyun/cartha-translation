theological_decisions:
- issue: 标题中亚萨与本诗的关系
  choice: 亚萨的诗
  alternative: 为亚萨而作的诗
  rationale: 希伯来语介词 לְ 的含义并不唯一，正文采用传统而简洁的归属表达，脚注保留献呈或其他关联的可能性，不断定亚萨必定是作者。
translation_notes:
