  rationale: 该名词指供歌唱的作品；译作“歌”自然简明，也保留诗篇标题中的体裁标识。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 该词是诗篇标题中的专门体裁用语；现代汉语通常以“诗”表达，既符合《诗篇》的语境，也不将其泛化为普通曲调。
- source_word: לְ/אָסָף
  choice: 亚萨的
