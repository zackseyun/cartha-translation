lexical_decisions:
- source_word: אָהֳלֵי
  choice: 帐棚
  rationale: 这是 אֹהֶל 的复数附属形式，字面为“……的帐棚”。此处虽可借指相关部族，仍保留希伯来诗歌中的具体意象。
- source_word: אֱדוֹם
  choice: 以东
  rationale: 按专名译作“以东”，与“帐棚”构成“以东的帐棚”。
- source_word: יִשְׁמְעֵאלִים
  choice: 以实玛利人
  rationale: 这是由“以实玛利”派生的复数族名，采用现代中文圣经读者熟悉的族称。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 原文为国家或地域专名，而非族称形式，因此译作“摩押”，保持名单的简洁与原文形式。
- source_word: הַגְרִים
  choice: 哈基利人
  rationale: 这是族群名称；“哈基利人”较贴近该词的辅音形式。其与“夏甲”这一名称的关联性译法另列脚注，以保留词源与传统译名上的可能性。
theological_decisions: []
