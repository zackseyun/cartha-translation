  text: עַֽל עַ֭מְּ/ךָ יַעֲרִ֣ימוּ ס֑וֹד וְ֝/יִתְיָעֲצ֗וּ עַל צְפוּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/003.yaml
  text: They make crafty plans against your people[a], and they consult together against your treasured ones.
translation:
  language: zh_hans
  text: 他们诡诈地密谋对付你的子民，又一同商议对付你所珍藏的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你所隐藏的人”或“蒙你庇护的人”。希伯来语可指被隐藏、被妥善保存的人，也可引申为神所珍视的人。
    reason: 保留צְפוּנֶיךָ在“隐藏、保守”与“珍藏、珍视”之间的词义幅度。
lexical_decisions:
- source_word: יַעֲרִימוּ סוֹד
  choice: 诡诈地密谋
  rationale: יַעֲרִימוּ表示以机巧、诡诈行事，סוֹד可指秘密商议或密谋；合译为“诡诈地密谋”，既自然，也保留敌意与隐秘商议的意味。
- source_word: עַל עַמְּךָ
  choice: 对付你的子民
  rationale: 在敌对语境中，עַל表示针对、反对；“对付”比单纯的“关于”准确，也避免擅自加入杀害之意。
- source_word: וְיִתְיָעֲצוּ
  choice: 又一同商议
  rationale: יעץ的Hitpael形式表达彼此共同商议；此译保留相互参与的意思，而不直接强化为“共谋”。
- source_word: צְפוּנֶיךָ
  choice: 你所珍藏的人
  rationale: 该词源于צפן，可表示隐藏、储藏或珍藏之物；“你所珍藏的人”保留神看重并保守这些人的双重可能，不将含义仅限于情感上的珍爱或实际庇护。
theological_decisions:
- issue: צְפוּנֶיךָ如何描述属神的人
  choice: 你所珍藏的人
  alternative: 你所隐藏的人；蒙你庇护的人
  rationale: 原词可强调被隐藏、储存、珍藏或妥善保存。正文采用“你所珍藏的人”，表达他们属于神并为神所珍视，同时以脚注保留“隐藏、庇护”的真实词义可能，避免把含义固定为某一种神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“子民”适合诗篇中神与其百姓的关系语境；“诡诈地密谋”与“又一同商议”保留希伯来诗歌的平行结构。
