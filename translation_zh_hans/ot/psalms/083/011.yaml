  text: שִׁיתֵ֣/מוֹ נְ֭דִיבֵ/מוֹ כְּ/עֹרֵ֣ב וְ/כִ/זְאֵ֑ב וּֽ/כְ/זֶ֥בַח וּ֝/כְ/צַלְמֻנָּ֗ע כָּל נְסִיכֵֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/011.yaml
  text: Make their nobles like Oreb and Zeeb[a], and all their princes like Zebah and Zalmunna.
translation:
  language: zh_hans
  text: 使他们的贵族像俄立和西伊伯[a]，使他们所有的首领像西巴和撒慕拿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 俄立和西伊伯是《士师记》7:25中被击败的米甸首领；西巴和撒慕拿是《士师记》8:5–21中被击败的米甸王。
    reason: cross_reference
lexical_decisions:
- source_word: שִׁיתֵמוֹ
  choice: 使他们的……像
  rationale: 这是向上帝发出的祈使语；结合后面的比较结构，表达“使他们的领袖遭遇像……一样的结局”。中文在两个分句中补出“使”，以清楚呈现平行关系。
- source_word: נְדִיבֵמוֹ
  choice: 他们的贵族
  rationale: נָדִיב在这里指有地位、有权势的领袖。“贵族”既自然，又能与后面的“首领”有所区别。
- source_word: כְּעֹרֵב וְכִזְאֵב
  choice: 像俄立和西伊伯
  rationale: 两者是《士师记》7:25中的米甸首领；采用现代中文圣经读者较熟悉的人名译法，并保留比较含义。
- source_word: וּכְזֶבַח וּכְצַלְמֻנָּע
  choice: 像西巴和撒慕拿
  rationale: 两者是《士师记》8章中的米甸王；保留专名和历史指涉。
- source_word: כָּל
  choice: 所有的
  rationale: 明确保留原文所表达的整体性。
- source_word: נְסִיכֵמוֹ
  choice: 他们所有的首领
  rationale: נָסִיךְ可指首领、统治者或王侯。“首领”在现代普通话中自然，并保留政治领导者的含义而不过度限定其爵位。
theological_decisions:
- issue: 咒诅祈祷中的历史典故
  choice: 保留四位米甸领袖的名字，让经文以他们昔日败亡的结局作为当前审判的类比
  alternative: 把这些名字泛化为普通的“仇敌”或直接解释为“使他们灭亡”
  rationale: 原文明确列出《士师记》7—8章中的人物，既唤起历史性的拯救，也含蓄表达所祈求的结局。正文不把这一含义扩写为明确的死亡措辞，以保留原文借比较表达的力度与含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个平行分句都用“使……像……”，既符合中文表达，也清楚保留希伯来诗歌的对应结构；不在正文中解释“像”具体意味着被杀或败亡，以免消除原文的修辞含蓄。
