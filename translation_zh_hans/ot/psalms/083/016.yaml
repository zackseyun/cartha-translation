  text: מַלֵּ֣א פְנֵי/הֶ֣ם קָל֑וֹן וִֽ/יבַקְשׁ֖וּ שִׁמְ/ךָ֣ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/016.yaml
  text: Fill their faces with shame[a], that they may seek your name, O Yahweh.
translation:
  language: zh_hans
  text: 求你使他们满面蒙羞，[a]好叫他们寻求你的名，耶和华啊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并愿他们寻求你的名”；希伯来语动词也可理解为前一祈求的简单延续，不过此处更可能表示目的或结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: 使……满
  rationale: 这是动词 מלא 的 Piel 命令式，第二人称阳性单数，向上帝发出祈求；“使他们满面……”既保留“充满”的基本意象，也符合现代汉语表达。
- source_word: פְנֵיהֶם
  choice: 他们满面
  rationale: 原文是“他们的脸”；在“满面羞耻”这一自然汉语结构中，保留了羞耻显露于面容的希伯来意象。
- source_word: קָלוֹן
  choice: 羞耻
  rationale: 该词可指羞耻、耻辱或受辱；“羞耻”简洁自然，同时兼容内在羞愧与公开蒙羞。
- source_word: וִיבַקְשׁוּ
  choice: 好叫他们寻求
  rationale: 命令式之后以连接词引出的未完成式很可能表示目的或结果；“好叫”准确而庄重，同时不把实际结果表述为必然发生。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 直译保留圣经中“名”所涵盖的上帝身份、声誉与自我启示，不作过度解释。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行、最易识别的神名音译，以人名而非称号呈现四字神名。
theological_decisions:
- issue: 神施行羞辱的目的
  choice: 将后半句译为目的：“好叫他们寻求你的名”。
  alternative: 也可理解为简单承接：“并愿他们寻求你的名”。
  rationale: 命令式之后带连接词的未完成式常有目的或结果意味；本译法呈现审判可能引向对上帝的寻求，却不将这种寻求解释成必然悔改，从而保留经文的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“满面羞耻”保留原文面容意象；“好叫”清楚表达目的关系。神名使用中文读者熟悉的“耶和华”。
