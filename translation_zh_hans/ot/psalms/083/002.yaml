  yaml_path: translation/ot/psalms/083/002.yaml
  text: For look, your enemies are in an uproar, and those who hate you have lifted up their heads.
translation:
  language: zh_hans
  text: 因为，看哪，你的仇敌正在喧嚷；恨你的人抬起头来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: 因为，看哪
  rationale: כִּי承接上文说明缘由，译为“因为”；הִנֵּה用于唤起注意，译为庄重而清楚的“看哪”。
- source_word: יֶהֱמָיוּן
  choice: 正在喧嚷
  rationale: 该动词描写嘈杂骚动的声势；“喧嚷”既保留声音意象，也自然传达敌人的骚动。
- source_word: נָשְׂאוּ רֹאשׁ
  choice: 抬起头来
  rationale: 保留希伯来文的身体意象及其可能含有的自信、骄傲或公然反抗意味，不在正文中将其窄化为单一解释。
theological_decisions:
- issue: “抬起头来”的隐含意义
  choice: 保留直译意象
  alternative: 译作“狂妄反抗”或“气焰嚣张”
  rationale: 原文意象可表达得势、自负或公开敌对；直译能保存这种语义张力，避免加入原文未明确限定的神学或心理解释。
translation_notes:
  register: 采用现代、庄重且易懂的诗歌语言；以分号呈现两行平行关系。“看哪”略带经文语体，但在此能准确保留原文的提示和强调功能。
