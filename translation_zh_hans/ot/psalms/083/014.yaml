  text: As fire burns a forest[a], and as a flame sets the mountains ablaze,
translation:
  language: zh_hans
  text: 如火焚烧树林[a]，又如火焰使群山燃烧，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如火烧毁树林，又如火焰焚烧群山。”
    reason: בער和להט在此可侧重燃烧的动作；按上下文，也可表达烧毁或猛烈焚烧的效果。
lexical_decisions:
- source_word: כְּאֵשׁ
  choice: 如火
  rationale: 前缀כְּ表示比拟；“如火”简洁自然，并与下半句“又如烈焰”形成诗歌平行。
- source_word: תִּבְעַר
  choice: 焚烧
  rationale: בער的Qal形式在此描写火对树林的作用；“焚烧”既直接表达燃烧，也符合庄重的诗歌语体。
- source_word: יָעַר
  choice: 树林
  rationale: 该词可指森林或林地；“树林”通俗自然，并保留原文的整体林木意象。
- source_word: וּכְלֶהָבָה
  choice: 又如烈焰
  rationale: וּ连接两个平行分句，כְּ引出第二个比拟；לֶהָבָה意为火焰，“烈焰”自然体现其强烈的燃烧意象。
- source_word: תְּלַהֵט
  choice: 烧着
  rationale: להט的Piel形式表达使某物猛烈燃烧；“烧着”保留使群山燃起的动态，又避免加入原文没有明说的毁灭结果。
- source_word: הָרִים
  choice: 群山
  rationale: הָרִים带定冠词，指众山；汉语诗歌中“群山”比直译“那些山”更自然，也准确保留复数意象。
theological_decisions: []
