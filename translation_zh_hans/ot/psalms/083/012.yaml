  text: אֲשֶׁ֣ר אָ֭מְרוּ נִ֣ירֲשָׁה לָּ֑/נוּ אֵ֝֗ת נְא֣וֹת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/012.yaml
  text: who said[a], “Let us take possession for ourselves of the pastures of God.”
translation:
  language: zh_hans
  text: 他们曾说：“让我们夺取上帝的草场[a]，据为己有。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的居所”，或“上帝居住的地方”。
    reason: 原词既可指草场，也可指居所或住处。
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: 他们曾说
  rationale: 关系代词承接上文所说的敌人；中文以“他们”明确承接对象。“曾说”自然表达完成体的既成言论。
- source_word: נִירֲשָׁה
  choice: 让我们夺取
  rationale: ירשׁ 可指承受、占有或夺取产业；在敌对入侵的语境中，“夺取”既体现强占意味，又不过度展开为“赶走并占有”。
- source_word: לָּנוּ
  choice: 据为己有
  rationale: 介词 ל 加第一人称复数后缀表达为自己取得、归自己所有；“据为己有”在现代汉语中准确传达其自利和占有意味。
- source_word: נְאוֹת
  choice: 草场
  rationale: נָוֶה 可指草场、居所或住处。“草场”保留希伯来语具体的田园意象，同时脚注保留“居所”等可能含义。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本诗中明确指以色列的上帝，故采用单数称谓“上帝”。
theological_decisions:
- issue: נְאוֹת אֱלֹהִים 的含义
  choice: 上帝的草场
  alternative: 上帝的居所／上帝居住的地方
  rationale: 该短语既可描绘属于上帝的草场或土地，也可指上帝的居所。正文保留具体的草场意象，不将其局限为圣所；脚注保存居所义的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“夺取……据为己有”符合敌人口中的侵占语气；正文中的脚注标记与脚注对应。
