  yaml_path: translation/ot/psalms/083/013.yaml
  text: My God[a], make them like whirling dust[b], like chaff before the wind.
translation:
  language: zh_hans
  text: 我的上帝啊，求你使他们如旋卷的尘土[a]，如风前的碎秸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旋卷的尘土”：希伯来语גַּלְגַּל也可译作“轮子”或“滚动、旋转之物”。这里采用与下半句风前碎秸相呼应的旋卷、飘散意象。
    reason: lexical_alternative
  - marker: b
    text: “碎秸”：希伯来语קַשׁ较直接指“秸秆”“禾秆”或“茬秆”。这里译为“碎秸”，以表达在风前被吹散的轻飘农作物残余意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: 我的上帝啊
  rationale: 这是带第一人称单数后缀的直接呼告；加“啊”符合现代汉语祷告语体，也不改变“我的上帝”的基本意义。
- source_word: שִׁיתֵמוֹ
  choice: 求你使他们
  rationale: שׁית在此表达祈求性的命令，后接两个比喻；“求你使他们”既显明祷告语气，也自然引出“如……如……”。
- source_word: כַגַּלְגַּל
  choice: 如旋风卷起的尘土
  rationale: גַּלְגַּל可指轮子，也可指滚动、旋转之物。结合下句被风吹动的碎秸，正文采用风中旋卷之物的意象；同时以脚注保留“轮子”等词义可能。
- source_word: כְּקַשׁ
  choice: 如……碎秸
  rationale: קַשׁ通常指禾秆、秸秆或残梗，并非希伯来语中最常见的“糠秕”一词。“碎秸”兼顾农作物残余物的本义与被风吹散的轻飘意象。
- source_word: לִפְנֵי רוּחַ
  choice: 风前
  rationale: 这是表示在风力驱赶之下的常见诗歌表达；“风前”简洁、自然，并保留原文结构。
theological_decisions: []
