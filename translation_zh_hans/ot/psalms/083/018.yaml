source:
  edition: WLC
  text: וְֽ/יֵדְע֗וּ כִּֽי אַתָּ֬ה שִׁמְ/ךָ֣ יְהוָ֣ה לְ/בַדֶּ֑/ךָ עֶ֝לְי֗וֹן עַל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/018.yaml
  text: Let them know that you alone[a], whose name is Yahweh[b], are the Most High over all the earth.
translation:
  language: zh_hans
  text: 愿他们知道：唯有你——你的名是雅威[a]——是全地之上的至高者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自希伯来文神名יהוה（YHWH）；传统上也译作“耶和华”，有些译本以“主”代称。
    reason: 说明神名的原文形式及主要译法。
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: 愿他们知道
  rationale: 该词为ידע的Qal未完成式第三人称阳性复数，前接连词；承接本诗祈愿语境，以“愿……”表达祈求或愿望，比直陈将来更贴切。
- source_word: כִּי
  choice: ：
  rationale: 此处引出“知道”的内容；汉语用冒号自然呈现其内容从句功能，无须机械译作“即/因为”。
- source_word: אַתָּה ... לְבַדֶּךָ
  choice: 唯有你
  rationale: לְבַדֶּךָ强调排他性；“唯有你”简洁而庄重，保留“只有你”的重点。
- source_word: שִׁמְךָ יְהוָה
  choice: 你的名是雅威
  rationale: 原文是同位识别结构，直接说明受话者的名字；汉语以独立插入语表达，既贴近原文，也避免关系从句的生硬。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现四字神名，而不以“耶和华”或“主”替代；脚注说明传统译法及辅音形式。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 在此作神的称号，表示地位至高；“至高者”是自然、庄重且通行的汉语表达。
- source_word: עַל כָּל הָאָרֶץ
  choice: 全地之上的
  rationale: עַל表示统治或超越的地位，כָּל הָאָרֶץ在此具有普世范围；“全地之上”保留空间隐喻与至高权柄。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；耶和华（上主）；主
  rationale: 原文直接使用四字神名，正文以“雅威”音译，可区分专名与称号，并较贴近学界通常重构的读音；脚注保留传统汉译信息。
- issue: “唯有”所限定的范围
  choice: 让“唯有你”强调只有受话者是全地之上的至高者
  alternative: 将“唯有”紧接“至高者”，译作“只有你是至高者”
  rationale: 原文לְבַדֶּךָ位于神名之后、עֶלְיוֹן之前，其确切句法着重点可有不同理解；中文将“唯有你”前置，保留排他性核心，而不额外断定它限定神名本身。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“愿他们知道”承接祈愿语气；破折号标出神名说明语，使主句“唯有你……是……至高者”的排他重点清楚。
