source:
  edition: WLC
  text: רִגְז֗וּ וְֽ/אַל תֶּ֫חֱטָ֥אוּ אִמְר֣וּ בִ֭/לְבַבְ/כֶם עַֽל מִשְׁכַּבְ/כֶ֗ם וְ/דֹ֣מּוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/004.yaml
  text: Tremble[a], and do not sin; speak in your hearts on your beds, and be still[b]. Selah
translation:
  language: zh_hans
  text: 你们要战兢[a]，不可犯罪；在床上时，要在心里思量[b]，并要静默。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要发怒，却不可犯罪。”希伯来语动词可指激动、战兢或发怒。
    reason: alternative_reading
  - marker: b
    text: 直译：“在你们心里说。”
    reason: literal_rendering
lexical_decisions:
- source_word: רִגְזוּ
  choice: 要战兢
  rationale: רגז可指震颤、激动或发怒。结合“不可犯罪”以及随后内省、静默的劝告，“战兢”既保留强烈的内在震动，也不把含义限定为愤怒。
- source_word: וְאַל תֶּחֱטָאוּ
  choice: 不可犯罪
  rationale: 直接表达希伯来文否定命令，简洁自然。
- source_word: אִמְרוּ בִלְבַבְכֶם
  choice: 在心里思想
  rationale: 字面为“在你们心里说”。现代汉语用“在心里思想”自然表达内心自语和反省，同时脚注保留原文措辞。
- source_word: עַל מִשְׁכַּבְכֶם
  choice: 躺在床上
  rationale: 保留行为发生的处境；相较生硬的“在你们的床上”，此译法更符合现代汉语。
- source_word: וְדֹמּוּ
  choice: 并要静默
  rationale: דמם可指安静、静止或沉默。“静默”在此兼顾停止言语与安静下来的含义。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该礼仪或音乐术语的确切意义不明，依中文圣经传统音译，以免作无根据的解释。
theological_decisions:
- issue: רגזו在道德劝诫中的含义
  choice: 理解为因震动或敬畏而战兢，同时受劝不可犯罪
  alternative: “你们要发怒，却不可犯罪”
  rationale: 该动词确可指发怒，但本节由情绪震动转向内省与静默，因此正文采用意义较宽的“战兢”；同时在脚注保留“发怒”的传统可能译法，不消除原文歧义。
- issue: אִמְרוּ בִלְבַבְכֶם是直译还是释义
  choice: 正文译作“在心里思想”
  alternative: “在心里说”
  rationale: 原文描写内心言说；“思想”在现代汉语中更自然地传达自省，但脚注保留直译，使读者看见原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“战兢”保留诗体与敬畏色彩；“在心里思想”避免机械照搬希伯来语习语；“静默”承接本节由震动转向安静的节奏。
