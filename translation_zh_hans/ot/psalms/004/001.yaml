  text: בְּ/קָרְאִ֡/י עֲנֵ֤/נִי אֱלֹ֘הֵ֤י צִדְקִ֗/י בַּ֭/צָּר הִרְחַ֣בְתָּ לִּ֑/י חָ֝נֵּ֗/נִי וּ/שְׁמַ֥ע תְּפִלָּתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/001.yaml
  text: When I call[a], answer me, O God of my righteousness. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
translation:
  language: zh_hans
  text: 我呼求的时候，求你应允我；我公义的上帝啊[a]！在困境中，你曾使我得着宽阔之地[b]。求你恩待我，垂听我的祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我那公义的上帝”或“为我伸冤的上帝”。希伯来文直译为“我公义的上帝”；此属格表达可指我的公义与上帝的关系，也可指上帝对我的申明或伸冤，并未限定为单一含义。
    reason: alternative_reading
  - marker: b
    text: 或译“你曾使我得宽舒”。希伯来文采用空间意象：上帝使人从狭窄困苦之中进入宽阔之地。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָרְאִי
  choice: 我呼求的时候
  rationale: ב 加不定式结构及第一人称单数后缀在此表示时间；“呼求”符合祷告语境，又不额外加强为更激烈的“哀号”。
- source_word: עֲנֵנִי
  choice: 求你应允我
  rationale: ענה 在此意为回答、回应；祷告语体中“应允我”自然且庄重。
- source_word: אֱלֹהֵי צִדְקִי
  choice: 我公义的上帝
  rationale: 尽量保留希伯来语“我的公义之上帝”的属格关系及开放性，不将其限定为上帝本身公义或上帝为诗人伸冤。
- source_word: בַּצָּר
  choice: 在困境中
  rationale: צַר 表示困苦、窘迫，也暗含狭窄受困的意象；“困境”在现代汉语中自然。
- source_word: הִרְחַבְתָּ לִּי
  choice: 你曾为我开出宽阔之地
  rationale: 保留 רחב“使宽阔”的空间隐喻，同时表达上帝使诗人脱离逼仄困境。完成式依语境译作“曾”。
- source_word: חָנֵּנִי
  choice: 求你恩待我
  rationale: חנן 的核心义是施恩、厚待；“恩待”比“怜悯”更贴近词义。
- source_word: וּשְׁמַע
  choice: 垂听
  rationale: שׁמע 在祷告中指留意并听取；“垂听”符合中文祷告语体，且不显陈旧。
- source_word: תְּפִלָּתִי
  choice: 我的祷告
  rationale: תְּפִלָּה 是祷告的常用词，直译自然。
theological_decisions:
- issue: אֱלֹהֵי צִדְקִי 的含义
  choice: 正文译作“我公义的上帝”
  alternative: “公义的上帝”或“为我伸冤的上帝”
  rationale: “我公义的上帝”保留原文属格表达的张力，可指上帝是诗人公义的源头或依据，也可涉及上帝为他申明公义；不在正文中限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“应允”“恩待”“垂听”保持诗篇语体；“开出宽阔之地”保留原文由狭窄转向宽阔的诗意意象。正文未添加[a]，因为现有中文措辞未另设该项脚注。
