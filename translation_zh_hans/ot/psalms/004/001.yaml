  to: 我呼求的时候，求你应允我；我公义的上帝啊[a]！在困境中，你曾使我得着宽阔之地[b]。求你恩待我，垂听我的祷告。
  rationale: 补回 [a] 脚注，以忠实呈现 אֱלֹהֵי צִדְקִי 的构式及其未决的语义关系，避免正文汉语自然地将其单义化为“公义的上帝”。将“开出宽阔之地”调整为“使我得着宽阔之地”，改善搭配而不削弱原文的宽阔空间意象。其余措辞忠实、自然，维持庄重祷告语体。
