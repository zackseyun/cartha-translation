id: PSA.4.8
reference: Psalms 4:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/שָׁל֣וֹם יַחְדָּו֮ אֶשְׁכְּבָ֪ה וְ/אִ֫ישָׁ֥ן כִּֽי אַתָּ֣ה יְהוָ֣ה לְ/בָדָ֑ד לָ֝/בֶ֗טַח תּוֹשִׁיבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/008.yaml
  text: In peace I will both lie down and sleep[a], for you alone, O Yahweh[b], make me dwell in safety.
translation:
  language: zh_hans
  text: 我必安然躺下入睡[a]，因为唯有你，耶和华[b]，使我安居无忧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “躺下入睡”中的希伯来语副词也可译为“一同”或“全然”；本译文按汉语习惯，将它理解为连接“躺下”和“睡觉”两个动作。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为你耶和华使我独自安然居住。”希伯来语中的“独自”也可能描述诗人的居住状态；正文则把它理解为“唯有你”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשָׁלוֹם
  choice: 安然
  rationale: שָׁלוֹם在此表示平安、安稳的状态；“安然”自然修饰“躺下入睡”，也呼应全诗从困苦转向安稳的语境。
- source_word: יַחְדָּו
  choice: 躺下入睡
  rationale: 该副词本义可为“一同、一起、全然”；在两个连续动词之间，可按汉语习惯把两项动作合为“躺下入睡”，传达二者相连发生的意味，同时在脚注保留字面歧义。
- source_word: אֶשְׁכְּבָה
  choice: 我必……躺下
  rationale: 未完成体在这里表达意愿或信靠中的确定；“必”体现诗人的坚定宣告。
- source_word: וְאִישָׁן
  choice: 入睡
  rationale: ישן在Qal词干中意为“睡觉”；与“躺下”连用时，“入睡”是自然、简洁的现代汉语。
- source_word: כִּי
  choice: 因为
  rationale: 引出诗人能够安然休息的原因。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的专名形式，保留四字神名作为名字而非仅以称号替代。
- source_word: לְבָדָד
  choice: 唯有你
  rationale: 主要理解为修饰第二人称主语，表示只有耶和华使诗人安全安居；通过脚注保留其也可能修饰诗人居住状态的句法可能。
- source_word: לָבֶטַח
  choice: 无忧
  rationale: בֶּטַח表示安全、安稳而无惧；“安居无忧”是自然汉语，并与前句的“安然”相呼应。
- source_word: תּוֹשִׁיבֵנִי
  choice: 使我安居
  rationale: 这是ישׁב的Hiphil使役形式，意为“使我居住”；“使我安居”兼顾使役语气和安全居住的上下文。
theological_decisions:
- issue: לְבָדָד的所指与修饰范围
  choice: 理解为修饰“你”：唯有耶和华使诗人安居无忧。
  alternative: 理解为修饰诗人的居住状态：耶和华使诗人独自安然居住。
  rationale: 词序与语境较支持“唯有你，耶和华”的理解，突出诗人单单倚靠耶和华；但希伯来文句法容许“独自居住”的读法，因此不在正文中强行消除，而以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“安然躺下入睡”保持流畅，“使我安居无忧”保留使役意义及安全居住的意象。正文保留神名“耶和华”，并用脚注明示两处真实的词汇和句法歧义。
