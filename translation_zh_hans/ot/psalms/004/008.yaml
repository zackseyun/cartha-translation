  source_fidelity: 译文准确传达了“在平安中躺下并睡觉”以及耶和华使诗人安全居住的因果关系。“我必”恰当地表达未完成体在此处所呈现的坚定、信靠性的宣告；“使我安居”也保留了תּוֹשִׁיבֵנִי（Hiphil）的使役含义。
  naturalness: “我必安然躺下入睡，因为唯有你，耶和华，使我安居无忧”在现代标准汉语中自然、庄重，符合诗歌和经文语体。“安居无忧”虽较“安全居住”略具意译色彩，但在此语境中自然地表达了לָבֶטַח的安稳、安全。
  terminology: “耶和华”是中文圣经中通行且明确对应יהוה的专名形式。“唯有你”妥当地体现正文所采纳的לְבָדָד修饰“你”的理解；脚注同时保留其可修饰诗人居住状态的句法可能，未消除原文歧义。脚注a也保留了יַחְדָּו可作“一同／全然”的词汇空间。
