source:
  edition: WLC
  text: זִבְח֥וּ זִבְחֵי צֶ֑דֶק וּ֝/בִטְח֗וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/005.yaml
  text: Offer sacrifices of righteousness[a], and trust in Yahweh.
translation:
  language: zh_hans
  text: 要献上公义的祭[a]，并要信靠耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“合宜的祭”，或“正义的祭”。
    reason: 词汇与句法上的合理替代译法；צֶדֶק 可表达公义、正义或正当合宜。
lexical_decisions:
- source_word: זִבְחוּ זִבְחֵי
  choice: 献上……祭
  rationale: 动词与名词同源，直译会近似“祭献祭物”，现代汉语不自然；“献上……祭”保留献祭行动及礼仪语义。
- source_word: צֶדֶק
  choice: 公义的
  rationale: “公义”兼具道德、盟约和正当秩序等含义，不将短语限缩为内心真诚或礼仪合规中的任何一种。
- source_word: וּבִטְחוּ
  choice: 并要信靠
  rationale: 复数命令式；“信靠”直接表达 בטח 所指向的倚赖与信任，并与前一命令平行。
- source_word: אֶל
  choice: —
  rationale: 此介词与“信靠”搭配时，其关系已自然包含在现代汉语及物结构“信靠耶和华”中，无须机械译为“向”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名最通行、最易识别的专名译法，而非以“主”这一称号替代。
theological_decisions:
- issue: “公义的祭”的含义
  choice: 保留为“公义的祭”，指具有公义或正当性质的祭，而不进一步限定。
  alternative: 译作“合宜的祭”“正当的祭”或“出于公义的祭”。
  rationale: 希伯来语构造可涉及敬拜者的伦理真诚、祭礼的合宜正当，或二者兼有；正文保留这种神学张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；两个“要”呈现复数命令式的劝诫力度。“公义的祭”稍具圣经语体，但可懂，并有助于保留原文歧义。
