  yaml_path: translation/ot/psalms/004/007.yaml
  text: You have put joy in my heart more than when their grain and their new wine abound[a].
translation:
  language: zh_hans
  text: 你赐给我心中的喜乐，胜过他们五谷和新酒丰盛时的喜乐[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“从他们的五谷和新酒增多的时候起，你把喜乐放在我心里。”希伯来语通常理解为比较：上帝所赐的喜乐，胜过物质丰裕带来的欢欣。
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: 你使……充满
  rationale: 这是 נתן 的 Qal 完成式第二人称阳性单数，直接称呼上帝。结合“喜乐”和“心里”，“使我心里充满”是自然的现代汉语，也保留上帝赐予喜乐及其持续果效。
- source_word: שִׂמְחָה
  choice: 喜乐
  rationale: 该名词表示喜悦、欢欣；“喜乐”庄重而通俗，适合诗篇中内在的欢悦。
- source_word: בְלִבִּי
  choice: 我心里
  rationale: לֵב 在这里指人的内在生命；“我心里”保留原文的内在位置，又不将其过度解释为单纯情绪或思想。
- source_word: מֵעֵת
  choice: 胜过……之时
  rationale: מִן 与 עֵת 在此通常构成比较，指出上帝所赐的喜乐超过物产丰盛时的欢欣；译文同时用脚注保留较直译的时间性理解。
- source_word: דְּגָנָם
  choice: 他们五谷丰登
  rationale: דגן 指谷物或粮食出产。“五谷”符合现代汉语农业语境；与 רָבּוּ 合译为“丰登”，自然表达产量增多。
- source_word: וְתִירוֹשָׁם
  choice: 新酒充盈
  rationale: תירוש 通常指新酒或新酿之酒，保留收获季节和物质丰裕的意象；“充盈”与复数动词 רָבּוּ 的增多之意相合。
- source_word: רָבּוּ
  choice: 丰登、充盈
  rationale: 这是 רבה 的 Qal 完成式第三人称复数，意为增多、丰盛。按两个并列名词分别译为“五谷丰登、新酒充盈”，兼顾准确与汉语诗体的自然节奏。
theological_decisions:
- issue: 本节比较结构的理解
  choice: 上帝赐给诗人内心的喜乐，胜过他人在五谷和新酒丰盛时所有的欢欣。
  alternative: 也可较贴字面地理解为：自从他们的五谷和新酒增多之时，你就把喜乐放在我心里。
  rationale: מֵעֵת 通常在这里引出比较的基准，这也契合上下文中信靠上帝与倚赖物质丰裕之间的张力；但原文形式仍容许时间性的直译，因此以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“五谷丰登、新酒充盈”形成平衡节奏；正文清楚表达主流的比较理解，脚注保留希伯来语可能呈现的时间性读法。
