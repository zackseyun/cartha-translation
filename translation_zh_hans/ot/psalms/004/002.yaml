source:
  edition: WLC
  text: בְּנֵ֥י אִ֡ישׁ עַד מֶ֬ה כְבוֹדִ֣/י לִ֭/כְלִמָּה תֶּאֱהָב֣וּ/ן רִ֑יק תְּבַקְשׁ֖וּ כָזָ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/002.yaml
  text: Sons of men[a], how long will my honor be turned into shame? Will you love emptiness and seek falsehood? Selah
translation:
  language: zh_hans
  text: 世人哪，你们要使我的尊荣[a]沦为羞辱到几时呢？你们还要喜爱虚空、追求虚假到几时呢？细拉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊荣”也可译作“荣耀”。希伯来语此词可指荣耀、尊荣或社会声望；这里不确定具体所指。
    reason: 保留כָּבוֹד的词义范围，以及诗人所说尊荣的具体性质和来源的开放性。
  - marker: b
    text: “细拉”的确切含义不明，可能是诗歌、音乐或礼仪中的提示语。
    reason: 保留来源词的不确定性，避免把传统音译误解为具有确定词义。
lexical_decisions:
- source_word: בְּנֵי אִישׁ
  choice: 世人之子
  rationale: 保留希伯来语“人之子”的复数称呼及其修辞力度；“世人”使现代汉语读者明白这是对人间敌对者的直接呼告。
- source_word: עַד מֶה
  choice: 要到几时呢
  rationale: 这是希伯来诗歌中表示抗议和责问的时间问句；译成现代汉语惯用的“要到几时呢”。
- source_word: כְבוֹדִי
  choice: 我的尊荣
  rationale: 该词可指荣耀、尊荣或分量；上下文涉及公开蒙羞，“尊荣”较能兼顾个人尊严与社会声望，又不限定其来源。
- source_word: לִכְלִמָּה
  choice: 变为羞辱
  rationale: 介词结构在此表达结果；补出“变为”，使汉语自然，同时不增加具体施事者。
- source_word: תֶּאֱהָבוּן
  choice: 还要喜爱
  rationale: 未完成式处于责问中，可表示持续或将继续的行为；“还要”承接“要到几时”的语气。
- source_word: רִיק
  choice: 虚空
  rationale: 既保留“空无、徒然、无价值”的诗性含义，也符合庄重而通俗的圣经汉语语域。
- source_word: תְּבַקְשׁוּ
  choice: 追求
  rationale: 在与“喜爱”平行的责问中，“追求”比单纯“寻找”更能表达主动趋附之意。
- source_word: כָזָב
  choice: 虚假
  rationale: 保留单数抽象名词的性质，并与“虚空”形成简洁的诗歌平行。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切功能不明，采用传统音译，不把它解释为某一确定的音乐或礼仪指示。
theological_decisions:
- issue: “我的尊荣”的所指
  choice: 不说明这是诗人自身的王室尊荣，还是上帝所赐的尊荣。
  alternative: 译作“我的荣耀”，或解释为“上帝赐给我的尊荣”。
  rationale: 希伯来文本只说“我的כבוד”，可涵盖尊荣、荣耀和社会地位；译文保留其来源与具体性质的开放性。
- issue: 第二、第三分句与“要到几时”的关系
  choice: 在第二个问句末重复“到几时呢”，使其自然统摄“喜爱虚空”和“追求虚假”两个平行行为。
  alternative: 只在第一问出现“要到几时”，后两句各作独立的是非问句。
  rationale: 原文的标点与诗歌句法可容许不同划分；汉语重复问语能清楚呈现持续责问的整体力度，但不改变两个动词的平行关系。
translation_notes:
  register: 采用现代、庄重且可朗读的诗歌语言。“世人之子”有意保留原文较突出的称呼方式；两个“到几时呢”强化连续责问，也使汉语句法清楚。“虚空／虚假”保留原文抽象名词的平行和音韵呼应。
