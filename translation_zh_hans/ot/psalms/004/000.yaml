  text: 'For the choirmaster: with stringed instruments. A psalm of David[a].'
translation:
  language: zh_hans
  text: 交给乐长，用弦乐器。大卫的诗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”也可译作“大卫所作的诗”或“为大卫而作的诗”；希伯来语可表示作者、归属、关联或题献。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 此词在诗篇标题中通常是给音乐领班或主管的指示。“乐长”简洁、庄重，也清楚体现礼仪音乐的语境。
- source_word: בִּנְגִינוֹת
  choice: 用弦乐器
  rationale: 该词在诗篇标题中指弦乐或弦乐器；此译法保留演奏指示，同时不额外限定具体乐器或演奏方式。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中常见的体裁名称，与音乐演奏有关；在中文圣经语境中译作“诗”自然、简明。
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 介词לְ可表示作者、归属、关联或题献。“大卫的诗”保留传统表达，并以脚注说明原文可能的不同关系，避免把含义仅限定为作者身份。
theological_decisions:
- issue: 标题中לְדָוִד所表达的大卫与本诗的关系
  choice: 大卫的诗
  alternative: 大卫所作的诗；为大卫而作的诗；与大卫有关的诗
  rationale: 希伯来语结构本身并未明确限定为直接作者关系。正文采用简洁传统的表达，脚注保留作者、归属或题献等可能性，不对历史或神学问题作超出原文的断定。
translation_notes:
  register: 采用现代、简洁而庄重的诗篇标题体。“乐长”比古雅的“伶长”更易为当代普通读者理解；标点将音乐指示与体裁及关联说明清楚分开。
