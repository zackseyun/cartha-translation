base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/006.yaml
  text: Many are saying[a], “Who will show us good? Lift up the light of your face upon us[c][b], O Yahweh.”
translation:
  language: zh_hans
  text: 许多人都在说：“谁能使我们得见福乐[a]？雅威[c]啊，求你使你面容的光照在我们身上[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我们得见”原文是使役形式，也可译作“向我们显明”。“福乐”可包括益处、安康和顺遂。
    reason: lexical_alternative
  - marker: b
    text: 原文的诗意表达较直译为“把你面容的光举起在我们之上”；“面容的光”描绘神施恩的临在和悦纳。
    reason: lexical_alternative
  - marker: c
    text: “雅威”是希伯来文神名YHWH的音译，传统上常译作“耶和华”或“主”。
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים אֹמְרִים
  choice: 许多人都在说
  rationale: רַבִּים在此作名词使用，指人数众多的一群人；分词אֹמְרִים带有持续或反复的意味，因此译为“都在说”，自然地保留其进行性。
- source_word: יַרְאֵנוּ טוֹב
  choice: 让我们看见美好
  rationale: יַרְאֵנוּ是ראה的使役形，基本意思是“使我们看见／让我们看见”；טוֹב在这里广指美好、益处或福乐，不限定为物质兴旺，故用概括性的“美好”。
- source_word: נְסָה עָלֵינוּ
  choice: 使……照在我们身上
  rationale: 希伯来语的诗意画面直译近于把光“举起／显在我们之上”。汉语若说“举起光”不自然，因此结合下文“面容的光”译成“使……照在我们身上”，保留神以光临到人的核心意象，并在脚注交代字面表达。
- source_word: אוֹר פָּנֶיךָ
  choice: 你面容的光
  rationale: 保留“面容”和“光”的拟人化诗歌意象，不在正文中直接化解为“恩宠”或“同在”。“面容”比“脸”更适合庄重诗体，同时仍是现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名YHWH，而不以“主”这一称号替代专名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列之神的专名。正文采用“雅威”保存专名性质；脚注说明传统译法，以便普通读者识别。
- issue: “你面容的光”这一拟人化表达
  choice: 在正文中保留“面容的光”
  alternative: 你的恩宠；你恩慈的同在
  rationale: 该意象既可表达神的恩宠，也可表达他施恩的临在。正文保留诗歌张力，不把含义缩减为单一抽象概念。
- issue: 引语范围
  choice: 把向雅威的祈求纳入众人的直接引语
  alternative: 在问句后结束引语，由诗人另行祈求
  rationale: 希伯来语没有现代引号，句法上两种划分并非绝对；连续的话语以及第二人称祈求可自然理解为众人所说的内容，因此采用这一连贯读法，但不据此增添说话者身份。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“许多人都在说”保留分词的持续感；问句和祈求置于同一段直接引语中。“面容的光”保留原文的具体意象，而“照在我们身上”使整句符合自然汉语，并由脚注补明更贴近字面的说法。
