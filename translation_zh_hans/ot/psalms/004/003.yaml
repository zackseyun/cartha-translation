  text: וּ/דְע֗וּ כִּֽי הִפְלָ֣ה יְ֭הוָה חָסִ֣יד ל֑/וֹ יְהוָ֥ה יִ֝שְׁמַ֗ע בְּ/קָרְאִ֥/י אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/003.yaml
  text: And know that Yahweh has set apart the godly for himself[b][a]; Yahweh hears when I call to him.
translation:
  language: zh_hans
  text: 你们要知道，雅威已把敬虔的人[a]分别出来，归他自己；我向他呼求时，雅威垂听我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“忠信者”或“忠贞者”。原词可强调对神的敬虔，也可强调盟约中的忠诚。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我向他呼求时，雅威必垂听我”。原文动词既可表示惯常的事实，也可表示确信的将来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְעוּ
  choice: 你们要知道
  rationale: ידע的复数祈使式，明确是对多人发出的命令；句首连接词在希伯来诗歌中可自然承接上文，不必机械译出“并且”。
- source_word: כִּי
  choice: （融入“知道”的宾语从句）
  rationale: 这里引出“知道”的内容；现代汉语无须另译“即/因为”，即可自然表达从句关系。
- source_word: הִפְלָה
  choice: 已把……分别出来
  rationale: פלא的使役式在此结合“归他自己”，最自然地表达使某人有别于众人、特别归属雅威；“已”体现完成式所陈述的既成事实。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译保留四字神名，而不以称号替代。
- source_word: חָסִיד
  choice: 忠信的人
  rationale: 该词描述以忠诚、敬虔和盟约之爱为特征的人；“忠信的人”保留其忠诚与信实色彩，又不强行限定为某一具体身份。
- source_word: לוֹ
  choice: 归他自己
  rationale: 介词加第三人称单数词尾在此表示特别归属于雅威；汉语用反身表达使所指清楚。
- source_word: יִשְׁמַע
  choice: 垂听
  rationale: 未完成式可表达惯常事实或确信将发生之事；“垂听”在祷告语境中自然表达雅威听见并回应，同时脚注保留将来理解。
- source_word: בְּקָרְאִי
  choice: 我……呼求时
  rationale: 介词ב加不定词构造及第一人称词尾表示时间情境，译为“我呼求时”符合现代汉语。
- source_word: אֵלָיו
  choice: 向他
  rationale: 介词表示呼求所朝向的对象；“向他呼求”简明自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神专名的性质，不以称号“主”替代。
- issue: חָסִיד的意义
  choice: 忠信的人
  alternative: 敬虔的人；忠贞者
  rationale: 该词兼含对神忠诚、敬虔以及盟约忠贞的色彩；正文采用宽广而自然的“忠信的人”，脚注说明其他可能侧重，避免缩窄其神学张力。
- issue: יִשְׁמַע的时态体意义
  choice: 垂听（惯常或现实确信）
  alternative: 必垂听（确信的将来）
  rationale: 希伯来语未完成式既可陈述惯常行动，也可表达对将来的确信；正文采用自然的现在陈述，脚注保留将来读法。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“你们”显明复数受众；“归他自己”保留归属关系；“垂听”符合祷告语境，但不在正文中过度解释为特定形式的回应。标点按现代汉语诗体处理。
