lexical_decisions:
- source_word: הֲדַר
  choice: 光辉
  rationale: 该词可指华美、尊荣或辉煌；在这一层叠的名词结构中，“光辉”自然表达其灿烂、壮美之意。
- source_word: כְּבוֹד
  choice: 荣耀的
  rationale: 该词在此处属于连续的属格结构，用“荣耀的”既保留其核心含义，也使中文表达顺畅。
- source_word: הוֹדֶךָ
  choice: 你威严
  rationale: הוֹד常指君王般的尊荣、威仪和华美；“威严”保留此处神圣君王的语感。
- source_word: וְדִבְרֵי נִפְלְאוֹתֶיךָ
  choice: 和你奇妙的作为
  rationale: דְּבָרִים语义范围包括话语、事情和事迹；与“奇事”连用时，这里自然指上帝令人惊奇的作为。译文不机械保留“话语”，但保留具体行动的含义。
- source_word: אָשִׂיחָה
  choice: 我都要默想
  rationale: שׂיח在Qal词形中既可表示沉思、默想，也可表示谈论、述说。上下文列出默想的对象，因此正文采用“默想”，并在脚注保留言说层面的可能。
