  text: שׁוֹמֵ֣ר יְ֭הוָה אֶת כָּל אֹהֲבָ֑י/ו וְ/אֵ֖ת כָּל הָ/רְשָׁעִ֣ים יַשְׁמִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/020.yaml
  text: Yahweh preserves all who love him[a], but all the wicked he will destroy.
translation:
  language: zh_hans
  text: 耶和华保护所有爱他的人，却[a]要毁灭所有恶人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并且要毁灭所有恶人。”希伯来语连接词通常译为“和”或“并且”，但在这里表达对比。
    reason: 保留连接词可按简单并列理解的词汇与句法可能性。
lexical_decisions:
- source_word: שׁוֹמֵר
  choice: 保护
  rationale: 该分词表示持续的看守、保全和护佑；“保护”在现代汉语中自然、明确，也与下半句的“毁灭”形成对照。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: אֶת כָּל אֹהֲבָיו
  choice: 所有爱他的人
  rationale: 忠实表达“所有爱他者”，并采用自然的现代汉语关系结构。
- source_word: וְאֵת כָּל הָרְשָׁעִים
  choice: 却……所有恶人
  rationale: וְ字面可作“和”，但此处连接的两句在语义上构成鲜明反衬；“却”自然传达这一关系。
- source_word: יַשְׁמִיד
  choice: 要毁灭
  rationale: 使役词形表达使之灭亡；“毁灭”保留原文的强度，又不额外限定毁灭的方式或范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；中文正文采用广为人知且具有专名性质的“耶和华”，不以“主”等称号替代。
- issue: 第二分句前连接词的语义作用
  choice: 反义转折（“却”）
  alternative: 简单并列（“和”）
  rationale: 希伯来语连接词形式上是“和”，但保护爱神者与毁灭恶人之间构成诗歌性的对照；正文用“却”表达其语篇功能，同时以脚注保留形式上的另一译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“保护”与“毁灭”形成简洁有力的平行对照；正文中的脚注标记[a]与脚注完全对应。
