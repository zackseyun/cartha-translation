  text: כְּב֣וֹד מַלְכוּתְ/ךָ֣ יֹאמֵ֑רוּ וּ/גְבוּרָתְ/ךָ֥ יְדַבֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/011.yaml
  text: They will speak of the glory of your kingdom[b][a], and talk of your might.
translation:
  language: zh_hans
  text: 他们要述说你国度的荣耀[a]，谈论你的大能[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “国度”或译“王权”或“统治”。
    reason: lexical_alternative
  - marker: b
    text: “大能”或译“能力”或“威力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹד
  choice: 荣耀
  rationale: כָּבוֹד可指荣耀、尊荣或威荣；在颂赞上帝王权的语境中，“荣耀”自然庄重，也保留其威严与尊荣的含义。
- source_word: מַלְכוּתְךָ
  choice: 你的国度
  rationale: מַלְכוּת可指国度、王权或统治。“你的国度”是现代中文中自然且传统的表达，同时不排除上帝掌权和施行统治的含义。
- source_word: יֹאמֵרוּ
  choice: 他们要述说
  rationale: אָמַר基本义为“说”；此处与下半句形成诗歌平行，“述说”符合颂赞语境，并以“要”保留未完成式可表达的将来或持续倾向。
- source_word: גְבוּרָתְךָ
  choice: 你的大能
  rationale: גְּבוּרָה可指能力、威力或英勇作为。原文为单数抽象名词，“大能”既自然，也避免将其具体化为“大能的作为”。
- source_word: יְדַבֵּרוּ
  choice: 谈论
  rationale: דָּבַר意为说、讲论。“谈论”与前句“述说”构成有变化的平行表达，又不额外加入“宣告”所带的强烈公开宣示意味。
theological_decisions:
- issue: מַלְכוּת用于上帝时是领域、王权还是统治
  choice: 译作“国度”
  alternative: “王权”或“统治”
  rationale: 原词涵盖王的领域、身份与统治行动。正文采用较自然且广为理解的“国度”，脚注保留“王权”和“统治”的可能性，不把原文限定为单一神学概念。
- issue: גְּבוּרָה指内在能力还是大能作为
  choice: 译作抽象的“大能”
  alternative: “能力”、“威力”或“大能的作为”
  rationale: 原文单数形式最直接地指能力或威势；译为“大能”保留抽象性，避免未经明示便解释为具体事迹。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“述说／谈论”保存希伯来文两个近义动词的平行变化；句式简洁，适合诗篇颂赞语体。
