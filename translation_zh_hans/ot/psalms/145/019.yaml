  text: רְצוֹן יְרֵאָ֥י/ו יַעֲשֶׂ֑ה וְֽ/אֶת שַׁוְעָתָ֥/ם יִ֝שְׁמַ֗ע וְ/יוֹשִׁיעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/019.yaml
  text: He fulfills the desire of those who fear him[b][a]; he hears their cry for help and saves them.
translation:
  language: zh_hans
  text: 他成全敬畏他的人的心愿；他听见他们求救的呼声，拯救他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְצוֹן
  choice: 心愿
  rationale: 这里指敬畏上帝之人所盼望、所求的事；“心愿”在现代汉语中自然，也适合与“成全”搭配。
- source_word: יְרֵאָיו
  choice: 敬畏他的人
  rationale: 保留希伯来文“惧怕／敬畏”的宗教用语及其圣约敬虔含义，不弱化为单纯的“尊敬”。
- source_word: יַעֲשֶׂה
  choice: 成全
  rationale: 该动词字面为“做、实行”，但与רְצוֹן连用时，汉语用“成全心愿”准确而自然。
- source_word: שַׁוְעָתָם
  choice: 他们求救的呼声
  rationale: 该词表示人在困苦中为得拯救而发出的呼喊；“求救的呼声”明确呈现其处境与诉求。
- source_word: יִשְׁמַע
  choice: 他听见
  rationale: 保留“听”的基本词义；上下文自然包含垂听并回应的意味，无须在译文中额外解释。
- source_word: וְיוֹשִׁיעֵם
  choice: 拯救他们
  rationale: 使役形动词表示使人得救、救拔或解救；“拯救”涵盖面较广，并保留诗篇中的神学力度。
theological_decisions:
- issue: 如何翻译敬虔者的“惧怕”用语
  choice: 敬畏他的人
  alternative: 尊崇他的人
  rationale: 原文明确使用“惧怕／敬畏”词根；“敬畏”既符合现代汉语宗教语境，也保留顺服与敬虔的张力。
- issue: וְיוֹשִׁיעֵם所指拯救的范围
  choice: 拯救他们
  alternative: 救他们脱离困境
  rationale: 原文可泛指从危难中施行救援，不必限定为某一种救恩；“拯救”保留其广度及正典神学共鸣，而不把即时处境排除在外。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文；两分句保持希伯来文的平行结构。“成全……心愿”与“听见……呼声，拯救……”表达自然，同时避免把应许解释为不受上下文约束的欲望满足。
