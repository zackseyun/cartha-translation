  text: לְ/הוֹדִ֤יעַ לִ/בְנֵ֣י הָ֭/אָדָם גְּבוּרֹתָ֑י/ו וּ֝/כְב֗וֹד הֲדַ֣ר מַלְכוּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/012.yaml
  text: to make known to the sons of man his mighty acts and the glorious splendor of his kingdom[a].
translation:
  language: zh_hans
  text: 为要使世人知道他大能的作为，以及他国度威严的荣耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהוֹדִיעַ
  choice: 使……知道
  rationale: 希菲尔式不定词带使役意义；“使……知道”直接保留“使之知晓”的语义，也符合现代汉语表达。
- source_word: לִבְנֵי הָאָדָם
  choice: 世人
  rationale: 希伯来语字面为“人的众子”，在此泛指全人类；现代汉语“世人”自然、庄重，并不把所指误限于男性。
- source_word: גְּבוּרֹתָיו
  choice: 他大能的作为
  rationale: 该词指彰显能力的行动或伟业；“大能的作为”兼顾能力与具体行动，适合赞美诗语境。
- source_word: וּכְבוֹד הֲדַר
  choice: 荣耀的威严
  rationale: כבוד与הדר构成密集的荣耀、华美和尊荣意象；“荣耀的威严”保留两个词的语义层次，同时避免生硬叠加。
- source_word: מַלְכוּתוֹ
  choice: 他的国度
  rationale: מַלְכוּת可指王权、统治或国度；本诗的君王颂赞语境中，“国度”自然且能涵盖其统治领域与王权。
theological_decisions:
- issue: לִבְנֵי הָאָדָם所表达的泛指人类
  choice: 正文译作“世人”
  alternative: 较逐字地译作“人的众子”或“人之子孙”
  rationale: 原短语虽采用阳性代表性表达，实际所指是人类整体。汉语若直译为“人的众子”既不自然，也可能被误解为只指男性；“世人”准确传达其泛指范围，未加入宗派性解释。
- issue: מַלְכוּת的语义范围
  choice: 译作“国度”
  alternative: 译作“王权”或“统治”
  rationale: 上下文同时容纳神的王权、治理及其领域；“国度”保留这种宽度，不将意义单独限定为抽象王权或统治行为。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“为要使”承接本节在上下文中的目的关系；语序尽量贴近希伯来文，同时使中文流畅。原文的泛指人类表达已由“世人”清楚传达，因此不另设脚注。
