  text: טוֹב יְהוָ֥ה לַ/כֹּ֑ל וְ֝/רַחֲמָ֗י/ו עַל כָּל מַעֲשָֽׂי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/009.yaml
  text: Yahweh is good to all[a], and his mercies are over all his works.
translation:
  language: zh_hans
  text: 雅威对万有都是良善的；他的怜悯[a]临到他一切的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怜悯”或译“慈悲”“深切的怜悯”。希伯来语在这里使用复数形式，凸显雅威丰富的怜悯及其种种表现。
    reason: 说明 רַחֲמָיו 的词义选择及原文复数形式在汉语中无法直接呈现的意味。
lexical_decisions:
- source_word: טוֹב
  choice: 良善
  rationale: 保留该词兼具道德美善与施恩惠益的宽广含义；在谓语结构中译为“良善”，不将意义缩窄为单纯的“仁慈”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行拟音译出其专名性质，不以“主”这一称号替代，也不采用对应 Jehovah 的“耶和华”。
- source_word: לַכֹּל
  choice: 对万有
  rationale: 介词 ל 表明良善所指向的对象；“对万有”自然地保留范围的普遍性。“万有”在此可涵盖一切受造之物。
- source_word: רַחֲמָיו
  choice: 他的怜悯
  rationale: רחמים 表示出于深切慈悲的怜悯，在希伯来语中为复数形式。汉语通常以不可数的“怜悯”表达，复数所带出的丰富意味通过脚注说明。
- source_word: עַל
  choice: 遍及
  rationale: 此处表示雅威的怜悯临在并延及其一切作为；“遍及”既符合现代汉语，也与上下句的普遍范围相呼应。
- source_word: כָּל
  choice: 一切
  rationale: 保留其全称、无遗漏的范围，并与上句“万有”形成自然的诗意复现。
- source_word: מַעֲשָׂיו
  choice: 他所造的
  rationale: מַעֲשֶׂה 可指行为、作为或作品；本节谈及普遍的恩惠与怜悯，语境中较自然地指向一切受造之物。译文以“他所造的一切”清楚表达这一语境义，同时承认原词本身可有较宽的“作为”之义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其为以色列之神专名的性质，并对应 Yahweh 的拟音；不以称号“主”替换，也不采用源自 Jehovah 传统形式的“耶和华”。
- issue: “万有”是否仅指人类
  choice: 保留涵盖一切受造之物的普遍范围
  alternative: 理解为所有人
  rationale: 上下两行以 לַכֹּל 与 כָּל מַעֲשָׂיו 相互呼应，后者自然扩展到神的一切作品或受造物。译文不把范围缩限为人类，也不进一步推导有关救恩结局的命题。
- issue: מַעֲשָׂיו 的语义范围
  choice: 他所造的一切
  alternative: 他的一切作为
  rationale: 在本诗赞美神普遍恩惠的语境中，受造物之义较为自然；但原词也能指行为或作为，因此此选择属于语境判断，不用它消除原词本身的语义宽度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“对万有都是良善的”保留原文的陈述性质，避免把 טוֹב 仅处理为行动性的“善待”；“遍及”使 עַל 在汉语中自然，并维持两行诗对普遍范围的强调。脚注标记紧随其所解释的“怜悯”。
