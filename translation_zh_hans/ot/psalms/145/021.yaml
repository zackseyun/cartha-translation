  text: תְּהִלַּ֥ת יְהוָ֗ה יְֽדַבֶּ֫ר פִּ֥/י וִ/יבָרֵ֣ךְ כָּל בָּ֭שָׂר שֵׁ֥ם קָדְשׁ֗/וֹ לְ/עוֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/021.yaml
  text: My mouth will speak the praise of Yahweh[a], and all flesh will bless his holy name forever and ever.
translation:
  language: zh_hans
  text: 我的口要述说雅威[a]的赞美；一切有血肉的都要称颂他的圣名，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה 的常见拟音译法；“耶和华”是传统中文译法。
    reason: 说明神名译法
lexical_decisions:
- source_word: תְּהִלַּת
  choice: ……的赞美
  rationale: 该词为与“耶和华”相连的构造形式，表示归给或指向耶和华的赞美；此译保留原文关系，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: יְדַבֶּר
  choice: 要述说
  rationale: 未完成式在诗篇结语中可表达将来的行动或坚定志愿；“要述说”兼具宣告意味与庄重语体。
- source_word: פִּי
  choice: 我的口
  rationale: 保留原文具体的身体意象，不简化为“我”。
- source_word: וִיבָרֵךְ
  choice: 都要称颂
  rationale: ברך以受造者为主语、以上帝之名为对象时，意为颂赞、称颂；“都要”承接前句的宣告语气。
- source_word: כָּל בָּשָׂר
  choice: 凡有血肉的
  rationale: 保留希伯来诗歌“所有血肉”的具象表达及其普遍范围；该说法可泛指一切必朽的生命，语义范围不宜在正文中限定为人类。
- source_word: שֵׁם קָדְשׁוֹ
  choice: 他的圣名
  rationale: 自然、凝练地表达“他圣洁的名”，保留神之名所承载的身份与圣洁意义。
- source_word: לְעוֹלָם וָעֶד
  choice: 直到永永远远
  rationale: 保留原文加强式的无尽时长；“永永远远”是现代中文中庄重而易懂的固定表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名，正文因此采用中文圣经传统中最广为人知的音译“耶和华”，而不以称号“主”替代；脚注交代另一常见拟音“雅威”，避免把不确定的古代读音说成定论。
- issue: כָּל בָּשָׂר 的范围
  choice: 凡有血肉的
  alternative: 所有人／一切活物
  rationale: 原文的诗性说法可能泛指全人类，也可能具有更广的受造生命范围；正文保留其开放性，不擅自缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“我的口”与“凡有血肉的”保留希伯来诗歌的具体意象；分号呈现两个平行分句。
