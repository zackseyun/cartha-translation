  text: עֵֽינֵי כֹ֭ל אֵלֶ֣י/ךָ יְשַׂבֵּ֑רוּ וְ/אַתָּ֤ה נֽוֹתֵן לָ/הֶ֖ם אֶת אָכְלָ֣/ם בְּ/עִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/015.yaml
  text: The eyes of all look to you[b][a], and you give them their food in its time.
translation:
  language: zh_hans
  text: 一切的眼目都仰望你[a]；你按时赐给他们食物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“等候你”“期待地望向你”或“寄望于你”。希伯来语动词含有期待等候的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在它的时候”；也可译：“在适当的时候”或“到了时候”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי כֹל
  choice: 众人的眼睛
  rationale: 贴近原文，保留“眼睛”这一鲜明意象；“众人”在现代汉语中自然，但不在正文中进一步限定为人类或一切活物。
- source_word: אֵלֶיךָ יְשַׂבֵּרוּ
  choice: 都仰望你
  rationale: יְשַׂבֵּרוּ 表达带着期待的等候；与“眼睛”连用时，“仰望”既自然地延续视觉意象，也包含倚望、期待之意。脚注保留“等候你”等词义可能。
- source_word: וְאַתָּה
  choice: 你
  rationale: 希伯来语连接词在此承接上下句；汉语用分号并省去显式的“而”，更符合诗体表达，又不引入转折含义。
- source_word: נֹתֵן
  choice: 赐给
  rationale: 分词表达持续或一贯的行动；“赐给”在向上帝陈说的庄重语体中自然，并保持 נתן“给”的基本含义。
- source_word: אָכְלָם
  choice: 他们食物
  rationale: 指供食用之物，并非专指饼或粮；现代汉语用“食物”准确自然。
- source_word: בְּעִתּוֹ
  choice: 按时
  rationale: 简洁表达“在其时候”；希伯来语第三人称单数后缀所指可理解为食物供应的适当或指定时间，脚注说明较直译的形式。
theological_decisions:
- issue: “众／一切”的指涉范围
  choice: 正文译作“众人”，不明确限定为全人类或一切活物
  alternative: 一切活物的眼睛／所有人的眼睛
  rationale: כֹל 的所指在本节中省略。上下文可支持广泛的受造物范围，但本节本身没有明说；译文不加“活物”，以保留原文的开放性。
- issue: יְשַׂבֵּרוּ 中期待和盼望的意味
  choice: 译作“仰望”，借汉语词本身兼顾观看与期待
  alternative: 等候你／满怀希望地望向你／寄望于你
  rationale: 原词不只是普通观看，而有期待等候之意；“仰望”在此既配合“眼睛”，也不把“希望”的内容过度明说。
- issue: בְּעִתּוֹ 的时间关系
  choice: 按时
  alternative: 在它的时候／在适当的时候／到了时候
  rationale: 后缀为阳性单数，但其具体所指并不完全显明。“按时”保留合宜、应时的含义，不强行判定是食物本身的季节还是上帝所定的时刻。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以分号呈现两小句的平衡关系；“仰望”保留视觉意象和期待意味。“赐给”适合对上帝的直接陈说。所有脚注标记均置于相关正文之后。
