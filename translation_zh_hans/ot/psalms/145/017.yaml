base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/017.yaml
  text: Yahweh is righteous in all his ways and faithful in all his works[a].
translation:
  language: zh_hans
  text: 雅威在他一切道路上都公义；在他一切作为中都信实[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“慈爱”或“恩慈”。有些译本作“圣洁”，反映与马所拉文本不同的文本传统；马所拉文本此处的词可表达信实、忠贞或慈爱的特质。
    reason: 说明חָסִיד的可译语义，并保留“圣洁”这一不同文本传统的读法，避免将其混同于马所拉文本。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现上帝的专名，而不以“主”这一称号代替；“雅威”也较贴近该名通常重构的读音。
- source_word: צַדִּיק
  choice: 公义
  rationale: 表达道德上的正直与行事公正，并保留诗篇赞美语境中的神学分量。
- source_word: בְּכָל דְּרָכָיו
  choice: 在他一切所行的事上
  rationale: 这里的“道路”指行事方式；译作“所行的事”在现代汉语中更自然，同时保留范围义“一切”。
- source_word: חָסִיד
  choice: 信实
  rationale: 该词表示具有חסד特质，可涵盖忠贞、慈爱和恩慈；在与“公义”平行并描述上帝作为的语境中，“信实”较能表达可靠而坚定的善意，同时以脚注保留其他可能。
- source_word: בְּכָל מַעֲשָׂיו
  choice: 在他一切作为中
  rationale: “作为”准确表达其行动或所做之事，并与上半句形成庄重、自然的诗体平行。
theological_decisions:
- issue: 描述上帝品格的חָסִיד如何翻译
  choice: 信实
  alternative: 慈爱、恩慈；另有文本传统作“圣洁”
  rationale: 马所拉文本作חָסִיד，并非“圣洁”所对应的词。“信实”凸显坚定可靠的忠诚，但该词也确有慈爱、恩慈的语义色彩，因此不在正文中排除这些理解，而在脚注中说明；“圣洁”则属于不同文本传统。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。两分句保持希伯来诗歌的平行结构；“在……上／在……中”保留原文所表达的范围关系，同时避免生硬直译。
