base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/013.yaml
  text: Your kingdom is a kingdom of all ages[b][a], and your dominion is through every generation.
translation:
  language: zh_hans
  text: 你的国是万世之国[a]；你的统治及于世世代代[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的国是永恒的国。”原文直译为“你的国是万世之国”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“从这一代到那一代。”原文直译近似“在每一代又一代中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכוּתְךָ
  choice: 你的国
  rationale: מַלְכוּת既可指王国，也可指王权或统治；译作“你的国”自然凝练，并与下半句“你的统治”形成诗意对应。
- source_word: מַלְכוּת
  choice: 是……之国
  rationale: 保留原文“你的国是……之国”的名词重复，以传达强调和诗歌节奏，不将其完全压缩为“永恒”。
- source_word: כָּל עֹלָמִים
  choice: 万世
  rationale: 复数עֹלָמִים表达跨越一切世代、没有止境的久远时间；“万世”既保留原文的时代意象，也符合现代中文庄重诗体。
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: 你的统治
  rationale: מֶמְשָׁלָה指治理、管辖或统治权；“统治”在中文中清楚自然，并避免把它局限为行政意义上的“政府”。
- source_word: בְּכָל דּוֹר וָדֹר
  choice: 直到万代
  rationale: 原文直译近似“在每一代又一代”，是表示世世代代持续不断的惯用语；“直到万代”简洁地传达其延续性。
theological_decisions:
- issue: 上帝国度与统治持续时间的表达
  choice: 以“万世”和“万代”表达其跨越一切时代、世代不息
  alternative: 你的国是永恒的国；你的统治世世代代长存
  rationale: 原文明确宣告上帝王权的恒久，却采用“诸世”和“代代”的诗性语言。正文保留这些时间意象，不另行引入超出希伯来诗句的后期教义表述。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。保留上下两行“国／统治”和“万世／万代”的平行结构；没有为原文无动词的下半句增添“长存”等明示动词。
