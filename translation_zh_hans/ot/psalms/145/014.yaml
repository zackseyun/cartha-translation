base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/014.yaml
  text: Yahweh supports all who are falling and raises up all who are bowed down[a].
translation:
  language: zh_hans
  text: 耶和华扶持所有正在跌倒的人，使所有弯腰屈身的人直起身来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华扶持所有跌倒的人，使所有弯腰的人直起身来。”希伯来语分词可泛指这类人，也可表示持续的动作或状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式译出四字神名，不以“主”这一称号替代。
- source_word: סוֹמֵךְ
  choice: 扶持
  rationale: 该分词表示持续或惯常的支撑行动；“扶持”自然、庄重，也与将要跌倒者的意象相合。
- source_word: לְכָל
  choice: 所有
  rationale: 介词与“所有”在此标明动作所及的全部对象，中文无需逐字译出介词。
- source_word: הַנֹּפְלִים
  choice: 将要跌倒的人
  rationale: 保留希伯来语分词可表达正在跌倒或濒临跌倒的动态意味，避免直接解释成已经“跌倒的人”。
- source_word: זוֹקֵף
  choice: 使……挺起身来
  rationale: 该动词意为使弯曲者直立；此译法保留与“被压弯”相对的身体意象，同时容纳比喻意义。
- source_word: הַכְּפוּפִים
  choice: 被压弯的人
  rationale: 保留被动的弯腰、屈身意象，而不把原因限定为受压迫、悲伤或重担。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名；正文保留专名而不以“主”代替。“耶和华”是现代中文读者最熟悉且可辨识的传统音译。
- issue: הַנֹּפְלִים 所指的状态
  choice: 将要跌倒的人
  alternative: 跌倒的人
  rationale: 分词容许正在跌倒、常会跌倒或濒临跌倒等理解；正文突出动态而不将对象限定为已经倒下者，脚注保留较概括的译法。
- issue: הַכְּפוּפִים 的比喻范围
  choice: 被压弯的人
  alternative: 受压迫的人
  rationale: 原文描绘弯腰屈身的状态，但未明确造成这种状态的原因；保留形象可同时涵盖身体和比喻层面。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。两个分句保留平行结构，并以“扶持／挺起身来”和“跌倒／被压弯”再现原文的动作与身体意象；脚注说明分词时态体意义及可行的较概括译法。
