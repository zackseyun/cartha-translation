  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד וְ֝/לִ/גְדֻלָּת֗/וֹ אֵ֣ין חֵֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/003.yaml
  text: Great is Yahweh[a], and greatly to be praised, and his greatness is unsearchable.
translation:
  language: zh_hans
  text: '雅威伟大，深受赞美；

    他的伟大无法穷尽地探究。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对于他的伟大，没有穷尽的探究。”
    reason: 较贴近希伯来文“对他的伟大没有查究”的句法，并保留其探究不可穷尽的含义。
lexical_decisions:
- source_word: גָּדוֹל
  choice: 伟大
  rationale: 这是置于句首的谓语形容词，既表达宏大，也表达崇高；“伟大”直接、自然，不额外限定其含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见现代汉语音译处理，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: מְהֻלָּל מְאֹד
  choice: 极当受赞美
  rationale: מְהֻלָּל是הלל的被动分词，מְאֹד加强程度；“极当受赞美”在现代汉语中庄重自然，并保留强烈的赞美语气。
- source_word: לִגְדֻלָּתוֹ
  choice: 他的伟大
  rationale: 保留名词“伟大”，使本节前后两处同根词גָּדוֹל和גְדֻלָּה形成呼应。
- source_word: אֵין חֵקֶר
  choice: 无法测度
  rationale: 该表达字面上说，对其伟大“没有探究/测究”；“无法测度”简洁地表达不能穷尽考察的含义，同时不把它窄化为仅仅没有数量界限。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”以音译保留专名，不用称号替换；“耶和华”是传统音译，但较不贴近学界通常重构的读音。
- issue: 神的伟大“无法测度”的范围
  choice: 保留不可穷尽探究的表述
  alternative: 他的伟大没有限量
  rationale: חֵקֶר侧重探究、查考，而不只是尺寸或数量上的无限；因此译文保留认识与探究不能穷尽的张力，不进一步作形而上定义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以分号和换行呈现两组并列陈述；保留“伟大”一词的重复，以反映希伯来文的词根呼应。
