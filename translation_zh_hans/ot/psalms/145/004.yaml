base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/004.yaml
  text: Generation to generation will praise your works[b][a], and will declare your mighty acts.
translation:
  language: zh_hans
  text: 一代要向一代颂扬你的作为，并述说你的大能之举。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能之举”也可译作“大能的作为”或“彰显能力的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר לְדוֹר
  choice: 一代要向一代
  rationale: 保留希伯来语“代”字重复及第二个词前介词 לְ 所表达的代际传递关系；现代汉语自然且有诗意。
- source_word: יְשַׁבַּח
  choice: 颂扬
  rationale: שׁבח 的加强词干表示称颂、赞美；“颂扬”符合诗篇庄重语体，也能自然支配“作为”。
- source_word: מַעֲשֶׂיךָ
  choice: 你的作为
  rationale: מַעֲשֶׂה 指所做之事、行动或工作；“作为”简洁地保留名词形式，并适合指上帝的行动。
- source_word: וּגְבוּרֹתֶיךָ
  choice: 你的大能之举
  rationale: גְּבוּרוֹת 指力量的彰显或英勇有力的行动；“大能之举”兼顾能力与具体行动。
- source_word: יַגִּידוּ
  choice: 述说
  rationale: נגד 的使役词干有使人知道、讲述之意；“述说”符合诗歌语体，并与“颂扬”构成自然平行。
