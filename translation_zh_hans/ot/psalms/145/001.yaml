source:
  edition: WLC
  text: תְּהִלָּ֗ה לְ/דָ֫וִ֥ד אֲרוֹמִמְ/ךָ֣ אֱלוֹהַ֣/י הַ/מֶּ֑לֶךְ וַ/אֲבָרֲכָ֥ה שִׁ֝מְ/ךָ֗ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/001.yaml
  text: A praise of David[a]. I will exalt you, my God the King[d][c][b], and I will bless your name forever and ever.
translation:
  language: zh_hans
  text: '大卫的赞美诗[a]。


    我的神，君王啊，我要尊崇你[b]；


    我要称颂你的名，永永远远。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的”也可理解为“大卫所作的”或“与大卫有关的”；希伯来文诗题中的介词可表达作者、归属或关联。
    reason: 保留诗题 לְדָוִד 的语义范围，避免武断确定作者关系。
  - marker: b
    text: 原文直译为“我要尊崇你，我的神，那君王”；“君王”是“我的神”的同位称呼。也可译作“我的神、我的王啊，我要尊崇你”，以符合汉语习惯，但该译法补出了“我的”这一所属表达。
    reason: 说明 אֱלֹהַי הַמֶּלֶךְ 的同位结构，并区分较贴近原文的表达与为汉语流畅而补入所属关系的替代译法。
lexical_decisions:
- source_word: תְּהִלָּה
  choice: 赞美诗
  rationale: 这里是诗篇标题；用“赞美诗”既保留名词性质，也符合现代汉语对诗歌体裁的自然表达。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 标题中的 לְ 可表示作者、归属或关联。“大卫的”比“大卫所作”更能保留原文的开放性。
- source_word: אֲרוֹמִמְךָ
  choice: 我要尊崇你
  rationale: רומם 表示高举、尊为至高；“尊崇”自然庄重，也适合敬拜语境。
- source_word: אֱלוֹהַי הַמֶּלֶךְ
  choice: 我的神，君王啊
  rationale: 将“君王”理解为“我的神”的同位称呼，保留定冠词所表达的特指，同时避免在“君王”前擅加原文没有的第一人称所属成分。
- source_word: וַאֲבָרֲכָה
  choice: 我要称颂
  rationale: ברך 用于人对神时指颂赞、称颂；“称颂”比直译“祝福”更符合现代汉语习惯，又保留敬拜含义。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 保留圣经中“名”的重要表达，涵盖神所彰显的身份、声誉与作为，而不作解释性改写。
- source_word: לְעוֹלָם וָעֶד
  choice: 直到永永远远
  rationale: 这一成对表达强调无尽的持续性；“直到永永远远”自然地保留其加强语气。
theological_decisions:
- issue: “我的神”与“君王”的关系
  choice: 以同位呼语译作“我的神，君王啊”
  alternative: “我的神、我的王啊”或“我的神，那位君王”
  rationale: 希伯来文 אֱלוֹהַי הַמֶּלֶךְ 最自然地把“君王”作为“我的神”的同位说明。“我的王”会补入原文未明说的所属成分，“那位君王”则会补入较强的指示意味。正文保留同位关系，并以脚注说明字面结构。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语言。诗题独立成行，正文以分行和分号呈现平行结构；避免古奥的“颂赞尔”等表达，也不把希伯来文中的同位结构改写为带有额外神学限定的称号。
