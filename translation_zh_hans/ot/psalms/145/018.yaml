  text: קָר֣וֹב יְ֭הוָה לְ/כָל קֹרְאָ֑י/ו לְ/כֹ֤ל אֲשֶׁ֖ר יִקְרָאֻ֣/הוּ בֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/018.yaml
  text: Yahweh is near to all who call on him[a], to all who call on him in truth.
translation:
  language: zh_hans
  text: 耶和华亲近所有求告他的人，亲近所有真诚求告他的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真诚”也可译作“真实地”、“按真理”或“忠诚地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: 亲近
  rationale: 谓语形容词，意为“近”。在本诗祷告与关系性的语境中，“亲近”比单纯的空间表达“靠近”更自然，同时仍保留临近、可亲近的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: לְכָל
  choice: 所有……的人
  rationale: לְ在此表示与人的关系；结合כָל译成“所有……的人”，自然地保留两行反复出现的普遍范围。
- source_word: קֹרְאָיו
  choice: 求告他的人
  rationale: קרא在向神祷告、呼求的语境中译作“求告”准确而庄重；后缀所指的“他”明确呈现。
- source_word: אֲשֶׁר יִקְרָאֻהוּ
  choice: 求告他的人
  rationale: 与上半句采用相同措辞，以保留希伯来诗歌的重复和平行结构。
- source_word: בֶאֱמֶת
  choice: 真诚
  rationale: אֱמֶת可指真实、真诚或忠信。此处作方式状语，“真诚求告”是自然的现代汉语，并表达并非虚假地求告；脚注保留“按真理”及“忠诚”等可能含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。译文采用中文读者广泛熟悉的专名“耶和华”，避免以称号“主”取代神名。
- issue: 神亲近之人的范围
  choice: 保留“所有求告他的人”，并由“真诚求告”进一步限定
  alternative: 将范围限于特定群体；或泛化为神亲近所有人而不论是否求告
  rationale: 原文先用“所有求告他的人”陈明范围，后半句以בֶאֱמֶת加以限定。译文不按外加的神学体系缩窄或扩大这一范围。
- issue: בֶאֱמֶת的神学与语义张力
  choice: 正文译“真诚”，脚注列出“按真理”“忠诚地”等可能理解
  alternative: 仅译作“按真理”或“忠诚地”
  rationale: 该词兼有真实、真理、可靠和忠信等语义。正文需自然可懂，但脚注避免把原文的多重含义局限为单一解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“亲近”与“求告”适合诗篇的敬虔语域；重复“亲近所有……的人”以显出原文两行的平行和强调。脚注标记置于整句末尾，对应“真诚”的词义选择。
