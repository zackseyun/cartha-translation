  yaml_path: translation/ot/psalms/145/016.yaml
  text: You open your hand and satisfy the desire of every living thing[a].
translation:
  language: zh_hans
  text: 你张开你的手，满足一切活物的愿望。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以恩惠使一切活物饱足”，或“以美意使一切活物饱足”。希伯来词可指“愿望”“恩惠”或“美意”；本句语境强调上帝供应众生，因此正文采用“愿望”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹתֵחַ
  choice: 张开
  rationale: Qal分词在诗歌中描述上帝持续、惯常的作为；“张开”自然保留手的具体意象。
- source_word: יָדֶךָ
  choice: 你的手
  rationale: 直译这一拟人化意象，保持原文诗意，不将其抽象改写为“供应”。
- source_word: וּמַשְׂבִּיעַ
  choice: 使……饱足
  rationale: שׂבע的Hiphil形式表示使之满足或饱足；“使……饱足”既体现使役意义，也符合供应众生的语境。
- source_word: לְכָל חַי
  choice: 一切活物
  rationale: חַי在此作名词性用法，泛指所有有生命的受造物；“一切活物”简洁自然，并保留普遍范围。
- source_word: רָצוֹן
  choice: 随愿
  rationale: רָצוֹן可指愿望、喜悦或恩惠；与“使……饱足”结合时，“随愿”自然表达活物所得满足与其所需所愿相称，同时保留该词的语义张力。
theological_decisions:
- issue: 对上帝的拟人化描写
  choice: 保留“你的手”这一具体意象
  alternative: 意译为“你慷慨供应”
  rationale: 希伯来文以张手描绘上帝供养众生；保留原有意象可维持诗歌力度，也不额外引入关于上帝形体的教义判断。
- issue: רָצוֹן所指的是活物的愿望还是上帝的恩惠
  choice: 正文采用“随愿”，主要按活物所愿、所需理解
  alternative: 使一切活物因你的恩惠而饱足／以美意使一切活物饱足
  rationale: 上下文强调上帝赐食并满足众生，因此“愿望”义较贴切；但原词也可指恩惠或美意，故以脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“张开你的手”保留诗歌的具体形象；“随愿饱足”凝练而略带诗体色彩，与诗篇体裁相称。
