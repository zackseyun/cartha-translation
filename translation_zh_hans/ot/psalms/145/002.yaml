source:
  edition: WLC
  text: בְּ/כָל י֥וֹם אֲבָרֲכֶ֑/ךָּ וַ/אֲהַלְלָ֥ה שִׁ֝מְ/ךָ֗ לְ/עוֹלָ֥ם וָ/עֶֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/002.yaml
  text: Every day I will bless you[b][a], and I will praise your name forever and ever.
translation:
  language: zh_hans
  text: 我每天都要称颂你[a]，赞美你的名[b]，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “每天”也可译作“每一天”或“日日”。
    reason: lexical_alternative
  - marker: b
    text: “你的名”是圣经中指上帝所启示的身份、品格和声誉的一种表达。
    reason: cultural_note
lexical_decisions:
- source_word: בְּכָל־יוֹם
  choice: 每天
  rationale: 该短语直译为“在每一天”，在这里表示日日反复的行动；“每天”自然、准确地传达这一习惯性含义。
- source_word: אֲבָרֲכֶךָּ
  choice: 我要称颂你
  rationale: ברך 的 Piel 形式在对上帝的赞美语境中意为“称颂、颂赞”。“称颂”既保留了人与上帝之间的直接宾语关系，也比字面的“祝福”更符合现代汉语表达。
- source_word: וַאֲהַלְלָה
  choice: 赞美
  rationale: הלל 的 Piel 形式意为“赞美”。此处与“称颂你”构成诗歌平行；承接前面的“我要”，既简洁自然，也保留了原文的意愿和持续行动意味。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 原文直译为“你的名”。在希伯来圣经中，“名”可指上帝所启示的身份、品格和声誉；正文保留这一具体而富有神学内涵的表达。
- source_word: לְעוֹלָם וָעֶד
  choice: 直到永永远远
  rationale: 这一成对表达强化无尽的延续。“直到永永远远”是自然庄重的现代汉语，也保留了原文强调长久持续的力量。
theological_decisions:
- issue: 直接称呼上帝而不补入称号
  choice: 你
  alternative: 上帝啊；我的上帝、我的王（承接第1节）
  rationale: 本节仅以第二人称后缀直接称呼上帝，并未重述第1节的称号，因此不把上下文中的称号补进正文。
- issue: “名”的神学表达
  choice: 你的名
  alternative: 你；你的美名
  rationale: 保留“名”可维持原文关于上帝所启示的身份、品格和声誉的丰富意涵，避免把它简化为代词或仅解释为名声。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“称颂”适合以上帝为对象的 ברך；第二分句省略重复的“我要”，使汉语流畅，同时仍由前句统摄。两个脚注标记均放在各自所说明的词语之后。
