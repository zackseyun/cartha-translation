  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַעֲשֶׂ֑י/ךָ וַ֝/חֲסִידֶ֗י/ךָ יְבָרֲכֽוּ/כָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/010.yaml
  text: All your works will give thanks to you[a], O Yahweh[b], and your faithful ones will bless you.
translation:
  language: zh_hans
  text: 雅威[a]啊，你所造的一切都要称谢你；你的忠信者[b]也要称颂你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“YHWH”，是上帝的名字；“雅威”是对该名字的常用拟音译法。“耶和华”是传统中文译法。
    reason: alternative_reading
  - marker: b
    text: 或译“你的虔诚人”或“你的圣民”。希伯来词指以忠诚和敬虔回应上帝的人，含有坚贞委身的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: 都要称谢你
  rationale: ידה的Hifil词干在此表示向上帝感谢、称谢；译作“称谢”既保留向对象表达感谢之意，也与后半句“称颂”形成原文中的动词区别。未完成式在诗歌概括性宣告中译为“要”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名YHWH。正文采用现代中文圣经读者熟悉的专名形式“耶和华”，并以脚注说明其希伯来文形式及“雅威”这一拟音译法。
- source_word: כָּל מַעֲשֶׂיךָ
  choice: 你所造的一切
  rationale: מַעֲשֶׂיךָ直指上帝的“作品、作为、所造之物”。在本诗语境中，“你所造的一切”自然地表达总体范围，并保留受造万有拟人化称谢上帝的诗意。
- source_word: וַחֲסִידֶיךָ
  choice: 你的忠信者
  rationale: חָסִיד指以忠诚、敬虔回应上帝慈爱与盟约信实的人。“忠信者”兼顾忠诚与信实，避免“圣徒”可能带入的后期教会专门含义；脚注保留“虔诚人”等可能译法。
- source_word: יְבָרֲכוּכָה
  choice: 也要称颂你
  rationale: ברך的Piel词干以人为主语、以上帝为对象时，表示称颂、祝颂。“称颂”比现代汉语中可能被理解为向上帝赐福的“祝福”更清楚，并保留与前句的平行关系。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 正文译“耶和华”，脚注注明YHWH及“雅威”
  alternative: 正文译“雅威”或“上主”
  rationale: 原文使用上帝的专名而非一般称号，因此正文保留专名，不以“上主”取代；“耶和华”符合现代中文圣经的广泛用法，脚注则透明呈现其读音与拼写问题。
- issue: חֲסִידֶיךָ所表达的群体身份
  choice: 忠信者
  alternative: 圣民、圣徒、虔诚人
  rationale: 该词既含敬虔，也含忠诚、坚贞之意。“忠信者”不把它限定为后来教会制度中的“圣徒”，也不抹去其与忠贞委身相关的神学张力。
- issue: 受造之物“称谢”上帝的表达
  choice: 保留拟人化陈述
  alternative: 解释为人因上帝的作为而称谢他
  rationale: 原文以“你的一切作品/所造之物”为主语，直接说它们称谢上帝。译文不将这一诗歌拟人法改写为人的回应。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“称谢／称颂”保留希伯来诗歌的平行结构及两个不同动词；“你所造的一切”简明易懂，同时保留万有回应造物主的拟人意象。所有脚注标记均置于正文相应词语之后。
