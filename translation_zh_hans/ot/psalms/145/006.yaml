  text: וֶ/עֱז֣וּז נוֹרְאֹתֶ֣י/ךָ יֹאמֵ֑רוּ ו/גדולתי/ך אֲסַפְּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/006.yaml
  text: They will speak of the might of your awesome deeds[b][a], and I will recount your greatness.
translation:
  language: zh_hans
  text: 他们要述说你可畏的作为的大能[a]；我要述说你的伟大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可畏的作为”也可译作“令人敬畏的作为”或“令人惊惧的作为”；希伯来文指使人心生敬畏、惊惧和惊叹的事。
    reason: lexical_alternative
  - marker: b
    text: “你的伟大”也可理解为“你的伟大作为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶעֱזוּז
  choice: 大能
  rationale: עֱזוּז表示力量、威力或大能；与后面的“你可畏的作为”构成领属关系。译作“大能”既保留诗歌的庄重感，也自然表达这些作为所彰显的能力。
- source_word: נוֹרְאֹתֶיךָ
  choice: 你可畏的作为
  rationale: 该词指令人敬畏、惊惧或惊叹之事。中文“可畏的作为”保留敬畏与震撼的双重意味，避免仅译作“奇事”而削弱原词的强度。
- source_word: יֹאמֵרוּ
  choice: 人要传说
  rationale: 未完成式在诗歌语境中可表达将来或反复、惯常的行动。“传说”能自然承接所述内容，并与下句第一人称的“述说”形成平行。第三人称复数未明说主语，故以泛指的“人”表达。
- source_word: וּגְדוּלָתְךָ
  choice: 你的伟大
  rationale: גְּדוּלָּה可指抽象的伟大，也可指伟大的事。正文保留抽象意义，与前句所彰显的“大能”相呼应，同时用脚注注明另一可能。
- source_word: אֲסַפְּרֶנָּה
  choice: 我也要述说
  rationale: ספר的加强语干表示叙说、陈述或宣扬。“述说”庄重而自然，能表现诗人有意识地宣告神的伟大；“也”体现连接词及两句的对应关系。
theological_decisions:
- issue: נוֹרָאוֹת所表达的敬畏与惧怕
  choice: 可畏的作为
  alternative: 令人敬畏的作为／奇事
  rationale: 原词可涵盖敬畏、惊惧和惊叹，不宜把张力单一化为正面的“奇妙”。“可畏”较完整地保留其神学与情感强度。
- issue: גְּדוּלָּה是抽象的“伟大”还是具体的“伟大作为”
  choice: 你的伟大
  alternative: 你的伟大作为
  rationale: 希伯来词在此容许两种理解。正文采用较直接的抽象义，不把所指限定为具体事迹；另一理解列于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“传说／述说”形成平行，“大能／伟大”保留原文的语义呼应。所有脚注标记均置于相应词组之后。
