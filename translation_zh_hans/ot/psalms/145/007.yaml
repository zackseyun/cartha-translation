  text: זֵ֣כֶר רַב טוּבְ/ךָ֣ יַבִּ֑יעוּ וְ/צִדְקָתְ/ךָ֥ יְרַנֵּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/007.yaml
  text: They will pour forth the memory of your abundant goodness[b][a], and they will sing for joy of your righteousness.
translation:
  language: zh_hans
  text: 他们要传扬对你丰盛良善的记念[a]；要欢唱你的公义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们要传颂你丰盛的良善。”
    reason: זֵכֶר可指记念或提说；יַבִּיעוּ含涌出般倾吐、传述之意。此译文以较自然的汉语表达该词组。
  - marker: b
    text: “公义”或译“公正”。
    reason: צדקה兼有公义与公正的语义范围。
lexical_decisions:
- source_word: זֵכֶר
  choice: 记念
  rationale: 该词可指记忆、记念或被人提说的事；在这里作“涌流述说”的宾语，表示人把对上帝良善的记念宣述出来。保留名词形式，避免收窄为“美名”。
- source_word: רַב טוּבְךָ
  choice: 你丰盛的良善
  rationale: רַב 表示数量或程度之大，טוּבְךָ涵盖上帝的良善及其惠泽；“丰盛的良善”既保留广度，也符合现代汉语赞美语境。
- source_word: יַבִּיעוּ
  choice: 涌流述说
  rationale: 该动词使役式带有泉水涌出、倾流而出的形象；“涌流述说”兼顾原文意象与言语行为，胜于仅译“述说”。
- source_word: וְצִדְקָתְךָ
  choice: 你的公义
  rationale: צדקה可涵盖正直、公义及公正的作为；“公义”较能保留其宽广的道德与关系性含义，“公正”作为合理替代列入脚注。
- source_word: יְרַנֵּנוּ
  choice: 欢呼歌唱
  rationale: רנן的加强式可指发出响亮喜乐之声，既可能是欢呼，也可能是歌唱；合译为“欢呼歌唱”保留其声音强度与诗歌语境。
theological_decisions:
- issue: צדקה在赞美语境中的译法
  choice: 公义
  alternative: 公正
  rationale: 原词既可指上帝正直、公义的品格和作为，也可突出施行公正；正文采用涵盖面较广的“公义”，脚注保留“公正”，不把语义限定为司法层面。
translation_notes:
  register: 采用现代、庄重而可朗读的诗篇语言。“涌流述说”刻意保留希伯来文泉涌般发声的意象；两分句以“要……要……”形成清晰平行。所有脚注标记均置于相应正文词语之后。
