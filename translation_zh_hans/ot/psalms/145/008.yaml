  text: חַנּ֣וּן וְ/רַח֣וּם יְהוָ֑ה אֶ֥רֶךְ אַ֝פַּ֗יִם וּ/גְדָל חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/008.yaml
  text: Yahweh is gracious and compassionate[a], slow to anger and great in steadfast love.
translation:
  language: zh_hans
  text: 雅威有恩典，有怜悯，不轻易发怒，并且大有慈爱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并且慈爱丰盛。”这里的希伯来语既可强调慈爱之广大，也可强调慈爱之丰富充盈。
    reason: 词义选择
lexical_decisions:
- source_word: חַנּוּן
  choice: 有恩典
  rationale: 表示乐意施恩、赐下恩惠；“有恩典”在现代汉语中自然庄重，并与下文“有怜悯”保持语义区别。
- source_word: רַחוּם
  choice: 有怜悯
  rationale: 表达深切的同情与怜恤；采用“有怜悯”既贴近原义，也不与 חַנּוּן 合并为同一个概念。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名按通行方式音译为“雅威”，保留其作为以色列之上帝专名的性质，而不以头衔代替。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒
  rationale: 这是希伯来语惯用语，字面与“鼻孔长”有关，实际表示面对冒犯时忍耐、迟缓动怒；“不轻易发怒”是自然准确的汉语表达。
- source_word: גְדָל
  choice: 大有
  rationale: 该词修饰 חָסֶד，强调其广大或丰盛；“大有”简洁地保留程度之强，同时容许“丰盛”的理解。
- source_word: חָסֶד
  choice: 慈爱
  rationale: 该词兼有忠贞、持久的爱与恩慈等含义；“慈爱”是诗篇语境中自然凝练的译法，但其忠贞与盟约关联不能由单一汉语词完全穷尽。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近现代学界重构读音的“雅威”，以专名而非“主”等头衔来呈现；“耶和华”是汉语传统中广为人知的另一音译。
- issue: חָסֶד 的语义范围
  choice: 慈爱
  alternative: 忠贞的爱
  rationale: “慈爱”适合诗歌语体，也涵盖恩慈和爱；原词还可能突出关系中的忠贞与持守，因此不把它缩减为单纯情感，也不在正文中强行加入原文未明说的“盟约”。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。两个并列形容词分别译为“有恩典”和“有怜悯”，保留其差异；“不轻易发怒”按汉语习惯传达希伯来语成语；句末以“大有慈爱”保持简洁和韵律。
