  text: וְ/הֵ֗מָּה לְ֭/שׁוֹאָה יְבַקְשׁ֣וּ נַפְשִׁ֑/י יָ֝בֹ֗אוּ בְּֽ/תַחְתִּיּ֥וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/009.yaml
  text: But they[a], who seek my life, to destroy it[b], will go into the depths of the earth.
translation:
  language: zh_hans
  text: 但那些寻索我的性命、要毁灭我的人，必进入地的深处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“地的低处。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: 但那些……的人
  rationale: וְ可依上下文表达与前节的转折，הֵמָּה带强调；中文以“但那些……的人”自然引出敌对者，并保留对比。
- source_word: לְשׁוֹאָה
  choice: 想要毁掉
  rationale: שׁוֹאָה表示毁灭、败亡；与“寻索我的性命”连用时表达敌意目的。译作“想要毁掉”符合现代汉语，同时不过度限定毁灭的方式。
- source_word: יְבַקְשׁוּ נַפְשִׁי
  choice: 想要……我性命的人
  rationale: נֶפֶשׁ此处指人的性命，而非抽象的“灵魂”；בקש在此语境中是敌意地寻索、图谋。中文整合为“想要毁掉我性命”，清楚传达谋害之意。
- source_word: יָבֹאוּ
  choice: 必下到
  rationale: 动词字面为“来到、进入”；结合目的地“地的深处”，中文用“下到”自然呈现向下进入的空间意象。未完成式在此表达预告性的结果，译为“必”。
- source_word: בְּתַחְתִּיּוֹת הָאָרֶץ
  choice: 地的深处
  rationale: 该短语字面指“大地较低的部分”。“地的深处”保留诗歌中的下降意象，又不把它明确解释为某一套关于阴间的教义。
theological_decisions:
- issue: “地的深处”所指为何
  choice: 保留为诗性的“地的深处”
  alternative: 明确译作“阴间”、坟墓或大地最低处
  rationale: 原文可使人联想到死亡、坟墓、死人所在之境或审判中的降卑，却没有在本句中把所指完全技术化；正文保留空间隐喻与神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“性命”准确表达此处 נֶפֶשׁ 的生命意义；“必下到”保留原文向下进入的诗歌图像。脚注标记已在正文中对应出现。
