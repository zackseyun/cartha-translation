  text: אֱלֹהִ֤ים אֵלִ֥/י אַתָּ֗ה אֲֽשַׁחֲ֫רֶ֥/ךָּ צָמְאָ֬ה לְ/ךָ֨ נַפְשִׁ֗/י כָּמַ֣הּ לְ/ךָ֣ בְשָׂרִ֑/י בְּ/אֶֽרֶץ צִיָּ֖ה וְ/עָיֵ֣ף בְּלִי מָֽיִם׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/001.yaml
  text: God[a], you are my God; I seek you at dawn. My soul thirsts for you, my flesh longs for you[b], in a dry and weary land without water.
translation:
  language: zh_hans
  text: 神啊，你是我的神；我在黎明寻求你[a]。我的心渴想你，我的肉身切慕你[b]，在干旱、疲乏、无水之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我一早寻求你”“我殷勤寻求你”，较意译地也可译作“我恳切寻求你”。希伯来语动词本身带有黎明时寻求的意象。
    reason: lexical_alternative
  - marker: b
    text: 本句也可断作：“我的心渴想你；在干旱、疲乏、无水之地，我的肉身切慕你。”如此，地点短语主要修饰后一分句。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 此处是直接呼告；现代汉语用“啊”自然标示呼语，并不另增神学含义。
- source_word: אֵלִי אַתָּה
  choice: 你是我的神
  rationale: 保留独立代词的强调，并以汉语自然表达省略的系词。
- source_word: אֲשַׁחֲרֶךָּ
  choice: 我在黎明寻求你
  rationale: 保留 שׁחר Piel 所唤起的清晨、破晓寻求之意，不把它直接解释为“殷勤”或“恳切”。
- source_word: צָמְאָה לְךָ נַפְשִׁי
  choice: 我的心渴想你
  rationale: נפשׁ 可指生命、自我、内在之人；“心”在现代汉语诗歌语境中自然表达内在生命的渴慕，同时避免把希伯来语强行体系化为严格的灵魂—身体二分。
- source_word: כָּמַהּ לְךָ בְשָׂרִי
  choice: 我的肉身切慕你
  rationale: “肉身”保留 בשר 的身体性，并与前句的内在渴想形成诗意对应；כָּמַהּ 表示强烈向往，译作“切慕”。
- source_word: בְּאֶרֶץ צִיָּה וְעָיֵף בְּלִי מָיִם
  choice: 在干旱、疲乏、无水之地
  rationale: “干旱”对应 צִיָּה，“疲乏”保留 עָיֵף 对土地的诗性拟人，“无水”简洁对应 privative phrase בְּלִי מָיִם。
theological_decisions:
- issue: נפשׁ 与 בשר 的人论性并列
  choice: 译作“我的心”与“我的肉身”，保留内在生命和身体层面的并列
  alternative: 译作“我的灵魂”与“我的身体”，或合并为“我的全人”
  rationale: 原诗同时写内在与身体的渴慕，但未在此建立严格的二元人论；当前译法保留张力而不作教义化界定。
- issue: 末尾地点短语的修饰范围
  choice: 用逗号将两句渴慕连成整体，使“在……之地”自然涵盖前面的全部表达
  alternative: 将地点短语紧接“我的肉身切慕你”，使其可能只修饰后一分句
  rationale: 希伯来诗句容许一定句法歧义；正文以整体场景理解为主，脚注保留另一种断句可能。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体。“黎明寻求”保留原文鲜明意象；“渴想／切慕”形成平行而不机械重复。所有脚注标记均已置入正文。
