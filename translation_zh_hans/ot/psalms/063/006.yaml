  text: When I remember you on my bed, I meditate on you in the night watches.
translation:
  language: zh_hans
  text: 我在床上想起你，在夜更中默想你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם זְכַרְתִּיךָ
  choice: 想起你
  rationale: 这里的 אִם 与后一句的未完成式相连，可表达反复出现的时间情境；译为陈述性的“想起你”，避免汉语中“如果”造成未必发生之感，同时保留诗句自然流动。
- source_word: עַל יְצוּעָי
  choice: 躺在床上
  rationale: 介词短语字面为“在我的床榻上”；用“我躺在床上”符合现代汉语表达，并明确这一回想发生于卧榻之时。
- source_word: בְּאַשְׁמֻרוֹת
  choice: 在夜更时
  rationale: אַשְׁמֻרוֹת 指夜间划分的更次，复数形式呈现夜里不同更次或漫长守夜时段；“夜更”保留古代计时背景。
- source_word: אֶהְגֶּה בָּךְ
  choice: 默想你
  rationale: הגה 可指低声吟咏、沉思或默想；此处以“默想”自然表达夜间专注思想神的含义，同时不额外限定是否出声。
theological_decisions:
- issue: 条件词 אִם 的语气
  choice: 按时间性、反复性情境处理，不直译“如果”
  alternative: 如果我在床上想起你
  rationale: 诗歌中的 אִם 可引出经常发生的情境，与后面的“默想”共同描写夜间持续转向神；直译“如果”在现代汉语中容易暗示不确定条件，偏离语境。
- issue: הגה 是否表示出声祷告
  choice: 译作“默想”，不判定是否发声
  alternative: 低声念叨你／向你吟咏
  rationale: 原词语义范围包括沉思与低声言说；上下文不能要求只取其中一种，因此正文采用包容度较高的译法。
translation_notes:
  register: 采用简洁、庄重而自然的现代普通话。“夜更”略带古雅色彩，但准确保留古代夜间分更的意象；全句保持诗歌的平行与安静沉思的语调。
