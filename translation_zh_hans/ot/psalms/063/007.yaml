  text: כִּֽי הָיִ֣יתָ עֶזְרָ֣תָ/ה לִּ֑/י וּ/בְ/צֵ֖ל כְּנָפֶ֣י/ךָ אֲרַנֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/007.yaml
  text: For you have been my help[a], and in the shadow of your wings I sing for joy.
translation:
  language: zh_hans
  text: 因为你曾是我的帮助，我就在你翅膀的荫下欢呼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“欢唱。”希伯来语动词既可指响亮的喜乐呼声，也可指喜乐歌唱。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明诗人欢呼的原因；现代汉语用“因为”可自然保留因果关系。
- source_word: הָיִיתָ
  choice: 一直是
  rationale: 完成式指向上帝已经显明、且对当前仍有意义的帮助；“一直是”自然表达这种持续关联，又不把时态解释得过细。
- source_word: עֶזְרָתָה לִּי
  choice: 我的帮助
  rationale: 保留名词性表达及其个人关系意味，简洁而符合现代汉语。
- source_word: וּבְצֵל
  choice: 我在……的荫下
  rationale: בְ 表示处于荫蔽之中；“荫下”既保留诗歌意象，也比抽象译作“保护中”更贴近原文。连接词 וּ 在中文分句中不必机械译作“并且”。
- source_word: כְּנָפֶיךָ
  choice: 你翅膀的
  rationale: 直译神圣翅膀的保护性比喻，不将其消解为抽象说明。
- source_word: אֲרַנֵּן
  choice: 欢呼
  rationale: רנן 的 Piel 形式可指发出响亮的喜乐呼声，也可涉及欢唱；正文用“欢呼”保留广义的有声喜乐表达，脚注注明另一自然译法。
theological_decisions:
- issue: 上帝保护的翅膀比喻
  choice: 保留“在你翅膀的荫下”这一具体意象
  alternative: 意译为“在你的保护下”
  rationale: 原文借翅膀所投的荫描绘庇护；保留比喻可维持诗篇的文学质感和神学张力，不限定其具体所指。
- issue: רנן 所表达的喜乐声音
  choice: 正文译作“欢呼”，脚注保留“欢唱”
  alternative: 正文译作“欢唱”
  rationale: 该动词的语义范围包括响亮的喜乐呼喊和歌唱；不把它严格限定为唱歌，更能保存原文的词义宽度。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“翅膀的荫下”保留原文的保护性意象；分号呈现原因与回应之间的紧密关系。
