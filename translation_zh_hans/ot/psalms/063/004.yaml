base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/004.yaml
  text: So I will bless you as long as I live[a]; in your name I will lift up my hands.
translation:
  language: zh_hans
  text: 因此，我一生都要称颂你[a]；我要奉你的名举起双手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必祝福你”。希伯来语动词较字面可译为“祝福”；在这里人向上帝说话的敬拜语境中，表达称颂、赞美之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: 因此
  rationale: 承接上一节对上帝慈爱的宣告，表达由此而来的回应；“因此”自然地保留了推论或结果意味。
- source_word: אֲבָרֶכְךָ
  choice: 我要称颂你
  rationale: ברך 的基本意义是“祝福”；当人以此动词以上帝为对象时，现代汉语通常用“称颂”，既符合自然敬拜用语，也保留人向上帝献上赞美的语义。较直译的“祝福你”列入脚注。
- source_word: בְחַיָּי
  choice: 我一生都
  rationale: 字面为“在我的生命中”，此处表示持续贯穿一生；“我一生都”简洁、自然地传达其延续意义。
- source_word: בְּשִׁמְךָ
  choice: 奉你的名
  rationale: 介词 בְּ 与“名”连用，可表达凭借、关联或呼求。“奉你的名”是现代汉语敬拜语境中的自然表达，同时不把具体关系限定得过窄。
- source_word: אֶשָּׂא
  choice: 我要……举起
  rationale: נשא 表示“举起、抬起”；与手连用时指祷告或敬拜的姿态，“举起”准确而自然。
- source_word: כַפָּי
  choice: 双手
  rationale: כף 可特指手掌，但复数在此构成举手的惯用表达；汉语用“双手”比“双掌”更自然，并明确呈现复数。
theological_decisions:
- issue: 人以上帝为对象时 ברך 的敬拜用语
  choice: 正文译为“称颂你”
  alternative: “祝福你”
  rationale: 希伯来语确实使用 ברך，但汉语“祝福你”通常容易理解为赐福给对方，可能误导上帝是领受人所赐福分的一方。“称颂”准确表达人在敬拜中颂赞上帝；脚注保留更贴近字面的译法。
- issue: בְּשִׁמְךָ 中介词与“名”的关系
  choice: 译为“奉你的名”
  alternative: “因你的名”或“在你的名里”
  rationale: 原文可涵盖凭借、呼求和敬拜所关联的范围。“奉你的名”保留这种敬拜与祷告语境，同时避免武断限定为单一语法关系。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“我一生都要”体现终身持续的誓愿；“举起双手”保留祷告和敬拜的身体姿态。
