  text: וְ/הַ/מֶּלֶךְ֮ יִשְׂמַ֪ח בֵּ/אלֹ֫הִ֥ים יִ֭תְהַלֵּל כָּל הַ/נִּשְׁבָּ֣ע בּ֑/וֹ כִּ֥י יִ֝סָּכֵ֗ר פִּ֣י דֽוֹבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/011.yaml
  text: But the king will rejoice in God[a]; everyone who swears by him will boast[c][b], for the mouths of those who speak lies will be shut.
translation:
  language: zh_hans
  text: 但王要因上帝欢喜；凡指着他起誓的，都要夸耀[a]，因为说谎之人的口必被封住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夸耀”也可译作“以此为荣”。这里的“他”按上下文指上帝。
    reason: lexical_alternative
  - marker: b
    text: 直译：“因为说虚假话之人的口必被封住。”希伯来文用单数“口”作集合性表达。
    reason: literal_rendering
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: 但王
  rationale: וְ在这里承接并对比上一节恶人的结局；译作“但”能自然呈现语篇转折，同时保留“王”而不作身份扩展。
- source_word: יִשְׂמַח בֵּאלֹהִים
  choice: 要因上帝欢喜
  rationale: שׂמח表示欢喜，ב可标示欢喜的对象或缘由；“因上帝欢喜”是自然的现代汉语，也保留以上帝为喜乐根基的含义。
- source_word: כָּל הַנִּשְׁבָּע בּוֹ
  choice: 凡指着他起誓的
  rationale: 该分词短语泛指所有以某位为誓言凭据的人；“指着……起誓”准确表达ב与שׁבע的搭配。代词在上下文中最自然地指上帝。
- source_word: יִתְהַלֵּל
  choice: 都要夸耀
  rationale: הלל的Hitpael式在此有夸耀、引以为荣之意；“夸耀”既保留原词力度，又不把它限定为自我吹嘘。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述欢喜和夸耀的理由；现代汉语用“因为”清楚自然。
- source_word: יִסָּכֵר פִּי דֹבְרֵי שָׁקֶר
  choice: 说谎之人的口必被封住
  rationale: 保留希伯来文单数集合性意象“口”，并以被动式表达סכר的Niphal形式；“说谎之人”保留分词所表达的行为特征。
theological_decisions:
- issue: “王”的身份
  choice: 只译作“王”，不加解释性身份
  alternative: 明确译作“大卫”或“弥赛亚君王”
  rationale: 本节正文只说“王”；虽然诗题和正典语境可能引导进一步理解，翻译本身不应加入经文未明说的身份。
- issue: “指着他起誓”中代词的所指
  choice: 保留“他”，并按上下文理解为上帝
  alternative: 理解为王
  rationale: 最近且最合乎惯用表达的先行词是“上帝”；圣经中指着上帝起誓也属常见用法。不过正文保留代词形式，脚注说明其所指，以免过度改写。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因上帝欢喜”避免生硬照搬“在上帝里欢喜”；“指着他起誓”沿用普通读者容易理解的圣经汉语表达。正文保留“王”和代词“他”的简洁性，不作教义性扩写。
