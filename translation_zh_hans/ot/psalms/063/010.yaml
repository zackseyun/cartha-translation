  text: יַגִּירֻ֥/הוּ עַל יְדֵי חָ֑רֶב מְנָ֖ת שֻׁעָלִ֣ים יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/010.yaml
  text: They will be given over to the power of the sword[b][a]; they will become a portion for foxes.
translation:
  language: zh_hans
  text: 他们必被交给刀剑的权势[b]；他们必成为狐狸的食物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“胡狼的食物”。希伯来语 שֻׁעָלִים 通常可指狐狸，但在战场或荒凉之地的语境中，有人理解为胡狼或较广义的犬科动物。
    reason: lexical_alternative
  - marker: b
    text: 较直译：“他们必借刀剑使他流尽／倾倒他。”原文上半句含单数宾语“他”，下半句则用复数“他们”，其所指和句法关系存在困难。
    reason: textual_ambiguity
lexical_decisions:
- source_word: יַגִּירֻהוּ
  choice: 他们必被交在
  rationale: 该词按形态直译为“他们必使他流出／倾倒他”，带第三人称阳性单数宾语后缀；但下半句转为复数“他们必成为”。正文采用被动复数，清楚表达上下文中的仇敌遭受刀剑之灾，同时以脚注保留原文生动而困难的单数表达。
- source_word: עַל יְדֵי חָרֶב
  choice: 在刀剑的权势下
  rationale: עַל־יְדֵי在此表达施事或势力，并非实指“手”。“在刀剑的权势下”既符合现代汉语，也保留刀剑作为致死力量的诗意。
- source_word: מְנָת
  choice: 份
  rationale: מְנָת指所分得的份额。“份”简洁保留分配、归属的意象，避免直接解释成“食物”。
- source_word: שֻׁעָלִים
  choice: 狐狸
  rationale: שׁוּעָל通常可译为“狐狸”；在荒野、尸骸语境中也可能泛指胡狼类动物，故在脚注列出“胡狼”。
- source_word: יִהְיוּ
  choice: 他们必成为
  rationale: היה在这里表示遭杀后进入的结果状态，译作“成为”比单纯“是”更贴切。
theological_decisions:
- issue: 上半句单数宾语与下半句复数主语之间的转换
  choice: 正文以复数被动式连贯表达仇敌共同遭遇的结局
  alternative: “他们必用刀剑倾倒他；他们必成为狐狸的份”
  rationale: 原文语法确有张力：יַגִּירֻהוּ含“他”，יִהְיוּ却是“他们”。正文不把前一个“他们”误解为行刑者与后一个“他们”同指，脚注则明确保留较直译的可能，避免掩盖文本困难。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“刀剑的权势”保留希伯来语施事性习语；“狐狸的份”刻意保存“分得之份”的诗意，而不扩写为“食物”。脚注标记按各自所释词语就近放置。
