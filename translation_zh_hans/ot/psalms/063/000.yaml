  text: 大卫的诗[a]；他在犹大旷野[b]时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”也可译为“大卫所作的诗”或“为大卫而作的诗”；希伯来文标题中的介词可表示作者、归属、题献或关联。
    reason: alternative_reading
  - marker: b
    text: “旷野”也可译为“荒漠”或“沙漠”；希伯来文所指范围较广，可包括荒野或沙漠地带。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中的体裁术语；现代中文以“诗”表达自然、简洁，也符合《诗篇》的语境。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 希伯来语介词 לְ 在诗篇标题中可表示作者、归属、题献或关联；中文“大卫的”能够保留一定程度的开放性，不强行限定为“大卫所作”或“为大卫而作”。
- source_word: בִּהְיוֹתוֹ
  choice: 当时他在
  rationale: 该结构由介词 בְּ、动词 היה 的不定式构造式及第三人称单数后缀组成，表示时间背景；译为“当时他在”符合现代中文标题的表达。
- source_word: בְּמִדְבַּר
  choice: 在……旷野
  rationale: מִדְבָּר 可指旷野、荒野、草原或沙漠地带；“旷野”保留其较宽泛的地貌含义。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 这是地区或支派领地的专名，采用现代中文圣经传统中通行的译名“犹大”。
theological_decisions:
- issue: 大卫标题中 לְ 的语义
  choice: 译作“大卫的诗”，保留作者、归属、题献或关联等可能性
  alternative: 译作“大卫所作的诗”或“为大卫而作的诗”
  rationale: 希伯来语本身并未在这些关系中明确限定一种；正文不应把可能的作者关系或题献关系提升为唯一解释。
- issue: 时间从句与诗的关系
  choice: 译作“当时他在犹大旷野”
  alternative: 译作“大卫在犹大旷野时所作”
  rationale: 原文说明“他在犹大旷野时”的背景，但没有明说“作”；避免补入“所作”，可防止间接消除标题介词所保留的歧义。
translation_notes:
  register: 采用简洁、庄重的诗篇标题体。以“大卫的诗”承载原文关系上的歧义，并用独立的时间陈述避免添加“所作”。“旷野”沿用普通读者熟悉的圣经用语，同时由脚注交代其较宽的地貌语义。
