  text: כֵּ֭ן בַּ/קֹּ֣דֶשׁ חֲזִיתִ֑י/ךָ לִ/רְא֥וֹת עֻ֝זְּ/ךָ֗ וּ/כְבוֹדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/002.yaml
  text: So I have looked upon you in the sanctuary[a], to see your power and your glory.
translation:
  language: zh_hans
  text: 我曾在圣所中如此瞻仰你，为要观看你的能力和荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我曾这样在圣所中看见你，为要看见你的能力和荣耀。”
    reason: “如此／这样”与上下文的连接方式可有不同理解；原文使用两个观看动词，亦可较直接地均译为“看见”。
lexical_decisions:
- source_word: כֵּן
  choice: 这样
  rationale: כֵּן在此作副词，意为“这样／如此”，承接上文的渴慕，同时不把上下句之间的逻辑关系限定得过死。
- source_word: בַּקֹּדֶשׁ
  choice: 在圣所中
  rationale: קֹדֶשׁ虽可指抽象的“圣洁”，但在敬拜语境及介词结构中，更自然地指“圣所／圣地”。
- source_word: חֲזִיתִיךָ
  choice: 瞻仰你
  rationale: חזה不只是短暂地“看见”，也可表达带有专注与体察意味的观看；“瞻仰”既保留对上帝的直接宾语，也符合庄重而自然的敬拜语体。
- source_word: לִרְאוֹת
  choice: 要看见
  rationale: 不定式可表达目的；“要看见”简洁保留这一关系，也未将“看见”过度解释为某种特定的神秘经验。
- source_word: עֻזְּךָ
  choice: 你的能力
  rationale: עֹז可指力量、威力或能力；“能力”在此清楚表达上帝彰显的权能，并与“荣耀”自然并列。
- source_word: וּכְבוֹדֶךָ
  choice: 和你的荣耀
  rationale: כָּבוֹד用于上帝时通常指其彰显出来的尊荣与威荣；“荣耀”是准确且为现代中文读者熟悉的对应词。
theological_decisions:
- issue: 诗人在圣所中“看见”上帝的含义
  choice: 保留“瞻仰你／看见你的能力和荣耀”的直接诗性表达，不说明这是看见上帝本体。
  alternative: 明确译成借着敬拜经历上帝，或理解为神秘异象中直接看见上帝。
  rationale: 希伯来文直接以“你”为观看对象，同时又以“你的能力和荣耀”说明所要看见的内容。译文保留这种神学张力，不将其限定为肉眼看见、神秘异象或纯粹比喻。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“瞻仰”体现敬拜中的专注观看，但不过度古雅；“圣所”“能力”“荣耀”沿用普通现代汉语中清楚且稳定的宗教词汇。
