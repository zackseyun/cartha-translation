  text: כְּמ֤וֹ חֵ֣לֶב וָ֭/דֶשֶׁן תִּשְׂבַּ֣ע נַפְשִׁ֑/י וְ/שִׂפְתֵ֥י רְ֝נָנ֗וֹת יְהַלֶּל פִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/005.yaml
  text: My soul is satisfied as with fat and richness[b][a], and my mouth praises you with lips of joyful songs.
translation:
  language: zh_hans
  text: 我的心如享肥甘美味般得饱足[a]；我的口用欢呼的嘴唇[b]赞美你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的心必如享肥甘美味一般得饱足。”
    reason: 希伯来文未完成式可表达将来意义；正文按诗歌语境译为当前或持续的满足。
  - marker: b
    text: 直译“欢呼的嘴唇”；也可译“发出喜乐呼喊的嘴唇”或“喜乐歌唱的嘴唇”。
    reason: רְנָנוֹת可指欢呼、喜乐的呼喊，也可包括喜乐歌唱。
lexical_decisions:
- source_word: כְּמוֹ
  choice: 如同／饱享
  rationale: 该词引出比较。中文用“饱享肥甘美味”自然表达“如同因肥美丰盛之物而饱足”的比喻关系，避免生硬直译。
- source_word: חֵלֶב וָדֶשֶׁן
  choice: 肥甘美味
  rationale: חֵלֶב本指脂油，דֶּשֶׁן指肥美、丰盛；合译为传统而仍可懂的“肥甘美味”，既保留佳肴丰盛的具体意象，也避免“脂油和肥腻”的负面现代联想。
- source_word: תִּשְׂבַּע
  choice: 饱享
  rationale: 未完成式在诗歌中可表达当前、持续或将来的状态。“饱享”兼具饱足和享用之意，并在脚注保留未来译法。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נֶפֶשׁ在此指诗人的内在自我或全人。现代汉语“我的心”比“我的灵魂”更自然，也符合本诗渴慕与满足的语境。
- source_word: שִׂפְתֵי רְנָנוֹת
  choice: 欢呼的嘴唇
  rationale: 该结构较直译为“欢呼的嘴唇”，保留嘴唇与口的身体意象及רְנָנוֹת所含欢呼、喜乐呼喊的意味。
- source_word: יְהַלֶּל
  choice: 赞美你
  rationale: 主语是“我的口”。希伯来文未明说宾语，但全诗直接向上帝说话，中文补出“你”可使句意完整而不增添额外神学内容。
- source_word: פִּי
  choice: 我的口
  rationale: 保留原文“口”与“嘴唇”的平行身体意象。
theological_decisions:
- issue: 诗歌未完成式的时态／体貌
  choice: 正文采用当前或持续意义：“饱享”“赞美”
  alternative: “必得饱足”“必赞美”
  rationale: 两个未完成式可指持续、习惯或将来的行动；上下文容许当前经验和未来确信。正文采用自然的当前表达，并以脚注保留未来读法。
- issue: 赞美对象是否明说
  choice: 补出“你”
  alternative: “我的口赞美”
  rationale: 原文没有显式宾语，但本诗是对上帝的直接称呼，所指清楚；补出“你”符合现代汉语习惯。
- issue: נֶפֶשׁ的中文表达
  choice: “我的心”
  alternative: “我的灵魂”或“我”
  rationale: 此处强调诗人内在而整体的自我。“心”自然表达内在渴慕与满足，同时不把希伯来人观限定为身魂二分。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“肥甘美味”略带文学色彩，用来保存原文肥美佳肴与丰盛饱足的意象；分号维持两行间的诗歌平行。
