  text: כִּי ט֣וֹב חַ֭סְדְּ/ךָ מֵֽ/חַיִּ֗ים שְׂפָתַ֥/י יְשַׁבְּחֽוּ/נְךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/003.yaml
  text: For your steadfast love is better than life[a]; my lips will praise you.
translation:
  language: zh_hans
  text: 因为你的慈爱[a]胜过生命，我的嘴唇要颂赞你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忠贞的爱”或“盟约之爱”。希伯来语 חֶסֶד 指忠诚、持久的慈爱，常用于盟约关系。
    reason: 词义包含多个彼此关联、但无法由单个中文词完全涵盖的层面。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出后半句颂赞的原因，保留原文的因果关系，也符合现代汉语表达。
- source_word: טוֹב ... מֵחַיִּים
  choice: 胜过生命
  rationale: טוֹב与比较介词מִן连用，表达“比……更好”；“胜过生命”简洁自然，并保留诗歌的力度。
- source_word: חַסְדְּךָ
  choice: 你的慈爱
  rationale: חֶסֶד包含仁慈、忠贞和持久之爱的意涵，常见于盟约关系中；“慈爱”是现代中文圣经语境中自然、庄重且不过度限定的表达。
- source_word: מֵחַיִּים
  choice: 生命
  rationale: חַיִּים虽为复数形式，在此按希伯来语惯用法表示整体意义上的“生命”。
- source_word: שְׂפָתַי
  choice: 我的嘴唇
  rationale: 保留原文具体的身体意象和诗歌修辞，不抽象化为“我的言语”。
- source_word: יְשַׁבְּחוּנְךָ
  choice: 要颂赞你
  rationale: שׁבח的加强词干表示赞美、颂扬；“要颂赞你”兼顾将来或意愿色彩，并适合敬拜诗歌的语体。
theological_decisions:
- issue: 敬拜语境中חֶסֶד的译法
  choice: 慈爱
  alternative: 忠贞的爱、盟约之爱、怜悯
  rationale: “慈爱”能够同时传达恩慈与爱，也为原词所含的忠诚、恒久和关系性保留空间；不把经文本身直接收窄为某一种神学界定。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“胜过生命”保留鲜明的比较结构；“嘴唇”保留希伯来诗歌的具体意象。
