base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/008.yaml
  text: My soul clings to you[b][a]; your right hand upholds me.
translation:
  language: zh_hans
  text: 我的心紧紧跟随你[a]；你的右手扶持我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的心紧贴在你后面。”原文兼有紧紧依附和在后跟随的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבְקָה
  choice: 紧紧跟随
  rationale: דבק表示黏附、紧贴或紧紧依附；与אַחֲרֶיךָ（在你之后）连用时，译作“紧紧跟随”既保留亲密依附与追随的意象，也符合现代汉语表达。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נפשׁ可指生命、自我或内在的人。诗歌祷告语境中，“我的心”自然传达全人的内在渴慕，又不把该词限定为技术性的灵魂观。
- source_word: אַחֲרֶיךָ
  choice: 跟随你
  rationale: 该词字面意为“在你之后”。结合דבק，译为“跟随你”保留在后紧随的空间意象；脚注说明更贴近字面的表达。
- source_word: בִּי
  choice: 我
  rationale: 介词ב带第一人称单数后缀，在תמך结构中标示扶持的对象；汉语自然表达为“扶持我”。
- source_word: תָּמְכָה
  choice: 扶持
  rationale: תמך意为支持、托住。“扶持”兼具支撑与帮助之义，适合诗体，也可表达完成式所呈现的持续状态。
- source_word: יְמִינֶךָ
  choice: 你的右手
  rationale: 按原文保留具体的拟人性意象，不抽象改写为“能力”或“力量”。
theological_decisions:
- issue: נַפְשִׁי的人论含义
  choice: 我的心
  alternative: 我的灵魂／我／我的生命
  rationale: “我的心”在现代汉语诗歌与祷告语体中可自然指向内在自我和全人，不强行建立灵魂与身体二分；其他译法在词义上仍属可能。
- issue: 上帝“右手”的拟人性语言
  choice: 你的右手
  alternative: 你的能力／你的力量
  rationale: 保留希伯来诗歌的具体形象，让力量、保护与支撑的含义由隐喻本身呈现，不以抽象解释取代原文。
- issue: דבק与אַחֲרֶיךָ组合中的依附和追随张力
  choice: 紧紧跟随你
  alternative: 紧紧依附你／紧贴在你后面
  rationale: 原文同时带有黏附和“在后面”的意象。“紧紧跟随”在汉语中自然，并尽量保存两者；脚注保留更字面的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“紧紧跟随”避免生硬直译，同时保留原文依附与追随的双重意象；分号呈现两分句间的诗意对应。
