  text: מ֭וּזָר הָיִ֣יתִי לְ/אֶחָ֑/י וְ֝/נָכְרִ֗י לִ/בְנֵ֥י אִמִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/008.yaml
  text: I have become a stranger to my brothers[b][a], and a foreigner to my mother's sons.
translation:
  language: zh_hans
  text: 对弟兄来说，我成了陌生人；对同母兄弟来说，我成了外人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成了”或译“曾是”。希伯来文动词既可表示过去的状态，也可着重表示进入这种状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּזָר
  choice: 陌生人
  rationale: 该词表示疏远、被视为外来者；“陌生人”保留具体的人际疏离意味，并与下句“外人”形成诗歌平行。
- source_word: הָיִיתִי
  choice: 成了
  rationale: 完成式在哀歌语境中可指进入并处于某种状态；“成了”自然表达这种结果状态，同时在脚注中保留单纯过去状态的可能。
- source_word: לְאֶחָי
  choice: 在弟兄眼中
  rationale: 原文直译为“对我的弟兄”；现代汉语用“在……眼中”更自然地表达关系层面的陌生，同时保留阳性亲属称谓。
- source_word: וְנָכְרִי
  choice: 外人
  rationale: נָכְרִי指外族人或非本圈子的人；此处“外人”比“外国人”更符合家庭疏离语境，并加强与“陌生人”的平行。
- source_word: לִבְנֵי אִמִּי
  choice: 在同母兄弟眼中
  rationale: 原文为“对我母亲的儿子们”。“同母兄弟”既准确传达亲属关系，也比逐字的“我母亲的儿子们”更符合现代汉语表达。
theological_decisions:
- issue: 带性别的亲属称谓
  choice: 保留“弟兄”和“同母兄弟”
  alternative: 手足；家人
  rationale: 希伯来文两处都明确使用阳性亲属名词，并构成诗歌平行；不将其泛化为中性称谓，以免消除原文形式和可能的具体所指。
- issue: הָיִיתִי的时态与体貌
  choice: 译作“成了”
  alternative: 是；曾是
  rationale: 上下文的哀诉容许将完成式理解为进入疏离状态并产生持续结果，但希伯来文也可表达单纯过去状态，因此以脚注保留歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“在……眼中”处理希伯来文关系介词，使两行平行清楚；“同母兄弟”传达“我母亲的儿子们”的近亲意味，同时避免生硬逐字翻译。
