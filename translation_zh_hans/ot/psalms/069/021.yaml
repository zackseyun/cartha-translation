base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/021.yaml
  text: They gave me poison for my food[c][b][a], and for my thirst they gave me vinegar to drink.
translation:
  language: zh_hans
  text: 他们拿毒物[a]给我当食物；在我口渴时，他们给我喝酸酒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毒物”也可译作“苦胆”。希伯来语רֹאשׁ在这里指有毒或极苦的物质；“苦胆”是传统译法。
    reason: lexical_alternative
  - marker: b
    text: “酸酒”也可译作“醋”。希伯来语חֹמֶץ可指发酸的酒或醋。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 他们……给我
  rationale: נתן在连续叙事形式中表示“给”；中文按自然语序表达，并与下半句的使役饮用结构形成对应。
- source_word: בְּבָרוּתִי
  choice: 当作食物
  rationale: בָּרוּת指食物或滋养之物；介词בְּ在此与“给”连用，可理解为所给之物充当食物。“当作食物”既自然，也保留其作为供养之物的反讽。
- source_word: רֹאשׁ
  choice: 毒物
  rationale: 此处不是通常的“头”，而指有毒或极苦的物质。“毒物”比“苦胆”更直接传达希伯来诗句的毒害含义，同时在脚注保留传统译法。
- source_word: וְלִצְמָאִי
  choice: 我渴了
  rationale: 字面可作“为着我的口渴”；现代汉语用“我渴了”自然表达当时的处境，并保持与所给饮料之间的关系。
- source_word: יַשְׁקוּנִי
  choice: 拿……给我喝
  rationale: שׁקה的使役式意为“使喝、给……喝”。此译符合现代汉语，也未过度强化强迫灌饮的意味。
- source_word: חֹמֶץ
  choice: 酸酒
  rationale: חֹמֶץ可指发酸的酒或醋。古代语境中“酸酒”较具体，也避免现代读者首先联想到烹调用醋；“醋”列入脚注作为可行译法。
theological_decisions:
- issue: 与福音书受难叙事的互文呼应
  choice: 依诗篇希伯来文本自身的词义译为“毒物”和“酸酒”
  alternative: 采用传统的“苦胆”和“醋”，以更明显呼应部分新约译文
  rationale: 正文应首先呈现诗篇本身的语义，不以新约措辞反向限定本节；传统且具有互文意义的译法则以脚注明示。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用分号呈现两行诗句的平行关系；第二句加入“又”以传达并列递进，但不增添新的神学解释。所有脚注标记均置于正文相关句末。
