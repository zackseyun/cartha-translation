language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עֲנֵ֣/נִי יְ֭הוָה כִּי ט֣וֹב חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ פְּנֵ֣ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/016.yaml
  text: Answer me[a], O Yahweh, for your steadfast love is good; according to your abundant mercies, turn to me.
translation:
  language: zh_hans
  text: 求你应允我，耶和华啊，因为你的慈爱本为美好；求你照着你丰盛的怜悯转向我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנֵנִי
  choice: 求你应允我
  rationale: 这是祷告语境中的命令式，恳求上帝作出回应。“应允我”比单纯“回答我”更自然地表达祈祷蒙垂听的诉求，同时未具体限定回应方式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: כִּי טוֹב חַסְדֶּךָ
  choice: 因为你的慈爱何其美好
  rationale: כִּי引出恳求的根据；טוֹב保留“美好”的基本义；חֶסֶד译作“慈爱”，兼顾慈恩与忠贞持久之意。“何其”使谓语结构在中文诗歌祷告中自然而庄重。
- source_word: כְּרֹב רַחֲמֶיךָ
  choice: 照你丰盛的怜悯
  rationale: כְּ加רֹב表示衡量标准或相称关系，译作“照”；רַחֲמִים虽为希伯来语复数，在中文中以集合性的“怜悯”表达更自然，并保留深切慈悲之意。
- source_word: פְּנֵה אֵלָי
  choice: 转向我
  rationale: פנה与אֶל连用表示朝某人转身或转面；“转向我”既贴近原文意象，也表达关系上的眷顾，而不窄化为仅仅“看我”。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文采用广为人知且可辨识为专名的“耶和华”，避免以称号“主”取代；“雅威”是较接近学界拟音的可行替代。
- issue: חֶסֶד的语义范围
  choice: 慈爱
  alternative: 信实的爱
  rationale: “慈爱”在简体中文中自然、庄重，也能容纳恩慈与忠贞的丰富含义；不扩写为“盟约之爱”，以免把词义中可能存在的盟约色彩解释得过度明确。
- issue: רַחֲמִים的数与含义
  choice: 怜悯
  alternative: 诸般怜悯
  rationale: 希伯来语复数可强调怜悯的丰盛或多重表现；中文集合名词“怜悯”配合“丰盛”即可自然传达这一点。“诸般怜悯”更形式对应，但略显生硬。
translation_notes:
  register: 采用现代、庄重而易懂的祷告体。两个“求你”清楚呈现原文的两个命令式恳求；分号保留平行结构。避免古奥的“垂听”“顾念”，也不加入原文未明说的拯救方式。
