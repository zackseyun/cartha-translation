  text: רָא֣וּ עֲנָוִ֣ים יִשְׂמָ֑חוּ דֹּרְשֵׁ֥י אֱ֝לֹהִ֗ים וִ/יחִ֥י לְבַבְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/032.yaml
  text: The humble have seen and rejoice[a]; you who seek God[c][b], let your hearts live.
translation:
  language: zh_hans
  text: 谦卑人看见了，就欢喜[a]；寻求上帝的人哪，愿你们的心重新振作[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谦卑人”也可译作“困苦人”或“温柔的人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“愿你们的心活起来”，是指勇气、活力或盼望得到更新。
    reason: cultural_note
lexical_decisions:
- source_word: רָאוּ
  choice: 看见了
  rationale: 这是ראה的Qal完成式第三人称复数。译作“看见了”，保留动作已经发生并引发当前欢喜的诗歌语境；原文未明说所见的宾语，因此不补出“这事”等对象。
- source_word: עֲנָוִים
  choice: 谦卑人
  rationale: 该词既可指谦卑、温顺的人，也常与受苦、困苦的卑微者重叠。“谦卑人”保留其品格层面的含义，同时不排除其困苦处境；其他可能性收入脚注。
- source_word: יִשְׂמָחוּ
  choice: 就欢喜
  rationale: 这是שמח的未完成式第三人称复数，在诗歌中可表示生动的当前或随之而来的反应。“就欢喜”自然连接前面的完成动作，又不把时态限定为遥远将来。
- source_word: דֹּרְשֵׁי אֱלֹהִים
  choice: 寻求上帝的人哪
  rationale: 分词结构因下文第二人称复数词尾而具有呼语功能。译成直接称呼，清楚呈现诗句从陈述转为劝勉或祝愿。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本语境中指以色列的上帝，为单数所指；“上帝”是现代普通话中庄重且通行的译法。
- source_word: וִיחִי לְבַבְכֶם
  choice: 愿你们的心重新振作
  rationale: חיה在此为祈愿式用法，字面近于“愿你们的心活起来”。“重新振作”传达恢复勇气、活力和盼望的希伯来习语含义；保留“心”并按中文群体称呼的自然方式使用“你们的心”。
theological_decisions:
- issue: “心活起来”是身体存活还是内在复苏
  choice: 按恢复勇气、活力和盼望的习语译为“心重新振作”
  alternative: 愿你们的心活起来
  rationale: 语境是寻求上帝者因所见之事而欢喜，重点更可能是内在生命与勇气的复苏，而非单指肉体生存；但不把它缩减为某一项特定心理感受。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看见了，就欢喜”维持希伯来诗句的动作关系，不擅自补出所见对象；后半句用呼语“……的人哪”和“愿……”表达诗歌中的直接祝愿。
