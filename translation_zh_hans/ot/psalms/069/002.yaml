  text: טָבַ֤עְתִּי בִּ/יוֵ֣ן מְ֭צוּלָה וְ/אֵ֣ין מָעֳמָ֑ד בָּ֥אתִי בְ/מַעֲמַקֵּי מַ֝֗יִם וְ/שִׁבֹּ֥לֶת שְׁטָפָֽתְ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/002.yaml
  text: I have sunk in deep mire[a], and there is no foothold; I have come into deep waters, and the flood has swept over me.
translation:
  language: zh_hans
  text: 我陷在深深的淤泥中[a]，无处立足；我进入深水的深处，洪流淹没了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我陷在泥泞的深处”。
    reason: 原文短语同时包含“泥泞”和“深处”两个要素，其修饰关系可用不同方式在汉语中表达。
lexical_decisions:
- source_word: טָבַעְתִּי
  choice: 我陷在
  rationale: 该词是Qal完成式第一人称单数，描写已经陷入且仍处于其中的危急状态；“陷在”自然体现其结果状态。
- source_word: בִּיוֵן מְצוּלָה
  choice: 深深的泥潭里
  rationale: יוֵן指泥泞、淤泥，מְצוּלָה指深处；合译为“深深的泥潭”兼顾泥泞与深度的意象。
- source_word: וְאֵין מָעֳמָד
  choice: 无处立足
  rationale: מָעֳמָד表示可站立之处或支撑点；“无处立足”简洁自然，并保留脚下没有支撑的具体画面。
- source_word: בָּאתִי
  choice: 我落入
  rationale: בוא基本义为来到、进入；结合深水险境，译作“落入”符合现代汉语表达，也与上句下陷的动态相连。
- source_word: בְמַעֲמַקֵּי מַיִם
  choice: 深水中
  rationale: 该短语指水的深处；“深水中”简洁保留原文意象。
- source_word: שִׁבֹּלֶת
  choice: 洪流
  rationale: 该词可指水流、急流或奔涌的水；上下文强调具有吞没力量的深水，“洪流”较能传达其猛烈程度，同时不把它限定为某一种水体。
- source_word: שְׁטָפָתְנִי
  choice: 漫过了我
  rationale: שטף表示冲过、淹没或漫过；“漫过了我”具体保留水势覆盖人的画面，并避免只译成抽象的“压倒”。
theological_decisions: []
