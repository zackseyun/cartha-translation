  yaml_path: translation/ot/psalms/069/031.yaml
  text: And it will please Yahweh more than an ox[a], a bull with horns and split hooves.
translation:
  language: zh_hans
  text: 这比一头有角有分蹄的公牛更蒙雅威喜悦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“比牛，比一头有角有分蹄的公牛更蒙雅威喜悦。”原文以“牛／公牛”并置，加强对一头符合献祭条件之牲畜的描述；本译文按中文习惯合并表达。
    reason: 说明“牛／公牛”的并置关系及比较结构，避免误解为两头牲畜。
lexical_decisions:
- source_word: וְתִיטַב
  choice: 这必……更蒙……喜悦
  rationale: יטב为Qal未完成式第三人称阴性单数，承接上一节的赞美与感谢；与比较介词מִן连用，表达这赞美将更得雅威喜悦。
- source_word: לַיהוָה
  choice: 蒙雅威喜悦
  rationale: 以“雅威”音译יהוה，保留经文中的神圣名；“蒙……喜悦”自然表达לְ所标明的对象。
- source_word: מִשּׁוֹר
  choice: 比牛
  rationale: מִן在יטב之后标示比较；שׁוֹר泛指牛，保留其与后面פָּר的并置。
- source_word: פָּר
  choice: 公牛
  rationale: פָּר特指公牛；与前面的“牛”并列翻出，不将两个希伯来语动物名称合并。
- source_word: מַקְרִן
  choice: 有角
  rationale: 该分词性形式源自קרן，在此描写公牛长有角；“有角”简洁自然。
- source_word: מַפְרִיס
  choice: 有分蹄
  rationale: 源自פרס，指蹄分开；“分蹄”既符合现代中文，也保留适合作洁净祭牲的动物特征。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”音译，以保留其作为神圣专名的性质。
- issue: 赞美与祭牲的比较
  choice: 译为“更蒙雅威喜悦”
  alternative: 译为“更好”
  rationale: יטב本可表示“更好”，但其与לַיהוָה及מִן构成的语境重点是上一节的赞美比祭牲更得雅威喜悦；译文保留这种比较，不将其绝对化为祭祀无效。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“牛／公牛”的重复刻意保留原文的并置加强；“有分蹄”比“偶蹄”更便于普通读者理解，也贴近原文动作性描写。
