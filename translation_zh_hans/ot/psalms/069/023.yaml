  source_fidelity: 首句准确保留了希伯来文祈愿式的审判语气及“眼睛昏暗、不能看见”的结果。末句原文为使役命令式，直接向上帝祈求“使他们的腰……摇晃／趔趄”；草稿以“愿他们的腰……”表达愿望，虽大意可通，却弱化了使役和对上帝的直接祈求。
  naturalness: “摇颤”在现代标准汉语中不如“摇晃”或“颤抖”自然；就מעד所含的失稳、趔趄意象而言，“摇晃”较为贴切。“腰踉跄不稳”则搭配不当，因为“踉跄”通常用于人而非身体部位。
  terminology: “腰”可自然对应מָתְנַיִם，并保留原文身体意象。用“使他们的腰不断摇晃”既不引入原文未明说的身体部位，也保留持续性的审判图像。
