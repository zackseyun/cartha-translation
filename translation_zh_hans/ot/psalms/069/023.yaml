  rationale: 修订补足末句使役命令式在汉语祈愿句中所需的隐含受话者“你”，从而清楚呈现诗人向上帝的请求；并以自然的“摇晃”替换“摇颤”，脚注保留מעד可指失稳、趔趄的词义范围，而不把“踉跄”不自然地施于“腰”。
