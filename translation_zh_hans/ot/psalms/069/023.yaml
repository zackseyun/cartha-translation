    rationale: “摇颤”不是此处最自然的现代搭配；“踉跄”通常以人作主语。改为“摇晃”，脚注说明“趔趄、站立不稳”的扩展意义，更符合现代汉语。
  revised_text: 愿他们的眼睛昏暗，不能看见；愿你使他们的腰不断摇晃。[a]
