  text: תֶּחְשַׁ֣כְנָה עֵ֭ינֵי/הֶם מֵ/רְא֑וֹת וּ֝/מָתְנֵ֗י/הֶם תָּמִ֥יד הַמְעַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/023.yaml
  text: Let their eyes be darkened from seeing[b][a], and make their loins shake continually.
translation:
  language: zh_hans
  text: 愿他们的眼睛昏暗，不能看见；愿你使他们的腰不断摇晃。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摇晃”或译“使他们的腰常常摇动不稳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּחְשַׁכְנָה
  choice: 愿……昏暗
  rationale: 该未完成式在咒诅祈愿的语境中表达愿望或祈求；用“愿”保留其祈愿语气，“昏暗”贴合眼睛失去视力的意象。
- source_word: עֵינֵיהֶם
  choice: 他们的眼睛
  rationale: 直接保留原文的身体意象和第三人称复数领属关系。
- source_word: מֵרְאוֹת
  choice: 不能看见
  rationale: מן加ראה不定式字面为“离开看见／不得看见”；在现代汉语中，“昏暗，不能看见”自然表达其阻止或丧失视觉的结果。
- source_word: וּמָתְנֵיהֶם
  choice: 他们的腰
  rationale: מָתְנַיִם指腰部或腰胯；“腰”是现代汉语中自然、庄重且能保留身体意象的表达。
- source_word: תָּמִיד
  choice: 不断
  rationale: 表达持续不止的状态；“不断”简洁自然，符合诗歌语体。
- source_word: הַמְעַד
  choice: 愿……摇颤
  rationale: 该使役形式源于מעד，意为使摇动、蹒跚或站立不稳；“摇颤”兼顾身体颤动与失稳的意象，并以“愿”承接对上帝的祈求。
theological_decisions:
- issue: 本节的咒诅祈愿语气
  choice: 译作向上帝发出的祈愿：“愿……；愿……”
  alternative: 译作预告性的将来陈述：“他们的眼睛必昏暗……”
  rationale: 上下文及动词形式表明这是求上帝施行审判的祈愿，而不只是对未来的预测；译文不淡化这种司法性诉求。
- issue: מֵרְאוֹת所表达的关系
  choice: 按结果或能力译为“不能看见”
  alternative: 较形式对应地译为“以致看不见”或“不得看见”
  rationale: 原文结构可以较直译为“离开看见”，其语义重点是视觉受到阻碍。“不能看见”在现代汉语中清楚自然，同时不额外说明致盲的具体机制。
translation_notes:
  register: 采用现代、庄重而易懂的祈愿句式。以重复的“愿”呈现希伯来诗句两部分的平行结构；避免生硬的“腰肢”或古奥的“腰胯”，同时用脚注保留末一动词兼具颤动与失稳的歧义。
