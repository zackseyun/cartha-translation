  text: אַל יֵ֘בֹ֤שׁוּ בִ֨/י קֹוֶי/ךָ֮ אֲדֹנָ֥/י יְהוִ֗ה צְבָ֫א֥וֹת אַל יִכָּ֣לְמוּ בִ֣/י מְבַקְשֶׁ֑י/ךָ אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/006.yaml
  text: Let not those who hope in you be put to shame because of me[a], Lord Yahweh of hosts; let not those who seek you be humiliated because of me[b], God of Israel.
translation:
  language: zh_hans
  text: 愿那些等候你[a]的人不要因我蒙羞，主—万军之耶和华[b]啊；愿那些寻求你的人不要因我受辱，以色列的神啊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候”也可译作“仰望”或“盼望”；希伯来文分词表达带着期待的等候。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为“主—万军之耶和华”；“耶和华”代表神名יהוה，“万军”保留这一神圣称号的原有意象。
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: 蒙羞
  rationale: בוש在此指遭受羞耻、落入难堪；“蒙羞”简洁自然，也保留祈愿中的结果意味。
- source_word: בִי
  choice: 因我
  rationale: 此处介词בִּ与第一人称代词连用，按语境表示诗人可能成为他人蒙羞或受辱的缘由；“因我”准确而自然。
- source_word: קֹוֶיךָ
  choice: 等候你的人
  rationale: קוה的分词兼有等候与怀着盼望期待之意；正文用“等候”保留具体动作，脚注说明其中的盼望意味。
- source_word: אֲדֹנָי יְהוָה צְבָאוֹת
  choice: 主耶和华—万军之主
  rationale: “主”对应אֲדֹנָי，“耶和华”直接标示神名יהוה；“万军之主”自然传达צְבָאוֹת这一称号，并保留其军旅意象。破折号表明后半为称号而非另一个对象。
- source_word: יִכָּלְמוּ
  choice: 受辱
  rationale: כלם与בוש意义相近，却更侧重遭受羞辱；用“受辱”与前句“蒙羞”形成对应，同时保留两个希伯来动词的细微差别。
- source_word: מְבַקְשֶׁיךָ
  choice: 寻求你的人
  rationale: בקש的分词表示持续寻求；“寻求你的人”符合现代汉语，也保留其主动意味。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 按构词关系直译，并借助“啊”明确其呼语功能。
theological_decisions:
- issue: 复合神名称号אֲדֹנָי יְהוָה צְבָאוֹת的译法
  choice: 主耶和华—万军之主
  alternative: 主万军之耶和华；主雅威—万军之主
  rationale: 正文既保留אֲדֹנָי“主”，也以中文通行形式“耶和华”标示יהוה这一专名；צְבָאוֹת不抽象化为“全能者”，而保留“万军”的原有意象。
- issue: 诗人是否承认自己必然会使敬虔者蒙羞
  choice: 保留祈愿式，不说明具体原因
  alternative: 解释为诗人的罪、苦难或失败使别人失望
  rationale: 原文只祈求等候神、寻求神的人不要“因我”蒙羞或受辱，没有交代诗人为何可能成为原因；译文不替原文消除这一开放性和张力。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。两句以“愿……不要……”构成平行结构；分别使用“蒙羞”和“受辱”，既维持诗歌对应，也反映בוש与כלם的词汇差别。
