lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: 以……为
  rationale: נתן在此与“我的衣服”和“麻布”构成使役性表达，意为把麻布作为自己的衣服；“以……为”简洁保留这一关系。
- source_word: לְבוּשִׁי
  choice: 衣
  rationale: 指诗人所穿的衣物；在“以麻布为衣”这一现代汉语表达中自然凝练。
- source_word: שָׂק
  choice: 麻布
  rationale: 指用于哀悼、禁食或自卑的粗糙布料；“麻布”是中文圣经语境中清楚且通行的对应词。
- source_word: וָאֱהִי
  choice: 竟成了
  rationale: היה表示进入某种结果状态；“成了”体现转变，“竟”自然传达本节受辱的反差，但不额外界定原因。
- source_word: לָהֶם
  choice: 他们的
  rationale: 希伯来语介词表示诗人与那些嘲弄者之间的关系；中文以所属结构表达最自然。
- source_word: לְמָשָׁל
  choice: 笑柄
  rationale: מָשָׁל可指箴言、俗语、比喻或供人传说的话；在本诗遭人羞辱的语境中，“笑柄”准确传达诗人成为众人讥讽对象的含义，同时以脚注保留其“口头说法”层面的词义。
