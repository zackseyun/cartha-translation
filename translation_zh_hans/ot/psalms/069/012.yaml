  yaml_path: translation/ot/psalms/069/012.yaml
  text: Those who sit in the gate talk about me[b][a], and I am the song of those who drink strong drink.
translation:
  language: zh_hans
  text: 坐在城门口的人谈论我[a]；我成了喝烈酒之人所唱的歌。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城门口”在古代城市中是办理公共事务、交往和审判的场所；这里可能指公开且具有社会影响力的议论，并非仅指守门人。
    reason: cultural_note
  - marker: b
    text: 本节也可译作：“坐在城门口的人谈论我，喝烈酒的人也唱歌取笑我。”原文只说他们以诗人为歌唱的题材；“取笑”是从上下文推知的。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂיחוּ בִי
  choice: 谈论我
  rationale: שׂיח 可指思想、默想，也可指谈说；在本节公开议论和饮酒者歌唱的敌对语境中，指以诗人为话题的谈说最合适。בִי 表示谈论的对象，译为“谈论我”而不直接译成“攻击我”，以免把语境暗示写进词义。
- source_word: יֹשְׁבֵי שָׁעַר
  choice: 坐在城门口的人
  rationale: 直译为“坐城门的人”。古代城门区域是公共事务、交往和审判的场所；“坐在城门口的人”保留原文意象，又不武断限定为守门人或长老。
- source_word: וּנְגִינוֹת
  choice: 拿我当歌唱
  rationale: נְגִינוֹת 意为歌曲或伴乐之歌。原文第二分句省略了明确宾语或系词，借与上句平行表达诗人成了他们歌唱的题材；“拿我当歌唱”以自然汉语补明这一隐含关系。
- source_word: שׁוֹתֵי שֵׁכָר
  choice: 喝烈酒的人
  rationale: שֵׁכָר 指能使人醉的饮料，常与葡萄酒有别。“烈酒”简洁保留其酒类含义；译作“醉汉”虽符合语境，却会把饮酒者直接判定为已经醉酒。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“城门口”保留古代公共空间的意象；分号呈现希伯来诗歌的平行结构。“拿我当歌唱”略带诗意，但在现代汉语中仍清楚自然，并保留原文没有明说“嘲笑”的含蓄性。
