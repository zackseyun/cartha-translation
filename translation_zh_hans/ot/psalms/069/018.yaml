base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/018.yaml
  text: Come near to my soul[a]; redeem it. Because of my enemies[b], ransom me.
translation:
  language: zh_hans
  text: 求你临近我，救赎我的性命[a]；因我的仇敌[b]，求你赎回我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”所译的希伯来词也可指“生命”或“自己”，传统上也常译作“灵魂”。
    reason: lexical_alternative
  - marker: b
    text: “因我的仇敌”也可较直译为“为了我的仇敌”；这里按上下文理解为仇敌造成的威胁是求救的缘由。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָה
  choice: 求你亲近
  rationale: 该词是קרב的Qal命令式，表达诗人直接恳求上帝临近；加“求你”符合现代汉语祈求语气，同时保留命令式的迫切感。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נפש可指生命、自己或传统意义上的“灵魂”。本句关乎从仇敌手中获救，“性命”既保留生命整体受威胁的含义，也能作为后面阴性代词后缀的先行对象。
- source_word: גְאָלָהּ
  choice: 救赎它
  rationale: גאל带有赎回、作为救赎者施救的含义；阴性单数后缀回指נפש。译作“救赎它”保留明确宾语，并与下一分句的פדה有所区别。
- source_word: לְמַעַן
  choice: 因
  rationale: למען通常可表示“为了”，也可按语境表示“因、鉴于”。此处仇敌构成诗人求救的缘由，正文采用自然的“因”，同时以脚注保留目的性解读。
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: 复数名词加第一人称单数后缀，直译为“我的仇敌”；措辞庄重且符合诗篇语体。
- source_word: פְּדֵנִי
  choice: 求你赎回我
  rationale: פדה表示付赎价使之释放或赎回。译作“赎回”既区别于前句גאל的“救赎”，又不把具体赎价或后期赎罪理论强加于本节。
theological_decisions:
- issue: 如何区分相邻的גאל与פדה两个救赎动词
  choice: 将גאל译为“救赎”，将פדה译为“赎回”
  alternative: 两者都译为“救赎”，或将后者译为“搭救”
  rationale: 两个动词意义相近却并不相同。采用不同译词可保留希伯来诗句的词汇层次和递进感，同时避免把“赎回”解释成一套本节未明说的赎罪机制。
- issue: לְמַעַן与“我的仇敌”的逻辑关系
  choice: 译作“因我的仇敌”，理解为仇敌造成的处境是求救缘由
  alternative: 译作“为了我的仇敌”或“鉴于我的仇敌”
  rationale: 上下文中的敌对威胁更自然地构成请求施救的原因；但希伯来短语本身容许较字面的目的性表达，故以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的诗篇祈求语体。“求你”显明直接恳求；“性命—它”保留原文的回指结构；两个相关的救赎动词分别译作“救赎”和“赎回”。脚注标记均置于其所解释的正文短语之后。
