base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/010.yaml
  text: When I wept with fasting in my soul[b][a], it became a reproach to me.
translation:
  language: zh_hans
  text: 我哭泣并禁食[a]；这成了对我的羞辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语在“禁食”后有“我自己／我的生命”（直译“我的魂”）。这可指我以禁食使自己受苦，也可理解为我发自内心地哭泣。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְכֶּה
  choice: 哭泣
  rationale: בכה意为“哭泣”。与后半句构成行动及其结果的关系；中文用逗号自然承接，无须机械译出句首的ו。
- source_word: בַצּוֹם
  choice: 禁食
  rationale: צוֹם指禁食；介词ב在这里可表达伴随情形。“我禁食、内心哭泣”保留禁食与哭泣相伴的意思。
- source_word: נַפְשִׁי
  choice: 内心
  rationale: נֶפֶשׁ可指生命、自我、心灵，也可能在此与禁食构成“禁食己身”的表达。译作“内心”保留其明确出现及深层个人感受，又避免现代中文“灵魂哭泣”的生硬感。
- source_word: וַתְּהִי
  choice: 这竟成了
  rationale: היה在此表达前述行为所导致的处境。“这”回指禁食哭泣一事，“竟”自然传达出乎意料而受辱的语气，但不改变命题内容。
- source_word: לַחֲרָפוֹת
  choice: 羞辱
  rationale: חֲרָפוֹת形式上为复数，可表示辱骂、羞耻或受人讥讽的缘由。中文抽象名词“羞辱”无需体现形态复数，且适合此结构。
- source_word: לִי
  choice: 我的
  rationale: לִי标明受影响的人；“成了我的羞辱”是自然中文，相当于“对我成了羞辱”。
theological_decisions:
- issue: נַפְשִׁי与禁食、哭泣之间的句法关系
  choice: 我禁食、内心哭泣
  alternative: 我以禁食苦待自己，哭泣不止；或：我禁食时哭泣，我的心……
  rationale: 希伯来语的简练结构容许把נַפְשִׁי理解为哭泣的内在层面，也可能与禁食相连，指禁食己身。正文保留“内心”而不补入“苦待”，脚注交代另一种理解，避免借平行经文消解原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“这竟成了我的羞辱”简洁呈现行动与受辱结果。正文须带脚注标记，故出版文本应为：“我禁食、内心哭泣[a]，这竟成了我的羞辱。”
