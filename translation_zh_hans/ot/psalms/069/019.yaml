  text: אַתָּ֤ה יָדַ֗עְתָּ חֶרְפָּתִ֣/י וּ֭/בָשְׁתִּ/י וּ/כְלִמָּתִ֑/י נֶ֝גְדְּ/ךָ֗ כָּל צוֹרְרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/019.yaml
  text: You know my reproach[a], my shame, and my humiliation; all my adversaries are before you.
translation:
  language: zh_hans
  text: 你知道我所受的羞辱、羞耻和凌辱；我所有的仇敌都在你面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: 你知道
  rationale: 该词是 ידע 的 Qal 完成式第二人称阳性单数；在向上帝直接祷告的语境中，译为现在时“你知道”，自然表达他已经并且完全知晓。
- source_word: חֶרְפָּתִי
  choice: 我所受的羞辱
  rationale: חֶרְפָּה 可指别人加给人的责骂、讥讽与羞辱。加上“所受的”可清楚表达这是诗人遭受的社会性羞辱，而非他的可耻行为。
- source_word: בָשְׁתִּי
  choice: 我的羞耻
  rationale: 该名词表示羞耻或失去尊荣；“羞耻”是现代汉语中直接、自然且力度适当的对应词。
- source_word: כְלִמָּתִי
  choice: 我的凌辱
  rationale: כְּלִמָּה 与“羞耻”语义相近，但可突出公开受辱或遭人侮慢。“凌辱”既保留近义词的层叠，也避免与前词合并。
- source_word: נֶגְדְּךָ
  choice: 都在你面前
  rationale: נֶגֶד 加第二人称后缀表示“在你面前”；这里暗示上帝清楚看见这些敌对者，译文保留其空间意象，不进一步解释。
- source_word: כָּל
  choice: 所有的
  rationale: 该量词涵盖全体，与复数名词搭配时，“所有的”在现代汉语中自然明确。
- source_word: צוֹרְרָי
  choice: 我的仇敌
  rationale: 源自动词 צרר，指敌对、压迫诗人的人。“仇敌”准确表达主动的敌意，也符合诗篇庄重的诗体语域。
