base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/020.yaml
  text: Reproach has broken my heart[a], and I am sick; I looked for sympathy, but there was none, and for comforters, but I found none.
translation:
  language: zh_hans
  text: 羞辱使我心碎；我已病弱。我盼望有人同情[a]，却无人同情；盼望安慰者，却找不到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同情”也可译作“怜悯”；希伯来语指对受苦者表示悲悯、与其一同哀伤。
    reason: 词义备选说明
lexical_decisions:
- source_word: חֶרְפָּה
  choice: 辱骂
  rationale: 该词兼有他人的羞辱、讥诮及由此带来的羞耻之意；“辱骂”在现代汉语中自然，并能突出诗人遭受的言语攻击。
- source_word: שָׁבְרָה לִבִּי
  choice: 使我心碎
  rationale: 直译“击碎了我的心”；“使我心碎”保留“心”的意象，并自然表达内在情感与意志遭受重创。
- source_word: וָאֲנוּשָׁה
  choice: 我已病弱
  rationale: 此处表示严重受创、衰弱或病重的状态。“病弱”保留身体或整体生命状态受损的含混性，避免过度确定为具体疾病或“无可医治”。
- source_word: וָאֲקַוֶּה
  choice: 我盼望
  rationale: 该动词表示等候、期盼；“盼望”既保留期待之意，也适合随后期待有人回应的语境。
- source_word: לָנוּד
  choice: 有人同情
  rationale: 此处的不定式表示向受苦者表达怜悯、感同身受。“有人同情”用自然汉语显明所期待的是人的回应，同时避免与下一分句的“安慰”重叠。
- source_word: וָאַיִן
  choice: 却一个也没有
  rationale: 原文以不存在的表达强调完全无人回应；“却”体现语境中的转折和失望。
- source_word: וְלַמְנַחֲמִים
  choice: 有人安慰
  rationale: 原文复数分词指安慰者。转译为“有人安慰”更符合现代汉语表达，同时保留对人的寻求。
- source_word: וְלֹא מָצָאתִי
  choice: 却一个也找不到
  rationale: 保留“寻找而未找到”的明确动作，并与上一分句“一个也没有”形成哀歌式平行。
theological_decisions:
- issue: 基督教传统中的弥赛亚应用
  choice: 正文首先按诗篇中受苦者个人哀歌的希伯来语语境翻译，不加入明确的弥赛亚称谓。
  alternative: 在正文中把本节直接表述为对弥赛亚受苦的预言。
  rationale: 新约将诗篇69篇的若干内容应用于耶稣，但本节的翻译应忠实呈现其自身的希伯来语意义；现有措辞仍为后来的弥赛亚应用保留空间，而不在正文中预先限定解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“心碎”保留诗歌意象；分号呈现原文两组期待落空的平行结构。脚注标记置于“心碎”之后，以对应所附词义说明，但说明内容实际涉及后文“同情”。
