source:
  edition: WLC
  text: כִּֽי שֹׁמֵ֣עַ אֶל אֶבְיוֹנִ֣ים יְהוָ֑ה וְ/אֶת אֲ֝סִירָ֗י/ו לֹ֣א בָזָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/033.yaml
  text: For Yahweh hears the needy[a], and he does not despise his prisoners.
translation:
  language: zh_hans
  text: 因为雅威垂听穷乏的人，也不藐视他的囚徒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的俘虏”。希伯来语此词可泛指受捆绑、监禁或俘获的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明呼吁人赞美上帝的理由，保留原文的因果关系。
- source_word: שֹׁמֵעַ אֶל
  choice: 垂听
  rationale: 这里不只表示听见声音，也含有留意并回应祈求的意味；“垂听”在现代中文宗教诗歌语境中庄重而易懂。
- source_word: אֶבְיוֹנִים
  choice: 穷乏人
  rationale: 该词指贫穷、缺乏而处于弱势的人；“穷乏人”既保留物质匮乏的核心含义，也不把范围局限得过窄。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文常见音译呈现四字神名，保留其专名性质，而不以称号代替。
- source_word: אֲסִירָיו
  choice: 属他的被囚者
  rationale: 保留第三人称单数所属后缀，同时用“被囚者”表达受捆绑或拘禁的人，避免“他的囚徒”被误解为由他亲自囚禁的人。
- source_word: לֹא בָזָה
  choice: 不藐视
  rationale: 准确表达不以轻蔑态度看待或弃绝；与前半句的惯常行动并列，按诗歌中的一般真理译为现在时。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”保留专名，并较贴近学界通常重构的读音。
- issue: אֲסִירָיו 中所属后缀的含义
  choice: 属他的被囚者
  alternative: 他的囚徒
  rationale: 明确保留“他的”这一关系，却不进一步判定这些人为何或被谁囚禁；这样既保留他们属于雅威的神学意味，也不把所有格误读为施囚关系。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“垂听”“穷乏人”“藐视”适合诗篇语体，又能为普通读者理解；脚注标记置于其实际说明的“被囚者”之后。
