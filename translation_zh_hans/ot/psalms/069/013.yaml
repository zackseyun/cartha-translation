  text: וַ/אֲנִ֤י תְפִלָּתִֽ/י לְ/ךָ֨ יְהוָ֡ה עֵ֤ת רָצ֗וֹן אֱלֹהִ֥ים בְּ/רָב חַסְדֶּ֑/ךָ עֲ֝נֵ֗/נִי בֶּ/אֱמֶ֥ת יִשְׁעֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/013.yaml
  text: But as for me[a], my prayer is to you, O Yahweh, at a time of favor; O God, in the abundance of your steadfast love[b], answer me in the truth of your salvation.
translation:
  language: zh_hans
  text: '但至于我，耶和华啊，

    在悦纳的时候[a]，我向你祷告；

    上帝啊，求你凭你丰盛的慈爱，

    按你救恩的信实[b]回答我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蒙悦纳的时候”或“合宜的时候”。这个希伯来语词组指上帝愿意垂听并采取行动的有利时机。
    reason: lexical_alternative
  - marker: b
    text: 或译“按你救恩的真实”。希伯来语אֱמֶת可指真实，也可指信实、可靠。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 独立代词带有强调和对比意味；“至于我”自然保留这种语气，而不必额外强化为与上下文不相称的转折。
- source_word: תְפִלָּתִי לְךָ
  choice: 我的祷告是向你
  rationale: 直译祷告的所属与方向；中文补出“是”，使名词句自然清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣专名音译，不以称号替代原文专名。
- source_word: עֵת רָצוֹן
  choice: 悦纳的时候
  rationale: רָצוֹן在此指蒙悦纳、适宜神垂听并采取行动的时机；“悦纳的时候”兼顾诗体和传统语义。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 作为再次直接呼告，译出语气词“啊”，使中文呼语明确。
- source_word: בְּרָב חַסְדֶּךָ
  choice: 凭丰盛的慈爱
  rationale: בְּ可表达依据或凭借；חֶסֶד涵盖坚定、忠诚而施恩的爱，“慈爱”简洁庄重，并避免把词义局限于某一教义术语。
- source_word: עֲנֵנִי
  choice: 回答我
  rationale: 祷告语境中的直接命令式，指求神垂听并回应。
- source_word: בֶּאֱמֶת יִשְׁעֶךָ
  choice: 以你拯救的信实
  rationale: אֱמֶת可指真实、信实或可靠；“你拯救的信实”保留原文属格关系，并表达神的拯救可靠可信，而不把它改写成单纯的抽象真理。
theological_decisions:
- issue: 神圣专名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神圣专名而非普通称号。正文保留专名；“耶和华”是现代简体中文圣经语境中最通行、最易识别的音译，同时不以“主”取代原名。
- issue: אֱמֶת修饰“拯救”时的语义
  choice: 信实
  alternative: 真实／可靠
  rationale: 该词兼有真实、信实和可靠之意。语境强调神施行拯救的可信可靠，正文采用“信实”，脚注保留“真实”的可能，避免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。按希伯来诗句分行，并保留直接呼告、祈求语气及“真实／信实”的语义张力。
