  text: יְֽ֭הַלְלוּ/הוּ שָׁמַ֣יִם וָ/אָ֑רֶץ יַ֝מִּ֗ים וְֽ/כָל רֹמֵ֥שׂ בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/034.yaml
  text: Let heaven and earth praise him[c][b][a], the seas and everything that moves in them.
translation:
  language: zh_hans
  text: 愿天[b]与地、众海，以及其中一切活动的生物[c]，都赞美他[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“天与地……都要赞美他”；这里的希伯来语动词可理解为劝愿或号召，也有人理解为预告：“天与地……必赞美他。”
    reason: alternative_reading
  - marker: b
    text: 希伯来语作“诸天和地”；这里用“天与地”表达这一整体性的固定搭配。
    reason: lexical_alternative
  - marker: c
    text: 或译“一切爬行的生物”或“一切成群活动的生物”。这个希伯来语词可指移动、爬行或群集活动的生物。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלְלוּהוּ
  choice: 愿……都赞美他
  rationale: הלל 的 Piel 未完成式第三人称复数带第三人称阳性单数宾语；在本诗语境中最自然地表达劝愿或号召。“愿……赞美他”保留明确宾语，也不把它硬译成单纯的未来陈述。
- source_word: שָׁמַיִם
  choice: 天
  rationale: 该词形态上为复数，但常作集合概念；现代汉语固定搭配“天与地”自然、庄重，也能涵盖整个天界。
- source_word: וָאָרֶץ
  choice: 与地
  rationale: 与“天”构成涵盖受造界的诗歌性对举；此处指全地，不是某一片土地。
- source_word: יַמִּים
  choice: 海洋
  rationale: 原文为复数“众海”；汉语“海洋”可自然地作集合称谓，并与后面的复数代词所指相合。
- source_word: וְכָל רֹמֵשׂ
  choice: 以及其中一切游动的生物
  rationale: רמש 的分词可指移动、爬行或成群活动的生物；因所指地点是海洋，“游动的生物”在现代汉语中清楚自然，同时用脚注保留词义范围。
- source_word: בָּם
  choice: 其中
  rationale: 第三人称阳性复数后缀最自然地回指前面的“海洋”；“其中”简洁保留这一指代关系。
theological_decisions:
- issue: 赞美句式是劝愿、号召，还是未来预告
  choice: 译作“愿……赞美他”，表达诗歌性的劝愿与号召
  alternative: “天与地……都要赞美他”或“天与地……必赞美他”
  rationale: 希伯来语未完成式在此可有祈使意味，也可能被理解为未来陈述。正文采用较符合上下文的劝愿读法，脚注说明预测性理解，以保留语法上的张力。
- issue: 参与赞美的受造界范围
  choice: 将天、地、海洋及海中所有活动的生物并列为赞美主体
  alternative: 把末项仅限于狭义的爬行动物
  rationale: רמש 的语义范围比狭义“爬虫”更广，海洋语境也支持泛指其中各种移动的生物；这样既呈现宇宙性赞美的范围，也不增添原文以外的教义限定。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“愿”体现劝愿语气；“天与地”保留汉语常见的宇宙性对举；逗号安排使并列主体清楚，并以“都”统摄整组主语。感叹号传达赞美号召的诗歌力度。
