  text: תְּהִי טִֽירָתָ֥/ם נְשַׁמָּ֑ה בְּ֝/אָהֳלֵי/הֶ֗ם אַל יְהִ֥י יֹשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/025.yaml
  text: May their encampment become desolate[b][a]; let there be no one dwelling in their tents.
translation:
  language: zh_hans
  text: 愿他们的营地荒废[a]；愿他们的帐棚中无人居住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “营地”也可译作“营寨”或“居所”。
    reason: lexical_alternative
  - marker: b
    text: “帐棚”也可引申为“住处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי
  choice: 愿……荒废
  rationale: 该动词在此具有祈愿语气；用“愿”表达咒诅性祈求，而不是把它译成单纯的将来事实。
- source_word: טִירָתָם
  choice: 他们的营地
  rationale: טִירָה可指营地、营寨或居所；“营地”保留具体的群体居住意象，并与下句“帐棚”形成自然的诗歌平行。
- source_word: נְשַׁמָּה
  choice: 荒废
  rationale: 该词表示荒凉、毁坏的状态；与“愿……荒废”搭配，现代汉语自然，也保留原文的强烈语气。
- source_word: בְּאָהֳלֵיהֶם
  choice: 在他们的帐棚中
  rationale: אֹהֶל的本义是“帐棚”，虽可引申为住处，但直译能保留希伯来诗歌的具体图像。
- source_word: אַל יְהִי
  choice: 愿……无人
  rationale: 否定祈愿结构，表达诗人的祈求；“愿……无人”简洁地保留其意愿语气。
- source_word: יֹשֵׁב
  choice: 居住
  rationale: ישב的分词在这里指居住的人或居住这一状态；译作“无人居住”符合现代汉语习惯，同时准确传达原意。
theological_decisions:
- issue: 哀歌中咒诅性祈愿的语气
  choice: 译为祈求：“愿……；愿……。”
  alternative: 译作陈述或预言：“他们的营地必荒废；他们的帐棚中必无人居住。”
  rationale: 原文使用意愿式和否定意愿结构，语境中是向神发出的咒诅性祈求，并非仅仅预告未来；译文保留这种修辞与神学张力，不将其弱化为客观陈述。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两个分句都用“愿”明确呈现希伯来文的祈愿语气；保留“营地”和“帐棚”的具体意象，避免将原文中过于强烈的咒诅语气解释化或淡化。
