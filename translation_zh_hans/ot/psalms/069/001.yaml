base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/001.yaml
  text: Save me[a], O God, for the waters have come up to my neck.
translation:
  language: zh_hans
  text: '上帝啊，求你救我！

    因为众水已经漫到我的喉咙[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喉咙”所译的希伯来语原词也可指“性命”“自己”或“魂”；在这里众水漫来的语境中，可具体指喉咙。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: 求你救我
  rationale: 使役式命令形带第一人称单数后缀，表达直接而急切的求救；“求你救我”既自然，也符合诗篇祷告的语体。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处为呼格；“啊”在现代汉语中清楚标示直接呼求，并保留庄重的祷告语气。
- source_word: כִּי
  choice: 因为
  rationale: 引出求救的理由；“因为”在现代汉语中明确、自然。
- source_word: בָאוּ
  choice: 已经淹到
  rationale: 该动词基本义为“来到”，与“众水”和表示界限的短语连用时，译作“已经淹到”可自然呈现水势逼近身体要害的意象，而不额外指定为洪水。
- source_word: מַיִם
  choice: 众水
  rationale: 保留希伯来诗歌中复数形式的宏大、压迫性意象；“众水”比单纯的“水”更具诗性，又不增添原文没有的具体说明。
- source_word: עַד נָפֶשׁ
  choice: 到我的喉咙
  rationale: נֶפֶשׁ可指生命、自我或魂，也可因与呼吸、吞咽相关而具体指喉咙。溺水意象下，“喉咙”既贴近该词的身体义，也比“颈项”更能传达生命受威胁；较宽的词义保留在脚注中。
theological_decisions:
- issue: 诗歌危难意象中נֶפֶשׁ的译法
  choice: 采用具体的身体义“喉咙”
  alternative: 译作“生命”或较字面的“魂”
  rationale: 本节着重描绘众水淹来的紧迫危险，并非要界定人的构成。译作“喉咙”保留身体化的溺水画面，同时用脚注说明原词也可指生命、自我或魂，以免消除其语义张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“求你救我”体现急切祷告；“众水”保留诗歌色彩，“淹到我的喉咙”清楚传达濒临溺亡的意象。脚注标记置于与נֶפֶשׁ相关的整句意象之后。
