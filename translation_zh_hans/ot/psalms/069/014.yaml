- from: 求你救我脱离淤泥，不要让我沉下去；求你救我脱离恨我的人，脱离深水。
  to: 求你救我脱离淤泥，不要让我沉下去；愿我得救，脱离恨我的人，脱离水的深处。
  rationale: 修订仅调整后半句，以保留希伯来文再次出现的拯救祈愿、其被动表达及“水的深处”的诗歌意象；不改变经文的祷告语境或意义。
