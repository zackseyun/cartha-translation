review_pass:
  verdict: revise
  source_fidelity: 首句准确传达了祈使式“救我”和“不要让我沉下去”。但后半句的 אִנָּצְלָה 是一个重新提出的、带意愿语气的被动式恳求（“愿我得救／获救”）；草稿将其直接改写为第二个“求你救我”，虽在祷告上下文中可理解，却弱化了原文有意重复而句式略异的表达。
  naturalness: 草稿整体自然、庄重，符合现代汉语祷告和诗歌语体。改为“愿我得救”既简洁自然，也能保留原文第二次恳求的句法变化。
  terminology: “淤泥”“恨我的人”均贴近原文且用语恰当。“水的深处”比“深水”更明确反映 מַעֲמַקֵּי（深处、深渊）与“水”的构词关系，同时仍保持自然。
  issues:
  - severity: low
    issue: 后半句未显出被动意愿式的重新祈求
    rationale: אִנָּצְלָה 可译为“愿我得救／获救”。以“愿我得救”保留其祈愿语气及与首句祈使式不同的形式，而不必把原文未明说的施事者再次显性化。
  - severity: low
    issue: “深水”略压缩了“水的深处”的构词意象
    rationale: “深水”是可接受的译法，但“水的深处”更完整呈现 מִמַּעֲמַקֵּי מָיִם，并呼应诗中下沉与被水吞没的意象。
  revised_text: 求你救我脱离淤泥，不要让我沉下去；愿我得救，脱离恨我的人，脱离水的深处。
