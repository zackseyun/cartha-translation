  text: הַצִּילֵ֣/נִי מִ֭/טִּיט וְ/אַל אֶטְבָּ֑עָה אִנָּצְלָ֥ה מִ֝/שֹּֽׂנְאַ֗/י וּ/מִ/מַּֽעֲמַקֵּי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/014.yaml
  text: Rescue me from the mire; do not let me sink[a]. Let me be delivered from those who hate me and from the depths of the waters.
translation:
  language: zh_hans
  text: 求你救我脱离淤泥，不要让我沉下去；愿我得救，脱离恨我的人，脱离水的深处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: 求你救我
  rationale: נצל的使役词干祈使式带第一人称单数后缀，表示恳求上帝主动施救；“求你救我”自然、庄重，也清楚传达祈求语气。
- source_word: מִטִּיט
  choice: 脱离淤泥
  rationale: טיט可指泥、泥浆或淤泥；“淤泥”既符合陷落、下沉的意象，又适合诗体语境。
- source_word: וְאַל אֶטְבָּעָה
  choice: 不要让我沉下去
  rationale: 否定词אַל与第一人称未完成式构成祈愿性的禁止表达；译文以现代汉语自然地呈现“愿我不要沉没”的恳求。
- source_word: אִנָּצְלָה
  choice: 求你救我脱离
  rationale: נצל的被动词干意愿式重申得救的请求。汉语采用主动祈求句，避免生硬的被动表达，同时保留与句首呼求的诗歌平行。
- source_word: מִשֹּׂנְאַי
  choice: 恨我的人
  rationale: 原文直指“恨我的人”，比“仇敌”更贴近词面，也不额外限定这些人的身份。
- source_word: וּמִמַּעֲמַקֵּי מָיִם
  choice: 脱离深水
  rationale: מעמקי מים意为水的深处或深水；“深水”简洁自然，并延续淤泥、下沉和水深的连贯危难意象。
