  yaml_path: translation/ot/psalms/069/024.yaml
  text: Pour out your indignation on them[b][a], and let your burning anger overtake them.
translation:
  language: zh_hans
  text: 求你把你的愤慨[a]倾倒在他们身上；愿你燃烧的怒气[b]追上他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愤慨”或译“愤怒”。
    reason: lexical_alternative
  - marker: b
    text: “燃烧的怒气”直译为“你鼻子的炽热”；这是希伯来语表示盛怒的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָךְ
  choice: 倾倒
  rationale: 这是阳性单数第二人称祈使式；“倾倒”保留了把烈怒如液体倒出的鲜明隐喻，也符合现代汉语表达。
- source_word: עֲלֵיהֶם
  choice: 在他们身上
  rationale: 介词 עַל 加第三人称阳性复数词尾，表示愤慨所临到的对象；“在他们身上”自然地传达其方向性。
- source_word: זַעְמֶךָ
  choice: 你的愤慨
  rationale: זַעַם 可指强烈而带有谴责意味的愤怒；“愤慨”既保留其道德意味，也避免与下句的怒气完全同词重复。
- source_word: וַחֲרוֹן אַפְּךָ
  choice: 愿你燃烧的怒气
  rationale: חֲרוֹן אַף 是以灼热描写盛怒的希伯来语习语；“燃烧的怒气”保留热度意象，同时让现代读者容易理解。连词与后面的未完成式在此构成愿望式祈求。
- source_word: יַשִּׂיגֵם
  choice: 追上他们
  rationale: נשׂג 的使役词干在此表示赶上、追及；“追上”保留怒气如追逐者最终赶上目标的动态画面。
theological_decisions:
- issue: 针对仇敌的咒诅性祈求
  choice: 保留诗人直接求上帝降下愤慨与烈怒的措辞，不作弱化。
  alternative: 意译为“向他们显出你的不悦”等较缓和的说法。
  rationale: 希伯来文本明确祈求上帝的愤慨倾倒并追上仇敌。译文应保留这种神学张力，不因现代读者可能感到不适而淡化。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“求你”明确表达祈使语气，“愿你”自然呈现后半句的愿望式祈求；保留“倾倒”和“追上”两幅原文意象。
