  text: יָגַ֣עְתִּי בְ/קָרְאִ/י֮ נִחַ֪ר גְּר֫וֹנִ֥/י כָּל֥וּ עֵינַ֑/י מְ֝יַחֵ֗ל לֵ/אלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/003.yaml
  text: I am weary from my crying[a]; my throat is parched[b]; my eyes fail while I wait for my God.
translation:
  language: zh_hans
  text: 我因呼求而疲惫不堪，喉咙焦干[a]；我等候[b]我的上帝，眼睛都昏花了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“喉咙嘶哑”。希伯来文更直接描写喉咙因长久呼求而干燥、灼热。
    reason: lexical_alternative
  - marker: b
    text: 或译“盼望”。这个希伯来语动词既可表示等候，也可表示怀着盼望期待。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי בְקָרְאִי
  choice: 我因呼求而疲惫不堪
  rationale: יגע表示因持续行动而达到疲惫、困乏的状态；בְקָרְאִי在哀歌语境中是向上帝呼求，介词在此表达原因。译文既保留因果关系，也体现反复呼求造成的深度疲惫。
- source_word: נִחַר גְּרוֹנִי
  choice: 喉咙焦干
  rationale: נחר在这里描写发热、干燥或灼热的状态；“焦干”保留希伯来文干燥灼热的身体意象，同时适合持续呼求后的喉咙状态。
- source_word: כָּלוּ עֵינַי
  choice: 眼睛都昏花了
  rationale: כלה可表示耗尽、衰竭或到了尽头。以“眼睛”为主语时，“昏花”是自然的现代汉语，表达长久等候中视力和精力衰退的具身意象。
- source_word: מְיַחֵל לֵאלֹהָי
  choice: 我等候我的上帝
  rationale: יחל兼有等候与怀着盼望期待之意；“等候”突出漫长持续的处境，而脚注保留其盼望层面。第一人称所属后缀译作“我的”，保留诗人与上帝之间的个人关系。
theological_decisions:
- issue: יחל所含“等候”与“盼望”的双重意味
  choice: 正文采用“等候”
  alternative: “仰望”或“盼望”
  rationale: 上下文强调持续呼求直至身体衰竭，故正文以“等候”呈现时间上的忍耐；但不把这个词缩减为单纯被动等待，脚注说明其中也含怀着盼望期待的意思。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“疲惫不堪”“喉咙焦干”“眼睛都昏花了”形成递进的身体耗竭画面；不使用过度古雅的“困乏”“眼目失明”，也避免把“眼睛耗尽”的诗性表达误解为永久失明。
