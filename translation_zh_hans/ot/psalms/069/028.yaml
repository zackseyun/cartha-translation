base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/028.yaml
  text: Let them be blotted out of the book of life[b][a], and let them not be written with the righteous.
translation:
  language: zh_hans
  text: 愿他们从生命册[a]上被涂去，不得与义人一同被记名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命册”或译“活人名册”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּחוּ
  choice: 愿他们……被涂去
  rationale: 这是מחה的尼法勒未完成式，在连续咒诅祈愿的语境中具有祈愿语气；“愿……被涂去”既保留被动形式，也呼应册簿和记名的书写意象。
- source_word: מִסֵּפֶר
  choice: 从……册上
  rationale: סֵפֶר可指书、卷册或书面名册；此处与“涂去”“记名”相连，“册”自然呈现名册意象。
- source_word: חַיִּים
  choice: 生命
  rationale: חַיִּים既可表示“生命”，也可能指“活人”；正文采用约定俗成且保留神学开放性的“生命册”，脚注列出“活人名册”这一词义可能。
- source_word: וְעִם
  choice: 与……一同
  rationale: עִם本义为“与、同”；结合被动的“被写下”，译作“与……一同”自然表达共同列名。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 这是形容词צַדִּיק的复数名词化用法；“义人”是简洁、庄重且不额外限定其神学含义的现代汉语表达。
- source_word: אַל יִכָּתֵבוּ
  choice: 不得……被记名
  rationale: אַל加未完成式表达否定祈愿；כתב的尼法勒形式本义为“被写下”。“被记名”在现代汉语中自然表达列入册中的意思，同时保持被动和书写意象。
theological_decisions:
- issue: 咒诅祈愿中的“生命册”所指为何
  choice: 保留“生命册”这一隐喻，不判定它专指今世存活、群体成员身份或末世得救。
  alternative: 译为“活人名册”，明确理解为活着之人的名录。
  rationale: 希伯来语חַיִּים容许“生命”或“活人”的理解，诗句本身没有强制限定其神学范围；保留传统隐喻可维持原文的张力。
- issue: 两个动词形式的语气
  choice: 按祈愿或请求理解，以“愿……不得……”表达。
  alternative: 按陈述或预言理解为“他们必被涂去，也不会被写下”。
  rationale: 本节位于连续的咒诅祈愿中，未完成式和אַל结构在此具有祈愿功能，不宜改成单纯预告。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈愿语体。“涂去”与“记名”相互照应，保持原文的册簿书写意象；不用较生硬的“被写下”。
