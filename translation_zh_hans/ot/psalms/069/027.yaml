  text: תְּֽנָ/ה עָ֭וֺן עַל עֲוֺנָ֑/ם וְ/אַל יָ֝בֹ֗אוּ בְּ/צִדְקָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/027.yaml
  text: Add iniquity to their iniquity[b][a], and do not let them come into your righteousness.
translation:
  language: zh_hans
  text: 求你在他们的罪孽上加添罪孽[a]，不要让他们进入你的公义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”也可理解为“罪责”，或罪孽所招致的后果；本句也可译作“在他们的罪责上再加罪责”。
    reason: lexical_alternative
  - marker: b
    text: “你的公义”也可译作“你的正义”；这里可能指上帝施行公正、拯救或伸冤的作为。
    reason: alternative_reading
lexical_decisions:
- source_word: תְּנָה
  choice: 加添
  rationale: 该词是נתן的祈使式，基本义为“给、放置”；与“罪孽在罪孽之上”连用时，译作“加添”能自然表达累加之意，并保留咒诅性祈求的力度。
- source_word: עָוֺן / עֲוֺנָם
  choice: 罪孽／他们的罪孽
  rationale: עָוֺן可指罪孽、罪责，也可指罪所招致的后果。正文用“罪孽”保留道德过犯的核心含义，并在两个位置保持同词复现；脚注说明其语义范围。
- source_word: עַל
  choice: 在……上
  rationale: 保留介词“在、在……之上”的叠加意象；中文“在他们的罪孽上加添罪孽”虽庄重，却仍清楚自然。
- source_word: וְאַל יָבֹאוּ
  choice: 不要让他们进入
  rationale: אַל加未完成式表达否定愿望或祈求。译成“不要让他们进入”，明确这是向上帝发出的祈求，而非单纯陈述。
- source_word: בְּצִדְקָתֶךָ
  choice: 你的公义
  rationale: צְדָקָה在诗篇中可兼有公义、正义以及施行拯救或伸冤的作为等含义。正文保留宽泛的“公义”，不把它限定为某一种神学解释。
theological_decisions:
- issue: 咒诅语境中“你的公义”的含义
  choice: 你的公义
  alternative: 你的正义；你施行公正或伸冤的作为
  rationale: 希伯来语可指上帝公义的属性，也可能唤起他施行公正、拯救或伸冤的行动。正文不将这种张力缩减为称义、蒙悦纳或审判中的任何单一概念，脚注保留主要替代读法。
- issue: “加添罪孽”的对象是过犯、罪责还是惩罚
  choice: 正文译作“加添罪孽”
  alternative: 罪上加罪；加重他们的罪责；在他们所受的罪罚上再加罪罚
  rationale: עָוֺן本身容许过犯、罪责及罪的后果等相关含义。正文采用最直接的词汇对应，不武断认定上帝使人犯罪或仅仅加重惩罚；脚注明示歧义。
translation_notes:
  register: 采用现代、庄重且可朗读的诗体表达。“求你”补明希伯来语祈使句向上帝发出的请求；“在……上加添……”保留原文重复和层叠结构。所有脚注标记均紧随相关词语出现。
