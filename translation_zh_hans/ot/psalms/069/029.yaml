  text: וַ֭/אֲנִי עָנִ֣י וְ/כוֹאֵ֑ב יְשׁוּעָתְ/ךָ֖ אֱלֹהִ֣ים תְּשַׂגְּבֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/029.yaml
  text: But as for me[a], I am afflicted and in pain; O God[c][b], let your salvation set me on high.
translation:
  language: zh_hans
  text: 但至于我，我困苦疼痛；上帝啊，愿你的拯救把我安置在高处[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝啊，你的拯救必把我安置在高处。”希伯来语动词也可理解为对未来的陈述，而不是祈求。
    reason: alternative_reading
  - marker: b
    text: “安置在高处”所译的希伯来语动词，是把人置于高而难以侵及之处，因此也可译作“保护我”或“使我安稳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 但至于我
  rationale: 连词加独立代词带有承接上文的鲜明对比；“但至于我”保留强调语气。
- source_word: עָנִי
  choice: 困苦
  rationale: 此词既可指贫穷，也可指受压、卑微或身陷苦境；与后面的“疼痛”并列时，“困苦”较贴合语境，又不把含义限于经济贫穷。
- source_word: וְכוֹאֵב
  choice: 疼痛
  rationale: 分词表达持续处于疼痛、受苦的状态；“疼痛”简洁保留其身体与切身苦楚的色彩。
- source_word: יְשׁוּעָתְךָ
  choice: 你的拯救
  rationale: ישועה可指拯救、解救或救助；“拯救”既适合眼前获救的语境，也保留该词较宽的神学内涵。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处是直接呼求；句首移入中文自然的呼语位置，并以“啊”显明呼格。
- source_word: תְּשַׂגְּבֵנִי
  choice: 愿……把我安置在高处
  rationale: שׂגב的加强词干表达置于高而难以侵及之处，因而含有保护、使安全之意。译文保留“高处”的空间隐喻，同时按哀歌祈求语境将未完成式译为愿望语气。
theological_decisions:
- issue: תְּשַׂגְּבֵנִי在本句中的语气
  choice: 祈愿式的请求：“愿……把我安置在高处”
  alternative: 一般将来式的陈述：“你的拯救必把我安置在高处”
  rationale: 该未完成式既可在祷告中带祈愿意味，也可理解为未来陈述。哀歌与呼求的语境较支持祈愿式，但脚注保留另一种真实可能，避免消除原文的语气张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“但至于我”保留原文对比强调；后半句调整呼语位置，使中文祷告语序自然。保留“高处”隐喻，不直接化约为“保护”。
