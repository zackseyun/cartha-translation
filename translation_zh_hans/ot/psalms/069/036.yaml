  text: וְ/זֶ֣רַע עֲ֭בָדָי/ו יִנְחָל֑וּ/הָ וְ/אֹהֲבֵ֥י שְׁ֝מ֗/וֹ יִשְׁכְּנוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/036.yaml
  text: The offspring of his servants will inherit it[b][a], and those who love his name will dwell in it.
translation:
  language: zh_hans
  text: 他仆人的后代必承受为业；爱他名的人必住在那里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那里”及上句“承受为业”所指的对象，在上文语境中指锡安或重建之城；也有人较宽泛地理解为那地或耶路撒冷。
    reason: cross_reference
lexical_decisions:
- source_word: זֶרַע
  choice: 后代
  rationale: 此处是集合意义，指仆人们的子孙后裔；“后代”自然、庄重，也符合现代汉语表达。
- source_word: עֲבָדָיו
  choice: 他的仆人
  rationale: 在诗篇的敬虔与盟约语境中，“仆人”准确表达对上帝的归属和服事，不必突出社会制度中的奴隶身份。
- source_word: יִנְחָלוּהָ
  choice: 必承受那里
  rationale: נחל含有承受产业、取得为业之意；“承受”保留产业传承的内涵，阴性宾语后缀依上下文以地点副词“那里”自然表达。
- source_word: אֹהֲבֵי שְׁמוֹ
  choice: 爱他名的人
  rationale: 保留希伯来文“爱他的名”这一盟约性表达，不简化为“爱他的人”。
- source_word: יִשְׁכְּנוּ בָהּ
  choice: 必住在那里
  rationale: שׁכן表示居住、安居；“住”清楚自然，且“在那里”与阴性后缀所指的地点相合。
theological_decisions:
- issue: “承受那里”和“住在那里”中阴性后缀的所指
  choice: 正文以“那里”承接上文的锡安或重建之城
  alternative: 也可较宽泛地理解为那地或耶路撒冷
  rationale: 紧邻上文提到上帝拯救锡安、重建犹大城邑，因此阴性单数后缀最自然地回指锡安或该城；正文不直接补出专名，以保留原文的指代方式和可能范围。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“必……；……必……”呈现两个平行分句；“承受”保留产业继承色彩，“那里”避免在正文中过度限定阴性代词的所指。
