  text: כִּֽי קִנְאַ֣ת בֵּיתְ/ךָ֣ אֲכָלָ֑תְ/נִי וְ/חֶרְפּ֥וֹת ח֝וֹרְפֶ֗י/ךָ נָפְל֥וּ עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/009.yaml
  text: For zeal for your house has consumed me[b][a], and the reproaches of those who reproach you have fallen on me.
translation:
  language: zh_hans
  text: 因为我为你的家所发的热心把我耗尽了[a][b]；辱骂你的人的辱骂都落在我身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把我耗尽了”也可译作“吞噬了我”；原文动词直译为“吃了我”。
    reason: lexical_alternative
  - marker: b
    text: 约翰福音2:17引用本节，并应用于耶稣。
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出诗人遭遇苦难的原因；“因为”自然保留希伯来语的解释或因果作用。
- source_word: קִנְאַת
  choice: 满腔热忱
  rationale: 此处指为上帝居所而有的强烈委身与热心，并非负面的嫉妒；“满腔热忱”既自然，又能表达其强度。
- source_word: בֵּיתְךָ
  choice: 你的殿
  rationale: 原文直译为“你的家”，在本诗语境中指上帝的圣所；现代汉语用“你的殿”表达清楚，又不额外限定为某一具体建筑名称。
- source_word: אֲכָלָתְנִי
  choice: 吞噬了我
  rationale: 动词本义为“吃”，这里形象地表示热忱把诗人完全耗尽；“吞噬了我”保留原文强烈的拟人意象，也符合现代汉语表达。
- source_word: וְחֶרְפּוֹת חוֹרְפֶיךָ
  choice: 辱骂你的人的辱骂
  rationale: 名词与分词源于同一词根；重复“辱骂”虽有修辞张力，却准确保留原文的同源呼应。
- source_word: נָפְלוּ עָלָי
  choice: 都落在我身上
  rationale: 贴近希伯来语“落在我之上”的表达，清楚表明针对上帝的辱骂由诗人承受。
theological_decisions:
- issue: 本节的弥赛亚及正典关联
  choice: 正文按诗篇中诗人的直接话语翻译，不把后来的基督论应用写入经文本身。
  alternative: 依照约翰福音2:17的引用，在正文中直接指明耶稣或弥赛亚。
  rationale: 希伯来文本直接以诗人的声音说话；新约对本节的应用具有正典意义，但宜用脚注标明，以免在翻译中消除原有语境与后来的基督论关联之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“满腔热忱”表达强烈委身；“吞噬了我”保留诗歌意象。后半句有意保留原文同词根的重复，而不改写成较松散的释义。
