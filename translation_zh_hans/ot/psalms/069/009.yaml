  rationale: 修订以“我为你的家所发的热心”解决原句的句法问题，并将“殿”改为“家”，以保留希伯来原文的措辞与语义余地。“把我耗尽了”在现代汉语中自然表达“吃／吞噬”的比喻性结果；脚注保留更强烈的“吞噬”译法。后半句维持原文的同源重复和“落在我身上”的意象。
