  text: כִּ֤י אֱלֹהִ֨ים י֘וֹשִׁ֤יעַ צִיּ֗וֹן וְ֭/יִבְנֶה עָרֵ֣י יְהוּדָ֑ה וְ/יָ֥שְׁבוּ שָׁ֝֗ם וִ/ירֵשֽׁוּ/הָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/035.yaml
  text: For God will save Zion and build the cities of Judah[b][a], and they will dwell there and possess it.
translation:
  language: zh_hans
  text: 因为上帝必拯救锡安，建造犹大的城邑；他们必住在那里，并承受她[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承受”也可译作“继承”“拥有”或“取得为业”；这个希伯来语动词常用于承受或取得土地。
    reason: lexical_alternative
  - marker: b
    text: 原文作“她”，使用阴性单数代词，可能指锡安，也可能指被拟人化的土地或城地整体。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接上文，为先前的盼望与赞美提供根据；“因为”自然保留其解释、因由作用。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 动词采用单数形式，明确指独一的上帝；“上帝”是现代汉语中庄重且通行的译法。
- source_word: יוֹשִׁיעַ
  choice: 必拯救
  rationale: 使役词干在此表示“拯救、解救”；未完成式在应许语境中具有将来指向，“必”也传达确信语气。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 保留专名的传统汉语音译，不把它直接释作耶路撒冷或信仰群体。
- source_word: וְיִבְנֶה
  choice: 建造
  rationale: בנה 的基本义是“建造”；原文没有明确表达“重建”，故不加入这一解释。
- source_word: עָרֵי יְהוּדָה
  choice: 犹大的城邑
  rationale: 直译该结构；“城邑”庄重自然，并可统指犹大境内各城。
- source_word: וְיָשְׁבוּ
  choice: 他们必住
  rationale: ישׁב 在此表示定居、居住；“住”是清楚自然的现代汉语。动词为复数，译作“他们”，其所指由上下文补足。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留原文简单的地点指示，回指刚提到的锡安及犹大诸城。
- source_word: וִירֵשׁוּהָ
  choice: 并承受她
  rationale: ירשׁ 可指承受产业、取得或占有土地；“承受”兼顾产业继承和取得为业的语义。宾语后缀为阴性单数，以“她”保留原文对锡安或土地的拟人表达。
theological_decisions:
- issue: וִירֵשׁוּהָ 中阴性单数后缀的所指
  choice: 正文译作“承受她”，保留阴性单数和拟人表达。
  alternative: 可译作“承受它”“取得那地”或“得锡安为业”。
  rationale: 后缀可能回指锡安，也可能指被拟人化的土地或城地整体。原文没有明确限定，故不在正文中消除这种含混。
- issue: ירשׁ 的产业与占有语义
  choice: 译作“承受”。
  alternative: 可译作“继承”“拥有”或“取得为业”。
  rationale: 该词在土地语境中兼有继承产业和取得占有之意；“承受”较能保留两方面，而不把经文限定为单纯的所有权表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“城邑”略带诗体色彩，适合诗篇语域；“承受她”有意保留原文的土地产业语义及阴性拟人手法，其较不寻常之处由脚注说明。
