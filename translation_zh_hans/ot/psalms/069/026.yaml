  text: כִּֽי אַתָּ֣ה אֲשֶׁר הִכִּ֣יתָ רָדָ֑פוּ וְ/אֶל מַכְא֖וֹב חֲלָלֶ֣י/ךָ יְסַפֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/026.yaml
  text: For they persecute the one you struck[a], and they recount the pain of those you wounded.
translation:
  language: zh_hans
  text: 因为他们追逼你所击打的人；他们述说你所刺伤之人的痛苦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你所刺伤之人”也可译为“你被刺穿的人”或“你的死者”。希伯来语חֲלָלֶיךָ可指被刺穿、受伤的人，也常指死者或被杀的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出本节对前文审判祈求的原因，保留希伯来语的因果关系。
- source_word: אַתָּה אֲשֶׁר הִכִּיתָ
  choice: 你所击打的人
  rationale: 原文动词为单数；中文补出“人”，使关系结构自然，同时保留单数指向。
- source_word: רָדָפוּ
  choice: 追逼
  rationale: 既保留“追赶、追逐”的基本意象，也表达本处带敌意、迫害性的持续攻击。
- source_word: וְאֶל
  choice: （以话题结构表达）
  rationale: אֶל在此可引出述说所针对的内容；中文采用“……的痛苦，他们还要述说”的结构，避免生硬直译介词。
- source_word: מַכְאוֹב
  choice: 痛苦
  rationale: 直接表达身体或心灵的疼痛、苦楚，并与前半句“击打”形成诗歌呼应。
- source_word: חֲלָלֶיךָ
  choice: 你所刺伤之人
  rationale: 保留חלל所含“刺穿、使受伤”的具体色彩，并将第二人称后缀理解为施事关系；该词也可能指“你所杀的人”，在脚注说明。
- source_word: יְסַפֵּרוּ
  choice: 述说
  rationale: 对应Piel词形“讲述、数说”；不额外断定他们是在嘲弄、夸耀还是传播消息，从而保留语境中的含混。
theological_decisions:
- issue: חֲלָלֶיךָ指受伤者还是被杀者
  choice: 你所刺伤之人
  alternative: 你所杀的人／被你刺死的人
  rationale: 与מַכְאוֹב“痛苦”搭配时，受伤者的理解较为顺畅；但该名词常可指被刺死或阵亡的人，因此不排除死亡含义，并以脚注保留。
- issue: יְסַפֵּרוּ所述行为的敌意程度
  choice: 述说
  alternative: 数说／谈论／宣扬
  rationale: 上下文表明行为出于敌对者，但原动词本身主要是“讲述、数说”；正文不加入“幸灾乐祸”等解释，以免消解原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文；以“追逼”表现敌意，以“还要”突出敌人在上帝击打之后继续加害的递进意味。脚注标记置于整节末尾，说明“刺伤／杀死”的真实词义歧义。
