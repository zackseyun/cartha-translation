review_pass:
  verdict: revise
  source_fidelity: “为你”在现代汉语中通常优先理解为“为了你／替你”，带有目的或受益意味；希伯来语 עָלֶיךָ 此处表达的是“因你、因你的缘故”。“因你而”更准确保留其缘由性，且不把责任归咎于上帝。
  naturalness: 原文“因为我为你承受了……”在汉语中“因为”与“为你”连用略显拗口，并容易产生“为了你”的误解。改为“我因你而承受了……”自然、庄重，也适合诗篇语体。
  terminology: “承受”“辱骂”“羞耻”“遮盖了我的脸”均可接受。“辱骂”可表达 חֶרְפָּה 的外来侮辱，“羞耻”对应 כְלִמָּה；无需引入神学性措辞或脚注。
