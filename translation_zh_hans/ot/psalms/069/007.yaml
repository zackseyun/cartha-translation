  text: For because of you I have borne reproach[b][a]; disgrace has covered my face.
translation:
  language: zh_hans
  text: 我因你而承受了辱骂；羞耻遮盖了我的脸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处引出诗人遭受疏离与羞辱的原因；现代汉语用“因为”即可自然表达其因果兼解释作用，不必机械叠加连接词。
- source_word: עָלֶיךָ
  choice: 为你
  rationale: עַל加第二人称后缀在此表示缘由或关联。“为你”在上下文中自然地表达“因你的缘故”，同时保留可能含有的“为你的缘故”意味。
- source_word: נָשָׂאתִי
  choice: 承受了
  rationale: נשא与“辱骂”搭配时表示承担、忍受；“承受”既自然，又保留背负某物的隐喻余韵。
- source_word: חֶרְפָּה
  choice: 辱骂
  rationale: חֶרְפָּה兼有言语侮辱、责难及由此导致的羞辱之意；“辱骂”突出外界施加的侮辱，并与下句内在、公开的“羞耻”有所区分。
- source_word: כִּסְּתָה
  choice: 遮盖了
  rationale: 保留כסה“覆盖、遮盖”的具体意象；阴性单数动词以随后出现的“羞耻”为主语。
- source_word: כְלִמָּה
  choice: 羞耻
  rationale: כְלִמָּה指羞耻、受辱或蒙羞的状态。“羞耻”是现代汉语中准确自然的对应词，也与“遮盖了我的脸”的形象相合。
- source_word: פָנַי
  choice: 我的脸
  rationale: 此处“脸”构成羞耻遮面的具体形象，宜按字面译出，不泛化为“面前”或“临在”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“为你”较“因为你”更凝练，也避免让措辞听起来像把责任直接归咎于上帝；“辱骂”与“羞耻”分别呈现外来的侮辱和由此造成的蒙羞。
