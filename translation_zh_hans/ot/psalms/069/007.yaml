  to: 我因你而承受了辱骂；羞耻遮盖了我的脸。
  rationale: 将“为你”改为“因你而”，准确表达 עַל 加第二人称后缀的缘由意义，并消除“为了你”的目的性歧义。删除句首“因为”以避免与“因你而”在现代汉语中的不自然重复；本节仍以并列诗行忠实呈现诗人所承受的辱骂和蒙羞意象。
