  - severity: low
    issue: 句首“因为”与“为你”造成汉语表达重复且不够顺畅。
    rationale: 希伯来语 כִּי 的篇章性解释／因果连接可由上下文承接；在单节现代汉语中，保留核心的“因你而”比“因为我为你”更清晰，且不改变本节陈述的意义。
