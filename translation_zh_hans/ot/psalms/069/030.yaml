  text: אֲהַֽלְלָ֣ה שֵׁם אֱלֹהִ֣ים בְּ/שִׁ֑יר וַ/אֲגַדְּלֶ֥/נּוּ בְ/תוֹדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/030.yaml
  text: I will praise the name of God with song[a], and I will magnify him with thanksgiving.
translation:
  language: zh_hans
  text: 我要以诗歌赞美神的名，也要以感恩[a]尊他为大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以感谢祭”；希伯来语“感恩”按上下文也可指献上的感谢祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: 我要……赞美
  rationale: 这是הלל的第一人称单数祈愿式，在诗歌中表达立志或决意；“我要”自然传达这种意愿语气。
- source_word: שֵׁם אֱלֹהִים
  choice: 神的名
  rationale: 保留希伯来语属格结构的意义及其敬虔色彩，同时符合现代汉语表达。
- source_word: בְּשִׁיר
  choice: 以诗歌
  rationale: 介词ב在此表示方式或媒介；“以诗歌”简洁地保留工具性含义。
- source_word: וַאֲגַדְּלֶנּוּ
  choice: 也要……尊他为大
  rationale: גדל的此处词形表示宣扬、承认某者为大；“尊他为大”保留原文意象，并与“赞美”形成平行。三单阳性后缀译作“他”，回指神。
- source_word: בְתוֹדָה
  choice: 以感恩
  rationale: תּוֹדָה可指感恩，也可指感谢祭。上下文围绕赞美和诗歌，因此正文采用抽象意义“感恩”，同时以脚注保留祭物含义的可能性。
theological_decisions:
- issue: תּוֹדָה是指口头的感恩，还是感谢祭
  choice: 口头或歌唱表达的感恩
  alternative: 感谢祭
  rationale: 本节的平行成分是“赞美”“诗歌”和“尊他为大”，所以“感恩”更贴合直接语境；不过该词本身确可指感谢祭，故不排除这一层含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我要……也要……”体现两处祈愿式的决意，并呈现原诗的平行结构；“尊他为大”有意保留原文“使之为大／宣扬其伟大”的表达张力。
