  text: וְ/אַל תַּסְתֵּ֣ר פָּ֭נֶי/ךָ מֵֽ/עַבְדֶּ֑/ךָ כִּֽי צַר לִ֝֗/י מַהֵ֥ר עֲנֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/017.yaml
  text: And do not hide your face from your servant[a], for I am in distress[b]; answer me quickly.
translation:
  language: zh_hans
  text: '不要向你的仆人[b]掩面[a]，

    因为我在急难之中；

    求你快快应允我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“隐藏你的脸”；“脸”在这里可指恩宠、关注或亲近的临在。
    reason: lexical_alternative
  - marker: b
    text: 或译“奴仆”。希伯来语这个词按语境可指仆人或奴仆。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַל
  choice: 不要
  rationale: וְ承接上下文的祈求，在汉语诗歌中无需机械译出；אַל加未完成式表达禁止或恳求，译为“不要”自然准确。
- source_word: תַּסְתֵּר פָּנֶיךָ
  choice: 掩面
  rationale: 保留希伯来文“隐藏你的脸”这一关系性意象；“掩面”在现代汉语中简洁庄重，也能表达不施恩、不垂顾之意，而不把隐喻直接解释掉。
- source_word: מֵעַבְדֶּךָ
  choice: 向你的仆人
  rationale: עבד可指仆人或奴仆；在向上帝祷告的语境中，“仆人”自然表达谦卑归属和服事，正文不特意突出法律上的奴役身份。介词מִן与“掩面”合译为“向……掩面”。
- source_word: כִּי
  choice: 因为
  rationale: 引出前一祈求的理由，直接译为“因为”，清楚保留因果关系。
- source_word: צַר לִי
  choice: 我在急难之中
  rationale: 这一简短结构表达诗人正处于困苦、危急的境况；“急难”兼顾痛苦和紧迫感，符合诗篇的语体。
- source_word: מַהֵר עֲנֵנִי
  choice: 求你快快应允我
  rationale: מַהֵר带有催促、赶快之意，עֲנֵנִי是在祷告中求上帝回答；“快快应允我”既保留紧迫性，也符合现代汉语祈祷用语。“求你”补明希伯来语祈求语气。
theological_decisions:
- issue: 描写上帝关系临在的拟人化语言
  choice: 正文保留“掩面”
  alternative: 不向我显现／不眷顾我
  rationale: “脸”在希伯来语中可表达恩宠、关注和临在。保留“掩面”的形象，可维持原诗的关系性和神学张力，而不在正文中将其化为抽象解释。
- issue: עבד表示人与上帝的关系
  choice: 仆人
  alternative: 奴仆／奴隶
  rationale: 原词语义范围包括仆人和奴仆。本节的祷告语境重在谦卑归属与服事，并非着重法律身份，因此正文采用“仆人”，脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈祷语体。分为三行以呈现理由与紧迫呼求的推进；保留“掩面”的希伯来诗歌意象，用“急难”和“应允”维持诗篇常见的庄重语感。
