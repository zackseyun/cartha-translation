  text: אַל תִּשְׁטְפֵ֤/נִי שִׁבֹּ֣לֶת מַ֭יִם וְ/אַל תִּבְלָעֵ֣/נִי מְצוּלָ֑ה וְ/אַל תֶּאְטַר עָלַ֖/י בְּאֵ֣ר פִּֽי/הָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/015.yaml
  text: Do not let the flood of waters sweep me away[a], and do not let the deep swallow me up[b], and do not let the pit close its mouth over me.
translation:
  language: zh_hans
  text: 不要让洪流把我冲走[a]，不要让深水吞没我，也不要让深坑的口在我上方合拢[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洪流”或译“奔涌的水”。
    reason: lexical_alternative
  - marker: b
    text: “深坑”也可译作“井”；希伯来语此词通常指井，但在本节诗歌的平行意象中，也可指致命的坑。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁטְפֵנִי
  choice: 把我冲走
  rationale: 该词源于 שטף，表示水势淹没或冲卷；“把我冲走”自然传达急流的毁灭性力量。
- source_word: שִׁבֹּלֶת מַיִם
  choice: 奔涌的水
  rationale: שִׁבֹּלֶת 在此可指水流、洪流；“奔涌的水”既保留动态意象，也符合现代汉语诗体表达。
- source_word: תִּבְלָעֵנִי
  choice: 吞没我
  rationale: בלע 的基本意象是“吞下”；在水域语境中，“吞没”兼具自然度与完全被吞噬的力度。
- source_word: מְצוּלָה
  choice: 深渊
  rationale: 该词指水的深处或深水；“深渊”简洁而有诗意，并能与吞没的危险意象相配。
- source_word: תֶּאְטַר
  choice: 合拢
  rationale: 该动词表示关闭、封住；与“口”搭配时，“合拢”生动保留拟人化画面。
- source_word: בְּאֵר
  choice: 深坑
  rationale: בְּאֵר 通常可指井，但本节死亡危险的平行意象容许“坑”的语义；“深坑”在中文中清楚呈现困住诗人的险境，同时以脚注保留“井”的可能。
- source_word: פִּיהָ
  choice: 它的口
  rationale: 直译“它的口”，保留将井或深坑拟人化为会闭口吞人的形象。
- source_word: עָלַי
  choice: 在我头上
  rationale: 介词意为“在我之上”；此处指坑口在诗人上方闭合，“在我头上”使空间关系明确。
theological_decisions: []
