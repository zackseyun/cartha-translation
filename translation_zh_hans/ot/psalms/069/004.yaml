  text: רַבּ֤וּ מִ/שַּׂעֲר֣וֹת רֹאשִׁ/י֮ שֹׂנְאַ֪/י חִ֫נָּ֥ם עָצְמ֣וּ מַ֭צְמִיתַ/י אֹיְבַ֣/י שֶׁ֑קֶר אֲשֶׁ֥ר לֹא גָ֝זַ֗לְתִּי אָ֣ז אָשִֽׁיב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/004.yaml
  text: Those who hate me without cause are more than the hairs of my head[a]; those who would destroy me, my false enemies, are mighty. What I did not steal[b], then I must restore.
translation:
  language: zh_hans
  text: 无故恨我的人，比我头上的头发还多；那些要毁灭我的、虚假地与我为敌的仇敌[a]，十分强大。我没有抢夺的，我竟要偿还[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚假地与我为敌的仇敌”也可译作“虚假的敌人”或“无理与我为敌的人”。希伯来语既可能描述这些敌人虚假，也可能表示他们毫无正当理由地敌对诗人。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“那时我偿还”或“那时我要归还”。上下文可能是说，诗人被迫赔还自己并未抢夺之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: 比我头上的头发还多
  rationale: מִן在此标示比较；这一自然的汉语表达保留了原文以头发喻数量极多的夸张意象。
- source_word: שֹׂנְאַי חִנָּם
  choice: 无故恨我的人
  rationale: חִנָּם在此指没有缘由或正当根据，而非不收报酬；“无故”简洁地保留其道德与申诉意味。
- source_word: עָצְמוּ
  choice: 势力强大
  rationale: 该动词表达强盛、有力量；结合敌对者造成的威胁，“势力强大”比单说“强壮”更符合现代汉语语境。
- source_word: מַצְמִיתַי
  choice: 想要除灭我的人
  rationale: 分词指意图使诗人灭亡的人；“除灭”保留其强烈程度，“想要”传达敌对意图。
- source_word: אֹיְבַי שֶׁקֶר
  choice: 那些以虚假与我为敌的人
  rationale: שֶׁקֶר既可能描述敌人的虚假，也可能表示他们无理、错误地敌对诗人；正文用较宽泛的表达承载两层可能，脚注明示歧义。
- source_word: אֲשֶׁר לֹא גָזַלְתִּי
  choice: 我没有抢夺的
  rationale: גזל通常指以强力夺取或抢掠；“抢夺”较“偷窃”更贴近其词义，同时在汉语中清楚易懂。
- source_word: אָז אָשִׁיב
  choice: 竟要我偿还
  rationale: 字面为“那时我偿还／我要归还”。结合前句的无辜申诉，译文以“竟要我”自然表达被迫赔还的语境含义，同时在脚注保留较直译的可能。
theological_decisions:
- issue: 末句是否明确表达无辜者被迫赔偿
  choice: 我没有抢夺的，竟要我偿还
  alternative: 我没有抢夺的，那时我却偿还
  rationale: 原文只明确说“我偿还／我要归还”，并未直接出现“被迫”一词；但上下文呈现无端仇恨和虚假敌对，“竟要我偿还”传达这种荒谬的不公，又借脚注保留原句较裸露的语法形式。
- issue: שֶׁקֶר修饰敌人还是修饰敌对行为
  choice: 以虚假与我为敌的人
  alternative: 虚假的敌人／无理与我为敌的人
  rationale: 希伯来语容许将שֶׁקֶר理解为敌人的品性，也可理解为他们错误、无理地敌对诗人。正文不把歧义完全固定在某一解释上，脚注列出主要可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留两组平行陈述及末句突转的申诉语气；“除灭”“偿还”略带书面色彩，但在现代普通读者中仍清楚自然。
