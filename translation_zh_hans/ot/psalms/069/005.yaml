source:
  edition: WLC
  text: אֱֽלֹהִ֗ים אַתָּ֣ה יָ֭דַעְתָּ לְ/אִוַּלְתִּ֑/י וְ֝/אַשְׁמוֹתַ֗/י מִמְּ/ךָ֥ לֹא נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/005.yaml
  text: God[a], you know my foolishness[b], and my guilt is not hidden from you.
translation:
  language: zh_hans
  text: 上帝啊，你知道我的愚昧；我的过犯都不能向你隐藏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的过犯都不能向你隐藏”或译：“我的罪责没有向你隐瞒。”希伯来语“过犯”是复数，也可侧重这些行为所带来的罪责。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים אַתָּה
  choice: 上帝啊，你
  rationale: אֱלֹהִים在此是直接呼告；用“啊”自然体现祷告语气。显明的第二人称代词אַתָּה译为“你”，保留强调。
- source_word: יָדַעְתָּ
  choice: 知道
  rationale: ידע的Qal完成式在此表达持续、完全的认知状态，现代汉语用现在时“知道”最自然。
- source_word: לְאִוַּלְתִּי
  choice: 我的愚昧
  rationale: אִוֶּלֶת指带有道德责任的愚妄，并非单指智力不足；“愚昧”兼顾诗体庄重与现代可懂性。
- source_word: וְאַשְׁמוֹתַי
  choice: 我的过犯
  rationale: אַשְׁמוֹת为复数并带第一人称后缀，此处与“我的愚昧”平行，指有罪责的行为或过错，而非祭物；“过犯”既保留具体复数内涵，也避免生硬的“罪责们”。
- source_word: מִמְּךָ לֹא נִכְחָדוּ
  choice: 都不能向你隐藏
  rationale: כחד的Niphal完成式复数表示“没有被隐藏”；מן在此构成从某人的知觉中隐藏这一习语。汉语译作“不能向你隐藏”自然传达没有一项能瞒过上帝，并以“都”呼应复数主语。
theological_decisions:
- issue: 这篇后来在新约中获得弥赛亚应用的诗篇里，说话者承认自己的愚昧和过犯
  choice: 按希伯来文本保留诗人第一人称的认罪，不淡化“我的愚昧”和“我的过犯”
  alternative: 将其直接解释为仅属群体性或代表性的认罪
  rationale: 本节希伯来文明确使用第一人称所有格。译文应保存诗篇原有声音及其神学张力，而不把后来的协调性解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“上帝啊”明确呼告；分号保留两行平行关系。“过犯”较“罪责”更具体，也更自然地承接希伯来语复数。正文唯一脚注标记[a]与脚注对应。
