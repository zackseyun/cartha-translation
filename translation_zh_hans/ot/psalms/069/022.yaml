  text: יְהִֽי שֻׁלְחָנָ֣/ם לִ/פְנֵי/הֶ֣ם לְ/פָ֑ח וְ/לִ/שְׁלוֹמִ֥ים לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/022.yaml
  text: May their table before them become a trap[a], and for their well-being a snare.
translation:
  language: zh_hans
  text: 愿他们面前的餐桌成为网罗；愿他们的福乐[a]成为圈套。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “福乐”或译“安康”或“平安”；原词也可能带有“平安祭”的祭祀联想，本处含义不确定。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: 愿……变成
  rationale: 该祈愿式在这里表达咒诅性的愿望；“愿……变成”既传达意愿语气，也符合现代汉语的庄重表达。
- source_word: שֻׁלְחָנָם
  choice: 他们的筵席
  rationale: 原词直指桌席；“筵席”保留具体的饮食、宴享意象，又比单说“桌子”更能体现此处供应与享乐的语境。
- source_word: לִפְנֵיהֶם
  choice: 他们面前的
  rationale: 保留原文的空间表达，也呈现公开摆在他们面前之物反而成为危险的讽刺意味。
- source_word: לְפָח
  choice: 罗网
  rationale: פח指捕捉猎物的网罗或陷阱；译作“罗网”，与后面的“圈套”形成近义而不完全重复的诗歌对应。
- source_word: וְלִשְׁלוֹמִים
  choice: 他们的福祉
  rationale: שְׁלוֹמִים在本句含义不易确定，可抽象指安康、福乐或太平；主文采用“福祉”，与“筵席”一同呈现本来有益之物转为祸患的反讽，同时用脚注保留其他可能。
- source_word: לְמוֹקֵשׁ
  choice: 变成圈套
  rationale: מוֹקֵשׁ通常指诱捕猎物的圈套；补出承接前句的“变成”，使省略谓语的希伯来诗句在汉语中清楚自然。
theological_decisions:
- issue: 咒诅诗中שְׁלוֹמִים的理解
  choice: 主文译作抽象意义的“他们的福祉”
  alternative: “他们安享太平时”或带祭祀色彩的“他们的平安祭”
  rationale: 本节宣告本为供应和福乐之物反成为审判的工具。原词既可关联完整、安康和太平，也可能让人联想到平安祭；上下文不足以排除这些含义，因此主文采用较自然的抽象表达，并在脚注中保留真实歧义，不将某一神学解释写死。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“筵席—罗网”“福祉—圈套”保留两组反讽和平行结构；第二分句补出“愿……变成”，使希伯来文省略结构在汉语中自然清晰。
