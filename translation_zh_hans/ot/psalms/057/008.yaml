  yaml_path: translation/ot/psalms/057/008.yaml
  text: Awake[a], my glory! Awake[b], harp and lyre! I will awaken the dawn.
translation:
  language: zh_hans
  text: '醒来吧，我的荣耀！[a]

    醒来吧，竖琴和里拉琴！[b]

    我要唤醒黎明。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的荣耀”也可理解为“我的心”“我的灵魂”或“我的全人”；这是诗歌中对诗人自身的指称。
    reason: lexical_alternative
  - marker: b
    text: 原文列出两种古代弦乐器；“竖琴”和“里拉琴”只是便于理解的译名，它们的具体形制以及与现代乐器的对应关系并不确定。
    reason: cultural_note
lexical_decisions:
- source_word: עוּרָה
  choice: 醒来吧
  rationale: 这是动词 עור 的祈使形式，直接发出苏醒的呼唤；“醒来吧”自然、庄重，也保留诗歌中的反复。
- source_word: כְבוֹדִי
  choice: 我的荣耀
  rationale: 按字面保留“我的荣耀”这一诗性自称，不在正文中把它直接解释为“我的心”或“我的全人”，以保存原文的隐喻和歧义。
- source_word: הַנֵּבֶל וְכִנּוֹר
  choice: 琴瑟
  rationale: 两个词均指古代弦乐器，但其具体形制及现代对应名称并不确定；“琴瑟”在现代中文中简洁、雅正，并能表明是两种乐器。脚注说明其历史文化不确定性。
- source_word: אָעִירָה
  choice: 我要唤醒
  rationale: 这是 עור 的使役形，带有意愿或决心色彩；“我要唤醒”既体现使役义，也保留诗人仿佛以歌声使黎明醒来的拟人意象。
- source_word: שָּׁחַר
  choice: 黎明
  rationale: 指破晓、晨曦；“黎明”与“唤醒”搭配自然，并保留鲜明的诗歌意象。
theological_decisions:
- issue: “我的荣耀”是否应解释为人的灵魂或全人
  choice: 正文保留“我的荣耀”
  alternative: 我的心；我的灵魂；我的全人
  rationale: 原文的 כְבוֹדִי 字面为“我的荣耀”，在诗歌中可能用作诗人的自称，但具体所指并不完全确定。正文不把这一诗性张力固定为某种人论解释，备选理解置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体。三次“醒”相关表达保留原文的词根呼应：先呼唤自己和乐器醒来，末句转为“唤醒黎明”。“琴瑟”作为成对乐器称谓增强中文诗意，但不主张它们与古代以色列乐器在形制上完全对应。
