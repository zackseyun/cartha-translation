  naturalness: “如火燃烧的人”在现代汉语中略显生硬，容易理解为这些人正在被火焚烧，而非带有烈焰般凶暴特质的人。改为“烈焰般的人”较自然，仍保留原文意象和句法歧义。
  terminology: “我的性命”“群狮”“世人”和“锋利的剑”均合乎庄重现代汉语的诗歌语体。“世人”可保留；脚注宜清楚说明其与“燃烧者”同位，并提示原文字面形式。
