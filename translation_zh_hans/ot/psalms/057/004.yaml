source:
  edition: WLC
  text: נַפְשִׁ֤/י בְּ/ת֥וֹךְ לְבָאִם֮ אֶשְׁכְּבָ֪ה לֹ֫הֲטִ֥ים בְּֽנֵי אָדָ֗ם שִׁ֭נֵּי/הֶם חֲנִ֣ית וְ/חִצִּ֑ים וּ֝/לְשׁוֹנָ֗/ם חֶ֣רֶב חַדָּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/004.yaml
  text: My soul is in the midst of lions[a]; I lie down among those who are aflame—sons of man, whose teeth are spears and arrows[b], and whose tongue is a sharp sword.
translation:
  language: zh_hans
  text: '我的性命在群狮中间[a]；

    我躺卧在烈焰般的人中间[b]——

    他们的牙齿是矛和箭，

    他们的舌头是锋利的剑。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “群狮”可指真正的狮子，也可比喻凶猛的仇敌；原诗没有明确消除这层歧义。
    reason: poetic_ambiguity
  - marker: b
    text: “烈焰般的人”原文直译可作“燃烧者，人的众子”。“燃烧者”也可译作“炽烈者”或“喷吐烈焰者”；原文以燃烧的意象描写敌手。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ可指生命、自我或魂。此处处境关乎诗人的全人和生命安危；译作“我的性命”既保留生命受威胁的意味，也比现代汉语中的“我的灵魂”更自然，且不把希伯来语的人观窄化为后来的身心二分。
- source_word: בְּתוֹךְ לְבָאִם
  choice: 在群狮中间
  rationale: 保留“狮子”的鲜明诗歌意象，并用“群”自然表达复数和被围困的处境，不预先断定是实指野兽还是比喻仇敌。
- source_word: אֶשְׁכְּבָה
  choice: 我躺卧
  rationale: 按שׁכב第一人称形式直译其具体姿态；不添加“不得不”等原文未明说的情态。
- source_word: לֹהֲטִים
  choice: 如火燃烧的人
  rationale: 该分词有燃烧、炽烈之意，且压缩的句法容许不同理解。“如火燃烧的人”保留火焰隐喻及敌意的强烈感，又不径自解释为发怒或吞噬。
- source_word: בְּנֵי אָדָם
  choice: 世人
  rationale: 该惯用语字面为“亚当／人的众子”，此处说明敌手是人。“世人”在现代汉语中自然庄重，并能表达复数人类指称；脚注保留较字面的可能译法。
- source_word: שִׁנֵּיהֶם חֲנִית וְחִצִּים
  choice: 牙齿如矛如箭
  rationale: 原文名词句把牙齿等同于矛和箭。汉语以两个“如”自然呈现诗性比喻；חֲנִית虽为单数，但与复数“箭”并列时无需生硬保留数的不一致。
- source_word: וּלְשׁוֹנָם חֶרֶב חַדָּה
  choice: 舌头是锋利的剑
  rationale: 直接保留以利剑描写毁灭性言语的隐喻，并维持“牙齿—舌头”“兵器—剑”的平行结构。
theological_decisions:
- issue: “群狮”与后文人类敌手的关系
  choice: 保留狮子、火、兵器等意象，不判定“群狮”完全是实指还是比喻。
  alternative: 明确改写为“凶猛如狮的仇敌”，或理解为真狮子与人类敌手两组危险。
  rationale: 经文本身从“狮子”转到“世人”，形成有意的诗歌叠映；译文不应替读者消除这种张力。
- issue: בְּנֵי אָדָם的人类指称
  choice: 译作“世人”。
  alternative: “人的众子”或“亚当的子孙”。
  rationale: 这里的重点是敌手虽如狮、如火，却是人类。“世人”不引入特定教派含义；脚注提示原文字面形式，以免掩盖其诗性表达。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。以分行和破折号呈现希伯来诗句的压缩句法及同位说明；保留狮子、火、矛箭和利剑的连续意象，同时避免过度古雅的“心魂”“人子”等可能引发额外神学联想的措辞。
