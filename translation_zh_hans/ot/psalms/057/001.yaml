  text: חָנֵּ֤/נִי אֱלֹהִ֨ים חָנֵּ֗/נִי כִּ֥י בְ/ךָ֮ חָסָ֪יָה נַ֫פְשִׁ֥/י וּ/בְ/צֵֽל כְּנָפֶ֥י/ךָ אֶחְסֶ֑ה עַ֝֗ד יַעֲבֹ֥ר הַוּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/001.yaml
  text: Be gracious to me[a], God, be gracious to me, for in you my soul takes refuge[b]; and in the shadow of your wings I will take refuge until destruction passes by.
translation:
  language: zh_hans
  text: 上帝啊，求你恩待我，求你恩待我！因为我投靠你[a]；我要在你翅膀的荫下投靠，直到种种灾祸过去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我”所译的希伯来语直译为“我的魂／生命”，也可指“我自己”或“全人”；全句也可译作“我的生命投靠你”。
    reason: lexical_alternative
  - marker: b
    text: “种种灾祸”在希伯来语中为复数，也可理解为集合性的“毁灭”或“灾难”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: 求你恩待我
  rationale: 该词是 חנן 的祈使式，带第一人称单数后缀，表达恳求上帝施恩、赐予眷顾。“恩待”既保留“施恩”的动词意味，也符合现代汉语祷告语体。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处是直接呼求神的通用称号；“上帝”庄重自然，并未把经文改成更具体的盟约名称。
- source_word: כִּי
  choice: 因为
  rationale: 引出前面恳求的理由，清楚保留原文的因果关系。
- source_word: בְךָ חָסָיָה נַפְשִׁי
  choice: 我的心投靠你
  rationale: חסה 表示寻求庇护、投靠；נפשׁ 可指心灵、生命或整个人。“我的心”保留诗歌中的人格内在表达，脚注说明其较宽的语义范围，避免限定为后世哲学意义上的灵魂。完成式在这里表达已经确立、现今持续的信靠状态。
- source_word: וּבְצֵל כְּנָפֶיךָ
  choice: 我要投靠在你翅膀的荫下
  rationale: “翅膀的荫下”直接保留原文以鸟翼遮护为喻的诗意形象，而不将其解释性地改写为“你的保护之下”。
- source_word: אֶחְסֶה
  choice: 我要投靠
  rationale: 第一人称未完成式在此可表达面向将来并持续的行动；“我要投靠”也保留了与前句“投靠你”之间的时态与进展。
- source_word: עַד יַעֲבֹר
  choice: 直到……过去
  rationale: 准确表达避难持续到危险越过、消退之时，现代汉语也自然流畅。
- source_word: הַוּוֹת
  choice: 种种灾祸
  rationale: 原词为复数，指带来毁灭的灾难或险情。“种种灾祸”在正文中显明复数，又比抽象的“毁灭”更自然。
theological_decisions:
- issue: נַפְשִׁי 的人论含义
  choice: 我的心
  alternative: 我的生命；我自己
  rationale: נפשׁ 在这里可表示生命、整个人或人的内在自我，不必特指与身体分离的非物质灵魂。“我的心”适合汉语诗歌祷告，同时以脚注保存其他可能含义。
- issue: “你翅膀的荫下”的保护意象
  choice: 保留为上帝保护的诗性隐喻
  alternative: 释义为“在你的保护下”
  rationale: 直译意象可保存原文的拟人化张力与诗意，不对其作字面化或教义化说明。
- issue: הַוּוֹת 的复数意义
  choice: 种种灾祸
  alternative: 毁灭；灾祸
  rationale: 原文使用复数，可指多重灾难，也可能是集合性表达；正文呈现复数，脚注保留集合性理解的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“求你恩待我”的重复保留原诗强烈的恳求语气；分号呈现两句“投靠”之间的平行和推进。“翅膀的荫下”保留诗性意象，不作解释性改写。
