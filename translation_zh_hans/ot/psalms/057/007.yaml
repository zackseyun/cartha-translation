lexical_decisions:
- source_word: נָכוֹן
  choice: 坚定
  rationale: 此词表示稳固、坚定或已经确立。这里重复使用，表达诗人在患难中内心安定、决意信靠并赞美上帝；“坚定”自然地保留了这种稳定与决心。
- source_word: לִבִּי
  choice: 我的心
  rationale: “心”在希伯来语中指人的内在自我，包括意志与情感；直译为“我的心”既自然，也保留了原文的人观。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 原文在此直接呼求上帝。用“上帝啊”明确表达呼格，并保持祷告诗的庄重语气。
- source_word: אָשִׁירָה
  choice: 我要歌唱
  rationale: 鼓励式形式在此表达意愿和决心；“我要歌唱”符合现代汉语，也传达主动立志之意。
- source_word: וַאֲזַמֵּרָה
  choice: 我要奏乐颂赞
  rationale: זמר 的加强词干可指奏乐、歌唱或以音乐赞美。“奏乐颂赞”保留其音乐与赞美两方面的含义，同时避免与前面的“歌唱”完全重复。
