  text: My heart is steadfast[a], O God; my heart is steadfast. I will sing, yes[b], I will make melody.
translation:
  language: zh_hans
  text: 上帝啊，我的心坚定[a]，我的心坚定；我要歌唱，我要奏乐[b]。
  philosophy: optimal-equivalence
  footnotes:
