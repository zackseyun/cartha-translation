base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/002.yaml
  text: I call to God Most High[a], to God who fulfills his purpose for me.
translation:
  language: zh_hans
  text: 我向至高的上帝呼求，向那成全关乎我的事的上帝呼求。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向那为我成全的上帝呼求。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקְרָא
  choice: 我……呼求
  rationale: קרא 的 Qal 未完成式第一人称单数在诗歌中可有现在、将来或意愿意味。结合本诗处境，译作“呼求”自然表达向上帝求告；不另加“哀声”等原文未明说的强度。
- source_word: לֵאלֹהִים עֶלְיוֹן
  choice: 向至高的上帝
  rationale: עֶלְיוֹן 在此是上帝的尊称，意为“至高者／至高的”。“至高的上帝”符合现代汉语表达，也保留其崇高称号。
- source_word: לָאֵל
  choice: 向……上帝
  rationale: אֵל 在此与前半句 אֱלֹהִים 构成诗体平行，均指以色列的上帝；统一译作“上帝”，避免误作另一专名。
- source_word: גֹמֵר
  choice: 成全
  rationale: גמר 的分词基本义是“完成、使终结”。“成全”在此既简洁又能表达上帝使关乎诗人的事达到完成。
- source_word: עָלָי
  choice: 为我……一切
  rationale: עַל 加第一人称后缀在 גמר 之后可表示“关乎我／为我”。正文采用自然的受益表达“为我”，但不把所成全之事具体限定为某一明确计划。
theological_decisions:
- issue: גֹמֵר עָלַי 的含义
  choice: 那为我成全一切的上帝
  alternative: 那成全关乎我的事的上帝；那为我实现其旨意的上帝
  rationale: 希伯来语直译近于“为我／关乎我完成的上帝”，宾语并未明说。“成全一切”保留其概括性，并避免把“他的旨意”当作原文明示的宾语；脚注注明较贴近结构的译法，以保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“上帝”用于 אֱלֹהִים 与 אֵל；重复“呼求”以使汉语句子完整，并保留希伯来诗歌的平行结构。脚注标记置于整节句末。
