base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/006.yaml
  text: They prepared a net for my steps[a]; my soul was bowed down; they dug a pit before me; they fell into the midst of it[d][c][b]. Selah
translation:
  language: zh_hans
  text: 他们为我的脚步设下网罗；我的心灵被压弯；他们在我面前挖了坑；他们自己却落在坑中。细拉[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “细拉”的确切含义不明，可能是礼仪或音乐用语。
    reason: lexical_uncertainty
lexical_decisions:
- source_word: רֶשֶׁת
  choice: 罗网
  rationale: 指捕捉猎物所用的网；“罗网”既具体，又符合诗歌中设伏害人的意象。
- source_word: הֵכִינוּ
  choice: 备下
  rationale: 使役词形表示预备、备妥；“备下”简洁地表达蓄意设置。
- source_word: לִפְעָמַי
  choice: 为我的脚步
  rationale: פעם在这里可指脚步；保留原文复数和行走时遭设网拦阻的图景。
- source_word: כָּפַף נַפְשִׁי
  choice: 我的性命被压低了
  rationale: כפף意为弯下、压低；נפש可指性命、自我或内在生命。“性命被压低”保留原文的身体性隐喻，并避免把它仅仅解释成某一种情绪。
- source_word: כָּרוּ
  choice: 挖了
  rationale: 该动词直接表示挖掘，与“坑”自然搭配。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 直接表达坑被挖在诗人前方、意图使他陷落。
- source_word: שִׁיחָה
  choice: 坑
  rationale: 指可使人陷落的坑；“坑”简明，并保留实际陷阱与比喻含义。
- source_word: נָפְלוּ בְתוֹכָהּ
  choice: 自己却掉在其中
  rationale: 字面是“他们掉在它里面”；“自己却”显明上下文中的反转，而“其中”保留阴性代词回指“坑”。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切含义不明，可能是礼仪或音乐标记，因此采用传统音译，不作推测性翻译。
theological_decisions:
- issue: כָּפַף נַפְשִׁי的主语和语态
  choice: 我的性命被压低了
  alternative: 它压低了我的性命／他压低了我的性命
  rationale: 马所拉文本的动词是阳性单数主动形式，而紧随其后的“我的性命”通常为阴性名词，句法存在张力。用汉语被动表达保留受压低的核心含义，不武断指定原文未明确的施事者。
- issue: 恶人落入所挖之坑的反转
  choice: 自己却掉在其中
  alternative: 他们掉在其中
  rationale: “自己却”体现同一群设陷阱者反受其害的诗意反转，但没有增添报应机制或神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；分号保留希伯来诗句连续推进的节奏。“罗网—坑”维持平行意象，“自己却”自然呈现结尾的反转。
