  text: ר֣וּמָ/ה עַל הַ/שָּׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/005.yaml
  text: Be exalted above the heavens[a], O God; let your glory be over all the earth.
translation:
  language: zh_hans
  text: 上帝啊，愿你在诸天之上受尊崇；愿你的荣耀遍及全地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的荣耀遍及全地。”希伯来文第二行没有动词，可作祈愿，也可作宣告理解。
    reason: 保留希伯来文无动词分句在祈愿与陈述之间的真实歧义。
lexical_decisions:
- source_word: רוּמָה
  choice: 愿你受尊崇
  rationale: 该形式源自 רום，在这里是祈愿式、颂赞性的呼求。译为“愿你受尊崇”既传达崇高、被高举之意，也符合现代汉语敬拜语体。
- source_word: עַל הַשָּׁמַיִם
  choice: 高过诸天
  rationale: עַל 在此表达超越其上的崇高地位；“诸天”保留希伯来文复数形式及诗歌性的宇宙意象。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 经文是直接呼告；“啊”自然标明呼语，“上帝”则是现代标准汉语中清楚、庄重的称呼。
- source_word: עַל כָּל הָאָרֶץ
  choice: 遍及全地
  rationale: 这里可表示荣耀覆盖全地的范围；“遍及全地”在汉语中自然，并与普世性的诗意相符。
- source_word: כְּבוֹדֶךָ
  choice: 你的荣耀
  rationale: כבוד 用于上帝时指其彰显出来的威荣与尊荣；“荣耀”是清楚且广为理解的对应词。
theological_decisions:
- issue: 第二诗行无动词，应译为祈愿还是陈述
  choice: 愿你的荣耀遍及全地
  alternative: 你的荣耀遍及全地
  rationale: 希伯来文第二行是无动词分句。与第一行的呼求平行时，可自然理解为祈愿；但也可能是对上帝荣耀遍及全地的宣告，因此正文采用祈愿读法，并在脚注保留陈述读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“高过诸天”保留诗歌的空间隐喻；分号呈现两行平行结构。脚注标记置于相关的第二分句之后。
