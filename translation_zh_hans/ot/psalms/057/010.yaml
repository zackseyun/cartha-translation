source:
  edition: WLC
  text: כִּֽי גָדֹ֣ל עַד שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/010.yaml
  text: For your steadfast love is great to the heavens[b][a], and your faithfulness to the clouds.
translation:
  language: zh_hans
  text: 因为你的慈爱广大，直达诸天；你的信实高及云霄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信实”也可译作“真实”；“直达诸天……高及云霄”也可译作“直到诸天……直到云层”。
    reason: 保留 אֱמֶת 的词义选择，以及 עַד 和 שְׁחָקִים 较为直译的表达。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为诗人的颂赞说明理由；保留原文明确的因果关系。
- source_word: גָדֹל
  choice: 广大
  rationale: 描述上帝慈爱的宏大程度；“广大”比“很大”更符合诗歌语体，同时自然地与后面的空间意象衔接。
- source_word: עַד שָׁמַיִם
  choice: 直达诸天
  rationale: עַד 表示延伸的界限或程度；“直达”呈现向上延展的诗意图景，“诸天”保留 שָׁמַיִם 的庄重语感。
- source_word: חַסְדֶּךָ
  choice: 你的慈爱
  rationale: חֶסֶד 包含仁慈、忠贞和持久之爱的内涵；“慈爱”是现代中文圣经语境中自然、简明且不局限于单一神学术语的表达。
- source_word: וְעַד שְׁחָקִים
  choice: 高及云霄
  rationale: 保留与上一分句平行的向上延伸意象；שְׁחָקִים 在诗歌中可指云层或高空，“云霄”兼具具体图景与庄重诗意。
- source_word: אֲמִתֶּךָ
  choice: 你的信实
  rationale: אֱמֶת 基本义可为“真实、真理”，在此与 חֶסֶד 并列描述上帝可靠不变的品格，故译“信实”更贴合上下文。
theological_decisions:
- issue: 如何表达 חֶסֶד 与 אֱמֶת 这一对描述上帝品格的词
  choice: 慈爱／信实
  alternative: 慈爱／真实（或真理）
  rationale: 诗句重点在颂扬上帝持久的爱与可靠的品格；“慈爱／信实”在现代中文中自然地传达这种关系性含义，同时脚注保留 אֱמֶת 的“真实”义。
- issue: עַד 所表达的是空间终点还是程度范围
  choice: 以“直达／高及”保留延伸到天际的空间意象
  alternative: 广大如天／高过云霄
  rationale: 原文说“到诸天／到云层”，并未明确说“如”或“超过”；译文避免添加比较或超越关系。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两个分句保持平行，但略作措辞变化，以避免中文机械重复；脚注标记已置于正文。
