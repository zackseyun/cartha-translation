  yaml_path: translation/ot/psalms/057/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.” Of David[a]. A miktam, when he fled from Saul[b], in the cave.'
translation:
  language: zh_hans
  text: 交给乐长，调用《不要毁坏》。大卫的米克坦[b]；当他为躲避扫罗、身在洞中时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “米克坦”是希伯来文体裁术语的音译；其确切含义不明。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题注中通常指负责音乐或礼仪演唱的领唱、指挥者。“乐长”简洁庄重，也保留题注中交付给音乐负责人的功能。
- source_word: אַל־תַּשְׁחֵת
  choice: 《不要毁坏》
  rationale: 在诗篇题注中，这一短语很可能是曲名、调名或固定叠句，而不是诗歌正文中的命令；书名号标明其标题性质，同时不进一步断定具体用途。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 题注中的介词 לְ 可表示作者、归属、关联或题献。“大卫的”比“大卫作”更能保留这种语义幅度。
- source_word: מִכְתָּם
  choice: “米刻坦”
  rationale: 该术语含义不确定，音译可避免擅自采用“金诗”“铭刻诗”等推测性解释。
- source_word: בְּבָרְחוֹ מִפְּנֵי שָׁאוּל
  choice: 他逃避扫罗
  rationale: בְּ 加不定词结构在此表达时间背景；“逃避扫罗”自然传达从扫罗面前逃走的含义。
- source_word: בַּמְּעָרָה
  choice: 在洞里
  rationale: 介词 בְּ 在此最自然地表示地点；译作“在洞里”不额外加入进入洞穴的动作。
theological_decisions:
- issue: 题注的文学性质
  choice: 把全句作为诗篇题注处理
  alternative: 把《不要毁坏》等成分视为诗歌正文
  rationale: 原文由乐长指示、标题或曲调、与大卫的关联、体裁术语及历史背景等典型题注成分组成，作为题注呈现最符合马所拉文本的文学功能。
- issue: לְדָוִד 所表达的关系
  choice: 译作“大卫的”，保留作者、归属或关联的可能性
  alternative: 明确译作“大卫作”或“献给大卫”
  rationale: 原文介词本身不能单独确定其关系；避免在译文中排除仍然成立的解释。
- issue: 不确定术语 מִכְתָּם
  choice: 音译为“米刻坦”
  alternative: 译作“金诗”“铭刻诗”或“隐秘诗”
  rationale: 词义存在争议，音译最能忠实保留原文资料，并避免引入未经证实的体裁或神学含义。
translation_notes:
  register: 采用现代、简洁而庄重的题注体。“乐长”便于普通读者理解；用书名号标示可能的标题，用引号标示音译且含义未明的术语。分号将题注类别与历史场景相连，保留原文紧凑结构。
