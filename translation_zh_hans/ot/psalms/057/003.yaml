  text: יִשְׁלַ֤ח מִ/שָּׁמַ֨יִם וְֽ/יוֹשִׁיעֵ֗/נִי חֵרֵ֣ף שֹׁאֲפִ֣/י סֶ֑לָה יִשְׁלַ֥ח אֱ֝לֹהִ֗ים חַסְדּ֥/וֹ וַ/אֲמִתּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/003.yaml
  text: He will send from heaven and save me[a]; he reproaches the one who pants after me. Selah[b]. God will send his steadfast love and his faithfulness.
translation:
  language: zh_hans
  text: 他必从天上施援，拯救我；他斥责那追逼我的人。[a]（细拉）上帝必赐下他的慈爱和信实。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可理解为：“那追逼我的人辱骂我。”原文的主语和句法关系并不明确。“追逼我的人”直译可作“向我喘息的人”，也可理解为“想吞灭我的人”。
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלַח
  choice: 必施援／必施下
  rationale: 该词是שלח的未完成式，诗中表达对上帝将要行动的确信。首处依宾语省略而译为“施援”，末处有明确宾语，译为“施下”，避免生硬的“差遣慈爱”。
- source_word: מִשָּׁמַיִם
  choice: 从天上
  rationale: 自然对应上帝施行援助的来源，并保留希伯来语的空间意象。
- source_word: וְיוֹשִׁיעֵנִי
  choice: 拯救我
  rationale: ישׁע的使役形在此表示救助、解救；“拯救我”简洁而涵义充分。
- source_word: חֵרֵף
  choice: 他斥责
  rationale: 按动词חרף的直接词义译为“斥责”，不将其解释性地改写为“使……蒙羞”。主语在压缩的诗句中存在歧义，另见脚注。
- source_word: שֹׁאֲפִי
  choice: 那追逼我的人
  rationale: שאף本有喘息、急切扑向之意，在敌对语境中指急切追逐或企图吞灭诗人的人；正文采用自然汉语“追逼”，脚注保留更具象的可能译法。
- source_word: סֶלָה
  choice: 细拉
  rationale: 此术语的确切功能不明，沿用传统音译，避免作无把握的解释。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 在本节中明确为单数的神圣称谓；“上帝”是现代标准汉语中庄重、通行的译法。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חסד兼含恩慈、忠贞和持久眷爱；“慈爱”自然易懂，并可与“信实”共同表达这一固定配对。
- source_word: וַאֲמִתּוֹ
  choice: 和信实
  rationale: אמת与חסד并列时侧重可靠、忠诚；译作“信实”最贴合该诗歌搭配。
theological_decisions:
- issue: חֵרֵף שֹׁאֲפִי的主语与句法关系
  choice: 以隐含的上帝为חֵרֵף的主语：“他斥责那追逼我的人。”
  alternative: 以追逼者为主语：“那追逼我的人辱骂我”；或理解为“他救我脱离追逼者的辱骂”。
  rationale: 希伯来语高度凝练，主语转换和宾语关系均未完全明示。正文延续前句以上帝为主语，并直接保留חרף的“斥责”义；脚注明示另一种语法分析，不消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。“施援”补足首个“差遣”所省略的受词概念；“施下慈爱和信实”在汉语中比“差遣他的慈爱和信实”自然，同时保留这两种神圣属性如同从天而来的诗歌拟人意象。脚注标记紧接歧义句，不给“细拉”另设脚注，以免误标。
