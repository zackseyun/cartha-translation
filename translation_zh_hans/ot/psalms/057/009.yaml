  yaml_path: translation/ot/psalms/057/009.yaml
  text: I will give thanks to you among the peoples[a], Lord; I will sing praise to you among the nations.
translation:
  language: zh_hans
  text: '主啊，我要在万民中感谢你[a]；

    我要在列国中歌颂你。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赞美你”。希伯来语动词既可表示感谢，也可表示赞美；正文译作“感谢”，以保留它与下一行“歌颂”之间的区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: 我要……感谢你
  rationale: ידה的使役式在此可表示“感谢”或“赞美”。译作“感谢”既符合诗篇语境，也保留了它与下句“歌颂”之间的措辞差别。
- source_word: בָעַמִּים
  choice: 在万民中
  rationale: עַמִּים是עַם的复数，指不同的民众或族群。“万民”以自然凝练的中文表达复数集合意义，并与下句“列国”形成对应。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是神的称号אֲדֹנָי，而非四字神名。加“啊”自然表达希伯来文在此清楚的呼语语气。
- source_word: אֲזַמֶּרְךָ
  choice: 我要……歌颂你
  rationale: זמר的加强式在诗篇中通常指以歌唱或音乐来赞美。“歌颂”简洁自然，并保留敬拜和歌唱的含义。
- source_word: בַּל
  choice: 在……中
  rationale: 此处作为诗体介词，与上一行的בְּ平行，表示行动发生的范围；中文用“在……中”自然呈现。
- source_word: אֻמִּים
  choice: 列国
  rationale: אֻמִּים可指各国或各民。“列国”与上一行的“万民”相区别，同时保留两行的同义平行。
theological_decisions:
- issue: 神的称号אֲדֹנָי如何译出
  choice: 主啊
  alternative: 上主啊
  rationale: 原文使用神的称号אֲדֹנָי，不是四字神名；译作“主”避免把称号误作圣名。“啊”仅表达原文语境中的呼语功能，并未增添神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文；两行保持平行结构，以“万民／列国”和“感谢／歌颂”呈现原文既对应又有变化的措辞。
