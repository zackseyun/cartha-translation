  yaml_path: translation/ot/psalms/057/011.yaml
  text: Be exalted above the heavens[a], O God; let your glory be above all the earth.
translation:
  language: zh_hans
  text: 神啊，愿你被高举，超乎诸天；愿你的荣耀高过全地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的荣耀在全地之上。”希伯来文第二行没有明示动词；可按上文补作祈愿，也可理解为陈述。
    reason: alternative_reading
lexical_decisions:
- source_word: רוּמָה
  choice: 愿你被高举
  rationale: 这是向神发出的命令式／祈愿式表达。译作“愿你被高举”既保留祷告语气，也表达神被彰显为至高者的含义。
- source_word: עַל שָׁמַיִם
  choice: 超过诸天
  rationale: עַל在这里带有高于、超越之意；“超过诸天”保留垂直空间意象和尊崇含义，同时שָׁמַיִם译为庄重而自然的“诸天”。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 原文是直接呼语；现代汉语以“神啊”自然标明呼唤。
- source_word: עַל כָּל הָאָרֶץ
  choice: 遍及全地
  rationale: 与“诸天”构成宇宙性的平行。“全地”优于“全境”；因所修饰的是“荣耀”，用“遍及”自然表达荣耀覆盖全地，同时脚注保留原文无明示动词的歧义。
- source_word: כְּבוֹדֶךָ
  choice: 你的荣耀
  rationale: כָּבוֹד用于神时表示其荣耀和彰显的威荣；“荣耀”是准确、通行且神学上透明的译法。
theological_decisions:
- issue: 第二诗行没有明示动词，应理解为祈愿还是陈述
  choice: 愿你的荣耀遍及全地
  alternative: 你的荣耀遍及全地
  rationale: 第一诗行是向神发出的祈愿，第二行可依平行结构承接这一语气；正文因此采用祈愿式。但希伯来文没有明示动词，也可理解为陈述，故以脚注保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祷告语体。“神啊”明确呼语；两个“愿”保持两行的礼仪性平行。第二行用“遍及”避免生硬的“在全地之上”，并以脚注说明原文省略动词所形成的歧义。
