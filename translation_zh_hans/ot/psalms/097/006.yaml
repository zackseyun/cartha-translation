id: PSA.97.6
reference: Psalms 97:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִגִּ֣ידוּ הַ/שָּׁמַ֣יִם צִדְק֑/וֹ וְ/רָא֖וּ כָל הָ/עַמִּ֣ים כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/006.yaml
  text: The heavens declare his righteousness[a], and all the peoples see his glory.
translation:
  language: zh_hans
  text: 诸天宣告他的公义[a]，万民都看见他的荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的公正。”希伯来语这个词兼有“公义”和“公正”的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידוּ
  choice: 宣告
  rationale: 使役式完成时表达“使人知道、宣告”。“宣告”简洁有力，适合诗歌中诸天作见证的拟人表达；结合平行句，以生动的现在时呈现。
- source_word: הַשָּׁמַיִם
  choice: 诸天
  rationale: 在宇宙性、神显性的诗歌语境中，“诸天”既保留复数形式和庄严语体，也比“天空”更能体现受造界作见证的意味。
- source_word: צִדְקוֹ
  choice: 他的公义
  rationale: צֶדֶק 的语义兼有道德上的正直与审判上的公正。“公义”在正文中能较宽地承载这两方面，并以脚注保留“公正”这一可行译法。
- source_word: וְרָאוּ
  choice: 都看见
  rationale: 希伯来语完成时在诗歌中可描述已经发生之事，也可作生动、概括性的陈述。这里采用现代汉语现在时式表达，与“宣告”并列，并保留原文未明确限定时间的诗性力度。
- source_word: כָל הָעַמִּים
  choice: 万民
  rationale: “万民”自然、庄重地表达“所有的众民”，保留普世范围，又不把 עַמִּים 过度限定为现代政治意义上的“国家”。“都”明确传达 כָל 的全称意义。
- source_word: כְּבוֹדוֹ
  choice: 他的荣耀
  rationale: 指上帝彰显出来的尊荣与威严。“荣耀”是现代中文圣经语体中自然且含义充分的对应词，比“光彩”或“尊荣”更能涵盖此处神圣威荣的意义。
theological_decisions:
- issue: 如何表达 צִדְקוֹ 所兼有的道德正直与司法公正含义
  choice: 他的公义
  alternative: 他的公正
  rationale: “公义”可指上帝本性的正直及其作为的正当，“公正”则更突出审判和治理层面。正文采用涵盖面较广且适合诗篇语体的“公义”，脚注保留“公正”，不消除原词真实存在的神学张力。
- issue: 希伯来语完成时的时间和体貌
  choice: 以“宣告……看见”作生动、概括性的诗歌陈述
  alternative: 译为“已经宣告……都已看见”
  rationale: 两个完成时既可读为已经成就，也可在诗歌中生动描绘确定可见的事实。中文正文不加“已经”，避免把原文诗性的体貌强行限定为单纯过去时。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“诸天—万民”形成宇宙与人类相呼应的平行结构；“宣告—看见”保留原文由听闻式见证转向视觉感知的推进。脚注标记已置于“公义”之后。
