base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/011.yaml
  text: Light is sown for the righteous[a], and joy for the upright in heart.
translation:
  language: zh_hans
  text: 光为义人播下[a]；喜乐也为心里正直的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“光为义人被播下”。希伯来文以农业比喻把光描绘为种子般被播撒；也可译作“光为义人撒播”。
    reason: 说明原文被动结构、农业意象及可行的近义译法。
lexical_decisions:
- source_word: אוֹר
  choice: 光
  rationale: 保留诗篇中含义宽广的“光”这一意象，不将其限定解释为福乐、拯救或昭雪。
- source_word: זָרֻעַ
  choice: 撒下
  rationale: 这是动词“撒种”的被动分词。译作“撒下”既保留农业意象，也使“光”如种子般被撒播的诗意在现代汉语中可理解。
- source_word: לַצַּדִּיק
  choice: 为义人
  rationale: 介词 ל 在此表示受益或归向；“义人”自然地表达希伯来文具有代表意义的单数。
- source_word: וּלְיִשְׁרֵי לֵב
  choice: 也为心里正直的人
  rationale: “心里正直的人”自然表达“心正直者”这一希伯来语结构，并保留其内在品格的含义；“也”显明两行的并列关系。
- source_word: שִׂמְחָה
  choice: 喜乐
  rationale: “喜乐”简洁、庄重，并与前半句的“光”形成诗歌中的平行意象。
theological_decisions:
- issue: “光”的比喻含义
  choice: 保留“光”而不加解释
  alternative: 明确译为福乐、拯救或昭雪
  rationale: 原文没有把这一比喻限定为某一种神学含义；保留其开放性可维持诗句的丰富含义。
- issue: “撒种”意象及后半句的省略
  choice: 前半句保留“撒下”，后半句不重复动词
  alternative: 将全句解释为“光明和喜乐都为……预备”或在后半句补出“撒下”
  rationale: 希伯来文只在前半句明说“撒下”，后半句以省略形成紧凑的平行结构。本译文保留这一诗体张力，不把“撒种”淡化为“预备”。
translation_notes:
  register: 采用现代、庄重而简洁的诗体汉语。“光为义人撒下”有意保留原文不寻常的意象；后半句保持原文的动词省略，不另加“预备”“存留”或“赐给”等解释性词语。
