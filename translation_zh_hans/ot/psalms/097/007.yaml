  text: יֵבֹ֤שׁוּ כָּל עֹ֬בְדֵי פֶ֗סֶל הַ/מִּֽתְהַלְלִ֥ים בָּ/אֱלִילִ֑ים הִשְׁתַּחֲווּ ל֝/וֹ כָּל אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/007.yaml
  text: Let all who serve carved images be put to shame[a], those who boast in idols; bow down to him, all gods.
translation:
  language: zh_hans
  text: '愿一切事奉雕刻偶像的蒙羞，

    就是那些以偶像自夸的。

    一切神明啊，要向他下拜！[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切神明”直译为“所有的神”；也可理解为“所有天上的众灵”或“所有天使”。这可能是针对列国诸神的论战说法，也可能指侍立在耶和华面前的天上众灵。
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: 都必蒙羞
  rationale: בוש表示羞愧、受辱；这里的未完成式可表达诗歌中的愿望或必然结果。“必蒙羞”自然庄重，并保留公开受辱的意味。
- source_word: עֹבְדֵי
  choice: 事奉
  rationale: עבד的分词在祭祀语境中指服事、敬拜。“事奉”既保留基本词义，也清楚传达宗教含义。
- source_word: פֶסֶל
  choice: 雕刻偶像
  rationale: פֶסֶל特指制作、雕刻而成的像。“雕刻偶像”兼顾具体制作方式及其崇拜对象的性质。
- source_word: הַמִּתְהַלְלִים
  choice: 自夸
  rationale: הלל的Hitpael形式在这里表示夸耀、自豪；“自夸”简洁地保留其反身及负面语气。
- source_word: בָּאֱלִילִים
  choice: 以偶像
  rationale: 介词ב可标明夸耀所凭借或所指向的对象；אֱלִילִים带有虚无、无用之神像的贬义，在现代中文正文中译作“偶像”自然明确。
- source_word: הִשְׁתַּחֲווּ
  choice: 下拜
  rationale: שׁחה表示俯伏、下拜以示敬奉。“下拜”保留身体动作及宗教敬拜的双重含义。
- source_word: לוֹ
  choice: 向他
  rationale: 介词ל加第三人称阳性单数后缀，在“下拜”的搭配中自然译为“向他”。
- source_word: כָּל אֱלֹהִים
  choice: 所有的神明
  rationale: 原文直译为“所有的神”。“神明”在现代中文中可指众神，并与指独一上帝时通常使用的“神”有所区分，同时不预先断定这些对象究竟是列国诸神还是天上众灵。
theological_decisions:
- issue: כָּל אֱלֹהִים所指为何
  choice: 所有的神明
  alternative: 所有天上的众灵；所有天使
  rationale: 希伯来正文直说“所有的神”。正文保留其多义及诗歌中的论战张力，不把所指默定为列国诸神或天上众灵；脚注说明其他可能理解。
- issue: יֵבֹשׁוּ的语气
  choice: 都必蒙羞
  alternative: 愿他们都蒙羞；他们都蒙羞
  rationale: 该未完成式可按语境理解为愿望、命令色彩或预告结果。“必蒙羞”在本诗宣告耶和华显现与统治的上下文中自然，但不把它处理为单纯的心理羞愧。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌体。前两分句以重复结构呈现同一群人的平行说明；末句用呼语“啊”和感叹号体现命令的力度。脚注标记[a]置于相关末句之后。
