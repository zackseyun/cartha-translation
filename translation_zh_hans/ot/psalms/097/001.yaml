  text: יְהוָ֣ה מָ֭לָךְ תָּגֵ֣ל הָ/אָ֑רֶץ יִ֝שְׂמְח֗וּ אִיִּ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/001.yaml
  text: Yahweh reigns[a]; let the earth rejoice; let the many coastlands be glad.
translation:
  language: zh_hans
  text: 耶和华掌权！愿全地欢欣，愿众海岛[a]喜乐！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海岛”也可译作“沿海地区”或“远方的海岸地带”。这个希伯来词既可指岛屿，也可指海岸地区。
    reason: 保留 אִיִּים 的地理语义幅度，避免正文单一译法掩盖其真实歧义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之上帝专名的功能，不以“主”这一称号替代。
- source_word: מָלָךְ
  choice: 掌权
  rationale: 该完成式既可表达作王、已登基，也可表明持续的王权状态；诗篇在此宣告上帝的王权。“掌权”自然凝练，并避免把含义限定为某一刻才登基。
- source_word: תָּגֵל
  choice: 愿……欢欣
  rationale: 虽为未完成式第三人称阴性单数，在宣告王权之后最自然地具有祈愿或号召语气；“愿”保留其意愿式力量。
- source_word: הָאָרֶץ
  choice: 全地
  rationale: 本节与众海岛平行，视野具有普世性；“全地”比“那地”更符合此处宇宙性王权的语境。
- source_word: יִשְׂמְחוּ
  choice: 愿……喜乐
  rationale: 与前一动词平行，按祈愿或号召理解；采用“喜乐”与“欢欣”形成自然的诗歌同义平行。
- source_word: אִיִּים
  choice: 海岛
  rationale: 该词可指岛屿，也可泛指沿海地区或远方海疆；正文用简明自然的“海岛”，脚注保留更宽的地理语义。
- source_word: רַבִּים
  choice: 众
  rationale: “众海岛”以凝练的诗体中文表达“许多岛屿／海疆”，保持数量含义而不显拖沓。
theological_decisions:
- issue: 耶和华王权宣告的范围与时态意味
  choice: 宣告耶和华现今掌权，并号召全地与远方海域一同欢喜
  alternative: 译作“耶和华作王了／已经登基”，突出登基事件；或把 הָאָרֶץ 限定为以色列地
  rationale: “全地”与“众海岛”之间的平行支持普世范围；“掌权”保留持续王权，也不完全排除完成式可能含有的登基或成为王之意味。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。开篇用感叹号凸显诗歌宣告，后两分句用“愿”体现平行的祈愿／号召语气；“欢欣／喜乐”形成清楚而不过度重复的同义平行。
