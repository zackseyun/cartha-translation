source:
  edition: WLC
  text: שָׁמְעָ֬ה וַ/תִּשְׂמַ֨ח צִיּ֗וֹן וַ֭/תָּגֵלְנָה בְּנ֣וֹת יְהוּדָ֑ה לְמַ֖עַן מִשְׁפָּטֶ֣י/ךָ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/008.yaml
  text: Zion heard and rejoiced[a], and the daughters of Judah exulted because of your judgments, O Yahweh.
translation:
  language: zh_hans
  text: 锡安听见就欢喜；犹大的女儿们[a]因你的审判而欢腾，雅威啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹大的城镇”或“犹大的村庄”。希伯来文直译为“犹大的女儿们”；这是诗歌用语，可以指犹大所属的城镇或村庄。
    reason: 词义存在歧义：保留字面诗语，同时说明可能的地域性含义。
lexical_decisions:
- source_word: שָׁמְעָה
  choice: 听见
  rationale: 这是 שׁמע 的 Qal 完成式第三人称阴性单数，以“锡安”为主语；“听见”自然表达已经发生的动作。
- source_word: וַתִּשְׂמַח
  choice: 就欢喜
  rationale: שׂמח 表示喜乐、欢喜；“就”既承接“听见”，也体现希伯来叙事式连接所表达的动作推进。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 保留地名的通行中文译名，不把其可能代指的耶路撒冷或其中居民直接写入正文。
- source_word: וַתָּגֵלְנָה
  choice: 而欢腾
  rationale: גיל 常指洋溢、雀跃的喜乐；“欢腾”比前面的“欢喜”更强，也保留两个近义动词之间的差别。
- source_word: בְּנוֹת יְהוּדָה
  choice: 犹大的女儿们[a]
  rationale: 直译该诗性表达，以保留其形象和歧义；它也可能是指犹大所属的城镇或村庄，因此在脚注中说明。
- source_word: לְמַעַן
  choice: 因
  rationale: 本句中引出锡安和犹大女儿们欢喜的缘由；“因”简洁、自然地表达原因。
- source_word: מִשְׁפָּטֶיךָ
  choice: 你的审判
  rationale: מִשְׁפָּטֶיךָ 可指判决、公正或施行审判的行动；“你的审判”保留其司法语义及一定范围的含义弹性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名按其通常重建的读音音译为“雅威”，保留专名性质，而不以头衔替代。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；正文采用音译“雅威”以保留其专名性质。
- issue: בְּנוֹת יְהוּדָה 是人物称呼还是地域性诗语
  choice: 正文保留“犹大的女儿们”
  alternative: 犹大的城镇；犹大的村庄
  rationale: 原文直说“女儿们”，但在希伯来诗歌中也可指所属的周边居民点；正文不替原文消除歧义，脚注列出地域性理解。
- issue: מִשְׁפָּטֶיךָ 指律例还是审判行动
  choice: 你的审判
  alternative: 你的公正；你施行的审判；你的典章
  rationale: 诗篇97篇的语境偏重雅威公义的统治和审判作为；“审判”符合语境，同时没有过度限定为单一历史事件。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来诗歌的两组平行喜乐表达，以“欢喜／欢腾”区分 שׂמח 与 גיל；呼语“雅威啊”置于句末，与原文一致。
