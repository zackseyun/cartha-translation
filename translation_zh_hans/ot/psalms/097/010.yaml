source:
  edition: WLC
  text: אֹהֲבֵ֥י יְהוָ֗ה שִׂנְא֫וּ רָ֥ע שֹׁ֭מֵר נַפְשׁ֣וֹת חֲסִידָ֑י/ו מִ/יַּ֥ד רְ֝שָׁעִ֗ים יַצִּילֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/010.yaml
  text: You who love Yahweh[a], hate evil. He guards the lives of his faithful ones; from the hand of the wicked he delivers them.
translation:
  language: zh_hans
  text: 爱耶和华的人哪，你们要恨恶邪恶！他守护他的忠信之人的性命[a]；他救他们脱离恶人的手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”也可译为“生命”“人”或“灵魂”；“忠信之人”也可译为“敬虔之人”或“圣民”。
    reason: 说明נַפְשׁוֹת可指生命、人或灵魂，并保留חֲסִידָיו的敬虔／圣民等可行译法。
lexical_decisions:
- source_word: אֹהֲבֵי יְהוָה
  choice: 爱耶和华的人哪
  rationale: 原文是“耶和华的爱慕者”这一结构，在此作呼语。译为“爱耶和华的人哪”，既明确呼唤语气，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之神专名的功能，而不以一般称号替代。
- source_word: שִׂנְאוּ רָע
  choice: 你们要恨恶邪恶
  rationale: שִׂנְאוּ是第二人称阳性复数命令式，故明确译出“你们要”；“恨恶”保留命令的力度，רָע则取宽泛的道德意义“邪恶”。
- source_word: שֹׁמֵר
  choice: 他守护
  rationale: 分词描写耶和华持续或一贯的行动；“守护”自然地表达保护之意，并与下句的救援相呼应。
- source_word: נַפְשׁוֹת
  choice: 性命
  rationale: 在受恶人威胁并蒙拯救的语境中，נֶפֶשׁ主要指人的生命、性命，而非专指与身体相分离的灵魂。
- source_word: חֲסִידָיו
  choice: 他忠信之人
  rationale: חָסִיד指以忠诚、敬虔回应盟约慈爱的人；“忠信之人”兼顾关系性的忠诚与宗教意味，又避免带入特定教会术语。
- source_word: מִיַּד רְשָׁעִים
  choice: 脱离恶人的手
  rationale: 保留希伯来语“从……的手中”的具体意象；中文“脱离恶人的手”也能自然表达摆脱其权势或控制。
- source_word: יַצִּילֵם
  choice: 他必救他们
  rationale: נצל的使役式表示救出、搭救；未完成式在此陈述耶和华可靠的行动，译作“必救”体现应许般的确定性而不过度引申。
theological_decisions:
- issue: נַפְשׁוֹת在本节中的含义
  choice: 性命
  alternative: 灵魂；生命；本人
  rationale: 上下文是耶和华保护忠信者并救他们脱离恶人的权势，因此具体的“性命”最贴切；脚注保留“灵魂”等可能译法，避免把经文限定为某种灵魂论。
- issue: חֲסִידָיו的身份称谓
  choice: 他忠信之人
  alternative: 他的圣民；他的敬虔人；忠于他的人
  rationale: 该词兼有忠诚和敬虔色彩。“忠信之人”保留其与神关系中的忠诚含义，同时不把它收窄为后来的制度性或宗派性称谓。
- issue: יַצִּילֵם的时态语气
  choice: 他必救他们
  alternative: 他救他们；他要救他们
  rationale: 原文未完成式可表达惯常或将发生的行动；在诗歌宣告中，“必救”自然表达神施行拯救的可靠性，但不进一步界定具体时间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“人哪”保留诗歌呼语，“恨恶邪恶”维持命令的力度；整体使用普通读者易懂的词语，同时保留“恶人的手”这一希伯来意象。
