source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה יְהוָ֗ה עֶלְי֥וֹן עַל כָּל הָ/אָ֑רֶץ מְאֹ֥ד נַ֝עֲלֵ֗יתָ עַל כָּל אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/009.yaml
  text: For you[a], O Yahweh, are Most High over all the earth; you are exalted far above all gods.
translation:
  language: zh_hans
  text: 因为你，耶和华，至高，超乎全地；你被高举，远超万神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万神”也可理解为“一切神明”“一切神性存在”或“一切天上的灵体”。希伯来语“以罗欣”（אֱלֹהִים）可随语境指神、神性存在或天上的权能者。
    reason: 保留 אֱלֹהִים 在此处可能涵盖的不同所指，不在正文中预先判定。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前述宣告提供理由；现代汉语中“因为”自然清楚。
- source_word: אַתָּה
  choice: 你
  rationale: 保留原文显式代词所带的强调，突出耶和华本身的至高地位。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行、最易识别的神名音译。
- source_word: עֶלְיוֹן עַל כָּל הָאָרֶץ
  choice: 至高无上，统管全地
  rationale: 表达עַל在此所指的权柄与超越地位，并以自然中文呈现其范围遍及全地。
- source_word: מְאֹד נַעֲלֵיתָ
  choice: 你被高举，远超
  rationale: 保留被动／结果状态的语义，并用“远超”体现מְאֹד的强烈程度及比较关系。
- source_word: עַל כָּל אֱלֹהִים
  choice: 远超万神
  rationale: “万神”简洁保留אֱלֹהִים的复数形式及诗篇对一切神性竞争者的论战张力。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是简体中文读者最熟悉的专名形式；正文保留专名而不以“主”替代。
- issue: 末句אֱלֹהִים的所指
  choice: 万神
  alternative: 一切神明／一切天上的灵体
  rationale: 正文不限定其究竟指偶像、列国诸神还是天上众灵，保留希伯来文的词义宽度与神学张力；脚注列出可成立的理解。
- issue: עֶלְיוֹן עַל כָּל הָאָרֶץ的关系
  choice: 至高无上，统管全地
  alternative: 在全地之上为至高者
  rationale: 所选译文以自然现代汉语表达耶和华相对于全地的至高权柄，避免生硬空间化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留诗歌的两行递进：先宣告耶和华统管全地，再宣告他远超万神。
