  text: הָרִ֗ים כַּ/דּוֹנַ֗ג נָ֭מַסּוּ מִ/לִּ/פְנֵ֣י יְהוָ֑ה מִ֝/לִּ/פְנֵ֗י אֲד֣וֹן כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/005.yaml
  text: The mountains melt like wax before Yahweh[b][a], before the Lord of all the earth.
translation:
  language: zh_hans
  text: '群山在耶和华面前，

    在全地之主面前，如蜡熔化。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִים
  choice: 群山
  rationale: 定冠词复数名词；“群山”自然、凝练地表达整体性的山岳意象。
- source_word: כַּדּוֹנַג
  choice: 如蜡
  rationale: 前缀כ表示比拟；“如蜡”保留明喻，也符合庄重的现代汉语诗体。
- source_word: נָמַסּוּ
  choice: 熔化
  rationale: 该动词表示融化、消融。此处以现代汉语的非时态形式呈现希伯来诗歌完成式的生动描写，不限定为单纯过去事件。
- source_word: מִלִּפְנֵי
  choice: 在……面前
  rationale: 该习语字面涉及“从……面前／临在”，这里译作“在……面前”，自然地保留面对神临在的含义及两行间的重复。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，而不将其与下一行的称号“主”混同。
- source_word: אֲדוֹן
  choice: 主
  rationale: 此词是表示主宰、主人之意的称号；“主”既准确又保持诗歌的庄重语域。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: 保留结构“全地之主”及其普世范围；这里的“地”可指大地或全世界，不额外缩窄。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最广为人知的专名“耶和华”，同时不以称号“主”替代，因此保留第一行神名与第二行称号אֲדוֹן之间的区别。
- issue: נָמַסּוּ 的体貌与时间
  choice: 译作不标明时间的“熔化”
  alternative: 已经熔化了
  rationale: 希伯来语完成式在诗歌神显场景中可作鲜明、整体性的描写。汉语动词无需强制标出过去时，因而既能表达生动景象，也不把经文限定为已结束的历史事件。
- issue: מִלִּפְנֵי 所表达的神圣临在
  choice: 在……面前
  alternative: 因……的临在而／从……面前
  rationale: 原语兼有“从……面前”与“在……临在之前”的空间及临在意味。“在……面前”保留这种张力，同时避免把因果关系明说得超过原文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并以两行排列表现原文的诗歌平行结构。第二行补出“熔化”，使中文句法完整并强化原文重复的神显意象；不加注脚，因为主要词义与歧义可由正文自然承载。
