  text: הֵאִ֣ירוּ בְרָקָ֣י/ו תֵּבֵ֑ל רָאֲתָ֖ה וַ/תָּחֵ֣ל הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/004.yaml
  text: His lightning lights up the world[a]; the earth sees and trembles.
translation:
  language: zh_hans
  text: 他的闪电照亮世界；大地看见，便颤抖[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “颤抖”也可译作“震动”或“扭动”。希伯来语动词可表达颤抖、扭动或震动。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאִירוּ
  choice: 照亮
  rationale: 该词是 אור 的使役形，表示使之发光、得到照明；以闪电为主语时，“照亮”自然保留其使役含义。
- source_word: בְרָקָיו
  choice: 他的闪电
  rationale: 原文为带第三人称阳性单数后缀的复数名词，指上帝发出的闪电。现代汉语通常以集合意义的“闪电”表达，不必生硬标出复数。
- source_word: תֵּבֵל
  choice: 世界
  rationale: תֵּבֵל常指有人居住的世界；译作“世界”，也与下半句的“ 大地”保持词语区别。
- source_word: רָאֲתָה
  choice: 看见
  rationale: 虽为完成式，诗歌在神显的生动画面中可按完整事件表达；“看见”保留大地拟人化的描写，不额外解释其所见。
- source_word: וַתָּחֵל
  choice: 便颤抖
  rationale: 该动词可表示颤抖、扭动或震动。正文选“颤抖”，既符合神显语境，也避免过度限定为地震或痛苦翻腾；“便”自然表达承接反应。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 在与תֵּבֵל平行的宇宙性语境中，此处指全地而非某一地区；“大地”自然且适合诗体。
theological_decisions:
- issue: 神显影响的范围
  choice: 以“世界”和“大地”表达普世性的受造秩序
  alternative: 把הָאָרֶץ译作局部性的“那地”或“土地”
  rationale: 本诗的平行结构及神显语境支持宇宙性的范围；同时保留תֵּבֵל与הָאָרֶץ两个相关而不完全相同的词。
- issue: 大地的拟人化反应
  choice: 保留“大地看见，便颤抖”
  alternative: 解释性地改写为“大地上的人看见便颤抖”
  rationale: 原文直接以大地为主语，形成鲜明拟人画面；不应把它限缩为人的反应。
translation_notes:
  register: 采用现代、庄重而简明的诗体汉语。分号呈现两行间的平行推进；“看见，便颤抖”保留原文拟人化和神显场景的动态张力。
