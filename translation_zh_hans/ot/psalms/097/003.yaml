  text: אֵ֭שׁ לְ/פָנָ֣י/ו תֵּלֵ֑ךְ וּ/תְלַהֵ֖ט סָבִ֣יב צָרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/003.yaml
  text: Fire goes before him and burns his adversaries all around[a].
translation:
  language: zh_hans
  text: 烈火在他前面行进，四面焚烧他的敌手[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仇敌”。
    reason: צָרָיו可指敌对者、敌人；“敌手”和“仇敌”都能表达其语义范围。
lexical_decisions:
- source_word: אֵשׁ
  choice: 烈火
  rationale: 该词指火；在本诗显现与审判的意象中译作“烈火”，符合现代汉语诗体表达，也传达其威势。
- source_word: לְפָנָיו
  choice: 在他前面
  rationale: 这一由“面”构成的介词表达意为“在他面前、在他前方”；“在他前面”自然明白，并保留火行在耶和华之前的空间意象。
- source_word: תֵּלֵךְ
  choice: 行进
  rationale: הלך通常表示“走、行”；以火为主语时，“行进”既自然，又保留原文拟人化的动态画面。
- source_word: וּתְלַהֵט
  choice: 焚烧
  rationale: להט在此表示猛烈燃烧或使之着火；“焚烧”传达强烈而具毁灭性的火势，但不额外明确原文未必明说的完成结果。
- source_word: סָבִיב
  choice: 四围
  rationale: 该副词表示周围、四面；“四围”凝练庄重，适合诗歌语体。
- source_word: צָרָיו
  choice: 他的敌手
  rationale: צָרָיו指与他敌对、攻击他的人；“敌手”保留“敌对者”的核心意义，“仇敌”则作为可行异译列入脚注。
theological_decisions:
- issue: 诗篇97篇神显语境中第三人称阳性单数后缀所指
  choice: 按原文保留“他／他的”这一代词表达，由上下文确定所指。
  alternative: 将所指明说为“耶和华”，如“烈火在耶和华前面行进”。
  rationale: 希伯来文此节使用第三人称后缀，并未再次写出神名；保留代词既忠于句法，也维持诗歌承接上文的流动性，避免在本节加入原文没有的名词。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“行进”保留拟人化动态，“焚烧”表现火势而不强加完成体；“四围”使行文凝练，并与诗篇语境相称。
