  text: שִׂמְח֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/012.yaml
  text: Rejoice in Yahweh[a], you righteous ones[b], and give thanks at the remembrance of his holiness.
translation:
  language: zh_hans
  text: 义人哪，你们要因雅威[a]而欢喜，也要在记念他的圣洁时称谢。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文 יהוה，是这里直接出现的上帝之名；传统译法也常作“耶和华”或“主”。
    reason: divine_name
  - marker: b
    text: “在记念他的圣洁时”也可译作“在提说他的圣洁时”。“记念”一词也有“纪念、提说”的意思。有些译本依照诗篇中的相似说法译作“称谢他的圣名”，但本节希伯来原文直译是“他的圣洁”，没有“名”字。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: 要……欢喜
  rationale: 复数命令式，表达对众人的直接呼吁；“欢喜”自然、庄重，并保留命令语气。
- source_word: צַדִּיקִים
  choice: 义人哪，你们
  rationale: 该复数名词在此作呼语；用“哪”标明直接称呼，并以“你们”显出复数。
- source_word: בַּיהוָה
  choice: 因雅威而
  rationale: 介词 בְּ 在这里表示欢喜所基于或所指向的对象；“因……而欢喜”符合现代汉语表达。
- source_word: יהוה
  choice: 雅威
  rationale: 以音译呈现希伯来经文中的神圣四字名，避免用称号取代原文专名。
- source_word: וְהוֹדוּ
  choice: 也要……称谢
  rationale: ידה 的使役式复数命令在诗篇语境中表示称谢、感谢；“称谢”兼具感谢和敬拜色彩。
- source_word: לְזֵכֶר
  choice: 因记念
  rationale: זֵכֶר 可指记念、纪念或提说；正文采用通顺且贴近基本词义的“因记念”，并在脚注保留“提说”的可能。
- source_word: קָדְשׁוֹ
  choice: 他的圣洁
  rationale: 原文直指“他的圣洁”，没有出现“名”一词，因此不在正文中补入“圣名”。
theological_decisions:
- issue: 如何译神名 יהוה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神圣四字名；音译“雅威”保留其作为专名的性质，而不是以称号替代。
- issue: 是否按相似诗篇惯用语补出“圣名”
  choice: 他的圣洁
  alternative: 他的圣名
  rationale: 本节希伯来文没有 שֵׁם（“名”）；正文保留字面所指，同时在脚注说明传统译法及其依据。
- issue: לְזֵכֶר 的具体语义
  choice: 因记念
  alternative: 因提说
  rationale: זֵכֶר 在此既可理解为记念，也可理解为提说；上下文没有完全排除任何一种，故正文择一，脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌呼告语体。“义人哪”保留呼语力量；“因雅威而欢喜”及“因记念他的圣洁而称谢”兼顾希伯来句法和自然汉语。
