  text: עָנָ֣ן וַ/עֲרָפֶ֣ל סְבִיבָ֑י/ו צֶ֥דֶק וּ֝/מִשְׁפָּ֗ט מְכ֣וֹן כִּסְאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/002.yaml
  text: Clouds and thick darkness are around him[a]; righteousness and justice are the foundation of his throne.
translation:
  language: zh_hans
  text: 密云和幽暗环绕着他；公义和公平是他宝座的根基。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנָן
  choice: 密云
  rationale: 该词在希伯来语中为单数，但可作集合性诗歌意象；结合后面的“幽暗”，译作“密云”既保留云层意象，也符合现代汉语表达。
- source_word: וַעֲרָפֶל
  choice: 和幽暗
  rationale: עֲרָפֶל可指浓暗、阴翳或密云；“幽暗”保留神显场景中深沉、遮蔽的意味，又不把意象抽象化。
- source_word: סְבִיבָיו
  choice: 环绕着他
  rationale: 直接表达“在他四周”的空间关系；用动词“环绕”使汉语诗句自然凝练。
- source_word: צֶדֶק
  choice: 公义
  rationale: 与מִשְׁפָּט并列时，“公义”侧重正直、合乎正道，保留两个词之间的语义区别。
- source_word: וּמִשְׁפָּט
  choice: 和公平
  rationale: 该词可指审判、司法秩序或公正；“公平”与“公义”搭配自然，并体现公正施行判断的含义。
- source_word: מְכוֹן
  choice: 根基
  rationale: 该名词指固定之处、基座或基础；在宝座意象中译作“根基”准确而自然。
- source_word: כִּסְאוֹ
  choice: 他宝座的
  rationale: 按希伯来语所属结构译出“他的宝座”，与“根基”组成自然的领属短语。
theological_decisions:
- issue: 神显中上帝既显现又隐藏的意象
  choice: 保留“密云和幽暗环绕着他”的具体意象
  alternative: 意译为威严、奥秘环绕着他
  rationale: 原文以云和幽暗描写上帝临在，同时带有遮蔽性；不将这种神学张力化约为抽象的威严或奥秘。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话；上下两分句保持诗歌式平衡。“公义和公平”沿用清楚自然的圣经语域，同时避免把两个希伯来词合并为同一概念。
