  text: נִֽדֲר֣וּ וְ/שַׁלְּמוּ֮ לַ/יהוָ֪ה אֱֽלֹהֵ֫י/כֶ֥ם כָּל סְבִיבָ֑י/ו יוֹבִ֥ילוּ שַׁ֝֗י לַ/מּוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/011.yaml
  text: Make vows to Yahweh your God and fulfill them[b][a]; let all around him bring tribute to the Fearsome One.
translation:
  language: zh_hans
  text: 你们要向耶和华你们的神许愿，并要还愿；凡在他四围的，都要向那可畏者[b]献上贡礼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“礼物”或“礼品”。希伯来语 שַׁי 可指献给尊贵上位者的礼物；“贡礼”突出了这里敬奉君王、也可能带有政治意味的色彩。
    reason: lexical_alternative
  - marker: b
    text: 或译“当受敬畏者”或“令人敬畏的那一位”。这个希伯来语称谓强调，神是人理当畏惧敬仰的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדֲרוּ
  choice: 许愿
  rationale: 该词是复数命令式，指向神立愿；“许愿”是现代汉语中自然且符合礼仪语境的表达。
- source_word: וְשַׁלְּמוּ
  choice: 并要还愿
  rationale: שלם 在此指履行、偿付所许的愿。“还愿”简洁表达履行誓愿之意，并承接前面的“许愿”。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 直接音译四字神名 יהוה，以保留经文中的立约之名。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 准确体现复数第二人称后缀，并与“耶和华”构成同位关系。
- source_word: כָּל סְבִיבָיו
  choice: 凡在他四围的
  rationale: 该短语指所有环绕他的人或群体；译文保留诗句的概括性，不限定为某一类民族。
- source_word: יוֹבִילוּ
  choice: 都要……献上
  rationale: 使役词形在此表示把礼物带来奉上；“献上”符合向尊贵者呈送贡礼的语境。
- source_word: שַׁי
  choice: 贡礼
  rationale: 该名词指献给尊贵上位者的礼物。“贡礼”兼顾礼物、尊崇以及可能存在的君王政治色彩。
- source_word: לַמּוֹרָא
  choice: 向当受敬畏者
  rationale: מוֹרָא 含恐惧、威严之意，在此用作对神的称谓；此译法明确表达神是人理当畏惧敬仰的对象。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文圣经读者最熟悉的专名“耶和华”，同时不以普通称号替代原文的专有神名。
- issue: לַמּוֹרָא 是否作为神的称号
  choice: 当受敬畏者
  alternative: 可畏者
  rationale: 将其保留为指向神的称谓，并保留原词兼具畏惧与敬畏的张力；“当受敬畏者”也比现代口语中可能仅表示“厉害”的表达更明确。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“许愿／还愿”形成清晰对举；后半句保留诗歌式的概括表达。“当受敬畏者”刻意保留原文中敬畏与惧怕并存的神学张力。
