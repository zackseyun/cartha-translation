  text: נָ֭אוֹר אַתָּ֥ה אַדִּ֗יר מֵֽ/הַרְרֵי טָֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/004.yaml
  text: You are radiant[a], more majestic than the mountains of prey.
translation:
  language: zh_hans
  text: 你光辉灿烂，比满有猎物的群山更为威严。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “猎物”也可译作“掠物”或“战利品”。本句也可能理解为：“你从满有猎物的群山显出光辉，威严无比。”
    reason: 说明 טָרֶף 的词义范围，以及 מִן 可能表示来源而非比较。
lexical_decisions:
- source_word: נָאוֹר
  choice: 光辉灿烂
  rationale: 该词表达发光、明亮或荣美。“光辉灿烂”在现代汉语中自然庄重，保留神自身彰显光辉的诗歌意象，又不暗示他只是被外来的光照亮。
- source_word: אַתָּה
  choice: 你
  rationale: 希伯来语代词在无系词句中作主语；汉语用“你”即可自然构成判断与描写，无须补出“是”。
- source_word: אַדִּיר
  choice: 更威严
  rationale: 该词可指威严、尊荣或强大。其后接介词 מִן，主译采用比较义；“威严”兼顾尊贵与力量，比单译“强大”更符合本行的颂赞语境。
- source_word: מֵהַרְרֵי
  choice: 比……之山更
  rationale: 前缀 מִן 可表示比较或来源、分离。主译结合 אַדִּיר 取比较义“比……更”；“……之山”保留原文的构造关系和凝练诗体。
- source_word: טָרֶף
  choice: 猎物
  rationale: 该名词本义为猛兽撕取的猎物，也可引申为掠物、战利品。主译“猎物”保留原文鲜明而未完全解释的山野意象，其他可能含义收入脚注。
theological_decisions:
- issue: מֵהַרְרֵי טָרֶף 的句法和意象
  choice: 理解为比较：“比猎物之山更威严”
  alternative: 可理解为来源：“你从猎物之山发出光辉，威严无比”；טָרֶף 也可指“掠物、战利品”
  rationale: אַדִּיר 与 מִן 连用时，比较义最为顺畅，但希伯来语仍容许来源义；“猎物之山”本身也可能涉及掠物或战利品。正文保留诗歌意象，不把它限定为某个历史地点或特定神学解释，脚注则说明真实存在的词义和句法分歧。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“光辉灿烂”传达明亮荣美；“猎物之山”刻意保留原文凝练而含混的意象，并以脚注交代主要替代读法。
