  text: מִ֭/גַּעֲרָ֣תְ/ךָ אֱלֹהֵ֣י יַעֲקֹ֑ב נִ֝רְדָּ֗ם וְ/רֶ֣כֶב וָ/סֽוּס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/006.yaml
  text: At your rebuke[a], O God of Jacob[b], both chariot and horse were cast into a deep sleep.
translation:
  language: zh_hans
  text: 雅各的神啊，因你的斥责[a]，战车和战马[b]都陷入沉睡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因你的斥责”也可译作“由于你的斥责”或“你一斥责”。原文介词可表示来源或原因。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“战车和马”，是指军事力量的诗歌表达；也有人认为这一画面还包括驾车者或骑马者。
    reason: cultural_note
lexical_decisions:
- source_word: מִגַּעֲרָתְךָ
  choice: 因你的斥责
  rationale: 介词 מִן 在这里可表示来源或原因；“因”在现代汉语中自然地表达神斥责所产生的即时结果，同时保留因果意味。
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: 雅各的神啊
  rationale: 这是神的称号；句末语气词“啊”自然地体现诗句中的直接呼告。
- source_word: נִרְדָּם
  choice: 陷入沉睡
  rationale: רדם 的尼法勒形表示进入深睡或昏睡状态，不是普通休息。“陷入沉睡”既体现被制伏、失去行动能力的效果，又不把意象明确限定为死亡。
- source_word: וְרֶכֶב וָסוּס
  choice: 战车和战马
  rationale: 原文并列“车”和“马”，语境是军事力量；译作“战车和战马”在现代汉语中清楚自然，并避免把原文解释性地改成“骑兵和马”。“都”体现这一对事物共同遭受同一结果。
theological_decisions:
- issue: 本节所描写的败亡性质
  choice: 神的斥责使敌军的战力完全失去行动能力，以沉睡或昏睡为诗歌意象。
  alternative: 将其限定为车马的字面睡眠，或明确解释为死亡和彻底毁灭。
  rationale: 原文使用 נִרְדָּם（陷入沉睡）的意象；在神战胜敌对势力的上下文中，它表达军事力量被制伏，却没有明说究竟只是昏睡还是死亡，因此译文保留这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅各的神啊”保留呼告语气；“陷入沉睡”既传达突然被制伏的效果，也不把诗歌意象过度解释为明确的死亡。脚注标记均置于相应词语之后。
