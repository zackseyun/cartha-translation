  text: נוֹדָ֣ע בִּֽ/יהוּדָ֣ה אֱלֹהִ֑ים בְּ֝/יִשְׂרָאֵ֗ל גָּד֥וֹל שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/001.yaml
  text: God is known in Judah[b][a]; his name is great in Israel.
translation:
  language: zh_hans
  text: 在犹大，神为人所知[a]；在以色列，他的名为大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神在犹大显明自己。”希伯来语形式既可表示“为人所知”的状态，也可在这里带有较强的事件意味。
    reason: lexical_alternative
  - marker: b
    text: “他的名”可指神所启示的身份、声誉和威望，不只是对他的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  choice: 为人所知
  rationale: 该词是 ידע 的尼法勒式，可表达“被认识、为人所知”的状态；此译法保留被动或状态含义，也不把经文直接限定为反身性的“使自己显明”。
- source_word: בִּיהוּדָה
  choice: 在犹大
  rationale: 介词 ב 在此自然表示“在”；“犹大”既可指地域，也可指群体，此译保留两者的可能性。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处虽有复数形态，却按单数意义使用，指以色列的神。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列
  rationale: 与“在犹大”形成平行结构，并保留地域和群体两方面的含义。
- source_word: גָּדוֹל
  choice: 大有威荣
  rationale: 基本义为“大”。现代汉语若直译“他的名是大的”较生硬；“大有威荣”在不改写为动作的前提下，较自然地表达其名崇高、显赫。
- source_word: שְׁמוֹ
  choice: 他的名
  rationale: 保留原文具体的“名”，不简化为“名声”或“受到尊崇”，从而保存其所承载的启示身份与声誉含义。
theological_decisions:
- issue: 神“为人所知”的语义
  choice: 译作“神为人所知”
  alternative: 神使人认识他／神在犹大显明自己
  rationale: 原文形式可侧重“被认识、为人所知”的状态，也可在语境中带有神使自己显明的事件意味；正文采用较贴近形式且较少解释性的译法，脚注保留另一可能。
- issue: 神之“名”的含义
  choice: 保留“他的名”这一具体表达
  alternative: 他的名声显赫／他大受尊崇
  rationale: “名”不仅指口头称谓，也可指神所启示的身份、声誉和威望。保留“名”可避免把其神学内涵压缩为一般名声或人的尊崇。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达；以“在犹大……在以色列……”重现希伯来诗歌的平行结构。“大有威荣”避免生硬的“名是大的”，同时保留 גָּדוֹל 的崇高、显赫语感。
