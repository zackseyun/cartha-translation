  yaml_path: translation/ot/psalms/076/002.yaml
  text: His shelter was in Salem[b][a], and his dwelling place in Zion.
translation:
  language: zh_hans
  text: '他的棚[b]在撒冷[a]；

    他的居所在锡安。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撒冷”传统上被认作耶路撒冷；本节把“撒冷”与“锡安”并列，作为上帝居住之地的名称。
    reason: cross_reference
  - marker: b
    text: “棚”也可译作“棚屋”、“帐幕”或“亭子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 在
  rationale: 此处 היה 的叙事形式表达存在及所在位置；汉语用“在”自然地呈现这一系词兼方位意义。
- source_word: בְשָׁלֵם
  choice: 在撒冷
  rationale: 保留希伯来文地名 שָׁלֵם，不在正文中直接解释为“耶路撒冷”，以保存与“锡安”的诗意平行。
- source_word: סֻכּוֹ
  choice: 他的棚
  rationale: סֻכָּה 基本指棚、棚屋或遮蔽处。“棚”简洁具体，也避免“帐幕”可能带入的专门礼仪含义。
- source_word: וּמְעוֹנָתוֹ
  choice: 他的居所
  rationale: מְעוֹנָה 指居住之处；“居所”庄重自然，并与上句构成清楚的诗歌平行。
- source_word: בְצִיּוֹן
  choice: 在锡安
  rationale: 按通行中文圣经地名译法保留专名“锡安”。
theological_decisions:
- issue: “撒冷”与“锡安”的关系
  choice: 在正文中分别保留“撒冷”和“锡安”两个名称。
  alternative: 将“撒冷”直接译作“耶路撒冷”。
  rationale: 原文以两个名称构成平行，指出上帝的所在；不在正文中将二者合并，可保留原诗的地名层次和神学张力。
- issue: “棚”是否应理解为礼仪性的帐幕
  choice: 采用基本词义“棚”，不把礼仪含义写入正文。
  alternative: 译作“帐幕”或“圣幕”。
  rationale: 该词可以泛指棚屋或遮蔽之所，语境并不要求专门的会幕含义，因此宜保留较宽的词义。
translation_notes:
  register: 采用现代、简洁而庄重的诗歌体；分为两个平行分句。“他的棚所在撒冷”保留希伯来语略显凝练的表达，并避免把“撒冷”解释性改写为“耶路撒冷”。脚注标记依内容顺序置于“撒冷”之后。
