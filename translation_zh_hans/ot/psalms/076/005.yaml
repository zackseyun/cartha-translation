source:
  edition: WLC
  text: אֶשְׁתּוֹלְל֨וּ אַבִּ֣ירֵי לֵ֭ב נָמ֣וּ שְׁנָתָ֑/ם וְ/לֹא מָצְא֖וּ כָל אַנְשֵׁי חַ֣יִל יְדֵי/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/005.yaml
  text: The stouthearted were plundered; they slept their sleep[a], and none of the men of valor could find their hands.
translation:
  language: zh_hans
  text: 心中刚强的人被劫掠；他们沉沉睡去[a]；所有勇士都找不到自己的手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沉沉睡去”在这里可能暗指死亡，但原文仍保留“睡眠”的诗歌意象。
    reason: 保留原文对睡眠与死亡之间的含混表达。
  - marker: b
    text: 或译：“所有勇士都不能动手”，意思是他们已无力行动。
    reason: 说明“找不到自己的手”这一希伯来语意象的惯用含义。
lexical_decisions:
- source_word: אֶשְׁתּוֹלְלוּ
  choice: 被掳掠
  rationale: 该词源于“掳掠、夺取战利品”的词根，在这里带有被动或反身意味，表明那些强者反倒成了被掳掠的对象；这一译法也符合全诗的战争语境。
- source_word: אַבִּירֵי לֵב
  choice: 心里刚强的人
  rationale: 直译为“心中强大的人”，可指勇猛、刚强或自恃强悍之人。“心里刚强”保留了原文以“心”表达内在胆量和意志的意象。
- source_word: נָמוּ שְׁנָתָם
  choice: 他们沉沉睡去
  rationale: 原文以同源词构成“睡了他们的睡”这一诗歌表达。“沉沉睡去”在现代汉语中自然且有诗意，同时不在正文中武断判定这是普通睡眠、昏睡还是死亡。
- source_word: אַנְשֵׁי חַיִל
  choice: 勇士
  rationale: 这是常见的军事用语，指有力量、勇气和战斗能力的人；“勇士”简洁自然，并保留战争色彩。
- source_word: וְלֹא מָצְאוּ ... יְדֵיהֶם
  choice: 都找不着自己的手
  rationale: 正文保留希伯来文“找不着手”的鲜明意象；其语用含义可能是不能动手、无力行动，脚注予以说明而不取代原文图像。
theological_decisions:
- issue: “睡去”是否明确指死亡
  choice: 正文保留“睡去”的含混性
  alternative: 译作“长眠”或“睡死过去”
  rationale: 上下文强烈暗示这些勇士遭到致命击败，但该短语本身使用的是“睡眠”意象。正文不把暗示提升为明说，以保留诗歌张力。
- issue: “找不着自己的手”是否直接解释为无力反抗
  choice: 正文保留字面意象，脚注说明惯用含义
  alternative: 正文译作“都无力动手”
  rationale: 字面意象突显勇士突然失去行动能力的讽刺效果；脚注可帮助普通读者理解其含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以“心里刚强”保留希伯来文的身体意象，以“沉沉睡去”传达诗歌节奏并保留生死含混；“找不着自己的手”刻意保留原文陌生而有力的画面，并用脚注辅助理解。
