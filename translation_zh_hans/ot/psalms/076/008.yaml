source:
  edition: WLC
  text: מִ֭/שָּׁמַיִם הִשְׁמַ֣עְתָּ דִּ֑ין אֶ֖רֶץ יָֽרְאָ֣ה וְ/שָׁקָֽטָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/008.yaml
  text: From heaven you made judgment heard[c][b][a]; the earth feared and was quiet.
translation:
  language: zh_hans
  text: 你从天上使人听见判决[a]；大地[b]惧怕，安静下来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你从诸天使人听见审判。”
    reason: lexical_alternative
  - marker: b
    text: “大地”也可译作“土地”；但这里“天上”与“大地”的对照更支持较广的含义。
    reason: lexical_alternative
  - marker: c
    text: 或译：“静止不动。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: 从天上
  rationale: 介词 מִן 表示来源；שָׁמַיִם 在这里与“大地”形成天地对照。现代汉语用“从天上”自然、庄重，也保留了审判来自神圣领域的垂直意象。
- source_word: הִשְׁמַעְתָּ
  choice: 使人听见
  rationale: שׁמע 的使役形表达“使……被听见”。译作“使人听见”保留使役意义，又比生硬的被动句更符合现代汉语；没有进一步解释听见者是谁。
- source_word: דִּין
  choice: 判决
  rationale: דִּין 在本诗语境中指司法性的裁断或审判决定。“判决”突出从天上发出并被听见的裁断；“审判”也可能，但较容易被理解为整个施行审判的过程。
- source_word: אֶרֶץ
  choice: 大地
  rationale: אֶרֶץ 可指土地、地域或全地。这里与“天上”相对，采用“大地”最能保留宇宙性的天地框架，同时具有合宜的诗体色彩。
- source_word: יָרְאָה
  choice: 惧怕
  rationale: ירא 可表达害怕或敬畏。审判语境中的“惧怕”保留其直接而强烈的反应，不将其限定为较正面的“敬畏”。
- source_word: וְשָׁקָטָה
  choice: 安静下来
  rationale: שׁקט 表示安静、平息或止息。“安静下来”自然地表达大地因天上的判决而停止扰动，也保留其可指静止或安歇的语义范围。
theological_decisions:
- issue: אֶרֶץ 在“天上”对照中的范围
  choice: 理解为普世性的“大地”
  alternative: 理解为某一片“土地”，可能特指以色列地或较局部的地上领域
  rationale: “从天上”与 אֶרֶץ 构成希伯来诗歌常见的天地对照，因此较广义的“大地”更符合当前语境；脚注仍保留较窄的可能性。
- issue: דִּין 所指的是宣告的裁决还是施行审判的行动
  choice: 译为“判决”，突出被使人听见的司法裁断
  alternative: 译为“审判”，可兼指神施行审判的行动
  rationale: 动词 הִשְׁמַעְתָּ 强调使其被听见，与可宣告的“判决”搭配自然；但原词语义可涵盖更广的审判，因此在脚注保留“审判”。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。句式保持原文两半的简洁推进：“从天上”指出来源，随后以“大地”回应；“惧怕，安静下来”保留两个并列动词的节奏。
