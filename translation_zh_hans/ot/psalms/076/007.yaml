  text: אַתָּ֤ה נ֥וֹרָא אַ֗תָּה וּ/מִֽי יַעֲמֹ֥ד לְ/פָנֶ֗י/ךָ מֵ/אָ֥ז אַפֶּֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/007.yaml
  text: You—you are to be feared[a]; and who can stand before you from the time of your anger[b]?
translation:
  language: zh_hans
  text: 你——你是令人敬畏的[a]；自你发怒之时起[b]，谁能在你面前站立得住？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你是可畏的”或“你令人畏惧”。希伯来文兼有使人惧怕和当受敬畏之意。
    reason: lexical_alternative
  - marker: b
    text: 或译“自你的怒气以来”或“当你发怒时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה ... אַתָּה
  choice: 你——惟独你
  rationale: 保留重复代词的强烈强调；“惟独”使现代汉语自然有力，但不把它扩展为独立的排他性命题。
- source_word: נוֹרָא
  choice: 令人敬畏
  rationale: 该词表示使人惧怕、当受敬畏；“令人敬畏”兼顾畏惧与崇敬，也避免“可怕”可能带来的纯负面色彩。
- source_word: וּמִי
  choice: 谁
  rationale: 以反问承接上句；汉语分号之后省去直译连接词“而”，更自然，逻辑关系仍清楚。
- source_word: יַעֲמֹד לְפָנֶיךָ
  choice: 能在你面前站立得住
  rationale: 未完成式在反问中表达能力或可能性；“站立得住”传达无人能承受或抵挡上帝临在的含义。
- source_word: מֵאָז
  choice: 自……之时起
  rationale: 保留介词所表达的起点与延续意味，不将其简化为仅指某一时刻的“当……时”。
- source_word: אַפֶּךָ
  choice: 你发怒
  rationale: אַף在此以转喻表示怒气；动词化为“发怒”符合现代汉语，并与מֵאָז构成自然的时间表达。
theological_decisions:
- issue: 对上帝之“畏”的性质
  choice: 令人敬畏
  alternative: 可畏；可怕；令人畏惧
  rationale: 既保留面对上帝威严和怒气时的惧怕，也容纳崇敬之意，不把词义缩减为单纯恐怖或较弱的赞叹。
- issue: 人在上帝怒气前能否站立
  choice: 谁能在你面前站立得住
  alternative: 谁会站在你面前；谁可以站在你面前
  rationale: 按语境将反问理解为能力与承受力，却不另行说明审判方式或人的最终结局。
- issue: מֵאָז אַפֶּךָ的时间关系
  choice: 自你发怒之时起
  alternative: 自你的怒气以来；当你发怒时
  rationale: 保留“从那时起”的时间起点和诗句本身略显浓缩的表达，不将其明确改写成因果关系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“你——惟独你”再现希伯来文代词重复的强调；“站立得住”是自然的汉语反问表达。主文及脚注保留“自……之时起”与“当……时”之间的时间歧义。
