lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐团指挥
  rationale: 该词在诗篇题注中通常指负责统筹音乐演奏的人；“圣乐团指挥”既符合礼仪音乐语境，也比笼统的“领袖”更清楚。前缀 לַ־以“交给”表达。
- source_word: בִּנְגִינֹת
  choice: 用弦乐器伴奏
  rationale: 该词在诗篇题注中指弦乐或弦乐器；此译自然表达演奏指示，同时不限定具体乐器。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇题注中的体裁名称；中文以“诗”简洁表达，并与后面的“歌”相区别。
- source_word: לְאָסָף
  choice: 亚萨的
  rationale: 题注中的 לְ־可以表示作者、归属、关联或献予；“亚萨的”保留这种关系上的含混，不武断限定为亚萨亲自创作。
- source_word: שִׁיר
  choice: 一首歌
  rationale: 这是与“诗”并列的第二个体裁名称；译出“一首歌”保留原文的双重体裁标示。
theological_decisions:
- issue: “亚萨的”所表示的关系
  choice: 保留为“亚萨的”，不明确断定作者身份
  alternative: 亚萨所作的
  rationale: 希伯来语介词 לְ־在诗篇题注中可表示作者、归属、团体关联或献予；原文本身没有排除这些可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇题注体。以短句呈现演奏指示，并用“也是”自然连接“诗”与“歌”两个体裁名称；不把题注中的介词关系解释得过窄。
