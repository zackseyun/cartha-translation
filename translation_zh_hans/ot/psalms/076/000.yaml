  text: 交给乐长[a]；用弦乐器。亚萨的诗[b]，一首歌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乐长”也可译作“音乐主管”或“指挥”；原词在诗篇题注中通常指负责音乐演出的人，但其确切职务不能完全确定。
    reason: lexical_uncertainty
  - marker: b
    text: “亚萨的”可能表示亚萨所作、与亚萨或亚萨诗班传统有关，或献给亚萨；并不一定只表示个人作者身份。
