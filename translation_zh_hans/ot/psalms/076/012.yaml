base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/012.yaml
  text: He cuts off the spirit of princes[b][a]; he is feared by the kings of the earth.
translation:
  language: zh_hans
  text: 他挫败首领的锐气[a]；地上的君王都畏惧他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他约束统治者的灵”；“灵”也可指“气息”“勇气”或“性情”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他在地上的君王看来是可畏的。”
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְצֹר
  choice: 挫折
  rationale: בצר在此为Qal未完成式第三人称阳性单数，与“首领的רוּחַ”连用，表示压下、削弱或截断其气势；“挫折”自然传达上帝使统治者受抑的决定性行动，同时不限定为夺去生命。
- source_word: רוּחַ
  choice: 锐气
  rationale: רוּחַ可指风、气息、灵、勇气或性情。此处从属于人的首领，结合יִבְצֹר，较自然地指他们的气势、勇气或傲气；“锐气”在现代汉语中保留了内在气概与外显威势之间的语义空间。脚注列出其他可能。
- source_word: נְגִידִים
  choice: 首领
  rationale: נָגִיד指领袖、统治者或君王。“首领”用语庄重而通行，并与下句“君王”形成近义平行而不完全重复。
- source_word: נוֹרָא
  choice: 都畏惧他
  rationale: נוֹרָא表示可畏、令人惧怕；结合介词לְ和“地上的君王”，译为“都畏惧他”符合现代汉语表达，并凸显君王是感受敬畏者。
- source_word: לְמַלְכֵי אָרֶץ
  choice: 地上的君王
  rationale: לְ在נוֹרָא之后表示关联对象，即上帝对于世上君王是可畏的。汉语以“地上的君王都畏惧他”自然表达这一关系。
theological_decisions:
- issue: 上帝对统治者所采取行动的性质
  choice: 经文描写上帝压下首领的锐气，使他们的威势受挫。
  alternative: 也可能指上帝截断他们的气息、夺去生命，或约束他们的怒气、勇气。
  rationale: בצר与רוּחַ的组合存在真实的词义张力。上下文强调上帝胜过列国与君王，主文采用较宽泛的“挫折……锐气”，不把含义限定为死亡或某一种情绪，并以脚注保存其他解释。
- issue: 君王对上帝的反应与上帝的可畏性
  choice: 译作君王“都畏惧他”。
  alternative: 也可译作“他在地上的君王看来是可畏的”。
  rationale: נוֹרָא既可从上帝令人畏惧的属性来表达，也可从君王的反应来表达；主文采用自然汉语的反应式表达，脚注保留属性式译法。
translation_notes:
  register: 采用现代、庄重而清楚的诗歌语言。“挫折……锐气”兼顾希伯来语动词的强度与רוּחַ的多义性；分号呈现两行诗句的平行关系。所有脚注标记均置于主文相应位置。
