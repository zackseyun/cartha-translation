source:
  edition: WLC
  text: שָׁ֭מָּ/ה שִׁבַּ֣ר רִשְׁפֵי קָ֑שֶׁת מָגֵ֬ן וְ/חֶ֖רֶב וּ/מִלְחָמָ֣ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/003.yaml
  text: There he shattered the arrows of the bow[a], shield and sword and battle[c][b]. Selah
translation:
  language: zh_hans
  text: 在那里，他粉碎了弓的火矢[a]、盾牌、刀剑和战争[b]。细拉[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弓箭”。这里的希伯来语直译近于“弓的火焰（或闪光）”，以鲜明的意象指箭矢。
    reason: 保留 רִשְׁפֵי קָשֶׁת 的词义范围及其火光意象。
  - marker: b
    text: 或译“战斗”“战事”。
    reason: מִלְחָמָה 可按语境指战争、战事或战斗。
  - marker: c
    text: “细拉”的确切含义不明，可能是礼仪或音乐记号。
    reason: 说明音译词 סֶלָה 的不确定性质，避免把某一种解释写入正文。
lexical_decisions:
- source_word: שָׁמָּה
  choice: 在那里
  rationale: 地点副词回指上文所说之处；不在本节擅自补出“撒冷”或“锡安”。
- source_word: שִׁבַּר
  choice: 粉碎了
  rationale: שׁבר 的 Piel 完成式表达强力、彻底的破坏；“粉碎”也能统摄后面的兵器和“战争”这一诗意并列项。
- source_word: רִשְׁפֵי קָשֶׁת
  choice: 弓的火矢
  rationale: רֶשֶׁף 可表示火焰、闪光，并可引申指箭矢。“火矢”既让读者明白这是箭，又保留希伯来诗句中的火光意象，同时避免现代汉语“火箭”通常使人联想到火箭飞行器。
- source_word: מָגֵן
  choice: 盾牌
  rationale: 该词在这里指防御性兵器，译为现代汉语通行的“盾牌”。
- source_word: וְחֶרֶב
  choice: 刀剑
  rationale: חֶרֶב 泛指刀或剑类兵器；“刀剑”在汉语中自然，并避免无根据地限定具体形制。
- source_word: וּמִלְחָמָה
  choice: 战争
  rationale: מִלְחָמָה 可指战争、战事或战斗。此处作为兵器清单的高潮，译作“战争”保留从具体武器扩展到整个战争的诗意张力。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切含义不明，可能是礼仪或音乐记号，因此依传统音译而不作推断性意译。
theological_decisions:
- issue: 第三人称阳性单数动词的隐含主语
  choice: 用“他”承接上下文中的上帝
  alternative: 省略主语，或理解为未明确指出的阳性行动者
  rationale: 本节希伯来文没有明说主语，但上下文表明行动者是上帝。汉语补出“他”可使句子自然，同时不在本节加入神名。
- issue: “粉碎”所统摄的范围
  choice: 让动词同时支配火矢、盾牌、刀剑和战争
  alternative: 将“战争”解释为与兵器不同的独立陈述或抽象概括
  rationale: 原文把这些名词紧密并列在同一个动词之后。译文保留这种语法和诗意张力，不把“战争”改写为额外的解释性命题。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“在那里”承接上文；用紧凑的并列保持原文节奏。选择“火矢”而非现代常指飞行器的“火箭”，既清楚表达箭矢，又保留火焰或闪光的意象；“战争”虽与具体兵器并列而形成张力，但这正是原文的诗意表达，故不予消解。
