lexical_decisions:
- source_word: בְּ/קוּם
  choice: 起来……时
  rationale: 介词 בְּ 与动词 קוּם 的不定式组合在此表达时间，译为“起来……时”既自然，也保留上帝介入行动的诗歌画面。
- source_word: לַ/מִּשְׁפָּט
  choice: 施行审判
  rationale: מִשְׁפָּט 在此具有司法裁断的含义；“施行审判”符合现代汉语表达，同时不把它收窄为抽象的“公义”或某个具体法庭场景。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为复数形式，却单数地指以色列的上帝；译作“上帝”清楚而庄重。
- source_word: לְ/הוֹשִׁיעַ
  choice: 为要拯救
  rationale: ישׁע 的使役式不定式表示拯救、解救；“为要拯救”明确呈现目的关系，并保留实际搭救的意味。
- source_word: כָּל
  choice: 一切
  rationale: כָּל 修饰后续组合短语，表达集合性的“所有”；“一切”适合庄重诗体。
- source_word: עַנְוֵי
  choice: 谦卑的人
  rationale: עָנָו 可指谦卑、温顺或受苦受压的人。“谦卑的人”兼顾其常见的品格含义，又不完全排除其社会处境；其他可能含义列入脚注。
- source_word: אֶרֶץ
  choice: 全地
  rationale: אֶרֶץ 可指“大地”或“那地”。此处“全地”自然呈现诗句的广泛范围，而“那地”保留为脚注中的可能译法。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词的确切功用不明，可能是礼仪或音乐标记；采用传统音译，避免对其意义作无根据的确定解释。
theological_decisions:
- issue: עַנְוֵי 的语义侧重
  choice: 谦卑的人
  alternative: 温顺的人；受苦的人
  rationale: 经文描写上帝施行审判并搭救一群卑微者。“谦卑的人”可表达其内在姿态，同时不排除低微、受压的处境；脚注保留其他语义，避免将神学张力单向化。
- issue: אֶרֶץ 的范围
  choice: 全地
  alternative: 那地
  rationale: 诗歌语境容许普世范围与特定地域两种理解。正文采用较自然且较广的“全地”，脚注保留地域性的读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“起来施行审判”保留原文的司法行动意象；“细拉”沿用传统音译。脚注标记紧跟各自所说明的词语，以免产生歧义。
