  naturalness: “上帝起来施行审判时，为要拯救地上一切谦卑的人。细拉”自然、庄重，适合诗篇体裁。“地上”与“一切谦卑的人”的搭配也比“全地一切谦卑的人”更清楚。
  terminology: “上帝”“施行审判”“拯救”“谦卑的人”“细拉”均恰当。“温柔的人”比“温顺的人”更适合作为 עָנָו 在现代汉语及汉语圣经语境中的“meek”备选表达；“受苦的人”保留其受压/困苦的语义可能。
