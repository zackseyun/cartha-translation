base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/010.yaml
  text: For the wrath of man will praise you[b][a]; with the remnant of wrath you will gird yourself.
translation:
  language: zh_hans
  text: 因为人的烈怒必赞美你[a]；余下的烈怒，你要束在自己身上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”在这里泛指全人类。
    reason: lexical_alternative
  - marker: b
    text: 或译：“余下的烈怒，你要抑制。”希伯来文末句含义艰深；正文较贴近马所拉文本的措辞，并保留其隐喻。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并引出理由，保留其因果、解释作用。
- source_word: חֲמַת אָדָם
  choice: 人的烈怒
  rationale: אָדָם在此泛指人类；“人的”自然涵盖全人类。חֵמָה表示炽烈的怒气，“烈怒”符合诗歌语体。
- source_word: תּוֹדֶךָּ
  choice: 终必使你得赞美
  rationale: ידה的Hiphil常指称谢或赞美；这里主语是“人的烈怒”，意为人的怒气最终反而归荣耀于上帝。“使你得赞美”比拟人化的“赞美你”更自然，同时“终必”表达未完成式在语境中的确定结果。
- source_word: שְׁאֵרִית חֵמֹת
  choice: 烈怒所余的
  rationale: שְׁאֵרִית指剩余之物；חֵמֹת虽为复数形式，汉语以集合性的“烈怒”表达更自然。“所余的”保留其指代开放性。
- source_word: תַּחְגֹּר
  choice: 你要束在自己身上
  rationale: חגר本义是束上、系在身上，常用于衣物或兵器。此译保留马所拉文本的具体隐喻，不擅自解释为抑制、穿戴或武装。
theological_decisions:
- issue: 末句 שְׁאֵרִית חֵמֹת תַּחְגֹּר 的解释
  choice: 以上帝为第二人称主语，把余下的烈怒“束在自己身上”
  alternative: 你要抑制余下的烈怒；或余下的烈怒环绕并庆贺你
  rationale: 马所拉文本的动词是第二人称阳性单数，最自然以上帝为主语，字面为“你要束上”。由于此句含义艰深，正文保留其隐喻与张力，脚注列出常见的解释性译法。
translation_notes:
  register: 采用现代、庄重而可懂的诗歌语言。“束在自己身上”有意保留原文不寻常的意象；正文中的脚注标记按首次出现顺序排列。
