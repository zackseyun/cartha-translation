base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/015.yaml
  text: to declare that Yahweh is upright; he is my rock[a], and there is no unrighteousness in him.
translation:
  language: zh_hans
  text: 为要宣告：耶和华是正直的；他是我的磐石，他毫无不义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：他没有不公。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַגִּיד
  choice: 好宣告
  rationale: 该不定式承接上文，表达目的或结果；“宣告”保留公开述说的意味，“好”使汉语与前文衔接自然。
- source_word: כִּי
  choice: ：
  rationale: כִּי在此引出所宣告的内容。汉语用冒号比直译“说”或“就是”更自然，同时清楚保留内容从句的功能。
- source_word: יָשָׁר
  choice: 正直
  rationale: 此词描述耶和华品格端正、全然公义；“正直”既保留希伯来语“直”的意象，也不把含义限缩为司法意义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而非用头衔替代。
- source_word: צוּרִי
  choice: 我的磐石
  rationale: 保留诗篇中上帝如坚固岩石的具体比喻及其可靠、庇护的含义，不改写成抽象的“避难所”。
- source_word: וְלֹא עַוְלָתָה בּוֹ
  choice: 他里面毫无不义
  rationale: 自然呈现希伯来语无动词否定句；“不义”涵盖道德上的邪曲和司法上的不公，并与“正直”形成鲜明对应。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的四字神名，正文保留为专名而不以“主”替代；“耶和华”是现代标准中文中最广为人知且庄重的传统音译。
- issue: עַוְלָתָה所表达的道德与司法范围
  choice: 不义
  alternative: 不公
  rationale: “不义”与“正直”相对，较完整地保留道德邪曲与不公正的双重可能；脚注列出“没有不公”以显明司法侧重，不把经文限定为单一范畴。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以分号保留两个宣告之间的诗性并列；保留“磐石”的具象隐喻。脚注标记置于相关分句之后。
