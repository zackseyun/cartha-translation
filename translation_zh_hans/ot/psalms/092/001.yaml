  text: ט֗וֹב לְ/הֹד֥וֹת לַ/יהוָ֑ה וּ/לְ/זַמֵּ֖ר לְ/שִׁמְ/ךָ֣ עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/001.yaml
  text: It is good to give thanks to Yahweh[a], and to sing praise to your name, O Most High,
translation:
  language: zh_hans
  text: 至高者啊，称谢雅威[a]、歌颂你的名，实为美好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为יהוה（YHWH），是上帝的专名；这里按通常推定的读音译作“雅威”。
    reason: 说明神名原文及音译依据。
lexical_decisions:
- source_word: טוֹב
  choice: 这是美好的
  rationale: 这是对后面两个不定式行为的总体评价。译为“这是美好的”保留“好、美善、合宜”的宽广含义，不限缩为“令人愉快”或“理所当然”。
- source_word: לְהֹדוֹת
  choice: 称谢
  rationale: ידה的使役词干在诗歌敬拜语境中指称谢、赞美；此处用“称谢”可与下一分句的音乐性“歌颂”有所区分。
- source_word: לַיהוָה
  choice: 雅威[a]
  rationale: 希伯来文本直接使用四字神名יהוה；“雅威”以现代汉语音译保留其作为专名的性质。
- source_word: וּלְזַמֵּר
  choice: 歌颂
  rationale: זמר的加强词干表示以歌唱或音乐赞美。“歌颂”自然凝练，又不额外限定是否使用乐器。
- source_word: לְשִׁמְךָ
  choice: 你的名
  rationale: 保留原文“名”的表达，因为它不只指称对象，也承载其身份与声誉的含义，不宜简化为“你”。
- source_word: עֶלְיוֹן
  choice: 至高者啊
  rationale: עֶלְיוֹן在这里是对上帝的称号；结合第二人称“你的”，按呼语译作“至高者啊”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用上帝的四字神名而非称号；音译“雅威”保留专名性质，也避免把神名转化为“主”这一称号。读音本身基于通行的学术重构，故加注说明。
- issue: טוֹב所评价的范围
  choice: 把“这是美好的”置于句末，总结“称谢”与“歌颂”两项行动
  alternative: 句首译作“称谢雅威是美好的”
  rationale: 希伯来语的טוֹב位于句首，并同时支配两个并列不定式。汉语句末总结更自然，也清楚表明评价涵盖两项敬拜行动，而不改变原意。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语言。“称谢”“歌颂”“至高者”保留诗篇语体，但避免古奥句式。句末“这是美好的”在自然汉语中统摄前面的两个并列动作。
