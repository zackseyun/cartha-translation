  text: וְ/אַתָּ֥ה מָר֗וֹם לְ/עֹלָ֥ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/008.yaml
  text: But you are on high forever[a], O Yahweh.
translation:
  language: zh_hans
  text: 但你永远在至高之处，耶和华啊！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在至高之处”或译“至高无上”。
    reason: 原文מָרוֹם既可表达高处，也可表达崇高的地位或状态。
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 但你
  rationale: 连词与独立代词在上下文中形成对比：恶人必灭亡，但耶和华永远居于至高；因此译作“但你”。
- source_word: מָרוֹם
  choice: 在至高之处
  rationale: 该词可指高处或崇高的状态。译作“在至高之处”保留其空间性隐喻，也不把它直接处理为神的称号。
- source_word: לְ/עֹלָם
  choice: 永远
  rationale: 简明自然地表达持续无尽的时间意义。
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 采用现代中文圣经读者熟悉的专名形式“耶和华”，并以“啊”自然表达直接呼告。
theological_decisions:
- issue: מָרוֹם表达位置还是崇高状态
  choice: 在至高之处
  alternative: 至高无上
  rationale: 希伯来语名词本身容许空间与地位两层意涵；正文保留“高处”的空间隐喻，脚注列出状态性译法，避免排除原文的张力。
- issue: 直接呼告中的神名יְהוָה
  choice: 耶和华啊
  alternative: 雅威啊；上主啊
  rationale: 原文使用四字神名而非称号；“耶和华”是现代中文读者最熟悉的专名形式，“啊”则明确其呼告语气。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；保留诗句中“恶人灭亡”与“耶和华永远至高”的鲜明对照。
