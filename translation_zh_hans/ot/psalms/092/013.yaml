  text: שְׁ֭תוּלִים בְּ/בֵ֣ית יְהוָ֑ה בְּ/חַצְר֖וֹת אֱלֹהֵ֣י/נוּ יַפְרִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/013.yaml
  text: Planted in the house of Yahweh[b][a], they will flourish in the courts of our God.
translation:
  language: zh_hans
  text: 他们被栽种在雅威[a]的殿中；在我们上帝的庭院[b]里，他们必繁茂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为神名“YHWH”，这里音译作“雅威”。
    reason: alternative_reading
  - marker: b
    text: 或译“院落”。这里指圣殿的各院。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתוּלִים
  choice: 栽种
  rationale: 这是被动分词，意为“被栽种、被安置”。中文用“栽种”自然保留植物意象，不额外加入“牢牢”等原文未明说的强调。
- source_word: בְּבֵית
  choice: 在……的殿中
  rationale: בַּיִת本义为“房屋、家”，用于雅威时在本诗语境中指圣殿；译作“殿”既符合现代汉语习惯，也与下句“院宇”形成清楚的平行。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名YHWH，而不以“主”这一称号替代。
- source_word: בְּחַצְרוֹת
  choice: 在……的院宇里
  rationale: חָצֵר在这里指圣殿的院子或庭院。“院宇”庄重而易懂，并保留复数所表达的圣殿各院之意。
- source_word: אֱלֹהֵינוּ
  choice: 我们上帝的
  rationale: 准确表达名词与第一人称复数后缀，采用现代标准汉语的自然说法。
- source_word: יַפְרִיחוּ
  choice: 必繁茂
  rationale: פרח的使役词干在此可表示萌芽、开花或茂盛。结合义人如树木的诗歌意象，“繁茂”兼顾生长旺盛之意和自然汉语表达；“必”表达未完成式在语境中的将来或确定性。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，避免用称号“主”取代；“耶和华”虽是汉语传统形式，但与当前较通行的学术拟音相比准确性较低。
- issue: 分词שְׁתוּלִים所指对象
  choice: 以“他们”承接上文所说的义人
  alternative: 不补出主语，译成悬置的“被栽种在……”
  rationale: 本节希伯来语的阳性复数分词承接上一节的义人，后面的复数动词也以他们为主语。中文补出“他们”使句法自然，但不进一步解释他们如何或由谁栽种。
translation_notes:
  register: 采用现代、庄重而通顺的诗歌体汉语。句子保留原文“栽种—繁茂”的植物意象，以及“雅威的殿—我们上帝的院宇”的平行结构；不将“栽种”扩展为原文未明说的属灵解释。
