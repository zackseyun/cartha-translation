  yaml_path: translation/ot/psalms/092/003.yaml
  text: On the ten-stringed instrument and on the harp[b][a], with melody on the lyre.
translation:
  language: zh_hans
  text: 用十弦乐器和瑟[a]，用琴[a]奏出深沉的乐声[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瑟”和“琴”所指的古代弦乐器，确切形制不能确定。“瑟”也可译作“竖琴”或“琉特琴”；“琴”有时也译作“竖琴”。这些名称并非指中国传统乐器。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在琴上作默想式的演奏。”希伯来语“深沉的乐声”（הִגָּיוֹן）可指默想、低声吟咏或回响的乐声；在此音乐语境中，后者较为相宜，但原词的歧义仍予保留。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵי
  choice: 用／伴着
  rationale: עַל的诗歌形式在此表示乐器伴奏或演奏方式。中文按不同搭配分别译为“用”和“伴着”，使表达自然，同时保留三重乐器结构。
- source_word: עָשׂוֹר
  choice: 十弦乐器
  rationale: 此处指一种有十根弦的乐器；译名不进一步指定形制，以免超出希伯来文所能确定的范围。
- source_word: וַעֲלֵי
  choice: 伴着
  rationale: 保留连接词所表达的并列关系，并用现代汉语自然呈现第二件伴奏乐器。
- source_word: נָבֶל
  choice: 瑟
  rationale: 指古代弦乐器，确切形制不明。“瑟”是中文圣经语境中较自然、庄重的对应词，但不主张它等同于中国古代的瑟，因此以脚注说明不确定性。
- source_word: הִגָּיוֹן
  choice: 沉吟
  rationale: 该词可指默想、低声吟咏，也可指回响的乐声。“沉吟”保留思索与发声两方面的语义张力，且在器乐语境中可理解为深沉回荡的乐声。
- source_word: בְּכִנּוֹר
  choice: 随琴声
  rationale: בְּ可表示伴随或借助；כִּנּוֹר为弦乐器。“随琴声”既符合中文乐句，也不把它与נָבֶל混为同一种乐器。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可诵读的诗歌语言。“用……伴着……随……”自然呈现原文连续列举乐器的结构；“沉吟”刻意保留הִגָּיוֹן在默想与乐声之间的歧义。所有脚注标记均置于正文相应词语之后。
