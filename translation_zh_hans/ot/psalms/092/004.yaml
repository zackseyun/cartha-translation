  text: כִּ֤י שִׂמַּחְתַּ֣/נִי יְהוָ֣ה בְּ/פָעֳלֶ֑/ךָ בְּֽ/מַעֲשֵׂ֖י יָדֶ֣י/ךָ אֲרַנֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/004.yaml
  text: For you have made me glad[a], O Yahweh, by your work[b]; at the works of your hands I sing for joy.
translation:
  language: zh_hans
  text: 雅威啊，你借着你的作为使我欢喜；我因你手所做的工欢唱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要欢呼。”希伯来语动词可指喜乐地歌唱，也可指发出响亮的欢呼声。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因
  rationale: 在上下文中引出诗人赞美的缘由；汉语用“因”既保留因果关系，也符合诗歌语体。
- source_word: שִׂמַּחְתַּנִי
  choice: 使我欢喜
  rationale: שׂמח 的 Piel 完成式带第一人称单数宾语后缀，表示“你使我欢喜”；此译法直接保留使役意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，避免用称号替代专名。
- source_word: בְּפָעֳלֶךָ
  choice: 因你的作为
  rationale: פֹּעַל 指工作、行动或成就；介词 ב 在此表示原因或缘由。“作为”能涵盖神所做之事，并保持与下半句的呼应。
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: 因你手所做的一切
  rationale: 保留“手所做的”这一具体的希伯来语意象；“一切”自然表达复数构造 מַעֲשֵׂי，同时不限定这些作为的具体范围。
- source_word: אֲרַנֵּן
  choice: 我要欢唱
  rationale: רנן 的 Piel 可指喜乐地歌唱，也可指发出响亮的欢呼；诗篇赞美语境中“欢唱”自然贴切。未完成式在此可表达由前述缘由引出的意愿或随之而来的行动，故译“我要”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非称号；“雅威”较直接地音译通常重建的读音，并保留专名性质。
- issue: רנן 所表达的赞美形式
  choice: 欢唱
  alternative: 欢呼
  rationale: 该词兼有喜乐歌唱与高声欢呼的语义范围；正文依诗篇歌唱语境采用“欢唱”，脚注保留另一可能，避免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两行以“因”形成平行结构，并保留“你手所做的”这一原文意象；感叹号呈现直接称呼和喜乐赞美的语气。
