  yaml_path: translation/ot/psalms/092/011.yaml
  text: My eye has looked on my foes[b][a]; my ears hear of the evildoers who rise against me.
translation:
  language: zh_hans
  text: 我的眼看见我的仇敌[a]；我的耳听见那些起来反对我的恶人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些窥伺我的人”；原文此词较直译可指怀有敌意、监视我的人。
    reason: lexical_alternative
  - marker: b
    text: “听见”也可译作“已经听见”或“将要听见”；这里的希伯来语动词形式容许不同的时体理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט עֵינִי
  choice: 我亲眼看见
  rationale: 直译近于“我的眼观看”。中文以“我亲眼看见”自然保留视觉感和诗句的亲历意味；וַתַּבֵּט 在这里可表达已经发生并与当前处境相关的观看。
- source_word: בְּשׁוּרָי
  choice: 我的仇敌
  rationale: שׁוּר 的相关名词可指窥伺、注视之人；本节的敌对语境支持“仇敌”，但“窥伺我的人”仍是真实可能，故列入脚注。
- source_word: בַּקָּמִים עָלַי
  choice: 那些起来攻击我的
  rationale: קום 加 עַל 表示起来敌对某人。“起来攻击”既保留“起来”的意象，也使现代中文读者清楚其敌对含义。
- source_word: מְרֵעִים
  choice: 恶人
  rationale: 该使役分词指作恶或加害的人。“恶人”简洁自然，并保留道德与伤害两方面的语境。
- source_word: תִּשְׁמַעְנָה אָזְנָי
  choice: 我亲耳听见
  rationale: 原文直译为“我的双耳听见”，动词形式可按语境理解为现在、完成或将来。中文采用“我亲耳听见”，与“我亲眼看见”形成自然的诗歌对偶，同时不在正文中生硬标示时态。
