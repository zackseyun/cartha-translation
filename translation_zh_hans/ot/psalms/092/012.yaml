  text: צַ֭דִּיק כַּ/תָּמָ֣ר יִפְרָ֑ח כְּ/אֶ֖רֶז בַּ/לְּבָנ֣וֹן יִשְׂגֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/012.yaml
  text: The righteous flourishes like the palm tree[b][a]; he grows like a cedar in Lebanon.
translation:
  language: zh_hans
  text: 义人要像棕榈树一样繁茂，像黎巴嫩的香柏树一样茁壮成长。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “茁壮成长”也可译作“长得高大”“增长”或“兴旺”；原文动词表示旺盛生长或变得强盛。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: 义人
  rationale: 阳性单数形容词作名词用；“义人”是自然、庄重的现代汉语表达，也可保留其代表性单数的作用。
- source_word: כַּתָּמָר
  choice: 像棕榈树一样
  rationale: 比较前缀כ与תמר构成树木比喻；“棕榈树”通俗自然，不必进一步限定为海枣树。
- source_word: יִפְרָח
  choice: 繁茂
  rationale: פרח本指发芽、开花，也可引申为兴旺繁盛；在树木意象中，“繁茂”兼顾生长画面和比喻含义。
- source_word: כְּאֶרֶז
  choice: 像……香柏树一样
  rationale: אֶרֶז指香柏树；此处为第二个平行的树木比喻。
- source_word: בַּלְּבָנוֹן
  choice: 黎巴嫩的
  rationale: 希伯来语字面可作“在黎巴嫩”；中文“黎巴嫩的香柏树”更自然，并表达其生长地域，未改变核心意象。
- source_word: יִשְׂגֶּה
  choice: 茁壮成长
  rationale: 该动词表示增长、壮大或长得高大；“茁壮成长”在香柏树意象中传达旺盛而强健的生长，同时避免把“高”这一语义限定写死。
theological_decisions: []
