  text: כִּ֤י הִנֵּ֪ה אֹיְבֶ֡י/ךָ יְֽהוָ֗ה כִּֽי הִנֵּ֣ה אֹיְבֶ֣י/ךָ יֹאבֵ֑דוּ יִ֝תְפָּרְד֗וּ כָּל פֹּ֥עֲלֵי אָֽוֶן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/009.yaml
  text: For behold[a], your enemies, O Yahweh— for behold, your enemies will perish; all workers of wickedness will be scattered.
translation:
  language: zh_hans
  text: '因为，看哪，雅威啊，你的仇敌——

    因为，看哪，你的仇敌必灭亡；

    一切作恶的人[a]都必四散。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作恶的人”直译为“作恶之人”或“作恶者”；末句也可译为“一切作恶的人都必离散”。
    reason: 说明希伯来语 פֹּעֲלֵי אָוֶן 的字面结构，并保留 יִתְפָּרְדוּ“离散、分开”的词义替代。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，保留解释性的连接作用；在重复句中也兼有加强语气的效果。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留希伯来语引人注意并加强断言的功能，也符合诗歌庄重的语体。
- source_word: אֹיְבֶיךָ
  choice: 你的仇敌
  rationale: 准确表达复数名词及第二人称阳性单数所属后缀。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，区别于作为称号的“主”。
- source_word: כִּי הִנֵּה ... כִּי הִנֵּה
  choice: 因为，看哪……因为，看哪
  rationale: 保留原文刻意的完整重复，以传达诗句的强调、节奏和确定性。
- source_word: יֹאבֵדוּ
  choice: 必灭亡
  rationale: 表达 אבד 所指的灭亡结局，又不额外说明其具体方式；“必”体现诗句的确定语气。
- source_word: יִתְפָּרְדוּ
  choice: 都必四散
  rationale: 该词的 Hitpael 形式表示分开、离散；“四散”自然地表达群体瓦解，并与前句形成诗意平行。
- source_word: כָּל
  choice: 一切
  rationale: 保留原文全面涵盖的范围。
- source_word: פֹּעֲלֵי אָוֶן
  choice: 作恶的人
  rationale: 用自然现代汉语表达字面为“行作邪恶者”的短语，保留其道德含义而避免生硬。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按通常重构的读音音译，既保留专名性质，也不将其改成称号“主”。
- issue: 恶人的结局是“灭亡”还是明确的被动毁灭
  choice: 必灭亡
  alternative: 必被毁灭
  rationale: 希伯来语 יֹאבֵדוּ 表明他们灭亡，却未明确说明施事或毁灭方式，因此不补入原文未明说的被动施事关系。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。保留两次“因为，看哪”和两次“你的仇敌”，不压缩原文显著的诗歌重复；用换行呈现平行结构。
