  text: They still bear fruit in old age[c][b][a]; they are full of sap and green.
translation:
  language: zh_hans
  text: 他们年老时仍然结果子[a]，汁液丰盈，青翠茂盛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语两个动词也可理解为将来时：“他们年老时仍要结果子；他们必会汁液丰盈、青翠茂盛。”
    reason: alternative_reading
  - marker: b
    text: “汁液丰盈，青翠茂盛”直译可作“肥润而青翠”。这里以植物的肥润描写旺盛的生命力。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: 仍然
  rationale: 表示状态或行动持续；承接上文树木栽种、茂盛的意象，说明到了老年仍保持生命力。
- source_word: יְנוּבוּן
  choice: 结果子
  rationale: 该词指植物结出产物；结合上下文的棕树和香柏树意象，译作“结果子”最为准确自然。
- source_word: בְּשֵׂיבָה
  choice: 年老时
  rationale: 原词字面与白发有关，惯用义为老年；“年老时”以现代汉语自然表达其时间意义。
- source_word: דְּשֵׁנִים
  choice: 汁液丰盈
  rationale: 原词本义为肥厚、丰润；用于植物意象时描写养分充足、生命旺盛。“汁液丰盈”保留树木意象，也避免“肥胖”在现代汉语中的误导。
- source_word: רַעֲנַנִּים
  choice: 青翠茂盛
  rationale: 该词描写植物鲜绿、繁茂的状态；此译兼顾颜色与旺盛生命力。
- source_word: יִהְיוּ
  choice: （由汉语状态短语表达）
  rationale: 希伯来语明用“他们要/会是”；汉语在“汁液丰盈，青翠茂盛”中省略系词更自然，同时保留一般性或延续性的陈述。
theological_decisions:
- issue: 诗歌中未完成式的时体
  choice: 正文采用不标明绝对时态的汉语一般陈述“仍然结果子……”，可自然表达持续、惯常的光景
  alternative: 明确译为将来：“仍要结果子……必会……”
  rationale: 两个希伯来语未完成式既可作一般性、持续性的描述，也可具有将来意味。汉语正文不强加单一时态，并以脚注提示将来解读，从而保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式简洁，保留上文树木的整体意象；“汁液丰盈”将原文“肥润”的植物性含义自然化，“青翠茂盛”表达鲜绿繁盛，避免生硬或容易误解的字面措辞。
