lexical_decisions:
- source_word: אִישׁ
  choice: 人
  rationale: 原文为阳性单数名词，但在此泛指具有这种特征的人；现代汉语用“人”自然，并不抹去原句的代表性用法。
- source_word: בַּעַר
  choice: 愚顽的
  rationale: 该词描写人在悟性上迟钝、近乎牲畜般无知；“愚顽”兼具认知与品格色彩，也符合诗篇的庄重语体。脚注保留其兽性比喻的力度。
- source_word: יֵדָע
  choice: 不知道
  rationale: 直接表达缺乏认识或觉察，并与下句“不明白”形成平行而略有区别。
- source_word: כְסִיל
  choice: 愚昧的人
  rationale: 这是智慧文学中兼有道德与认知含义的常用词；“愚昧的人”自然、庄重，并保留其智慧传统色彩。
- source_word: יָבִין
  choice: 不明白
  rationale: 该动词强调理解、辨明；“不明白”清楚自然，与“不知道”保持诗歌平行。
- source_word: אֶת זֹאת
  choice: 这事
  rationale: 指向上下文所说的事；译作“这事”比单独的“这”更符合现代汉语，冒号则表明下文将继续说明。
