  to: '当恶人如草发芽，

    一切作恶的人都兴旺时，

    这是为了使他们永远被毁灭。[a]'
  rationale: 修订以“当……时”明确原文的时间情境，并将“滋生”改为“发芽”，更贴合草木萌发的词义和诗歌意象。“这是为了使他们永远被毁灭”保留 לְהִשָּׁמְדָם 的目的／结果张力及被动意义，不添加上帝或其他施事者。原脚注 a 实际上说明的是正文“兴旺”的词汇替代，且与英文审计轨迹中的脚注顺序不一致；为避免不必要的重复并使锚点直接服务于有争议的目的／结果结构，改为单一脚注。
