  text: בִּ/פְרֹ֤חַ רְשָׁעִ֨ים כְּמ֥וֹ עֵ֗שֶׂב וַ֭/יָּצִיצוּ כָּל פֹּ֣עֲלֵי אָ֑וֶן לְ/הִשָּֽׁמְדָ֥/ם עֲדֵי עַֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/007.yaml
  text: When the wicked sprout like grass and all workers of wickedness flourish[b][a], it is so that they may be destroyed forever.
translation:
  language: zh_hans
  text: '当恶人如草发芽，

    一切作恶的人都兴旺时，

    这是为了使他们永远被毁灭。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“结果他们永远被毁灭”或“他们只为永远被毁灭”。这里的希伯来文可表示目的或结果。
    reason: alternative_reading
lexical_decisions:
- source_word: בִּפְרֹחַ
  choice: 滋生
  rationale: בְּ加不定式结构在这里引出时间情境；“滋生”既能自然表达“长出、繁生”，也延续下文“如草”的植物意象。整句用汉语零连接方式表达“当……时”，避免生硬直译。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 该词是用作名词的复数形容词，指邪恶之人；“恶人”简洁、庄重，并保留群体性的泛指。
- source_word: כְּמוֹ עֵשֶׂב
  choice: 如草
  rationale: עֵשֶׂב通常指草或草本植物；“如草”自然地保留迅速生长却并不长久的诗歌意象。
- source_word: וַיָּצִיצוּ
  choice: 茂盛起来
  rationale: צוץ可指发芽、开花或显得繁茂；这里与前半句的草木意象平行，“茂盛起来”兼顾意象与现代汉语的自然表达。
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: 一切作恶的人
  rationale: 原文直指“所有行作 אָוֶן 的人”；אָוֶן在此具有邪恶、不义的道德含义。“一切作恶的人”比“罪孽的工人”更自然，同时保留行为者的意义。
- source_word: לְהִשָּׁמְדָם
  choice: 为要……被毁灭
  rationale: 这是带第三人称阳性复数后缀的尼法勒不定式结构，可表达目的或结果，且有被动意义。“为要……被毁灭”保留其目的／结果指向，不补出原文未明说的施事者。
- source_word: עֲדֵי עַד
  choice: 永远
  rationale: 该固定表达表示持续无尽；“永远”是清楚、现代且庄重的对应语。
theological_decisions:
- issue: 恶人兴旺与最终受审判之间是单纯的先后观察，还是带有目的／结果关系
  choice: 将 לְהִשָּׁמְדָם 译为“为要永远被毁灭”
  alternative: “终必永远被毁灭”或“不过是走向永远的毁灭”
  rationale: 希伯来文的 לְ结构把恶人的茂盛与其最终毁灭紧密相连，可理解为目的或结果。正文保留这种指向性及其中的神学张力，但不添加原文没有明说的神为施事者；脚注列出偏结果性的译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，并分行呈现平行结构。“滋生—茂盛”保留贯穿本节的植物意象；“为要”略带经文语体色彩，用来简洁承载原文目的／结果关系。所有脚注标记均已置于正文相应位置。
