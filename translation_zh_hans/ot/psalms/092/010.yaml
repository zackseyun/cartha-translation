  text: וַ/תָּ֣רֶם כִּ/רְאֵ֣ים קַרְנִ֑/י בַּ֝לֹּתִ֗י בְּ/שֶׁ֣מֶן רַעֲנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/010.yaml
  text: But you have exalted my horn like that of a wild ox[b][a]; I have been anointed with fresh oil.
translation:
  language: zh_hans
  text: 但你使我的角高举，如野牛的角[a]；我受新油膏抹[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 רְאֵם 指一种强壮的野生牛科动物，传统上常译作“野牛”；较早的译本有时译作“独角兽”。
    reason: cultural_note
  - marker: b
    text: 或较直译为“我被新鲜的油润湿”或“我与新鲜的油调和”。这里的希伯来语动词用法罕见，确切含义存在争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרֶם
  choice: 但你使……高举
  rationale: 该词源于 רום，表示升高、高举；按上下文，第二人称阳性单数所指为上帝。“高举”既保留动作，也符合诗歌语体。
- source_word: קַרְנִי
  choice: 我的角
  rationale: קֶרֶן 本义为“角”，在诗歌中常象征力量、尊荣或权势。正文保留原有意象，不直接释作“力量”。
- source_word: כִּרְאֵים
  choice: 如野牛的角
  rationale: רְאֵם 指强壮的野生牛科动物；译作“野牛”比传统的“独角兽”更符合词义和古代动物背景。补出“的角”，使汉语比较关系清楚。
- source_word: בַּלֹּתִי
  choice: 我被……膏抹
  rationale: 该动词在此处用法罕见，基本语义可能涉及调和、润湿；与油连用时，传统上可理解为用油膏抹。正文采用自然且符合语境的表达，同时以脚注保留词义上的不确定性。
- source_word: בְּשֶׁמֶן
  choice: 用……油
  rationale: 介词 בְּ 在此表示媒介或工具；汉语以“被……油膏抹”自然呈现。
- source_word: רַעֲנָן
  choice: 新鲜的
  rationale: רַעֲנָן 可表达青翠、鲜润、旺盛；修饰油时，“新鲜的”自然地传达新润和充满生机之感。
theological_decisions:
- issue: “角”的隐喻
  choice: 保留“我的角”
  alternative: 译作“我的力量”或“我的权势”
  rationale: 原文以角象征力量、尊荣和得胜；保留这一具体意象，可保存诗篇的文学张力，不把隐喻提前解释掉。
- issue: בַּלֹּתִי 与油相连时的含义
  choice: 正文译作“我被新鲜的油膏抹”
  alternative: “我被新鲜的油润泽”或“我与新鲜的油调和”
  rationale: “膏抹”符合油的语境和该句所表达的尊荣、更新，但该希伯来动词罕见，准确语气仍有争议，因此不把其他可能性从脚注中删去。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“但你”承接上下文的转折；“使我的角高举”保留希伯来诗歌的力量意象。分号对应两个紧密相关而语法独立的分句。
