  text: מַה גָּדְל֣וּ מַעֲשֶׂ֣י/ךָ יְהוָ֑ה מְ֝אֹ֗ד עָמְק֥וּ מַחְשְׁבֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/005.yaml
  text: How great are your works[a], O Yahweh; your thoughts are very deep.
translation:
  language: zh_hans
  text: 耶和华啊，你的作为何其伟大！你的意念[a]极其深奥！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“谋划”或“旨意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה גָּדְלוּ
  choice: 何其伟大
  rationale: מַה在这里引出赞叹而非疑问；גָּדְלוּ在诗句中作状态性表达。“何其伟大”以自然庄重的现代汉语传达强烈赞叹。
- source_word: מַעֲשֶׂיךָ
  choice: 你的作为
  rationale: מַעֲשֶׂה可指所做之事或工作。“作为”范围较广，既可涵盖创造，也可涵盖施行于历史和护理中的行动。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是以色列上帝的专名四字神名；采用现代简体中文圣经语境中通行且易于普通读者识别的音译“耶和华”，不以称号替代专名。
- source_word: מְאֹד
  choice: 极其
  rationale: מְאֹד加强后面的状态。“极其”简洁地保留高度强化语气，并与诗歌体相称。
- source_word: עָמְקוּ
  choice: 深奥
  rationale: עמק在这里是状态性的“深”；与“意念”搭配时，“深奥”比单说“深”更符合现代汉语，同时表达其深不可测而不作进一步解释。
- source_word: מַחְשְׁבֹתֶיךָ
  choice: 你的意念
  rationale: מַחְשָׁבָה可指思想、谋划或旨意。“意念”保留其语义宽度，既容纳思想，也不排除计划与目的。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应保留为专名而非替换成“主”。“耶和华”是现代中文读者最熟悉的传统音译；“雅威”更接近学界常见的拟音，但在普通中文圣经语境中辨识度较低。
- issue: מַחְשְׁבֹתֶיךָ所表达的是思想还是计划
  choice: 意念
  alternative: 谋划／旨意
  rationale: 该词在此可涵盖上帝的思想、计划和目的。正文用较宽泛的“意念”，不将诗句限定为单一神学含义，并以脚注交代其他可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。两个感叹句对应希伯来诗句的赞叹语气；“何其”保留诗歌色彩，但仍为普通读者所能理解。正文中的脚注标记[a]与脚注一致。
