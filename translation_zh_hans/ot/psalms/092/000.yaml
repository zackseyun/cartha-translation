  yaml_path: translation/ot/psalms/092/000.yaml
  text: A psalm[a], a song for the Sabbath day.
translation:
  language: zh_hans
  text: 一篇诗篇，一首安息日之歌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一篇诗篇，一首为安息日而作的歌。”
    reason: “安息日之”可表达与安息日的广义关联；介词 לְ 也可按用途或目的理解为“为安息日而作／供安息日使用”。
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗篇
  rationale: 这是诗篇标题中的常用术语，通常带有配乐或吟唱的关联；译作“诗篇”既符合中文圣经语体，也保留其体裁名称。
- source_word: שִׁיר
  choice: 歌
  rationale: 此词通常指“歌”；与“诗篇”分别译出，以保留原文两个并列体裁词，而不将其合并。
- source_word: לְיוֹם
  choice: 安息日之
  rationale: 介词 לְ 与“日”连用，在此表示用途或关联。中文标题用“安息日之歌”自然地表达“供安息日使用／与安息日相关”，但原文也可较直译为“为安息日”。
- source_word: הַשַּׁבָּת
  choice: 安息日
  rationale: 特指以色列的安息日；“安息日”是现代中文中准确且通行的对应词。
theological_decisions:
- issue: 本节是标题还是诗歌正文首行
  choice: 按标题处理：“安息日之歌，一篇诗篇。”
  alternative: 不采用标题格式，将其视为正文第一行
  rationale: 希伯来文由无谓语的名词性成分构成，具有典型诗篇题注形式。按标题翻译能反映其文学功能，也避免补入原文没有的动词。
- issue: לְיוֹם הַשַּׁבָּת 所表达的具体关系
  choice: 用“安息日之歌”保留广义关联
  alternative: 明确译为“供安息日使用的歌”或“为安息日而作的歌”
  rationale: 介词 לְ 可表示用途、归属或关联；原文没有明确说明是礼仪使用、创作目的还是其他关系，因此不将其中一种解释写死。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语标题体。“安息日之歌”是汉语中流畅的题名形式；后接“一篇诗篇”以完整保留 מִזְמוֹר 与 שִׁיר 两个并列名词。脚注标记已置于正文。
