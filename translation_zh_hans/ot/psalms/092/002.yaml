  text: לְ/הַגִּ֣יד בַּ/בֹּ֣קֶר חַסְֽדֶּ֑/ךָ וֶ֝/אֱמֽוּנָתְ/ךָ֗ בַּ/לֵּילֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/002.yaml
  text: to declare your steadfast love in the morning[a], and your faithfulness in the nights,
translation:
  language: zh_hans
  text: 在早晨宣告你的慈爱，在夜晚[a]宣扬你的信实。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“在众夜晚”，即“夜夜”或“每逢夜晚”，可能表示反复不断的赞美。
    reason: 保留希伯来文复数形式及其可能具有的反复含义。
lexical_decisions:
- source_word: לְהַגִּיד
  choice: 宣告
  rationale: ל 加不定式承接上一节“称谢……是美好的”，表达所做之事；“宣告”保留公开述说、传扬的意味。
- source_word: בַּבֹּקֶר
  choice: 在早晨
  rationale: 介词 בְּ 与带定冠词的“早晨”构成时间短语，并与后半句的“夜晚”形成诗歌对照。
- source_word: חַסְדֶּךָ
  choice: 你的慈爱
  rationale: חֶסֶד 在此兼有恩慈、忠贞和持久之爱的内涵；“慈爱”是自然、庄重且为普通中文读者熟悉的表达，又不把盟约含义过度明说。
- source_word: וֶאֱמוּנָתְךָ
  choice: 你的信实
  rationale: אֱמוּנָה 在此指可靠、忠贞不变；“信实”准确表达这一属性，并与“慈爱”形成传统而自然的平行。
- source_word: בַּלֵּילוֹת
  choice: 在夜晚
  rationale: 原文为“夜晚”的复数，语境可能表达每夜反复的赞美。现代汉语通常不以复数标示这类时间名词，因此正文采用自然的“在夜晚”，并以脚注保留其复数及反复含义。
- source_word: לְהַגִּיד（后半句省略）
  choice: 宣扬
  rationale: 希伯来诗歌后半句承接前面的动词；中文补出“宣扬”，使句法清楚，同时用近义词避免生硬重复，不改变两项内容同属宣告对象的关系。
theological_decisions: []
