id: PSA.86.2
reference: Psalms 86:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שָֽׁמְרָ֣/ה נַפְשִׁ/י֮ כִּֽי חָסִ֪יד אָ֥נִי הוֹשַׁ֣ע עַ֭בְדְּ/ךָ אַתָּ֣ה אֱלֹהַ֑/י הַ/בּוֹטֵ֥חַ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/002.yaml
  text: Guard my life[a], for I am faithful; save your servant, my God[b], who trusts in you.
translation:
  language: zh_hans
  text: 求你保守我的性命[b]，因为我是忠信的人[a]；我的上帝啊，求你拯救倚靠你的仆人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信的人”或译“敬虔的人”“忠贞的人”。希伯来语强调在与上帝的关系中忠诚敬虔，并非声称自己毫无罪过。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“我的魂”；此处指“我的性命”或“我本人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרָה
  choice: 求你保守
  rationale: 这是向上帝发出的祈使请求；“保守”自然地表达看守、护卫并保存性命的含义。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ在此指诗人的生命或整个人，而非专指与身体相对的非物质“灵魂”；上下文是求上帝救护。
- source_word: כִּי
  choice: 因为
  rationale: 明确保留该词为前一请求引出理由的因果作用。
- source_word: חָסִיד
  choice: 忠信的人
  rationale: 该词描写在盟约关系中忠贞、敬虔的人；“忠信”既表达忠诚与虔敬，又不暗示毫无罪过。
- source_word: הוֹשַׁע
  choice: 求你拯救
  rationale: 准确表达祈使语气及从危难中施行救援的意义，并保留其较广的神学内涵。
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: 这是诗人在祷告中向上帝所用的谦卑关系称谓；此处重点并非社会身份上的奴隶。
- source_word: אֱלֹהַי
  choice: 我的上帝啊
  rationale: 按呼语处理，保留诗人对上帝直接而具个人关系的称呼。
- source_word: הַבּוֹטֵחַ אֵלֶיךָ
  choice: 倚靠你的
  rationale: 分词短语修饰“你的仆人”，表达持续信赖上帝；置于“仆人”之前符合现代汉语习惯。
theological_decisions:
- issue: 诗人以חָסִיד自称的含义
  choice: 诗人自称是在与上帝的关系中忠信、敬虔的人
  alternative: “我是圣洁的”或“我是完全无罪的”
  rationale: 原词强调忠贞与敬虔，不要求把诗人的话理解为宣称无罪或凭功德得救；译文保留了他诉诸关系上的忠信、同时仍恳求上帝拯救的张力。
- issue: אֱלֹהַי与末尾分词短语的句法关系
  choice: 将“我的上帝”作为呼语，将“倚靠你的”理解为修饰“你的仆人”
  alternative: 把“你是我的上帝”理解为独立陈述，或使“倚靠你的”修饰上帝
  rationale: 希伯来语允许紧凑的祷告式表达；此处理解最符合语义关系，也能在汉语中清楚表达诗人就是倚靠上帝的仆人。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你”保留恳求语气；后半句调整为“我的上帝啊，求你拯救倚靠你的仆人”，使希伯来语的呼语和分词修饰关系在现代汉语中清楚自然。
