  source_fidelity: “耶和华啊”准确保留了 יְהוָה 这一专名；“求你侧耳听”恰当传达祈使语气及“倾耳”的形象。“我的祷告”对应 תְּפִלָּתִי。后半句也保留了第二个听闻动词、בְּקוֹל 的“声音／呼声”意象，以及 תַּחֲנוּנוֹתַי 所含恳切求恩怜的含义。
