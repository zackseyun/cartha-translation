source:
  edition: WLC
  text: הַאֲזִ֣ינָ/ה יְ֭הוָה תְּפִלָּתִ֑/י וְ֝/הַקְשִׁ֗יבָ/ה בְּ/ק֣וֹל תַּחֲנוּנוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/006.yaml
  text: Give ear[a], O Yahweh, to my prayer, and listen to the voice of my pleas for mercy.
translation:
  language: zh_hans
  text: 耶和华啊，求你侧耳听我的祷告，留心听我恳求怜悯的呼声。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: 求你侧耳听
  rationale: 祈使式在祷告中表达恳切呼求；“侧耳听”保留了希伯来语“倾耳”的生动意象，也符合现代汉语祷告语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式音译四字神名，避免用称号替代原文中的专名。
- source_word: תְּפִלָּתִי
  choice: 我的祷告
  rationale: 直接表达名词“祷告”及第一人称单数所属后缀。
- source_word: וְהַקְשִׁיבָה
  choice: 留心听
  rationale: 该祈使式强调专注聆听；“留心听”既自然，又与前句“侧耳听”形成近义平行而不完全重复。
- source_word: בְּקוֹל
  choice: ……的声音
  rationale: 保留 קוֹל 的“声音”这一具体含义，而不是仅译作介词“听”。
- source_word: תַּחֲנוּנוֹתָי
  choice: 我恳求怜悯
  rationale: 该复数名词指为求恩惠、怜悯而发出的恳切祈求；中文以动宾性短语自然传达其语义力度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用以色列之神的专名。采用中文长期通行的“耶和华”，保留专名性质，不以“主”这一称号代替；“雅威”也是可据学术重构采用的音译。
- issue: תַּחֲנוּנוֹתָי 是否明确包含“怜悯”
  choice: 恳求怜悯
  alternative: 恳求；祈求
  rationale: 该词常指求恩惠、求怜悯的恳切请求；明译“怜悯”有助于传达词义，但不把它扩展为特定的悔罪教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留希伯来诗歌中“侧耳听／留心听”的平行结构，并保留“声音”这一感官性表达。
