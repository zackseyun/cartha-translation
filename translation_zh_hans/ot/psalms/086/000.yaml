base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/000.yaml
  text: A prayer of David. Incline your ear[a], Yahweh; answer me, for I am poor and needy.
translation:
  language: zh_hans
  text: '大卫的祷告。


    耶和华啊，求你侧耳听我，回应我！

    因为我困苦穷乏。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦”或译“贫穷”、“受苦”或“卑微”。希伯来语 עָנִי 可指处于贫困、患难或卑微境况中的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: 大卫的祷告
  rationale: 自然、简洁地保留诗篇标题的归属表达；לְ 可表示属于、出自或关于大卫，此处不额外限定其确切关系。
- source_word: הַטֵּה ... אָזְנְךָ
  choice: 求你侧耳听我
  rationale: 保留希伯来语“侧耳”的形象，同时补出汉语中自然的听取含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名的通行音译。
- source_word: עֲנֵנִי
  choice: 回应我
  rationale: 直接表达祈求上帝作出回应，不把含义缩窄为仅仅听见或口头回答。
- source_word: עָנִי וְאֶבְיוֹן
  choice: 困苦穷乏
  rationale: עָנִי 可指贫穷、受苦或卑微之人；“困苦”保留其处境性宽度，אֶבְיוֹן 译作“穷乏”以表达缺乏与贫困。
theological_decisions:
- issue: 诗人自称 עָנִי 的含义
  choice: 困苦
  alternative: 贫穷；受苦；卑微
  rationale: 不将其纯粹物质化或属灵化；正文采用涵盖受压和贫困处境的“困苦”，并用脚注保留其他真实可能。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 采用普通现代中文读者较熟悉的专名形式，并避免以称号“主”遮蔽原文专名。
translation_notes:
  register: 采用现代、庄重且便于诵读的诗歌语言。标题独立成行；正文保留“侧耳”的诗性意象。脚注标记已置于正文相应位置。
