source:
  edition: WLC
  text: כִּֽי חַ֭סְדְּ/ךָ גָּד֣וֹל עָלָ֑/י וְ/הִצַּ֥לְתָּ נַ֝פְשִׁ֗/י מִ/שְּׁא֥וֹל תַּחְתִּיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/013.yaml
  text: For your steadfast love toward me is great[a], and you have delivered my soul from the lowest Sheol.
translation:
  language: zh_hans
  text: '因为你向我所施的慈爱极其深厚；

    你从阴间的最深处[a]救出我的性命。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间的最深处”也可译为“最低的阴间”。“阴间”（希伯来语 Sheol）指死人所在的领域；也有人译为“坟墓”。
    reason: 说明שְׁאוֹל תַּחְתִּיָּה可指阴间/死亡领域的最低或最深之处，并保留“坟墓”这一较具体的替代译法，避免将其等同于后期教义概念。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人赞美和祈求的缘由；“因为”在现代汉语中自然保留其因果连接作用。
- source_word: חַסְדְּךָ
  choice: 你的慈爱
  rationale: חֶסֶד兼有仁慈、忠贞和持久眷爱的意味；“慈爱”是现代中文圣经语体中自然且宽广的表达，不将其限缩为单纯怜悯，也不过度加入明确的契约术语。
- source_word: גָּדוֹל עָלָי
  choice: 向我何其深厚
  rationale: 保留慈爱朝向诗人的关系义，并以“何其深厚”传达גָּדוֹל的强度，同时符合中文诗歌赞叹语气。
- source_word: וְהִצַּלְתָּ
  choice: 你救了……使……脱离
  rationale: נצל的使役形表示搭救、救拔；这一表达自然呈现已经完成的拯救行动。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ在此指诗人的生命或本人；死亡与阴间的语境中，“性命”比“灵魂”更自然，也避免把后来的身心二分观念强加给本节。
- source_word: מִשְּׁאוֹל
  choice: 脱离……阴间
  rationale: שְׁאוֹל指死人所在之处或死亡领域；“阴间”保留古代文本的意象，脚注则说明其含义，避免将它直接等同于坟墓或某一后期教义概念。
- source_word: תַּחְתִּיָּה
  choice: 极深的
  rationale: 该词表达最低、最下或极深之意；“极深的阴间”既保留向下达到极处的空间意象，也比生硬的“最低的阴间”更符合现代汉语。
theological_decisions:
- issue: 如何翻译שְׁאוֹל而不引入后期教义上的过度确定性
  choice: 阴间
  alternative: 死人之地；坟墓
  rationale: 本节描绘诗人从死亡领域最深之处被救拔。“阴间”可保留古代以色列文本的下沉和死亡意象，而脚注提供释义及其他可能译法，不把该词径直解释为后期神学中的特定终极归宿。
- issue: נַפְשִׁי是否译作“灵魂”
  choice: 我的性命
  alternative: 我的灵魂；我
  rationale: 在从阴间获救的语境中，此词主要关乎诗人的生命和整个人。“性命”保留生命受威胁的力度，同时避免把经文处理成关于可分离灵魂的技术性陈述。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。分为两行以呈现因由与拯救行动的结构；“何其深厚”保留赞叹语气，“性命”和脚注避免无意导入后期系统神学含义。
