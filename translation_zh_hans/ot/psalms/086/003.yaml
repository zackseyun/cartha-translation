  text: חָנֵּ֥/נִי אֲדֹנָ֑/י כִּ֥י אֵלֶ֥י/ךָ אֶ֝קְרָ֗א כָּל הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/003.yaml
  text: Be gracious to me[a], Lord, for I call to you all day long.
translation:
  language: zh_hans
  text: 主啊，求你恩待我[a]，因为我终日向你呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你怜悯我。”希伯来语动词既可表示恳求施恩、眷顾，也可表示恳求怜悯。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: 求你恩待我
  rationale: חנן的加强式祈使形带第一人称单数宾语后缀，表示恳求对方施恩、赐下恩惠。“求你恩待我”自然庄重，并保留恩典与眷顾的核心含义；“求你怜悯我”也是合乎语境的译法。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是祷告中对上帝所用的神圣称号。译作“主”符合现代中文圣经语体；加“啊”自然体现直接呼告，不把该形式机械地译成“我的主”。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前一祈求的理由，译作“因为”清楚保留因果关系。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词אֶל带第二人称阳性单数后缀，表示呼求所朝向的对象；与中文“呼求”搭配时，“向你”最自然。
- source_word: אֶקְרָא
  choice: 呼求
  rationale: קרא可指呼叫、呼喊；在祷告语境中，“呼求”既体现向上帝发声求告的含义，也不额外强化为极度哀号。未完成体在“终日”的修饰下表达持续或反复的行动。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 该短语直指“一整天”。“终日”简洁、庄重而易懂，能表达持续或一再呼求，并不泛化为不受时间限定的“不断地”。
theological_decisions:
- issue: 神圣称号אֲדֹנָי的译法
  choice: 主
  alternative: 我的主；主人
  rationale: 这里是诗人在祷告中对上帝的标准称呼。译作“主”保留主权称号及祷告语气；“我的主”可能过度展开该神圣称号的形态，“主人”在现代中文中也不适合此处的敬拜语境。
- issue: חָנֵּנִי所表达的祈求
  choice: 求你恩待我
  alternative: 求你怜悯我
  rationale: 原词既可强调施恩眷顾，也可在困苦祷告中体现怜悯。正文采用较贴近词根恩惠意义的“恩待”，脚注保留“怜悯”这一真实的语境性译法，不把两者的细微张力消除。
translation_notes:
  register: 采用现代、庄重而通顺的祷告语言。“主啊”体现直接呼告；“终日向你呼求”保留原文的语序重点和持续性。脚注标记[a]已置于对应词语之后。
