id: PSA.86.15
reference: Psalms 86:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֣ה אֲ֭דֹנָ/י אֵל רַח֣וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַ֝פַּ֗יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/015.yaml
  text: But you[a], Lord, are a compassionate and gracious God, slow to anger and abounding in steadfast love and faithfulness.
translation:
  language: zh_hans
  text: 但你，主啊，是有怜悯、有恩典的神；你不轻易发怒，并有丰盛的慈爱和信实[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“真实”。在这一圣约表述中，希伯来语原词常侧重信实、可靠，而不只是抽象意义上的真实。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 但你
  rationale: 连词与显明的第二人称代词在上下文中带出转折和强调；“但你”自然表达诗人从敌对者转向主之品格的对比。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对神的尊称和直接呼告；“主啊”既符合本节祷告语境，也避免误作普通的所属表达“我的主”。
- source_word: אֵל
  choice: 神
  rationale: 此处指明主就是神，并引出类似出埃及记34:6的信仰宣告；“神”准确而不过度增添“全能”等原文未明说的含义。
- source_word: רַחוּם וְ/חַנּוּן
  choice: 有怜悯、有恩典
  rationale: 分别保留深切怜悯与乐意施恩的两个相邻属性，措辞简明、庄重，也适合这一固定的圣约表述。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒
  rationale: 这是希伯来语习语，字面涉及“鼻孔长”，实际表示面对冒犯时迟缓发怒；现代汉语用“不轻易发怒”最自然准确。
- source_word: וְ/רַב חֶסֶד
  choice: 并有丰盛的慈爱
  rationale: רַב表示丰富、充盈；חֶסֶד在此包含持久的恩慈、忠贞和圣约之爱。“丰盛的慈爱”可读性好，并保留其关系性和圣约色彩。
- source_word: וֶ/אֱמֶת
  choice: 和信实
  rationale: אֱמֶת本可表示真实、真理；但与חֶסֶד并列出现在这一圣约公式中时，尤侧重可靠、忠诚，因此正文译作“信实”，同时以脚注保留“真实”的词义可能。
theological_decisions:
- issue: 如何呈现呼应出埃及记34:6的神圣约品格公式
  choice: 采用“有怜悯、有恩典……有丰盛的慈爱和信实”
  alternative: 采用较传统的“有怜悯有恩典……有丰盛的慈爱和诚实”，或将אֱמֶת直译为“真实”
  rationale: 译文保留这一基础性神圣自我启示的结构和神学回声，同时使用现代读者容易理解的表达。“信实”更清楚传达此处关系和圣约语境中的可靠与忠贞，但脚注保留“真实”这一可能译法，不消除原词的语义张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的祷告体。“主啊”保留直接呼告；分号划分神的身份属性与随后两项品格描述。正文避免古奥的“恒忍”或“诚实无伪”等措辞，也不加入宗派性解释。
