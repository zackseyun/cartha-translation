  text: אוֹדְ/ךָ֤ אֲדֹנָ֣/י אֱ֭לֹהַ/י בְּ/כָל לְבָבִ֑/י וַ/אֲכַבְּדָ֖ה שִׁמְ/ךָ֣ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/012.yaml
  text: I will praise you[a], Lord my God, with all my heart, and I will glorify your name forever.
translation:
  language: zh_hans
  text: 主啊，我的上帝，我要全心赞美你[a]；我要永远荣耀你的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“感谢你”；希伯来语动词在敬拜语境中既可表示感谢，也可表示赞美。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: 我要赞美你
  rationale: ידה的Hiphil形式可表达“感谢”或“赞美”。这里直接向上帝发言，并与“荣耀你的名”平行，因此“赞美”最贴合敬拜语境；未完成式按带有立志、宣告意味的将来表达。
- source_word: אֲדֹנָי אֱלֹהַי
  choice: 主我的上帝啊
  rationale: 保留两个称谓以及אֱלֹהַי中明确的第一人称单数所属后缀；句末语气词“啊”自然标明直接呼告，并未增添新的称号。
- source_word: בְּכָל לְבָבִי
  choice: 一心
  rationale: 希伯来语意为以全部的心、毫无保留地投入；“一心”是自然凝练的现代汉语表达，也传达专一和全心的意味。
- source_word: וַאֲכַבְּדָה
  choice: 我要荣耀
  rationale: כבד的Piel形式可指尊崇、使得荣耀；以“你的名”为宾语时，“荣耀”符合敬拜语境，并与前句“赞美”相呼应。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 直译保留希伯来语“名”的意象；这里可涵盖上帝显明的品格与声誉，不宜在正文中解释性改写。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 清楚表达持续不止、恒久的时间意义，符合诗人的敬拜宣告。
theological_decisions:
- issue: 如何处理双重神圣称谓אֲדֹנָי אֱלֹהַי
  choice: 主我的上帝啊
  alternative: 主啊，我的上帝
  rationale: 两种断句都可表达直接呼告。所选译法紧密保留原文连续的双重称谓和“我的”所属关系，同时用“啊”使现代汉语呼告自然，不额外引入解释。
- issue: אוֹדְךָ在敬拜语境中的语义
  choice: 赞美你
  alternative: 感谢你
  rationale: 原词本身容许“感谢”和“赞美”两义。与后半句“荣耀你的名”相配时，“赞美”更符合整体颂赞语境；但在脚注中保留“感谢”的真实词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌敬拜语言。“一心”比“用我的全心”更符合自然汉语；两个分句重复“我要”，保留原文宣告与立志的力度。
