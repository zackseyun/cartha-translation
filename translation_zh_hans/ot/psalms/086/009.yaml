id: PSA.86.9
reference: Psalms 86:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל גּוֹיִ֤ם אֲשֶׁ֥ר עָשִׂ֗יתָ יָב֤וֹאוּ וְ/יִשְׁתַּחֲו֣וּ לְ/פָנֶ֣י/ךָ אֲדֹנָ֑/י וִֽ/יכַבְּד֣וּ לִ/שְׁמֶֽ/ךָ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/009.yaml
  text: All the nations that you have made will come and bow down before you[a], Lord[b], and they will honor your name.
translation:
  language: zh_hans
  text: 主啊，你所造的万国都要来，在你面前下拜[a]，并尊崇你的名[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在你面前敬拜”；希伯来语动词可指怀着崇敬俯伏、下拜，也可由此表示敬拜。
    reason: lexical_alternative
  - marker: b
    text: 或译“使你的名得荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: 万国都
  rationale: כָּל涵盖全部范围，גּוֹיִם在本诗语境中泛指列国；“万国都”自然表达整体性的普世范围，又不把它限定为“外邦人”这一相对于以色列的称谓。
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: 你所造的
  rationale: 关系从句修饰“万国”。עָשִׂיתָ基本义为“做、造”；“所造的”简洁自然，并保留上帝造作万国之意，而不必强化为专门的创造术语。
- source_word: יָבֹאוּ
  choice: 要来
  rationale: 未完成式在这里表达诗人所期待的未来行动；“要来”符合现代汉语的庄重表达。
- source_word: וְיִשְׁתַּחֲווּ
  choice: 下拜
  rationale: 该词本义涉及俯伏、跪拜，兼有敬拜含义。“下拜”保留身体动作和崇敬意味，不直接消解为较概括的“敬拜”。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 准确而自然地表达“在你的面前／临在中”。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: אֲדֹנָי在这里是对上帝的尊称并带呼语功能；“主啊”既译出神圣称号，也自然呈现直接称呼。
- source_word: וִיכַבְּדוּ
  choice: 并尊崇
  rationale: כבד的皮勒词干可指尊重、尊荣或使之得荣耀。“尊崇”与“你的名”搭配自然，保留给予崇高尊荣的含义。
- source_word: לִשְׁמֶךָ
  choice: 你的名
  rationale: 按现代汉语习惯译为“尊崇你的名”，表达对上帝所显明的身份与声誉的尊荣，无须逐字保留介词。
theological_decisions:
- issue: 万国回应的范围
  choice: 保留“万国都”所表达的普世性未来图景
  alternative: 将其理解为泛指许多国家的诗歌性夸张
  rationale: 经文直接把上帝所造的万国都包括在将来前来下拜的范围内；译文不缩小这一范围，也不进一步规定其实现方式。
- issue: וְיִשְׁתַּחֲווּ的敬拜含义
  choice: 正文译作“下拜”，脚注说明也可译作“敬拜”
  alternative: 正文直接译作“敬拜”
  rationale: “下拜”保留希伯来词所描绘的俯伏动作及其崇敬含义，同时借脚注呈现由此延伸出的敬拜义，避免只保留抽象宗教含义。
- issue: אֲדֹנָי的译法
  choice: 主啊
  alternative: 我的主啊；主宰啊
  rationale: 该形式用于上帝时通常是尊称“主”，此处在诗歌呼语中加“啊”最自然；不机械译出词形中历时性的“我的”。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“主啊”前置，使中文呼语清楚自然；正文保持紧凑平行的节奏。脚注标记[a]置于“下拜”之后，[b]置于“你的名”之后，分别对应实际词义备选。
