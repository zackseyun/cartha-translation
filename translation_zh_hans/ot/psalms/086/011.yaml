  text: ה֘וֹרֵ֤/נִי יְהוָ֨ה דַּרְכֶּ֗/ךָ אֲהַלֵּ֥ךְ בַּ/אֲמִתֶּ֑/ךָ יַחֵ֥ד לְ֝בָבִ֗/י לְ/יִרְאָ֥ה שְׁמֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/011.yaml
  text: Teach me your way[a], O Yahweh, that I may walk in your truth[b]; unite my heart to fear your name.
translation:
  language: zh_hans
  text: 雅威啊，求你指教我你的道路，好让我行在你的真理中[a]；求你使我的心专一[b]，好敬畏你的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“行在你的信实中。”希伯来语所用的词既可表示“真理”，也可表示“信实、可靠”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使我的心合而为一。”希伯来语动词的意思是“使合一、使成为一”，表达内心不再分裂、不再心怀二意。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: 求你将……教导我
  rationale: 这是ירה的使役形命令式，带第一人称单数宾语后缀，意为“教导我、指教我”。加“求你”符合现代汉语祈祷语气，并保留命令式恳求的力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，而不以称号替代专名。
- source_word: דַּרְכֶּךָ
  choice: 你的道
  rationale: דֶּרֶךְ本指道路，也常比喻生活方式或上帝所指示的道路；“你的道”简洁、庄重，并保留单数形式及其比喻空间。
- source_word: אֲהַלֵּךְ
  choice: 使我行
  rationale: 未完成式承接前面的命令式，可表达目的或结果；“使我行”自然呈现诗人求受教导，以便按上帝之道生活的意思。
- source_word: בַּאֲמִתֶּךָ
  choice: 在你的真实中
  rationale: אֱמֶת可表示真实、真理、信实或可靠。正文采用较直接的“真实”，不把含义仅限于伦理真理或盟约信实；“信实”列入脚注。
- source_word: יַחֵד
  choice: 使……专一
  rationale: 这是יחד的加强形命令式，基本意思是“使合一、使成为一”。汉语“使我的心专一”自然表达不再心怀二意、忠诚不分裂的含义；较直译的表达保留于脚注。
- source_word: לְבָבִי
  choice: 我的心
  rationale: לֵבָב指人的内在，包括意志、思想和情感；“心”是准确而自然的汉语对应词。
- source_word: לְיִרְאָה
  choice: 好敬畏
  rationale: 带ל的动词不定式表示目的。“敬畏”保留了面对上帝时的畏惧、敬重与崇敬，没有弱化为单纯尊敬。
- source_word: שְׁמֶךָ
  choice: 你的名
  rationale: “名”可代表上帝自己及其声誉，且在敬拜语言中有重要意义，因此直接保留。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名；正文采用“雅威”这一较贴近学界通常重构读音的现代汉语音译，而不以“主”等称号替代。
- issue: בַּאֲמִתֶּךָ兼有“真实”与“信实”的语义
  choice: 在你的真实中
  alternative: 在你的信实中
  rationale: 上下文既可指按上帝的真理而行，也可指活在上帝的信实之中。正文与脚注共同保留这种真实的语义张力，不武断排除其中一种。
- issue: “使我的心专一”的内在忠诚含义
  choice: 使我的心专一
  alternative: 使我的心合而为一
  rationale: 原文请求上帝使诗人的内心成为一，不再被彼此冲突的忠诚所分裂。“专一”传达其语境含义，脚注则保留动词“合一”的具体意象。
- issue: 对上帝之名的יראה
  choice: 敬畏你的名
  alternative: 畏惧你的名
  rationale: 这里的יראה包含畏惧、敬重和崇敬。“敬畏”在现代汉语中能较完整地承载这种宗教语义，避免只表达恐惧或只表达尊敬。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语言。“你的道”“行在……中”“敬畏你的名”保留诗篇的核心意象；“使我的心专一”避免生硬直译，同时由脚注补明“使合一”的原文措辞。脚注标记均置于相应词语之后。
