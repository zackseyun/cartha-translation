  yaml_path: translation/ot/psalms/086/007.yaml
  text: In the day of my distress I call to you, because you answer me.
translation:
  language: zh_hans
  text: 在我遭难的时候，我呼求你，因为你应允我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: 我遭难的日子
  rationale: 直译为“我患难的日子”；“我遭难的日子”在现代汉语中自然凝练，并保留特定受困时刻的含义。
- source_word: אֶקְרָאֶךָּ
  choice: 呼求你
  rationale: קרא在向上帝发声求助的语境中不只是一般的“呼叫”，译作“呼求”更准确，也符合诗篇语体。
- source_word: כִּי
  choice: 因为
  rationale: 保留原文明确的因果连接；诗人因确信上帝回应而呼求，不改译为较弱的“因”。
- source_word: תַעֲנֵנִי
  choice: 你必应允我
  rationale: 未完成式在此表达信靠中的确定预期；“必应允”自然传达这种确信，同时保留行动指向未来或惯常回应的开放性。
theological_decisions:
- issue: 诗人是在陈述既成事实、惯常经验，还是表达将来的确信
  choice: 你必应允我
  alternative: 你应允我／你会回答我
  rationale: 希伯来语未完成式可涉及将来、惯常或语境性动作。这里的“必”传达诗人祷告中的确信，而不把句子限定为一次已经发生的回应；“应允”也比普通的“回答”更符合祷告语境。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式简洁，保留原文“困境—呼求—因上帝回应而确信”的逻辑；不添加原文没有的称谓或教义解释。
