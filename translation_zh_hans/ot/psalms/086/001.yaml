base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/001.yaml
  text: A prayer of David. Incline your ear[a], O Yahweh, and answer me, for I am poor and needy.
translation:
  language: zh_hans
  text: '大卫的祷告。


    雅威啊，求你侧耳听我，回应我，

    因为我困苦[a]穷乏。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦”也可译作“贫穷”或“卑微”。希伯来语 עָנִי 可指贫穷、受苦或地位卑微的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: 祷告
  rationale: 作为诗篇标题的体裁名称，译为“祷告”准确、自然。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: “大卫的”保留了标题中 לְ 所容许的归属、关联或作者含义，没有过度限定为“大卫所写”。
- source_word: הַטֵּה ... אָזְנְךָ
  choice: 侧耳听我
  rationale: 保留“使耳朵倾斜”的身体隐喻，同时符合现代汉语的祷告表达。原文中的“我”由后接的 עֲנֵנִי 补明，汉语合并表达更自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代。
- source_word: עֲנֵנִי
  choice: 回应我
  rationale: 准确表达祷告语境中的“回答”，又避免“应允”可能附带的必然照所求成就之意。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出祈求的理由。
- source_word: עָנִי
  choice: 困苦
  rationale: 该词可指贫穷、受苦或卑微之人；此处译为“困苦”，与下文“穷乏”搭配自然，并以脚注保留其他可能。
- source_word: וְאֶבְיוֹן
  choice: 穷乏
  rationale: 表达缺乏资源、处于需要中的状态，并保留与 עָנִי 构成的同义平行。
- source_word: אָנִי
  choice: 我
  rationale: 希伯来语以独立代词强调说话者；汉语在“因为我……”中自然呈现这一主语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”旨在呈现其专名性质；不以称号“主”替代，也不采用较传统但音值较不相符的“耶和华”。
- issue: עָנִי 的处境含义
  choice: 困苦
  alternative: 贫穷；卑微
  rationale: 原词兼有社会经济贫困、遭受苦难及地位卑微的语义范围；正文不把诗人的处境仅限于物质贫困，脚注则保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“侧耳”保留原文意象；“回应”比“应允”更严格对应“回答”，避免预先断定回应的方式。诗行分行呈现标题、呼求和理由。
