source:
  edition: WLC
  text: אֱלֹהִ֤ים זֵ֘דִ֤ים קָֽמוּ עָלַ֗/י וַ/עֲדַ֣ת עָ֭רִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י וְ/לֹ֖א שָׂמ֣וּ/ךָ לְ/נֶגְדָּֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/014.yaml
  text: God[a], arrogant men have risen against me, and a band of ruthless men has sought my life[c][b]; they have not set you before them.
translation:
  language: zh_hans
  text: 上帝啊[a]，狂傲的人起来攻击我；一群残暴的人寻索我的性命[b]。他们不把你放在眼前[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝，狂傲的人起来攻击我。”
    reason: 原文是直接称呼“上帝”，没有另加相当于“啊”的词。
  - marker: b
    text: “寻索我的性命”是希伯来语惯用表达，意为企图杀害我。
    reason: 解释源语言惯用语在本语境中的含义。
  - marker: c
    text: 或译：“他们不把你放在心上。”意思是他们行事毫不顾忌上帝。
    reason: 说明原文“把你放在他们面前”这一隐喻的含义，同时保留另一种自然译法。
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处是祷告中的直接呼告。现代汉语通常用语气词“啊”自然标明呼格；希伯来原文没有独立的呼格语气词，因此脚注保留不加“啊”的形式。
- source_word: זֵדִים
  choice: 狂傲的人
  rationale: 该词指骄傲、狂妄、僭越之人；“狂傲的人”既保留品格含义，也符合敌对语境。
- source_word: קָמוּ עָלַי
  choice: 起来攻击我
  rationale: קום על 是敌对性地起来反对某人的惯用表达；译作“起来攻击我”在现代汉语中清楚自然。
- source_word: וַעֲדַת
  choice: 一群
  rationale: 原词指聚集起来的群体或会众；在敌对语境中，“一群”自然且不过度具体化其组织性质。
- source_word: עָרִיצִים
  choice: 强暴的人
  rationale: 该词可指凶暴、残酷、压迫人的人；“强暴的人”保留其暴力与威吓色彩，而不限定为政治意义上的暴君。
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: 寻索我的性命
  rationale: 直译保留希伯来语“寻求我的性命”的表达，在此语境中意指企图杀害诗人；“寻索”体现蓄意追捕。
- source_word: וְלֹא שָׂמוּךָ לְנֶגְדָּם
  choice: 他们不把你放在眼前
  rationale: 保留“把你置于他们面前”的空间隐喻，同时用自然汉语表达他们不以神为念、毫不顾忌神。
theological_decisions:
- issue: 是否在对上帝的呼告中加入“啊”
  choice: 上帝啊
  alternative: 上帝
  rationale: 上下文明确是向上帝祷告；“啊”是现代汉语标示直接呼告的自然方式，并未改变称谓内容。因希伯来文没有独立呼格词，脚注列出较形式对应的译法。
- issue: 是否直接明说敌人想杀害诗人
  choice: 寻索我的性命
  alternative: 想要杀我
  rationale: 原文惯用语通常含有夺命之意，但正文保留“性命”的源文意象，不把隐含意义完全解释化；脚注说明其通常含义。
- issue: 是否将“不把你放在眼前”直接解释为“不敬畏你”
  choice: 不把你放在眼前
  alternative: 不把你放在心上／不敬畏你
  rationale: 原文保留视觉和空间隐喻，表达这些人行事时不顾念上帝。正文不将其收窄为单一神学概念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“狂傲的人”“强暴的人”“寻索我的性命”保留诗歌语体与源文力度；句法简洁，适合公开诵读。
