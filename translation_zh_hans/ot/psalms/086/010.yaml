  text: כִּֽי גָד֣וֹל אַ֭תָּה וְ/עֹשֵׂ֣ה נִפְלָא֑וֹת אַתָּ֖ה אֱלֹהִ֣ים לְ/בַדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/010.yaml
  text: For you are great and do wondrous things[a]; you alone are God.
translation:
  language: zh_hans
  text: 因为你伟大，行奇妙的事；唯有你是上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为此前的祈求与赞美说明理由；“因为”自然保留了希伯来语的因果连接。
- source_word: גָדוֹל
  choice: 伟大
  rationale: 表达上帝在身份与能力上的崇高卓越；“伟大”直接、庄重，也适合赞美诗语境。
- source_word: וְעֹשֵׂה
  choice: 行
  rationale: 分词在此表达上帝一贯、特有的作为；汉语“行”简洁庄重，可自然搭配“奇妙的事”。
- source_word: נִפְלָאוֹת
  choice: 奇妙的事
  rationale: 指令人惊叹的非凡作为；保留复数所体现的多样作为，并避免过度限定为某一类神迹。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本句以第二人称称呼并有排他性限定，明确指独一的上帝；采用现代普通话中庄重且通行的称谓。
- source_word: לְבַדֶּךָ
  choice: 唯有你
  rationale: 该词含第二人称单数后缀，意为“只有你／你独自”；“唯有你”突出原文的排他性，同时符合现代汉语表达。
theological_decisions:
- issue: 末句对上帝独一性的宣告
  choice: 唯有你是上帝
  alternative: 你是独一的上帝
  rationale: “唯有你是上帝”将排他重点放在“你”身上，更直接对应 לְבַדֶּךָ，清楚保留“除你以外没有别神”的断言；“你是独一的上帝”在汉语中也可成立，但较容易被理解为描述上帝的独特性，而非明确排除其他对象。
translation_notes:
  register: 采用现代、庄重、易懂的诗体表达。“本为伟大”呈现持续属性，“行奇妙的事”呈现上帝一贯的作为；末句保留原文简洁有力的独一性宣告。
