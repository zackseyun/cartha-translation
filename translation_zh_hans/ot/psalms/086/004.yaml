  text: שַׂ֭מֵּחַ נֶ֣פֶשׁ עַבְדֶּ֑/ךָ כִּ֥י אֵלֶ֥י/ךָ אֲ֝דֹנָ֗/י נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/004.yaml
  text: Gladden the soul of your servant[a], for to you, Lord, I lift up my soul.
translation:
  language: zh_hans
  text: 求你使你这仆人的心[a]欢喜；主啊，因为我向你举起我的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心”原文也可指“生命”或“自己”；本节后半句再次使用同一个词。
    reason: 说明נֶפֶשׁ的语义范围及原文的重复。
lexical_decisions:
- source_word: שַׂמֵּחַ
  choice: 求你使……欢喜
  rationale: 该词为使役意义的加强词干命令式，是向上帝提出的直接祈求；“求你使……欢喜”既保留命令式的力度，也符合现代汉语祷告语体。
- source_word: נֶפֶשׁ / נַפְשִׁי
  choice: 心／我的心
  rationale: נפש在此指诗人向上帝敞开的内在自我。译作“心”比“灵魂”更自然，也避免加入过于技术化的身心二分观；两处采用同一译词，以保留原文的重复。
- source_word: עַבְדֶּךָ
  choice: 你仆人
  rationale: 在诗篇向上帝的祷告中，此词表达谦卑服事和归属；“仆人”符合语境与庄重语体，而“奴隶”会突出本节未着重的社会身份。
- source_word: כִּי
  choice: 因为
  rationale: 引出祈求的理由，清楚保留原文的逻辑关系。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词表示朝向，与“举起”搭配，保留诗人把内在自我转向上帝的方向性。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝的称呼；“主啊”准确、庄重，并自然体现呼格。
- source_word: אֶשָּׂא
  choice: 举起
  rationale: 保留原文“举起”的祷告性隐喻，不将其释义性改写为“仰望”或“投靠”。
theological_decisions:
- issue: 祷告语境中נֶפֶשׁ的人论含义
  choice: 两处均译作“心”
  alternative: 灵魂／生命／自己／内在自我
  rationale: “心”能够表达整个人的内在生命和意向，同时保留两次נפש的诗意照应；此译法不把该词限定为与身体分离的实体。
- issue: 人与上帝关系中的עבד
  choice: 你仆人
  alternative: 你的奴隶
  rationale: 本节强调祷告者谦卑服事上帝的身份，并未突出受奴役的社会处境，因此“仆人”更贴合诗篇语境。
- issue: “举起我的נפש”的隐喻
  choice: 我向你举起我的心
  alternative: 我的心仰望你／我把自己交托给你
  rationale: 直译保留了原文可涵盖祷告、渴慕与信靠的开放性，避免只选定其中一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。分号划分祈求与理由；“主啊”置于理由句开头，使呼语在现代汉语中自然，同时不改变其所指。
