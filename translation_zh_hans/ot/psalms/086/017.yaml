  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עֲשֵֽׂה עִמִּ֥/י א֗וֹת לְ/ט֫וֹבָ֥ה וְ/יִרְא֣וּ שֹׂנְאַ֣/י וְ/יֵבֹ֑שׁוּ כִּֽי אַתָּ֥ה יְ֝הוָ֗ה עֲזַרְתַּ֥/נִי וְ/נִחַמְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/017.yaml
  text: Show me a sign for good[a], so that those who hate me may see and be put to shame, because you, O Yahweh, have helped me and comforted me.
translation:
  language: zh_hans
  text: 求你向我显出恩待的凭据[a]，使恨我的人看见便羞愧，因为你，耶和华，帮助了我，也安慰了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你为我施行一个美好的记号。”原文直译近似“与我行一个为好的记号”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה עִמִּי אוֹת לְטוֹבָה
  choice: 向我显出恩待的凭据
  rationale: 原文直译近似“与我行一个为好的记号”。“向我显出……的凭据”以自然汉语表达诗人求神施行一件可见之事的请求；“恩待”传达 לְטוֹבָה 所含的好处、善意或眷顾，同时脚注保留更贴近字面的表达。
- source_word: וְיִרְאוּ
  choice: 使……看见
  rationale: 承接祈使句的不完成式表达目的或结果；“使……看见”清楚呈现这一关系。
- source_word: שֹׂנְאַי
  choice: 恨我的人
  rationale: 忠实保留分词结构所表达的个人敌意，不泛化为“仇敌”。
- source_word: וְיֵבֹשׁוּ
  choice: 便羞愧
  rationale: בוש 可表示蒙羞、失望或羞愧；此处“羞愧”简洁自然，并可包含因看见神帮助诗人而受挫蒙羞的意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式音译四字神名，而不以“主”这一称号替代。
- source_word: עֲזַרְתַּנִי
  choice: 帮助了我
  rationale: 完成式表示已经发生、并构成当前祈求根据的行动；“帮助了我”保留其完成意义。
- source_word: וְנִחַמְתָּנִי
  choice: 安慰了我
  rationale: נחם 在此词形中意为安慰、抚慰；“安慰了我”是准确且通行的现代汉语。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名。中文采用广为人知的“耶和华”，既保留专名性质，也避免以“主”替代；“雅威”是较接近学界拟音的可选译法。
- issue: “好”的记号具体指什么
  choice: 恩待的凭据
  alternative: 为我好的记号
  rationale: לְטוֹבָה 可指为着好处、福祉或恩惠。正文用“恩待”表达语境中的神圣眷顾，但不把该记号限定为某一种神迹；脚注保留原文较宽泛的“为好的记号”。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈祷语体。“求你”体现祈使式的恳求语气；句式紧凑，并保留因果关系和原文中“看见—羞愧”的推进。
