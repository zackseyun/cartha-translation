  text: כִּֽי אַתָּ֣ה אֲ֭דֹנָ/י ט֣וֹב וְ/סַלָּ֑ח וְ/רַב חֶ֝֗סֶד לְ/כָל קֹרְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/005.yaml
  text: For you[a], Lord, are good and forgiving, abounding in steadfast love to all who call on you.
translation:
  language: zh_hans
  text: 主啊，因为你良善，乐于赦免，对所有求告你的人大有慈爱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主啊，因为你良善、赦免人，又向一切求告你的人大有慈爱。”
    reason: 保留סַלָּח较形式对应的“赦免人”，并保留רַב חֶסֶד可直译为“大有慈爱”的表达。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人祈求的依据；现代汉语中“因为”比单用“因”更自然清楚。
- source_word: אַתָּה
  choice: 你
  rationale: 保留原文显明的人称代词及其强调作用，体现诗人对神的直接呼求。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 此处是神圣称号 אֲדֹנָי，并非四字神名；在直接呼语中译作“主啊”准确而自然。
- source_word: טוֹב
  choice: 本为良善
  rationale: “良善”保留该词宽广的道德与恩慈内涵；“本为”自然表达谓语形容词所陈述的固有品格。
- source_word: סַלָּח
  choice: 乐意赦免
  rationale: 该罕见形容词描述神具有赦免人的性情；“乐意赦免”以自然汉语表达这种随时愿意宽恕的倾向。
- source_word: רַב חֶסֶד
  choice: 以丰盛的慈爱待他们
  rationale: רַב 表示丰富、充盈；配合介词所标明的对象，译成“以丰盛的慈爱待他们”兼顾原义与汉语流畅度。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: “慈爱”在现代中文圣经语境中能够涵盖恩慈、忠贞与持久的爱，比单译“怜悯”更宽广。
- source_word: לְכָל קֹרְאֶיךָ
  choice: 凡求告你的
  rationale: 分词短语泛指所有向神祷告、呼求他的人；“求告”准确表达宗教语境中的呼求，也简洁庄重。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主啊
  alternative: 我的主啊；主人啊
  rationale: 原文为 אֲדֹנָי 而非 יהוה，因此不按四字神名处理。“主啊”既保留称号，也适合祷告中的直接呼语。
- issue: חֶסֶד 的语义范围
  choice: 慈爱
  alternative: 信实的爱；怜悯
  rationale: “慈爱”不把该词缩减为单纯怜悯，并能容纳恩爱与忠贞的双重内涵；不额外加入原文没有明说的盟约限定。
- issue: סַלָּח 所表达的赦免性情
  choice: 乐意赦免
  alternative: 赦免人的；宽恕人的
  rationale: 此词是形容神品格的形容词，不只是一次赦免行动。“乐意赦免”自然传达其倾向，但脚注保留较形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“主啊”体现直接呼语；分号呈现三个并列的神圣属性，并避免句子过度绵长。脚注标记置于整节末尾，对应整句的词汇替代译法。
