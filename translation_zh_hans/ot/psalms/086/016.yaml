source:
  edition: WLC
  text: פְּנֵ֥ה אֵלַ֗/י וְ/חָ֫נֵּ֥/נִי תְּנָֽ/ה עֻזְּ/ךָ֥ לְ/עַבְדֶּ֑/ךָ וְ֝/הוֹשִׁ֗יעָ/ה לְ/בֶן אֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/016.yaml
  text: Turn to me and be gracious to me[a]; give your strength to your servant[b], and save the son of your maidservant.
translation:
  language: zh_hans
  text: '求你转向我，恩待我；

    求你将你的力量赐给你的仆人，

    拯救你婢女的儿子。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你婢女的儿子”是诗人对自己的称呼，直译如此；这句话可能强调他自幼便属于上帝，但原文没有进一步说明。
    reason: 保留希伯来文特殊的自称方式，并避免读者误以为这里突然指向另一个人。
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: 转向我
  rationale: פּנה的祈使式配合方向介词，表达求上帝转身关注诗人；“转向我”既贴近原文意象，也符合现代汉语祷告语体。
- source_word: וְחָנֵּנִי
  choice: 恩待我
  rationale: חנן指施恩、赐予恩惠；“恩待我”简洁自然，并保留恩宠含义，不将其收窄为怜悯。
- source_word: תְּנָה עֻזְּךָ
  choice: 将你的力量赐给
  rationale: נתן是“给、赐”，עֹז是“力量、能力”；“赐给”适合向上帝祈求的语境，“力量”则保留原词的宽泛含义。
- source_word: לְעַבְדֶּךָ
  choice: 你的仆人
  rationale: עֶבֶד在此是诗人谦卑的自称，强调归属和服事；“仆人”比“奴隶”更符合诗篇祷告的语域，又不抹去其从属意味。
- source_word: וְהוֹשִׁיעָה
  choice: 拯救
  rationale: ישׁע在此祈求上帝施行救援；“拯救”既可指现实患难中的搭救，也保留较宽的神学含义。
- source_word: לְבֶן אֲמָתֶךָ
  choice: 你婢女的儿子
  rationale: 按原文保留“儿子”与“婢女”的明确关系；“婢女”与前句“仆人”相应而不完全重复，并体现诗人自称属于上帝的谦卑语气。
theological_decisions:
- issue: עֶבֶד与אָמָה这两个从属身份词的处理
  choice: 分别译作“仆人”和“婢女”
  alternative: “奴仆”和“女奴”；或将后半句意译为“世代服事你的人”
  rationale: 原文先以男性“仆人”自称，随后称自己为上帝“婢女的儿子”。保留两个不同词及母子关系，可呈现其谦卑归属的诉求，而不把可能蕴含的世代关系解释成原文未明说的教义。
- issue: “你婢女的儿子”所表达的关系
  choice: 保留字面亲属称谓，不明确断定其历史或盟约背景
  alternative: 解释为“生在你家中的仆人”或“世代忠于你的人”
  rationale: 该措辞可能强调与生俱来的归属、母亲的敬虔身份或强烈的谦卑自称，但原句没有明说具体背景，因此译文保留其含蓄与张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗篇祷告语体。“求你”在两个诗行开头形成自然节奏；“恩待”“赐给”“仆人”“婢女”虽较书面，但在现代宗教与文学语境中清楚易懂。
