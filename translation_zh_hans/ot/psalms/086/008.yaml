base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/008.yaml
  text: There is none like you among the gods[a], Lord[b], and there are no works like yours.
translation:
  language: zh_hans
  text: 在众神[a]中，没有谁能与你相比，主啊；也没有任何作为能比得上你的作为[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众神”也可理解为“属天的众灵”。希伯来文直译为“在众神中”，这是圣经中宣告主超越一切所谓神明或属天权势、无可比拟的常见说法。
    reason: alternative_reading
  - marker: b
    text: “作为”也可译作“所做的事”或“行动”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּמוֹךָ
  choice: 没有谁能与你相比
  rationale: 以自然的现代汉语表达存在否定和比较关系，保留“没有任何一位可与你相比”的绝对语气。
- source_word: בָאֱלֹהִים
  choice: 在众神中
  rationale: 原文 אֱלֹהִים 在此为复数，并由介词 ב 引出比较范围；直译为“在众神中”既保留诗句的张力，也不额外断定这些神明的本体地位。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 此处是祷告中的呼格；“主啊”准确、庄重，也符合现代汉语的自然称呼方式。
- source_word: וְאֵין כְּמַעֲשֶׂיךָ
  choice: 也没有什么作为能与你的作为相比
  rationale: מַעֲשֶׂה 可指作为、行为或所做的事；“作为”范围较广，适合赞美上帝行动的诗歌语境。重复“作为”使比较对象明确，并保留希伯来文平行结构。
theological_decisions:
- issue: “在众神中”的含义
  choice: 保留复数表达“在众神中”，将其呈现为宣告主无可比拟的诗性语言。
  alternative: 译作“在天上众灵中”，或改写为“没有别的神能与你相比”。
  rationale: 希伯来文明确使用复数 אֱלֹהִים。保留这一表达可忠实呈现原文的措辞与神学张力，而不把它擅自解释成多神论，也不以单数改写来消除原文的复数意味。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。“主啊”前置以符合汉语呼告习惯；两分句保持平行，并保留原文“众神”的真实歧义与神学张力。
