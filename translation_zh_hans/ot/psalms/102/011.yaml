  yaml_path: translation/ot/psalms/102/011.yaml
  text: My days are like a lengthening shadow[a], and I wither away like grass.
translation:
  language: zh_hans
  text: 我的年日如渐长的影子[a]；我如草枯干。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如伸展的影子。”希伯来语意象很可能指傍晚越拉越长的影子，暗示衰残和短暂。
    reason: 词义存在可保留的翻译选择；“渐长”表达语境中的自然图景，“伸展”则更贴近该词的字面形式。
lexical_decisions:
- source_word: יָמַי
  choice: 我的年日
  rationale: 保留希伯来语复数名词及第一人称单数所属后缀，既可指诗人的日子，也含其一生年日之意。
- source_word: כְּצֵל
  choice: 如……影子
  rationale: 前缀 כְּ 表示比拟；“影子”直接保留诗歌中短暂无常的意象。
- source_word: נָטוּי
  choice: 渐长的
  rationale: 该词源于 נטה，可指伸展、拉长；与“影子”连用时很可能描绘傍晚逐渐拉长的影子。“渐长”在现代汉语中自然，同时保留衰残将尽的暗示。
- source_word: וַאֲנִי
  choice: 我也
  rationale: 连接词与独立代词使焦点转到诗人自身；“我也”自然衔接两个并列的衰残意象，而不额外强化为转折。
- source_word: כָּעֵשֶׂב
  choice: 如草
  rationale: עֵשֶׂב 可泛指青草或绿色植物；“草”最简洁自然，也符合圣经诗歌中表现脆弱易逝的常见意象。
- source_word: אִיבָשׁ
  choice: 枯干
  rationale: יבשׁ 表示干枯、枯萎；“枯干”既传达水分与生机消逝，也与“草”的意象自然搭配。
