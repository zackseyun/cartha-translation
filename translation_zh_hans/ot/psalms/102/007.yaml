  text: I lie awake and am like a solitary bird on a rooftop[a].
translation:
  language: zh_hans
  text: 我不眠，如同一只独自在屋顶上的鸟。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同一只独自在屋顶上的麻雀。”希伯来语“צִפּוֹר”泛指鸟，传统译法则较具体地译作“麻雀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקַדְתִּי
  choice: 我彻夜不眠
  rationale: 该动词可表示警醒、守望或保持清醒；在哀歌语境中，重点是因痛苦而无法入睡。“彻夜不眠”以自然汉语传达持续清醒的体验。
- source_word: וָאֶהְיֶה
  choice: 如同
  rationale: 原文直译为“我就像/我成为像”。汉语诗句用“如同”自然承接前句，并保留比喻关系，无须生硬译出系词。
- source_word: כְּצִפּוֹר
  choice: 一只……鸟
  rationale: צִפּוֹר是鸟类的通称，虽常指小鸟，却不必特指麻雀；正文用“鸟”保留原词的语义宽度。
- source_word: בּוֹדֵד
  choice: 孤零零的
  rationale: 该词表示独自、孤立。“孤零零的”既准确呈现单独停留的状态，也符合现代汉语诗性哀歌的语气，但不将其过度解释为主观的“孤独感”。
- source_word: עַל גָּג
  choice: 屋顶上
  rationale: 原意为“在屋顶上”。这一译法简洁自然，并保留鸟孤单暴露在屋顶上的鲜明意象。
