revisions:
- from: 你必起来怜悯锡安，因为现在是恩待她的时候；指定的时刻已经到了。[a]
  to: 你必起来怜悯锡安，因为恩待她[a]的时候到了，所定的日期[b]已经来到。
  rationale: 删除原文未直接明示的“现在”，以“时候到了”表达 עֵת，并以“所定的日期已经来到”对应 בָא מוֹעֵד。修订后的句式在自然现代汉语中保留两个 כי 分句的说明作用及其近义平行；同时更正脚注内容并为两个有实际翻译价值的词语设置明确锚点。
