  text: אַתָּ֣ה תָ֭קוּם תְּרַחֵ֣ם צִיּ֑וֹן כִּי עֵ֥ת לְ֝/חֶֽנְנָ֗/הּ כִּי בָ֥א מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/013.yaml
  text: You will arise and have compassion on Zion[a], for it is time to show her favor[b], for the appointed time has come.
translation:
  language: zh_hans
  text: 你必起来怜悯锡安，因为恩待她[a]的时候到了，所定的日期[b]已经来到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩待她”也可译作“向她施恩”或“眷顾她”。
    reason: lexical_alternative
  - marker: b
    text: “所定的日期”也可译作“定下的时间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקוּם
  choice: 你必起来
  rationale: קום的Qal未完成式第二人称阳性单数，在此表达面向上帝的将来行动；“起来”保留原文鲜明的拟人表达。
- source_word: תְּרַחֵם
  choice: 怜悯
  rationale: רחם的Piel未完成式表示施怜悯、动慈悲；“怜悯”自然、庄重，并保留其情感与施恩意味。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 保留原文专名，不将其解释性地改写为“耶路撒冷”或“上帝的子民”。
- source_word: כִּי
  choice: 因为
  rationale: 两个כִּי分句说明上帝起来怜悯锡安的根据；汉语中第二个分句用分号衔接，避免重复而仍保留因果逻辑。
- source_word: עֵת לְחֶנְנָהּ
  choice: 现在是恩待她的时候
  rationale: עֵת指时候，חנן表示施恩、恩待，阴性单数后缀指锡安；加入“现在”自然表达决定性时机已经临近的语义。
- source_word: בָא מוֹעֵד
  choice: 指定的时刻已经到了
  rationale: בוא完成式表达来到且具有当前效力；מוֹעֵד是指定、定下的时间，“指定的时刻”保留其预定性。
theological_decisions:
- issue: “锡安”应按地名保留还是作解释性翻译
  choice: 保留“锡安”，作为上帝怜悯的对象
  alternative: 译作“耶路撒冷”或“上帝的子民”
  rationale: 希伯来文本直接使用“锡安”。它虽可具有城市及上帝子民的延伸意涵，正文不宜预先限定，应让这些关联由语境呈现。
- issue: “指定的时刻”是否暗示由上帝指定
  choice: 保留原文的被指定意味，但不在正文补明指定者
  alternative: 译作“上帝所定的时刻”
  rationale: מוֹעֵד可指约定或指定的时间，语境很可能指上帝所定之时，但原句没有明说指定者，因此不补入“上帝所定”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你必起来”保留诗歌中的拟人意象；“恩待她”既对应חנן，也与前句“怜悯”形成自然区分。脚注仅保留对מוֹעֵד有实际价值的词义替代。
