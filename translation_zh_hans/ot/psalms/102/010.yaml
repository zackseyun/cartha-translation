  text: מִ/פְּנֵֽי זַֽעַמְ/ךָ֥ וְ/קִצְפֶּ֑/ךָ כִּ֥י נְ֝שָׂאתַ֗/נִי וַ/תַּשְׁלִיכֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/010.yaml
  text: because of your indignation and your wrath[a], for you have lifted me up and cast me away.
translation:
  language: zh_hans
  text: '都因你的盛怒和震怒；

    因为你把我举起[a]，又把我抛下。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “举起”或译“提起”。
    reason: נשא语义范围较广；上下文支持“举起”，但“提起”也是贴近原文的表达。
lexical_decisions:
- source_word: מִפְּנֵי
  choice: 都因
  rationale: 此处是表原因的惯用结构，不取空间意义“从……面前”；“都因”自然承接上文所述的困境。
- source_word: זַעַמְךָ
  choice: 你的盛怒
  rationale: זַעַם表示强烈的愤怒；“盛怒”保留强度，并与后面的近义词有所区别。
- source_word: וְקִצְפֶּךָ
  choice: 和震怒
  rationale: קֶצֶף常指猛烈的怒气；“震怒”保持诗歌的庄重语体，也保留两个愤怒用语的并列。
- source_word: כִּי
  choice: 因为
  rationale: 这里引出解释诗人处境的缘由；现代汉语用“因为”清楚自然。
- source_word: נְשָׂאתַנִי
  choice: 你把我举起
  rationale: נשא可表示举起、提起或承载；与下句“抛下”相对时，“举起”最能呈现鲜明的动作画面。
- source_word: וַתַּשְׁלִיכֵנִי
  choice: 又把我抛下
  rationale: שלך表示投、掷、抛；“抛下”既保留动作力度，也自然表达被弃置的意味，但不把这种意味扩写成原文没有明说的解释。
theological_decisions:
- issue: 对上帝愤怒的描写
  choice: 保留“盛怒”和“震怒”两个相近而有区别的强烈用语
  alternative: 合并为单一的“愤怒”，或弱化为一般的不悦
  rationale: 希伯来文并列两个表示强烈愤怒的词。译文不淡化其力度，也不另加教义解释，以保留诗句本身的张力。
- issue: 上帝将诗人举起又抛下的意象
  choice: 直译为“举起……抛下”
  alternative: 解释为“高举后又弃绝”
  rationale: 原文呈现强烈而含蓄的动作意象；直译避免断定“举起”必然指尊荣，也避免把“抛下”系统化为特定的弃绝教义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。分号和换行保留前因后果及动作对照；“盛怒／震怒”避免把两个希伯来近义词压成一个词。
