  text: עִנָּ֖ה בַ/דֶּ֥רֶךְ כח/ו קִצַּ֥ר יָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/023.yaml
  text: He afflicted my strength on the way[b][a]; he shortened my days.
translation:
  language: zh_hans
  text: 他在路上[b]使他的力量[a]衰弱；他缩短了我的年日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“他的力量”；鉴于上下文采用第一人称，许多人将这里理解为“我的力量”。
    reason: alternative_reading
  - marker: b
    text: 或译“在人生途中”；原文直译为“在路上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנָּה
  choice: 使……衰弱
  rationale: ענה 的加强词干可表示使人受苦、降卑或削弱；以“力量”为宾语时，“使……衰弱”在现代汉语中自然，也保留原文使力量受损的语义。
- source_word: בַדֶּרֶךְ
  choice: 在路上
  rationale: 直译为“在路上”；这里可能比喻人生的历程，但正文保留希伯来文的道路意象。
- source_word: כחו
  choice: 他的力量
  rationale: 按所给马所拉文本的第三人称阳性单数后缀译为“他的”，不在正文中消除它与下半句“我的年日”之间的人称张力；第一人称理解列入脚注。
- source_word: קִצַּר
  choice: 缩短了
  rationale: קצר 表示缩短或截短；“缩短了”准确、清楚，并与“年日”搭配自然。
- source_word: יָמָי
  choice: 我的年日
  rationale: 该词带第一人称单数后缀，指诗人的日子或寿命；“年日”保留诗歌语体。
theological_decisions:
- issue: “他的力量”与“我的年日”之间的人称转换
  choice: 正文保留第三人称“他的力量”和第一人称“我的年日”
  alternative: 将前半句按上下文译为“使我的力量衰弱”
  rationale: 所给希伯来文本的后缀存在真实的人称张力。正文依文本形式保留，不默然协调；上下文所支持的第一人称理解在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的汉语；保留“路上”的诗歌意象和“年日”的经文语感，同时不消除原文突兀的人称转换。
