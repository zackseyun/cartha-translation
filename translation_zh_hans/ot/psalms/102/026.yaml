  text: הֵ֤מָּה יֹאבֵדוּ֮ וְ/אַתָּ֪ה תַ֫עֲמֹ֥ד וְ֭/כֻלָּ/ם כַּ/בֶּ֣גֶד יִבְל֑וּ כַּ/לְּב֖וּשׁ תַּחֲלִיפֵ֣/ם וְֽ/יַחֲלֹֽפוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/026.yaml
  text: They will perish[a], but you will remain; all of them will wear out like a garment. Like clothing you will change them[b], and they will pass away.
translation:
  language: zh_hans
  text: '它们都要灭亡，你却要长存；

    它们全都要像衣裳一样破旧。

    如同衣服，你要更换它们；

    它们就要消逝。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵמָּה
  choice: 它们
  rationale: 这是阳性复数独立代词，承接上文的天地；现代汉语以“它们”自然指称受造之物，并与“你”形成对照。
- source_word: יֹאבֵדוּ
  choice: 都要灭亡
  rationale: אבד 的 Qal 未完成式表示走向毁灭或消亡；“灭亡”直接表达其意义，又不额外断定彻底归于虚无。
- source_word: וְאַתָּה תַעֲמֹד
  choice: 你却要长存
  rationale: 连词在此有明显转折作用。עמד 字面为“站立”，在受造界灭亡的对比中表示持续存留；“长存”以自然汉语传达这一语境义。
- source_word: וְכֻלָּם
  choice: 它们全都
  rationale: 保留 כֹּל 加复数后缀的全面涵盖意味，指上文所说的受造天地。
- source_word: כַּבֶּגֶד יִבְלוּ
  choice: 要像衣裳渐渐破旧
  rationale: בלה 常用于衣物磨损、变旧；“渐渐破旧”保留衣裳的比喻，并符合现代汉语表达。
- source_word: כַּלְּבוּשׁ
  choice: 像更换衣服那样
  rationale: לְבוּשׁ 指衣服、服装；结合后面的动词，汉语这样表达可清楚延续换衣的意象。
- source_word: תַּחֲלִיפֵם
  choice: 更换它们
  rationale: חלף 的 Hiphil 形式可指更换、替换；选择“更换”保留换衣比喻，同时不排除“替换”的含义。
- source_word: וְיַחֲלֹפוּ
  choice: 它们就会过去
  rationale: 同一词根 חלף 的 Qal 形式在此表示过去、消逝；“过去”既呼应前面的更换，也表现受造物的短暂。
theological_decisions:
- issue: 上帝的恒存与受造界的短暂之间的对照
  choice: 以“你却要长存”表达上帝持续存留，并以受造物灭亡、破旧和过去与之对照。
  alternative: 更直译为“你却要站立”。
  rationale: 经文本身借 עמד 表达上帝不随受造界消逝的恒存；译文传达这一对照，但不加入本节未明说的后期教义术语。
- issue: 更换受造天地的意象
  choice: 保留“更换它们”的措辞，使换衣比喻保持开放。
  alternative: 译为“替换它们”或“使它们改变”。
  rationale: תַּחֲלִיפֵם 可表示更换或替换；正文不进一步说明更换后的状态，以免消解原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分行保留希伯来诗歌的对比和平行结构；“衣裳／衣服”反映原文两个近义衣物词，“更换”与“过去”则保留 חלף 词根在相邻分句中的呼应。
