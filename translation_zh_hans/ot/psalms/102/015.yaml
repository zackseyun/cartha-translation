id: PSA.102.15
reference: Psalms 102:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יִֽירְא֣וּ ג֭וֹיִם אֶת שֵׁ֣ם יְהוָ֑ה וְֽ/כָל מַלְכֵ֥י הָ֝/אָ֗רֶץ אֶת כְּבוֹדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/015.yaml
  text: Then the nations will fear the name of Yahweh[b][a], and all the kings of the earth your glory.
translation:
  language: zh_hans
  text: 于是，列国必敬畏雅威的名[a]，地上所有的君王都必敬畏你的荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “于是”也可译作“并且”；“敬畏”也可译作“惧怕”或“尊崇”。
    reason: 原文连词וְ可仅表示并列，也可结合上下文表示结果；动词ירא兼有惧怕和敬畏之意。
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: 于是……必敬畏
  rationale: יִירְאוּ是ירא的Qal未完成式第三人称阳性复数，可指惧怕或怀着敬畏之心尊崇。结合上一节雅威重建锡安的语境，וְ自然表达随之而来的结果；译作“于是”，并用“必”呈现未来指向。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 指各国、各族群；“列国”符合诗篇的庄重语体，也避免“外邦人”可能带入的后期群体对立。
- source_word: אֶת שֵׁם יְהוָה
  choice: 雅威的名
  rationale: 保留“名”的原有意象，使其所涵盖的身份、声誉与自我启示不被释义性改写。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，保留其专名性质，不以称号代替。
- source_word: וְכָל מַלְכֵי הָאָרֶץ
  choice: 地上所有的君王
  rationale: כָל与复数附属结构自然表示“所有的”；הָאָרֶץ在此译为“地上”，符合现代汉语诗体表达。
- source_word: אֶת כְּבוֹדֶךָ
  choice: 你的荣耀
  rationale: כָבוֹד可指荣耀、尊荣或威荣；“荣耀”最能兼顾诗篇语体及其神学分量。第二人称阳性单数后缀保留为“你的”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可保留其专名性质，而不以“主”这一称号取代；“耶和华”虽为传统形式，但“雅威”较接近当前学界通常采用的发音重构。
- issue: ירא用于列国和君王时的语义
  choice: 敬畏
  alternative: 惧怕；尊崇
  rationale: 该动词兼具惧怕与敬畏之意。本节以神的名和荣耀为宾语，“敬畏”能保留畏惧与崇敬之间的张力，而不把意义单向化。
- issue: 后半句省略谓语的处理
  choice: 补出“都必敬畏”
  alternative: 按希伯来语省略为“地上所有的君王，你的荣耀”
  rationale: 希伯来诗句的后半句承接前半句谓语יִירְאוּ。现代汉语若完全省略会显得残缺，因此补出谓语，同时保持两个宾语之间的平行关系。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。“列国”“君王”“荣耀”保留原文的公共与诗性尺度；后半句补出共享谓语，使汉语自然清楚。
