  yaml_path: translation/ot/psalms/102/012.yaml
  text: But you[a], O Yahweh, sit enthroned forever[b], and your remembrance is from generation to generation.
translation:
  language: zh_hans
  text: 但你，耶和华，永远坐着为王[a]；对你的记念，存到世世代代[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“永远坐着。”希伯来语动词本义为“坐”，也可表示长久居留；在君王语境中可含有坐在宝座上掌权的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你的纪念”或“你的名声”。这里的希伯来语名词可指对某位的记念、纪念，或长存的名声。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 但你
  rationale: 独立代词与连接词共同加强转折，与上文人的短暂形成鲜明对比；“但你”在现代汉语中自然地表达这一反差。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的音译来呈现四字神名，而不以称号代替专名。
- source_word: לְעוֹלָם תֵּשֵׁב
  choice: 永远坐着为王
  rationale: ישׁב 的基本义是“坐、居留”，用于上帝时可带有坐在宝座上掌权的含义；正文以“坐着为王”表达诗歌语境中的王权意象，同时用脚注保留较直译的可能。
- source_word: וְזִכְרְךָ
  choice: 人对你的记念
  rationale: זֵכֶר 可指记念、纪念或流传的名声。“人对你的记念”保留其记忆与纪念的核心意义，并使省略系词的诗句在中文中清楚可懂。
- source_word: לְדֹר וָדֹר
  choice: 直到世世代代
  rationale: 该固定表达表示一代接一代、绵延不绝；“直到世世代代”既贴近原文，也符合庄重的现代汉语诗体。
theological_decisions:
- issue: תֵּשֵׁב 是否明确表达上帝登基掌权
  choice: 永远坐着为王
  alternative: 永远坐着；永远长存
  rationale: 原动词本身并非专门表示“登基”，但以上帝为主语并处在诗篇语境中，可以唤起坐在宝座上统治的意象。正文呈现这一自然含义，脚注则保留原词较宽的语义范围，避免把王权解释绝对化。
- issue: זִכְרְךָ 所指的是记念、名号还是声誉
  choice: 人对你的记念
  alternative: 你的名号；你的声誉
  rationale: 原名词的语义范围涵盖记念、纪念性称谓及长存的名声。正文采用最贴近词根“记念”的表达，不把经文限定为单指名号或声誉。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“坐着为王”保留原文“坐”的具体意象，并传达可能的王权含义；后半句维持希伯来诗歌省略系词的凝练结构。
