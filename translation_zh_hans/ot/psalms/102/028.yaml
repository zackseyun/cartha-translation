  text: בְּנֵֽי עֲבָדֶ֥י/ךָ יִשְׁכּ֑וֹנוּ וְ֝/זַרְעָ֗/ם לְ/פָנֶ֥י/ךָ יִכּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/028.yaml
  text: The children of your servants will dwell[a], and their offspring will be established before you.
translation:
  language: zh_hans
  text: 你仆人的儿女必居住[a]；他们的后裔必在你面前坚立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿女”也可直译为“众子”；“居住”也可译为“安居”。
    reason: 保留בְּנֵי较字面的男性形式以及יִשְׁכּוֹנוּ可在语境中译作“安居”的替代译法，同时使正文不额外明示安全含义。
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿女
  rationale: בֵּן的复数构造形式在此指仆人们的子女或后代；“儿女”自然、庄重，也不把所指不必要地限于男性。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: עֶבֶד可指仆人或奴仆；在向上帝祈祷的诗篇语境中，“仆人”最自然贴切。
- source_word: יִשְׁכּוֹנוּ
  choice: 必安居
  rationale: שׁכן意为居住、定居；“安居”在现代汉语中表达稳定居住，但“安”也可能被理解为明确的安全含义，因此以脚注保留较严格的“居住”。
- source_word: וְזַרְעָם
  choice: 他们的后裔
  rationale: זֶרַע在此为集合意义，指后代；“后裔”比字面的“种子”更符合现代汉语的人类谱系表达。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 直译为“在你面前”，既简洁，也保留处于上帝临在之中的含义。
- source_word: יִכּוֹן
  choice: 必坚立
  rationale: כּון的Nifal形式表示被确立、稳固或站立得稳；“坚立”保留被稳固后的状态，并与诗歌体裁相称。
theological_decisions:
- issue: 是否把应许明确解释为圣约性或末世性的应许
  choice: 只表达上帝仆人的后代安居并在他面前坚立
  alternative: 明确译成以色列之约的延续，或末世最终得救的应许
  rationale: 希伯来文本本身没有说明这一稳定应许的具体神学机制或时间范围，因此不在译文中加以限定。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体；以“必……；必……”保持两分句的平行结构。“安居”较自然地体现定居和稳定，但脚注保留不含安全意味的直译。
