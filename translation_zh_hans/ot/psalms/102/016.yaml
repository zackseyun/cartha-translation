  text: כִּֽי בָנָ֣ה יְהוָ֣ה צִיּ֑וֹן נִ֝רְאָ֗ה בִּ/כְבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/016.yaml
  text: For Yahweh has built Zion[a]; he has appeared in his glory.
translation:
  language: zh_hans
  text: 因为耶和华建造了锡安；他在他的荣耀中显现[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在他的荣耀中被看见。”希伯来语动词既可指显现，也可指被看见。
    reason: 保留 נִרְאָה 可作神主动显现或被看见的语义与语法歧义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处引出上下文所述盼望的根据；“因为”自然保留解释或因果连接。
- source_word: בָנָה
  choice: 建造了
  rationale: 该动词为完成式，表述建造为已成之事；不擅自加入“重建”，因为“重新”的意思并未在词形中明说。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中对四字神名的通行音译，以区别于称号“主”。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 保留专名，不将其泛化为“耶路撒冷”或“上帝的子民”。
- source_word: נִרְאָה
  choice: 显现
  rationale: 尼法勒形可表示“显现”或“被看见”；正文采用自然且符合神显语境的“显现”，同时以脚注保留被动理解。
- source_word: בִּכְבוֹדוֹ
  choice: 在自己的荣耀中
  rationale: 介词短语直译为“在他的荣耀中”；汉语用反身代词明确其荣耀属于句中主语，同时保留显现的情态或范围。
theological_decisions:
- issue: נִרְאָה בִּכְבוֹדוֹ 中神显与被看见之间的歧义
  choice: 他在自己的荣耀中显现
  alternative: 他在自己的荣耀中被看见／人看见他满有荣耀
  rationale: 尼法勒形兼有“显现”和“被看见”的可能。正文选择较自然的神显表达，但不把另一种语法理解排除在外，故列入脚注。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: “耶和华”是现代简体中文读者最熟悉的神名音译，也保留专名性质；不以称号“上主”代替原文神名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“建造了锡安”贴近原文，不额外加入“重建”；分号保留两个完成式分句之间紧密的诗歌联系。
