  text: All day long my enemies reproach me[b][a]; those who mock me swear by me.
translation:
  language: zh_hans
  text: '我的仇敌终日辱骂我；

    嘲弄我的人指着我起誓。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“嘲弄我的人拿我来赌咒”或“用我作咒诅的套语”。希伯来语表达较难确定；这里可能指他们把诗人的名字或遭遇当作敌意誓语中的咒诅或轻蔑对象。
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 表示整天持续不断；“终日”简洁自然，也符合诗歌体裁。
- source_word: חֵרְפוּנִי
  choice: 辱骂我
  rationale: חרף表示带着轻蔑的责骂、羞辱或讥讽；“辱骂”在现代汉语中自然，并保留言语攻击与羞辱的意味。
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: 准确表达复数名词及第一人称所属关系；“仇敌”庄重而易懂。
- source_word: מְהוֹלָלַי
  choice: 那些疯狂嘲弄我的人
  rationale: 此词形式和确切含义较难确定，可能指向诗人猖狂、发狂或加以嘲弄的人；正文兼顾其狂暴意味与上下文中的讥嘲敌意。
- source_word: בִּי נִשְׁבָּעוּ
  choice: 指着我起誓
  rationale: נשבע与介词ב通常表示“指着……起誓”。这里并非中性的誓言，可能是把诗人的名字或遭遇用作咒诅套语；正文保留希伯来语结构，将语境含义列入脚注。
