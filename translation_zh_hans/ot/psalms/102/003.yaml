  text: For my days vanish like smoke[a], and my bones burn like a hearth.
translation:
  language: zh_hans
  text: 因为我的年日如烟消逝；我的骨头如火炉般烧得灼热[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
