    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出哀叹的缘由，保留与上文的因果联系。
- source_word: כָלוּ בְעָשָׁן יָמָי
  choice: 我的年日如烟消逝
  rationale: כָלוּ表示耗尽、终结；结合烟的意象，译为“消逝”自然地传达烟散去般短暂无常的意味。介词בְ在此按比较意象处理为“如”。
- source_word: וְעַצְמוֹתַי
  choice: 我的骨头
  rationale: 直译身体意象；希伯来诗歌中的“骨头”可表达深入全身的痛苦。
- source_word: כְמוֹ קֵד
  choice: 如炉火
  rationale: קֵד是罕见词，指燃烧之物或燃烧之处，确切所指不明；“炉火”既保留高热意象，也避免把它限定为某一种器具。
- source_word: נִחָרוּ
  choice: 烧灼
  rationale: 该动词表示被烧热、烤焦或灼烧；“烧灼”简洁而强烈，又不武断地表达完全烧焦。
