  text: כִּֽי רָצ֣וּ עֲ֭בָדֶי/ךָ אֶת אֲבָנֶ֑י/הָ וְֽ/אֶת עֲפָרָ֥/הּ יְחֹנֵֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/014.yaml
  text: For your servants delight in her stones and show favor to her dust[a].
translation:
  language: zh_hans
  text: 因为你的仆人喜爱她的石头，怜惜她的尘土。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怜惜”或译“恩待”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人盼望锡安蒙复兴的缘由；现代汉语中“因为”自然地表达因果关系。
- source_word: רָצוּ
  choice: 喜爱
  rationale: 此处表示带着悦纳和眷恋的态度；“喜爱”既自然，又能表现仆人对锡安石头的深厚感情。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: 在向上帝陈说的诗篇语境中，“仆人”准确而自然，不必特别突出奴隶身份。
- source_word: אֶת אֲבָנֶיהָ
  choice: 她的石头
  rationale: 阴性单数后缀回指被拟人化的锡安；用“她”保留原文的拟人色彩。
- source_word: וְאֶת עֲפָרָהּ
  choice: 她的尘土
  rationale: עָפָר直指尘土，在本诗语境中也使人联想到城毁后的尘土瓦砾；保留“尘土”能维持原诗意象。
- source_word: יְחֹנֵנוּ
  choice: 怜惜
  rationale: חנן在此可表达恩待、眷顾或怜悯；以尘土为宾语时，“怜惜”最自然地传达仆人对锡安废墟的眷爱，同时保留怜悯意味。
theological_decisions:
- issue: 锡安／耶路撒冷的阴性拟人
  choice: 用“她”指代锡安
  alternative: 用“它”作非拟人化指代
  rationale: 希伯来文两处阴性后缀均回指锡安。保留“她”能呈现原文对圣城的拟人化表达，而不额外引入教派性解释。
- issue: יְחֹנֵנוּ所表达的恩待与怜悯张力
  choice: 正文译作“怜惜”，脚注保留“恩待”的可能
  alternative: 正文译作“恩待”或“眷顾”
  rationale: 该动词可涵盖施恩、怜悯。这里的对象是锡安的尘土，“怜惜”在汉语中较自然；脚注保留另一层词义，避免把原文语义范围单一化。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两分句结构紧凑，保留“石头／尘土”的具体意象和锡安的阴性拟人。
