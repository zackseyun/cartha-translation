  text: תִּכָּ֣תֶב זֹ֭את לְ/ד֣וֹר אַחֲר֑וֹן וְ/עַ֥ם נִ֝בְרָ֗א יְהַלֶּל יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/018.yaml
  text: This will be written for a generation to come[a], and a people yet to be created will praise Yah.
translation:
  language: zh_hans
  text: 要为后来的世代写下这；将要受造的民必赞美雅[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”是希伯来文神名的诗歌短式；有些译本将其译作“耶和华”或“主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכָּתֶב זֹאת
  choice: 这要……写下
  rationale: תִּכָּתֶב是כתב的尼法勒未完成式，结合上下文宜作面向未来的被动表达；זֹאת指前文的见证或祷告，不增添“事情”“记载”等解释性名词。
- source_word: לְדוֹר אַחֲרוֹן
  choice: 为后来的世代
  rationale: דּוֹר意为“世代”，אַחֲרוֹן在此最自然地表示时间上的后来，而不必限定为末世的“最后一个世代”。
- source_word: וְעַם נִבְרָא
  choice: 将来受造的人民
  rationale: עַם是不带冠词的“人民”；נִבְרָא是ברא的被动分词。与“后来的世代”平行，表达尚未出现、将来受造的群体，同时保留“受造”一词的神学分量。
- source_word: יְהַלֶּל
  choice: 必赞美
  rationale: הלל的皮埃勒未完成式；顺应全句未来指向，译作“必赞美”，既自然又传达陈述中的确定语气。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的诗歌短式，而不是完整形式יהוה。音译为“雅”可保留原文的词形区别及诗歌色彩。
theological_decisions:
- issue: 神名短式יָהּ的译法
  choice: 雅
  alternative: 耶和华；主
  rationale: 原文特意使用神名的短式יָהּ。译作“雅”避免把它与完整神名יהוה混同，也不以称号“主”取代原文的专名形式；脚注为读者说明其性质。
- issue: “受造的人民”的时间指向
  choice: 将来受造的人民
  alternative: 新造的人民；被创造的人民
  rationale: 上下文明确面向后来世代，因此“将来”自然呈现分词在语境中的前瞻意义；同时不把它进一步解释为某种特定的属灵“新造”教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“写下”比单说“写”更适合保存见证的语境；“人民”较“民族”少一层政治或族裔限定。保留分号以呈现两句平行而递进的诗行。
