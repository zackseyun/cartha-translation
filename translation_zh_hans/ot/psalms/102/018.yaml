revisions:
- from: 这要为后来的世代写下；将来受造的人民必赞美雅[a]。
  to: 要为后来的世代写下这；将要受造的民必赞美雅[a]。
  rationale: 本次仅作安全的语言与语序润色：将“将来受造的人民”改为“将要受造的民”，使未来指向和被动含义更清楚、语体更贴近诗篇；调整首句语序以提升现代汉语自然度。保留“雅”及脚注，维持对短式神名יָהּ与完整神名的词形区别，且未将“受造的民”解释为任何特定教义群体。
