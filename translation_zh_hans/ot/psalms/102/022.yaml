  text: בְּ/הִקָּבֵ֣ץ עַמִּ֣ים יַחְדָּ֑ו וּ֝/מַמְלָכ֗וֹת לַ/עֲבֹ֥ד אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/022.yaml
  text: when peoples gather together[a], and kingdoms[c][b], to serve Yahweh—
translation:
  language: zh_hans
  text: 当万民和列国聚集[a]在一起，来事奉[b]耶和华时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被聚集”；原文形式可突出万民和列国被召聚在一起，但没有说明召聚者。
    reason: lexical_alternative
  - marker: b
    text: “事奉”在以神为对象时也可译作“敬拜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִקָּבֵץ
  choice: 当……聚集……时
  rationale: 介词 בְּ 加 קבץ 的尼法勒不定式在此构成时间表达。现代汉语用“当……时”自然清楚；“聚集”本身也可表达众人会聚的事件，而不必补出原文未说明的召聚者。
- source_word: עַמִּים
  choice: 万民
  rationale: עַמִּים 是复数，指众多民族或族群。“万民”是自然庄重的现代圣经用语，保留其群体性与复数范围，并避免局限于现代民族国家。
- source_word: יַחְדָּו
  choice: 在一起
  rationale: 该副词强调共同会聚。“在一起”是现代汉语中自然直接的表达。
- source_word: וּמַמְלָכוֹת
  choice: 和列国
  rationale: מַמְלָכוֹת 字面指多个王国或国度；在本句中与“万民”并列作聚集的主体。“列国”简洁自然，也保留政治共同体的含义。
- source_word: לַעֲבֹד
  choice: 事奉
  rationale: עבד 以神为宾语时兼有服事、敬拜之意。“事奉”保留较宽的服事含义，同时在中文宗教语境中自然包含敬拜性的服事。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中最广为人知的专名形式表达四字神名，使普通读者可辨识这是神的专名，而非一般称号。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉的专名“耶和华”；“雅威”是较接近学界重构读音的另一种音译，但原始读音并不能完全确定。
- issue: עבד 是否应收窄为“敬拜”
  choice: 事奉
  alternative: 敬拜
  rationale: 该动词在以神为对象时确可包含敬拜，但词义范围更广。译作“事奉”避免把原文的服事含义收窄，同时以脚注说明“敬拜”的可能表达。
- issue: 聚集动作的主动态或被动态
  choice: 聚集
  alternative: 被召聚
  rationale: 尼法勒形式可突出被聚集的状态，但原文没有指出施事者。汉语“聚集”可自然表达会聚事件，不必明确判定为主动或补出召聚者；脚注保留被动理解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式保留原文的时间从句性质；“万民和列国”作为并列主体，避免依照希伯来语词序生硬拆开。脚注标记均紧随相关词语。
