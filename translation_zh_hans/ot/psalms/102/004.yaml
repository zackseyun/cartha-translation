  text: My heart is struck like grass and withered[c][b][a], for I forget to eat my bread.
translation:
  language: zh_hans
  text: 我的心像草一样被击打，枯干了；因为我忘了[a]吃我的饼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我忘了”也可译作“我已忘记”；希伯来语完成式可指已经发生而其影响仍在的事，也可在这里描述苦难中持续的状态。
    reason: lexical_alternative
  - marker: b
    text: “我的饼”也可泛指“我的食物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּכָּה
  choice: 遭受击打
  rationale: 保留希伯来语被动式“被击打、受重创”的力量，同时避免用“受伤”等词缩小原词的含义。
- source_word: כָעֵשֶׂב
  choice: 像草一样
  rationale: 直译草的比喻，表现生命在打击下迅速枯萎的脆弱。马所拉重音支持将这一比喻首先与“遭受击打”相连。
- source_word: וַיִּבַשׁ
  choice: 已经枯干
  rationale: 动词意为变干、枯萎；“枯干”自然承接草的意象，“已经”体现叙事形式所表达的结果状态。
- source_word: לִבִּי
  choice: 我的心
  rationale: 保留诗歌中的核心人体意象；这里指人的内在生命，包括情感、意志和精神状态。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出诗人内在枯干的具体表现或原因，现代汉语用“因为”清楚自然。
- source_word: שָׁכַחְתִּי
  choice: 我忘了
  rationale: 希伯来语完成式可表示已经发生、其影响延续至今的事；“忘了”在汉语中简洁自然，也可由语境理解为苦难中持续出现的情况。
- source_word: מֵאֲכֹל
  choice: 吃
  rationale: 原文是介词加不定式，字面为“离开吃”；在“忘了”之后译作“忘了吃”符合现代汉语习惯。
- source_word: לַחְמִי
  choice: 自己的饼
  rationale: לֶחֶם 的具体义是饼，也可泛指食物；正文保留具体意象，并以脚注说明广义。
