  text: לִ֭/שְׁמֹעַ אֶנְקַ֣ת אָסִ֑יר לְ֝/פַתֵּ֗חַ בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/020.yaml
  text: to hear the groaning of the prisoner[a], to release the sons of death,
translation:
  language: zh_hans
  text: 为要听见囚徒的呻吟，释放那些注定死亡的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“死亡之子”。也可指“被判死刑的人”。
    reason: 说明希伯来语习语的字面形式，并保留其可能指已受死刑判决者的解释。
lexical_decisions:
- source_word: לִשְׁמֹעַ
  choice: 为要听见
  rationale: 不定式附加 ל־，承接上文表达目的或结果；“听见”直接保留 שׁמע 的基本意义，“为要”则显明其句法关系。
- source_word: אֶנְקַת
  choice: 呻吟
  rationale: 该词指人在痛苦中的呻吟或叹息；“呻吟”较能传达深重苦难。
- source_word: אָסִיר
  choice: 囚徒
  rationale: 指被捆绑或监禁的人；原文为单数，可作集合性称呼，译作“囚徒”简洁自然。
- source_word: לְפַתֵּחַ
  choice: 释放
  rationale: פתח 本义为“打开”，在此以受死亡拘束的人为对象，语境义是使其得释放。
- source_word: בְּנֵי תְמוּתָה
  choice: 死亡之子
  rationale: 直译原文的闪族语式，保留其强烈意象及“注定死亡”与“被判死刑”之间的语义张力，并以脚注说明。
theological_decisions:
- issue: “死亡之子”所指对象的具体处境
  choice: 正文保留“死亡之子”
  alternative: “注定要死的人”或“被判死刑的人”
  rationale: 原文没有明确说明他们是因处境而必死，还是已被判处死刑；直译并加注可避免过早限定。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“为要”保留本节两个不定式与上文的目的关系；两个分句结构平行。
