  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ בְּ/י֪וֹם צַ֫ר לִ֥/י הַטֵּֽה אֵלַ֥/י אָזְנֶ֑/ךָ בְּ/י֥וֹם אֶ֝קְרָ֗א מַהֵ֥ר עֲנֵֽ/נִי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/002.yaml
  text: Do not hide your face from me in the day of my distress[a]; incline your ear to me. In the day I call[c][b], answer me quickly.
translation:
  language: zh_hans
  text: 在我遭难的日子，求你不要向我掩面[a]；求你向我侧耳。在我呼求的日子，求你快快回应我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掩面”也可按其含义译为“不向我显出你有恩的临在”；希伯来文的“面”可指上帝有恩的临在。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“求你赶快回答我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּסְתֵּר
  choice: 求你不要……掩
  rationale: אַל加未完成式在祷告中表达恳切禁止；加入“求你”符合现代汉语祈求语气，“掩”保留סתר“隐藏、遮掩”的基本意义。
- source_word: פָּנֶיךָ מִמֶּנִּי
  choice: 向我掩面
  rationale: 直译意为“把你的脸向我隐藏”。“向我掩面”是自然而庄重的汉语祷告表达，也保留希伯来文“脸”所承载的临在与恩宠意象。
- source_word: בְּיוֹם צַר לִי
  choice: 我遭难的日子
  rationale: 希伯来文近于“患难临到我的日子”。译作“我遭难的日子”自然简洁，保留个人所受困苦与时间结构。
- source_word: הַטֵּה אֵלַי אָזְנֶךָ
  choice: 求你向我侧耳
  rationale: 保留“使耳朵倾向我”的具体拟人意象；“侧耳”在现代汉语中仍清楚、庄重，表示留心垂听。
- source_word: בְּיוֹם אֶקְרָא
  choice: 我呼求的日子
  rationale: 保留本节两次בְּיוֹם“……的日子”的平行结构；在哀歌祷告语境中，“呼求”比单纯“呼叫”更准确自然。
- source_word: מַהֵר עֲנֵנִי
  choice: 求你快快应允我
  rationale: מַהֵר可作副词“迅速地”，也可带有“赶快”的催促力。“快快应允我”传达紧迫感；“应允”适合神回应祷告的语境。
theological_decisions:
- issue: 对上帝使用“面”和“耳”的拟人语言
  choice: 正文保留“掩面”和“侧耳”的具体意象
  alternative: 解释性译为“不要离开我”及“求你垂听我”
  rationale: 原文以身体意象表达上帝有恩的临在和留心聆听。保留诗歌意象既忠于文本，也不必据此断言上帝具有人的身体。
- issue: 重复的时间短语בְּיוֹם
  choice: 分别译作“我遭难的日子”和“我呼求的日子”
  alternative: 顺译为“我遭难时”和“我呼求时”
  rationale: 保留重复可呈现原诗的平行结构与迫切语势；“……的日子”在现代汉语中虽略显庄重，但仍自然可懂。
- issue: מַהֵר的句法力度
  choice: 译作“快快”，修饰“应允我”
  alternative: 译作独立催促语“求你赶快，应允我”
  rationale: 原文可理解为迅速应允，也可表达“赶快回答”的催促；正文采用自然汉语表达共同核心意义，并以脚注保留另一种措辞可能。
translation_notes:
  register: 采用现代、庄重而可懂的祷告语言。保留“掩面”“侧耳”的希伯来诗歌意象及两次“……的日子”的平行结构；用“遭难”“呼求”“应允”维持诗篇哀歌的语域，但避免过度古雅。
