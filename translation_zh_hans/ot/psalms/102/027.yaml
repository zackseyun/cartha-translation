source:
  edition: WLC
  text: וְ/אַתָּה ה֑וּא וּ֝/שְׁנוֹתֶ֗י/ךָ לֹ֣א יִתָּֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/027.yaml
  text: But you are the same[a], and your years will not come to an end.
translation:
  language: zh_hans
  text: 但你始终如一[a]；你的年岁永无穷尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你就是他”，可理解为“你仍是同一位”或“你始终不变”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 但你
  rationale: 连接词在此承接上文受造物会灭没、改变的陈述，带出鲜明对比；现代汉语用“但你”自然准确。
- source_word: הוּא
  choice: 始终如一
  rationale: 字面为“你是他/你就是那一位”，此处与受造物的变迁相对，表达上帝恒常保持其自身身份。“始终如一”自然传达这一惯用语的力量，同时以脚注保留字面形式及其他可能译法。
- source_word: וּ/שְׁנוֹתֶי/ךָ
  choice: 你的年岁
  rationale: שָׁנָה 的复数附第二人称阳性单数后缀，直指“你的年岁”；“年岁”符合诗体语域。
- source_word: לֹא יִתָּמּוּ
  choice: 永无穷尽
  rationale: תמם 的未完成式在否定词 לֹא 后表示绝不结束或耗尽；“永无穷尽”以简洁诗性汉语表达持续不终止之意。
theological_decisions:
- issue: “你是他”这一惯用表达与上帝恒常不变之间的关系
  choice: 始终如一
  alternative: 你就是那一位；你仍是一样
  rationale: 本节强调上帝持久不变的身份，与受造界的消逝和改变相对。“始终如一”传达经文本身的神学张力，但不加入超出原文的哲学术语；脚注保留字面表达及其歧义范围。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“年岁”和“穷尽”保留诗篇的尊严感；分号呈现两句平行陈述。
