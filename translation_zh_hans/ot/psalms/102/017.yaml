  text: פָּ֭נָה אֶל תְּפִלַּ֣ת הָ/עַרְעָ֑ר וְ/לֹֽא בָ֝זָ֗ה אֶת תְּפִלָּתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/017.yaml
  text: He turned to the prayer of the destitute and did not despise their prayer[a].
translation:
  language: zh_hans
  text: 他垂顾穷苦人的祷告[a]，并不藐视他们的祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穷苦人”也可译作“一无所有的人”或“孤苦无助的人”。这个希伯来词在别处也可指旷野中的灌木；这一含义在这里可能构成被剥夺、孤立无援之人的意象背景。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנָה
  choice: 垂顾
  rationale: 原义为“转向、朝向”；以祷告为对象时，现代汉语用“垂顾”能自然表达转向并留意、回应之意，同时保持庄重语体。
- source_word: תְּפִלַּת / תְּפִלָּתָם
  choice: 祷告／他们的祷告
  rationale: 两处均重复译作“祷告”，保留希伯来文的词语复现；第二处的复数词尾明确译为“他们的”。
- source_word: הָעַרְעָר
  choice: 穷苦人
  rationale: 本节因其能祷告，且后文用复数代词指称，所指是陷于匮乏、无助处境的人。“穷苦人”在现代汉语中自然，也可兼具集合性。
- source_word: בָזָה
  choice: 藐视
  rationale: 准确保留该词所含轻看、鄙弃的评价色彩，比单译为“不拒绝”更贴近原文。
- source_word: וְלֹא
  choice: 并不
  rationale: 连接两个对应分句，并突出上帝垂顾与不藐视之间的平行关系。
theological_decisions:
- issue: עַרְעָר所指的是人还是旷野灌木
  choice: 正文按处于穷苦、无助境地的人来译
  alternative: 孤苦的人；如同旷野灌木的人
  rationale: “他们的祷告”表明这里的实际所指是人；但该词在别处可指旷野灌木，可能为孤立、赤贫的意象背景，因此在脚注保留这一词义张力。
- issue: 单数类称与复数代词的转换
  choice: 用可作集合称谓的“穷苦人”，随后保留“他们”
  alternative: 穷苦者的祷告……他的祷告
  rationale: 希伯来文先用单数类称，后以复数词尾概括这一群体；中文“穷苦人”不强制标明单复数，能自然保留这种转换。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“垂顾”略带诗体色彩，但在祷告语境中通顺自然；重复“祷告”以呈现原文的平行与强调。
