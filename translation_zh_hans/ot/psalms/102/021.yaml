source:
  edition: WLC
  text: לְ/סַפֵּ֣ר בְּ֭/צִיּוֹן שֵׁ֣ם יְהוָ֑ה וּ֝/תְהִלָּת֗/וֹ בִּ/ירוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/021.yaml
  text: to declare the name of Yahweh in Zion[a], and his praise in Jerusalem,
translation:
  language: zh_hans
  text: 好在锡安传扬耶和华的名，在耶路撒冷赞美他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסַפֵּר
  choice: 传扬
  rationale: 该词为带 לְ 的 Piel 不定式，在上下文中表示目的或结果；与“耶和华的名”连用时，指公开宣告、传颂，而非单纯叙述。
- source_word: בְּצִיּוֹן
  choice: 在锡安
  rationale: 介词 בְּ 与地名连用，此处自然译为“在”；“锡安”采用现代中文圣经传统中通行的专名形式。
- source_word: שֵׁם יְהוָה
  choice: 耶和华的名
  rationale: 保留“名”的原文意象，涵盖上帝所启示的身份与声誉；יְהוָה 采用现代中文最通行且庄重的专名形式“耶和华”。
- source_word: וּתְהִלָּתוֹ
  choice: 赞美他
  rationale: תְהִלָּה 带第三人称阳性单数后缀，字面可作“他的赞美”，实际指归给他或述说他的赞美；中文译为“赞美他”更自然，并与前面的不定式共享目的关系。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词 בִּ 与城名连用译为“在”；“耶路撒冷”为通行中文名称。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。正文保留专名而不以“主”这一称号替代；“耶和华”是现代普通中文读者最熟悉、最易识别的形式，同时不额外引入宗派性解释。
- issue: וּתְהִלָּתוֹ 的关系含义
  choice: 赞美他
  alternative: 传扬他的赞美
  rationale: 希伯来语表达较凝练，既可理解为向他献上赞美，也可理解为述说关于他的赞美。正文采用自然中文“赞美他”，不将其明确收窄为“美名”或“功绩”。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。以“好在……”承接上一节的目的或结果关系；两处分句保持锡安与耶路撒冷的诗歌平行。
