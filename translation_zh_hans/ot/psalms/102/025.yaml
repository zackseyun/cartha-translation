  yaml_path: translation/ot/psalms/102/025.yaml
  text: Long ago you founded the earth[a], and the heavens are the work of your hands.
translation:
  language: zh_hans
  text: 很久以前，你奠定了大地[a]；诸天是你双手所造的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你为大地立定了根基。”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: 很久以前
  rationale: 该词在此作时间副词，意为“从前、古时”。“很久以前”是自然的现代汉语，也保留了诗句所强调的久远时间。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 本词与“诸天”构成宇宙性的平行结构，因此指整个地，而非某一地区或土地；“大地”兼具清晰度和诗体庄重感。
- source_word: יָסַדְתָּ
  choice: 你奠定了
  rationale: יסד带有立定根基、奠基的意象。“奠定”简洁地保留这一创造图像；脚注列出更显明的表达。
- source_word: וּמַעֲשֵׂה
  choice: 是……的杰作
  rationale: 原文为无系词名词句，汉语补出“是”。מַעֲשֵׂה在此指双手所做成之物；“杰作”自然而庄重，也呈现创造者手艺的诗性意象。
- source_word: יָדֶיךָ
  choice: 你双手的
  rationale: 保留原文以“双手”描写上帝创造作为的拟人表达，不将其抽象化。
- source_word: שָׁמָיִם
  choice: 诸天
  rationale: “诸天”既对应希伯来语形式，也保持诗歌的崇高语域，并与“大地”形成宇宙性的对举。
theological_decisions:
- issue: 创造作为直接归于上帝
  choice: 保留第二人称直述：上帝奠定大地，诸天是他双手的杰作。
  alternative: 将拟人性的“双手”弱化为抽象的“创造”。
  rationale: 原文祷告直接把宇宙的创造归于上帝，并有意使用“双手”的拟人图像；译文不应削弱这项宣告或消除其诗性张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“很久以前”清楚表达时间意义；“奠定了大地”保留奠基意象；分号呈现两行之间的平行关系。
