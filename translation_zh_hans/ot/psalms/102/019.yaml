  yaml_path: translation/ot/psalms/102/019.yaml
  text: For he looked down from his holy height; the LORD gazed from heaven to earth,
translation:
  language: zh_hans
  text: 因为他从他圣洁的高处俯视；耶和华从天上观看大地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁקִיף
  choice: 俯视
  rationale: 该词表示从高处向下观看；“俯视”自然保留了方向和视点。
- source_word: מְרוֹם קָדְשׁוֹ
  choice: 自己的圣洁高处
  rationale: 直译其“他的圣洁之高处”结构；“自己的”明确回指主语，并保留“圣洁”修饰高处的原文表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，区别于一般称谓“主”。
- source_word: הִבִּיט
  choice: 察看
  rationale: 与前一动词形成适度变化，同时表达专注观看，而不过度增添审视或干预之意。
- source_word: מִשָּׁמַיִם אֶל אֶרֶץ
  choice: 从天上察看大地
  rationale: 保留“从天上”这一来源视点；中文以“大地”自然表达无冠词的 אֶרֶץ，此处不必机械译出方向介词“向”。
theological_decisions:
- issue: “圣洁”所修饰的对象
  choice: 圣洁高处
  alternative: 圣所的高处／至圣高处
  rationale: 原文构造可直观理解为“他的圣洁高处”；不将其具体化为圣殿或某一宇宙地点，以免超出经文。
- issue: 神名的表达
  choice: 耶和华
  alternative: 上主／雅威
  rationale: 保留专名功能，并采用简体中文传统中最广为人知的形式，不借译法引入宗派立场。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。分号对应希伯来诗歌的平行结构；“俯视／察看”既体现两个近义动词，也避免生硬重复。
