  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקּוֹל
  choice: 因……发出
  rationale: מִן与קוֹל连用，在此可表示原因，也可较直译为“从……的声音”。正文采用自然的因果表达，并以脚注保留其来源义的可能。
- source_word: אַנְחָתִי
  choice: 我发出呻吟
  rationale: אַנָחָה表示人在痛苦中发出的叹息或呻吟；“呻吟”符合本节强烈的身体痛苦意象。
- source_word: דָּבְקָה
  choice: 紧贴着
  rationale: דבק表示黏附、紧紧贴住；“紧贴着”在现代汉语中自然，也保留消瘦至极的具体画面。
- source_word: עַצְמִי
  choice: 我的骨头
  rationale: עֶצֶם虽为单数形式，在此作集合意义，汉语用“骨头”可自然指全身骨骼。
- source_word: לִבְשָׂרִי
  choice: 我的皮肉
  rationale: בָּשָׂר的基本义为“肉、肉身”，在极度消瘦的语境中可接近“皮肤”。“皮肉”既保留“肉”的词义，又让骨头紧贴身体外层的意象在汉语中清楚可感。
