  text: דָּ֭מִיתִי לִ/קְאַ֣ת מִדְבָּ֑ר הָ֝יִ֗יתִי כְּ/כ֣וֹס חֳרָבֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/006.yaml
  text: I am like a desert owl[b][a]; I have become like an owl among the ruins.
translation:
  language: zh_hans
  text: 我像旷野中的鹈鹕[a]，成了废墟里的鸮鸟[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我像荒漠中的鸮鸟”。希伯来语鸟名קָאַת所指的具体鸟类不能确定；传统译法常作“鹈鹕”。
    reason: lexical_alternative
  - marker: b
    text: 或译“废墟里的小鸮”。希伯来语כּוֹס所指的具体鸟类不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּמִיתִי
  choice: 我像
  rationale: 该词在此表达相似、可比的状态；用“我像”自然简洁，也适合诗歌的平行结构。
- source_word: לִקְאַת
  choice: 鹈鹕
  rationale: קָאַת所指鸟类不能确定；“鹈鹕”承接古老译本及传统译法，同时以脚注保留“荒漠鸮”等可能解释。
- source_word: מִדְבָּר
  choice: 旷野
  rationale: מִדְבָּר指无人耕种的荒僻之地，不必限定为沙漠；“旷野”既准确，又符合本节孤寂荒凉的意象。
- source_word: הָיִיתִי
  choice: 成了
  rationale: היה的完成式可表达已经进入并处于某种状态；“成了”保留这一结果意味。
- source_word: כְּכוֹס
  choice: 鸮鸟
  rationale: כּוֹס在此是鸟名而非“杯”；具体种类不确定。“鸮鸟”保留猫头鹰类夜行鸟的意象，而不武断指定具体物种。
- source_word: חֳרָבוֹת
  choice: 废墟里
  rationale: 该复数名词指毁坏、荒废之处；“废墟里”以自然现代汉语呈现其场景。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以“旷野—废墟”的平行场景凸显诗人的孤寂；两个不确定的鸟名均以脚注说明，不把物种判断绝对化。
