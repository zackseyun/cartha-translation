  text: תְּ֭פִלָּה לְ/עָנִ֣י כִֽי יַעֲטֹ֑ף וְ/לִ/פְנֵ֥י יְ֝הוָ֗ה יִשְׁפֹּ֥ךְ שִׂיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/000.yaml
  text: A prayer of the afflicted one when he grows faint and pours out his complaint before Yahweh[a][b].
translation:
  language: zh_hans
  text: 困苦人发昏[a]时，在雅威面前倾吐苦情[b]的祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发昏”或译“不堪重负”。
    reason: lexical_alternative
  - marker: b
    text: “苦情”或译“默想”或“哀诉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: 祷告
  rationale: 作为诗篇标题的名词性开头，简洁保留其体裁说明。
- source_word: לְעָנִי
  choice: 困苦人
  rationale: לְ 在标题中可表示所属或相关；עָנִי 指受苦、受压或贫困的人。“困苦人”兼顾范围，也不额外强化经济贫穷或性别。
- source_word: כִי
  choice: ……时
  rationale: 此处引出祷告发生的情境，按时间义处理最符合标题结构。
- source_word: יַעֲטֹף
  choice: 心力交瘁
  rationale: 该动词可表达衰弱、昏沉或被压垮；“心力交瘁”自然传达困苦者几近支撑不住的状态，同时以脚注保留另一可能。
- source_word: וְלִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示“在……面前”；按项目既定方针将圣名 יְהוָה 音译为“雅威”。
- source_word: יִשְׁפֹּךְ
  choice: 倾诉
  rationale: 原文直译为“倾倒”，与 שִׂיחוֹ 连用指将内心的话倾吐出来；“倾诉”在现代汉语中自然保留这一意象。
- source_word: שִׂיחוֹ
  choice: 苦情
  rationale: שִׂיחַ 可指沉思、诉说、怨诉或哀歌；在困苦祷告的语境中，“苦情”体现哀诉意味，并用脚注保留语义歧义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也明确保留专名性质，不以称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇标题体。调整汉语语序，把“时的祷告”置于句末，使标题自然连贯；正文中的[a]、[b]与脚注逐一对应。
