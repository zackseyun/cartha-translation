source:
  edition: WLC
  text: אֹמַ֗ר אֵלִ֗/י אַֽל תַּ֭עֲלֵ/נִי בַּ/חֲצִ֣י יָמָ֑/י בְּ/ד֖וֹר דּוֹרִ֣ים שְׁנוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/024.yaml
  text: I say[a], “My God, do not take me away in the middle of my days[b]; your years are through all generations.”
translation:
  language: zh_hans
  text: 我说：“我的神啊，不要在我年日过半时把我带走[a]；你的年数存到世世代代[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“使我上去”。这里很可能是指在人生中途被带离人世。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“从一代到一代”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: 我说
  rationale: אמר 的 Qal 未完成式第一人称单数在诗歌中可表达当前或将来的言说，也可作近似过去时的引语引介。此处用“我说”保留生动的祈求语气，也不把时态限定得过死。
- source_word: אֵלִי
  choice: 我的神啊
  rationale: 该词由“神”与第一人称单数后缀构成，意为“我的神”；语境中是直接呼告，因此以“啊”自然表达呼格。
- source_word: אַל
  choice: 不要
  rationale: אַל 与未完成式或祈愿式连用，通常表达禁止或恳求；“不要”符合此处祷告的语气。
- source_word: תַּעֲלֵנִי
  choice: 把我带走
  rationale: 这是 עלה 的 Hiphil 第二人称阳性单数形式，带第一人称单数宾语后缀，字面可作“使我上去”。结合“年日过半”的生命语境，此处很可能指过早被带离人世；“把我带走”既传达语境意义，又保留委婉性。
- source_word: בַּחֲצִי יָמָי
  choice: 在我年日过半时
  rationale: 字面为“在我年日的一半”；“在我年日过半时”保留以“年日”指一生的诗歌意象，并自然表达生命尚未走完。
- source_word: בְּדוֹר דּוֹרִים
  choice: 存到世世代代
  rationale: 这一希伯来语结构表达世代相继、绵延不绝。“世世代代”是自然庄重的现代汉语，并与神恒久的“年数”相配。
- source_word: שְׁנוֹתֶיךָ
  choice: 你的年数
  rationale: 复数名词带第二人称阳性单数后缀，直指神的年数；与诗人的有限年日形成鲜明对照。
theological_decisions:
- issue: 祷告中以委婉、具象的说法指向死亡
  choice: 将 תַּעֲלֵנִי 译为“把我带走”
  alternative: “使我上去”或“把我除去”
  rationale: 上下文将诗人可能被缩短的生命与神绵延万代的年数相对照，因此该动词很可能指被带离人世。“把我带走”传达这一语境意义，但不额外说明死亡方式，也不加入宗派性解释。
- issue: 神的恒久与人的短暂之间的张力
  choice: 保留“你的年数”与“我的年日”的对照
  alternative: 意译为“你却永远长存”
  rationale: 原文以双方的“日子／年数”构成诗性对照。直译这一意象可保留经文的神学张力，避免把原文具体措辞概念化。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“年日过半”保留诗歌意象；“把我带走”自然传达原文在此语境中的委婉含义。脚注分别说明动词的字面可能和世代短语的另一种译法。
