  text: For I have eaten ashes like bread[a], and mixed my drink with weeping.
translation:
  language: zh_hans
  text: 因为我吃灰烬，如同吃饼；我的饮料也掺着哭泣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的饮料也掺着眼泪。”希伯来文直译为“掺着哭泣”，也可更具体地译作“掺着眼泪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明诗人衰残哀苦的缘由，保留原文的因果关系。
- source_word: אֵפֶר
  choice: 炉灰
  rationale: 指哀悼和卑微处境中的灰烬；“炉灰”在现代汉语中比单说“灰”更具体，也避免与尘土混同。
- source_word: כַּלֶּחֶם
  choice: 如同吃饼
  rationale: 前缀 כ 表示比较；补出第二个“吃”使汉语自然，同时保留“像饼一样”的比喻。
- source_word: אָכָלְתִּי
  choice: 我吃
  rationale: 希伯来语完成式在哀歌语境中描述诗人的亲身境况；汉语不必强行标示过去或延续时态。
- source_word: שִׁקֻּוַי
  choice: 所喝的
  rationale: 这里是日常饮用之物，并非祭礼中的奠酒；“所喝的”比“我的饮料”更符合诗歌语气。
- source_word: בִּבְכִי
  choice: 和着哭泣
  rationale: 保留 בְּ 的伴随意味和名词 בְּכִי“哭泣”的抽象表达，不直接将其具体化为“眼泪”。
- source_word: מָסָכְתִּי
  choice: 和着
  rationale: 表达液体被混合、掺和的意象；与“哭泣”搭配时自然而庄重，并不误解为单纯倾倒。
