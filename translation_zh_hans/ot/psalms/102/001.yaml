  text: יְ֭הוָה שִׁמְעָ֣/ה תְפִלָּתִ֑/י וְ֝/שַׁוְעָתִ֗/י אֵלֶ֥י/ךָ תָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/001.yaml
  text: O Yahweh[a], hear my prayer, and let my cry come to you.
translation:
  language: zh_hans
  text: 雅威[a]啊，求你垂听我的祷告；愿我的呼求来到你面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文为“YHWH”（יהוה），即以色列上帝的名字；“雅威”是对该名字的常用音译。许多译本传统上以“主”代替这个名字。
    reason: 说明神名的原文形式、正文音译及传统称号性替代译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代中文读者最熟悉的专名形式“耶和华”译出四字神名，并以“啊”表达希伯来语呼格语气；脚注说明其原文及其他译法。
- source_word: שִׁמְעָה
  choice: 求你垂听
  rationale: 这是阳性单数命令式，直接祈求上帝听祷告。“垂听”自然、庄重，并在中文祈祷语境中含有恳求意味；补出“求你”以传达语用功能。
- source_word: תְפִלָּתִי
  choice: 我的祷告
  rationale: 准确对应“我的祷告”，保留第一人称所属关系和诗篇的祈祷语域。
- source_word: וְשַׁוְעָתִי
  choice: 我的呼求
  rationale: 该词指人在困苦中的呼喊，常隐含求助之意。“呼求”兼顾声音和恳求，比单纯“呼喊”更符合本句语境。
- source_word: אֵלֶיךָ
  choice: 达到你面前
  rationale: 原意是朝向“你”；与“来到”组合时表示呼求抵达上帝那里。中文用“你面前”自然表达这一方向关系，并未增加上帝必然应允的含义。
- source_word: תָבֹוא
  choice: 愿……达到
  rationale: 未完成式在此具有祈愿语气。“愿”保留这种恳求而非陈述的功能；“达到”自然传达呼求来到听者那里的意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；以“上主”代称
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中辨识度最高的音译“耶和华”，而不以称号取代专名；同时用脚注交代原文形式及常见替代译法，避免把音译问题当作确定无疑的发音结论。
- issue: “呼求达到你面前”的祈愿性质
  choice: 愿我的呼求达到你面前
  alternative: 让我的呼求达到你面前
  rationale: 希伯来语未完成式在此可作祈愿理解。“愿”符合中文祷告文体，也保留诗人恳求上帝听见的张力，而不把它改写成已经实现的陈述。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇祷告语体。分号呈现两个平行祈求；“垂听”“呼求”“愿”保持敬虔语感，但避免过度古雅。
