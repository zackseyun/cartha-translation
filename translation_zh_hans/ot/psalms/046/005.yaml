  text: אֱלֹהִ֣ים בְּ֭/קִרְבָּ/הּ בַּל תִּמּ֑וֹט יַעְזְרֶ֥/הָ אֱ֝לֹהִ֗ים לִ/פְנ֥וֹת בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/005.yaml
  text: God is within her[a]; she will not be moved[c][b]. God will help her when morning dawns.
translation:
  language: zh_hans
  text: 神在城中[a]，城必不动摇[b]；晨光初现时[c]，神必帮助她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“在她里面”或“在她中间”；“她”指上文所说的城。
    reason: lexical_alternative
  - marker: b
    text: 或译：“城必不被摇动”或“城必不倾覆”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译“在早晨转向时”，意思是黎明来到、晨光初现的时候。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本诗语境明确指以色列独一的神；现代中文以“神”自然、准确。
- source_word: בְּקִרְבָּהּ
  choice: 在城中
  rationale: 原文直译为“在她里面／她中间”。上文的阴性单数先行词是“城”；中文若仅说“在她里面”不自然，因此明示为“城”，并以脚注保留原文代词形式。
- source_word: בַּל תִּמּוֹט
  choice: 必不动摇
  rationale: בַּל是否定词，מוט的尼פעל式表达摇动、倾覆或失去稳固；“必不动摇”既保留稳定意象，也符合庄重的现代诗体中文。
- source_word: יַעְזְרֶהָ
  choice: 必帮助她
  rationale: 未完成式在此表达有把握的将来行动；“必帮助她”简洁地呈现神确定的援助，并保留阴性单数代词。
- source_word: לִפְנוֹת בֹּקֶר
  choice: 晨光初现时
  rationale: 该短语字面涉及早晨的转向或出现，语境义为破晓；“晨光初现时”用自然中文保留黎明来临的动态意象。
theological_decisions:
- issue: 阴性单数代词的所指
  choice: 首句以“城”明示其所指，末句保留“她”
  alternative: 各处均译作“她”，或解释为更广义的神子民群体
  rationale: 就近语境指向上文“神的城”。中文首句若直译“神在她里面”指代突兀，因此适度明示；末句保留人格化的阴性意象，避免把“城”进一步解释成某一特定群体。
- issue: 神帮助这城的时间表达
  choice: 晨光初现时
  alternative: 早晨转向时；黎明时；天一亮
  rationale: 原文诗性短语可指早晨出现之际。“晨光初现时”兼顾原文动态意象和现代中文可懂性，不附加神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留诗歌的简洁和平行感。为避免中文代词指向含混，首句明示“城”，末句保留“她”以体现希伯来文对城的阴性人格化。所有脚注标记均置于对应正文之后。
