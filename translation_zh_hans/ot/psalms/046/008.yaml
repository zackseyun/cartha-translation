  text: Come, see the works of the LORD, who has set desolations in the earth.
translation:
  language: zh_hans
  text: 你们来观看耶和华的作为；他在地上造成荒凉之地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ חֲזוּ
  choice: 你们来，看
  rationale: 两个复数命令式直译为邀请性的“你们来，看”，既保留原文形式，也符合现代汉语表达。
- source_word: מִפְעֲלוֹת
  choice: 作为
  rationale: 指耶和华所施行的事，译为“作为”庄重自然，并能涵盖本节所说的审判行动。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以中文圣经传统中通行的专名对应四字神名，区别于一般称谓“主”。
- source_word: שָׂם
  choice: 使
  rationale: 该动词基本义可为“放置、设立、造成”；在“荒凉”这一结果性宾语前，汉语用“使”更自然，同时不改变施事关系。
- source_word: שַׁמּוֹת
  choice: 一片荒凉
  rationale: 复数名词表示多处或深重的荒废、毁坏；“一片荒凉”在现代汉语中自然传达其景象和强度。
- source_word: בָּאָרֶץ
  choice: 大地
  rationale: 原词可指土地、地域或全地；此处保留较宽泛的宇宙地理含义，译作“大地”，不限定为某一国家。
theological_decisions:
- issue: 荒凉的施事者
  choice: 明确以耶和华为使大地荒凉者
  alternative: 将荒凉理解为仅由战争或列国造成
  rationale: 关系从句的主语承接“耶和华”，原文直接把造成或设下荒凉归于他；译文保留这一具有审判张力的陈述。
- issue: שָׂם 的语义力度
  choice: 译作“使”
  alternative: 译作“设下”或“造成”
  rationale: “使”保留结果性和神的主动作为，同时避免把抽象复数名词生硬地表达为可被摆放的实体。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“你们来，看”保留复数呼召；分号呈现由观看耶和华作为到说明其具体作为的推进。未添加原文没有的解释性内容。
