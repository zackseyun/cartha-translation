  text: Yahweh of Armies is with us[a]; the God of Jacob is a stronghold for us[c][b]. Selah
translation:
  language: zh_hans
  text: 万军的雅威与我们同在[a]；雅各的上帝是我们的高垒[b]。细拉。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“万军之耶和华与我们同在。”希伯来语“万军”可指军队或列阵的众军，也常含有天上军旅的意味。
    reason: lexical_alternative
  - marker: b
    text: “高垒”也可译作“避难所”或“高堡”。希伯来语指位于高处、稳固安全的防护之所。
    reason: lexical_alternative
  - marker: c
    text: “细拉”是希伯来语的礼仪或音乐术语，确切含义不明，因此保留音译。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现上帝的专名，不用“主”这一称号替代；这也保留了原文直接使用四字神名的特点。
- source_word: צְבָאוֹת
  choice: 统领万军的
  rationale: 该复数名词指军队、众军，也可能带有天上军旅的含义。“统领万军的”在现代汉语中自然清楚，并保留其军事及主权意象。
- source_word: עִמָּנוּ
  choice: 与我们同在
  rationale: עִם加第一人称复数词尾意为“与我们一起”；无动词句在汉语中自然译作“与我们同在”。
- source_word: מִשְׂגָּב
  choice: 高垒
  rationale: 该词表示位于高处、可供防护的坚固所在。“高垒”兼顾高度、坚固和庇护的意象。
- source_word: לָנוּ
  choice: 我们的
  rationale: 此处ל表示受益或归属；汉语用“是我们的高垒”自然表达上帝为我们提供保障。
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: 雅各的上帝
  rationale: 直译其属格结构，保留上帝与雅各及其后裔的圣约身份关联。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该礼仪或音乐术语的确切意义不明，因此采用传统音译，避免加入未经证实的解释。
theological_decisions:
- issue: 神名与称号יְהוָה צְבָאוֹת的译法
  choice: 统领万军的雅威
  alternative: 万军之耶和华；万军之主
  rationale: 原文直接使用神名יְהוָה，并以צְבָאוֹת加以限定。正文保留神名的音译，同时用自然现代汉语传达众军与主权的含义；脚注说明传统译法及“军队”的语义范围。
- issue: מִשְׂגָּב的防护意象
  choice: 我们的高垒
  alternative: 我们的避难所；我们的高堡
  rationale: “高垒”保留原词兼有高处、设防和安全庇护的具体意象，没有将其泛化为一般的“避难所”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“与我们同在”沿用普通读者熟悉且自然的圣经表达；“高垒”简洁保留诗歌的防御性意象。正文标点体现两个平行的无动词分句，末尾单列音译礼仪术语。
