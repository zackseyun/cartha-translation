  text: הַרְפּ֣וּ וּ֭/דְעוּ כִּי אָנֹכִ֣י אֱלֹהִ֑ים אָר֥וּם בַּ֝/גּוֹיִ֗ם אָר֥וּם בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/010.yaml
  text: Be still[a], and know that I am God. I will be exalted among the nations[c][b]; I will be exalted in the earth.
translation:
  language: zh_hans
  text: 你们要住手[a]，要知道我是上帝；我必在列国中受尊崇[b]，也必在大地[c]上受尊崇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“安静下来”“停止”或“放手”；希伯来语命令可指松手、不再用力或停止行动。
    reason: lexical_alternative
  - marker: b
    text: “我必受尊崇”也可译作“我受尊崇”或“我将被高举”；这里的希伯来语形式按语境可有现在或将来的意味。
    reason: alternative_reading
  - marker: c
    text: “大地”也可译作“地”或“土地”；与“列国”平行时，较广的全球意义更符合本诗语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְפּוּ
  choice: 你们要住手
  rationale: רפה的复数命令式可表示松手、停止或不再用力。“住手”自然有力，符合本诗列国动荡、战争止息的语境，同时不把命令局限为个人内心的静默。脚注保留“安静下来”“放手”等可能含义。
- source_word: וּדְעוּ
  choice: 要知道
  rationale: ידע在此为复数命令式，表示知道、认清或承认。“要知道”保持原文的直接性，也容纳认知与承认两层意味。
- source_word: כִּי
  choice: （不单独译出，以宾语从句表达）
  rationale: כִּי在这里引出所要知道的内容。现代汉语用“知道我是上帝”即可自然表达，无须机械加上“就是”。
- source_word: אָנֹכִי אֱלֹהִים
  choice: 我是上帝
  rationale: אָנֹכִי带有明确的主语强调；“我是上帝”简洁庄重，语境本身足以传达强调，无须增添“唯独”等原文没有的限定。
- source_word: אָרוּם
  choice: 我必……受尊崇
  rationale: רום的Qal未完成式可指处于高位、被高举或受尊崇。两次译作“必……受尊崇”，既表达上帝崇高地位必被彰显的确定性，也符合现代汉语诗体。脚注说明其时态语气也可作现时理解。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם指诸国或各民族群体。“列国”简洁庄重，适合诗篇语体，也避免“外邦人”可能带来的传统性限定。
- source_word: בָּאָרֶץ
  choice: 在大地上
  rationale: אֶרֶץ可指地、土地或全地；与“列国”平行时，全球范围更合语境。“大地”保留这一广阔视野，脚注同时说明“地”或“土地”的词义可能。
theological_decisions:
- issue: 开头命令 הַרְפּוּ 的力度与对象
  choice: 译作“你们要住手”，表达停止争斗和人的抗拒
  alternative: “你们要安静下来”或“你们要放手”
  rationale: 本诗以列国喧嚷、战争和上帝止息战事为背景，命令很可能要求人停止争斗并承认上帝的主权；但词本身也可表达松手或安静下来，因此不把它仅解释为军事命令或个人默想，相关张力由脚注保留。
- issue: 两次 אָרוּם 的时间与语气
  choice: 译作确定的将来：“我必……受尊崇”
  alternative: 现时陈述：“我在……受尊崇”
  rationale: 未完成式在此可表达将来或确定将实现的彰显；“必”传达这一确定性，却不把它处理成上帝需要人赋予才有的尊荣。脚注保留现时读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“住手”保留命令的力度；两个“受尊崇”形成原文的平行和反复。“也”使第二分句在现代汉语中衔接自然，但不增加新的神学内容。所有脚注标记均已置入正文。
