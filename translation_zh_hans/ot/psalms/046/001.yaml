  yaml_path: translation/ot/psalms/046/001.yaml
  text: God is our refuge and strength[b][a], a very present help in troubles.
translation:
  language: zh_hans
  text: 上帝是我们的避难所和力量；在患难中，他是极易寻得的帮助。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在患难中，他是极其容易寻得的帮助。”希伯来原文直译近于“患难中的帮助，被寻见，极其”，表达上帝在困苦中确实易于寻见、随时相助。
    reason: lexical_alternative
  - marker: b
    text: 较贴近原文词序，也可译作：“是患难中的帮助，极其容易寻见。”
    reason: previous_rendering
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 这个词在形式上是复数，但本句按单数使用，指以色列的上帝；“上帝”在现代普通话中庄重、清楚。
- source_word: לָנוּ
  choice: 我们的
  rationale: 原文直译为“给我们／对我们”；在“是”字判断句中译作“我们的”最自然，也准确表达归属关系。
- source_word: מַחֲסֶה
  choice: 避难所
  rationale: 保留原文具体的庇护之所意象，同时是现代汉语中通顺而庄重的表达。
- source_word: וָעֹז
  choice: 和力量
  rationale: עֹז通常表示力量或能力；译为“力量”保留抽象名词结构，并与“避难所”自然并列。
- source_word: עֶזְרָה
  choice: 帮助
  rationale: 该名词表示援助、帮助；汉语无需添加不定冠词，直接译作“帮助”最自然。
- source_word: בְצָרוֹת
  choice: 患难中
  rationale: 复数名词指困境、急难或患难的时刻；汉语集合性表达“患难中”自然涵盖这些多重处境。
- source_word: נִמְצָא
  choice: 可得
  rationale: 该词是מצא的尼法勒式，可表示“被找到、被发现”或“显明为”；“可得”在主文中自然表达上帝在患难中确实能够被寻见，却不把意思扩展为单纯的心理安慰。
- source_word: מְאֹד
  choice: 随时
  rationale: 原词是强烈程度副词，直译为“极其”；与נִמְצָא连用时，主文以“随时可得”传达极其容易寻得、随时在场相助的惯用含义，直译形式则在脚注中保留。
theological_decisions:
- issue: 末句压缩式谓语结构的理解
  choice: 译为“是患难中随时可得的帮助”
  alternative: 是患难中极其容易寻得的帮助
  rationale: 原文עֶזְרָה בְצָרוֹת נִמְצָא מְאֹד结构紧凑，字面近于“患难中的帮助，被寻见，极其”。主文采用自然汉语表达其可随时寻得、切实可用的含义；脚注保留较贴近字面的译法，避免把“被寻见”所含的张力完全消除。
translation_notes:
  register: 采用现代标准普通话，语气简洁、庄重，适合诗篇诵读。“避难所和力量”保留原文并列意象；末句以自然汉语呈现，同时借脚注保存希伯来文压缩结构及其真实歧义。
