  text: עַל כֵּ֣ן לֹא נִ֭ירָא בְּ/הָמִ֣יר אָ֑רֶץ וּ/בְ/מ֥וֹט הָ֝רִ֗ים בְּ/לֵ֣ב יַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/002.yaml
  text: Therefore we will not fear though the earth changes[b][a], though the mountains slip into the heart of the seas.
translation:
  language: zh_hans
  text: 因此，纵然大地改变[a]，纵然群山动摇，移到海洋深处[b]，我们也不惧怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大地纵然变换”或“大地改变时”。希伯来语动词可指改变或交换；在这里描绘的是大地失去稳定。
    reason: lexical_alternative
  - marker: b
    text: 或译：“群山在海洋深处动摇。”希伯来语“海洋”一词为复数，“深处”直译为“心”；此处可理解为群山动摇并移到海中，也可着重描写群山在海的中心处动摇。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接上一节关于上帝是避难所和力量的宣告，明确表达由此得出的信心。
- source_word: לֹא נִירָא
  choice: 我们也不惧怕
  rationale: 未完成式在此表达面对灾变时坚定的信心与决意；“也”自然呼应前面的两个让步分句。
- source_word: בְּהָמִיר אָרֶץ
  choice: 大地纵然改变
  rationale: בְ加不定词可表示伴随或让步情形；המיר基本义涉及改变、变换。译文保留其宽泛语义，不把具体灾变方式说死。
- source_word: וּבְמוֹט הָרִים
  choice: 群山纵然动摇，移入
  rationale: מוט表示失去稳固、摇动或移位。正文以“动摇，移入”呈现山体失稳并进入海中的宏大图景，同时用脚注保留较少方向性的理解。
- source_word: בְּלֵב יַמִּים
  choice: 众海深处
  rationale: לֵב字面为“心”，空间用法指内部、中心或深处；יַמִּים是复数，故以“众海”保留原文复数和诗歌气势。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句式把两个让步分句置于“不惧怕”之前，以自然呈现希伯来诗句的逻辑；保留“大地”“群山”“众海”的宇宙性意象，并借脚注说明“改变”、山体位移方向以及“海心”隐喻所含的歧义。
