  text: נָהָ֗ר פְּלָגָ֗י/ו יְשַׂמְּח֥וּ עִיר אֱלֹהִ֑ים קְ֝דֹ֗שׁ מִשְׁכְּנֵ֥י עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/004.yaml
  text: A river—its streams make glad the city of God[b][a], the holy dwelling place of the Most High.
translation:
  language: zh_hans
  text: 有一道河，它的支流使上帝的城欢喜——至高者的圣洁居所[b]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“一道河——它的支流使上帝的城欢喜。”希伯来文诗句开头没有动词；正文补出“有”，使汉语更自然。
    reason: lexical_alternative
  - marker: b
    text: “居所”原文为复数，直译可作“至高者的圣洁居所们”或“至高者众居所的圣所”，但汉语不宜如此表达。该复数也可能概括指神圣的居住范围；正文以集合性的“居所”表达。
    reason: alternative_reading
lexical_decisions:
- source_word: נָהָר
  choice: 有一道河
  rationale: 希伯来文以无冠词名词开篇，构成无动词的诗行。“有一道河”在现代汉语中自然地表达其不定指意义；原文更突兀的“一道河——”可作为脚注中的形式对应译法。
- source_word: פְּלָגָיו
  choice: 它的支流
  rationale: 复数名词带第三人称阳性单数后缀，回指“河”。“支流”既体现复数，又自然表达河流分出的水道。
- source_word: יְשַׂמְּחוּ
  choice: 使……欢喜
  rationale: Piel未完成式复数表达致使之意，即这些支流给上帝的城带来喜乐；“使……欢喜”保留其因果力度和诗体庄重感。
- source_word: עִיר אֱלֹהִים
  choice: 上帝的城
  rationale: 直接表达构造链关系，简洁、庄重，也符合现代汉语圣经语体。
- source_word: קְדֹשׁ
  choice: 圣地
  rationale: 该阳性单数形式可作名词理解，意为“圣所、圣地”，并与前面的“上帝的城”形成同位说明；译作“圣地”避免不自然地把单数“圣”直接修饰后面的复数“居所”。
- source_word: מִשְׁכְּנֵי
  choice: 居所
  rationale: 原文是复数构造形式，指至高者的住处或神圣居住范围。汉语“居所”本身不强制标明单复数，既保持自然，也不武断地将其限定为单数；复数形式在脚注中交代。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 这是上帝的称号，意为“至高者”；此译法准确、庄重，并保留称号的神学分量。
theological_decisions:
- issue: מִשְׁכְּנֵי 的复数形式应否明确译成多个居所
  choice: 正文用数目中性的“居所”，脚注说明原文为复数
  alternative: 众居所／居所之处／圣所
  rationale: 希伯来文明确采用复数，但该复数可能指神圣区域中的诸住处，也可能具有诗性的集合或强化作用。现代汉语硬译“众居所”生涩，直接译为单一“圣所”又会抹去复数，因此以数目中性的“居所”配合脚注，兼顾原文透明度与自然表达。
- issue: קְדֹשׁ 与 מִשְׁכְּנֵי עֶלְיוֹן 的句法关系
  choice: 理解为“圣地”，与“上帝的城”构成同位关系
  alternative: 理解为形容词“圣洁的”，修饰“居所”
  rationale: קְדֹשׁ 是阳性单数，而 מִשְׁכְּנֵי 是复数；将前者名词化为“圣地／圣所”能保留形态差异，并形成“上帝的城——至高者居所的圣地”这一连贯同位结构，同时不排除传统上将整短语理解为神圣居所的可能。
- issue: 诗行开头是否补出存在句
  choice: 正文译作“有一道河”
  alternative: 一道河——
  rationale: 希伯来文是无动词的突显式诗行开头。现代汉语补出“有”可自然表达存在意义，但脚注保留更贴近原文形式的选择，避免把补词当作原文明确出现的动词。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“有一道河”保持流畅，“使……欢喜”保留原文的致使语义；分号凸显后半句对“上帝的城”的同位说明。正文中的脚注标记按出现顺序列为[a]、[b]。
