id: PSA.46.9
reference: Psalms 46:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַשְׁבִּ֥ית מִלְחָמוֹת֮ עַד קְצֵ֪ה הָ֫/אָ֥רֶץ קֶ֣שֶׁת יְ֭שַׁבֵּר וְ/קִצֵּ֣ץ חֲנִ֑ית עֲ֝גָל֗וֹת יִשְׂרֹ֥ף בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/009.yaml
  text: He makes wars cease to the end of the earth[a]; he breaks the bow and cuts the spear in two[b]; he burns the wagons with fire.
translation:
  language: zh_hans
  text: 他使战争止息，直到地极；他折断弓，砍断长矛[b]，把车辆[a]用火焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“战车”。希伯来文更直接的意思是“车”或“货车”，但因这里是战争语境，也可理解为战车。
    reason: lexical_alternative
  - marker: b
    text: “砍断”也可译作“砍掉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּית מִלְחָמוֹת
  choice: 使战争止息
  rationale: מַשְׁבִּית是שׁבת的使役分词，表达“使……停止”；“使战争止息”既保留使役含义，也符合诗歌语体。
- source_word: עַד קְצֵה הָאָרֶץ
  choice: 直到地极
  rationale: 直译为“直到大地的尽头”；“直到地极”简洁庄重，并保留范围延伸至全地边界的意象。
- source_word: קֶשֶׁת יְשַׁבֵּר
  choice: 折断弓
  rationale: יְשַׁבֵּר表示打破、折断；用于弓时，“折断”自然具体。单数“弓”按希伯来诗歌用法泛指这一类兵器。
- source_word: וְקִצֵּץ חֲנִית
  choice: 砍断长矛
  rationale: קצץ表示砍断、砍掉；“砍断长矛”自然呈现毁坏兵器的动作，又不额外加入“成两截”等原文未明说的细节。
- source_word: עֲגָלוֹת
  choice: 车辆
  rationale: 该词通常指有轮的车、货车或车辆，并非希伯来文中通常表示战车的专门词。上下文虽属战争场景，正文仍优先采用较直接的词义，并以脚注保留“战车”这一语境性译法。
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: 用火焚烧
  rationale: 保留“以火焚烧”的具体意象；“焚烧”符合诗篇庄重而有力的语体。
theological_decisions:
- issue: 战争语境中עֲגָלוֹת所指的车辆类型
  choice: 车辆
  alternative: 战车
  rationale: 原词通常指车或货车，而非通常所用的“战车”一词。军事语境使“战车”成为可理解的解释性译法，但正文不应越过原词本身的概括性；两者不涉及教义差异。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。三个毁坏兵器与军用车辆的动作保持紧凑并列；保留“直到地极”的空间意象。脚注标记按各自所解释的词语放置。
