- source_word: יֶהֱמוּ
  choice: 咆哮
  rationale: 该词描写喧嚣轰鸣；用于海水时，“咆哮”自然保留了强烈的听觉意象。
- source_word: יֶחְמְרוּ
  choice: 翻腾
  rationale: 该词在水的语境中可描写浑浊、起沫或激荡；“翻腾”既自然，又避免把未必明确的“泡沫”意象说得过死。
- source_word: מֵימָיו
  choice: 海水
  rationale: 三单阳性后缀回指上一节的“海”；中文以“海水”明确承接，比直译“它的水”更自然。
- source_word: יִרְעֲשׁוּ
  choice: 震动
  rationale: 该动词表示剧烈摇动或震颤；“震动”与群山搭配自然，并保留地动般的力度。
- source_word: הָרִים
  choice: 群山
  rationale: 以“群山”自然表达带定冠词的复数名词，并呈现诗歌场景中的山岭整体。
- source_word: בְּגַאֲוָתוֹ
  choice: 因海水高涨
  rationale: גאוה可指高昂、骄傲、威势或水势上涨；在汹涌海水的直接语境中，取物理性的“高涨”，同时用脚注保留“威势”等可能。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切功能不明，可能是礼仪或音乐标记；采用中文圣经传统音译，避免对意义作过度断定。
