  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/007.yaml
  text: Yahweh of Armies is with us; the God of Jacob is a stronghold for us[a]. Selah
translation:
  language: zh_hans
  text: 万军之耶和华与我们同在；雅各的上帝是我们的堡垒[a]。细拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒”也可译作“高台”或“避难所”。
    reason: 原词 מִשְׂגָּב 指难以攻取的高处或防御据点，也可引申指安全的避难处；脚注保留其地势与庇护两方面的词义范围。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之上帝专名的功能，而不以“主”这一称号替代。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 在固定称号“万军之耶和华”中表达众军、天上众军或一切军旅的统帅含义；中文自然庄重，也保留希伯来语所具有的军事与宇宙性张力。
- source_word: עִמָּנוּ
  choice: 与我们同在
  rationale: 直接表达临在、联合和护佑；“同在”在现代中文中自然，并保留原文简洁的宣告语气。
- source_word: מִשְׂגָּב
  choice: 保障
  rationale: 该词指难以攻取的高处、坚固庇护所；“保障”简明表达安全和保护作用，同时不把意象过度限定为具体建筑。
- source_word: לָנוּ
  choice: 我们的
  rationale: 将受益或关系性的介词短语自然译为所属结构“我们的保障”，准确表达上帝对诗歌群体而言是安全庇护。
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: 雅各的上帝
  rationale: 直译属格结构，保留“雅各”这一祖先之名及其与以色列圣约历史的联系。
- source_word: סֶלָה
  choice: 细拉
  rationale: 此词确切作用不明，可能是礼仪或音乐术语，因此采用传统音译，不作推测性解释。
theological_decisions:
- issue: 神圣称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 万军之主；雅威—众军之主
  rationale: 原文直接使用四字神名，并以“众军”构成称号。采用中文通行专名“耶和华”，既不把专名降为称号“主”，又让普通现代中文读者容易辨认；“万军之”保留其统帅众军的广阔含义。
- issue: מִשְׂגָּב 的防御性意象
  choice: 保障
  alternative: 高台；堡垒；避难所
  rationale: 原词含安全高处或坚固据点的意象，但经文重点也在其保护功能。“保障”避免过度指定建筑形态；脚注补出更具象的可能译法，以保存词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。分号对应两个平行宣告；“同在”“保障”简洁有力。“细拉”以括号标示其可能具有礼仪或音乐提示性质，但不解释其不确定含义。
