id: PSA.46.6
reference: Psalms 46:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָמ֣וּ ג֭וֹיִם מָ֣טוּ מַמְלָכ֑וֹת נָתַ֥ן בְּ֝/קוֹל֗/וֹ תָּמ֥וּג אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/006.yaml
  text: Nations raged[a], kingdoms tottered; he uttered his voice, the earth melted.
translation:
  language: zh_hans
  text: 列国喧嚷[a]，列邦动摇；他一发声，大地便熔化。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国骚动”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָמוּ
  choice: 喧嚷
  rationale: 该动词兼有嘈杂声响与骚动不安之意。“喧嚷”既保留听觉形象，也能表达列国的动荡；另见脚注所列译法。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 此处指处于动荡中的各政治民族，与下句“列邦”形成平行；不译作“外邦人”，以免引入本节未突出的犹太人与外邦人对比。
- source_word: מָטוּ
  choice: 动摇
  rationale: 该动词表示失去稳固、摇晃或倾覆。“动摇”保留由稳定走向崩解的过程，不把结果过译成已经覆灭。
- source_word: מַמְלָכוֹת
  choice: 列邦
  rationale: 指各王国或政治疆域。用“列邦”与“列国”构成自然而庄重的诗歌平行，也避免现代汉语中“王国”可能过度凸显君主体制。
- source_word: נָתַן בְּקוֹלוֹ
  choice: 他一发声
  rationale: 希伯来语直译为“他给出他的声音”，意指发出声音。“一发声”自然凝练，并借“一……便……”表现神发声后大地立即发生变化。
- source_word: תָּמוּג
  choice: 熔化
  rationale: 该词可指融化、消解或失去坚固。“熔化”直接保留诗中大地在神声音面前失去固态的强烈意象。
- source_word: אָרֶץ
  choice: 大地
  rationale: 本节以列国、列邦为背景，范围具有普世性；“大地”比“那地”更符合宇宙性的诗歌图景。
theological_decisions:
- issue: נָתַן的隐含主语
  choice: 译作“他”，由上下文指向神
  alternative: 明确译作“神”或“耶和华”
  rationale: 希伯来语仅以第三人称阳性单数动词表达隐含主语。本节译作“他”，既符合汉语表达，又保留原文的简约，让上下文辨明所指，不在本节加入未明说的神名。
translation_notes:
  register: 采用现代、庄重而可诵读的诗歌语言。以“列国……列邦……”保留平行结构，并以“他一发声，大地便熔化”呈现原文由神的声音到大地消融的紧凑因果推进。
