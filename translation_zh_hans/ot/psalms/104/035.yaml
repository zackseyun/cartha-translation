id: PSA.104.35
reference: Psalms 104:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִתַּ֤מּוּ חַטָּאִ֨ים מִן הָ/אָ֡רֶץ וּ/רְשָׁעִ֤ים ע֤וֹד אֵינָ֗/ם בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֗ה הַֽלְלוּ יָֽהּ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/035.yaml
  text: May sinners be finished from the earth[a], and may the wicked be no more. Bless Yahweh, O my soul[b]. Hallelujah!
translation:
  language: zh_hans
  text: 愿罪人从地上绝迹[a]，愿恶人不复存在。我的心哪，要称颂耶和华。哈利路亚！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿罪人从地上消亡。”原文动词也可指“走到尽头、终结”。
    reason: lexical_alternative
  - marker: b
    text: “哈利路亚”意为“你们要赞美雅”；“雅”是耶和华这一神名的简称。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתַּמּוּ
  choice: 愿……绝迹
  rationale: תמם 的未完成式在这里带愿望语气，可表示“终结、消失”。“绝迹”自然表达从地上不复出现，同时避免加入原文没有明说的具体毁灭方式。
- source_word: חַטָּאִים
  choice: 罪人
  rationale: 该词在此为指人的复数名词化用法，指以犯罪为特征的人，不宜淡化为抽象的“罪”。
- source_word: מִן הָאָרֶץ
  choice: 从地上
  rationale: 诗篇104篇以受造世界为整体背景，因此 אֶרֶץ 宜理解为“地、全地”，而不是局部的“国土”。现代汉语中“从地上绝迹”比“从大地上终结”更自然。
- source_word: וּרְשָׁעִים
  choice: 恶人
  rationale: 这是指人的复数形容词名词化用法；“恶人”简洁、庄重，并保留其道德判断。
- source_word: עוֹד אֵינָם
  choice: 不复存在
  rationale: 该短语表示此后不再有或不再存在；“不复存在”保留诗体语气，也与前句平行。
- source_word: בָּרֲכִי נַפְשִׁי
  choice: 我的心哪，要称颂
  rationale: נֶפֶשׁ 在自我劝勉句中指人的内在自我或全人。“我的心哪”是自然的汉语诗体表达；ברך 以神为宾语时译作“称颂”，比字面的“祝福”更符合现代汉语用法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名最广为人知的音译，明确表现这是专名而非“主”这一称号。
- source_word: הַלְלוּ יָהּ
  choice: 哈利路亚
  rationale: 这是固定的礼仪呼语，中文基督教语境中通常音译为“哈利路亚”；脚注补明其字面意义及 יָהּ 的性质。
theological_decisions:
- issue: 本节祈愿消除的是罪本身，还是罪人和恶人
  choice: 正文保留对“罪人”和“恶人”从地上消失的祈愿。
  alternative: 愿罪恶从地上消灭。
  rationale: חַטָּאִים 与 רְשָׁעִים 在此都是人的称谓，不是抽象名词。翻成“罪恶”会缓和并改写原文的祈愿；用“愿”则保留其愿望式语气，而不把它强化成直接命令。
- issue: 神名 יְהוָה 的表达
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”在现代中文读者中辨识度最高，并保留专名功能；“雅威”更接近常见学术重构读音，“上主”则是称号替代。原文元音传统并不直接保存其早期发音，因此正文采用传统中文形式，不对古代读音作过度确定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，以“愿……愿……”保留希伯来诗歌的平行结构和祈愿语气。“我的心哪”延续本诗自我劝勉的诗体表达。所有脚注标记均置于正文对应位置。
