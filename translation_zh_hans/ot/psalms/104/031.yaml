  text: May the glory of Yahweh be forever[b][a]; may Yahweh rejoice in his works.
translation:
  language: zh_hans
  text: 愿雅威[a]的荣耀永存；愿雅威在自己的作为中欢喜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”对应希伯来文神名YHWH；传统汉译常作“耶和华”，也有译作“上主”等称号的做法。
    reason: terminology
  - marker: b
    text: 或译：“愿雅威因自己的作为而欢喜。”这里的希伯来介词可表示“在……中”、以……为乐，或与喜乐相关的缘由。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... לְעוֹלָם
  choice: 愿……永存
  rationale: יְהִי在此表达愿望，לְעוֹלָם表示无限延续的时间；“愿……永存”既保留祈愿语气，也符合现代汉语诗歌表达。
- source_word: כְבוֹד
  choice: 荣耀
  rationale: “荣耀”能自然表达כָּבוֹד在颂赞语境中的尊荣、威严与光辉。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现神名YHWH；“雅威”是对其通常拟定读音的现代汉语音译，并以脚注说明其他传统译法。
- source_word: יִשְׂמַח
  choice: 愿……欢喜
  rationale: 此未完成式与前句的祈愿语气平行；“欢喜”自然、庄重，也准确表达喜悦之意。
- source_word: בְּמַעֲשָׂיו
  choice: 因自己所造的一切
  rationale: 本诗语境谈论雅威的创造，因此מַעֲשָׂיו在此指他所造的万物；介词בְ可表达喜悦所缘由或所关涉的对象。脚注保留“在……中”的关系义可能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名YHWH。正文采用音译“雅威”，避免以称号取代专名；脚注交代传统汉译，兼顾读者辨识。
- issue: 雅威与受造物的喜悦关系
  choice: 因自己所造的一切而欢喜
  alternative: 在自己的作为中欢喜
  rationale: 介词בְ在此可表示喜悦的缘由、对象或范围。正文采用自然汉语“因……而欢喜”，但不把该关系绝对化，脚注保留较贴近形式的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的祈愿句式，并保留诗句两分句的平行结构。“所造的一切”依据全诗创造语境明示מַעֲשָׂיו的所指；脚注保留较形式对应的“作为”。
