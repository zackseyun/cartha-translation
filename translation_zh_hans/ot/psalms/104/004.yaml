  text: עֹשֶׂ֣ה מַלְאָכָ֣י/ו רוּח֑וֹת מְ֝שָׁרְתָ֗י/ו אֵ֣שׁ לֹהֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/004.yaml
  text: He makes his messengers winds[b][a], his ministers a flaming fire.
translation:
  language: zh_hans
  text: 他使他的使者成为风[a][b]，使他的仆役成为烈焰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使他的天使成为灵，使他的仆役成为火焰。”《希伯来书》1:7采用这一传统译法。
    reason: alternative_reading
  - marker: b
    text: 希伯来语“רוּחוֹת”既可指“风”，也可指“灵”。本句也可理解为：“他以风为使者，以火焰为仆役。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: 使……成为
  rationale: 该分词在上下文中描述上帝一贯的作为；“使……成为”既保留其使役意味，也自然衔接本节两个宾语和补语。
- source_word: מַלְאָכָיו
  choice: 自己的使者
  rationale: מַלְאָך既可指一般的“使者”，也可指“天使”。正文采用较宽泛的“使者”，不预先断定这里所指的是天上众灵还是受上帝差遣的自然力量；“天使”作为另一种理解收入脚注。
- source_word: רוּחוֹת
  choice: 风
  rationale: רוּחַ可指“风”“气息”或“灵”。诗篇104篇的创造颂歌语境，以及本词与火焰构成的平行，较支持具体的自然现象“风”；“灵”的可能性在脚注中保留。
- source_word: מְשָׁרְתָיו
  choice: 自己的仆役
  rationale: 该词指在某位主上面前供职、服侍的人。“仆役”在现代汉语中庄重而易懂，也比宗教制度色彩较强的“执事”更贴合此处广义的服侍关系。
- source_word: אֵשׁ
  choice: 火焰
  rationale: אֵשׁ直指“火”；与לֹהֵט连用时译作“燃烧的火焰”，可自然呈现诗歌中的元素意象。
- source_word: לֹהֵט
  choice: 燃烧的
  rationale: 该词描写炽热燃烧的状态；“燃烧的”保留其动态性质，并与“火焰”组成自然、清晰的现代汉语。
theological_decisions:
- issue: 本节说的是天使和灵，还是上帝用作使者的风与火
  choice: 正文译为“他使自己的使者成为风……”，按希伯来语较直接的宾语—补语关系表达，同时在创造诗的语境中将רוּחוֹת理解为“风”。
  alternative: 可译为“他使自己的天使成为灵，使自己的仆役成为火焰”；也可按另一种句法理解译为“他以风为使者，以火焰为仆役”。
  rationale: 希伯来词מַלְאָך和רוּחַ各有语义幅度，且省略系词的诗体结构容许不同的关系理解。正文不将“使者”限定为天使，并以脚注保存“天使／灵”的古老理解及“风作使者”的句法可能，避免消除原文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“自己的”清楚回指上帝，并避免连续使用“他的”造成指代生硬；平行的两个“使……成为……”保留希伯来诗句结构。脚注同时说明词义与句法上的真实歧义。
