  text: מַשְׁקֶ֣ה הָ֭רִים מֵ/עֲלִיּוֹתָ֑י/ו מִ/פְּרִ֥י מַ֝עֲשֶׂ֗י/ךָ תִּשְׂבַּ֥ע הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/013.yaml
  text: He waters the mountains from his upper chambers[a]; the earth is satisfied with the fruit of your works.
translation:
  language: zh_hans
  text: 他从他的高阁浇灌群山；大地因你作为所结的果实[a]而饱足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因”也可译作“从……而得”；这里的希伯来介词既可表示来源，也可表示凭借。
    reason: 保留מִן在此处可表示来源或凭借的词义歧义。
lexical_decisions:
- source_word: מַשְׁקֶה
  choice: 浇灌
  rationale: 这是שׁקה的使役分词，在诗歌语境中作谓语，表示使山得水；“浇灌”自然保留其使役含义。
- source_word: הָרִים
  choice: 群山
  rationale: 该词通常指山岭；“群山”在中文诗体中自然，也体现复数。
- source_word: מֵעֲלִיּוֹתָיו
  choice: 从自己的高阁
  rationale: עֲלִיּוֹת指上层房间或楼阁；“高阁”保留本诗把宇宙描绘为房屋的建筑意象，“自己的”明确原文第三人称所有格。
- source_word: מִפְּרִי
  choice: 因……果实
  rationale: מִן可表示来源或凭借；正文用“因”表达使大地饱足的凭借，同时以脚注保留来源义的可能。
- source_word: מַעֲשֶׂיךָ
  choice: 你作为的
  rationale: מַעֲשֶׂה可指工作、行为或所造之物；“作为”范围较宽，并保留原文突然转为第二人称的表达。
- source_word: תִּשְׂבַּע
  choice: 而饱足
  rationale: שׂבע表示吃喝充足、得到满足；“饱足”既传达充盈之意，也适合诗篇庄重语体。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 创造诗的语境指全地；“大地”比局部性的“土地”更合适。
theological_decisions:
- issue: 分词所隐含的神圣主语
  choice: 他……浇灌
  alternative: 浇灌群山的
  rationale: 本节没有明写主语，但上下文清楚延续对上帝的描述；补出“他”使现代中文完整通顺，并未增加新的神学判断。
- issue: 原文第三人称到第二人称的转换
  choice: 他从自己的……你作为的
  alternative: 你从自己的……你作为的
  rationale: 原文先用第三人称所有格“他的”，随后用第二人称“你的”；正文保留这一人称转换，不把诗歌张力静默统一。
- issue: 果实与上帝作为的关系
  choice: 因你作为的果实而饱足
  alternative: 从你作为的果实得以饱足
  rationale: 原介词可表达凭借，也可表达来源；正文选择较自然的凭借义，脚注保留来源义，不将两者强行合并。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。“高阁”保留宇宙房屋的意象；“果实”保留原文比喻。分号对应两个平行分句，并有意保留“他／你”的人称转换。
