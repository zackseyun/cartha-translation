  text: תִּתֵּ֣ן לָ֭/הֶם יִלְקֹט֑וּ/ן תִּפְתַּ֥ח יָֽ֝דְ/ךָ֗ יִשְׂבְּע֥וּ/ן טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/028.yaml
  text: You give to them[a], and they gather it; you open your hand, and they are filled with good.
translation:
  language: zh_hans
  text: 你赐给它们，它们便拾取所赐的；你张开手，它们就饱享美好之物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们就因美好之物而饱足。”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן לָהֶם
  choice: 你赐给它们
  rationale: נתן为第二人称阳性单数未完成式，指向上帝；לָהֶם标示领受者。用“赐给”自然体现上帝的供应，同时不增添原文没有的方式或程度。
- source_word: יִלְקֹטוּן
  choice: 它们便拾取
  rationale: לקט意为“拾取、收集”。本句可不明说宾语，中文能从上文自然理解为拾取上帝所赐之物，也保留希伯来文的简洁。
- source_word: תִּפְתַּח יָדְךָ
  choice: 你张开手
  rationale: 直译具体的拟人意象。“张开手”在现代汉语中自然，并保留诗中上帝慷慨供应受造物的画面。
- source_word: יִשְׂבְּעוּן
  choice: 它们就饱享
  rationale: שׂבע可表示吃饱、饱足。结合受造物获得食物的语境，“饱享”兼顾饱足的具体感和中文诗句的流畅。
- source_word: טוֹב
  choice: 美物
  rationale: טוֹב在此作名词性用法，可指“美好之物、好东西”。“美物”凝练而庄重；“美福”也是可能的概括性理解，故列入脚注。
theological_decisions:
- issue: 上帝供应的拟人表达
  choice: 保留“你张开手”
  alternative: 你慷慨供应
  rationale: 原文借“手”的具体意象描绘上帝维系受造界的供应。直译可保留诗意及神学画面，避免将其抽象化。
- issue: טוֹב所指的范围
  choice: 译作“美物”
  alternative: 美福／好处
  rationale: 原文只说“好、美善”，既可在语境中具体指食物等供应，也可略广地指美好的恩惠。正文采用适合当前语境的具体表达，脚注保留较宽泛的理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“它们”承接本诗上下文中的各类受造物；分号保留两组平行句。“便／就”表现希伯来诗句中行动与结果的紧密关系，但不额外规定严格的时间先后。
