source:
  edition: WLC
  text: יֶעֱרַ֣ב עָלָ֣י/ו שִׂיחִ֑/י אָ֝נֹכִ֗י אֶשְׂמַ֥ח בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/034.yaml
  text: May my meditation be pleasing to him[a]; I will rejoice in Yahweh.
translation:
  language: zh_hans
  text: 愿我的默想使他喜悦[a]；我要因雅威欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿我的默想在他看来甘甜”，或“愿我的默想蒙他悦纳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעֱרַב
  choice: 使……喜悦
  rationale: 该动词在此可表达“甘甜、令人愉悦、蒙悦纳”。“使他喜悦”自然地传达诗人愿自己的默想蒙上帝喜爱的祈愿，同时保留脚注所列的其他语义可能。
- source_word: עָלָיו
  choice: 使他
  rationale: 介词 עַל 与 ערב 连用，可标明感到喜悦的一方；三单阳性后缀按上下文指向上帝。汉语以“使他喜悦”表达，比直译为“在他之上”自然。
- source_word: שִׂיחִי
  choice: 我的默想
  rationale: שִׂיחַ 可指沉思、默想或言语；本诗的颂赞语境支持“默想”，但不排除内心吟咏或思绪的色彩。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词带有一定强调；现代汉语用“我要”已能自然体现诗人的个人心志，无须生硬译成“我自己”。
- source_word: אֶשְׂמַח
  choice: 我要……欢喜
  rationale: 未完成式在此可表达持续态度或立定的心志；“我要……欢喜”兼顾诗歌语气与意志色彩。
- source_word: בַּיהוָה
  choice: 因雅威
  rationale: 介词 בְּ 可标明欢喜的对象或缘由；“因雅威欢喜”是自然的现代汉语表达，并保留上帝的专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式保留其盟约名称，也与所提供的审校层采用 Yahweh 的决定一致；“耶和华”是汉语传统中常见的另一音译。
- issue: “喜悦”的主体与默想的蒙悦纳关系
  choice: 愿我的默想使他喜悦
  alternative: 愿我的默想蒙他悦纳
  rationale: 原文可侧重默想令上帝感到甘甜愉悦，也可理解为默想蒙他悦纳。正文采用较贴近 ערב 基本感官隐喻的“使他喜悦”，脚注保留“甘甜”和“蒙悦纳”的可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；以分号对应两个平行分句。“愿……；我要……”保留前句的祈愿和后句的决意。
