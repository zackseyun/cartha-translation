  text: All the beasts of the field drink from them[b][a]; the wild donkeys quench their thirst.
translation:
  language: zh_hans
  text: 田野的一切走兽都从中喝水；野驴解渴。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַשְׁקוּ
  choice: 从中喝水
  rationale: 该词是שׁקה的使役形，通常表示“使喝水、供水”。结合上一节作为水源的溪流，现代汉语以动物“从中喝水”表达最自然；“中”所指由上下文补出。
- source_word: כָּל
  choice: 一切
  rationale: 表达涵盖田野中所有走兽的集合意义，庄重而自然。
- source_word: חַיְתוֹ שָׂדָי
  choice: 田野的一切走兽
  rationale: 该组合词组指野外的动物；“走兽”在诗歌语体中简洁自然，也能与后句的野驴相衔接。
- source_word: יִשְׁבְּרוּ
  choice: 解了
  rationale: שׁבר与“渴”搭配是满足、解除口渴的习语，不宜按字面译为“打破”；“解了渴”是自然、具体的现代汉语表达。
- source_word: פְרָאִים
  choice: 野驴
  rationale: 指野生驴类或亚洲野驴；“野驴”清楚通俗，避免采用较专业的动物名称。
- source_word: צְמָאָם
  choice: 渴
  rationale: 该名词带第三人称阳性复数后缀，意为“它们的口渴”；汉语在“野驴也解了渴”中无需重复领属语即可准确表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“从中”承接上一节的溪流；分号保留两行之间的平行结构。“也”使野驴作为田野走兽中的突出例子自然承接前句。
