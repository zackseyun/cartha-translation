  to: 他造月亮以定时节；太阳知道自己的落下。[a]
  rationale: 将月亮的用途译为“以定时节”，在现代汉语中自然地表达天体与受定时序的关系，同时不将原文限缩为节日。将“何时落下”改为“自己的落下”，恢复 מְבוֹאוֹ 的名词形式及其与“太阳”相对应的后缀，并保留“知道”的诗歌拟人化。脚注锚点置于“时节”后，直接说明该词的语义范围。
