  text: עָשָׂ֣ה יָ֭רֵחַ לְ/מוֹעֲדִ֑ים שֶׁ֝֗מֶשׁ יָדַ֥ע מְבוֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/019.yaml
  text: He made the moon for appointed times[a]; the sun knows its setting.
translation:
  language: zh_hans
  text: 他造月亮以定时节；太阳知道自己的落下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定时节”或译“为定期”“为指定的时间”；希伯来语可指固定或指定的时间、时节，也可包括节庆。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: 造
  rationale: 该动词在此为常见的“制造、创造”义；主语由上下文可知是上帝。“造”简洁自然，也不把后面的用途含义提前解释为“设立”。
- source_word: יָרֵחַ
  choice: 月亮
  rationale: 直接指天体月亮；用现代汉语常用名称。
- source_word: לְמוֹעֲדִים
  choice: 来定节期
  rationale: לְ 表示用途，מוֹעֲדִים 可指规定的时间、时节或节庆日期。“来定节期”既表现月亮标定固定日期的功能，也保留与节庆历法的联系；其较宽语义由脚注说明。
- source_word: שֶׁמֶשׁ
  choice: 太阳
  rationale: 该词在此直接指太阳。
- source_word: יָדַע
  choice: 知道
  rationale: 保留原文“知道”的拟人表达，不改写成纯功能性的“遵守”或“按时”。
- source_word: מְבוֹאוֹ
  choice: 何时落下
  rationale: מָבוֹא 本义涉及进入、下去之处；用于太阳时指日落。译作“何时落下”与“知道”自然搭配，并表达太阳按所定秩序落下，但其中“何时”是汉语中的语境性补足。
theological_decisions:
- issue: מוֹעֲדִים 在创造秩序语境中的含义
  choice: 正文译作“节期”，脚注保留“规定的时间、时节、节庆日期”的宽广范围
  alternative: 译作“时节”或“规定的时间”
  rationale: 本节描述上帝借天体安排时间秩序。月亮既可标定一般时序，也与以色列历法中的节庆日期有关；正文采用简洁而有历法色彩的“节期”，脚注避免把词义局限为宗教节日。
- issue: 太阳“知道”的拟人化
  choice: 保留“知道”
  alternative: 意译为“按时落下”
  rationale: 直译保存诗歌对太阳的拟人化，也呈现受造界遵行上帝秩序的形象，不额外加入机制性解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分号保留两行的平行结构；“他”的所指由诗篇上下文确定为上帝。
