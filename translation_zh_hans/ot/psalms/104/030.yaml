  text: תְּשַׁלַּ֣ח ר֭וּחֲ/ךָ יִבָּרֵא֑וּ/ן וּ֝/תְחַדֵּ֗שׁ פְּנֵ֣י אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/030.yaml
  text: When you send out your Spirit[a], they are created[b], and you renew the face of the ground.
translation:
  language: zh_hans
  text: 你发出你的灵[a]，它们就被造[b]；你使地面更新。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的气息”，或“你的风”；希伯来文 רוּחַ 可表达这三种含义。
    reason: lexical_alternative
  - marker: b
    text: 也可按并列结构译作：“你发出你的灵，它们被造。”
    reason: syntactic_alternative
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: 发出
  rationale: 该词为 שׁלח 的 Piel 形式，表示“差出、发出”。“发出”在现代汉语中自然，也保留了上帝主动施行这一行动的含义。
- source_word: רוּחֲךָ
  choice: 你的灵
  rationale: רוּחַ 可指“灵、气息、风”。在创造并赐予生命的语境中，“你的灵”最能体现上帝施行创造的主体性；其余可能含义以脚注保留。
- source_word: יִבָּרֵאוּן
  choice: 它们就被造
  rationale: ברא 的 Niphal 形式在此表示“被创造”。“被造”简洁而直接；“就”自然表达两分句之间的紧密承接关系，但不把“重新创造”的意思加入本词。
- source_word: וּתְחַדֵּשׁ
  choice: 你使……更新
  rationale: חדשׁ 的 Piel 形式意为“更新、使之焕新”。“使……更新”保留使役色彩，也避免解释成彻底替换。
- source_word: פְּנֵי אֲדָמָה
  choice: 地面
  rationale: פְּנֵי 字面为“……的面”，אֲדָמָה 指土地、地土；现代汉语“地面”自然凝练，能够表达“土地的表面”，并保留诗歌意象的基本内容。
theological_decisions:
- issue: 创造语境中 רוּחַ 的译法
  choice: 你的灵
  alternative: 你的气息；你的风
  rationale: “灵”符合本节所述上帝赐生命、施行创造与更新的语境，也具有充分的词义依据；不过希伯来词同时可表示“气息”或“风”，因此不排除这些意象，而在脚注中明确保留。
- issue: 两个未完成式分句之间的关系
  choice: 用“就”表达紧密承接
  alternative: 按单纯并列译作“你发出你的灵，它们被造”
  rationale: 希伯来文先说上帝发出其灵，继而说受造物被造，语境显示紧密的结果或时间承接关系；“就”使现代汉语通顺，但脚注保留较贴近形式的并列理解，避免把句法关系绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“被造”沿用普通读者熟悉的圣经用语；“使地面更新”贴近原文，同时避免过度修饰。
