  text: שָׁ֭ם אֳנִיּ֣וֹת יְהַלֵּכ֑וּ/ן לִ֝וְיָתָ֗ן זֶֽה יָצַ֥רְתָּ לְ/שַֽׂחֶק בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/026.yaml
  text: There the ships move about[a], and Leviathan, which you formed to play in it.
translation:
  language: zh_hans
  text: 那里船只往来；你所造的利维坦，也在其中嬉戏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你造了利维坦，好与它嬉戏。”原文末句也可能指上帝与利维坦嬉戏，而不是利维坦在海中嬉戏。
    reason: 保留 לְשַׂחֶק בּוֹ 在主语和代词所指上的真实歧义。
lexical_decisions:
- source_word: שָׁם
  choice: 那里
  rationale: 指回上一节所说的海；“那里”简洁自然，并维持诗句的空间指向。
- source_word: אֳנִיּוֹת
  choice: 船只
  rationale: 泛指在海上航行的各类船；汉语无需另加定冠词。
- source_word: יְהַלֵּכוּן
  choice: 往来
  rationale: 未完成体在此描写船只持续或反复航行；“往来”比直译“行走”更符合现代汉语的海上活动表达。
- source_word: לִוְיָתָן
  choice: 利维坦
  rationale: 采用音译以保留这一名称在圣经诗歌中的独特性及经文间的呼应，不预先把它限定为某一种已知动物。
- source_word: זֶה
  choice: 你所造的
  rationale: 希伯来语直译近于“这一个”，在此与后面的动词共同标明眼前所述的利维坦；汉语用关系结构更自然。
- source_word: יָצַרְתָּ
  choice: 造
  rationale: יצר含塑造、形成之意；“造”在汉语中自然庄重，也清楚表达上帝使其成形存在。
- source_word: לְשַׂחֶק
  choice: 嬉戏
  rationale: 表达玩耍、欢跃的活动；“嬉戏”既保留诗意，又比“玩”更适合庄重经文语体。
- source_word: בּוֹ
  choice: 在其中
  rationale: 阳性单数代词最自然地指回上文的海；“其中”避免重复“海”，并保留原文代词的衔接。
theological_decisions:
- issue: לְשַׂחֶק בּוֹ 的主语及 בּוֹ 的所指
  choice: 利维坦被造，在海中嬉戏
  alternative: 上帝造了利维坦，好与它嬉戏
  rationale: 紧接上文的海和本节“那里”的地点描写，最顺畅的理解是利维坦在海中嬉戏。不过，希伯来语不明说“嬉戏”的主语，而 בּוֹ 也可理解为“与它”，因此保留上帝与利维坦嬉戏这一古老而可能的读法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“船只往来”呈现海上的持续活动；“利维坦”用音译保留诗歌意象及经文间联系；分号对应诗句中并列的两幅海上景象。
