  text: מִן גַּעֲרָ֣תְ/ךָ֣ יְנוּס֑וּ/ן מִן ק֥וֹל רַֽ֝עַמְ/ךָ֗ יֵחָפֵזֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/007.yaml
  text: At your rebuke they fled[a]; at the sound of your thunder they hurried away.
translation:
  language: zh_hans
  text: 你的斥责一发出，水就逃去；你的雷声一响起，水便急忙退去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的斥责一发出，水就逃跑；你的雷声一响起，水便匆忙退去。”
    reason: 词义选择：נוּס 可译作“逃跑”；חפז 可译作“匆忙”，较中性地表达急速离去。
lexical_decisions:
- source_word: גַּעֲרָתְךָ
  choice: 你的斥责
  rationale: גְּעָרָה 表示有力的责令或斥责；“斥责”既保留神话语的威严和力量，也适合神命令受造界的诗歌语境。
- source_word: יְנוּסוּן
  choice: 逃去
  rationale: נוּס 的基本义是“逃跑、逃离”。“逃去”简洁自然，描绘水在神斥责下退却。
- source_word: קוֹל רַעַמְךָ
  choice: 一听见你的雷声
  rationale: קוֹל 在此与 רַעַם 连用，指雷发出的声音。用“一听见”自然表达 מִן 所标示的触发时刻，同时保留鲜明的听觉意象。
- source_word: יֵחָפֵזוּן
  choice: 仓皇退去
  rationale: חפז 含急速、慌忙之意；“仓皇退去”兼顾迅速与受惊扰的语感，又与本节中水退却的场景相合。
- source_word: מִן ... מִן
  choice: 因……；一听见……
  rationale: 两个 מִן 在平行句中表示引发行动的原因或契机。中文分别译作“因”和“一听见”，表达水立即回应神的斥责和雷声，同时避免生硬重复。
theological_decisions:
- issue: 两个复数动词的所指
  choice: 在正文中明确为“水”
  alternative: 沿用隐含主语，译作“它们”
  rationale: 希伯来文依赖上文，以复数动词回指第6节的众水。汉语若单独使用“它们”容易指代不清，因此补出“水”，属于由语境明确的信息，并未改变所指。
- issue: 雷声与神行动的关系
  choice: 译作“你的雷声”
  alternative: 译作“你如雷的声音”
  rationale: רַעַם 直接指“雷”，所属后缀表明是“你的雷声”。保留此表达，不把它解释为神声音的明喻，从而保存诗句的神显意象及其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两句保持平行结构；为使脱离上下文时仍清楚，补明隐含主语“水”。“仓皇”保留 חפז 可能包含的慌乱色彩，脚注提供较中性的译法。
