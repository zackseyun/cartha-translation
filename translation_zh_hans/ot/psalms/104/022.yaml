base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/022.yaml
  text: The sun rises[b][a]; they gather themselves and lie down in their dens.
translation:
  language: zh_hans
  text: 太阳升起，它们便退去[a]，卧在自己的洞穴[b]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“聚拢”或“被收聚”。希伯来语动词既可理解为被动的“被收聚”，也可理解为反身或不及物的“退去”。
    reason: lexical_alternative
  - marker: b
    text: 或译“巢穴”“住处”。希伯来语词泛指居所；这里谈到动物，故译作“洞穴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרַח
  choice: 升起
  rationale: זרח的Qal未完成式以“太阳”为主语，在此表示太阳升起；“升起”符合现代汉语习惯，也与夜间活动的野兽在黎明退去的上下文相合。
- source_word: הַשֶּׁמֶשׁ
  choice: 太阳
  rationale: 定指名词，直接译为“太阳”。
- source_word: יֵאָסֵפוּן
  choice: 退去
  rationale: אסף的Niphal未完成式复数可表示“被收聚、聚拢”，也可在此作反身或不及物理解为“退去”。结合上一节狮子夜间觅食的语境，“退去”自然清楚，同时以脚注保留原文的语态和词义歧义。
- source_word: וְאֶל
  choice: 便……在
  rationale: 原文直译为“并且向着”；汉语以“退去”表达移动，再以“在自己的洞穴里”表达最终所在，较为自然。“便”也清楚呈现日出后随即发生的动作。
- source_word: מְעוֹנֹתָם
  choice: 自己的洞穴
  rationale: מָעוֹן泛指居所；在狮子的语境中，“洞穴”具体、自然。“自己的”明确表达第三人称复数所有后缀。
- source_word: יִרְבָּצוּן
  choice: 卧
  rationale: רבץ常用于动物伏卧、躺卧；“卧”简洁庄重，并保留动物安歇的画面。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的汉语。“太阳升起”保持诗句直接的时间推进；“退去”符合狮子在日出后离开活动区域的语境，但不在正文中强行消除Niphal动词可能具有的被动或反身含义，相关歧义由脚注保留。脚注标记分别紧接所说明的词语。
