  yaml_path: translation/ot/psalms/104/018.yaml
  text: The high mountains are for the wild goats[b][a]; the rocks are a refuge for the rock badgers.
translation:
  language: zh_hans
  text: 高山是野山羊的住处；岩石是蹄兔的藏身处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִים הַגְּבֹהִים
  choice: 高山
  rationale: 将名词与定语自然合译，准确表达高耸的山地，也符合现代汉语诗歌性叙述。
- source_word: לַיְּעֵלִים
  choice: 是野山羊的住处
  rationale: יעל 指栖息于山地的野山羊或努比亚野山羊；“野山羊”通俗易懂。介词 לְ 在此表示适合动物栖居、归其使用，补出“住处”使汉语完整自然。
- source_word: סְלָעִים
  choice: 岩石
  rationale: 该复数名词指岩石或岩壁；“岩石”既保持原文宽泛含义，也与高山意象协调。
- source_word: מַחְסֶה
  choice: 藏身处
  rationale: 该词指躲避危险、获得保护之处；结合蹄兔藏身岩缝的具体图景，“藏身处”比抽象的“避难所”更自然准确。
- source_word: לַשְׁפַנִּים
  choice: 蹄兔
  rationale: שפן 通常指生活于岩石地带的蹄兔；现代汉语标准动物名称“蹄兔”准确而简洁，不采用可能令人误解为兔类或獾类的称呼。
