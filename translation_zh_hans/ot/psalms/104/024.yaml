  text: מָֽה רַבּ֬וּ מַעֲשֶׂ֨י/ךָ יְֽהוָ֗ה כֻּ֭לָּ/ם בְּ/חָכְמָ֣ה עָשִׂ֑יתָ מָלְאָ֥ה הָ֝/אָ֗רֶץ קִנְיָנֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/024.yaml
  text: How many are your works[a], O Yahweh! In wisdom you have made them all; the earth is full of your creatures.
translation:
  language: zh_hans
  text: '雅威啊，你的作为何其多！

    你以智慧造了这一切；

    大地充满了你的造物[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你所有之物”。这里的希伯来词可指所得或所有之物；在本节的创造语境中，也可泛指上帝所造并归他所有的万物。
    reason: 保留 קִנְיָנֶךָ 在“造物”与“所有之物”之间的词义幅度。
lexical_decisions:
- source_word: מָה רַבּוּ
  choice: 何其多
  rationale: 这是表示惊叹的结构，强调上帝作为的繁多与丰富；“何其多”简洁、庄重，也符合现代汉语诗歌语体。
- source_word: מַעֲשֶׂיךָ
  choice: 你的作为
  rationale: מַעֲשֶׂה 可指所做之事或所造之物；“作为”保留较宽的语义，并由本诗的创造语境具体说明。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行拟音译出专名，而不以称号替代。
- source_word: בְּחָכְמָה
  choice: 以智慧
  rationale: 保留“智慧”这一名词，并自然表达智慧是创造的方式或凭借。
- source_word: כֻּלָּם
  choice: 这一切
  rationale: 回指前句繁多的“作为”，同时保留全体、无一例外的含义。
- source_word: מָלְאָה הָאָרֶץ
  choice: 大地遍满了
  rationale: 完成式在此表达现今可见的结果状态；“遍满”兼具自然性与诗意。
- source_word: קִנְיָנֶךָ
  choice: 你的造物
  rationale: 该词基本涉及所得、所有之物；在创造诗的语境中指属于上帝、由他造出的万物。“造物”使上下文自然连贯，而脚注保留其所有权层面的词义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名。译作“雅威”保留专名性质，并较接近通常重构的读音；不以“主”这一称号代替。
- issue: קִנְיָנֶךָ 在创造语境中的所指
  choice: 你的造物
  alternative: 你所有的；你的所有物
  rationale: 上下文赞叹雅威所创造的一切，因此“造物”最自然；但原词本身着重所得或所有，未必是“受造物”的专门术语，故以脚注保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体；分行保留希伯来诗句的推进关系。“何其多”“遍满”略带诗意，但仍属普通读者容易理解的现代汉语。
