  text: יִ֭שְׂבְּעוּ עֲצֵ֣י יְהוָ֑ה אַֽרְזֵ֥י לְ֝בָנ֗וֹן אֲשֶׁ֣ר נָטָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/016.yaml
  text: The trees of Yahweh are satisfied[a], the cedars of Lebanon that he planted,
translation:
  language: zh_hans
  text: 雅威的树木得饱足[a]，就是他栽种的黎巴嫩香柏树。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“得到充足供应”。希伯来语动词表示供应充分、达到饱足。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂבְּעוּ
  choice: 都得饱足
  rationale: 该词是 שבע 的 Qal 未完成式，在这里描写树木得到充分供应、达到饱足的状态。“得饱足”保留诗歌中的拟人色彩，也不把语义限缩为单指水分充足。
- source_word: עֲצֵי יְהוָה
  choice: 雅威的树木
  rationale: עֲצֵי 是 עֵץ 的复数构造形，与神名 יְהוָה 构成所属关系。译作“雅威的树木”，既贴近原文结构，也保留神的专名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名。采用现代汉语中对 Yahweh 的常见音译“雅威”，不以“主”这一称号替代专名。
- source_word: אַרְזֵי לְבָנוֹן
  choice: 黎巴嫩香柏树
  rationale: אַרְזֵי 是 אֶרֶז 的复数构造形，指黎巴嫩的香柏树；“香柏树”是现代中文圣经及一般语境中清楚、庄重的名称。
- source_word: אֲשֶׁר נָטָע
  choice: 他栽种的
  rationale: 关系从句修饰“黎巴嫩香柏树”。נָטָע 是 Qal 完成式第三人称阳性单数，语境中的主语为雅威；中文以“他”明确表达隐含主语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非称号。译作“雅威”对应 Yahweh 的现代汉语音译，并避免用“主”取代原文专名。
- issue: “雅威的树木”与“黎巴嫩香柏树”的关系
  choice: 用“就是”表达同位说明
  alternative: 不用连接词，仅以逗号并列
  rationale: 希伯来诗句的第二分句以同位方式具体说明前面的“雅威的树木”。“就是”使现代中文关系清楚，同时没有把原文扩展成因果或比较关系。
- issue: 树木“饱足”的拟人表达
  choice: 保留“得饱足”
  alternative: 得到充分滋润；水分充足
  rationale: 原词可表示吃饱、满足或供应充分。保留拟人措辞可呈现诗歌张力，并避免擅自把所获供应限定为水。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“得饱足”保留原诗的拟人意象；“就是”清楚呈现两个诗行之间的同位说明关系。
