  text: יָֽסַד אֶ֭רֶץ עַל מְכוֹנֶ֑י/הָ בַּל תִּ֝מּ֗וֹט עוֹלָ֥ם וָ/עֶֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/005.yaml
  text: He founded the earth on its foundations[a]; it will not be shaken forever and ever.
translation:
  language: zh_hans
  text: 他把大地奠立在它的根基上[a]；它永永远远不会动摇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把大地建立在它的基座上。”希伯来文采用建筑意象来描绘大地的稳固。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַד
  choice: 奠立
  rationale: 此动词指奠基、建立；“奠立”既保留建筑意象，又符合庄重的现代汉语诗体。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 本篇是创造颂歌，此处所指为整体的地，而非局部的土地；“大地”在汉语诗歌语境中自然。
- source_word: עַל
  choice: 在……上
  rationale: 直接表达承托或安置的位置关系，与根基的建筑意象相合。
- source_word: מְכוֹנֶיהָ
  choice: 根基
  rationale: 该名词可指基座、固定支撑或根基；“根基”最清楚地传达此处世界稳固的建筑比喻。
- source_word: בַּל
  choice: 不会
  rationale: 诗体否定词在此否定后面的未完成式；译作“不会”自然表达持续及将来的否定。
- source_word: תִּמּוֹט
  choice: 动摇
  rationale: מוט 的被动/中动态形式表示被移动、摇撼或失去稳定；“动摇”兼顾稳定意象和自然汉语。
- source_word: עוֹלָם וָעֶד
  choice: 永永远远
  rationale: 并列词组强化无尽久远之意；“永永远远”保留强调语气，也符合汉语圣诗式表达。
theological_decisions:
- issue: 创造诗中的宇宙建筑意象
  choice: 保留大地被奠立在根基上、永不动摇的诗性建筑图像
  alternative: 把它释义为“他使世界稳定，永不改变”
  rationale: 原文以建筑和稳定为意象，并非现代科学论述。译文不将其科学化，也不将具体图像抽象化，从而保留诗篇本身的表达及张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“奠立”“根基”保留原文建筑意象；“永永远远不会动摇”语序自然，并传达强化的永久性。
