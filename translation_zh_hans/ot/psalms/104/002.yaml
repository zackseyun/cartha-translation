  text: covering yourself with light as with a garment[a], stretching out the heavens like a curtain.
translation:
  language: zh_hans
  text: '你披上亮光，如披衣裳；

    你将诸天铺展，如铺开帷幔[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“帐幕的幔幅”。希伯来语这个词可指帐篷或会幕所用的一幅幔子。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹטֶה
  choice: 披上
  rationale: 该词为主动分词，在诗歌中生动描绘上帝以亮光为衣。“披上”自然传达以某物覆身的意象，又与下句“衣裳”衔接。
- source_word: אוֹר
  choice: 亮光
  rationale: 此处直接指光，作为上帝所披之物；“亮光”在现代汉语中清楚自然，无须释作抽象的“荣光”。
- source_word: כַשַּׂלְמָה
  choice: 如同披上衣裳
  rationale: שַׂלְמָה泛指衣服、外衣。“衣裳”保留宽泛含义；补出“披上”使汉语比喻完整流畅，并未限定具体服饰。
- source_word: נוֹטֶה
  choice: 铺展
  rationale: 该主动分词表示伸展、铺开。“铺展”既保留动作感，也适合天地创造的宏大诗歌图景。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 希伯来语复数形式可指天空或诸天；“诸天”保留本诗庄严、宇宙性的语域。
- source_word: כַיְרִיעָה
  choice: 如同铺开帷幔
  rationale: יְרִיעָה可指幔子，尤其是帐幕所用的幔幅。“帷幔”庄重而易懂；补出“铺开”使比较结构符合现代汉语表达。
theological_decisions:
- issue: 上帝披上亮光并铺展诸天的拟人化描写
  choice: 直接保留诗歌中的拟人和创造意象
  alternative: 意译为“你被亮光环绕”或“你以光彰显荣耀”
  rationale: 原文以鲜明隐喻描绘上帝的威荣和创造大能。直译其意象可避免把神学解释写入正文，也保留诗句本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；两行以“披上／铺展”和“如同／如同”形成平行。脚注标记置于其实际说明的“帷幔”之后。
