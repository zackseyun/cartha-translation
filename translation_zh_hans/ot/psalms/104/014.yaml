revisions:
- from: '他使青草为牲畜生长，

    使菜蔬供人耕作[a]，

    好从地里产出粮食。'
  to: '他使青草为牲畜生长，

    也使草木供人劳作，

    好叫人从地里得粮食。'
  rationale: 修订避免将“草木／植物”缩窄为“菜蔬”，也不把“人的劳作”限定为耕作。正文以“好叫人从地里得粮食”自然呈现不定式所表达的目的／结果关系；脚注保留该紧凑短语的词义弹性。
