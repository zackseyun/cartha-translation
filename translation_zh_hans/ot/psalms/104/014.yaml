  text: מַצְמִ֤יחַ חָצִ֨יר לַ/בְּהֵמָ֗ה וְ֭/עֵשֶׂב לַ/עֲבֹדַ֣ת הָ/אָדָ֑ם לְ/ה֥וֹצִיא לֶ֝֗חֶם מִן הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/014.yaml
  text: He causes grass to grow for the cattle[a], and plants for the service of man, to bring forth bread from the earth,
translation:
  language: zh_hans
  text: '他使青草为牲畜生长，

    也使草木供人劳作，

    好叫人从地里得粮食。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצְמִיחַ
  choice: 使……生长
  rationale: 保留צמח使役形分词的使役意义，明确是上帝使植物生长；中文表达自然。
- source_word: חָצִיר
  choice: 青草
  rationale: 本处指供牲畜取食的草类；“青草”既符合牧养图景，也有诗歌色彩。
- source_word: לַבְּהֵמָה
  choice: 为牲畜
  rationale: בְּהֵמָה在此泛指家养食草动物；“牲畜”比“牛”范围更准确。
- source_word: וְעֵשֶׂב
  choice: 使菜蔬
  rationale: עֵשֶׂב泛指可供人利用的草本植物或作物；“菜蔬”在诗篇语境中自然，又不局限于调味香草。重复“使”是为使中文平行结构清楚。
- source_word: לַעֲבֹדַת הָאָדָם
  choice: 供人耕作
  rationale: עֲבֹדָה可指劳作、服役或耕作；结合植物与从地里产粮的农业语境，“供人耕作”最为自然，但脚注保留较宽的词义可能。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处אָדָם为集合性、泛指的人类；现代汉语“人”自然包含全人类，无须添加性别限定。
- source_word: לְהוֹצִיא
  choice: 好……产出
  rationale: 不定式可表达目的或结果；“好”保留目的意味，“产出”适合土地生产粮食的语境。
- source_word: לֶחֶם
  choice: 粮食
  rationale: לֶחֶם基本义为饼或食物；在农业语境中，现代汉语“粮食”既保留谷物关联，也避免误解为已经烤成的面包。
- source_word: מִן הָאָרֶץ
  choice: 从地里
  rationale: אֶרֶץ在本句指生产作物的土地；“地里”比“从大地”更符合现代汉语农业语境。
theological_decisions:
- issue: אָדָם的泛指含义
  choice: 人
  alternative: 人类
  rationale: 希伯来语单数אָדָם在此代表全人类。中文“人”既保持原文简洁的单数形式，也自然表达泛指意义。
- issue: לַעֲבֹדַת הָאָדָם的关系
  choice: 供人耕作
  alternative: 供人使用／供人劳作
  rationale: 上下文强烈指向农业耕作，但希伯来语עֲבֹדָה本身可泛指劳作或服役，因此以脚注保存其词义张力。
- issue: לְהוֹצִיא所表达的逻辑关系
  choice: 好从地里产出
  alternative: 从而从地里产出
  rationale: 希伯来语不定式容许目的或结果两种理解；正文采用兼具目的色彩且自然的“好”，不把行动主体另行明确为上帝或人。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言，以三个短句呈现原文的平行与目的结构。“牲畜”“菜蔬”“粮食”符合普通现代读者的农业语汇；脚注仅说明原文短语的真实歧义。
