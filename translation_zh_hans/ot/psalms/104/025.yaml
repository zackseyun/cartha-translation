  text: זֶ֤ה הַ/יָּ֥ם גָּדוֹל֮ וּ/רְחַ֪ב יָ֫דָ֥יִם שָֽׁם רֶ֭מֶשׂ וְ/אֵ֣ין מִסְפָּ֑ר חַיּ֥וֹת קְ֝טַנּ֗וֹת עִם גְּדֹלֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/025.yaml
  text: There is the sea[a], great and broad of hands; in it are swarming things without number[c][b], living creatures small along with great.
translation:
  language: zh_hans
  text: 看哪，这海又大又辽阔[a]；其中有无数游动的生物[b]，大小活物都有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辽阔”原文直译为“两手宽广”，是形容向两边广阔延展的说法。
    reason: cultural_note
  - marker: b
    text: “游动的生物”也可译为“爬行之物”或“活动的生物”；原文泛指活动的活物。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַיָּם
  choice: 看哪，海洋
  rationale: זֶה在这里带有指示、展示语气，引人观看诗人所描绘的海；译作“看哪”比生硬的“这是”更符合汉语诗歌表达。יָם依语境译为“海洋”。
- source_word: גָּדוֹל וּרְחַב יָדָיִם
  choice: 又大又辽阔
  rationale: רְחַב יָדָיִם字面为“两手宽广”，是表示向两边广阔延展的习语；正文按其意义自然表达，并以脚注保留原文形象。
- source_word: שָׁם
  choice: 其中
  rationale: 该处所副词回指刚提到的海洋，汉语译为“其中”可清楚呈现这种关系。
- source_word: רֶמֶשׂ
  choice: 游动的生物
  rationale: 此集合名词指会移动、成群繁多的活物；在海洋语境中，“游动的生物”比“爬物”自然，同时不局限于现代动物分类。
- source_word: וְאֵין מִסְפָּר
  choice: 无数
  rationale: 希伯来语习语意为无法计数；“无数”简洁而准确。
- source_word: חַיּוֹת קְטַנּוֹת עִם גְּדֹלוֹת
  choice: 有小的，也有大的
  rationale: 保留小与大的包举性对举，并自然传达עִם所表达的共存、并列关系。
