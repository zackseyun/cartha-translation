  text: הַ֥/מְקָרֶֽה בַ/מַּ֗יִם עֲֽלִיּ֫וֹתָ֥י/ו הַ/שָּׂם עָבִ֥ים רְכוּב֑/וֹ הַֽ֝/מְהַלֵּ֗ךְ עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/003.yaml
  text: who lays the beams of his upper chambers on the waters[a], who makes the clouds his chariot, who walks on the wings of the wind.
translation:
  language: zh_hans
  text: '他在众水之上为自己的高楼架梁，

    以云彩为自己的战车，

    在风的翅膀上行走。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风”也可理解为“灵”；但此处上下文描写众水、云彩和风等气象意象，故正文译为“风”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְקָרֶה
  choice: 架设……的梁木
  rationale: 该分词源于 קרה，在此表示给建筑架梁或铺设屋顶；译作“架设……的梁木”保留具体的建筑意象，也符合现代汉语表达。
- source_word: בַמַּיִם
  choice: 在众水之上
  rationale: 介词 ב 可依语境表示“在、用、于”等；这里与架梁的建筑图景相连，译为“在众水之上”最能呈现宇宙性的诗歌意象，同时不把水说成通常意义上的地基。
- source_word: עֲלִיּוֹתָיו
  choice: 楼阁
  rationale: עֲלִיּוֹת 指建筑上层的房间；“楼阁”简洁而庄重，既表达高处居所，也适合诗体。
- source_word: הַשָּׂם
  choice: 以……为
  rationale: 源于 שׂים，基本义为放置、设立；在“云彩—战车”的表语结构中，“以……为”是自然的中文表达。
- source_word: עָבִים
  choice: 云彩
  rationale: 该词指云或浓云；此处用“云彩”自然明晰，浓厚之意并非必须显明表达。
- source_word: רְכוּבוֹ
  choice: 自己的战车
  rationale: 该词在此指供乘驾之物，结合神显诗歌意象，译为“战车”最具体清楚；加“自己的”对应第三人称单数所属后缀。
- source_word: הַמְהַלֵּךְ
  choice: 而行
  rationale: 该分词源于 הלך，意为行走、行进；“而行”保留动态画面，又比拟人色彩过强的“步行”更适合中文诗句。
- source_word: עַל
  choice: 乘
  rationale: 字面可译“在……之上”；中文在“风的翅膀”这一承载、运行意象中用“乘”更自然，并未改变其位于其上而行的关系。
- source_word: כַּנְפֵי
  choice: 翅膀
  rationale: כָּנָף 可指翅膀、边缘或末端；在风带来迅疾运行的诗歌图景中，“翅膀”最形象且最符合语境。
- source_word: רוּחַ
  choice: 风
  rationale: רוּחַ 可指风、气息或灵；本节云彩、战车和翅膀均属气象性的宇宙图景，因此正文采用“风”，同时以脚注保留“灵”的词义可能。
theological_decisions:
- issue: 末句 רוּחַ 的含义
  choice: 风
  alternative: 灵
  rationale: 该希伯来词本身具有多义性，但本节周围的众水、云彩与乘驾意象明显偏向气象语境。“风”因此是正文中更合适的读法；脚注保留“灵”这一可能，以免抹去原词的语义张力，也不把本节限定为特定的圣灵论陈述。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语，三行对应希伯来文三个平行分句。保留“梁木—楼阁”“云彩—战车”“风—翅膀”的具体意象，避免过度解释宇宙结构或赋予 רוּחַ 特定教义含义。
