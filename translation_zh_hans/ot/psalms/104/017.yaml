  text: 鸟儿在那里筑巢；鹳以柏树[a]为家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“冷杉”“杜松”，也可能是另一种针叶树；这个希伯来词所指的确切树种不能确定。
