lexical_decisions:
- source_word: אֲשֶׁר שָׁם
  choice: 在那里
  rationale: 这一组合承接上一节的树木，表示鸟儿在那些树上筑巢；“在那里”既保留指示意味，也符合现代汉语表达。
- source_word: צִפֳּרִים
  choice: 鸟儿
  rationale: 泛指鸟类；“鸟儿”自然、易懂，并与诗歌描绘的生机相称。
- source_word: יְקַנֵּנוּ
  choice: 筑巢
  rationale: 动词 קנן 表示筑巢或栖巢；“筑巢”简洁地保留其动作含义。
- source_word: חֲסִידָה
  choice: 鹳
  rationale: 该词通常指鹳；原文用单数代表这一类鸟，译文予以保留。
- source_word: בְּרוֹשִׁים
  choice: 柏树
  rationale: 该希伯来词指某种针叶树，但确切树种不明；“柏树”是常见且合乎语境的译法，并以脚注保留不确定性。
- source_word: בֵּיתָהּ
  choice: 以……为家
  rationale: 字面为“它的家”；译作“以……为家”符合现代汉语习惯，也清楚表达栖居之所。
