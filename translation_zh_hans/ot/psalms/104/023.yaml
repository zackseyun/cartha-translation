  text: יֵצֵ֣א אָדָ֣ם לְ/פָעֳל֑/וֹ וְֽ/לַ/עֲבֹ֖דָת֣/וֹ עֲדֵי עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/023.yaml
  text: Man goes out to his work and to his labor until evening[a][b].
translation:
  language: zh_hans
  text: 人[a]出去做工、劳作[b]，直到晚上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“人”是泛指，指人类。希伯来文 אָדָם 采用单数形式。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“到他的工作和他的劳作那里”；两个带所属词尾的并列短语强调人出去从事日常劳动。
    reason: source_form
lexical_decisions:
- source_word: יֵצֵא
  choice: 出去
  rationale: 这是 יצא 的 Qal 未完成式第三人称阳性单数；在诗歌语境中表示惯常发生的行动。前文写夜间野兽活动，这里转到人白天出去工作，因此译为自然明确的“出去”。
- source_word: אָדָם
  choice: 人
  rationale: אָדָם 在此是代表全人类的泛指单数，与前文的动物形成对照。“人”既保留希伯来文的单数形式，也能在现代汉语中自然表达泛指意义。
- source_word: לְפָעֳלוֹ
  choice: 做工
  rationale: פֹּעַל 可指工作、行为或活动；前置的 לְ־ 在 יצא 之后表达目的。译作“出去做工”符合现代汉语习惯，也保留其宽泛含义。
- source_word: וְלַעֲבֹדָתוֹ
  choice: 劳作
  rationale: עֲבֹדָה 可指工作、服事或劳作。这里与 פֹּעַל 并列，采用“劳作”既保留两词的语义重叠和轻微区别，也避免机械重复“工作”。
- source_word: עֲדֵי עָרֶב
  choice: 直到晚上
  rationale: עֲדֵי 是诗体的“直到”，עָרֶב 指晚上；“直到晚上”清楚保留一天劳作的时间终点。
theological_decisions:
- issue: אָדָם 在关于人类日常生活的泛指陈述中如何表达
  choice: 人
  alternative: 人类；一个人
  rationale: 本节描述受造秩序中人类白天工作的通常情形。希伯来文以阳性单数 אָדָם 代表人类；汉语“人”可以同时保留单数外形和泛指功能，不必将其限定为某个男子，也不必抽象化为“人类”。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“做工、劳作”保留原文两个近义名词的并列，同时避免在汉语中反复使用“他的”所造成的生硬感；顿号使二者共同受“出去”支配。
