base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/010.yaml
  text: He sends springs into the valleys[a]; they flow between the mountains.
translation:
  language: zh_hans
  text: 他使泉水在溪谷中流淌，在群山之间奔流。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在山沟中”或“在谷地中”；希伯来语 נחל 可指季节性河床、溪谷、山沟，或与这类水道相连的谷地。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשַׁלֵּחַ
  choice: 他使……涌入
  rationale: 该词是 שׁלח 的使役形主动分词，在诗篇的描述中表达上帝持续施行的作为。译作“他使……涌入”既承接上下文中的上帝，也自然呈现水泉被发出的动态。
- source_word: מַעְיָנִים
  choice: 泉水
  rationale: מַעְיָן 指天然涌出的泉或泉源；“泉水”符合现代汉语习惯，也便于在下半句以水为复数意义上的整体来理解其流动。
- source_word: בַּנְּחָלִים
  choice: 涌入谷地
  rationale: נחל 可指季节性河床、溪谷、山沟或与水道相连的谷地。介词 ב 可按位置译为“在”，也可在使役移动语境中表达进入；此处“涌入谷地”自然衔接泉水在群山间流淌的图景，同时以脚注保留其他地形含义。
- source_word: בֵּין
  choice: 在……之间
  rationale: 直接表达泉水流经群山之间的位置关系。
- source_word: הָרִים
  choice: 群山
  rationale: הָרִים 可指山或丘陵；“群山”简洁地传达复数，并与谷地的地貌图景相配。
- source_word: יְהַלֵּכוּן
  choice: 流淌
  rationale: הלך 字面义为“行走、前行”，主语为泉水时，现代汉语惯用“流淌”，既保留移动含义，也避免生硬直译。
theological_decisions:
- issue: 分词的隐含主语
  choice: 以“他”指上帝
  alternative: 译作名词化的“那使泉水涌出的”
  rationale: 带冠词的分词承接本诗对上帝治理受造界的描述。汉语需补出主语，“他”最自然，但不在本节额外加入神名。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“涌入”与“流淌”形成连贯水景；不使用较生僻的地理术语“旱谷”，而在脚注中保留原词的语义范围。
