  text: בָּרֲכִ֥י נַפְשִׁ֗/י אֶת יְה֫וָ֥ה יְהוָ֣ה אֱ֭לֹהַ/י גָּדַ֣לְתָּ מְּאֹ֑ד ה֭וֹד וְ/הָדָ֣ר לָבָֽשְׁתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/001.yaml
  text: Bless Yahweh[a], O my soul! Yahweh my God, you are very great; you have clothed yourself with splendor and majesty.
translation:
  language: zh_hans
  text: 我的心哪，要称颂雅威[a]！雅威我的上帝啊，你何其伟大！你披戴尊荣和威严。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；正文音译为“雅威”。此名也常译作“耶和华”或“上主”。
    reason: 说明四字神名的原文形式、正文译名及常见替代译法。
lexical_decisions:
- source_word: בָּרֲכִי
  choice: 要称颂
  rationale: 这是对“我的心”发出的阴性单数命令式。汉语敬拜语境中“称颂”既保留ברך的祝颂含义，也比单纯“赞美”更贴近原文。
- source_word: נַפְשִׁי
  choice: 我的心哪
  rationale: נפש在这里指诗人向自己的内在生命发言；“我的心哪”是自然、庄重的现代汉语呼语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以汉语中广为人知的专名形式呈现四字神名，并用脚注说明其希伯来文形式及其他常见译法。
- source_word: גָּדַלְתָּ מְּאֹד
  choice: 你何其伟大
  rationale: 完成式在赞美诗语境中表达当前恒常状态；“何其伟大”自然传达מְאֹד的强烈程度和诗歌感。
- source_word: הוֹד וְהָדָר
  choice: 尊荣和威严
  rationale: 两个近义词共同描写上帝可见的荣美与王者气度；此搭配兼顾词义区分和现代汉语的庄重感。
- source_word: לָבָשְׁתָּ
  choice: 为衣
  rationale: 保留上帝把尊荣与威严穿在身上的衣着隐喻，同时用简洁而自然的汉语诗体表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用现代简体中文读者最熟悉的音译“耶和华”，不以称号替代专名；脚注保留其形式及译名差异。
- issue: נפש的语义范围
  choice: 我的心
  alternative: 我的灵魂；我自己
  rationale: 此处是诗人对自己的内在生命发出劝勉。“心”在现代汉语中自然且不暗示特定的灵魂—身体二分论，同时保留自我呼告。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“我的心哪”保留自我呼告；两个感叹句呈现原文赞叹的力度；末句保留衣着隐喻，避免扩写为原文没有明说的反身结构。
