  text: 少壮狮子为猎物吼叫，向上帝寻求食物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכְּפִירִים
  choice: 少壮狮子
  rationale: 指年轻而已有捕猎能力的狮子；“少壮狮子”比单纯“幼狮”更准确，也符合诗体语域。
- source_word: שֹׁאֲגִים לַטָּרֶף
  choice: 为猎物吼叫
  rationale: 保留原文“吼叫”及介词结构；לַטָּרֶף可自然理解为以猎物为目标。
- source_word: וּלְבַקֵּשׁ מֵאֵל אָכְלָם
  choice: 向上帝寻求食物
  rationale: מֵאֵל表达从上帝那里求取、仰赖上帝供应；中文用“向上帝寻求”兼顾来源与动作，并保留原文神学陈述。
theological_decisions:
- issue: 狮子的捕食与上帝供应之间的关系
  choice: 向上帝寻求食物
  alternative: 从上帝那里觅取食物
  rationale: 原文把野兽捕食描写为向上帝求取供应；译文保留这一张力，不把它改释成单纯的自然本能，也不额外说明供应方式。
translation_notes:
  register: 采用庄重而现代的诗歌语言；句式简洁，与上下文描写夜间受造界活动的节奏相称。
