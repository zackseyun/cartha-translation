base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/032.yaml
  text: He looks at the earth[a], and it trembles; he touches the mountains, and they smoke.
translation:
  language: zh_hans
  text: 他观看大地[a]，大地就震动；他触摸群山，群山便冒烟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较按原文形式译：“那观看大地、大地便震动的那一位，触摸群山，群山便冒烟。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבִּיט
  choice: 他观看
  rationale: 该词是נבט的使役形分词，在这里带有实体化、描述性的作用，直译近于“那观看……的”。结合上文明确的神圣主语，以“他观看”表达更符合现代汉语诗歌的自然节奏，同时保留持续而鲜明的画面。
- source_word: לָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ可指“土地”或“大地”。诗篇104篇处于宇宙创造的语境，“大地”比局部性的“土地”更能体现普遍范围。
- source_word: וַתִּרְעָד
  choice: 大地就震动
  rationale: רעד表示颤抖、震颤或震动。补出“大地”避免汉语连续代词指代含混；“震动”自然地传达大地因神一望而战栗的诗意。
- source_word: יִגַּע
  choice: 他触摸
  rationale: נגע的基本义为“触及、触摸”。“触摸”保留神只需轻触便使群山冒烟的从容力量，不强化为原文没有明确表达的“击打”。
- source_word: בֶּהָרִים
  choice: 群山
  rationale: הָרִים是“山”的复数。“群山”既准确体现复数，也比“众山”更符合现代汉语诗体。
- source_word: וְיֶעֱשָׁנוּ
  choice: 群山便冒烟
  rationale: עשׁן在此表示“冒烟”，复数动词与“群山”一致。重复“群山”使汉语指代清楚，并保留山受触即冒烟的鲜明意象。
theological_decisions:
- issue: 分词句中隐含的神圣主语
  choice: 依上下文译为“他”，指向本诗所颂赞的耶和华。
  alternative: 更形式对应地译为“那观看大地、大地就震动的；他触摸群山，群山便冒烟”。
  rationale: 希伯来文以带冠词的分词“那观看者”起句，具有描述性称谓的色彩；上下文所指明确。正文采用“他”使现代汉语自然，脚注保留其较形式化的句法可能，不额外引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。用“大地”“群山”维持宇宙性的宏阔画面；以“就／便”表现神一望、一触所立即引发的反应。为避免汉语中两个“它”所造成的指代不清，后半分句重复“大地”和“群山”。
