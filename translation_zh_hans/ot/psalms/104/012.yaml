    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵיהֶם
  choice: 在水流之上
  rationale: עַל带第三人称复数后缀，回指上一节的水泉或水流，可表达“在其上方”。为使中文指代清楚，补明“水流”，同时保留空间关系。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 天空的飞鸟
  rationale: עוֹף是集合名词，指飞禽；הַשָּׁמַיִם在此表示天空。“天空的飞鸟”自然、庄重，并保留希伯来语属格意象。
- source_word: יִשְׁכּוֹן
  choice: 栖息
  rationale: שׁכן意为居住、安居或停驻。用于鸟类时，“栖息”自然贴切，又不像“筑巢”那样加入原文未明说的行为。
- source_word: מִבֵּין
  choice: 从……间
  rationale: 该介词组合表示声音从某些物体之间或当中传出；“从……间”简洁保留来源和位置含义。
- source_word: עֳפָאיִם
  choice: 枝叶
  rationale: 此罕见复数名词可能指树枝、枝杈或繁茂叶丛。“枝叶”在语境中自然，并适度保留其可能兼指带叶树枝的宽泛含义；词义的不确定性另以脚注说明。
- source_word: יִתְּנוּ קוֹל
  choice: 发出鸣声
  rationale: 字面为“发出声音”。主语是鸟，“鸣声”符合现代汉语，同时不将其过度限定为歌唱。
