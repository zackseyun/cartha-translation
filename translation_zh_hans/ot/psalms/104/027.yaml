  yaml_path: translation/ot/psalms/104/027.yaml
  text: All of them wait for you to give them their food in its time[a][b].
translation:
  language: zh_hans
  text: 它们全都仰望你，等候你在适当的时候赐给它们食物。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仰望你”也可译为“期待你供应”或“寄望于你”。
    reason: lexical_alternative
  - marker: b
    text: “在适当的时候”也可译为“按时”或“在所定的时候”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: 这一切都
  rationale: 指回上下文所述的一切受造物，保留“它们全体”的总括意义；汉语用“这一切都”自然简洁。
- source_word: אֵלֶיךָ
  choice: 仰望你
  rationale: 介词表示期待所指向的对象；与后面的动词合译为“仰望你”，表达受造物转向并依赖上帝。
- source_word: יְשַׂבֵּרוּן
  choice: 仰望……等
  rationale: 该词在此表示带着期待等候或盼望。“仰望”保留期待与倚赖之意，“等你……”则自然承接不定式所说明的等候内容。
- source_word: לָתֵת
  choice: 等你……赐给
  rationale: 不定式说明受造物所期待之事；汉语补出“等你”，并以“赐给”贴合上帝供应食物的语境。
- source_word: אָכְלָם
  choice: 它们食物
  rationale: 原词泛指供食用之物，并不限于猎物；“食物”适合上下文中的各类生物。
- source_word: בְּעִתּוֹ
  choice: 按时
  rationale: 简明表达在适当、指定的时候，既自然又不额外界定具体时节。
theological_decisions:
- issue: 受造界对上帝供应的依赖
  choice: 译为一切受造物仰望上帝，等候他按时赐食
  alternative: 强化为受造物以敬拜或信心来信靠上帝
  rationale: 原文呈现普遍而期待性的依赖，但没有明确使用敬拜或教义化的措辞，因此不作扩充。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赐给”体现诗篇向上帝说话的语境，但未加入原文没有的教义性内容。主句用“仰望……等……”兼顾希伯来词的期待含义与中文句法的自然性。
