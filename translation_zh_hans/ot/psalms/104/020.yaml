base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/020.yaml
  text: You set darkness[a], and it becomes night; in it all the beasts of the forest creep about.
translation:
  language: zh_hans
  text: 你设下黑暗，便成了黑夜；林中一切走兽都在夜间活动。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活动”也可译作“爬行”或“出没”；原词泛指动物移动，并不一定含有捕猎之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֶׁת
  choice: 你设下
  rationale: 该动词为第二人称阳性单数，直接称呼上帝；“设下”保留“放置、设定”的主动含义，也符合诗歌语体。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 直接表达受造秩序中黑暗的来临，不作额外解释。
- source_word: וִיהִי לָיְלָה
  choice: 夜晚便来到
  rationale: 表达前句动作所带来的结果和状态转变；“便”自然体现希伯来语句式的承接关系。
- source_word: בּוֹ
  choice: 在其中
  rationale: 阳性单数代词最自然地回指“夜晚”，保留原文的指代关系。
- source_word: תִרְמֹשׂ
  choice: 出没
  rationale: רמשׂ在这里指动物移动、活动；“出没”适合夜间林兽的语境，同时不限定为捕猎，也避免“爬行”在现代汉语中仅指贴地爬动的狭义。
- source_word: כָּל חַיְתוֹ יָעַר
  choice: 林中百兽都
  rationale: “林中百兽”自然、凝练地表达“森林的一切走兽/动物”；“都”对应כָּל的整体含义，并符合现代汉语语序。
theological_decisions:
- issue: 上帝在受造秩序中使黑暗来临的主动作用
  choice: “你设下黑暗”直接保留上帝的主动作为
  alternative: “你容许黑暗来临”
  rationale: 原文第二人称动词明确把动作归于上帝；译文不将其弱化为许可，也不进一步加入原文没有说明的因果哲学。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“设下”“百兽”“出没”保留诗意，但仍是普通读者熟悉的表达。脚注标记置于相关分句之后。
