  text: תַּסְתִּ֥יר פָּנֶי/ךָ֮ יִֽבָּהֵ֫ל֥וּ/ן תֹּסֵ֣ף ר֭וּחָ/ם יִגְוָע֑וּ/ן וְֽ/אֶל עֲפָרָ֥/ם יְשׁוּבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/029.yaml
  text: You hide your face[a], they are terrified; you take away their breath[b], they die and return to their dust.
translation:
  language: zh_hans
  text: 你掩面[a]，它们就惊惶；你收回它们的气息[b]，它们便死去，归回尘土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的同在”。希伯来语“你的面”常用来表示临在或恩待。
    reason: lexical_alternative
  - marker: b
    text: 或译“它们的灵”。希伯来语 רוּחַ 可指“气息”“风”或“灵”；这里提到死亡和归回尘土，较支持译作“气息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּיר
  choice: 掩
  rationale: 使役形在此表示隐藏、遮掩；与“面”搭配译作“掩面”，既自然又保留诗歌意象。
- source_word: פָּנֶיךָ
  choice: 你的面
  rationale: 原文直译为“你的面”，在希伯来语中也可指亲自临在或恩宠；正文以“你掩面”保留具体意象。
- source_word: יִבָּהֵלוּן
  choice: 惊惶
  rationale: 该动词表示受惊、慌乱或惶恐；“惊惶”简洁地传达强烈不安，也符合诗体语域。
- source_word: תֹּסֵף
  choice: 收回
  rationale: אסף可指聚集、取走或收回；在上帝赐予并维系生命的语境中，“收回”自然表达生命气息被取走，但不添加原文没有的解释。
- source_word: רוּחָם
  choice: 它们的气息
  rationale: רוּחַ可指气息、风或灵；本节与死亡、归回尘土并列，“气息”最贴合语境，同时用脚注保留“灵”的可能。
- source_word: יִגְוָעוּן
  choice: 死亡
  rationale: גוע表示断气、死亡；“死亡”在现代汉语中清楚庄重。
- source_word: עֲפָרָם
  choice: 尘土
  rationale: 原文带第三人称复数所有格，字面为“它们的尘土”；汉语“归回尘土”更自然，而归属关系已由主语和“归回”充分体现。
- source_word: יְשׁוּבוּן
  choice: 归回
  rationale: שוב意为返回；“归回尘土”保留回到原初来源的含义，也呼应圣经中的受造与死亡意象。
theological_decisions:
- issue: 创造与死亡语境中 רוּחָם 的含义
  choice: 它们的气息
  alternative: 它们的灵
  rationale: 上下文描写受造物失去维持生命的气息，继而死亡并归回尘土。“气息”避免把经文限定为某种灵魂论，同时脚注保留原词可译“灵”的语义张力。
- issue: 上帝“面”的拟人表达
  choice: 你掩面
  alternative: 你隐藏你的临在
  rationale: 保留原文具体而有力的拟人意象，不将其抽象化；脚注说明“面”也可表达临在或恩宠。
- issue: עֲפָרָם 所有格的表达
  choice: 归回尘土
  alternative: 归回它们的尘土
  rationale: 原文确有所有格，但现代汉语若直译“它们的尘土”略显生硬；正文采用自然表达，不改变受造物归回其尘土来源的含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“它们”承接本诗所说的受造物；分号保留原文由惊惶转向死亡结局的推进。所有脚注标记均已置于正文相应词语之后。
