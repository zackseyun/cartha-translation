base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/015.yaml
  text: and wine gladdens the heart of man[a], making the face shine more than oil[b], and bread sustains the heart of man.
translation:
  language: zh_hans
  text: 酒使人心欢喜，使人的脸比油更有光彩；饼使人心强健。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַיִן יְשַׂמַּח לְבַב אֱנוֹשׁ
  choice: 酒使人心欢喜
  rationale: 保留“酒”的具体意象和使役语义；אֱנוֹשׁ在此泛指世人，现代汉语“人”自然涵盖这一代表性单数，无须限定为男性。
- source_word: לְהַצְהִיל פָּנִים
  choice: 使人容光焕发
  rationale: 该短语表示使脸面明亮、有光彩；“容光焕发”是自然、庄重的现代汉语表达，并保留诗歌意象。
- source_word: מִשָּׁמֶן
  choice: 油使……
  rationale: מִן可表示来源或凭借；结合希伯来语诗句的三项并列结构，将油理解为使面容发亮之物，汉语中明说“油使”可清楚呈现这一读法。比较义仍以脚注保留。
- source_word: וְלֶחֶם
  choice: 饼
  rationale: לֶחֶם在此指作为主食的饼或面包；“饼”保留具体食物意象，避免泛化为“食物”。
- source_word: יִסְעָד
  choice: 使……强健
  rationale: סעד意为扶持、支撑或增强；在食物滋养人心的语境中，“使人心强健”既自然又保留原文重复“心”的诗性结构。
theological_decisions:
- issue: אֱנוֹשׁ的代表性单数
  choice: 人
  alternative: 世人／人的心
  rationale: 原词在此泛指必死的人类，并非特指男性；汉语“人”准确而自然地保留其普遍所指。
- issue: מִשָּׁמֶן与前句的关系
  choice: 油使人容光焕发
  alternative: 酒使人的脸比油更有光彩
  rationale: 原文介词מִן既可能表达来源或凭借，也可能表达比较。主译采用与“酒—油—饼”三项恩赐并列相合的工具/来源读法，同时在脚注中保留比较读法，不把原文歧义解释掉。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“人心”两次出现，以保留希伯来文首尾呼应；主句以“酒—油—饼”平行排列，呈现原诗的节奏。
