base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/033.yaml
  text: I will sing to Yahweh as long as I live[b][a]; I will make music to my God while I still live.
translation:
  language: zh_hans
  text: 我要一生向雅威歌唱；我还活着的时候，要向我的上帝奏乐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָשִׁירָה
  choice: 我要……歌唱
  rationale: שׁיר 的 Qal 第一人称单数鼓励式在这里表达坚定的意愿；用“我要”自然传达诗人的决心。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 ל 标明颂赞的对象；יהוה 按其专名译作“雅威”。
- source_word: בְּחַיָּי
  choice: 一生
  rationale: 字面为“在我的生命中”，在本句中表示贯穿有生之年的持续时间；“一生”简洁自然。
- source_word: אֲזַמְּרָה
  choice: 就要……奏乐
  rationale: זמר 的 Piel 第一人称单数鼓励式表示以音乐颂赞。译作“奏乐”可与前句“歌唱”有所区别，同时不限定具体乐器。
- source_word: לֵאלֹהַי
  choice: 向我的上帝
  rationale: 名词带第一人称单数后缀，直接表达“我的上帝”；介词 ל 标明音乐颂赞的对象。
- source_word: בְּעוֹדִי
  choice: 只要我还活着
  rationale: עוֹד 带第一人称后缀表示自身仍然存续。现代汉语以“只要我还活着”最自然，并保留持续至生命终了的意思。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的发音重构，也清楚保留其专名性质。
- issue: בְּעוֹדִי 所指的存续范围
  choice: 只要我还活着
  alternative: 只要我仍然存在
  rationale: 该表达可泛指“仍有存续”，但在与“一生”平行的诗句中明显关乎诗人有生之时；采用自然汉语而不赋予额外的形而上含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个分句以“一生”和“只要我还活着”形成同义递进；“歌唱／奏乐”保留原文两个动词的诗性变化。
