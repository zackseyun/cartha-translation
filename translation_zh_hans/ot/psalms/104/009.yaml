  text: גְּֽבוּל שַׂ֭מְתָּ בַּל יַֽעֲבֹר֑וּ/ן בַּל יְ֝שׁוּב֗וּ/ן לְ/כַסּ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/009.yaml
  text: You set a boundary they may not cross[b][a]; they may not return to cover the earth.
translation:
  language: zh_hans
  text: 你设定了界限，众水不能越过[a]；它们不能再回来覆盖大地。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “界限”也可译作“边界”或“限度”。
    reason: lexical_alternative
  - marker: b
    text: “它们”指众水。
    reason: cross_reference
lexical_decisions:
- source_word: גְּבוּל
  choice: 界限
  rationale: 指所划定、不可越过的边界或限度；“界限”在现代汉语中自然，也适合上帝约束众水的图景。
- source_word: שַׂמְתָּ
  choice: 你划定了
  rationale: שׂוּם本义为“放置、设立”；与“界限”搭配时，“划定”自然地表达设定边界的动作。
- source_word: בַּל
  choice: 不能
  rationale: 该否定词约束随后未完成式动词；“不能”既表达否定，也体现上帝所定界限的约束力。
- source_word: יַעֲבֹרוּן
  choice: 越过
  rationale: עבר意为“经过、跨过”；用于界限时译作“越过”最为贴切。
- source_word: יְשׁוּבוּן
  choice: 再回来
  rationale: שׁוב意为“返回”；结合语境，“再”传达众水不再返回覆盖大地的意思。
- source_word: לְכַסּוֹת
  choice: 淹没
  rationale: כסה直译为“遮盖、覆盖”；在众水与大地的语境中，“淹没”是自然汉语，同时保留水覆盖大地的意象。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 本诗描绘宇宙性的创造秩序，“大地”比局部性的“土地”更符合语境。
theological_decisions:
- issue: 复数动词的所指
  choice: 在正文中明说“水”，指受上帝界限约束的众水。
  alternative: 保留复数代词“它们”，或泛指混沌之水。
  rationale: 紧邻上文明确谈到众水；汉语若只写“它们”容易含混，补出“水”并未超出原文语境。
- issue: “回来”是否暗示洪水事件
  choice: 保留“再回来”，但不在正文中明确指定某一次历史洪水。
  alternative: 将其解释为众水不再以洪水覆盖世界。
  rationale: 原文允许创造秩序与洪水意象相互呼应，但本节本身没有明确点名洪水事件，故不应在正文中限定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“划定了界限”自然表达上帝建立秩序；两次明说“水”以避免汉语代词指向不清。正文保留两个分句的诗行推进，并避免把潜在的洪水联想写成唯一解释。
