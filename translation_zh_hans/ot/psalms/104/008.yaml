  text: יַעֲל֣וּ הָ֭רִים יֵרְד֣וּ בְקָע֑וֹת אֶל מְ֝ק֗וֹם זֶ֤ה יָסַ֬דְתָּ לָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/008.yaml
  text: The mountains rose[a], the valleys sank down, to the place that you established for them.
translation:
  language: zh_hans
  text: 群山升起[a]，山谷沉降——到你为它们所奠定的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按希伯来诗句另一种可信的句法理解，译作：“众水越过群山，又流入山谷，到你为它们所奠定的地方。”这里把上下文中的众水看作省略的主语。
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲלוּ הָרִים
  choice: 群山升起
  rationale: 按马所拉经文的语序和句法，以“群山”为主语；“升起”自然表达地势抬升，也保留 עלה 的上行意象。
- source_word: יֵרְדוּ בְקָעוֹת
  choice: 山谷沉降
  rationale: 以“山谷”为主语，与“群山升起”形成诗意平行；“沉降”比单纯“下去”更符合地貌形成的语境。
- source_word: אֶל מְקוֹם
  choice: 归到……地方
  rationale: אֶל 表示趋向目标；“归到”在中文中自然承接受造秩序各归其位的图景，又不额外说明运动主体。
- source_word: זֶה יָסַדְתָּ
  choice: 你……所设定的
  rationale: זֶה 在此与“地方”相连，中文关系结构无需逐字译作“这个”；יסד 表示奠定、确立，译作“设定”适合上帝安排受造界位置的语境。
- source_word: לָהֶם
  choice: 为它们
  rationale: 保留希伯来文阳性复数代词的复数指向，不强行限定其所指是山岭山谷还是上下文中的众水。
theological_decisions:
- issue: 诗句中动词的主语关系
  choice: 正文将“群山”和“山谷”分别理解为“升起”和“沉降”的主语。
  alternative: 把上下文中的“众水”视为隐含主语：水漫上群山，又流下山谷。
  rationale: 马所拉经文的语序容许将山岭和山谷理解为主语，形成上升与下降的地貌图景；但上下文描述众水退去，另一种句法理解同样可信，因此用脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“群山升起，山谷沉降”保持紧凑平行；脚注明确保留原文真实的句法歧义。
