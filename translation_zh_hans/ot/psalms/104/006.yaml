  text: תְּ֭הוֹם כַּ/לְּב֣וּשׁ כִּסִּית֑/וֹ עַל הָ֝רִ֗ים יַֽעַמְדוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/006.yaml
  text: You covered it with the deep as with a garment[a]; the waters stood above the mountains.
translation:
  language: zh_hans
  text: 你用深水[a]像用衣裳一样遮盖它；众水立在群山之上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“深渊”或“太初的深水”。
    reason: תְּהוֹם指深层、浩瀚的水域；在创造语境中可指太初的深水。
lexical_decisions:
- source_word: תְּהוֹם
  choice: 深渊
  rationale: 此词指浩瀚的深层水域或海洋深处。“深渊”保留了诗篇中的宇宙性水域意象，又不把它限定为神话概念或抽象空间；脚注列出其他可行译法。
- source_word: כַּ/לְּבוּשׁ
  choice: 如同给它披上衣裳
  rationale: 前缀כ表示比拟，לְבוּשׁ意为衣裳。此译自然呈现“以衣裳覆盖”的明喻，并与前面的“覆盖”呼应。
- source_word: כִּסִּיתוֹ
  choice: 你……覆盖它
  rationale: 动词是第二人称阳性单数完成式，带第三人称阳性单数宾语后缀。上下文直接称颂上主，因此保留“你”，并以“它”保留原文代词，而不在本节擅自补明所指。
- source_word: עַל
  choice: 在……之上
  rationale: 这里表示众水位于群山上方；“在……之上”既准确又符合庄重的诗歌语体。
- source_word: הָרִים
  choice: 群山
  rationale: הָרִים通常指山岳；“群山”保留复数和宏阔的创造图景。
- source_word: יַעַמְדוּ
  choice: 立于
  rationale: עמד的基本义是“站立”。“立于”保留原文鲜明的拟人化画面，没有将其释义为“停留”或“高过”。
- source_word: מָיִם
  choice: 众水
  rationale: 希伯来语复数形态在此指前文所述的广大水域。“众水”符合汉语圣诗语体，也维持与“深渊”的平行关系。
theological_decisions:
- issue: 动词的人称与受话者
  choice: 直接对上帝说“你……覆盖它”
  alternative: 改作第三人称叙述：“他覆盖它”
  rationale: 希伯来语形态明确为第二人称阳性单数，且上下文正直接称颂上主。保留第二人称可维持诗篇祷告式赞美的结构。
- issue: 宾语代词所指
  choice: 保留“它”
  alternative: 根据上文明确译为“大地”
  rationale: 宾语后缀本身只表达第三人称阳性单数；虽然上下文很可能指上节所奠定的大地，正文保留代词可避免把语境推断写成原文本节明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“立于”略带诗体色彩，用来保留原文“站立”的生动画面；全句维持直接称颂上帝的第二人称表达。
