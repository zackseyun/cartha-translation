source:
  edition: WLC
  text: לָ/מָ֣ה יְ֭הוָה תַּעֲמֹ֣ד בְּ/רָח֑וֹק תַּ֝עְלִ֗ים לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/001.yaml
  text: Why[a], Yahweh, do you stand far away? Why do you hide yourself in times of trouble?
translation:
  language: zh_hans
  text: 雅威啊，你为什么站在远处？患难的时候，你为什么隐藏自己[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐藏自己”也可译作“使自己隐而不见”。
    reason: 词义与使役词形的表达方式可有不同处理。
lexical_decisions:
- source_word: לָמָה
  choice: 为什么
  rationale: 这是引出哀诉的疑问副词；“为什么”自然、直接，保留了原文质问的情感力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，避免以称号代替原文中的名字。
- source_word: תַּעֲמֹד
  choice: 站
  rationale: 保留עמד的具体空间意象，不将它解释性地改写成“袖手旁观”或“不采取行动”。
- source_word: בְּרָחוֹק
  choice: 在远处
  rationale: 自然地保留诗人所感受到的空间与关系距离。
- source_word: תַּעְלִים
  choice: 隐藏自己
  rationale: 该使役词形在此表达使自己隐而不见；“隐藏自己”是现代汉语中自然且不过度解释的说法。
- source_word: לְעִתּוֹת
  choice: ……的时候
  rationale: 复数时间名词在此作时间状语；汉语用“……的时候”表达自然，也不必机械呈现复数。
- source_word: בַּצָּרָה
  choice: 患难
  rationale: צָרָה可指困苦、危难或压迫处境；“患难”庄重、通俗，并保留较宽的语义范围。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名；采用“雅威”直接呈现其专名性质，而不以称号代替。
- issue: 第二诗行是否补出疑问词
  choice: 补出“为什么”
  alternative: 译作陈述句：“患难的时候，你隐藏自己。”
  rationale: 第二行虽未再次出现לָמָה，但平行结构表明首行的疑问词也统摄第二行；补出“为什么”可在汉语中清楚保留哀诉和质问的力度。
- issue: 是否将“站在远处”解释为漠不关心
  choice: 保留空间隐喻“站在远处”
  alternative: 译作“袖手旁观”或“置身事外”
  rationale: 诗人是在陈述对神遥远和隐藏的感受；保留隐喻可避免把潜在的神学张力过早解释为特定动机。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“雅威啊”自然呈现呼语；两次“为什么”维持希伯来诗歌的平行质问。
