source:
  edition: WLC
  text: כִּֽי הִלֵּ֣ל רָ֭שָׁע עַל תַּאֲוַ֣ת נַפְשׁ֑/וֹ וּ/בֹצֵ֥עַ בֵּ֝רֵ֗ךְ נִ֘אֵ֥ץ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/003.yaml
  text: For the wicked man boasts in the desire of his soul, and the greedy man blesses himself and despises the LORD.
translation:
  language: zh_hans
  text: 因为恶人以自己心中的欲望夸耀；贪婪的人祝福自己，却藐视耶和华。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祝福自己”也可理解为“咒骂、藐视耶和华”。希伯来语“祝福”一词在涉及上帝的某些语境中可作为“咒骂”的委婉说法；本句中该动词的宾语及其与“藐视耶和华”的关系也有不同理解。
    reason: 保留 בֵּרֵךְ 的通常义与其可能的委婉反语义，并说明原文句法歧义。
lexical_decisions:
- source_word: הִלֵּל
  choice: 夸耀
  rationale: 此处为赞美、夸耀之意；与宾语“自己心中的欲望”连用，表达恶人以其欲望自夸。
- source_word: תַּאֲוַת נַפְשׁוֹ
  choice: 自己心中的欲望
  rationale: נפשׁ在此指人的内在自我或生命主体；现代汉语用“心中”自然表达其欲求，同时保留“他的/自己的”这一归属关系。
- source_word: בֹצֵעַ
  choice: 贪婪的人
  rationale: 该分词可指贪图不义之利、攫取利益的人；“贪婪的人”简洁并符合本节伦理语境。
- source_word: בֵּרֵךְ
  choice: 咒骂
  rationale: ברך通常意为“祝福”，但在某些涉及上帝的语境中可作委婉反语，指“咒骂”；此读法使它与后面的“藐视耶和华”构成并列。
- source_word: נִאֵץ
  choice: 藐视
  rationale: 该词表示轻蔑、侮辱或亵渎；“藐视”既自然又保留对耶和华公然不敬的含义。
- source_word: יהוה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应四字神名。
theological_decisions:
- issue: וּבֹצֵעַ בֵּרֵךְ נִאֵץ יְהוָה 的句法与 בֵּרֵךְ 的反语含义
  choice: “贪婪的人咒骂、藐视耶和华”
  alternative: “贪婪的人祝福自己，却藐视耶和华”或“贪婪的人祝福，并藐视耶和华”
  rationale: 马所拉文本没有“自己”这一明确宾语；把 בֵּרֵךְ 视为涉及上帝时的委婉反语，能以“咒骂、藐视”自然呈现两个动词的关系。不过原文容许其他句法分析，故以脚注保留歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“心中的欲望”避免过度古雅；分号呈现两项彼此相关的恶人行为。脚注保留希伯来文在“祝福/咒骂”及宾语补足方面的歧义。
