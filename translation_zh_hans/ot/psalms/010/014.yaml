id: PSA.10.14
reference: Psalms 10:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רָאִ֡תָה כִּֽי אַתָּ֤ה עָ֘מָ֤ל וָ/כַ֨עַס תַּבִּיט֮ לָ/תֵ֪ת בְּ/יָ֫דֶ֥/ךָ עָ֭לֶי/ךָ יַעֲזֹ֣ב חֵלֶ֑כָה יָ֝ת֗וֹם אַתָּ֤ה הָיִ֬יתָ עוֹזֵֽר־׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/014.yaml
  text: You have seen[a], for you look upon trouble and grief, to take it into your hand. The helpless commits himself to you[c][b]; you have been the helper of the fatherless.
translation:
  language: zh_hans
  text: 你已经看见；你察看苦难和愁苦，要亲手处理[a]。无助的人把自己交托给你[b]；孤儿[c]，你向来是他的帮助者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“把它放在你手中”；这一希伯来语表达也可理解为上帝亲自接手处理此事。
    reason: lexical_alternative
  - marker: b
    text: 或译：“无助的人把自己的事交给你。”希伯来语没有明说所交托的是这个人自己，还是他的苦情或案件。
    reason: alternative_reading
  - marker: c
    text: “孤儿”原文尤其指失去父亲、缺乏保护的人，也可译作“无父的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִתָה
  choice: 你已经看见
  rationale: 这是动词“看见”的第二人称阳性单数完成式，直接称呼上帝。“已经看见”既保留完成体，也表明诗人的申诉以此前所确认的上帝洞察为根据。
- source_word: עָמָל
  choice: 苦难
  rationale: 在哀诉诗语境中，该词常指压迫造成的祸患、苦楚或恶行；“苦难”比单纯的“劳苦”更符合受欺压者的处境。
- source_word: כַעַס
  choice: 愁苦
  rationale: 该词可指烦恼、恼怒或令人悲痛之事；与“苦难”并列时，“愁苦”自然表达上帝所察看的痛苦，而不武断地将其解释为上帝的愤怒。
- source_word: תַּבִּיט
  choice: 你察看
  rationale: 该动词在此表示专注地看、留意；“察看”保留视觉意象，也含有认真关注之意。
- source_word: לָתֵת בְּיָדֶךָ
  choice: 要亲手处理
  rationale: 字面为“放在你手中”。在上下文中，这一惯用表达指上帝把事情掌握在手中并采取行动；“亲手处理”以自然现代汉语传达此意，脚注保留较直译的可能。
- source_word: עָלֶיךָ יַעֲזֹב
  choice: 把自己交托给你
  rationale: 介词结构在此表达将自己或自己的案件托付给上帝，而非消极意义上的遗弃。“交托”体现倚靠，同时由脚注保留宾语所指的歧义。
- source_word: חֵלֶכָה
  choice: 无助的人
  rationale: 该名词指不幸、软弱、缺乏保护的人。“无助的人”与下半句的孤儿相呼应，并突出其对上帝的倚赖。
- source_word: יָתוֹם
  choice: 孤儿
  rationale: 该词通常指失去父亲、因而缺乏家庭保护的人。现代汉语用“孤儿”最自然；脚注说明其较具体的社会含义。
- source_word: עוֹזֵר
  choice: 帮助者
  rationale: 这是作表语使用的分词，称上帝为持续施行帮助的那一位；“帮助者”简洁并保留其人格性。
theological_decisions:
- issue: 上帝的察看是否包含介入行动
  choice: 上帝察看苦难，并亲手处理此事
  alternative: 上帝察看苦难和愁苦，为要把它放在自己手中
  rationale: 不定式短语“放在你手中”在语境中自然指向上帝接手并行动，而非仅仅被动观察；译文没有进一步限定其行动是审判、拯救或其他具体方式。
- issue: 无助者交托给上帝的是什么
  choice: 无助的人把自己交托给上帝
  alternative: 无助的人把自己的案件或苦情留给上帝
  rationale: 希伯来语没有明说宾语，可以指这个人自己，也可以指他的遭遇或案件。正文采用符合依靠语境的“把自己交托”，脚注明确保留另一种理解。
- issue: יָתוֹם所指的弱势身份
  choice: 正文译作“孤儿”
  alternative: 译作“无父的人”
  rationale: “孤儿”是自然、庄重的现代汉语，但原词尤其可指失去父亲、因而失去社会和经济保护的人；脚注保留这一具体含义。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“察看”“交托”“帮助者”保留诗篇祷告的尊严，但避免生僻古语；分号呈现两个平行思想，“向来是”传达完成式所体现的持续经验。
