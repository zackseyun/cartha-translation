  text: קוּמָ֤/ה יְהוָ֗ה אֵ֭ל נְשָׂ֣א יָדֶ֑/ךָ אַל תִּשְׁכַּ֥ח עניים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/012.yaml
  text: Rise up[a], O Yahweh; O God, lift up your hand. Do not forget the afflicted.
translation:
  language: zh_hans
  text: 雅威啊，求你起来！上帝啊，举起你的手；不要忘记困苦的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“贫穷人”、“卑微人”或“受压迫的人”。这个希伯来词可广泛指处境低下、脆弱无助的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: 求你起来
  rationale: 这是向上帝发出的命令式恳求。加“求你”符合现代汉语祷告语气，“起来”保留原文催促上帝采取行动的紧迫感。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号代替。
- source_word: אֵל
  choice: 上帝啊
  rationale: 此处是与“雅威啊”平行的直接呼告；“上帝啊”自然、庄重，并保留诗句的平行结构。
- source_word: נְשָׂא
  choice: 举起
  rationale: 命令式动词以“你的手”为宾语。“举起”既贴近原文，也保留上帝将要施行干预或审判的具体意象。
- source_word: יָדֶךָ
  choice: 你的手
  rationale: 保留原文具体的拟人化表达，不将其解释性改写为“施展能力”或“采取行动”。
- source_word: אַל תִּשְׁכַּח
  choice: 不要忘记
  rationale: 直接保留希伯来语否定祈使的措辞；“忽视”虽可能表达语境效果，却比原文更具解释性。
- source_word: עניים
  choice: 困苦人
  rationale: 该复数词可指贫穷、受苦、卑微或遭压迫的人。诗篇第10篇的语境突出恶人手下处境低下而脆弱的受害者；“困苦人”在现代汉语中可兼顾苦难与贫弱，不限于经济贫穷。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”以专名呈现，并较贴近学界通常重构的读音；“耶和华”是历史悠久的另一种汉语形式。
- issue: “举起你的手”的含义
  choice: 保留具体意象，不明说是审判或拯救
  alternative: 伸手施行审判／拯救
  rationale: 原文只求上帝“举起手”，可涵盖惩治恶人、援救困苦者等行动。直译保留诗歌意象及其神学张力，避免把可能的含义缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你起来”表达急切恳求而不显生硬；两个呼告“雅威啊／上帝啊”保留希伯来诗歌的平行结构。分号连接后两项祈求，使节奏紧凑。
