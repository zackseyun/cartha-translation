  text: לִ/שְׁפֹּ֥ט יָת֗וֹם וָ֫/דָ֥ךְ בַּל יוֹסִ֥יף ע֑וֹד לַ/עֲרֹ֥ץ אֱ֝נ֗וֹשׁ מִן הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/018.yaml
  text: to give justice to the fatherless and the oppressed[c][b][a], so that man from the earth may terrify no more.
translation:
  language: zh_hans
  text: 为失去父亲的人[a]和受欺压的人[b]伸张正义，使从地而来的凡人[c]不再使人恐惧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“孤儿”。
    reason: lexical_alternative
  - marker: b
    text: 或译“被压碎的人”或“困苦的人”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“从地而来的人”，强调他不过是脆弱必死的凡人。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפֹּט
  choice: 伸张正义
  rationale: 此处不定式承接上文，表达上帝垂听后的目的或结果；“伸张正义”既保留司法含义，也自然表达为弱者主持公道。
- source_word: יָתוֹם
  choice: 失去父亲的人
  rationale: 该词首先指失去父亲、因而缺乏家庭与社会保障的人；此译法比现代汉语中可能暗示父母双亡的“孤儿”更精确。
- source_word: דַּךְ
  choice: 受欺压的人
  rationale: 该词指被压低、压碎或处境困苦的人；“受欺压的人”清楚传达其社会与生存处境，同时不把比喻性的“压碎”硬译出来。
- source_word: בַּל יוֹסִיף עוֹד
  choice: 不再
  rationale: בַּל与“继续、再加上”之意的יוֹסִיף及עוֹד连用，表示某行动不再继续；汉语以“不再”简洁自然地表达。
- source_word: לַעֲרֹץ
  choice: 令人恐惧
  rationale: ערץ表示使人惊恐、造成威吓；“令人恐惧”保留其使役意义，也避免与前面的“受欺压”混同。
- source_word: אֱנוֹשׁ מִן הָאָרֶץ
  choice: 地上的人
  rationale: אֱנוֹשׁ可强调人的脆弱和必死性，מִן הָאָרֶץ可指来自地土或属于地上的领域；“地上的人”在现代汉语中自然，并由脚注说明其“尘土凡人”的语意。
theological_decisions:
- issue: אֱנוֹשׁ的单数阳性泛指及מִן הָאָרֶץ的含义
  choice: 地上的人
  alternative: 出于尘土的凡人／地上的世人
  rationale: 希伯来语以单数男性名词泛指施行威吓的凡人，并借“地/尘土”凸显人与上帝相比不过是脆弱必死者。译文不将其限定为某一个男性，也不把“地”武断解释为政治意义上的“土地”；相关语意保留在脚注中。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“失去父亲的人”精确表达古代社会法律语境中的弱势身份；“伸张正义”保留司法色彩；句末以“令人恐惧”自然呈现希伯来语使人惊恐的含义。所有脚注标记均置于对应词语之后。
