  text: יְהוָ֣ה מֶ֭לֶךְ עוֹלָ֣ם וָ/עֶ֑ד אָבְד֥וּ ג֝וֹיִ֗ם מֵֽ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/016.yaml
  text: Yahweh is King forever and ever[a]; nations have perished from his land.
translation:
  language: zh_hans
  text: 雅威永永远远为王；列国已经从他的土地上[a]灭绝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国已经从他的大地上灭绝。”希伯来语这个名词可按语境指“土地”或“大地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译保留上帝的专名，不以“主”这一称号替代。
- source_word: מֶלֶךְ
  choice: 为王
  rationale: 希伯来文是谓语名词；“为王”在现代汉语中自然、庄重，也保留其王权宣告，而不扩写为其他动作。
- source_word: עוֹלָם וָעֶד
  choice: 永永远远
  rationale: 这一成对表达加强持续无尽的意义；“永永远远”既符合汉语习惯，也保留强调语气。
- source_word: אָבְדוּ
  choice: 已……灭亡
  rationale: 完成式陈述已经成就的事实；“已……灭亡”保留完成意味，又不加入原文没有明说的被动施事者。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 此处指众外邦国家或民族；“列国”适合诗歌体，也避免把词义收窄为特定神学类别。
- source_word: מֵאַרְצוֹ
  choice: 从他的土地上
  rationale: אֶרֶץ 可指“土地/国土”或“大地”；正文采用本诗语境中较具体的“土地”，并用脚注保留更广的可能含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专名的性质，而不以称号代替。
- issue: אַרְצוֹ 的范围
  choice: 他的土地
  alternative: 他的大地
  rationale: 原词既可能具有领土性的具体含义，也可能指属于雅威的全地。正文依上下文采用较具体的译法，脚注保留普世范围的读法，不消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“永永远远为王”保留宣告性的节奏；分号呈现两句之间由雅威永恒王权转向列国灭亡的紧密对照。
