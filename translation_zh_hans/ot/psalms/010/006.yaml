base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/006.yaml
  text: He says in his heart[a], “I will not be shaken[b]; through generation after generation I will not be in trouble.”
translation:
  language: zh_hans
  text: 他心里说：“我必不动摇[a]；世世代代，我都不会遭遇祸患[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必不被摇撼”或“我必不挪动”。希伯来语动词可表示被摇撼、动摇、蹒跚或失去稳固。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语末句结构省略，也可较直译为：“世世代代不在祸患中的人”，或意译为：“我永不会遭灾。”
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: 说
  rationale: 诗歌中的完成式可生动描述恶人当下持续的内心言语；现代汉语用“说”自然贴切。
- source_word: בְּלִבּוֹ
  choice: 心里
  rationale: 保留希伯来语“在心中”的意象，同时自然表达暗自思量或自言自语。
- source_word: בַּל אֶמּוֹט
  choice: 我必不动摇
  rationale: בַּל是否定词；מוט的尼法勒式表示被移动、摇撼或失去稳固。“不动摇”既保留稳固的比喻，也符合庄重的现代汉语。
- source_word: לְדֹר וָדֹר
  choice: 世世代代
  rationale: 表达一代接一代、长久延续的时间范围，也传达恶人自以为安稳长存的夸口。
- source_word: אֲשֶׁר לֹא בְרָע
  choice: 我都不会遭遇祸患
  rationale: 原文末句省略成分，בְרָע可指处于灾祸、患难之中。正文承接前面的第一人称内心独白，使中文完整自然，同时以脚注保留其他可能理解。
theological_decisions:
- issue: 末句的省略结构及其人称归属
  choice: 将末句理解为恶人继续以第一人称夸口：“我都不会遭遇祸患。”
  alternative: 可较形式化地理解为“世世代代不在祸患中的人”，或概括为“我永不会遭灾”。
  rationale: 上下文是恶人的内心言语，延续第一人称最连贯；但希伯来语אֲשֶׁר לֹא בְרָע结构简略，确有句法歧义，因此在脚注中保留其他可能译法，不将其作神学化消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心里说”保留原文意象；“世世代代”凝练自然；用“祸患”兼顾רָע在此处可能包含的灾难、患难之义。所有歧义均通过正文与脚注共同呈现。
