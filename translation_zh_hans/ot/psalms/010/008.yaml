  text: יֵשֵׁ֤ב בְּ/מַאְרַ֬ב חֲצֵרִ֗ים בַּֽ֭/מִּסְתָּרִים יַהֲרֹ֣ג נָקִ֑י עֵ֝ינָ֗י/ו לְֽ/חֵלְכָ֥ה יִצְפֹּֽנוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/008.yaml
  text: He sits in ambush in the villages[a]; in the hiding places he murders the innocent[b]; his eyes watch for the helpless.
translation:
  language: zh_hans
  text: 他埋伏在村庄中[a]；在隐蔽处杀害无辜的人；他的眼睛暗中窥伺无助的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “村庄”也可译作“聚落”，或在此较不可能译作“院落、围院”。
    reason: lexical_alternative
  - marker: b
    text: 本句的希伯来文表达艰深。末尾的动词较直译与“隐藏、潜伏”有关；以“他的眼睛”为主语时，可理解为暗中盯住易受伤害的目标。“无助的人”也可译作“遭难的人”或“弱者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: 埋伏
  rationale: 该动词本义为“坐、居留”，但与“埋伏”一词连用，描绘恶人长时间潜伏待机；汉语用“埋伏”自然凝练地表达整个短语的作用。
- source_word: בְּמַאְרַב
  choice: 埋伏
  rationale: 该名词指埋伏或伏击之处；与前面的动词合译为“埋伏”，既自然，也保留隐蔽伺机害人的意味。
- source_word: חֲצֵרִים
  choice: 在村庄中
  rationale: 此词可指村庄、聚落，也可指院落或围起来的地方；在此语境中，“村庄”最符合恶人在有人居住之处附近伺机害人的图景。介词直译为“在”，不擅自改作“附近”。
- source_word: בַּמִּסְתָּרִים
  choice: 在隐蔽处
  rationale: 复数形式表示隐秘、遮蔽的地点；汉语集合性表达“隐蔽处”自然，并保留具体空间意象。
- source_word: יַהֲרֹג
  choice: 杀害
  rationale: 该动词意为“杀死”；宾语是无辜者，且上下文是蓄意伏击，因此“杀害”准确传达不义的暴力，又比现代法律术语“谋杀”更适合诗歌语体。
- source_word: נָקִי
  choice: 无辜的人
  rationale: 该词指没有罪责或无可归罪的人；暴力语境下译作“无辜的人”清楚自然。
- source_word: עֵינָיו
  choice: 他的眼睛
  rationale: 保留原文以“眼睛”为突出的具体意象，不简化为“他”。
- source_word: לְחֵלְכָה
  choice: 无助的人
  rationale: 这是含义困难且罕见的词，在本诗中指易受欺压、遭遇不幸的弱者；“无助的人”符合捕食性语境，同时不把其范围限定为贫穷者。
- source_word: יִצְפֹּנוּ
  choice: 暗中窥伺
  rationale: 该形式与“隐藏、潜藏”有关，但以“眼睛”为实际主语时，语义是隐秘地盯住猎物；“暗中窥伺”保留隐蔽性与敌意，比单纯“观看”更贴切。
theological_decisions: []
