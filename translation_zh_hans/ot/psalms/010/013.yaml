  text: עַל מֶ֤ה נִאֵ֖ץ רָשָׁ֥ע אֱלֹהִ֑ים אָמַ֥ר בְּ֝/לִבּ֗/וֹ לֹ֣א תִּדְרֹֽשׁ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/013.yaml
  text: Why does the wicked man despise God? He says in his heart, “You will not call to account.”
translation:
  language: zh_hans
  text: 恶人为什么藐视上帝？他心里说：“你必不追究。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל מֶה
  choice: 为什么
  rationale: 这是询问原因的常见表达；在本句中自然引出对恶人行为的质问。
- source_word: נִאֵץ
  choice: 藐视
  rationale: 该动词可指轻蔑、亵渎；此处宾语是上帝，“藐视”既保留轻蔑含义，也避免加入原文未明确表达的言语性亵渎。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 以现代汉语常用的名词表达道德上邪恶的人，与诗篇语域相称。
- source_word: בְּלִבּוֹ
  choice: 心里
  rationale: 希伯来语的“心”指内在思想和意念；直译为“心里”自然且保留原文意象。
- source_word: לֹא תִּדְרֹשׁ
  choice: 你必不追究
  rationale: דרש在此语境中指查问、追讨并要求负责；“追究”简洁涵盖上帝调查并问责的含义。未补出“账”或“罪”，以免缩窄原文。
theological_decisions:
- issue: לֹא תִּדְרֹשׁ 的主语与语气
  choice: 你必不追究
  alternative: 他必不追究／你不会查问
  rationale: 动词为第二人称阳性单数，恶人在心里直接以“你”指向上帝；陈述语气表达恶人自以为上帝不会介入或问责，并不代表诗人认可这一判断。
- issue: נִאֵץ 的宗教语义强度
  choice: 藐视上帝
  alternative: 亵渎上帝
  rationale: 原词容许“亵渎”的含义，但上下文重在恶人轻看上帝、断言上帝不会追究；“藐视”保留语义张力，不把行为限定为口头亵渎。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。保留诗句的反问及恶人内心直接对上帝说话的结构，不添加解释性成分。
