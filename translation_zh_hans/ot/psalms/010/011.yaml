  rationale: 将“他掩面不看”改为“他掩起脸来”，使“隐藏脸面”的拟人化图像与随后“永远不会看见”的断言分别呈现，忠实保留原文的句法层次和重复语义。同步修订脚注，使替代译法自然且与正文的表达一致。
