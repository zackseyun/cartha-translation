base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/011.yaml
  text: He says in his heart[a], “God has forgotten; he has hidden his face; he will never see.”
translation:
  language: zh_hans
  text: 他心里说[a]：“上帝忘记了；他掩起脸来；他永远不会看见。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他心里曾说……上帝忘记……他掩起了脸来……他永远不看。”希伯来诗歌中的完成式动词可按现在或惯常情形理解，也可带过去或现在完成的意味。
    reason: 保留希伯来诗歌完成式动词在时态和体貌上的真实歧义。
lexical_decisions:
- source_word: אָמַר
  choice: 说
  rationale: 该词是Qal完成式第三人称阳性单数；在诗歌的生动叙述中可表达当前或惯常的思想。正文用现代汉语“说”，由上下文自然理解为持续的内心言语。
- source_word: בְּלִבּוֹ
  choice: 心里
  rationale: 保留希伯来语“在他心中”的意象，同时“他心里说”是自然的现代汉语，明确表示内心所想。
- source_word: שָׁכַח
  choice: 忘记了
  rationale: 基本义为“忘记”。“了”可表达恶人认定上帝已经忘记，却不把该词解释性改写为“置之不理”。
- source_word: אֵל
  choice: 上帝
  rationale: 此处单数名词指真神；“上帝”是现代标准普通话中清楚、庄重且通行的对应词。
- source_word: הִסְתִּיר פָּנָיו
  choice: 他掩面不看
  rationale: 保留“隐藏面容”的拟人意象；“掩面”简洁而庄重。“不看”使该汉语表达易懂，同时与下句“看见”形成原文中的语义呼应。
- source_word: בַּל רָאָה לָנֶצַח
  choice: 永远不会看见
  rationale: בַּל与לָנֶצַח共同表达持久否定，即“永不”。保留“看见”的基本义，不提前解释为“留意”或“审判”。
theological_decisions:
- issue: 上帝“掩面”的拟人化表达
  choice: 在正文保留“他掩面不看”
  alternative: 他转过脸去／他不再留意
  rationale: 原文采用具体的面容意象。保留这一表达可维持诗篇的神学张力，且不把恶人的错误判断改写成抽象解释。
- issue: 完成式动词的时态力度
  choice: 正文按当前内心言语译为“说……忘记了……掩面不看”
  alternative: 他心里曾说：“上帝忘记……他隐藏了自己的面……永远不看。”
  rationale: 希伯来诗歌中的完成式可带过去、现在完成或格言性力度。上下文适合用当前、持续的内心言语，但脚注保留另一种时态理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心里说”自然表达内在思想；分号保留恶人推论的层次。“掩面”保留圣经意象，“看见”保留原文措辞及其可能隐含的留意、追究之意。
