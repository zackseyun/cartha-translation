  text: שְׁ֭בֹר זְר֣וֹעַ רָשָׁ֑ע וָ֝/רָ֗ע תִּֽדְרוֹשׁ רִשְׁע֥/וֹ בַל תִּמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/015.yaml
  text: Break the arm of the wicked and evil man[a]; seek out his wickedness until you find none.
translation:
  language: zh_hans
  text: 求你折断那恶人、作恶者的膀臂；查究他的恶行，直到再也找不着。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处按字面可译为“恶人和恶者的膀臂”。这两个称谓可理解为并列的对象，也可理解为对同一人的重复描述。末句直译为“直到你找不着”，指求上帝查究其罪恶，直至再无可查究之处。
    reason: 说明“恶人／恶者”之间的句法歧义，并交代“直到再也找不着”对רִשְׁעוֹ和בַל תִּמְצָא的较直译含义。
lexical_decisions:
- source_word: שְׁבֹר
  choice: 折断
  rationale: 这是阳性单数祈使式，是向上帝发出的直接祈求。“折断”自然有力，又不过度强化为“粉碎”。
- source_word: זְרוֹעַ
  choice: 膀臂
  rationale: 原文直译为“臂膀”，在此象征恶人施害的力量。正文保留具体的诗歌意象；“膀臂”庄重而仍为现代读者所懂。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 形容词名词化，指邪恶的人；“恶人”简洁自然，并保留单数代表性用法。
- source_word: וָרָע
  choice: 作恶者
  rationale: 可理解为与“恶人”平行的第二个名词性描述。“作恶者”保留这一平行关系，但原文也可能只是进一步描述同一人，故以脚注说明。
- source_word: תִּדְרוֹשׁ
  choice: 追查
  rationale: דרש可表示寻索、查究，也可带追究问责之意。“追查”保留主动搜寻的图景，同时适合审判语境。
- source_word: רִשְׁעוֹ
  choice: 他的恶行
  rationale: 该词可指他的邪恶或罪责。结合“追查”，译为“恶行”在中文中搭配自然，同时没有排除其罪责含义。
- source_word: בַל תִּמְצָא
  choice: 直到一无所见
  rationale: 直译近于“直到你找不着”。此译保留向上帝的第二人称寻查图景，并表达恶行被彻底处理、再也无可查见的预期结果。
theological_decisions:
- issue: 如何处理“恶人的膀臂”这一隐喻
  choice: 在正文保留“膀臂”的具体意象
  alternative: 意译为“力量”或“权势”
  rationale: 诗人祈求上帝使压迫者失去作恶能力。保留身体意象忠实于希伯来诗歌，也避免在正文中替读者解释隐喻。
- issue: 如何理解末句 בַל תִּמְצָא
  choice: 译为“直到一无所见”
  alternative: “以致你找不着”或“你必找不着”
  rationale: 原文可表达寻查所得的结果，也可带终点意味。采用“直到”保留祈求上帝彻底追查并处置邪恶的力度，而不把它解释成上帝无法发现罪恶。
- issue: וָרָע 是第二个对象还是对同一恶人的补充描述
  choice: 正文按平行的第二个称谓译作“作恶者”
  alternative: 译作“恶人，就是作恶的人”或将两词合为“邪恶的恶人”
  rationale: 希伯来语允许把它视为与 רָשָׁע 并列的名词性形容词，也可能是对同一对象的进一步描述。正文保留平行感，脚注提示语法上的歧义。
translation_notes:
  register: 采用现代、庄重的祈祷语体。“求你”补出祈使语气；“折断膀臂”保留希伯来诗歌的具体意象。“追查”兼顾寻索与司法追究色彩。
