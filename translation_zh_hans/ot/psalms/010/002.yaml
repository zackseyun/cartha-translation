  text: בְּ/גַאֲוַ֣ת רָ֭שָׁע יִדְלַ֣ק עָנִ֑י יִתָּפְשׂ֓וּ בִּ/מְזִמּ֖וֹת ז֣וּ חָשָֽׁבוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/002.yaml
  text: In the pride of the wicked[a], the poor man is hotly pursued[b]; let them be caught in the schemes they have devised.
translation:
  language: zh_hans
  text: 恶人仗着狂傲，紧紧追逼困苦人[a]；愿他们陷在自己所设计的阴谋里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因恶人的狂傲，困苦人遭到追逼。”希伯来文句法简练；主动动词通常可理解为恶人追逼困苦人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们陷在自己所设计的阴谋里。”希伯来文在这里也可理解为陈述，而不是祈愿。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת רָשָׁע
  choice: 恶人狂妄自大
  rationale: בְּ可表示处境、方式或动因；这里以自然汉语表达恶人的骄傲狂妄，同时保留它与追逼行为之间较宽泛的关系。רָשָׁע是单数的实体化形容词，可泛指恶人。
- source_word: יִדְלַק
  choice: 穷追不舍地逼迫
  rationale: דלק可指燃烧，也可指紧追；本处语境是恶人敌意追赶、迫害穷苦人。“穷追不舍地逼迫”兼顾紧追与压迫之意。
- source_word: עָנִי
  choice: 穷苦人
  rationale: עָנִי可指贫穷、受苦或受压迫的人；“穷苦人”既保留贫困含义，也不排除受苦处境，并自然表达泛指的单数人物。
- source_word: יִתָּפְשׂוּ
  choice: 愿他们落入
  rationale: 该尼法勒未完成式可按祈愿式理解，表达诗人盼望恶人反被擒获；“愿”明确呈现祈求语气，“落入”与计谋构成自然搭配。
- source_word: בִּמְזִמּוֹת
  choice: 计谋中
  rationale: מְזִמּוֹת在此指带有恶意的谋划；בְּ可表达陷在其中，故译为“落入……计谋中”。
- source_word: זוּ חָשָׁבוּ
  choice: 自己所设的
  rationale: זוּ是关系词，חָשָׁבוּ表示筹划、设计；“自己所设的”简洁传达恶人被自己的谋算反制这一含义。
theological_decisions:
- issue: 首句的压缩句法及施事关系
  choice: 把恶人理解为追逼者，把穷苦人理解为受逼迫者
  alternative: 也可按较压缩的方式理解为“恶人骄傲时，穷苦人遭到追逼”，不在正文中明确施事者
  rationale: 动词יִדְלַק为主动形式，רָשָׁע位于动词前，可作主语，עָנִי可作宾语；上下文也支持恶人迫害穷苦人。不过希伯来语句法高度凝练，故在脚注保留较不明确施事者的译法。
- issue: 第二分句的语气
  choice: 按祈愿语气译为“愿他们落入”
  alternative: 按陈述语气译为“他们落入了”或“他们必落入”
  rationale: 未完成式可承载祈愿语气，这与诗篇中的祷告和恶人反陷己谋的主题相合；但形式本身也容许陈述性理解，因此以脚注保存该歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“狂妄自大”表现גַאֲוָה的负面骄傲；“穷追不舍地逼迫”避免把דלק仅窄化为一般追赶；分号保留两个诗行之间由迫害转向祈愿反转的结构。
