source:
  edition: WLC
  text: יָ֘חִ֤ילוּ דרכ/ו בְּ/כָל עֵ֗ת מָר֣וֹם מִ֭שְׁפָּטֶי/ךָ מִ/נֶּגְדּ֑/וֹ כָּל צ֝וֹרְרָ֗י/ו יָפִ֥יחַ בָּ/הֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/005.yaml
  text: His ways prosper at all times[a]; your judgments are on high, out of his sight; as for all his adversaries[b], he snorts at them.
translation:
  language: zh_hans
  text: '他的道路时时亨通[a]；


    你的审判高高在上，不在他眼前；


    至于他一切的敌手，他都嗤之以鼻[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的道路时时稳固。”这里的希伯来动词含义艰深，也有人按其通常词义理解为“翻腾”或“受苦”；但上下文较支持持续亨通或安稳之意。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他向他们喷气（或吹气）”，是表示轻蔑的生动动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחִילוּ
  choice: 亨通
  rationale: 此动词在本节含义艰深；结合恶人自以为稳妥、轻看敌手的上下文，译作“亨通”最能表达诗人所慨叹的持续顺遂，同时以脚注保留“稳固”等可能。
- source_word: דרכ/ו（דַּרְכּוֹ）
  choice: 他所行的
  rationale: “道路”在此指人的行径和人生进程；“他所行的”在现代汉语中自然，也保留其整体行为方式的含义。
- source_word: בְּכָל עֵת
  choice: 无论何时
  rationale: 表达持续、恒常的情形，与“总是”相近，同时保持诗体语气。
- source_word: מָרוֹם
  choice: 高不可及
  rationale: 原词表示在高处；结合后面的“在他面前／眼前”，这里既有空间意象，也暗示恶人认为上帝的审判离他遥远。“高不可及”保留这一张力。
- source_word: מִשְׁפָּטֶיךָ
  choice: 你的审判
  rationale: 可指上帝的司法判决、施行公义的作为或法度；“审判”在本语境中较好地保留司法行动的含义。
- source_word: מִנֶּגְדּוֹ
  choice: 不在他眼前
  rationale: 字面涉及“在他面前／与他相对”；与“高”连用时表达这些审判处于他的视野之外，也可隐含他不把审判放在眼里。
- source_word: כָּל צֹרְרָיו
  choice: 他一切的敌手
  rationale: 指敌对、压迫或与他作对的人；“敌手”兼具敌意和对手之义，适合诗歌语域。
- source_word: יָפִיחַ בָּהֶם
  choice: 他都嗤之以鼻
  rationale: 原文描写向敌手吹气或喷气，表示轻蔑。“嗤之以鼻”是现代汉语中自然且形象的对应表达；脚注说明其字面图像。
theological_decisions:
- issue: 开头动词 יָחִילוּ 所描写的恶人处境
  choice: 恶人所行的持续亨通
  alternative: 他的道路始终稳固；或按该词较通常的词义理解为翻腾、痛苦。
  rationale: 本诗段落在慨叹恶人表面上的成功与狂妄；随后说上帝的审判高远、恶人蔑视敌手，因此“亨通”最符合论述推进，但不应抹去希伯来词本身的困难。
- issue: 上帝的审判“高”与“在他面前”的关系
  choice: 译为审判高不可及、不在恶人眼前，保留空间性和认知性的双重含义。
  alternative: 明确解释为恶人看不见、漠视或认为审判离自己很远。
  rationale: 原文没有明确说明是客观的遥远、恶人的主观无视，还是两者兼有；译文不把这种神学与修辞张力单一化。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分为三行以呈现希伯来诗句的推进。“亨通”简洁表达上下文中的表面成功；“高不可及，不在他眼前”保留原文空间隐喻及恶人不理会上帝审判的可能含义；“嗤之以鼻”以常用成语重现轻蔑喷气的身体意象。
