  text: תַּאֲוַ֬ת עֲנָוִ֣ים שָׁמַ֣עְתָּ יְהוָ֑ה תָּכִ֥ין לִ֝בָּ֗/ם תַּקְשִׁ֥יב אָזְנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/017.yaml
  text: O Yahweh[a], you have heard the desire of the humble; you will prepare their heart[b]; your ear will listen.
translation:
  language: zh_hans
  text: 雅威啊，你已经听见谦卑之人[a]的心愿；你必使他们的心坚定[b]；你必侧耳垂听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谦卑之人”或译“受苦的人”或“温顺的人”。
    reason: lexical_alternative
  - marker: b
    text: “使……坚定”或译“预备”或“使……坚立”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: 心愿
  rationale: 此名词表示愿望、渴求或盼望。译作“心愿”符合祷告语境，也能与下文的“心”自然呼应，但不额外强化情绪程度。
- source_word: עֲנָוִים
  choice: 谦卑人
  rationale: 该词可指谦卑、温顺或身受苦难的人。诗篇第10篇的语境突出受欺压者，但本词也含低微、谦卑之意，因此正文保留“谦卑人”，并在脚注列出其他可能。
- source_word: שָׁמַעְתָּ
  choice: 你已经听见
  rationale: 完成式动词表示雅威已经听见；“已经”在现代汉语中清楚表达已成事实及其当前意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译神的专名，而不以称号“主”代替；“雅威”较直接对应通常重构的读音 Yahweh。
- source_word: תָּכִין
  choice: 你必使……坚定
  rationale: כון 的使役式可表示使稳固、坚立或预备。以“心”为宾语时，“使……坚定”自然地表达使其稳固，同时用脚注保留“预备、坚立”的可能。
- source_word: לִבָּם
  choice: 他们的心
  rationale: 保留希伯来文“心”的具体表达，不将其缩窄解释为思想、意志或内在生命中的某一方面。
- source_word: תַּקְשִׁיב אָזְנֶךָ
  choice: 必侧耳垂听
  rationale: קשׁב 的使役式表示留心听，原文又明确提到“耳”。“侧耳垂听”以自然、庄重的汉语保留听觉意象和专注之意。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用专名音译“雅威”，避免以称号“主”取代；传统译名可由读者背景识别，但不放入正文。
- issue: עֲנָוִים 在本诗语境中的含义
  choice: 谦卑人
  alternative: 受苦的人；温顺的人
  rationale: 上下文确实聚焦受欺压、受苦的人，但该词本身也含谦卑、低微或温顺之义。正文不把它单限定为社会处境，脚注保留词义张力。
- issue: תָּכִין לִבָּם 所表达的行动
  choice: 使他们的心坚定
  alternative: 预备他们的心；使他们的心坚立
  rationale: 原文可指预备或使稳固。正文按“心”为宾语的搭配译作“使……坚定”，但不排除“预备”的解释，故在脚注中明示。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体。“雅威啊”保留呼告语气；“侧耳垂听”既自然又保留原文的耳朵意象。两个脚注标记均置于正文相应词语之后。
