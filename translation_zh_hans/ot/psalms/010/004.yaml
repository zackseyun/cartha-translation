  text: רָשָׁ֗ע כְּ/גֹ֣בַהּ אַ֭פּ/וֹ בַּל יִדְרֹ֑שׁ אֵ֥ין אֱ֝לֹהִ֗ים כָּל מְזִמּוֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/004.yaml
  text: In the pride of his face[a], the wicked man does not seek; all his thoughts are[b], “There is no God.”
translation:
  language: zh_hans
  text: 恶人满脸傲气[a]，不寻求上帝；他一切的意念无非是：“没有上帝。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译作“按他鼻子的高傲”；“鼻子”也可指面容，此处是形容傲慢神态的说法。
    reason: cultural_note
  - marker: b
    text: 这句也可译为：“他一切的意念中都没有上帝。”希伯来文既可表示“没有上帝”是他思想的内容，也可表示他的思想中全无上帝。
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  choice: 恶人
  rationale: 阳性单数形容词作名词使用，描写一个具有代表性的恶人；“恶人”在中文中简洁自然。
- source_word: כְּגֹבַהּ אַפּוֹ
  choice: 满脸傲气
  rationale: גֹבַהּ 表示高举、高傲，אַף 本义为鼻子，也可指面容；此处最自然地描写外露的傲慢神态。“满脸傲气”既保留面部意象，也传达希伯来语习语的含义。
- source_word: בַּל יִדְרֹשׁ
  choice: 不寻求上帝
  rationale: בַּל 是诗歌中的否定词，יִדְרֹשׁ 表示寻求或求问。原文未明说宾语，但下句的“上帝”表明所寻求的对象；中文补出“上帝”可避免语句悬空。
- source_word: אֵין אֱלֹהִים
  choice: 没有上帝
  rationale: 这是存在性否定，直译为“没有上帝”；正文将其作为恶人意念的内容。
- source_word: כָּל מְזִמּוֹתָיו
  choice: 他所有的意念
  rationale: מְזִמּוֹת 可指思想、谋算或计划；此处概括恶人整体的思想取向，“意念”能保留其范围而不过度突出阴谋意味。
theological_decisions:
- issue: 末句的句法关系
  choice: 将“没有上帝”理解为恶人全部意念的内容
  alternative: 理解为“他一切的意念中都没有上帝”
  rationale: 希伯来语词序容许两种理解。正文所选读法鲜明地表达恶人的实际否认，也贴近原文排列；另一种历史悠久且合理的读法在脚注中保留，不消除原文的歧义。
- issue: יִדְרֹשׁ 未明说的宾语
  choice: 在中文中补出“上帝”
  alternative: 译为“不寻求”，不补宾语
  rationale: 原文动词没有明示宾语，但紧接着提到上帝，语境足以提供所指。中文单说“不寻求”语意悬空，补出隐含对象能使译文自然，而不改变上下文含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“满脸傲气”自然呈现原文具体的面部意象；分号保留两个诗行之间紧密的逻辑关系。脚注标记按实际说明对象排列：第一处解释希伯来习语，第二处保存末句的句法歧义。
