  text: ו/דכה יָשֹׁ֑חַ וְ/נָפַ֥ל בַּ֝/עֲצוּמָ֗י/ו חלכאים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/010.yaml
  text: He crouches[a]; he bows down[c][b], and the helpless fall by his might.
translation:
  language: zh_hans
  text: 他蹲伏[a]，俯下身来；无助的人倒在他的强大力量之下。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文较难理解。这里也可译作“他低伏”或“他被压倒”。
    reason: lexical_alternative
  - marker: b
    text: 原文句法紧缩，也有人译作“他倒下”；“他的强大力量”较直译为“他的强者”，也可能是比喻说法，意为“他的利爪”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְדָכָה
  choice: 他蜷伏
  rationale: 此处辅音形式和含义都较难确定。结合上下文捕猎、埋伏的图像，以及后面的“俯下身来”，译作“蜷伏”较能表达恶人压低身体、伺机扑击的姿态，同时以脚注保留其他理解。
- source_word: יָשֹׁחַ
  choice: 俯下身来
  rationale: 该动词可表示弯下、低伏或沉下；“俯下身来”自然保留身体降低的图像，并与前一动词形成平行。
- source_word: וְנָפַל … חֵלְכָאִים
  choice: 无助的人便倒在
  rationale: 动词形态为第三人称阳性单数，而“无助的人”的形式及本句句法均不规则、紧缩。按上下文，将受害者理解为“倒下”的主体，最符合恶人猎取弱者的语境；脚注注明也可将动词理解为“他倒下”。
- source_word: בַּעֲצוּמָיו
  choice: 在他的强力之下
  rationale: 该词字面形式接近“他的强者／强有力者”，但在此语义不明。按抽象复数理解为恶人的力量，译成“他的强力”清楚而庄重；“之下”表达受害者被其力量制伏，并在脚注保留较直译及比喻性解释。
- source_word: חֵלְכָאִים
  choice: 无助的人
  rationale: 此词指困苦、软弱、易受欺压的人；“无助的人”在现代汉语中清楚表达其脆弱处境，也切合本诗对受压迫者的关注。
theological_decisions:
- issue: “倒下”的主体是恶人还是无助的人
  choice: 以“无助的人”为主体
  alternative: “他倒下”
  rationale: 原文动词为阳性单数，句法存在真实困难；但紧接的“无助的人”以及第8至10节恶人伏击弱者的连贯图像，更支持受害者倒在恶人强力之下。脚注保留另一种句法分析，避免把不确定性隐藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蜷伏—俯下身来”保留连续的捕猎姿态；分号区分恶人的动作与受害者的结局。因原文在词形、句法和意象上均有困难，正文选择上下文最连贯的读法，脚注则明确保留主要异读。
