base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/009.yaml
  text: He lies in wait in hiding[a], like a lion in his lair; he lies in wait to seize the poor[c][b]; he seizes the poor when he drags him into his net.
translation:
  language: zh_hans
  text: 他埋伏在隐蔽处[a]，像狮子伏在藏身之所[b]；他埋伏，要抓住困苦人；他把困苦人拖进自己的网中，便抓住他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“暗中”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“窝中”或“灌木丛中”；希伯来语此词可指棚、遮蔽处或隐蔽的灌木丛。
    reason: lexical_alternative
  - marker: c
    text: 也可译：“他抓住困苦人，把他拖进自己的网中。”希伯来语此处也可理解为“用自己的网”或“在自己的网中”。
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: יֶאֱרֹב
  choice: 埋伏
  rationale: 该动词表示潜伏等候、伺机袭击；两次均译作“埋伏”，保留原文的重复和蓄意捕猎的意味。
- source_word: בַּמִּסְתָּר
  choice: 在隐蔽处
  rationale: מִסְתָּר可指隐秘状态或隐蔽地点；此处与埋伏的动作相配，“隐蔽处”自然地传达藏匿地点。
- source_word: כְּאַרְיֵה
  choice: 像狮子
  rationale: 直接保留原文关于危险捕食者的明喻。
- source_word: בְסֻכֹּה
  choice: 在藏身之所
  rationale: סֻכָּה可指棚、遮蔽处或灌木丛中的隐蔽处；在狮子埋伏的比喻中，“藏身之所”既贴合语境，也避免把词义过度限定为洞穴。
- source_word: לַחֲטוֹף / יַחְטֹף
  choice: 要抓住 / 就抓住了
  rationale: חטף表示突然、强力地攫取。中文以同一词根“抓住”对应不定式和限定动词，保留原文重复；借助“要……就……”呈现动作推进。
- source_word: עָנִי
  choice: 困苦人
  rationale: עָנִי兼有贫穷、受苦、弱势之意；“困苦人”比单纯“穷人”更能保留其语义宽度，并符合本诗受压迫者的语境。
- source_word: בְּמָשְׁכוֹ
  choice: 他把……拖
  rationale: משך意为拉、拖；前缀ב可表达手段或伴随情形。“拖”保留暴力色彩，但其与后续动词的确切逻辑关系仍有多种理解。
- source_word: בְרִשְׁתּוֹ
  choice: 进自己的网中
  rationale: רֶשֶׁת意为网。介词ב通常可作“在、用”，但与“拖”连用时，中文译作“拖进……网中”最自然，并明确呈现诱捕图景；脚注保留其他句法可能。
theological_decisions: []
