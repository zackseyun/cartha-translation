id: PSA.10.7
reference: Psalms 10:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָלָ֤ה פִּ֣י/הוּ מָ֭לֵא וּ/מִרְמ֣וֹת וָ/תֹ֑ךְ תַּ֥חַת לְ֝שׁוֹנ֗/וֹ עָמָ֥ל וָ/אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/007.yaml
  text: His mouth is full of cursing and deceit and oppression[b][a]; under his tongue are trouble and wickedness.
translation:
  language: zh_hans
  text: 他满口咒骂[a]、诡诈和欺压；舌头底下尽是祸害与邪恶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “咒骂”或译“咒诅”；这个希伯来语名词在某些语境中也可指“誓言”，但这里的敌意言语语境更支持“咒骂”。
    reason: lexical_alternative
  - marker: b
    text: “祸害与邪恶”或译“患难与罪孽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלָה
  choice: 咒骂
  rationale: 此处处于恶人的敌意言语语境，宜理解为咒骂，而不是中性的誓言。
- source_word: פִּיהוּ מָלֵא
  choice: 他满口
  rationale: 用自然的现代汉语保留“口中充满”的形象，并表达言语中充斥这些恶事。
- source_word: מִרְמוֹת
  choice: 诡诈
  rationale: 该词表示欺骗、奸诈或背信；“诡诈”简洁而有庄重感，适合与“咒骂”并列。
- source_word: תֹךְ
  choice: 欺压
  rationale: 此处指带来伤害的压迫或侵害；“欺压”比单纯的“欺骗”更能体现其伤害性，同时保留该词的语义张力。
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: 舌头底下
  rationale: 直译这一鲜明意象，暗示隐藏、蓄势待发的有害言语或意图。
- source_word: עָמָל
  choice: 祸害
  rationale: 此处不是普通劳苦，而是恶人造成的患难、损害或恶作剧；“祸害”同时可涵盖有害之事及其后果。
- source_word: אָוֶן
  choice: 邪恶
  rationale: 该词可指罪孽、虚妄或恶行；“邪恶”在现代汉语中自然，并保留明确的道德分量。
theological_decisions: []
