  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: zh_hans
  text: 上行之歌。耶和华恢复锡安的境况[a]的时候，我们好像在做梦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使锡安的被掳者归回”或“恢复锡安的被掳境况”。这个希伯来语表达既可特指从流亡中归回，也可泛指境况得到恢复。
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 传统而简洁地表达诗篇标题，保留“上行”的空间与礼仪含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名表达四字神名，而非用通称“主”替代。
- source_word: בְּשׁוּב ... אֶת שִׁיבַת צִיּוֹן
  choice: 使锡安复兴
  rationale: 该固定表达既可能特指被掳者归回，也可泛指境况恢复；正文采用自然且较宽广的译法，并以脚注保留具体解释。
- source_word: כְּחֹלְמִים
  choice: 好像做梦的人
  rationale: 保留希伯来文的明喻及其开放意味，可指喜出望外、仿佛置身梦境。
theological_decisions:
- issue: “使锡安复兴”是否明确指被掳归回
  choice: 正文采用较宽泛的“使锡安复兴”
  alternative: “使锡安被掳的人归回”或“恢复锡安的境况”
  rationale: 原文 שׁוּב שְׁבוּת 的语义与传统理解具有张力，不宜在正文中断然限定为单一历史事件；脚注说明两种可能。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“上行之歌”保留熟悉的诗篇标题形式；正文节奏简洁，并保留原文的比喻和语义张力。
