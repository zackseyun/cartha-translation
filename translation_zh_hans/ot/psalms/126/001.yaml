  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/001.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: zh_hans
  text: 上行之诗。雅威使锡安的境况恢复时[a]，我们就像做梦的人一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使锡安的被掳者归回”，也可理解为“扭转锡安被掳的处境”。希伯来语这一表达既可特指从流亡中归回，也可泛指境况恢复。
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之诗
  rationale: 保留 מַעֲלוֹת“上行、登上”的字面意象，同时采用简洁庄重、在诗篇标题中自然的中文表达；不把它进一步解释为朝圣之歌。
- source_word: בְּשׁוּב
  choice: ……复原时
  rationale: 介词 בְּ 加不定式在此引出时间从句；שׁוב 与 שִׁיבַת 连用，表达使某种处境恢复或使被掳者归回。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，直接保留原文所用的专名。
- source_word: שִׁיבַת צִיּוֹן
  choice: 锡安的景况
  rationale: 该希伯来语表达既可泛指锡安境况的复原，也可能特指被掳者归回；正文采用较宽泛的表达，具体的被掳含义置于脚注。
- source_word: הָיִינוּ
  choice: 我们……
  rationale: 与后面的表语共同译成“我们好像……”，自然表达 היה 的过去状态；时间背景已由前句说明。
- source_word: כְּחֹלְמִים
  choice: 好像做梦的人
  rationale: 保留介词 כְּ 的明喻和 חֹלְמִים 的分词性质，不把这种如梦感明确解释为惊喜或难以置信。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文以较接近其通行学术重构读音的“雅威”呈现，不改译为称号。
- issue: שִׁיבַת צִיּוֹן 的含义
  choice: 使锡安的景况复原
  alternative: 使锡安被掳的人归回／扭转锡安被掳的处境
  rationale: 该固定表达可能泛指命运或景况的扭转，也可能具体涉及从被掳中归回。正文保留较宽的语义范围，脚注呈现更具体的流亡归回读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“上行之诗”保留诗集标题的传统简洁形式；“好像做梦的人”维持原文的诗意与开放性。
