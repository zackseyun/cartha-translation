  yaml_path: translation/ot/psalms/126/006.yaml
  text: He surely goes out weeping[a], carrying the seed for sowing; he will surely come in with joyful shouting[b], carrying his sheaves.
translation:
  language: zh_hans
  text: 他流着泪出去，带着播种用的种子[a]；必欢呼着[b]回来，带回他的禾捆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一路哭泣着走，带着一袋种子”；译作“播种用的种子”的希伯来语短语含义较难确定，有人更具体地理解为种子袋或所带的种粮。
    reason: lexical_alternative
  - marker: b
    text: 或译：“歌唱着”或“喜乐着”；这里的希伯来语词指喜乐的呼喊或响亮的欢庆声。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ יֵלֵךְ
  choice: 出去
  rationale: 不定式绝对式与未完成式连用，加强“去”的语气；结合播种与收割的场景，并与后面的“回来”形成自然对应。其强调意味由整句的“必”及前后结构传达，避免生硬重复。
- source_word: וּבָכֹה
  choice: 流着泪
  rationale: 该形式在此作方式状语，描述出去时的情状；“流着泪”自然、清楚，也保留持续哭泣的画面。
- source_word: נֹשֵׂא
  choice: 带着／带回
  rationale: 分词表示与主要动作同时发生的携带动作。按汉语搭配，前半句译“带着”，后半句译“带回”，既自然又保留平行关系。
- source_word: מֶשֶׁךְ הַזָּרַע
  choice: 播种用的种子
  rationale: 这是一个词义有争议的短语；上下文明确涉及带种出去播撒。此译表达基本情景，却不把 מֶשֶׁךְ 过度限定为种子袋、定量种粮或撒出的种子行列。
- source_word: בֹּא יָבֹא
  choice: 必……回来
  rationale: 不定式绝对式与未完成式连用表示强调和确定性。“必……回来”既传达强调，也与前面的“出去”相对。
- source_word: בְרִנָּה
  choice: 欢呼着
  rationale: רִנָּה 指发出响亮的喜乐之声；“欢呼着”保留其可听见的庆贺意味，而不局限为歌唱。
- source_word: אֲלֻמֹּתָיו
  choice: 他的禾捆
  rationale: 该词具体指收割后捆扎的庄稼。“禾捆”准确保留农业意象；所有格译为“他的”，不予省略。
