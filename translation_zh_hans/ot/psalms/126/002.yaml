language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָ֤ז יִמָּלֵ֪א שְׂח֡וֹק פִּי/נוּ֮ וּ/לְשׁוֹנֵ֪/נוּ רִ֫נָּ֥ה אָ֭ז יֹאמְר֣וּ בַ/גּוֹיִ֑ם הִגְדִּ֥יל יְ֝הוָ֗ה לַ/עֲשׂ֥וֹת עִם אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/002.yaml
  text: Then our mouth was filled with laughter[a], and our tongue with joyful shouting; then they said among the nations[b], “Yahweh has done great things for them.”
translation:
  language: zh_hans
  text: 那时，我们的口充满了欢笑，我们的舌头充满了欢呼声[a]；那时，列国的人说：“雅威为他们行了大事。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢呼声”也可译为“喜乐的呼喊”或“欢欣的歌声”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近于：“雅威向这些人做了大事。”这里“做大事”是指施行伟大的作为；“这些人”在引语中指前文所说的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示前一节所述复兴带来的结果和随后的情景；“那时”自然保留诗句的时间推进。
- source_word: יִמָּלֵא
  choice: 满
  rationale: 该未完成式在回顾性的诗歌语境中表达已经出现的充满状态；“满口”自然传达被欢笑充满的结果。
- source_word: שְׂחוֹק
  choice: 欢笑
  rationale: 与下半句的 רִנָּה 平行，并受复兴喜乐的语境限定，指欢欣的笑声而非讥笑。
- source_word: פִּינוּ
  choice: 我们满口
  rationale: 希伯来文为带第一人称复数后缀的单数集合性身体部位名词；汉语“我们满口”既自然又保留其诗意。
- source_word: וּלְשׁוֹנֵנוּ
  choice: 舌头
  rationale: 保留原文单数集合性的身体部位意象，并与“满口”构成平行。
- source_word: רִנָּה
  choice: 欢呼
  rationale: 该词可指响亮的喜乐呼喊，也可能带有歌唱意味；“欢呼”保留其声音洪亮和喜乐的核心，而不限定为正式歌唱。
- source_word: יֹאמְרוּ
  choice: 有人说
  rationale: 主语由下接的 בַגּוֹיִם 表明来自列国；汉语用“列国中有人说”比“他们在列国中说”更清楚，且不额外确定具体说话者。
- source_word: בַגּוֹיִם
  choice: 列国中
  rationale: 指以色列之外的众民族或国家；“列国”符合诗篇语体，也避免带入后世宗教分类色彩。
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: 成就了大事
  rationale: 这是表示“大大行事、做了大事”的希伯来语结构；“成就了大事”在现代汉语中自然且庄重。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣专名形式，明确保留原文的四字神名，而不以普通称号替代。
- source_word: עִם אֵלֶּה
  choice: 为他们
  rationale: 字面为“与这些人”，在此结构中表示临到这些人的作为；引语所指即前文的群体，汉语以“为他们”最自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用以色列上帝的专名。正文采用中文读者广泛识别的“耶和华”，既保留专名性质，也不把它改成一般称号。
- issue: 诗歌未完成式 יִמָּלֵא 的时间指向
  choice: 按回顾性的过去情景理解：“满口欢笑”
  alternative: 将来：“必满口欢笑”；生动现在：“正满口欢笑”
  rationale: 前后语境回顾上帝使被掳者归回时的经历，אָז 又引出当时的结果，因此以过去情景表达最符合篇章推进；汉语不必额外标明“曾经”。
- issue: עִם אֵלֶּה 的受益关系
  choice: 为他们
  alternative: 与这些人同在而行大事；为这些人
  rationale: 该短语字面形式保留“与这些人”的可能感，但在 הִגְדִּיל לַעֲשׂוֹת 结构中通常表达上帝为该群体所行的大事；译作“为他们”不额外增加身份说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“满口欢笑，舌头发出欢呼”保留原文身体部位的平行意象；分号呈现两次“那时”所划分的场景。所有脚注标记均已置入正文。
