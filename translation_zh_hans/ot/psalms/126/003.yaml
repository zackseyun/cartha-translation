  text: הִגְדִּ֣יל יְ֭הוָה לַ/עֲשׂ֥וֹת עִמָּ֗/נוּ הָיִ֥ינוּ שְׂמֵחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/003.yaml
  text: Yahweh has done great things for us[a]; we were glad.
translation:
  language: zh_hans
  text: 耶和华为我们成就了大事[a]；我们欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“耶和华与我们做了大事。”
    reason: 保留 עִמָּנוּ 的字面“与我们”。在此惯用表达中，正文的“为我们”自然表达其语境中的受益含义；脚注不将“与”限定为共同施事。
lexical_decisions:
- source_word: הִגְדִּיל לַעֲשׂוֹת
  choice: 成就了大事
  rationale: 这是希伯来语惯用表达，意为“做了大事”。“成就了大事”在现代汉语中自然、庄重，也保留诗歌语感。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”音译四字神名，避免用称号取代原文中的专名。
- source_word: עִמָּנוּ
  choice: 为我们
  rationale: 介词字面义为“与我们”，但在此惯用表达中具有受益含义；正文译作“为我们”更符合自然汉语，字面可能性收入脚注。
- source_word: הָיִינוּ שְׂמֵחִים
  choice: 我们满心欢喜
  rationale: 原文表示过去处于喜乐状态。“满心欢喜”自然传达强烈喜悦；过去时态由前句“了”和叙事语境体现。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名。中文正文保留专名，并采用普通读者最熟悉、最具传统可识别度的“耶和华”；“雅威”是另一种现代学术音译。
- issue: עִמָּנוּ 的关系含义
  choice: 为我们
  alternative: 与我们一同／在我们身上
  rationale: 上下文强调以色列是上帝大作为的受益者，因此正文采用受益义；同时用脚注保留原介词“与”的真实歧义，避免排除上帝在他们中间或身上的作为这一层表达。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“成就了大事”保持诗篇语体；“满心欢喜”比单说“高兴”更符合原句的诗意和喜乐强度。
