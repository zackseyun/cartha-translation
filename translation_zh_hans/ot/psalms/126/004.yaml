  yaml_path: translation/ot/psalms/126/004.yaml
  text: Restore our fortunes[a], O Yahweh[b], like streams in the Negev.
translation:
  language: zh_hans
  text: 雅威啊，求你恢复我们的境况[a]，如同内盖夫的溪流[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使我们被掳的人归回”或“恢复我们的被掳处境”。这个希伯来语习语既可特指被掳者归回，也可泛指一个群体的境况得到恢复。
    reason: alternative_reading
  - marker: b
    text: “内盖夫”是南方干旱地区。那里的河道平时常常干涸，却会因降雨突然充满奔流的水。
    reason: cultural_note
lexical_decisions:
- source_word: שׁוּבָה
  choice: 求你恢复
  rationale: 这是向雅威发出的命令式恳求；与“שבותנו”连用时表达使群体的处境逆转、复原。译作“求你恢复”既符合现代汉语祷告语气，也不把含义限定为被掳者实际归回。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，没有独立词义；其语法功能已由汉语的动宾结构体现。
- source_word: שבותנו
  choice: 我们的境况
  rationale: 该词与שוב组成的习语既可指被掳者归回，也可泛指一个群体的景况得到恢复。“我们的境况”保留较宽的语义范围，并由脚注注明较具体的可能读法。
- source_word: כַּאֲפִיקִים
  choice: 如同……的溪流
  rationale: אֲפִיקִים可指河道、溪谷或其中的水流。正文用普通读者易懂且具有诗意的“溪流”，脚注说明南地干涸河道遇雨骤然有水的背景。
- source_word: בַּנֶּגֶב
  choice: 南地
  rationale: 这里很可能指以色列南部干旱的尼革地区；“南地”是简洁自然的地理称呼，具体环境由脚注交代。
theological_decisions:
- issue: 习语שוב את־שבות的含义
  choice: 正文译为求群体整体境况得到恢复
  alternative: 专指使被掳者归回，或使被掳的状态终止
  rationale: 诗篇具有被掳与复归的背景共鸣，但希伯来习语也可广泛表示命运或境况的逆转。正文保留宽广含义，脚注呈现较具体的读法，不消除原文的歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威啊，求你……”保留祷告式呼告；“恢复我们的境况”清楚易懂，同时避免把原文可能兼具的复归与全面复兴之意限定为单一解释。
