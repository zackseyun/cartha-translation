base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/005.yaml
  text: Those who sow in tears will reap with joyful shouting[a].
translation:
  language: zh_hans
  text: 流泪撒种的，必欢呼着收割[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带着欢呼声”。希伯来语 רִנָּה 可指喜乐的高声呼喊，也可能含有欢欣歌唱的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזֹּרְעִים
  choice: 撒种的
  rationale: 带定冠词的分词在这里作名词用，泛指从事撒种的人；“撒种的”自然简洁，并保留复数类指意义。
- source_word: בְּדִמְעָה
  choice: 流泪
  rationale: 介词 בְּ 加“眼泪”表示撒种时的方式或处境；汉语“流泪撒种”比直译“在眼泪中撒种”更自然。
- source_word: בְּרִנָּה
  choice: 欢呼着
  rationale: רִנָּה 指因喜乐而发出的响亮呼声，也可能包含欢歌之意；“欢呼着”保留了声音响亮、喜乐洋溢的特点，又不把词义限缩为歌唱。
- source_word: יִקְצֹרוּ
  choice: 必……收割
  rationale: 未完成式在此表达将来的结果；“必”既体现确定的未来结果，也与诗句的应许语气相称，“收割”则保留与撒种对应的农耕意象。
