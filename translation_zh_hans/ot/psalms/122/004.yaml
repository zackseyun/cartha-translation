  yaml_path: translation/ot/psalms/122/004.yaml
  text: There the tribes went up, the tribes of Yah, as a testimony for Israel, to give thanks to the name of the LORD.
translation:
  language: zh_hans
  text: 各支派都上到那里，就是耶和华的支派，作为给以色列的见证，称谢耶和华的名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָלוּ
  choice: 曾上到
  rationale: 该完成式在诗中回顾各支派前往耶路撒冷敬拜的行动；“上到”也保留前往圣城或高处的方向感。
- source_word: שִׁבְטֵי יָהּ
  choice: 耶和华的支派
  rationale: יָהּ 是神名 יהוה 的短式；正文采用现代中文圣经读者熟悉的“耶和华”，并保留所属关系。
- source_word: עֵדוּת לְיִשְׂרָאֵל
  choice: 给以色列的法度
  rationale: עֵדוּת 可指见证，也可指作为规范的法度、规定；本句朝圣敬拜的语境中，“法度”较自然，同时以脚注保留词义张力。
- source_word: לְהֹדוֹת
  choice: 称谢
  rationale: 该词表示承认、颂赞并感谢；“称谢”简洁庄重，适合礼拜诗歌语体。
theological_decisions:
- issue: “耶和华的支派”的所指
  choice: 直译为“耶和华的支派”
  alternative: 解释为“属于耶和华的以色列各支派”
  rationale: 原文以同位语强调这些支派与神的关系；不在正文中加入“属于”或“以色列”，避免过度解释。
- issue: עֵדוּת 的规范性或见证性
  choice: 正文译“法度”，脚注说明“见证”可能
  alternative: 正文译“作为给以色列的见证”
  rationale: 该词既可关联盟约见证，也可指神所定的规范；语境可能暗指以色列上行守节的规定，故不把含义限制为单纯的证言。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“曾上到”体现原文完成式并保留上耶路撒冷的空间意象；句式维持原文层层展开的结构。
