  rationale: 修订以“见证”保留 עֵדוּת 的基本词义，并避免把原文未明说的“照着”纳入正文；脚注保留其作为神所立规范的合理理解。删除“曾”以免将诗歌完成式过度限定为单次过去事件。其余神名、同位语和礼拜性用语均予保留。
