  text: כִּ֤י שָׁ֨מָּ/ה יָשְׁב֣וּ כִסְא֣וֹת לְ/מִשְׁפָּ֑ט כִּ֝סְא֗וֹת לְ/בֵ֣ית דָּוִֽיד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/005.yaml
  text: For there thrones sit for judgment[c][b][a], thrones for the house of David.
translation:
  language: zh_hans
  text: 因为在那里设有施行审判的宝座[a][b]，即大卫家的宝座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “设有”直译为“坐着”；这里是说宝座安置、设立在那里，供施行审判之用。
    reason: lexical_alternative
  - marker: b
    text: “审判”也可译为“公正”或“司法裁决”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明耶路撒冷具有特殊地位的缘由；保留希伯来语的解释或因果作用。
- source_word: שָׁמָּה
  choice: 在那里
  rationale: 明确指向上文的耶路撒冷，符合现代汉语表达。
- source_word: יָשְׁבוּ
  choice: 设有
  rationale: 该动词本义为“坐、居住”；以“宝座”为主语时，可表达宝座安置、设立在那里。中文若直译为“宝座坐着”不自然，因此按语境译为“设有”，并以脚注保留原文意象。
- source_word: כִסְאוֹת
  choice: 宝座
  rationale: 此处不是普通座位，而是与王室及司法权柄相关的座位；“宝座”保留其政治和司法意味。
- source_word: לְמִשְׁפָּט
  choice: 审判的
  rationale: לְ 表示用途，מִשְׁפָּט 在此指司法审判，也可含公正、公义之意；“审判的宝座”准确表达其司法功能。
- source_word: כִסְאוֹת לְבֵית דָּוִיד
  choice: 为大卫家设立的宝座
  rationale: 保留第二个 לְ 的受益、归属或关联意味，表明这些宝座与大卫王朝有关，同时不把关系过度限定为单纯所有格。
theological_decisions:
- issue: “大卫家”的所指
  choice: 按历史语境译作与大卫王朝相关、承担司法职能的宝座
  alternative: 泛指耶路撒冷的民事法庭；或在正文中直接作弥赛亚式解释
  rationale: 原文明确并列“审判的宝座”和“为大卫家的宝座”，重点是耶路撒冷中大卫王朝的王权与司法权。正文不额外加入原句未明说的弥赛亚解释。
- issue: לְבֵית דָּוִיד 的关系
  choice: 译为“为大卫家设立的”
  alternative: “大卫家的”
  rationale: 希伯来语介词 לְ 可表达用途、关联或归属；采用“为……设立”既与宝座的设置相合，也保留关系上的一定开放性。
translation_notes:
  register: 采用现代、庄重而自然的诗体散文。用“设有”避免把希伯来语中“宝座坐着”的具体表达生硬搬入中文；后半句加“就是”标明同位复述关系，并以“设立”补足自然汉语所需的谓语。
