  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד שָׂ֭מַחְתִּי בְּ/אֹמְרִ֣ים לִ֑/י בֵּ֖ית יְהוָ֣ה נֵלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/001.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: zh_hans
  text: 上行之歌[a]。大卫的诗。\n他们对我说：“我们到耶和华的殿去吧！”时，我很欢喜。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上行之歌”是诗篇标题，可能指朝圣者上耶路撒冷时所唱的歌，或某种礼仪诗歌集；也可译为“登高之歌”或“上去之歌”。
    reason: cultural_note
  - marker: b
    text: “我很欢喜”也可译为“我甚是喜乐”或“我就欢喜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 这是诗篇标题中的固定用语。“上行”保留了原文“上去、上升”的意象，也符合前往耶路撒冷朝圣的可能背景；具体所指仍有不确定性，留待脚注说明。
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 标题中的介词 לְ 可表示作者、归属、关联或献给某人。“大卫的诗”是自然的中文标题表达，但不把其含义严格限定为“大卫所作”。
- source_word: שָׂמַחְתִּי
  choice: 我就欢喜
  rationale: 该完成式表达诗人因听见邀请而产生的喜乐。“欢喜”自然、庄重，并保留直接的情感色彩。
- source_word: בְּאֹמְרִים לִי
  choice: 有人对我说
  rationale: 原文用复数形式，主语未明说。中文以泛指的“有人”自然表达，不臆定具体说话者；其复数含义可由引语中的“我们”体现。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בֵּית 在此指敬拜场所；中文圣经语境中“殿”比一般的“房屋”更准确自然。神名 יְהוָה 采用现代中文读者熟悉的“耶和华”。
- source_word: נֵלֵךְ
  choice: 我们……去吧
  rationale: 第一人称复数未完成式在此具有劝请或邀请语气，以“去吧”自然传达“让我们去”的意思。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用中文圣经传统中最广为人知的专名“耶和华”，而不以“主”替代，以保留专名性质；“雅威”是较接近学界常见拟音的另一选择。
- issue: לְדָוִד 是否明确表示作者身份
  choice: 正文作“大卫的诗”，不明确断定“大卫所作”
  alternative: 大卫所作
  rationale: 标题中的 לְ 语义范围较宽，可指作者、归属、关联或题献。译文避免用“所作”消除原文的弹性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到……去吧”符合自然汉语邀请语气；语序调整为先交代听见的话，再说“我就欢喜”，清楚呈现因果关系。标题保持简洁，并用脚注保存其历史文化含义和不确定性。
