  text: '你们要为耶路撒冷求平安！

    愿爱你的人得享安宁！'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁאֲלוּ
  choice: 祈求
  rationale: 该命令式本义为“求、询问”，以抽象宾语“平安”相随时可指为某事祈求；诗歌和敬拜语境中，“祈求”自然地表达向上帝求告，同时脚注保留“求”的较直接译法。
- source_word: שְׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם涵盖和平、安宁、福祉与完整；“平安”既是现代汉语中自然庄重的表达，也保留其较宽广的含义。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代简体中文通行的专名译法。
- source_word: יִשְׁלָיוּ
  choice: 安享太平
  rationale: 该词源于שלה，可表示安逸、安稳或兴盛。“安享太平”在汉语中呼应上句“平安”，并避免把含义限缩为物质昌盛。
- source_word: אֹהֲבָיִךְ
  choice: 爱你的人
  rationale: 分词带阴性单数第二人称后缀，所指是爱耶路撒冷的人；保留对城的直接称呼。
theological_decisions:
- issue: 下半句未完成式的语气
  choice: 译作祈愿：“愿爱你的人安享太平”
  alternative: 可译作陈述或应许：“爱你的人必安享太平”
  rationale: 诗歌中的未完成式既可有祈愿语气，也可作陈述理解。承接上句命令“要……祈求”，祈愿语气更自然；脚注保留陈述式读法，以免把原文的语气张力消除。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“平安／安享太平”传达原文שְׁלוֹם与יִשְׁלָיוּ之间的语义呼应；以引号呈现诗中向耶路撒冷的直接称呼。
