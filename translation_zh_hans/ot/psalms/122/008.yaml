base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/008.yaml
  text: For the sake of my brothers and my companions[a], I will now say[c][b], “Peace be within you.”
translation:
  language: zh_hans
  text: 为了我的弟兄和同伴，我要说：“愿你中间有平安[a][b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可包含安康、完整、兴盛的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文的语气词可带有恳求、催促或当下性的意味；有些译法将此处理解为“我现在要说”。“让我说”则同时反映前面第一人称祈愿式的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 为了
  rationale: 表示行动的缘由或所顾念的对象；“为了”自然传达诗人因弟兄和同伴而发出祝愿。
- source_word: אַחַי
  choice: 我的弟兄
  rationale: 忠实保留希伯来文阳性复数亲属称谓；在语境中也可涵盖同族及共同敬拜的人。
- source_word: וְרֵעָי
  choice: 和同伴
  rationale: רֵעַ 可指朋友、同伴或邻舍；“同伴”与“弟兄”平行，并契合朝圣群体的语境。
- source_word: אֲדַבְּרָה
  choice: 我要说
  rationale: 该第一人称祈愿式在这里表达说话者的意愿和决心；“我要说”在现代汉语中自然，也适合引出直接引语。
- source_word: נָא
  choice: 未单独明译
  rationale: 该语气词可表示催促、当下性或恳求；其功能已部分融入“我要说”的意愿语气，而不同理解在脚注中保留。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: “平安”是 שָׁלוֹם 的常用对应词，同时可承载安康、完整和兴盛等较宽含义。
- source_word: בָּךְ
  choice: 你里面
  rationale: 阴性单数第二人称指向耶路撒冷；“你里面”保留对城的直接称呼及其空间意味。
theological_decisions:
- issue: 亲属称谓的性别形式
  choice: 我的弟兄
  alternative: 我的亲族；我的弟兄姊妹
  rationale: 原文明确使用阳性复数“弟兄”；正文保留其形式，不擅自中性化，同时让群体性的范围由语境体现。
- issue: 祝福的对象
  choice: 直接称耶路撒冷为“你”
  alternative: 愿城中平安；愿其中平安
  rationale: בָּךְ 是阴性单数第二人称，与被拟人化的耶路撒冷相合；保留直接呼告可维持原诗的修辞力度。
- issue: נָא 的语气
  choice: 正文不限定为“现在”或“求你”
  alternative: 我现在要说；让我说；求你使你里面平安
  rationale: נָא 在此既可能增添当下、决意的色彩，也可能带有恳求意味。汉语正文若固定译出其中一种，会过早消除原文的开放性，因此以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“为了我的弟兄和同伴”保留原文平行结构；直接称耶路撒冷为“你”，延续上下文的拟人化表达。
