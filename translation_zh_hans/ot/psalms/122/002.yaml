  yaml_path: translation/ot/psalms/122/002.yaml
  text: Our feet are standing within your gates[a], O Jerusalem.
translation:
  language: zh_hans
  text: 我们的脚已经站在你的城门内，耶路撒冷啊。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们的脚曾站在你的城门内，耶路撒冷啊。”希伯来语以“是”的完成式配合分词，既可表达过去持续的“站着”，也可按语境表达已经站在那里、如今仍处于该状态。
    reason: 保留希伯来语迂回式结构在时间和体貌上的歧义。
lexical_decisions:
- source_word: עֹמְדוֹת
  choice: 站
  rationale: 这是动词 עמד 的阴性复数主动分词，与阴性复数主语“我们的脚”一致；用“站”保留持续、静止的状态含义。
- source_word: הָיוּ
  choice: 曾
  rationale: 完成式 היה 与分词构成迂回式表达。译作“曾站”自然地反映过去持续状态，同时不把希伯来语的时体强行限定为单纯的瞬时动作。
- source_word: רַגְלֵינוּ
  choice: 我们的脚
  rationale: 按带第一人称复数后缀的复数名词直译，保留朝圣者亲身抵达的具体意象。
- source_word: בִּשְׁעָרַיִךְ
  choice: 在你的城门内
  rationale: 介词 בְּ 可表示“在……里面”；“城门内”既符合现代汉语，也传达已经进入耶路撒冷城门区域的意思。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用该地名在现代简体中文《圣经》传统中的通行音译。
