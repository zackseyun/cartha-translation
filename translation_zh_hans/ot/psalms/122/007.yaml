  text: May there be peace within your ramparts[c][b][a], prosperity within your citadels.
translation:
  language: zh_hans
  text: 愿你的城垣[a]内有平安，愿你的宫殿[b]中有安宁[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城垣”所译的希伯来语可指城市的防御围墙、外郭或壁垒。
    reason: lexical_alternative
  - marker: b
    text: 或译“堡垒”或“坚固的建筑”。原词通常可指宫殿，也可指设防的高大建筑。
    reason: lexical_alternative
  - marker: c
    text: 或译“安稳”“宁静”，也可包含安享福祉之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: 愿……有／愿……平安
  rationale: 未完成式在此具有祈愿语气；中文用“愿”自然表达祝愿或祈求。后半句承接同一祈愿，毋须重复“愿”。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 此词可指和平、福祉与完整健全；在为耶路撒冷求福的语境中，“平安”既直接又保留较宽广的福祉含义。
- source_word: בְּחֵילֵךְ
  choice: 你城垣之内
  rationale: חֵיל在这里指城市的防御工事或外郭；“城垣”比泛称“城墙”更能体现防御围护之意，而“之内”表达介词בְּ的处所意义。
- source_word: שַׁלְוָה
  choice: 安宁
  rationale: 此词表示宁静、安稳、无忧的良好状态；“安宁”与上句“平安”形成自然对应，又不把原词限定为物质上的繁荣。
- source_word: בְּאַרְמְנוֹתָיִךְ
  choice: 宫堡之中
  rationale: אַרְמוֹן可指宫殿，也可指设防的高大建筑或堡垒；“宫堡”力求兼顾其王宫与坚固建筑两方面的语义，并与“城垣”相呼应。
