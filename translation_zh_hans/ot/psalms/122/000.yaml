  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד שָׂ֭מַחְתִּי בְּ/אֹמְרִ֣ים לִ֑/י בֵּ֖ית יְהוָ֣ה נֵלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/000.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: zh_hans
  text: '上行之诗。[a] 大卫的诗。[b]


    我因他们对我说：“我们到耶和华[c]的殿去吧！”而欢喜。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上行之诗”也可译作“登阶之歌”。这可能是朝圣者上耶路撒冷时所唱的歌，也可能是一个礼仪诗集的标题。
    reason: cultural_note
  - marker: b
    text: “大卫的诗”也可理解为“大卫作”“献给大卫”或“与大卫有关”。
    reason: source_ambiguity
  - marker: c
    text: “耶和华”所译的是希伯来文神名 יהוה（YHWH），也常音译作“雅威”。
    reason: divine_name
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之诗
  rationale: 保留传统且简洁的译法；מַעֲלוֹת 字面涉及“上行、登上”，在此可能指朝圣上耶路撒冷所唱之歌，也可能是诗集或礼仪标题。
- source_word: שָׂמַחְתִּי
  choice: 我就欢喜
  rationale: 该完成式表达说话者因听见邀请而产生的喜悦；“欢喜”庄重而仍属现代常用语。
- source_word: בְּאֹמְרִים לִי
  choice: 有人对我说
  rationale: 原文以复数分词表达不特指的一群说话者，汉语用“有人”自然呈现而不补入其身份。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: “殿”在汉语圣经语境中自然指敬拜上帝的圣所；专名采用现代中文读者熟悉的“耶和华”。
- source_word: נֵלֵךְ
  choice: 我们……去吧
  rationale: 第一人称复数未完成式在直接引语中表示劝勉或邀请，以“去吧”自然传达。
theological_decisions:
- issue: לְדָוִד 的关系含义
  choice: 正文译“大卫的诗”，并以脚注保留其他可能
  alternative: “大卫作”或“献给大卫”
  rationale: 介词 לְ 可表示作者、归属、奉献对象或关联；正文采用中文标题中最简洁的归属表达，但不把作者身份定死。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；或以“上主”代称
  rationale: 采用现代中文圣经传统中辨识度最高的专名，同时以脚注说明这是四字神名及另一常见音译，避免把称号与专名混同。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。标题保留诗篇传统体例；正文调整为符合汉语信息顺序的“引语在前、喜悦在后”，清楚呈现喜悦由邀请引发，又不增加原文没有的人物或背景。
