lexical_decisions:
- source_word: לְמַעַן
  choice: 为了
  rationale: 表示行动的目的或动机；“为了”在现代汉语中自然、简洁。
- source_word: בֵּית
  choice: 殿
  rationale: 字面为“房屋”，但在此明确指耶和华的圣殿；中文以“殿”既自然又保留宗教语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译四字神名，区别于称号“主”，并符合现代中文圣经读者熟悉的表达。
- source_word: אֱלֹהֵינוּ
  choice: 我们上帝
  rationale: 准确表达第一人称复数所属关系；“上帝”是现代标准汉语中自然、庄重的称呼。
- source_word: אֲבַקְשָׁה
  choice: 我要……求
  rationale: 该意愿式形态表达说话者的决心或意向；“我要”自然传达这种坚定意愿。
- source_word: טוֹב
  choice: 福
  rationale: 此处指耶路撒冷的好处、福祉或安康；“福”比抽象的“好”更符合汉语搭配，同时保留较宽泛的正面含义。
- source_word: לָךְ
  choice: 为你
  rationale: 介词加阴性单数后缀指向拟人化的耶路撒冷；译作“为你”符合现代汉语习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且庄重的专名“耶和华”，不以称号“主”取代神名。
- issue: “你”的所指
  choice: 保留第二人称“你”，指耶路撒冷
  alternative: 明译为“耶路撒冷”
  rationale: 原文以阴性单数第二人称继续向耶路撒冷说话；保留“你”维持诗歌的直接称呼和拟人手法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“为了……的殿”交代动机，“我要为你求福”保留说话者的决心及对耶路撒冷的直接称呼。
