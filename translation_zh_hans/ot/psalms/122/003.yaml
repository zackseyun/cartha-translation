lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代汉语中通行的圣经地名译法。
- source_word: הַבְּנוּיָה
  choice: 建造得
  rationale: 保留בנה被动分词所表达的建成状态；不译作“重建”，以免加入原文未明确表达的含义。
- source_word: כְּעִיר
  choice: 像一座城
  rationale: כְּ表示比较；“像一座城”在现代汉语中自然，也保留了原文的比拟表达。
- source_word: שֶׁחֻבְּרָה
  choice: 紧密相连
  rationale: 该词是חבר的被动形式，表示被连接、结合；“紧密相连”既呈现城市结构上的连接，也不把含义限定为某种神学性的合一。
- source_word: לָּהּ
  choice: （在“浑然一体”中体现）
  rationale: 阴性代词后缀回指耶路撒冷或“城”，可理解为城与自身相接；汉语用“浑然一体”自然表达这种内部连接关系。
- source_word: יַחְדָּו
  choice: 浑然一体
  rationale: 该副词强调共同、合在一起；与“紧密相连”配合，传达希伯来文重复强化的整体性。
