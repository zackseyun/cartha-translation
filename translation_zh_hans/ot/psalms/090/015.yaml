base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/015.yaml
  text: Make us glad for as many days as you have afflicted us[a], for as many years as we have seen trouble.
translation:
  language: zh_hans
  text: 求你使我们欢喜，与您使我们受苦的日子相称；与我们经历患难[a]的年岁相称。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难”也可译作“灾祸”或“苦难”。原文词在其他语境中也可指“邪恶”；这里按上下文指所经历的逆境、灾难或苦难。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְּחֵנוּ
  choice: 求你使我们欢喜
  rationale: 该词是带第一人称复数后缀的加强式祈使形，表达向上帝发出的使役性祈求；加“求你”符合现代汉语祷告语气，“使我们欢喜”保留其使役含义。
- source_word: כִּימוֹת
  choice: 照着……的日子
  rationale: כְּ在此表示对应或相称的尺度，即祈求所得的欢喜与先前受苦的时日相称；“照着”既贴近原文结构，也能自然表达这种衡量关系。
- source_word: עִנִּיתָנוּ
  choice: 你使我们受苦
  rationale: ענה的加强式在此可指使人受苦或受压；结合下半句的“患难”，译作“使我们受苦”保留上帝为动作主体这一尖锐表达，而不把意义缩窄为内在谦卑或人为压迫。
- source_word: שְׁנוֹת
  choice: 也照着……的年岁
  rationale: 该构词与上半句“日子”形成平行；补出“也照着”清楚传达两行之间相称、对应的诗意结构。
- source_word: רָאִינוּ
  choice: 我们遭遇
  rationale: 希伯来语字面为“我们看见”；在“看见患难”的惯用表达中意为亲身经历。“遭遇”是自然现代汉语，同时未改变其经验性含义。
- source_word: רָעָה
  choice: 患难
  rationale: רָעָה可指邪恶、灾祸或逆境；本节与“使我们受苦”平行，语境所指是群体经历的苦难。“患难”避免误解为他们所行的道德邪恶，同时保留逆境与灾祸的语义范围。
theological_decisions:
- issue: רָעָה与上帝行动之间的关系
  choice: 译为经验性的逆境“患难”
  alternative: 邪恶；灾祸；苦难
  rationale: 经文把群体所经历的רָעָה与上帝使他们受苦并列，却没有说上帝行了道德上的恶；“患难”保留哀歌的张力，也不额外作神学化解。
- issue: 欢乐与受苦时日之间的比例关系
  choice: 用“照着……日子／年岁”表达相称关系
  alternative: 像……日子；有多少……日子，就有多少……
  rationale: 原文כְּ结构容许对应、相称之意。“照着”保留诗句的简练和一定开放性，不把祈求过度限定为严格逐日、逐年的数学等量。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你”明确祈祷语气；“日子／年岁”保留诗歌平行。“你使我们受苦”不淡化原文中上帝作为动作主体的神学张力。脚注标记置于整节末尾，所注释的是“患难”。
