  yaml_path: translation/ot/psalms/090/011.yaml
  text: Who knows the power of your anger[a], and your wrath according to the fear due to you?
translation:
  language: zh_hans
  text: 谁知道你怒气的威力，又知道你的烈怒与对你当存的敬畏相称？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 疑问代词引出反问；“谁”直接、自然，不增添原文没有的成分。
- source_word: יוֹדֵעַ
  choice: 知道
  rationale: ידע的分词表示知道、认识；“知道”保留原文的基本语义，而上下文本身可传达充分认识之意。后半句在汉语中补出“又知道”，使共用谓语的关系清楚。
- source_word: עֹז
  choice: 威力
  rationale: עֹז指力量、能力；与“怒气”搭配时，“威力”既表达其强大，也体现其实际作用。
- source_word: אַפֶּךָ
  choice: 你怒气
  rationale: אַף本义与鼻子有关，但在此是表示发怒的惯用语；译为“怒气”符合现代汉语。
- source_word: וּכְיִרְאָתְךָ
  choice: 与人对你的敬畏相称
  rationale: 该形式由连词、比较介词及“对你的敬畏”构成。正文采用对应、相称的理解，并补出“人对”，使汉语关系明确；原文的压缩性和其他可能读法则在脚注中保留。
- source_word: עֶבְרָתֶךָ
  choice: 你的烈怒
  rationale: עֶבְרָה表示强烈的愤怒；“烈怒”保持庄重语体，也与前面的“怒气”形成适度词义区别。
theological_decisions:
- issue: וּכְיִרְאָתְךָ עֶבְרָתֶךָ中神的烈怒与敬畏之间的关系
  choice: 你的烈怒与人对你的敬畏相称
  alternative: 你的烈怒照着对你的敬畏；对你的敬畏怎样，你的烈怒也怎样
  rationale: 希伯来语表达紧凑，比较介词כְּ所标示的对应关系可以有不同理解。正文表达烈怒与人应有的敬畏相称，不把神的烈怒淡化为一般情绪；脚注保留更贴近原文形式的其他读法，以免消除其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“威力”“烈怒”保持诗篇的力度；全句作为一个反问处理，并在后半句补出共用的“知道”，使汉语顺畅。
