base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/017.yaml
  text: May the favor of the Lord our God be upon us[a], and establish the work of our hands upon us; yes[c][b], establish the work of our hands.
translation:
  language: zh_hans
  text: 愿主——我们的上帝——的恩惠[a]临到我们；愿你为我们[b]坚立我们手所做的工；我们手所做的工，愿你坚立它！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩惠”也可译作“荣美”、“美好”或“喜悦”。
    reason: lexical_alternative
  - marker: b
    text: 原文在此重复前句的介词短语，直译为“在我们身上”或“在我们之上”；在本句中可按语境理解为“为我们”或“使我们得益”。
    reason: source_ambiguity
lexical_decisions:
- source_word: וִיהִי
  choice: 愿……临到
  rationale: 该形式在这里表达祈愿。“愿……临到”既传达祷告语气，也自然承接后面的“在我们身上”之意。
- source_word: נֹעַם
  choice: 恩惠
  rationale: 此词可指悦人、美好、荣美，也可在关系语境中指恩宠。这里祈求上帝眷顾并坚立人的劳作，“恩惠”最贴合上下文，同时以脚注保留其他词义。
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: 主我们的上帝
  rationale: 分别保留“主”和“我们的上帝”两个称号，语言庄重而符合现代汉语圣经语体。
- source_word: עָלֵינוּ
  choice: 临到我们／为我们
  rationale: 第一次与“恩惠”连用，译作“临到我们”；第二次修饰“坚立……的工”，按受益关系译作“为我们”，避免生硬，同时用脚注说明原文重复同一介词短语。
- source_word: מַעֲשֵׂה יָדֵינוּ
  choice: 我们手所做的工
  rationale: 保留“手”的具体意象，又以现代汉语自然表达人的劳作与事业。
- source_word: כּוֹנְנָה / כּוֹנְנֵהוּ
  choice: 坚立／坚立它
  rationale: כון在此指使之稳固、持久。末句保留第三人称阳性单数后缀“它”，也保留原文重复祈求所形成的强调。
theological_decisions:
- issue: 祷告中对上帝称号的翻译
  choice: 主我们的上帝
  alternative: 我们的主上帝
  rationale: 原文是“主”与“我们的上帝”并列组合；所选译法较直接地保留其结构，不额外引入宗派性称谓。
- issue: 上帝对人劳作的作用
  choice: 坚立
  alternative: 使……兴旺
  rationale: 原文强调使工作稳固、成立或持久，并不明确保证物质成功；“坚立”避免把含义缩窄为兴旺或发财。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。保留原文末尾对“我们手所做的工”的完整重复，以呈现诗歌的强调；第二个עָלֵינוּ按较自然的受益义译作“为我们”，并用脚注保存其形式上的重复与解释空间。
