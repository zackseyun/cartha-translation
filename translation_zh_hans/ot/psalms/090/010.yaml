  text: יְמֵֽי שְׁנוֹתֵ֨י/נוּ בָ/הֶ֥ם שִׁבְעִ֪ים שָׁנָ֡ה וְ/אִ֤ם בִּ/גְבוּרֹ֨ת שְׁמ֘וֹנִ֤ים שָׁנָ֗ה וְ֭/רָהְבָּ/ם עָמָ֣ל וָ/אָ֑וֶן כִּי גָ֥ז חִ֝֗ישׁ וַ/נָּעֻֽפָ/ה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/010.yaml
  text: The days of our years are seventy years[a], or if by strength, eighty years; yet their pride is toil and trouble, for it is soon gone[b], and we fly away.
translation:
  language: zh_hans
  text: 我们一生的年日是七十年；若凭强健，可到八十年。然而，这些岁月可夸耀的[a]，也只是劳苦愁烦；因为它转瞬即逝[b]，我们便飞逝而去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“然而，其中最好的也只是劳苦愁烦。”译作“可夸耀的”的希伯来词，也可指这些岁月中最显赫、最强盛的部分。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为它很快就过去”，或“因为它很快就被截断”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמֵי שְׁנוֹתֵינוּ
  choice: 我们一生的年日
  rationale: 保留“年日”的希伯来诗歌表达，同时用“一生的”使现代汉语读者自然理解为人的寿数。
- source_word: בָהֶם שִׁבְעִים שָׁנָה
  choice: 是七十年
  rationale: בָהֶם 在此用于说明年寿的总数，汉语以判断句自然表达，不机械译出介词。
- source_word: וְאִם בִּגְבוּרֹת
  choice: 若凭强健
  rationale: 保留条件语气及 גְבוּרוֹת 所指的体力、强健之意，表明八十年是强健情况下的年寿。
- source_word: וְרָהְבָּם
  choice: 这些岁月可夸耀的
  rationale: רַהַב 可指骄傲、夸耀之处，也可指最显赫或最强盛的部分；此译保留“夸耀”的词义及经文的反讽张力，不直接收窄为“最好的部分”。
- source_word: עָמָל וָאָוֶן
  choice: 劳苦愁烦
  rationale: 在寿命语境中，两词合指辛劳、困苦与忧患；“劳苦愁烦”自然庄重，也避免把 אָוֶן 在其他语境中的“罪恶”义强加于此。
- source_word: כִּי גָז חִישׁ
  choice: 因为它转瞬即逝
  rationale: כִּי 保留因果关系；גָז 与 חִישׁ 合起来表达迅速过去或被迅速截断。“转瞬即逝”贴合诗体，并以脚注保存另一种可能。
- source_word: וַנָּעֻפָה
  choice: 我们便如飞而去
  rationale: 保留原文第一人称复数和“飞去”的鲜明诗歌意象；“如飞”在汉语中自然传达迅速离去，并不把意象平化为单纯的“消逝”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“一生的年日”“劳苦愁烦”“如飞而去”保持诗篇的凝练节奏；标点呈现寿数、年岁的实质及迅速消逝之间的递进。脚注标记置于其实际解释的词句之后。
