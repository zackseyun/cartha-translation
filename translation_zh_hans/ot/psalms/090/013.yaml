  text: שׁוּבָ֣/ה יְ֭הוָה עַד מָתָ֑י וְ֝/הִנָּחֵ֗ם עַל עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/013.yaml
  text: Return[a], O Yahweh—how long? And have compassion on your servants.
translation:
  language: zh_hans
  text: 耶和华啊，求你回转！还要等到几时呢？求你怜悯你的仆人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你为你的仆人转意。”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: 求你回转
  rationale: 这是向耶和华发出的命令式恳求；“回转”保留了哀歌中直接的空间与关系意象，没有预先把它解释为“回心转意”。加“求”符合现代汉语祷告语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中通行的神名音译“耶和华”，使其与普通读者熟悉的专名形式相连，而不以称号代替。
- source_word: עַד מָתָי
  choice: 还要等到几时呢？
  rationale: 这是希伯来哀歌中表达迫切申诉的惯用语；此译自然地传达持续等待与催问的语气。
- source_word: וְהִנָּחֵם
  choice: 求你怜悯
  rationale: נחם 的尼法勒命令式在此可表达动了怜悯或改变处置。“怜悯”适合为神仆人代求的语境，并避免现代汉语“后悔”可能暗示神犯错的误解；改变行动的意味保留在脚注中。
- source_word: עַל
  choice: （融入“怜悯你的仆人”）
  rationale: 介词 עַל 标示怜悯或回心转意所关涉的对象；现代汉语无需逐词另译。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: עבד 可指奴仆或仆人；在向神祈求、指称属他之人的语境中，“仆人”自然且庄重，同时保留服属关系。
theological_decisions:
- issue: 当 נחם 以神为主语时如何翻译
  choice: 求你怜悯你的仆人
  alternative: 求你为你的仆人回心转意／求你转意，不再降祸于你的仆人
  rationale: 原文可兼有受感而怜悯及改变原定处置的意味。正文用“怜悯”避免把人的道德悔改含义强加于神；脚注保存“转意”的可能，以保留原文有关神改变行动的张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“耶和华啊”保留直接呼求；两个“求你”使希伯来语命令式在汉语中自然呈现。“回转”与“怜悯”分别承载两个动词，避免把二者合并解释。
