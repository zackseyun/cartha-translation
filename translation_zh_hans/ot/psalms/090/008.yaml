  text: שת עֲוֺנֹתֵ֣י/נוּ לְ/נֶגְדֶּ֑/ךָ עֲ֝לֻמֵ֗/נוּ לִ/מְא֥וֹר פָּנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/008.yaml
  text: You have set our iniquities before you[b][a], our hidden sins in the light of your face.
translation:
  language: zh_hans
  text: 你把我们的罪孽摆在你面前，把我们隐秘的罪[a]置于你面光之中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们隐秘的事”。原文指隐藏、隐蔽之物；这里与“罪孽”平行，所指应是隐而不露的罪。
    reason: lexical_alternative
  - marker: b
    text: 直译“你面光之中”，形象地表示一切都在上帝面前完全显露。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתָּה / שת（词根 שִׁית）
  choice: 你把……摆在
  rationale: 该动词意为“放置、摆放”。这里以完成式直接对上帝说话；汉语不强行标明时态，以“把……摆在”自然表达已经成立的揭露行动。
- source_word: עֲוֺנֹתֵינוּ
  choice: 我们的罪孽
  rationale: עָוֹן 可指罪孽、罪责或不义行为。“罪孽”保留其道德分量和复数所表达的具体罪行。
- source_word: לְנֶגְדֶּךָ
  choice: 在你面前
  rationale: 直译为“在你面前、在你对面”，表达一切罪孽都暴露在上帝直接的察看之下。
- source_word: עֲלֻמֵנוּ
  choice: 我们隐秘的罪
  rationale: 该词指隐藏、隐蔽之物；与上半句“我们的罪孽”平行，因此语境所指是隐而不露的罪。正文补出“罪”，同时以脚注保留较宽的字面可能。
- source_word: לִמְאוֹר
  choice: 置于……的光中
  rationale: 介词短语描绘隐藏之物进入照明、完全显露的状态。“置于……的光中”既承接上半句的动词，也保留诗歌意象。
- source_word: פָּנֶיךָ
  choice: 你面容
  rationale: 原文直指“你的脸/面”。“面容”在现代汉语中庄重自然，并比单纯译作“同在”更完整地保留希伯来诗歌的具体意象。
theological_decisions:
- issue: 是否明确 עֲלֻמֵנוּ 所隐含的对象
  choice: 译为“我们隐秘的罪”
  alternative: “我们隐秘的事”或“我们隐藏之物”
  rationale: 与“我们的罪孽”构成的平行关系强烈表明这里是隐蔽的罪恶，而不是中性的私密之事；补出“罪”使现代读者易懂，同时脚注说明原词本身可较宽泛地指隐藏之物。
- issue: 如何处理“你面容的光”这一神学诗歌意象
  choice: 保留“你面容的光”
  alternative: 意译为“在你面前完全显露”
  rationale: 原文借上帝面容之光表达在其临在和鉴察下无所隐藏。保留意象可避免把丰富的诗性表达缩减为抽象解释，脚注则说明其含义。
translation_notes:
  register: 采用现代、庄重而清楚的诗体汉语。两个分句以“摆在／置于”相互呼应，保留希伯来诗句的平行结构；“面容的光”保留原文具体意象，不以抽象神学术语替代。
