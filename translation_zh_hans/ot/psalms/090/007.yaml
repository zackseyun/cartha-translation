  text: כִּֽי כָלִ֥ינוּ בְ/אַפֶּ֑/ךָ וּֽ/בַ/חֲמָתְ/ךָ֥ נִבְהָֽלְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/007.yaml
  text: For we are consumed by your anger[b][a], and by your wrath we are terrified.
translation:
  language: zh_hans
  text: 我们因你的怒气而消亡[a]，因你的烈怒而惊惶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们在你的怒气中消亡”或“我们被你的怒气耗尽。”希伯来语动词可指完结、耗尽或被带到尽头；此处介词也可表达原因或手段。
    reason: lexical_alternative
  - marker: b
    text: 或译：“恐惧”“慌乱”或“受惊。”希伯来语动词表示受惊、震动、慌乱或陷入惊恐。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因
  rationale: 承接上文，说明人在神震怒之下归回尘土的原因；“因”简洁保留解释性关系。
- source_word: כָלִינוּ
  choice: 耗尽
  rationale: כלה可表示完结、消耗殆尽或被带到尽头。“耗尽”既传达毁灭性的结果，也保留其完成、终结之义。
- source_word: בְאַפֶּךָ
  choice: 在你的怒气中
  rationale: ב可表达处境，也可带有原因或手段意味；此译保留“处于怒气之下”与“因怒气而耗尽”之间的张力。
- source_word: חֲמָתְךָ
  choice: 你的烈怒
  rationale: חֵמָה表示炽烈的愤怒。“烈怒”自然庄重，并与前句的“怒气”形成递进而不混同。
- source_word: נִבְהָלְנוּ
  choice: 惊惶
  rationale: בהל在此表示受惊、慌乱或恐惧。“惊惶”兼具内心震动和恐惧，不把强度限定为单纯的惊恐。
theological_decisions:
- issue: 平行句中神愤怒的两个词
  choice: 分别译为“怒气”和“烈怒”
  alternative: 两处都译作“愤怒”，或译为“怒气”和“震怒”
  rationale: 希伯来文使用אַף与חֵמָה两个相关但不同的词；分别翻译可保留诗句的平行与加强语势，又不附加特定教义解释。
- issue: בְאַפֶּךָ所表达的关系
  choice: 译为“在你的怒气中”
  alternative: “因你的怒气”或“被你的怒气”
  rationale: 介词ב可按处境、原因或手段理解；正文采用较贴近形式且能容纳多重关系的表达，脚注说明因果性译法。
translation_notes:
  register: 采用现代、庄重而简洁的诗体。“耗尽”比“消灭”更能保留原词既可指消耗殆尽、也可指走到终点的语义范围；“惊惶”符合现代书面汉语，也保留恐惧与慌乱之间的幅度。
