  text: תָּשֵׁ֣ב אֱ֭נוֹשׁ עַד דַּכָּ֑א וַ֝/תֹּ֗אמֶר שׁ֣וּבוּ בְנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/003.yaml
  text: You return man to dust[a], and say, “Return[b], sons of man.”
translation:
  language: zh_hans
  text: 你使世人归于尘土[a]，又说：“世人啊[b]，你们归回吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被压碎之境”或“粉碎之物”；希伯来语指被压碎、碾成粉末之物或状态。这里依上下文译作“尘土”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“人的众子”；“人”也可与“亚当”相关。在这里泛指世人或人类。
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשֵׁב
  choice: 你使……归于
  rationale: 这是שׁוב的使役形式，表达上帝使人返回某种状态；“使……归于”既保留使役义，也符合现代汉语诗体。
- source_word: אֱנוֹשׁ
  choice: 世人
  rationale: 该词在此集合性地指脆弱、必死的人类。“世人”自然地涵盖全人类，并保留庄重语体。
- source_word: עַד דַּכָּא
  choice: 归于尘土
  rationale: דַּכָּא的基本意象是被压碎、碾碎之物或状态；结合人的死亡与归回这一语境，“尘土”自然传达被化为粉末的结果，同时以脚注保留词义范围。
- source_word: וַתֹּאמֶר
  choice: 又说
  rationale: 承接前一动作并引出上帝的话；“又说”在现代汉语中简洁自然。
- source_word: שׁוּבוּ
  choice: 你们归回吧
  rationale: 复数命令式，与前面的使役形式תָּשֵׁב形成刻意的词根呼应；“归回”保留这一呼应及庄重语气。
- source_word: בְנֵי אָדָם
  choice: 人之子
  rationale: 直译为“人/亚当的众子”，在此泛指人类。“人之子”保留原文的亲属表达及与אָדָם的关联，脚注说明其通常意义。
theological_decisions:
- issue: בְנֵי אָדָם的人类学表达
  choice: 人之子
  alternative: 世人；人类；亚当的子孙
  rationale: 原文采用“众子”结构，并以אָדָם指人或亚当。正文保留这种表达，不武断判定此处必须专指亚当的后裔；脚注同时说明其泛指人类的功能。
- issue: דַּכָּא是否明确译为尘土
  choice: 尘土
  alternative: 压碎之境；粉碎之物；毁灭
  rationale: 语境关乎人的死亡和归回，“尘土”能自然呈现其结果及可能的创世记回响；但原词本身侧重压碎或碾成粉末，因此用脚注保留其词汇张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以“使……归于”与“归回”保留同一希伯来词根的呼应；正文保留“人之子”的原文形式，并借脚注避免将“人”与专名“亚当”之间的歧义过早消解。
