  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/000.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: zh_hans
  text: '神人摩西的祷告。[a]


    主啊，你世世代代作我们的居所。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 标题中的希伯来语也可译作“摩西所作的祷告”或“为摩西而作的祷告”；所用介词可表示作者、关联或献予对象。
    reason: alternative_reading
  - marker: b
    text: “居所”也可译作“住处”或“避难所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: 祷告
  rationale: 直接表达该词所指向神的祈祷，也符合诗篇标题的庄重语体。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 保留希伯来语固定称谓的简洁形式；现代中文圣经语境中易于识别，指属神并受神托付的人。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 该词是对神的称呼；加“啊”自然呈现直接呼告。
- source_word: מָעוֹן
  choice: 居所
  rationale: 基本义为居住之处；在此作为比喻，表达神是百姓历代安居之所，同时不直接将其收窄为“避难所”。
- source_word: בְּדֹר וָדֹר
  choice: 世世代代
  rationale: 自然而凝练地传达逐代延续、历代如此的意思。
theological_decisions:
- issue: 标题中 לְמֹשֶׁה 的关系
  choice: 摩西的祷告
  alternative: 摩西所作的祷告／为摩西而作的祷告
  rationale: 前置词 לְ 可表示作者、归属或关联；正文采用中文标题中自然且传统的“摩西的”，并以脚注保留原文关系上的歧义。
- issue: 称神为 מָעוֹן 的比喻范围
  choice: 作我们的居所
  alternative: 作我们的避难所／是我们的住处
  rationale: 保留空间性比喻及其神学张力，不把含义仅限定为危难中的保护。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“神人”保留经文称谓的凝练感；正文与标题分行，以清楚区分诗篇题注和祷告本句。
