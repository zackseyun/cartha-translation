base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/014.yaml
  text: Satisfy us in the morning with your steadfast love[a], and we will sing for joy and be glad all our days.
translation:
  language: zh_hans
  text: 求你在早晨以你的慈爱[a]使我们得满足，使我们一生欢呼喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你信实的爱”“你的盟约之爱”，也可译“你的怜悯”。希伯来语 חֶסֶד 指忠贞、长存的爱与恩慈。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂבְּעֵנוּ
  choice: 使我们……得满足
  rationale: 该词为 שבע 的皮埃勒命令式，带第一人称复数宾语后缀，表达恳求上帝使人充分饱足。“使我们得满足”既忠实于使役意味，也符合现代汉语表达。
- source_word: בַבֹּקֶר
  choice: 早晨
  rationale: 原文直译为“在早晨”。保留单数时间表达，不擅自解释为反复性的“每天早晨”或期限性的“到早晨”。
- source_word: חַסְדֶּךָ
  choice: 你的慈爱
  rationale: חֶסֶד 包含忠贞、持久的爱与恩慈。“慈爱”是简明庄重且为普通中文读者熟悉的表达；脚注补明其忠贞长存的内涵，并保留其他可能译法。
- source_word: וּנְרַנְּנָה
  choice: 欢呼
  rationale: רנן 表示发声欢庆，可指欢呼或欢唱。此处译作“欢呼”，保留其高声表达喜乐的力度，同时不把本可泛指欢呼的词义限缩为歌唱。
- source_word: וְנִשְׂמְחָה
  choice: 喜乐
  rationale: שמח 表示欢喜、快乐；与“欢呼”并列译为“欢呼喜乐”，既保存两个动词，又形成自然凝练的汉语表达。
- source_word: בְּכָל יָמֵינוּ
  choice: 一生
  rationale: 字面意思是“在我们所有的日子里”，指众人一生全部的年日。“一生”在中文中自然简洁，也准确传达持续终身的时间范围。
theological_decisions:
- issue: 祈求上帝眷爱时 חֶסֶד 的译法
  choice: 你的慈爱
  alternative: 你的信实之爱；你的盟约之爱；你的怜悯
  rationale: 本节以属上帝那忠贞持久的爱作为人得满足并终身喜乐的根基。“慈爱”保留爱与恩慈的核心，又不在正文中把该词限定为某一种神学体系；脚注说明其忠贞长存的语义幅度。
- issue: 两个祈愿式动词与前句命令式的关系
  choice: 好叫我们一生欢呼喜乐
  alternative: 我们就一生欢呼喜乐；愿我们一生欢呼喜乐
  rationale: וּנְרַנְּנָה 和 וְנִשְׂמְחָה 均带祈愿色彩，接在祈求之后，可表达目的或结果。“好叫”自然呈现目的意味，但不把喜乐理解为人的功劳或必然交换条件。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”显明命令式在此为向上帝发出的恳求；“一生”自然表达“我们所有的日子”。正文避免生硬直译，同时以脚注保留 חֶסֶד 的丰富语义。
