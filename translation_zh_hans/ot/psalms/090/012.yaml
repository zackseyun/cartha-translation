  yaml_path: translation/ot/psalms/090/012.yaml
  text: Teach us to number our days[a], that we may gain a heart of wisdom.
translation:
  language: zh_hans
  text: 求你教导我们这样数算我们的日子，使我们得着智慧的心。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“求你使我们知道这样数算我们的日子，我们便带着智慧的心而来。”希伯来文末句较难理解；许多人将其理解为“使我们得着智慧的心”。
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְנוֹת
  choice: 数算
  rationale: 该不定式意为“计算、数点”。“数算”既保留具体意象，也符合现代汉语中对人生年日作清醒衡量的庄重表达。
- source_word: יָמֵינוּ
  choice: 我们的日子
  rationale: 忠实表达第一人称复数后缀；在本诗语境中指人有限的一生。正文用“自己的日子”与“我们”自然呼应。
- source_word: כֵּן
  choice: 如此（未在正文中单独明示）
  rationale: 该词基本义为“如此、这样”。其具体句法作用并不完全确定；为避免擅自加入“正确地”等解释性含义，正文不另加副词，脚注则保留较直译的“如此数算”。
- source_word: הוֹדַע
  choice: 教导我们
  rationale: ידע的使役命令式直译为“使我们知道”。祷告语境中，“教导我们”自然表达求上帝使人明白的含义。
- source_word: וְנָבִא
  choice: 好使我们得着
  rationale: 字面可译为“我们就带来”，但末句结构艰涩。按语境理解为达到或获得智慧之心，译作“好使我们得着”；脚注保留字面可能。
- source_word: לְבַב חָכְמָה
  choice: 智慧的心
  rationale: 保留希伯来语“智慧之心”的结构，以及“心”作为思想、意志和内在生命中心的表达。
theological_decisions:
- issue: 末句目的或结果关系及וְנָבִא的理解
  choice: 好使我们得着智慧的心
  alternative: 如此数算我们的日子，我们就带来一颗智慧的心
  rationale: 所选译法与全诗对人生短暂和寻求智慧的默想相合，也能形成自然汉语；但希伯来文末句语法简约且含义有争议，因此以脚注明示更直译的可能，不把解释冒充为唯一读法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“数算”保留诗歌的传统意象；“得着智慧的心”自然清楚，同时用脚注保存原文末句的歧义。
