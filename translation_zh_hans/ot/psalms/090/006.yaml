  text: In the morning it sprouts and flourishes[c][b][a]; by evening it withers and dries up.
translation:
  language: zh_hans
  text: 清晨，它发芽生长[a]；到了傍晚，它凋萎而干枯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发芽”也可译“开花”；“生长”所译的希伯来语动词也可指“变化”或“过去、消逝”。在此草木的比喻中，其确切意象并不完全确定。
    reason: lexical_alternative
  - marker: b
    text: “凋萎”或译“被割下”；这里的希伯来语动词既可理解为凋萎，也可能表示被割除。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: 清晨
  rationale: 自然表达时间，与下半句“到晚上”形成鲜明对照，也突显草木生命的短暂。
- source_word: יָצִיץ
  choice: 发芽
  rationale: 该动词可指萌芽或开花；此处译作“发芽”，呈现植物生命初起的阶段，同时以脚注保留“开花”的可能。
- source_word: וְחָלָף
  choice: 生长
  rationale: חלף通常可表示经过、变化或消逝，但在草木意象及与傍晚衰败的对照中，可能描写白日间继续生长；“生长”在现代汉语中自然，同时脚注保留较直译的理解。
- source_word: לָעֶרֶב
  choice: 到晚上
  rationale: 表达由清晨至晚间的迅速转变，符合诗句的时间对照。
- source_word: יְמוֹלֵל
  choice: 枯萎
  rationale: 此词在本语境中可指凋萎，也可能指被割下；“枯萎”与随后“干透”构成自然的衰败过程，且不擅自加入外在施事者。
- source_word: וְיָבֵשׁ
  choice: 干透
  rationale: 准确传达草木变干的最终状态；“干透”简洁自然，并强化衰败已完成的语感。
