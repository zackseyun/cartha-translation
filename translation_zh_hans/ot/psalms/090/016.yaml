  yaml_path: translation/ot/psalms/090/016.yaml
  text: Let your work appear to your servants, and your splendor upon their children.
translation:
  language: zh_hans
  text: 愿你的作为向你的仆人显现；愿你的威荣临到他们的儿女。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵרָאֶה
  choice: 显明
  rationale: 该被动/反身形态表达“被看见、显现”。译为“显明”既保留祈愿语气，也比直译“被看见”更符合现代汉语诗体。
- source_word: פָעֳלֶךָ
  choice: 你的作为
  rationale: פֹּעַל 指所做的工作、行动或成果；“作为”能涵盖神的行动及其结果，不限于一般劳动。
- source_word: וַהֲדָרְךָ
  choice: 你的荣美
  rationale: הָדָר 可指威荣、尊荣、壮美；“荣美”同时传达荣耀与美盛，适合诗篇语境。
- source_word: עַל
  choice: 临到
  rationale: 原义为“在……之上、向着”；此处“临到”自然地保留荣美覆临后代的意象，避免把关系弱化为单纯“给”。
- source_word: בְּנֵיהֶם
  choice: 他们的儿女
  rationale: בָּנִים 可指儿子、子女或后代；在此代际平行结构中，“儿女”自然且不无根据地限于男性后裔。
theological_decisions:
- issue: 神的“作为”如何向仆人显现
  choice: 不具体说明其所指，仅译“你的作为向你的仆人显明”
  alternative: 解释为神的救赎、审判或所赐成功
  rationale: 原文保持概括性，可能涵盖神在群体中的行动及其成果；译文不应替诗人限定。
- issue: “荣美”与儿女之间的关系
  choice: 译作“临到他们的儿女”
  alternative: 译作“向他们的儿女显明”或“在他们的儿女身上”
  rationale: 第二分句省略动词，并用 עַל；“临到”保留其空间及赐予意味，也维持原诗的神学张力，不明确补入“显明”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留两句平行的祈愿结构。“仆人”“荣美”符合诗篇语域，又能为普通读者理解。
