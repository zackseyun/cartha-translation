  text: כִּ֣י כָל יָ֭מֵי/נוּ פָּנ֣וּ בְ/עֶבְרָתֶ֑/ךָ כִּלִּ֖ינוּ שָׁנֵ֣י/נוּ כְמוֹ הֶֽגֶה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/009.yaml
  text: For all our days pass away in your wrath[a]; we finish our years like a sigh.
translation:
  language: zh_hans
  text: '因为我们的日子都在你的震怒中逝去；

    我们度尽年岁，仿佛一声叹息[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“低语”或“呻吟”。希伯来词可指低沉的声音；正文译作“叹息”，以贴合本段人生短暂易逝的语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为人生在上帝忿怒之下消逝作出解释；保留希伯来语的因果连接作用。
- source_word: כָל יָמֵינוּ
  choice: 我们所有的日子
  rationale: 保留原文复数的具体意象，并与下句“年岁”形成诗歌平行。
- source_word: פָּנוּ
  choice: 逝去
  rationale: 此处指日子转去、过去；“逝去”符合现代汉语诗体，也呼应本诗关于人生短暂的主题。
- source_word: בְעֶבְרָתֶךָ
  choice: 在你的震怒中
  rationale: עֶבְרָה表达强烈、满溢的怒气；“震怒”保留其力度，介词“在……中”则表达日子消逝时所处的境况。
- source_word: כִּלִּינוּ
  choice: 我们度尽
  rationale: 该词在此有耗尽、完成之意；“度尽年岁”既自然又保留人生走到尽头的意味，而不额外说明其方式。
- source_word: שָׁנֵינוּ
  choice: 年岁
  rationale: 保留原文复数，并与上句“日子”构成对应。
- source_word: כְמוֹ
  choice: 仿佛
  rationale: 自然表达原文的明喻关系，同时维持庄重的诗歌语体。
- source_word: הֶגֶה
  choice: 一声叹息
  rationale: 该词可指低沉的声音，如低语、呻吟或叹息；在人生迅速消逝的语境中，“一声叹息”自然传达短促、微弱之感，同时以脚注保留其他可能。
theological_decisions:
- issue: 上帝发怒的强度
  choice: 你的震怒
  alternative: 你的怒气／你的烈怒
  rationale: 原文明确把人的日子置于上帝强烈的怒气之中。“震怒”没有淡化这一神学张力，也不额外解释其原因或性质。
- issue: 人生年岁的终结
  choice: 我们度尽年岁
  alternative: 我们的年岁耗尽／我们终结自己的年岁
  rationale: 原文动词可表达完成或耗尽。“度尽”保留人在上帝震怒之下走完年岁的陈述，不把它过度解释为主动结束生命或纯粹被动消耗。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两行保留“日子／年岁”的平行结构；“逝去／度尽”避免生硬直译，同时不增添原文没有的时间修饰语。脚注标记置于其实际对应的“叹息”之后。
