  text: זְ֭רַמְתָּ/ם שֵׁנָ֣ה יִהְי֑וּ בַּ֝/בֹּ֗קֶר כֶּ/חָצִ֥יר יַחֲלֹֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/005.yaml
  text: You sweep them away[a]; they are like a dream[c][b]. In the morning they are like grass that sprouts anew.
translation:
  language: zh_hans
  text: 你把他们冲走；他们如一场梦[a]。清晨，他们如重新萌发的草。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你把他们如洪水般冲走；他们不过是一觉。清晨，草又萌发。”希伯来原文极为凝练，句法和比喻关系有多种理解；末尾动词为单数，形式上与“草”一致。
    reason: alternative_reading
lexical_decisions:
- source_word: זְרַמְתָּם
  choice: 你把他们冲走
  rationale: זָרַם带有急流冲走、席卷而去的意象；“冲走”既保留水流色彩，也自然表达人的骤然消逝。
- source_word: שֵׁנָה
  choice: 一场梦
  rationale: 该词通常指“睡眠”，但在此高度凝练的诗句中喻指睡梦般短暂、虚幻的状态；正文用“一场梦”较自然，脚注保留直译可能。
- source_word: יִהְיוּ
  choice: 他们如
  rationale: 未完成式在诗歌中可作概括性描述；结合名词性比喻，译为现在时“他们如”最自然。
- source_word: בַּבֹּקֶר
  choice: 清晨
  rationale: 准确保留时间状语，并与下一节傍晚枯干的景象形成对照。
- source_word: כֶּחָצִיר
  choice: 如……草
  rationale: חָצִיר指草或青草；“草”简洁清楚，符合本诗关于生命短暂的自然意象。
- source_word: יַחֲלֹף
  choice: 重新萌发
  rationale: חלף可表示改变、更新或过去；结合第6节清晨生长、傍晚枯干的平行结构，此处取“重新萌发”。动词为阳性单数，形式上与“草”一致。
theological_decisions: []
