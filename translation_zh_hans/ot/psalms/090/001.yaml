base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/001.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: zh_hans
  text: '上帝之人摩西的祷告[a]。


    主啊，你世世代代作我们的居所[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 标题也可译作“上帝之人摩西所作的祷告”或“为上帝之人摩西而作的祷告”；希伯来语介词可表示作者、关联或题献。
    reason: alternative_reading
  - marker: b
    text: “居所”也可译作“住处”；按语境也有人译作“避难所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: 祷告
  rationale: 作为诗篇标题的体裁名称，“祷告”准确、自然，也符合现代汉语圣经文体。
- source_word: לְמֹשֶׁה
  choice: 摩西的
  rationale: 标题中的介词 לְ 可表示作者、关联或归属；“摩西的”在中文中较为中性，避免过度确定为“摩西所作”或“为摩西而作”。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 上帝之人
  rationale: 保留希伯来语带定冠词的正式称号，并采用庄重、通行的中文表达。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 此处是对上帝的直接呼告；“主啊”自然体现呼格语气，而不把该固定神圣称号过度译成“我的主”。
- source_word: מָעוֹן
  choice: 居所
  rationale: 该词本义为居住之处；“居所”简洁保留空间隐喻，没有像“避难所”那样将含义收窄为保护功能。
- source_word: הָיִיתָ לָּנוּ
  choice: 作我们的
  rationale: 结合系词结构与 לָּנוּ，中文译作“作我们的居所”自然表达上帝一直与群体保持的关系。
- source_word: בְּדֹר וָדֹר
  choice: 世世代代
  rationale: 这是自然的现代汉语惯用语，准确表达历代相续、持续不断的意思。
theological_decisions:
- issue: 诗篇标题 לְמֹשֶׁה 的语义范围
  choice: 译为“摩西的”，并加注说明其开放性
  alternative: “摩西所作的”或“为摩西而作的”
  rationale: 希伯来介词 לְ 在诗篇标题中可表示作者、关联或归属。正文采用中性表达，脚注保留作者与题献等可能性，不作超出原文的历史判断。
- issue: 称上帝为 מָעוֹן 的隐喻
  choice: 保留为“居所”
  alternative: “避难所”或“住处”
  rationale: “居所”保留上帝作为其子民恒久安居之处的完整空间隐喻；“避难所”虽符合语境可能包含的安全意味，却会缩窄词义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。标题与诗句分行，以显明希伯来诗篇标题的功能；“主啊”体现直接呼告，“世世代代”保持诗歌的凝练与节奏。
