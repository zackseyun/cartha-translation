  text: בְּ/טֶ֤רֶם הָ֘רִ֤ים יֻלָּ֗דוּ וַ/תְּח֣וֹלֵֽל אֶ֣רֶץ וְ/תֵבֵ֑ל וּֽ/מֵ/עוֹלָ֥ם עַד ע֝וֹלָ֗ם אַתָּ֥ה אֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/002.yaml
  text: Before the mountains were born[a], and you brought forth the earth and the world, from everlasting to everlasting you are God.
translation:
  language: zh_hans
  text: 在群山诞生以前，在你生出大地和世界[a]以前，从亘古到永远，你是上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生出”所译的希伯来语动词带有生产、分娩的意象。
    reason: 说明该词保留的生产／分娩图像，避免用弱化该意象的替代译法。
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: 在……以前
  rationale: 明确表达创造发生之前的时间关系，并与两个并列的创造意象自然衔接。
- source_word: הָרִים יֻלָּדוּ
  choice: 群山尚未诞生
  rationale: 保留 ילד 被动式的出生意象；“诞生”用于群山，既具诗意，也符合现代汉语。
- source_word: וַתְּחוֹלֵל
  choice: 你尚未生出
  rationale: 保留该动词所含的生产、分娩意象及第二人称主动表达，不将其弱化为笼统的“创造”。
- source_word: אֶרֶץ וְתֵבֵל
  choice: 大地和世界
  rationale: 在宇宙创造语境中，אֶרֶץ 指大地，תֵבֵל 指有秩序或有人居住的世界；此译简洁保留二者并列。
- source_word: וּמֵעוֹלָם עַד עוֹלָם
  choice: 从亘古到永远
  rationale: 保留希伯来语由无始延伸至无终的惯用表达；“亘古”体现向过去的无界久远，“永远”体现向未来的无尽延续。
- source_word: אַתָּה אֵל
  choice: 你是上帝
  rationale: 保留显明的第二人称强调，并以现代汉语中清楚、庄重的神称翻译 אֵל。
theological_decisions:
- issue: 创造叙述中的生产和出生意象
  choice: 群山“诞生”，上帝“生出”大地和世界
  alternative: 译作“群山形成、你创造大地和世界”
  rationale: 原文刻意以出生和生产描绘受造界的起源。保留此意象能呈现诗歌张力，同时不据此推演创造方式或上帝的性别。
- issue: 上帝永恒性的表达
  choice: 从亘古到永远，你是上帝
  alternative: 从永恒到永恒，你是上帝
  rationale: 所选译法保留原文双向无界的时间惯用语，也避免用抽象哲学术语过度界定“永恒”。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。“群山”比“山岳”更通俗自然；“亘古”虽略具文学色彩，但在此诗歌语境中清楚凝练。句首用“在……以前”统摄两个并列分句，以自然汉语准确表达希伯来语的时间结构。
