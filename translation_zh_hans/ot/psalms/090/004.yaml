  text: כִּ֤י אֶ֪לֶף שָׁנִ֡ים בְּֽ/עֵינֶ֗י/ךָ כְּ/י֣וֹם אֶ֭תְמוֹל כִּ֣י יַעֲבֹ֑ר וְ/אַשְׁמוּרָ֥ה בַ/לָּֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/004.yaml
  text: For a thousand years in your sight are like yesterday when it is past[c][b][a], or like a watch in the night.
translation:
  language: zh_hans
  text: 因为在你眼中，千年如已逝的昨日[a]，又如夜间的一更[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已逝的”也可译作“当那一天过去时”或“当它逝去时”。希伯来语在这里的时间关系可有细微差别。
    reason: lexical_alternative
  - marker: b
    text: “一更”指夜间为守卫而划分的一段时间。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为（由上下文以“在你眼中”承接，未单独译出）
  rationale: 此处引出对上文的解释。中文若在单节中直译“因为”，会显得悬空，因此以承接式语序表达其解释功能。
- source_word: אֶלֶף שָׁנִים
  choice: 千年
  rationale: 直接保留数目和时间单位，维持诗句中神与人对时间之视角的对比。
- source_word: בְּעֵינֶיךָ
  choice: 在你眼中
  rationale: 保留希伯来语的身体隐喻，同时在现代汉语中自然表达“从你的视角看来”。
- source_word: כְּיוֹם אֶתְמוֹל
  choice: 如……昨日
  rationale: 该短语直指已经成为昨日的一天；汉语用“昨日”简洁自然，并保留诗性。
- source_word: כִּי יַעֲבֹר
  choice: 已逝的
  rationale: 将该分句理解为修饰“昨日”，说明那一天已经过去；“已逝”简练地表现时间转瞬消失，同时用脚注保留另一种时间语气。
- source_word: וְאַשְׁמוּרָה
  choice: 又如……一更
  rationale: 连接词在此引入第二个比喻，故译作“又如”。אַשְׁמוּרָה 指夜间守望的时段，“一更”能自然传达这一时间分段。
- source_word: בַלָּיְלָה
  choice: 夜里
  rationale: 直接表达守望时段发生于夜间，符合现代汉语习惯。
theological_decisions:
- issue: 以拟人化语言描述上帝看待时间的视角
  choice: 保留“在你眼中”以及千年与昨日、一更的诗性比较，不作哲学化扩展。
  alternative: 把经文解释性地译成“千年对你而言微不足道”或“你超越时间”。
  rationale: 原文强调神与人对时间的不同视角，却未在本节系统阐述神的永恒或无时间性；译文不应加入经文本身没有明说的神学结论。
translation_notes:
  register: 采用现代、庄重而简洁的诗体汉语。“已逝的昨日”突出时间已经过去且转瞬即逝；“一更”比音译式或解释过长的表达更自然，并由脚注补充古代守夜背景。
