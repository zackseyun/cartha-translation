  text: Praise him[a], highest heavens[c][b], and waters above the heavens.
translation:
  language: zh_hans
  text: 至高的诸天[a]和诸天之上的水啊，都要赞美他！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“诸天之天”，是表达“至高诸天”的希伯来语说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: 都要赞美他
  rationale: 该词是复数阳性命令式，带第三人称阳性单数宾语后缀，意为呼召多个对象赞美上帝；“都要赞美他”自然体现共同受命的多个对象。
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: 至高的诸天
  rationale: 该组合结构直译为“诸天之天”，在希伯来语中表达最高或至高之意；“至高的诸天”既传达其加强含义，也符合现代汉语表达。
- source_word: וְהַמַּיִם
  choice: 和……水啊
  rationale: 定冠词所限定的“水”与前面的“诸天”并列，同受“赞美他”这一命令支配；语气词“啊”清楚标示两者都是呼语。
- source_word: אֲשֶׁר מֵעַל הַשָּׁמָיִם
  choice: 诸天之上的
  rationale: 关系从句修饰“水”；译为“诸天之上的”简洁自然，并保留מֵעַל所表达的空间方位。
theological_decisions:
- issue: “诸天之上的水”所反映的宇宙图景
  choice: 按经文保留“诸天之上的水”这一古代诗歌意象
  alternative: 将其解释为大气中的水、云层或纯粹的象征
  rationale: 诗篇在此呼召受造界各部分赞美上帝。译文应保存原文的宇宙图景，不以现代科学范畴改写，也不在缺乏文本依据时将其化为隐喻。
translation_notes:
  register: 采用现代、庄重而适合诵读的汉语。将两个并列呼语合为“至高的诸天和诸天之上的水啊”，再以“都要赞美他”表达共同受命，避免不自然的重复，同时保留原文意象与句法关系。
