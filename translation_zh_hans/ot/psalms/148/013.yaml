id: PSA.148.13
reference: Psalms 148:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהַלְל֤וּ אֶת שֵׁ֬ם יְהוָ֗ה כִּֽי נִשְׂגָּ֣ב שְׁמ֣/וֹ לְ/בַדּ֑/וֹ ה֝וֹד֗/וֹ עַל אֶ֥רֶץ וְ/שָׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/013.yaml
  text: Let them praise the name of Yahweh[a], for his name alone is exalted; his majesty is above earth and heaven.
translation:
  language: zh_hans
  text: 愿他们赞美雅威的名，因为唯有他的名崇高；他的威荣[a]在大地和诸天之上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “威荣”也可译作“荣美”、“荣耀”或“威严”。
    reason: 词义存在多个彼此重叠的合理表达。
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: 愿他们赞美
  rationale: 未完成式在本诗连续呼召赞美的语境中带有祈愿、劝勉语气；“愿他们赞美”既保留这一语气，也符合现代汉语诗体。
- source_word: שֵׁם
  choice: 名
  rationale: 直译为“名”，保留希伯来诗歌中上帝之名所承载的身份、声誉与启示意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不用头衔替代原文的专名。
- source_word: כִּי
  choice: 因为
  rationale: 引出赞美呼召的理由；“因为”在现代汉语中清楚自然。
- source_word: נִשְׂגָּב
  choice: 崇高
  rationale: 表达处于至高、尊崇地位的状态，并与下句的威荣相呼应。
- source_word: שְׁמוֹ לְבַדּוֹ
  choice: 唯有他的名
  rationale: 保留 לְבַדּוֹ 的排他性，并维持原文以“他的名”为焦点，而不改写成“唯有他”。
- source_word: הוֹדוֹ
  choice: 他的威荣
  rationale: הוֹד 可指威严、荣美或光荣；“威荣”兼具尊贵威严与灿烂荣美，适合赞美诗语域。
- source_word: עַל
  choice: 在……之上
  rationale: 保留原文既可表示空间上的高于、又可暗示尊荣超越的诗性张力。
- source_word: אֶרֶץ וְשָׁמַיִם
  choice: 大地和诸天
  rationale: 依照希伯来语次序翻译；“诸天”反映 שָׁמַיִם 的形式与诗歌语感，整体指受造界。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此以音译保留其专名性质；不以“主”这一头衔替换。“雅威”较贴近学界通常采用的重构读音。
- issue: “唯有”所修饰的对象
  choice: 唯有他的名崇高
  alternative: 唯有他崇高
  rationale: 原文明确以 שְׁמוֹ（他的名）为主语，并由 לְבַדּוֹ 加以限定；译文保留这一措辞，不将其神学性地简化为“唯有他”。
- issue: הוֹד 的语义范围
  choice: 威荣
  alternative: 荣美；荣耀；威严
  rationale: 该词兼有壮丽、尊荣和威严之意；正文选“威荣”，并以脚注保留其他合理译法，避免把词义限定于单一神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的赞美诗语体。“愿他们”承接全诗的劝勉语气；分号呈现两个理由陈述之间的诗行关系。
