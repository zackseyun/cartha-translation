  text: wild animals and all livestock, creeping things and winged birds,
translation:
  language: zh_hans
  text: 野兽和一切牲畜，爬行的动物和有翅膀的飞鸟，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחַיָּה
  choice: 野兽
  rationale: חַיָּה在这里与后面的בְּהֵמָה相对，指野生动物；“野兽”简洁自然，并保留野生与驯养动物的区别。
- source_word: וְכָל בְּהֵמָה
  choice: 和一切牲畜
  rationale: בְּהֵמָה在此指驯养的动物；“牲畜”符合现代汉语用法，“一切”对应כָּל。
- source_word: רֶמֶשׂ
  choice: 爬行的动物
  rationale: רֶמֶשׂ泛指爬行或在地面活动的小动物；此译法清楚易懂，又不把范围缩限为现代生物分类中的爬行动物。
- source_word: וְצִפּוֹר כָּנָף
  choice: 和有翅膀的飞鸟
  rationale: 该短语直译近于“有翅之鸟”；“有翅膀的飞鸟”保留翅膀的意象，也符合自然、庄重的现代汉语。
