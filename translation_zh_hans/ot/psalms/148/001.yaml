id: PSA.148.1
reference: Psalms 148:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַֽלְל֣וּ אֶת יְ֭הוָה מִן הַ/שָּׁמַ֑יִם הַֽ֝לְל֗וּ/הוּ בַּ/מְּרוֹמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/001.yaml
  text: Praise Yah! Praise Yahweh from the heavens[a]; praise him in the heights.
translation:
  language: zh_hans
  text: '你们要赞美雅！[a]

    你们要从天上赞美耶和华，

    要在高处赞美他！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们要赞美雅”对应希伯来语“哈利路亚”的字面意思；“雅”是神名的诗歌短式。
    reason: 说明熟悉的礼仪用语“哈利路亚”与源文短神名的关系，并保留本节两种神名形式的区别。
lexical_decisions:
- source_word: הַלְלוּ
  choice: 你们要赞美
  rationale: 这是הלל的皮勒式复数祈使语气，直接召唤众受造者赞美；加上“你们”自然体现复数对象。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的诗歌短式。音译为“雅”可保留它与下文完整神名יהוה的区别，也显明“哈利路亚”一语的字面构成。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式表达四字神名，并与短式“雅”相区别；不以普通称号代替源文专名。
- source_word: מִן הַשָּׁמַיִם
  choice: 从天上
  rationale: 保留介词מִן所表达的出发位置。שָׁמַיִם虽具复数形态，中文通常自然地说“天上”，无须机械译成“诸天”。
- source_word: הַלְלוּהוּ
  choice: 赞美他
  rationale: 保留动词所带的第三人称阳性单数宾语后缀，使其明确回指耶和华。
- source_word: בַּמְּרוֹמִים
  choice: 在高处
  rationale: מְרוֹמִים指高处或高天领域；“在高处”简洁地保留空间意象，又不把它限定解释为“最高的天”。
theological_decisions:
- issue: 同一节中יָהּ与יְהוָה两种神名形式的译法
  choice: 分别译作“雅”和“耶和华”
  alternative: 两者都译作“主”，或分别音译为“雅”和“雅威”
  rationale: 源文有意先用神名短式，再用完整四字神名。分别表达可保留这一诗歌与词汇差异；采用“耶和华”是兼顾中文通行度的译法，不据此裁定神名古代读音。
- issue: מִן所表示的是位置还是赞美者的来源范围
  choice: 保留为“从天上赞美”
  alternative: 译作“在天上赞美”
  rationale: “从”最直接对应מִן，同时中文仍可理解为呼召天上领域中的受造者发出赞美，不必将其改释为单纯的静态位置。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。三句重复“赞美”，再现希伯来诗句的召唤节奏；第二、三句分行以呈现平行结构。
