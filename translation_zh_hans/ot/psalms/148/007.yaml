source:
  edition: WLC
  text: הַֽלְל֣וּ אֶת יְ֭הוָה מִן הָ/אָ֑רֶץ תַּ֝נִּינִ֗ים וְ/כָל תְּהֹמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/007.yaml
  text: Praise Yahweh from the earth[b][a], sea creatures and all deeps.
translation:
  language: zh_hans
  text: 你们要从地上赞美雅威：海中巨兽[a]和一切深渊[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海中巨兽”也可译作“海怪”或“龙”。希伯来词תנינים可指巨大的蛇形生物或海中怪兽。
    reason: lexical_alternative
  - marker: b
    text: “深渊”指深处的大水或水域深处，也可译作“一切深水”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: 你们要……赞美
  rationale: 这是הלל的复数祈使式；用“你们要赞美”自然表达向众受造物发出的敬拜召唤。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，而不以“主”这一称号替代。
- source_word: מִן הָאָרֶץ
  choice: 从地上
  rationale: 本诗先呼召天上的受造物，随后转向地上的领域；“地上”清楚呈现这种宇宙空间的对照。
- source_word: תַּנִּינִים
  choice: 海中巨兽
  rationale: 该词可指巨大的、蛇形的或令人畏惧的生物；与“深渊”并列时带有海洋背景。“海中巨兽”既保留其不寻常和宏大的色彩，也避免把它过度限定为某一种动物。
- source_word: תְּהֹמוֹת
  choice: 深渊
  rationale: תהום的复数形式指深处的水域或大水深处；汉语虽不标复数，但“一切”保留了希伯来文的总体性与复数意味。
theological_decisions:
- issue: 如何译出神名יהוה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名；译作“雅威”保留其专名性质，不以称号替换。
- issue: תנינים是否应作神话化理解
  choice: 海中巨兽
  alternative: 海怪；龙；海中生物
  rationale: 原词容许怪兽或巨型海洋生物等理解；正文保留其宏大而不完全确定的形象，脚注列出主要词义可能，不把诗句强行解释为特定神话形象。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“你们要”明确复数祈使语气；冒号使后面的“海中巨兽和一切深渊”自然成为受召从地上赞美雅威的对象。感叹号传达诗篇赞美召唤的力度。
