  text: הַֽ֭לְלוּ/הוּ שֶׁ֣מֶשׁ וְ/יָרֵ֑חַ הַ֝לְל֗וּ/הוּ כָּל כּ֥וֹכְבֵי אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/003.yaml
  text: Praise him[a], sun and moon; praise him, all shining stars.
translation:
  language: zh_hans
  text: 太阳和月亮啊，要赞美他！一切发光的星辰啊，要赞美他！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: 要赞美他
  rationale: 复数祈使式并带第三人称阳性单数宾语后缀；译文保留“他”，也保留对天体直接发出的命令。加入“要”使现代汉语中的劝令语气自然明确。
- source_word: שֶׁמֶשׁ וְיָרֵחַ
  choice: 太阳和月亮
  rationale: 按通常词义直译，并保留连接关系。
- source_word: כָּל כּוֹכְבֵי אוֹר
  choice: 一切发光的星辰
  rationale: כָּל 表示全体；כּוֹכְבֵי אוֹר 字面为“光之星”，在此自然表达为“发光的星辰”，既传达结构含义，也避免现代汉语中生硬的“光之星”。
- source_word: כּוֹכְבֵי
  choice: 星辰
  rationale: “星辰”比“星星”更庄重，适合诗篇体裁，同时仍为普通现代读者所理解。
theological_decisions:
- issue: 受造天体被直接召唤赞美上帝
  choice: 保留对太阳、月亮和星辰的直接呼告与祈使语气
  alternative: 解释性地译为这些天体彰显或宣告上帝的荣耀
  rationale: 希伯来文以复数祈使式直接呼唤天体；保留拟人化表达，可呈现诗篇召唤整个受造界赞美上帝的诗性张力，而不将其改写为神学解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“啊”明确呼格，以感叹号呈现两次平行祈使的诗歌力度；两行内容合为一句经文，但保留对称结构。
