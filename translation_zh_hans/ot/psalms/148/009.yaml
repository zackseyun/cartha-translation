lexical_decisions:
- source_word: הֶהָרִים
  choice: 群山
  rationale: הָרִים意为“山”。中文诗歌列举中用“群山”自然地表达复数和整体范围，无须另译定冠词。
- source_word: וְכָל גְּבָעוֹת
  choice: 和所有丘陵
  rationale: גְּבָעוֹת指比山较低的高地；“丘陵”与“群山”形成清楚、自然的地貌对举。כָל译作“所有”，保留范围完整的含义。
- source_word: עֵץ פְּרִי
  choice: 果树
  rationale: 该结构字面为“果实之树”，此处以单数集合性地指一类树木；“果树”是现代汉语准确而简洁的对应。
- source_word: וְכָל אֲרָזִים
  choice: 和所有香柏树
  rationale: אֲרָזִים指香柏木或香柏树；在受造物的列举中译作“香柏树”最清楚，并保留כָל的全称范围。
