  yaml_path: translation/ot/psalms/148/006.yaml
  text: And he established them forever and ever; he gave a decree[a], and it will not pass away.
translation:
  language: zh_hans
  text: 他使它们永远坚立，直到永永远远；他定下法则[a]，这法则绝不废去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他定下法则，它们不越过这法则。”又或：“他定下法则，没有谁越过它。”希伯来文末句的主语和省略的宾语不明确。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידֵם
  choice: 他使它们长存
  rationale: עמד的使役形带第三人称阳性复数后缀，意为“使它们站立、确立它们”。结合受造界恒久稳定的语境，“使它们长存”在现代汉语中自然，并保留使役意义。
- source_word: לָעַד לְעוֹלָם
  choice: 永远
  rationale: 两个表示长久持续的短语连用以加强语气。汉语“永远长存”借助“长存”共同表达这种强调，避免生硬重复。
- source_word: חָק
  choice: 法则
  rationale: חָק可指律例、定例、界限或固定秩序。在创造语境中，“法则”既可表达上帝所定的规例，也能涵盖受造秩序。
- source_word: נָתַן
  choice: 定下
  rationale: נָתַן基本义为“给”，与חָק搭配时汉语自然表达为“定下法则”，比直译“给了法则”更符合现代汉语搭配。
- source_word: וְלֹא יַעֲבוֹר
  choice: 永不废去
  rationale: עבר可表示经过、越过或违犯；本句主语及省略成分有歧义。正文将单数动词理解为指前面的“法则”，表达其不会消逝或失效；其他可能解释收入脚注。
theological_decisions:
- issue: וְלֹא יַעֲבוֹר的主语和含义
  choice: 将前面的“法则”理解为主语：法则永不废去。
  alternative: 也可理解为“它们不越过这法则”，或以不定主语表达“没有谁能越过它”。
  rationale: 希伯来文动词为单数，宾语并未明说，因此句法上存在真实歧义。正文选择与单数的“法则”衔接，并突出上帝所定秩序的恒久性；脚注保留其他可行理解，不消除原文的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“永远长存”表达受造界被确立并持续存在；“定下法则”符合汉语习惯，同时保留创造秩序与规定界限的语义。脚注标记[a]已置于正文相关处。
