  yaml_path: translation/ot/psalms/148/012.yaml
  text: young men and young women[a], old men with boys[b].
translation:
  language: zh_hans
  text: 青年男子和年轻女子[a]，老年男子和男孩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“处女”。希伯来语可特指处女或未婚的年轻女子。
    reason: lexical_alternative
  - marker: b
    text: 或译“少年”。希伯来语所指的年轻男性，年龄范围可能比“男孩”更广。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרִים
  choice: 青年男子
  rationale: 指正值青春壮年的男性；“青年男子”自然、明确地保留了年龄和性别信息。
- source_word: וְגַם
  choice: 和
  rationale: 在紧凑的诗歌列举中，用普通并列连词即可自然表达附加关系，无须生硬译出“也”。
- source_word: בְּתוּלוֹת
  choice: 年轻女子
  rationale: 该词可特指处女或未婚女子，但本节主要按年龄和性别列举人群；正文采用现代、清楚的“年轻女子”，并在脚注保留更具体的词义。
- source_word: זְקֵנִים
  choice: 老年男子
  rationale: 在年龄与性别相对照的语境中，所指是年老的男性，而非担任职分的“长老”。
- source_word: עִם
  choice: 和
  rationale: 以简洁并列表达两组人共同参与赞美，符合现代汉语诗句的自然节奏。
- source_word: נְעָרִים
  choice: 男孩
  rationale: 此处与前面的成年青年男子形成年龄对照；“男孩”保留男性指向，较宽泛的年龄范围则在脚注说明。
theological_decisions: []
