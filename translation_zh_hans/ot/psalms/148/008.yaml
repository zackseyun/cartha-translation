lexical_decisions:
- source_word: אֵשׁ
  choice: 火
  rationale: 该词直接指火；在受造界赞美的列举中，“火”简洁自然。
- source_word: וּבָרָד
  choice: 与冰雹
  rationale: בָּרָד指冰雹，前缀连接词用“与”表达，并与诗行的并列结构协调。
- source_word: שֶׁלֶג
  choice: 雪
  rationale: 该词通常指雪，符合本节气象现象的语境。
- source_word: וְקִיטוֹר
  choice: 与云气
  rationale: קִיטוֹר可指烟、雾气或蒸气。“云气”在现代汉语诗体中较自然，也保留其宽泛的大气现象含义，不限定为燃烧产生的烟。
- source_word: רוּחַ סְעָרָה
  choice: 暴风
  rationale: 该词组指带有风暴性质的风；汉语“暴风”自然凝练，并兼顾רוּחַ与סְעָרָה的合成意义。
- source_word: עֹשָׂה
  choice: 成就
  rationale: 分词表达持续执行或实现的作用。此处“成就”比直译“做”更符合现代汉语，同时不过度限定执行方式。
- source_word: דְבָרוֹ
  choice: 他的话语
  rationale: דָּבָר基本义为“话、话语”，在语境中也可具有命令之意；正文保留“话语”，脚注说明功能性译法。
theological_decisions:
- issue: דְבָרוֹ中第三人称阳性单数后缀的所指
  choice: “他的话语”中的“他”指本诗呼召万物赞美的上帝
  alternative: 可按语境功能译为“他的命令”
  rationale: 全诗语境表明受造之物响应上帝的发言或命令；希伯来文本本身使用普通第三人称后缀，因此不另加尊称或解释性称谓。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。用两组“与”保持列举节奏；“暴风”作为分句主语，后接“成就他话语的”这一关系结构。保留句末逗号，以配合诗篇连续列举的上下文。
