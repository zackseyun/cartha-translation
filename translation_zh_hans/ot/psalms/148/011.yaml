  text: מַלְכֵי אֶ֭רֶץ וְ/כָל לְאֻמִּ֑ים שָׂ֝רִ֗ים וְ/כָל שֹׁ֥פְטֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/011.yaml
  text: kings of the earth and all peoples[a], princes and all judges of the earth[b],
translation:
  language: zh_hans
  text: 地上的君王和万族[a]，首领和地上所有的审判官[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万族”或译“万民”或“列国”。
    reason: lexical_alternative
  - marker: b
    text: “地上”若按较局部的意义理解，也可译作“这片土地上的”；但本诗广及全体受造界，较宜取普世意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי אֶרֶץ
  choice: 地上的君王
  rationale: מַלְכֵי 是“君王”的复数构造形式，与 אֶרֶץ 连用；译为“地上的君王”既贴近原文，又自然承接全诗对受造界的列举。
- source_word: וְכָל לְאֻמִּים
  choice: 和万族
  rationale: לְאֻמִּים 可指各民族、万民或列国；“万族”保留群体性的普世范围，并避免让现代民族国家的概念主导理解。כָל 以“万”表达其周全意义。
- source_word: שָׂרִים
  choice: 首领
  rationale: שָׂרִים 指居高位的领袖或官长，不必限定为王室血统；“首领”在现代汉语中庄重而宽泛。
- source_word: וְכָל שֹׁפְטֵי אָרֶץ
  choice: 和地上所有的审判官
  rationale: שֹׁפְטֵי 是 שׁפט 的复数构造形式，直指执行审判者；译作“审判官”比现代专门职衔色彩较强的“法官”更适合古代语境。第二处 אֶרֶץ 仍按全诗的普世范围译为“地上”。
theological_decisions:
- issue: אֶרֶץ 在赞美诗列举中的范围
  choice: 地上／地上的
  alternative: 本地／这片土地上的
  rationale: 诗篇148篇召唤天上、地上和各类受造者共同赞美，因此这里采用普世意义；不过原词本身也可指某一片土地，故以脚注保留该可能。
- issue: לְאֻמִּים 所指的人类群体
  choice: 万族
  alternative: 万民／列国
  rationale: “万族”呈现各人群共同受召的普遍性，同时不把该词收窄为现代政治国家；脚注保留其他自然译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌列举语体。“君王—万族—首领—审判官”保留原文两组并列结构；“首领”避免把 שָׂרִים 过度限定为有王室血统的“王子”。所有脚注标记均置于相应正文词语之后。
