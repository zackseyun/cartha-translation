source:
  edition: WLC
  text: יְֽ֭הַֽלְלוּ אֶת שֵׁ֣ם יְהוָ֑ה כִּ֤י ה֭וּא צִוָּ֣ה וְ/נִבְרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/005.yaml
  text: Let them praise the name of Yahweh[a], for he commanded, and they were created.
translation:
  language: zh_hans
  text: 愿它们赞美雅威[a]的名，因为他吩咐，它们便受造。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），上帝的四字神名；此处音译为“雅威”。传统中文圣经多译作“耶和华”。
    reason: 说明神名原文、正文所采用的音译及传统中文译名。
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: 愿它们赞美
  rationale: 此处是Piel未完成式第三人称阳性复数，在诗歌语境中带祈愿或劝召意味；“愿……赞美”自然保留了这一语气。
- source_word: אֶת שֵׁם
  choice: ……的名
  rationale: 保留“赞美……的名”这一圣经惯用表达，既指向上帝所启示的身份，也包含他的声誉与尊荣。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式表达四字神名，同时用脚注交代其希伯来文形式及另一常见音译。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述赞美呼召的原因，现代汉语中“因为”清楚自然。
- source_word: הוּא
  choice: 他
  rationale: 保留希伯来文显明的主语，不额外加入“亲自”等强化成分。
- source_word: צִוָּה
  choice: 一声令下
  rationale: 表达“发出命令”的动作，并以简洁有力的汉语诗性措辞呈现命令与受造之间的直接关系。
- source_word: וְנִבְרָאוּ
  choice: 它们就被造了
  rationale: 保留Nifal完成式的被动意义；“就”自然呈现命令发出后受造结果随即成立的关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中辨识度最高的专名“耶和华”，不以“主”这一称号替代；脚注说明原文及另一常见音译，以免把有争议的发音问题处理成毫无争议。
- issue: צִוָּה 与 וְנִבְרָאוּ 的关系
  choice: 他一声令下，它们就被造了
  alternative: 他命令，它们便受造
  rationale: 保留创造因上帝命令而成的因果和承接关系，同时不添加原文未明说的创造方式或中介。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿它们赞美”承接上下文对天体及受造物的呼召；代词“它们”与所指的非人受造物相合。句式简洁，保留诗歌的平行感和命令创造的力度。
