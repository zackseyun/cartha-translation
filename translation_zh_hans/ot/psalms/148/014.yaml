id: PSA.148.14
reference: Psalms 148:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּ֤רֶם קֶ֨רֶן לְ/עַמּ֡/וֹ תְּהִלָּ֤ה לְֽ/כָל חֲסִידָ֗י/ו לִ/בְנֵ֣י יִ֭שְׂרָאֵל עַֽם קְרֹב֗/וֹ הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/014.yaml
  text: And he has raised up a horn for his people[a], praise for all his faithful ones, for the sons of Israel, the people near to him[d][c][b]. Praise Yah!
translation:
  language: zh_hans
  text: 他为自己的子民高举了角[a]，成为他所有忠信之人的赞美[b]——就是以色列的子孙[c]、与他亲近的民。你们要赞美雅[d]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角”是希伯来诗歌中的比喻，可象征力量、尊荣或被高举的权势。
    reason: cultural_note
  - marker: b
    text: 原文句法十分压缩；也可译作：“为他所有忠信的人带来赞美。”
    reason: alternative_reading
  - marker: c
    text: 原文直译为“以色列的众子”，是指以色列的子孙或以色列人。
    reason: lexical_alternative
  - marker: d
    text: “赞美雅”表达了礼仪用语“哈利路亚”的意思；“雅”是此处所用神名短式יָהּ的音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: 高举了
  rationale: רום在此表示抬高、 exalt；用“高举了”保留完成性叙述及诗歌性的提升意象。
- source_word: קֶרֶן
  choice: 角
  rationale: 直译为“角”，在希伯来诗歌中象征力量、尊荣或被高举的权势；正文保留原有比喻，不直接释为“力量”。
- source_word: לְעַמּוֹ
  choice: 为自己的子民
  rationale: 表达属于上帝并与他有关系的群体；“子民”自然体现这里民族及盟约群体的语境。
- source_word: תְּהִלָּה
  choice: 赞誉
  rationale: 该词通常指赞美、称颂；此处若说忠信者“得享赞誉”，现代汉语较自然，同时没有完全改写为较宽泛的“荣耀”。其与前句的压缩句法另以脚注说明。
- source_word: לְכָל חֲסִידָיו
  choice: 他所有忠信的人
  rationale: חסידים指以忠诚、虔敬回应上帝的人；“忠信的人”兼顾盟约忠诚的含义，又避免“圣徒”可能带入的后期教会术语色彩。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 保留בנים的亲缘称谓及这一固定民族表达；中文“子孙”在此可自然指整个群体。
- source_word: עַם קְרֹבוֹ
  choice: 与他亲近的民
  rationale: 保留קָרוֹב所表达的关系性接近，不将其进一步解释为“蒙拣选”或“蒙爱”。
- source_word: הַלְלוּ יָהּ
  choice: 你们要赞美耶
  rationale: 将复数命令式明确译出，并用“耶”音译神名短式יָהּ，既传达原句意义，也区别于未翻译的礼仪用语“哈利路亚”。
theological_decisions:
- issue: “角”（קֶרֶן）的解释
  choice: 正文保留“角”的比喻
  alternative: 译作“力量”“权势”或“尊荣”
  rationale: 原文意象可涵盖力量、尊荣及被高举的权势；若只选其中一个抽象含义，会不必要地消除诗句的多义性。
- issue: תְּהִלָּה与前句的句法关系
  choice: 译为“使他所有忠信的人得享赞誉”，并以脚注保留另一分析
  alternative: 将其理解为同位语或结果：“这成为他所有忠信之人的赞美”
  rationale: 希伯来文表达高度压缩，既可理解为上帝高举其民的角，使忠信者得尊荣，也可理解为这行动成为他们赞美上帝的缘由；正文采用较通顺的结果性表达，但不把另一种理解排除。
- issue: בְנֵי יִשְׂרָאֵל的群体范围
  choice: 以色列的子孙
  alternative: 以色列的儿子们；以色列人
  rationale: “子孙”贴近原文亲缘表达，并在现代汉语中自然涵盖整个以色列群体，不把诗句限制为男性。
- issue: 神名短式יָהּ的译法
  choice: 耶
  alternative: 耶和华；哈利路亚
  rationale: 原文用的是神名短式，而非完整形式יהוה；正文以音译“耶”保存这一差别，并在脚注解释传统礼仪表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“高举了角”刻意保留希伯来意象；“得享赞誉”使压缩句法在中文中可读，同时借脚注保留同位语或赞美缘由的另一种理解。末句展开为明确的复数劝勉，保持赞美诗结尾的呼召语气。
