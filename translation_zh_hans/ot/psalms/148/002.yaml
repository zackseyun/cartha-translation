  text: הַֽלְל֥וּ/הוּ כָל מַלְאָכָ֑י/ו הַֽ֝לְל֗וּ/הוּ כָּל צבא/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/002.yaml
  text: Praise him[a], all his angels; praise him, all his hosts.
translation:
  language: zh_hans
  text: '他的众天使啊，你们都要赞美他！

    他的天军啊，你们都要赞美他！[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天军”也可译作“天上的万军”或“他的军队”。
    reason: 词义可指军队、万军或天上的群体；脚注保留原词的语义幅度。
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: 你们都要赞美他
  rationale: 复数祈使式带第三人称阳性单数后缀，表示向一群天上众生发出命令，要求他们赞美上帝；此译自然地体现复数对象和祈使语气。
- source_word: כָל
  choice: 众……都
  rationale: 希伯来语表达群体的全体；汉语用“众……都”既传达整体性，也适合诗歌中的呼召。
- source_word: מַלְאָכָיו
  choice: 他的众天使
  rationale: 在呼召天上万有赞美的语境中，מַלְאָכִים 指天上的使者，因此译作通行而明确的“天使”。
- source_word: צְבָאוֹ
  choice: 他的众天军
  rationale: צָבָא 可指军队、众军或成群的天上众生；与“天使”平行时，“众天军”保留其天上群体和军事意象，同时不过度限定所指。
theological_decisions:
- issue: “他”和“他的”所指
  choice: 指本诗所呼召万有赞美的耶和华
  alternative: 在本节中补出“耶和华”或“上帝”
  rationale: 第1节已确立赞美的对象，本节沿用代词即可保持希伯来诗歌的衔接；不在正文中增添原文没有的神名。
- issue: צְבָאוֹ 所指群体的范围
  choice: 保留为“众天军”
  alternative: “天上的万军”或“他的军队”
  rationale: 该词在此与天使平行，明显属于天上领域，但其范围可包括天使众军或更广的天上群体；正文保留这种张力，脚注说明可选理解。
translation_notes:
  register: 采用现代、庄重且便于朗读的诗体；两行保持平行结构，并以“啊”标示直接呼告，以“你们都要”明确复数祈使语气。
