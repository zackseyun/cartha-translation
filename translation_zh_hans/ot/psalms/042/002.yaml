  naturalness: 原句整体庄重通顺。将“我的心灵渴求神，渴求永活的神”调整为“我的心渴慕神，渴慕永活的神”，更凝练，也更符合中文诗歌和经文语体。“我何时能来朝见神呢？”自然明确。
