  text: צָמְאָ֬ה נַפְשִׁ֨/י לֵ/אלֹהִים֮ לְ/אֵ֪ל חָ֥י מָתַ֥י אָב֑וֹא וְ֝/אֵרָאֶ֗ה פְּנֵ֣י אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/002.yaml
  text: My soul thirsts for God[a], for the living God. When shall I come and appear before God?
translation:
  language: zh_hans
  text: 我的心渴慕神，渴慕永活的神。我何时能来朝见神[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“显现在神的面前”；“神的面”是其中的字面表达。
    reason: 说明וְאֵרָאֶה的Niphal语态及פְּנֵי אֱלֹהִים的字面形式，同时保留正文“朝见神”所表达的惯用意义。
lexical_decisions:
- source_word: צָמְאָה
  choice: 渴求
  rationale: 保留“口渴”的具体诗歌意象，同时在现代汉语中自然表达强烈而持续的向往。
- source_word: נַפְשִׁי
  choice: 我的心灵
  rationale: נפשׁ可指生命、自我或内在的人；“我的心灵”既保留希伯来诗歌的表达，也避免仅译作“我”而削弱其内在情感。
- source_word: לֵאלֹהִים
  choice: 神
  rationale: 介词ל在“渴求”的搭配中标明渴望的对象；汉语动词“渴求”可直接带宾语，无须另译介词。
- source_word: לְאֵל חָי
  choice: 永活的神
  rationale: אֵל חָי意为“活着的神”。“永活的神”在简体中文中庄重自然，并清楚表达神不是无生命的偶像，而是活着的神。
- source_word: מָתַי
  choice: 何时
  rationale: 直接保留询问时间的语气，不额外加入原文未明说的“还要多久”。
- source_word: אָבוֹא
  choice: 才能来
  rationale: 问句中的未完成式指向尚未实现的到来；“才能”自然表达诗人盼望获准前往的语气，但不把可能性解释得过重。
- source_word: וְאֵרָאֶה
  choice: 朝见
  rationale: 按马所拉元音，此词为ראה的Niphal形式，具有“出现、被看见”的意思；在敬拜和朝圣语境中，“朝见”自然涵盖来到神面前的含义。
- source_word: פְּנֵי אֱלֹהִים
  choice: 神
  rationale: 此短语字面为“神的面”，在这里与“朝见”合译为“朝见神”，表达进入神同在、前来敬拜的惯用意义；字面形式在脚注中保留。
theological_decisions:
- issue: פְּנֵי אֱלֹהִים的译法
  choice: 朝见神
  alternative: 看见神的面／显在神面前
  rationale: 原句表达诗人渴望进入神的同在，很可能涉及前往圣所敬拜。“朝见神”既符合汉语礼敬语境，也不武断断言肉眼看见神的本体；“神的面”这一字面表达用脚注保留。
- issue: וְאֵרָאֶה的语态与含义
  choice: 朝见
  alternative: 被看见／显现／看见
  rationale: WLC所载马所拉元音指向Niphal“出现、被看见”，而非主动式“看见”。“朝见”在中文中可自然表达来到尊者面前，保留朝圣语境，同时避免生硬的“被神看见”。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“渴求”保留口渴隐喻；“心灵”传达נפשׁ所指的内在自我；“朝见神”适合敬拜与朝圣语境。脚注标记紧接相关短语。
