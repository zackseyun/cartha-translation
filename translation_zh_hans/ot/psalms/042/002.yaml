revisions:
- from: 我的心灵渴求神，渴求永活的神。我何时才能来朝见神[a]？
  to: 我的心渴慕神，渴慕永活的神。我何时能来朝见神[a]呢？
  rationale: 修订以“渴慕”恢复原文“口渴”的具体隐喻，并保留两次“神”的重复和“永活的神”的称谓。末句维持“来朝见神”的自然敬拜语境表达；“能”是汉语未来疑问中自然的措辞，未断言额外教义含义。脚注改为准确区分“出现于神面前”的Niphal动词与“神的面”的字面名词短语，删除可能误导为主动“看见”的说法。
  reviewer_model: gpt-5.6-terra
