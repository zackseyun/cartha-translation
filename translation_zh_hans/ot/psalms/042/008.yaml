  text: יוֹמָ֤ם יְצַוֶּ֬ה יְהוָ֨ה חַסְדּ֗/וֹ וּ֭/בַ/לַּיְלָה שיר/ה עִמִּ֑/י תְּ֝פִלָּ֗ה לְ/אֵ֣ל חַיָּֽ/י׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/008.yaml
  text: By day Yahweh commands his steadfast love[b][a], and at night his song is with me— a prayer to the God of my life.
translation:
  language: zh_hans
  text: '白昼，雅威命他的慈爱临到我；

    黑夜，他的歌与我相伴[a]——

    向我生命之神的祷告。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一首献给他的歌与我相伴。”希伯来文שירה可按“他的歌”理解；也可不取后缀义而作此理解。
    reason: alternative_reading
  - marker: b
    text: 或译：“向赐我生命的神的祷告。”原文直译为“向我生命之神的祷告”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם
  choice: 白昼
  rationale: 作时间副词，与下句“黑夜”形成简洁鲜明的诗歌对仗。
- source_word: יְצַוֶּה
  choice: 命……临到
  rationale: 保留צוה“命令、吩咐”的主动形象；补出“临到”使汉语通顺，同时表达雅威差遣其慈爱伴随诗人的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不以称号替代原文中的专名。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: “慈爱”在汉语圣经语体中能兼顾怜爱、信实与持久忠诚；所属代词也与原文一致。
- source_word: וּבַלַּיְלָה
  choice: 黑夜
  rationale: 与“白昼”平行；分行已自然表达承接关系，无须机械译出连接词。
- source_word: שיר/ה
  choice: 他的歌
  rationale: 正文采用诗性后缀解作第三人称阳性单数的读法，与前句“他的慈爱”相呼应；原文字形也容许另一种理解，列入脚注。
- source_word: עִמִּי
  choice: 与我相伴
  rationale: 比直译“与我同在”更符合歌与人相随的现代汉语表达，同时保留陪伴、同在之意。
- source_word: תְּפִלָּה
  choice: 祷告
  rationale: 将其理解为对前句之歌的同位说明，即这歌也是诗人向神所献的祷告。
- source_word: לְאֵל
  choice: 向……神献上的
  rationale: לְ表示祷告所指向的对象；“献上的”使汉语句法完整而不改变方向关系。
- source_word: חַיָּי
  choice: 我生命之
  rationale: 保留原文第一人称所属结构“我的生命”，不与本诗邻近处的“永生神”混同，也不在正文中直接释作“赐我生命”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，而非“主”的称号；音译“雅威”保留这一分别。
- issue: לְאֵל חַיָּי 中 חַיָּי 的意义
  choice: 向我生命之神献上的祷告
  alternative: 向赐我生命的神献上的祷告；向永生神献上的祷告
  rationale: חַיָּי 是带第一人称单数后缀的“生命”，字面为“我的生命”，并非修饰神的形容词“永生的”。正文保留属格表达，脚注说明较具解释性的译法。
- issue: שירה 的形态与指向
  choice: 他的歌
  alternative: 一首献给他的歌
  rationale: 正文按诗性第三人称阳性单数后缀理解，使“他的歌”与“他的慈爱”平行；但辅音形式可有另一分析，因此不排除“献给他的歌”。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言；以“白昼／黑夜”形成对仗。“我生命之神”刻意保留原文略显凝练的属格张力，并由脚注提供自然的解释性译法。所有脚注标记均置于相关正文之后。
