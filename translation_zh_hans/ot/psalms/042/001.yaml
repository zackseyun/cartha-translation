id: PSA.42.1
reference: Psalms 42:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כְּ/אַיָּ֗ל תַּעֲרֹ֥ג עַל אֲפִֽיקֵי מָ֑יִם כֵּ֤ן נַפְשִׁ֨/י תַעֲרֹ֖ג אֵלֶ֣י/ךָ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/001.yaml
  text: As a deer longs for streams of water[a], so my soul longs for you[c][b], O God.
translation:
  language: zh_hans
  text: 如鹿渴慕溪水[a]，我的心[b]也照样渴慕你，上帝啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪水”也可译作“水道”或“流水的沟渠”；原文为复数。
    reason: lexical_alternative
  - marker: b
    text: “我的心”原文也可理解为“我的生命”“我整个人”或“我的灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/אַיָּל
  choice: 如鹿
  rationale: אַיָּל可指鹿，尤其可指雄鹿；“鹿”在现代汉语中自然易懂，也保留了原文未必需要明说性别的空间。כְּ译作“如”，简洁地引出诗歌比喻。
- source_word: תַּעֲרֹג
  choice: 渴慕
  rationale: ערג表达强烈向往，在水的意象中又带有干渴般的迫切感。“渴慕”兼顾身体干渴与内心切望，且适合诗体。
- source_word: עַל
  choice: （融入“渴慕溪水”）
  rationale: 此处介词与ערג连用，表示所向往的对象；现代汉语“渴慕”可直接带宾语，无须另译介词。
- source_word: אֲפִיקֵי מָיִם
  choice: 溪水
  rationale: 该词组可指水道、水沟或其中流动的水。“溪水”自然凝练，并保留可供鹿饮用的流水意象；其他可能性在脚注说明。
- source_word: כֵּן
  choice: 也照样
  rationale: 明确连接比喻的前后两部分，符合现代汉语表达，并保留原文的对应结构。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נֶפֶשׁ可指生命、自我、内在的人，也可按传统译作“灵魂”。此处“我的心”自然表达诗人的整个内在自我在切望上帝，同时不强加严格的身心二分；语义范围以脚注保留。
- source_word: אֵלֶיךָ
  choice: 渴慕你
  rationale: 原文介词表示朝向“你”。汉语用“渴慕你”自然呈现切望的对象和关系方向。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 原文构成直接呼告；句末“上帝啊”清楚保留祷告式称呼和诗歌语气。
theological_decisions:
- issue: נַפְשִׁי的人论含义
  choice: 我的心
  alternative: 我的灵魂／我的生命／我整个人
  rationale: 原词不必专指与身体分离的“灵魂”，常可涵盖生命、自我或内在的人。“我的心”在现代汉语诗歌与祷告语境中自然，但以脚注明确其更宽广的语义，避免将特定的人论体系带入译文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“如……也照样……”保留希伯来诗句的明喻结构；“渴慕”重复出现，呼应原文同一动词的重复并增强诗歌节奏。
