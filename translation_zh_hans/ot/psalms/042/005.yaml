source:
  edition: WLC
  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וַ/תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֥וֹד אוֹדֶ֗/נּוּ יְשׁוּע֥וֹת פָּנָֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.
translation:
  language: zh_hans
  text: 我的心哪，你为什么低沉？为什么在我里面躁动不安？要仰望神，因为我还要赞美他——拯救从他面前而来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他面容的种种拯救”。希伯来语的“面”常可指一个人的临在，因此也可理解为“从他的临在而来的帮助”。
    reason: 说明希伯来语结构、复数形式及“面”的习语含义。
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: 低沉
  rationale: 该词本义为俯下、沉下；在诗人的自我劝诫中描写内心消沉。“低沉”既保留向下的意象，也符合现代汉语表达。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: 这里是诗人对自己的内在生命说话。现代汉语诗歌和祷告语体中，“我的心”比“我的灵魂”更自然，也不额外引入身心二分的观念。
- source_word: וַתֶּהֱמִי
  choice: 躁动不安
  rationale: 此动词可表示喧腾、翻腾或骚动；在这里指内心的扰攘。“躁动不安”传达其动态和情绪强度。
- source_word: עָלָי
  choice: 在我里面
  rationale: 介词字面可作“在我之上”，但在此内省语境中指搅扰临到并充满诗人；汉语用“在我里面”表达最自然。
- source_word: הוֹחִילִי
  choice: 要仰望
  rationale: 该命令式兼有等候、盼望和信靠之意。“仰望”在现代中文中能简洁表达面向神、怀着期待等候。
- source_word: אוֹדֶנּוּ
  choice: 我还要赞美他
  rationale: ידה的使役词干在诗篇敬拜语境中常指称谢或赞美；“赞美”贴合此处，并保留坚定面向未来的语气。
- source_word: יְשׁוּעוֹת פָּנָיו
  choice: 拯救从他面前而来
  rationale: 原文为复数“拯救”与“他的面”的组合，关系简练而有歧义。译文以“面前”保留“面”的意象及临在含义，并自然表达拯救由神而来；字面结构另见脚注。
theological_decisions:
- issue: 末句 יְשׁוּעוֹת פָּנָיו 的理解
  choice: 拯救从他面前而来
  alternative: 他的面所带来的拯救／他脸面的帮助
  rationale: 马所拉文本在本节写作“他的面”，并没有“我的面容和我的神”。这里可理解为拯救出自神的面或临在。主文保留神亲自临在并施行拯救的含义，同时用脚注说明原文异乎汉语习惯的复数和“面”意象，不把它过度解释成某一固定神学公式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我的心哪”保留诗人对内在自我的直接呼告；破折号呈现末句与“他”的解释性联系。依据所给WLC文本保留“他的面”，不采用其他相似叠句中的“我的面容和我的神”。
