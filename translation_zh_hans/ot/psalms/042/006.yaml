  yaml_path: translation/ot/psalms/042/006.yaml
  text: My God[a], my soul is cast down within me; therefore I remember you from the land of the Jordan and the Hermons[d][c][b], from Mount Mizar.
translation:
  language: zh_hans
  text: 我的上帝啊，我心里沮丧；因此，我从约旦之地和黑门群峰[a]，从米萨山[c]想念你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “黑门群峰”原文为复数，也可能指黑门山脉；另可译作“黑门山”。
    reason: lexical_alternative
  - marker: b
    text: “想念你”也可译作“我要想念你”。原文动词在这里既可表达当下的决意或持续行动，也可指将来的行动。
    reason: lexical_alternative
  - marker: c
    text: “米萨山”可能是地名；也可译作“小山”或“米萨丘”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: 我的上帝啊
  rationale: 该词由“上帝”加第一人称单数后缀构成，意为“我的上帝”。上下文可自然理解为直接呼唤；中文用“啊”表达呼格语气，不额外增加内容。
- source_word: עָלַי נַפְשִׁי תִשְׁתּוֹחָח
  choice: 我心里沮丧
  rationale: נפשׁ在此指人的内在生命或自我，שׁוחח描写低伏、消沉的状态。译作“我心里沮丧”符合现代汉语习惯，并保留哀歌的低沉语气。
- source_word: עַל־כֵּן
  choice: 因此
  rationale: 明确保留前一状态与随后想念上帝之间的因果或推论关系。
- source_word: אֶזְכָּרְךָ
  choice: 想念你
  rationale: זכר在此是把对方记在心中、思念的意思；未完成式既可描述当下行为或决意，也可带将来意味。正文采用自然的现在时表达，另一可能见脚注。
- source_word: מֵאֶרֶץ יַרְדֵּן
  choice: 从约旦之地
  rationale: 保留“约旦之地”的地理表达，所指可能是约旦河一带，而不只是河流本身。
- source_word: וְחֶרְמוֹנִים
  choice: 从黑门群峰
  rationale: 原文是复数形式，可能指黑门山脉或其中诸峰。“群峰”在中文中既自然，也保留复数地貌含义。
- source_word: מֵהַר מִצְעָר
  choice: 从米萨山
  rationale: 把מִצְעָר视为地名，与前面的地理名称平行；该词也可能具有“小”的普通名词意义，另见脚注。
