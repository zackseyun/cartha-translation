  text: לַ/מְנַצֵּ֗חַ מַשְׂכִּ֥יל לִ/בְנֵי קֹֽרַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/000.yaml
  text: For the choirmaster[a]. A Maskil[b] of the sons of Korah[c].
translation:
  language: zh_hans
  text: 交给乐长[a]。一首玛斯基勒诗[b]，属可拉子孙[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为乐长”。诗篇题记中的希伯来文前置词既可理解为交付对象，也可表示用途或归属。
    reason: alternative_reading
  - marker: b
    text: “玛斯基勒”是诗篇题记中的专门术语，确切含义不明；有人理解为“默想诗”“训诲诗”或“技巧诗”。
    reason: lexical_alternative
  - marker: c
    text: 或译“给可拉子孙”。这项题记可能表示作者、所属群体、相关传统或指定的演唱者。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题记中通常指负责音乐或礼仪演奏的主管。“乐长”简洁庄重；前置词 ל 译为“交给”，表达题记中可能的交付或指定关系，同时在脚注保留其他可能。
- source_word: מַשְׂכִּיל
  choice: 玛斯基勒诗
  rationale: 这是诗篇题记中的专门术语，确切含义不明。采用音译，避免把有争议的含义直接确定为“训诲诗”“默想诗”或“技巧诗”。
- source_word: לִבְנֵי קֹרַח
  choice: 属可拉子孙
  rationale: 前置词 ל 可表达作者、归属、关联或演唱安排。“属”在中文题记中简洁自然，也能较宽泛地保留这种关系；具体歧义在脚注说明。
- source_word: קֹרַח
  choice: 可拉
  rationale: 采用现代中文圣经语境中通行的人名译法。
theological_decisions:
- issue: 题记所指的作者或礼仪归属
  choice: 用“属可拉子孙”保留宽泛关联
  alternative: “可拉子孙所作”或“交给可拉子孙”
  rationale: 希伯来文的 לִבְנֵי 并未明确限定为作者身份或演唱安排，不宜在正文中消除这种歧义。
translation_notes:
  register: 采用简洁、庄重的诗篇题记体。“乐长”比“音乐主管”更凝练；对含义未定的体裁术语采用音译，并借脚注帮助普通读者理解。正文中的[a]、[b]、[c]分别紧随其所说明的词语。
