  yaml_path: translation/ot/psalms/042/010.yaml
  text: As with a shattering in my bones[a], my adversaries taunt me, saying to me all day long, “Where is your God?”
translation:
  language: zh_hans
  text: 仇敌辱骂我，仿佛我的骨头被击碎[a]；他们终日对我说：“你的上帝在哪里？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛我的骨头中有致命的创伤，仇敌辱骂我。”这里的希伯来语意象较难确定，可能指致命的伤害，也可能指深入骨髓、如被击碎般的剧痛。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֶצַח בְּעַצְמוֹתַי
  choice: 如同击碎我的骨头
  rationale: רֶצַח通常指杀戮或致命伤害，但与“我的骨头”连用时，构成含义艰深的诗歌意象，表达深入骨髓的毁灭性痛苦。“如同击碎我的骨头”在现代汉语中自然，并保留原文的猛烈力度；脚注同时保留较字面的理解。
- source_word: חֵרְפוּנִי
  choice: 辱骂我
  rationale: חרף表示以言语羞辱、讥讽或责难；下文直接引述敌人的挑衅，因此“辱骂”既清楚又符合语境。
- source_word: צוֹרְרָי
  choice: 仇敌
  rationale: 该词指敌对、压迫诗人的人；“仇敌”简洁庄重，适合诗篇语体。
- source_word: בְּאָמְרָם אֵלַי כָּל הַיּוֹם
  choice: 他们终日对我说
  rationale: 保留说话的方向和持续、反复发生的时间意味，同时采用自然的现代汉语语序。
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: 你的上帝在哪里？
  rationale: 直译敌人的挑战，不添加“究竟”等解释性成分，以保留其简短而尖锐的讥讽。
theological_decisions:
- issue: 敌人质问上帝在哪里
  choice: 你的上帝在哪里？
  alternative: 你的上帝究竟在哪里？
  rationale: 不解释上帝为何似乎缺席，也不预先回应敌人的挑战，从而保留哀歌中的神学张力。
- issue: 开头痛苦意象的性质
  choice: 如同击碎我的骨头
  alternative: 我的骨头中仿佛有杀戮
  rationale: 原文意象艰深，可能涉及杀戮、致命创伤或骨头被压碎般的痛楚。正文采用汉语中可理解的强烈身体意象，脚注明确保留另一种较字面的可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“终日”保持简洁的经诗语感；引语直接、尖锐。正文与脚注共同保存希伯来语开头意象的歧义。
