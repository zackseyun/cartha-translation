  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וּֽ/מַה תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֣וֹד אוֹדֶ֑/נּוּ יְשׁוּעֹ֥ת פָּ֝נַ֗/י וֵֽ/אלֹהָֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/011.yaml
  text: Why are you cast down[a], my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: zh_hans
  text: 我的心哪，你为什么沮丧？为什么在我里面躁动？你要等候上帝，因为我还要赞美他——他是使我抬起头来的拯救，也是我的上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“我面容的拯救”；也可理解为“使我昂首的帮助”。
    reason: 保留 יְשׁוּעוֹת פָּנַי 的字面意象及其可能的惯用含义。
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: 低沉
  rationale: 原词描写俯伏、下沉的状态；用于对内心的自问时，“低沉”既保留向下的意象，也符合现代汉语表达。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: 此处是诗人对内在自我的称呼。“我的心”在现代汉语诗体中自然，也保留自我劝勉的内省意味。
- source_word: תֶּהֱמִי
  choice: 躁动
  rationale: 原词可指喧腾、翻涌或不安；“躁动”能传达内在强烈的不安，又不把声音意象过度具体化。
- source_word: עָלָי
  choice: 在我里面
  rationale: 字面为“在我之上”，但在此惯用结构中表示搅扰着说话者的内在状态；译作“在我里面”较为自然。
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: 要等候上帝
  rationale: 该动词兼有怀着盼望而等待的含义；“等候上帝”保留等待的维度，并由上下文体现信靠和盼望。
- source_word: עוֹד אוֹדֶנּוּ
  choice: 我还要赞美他
  rationale: “还要”表达目前虽处困境，将来仍必赞美的信心；“赞美”符合诗篇敬拜语境。
- source_word: יְשׁוּעוֹת פָּנַי
  choice: 使我面容振作的拯救
  rationale: 原文是紧凑而不寻常的“我面容的拯救”。正文以自然汉语表达这拯救使低沉的面容重新振作，同时用脚注保留字面结构和其他可能理解。
- source_word: וֵאלֹהָי
  choice: 是我的上帝
  rationale: 在汉语中补出系词，使“我的上帝”与前面的称谓形成自然、庄重的并列。
theological_decisions:
- issue: יְשׁוּעוֹת פָּנַי 的理解
  choice: 他是使我面容振作的拯救
  alternative: 他是我面容的拯救／他是使我昂首的帮助
  rationale: 希伯来语短语含义密集，可能指上帝的拯救使诗人低垂的面容重新振作。正文避免生硬直译，却不把“拯救”弱化为单纯的“帮助”；脚注保留字面形式，以承认其诗意张力和解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以“我的心哪”呈现自我呼告，以两个短问句保留原文的平行结构；末句维持“拯救”与“我的上帝”的递进称谓。
