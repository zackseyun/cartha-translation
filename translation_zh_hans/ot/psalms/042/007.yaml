  yaml_path: translation/ot/psalms/042/007.yaml
  text: Deep calls to deep at the sound of your waterfalls[b][a]; all your breakers and your waves have passed over me.
translation:
  language: zh_hans
  text: '深渊向深渊呼唤，在你瀑布的轰鸣声中；

    你的巨浪和波涛，全都漫过了我。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהוֹם אֶל תְּהוֹם
  choice: 深渊……向深渊
  rationale: תְּהוֹם指深水、深处或深渊。“深渊”保留原文重复结构及宏阔、令人不安的水域意象，又不把它限定为特定宇宙论概念。
- source_word: קוֹרֵא
  choice: 呼唤
  rationale: 分词在诗歌中呈现鲜明、持续的动作。“呼唤”直接保留一个深渊向另一个深渊发声的拟人意象。
- source_word: לְקוֹל
  choice: 随着……的轰鸣
  rationale: לְקוֹל可表达伴随声音、因声音而起或响应声音的关系。“随着”保留关系上的一定开放性；“轰鸣”则按急流语境自然表达קוֹל的声音感。
- source_word: צִנּוֹרֶיךָ
  choice: 你的瀑布
  rationale: צִנּוֹר可指水道、导水设施或奔涌而下的水流。结合上下文压倒性的洪水意象，“瀑布”最符合现代汉语表达，并传达其声势；其词义余地以脚注说明。
- source_word: כָּל מִשְׁבָּרֶיךָ
  choice: 你的巨浪……全都
  rationale: מִשְׁבָּר是破碎翻卷的浪涛。“巨浪”在现代汉语中自然传达冲击力；将כָּל译作“全都”，保留原文无一遗漏的强调。
- source_word: וְגַלֶּיךָ
  choice: 和波涛
  rationale: גַּל通常指波浪。“波涛”与“巨浪”构成自然的诗歌并列，同时避免过度区分两个近义水浪词。
- source_word: עָלַי עָבָרוּ
  choice: 漫过了我
  rationale: עָבַר与עַל连用，在此描绘水从诗人身上越过。“漫过了我”既保留完成动作，也自然呈现被水淹没、压倒的体验。
theological_decisions:
- issue: 第二人称所属形式所表达的神圣主权
  choice: 保留“你的巨浪和波涛”
  alternative: 省略所属关系，译作泛指的巨浪和波涛
  rationale: 原文三次使用第二人称单数所属形式，把这些压倒诗人的水势称为“你的”。译文保留这一张力，不替诗人解释上帝与苦难之间的关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“深渊……深渊”的重复、第二人称所属形式和水势压顶的诗歌张力。脚注标记[a]已置于正文对应词后。
