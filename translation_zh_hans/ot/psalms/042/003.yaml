  text: הָֽיְתָה לִּ֬/י דִמְעָתִ֣/י לֶ֭חֶם יוֹמָ֣ם וָ/לָ֑יְלָה בֶּ/אֱמֹ֥ר אֵלַ֥/י כָּל הַ֝/יּ֗וֹם אַיֵּ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/003.yaml
  text: My tears have been my bread day and night[a], while they say to me all day long, “Where is your God?”
translation:
  language: zh_hans
  text: 我的眼泪昼夜成了我的食物[a]；人终日对我说：“你的上帝在哪里？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“眼泪”在形式上是单数，但可作集合名词理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה לִּי
  choice: 成了我的
  rationale: “היה + ל”表示某物对说话者成为或充当什么；“成了我的”自然保留这种结果和状态含义。
- source_word: דִמְעָתִי
  choice: 我的眼泪
  rationale: 原文形式为单数，但可作集合用法；现代汉语用“眼泪”自然表达持续流泪的哀歌情境。
- source_word: לֶחֶם
  choice: 食物
  rationale: 希伯来语字面为“饼”，也常泛指食物。汉语若说“眼泪成了我的饼”较生硬；“食物”保留以泪为食的鲜明隐喻，同时更自然易懂。
- source_word: יוֹמָם וָלָיְלָה
  choice: 昼夜
  rationale: 这是表示持续不断的昼夜并举；“昼夜”简洁、庄重，并保留原文节奏。
- source_word: בֶּאֱמֹר אֵלַי
  choice: 人……对我说
  rationale: 介词 בְּ 加不定式表示同时发生的动作；原文未明说主语，希伯来语结构可隐含泛指或上下文中的人，因此用“人”避免擅自限定具体群体。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 表示整天反复或持续发生；“终日”自然凝练，符合诗歌语体。
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: 你的上帝在哪里？
  rationale: 保留直接问句及其嘲讽力度，不把上帝表面上的缺席进一步解释为别的意思。
theological_decisions:
- issue: 嘲讽者问题的性质
  choice: 直译为“你的上帝在哪里？”
  alternative: 解释性译作“你的上帝怎么了？”或“你的上帝为何不救你？”
  rationale: 原文直接询问上帝“在哪里”，形成上帝似乎缺席的神学张力；译文不替原文消解或扩展这一含义。
- issue: 嘲讽者的身份与数目
  choice: 用泛指的“人”
  alternative: 译作“他们”或明确为“仇敌”
  rationale: 本节希伯来文的 בֶּאֱמֹר 是不定式结构，本身不明说复数主语；上下文可使人理解为嘲讽者，但本节不宜擅自明确其身份或数目。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“昼夜”“终日”保持凝练节奏；保留直接的反问和上帝似乎缺席的张力。脚注标记已在正文中出现。
