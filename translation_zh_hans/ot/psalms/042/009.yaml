  text: אוֹמְרָ֤ה לְ/אֵ֥ל סַלְעִ/י֮ לָ/מָ֪ה שְׁכַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֵלֵ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/009.yaml
  text: I say to God[a], my rock, “Why have you forgotten me? Why do I go about mourning under the oppression of the enemy?”
translation:
  language: zh_hans
  text: 我要对上帝——我的磐石——说：“你为什么忘记我？我为什么因仇敌的压迫而哀伤度日[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我为什么在仇敌的压迫下愁苦地行走？”
    reason: קֹדֵר可表示阴沉、愁苦或哀悼；הלך可直译为“行走”；בְּ可表示所处的境况。此译法较形式对应地保留原文意象，并呈现介词短语的处境性理解。
lexical_decisions:
- source_word: אוֹמְרָה
  choice: 我要……说
  rationale: 该词为אמר的第一人称单数祈愿式，可表达决意“我要说”，也可指当下发言。这里用“我要……说”，既保留祈愿式的意向色彩，又自然引出直接引语。
- source_word: לְאֵל
  choice: 对上帝
  rationale: אֵל在此是对神的通称，而非专名；“对上帝说”符合现代汉语表达。
- source_word: סַלְעִי
  choice: 我的磐石
  rationale: 保留“岩石、磐石”的原有比喻，表达稳固和庇护，不将其解释性改写为“我的避难所”。
- source_word: שְׁכַחְתָּנִי
  choice: 你为什么忘记我
  rationale: 按完成式第二人称阳性单数及第一人称宾语直译其哀诉；不扩大为“离弃我”，以免超出词义。
- source_word: קֹדֵר אֵלֵךְ
  choice: 哀伤度日
  rationale: קֹדֵר可指阴沉、忧郁或哀悼，אֵלֵךְ意为行走、度过；“哀伤度日”自然表达持续生活在悲痛中的状态。
- source_word: בְּלַחַץ אוֹיֵב
  choice: 因仇敌的压迫
  rationale: לַחַץ表示压迫或逼迫，介词בְּ可表示处境或原因；正文采用因果表达，同时在脚注保留“在……压迫下”的处境性理解。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 原文为无冠词单数，在诗歌中可作泛指或集合性用法；汉语“仇敌”无需强行标明单复数。
theological_decisions:
- issue: 神的比喻性称号סַלְעִי
  choice: 我的磐石
  alternative: 我的岩石；我的避难所
  rationale: 保留原文具体而传统的神学意象，不把比喻化约为解释性的功能称谓。
- issue: 对神忘记诗人的哀诉
  choice: 你为什么忘记我？
  alternative: 你为什么离弃我？；你怎么好像忘记了我？
  rationale: 忠实保留诗人直接质问所形成的神学张力；不强化为“离弃”，也不以“好像”缓和原文。
translation_notes:
  register: 采用现代、庄重且易懂的诗体汉语。“上帝——我的磐石——”以破折号保留同位称呼和停顿；“哀伤度日”避免生硬直译，同时脚注交代“满面愁容地行走”的词汇可能性。
