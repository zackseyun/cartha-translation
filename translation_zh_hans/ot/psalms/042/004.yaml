  text: אֵ֤לֶּה אֶזְכְּרָ֨ה וְ/אֶשְׁפְּכָ֬ה עָלַ֨/י נַפְשִׁ֗/י כִּ֤י אֶֽעֱבֹ֨ר בַּ/סָּךְ֮ אֶדַּדֵּ֗/ם עַד בֵּ֥ית אֱלֹ֫הִ֥ים בְּ/קוֹל רִנָּ֥ה וְ/תוֹדָ֗ה הָמ֥וֹן חוֹגֵֽג׀׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/004.yaml
  text: 'These things I remember[a], and I pour out my soul within me: how I used to pass along with the throng, leading them to the house of God with the sound of joyful shouting and thanksgiving[b], a festal multitude.'
translation:
  language: zh_hans
  text: 我想起这些事，就倾吐心中的愁苦：从前我怎样与人群[a]同行，带领他们[b]到上帝的殿去；伴着欢呼和称谢的声音，那是一大群欢庆守节的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人群”或译“在节庆队伍中”。希伯来语 בַּסָּךְ 含义难定，可能指聚集守节的人群，也可能指行进的队伍。
    reason: lexical_alternative
  - marker: b
    text: “带领他们”或译“引导他们”或“与他们同行”。希伯来语 אֶדַּדֵּם 是罕见词，确切含义不明，但上下文清楚描写诗人与众人一同前往上帝的殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֶזְכְּרָה
  choice: 我想起这些事
  rationale: 保留复数指示词“这些事”，并按诗人当下追忆的语境，将未完成式译为自然的现在反思表达。
- source_word: וְאֶשְׁפְּכָה עָלַי נַפְשִׁי
  choice: 就倾倒我里面的心
  rationale: 保留“倾倒”这一强烈意象；נפשׁ在此指内在生命与情感。“心”比直译“灵魂”更符合现代汉语哀歌语境，而“我里面”传达עָלַי在此习语中的内在指向。
- source_word: כִּי אֶעֱבֹר
  choice: 从前我怎样……同行
  rationale: כִּי引出回忆的内容，译作“怎样”；未完成式在追忆语境中表达过去惯常发生的行动。
- source_word: בַּסָּךְ
  choice: 与人群同行
  rationale: 该罕见名词含义不确定；结合赴上帝之殿和节庆队伍的语境，正文采用“人群”，不把它武断限定为某种具体设施。
- source_word: אֶדַּדֵּם
  choice: 带领他们
  rationale: 该罕见动词带第三人称复数宾语后缀，可能表示带领、引导或与他们同行；正文采用语法和行进图景都较通顺的“带领他们”，并以脚注保留不确定性。
- source_word: עַד בֵּית אֱלֹהִים
  choice: 到上帝的殿去
  rationale: עַד在朝圣行进语境中表示终点；“殿”自然传达“上帝的家”在此所指的敬拜场所。
- source_word: בְּקוֹל רִנָּה וְתוֹדָה
  choice: 欢呼和感谢的声音四起
  rationale: 保留קוֹל的可听见性、רִנָּה的高声欢呼及תוֹדָה的感谢／称谢意义，并使中文节奏自然。
- source_word: הָמוֹן חוֹגֵג
  choice: 众人欢庆节期
  rationale: הָמוֹן指众多的人，חוֹגֵג含守节、庆祝节期之意；译文保留其群体性和礼仪节庆背景。
