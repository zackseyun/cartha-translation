  yaml_path: translation/ot/psalms/087/001.yaml
  text: A psalm of the sons of Korah[a]; a song[c][b]. His foundation is in the holy mountains.
translation:
  language: zh_hans
  text: '可拉后裔的诗，一首歌。[a]

    其根基在圣山之中。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可拉后裔的”也可译作“交给可拉后裔的”，表示与他们有关，不一定表示由他们直接创作。
    reason: lexical_alternative
  - marker: b
    text: “其根基”也可译作“他的根基”或“它的根基”；这里的希伯来语代词所指没有明说，可能暗指锡安或耶路撒冷。
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: 可拉子孙的
  rationale: 前缀 לְ 在诗篇标题中可表示归属、关联或作者 attribution；“可拉子孙的”简洁自然，同时不把关系限定为直接创作。
- source_word: מִזְמוֹר
  choice: 诗篇
  rationale: 这是《诗篇》中表示配乐诗歌体裁的标准术语；“诗篇”是现代汉语圣经语体中准确而通行的对应词。
- source_word: שִׁיר
  choice: 一首歌
  rationale: 直译 שִׁיר，并保留原文“诗篇／歌”两个并列的体裁名称，不将二者合并。
- source_word: יְסוּדָתוֹ
  choice: 他的根基
  rationale: 该词由“根基”加第三人称阳性单数后缀构成；“他的根基”保留形式上的阳性指代及其未明说先行词的诗性含混。
- source_word: בְּהַרְרֵי
  choice: 在……山之中
  rationale: 介词 בְ 可表示“在、于”；复数构造形式 הַרְרֵי 表示“群山／诸山”。“在圣山之中”既贴近原文，也避免过度限定为“山上”。
- source_word: קֹדֶשׁ
  choice: 圣
  rationale: קֹדֶשׁ 在此以属格结构修饰群山，意为分别为圣；“圣山”自然、庄重且符合现代汉语表达。
theological_decisions:
- issue: יְסוּדָתוֹ 中代词后缀的所指
  choice: 正文译作“他的根基”，不明说先行词
  alternative: 译作“它的根基”，将锡安／耶路撒冷视为隐含所指；或意译为“他把它建立在圣山上”
  rationale: 希伯来文只有第三人称阳性单数后缀，本节并未明确指出先行词。正文保留这一含混，不预先断定所指是上帝还是锡安／城，也不把名词结构改写成动作句。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。标题用分号连接“诗篇”和“歌”两个体裁称谓；正文保留简短凝练的诗行，并以脚注说明归属关系和代词所指的真实歧义。
