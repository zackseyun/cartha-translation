  text: וְ/שָׁרִ֥ים כְּ/חֹלְלִ֑ים כָּֽל מַעְיָנַ֥/י בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/007.yaml
  text: Singers and dancers alike say[b][a], “All my springs are in you.”
translation:
  language: zh_hans
  text: '歌唱者和舞者[a]都说：


    “我的一切泉源都在你里面。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “舞者”或译“吹笛者”。这个希伯来词传统上多被理解为跳舞或旋转的人，也有人认为它指演奏管乐的人。
    reason: lexical_alternative
  - marker: b
    text: “我的一切泉源都在你里面”是诗歌性的隐喻，也可理解为“我的一切水泉”或“我生命的一切源头都在你里面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרִים
  choice: 歌唱的
  rationale: 按动词 שׁיר（歌唱）的分词理解，指歌唱者；与后面的 כְּחֹלְלִים 构成并列的表演者群体，比同形词“首领”更符合语境。
- source_word: כְּחֹלְלִים
  choice: 和跳舞的
  rationale: 通常从表示旋转、舞蹈的 חול 理解。前缀 כְּ 在这句高度凝练的诗行中带有关联或比较意味；译为“和跳舞的”可自然表达两类人一同发声，同时把“吹笛的”这一可能保留在脚注中。
- source_word: כָּל
  choice: 所有的……都
  rationale: 表达完整、无一例外的范围；用“所有的……都”符合现代汉语习惯，也保留诗句的总括语气。
- source_word: מַעְיָנַי
  choice: 我的泉源
  rationale: מַעְיָן 的基本义是泉、水泉。“泉源”既具体又富有诗意，并能保留其可能指生命来源等的隐喻空间。
- source_word: בָּךְ
  choice: 在你里面
  rationale: בְּ 的通常意义是“在……里面”；此处第二人称阴性单数指向锡安。译文补出汉语所需的判断结构，但不把它解释成较强的来源义“都来自你”。
- source_word: '[implicit speech verb]'
  choice: 都说
  rationale: 希伯来文没有明写“说”，而是把群体称谓直接接在引语式宣告之前。汉语若无引述动词会显得突兀，因此补出“都说”，并不改变宣告者或内容。
theological_decisions:
- issue: “我的泉源”在对锡安说话时的隐喻意义
  choice: 保留“我所有的泉源都在你里面”这一具体隐喻
  alternative: 我的一切生命之源都在你里面／我的一切福分都在你里面
  rationale: 诗篇把锡安描绘为归属与生命汇聚之地，但原文没有明确限定“泉源”究竟指生命、福分还是其他来源。直保留意象，可避免把开放的诗意固定成某一教义性解释。
- issue: 末句由谁说以及引述关系
  choice: 按歌唱者和跳舞者共同作出的宣告来表达
  alternative: 把整句理解为不带引述动词的舞台性描写或副词性短语
  rationale: 原文句法极其简省；上下文与传统理解支持把“我所有的泉源都在你里面”视为他们的宣告。译文为汉语可读性补“都说”，同时不进一步规定“我”是个人、群体或诗人的声音。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“歌唱的和跳舞的”保留原文两类人的并列；补出“都说”以疏通原文省略式句法。“泉源”比“源头”更具具体水泉意象，也不过度解释。脚注标记均紧随其所说明的词句。
