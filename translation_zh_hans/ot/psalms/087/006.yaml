base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/006.yaml
  text: Yahweh will count[a], when he records the peoples, “This one was born there.” Selah
translation:
  language: zh_hans
  text: 雅威在登记众民时，必数点，并说：“这个人是在那里出生的。”细拉
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译上帝的专名，保留四字神名作为名字的性质，不以称号替代。
- source_word: יִסְפֹּר
  choice: 数点
  rationale: ספר的基本义是“数算、点数”；“数点”既保留词义，也适合本节登记名册的语境。
- source_word: בִּכְתוֹב
  choice: 登记……的时候
  rationale: 介词ב加不定式在这里表达时间；结合“众民”与逐一宣告出生地的语境，译作“登记……的时候”自然且准确。
- source_word: עַמִּים
  choice: 众民
  rationale: 复数עמּים指多个民族或民群；“众民”简洁保留复数及群体范围，又不局限于现代民族国家概念。
- source_word: זֶה
  choice: 这个人
  rationale: 阳性单数指示词指向名册中的个体；现代汉语用“这个人”自然，同时不额外限定其身份。
- source_word: יֻלַּד
  choice: 生
  rationale: 这是ילד的被动式，意为“出生”；汉语“生在那里”是自然的出生地表述。
- source_word: שָׁם
  choice: 在那里
  rationale: 原文是地点副词“那里”，上下文所指应为锡安；正文保留其指代方式，不直接改写为“在锡安”或“在她里面”。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该礼仪或音乐术语的确切含义不明，采用传统音译，避免作出过度确定的解释。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”更直接地音译四字神名，保留以色列上帝之专名的性质。
- issue: 是否将שָׁם明确译为“在锡安”或“在她里面”
  choice: 在那里
  alternative: 在她里面／在锡安
  rationale: 本诗上下文明确指向锡安，但希伯来文本节本身使用地点副词“那里”。正文保留原有照应关系，以脚注说明其所指，避免把上下文解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“数点众民、登记他们”保留原文“数算”与“写录”的双重表达；“（细拉）”以括号标示诗篇中的礼仪或音乐术语。
