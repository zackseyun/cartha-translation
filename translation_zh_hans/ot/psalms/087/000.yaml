lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: 可拉子孙的
  rationale: 介词 לְ 可表示归属、关联或受益对象；正文采用诗篇标题中自然的传统表达，同时以脚注保留“为可拉子孙作”的可能。
- source_word: מִזְמוֹר שִׁיר
  choice: 诗篇，是一首歌
  rationale: 分别体现 מִזְמוֹר（诗篇）和 שִׁיר（歌），以自然标点把二者连为同一标题。
- source_word: יְסוּדָתוֹ
  choice: 他所立的根基
  rationale: 该词带第三人称阳性单数后缀；译作“他所立的根基”保留其人称形式，也用脚注说明所指并不明说。
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: 在圣山上
  rationale: 复数 הַרְרֵי 译为“山”，קֹדֶשׁ 作限定成分，整体自然译为“圣山”；中文“山”本身不标单复数，脚注注明原文为复数。
theological_decisions:
- issue: יְסוּדָתוֹ 的阳性单数后缀所指
  choice: 正文译作“他所立的根基”，不明指主语
  alternative: “它的根基”或“锡安的根基”
  rationale: 希伯来文本未在本句明说后缀所指；可能指上帝所立的根基，也可能以锡安或耶路撒冷为隐含所指。正文不擅自补明，以保留原文张力。
- issue: 标题中 לְ 所表达的关系
  choice: “可拉子孙的”
  alternative: “为可拉子孙作的”
  rationale: 该介词可表示作者归属，也可表示关联或用途；正文采用简洁常见的标题形式，脚注保留另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇标题语体。“可拉子孙”沿用中文圣经读者熟悉的专名表达；正文保持短句节奏，并以脚注交代介词和代词后缀的真实歧义。
