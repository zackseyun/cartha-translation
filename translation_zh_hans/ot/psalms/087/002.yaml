  text: אֹהֵ֣ב יְ֭הוָה שַׁעֲרֵ֣י צִיּ֑וֹן מִ֝/כֹּ֗ל מִשְׁכְּנ֥וֹת יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/002.yaml
  text: Yahweh loves the gates of Zion more than all the dwellings of Jacob[a].
translation:
  language: zh_hans
  text: 雅威爱锡安的城门，胜过雅各一切的住处[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在雅各一切的住处之上。”
    reason: 保留מִכֹּל较贴近字面的空间性表达；正文采用其在偏爱语境中的比较含义。
lexical_decisions:
- source_word: אֹהֵב
  choice: 爱
  rationale: אהב的Qal主动分词在此作谓语，主语是雅威；“爱”自然保留持续、一般性的含义，不额外强化程度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为专名的性质，不以称号替代。
- source_word: שַׁעֲרֵי
  choice: 城门
  rationale: 该词为שַׁעַר的复数构造形式；“城门”在现代汉语中自然，也保留了原文具体意象，虽可能借城门代指全城，却不在正文中将其释义化。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经语境中通行的地名译法。
- source_word: מִכֹּל
  choice: 胜过……一切
  rationale: 介词מִן与כֹּל接在表示偏爱的动词之后，最自然地表达比较；“胜过……一切”清楚呈现锡安与雅各其他住处之间的比较关系。
- source_word: מִשְׁכְּנוֹת
  choice: 住处
  rationale: מִשְׁכָּן的复数在此指居住之所；“住处”清楚自然，并避免“帐幕”可能引出的礼仪性联想。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 保留原文专名；此处虽可集合性地指雅各的百姓或地域，但正文不将其解释性改译为“以色列”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；正文以“雅威”音译，保留其作为以色列之神专名的功能，而不换成“主”等称号。
- issue: מִכֹּל的比较含义
  choice: 胜过雅各一切的住处
  alternative: 在雅各一切的住处之上
  rationale: 上下文最自然地表示喜爱的程度或优先性比较。“胜过”在现代汉语中明确而不增添原文没有说明的神学结论；脚注保留较贴近介词表面的另一种表达。
translation_notes:
  register: 采用庄重而简明的现代标准汉语。语序贴近希伯来诗句，同时以“胜过”明确比较关系；保留“城门”的诗性意象及“雅各”的集合性专名。
