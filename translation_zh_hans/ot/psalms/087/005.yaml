source:
  edition: WLC
  text: וּֽ/לֲ/צִיּ֨וֹן יֵאָמַ֗ר אִ֣ישׁ וְ֭/אִישׁ יֻלַּד בָּ֑/הּ וְ/ה֖וּא יְכוֹנְנֶ֣/הָ עֶלְיֽוֹן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/005.yaml
  text: And of Zion it will be said[a], “This one and that one were born in her,” and the Most High himself will establish her.
translation:
  language: zh_hans
  text: 论到锡安，必有人说[a]：“这个人、那个人，都生于她。”至高者必亲自坚立她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个又一个，都生于她。”希伯来文重复“人”字，表达逐一、分配的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלֲצִיּוֹן
  choice: 论到锡安
  rationale: 介词ל在此引出话题；“论到”自然保留“关于锡安”的语义，连接词则按汉语诗体不必机械译出。
- source_word: יֵאָמַר
  choice: 人必说
  rationale: 尼法勒未完成式可作无人称被动“必有话说”，现代汉语以“人必说”简洁表达其泛指与未来/宣告意味。
- source_word: אִישׁ וְאִישׁ
  choice: 这一个、那一个
  rationale: 重复的אִישׁ具有逐一、分配的意味；此译保留个体逐一被数点的诗意，又避免生硬的“一个人和一个人”。
- source_word: יֻלַּד בָּהּ
  choice: 都是生在她里面的
  rationale: 动词在希伯来文中为单数，与分配结构相应；汉语加“都是”清楚表达每一个人分别出生于其中，并保留锡安女性化的城市意象。
- source_word: וְהוּא
  choice: 必亲自
  rationale: 独立代词带强调作用；将其译为“亲自”自然呈现至高者本身施行这行动的强调。
- source_word: יְכוֹנְנֶהָ
  choice: 坚立她
  rationale: כון在此有建立、使稳固之意；“坚立”兼顾奠立与稳固的诗性含义。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 这是对上帝的称号；“至高者”是简明、庄重且通行的现代汉语表达。
theological_decisions:
- issue: 强调代词הוּא与עֶלְיוֹן的关系
  choice: “至高者必亲自坚立她”
  alternative: “他，就是至高者，必坚立她”
  rationale: 把הוּא的强调落实为“亲自”，明确行动者是至高者，同时不增添经文以外的教义解释。
- issue: 锡安的女性化表达
  choice: 保留“她”
  alternative: 译作“那里”或“它”
  rationale: 阴性代词呼应作为城市和母亲形象的锡安；保留“她”维持原文意象及其神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这一个、那一个”保留原文逐一点数个体的诗意；“生在她里面”与“坚立她”维持锡安的人格化形象。
