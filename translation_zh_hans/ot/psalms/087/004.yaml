base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/004.yaml
  text: 'I will mention Rahab and Babylon among those who know me[a]; behold, Philistia and Tyre[c][b], along with Cush: this one was born there.'
translation:
  language: zh_hans
  text: 我要在认识我的人中提到拉哈伯[a]和巴比伦[b]；看哪，非利士和推罗，以及古实：此人是在那里[c]出生的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉哈伯”是诗歌中对埃及的称呼。
    reason: alternative_reading
  - marker: b
    text: “在认识我的人中提到”也可译作“向认识我的人提到”。希伯来语的介词关系在这里较为含蓄。
    reason: lexical_alternative
  - marker: c
    text: 按本诗上下文，“那里”指锡安，即上帝的城。
    reason: cross_reference
lexical_decisions:
- source_word: אַזְכִּיר
  choice: 我要……提到
  rationale: 该词是זכר的使役形，常表示“提到、说起、使人记起”。这里是在列举各国，“提到”既贴近原文，也符合诗歌语境。
- source_word: רַהַב
  choice: 拉哈伯
  rationale: 保留希伯来诗歌中对埃及的专名式称呼，不直接以解释性的“埃及”取代；其所指在脚注说明。
- source_word: וּבָבֶל
  choice: 和巴比伦
  rationale: 采用该地名在现代汉语中的通行译名。
- source_word: לְיֹדְעָי
  choice: 在认识我的人中
  rationale: 介词לְ与分词及第一人称单数后缀构成简练而略有歧义的诗句。正文采用归入某一群体的理解，同时以脚注保留“向认识我的人提到”的可能。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文提醒读者注意、引出下文的功能，并维持庄重的诗歌语体。
- source_word: פְלֶשֶׁת
  choice: 非利士
  rationale: 原词指非利士地区；“非利士”是现代中文圣经语境中通行且简洁的地名形式。
- source_word: וְצוֹר
  choice: 和推罗
  rationale: 采用该地名的通行中文译名。
- source_word: עִם כּוּשׁ
  choice: 以及古实
  rationale: עִם表示伴随或并列；中文以“以及”自然地把古实与前述地方并列。
- source_word: זֶה
  choice: 此人
  rationale: 原文是阳性单数指示词，直译为“这一个”。“此人”在中文中较自然，并保留单数指向，不把它扩展为复数或民族整体。
- source_word: יֻלַּד שָׁם
  choice: 是在那里出生的
  rationale: 保留ילד被动式和地点副词שָׁם的基本含义；“那里”的具体所指由诗篇上下文确定。
theological_decisions:
- issue: “认识我的人”中第一人称说话者的身份
  choice: 正文保留“我”，不明说其身份
  alternative: 把说话者明确解释为耶和华，或解释为人格化的锡安
  rationale: 本节这一行没有直接点明说话者。上下文可引导理解，但译文不应替原文消除其文学与神学张力。
- issue: “那里”的所指
  choice: 正文保留“那里”
  alternative: 直接译成“在锡安”或“在上帝的城中”
  rationale: 诗篇上下文很可能指向锡安，但原文只用地点副词。正文保持含蓄，脚注提示上下文所指。
- issue: 列国之人与锡安的关系
  choice: 保留“此人是在那里出生的”这一出生宣告
  alternative: 解释为这些人被登记为锡安的公民、归信者或敬拜者
  rationale: 这些解释可能反映诗句含义，但“出生”意象本身具有神学张力，正文不将其改写成特定的归属或归信术语。
translation_notes:
  register: 采用现代、庄重而易懂的汉语诗歌语体。“看哪”保留原文的提示语气；“拉哈伯”与“那里”等含蓄表达留在正文，必要解释放入脚注。标点将最后一句处理为被引述的宣告，同时不补出原文未明说的说话者。
