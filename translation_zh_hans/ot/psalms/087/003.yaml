  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְבָּדוֹת
  choice: 有荣耀的事
  rationale: 该词源于 כבד，在此为阴性复数、名词化使用，指尊荣、显赫或分量重大的事。“有荣耀的事”既保留其尊荣含义，也符合中文诗歌语体。
- source_word: מְדֻבָּר
  choice: 论到
  rationale: 这是 דבר 的 Pual 分词，表达被谈论、被述说。与介词短语连用时，“论到”自然、凝练，并能承接有关这城的赞美之言。
- source_word: בָּךְ
  choice: 你
  rationale: 介词 בְּ 加第二人称阴性单数后缀，可按语境理解为“论到你”或“在你里面说”。正文采用“论到你”，与赞美锡安的语境相合，同时以脚注保留原文介词的歧义。
- source_word: עִיר הָאֱלֹהִים
  choice: 上帝之城
  rationale: 原文是“城”与“上帝”的构造链。“上帝之城”简洁庄重；置于第二人称之后，作为同位称呼，无须另加呼格词。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切功能不明，可能是礼仪或音乐标记，因此按传统音译，不作解释性翻译。
