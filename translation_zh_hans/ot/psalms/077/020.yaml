  text: You led your people like a flock by the hand of Moses and Aaron[a][b].
translation:
  language: zh_hans
  text: 你借着摩西和亚伦的手[a]，带领你的子民，好像带领羊群一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“借着摩西和亚伦的手”。这是表示代理或媒介的惯用说法，意思是借着摩西和亚伦的带领。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחִיתָ
  choice: 你带领
  rationale: 此处是第二人称阳性单数完成式，直接称呼上帝，表示引领、带领；“你带领”自然明确，也与下文牧养羊群的意象相称。
- source_word: כַצֹּאן
  choice: 如同带领羊群
  rationale: כ־表示比较，צאן是集合名词，指羊群等小型牲畜。中文补出第二个“带领”，使比较关系自然，并保留群体性的牧养意象。
- source_word: עַמֶּךָ
  choice: 你的子民
  rationale: עם在此指属于上帝的群体；“你的子民”既表达归属关系，也符合庄重而通俗的现代中文。
- source_word: בְּיַד
  choice: 借着……的手
  rationale: בְּיַד字面为“借着……的手”，在此表示代理或媒介。正文保留希伯来语的具体意象，脚注说明其惯用含义。
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: 摩西和亚伦
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 上帝与摩西、亚伦在带领百姓一事上的施事关系
  choice: 上帝是直接称呼中的主要行动者，摩西和亚伦是他所借以施行带领的人间代理者。
  alternative: 把摩西和亚伦仅视为随附提及的历史人物，而不表达其代理作用。
  rationale: 动词以第二人称单数称呼上帝，而בְּיַד מֹשֶׁה וְאַהֲרֹן以工具、代理性的短语说明上帝借谁带领。译文同时保留神的主导行动与人的受托参与。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如同带领羊群”保留牧者引领群羊的图景；“借着……的手”保留原文意象，并用脚注避免读者将其误解为单纯的身体动作。
