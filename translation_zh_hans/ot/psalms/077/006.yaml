  text: אֶֽזְכְּרָ֥ה נְגִינָתִ֗/י בַּ֫/לָּ֥יְלָה עִם לְבָבִ֥/י אָשִׂ֑יחָה וַ/יְחַפֵּ֥שׂ רוּחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/006.yaml
  text: I remember my song in the night[a]; with my heart I meditate[d][c][b], and my spirit searches.
translation:
  language: zh_hans
  text: 我在夜间想起我的歌[a][d]；我在心里沉思[b]，我的灵[c]细细寻索。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的歌”也可译作“我的曲调”或“我的乐声”。
    reason: lexical_alternative
  - marker: b
    text: “沉思”也可译作“默想”或“自言自语”；原文动词既可指内心思索，也可指反思性的诉说。
    reason: lexical_alternative
  - marker: c
    text: “我的灵”在这里指诗人的内在自我，也可理解为“我的心神”或“我的内心”。
    reason: lexical_alternative
  - marker: d
    text: “我想起”也可译作“我要想起”或“让我想起”；原文动词在诗歌中可表达当前回想、将来行动或意愿。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: 我想起
  rationale: 该词为זכר的Qal未完成式第一人称单数，在诗歌语境中可表达当前持续的回想，也可能带将来或意愿色彩；正文采用自然的现时叙述，并以脚注保留其他可能。
- source_word: נְגִינָתִי
  choice: 我的歌
  rationale: נְגִינָה可指歌曲、曲调或乐声；“我的歌”自然简洁，也符合诗人回忆夜间所唱或所听之歌的语境，同时不排除音乐层面的含义。
- source_word: בַּלָּיְלָה
  choice: 在夜间
  rationale: 贴近希伯来文介词短语，并保留诗篇庄重、幽静的氛围。
- source_word: עִם לְבָבִי אָשִׂיחָה
  choice: 我在心里反复思想
  rationale: עִם לְבָבִי直译为“与我的心”，שׂיח可指默想、自语或倾诉；中文用“在心里反复思想”自然表达内在省思，并由脚注保留反思自语的可能。
- source_word: וַיְחַפֵּשׂ
  choice: 不断探究
  rationale: חפשׂ表示搜寻、查究；在此描写诗人内在的深入追索。“不断”传达诗句中持续而用力探寻的语感，但不限定所寻找的具体对象。
- source_word: רוּחִי
  choice: 我的灵
  rationale: רוּחַ在此指诗人的内在自我，不是风；“我的灵”保留希伯来文较宽广的人论表达，脚注说明也可按语境理解为心神或内心。
theological_decisions:
- issue: “灵”是否专指独立于心智的属灵实体
  choice: 正文保留“我的灵”，按诗歌语境理解为诗人的内在自我
  alternative: 译作“我的心神”或“我的内心”
  rationale: 原文רוּחִי具有语义宽度；保留“灵”可避免把它缩减为纯粹理智，也不据此建立特定的人论区分。
- issue: 诗人回想的是歌曲本身还是夜间歌唱的经历
  choice: 译作“在夜间想起我的歌”，保留修饰关系的开放性
  alternative: 译作“想起我夜间所唱的歌”
  rationale: בַּלָּיְלָה在句中可与回想或歌曲的情境相连；正文不补入“所唱的”，以免过早消除诗句的含混。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“夜间”“反复思想”“不断探究”形成由回想进入内省追索的递进。正文优先自然中文，同时通过脚注保存נְגִינָה、שׂיח、רוּחַ以及未完成式的真实语义空间。
