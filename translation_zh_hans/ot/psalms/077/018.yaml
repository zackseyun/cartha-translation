lexical_decisions:
- source_word: ק֤וֹל רַעַמְךָ
  choice: 你的雷声……回响
  rationale: קוֹל可指“声音”，与“你的雷”连用时译为“你的雷声”最自然；加入“回响”使中文句子完整，并传达雷声在风暴中轰鸣的听觉意象。
- source_word: בַּגַּלְגַּל
  choice: 在旋风中
  rationale: גַּלְגַּל本义可指轮子或旋转之物；在雷电的诗歌语境中，很可能描绘旋转的风暴。“旋风”既符合上下文，也保留旋转意象；脚注注明直译可能。
- source_word: הֵאִירוּ בְרָקִים
  choice: 闪电照亮了
  rationale: הֵאִירוּ是אוֹר的使役式，意为“使发光、照亮”；בְרָקִים虽为复数，现代汉语通常统称“闪电”。
- source_word: תֵּבֵל
  choice: 世界
  rationale: תֵּבֵל常指人所居住的世界或大地范围；此处宇宙性显现的语境中，“世界”简洁自然。
- source_word: רָגְזָה
  choice: 战栗
  rationale: 该动词表达颤抖、激荡；“战栗”保留强烈的诗歌色彩，并与后一动词有所区别。
- source_word: וַתִּרְעַשׁ הָאָרֶץ
  choice: 大地……震动
  rationale: רעש表示震动、摇撼；הָאָרֶץ在此宇宙性的语境中宜译“大地”，而非局部性的“土地”。与“战栗”并列，保留希伯来文两个动词递进强化的效果。
