  text: אֱ֭לֹהִים בַּ/קֹּ֣דֶשׁ דַּרְכֶּ֑/ךָ מִי אֵ֥ל גָּ֝ד֗וֹל כֵּֽ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/013.yaml
  text: God[a], your way is in holiness; who is a great god like God?
translation:
  language: zh_hans
  text: 神啊，你的道路在圣洁中[a]；有哪位神明像神一样伟大呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的道路在圣所中。”希伯来语“圣洁／圣所”在这里既可指圣洁这一性质或领域，也可指圣所。
    reason: 保留בַּקֹּדֶשׁ的另一种可行理解，避免把原文的多义性只限定为神的属性。
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 下文紧接第二人称单数所属后缀“你的”，因此在此按呼语处理；“啊”自然表达直接称呼。
- source_word: בַּקֹּדֶשׁ
  choice: 在圣洁中
  rationale: קֹדֶשׁ既可指圣洁这一性质或领域，也可指圣所。正文采用较宽泛的“在圣洁中”，并以脚注保留“在圣所中”的可行读法。
- source_word: דַּרְכֶּךָ
  choice: 你的道路
  rationale: “道路”既可表示神行动的路径，也可表示他的行事方式，保留了原词的意象与语义幅度。
- source_word: מִי
  choice: 有哪位
  rationale: 以现代汉语自然的反问形式引出比较，同时保留“谁”的基本疑问意义。
- source_word: אֵל
  choice: 神明
  rationale: 此处是比较句中的普通名词，指任何被称为神的存在；用“神明”可与句末指独一真神的“神”有所区分，又不把比较对象具体化。
- source_word: גָּדוֹל
  choice: 伟大
  rationale: 直接表达该词在此处的宏大、尊崇之意，适合赞美诗的语体。
- source_word: כֵּאלֹהִים
  choice: 像神一样
  rationale: 保留כְּ所表达的比较关系，并把אֱלֹהִים按上下文理解为真神；不改写成“像你”，以保存原文的重复和修辞力度。
theological_decisions:
- issue: בַּקֹּדֶשׁ的含义
  choice: 神的道路在圣洁中
  alternative: 神的道路在圣所中
  rationale: 希伯来语既容许抽象意义的“圣洁”，也容许地点或礼仪意义的“圣所”。正文不将其限定为圣殿地点，脚注则明确保留圣所读法，从而保存原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“神啊”明确呼语；“有哪位……呢”呈现反问语气。“在圣洁中”略带诗性，以保留原文结构和“圣洁／圣所”的张力。
