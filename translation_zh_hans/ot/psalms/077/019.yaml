id: PSA.77.19
reference: Psalms 77:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יָּ֤ם דַּרְכֶּ֗/ךָ ו/שבילי/ך בְּ/מַ֣יִם רַבִּ֑ים וְ֝/עִקְּבוֹתֶ֗י/ךָ לֹ֣א נֹדָֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/019.yaml
  text: Your way was through the sea[a], and your paths through many waters[b], yet your footprints were not known.
translation:
  language: zh_hans
  text: '你的道路穿过海洋[a]，

    你的路径穿过茫茫大水；

    你的足迹[b]却无人知晓。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在海中……在茫茫大水中。”希伯来语介词可表示“在……中”；这里与“道路、路径”连用，也可理解为从水中穿过。
    reason: lexical_alternative
  - marker: b
    text: “足迹”也可译作“踪迹”或“脚步”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּם
  choice: 穿过海洋
  rationale: 介词 בְּ 基本可表示“在……中”，但与“道路”连用时，这里描写行进的路线；“穿过”自然传达道路位于海中并从其中通过的意象，同时不把所指明说为某一次具体渡海事件。
- source_word: דַּרְכֶּךָ
  choice: 你的道路
  rationale: דֶּרֶךְ 可指道路、路径或行进的方式。“道路”保留具体的行路图像，也可承载诗歌中的引申意味。
- source_word: שביליך
  choice: 你的路径
  rationale: שְׁבִיל 指小路、路径或行迹。“路径”与上一行“道路”构成自然的同义平行，又不预先与下文“足迹”混同。
- source_word: בְּמַיִם רַבִּים
  choice: 穿过茫茫大水
  rationale: בְּ 在此与首行平行，译作“穿过”以呈现行进意象；מַיִם רַבִּים 可指众多或浩大的水，“茫茫大水”以自然、庄重的现代汉语保留水域广大无际的诗意。
- source_word: עִקְּבוֹתֶיךָ
  choice: 你的足迹
  rationale: עִקְּבוֹת 可指脚印、踪迹或步履。“足迹”具体呈现行过之后本应留下痕迹的图像，并与其“不为人知”形成张力。
- source_word: לֹא נֹדָעוּ
  choice: 却无人知晓
  rationale: ידע 的尼法勒式表示“未被知道”。“无人知晓”是自然的现代汉语表达，保留足迹究竟是看不见、无法辨认还是无法追踪的开放性，不将其缩窄为某一种解释。
theological_decisions:
- issue: 渡海意象的解释具体程度
  choice: 保留上帝的道路穿过海洋和大水的诗歌图像，不在正文中明确点名红海或出埃及事件。
  alternative: 在正文中直接译明为上帝带领以色列人过红海。
  rationale: 本节明显唤起上帝借水施行拯救的历史记忆，但希伯来文本本身没有点明具体事件。保留诗歌表达，既呈现上帝真实行动，也保留其足迹无人知晓、作为难以测透的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体；三行结构对应希伯来诗歌的平行与转折。“海洋／茫茫大水”和“道路／路径”形成递进，“却”突出上帝确实行经水域而其踪迹仍不可测知的反差。
