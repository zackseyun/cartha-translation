  yaml_path: translation/ot/psalms/077/007.yaml
  text: Will the Lord reject forever[a], and never again show favor?
translation:
  language: zh_hans
  text: 难道主会永远丢弃，不再施恩吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלְעוֹלָמִים
  choice: 难道……永远
  rationale: 疑问词 הַ 引出带哀叹色彩的反问；“难道……永远”以自然汉语保留其修辞力度和持续时间含义。
- source_word: יִזְנַח
  choice: 丢弃
  rationale: 该动词表示摒弃、弃绝。诗篇哀歌的关系语境中，“丢弃”既通俗自然，也比单纯“拒绝”更能体现被弃置的感受。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神圣称号 Adonai，并非神名 YHWH；译作“主”可准确保留称号性质。
- source_word: וְלֹא יֹסִיף לִרְצוֹת עוֹד
  choice: 不再施恩
  rationale: יֹסִיף 与不定式及 עוֹד 构成“不再继续/不再又做”的表达；רצה 在此指 favorable disposition。合译为“不再施恩”简洁自然，并传达关系上的恩待。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 上主
  rationale: 原文使用称号而非专名；“主”是现代中文圣经语域中清楚、庄重而不额外引入神名含义的对应词。
- issue: יִזְנַח 的宾语是否明说
  choice: 补出泛指的“人”
  alternative: “难道主会永远丢弃，不再施恩吗？”
  rationale: 希伯来文未明说宾语，语境中隐含诗人或属神群体。汉语中补出泛指“人”可使句子顺畅，同时避免限定为某一个具体对象；但原文的省略仍有一定表达价值。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇哀歌语体。保留全句反问形式；“丢弃”与“施恩”形成关系层面的张力。
