id: PSA.77.11
reference: Psalms 77:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אזכיר מַֽעַלְלֵי יָ֑הּ כִּֽי אֶזְכְּרָ֖ה מִ/קֶּ֣דֶם פִּלְאֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/011.yaml
  text: I will remember the deeds of Yah[b][a], for I will remember your wonders from of old.
translation:
  language: zh_hans
  text: 我要记念雅[a]的作为；我要追想你古时的奇事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要述说雅的作为。”这里的动词既可指记在心中，也可指提说或述说。
    reason: lexical_alternative
  - marker: b
    text: “古时的奇事”也可译作“你从古以来的奇事”或“你很久以前所行的奇事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּיר
  choice: 我要记念
  rationale: 该词是זכר的使役式，可表示使人想起、提说或述说；在本节与后半句同根词相呼应，译作“记念”既保留主动追忆之意，也不限定为公开述说。
- source_word: מַעַלְלֵי
  choice: 作为
  rationale: 该词指行动、事迹或所行之事；“作为”在现代汉语中自然庄重，也适合诗歌语体。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的诗体短式，而非四字神名的完整形式；音译为“雅”，以保留原文的形式差异。
- source_word: כִּי
  choice: ；（不单独明译）
  rationale: כִּי在此可作解释或强调，引出平行重述。汉语以分号并列两个诗行更自然，也保留二者紧密的解释性关系，而不强行译成可能显得生硬的“因为”。
- source_word: אֶזְכְּרָה
  choice: 我要追想
  rationale: 该形式带有第一人称意愿或决心的色彩；“我要”体现意志，“追想”与前面的“记念”保持词义关联，又避免机械重复。
- source_word: מִקֶּדֶם
  choice: 古时
  rationale: 该短语指久远的从前或古代；“古时”简洁而有诗意，不暗示绝对的起初。
- source_word: פִּלְאֶךָ
  choice: 你的奇事
  rationale: 该词指奇妙之事或令人惊叹的作为；“奇事”与前半句“作为”形成自然平行，并明确其为神所行。
theological_decisions:
- issue: 神名诗体短式יָהּ的译法
  choice: 雅
  alternative: 耶和华；主
  rationale: 原文使用יָהּ，而不是完整的四字神名。采用简短音译“雅”，可保留这一诗体短式的独特性，避免把原文的形式差异抹平。
- issue: 两个זכר形式的关系
  choice: 分别译作“记念”和“追想”
  alternative: 两处都译作“记念”；首处译作“述说”
  rationale: 两处同根，表达刻意回想神作为的决心；采用近义表达既显出呼应，也保留首个使役式可能包含“提说、述说”的语义张力，不把它限定为公开宣告。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“记念”与“追想”形成平行呼应；分号体现希伯来诗句的两行结构。神名短式音译为“雅”，并以脚注说明首个动词的词义幅度。
