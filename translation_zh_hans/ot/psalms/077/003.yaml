lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: 我想起
  rationale: זכר 的第一人称单数未完成式在这里可带现在、将来或意愿色彩；在哀歌语境中，“我想起”自然地表达诗人当下持续的举动，同时不把语气限定为明确的将来或祈愿。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处指以色列的神，语法和语境均为单数所指；“神”是现代中文中准确、庄重的对应。
- source_word: וְאֶהֱמָיָה
  choice: 就呻吟
  rationale: המה 可表示因激动或痛苦发出的声音；“呻吟”符合本诗的哀痛语境。“就”自然呈现想起神与随之呻吟之间的诗意衔接，但不强行界定严格因果。
- source_word: אָשִׂיחָה
  choice: 我沉思
  rationale: שיח 在哀歌中既可指反复思想，也可指倾诉或哀诉；正文采用自然的“沉思”，并以脚注保留“诉说愁苦”的可能。
- source_word: וְתִתְעַטֵּף
  choice: 便衰弱
  rationale: עטף 的 Hitpael 形式可表示衰弱、发昏或被压倒；“衰弱”清楚表达内在力量消退，并用脚注保留“不堪重负”的另一理解。
- source_word: רוּחִי
  choice: 我的心灵
  rationale: רוּחַ 可指风、气息或人的灵；此处描述诗人的内在状态，“心灵”比单指生理呼吸更符合语境，也较符合现代中文表达。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切含义不明，因此沿用中文圣经传统的音译，不作推测性解释。
