  text: הֲ/שָׁכַ֣ח חַנּ֣וֹת אֵ֑ל אִם קָפַ֥ץ בְּ֝/אַ֗ף רַחֲמָ֥י/ו סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/009.yaml
  text: Has God forgotten to be gracious? Has he in anger shut up his compassion? Selah[a][b]
translation:
  language: zh_hans
  text: 难道上帝忘了施恩？难道他在怒中封住了自己的怜悯[a]？细拉[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道上帝忘了赐下恩惠？还是他在怒中收回了自己的慈悲？”
    reason: 词义及句法的可选译法
  - marker: b
    text: “细拉”可能是礼仪或音乐标记，确切含义不明。
    reason: 文化与文本说明
lexical_decisions:
- source_word: הֲשָׁכַח
  choice: 难道……忘了
  rationale: 疑问词 הֲ 与动词 שׁכח 构成带有哀诉意味的反问；“难道……忘了”既自然，也保留诗人的痛苦追问。
- source_word: חַנּוֹת
  choice: 施恩
  rationale: חנן 的不定式表示赐予恩惠或眷顾；“施恩”简洁庄重，并保留希伯来圣经中恩惠用语的关联。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל 在此是对独一真神的通用称谓，并非四字神名；“上帝”在现代汉语中清楚自然。
- source_word: אִם
  choice: 难道
  rationale: אִם 在第一个反问之后引出平行的第二问。汉语用两个“难道”形成自然的诗歌平行；“还是”这一选择意味在脚注中保留。
- source_word: קָפַץ
  choice: 封住
  rationale: 该动词具有关闭、封闭之意；“封住”保留原文具体而强烈的意象，没有直接释义为较抽象的“收回”。
- source_word: בְּאַף
  choice: 在怒中
  rationale: אַף 可由“鼻子”引申为怒气；“在怒中”简洁地表达其语境含义，同时保持诗体的凝练。
- source_word: רַחֲמָיו
  choice: 自己的怜悯
  rationale: 该词形式上为复数，但在此可作集合或抽象概念，指上帝的慈悲怜悯；“自己的”明确反身所属，符合现代汉语。
- source_word: סֶלָה
  choice: 细拉
  rationale: 此词的确切功能不明，通常视为礼仪或音乐标记，因此采用传统音译，不作推测性翻译。
theological_decisions:
- issue: 本节应译为反问还是陈述
  choice: 译作两个表达诗人困苦与疑惑的反问
  alternative: 译作“上帝已经忘了……”之类的肯定陈述
  rationale: 疑问词及诗篇哀歌的上下文支持反问。这样既呈现诗人的强烈挣扎，也不把他的疑问强化为关于上帝的断言。
- issue: 第二问与第一问的关系
  choice: 正文用重复的“难道”构成平行反问
  alternative: 用“还是”明确表示两问之间的选择关系
  rationale: אִם 可引出与前问相接的另一疑问。重复“难道”更符合自然汉语诗体，而“还是”的可能性在脚注中注明，以保存原文连接方式的细微差别。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。两个“难道”保留哀歌中的反问张力；“封住”保留希伯来文的具体意象。“细拉”沿用通行音译，并以脚注说明其不确定性。
