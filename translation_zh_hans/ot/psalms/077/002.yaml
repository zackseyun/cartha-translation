  text: בְּ/י֥וֹם צָרָתִ/י֮ אֲדֹנָ֪/י דָּ֫רָ֥שְׁתִּי יָדִ֤/י לַ֣יְלָה נִ֭גְּרָה וְ/לֹ֣א תָפ֑וּג מֵאֲנָ֖ה הִנָּחֵ֣ם נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/002.yaml
  text: In the day of my distress I sought the Lord[a]; my hand was stretched out in the night and did not grow numb; my soul refused to be comforted.
translation:
  language: zh_hans
  text: 我遭难时，我寻求主；夜间，我的手伸着，并不松懈[a]；我的心不肯受安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可较贴近字面译作：“我的手在夜间流出（或倾泻），并不松弛（或衰弱）。”希伯来语意象含义不易确定；正文理解为诗人在祷告中持续伸手。
    reason: 保留 נִגְּרָה“流出／倾泻”及 תָפוּג“松弛／衰弱”的词义和意象歧义。
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: 我遭难的日子
  rationale: 按希伯来语时间表达直译其诗歌色彩，同时用现代汉语可自然理解的“遭难”表达困苦、患难之境。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是称号 אֲדֹנָי，并非四字神名；译作“主”既准确又符合中文圣经语体。
- source_word: דָּרָשְׁתִּי
  choice: 寻求
  rationale: דרשׁ 以神为对象时常指转向并求问、寻求神；“寻求”简洁地保留这一含义。
- source_word: יָדִי
  choice: 我的手
  rationale: 原文为单数，正文保留单数，不改作复数或“手臂”。
- source_word: לַיְלָה נִגְּרָה וְלֹא תָפוּג
  choice: 夜间，我的手伸出，毫不松懈
  rationale: נגר 的基本意象是流出或倾出，但以“手”为主语时语义困难；上下文很可能描写人在祷告中持续伸手。“毫不松懈”表达 פוג 的松弛、衰弱或停止之义，同时以脚注保留较贴近字面的另一读法。
- source_word: מֵאֲנָה הִנָּחֵם נַפְשִׁי
  choice: 我的心不肯受安慰
  rationale: מאן 表示拒绝或不肯，נחם 的尼法勒式在此指受到安慰。נפשׁ 可指生命、自己或内在的人；中文诗歌语境中的“我的心”自然表达内在自我，并避免“灵魂”可能带来的过度实体化理解。
theological_decisions:
- issue: אֲדֹנָי 的译法
  choice: 主
  alternative: 上主
  rationale: 此处是神的称号而非四字神名。译作通行而自然的“主”，不把它误作“耶和华”，也不额外引入宗派性称谓。
- issue: נַפְשִׁי 的表达
  choice: 我的心
  alternative: 我的灵魂
  rationale: נפשׁ 在此指诗人内在的自我及其感受。“我的心”符合现代汉语哀歌语体；“我的灵魂”虽较形式对应，却可能使读者误以为原文特意区分可独立存在的身体与灵魂。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；分句保持原文由困境、持续祷告到拒绝受安慰的推进。正文避免生硬照搬“手流淌”的意象，但在脚注中完整保留这一真实的释义困难。
