  yaml_path: translation/ot/psalms/077/017.yaml
  text: The clouds poured out water; the skies gave forth a sound; indeed[a], your arrows moved about.
translation:
  language: zh_hans
  text: '密云倾泻雨水，

    天空发出声响；

    你的箭也四处飞驰。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的闪电也四处飞驰。”希伯来文直译为“你的箭”；在这里的风暴神显场景中，很可能以箭比喻闪电。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרְמוּ מַיִם עָבוֹת
  choice: 密云倾泻雨水
  rationale: 原文语序为“密云涌流出水”。“倾泻雨水”以自然现代汉语表达大量水流涌出的景象；“密云”保留 עָבוֹת 所指厚重云层的意味。
- source_word: קוֹל נָתְנוּ שְׁחָקִים
  choice: 天空发出声响
  rationale: קוֹל נָתְנוּ 直译为“发出声音”，未直接解释为雷鸣；שְׁחָקִים 可指天空或云层，此处译作“天空”，以免与上一分句的“密云”重复。
- source_word: אַף
  choice: 也
  rationale: 该语气词在此有递进或附加作用。“也”简洁自然，并保留诗句中景象进一步展开的关系。
- source_word: חֲצָצֶיךָ
  choice: 你的箭
  rationale: 该词本义为“箭”，在风暴显现的诗歌语境中很可能比喻闪电。正文保留原有军事意象，脚注说明语境义。
- source_word: יִתְהַלָּכוּ
  choice: 四处飞驰
  rationale: 该动词表达往来、四处移动。与“箭”搭配时，“飞驰”比一般的“移动”更符合汉语诗体，同时也可描绘闪电划过天空，并未限定具体方向。
theological_decisions:
- issue: 风暴中的神显意象：实指“箭”还是以“箭”喻闪电
  choice: 正文保留“你的箭”，让上下文显出闪电的隐喻可能。
  alternative: 直接译为“你的闪电”或“你的电光”。
  rationale: 希伯来词本义是“箭”，而本节风暴语境强烈提示闪电。保留“箭”可避免在正文中消解诗歌隐喻，脚注则帮助普通读者理解这一神显图景。
translation_notes:
  register: 采用现代、庄重而易懂的诗体；以三行呈现希伯来诗句的递进。正文保留“箭”的原始意象，避免直接把“声响”解释成雷声，也避免把隐喻在正文中明说。
