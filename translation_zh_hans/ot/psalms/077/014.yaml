  text: אַתָּ֣ה הָ֭/אֵל עֹ֣שֵׂה פֶ֑לֶא הוֹדַ֖עְתָּ בָ/עַמִּ֣ים עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/014.yaml
  text: You are the God who works wonders[b][a]; you have made your strength known among the peoples.
translation:
  language: zh_hans
  text: 你是行奇事的上帝；你在万民中显明了你的力量。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万民”或译“列国”；“力量”也可译作“能力”或“威力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: 上帝
  rationale: 定冠词使称谓带有明确、强调的意味；汉语直接说“你是……的上帝”即可自然表达这一身份认定，无须另加量词。
- source_word: עֹשֵׂה פֶלֶא
  choice: 行奇事的
  rationale: 分词表达上帝具有代表性、持续性的作为；“行奇事”既贴近希伯来语，也比“行神迹”范围更宽，保留非凡作为的诗性含义。
- source_word: הוֹדַעְתָּ
  choice: 彰显了
  rationale: 该使役式本义为“使人知道”。在此语境中，“彰显了”自然表达上帝借作为使其能力为人所知，同时保留完成性。
- source_word: בָעַמִּים
  choice: 在万民中
  rationale: 介词 ב 表示范围或场域；עַמִּים 可指多个民族或民众群体。“在万民中”简洁自然，并避免现代地缘政治色彩。
- source_word: עֻזֶּךָ
  choice: 你的能力
  rationale: עֹז 可指力量、能力或威力；“能力”在此与“彰显”搭配自然，并保留上帝大能作为的含义。
theological_decisions:
- issue: בָעַמִּים 所表达的彰显范围
  choice: 在万民中
  alternative: 在列国中；向万民
  rationale: “在万民中”保留介词的场域意义及复数群体的广泛范围，不将经文限定为现代国家，也不把介词明确改解为接受对象。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“行奇事”保留原文的广义诗性，不窄化为专门术语“行神迹”；语序简洁，适合诗篇平行句。
