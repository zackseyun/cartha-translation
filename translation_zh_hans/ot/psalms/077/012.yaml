  yaml_path: translation/ot/psalms/077/012.yaml
  text: I will meditate on all your work[a], and I will ponder your deeds.
translation:
  language: zh_hans
  text: 我要默想你一切的作为，也要思想你所行的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也要述说你所行的事。”希伯来语动词既可指默想、思索，也可指谈论、述说；这里的平行结构较支持反思之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָגִיתִי
  choice: 我要默想
  rationale: הגה 的 Qal 第一人称单数在此表示反复思量、默想；与后一分句的诗歌平行关系相配。结合 אָשִׂיחָה 的意愿语气，以“我要”表达诗人的决意。
- source_word: בְכָל פָּעֳלֶךָ
  choice: 你一切的作为
  rationale: 介词 בְּ 标示默想的对象；פֹּעַל 为单数集合用法，可指神全部的工作或作为。“一切的作为”在现代汉语中自然，也保留集合意义。
- source_word: וּבַעֲלִילוֹתֶיךָ
  choice: 你所行的事
  rationale: עֲלִילוֹת 指行为、行动或所成就的事。译作“你所行的事”既与上句“作为”形成近义平行，又避免无根据地增添“大能”等限定。
- source_word: אָשִׂיחָה
  choice: 也要思想
  rationale: שיח 可指默想、思索，也可指谈论。此处与 הגה 平行，反思之义较合语境；“思想”保留语义重叠，同时避免连续重复“默想”。
theological_decisions: []
