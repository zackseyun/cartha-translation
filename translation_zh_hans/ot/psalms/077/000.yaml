  text: 'For the choir director: according to Jeduthun[d][c][b][a]. A psalm of Asaph.'
translation:
  language: zh_hans
  text: 交给乐长，照耶杜顿[a]。亚萨的诗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照耶杜顿”可能指照某种曲调或演奏方式，也可能指耶杜顿本人、他的乐班或相关传统。
    reason: cultural_note
  - marker: b
    text: “亚萨的”也可译作“为亚萨作的”或“属于亚萨的”；原文可表示作者、归属、关联或献予。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题注中通常指负责统筹音乐演奏的人；“乐长”简洁、庄重，也适合诗篇的礼仪语境。
- source_word: עַל
  choice: 照
  rationale: 题注中的 עַל 很可能引出演奏曲调、方式或相关团体；“照”保留“依照”的题注意义，又不限定具体所指。
- source_word: יְדוּתוּן
  choice: 耶杜顿
  rationale: 这是人名，也可能借此指相关乐班或演奏传统，故采用现代中文圣经中易辨认的音译。
- source_word: לְאָסָף
  choice: 亚萨的
  rationale: 介词 לְ 在诗篇题注中可表示作者、归属、关联或献予；“亚萨的”自然简练，同时避免明确断定作者身份。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 该词指配乐歌唱的诗篇体裁；在单篇题注中译作“诗”自然，并与中文诗篇传统用语相符。
theological_decisions:
- issue: לְאָסָף 所表达的亚萨与本诗之关系
  choice: 亚萨的诗
  alternative: 为亚萨作的诗／属于亚萨的诗
  rationale: 原文并未明确区分作者身份、团体归属或奉献对象，因此正文采用自然但仍具一定开放性的表达，并以脚注说明。
translation_notes:
  register: 采用简洁、庄重的现代普通话诗篇题注体。“乐长”保留传统礼仪色彩但不显生僻；正文与脚注共同保存 עַל 和 לְ 的真实歧义。
