  yaml_path: translation/ot/psalms/077/001.yaml
  text: My voice is to God[a], and I cry out; my voice is to God[b], and he gives ear to me.
translation:
  language: zh_hans
  text: '我向上帝扬声，我大声呼求；

    我向上帝扬声，他侧耳听我。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他侧耳听我。”希伯来语的表达十分简练，可理解为上帝垂听的陈述，也可理解为求他垂听的愿望。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: קוֹלִי אֶל אֱלֹהִים
  choice: 我向上帝扬声
  rationale: 原文直译近于“我的声音向着上帝”，连续出现两次。译作“我向上帝扬声”既保留“声音”的意象和方向性，也符合现代汉语诗体表达，并维持两句的平行与重复。
- source_word: וְאֶצְעָקָה
  choice: 我大声呼求
  rationale: צעק表示在困苦中强烈呼喊、求助；“大声呼求”传达其力度，也与前面的“扬声”衔接自然。这里不机械译成将来时，而按诗歌中的鲜明陈述处理。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为形态上的复数形式，语境中指独一的上帝，按单数意义翻译。
- source_word: וְהַאֲזִין אֵלָי
  choice: 他就侧耳听我
  rationale: אזן强调留心、专注地听；“侧耳听”保留这一形象和诗意。“听我”自然表达 אֵלָי 的指向。
theological_decisions:
- issue: 末句是上帝已经/必然垂听的陈述，还是求上帝垂听的愿望
  choice: 正文译为陈述：“他就侧耳听我”
  alternative: “愿他侧耳听我”或“求你侧耳听我”
  rationale: 上下文最自然地把末句理解为上帝对诗人呼求的回应，因此正文采用第三人称陈述；不过希伯来语形式和极简句法容许祈愿式理解，故以脚注保留，不把这种张力完全消除。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体。“我向上帝扬声”在自然汉语与原文名词性表达之间取平衡；两次原样重复，以保留希伯来诗句的平行结构和迫切感。
