  text: אָ֭חַזְתָּ שְׁמֻר֣וֹת עֵינָ֑/י נִ֝פְעַ֗מְתִּי וְ/לֹ֣א אֲדַבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/004.yaml
  text: You have held my eyelids open[b][a]; I am troubled and cannot speak.
translation:
  language: zh_hans
  text: 你使我不能合眼[a]；我烦乱不安[b]，不能说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你抓住了我眼睛的守望（或守卫）。”这里的希伯来语习语通常指眼睑，或指使眼睛不能闭合、彻夜清醒的状态。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我受到搅扰”“我惊惶不安”。末句直译为“我不说话”，按上下文可指因受扰而不能说话。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחַזְתָּ
  choice: 你使……无法合上
  rationale: 这是动词 אחז 的 Qal 完成式第二人称阳性单数，指上帝抓住或控制某物；结合后面的“我眼睛的守更”，自然表达为上帝使诗人的眼睛不能合上。
- source_word: שְׁמֻרוֹת עֵינָי
  choice: 我的眼睛无法合上
  rationale: 字面是“我眼睛的守更（时段）”，语义可能涉及眼睑或清醒守夜；本译文按语境表达失眠，同时用脚注保留希伯来语意象及其不确定性。
- source_word: נִפְעַמְתִּי
  choice: 我心神不宁
  rationale: פעם 的 Niphal 完成式第一人称单数在此表示内心受扰、激动不安；“心神不宁”自然且不把情绪过度限定为恐惧、惊骇或悲伤。
- source_word: וְלֹא אֲדַבֵּר
  choice: 不能说话
  rationale: 形式上可译“我不说话”，但上下文更可能表示困扰深重以致无言；“不能说话”传达这种结果，同时脚注保留形式上较直译的可能。
theological_decisions:
- issue: 上帝在诗人失眠中的作用
  choice: 保留“你”直接使诗人无法合眼的表达
  alternative: 弱化为诗人因想到上帝而失眠
  rationale: 希伯来文明确以第二人称动词 אָחַזְתָּ 表达上帝的主动作用，不宜把这种神学张力改写为纯粹的心理反应。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心神不宁”保留原文内在激荡的宽泛含义；正文流畅表达失眠，脚注保留“眼睛的守更”这一不寻常意象和可能的歧义。
