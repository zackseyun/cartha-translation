  yaml_path: translation/ot/psalms/077/008.yaml
  text: Has his steadfast love ceased forever? Has his promise come to an end for generation after generation?[a]
translation:
  language: zh_hans
  text: 他的慈爱永远止息了吗？他的应许岂已断绝，直到世世代代吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的话岂已断绝，直到世世代代吗？”
    reason: 保留אֹמֶר较形式对应的译法及原文的词义宽度。
lexical_decisions:
- source_word: הֶאָפֵס
  choice: 止息了吗
  rationale: 该词带疑问前缀，询问某事是否已经消失或停止；“止息”自然、庄重，也保留哀歌中尖锐的疑问。
- source_word: לָנֶצַח
  choice: 永远
  rationale: 这是表示永久持续的常用时间表达；“永远”简明地传达诗人所担忧的永久终止。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד包含忠贞、恒久及立约关系中的爱；现代中文圣经语体中的“慈爱”既自然又宽广，不把词义限缩为单纯怜悯。
- source_word: גָּמַר
  choice: 终止了吗
  rationale: 该动词表达完成、耗尽或停止；这里译为“终止”，符合对上帝话语是否不再延续的哀叹。
- source_word: אֹמֶר
  choice: 他的应许
  rationale: 该词字面可指“话”或“言语”，但在此与上帝的慈爱平行，语境很可能指他所说的承诺；正文采用“应许”，并以脚注保留较形式对应的“话”。
- source_word: לְדֹר וָדֹר
  choice: 世世代代
  rationale: 这一惯用语表示一代接一代；“世世代代”是自然、凝练且有诗意的现代中文表达。
theological_decisions:
- issue: אֹמֶר应较形式地译为“话”，还是按语境译为“应许”
  choice: 应许
  alternative: 话
  rationale: 本节质问上帝的慈爱和可信可靠的话是否已经失效；“应许”能表达语境中上帝所作承诺的意味，但原词本身较宽泛，因此用脚注保留“话”，避免把解释当作唯一词义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。两个平行问句保留原文的神学张力，不将诗人的疑问改写为断言；“止息”与“终止”既呈现近义平行，也避免机械重复。
