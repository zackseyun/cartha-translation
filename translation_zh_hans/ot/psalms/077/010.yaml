  text: וָ֭/אֹמַר חַלּ֣וֹתִ/י הִ֑יא שְׁ֝נ֗וֹת יְמִ֣ין עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/010.yaml
  text: 'Then I said[b][a], “This is my grief: the years of the right hand of the Most High.”'
translation:
  language: zh_hans
  text: 于是我说：“这是我的苦痛[a]：至高者右手的岁月。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苦痛”或译“软弱”或“疾病”。希伯来语此词较难确定，可指患难、软弱或病痛。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译：“于是我说：‘这是我的苦痛：至高者右手的改变。’”这里译作“岁月”的希伯来语，也有人理解为“改变”。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: 于是我说
  rationale: 承接前文并引出诗人的自述，既体现叙事推进，也符合现代汉语表达。
- source_word: חַלּוֹתִי
  choice: 我的苦痛
  rationale: 此词形式和含义较难确定，可指患病、软弱或所受痛苦；“苦痛”适合哀歌语境，又不过度限定为身体疾病。
- source_word: הִיא
  choice: 这是
  rationale: 将阴性代词理解为指示诗人当前所说的处境或领悟，用“这是”自然明晰。
- source_word: שְׁנוֹת
  choice: 岁月
  rationale: 按 שָׁנָה（年）的复数构造形式理解，是较直接的读法；也可能与“改变”相关，故在脚注保留另一解释。
- source_word: יְמִין
  choice: 右手施展作为
  rationale: 保留“右手”的诗歌意象，并以“施展作为”说明这里所指向的能力与拯救行动，使“右手的岁月”在汉语中较为自然。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 这是指上帝的尊称；“至高者”准确、庄重，也符合通行的圣经汉语用语。
theological_decisions:
- issue: 本节艰深句法的解释
  choice: 把诗人的苦痛与至高者昔日以右手施展作为的岁月相对照
  alternative: “至高者的右手已经改变”，即诗人悲叹上帝大能的作为似乎发生了改变
  rationale: חַלּוֹתִי 和 שְׁנוֹת 均存在词义或构词上的争议。正文采用可由马所拉文本直接支持的“苦痛／岁月”读法，但不把其神学张力解释得过满，并在脚注保留重要异读。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“右手”保留原诗的神学意象；增补“施展作为”旨在使“右手的岁月”在汉语中通顺，并未将其仅限定为某一种作为。所有重要歧义均以脚注呈现。
