  yaml_path: translation/ot/psalms/077/015.yaml
  text: You redeemed your people with your arm[a], the sons of Jacob and Joseph[d][c][b]. Selah
translation:
  language: zh_hans
  text: 你用你的膀臂[a]救赎了你的子民，就是雅各和约瑟的子孙[b]。细拉[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “膀臂”保留希伯来文的形象，表示上帝所施展的大能。
    reason: lexical_alternative
  - marker: b
    text: “雅各和约瑟的子孙”可能是对以色列的诗意称呼，其中“约瑟”也可能特别突出由他而出的支派。
    reason: alternative_reading
  - marker: c
    text: “细拉”可能是礼仪或音乐用语，确切含义不明。
    reason: cultural_note
lexical_decisions:
- source_word: גָּאַלְתָּ
  choice: 救赎了
  rationale: 该动词可指履行至近亲属的赎回责任，也可泛指赎回、解救；“救赎”保留其盟约与拯救的分量，不将含义缩减为一般性的“救出”。
- source_word: בִּזְרוֹעַ
  choice: 用你的膀臂
  rationale: 原词本义为“臂膀”，在此象征上帝施展大能；保留身体意象，同时用“膀臂”维持庄重的诗歌语体。
- source_word: עַמֶּךָ
  choice: 你的子民
  rationale: 指属于上帝的群体；“子民”自然表达其盟约关系，并适合诗篇语体。
- source_word: בְּנֵי יַעֲקֹב וְיוֹסֵף
  choice: 雅各和约瑟的子孙
  rationale: בְּנֵי 在民族谱系表达中指后裔；译作“子孙”比逐字的“儿子们”更符合现代汉语，又保留雅各与约瑟并列的原文结构。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切意义不明，可能是礼仪或音乐标记；采用传统音译，避免把不确定的功能解释进正文。
theological_decisions:
- issue: “雅各和约瑟的子孙”所指的群体范围
  choice: 保留雅各与约瑟的双重称名，不具体限定其代表范围
  alternative: 将“约瑟”明确解释为以法莲、玛拿西或北方各支派；或将整句直接译成“以色列人”
  rationale: 希伯来文没有明说“约瑟”的代表功能。直译双重称名可保留它可能指向全以色列、约瑟后裔或北方支派的诗性张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语言。“用你的膀臂”保留希伯来诗歌意象；“子孙”自然表达谱系与民族身份；“细拉”按传统音译。所有脚注标记均置于正文对应位置。
