  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רָ֘א֤וּ/ךָ מַּ֨יִם אֱֽלֹהִ֗ים רָא֣וּ/ךָ מַּ֣יִם יָחִ֑ילוּ אַ֝֗ף יִרְגְּז֥וּ תְהֹמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/016.yaml
  text: The waters saw you[a], O God; the waters saw you and writhed[b]; even the depths trembled.
translation:
  language: zh_hans
  text: '上帝啊，众水看见了你；

    众水看见了你，就翻腾[a]；

    连深渊[b]也战抖。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “翻腾”或译“痛苦扭动”、“震颤”。希伯来语动词可指痉挛般震动，或像产痛一样扭动。
    reason: lexical_alternative
  - marker: b
    text: “深渊”或译“深水”、“海洋深处”。希伯来语为复数，指深处的水域或海洋深处。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: 看见了你
  rationale: 这是 ראה 的 Qal 完成式加第二人称阳性单数宾语后缀，直译为“看见了你”。两次重复照原文保留，以呈现诗歌的强调和平行结构。
- source_word: מַיִם
  choice: 众水
  rationale: מַיִם 指“水、众水”。“众水”既保留复数般的宏阔意象和拟人表达，也符合庄重的现代汉语诗体；两处均重复译出。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处置于“看见了你”之后，具有呼语作用。汉语将呼语前置，并用“啊”明确直接称呼，语意不变而更自然。
- source_word: יָחִילוּ
  choice: 翻腾
  rationale: חול/חיל 在此可表达痉挛般震动、痛苦扭动或生产般阵痛。“翻腾”适合描述拟人化的众水剧烈动荡，也与下句 רגז 所表达的“战抖”有所区别。
- source_word: אַף
  choice: 连……也
  rationale: אַף 在这里加强递进：不但众水翻腾，连深渊也战抖。“连……也”自然保留这一强调。
- source_word: יִרְגְּזוּ
  choice: 战抖
  rationale: רגז 常指颤抖、震动或骚动。“战抖”清楚传达深渊在上帝面前震颤的诗意，并避免与前句“翻腾”重复。
- source_word: תְהֹמוֹת
  choice: 深渊
  rationale: תהום 的复数形式指深水、海洋深处或诸深渊。汉语“深渊”简洁自然，同时保留宇宙性深水的意象；其集合意义可由上下文承载。
theological_decisions:
- issue: 众水和深渊在上帝面前被拟人化
  choice: 保留众水“看见”、翻腾以及深渊战抖的拟人化描写，不在正文中限定具体事件或神话背景。
  alternative: 明确译成红海过海事件，或解释为上帝与神话性海洋势力争战。
  rationale: 原文描绘受造界的水域在上帝临在前剧烈反应，但本节本身没有明说应排他地对应哪一种背景。保留诗歌意象，可让经文潜在的历史、宇宙性和互文关联继续开放。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体。保留“众水看见了你”的重复和平行结构；将呼语“上帝啊”前置以符合自然汉语语序。用“翻腾”与“战抖”区分原文两个不同动词，并按正确对应位置放置脚注标记。
