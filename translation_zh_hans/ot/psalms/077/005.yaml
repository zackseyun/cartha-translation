  text: חִשַּׁ֣בְתִּי יָמִ֣ים מִ/קֶּ֑דֶם שְׁ֝נ֗וֹת עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/005.yaml
  text: I considered the days of old[a], the years of ages past.
translation:
  language: zh_hans
  text: 我追想古时的日子，久远年代的年岁。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“古代的年岁。”这里的希伯来语“עוֹלָמִים”指久远的古代，并不一定指绝对意义上的永恒。
    reason: lexical_alternative
lexical_decisions:
- source_word: חִשַּׁבְתִּי
  choice: 我追想
  rationale: חשׁב在此表示有意识地思量、回顾；“追想”既符合诗人反思往昔的语境，也不把含义缩减为单纯的记忆。
- source_word: יָמִים מִקֶּדֶם
  choice: 古时的日子
  rationale: מִקֶּדֶם指从前、久远的过去；“古时的日子”自然凝练，并保留诗歌语感。
- source_word: שְׁנוֹת עוֹלָמִים
  choice: 久远年代的岁月
  rationale: עוֹלָמִים在本处与“岁月”搭配，指遥远的古代，并不必然表示绝对的永恒；此译也保留与上半句的平行关系。
theological_decisions:
- issue: עוֹלָמִים的时间范围
  choice: 译作“久远年代”，指遥远的往昔
  alternative: 译作“永恒”或“永世”
  rationale: 上下文回顾昔日，且该词修饰“岁月”，因此这里主要指悠久古远的时期；不宜强行赋予形而上的永恒含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“古时的日子”与“久远年代的岁月”形成同义平行；“追想”体现主动而深入的思量。
