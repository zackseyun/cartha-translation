  yaml_path: translation/ot/psalms/094/004.yaml
  text: They gush forth[a]; they speak arrogantly[b]; all the workers of wickedness boast.
translation:
  language: zh_hans
  text: 他们滔滔不绝地说傲慢的话[a]；所有作恶的人都自夸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们涌出话来，说傲慢的话。”
    reason: יַבִּיעוּ本义为涌出、喷涌；在与“说”并列的言语语境中，可译出其生动意象，也可如正文以“滔滔不绝地说”表达。
lexical_decisions:
- source_word: יַבִּיעוּ
  choice: 滔滔不绝
  rationale: 该词是 נבע 的使役式，描绘涌流、喷涌而出的动态；此处与“说”并列，语境所指是话语不断涌出。译作“滔滔不绝”自然传达大量言语奔涌而出的形象，同时不在正文中明添原文未明说的宾语。
- source_word: יְדַבְּרוּ עָתָק
  choice: 口出狂言
  rationale: יְדַבְּרוּ 意为“说”，עָתָק 在此指傲慢、狂妄的话。“口出狂言”以现代而庄重的汉语表达其言语内容，并保留诗句对狂傲言谈的谴责。
- source_word: יִתְאַמְּרוּ
  choice: 夸耀自己
  rationale: 该反身动词含自我抬高、自夸之意。“夸耀自己”既保留反身意味，也符合本节以言语傲慢为中心的语境。
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: 所有作恶的人
  rationale: 直译为“所有行作邪恶的人”。“所有作恶的人”保留 כָּל 的周遍意味和行为者结构，且比“作孽之人”更符合现代标准汉语。
