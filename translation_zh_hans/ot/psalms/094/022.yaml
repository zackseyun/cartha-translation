  yaml_path: translation/ot/psalms/094/022.yaml
  text: But Yahweh has become my stronghold[a], and my God the rock of my refuge.
translation:
  language: zh_hans
  text: 但耶和华成了我的堡垒[a]；我的上帝是我避难的磐石。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华作了我的堡垒。”希伯来语动词可按简单过去理解；“成了”也可表达这一结果延续至今。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 成了
  rationale: 该叙事性过去形式表达已经发生的事实；结合语境，“成了”既保留变化或经历的意味，也自然暗示其结果延续至今。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”译出四字神名，不以称号替代。
- source_word: לִי לְמִשְׂגָּב
  choice: 我的保障
  rationale: לִי 表示与诗人的切身关系，מִשְׂגָּב 指高而安全、难以攻取的庇护处；“我的保障”简洁自然，并传达安全保护之意。
- source_word: וֵאלֹהַי
  choice: 我的上帝
  rationale: 保留第一人称所有关系和两个分句之间的平行结构。
- source_word: לְצוּר מַחְסִי
  choice: 成了庇护我的磐石
  rationale: צוּר 保留“磐石”的稳固、防护隐喻；מַחְסִי 可理解为“我的避难所”，译作“庇护我的”使现代汉语搭配顺畅，同时不失原意。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名；正文采用现代中文圣经传统中辨识度较高的“耶和华”，而不是用“主”这一称号替代。
- issue: וַיְהִי 的时态与持续结果
  choice: 成了
  alternative: 曾是／成为了
  rationale: 原文形式本身可按简单过去理解，也可在语境中强调如今仍有效的结果；正文用“成了”保持简洁，并由脚注说明这种空间。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“保障”传达 מִשְׂגָּב 的安全庇护意象；后半句保留“磐石”这一诗歌隐喻，并用“庇护我的”避免“我避难的磐石”等较生硬的现代汉语表达。
