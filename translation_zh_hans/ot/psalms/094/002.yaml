  text: הִ֭נָּשֵׂא שֹׁפֵ֣ט הָ/אָ֑רֶץ הָשֵׁ֥ב גְּ֝מ֗וּל עַל גֵּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/002.yaml
  text: Rise up[a], Judge of the earth[b]; repay the proud what they deserve.
translation:
  language: zh_hans
  text: 全地的审判者啊，求你兴起[a]；使骄傲的人得到他们应得的报偿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你高举自己”或“显为至高”。希伯来语动词带有反身意味；在本节语境中，也可理解为呼求上帝挺身采取行动。
    reason: lexical_alternative
  - marker: b
    text: 直译可作：“把报偿归还在骄傲的人身上”；也可译：“向骄傲的人施以报偿。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּשֵׂא
  choice: 求你兴起
  rationale: 该命令式带有反身意味，字面可理解为“高举自己”，在本诗呼求上帝施行审判的语境中，“求你兴起”既自然，也保留了采取行动的呼召。
- source_word: שֹׁפֵט
  choice: 审判者
  rationale: 这是作名词使用的分词，在此作为对上帝的称呼；“审判者”简洁地保留了司法意象。
- source_word: הָאָרֶץ
  choice: 全地
  rationale: 这里称上帝为普世的审判者；“全地”比“这地”更能表达诗句的广阔范围，同时符合庄重的诗歌语体。
- source_word: הָשֵׁב
  choice: 使……受到
  rationale: 该使役命令式与“报应”连用，字面意象是使报应返回到某人身上；中文用“使……受到”能清楚、自然地表达施行报偿的意思。
- source_word: גְּמוּל
  choice: 应得的报应
  rationale: 该词指行为所招致的回报或报偿；本节是惩治骄傲之人的语境，因此“应得的报应”准确传达司法性的负面报偿。
- source_word: עַל
  choice: 使……受到
  rationale: 该介词标明报应临到的对象；中文通过“使骄傲的人受到……”这一结构自然表达，而不机械译成“在……之上”。
- source_word: גֵּאִים
  choice: 骄傲的人
  rationale: 该词在这里指傲慢自大的人，不只是地位崇高的人；“骄傲的人”准确且易懂。
theological_decisions:
- issue: 呼求上帝审判的性质
  choice: 把本节译为呼求全地的审判者采取行动，使骄傲的人承受其行为应得的报应。
  alternative: 把 הִנָּשֵׂא 主要理解为呼求上帝“被尊崇”或彰显威荣，而不突出司法行动。
  rationale: 两个命令式以及“审判者”“报应”等司法词汇共同指向上帝主动施行公正审判；译文表达这一重点，但不扩展为本节没有明说的教义论断。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“全地的审判者啊”保留直接呼告与司法称号；“求你兴起”符合现代汉语祈求语气，“应得的报应”则自然表达希伯来语“使报应返回”的意象和惩罚性语境。
