  text: כִּ֤י לֹא יִטֹּ֣שׁ יְהוָ֣ה עַמּ֑/וֹ וְ֝/נַחֲלָת֗/וֹ לֹ֣א יַעֲזֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/014.yaml
  text: For Yahweh will not forsake his people[b][a]; he will not abandon his inheritance.
translation:
  language: zh_hans
  text: 因为雅威必不丢弃[a]他的子民，也不撇下他的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丢弃”也可译作“离弃”。
    reason: lexical_alternative
  - marker: b
    text: “产业”也可译作“基业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在此引出对上下文陈述的理由或解释；“因为”自然保留了希伯来语连接词的说明作用。
- source_word: יִטֹּשׁ
  choice: 必不丢弃
  rationale: נטשׁ表示丢弃、离弃或抛下。“丢弃”准确表达弃绝之意；与否定词及未完成式结合译为“必不丢弃”，符合诗歌中的应许语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的读音作音译，保留经文所用的上帝专名，而不以称号替代。
- source_word: עַמּוֹ
  choice: 他的子民
  rationale: עַם在盟约语境中指属于雅威的人民；“子民”在现代汉语中自然表达这种归属关系。
- source_word: נַחֲלָתוֹ
  choice: 他的产业
  rationale: נַחֲלָה可指所分得的产业、基业或承受之物；这里以“产业”表达雅威把以色列视为自己所有之份的意象。
- source_word: יַעֲזֹב
  choice: 不撇下
  rationale: עזב意为离开、撇下或遗弃。“撇下”既保留与前半句的平行关系，也避免把两个不同的希伯来动词译得完全相同。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其专名性质，不将其改作称号。
- issue: נַחֲלָתוֹ 的盟约意象
  choice: 他的产业
  alternative: 他的基业；他所拥有的
  rationale: “产业”保留雅威的子民是他所得之份、归他所有的意象，同时不把原文限定为某一套更具体的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。“必不……也不……”再现两行否定平行结构；“子民”和“产业”保留经文的归属与盟约色彩。
