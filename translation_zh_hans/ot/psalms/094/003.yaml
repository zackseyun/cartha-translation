  text: How long[a], O Yahweh, shall the wicked[c][b], how long shall the wicked exult?
translation:
  language: zh_hans
  text: 雅威[a]啊，恶人还要到几时，恶人还要到几时欢腾[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝专名 יהוה（YHWH）的音译；传统译本常译作“耶和华”或以“主”代称。
    reason: divine_name
  - marker: b
    text: “欢腾”也可译作“欢喜”或“欢跃”；希伯来文表示强烈、昂扬的喜悦。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: 要到几时
  rationale: 这是哀诉中追问某种情形还要持续多久的惯用语；“要到几时”自然、庄重，也保留了急切质问的语气。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 该复数名词化形容词泛指行恶的一类人；“恶人”简洁地保留其群体含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文辅音所代表的上帝专名 YHWH 音译，避免以称号代替经文中的专名。
- source_word: יַעֲלֹזוּ
  choice: 欢呼雀跃
  rationale: 该动词表示强烈、昂扬的欢喜；“欢呼雀跃”比一般的“欢喜”更能表现恶人得意欢腾的情态，同时不把原文没有明说的“夸胜”写入正文。
- source_word: עַד מָתַי רְשָׁעִים（重复）
  choice: 恶人要到几时，恶人要到几时
  rationale: 保留希伯来诗句有意的重复，以呈现哀诉的迫切感和诗歌的平行结构。
theological_decisions:
- issue: 上帝专名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 YHWH；正文采用现代汉语中较贴近 Yahweh 的音译“雅威”，并以脚注说明，既保留专名，也避免无提示地改为称号。
- issue: 恶人的“欢喜”是否应解释为夸胜或狂妄
  choice: 欢呼雀跃
  alternative: 洋洋得意；夸胜
  rationale: יַעֲלֹזוּ 表达强烈欢喜，但其狂妄或胜利意味主要来自语境；正文不把这些推论固定为唯一解释，以保留原文的语义张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“要到几时”的重复紧贴原文，并用逗号维持一气呵成的急切呼告；“还”使持续性的追问在现代汉语中更自然。
