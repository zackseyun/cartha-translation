  text: וַ/יָּ֤שֶׁב עֲלֵי/הֶ֨ם אֶת אוֹנָ֗/ם וּ/בְ/רָעָתָ֥/ם יַצְמִיתֵ֑/ם יַ֝צְמִיתֵ֗/ם יְהוָ֥ה אֱלֹהֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/023.yaml
  text: He will bring back on them their iniquity[a], and in their evil he will wipe them out[c][b]; Yahweh our God will wipe them out.
translation:
  language: zh_hans
  text: 他必使他们的罪孽归到他们身上[a]；借他们的恶行毁灭他们[b]。耶和华——我们的上帝——必毁灭他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他已使他们的恶行归到他们身上。”希伯来语动词在此诗歌语境中可理解为过去或完成的行动，也可理解为带将来意味的宣告；“罪孽”也可译作“恶行”或“过错”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因他们的恶行毁灭他们”，或“在他们的恶行中毁灭他们”。原文介词可表示关联、工具或依据。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: 他必使……归到
  rationale: 该词源自שׁוב，此处有使某事返回、归回之意；与“在他们身上”和“他们的罪孽”连用，表达罪孽反归作恶者自身。诗歌语境容许将该形式理解为带将来意味的确信宣告。
- source_word: עֲלֵיהֶם
  choice: 他们身上
  rationale: 保留介词“在……之上”的基本意象，与“归到”搭配，形成自然的现代汉语。
- source_word: אוֹנָם
  choice: 他们的罪孽
  rationale: אָוֶן可指祸患、邪恶或罪孽；此处是上帝使之归到恶人身上的对象，道德性的“罪孽”最切合上下文，同时仍可脚注说明“恶行”等可能译法。
- source_word: וּבְרָעָתָם
  choice: 并在他们的恶行中
  rationale: בְּ可表示处境、凭借或依据。“在他们的恶行中”贴近原文，并保留究竟是伴随、工具还是审判依据的含混性。
- source_word: יַצְמִיתֵם
  choice: 把他们除灭
  rationale: צמת的使役式表示毁灭、剪除。“除灭”庄重而有力度，且可自然重复，以保存希伯来诗句的强调。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中通行的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 直接表达带第一人称复数后缀的“我们的上帝”；“上帝”为现代标准汉语中自然、庄重的称呼。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；永恒主
  rationale: 原文直接使用四字神名。正文采用中文读者广泛熟悉的专名“耶和华”，既保留其专名性质，也不以“主”等称号取代。
- issue: 诗歌中וַיָּשֶׁב的时体
  choice: 将来式确信宣告：“他必使……归到”
  alternative: 过去或完成意义：“他已使……归到”
  rationale: 虽为wayyiqtol形式，但诗歌中可有非叙事性用法；下文两次יַצְמִיתֵם为未完成式，整节作为对公义审判的确信宣告，译作“必”更连贯，同时用脚注保留完成式理解。
- issue: בְּ在וּבְרָעָתָם中的语义
  choice: 保留为“在他们的恶行中”
  alternative: “因他们的恶行”或“借着他们的恶行”
  rationale: 介词可表达处境、工具或依据。正文不替原文排除这些可能性，以免把审判的方式或根据解释得过于确定。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“归到他们身上”保留罪孽回归作恶者的诗歌意象；两次重复“把他们除灭”保存原文的强调。神名译为“耶和华”。
