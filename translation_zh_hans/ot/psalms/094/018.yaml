  yaml_path: translation/ot/psalms/094/018.yaml
  text: When I said, “My foot is slipping,” your steadfast love, O LORD, upheld me.
translation:
  language: zh_hans
  text: 当我说：“我的脚滑倒了。”耶和华啊，你的慈爱扶持我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: 当我说
  rationale: 这里的 אִם 可表达某一实际情形发生之时；结合上下文，用“当……时”比条件式“如果”更自然，同时不改变诗人回顾亲身经历的语气。
- source_word: מָטָה רַגְלִי
  choice: 我的脚滑动了
  rationale: מָטָה 指倾斜、摇动或将要失足；“脚滑动了”保留原文的身体意象，也可自然暗示处境不稳。
- source_word: חַסְדְּךָ
  choice: 你慈爱的信实
  rationale: חֶסֶד 兼含慈爱、忠诚与守约不变之意；“慈爱的信实”尽量保留这一复合含义，避免只译作一般的爱。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式表达四字神名，并在呼语中译作“耶和华啊”。
- source_word: יִסְעָדֵנִי
  choice: 扶持了我
  rationale: סעד 表示支撑、扶住；在脚将滑动的意象中，“扶持”贴合语境。希伯来语未完成式在此叙述所经历的扶持，中文用完成表达更自然。
theological_decisions:
- issue: חֶסֶד 的盟约与情感内涵
  choice: 你慈爱的信实
  alternative: 你坚定的爱／你的慈爱
  rationale: 采用兼顾爱与忠信的表达，不把该词缩减为单纯情感，也不额外加入原文未明说的教派性盟约术语。
- issue: 神名的翻译
  choice: 耶和华
  alternative: 上主／雅威
  rationale: “耶和华”在现代简体中文圣经语境中辨识度高，并明确反映原文专名；不以普通称号取代。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“脚滑动—扶持”的对应意象，并用感叹号呈现危急中的呼喊；全节节奏简洁，适合诗歌朗读。
