  text: הַֽ֭/יְחָבְרְ/ךָ כִּסֵּ֣א הַוּ֑וֹת יֹצֵ֖ר עָמָ֣ל עֲלֵי חֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/020.yaml
  text: Can a throne of destruction be allied with you[b][a], one that forms trouble by statute?
translation:
  language: zh_hans
  text: 那毁灭性的宝座，借律例[b]制造祸害，岂能与你结盟？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作恶的宝座”或“带来灾祸的宝座”。
    reason: lexical_alternative
  - marker: b
    text: 直译“在律例之上制造祸害”；意思可能是以法律或法令为手段，或以此为借口造成伤害。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְחָבְרְךָ
  choice: 岂能与你结盟
  rationale: חבר在此表达联合、结伴之意，并带疑问前缀；上下文中的“座”代表统治权势，因此“结盟”既保留关系含义，也传达政治色彩。“岂能”自然呈现预期否定答案的反问语气。
- source_word: כִּסֵּא
  choice: 座
  rationale: 原义为“宝座、王座”，在此借指掌权者或统治权势。中文“座”保留宝座意象，又避免让“毁灭的王座”被误解为一件具体王座。
- source_word: הַוּוֹת
  choice: 毁灭
  rationale: 该复数名词可指毁灭、灾祸、恶谋或败坏之事；“毁灭”保留其造成 ruin 的强烈含义，不笼统改译为“罪恶”。
- source_word: יֹצֵר
  choice: 制造
  rationale: יצר本义为塑造、形成；此处以分词描述统治权势借助法令产生祸害。“制造”在现代中文中自然，并保留主动造成之意。
- source_word: עָמָל
  choice: 祸害
  rationale: 该词可指劳苦、苦难、患难或压迫性伤害。在不公统治的语境中，“祸害”比泛泛的“麻烦”更能表达其造成的实际伤害。
- source_word: עֲלֵי חֹק
  choice: 借律例
  rationale: 字面近于“在律例之上／凭律例”，具体关系存在一定弹性；“借律例”表达以法律或法令为手段，同时不把“以法律为幌子”这一较强解释直接写入正文。
theological_decisions:
- issue: 上帝与制造毁灭的不义权势之间的关系
  choice: 以反问表达这种权势不可能与上帝结盟
  alternative: 较宽泛地理解为询问不义审判者能否与上帝一同施行审判
  rationale: 原文的疑问形式、“座”的统治意象和“与你联合”的措辞共同指向二者不相容。译文保留反问，不另加神学结论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“毁灭之座”保留诗歌中的统治意象；将修饰成分前置，使长句符合中文表达习惯。脚注分别保留הַוּוֹת与עֲלֵי חֹק的词义和句法弹性。
