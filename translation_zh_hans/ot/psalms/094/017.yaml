  text: לוּלֵ֣י יְ֭הוָה עֶזְרָ֣תָ/ה לִּ֑/י כִּ/מְעַ֓ט שָֽׁכְנָ֖ה דוּמָ֣ה נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/017.yaml
  text: If Yahweh had not been my help[b][a], my soul would soon have dwelt in silence.
translation:
  language: zh_hans
  text: 若不是雅威帮助我，我的性命[a]早就住在寂静[b]之中了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的魂”或“我本人”；希伯来文为“我的 נפשׁ（nephesh）”，可指生命、自我或魂。
    reason: lexical_alternative
  - marker: b
    text: “寂静”很可能指死亡或阴间的寂静。
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵי
  choice: 若不是
  rationale: 该词引出与事实相反的条件；“若不是”在现代汉语中自然表达诗人回顾性的假设。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对神圣四字名号的通行音译，保留其作为专名的性质，而不改作称号。
- source_word: עֶזְרָתָה לִּי
  choice: 帮助我
  rationale: 原文是“作我的帮助／成为给我的帮助”；译作“帮助我”更符合现代汉语，同时保留耶和华是诗人援助者的核心含义。
- source_word: כִּמְעַט
  choice: 早已
  rationale: 此处与反事实条件及完成式连用，表示若无援助，所说的结局很快便会成为事实；“早已”在汉语反事实句中自然传达这一迫近而未成真的结果。“几乎／险些”也是可能的理解。
- source_word: שָׁכְנָה
  choice: 住在
  rationale: 保留 שׁכן“居住、安居”的空间隐喻，不将其直接释义为“死亡”。
- source_word: דוּמָה
  choice: 寂静
  rationale: 该名词本义为寂静，在诗篇语境中可能暗指死亡或阴间；正文保留较直译且开放的表达。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נפשׁ可指魂、生命、本人；“性命”在本句中既自然地表达濒死含义，也保留这是诗人生命本身所遭遇结局的说法。
theological_decisions:
- issue: 是否在正文中把 דומה 明说为死亡或阴间
  choice: 正文译作“寂静”
  alternative: 死亡；阴间；寂静之地
  rationale: 上下文很可能指死亡的寂静，但原词本身并未明确写“死亡”或“阴间”。保留“寂静”可维护原诗的隐喻及其神学张力。
- issue: נפשי 应译为独立的“魂”还是诗人的生命／本人
  choice: 我的性命
  alternative: 我的魂；我本人；我的生命
  rationale: 希伯来语 נפשׁ 的语义范围包括生命、自我和魂。此处涉及死亡威胁，译作“性命”符合语境，又不据此建立灵魂与身体分离的特定人论。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“若不是……早已……”自然呈现反事实条件；“住在寂静中”刻意保留希伯来诗歌中不寻常的居住隐喻。
