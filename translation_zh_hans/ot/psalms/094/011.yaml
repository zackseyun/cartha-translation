  text: יְֽהוָ֗ה יֹ֭דֵעַ מַחְשְׁב֣וֹת אָדָ֑ם כִּי הֵ֥מָּה הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/011.yaml
  text: The LORD knows the thoughts of man, that they are vapor.
translation:
  language: zh_hans
  text: 耶和华知道世人的思想，知道它们不过是虚空。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确保留原文专名。
- source_word: מַחְשְׁבוֹת
  choice: 思想
  rationale: 准确表达人的思虑、念头，且符合现代汉语自然用法。
- source_word: אָדָם
  choice: 世人
  rationale: 此处无冠词，泛指人类而非名为亚当的个人；“世人”能自然表达集合性泛指。
- source_word: הָבֶל
  choice: 虚空
  rationale: 该词可指气息、蒸气，并由此引申为短暂无实、徒然；本句论及人的思想，用“虚空”保留其无实和徒然的意味，同时与诗篇的庄重语体协调。
- source_word: כִּי
  choice: 知道
  rationale: 在“知道……כי……”结构中引出其所知道的内容；中文重复“知道”可清楚自然地呈现从句关系。
theological_decisions:
- issue: 神对人思想的认识
  choice: 译作“耶和华知道世人的思想，知道它们不过是虚空”
  alternative: “耶和华知道世人的思想，因为它们是虚空”
  rationale: 希伯来语כִּי既可引出内容，也可表达原因；此处内容从句更符合句法和语意，但不作超出原文的神学扩展。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留“虚空”的诗性与神学张力，避免把הבל过度具体化为单纯的“蒸气”，也避免解释性增译。
