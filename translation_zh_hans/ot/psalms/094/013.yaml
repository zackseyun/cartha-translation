  text: לְ/הַשְׁקִ֣יט ל֭/וֹ מִ֣/ימֵי רָ֑ע עַ֤ד יִכָּרֶ֖ה לָ/רָשָׁ֣ע שָֽׁחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/013.yaml
  text: to give him rest from days of trouble[b][a], until a pit is dug for the wicked.
translation:
  language: zh_hans
  text: 使他从患难的日子中得享安宁[a]，直到为恶人挖好坑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他从灾祸的日子中得享安宁。”希伯来语直译为“从邪恶／不好的日子中”；这里指被患难或灾祸所笼罩的时期。
    reason: lexical_alternative
  - marker: b
    text: “坑”也可理解为“毁灭之坑”或坟墓般的深坑；原词除指坑穴外，也可带有毁灭和死亡的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַשְׁקִיט ל֭וֹ
  choice: 使他……得享安宁
  rationale: שׁקט 的使役式不定词表示使某人安静、安稳或不受搅扰；“使他得享安宁”既保留使役含义，也符合现代汉语表达。לוֹ 所指的受益者自然并入“使他”之中。
- source_word: מִימֵי רָע
  choice: 从患难的日子中
  rationale: 该短语直译为“从邪恶／不好的日子中”；上下文侧重艰难、灾祸临到的时期，因此译作“患难的日子”，同时用脚注保留“灾祸的日子”这一较贴近字面的理解。
- source_word: עַד
  choice: 直到
  rationale: 保留该词通常表示时间终点的意义，使安宁与恶人受报之间的时间关系清楚，但不进一步限定这种安宁是外在解脱还是内在安稳。
- source_word: יִכָּרֶה
  choice: 挖好
  rationale: 这是 כרה 的未完成式被动形态，语境中指坑被挖成；汉语“为恶人挖好坑”自然表达被动结果，也带出预备妥当之意。
- source_word: לָרָשָׁע
  choice: 为恶人
  rationale: 单数形容词在此作名词，指一个具有代表性的恶人；汉语“恶人”无需强加单复数，能保留这种概括性。
- source_word: שָׁחַת
  choice: 坑
  rationale: 该名词基本义为“坑”，并可含毁灭、坟墓或陷阱的意味；正文采用最直接且不过度解释的“坑”，较强的毁灭意味留在脚注说明。
theological_decisions:
- issue: 义人在患难中所得安宁的性质
  choice: 译文表达上帝使他从患难的日子中得享安宁，直到恶人受报
  alternative: 理解为患难期间的内在安稳，或专指末世性的安息
  rationale: 介词 מִן 通常表示“从、脱离”，而 עַד 引出安宁所延续至的时间节点。译文保留这种时间推进，却不把安宁严格限定为外在环境的解除，也不将其专门解释为末世安息。
- issue: 为恶人挖坑的意象
  choice: 保留具体的“坑”这一审判意象
  alternative: 直接解释为毁灭、坟墓或最终刑罚
  rationale: שָׁחַת 确有毁灭和坟墓般的内涵，但正文若直接抽象化会消除诗歌意象，并过早判定审判的具体性质；因此正文保留“坑”，脚注说明其语义色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“得享安宁”比“使他安静”更自然，也避免把经文缩减为情绪上的平静；“患难的日子”和“为恶人挖好坑”保留诗篇的时间结构与审判意象。所有脚注标记均置于正文相应词语之后。
