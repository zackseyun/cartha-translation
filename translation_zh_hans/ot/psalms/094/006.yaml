  yaml_path: translation/ot/psalms/094/006.yaml
  text: They kill the widow and the sojourner[b][a]; they murder the fatherless.
translation:
  language: zh_hans
  text: 他们杀害寡妇和寄居者[a]，谋杀孤儿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外来居民”。希伯来语גֵר指住在当地人中间的外族居民。
    reason: lexical_alternative
  - marker: b
    text: 或译“丧父的人”。希伯来语在这里是复数，特指失去父亲庇护的人，也常泛指孤儿。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: 寡妇
  rationale: 希伯来语为单数，在这里泛指这一弱势群体；汉语“寡妇”无需添加复数标记，也能保留这种代表性用法。
- source_word: גֵר
  choice: 寄居者
  rationale: 该词指居住在本地人中间、却不属于本族的外来居民，并非仅仅指过路的陌生人。“寄居者”既保留长期居留和外来身份，也符合庄重而通顺的现代汉语。
- source_word: יַהֲרֹגוּ
  choice: 杀害
  rationale: 该动词通常表示杀死；“杀害”在本语境中自然地表达施暴者杀死弱势者，同时与下句语义更强的“谋杀”有所区别。
- source_word: יְתוֹמִים
  choice: 孤儿
  rationale: 该词为复数，尤可指丧父、失去父亲庇护的人。“孤儿”是现代汉语中最自然的群体称谓，而脚注保留“丧父的人”这一较贴近词形的译法。
- source_word: יְרַצֵּחוּ
  choice: 谋杀
  rationale: רצח带有非法、恶意杀人的道德与法律色彩；“谋杀”保留了这种较强语气，并与前面的普通杀戮动词相区别。
