revisions:
- from: 他们结伙攻击义人的性命[a]，把无辜之人的血判为有罪[b]。
  to: 他们结伙要害义人的性命[a]，定无辜之血有罪[b]。
  rationale: 修订只处理汉语搭配及原文凝缩表达的再现：以“结伙要害”表达集体敌对行动和对生命的威胁，避免将 יָגוֹדּוּ 过度具体化为实际的军事攻击；以“无辜之血”及“定……有罪”保留希伯来原文的血与枉法定罪并置。脚注标记均保留并紧随其所说明的译文成分。
