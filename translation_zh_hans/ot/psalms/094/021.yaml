  timestamp: '2026-07-14T06:51:21Z'
review_pass:
  verdict: revise
  source_fidelity: 上半句的“结伙攻击”基本反映 יָגוֹדּוּ עַל 的集体敌对行动，但“攻击义人的性命”在现代汉语中搭配略生硬；改为“结伙要害义人的性命”，保留对性命的直接威胁而不把动词限定为军事攻击。下半句应保留原文以“无辜之血”为“定罪”对象的刻意而浓缩的司法表达，不应改写成单纯杀害或仅仅给无辜者定罪。
  naturalness: “他们结伙要害义人的性命”庄重、清楚且符合现代标准汉语。 “定无辜之血有罪”虽带有诗歌和法庭语言的张力，但比“把无辜之人的血判为有罪”更凝练，也更贴近希伯来语的直接宾语结构。
  terminology: “义人”恰当保留 צַדִּיק 的代表性单数和经文体语域；“性命”恰当表达 נֶפֶשׁ 在此的具体生命义；“无辜之血”保留 דָם נָקִי 的传统且自然的圣经汉语表达；“定……有罪”准确体现 יַרְשִׁיעוּ 的司法性。
