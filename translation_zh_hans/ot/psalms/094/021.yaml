source:
  edition: WLC
  text: יָ֭גוֹדּוּ עַל נֶ֣פֶשׁ צַדִּ֑יק וְ/דָ֖ם נָקִ֣י יַרְשִֽׁיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/021.yaml
  text: They band together against the life of the righteous[b][a], and they condemn innocent blood.
translation:
  language: zh_hans
  text: 他们结伙要害义人的性命[a]，定无辜之血有罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们聚成一伙，攻击义人的性命。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“无辜之血，他们定为有罪。”也可理解为“他们定无辜者有罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוֹדּוּ
  choice: 结伙攻击
  rationale: 该动词在此可指聚成一伙，也可含有结队发动攻击之意；与介词 עַל 连用时带明显敌对色彩。“结伙攻击”兼顾集体谋害与实际侵害的语境。
- source_word: עַל
  choice: 攻击
  rationale: 此处表示敌对指向；融入动词译为“攻击”，比空间性的“在……之上”自然准确。
- source_word: נֶפֶשׁ
  choice: 性命
  rationale: 这里指义人受到威胁的生命，而非与身体相对的抽象“灵魂”；“性命”也与下半句流血和司法迫害的图景相呼应。
- source_word: צַדִּיק
  choice: 义人
  rationale: 单数形容词作名词用，可指一个义人，也可作为代表性单数泛指义人；“义人”保留这种开放性。
- source_word: דָם נָקִי
  choice: 无辜之人的血
  rationale: 原文直译为“无辜的血”。补出“之人”使现代汉语清楚表明这是无辜者被害流出的血，同时保留鲜明的血与暴力意象。
- source_word: יַרְשִׁיעוּ
  choice: 判为有罪
  rationale: רשע 的使役形在司法语境中常指宣告有罪或定罪；“判为有罪”较完整地呈现原文的司法意味。
theological_decisions:
- issue: צַדִּיק 的代表性单数
  choice: 义人
  alternative: 一个义人／义人们
  rationale: 原文是单数，但可指具体个体，也可作代表性用法。“义人”在汉语中不必明示单复数，因此保留了原文的含混性。
- issue: “无辜之血”作为 יַרְשִׁיעוּ 的宾语
  choice: 把无辜之人的血判为有罪
  alternative: 将无辜者定罪／使无辜者流血
  rationale: 保留原文不寻常的表达，让“血”直接承受司法性的“判罪”，呈现暴力迫害与枉法定罪之间的张力，而不将其简化为单纯杀害或审判。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“结伙攻击”表现共同敌对行动；“性命”避免把 נֶפֶשׁ 灵魂化；下半句刻意保留原文将“无辜之血”作为“判为有罪”对象的浓缩司法意象。
