  text: אֵל נְקָמ֥וֹת יְהוָ֑ה אֵ֖ל נְקָמ֣וֹת הוֹפִֽיַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/001.yaml
  text: O God of vengeance[a], O Yahweh, God of vengeance[b], shine forth!
translation:
  language: zh_hans
  text: 施行报应的上帝啊[a]，耶和华！施行报应的上帝啊，求你显现！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报应”原文为复数，可较直译为“诸般报应”或“报应的作为”；这里很可能用复数加强上帝施行报应的意思。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“显现”“彰显你自己”或“发出光辉”。原词可指上帝以可见、光辉的方式显现。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: 上帝
  rationale: 这里是对以色列之上帝的直接呼求，并与“报应”构成属格关系；“上帝”在现代普通话中自然、庄重，也不会误作泛指某一神明。
- source_word: נְקָמוֹת
  choice: 施行报应的
  rationale: 希伯来语复数在此可表达加强或多次报应之意。“报应”保留神按公义追讨、惩治的语义，而“施行”使中文定语结构自然；不弱化为单纯的“公义”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代简体中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之上帝名字的功能，而不以称号替代。
- source_word: הוֹפִיעַ
  choice: 显现荣光
  rationale: 该使役式祈使动词可指发光、显现，尤其用于上帝彰显自己。“显现荣光”以自然中文传达带有光辉显现意味的命令或祈求，同时脚注保留较直接的译法。
theological_decisions:
- issue: 如何表达上帝的报复／报应
  choice: 保留“施行报应的上帝”
  alternative: “公义的上帝”或“报仇的上帝”
  rationale: 原文明确以 נְקָמוֹת 称呼上帝，不应抽象化为“公义”；“报应”比现代汉语中容易带私人泄愤色彩的“报仇”更能表达上帝按公义追讨恶行，同时仍保留原文令人不安的审判张力。
- issue: הוֹפִיעַ 的显现与发光含义
  choice: 正文译“显现荣光”
  alternative: “显现”或“发出光辉”
  rationale: 原词可强调可见的神圣显现，也带发光、照耀色彩。“显现荣光”兼顾两面而不把它限定为单纯光学现象；脚注说明其他直译可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌呼求语体。重复原文两次“施行报应的上帝”，保留平行结构和强烈语气；以感叹号和“求你”自然表达希伯来语祈使式。脚注标记均置于正文相关句末。
