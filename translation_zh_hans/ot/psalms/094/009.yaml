id: PSA.94.9
reference: Psalms 94:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/נֹ֣טַֽע אֹ֭זֶן הֲ/לֹ֣א יִשְׁמָ֑ע אִֽם יֹ֥צֵֽר עַ֝֗יִן הֲ/לֹ֣א יַבִּֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/009.yaml
  text: He who planted the ear[a], does he not hear? He who formed the eye[b], does he not see?
translation:
  language: zh_hans
  text: 栽下耳朵的[a]，难道听不见吗？塑造眼睛的，难道看不见吗[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “栽下耳朵”也可译作“植入耳朵”。希伯来文动词本义是“栽种”，这里用鲜明的创造意象。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译作“难道不察看吗？”原文动词可指“看、注视、察看”，这里与眼睛的视觉能力相应。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטַע
  choice: 栽下
  rationale: 该分词本义是“栽种”。译作“栽下”保留了诗中鲜明的创造者意象，也比笼统的“造出”更贴近原文；“植入”虽可表达相近意思，却较具现代技术色彩。
- source_word: אֹזֶן
  choice: 耳朵
  rationale: 采用其基本义，并保留希伯来文单数形式，与下句的“眼睛”构成诗意对应。
- source_word: יִשְׁמָע
  choice: 听得见
  rationale: 此处指听觉能力，而非侧重留心聆听或顺从；“听得见”自然地表达反问所指的感知能力。
- source_word: יֹצֵר
  choice: 塑造
  rationale: 该分词含有有意识地塑形、制作之意；“塑造”既保留工匠式的创造意象，也符合现代汉语表达。
- source_word: עַיִן
  choice: 眼睛
  rationale: 采用其基本义，并保留单数概念，与“耳朵”平行。
- source_word: יַבִּיט
  choice: 看得见
  rationale: 该动词可指“看、注视、察看”。这里与眼睛相应，重点在视觉和察见能力，因此正文用自然的“看得见”，脚注保留更贴近字面的可能性。
- source_word: הֲ...הֲלֹא
  choice: 难道……不……吗
  rationale: 这一结构构成期待肯定回答的反问；汉语“难道……不……吗”同时保留反问语气与明确的肯定指向。
- source_word: אִם
  choice: 以并列分句表达，不单独译出
  rationale: 此处 אִם 引出第二个平行反问，并非真正的条件句。汉语直接并列“塑造眼睛的……”最自然，也保留诗句的平行结构。
theological_decisions:
- issue: 以人的听觉和视觉描写上帝的感知
  choice: 保留从创造者到受造物的具体反问，不将其抽象改写
  alternative: 意译为“赐人听觉和视觉的，岂会不知不见”
  rationale: 原文借耳朵和眼睛的创造说明创造者必能听见、察看。保留具体器官及反问形式，可让诗句本身的神学张力和论证力量自然呈现，而不额外界定上帝感知的方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文两个紧凑的平行反问，以及“栽下”这一有意为之的陌生化意象；用“听得见／看得见”清楚表达感知能力，并使两句节奏对应。
