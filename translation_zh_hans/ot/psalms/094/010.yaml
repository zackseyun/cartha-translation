  yaml_path: translation/ot/psalms/094/010.yaml
  text: He who disciplines nations[a], will he not rebuke—he who teaches man knowledge?
translation:
  language: zh_hans
  text: 那管教列国、教导世人知识的，难道不责备吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹסֵר
  choice: 管教
  rationale: 该词表示带有纠正目的的惩戒或训导；“管教”兼顾权柄与纠正之意。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 此处泛指众国或万民，并非专指外邦人；“列国”符合诗篇的庄重语体。
- source_word: יוֹכִיחַ
  choice: 责备
  rationale: 使役式在此表达指责、纠正；“责备”与前句“管教”形成自然的意义平行。
- source_word: הַמְלַמֵּד
  choice: 教导……的
  rationale: 保留希伯来语分词的描述性功能，借此指称上帝。
- source_word: אָדָם
  choice: 世人
  rationale: 此处单数 אָדָם 具有集合性和代表性，指人类；现代汉语“世人”自然、凝练，也不把所指限于男性。
- source_word: דָּעַת
  choice: 知识
  rationale: 直接表达 דָּעַת 的通常含义，并与“教导”自然搭配。
- source_word: הֲ...הֲלֹא
  choice: 难道不……吗
  rationale: 表达期待肯定答案的反问语气，符合现代汉语习惯。
theological_decisions:
- issue: 末句在马所拉文本中的省略与反问结构
  choice: 补出“难道不知道吗”
  alternative: 将“教导世人知识的”悬置为同位语，只让“难道不责备吗”统摄全句
  rationale: 希伯来文末句字面仅为“教导人知识的”，没有明写第二个谓语；但诗歌论证显然借施教者必有知识这一含义推进。中文若完全保留省略会成为残句，因此补出语境隐含的“知道”，同时以脚注说明原文形式，避免掩盖歧义。
- issue: אָדָם 的泛指范围
  choice: 世人
  alternative: 人；人类
  rationale: 该词在这里是代表性单数，泛指人类，而非特指男性个体；“世人”既保留人的具体性，也符合现代汉语诗体。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“列国”“世人”保持经文语体，但避免生硬古奥。主文本中的补足须标注脚注。
