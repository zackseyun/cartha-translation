  yaml_path: translation/ot/psalms/094/016.yaml
  text: Who will rise up for me against evildoers? Who will stand for me against workers of iniquity?[a][b]
translation:
  language: zh_hans
  text: 谁会为我挺身而出，抵挡作恶的人？谁会为我站出来，抵挡作孽的人？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抵挡”所译的希伯来语עִם通常意为“与”或“同”；在这里与恶人相连的敌对语境中，译为“抵挡”。
    reason: lexical_alternative
  - marker: b
    text: “作孽的人”也可译作“行恶的人”或“作恶之人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: 谁会
  rationale: 疑问代词在两个平行问句中重复出现；加“会”自然表达未完成式在修辞问句中的将来或意愿色彩。
- source_word: יָקוּם
  choice: 起来
  rationale: קום的Qal未完成式在此表示起身采取行动；“起来”保留原文鲜明的动作意象。
- source_word: לִי
  choice: 为我
  rationale: 介词ל在这里表示受益或代求关系，即站在诗人一边、为他采取行动。
- source_word: עִם
  choice: 对抗／抵挡
  rationale: עִם通常意为“与……一起”，但这里所接的是敌对的恶人，语境要求理解为与他们交锋；中文用“对抗／抵挡”清楚传达这种敌对关系，同时以脚注保留其字面意义。
- source_word: מְרֵעִים
  choice: 作恶的人
  rationale: 该分词指实行恶事的人；“作恶的人”现代、清楚，也保留行为性的含义。
- source_word: יִתְיַצֵּב
  choice: 挺身而立
  rationale: יצב的Hitpael式表示坚定地站出来或站定位置；“挺身而立”既保留站立意象，也传达公开担当、抗衡的意味。
- source_word: פֹּעֲלֵי אָוֶן
  choice: 作孽的人
  rationale: 这一结构直指持续行恶之人；“作孽的人”简洁庄重，并保留原文“行作”的表达特点。
- source_word: אָוֶן
  choice: 孽
  rationale: אָוֶן在此指道德上的邪恶或罪孽，也可含祸害之意；结合פֹּעֲלֵי，译作“作孽”最符合上下文。
