  text: וַ֭/יֹּ֣אמְרוּ לֹ֣א יִרְאֶה יָּ֑הּ וְ/לֹא יָ֝בִ֗ין אֱלֹהֵ֥י יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/007.yaml
  text: And they say[a], “Yah does not see, and the God of Jacob does not understand.”
translation:
  language: zh_hans
  text: 他们说：“雅（Yah）[a]看不见；雅各的上帝也不明白。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文“雅（Yah）”是上帝之名在诗歌中的短式；可比较较常见、通常译作“耶和华”的完整形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 该形式在诗歌语境中可用于呈现恶人惯常的言论；用现在时“说”自然承接本诗对其持续行为的描写，同时不把话语限定为一次过去事件。
- source_word: לֹא יִרְאֶה
  choice: 看不见
  rationale: ראה在此保留视觉感知的具体意象，表达恶人声称上帝没有察看他们的恶行；“看不见”简洁自然，也保留其挑衅语气。
- source_word: יָּהּ
  choice: 雅
  rationale: 这是神名的诗歌短式יָהּ，而非完整形式יהוה；音译为“雅”可保留原文形式上的区别，避免将其抹平为通常译作“耶和华”的完整神名。
- source_word: וְלֹא יָבִין
  choice: 也不明白
  rationale: בין通常指明白、理解或辨察；此处恶人否认上帝对其行为的认知，“不明白”直接、自然，并保留原文宽泛的认知含义。
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: 雅各的上帝
  rationale: 这是指向以色列之上帝的圣约性称号；“雅各的上帝”透明而符合现代汉语表达。
theological_decisions:
- issue: 神名诗歌短式יָּהּ的译法
  choice: 雅
  alternative: 耶和华
  rationale: 原文特意使用יָּהּ，而不是完整神名יהוה。译作“雅”并加注，既保存短式的诗歌特色，也不将它与完整形式混同。
- issue: 恶人所否认的是上帝的能力还是当下认知
  choice: 保留“看不见／不明白”的直陈说法
  alternative: “不会察看／不会留意”
  rationale: 原文可涉及上帝是否察知恶行，却没有明确限定为能力不足、意愿缺失或未来不施审判；直译可保留这种神学张力，不替说话者补足动机。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他们说”呈现恶人惯常的言论；分号保留两个并列否定句的力度。脚注解释较少见的神名短式。
