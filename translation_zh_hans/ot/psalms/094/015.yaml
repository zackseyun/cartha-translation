  text: כִּֽי עַד צֶ֭דֶק יָשׁ֣וּב מִשְׁפָּ֑ט וְ֝/אַחֲרָ֗י/ו כָּל יִשְׁרֵי לֵֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/015.yaml
  text: For judgment will return to righteousness[b][a], and all the upright in heart will follow after it.
translation:
  language: zh_hans
  text: 因为审判必重归公义[a]，所有心里正直的人都必跟随它[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判”也可译作“正义”，“公义”也可译作“正义”或“正道”。原文使用两个不同但意义相近的词。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“而在它之后，是所有心里正直的人”；意思可能是心里正直的人跟随它，或与它站在一起。“它”最自然地指“审判”，也可能宽泛地指前述公义的秩序。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为诗人的确信提供理由；“因为”在现代汉语中自然清楚。
- source_word: עַד צֶדֶק
  choice: 归公义
  rationale: עַד 与“返回”动词连用，表示趋向；צֶדֶק 译作“公义”，既表达合乎正道的标准，也与 מִשְׁפָּט 保持词义区别。
- source_word: יָשׁוּב
  choice: 必重归
  rationale: 保留 שוב“返回、归回”的基本含义；“重归”暗示审判将重新与公义相合，“必”传达未完成式在此语境中的确定将来意味。
- source_word: מִשְׁפָּט
  choice: 审判
  rationale: 该词可指审判、公断或正义；译作“审判”可避免与 צֶדֶק 合并为同一中文词，同时保留司法和施行判断的色彩。
- source_word: וְאַחֲרָיו
  choice: 都必跟随它
  rationale: 字面为“而在它之后”；中文补出语境所含的“跟随”，并用“它”回指最近的阳性名词“审判”。
- source_word: כָּל יִשְׁרֵי לֵב
  choice: 所有心里正直的人
  rationale: 以自然现代汉语表达“所有内心正直者”，保留 לֵב 所指的内在道德取向。
theological_decisions:
- issue: “审判”与“公义”的关系
  choice: 审判必重新归向并符合公义
  alternative: 审判将持续到公义实现；或将两个词都理解为“正义”
  rationale: יָשׁוּב 的通常意义是“返回”，与 עַד צֶדֶק 连用最自然地表达趋向和恢复；译文不进一步规定这种恢复如何实现。
- issue: וְאַחֲרָיו 中后缀的所指
  choice: 以“它”回指“审判”
  alternative: 将其宽泛理解为“公义”，或保留为无动词结构“所有心里正直的人都在它之后”
  rationale: 最近且语法性别相符的先行词是 מִשְׁפָּט；脚注保留字面结构和语义范围，避免把所指绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“审判必重归公义”保留希伯来诗句的凝练和神学张力；“心里正直的人”比“正心者”更易为普通读者理解。所有脚注标记均置于正文相应位置。
