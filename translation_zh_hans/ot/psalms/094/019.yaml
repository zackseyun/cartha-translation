  yaml_path: translation/ot/psalms/094/019.yaml
  text: When my anxious thoughts are many within me[b][a], your consolations delight my soul.
translation:
  language: zh_hans
  text: 当我内心纷乱的思绪繁多时[a]，你种种的安慰使我的心灵欢畅[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当我里面充满令人不安的思绪时。”这里的希伯来语名词可指纷扰、分岔或彼此纠缠的思绪。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你种种的安慰使我的心灵喜乐。”原文“安慰”是复数。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב
  choice: 层出不穷时
  rationale: בְּ加上רֹב表示“在众多之中”或“当……增多时”。结合本句处境，用“层出不穷时”自然表达这些思绪数量繁多、不断涌现的情形。
- source_word: שַׂרְעַפַּי
  choice: 我……纷乱的思绪
  rationale: 该词指令人不安、分岔或彼此纠缠的思想，不是中性的“想法”。“纷乱的思绪”既保留内心扰动的含义，也符合现代汉语表达。
- source_word: בְּקִרְבִּי
  choice: 我内心
  rationale: 原文意为“在我里面”。“我内心”简洁自然，并明确这是诗人内部的思想活动。
- source_word: תַּנְחוּמֶיךָ
  choice: 你种种的安慰
  rationale: 原文为复数。“种种的安慰”保留复数所传达的多方面安慰，同时避免生硬的“诸安慰”。
- source_word: יְשַׁעַשְׁעוּ
  choice: 使……欢畅
  rationale: 该动词可表示使人愉悦、欣喜或得到舒慰。“欢畅”兼有喜乐和内心舒展之意，适合诗歌语境。
- source_word: נַפְשִׁי
  choice: 我的心灵
  rationale: נֶפֶשׁ在此指诗人的内在自我。“心灵”比单纯的“心”更充分，也不把该词限定为与身体对立的实体性“灵魂”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“层出不穷”体现思绪众多且不断涌现；“种种的安慰”明确保留希伯来语复数；整体不把诗句的心理描写过度术语化。
