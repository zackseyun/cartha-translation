  yaml_path: translation/ot/psalms/094/008.yaml
  text: Understand, you brutish among the people; and you fools, when will you become wise?
translation:
  language: zh_hans
  text: 民中愚昧无知的人啊，你们要省悟！愚昧人哪，你们到几时才会明智？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּינוּ
  choice: 要明白
  rationale: 希伯来语命令式，既可指理解，也含醒悟之意；“要明白”直接保留命令语气。
- source_word: בֹּעֲרִים
  choice: 畜类
  rationale: 该词形容像牲畜一样缺乏理性的人；“畜类”保留原文尖锐、贬斥性的比喻，避免弱化为一般的“无知”。
- source_word: בָּעָם
  choice: 民中的
  rationale: 按介词与名词的自然意义译为“民中的”，不额外限定所指群体。
- source_word: כְסִילִים
  choice: 愚昧人
  rationale: 智慧文学常用词，指拒绝智慧、顽固愚昧的人；“愚昧人”比单纯智力意义上的“笨人”更贴切。
- source_word: מָתַי תַּשְׂכִּילוּ
  choice: 你们到几时才有智慧
  rationale: 保留反问结构；动词可指明智行事或获得洞察，“有智慧”在现代汉语中自然，并维持其语义宽度。
theological_decisions:
- issue: “愚昧”是否仅指智力不足
  choice: 保留智慧传统中的道德与属灵责问，不解释为单纯智力低下
  alternative: 译作“笨人”或“蠢人”
  rationale: בֹּעֵר 与 כְּסִיל 在此谴责拒绝认识和领悟的状态，不宜缩减为能力问题；同时正文不添加超出本节的教义说明。
translation_notes:
  register: 采用庄重而直接的责问语气。“畜类”刻意保留原文粗厉的动物性比喻；两个呼语分别用“啊／哪”，使现代普通读者易于听出平行结构。
