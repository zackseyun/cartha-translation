  source_fidelity: 原文以两个并列呼语责备“民中”的愚钝者和愚昧者；命令式“要省悟”及反问“到几时才会明智”均能保留其直接、尖锐的责问。原文的בֹּעֲרִים意为粗野、愚钝、缺乏悟性者，虽带有动物般无理性的比喻色彩，却不是指称“畜类”的名词。
  naturalness: “民中的畜类”在现代普通话中不自然，容易被理解为“民众中的牲畜／动物类别”，而非对人的责骂；“民中愚昧无知的人”清楚自然，并维持庄重责问语气。
