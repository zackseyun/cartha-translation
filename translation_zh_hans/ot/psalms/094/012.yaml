base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/012.yaml
  text: Blessed is the man whom you discipline[a], O Yah, and teach out of your law[e][d][c][b],
translation:
  language: zh_hans
  text: 雅啊，你所管教、并从你的律法中教导的人，是有福的！[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福”也可译作“幸福”；原文表达蒙福、幸福或兴盛的状态。
    reason: lexical_alternative
  - marker: b
    text: “雅”对应原文神名的诗歌短式 Yah，不同于通常译作“耶和华”的完整形式。
    reason: lexical_alternative
  - marker: c
    text: “律法”也可译作“训诲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 是有福的
  rationale: 采用现代中文常见的祝福宣告句式，既表达蒙福、幸福和兴盛之意，也保留诗篇智慧文学庄重的神学色彩。
- source_word: הַגֶּבֶר
  choice: 人
  rationale: 此处阳性单数名词指一个代表性个体；中文“人”自然涵盖这种泛指意义，无须生硬地译作“男人”。
- source_word: תְּיַסְּרֶנּוּ
  choice: 你所管教
  rationale: Piel词形表达带有纠正和塑造作用的管教，不只是一般教导；“管教”准确且符合现代中文。
- source_word: יָּהּ
  choice: 耶啊
  rationale: 原文是神名的诗歌短式“Yah”，不是完整的四字神名；“耶”予以区别，“啊”体现直接呼告。
- source_word: וּמִתּוֹרָתְךָ
  choice: 从你的律法中
  rationale: 保留介词“从”所表示的教导来源；“律法”是诗篇语境中清楚而传统的译法，同时脚注说明其较广的“训诲”义。
- source_word: תְלַמְּדֶנּוּ
  choice: 又……教导
  rationale: 准确表达Piel“教导”，并以“又”连接同一关系从句中的两个并列动作。
theological_decisions:
- issue: 神名短式 יָּהּ 的译法
  choice: 耶啊
  alternative: 耶和华啊
  rationale: 源文特意使用神名短式而非完整的יהוה；译作“耶”保留这一诗体差异，不把两种形式合并。
- issue: הַגֶּבֶר 的代表性与性别表达
  choice: 人
  alternative: 男子
  rationale: 希伯来文虽为阳性单数，但此福语所指是接受神管教和教导的代表性个人。现代汉语“人”能忠实表达泛指，不会额外限定为成年男性。
- issue: תּוֹרָה 的语义范围
  choice: 律法
  alternative: 训诲
  rationale: “律法”保留诗篇中对神所赐规范性启示的传统称谓；脚注同时保留该词可指更广义“训诲”的真实语义空间。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将福语谓语后置，使包含两个并列动作的关系结构清楚流畅；保留对神的直接呼告和“管教—教导”的对应关系。
