base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/005.yaml
  text: O Yahweh[b][a], they crush your people and afflict your inheritance.
translation:
  language: zh_hans
  text: 耶和华啊，他们压碎你的子民，苦害你的基业[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基业”也可译作“产业”或“承受的份”，指经承受或分配而归属某人的份。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמְּךָ
  choice: 你的子民
  rationale: עַם 在这里指属于耶和华的群体；“你的子民”自然体现其归属与圣约语境。
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 原文是直接呼告神的专名 יהוה；采用现代中文圣经读者熟悉的音译“耶和华”，并以“啊”表达呼格。
- source_word: יְדַכְּאוּ
  choice: 压碎
  rationale: דכא 的 Piel 形式带有压碎、压垮的强烈意象；“压碎”保留原文力度，而不弱化为一般性的欺压。
- source_word: וְנַחֲלָתְךָ
  choice: 你的产业
  rationale: נַחֲלָה 指承受或分得的产业，也可指归某人所有的份；此处用“你的产业”表达以色列属于耶和华。
- source_word: יְעַנּוּ
  choice: 苦害
  rationale: ענה 的 Piel 形式在此指使人受苦、虐待或压迫；“苦害”与前句“压碎”有别，同时保留行为的严重性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 保留原文的专名性质，不以“主”这一称号替代；“耶和华”是现代中文普通读者最熟悉且庄重的专名形式。
- issue: נַחֲלָה 指神的百姓时的表达
  choice: 你的产业
  alternative: 你的基业
  rationale: 选择较易为现代读者理解的“产业”，同时保留百姓是耶和华所属之份的比喻，不把它解释性改写为单纯的“所有物”。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。两个并行分句分别用“压碎”和“苦害”，保留希伯来文两个动词的区别与递进力度。
