  text: תַּעֲרֹ֬ךְ לְ/פָנַ֨/י שֻׁלְחָ֗ן נֶ֥גֶד צֹרְרָ֑/י דִּשַּׁ֖נְתָּ בַ/שֶּׁ֥מֶן רֹ֝אשִׁ֗/י כּוֹסִ֥/י רְוָיָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/005.yaml
  text: You set a table before me in the presence of my enemies[a]; you anoint my head with oil[b]; my cup overflows.
translation:
  language: zh_hans
  text: '你在我仇敌面前，

    为我摆设桌子[a]；


    你用油滋润我的头[b]；


    我的杯满溢。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “桌子”原文可指供餐饮用的桌子。原文动词可指排列、摆好或预备；整句描绘主人摆桌设宴、款待宾客。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“你用油使我的头丰润”。这里描绘慷慨的款待、滋润和尊荣；所用动词并非通常表示膏立的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲרֹךְ
  choice: 摆设
  rationale: 该动词表示排列、布置或预备。与“桌子”连用时，是摆好供宴饮之用；“摆设”既保留布置的动作，也符合现代汉语的宴席表达。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 直译为“在我面前”，可表达空间上的临近，也突出主人亲自为诗人预备款待。
- source_word: שֻׁלְחָן
  choice: 筵席
  rationale: 原词本义是“桌子”，此处处于款待和饮宴的意象中。汉语“摆设筵席”比“摆设桌子”自然，并能传达摆桌设宴的整体场景；本义在脚注中说明。
- source_word: נֶגֶד צֹרְרָי
  choice: 当着我仇敌的面
  rationale: נֶגֶד 可表示在对面、在眼前或在场；此译清楚表达仇敌近在现场、亲眼看见的意味，同时不增添他们具体的反应。
- source_word: דִּשַּׁנְתָּ בַשֶּׁמֶן
  choice: 用油滋润
  rationale: דשׁן 的基本意象与肥美、丰厚有关，在这里表示用油使头丰润、受到优厚款待。“滋润”自然地保留油带来的丰润感，又避免把该词等同于专指膏立的 מָשַׁח。
- source_word: רֹאשִׁי
  choice: 我的头
  rationale: 保留原文具体的身体意象。
- source_word: כּוֹסִי רְוָיָה
  choice: 我的杯满得溢出
  rationale: רְוָיָה 表示饱足、充盈或丰盛。译成“满得溢出”以自然汉语呈现杯中丰盛到溢流的画面。
theological_decisions:
- issue: 用油款待的意象是否译作具有专门宗教意味的“膏抹”
  choice: 你用油滋润我的头
  alternative: 你用油膏抹我的头
  rationale: 原文使用 דשׁן，而不是通常表示膏抹或膏立的 מָשַׁח。上下文是摆席、杯满的款待场景，因此正文保留丰厚滋润和尊荣款待的含义，不把后来的君王、祭司或圣礼含义带入本节。
- issue: 希伯来诗歌中动词体貌的呈现
  choice: 采用现代汉语不标明完成体的生动陈述：“摆设……滋润……满得溢出”
  alternative: 译为完成式：“已经摆设……已经滋润……”
  rationale: 原文诗歌形式可作为生动而持续有效的描写理解。现代汉语无需强加“已经”，从而避免过度限定时间和体貌。
- issue: 仇敌在场的含义
  choice: 当着我仇敌的面
  alternative: 面对我的仇敌／不顾我的仇敌
  rationale: 译文只表达仇敌在场见证，不推断这是挑衅、胜利宣告或仇敌已被击败，从而保留原文的空间和修辞张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语，并按诗行呈现。保留第二人称直接称呼和宴饮款待的连贯意象；避免使用容易被理解为专门宗教仪式的术语。
