source:
  edition: WLC
  text: נַפְשִׁ֥/י יְשׁוֹבֵ֑ב יַֽנְחֵ֥/נִי בְ/מַעְגְּלֵי צֶ֝֗דֶק לְמַ֣עַן שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/003.yaml
  text: He restores my soul[c][b][a]; he leads me in paths of righteousness for the sake of his name.
translation:
  language: zh_hans
  text: '他使我的生命复苏[a]；

    他引导我走在公义的路上[b]，

    为了自己的名[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他使我恢复生机”或“他使我归回”。原文的“我的生命”（נֶפֶשׁ）也可指我整个人，而不只指人的非物质部分。
    reason: lexical_alternative
  - marker: b
    text: 或译“正直的路”、“正确的路”或“正义的路”。原文词可表示公义、正直、正确或合宜。
    reason: lexical_alternative
  - marker: c
    text: “为了自己的名”指上帝顾念并彰显自己的品格和声誉。
    reason: cultural_note
lexical_decisions:
- source_word: נַפְשִׁי
  choice: 我（在“使我恢复生机”中）
  rationale: נֶפֶשׁ在此可指人的生命或整个自我，不宜限定为与身体分离的“灵魂”。汉语用“我”自然地涵盖整个人，并由“恢复生机”表达生命得以复原。
- source_word: יְשׁוֹבֵב
  choice: 使……恢复生机
  rationale: 该词源于שׁוב，可表示使返回、使恢复或使复苏。“恢复生机”在牧者照料的诗歌语境中自然，同时保留复原、振作和复苏的含义；“领我归回”也是可能的理解，故列入脚注。
- source_word: יַנְחֵנִי
  choice: 他引导我走
  rationale: נחה的使役词干常表示引领、引导。加“走”符合现代汉语搭配，也延续牧人带领羊群的意象。
- source_word: בְמַעְגְּלֵי
  choice: 路
  rationale: מַעְגָּל指路径、车辙或行走的路线。汉语“走……的路”简洁自然，并能承载实际道路与人生道路的双重意象。
- source_word: צֶדֶק
  choice: 正义的
  rationale: צֶדֶק可指公义、正义、正直或正确。这里采用“正义”以保留道德与公义层面，同时不排除“正确的路”这一具体含义。
- source_word: לְמַעַן
  choice: 为了
  rationale: לְמַעַן表达目的或所顾念的缘由；“为了”在现代汉语中简明自然。
- source_word: שְׁמוֹ
  choice: 自己的名
  rationale: שֵׁם字面是“名”，也可涵盖名誉、声望和所彰显的品格。正文保留“名”的经文意象，其含义由脚注说明。
theological_decisions:
- issue: “使我的נֶפֶשׁ恢复”的含义
  choice: 理解为诗人的生命乃至整个人在牧者照料下得到恢复和复苏，译作“使我恢复生机”。
  alternative: “使我的灵魂苏醒”、“使我的生命复苏”或“领我归回”。
  rationale: נֶפֶשׁ并非只指非物质的灵魂；שׁוב的使役形式又容许“使恢复、使复苏”和“使归回”等理解。正文采用自然、整体性的表达，脚注保留其真实的词义幅度。
- issue: “正义的路”的含义
  choice: 理解为具有正义、正直性质的道路，即在上帝引导下合宜的生活道路。
  alternative: “正确的路”或“公义的路”。
  rationale: צֶדֶק既可能强调道德公义，也可能在此形容正确、合宜的路径。“正义的路”保留伦理张力，脚注则说明其他合理读法。
- issue: “为了自己的名”的含义
  choice: 保留“名”的原文意象，理解为上帝顾念并彰显自己的品格、信誉和荣耀。
  alternative: “为了自己的名誉”或“因自己的名”。
  rationale: 直译“名”维持经文中上帝之名的神学与诗歌共鸣，但不把它缩减为现代意义上的称谓；脚注说明其文化语义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。三行结构保留希伯来诗句的节奏与平行感；“恢复生机”避免把נֶפֶשׁ窄化为与身体分离的灵魂，“正义的路”则保留צֶדֶק的伦理含义及其可指正确路径的张力。
