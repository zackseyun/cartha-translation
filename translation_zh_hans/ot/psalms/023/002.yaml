  text: In grassy pastures he makes me lie down[a]; beside restful waters he leads me.
translation:
  language: zh_hans
  text: 他使我躺卧在青草地上，领我到使人安歇的水边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“平静的水边”或“宁静的水边”。希伯来语这一表达强调与安歇、休憩相联的水。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְאוֹת דֶּשֶׁא
  choice: 在青草地上
  rationale: נְאוֹת指适合羊群栖息、吃草的草场或牧地，דֶּשֶׁא指鲜嫩青草或草木；合译为“青草地”自然简洁，也保留牧羊图景。
- source_word: יַרְבִּיצֵנִי
  choice: 他使我躺卧
  rationale: רבץ的使役式表达“使……躺下”；保留使役含义，不抽象改写为“使我安息”。
- source_word: עַל מֵי מְנֻחוֹת
  choice: 到安歇的水边
  rationale: עַל在此表示临近水边；מְנֻחוֹת着重安歇、休憩，译文保留这一语义联系，而不只强调水面静止。
- source_word: יְנַהֲלֵנִי
  choice: 领我
  rationale: נהל在此指带领、引导，并带有牧者照料羊群的语境；“领我”简练自然，保留牧羊意象。
theological_decisions:
- issue: מְנֻחוֹת应侧重“安歇”还是水的“平静”
  choice: 安歇的水边
  alternative: 平静的水边；宁静的水边
  rationale: 该词首先与安息、休憩相关，并未明确只指水流静止；正文保留“安歇”的词义重心，同时在脚注中列出传统且合理的替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“青草地”保持诗歌的自然意象；“安歇的水边”略具诗意，并有意保留希伯来语关于安息的语义重点。
