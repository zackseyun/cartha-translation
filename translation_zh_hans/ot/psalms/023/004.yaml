source:
  edition: WLC
  text: גַּ֤ם כִּֽי אֵלֵ֨ךְ בְּ/גֵ֪יא צַלְמָ֡וֶת לֹא אִ֘ירָ֤א רָ֗ע כִּי אַתָּ֥ה עִמָּדִ֑/י שִׁבְטְ/ךָ֥ וּ֝/מִשְׁעַנְתֶּ֗/ךָ הֵ֣מָּה יְנַֽחֲמֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/004.yaml
  text: Even though I walk through the valley of deep darkness[a], I will fear no evil, for you are with me; your rod and your staff—they comfort me.
translation:
  language: zh_hans
  text: 即使我走过幽暗的山谷[a]，也不怕任何祸害，因为你与我同在；你的棍棒和手杖——它们安慰我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“死荫的山谷”。希伯来语可指极深的黑暗，也可能带有死亡的意味。
    reason: 保留צַלְמָוֶת的重要传统译法及其死亡联想，同时不在正文中排除较宽泛的“深暗”含义。
lexical_decisions:
- source_word: גַּם כִּי
  choice: 即使
  rationale: 该组合在这里引出让步情形；“即使”自然、简洁地表达“纵然如此”的语气。
- source_word: אֵלֵךְ
  choice: 我走过
  rationale: 未完成式在诗中描写生动而开放的行动；结合山谷意象，“走过”比单说“去”更自然。
- source_word: בְּגֵיא
  choice: 山谷
  rationale: גֵיא可指谷地或峡谷；此处不必限定地貌细节，“山谷”既自然，也保留诗歌意象。
- source_word: צַלְמָוֶת
  choice: 幽暗
  rationale: 该词可表示极深的黑暗，并可能含有死亡意味。“幽暗”避免把死亡定为唯一词义，同时保留阴森危险的氛围；传统译法另列脚注。
- source_word: לֹא אִירָא רָע
  choice: 也不怕祸患
  rationale: רָע在此可涵盖邪恶、灾害、危险或伤害；“祸患”在中文语境中能自然表达行经险境时可能临到的恶事，又不把所指限于单一灾难。
- source_word: כִּי אַתָּה עִמָּדִי
  choice: 因为你与我同在
  rationale: 直陈诗人无惧的原因，并保留从第三人称谈论上帝转为第二人称直接呼告的变化。
- source_word: שִׁבְטְךָ
  choice: 你的棍
  rationale: 在牧羊语境中指牧人用于护卫或管束的棍棒；“棍”可与下文支撑行走的“杖”区分。
- source_word: וּמִשְׁעַנְתֶּךָ
  choice: 你的杖
  rationale: 该词源于“倚靠、支撑”的概念，在牧羊图景中指可供支撑的手杖；中文用“杖”简洁而贴切。
- source_word: הֵמָּה
  choice: 它们
  rationale: 希伯来文独立代词带强调作用；中文保留“它们”，并用破折号凸显“正是这两样”带来安慰。
- source_word: יְנַחֲמֻנִי
  choice: 安慰我
  rationale: “安慰”直接涵盖在危险中受到抚慰、鼓舞和安心的意思，也符合庄重诗体。
theological_decisions:
- issue: צַלְמָוֶת这一传统名句中的含义
  choice: 幽暗
  alternative: 死荫
  rationale: 原词首先可指浓重、深沉的黑暗，但也可能带有死亡联想。正文不把“死亡”设为唯一解释，同时以脚注保存传统译法及其真实语义可能性。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“即使……也……”表达让步关系；分号保持前后因果与牧人意象的节奏；破折号和明确代词再现希伯来文הֵמָּה的强调。
