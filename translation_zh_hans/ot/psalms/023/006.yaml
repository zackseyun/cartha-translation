  text: אַ֤ךְ ט֤וֹב וָ/חֶ֣סֶד יִ֭רְדְּפוּ/נִי כָּל יְמֵ֣י חַיָּ֑/י וְ/שַׁבְתִּ֥י בְּ/בֵית יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/006.yaml
  text: Surely goodness and steadfast love will pursue me all the days of my life[c][b][a], and I will dwell in the house of Yahweh for length of days.
translation:
  language: zh_hans
  text: 我一生的日子，良善和慈爱必追赶我[a]；我必住在耶和华的殿中[b]，度过漫长的岁月[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必跟随我”。原文动词通常指追赶、追逐，描绘良善和慈爱主动追上诗人，而不只是跟在他后面。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我必回到耶和华的殿中”。马所拉文本的读音支持“住”，但“回到”是由来已久的另一种理解。
    reason: alternative_reading
  - marker: c
    text: 或译：“直到永远”。原文直译为“直到日子的长久”，表示绵延长久的时日。
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: 必
  rationale: 此处表达确信而非限制；汉语用“必”与后面的未完成式相配，自然传达诗人坚定的把握。
- source_word: טוֹב
  choice: 恩惠
  rationale: 此词在这里与“慈爱”并列，指上帝施予人的良善福泽；“恩惠”比抽象的“良善”更自然地表达其惠益作用。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: “慈爱”在庄重而通行的现代汉语中能兼顾怜爱、忠贞与持久关爱；不将其收窄为单纯的“怜悯”，也不在正文中加上“圣约”这一解释。
- source_word: יִרְדְּפוּנִי
  choice: 追随着我
  rationale: 希伯来语动词本义是“追赶、追逐”。“追随着”保留主动追赶的画面，同时避免汉语“追逐我”可能产生的敌意或猎捕意味；脚注说明其力度。
- source_word: כָּל יְמֵי חַיָּי
  choice: 我一生的年日
  rationale: 保留“所有日子”的时间意象，并以自然、庄重的汉语表达整个一生。
- source_word: וְשַׁבְתִּי
  choice: 我也要住
  rationale: 马所拉读音按 ישׁב 理解，最自然是“居住”；“返回”作为历史悠久的异读保留在脚注中。
- source_word: בְּבֵית יְהוָה
  choice: 在耶和华的殿中
  rationale: “殿”在诗篇语境中自然指耶和华的圣所，也保留具体的敬拜空间意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式“耶和华”，明确保留专名而非以称号替代。
- source_word: לְאֹרֶךְ יָמִים
  choice: 直到长久的年日
  rationale: 尽量保留希伯来语“日子的长久”这一开放性的诗歌表达，不在正文中直接将其解释为无穷尽的“永远”。
theological_decisions:
- issue: לְאֹרֶךְ יָמִים 所表达的持续时间
  choice: 直到长久的年日
  alternative: 直到永远
  rationale: 原文可指长久、终身或延续不止的时日，传统上也常译作“永远”。正文保留较为字面的开放性，脚注列出更强的解释性译法，以免消除其神学张力。
- issue: וְשַׁבְתִּי 的词义
  choice: 我也要住
  alternative: 我也要回到
  rationale: 马所拉文本的读音自然支持“住”；由于“回到”是影响全句图像的长期异读，故在脚注中保留，而不默然排除。
translation_notes:
  register: 采用现代、庄重且适合诵读的简体中文。句式保留希伯来诗歌的时间意象和拟人画面；神名译作“耶和华”。所有脚注标记均置于其所说明的正文成分之后。
