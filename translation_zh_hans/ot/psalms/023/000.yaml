  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/000.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
translation:
  language: zh_hans
  text: '大卫的诗[a]。

    耶和华[b]是我的牧者；我必一无所缺。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“大卫所作的诗”“献给大卫的诗”或“与大卫有关的诗”；希伯来语标题לְדָוִד可表示作者、奉献对象或关联。
    reason: alternative_reading
  - marker: b
    text: 原文为神名四字母YHWH，犹太诵读传统以“主”代读；这里译作“耶和华”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 指配以音乐吟唱的诗歌；在诗篇标题中译作“诗”自然、简明。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 希伯来语介词短语可表示作者、归属、奉献对象或关联；正文采用中文标题中最自然的“大卫的”，并以脚注保留歧义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是神名四字母YHWH；采用现代中文圣经读者熟悉的专名“耶和华”，而不以称号“主”代替。
- source_word: רֹעִי
  choice: 我的牧者
  rationale: 保留牧养羊群的核心比喻及第一人称所属关系；“牧者”庄重且适合现代中文。
- source_word: לֹא אֶחְסָר
  choice: 我必一无所缺
  rationale: 该未完成式在此表达因耶和华牧养而有的确信；“一无所缺”准确传达“不缺乏”，又不误解为没有愿望。
theological_decisions:
- issue: לְדָוִד所表达的大卫关系
  choice: 正文译“大卫的”，脚注说明可指大卫所作、献给大卫或与大卫有关
  alternative: 直接译“大卫作的诗”
  rationale: 原文介词לְ的语义范围不只限于作者身份，不应在正文中无提示地排除其他可能。
- issue: 神名YHWH的呈现
  choice: 译作专名“耶和华”并加注说明
  alternative: 译作“主”
  rationale: 专名呈现能保留本句中以色列之神的立约名字与“我的牧者”之间的直接关系，同时脚注说明其原文形式及传统读法。
- issue: לֹא אֶחְסָר的语气
  choice: 译作“我必一无所缺”
  alternative: “我什么都不缺”或“我将不至缺乏”
  rationale: “必”体现诗人的信赖与确信，但不额外断言一种脱离语境的物质丰裕神学；所缺为何由整首诗的牧养图景界定。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。标题独立成行，正文以分号连接牧者比喻及其结果。保留“牧者”这一贯穿全诗的具体意象；用“一无所缺”避免“无欲无求”等偏离原义的理解。所有脚注标记均置于正文相应词语之后。
