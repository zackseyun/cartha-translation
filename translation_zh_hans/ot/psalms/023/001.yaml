  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/001.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will not lack.
translation:
  language: zh_hans
  text: '大卫的诗[a]。


    雅威[b]是我的牧者；我必不致缺乏[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大卫所作的诗”或“献给大卫的诗”。希伯来语标题לְדָוִד可表示作者、归属、献呈或关联。
    reason: alternative_reading
  - marker: b
    text: 希伯来文为YHWH，即上帝的四字神名；传统中文译本常译作“耶和华”或以“主”代称。
    reason: lexical_alternative
  - marker: c
    text: 或译“我一无所缺”。这里的“缺乏”是缺少、匮乏之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中的体裁名称，指配乐吟唱的诗歌；中文圣经语境中以“诗”表达最简洁自然。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词לְ在诗篇标题中可表示作者、归属、献给或关联。“大卫的”保留这种宽泛关联，不武断限定为“大卫所作”或“献给大卫”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译直接呈现四字神名，而不以“耶和华”这一传统混合读音或“主”这一称号替代。
- source_word: רֹעִי
  choice: 我的牧者
  rationale: 该词来自“牧放”一词，指照管羊群的人。“我的牧者”自然保留了原文第一人称所属关系及牧羊人的比喻。
- source_word: לֹא אֶחְסָר
  choice: 我必不致缺乏
  rationale: חסר表示缺少、匮乏；未完成式在此可表达持续确信或面向将来的结果。“必不致缺乏”既符合现代汉语，也不把所缺之物擅自补成“一切”或“好处”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的四字神名。音译为“雅威”保留其专名性质，避免用称号替代，也不采用较晚形成的混合读音。
- issue: 标题לְדָוִד所表达的关系
  choice: 大卫的诗
  alternative: 大卫所作的诗；献给大卫的诗
  rationale: 希伯来语介词לְ可表达作者、归属、献呈或关联。正文采用较宽泛的“大卫的诗”，并以脚注保留真实歧义，不把它单一定为作者署名。
- issue: לֹא אֶחְסָר的时间与语气
  choice: 我必不致缺乏
  alternative: 我并不缺乏；我一无所缺
  rationale: 希伯来语未完成式可依语境表示当前持续状态、将来结果或带确信的陈述。“必不致缺乏”传达诗人的信赖，但不把它扩写为物质富足的保证。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“大卫的诗”用简洁标题体保留原文关系上的歧义；“牧者”比“牧人”略具诗体庄重感，同时仍为普通读者熟悉；分号呈现神为牧者与诗人不致缺乏之间紧密的因果联系。
