  yaml_path: translation/ot/psalms/074/019.yaml
  text: Do not give your dove to the ravenous beast; do not forget the lives of your afflicted ones forever.
translation:
  language: zh_hans
  text: 不要把你斑鸠的性命交给野兽[a]；不要永远忘记你受苦之人的性命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可译作：“不要把你的斑鸠交给贪食的野兽。”希伯来语“חַיַּת נֶפֶשׁ”的组合关系存在歧义：可将“野兽”与“你斑鸠的性命”分别理解为间接宾语和直接宾语，也可将其整体理解为“贪食的野兽”。
    reason: 保留原文中חַיַּת נֶפֶשׁ的句法和语义歧义。
lexical_decisions:
- source_word: תּוֹרֶךָ
  choice: 你的斑鸠
  rationale: תּוֹר意为“斑鸠”，这里以脆弱的鸟比喻属神的群体；保留原文意象，不在正文中直接释为“子民”。
- source_word: חַיַּת נֶפֶשׁ
  choice: 性命……野兽
  rationale: 按原文句法将נֶפֶשׁ תּוֹרֶךָ理解为“你斑鸠的性命”，将לְחַיַּת理解为“交给野兽”；同时以脚注说明另一种可能的组合方式。
- source_word: חַיַּת עֲנִיֶּיךָ
  choice: 你受苦子民的性命
  rationale: חַיַּת在此表示“生命、性命”，עֲנִיֶּיךָ指属于上帝、正在受压迫或困苦的人；“子民”自然表达其群体归属。
- source_word: לָנֶצַח
  choice: 永远
  rationale: 准确保留时间副词的强烈祈求语气。
theological_decisions:
- issue: “斑鸠”所指对象
  choice: 保留“你的斑鸠”这一诗歌隐喻
  alternative: 直接译作“你的子民”
  rationale: 上下文表明它可指上帝受苦的群体，但原文并未明说；保留隐喻可避免把解释写入正文。
- issue: 第一分句中חַיַּת נֶפֶשׁ的句法关系
  choice: 译为“把你斑鸠的性命交给野兽”
  alternative: 译为“把你的斑鸠交给贪食的野兽”
  rationale: 前者直接体现נֶפֶשׁ תּוֹרֶךָ“你斑鸠的性命”，并与下句“性命”形成诗意呼应；但原文也容许把חַיַּת נֶפֶשׁ理解为“贪食的野兽”，故以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“斑鸠”保留诗篇的具体意象；两次“性命”形成平行呼应。“不要永远忘记”保留原文祈求式的直率力度。
