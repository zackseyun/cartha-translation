  text: אַתָּ֣ה הִ֭צַּבְתָּ כָּל גְּבוּל֣וֹת אָ֑רֶץ קַ֥יִץ וָ֝/חֹ֗רֶף אַתָּ֥ה יְצַרְתָּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/017.yaml
  text: You established all the boundaries of the earth[b][a]; summer and winter—you formed them.
translation:
  language: zh_hans
  text: 你划定了大地的一切界限[a]；夏天和冬天，都是你塑造的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “划定”也可译作“设立”或“使……立定”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“你塑造了它们”；“它们”指夏天和冬天。“塑造”也可译作“塑成”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִצַּבְתָּ
  choice: 划定
  rationale: 该词的使役形表达使某物立定、安置稳固；与“疆界”搭配时，“划定”在现代汉语中自然地传达设立并固定界限之意。
- source_word: כָּל גְּבוּלוֹת אָרֶץ
  choice: 大地一切的疆界
  rationale: גְּבוּלוֹת 指界限或边界；本节与季节并列，语境关乎受造世界的秩序，因此将 אָרֶץ 译为“大地”，并用“疆界”保留复数界限的意象，避免限缩为国家领土边界。
- source_word: קַיִץ וָחֹרֶף
  choice: 夏天和冬天
  rationale: 这是两种常见季节名称；直译为“夏天和冬天”既自然，也保留二者概括季节循环的表达。
- source_word: יְצַרְתָּם
  choice: 都是你塑造的
  rationale: יצר 的核心意象是塑成、造就；“塑造”保留具体的形成意味。阳性复数后缀 ם 最自然地回指“夏天和冬天”，“都是”清楚体现复数所指。
- source_word: אַתָּה ... אַתָּה
  choice: 你……你
  rationale: 希伯来文两次明说代词以加强语气；中文在两句中重复“你”，保留对上帝亲自作为的强调。
theological_decisions:
- issue: “大地的疆界”所指的创造范围
  choice: 指上帝为整个受造世界划定秩序和界限
  alternative: 指各片土地或列国的领土边界
  rationale: 后句紧接“夏天和冬天”，使整节处于宇宙创造与自然秩序的语境中；因此采用“大地”而非“土地”，但仍以“疆界”保留原文可能具有的空间界限意象。
- issue: יְצַרְתָּם 的复数后缀所指
  choice: 回指“夏天和冬天”
  alternative: 泛指前述受造秩序或大地的诸界限
  rationale: 后缀为阳性复数，与紧邻的成对季节最自然地衔接；译文明确为“都是你塑造的”，脚注同时说明其语法所指。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留原文两个分句中重复的“你”，并以分号呈现平行结构；“大地”强化创造秩序语境，“疆界”则保留原文的空间意象。
