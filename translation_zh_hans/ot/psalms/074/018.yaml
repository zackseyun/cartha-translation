  text: זְכָר זֹ֗את א֭וֹיֵב חֵרֵ֣ף יְהוָ֑ה וְ/עַ֥ם נָ֝בָ֗ל נִֽאֲצ֥וּ שְׁמֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/018.yaml
  text: 'Remember this: the enemy has mocked Yahweh[c][b][a], and a foolish people have despised your name.'
translation:
  language: zh_hans
  text: 求你记念这事：仇敌辱骂了[a]雅威，愚妄的民众[b]藐视了你的名[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辱骂了”或译“嘲弄了”或“讥诮了”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“愚妄”主要指道德上的愚昧，并非仅指智力不足；参诗篇14:1。
    reason: cross_reference
  - marker: c
    text: “藐视了你的名”或译“轻蔑地对待你的名”；也可能译“亵渎了你的名”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר
  choice: 求你记住
  rationale: 这是阳性单数第二人称的祈使式，是诗人直接向上帝发出的恳求。“求你”自然传达汉语祷告语境中的请求语气，“记住”保留其呼求上帝顾念并采取行动的含义。
- source_word: זֹאת
  choice: 这事
  rationale: 阴性单数指示词概括诗人所陈明的冒犯；“这事”在现代汉语中比单说“这”更自然，又不额外限定所指。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 原文为单数，可在本诗语境中作集合性称呼。“仇敌”保留诗歌和哀歌语体，也不强行确定为某一个人或某一群体。
- source_word: חֵרֵף
  choice: 辱骂了
  rationale: חרף表示带着蔑视的责骂、讥诮或羞辱。“辱骂”清楚表达言语攻击及轻蔑意味，同时在脚注保留“嘲弄、讥诮”等可能译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；音译为“雅威”，保留这是上帝向以色列启示的专名，而不以称号替代。
- source_word: וְעַם
  choice: ……的民
  rationale: עַם在此是集合名词，指一个群体。“民”简洁而庄重；汉语不必另加不定冠词，也不把它具体化为某一民族。
- source_word: נָבָל
  choice: 愚顽
  rationale: 该词在智慧文学和诗歌中常指道德、属灵层面的悖逆愚昧，不只是智力不足。“愚顽”能在现代中文圣经语体中较准确地承载这一含义。
- source_word: נִאֲצוּ
  choice: 藐视了
  rationale: נאץ表示轻蔑、弃绝或以蔑视相待。“藐视”适合以“你的名”为宾语，并保留其可指亵渎的强烈语义，而不在正文中过度解释。
- source_word: שְׁמֶךָ
  choice: 你的名
  rationale: 直译“你的名”，保留希伯来语中名字所涵盖的身份、声誉和启示之品格，也保留本句从第三人称“雅威”转为第二人称“你的”这一直接呼告。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的四字专名，而非普通称号。采用“雅威”这一通行音译，既保留专名性质，也避免用“主”取代原文。
- issue: נָבָל 的道德与属灵意味
  choice: 愚顽
  alternative: 愚昧；不敬虔；卑劣
  rationale: 此词不只是描述智力缺陷，往往涉及道德和属灵上的败坏。“愚顽”保留这种重量，却不把原文直接解释成“不敬虔”或“卑劣”。
- issue: 从“雅威”转为“你的名”的人称变化
  choice: 照原文保留第三人称与第二人称的转换
  alternative: 统一译为“你……你的名”
  rationale: 诗人一面提及雅威，一面直接向他祈求；这种人称转换是希伯来诗歌真实的修辞张力，不宜为了表面顺畅而抹平。
- issue: נאץ 是否明确译作“亵渎”
  choice: 正文译“藐视”，脚注列出“亵渎”
  alternative: 正文译“亵渎”
  rationale: “亵渎”在神学语境中更专门、更强烈；原词首先表达轻蔑和弃绝。正文采用较宽而准确的“藐视”，脚注保留更强的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你记住”体现直接恳求；“辱骂、愚顽、藐视”保留诗篇哀歌的强烈语气。标点清楚呈现“记住这事”之后的两项平行控诉，并保留“雅威”与“你的名”之间的人称转换。
