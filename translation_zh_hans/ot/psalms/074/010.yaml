  text: עַד מָתַ֣י אֱ֭לֹהִים יְחָ֣רֶף צָ֑ר יְנָ֘אֵ֤ץ אוֹיֵ֖ב שִׁמְ/ךָ֣ לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/010.yaml
  text: How long[a], O God, will the foe reproach? Will the enemy revile your name forever?
translation:
  language: zh_hans
  text: 神啊，敌手还要辱骂到几时呢？仇敌要永远藐视你的名吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仇敌要永远亵渎你的名吗？”
    reason: נאץ 可表示藐视、辱慢；当对象是神的名时，也可具体译为“亵渎”。
lexical_decisions:
- source_word: עַד מָתַי
  choice: 还要……到几时呢
  rationale: 这是哀歌中询问苦难或羞辱还将持续多久的惯用问句；“到几时”保留诗体庄重感，“还要”自然表达持续之意。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 本句直接向神呼求，用“神啊”准确表达呼格和祷告语气。
- source_word: יְחָרֶף
  choice: 辱骂
  rationale: חרף 的 Piel 形表示以言语羞辱、讥诮或辱骂；“辱骂”清楚自然，又不额外限定具体方式。
- source_word: צָר
  choice: 敌手
  rationale: צָר 指敌对者；译作“敌手”既符合诗体，也与下句 אוֹיֵב 的“仇敌”略作区分，保留同义平行中的词汇变化。
- source_word: יְנָאֵץ
  choice: 藐视
  rationale: נאץ 的 Piel 形表达轻蔑、蔑视，也可在针对神或其名时译作“亵渎”；正文采用较宽泛的“藐视”，避免将语义过度收窄。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: אוֹיֵב 是常见的“敌人、仇敌”；“仇敌”庄重自然，并与上句“敌手”形成对应。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 直译“你的名”，保留神的名所包含的尊荣、声誉与启示身份等丰富含义。
- source_word: לָנֶצַח
  choice: 永远
  rationale: 准确传达哀歌中诗人对羞辱似乎无休无止的悲叹。
theological_decisions:
- issue: 是否把对神之“名”的藐视直接解释为对神本人的亵渎
  choice: 正文保留“你的名”并译作“藐视”
  alternative: 译作“仇敌要永远亵渎你吗？”或“仇敌要永远亵渎你的名吗？”
  rationale: 希伯来文明确说“你的名”，应保留这一具有神学内涵的表达；同时 נאץ 可指蔑视，也可在此语境下理解为亵渎，因此正文保留较宽的词义，并以脚注列出更强的宗教性措辞。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇哀歌语体。“到几时呢”保留呼求的诗性，“敌手／仇敌”呈现希伯来文近义平行中的用词变化。脚注标记置于其实际对应的第二问句之后。
