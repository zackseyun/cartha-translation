  text: אַתָּ֤ה פוֹרַ֣רְתָּ בְ/עָזְּ/ךָ֣ יָ֑ם שִׁבַּ֖רְתָּ רָאשֵׁ֥י תַ֝נִּינִ֗ים עַל הַ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/013.yaml
  text: You split the sea by your strength[b][a]; you shattered the heads of the sea monsters on the waters.
translation:
  language: zh_hans
  text: '你以你的大能劈开海[b]；

    你打碎水上众海怪的头[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海怪”或译“龙”或“巨大的海中生物”。希伯来语 תַנִּינִים 可指与水域相关、形似巨蛇的可怖生物。
    reason: lexical_alternative
  - marker: b
    text: 本节可能既以诗歌形象呼应上帝胜过混沌之海，也呼应他在出埃及事件中于海上施行的历史性拯救。
    reason: cross_reference
lexical_decisions:
- source_word: פוֹרַרְתָּ
  choice: 劈开
  rationale: 该动词在此表示破开、分开；“劈开”自然有力，适合以海为宾语的诗歌语境，也保留决定性行动的力度。
- source_word: בְעָזְּךָ
  choice: 以大能
  rationale: עֹז 表示力量、能力；介词 בְ 在这里表工具或凭借。“以大能”符合现代中文的庄重诗体。
- source_word: יָם
  choice: 海洋
  rationale: 原文虽无冠词，但语境指向特定的海或诗歌中的混沌之海。“海洋”在中文中自然，并不限定其仅指某一次历史事件。
- source_word: שִׁבַּרְתָּ
  choice: 打碎
  rationale: שׁבר 的基本义是打破；“打碎”保留强烈、猛烈的动作，与“头”搭配自然。
- source_word: רָאשֵׁי
  choice: 众……的头
  rationale: 原文是复数构造形式“……的头”。加入“众”清楚表达多个海怪及其头，同时保留原有形象。
- source_word: תַנִּינִים
  choice: 海怪
  rationale: תַנִּינִים 可指与水域相关的巨大、蛇形或可怖生物。“海怪”在现代中文中简明地传达诗歌中的巨兽意象，又不把它武断地限定为“龙”或普通海洋动物。
- source_word: עַל הַמָּיִם
  choice: 水上
  rationale: עַל 最直接表示“在……上”。“水上”保留原文空间意象，不解释性地改成“水中”。
theological_decisions:
- issue: 海与 תַנִּינִים 意象的性质
  choice: 正文保留诗歌性的海洋—巨兽意象，并以脚注提示它既可能呼应上帝制伏混沌之海，也可能呼应出埃及时在海边的拯救。
  alternative: 只按出埃及事件解释，或只按古代混沌争战意象解释。
  rationale: 本节的措辞容许创造／制伏混沌与历史性救赎彼此交叠。译文不应消除这种张力，也不应把诗歌形象化约为单一事件。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。两个分句保持希伯来语平行结构；“劈开／打碎”和“海洋／水上众海怪的头”相互呼应。脚注标记均置于正文相应词语之后。
