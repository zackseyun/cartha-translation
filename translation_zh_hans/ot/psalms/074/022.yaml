  text: קוּמָ֣/ה אֱ֭לֹהִים רִיבָ֣/ה רִיבֶ֑/ךָ זְכֹ֥ר חֶרְפָּתְ/ךָ֥ מִנִּי נָ֝בָ֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/022.yaml
  text: Rise up[a], O God; plead your case[b]. Remember your reproach from the fool all day long.
translation:
  language: zh_hans
  text: 神啊，求你起来，为自己的案件申辩[a]！求你记念愚顽人[b]终日对你的辱骂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为自己的案件申辩”也可译作“维护自己的诉讼”或“为自己的事争辩”。原文采用法律争讼用语。
    reason: lexical_alternative
  - marker: b
    text: 这里的“愚顽人”是指道德败坏、不敬畏神的人，并非仅指智力不足的人。
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: 求你起来
  rationale: 这是带强调语气的命令式，在祷告中是恳切呼求神起身采取行动；“求你起来”既自然，也保留了原文的迫切感。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 原文在此作直接呼语；“神啊”符合现代汉语祷告语体。
- source_word: רִיבָה רִיבֶךָ
  choice: 为自己的案件申诉
  rationale: 动词与同根名词连用，属于法律争讼用语；译文保留“案件—申诉”的司法意象，同时避免将其泛化为单纯的行动或辩护。
- source_word: זְכֹר
  choice: 要记得
  rationale: 直译命令式“记得”；在祷告语境中含有求神留意并采取行动之意，但正文不加以扩展。
- source_word: חֶרְפָּתְךָ
  choice: 对你的辱骂
  rationale: חֶרְפָּה可指羞辱、嘲弄或辱骂；结合第二人称后缀，此处自然理解为针对神的辱骂。“对你的辱骂”在汉语中清楚表达其指向，同时没有加入额外解释。
- source_word: מִנִּי נָבָל
  choice: 愚顽人……对你的
  rationale: מִנִּי标明羞辱的来源，汉语改用“某人对你”的结构表达。נָבָל在诗篇中主要指道德败坏、不敬畏神的人，因此采用有圣经语感而不只表示智力不足的“愚顽人”。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁自然地表达整日持续或不断发生的意思。
theological_decisions:
- issue: “你的辱骂/羞辱”的所指
  choice: 译作“对你的辱骂”，以神为辱骂直接指向的对象
  alternative: 理解为神的百姓因属于神而承受、也归到神身上的羞辱
  rationale: 第二人称后缀以及前句“自己的案件”最自然地指向神所受的冒犯；但全诗中圣所和神的百姓也遭敌人羞辱。译文不进一步说明辱骂如何涉及百姓，以免消除诗篇中的盟约关联与张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你起来”传达迫切恳求；“案件申诉”保留原文法律隐喻；“终日”简洁表达持续性。脚注标记均置于正文相应词语之后。
