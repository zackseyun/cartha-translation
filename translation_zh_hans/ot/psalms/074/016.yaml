  text: לְ/ךָ֣ י֭וֹם אַף לְ/ךָ֥ לָ֑יְלָה אַתָּ֥ה הֲ֝כִינ֗וֹתָ מָא֥וֹר וָ/שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/016.yaml
  text: The day is yours; the night also is yours[a]. You established the light and the sun.
translation:
  language: zh_hans
  text: 白昼属你，黑夜也属你；你立定了光体[a]和太阳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“光”；有人因上文“白昼、黑夜”的对举而理解为“月亮”，但希伯来原文没有明确说“月亮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: 属你
  rationale: 介词 לְ 加第二人称阳性单数后缀在此表达归属；“属你”自然简洁，并保留原文两次重复所形成的强调。
- source_word: יוֹם
  choice: 白昼
  rationale: 与“黑夜”相对时，“白昼”比单用“日”更清楚地表达昼夜之别。
- source_word: אַף
  choice: 也
  rationale: 此处将第二项递进加入，表达不但白昼、黑夜也同样属于神。
- source_word: לָיְלָה
  choice: 黑夜
  rationale: 与“白昼”形成自然、庄重的对举。
- source_word: אַתָּה
  choice: 你
  rationale: 保留显式人称代词，体现原文在动词前对施事者的强调。
- source_word: הֲכִינוֹתָ
  choice: 立定了
  rationale: 使役形表达使之稳固、设立或安置；“立定了”适合诗篇中的宇宙秩序语境。
- source_word: מָאוֹר
  choice: 光体
  rationale: 该词可指发光或供光之物，也可指光；“光体”保留其实体性及词义空间，不径直解释为原文没有明说的“月亮”。
- source_word: וָשָׁמֶשׁ
  choice: 和太阳
  rationale: 直接表达连接词与名词，并与前面的“光体”并列。
theological_decisions:
- issue: מָאוֹר 与 שֶׁמֶשׁ 的关系
  choice: 译作“光体”，并与“太阳”区别开来。
  alternative: 按昼夜平行关系推断为“月亮”，或泛译为“光”。
  rationale: 希伯来文没有明确说“月亮”。“光体”较贴近 מָאוֹר 可指发光体的词义，也保留它究竟泛指光源还是语境中暗指月亮的歧义，避免把解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；保留前两分句“属你”的重复，并用分号呈现从归属宣告到创造秩序的推进。
