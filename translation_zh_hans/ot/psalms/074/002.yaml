id: PSA.74.2
reference: Psalms 74:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זְכֹ֤ר עֲדָתְ/ךָ֨ קָ֘נִ֤יתָ קֶּ֗דֶם גָּ֭אַלְתָּ שֵׁ֣בֶט נַחֲלָתֶ֑/ךָ הַר צִ֝יּ֗וֹן זֶ֤ה שָׁכַ֬נְתָּ בּֽ/וֹ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/002.yaml
  text: Remember your congregation[a], which you acquired long ago, which you redeemed as the tribe of your inheritance—Mount Zion[d][c][b], this mountain where you dwelled.
translation:
  language: zh_hans
  text: 求你记念你的会众，就是你在远古所取得的[a]，你所救赎、作你产业的支派[b]；也记念锡安山，就是你曾住在其中的这山[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所取得的”也可译作“买得的”或“取得归己的”；少数语境中，这个词也可表示“创造”。
    reason: 保留קנה的词义范围，同时说明本处最可能是取得会众归己。
  - marker: b
    text: “支派”也可译作“杖”或“权杖”；这里按被救赎之群体的意思译作“支派”。
    reason: 标明שֵׁבֶט真实存在的词义歧义。
  - marker: c
    text: 原文直译：“锡安山，这个，就是你住在其中的。”
    reason: 说明译文“这山”所依据的指示词，以及原文紧缩的同位结构。
lexical_decisions:
- source_word: זְכֹר
  choice: 求你记念
  rationale: 这是阳性单数第二人称祈使式，是向上帝发出的直接恳求；“求你记念”符合现代汉语祷告与哀歌语体。
- source_word: עֲדָתְךָ
  choice: 你的会众
  rationale: עֵדָה指聚集的群体或共同体；“会众”保留其集体及圣约群体意味。
- source_word: קָנִיתָ קֶּדֶם
  choice: 你从古时所得的
  rationale: קנה可指取得、买得、拥有，少数语境也可指创造；这里与“救赎”平行，重点是上帝很早便取这群体归己。“所得”避免把商业购买或创造的含义说死。
- source_word: גָּאַלְתָּ
  choice: 你所救赎
  rationale: גאל表达近亲赎回或解救，并具有重要的圣约救赎色彩；“救赎”能保留这种语义分量。
- source_word: שֵׁבֶט נַחֲלָתֶךָ
  choice: 作为你产业的支派
  rationale: שֵׁבֶט可指支派、杖或权杖；本节以被救赎的会众为对象，因此“支派”最合语境。介词性的“作为”表达同位关系，使汉语通顺。
- source_word: הַר צִיּוֹן
  choice: 锡安山
  rationale: 这是该地名在现代中文圣经语境中的标准、自然译法。
- source_word: זֶה
  choice: 就是……这山
  rationale: 指示词紧接“锡安山”，很可能以同位结构加以指明；译出“这山”保留原文显明的指示成分。
- source_word: שָׁכַנְתָּ בוֹ
  choice: 你曾居住的
  rationale: שׁכן表示居住、安居，在此也带有上帝临在的联想；“曾居住”自然表达完成式所回顾的事实。
theological_decisions:
- issue: קָנִיתָ是否应译成创造，还是上帝取得以色列归己
  choice: 译为“所得”，按上帝取得会众归己理解
  alternative: 所造的；所买的
  rationale: 该动词虽可在某些语境表示创造，但这里与“救赎”平行，宾语又是“你的会众”，更支持历史性、圣约性的归属关系；“所得”同时保留取得方式上的一定开放性。
- issue: שֵׁבֶט应理解为支派，还是杖／权杖
  choice: 支派
  alternative: 杖；权杖
  rationale: 上下文谈论上帝所救赎的群体，并继而提到锡安，因此群体意义的“支派”比器物或王权象征更连贯。
- issue: 锡安是否与前面的“支派”构成同一宾语链
  choice: 以分号及“也记念”呈现为向上帝继续发出的记念之求
  alternative: 把“锡安山”直接接作“支派”的同位说明
  rationale: 希伯来文的并列／同位关系较紧缩，语法解释存在张力。汉语若把锡安山直接说成支派，容易造成类别混淆；补出“也记念”使隐含的祈求自然延续，但不把锡安等同于被救赎的支派。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你记念”保持诗篇哀歌中的恳求语气；“从古时”“救赎”“产业”保留原文的古老行动、圣约归属与神学重量。所有注脚标记均在正文对应位置出现。
