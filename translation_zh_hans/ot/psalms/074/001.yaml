  yaml_path: translation/ot/psalms/074/001.yaml
  text: A Maskil of Asaph. Why[a], O God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: zh_hans
  text: '亚萨的训诲诗[a]。

    神啊，你为什么永远丢弃我们？

    你的怒气为什么向你草场上的羊群冒烟？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲诗”是诗篇标题中的专门用语，确切含义不能确定，也可能指供人默想或使人明悟的诗。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: 训诲诗
  rationale: 这是诗篇标题中的术语，确切含义不明，可能指教导性或默想性的作品。“训诲诗”以简洁、自然的中文保留其体裁标签，并用脚注说明不确定性。
- source_word: לְאָסָף
  choice: 亚萨的
  rationale: 前缀 לְ 在诗题中可表示作者、归属或关联。“亚萨的”是自然的中文诗题表达，同时不把这种关系限定为单一解释。
- source_word: לָמָה
  choice: 为什么
  rationale: 直接疑问最符合哀歌的语气，也是现代汉语的自然表达。原文第二问虽没有重复 לָמָה，中文为使并列问句清楚自然，将其补出。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 上下文是直接向神呼求；“神啊”自然呈现呼格和祷告语气。
- source_word: זָנַחְתָּ
  choice: 丢弃我们
  rationale: 该动词表示拒绝、摒弃或抛弃。“丢弃”保留群体哀诉中被神弃绝的强烈感受；“我们”依马所拉文本读法和全诗群体语境表达第一人称复数宾语。
- source_word: לָנֶצַח
  choice: 永远
  rationale: 在哀歌中表达持续不止、仿佛没有尽头的时间感；“永远”简洁有力。
- source_word: יֶעְשַׁן
  choice: 冒烟
  rationale: 原动词具体指冒烟。与“怒气”连用构成鲜明隐喻；直译能保留希伯来文的意象，不将其弱化为“发作”或“燃烧”。
- source_word: אַפְּךָ
  choice: 你的怒气
  rationale: אַף 字面与鼻孔有关，但在此是希伯来语表示愤怒的惯用法。“怒气”准确传意，并与“冒烟”共同保留原文形象。
- source_word: בְּצֹאן מַרְעִיתֶךָ
  choice: 向你草场上的羊群
  rationale: 该短语以牧者和羊群描绘神与其子民的关系。“草场上的羊群”比逐字的“你草场的羊”更符合现代汉语，同时保留具体的牧养意象；介词译作“向”表达怒气所针对的对象。
theological_decisions:
- issue: זָנַחְתָּ 所含第一人称复数宾语的表达
  choice: 丢弃我们
  alternative: 丢弃你的子民
  rationale: 马所拉文本的动词形式表达“你丢弃了我们”，且本诗是群体哀歌。直译“我们”既保持原文人称，也避免用“你的子民”作神学性扩写。
- issue: “你草场上的羊群”所指对象
  choice: 保留牧养隐喻，不在正文中释为“你的百姓”
  alternative: 向你的百姓发怒
  rationale: 原文借羊群表达神的群体。保留该隐喻能维持诗歌张力和牧者意象，不在正文中替读者解释其神学指向。
- issue: 神的怒气“冒烟”的拟人化意象
  choice: 按原文保留“冒烟”
  alternative: 怒气燃烧
  rationale: 原文将与鼻息相关的愤怒惯用语和烟的意象结合。译文传达其诗性形象，而不将其理解为神具有受造物意义上的身体构造。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。诗题单列；两行正文保留连续诘问和牧养意象。“冒烟”虽在日常汉语中较为突兀，但这是原文刻意的诗性表达，故予以保留。
