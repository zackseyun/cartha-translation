  text: אַל תִּ֭שְׁכַּח ק֣וֹל צֹרְרֶ֑י/ךָ שְׁא֥וֹן קָ֝מֶ֗י/ךָ עֹלֶ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/023.yaml
  text: Do not forget the voice of your enemies[a], the uproar of those who rise against you[b], which goes up continually.
translation:
  language: zh_hans
  text: 不要忘记你仇敌的声音[a]；反对你的人所发的喧嚷不断升起[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译作“声响”。希伯来语 קוֹל 可指人的声音，也可泛指声音或响声。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“反对你之人的喧嚷不断升起”。希伯来文表达简练，未使用相当于“所发的”或“这喧嚷”的连接词。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁכַּח
  choice: 不要忘记
  rationale: אַל与未完成式动词连用，表达禁止或祈求，直译为“不要忘记”；这里是诗人恳求上帝不要置敌人的行为于不顾。
- source_word: קוֹל
  choice: 声音
  rationale: קוֹל既可指人的声音，也可泛指声响；“声音”保留其基本义，并与下半句的“喧嚷”形成诗歌平行。
- source_word: צֹרְרֶיךָ
  choice: 你仇敌
  rationale: 该词指敌对、压迫上帝的人；“仇敌”简洁、庄重，并准确表达复数敌对者。
- source_word: שְׁאוֹן
  choice: 喧嚷
  rationale: שְׁאוֹן表示响亮而纷乱的声势、骚动或轰响；“喧嚷”在此既传达声音，也传达敌对群体造成的扰攘。
- source_word: קָמֶיךָ
  choice: 起来反对你之人
  rationale: 保留קום“起来”的动词意象，而不只概括译为“敌人”；“之人”使诗体简洁庄重。
- source_word: עֹלֶה
  choice: 上腾
  rationale: עלה本义为“上升、上去”；“上腾”保留敌人喧嚷不断升起的空间意象，也符合中文诗歌语体。
- source_word: תָמִיד
  choice: 不断
  rationale: תָמִיד表示持续不止；“不断”自然地修饰“上腾”，传达敌对喧嚷始终延续。
theological_decisions:
- issue: “忘记”用于上帝时是否暗示记忆能力有限
  choice: 保留“不要忘记”这一祷告措辞
  alternative: 不要忽视／不要置之不理
  rationale: 原文直接使用שׁכח“忘记”。诗篇祷告是在求上帝记念并采取行动，不宜为消除可能的神学张力而改写原文。
- issue: 敌对对象的表达
  choice: 按第二人称译为“你的仇敌”“反对你之人”
  alternative: 我们的仇敌／反对你百姓的人
  rationale: 两个名词均带第二人称单数后缀，直接指向上帝；不额外限定这些敌人与敬拜群体之间的关系。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“起来反对你之人”保留希伯来文的动作意象；“上腾”略具诗意，但仍属现代读者可理解的常用表达。分号呈现原文两组声音意象之间紧密的平行关系，不额外加入解释性的关系词。
