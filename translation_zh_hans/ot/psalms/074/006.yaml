  text: And now they smash all its carved work together with hatchet and hammers[a][b].
translation:
  language: zh_hans
  text: 如今，他们用斧头和锤子[a]，把它所有的雕刻都砸毁了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用斧子和木槌”；希伯来语在此指两种具体的砍削、敲击工具，但它们确切对应哪种现代工具并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַת
  choice: 如今
  rationale: 连接词与时间副词共同把画面转到眼前的毁坏；“如今”既简洁自然，也保留叙事转折。
- source_word: פִּתּוּחֶיהָ
  choice: 其中的雕刻
  rationale: 该词指雕刻或镌刻的装饰，阴性单数后缀回指前文的圣所建筑；“其中的雕刻”在现代汉语中自然，并保留集合意义。
- source_word: יַחַד
  choice: 全都
  rationale: 此处强调这些雕刻被整体、无一例外地毁坏；以“全都”表达，比直译为“一起”更符合汉语习惯，也避免误解为施暴者一同动作。
- source_word: בְּכַשִּׁיל
  choice: 用斧头
  rationale: 该词指一种砍削木料的工具，确切的现代对应物不确定；正文采用普通读者易懂的“斧头”。
- source_word: וְכֵילַפּוֹת
  choice: 和锤子
  rationale: 该词指敲击类工具且为复数；“锤子”自然易懂，但具体器具可能是槌或其他敲击工具。
- source_word: יַהֲלֹמוּן
  choice: 砸毁
  rationale: 动词表示猛击、捶打；结合破坏圣所雕刻的语境，“砸毁”准确传达动作及其破坏性。
