  text: A Maskil of Asaph. Why[a], God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: zh_hans
  text: '亚萨的训诲诗[a]。


    上帝啊，你为什么永远弃绝我们？你的怒气为何向你草场的羊群冒烟？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲诗”是诗篇标题中的专门术语，也可能指供人默想或使人明悟的诗作；确切含义不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: 训诲诗
  rationale: 这是诗篇标题中的专门术语，词义可能涉及使人明悟、教导或默想；正文采用简洁且较易理解的“训诲诗”，并以脚注保留其不确定性。
- source_word: לְאָסָף
  choice: 亚萨的
  rationale: 介词 לְ 在诗题中可表示作者、归属、献给或相关关系；“亚萨的”自然简洁，同时不强行限定具体关系。
- source_word: זָנַחְתָּ
  choice: 弃绝
  rationale: 该动词表达拒绝、摒弃；“弃绝”保留哀歌中强烈而庄重的语气。
- source_word: לָנֶצַח
  choice: 永远
  rationale: 直译其持续至永久的表面意义，保留诗人质问中的张力，不把它弱化为“长久”。
- source_word: יֶעְשַׁן אַפְּךָ
  choice: 你的怒气……冒烟
  rationale: אַף 可借指怒气，יֶעְשַׁן 保留“冒烟”的鲜明隐喻；不改写为较抽象的“发怒”。
- source_word: צֹאן מַרְעִיתֶךָ
  choice: 你牧场上的羊
  rationale: 保持牧者与羊群的意象，并以现代汉语自然表达所属关系。
theological_decisions:
- issue: “永远弃绝”是否应按神学推断弱化
  choice: 保留诗人的直接质问：“永远弃绝我们”
  alternative: 译作“弃绝我们这么久”或加入“难道”
  rationale: 希伯来文本明确使用 לָנֶצַח；诗篇哀歌允许祈祷者以感受和疑问向上帝陈诉，译文不应预先消解这种神学张力。
- issue: 怒气冒烟的意象
  choice: 保留拟人化隐喻“怒气……冒烟”
  alternative: 意译为“向……大发烈怒”
  rationale: 原文刻意使用烟气意象，可能令人联想到燃烧的怒火；保留比喻比解释性改写更贴近源文。
- issue: לְאָסָף 所表达的关系
  choice: 译作含义较宽的“亚萨的”
  alternative: 明确译作“亚萨所作”或“献给亚萨”
  rationale: 介词本身不能在此无歧义地确定作者或归属关系，因此避免加入原文没有明确说明的信息。
translation_notes:
  register: 采用现代、庄重而可朗读的汉语。诗题独立成行；正文保留两个“为什么”形成的哀诉节奏，也保留“怒气冒烟”和“牧场上的羊”这两个源文意象。
