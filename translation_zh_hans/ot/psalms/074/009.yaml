  text: אֽוֹתֹתֵ֗י/נוּ לֹ֥א רָ֫אִ֥ינוּ אֵֽין ע֥וֹד נָבִ֑יא וְ/לֹֽא אִ֝תָּ֗/נוּ יֹדֵ֥עַ עַד מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/009.yaml
  text: We do not see our signs; there is no longer any prophet[a], and none among us knows how long.
translation:
  language: zh_hans
  text: 我们看不见我们的记号[a]；先知也不再有了；我们中间没有人知道这要到几时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的旌旗”或“我们的标志”。希伯来语可指可见的记号或标志，但这里具体指什么并不明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתֵינוּ
  choice: 我们的标记
  rationale: אוֹת的基本义为可见的“记号、标记、征兆”。原文没有说明具体所指，因此采用宽泛的“标记”，不限定为旌旗、圣殿象征或神同在的凭据。
- source_word: לֹא רָאִינוּ
  choice: 我们看不见
  rationale: 完成式在哀歌语境中表达当前持续的缺失状态；“看不见”自然地传达眼下没有这些标记可见。
- source_word: אֵין עוֹד
  choice: 不再有了
  rationale: 该短语表示从前所有的如今已经止息或缺失；“不再有了”保留这种今昔对照。
- source_word: נָבִיא
  choice: 先知
  rationale: נָבִיא的标准对应词；单数在否定存在句中可作类指，意为连一个先知也没有。
- source_word: וְלֹא אִתָּנוּ יֹדֵעַ
  choice: 我们中间没有人知道
  rationale: 按希伯来语省略结构自然译出群体中无人知晓之意，并保留“知道”而不改作“明白”。
- source_word: עַד מָה
  choice: 这要到几时
  rationale: עַד מָה在哀歌中通常询问某种处境还要持续多久；补出“这”使现代汉语完整自然，同时不具体界定所指灾难。
theological_decisions:
- issue: “我们的标记”具体指什么
  choice: 保留宽泛表达“我们的标记”
  alternative: 我们的旌旗；神与我们同在的记号；圣所或敬拜的标志
  rationale: 原文没有明确这些标记的性质。保持概括性可保存经文的真实含混，避免加入特定历史重构或神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语言；分号保留三重申诉的诗行推进。“先知也不再有了”中的“也”衔接前句连续缺失的语气；末句以“这要到几时”呈现群体对苦难期限的无知。
