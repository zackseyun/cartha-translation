base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/014.yaml
  text: You crushed the heads of Leviathan[a]; you gave him as food for the creatures of the desert.
translation:
  language: zh_hans
  text: '你击碎了利维坦的众头；

    你把它交给旷野中的生灵[a]作食物。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旷野中的生灵”也可译作“旷野的居民”或“旷野的野兽”。原文用语含义不易确定，可能指干旱地区的人，也可能指那里的动物。
    reason: lexical_alternative
lexical_decisions:
- source_word: רִצַּצְתָּ
  choice: 击碎了
  rationale: 该动词表示猛烈地打碎或压碎；“击碎”既保留动作的力度，也适合诗歌语体。
- source_word: רָאשֵׁי
  choice: 众头
  rationale: 原文为复数构造形式，直译为“……的头（复数）”；“众头”明确保留利维坦多头的诗意形象。
- source_word: לִוְיָתָן
  choice: 利维坦
  rationale: 采用音译，以保留这一名称在希伯来圣经中的诗歌及互文意义，不预先把它限定为某一种动物或象征。
- source_word: תִּתְּנֶנּוּ
  choice: 你把它交给
  rationale: נתן的基本义是“给、交给”；阳性单数后缀回指利维坦。中文以“它”指这一受造物，并用“交给……作食物”自然呈现句法关系。
- source_word: מַאֲכָל
  choice: 作食物
  rationale: 该词意为“食物”；此处“作食物”符合现代汉语表达，并保留利维坦被交出供食用的含义。
- source_word: לְעָם לְצִיִּים
  choice: 给旷野里的生灵
  rationale: עַם通常指群体或人民，而צִיִּים在此可能指干旱地区的居民或野兽。“生灵”在中文中可涵盖有生命的群类，避免无根据地把所指仅限定为人或动物；歧义另以脚注说明。
theological_decisions:
- issue: 利维坦意象的性质
  choice: 保留“利维坦”这一诗歌性的宇宙争战意象，不判定它究竟是实际生物、神话诗歌形象，还是历史仇敌的象征。
  alternative: 明确译作“海怪”，或直接解释为埃及或混沌势力。
  rationale: 原文呈现上帝战胜利维坦的既有圣经诗歌意象，却没有在本节中解释其具体所指；译文应保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“击碎”“众头”保留原文的强烈动作与复数形象；分行和分号呈现两个平行分句。
