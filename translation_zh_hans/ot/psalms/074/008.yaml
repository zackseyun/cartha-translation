source:
  edition: WLC
  text: אָמְר֣וּ בְ֭/לִבָּ/ם נִינָ֣/ם יָ֑חַד שָׂרְפ֖וּ כָל מוֹעֲדֵי אֵ֣ל בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/008.yaml
  text: They said in their hearts[b][a], “Let us destroy them all together.” They burned all the meeting places of God in the land.
translation:
  language: zh_hans
  text: 他们心里说：“我们把他们一并消灭吧！”[a] 他们把境内所有上帝的聚会之处都烧毁了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消灭”所译的希伯来词词形和意义难以确定，也可能意为“压迫”或“制伏”，或是其他表示毁灭意图的话。
    reason: lexical_alternative
  - marker: b
    text: “上帝的聚会之处”也可译作“上帝所指定的地方”；有些传统译本译作“上帝的会堂”。
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְרוּ
  choice: 他们……说
  rationale: אמר的Qal完成式第三人称复数；诗中叙述仇敌既有的图谋，用现代汉语一般过去叙事表达。
- source_word: בְלִבָּם
  choice: 心里
  rationale: 保留希伯来语以“心”表示内在思想和意图的意象，同时符合现代汉语表达。
- source_word: נִינָם
  choice: 我们把他们……消灭吧
  rationale: 该词形和词义都很困难；上下文清楚表达仇敌要彻底摧毁的意图。“消灭”自然传达敌意，但不把这一不确定词形解释得过细，另以脚注说明其他可能。
- source_word: יָחַד
  choice: 一并
  rationale: 表达“共同、一起、全都”的副词意义；与“消灭”搭配，简洁地表现其全面毁灭的企图。
- source_word: שָׂרְפוּ
  choice: 烧毁了
  rationale: שרף的Qal完成式第三人称复数，意为“焚烧”；宾语是建筑性场所时，“烧毁”比单说“烧了”更自然。
- source_word: כָּל
  choice: 所有……都
  rationale: 用汉语“所有……都”完整表达全称范围。
- source_word: מוֹעֲדֵי אֵל
  choice: 上帝的聚会之处
  rationale: מוֹעֵד可指指定的时间，也可指指定的地点或聚会处。因这些对象能被焚烧，并且位于境内，此处优先采用空间意义；“聚会之处”避免时代错置地译作“会堂”，同时保留敬拜群体聚集的含义。
- source_word: בָּאָרֶץ
  choice: 境内
  rationale: 上下文最可能指以色列地的范围。“境内”用简洁现代汉语表达“在这地之中”，而不扩展为全世界。
theological_decisions:
- issue: נִינָם这一疑难词形如何理解
  choice: 理解为表示敌对意图的劝愿语：“我们把他们消灭吧”
  alternative: “我们压迫他们吧”“我们制伏他们吧”，或按名词作不同句法分析
  rationale: 词形本身晦涩，但本节及邻近经文的毁坏语境支持敌人企图全面消灭的理解；正文传达语境中的核心意思，脚注则保留词汇和句法上的不确定性。
- issue: מוֹעֲדֵי אֵל在焚烧语境中的含义
  choice: 献给上帝、供人聚集的实体场所
  alternative: 上帝所定的节期；上帝的众会；上帝的会堂
  rationale: “烧毁”和“境内”共同支持地点义。译作“聚会之处”既不把它限定为后期制度意义上的“会堂”，也保留מוֹעֵד可能涉及指定聚集的色彩。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“心里说”保留原文意象；“一并消灭”表现全面毁灭的决心；“聚会之处”刻意保留מוֹעֵד的礼仪与聚集色彩，同时避免使用可能造成时代错置的专门制度名称。
