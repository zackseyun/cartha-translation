  text: אַתָּ֣ה בָ֭קַעְתָּ מַעְיָ֣ן וָ/נָ֑חַל אַתָּ֥ה ה֝וֹבַ֗שְׁתָּ נַהֲר֥וֹת אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/015.yaml
  text: You split open springs and wadis; you dried up ever-flowing rivers.
translation:
  language: zh_hans
  text: '你劈开泉源和旱溪；

    你使长流不息的江河干涸。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָקַעְתָּ
  choice: 劈开
  rationale: 保留该动词“裂开、劈开”的强烈动作感，也与诗篇中上帝掌管水域的意象相称。
- source_word: מַעְיָן
  choice: 泉源
  rationale: 既可指泉水，也可指泉眼或水源；“泉源”简洁庄重，并保留源头之意。
- source_word: נָחַל
  choice: 河谷
  rationale: 该词可指溪流、急流或有水流经过的谷地；上下文中的动词“劈开”更适合以地貌性的“河谷”表达，也呼应英语审校层所保留的 wadi 含义，而不限定其始终有水。
- source_word: נַהֲרוֹת אֵיתָן
  choice: 长流不息的江河
  rationale: אֵיתָן 在此表达持久、常流之意；译为“长流不息”与后面的“干涸”形成鲜明张力。
theological_decisions:
- issue: 本节是否专指某一次历史神迹
  choice: 不在正文中明确限定具体事件
  alternative: 明确译成出埃及过海、击石出水或约旦河干涸等事件
  rationale: 诗句以概括性的水域意象称颂上帝的大能，原文未明确指认单一事件；保留这种诗意与历史指涉上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达；两行平行，保留“劈开”与“使……干涸”的强烈对照。
