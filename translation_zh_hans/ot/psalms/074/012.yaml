source:
  edition: WLC
  text: וֵ֭/אלֹהִים מַלְכִּ֣/י מִ/קֶּ֑דֶם פֹּעֵ֥ל יְ֝שׁוּע֗וֹת בְּ/קֶ֣רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/012.yaml
  text: Yet God is my King from of old[a], working acts of salvation in the midst of the earth.
translation:
  language: zh_hans
  text: '然而，神自古就是我的王，

    在大地之中施行拯救。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“这片土地”。希伯来语在此既可指整个大地，也可指某一特定的土地或地域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהִים
  choice: 然而，神
  rationale: 句首连词在上下文中具有转折意味，使眼前的荒凉与诗人对神恒久王权的信靠形成对照；“然而”自然传达这一修辞力量。
- source_word: מַלְכִּי
  choice: 我的王
  rationale: 保留名词所带的第一人称单数所属后缀，直接表达诗人与神的关系。
- source_word: מִקֶּדֶם
  choice: 自古
  rationale: 表达久远的过去和一贯延续的状态，同时不把含义强化为绝对的“从起初”。
- source_word: פֹּעֵל
  choice: 施行
  rationale: 分词描写神持续或一贯的作为；“施行”与后面的“拯救”搭配自然，也具有庄重的诗歌语体。
- source_word: יְשׁוּעוֹת
  choice: 拯救
  rationale: 希伯来语为复数，可指多次救助、得胜或拯救的作为。汉语“施行拯救”可自然概括这些反复的救赎行动，不用生硬的复数形式。
- source_word: בְּקֶרֶב
  choice: 在……之中
  rationale: 保留“在中间、在其中”的空间含义和诗性表达。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ既可指全地，也可指特定的土地；正文采用范围较广且富有诗意的“大地”，另以脚注保留“这片土地”的可能。
theological_decisions:
- issue: 神拯救作为的地域范围
  choice: 大地
  alternative: 这片土地
  rationale: אֶרֶץ在此可能指整个大地，也可能指以色列之地等特定地域。正文采用与本诗宏阔语境较相称的“大地”，但不排除地域性理解，故在脚注中注明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“自古就是”清楚表达久远且延续的王权；分行呈现原句从身份宣告转向神拯救作为的结构。
