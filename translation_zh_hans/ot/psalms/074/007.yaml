  text: שִׁלְח֣וּ בָ֭/אֵשׁ מִקְדָּשֶׁ֑/ךָ לָ֝/אָ֗רֶץ חִלְּל֥וּ מִֽשְׁכַּן שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/007.yaml
  text: They set your sanctuary on fire[c][b][a]; they profaned the dwelling place of your name to the ground.
translation:
  language: zh_hans
  text: 他们放火焚烧你的圣所[a]；他们把你名的居所夷为平地，亵渎了它[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“他们把火放进你的圣所”，意思是他们放火焚烧圣所。
    reason: lexical_alternative
  - marker: c
    text: 原文按语序可较直译为“他们把你名的居所亵渎到地”。“到地”表达将其降至地面的彻底毁坏和亵渎；译文以“夷为平地”自然表达这一意思。
    reason: textual_ambiguity
lexical_decisions:
- source_word: שִׁלְחוּ בָאֵשׁ
  choice: 纵火焚烧
  rationale: 字面是“用火发出／施放”，在本句中是纵火焚烧的希伯来语表达。“纵火焚烧”既自然，又明确传达蓄意用火毁坏的动作。
- source_word: מִקְדָּשֶׁךָ
  choice: 你的圣所
  rationale: מִקְדָּשׁ 指分别为圣的地方。“圣所”保留词义，也不把所指过早限定为某一建筑术语。
- source_word: לָאָרֶץ
  choice: 毁至平地
  rationale: 此处“到地”表达彻底倾覆、降至地面的结果。直译“亵渎到地”在现代汉语中难以成立，因此结合语境译出夷毁至地的程度，同时以“亵渎了它”保留核心谓语。
- source_word: חִלְּלוּ
  choice: 亵渎了
  rationale: 该动词的加强词干表示使圣物失去其神圣地位、加以亵渎。“亵渎”准确保留圣与俗之间的对立。
- source_word: מִשְׁכַּן שְׁמֶךָ
  choice: 你名的居所
  rationale: 保留“名的居所”这一重要的圣经表达，既指出上帝所拣选、彰显其临在的地方，又不把上帝本身等同于建筑物。
theological_decisions:
- issue: מִקְדָּשׁ 与 מִשְׁכַּן 两个相关圣所用语的区分
  choice: 分别译为“圣所”和“居所”
  alternative: 均译为“圣殿”，或译为“圣所”和“帐幕”
  rationale: 原文有意使用两个不同而相关的词，描写同一地方既是神圣之所，也是上帝之名的居所。分别翻译可保留诗歌的平行关系与神学层次。
- issue: “你名的居所”这一神学表达
  choice: 保留“你名的居所”
  alternative: 译为“你的居所”或“你临在的地方”
  rationale: 原文说上帝的“名”居住于此，既肯定其特殊临在，又避免把上帝局限在建筑物中；因此不将这一张力简化。
- issue: לָאָרֶץ 与 חִלְּלוּ 的关系
  choice: 译为“毁至平地，亵渎了它”
  alternative: 较形式对应地译为“把你名的居所亵渎到地”
  rationale: 原文将“到地”与“亵渎”紧密相连，具体可理解为借着把圣所毁至地面而亵渎它。汉语若照搬搭配会生硬难解，因此分作结果与核心动作，但用脚注提示原文结构。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“纵火焚烧”自然传达希伯来语用火毁坏的惯用表达；“你名的居所”则刻意保留原文较陌生但具有神学意义的意象。后半句为避免不合汉语习惯的“亵渎到地”，采用有限度的展开，并以脚注保存原文措辞及其解释空间。
