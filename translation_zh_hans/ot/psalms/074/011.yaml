  text: לָ֤/מָּה תָשִׁ֣יב יָ֭דְ/ךָ וִֽ/ימִינֶ֑/ךָ מִ/קֶּ֖רֶב חוק/ך כַלֵּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/011.yaml
  text: Why do you hold back your hand[a], your right hand? Draw it out from your bosom and consume them.
translation:
  language: zh_hans
  text: 你为什么收回你的手，连右手也收回？求你把右手从怀中抽出来，消灭他们！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从你怀中，除尽（或：消灭）”。“把右手抽出来”的动作由前文的“右手”和“怀中”的意象补足；末尾动词没有明说宾语。这里按本诗上下文补出“他们”，指敌人。
    reason: 说明原文压缩的手势意象和末尾动词省略宾语的情形，并保留“除尽／消灭”的词义范围。
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 这是询问缘由的常用疑问词，在这里引出哀诉式的质问。
- source_word: תָשִׁיב
  choice: 收回
  rationale: 使役形以“手”为宾语，结合下句手放在怀中的意象，表示把手撤回、不采取行动；“收回”既保留动作意象，也传达克制不动之意。
- source_word: יָדְךָ וִימִינֶךָ
  choice: 你的手，就是你的右手
  rationale: 保留“手”和“右手”的具体意象；用“就是”表达同位性的诗意强化，同时不排除将两者理解为并列称谓。
- source_word: מִקֶּרֶב חֹוקֶךָ
  choice: 从怀中
  rationale: 原短语指从胸怀、衣襟或衣服褶层的里面；“从怀中”简洁自然，并保留手藏在衣内而不行动的形象。
- source_word: כַלֵּה
  choice: 消灭他们
  rationale: Piel祈使式可表示“使终结、除尽、消灭”。原文没有明说宾语；根据本诗敌人毁坏圣所并讥诮上帝的语境，正文补出“他们”，并以脚注说明。
theological_decisions:
- issue: 末尾祈使动词的隐含宾语
  choice: 在正文补出“他们”，指本诗语境中的敌人
  alternative: 不补宾语，译作“求你除尽”；或理解为除尽威胁、辱骂等事物
  rationale: 希伯来文仅有“消灭／除尽”的祈使式，没有明示宾语。上下文持续谈论敌人及其毁坏、讥诮，因此“他们”是最自然的语境补足；脚注保留原文在语法上的开放性，避免把补足误当作明文。
- issue: “手”与“右手”的关系
  choice: 译作“你的手，就是你的右手”
  alternative: 译作“你的手和右手”，将二者作为并列成分
  rationale: 希伯来语连接结构可体现诗歌中的追加说明或强化。采用“就是”使现代汉语自然，并呈现“右手”对“手”的聚焦，但不把右手的象征意义直接释入正文。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语言。“收回你的手”保留希伯来诗歌的身体意象；后句补出“抽出手来”，使“从怀中”的省略在汉语中清楚自然。以“求你”承接祈使语气，避免直译显得突兀。
