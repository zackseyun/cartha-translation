  text: He was known like one who lifts up axes in a thicket of trees[a][b][c].
translation:
  language: zh_hans
  text: 他被人认出，如同一个在密林中向上举起斧头的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文简略而难解。也可译为：“他显得像一个在密林中向上举斧的人。”开头也可能泛指“有人被认出”；“举起”所译的词也可理解为“带来”。
    reason: textual_or_syntactic_difficulty
lexical_decisions:
- source_word: יִוָּדַע
  choice: 人看见他们
  rationale: 该词为 ידע 的尼法勒未完成式第三人称阳性单数，字面可作“他被认出/显得”。结合下一节继续描写毁坏圣所之人的复数行动，此处更自然地表达为非特指主语的“人看见他们”；但希伯来文形式和句法均较难，故以脚注保留更形式对应的译法。
- source_word: כְּמֵבִיא לְמָעְלָה
  choice: 好像人在……向上挥动
  rationale: כְּ 表示比较；מֵבִיא 是 בוא 的使役分词，可指“带来、举起”，לְמָעְלָה 表示“向上”。与斧头搭配时，“向上挥动”既自然，也保留举斧的方向性。
- source_word: בִּסֲבָךְ עֵץ
  choice: 在密林中
  rationale: סֲבָךְ 指稠密的灌木或林丛，עֵץ 可指树木或木材；合起来用“密林”简洁呈现树木丛生的景象。介词 בְּ 在此取地点义“在……中”。
- source_word: קַרְדֻּמּוֹת
  choice: 斧头
  rationale: 该复数名词指砍伐工具；现代汉语以集合性用法“斧头”即可自然表达，避免生硬地标出复数。
theological_decisions:
- issue: 本句主语及所指对象不明确
  choice: 译作“人看见他们”，将后文毁坏者作为所见对象，但不具体指认其身份
  alternative: “他显得像一个……”或“有人被认出，好像……”
  rationale: 希伯来文本句紧缩且可能存在传抄或诗体省略；上下文明确转向敌人毁坏圣所，但本节自身的阳性单数形式仍造成张力。因此正文采用符合语境的汉语表达，脚注保留形式更贴近原文的可能译法，不作神学身份推断。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“密林”“向上挥动斧头”保留原文伐木意象；正文避免拗口的被动句，并以脚注明示原文主语和动作关系的不确定性。
