  text: הָרִ֣ימָ/ה פְ֭עָמֶי/ךָ לְ/מַשֻּׁא֣וֹת נֶ֑צַח כָּל הֵרַ֖ע אוֹיֵ֣ב בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/003.yaml
  text: Lift up your steps to the perpetual ruins[a]; the enemy has devastated everything in the sanctuary.
translation:
  language: zh_hans
  text: 求你举步，走向长久荒废之处[a]；仇敌在圣所中所造成的一切破坏！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你抬起脚步，走向永续的荒凉。”希伯来文保留上帝迈向遭毁圣所的鲜明行动意象。
    reason: 说明“举步”的具体拟人意象，以及“长久荒废之处”对持续荒凉之义的替代性较直译表达。
lexical_decisions:
- source_word: הָרִימָה פְעָמֶיךָ
  choice: 求你举步
  rationale: 祈使语气是向上帝发出的恳求；“举步”保留“抬起脚步、动身前来”的具体拟人意象，又符合现代汉语诗体表达。
- source_word: לְמַשֻּׁאוֹת נֶצַח
  choice: 走向这长久荒废之地
  rationale: לְ 表示朝向；מַשֻּׁאוֹת 指遭毁坏后荒废的地方，נֶצַח 在此强调荒废持续已久或绵延不止。“长久荒废之地”避免把诗句过度限定为物质废墟，也不武断地理解为未来永远无法恢复。
- source_word: כָּל הֵרַע אוֹיֵב
  choice: 仇敌把……一切都毁坏了
  rationale: הֵרַע 是 רעע 的使役式完成时，在此表示加害、破坏；כָּל 作其概括性宾语。“一切都毁坏了”自然表达破坏的全面与严重。
- source_word: בַּקֹּדֶשׁ
  choice: 圣所里
  rationale: קֹדֶשׁ 在本诗语境中指神圣的殿宇或圣所范围；“圣所”保留其礼仪与神圣空间含义。
theological_decisions:
- issue: 开头对上帝所用的拟人化行动意象
  choice: 保留“求你举步”
  alternative: 求你前来；求你赶快来
  rationale: 原文具体描绘上帝抬步走向被毁圣所；保留这一意象，不额外加入“赶快”等速度含义。
- issue: נֶצַח 所描述荒废状态的时限
  choice: 译作“长久荒废”
  alternative: 永远荒废；永久的废墟
  rationale: 这里可强调荒废持续不止，但哀歌同时恳求上帝介入；“长久”保留持续性的张力，而不把它解释成绝对且不可逆转的永恒状态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你举步”维持诗歌的拟人意象；“把……一切都毁坏了”则以普通读者易懂的句式传达原文的全面破坏。
