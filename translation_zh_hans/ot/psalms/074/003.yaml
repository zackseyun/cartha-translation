- from: 求你举步，走向这长久荒废之地[a]；仇敌把圣所里的一切都毁坏了。
  to: 求你举步，走向长久荒废之处[a]；仇敌在圣所中所造成的一切破坏！
  rationale: 修订保留原译开头的祈求语气、上帝行动的具体意象及荒凉持续的张力。后半句改为“仇敌在圣所中所造成的一切破坏”，以更贴近 כָּל 与 הֵרַע 的可能结构和哀叹语气，不将原文未明确说出的“圣所中每一件物品都被毁坏”当作确定信息。脚注同步调整为与正文相符且自然的现代汉语。
