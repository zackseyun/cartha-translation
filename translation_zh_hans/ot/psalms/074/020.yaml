id: PSA.74.20
reference: Psalms 74:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַבֵּ֥ט לַ/בְּרִ֑ית כִּ֥י מָלְא֥וּ מַחֲשַׁכֵּי אֶ֝֗רֶץ נְא֣וֹת חָמָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/020.yaml
  text: Look to the covenant[c][b][a], for the dark places of the land are full of haunts of violence.
translation:
  language: zh_hans
  text: 求你顾念这约[a]，因为地上[b]的幽暗之处充满了暴力的巢穴[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的约”。原文直译为“这约”，上下文所指的是上帝与他子民所立的约。
    reason: alternative_reading
  - marker: b
    text: 或译：“这片土地上”或“大地上”。希伯来语 אֶרֶץ 可按语境指“土地”或“大地”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“暴力的居所”或“暴力盘踞之地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט
  choice: 求你顾念
  rationale: 这是 נבט 的祈使式，是向上帝发出的恳求，要他关注并眷顾所提之事；“求你顾念”既表达祷告语气，也比直译“观看”更自然。
- source_word: לַבְּרִית
  choice: 这约
  rationale: 原文有定冠词而无显明的所属后缀。“这约”保留其特指性，又不在正文中增添“你的”。
- source_word: כִּי
  choice: 因为
  rationale: 引出恳求的理由，明确保留因果关系。
- source_word: מָלְאוּ
  choice: 充满了
  rationale: Qal 完成式复数描述已经形成并持续存在的充满状态；“充满了”在中文中自然且贴切。
- source_word: מַחֲשַׁכֵּי אֶרֶץ
  choice: 地上的幽暗之处
  rationale: 保留“幽暗之处”的具体空间意象；אֶרֶץ 可指“地”或“全地/大地”，此处用“地上”不强行限定为以色列疆土。
- source_word: נְאוֹת
  choice: 巢穴
  rationale: נָוֶה 可指住处、居所或牧场；与“暴力”搭配时，“巢穴”自然表达暴力盘踞之地，但仍以脚注保留较中性的“居所”。
- source_word: חָמָס
  choice: 暴力
  rationale: חָמָס 常指暴力及暴虐不义；“暴力”是直接、通行的对应词。
theological_decisions:
- issue: 是否把约明确译作“你的约”
  choice: 这约
  alternative: 你的约
  rationale: 原文是带定冠词的“约”，没有第二人称所属后缀。上下文表明这是上帝与其子民所立的约，但正文不补入原文未明说的所属关系。
- issue: אֶרֶץ 的范围
  choice: 地上
  alternative: 这片土地上／大地上
  rationale: 该词既可指特定土地，也可指大地。诗篇语境可能聚焦于圣地，但本句本身仍有词义弹性，因此采用范围较开放的表达。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你顾念”传达向上帝恳求的语气；“幽暗之处”和“暴力的巢穴”保留原文阴森、具体的空间意象。脚注顺序按正文出现位置排列。
