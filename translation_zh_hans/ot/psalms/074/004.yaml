base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/004.yaml
  text: Your adversaries roared in the midst of your appointed place[c][b][a]; they set up their own signs as signs.
translation:
  language: zh_hans
  text: 你的仇敌在你所定的聚会场所中[a]咆哮；他们把自己的标志立作标志[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚会场所”或译“会面之处”“所定的地方”。希伯来语 מוֹעֵד 可指指定的时间、聚会或相会之处；这里按上下文理解为神圣的聚会场所。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文重复“标志”一词，直译为“他们把自己的标志立作标志”；可能是说敌人树立自己的旗号或徽记，作为占领或胜利的标记。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲגוּ
  choice: 咆哮
  rationale: 该动词本指狮子吼叫，也可引申为凶猛而具有威吓性的呼喊；“咆哮”保留了原文强烈、近乎兽吼的色彩。
- source_word: צֹרְרֶיךָ
  choice: 你的敌人
  rationale: 该词指敌对、攻击的一方；“敌人”是现代汉语中自然、清楚而不失庄重的表达，也适合本诗圣所遭侵犯的语境。
- source_word: בְּקֶרֶב
  choice: 在……之处
  rationale: 原短语表示在内部或当中。汉语将其与“相会之处”整合，表达敌人已经闯入圣所内部，而非仅在外围喧嚷。
- source_word: מוֹעֲדֶךָ
  choice: 你所定的相会之处
  rationale: מוֹעֵד可指指定的时间、聚集或相会之处；本段描述圣所遭毁，空间意义最合语境。“所定”保留“指定”的含义，“相会之处”则保留礼仪及会集色彩而不径直限定为某一建筑名称。
- source_word: שָׂמוּ
  choice: 立起
  rationale: שׂים意为放置、设立；这里涉及敌方标志在圣所中的公开展示，“立起”比单纯“放置”更符合旗号或徽记被树立的情景。
- source_word: אוֹתֹתָם
  choice: 自己的标志
  rationale: 词尾明确表示这些标志属于敌人；“自己的”使敌方标志侵占圣所的对比在汉语中清楚可见。
- source_word: אֹתוֹת
  choice: 作为标志
  rationale: 原文连续重复אוֹת（标志），形成简短而强调的措辞；译文保留同词重复，不擅自具体化为军旗、偶像或胜利徽号。
theological_decisions:
- issue: מוֹעֵד在圣所遭亵渎哀歌中的含义
  choice: 按地点及礼仪语境译为“你所定的相会之处”
  alternative: “你的会所”“你所定的地方”“你所定的节期”
  rationale: 上下文描写敌人进入并毁坏神圣空间，因此地点义最自然；同时不用“圣殿”等更明确的建筑名称，以保留该词可指相会、聚集及指定安排的语义张力。
- issue: אוֹתֹתָם אֹתוֹת的重复
  choice: 保留为“自己的标志，作为标志”
  alternative: “把自己的旗号立作得胜的记号”或“立起自己的徽记”
  rationale: 希伯来文并未说明这些标志究竟是军旗、徽记、偶像还是占领记号；直保留重复可避免把可能的历史及神学含义过早定死。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“咆哮”保留诗歌的暴烈意象；“相会之处”具有敬虔语域，但不使用生僻古语。第二分句刻意保留原文略显突兀的重复，并以脚注说明其可能含义。
