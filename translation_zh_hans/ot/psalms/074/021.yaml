  text: אַל יָשֹׁ֣ב דַּ֣ךְ נִכְלָ֑ם עָנִ֥י וְ֝/אֶבְי֗וֹן יְֽהַלְל֥וּ שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/021.yaml
  text: Do not let the oppressed turn back ashamed[b][a]; let the poor and needy praise your name.
translation:
  language: zh_hans
  text: 不要让受压迫的人[a]蒙羞[b]而归；愿贫苦的人和穷乏的人赞美你的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受压迫的人”或译“被压碎的人”、“受践踏的人”。
    reason: lexical_alternative
  - marker: b
    text: “蒙羞”或译“受辱”；原文可包含当众遭羞辱的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יָשֹׁב
  choice: 不要让……而归
  rationale: אַל与未完成式连用，在祷告中表达恳求；יָשֹׁב意为“返回、转回”。“不要让……而归”自然地保留了诗人向上帝发出的请求。
- source_word: דַּךְ
  choice: 受压迫的人
  rationale: 该词可指被压碎、受欺压或受践踏的人。“受压迫的人”在现代汉语中自然，并保留其社会处境和受苦意味。
- source_word: נִכְלָם
  choice: 蒙羞
  rationale: 该词是被动形式，表示遭受羞辱或被置于羞耻中。“蒙羞”比单纯内在的“惭愧”更能体现可能包含的公开羞辱意味。
- source_word: עָנִי
  choice: 贫苦
  rationale: 该词可指贫穷、受苦或卑微的人；与אֶבְיוֹן并列时，贫困和困苦的含义较突出。
- source_word: אֶבְיוֹן
  choice: 穷乏的人
  rationale: 该词常指缺乏生活所需、亟需帮助的人。“穷乏的人”既与“贫苦”有区别，也保留常见的希伯来语配对。
- source_word: יְהַלְלוּ
  choice: 愿……赞美
  rationale: Piel未完成式在此具有祈愿或请求语气。“愿……赞美”与前句的祷告语气相称，又不把两句明确解释为因果关系。
- source_word: שְׁמֶךָ
  choice: 你的名
  rationale: 直译保留希伯来语中指向上帝所启示的身份、品格与声誉的重要表达，现代中文读者也能自然理解。
theological_decisions:
- issue: 末句与前句的逻辑关系
  choice: 将末句译为独立而相应的祈愿：“愿贫苦和穷乏的人赞美你的名。”
  alternative: 将末句明确译成上帝拯救后的结果，如“使贫苦和穷乏的人可以赞美你的名”。
  rationale: 希伯来文的祈愿式序列支持并列的祷告请求，却没有明说因果关系。译文保留前后呼应，不额外强化因果解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“蒙羞而归”凝练自然，保留“返回”与“受辱”的语义；“贫苦和穷乏的人”体现两个近义词的并列，避免将其完全合并。脚注标记均置于相关短语之后。
