  text: רַ֭ק בְּ/עֵינֶ֣י/ךָ תַבִּ֑יט וְ/שִׁלֻּמַ֖ת רְשָׁעִ֣ים תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/008.yaml
  text: You will only look with your eyes and see the repayment of the wicked[a].
translation:
  language: zh_hans
  text: 你只会亲眼观看，见到恶人的报偿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“恶人的报应”，或“恶人所受的惩罚”。
    reason: 词义可指回报、报偿或应得的结局；在此恶人语境中可引申为报应或惩罚，但正文以“报偿”保留原文较宽的语义。
lexical_decisions:
- source_word: רַק
  choice: 只
  rationale: 表达限制与强调：受话者只会亲眼目睹所述结局，而不是亲身遭受它。
- source_word: בְּעֵינֶיךָ
  choice: 亲眼
  rationale: 自然保留以自己的眼睛观看这一希伯来语意象，同时符合现代汉语习惯。
- source_word: תַבִּיט
  choice: 观看
  rationale: נבט 的使役词干在此意为注目、观看；“观看”清楚而庄重，也能与下文“看见”相配。
- source_word: וְשִׁלֻּמַת
  choice: 所得的报应
  rationale: 该名词源于 שלם，表示回报、报偿；“所得的报应”保留按行为得到相应回报的含义，又不把词义过度限定为某种具体刑罚。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是诗篇中该复数名词化形容词的自然、传统且准确的汉语表达。
- source_word: תִּרְאֶה
  choice: 看见
  rationale: 忠实表达 ראה 的普通意义，并保留原文“观看—看见”两个动词的并列推进。
theological_decisions:
- issue: 恶人结局的性质
  choice: 恶人所得的报应
  alternative: 恶人所受的惩罚；恶人所得的报偿
  rationale: 原文说明受话者将看见恶人所得的回报，但 שִׁלֻּמָה 的范围比明确的司法性“惩罚”更宽。“报应”保留道德与公正回报的意味，而不具体限定其机制。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。“亲眼”自然呈现希伯来语的身体意象；保留“观看／看见”的动词呼应。
