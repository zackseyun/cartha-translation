  text: כִּ֣י מַ֭לְאָכָי/ו יְצַוֶּה לָּ֑/ךְ לִ֝/שְׁמָרְ/ךָ֗ בְּ/כָל דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/011.yaml
  text: For he will command his angels concerning you[b][a], to guard you in all your ways.
translation:
  language: zh_hans
  text: 因为他必为你[a]吩咐他的天使，在你一切的道路上保护你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于你”。这里的希伯来语结构既可表示为了某人的益处，也可表示与某人有关。
    reason: lexical_alternative
  - marker: b
    text: 或译：“守护你”或“看顾你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为此前的保障说明理由；“因为”自然保留希伯来语的解释或因果作用。
- source_word: מַלְאָכָיו
  choice: 他的天使
  rationale: 该词本可指“使者”，但本诗语境指奉上帝之命施行保护的天上使者，因此译作“天使”。
- source_word: יְצַוֶּה
  choice: 必吩咐
  rationale: Piel词形表达发出命令；“必吩咐”既体现命令含义，也符合庄重而自然的现代汉语。
- source_word: לָּךְ
  choice: 为你
  rationale: 这里的介词结构表示命令是为受话者的益处或与其有关；正文采用较自然的“为你”，并以脚注保留“关于你”的可能表达。
- source_word: לִשְׁמָרְךָ
  choice: 保护你
  rationale: שׁמר可表示看守、守护或保护；在危险与搭救的语境中，“保护你”清楚表达其防护作用，同时以脚注保留其他译法。
- source_word: בְּכָל דְּרָכֶיךָ
  choice: 在你一切所行的路上
  rationale: 保留“道路”的希伯来语意象，并用“所行的”使现代汉语更自然；该表达仍可兼指实际道路和人生行程。
theological_decisions:
- issue: 第三人称阳性单数动词隐含主语的所指
  choice: 理解为上帝；他吩咐自己的天使保护受话者
  alternative: 本节不重复明说主语，而仅用“他”承接上文
  rationale: 上下文持续描述耶和华的保护，阳性单数动词自然回指上帝；译文保留原文代词形式，不额外把“他”改写成“上帝”。
- issue: “你一切所行的路”是否限定为合乎上帝旨意的道路
  choice: 不加限定，保留原文宽泛措辞
  alternative: 解释为“你合宜的道路”或“上帝为你安排的道路”
  rationale: 原文只说“你一切的道路”，没有明说道德或神学限定；不应在正文中加入原文未表达的限制。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“必吩咐”体现诗歌中坚定的应许语气；“在你一切所行的路上”保留道路意象及其可能的字面与比喻双重含义。脚注标记均置于正文对应词语之后。
