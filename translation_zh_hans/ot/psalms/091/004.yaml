base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/004.yaml
  text: With his pinions he will cover you[a], and under his wings you will find refuge[b]; his faithfulness is a shield and a bulwark.
translation:
  language: zh_hans
  text: '他必用自己的羽翼遮蔽你[a]；

    你必投靠在他的翅膀底下；

    他的信实[b]是大盾和小盾[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羽翼”或译“翎羽”。
    reason: lexical_alternative
  - marker: b
    text: “信实”或译“真实”。
    reason: lexical_alternative
  - marker: c
    text: “小盾”所译的希伯来词含义不确定；传统上译作“小盾”或“圆盾”，也可能指环绕性的防护。
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: בְּאֶבְרָתוֹ
  choice: 用自己的羽翼
  rationale: אֶבְרָה指鸟的翎羽、羽翼或有羽毛的翼部。“羽翼”既保留鸟护雏的意象，也符合现代汉语诗体表达；介词בְּ译作“用”，体现遮蔽的方式。
- source_word: יָסֶךְ
  choice: 必……遮蔽
  rationale: סכך的使役式表达覆盖并保护；“遮蔽”兼顾具体的覆翼动作和保护含义。未完成式在本诗的应许语境中译作“必”。
- source_word: לָךְ
  choice: 你
  rationale: 希伯来语为第二人称阴性单数，但在诗中泛指受劝勉、信靠上帝的人；现代汉语“你”无须标明性别。
- source_word: וְתַחַת כְּנָפָיו
  choice: 在他的翅膀底下
  rationale: 按空间关系直译，并延续上半句鸟翼保护的比喻。
- source_word: תֶּחְסֶה
  choice: 你必投靠
  rationale: חסה意为寻求或取得庇护。“投靠”自然表达主动来到保护之下，没有把结果性的安全感过度增译出来。
- source_word: צִנָּה
  choice: 大盾
  rationale: צִנָּה通常指较大的盾牌；译为“大盾”保留与普通小盾可能有别的尺寸特征。
- source_word: וְסֹחֵרָה
  choice: 是护墙
  rationale: סֹחֵרָה是罕见词，具体所指不确定，可能与环绕防护有关。“护墙”表达防御性和包围式保护，并与“大盾”形成平行。
- source_word: אֲמִתּוֹ
  choice: 他的信实
  rationale: אֱמֶת可指真实、真理、可靠或信实；此处作为保护的根据，“信实”自然突出上帝可信可靠的品格，同时以脚注保留“真实”这一可能译法。
theological_decisions:
- issue: אֲמִתּוֹ在保护比喻中的含义
  choice: 他的信实
  alternative: 他的真实
  rationale: 上下文强调上帝可靠的保护，因此“信实”最贴合语境；但原词也确有“真实、真理”义，故不将这种多义性从读者面前隐藏。
- issue: 两种保护意象之间的关系
  choice: 大盾，是护墙
  alternative: 盾牌和小盾
  rationale: 原文将צִנָּה与含义不确定的סֹחֵרָה并列。正文保留两个防御名词和隐喻张力，不将它们解释成抽象的“完全保护”；传统的盾牌类理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分成三个短行以呈现希伯来诗歌的意象推进：羽翼遮蔽、翅下投靠、信实如防具。不补出原文没有的“你的”，也不把罕见防御名词过度确定化。
