id: PSA.91.10
reference: Psalms 91:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹֽא תְאֻנֶּ֣ה אֵלֶ֣י/ךָ רָעָ֑ה וְ֝/נֶ֗גַע לֹא יִקְרַ֥ב בְּ/אָהֳלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/010.yaml
  text: No harm will happen to you[b][a], and no plague will come near your tent.
translation:
  language: zh_hans
  text: 灾祸[a]必不临到你，瘟疫也不靠近你的帐棚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”或译“祸患”或“恶事”。
    reason: lexical_alternative
  - marker: b
    text: “帐棚”也可泛指“住处”或“家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאֻנֶּה
  choice: 临到
  rationale: 该词在此表示事情发生或落到某人身上；“临到你”在现代汉语中自然庄重，也与介词 אֵלֶיךָ 的方向含义相合。
- source_word: רָעָה
  choice: 灾祸
  rationale: 在本篇保护性的语境中，主要指伤害人的不幸或灾难，而非专指道德上的邪恶；“灾祸”保留了逆境与伤害的宽泛含义。
- source_word: נֶגַע
  choice: 瘟疫
  rationale: 该词可指击打、灾病或疫病；结合诗篇91篇有关致命疫病与危险的语境，“瘟疫”清楚而贴切。
- source_word: יִקְרַב
  choice: 靠近
  rationale: 直接保留 קרב 的空间意象，且“靠近你的帐棚”符合自然现代汉语。
- source_word: אָהֶל
  choice: 帐棚
  rationale: 希伯来语的具体含义是“帐棚”，也可引申为住所或家庭；正文保留原有具象表达，并以脚注说明较宽泛的含义。
- source_word: אֵלֶיךָ
  choice: 到你
  rationale: 该介词表示朝向受话者；与“临到”组合为自然的汉语表达“临到你”。
theological_decisions:
- issue: 应许之保护的性质
  choice: 按诗歌的直接语气表达上帝保护的应许，不在译文中增添限制或解释。
  alternative: 将本节明确解释为信靠上帝的人在任何情况下都绝不会经历肉身痛苦。
  rationale: 希伯来文本直接而富有诗意地宣告保护；译文应保留这种力度，同时不越过本节，替读者解决有关苦难与护理的更广泛神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“临到……靠近……”保留原文两个分句的平行结构；“帐棚”保留古代诗歌的具体意象，脚注提示其可涵盖住处或家庭。
