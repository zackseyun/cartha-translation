  text: כִּֽי אַתָּ֣ה יְהוָ֣ה מַחְסִ֑/י עֶ֝לְי֗וֹן שַׂ֣מְתָּ מְעוֹנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/009.yaml
  text: Because you[a], O Yahweh, are my refuge, you have made the Most High your dwelling place.
translation:
  language: zh_hans
  text: 因为你[a]，耶和华，是我的避难所；你已把至高者当作你的居所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来文句法较难。也可按常见理解译作：“因为你曾说：‘耶和华是我的避难所’，又把至高者当作你的居所。”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出蒙保护的缘由，保留因果关系。
- source_word: אַתָּה
  choice: 你
  rationale: 保留希伯来文显明写出的第二人称单数代词及其强调作用。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名最通行、最易辨认的音译，不以称号替代专名。
- source_word: מַחְסִי
  choice: 我的避难所
  rationale: 准确表达 מַחְסֶה 所指的庇护、避难之处，并符合诗篇的庄重用语。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 作为上帝的称号，简洁而自然地表达“最高者”。
- source_word: שַׂמְתָּ
  choice: 你已把……当作
  rationale: 表达 שׂים 在此处“设定、以……为”的完成意义，并使现代汉语搭配自然。
- source_word: מְעוֹנֶךָ
  choice: 你的居所
  rationale: 表达居住之处，并与前面的“避难所”保持词义区别。
theological_decisions:
- issue: 诗篇91:9说话者与受话者的句法关系
  choice: 按马所拉文本的显式措辞译作对“你”的直接陈述：“因为你，耶和华，是我的避难所；你已把至高者当作你的居所。”
  alternative: 按常见理解补出“说”：“因为你曾说：‘耶和华是我的避难所’，又把至高者当作你的居所。”
  rationale: 希伯来文没有明写“说”，却在“我的避难所”与“你的居所”之间出现人称转换。正文不补入原文没有的动词，以保留其压缩句法和张力；常见的另一种理解收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“避难所”和“居所”保留原文两个不同名词；分号呈现诗句两部分的紧密关系，同时避免替原文消解人称转换。
