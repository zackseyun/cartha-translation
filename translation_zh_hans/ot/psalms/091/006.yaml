  text: nor the plague that walks in darkness[a], nor the destruction that devastates at noon.
translation:
  language: zh_hans
  text: 也不怕黑暗中横行的瘟疫[a]，也不怕正午肆虐的灾祸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瘟疫”也可译作“疫病”；“灾祸”也可能指“致命的疫病”。希伯来文在这里使用两个诗意的平行词，描写带来毁灭的威胁。
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּבֶר
  choice: 瘟疫
  rationale: 该词常指造成广泛死亡的疫病；“瘟疫”在现代汉语中清楚自然，也与下半句的毁灭性威胁构成诗意平行。
- source_word: בָּאֹפֶל
  choice: 黑暗中
  rationale: אֹפֶל表示深暗或幽暗；“黑暗中”保留原文意象，并与“正午”形成鲜明对照。
- source_word: יַהֲלֹךְ
  choice: 游行
  rationale: הלך本义为行走、来往；“游行”在此表示四处行走，保留瘟疫被人格化的诗歌形象，而非现代政治活动之义。
- source_word: קֶּטֶב
  choice: 灾害
  rationale: 该词可表示毁灭、灾殃，也可能含致命疫病的意味；“灾害”避免把含义过早限定为疾病，同时保留其毁灭性。
- source_word: יָשׁוּד
  choice: 肆虐
  rationale: 此动词表达猛烈毁坏、蹂躏；“肆虐”自然有力，并能用于灾害，贴合原文动态意象。
- source_word: צָהֳרָיִם
  choice: 正午
  rationale: 该词明确指中午时分；“正午”简洁庄重，并保留与“黑暗”的时空对照。
- source_word: מִן
  choice: 也不怕……或……
  rationale: 介词本义为“从”，但本节承接第5节“不怕”的句法，列出人蒙保护而无须惧怕的威胁；中文用“也不怕……或……”自然延续这一结构。
