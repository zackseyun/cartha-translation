  text: אֹמַ֗ר לַֽ֭/יהוָה מַחְסִ֣/י וּ/מְצוּדָתִ֑/י אֱ֝לֹהַ֗/י אֶבְטַח בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/002.yaml
  text: I say to Yahweh[a], “My refuge and my fortress, my God, in whom I trust.”
translation:
  language: zh_hans
  text: 我对雅威[a]说：“我的避难所，我的堡垒；我的上帝，我信靠他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“YHWH”（יהוה），这里音译为“雅威”；传统译作“耶和华”，也常以“主”代称。
    reason: 说明神名原文、音译处理及传统中文译法。
lexical_decisions:
- source_word: אֹמַר
  choice: 我要……说
  rationale: אמר 的第一人称单数未完成式在这里可表示当前的宣告，也可带意愿或将来意味。译作“我要说”在诗歌语境中自然，也保留其意愿色彩。
- source_word: לַיהוָה
  choice: 对雅威
  rationale: 介词 ל 最自然地标明话语的对象，即“对雅威说”，而非“论到雅威”。
- source_word: יהוה
  choice: 雅威
  rationale: 直接音译四字神名 YHWH，以保留经文所用的立约之名；脚注说明传统译法。
- source_word: מַחְסִי
  choice: 我的避难所
  rationale: מַחְסֶה 指躲避危险、获得庇护之处；“避难所”准确而通俗。
- source_word: וּמְצוּדָתִי
  choice: 我的堡垒
  rationale: מְצוּדָה 指防御坚固之处；“堡垒”保留原文的军事防护意象。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 第一人称单数后缀明确表达个人归属与信仰告白。
- source_word: אֶבְטַח
  choice: 我信靠
  rationale: בטח 的第一人称单数未完成式表达倚赖与信任；这里译为一般现在意义，与持续的信靠告白相合。
- source_word: בּוֹ
  choice: 你
  rationale: 字面为“他/其中”。由于中文引语中已直接称呼雅威，顺应同一话语对象改用第二人称“你”，使句子自然，同时不改变所指。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。采用“雅威”较直接地呈现该专名，并用脚注交代传统译法，不以普通称号取代专名。
- issue: 后半句的人称表达
  choice: 你是我的上帝，我信靠你
  alternative: 我的上帝，我信靠他／我所信靠的上帝
  rationale: 希伯来文的 בּוֹ 是第三人称，但整句由“对雅威说”引入，前半也可理解为直接称呼。中文转为第二人称可保持连贯自然；所指仍是雅威，并未改变神学内容。
translation_notes:
  register: 采用现代、庄重而口语可懂的诗歌告白体。“避难所／堡垒”保留平行结构和保护意象；分号呈现“我的上帝”与前两个称谓之间的诗行层次。
