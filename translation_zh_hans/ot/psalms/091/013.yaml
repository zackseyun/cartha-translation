  text: עַל שַׁ֣חַל וָ/פֶ֣תֶן תִּדְרֹ֑ךְ תִּרְמֹ֖ס כְּפִ֣יר וְ/תַנִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/013.yaml
  text: You will tread on the lion and the cobra[b][a]; you will trample the young lion and the serpent.
translation:
  language: zh_hans
  text: 你必踩在狮子和毒蛇[b]之上；你必践踏少壮狮子和大蛇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大蛇”或译“龙”；这个希伯来词在别处也可指大型爬行动物或海中生物。
    reason: alternative_reading
  - marker: b
    text: “毒蛇”传统上有时译作“虺蛇”，也可具体理解为“眼镜蛇”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: 在……之上
  rationale: 表示被踩踏的对象；与“踩在……之上”搭配，符合现代汉语表达。
- source_word: שַׁחַל
  choice: 猛狮
  rationale: 这是“狮子”的诗歌用词，可带凶猛之意；译作“猛狮”既与后面的“少壮狮子”有所区别，也保留危险感。
- source_word: פֶתֶן
  choice: 毒蛇
  rationale: 指危险的毒蛇，传统上有时具体译为“虺蛇”或“眼镜蛇”；“毒蛇”自然易懂，也避免对具体蛇种作过度确定。
- source_word: תִּדְרֹךְ
  choice: 你必踩在
  rationale: Qal未完成式第二人称阳性单数；在应许语境中译作“必”，并保留踩在其上的动作。
- source_word: תִּרְמֹס
  choice: 你必践踏
  rationale: 比前一动词更强，表达踩踏、制伏；“践踏”保留诗体力度和递进。
- source_word: כְּפִיר
  choice: 少壮狮子
  rationale: 通常指年轻而强健的狮子，不是幼小的狮崽；“少壮狮子”准确体现其力量。
- source_word: תַנִּין
  choice: 大蛇
  rationale: 该词可指大蛇、巨兽或海中巨兽；在本节陆地危险动物的并列中，“大蛇”最贴合语境，同时以脚注保留“龙”等可能性。
theological_decisions:
- issue: תַנִּין应按神话性形象译为“龙”，还是按动物性形象译为“大蛇”
  choice: 大蛇
  alternative: 龙；巨兽；海怪
  rationale: 本节将其与猛狮、毒蛇和少壮狮子并列，语境更支持陆地上的危险爬行动物。但原词语义范围较广，传统的“龙”仍在脚注中保留，以免消除原文可能具有的象征张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两个分句以“踩在”与“践踏”形成力度递进；用“猛狮”与“少壮狮子”呈现两个不同的希伯来语狮子称谓。
