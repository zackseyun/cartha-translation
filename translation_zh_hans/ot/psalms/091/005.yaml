  text: לֹא תִ֭ירָא מִ/פַּ֣חַד לָ֑יְלָה מֵ֝/חֵ֗ץ יָע֥וּף יוֹמָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/005.yaml
  text: You will not fear the terror of the night[b][a], nor the arrow that flies by day.
translation:
  language: zh_hans
  text: 你必不惧怕[a]夜间的惊恐[b]，也不惧怕白日飞来的箭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你无须惧怕”，以突出确信的意味。
    reason: lexical_alternative
  - marker: b
    text: “惊恐”或译“恐怖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: 你必不惧怕
  rationale: 这是ירא的Qal未完成式第二人称阳性单数，与לֹא连用；结合本诗语境，译作带确信意味的“必不惧怕”，比命令式“不要惧怕”更贴近原文形式。
- source_word: פַּחַד
  choice: 惊恐
  rationale: 该词指令人恐惧的威胁或恐怖，也可指畏惧；“惊恐”既保留强烈程度，又能自然地与“夜间的”搭配。
- source_word: לָיְלָה
  choice: 夜间的
  rationale: 译为“夜间的惊恐”，保留前半句的诗歌意象，并与后半句“白日”形成鲜明对应。
- source_word: חֵץ
  choice: 箭
  rationale: 原词通常指具体的箭；即使这里可能象征危险，也应保留原文的具体意象。
- source_word: יָעוּף
  choice: 飞行的
  rationale: עוּף意为“飞”；此处以关系性修饰语自然表达为“飞行的箭”。
- source_word: יוֹמָם
  choice: 白日
  rationale: 该副词表示“在白天”；译作“白日”简洁庄重，并与“夜间”构成诗意对仗。
- source_word: מִן ... מִן
  choice: 惧怕……也不惧怕……
  rationale: 重复的介词引出惧怕所针对或所来自的威胁。中文用重复谓语协调两项对象，既自然，也保留平行结构。
theological_decisions:
- issue: 本节应译为命令还是应许性的确信
  choice: 应许/确信：“你必不惧怕”
  alternative: 命令：“你不要惧怕”
  rationale: 原文是לֹא加未完成式，在此诗歌语境中更自然地表达受保护之人的处境与确信，而不必读作直接禁令；这样也不把原文未明确表达的命令语气加入译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必不”传达应许性的确信；“夜间”与“白日”、“惊恐”与“箭”保留原诗的平行和具体意象。
