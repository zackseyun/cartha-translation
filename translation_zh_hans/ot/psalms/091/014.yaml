id: PSA.91.14
reference: Psalms 91:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י בִ֣/י חָ֭שַׁק וַ/אֲפַלְּטֵ֑/הוּ אֲ֝שַׂגְּבֵ֗/הוּ כִּֽי יָדַ֥ע שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/014.yaml
  text: Because he clings to me[a], I will rescue him; I will set him securely on high[b], because he knows my name.
translation:
  language: zh_hans
  text: “因为他依恋我[a]，我必搭救他；我必把他安置在高处，使他安稳[b]，因为他认识我的名。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他爱我”或“他一心眷恋我”。希伯来语动词表示强烈的爱慕或依附。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我必使他安居高处”或“我必保护他”。希伯来语动词含有把人置于高而安全、难以侵及之处的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 两处均引出上帝采取行动的原因；“因为”自然并保留因果关系。
- source_word: בִי חָשַׁק
  choice: 他依恋我
  rationale: חָשַׁק 表达强烈的眷恋、爱慕或紧密依附。“依恋”兼顾情感与坚定依附，也避免只收窄为一般的“爱”。
- source_word: וַאֲפַלְּטֵהוּ
  choice: 我必搭救他
  rationale: 表达上帝承诺把人从危险中救出；“搭救”是清楚、自然且庄重的现代汉语。
- source_word: אֲשַׂגְּבֵהוּ
  choice: 我必把他安置在高处，使他安稳
  rationale: 保留 שׂגב 所含“置于难以侵及的高处”的空间比喻，同时点明其安全、受保护的含义。
- source_word: יָדַע
  choice: 认识
  rationale: 保留希伯来语中带有人际和关系意味的“认识”，不扩写为“承认”或其他解释性表达。
- source_word: שְׁמִי
  choice: 我的名
  rationale: 直译“我的名”，让名字所承载的身份、品格和启示等含义保持含蓄，不在正文中加以神学化扩写。
theological_decisions:
- issue: 人对上帝强烈依附的关系性表达
  choice: 译作“他依恋我”
  alternative: “他爱我”或“他紧紧依附我”
  rationale: 既呈现 חָשַׁק 的强烈情感和依附意味，又不把它化约为单纯情绪或加入特定宗派性的盟约解释。
- issue: אֲשַׂגְּבֵהוּ 的保护性高度比喻
  choice: 译作“我必把他安置在高处，使他安稳”
  alternative: “我必保护他”或“我必使他升高”
  rationale: 保留借不可侵及的高处表达安全的诗歌意象，并以“使他安稳”说明该意象的保护意义，避免误解为地位上的尊荣。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。以“我必”呈现上帝郑重的应许；保留“高处”和“我的名”等原文意象与措辞，并用脚注呈现真实的词义幅度。
