  text: A thousand may fall at your side[a], and ten thousand at your right hand[b], but it will not come near you.
translation:
  language: zh_hans
  text: 千人仆倒在你身旁[a]，万人仆倒在你右边；那灾祸却不临近你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“千人将仆倒在你身旁，万人将仆倒在你右边。”希伯来文的未完成式在这首诗中可表示将来，也可表示可能的情形。
    reason: lexical_alternative
  - marker: b
    text: 直译：“它不会向你靠近。”希伯来文没有明说此句的主语；按上下文，所指可能是威胁人的灾祸。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפֹּל
  choice: 仆倒
  rationale: 这是 נפל 的未完成式，表示倒下、坠落；在本节关于众人遭难的图景中，“仆倒”既保留动作的强烈感，也符合庄重的诗歌语体。未完成式可有将来或情态意味，正文用“即使”呈现其可能、让步语气，并在脚注保留将来式理解。
- source_word: מִצִּדְּךָ
  choice: 在你身旁
  rationale: 介词 מִן 字面有“从”之意，但与“倒下”连用时表示相对于受话者的位置；“在你身旁”自然地保留空间图像。
- source_word: אֶלֶף
  choice: 千人
  rationale: 保留原文明确数目，并与下句“万人”构成递进平行。
- source_word: וּרְבָבָה
  choice: 万人
  rationale: רְבָבָה 通常指一万；译作“万人”简洁自然，也保留从“千”到“万”的诗意加强。
- source_word: מִימִינֶךָ
  choice: 在你右边
  rationale: 此处介词表达空间位置；“在你右边”准确、自然，并与“在你身旁”形成平行。
- source_word: אֵלֶיךָ
  choice: 临近你
  rationale: אֶל 与 נגשׁ 连用表示向某人靠近；“临近你”保留威胁逼近的动态，又不额外表达已经触及或伤害。
- source_word: לֹא יִגָּשׁ
  choice: 不会临近
  rationale: נגשׁ 表示靠近、接近；否定未完成式在此表达将来性的保证。“不会临近”符合现代汉语，又比“不会伤害”更贴近原文。
theological_decisions:
- issue: 末句未明说的主语
  choice: 正文补作“那灾祸”
  alternative: 保留为较含混的“它”，或具体译作“瘟疫”
  rationale: 希伯来文末句只有阳性单数动词，并未明说主语；上下文指向正在逼近的危险或灾难。汉语正文补出“那灾祸”，使指代自然，同时不把范围收窄为某一种特定灾害；脚注说明原文的含混。
- issue: יִפֹּל 的将来与情态含义
  choice: 用“即使”表达可能情形中的让步关系
  alternative: 译作“必有千人仆倒……万人仆倒……”
  rationale: 诗歌中的未完成式既可作将来陈述，也可带情态色彩。正文采用自然的让步表达，避免把周遭死亡过度断定为必然发生；脚注保留将来式读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“千人……万人”和“身旁……右边”保留原文平行与递进；“即使……也……”使希伯来诗句隐含的让步关系在汉语中清楚自然。
