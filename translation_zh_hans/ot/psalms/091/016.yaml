  text: אֹ֣רֶךְ יָ֭מִים אַשְׂבִּיעֵ֑/הוּ וְ֝/אַרְאֵ֗/הוּ בִּֽ/ישׁוּעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/016.yaml
  text: I will satisfy him with length of days[a], and I will show him my salvation.
translation:
  language: zh_hans
  text: 我要使他饱享长寿[a]，让他看见我的拯救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“长久的年日”。原文直译为“年日的长久”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: 长久的年日
  rationale: 该组合词直指“年日的长久”。译作“长久的年日”既保留希伯来语的表达质感，也符合现代汉语；相比“长寿”，它更贴近原文形式。
- source_word: אַשְׂבִּיעֵהוּ
  choice: 我要使他饱享
  rationale: שׂבע 的使役式表示“使满足、使饱足”。与“长久的年日”搭配时，“使他饱享”自然传达充分满足之意，并保留以“他”为宾语的结构。
- source_word: וְאַרְאֵהוּ
  choice: 让他看见
  rationale: ראה 的使役式意为“使……看见、向……显明”。“让他看见”在现代汉语中自然，也保留上帝主动使其得见的含义。
- source_word: בִּישׁוּעָתִי
  choice: 我的拯救
  rationale: יְשׁוּעָה 可指从危险中获救，也可承载更广的救恩含义。“我的拯救”既是自然的中文，又能保留具体搭救与广义救恩之间的语义张力。介词 ב 在此引出所显明的内容。
theological_decisions:
- issue: 保护诗结尾中 יְשׁוּעָה 的范围
  choice: 我的拯救
  alternative: 我的救恩
  rationale: 上下文容许具体的解救，也不排除更广的神学含义。“拯救”在中文中能够涵盖上帝施行搭救的行动及其较宽含义，不把经文限定为纯粹今世的脱险或特定体系中的救恩概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“饱享”对应原文的满足、饱足意象；“长久的年日”保留希伯来语习语，同时以脚注提供更顺畅的“长寿”。
