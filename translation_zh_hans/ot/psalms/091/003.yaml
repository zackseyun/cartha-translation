  text: כִּ֤י ה֣וּא יַ֭צִּֽילְ/ךָ מִ/פַּ֥ח יָק֗וּשׁ מִ/דֶּ֥בֶר הַוּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/003.yaml
  text: For he will deliver you from the snare of the fowler[b][a], from the deadly pestilence.
translation:
  language: zh_hans
  text: 因为他必救你脱离捕鸟人的网罗，脱离致命的瘟疫。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “致命的瘟疫”或译“毁灭性的瘟疫”或“带来毁灭的瘟疫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本节说明上文信靠与安稳的根据；“因为”自然保留了希伯来语在此的解释、承接作用。
- source_word: הוּא
  choice: 他
  rationale: 独立代词使主语略带强调。现代汉语用“他必……”即可在语境中自然传达，不必生硬地增译为“他亲自”。
- source_word: יַצִּילְךָ
  choice: 必救你脱离
  rationale: נצל 的使役形表示从危险中搭救、解救；“必救你脱离”既准确，也符合诗歌中郑重的应许语气。
- source_word: מִפַּח
  choice: 脱离……网罗
  rationale: פַּח 指捕捉猎物的罗网或陷阱；与后面的“捕鸟人”搭配时，“网罗”形象明确，也保留诗歌色彩。
- source_word: יָקוּשׁ
  choice: 捕鸟人
  rationale: 该词指布设罗网者，尤其是捕鸟者；“捕鸟人”是清楚、自然的现代汉语表达。
- source_word: מִדֶּבֶר
  choice: 脱离……瘟疫
  rationale: דֶּבֶר 常指造成广泛死亡的疫病或瘟疫；“瘟疫”保留了原词所含的严重、灾难性意味。
- source_word: הַוּוֹת
  choice: 致命的
  rationale: 该词表达毁灭、灾祸或致死的危害；在正文中作定语译为“致命的”，简洁自然，同时以脚注保留“毁灭性的”等可能理解。
theological_decisions:
- issue: 本节所述危险的性质
  choice: 保留“捕鸟人的网罗”和“瘟疫”这两种具体危险意象，同时不限定它们只能按字面或只能按象征理解。
  alternative: 仅指现实中的身体危险；或完全指属灵、象征性的危险。
  rationale: 希伯来诗句确实描述具体威胁，但诗歌语境也容许这些意象概括更广泛的危险。译文不替原文消除这层张力。
- issue: הַוּוֹת 与 דֶּבֶר 的语法语义关系
  choice: 译作“致命的瘟疫”，将 הַוּוֹת 理解为说明瘟疫具有致死、毁灭的性质。
  alternative: “毁灭性的瘟疫”或“带来毁灭的瘟疫”。
  rationale: 原文可表达毁灭、灾祸之意；“致命的”在汉语中最自然，也与瘟疫的严重性相称，但脚注保留较贴近“毁灭”的译法。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“网罗”略具诗歌色彩，却仍为普通读者熟悉；句式保留两次“脱离”，对应希伯来语的平行结构，并使两类危险清楚并列。
