  text: עַל כַּפַּ֥יִם יִשָּׂא֑וּ/נְ/ךָ פֶּן תִּגֹּ֖ף בָּ/אֶ֣בֶן רַגְלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/012.yaml
  text: On their hands they will carry you[b][a], lest you strike your foot against a stone.
translation:
  language: zh_hans
  text: 他们要用双手托着你[a]，免得你的脚撞在石头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “托着”也可译作“承载”或“把……举起”。原文直译为“在双掌上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כַּפַּיִם
  choice: 用手
  rationale: 原文直译为“在双掌上”。现代汉语用“用手托住”更自然，同时保留以手承托的具体形象。
- source_word: יִשָּׂאוּנְךָ
  choice: 他们要……托住你
  rationale: נשא可指举起、承载或携带；结合“手掌”和保护语境，“托住”既自然，又避免把动作限定为搬运或单纯向上举起。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达原文的否定目的或预防结果。
- source_word: תִּגֹּף
  choice: 碰在
  rationale: 此处指脚与石头相撞；“碰在”符合现代汉语习惯，也不额外引入跌倒之意。
- source_word: בָּאֶבֶן
  choice: 在石头上
  rationale: ב在此与碰撞动词连用；“碰在石头上”是自然汉语。原文带定冠词，但在这一泛指性的格言表达中，汉语无需译出特指。
- source_word: רַגְלֶךָ
  choice: 你的脚
  rationale: 保留原文单数，并符合汉语惯用表达。
theological_decisions:
- issue: 传统措辞与现代源语导向表达之间的取舍
  choice: 他们要用手托住你
  alternative: 他们要在手掌上承托你／他们要用手把你举起
  rationale: 译文保留天使亲手承托、保护受护者的图像，同时不采用古雅措辞，也不把נשא单一化为向上举起。
- issue: 保护结果的强度
  choice: 免得你的脚碰在石头上
  alternative: 免得你的脚撞在石头上／免得你被石头绊倒
  rationale: 原文说的是脚撞到石头，并未明说跌倒；译文不扩大为完全免受一切伤害，也不加入绊倒这一结果。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“托住”清楚呈现保护动作；“免得”保留诗句的预防语气。脚注标记紧接存在词义选择的短语。
