base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/015.yaml
  text: He will call on me[a], and I will answer him; I am with him in trouble[b]; I will rescue him and honor him.
translation:
  language: zh_hans
  text: 他呼求我，我必应答他；我在他患难中与他同在；我要搭救他[a]，使他得尊荣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“救拔他”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使他得荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָאֵנִי
  choice: 他呼求我
  rationale: קרא带第一人称宾语，在向上帝祷告的语境中表示向他呼求；“呼求我”自然地保留了祈求、求告的含义。
- source_word: וְאֶעֱנֵהוּ
  choice: 我就应允他
  rationale: ענה表示回答或回应；在祷告语境中，“应允”比单纯的“回答”更贴切，同时没有增添经文未说明的具体应允方式。
- source_word: עִמּוֹ אָנֹכִי
  choice: 我与他同在
  rationale: 原文将“与他”前置以加强语气；中文用简洁庄重的“我与他同在”表达上帝在患难中的临在。
- source_word: בְצָרָה
  choice: 在患难中
  rationale: צָרָה可指困苦、危难或患难；“患难”兼具广度与庄重感，适合本诗语境。
- source_word: אֲחַלְּצֵהוּ
  choice: 我要搭救他
  rationale: חלץ的Piel形式在此指从危险或困境中救出；“搭救”表达主动施救，并保持现代汉语的可懂性。
- source_word: וַאֲכַבְּדֵהוּ
  choice: 使他得尊荣
  rationale: כבד的Piel形式可表示尊重、使得荣耀；因宾语是蒙保护的人，“使他得尊荣”既自然，也保留上帝抬举他的含义。
theological_decisions:
- issue: 如何表达上帝回应呼求者的应许，而不添加经文未明说的条件
  choice: 按原文次序直接陈述上帝的应允、同在、搭救和赐予尊荣
  alternative: 把这些应许明确解释为取决于呼求者先前的忠信或其他条件
  rationale: 本节直接陈述上帝对呼求者的回应，并未在本节加入额外条件；译文保留这一应许的力度及其神学张力，不以解释性条件加以限制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“呼求—应允”“患难—同在”保留诗句的对应关系；分号呈现四项紧密相连的神圣应许。脚注标记依其实际对应词分别置于“搭救”和“尊荣”之后。
