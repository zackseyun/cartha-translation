  text: יֹ֭שֵׁב בְּ/סֵ֣תֶר עֶלְי֑וֹן בְּ/צֵ֥ל שַׁ֝דַּ֗י יִתְלוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/001.yaml
  text: He who dwells in the shelter of the Most High will lodge in the shadow of the Almighty[a][b][c].
translation:
  language: zh_hans
  text: 住在至高者的隐蔽处的人[a][b]，必在全能者的荫下安宿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为阳性单数形式，在这里可泛指任何这样的人；也可译作“凡住在……的”。
    reason: grammatical_clarification
  - marker: b
    text: “隐蔽处”也可译作“隐密处”或“藏身处”。
    reason: lexical_alternative
  - marker: c
    text: “安宿”也可译作“长住”或“过夜”；原文动词本指投宿、过夜，也可引申为停留、常住。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: 住……的人
  rationale: 该阳性单数分词在句中名词化，指以居住于此为特征的人；“住”自然表达持续安居之意，也比直译为“坐”更符合语境。
- source_word: בְּסֵתֶר
  choice: 在……隐蔽处
  rationale: סֵתֶר可指隐藏、隐密而受保护的地方；“隐蔽处”兼顾隐而不露和庇护的意象，又符合现代汉语。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 这是表示神至高地位的称号；“至高者”简洁、庄重，并保留其称号性质。
- source_word: בְּצֵל
  choice: 在……荫下
  rationale: 原词意为“影子、荫影”；汉语“在……荫下”自然传达因亲近而得到遮蔽保护的诗歌意象。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 将神的称号译出而不音译；“全能者”是清楚、通行且庄重的现代汉语表达。
- source_word: יִתְלוֹנָן
  choice: 必……安宿
  rationale: לון的这个形式含住宿、过夜之意，也可延伸为停留；“安宿”保留具体的夜间投宿意象，并与上半句的“住”形成诗意对应。
theological_decisions:
- issue: 如何处理名词化阳性单数分词所指的人
  choice: 住……的人
  alternative: 凡住……的；住……的那一位
  rationale: 希伯来语形式为阳性单数，但在这里可具有代表性。现代汉语没有相应的语法性别标记，用“人”既不把对象限制为男性，也不抹去原文单数个体的表达。
- issue: 如何翻译神的称号שַׁדַּי
  choice: 全能者
  alternative: 沙代
  rationale: 将称号的通常含义直接译出，使普通读者能够理解，同时避免因音译而让它看似无法理解的专名。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“隐蔽处”“荫下”“安宿”保留原文由藏身、遮荫到夜间住宿构成的具体庇护意象；句式简洁，维持两行诗意之间的平行关系。
