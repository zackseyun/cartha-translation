lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐团指挥
  rationale: 此词在诗篇标题中通常指负责统筹音乐演奏的人。“乐团指挥”既体现礼仪音乐场景，也比传统的“伶长”更易为现代读者理解。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中常见的体裁名称，带有配乐吟唱的意味；在中文《诗篇》的语境中译作“诗”简洁自然。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词לְ在诗篇标题中可能表示作者、归属、关联或献呈。“大卫的”在中文中保留一定的关系歧义，避免武断限定为“大卫所作”或“献给大卫”。
theological_decisions:
- issue: 标题中诗与大卫的关系
  choice: 大卫的诗
  alternative: 大卫所作的诗；献给大卫的诗
  rationale: 希伯来语לְדָוִד所表达的关系较宽泛，可能涉及作者身份、归属、关联或献呈。正文采用自然但未完全限定关系的“大卫的诗”，并用脚注说明其歧义。
translation_notes:
  register: 采用现代、简洁而庄重的诗篇标题用语。“交给乐团指挥”避免使用现代读者较难理解的“伶长”；脚注标记紧接“大卫的诗”，对应其所解释的希伯来语短语。
