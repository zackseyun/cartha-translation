base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/009.yaml
  text: Then all mankind will fear[a], and they will declare the work of God; they will understand what he has done.
translation:
  language: zh_hans
  text: 众人[a]都必敬畏；他们要宣扬上帝的作为，并领悟他所做的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众人”所对应的希伯来语直译为“所有人”（字面为“所有亚当”）；此处“亚当”泛指全体人类。
    reason: 说明希伯来语 כָּל אָדָם 的集合性、泛指人类的用法及译词范围。
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: 都要敬畏
  rationale: 源自动词 ירא，可兼指惧怕与敬畏；本诗语境是上帝施行审判后人类的回应。“敬畏”保留了畏惧与肃然尊崇两层意味。诗歌中的叙事形式在此承接上文，可自然表达为将来或结果性的“要”。
- source_word: כָּל אָדָם
  choice: 众人
  rationale: אָדָם 在这里是集合性、泛指全体人类，而非专指男性个体。“众人”是自然的现代汉语，准确传达普遍的人类范围。
- source_word: וַיַּגִּידוּ
  choice: 要宣扬
  rationale: נגד 的使役词干表示使人知道、讲述或宣告；“宣扬”符合此处公开述说上帝作为的语气。
- source_word: פֹּעַל אֱלֹהִים
  choice: 上帝的作为
  rationale: פֹּעַל 指行动、工作或所行之事；“作为”在中文中既庄重自然，又能涵盖上下文所指上帝施行审判的行动。
- source_word: וּמַעֲשֵׂהוּ
  choice: 他所做的事
  rationale: 字面为“他的作为/工作”。此译法忠实表达具体行动，同时避免与前句“作为”生硬重复。
- source_word: הִשְׂכִּילוּ
  choice: 要领悟
  rationale: שׂכל 的使役词干可表示明白、洞察或明智行事。这里以“他的作为”为理解对象，重点在洞察上帝行动的意义；“领悟”比单纯“知道”更能体现这种理解。
theological_decisions:
- issue: אָדָם 的泛指范围
  choice: 众人
  alternative: 每一个人；全人类
  rationale: 希伯来语形式虽为单数，却在此集合性地指人类。“众人”不把经文误限于男性，也不额外断言每个个体无一例外，保留诗歌概括性的普遍表达。
- issue: יִרְאוּ 所表达的回应
  choice: 敬畏
  alternative: 害怕；惧怕
  rationale: 在上帝审判的语境中，该词包含恐惧，但也可能带有因认识上帝作为而生的敬畏。“敬畏”保留这种神学张力，不把含义缩减为单纯惊恐。
- issue: הִשְׂכִּילוּ 的认知与伦理色彩
  choice: 领悟
  alternative: 明白；思想；行事明智
  rationale: 由于该动词在此涉及对上帝作为的回应，“领悟”突出洞察，同时不强行把它解释为后续的伦理行为。
translation_notes:
  register: 采用现代、庄重而易懂的诗体语言。三个“要”保持句法推进和结果性语气；“宣扬—领悟”呈现公开述说与内心理解的对应。脚注标记已置于“敬畏”之后，以对应所附词汇说明；但脚注内容实际说明的是“众人”，出版时更宜将标记移至“众人”之后。
