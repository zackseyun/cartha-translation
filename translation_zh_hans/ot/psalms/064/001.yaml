  text: שְׁמַע אֱלֹהִ֣ים קוֹלִ֣/י בְ/שִׂיחִ֑/י מִ/פַּ֥חַד א֝וֹיֵ֗ב תִּצֹּ֥ר חַיָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/001.yaml
  text: Hear[a], O God, my voice in my complaint; preserve my life from the fear of the enemy.
translation:
  language: zh_hans
  text: 上帝啊，求你在我倾诉时[a]垂听我的声音；求你保全我的性命，免于因仇敌而起的恐惧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倾诉”也可译为“默想”“沉思”或“哀诉”。希伯来语这个词可指内心思量，也可指说出愁苦。
    reason: 保留בְשִׂיחִי在内心默想与哀诉之间的词义范围。
  - marker: b
    text: 也可理解为“仇敌所带来的恐吓”或“可怕处境”。
    reason: 说明מִפַּחַד אוֹיֵב可侧重诗人对仇敌的恐惧，亦可侧重仇敌造成的恐怖。
lexical_decisions:
- source_word: שְׁמַע
  choice: 求你……垂听
  rationale: 这是向上帝发出的第二人称阳性单数祈使语；“求你垂听”符合现代汉语祷告语体，也保留恳求意味。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处是直接呼语；加“啊”自然表达希伯来语中的呼告。
- source_word: קוֹלִי
  choice: 我的声音
  rationale: 保留קוֹל的具体意象，不简化为“我”或“我的祷告”。
- source_word: בְשִׂיחִי
  choice: 在我倾诉时
  rationale: שִׂיחַ可指默想、沉思，也可指诉说、哀诉；敌人威胁的语境较支持哀诉义。“倾诉”在中文中自然，并能略微保留内心思量与说出愁苦之间的开放性。
- source_word: מִפַּחַד אוֹיֵב
  choice: 使我不因仇敌的威胁而惧怕
  rationale: פַּחַד既可表示主观的恐惧，也可指引发恐惧之物；这里避免生硬的“从仇敌的恐惧中”，将其理解为仇敌所造成的可怕威胁，同时承认原文也可直译为“脱离对仇敌的恐惧”。
- source_word: תִּצֹּר
  choice: 求你保护
  rationale: נצר表示守护、保全；与“性命”搭配时，“保护”清楚自然。
- source_word: חַיָּי
  choice: 我的性命
  rationale: 这里指诗人的生命安危；“性命”比“灵魂”更贴近原义，并适合受敌威胁的语境。
theological_decisions:
- issue: בְשִׂיחִי的含义
  choice: 在我倾诉时
  alternative: 在我默想时／在我沉思时／在我哀诉时
  rationale: 该词确有内在思索与发声哀诉两方面的用法。上下文偏向哀诉，但用脚注保留真实的词义歧义，不把它限定为纯粹口头抱怨。
- issue: מִפַּחַד אוֹיֵב与“保护性命”的关系
  choice: 保护我的性命，使我不因仇敌的威胁而惧怕
  alternative: 保护我的性命，脱离对仇敌的恐惧／脱离仇敌所带来的恐怖
  rationale: 原文可着重于诗人所感到的恐惧，也可指仇敌造成的恐怖处境。正文采用自然汉语表达其威胁与恐惧之间的关系，不引入额外的教义判断。
translation_notes:
  register: 采用现代、庄重而通俗的祷告语体。“垂听”与“上帝啊”保持诗篇呼求的尊严；“倾诉”“威胁”“性命”便于普通现代读者理解。脚注标记置于全节末尾，因为脚注同时说明前后两个短语。
