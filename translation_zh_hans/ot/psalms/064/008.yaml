source:
  edition: WLC
  text: וַ/יַּכְשִׁיל֣וּ/הוּ עָלֵ֣י/מוֹ לְשׁוֹנָ֑/ם יִ֝תְנֹדֲד֗וּ כָּל רֹ֥אֵה בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/008.yaml
  text: They are made to stumble[a]; their own tongue is against them[b]; all who see them shake their heads.
translation:
  language: zh_hans
  text: 他们被绊倒了[a]；自己的舌头反倒攻击他们。凡看见他们的都摇头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文句法艰涩。较形式化可译作：“他（或它）的舌头使他（或它）在他们身上绊倒。”各代词之间的关系并不明确，译本处理不一。正文按上下文理解为恶人被自己的言语绊倒。
    reason: alternative_reading
  - marker: b
    text: 这里的动词也可译作“摆头”“战栗”，在某些语境中还可表示“逃离”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְשִׁילוּהוּ
  choice: 他们被绊倒了
  rationale: כשׁל 的使役式表示“使绊倒、使跌倒”。原文所带宾语后缀在形态上是第三人称阳性单数，但本行句法艰涩；上下文则以复数指恶人，因此正文按诗句整体意义译为复数被动，同时在脚注保留形式上的困难。
- source_word: עָלֵימוֹ
  choice: 攻击他们
  rationale: 介词 עַל 带复数后缀，可表示“在他们之上”或“敌对他们”。结合“舌头”的意象，译作“攻击他们”，自然表达恶人的言语反过来成为对付自己的力量。
- source_word: לְשׁוֹנָם
  choice: 自己的舌头
  rationale: 保留希伯来文集合性单数“舌头”的具体意象；加“自己的”明确其言语正反噬说话者。
- source_word: יִתְנֹדֲדוּ
  choice: 摇头
  rationale: נוד 可指摇动、游移或因所见而作出反应；在“凡看见他们的”之后，“摇头”最自然地表达旁观者可见的惊异、鄙弃或感叹，同时以脚注保留其他词义可能。
- source_word: כָּל רֹאֵה בָם
  choice: 凡看见他们的
  rationale: 直接保留“所有/凡”和分词短语的普遍范围，符合现代汉语表达。
theological_decisions:
- issue: 恶人跌倒与其舌头之间的关系
  choice: 正文表达恶人被绊倒，其舌头反过来攻击他们
  alternative: 按形态较直译为“他/它的舌头使他/它在他们身上绊倒”
  rationale: 原文代词关系存在真正的句法困难。正文依据本节复数指称及诗歌语境表达恶人被自己的言语毁坏的整体含义，但不把较难的形式读法隐去，而在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“反倒”突出舌头由攻击他人的工具转为攻击自身的诗意反转；分号和句号呈现本行的两层推进。
