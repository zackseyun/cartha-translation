id: PSA.64.4
reference: Psalms 64:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לִ/יר֣וֹת בַּ/מִּסְתָּרִ֣ים תָּ֑ם פִּתְאֹ֥ם יֹ֝רֻ֗/הוּ וְ/לֹ֣א יִירָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/004.yaml
  text: to shoot at the blameless from hiding places[b][a]; suddenly they shoot at him and do not fear.
translation:
  language: zh_hans
  text: 他们要从隐蔽处[a]射击那纯全的人[b]；他们突然向他射击，毫不畏惧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在隐秘处”；希伯来文介词直译为“在”，这里按伏击的语境译作“从”。
    reason: lexical_alternative
  - marker: b
    text: 或译“无辜的人”；这个希伯来词既可表示品格纯全，也可表示无辜。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִירוֹת
  choice: 射击
  rationale: 在敌意袭击的语境中，ירה最自然地指发射箭矢；原文未明说“箭”，因此正文不补出宾语。
- source_word: בַּמִּסְתָּרִים
  choice: 从隐蔽处
  rationale: 该词指隐藏、隐蔽的地方。介词字面为“在”，但结合射击和伏击意象，现代汉语自然表达为“从隐蔽处”。
- source_word: תָּם
  choice: 纯全的人
  rationale: תָּם可指品格完整、无可指摘的人，也可侧重无辜；“纯全的人”保留其道德完整的主要色彩。
- source_word: פִּתְאֹם
  choice: 突然
  rationale: 准确表达袭击来得猝不及防。
- source_word: יֹרֻהוּ
  choice: 向他射击
  rationale: 三单阳性后缀回指前面的“纯全的人”；“向他射击”既符合汉语，也不暗示一定已经射中。
- source_word: וְלֹא יִירָאוּ
  choice: 毫不畏惧
  rationale: 原文没有说明畏惧的对象；此译保留这种简洁与未明确性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“射击”在上下文中指以箭矢攻击，并非特指现代枪械；为避免原文未明说的信息，正文不补“箭”。两个脚注标记依其所解释词语的正文顺序排列。
