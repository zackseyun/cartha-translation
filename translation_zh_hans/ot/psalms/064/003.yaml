- from: 他们把舌头磨得像剑一样锋利，又把恶毒的话当作箭瞄准。
  to: 他们把舌头磨利，如同剑；他们把自己的箭搭上弦——苦涩的话——。
  rationale: 修订恢复两组平行的武器意象：舌头如剑，箭即苦涩的话；并以“自己的”对应原文的第三人称复数属格。“搭上弦”以自然现代汉语表达射箭的预备动作，不把原文未明说的具体攻击结果译出。
