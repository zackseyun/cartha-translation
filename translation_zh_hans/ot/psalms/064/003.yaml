  naturalness: “把自己的箭搭上弦”是现代汉语中自然的射箭预备动作表达，也能对应此处关于预备／张弓搭箭的诗歌意象；破折号使“苦涩的话”作为“箭”的同位说明清楚可读。
  terminology: “舌头”“剑”“箭”“苦涩的话”均贴近原文的具体意象。“苦涩”较“恶毒”更直接反映מָר的基本语义，同时在上下文中仍表达伤人的言语。
