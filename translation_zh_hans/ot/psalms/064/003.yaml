  text: who sharpen their tongue like a sword; they bend their arrow—a bitter word—
translation:
  language: zh_hans
  text: 他们把舌头磨利，如同剑；他们把自己的箭搭上弦——苦涩的话——。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁנְנוּ
  choice: 磨得……锋利
  rationale: 该动词意为“磨快、磨利”；与“舌头”和“剑”的比喻搭配时，这一表达自然且保留原文的攻击性意象。
- source_word: דָּרְכוּ
  choice: 瞄准
  rationale: 该动词本义涉及踩压、张弓，进而可指搭箭瞄准；因原文直接以“箭”为宾语，译作“瞄准”比直译“弯曲箭”更符合现代汉语，同时保留射箭图景。
- source_word: חִצָּם
  choice: 当作箭
  rationale: 马所拉文本为“他们的箭”。结合后面的同位说明“恶毒的话”，汉语用“把……当作箭”清楚呈现话语即箭的比喻关系。
- source_word: דָּבָר מָר
  choice: 恶毒的话
  rationale: 字面为“苦涩的话/言语”；语境指蓄意伤人的言辞，“恶毒的话”能传达其负面力量而不引入额外教义含义。
theological_decisions:
- issue: “箭”与“恶毒的话”的关系
  choice: 将“恶毒的话”处理为箭的比喻性所指
  alternative: “又瞄准他们的箭——一句恶毒的话——”
  rationale: 原文末尾的“恶毒的话”可视为对“箭”的同位说明。所选译法使现代汉语顺畅，同时不改变诗句把伤人言语比作武器的核心意象。
translation_notes:
  register: 采用现代、凝练而庄重的诗歌语言；保留“舌头如剑、恶言如箭”的平行武器意象。
