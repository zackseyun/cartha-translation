id: PSA.64.10
reference: Psalms 64:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִשְׂמַ֬ח צַדִּ֣יק בַּ֭/יהוָה וְ/חָ֣סָה ב֑/וֹ וְ֝/יִתְהַֽלְל֗וּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/010.yaml
  text: The righteous will rejoice in Yahweh and take refuge in him[a], and all the upright in heart will glory.
translation:
  language: zh_hans
  text: 义人必因雅威欢喜，并投靠他；所有心里正直的人都必夸耀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欢欣”。希伯来语这个动词可指夸口、夸耀或欢欣；这里指向因上帝的拯救作为而有的喜乐，并非自我夸大。
    reason: 词义存在真实的可译选择，需说明“夸耀”在本节的正面语境。
lexical_decisions:
- source_word: יִשְׂמַח
  choice: 必……欢喜
  rationale: 未完成式在诗篇结尾表达上帝施行审判后的预期结果；“欢喜”自然传达庆贺与喜乐之意。
- source_word: צַדִּיק
  choice: 义人
  rationale: 单数形容词作名词用，具有代表性或集合性；汉语“义人”无需添加性别成分，也保留原文的简洁。
- source_word: בַּיהוָה
  choice: 因雅威
  rationale: 介词 בּ 可表示喜乐所依凭的对象或缘由；“因雅威欢喜”是自然的现代汉语，并保留圣名。
- source_word: וְחָסָה בּוֹ
  choice: 并投靠他
  rationale: חסה 指寻求庇护、以某人为避难所；“投靠”保留寻求保护与信赖的意象。
- source_word: וְיִתְהַלְלוּ
  choice: 都必夸耀
  rationale: הלל 的 Hitpael 形式可指夸口、夸耀或欢欣；“夸耀”保留其词义张力，脚注说明此处的正面语境。
- source_word: כָּל יִשְׁרֵי לֵב
  choice: 所有心里正直的人
  rationale: 既表达 כָּל 的全称范围，也保留“心”所指向的内在品格以及“正直”的比喻。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并使其作为专名清楚可见。
- issue: וְיִתְהַלְלוּ 的正面含义
  choice: 夸耀，并以脚注说明其在本处不是自我夸大
  alternative: 欢欣
  rationale: 原词可涵盖夸口与欢欣。正文保留“夸耀”的词汇力度，脚注避免把正面的神学语境误读为骄傲自夸，同时不替原文补出明确的夸耀对象。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“必”统一承接各动词所表达的预期结果；分号呈现两组平行而递进的陈述。脚注标记紧随其实际说明的词“夸耀”，避免误附在“投靠他”之后。
