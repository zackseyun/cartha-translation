  yaml_path: translation/ot/psalms/064/007.yaml
  text: But God shoots an arrow at them[a]; suddenly they are wounded.
translation:
  language: zh_hans
  text: 但上帝向他们射出一箭[a]；他们忽然受了伤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式地译作：“但上帝用箭射他们；忽然，击打临到他们身上。”
    reason: 较贴近希伯来文后半句以“击打／伤害”名词表达结果的结构，并保留前半句“上帝以箭射向他们”的句法关系。
lexical_decisions:
- source_word: וַיֹּרֵם
  choice: 向他们射出
  rationale: 按 ירה 的使役式及其三复阳受词后缀理解，由上帝作主语，表达向他们发射；用叙事性的过去动作含义，不另行添加时态标记。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指以色列的独一上帝；“上帝”是现代标准普通话中自然、庄重的通行译法。
- source_word: חֵץ
  choice: 一箭
  rationale: 基本义为“箭”；与“射出”搭配译作“一箭”，简洁地保留诗歌意象。
- source_word: פִּתְאֹם
  choice: 忽然
  rationale: 直接表达动作结果突如其来、出人意外的意味。
- source_word: הָיוּ מַכּוֹתָם
  choice: 他们受了伤
  rationale: 字面结构接近“他们的伤出现了/成了”；按结果义自然译出，同时在脚注保留较形式对应的可能表达。
theological_decisions:
- issue: 诗歌意象中的神圣审判
  choice: 直译为上帝主动向恶人射箭，使他们受伤
  alternative: 弱化为非人格化的命运逆转或一般性的报应
  rationale: 希伯来文明确以上帝为施事者，并采用射箭的审判意象；译文保留其行动主体和力度，不加入后来的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“射出一箭”保留原诗简洁有力的画面；分号呈现神的行动与突然结果之间的紧密联系。
