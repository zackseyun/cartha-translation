  text: יַֽחְפְּֽשׂוּ עוֹלֹ֗ת תַּ֭מְנוּ חֵ֣פֶשׂ מְחֻפָּ֑שׂ וְ/קֶ֥רֶב אִ֝֗ישׁ וְ/לֵ֣ב עָמֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/006.yaml
  text: 'They devise injustices: “We have perfected a carefully concealed plot.” And the inward part of each man, and the heart, are deep.'
translation:
  language: zh_hans
  text: '他们搜寻不义之事：


    “我们已经查究周全。”[a]


    每个人的内里和心，都深沉。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文十分凝缩，直译近于：“我们完成了查究，查究过的。”其中同根词组可强调反复、彻底的查究；按上下文，也可理解为他们把隐秘的谋划查考、设计到了极处。
    reason: 说明罕见的同根词组חֵפֶשׂ מְחֻפָּשׂ及整句句法的歧义，避免把“谋划”或其他补足解释呈现为唯一含义。
lexical_decisions:
- source_word: יַחְפְּשׂוּ עוֹלֹת
  choice: 搜寻不义之计
  rationale: יַחְפְּשׂוּ保留“搜寻、查究”的动作，עוֹלֹת指不义、恶行；结合上下文，以“不义之计”表达他们刻意发掘和筹谋恶事。
- source_word: תַּמְנוּ
  choice: 筹划周全
  rationale: 该词表达“完成、做尽”；在计谋语境中，“筹划周全”自然传达他们自以为已经完成谋划。
- source_word: חֵפֶשׂ מְחֻפָּשׂ
  choice: 精心推敲的计谋
  rationale: 原文以同根词形成强调，字面近于“搜寻过的搜寻”；译文用“精心推敲”再现反复查究、缜密设计之意，同时以“计谋”衔接上下文。
- source_word: קֶרֶב אִישׁ
  choice: 各人的内里
  rationale: קֶרֶב指人的内部、内在深处；אִישׁ在此为泛指单数，译作“各人的”符合汉语表达，也不把它局限为某一个人。
- source_word: לֵב עָמֹק
  choice: 心……很深沉
  rationale: 保留“深”的空间隐喻与原文的简洁性，不直接解释成“无法测透”，以免消除诗句本有的含蓄和张力。
theological_decisions:
- issue: 末句对人内在深度的评价
  choice: 各人的内里与心，都很深沉
  alternative: 人的内心深不可测
  rationale: 原文只说“深”，未明确断言绝对不可测；采用较贴近原文的说法，保留它既可指隐秘复杂、也可暗含诡诈难察的张力。
- issue: 中间分句是否作为恶人直接引语
  choice: 采用引号呈现第一人称复数的话
  alternative: 不加引号，译为叙述句
  rationale: תַּמְנוּ为第一人称复数，与前面的第三人称形成话语转换；引号能清楚呈现这一转换，但原文句法本身高度凝缩，故以脚注提示。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留“搜寻”“内里”“深沉”等原文意象；第二行以直接引语突出人称变化，并用脚注交代该困难短语的字面结构和解释空间。
