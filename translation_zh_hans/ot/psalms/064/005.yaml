  text: יְחַזְּקוּ לָ֨/מוֹ דָּ֘בָ֤ר רָ֗ע יְֽ֭סַפְּרוּ לִ/טְמ֣וֹן מוֹקְשִׁ֑ים אָ֝מְר֗וּ מִ֣י יִרְאֶה לָּֽ/מוֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/005.yaml
  text: They strengthen for themselves an evil matter[a]; they talk of hiding snares; they say[b], “Who will see them?”
translation:
  language: zh_hans
  text: 他们使自己的恶计稳固[a]；他们商议如何暗藏网罗。他们说：“谁会看见这些呢？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶计”直译可作“恶事”或“邪恶的事情”；原词也可指“话、事、事情”。
    reason: lexical_alternative
  - marker: b
    text: “这些”所对应的原文形式为第三人称复数，可能指暗藏的网罗或他们所谋划的事；也有人按说话者的意思理解为“我们”，但原文形式并非第一人称。
    reason: alternative_reading
lexical_decisions:
- source_word: יְחַזְּקוּ לָמוֹ
  choice: 他们使自己的……更加稳固
  rationale: יְחַזְּקוּ是חזק的Piel形，表达“使坚固、强化”；לָמוֹ在语境中可作反身意义理解。译文保留了主动强化恶谋的动作，同时采用自然的现代汉语。
- source_word: דָּבָר רָע
  choice: 恶计
  rationale: דָּבָר可指话、事、事情；在暗藏网罗的密谋语境中，“恶计”最自然，但其较宽泛的“恶事”含义以脚注保留。
- source_word: יְסַפְּרוּ
  choice: 商议
  rationale: ספר的Piel形通常指述说、谈论；与“暗藏网罗”的不定式连用时，语境显示他们在共同谈论或策划，因此译作“商议”。
- source_word: לִטְמוֹן מוֹקְשִׁים
  choice: 暗藏网罗
  rationale: טמן意为隐藏、埋藏，מוֹקְשִׁים指网罗或陷阱。“暗藏网罗”兼顾词义及诗篇中的传统意象。
- source_word: מִי יִרְאֶה לָּמוֹ
  choice: 谁能看见这些呢？
  rationale: לָמוֹ是第三人称复数形式，但所指在紧缩的希伯来诗句中不完全明确。“这些”可回指网罗或恶谋，避免汉语“他们／它们”强行限定所指；“能”自然表达说话者自信无人察觉的语气。
theological_decisions:
- issue: “谁能看见”之宾语所指
  choice: 用“这些”保留对网罗或恶谋的开放指向
  alternative: “谁能看见他们／它们／我们呢？”
  rationale: 希伯来语形式为第三人称复数，但先行词较含混；不宜在正文中武断指定为谋划者或网罗，也不应无说明地改成第一人称。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使自己的恶计更加稳固”刻意保留“使之坚固”的动词力量；分号呈现希伯来诗句中连续密谋、发言的推进。
