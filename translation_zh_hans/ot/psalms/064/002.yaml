  yaml_path: translation/ot/psalms/064/002.yaml
  text: Hide me from the secret counsel of evildoers[b][a], from the tumult of workers of wickedness.
translation:
  language: zh_hans
  text: 求你把我隐藏，使我免遭作恶者的秘密谋议[a]，免遭行恶之人的骚动[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作恶者的秘密图谋。”希伯来语 סוֹד 可指私下的商议、亲密的圈子，也可指秘密的计谋。
    reason: lexical_alternative
  - marker: b
    text: 或译：“行恶之人的喧嚷”，或“行恶之人的聚众骚动”。希伯来语 רִגְשָׁה 可表示带有敌意的激动、喧闹或聚众骚动。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵנִי
  choice: 求你把我藏起来
  rationale: 该词是 סתר 的使役词干未完成式，带第一人称单数宾语后缀；在诗篇祈求的语境中表达直接请求。译为“求你把我藏起来”自然地保留了祈求语气和“隐藏、遮蔽”的含义。
- source_word: מִסּוֹד
  choice: 躲开……秘密谋议
  rationale: סוֹד 可指亲密圈子中的私下商议、秘密会议，也可由此指秘密图谋。“秘密谋议”兼顾其隐秘性和共同商议的意味，不把它过早限定为已经成形的阴谋。
- source_word: מְרֵעִים
  choice: 作恶者
  rationale: 这是表示持续或典型行为的分词，意为“作恶的人”。“作恶者”简明自然，并保留其主动行为色彩。
- source_word: מֵרִגְשַׁת
  choice: 避开……骚动
  rationale: רִגְשָׁה 可表示喧闹、激动、聚众骚动或敌意骚乱。“骚动”在现代汉语中既可指人群的扰攘，也可表达带敌意的动荡，同时不强行限定人数或声音大小。
- source_word: פֹּעֲלֵי אָוֶן
  choice: 行恶之人
  rationale: 该结构直译为“做/制造 אָוֶן 的人”；אָוֶן 在此指邪恶、不义或祸害。“行恶之人”通顺易懂，也保留了主动、惯常作恶的含义。
theological_decisions: []
