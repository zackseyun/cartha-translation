  register: 采用现代、庄重而易懂的祈祷语言。“求你”明确体现诗篇中的呼求；两个并列分句以“躲开／避开”呈现希伯来语重复的介词结构，同时避免中文生硬重复。脚注保留 סוֹד 和 רִגְשָׁה 的词义幅度。
