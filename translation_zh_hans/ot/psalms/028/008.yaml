  text: יְהוָ֥ה עֹֽז לָ֑/מוֹ וּ/מָ֘ע֤וֹז יְשׁוּע֖וֹת מְשִׁיח֣/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/008.yaml
  text: Yahweh is strength for them[b][a], and he is a stronghold of salvation for his anointed one.
translation:
  language: zh_hans
  text: 雅威是他们的力量；他是为他受膏者[b]带来诸般拯救[a]的坚固保障。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诸般拯救”在希伯来文中是复数，也可译作“一次次的解救”或“多样的救援”。
    reason: lexical_alternative
  - marker: b
    text: “受膏者”也可译作“弥赛亚”。按本诗语境，首先可能指雅威所膏立的君王，同时也保留更广的弥赛亚意蕴。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保存上帝在希伯来文本中的专名，不以“耶和华”或“主”替代。
- source_word: עֹז
  choice: 力量
  rationale: 此处作表语，表示能力、力量；与后文表示防护之所的 מָעוֹז 区分。
- source_word: לָמוֹ
  choice: 他们的
  rationale: 保留希伯来语第三人称复数形式，不依据上下文擅自改成单数或补成“他的百姓”。
- source_word: מָעוֹז
  choice: 坚固保障
  rationale: 兼顾防护、避难和堡垒意象，同时符合现代汉语表达。
- source_word: יְשׁוּעוֹת
  choice: 蒙拯救
  rationale: 正文采用自然汉语表达其拯救、解救之意；希伯来语明确的复数形态及其可能含义在脚注中保留。
- source_word: מְשִׁיחוֹ
  choice: 自己受膏者
  rationale: 直译为描述性称谓，首先可指雅威所膏立的君王，也不排除弥赛亚意蕴。
- source_word: הוּא
  choice: 他也是
  rationale: 用明确代词和系词体现独立代词的强调作用，并使汉语句子自然。
theological_decisions:
- issue: מְשִׁיחוֹ 应译作描述性称谓还是固定头衔
  choice: 受膏者
  alternative: 弥赛亚
  rationale: 本诗语境首先容许理解为雅威所膏立的君王；正文不预先把它限定为后来的固定头衔，脚注则保留弥赛亚读法。
- issue: יְשׁוּעוֹת 的复数如何在汉语中呈现
  choice: 正文译作“蒙拯救”，脚注说明复数
  alternative: 一次次的拯救／诸般拯救
  rationale: 汉语正文若机械使用复数会显得生硬；脚注保留原文复数及其可能表达多次或多方面拯救的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“坚固保障”保留堡垒般的保护意象，又避免“拯救的堡垒”在现代汉语中的生硬感；分号呈现两个并列的名词性判断句。
