  text: שְׁמַ֤ע ק֣וֹל תַּ֭חֲנוּנַ/י בְּ/שַׁוְּעִ֣/י אֵלֶ֑י/ךָ בְּ/נָשְׂאִ֥/י יָ֝דַ֗/י אֶל דְּבִ֥יר קָדְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/002.yaml
  text: Hear the voice of my pleas for mercy when I cry to you[c][b][a], when I lift up my hands toward your holy inner sanctuary.
translation:
  language: zh_hans
  text: 求你垂听我求怜悯的呼声[c]，当我向你呼求、向你圣所的内殿[a]举手时。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的圣所”。希伯来语这个词也可更具体地指圣所的内殿，即最里面的圣室。
    reason: lexical_alternative
  - marker: b
    text: “求怜悯”也可译作“恳求”或“哀求”。
    reason: lexical_alternative
  - marker: c
    text: “我求怜悯的呼声”也可译作“我求怜悯的声音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: 求你垂听
  rationale: 这是阳性单数第二人称祈使式，是直接向上帝发出的迫切祈求；“垂听”符合现代汉语祷告语体，也体现恳请之意。
- source_word: ק֣וֹל
  choice: 声音
  rationale: 该词可指“声音”或“呼声”。这里保留希伯来文具体的听觉意象，并与“垂听”自然搭配。
- source_word: תַּחֲנוּנַי
  choice: 我恳求怜悯
  rationale: 该词指为蒙恩、得怜悯而发出的恳切祈求；译文明确表达其语义力度，同时避免过于古雅的措辞。
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: 我向你呼求时
  rationale: 介词加不定式结构在此表示时间；“呼求”保留 שׁוע 所含的迫切强度。
- source_word: בְּנָשְׂאִי יָדַי
  choice: 举手时
  rationale: 按原文保留祷告中举手的具体身体动作；介词加不定式译为时间从句。
- source_word: אֶל דְּבִיר קָדְשֶׁךָ
  choice: 向你的圣所内殿
  rationale: דְּבִיר 特指圣所内部的神圣内室；“圣所内殿”既保留空间上的特指性，也比“神谕处”等译法更易为现代读者理解。
theological_decisions:
- issue: דְּבִיר קָדְשֶׁךָ 所指的敬拜空间
  choice: 你的圣所内殿
  alternative: 你的圣所；你的至圣所；你的神谕处
  rationale: 原词通常指与上帝临在相关的圣所内室，而非泛指整座圣所。“圣所内殿”保留这一礼仪与空间意象，却不额外引入后来的教义解释；“神谕处”虽有词源和传统译法依据，但在现代汉语中容易遮蔽空间含义。
- issue: תַּחֲנוּנַי 是否明确包含求怜悯之意
  choice: 我恳求怜悯
  alternative: 我的恳求；我的哀求
  rationale: 该词表示为求恩惠或怜悯而作的恳切祈求。正文显明这一语义，同时以脚注保留较简约的译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。为使两个时间结构共同修饰主要祈求，将“我向你呼求”和“向你的圣所内殿举手”并列前置；不增添原文没有明说的“求帮助”等内容。
