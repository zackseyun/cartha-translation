reference: Psalms 28:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/001.yaml
  text: Of David[a]. To you, O Yahweh, I call; my rock, do not be deaf to me[c][b], lest you be silent to me and I become like those who go down to the pit.
translation:
  language: zh_hans
  text: '大卫的诗。[a]


    雅威啊，我向你呼求；

    我的磐石啊，求你不要对我充耳不闻，[b]

    免得你向我沉默，

    我就变得像那些下到坑里的人。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”也可理解为“大卫所作”或“为大卫而作”；希伯来文诗题本身没有完全限定这层关系。
    reason: 保留诗题介词 לְ 所表达的作者、归属或献予对象等可能。
  - marker: b
    text: “充耳不闻”也可译作“向我沉默”。这里的动词既可涉及不听，也可涉及不作声；正文用不同措辞与下一句的“沉默”相区别。
    reason: 说明 חרשׁ 的词义范围及相邻两动词之间可能的文字呼应。
  - marker: c
    text: “坑”可指坟墓，也可泛指死者所在之处。
    reason: 保留 בור 在死亡语境中的多重可能，不在正文中过度限定。
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 诗题中的介词 לְ 可表示归属、作者或献予对象；正文采用简明而传统的“大卫的诗”，并以脚注保留“为大卫而作”等可能。
- source_word: אֵלֶיךָ ... אֶקְרָא
  choice: 我向你呼求
  rationale: 保留呼求的方向性；“呼求”在现代汉语中自然表达祷告中的恳切呼唤，又不过度强化情绪。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作现代汉语音译，保留其作为专名的性质，不以称号代替。
- source_word: צוּרִי
  choice: 我的磐石
  rationale: 保留原文具体的岩石比喻及其稳固、保护的意涵，不解释性改译为“避难所”。
- source_word: אַל תֶּחֱרַשׁ מִמֶּנִּי
  choice: 求你不要对我充耳不闻
  rationale: חרשׁ 可指耳聋或沉默；此处与下一分句明确表示沉默的 חשה 并列，正文用“充耳不闻”保留听见与回应之间可能存在的区别。
- source_word: פֶּן תֶּחֱשֶׁה מִמֶּנִּי
  choice: 免得你向我沉默
  rationale: פֶּן 引出诗人所惧怕的后果；“向我沉默”保留关系方向，也与前句的“不闻”形成呼应。
- source_word: וְנִמְשַׁלְתִּי
  choice: 我就变得像
  rationale: משׁל 的尼法勒形在此意为成为相似或被比作；“变得像”自然呈现诗人所惧怕的结果。
- source_word: עִם יֹרְדֵי בוֹר
  choice: 像那些下到坑里的人
  rationale: 保留“下去”和“坑”的具体意象；在汉语中承接“变得像”时用“像”比直译“与……一起”更顺畅，同时不把坑限定为坟墓或阴间。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的四字神名。音译“雅威”保留专名身份；“主”会将专名替换为称号，“耶和华”则反映较晚形成的混合读音。
- issue: “坑”的所指
  choice: 正文保留“坑”
  alternative: 坟墓；阴间
  rationale: 此处意象可关联死亡、坟墓或死者领域，但单节本身没有要求将其严格限定为某一概念，因此正文不消除其诗性和神学张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“雅威啊”“我的磐石啊”保留直接呼告；分行呈现呼求、请求和所惧后果的推进。避免过度古雅的“缄默”“下阴府”，也不将死亡意象解释得过窄。
