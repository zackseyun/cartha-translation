  text: בָּר֥וּךְ יְהוָ֑ה כִּי שָׁ֝מַע ק֣וֹל תַּחֲנוּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/006.yaml
  text: Blessed be Yahweh[b][a], for he has heard the voice of my pleas for mercy.
translation:
  language: zh_hans
  text: 耶和华当受颂赞，因他听见了我恳求怜悯的呼声。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 当受颂赞
  rationale: 该被动分词在此构成颂赞性的感叹公式。译作“当受颂赞”自然庄重，也比单纯的“有福”更准确地表达向神发出的赞美。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名。在现代简体中文圣经语境中，“耶和华”是最广为人知且可直接识别为专名的传统音译；不以“主”等称号替代。
- source_word: כִּי
  choice: 因
  rationale: 引出颂赞耶和华的原因；“因”简洁地保留原文的因果关系，并与诗歌体裁相称。
- source_word: שָׁמַע
  choice: 听见了
  rationale: 完成式表明听见这一行动已经发生；“了”自然传达其完成性，而不额外断定“听从”或“应允”。
- source_word: קוֹל
  choice: 呼声
  rationale: קוֹל 可指声音或嗓音。与“恳求”连用时，“呼声”在中文中自然凝练，并保留恳求被发声、被听见的意象。
- source_word: תַּחֲנוּנָי
  choice: 我恳求怜悯
  rationale: 该复数名词指求恩惠、求怜悯的恳切祈求。“我恳求怜悯”既传达其迫切性与求恩意味，又避免较陈旧的“哀告／祈求”等单一表达可能造成的含义缩窄。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名，应保留为专名而不以称号“主”替代。“耶和华”是现代中文读者最熟悉的专名形式；“雅威”是另一种较接近学术重构发音的音译。
- issue: שָׁמַע 是否包含应允祷告之意
  choice: 听见了
  alternative: 垂听了；应允了
  rationale: 原词首先表示听见或聆听；上下文可能暗示神回应祈求，但本节本身未明说“应允”。因此保留“听见了”，不把隐含结果写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“耶和华当受颂赞”保留希伯来颂赞公式；后半句语序自然，并以“呼声”呈现 קוֹל 与恳求相连的听觉意象。
