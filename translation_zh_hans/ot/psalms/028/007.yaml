base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/007.yaml
  text: Yahweh is my strength and my shield[a]; in him my heart trusts, and I am helped. Therefore my heart rejoices[c][b], and with my song I will praise him.
translation:
  language: zh_hans
  text: 耶和华是我的力量，是我的盾牌；我的心倚靠他，我就得了帮助。因此，我的心欢欣；我要用歌声赞美他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赞美他”或译“称谢他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中通行的专名“耶和华”呈现四字神名，不以“主”这一称号替代。
- source_word: עֻזִּי
  choice: 我的力量
  rationale: 直接保留“力量”的意象，并与下句“我的盾牌”构成自然的诗歌并列。
- source_word: מָגִנִּי
  choice: 我的盾牌
  rationale: 原词本义为盾牌；这一保护性的比喻在中文中清楚自然，宜予保留。
- source_word: בּוֹ בָטַח לִבִּי
  choice: 我的心倚靠他
  rationale: בטח表示信赖、倚靠；בּוֹ可表达所信靠的对象。中文“倚靠他”自然地体现依赖关系，同时保留“心”作为人的内在自我。
- source_word: וְנֶעֱזָרְתִּי
  choice: 我就得了帮助
  rationale: Nifal形态表达蒙受帮助；“得了帮助”自然保留被动意义。连接词译作“就”，呈现倚靠与蒙助之间的叙述关联，但不额外说明帮助者。
- source_word: וַיַּעֲלֹז לִבִּי
  choice: 因此，我的心欢欣
  rationale: עלז表达强烈喜乐。“欢欣”兼具庄重与可懂性；“因此”在中文中清楚呈现上下句的结果关系。
- source_word: וּמִשִּׁירִי
  choice: 我要用歌声
  rationale: 此处מִן可按方式或手段理解；“用歌声”是自然中文，也保留借歌唱表达赞美的含义。
- source_word: אֲהוֹדֶנּוּ
  choice: 赞美他
  rationale: ידה的Hifil可指称谢或赞美；与“歌声”相连时，“赞美”贴合语境，同时以脚注保留“称谢”的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代简体中文圣经语境中辨识度最高的专名“耶和华”，明确呈现神名，而不以“主”这一称号替代；“雅威”是按学界常见重构音形成的另一种音译。
- issue: אֲהוֹדֶנּוּ 的语义取向
  choice: 赞美他
  alternative: 称谢他
  rationale: 该动词兼具称谢与赞美的语义；“歌声”使“赞美”在本句中更自然，但原文并未排除称谢意味，故在脚注中保留。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。保留“力量”“盾牌”“心”“歌声”等诗歌意象；句法略作中文化调整，使因果和并列关系清楚，同时不消除原文动词时体及“赞美／称谢”的语义张力。
