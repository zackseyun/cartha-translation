base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/000.yaml
  text: Of David[a]. To you, Yahweh, I call; my rock, do not be deaf to me, lest if you are silent to me[c][b], I become like those going down to the pit.
translation:
  language: zh_hans
  text: '大卫的诗。


    耶和华啊，我向你呼求；我的磐石啊，求你不要对我充耳不闻[a]。免得你向我沉默，我就和下到坑里的人一样[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “充耳不闻”也可译作“对我默不作声”。这里的动词与下一句“沉默”的意思可能重叠。
    reason: lexical_alternative
  - marker: b
    text: “坑”在这里可指坟墓或死者的领域。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 介词 לְ 所表达的关系可指作者、归属或关联；中文诗篇标题惯用“大卫的诗”，简洁自然，但不进一步限定其具体关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 将以色列上帝的专名按现代中文圣经传统译为“耶和华”，而非以“主”替代专名。
- source_word: צוּרִי
  choice: 我的磐石
  rationale: 保留“磐石”这一直接比喻及第一人称所属关系，不改写为较抽象的“保护者”或“避难所”。
- source_word: אַל־תֶּחֱרַשׁ מִמֶּנִּי
  choice: 求你不要对我充耳不闻
  rationale: חרש 在此可涉及沉默或不回应；“充耳不闻”与下一分句的“沉默”形成可感知的区别，同时脚注保留“默不作声”的可能。
- source_word: תֶּחֱשֶׁה מִמֶּנִּי
  choice: 你向我沉默
  rationale: חשה 明确表达静默、不作声；译文保留诗人所惧怕的上帝不回应。
- source_word: יוֹרְדֵי בוֹר
  choice: 下入深坑的人
  rationale: 保留“下入坑中”的空间意象；这里的“坑”在诗歌语境中可指坟墓或阴间，故以脚注说明而不在正文中单一化。
theological_decisions:
- issue: 神名 יהוה 的表达
  choice: 耶和华
  alternative: 雅威；主
  rationale: 正文保留其专名性质，不用称号“主”取代；采用普通现代中文读者最熟悉的传统形式“耶和华”，不借此断定古代发音的全部细节。
- issue: “深坑”的死亡含义
  choice: 正文保留具体意象“深坑”，脚注说明可指坟墓或死人所在之处
  alternative: 直接译为“阴间”或“坟墓”
  rationale: 原词 בור 本义意象较宽，语境带有死亡领域的意味；保留意象可避免将其过早限定为某一种来世观。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华啊”“我的磐石啊”保留直接呼告；用分号呈现连续呼求，用句号分开所求与所惧怕的后果。正文区分“充耳不闻”与“沉默”，同时以脚注承认两个希伯来动词在语义上的重叠。
