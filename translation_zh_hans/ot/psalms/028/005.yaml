id: PSA.28.5
reference: Psalms 28:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י לֹ֤א יָבִ֡ינוּ אֶל פְּעֻלֹּ֣ת יְ֭הוָה וְ/אֶל מַעֲשֵׂ֣ה יָדָ֑י/ו יֶ֝הֶרְסֵ֗/ם וְ/לֹ֣א יִבְנֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/005.yaml
  text: Because they do not understand the works of Yahweh or the work of his hands[a], he will tear them down and not build them up.
translation:
  language: zh_hans
  text: 因为他们不明白[a]耶和华的作为和他手所做的，他必拆毁他们，也不建立他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不明白”也可译作“不留意”或“不思想”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出前文祈求审判的理由；“因为”在现代汉语中清楚表达因果关系。
- source_word: לֹא יָבִינוּ אֶל
  choice: 不明白
  rationale: בין 在此表示理解、辨明；与介词 אֶל 连用，指向他们所不能领会的对象。译作“不明白”自然，并保留认知层面的主要含义。
- source_word: פְּעֻלֹּת יְהוָה
  choice: 耶和华的作为
  rationale: פְּעֻלֹּת 是复数，指神的行动或工作；“作为”庄重自然，也适合描述神的作为。神名 יְהוָה 依其专名译为“耶和华”。
- source_word: מַעֲשֵׂה יָדָיו
  choice: 他手所做的
  rationale: 贴近希伯来文单数结构及“手”的意象，同时以自然汉语表达神亲手成就之事。
- source_word: יֶהֶרְסֵם
  choice: 他必拆毁他们
  rationale: הרס 常用于拆毁建筑；“拆毁”保留该隐喻，并与下句“建造”形成鲜明反义对应。
- source_word: וְלֹא יִבְנֵם
  choice: 不再建造他们
  rationale: בנה 的基本义是“建造”。“不再”在汉语中表达拆毁之后不予建造的语势，但不擅自增添“重建”或“坚立”的特定义项。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用读者最熟悉且明确作为专名的“耶和华”，不以“主”这一称号替代。
- issue: 他们对神作为的态度是不能理解还是不加理会
  choice: 正文译“不明白”
  alternative: “不留意／不思想”
  rationale: יָבִינוּ 的核心是理解、辨明，但其与 אֶל 的结构可带有留意、思想之意。正文保留核心认知义，脚注呈现可能的态度性含义，避免消除原文张力。
- issue: 拆毁与建造的意象
  choice: 保留“拆毁／建造”
  alternative: “毁灭／不使他们兴盛”
  rationale: 原文刻意使用建筑领域的反义动词 הרס 与 בנה。直保留该意象，既不把审判弱化为一般挫败，也不把“建造”解释成某一种神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“拆毁／建造”的希伯来诗歌对举；分号呈现原因陈述与审判结果之间的转折层次。
