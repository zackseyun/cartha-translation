  to: 因为他们不明白[a]耶和华的作为和他手所做的，他必拆毁他们，也不建立他们。
  rationale: 删除“不再”，避免增添原文未表达的时间性或重建意味；合并重复的“不明白”，使汉语更流畅，同时保持同一动词支配两个并列对象的结构。将“建造”调整为“建立”，在指人的中文搭配中较自然，并保留与“拆毁”相对的建筑意象。脚注内容可保留，但将锚点移至“不明白”之后。
