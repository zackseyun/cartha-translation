  text: הוֹשִׁ֤יעָ/ה אֶת עַמֶּ֗/ךָ וּ/בָרֵ֥ךְ אֶת נַחֲלָתֶ֑/ךָ וּֽ/רְעֵ֥/ם וְ֝/נַשְּׂאֵ֗/ם עַד הָ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/009.yaml
  text: Save your people and bless your inheritance[b][a]; shepherd them and carry them forever.
translation:
  language: zh_hans
  text: 求你拯救你的子民，赐福给你的产业；牧养他们[a]，永远背负他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“喂养他们”；希伯来语动词可指喂养羊群，也可泛指牧人的全面照料。
    reason: lexical_alternative
  - marker: b
    text: 或译“高举他们”或“扶持他们”；希伯来语动词可指举起、背负或携带。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: 拯救
  rationale: 这是ישׁע的祈使式，向上帝发出恳求；“拯救”直接、自然，也保留了脱离危难与蒙上帝救助的含义。
- source_word: עַמֶּךָ
  choice: 你的子民
  rationale: עַם加第二人称阳性单数后缀，指属于上帝的群体；“你的子民”在现代汉语中既清楚又具有合宜的圣经语体。
- source_word: בָרֵךְ
  choice: 赐福给
  rationale: 这是ברך的祈使式；“赐福给”符合汉语祈祷语气，并明确表达上帝是福分的施予者。
- source_word: נַחֲלָתֶךָ
  choice: 你的产业
  rationale: נַחֲלָה可指承受所得的产业、份或所属之物；“你的产业”保留了百姓属于上帝的盟约性意象，又不将其弱化为泛指的“遗产”。
- source_word: רְעֵם
  choice: 牧养他们
  rationale: רעה在此为带第三人称阳性复数宾语后缀的祈使式，描写牧人照料羊群的整体工作；“牧养”既包括喂养，也保留引导、看顾和保护的广泛意象。
- source_word: נַשְּׂאֵם
  choice: 托住他们
  rationale: נשא可表示举起、负载或携带。“托住”在现代汉语中自然地表达持续承托和看顾，同时不把该词严格限定为某一种动作；其他可能含义以脚注保留。
- source_word: עַד הָעוֹלָם
  choice: 永远
  rationale: 该短语表示持续到无尽之久；“永远”简洁自然，准确传达其时间意义。
theological_decisions:
- issue: רְעֵם的牧人意象
  choice: 牧养他们
  alternative: 喂养他们
  rationale: 原词可以包含喂食，却不限于喂食。“牧养”保留上帝如牧人一般全面照管百姓的意象，而不加入后来的特定教义解释。
- issue: נַחֲלָתֶךָ所表达的归属关系
  choice: 你的产业
  alternative: 你的基业；你所得的份
  rationale: 原文把百姓描写为属于上帝的产业。“你的产业”保留这种归属和盟约意味，也避免将比喻解释成普通物质财产。
- issue: נַשְּׂאֵם的动作含义
  choice: 托住他们
  alternative: 高举他们；背负他们
  rationale: 希伯来词本身容许“举起”“背负”或“携带”等理解。正文采用能与牧养意象自然衔接的“托住”，并用脚注保留真实的词义幅度，不把经文固定为单一图景。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“子民”“产业”“牧养”保留诗篇的群体归属与牧人意象；分号呈现前后两组平行祈求。脚注紧随各自对应词语，避免英文咨询层中标记位置可能造成的歧义。
