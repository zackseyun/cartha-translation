  text: אַל תִּמְשְׁכֵ֣/נִי עִם רְשָׁעִים֮ וְ/עִם פֹּ֪עֲלֵ֫י אָ֥וֶן דֹּבְרֵ֣י שָׁ֭לוֹם עִם רֵֽעֵי/הֶ֑ם וְ֝/רָעָ֗ה בִּ/לְבָבָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/003.yaml
  text: Do not drag me away with the wicked[a], with those who work evil[b], who speak peace with their neighbors while evil is in their hearts.
translation:
  language: zh_hans
  text: 不要把我和恶人、作恶的人一同拖走[a]。他们向邻舍说和平的话[b]，心里却怀着恶意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拖走”也可译作“拉走”或“带走”。
    reason: lexical_alternative
  - marker: b
    text: “邻舍”也可译作“朋友”或“同伴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשְׁכֵנִי
  choice: 把我……拖走
  rationale: 该动词在此表示被强行带走，与恶人一同落入某种结局；“拖走”保留祈求中的力度，同时不明说具体是何种审判。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是诗篇中自然、凝练的对应语，指品行邪恶的人，而不局限于法律意义上的有罪者。
- source_word: פֹּעֲלֵי אָוֶן
  choice: 作恶的人
  rationale: 既表达主动行恶的含义，又符合现代汉语习惯，比“作孽之人”更通俗。
- source_word: דֹּבְרֵי שָׁלוֹם
  choice: 说和平的话
  rationale: 保留希伯来语“说和平”的表达及其与内心恶意之间的鲜明反差。
- source_word: רֵעֵיהֶם
  choice: 邻舍
  rationale: רֵעַ可指朋友、同伴或邻人；“邻舍”不预设双方确有亲密友谊，并适合此处一般社会关系的语境。
- source_word: רָעָה בִּלְבָבָם
  choice: 心里却怀着恶意
  rationale: 此处רָעָה侧重内在的恶念或害人意图；“怀着恶意”在现代汉语中自然地呈现这一含义。
theological_decisions:
- issue: 诗人所求的是不与恶人一同遭遇结局，还是不效法恶人
  choice: 译为不要被与恶人一同拖走，保留共同遭遇某种结局的含义
  alternative: 理解为不要让诗人受恶人影响或效法他们
  rationale: “拖走”与“和……一同”的组合更自然地指被带走并与恶人同受某种结局，很可能涉及审判；但原文未明说审判，因此译文也不加以限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。首句补出第二个“带走”，使希伯来语两个并列介词短语在汉语中结构清楚；后半句以“却”显明外在言语与内心意图的对照。所有脚注标记均已置于正文。
