  text: תֶּן לָ/הֶ֣ם כְּ/פָעֳלָ/ם֮ וּ/כְ/רֹ֪עַ מַֽעַלְלֵ֫י/הֶ֥ם כְּ/מַעֲשֵׂ֣ה יְ֭דֵי/הֶם תֵּ֣ן לָ/הֶ֑ם הָשֵׁ֖ב גְּמוּלָ֣/ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/004.yaml
  text: Give to them according to their work[a], and according to the evil of their deeds; according to the work of their hands give to them; repay them their due.
translation:
  language: zh_hans
  text: 求你按他们所做的待他们，按他们恶行的恶毒待他们；按他们手所做的待他们，使他们得到应得的报偿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּן לָהֶם
  choice: 报应他们
  rationale: תֶּן本义为“给”，但在本节按行为施予相称后果的司法语境中，译作“报应”更自然，也保留祈求式命令的力度；句首补出“求你”以符合现代汉语祷告表达。
- source_word: כְּפָעֳלָם
  choice: 照他们所做的
  rationale: פֹּעַל指工作、行为或所做之事；此译保留“按其行为”的尺度关系，同时比“照他们的工作”更符合现代汉语。
- source_word: וּכְרֹעַ מַעַלְלֵיהֶם
  choice: 照他们恶劣的行径
  rationale: רֹעַ表示恶、邪恶；מַעֲלָלִים指行为、行径，常带道德色彩。“恶劣的行径”自然地表达其道德负面含义，不额外强化为特定身份称谓。
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: 照他们手所做的
  rationale: 直译保留“手”的希伯来意象，强调这些行为是他们亲自实施的，也维持本节的平行结构。
- source_word: הָשֵׁב
  choice: 还给
  rationale: שוב的使役式在此有使某种结果返回其身、予以偿还之意；“还给”保留“返回”的意象，并由上下文显明报偿含义。
- source_word: גְּמוּלָם
  choice: 他们应得的报应
  rationale: גְּמוּל可指回报、报偿或应得之分；结合负面语境，“应得的报应”清楚表达相称的司法报偿。
theological_decisions:
- issue: 咒诅诗中的祈求与神的报应
  choice: 译为诗人直接祈求神按他们的行为施行相称报应
  alternative: 弱化为对后果的客观描述，或仅译作泛泛的“给他们”
  rationale: 原文连续使用תֶּן、תֵּן、הָשֵׁב等命令式，明确是向神发出的祈求，而非中性陈述；译文保留其审判力度，同时以“照”反复标明报应与行为相称，并不扩大原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留三重平行推进和“手所做的”意象；用“求你”自然标示向神祈求，用“报应”体现本节明确的司法语境。
