    issue: “他们恶劣的行径”未充分体现“恶行的恶／恶毒”的构造。
    rationale: וּכְרֹעַ מַעַלְלֵיהֶם直指他们行为中的恶；“恶劣的行径”意涵相近，却压缩了原文对恶性的强调。
  - severity: low
    issue: 末句“把他们应得的报应还给他们”语义重复且搭配欠自然。
    rationale: גְּמוּלָם意为其应得的报偿；以“报偿”译之可避免“报应……报应”的重复，并较准确呈现偿还／回报语义。
