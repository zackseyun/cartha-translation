  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לַ/בְּקָרִ֗ים אַצְמִ֥ית כָּל רִשְׁעֵי אָ֑רֶץ לְ/הַכְרִ֥ית מֵֽ/עִיר יְ֝הוָ֗ה כָּל פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/008.yaml
  text: Morning by morning I will destroy all the wicked of the land[b][a], cutting off from the city of Yahweh all workers of iniquity.
translation:
  language: zh_hans
  text: '每天清晨，我都要除灭这地所有的恶人[a]，

    从雅威[b]的城中剪除一切作恶的人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“全地所有的恶人。”希伯来语 אֶרֶץ 既可指某一国土，也可指全地；这里的君王治理语境较支持“这地”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语为 יהוה（YHWH），这里音译作“雅威”；传统汉译也常作“耶和华”或“上主”。
    reason: alternative_reading
lexical_decisions:
- source_word: לַבְּקָרִים
  choice: 每天清晨
  rationale: 复数形式配合介词表达反复、逐日发生的行动；“每天清晨”自然地传达这种迭代意义。
- source_word: אַצְמִית
  choice: 我要除灭
  rationale: צמת 的使役式在此表示使人灭亡、将其消灭；在君王施行审判的语境中，“除灭”既直接又庄重。
- source_word: כָּל רִשְׁעֵי אָרֶץ
  choice: 这地所有的恶人
  rationale: רִשְׁעֵי 是名词化复数，指“恶人”；אָ֑רֶץ 可指“地、国土”或“全地、世界”，本诗的王权治理背景支持译作“这地”，同时以脚注保留另一可能。
- source_word: לְהַכְרִית
  choice: 剪除
  rationale: כרת 的使役式不定词表示前一行动的目的或结果；“剪除”保留其审判性力度，也与“从……城中”自然搭配。
- source_word: מֵעִיר יְהוָה
  choice: 从雅威的城中
  rationale: 按希伯来语关系直译为属于雅威的城，并保留“从……中”的清除方向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以称号代替；脚注说明传统译法。
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: 一切作恶的人
  rationale: 原文直指一切行作 אָוֶן 的人；“作恶的人”在现代汉语中自然清楚，并保留行为与道德邪恶之间的联系。
theological_decisions:
- issue: אָ֑רֶץ 的范围
  choice: 这地
  alternative: 全地／世界
  rationale: 诗中说话者以君王身份治理其领域，又特别提到“雅威的城”，因此具体的国土语境更合适；但希伯来词本身也可指全地，故以脚注保留歧义。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 正文以音译保留原文中的专名性质；不同汉语传统采用“耶和华”或以“上主”等称号替代，脚注对此作简要说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗体语言。“每天清晨”表达反复施行审判；“除灭／剪除”保留原文两组强烈而彼此呼应的司法性动词。脚注标记分别紧随所说明的“这地”和“雅威”。
