  text: עֵינַ֤/י בְּ/נֶֽאֶמְנֵי אֶרֶץ֮ לָ/שֶׁ֪בֶת עִמָּ֫דִ֥/י הֹ֭לֵךְ בְּ/דֶ֣רֶךְ תָּמִ֑ים ה֝֗וּא יְשָׁרְתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/006.yaml
  text: My eyes are on the faithful of the land[a], that they may dwell with me; he who walks in a blameless way[b], he shall serve me.
translation:
  language: zh_hans
  text: 我的眼目要眷顾国中忠信的人，让他们住在我身边[a]；行走在纯全之道上的人[b]，必服侍我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住在我身边”也可译作“坐在我身边”。希伯来语动词既可表示“坐”，也可表示“居住”；这里可能指持续在王身边相伴或供职。
    reason: lexical_alternative
  - marker: b
    text: “行走在纯全之道上”也可译作“行为正直”。这里的“纯全”指正直、完整、无可指责，并非绝对没有罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  choice: 我的眼目要关注
  rationale: 原文直译为“我的眼目”，在这里表达定意留心并眷顾；保留“眼目”的具体意象，同时用“关注”自然传达其惯用含义。
- source_word: בְּנֶאֶמְנֵי אֶרֶץ
  choice: 国中忠信的人
  rationale: נֶאֱמָן 可指忠信、可靠的人；אֶרֶץ 在君王语境中较可能指其国土或辖境，因此译作“国中”。
- source_word: לָשֶׁבֶת עִמָּדִי
  choice: 让他们住在我身边
  rationale: יָשַׁב 可指坐下或居住；此处表达持续与王同在、相伴或任职。“住在我身边”既自然，也保留亲近相伴的意味。
- source_word: הֹלֵךְ
  choice: 走……的人
  rationale: 该分词作名词用，描述一贯的生活方式；“走……之道”保留原文以行路比喻品行的表达。
- source_word: בְּדֶרֶךְ תָּמִים
  choice: 走纯全之道
  rationale: דֶּרֶךְ 比喻人的生活道路，תָּמִים 表示完整、正直、无可指责，并非绝对无罪。“纯全之道”简洁保留原文意象与伦理含义。
- source_word: הוּא
  choice: （这样的人）
  rationale: 希伯来文独立代词带有强调作用。中文借助前置的“……的人”以及后句结构自然体现其强调，不另作生硬直译。
- source_word: יְשָׁרְתֵנִי
  choice: 必服侍我
  rationale: שׁרת 常指在某人身边供职或亲自服侍，在本诗的王室语境中兼有个人服侍和任职之意；“服侍我”不将范围限于宗教职事。
theological_decisions:
- issue: 君王身边之人的道德资格
  choice: 译文既表达诗人对国中忠信之人的眷顾，也表明生活纯全的人适合在他身边服侍。
  alternative: 也可将整节较狭义地理解为君王选任宫廷官员。
  rationale: “住在我身边”可涵盖亲近相伴，“服侍我”又可涉及正式任职；译文保留这两方面，不把经文限定为私人交往或官僚任命。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的眼目”与“走……之道”保留诗歌的具体意象；“关注”“住在我身边”则使句意自然清楚。分号对应原文由关注忠信者转向说明服侍资格的两部分结构。
