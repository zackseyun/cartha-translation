  text: לֵבָ֣ב עִ֭קֵּשׁ יָס֣וּר מִמֶּ֑/נִּי רָ֝֗ע לֹ֣א אֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/004.yaml
  text: A crooked heart will depart from me[a]; I will not know evil.
translation:
  language: zh_hans
  text: 乖僻的心必离开我；我不认识恶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我不认识恶”也可意译为“我决不与恶有任何关系”。希伯来原文直译是“我不认识恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵבָב
  choice: 心
  rationale: 在希伯来语的人观中，此词指人的内在，包括思想、意志和道德取向；“心”是现代中文圣经语体中自然、透明的对应。
- source_word: עִקֵּשׁ
  choice: 乖僻的
  rationale: 该词表示偏离正直、在道德上扭曲；“乖僻”既保留正直与弯曲的隐喻，也符合庄重的现代中文表达。
- source_word: יָסוּר מִמֶּנִּי
  choice: 必远离我
  rationale: סור 表示转离、离开，מן 加第一人称后缀表示与诗人分离；“必远离我”简洁保留原文语义。
- source_word: רָע
  choice: 恶事
  rationale: 此处可泛指邪恶或恶的事物；“恶事”在中文中可作前置话题，并避免将其不必要地限定为某一种罪恶。
- source_word: לֹא אֵדָע
  choice: 我不认识
  rationale: ידע 的字面义是“认识、知道”，在此也可能含有认同、交往或参与之意。正文保留“认识”以呈现希伯来语的表达和张力，脚注说明其语境含义。
theological_decisions:
- issue: “认识恶事”的含义
  choice: 正文保留“我不认识”，让“认识”可能具有关系性、参与性的含义
  alternative: 直译为“不知道恶事”，或明确意译为“我决不与恶事有任何关系”
  rationale: 诗篇和智慧文学中的“认识”有时不只是认知，也可涉及经验、认同或关系。保留原文措辞可避免把多重含义压缩为单一解释；脚注则帮助普通读者理解这里主要表达拒绝与恶相交。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。“乖僻的心”保留原文的道德隐喻；后半句用话题结构“恶事，我不认识”保留原文次序与强调。
