source:
  edition: WLC
  text: לֹֽא יֵשֵׁ֨ב בְּ/קֶ֥רֶב בֵּיתִ/י֮ עֹשֵׂ֪ה רְמִ֫יָּ֥ה דֹּבֵ֥ר שְׁקָרִ֑ים לֹֽא יִ֝כּ֗וֹן לְ/נֶ֣גֶד עֵינָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/007.yaml
  text: One who practices deceit will not dwell within my house[b][a]; one who speaks lies will not stand before my eyes.
translation:
  language: zh_hans
  text: 行诡诈的人不得住在我家中[a]；说谎话的人不得在我眼前立足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“施行欺骗的人不得留在我家中。”原文直译为“行诡诈的人”，表示惯常施行欺骗的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不得在我眼前站稳”或“不得在我眼前存立”。原文动词可表示“被立稳、站稳、存立”；在此处也可指这样的人不得继续留在诗人面前。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: 住
  rationale: 该动词可指“坐、居住、停留”。与“我家中”连用时，“住”自然表达在王家中持续居留或获准留任的意思。
- source_word: בְּקֶרֶב בֵּיתִי
  choice: 在我家中
  rationale: בְּקֶרֶב 表示“在……中间、在……之内”；译作“在我家中”既自然，也保留第一人称所属关系和王室家门的语境。
- source_word: עֹשֵׂה רְמִיָּה
  choice: 行诡诈的
  rationale: 分词结构直指惯常施行诡诈的人；“行诡诈”保留动作性和品格性的含义，并与下句“说谎话的”形成平行。
- source_word: דֹּבֵר שְׁקָרִים
  choice: 说谎话的
  rationale: 分词表示其一贯行为，复数 שְׁקָרִים 指各种谎言；“说谎话的”直接、自然，并保留原文的动词结构。
- source_word: יִכּוֹן
  choice: 立足
  rationale: Nifal 形态可表示“被立稳、站稳、存立”。在“我眼前”的语境中，“立足”既保留站立/稳立的意象，也表达此人不会获准继续留在说话者面前。
- source_word: לְנֶגֶד עֵינַי
  choice: 在我眼前
  rationale: 这是贴近原文意象的表达，兼有处于说话者面前并受其察看的意味。
theological_decisions:
- issue: 说话者排斥诡诈之人的范围
  choice: 译为诗人君王对自己家中和面前之人的治理承诺。
  alternative: 理解为关于上帝之家的普遍陈述，或纯粹比喻内心道德洁净。
  rationale: 诗篇101篇以君王治理家室和国政的决心为框架；本节的“我家”和“我眼前”应保留其第一人称所指，不在翻译中将其属灵化或扩展为超出文本的教义主张。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“行诡诈”略具经文语体但仍通顺；“立足”保留原文 כון 的稳立含义及宫廷、审断场景中的临在意味。脚注标记均置于相关主句之后。
