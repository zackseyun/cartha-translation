id: PSA.101.2
reference: Psalms 101:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַשְׂכִּ֤ילָה בְּ/דֶ֬רֶךְ תָּמִ֗ים מָ֭תַי תָּב֣וֹא אֵלָ֑/י אֶתְהַלֵּ֥ךְ בְּ/תָם לְ֝בָבִ֗/י בְּ/קֶ֣רֶב בֵּיתִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/002.yaml
  text: I will give attention to the blameless way—when will you come to me? I will walk with integrity of heart within my house[a][b].
translation:
  language: zh_hans
  text: 我要留心纯全的道路[b]——你何时来到我这里？[a] 我要在自己家中，以纯正的心行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你何时来到我这里？”主语没有明说；许多人认为这是对上帝说的。
    reason: alternative_reading
  - marker: b
    text: 或译：“我要思考纯全之道”，或“我要在纯全的道路上谨慎行事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂכִּילָה
  choice: 我要留心
  rationale: שׂכל 的使役式在这里可表示谨慎行事，也可表示专心留意。“我要留心”自然地表达说话者有意关注并遵行正道，同时不把词义局限为单纯的思想活动。
- source_word: בְּדֶרֶךְ תָּמִים
  choice: 纯全的道路
  rationale: דֶּרֶךְ 在伦理语境中常以“道路”比喻生活方式；תָּמִים 强调整全、正直、无可指摘，并非抽象地宣称绝对无罪。“纯全的道路”保留了原文的伦理隐喻。
- source_word: מָתַי תָּבוֹא אֵלַי
  choice: 你何时来到我这里？
  rationale: 原文动词为第二人称阳性单数，却没有明说主语。直译为问句并保留“你”，既符合语法，也不在正文中擅自补出“上帝”。
- source_word: אֶתְהַלֵּךְ
  choice: 我要……行事
  rationale: הלך 的 Hitpael 形式可指人的生活为人或行为方式。现代汉语若直译“行走”容易只被理解为空间移动，因此用“行事”清楚传达伦理含义。
- source_word: בְּתָם לְבָבִי
  choice: 以纯正的心
  rationale: תֹּם 表示完整、正直、纯全；与“心”连用时指内在真诚正直。“以纯正的心”简明自然，并与前句“纯全”形成语义呼应而不机械重复。
- source_word: בְּקֶרֶב בֵּיתִי
  choice: 在自己家中
  rationale: בְּקֶרֶב 字面为“在……当中”，这里指说话者家宅以内或家庭生活的范围。“在自己家中”是自然准确的现代汉语表达。
theological_decisions:
- issue: “你何时来到我这里？”中未明说的主语
  choice: 正文保留第二人称“你”，不明确补作“上帝”
  alternative: 明确译为“上帝啊，你何时来到我这里？”；或把此句非人称化，使之指纯全之道临到
  rationale: 希伯来文使用第二人称阳性单数动词，但没有出现明确主语。诗篇的敬虔语境使不少人将其理解为对上帝的呼求，不过原文仍留有含蓄之处，因此正文保留直接称呼，并用脚注说明。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“道路”保留诗歌中的生活道路隐喻；“行事”则避免“行走”在现代汉语中被误解为单纯的身体动作。破折号保留两小句之间突转为呼问的诗意张力。
