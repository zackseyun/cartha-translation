id: PSA.101.5
reference: Psalms 101:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מלושני בַ/סֵּ֨תֶר רֵעֵ/הוּ֮ אוֹת֪/וֹ אַ֫צְמִ֥ית גְּֽבַהּ עֵ֭ינַיִם וּ/רְחַ֣ב לֵבָ֑ב אֹ֝ת֗/וֹ לֹ֣א אוּכָֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/005.yaml
  text: Whoever secretly slanders his neighbor[a], him I will destroy; one with haughty eyes and a proud heart[b], him I cannot endure.
translation:
  language: zh_hans
  text: 暗中诋毁邻舍的，我要除灭他[a]；眼目高傲、心里狂妄的，我不能容忍他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除灭”也可译作“剪除”。
    reason: lexical_alternative
  - marker: b
    text: “眼目高傲、心里狂妄”直译为“眼目高、心宽阔”，是希伯来语描写外在傲慢神态和内在自高心态的说法。
    reason: cultural_note
lexical_decisions:
- source_word: מְלוֹשְׁנִי בַסֵּתֶר
  choice: 暗中诋毁……的
  rationale: מְלוֹשְׁנִי 源于 לשׁן，在此作实词化分词，指以恶意言语中伤人的人；בַסֵּתֶר 表示行为隐秘。“暗中诋毁”自然地保留了隐蔽中伤的含义。
- source_word: רֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ 指社会关系中的同伴或身边之人，不必限定为亲密朋友；“邻舍”既沿用圣经语汇，也保留其较宽泛的范围。
- source_word: אַצְמִית
  choice: 我要除灭他
  rationale: צמת 的使役式表达使之灭亡、剪除。“除灭”保留原文强烈的审判语气，同时不擅自规定具体执行方式。
- source_word: גְּבַהּ עֵינַיִם
  choice: 眼目高傲
  rationale: 字面为“眼目高”，是表示傲慢神态的希伯来语形象；“眼目高傲”既保留身体意象，又清楚传达伦理含义。
- source_word: וּרְחַב לֵבָב
  choice: 心里狂妄
  rationale: 字面为“心宽阔”，此处不是慷慨，而是自高、狂傲。“心里狂妄”避免现代汉语把“心宽”误解为豁达。
- source_word: לֹא אוּכָל
  choice: 我不能容忍他
  rationale: 字面为“我不能”，语境隐含不能承受或容纳这样的人。“不能容忍”同时表达能力否定和坚定的道德拒绝。
theological_decisions:
- issue: 君王伦理宣言中审判的范围
  choice: 译作“我要除灭他”，保留针对暗中诋毁者的强烈审判语言，但不说明其具体机制。
  alternative: 可理解为处死此人，或仅以夸张方式表示拒绝与之来往。
  rationale: 原文 אַצְמִית 用语严厉，而后半句 לֹא אוּכָל 表示不能容忍。译文保留二者的力度和张力，不将经文限定为某一种刑罚或单纯断绝交往。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“邻舍”保留广泛的人际含义；平行结构贴近希伯来诗歌。正文中的[a]、[b]与脚注一一对应。
