  text: לֹֽא אָשִׁ֨ית לְ/נֶ֥גֶד עֵינַ֗/י דְּֽבַר בְּלִ֫יָּ֥עַל עֲשֹֽׂה סֵטִ֥ים שָׂנֵ֑אתִי לֹ֖א יִדְבַּ֣ק בִּֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/003.yaml
  text: I will not set any worthless thing before my eyes[a]; I hate the work of those who turn aside[b]; it will not cling to me.
translation:
  language: zh_hans
  text: '我决不把任何卑劣之事摆在眼前[a]；

    我恨恶偏离者的作为[b]；

    它绝不沾上我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卑劣之事”或译“邪恶之事”“无价值之事”，也有人译作“彼列之事”。这里的希伯来语 בְּלִיָּעַל 更可能是描述卑劣、邪恶或无价值，而不是专名。
    reason: lexical_alternative
  - marker: b
    text: 或译“背道者的行为”“悖谬之人的作为”。原文所用词的基本意思是“偏离、转离”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁית
  choice: 摆在
  rationale: שׂים的第一人称单数未完成式意为“放置、摆放”；与“眼前”搭配时，“摆在”自然地保留了具体动作和立志的语气。
- source_word: לְנֶגֶד עֵינַי
  choice: 在眼前
  rationale: 直译为“在我的眼睛面前”。“在眼前”保留视觉意象，也表达说话者不愿主动观看或关注这类事物。
- source_word: דְּבַר בְּלִיָּעַל
  choice: 任何卑劣之事
  rationale: דבר可指“事、事情”，בליעל在此最自然地表示卑劣、邪恶或无价值，而非专名。“卑劣之事”在现代汉语中兼顾道德贬义与庄重语体；“任何”体现此处不定泛指的语义。
- source_word: עֲשֹׂה סֵטִים
  choice: 偏离正道之人的作为
  rationale: עֲשֹׂה指所做之事、行为或作为；סֵטִים源于“偏离、转离”的词根。译文保留“偏离”的形象，并以“正道”补足现代汉语中所偏离对象的隐含意义。
- source_word: שָׂנֵאתִי
  choice: 我恨恶
  rationale: 虽为完成式，但在诗歌语境中表达已经确立并持续的态度。“恨恶”比单说“恨”更庄重，也适合对行为的强烈道德拒斥。
- source_word: לֹא יִדְבַּק בִּי
  choice: 它绝不沾上我
  rationale: דבק意为黏附、紧贴。“沾上我”保留不良行为像污物一样附着于人的隐喻；“绝不”传达否定句中的坚定决心。代词“它”照应前述“作为”，不替原文明确其具体所指。
theological_decisions:
- issue: בְּלִיָּעַל是普通描述语还是专名
  choice: 按普通描述语译为“卑劣”
  alternative: 译为“彼列的”或理解为名叫“彼列”的邪恶存在
  rationale: 本节的דבר בליעל最自然地指卑劣、邪恶或无价值之事；原文不要求将其人格化为专名。这样可避免把后期形成的专名含义倒入本诗。
- issue: סֵטִים所指的偏离性质
  choice: 译为“偏离正道之人”，保留一般性的道德偏离
  alternative: 译为“背道者”“叛教者”或“悖谬之人”
  rationale: 词根的核心意象是转离、偏离。原文未明确限定为正式的宗教叛教，因此正文不采用神学含义更窄的“背道者”，并在脚注列出可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。三分句保留希伯来诗句层层推进的结构：拒绝观看、恨恶其行为、拒绝让它附着于自己。“摆在眼前”和“沾上我”保留原文的具体意象；脚注呈现关键词的真实词义范围，而不在正文中强行消除歧义。
