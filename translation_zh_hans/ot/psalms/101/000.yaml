base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/000.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, Yahweh[b], I will sing praise.
translation:
  language: zh_hans
  text: '大卫的诗[a]。


    我要歌唱慈爱和公正[b]；

    耶和华啊，我要向你歌颂。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“大卫的”；这可能表示大卫所作、献给大卫，或与大卫有关。
    reason: alternative_reading
  - marker: b
    text: “慈爱和公正”也可译作“怜悯和审判”。这里的“慈爱”还含忠贞、信实之爱的意味；“公正”也可指公正的判断或审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 这是诗篇标题中自然、简洁的常见译法；希伯来介词 לְ 所表达的具体关系并不完全确定，因此以脚注保留作者、归属或献给大卫等可能性。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 既保留该词所含的怜爱意味，也能承载忠贞、信实之爱的较广内涵；不在正文中将其缩窄为单纯的“怜悯”。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 在与“慈爱”并列并作为歌唱主题的语境中，“公正”自然体现正直施行判断的伦理意义；脚注保留“审判”等较窄译法。
- source_word: אֲזַמֵּרָה
  choice: 歌颂
  rationale: 该动词指以歌唱或奏乐赞美；“歌颂”在现代汉语中自然庄重，并与前句“歌唱”形成适度变化。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的专名形式，明确原文此处是上帝的专名，而非普通称谓“主”。
theological_decisions:
- issue: חֶסֶד 的盟约与伦理内涵
  choice: 正文译作“慈爱”，脚注说明其也含忠贞、信实之爱
  alternative: 怜悯；坚定的爱；忠贞之爱
  rationale: 避免把词义仅限于怜悯，同时不在正文中强制加入原文在本句中没有明说的神学限定。
- issue: לְדָוִד 在标题中的关系
  choice: 译作“大卫的”，并在脚注保留多义性
  alternative: 大卫所作；献给大卫；与大卫有关
  rationale: 原文介词结构可以表示作者、归属、献呈或关联，正文采用传统而自然的简译，但不把作者身份说成唯一确定的解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体。标题单列；正文分为两行以呈现平行结构。呼语“耶和华啊”清楚保留原文专名及第二人称指向。
