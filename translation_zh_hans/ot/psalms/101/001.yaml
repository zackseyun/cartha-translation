  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/001.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, O Yahweh[b], I will sing praise.
translation:
  language: zh_hans
  text: '大卫的诗[a]。

    我要歌唱慈爱和公正[b]；

    雅威啊[c]，我要向你歌颂。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的”也可理解为“献给大卫的”或“与大卫有关的”；希伯来语标题没有明确限定其关系。
    reason: 保留标题介词 לְ 所容许的作者、题献或关联等歧义。
  - marker: b
    text: “慈爱和公正”也可译作“怜悯和审判”。
    reason: 说明 חֶסֶד 和 מִשְׁפָּט 的较窄词义选择。
  - marker: c
    text: “雅威”音译希伯来神名 יהוה；传统上也译作“耶和华”，或以“主”代称。
    reason: 交代神名的原文形式及中文传统译法。
lexical_decisions:
- source_word: לְדָוִד מִזְמוֹר
  choice: 大卫的诗
  rationale: 这是诗篇标题的自然中文表达。介词 לְ 可表示作者、归属、题献或关联；“大卫的”既符合标题惯例，也不像“由大卫所作”那样把含义限定为作者身份。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: חֶסֶד 涵盖怜悯、忠诚和持久的盟约之爱。“慈爱”是庄重而易懂的中文表达，并保留了其宽广含义。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: מִשְׁפָּט 可指审判、判决或公义秩序；此处与 חֶסֶד 并列，“公正”最自然地表达其伦理与治理层面的意义。
- source_word: אָשִׁירָה
  choice: 我要歌唱
  rationale: 该鼓励式形式表达意愿与决心；“我要歌唱”在现代中文中自然地传达这种主动意向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用希伯来神名四字母词的中文音译，而不以“主”这一称号替代，从而保留经文中的专名。
- source_word: אֲזַמֵּרָה
  choice: 我要向你歌颂
  rationale: זמר 表示以歌唱或音乐颂赞；“歌颂”既体现赞美对象，也避免与前句“歌唱”完全重复。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。音译“雅威”保留专名性质，不以称号代替；脚注说明相关传统译法。
- issue: חֶסֶד 与 מִשְׁפָּט 的并列关系
  choice: 慈爱和公正
  alternative: 怜悯和审判
  rationale: 原词都具有一定语义幅度。本译文采用适合全诗伦理主题的宽泛表达，同时在脚注保留较窄的可能译法，不把两者限定为某一种神学解释。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体中文。标题简洁；正文保留两组平行表达，并用分号呈现希伯来诗句的推进关系。“歌唱／歌颂”既呼应又不机械重复。
