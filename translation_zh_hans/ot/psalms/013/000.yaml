    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给音乐指挥
  rationale: 该词在诗篇题注中通常指负责指导音乐演奏的人。译作“音乐指挥”既符合礼仪音乐语境，也比传统的“伶长”更便于现代读者理解；前缀 לַ 按题注用法译为“交给”。
- source_word: מִזְמוֹר
  choice: 诗篇
  rationale: 这是诗篇题注中常见的体裁名称，指配乐吟唱的诗歌；“诗篇”是准确、庄重且通行的现代中文表达。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 诗题中的介词 לְ 可表示作者、归属、关联或题献。“大卫的”保留了这种关系上的开放性，避免把含义限定为“大卫所作”。
theological_decisions:
- issue: 诗题中 לְדָוִד 的关系含义
  choice: 大卫的
  alternative: 由大卫所作；献给大卫
  rationale: 希伯来文没有明确限定这里是作者署名、归属说明还是题献。正文采用“大卫的”，并以脚注说明其他可能含义，以保留原文的真实歧义。
translation_notes:
  register: 采用现代、简明而庄重的诗题措辞。“音乐指挥”避免较古雅的“伶长”，“大卫的诗篇”则保持标题式的凝练，并保留原文介词关系的歧义。
