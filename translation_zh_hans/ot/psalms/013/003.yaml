  text: הַבִּ֣יטָֽ/ה עֲ֭נֵ/נִי יְהוָ֣ה אֱלֹהָ֑/י הָאִ֥ירָ/ה עֵ֝ינַ֗/י פֶּן אִישַׁ֥ן הַ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/003.yaml
  text: Look and answer me[a], O Yahweh my God; give light to my eyes[b], lest I sleep the sleep of death.
translation:
  language: zh_hans
  text: 求你垂看，回答我，雅威，我的上帝啊！求你使我的眼睛明亮[a]，免得我沉睡至死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我的眼睛明亮”也可译为“照亮我的眼睛”或“使我的眼目焕发”。这个希伯来语意象可能指恢复生机、清醒或盼望。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译近于“免得我睡死亡”；也可理解为“免得我睡在死亡中”。传统译法为“免得我沉睡死亡之眠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטָה
  choice: 垂看我
  rationale: 该祈使式呼求上帝留意并眷顾诗人。“垂看”既保留“看”的直接意象，也符合现代汉语庄重祷告的语体。
- source_word: עֲנֵנִי
  choice: 回答我
  rationale: ענה在祷告语境中通常指“回答”；直译保留诗人直接而切身的恳求，不额外加入“施恩”等解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列上帝专名的性质，而不以头衔替代。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 直接表达第一人称所属关系，保留诗人对上帝个人而亲近的呼求。
- source_word: הָאִירָה עֵינַי
  choice: 使我的眼睛明亮
  rationale: 保留“使发光”与“眼睛”的身体意象；原文可能涉及恢复生机、清醒或盼望，正文不将其限定为其中一种。
- source_word: פֶּן
  choice: 免得
  rationale: 自然表达诗人所惧怕并求上帝阻止的结果。
- source_word: אִישַׁן הַמָּוֶת
  choice: 我沉睡在死亡中
  rationale: 保留死亡如沉睡的诗歌隐喻，同时以汉语介词结构表达原文高度凝缩的“睡死亡”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”旨在保留专名，而非以“主”这一称号替代；“耶和华”虽在汉语传统中更常见，但并非较贴近原名发音的形式。
- issue: “使我的眼睛明亮”的隐喻
  choice: 保留眼睛明亮的原文意象
  alternative: 恢复我的精神；使我重获希望；使我清醒
  rationale: 此意象可能涵盖生命力、清醒、领悟或盼望，原文本身没有限定单一含义，因此不在正文中消解其开放性。
- issue: “沉睡”与“死亡”的关系
  choice: 沉睡在死亡中
  alternative: 睡死亡；长眠而死；沉睡死亡之眠
  rationale: 原文语法极为凝缩，既把死亡描绘为睡眠，也指向诗人实际死亡的危险。所选译法保留隐喻及其张力，脚注注明更直译和传统表达。
translation_notes:
  register: 采用现代、庄重而可理解的诗歌祷告语体。“垂看”与“免得”略具庄严色彩，但在现代汉语中仍清楚自然；句中以感叹号体现连续祈使句的迫切语气。
