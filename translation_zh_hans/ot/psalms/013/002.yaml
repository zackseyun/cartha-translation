  text: עַד אָ֨נָה אָשִׁ֪ית עֵצ֡וֹת בְּ/נַפְשִׁ֗/י יָג֣וֹן בִּ/לְבָבִ֣/י יוֹמָ֑ם עַד אָ֓נָה יָר֖וּם אֹיְבִ֣/י עָלָֽ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/002.yaml
  text: How long must I take counsel in my soul[b][a], with sorrow in my heart all day? How long will my enemy be exalted over me?
translation:
  language: zh_hans
  text: 我还要在内心筹划多久[a]，心中终日忧愁？我的仇敌还要高居我之上多久[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我还要在自己心里拟定种种计划多久？”
    reason: lexical_alternative
  - marker: b
    text: 或译：“我的仇敌还要胜过我多久？”原文较直译为“高居我之上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: 还要……多久
  rationale: 这是哀歌中反复出现的时间问句；“还要……多久”既符合现代汉语，也保留持续受苦、迫切发问的语气。
- source_word: אָשִׁית עֵצוֹת
  choice: 反复筹算
  rationale: אָשִׁית本义为“放置、设定”，עֵצוֹת为复数，可指谋略、计划或主意。上下文描写诗人在内心不断思量对策；“反复筹算”自然传达这种内在谋划及其持续负担。
- source_word: בְּנַפְשִׁי
  choice: 在心里
  rationale: נֶפֶשׁ在此指人的内在自我。汉语“在心里”比直译“在我的魂里”自然，并与下一句“心中”形成诗意呼应；原词并非专指与身体分离的灵魂。
- source_word: יָגוֹן
  choice: 忧愁
  rationale: 该词表示悲伤、愁苦；“忧愁”用语清楚庄重，也适合诗篇的哀诉语体。
- source_word: בִּלְבָבִי
  choice: 心中
  rationale: לֵבָב可涵盖思想、情感和意志；此处译作“心中”保留希伯来诗歌的人体意象。
- source_word: יוֹמָם
  choice: 终日
  rationale: 此处作时间副词，表示白昼期间或整日持续；“终日”简洁地表达忧愁绵延不止。
- source_word: יָרוּם
  choice: 高居
  rationale: 该动词本义是“升高、居高”。“高居我之上”保留仇敌凌驾于诗人之上的垂直意象，而不在正文中直接解释为“得胜”。
- source_word: אֹיְבִי
  choice: 我的仇敌
  rationale: 准确保留原文单数名词及第一人称所属形式；“仇敌”符合庄重的诗歌语体。
- source_word: עָלָי
  choice: 在我之上
  rationale: 与יָרוּם连用时表示仇敌高过、凌驾于诗人；“在我之上”保留原文空间隐喻。
theological_decisions: []
