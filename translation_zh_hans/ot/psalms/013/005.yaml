language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנִ֤י בְּ/חַסְדְּ/ךָ֣ בָטַחְתִּי֮ יָ֤גֵ֥ל לִבִּ֗/י בִּֽ/ישׁוּעָ֫תֶ֥/ךָ אָשִׁ֥ירָה לַ/יהוָ֑ה כִּ֖י גָמַ֣ל עָלָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/005.yaml
  text: But as for me[a], I have trusted in your steadfast love; my heart will rejoice in your salvation. I will sing to Yahweh, because he has dealt bountifully with me.
translation:
  language: zh_hans
  text: 至于我，我倚靠你的慈爱；我的心必因你的拯救[a]而欢欣。我要向雅威歌唱，因为他厚待了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“救恩”。希伯来语这个词既可指从当前困境中获救，也可指更广泛的救恩。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 连词与独立代词共同突出诗人与前文哀诉处境之间的转折，也强调其个人信靠；“至于我”在现代汉语中自然且庄重。
- source_word: בְּחַסְדְּךָ
  choice: 倚靠你的慈爱
  rationale: חֶסֶד兼有恩慈、忠贞和持久之爱的内涵。“慈爱”是简明而有诗篇语体的表达，并未将其限缩为单纯怜悯；介词与בטח合译为汉语惯用的“倚靠”。
- source_word: בָטַחְתִּי
  choice: 我倚靠
  rationale: 希伯来语完成式表示已经确立并延续至今的信靠状态。现代汉语不必用显式完成标记，“我倚靠”可自然表达当前立场，同时上下文保留其坚定意味。
- source_word: יָגֵל
  choice: 必……欢欣
  rationale: 未完成式在此指向所盼望的回应。“必……欢欣”既保留未来和确信意味，也符合诗歌语体。
- source_word: לִבִּי
  choice: 我的心
  rationale: 直译保留希伯来语中“心”作为内在自我的意象。
- source_word: בִּישׁוּעָתֶךָ
  choice: 因你的拯救而
  rationale: יְשׁוּעָה在本篇语境中首先可指从当前困境中蒙解救，同时不排除更广的救恩含义。“拯救”兼具行动性和较宽范围；将בְ自然译为原因性的“因……而”。
- source_word: אָשִׁירָה
  choice: 我要……歌唱
  rationale: 祈愿式表达意愿与决心。“我要”比单纯未来式更清楚地传达主动立志。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 原文使用神的专名四字神名；音译“雅威”保留其作为名字的性质，“向……歌唱”符合现代汉语搭配。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出歌唱的理由，“因为”清楚自然。
- source_word: גָמַל עָלָי
  choice: 他厚待了我
  rationale: 该短语在此表示充分而有恩惠地待人。“厚待”简洁传达慷慨施恩之意，避免“报偿”可能带来的交易或按功受报意味。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，并与所提供的审校层最终读法一致。
- issue: יְשׁוּעָה的范围
  choice: 拯救
  alternative: 救恩；解救
  rationale: 本诗的直接语境是从现实苦难中得救，但该词也可承载更广的救恩意义。“拯救”不把意义限定为仅属今世的脱困或仅属系统神学意义的救恩；脚注保留另一种常见译法。
- issue: 完成式בָטַחְתִּי的时间与体貌
  choice: 我倚靠
  alternative: 我已经倚靠；我素来信靠
  rationale: 完成式可表达已经确立的信靠及其当前效力。汉语以无标记现在表达较自然，也避免武断限定为一次过去行动或长期习惯。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“欢欣”“厚待”略具文学色彩，但仍属当代常用表达。句法保持原文由信靠、欢喜到歌唱的推进；神名译为“雅威”。
