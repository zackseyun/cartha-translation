  text: עַד אָ֣נָה יְ֭הוָה תִּשְׁכָּחֵ֣/נִי נֶ֑צַח עַד אָ֓נָה תַּסְתִּ֖יר אֶת פָּנֶ֣י/ךָ מִמֶּֽ/נִּי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/001.yaml
  text: How long[a], O Yahweh, will you forget me forever? How long will you hide your face from me?
translation:
  language: zh_hans
  text: 耶和华啊，你要忘记我到几时呢，难道要到永远吗？你要向我掩面到几时呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“隐藏你的脸”。这可表示撤回关注、恩宠或同在。
    reason: 说明希伯来语具体意象的惯用含义，同时不在正文中将其缩减为一种解释。
lexical_decisions:
- source_word: עַד־אָנָה
  choice: 到几时
  rationale: 这是哀歌中询问持续时间的惯用语；“到几时”自然庄重，也保留两次重复所形成的迫切呼喊。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之神名字的性质，而不改作称号。
- source_word: תִּשְׁכָּחֵנִי
  choice: 你要忘记我
  rationale: 保留שׁכח的直接词义和未完成式在持续性哀诉中的语气，不弱化为“忽略我”。
- source_word: נֶצַח
  choice: 要到永远吗
  rationale: 将其作为带强烈情感的追问单独表达，既保留“永远”的词义，也避免中文被误读成上帝必定永远忘记诗人。
- source_word: תַּסְתִּיר אֶת־פָּנֶיךָ
  choice: 你要向我掩面
  rationale: 采用自然的中文圣诗式表达，保留“面”的具体意象以及隐藏、转离之意。
- source_word: מִמֶּנִּי
  choice: 向我
  rationale: 与中文固定搭配“向某人掩面”结合，准确表达从诗人那里隐藏面容的关系。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名；中文正文保留专名而不以“主”替代。“耶和华”在现代中文圣经语境中辨识度最高，但“雅威”是按学界常见拟音的可行替代。
- issue: 是否把“你的面”解释为“你的同在”
  choice: 正文保留“掩面”的具体意象
  alternative: 不让我感受到你的同在／向我收回恩宠
  rationale: “掩面”可表示撤回同在、关注或恩宠，但原文具体意象具有诗歌力量，且其含义不宜在正文中被限定为单一解释。
- issue: נֶצַח与“忘记”的关系
  choice: 译作独立反问“要到永远吗？”
  alternative: 你要永远忘记我吗？
  rationale: 两种句法理解在意义上接近；独立反问更清楚地呈现哀歌中的情感冲击，同时仍让“永远”修饰上文所说的忘记。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。重复“到几时”以保留原文的诗歌结构和迫切感；“掩面”虽略具诗性，但在现代中文中仍清楚自然。
