source:
  edition: WLC
  text: פֶּן יֹאמַ֣ר אֹיְבִ֣/י יְכָלְתִּ֑י/ו צָרַ֥/י יָ֝גִ֗ילוּ כִּ֣י אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/004.yaml
  text: lest my enemy say[b][a], “I have overcome him,” and my adversaries rejoice because I am shaken.
translation:
  language: zh_hans
  text: '免得我的仇敌说：“我胜过他了！”[a]

    免得我的众敌人因我动摇而欢喜。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我制伏他了！”
    reason: lexical_alternative
  - marker: b
    text: “我动摇”或译“我失足”或“我摇摇欲坠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 引出诗人求上帝阻止的负面结果，既准确表达目的或结果，也符合现代汉语的诗歌语体。
- source_word: יֹאמַר
  choice: 说
  rationale: 直接引出仇敌的夸胜之言，是该动词在此处最自然的译法。
- source_word: אֹיְבִי
  choice: 我的仇敌
  rationale: 对应带第一人称单数后缀的单数名词；“仇敌”庄重自然，并与下句的复数表达有所区别。
- source_word: יְכָלְתִּיו
  choice: 我胜过他了
  rationale: 保留“胜过、占上风”的核心意义，也准确体现第一人称单数主语和第三人称阳性单数宾语，不把含义强化为彻底消灭。
- source_word: צָרַי
  choice: 我的众敌人
  rationale: “众”明确反映原文复数，并与上句单数的“我的仇敌”形成对照。
- source_word: יָגִילוּ
  choice: 欢喜
  rationale: 表达敌人因诗人受挫而欣喜的意思，简洁且适合诗篇语体。
- source_word: כִּי
  choice: 因
  rationale: 按因果意义处理，说明众敌人欢喜的缘由；在诗行中比“因为”更凝练。
- source_word: אֶמּוֹט
  choice: 我动摇
  rationale: 保留该词“被摇动、站立不稳”的意象，不限定为字面失足或已经跌倒。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两次使用“免得”补明原文פֶּן统摄的两个并列结果，使汉语结构清楚；以“众敌人”显出第二分句的复数，同时保留“动摇”在身体失稳与处境不稳之间的意象张力。
