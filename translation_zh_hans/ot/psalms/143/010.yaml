  text: לַמְּדֵ֤/נִי לַֽ/עֲשׂ֣וֹת רְצוֹנֶ/ךָ֮ כִּֽי אַתָּ֪ה אֱל֫וֹהָ֥/י רוּחֲ/ךָ֥ טוֹבָ֑ה תַּ֝נְחֵ֗/נִי בְּ/אֶ֣רֶץ מִישֽׁוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/010.yaml
  text: Teach me to do your will[a], for you are my God. Let your good Spirit lead me in level ground.
translation:
  language: zh_hans
  text: 求你教导我遵行你的旨意，因为你是我的神。愿你良善的灵[a]在平坦之地引导我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你良善的灵”也可理解为“你良善的性情”或“你良善的心性”。希伯来文没有大小写之分，因此这里既可能指神自己的灵，也可能泛指神良善的内在性情。
    reason: 保留 רוּחֲךָ 在所指对象上的歧义，避免仅凭译文确定为专名“圣灵”或抽象的性情。
lexical_decisions:
- source_word: לַמְּדֵנִי
  choice: 求你教导我
  rationale: 该词是 למד 的加强词干祈使式，带第一人称单数宾语后缀，直译为“教导我”。加“求你”自然表达诗歌祷告中的恳求语气。
- source_word: לַעֲשׂוֹת רְצוֹנֶךָ
  choice: 遵行你的旨意
  rationale: לַעֲשׂוֹת 字面为“去做”，רְצוֹנֶךָ 可指“你的意愿、所喜悦的事”。现代汉语中“遵行你的旨意”既自然，又保留实际实行神意愿的含义。
- source_word: כִּי אַתָּה אֱלֹהָי
  choice: 因为你是我的神
  rationale: כִּי 在此说明请求的理由；“因为”清楚保留因果关系，אֱלֹהָי 直译为“我的神”。
- source_word: רוּחֲךָ טוֹבָה
  choice: 你良善的灵
  rationale: רוּחֲךָ 是“你的灵”，טוֹבָה 是“良善的、好的”。中文不以大小写区分“灵”与“圣灵”，因此正文采用贴近原文而不过度限定的“你良善的灵”，并以脚注说明可能理解。
- source_word: תַּנְחֵנִי
  choice: 愿……引导我
  rationale: נחה 的使役词干在此意为“引导我、带领我”；未完成式在祷告语境中带祈愿色彩，故译作“愿……引导我”。
- source_word: בְּאֶרֶץ מִישׁוֹר
  choice: 走在平坦之地
  rationale: 该短语字面为“在平坦之地”；מִישׁוֹר 主要呈现平坦、无阻之地的空间意象。“走在”与“引导”自然衔接，但不把隐喻具体化为某一种处境。
theological_decisions:
- issue: רוּחֲךָ 是否特指神的灵
  choice: 你良善的灵
  alternative: 你良善的心意／你的圣灵
  rationale: 希伯来文没有大小写之分，רוּחַ 可指灵、气息或心性。上下文中“你的灵”很自然地可指神自己的灵，但原文并未使用专门区分大小写的形式。中文正文不增添“圣”字，也不改译为“心意”，以保留这一张力；脚注说明两种理解。
- issue: בְּאֶרֶץ מִישׁוֹר 是空间意象还是道德意义
  choice: 平坦之地
  alternative: 正直之地／正直的道路
  rationale: מִישׁוֹר 可延伸表示正直、公平，但此处与“引导”搭配时，平坦之地的空间图像最直接。译文保留意象，不将其限定为道德解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你教导我”与“愿……引导我”呈现两个平行的恳求；“遵行”符合当代宗教语境但仍为普通读者所理解。“平坦之地”保留诗歌空间意象。
