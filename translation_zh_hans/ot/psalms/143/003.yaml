  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֥י רָ֘דַ֤ף אוֹיֵ֨ב נַפְשִׁ֗/י דִּכָּ֣א לָ֭/אָרֶץ חַיָּתִ֑/י הוֹשִׁיבַ֥/נִי בְ֝/מַחֲשַׁכִּ֗ים כְּ/מֵתֵ֥י עוֹלָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/003.yaml
  text: For an enemy has pursued my soul[a]; he has crushed my life to the ground; he has made me dwell in dark places[b], like those long dead.
translation:
  language: zh_hans
  text: 因为仇敌追逼我的性命[a]，把我的生命压碎在地上，使我住在幽暗之处，如同死去已久的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“追逼我”；希伯来文直译为“追逼我的性命”，是诗歌中指整个人的常见说法。
    reason: lexical_alternative
  - marker: b
    text: 或译：“如同古时的死人。”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人恳求上主垂听的原因，保留希伯来文的因果关系。
- source_word: רָדַף
  choice: 追逼
  rationale: 表达持续追赶并加害的敌对行动，比单纯“追赶”更符合哀歌语境，又不预先限定为宗教性的“迫害”。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 对应无冠词的单数名词；汉语不必强加“一名”，可自然地作泛指或指语境中的敌人。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ在此可指整个人或生命。“性命”保留受追逼、生命遭威胁的意味，也与下句“我的生命”形成可理解的诗性呼应；脚注注明也可直接理解为“我”。
- source_word: דִּכָּא
  choice: 压倒
  rationale: 该动词有压碎、击垮之意；“压倒在地”在现代汉语中自然，并保留被彻底制伏的图像。
- source_word: לָאָרֶץ
  choice: 在地
  rationale: 与“压倒”组成自然的“压倒在地”，对应被带到地面的意象。
- source_word: חַיָּתִי
  choice: 我的生命
  rationale: 在本语境指诗人的生命或活着的存在，译为“生命”清楚自然。
- source_word: הוֹשִׁיבַנִי
  choice: 使我住
  rationale: 保留使役形式，表达仇敌迫使诗人处于某种居所或状态。
- source_word: בְמַחֲשַׁכִּים
  choice: 在幽暗之处
  rationale: 保留复数形式所暗示的黑暗处所或领域，并以庄重而自然的现代汉语表达。
- source_word: כְּמֵתֵי עוֹלָם
  choice: 如同死去已久的人
  rationale: עוֹלָם在此较可能表示久远的过去；此译自然表达如同久已死去、被遗忘之人的意象，同时用脚注保留“古时的死人”这一较形式对应的译法。
theological_decisions:
- issue: “幽暗之处”是否明确指阴间
  choice: 不直接译作“阴间”
  alternative: 使我住在阴间般的幽暗中
  rationale: 原文使用“幽暗处”而非明确的阴间名称；保留死亡意象及其开放性，避免把诗性比喻限定为特定死后世界观。
- issue: כְּמֵתֵי עוֹלָם中עוֹלָם的时间指向
  choice: 死去已久的人
  alternative: 永远死去的人
  rationale: 此处更自然地指古时或久已死去的人；不译成“永远死去”可避免将其变成有关永恒死亡状态的教义断言。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。句式保持三段递进：追逼性命、压倒生命、置于幽暗；保留原文的死亡意象与词义张力，不将“幽暗之处”解释性地固定为阴间。
