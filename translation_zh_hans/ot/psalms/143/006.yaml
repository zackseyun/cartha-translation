    rationale: “我的心灵对你如疲乏的土地”虽接近原文词序，却不是自然或完整的中文直译；原文在 לְךָ 的句法关系上确有诗歌性的省略，应如实说明，而非将一种生硬改写称为直译。
  - severity: low
    issue: “细拉”置于括号中。
    rationale: 原文将 סֶלָה 作为诗歌／礼仪标记写入正文，中文通常直接音译呈现；括号可能弱化其作为经文组成部分的地位。
