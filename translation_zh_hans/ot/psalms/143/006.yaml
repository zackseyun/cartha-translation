  text: I spread out my hands to you; my soul is like a weary land for you[a]. Selah
translation:
  language: zh_hans
  text: 我向你伸开双手；我的心灵如疲乏的土地，渴慕你。细拉
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֵּרַשְׂתִּי
  choice: 伸开
  rationale: Qal形态表示展开、伸展；“伸开双手”自然保留祈求的具体姿态。
- source_word: יָדַי
  choice: 双手
  rationale: 该形式指说话者的两只手；汉语用“双手”准确而自然。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词אֶל表示朝向受词的方向，“向你”符合祷告语境。
- source_word: נַפְשִׁי
  choice: 我的心灵
  rationale: נֶפֶשׁ可指生命、自我或内在的人；此处“心灵”较自然地表达诗人的整个内在生命，又不局限于抽象灵魂观。
- source_word: כְּאֶרֶץ עֲיֵפָה
  choice: 如疲乏的土地
  rationale: עֲיֵפָה字面为疲乏、困倦；保留拟人化且略显突兀的希伯来意象，不直接改译为“干旱”。
- source_word: לְךָ
  choice: 渴想你
  rationale: 原文לְךָ极简且省略，直译近似“对你／为你”；结合“疲乏土地”的比喻，用“渴想你”使汉语关系清楚，但作为解释性呈现，以脚注保留较形式对应的可能。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该礼仪或音乐术语的确切意义不明，按中文圣经传统音译，以免猜测性翻译。
theological_decisions:
- issue: נַפְשִׁי的整体含义
  choice: 心灵
  alternative: 灵魂／生命／我
  rationale: “心灵”在现代汉语中兼具内在生命与情感渴望的意味，同时避免把希伯来词过度限定为希腊式身心二分中的“灵魂”。
- issue: לְךָ与土地比喻的省略关系
  choice: 将其表达为“渴想你”
  alternative: 我的心灵对你如疲乏的土地
  rationale: 希伯来诗句保留省略，可能表达朝向、归属或渴望；正文为自然清楚的汉语补出语境所暗示的“渴想”，脚注则保留较直译且开放的读法。
translation_notes:
  register: 采用现代、庄重且便于朗读的祷告语言。“伸开双手”具体自然；“疲乏的土地”保留原文不寻常的拟人意象。“细拉”使用通行音译并置于括号中，呈现诗歌或礼仪标记。
