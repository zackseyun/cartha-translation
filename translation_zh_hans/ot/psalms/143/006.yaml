  to: 我向你伸开双手；我的心灵如疲乏的土地，渴慕你。细拉
  rationale: 修订保留伸手祈求的动作、“心灵”的内在主体含义及“疲乏土地”的不寻常原文意象；同时以自然的中文诗句表达土地比喻所暗示的渴慕。脚注明确区分字面词义、诗歌省略和解释性译法，避免把有争议或开放的句法关系定为单一含义。
