    rationale: “我的心灵渴想你，如疲乏的土地”在现代汉语中容易读成不完整的附加比较；调整为“我的心灵如疲乏的土地，渴慕你”可使土地比喻与对上帝的渴望形成清晰对应。
  - severity: low
