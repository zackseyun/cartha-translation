review_pass:
  verdict: revise
  source_fidelity: 草稿将原文末尾省略而语义关系开放的 לְךָ 明确处理为“渴想你”，在诗篇语境中可以成立，但正文的“我的心灵渴想你，如疲乏的土地”使比较结构略显悬置，也比原文更明确地补出了动词。采用“如疲乏的土地，渴慕你”可在自然汉语中表达该省略关系，同时保留“疲乏”的词汇意象。
  naturalness: “我向你伸开双手”自然庄重。“我的心灵如疲乏的土地，渴慕你”比原有逗号结构更顺畅，且适合祷告诗歌的凝练语体。“细拉”不必置于括号内；作为诗歌／礼仪标记独立呈现更符合中文圣经惯例。
  terminology: “心灵”可恰当承载 נַפְשִׁי 在此处的内在生命、情感主体含义。“疲乏的土地”保留 עֲיֵפָה 的字面而不把它直接定为“干渴”。“渴慕”是对末尾 לְךָ 与比喻所暗示关系的自然诗性表达，不应说成唯一的直译；脚注须准确说明这一点。
