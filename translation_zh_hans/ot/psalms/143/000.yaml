  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֤ה שְׁמַ֬ע תְּפִלָּתִ֗/י הַאֲזִ֥ינָ/ה אֶל תַּחֲנוּנַ֑/י בֶּ/אֱמֻנָתְ/ךָ֥ עֲ֝נֵ֗/נִי בְּ/צִדְקָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/000.yaml
  text: A psalm of David. O LORD, hear my prayer; give ear to my pleas for mercy! In your faithfulness answer me, in your righteousness!
translation:
  language: zh_hans
  text: 大卫的诗。耶和华啊，求你听我的祷告，侧耳听我的恳求[a]！求你凭你的信实[b]回应我，凭你的公义[c]回应我！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我求怜悯的呼声”。
    reason: lexical_alternative
  - marker: b
    text: 或译“在你的信实中”或“按你的信实”；希伯来文也可理解为诗人以上帝的信实为求回应的根据。
    reason: lexical_alternative
  - marker: c
    text: 或译“凭你的公正”“在你的公义中”或“按你的公义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: 大卫的诗
  rationale: מִזְמוֹר指配乐吟唱的诗歌；לְדָוִד可表示归于、属于或关于大卫。正文采用传统而自然的简洁表达，不进一步限定其关系。
- source_word: הַאֲזִינָה
  choice: 侧耳听
  rationale: 该动词不只是一般的“听”，还带有留心倾听之意；“侧耳听”保留诗歌的恳切语气。
- source_word: תַּחֲנוּנַי
  choice: 我的恳求
  rationale: 该词表示恳求恩惠、怜悯的呼求；“恳求”自然简洁，同时脚注补充“求怜悯的呼求”。
- source_word: בֶּאֱמֻנָתְךָ
  choice: 凭你的信实
  rationale: אֱמוּנָה在此指上帝可靠、信实的品格；介词ב可表达范围、根据或凭借，正文采用自然的“凭”，脚注保留其他理解。
- source_word: בְּצִדְקָתֶךָ
  choice: 凭你的公义
  rationale: צְדָקָה在此可涵盖公义、正直和公正；“公义”保留其广阔的神学与伦理含义，脚注说明“公正”的可能译法。
- source_word: עֲנֵנִי
  choice: 回应我
  rationale: 在祷告语境中意为对祈求作出答复；“回应我”比单纯“回答我”更自然，也不预设回应的具体方式。
theological_decisions:
- issue: 诗人凭上帝的信实和公义求回应
  choice: 凭你的信实……凭你的公义
  alternative: 在你的信实中……在你的公义中；按你的信实……按你的公义
  rationale: 希伯来介词ב允许范围、准则或根据等理解。正文把祈求表达为以上帝自身的信实和公义为根据，但脚注明确保留其他语法可能，未把“公义”缩减为惩罚性司法。
- issue: לְדָוִד所表达的大卫关系
  choice: 大卫的诗
  alternative: 献给大卫的诗；关于大卫的诗
  rationale: 希伯来文标题本身并未明确区分作者、所属、献予或相关关系；沿用简洁传统表达，避免在正文中强行消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“耶和华”对应神名יהוה；两个祈使表达保留原文的急切感。末句重复“回应我”，虽原文动词只出现一次，却使中文中两个并列介词短语的共同支配关系清楚，并保留诗句的强调。
