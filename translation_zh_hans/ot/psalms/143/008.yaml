language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַשְׁמִ֘יעֵ֤/נִי בַ/בֹּ֨קֶר חַסְדֶּ/ךָ֮ כִּֽי בְ/ךָ֪ בָ֫טָ֥חְתִּי הוֹדִיעֵ֗/נִי דֶּֽרֶךְ ז֥וּ אֵלֵ֑ךְ כִּֽי אֵ֝לֶי/ךָ נָשָׂ֥אתִי נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/008.yaml
  text: Let me hear your steadfast love in the morning[a], for in you I trust. Make known to me the way I should go[c][b], for to you I lift up my soul.
translation:
  language: zh_hans
  text: '求你使我在清晨听见你坚定不变的慈爱[a]，


    因为我倚靠你。


    求你使我知道当走的路[b]，


    因为我向你举起我的心[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“求你让我在清晨听见你坚定不变的慈爱”。“使我听见”较直接反映原文的使役式表达。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“求你使我知道我要走的路”；原文直译为“我将走的路”。
    reason: lexical_alternative
  - marker: c
    text: “向你举起我的心”是希伯来语的表达，可指把自己交托给上帝，或使整个内在生命转向他；此处“心”承载原文所指整个人及其内在生命的诗性含义。
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁמִיעֵנִי
  choice: 求你使我……听见
  rationale: 这是“听”的使役式祈使语气，直译为“使我听见”。加上“求你”符合汉语祷告语体，也保留了恳求的力量。
- source_word: בַבֹּקֶר
  choice: 在清晨
  rationale: 该时间短语自然表示事情发生的时间。“在清晨”保留单数形式，不额外引申为“每天清晨”或“清晨以前”。
- source_word: חַסְדֶּךָ
  choice: 你坚定的爱
  rationale: חסד兼含慈爱、忠诚与持久不变之意。“坚定的爱”以现代汉语传达这种忠贞可靠的爱，又不把词义限定为“怜悯”或明说原文未明说的“圣约”。
- source_word: כִּי
  choice: 因为
  rationale: 两处כִּי都为前面的请求提供理由；“因为”在现代汉语中清楚自然。
- source_word: בְךָ בָטָחְתִּי
  choice: 我倚靠你
  rationale: 完成式在这里表达已经确立并持续至今的信赖。“倚靠”兼有信任和依赖之意，适合诗篇祷告的语境。
- source_word: הוֹדִיעֵנִי
  choice: 求你使我知道
  rationale: 这是“知道”的使役式，基本意思是“使我知道”。此译法比“教导我”更贴近原词，同时在汉语中清楚可懂。
- source_word: דֶּרֶךְ זוּ אֵלֵךְ
  choice: 当走的路
  rationale: 字面可译为“我要走的路”。上下文是祈求引导，因此“当走的路”自然表达所求的方向，但以脚注保留原文形式及其可能的语气空间。
- source_word: נָשָׂאתִי נַפְשִׁי
  choice: 我向你举起我的心灵
  rationale: 保留希伯来语“举起”内在生命的诗性隐喻，不将其缩减为单一解释，如“我祷告”或“我把自己交托给你”。“心灵”在现代汉语中比“魂”自然，也能指向人的整个内在生命。
theological_decisions:
- issue: חסד在对上帝祷告中的译法
  choice: 你坚定的爱
  alternative: 你的慈爱；你信实的爱；你的圣约之爱
  rationale: 原词指向上帝忠贞、可靠而持久的爱。“坚定的爱”保存其忠诚与情爱的双重内涵，同时不把隐含的圣约背景明说成正文。
- issue: נָשָׂאתִי נַפְשִׁי的诗性隐喻
  choice: 因为我向你举起我的心灵
  alternative: 因为我把自己交托给你；因为我的心仰望你
  rationale: 正文保留“举起”的原有意象及其开放性，使它可以表达交托、渴慕、仰望和全心转向上帝，而不武断地只取其中一种含义。
- issue: דֶּרֶךְ זוּ אֵלֵךְ中的方向与义务语气
  choice: 当走的路
  alternative: 我要走的路；我将走的路
  rationale: 在求引导的语境中，“当走”是自然的汉语表达，但原文形式本身也容许较直接的“我要走”；脚注保留这一差异，避免把语气问题完全封闭。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。四行结构保留希伯来诗歌中“请求—理由—请求—理由”的平行推进；用“求你”明确汉语祈求语气，用“心灵”保存נפש的诗性范围而避免生硬的“魂”。
