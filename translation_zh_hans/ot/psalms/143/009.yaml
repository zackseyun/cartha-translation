  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י יְהוָ֗ה אֵלֶ֥י/ךָ כִסִּֽתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/009.yaml
  text: Deliver me from my enemies[a], O Yahweh; in you I have taken refuge.
translation:
  language: zh_hans
  text: 耶和华啊，求你救我脱离我的仇敌；我投靠你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我向你隐藏自己”或“我在你那里寻求庇护。”原文此处的表达字面上带有“隐藏”的意象，在语境中指向投靠上帝、寻求保护。
    reason: 保留希伯来语表达的字面意象，同时说明其在本节中的自然语境义。
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: 求你救我
  rationale: 这是 נצל 的使役主动式命令式，带第一人称单数宾语后缀，表达直接而迫切的求救；“求你救我”符合现代汉语祷告语体。
- source_word: מֵאֹיְבַי
  choice: 脱离仇敌
  rationale: 介词 מִן 表示脱离，复数名词 אֹיֵב 带第一人称单数后缀，直译为“我的仇敌”；汉语在语境中省略“我的”仍清楚自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式音译四字神名，保留其作为名字而非称号的性质。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 保留介词 אֶל 的方向性，并与后面的“藏身”共同表达投奔上帝寻求庇护。
- source_word: כִסִּתִי
  choice: 藏身
  rationale: 该词源于 כסה，基本意象是遮盖、隐藏；此处可表达向上帝寻求庇护。正文保留“藏身”的源语隐喻，脚注说明其语境含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是四字神名的音译形式；采用现代简体中文圣经传统中更通行、普通读者更易识别的“耶和华”，且不以“主”这一称号替代原文专名。
- issue: 末句是否明确解释为“投靠”
  choice: 我向你藏身
  alternative: 我投靠你／我在你里面避难
  rationale: 原文 כסה 的具体句法和语义较少见，既有“隐藏自己”的字面意象，也在本语境中指向寻求庇护。正文保留隐喻和一定歧义，脚注交代通常理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华啊，求你……”符合诗篇祷告语体；分号对应两个紧密相关的祈求与信靠陈述。正文将“向你”前置，尽量保存原文末句的次序和强调。
