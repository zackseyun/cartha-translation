  yaml_path: translation/ot/psalms/143/004.yaml
  text: And my spirit grows faint within me[a]; my heart is appalled within me.
translation:
  language: zh_hans
  text: 我的灵在我里面衰微[a]；我的心在我里面惊骇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的灵在我里面不堪重负；我的心在我里面凄凉。”
    reason: 词语עטף与שמם在本节可分别强调不堪重负和内在的凄凉、荒凉；脚注保留这一可能的语义组合。
lexical_decisions:
- source_word: וַתִּתְעַטֵּף
  choice: 衰微
  rationale: עטף的Hitpael形式在哀歌语境中可指昏沉、衰弱或被压倒。“衰微”自然表达诗人内在生命逐渐软弱，也保留原词的诗性和语义幅度。
- source_word: עָלַי
  choice: 在我里面
  rationale: 该介词字面为“在我之上”，但与人的内在状态连用时，中文译作“在我里面”更自然，并与下句בְּתוֹכִי形成清楚的诗行平行。
- source_word: רוּחִי
  choice: 我的灵
  rationale: 此处指诗人的内在生命或精神，不单指气息，也没有特指圣灵；“我的灵”保留其人论与诗歌色彩。
- source_word: בְּתוֹכִי
  choice: 在我里面
  rationale: 该短语明确表示人的内部；“在我里面”庄重自然，并强化两行共同的内在视角。
- source_word: יִשְׁתּוֹמֵם
  choice: 惊惶
  rationale: שמם在此形式下可表达惊骇、呆然或荒凉无助的状态。“惊惶”适合描写内心遭受打击后的震骇，同时不把含义收窄为外在荒凉。
- source_word: לִבִּי
  choice: 我的心
  rationale: לֵב指人的思想、意志与情感中心；“我的心”是现代中文中准确而有诗意的对应，也与“我的灵”相称。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两小句重复“在我里面”，保留希伯来诗歌的内在聚焦和平行结构；正文选择“衰微／惊惶”，脚注保留“被压倒／一片荒凉”的词义可能。
