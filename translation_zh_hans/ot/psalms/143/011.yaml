id: PSA.143.11
reference: Psalms 143:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֣ יְהוָ֣ה תְּחַיֵּ֑/נִי בְּ/צִדְקָתְ/ךָ֓ תוֹצִ֖יא מִ/צָּרָ֣ה נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/011.yaml
  text: For the sake of your name[a], O Yahweh, preserve my life[d][c][b]; in your righteousness bring my soul out of distress.
translation:
  language: zh_hans
  text: 耶和华啊，求你为了自己的名使我存活[a]；求你凭你的公义[b]，救我[c]脱离患难。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我存活”也可译作“保全我的性命”或“使我复苏”。原文动词可指使人活着、保全生命或恢复生命与力量。
    reason: lexical_alternative
  - marker: b
    text: “凭你的公义”也可译作“在你的公义中”或“凭你的正义”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“把我的性命从患难中带出来”；“我的性命”是希伯来语表达，也可指“我本人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  choice: 为了自己的名
  rationale: 保留希伯来语“为你名的缘故”这一圣经惯用语，表达诗人诉诸上帝所启示的名、声誉与尊荣；“为了自己的名”符合现代汉语祷告语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中通行的专名“耶和华”译出四字神名，而不以称号替代。
- source_word: תְּחַיֵּנִי
  choice: 使我存活
  rationale: חיה 的 Piel 形可表示使活、保全生命或使复苏。上下文是危难中的求救，“使我存活”既保留使役形式，也不把语义限定为复活或单纯恢复精神。
- source_word: בְּצִדְקָתְךָ
  choice: 凭你的公义
  rationale: 介词 בְּ־在此可作方式或凭据解；“凭”自然表达诗人以上帝的公义为拯救依据，同时保留“在你的公义中”的可能性于脚注。
- source_word: תוֹצִיא
  choice: 救我……脱离
  rationale: יצא 的 Hiphil 字面为“使……出来、带出”。中文“救我脱离”自然传达从患难中带出的意象；脚注保留较直译的表达。
- source_word: מִצָּרָה
  choice: 脱离患难
  rationale: צָרָה可指困苦、危难、患难；“患难”符合诗篇哀歌语域，也适合与“脱离”搭配。
- source_word: נַפְשִׁי
  choice: 我
  rationale: נֶפֶשׁ在此按希伯来语习惯指整个人或生命，并非专指与身体相分的“灵魂”。现代汉语主文译作“我”最自然，字面与“我的性命”的可能性在脚注说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。主文采用现代简体中文读者最熟悉、且作为专名使用的“耶和华”；“雅威”是较接近学界拟音的可行替代。
- issue: צְדָקָה 在本节的含义
  choice: 公义
  alternative: 正义
  rationale: 这里所求的拯救以神的正直与信实为依据。“公义”保留该词在诗篇中的神学与伦理张力，不把它窄化为司法意义的“正义”。
- issue: נַפְשִׁי 的人观表达
  choice: 我
  alternative: 我的性命／我的心灵
  rationale: 此处 נֶפֶשׁ可指诗人本人或其生命。译作“我”避免让现代读者误以为作者只求内在灵魂获救，同时以脚注保存原文表达。
translation_notes:
  register: 采用现代、庄重而自然的祷告语体。保留“名”“公义”等核心圣经意象；对 תְּחַיֵּנִי 与 נַפְשִׁי 的多义性不在主文中过度解释，而以脚注呈现。中文语序将呼语置于句首，并用两个“求你”呈现平行祈求。
