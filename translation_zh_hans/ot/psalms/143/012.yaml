  text: וּֽ/בְ/חַסְדְּ/ךָ֮ תַּצְמִ֪ית אֹ֫יְבָ֥/י וְֽ֭/הַאֲבַדְתָּ כָּל צֹרֲרֵ֣י נַפְשִׁ֑/י כִּ֝֗י אֲנִ֣י עַבְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/012.yaml
  text: And in your steadfast love you will cut off my enemies[a], and you will destroy all the adversaries of my soul[b], for I am your servant.
translation:
  language: zh_hans
  text: 因着你的慈爱[a]，你必剪除我的仇敌；你必消灭一切与我为敌的人[b]，因为我是你的仆人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“凭着你的慈爱”；希伯来语介词既可表示行动的依据，也可表示所凭借的方式。
    reason: lexical_alternative
  - marker: b
    text: 这里“我”所对应的原文直译为“我的灵魂”；也可指“我的生命”或“我本人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחַסְדְּךָ
  choice: 因着你的慈爱
  rationale: חֶסֶד兼有坚定不移的爱、忠诚和怜悯之意；“慈爱”在现代中文诗歌体中自然庄重，也保留其关系性与情感力度。前缀בְּ在这里可表示行动的依据或凭借，正文采用“因着”，并以脚注保留工具性理解。
- source_word: תַּצְמִית
  choice: 你必剪除
  rationale: צמת的使役式表示使之止息、除灭。“剪除”保留强烈的审判含义，并与下句的“消灭”形成希伯来文同义平行中的用词变化。
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: 直接对应复数名词及第一人称单数词尾，符合诗篇庄重语体。
- source_word: וְהַאֲבַדְתָּ
  choice: 你必消灭
  rationale: אבד的使役式意为使灭亡、消灭；此处不弱化为“击败”，以保留原文强度。
- source_word: כָּל
  choice: 一切
  rationale: 准确表达此处的全称范围，并适合中文诗歌体。
- source_word: צֹרֲרֵי נַפְשִׁי
  choice: 一切迫害我的人
  rationale: צרר表示敌对、逼迫或压迫；נַפְשִׁי在此可指“我的生命”或“我本人”。“迫害我的人”在中文中自然地表达整个短语，同时由脚注保留נֶפֶשׁ的字面意象和语义范围。
- source_word: כִּי
  choice: 因为
  rationale: 引出诗人如此祈求或确信的理由，现代中文清楚自然。
- source_word: עַבְדֶּךָ
  choice: 你的仆人
  rationale: 在向上帝祷告的诗篇语境中，“仆人”准确表达谦卑归属与服事，不额外引入社会制度层面的含义。
theological_decisions:
- issue: 针对仇敌的咒诅性语言
  choice: 保留“剪除”和“消灭”的直接、强烈措辞
  alternative: 弱化为“击败”“制止”或“使沉默”
  rationale: 两个希伯来动词都带有严厉的除灭含义。译文不因现代读者可能感到不适而淡化诗人求上帝施行审判的祷告，以保留其盟约处境和神学张力。
- issue: 动词语气：确信陈述或祈愿
  choice: 译作“你必……你必……”，保留诗人对上帝行动的确信
  alternative: 译作“求你……”或“愿你……”以明确表达祈求
  rationale: תַּצְמִית的形式可在语境中带祈愿色彩，而וְהַאֲבַדְתָּ承接其意义；但该形式也容许未来或确信性陈述。正文不额外添加原文没有的祈求词，并让诗篇上下文传达其祷告性质。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“慈爱”“剪除”“仆人”保留诗篇的敬虔格调，但句法保持现代汉语的清晰自然；分号呈现两行同义平行。
