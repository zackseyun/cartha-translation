source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֤ה שְׁמַ֬ע תְּפִלָּתִ֗/י הַאֲזִ֥ינָ/ה אֶל תַּחֲנוּנַ֑/י בֶּ/אֱמֻנָתְ/ךָ֥ עֲ֝נֵ֗/נִי בְּ/צִדְקָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/001.yaml
  text: A psalm of David[a]. O Yahweh, hear my prayer; give ear to my pleas for mercy. In your faithfulness answer me[c][b], in your righteousness.
translation:
  language: zh_hans
  text: '大卫的诗[a]。


    雅威啊，求你听我的祷告，

    侧耳听我的恳求；

    求你凭你的信实[b]、

    按你的公义[c]回答我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的”也可理解为“由大卫所作”“关于大卫”或“献给大卫”。
    reason: 希伯来文标题中的介词 לְ 可表示作者、关联、归属或献予对象。
  - marker: b
    text: “凭你的信实”也可译作“在你的信实中”或“因你的信实”。
    reason: 介词 בְ 在此可表示范围、方式或根据。
  - marker: c
    text: “按你的公义”也可译作“凭你的公义”或“按你的公正”。
    reason: 介词 בְ 的功能有一定弹性，而 צְדָקָה 可涵盖公义与公正。
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中的常用体裁名称；中文以“诗”简洁、自然地表达其诗歌性质。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 标题中的介词 לְ 可表示作者、归属、关联或献给某人；“大卫的”不把含义过早限定为“由大卫所作”或“献给大卫”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，而不以称号替代；“雅威”是现代汉语中通行且清楚的音译。
- source_word: שְׁמַע תְּפִלָּתִי
  choice: 听我的祷告
  rationale: 直译命令式动词和带第一人称后缀的单数名词，符合汉语祷告语体。
- source_word: הַאֲזִינָה אֶל תַּחֲנוּנַי
  choice: 侧耳听我的恳求
  rationale: “侧耳听”保留与前句“听”构成的诗歌平行，并表达专心垂听；“恳求”体现为蒙恩而发出的迫切请求。
- source_word: בֶּאֱמֻנָתְךָ
  choice: 凭你的信实
  rationale: אֱמוּנָה 在此指可靠、忠信；“凭”自然表达 בְ 可有的根据或依凭含义，同时以脚注保留其他理解。
- source_word: עֲנֵנִי
  choice: 回答我
  rationale: 准确表达祷告语境中“回应我”的请求，不额外加入“有利地”等原文未明说的内容。
- source_word: בְּצִדְקָתֶךָ
  choice: 按你的公义
  rationale: צְדָקָה 可指公义、正直或公正；正文采用较宽广且传统的“公义”，脚注保留“公正”等可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名；正文采用较贴近通常学术重构读音 Yahweh 的现代汉语音译“雅威”，而不以“主”等称号取代。
- issue: 诗人诉诸神的信实与公义时，介词 בְ 的功能
  choice: 分别译作“凭”和“按”，表达回答所依据的神的品格
  alternative: “在你的信实中……在你的公义中”，或理解为施行回答的方式
  rationale: 希伯来介词可表示范围、方式或根据。上下文是向神的品格发出呼求；正文采用自然汉语，却用脚注保留介词关系的开放性。
- issue: צְדָקָה 的意义范围
  choice: 公义
  alternative: 公正
  rationale: 此词既可强调神正直、公义的品格，也可突出公平审断；正文不将其缩窄为司法意义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言，并以分行保留希伯来诗歌的平行结构。“侧耳听”略具诗意，但在现代汉语中仍清楚自然。所有脚注标记均置于正文对应词语之后。
