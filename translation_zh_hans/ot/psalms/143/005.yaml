  text: זָ֘כַ֤רְתִּי יָמִ֨ים מִ/קֶּ֗דֶם הָגִ֥יתִי בְ/כָל פָּעֳלֶ֑/ךָ בְּֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ אֲשׂוֹחֵֽחַ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/005.yaml
  text: I remember the days of old[a]; I meditate on all your work[b]; I muse on the work of your hands.
translation:
  language: zh_hans
  text: 我追想古时的日子[a]，思想你一切的作为，默想你双手的作为[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我曾追想古时的日子。”希伯来语的完成式在这里既可按过去的回想来理解，也可在诗歌中表达诗人此刻的追忆。
    reason: lexical_alternative
  - marker: b
    text: “默想”也可译为“谈论”或“述说”。本句原文动词兼有思想和说出的含义；本节的平行结构较支持内在默想。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְתִּי
  choice: 我追想
  rationale: 该词是 זכר 的 Qal 完成式第一人称单数，可指过去曾回想，也可在诗歌语境中表达当下追忆。“追想”自然体现主动回顾往昔，又不必在正文中强行标明时体。
- source_word: יָמִים מִקֶּדֶם
  choice: 古时的日子
  rationale: 该短语指从前或久远的岁月。“古时的日子”简洁庄重，也保留原文“日子”的具体表达。
- source_word: הָגִיתִי
  choice: 思想
  rationale: הגה 在此表示沉思、揣摩。译作“思想”符合其内在反思之意，并与末句的“默想”形成有区别的诗歌平行。
- source_word: בְּכָל פָּעֳלֶךָ
  choice: 你一切的作为
  rationale: פֹּעַל 可指工作、行动或作为；“一切的作为”自然表达其集合意义，并涵盖上帝所行的一切。
- source_word: בְּמַעֲשֵׂה יָדֶיךָ
  choice: 你双手所做的工
  rationale: 此译保留“手”的具体拟人意象，也自然表达上帝所创造或成就之事，不将原文预先限定为某一类工作。
- source_word: אֲשׂוֹחֵחַ
  choice: 我默想
  rationale: שׂיח 可表示沉思，也可表示谈论、述说。此处与前句 הגה 平行，且介词结构引出默想的对象，语境较支持内在反思；“默想”同时保持与“思想”的细微区别。
theological_decisions:
- issue: “你双手所做的工”具体指创造还是历史中的作为
  choice: 保留概括性表达，不限定所指
  alternative: 明确译为“你的创造”或“你所行的神迹”
  rationale: 原文只说“你双手的工作”，可涵盖创造与上帝在历史中的作为；上下文没有要求将其缩窄为某一项神学类别。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。三个分句保持递进的平行结构；“追想—思想—默想”传达原文三个不同动词，同时不以生硬措辞夸大它们之间的差异。
