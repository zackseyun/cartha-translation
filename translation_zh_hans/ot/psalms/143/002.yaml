  naturalness: “不要审判你的仆人”自然庄重。“凡活着的都不算为义”虽可理解，但“凡活着的”后省略中心词略显文言，且“算为义”带有不必要的术语色彩。改作“没有一个活着的人是义的”更自然清楚。
  terminology: “仆人”适合诗篇向上帝祷告的庄重语域。“义的”忠实保留原文可同时具有道德与法庭上的“在理／得称为义”张力；脚注说明“称义／被判为义”的司法可能性，避免把该张力消解或教义化。
