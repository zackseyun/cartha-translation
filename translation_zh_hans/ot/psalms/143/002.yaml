  text: וְ/אַל תָּב֣וֹא בְ֭/מִשְׁפָּט אֶת עַבְדֶּ֑/ךָ כִּ֤י לֹֽא יִצְדַּ֖ק לְ/פָנֶ֣י/ךָ כָל חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/002.yaml
  text: And do not enter into judgment with your servant[a], for no living one is righteous before you.
translation:
  language: zh_hans
  text: '不要审判你的仆人；

    因为在你面前，没有一个活着的人是义的[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为在你面前，没有一个活着的人能称义”或“能被判为义。”
    reason: יִצְדַּק 在本节的司法语境中可指“是义的／在理”，也可带有“被判为义、得称义”的法庭含义。
lexical_decisions:
- source_word: וְ/אַל
  choice: 不要
  rationale: 承接上一节的祈求；汉语中直接用“不要”自然流畅，无须机械译出连接词。
- source_word: תָּב֣וֹא בְ֭/מִשְׁפָּט אֶת עַבְדֶּ֑/ךָ
  choice: 不要审判你的仆人
  rationale: 原文是进入司法审理的习语。现代汉语用“审判”简明保留法庭语境；“仆人”符合诗篇祷告的庄重语域。
- source_word: כִּ֤י
  choice: 因为
  rationale: 明确引出诗人提出这项祈求的理由。
- source_word: לֹֽא יִצְדַּ֖ק
  choice: 都不算为义
  rationale: צדק 的 Qal 在本节司法语境中兼有“是义的”和“被判定为义”的意味；“算为义”保留判定色彩，又不限定为某一后期教义表述。
- source_word: לְ/פָנֶ֣י/ךָ
  choice: 在你面前
  rationale: 自然保留人在上帝临在和评判之下的表达。
- source_word: כָל חָֽי
  choice: 凡活着的
  rationale: 原文直译为“每一个活着的”，受否定词支配而构成全称否定；此译保留其诗性概括和较宽泛的措辞。
theological_decisions:
- issue: יִצְדַּק 在上帝审判中的司法与道德含义
  choice: 凡活着的都不算为义
  alternative: 没有一个活人在你面前是义人
  rationale: 本节同时呈现法庭图景与普遍的人类不义。“不算为义”保留司法判定的力度，但不将经文收窄为某种特定的系统神学公式；脚注保留偏向道德状态的译法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。分行体现祈求与理由的平行关系；避免生硬的“进入审判”，正文用自然汉语表达，脚注保留更显明的法庭意象。
