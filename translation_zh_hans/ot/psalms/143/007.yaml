id: PSA.143.7
reference: Psalms 143:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַ֘הֵ֤ר עֲנֵ֨/נִי יְהוָה֮ כָּלְתָ֪ה ר֫וּחִ֥/י אַל תַּסְתֵּ֣ר פָּנֶ֣י/ךָ מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם יֹ֥רְדֵי בֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/007.yaml
  text: Answer me quickly[a], O Yahweh; my spirit fails. Do not hide your face from me, or I will become like those who go down to the pit.
translation:
  language: zh_hans
  text: 雅威啊，求你快快应允我！我的灵已经衰竭。不要向我掩面，否则我就会像那些下到深坑[a]的人一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坟墓”。希伯来文“深坑”在这里是死亡的诗性意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: 快快
  rationale: 此处作催促语，修饰“应允我”，传达诗人请求立即得到回应的迫切感；“快快”自然且保留祈祷诗的语气。
- source_word: עֲנֵנִי
  choice: 应允我
  rationale: ענה在祈求语境中指回应恳求；“应允我”比单纯“回答我”更符合现代汉语祷告语体，同时未加入必然照所求成就的意思。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: כָּלְתָה רוּחִי
  choice: 我的灵已经衰竭
  rationale: כלה表示耗尽、衰竭；רוּחַ可指灵、气息或内在生命力。“灵”保留原词的语义宽度，“已经衰竭”表现诗人濒临崩溃的状态。
- source_word: אַל תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  choice: 不要向我掩面
  rationale: 保留希伯来语“掩面”的诗性意象；它可表达撤回临在、眷顾或帮助，而不在正文中将含义缩窄。
- source_word: וְנִמְשַׁלְתִּי
  choice: 否则我就会像……一样
  rationale: 此处Nifal形式表示被比作或变得相像；在前面的否定祈求之后，“否则”自然呈现其后果关系。
- source_word: יֹרְדֵי בוֹר
  choice: 那些下到深坑的人
  rationale: 保留“下去”与“坑”的死亡意象。“深坑”在汉语中比单说“坑”更能自然传达通往死亡领域的诗性画面，同时不直接解释为坟墓或阴间。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用音译“雅威”，以保留专名性质，不用“主”这一称号替换；“耶和华”是传统形式，但较不贴近通常重建的读音。
- issue: “深坑”的所指
  choice: 在正文保留死亡的“深坑”意象
  alternative: 坟墓；阴间
  rationale: בּוֹר在这里唤起死亡及死者领域，却未明确界定死后状态。保留意象可避免把诗句限定为实体坟墓或特定的中间状态观。
- issue: רוּחִי的语义范围
  choice: 我的灵
  alternative: 我的气息；我的心神
  rationale: 原词可涵盖气息、生命力和内在之灵。“灵”最能保留这种神学与诗性张力；“气息”可能过度强调濒死的生理状态，“心神”则偏向心理解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗语体。“快快应允我”表达急迫感；“掩面”和“下到深坑”保留原诗的核心意象。脚注标记置于其实际说明的“深坑”之后。
