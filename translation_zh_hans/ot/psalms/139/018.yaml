  text: אֶ֭סְפְּרֵ/ם מֵ/ח֣וֹל יִרְבּ֑וּ/ן הֱ֝קִיצֹ֗תִי וְ/עוֹדִ֥/י עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/018.yaml
  text: If I were to count them[a], they would be more than the sand. When I awake[b], I am still with you.
translation:
  language: zh_hans
  text: 我若数点它们[a]，它们比沙粒还多。我醒来[b]，仍与你同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我若数点它们，它们多过沙粒。”希伯来文十分简练，汉语句式可略有不同。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“我醒了，仍与你同在。”希伯来文没有明确说明这是惯常的醒来、一次已经发生的醒来，还是比喻性的醒来。
    reason: alternative_reading
lexical_decisions:
- source_word: אֶסְפְּרֵם
  choice: 我若数点它们
  rationale: 该词是ספר的Qal未完成式第一人称单数，带第三人称阳性复数后缀，直译为“我数它们”。结合下一分句，在汉语中用“若”自然表达假设性的数算，同时保留“它们”与上文“你的意念”的照应。
- source_word: מֵחוֹל
  choice: 比沙粒
  rationale: חוֹל意为“沙”，前置词מ־在此表达比较。译作“比沙粒”符合现代汉语习惯，也清楚传达数量比较。
- source_word: יִרְבּוּן
  choice: 还多
  rationale: 源自רבה，表示“众多、增多”。在比较结构中译作“还多”，与“比沙粒”连用，表达其数量超过沙粒。
- source_word: הֱקִיצֹתִי
  choice: 我醒来
  rationale: 该词表示“醒来”。其形式可理解为已经醒来，也可在诗歌语境中表达醒来之时；“我醒来”在汉语中不强行限定为一次过去事件或惯常经历。
- source_word: וְעוֹדִי
  choice: 仍
  rationale: עוֹד带第一人称单数后缀，表达持续状态，即“我仍然”。汉语以“仍”简洁自然地呈现这一延续意义。
- source_word: עִמָּךְ
  choice: 与你同在
  rationale: עִם加第二人称单数后缀，意为“与你在一起”。“与你同在”庄重自然，并保留关系和临在的含义，不额外规定其具体方式。
theological_decisions:
- issue: “它们”的所指
  choice: 保留代词“它们”，由上文自然指向上帝的意念。
  alternative: 直接译作“你的意念”，或广义理解为上帝奇妙的作为和旨意。
  rationale: 第17节是最近的先行语境，因此上帝的意念是最自然的所指；但希伯来文本本节只用代词，正文也保留代词，以免把解释直接写入译文。
- issue: 末句“醒来”的含义
  choice: 表达诗人醒来时仍与上帝同在，而不明确限定其时间或象征意义。
  alternative: 可指沉思后从睡眠中醒来；也有人理解为带有死后醒来的遥远回响。
  rationale: 经文本身明确表达醒来后仍与上帝同在，却没有明确说明这是惯常醒来、一次已经发生的醒来，还是比喻性的醒来，因此译文和脚注保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“数点”比口语化的“数一数”更符合诗篇语体；“仍与你同在”简洁保留原文的持续感。所有脚注标记均已置于正文相应位置。
