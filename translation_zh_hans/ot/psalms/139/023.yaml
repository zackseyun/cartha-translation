  yaml_path: translation/ot/psalms/139/023.yaml
  text: Search me[a], God, and know my heart; test me and know my anxious thoughts.
translation:
  language: zh_hans
  text: 上帝啊，求你鉴察我，了解我的心；试验我，了解我焦虑的思绪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “焦虑的思绪”或译“纷乱的意念”，或“分裂的心思”。
    reason: שַׂרְעַפָּי的语义可涵盖焦虑不安、纷乱或内在分歧的思想，正文采用其中最合语境且最自然的一种表达，脚注保留其他可能。
lexical_decisions:
- source_word: חָקְרֵנִי
  choice: 鉴察我
  rationale: חקר表示深入搜寻、彻底察看。“鉴察我”在现代汉语中庄重自然，适合向上帝祈求，并保留深入省察的含义。
- source_word: אֵל
  choice: 上帝啊
  rationale: אֵל在此是对上帝的直接呼告。“上帝啊”明确表达呼格语气，也符合现代汉语诗歌和祷告语体。
- source_word: וְדַע
  choice: 了解
  rationale: ידע在两个祈使结构中都表示完全知晓、洞悉。两处均译作“了解”，保留原文的重复和平行结构，同时避免把请求误解为上帝原先不知情。
- source_word: לְבָבִי
  choice: 我的心
  rationale: לֵבָב涵盖思想、意志和内在生命。“我的心”是简洁且传统的对应语，也保留其宽广含义。
- source_word: בְּחָנֵנִי
  choice: 试验我
  rationale: בחן指检验、察验，常带有如检验金属般辨明真伪的意味。“试验我”保留其评估性质，并与前句“鉴察我”有所区别。
- source_word: שַׂרְעַפָּי
  choice: 我焦虑的思绪
  rationale: שַׂרְעַפִּים在诗歌中可指令人不安、纷乱或分裂的思绪。“焦虑的思绪”自然清楚，并由脚注保留其他真实的词义可能。
theological_decisions:
- issue: 描述内在生命的平行用语
  choice: 分别保留“我的心”和“我焦虑的思绪”
  alternative: 将两者合并译成“我的内心”或改作“我的心思意念”
  rationale: 原文用两个不同词语构成平行句。分别翻译可保存诗意层次，也避免以单一现代心理学术语缩减希伯来文对内在生命的表达。
- issue: 祈求上帝“了解”诗人的含义
  choice: 保留祈使语气，不加解释性措辞
  alternative: 意译为“求你显明”或“求你使我知道”
  rationale: 原文直接祈求上帝鉴察、试验并知晓诗人的内在状况。译文不将其改写为另一种神学命题，以保留原文祷告中的张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体；以分号保存希伯来诗歌的两行平行结构，并重复“了解”以呈现原文修辞。脚注标记已置于正文对应词语之后。
