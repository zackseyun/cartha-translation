  text: לֹא נִכְחַ֥ד עָצְמִ֗/י מִ֫מֶּ֥/ךָּ אֲשֶׁר עֻשֵּׂ֥יתִי בַ/סֵּ֑תֶר רֻ֝קַּ֗מְתִּי בְּֽ/תַחְתִּיּ֥וֹת אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/015.yaml
  text: My frame was not hidden from you when I was made in secret[b][a], woven in the depths of the earth.
translation:
  language: zh_hans
  text: '我的形体并没有向你隐藏；

    我在隐秘处被造，

    在地的深处被精巧编织[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地的深处”也可译作“地的最低处”。这里很可能以诗意的说法描绘人在隐秘中形成。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְחַד
  choice: 没有……隐藏
  rationale: 保留尼法勒式的被动含义；与מִמֶּךָ连用时，现代汉语以“没有向你隐藏”自然表达未被遮蔽。
- source_word: עָצְמִי
  choice: 我的形体
  rationale: עֶצֶם虽常指“骨头”，此处在胎儿形成的诗意语境中更广泛地指身体的构造或实体；“形体”避免把意义限缩为骨骼。
- source_word: עֻשֵּׂיתִי
  choice: 我……被造
  rationale: 忠实保留עשה被动式的宽泛含义，也与下一分句较具体的纺织意象形成层次。
- source_word: בַסֵּתֶר
  choice: 在隐秘处
  rationale: 表达不可见、隐蔽之处，既自然又与下句“地的深处”构成诗意平行。
- source_word: רֻקַּמְתִּי
  choice: 被精巧编织
  rationale: רקם带有刺绣、交织和精细制作的意象；“精巧编织”保留工艺性的隐喻，又适合现代汉语。
- source_word: בְּתַחְתִּיּוֹת אָרֶץ
  choice: 在地的深处
  rationale: 较为贴近字面，并保留与隐秘形成相关的诗歌意象，不将其明说为子宫或地下世界。
theological_decisions:
- issue: “地的深处”的所指
  choice: 保留诗性空间意象，不在正文中直接解释为母腹
  alternative: 译作“在母腹深处”，或按字面理解为地下最低处
  rationale: 上下文很可能以“地的深处”比喻隐秘而奥妙的胎中形成，但希伯来文本本身保留了“地”的意象。正文不消解这一张力，脚注说明其可能功能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以短行保留希伯来诗歌的平行结构。“精巧编织”传达刺绣般形成身体的意象；正文保留“地的深处”，避免把隐喻直接改写为解释。
