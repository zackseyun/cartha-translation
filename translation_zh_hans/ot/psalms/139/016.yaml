  text: גָּלְמִ֤/י רָ֘א֤וּ עֵינֶ֗י/ךָ וְ/עַֽל סִפְרְ/ךָ֮ כֻּלָּ֪/ם יִכָּ֫תֵ֥בוּ יָמִ֥ים יֻצָּ֑רוּ ו/לא אֶחָ֣ד בָּ/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/016.yaml
  text: Your eyes saw my unformed substance[a], and in your book they all were written—the days that were formed[c][b], when not one of them yet existed.
translation:
  language: zh_hans
  text: 你的眼睛看见了我尚未成形的形体；在你的册上，它们都已被写下——那些被塑造的日子[c][b]，在其中尚无一天存在以前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 本句的希伯来语句法紧缩且较难确定。也可译：“这一切都写在你的册上；日子为我而被塑造。”其中“为我”是按上下文补出的。
    reason: alternative_reading
  - marker: c
    text: “被塑造”也可译“被形成”。有些译本译作“被命定”，但这比希伯来语动词的基本含义解释得更强。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְמִי
  choice: 我尚未成形之身
  rationale: גֹּלֶם指尚未完成、尚未成形之物。译作“我尚未成形之身”，既保留形体尚在形成中的意象，也避免把现代生物学术语直接带入正文。
- source_word: רָאוּ עֵינֶיךָ
  choice: 你的眼睛已经看见
  rationale: 直译希伯来语的主语“你的眼睛”和完成式动词；“已经看见”在汉语中也自然地表达先于后述日子存在的观看。
- source_word: וְעַל סִפְרְךָ
  choice: 写在你的册上
  rationale: עַל字面为“在……上”，与סֵפֶר连用时表达记载于册中；“册”保留具体的书写、记录意象。
- source_word: כֻּלָּם
  choice: 它们全都
  rationale: 保留复数代词及其略显压缩的所指关系，让后置的“那些……日子”说明其最可能的先行内容。
- source_word: יִכָּתֵבוּ
  choice: 写在
  rationale: 该词为כתב的被动式，基本义是“被写下、被记载”。汉语“它们全都写在……”自然表达被动含义，同时保留册上书写的具体图像。
- source_word: יָמִים
  choice: 那些……日子
  rationale: “日子”是前面“它们全都”最可能指向的内容；以破折号后置说明，尽量保留原文紧缩而倒置的诗句结构。
- source_word: יֻצָּרוּ
  choice: 被塑造
  rationale: יצר的基本意象是塑造、形成，如工匠塑形。“被塑造”比“被命定”更贴近词义，并保留其创造性的形象。
- source_word: וְלֹא אֶחָד בָּהֶם
  choice: 那时其中连一天也还不存在
  rationale: 原文是省略式表达，直译近似“其中一个也没有”。结合“日子”，补出“存在”和时间语气，使现代汉语清楚而不改变基本意思。
theological_decisions:
- issue: 是否将יֻצָּרוּ译成带有强烈预定论色彩的“命定”
  choice: 正文采用“被塑造”
  alternative: 被命定
  rationale: 经文呈现上帝预先的看见和记载，但יצר本义是“塑造、形成”，并不专指“命定”。正文保留塑造意象，避免以译词替经文解决更广泛的神学问题。
- issue: “全都”究竟指什么，以及“日子”与前句的句法关系
  choice: 将“日子”作为“它们”的最可能所指，并用破折号后置说明
  alternative: 译作“这一切都写在你的册上；日子为我而被塑造”
  rationale: 希伯来语句法高度紧缩，“全都”最自然地与后面的“日子”相连，但也可把“日子被塑造”理解为较独立的分句。正文采用较可能且连贯的读法，脚注保留另一种切分。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“尚未成形之身”和“册”略带诗体色彩，但仍易于普通读者理解。破折号保留原文的压缩结构，并使“日子”自然说明前面的复数代词。
