lexical_decisions:
- source_word: אֶשָּׂא
  choice: 乘着
  rationale: 该词本义为“举起、带起”；与“晨曦的翅膀”组合时，“乘着”能自然表达借翼远行的诗意，同时保留其假设语气。
- source_word: כַנְפֵי
  choice: 翅膀
  rationale: כָּנָף通常指“翅膀”，也可引申为边缘；这里与“晨曦”构成鲜明的诗歌意象，宜保留这一比喻。
- source_word: שָׁחַר
  choice: 晨曦
  rationale: 指黎明、破晓；“晨曦”在现代汉语中自然且有诗意，适合与“翅膀”搭配。
- source_word: אֶשְׁכְּנָה
  choice: 住在
  rationale: 源自动词שׁכן，意为居住、安居；“住在”清楚自然，也不额外加入永久定居的含义。
- source_word: בְּאַחֲרִית
  choice: 在……的尽头
  rationale: אַחֲרִית在此表示空间上的末端或极远处；“尽头”既简洁，又保留原文的极限意象。
- source_word: יָם
  choice: 海
  rationale: יָם的直接词义是“海”；在古代以色列的诗歌地理中也可能暗含西方之意，因此正文保留具体意象，另以脚注说明。
