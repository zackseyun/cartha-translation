  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּם חֹשֶׁךְ֮ לֹֽא יַחְשִׁ֪יךְ מִ֫מֶּ֥/ךָ וְ֭/לַיְלָה כַּ/יּ֣וֹם יָאִ֑יר כַּ֝/חֲשֵׁיכָ֗ה כָּ/אוֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/012.yaml
  text: Even darkness is not dark to you[a]; the night shines like the day[b]; darkness is like light to you.
translation:
  language: zh_hans
  text: 即使黑暗，对你也并不黑暗[a]；黑夜如白昼发亮；黑暗对你如同光明[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “并不黑暗”所译的希伯来语动词是使役形，字面可理解为“不使之变暗”或“不使黑暗临到你”；这里按汉语习惯译作状态表达。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译作：“黑暗怎样，光明也怎样”，意思是黑暗和光明在上帝面前并无分别。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 即使
  rationale: 在承接上文的同时带有强调和让步意味：连黑暗也不能成为阻碍。“即使”比单纯的“也”更自然地传达这一语气。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 这是该词中性、常用的对应词，并与本节的“光明”形成清楚的诗歌对照。
- source_word: לֹא יַחְשִׁיךְ מִמֶּךָ
  choice: 对你也并不黑暗
  rationale: 希伯来语动词为使役形，可表达“使之变暗、使成黑暗”；此处采用自然的汉语状态表达，同时保留黑暗在神面前不成其为黑暗的意象，不扩写为“不能向你隐藏什么”。
- source_word: וְלַיְלָה כַּיּוֹם יָאִיר
  choice: 黑夜如白昼发亮
  rationale: 保留“黑夜—白昼”的比喻和平行结构；“发亮”自然表达 אור 使役形在此处“照耀、发光”的意义。
- source_word: כַּחֲשֵׁיכָה כָּאוֹרָה
  choice: 黑暗对你如同光明
  rationale: 按诗句的省略式比较来译，使黑暗与光明在神面前等同的含义清楚，同时不把诗意改写成抽象教义陈述。
theological_decisions:
- issue: 首句是否明说黑暗不能使任何事物向神隐藏
  choice: 保留“对你也并不黑暗”的光暗意象
  alternative: 黑暗也不能向你隐藏什么
  rationale: 上下文涉及神无所不见，但希伯来文在本句借“黑暗”本身来表达，不宜把隐含意义直接扩写为关于隐藏或全知的解释。
- issue: 末句的省略式比较如何理解
  choice: 黑暗对你如同光明
  alternative: 黑暗怎样，光明也怎样
  rationale: 两种表达都反映黑暗与光明在神面前无别；正文采用现代汉语中较顺畅的比较句，脚注保留更贴近希伯来语结构的可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留三分句的诗歌平行和“黑暗—黑夜—白昼—光明”的意象递进；避免把经文直接释义为抽象的全知教义。
