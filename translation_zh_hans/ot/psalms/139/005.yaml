  text: You hem me in behind and before[a], and lay your hand upon me.
translation:
  language: zh_hans
  text: 你把我前后围住[a]，又把你的手放在我身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你把我包围起来”，或“你围困我”；希伯来语动词在这里可以带中性或保护性的意味，也可能带有受压迫的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחוֹר
  choice: 后面
  rationale: 与 קֶדֶם 构成空间上的对应，指人的后方；“后面”是现代汉语中自然清楚的表达。
- source_word: קֶדֶם
  choice: 前面
  rationale: 在与 אָחוֹר 的对举中取空间义“前方”，而非时间义“从前”或方位义“东方”。
- source_word: צַרְתָּנִי
  choice: 把我围在
  rationale: 此处动词表达围住、圈住之意；“围在后面和前面”保留被全然包围的空间意象，同时不把语气限定为保护或压迫。
- source_word: וַתָּשֶׁת
  choice: 按在
  rationale: שׁית 的基本意思是放置、安放；与“手”和“身上”搭配时，“按在”符合自然汉语，也保留手施于其上的直接触感。
- source_word: עָלַי
  choice: 在我身上
  rationale: 准确表达 עַל 的“在……之上”，在汉语中比直译为“在我之上”更自然。
- source_word: כַּפֶּךָ
  choice: 你的手
  rationale: כַּף 可特指手掌，但此处以“手”表达该身体意象更符合汉语习惯，也不过度具体化。
theological_decisions:
- issue: 本节应呈现保护、限制，还是同时容纳两者
  choice: 采用语义中性的“围”，保留神环绕并触及诗人的双重张力。
  alternative: 译成明显偏保护性的“护卫”，或明显偏压迫性的“围困”。
  rationale: צור 在此可带中性或保护意味，也可能使人感到受制、受压；诗篇上下文中的神圣临在既亲近又令人无处可逃，因此不宜把这种张力单向化。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“后面和前面”紧贴原文的空间对举；“把你的手按在我身上”自然呈现拟人化意象，且不额外解释其为祝福、保护或审判。
