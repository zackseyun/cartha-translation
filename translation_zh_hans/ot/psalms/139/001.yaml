source:
  edition: WLC
  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר יְהוָ֥ה חֲ֝קַרְתַּ֗/נִי וַ/תֵּדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O Yahweh[b], you have searched me and known me.
translation:
  language: zh_hans
  text: '交给乐长。[a] 大卫的诗。[b]


    耶和华啊，你已经鉴察我，认识我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“给乐长”。希伯来语介词在诗篇题注中可表示方向、交付对象或归属。
    reason: lexical_alternative
  - marker: b
    text: 或译“大卫所作的诗”“献给大卫的诗”。题注中的希伯来语表达可指作者、题献对象或与大卫有关。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题注中指负责带领或督导音乐的人；前缀 לְ 可表示交付对象或归属方向。“交给乐长”简洁自然，并保留题注的礼仪用途。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 诗篇题注中的 לְ 含义宽泛，可指作者、归属、关联或献给某人。“大卫的”在中文中自然，同时不像“大卫所作”那样把作者身份确定下来。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 该名词指用于歌唱、常有乐器伴奏的诗歌；在中文圣经诗篇题注中译作“诗”简洁庄重。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中通行的专名“耶和华”译出四字神名，不以“主”这一称号替代。
- source_word: חֲקַרְתַּנִי
  choice: 你已经鉴察我
  rationale: 动词 חקר 表示彻底查考、探察；“鉴察”保留深入察验人的含义，“已经”体现完成体在此处所陈述的既成事实。
- source_word: וַתֵּדָע
  choice: 认识我
  rationale: ידע 的基本义是“知道、认识”。此处与“鉴察我”并列，表达上帝对诗人的透彻认识；中文不必重复“你已经”，即可自然承接前句。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 主
  rationale: 原文直接使用以色列上帝的专名，因此正文保留专名，而不以称号“主”代替。
- issue: לְדָוִד 是否明确表示大卫执笔
  choice: 大卫的诗
  alternative: 大卫所作的诗
  rationale: 题注中的 לְ 可表达作者、归属、关联或题献；译作“大卫的诗”保留原文的语义张力，不把作者身份解释得过于确定。
- issue: 上帝“鉴察”与“认识”的关系
  choice: 按两个并列动词直译为“鉴察我，认识我”
  alternative: 鉴察我，就知道我
  rationale: 原文没有明确标示因果关系；保留并列结构，可避免擅自断定“认识”只是“鉴察”的结果。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇题注格式。“乐长”比“诗班长”更宽泛，避免把原文限定为合唱职分；正文保留简洁的平行表达和直接呼告。
