  text: אֽוֹדְ/ךָ֗ עַ֤ל כִּ֥י נוֹרָא֗וֹת נִ֫פְלֵ֥יתִי נִפְלָאִ֥ים מַעֲשֶׂ֑י/ךָ וְ֝/נַפְשִׁ֗/י יֹדַ֥עַת מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/014.yaml
  text: I praise you[a], because I am fearfully and wonderfully made; wonderful are your works[b], and my soul knows it very well.
translation:
  language: zh_hans
  text: 我称颂你，因为我受造，奇妙可畏[a]；你的作为何等奇妙，我自己[b]深知这一点。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我受造，奇妙可畏”也可译作“我受造得奇妙而令人敬畏”。希伯来文此处没有明说“受造”；这是根据上下文补出的。这里的“可畏”指激发敬畏与惊叹，并非恐怖。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“我的נֶפֶשׁ（nephesh）”；在这里可指“我自己”“我的全人”或“我的内在自我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹדְךָ
  choice: 我要称颂你
  rationale: ידה的Hiphil形态在这里表示向上帝称谢、赞美；“称颂”既保留诗歌的敬拜语气，也符合现代汉语表达。
- source_word: עַל כִּי
  choice: 因为
  rationale: 这一组合引出称颂的原因，用“因为”清楚表达因果关系。
- source_word: נוֹרָאוֹת
  choice: 令人敬畏
  rationale: 该词源于ירא，在此表达激发敬畏、使人肃然起敬，并非使人恐惧；“令人敬畏”比“可怕”更准确。
- source_word: נִפְלֵיתִי
  choice: 我受造奇妙
  rationale: פלא的Niphal形态表示非凡、奇妙。结合13、15—16节上帝塑造诗人的语境，补出“受造”能使现代汉语自然，同时脚注保留希伯来文较凝练的表达。
- source_word: נִפְלָאִים מַעֲשֶׂיךָ
  choice: 你的作为何等奇妙
  rationale: נִפְלָאִים表示奇妙、非凡，מַעֲשֶׂיךָ可指上帝的作为、工作或所造之物。“何等奇妙”在汉语中体现原文前置形容词所带的强调。
- source_word: וְנַפְשִׁי
  choice: 我心
  rationale: נפש可指生命、自己或内在自我。“我心”保留诗性的内在认知意味，又避免把希伯来词义限定为严格的身心二分；其他可能译法收入脚注。
- source_word: יֹדַעַת מְאֹד
  choice: 深深知道
  rationale: 动词阴性单数与נפש一致，מְאֹד加强程度。原文宾语省略，汉语“深深知道”也可自然保留这一省略。
theological_decisions:
- issue: נֶפֶשׁ的人论含义
  choice: 正文译为“我心”，脚注说明也可理解为“我自己”或“我的内心深处”
  alternative: 我的灵魂
  rationale: 希伯来文נפש并不必然指与身体分离的“灵魂”。“我心”符合本节内省式诗歌语境，又不强加严格的身心二分。
- issue: נִפְלֵיתִי与受造语境
  choice: 结合上下文译为“我受造奇妙”
  alternative: 我奇妙非凡／我被奇妙地区分出来
  rationale: 原词本身强调诗人处于奇妙、非凡的状态，并未明说“造”；但本诗紧邻经文明确述说上帝塑造诗人，因此补出“受造”有充分语境依据，同时在脚注中交代其解释性。
- issue: נוֹרָאוֹת所表达的敬畏
  choice: 令人敬畏
  alternative: 可畏／使人惊叹
  rationale: 该词表达面对上帝奇妙作为而生的肃然敬畏，不应理解为诗人的受造令人恐怖。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“称颂”“何等奇妙”保持敬拜诗的格调；句式按汉语习惯调整，同时以“你的作为何等奇妙”重现原文对“奇妙”的强调。所有解释性补充和重要词义范围均通过脚注明示。
