  text: וּ/רְאֵ֗ה אִם דֶּֽרֶךְ עֹ֥צֶב בִּ֑/י וּ֝/נְחֵ֗/נִי בְּ/דֶ֣רֶךְ עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/024.yaml
  text: And see whether there is any grievous way in me[b][a], and lead me in the everlasting way.
translation:
  language: zh_hans
  text: 求你察看我里面是否有任何令人痛苦的道路[a]，引导我走永恒的道路[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“伤害人的道路”“令人厌恶的道路”；也可能指“拜偶像的道路”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“古老的道路”或“永远的道路”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאֵה
  choice: 求你看看
  rationale: 这是承接上文、向上帝发出的祈求。用“求你”显明祈求语气，“看看”保留动词“看、察看”的直接含义。
- source_word: אִם
  choice: 是否有
  rationale: 此处引出间接问句；“是否有”符合现代汉语表达。
- source_word: דֶּרֶךְ
  choice: 道路
  rationale: 既保留道路意象，也可自然指人的生活方式和行为方向。
- source_word: עֹצֶב
  choice: 使人忧伤的
  rationale: 该词可涉及痛苦、伤害或令人不悦之意。“使人忧伤的”保留其致痛、致忧的宽泛含义，不将其限定为邪恶或偶像崇拜。
- source_word: בִּי
  choice: 我里面
  rationale: 表达这种道路存在于诗人自身之中，并与上文求上帝鉴察内心的语境相合。
- source_word: וּנְחֵנִי
  choice: 引导我
  rationale: 准确表达 נחה 的带领、引导之义，适合祷告语体。
- source_word: בְּדֶרֶךְ
  choice: 走……道路
  rationale: 汉语通常以“引导我走……道路”自然表达受引领而行在某条道路上。
- source_word: עוֹלָם
  choice: 永恒的
  rationale: 该词可指恒久、永远，也可能指古老、历来。“永恒的”在正文中保留其时间深度及与上帝之道相关的持久意味。
theological_decisions:
- issue: דֶּרֶךְ עֹצֶב 的含义
  choice: 使人忧伤的道路
  alternative: 伤害人的道路；令人厌恶的道路；拜偶像的道路
  rationale: 原词组语义有难度。正文采用较宽泛的译法，兼顾痛苦、伤害和引起忧伤的意味，避免在上下文依据不足时将其专指偶像崇拜。
- issue: דֶּרֶךְ עוֹלָם 的含义
  choice: 永恒的道路
  alternative: 古老的道路；永远的道路
  rationale: “永恒的道路”与前半节负面的道路形成对照，并保留 עוֹלָם 可指恒久或古远的张力；其他可能意义以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你看看”承接诗篇中的直接恳求；两处“道路”保留原文重复和生活道路的隐喻。脚注标记均置于相应词组之后。
