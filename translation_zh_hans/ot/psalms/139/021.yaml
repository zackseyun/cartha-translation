  text: הֲ/לֽוֹא מְשַׂנְאֶ֖י/ךָ יְהוָ֥ה אֶשְׂנָ֑א וּ֝/בִ/תְקוֹמְמֶ֗י/ךָ אֶתְקוֹטָֽט־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/021.yaml
  text: Do I not hate those who hate you, O LORD, and loathe those who rise up against you?
translation:
  language: zh_hans
  text: 耶和华啊，我岂不恨那些恨你的人？岂不厌恶那些起来反对你的人？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשַׂנְאֶיךָ / אֶשְׂנָא
  choice: 恨那些恨你的人
  rationale: 保留原文同一词根的重复及其强烈语气，不以较弱的“憎恶”或“厌弃”淡化。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，对应希伯来文四字神名。
- source_word: בִתְקוֹמְמֶיךָ
  choice: 那些起来反对你的人
  rationale: 既保留“起来”的动作意象，也自然表达该词在此处敌对、反抗的含义。
- source_word: אֶתְקוֹטָט
  choice: 厌恶
  rationale: 此处动词表达强烈的嫌恶、憎厌；“厌恶”比“争斗”更符合该词形在本节平行结构中的语义，并与前句“恨”形成对应而不完全重复。
theological_decisions:
- issue: 诗人对上帝仇敌所表达的强烈态度
  choice: 直译为“恨”与“厌恶”
  alternative: 弱化为“不喜欢”“远离”或解释为仅仅反对其行为
  rationale: 原文明确使用强烈的情感用语；译文保留诗篇中的神学张力，不替诗人缓和或重新解释其陈述。
- issue: 反问句的语气
  choice: 两句均用“岂不”
  alternative: 改为陈述句“我恨……我厌恶……”
  rationale: 希伯来文 הֲלוֹא 引出带有肯定预期的反问；中文“岂不”既保留形式，也传达诗人坚定自陈的语气。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华啊”保留直接呼告；两句平行反问再现希伯来诗歌结构。
