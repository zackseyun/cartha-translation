  text: תַּכְלִ֣ית שִׂנְאָ֣ה שְׂנֵאתִ֑י/ם לְ֝/אוֹיְבִ֗ים הָ֣יוּ לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/022.yaml
  text: I hate them with complete hatred[a]; they have become enemies to me.
translation:
  language: zh_hans
  text: 我恨他们，恨到了极点[a]；他们成了我的仇敌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我以完全的恨意恨他们”，或“我彻底恨恶他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּכְלִית שִׂנְאָה
  choice: 恨到了极点
  rationale: תַּכְלִית 表示尽头、极限或完全，与 שִׂנְאָה 连用，强化恨恶的彻底程度。译作“恨到了极点”符合现代汉语习惯，也保留了原文的强烈语气。
- source_word: שְׂנֵאתִים
  choice: 我恨他们
  rationale: 这是 Qal 完成式第一人称单数并带第三人称阳性复数后缀；在诗歌语境中表达诗人当前而坚定的态度，汉语自然译为“我恨他们”。
- source_word: לְאוֹיְבִים
  choice: 仇敌
  rationale: אוֹיֵב 指敌人或仇敌；“仇敌”与前半句“恨”在语义和语体上相称，并保留关系上的敌对性。
- source_word: הָיוּ לִי
  choice: 他们成了我的仇敌
  rationale: היה 加 ל 可表示形成的身份或关系状态。“成了我的仇敌”保留结果意味，同时是自然、庄重的现代汉语。
theological_decisions:
- issue: 诗人谴责话语的强度
  choice: 保留“恨”及“恨到了极点”的强烈个人表述
  alternative: 将其弱化为“我彻底反对他们”或“我把他们视为仇敌”
  rationale: 希伯来文连续使用同一恨恶词根，并以 תַּכְלִית 加强程度。翻译不应因现代读者的不适而淡化，也不应在正文中加入对这种恨恶的神学解释。
translation_notes:
  register: 采用自然、庄重且普通现代读者易懂的表达。“恨到了极点”避免生硬复制希伯来语名词结构，却保留其重复、强化和彻底性；分号维持两行诗句之间紧密而有区分的关系。
