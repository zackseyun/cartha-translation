  text: כִּֽי אַ֭תָּה קָנִ֣יתָ כִלְיֹתָ֑/י תְּ֝סֻכֵּ֗/נִי בְּ/בֶ֣טֶן אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/013.yaml
  text: For you formed my inward parts[b][a]; you wove me together in my mother’s womb.
translation:
  language: zh_hans
  text: 因为是你塑造了我的内在深处[b]；你在我母亲的腹中编织了我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你遮盖了我”或“你覆庇了我”。原文动词的基本意思是“遮盖”；在母腹的语境中，也可表达精细形成的意象。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我的肾脏”；在希伯来语中可比喻人内在最深处。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的赞叹说明缘由；“因为”自然保留因果关系。
- source_word: קָנִיתָ
  choice: 塑造了
  rationale: קנה通常可指取得或拥有；在母腹形成的诗歌语境中，“塑造”恰当地表达上帝的创造作为，同时避免商业意味。
- source_word: כִלְיֹתָי
  choice: 我的肺腑
  rationale: 原文直译为“我的肾脏”，在希伯来表达中可指人最深处的内在部分。“肺腑”既保留身体意象，也符合现代汉语的诗性表达。
- source_word: תְּסֻכֵּנִי
  choice: 覆庇了我
  rationale: 该词根的核心含义是遮盖、屏护；“覆庇”较直接保留原词意象。结合母腹语境，也可能含有精巧构成之意，故以脚注注明另一译法。
- source_word: בְּבֶטֶן אִמִּי
  choice: 在我母腹中
  rationale: 自然、庄重地表达“在我母亲的腹中”，并符合中文诗歌语序。
theological_decisions:
- issue: 如何表达上帝在母腹中形成诗人的作为，而不加入后来的教义命题
  choice: 译为上帝塑造诗人的肺腑，并在母腹中覆庇他
  alternative: 你拥有了我的肾脏；你在我母腹中遮盖了我
  rationale: 正文明确保留上帝直接参与母腹中生命形成的诗意陈述，却不扩展为本节未明说的系统性教义；同时以脚注保留关键动词的词义张力。
translation_notes:
  register: 采用现代、庄重而可读的诗体汉语。“肺腑”保留希伯来文具体的身体意象；“覆庇”保留 סכך 的遮盖义，并以脚注呈现母腹语境中“编织”的可能理解。所有脚注标记均置于正文相关表达之后。
