  yaml_path: translation/ot/psalms/139/011.yaml
  text: And I said[a], “Surely darkness will cover me[b], and the night will be light around me.”
translation:
  language: zh_hans
  text: 我曾说：“黑暗必定遮盖我[a]，黑夜在我周围也必是亮光[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“黑暗必定压倒我”，或“黑暗必定击伤我”。这里的希伯来语动词较为罕见，确切含义存在争议。
    reason: lexical_alternative
  - marker: b
    text: 或译：“黑夜在我周围就是亮光。”希伯来语原句没有明写动词；按它与诗人前一句话的衔接，可理解为现在状态，也可理解为将来的情形。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我曾说
  rationale: 这是带连接词的完成式第一人称单数，按其直接语法形式表达过去的思想或话语；不把它改写为条件句“如果我说”。
- source_word: אַךְ
  choice: 必定
  rationale: 此处表示强调和确信，而非限制；“必定”自然传达诗人的断言。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 该名词的常规对应，也符合本段关于黑暗与光明的意象。
- source_word: יְשׁוּפֵנִי
  choice: 遮盖我
  rationale: שׁוף较罕见，确切语义有争议；以“黑暗”为主语时，“遮盖”符合意象及下一节的对照，同时在脚注保留“压倒、击伤”等可能。
- source_word: וְלַיְלָה
  choice: 黑夜也
  rationale: 保留连词及与上半句平行的名词结构；“也”在现代汉语中自然承接。
- source_word: אוֹר
  choice: 变为亮光
  rationale: 原文为无动词句。正文依诗人所设想的情形采用将来取向，并用“变为”使汉语完整；脚注保留状态式译法。
- source_word: בַּעֲדֵנִי
  choice: 在我周围
  rationale: 此处最自然地表达环绕说话者的空间关系，符合黑夜包围人的图景。
