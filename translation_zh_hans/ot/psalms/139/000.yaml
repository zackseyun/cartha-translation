  yaml_path: translation/ot/psalms/139/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. Yahweh[b], you have searched me and known me.
translation:
  language: zh_hans
  text: '交给乐长[a]。大卫的[b]诗。


    耶和华啊，你鉴察了我，也认识我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“给乐长”；希伯来语介词在诗篇标题中可以表示方向、交付或题献。
    reason: lexical_alternative
  - marker: b
    text: “大卫的”也可能表示“大卫所作”“献给大卫”或“与大卫有关”；希伯来语标题没有明确限定是哪一种关系。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐团指挥
  rationale: 该词常见于诗篇标题，指负责音乐演唱或演奏的人；译作“圣乐团指挥”既符合礼仪音乐语境，也便于现代读者理解。前缀 לְ 可表示交付、指向或题献，相关歧义由脚注保留。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 用简洁的标题惯用语保留与大卫的关联；希伯来介词 לְ 所表达的作者、归属、题献或关联并不完全确定，因此不直接释为“大卫所作”。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 在诗篇标题中指配合音乐吟唱的诗歌；中文以“诗”表达最自然庄重，并避免加入原文未明确说明的演奏细节。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名传统译法，并保留此处直接呼告的语气。
- source_word: חֲקַרְתַּנִי
  choice: 你鉴察了我
  rationale: 动词 חקר 表示深入探察、查明；“鉴察”庄重而准确，且能表达上帝彻底察验人的含义。
- source_word: וַתֵּדָע
  choice: 也认识我
  rationale: ידע 在此处不只是获得信息，也有透彻认识之意；宾语“我”由上句延续，中文补出后语意自然清楚。
theological_decisions:
- issue: 诗篇标题中 לְדָוִד 与大卫关系的性质
  choice: 正文译作“大卫的”，脚注说明其范围
  alternative: “大卫所作”或“献给大卫”
  rationale: 原文介词可表达作者、归属、题献或关联；正文不把歧义限缩为明确作者声明。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经传统中最普遍、可识别的专名形式；不用“主”替代，以保留原文专名与直接呼告。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。标题保持简练，并以脚注保留两个 לְ 结构的真实歧义；正文用“鉴察”呈现 חקר 的深入探察含义，用“认识”保留 ידע 的关系性与认知性张力。
