revisions:
- from: 我往哪里去，能躲开你的灵？我逃到哪里，能避开你的面？[a]
  to: 我能往哪里去躲避你的灵？我能逃到哪里去躲避你的面前？[a]
  rationale: 修订仅调整中文反问句的语法和“面”的惯用表达，明确保留原文两个平行的“往哪里／到哪里”问句、逃避动作及“灵／面前”的对应关系。
