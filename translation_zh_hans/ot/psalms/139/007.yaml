base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/007.yaml
  text: Where can I go from your Spirit? Or where can I flee from your presence?[a]
translation:
  language: zh_hans
  text: 我能往哪里去躲避你的灵？我能逃到哪里去躲避你的面前？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”所译的希伯来词也可指“风”或“气息”；这里的上下文较支持“灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֭נָה אֵלֵ֣ךְ
  choice: 我往哪里去
  rationale: אָ֭נָה询问去向，אֵלֵךְ是הלך的第一人称单数未完成式。译成“我往哪里去”自然地保留反问语气；“能躲开”结合介词מִן表达离开、避开的含义。
- source_word: מֵ/רוּחֶ֑/ךָ
  choice: 能躲开你的灵
  rationale: רוּחַ可指灵、风或气息；这里与下句“你的面”平行，且上下文谈到无法逃离上帝，因此“你的灵”最合适。“躲开”使中文明确呈现介词מִן在反问中的分离意味。
- source_word: וְ֝/אָ֗נָה
  choice: 我逃到哪里
  rationale: וְ连接两个平行问句，重复的אָ֗נָה再次询问去向。中文不必机械译出“和/或”，用并列句式即可自然体现诗歌平行。
- source_word: מִ/פָּנֶ֥י/ךָ
  choice: 能避开你的面
  rationale: פָּנִים本义为“面”，在此也承载亲自在场的含义。正文保留“面”这一具体的希伯来意象，同时用“避开”传达从面前逃离之意。
- source_word: אֶבְרָֽח
  choice: 我逃到哪里
  rationale: ברח意为“逃跑、逃离”。第一人称单数未完成式置于反问和平行结构中，表达无处可逃，而非单纯将来动作。
theological_decisions:
- issue: רוּחַ应译为非人格性的“风/气息”，还是指上帝的“灵”
  choice: 你的灵
  alternative: 你的风／你的气息
  rationale: 本节上下句将רוּחַ与上帝的“面”平行，并处于诗人无法逃离上帝的语境中，因此指上帝的“灵”最符合上下文；脚注保留该词的其他词义。
- issue: מִפָּנֶיךָ应译作抽象的“你的同在”，还是保留“你的面”
  choice: 你的面
  alternative: 你的同在／你面前
  rationale: “你的面”较直接地保留פָּנִים的诗性意象，同时在汉语圣经语体中也能表达上帝亲自在场；不把这一意象完全抽象化，有助于保存原文平行结构与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个问句保持紧密平行，并以“躲开／避开”呈现介词“从”所表达的逃离意味。正文保留“你的面”这一希伯来诗歌意象，脚注只说明רוּחַ的真实词义范围。
