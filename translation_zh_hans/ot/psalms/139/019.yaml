  text: אִם תִּקְטֹ֖ל אֱל֥וֹהַּ רָשָׁ֑ע וְ/אַנְשֵׁ֥י דָ֝מִ֗ים ס֣וּרוּ מֶֽ/נִּי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/019.yaml
  text: If only you would kill the wicked[a], O God, and you men of blood, depart from me.
translation:
  language: zh_hans
  text: 神啊，愿你杀死恶人！流人血的人哪，你们离开我吧！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: 愿
  rationale: 句首的 אִם 在此不是普通条件词，而是表达强烈愿望；现代汉语用“愿”自然传达祈愿语气。
- source_word: תִּקְטֹל
  choice: 你杀死
  rationale: קטל 的 Qal 未完成式第二人称阳性单数与 אִם 连用，表达诗人希望神施行的行动；“杀死”直接保留原文力度，不作弱化。
- source_word: אֱלוֹהַּ
  choice: 神啊
  rationale: 该词在句中作呼语；“神啊”明确表现诗人直接向神呼求，并符合庄重而自然的现代汉语。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词虽为单数形式，却可作类别性或集合性称呼；汉语“恶人”同样可泛指这一类人，也与下半句复数呼语自然衔接。
- source_word: וְאַנְשֵׁי דָמִים
  choice: 好流人血的人哪
  rationale: 字面为“血的人”，是指暴力杀人或造成流血者的希伯来语习语。“好流人血的人”保留血的意象，同时让现代读者直接明白其含义。句首 וְ 在强烈诗句中可承接并转入呼语，汉语无需机械译出“和”。
- source_word: סוּרוּ
  choice: 你们离开
  rationale: סור 的复数命令式要求这些流血之人远离诗人；“离开”简洁、自然，并保留直接命令的语气。
- source_word: מֶנִּי
  choice: 我
  rationale: 介词 מִן 加第一人称单数后缀表示“从我这里、离开我”；与汉语动词“离开”搭配时译作“离开我”最自然。
theological_decisions:
- issue: 是否淡化诗人求神杀死恶人的祈愿
  choice: 保留“愿你杀死恶人”这一直接祈愿
  alternative: 改译为神将审判恶人的预告，或用“处置”等较弱措辞
  rationale: 原文明确表达诗人希望神杀死恶人的愿望。译文应保留咒诅诗的张力，不因现代读者可能感到不适而把祈愿改成预告或弱化其力度。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“神啊”与“人哪”表现两个直接呼语；两个感叹号传达原文祈愿和命令的强烈语气。未设置脚注，因为“好流人血的人”已在正文中清楚传达希伯来习语，无需另列词义替代。
