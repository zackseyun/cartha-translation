base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/010.yaml
  text: even there your hand will lead me, and your right hand will hold me fast.
translation:
  language: zh_hans
  text: 即使在那里，你的手也必引导我；你的右手必紧紧扶持我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם שָׁם
  choice: 即使在那里……也
  rationale: 保留“连在那里也”的强调语气，并自然承接上文假设性的远行场景。
- source_word: תַנְחֵנִי
  choice: 必引导我
  rationale: 希伯来语 נחה 表示引领、带领；用“引导”准确而自然。
- source_word: תֹאחֲזֵנִי
  choice: 必紧紧扶持我
  rationale: אחז 的基本义是抓住、握住；在此语境中表示右手牢牢抓住并扶持诗人。“紧紧扶持”兼顾力度与保护意味。
- source_word: יְמִינֶךָ
  choice: 你的右手
  rationale: 直译原文，保留“右手”这一具体意象，不将其解释性改写为能力或权能。
theological_decisions:
- issue: 上帝之手的引导与抓持是保护还是限制
  choice: 保留“引导”与“紧紧扶持”的并列意象
  alternative: 译作“带领我、抓住我”
  rationale: 上下文既表达无处能离开上帝，也蕴含其同在与护佑；译文不把这种张力单向限定为安慰或约束。
translation_notes:
  register: 采用现代、庄重且易懂的诗歌语言；以分号保留两个平行分句。“必”表达未完成式在本语境中的确定结果，不额外添加解释。
