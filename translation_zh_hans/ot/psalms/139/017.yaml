id: PSA.139.17
reference: Psalms 139:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לִ֗/י מַה יָּקְר֣וּ רֵעֶ֣י/ךָ אֵ֑ל מֶ֥ה עָ֝צְמוּ רָאשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/017.yaml
  text: And to me[a], how precious are your thoughts, O God[b]; how vast is the sum of them!
translation:
  language: zh_hans
  text: 神啊，你的意念对我何等宝贵[a]！它们的总数何其浩大[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的意念”也可译作“你的朋友”或“你所珍爱的人”。希伯来语形式可有这些理解，但第17—18节提到数算以及数量浩大，较支持“你的意念”。
    reason: alternative_reading
  - marker: b
    text: 直译“它们的头”；这里很可能是“它们的总数”或“它们的总和”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי
  choice: 对我
  rationale: 介词加第一人称后缀突出诗人的个人感受；中文用“对我”自然表达这一强调，连接词可由诗句语流体现。
- source_word: מַה יָּקְרוּ
  choice: 何等宝贵
  rationale: מַה在此引出感叹，יקר表达珍贵、贵重；“何等宝贵”既准确又符合现代汉语诗体。
- source_word: רֵעֶיךָ
  choice: 你的意念
  rationale: 该形式也可理解为“你的朋友”或“你所珍爱的人”，但下文谈到数算且数量浩大，语境更支持指神的意念。
- source_word: אֵל
  choice: 神啊
  rationale: אֵל在此为直接呼语；“神啊”保留诗人向神发出的感叹。
- source_word: מֶה עָצְמוּ
  choice: 何其浩大
  rationale: מֶה为感叹用法；עצם在此结合数量和数算的语境，表达巨大、众多。
- source_word: רָאשֵׁיהֶם
  choice: 它们的总数
  rationale: 字面为“它们的头”，此处是表示总数、总和的习语；“总数”也自然衔接下一节的“数算”。
theological_decisions:
- issue: רֵעֶיךָ的含义
  choice: 你的意念
  alternative: 你的朋友／你所珍爱的人
  rationale: 第17—18节强调对象多到无法数算，因此抽象义“意念”最契合上下文；脚注保留真实的词义歧义，不把它进一步限定为某种特定教义中的“计划”或“旨意”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，以两个感叹句保留希伯来诗句的惊叹语气和平行结构。“意念”比“思想”更适合表达神心中的思虑而不作过度限定；“总数”则清楚传达希伯来习语，并与下一节的数算意象衔接。
