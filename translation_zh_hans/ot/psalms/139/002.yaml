  yaml_path: translation/ot/psalms/139/002.yaml
  text: You know my sitting down and my rising up[b][a]; you understand my thought from afar.
translation:
  language: zh_hans
  text: 你知道我坐下、起来；你从远处洞察我的意念。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “意念”或译“思想”“意图”；“从远处”既可指空间上的距离，也可能表示上帝在意念尚未表达之前便已洞察。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: 知道
  rationale: ידע 的 Qal 完成式第二人称阳性单数在此直接称呼上帝，表达他对诗人的确切、持续认识；现代汉语用“知道”自然且符合其状态性语义。
- source_word: שִׁבְתִּי
  choice: 我何时坐下
  rationale: 该词由 ישׁב 构成并带第一人称单数词尾，指诗人坐下这一行动或状态；译为“我何时坐下”与下句配对，现代汉语自然，也保留日常活动的概括性。
- source_word: וְקוּמִי
  choice: 何时起来
  rationale: 该词由 קום 构成并带第一人称单数词尾，与“坐下”构成对应，可能以首尾概括日常一切活动；“何时起来”准确而通顺。
- source_word: בַּנְתָּה
  choice: 明白
  rationale: בין 的 Qal 完成式第二人称阳性单数在此表示深入洞察；“明白”与前面的“知道”有所区分，又符合现代汉语表达。
- source_word: לְרֵעִי
  choice: 我的意念
  rationale: רֵעִי 在此可指思想、意图或内在打算。“意念”能够涵盖内心思想与意向，同时保持诗歌的庄重语体。
- source_word: מֵרָחוֹק
  choice: 从远处
  rationale: 该短语字面指“从远方／远处”。“从远处”保留空间距离的意象，也不排除在思想尚未表达之前便已洞察的可能。
theological_decisions:
- issue: 本节中上帝知识的范围
  choice: 描述上帝对诗人外在行动和内在意念的深切、全面认识，但不把它扩写为某一种关于全知的哲学模型。
  alternative: 明确改述为上帝在意念产生之前早已预知，或仅理解为空间上相隔遥远。
  rationale: 希伯来文同时涉及诗人的日常行动和内在意念，而“从远处”本身保有空间或时间方面的开放性；正文应保留这种诗意张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“我何时坐下，何时起来”比名词化的“我的坐下和起来”更符合汉语习惯，并保留希伯来文的平行结构。脚注集中说明 רֵעִי 与 מֵרָחוֹק 的真实语义开放性。
