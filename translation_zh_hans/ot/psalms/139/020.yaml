base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/020.yaml
  text: who speak of you with evil intent[a]; your enemies take your name in vain.
translation:
  language: zh_hans
  text: 他们怀着恶意谈论你；你的仇敌妄称你的名。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们为虚假而高举你的对头”，或“你的仇敌虚假地举起你”。希伯来文末句句法艰深，含义不易确定；原文并没有明说“名”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 他们
  rationale: 关系词承接上文的恶人；汉语用“他们”自然引出本节对这些人的描述。
- source_word: יֹאמְרֻךָ
  choice: 谈论你
  rationale: אמר带第二人称阳性单数后缀；结合敌对语境，宜理解为怀着恶意提说或谈论上帝，而非直接对上帝说话。
- source_word: לִמְזִמָּה
  choice: 怀着恶意
  rationale: מְזִמָּה可指计谋、恶谋；这里表达其言语的恶意或邪恶目的。
- source_word: נָשֻׂא
  choice: 称
  rationale: נשׂא本义为举起、承担；与לַשָּׁוְא连用时可构成“妄称”的惯用表达。
- source_word: לַשָּׁוְא
  choice: 妄
  rationale: שָׁוְא涵盖虚假、虚空和徒然；“妄称”简洁传达出虚假、不敬地使用之意。
- source_word: עָרֶיךָ
  choice: 你的仇敌
  rationale: 该形式在此诗歌语境中通常理解为敌对上帝的人，与上半句及上下文的恶人相呼应；虽有字形与句法难点，但“仇敌”最符合语境。
theological_decisions:
- issue: 末句的宾语及其惯用语含义
  choice: 你的仇敌妄称你的名
  alternative: 你的对头为虚假而举起；或：你的仇敌虚假地举起你
  rationale: 希伯来文末句句法艰深。“妄称你的名”依据נשׂא与שָׁוְא的惯用搭配及上下文作出自然补足，但原文并没有明说“名”，因此用脚注保留较直译的其他可能，避免掩盖原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怀着恶意”清楚表达蓄意作恶的意味；“妄称你的名”沿用读者熟悉的圣经用语，同时以脚注明示其解释性补足和原文的句法歧义。
