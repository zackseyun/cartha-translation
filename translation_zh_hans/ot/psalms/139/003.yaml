  yaml_path: translation/ot/psalms/139/003.yaml
  text: You sift out my path and my lying down[a], and you are acquainted with all my ways.
translation:
  language: zh_hans
  text: 我的行路和躺卧，你都细细察看[a]；我一切所行的，你都熟悉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你查究我的行路和躺卧。”希伯来语动词本有簸扬、筛分的意象，在这里表示细致察验。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרְחִי
  choice: 我的行路
  rationale: 名词 אָרַח 指路径、行程或所走的路；“我的行路”保留具体的道路意象，也与下文“躺卧”形成行动与静止的对举。
- source_word: רִבְעִי
  choice: 躺卧
  rationale: רֶבַע 在此指躺下、卧息；“躺卧”简洁自然，不把它限定为地点或睡眠。
- source_word: זֵרִיתָ
  choice: 细细察看
  rationale: זרה 的基本意象与扬净、筛分有关，在本句中表达仔细检察。正文采用自然汉语“细细察看”，脚注保留“筛察”的具体意象及词义张力。
- source_word: כָל־דְּרָכַי
  choice: 我一切所行的
  rationale: דֶּרֶךְ 既可指道路，也可引申为行为和生活方式；“所行的”在现代汉语中兼顾行动与行事，且“我一切”对应 כָל 的总括意味。
- source_word: הִסְכַּנְתָּה
  choice: 你都熟悉
  rationale: 此处 Hiphil 形式表达对某事非常熟悉、通晓；“熟悉”比单纯“知道”更能体现透彻了解，同时避免加入原文没有明说的神学术语。
theological_decisions:
- issue: 以筛分、道路等拟人化意象描写上帝的知识
  choice: 正文保留行路与躺卧的具体对举，并以“细细察看”“熟悉”表达彻底的知晓。
  alternative: 将意象抽象化，译作“你鉴察我的一切活动，知道我的一切行为”。
  rationale: 原诗借日常行动和筛分意象描写上帝对诗人的周全认识；译文不扩写为系统神学表述，也不把诗性张力完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“行路和躺卧”呈现活动与安歇的对举；分号维持两半句的平行结构。脚注标记[a]已置于正文对应词后。
