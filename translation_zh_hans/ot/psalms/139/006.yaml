  text: פלאיה דַ֣עַת מִמֶּ֑/נִּי נִ֝שְׂגְּבָ֗ה לֹא א֥וּכַֽל לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/006.yaml
  text: Such knowledge is too wonderful for me[a]; it is too high—I cannot attain it.
translation:
  language: zh_hans
  text: 这样的知识奇妙得超乎我所能[a]；它高不可及，我无法达到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这样的知识超越了我；它高不可及，我无法企及。”
    reason: lexical_alternative
lexical_decisions:
- source_word: פלאיה
  choice: 太奇妙
  rationale: 该词表达非凡、奇妙并超出通常理解能力；“太奇妙”既保留赞叹意味，也结合“非我所能领会”显出超越诗人能力的含义。
- source_word: דַעַת
  choice: 这样的知识
  rationale: 名词直指“知识”，在上下文中回指前几节所述上帝对诗人的彻底认识；“这样的”自然承接上文。
- source_word: מִמֶּנִּי
  choice: 非我所能领会
  rationale: 字面可作“从我”或“超过我”，此处表示这种知识超出诗人的能力；译文保留其个人局限之意，而不把“奇妙”弱化为单纯难懂。
- source_word: נִשְׂגְּבָה
  choice: 高不可及
  rationale: שׂגב兼有高耸、崇高和难以接近之意；“高不可及”保留高度隐喻，并与下句“无法达到”相呼应。
- source_word: לֹא א֥וּכַֽל
  choice: 我无法
  rationale: 直接表达第一人称的不能或无力。
- source_word: לָהּ
  choice: 达到
  rationale: 原文仅为“对它／到它”，动词含义需依语境补足；“达到”承接“高不可及”的空间隐喻，同时可指智识上不能企及。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的诗体表达。以分号保留两组平行陈述；“领会”呈现认知语境，“高不可及／达到”则保留希伯来文的高度与不可接近意象。
