  text: אִם אֶסַּ֣ק שָׁ֭מַיִם שָׁ֣ם אָ֑תָּה וְ/אַצִּ֖יעָה שְּׁא֣וֹל הִנֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/008.yaml
  text: If I ascend to heaven[a], you are there; if I make my bed in Sheol, behold, you are there.
translation:
  language: zh_hans
  text: 我若升到天上，你在那里；我若在示奥尔[a]铺床，看哪，你在那里！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示奥尔”是希伯来语词，或译“坟墓”或“死者之域”。它指死者所在之处或死亡的深处，并不一定是后来意义上的“地狱”。
    reason: 说明 שְׁאוֹל 的词义范围，避免将后期关于刑罚之地的观念直接带入原文。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出假设情形，并与下半句形成平行结构；不把它具体化为时间性的“当……时”或让步性的“即使”
- source_word: אֶסַּק
  choice: 升到
  rationale: 保留向上升至高处的垂直意象，同时符合现代汉语表达
- source_word: שָׁמַיִם
  choice: 天上
  rationale: 在与“阴间”的诗性对照中，指上方的至高领域；“天上”比“诸天”更自然，也不缩窄为可见的天空
- source_word: שָׁם אָתָּה
  choice: 你在那里
  rationale: 明确保留地点副词和对上帝的第二人称直呼，突出无论身处何处，上帝都在场
- source_word: וְאַצִּיעָה
  choice: 我若……铺床
  rationale: 该动词具体描写铺设卧榻；“铺床”既保留原文图像，也比单纯译作“躺下”少一层解释
- source_word: שְּׁאוֹל
  choice: 阴间
  rationale: 用现代读者能够理解的词指死者所在之域，同时以脚注说明希伯来语概念，避免误译为后来意义上的“地狱”
- source_word: הִנֶּךָּ
  choice: 看哪，你也在那里
  rationale: “看哪”体现 הִנֵּה 的强调和蓦然确认语气；“在那里”由上半句及语境补明，“也”自然呈现两行之间的对应
theological_decisions:
- issue: 诗句中 שְׁאוֹל 的含义
  choice: 阴间
  alternative: 坟墓；死人之地；示奥尔；地狱
  rationale: 此词在希伯来语诗歌中指死者之域或死亡的深处，并不必然等同于后来神学所说的最终刑罚之地。“阴间”配合脚注，既便于普通读者理解，又保留原文的概念范围和诗句所强调的张力：即使在死亡的深处，也不能逃离上帝的临在。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两次“我若”保留希伯来诗歌的平行结构；“升到天上”与“在阴间铺床”形成上下极端的空间对照；末尾用“看哪”和感叹号传达原文强调性的发现语气。
