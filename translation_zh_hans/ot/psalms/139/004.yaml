  text: כִּ֤י אֵ֣ין מִ֭לָּה בִּ/לְשׁוֹנִ֑/י הֵ֥ן יְ֝הוָ֗ה יָדַ֥עְתָּ כֻלָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/004.yaml
  text: For there is not a word on my tongue—behold[a], O Yahweh, you know it altogether.
translation:
  language: zh_hans
  text: 因为我的舌头上还没有一句话——看哪[a]，雅威啊，你全都知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“确实，雅威啊，你全都知道。”
    reason: הֵן 可作引人注意的“看哪”，也可作加强断言的“确实”。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处引出对上文的解释或根据；“因为”既保留篇章联系，也符合现代汉语表达。
- source_word: אֵין מִלָּה
  choice: 没有一句话
  rationale: 保留希伯来文存在否定和“话”这一单数表达，不额外明说这话是尚未出口还是正在形成。
- source_word: בִּלְשׁוֹנִי
  choice: 在我舌头上
  rationale: 保留原文以舌头指向言语的身体意象；汉语调整为“我舌头上”，自然且没有改成原文未用的“嘴唇”。
- source_word: הֵן
  choice: 看哪
  rationale: 作为引人注意并加强语气的语助词，“看哪”保留诗歌中的庄重强调；其也可作“确实”理解，故列脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来神名 YHWH 的通行现代汉语音译处理，保留专名性质，而不以“主”等称号替代。
- source_word: יָדַעְתָּ
  choice: 你知道
  rationale: 此完成式在语境中表达神已经具备的确定、完整认知；汉语用无时态标记的“知道”可自然传达状态意义。
- source_word: כֻלָּהּ
  choice: 全都
  rationale: 阴性单数后缀回指“话”；“全都知道”以自然汉语表达对其全部内容的彻底知晓。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”较贴近 Yahweh 的现代汉语音译，并保留这是专名而非称号；“耶和华”是另一传统音译。
- issue: 神对言语之认识的时间关系
  choice: 不添加“还没有”或“尚未出口”
  alternative: 我还没有说出一句话，你就已经全知道了
  rationale: 上下文可能指话尚未出口，然而本节希伯来文本身只有存在否定，没有明确的“尚未”一词；正文保留其简练和可能的张力，避免把隐含时间关系写死。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。破折号呈现两分句间的强调转折；保留“舌头上”的原文意象，并避免补入原文未明说的时间副词。
