base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/032.yaml
  text: The God who girds me with strength and makes my way blameless[a][b].
translation:
  language: zh_hans
  text: 神用力量[a]束我的腰，使我所行的道路纯全[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“装备我，使我有勇力。”希伯来语直译带有“束腰”的意象；“力量”一词也可指勇力或英勇。
    reason: lexical_alternative
  - marker: b
    text: “纯全”也可译为“完全”或“无可指摘”；原词可表示完整、健全或品行正直。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: 那位……的神
  rationale: 保留定冠词所带的指称和描述作用，同时用现代汉语关系结构自然表达。
- source_word: הַמְאַזְּרֵנִי
  choice: 束我腰
  rationale: אזר本义是束腰、系带；此处保留预备人行动或争战的具体比喻，而不直接释为较抽象的“装备我”。
- source_word: חָיִל
  choice: 以力量
  rationale: חיל可指力量、勇力或英勇；与“束腰”搭配时，“以力量”既自然，也保留较宽的语义范围。
- source_word: וַיִּתֵּן
  choice: 使
  rationale: נתן字面常为“给、置放”，但在此结构中表达造成某种结果，译作“使”符合现代汉语。
- source_word: תָּמִים
  choice: 完全
  rationale: תמים涵盖完整、纯全、无可指摘等含义。“完全”较直接保留其整体性，并避免在正文中把含义只限定为道德上的“无可指摘”。
- source_word: דַּרְכִּי
  choice: 我的道路
  rationale: דרך既可指实际道路，也可比喻人生道路或行事方式；“道路”保留这种意象及其开放性。
theological_decisions:
- issue: תמים用于诗人的“道路”时所表达的意义
  choice: 完全
  alternative: 无可指摘／纯全
  rationale: 原词可表示完整、纯全或无可指摘。正文采用“完全”保留这些层面的张力，并以脚注说明其他可能译法，不将经文解释为宣称诗人绝对无罪。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“束我腰”保留希伯来语具体而有争战色彩的比喻；两个脚注标记均置于正文相关处，避免将多义词过度限定。
