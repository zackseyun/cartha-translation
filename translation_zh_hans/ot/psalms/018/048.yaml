  text: מְפַלְּטִ֗/י מֵ/אֹ֫יְבָ֥/י אַ֣ף מִן קָ֭מַ/י תְּרוֹמְמֵ֑/נִי מֵ/אִ֥ישׁ חָ֝מָ֗ס תַּצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/048.yaml
  text: the one who rescues me from my enemies[a]; indeed, you lift me up above those who rise against me[c][b]; you deliver me from the violent man.
translation:
  language: zh_hans
  text: '救我脱离我仇敌的那一位啊[a]，


    你更将我高举在那些起来攻击我的人之上[b]；


    你救我脱离暴虐之人[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我的救援者，救我脱离仇敌的”。希伯来文句首是带“我”后缀的分词，在这里用作对上帝的称号。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“你使我尊贵，胜过那些起来攻击我的人”。
    reason: lexical_alternative
  - marker: c
    text: 直译“一个暴力之人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְפַלְּטִי
  choice: 那救我的主
  rationale: 该词是带第一人称单数宾语后缀的分词，在句中实词化，用来称呼并描述上帝。“那救我的主”保留持续施救者的称号性质，也使随后第二人称的“你”衔接自然。
- source_word: מֵאֹיְבַי
  choice: 脱离仇敌
  rationale: 介词 מִן 表示从……中脱离，אֹיְבַי 是“我的仇敌”；汉语诗体中可自然省去重复的“我的”。
- source_word: אַף
  choice: 更
  rationale: 此处兼有递进和强调作用，不只是并列；“更”简洁表达从救拔到高举的递进。
- source_word: מִן קָמַי
  choice: 胜过那些起来攻击我的人
  rationale: קָמַי 指起来反对诗人的人；מִן 与表示升高的动词连用，可表达比较，即被高举到对手之上。“起来攻击我”呈现敌对含义而不局限于身体动作。
- source_word: תְּרוֹמְמֵנִי
  choice: 你将我高举
  rationale: 该动词源于 רום，表示使之升高或尊崇。“高举”保留垂直意象，也可承载地位获提升的含义。
- source_word: מֵאִישׁ חָמָס
  choice: 脱离残暴之人
  rationale: אִישׁ 为阳性单数“人/男子”，חָמָס 表示暴力、强暴或恶行。“残暴之人”在现代汉语中庄重自然，并保留单数个体的表达。
- source_word: תַּצִּילֵנִי
  choice: 你救我
  rationale: נצל 在此表示从危险或压迫者手中搭救。译作“救我”直接自然，并由“脱离”明确救拔的对象。
theological_decisions:
- issue: 句首分词的指称及句法功能
  choice: 把句首理解为对上帝的称呼：“那救我脱离仇敌的主”，随后接第二人称“你”。
  alternative: 将句首处理为承接上一节的关系从句，或单纯译成有限动词“他救我”。
  rationale: 希伯来文以实词化分词描述施救者，随即转用两个第二人称动词。保留称号式直接称呼，既反映诗句结构，也不把它强行并入上一节。
- issue: אִישׁ 的性别与指称
  choice: 译为“人”，以“残暴之人”表达一个具体的暴力压迫者。
  alternative: 译为“男子”或泛化为“恶人”。
  rationale: 现代汉语“人”本身不标明语法性别，既能自然对应此处的单数个体，也避免在上下文没有进一步要求时额外突出其生理性别；“恶人”则会扩大 חָמָס 的具体暴力含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。三行保留希伯来诗句由“施救者”到“高举”再到“救离暴力者”的推进；用“主”使汉语中的称呼完整明确，但不添加宗派性称谓。所有脚注标记均按出现次序置于正文。
