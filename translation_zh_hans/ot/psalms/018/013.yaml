base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/013.yaml
  text: Yahweh thundered in the heavens[b][a], and the Most High gave his voice—hailstones and coals of fire.
translation:
  language: zh_hans
  text: 耶和华在诸天中发出雷声，至高者发出声音[a]——冰雹与火炭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“给出他的声音”；也可译作“发声”。这里既可描写神发声，也与雷鸣的意象相呼应。
    reason: lexical_alternative
  - marker: b
    text: 原文在“冰雹与火炭”前没有明说谓语；这两个词可理解为对前述风暴景象的省略式、并置式延续。
    reason: textual_syntax
lexical_decisions:
- source_word: וַיַּרְעֵם
  choice: 打雷
  rationale: רעם在风暴显现的语境中指雷鸣；“打雷”是自然、明确的现代汉语表达，并与下句“发出声音”形成平行。
- source_word: בַּשָּׁמַיִם
  choice: 在诸天之上
  rationale: שׁמים为复数形式，诗歌语域中用“诸天”保留其崇高色彩；“之上”也自然表达雷声来自天际。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，而不以“主”这一称号替代；“耶和华”是现代中文圣经传统中广为人知的专名形式。
- source_word: וְעֶלְיוֹן
  choice: 至高者
  rationale: 准确保留עֶלְיוֹן作为神圣称号的名词性表达，且符合庄重的现代中文。
- source_word: יִתֵּן קֹלוֹ
  choice: 发出声音
  rationale: 该短语直译为“给出他的声音”，是希伯来语习语；“发出声音”既保留动作意象，又符合自然汉语，并不限定这是说话还是雷声。
- source_word: בָּרָד
  choice: 冰雹
  rationale: 该单数名词在此为集合用法；汉语“冰雹”自然涵盖雹粒，无须另加量词或改作复数。
- source_word: וְגַחֲלֵי אֵשׁ
  choice: 与火炭
  rationale: 较直译地保留“火的炭块”这一鲜明意象，避免擅自解释为闪电或其他特定现象。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，故译作专名而非“主”。中文传统常用“耶和华”；“雅威”更接近学界常见的拟音，但两者都不是对古代读音绝对确定的复原。
- issue: “冰雹与火炭”同前句的句法关系
  choice: 用破折号保留省略式、并置式延续
  alternative: 补出“降下”“伴随着”等谓语
  rationale: 原文在这些风暴元素前没有明确的限定动词。破折号既呈现突兀有力的诗行，又避免添加原文未明说的动作。
- issue: “发出声音”所指为何
  choice: 不明确限定为说话或雷鸣
  alternative: 译作“发出雷声”或“开口说话”
  rationale: קול可指声音、话语或雷声；上下文强烈暗示雷鸣，但原诗仍保留神发声的双重意象，译文不应消除这层张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“诸天”“至高者”保持诗篇的崇高语体；“打雷”“发出声音”则避免生硬仿古。破折号保留原文后半句无明确谓语的紧凑、突兀效果。
