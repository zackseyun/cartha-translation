  text: You broaden my steps beneath me[c][b][a], and my ankles have not given way.
translation:
  language: zh_hans
  text: 你使我的脚步宽阔[a]，我的脚踝没有失稳[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你使我迈步的余地宽阔。”原文保留“脚步”被拓宽的形象，表示上帝使人行走稳妥、不受阻碍。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我的脚踝没有打滑。”此处的“脚踝”也可按上下文较宽泛地理解为脚；动词指滑跌、踉跄或失去稳固。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: 你使……宽阔
  rationale: 这是רחב的使役式，意为“使宽阔、拓宽”。上下文表明主语是上帝；译文保留使役含义和第二人称。
- source_word: צַעֲדִי
  choice: 我的步子
  rationale: 该词为单数形式，带第一人称单数词尾，基本义是“我的一步／步子／步伐”。译作“我的步子”既保留原文意象，也可在汉语中表达行走时所得的余地。
- source_word: תַחְתָּי
  choice: 我脚下
  rationale: 原义为“在我下面”。结合迈步和脚踝的意象，译作“我脚下”自然清楚，同时不把它另行解释为“地面”。
- source_word: וְלֹא
  choice: 也没有
  rationale: 原文是连接词加否定词。汉语用“也没有”自然连接前后两个相应的画面。
- source_word: מָעֲדוּ
  choice: 没有摇晃
  rationale: מעד可指滑倒、踉跄或失稳。以“脚踝”为主语时，“摇晃”保留身体失稳的具体画面，又符合现代汉语表达。
- source_word: קַרְסֻלָּי
  choice: 我的脚踝
  rationale: 该词具体指脚踝或踝骨；不泛化为“脚”，以保留原文鲜明的身体意象。
