base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/000.yaml
  text: For the choirmaster[a]. Of David, the servant of Yahweh[b], who spoke to Yahweh the words of this song on the day when Yahweh rescued him from the hand of all his enemies and from the hand of Saul.
translation:
  language: zh_hans
  text: 交给乐长[a]。雅威的仆人大卫的诗；他在雅威救他脱离所有仇敌的手和扫罗的手的那一天，向雅威说了这首歌的话[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乐长”所译的希伯来词含义并不完全确定，传统上理解为负责礼仪音乐的人；也可译作“音乐指挥”。
    reason: lexical_ambiguity
  - marker: c
    text: “脱离……的手”是希伯来语表达，意思是脱离某人的权势或控制。
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 这是诗篇标题中的固定用语，通常指负责礼仪音乐的人；“乐长”简洁庄重，同时以脚注保留该词具体职能的不确定性。
- source_word: לְעֶבֶד
  choice: 仆人
  rationale: עֶבֶד也可指奴隶，但这里用作大卫与雅威关系中的尊称，“仆人”更符合语境与现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以“主”等称号替代。
- source_word: לְדָוִד
  choice: 大卫所作
  rationale: 诗篇标题中的לְדָוִד传统上可表示大卫的作品或与大卫有关；正文采用自然的传统理解，并在此说明该介词结构本身略有弹性。
- source_word: אֲשֶׁר דִּבֶּר לַיהוָה אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: 他向雅威吟唱了这首歌
  rationale: 原文直译为“他向雅威说了这首歌的话”；“吟唱”在诗歌语境中自然表达向神发出歌辞的动作。
- source_word: הִצִּיל
  choice: 救……脱离
  rationale: 准确表达从危险或敌人权势下获救，不在此处额外引入更广泛的救恩含义。
- source_word: מִכַּף / מִיַּד
  choice: 脱离……的手
  rationale: 保留希伯来文以“手”表示权势、控制或掌握的形象，并用脚注解释。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；译作“雅威”既符合其专名性质，也避免用称号取代神名。
- issue: עֶבֶד应译为“仆人”还是“奴隶”
  choice: 仆人
  alternative: 奴隶
  rationale: 该词语义范围兼有仆役与奴隶；在此诗题中，它是大卫对雅威忠属关系的尊称，译作“仆人”较合语境，同时脚注保留另一词义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。诗题保留简短、礼仪性的节奏；“吟唱”使原文“说出这首歌的话”在汉语中自然，同时保留这是向雅威发出的歌。
