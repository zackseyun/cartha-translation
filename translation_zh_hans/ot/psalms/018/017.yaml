  yaml_path: translation/ot/psalms/018/017.yaml
  text: He delivered me from my strong enemy[a], and from those who hated me[b], for they were too mighty for me.
translation:
  language: zh_hans
  text: 他救我脱离强敌[a]，脱离恨我的人[b]，因为他们比我强大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语动词也可按诗歌中近似现在时的用法理解为：“他救我脱离强敌。”
    reason: lexical_alternative
  - marker: b
    text: “强敌”在希伯来语中是单数；“恨我的人”则是复数。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: 他救我脱离
  rationale: נצל 的使役形意为“搭救、救出”。本段追述耶和华过去的拯救行动，中文用“救我脱离”既自然，也能与诗歌叙事语境相合；希伯来语未完成式也可能有近似现在时的诗歌用法，故以脚注保留。
- source_word: מֵאֹיְבִי עָז
  choice: 强敌
  rationale: אֹיֵב 为单数“敌人”，עָז 意为“强壮、强大”。“强敌”简洁而自然，并保留单数形式。
- source_word: וּמִשֹּׂנְאַי
  choice: 脱离恨我的人
  rationale: שׂנא 的复数分词带第一人称单数后缀，直指“恨我的那些人”。译作“恨我的人”符合现代汉语，同时保留其复数集合意义。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出获救的缘由，用“因为”清楚表达因果关系。
- source_word: אָמְצוּ מִמֶּנִּי
  choice: 他们比我强大
  rationale: אמץ 表示“强壮、强大”，מן 在此标示比较。直译为“比我强大”自然准确，也保留敌方力量超过诗人的含义。
theological_decisions:
- issue: 诗歌中开头动词的时间指向
  choice: 按过去发生的拯救来译：“他救我脱离”
  alternative: 按诗歌中的现在时或惯常意义来译：“他救我脱离／他搭救我”并理解为当前或持续行动
  rationale: 本诗段落追述耶和华回应诗人困境、施行拯救的行动，因此正文采用过去事件的理解；汉语动词本身不强制标明时态，脚注进一步保留希伯来语未完成式可能具有的近似现在时读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“强敌”凝练有力；后半句用“比我强大”直接呈现希伯来语的比较结构。所有脚注标记均已置于正文相应位置。
