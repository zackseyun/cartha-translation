  text: יְשַׁוְּע֥וּ וְ/אֵין מוֹשִׁ֑יעַ עַל יְ֝הוָ֗ה וְ/לֹ֣א עָנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/041.yaml
  text: They cried for help, but there was no savior; to the LORD, but he did not answer them.
translation:
  language: zh_hans
  text: 他们呼求，却无人拯救；他们向耶和华呼求，他却不回答他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁוְּעוּ
  choice: 呼求
  rationale: 此动词在这里表示因危难而呼喊求助；译作“呼求”自然、庄重，也与后半句向耶和华呼求相衔接。
- source_word: מוֹשִׁיעַ
  choice: 拯救
  rationale: 原文为使役分词，指实施拯救者。中文“无人拯救”既保留救援含义，也避免生硬的“没有拯救者”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应四字神名。
- source_word: עָנָם
  choice: 回答他们
  rationale: 按其通常意义直译，表示耶和华没有回应他们的呼求。
theological_decisions:
- issue: 神不回答敌人的呼求
  choice: 他却不回答他们
  alternative: 却没有应允他们
  rationale: “回答”直接对应ענה，并保留经文陈述所形成的神学张力，不额外解释神为何不回应。
- issue: מוֹשִׁיעַ是译为人物称谓还是救援行为
  choice: 无人拯救
  alternative: 没有救主
  rationale: 上下文首先描述战败者找不到救援；采用动词式中文表达较自然，同时不把普通的施救者用语过度术语化为特定神学称号。
translation_notes:
  register: 采用简洁、对称而庄重的现代标准汉语。为使省略结构在中文中清楚，在第二分句补出“他们……呼求”，属于由希伯来诗歌省略关系所要求的自然表达。
