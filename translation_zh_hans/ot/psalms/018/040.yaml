  text: וְֽ/אֹיְבַ֗/י נָתַ֣תָּה לִּ֣/י עֹ֑רֶף וּ֝/מְשַׂנְאַ֗/י אַצְמִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/040.yaml
  text: You gave me the backs of my enemies[a]; I destroyed those who hated me.
translation:
  language: zh_hans
  text: 你使我的仇敌转身逃跑[a]；恨我的人，我把他们灭绝了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你把我仇敌的后颈给了我”，这是说仇敌转背败逃。
    reason: 说明希伯来语身体部位意象及其习语含义。
lexical_decisions:
- source_word: וְאֹיְבַי
  choice: 我的仇敌
  rationale: אֹיֵב带第一人称单数后缀，直指与诗人敌对的人；“我的仇敌”是现代汉语中准确、庄重而自然的表达。
- source_word: נָתַתָּה לִּי עֹרֶף
  choice: 你使……转身逃跑
  rationale: 字面意象是“把后颈给我”，即仇敌转背、败退。正文按希伯来语习语的实际含义译为“转身逃跑”，脚注保留其具体身体意象。
- source_word: וּמְשַׂנְאַי
  choice: 恨我的人
  rationale: שׂנא的分词形式带第一人称单数后缀，表示一类持续敌视诗人的人；“恨我的人”直接保留原文措辞。
- source_word: אַצְמִיתֵם
  choice: 我把他们灭绝了
  rationale: צמת的使役形表达使之灭亡、彻底除掉；“灭绝”保留原词的强烈程度，对象代词“他们”也明确对应词尾־ם。
theological_decisions:
- issue: 上帝的赐胜与诗人的毁敌行动之间的张力
  choice: 保留“你使……；我把……”的主语转换
  alternative: 统合为上帝亲自击败或消灭所有仇敌
  rationale: 原文先以第二人称陈述上帝使仇敌败退，随后以第一人称陈述诗人灭绝恨他的人。译文不把两种行动者合并，以保留原文对神圣赐胜与人的战斗行动并置的表达。
- issue: עֹרֶף的败逃意象
  choice: 正文译出习语含义“转身逃跑”，脚注说明字面为“后颈”
  alternative: 正文直译为“你把我仇敌的后颈给了我”
  rationale: 直译在现代汉语中难以自然传达败退含义；采用习语等值表达，同时借脚注保存原文鲜明意象，不额外引入神学解释。
translation_notes:
  register: 采用现代、庄重且容易理解的诗歌叙述语体。“转身逃跑”自然表达败退；后半句以“恨我的人，我把他们……”形成适度前置，既贴近希伯来语结构，也维持中文节奏。
