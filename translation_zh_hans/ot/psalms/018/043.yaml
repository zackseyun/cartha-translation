source:
  edition: WLC
  text: תְּפַלְּטֵ/נִי֮ מֵ/רִ֪יבֵ֫י עָ֥ם תְּ֭שִׂימֵ/נִי לְ/רֹ֣אשׁ גּוֹיִ֑ם עַ֖ם לֹא יָדַ֣עְתִּי יַֽעַבְדֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/043.yaml
  text: You rescue me from the strivings of the people[a]; you set me as the head of nations[d][c][b]; a people whom I have not known serve me.
translation:
  language: zh_hans
  text: '你救我脱离民众的纷争[a]；

    你立我作列国之首[b]；

    我素不认识的民必服侍我[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纷争”也可译作“争竞”或“争执”。希伯来语可指冲突、争论或纠纷。
    reason: lexical_alternative
  - marker: b
    text: 或译：“列国的领袖”。希伯来语直译为“列国的头”，以“头”比喻领袖或居首位者。
    reason: lexical_alternative
  - marker: c
    text: 或译：“我素不认识的民服侍我。”希伯来语未完成式在此既可带将来意味，也可描述持续或惯常的行动。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  choice: 你救我
  rationale: פלט 的皮勒式表达主动搭救、解救；“救我”简洁自然，保留上帝亲自施行拯救的含义。
- source_word: מֵרִיבֵי עָם
  choice: 脱离民众的纷争
  rationale: רִיב 可指争执、争竞、纠纷；“纷争”能涵盖这些含义，不把语境缩限为法律诉讼。עָם 是单数集合名词，此处译为“民众”。
- source_word: תְּשִׂימֵנִי
  choice: 你立我作
  rationale: שׂים 基本义为安置、设立；结合 לְרֹאשׁ 的领袖隐喻，“立我作”是自然且庄重的汉语表达。
- source_word: לְרֹאשׁ גּוֹיִם
  choice: 列国之首
  rationale: רֹאשׁ 本义为“头”，在此喻指居首位或作领袖；“列国之首”保留原文隐喻。גּוֹיִם 按政治群体意义译为“列国”。
- source_word: עַם לֹא יָדַעְתִּי
  choice: 我素不认识的民
  rationale: עַם 在此为不定的集合群体；“民”保留其集合意义。“素不认识”表达完成式所指向的既往不相识状态。
- source_word: יַעַבְדוּנִי
  choice: 必服侍我
  rationale: עבד 意为“服侍、效力”。未完成式在此可表达随后发生或将持续的行动；“必”自然传达这一前瞻意味，同时脚注保留一般现在意义的可能。
theological_decisions:
- issue: 王室诗篇中 גּוֹיִם 与 עַם 的范围
  choice: 按政治性集合群体译为“列国”和“民”
  alternative: 将 גּוֹיִם 译为带有后期族群—神学色彩的“外邦人”
  rationale: 本节描写诗人被高举于其他民族之上；“列国”与“民”贴合原文语境，又避免把后来的犹太人／外邦人神学区分带入经文。
- issue: יַעַבְדוּנִי 的时态意味
  choice: 译为“必服侍我”
  alternative: 译为“服侍我”
  rationale: 希伯来语未完成式可有将来、随后发生或惯常行动的意味。正文采用前瞻性译法，脚注保留一般陈述的可能，不将语法张力绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；以分行和分号呈现三组平行分句。“列国之首”保留希伯来语的身体隐喻，“素不认识”略带诗体色彩但仍属现代通行表达。
