  text: יָ֤שֶׁת חֹ֨שֶׁךְ סִתְר֗/וֹ סְבִֽיבוֹתָ֥י/ו סֻכָּת֑/וֹ חֶשְׁכַת מַ֝֗יִם עָבֵ֥י שְׁחָקִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/011.yaml
  text: He made darkness his hiding place[a], around him his shelter—dark waters[c][b], thick clouds of the skies.
translation:
  language: zh_hans
  text: 他以黑暗为藏身之处[a]；他四围的遮蔽[b]，是幽暗的水和天空的密云。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“隐秘处”。
    reason: lexical_alternative
  - marker: b
    text: 或译“棚子”“帐棚”或“华盖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֶׁת
  choice: 以……为
  rationale: 该动词在诗歌叙事中有“安置、设立”之意；汉语用“以……为”自然表达他把黑暗设作藏身之处。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 保留具体的风暴意象和神显中不可窥见的氛围，不赋予其道德含义。
- source_word: סִתְרוֹ
  choice: 藏身之处
  rationale: 表示隐藏、遮蔽之所；“藏身之处”既保留地点含义，也符合现代汉语。
- source_word: סְבִיבוֹתָיו
  choice: 他四围的
  rationale: 简洁保留环绕他的空间关系，并与下文“遮蔽”自然连接。
- source_word: סֻכָּתוֹ
  choice: 遮蔽
  rationale: 该词可指棚、帐棚或遮盖物；此处译作“遮蔽”突出环绕覆盖的功能，又避免擅自引入会幕意象。
- source_word: חֶשְׁכַת מַיִם
  choice: 幽暗的水
  rationale: 希伯来文直译近于“水的幽暗”；“幽暗的水”在现代汉语中更自然，同时保留水与黑暗相结合的诗意。
- source_word: עָבֵי שְׁחָקִים
  choice: 天空的密云
  rationale: עָבֵי 指浓密厚重的云，שְׁחָקִים 是诗体的天空；译文保留风暴神显的天象。
theological_decisions:
- issue: 本节的黑暗和遮蔽是否应解释为审判、邪恶或礼仪性的会幕象征
  choice: 按风暴神显中的环绕与隐藏意象直译
  alternative: 把黑暗解释为审判，或把“遮蔽”明确译成具有会幕含义的“帐幕”
  rationale: 原文只描写神被黑暗、深水和密云环绕隐藏，并未说明其道德、审判或礼仪意义；译文保留这种诗意和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以分号和逗号呈现两行平行结构，不追求机械复制希伯来语语序。所有脚注标记均置于正文相应词语之后。
