  text: וַ/יֵּ֤רָא֨וּ אֲפִ֥יקֵי מַ֗יִם וַֽ/יִּגָּלוּ֮ מוֹסְד֪וֹת תֵּ֫בֵ֥ל מִ/גַּעֲרָ֣תְ/ךָ֣ יְהוָ֑ה מִ֝/נִּשְׁמַ֗ת ר֣וּחַ אַפֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/015.yaml
  text: Then the channels of the waters were seen[a], and the foundations of the world were laid bare, at your rebuke, O Yahweh[c][b], at the blast of the breath of your nostrils.
translation:
  language: zh_hans
  text: 于是，水流的河道显露[a]，世界的根基也被揭开[b]；雅威啊，这都是因你的斥责，因你鼻孔所出的气息[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河道”也可译作“河床”或“水流经过的沟槽”。
    reason: lexical_alternative
  - marker: b
    text: “世界”也可译作“大地”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译近似“从你鼻孔之风（或灵）的气息”；这是以鲜明的拟人方式描绘雅威呼气的威力。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: 显现
  rationale: 该词是 ראה 的尼法勒式，表示原本隐藏之物变得可见；“显现”既保留这种被动含义，也符合现代汉语诗体。
- source_word: אֲפִיקֵי מַיִם
  choice: 众水的水道
  rationale: אֲפִיקִים 可指水道、河床或水流经过的沟槽；原文是“水”而非“海”，故译作“众水的水道”，避免擅自限定为海或河。
- source_word: וַיִּגָּלוּ
  choice: 暴露出来
  rationale: גלה 的尼法勒式在此表示被揭开、完全显露；“暴露出来”传达宇宙根基被强力揭开的图景。
- source_word: מוֹסְדוֹת תֵּבֵל
  choice: 世界的根基
  rationale: מוֹסְדוֹת 指根基或基座，תֵּבֵל 可指世界、有秩序的陆地或大地；正文采用“世界”，同时以脚注保留“大地”的可能。
- source_word: מִגַּעֲרָתְךָ
  choice: 因着你的斥责
  rationale: 介词 מִן 在这里可表达来源或原因；“因着”自然地呈现神斥责所造成的结果。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，而不以一般称号取代。
- source_word: מִנִּשְׁמַת רוּחַ אַפֶּךָ
  choice: 因着你鼻孔中喷出的强烈气息
  rationale: 该短语逐层结合“气息/吹气”“风/气”和“鼻孔”；正文用自然汉语保留神呼气所产生强大冲击的拟人图景，不将其简化为抽象的“愤怒”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；音译“雅威”可保留专名性质，避免用称号“主”取代。
- issue: 神鼻孔之气的拟人图景
  choice: 保留“你鼻孔中喷出的强烈气息”
  alternative: 因你的烈怒
  rationale: 原文以身体性强烈的诗歌意象描绘神显现的威力；译为“烈怒”虽可能反映 אַף 的延伸义，却会消除 נְשָׁמָה、רוּחַ 和“鼻孔”共同构成的意象。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语，保留希伯来诗歌中平行的显露意象与神显现的宇宙性场景；“那时”“也”使两个并列分句衔接自然。
