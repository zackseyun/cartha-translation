  text: כִּֽי אַ֭תָּה עַם עָנִ֣י תוֹשִׁ֑יעַ וְ/עֵינַ֖יִם רָמ֣וֹת תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/027.yaml
  text: For you save an afflicted people[b][a], but haughty eyes you bring low.
translation:
  language: zh_hans
  text: 因为你拯救困苦的百姓[a]，却使高傲的眼目[b]降卑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦”也可译作“贫穷”或“谦卑”；希伯来语原词可指经济贫穷、遭受患难或处境卑微。
    reason: lexical_alternative
  - marker: b
    text: 直译“高的眼目”，是表达骄傲、自大的希伯来语说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，表达理由或解释；“因为”自然保留希伯来语的因果、说明作用。
- source_word: אַתָּה
  choice: 你
  rationale: 第二人称阳性单数，指上帝；汉语无需另加“亲自”来强化。
- source_word: עַם עָנִי
  choice: 困苦的百姓
  rationale: עָנִי 可指贫穷、受苦或卑微；“困苦”能涵盖处境上的贫困与患难，又不把含义局限于经济贫穷或内在谦卑。
- source_word: תוֹשִׁיעַ
  choice: 拯救
  rationale: 使役词形在此表示救助、搭救；“拯救”简洁庄重，并保留诗篇中上帝施行救援的广泛含义。
- source_word: וְעֵינַיִם רָמוֹת
  choice: 却使高傲的眼目
  rationale: 连接词字面为“和”，但平行结构形成对比，译作“却”较符合现代汉语；“高傲的眼目”保留原文“高的眼睛”这一表达骄傲的意象。
- source_word: תַּשְׁפִּיל
  choice: 降卑
  rationale: 该使役词形意为使之降低、卑下；“降卑”既保留高低对照，也适合庄重的诗歌语体。
theological_decisions:
- issue: עָנִי 所指的困苦、贫穷或卑微
  choice: 困苦的百姓
  alternative: 贫穷的百姓；谦卑的百姓
  rationale: 原词兼有经济贫穷、遭受患难和卑微低下等语义。“困苦”突出上帝救人脱离患难的语境，同时避免只作经济解释，或把它单纯道德化为谦卑品格。
- issue: “高傲的眼目”是直译意象还是直接指骄傲的人
  choice: 保留“高傲的眼目”
  alternative: 高傲的人；骄傲的人
  rationale: 原文以“高的眼睛”表达傲慢。保留眼目的意象可呈现诗歌的具体措辞，又由脚注说明其习语含义，不额外限定为眼神或某一类人。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“拯救—降卑”形成鲜明对照；正文保留“眼目”的源语意象，并用脚注解释。脚注标记依正文出现顺序排列。
