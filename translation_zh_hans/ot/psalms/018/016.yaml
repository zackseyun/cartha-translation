  text: יִשְׁלַ֣ח מִ֭/מָּרוֹם יִקָּחֵ֑/נִי יַֽ֝מְשֵׁ֗/נִי מִ/מַּ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/016.yaml
  text: He sent from on high[a]; he took me; he drew me out of many waters.
translation:
  language: zh_hans
  text: 他从高处伸手[a]，抓住我；他把我从众水中拉出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伸手”原文直译为“他从高处差遣（或伸出）”；原文没有明说所差遣或伸出的是什么，按下文“抓住我”的救援情景，可能省略了“手”。
    reason: 说明原文动词及省略成分所造成的歧义。
lexical_decisions:
- source_word: יִשְׁלַח
  choice: 伸手
  rationale: 该动词通常意为“差遣、伸出”，本句没有明说宾语；结合随后“抓住我”的救援动作，中文用“伸手”自然表达原文可能省略“手”的意象，同时以脚注保留其字面形式。
- source_word: מִמָּרוֹם
  choice: 从高处
  rationale: 原词指高处、高天；译作“从高处”保留空间及超越性的意象，却不把原文未明说的地点具体化为“天上”。
- source_word: יִקָּחֵנִי
  choice: 抓住我
  rationale: לקח 的基本义是“取、拿”；在从水中施救的语境里，“抓住我”比“取走我”更符合现代汉语，又不额外引入暴力意味。
- source_word: יַמְשֵׁנִי
  choice: 把我……拉上来
  rationale: 该词在此指从水中拉出。“拉上来”清楚呈现施救方向，并与出埃及记2:10中相关词语的水中救拔意象相呼应。
- source_word: מִמַּיִם רַבִּים
  choice: 从滔滔大水中
  rationale: 字面为“从许多水中”，也可理解为浩大的水域。“滔滔大水”在现代中文中自然地表现压倒性的洪水或危难意象，同时不把比喻直接解释成某一种具体危险。
theological_decisions:
- issue: 是否把 מִמָּרוֹם 明确译为“从天上”
  choice: 译作“从高处”
  alternative: 从天上
  rationale: 希伯来文只说“高处”，虽可暗示神所在的高天，却没有明确使用“天”一词；保留较宽泛的表达，避免加入比原文更具体的宇宙空间说明。
- issue: 是否将“大水”直接解释为仇敌或死亡危险
  choice: 保留水中获救的诗歌意象
  alternative: 把我从重重危险中救出来
  rationale: 原文以众多、浩大的水象征压倒性的危难；直译其意象可保留诗歌张力，并让上下文决定其比喻所指。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“高处”避免过度具体化；“滔滔大水”保留诗歌性的危难意象；分号呈现两个连续而紧密的救援动作。
