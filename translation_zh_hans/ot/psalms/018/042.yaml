  yaml_path: translation/ot/psalms/018/042.yaml
  text: I beat them fine like dust before the wind[c][b][a]; like mud in the streets I poured them out.
translation:
  language: zh_hans
  text: 我把他们碾得粉碎，如风前的尘土[a]；又把他们像街上的泥一样倾倒出去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如风前的尘土”直译为“如在风面上的尘土”，意思是尘土被风吹散。
    reason: lexical_alternative
  - marker: b
    text: “倾倒出去”也可译作“倒空”或“倾出”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: 我把他们碾得粉碎
  rationale: שׁחק在此为第一人称单数、带第三人称复数宾语后缀，表示碾碎、磨成细末；“碾得粉碎”自然地保留了使敌人化为粉尘的强烈意象。
- source_word: כְּעָפָר
  choice: 如……尘土
  rationale: עָפָר通常指尘土或松散的土；结合碾碎的动作和风吹的图景，“尘土”最贴切。
- source_word: עַל פְּנֵי רוּחַ
  choice: 如风前的
  rationale: 字面为“在风的面上”，在此描绘尘土被风驱散；“风前”既简洁又保留原文诗意。
- source_word: כְּטִיט חוּצוֹת
  choice: 如街上的泥
  rationale: טִיט指泥、泥泞，חוּצוֹת指街道或户外公共空间；“街上的泥”清楚保留受践踏、卑微的形象。
- source_word: אֲרִיקֵם
  choice: 把他们倒出去
  rationale: ריק的使役形可表示倒空、倾倒；“倒出去”保留原文把他们如泥倾出的动作，同时不额外说明其具体结果。
