source:
  edition: WLC
  text: מגדל יְשׁוּע֪וֹת מַ֫לְכּ֥/וֹ וְ/עֹ֤שֶׂה חֶ֨סֶד לִ/מְשִׁיח֗/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֗/וֹ עַד עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/050.yaml
  text: He gives great victories to his king and shows steadfast love to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: zh_hans
  text: 他使他的王大获胜利[a]，向他的受膏者[b]施以坚定不变的慈爱，向大卫和他的后裔[c]，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他是他王的救恩之塔。”本节开头的希伯来语形式在文本和句法上较难确定；《撒母耳记下》22:51有一个十分接近的读法：“他使他王所得的拯救大大彰显。”
    reason: textual_variant
  - marker: b
    text: “他的受膏者”也可译作“他的弥赛亚”。这里首先指大卫或大卫家的君王，同时也带有更广的弥赛亚意涵。
    reason: alternative_reading
  - marker: c
    text: “后裔”所译的希伯来词是单数集合名词，既可指大卫的整个世系，也可在整本圣经的脉络中引向弥赛亚性的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: מגדל
  choice: 使……大获
  rationale: 本节开头的希伯来语形式在文本和句法上较难确定。参照《撒母耳记下》22:51的近似平行句，这里表达的是上帝使他的王所得的拯救或胜利显为重大；“使……大获胜利”既自然，也不强行采用与后文复数“拯救”搭配生硬的“塔楼”意象。
- source_word: יְשׁוּעוֹת
  choice: 胜利
  rationale: 该词为复数，可指多次施行的拯救或解救；在君王与争战的语境中译作“胜利”最自然，同时仍包含上帝施行拯救的意义。
- source_word: מַלְכּוֹ
  choice: 他的王
  rationale: 保留原文第三人称单数所属关系，体现上帝与君王之间的关系。
- source_word: וְעֹשֶׂה חֶסֶד
  choice: 施坚贞之爱
  rationale: חֶסֶד常指持久、信实并带有盟约意味的慈爱；“坚贞之爱”比单纯的“恩慈”更能保留其忠诚和恒久的分量。
- source_word: לִמְשִׁיחוֹ
  choice: 向他的受膏者
  rationale: 紧接着的“大卫”表明眼前所指是大卫或大卫家的君王；“受膏者”准确保留本义，也不抹去其弥赛亚意涵。
- source_word: לְדָוִד
  choice: 向大卫
  rationale: 按现代汉语通行形式音译人名，并保留其与“受膏者”的同位说明关系。
- source_word: וּלְזַרְעוֹ
  choice: 和他的后裔
  rationale: זֶרַע是单数集合名词。“后裔”在现代汉语中可概括整个家系，也不排除聚焦于某一位后裔的可能。
- source_word: עַד עוֹלָם
  choice: 直到永远
  rationale: 自然、庄重地表达无尽延续的时间意义。
theological_decisions:
- issue: 大卫王诗中מְשִׁיחוֹ的弥赛亚意涵
  choice: 正文译作“他的受膏者”，脚注说明也可译作“他的弥赛亚”。
  alternative: 他的弥赛亚
  rationale: 本节直接指向大卫及大卫家的君王，因此正文采用“受膏者”最合乎局部语境；同时以脚注保留该称谓更广的弥赛亚意涵，避免把经文只限于历史层面或只限于后来的应验。
- issue: זַרְעוֹ所指的范围
  choice: 译作集合性的“他的后裔”，不限定为整个王朝或单独一位后裔。
  alternative: 他的子孙；他的种子
  rationale: 原文的单数集合名词既可指大卫的家系，也能容纳聚焦于特定后裔的理解；正文应保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大获胜利”使首句在汉语中自然流畅；“施坚贞之爱”保留חֶסֶד所含的持久忠诚。“就是”明确“大卫”与“受膏者”的同位关系，又不改变原文的神学张力。
