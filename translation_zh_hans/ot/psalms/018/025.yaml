  yaml_path: translation/ot/psalms/018/025.yaml
  text: With the faithful you show yourself faithful[a]; with the blameless man you show yourself blameless.
translation:
  language: zh_hans
  text: 对忠贞的人，你显明自己忠贞[a]；对纯全的人，你显明自己纯全。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对忠诚（或敬虔）的人，你显明自己忠诚。”希伯来文在“忠贞的人”和“显明自己忠贞”中使用同一词根（חסד）的词，强调彼此对应的盟约忠诚。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסִיד
  choice: 忠贞的人
  rationale: 该词指以盟约忠诚、敬虔为特征的人。“忠贞”既保留关系性和伦理性，也能与同根动词 תִּתְחַסָּד 形成明显呼应。
- source_word: תִּתְחַסָּד
  choice: 你显出忠贞
  rationale: חסד 的 Hitpael 形式在此表达上帝向忠贞者显明自己具有忠贞之德；“显出忠贞”保留反身意味及原文同根词的修辞。
- source_word: גְּבַר
  choice: 男子
  rationale: 该阳性单数名词意为成年男子，有时隐含强健之意；本节无须强化为“勇士”，故译作准确而自然的“男子”。
- source_word: תָּמִים
  choice: 纯全
  rationale: 该词表示完整、正直、无可指摘；“纯全”兼顾完整性与伦理上的正直，并便于保存与同根动词 תִּתַּמָּם 的对应。
- source_word: תִּתַּמָּם
  choice: 你显出纯全
  rationale: 该动词与前面的 תָּמִים 同根。“显出纯全”保留反身语气和词根呼应，又避免把它窄化为抽象的形而上“完美”。
theological_decisions:
- issue: 上帝按人的品格显出相应品格的互应表达
  choice: 译作“你显出忠贞……你显出纯全”，保留诗句所表达的对应关系。
  alternative: 译作“你恩待忠贞的人／你以正直待正直的人”，或直接说“你对忠贞的人是忠贞的”。
  rationale: 原文采用反身形态，适合译为“显出”。这样既保留上帝回应人的诗意张力，又不暗示上帝的本性随人的行为而改变。
translation_notes:
  register: 采用现代、庄重而可懂的书面汉语。“忠贞”突出盟约关系中的坚定忠诚；“纯全”保留第二组同根词的完整、正直含义。两组“对……你显出……”维持希伯来诗歌的平行结构。
