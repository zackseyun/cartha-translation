  text: עָ֘לָ֤ה עָשָׁ֨ן בְּ/אַפּ֗/וֹ וְ/אֵשׁ מִ/פִּ֥י/ו תֹּאכֵ֑ל גֶּ֝חָלִ֗ים בָּעֲר֥וּ מִמֶּֽ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/008.yaml
  text: Smoke rose from his nostrils[a], and fire from his mouth consumed; coals blazed from him.
translation:
  language: zh_hans
  text: 烟从他的鼻孔中升起[a]；他口中发出吞噬的烈火；炭火从他那里迸出，熊熊燃烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“烟从他的怒气中升起”。希伯来语“鼻子／鼻孔”也可按习语表示“怒气”；这里与“从他口中”平行，因此正文采用具体的身体意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: 烟……升起
  rationale: עָלָה表示上升；与“烟”搭配时，“升起”既自然，也保留向上的动态。
- source_word: בְּאַפּוֹ
  choice: 从他的鼻孔中
  rationale: אַף既可指“鼻子、鼻孔”，也可按习语指“怒气”。本节与“从他口中”平行，具体的身体意象更符合上下文；介词ב在此按烟气发出的来源译为“从……中”。
- source_word: וְאֵשׁ מִפִּיו תֹּאכֵל
  choice: 烈火从他口中吞噬
  rationale: 保留תֹּאכֵל的主动动词性质及“吃、吞噬”的强烈意象；用“烈火”使现代汉语表达自然，但不补出经文未明说的宾语。
- source_word: גֶּחָלִים
  choice: 炭火
  rationale: 该词指燃烧的炭或余烬；“炭火”在现代汉语中简洁自然，并由后面的动词呈现燃烧状态。
- source_word: בָּעֲרוּ מִמֶּנּוּ
  choice: 从他那里燃烧起来
  rationale: בָּעֲרוּ表示燃烧、着起来；מִמֶּנּוּ直译为“从他”，汉语用“从他那里”保留来源含义，避免擅自具体化为口或鼻孔。
theological_decisions:
- issue: 神显诗歌中对上帝的拟人化描写
  choice: 保留“鼻孔”和“口”的具体身体意象
  alternative: 把אַפּוֹ意译为“他的怒气”，并弱化身体意象
  rationale: 本节以烟、火和炭火描绘神显，且“鼻孔”与“口”形成平行。保留拟人意象更贴近希伯来诗歌，也不把具体图景提前抽象化。
- issue: תֹּאכֵל是否补出吞噬的对象
  choice: 保留无明示宾语的“吞噬”
  alternative: 补译为“吞噬一切”或改为形容词“吞噬人的烈火”
  rationale: 原文没有说明火吞噬什么；不补宾语可保存原文的开放性和强烈、悬置的诗意。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留神显诗歌的拟人意象、三分句节奏及“吞噬”一词未带宾语的张力。
