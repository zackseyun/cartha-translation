  text: וַ/תִּגְעַ֬שׁ וַ/תִּרְעַ֨שׁ הָ/אָ֗רֶץ וּ/מוֹסְדֵ֣י הָרִ֣ים יִרְגָּ֑זוּ וַ֝/יִּתְגָּֽעֲשׁ֗וּ כִּי חָ֥רָה לֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/007.yaml
  text: Then the earth reeled and quaked[a], and the foundations of the mountains trembled and reeled, because he was angry.
translation:
  language: zh_hans
  text: 那时，大地摇撼震动，群山的根基颤抖摇撼，因为他的怒气燃烧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他发怒了。”
    reason: 提供希伯来语怒气“燃烧”这一习语的通顺意译。
lexical_decisions:
- source_word: וַתִּגְעַשׁ
  choice: 摇撼
  rationale: געשׁ描绘剧烈翻腾、摇动；“摇撼”既有强烈动态感，也能与下一个表示震动的动词区分。
- source_word: וַתִּרְעַשׁ
  choice: 震动
  rationale: רעשׁ常指地震般的震荡；“大地震动”自然清楚，并与“摇撼”形成诗意叠加。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 本节是神显所引发的宇宙性景象，“大地”比局部性的“土地”更切合语境。
- source_word: מוֹסְדֵי הָרִים
  choice: 群山的根基
  rationale: מוֹסְדֵי指支撑性的基础；“群山的根基”保留古代诗歌中受造秩序被撼动的意象。
- source_word: יִרְגָּזוּ
  choice: 颤抖
  rationale: רגז表达战栗、动荡；“颤抖”适合以“根基”为主语，并避免与前文用词重复。
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: 摇撼
  rationale: 此处以געשׁ的反身/加强形式呼应句首；重复“摇撼”保存首尾照应及愈加剧烈的诗歌效果。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达后半句对大地和群山震荡原因的说明。
- source_word: חָרָה לוֹ
  choice: 他的怒气燃烧
  rationale: 该习语字面呈现怒气如火燃烧。中文这样表达自然且有诗性，也比仅译“他发怒”更充分保留原文意象。
theological_decisions:
- issue: 以拟人方式描写上帝的烈怒
  choice: 因为他的怒气燃烧
  alternative: 因为他发怒了
  rationale: 保留希伯来语“燃烧”的鲜明意象，真实传达神的烈怒，同时不进一步解释或淡化这种拟人性的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“摇撼—震动—颤抖—摇撼”保留原文近义动词的层叠、区分和首尾呼应；“那时”承接叙事推进。
