language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֤ה סַֽלְעִ֥/י וּ/מְצוּדָתִ֗/י וּ/מְפַ֫לְטִ֥/י אֵלִ֣/י צ֭וּרִ/י אֶֽחֱסֶה בּ֑/וֹ מָֽגִנִּ֥/י וְ/קֶֽרֶן יִ֝שְׁעִ֗/י מִשְׂגַּבִּֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/002.yaml
  text: Yahweh is my crag and my fortress and my deliverer[a], my God, my rock, in whom I take refuge, my shield and the horn of my salvation[c][b], my stronghold.
translation:
  language: zh_hans
  text: 耶和华是我的峭壁[a]、我的堡垒、我的拯救者；我的上帝，我的磐石，我投靠他[b]；他是我的盾牌、我救恩的角[c]、我的高垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “峭壁”也可译为“磐石”；但原文此处的词与后文译作“磐石”的词不同，前者更可指岩崖或峭壁。
    reason: 保留原文两个相关但不同的岩石词之间的词汇区别。
  - marker: b
    text: 也可较直译为“我在他里面避难”；意为我在他那里寻求庇护。
    reason: 说明原文“在他里面／在他之中”的介词结构，同时保留正文自然的现代汉语表达。
  - marker: c
    text: “角”是力量和得胜施救之能的比喻。
    reason: 解释古代诗歌中的文化性比喻，避免将“角”仅按字面理解。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语中最通行、可辨识的上帝专名译法，不以“主”这一称号替代原文专名。
- source_word: סַלְעִי
  choice: 我的峭壁
  rationale: סלע常指陡峭岩壁或岩崖；译作“峭壁”可与后面的צור“磐石”保持区别。
- source_word: מְצוּדָתִי
  choice: 我的堡垒
  rationale: 该词指设防的安全之地；“堡垒”自然地保留军事防护意象，也与末尾的“高垒”有别。
- source_word: מְפַלְטִי
  choice: 救我的那一位
  rationale: 分词在此作名词使用，指使诗人脱险者；此译法在现代汉语中清楚自然，并保留施救者的含义。
- source_word: אֵלִי
  choice: 我的上帝
  rationale: אֵל带第一人称后缀，在此是对上帝的直接称呼；译作“我的上帝”准确而自然。
- source_word: צוּרִי
  choice: 我的磐石
  rationale: צור在此比喻稳固可靠的保护；“磐石”保留传统诗歌意象，并区别于前面的“峭壁”。
- source_word: אֶחֱסֶה בּוֹ
  choice: 我投靠他
  rationale: חסה表示寻求庇护、投奔避难；“投靠”简洁自然，并保留具体的保护意象，而不泛化为“信靠”。
- source_word: מָגִנִּי
  choice: 我的盾牌
  rationale: 直接保留原文的军事防护比喻。
- source_word: קֶרֶן יִשְׁעִי
  choice: 拯救我的角
  rationale: 保留“角”这一圣经比喻，同时用“拯救我的”表达יִשְׁעִי在此所指向的救援，使现代读者能从正文结构把握其功能。
- source_word: מִשְׂגַּבִּי
  choice: 我的高垒
  rationale: 该词指高处、难以攻取的避难所；“高垒”兼顾高度与安全感，并避免与מְצוּדָתִי同译为“堡垒”。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名，正文保留专名而不以称号“主”代替；“耶和华”是现代简体中文圣经语境中最通行、最易识别的形式。
- issue: 是否区分多组岩石与避难所意象
  choice: 分别译为“峭壁、堡垒、磐石、高垒”
  alternative: 将多个词合并译为“磐石”或“山寨”
  rationale: 原文有意密集排列不同的保护性意象；分别翻译可保存诗歌的层次，又不额外赋予各词特定教义含义。
- issue: 是否保留“拯救的角”这一比喻
  choice: 保留为“拯救我的角”，并加注解释
  alternative: 意译为“拯救我的力量”或“使我得胜的大能”
  rationale: “角”在原文中表达力量和得胜施救的能力。保留比喻更贴近希伯来诗歌，加注则帮助现代读者理解而不把其丰富含义缩减为单一抽象概念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以短句和并列结构再现原文密集堆叠的保护意象；标点略作分节，以免中文长串领属结构生硬。保留“磐石、盾牌、角”等诗歌性比喻，对最不透明的“角”加注说明。
