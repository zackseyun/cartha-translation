  text: הָ/אֵל֮ תָּמִ֪ים דַּ֫רְכּ֥/וֹ אִמְרַֽת יְהוָ֥ה צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לְ/כֹ֤ל הַ/חֹסִ֬ים בּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/030.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is refined[b]; he is a shield to all who take refuge in him.
translation:
  language: zh_hans
  text: 至于神，他的道路是完全的；雅威的话是炼净的[a]；他是所有投靠他的人[b]的盾牌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“经过检验”或“炼净”；希伯来文使人联想到金属经火炼，强调雅威的话纯净而可靠。
    reason: lexical_alternative
  - marker: b
    text: 或译“信靠他的人”；希伯来文较直译为“投靠他的人”，描绘人到神那里寻求庇护。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: 至于神
  rationale: 定冠词与句首位置共同突出话题；“至于神”自然体现这一强调。
- source_word: תָּמִים
  choice: 纯全
  rationale: 该词表示完整、毫无缺损；用于神的道路时，“纯全”兼顾完整性与无可指摘之意，又不把含义缩减为单纯的道德判断。
- source_word: דַּרְכּוֹ
  choice: 他的道路
  rationale: דֶּרֶךְ既可指道路，也可指行事方式；保留“道路”这一诗歌意象，同时自然涵盖神的作为。
- source_word: אִמְרַת יְהוָה
  choice: 雅威的话
  rationale: אִמְרָה指言语、话语；译作“话”简洁自然。יְהוָה作为神的专名音译为“雅威”。
- source_word: צְרוּפָה
  choice: 经过熬炼
  rationale: 该词源于熔炼金属的意象，表达经检验而纯净可靠；“经过熬炼”保留原文隐喻。
- source_word: מָגֵן
  choice: 盾牌
  rationale: 直译为“盾牌”，保留神施行保护的具体诗歌意象。
- source_word: הַחֹסִים בּוֹ
  choice: 投靠他之人
  rationale: חסה本义是寻求庇护、避难；“投靠他”既保留寻求保护的含义，也与“盾牌”的意象呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非称号；“雅威”按较通行的学术拟音呈现其专名性质，“耶和华”则是中文传统中更熟悉的形式。
- issue: תָּמִים 所表达的神之道路
  choice: 纯全
  alternative: 无可指摘／完美
  rationale: “纯全”保留完整无缺与无可指摘的复合意味，避免将原文限定为现代汉语中绝对化的“完美”，也不只强调道德层面。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。分号保留三句平行结构；“道路—熬炼—盾牌”的核心意象均予保留。脚注标记按其实际解释对象分别置于“熬炼”和“投靠”之后。
