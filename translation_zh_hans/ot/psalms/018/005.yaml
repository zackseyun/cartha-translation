base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/005.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: zh_hans
  text: 阴间[a]的绳索围住了我；死亡的网罗向我迎面而来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”也可译作“坟墓”或“死者之境”。
    reason: lexical_alternative
  - marker: b
    text: “向我迎面而来”也可译作“来到我面前”或“迎上我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: 绳索
  rationale: 保留诗歌中捆绑、困住人的具体意象；此处不取“产痛”之义，因为它与下半句“网罗”的险境意象相呼应。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: “阴间”是现代中文圣经语境中较简洁且可理解的对应词，指死者所在之境，不将其窄化为坟墓，也不等同于后世教义中的地狱。
- source_word: סְבָבוּנִי
  choice: 围住了我
  rationale: 直接表达环绕、包围之意，同时与“绳索”的困厄意象自然搭配。
- source_word: קִדְּמוּנִי
  choice: 迎面袭来
  rationale: 原词可指来到面前或迎上；结合敌对而致命的语境，以“迎面袭来”传达威胁感，同时用脚注保留较中性的可能译法。
- source_word: מוֹקְשֵׁי
  choice: 网罗
  rationale: 表示捕捉猎物的机关或陷阱；“网罗”保持诗体庄重，也与上句“绳索”构成平行意象。
- source_word: מָוֶת
  choice: 死亡
  rationale: 采用标准对应词，并保留死亡仿佛主动威胁诗人的拟人化效果。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死者之境；音译“示奥尔”
  rationale: “阴间”在简体中文中自然、简洁，并能指向死者所在之境；脚注说明其范围，以免读者把它直接理解为后世教义中特指受刑之处的“地狱”。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。上下两行以“绳索／网罗”和“阴间／死亡”形成希伯来诗歌的平行结构；不为追求顺口而合并两种意象。
