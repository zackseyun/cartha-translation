  text: וַ/תְּאַזְּרֵ֣/נִי חַ֭יִל לַ/מִּלְחָמָ֑ה תַּכְרִ֖יעַ קָמַ֣/י תַּחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/039.yaml
  text: You equipped me with strength for battle[b][a]; you subdued those who rose against me beneath me.
translation:
  language: zh_hans
  text: 你以力量为我束腰，使我能争战；你使那些起来攻击我的人屈伏在我脚下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “屈伏在我脚下”也可较直译为“使那些起来攻击我的人屈身（或跪倒）在我下面”。
    reason: 原文“使……屈身／跪倒”并“在我下面”；正文以自然的汉语保留战败受制的意象。
lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  choice: 你以力量束我的腰
  rationale: 动词 אזר 的基本意象是束腰，语境中表示为战斗装备、赋予力量。正文保留希伯来文的身体意象，同时在现代汉语中仍可理解。
- source_word: חַיִל
  choice: 力量
  rationale: 这里指争战所需的能力或勇力，并非作为集合名词的“军队”；“力量”准确且自然。
- source_word: לַמִּלְחָמָה
  choice: 使我能争战
  rationale: 介词短语直译为“为争战”。结合汉语句法译作“使我能争战”，清楚表达束腰赐力的目的。
- source_word: תַּכְרִיעַ
  choice: 你使……屈服
  rationale: כרע 的使役形表示使人弯下、跪倒或倒下；“使……屈服”适合军事失败的语境，同时保留使役意义。
- source_word: קָמַי
  choice: 那些起来攻击我的人
  rationale: 保留 קום 分词“起来”的动态意象，并明确其在语境中的敌对含义。
- source_word: תַּחְתָּי
  choice: 在我脚下
  rationale: 原文直指“在我下面”。汉语“在我脚下”自然呈现战败、受制的空间隐喻，但较直译的“在我下面”更具象，故以脚注说明。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。前半句保留“束腰”的古代战斗准备意象，并用“使我能争战”使其功能对普通读者明确；后半句兼顾动态意象和自然表达。
