id: PSA.18.1
reference: Psalms 18:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמַ֡ר אֶרְחָמְ/ךָ֖ יְהוָ֣ה חִזְקִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/001.yaml
  text: And he said[a], “I love you, O Yahweh, my strength.”
translation:
  language: zh_hans
  text: 他说：“雅威啊，我爱你[a]；你是我的力量。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“爱”的希伯来语动词通常带有“怜悯、温柔疼爱”的意味；在这里，它表达的是深切而温柔的爱。
    reason: 保留 אֶרְחָמְךָ 所含、仅用现代汉语“爱”无法完全呈现的感情色彩。
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 他说
  rationale: 保留WLC所载的叙述性引语公式。连接词 וַ 在这里主要承接前文，现代汉语不必机械译作“并且”。
- source_word: אֶרְחָמְךָ
  choice: 我爱你
  rationale: רחם 的基本语义涉及怜悯、温柔的深情；但这里是诗人对雅威的直接告白，译作“我爱你”最自然，也避免“我怜悯你”在汉语中产生诗人怜悯上帝的误解，同时以脚注保留原词的特殊感情色彩。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常用拟音直接译出上帝的名字，而不以“主”这一称号替代。
- source_word: חִזְקִי
  choice: 你是我的力量
  rationale: 名词“力量”带第一人称单数属格后缀，直指“我的力量”。汉语补出“你是”，使雅威与“我的力量”之间的同位关系清楚自然。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用专名而非称号；“雅威”较直接地反映该神名的希伯来语拟音，同时不把专名改成“主”。
- issue: 诗人以 רחם 对上帝表达的感情
  choice: 我爱你
  alternative: 我怜悯你；我深深疼爱你
  rationale: 保留对上帝真挚而温柔的爱这一语境意义，不把该动词通常含有的“怜悯”义生硬套入本句；其词汇张力在脚注中说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威啊”保留直接呼告；分号清楚呈现“你是我的力量”作为对雅威的进一步称说。
