    text: 或按较为形式对应的方式译为：“青铜弓被我的双臂拉开。”这句希伯来文较难理解，也可按较字面的被动语态翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַמֵּד
  choice: 训练
  rationale: 该分词可表示“教导、训练”；在双手与争战的军事语境中，“训练”自然地表达实战操练。
- source_word: יָדַי
  choice: 我的双手
  rationale: 保留原文复数和具体的身体意象。
- source_word: לַמִּלְחָמָה
  choice: 争战
  rationale: מִלְחָמָה 可指战争或战斗；“争战”在诗歌语体中简洁自然，并与“训练双手”搭配。
- source_word: וְנִחֲתָה
  choice: 能拉开
  rationale: 此处动词形式和句法较难；结合平行句，正文采用能力性表达，指上帝使诗人有力量拉开强弓，同时用脚注保留较形式对应的被动理解。
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: 铜弓
  rationale: קֶשֶׁת 是弓；נְחוּשָׁה 指铜或青铜制的。“铜弓”是简洁而传统的汉语表达，也传达武器坚硬强韧的意象。
- source_word: זְרוֹעֹתָי
  choice: 我的双臂
  rationale: 保留原文复数及与“我的双手”相呼应的身体意象。
theological_decisions:
- issue: וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי 这一困难分句的解释
  choice: 正文译为能力性表达：“我的双臂能拉开铜弓。”
  alternative: 较形式对应地译为：“铜弓被我的双臂拉开。”
  rationale: 希伯来文句法紧缩，动词形式容许较字面的被动理解。能力性译法符合上下句的诗歌平行：上帝训练并赋予诗人作战的力量；脚注则保留原文可能的被动语态，避免把歧义悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“双手—双臂”保留原文的身体意象和平行结构；分号呈现两分句的紧密对应。脚注标记置于相关困难分句之后。
