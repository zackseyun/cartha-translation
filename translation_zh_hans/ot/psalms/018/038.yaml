  yaml_path: translation/ot/psalms/018/038.yaml
  text: I crush them[a], and they cannot rise[b]; they fall beneath my feet.
translation:
  language: zh_hans
  text: 我击碎他们[a]，他们不能起来[b]；他们倒在我的脚下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我重创他们”或“我打倒他们”；希伯来语动词描写战斗中猛烈的击打或粉碎。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们不能站起来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְחָצֵם
  choice: 我击碎他们
  rationale: מחץ描写战斗中猛烈击打、粉碎；“击碎”既保留动作的强烈程度，也符合现代汉语诗体表达。
- source_word: וְלֹא יֻכְלוּ קוּם
  choice: 使他们不能起来
  rationale: יכל表示能力，קום在这里指倒下后起来。“不能起来”自然保留战败者无法重新起身的图景；连接词וְ在汉语中按结果关系译作“使”。
- source_word: יִפְּלוּ
  choice: 他们倒在
  rationale: נפל基本义为“倒下、落下”；结合战斗语境及“脚下”，译为“倒在”简洁自然。
- source_word: תַּחַת רַגְלָי
  choice: 我的脚下
  rationale: 直译空间意象，表达敌人彻底败倒在诗人脚下。
theological_decisions:
- issue: 王室诗篇中的暴力战斗意象
  choice: 保留第一人称的猛烈战斗语言，不加弱化
  alternative: 意译为“我战胜他们”或“我制服他们”
  rationale: 原文明确使用מחץ所表达的猛烈击碎，以及倒在脚下的图景；弱化为一般性的“战胜”会损失原文力度。
translation_notes:
  register: 采用现代、庄重而有力度的诗体汉语。“击碎”保留战争语境的强烈动作；“倒在我的脚下”维持原文具体意象。主句间用分号呈现平行推进。
