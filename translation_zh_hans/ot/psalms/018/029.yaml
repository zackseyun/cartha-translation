  text: כִּֽי בְ֭/ךָ אָרֻ֣ץ גְּד֑וּד וּ֝/בֵֽ/אלֹהַ֗/י אֲדַלֶּג שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/029.yaml
  text: For by you I can run against a troop[b][a], and by my God I can leap over a wall.
translation:
  language: zh_hans
  text: '因为靠着你，我能冲向一队人马[a]；

    靠着我的上帝，我能跃过城墙[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冲向一队人马”也可译作“冲过一伙袭击者”。
    reason: lexical_alternative
  - marker: b
    text: “城墙”也可译作“壁垒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出诗人作出赞美和见证的依据，保留其解释或因果作用。
- source_word: בְךָ
  choice: 靠着你
  rationale: 介词 בְּ 在这里表示凭借或助力；“靠着你”是自然的现代汉语，并传达能力来自上帝。
- source_word: אָרֻץ
  choice: 我能冲向
  rationale: רוץ 的基本义是“跑”；在军事语境中指奔向或冲向对方。“能”表达上下文所含的蒙上帝赋能之意，但不把动词改译为较强的“击溃”。
- source_word: גְּדוּד
  choice: 一支军队
  rationale: 该词可指队伍、部队或袭击者组成的队伍。“一支军队”在此简明自然，也保留军事画面；较具体的“一伙袭击者”列入脚注。
- source_word: וּבֵאלֹהַי
  choice: 靠着我的上帝
  rationale: 与上半句“靠着你”构成平行，并保留“我的上帝”这一带有个人关系的称呼。
- source_word: אֲדַלֶּג
  choice: 我能跃过
  rationale: דלג 表示跳跃、越过；“跃过”保留鲜明的动作意象，“能”与上半句相称，体现上帝所赐的能力。
- source_word: שׁוּר
  choice: 城墙
  rationale: 该词指墙，语境中尤可能是防御性的墙垣。“城墙”符合军事场景且普通读者易懂；“壁垒”作为可能译法列入脚注。
theological_decisions:
- issue: 本节军事意象的性质
  choice: 保留冲向军队和跃过城墙的具体军事意象，作为诗人见证上帝赐下能力。
  alternative: 将其概括或灵意化为克服人生中的困难。
  rationale: 希伯来文明确使用军队和墙垣等军事用语；译文不将其抽象化，同时也不限制读者从中领会更广的应用。
- issue: 行动能力与上帝助力的关系
  choice: 用“靠着你／靠着我的上帝”和“能”表达行动因上帝的助力而成为可能。
  alternative: 只译为“我冲向／我跃过”，或强化为上帝直接替诗人作战。
  rationale: 两个 בְּ 短语强调凭借上帝；译文呈现这种赋能关系，却不额外断定行动完全由谁直接执行。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“冲向”“跃过”保留希伯来诗歌中具体、有力度的平行动作；两次“靠着”清楚再现原文结构，同时避免古奥措辞。
