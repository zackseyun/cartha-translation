base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/023.yaml
  text: I was blameless before him[c][b][a], and I kept myself from my iniquity.
translation:
  language: zh_hans
  text: 我在他[a]面前无可指摘[b]，也谨慎自守，远离自己的罪孽[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”按上下文指耶和华。
    reason: cross_reference
  - marker: b
    text: “无可指摘”或译“纯全”“正直”；这里强调为人完整正直，不一定表示绝对无罪。
    reason: lexical_alternative
  - marker: c
    text: “罪孽”或译“罪责”或“罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: 我……无可指摘
  rationale: 该词是היה的第一人称单数叙事形式，表示过去状态；汉语用“我……无可指摘”自然表达“我当时是”的含义，不必机械译出系词。
- source_word: תָמִים
  choice: 无可指摘
  rationale: 在此道德语境中，תָמִים强调为人纯全、正直，并非必然宣称绝对无罪；“无可指摘”既保留强烈的自我陈述，也符合现代汉语表达。
- source_word: עִמּוֹ
  choice: 在他面前
  rationale: עִם带第三人称阳性单数后缀，字面为“与他”；此处描述诗人与上主关系中的品行，译作“在他面前”更自然，同时脚注说明代词所指。
- source_word: וָאֶשְׁתַּמֵּר
  choice: 也谨慎自守
  rationale: שמר的反身形式表达自我防守、约束；“谨慎自守”保留反身和警醒的意味，并适合庄重诗体。
- source_word: מֵעֲוֺנִי
  choice: 远离自己的罪孽
  rationale: מן表示远离或避免，עָוֹן可指罪孽、罪责或罪；“自己的”保留第一人称所属关系，“罪孽”保留原词的道德分量。
theological_decisions:
- issue: “无可指摘”是否表示绝对无罪
  choice: 理解为在上主面前为人纯全、正直
  alternative: 理解为绝对无罪或毫无任何罪过
  rationale: תָמִים在本诗的申诉与伸冤语境中表达品格完整和行为正直；译文保留其强烈断言，脚注则避免把它扩大为原文没有明确提出的绝对无罪论。
- issue: “我的罪孽”的语义范围
  choice: 保留为诗人所称属于自己的罪孽
  alternative: 专指某一种惯犯之罪，或只指罪责而非罪行
  rationale: עָוֹן兼有罪孽、罪责等语义，原文未明确限定具体所指，因此正文不作窄化，并在脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“在他面前”使关系性表达自然；“谨慎自守”保留原文反身警醒的语气。所有脚注标记均置于正文对应词语之后。
