  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/צַּר לִ֤/י אֶֽקְרָ֣א יְהוָה֮ וְ/אֶל אֱלֹהַ֪/י אֲשַׁ֫וֵּ֥עַ יִשְׁמַ֣ע מֵ/הֵיכָל֣/וֹ קוֹלִ֑/י וְ֝/שַׁוְעָתִ֗/י לְ/פָנָ֤י/ו תָּב֬וֹא בְ/אָזְנָֽי/ו־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/006.yaml
  text: In my distress I call on Yahweh[a], and to my God I cry for help. He hears my voice from his temple[b], and my cry before him comes into his ears.
translation:
  language: zh_hans
  text: 我在困苦中求告雅威，向我的上帝呼救[a]。他从自己的殿宇[b]中听见我的声音；我在他面前的呼求传入他的耳中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希伯来语未完成式也可按将来意味理解：“我必求告……必呼救；他必听见……我的呼求必传入他的耳中。”
    reason: alternative_reading
  - marker: b
    text: “殿宇”也可译作“圣殿”“宫殿”或“圣所”；原词既可指君王的居所，也可指上帝的居所。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: 我在困苦中
  rationale: צַר表示困境、患难或逼迫；לִי使处境明确属于说话者。“我在困苦中”简洁自然，也保留原文身陷窘境的意味。
- source_word: אֶקְרָא יְהוָה
  choice: 求告雅威
  rationale: קרא与神名连用时表示向神呼求、求告。“雅威”按现代汉语音译呈现四字神名יהוה，不以称号替代专名。
- source_word: וְאֶל אֱלֹהַי אֲשַׁוֵּעַ
  choice: 向我的上帝呼救
  rationale: שׁוע的加强词干表示为求援而呼喊；“呼救”自然明确，并保留אֶל所表达的朝向。
- source_word: יִשְׁמַע
  choice: 听见
  rationale: 希伯来语未完成式在诗歌中可有现在、惯常或将来意味；汉语“听见”本身不强制标明时态，适合保留这种开放性。
- source_word: מֵהֵיכָלוֹ
  choice: 从自己的殿宇中
  rationale: הֵיכָל可指王宫、圣殿或神的居所。“殿宇”既自然庄重，又比单用“圣殿”更能保留原词的语义幅度。
- source_word: קוֹלִי
  choice: 我的声音
  rationale: קוֹל在祷告语境中自然指发声者的声音；直译也与下句“呼求”形成诗意平行。
- source_word: שַׁוְעָתִי לְפָנָיו
  choice: 我在他面前的呼求
  rationale: שַׁוְעָה是求助的呼声，לְפָנָיו直指“在他面前”；此译保留神面前或神临在中的空间意象。
- source_word: תָּבוֹא בְאָזְנָיו
  choice: 传入他的耳中
  rationale: 原文直陈呼声“来到”神耳中。“传入”符合现代汉语表达，同时保留拟人化的听觉意象。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用以色列之神的专名，而非“主”这一称号。“雅威”较直接反映现代学界通常重构的读音；“耶和华”虽为汉语传统形式，却源自较晚的混合读法。
- issue: 神从殿宇听见呼求的时态
  choice: 采用汉语无显式时态的陈述，并以脚注保留将来读法
  alternative: 明确译为“必听见……必传入”
  rationale: יִשְׁמַע与תָּבוֹא均为未完成式，在诗歌语境中可表达生动的现在、惯常事实或将来确信。正文不强制限定时态，避免消除原文张力。
- issue: הֵיכָל所指的神圣居所
  choice: 殿宇
  alternative: 圣殿／宫殿／圣所
  rationale: 上下文可让人想到神在天上的居所，也可能采用君王宫殿或圣所意象；“殿宇”不武断限定为地上的某座圣殿。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“求告”“呼救”“殿宇”具有适度经文语体，但不过分古雅；分号呈现后半节两句平行结构。
