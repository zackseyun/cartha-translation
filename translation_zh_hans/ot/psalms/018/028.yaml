  text: כִּֽי אַ֭תָּה תָּאִ֣יר נֵרִ֑/י יְהוָ֥ה אֱ֝לֹהַ֗/י יַגִּ֥יהַּ חָשְׁכִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/028.yaml
  text: For you light my lamp[b][a]; Yahweh my God lights up my darkness.
translation:
  language: zh_hans
  text: 因为你点亮我的灯[a]；耶和华——我的上帝——照亮我的黑暗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使我的灯发光。”
    reason: lexical_alternative
  - marker: b
    text: “我的黑暗”也可能指患难、危险或愁苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 这里引出诗人信靠和赞美的理由；“因为”自然地承接上下文，也保留原文的因果语气。
- source_word: תָּאִיר
  choice: 点亮
  rationale: 该使役形式表达“使发光、赐予亮光”。“点亮我的灯”既保留使役含义，也符合现代汉语习惯。
- source_word: נֵרִי
  choice: 我的灯
  rationale: נֵר具体指灯；保留这一具体意象，不将其抽象化为“我的光”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的音译呈现四字神名，不用称号替代专名。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 直接保留第一人称所属关系，表达诗人与上帝的个人关系。
- source_word: יַגִּיהַּ
  choice: 照亮
  rationale: 该使役动词意为使明亮、使发光；“照亮”与上句“点亮”形成平行，同时避免机械重复。
- source_word: חָשְׁכִּי
  choice: 我的黑暗
  rationale: 直译名词及第一人称后缀，保留其诗意和多义性，不限定为内心忧郁或外在患难。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用通行且易于普通读者识别的音译“耶和华”，以专名而非“主”等称号来呈现。
- issue: “我的黑暗”的所指
  choice: 保留不加解释的诗性表达
  alternative: 译作“我的困境”“我的忧愁”或“我周围的黑暗”
  rationale: 原文没有明确限定黑暗是危险、患难、阴郁情绪还是更广泛的困境；直译可保存这种神学与诗意张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。两分句以“点亮／照亮”构成平行，保留“灯”和“黑暗”的具体诗歌意象；正文不过度阐释隐喻，必要说明置于脚注。
