  text: כִּ֣י כָל מִשְׁפָּטָ֣י/ו לְ/נֶגְדִּ֑/י וְ֝/חֻקֹּתָ֗י/ו לֹא אָסִ֥יר מֶֽנִּ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/022.yaml
  text: For all his judgments were before me[a], and I did not put away his statutes from me.
translation:
  language: zh_hans
  text: '因为他一切的典章都在我面前；

    他的律例，我也没有从自己身边除去。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我也没有偏离他的律例。”这里的希伯来语动词既可理解为把律例从自己身边除去，也可理解为自己转离律例；正文保留使役式较直接的及物含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明前述宣告的理由；“因为”自然保留其解释和论证作用。
- source_word: כָל מִשְׁפָּטָיו
  choice: 他一切的典章
  rationale: כָל 表示无一例外；מִשְׁפָּטָיו 在此指上帝所立的判断、法规或规范，“典章”兼顾法律与圣约语境，也符合诗篇的庄重语体。
- source_word: לְנֶגְדִּי
  choice: 都在我面前
  rationale: 直译其空间意象，表达诗人始终将这些典章置于眼前、留心遵守，并不额外加入原文没有明说的“常常”。
- source_word: וְחֻקֹּתָיו
  choice: 他的律例
  rationale: חֻקּוֹת 指制定并确立的法规或定例；“律例”是现代中文圣经语境中清楚而庄重的对应词。
- source_word: לֹא אָסִיר
  choice: 我也没有……除去
  rationale: אָסִיר 是 סור 的使役式，可按及物意义理解为“移开、除去”；这样的译法保留“他的律例”作为受事者的句法关系。
- source_word: מֶנִּי
  choice: 从自己身边
  rationale: 明确保留希伯来文“从我这里”的介词成分，并与及物的“除去”自然搭配；“自己”也清楚回指说话者。
theological_decisions: []
