  text: בְּנֵי נֵכָ֥ר יִבֹּ֑לוּ וְ֝/יַחְרְג֗וּ מִֽ/מִּסְגְּרֽוֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/045.yaml
  text: The sons of foreigners fade away and come trembling out of their strongholds[a][b][c].
translation:
  language: zh_hans
  text: 外族人[a]衰残，战战兢兢地[b]从他们的堡垒[c]中出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“外族之子”或“异乡人之子”，也可直接理解为“外族人”。
    reason: lexical_alternative
  - marker: b
    text: 译作“战战兢兢地……出来”的希伯来语动词十分罕见，含义不完全确定；也可能译作“畏缩着出来”或“蹒跚而出”。
    reason: lexical_alternative
  - marker: c
    text: “堡垒”也可译作“要塞”，或较宽泛地译作“围蔽之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: 外族人
  rationale: 该短语直译为“外族之子”或“异乡人之子”，在希伯来语中可指外族人。正文采用现代汉语自然说法“外族人”，并以脚注保留原文的“子”这一诗性表达。
- source_word: יִבֹּלוּ
  choice: 衰残
  rationale: 动词 נבל 在此为未完成式复数，基本义为“枯萎、衰败”。“衰残”既保留失去力量、趋于凋残的意象，也适合战败仇敌的诗歌语境，且不把“战兢”的含义误并入本词。
- source_word: וְיַחְרְגוּ
  choice: 战战兢兢地……出来
  rationale: חרג 是罕见且含义不完全确定的动词；在本节语境中大概描写敌人因恐惧或惊惶而从藏身处出来。“战战兢兢地出来”表达这一较可能的含义，其他可能译法列于脚注。
- source_word: מִמִּסְגְּרוֹתֵיהֶם
  choice: 从他们的堡垒中
  rationale: מִסְגֶּרֶת 可指封闭、围住之处。军事语境下，“堡垒”最能表达敌人退守的防御之地；脚注同时保留“要塞”及较宽泛的“围蔽之处”。
theological_decisions: []
