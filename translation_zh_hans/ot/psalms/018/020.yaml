base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/020.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: zh_hans
  text: 耶和华按我的公义酬报我；照我双手的清洁[a]回报我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “双手的清洁”是希伯来语意象，指行为清白、正直。
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: 恩待我
  rationale: גמל表示按人的行为相应地对待或回报；本节平行句显示这里是正面的报偿。“恩待”自然表达有利的对待，同时避免把它与后半句完全译成同一个词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: כְּצִדְקִי
  choice: 按我的公义
  rationale: 保留第一人称的“公义”及介词所表达的对应尺度，不将经文本身的神学张力弱化为较窄的“无辜”或“案情有理”。
- source_word: כְּבֹר יָדַי
  choice: 照我双手的清洁
  rationale: 保留“手的清洁”这一具体诗歌意象；它在语境中指行为清白、正直。中文用“双手”比“诸手”自然。
- source_word: יָשִׁיב לִי
  choice: 报偿我
  rationale: 使役式שוב在此表示按行为给予相应回报。“报偿”既可承载对应性，也符合这里正面的诗歌语境。
theological_decisions:
- issue: “我的公义”可能被理解为宣称绝对无罪或靠行为自救
  choice: 直译为“我的公义”
  alternative: 我的清白；我的正当理由
  rationale: 原文明确使用צדק及第一人称所有形式。译文应保留诗人关于自身正直的陈述，不为消除潜在神学张力而改窄其含义。
- issue: 报偿是否表示机械式功德交换
  choice: 保留“按……照……”的对应关系，并用“恩待／报偿”表达上下句
  alternative: 仅译作“赐福”或“称我无罪”
  rationale: 两句都强调耶和华的行动与诗人的公义、手的清洁相称；译文不额外引入功德体系，也不把原文改写成法庭宣告。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留两行诗的平行结构。“耶和华”按现代中文圣经传统呈现神名；“公义”和“手的清洁”保留原文的神学用语与具象表达。
