base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/019.yaml
  text: He brought me out into a broad place[a]; he rescued me[c][b], because he delighted in me.
translation:
  language: zh_hans
  text: 他领我到宽阔之地[a]；他搭救我[b]，因为他喜爱我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到开阔之处”或“到宽敞之地”。这个希伯来语意象将宽阔与受困相对，表达自由与安全。
    reason: lexical_alternative
  - marker: b
    text: 或译“他解救我”。
    reason: lexical_alternative
  - marker: c
    text: 或译“因为他悦纳我”或“因为他以我为喜悦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: 他领我出来
  rationale: 这是 יצא 的使役形，意为使人出去、将人带出。“领我出来”自然地保留了从困境中被带出的动态意象。
- source_word: לַמֶּרְחָב
  choice: 到了宽阔之地
  rationale: מֶרְחָב 表示宽广、开阔的空间，在此与受困、窘迫相对。“宽阔之地”保留希伯来语的空间隐喻，也能传达自由与安全。
- source_word: יְחַלְּצֵנִי
  choice: 他搭救我
  rationale: חלץ 的加强形可指拉出、解救或救援。“搭救”符合现代汉语表达，并与前句形成平行。
- source_word: כִּי
  choice: 因为
  rationale: 这里引出上帝搭救诗人的原因，采用“因为”清楚保留其因果关系。
- source_word: חָפֵץ
  choice: 喜爱
  rationale: חפץ 可表达喜欢、喜悦或悦纳。“喜爱”简洁自然，表达对人的恩宠态度，同时不把含义限定为功劳、拣选或其他特定神学机制。
- source_word: בִּי
  choice: 我
  rationale: 介词 ב 与 חפץ 连用时表示所喜爱、所悦纳的对象；汉语用“喜爱我”最为自然，无须逐字译出介词。
theological_decisions:
- issue: 末句所表达的上帝恩宠之性质
  choice: 因为他喜爱我
  alternative: 因为他悦纳我；因为他以我为喜悦
  rationale: 原文只说明上帝对诗人的喜悦或恩宠是搭救的原因，并未界定这种喜悦源于人的功德、圣约拣选或纯粹恩典。译文保留这一开放性，不替原文消解神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“宽阔之地”保留诗歌的空间意象；“搭救”避免过度教会化，同时清楚表达从危险中获救。标点体现两个平行分句及末尾的原因从句。
