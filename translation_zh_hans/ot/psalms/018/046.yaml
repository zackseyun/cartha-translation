  text: חַי יְ֭הוָה וּ/בָר֣וּךְ צוּרִ֑/י וְ֝/יָר֗וּם אֱלוֹהֵ֥י יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/046.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be the God of my salvation.
translation:
  language: zh_hans
  text: 雅威活着！我的磐石当受颂赞；赐我救恩的上帝当受尊崇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿赐我救恩的上帝受尊崇”，或“赐我救恩的上帝是至高的”。
    reason: וְיָרוּם可按赞颂性／祈愿性语气译为“当受尊崇”或“愿……受尊崇”，也可按陈述性语气理解为上帝“是至高的”。
lexical_decisions:
- source_word: חַי יְהוָה
  choice: 雅威永活
  rationale: חַי在此作谓语，是宣告雅威真实地活着；“永活”符合汉语赞美诗体，也表达上帝生命不息，但不引入誓言公式“我指着永活的雅威起誓”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列上帝专名的性质，而不以称号替代。
- source_word: וּבָרוּךְ
  choice: 当受颂赞
  rationale: 该被动分词在赞美语境中带有颂赞宣告的意味；“当受颂赞”既自然庄重，也比单纯陈述“是有福的”更符合此处指向上帝的用法。
- source_word: צוּרִי
  choice: 我的磐石
  rationale: 保留צוּר的具体比喻，表达上帝坚固、可靠并保护诗人的意义，不在正文中改释为“避难所”。
- source_word: וְיָרוּם
  choice: 当受尊崇
  rationale: 该未完成式在此可有祈愿或赞颂宣告的语气，并与前句“当受颂赞”平行；正文采用颂赞性的表达，同时以脚注保留陈述式理解。
- source_word: אֱלוֹהֵי יִשְׁעִי
  choice: 赐我救恩的上帝
  rationale: 用自然现代汉语表达构造短语，表明上帝是诗人救恩的来源；比“我的救恩之上帝”通顺，又不缩减为较窄的称号“救主”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较贴近YHWH通常重构读音的汉语音译“雅威”，以保留专名性质。
- issue: וְיָרוּם在赞美语境中的语气
  choice: 赞颂性、近似祈愿的“当受尊崇”
  alternative: 陈述性的“本为崇高”或祈愿性的“愿……受尊崇”
  rationale: 希伯来语未完成式在诗歌赞颂中可能兼有宣告与祈愿色彩。正文依平行结构采用赞颂性译法，脚注列出其他可能，避免消除原文的语气张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并用感叹号和分号呈现希伯来赞歌的三重宣告及平行结构。“磐石”保留诗歌意象；“当受颂赞／当受尊崇”形成自然对仗。
