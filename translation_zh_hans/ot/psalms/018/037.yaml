  text: אֶרְדּ֣וֹף א֭וֹיְבַ/י וְ/אַשִּׂיגֵ֑/ם וְ/לֹֽא אָ֝שׁוּב עַד כַּלּוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/037.yaml
  text: I pursued my enemies and overtook them[a], and I did not turn back until they were consumed.
translation:
  language: zh_hans
  text: 我追赶仇敌，追上了他们；我没有回头，直到他们灭尽。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶרְדּוֹף
  choice: 我追赶
  rationale: 这是 רדף 的 Qal 未完成式第一人称单数；在诗歌叙事和上下文的得胜回顾中，译作已经发生的追击最为贴切。汉语动词本身不强制标明时态，可自然保留诗体的力度。
- source_word: אֹיְבַי
  choice: 仇敌
  rationale: 准确表达带第一人称单数后缀的“我的敌人”。中文由主语“我”自然确定其关系，无须机械译成“我的仇敌”。
- source_word: וְאַשִּׂיגֵם
  choice: 追上了他们
  rationale: נשׂג 的 Hiphil 形在追击语境中表示赶上、追及；“追上”与前句“追赶”搭配自然，也保留军事追击的图景。
- source_word: וְלֹא אָשׁוּב
  choice: 我没有回头
  rationale: שוב 在这里指停止追击而返回。“没有回头”既简洁，又符合得胜叙事的语境。
- source_word: עַד
  choice: 直到
  rationale: 标明行动持续至某一终点，直接对应原文的时间界限。
- source_word: כַּלּוֹתָם
  choice: 他们灭尽
  rationale: כלה 的不定词结构表达彻底终结、耗尽。译作“他们灭尽”保留全然败亡的力度，同时不在正文中明确补出原文未明说的施事者。
theological_decisions:
- issue: 末句暴力行为的施事者
  choice: 译作“直到他们灭尽”，不在正文中明说是谁将他们灭尽。
  alternative: 直到我把他们灭尽
  rationale: 本诗明确庆贺在上帝帮助下对仇敌取得彻底胜利，不宜弱化其军事暴力；但 כַּלּוֹתָם 的结构可理解为仇敌被灭尽，也可理解为说话者把他们灭尽，因此正文保留施事者未明的张力，并用脚注交代另一译法。
translation_notes:
  register: 采用现代、庄重而直接的诗歌语言。“追赶—追上—没有回头—灭尽”保持原句推进有力的战斗节奏；分号划分追及与彻底得胜两个阶段。
