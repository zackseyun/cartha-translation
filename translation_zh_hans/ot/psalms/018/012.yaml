base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/012.yaml
  text: From the brightness before him his clouds passed on—hail and coals of fire[a].
translation:
  language: zh_hans
  text: 从他面前的光辉中，他的密云掠过——冰雹和火炭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的密云经过；冰雹和燃烧的炭火。”希伯来文十分凝练，诗意浓厚，因此这幅暴风图景可有略微不同的表达方式。
    reason: 词义与句法替代译法
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: 从……光辉中
  rationale: נֹגַהּ表示光辉、亮光；前缀מִן表示来源。这样既贴近原文，也自然呈现神显场景中的明光。
- source_word: נֶגְדּוֹ
  choice: 他面前的
  rationale: נֶגֶד加第三人称阳性单数后缀，通常表示“在他面前”。与前面的介词短语组合为“从他面前的光辉中”，保留空间意象。
- source_word: עָבָיו
  choice: 他的密云
  rationale: עָב可指厚重的云团；译作“密云”既表达云层浓厚，也保留第三人称后缀“他的”。
- source_word: עָבְרוּ
  choice: 掠过
  rationale: עבר在此为复数完成式，可表示经过、移过。“掠过”适合云团在暴风神显画面中移动的动态，同时不额外说明移动方向。
- source_word: בָּרָד
  choice: 冰雹
  rationale: 这是该气象名词在现代汉语中的标准对应词。
- source_word: וְגַחֲלֵי אֵשׁ
  choice: 和火炭
  rationale: 该结构直译为“火的炭”；现代汉语“火炭”简洁而富有诗意，可保留燃烧炭火的鲜明形象。
theological_decisions:
- issue: 暴风中的神显意象
  choice: 保留光辉、密云、冰雹和火炭构成的神显图景，不判定各元素是纯粹比喻还是对实际气象奇迹的描写。
  alternative: 将全句明确解释为军事胜利的比喻，或扩写成一场字面意义上的气象神迹。
  rationale: 希伯来诗歌以紧凑而鲜明的暴风意象描绘耶和华显现；译文应保留其诗性和神学张力，不作原文没有作出的限定。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“掠过”强化诗句的动态感，但不增加原文未明说的方向；破折号保留后半句“冰雹和火炭”与前句之间凝练而可能略有歧义的诗歌关系。
