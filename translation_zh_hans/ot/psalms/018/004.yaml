  text: אֲפָפ֥וּ/נִי חֶבְלֵי מָ֑וֶת וְֽ/נַחֲלֵ֖י בְלִיַּ֣עַל יְבַֽעֲתֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/004.yaml
  text: The cords of death surrounded me[a], and the torrents of destruction terrified me.
translation:
  language: zh_hans
  text: 死亡的绳索缠绕我；毁灭的洪流[a]使我惊恐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“毁灭”的希伯来语词也可理解为“邪恶”或“败坏”；若视为专名，也可译作“彼列”。
    reason: 保留 בְלִיַּעַל 作为普通名词或专名的解释空间，并澄清“毁灭”是本处的语境译法。
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: 缠绕我
  rationale: 动词表示从四周围住、环绕；与“绳索”搭配时，“缠绕我”既自然，也保留具体而有压迫感的诗歌意象。
- source_word: חֶבְלֵי
  choice: 绳索
  rationale: חבל 的基本义为绳、索；此处采用具体意义，并保留“死亡如绳索捆住人”的意象。
- source_word: מָוֶת
  choice: 死亡
  rationale: 直接对应原文，符合本诗危难临近的语境。
- source_word: נַחֲלֵי
  choice: 洪流
  rationale: נחל 可指溪谷、溪流，也可指奔涌的急流；这里强调来势汹涌的威胁，“洪流”最能传达诗歌力度。
- source_word: בְלִיַּעַל
  choice: 毁灭
  rationale: 该词在此更可能是普通名词，表达败坏、邪恶或招致毁灭的力量，而非专名；“毁灭”与“洪流”的灾难意象搭配自然，同时以脚注保留其词义和专名两种可能。
- source_word: יְבַעֲתוּנִי
  choice: 使我惊恐
  rationale: 该动词表达突然临到的强烈恐惧或惊骇；“使我惊恐”准确、庄重，也符合现代汉语。
theological_decisions:
- issue: בְלִיַּעַל 在此是专名，还是表示败坏、邪恶或毁灭的普通名词
  choice: 按普通名词译为“毁灭”
  alternative: 可译为“邪恶”“败坏”，也可音译为专名“彼列”
  rationale: 诗篇语境并不要求把该词理解为人格化的邪恶存在；译作“毁灭”能表达此处洪流带来的灾祸与毁坏，同时脚注保留原词本身的语义张力及专名读法。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语；用分号呈现希伯来诗歌的平行结构。“缠绕”呼应“绳索”，“洪流”则保留第二行不同的水患意象。
