  text: מְשַׁוֶּ֣ה רַ֭גְלַ/י כָּ/אַיָּל֑וֹת וְ/עַ֥ל בָּ֝מֹתַ֗/י יַעֲמִידֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/033.yaml
  text: He makes my feet like the deer’s[b][a], and sets me on my heights.
translation:
  language: zh_hans
  text: 他使我的脚像母鹿的脚一样[a]，又使我站在我的高处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “母鹿”原文为阴性复数；这个比喻使人联想到母鹿敏捷、脚步稳健。
    reason: lexical_alternative
  - marker: b
    text: “我的高处”或译“我的高地”。
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: 使……如……一般
  rationale: שׁוה 的 Piel 分词在这里表示使某物与另一物相似；此译自然保留使役含义和随后的比喻结构。
- source_word: רַגְלַי
  choice: 我的脚
  rationale: רֶגֶל 在此指脚；第一人称复数所属后缀译为“我的”。汉语无需机械标出双数。
- source_word: כָּאַיָּלוֹת
  choice: 如母鹿一般
  rationale: אַיָּלוֹת 是阴性复数，指母鹿。“母鹿”准确保留性别信息，也维持原文关于敏捷、稳健步履的诗歌意象。
- source_word: בָּמוֹתַי
  choice: 我的高处
  rationale: בָּמוֹת 指高处或高地，且带第一人称所属后缀。译作“我的高处”保留原文较为奇特而富有诗意的表达，不将其限定为祭祀场所或军事据点。
- source_word: יַעֲמִידֵנִי
  choice: 使我站
  rationale: עמד 的 Hiphil 形式意为“使站立、使站在”。此译保留使役意义，不额外加入原文未明说的“稳固”或“安然”。
theological_decisions:
- issue: 母鹿与高处的比喻所表达的敏捷和稳立
  choice: 保留母鹿、脚和高处的具体诗歌意象，不在正文中解释为军事得胜或属灵经历。
  alternative: 可意译为上帝赐人敏捷稳健，并使人安立于险峻之地。
  rationale: 上下文具有争战和拯救背景，但本节本身借母鹿和高处构成开放性的诗歌图像；保留图像可避免将其神学意义限定得过窄。
- issue: “使我站”是否应补出安稳之意
  choice: 译作“使我站”，不补“稳稳地”或“安然”。
  alternative: 使我稳立在我的高处。
  rationale: 稳健与安全可由整幅意象自然联想到，但 יַעֲמִידֵנִי 明说的是使人站立；正文采用较贴近原文的表达。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。“如……一般”比口语化的“像……”稍显典雅，但普通读者容易理解；“我的高处”有意保留原文的第一人称所属关系及其诗意含混性。
