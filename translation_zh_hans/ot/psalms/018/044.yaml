  yaml_path: translation/ot/psalms/018/044.yaml
  text: At the hearing of the ear they obey me[c][b][a]; foreigners feign obedience to me.
translation:
  language: zh_hans
  text: 他们一听见，就听从我[a]；外族人[b]向我假意归顺[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“在耳闻之时，他们就听从我”；也可译作“他们一听到，就服从我”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“外族之子”或“外邦之子”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“向我屈服”或“佯装效忠于我”；原词可表示虚假或不实的表示，在征服语境中可指并非真心的臣服。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: 一听见
  rationale: 原文直译近于“耳朵一听见”或“在耳闻之时”，表示消息一传入耳中便立即作出反应。“一听见”自然简洁，也保留了即时回应的含义。
- source_word: יִשָּׁמְעוּ לִי
  choice: 就听从我
  rationale: שׁמע 与介词 ל 连用时常指听从、服从；此处是君王得胜的语境，不只是听见声音。“听从”也与下句外族人并非真心的归顺形成张力。
- source_word: בְּנֵי נֵכָר
  choice: 外族人
  rationale: 该短语字面为“异乡之子”或“外邦之子”，是指外族人的希伯来语习语。“外族人”符合现代汉语，也不额外限定其政治身份。
- source_word: יְכַחֲשׁוּ לִי
  choice: 向我假意归顺
  rationale: כחש 的 Piel 形式可表示欺骗、否认或作虚假的表示；用于征服语境时，可指迫于威势而作出并非真心的臣服。“假意归顺”既呼应上句的“听从”，也保留其虚假或勉强的意味。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一听见，就……”清楚传达希伯来语习语所表达的即时反应；“假意归顺”保留末句关于臣服是否真诚的张力，而不把它解释成单纯、真心的顺服。
