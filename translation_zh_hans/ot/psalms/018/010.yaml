  text: וַ/יִּרְכַּ֣ב עַל כְּ֭רוּב וַ/יָּעֹ֑ף וַ֝/יֵּ֗דֶא עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/010.yaml
  text: And he rode on a cherub and flew[b][a]; he sped on the wings of the wind.
translation:
  language: zh_hans
  text: 他骑着基路伯飞翔；他在风[b]的翅膀上疾飞[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个罕见动词也可理解为“猛冲”或“俯冲”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语“רוּחַ”可表示“风”“气息”或“灵”；这里的风暴意象支持译作“风”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: 驾着
  rationale: 该词是 רכב 的 Qal 叙事式，表示骑乘或驾乘；“驾着”在现代汉语中自然，也保留了上帝以基路伯为坐骑的鲜明诗歌意象。
- source_word: עַל כְּרוּב
  choice: 驾着基路伯
  rationale: עַל 在此表示骑乘时所凭借的对象；כְּרוּב 是单数，译作约定俗成的“基路伯”，不把这一具体形象改释为云彩或其他事物。
- source_word: וַיָּעֹף
  choice: 飞翔
  rationale: עוף 的基本义是“飞”；“飞翔”直接传达动作，又符合本节庄严而生动的诗歌语体。
- source_word: וַיֵּדֶא
  choice: 疾飞
  rationale: 这是罕见动词，在本句与“飞翔”平行，语境支持快速凌空运动之义。“疾飞”既表达速度，也不强行限定为俯冲或猛扑。
- source_word: כַּנְפֵי
  choice: 翅膀
  rationale: כָּנָף 的复数构造形式，字面为“翅膀”；保留原文“风的翅膀”这一拟象化的诗歌表达。
- source_word: רוּחַ
  choice: 风
  rationale: רוּחַ 可表示风、气息或灵；本诗段描绘风暴中的神显，因此“风”最符合直接语境。
theological_decisions:
- issue: 基路伯意象的性质
  choice: 保留上帝驾着基路伯飞翔的具体诗歌图景。
  alternative: 把“基路伯”解释性地译成风暴云、天使军队或其他象征。
  rationale: 希伯来文本直接呈现神显中的坐骑意象，却没有说明其等同于哪一种自然现象；照原文保留可避免加入特定的宇宙观解释。
- issue: רוּחַ 在末句中的含义
  choice: 正文译作“风”。
  alternative: 译作“灵”或“气息”。
  rationale: 上下文是风暴神显，“风的翅膀”也构成连贯的气象意象；脚注仍说明该词本身具有更宽的语义范围。
- issue: 罕见动词 וַיֵּדֶא 的动作含义
  choice: 译作“疾飞”，保留快速空中运动的概括含义。
  alternative: 译作“猛冲”“俯冲”，或依少数文本传统理解为“显现”。
  rationale: 它与前面的“飞翔”形成平行，快速飞行最合语境；但原词罕见，不宜在正文中过度具体化其运动方式。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“驾着”自然呈现骑乘意象；“风的翅膀”保留希伯来诗歌的具体比喻；“疾飞”简洁表达罕见动词所指的快速空中运动，同时避免过度解释。
