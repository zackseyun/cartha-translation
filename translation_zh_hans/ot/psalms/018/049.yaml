base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/049.yaml
  text: Therefore I will give thanks to you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: zh_hans
  text: 因此，耶和华啊，我要在列国中[a]称谢你，歌颂你的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国”也可译作“外邦中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接上文所述的拯救，保留原文表示结论或结果的推论语气。
- source_word: אוֹדְךָ
  choice: 我要称谢你
  rationale: ידה 的使役词干在诗歌敬拜语境中常指向上帝献上感谢和赞美；“称谢你”既保留感谢含义，也符合庄重的诗篇用语。
- source_word: בַגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם 广义指各国或万民；“列国”保留国际性范围，并与希伯来诗歌语体相称。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式音译四字神名，而不以称号“主”替代。
- source_word: וּלְשִׁמְךָ
  choice: 你的名
  rationale: 介词 לְ 与后面的歌颂动词构成对象关系；中文“歌颂你的名”自然准确，无须逐字译出介词。
- source_word: אֲזַמֵּרָה
  choice: 我要歌颂
  rationale: זמר 的加强词干表示以歌唱或音乐献上赞美；“歌颂”简洁表达其敬拜含义，并与上句形成平行。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名；正文保留中文传统中广为人知的专名“耶和华”，不以“主”这一称号代替。
- issue: בַגּוֹיִם 的所指
  choice: 在列国中
  alternative: 在外邦人中
  rationale: 原词本身可泛指各国，也可能按以色列视角指外邦人。本节优先保留较宽泛的政治—民族含义，并在脚注中注明另一译法，避免把后来的语境限定带入诗篇。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“称谢”与“歌颂”保留诗篇的平行结构和敬拜语气；呼语“耶和华啊”置于首句中间，使中文节奏自然。
