  text: וַ/תִּתֶּן לִ/י֮ מָגֵ֪ן יִ֫שְׁעֶ֥/ךָ וִֽ/ימִינְ/ךָ֥ תִסְעָדֵ֑/נִי וְֽ/עַנְוַתְ/ךָ֥ תַרְבֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/035.yaml
  text: You gave me the shield of your salvation[a], and your right hand supported me, and your humility made me great.
translation:
  language: zh_hans
  text: 你赐给我你救恩的盾牌；你的右手扶持我；你的谦卑[a]使我强大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“温柔”或“柔和”。希伯来语这个词可表示谦卑、温柔或柔和。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: 赐给
  rationale: 该词是 נתן 的 Qal 连续式，诗中叙述上帝已经施行的作为。“赐给”既表达“给”，也符合对上帝说话时庄重自然的现代汉语。
- source_word: מָגֵן יִשְׁעֶךָ
  choice: 你救恩的盾牌
  rationale: 保留希伯来语的构造关系及“盾牌”意象；“救恩”比单指一次脱险的“拯救”含义更广。
- source_word: וִימִינְךָ
  choice: 你的右手
  rationale: 直译这一象征力量与主动帮助的圣经意象，不将其解释性改写为“你的大能”。
- source_word: תִסְעָדֵנִי
  choice: 扶持我
  rationale: סעד 表示支撑、扶助；“扶持”简洁自然，也与“右手”的具体意象相配。
- source_word: וְעַנְוַתְךָ
  choice: 你的谦卑
  rationale: 该词可表示谦卑、温柔或柔和。主文采用“谦卑”，保留经文将这一特质归于上帝时出人意料的张力；其他可行含义列入脚注。
- source_word: תַרְבֵּנִי
  choice: 使我强大
  rationale: רבה 的 Hiphil 形式表示使之增大、变得强盛或伟大。此处“使我强大”在现代汉语中自然，并能表达上帝使诗人兴盛壮大的语境含义。
theological_decisions:
- issue: 如何表达归于上帝的 וְעַנְוַתְךָ
  choice: 你的谦卑
  alternative: 你的温柔
  rationale: 希伯来词容许“谦卑、温柔、柔和”等理解。主文不因神学上的不寻常而将其弱化为较熟悉的“温柔”，而是保留上帝俯就扶助诗人的张力，并用脚注说明词义范围。
- issue: יִשְׁעֶךָ 的范围
  choice: 救恩
  alternative: 拯救
  rationale: “救恩”保留该词既可指当下解救、也可具有更广救助含义的开放性；不把它限定为某一次军事脱险。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。三个分句保留原文的并列推进及“盾牌—右手”的意象。“谦卑”因较为突兀而加脚注，避免在主文中消解原文的神学张力。
