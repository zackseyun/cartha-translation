  - severity: low
    issue: “乖曲”较罕见，且与“曲折”的搭配未能形成自然的道德性平行。
    rationale: “乖僻”是更固定、可理解的书面语，适合诗篇庄重的诗歌体，并能表达偏邪、扭曲的品性。
  - severity: low
