  text: עִם נָבָ֥ר תִּתְבָּרָ֑ר וְ/עִם עִ֝קֵּ֗שׁ תִּתְפַּתָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/026.yaml
  text: With the pure you show yourself pure[a], and with the crooked you show yourself twisted.
translation:
  language: zh_hans
  text: '向纯洁的人，你显为纯洁；

    向乖僻的人，你显为乖僻[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你显为乖僻”也可译作“你显得精明地周旋”或“你以智谋胜过乖僻的人”。希伯来文以诗歌性的对应措辞描述上帝对人的回应：他以相应、足以挫败其乖僻的方式对待乖僻的人；这不是说上帝本身在道德上乖僻。
    reason: 说明 תִּתְפַּתָּל 的可行译法，并澄清此处拟人化的对应性表达不等同于对上帝道德属性的断言。
lexical_decisions:
- source_word: נָבָר
  choice: 纯洁的人
  rationale: 该词表示纯净、清白，在这里主要具有道德含义；“纯洁”自然明白，并能与同根动词的译法形成呼应。
- source_word: תִּתְבָּרָר
  choice: 你显为纯洁
  rationale: 该词为ברר的Hitpael形式，在此表达上帝面对纯洁之人时显明自己纯洁；“显为”保留了反身、关系性的意味，也重现“纯洁／纯洁”的同根呼应。
- source_word: עִקֵּשׁ
  choice: 乖曲的人
  rationale: 该词指品性偏邪、扭曲的人。“乖曲”虽略带诗体色彩，却准确表达道德上的不正，并与下句“曲折”形成词义呼应。
- source_word: תִּתְפַּתָּל
  choice: 你显为曲折
  rationale: 该词为פתל的Hitpael形式，可指以迂回、机敏或难以捉摸的方式行事。“显为曲折”保留原文与“乖曲”相应的强烈措辞和诗歌张力，而脚注说明这并非说上帝在道德上变得乖邪。
theological_decisions:
- issue: 上帝回应乖曲之人的拟人化描述
  choice: 正文保留“你显为曲折”这一强烈而对称的表达。
  alternative: 可译为“你显出机敏”或“你以智谋胜过他”。
  rationale: 原文刻意使用对应性的诗歌语言：上帝按照人的品性回应他，并使其乖曲落空。若在正文中改成较温和的解释性译法，就会削弱“纯洁／纯洁、乖曲／曲折”的平行和原有张力；因此保留强烈措辞，并在脚注中防止读者误以为上帝本身在道德上乖邪。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语，保留希伯来诗歌的两行平行结构。“乖曲”略具诗体色彩，但在上下文中含义清楚；“显为曲折”有意保存原文的修辞冲击和神学张力，歧义由脚注说明。
