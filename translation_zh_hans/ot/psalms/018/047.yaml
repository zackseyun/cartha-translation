  text: הָ/אֵ֗ל הַ/נּוֹתֵ֣ן נְקָמ֣וֹת לִ֑/י וַ/יַּדְבֵּ֖ר עַמִּ֣ים תַּחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/047.yaml
  text: the God who gives vengeance to me and subdues peoples under me[a][b].
translation:
  language: zh_hans
  text: 那位为我复仇[a]、使众民降服[b]在我之下的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “复仇”在希伯来语中为复数，可指“复仇的行动”，也可作抽象或加强语气的用法。直译作“赐给我复仇（或报复）”。
    reason: lexical_alternative
  - marker: b
    text: 这里的动词传统上理解为“使降服”或“使臣服”，不是“说话”，尽管其形式与常译为“说话”的希伯来语动词有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: 那位……的上帝
  rationale: 定冠词与后面的分词性描述共同指向特定的一位；用“那位……的上帝”既反映希伯来语的限定形式，也符合现代汉语定语结构。
- source_word: הַנּוֹתֵן
  choice: 为我施行
  rationale: 原文直译为“赐给”，但与“报复”搭配时，汉语说“赐给我报复”生硬且含义不清；“为我施行”自然表达上帝使报复临到敌方、使诗人受益的意思。
- source_word: נְקָמוֹת
  choice: 报复
  rationale: 保留该词所表达的报复、惩罚之强烈含义，不以较柔和的“拯救”或“伸冤”取代；复数形式的抽象或加强用法在脚注说明。
- source_word: לִי
  choice: 为我
  rationale: 介词可表示接受者或受益者；结合自然汉语，以“为我”表达上帝代表诗人或使诗人受益而施行报复。
- source_word: וַיַּדְבֵּר
  choice: 使……降服
  rationale: 此处按该词在王权得胜语境中的传统和语境义译为“使……降服”，而非按常见同形词义译作“说话”。
- source_word: עַמִּים
  choice: 众民
  rationale: 表达复数的多个民族或民众群体，同时避免“万民”可能带来的绝对全称意味。
- source_word: תַּחְתָּי
  choice: 在我之下
  rationale: 保留原文以空间位置表示受统辖、被征服的隐喻。
theological_decisions:
- issue: 上帝施行报复的表述
  choice: 保留“报复”，将上帝描写为为诗人施行报复者
  alternative: 伸冤、拯救
  rationale: נְקָמוֹת明确具有报复、惩罚或报仇行动的含义；改为“伸冤”或“拯救”会弱化原文张力，并加入原文未明说的解释。
- issue: 谁施行报复
  choice: 译作“上帝为我施行报复”
  alternative: 上帝使我亲自报仇
  rationale: לִי可指接受者或受益者，原句没有明确说明诗人是否亲手执行报复；本译文避免断言诗人是直接执行者，同时脚注提供较贴近字面的表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那位……的上帝”保留诗句作为连续描述的性质；“众民”兼顾诗歌语体与普通读者的可理解性。
