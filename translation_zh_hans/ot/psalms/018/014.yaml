  yaml_path: translation/ot/psalms/018/014.yaml
  text: He sent out his arrows and scattered them[a]; he multiplied lightning bolts and threw them into confusion.
translation:
  language: zh_hans
  text: 他射出他的箭，使他们四散；又用许多闪电[a]使他们惊惶失措。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “许多闪电”或译“使闪电增多”。希伯来语中这里的词也可按动词性理解为“使增多”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 射出
  rationale: שׁלח本义为“差遣、发出”；与“箭”搭配时，现代汉语用“射出”最自然，也保留神圣战士施放武器的图景。
- source_word: חִצָּיו
  choice: 自己的箭
  rationale: חֵץ为“箭”，复数并带第三人称阳性单数后缀；译作“自己的箭”清楚指向前文的施动者。
- source_word: וַיְפִיצֵם
  choice: 使他们四散
  rationale: 该动词表示驱散、使分散；复数宾语后缀按上下文理解为仇敌。译文保留代词，不在正文中补出原文没有明说的“仇敌”。
- source_word: וּבְרָקִים
  choice: 闪电
  rationale: בְּרָקִים是“闪电、闪光”的复数。汉语“闪电”通常不以复数形态表达，且能自然承接战争性神显的意象。
- source_word: רָב
  choice: 许多
  rationale: רָב在此句法作用存在歧义，可理解为表示数量众多，也有人将其作动词性理解。正文采用自然且贴近形态的“许多”，脚注说明另一种理解。
- source_word: וַיְהֻמֵּם
  choice: 使他们惊乱
  rationale: המם在争战语境中指使人陷入震惊、慌乱或混乱。“惊乱”兼顾惊惶和阵势混乱，不把含义扩大为彻底击败。
theological_decisions:
- issue: “使他们四散”和“使他们惊乱”中复数宾语后缀的所指
  choice: 理解为上下文中的仇敌，但正文仅译“他们”
  alternative: 理解为箭或闪电被散布、射向各处
  rationale: 神圣战士图景中，箭和闪电是手段，仇敌是被驱散并扰乱的对象；这也更符合המם通常以人或军队为受事者的用法。保留“他们”可避免在正文中加入原句未明说的名词。
- issue: רָב的句法功能
  choice: 按数量修饰语理解为“许多”
  alternative: 按动词性表达理解为“他使闪电增多”或“他大发闪电”
  rationale: 辅音和形态容许不同分析，诗歌句法也较紧缩。正文选用简洁自然的数量表达，并以脚注保存动词性理解，避免消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“射出”“四散”“惊乱”保持动作鲜明，并延续神圣战士的平行意象；不直接补译“仇敌”，以保存原文代词的含蓄性。
