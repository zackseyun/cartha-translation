  text: יְקַדְּמ֥וּ/נִי בְ/יוֹם אֵידִ֑/י וַֽ/יְהִי יְהוָ֖ה לְ/מִשְׁעָ֣ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/018.yaml
  text: They confronted me in the day of my calamity[a], but Yahweh was my support.
translation:
  language: zh_hans
  text: '他们在我遭难之日迎面而来[a]，

    但雅威成了我的倚靠。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们在我遭难之日与我对峙”；也可译：“他们在我遭难之日来到我面前”。
    reason: 原词可指迎上、相遇或来到某人面前；本处上下文具有敌对意味，但动词本身没有明确说明攻击的具体方式。
lexical_decisions:
- source_word: יְקַדְּמוּנִי
  choice: 他们……迎面而来
  rationale: קדמ的Piel形式带第一人称单数宾语后缀，基本意思是来到某人面前、迎上或与之相遇；上下文带有敌对意味。“迎面而来”保留这种意味，又不把动作过度限定为直接攻击。
- source_word: בְיוֹם אֵידִי
  choice: 在我遭难之日
  rationale: אֵיד指灾祸、灾难或败亡。“遭难之日”自然凝练，保留诗歌语体，也不把灾祸缩窄为内心的愁苦。
- source_word: וַיְהִי
  choice: 但……成了
  rationale: וַיְהִי可表示“是”或“成为”。两行之间有明显反差，因此用“但”表达转折，同时以“成了”保留动态叙事色彩。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接译出上帝的专名，不以“主”这一称号代替。
- source_word: לְמִשְׁעָן לִי
  choice: 我的倚靠
  rationale: מִשְׁעָן指可供倚靠、支撑之物；“我的倚靠”在现代汉语中自然清楚，并保留诗句中获得扶持的比喻。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名，而非“主”的称号；“雅威”较直接地音译该专名，不以替代称谓消解其专名性质。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“遭难之日”保留诗歌的凝练感；“迎面而来”与脚注共同保存原动词在“来到面前”“相遇”和敌对“对峙”之间的语义张力。
