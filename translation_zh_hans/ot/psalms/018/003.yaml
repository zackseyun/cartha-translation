  text: מְ֭הֻלָּל אֶקְרָ֣א יְהוָ֑ה וּ/מִן אֹ֝יְבַ֗/י אִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/003.yaml
  text: I call on Yahweh[a], who is worthy to be praised[b], and I am saved from my enemies.
translation:
  language: zh_hans
  text: 我求告当受赞美的雅威[a]，并从我的仇敌手中得救[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文的神名 YHWH。
    reason: alternative_reading
  - marker: b
    text: 或译：“必从我的仇敌手中得救。”希伯来文动词也可按将来意义理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: 当受赞美的
  rationale: 这是动词 הלל 的被动分词，在句中描述雅威；“当受赞美的”既保留被动形式，也自然表达他配受赞美的含义。
- source_word: אֶקְרָא
  choice: 我求告
  rationale: קרא 后接神名时常指向神呼求或祷告；“求告”是现代中文中准确、庄重而易懂的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名 YHWH；“雅威”是其现代中文音译，避免以称号代替原文中的专名。
- source_word: וּמִן
  choice: 并从
  rationale: 保留连接词与介词的基本关系，将求告与获救两句相连，但不把原文未明说的因果关系强化为“所以”或“就”。
- source_word: אֹיְבַי
  choice: 仇敌
  rationale: 直接表达 אויב 加第一人称单数词尾“我的仇敌”；中文语境已由“从仇敌手中”自然表明其与诗人的关系，无须机械重复“我的”。
- source_word: אִוָּשֵׁעַ
  choice: 得救
  rationale: ישׁע 的尼法勒未完成式可表达一般性、结果性或将来意义；正文“得救”保留其核心救援含义，并以脚注说明可能的将来理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用 YHWH 这一专名，而非“主”这一称号；正文采用现代中文音译“雅威”，并用脚注交代其希伯来文形式。
- issue: אִוָּשֵׁעַ 的时体
  choice: 一般性或结果性的“得救”
  alternative: 将来性的“必得救”
  rationale: 希伯来语未完成式在诗歌语境中既可陈述通常或确信的结果，也可指向未来；正文不强限定时间，脚注保留将来意义。
- issue: 两分句之间的逻辑关系
  choice: 以“并”连接
  alternative: 以“就”表达结果
  rationale: וְ 连接求告与得救，但本身不必然明确标记因果；采用“并”可避免把隐含关系解释得过满。
translation_notes:
  register: 采用现代、庄重而通俗的诗歌语言。“当受赞美的”保留原文置于句首的评价意味；正文保持简洁，并以脚注说明神名及动词时体的真实歧义。
