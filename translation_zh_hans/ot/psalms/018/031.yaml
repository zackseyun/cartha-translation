id: PSA.18.31
reference: Psalms 18:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י מִ֣י אֱ֭לוֹהַּ מִ/בַּלְעֲדֵ֣י יְהוָ֑ה וּ/מִ֥י צ֝֗וּר זוּלָתִ֥/י אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/031.yaml
  text: For who is God besides Yahweh? And who is a rock except our God?[a]
translation:
  language: zh_hans
  text: 因为，除了雅威，谁是神呢？除了我们的神，谁是磐石呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 前一句也可译作“在雅威以外”，后一句也可译作“除我们的神之外”；原文两种不同的希伯来表达都强调排他性。
    reason: 词义替代与平行表达说明
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为此前的赞美陈明理由；保留原文的论证连接作用。
- source_word: מִי
  choice: 谁
  rationale: 原文以反问表达排他性，“谁”直接、自然，并保留修辞力度。
- source_word: אֱלוֹהַּ
  choice: 神
  rationale: 此处单数名词指真正的神，与雅威形成同位而排他的陈述；中文无需借助大小写区分。
- source_word: מִבַּלְעֲדֵי
  choice: 除了……以外
  rationale: 表达排除其他对象的意思，现代汉语正文中简洁呈现为“除了雅威”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为以色列之神专名的性质，不以称号代替。
- source_word: וּמִי
  choice: 谁
  rationale: 第二个反问与前句构成紧密平行；中文可省略生硬的句首“而”，仍由并列句式清楚表达连接。
- source_word: צוּר
  choice: 磐石
  rationale: 保留原文关于坚固、保障和庇护的具体比喻，不抽象改写为“避难所”或“保护者”。
- source_word: זוּלָתִי
  choice: 除了……以外
  rationale: 与前一排他性用语平行，表达“除……之外没有别的”。
- source_word: אֱלֹהֵינוּ
  choice: 我们的神
  rationale: 完整保留第一人称复数后缀所表达的群体与关系意味。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较贴近常见学术重建 Yahweh 的现代汉语音译“雅威”，以专名而非“主”这一称号呈现。
- issue: צוּר 作为神的比喻
  choice: 磐石
  alternative: 保障
  rationale: 希伯来文使用具体的“岩石、磐石”意象；保留比喻可呈现神的稳固、力量与保护，而不把多重意涵收窄为单一抽象解释。
- issue: 两句反问的排他性
  choice: 两句均译为“除了……谁……”
  alternative: 分别译为“在……以外”和“除……之外”
  rationale: 两种希伯来表达虽用词不同，却都传达排他性；统一句式能保留诗体平行，同时脚注说明原文措辞有别。
translation_notes:
  register: 采用自然、庄重的现代标准汉语；以两个平行反问保留希伯来诗歌的节奏和排他力度。“磐石”沿用易懂且具有圣经诗歌色彩的具体意象。
