  text: וַ/יָּֽשֶׁב יְהוָ֣ה לִ֣/י כְ/צִדְקִ֑/י כְּ/בֹ֥ר יָ֝דַ֗/י לְ/נֶ֣גֶד עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/024.yaml
  text: Yahweh repaid me according to my righteousness[b][a], according to the cleanness of my hands before his eyes.
translation:
  language: zh_hans
  text: 雅威按我的公义回报我，照我双手在他眼前的清洁回报我。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回报”也可译作“报偿”或“归还给我”。希伯来语动词在这里表示按人的行为给予相应的回报。
    reason: lexical_alternative
  - marker: b
    text: “双手的清洁”是希伯来语的形象说法，指行为清白、正直。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: 回报
  rationale: שׁוב的使役形在此带有按人的行为给予相应报偿的意思。“回报”既保留“归还、报偿”的语义范围，也不像“奖赏”那样只突出正面的奖赐。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: כְצִדְקִי
  choice: 按我的公义
  rationale: כְּ表示衡量或对应关系；צֶדֶק在此指诗人所宣称的正直、公义。直译保留经文本身的神学张力。
- source_word: כְּבֹר יָדַי
  choice: 照……我双手的清洁
  rationale: בֹּר指清洁、纯净，与“手”组成具体意象；保留这一希伯来表达，不直接释为“无辜的行为”。
- source_word: לְנֶגֶד עֵינָיו
  choice: 他眼中
  rationale: 以自然的现代汉语保留“在他眼前／眼中”的视觉意象，表达行为处于上帝察看和判断之下。
theological_decisions:
- issue: 是否弱化诗人自称“公义”并称双手清洁的说法
  choice: 保留诗人宣称上帝按其公义和双手的清洁回报他的直陈
  alternative: 改写为“忠于圣约”或仅指某件事上的相对无辜
  rationale: 希伯来文明确使用“我的公义”和“我双手的清洁”。译文不应为消除神学张力而缩窄或软化这一陈述。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。两行平行结构中重复“回报我”，使省略谓语的希伯来诗句在汉语中自然明确；“公义”和“双手的清洁”则保留原文的用词、意象与张力。
