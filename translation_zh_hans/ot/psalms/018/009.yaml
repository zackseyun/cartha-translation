base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/009.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: zh_hans
  text: 他使诸天低垂，便降临；幽暗[a]在他脚下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幽暗”也可译作“密云”或“浓密的黑暗”。
    reason: עֲרָפֶל可指浓重的黑暗，也可能带有暗云的意象；脚注保留这一词汇范围。
lexical_decisions:
- source_word: וַיֵּט
  choice: 使……低垂
  rationale: נטה可表示伸展、倾斜或压低；以“诸天”为宾语时，“使诸天低垂”自然保留天空向下弯垂、为神降临让路的诗歌意象。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 保留希伯来语诗体中的复数形式和宇宙性范围，也符合中文圣经诗歌的庄重语域。
- source_word: וַיֵּרַד
  choice: 亲自降临
  rationale: ירד本义为“下来”；在神显现的语境中，“降临”兼顾方向性与庄重感。“亲自”承接主语并使中文行文自然，但不增添新的行动内容。
- source_word: וַעֲרָפֶל
  choice: 幽暗
  rationale: עֲרָפֶל指浓密的黑暗、阴翳，也可能带有暗云意象。“幽暗”不强行限定为云，同时保留神显现时深沉、遮蔽的氛围。
- source_word: תַּחַת
  choice: 在……下
  rationale: 直接表达空间关系，与原文意象一致。
- source_word: רַגְלָיו
  choice: 他脚下
  rationale: 原文直译为“他的双脚之下”；中文惯用“他脚下”，既自然又保留具体的拟人化形象。
theological_decisions:
- issue: 神显现中的拟人化意象
  choice: 保留神使诸天低垂、降临以及幽暗在他脚下的具体图景。
  alternative: 将其意译为神介入或彰显能力。
  rationale: 原文以诗歌性的拟人描写呈现神显现；译文不把这一形象淡化为抽象解释，以保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“使诸天低垂”比“弯曲诸天”更符合现代汉语习惯；“降临”维持神显现语境的庄重感。脚注标记置于整节末尾，所注释的词为前句中的“幽暗”。
