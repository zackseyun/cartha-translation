  text: כִּֽי שָׁ֭מַרְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹֽא רָ֝שַׁ֗עְתִּי מֵ/אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/021.yaml
  text: For I have kept the ways of Yahweh[b][a], and have not wickedly departed from my God.
translation:
  language: zh_hans
  text: 因为我持守了耶和华的道路，也没有作恶，离开我的神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有因离弃我的神而作恶。”希伯来语直译近于“没有作恶，离开我的神”；“作恶”与“离开”之间的关系可有不同理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的陈述说明理由；“因为”自然保留了希伯来语连接词的论证作用。
- source_word: שָׁמַרְתִּי
  choice: 我持守了
  rationale: שׁמר有“守、遵守、保守”之意；“持守”既体现持续忠于上帝道路的含义，也符合诗歌庄重语体。
- source_word: דַּרְכֵי יְהוָה
  choice: 耶和华的道路
  rationale: דֶּרֶךְ在这里指上帝所规定的行事为人之道，而非字面道路；用“道路”保留希伯来诗歌中的核心意象。神名四字母词以现代中文通行的专名“耶和华”表达。
- source_word: וְלֹא רָשַׁעְתִּי מֵאֱלֹהָי
  choice: 没有作恶离弃我的神
  rationale: רשׁע意为“作恶、行恶”，后接表示离开的מִן短语。此译法把“作恶”与“离弃我的神”紧密相连，同时不把两者之间的语义关系限定得过死。
- source_word: אֱלֹהָי
  choice: 我的神
  rationale: 准确表达名词אֱלֹהִים所带的第一人称单数所属后缀，保留诗人与神之间的关系性表述。
theological_decisions:
- issue: 诗人对自身正直的强烈宣称是否意味着绝对无罪
  choice: 按原文保留“持守……道路”及“没有作恶离弃”的强烈陈述
  alternative: 弱化为“我努力遵行”或补入“虽然并非无罪”等解释
  rationale: 原文是在盟约关系和忠诚行为的语境中宣称正直，并未直接讨论诗人是否绝对无罪。译文不削弱其宣称，也不额外把它解释成无罪论。
- issue: רָשַׁעְתִּי与מֵאֱלֹהָי之间的关系
  choice: 译为“作恶离弃我的神”
  alternative: “因离弃我的神而作恶”或“以恶行背离我的神”
  rationale: 希伯来语可理解为“作恶而离开我的神”，也可把离弃神视为所行的恶。正文采用简洁而保留张力的表达，脚注说明另一种展开方式。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“持守”“道路”“离弃”符合现代标准汉语，也保留原文的盟约性与关系性意涵。脚注标记[a]已置于正文相应句末。
