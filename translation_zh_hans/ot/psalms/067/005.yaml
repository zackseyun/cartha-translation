base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/005.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: zh_hans
  text: 愿万民赞美你[a][b]，上帝啊；愿万民全都赞美你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“万民必赞美你，上帝啊；万民全都必赞美你。”
    reason: 保留希伯来语未完成式可作陈述或预告理解的可能性。
  - marker: b
    text: “赞美”也可译为“感谢”。
    reason: 说明希伯来语动词在此敬拜语境中的相关词义可能性。
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: 愿……赞美你
  rationale: ידה 的 Hiphil 形式在诗篇敬拜语境中常指公开称颂或感谢上帝；此处用“赞美”最贴合诗歌副歌的敬拜意味。“愿”表达上下文中自然的祈愿语气，同时不把形式本身可能具有的陈述义绝对化。
- source_word: עַמִּים
  choice: 万民
  rationale: 复数指众多族群；“万民”在现代汉语圣诗体中自然、庄重，也保留全人类各族群的普世范围。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处是对以色列之上帝的直接呼告；“啊”明确呼格功能，并保持祷告诗的自然语气。
- source_word: כֻּלָּם
  choice: 全都
  rationale: 该词强化第二分句，表示这些族群无一例外；“全都”简洁地保留其周全性，并与前句“万民”形成递进。
theological_decisions:
- issue: 重复分句的语气及话语功能
  choice: 译为祈愿：“愿万民……赞美你”
  alternative: 译为陈述或预告：“万民必赞美你”
  rationale: 希伯来语未完成式在此既可被理解为祈愿，也可能读作陈述；结合本诗副歌的祷告性质，祈愿义较自然。脚注保留陈述性读法，避免消除原文的语气张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“万民”避免将 עַמִּים 仅限于现代政治意义上的“国家”；重复结构依照原文保留，并以“全都”呈现末句的强化。
