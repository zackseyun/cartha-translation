  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִֽשְׂמְח֥וּ וִֽ/ירַנְּנ֗וּ לְאֻ֫מִּ֥ים כִּֽי תִשְׁפֹּ֣ט עַמִּ֣ים מִישׁ֑וֹר וּ/לְאֻמִּ֓ים בָּ/אָ֖רֶץ תַּנְחֵ֣/ם סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/004.yaml
  text: Let the nations be glad and sing for joy[a], for you judge the peoples with equity and guide the nations on the earth[b]. Selah
translation:
  language: zh_hans
  text: '愿列国欢喜，欢然歌唱[a]；

    因为你秉公审判万民，

    引导地上的列国[b]。

    细拉'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“欢呼”。原词可指喜乐地歌唱，也可指发出响亮的欢呼声。
    reason: lexical_alternative
  - marker: b
    text: “地上的列国”也可理解为“那地的列国”；原词既可指全地，也可指某一片土地。这里依全诗的普世范围译作“地上”。
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: 愿……欢喜
  rationale: שׂמח的Qal未完成式第三人称阳性复数在此赞美诗语境中带祈愿或号召意味；“愿……欢喜”既保留意愿语气，也符合现代汉语诗体。
- source_word: וִירַנְּנוּ
  choice: 欢然歌唱
  rationale: רנן的Piel形式可指喜乐的歌唱，也可指响亮的欢呼。“欢然歌唱”在正文中体现其喜庆而有声的意味，同时以脚注保留“欢呼”这一可行译法。
- source_word: לְאֻמִּים
  choice: 列国
  rationale: לְאֻמִּים可指各民族或列国；本诗范围遍及万邦，“列国”自然体现国际性范围，并与本节后半的同词保持一致。
- source_word: כִּי
  choice: 因为
  rationale: 引出列国欢喜歌唱的理由；“因为”在现代汉语中清楚自然。
- source_word: תִשְׁפֹּט
  choice: 审判
  rationale: שׁפט的核心是施行判断或审判。未完成式在此可表达持续、惯常或将来的行动；正文不另加时间副词，以免过度限定。
- source_word: עַמִּים
  choice: 万民
  rationale: עַמִּים指众民或各族群。译作“万民”既与“列国”有所区别，也传达普世范围。
- source_word: מִישׁוֹר
  choice: 秉公
  rationale: מִישׁוֹר本义涉及平直、正直，引申为公平公正；在审判语境中，“秉公”简洁而准确地表达按公平行事。
- source_word: בָּאָרֶץ
  choice: 地上的
  rationale: אֶרֶץ既可指全地，也可指特定土地。本诗反复提到万民和列国，正文采用普世性的“地上”，并在脚注保留较局部的理解。
- source_word: תַּנְחֵם
  choice: 引导
  rationale: נחה的Hiphil形式意为带领、引导；“引导”既可涵盖带领，也适合此处上帝治理列国的语境，不把意思限于空间移动。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切功能不明，故采用中文圣经传统音译，不强加解释。
theological_decisions:
- issue: אֶרֶץ的范围
  choice: 译作普世性的“地上”
  alternative: 译作“那地”或“境内”
  rationale: 诗篇67篇整体反复强调万民、万国，广义的“全地／地上”更符合上下文；脚注仍保留该词可作较局部理解的可能。
- issue: 未完成式动词的时体和语气
  choice: 开头译为祈愿语气“愿……”，后半不明确标出现在或将来
  alternative: 全节译为将来陈述，如“列国必……你必审判……必引导……”
  rationale: 前两个未完成式在礼仪赞美语境中自然可作祈愿或号召；后两个既可描述上帝一贯的作为，也可指向将来的施行。汉语正文避免加入“常常”或“必”等限定词，以保留原文张力。
- issue: 上帝对万民的שׁפט
  choice: 保留司法性的“审判”
  alternative: 译作较宽泛的“治理”
  rationale: “审判”保存שׁפט的核心司法含义，并与“秉公”紧密呼应；不把它弱化为一般行政管理。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以“列国／万民”区分לְאֻמִּים与עַמִּים，以“秉公审判”自然表达司法语境中的מִישׁוֹר；分行呈现希伯来诗句的平行结构。
