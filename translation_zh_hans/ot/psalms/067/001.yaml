source:
  edition: WLC
  text: אֱלֹהִ֗ים יְחָנֵּ֥/נוּ וִֽ/יבָרְכֵ֑/נוּ יָ֤אֵ֥ר פָּנָ֖י/ו אִתָּ֣/נוּ סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/001.yaml
  text: May God be gracious to us and bless us[a]; may his face shine upon us[c][b]. Selah
translation:
  language: zh_hans
  text: 愿上帝恩待我们，赐福给我们；愿他的脸光照我们[a]。（细拉）[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “光照我们”：希伯来文直译可作“与我们同在”；这里的表达呼应民数记6:24–26，尤其是“愿耶和华使他的脸光照你”。
    reason: lexical_alternative; cross_reference
  - marker: b
    text: “细拉”可能是礼仪或音乐用语，确切含义不明。
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该词虽在形态上为复数形式，但本节搭配单数动词，明确指以色列所敬拜的独一上帝；“上帝”是现代普通话中庄重自然的对应词。
- source_word: יְחָנֵּנוּ
  choice: 恩待我们
  rationale: חנן在此祈愿语境中表示施恩、厚待。“恩待我们”既保留恩惠的含义，也比“怜悯我们”更避免将语义限缩为解救苦难。
- source_word: וִיבָרְכֵנוּ
  choice: 赐福给我们
  rationale: ברך是表示赐福的常用动词；此译准确、自然，并保留礼仪性祈求的语气。
- source_word: יָאֵר
  choice: 愿……光照
  rationale: אור的使役式在此意为使之发光；配合“脸”，译作“愿他的脸光照”既贴近原文，也保留与民数记6:25祭司祝福的呼应。
- source_word: פָּנָיו
  choice: 他的脸
  rationale: 直译为“他的脸”。保留具体意象，而不释义为“临在”或“眷顾”，使原文的诗性和经文互文关系得以呈现。
- source_word: אִתָּנוּ
  choice: 我们
  rationale: 原文介词字面为“与我们同在／同我们”，但“脸发光”这一搭配表达恩宠朝向百姓。中文“光照我们”自然地传达这种指向性；字面差异以脚注注明。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切含义不明，可能是礼仪或音乐标记，因此采用汉语圣经传统音译，不作推测性释义。
theological_decisions:
- issue: 连续动词的祈愿语气
  choice: 译作祈求：“愿上帝……；愿……”
  alternative: 译作陈述，如“上帝恩待我们，赐福给我们”
  rationale: 这些动词在诗篇祝福语境中自然具有祈愿或请求意味；使用“愿”准确传达其意，并保持与以色列礼仪祝福语言的联系。
- issue: 与祭司祝福的呼应
  choice: 保留“脸光照我们”的意象
  alternative: 释义为“眷顾我们”或“向我们施恩”
  rationale: 本句明显呼应民数记6:24–26，特别是6:25。保留“脸”和“光照”可维持这一经文联系，同时不额外加入神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恩待”体现诗篇祈祷的礼仪语气；“他的脸光照我们”有意保留原文略显凝练的诗性意象。标点将“细拉”置于括号内，表明它可能是礼仪或音乐标记，而非祷告句法的组成部分。
