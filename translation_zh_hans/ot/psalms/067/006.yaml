  text: אֶ֭רֶץ נָתְנָ֣ה יְבוּלָ֑/הּ יְ֝בָרְכֵ֗/נוּ אֱלֹהִ֥ים אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/006.yaml
  text: The earth has yielded its produce[a]; God, our God[b], blesses us.
translation:
  language: zh_hans
  text: 大地[a]已有出产；上帝，我们的上帝，赐福给我们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“土地”。希伯来语 אֶרֶץ 可指“大地”，也可指“土地”。
    reason: lexical_alternative
  - marker: b
    text: 或译“愿上帝，我们的上帝，赐福给我们”，也可译“上帝，我们的上帝，必赐福给我们”。这里的希伯来语动词按语境可表达当前的事实、祈愿或将来。
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: 大地
  rationale: 本词既可指“地、土地”，也可指“大地”。鉴于本诗屡次提到万民和地极，正文采用范围较广的“大地”，同时在脚注保留“土地”这一可能。
- source_word: נָתְנָה
  choice: 已有
  rationale: 原义为“给了”。与农业出产连用时，译作“已有出产”符合现代汉语，也保留完成体所表达的既成结果。
- source_word: יְבוּלָהּ
  choice: 出产
  rationale: 指土地所出的农产或收成。“出产”不局限于某一种作物，比“五谷”或“果实”更少增添原文没有的具体含义。
- source_word: יְבָרְכֵנוּ
  choice: 赐福给我们
  rationale: 希伯来语未完成式在本语境中可表达当前事实、祈愿或将来。正文按肯定陈述理解，译为“赐福给我们”；其他可能在脚注中保留。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 在此指以色列的上帝，采用现代汉语中通行而庄重的称呼。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 直接体现第一人称复数所属关系，并保留“上帝，我们的上帝”的重复和强调。
theological_decisions:
- issue: יְבָרְכֵנוּ 的语气和时态功能
  choice: 肯定陈述：“赐福给我们”
  alternative: 祈愿：“愿上帝，我们的上帝，赐福给我们”；或将来：“上帝，我们的上帝，必赐福给我们”
  rationale: 该未完成式在语境中可作陈述、祈愿或将来理解。前句述说大地已经有了出产，支持将本句理解为对上帝赐福的肯定；但语法本身并未排除祈愿或将来含义，因此以脚注保留这种张力。
translation_notes:
  register: 采用现代、庄重而简明的诗歌语言。“大地已有出产”避免生硬直译“给了它的出产”，又不把农产过度具体化为“五谷”或“果实”。保留“上帝，我们的上帝”的重复，以呈现原文的强调。
