lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 此词在诗篇题注中通常指负责音乐演奏或指挥的人；“乐长”简洁保留其礼仪和音乐职能，介词 לַ־ 译作“交给”。
- source_word: בִּנְגִינֹת
  choice: 用弦乐器
  rationale: 该词在音乐题注中指弦乐器或弦乐伴奏；“用弦乐器”自然明确，同时保留介词 בְּ 的工具含义。“以弦乐器伴奏”也是可能的理解。
- source_word: מִזְמוֹר
  choice: 一篇诗篇
  rationale: 这是诗篇题注中的常见体裁名称；“诗篇”既符合中文圣经语域，也不额外限定其具体音乐形式。
- source_word: שִׁיר
  choice: 一首歌
  rationale: 这是一般性的歌曲体裁词；与“诗篇”分开翻译，保留希伯来文并列的双重体裁标示。
