  yaml_path: translation/ot/psalms/067/003.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: zh_hans
  text: 上帝啊，愿万民赞美你[a]；愿万民都赞美你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“万民将赞美你”。希伯来文动词在这里可理解为祈愿，也较少可能理解为将来陈述。
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: 愿……赞美你
  rationale: ידה 的 Hiphil 形式在诗篇敬拜语境中常指“赞美”或“称谢”。本节作为祈愿式副歌，用“愿……赞美你”自然传达未完成式在语境中的意愿色彩，同时保留其可作将来陈述的语法可能性。
- source_word: עַמִּים
  choice: 万族
  rationale: 该复数指多个民族或族群。“万族”在现代汉语诗歌中简洁自然，既表现复数和普世范围，也避免把词义限定为政治意义上的“国家”。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处为直接呼语；“啊”明确表达呼格，并保持庄重、自然的诗歌语体。
- source_word: כֻּלָּם
  choice: 全都
  rationale: 表达“他们全部、无一例外”的总括意义，并与前面的“万族”组成流畅的强调句式。
theological_decisions:
- issue: 赞美副歌中重复动词的语气
  choice: 译为祈愿：“愿万族……赞美你”
  alternative: “万族都要赞美你”或“让万族赞美你”
  rationale: יוֹדוּךָ 在形态上是 Hiphil 未完成式第三人称阳性复数，带第二人称阳性单数宾语后缀；在本诗礼仪性副歌中，祈愿语气最合语境。“愿”不把经文过度确定为预言式将来，也保留其祷告色彩。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。重复“愿万族……赞美你”以保存希伯来文的平行与副歌结构；第二句以“全都”对应 כֻּלָּם 的强化作用。由于正文以“愿”作出语境上最合宜但并非唯一可能的语气判断，出版时也可考虑添加脚注说明亦可译作“万族都要赞美你”。
