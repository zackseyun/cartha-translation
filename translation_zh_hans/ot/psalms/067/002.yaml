  text: לָ/דַ֣עַת בָּ/אָ֣רֶץ דַּרְכֶּ֑/ךָ בְּ/כָל גּ֝וֹיִ֗ם יְשׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/002.yaml
  text: that your way may be known on the earth[b][a], your salvation among all nations.
translation:
  language: zh_hans
  text: '好使全地[a]知道你的道路，

    万国都知道你的拯救[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“这地”；但与下句“万国”平行，较支持普世范围。
    reason: lexical_alternative
  - marker: b
    text: “拯救”也可译作“解救”或“救恩”；希伯来词可泛指施救、搭救。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: 好使……知道
  rationale: 带 ל 前缀的不定式在这里承接上一节的祈求，表达目的；用“好使……知道”既保留目的关系，也符合现代汉语表达。
- source_word: בָּאָרֶץ
  choice: 全地
  rationale: אֶרֶץ 可指“地、土地”或“大地、全地”。下半句“万国”显示此处视野遍及世界，因此译作“全地”，同时以脚注保留“这地”的可能。
- source_word: דַּרְכֶּךָ
  choice: 你的道路
  rationale: דֶּרֶךְ 本义为道路，也可指行事方式或作为；“道路”保留原文隐喻及其开放含义。
- source_word: בְּכָל גּוֹיִם
  choice: 万国
  rationale: גּוֹיִם 指众多民族或国家群体；“万国”是自然、庄重且简洁的中文表达，“万”在此表示所有而非精确数字。
- source_word: יְשׁוּעָתֶךָ
  choice: 你的拯救
  rationale: יְשׁוּעָה 可表示解救、救助或广义的拯救；“拯救”既能涵盖具体救援，也不把词义预先限定为后来的系统神学概念。
theological_decisions:
- issue: אֶרֶץ 在普世颂赞语境中的范围
  choice: 全地，即普世范围
  alternative: 这地，即较局部的土地
  rationale: 与下半句“万国”的平行关系支持普世范围；脚注仍保留该词可作局部理解的真实词义可能。
- issue: יְשׁוּעָה 的神学与语义广度
  choice: 拯救
  alternative: 救恩；解救；胜利
  rationale: “拯救”能同时表达具体搭救和较宽泛的施救行动，避免把原词仅限于后来的教义术语，也不排除其神学深度。
- issue: 上下两行的句法关系
  choice: 在第二行补出“使……知道”
  alternative: 只在第一行使用一个统领全句的“知道”
  rationale: 希伯来诗句由一个不定式统领两个并列宾语；中文补出谓语能清楚呈现两个平行分句，而不改变其目的结构。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。以两行平行结构呈现希伯来诗歌；重复“使……知道”是为中文清晰自然。“万国”沿用常见圣经语域，但现代读者也容易理解。
