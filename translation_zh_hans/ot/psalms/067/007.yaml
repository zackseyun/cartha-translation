  text: God will bless us[a], and all the ends of the earth will fear him.
translation:
  language: zh_hans
  text: 上帝必赐福给我们；地极都要敬畏他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”也可译作“惧怕他”或“在他面前肃然起敬”。希伯来语原词以神为对象时，可同时包含惧怕和敬畏之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרְכֵנוּ
  choice: 必赐福给我们
  rationale: 该词是 ברך 的 Piel 未完成式，带第一人称复数宾语后缀。结合本诗结尾的语境，译作带确信意味的将来陈述“必赐福给我们”，同时承认其在更广语境中也可能具有祈愿色彩。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 尽管词形为复数形式，这里所指为独一的上帝；“上帝”是现代标准汉语中自然、庄重且不偏向特定宗派的称呼。
- source_word: וְיִירְאוּ
  choice: 都要敬畏
  rationale: ירא 以神为对象时兼有惧怕、尊崇和肃然起敬之意。“敬畏”在汉语中能较完整地保留这种复合含义，而不将其弱化为一般尊敬。
- source_word: אֹתוֹ
  choice: 他
  rationale: 第三人称阳性单数宾语代词回指 אֱלֹהִים，故译为“他”。
- source_word: כָּל
  choice: 都
  rationale: 此词修饰后面的集合性地理表达；汉语用“都”自然表达无一例外的整体范围。
- source_word: אַפְסֵי אָרֶץ
  choice: 大地四极
  rationale: 该组合表示大地最遥远的边缘或各个尽头。“大地四极”保留诗意和空间广度，也清楚表达全世界最远之处。
theological_decisions:
- issue: ירא 指向上帝时的含义
  choice: 敬畏他
  alternative: 惧怕他；在他面前肃然起敬
  rationale: 原词包含恐惧、敬重、惊畏与顺服之间的张力。“敬畏”是现代汉语圣经语域中自然而不失分量的对应，并未把含义缩减为单纯的尊敬。
- issue: 未完成式 יְבָרְכֵנוּ 的语气
  choice: 必赐福给我们
  alternative: 愿赐福给我们；赐福给我们
  rationale: 本节作为诗篇结语，较自然地表达确信或结果，因此采用“必”；但希伯来诗歌中的未完成式仍容许祈愿式理解，此处不据此建立额外的神学结论。
translation_notes:
  register: 采用现代标准普通话和庄重的诗歌语体。“大地四极”比口语化的“世界各地”更贴近原文的空间意象；分号呈现两小句之间由上帝赐福而引向普世敬畏的关系。脚注标记置于相关词句之后。
