  text: שָׁלַ֤ח אֹת֣וֹת וּ֭/מֹפְתִים בְּ/תוֹכֵ֣/כִי מִצְרָ֑יִם בְּ֝/פַרְעֹ֗ה וּ/בְ/כָל עֲבָדָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/009.yaml
  text: He sent signs and wonders into your midst[a], O Egypt[b], against Pharaoh and against all his servants.
translation:
  language: zh_hans
  text: 他在你中间，埃及啊[a]，向法老和他所有的臣仆施行神迹奇事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用阴性单数的“你”直接称呼埃及，把这个国家人格化。也可译作“在你里面，埃及啊”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作“在法老和他所有臣仆身上”。这里的介词可表示这些神迹奇事所及的对象；也可按上下文译作“针对法老和他所有的臣仆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: 降
  rationale: 此处回顾上帝使神迹奇事临到埃及；汉语用“降在”自然表达其施行与临到，同时保留上帝为承前省略主语的结构。
- source_word: אֹתוֹת וּמֹפְתִים
  choice: 神迹奇事
  rationale: 这一固定搭配准确传达“记号与奇事”；“神迹奇事”是现代汉语圣经语体中清楚、庄重而易懂的表达，且不把 מֹפְתִים 单独窄化为某一种超自然事件。
- source_word: בְּתוֹכֵכִי
  choice: 在你中间
  rationale: 保留 בְּתוֹךְ 加第二人称阴性单数后缀所表达的“在你中间”，并借后面的呼语显明埃及被人格化、直接受话。
- source_word: מִצְרָיִם
  choice: 埃及啊
  rationale: 该词在第二人称阴性单数后缀之后构成直接呼语；“啊”自然显出希伯来诗歌中对埃及的拟人化称呼。
- source_word: בְּפַרְעֹה
  choice: 临到法老
  rationale: 介词 בְּ 在此可表示神迹奇事作用于法老；“临到”既保留较直译的空间意象，也能在上下文中表达灾祸性的影响，而不强行限定为“攻击”。
- source_word: וּבְכָל עֲבָדָיו
  choice: 和他所有的臣仆
  rationale: עֲבָדָיו 可指奴仆、臣仆或官员；在法老宫廷语境中，“臣仆”较宽泛，兼顾隶属和侍奉关系，又避免将其一概限定为奴隶或官员。
