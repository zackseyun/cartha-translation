  text: לְ/סִיח֤וֹן מֶ֤לֶךְ הָ/אֱמֹרִ֗י וּ֭/לְ/עוֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן וּ֝/לְ/כֹ֗ל מַמְלְכ֥וֹת כְּנָֽעַן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/011.yaml
  text: to Sihon king of the Amorites, and to Og king of Bashan, and to all the kingdoms of Canaan.
translation:
  language: zh_hans
  text: 就是亚摩利人的王西宏、巴珊王噩，以及迦南所有的国。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסִיחוֹן
  choice: 西宏
  rationale: 介词לְ承接上一节“击杀”的宾语，在汉语中无需另译“向/给”；人名按现代中文圣经通行形式音译为“西宏”。
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: 亚摩利人的王
  rationale: 定冠词加族称指亚摩利族群；译作“亚摩利人的王”既贴近结构，也符合自然汉语。
- source_word: וּלְעוֹג
  choice: 噩
  rationale: 连词译意由列举结构表达，介词לְ继续标示上一节动词的宾语，汉语不必重复；专名采用通行译名“噩”。
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: 巴珊王
  rationale: 这是“巴珊之王”的领地称号；“巴珊王”简洁、自然，并保留原文含义。
- source_word: וּלְכֹל
  choice: 以及……所有的
  rationale: וּ译为递进列举的“以及”；לְ所标示的宾语关系由汉语句法承接，כֹל译为“所有的”。
- source_word: מַמְלְכוֹת
  choice: 国
  rationale: 复数形式指多个王国或政权；“所有的国”在汉语中已明确表达复数总体，简洁而庄重。
- source_word: כְּנָעַן
  choice: 迦南
  rationale: 地名采用现代中文圣经通行译名“迦南”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的诗篇用语。本节在希伯来文中是承接上一节动词的宾语清单，因此以“就是”明确其续接关系，不机械重复希伯来介词。保留三个并列对象及其递进节奏。
