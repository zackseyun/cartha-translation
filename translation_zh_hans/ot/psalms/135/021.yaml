  text: בָּ֘ר֤וּךְ יְהוָ֨ה מִ/צִּיּ֗וֹן שֹׁ֘כֵ֤ן יְֽרוּשָׁלִָ֗ם הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/021.yaml
  text: Blessed be Yahweh from Zion[a], who dwells in Jerusalem. Hallelujah!
translation:
  language: zh_hans
  text: 愿耶和华从锡安受称颂；他住在耶路撒冷。哈利路亚[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你们要赞美雅（Yah）！”“雅”是耶和华这一神名的短式；“哈利路亚”是这一表达的传统音译。
    reason: 说明 הַלְלוּ־יָהּ 的复数祈使语义、神名短式及传统音译。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 愿……受称颂
  rationale: 被动分词用于颂赞公式；汉语用“愿……受称颂”既保留祝颂语气，也比单说“有福”更符合此处对上帝的颂赞。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: מִצִּיּוֹן
  choice: 从锡安
  rationale: 介词 מִן 的通常意义是“从”；这里保留其空间起点含义，让锡安成为称颂发出的地方，而不改译为“在锡安”。
- source_word: שֹׁכֵן
  choice: 他住在
  rationale: שכן 的 Qal 分词表示“居住”；用独立分句自然表达其对耶和华的同位说明，不加入原词未明说的“坐王位”。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用该地名通行的现代汉语译名。
- source_word: הַלְלוּ יָהּ
  choice: 你们要赞美耶和华
  rationale: 复数祈使式 הַלְלוּ 加神名短式 יָהּ，直译其呼召会众赞美的意义；中文不必借用音译“哈利路亚”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名；译作中文传统且广为人知的专名“耶和华”，避免以称号“主”取代专名。
- issue: “从锡安”的句法归属
  choice: 修饰“受称颂”
  alternative: 理解为耶和华从锡安施福，或将其地点意义弱化为“在锡安”
  rationale: 按希伯来语词序和 מִן 的通常用法，最自然地表达称颂从锡安发出；同时不扩写原文没有明确说明的施福动作。
- issue: 分词 שֹׁכֵן 与前句的关系
  choice: 以“他住在耶路撒冷”作同位性说明
  alternative: “住在耶路撒冷的耶和华”
  rationale: 两种分析意义接近；独立分句既保持分词对耶和华的描述作用，又使现代汉语庄重自然。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪性语言。“愿……受称颂”保留颂赞公式；分号使“从锡安受称颂”与“住在耶路撒冷”两个相关而不同的陈述层次清楚。脚注标记置于其所解释的末句之后。
