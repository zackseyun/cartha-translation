  text: כִּֽי יָדִ֣ין יְהוָ֣ה עַמּ֑/וֹ וְ/עַל עֲ֝בָדָ֗י/ו יִתְנֶחָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/014.yaml
  text: For Yahweh will vindicate his people[b][a], and he will have compassion on his servants.
translation:
  language: zh_hans
  text: 因为耶和华必为他的子民伸冤[a]，也必怜悯他的仆人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必审判他的子民。”希伯来语动词可泛指审判；这里很可能指作出有利于他们的裁决，因此译作“伸冤”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“必就他的仆人改变心意。”这里的希伯来语动词也可表示止息原定行动，或因怜悯而转意。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明理由；现代汉语中“因为”能自然表达此处的因果关系。
- source_word: יָדִין
  choice: 必为……伸冤
  rationale: דין 本义可指审判；在此与“他的子民”连用，并与下半句的怜悯相呼应，侧重耶和华作出有利于其子民的判断，即为他们伸冤。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，保留其作为专名的性质，而非以称号代替。
- source_word: עַמּוֹ
  choice: 他的子民
  rationale: 表达属耶和华之群体的盟约性称谓；“子民”在庄重而自然的现代中文中贴合诗篇语域。
- source_word: וְעַל
  choice: 也……他的
  rationale: 介词 עַל 与 נחם 构成搭配，表示对某人产生怜悯或为其而回心转意；中文将其自然融入“怜悯他的仆人”。
- source_word: עֲבָדָיו
  choice: 他的仆人
  rationale: עבד 可指奴仆或仆人；这里指服事耶和华的人，以“仆人”最符合诗篇语境。
- source_word: יִתְנֶחָם
  choice: 必怜悯
  rationale: נחם 的尼法勒式在此可表达动了怜悯之心，也可表示回心转意、不再施行原定行动；正文采用符合上下文的“怜悯”，并以脚注保留“回心转意”的可能。
theological_decisions:
- issue: יִתְנֶחָם 用于上帝时所含的拟人性及语义张力
  choice: 必怜悯
  alternative: 必为他的仆人回心转意／必因他的仆人而改变心意
  rationale: 上下文强调上帝眷顾自己的子民，“怜悯”准确传达其恩慈回应，又不暗示上帝为道德错误而悔改；同时脚注保留希伯来词“回心转意、止息原定行动”的真实语义范围。
- issue: יָדִין 是中性审判还是有利裁决
  choice: 必为他的子民伸冤
  alternative: 必审判他的子民
  rationale: 该动词本身可泛指审判，但本节平行结构及申命记32:36的近似经文支持有利于其子民的裁决；脚注保留较字面的译法，避免抹去词义张力。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“耶和华”保留神名的专名性质；“伸冤”与“怜悯”兼顾诗歌简洁度和上下文语义。正文脚注标记按相关词语顺序置于其后。
