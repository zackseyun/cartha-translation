id: PSA.135.5
reference: Psalms 135:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י אֲנִ֣י יָ֭דַעְתִּי כִּי גָד֣וֹל יְהוָ֑ה וַ֝/אֲדֹנֵ֗י/נוּ מִ/כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/005.yaml
  text: For I know that Yahweh is great[b][a], and our Lord is above all gods.
translation:
  language: zh_hans
  text: 因为我知道，雅威[b]伟大；我们的主高过万神[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可合译为：“雅威——我们的主——比万神都伟大。”希伯来语中的比较结构直译近于“从万神”，表示胜过或优于万神。
    reason: lexical_alternative
  - marker: b
    text: “雅威”译自神的名字YHWH；下文“我们的主”则译自另一个希伯来词，意思是“我们的主、我们的主人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 句首的连接词承接上文，说明赞美雅威的理由；“因为”自然表达其解释性作用。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 希伯来语完成式在这里表达已经确立并持续有效的认识，现代汉语用现在时“我知道”最自然。
- source_word: כִּי
  choice: （不单独译出）
  rationale: 第二个כִּי引出“知道”的内容；汉语“我知道，……”本身即可自然引出宾语从句，无须机械添加“就是”。
- source_word: גָדוֹל
  choice: 伟大
  rationale: 该形容词首先直接陈述雅威的伟大；“伟大”比单说“大”更符合现代汉语中描述神尊荣、能力与地位的庄重语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按该希伯来专名较通行的现代拟音译出，以保留其作为神圣名字的性质，而不以“主”这一称号代替。
- source_word: אֲדֹנֵינוּ
  choice: 我们的主
  rationale: 名词意为“主、主人”，并带第一人称复数后缀；“我们的主”准确保留称号及所属关系。
- source_word: מִכָּל
  choice: 高过万
  rationale: 介词מִן在此表示比较和优越；“高过”是自然、庄重的汉语表达。“万”在“万神”中表示所有，而非确数一万。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处为复数，指雅威所超越的一切神明或神性存在；“万神”直接保留原文的比较与论战张力，不替文本裁定这些神的本体地位。
theological_decisions:
- issue: 神圣名字יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；以“耶和华（雅威）”或“上主”表示
  rationale: 原文使用专名而非称号；“雅威”较直接反映YHWH通常重构的读音，并使它与下半句的称号“我们的主”清楚区分。
- issue: 末尾אֱלֹהִים的所指
  choice: 万神
  alternative: 一切神明；一切神性存在
  rationale: “万神”保留复数与雅威至高无上的比较关系，同时不超出原文，断言这些对象究竟是真实的神性存在还是受人敬拜的虚假神明。
- issue: 比较关系的句法范围
  choice: 分别译为“雅威伟大；我们的主高过万神”
  alternative: 合译为“雅威——我们的主——比万神都伟大”
  rationale: 马所拉重音支持在“雅威”后形成分句停顿，故正文保留两个平行陈述；但希伯来语比较短语也可理解为修饰“伟大”，因此在脚注列出合译可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万神”是凝练的诗歌用语，意为“一切神”；分号呈现希伯来诗句中两个紧密相关而又可区分的陈述。
