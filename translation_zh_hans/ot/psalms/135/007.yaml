  text: מַֽעֲלֶ֣ה נְשִׂאִים֮ מִ/קְצֵ֪ה הָ֫/אָ֥רֶץ בְּרָקִ֣ים לַ/מָּטָ֣ר עָשָׂ֑ה מֽוֹצֵא ר֝וּחַ מֵ/אֽוֹצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/007.yaml
  text: He makes clouds rise from the ends of the earth[a]; he makes lightning for the rain[c][b]; he brings out the wind from his storehouses.
translation:
  language: zh_hans
  text: 他使云彩从地的尽头升起[a]，为降雨造闪电[b]，又从他的库房里放出风[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “云彩”或译“水汽”或“云雾”。原词可指升腾的水汽；在雨、闪电和风的语境中，“云彩”较为贴切。
    reason: lexical_alternative
  - marker: b
    text: “为降雨造闪电”也可译作“使闪电伴随雨”。原文介词可表示目的，也可表示两者的关联。
    reason: source_ambiguity
  - marker: c
    text: “库房”也可译作“宝库”。这里以储藏并释放风的图像描写上帝对风的掌管。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה
  choice: 使……升起
  rationale: 这是עלה的使役分词，表达使某物上升；“使……升起”既保留使役意义，也符合现代汉语。
- source_word: נְשִׂאִים
  choice: 云彩
  rationale: 该词可指升腾的水汽或云雾；本节与雨、闪电和风并列，“云彩”最自然地表达这里的气象含义，同时以脚注保留“水汽、云雾”的可能。
- source_word: מִקְצֵה הָאָרֶץ
  choice: 从地极
  rationale: 希伯来语字面为“从地的尽头”，在诗歌中指大地遥远的边际；“地极”简洁、庄重，并可自然表达集合性的广大范围。
- source_word: בְּרָקִים
  choice: 闪电
  rationale: 希伯来语采用复数形式，现代汉语通常以集合性名词“闪电”表达，无须机械译出复数。
- source_word: לַמָּטָר
  choice: 为雨
  rationale: 介词ל可表示目的或关联；正文采用较贴近原文的“为雨”，脚注保留“使闪电伴随雨”的关系性理解。
- source_word: עָשָׂה
  choice: 造出
  rationale: 该动词形式上是完成式，但在诗歌中描述上帝一贯的创造治理行动；汉语用无时态标记的“造出”可与前后分词协调。
- source_word: מוֹצֵא
  choice: 放出
  rationale: 这是יצא的使役分词。结合“库房”的意象，“放出”清楚表达从储藏之处释放出来的动作。
- source_word: רוּחַ
  choice: 风
  rationale: 云、雨、闪电和库房构成气象语境，因此此处明确指“风”，而非“灵”或“气息”。
- source_word: מֵאֹצְרוֹתָיו
  choice: 从他的库房里
  rationale: 该名词可指库房或宝库；在储存并释放风的具体诗歌意象中，“库房”更自然清楚。
theological_decisions:
- issue: 诗句描述的是上帝过去的作为，还是一贯的创造治理
  choice: 译作不限定时间、可表达持续性和常态性的行动
  alternative: 按עָשָׂה的完成式明确译成过去时“造了”
  rationale: 本节处于赞美诗对耶和华统管受造界的描述中，前后两个动词又是分词；现代汉语正文不添加“曾”或“正在”，既能表达他一贯的作为，也不抹去希伯来语动词形式的差异。
- issue: לַמָּטָר所表达的闪电与雨之间的关系
  choice: 正文保留较直译且略有张力的“为雨造出闪电”
  alternative: 解释性地译为“使闪电伴随雨”
  rationale: 介词ל可能表达目的或较宽泛的关联。正文不把这种关系限定为单一解释，脚注提供自然的关系性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“云彩”“闪电”“风”保持气象图景清楚；“地极”保留诗歌的广阔感；“库房”延续原文具体而富有想象力的储藏意象。
