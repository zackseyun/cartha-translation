  text: כִּֽי יַעֲקֹ֗ב בָּחַ֣ר ל֣/וֹ יָ֑הּ יִ֝שְׂרָאֵ֗ל לִ/סְגֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/004.yaml
  text: For Yah has chosen Jacob for himself[a], Israel as his treasured possession.
translation:
  language: zh_hans
  text: 因为耶和华[a]拣选雅各归自己，选以色列作自己珍爱的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“雅”（Yah），是神名的短式。
    reason: 说明原文所用神名的特殊短式，保留其词汇和诗歌形式上的信息。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词在这里引出前文赞美与劝勉的理由；“因为”清楚保留其因果作用。
- source_word: בָּחַר
  choice: 拣选
  rationale: 准确表达“选择、选取”，并符合庄重而自然的现代汉语圣经语体。希伯来语完成式所表达的既成拣选，在上下文中仍有持续效力，无须另加时态词。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用通行中文专名；此处指与“以色列”平行的立约群体。
- source_word: לּוֹ
  choice: 归自己
  rationale: 介词加第三人称后缀表示归属或利益关系；“归自己”自然地传达雅各被选为特别属于上帝的子民。
- source_word: יָהּ
  choice: 耶和华[a]
  rationale: 原文是神名的短式 Yah。正文采用现代中文读者熟悉的神名“耶和华”，脚注说明原文的短式，以兼顾可读性与形式精确性。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用通行中文专名；与“雅各”同指上帝的子民。
- source_word: לִסְגֻלָּתוֹ
  choice: 作自己珍爱的产业
  rationale: סְגֻלָּה 指君王所珍视、特别归其所有的财产。“珍爱的产业”同时保留珍贵与专属归属两层含义；“作”表达介词 לְ 在此处的身份或结果关系。
theological_decisions:
- issue: 神名短式 יָהּ 的译法
  choice: 正文译“耶和华”，脚注注明原文为短式“雅”（Yah）
  alternative: 正文直接音译为“雅”或“雅威”
  rationale: 原文确实使用神名短式，而不是完整的四字神名。正文用中文读者熟悉的“耶和华”避免生硬和误解，脚注则明确保存原文在形式和诗歌色彩上的特点。
- issue: סְגֻלָּה 所表达的立约归属
  choice: 珍爱的产业
  alternative: 特殊的产业；珍宝；宝贵的所有物
  rationale: 该词既含珍贵之意，也强调特别归属。译文保留这两层含义，但不额外加入特定宗派对拣选或圣约的解释。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“拣选雅各归自己”保留原文的归属关系；第二个“拣选”由平行结构补出，使中文句法自然，同时不改变原意。
