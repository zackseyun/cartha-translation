  text: who struck down the firstborn of Egypt[b][a], from man to beast.
translation:
  language: zh_hans
  text: 他击杀了埃及所有头生的[a]，连人带牲畜。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击杀”也可译作“击打”；这里按埃及头生者死亡的语境译出其致命含义。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“从人到牲畜”，表示人和牲畜都包括在内。
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: 他击杀了
  rationale: 关系词与使役词干完成式承接上文对耶和华作为的叙述。נכה本义可泛指击打，但此处指埃及头生者之死，因此用“击杀”准确表达语境中的致命含义。
- source_word: בְּכוֹרֵי
  choice: 一切头生的
  rationale: 该词是“头生者”的复数构造形式，集合性地涵盖人和牲畜；“头生的”比只适用于男性后代的“长子”范围更准确。
- source_word: מִצְרָיִם
  choice: 埃及
  rationale: 保留希伯来文地名所有关系，译为“埃及一切头生的”，自然表达属于埃及境内的头生者。
- source_word: מֵ/אָדָם
  choice: 从人
  rationale: 此处אָדָם与牲畜对举，指人类而非特定性别，故译作“人”。
- source_word: עַד
  choice: 到
  rationale: 与前置词מִן共同构成“从……到……”的范围表达，强调所涉及的类别完整。
- source_word: בְּהֵמָה
  choice: 牲畜
  rationale: 此处与埃及头生者被杀的灾祸背景相符，指家养的大型动物；“牲畜”在现代汉语中比“走兽”自然，也比泛称“动物”更贴合语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“头生的”保留原文可同时指人和牲畜的集合表达，避免用“长子”将范围不必要地限于男性人类；正文保留“从人到牲畜”的希伯来语范围结构。
