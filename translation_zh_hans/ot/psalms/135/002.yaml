revisions:
- from: 就是你们这些站在雅威殿中[a]、站在我们上帝殿院里[b]的人。
  to: 你们这些站在雅威的殿中、在我们上帝殿的院中的人。
  rationale: 修订保留关系从句对上一节的承接、雅威的专名、两个“家/殿”的平行以及“我们的上帝”的群体所属。以单一“站在”统摄两个地点短语，删去无对应的“就是”，并调整为自然的现代汉语所属结构。脚注相应说明“家”的字面表达及“院”的复数形式。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:51:55Z'
review_pass:
  verdict: revise
  source_fidelity: 原文由关系词加分词构成，承接上一节对雅威仆人的称呼。草稿正确传达了“站立/侍立”、雅威的名及“我们的上帝”，但将一个“站立”重复为两个，中文虽可理解，却弱化了原文由一个分词统摄两个地点短语的结构。
  naturalness: “雅威殿中”“我们上帝殿院里”的定中组合不够自然；“就是”也为原文所无，且在脱离上一节时略显突兀。改为“雅威的殿中”“我们上帝殿的院中”，语义清楚、语体庄重，并保留本节作为承接上文的片段性质。
  terminology: “雅威”准确对应יהוה；“上帝”可自然对应אֱלֹהֵינוּ。“殿”在此作为“家”的语境性表达可以接受，但应以脚注交代原文直译及其指向圣殿的含义。“院”准确表达复数חַצְרוֹת所指的圣殿院落；中文不必强行逐一标出复数。
  issues:
  - severity: medium
    issue: 重复使用“站在”
    rationale: 希伯来文只有一个分词עֹמְדִים，后面的两个介词短语共同受其支配。中文以一个“站在”统摄两处更贴近原文的句法与平行结构。
  - severity: medium
    issue: “雅威殿中、我们上帝殿院里”搭配生硬
    rationale: 现代汉语中在专名和所属名词之间加入“的”，并说“殿的院中”，更清楚自然，也避免“上帝殿院”被误解为固定建筑名称。
  - severity: low
    issue: “就是”属不必要的补充
    rationale: 关系从句本身只是在界定上一节所称呼的对象，并无强调性的“就是”；删去可避免添加语气。
  revised_text: 你们这些站在雅威的殿中、在我们上帝殿的院中的人。
  revised_footnotes:
  - marker: a
    text: 原文直译“雅威的家”；这里指圣殿。
    reason: cultural_note
  - marker: b
    text: “院”也可译作“庭院”；原文为复数。
    reason: lexical_alternative
  revision_rationale: 修订保留关系从句对上一节的承接、雅威的专名、两个“家/殿”的平行以及“我们的上帝”的群体所属。以单一“站在”统摄两个地点短语，删去无对应的“就是”，并调整为自然的现代汉语所属结构。脚注相应说明“家”的字面表达及“院”的复数形式。
