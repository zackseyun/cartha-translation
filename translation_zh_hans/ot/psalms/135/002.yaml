  yaml_path: translation/ot/psalms/135/002.yaml
  text: who stand in the house of Yahweh[b][a], in the courts of the house of our God.
translation:
  language: zh_hans
  text: 你们这些站在雅威的殿中、在我们上帝殿的院中的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁעֹמְדִים
  choice: 就是你们这些站在……的人
  rationale: 关系词 שֶׁ 与分词 עֹמְדִים 承接上一节所称呼的人。中文用“你们这些站在……的人”自然地保留关系从句及分词所表达的持续、身份性意味；“就是”使本节作为承接上文的片段在中文中更顺畅。
- source_word: בְּבֵית
  choice: 在……殿中
  rationale: בַּיִת 本义为“房屋、家”，在此特指雅威的圣所。译作“殿”既符合圣殿语境，也比直译“房屋”更符合现代汉语；脚注说明其范围并不限于殿内建筑。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是以色列上帝的专名四字神名，而非普通称号；采用现代汉语中直接音译的“雅威”。
- source_word: בְּחַצְרוֹת
  choice: 在……殿院里
  rationale: חָצֵר 的复数在圣殿语境中指圣所建筑周围的院落或庭院。“殿院”简洁自然，并保留其复数可统称多个院落的含义。
- source_word: בֵּית אֱלֹהֵינוּ
  choice: 我们上帝殿
  rationale: 保留“我们的上帝”这一群体归属关系，并以“殿”对应重复出现的 בֵּית，使希伯来诗句的平行结构在中文中仍可辨认。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名 יְהוָה。译作“雅威”可明确区分专名与“主”这一称号，也避免以替代称谓消除原文的专名用法。
- issue: בֵּית 在圣殿语境中的范围
  choice: 正文译“殿”，脚注说明可涵盖圣所及其附属区域
  alternative: 房屋；圣殿
  rationale: 单译“房屋”在现代汉语中容易误解为普通住宅；“殿”自然体现宗教建筑语境，同时脚注保留原词“房屋”的意象和较宽范围。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语言。本节在希伯来文中是承接上一节的关系从句；中文加入“就是你们这些……的人”以显明句法衔接，并以两个“站在”保留原文的平行节奏。
