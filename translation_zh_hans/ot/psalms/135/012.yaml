  text: וְ/נָתַ֣ן אַרְצָ֣/ם נַחֲלָ֑ה נַ֝חֲלָ֗ה לְ/יִשְׂרָאֵ֥ל עַמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/012.yaml
  text: And he gave their land as an inheritance[a], an inheritance to Israel his people.
translation:
  language: zh_hans
  text: 又把他们的地赐作产业[a]，赐给他的子民以色列作产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基业”。希伯来文重复“产业”一词，以示强调。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: 又把……赐作
  rationale: וְ连接前文的颂赞叙述，נָתַן为过去时态的叙事动作；“又”自然承接上文，“赐”比一般的“给”更符合庄重语域。
- source_word: אַרְצָם
  choice: 他们的地
  rationale: אֶרֶץ在此指前文被击败的诸王和列国之土地；“他们的地”简洁保留第三人称复数后缀。
- source_word: נַחֲלָה
  choice: 作产业
  rationale: 此词在נתן之后表所赐土地的身份或用途；“产业”兼具承受、分得并长久持有之意，适合这里的土地分配语境。
- source_word: נַחֲלָה
  choice: 作产业
  rationale: 原文第二次出现同一词，形成强调性的诗歌重复；译文在后半句再次译出“作产业”，不予省略。
- source_word: לְיִשְׂרָאֵל
  choice: 赐给……以色列
  rationale: לְ标明领受者或受益者；结合汉语句法补出“赐给”，清楚表达以色列是领受者。
- source_word: עַמּוֹ
  choice: 他的子民
  rationale: עַם在此表示属于上帝的百姓；“子民”庄重自然，并能表达归属关系，而不另加宗派性解释。
theological_decisions:
- issue: נַחֲלָה的诗歌重复
  choice: 在正文中两次译出“作产业”
  alternative: 为使汉语更简洁，只保留一次“产业”
  rationale: 原文有意重复נַחֲלָה以加强语意；保留重复能体现诗歌强调及土地作为所赐产业的分量，同时不进一步解释其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。通过“赐作产业……赐给……作产业”的句式保留原文重复，同时调整语序，使汉语自然清楚。
