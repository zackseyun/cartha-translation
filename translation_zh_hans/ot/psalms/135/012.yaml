  naturalness: “又把他们的地赐作产业，赐给他的子民以色列作产业”虽带有与原诗相称的庄重、重复句式，但在现代标准汉语中仍清楚可懂。“赐作产业”与“赐给……作产业”的平行也有效呈现诗歌强调。
