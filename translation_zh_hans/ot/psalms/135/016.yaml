  text: פֶּֽה לָ֭/הֶם וְ/לֹ֣א יְדַבֵּ֑רוּ עֵינַ֥יִם לָ֝/הֶ֗ם וְ/לֹ֣א יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/016.yaml
  text: They have mouths[a], but do not speak; they have eyes, but do not see.
translation:
  language: zh_hans
  text: 它们有口，却不说话；有眼，却不看见。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּה
  choice: 口
  rationale: 原文为单数“口”，与复数代词“它们”构成分配性表达，意为这些偶像各自有口。现代汉语用“它们有口”自然、凝练，也无须改成复数形式。
- source_word: לָהֶם
  choice: 它们有
  rationale: 介词 לְ 加复数代词后缀在这里构成领属结构，直译为“对它们有”，按现代汉语习惯译作“它们有”。
- source_word: יְדַבֵּרוּ
  choice: 不能说话
  rationale: דבר 的 Piel 形式意为“说话”。虽然原文形式上是简单否定“并不说话”，但在无生命偶像的语境中表达器官不具功能；汉语“不能说话”自然传达该对比，而不另加神学解释。
- source_word: עֵינַיִם
  choice: 眼
  rationale: 原词是双数形态，指双眼。汉语在领属结构中通常说“有眼”，无需显式标复数。
- source_word: יִרְאוּ
  choice: 不能看见
  rationale: ראה 的 Qal 形式通常意为“看见”。结合偶像有眼却不起作用的语境，译作“不能看见”符合自然汉语，并保留具体感官意象。
theological_decisions:
- issue: 对偶像拟人化器官的讽刺
  choice: 保留“有口／有眼”与“不能说话／不能看见”的鲜明对照，不添加对其无能或虚假的解释。
  alternative: 译作“有口，却不说话；有眼，却看不见”，更贴近希伯来文简单否定的形式。
  rationale: 本节以不能发挥功能的身体器官讽刺偶像。正文应保留具体意象及其张力，不把隐含的神学判断扩写进译文。中文用“不能”较自然地表现无生命偶像的功能缺失，但不进一步解释其原因。
translation_notes:
  register: 采用现代、庄重而易懂的汉语；沿用诗歌式对偶，以“却”突出反差。“口”“眼”使用汉语常见的无量词表达，使句式简洁有力。
