  yaml_path: translation/ot/psalms/135/013.yaml
  text: Yahweh, your name endures forever; Yahweh, your renown[a] endures from generation to generation.
translation:
  language: zh_hans
  text: 雅威，你的名永远长存；雅威，你的声名传到万代。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留经文直接称呼上帝之名的形式；现代汉语中用逗号即可自然表达呼语，无须增添“啊”。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 直译“你的名”，既可指神名本身，也保留名声、声誉等语义内涵。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 希伯来语分句没有明示动词；补出“长存”，自然表达时间短语所含的持续意义。
- source_word: זִכְרְךָ
  choice: 你的声名
  rationale: 该词可指记念、纪念或因被记念而流传的名声；在与“你的名”平行并涉及世代延续的语境中，“声名”自然表达其语境含义，同时以脚注保留更贴近词面的译法。
- source_word: לְדֹר וָדֹר
  choice: 传到万代
  rationale: 表达“从一代到一代”的持续范围；“传到”使无动词分句在现代汉语中通顺，并与声名为后世所记念的语境相合。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”保留其专名性质，而不以称号替代。
- issue: זִכְרְךָ 在诗歌平行结构中的含义
  choice: 你的声名
  alternative: 对你的记念；你的纪念名
  rationale: 选择“声名”不把该词限制为人的心理活动或实体纪念物，并与“你的名”构成自然的同义平行；脚注保留原词确有的其他理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两次保留“雅威”，维持原文的诗歌平行和直接呼告；两个无动词分句分别补出“长存”和“传到”，避免生硬直译，同时不改变其跨越永远与万代的持续意义。
