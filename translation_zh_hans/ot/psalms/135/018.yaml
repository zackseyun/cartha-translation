  text: כְּ֭מוֹ/הֶם יִהְי֣וּ עֹשֵׂי/הֶ֑ם כֹּ֭ל אֲשֶׁר בֹּטֵ֣חַ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/018.yaml
  text: Those who make them will become like them[a], everyone who trusts in them.
translation:
  language: zh_hans
  text: 制造它们的人必变得和它们一样[a]；凡信靠它们的人也必如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必和它们一样。”希伯来语动词既可表示“是”，也可表示“变成”；正文采用结果意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ/הֶם
  choice: 跟它们一样
  rationale: 比较介词加第三人称阳性复数后缀，表示与上文所述偶像相像；“跟它们一样”自然、明确，不增添相像的具体方面。
- source_word: יִהְיוּ
  choice: 必变得
  rationale: היה 可表示“是”或“变成”。本处正文采用结果性理解，以“必变得”表达制造和信靠偶像之人最终与偶像相像，同时用脚注保留另一种译法。
- source_word: עֹשֵׂי/הֶם
  choice: 造它们的
  rationale: עשה 的分词加复数宾语后缀，指制造这些偶像的人；此译简洁并保留施事含义。
- source_word: כֹּל אֲשֶׁר
  choice: 凡……的人
  rationale: 该结构具有普遍范围，“凡……的人”符合现代汉语经文语体，也完整保留“所有……者”的含义。
- source_word: בֹּטֵחַ בָּ/הֶם
  choice: 信靠它们
  rationale: בטח 搭配 ב 表示信任、倚靠某对象；“信靠”准确表达把信心寄托于偶像之意。
theological_decisions:
- issue: 人变得与偶像相像的具体含义
  choice: 只陈述制造并信靠偶像的人会与偶像相像，不说明相像的具体机制或方面。
  alternative: 明确译为他们会像偶像一样麻木、无能或没有生命。
  rationale: 希伯来文本断言二者相像，却未具体界定是属灵迟钝、无能还是无生命；正文保留这一神学张力，避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“造它们的”承接上文偶像；后半句用“也是如此”体现希伯来语中同位补充的关系，并避免生硬重复。
