  text: אָזְנַ֣יִם לָ֭/הֶם וְ/לֹ֣א יַאֲזִ֑ינוּ אַ֝֗ף אֵין יֶשׁ ר֥וּחַ בְּ/פִי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/017.yaml
  text: They have ears[a], but they do not hear; indeed, there is no breath in their mouths.
translation:
  language: zh_hans
  text: 它们有耳朵，却不能听；它们口中甚至没有气息。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”或译“灵”；希伯来语 רוּחַ 兼有这两种含义。这里谈到没有生命的偶像，又说“口中”，所以正文译作“气息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנַיִם לָהֶם
  choice: 它们有耳朵
  rationale: 希伯来语以介词加代词构成无动词的领属句；现代汉语自然译作“它们有耳朵”，并保留偶像具有人体器官外形的讽刺意象。
- source_word: וְלֹא יַאֲזִינוּ
  choice: 却不能听
  rationale: יַאֲזִינוּ是אזן的使役词干形式，可指侧耳听、留心听；在偶像有耳却毫无听觉能力的语境中，“不能听”自然地表达其实际无能，连接词译作“却”以显明反差。
- source_word: אַף
  choice: 甚至
  rationale: 此处起递进和加强作用，由耳朵不能听推进到口中连生命气息也没有；“甚至”符合汉语表达。
- source_word: אֵין יֶשׁ רוּחַ
  choice: 没有气息
  rationale: אֵין יֶשׁ在这里否定存在。רוּחַ可指风、气息或灵；因上下文描写偶像身体器官不能运作，并明确说“在它们口中”，正文采用具体的“气息”。
- source_word: בְּפִיהֶם
  choice: 它们口中
  rationale: 直译其复数领属关系并保留口部意象；现代汉语用集合式的“它们口中”比逐一写作“它们的嘴里”更凝练庄重。
theological_decisions:
- issue: 偶像语境中רוּחַ的含义
  choice: 气息
  alternative: 灵
  rationale: 本节列举偶像貌似具有的身体器官及其无功能状态，最后指出其口中没有使活物呼吸的气息。“气息”最贴合直接语境，同时以脚注保留“灵”这一真实词义可能，不将经文扩展成更广泛的形而上断言。
translation_notes:
  register: 采用现代、清楚而庄重的标准普通话。“它们”指无生命的偶像；分号保留原文从听觉无能到毫无气息的递进。脚注标记置于相关整句之后。
