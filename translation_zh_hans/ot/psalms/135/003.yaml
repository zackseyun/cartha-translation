  text: הַֽ֭לְלוּ יָהּ כִּי ט֣וֹב יְהוָ֑ה זַמְּר֥וּ לִ֝/שְׁמ֗/וֹ כִּ֣י נָעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/003.yaml
  text: Praise Yah[a], for Yahweh is good; sing praises to his name[b], for it is pleasant.
translation:
  language: zh_hans
  text: 你们要赞美雅[a]，因为雅威是良善的；要歌颂他的名，因为这是美好的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“雅”，是神名的短式；有别于下文完整的神名“雅威”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文没有明说“美好的”所描述的对象；可指歌颂之事、他的名，或雅威自己。
    reason: alternative_reading
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: 你们要赞美
  rationale: 该词是הלל的复数祈使式，用现代汉语的直接劝召表达会众共同赞美。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的短式，音译为“雅”，以区别本节随后出现的完整神名יהוה。
- source_word: כִּי טוֹב
  choice: 因为……本为善
  rationale: כִּי引出赞美的理由；טוֹב概括雅威的良善。“本为善”自然、庄重，也表明这是对其本性的陈述。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的中文音译呈现四字神名，保留其作为专名的性质，并与短式“雅”相区别。
- source_word: זַמְּרוּ
  choice: 要歌颂
  rationale: זמר在此是复数祈使式，兼有歌唱和赞美之意；“歌颂”在现代汉语中简洁地保留两层含义。
- source_word: לִשְׁמוֹ
  choice: 他的名
  rationale: 保留希伯来文向神之名歌颂的表达；“名”也可承载神所显明的身份与声誉。
- source_word: נָעִים
  choice: 美好可喜
  rationale: 该词表示令人愉悦、可喜或美好；并列措辞兼顾其审美与情感色彩，避免仅理解为一般的“舒服”。
theological_decisions:
- issue: 同一节中יָהּ与יְהוָה的译法
  choice: 分别译作“雅”和“雅威”
  alternative: 两者都译作“耶和华”或“主”
  rationale: 原文刻意使用神名的短式与完整形式；分别音译可保留这一差别，而不把专名化为称号。
- issue: 末尾נָעִים所描述的对象
  choice: 正文以“这样做”理解为歌颂之举美好可喜，并加注说明歧义
  alternative: 理解为“他的名美好可喜”或“他美好可喜”
  rationale: 希伯来文没有明说该形容词的主语，语法和语境容许它指歌颂、神的名，或雅威自己。正文采用自然汉语表达，同时用脚注保留原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“你们要”明确复数祈使语气；分号保留两个平行劝召。“本为善”带有礼仪诗歌的凝练感，但仍属自然现代汉语。
