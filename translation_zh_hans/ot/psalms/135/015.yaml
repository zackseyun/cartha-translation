  text: עֲצַבֵּ֣י הַ֭/גּוֹיִם כֶּ֣סֶף וְ/זָהָ֑ב מַ֝עֲשֵׂ֗ה יְדֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/015.yaml
  text: The idols of the nations are silver and gold[b][a], the work of human hands.
translation:
  language: zh_hans
  text: 列国的偶像[a]由金银制成，是人手所造的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“形像”。
    reason: lexical_alternative
  - marker: b
    text: 直译“人的手所做的作品”。
    reason: literal_rendering
lexical_decisions:
- source_word: עֲצַבֵּי
  choice: 偶像
  rationale: 该词在这里指供人敬拜的神像，并带有贬斥虚假崇拜的意味；“偶像”比中性的“形像”更准确。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 指以色列以外的各国或各民族；“列国”符合诗篇语体，也为现代读者所理解。
- source_word: כֶּסֶף וְזָהָב
  choice: 金银
  rationale: 直接表达偶像的制作材料；汉语中“金银”自然凝练，并保留原文并列结构。
- source_word: מַעֲשֵׂה יְדֵי
  choice: 人手所造的
  rationale: 以自然汉语表达“手的作品”这一结构，同时保留偶像出于人手制造的重点。
- source_word: אָדָם
  choice: 人
  rationale: 此处泛指人类，并非特指男性；“人手”既自然，也保留人与神之间的对照。
theological_decisions:
- issue: אָדָם在此处的泛指含义
  choice: 人手
  alternative: 人的双手／世人之手
  rationale: 原文强调偶像只是人制造的，并不指某一男性；“人手”以简洁自然的方式保留这一泛指意义。
- issue: עֲצַבֵּי的宗教与论战色彩
  choice: 偶像
  alternative: 形像／雕像
  rationale: 上下文针对列国所敬拜之物展开批判，因此采用“偶像”；脚注保留较中性的词义可能。
translation_notes:
  register: 采用现代、庄重而简洁的诗篇语体。“列国”保留圣经诗歌的公共语域；“人手所造”是通顺的现代汉语，又清楚呈现原文对人工制造的强调。
