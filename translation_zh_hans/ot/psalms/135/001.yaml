base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/001.yaml
  text: Praise Yah! Praise the name of Yahweh[a]; praise, O servants of Yahweh[b],
translation:
  language: zh_hans
  text: 你们要赞美雅[a]！要赞美雅威[b]的名！雅威的仆人哪，你们要赞美！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”是神名“雅威”的缩略形式；“哈利路亚”原意就是“你们要赞美雅”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”音译希伯来文的神名יהוה；有些译本按传统译作“耶和华”或以“主”代替。
    reason: alternative_reading
lexical_decisions:
- source_word: הַ֥לְלוּ
  choice: 你们要赞美
  rationale: 这是הלל的皮埃勒式复数祈使语气，直接呼吁众人赞美；译出“你们”可自然体现复数，同时保持现代汉语的清晰度。
- source_word: יָ֨הּ
  choice: 雅
  rationale: 这是神名的诗歌性缩略形式，与本节后面的完整形式יְהוָה有意区别；音译为“雅”可保留原文形式上的差异，也显出其与“哈利路亚”末尾成分的关系。
- source_word: אֶת שֵׁ֣ם יְהוָ֑ה
  choice: 雅威的名
  rationale: 保留“名”作为赞美的直接对象，并以自然的现代汉语领属结构表达希伯来语的组合关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名四字母的常见汉语音译，不以“主”这一称号替代专名，也与缩略形式“雅”相区分。
- source_word: עַבְדֵ֥י
  choice: 仆人
  rationale: 此处是礼仪性的称呼，指事奉雅威的人；“仆人”比“奴隶”更符合本诗语境和现代汉语表达。
theological_decisions:
- issue: 同一节中神名缩略形式יָהּ与完整形式יְהוָה的译法
  choice: 分别译作“雅”和“雅威”
  alternative: 两者都译作“主”，或都统一译作“雅威”
  rationale: 分别音译能够保留原文有意义的形式差别，并避免把专名改成称号；脚注说明二者的关系，以免读者误以为是两个不同的名字。
- issue: 末句“赞美”的宾语是否补出
  choice: 不补“他”
  alternative: 译作“你们要赞美他”
  rationale: 原文末句只有复数祈使动词和呼语“雅威的仆人”，没有明说宾语；不补宾语可保留原文简练而略带省略的句法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。三个“赞美”均予保留，以再现原文反复呼吁的诗歌节奏；末句用“……哪”明确呼语关系，不添加原文没有的宾语。
