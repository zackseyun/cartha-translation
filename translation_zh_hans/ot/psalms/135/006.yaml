base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/006.yaml
  text: Yahweh does whatever he pleases[a], in heaven and on earth[c][b], in the seas and all the depths.
translation:
  language: zh_hans
  text: 雅威凡所喜悦的，他都成就，在天上、地上、海中和一切深渊中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּל אֲשֶׁר חָפֵץ
  choice: 凡所喜悦的
  rationale: כֹּל אֲשֶׁר 表示毫无限制的整体范围；חָפֵץ兼有喜悦、愿意、意欲之义。“凡所喜悦的”既自然，又保留意愿与欢喜之间的语义张力。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名直接音译为“雅威”，不以称号替代其专名。
- source_word: עָשָׂה
  choice: 都成就了
  rationale: 该完成式可指已经完成之事，也可在诗歌宣告中概括雅威一贯有效的作为。“成就了”表达其意旨落实为行动，同时不局限于“创造”。
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: 在天上、地上
  rationale: שָׁמַיִם形式上为复数，但汉语惯用“天上”；与“地上”并列，表达宇宙性的范围。
- source_word: בַּיַּמִּים
  choice: 在海中
  rationale: 保留יָם的复数所涵盖的众海，但现代汉语在此用集合性的“海中”更自然。
- source_word: וְכָל תְּהוֹמוֹת
  choice: 在一切深渊里
  rationale: תְּהוֹמוֹת可指深水、海底深处或原始深渊。“深渊”保留其广阔且未完全限定的意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名；音译可避免将专名无提示地改为称号。
- issue: עָשָׂה 的时体
  choice: 都成就了
  alternative: 都成就；都做了
  rationale: 希伯来文完成式可着眼于已实现的行动，而整节又是在陈述普遍真理。正文保留完成意味，不添加时间限定；注释说明也可理解为概括雅威一贯的作为。
- issue: חָפֵץ 所表达的神圣意愿
  choice: 所喜悦的
  alternative: 所愿的；所定意的
  rationale: “喜悦”贴近该词的情感与意志色彩，同时不把它收窄为抽象命令或预定论术语。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“无论……还是……”使天、地、海与深渊的范围关系清楚；保留“喜悦”“深渊”等原文中具有诗意且语义较宽的词。
