  to: 雅威凡所喜悦的，他都成就，在天上、地上、海中和一切深渊中。
  rationale: 修订仅调整汉语句法和动词的概括性表达：将原文四个地点范围明确并列，避免“无论……还是……”造成选择关系；“成就”不加“了”，可自然承载诗歌中完成式所表达的既成作为及一贯真理。脚注保留原有的词义与时体替代信息。
