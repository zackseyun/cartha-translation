  text: 他击打许多国家，杀死强大的君王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: 他击打
  rationale: שֶׁ使本节成为承接上文的关系从句；汉语以“他”自然回指上文的耶和华。הִכָּה直译为“击打”，在军事语境中含打击、击败之意，但不额外加入“灭掉”等结果性措辞。
- source_word: גּוֹיִם רַבִּים
  choice: 许多国
  rationale: גּוֹיִם在这里指列国，译为“国”简洁自然；רַבִּים译为“许多”。
- source_word: וְ/הָרַג
  choice: 又杀死
  rationale: הרג明确表示杀害、杀死；“又”保留并列推进，并符合汉语诗句节奏。
- source_word: מְלָכִים עֲצוּמִים
  choice: 强大的君王
  rationale: מְלָכִים是“君王”；עֲצוּמִים表示强盛、有力量，“强大的”是现代、庄重且不古奥的表达。
theological_decisions:
- issue: 与前一节的关系从句连续性
  choice: 用“他”回指上文所述的耶和华，使本节在语义上继续列举他的作为。
  alternative: 译成独立句“耶和华击打许多国……”，直接重述主语。
  rationale: 希伯来文שֶׁ标明本句承接上文；现代汉语通常不以“那击打……”单独成句，因此以代词回指，既保留连续关系，又避免生硬残句。
- issue: הִכָּה的结果程度
  choice: 译为“击打”，不明确补成“击败”或“消灭”。
  alternative: “击败”或“击杀”。
  rationale: 本节下半句另用הרג明确表达“杀死”；区分两个动词可保留诗句的词义张力，避免把前半句的结果说得过满。
translation_notes:
  register: 采用现代标准普通话，措辞简明而庄重。“君王”比“国王”略具诗歌格调；全句保留希伯来诗歌的两项平行结构。
