  text: בֵּ֣ית יִ֭שְׂרָאֵל בָּרֲכ֣וּ אֶת יְהוָ֑ה בֵּ֥ית אַ֝הֲרֹ֗ן בָּרֲכ֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/019.yaml
  text: House of Israel[a], bless Yahweh; house of Aaron, bless Yahweh.
translation:
  language: zh_hans
  text: '以色列家啊，要称颂耶和华；

    亚伦家啊，要称颂耶和华。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留“家”的集体、盟约性称谓，也与下句“亚伦家”形成整齐的诗体平行。
- source_word: בָּרֲכוּ
  choice: 要称颂
  rationale: 这是ברך的复数祈使式；在以人为主体、耶和华为宾语的颂赞语境中，“称颂”既准确又比现代汉语中的“祝福上帝”更自然。
- source_word: אֶת יְהוָה
  choice: 耶和华
  rationale: את是直接宾语标记，不另译；יהוה是神的专名。采用中文圣经传统中通行的音译“耶和华”，并不把专名改写为称号“主”。
- source_word: בֵּית אַהֲרֹן
  choice: 亚伦家
  rationale: 按构造短语直译，指亚伦的家族或祭司谱系，同时避免增译为原文未明说的“后裔”或“祭司”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且具悠久圣经传统的“耶和华”；“雅威”较接近现代学界常见的拟音，但希伯来语古代确切读音不能完全确定。
- issue: 人“称颂”耶和华的表达
  choice: 称颂
  alternative: 祝福
  rationale: 保留ברך在颂赞语境中的核心意义，同时避免“祝福耶和华”在现代汉语中容易被理解为人向神赐福，从而造成不必要的误解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体；以“啊”明确呼语，以“要”表达复数祈使语气。两行重复同一谓语，保留希伯来诗歌的平行结构和礼仪节奏。
