  text: בֵּ֣ית הַ֭/לֵּוִי בָּרֲכ֣וּ אֶת יְהוָ֑ה יִֽרְאֵ֥י יְ֝הוָ֗ה בָּרֲכ֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/020.yaml
  text: House of Levi[a], bless Yahweh; you who fear Yahweh[b], bless Yahweh.
translation:
  language: zh_hans
  text: 利未家啊[a]，要称颂雅威！敬畏雅威的人哪[b]，要称颂雅威！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“利未家”，是对利未支系或群体的整体称呼。
    reason: cultural_note
  - marker: b
    text: 也可译为“敬畏雅威者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַלֵּוִי
  choice: 利未家
  rationale: 该结构短语直译为“利未家”。结合上下文中“以色列家”和“亚伦家”的平行呼召，这里是对利未支派或群体的整体称呼；保留“家”既反映原文形式，也保留礼仪性的平行结构。
- source_word: בָּרֲכוּ
  choice: 称颂
  rationale: ברך在敬拜语境中表示向上帝献上祝颂。“称颂”比现代汉语中的“祝福上帝”更自然，同时仍区别于较宽泛的“赞美”，并保留反复呼召的礼仪语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，表明这里使用的是以色列上帝的专名，而不是以“主”这一称号代替。
- source_word: יִרְאֵי יְהוָה
  choice: 敬畏雅威的人哪
  rationale: 该分词结构指以敬畏雅威为特征的一群人。加语气词“哪”使其在现代汉语中自然地承接复数命令式，表达直接呼告；脚注保留将其读作陈述性主语的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可保留其专名性质，不以称号“主”替代；“耶和华”是传统形式，但较不贴近该名称通常所重建的读音。
- issue: יִרְאֵי יְהוָה 的句法语气
  choice: 直接呼告：“敬畏雅威的人哪”
  alternative: 陈述性主语：“敬畏雅威的人都要……”
  rationale: 复数命令式及本节连续的礼仪呼召支持直接呼告，但希伯来语分词结构本身也可被理解为群体称谓或句子主语，因此以脚注保留另一种读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“啊／哪”明确礼仪呼告，“要称颂”传达复数命令式；保留“利未家”的圣约群体用语和上下文平行结构。
