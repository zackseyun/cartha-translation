  text: יִשְׁפֹּ֤ט עֲֽנִיֵּי עָ֗ם י֭וֹשִׁיעַ לִ/בְנֵ֣י אֶבְי֑וֹן וִֽ/ידַכֵּ֣א עוֹשֵֽׁק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/004.yaml
  text: May he judge the poor of the people[a], save the children of the needy, and crush the oppressor.
translation:
  language: zh_hans
  text: 愿他为百姓中的贫苦人主持公道[a]，拯救穷乏人的儿女，粉碎欺压者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必为百姓中的贫苦人主持公道，拯救穷乏人的儿女，粉碎欺压者。”在这里，希伯来语的未完成式既可理解为将来，也可理解为祈求或祝愿。
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: 愿他……主持公道
  rationale: 该词是 שׁפט 的 Qal 未完成式第三人称阳性单数，在本篇为君王祈求的语境中可表达愿望。“主持公道”保留司法含义，也自然体现为贫苦人施行公正的语境；其将来时理解收入脚注。
- source_word: עֲנִיֵּי עָם
  choice: 百姓中的贫苦人
  rationale: עֲנִיִּים 可指贫穷、受苦或受压迫的人；与下句“穷乏人的儿女”平行时，贫困兼受苦的含义突出。中文用“百姓中的”自然表达希伯来语的领属结构。
- source_word: יוֹשִׁיעַ
  choice: 拯救
  rationale: ישׁע 的 Hiphil 形式表示拯救、搭救；“拯救”直接保留强烈的解救含义，又不擅自说明解救方式。
- source_word: לִבְנֵי אֶבְיוֹן
  choice: 穷乏人的儿女
  rationale: בְנֵי 字面为“儿子们／儿女”，此处为集合用法，并不限于男性，故译“儿女”。אֶבְיוֹן 指贫穷、缺乏者；“穷乏人”也与前句“贫苦人”保持词汇区别。
- source_word: וִידַכֵּא
  choice: 粉碎
  rationale: דכא 在此表达压碎、击垮之意；“粉碎”保留原文对欺压者所用的强烈形象和君王制止压迫的力度。
- source_word: עוֹשֵׁק
  choice: 欺压人的人
  rationale: עשׁק 的分词指惯常欺压、剥削别人的人。“欺压人的人”清楚自然，并保留分词所描写的行为特征。
theological_decisions:
- issue: 全节动词的语气
  choice: 采用祈愿式“愿他……”，后续动词同受这一语气统摄
  alternative: 采用简单将来时“他必……／他要……”
  rationale: 诗篇72篇整体具有为君王祈求、祝愿的语境，因此这些未完成式可自然理解为祈愿；同时，希伯来语形式也容许将来时理解，故以脚注保留这一真实歧义，不把祈愿强化为确定预言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主持公道”比生硬的“审判贫苦人”更准确传达为弱者施行司法公正之意；“粉碎”刻意保留原文末句强烈的诗歌力度。
