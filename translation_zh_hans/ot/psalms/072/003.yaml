  to: 愿群山为百姓[a]带来平安；愿群岭也凭着公义带来平安[b]。
  rationale: 修订消除了“也在公义中如此”的汉语歧义，明确以“凭着公义”表达בִּ的方式或凭借用法，并以重复“带来平安”将希伯来诗歌中的省略在汉语中自然展开。脚注保留把“公义”理解为第二个平行宾语的可行解释，避免把争议性理解写死在正文。脚注a已移至对应的“为百姓”之后。
