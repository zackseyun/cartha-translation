  text: יִשְׂא֤וּ הָרִ֓ים שָׁ֘ל֥וֹם לָ/עָ֑ם וּ֝/גְבָע֗וֹת בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/003.yaml
  text: May the mountains bring peace to the people[a], and the hills[c][b], in righteousness.
translation:
  language: zh_hans
  text: 愿群山为百姓[a]带来平安；愿群岭也凭着公义带来平安[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为百姓”或译“给百姓”。
    reason: lexical_alternative
  - marker: b
    text: “凭着公义”也可译“在公义中”或“秉持正义”；原文第二分句省略了谓语，也有人译作“群岭带来公义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: 愿……带来
  rationale: נָשָׂא本义为“举起、承载”；以山岭为主语、平安为宾语时，译作“带来”符合现代汉语。未完成式在本诗祈愿语境中表达祝愿，故用“愿”。
- source_word: הָרִים
  choice: 群山
  rationale: 准确表达带冠词的复数名词，并与下句“群岭”形成自然的诗歌对应。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 既保留传统核心义，也可涵盖和平、安康与整体福祉。
- source_word: לָעָם
  choice: 为百姓
  rationale: 介词ל可表示方向或受益者；此处“为百姓”在汉语中自然，并明确表达百姓是平安的受益者。“给百姓”亦可。
- source_word: וּגְבָעוֹת
  choice: 群岭也
  rationale: 保留与“群山”平行的地貌词及显明的连接关系；加入“也”使汉语诗句衔接自然。
- source_word: בִּצְדָקָה
  choice: 在公义中
  rationale: ב可表示方式、范围或凭借；直译为“在公义中”保留其紧凑性和歧义。צְדָקָה在王权语境中兼有公义与正义、公正的内涵。
theological_decisions:
- issue: 王室祈祷诗中未完成式的语气
  choice: 祈愿：“愿群山……”
  alternative: 预告：“群山必……”
  rationale: 诗篇72篇整体是为君王及其治理所作的祈求与祝福，因此祈愿语气比单纯将来时更贴切。
- issue: בִּצְדָקָה与省略谓语的关系
  choice: 将“在公义中”理解为修饰第二分句所承接的“带来平安/使百姓得平安”，用“也……如此”明示省略
  alternative: 将צְדָקָה视为平行宾语，译作“群岭带来公义”
  rationale: 希伯来文本在צְדָקָה前明确有介词בִּ，较自然地表示方式、处境或凭借。译文不把它无标记地改作直接宾语，以保留原文的语法张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“群山／群岭”保留诗意平行；“也……如此”补明希伯来诗句省略的谓语，同时不把“公义”强行处理为直接宾语。所有脚注标记均置于正文对应位置。
