  text: מַלְכֵ֬י תַרְשִׁ֣ישׁ וְ֭/אִיִּים מִנְחָ֣ה יָשִׁ֑יבוּ מַלְכֵ֥י שְׁבָ֥א וּ֝/סְבָ֗א אֶשְׁכָּ֥ר יַקְרִֽיבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/010.yaml
  text: May the kings of Tarshish and of the coastlands bring tribute; may the kings of Sheba and Seba present gifts.
translation:
  language: zh_hans
  text: 愿他施和众海岛的君王进贡；愿示巴和西巴的君王献上礼物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַרְשִׁישׁ
  choice: 他施
  rationale: 采用现代中文圣经读者较熟悉的传统音译，并保留其具体地名性质。
- source_word: אִיִּים
  choice: 众海岛
  rationale: 该词可指岛屿或沿海地区；“众海岛”贴近其基本词义，同时保留诗歌中遥远海疆的意象。
- source_word: מִנְחָה
  choice: 贡
  rationale: 在君王与臣服的语境中，该词所指礼物具有进贡意味；与动词“带回、交纳”合译为“进贡”，中文自然凝练。
- source_word: יָשִׁיבוּ
  choice: 进贡
  rationale: 字面有“带回、归还”之意，与מִנְחָה搭配时表达呈交贡物；不机械译出“归还”，以免中文误指偿还旧物。
- source_word: שְׁבָא
  choice: 示巴
  rationale: 采用通行音译，保留古代地名。
- source_word: סְבָא
  choice: 西巴
  rationale: 采用通行音译，并与拼写相近但不同的“示巴”明确区分。
- source_word: אֶשְׁכָּר
  choice: 礼物
  rationale: 指赠礼、贡礼；此处译作普通而庄重的“礼物”，避免过度限定其性质。
- source_word: יַקְרִיבוּ
  choice: 献上
  rationale: 基本义为使之靠近、呈献；“献上”准确表达君王郑重呈交礼物，且保留礼仪色彩而不必限定为祭物。
theological_decisions:
- issue: 两个未完成式动词的语气
  choice: 用“愿……；愿……”表达祈愿
  alternative: 译作将来陈述：“……必进贡；……必献上礼物”
  rationale: 本诗上下文带有为王祈求的语气，未完成式可作祈愿理解；译为“愿”保留该诗的祝祷性质，但希伯来语形式也容许将来或预示性理解。
- issue: “献上”的宗教含义
  choice: 保留一般呈献与可能的礼仪色彩
  alternative: 明确译作“献祭”
  rationale: יַקְרִיבוּ虽常用于祭献，但宾语是礼物，语境是诸王向王呈礼；不应擅自将其限定为祭祀行为。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达；两分句保持平行结构。“他施、示巴、西巴”为传统地名音译，“众海岛”保留原文广阔而遥远的地理意象。
