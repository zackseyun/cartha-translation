  text: וּ/בָר֤וּךְ שֵׁ֥ם כְּבוֹד֗/וֹ לְ/ע֫וֹלָ֥ם וְ/יִמָּלֵ֣א כְ֭בוֹד/וֹ אֶת כֹּ֥ל הָ/אָ֗רֶץ אָ֘מֵ֥ן וְ/אָמֵֽן׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/019.yaml
  text: And blessed be his glorious name forever[a], and may his glory fill the whole earth[b]. Amen and amen.
translation:
  language: zh_hans
  text: 愿他荣耀的名永远受称颂[a]！愿他的荣耀充满全地[b]！阿们，阿们！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他荣耀之名。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“全世界。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: 愿……受称颂
  rationale: 此处被动分词用于颂赞祈愿语境；“愿……受称颂”既保留祈愿色彩，也符合现代汉语礼拜用语。
- source_word: שֵׁם כְּבוֹדוֹ
  choice: 他荣耀的名
  rationale: 原文为构造链，直译是“他荣耀之名／他的荣耀的名”。“他荣耀的名”自然庄重，并比“他荣耀之名”更易为普通读者理解，同时保留“荣耀”修饰“名”的关系。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 准确表达持续无尽的时间意义，也是现代汉语最自然简洁的说法。
- source_word: וְיִמָּלֵא
  choice: 愿……充满
  rationale: 该未完成式在颂赞结语中具有祈愿语气；“愿”明确传达这一语气。尽管形态为尼法勒式，原文有直接宾语标记 אֶת，引导“全地”，因此按“他的荣耀充满全地”处理最合语法与语境。
- source_word: כְבוֹדוֹ
  choice: 他的荣耀
  rationale: כבוד 可指荣耀、尊荣或威严；在宇宙性颂赞语境中，“荣耀”最准确，也保持圣经用语的一贯性。
- source_word: אֶת כֹּל הָאָרֶץ
  choice: 全地
  rationale: כֹּל 表示整体范围；在本诗普世性的颂赞结尾中，הָאָרֶץ 指全世界，而非局部疆土。“全地”庄重凝练，并保留原文可直译为“所有的地”的表达。
- source_word: אָמֵן וְאָמֵן
  choice: 阿们，阿们
  rationale: 保留重复的礼仪性确认语。汉语以逗号呈现反复，比加入“和”更自然，也保有庄严节奏。
theological_decisions:
- issue: הָאָרֶץ 的范围
  choice: 全地，即普世范围
  alternative: 全境／全地土，即局部土地
  rationale: 本诗以普世性的君王图景和颂赞收束，语境指向整个世界；但脚注仍提示“全地”的另一种较逐字表达，以免掩盖词语本身可指“地”或“土地”的语义范围。
- issue: וּבָרוּךְ 与 וְיִמָּלֵא 的语气
  choice: 均按祈愿式表达
  alternative: 按陈述式译为“是当受称颂的……他的荣耀必充满全地”
  rationale: 颂赞结语中的形式和语用更适合祈愿／祝愿理解；译文用两个“愿”保留这种礼仪张力，而不将其改成单纯事实陈述或预言。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞体。“愿……受称颂”与“愿……充满”形成平行结构；末句用“阿们，阿们”保留原文重复及礼仪节奏。所有脚注标记均置于对应正文之后。
