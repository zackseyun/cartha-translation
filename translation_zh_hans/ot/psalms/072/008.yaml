  text: וְ֭/יֵרְדְּ מִ/יָּ֣ם עַד יָ֑ם וּ֝/מִ/נָּהָ֗ר עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/008.yaml
  text: May he rule from sea to sea[b][a], and from the River to the ends of the earth.
translation:
  language: zh_hans
  text: 愿他掌权[a]，从海到海，从大河[b]直到地极。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必掌权，从海到海，从大河直到地极。”
    reason: 保留希伯来文动词也可理解为预告性将来的读法。
  - marker: b
    text: “大河”很可能指幼发拉底河；在圣经地理中，它常被视为疆界。
    reason: 说明原文定指称谓所涉及的历史地理背景，同时避免在正文中明加河名。
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: 愿他掌权
  rationale: 源自动词 רדה，意为“统治、掌权”。结合本诗为君王祈求的语境，以“愿他掌权”表达未完成式在此可能具有的祈愿语气；“掌权”庄重自然，也保留统治权柄的含义。
- source_word: מִיָּם ... עַד יָם
  choice: 从这海直到那海
  rationale: 希伯来文直译为“从海到海”，是表示辽阔范围的诗性表达。“从这海直到那海”符合现代汉语习惯，保留两端相对的地理意象，又不擅自指定具体海域。
- source_word: וּמִנָּהָר
  choice: 从大河
  rationale: נהר 在此带定指意义，按圣经地理习惯很可能特指幼发拉底河。正文采用“大河”，既体现其定指和传统地理称谓，又不把原文未明说的河名直接写入正文。
- source_word: עַד אַפְסֵי אָרֶץ
  choice: 直到地极
  rationale: אַפְסֵי 指边缘、尽头。“地极”是简洁而庄重的现代中文表达，保留原文所呈现的广大地理范围。
theological_decisions:
- issue: 王室诗篇中未完成式／祈愿式的语气
  choice: 按祈愿理解，译作“愿他掌权”
  alternative: 按预告或确定的将来理解，译作“他必掌权”
  rationale: 本段处在为君王祈求的诗歌语境中，因此祈愿语气较为合宜；但希伯来文形式也可作将来陈述理解。正文保留祈祷语调，并以脚注保存预告式读法，避免消除原文的语气张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“愿他掌权”延续王室祈祷的语气；“从这海直到那海”与“从大河直到地极”形成平衡的诗性对句。所有脚注标记均置于正文相应位置。
