source:
  edition: WLC
  text: יְהִ֤י פִסַּת בַּ֨ר בָּ/אָרֶץ֮ בְּ/רֹ֪אשׁ הָ֫רִ֥ים יִרְעַ֣שׁ כַּ/לְּבָנ֣וֹן פִּרְי֑/וֹ וְ/יָצִ֥יצוּ מֵ֝/עִ֗יר כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/016.yaml
  text: May there be an abundance of grain in the land[a]; on the tops of the mountains may its fruit wave like Lebanon; and may people blossom from the city like the grass of the earth.
translation:
  language: zh_hans
  text: 愿地上五谷丰盛[a]；山巅之上，愿其果实摇曳如黎巴嫩；愿城中居民如地上的青草般蓬勃生长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿地上有一把谷物。”这里的希伯来语短语十分罕见，既可能强调少量谷物带来非凡丰收，也可能泛指五谷丰盛。
    reason: 保留罕见短语 פִסַּת בַּר 的另一种有充分依据的解释。
lexical_decisions:
- source_word: יְהִי
  choice: 愿……丰盛
  rationale: 未完成式在本诗的祈愿语境中带有祈使、祝愿意味；用“愿”自然表达这一语气。
- source_word: פִסַּת בַּר
  choice: 五谷丰盛
  rationale: פִסַּת 是罕见且有争议的词，可能指“一把”，也可能表达丰富充足。正文依上下文中极其繁茂的景象译为“五谷丰盛”，另在脚注保留“一把五谷”的可能。
- source_word: בָּאָרֶץ
  choice: 地上
  rationale: 这里指君王治下可耕作的地域；“地上”既自然，也保留“土地／大地”的空间意象。
- source_word: בְּרֹאשׁ הָרִים
  choice: 山巅之上
  rationale: 直译其山峰意象，突出连通常不易耕作的高处也有出产的非凡丰饶。
- source_word: יִרְעַשׁ
  choice: 摇曳
  rationale: 该动词本义为震动、摇动；用于庄稼果实，译作“摇曳”可自然呈现其随风摆动的画面，同时保留动态意象。
- source_word: כַּלְּבָנוֹן
  choice: 如黎巴嫩
  rationale: 保留原文对黎巴嫩的直接比较，不将其繁茂、雄伟的联想解释性地写入正文。
- source_word: פִּרְיוֹ
  choice: 其果实
  rationale: 保留第三人称单数后缀及农业产出的集体意涵，不武断限定其所指。
- source_word: וְיָצִיצוּ
  choice: 愿人……蓬勃而出
  rationale: 动词意为开花、萌发；“蓬勃而出”保留植物生长的比喻，并以“人”补出由“城中”暗示的居民这一主语，使现代汉语清楚自然。
- source_word: מֵעִיר
  choice: 从城中
  rationale: 保留介词“从”的方向感和原文单数“城”的形式，不改写为泛指复数。
- source_word: כְּעֵשֶׂב הָאָרֶץ
  choice: 如地上的青草
  rationale: 以青草繁生比喻人口兴旺；译文保留原文的明喻和土地意象。
theological_decisions:
- issue: 罕见短语 פִסַּת בַּר 的解释
  choice: 五谷丰盛
  alternative: 一把五谷
  rationale: 全节祈求君王治下兴盛，紧接着描绘山巅果实摇曳和城中人口繁茂，因此“丰盛”符合语境。不过“一把”在词汇上确有根据，也可能刻画少量种子产生非凡收成，故以脚注保留这一真实歧义。
- issue: וְיָצִיצוּ 的隐含主语
  choice: 愿人从城中蓬勃而出
  alternative: 愿他们从城中蓬勃而出
  rationale: 希伯来文动词为复数，却没有明说主语；“从城中”最自然地暗示城中居民。中文补出“人”可避免代词指向前句单数“果实”的误解，同时仍保留开花萌发的比喻。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“五谷丰盛”“山巅”“蓬勃而出”保持诗歌感，但避免生僻古语；各分句反复使用“愿”，呈现原文的祈愿语气。
