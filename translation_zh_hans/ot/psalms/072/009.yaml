  text: לְ֭/פָנָי/ו יִכְרְע֣וּ צִיִּ֑ים וְ֝/אֹיְבָ֗י/ו עָפָ֥ר יְלַחֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/009.yaml
  text: Before him the desert dwellers will bow down[a], and his enemies will lick the dust.
translation:
  language: zh_hans
  text: 在他面前，旷野的居民[a]必屈膝；他的仇敌必舔尘土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“旷野的部族”；这里的希伯来语也可能指“旷野的走兽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 这是“在某人面前／在其面前”的常用希伯来语表达；译文自然保留了临到君王面前的空间与关系含义。
- source_word: יִכְרְעוּ
  choice: 必屈膝
  rationale: כרע表示屈膝、跪下；“屈膝”既保留具体动作，也符合向君王臣服的诗歌语境。
- source_word: צִיִּים
  choice: 旷野的居民
  rationale: 该词含义较难确定，可指旷野地区的居民，在某些语境中也可指荒野走兽。本节与“他的仇敌”并列，指人较为合适，但以脚注保留其他可能。
- source_word: וְאֹיְבָיו
  choice: 他的仇敌
  rationale: 准确表达带第三人称阳性单数后缀的“敌对者”，用语自然且庄重。
- source_word: עָפָר
  choice: 尘土
  rationale: 保留具体意象；汉语“舔尘土”无需添加定冠意义，也能表达彻底受辱与败服。
- source_word: יְלַחֵכוּ
  choice: 必舔
  rationale: לחך的基本义为“舔”；直译保留诗句鲜明的降服和受辱意象。
theological_decisions:
- issue: 臣服意象的性质
  choice: 直接保留“屈膝”和“舔尘土”的诗歌意象，不将其抽象改写为政治臣服。
  alternative: 将两项动作解释性意译为“完全降服”或把它们一概视为必须实际发生的动作。
  rationale: 这些动作可作为古代王权与战败受辱的形象语言；原文并未说明应纯按字面还是修辞理解，因此译文保留具体表达及其张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“必屈膝……必舔尘土”保持平行结构；脚注标在存在词义歧义的“旷野的居民”之后。
