  yaml_path: translation/ot/psalms/072/000.yaml
  text: Of Solomon.[a] O God, give your justice to the king, and your righteousness[b] to the king's son.
translation:
  language: zh_hans
  text: '所罗门的诗。[a]


    上帝啊，求你将你的公正赐给王，将你的公义[b]赐给王的儿子。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 标题也可译作“为所罗门作”或“献给所罗门”。
    reason: alternative_reading
  - marker: b
    text: “你的公义”也可译作“你的公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: 所罗门的诗
  rationale: 介词 לְ 在诗篇标题中可表示归属、关联、献给或为某人而作；正文采用汉语诗篇标题中自然简洁的归属表达，同时以脚注保留其他真实可能。
- source_word: מִשְׁפָּטֶיךָ
  choice: 你的公正
  rationale: 复数形式可涵盖判决、司法准则及施行公道的权柄；“公正”在现代汉语中自然，也与下文“公义”保持词义关联而不混同。
- source_word: צִדְקָתְךָ
  choice: 你的公义
  rationale: צְדָקָה 在此可指上帝合乎正义的品格或公正作为；“公义”保留其较宽的伦理与神学内涵，脚注提示也可译作“公正”。
- source_word: בֶן־מֶלֶךְ
  choice: 王的儿子
  rationale: 按希伯来语形式直译，既可指王位继承人，也可与前句的“王”形成诗歌平行；不擅自判定二者是否为同一人。
theological_decisions:
- issue: 标题 לִשְׁלֹמֹה 所表达的关系
  choice: 正文译作“所罗门的诗”
  alternative: “为所罗门作”或“献给所罗门”
  rationale: 原介词关系并不唯一；正文采用传统而自然的归属译法，脚注明确保留目的或受领关系的可能。
- issue: “王”与“王的儿子”的关系
  choice: 保留两个平行称谓
  alternative: 将二者合并理解为同一位君王或明确解释为继承人
  rationale: 希伯来诗句本身未明确说明二者是同一人还是父子两位君王，因此不在译文中消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“求你……赐给……”自然表达希伯来语祈使句的恳求语气；标题单列，以区别于诗正文。
