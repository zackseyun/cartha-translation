  text: יְהִ֤י שְׁמ֨/וֹ לְֽ/עוֹלָ֗ם לִ/פְנֵי שֶׁמֶשׁ֮ ינין שְׁ֫מ֥/וֹ וְ/יִתְבָּ֥רְכוּ ב֑/וֹ כָּל גּוֹיִ֥ם יְאַשְּׁרֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/017.yaml
  text: May his name endure forever[a]; before the sun, may his name continue. May all nations be blessed in him[c][b]; may they call him blessed.
translation:
  language: zh_hans
  text: 愿他的名存到永远；在太阳面前[a]，愿他的名延续[b]。愿万国因他蒙福[c]；愿他们称他为有福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在太阳面前”也可按时间意义理解为“只要太阳还在”。希伯来语直译为“在太阳面前”。
    reason: lexical_alternative
  - marker: b
    text: 译作“延续”的动词十分罕见，也可能含有“滋长”“增多”“繁衍”或“传播”的意思。
    reason: lexical_alternative
  - marker: c
    text: 或译：“愿万国借着他为自己求福。”希伯来语动词形式可以作反身意义理解。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי שְׁמוֹ לְעוֹלָם
  choice: 愿他的名存到永远
  rationale: יְהִי为祈愿式，在此表达祝愿；“名”保留希伯来语关于名声、身份与传承的表达，“存到永远”则自然传达持续长存之意。
- source_word: לִפְנֵי שֶׁמֶשׁ
  choice: 在太阳面前
  rationale: 保留原文“在太阳面前”的诗歌意象；该短语也可能表达“只要太阳还在”的时间含义，因此在脚注中说明。
- source_word: ינין
  choice: 延续
  rationale: 此动词罕见，可能含有滋长、繁衍或传播之意；以“名”为主语时，“延续”既与上句平行，也避免把有争议的具体语义定死。
- source_word: וְיִתְבָּרְכוּ בוֹ
  choice: 愿万国因他蒙福
  rationale: התפעל式可作反身、被动或中间意义理解。“因他蒙福”在现代汉语中自然，并保留与族长祝福应许相呼应的普世祝福含义；反身读法列入脚注。
- source_word: כָּל גּוֹיִם
  choice: 万国
  rationale: 在君王诗篇的普世语境中指世上各国各民；“万国”简洁、庄重，也符合汉语圣经诗歌语体。
- source_word: יְאַשְּׁרוּהוּ
  choice: 愿他们称他为有福
  rationale: אשר的Piel式表示宣称或认定某人有福；此译准确保留其宣告意味，并与前句的“蒙福”相互呼应。
theological_decisions:
- issue: 本节所指君王的历史与弥赛亚范围
  choice: 保留直接的君王指向和更广阔的弥赛亚意蕴，不在正文中明确限定其身份
  alternative: 仅视为对历史君王的夸张颂赞，或直接且排他地译成弥赛亚预言
  rationale: 诗篇72篇属于君王诗，其语言又超越一般历史王权。“万国因他蒙福”保留与亚伯拉罕应许的经文呼应，使正文容纳正典中的弥赛亚理解，却不额外加入原文没有明说的身份判定。
- issue: וְיִתְבָּרְכוּ בוֹ的语态与祝福关系
  choice: 正文采用“因他蒙福”，脚注保留“以他为祝福”的反身理解
  alternative: 愿万国以他为祝福
  rationale: 希伯来语形式可有反身或被动、中间意义。正文不将其缩窄为单一反身含义，同时借脚注如实保存语法上的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“存到永远”“在太阳面前”保留原文的平行结构和意象；“万国”维持君王诗篇的普世范围。脚注分别保存时间性解释、罕见动词的词义不确定性，以及祝福动词的反身读法。
