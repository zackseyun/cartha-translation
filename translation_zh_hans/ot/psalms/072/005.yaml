  text: יִֽירָא֥וּ/ךָ עִם שָׁ֑מֶשׁ וְ/לִ/פְנֵ֥י יָ֝רֵ֗חַ דּ֣וֹר דּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/005.yaml
  text: May they fear you as long as the sun endures[a], and before the moon[c][b], through all generations.
translation:
  language: zh_hans
  text: 愿他们敬畏你[a]，直到日月长存[b]，世世代代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们必敬畏你。”希伯来语形式既可表达祈愿，也可理解为将来的陈述。
    reason: alternative_reading
  - marker: b
    text: 直译：“与太阳同在，并在月亮面前”；这是表达长久延续的诗意说法，即太阳、月亮尚存之时。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירָאוּךָ
  choice: 愿他们敬畏你
  rationale: יִירָאוּךָ源于ירא，可指惧怕或敬畏；这里保留“敬畏”的宗教与王权语境分量，并以“愿”表达此未完成式在上下文中常见的祈愿语气。该形式也可理解为将来陈述，见脚注[a]。
- source_word: עִם־שָׁמֶשׁ
  choice: 与太阳同在之时
  rationale: עִם通常意为“与……同在”；此处与太阳连用，表达与其存续同期的长久时间。译文既保留“同在”的意象，又用“之时”显明时间含义。
- source_word: וְלִפְנֵי־יָרֵחַ
  choice: 并在月亮面前
  rationale: לִפְנֵי直译为“在……面前”。此处与上一分句平行，诗意地表达月亮尚存期间；正文保留原文较独特的空间意象，并由脚注说明其时间意义。
- source_word: דּוֹר דּוֹרִים
  choice: 直到世世代代
  rationale: 原文以“代”的单数和复数相接，强调绵延不断的世代。“世世代代”自然保留这种反复和延续感。
theological_decisions:
- issue: 王室诗篇中“敬畏你”的对象
  choice: 保留第二人称“你”，不明确限定为君王或上帝
  alternative: 明确译成敬畏君王，或明确译成敬畏上帝
  rationale: 希伯来文仅直接称“你”；本诗的王权神学容许多层理解。译文不越过原文消除这一张力。
- issue: יִירָאוּךָ的语气
  choice: 正文采用祈愿式“愿他们敬畏你”
  alternative: 陈述式“他们必敬畏你”
  rationale: 上下文容许祈愿语气，但希伯来语形式本身也可作将来性陈述，因此以脚注保留另一读法。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“与太阳同在之时，并在月亮面前”刻意保留希伯来诗歌中两个不完全对称的意象；脚注帮助普通读者理解其表示长久持续。
