  yaml_path: translation/ot/psalms/072/013.yaml
  text: He will have compassion on the poor and needy[a], and he will save the lives of the needy.
translation:
  language: zh_hans
  text: 他必怜悯贫寒人和穷乏人；他必拯救穷乏人的性命[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”所译的希伯来词也可按语境指“生命”“人”“自身”或“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֹס
  choice: 要怜恤
  rationale: 此处表示君王对弱势者的怜悯与顾惜。“怜恤”既自然庄重，也与下半句的拯救行动相呼应；译作“饶恕”会暗示经文未明说的加害或定罪情境。
- source_word: דַּל
  choice: 贫寒的人
  rationale: 该词可指贫穷、弱小或社会地位低下的人。“贫寒的人”保留其经济与社会弱势的含义，并与 אֶבְיוֹן 有所区别。
- source_word: אֶבְיוֹן / אֶבְיוֹנִים
  choice: 穷乏的人／穷乏人
  rationale: 该词强调匮乏和需要援助。前后保持一致，并借“贫寒”和“穷乏”保存希伯来诗句的近义平行而不抹平用词差异。
- source_word: נַפְשׁוֹת
  choice: 性命
  rationale: נֶפֶשׁ 在此处最自然地指人的生命或本人；“性命”与“拯救”搭配自然，也避免把该词限定为与身体相分离的“灵魂”。
- source_word: יוֹשִׁיעַ
  choice: 拯救
  rationale: ישׁע 的使役式表示使人脱离危险、得救或获救。“拯救”直接保留其基本含义，并适合本节君王保护困苦者的语境。
theological_decisions:
- issue: נַפְשׁוֹת 所涉及的人观含义
  choice: 正文译为“性命”
  alternative: “灵魂”或“人”
  rationale: 在君王保护并解救穷乏者的语境中，该词较自然地指他们的生命或本人。译为“灵魂”可能使读者联想到经文本身未必表达的身心二分观；脚注仍保留原词的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“贫寒”和“穷乏”保留原文两个近义词的诗歌变化；句式简洁，维持两行平行关系。
