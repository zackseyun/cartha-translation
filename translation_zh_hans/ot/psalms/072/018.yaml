id: PSA.72.18
reference: Psalms 72:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּר֤וּךְ יְהוָ֣ה אֱ֭לֹהִים אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹשֵׂ֖ה נִפְלָא֣וֹת לְ/בַדּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/018.yaml
  text: Blessed be Yahweh God[a], the God of Israel, who alone does wondrous things.
translation:
  language: zh_hans
  text: 耶和华神，以色列的神，是应当称颂的！唯有他行奇妙的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “是应当称颂的”或译“愿……蒙称颂”；“唯有他行奇妙的事”或译“他独自行奇事”。
    reason: 保留 בָּרוּךְ 颂赞公式的语气幅度，以及 לְבַדּוֹ 可侧重“唯有他”或“独自”的表达差异。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 是应当称颂的
  rationale: 该被动分词用于颂赞公式；译为“是应当称颂的”既自然庄重，也保留礼仪性宣告的语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式音译四字神名，不以“主”这一称号替代。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处与耶和华同位，直接译为“神”，形成“耶和华神”。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接表达原文所属结构及其身份、关系含义。
- source_word: עֹשֵׂה
  choice: 行
  rationale: 该分词描述神一贯的作为；中文“行……的事”简洁自然，并保留持续性特征。
- source_word: נִפְלָאוֹת
  choice: 奇妙的事
  rationale: 指非凡、令人惊叹的作为；“奇妙的事”清楚自然，且不将其抽象化。
- source_word: לְבַדּוֹ
  choice: 唯有他
  rationale: 突出施行这些奇妙之事者的独一性，同时避免添加原文未明确表达的论战性含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文保留为专名而非以“主”替代。“耶和华”是现代简体中文圣经语境中最通行、最易识别的形式。
- issue: לְבַדּוֹ 对神行动的限定
  choice: 唯有他行奇妙的事
  alternative: 他独自行奇事
  rationale: “唯有他”明确保留原文的排他性；“独自”也可能被理解为没有协助，脚注予以呈现，不在正文中消解两种侧重。
- issue: בָּרוּךְ 的颂赞公式
  choice: 是应当称颂的
  alternative: 愿……蒙称颂
  rationale: 原文形式既可作为颂赞宣告，也具有礼仪性的祝颂意味；正文采用自然的宣告式中文，脚注保留另一种表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇颂赞语体。前半句保留同位结构“耶和华神，以色列的神”，以感叹号体现颂赞转折；后半句用“唯有他”前置，符合自然中文并突出原文的排他重点。
