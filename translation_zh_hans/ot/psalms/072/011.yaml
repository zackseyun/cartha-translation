  yaml_path: translation/ot/psalms/072/011.yaml
  text: May all kings bow down before him[a]; may all nations serve him.
translation:
  language: zh_hans
  text: 愿所有君王都向他下拜[a]；愿万国都服侍他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬拜他”；“下拜”和“服侍”所对应的希伯来语动词，既可表示向君王臣服致敬，也可带有宗教敬奉的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁתַּחֲווּ
  choice: 愿……下拜
  rationale: שׁחה在此表示俯伏、下拜，以表达臣服和尊崇。结合诗篇72篇的君王语境，“下拜”既保留可见的敬礼动作，也不把含义限定为宗教敬拜；未完成式在上下文中按祈愿语气译为“愿”。
- source_word: לוֹ
  choice: 向他
  rationale: 介词ל表示下拜所指向的对象；现代汉语用“向他下拜”自然、准确。
- source_word: כָל מְלָכִים
  choice: 所有君王
  rationale: 直译其普遍范围，并与下半句“万国”形成平行。
- source_word: כָל גּוֹיִם
  choice: 万国
  rationale: גּוֹיִם在这里泛指世上各国；“万国”简洁庄重，并保留诗歌体的普遍性。
- source_word: יַעַבְדוּהוּ
  choice: 愿……服侍他
  rationale: עבד的核心义是服侍、效力，也可在特定语境中包含宗教事奉之意。“服侍”保留君王臣属与宗教敬奉两方面的可能，不将含义缩窄为单一的“敬拜”。
theological_decisions:
- issue: 是否把君王所受的下拜和服侍明确译为宗教性的“敬拜”
  choice: 采用“向他下拜”和“服侍他”，保留臣服、尊崇及潜在宗教含义的范围。
  alternative: 将一个或两个动词译为“敬拜他”。
  rationale: 本节处于君王诗的语境，首先可表达列王列国向王臣服；两个希伯来动词同时也能带有宗教意味。若直接译作“敬拜”，会过早消除原文在王权礼敬与宗教敬奉之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“所有君王”清楚表达כָל的全称范围，“万国”保持与诗篇体裁相称的凝练节奏；两个分句都用“愿”，体现上下文中的祈愿语气。
