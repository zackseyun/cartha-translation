base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/001.yaml
  text: Of Solomon[a]. O God, give your judgments to the king[b], and your righteousness to the king’s son.
translation:
  language: zh_hans
  text: '所罗门的诗[a]。

    神啊，求你将你的判断赐给王，将你的公义赐给王的儿子[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所罗门的诗”也可译作“为所罗门作”或“献给所罗门”。
    reason: alternative_reading
  - marker: b
    text: “你的公义”也可译作“你的公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: 所罗门的诗
  rationale: 介词 לְ 用于诗篇题注时可表示作者、归属、对象或用途。正文采用汉语诗篇题注中自然的“所罗门的诗”，但以脚注保留“为所罗门作”或“献给所罗门”等可能。原文仅作“属/为所罗门”，补出“诗”是汉语题注所需的自然表达。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 此处是祷告中的直接呼语；“啊”自然明确其呼格功能。
- source_word: מִשְׁפָּטֶיךָ
  choice: 你的判断
  rationale: מִשְׁפָּט 的复数可指判断、司法裁决或秉公判断的能力。“判断”既保留复数词义所涵盖的具体裁断意味，也不把语义过早缩窄为抽象的“公正”。
- source_word: לְמֶלֶךְ
  choice: 给王
  rationale: לְ 表示领受者；“给王”在“赐给”结构中是直接自然的与格表达。
- source_word: תֵּן
  choice: 赐给
  rationale: 祈使式要求神授予王所需之物。相较普通的“给”，“赐给”适合向神祈求的庄重语域，同时不过度古雅。
- source_word: וְצִדְקָתְךָ
  choice: 将你的公义
  rationale: צְדָקָה 同时涵盖公义、正直与公正。“公义”保留其道德和司法两方面的广度；“公正”作为上下文中可成立的译法列于脚注。
- source_word: לְבֶן־מֶלֶךְ
  choice: 给王的儿子
  rationale: 按构词关系直译，保留其可能指王位继承人，也可能与“王”平行指同一位大卫家君王的开放性。
theological_decisions:
- issue: “王”与“王的儿子”的身份
  choice: 保留原文的王室称谓，不在正文中明确认定为所罗门、一般的大卫家君王或弥赛亚。
  alternative: 可具体理解为所罗门，也可从王朝或弥赛亚角度作更广的理解。
  rationale: 本节本身没有要求译者排除历史处境或更广的理想君王意涵。直译王室语言可保存这种神学张力，避免把某一种解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。题注单列；正文以“神啊，求你……”呈现呼求。保留“王”和“王的儿子”的平行结构，不作解释性改写。
