  text: The prayers of David son of Jesse are ended[a].
translation:
  language: zh_hans
  text: 耶西的儿子大卫所作的祷告已经结束了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经结束了”也可译为“已经完毕了”或“已经告一段落了”。
    reason: כָּלּוּ 表示祷告已经完结、完毕或达到终点；脚注保留相近的词义表达。
lexical_decisions:
- source_word: כָּלּוּ
  choice: 到此结束
  rationale: 该词为 כלה 的完成式复数形式，以“祷告”为主语，表示“完结、结束”。“到此结束”自然简洁，也符合本节作为结语的语境；其中“到此”明示其收束功能，但不对成书历史作额外判断。
- source_word: תְפִלּוֹת
  choice: 祷告
  rationale: תְּפִלָּה 的复数，基本义为“祷告、祈求”。现代汉语中“祷告”可作集合性表达，句法自然，并保留原文所指的多篇祷告。
- source_word: דָּוִד
  choice: 大卫
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: בֶּן יִשָׁי
  choice: 耶西之子
  rationale: 原文为表示亲属关系的构词结构，直译为“耶西之子”；这一表达庄重、清楚，并紧密修饰“大卫”。
theological_decisions:
- issue: 本节是诗篇祷告正文的一部分，还是编者所加的结语
  choice: 按原文表层句义译作标志大卫祷告结束的陈述
  alternative: 明确称其为后来的编者附记
  rationale: 希伯来文只作简明陈述，并未说明该句形成的历史过程。译文保留其结语功能，不把特定的编辑史判断写入正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“耶西之子大卫”保留希伯来语的身份说明；“到此结束”适合结语语境。脚注标记已置于正文对应位置。
