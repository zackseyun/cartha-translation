base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/015.yaml
  text: May he live[a], and may gold from Sheba be given to him. May prayer be made for him continually[b]; all day long may they bless him.
translation:
  language: zh_hans
  text: 愿他长久活着；愿人把示巴的金子献给他。愿有人不断为他祷告[a]，终日祝福他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说祷告者是谁；也可译：“愿人为他祷告”或“愿他们为他祷告”。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明说祝福者是谁；也可译：“愿人终日祝福他”或“愿他们终日祝福他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: 愿他长久存活
  rationale: 该词是חיה的Qal祈愿式第三人称阳性单数，表达祝愿；“愿他长久存活”自然传达祈愿语气，也适合诗歌语体。
- source_word: וְיִתֶּן לוֹ
  choice: 愿人……献给他
  rationale: 希伯来文用主动形式，但没有明说主语；以泛指的“人”保留主动结构和主语不确定性。“献给”符合向君王进贡的语境。
- source_word: מִזְּהַב שְׁבָא
  choice: 示巴的金子
  rationale: מן在此可表示来源或取自其中；“示巴的金子”简洁自然，并保留原文可能指来自示巴或示巴所产之金的表达空间。
- source_word: וְיִתְפַּלֵּל בַּעֲדוֹ
  choice: 愿人常常为他祷告
  rationale: פלל的Hitpael形式与בַּעַד连用，表示为某人祷告。第三人称阳性单数未指定具体主语，故用泛指“人”。
- source_word: תָמִיד
  choice: 常常
  rationale: 表达持续或经常发生；“常常”是现代汉语中自然、庄重而易懂的对应词。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 准确传达“整日、整天”的时间范围，并保持诗体的凝练。
- source_word: יְבָרֲכֶנְהוּ
  choice: 为他祝福
  rationale: 该形式为Piel未完成式/祈愿用法，带第三人称阳性单数宾语后缀。主语未明说，因此正文不强行指定具体群体；“为他祝福”在此表达祝愿或称颂。
theological_decisions:
- issue: 诗篇72篇君王祈愿的所指
  choice: 按经文直接语境保留为对君王的祝愿，不在译文中明定为弥赛亚预言
  alternative: 直接把本节译作专指弥赛亚的预言
  rationale: 本诗首先呈现对大卫王系君王的祈祷与祝愿，同时在正典传统中可具有弥赛亚意义；译文应保留这种解释空间，不把某一神学解读写入正文。
- issue: 未明说的祷告者与祝福者
  choice: 祷告句用泛指“人”，祝福句省略主语
  alternative: 明确译作“他们”，或把祷告者理解为君王本人
  rationale: 希伯来文两处动词均未明说主语；采用泛指或汉语零主语可避免把特定群体强加给原文，并保留句法上的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“愿”连续标示祈愿语气；“示巴”“终日”等措辞保留圣经诗体的凝练。所有脚注标记均置于相关正文之后。
