  text: יִֽפְרַח בְּ/יָמָ֥י/ו צַדִּ֑יק וְ/רֹ֥ב שָׁ֝ל֗וֹם עַד בְּלִ֥י יָרֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/007.yaml
  text: In his days the righteous will flourish[d][c][b][a], and there will be an abundance of peace until the moon is no more.
translation:
  language: zh_hans
  text: 在他的日子里，义人[a]必兴旺；必有丰盛的平安[b]，直到月亮不复存在[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义人”原文为单数，也可译作“那位义者”，可能指王本人，而不一定泛指众义人。
    reason: alternative_reading
  - marker: b
    text: “平安”也包含安康、完整、福祉等意思。
    reason: lexical_alternative
  - marker: c
    text: 直译为“直到没有月亮”，是表达长久延续的诗意说法。
    reason: cultural_note
lexical_decisions:
- source_word: יִפְרַח
  choice: 必兴旺
  rationale: פרח本指发芽、开花，也可比喻蓬勃发展。“兴旺”保留繁荣发展的意象，在现代汉语中自然凝练；“必”表达未完成体在此处的将来或预期意义。
- source_word: בְּיָמָיו
  choice: 在他的日子
  rationale: 贴近希伯来语表达，并在本诗王权语境中自然指他执政的时期；不扩写为“在他统治期间”，以保留原文措辞。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该词形态上为阳性单数，但可作集合性称谓。“义人”在中文中既可泛指义人群体，也可指一位义者，因而较好地保留原文的数与所指范围上的张力。
- source_word: וְרֹב
  choice: 必丰盛
  rationale: רֹב表示众多、丰富。中文补出“必”使无动词的名词性分句成为自然完整的陈述，同时表达“平安极其充足”的意思。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: “平安”是שָׁלוֹם在此语境中的核心意义，也可涵盖安康、完整与福祉；较“和平”更能容纳其广泛内涵。
- source_word: עַד בְּלִי יָרֵחַ
  choice: 直到月亮不复存在
  rationale: 保留原文“直到没有月亮”的宇宙性诗歌意象，也自然传达长久延续的含义，不改写成解释性的“直到永远”。
theological_decisions:
- issue: 王权诗中צַדִּיק所指的范围
  choice: 正文采用可作集合称谓的“义人”
  alternative: 理解为单数“那位义者”，可能指王本人或理想君王
  rationale: 希伯来语形式为单数，但实词化形容词可以具有集合意义；上下文也可理解为公义之人在王执政期间兴旺。中文“义人”本身不强制限定单复数，故正文保留这种歧义，并用脚注说明单数解释，而不把经文预先限定为某一弥赛亚式所指。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“在他的日子”和月亮消失的诗歌意象；分号呈现两个并列结果。正文不显明限定“义人”的单复数，以忠实保留原文可能的集合义与单数义。
