  yaml_path: translation/ot/psalms/072/012.yaml
  text: For he delivers the needy when he cries out[a], and the poor who has no helper.
translation:
  language: zh_hans
  text: 因为穷乏人呼求时，他搭救；没有人帮助的困苦人[a]，他也搭救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦人”或译“受欺压的人”；希伯来词 עָנִי 既可强调贫穷，也可强调受苦或受压迫。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明君王配受称颂的原因；保留原文的因果关系。
- source_word: יַצִּיל
  choice: 必搭救
  rationale: נצל 的使役式表示使人脱离危难；“搭救”自然地表达实际救援，不将其限定为属灵意义的拯救。
- source_word: אֶבְיוֹן
  choice: 穷乏人
  rationale: 指物质匮乏、依赖援助的人；“穷乏人”庄重易懂，也与下句的 עָנִי 略作区分。
- source_word: מְשַׁוֵּעַ
  choice: 呼求时
  rationale: 该分词描写穷乏人呼喊求助；译作时间从句符合现代汉语表达，并保留呼求这一动作。
- source_word: וְעָנִי
  choice: 困苦人
  rationale: עָנִי 可指贫穷、受苦或受压迫者；“困苦人”兼顾贫困与苦难，也避免与 אֶבְיוֹן 完全重复。
- source_word: וְאֵין עֹזֵר לוֹ
  choice: 无人帮助时
  rationale: 表达这人没有援助者、处于孤立无助的境况；用现代汉语从句比直译“没有帮助他的人”更流畅。
theological_decisions:
- issue: “他”的所指
  choice: 保留第三人称单数“他”，由诗篇的君王语境确定所指，不在本节明说身份。
  alternative: 明确译为一般的公义君王，或明确译为弥赛亚君王。
  rationale: 希伯来文只使用未特别标明身份的阳性单数动词。本节本身没有进一步界定所指，因此不将王室、预表或预言层面的理解写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必搭救”在并列句中补出两次，使汉语结构清楚；原文第二句省略谓语，由第一句承接。脚注标记置于整节末尾，对应“困苦人”的词义选择。
