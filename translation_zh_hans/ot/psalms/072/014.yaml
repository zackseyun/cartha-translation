  text: מִ/תּ֣וֹךְ וּ֭/מֵ/חָמָס יִגְאַ֣ל נַפְשָׁ֑/ם וְ/יֵיקַ֖ר דָּמָ֣/ם בְּ/עֵינָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/014.yaml
  text: From oppression and violence he will redeem their life[b][a], and their blood will be precious in his eyes.
translation:
  language: zh_hans
  text: 他要从欺压和暴行中救赎他们的性命[a]；他们的血在他眼中是宝贵的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”或译“生命”“人”；希伯来语 נֶפֶשׁ 可按上下文指生命、自我、性命或人。
    reason: lexical_alternative
  - marker: b
    text: 这里单数的“他”按本诗上下文最自然地承接君王；但这段话也呼应上帝亲自救赎并珍视受欺压者。
    reason: alternative_reading
lexical_decisions:
- source_word: מִתּוֹךְ וּמֵחָמָס
  choice: 脱离欺压和暴行
  rationale: מִתּוֹךְ 表示从某种处境或势力中出来；חָמָס指暴力、强暴或不义。中文以“脱离……和……”自然表达蒙拯救离开这两种危害。
- source_word: יִגְאַל
  choice: 救赎
  rationale: גאל含有赎回、作救赎者而解救的法律及关系性意味；“救赎”比一般的“救出”更能保留其语义厚度。
- source_word: נַפְשָׁם
  choice: 他们的性命
  rationale: נֶפֶשׁ在此主要指生命、性命或人本身，而非专指非物质的灵魂。“性命”既自然，也与下半句的“血”相呼应。
- source_word: וְיֵיקַר
  choice: 极其宝贵
  rationale: יקר表示贵重、珍贵或受到高度看重；“极其宝贵”清楚传达他们的血绝非可轻忽之物。
- source_word: דָּמָם
  choice: 他们的血
  rationale: 保留דָּם的具体血液意象，同时在语境中表达他们的生命不会被视为低贱或可随意牺牲。
- source_word: בְּעֵינָיו
  choice: 在他眼中
  rationale: 直译希伯来语惯用表达，现代中文也自然，表示他如何看待和珍视他们。
theological_decisions:
- issue: 单数第三人称“他”的所指
  choice: 正文保留“他”，按诗篇紧邻语境自然承接君王。
  alternative: 也可理解为直接指上帝；君王在这里所行的救赎与公义也呼应上帝对受欺压者的眷顾。
  rationale: 希伯来文的单数动词和代词与本诗的君王主题一致，但行为本身带有上帝施行救赎的神学回响。译文不把这种张力强行消解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“救赎”保留原文גאל的法律与关系性内涵；“性命”避免把נֶפֶשׁ窄化为非物质的“灵魂”。调整语序，把“脱离欺压和暴行”置于动词之后，使中文流畅，同时保留原文两行的平行关系。所有脚注标记均置于正文对应位置。
