  yaml_path: translation/ot/psalms/072/006.yaml
  text: May he come down like rain on mown grass[c][b][a], like showers that water the earth.
translation:
  language: zh_hans
  text: 愿他降下[a]，如雨落在割下的草上[b]；又如阵雨，滋润大地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必降下。”希伯来语未完成式在这里既可理解为祈愿，也可理解为对将来的描述。
    reason: alternative_reading
  - marker: b
    text: “割下的草”也可译为“割过的草”；这个希伯来词也有人理解为“剪下的羊毛”，但农业图景更符合本节语境。
    reason: lexical_alternative
  - marker: c
    text: “大地”也可译作“土地”或“地面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: 愿他降临
  rationale: ירד意为“下去、降下”。本节处于为君王祈愿、祝福的语境中，因此用“愿……”表达未完成式可能具有的祈愿语气；“降临”在现代汉语中自然庄重，也保留从上而下的意象。
- source_word: כְּמָטָר
  choice: 如雨
  rationale: כְּ为比喻标记，מָטָר指雨；简洁译作“如雨”，保留诗句的明喻。
- source_word: עַל
  choice: 落在……上
  rationale: עַל基本义为“在……上”。结合“雨”的汉语搭配补出“落”，使图景自然，同时保留方位关系。
- source_word: גֵּז
  choice: 割过的草地
  rationale: גֵּז指被割下或剪下之物；在雨水与土地的农业图景中，理解为割过草的地面较为贴切。“割过的草地”比“剪下的羊毛”更符合上下文，但以脚注保留另一种词义可能。
- source_word: כִּרְבִיבִים
  choice: 又如雨水
  rationale: רְבִיבִים指阵雨或丰沛的雨。译作“雨水”能与上半句形成自然平行，又避免擅自加强雨势。
- source_word: זַרְזִיף
  choice: 润泽
  rationale: 这是罕见词，描写滴落、洒落或浇灌的作用。汉语以动词“润泽”重组句法，传达雨水作用于土地并带来滋养的诗意。
- source_word: אָרֶץ
  choice: 大地
  rationale: אָרֶץ可指地、土地或大地。此处为宽广的诗歌图景，译作“大地”自然，但脚注保留“土地、地面”的可能。
theological_decisions:
- issue: 王室祈祷语境中未完成式יֵרֵד的语气
  choice: 按祈愿理解，译作“愿他降临”
  alternative: 按将来或确定性陈述理解，译作“他必降临”
  rationale: 诗篇72篇整体包含为君王所作的祈求和祝愿，因此这里很自然可听作祈愿；但希伯来语未完成式也能表达将来的描述，故在脚注中保留这一张力，不把它定为单一的预言性陈述。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“愿他降临”保留祈愿语气，“如雨……又如雨水……”保留原文两行的平行结构；没有把君王明确等同于任何特定神学身份。
