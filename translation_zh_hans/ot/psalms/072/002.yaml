  text: יָדִ֣ין עַמְּ/ךָ֣ בְ/צֶ֑דֶק וַ/עֲנִיֶּ֥י/ךָ בְ/מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/002.yaml
  text: May he judge your people with righteousness[b][a], and your afflicted ones with justice.
translation:
  language: zh_hans
  text: 愿他按公义审判你的百姓[a]，按公平审判你受苦的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必按公义审判你的百姓。”这里的希伯来语未完成式既可表达祈愿，也可表达将来或预告。
    reason: alternative_reading
  - marker: b
    text: “受苦的人”也可译作“贫穷的人”或“困苦的人”；原词可指贫穷、受苦或受压迫的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדִין
  choice: 愿他……审判
  rationale: Qal未完成式第三人称阳性单数在本诗祈愿语境中可有祈愿意味；译作“愿他……审判”保留祷告语气，同时以脚注说明也可理解为将来或预告。
- source_word: עַמְּךָ
  choice: 你的百姓
  rationale: עַם加第二人称阳性单数后缀，直指“你的百姓”；“百姓”在现代汉语中自然，也符合君王施行审判的语境。
- source_word: בְצֶדֶק
  choice: 按公义
  rationale: צֶדֶק可指公义、正直或正义；“按公义”自然表达审判所遵循的正直准则，并与下句的מִשְׁפָּט有所区分。
- source_word: וַעֲנִיֶּיךָ
  choice: 你受苦的子民
  rationale: עָנִי可指贫穷、困苦、受压迫或受苦的人。“受苦的子民”保留其较宽的语义范围，并借“子民”自然承接前句“百姓”，避免只限定为经济贫困。
- source_word: בְמִשְׁפָּט
  choice: 按公平
  rationale: מִשְׁפָּט在此表示公正的裁断或公平；“按公平审判”是清楚自然的现代汉语，也避免将其误解为单纯的定罪。
theological_decisions:
- issue: 王室祈祷诗中句首未完成式是祈愿还是预告
  choice: 正文采用祈愿：“愿他……审判”
  alternative: “他必……审判”或“让他……审判”
  rationale: 本诗开头整体具有为君王祈求祝福的语气，因此祈愿式较贴合上下文；但希伯来语未完成式也容许将来或预告性理解，故以脚注保留这一真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两行保持平行结构，以“公义／公平”分别对应צֶדֶק与מִשְׁפָּט；脚注标记均置于相关正文之后。
