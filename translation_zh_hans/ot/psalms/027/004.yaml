  rationale: 修订维持原稿的庄重现代语体和全部主要意象，同时避免将末句难解动词解释为特定的“寻求指引”。“曾……求”与“还要寻求”自然表达希伯来完成式和未完成式所形成的既有祈求与持续追求；“就是”明确引出所寻求的内容。脚注标记也已分别紧邻神名、美善及难解动词。
