source:
  edition: WLC
  text: אַחַ֤ת שָׁאַ֣לְתִּי מֵֽ/אֵת יְהוָה֮ אוֹתָ֪/הּ אֲבַ֫קֵּ֥שׁ שִׁבְתִּ֣/י בְּ/בֵית יְ֭הוָה כָּל יְמֵ֣י חַיַּ֑/י לַ/חֲז֥וֹת בְּ/נֹֽעַם יְ֝הוָ֗ה וּ/לְ/בַקֵּ֥ר בְּ/הֵיכָלֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/004.yaml
  text: 'One thing I have asked from Yahweh[a]; this I will seek: that I may dwell in the house of Yahweh all the days of my life[c][b], to behold the beauty of Yahweh and to inquire in his temple.'
translation:
  language: zh_hans
  text: 我曾向耶和华[a]求一件事；这事我还要寻求：就是一生一世住在耶和华的殿中，瞻仰耶和华的美善[b]，在他的殿里求问[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”对应希伯来文神名 YHWH；也可音译为“雅威”。传统译本常以“主”代称。
    reason: alternative_reading
  - marker: b
    text: “美善”也可译为“悦人之美”“可喜之处”或“恩惠”。
    reason: lexical_alternative
  - marker: c
    text: 这里的希伯来动词含义较难确定；也可理解为“查考”“寻问”或“默想”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: 一件事
  rationale: 阴性单数数词在此作名词用，突出诗人唯一而集中的愿望；“一件事”是自然、准确的现代汉语。
- source_word: שָׁאַלְתִּי
  choice: 我……求过
  rationale: 完成式表示已经提出、而今仍具持续意义的祈求；“求过”与下句持续寻求的意志形成呼应。
- source_word: מֵאֵת יְהוָה
  choice: 向耶和华求
  rationale: 希伯来语介词表达请求所指向并从其领受的对象；汉语习惯说“向……求”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最易识别的专名译法，保留四字神名作为专名，而不以“主”这一称号替代。
- source_word: אוֹתָהּ אֲבַקֵּשׁ
  choice: 我仍要寻求这一件
  rationale: 代词回指前面的“一件事”；未完成式可表达持续行动或坚定意愿。“仍要”自然呈现已经祈求、继续追求的关系。
- source_word: שִׁבְתִּי
  choice: 愿我……住
  rationale: 带第一人称后缀的形式在此说明所求之事的内容；“住”保留长久安居于上帝居所的意象，不机械译成“坐”。
- source_word: בְּבֵית יְהוָה
  choice: 在耶和华的殿中
  rationale: 字面为“耶和华的家”。在敬拜语境中，“殿”更自然地传达圣所意象，并与后文“圣殿”相呼应。
- source_word: כָּל יְמֵי חַיַּי
  choice: 我一生的年日都
  rationale: 保留原文“我生命的一切日子”的延续性和诗歌色彩，同时符合现代汉语。
- source_word: לַחֲזוֹת
  choice: 瞻仰
  rationale: 该词不只是一般观看，也可含凝视、观赏之意；“瞻仰”兼具敬畏和专注观看的语感。
- source_word: בְּנֹעַם יְהוָה
  choice: 耶和华的荣美
  rationale: נֹעַם可指美好、悦人、恩惠。“荣美”在此敬拜语境中自然，但不排除“美善”或“恩惠”等理解，故以脚注保留范围。
- source_word: וּלְבַקֵּר
  choice: 寻求指引
  rationale: 此处动词含义较难确定，可表示查考、寻问或专注默想。“寻求指引”使在圣殿中向上帝寻问的语境清楚，同时以脚注保留其他可能。
- source_word: בְּהֵיכָלוֹ
  choice: 在他的圣殿里
  rationale: הֵיכָל可指宫殿或圣殿；本节与“耶和华的殿”平行，故译“圣殿”最合语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。中文正文采用广为人知的专名“耶和华”，而不以称号“主”取代；脚注说明其对应关系。
- issue: נֹעַם יְהוָה 的语义
  choice: 耶和华的荣美
  alternative: 耶和华的美善；耶和华的恩惠
  rationale: 该名词兼有悦人、美好和恩宠的语义范围。正文按凝视敬拜的语境选“荣美”，脚注保留真实的词义张力。
- issue: וּלְבַקֵּר 在圣所语境中的含义
  choice: 在他的圣殿里寻求指引
  alternative: 在他的圣殿里寻问；在他的圣殿里默想
  rationale: 该动词在此罕见且语义有争议。正文选择符合圣所中向上帝求问的表达，但不将“查考”或“默想”的可能性排除。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。句式保留原文“一件事”的聚焦和祈求—寻求—居住—瞻仰—寻问的推进。正文避免过度古雅；“瞻仰”“圣殿”“荣美”保留诗篇敬拜语言应有的尊严。所有脚注标记均已置于正文相应位置。
