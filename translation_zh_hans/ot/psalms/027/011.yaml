base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/011.yaml
  text: Teach me your way[a], O Yahweh, and lead me on a level path because of my enemies.
translation:
  language: zh_hans
  text: 雅威啊，求你指教我你的道路；因我的仇敌[a]，求你引导我走平坦的路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因那些怀着敌意窥伺我的人”。这里的希伯来词可指仇敌，也可能特指暗中窥伺、等待机会攻击诗人的敌对者。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: 求你将……教导我
  rationale: 该词是ירה的使役式，意为“教导、指教”。此译保留学习与受教的含义，也符合祷告语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现以色列上帝的专名，不以称号替代。
- source_word: דַּרְכֶּךָ
  choice: 你的道路
  rationale: דֶּרֶךְ既可指具体道路，也可指行事方式或生活道路；“你的道路”保留这两层可能。
- source_word: וּנְחֵנִי
  choice: 求你引领我
  rationale: נחה表示带领、引导；“引领”与下文的道路意象自然衔接。
- source_word: בְּאֹרַח מִישׁוֹר
  choice: 走平坦的路
  rationale: מִישׁוֹר首先描绘平坦、平正之地，也可引申为正直稳妥；此译保留具体道路意象，并让其引申义保持开放。
- source_word: לְמַעַן
  choice: 因
  rationale: 这里说明诗人提出请求所面对的缘由或处境；简洁的“因”不额外限定具体因果方式。
- source_word: שׁוֹרְרָי
  choice: 我的仇敌
  rationale: 该词指敌对者，也可能带有敌意窥伺、伺机而动的意味；正文采用自然概括的“仇敌”，具体语义可能性收入脚注。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 正文采用贴近希伯来神名的现代汉语音译“雅威”，以保留专名性质，而不改作“主”等称号。
- issue: “平坦”是否应直接解释为道德上的“正直”
  choice: 保留具体的“平坦”道路意象
  alternative: 正直的道路
  rationale: מִישׁוֹר具有平坦和平正的语义张力；译作“平坦”既贴近空间隐喻，也没有排除道德上的正直含义。
translation_notes:
  register: 采用自然而庄重的现代标准汉语祷告体。“道路—平坦的路”的意象对应原文，并保留具体路径与人生行事方式之间的双重含义。脚注标记置于其实际说明的“仇敌”之后。
