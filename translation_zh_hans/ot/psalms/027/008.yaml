  text: לְ/ךָ֤ אָמַ֣ר לִ֭בִּ/י בַּקְּשׁ֣וּ פָנָ֑/י אֶת פָּנֶ֖י/ךָ יְהוָ֣ה אֲבַקֵּֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/008.yaml
  text: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[c][b], I seek.
translation:
  language: zh_hans
  text: 我的心替你说[a]：“你们要寻求我的面。”雅威啊，我寻求你的面[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文开头句法较难，也可译作：“对你，我的心说：‘你们要寻求我的面。’”或稍作不同的句法理解：“我的心谈到你时说：‘你们要寻求他的面。’”
    reason: alternative_reading
  - marker: b
    text: “你的面”也可译作“你的同在”；希伯来文的“面”常有亲自临在的含义。
    reason: lexical_alternative
  - marker: c
    text: “我寻求”也可译作“我要寻求”；希伯来文动词既可表达当下的决意，也可表达将来的意向。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: 替你
  rationale: 此处介词短语与“我的心说”连用，句法较难。“替你”表达关涉或代表雅威发言的可能含义，同时以脚注保留“对你”和“论到你”等理解。
- source_word: אָמַר לִבִּי
  choice: 我的心……说
  rationale: 原文是完成式，但诗歌语境可表达当前内心的回应；中文用“说”既自然，也不过度限定时间。
- source_word: בַּקְּשׁוּ
  choice: 你们要寻求
  rationale: 这是阳性复数命令式；“你们要寻求”明确保留复数和命令语气。
- source_word: פָנָי
  choice: 我的面
  rationale: 直译为“我的面”。这里可指亲自临在，但保留“面”可维持上下两句的词语呼应及关系性意象。
- source_word: אֶת פָּנֶיךָ
  choice: 你的面
  rationale: 保留原文与“我的面”的重复，不在正文中直接释为“同在”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代。
- source_word: אֲבַקֵּשׁ
  choice: 我寻求
  rationale: 未完成式在此可表达当前决意，也可指将来的意向；正文采用简洁的现在式，另一可能见脚注。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；正文以“雅威”音译其名，避免用称号取代。
- issue: 难解的开头 לְךָ אָמַר לִבִּי
  choice: 我的心替你说：“你们要寻求我的面。”
  alternative: 我的心对你说：“你们要寻求我的面。”；我的心论到你说：“你们要寻求他的面。”
  rationale: 马所拉文本句法简略，可有多种连结方式。正文将心中的话理解为呼应雅威的召唤，但不借改动原文消除歧义，并在脚注列出主要替代读法。
- issue: אֲבַקֵּשׁ 的时态意味
  choice: 我寻求
  alternative: 我要寻求
  rationale: 该形式既可表达当下的决意，也可表达将来的意向；正文不强行限定，脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而清楚的汉语。保留“面”的重复意象，并用“你们”呈现原文复数命令式；开头略显非常规，是为保留希伯来文真实的句法张力。
