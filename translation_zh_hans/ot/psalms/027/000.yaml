base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/000.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: zh_hans
  text: '大卫的诗[a]。

    耶和华是我的亮光，是我的拯救，

    我还怕谁呢？

    耶和华是我生命的保障，

    我还惧谁呢？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 标题中的希伯来语也可译作“由大卫所作”或“与大卫有关”。
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 介词לְ可表示作者、归属或关联；正文采用汉语诗篇标题中自然的传统表达，并用脚注保留“由大卫所作／与大卫有关”的歧义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式译出四字神名，避免仅用称号“主”抹去原文专名。
- source_word: אוֹרִי
  choice: 我的亮光
  rationale: 直译“我的光”，但“我的亮光”在现代汉语中更自然，也保留光明、引导与安全等隐喻空间。
- source_word: יִשְׁעִי
  choice: 我的拯救
  rationale: 采用名词表达，保留原文“光／拯救”的并列结构，而不改写为“拯救我的那一位”。
- source_word: מָעוֹז חַיַּי
  choice: 我生命的保障
  rationale: מָעוֹז可指堡垒、避难所或坚固保障；此处用“保障”自然表达安全与庇护，同时不过度具象化为特定军事建筑。
- source_word: אִירָא / אֶפְחָד
  choice: 怕／惧
  rationale: 用两个近义动词对应希伯来诗歌平行句中的不同词形，保持修辞变化和反问力度。
theological_decisions:
- issue: 神名的呈现
  choice: 耶和华
  alternative: 上主／主
  rationale: 原文明确使用四字神名；正文以专名呈现，更直接对应源文，同时不借译名引入额外神学解释。
- issue: מָעוֹז的隐喻范围
  choice: 我生命的保障
  alternative: 我生命的堡垒／避难所
  rationale: “保障”兼顾坚固保护的核心意义和现代汉语自然度，并保留该词可指防御处、避难处或力量来源的语义宽度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留两组平行陈述和反问。标题独立成行，诗句按希伯来平行结构分行。
