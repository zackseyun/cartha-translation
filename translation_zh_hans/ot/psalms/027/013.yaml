  text: לׅׄוּלֵׅׄ֗אׅׄ הֶ֭אֱמַנְתִּי לִ/רְא֥וֹת בְּֽ/טוּב יְהוָ֗ה בְּ/אֶ֣רֶץ חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/013.yaml
  text: Unless I had believed that I would see the goodness of Yahweh in the land of the living[a][b].
translation:
  language: zh_hans
  text: 若不是我相信自己会在活人之地看见雅威的美善……[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里省略了条件句的结果，直译近似：“若不是我相信会在活人之地看见雅威的美善……”通常理解为隐含“我早已绝望”或“我早已丧胆”。
    reason: alternative_reading
  - marker: b
    text: 也可补译为：“我早已丧胆。”
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵא
  choice: 要不是
  rationale: 引出与事实相反的条件，且能在汉语中自然保留原文未说完的主句。
- source_word: הֶאֱמַנְתִּי
  choice: 我深信
  rationale: 使役词干在此表示相信、确信；“深信”能自然表达其坚定意味，同时由后文说明所信的内容。
- source_word: לִרְאוֹת
  choice: 自己必……看见
  rationale: 原文是不定词“看见”，依附于“相信”；汉语以内容分句表达更自然，“必”体现面向未来的确信。
- source_word: בְּטוּב
  choice: 美善
  rationale: טוּב可指美善、福惠或美好事物；“美善”保留抽象而宽广的含义，不限于物质福分。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留专名性质，而不以称号替代。
- source_word: בְּאֶרֶץ חַיִּים
  choice: 在活人之地
  rationale: 这是指现世生命领域、与死亡或阴间相对的希伯来惯用语；“活人之地”准确且庄重。
- source_word: '[implicit apodosis after לוּלֵא]'
  choice: 以省略号保留未明说的结果
  rationale: 马所拉文本没有写出条件句的结果。正文不擅自补成“我早已绝望”，而以省略号体现原句中断，并在脚注交代通常理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名；采用“雅威”音译，避免把专名改成称号。
- issue: 是否补出省略的条件句结果
  choice: 正文保留省略，以省略号标示
  alternative: 补作“我早已绝望”或“我早已丧胆”
  rationale: 原文确实没有明说结果；保留省略更忠实地呈现文本的悬而未决，同时脚注提供上下文支持的常见理解，避免把推断混入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要不是”自然表达反事实条件；省略号有意保留希伯来文本的省略结构。所有脚注标记均置于正文。
