source:
  edition: WLC
  text: כִּ֤י יִצְפְּנֵ֨/נִי בְּ/סֻכֹּ/ה֮ בְּ/י֪וֹם רָ֫עָ֥ה יַ֭סְתִּרֵ/נִי בְּ/סֵ֣תֶר אָהֳל֑/וֹ בְּ֝/צ֗וּר יְרוֹמְמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/005.yaml
  text: For he will hide me in his shelter in the day of trouble[a]; he will conceal me in the secret place of his tent[c][b]; he will lift me high upon a rock.
translation:
  language: zh_hans
  text: 因为他必在患难之日[b]把我藏在他的棚中[a]；必把我隐藏在他帐幕的隐秘处；必把我高高安置在磐石上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “棚”也可译作“遮蔽所”“亭子”或“住棚”；原文指提供遮蔽的构筑物，也可能带有圣所的意味。
    reason: lexical_alternative
  - marker: b
    text: “患难之日”也可译作“灾祸之日”或“恶事之日”。
    reason: lexical_alternative
  - marker: c
    text: “高高安置”也可译作“高举”或“安置在高处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为诗人的信靠说明理由；“因为”自然保留解释性的逻辑关系。
- source_word: יִצְפְּנֵנִי
  choice: 他必把我藏
  rationale: צפן在此表达藏匿并保护；“藏”保留具体意象，也与下一分句形成同义平行。
- source_word: בְּסֻכּוֹ
  choice: 在他的棚子里
  rationale: סֻכָּה本义为临时搭建、具有遮蔽作用的棚子；直译保留具体形象及其可能具有的圣所联想，而不直接限定为礼仪性的会幕。
- source_word: בְּיוֹם רָעָה
  choice: 在患难之日
  rationale: רָעָה在语境中指灾祸、困境，而非道德意义上的邪恶；“患难之日”符合诗体庄重语域。
- source_word: יַסְתִּרֵנִי
  choice: 他必将我隐藏
  rationale: סתר同样表示使人不被看见；“隐藏”既保留与前句的平行，也避免中文完全重复。
- source_word: בְּסֵתֶר אָהֳלוֹ
  choice: 在他帐幕的隐密处
  rationale: סֵתֶר指隐蔽、隐密之处，אֹהֶל本义为帐幕；译文保留空间意象及潜在圣所含义。
- source_word: בְּצוּר
  choice: 在磐石上
  rationale: צוּר指岩石、磐石，在此构成高处、安全之所的意象。
- source_word: יְרוֹמְמֵנִי
  choice: 他必把我高高安置
  rationale: רום的使役形式表达举起或置于高处；结合“磐石上”，译为“高高安置”清楚呈现保护性的垂直意象。
theological_decisions:
- issue: סֻכּוֹ与אָהֳלוֹ是否应明确译作圣所或会幕
  choice: 译作“棚子”和“帐幕”，保留具体遮蔽意象及潜在圣所联想。
  alternative: 译作“圣所”“会幕”或“亭子”，把礼仪或王室色彩明确化。
  rationale: 两个希伯来词本身都是普通具体名词，语境可能唤起圣所联想，却没有要求译文将其唯一确定为正式礼仪场所。
- issue: בְּיוֹם רָעָה中רָעָה的意义
  choice: 译作“患难”，理解为灾祸和困境。
  alternative: 译作“邪恶”或“灾祸”。
  rationale: 本节描述诗人在危险中蒙保护，情境义明显指逆境，而非道德邪恶。
- issue: יְרוֹמְמֵנִי的动作意象
  choice: 译作“高高安置”，表达被置于安全高处。
  alternative: 译作“高举我”或“使我升高”。
  rationale: 动词本身可表达举高；与“在磐石上”连用时，“高高安置”较自然，又不把意象抽象化为身份上的尊荣。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。“患难之日”“帐幕”“磐石”保留诗篇常见的凝练意象；两个“必”体现未完成式在信靠宣告中的将来或确信色彩。脚注标记均置于正文相关表达之后。
