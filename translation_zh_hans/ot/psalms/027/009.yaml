source:
  edition: WLC
  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ אַֽל תַּט בְּ/אַ֗ף עַ֫בְדֶּ֥/ךָ עֶזְרָתִ֥/י הָיִ֑יתָ אַֽל תִּטְּשֵׁ֥/נִי וְ/אַל תַּֽ֝עַזְבֵ֗/נִי אֱלֹהֵ֥י יִשְׁעִֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/009.yaml
  text: Do not hide your face from me[a]; do not turn your servant away in anger. You have been my help. Do not cast me off, and do not forsake me[c][b], O God of my salvation.
translation:
  language: zh_hans
  text: '求你不要向我掩面；

    不要在怒中赶走你的仆人。[a]


    你一直是我的帮助。

    不要丢弃我，也不要离弃我；

    拯救我的上帝啊！[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要在怒中推开你的仆人。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“我救恩的上帝。”
    reason: source_form
lexical_decisions:
- source_word: תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  choice: 向我掩面
  rationale: 保留希伯来文“隐藏你的面”这一关系性意象；“向我掩面”是自然、庄重且易懂的现代汉语表达，没有抽象化为“不让我感受你的同在”。
- source_word: תַּט בְּאַף עַבְדֶּךָ
  choice: 发怒，赶走你的仆人
  rationale: נטה的基本义涉及转向、使偏离；在此以“你的仆人”为宾语，并与“在怒中”连用，语境指因怒气而将人推开或赶走。“赶走”清楚传达关系上的拒绝，脚注保留较贴近动词形象的译法。
- source_word: עַבְדֶּךָ
  choice: 你的仆人
  rationale: 诗人在向上帝祷告时以此谦卑自称；此处重点是归属、忠诚和恳求，不是法律身份，因此译作“仆人”而非“奴隶”。
- source_word: עֶזְרָתִי הָיִיתָ
  choice: 你向来是我的帮助
  rationale: עֶזְרָה是“帮助、援助”，而完成式הָיִיתָ指向上帝过去已经显明、对当前仍有意义的帮助。“向来是”既避免暗示上帝如今不再帮助，也保留名词性表述。
- source_word: תִּטְּשֵׁנִי
  choice: 丢弃我
  rationale: נטש可表示撇下、抛弃或弃绝；“丢弃”保留强烈的关系性语气，并与下句的“离弃”有所区别。
- source_word: תַּעַזְבֵנִי
  choice: 离弃我
  rationale: עזב常指离开或抛弃；“离弃”适合祷告语体，也没有把它与前一个近义动词完全合并。
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: 拯救我的上帝
  rationale: 希伯来文直译为“我救恩的上帝”。“拯救我的上帝”在现代汉语中更自然，并表达上帝是诗人得拯救的来源，同时以脚注交代原文结构。
theological_decisions:
- issue: “你的面”所含的拟人性神学意象
  choice: 保留为“向我掩面”
  alternative: 不要向我隐藏你的同在／恩宠
  rationale: 原文明说上帝的“面”，借此表达上帝的临在与恩宠。正文保留意象，避免把丰富的诗歌语言限定为某一种抽象解释。
- issue: עבד作为诗人对上帝的自称
  choice: 仆人
  alternative: 奴隶
  rationale: 此处是祷告中的谦卑与归属用语，未突出买卖、强制劳役等法律身份；“仆人”更符合上下文，也不削弱诗人服事并属于上帝的意味。
- issue: אֱלֹהֵי יִשְׁעִי中“救恩／拯救”的关系
  choice: 拯救我的上帝
  alternative: 我救恩的上帝
  rationale: 构词本身可以庄重地直译，但“我救恩的上帝”在现代汉语中生硬。“拯救我的上帝”自然表达上帝与诗人得救之间的关系，而不额外限定拯救仅指属灵或仅指现实危难。
translation_notes:
  register: 采用现代、庄重的祷告语体，以短行保留诗歌节奏。“掩面”“仆人”“离弃”等词具有圣经诗歌的分量，但普通现代读者仍能理解；避免过度古雅的“莫要”“休要”以及生硬的逐词结构。
