base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/002.yaml
  text: When evildoers came near me to devour my flesh[b][a], my adversaries and my enemies—they stumbled and fell.
translation:
  language: zh_hans
  text: 恶人逼近我，要吞吃我的肉[a]；他们，就是我的敌手和仇敌，反倒失足而跌倒了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要吃我的肉”。这是形容暴力攻击的鲜明意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקְרֹב עָלַי
  choice: 逼近我
  rationale: בְּ加不定式在这里表示时间背景；结合עָלַי的敌对语境，“逼近我”自然地传达来势逼人的含义，又不另添“攻击”等原文没有的动作。
- source_word: מְרֵעִים
  choice: 恶人
  rationale: 该分词指行恶的人。“恶人”是现代中文圣经语体中简洁、易懂且有道德分量的表达。
- source_word: לֶאֱכֹל אֶת־בְּשָׂרִי
  choice: 要吞吃我的肉体
  rationale: 保留“吃”与“肉体”的强烈意象；“吞吃”比直译“吃”更自然地表现暴力攻击，同时没有把比喻扁平化为“伤害我”。
- source_word: צָרַי וְאֹיְבַי לִי
  choice: 我的敌手和仇敌
  rationale: 分别译出两个近义名词以保留希伯来诗歌的并列。“我的”已自然涵盖לִי在此处的敌对关系，避免中文重复成“我的……攻击我的”。
- source_word: הֵמָּה
  choice: 他们，就是
  rationale: 独立代词带有强调作用；用“他们，就是”及标点在中文中凸显：倒下的正是那些敌手和仇敌。
- source_word: כָשְׁלוּ וְנָפָלוּ
  choice: 绊倒跌落
  rationale: 逐一保留“失足/绊倒”与“倒下/跌落”两个连续动词，不限定其为军事、身体或道德层面的失败。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。主句以“他们，就是”再提敌人，保留原文独立代词的强调和敌人反遭倾覆的转折感；不补出施事者，也不把跌倒解释为特定类型的失败。
