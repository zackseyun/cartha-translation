  text: שְׁמַע יְהוָ֖ה קוֹלִ֥/י אֶקְרָ֗א וְ/חָנֵּ֥/נִי וַ/עֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/007.yaml
  text: Hear[a], O Yahweh, when I cry aloud[b]; be gracious to me and answer me.
translation:
  language: zh_hans
  text: 雅威啊，求你垂听我呼求的声音[a]；求你恩待我[b]，回答我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文按词序可译为“听，雅威，我的声音；我呼求”。“我的声音”与“我呼求”的关系在原文中未用连接词明说；正文按汉语习惯译为“我呼求的声音”，也可译为“我呼求时的声音”。
    reason: 说明原文具体表达及其未明说的句法关联，避免将一种汉语重组视为唯一结构。
  - marker: b
    text: 或译“求你施恩给我”；传统上也常译作“求你怜悯我”。
    reason: 说明 חנן 的主要译法及其与传统措辞的关系。
lexical_decisions:
- source_word: שְׁמַע
  choice: 求你听
  rationale: 这是阳性单数祈使式，表达恳求上帝留心垂听；汉语加“求你”能自然体现祷告语气，又不削弱命令式的迫切感。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名，而不以称号“主”代替；“雅威”是现代汉语中对 Yahweh 的常见音译。
- source_word: קוֹלִי
  choice: 我的声音
  rationale: 保留 קוֹל 的具体意象，不简化为“听我”；这也贴近希伯来语“听我的声音”的表达。
- source_word: אֶקְרָא
  choice: 我呼求时
  rationale: קרא 在此指诗人向上帝发声呼求。未完成式可在这项祈求中按情境理解为时间性从句；“呼求”比单纯“呼叫”更符合祷告语境。
- source_word: וְחָנֵּנִי
  choice: 求你施恩给我
  rationale: חנן 的祈使式核心是施恩、恩待。“施恩给我”准确保留恩惠之意，并避免只突出怜悯情感。
- source_word: וַעֲנֵנִי
  choice: 应允我
  rationale: ענה 在祷告语境中指回答、回应；“应允我”是自然庄重的汉语祷告用语，也含有上帝回应呼求之意。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非一般称号，因此采用与 Yahweh 对应的汉语音译“雅威”，以保留专名性质。
- issue: חנן 的神学语义
  choice: 施恩给我
  alternative: 怜悯我；恩待我
  rationale: 选择“施恩”以凸显白白赐予恩惠的基本词义，但不把经文扩展为某一特定的恩典教义；“怜悯我”虽属可能的语境译法，却更容易偏向 רחם 的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你”重复两次，使汉语祈求关系清楚；保留“听我的声音”的具体表达。分号对应呼求与两项祈求之间的诗行推进。
