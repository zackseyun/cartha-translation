  text: אַֽל תִּ֭תְּנֵ/נִי בְּ/נֶ֣פֶשׁ צָרָ֑/י כִּ֥י קָֽמוּ בִ֥/י עֵֽדֵי שֶׁ֝֗קֶר וִ/יפֵ֥חַ חָמָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/012.yaml
  text: Do not give me over to the desire of my adversaries[a], for false witnesses have risen against me[c][b], and they breathe out violence.
translation:
  language: zh_hans
  text: 不要任凭我的敌人随心所欲地处置我；因为假见证人起来攻击我，吐出凶暴的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为假见证人起来攻击我，还有一个吐出凶暴话语的人。”希伯来文末句为单数形式；它也可能是对前面假见证人的整体或逐一的描述。首句直译为“不要把我交给我敌人的意愿”；其中希伯来词“内菲什”（נֶפֶשׁ）在此指欲望、意愿或胃口，并非狭义的“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנֵנִי
  choice: 把我交给
  rationale: נתן在否定祈使语境中表示把某人交在他人权下；“把我交给”自然地保留了被交付、任人摆布的含义。
- source_word: בְּנֶפֶשׁ צָרָי
  choice: 敌人，任他们遂心所欲
  rationale: נֶפֶשׁ在此不是狭义的“灵魂”，而指欲望、意愿或胃口。采用分句表达，使汉语自然，同时保留敌人欲望得到满足的敌对意味。
- source_word: צָרָי
  choice: 敌人
  rationale: צַר指敌对、压迫诗人的人；“敌人”是现代汉语中清楚而庄重的对应词。
- source_word: קָמוּ בִי
  choice: 起来攻击我
  rationale: קום加介词בְּ用于人时常表示起来反对或攻击某人；此译既保留“起来”的意象，也明确敌对关系。
- source_word: עֵדֵי שֶׁקֶר
  choice: 作假见证的人
  rationale: 该结构直指以虚假证词控告人的见证者；“作假见证的人”比“虚假的见证人”更自然，也保持法律语境。
- source_word: וִיפֵחַ חָמָס
  choice: 口中喷吐暴力
  rationale: יפח描绘呼出、喷出或说出，חמס可指暴力及残暴的不义。“口中喷吐暴力”保留鲜明意象，并可理解为前述假见证者整体的表现。
theological_decisions:
- issue: וִיפֵחַ的单数形式与前文复数“假见证者”的关系
  choice: 在正文中将其作为前述假见证者的整体描述：“口中喷吐暴力”
  alternative: 把它译作另一个单数人物：“还有一个口吐暴力的人”
  rationale: 希伯来文形式为单数，但可能具有集合、分配或同位说明作用。正文避免在汉语中生硬地制造人数冲突，脚注保留单数人物的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“任他们遂心所欲”使希伯来语中较难直译的“交给敌人的欲望”成为自然汉语；“喷吐暴力”保留原文强烈而具体的呼吸意象。
