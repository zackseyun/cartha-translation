  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/001.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: zh_hans
  text: '大卫的诗[a]。


    雅威[b]是我的光，是我的拯救，

    我还怕谁呢？

    雅威是我生命的堡垒，

    我还惧怕谁呢？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”也可译作“大卫作”“属于大卫”“关于大卫”或“为大卫而作”；希伯来语标题 לְדָוִד 可表示作者、归属或关联。
    reason: alternative_reading
  - marker: b
    text: “雅威”音译自希伯来文神名 יהוה（YHWH）；其古代确切读音不能完全确定，也常译作“耶和华”或以“上主”代称。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 这是诗篇标题的惯用表达；希伯来语介词 לְ 可表示作者、归属或关联，因此正文采用自然简洁的标题，脚注保留其语义范围。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名 יהוה（YHWH）按其通常重构的读音音译为“雅威”，保留其作为专名的性质，而不以称号替代。
- source_word: אוֹרִי
  choice: 我的光
  rationale: 直译光的意象；该隐喻在现代汉语中清楚有力，无须解释为引导、希望等具体含义。
- source_word: וְיִשְׁעִי
  choice: 是我的拯救
  rationale: יֵשַׁע 表示拯救或解救；“拯救”既保留广泛的获救含义，也与前一分句构成自然并列。
- source_word: מִמִּי אִירָא
  choice: 我还怕谁呢
  rationale: 希伯来语直译近于“我会怕谁”，在此为表达信靠的反问；“还……呢”自然传达其确信语气。
- source_word: מָעוֹז חַיַּי
  choice: 我生命的堡垒
  rationale: מָעוֹז 指坚固、可供防护之处；“堡垒”保留原文具体的防御意象，“我生命的”照应希伯来语所属结构。
- source_word: מִמִּי אֶפְחָד
  choice: 我还惧怕谁呢
  rationale: פחד 与前面的 ירא 意义相近，可带惧怕、惊恐之意；用“惧怕”既形成平行，又保留措辞变化。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列之神的专名 יהוה。译作“雅威”可保留专名，并区别于“上主”等称号；脚注说明其原文形式，避免把读音重构呈现为毫无疑义。
- issue: 诗篇标题 לְדָוִד 的关系含义
  choice: 正文作“大卫的诗”，脚注保留作者、归属及关联的可能性
  alternative: 大卫作；属于大卫；关于大卫；为大卫而作
  rationale: 介词 לְ 在诗篇标题中并不必然只表示作者身份。采用汉语惯用标题，同时明确原文没有排除其他关系，以免过度确定作者问题。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两组短句保持希伯来诗歌的平行结构，并以“怕／惧怕”体现 ירא 与 פחד 的近义变化；“光”“堡垒”等核心意象均予保留。
