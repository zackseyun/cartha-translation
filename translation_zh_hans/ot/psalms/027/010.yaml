  yaml_path: translation/ot/psalms/027/010.yaml
  text: For my father and my mother have forsaken me[a], but Yahweh will take me in.
translation:
  language: zh_hans
  text: 因为我的父亲和我的母亲离弃了我，耶和华却必收留我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收留”所译的希伯来语动词直译为“聚集、收聚”；在这里也可译作“接纳我”或“把我接去”，含有欢迎和保护之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 即使
  rationale: כִּי 可引出原因或情境；结合本句前后强烈的转折关系，汉语用“即使……也……”自然表达假设或极端情境，同时不硬性断定父母已经实际离弃诗人。
- source_word: אָבִי וְאִמִּי
  choice: 我的父母
  rationale: 合译为现代汉语自然的集合称谓“我的父母”，完整保留父亲和母亲双方。
- source_word: עֲזָבוּנִי
  choice: 离弃我
  rationale: עזב 可指离开、抛弃或离弃；“离弃”保留原文较强的情感分量，又符合庄重的诗歌语体。希伯来语完成式在此可描绘设想中已成事实的极端处境，不必机械译成过去时。
- source_word: וַיהוָה
  choice: 耶和华也
  rationale: 连接词形式上为“和”，语境中形成鲜明对照；“即使……也……”已承载转折关系，故用“也”使汉语结构顺畅。神名 יהוה 音译为“耶和华”，沿用现代中文圣经读者熟悉的专名。
- source_word: יַאַסְפֵנִי
  choice: 必收留我
  rationale: אסף 的基本义是“聚集、收聚”，用于人时可表达接纳、收容和保护。“收留”是自然现代汉语，并保留在遭离弃之后被接纳照顾的含义；“必”表达未完成式在此所含的确信。
theological_decisions:
- issue: כִּי 与完成式 עֲזָבוּנִי 是否断言父母已经离弃诗人
  choice: 译作“即使我的父母离弃我”
  alternative: “因为我的父母已经离弃我”
  rationale: 原文 כִּי 及其语境容许原因、情境或让步色彩。译作“即使”保留这是极端设想或现实经历两种理解的张力，避免无根据地断定诗人的父母确已遗弃他。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经传统中广为人知的专名“耶和华”，明确保留这是以色列上帝的盟约之名，而不以普通称号替代。
- issue: יַאַסְפֵנִי 所表达的神圣行动
  choice: 必收留我
  alternative: 必聚集我／必接纳我
  rationale: “收留”同时传达接纳、照顾与保护，不把原文限定为抽象认可，也不额外引入特定救恩论或教派含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“即使……也必……”形成清楚有力的诗行对照；“离弃”保留情感力度，“收留”则让普通读者易懂。脚注标记按要求置于正文中。
