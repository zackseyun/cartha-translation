  text: קַוֵּ֗ה אֶל יְה֫וָ֥ה חֲ֭זַק וְ/יַאֲמֵ֣ץ לִבֶּ֑/ךָ וְ֝/קַוֵּ֗ה אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/014.yaml
  text: Wait for Yahweh[a]; be strong, and let your heart take courage; yes[c][b], wait for Yahweh.
translation:
  language: zh_hans
  text: 你当等候[a]雅威；要刚强，愿你的心坚强[b]；你当等候雅威[c]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候”也可译作“仰望”或“盼望”，含有怀着期待和信靠的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他必使你的心刚强。”这里的希伯来语动词也可按陈述或应许来理解，而非延续前面的劝勉。
    reason: alternative_reading
  - marker: c
    text: 原文重复“等候雅威”的命令，以加强劝勉。
    reason: discourse_emphasis
lexical_decisions:
- source_word: קַוֵּה / וְקַוֵּה
  choice: 等候
  rationale: קוה 的皮勒命令式表示带着期待而等待；“等候”既保留时间上的耐心，也能承载信靠与盼望的意味。末句重复译出，以保留诗歌的强调。
- source_word: אֶל
  choice: （等候）雅威
  rationale: אֶל 标明期待所指向的对象。现代汉语通常直接说“等候某人”，无须另译介词。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中可辨识的音译呈现四字神名，而不以称号替代专名。
- source_word: חֲזַק
  choice: 要刚强
  rationale: 命令式直接劝勉人刚强，不限定这种力量专指情绪、道德或属灵层面。
- source_word: וְיַאֲמֵץ לִבֶּךָ
  choice: 愿你的心坚定
  rationale: יַאֲמֵץ 在一连串劝勉中可按祈使性的未完成式理解；“愿……坚定”保留第三人称形式及 לִבֶּךָ“你的心”这一明确主语，同时用自然汉语表达内在勇气与定力。
- source_word: וְקַוֵּה
  choice: 再说，要等候
  rationale: 连接词加重复命令在此形成收束性的加强语气；“再说”自然呈现再次敦促，而不削弱原文的重复。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 正文以音译呈现四字神名，保留其专名性质；“耶和华”是汉语传统形式，但较不贴近通常重构的读音。
- issue: וְיַאֲמֵץ 的句法语气及主语
  choice: 劝勉式：“愿你的心坚定”
  alternative: 陈述或应许式：“他必使你的心刚强”
  rationale: 上下文由命令式组成，因此可将该未完成式理解为延续劝勉；但其形态也容许把雅威理解为未明说的主语，译作将来的应许。正文不补出“他”，另在脚注保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留短句、命令和末尾重复所形成的诗歌力度；“心”保留希伯来语关于内在人格、意志与勇气的意象。
