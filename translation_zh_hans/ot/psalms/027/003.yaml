  text: אִם תַּחֲנֶ֬ה עָלַ֨/י מַחֲנֶה֮ לֹֽא יִירָ֪א לִ֫בִּ֥/י אִם תָּק֣וּם עָ֭לַ/י מִלְחָמָ֑ה בְּ֝/זֹ֗את אֲנִ֣י בוֹטֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/003.yaml
  text: Though an army encamps against me[a], my heart will not fear; though war rises against me[c][b], even then I will trust.
translation:
  language: zh_hans
  text: 即使有军队安营来攻击我[a]，我的心也不惧怕；即使有战争向我兴起，我仍在这种情形下信靠[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “即使”也可译作“若”：若有军队安营来攻击我……若有战争向我兴起。希伯来语 אִם 既可表示条件，也可在此类诗歌语境中表示让步。
    reason: lexical_alternative
  - marker: b
    text: 或译：“对此我有信心”，又或：“尽管如此，我仍有信心。”原文“在这……信靠／有信心”十分简练；“这”可指刚描述的威胁，也可能与上文有关，且没有明说信靠的对象。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: 虽
  rationale: 此处两个 אִם 构成诗歌平行句，语境适合让步义“虽／即使”；同时在脚注保留条件义“若”。
- source_word: תַּחֲנֶה ... מַחֲנֶה
  choice: 有军队安营
  rationale: 动词 חנה 表示安营，名词 מַחֲנֶה 字面可指营地，此处与“战争”平行，转喻为驻扎的军队。译文兼顾军事画面与现代汉语自然度。
- source_word: עָלַי
  choice: 攻击我
  rationale: 介词短语字面为“在我之上／针对我”，在敌军和战争语境中表示敌对地来攻；“攻击我”比“在我周围”更清楚。
- source_word: לֹא יִירָא לִבִּי
  choice: 我的心也不惧怕
  rationale: 保留原文以“我的心”为主语的表达，不简化成“我不怕”；“也”自然承接让步句。
- source_word: תָּקוּם ... מִלְחָמָה
  choice: 有战争起来
  rationale: 保留 קום“起来、兴起”的鲜明意象，并以“战争”为主语，不收窄为某一场战役。
- source_word: בְּזֹאת אֲנִי בוֹטֵחַ
  choice: 我仍在这境况中信靠
  rationale: בְּזֹאת 表达简略，可指“在这事上／在这种境况中”；בטח 兼有信靠和确信之意。正文以自然汉语表达威胁之中仍然信靠，同时用脚注保存歧义。
theological_decisions:
- issue: בְּזֹאת 的所指及 בטח 的语义重心
  choice: 理解为指向刚才描述的威胁境况：“我仍在这境况中信靠”。
  alternative: 可译为“对此我有信心”“尽管如此，我仍有信心”，也可能把所指联系到上文的耶和华。
  rationale: 紧邻的军队与战争最可能是“这”的所指，但希伯来文没有明说信靠的对象。译文不补出“耶和华”，脚注保留“信靠／有信心”及所指方面的张力。
translation_notes:
  register: 采用现代、庄重且易懂的诗体散文。保留“安营”“我的心”“战争起来”等原文意象；避免补出原文未明说的信靠对象。脚注标记均已置于正文。
