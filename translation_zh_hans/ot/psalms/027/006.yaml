id: PSA.27.6
reference: Psalms 27:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֨ה יָר֪וּם רֹאשִׁ֡/י עַ֤ל אֹֽיְבַ֬/י סְֽבִיבוֹתַ֗/י וְ/אֶזְבְּחָ֣ה בְ֭/אָהֳל/וֹ זִבְחֵ֣י תְרוּעָ֑ה אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/006.yaml
  text: And now my head will be lifted up above my enemies around me[a], and I will offer in his tent sacrifices of joyful shouting; I will sing, yes[b], I will make music to Yahweh.
translation:
  language: zh_hans
  text: 如今，我的头必高过四围的仇敌；我要在他的帐幕里[a]献上欢呼的祭[b]。我要歌唱，我要向耶和华奏乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的帐幕”按上下文最自然是指耶和华的帐幕。
    reason: 代词所指
  - marker: b
    text: “欢呼的祭”也可译作“伴着欢呼献上的祭”；希伯来语既可强调祭的欢庆性质，也可强调献祭时伴随的欢呼。
    reason: 词义与句法的可能译法
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 保留连接语气和时间转折，表明诗人从祈求转向对当前或即将临到之得胜的确信。
- source_word: יָרוּם רֹאשִׁי
  choice: 我的头必高过
  rationale: 保留“头”这一希伯来意象，表达尊荣、信心和得胜；“必”体现未完成式在此所表达的确信与期待。
- source_word: עַל אֹיְבַי סְבִיבוֹתַי
  choice: 高过四围的仇敌
  rationale: עַל 表达居于仇敌之上，סְבִיבוֹתַי 则说明仇敌环绕诗人；译文同时保留两层意思。
- source_word: וְאֶזְבְּחָה
  choice: 我要……献上
  rationale: 该鼓励式表达决意；汉语用“我要”传达主动而坚定的敬拜意愿。与宾语“祭”搭配时，“献上”比重复说“献祭”自然。
- source_word: בְּאָהֳלוֹ
  choice: 在他的帐幕里
  rationale: 直译第三人称单数词尾，不在正文中把指代对象明说出来；按上下文最自然是指耶和华的帐幕。
- source_word: זִבְחֵי תְרוּעָה
  choice: 欢呼的祭
  rationale: 构造短语可指以欢呼为特征的祭，也可指伴随欢呼献上的祭；简洁的偏正结构保留这种关系上的开放性。
- source_word: אָשִׁירָה וַאֲזַמְּרָה
  choice: 我要歌唱，我要……奏乐
  rationale: 分别呈现两个敬拜动词；זמר 可指歌唱赞美或奏乐，此处用“奏乐”避免与前一动词完全重复，同时保留音乐含义。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，并用“向”自然连接歌唱奏乐的对象。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文明确使用神的专名。正文采用现代中文基督徒最熟悉且易懂的音译“耶和华”，不以称号取代专名。
- issue: בְּאָהֳלוֹ 中“他的”所指
  choice: 正文保留“他的”，脚注说明最自然指耶和华
  alternative: 直接译作“耶和华的帐幕”或理解为诗人的帐幕
  rationale: 语法形式本身只是第三人称单数；上下文中的献祭与向耶和华赞美使耶和华成为最自然的所指，但正文不必消除代词形式留下的轻微含混。
- issue: זִבְחֵי תְרוּעָה 中祭与欢呼的关系
  choice: 欢呼的祭
  alternative: 伴着欢呼献祭；欢庆祭
  rationale: 希伯来构造关系既可描写祭的欢庆性质，也可表示献祭时伴随欢呼；不将其限定为某种特定礼仪或单一关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我的头必高过”保留原文的身体意象；“四围的仇敌”延续诗歌语体而仍易理解。分号和句号呈现从得胜确信、献祭到歌唱奏乐的推进。
