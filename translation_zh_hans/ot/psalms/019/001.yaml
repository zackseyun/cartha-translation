  text: הַ/שָּׁמַ֗יִם מְֽסַפְּרִ֥ים כְּבֽוֹד אֵ֑ל וּֽ/מַעֲשֵׂ֥ה יָ֝דָ֗י/ו מַגִּ֥יד הָ/רָקִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/001.yaml
  text: The heavens declare the glory of God[b][a], and the expanse proclaims the work of his hands.
translation:
  language: zh_hans
  text: 诸天述说上帝的荣耀；穹苍[a]传扬他双手的作为[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穹苍”也可译作“天空”或“天穹”；希伯来词指铺展开来的天空。
    reason: lexical_alternative
  - marker: b
    text: “他双手的作为”也可译作“他亲手所造的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם
  choice: 诸天
  rationale: 该词可指天空或诸天；“诸天”既保留复数形式和宇宙范围，也符合诗歌的庄重语体。
- source_word: מְסַפְּרִים
  choice: 述说
  rationale: 分词表达持续的述说或宣告；“述说”自然保留拟人化，也与下句形成诗意平行。
- source_word: כְּבוֹד
  choice: 荣耀
  rationale: “荣耀”是 כבוד 在此最贴切的常用译法，涵盖上帝彰显出来的尊荣与威严。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是对神的称谓，不必音译为“埃勒”；“上帝”在现代汉语中清楚、庄重。
- source_word: וּמַעֲשֵׂה יָדָיו
  choice: 他双手的作为
  rationale: 保留希伯来文“他手的工作”这一具体拟人表达；汉语用“双手”更自然，同时不把意象抽象化为单纯的“创造”。
- source_word: מַגִּיד
  choice: 传扬
  rationale: 该使役分词表示使人知道、宣告；“传扬”与“述说”构成自然平行，又避免机械重复。
- source_word: הָרָקִיעַ
  choice: 穹苍
  rationale: רָקִיעַ 指铺展开来的天空或天穹；“穹苍”保留其宏阔意象与诗体庄重感，但现代读者可能需要脚注说明。
theological_decisions:
- issue: אֵל 的译法
  choice: 上帝
  alternative: 埃勒（El）
  rationale: 上下文强调受造界彰显创造者的荣耀，此词在这里作为神的称谓理解最自然；译作“上帝”不额外强化专名含义。
translation_notes:
  register: 采用现代、庄重而可诵读的诗歌语言。“诸天／穹苍”和“述说／传扬”保留希伯来诗歌的平行结构；标点用分号凸显两个对应分句。
