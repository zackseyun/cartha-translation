base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/005.yaml
  text: And it is like a bridegroom coming out from his wedding chamber[a]; it rejoices like a warrior to run a course.
translation:
  language: zh_hans
  text: 它如新郎走出洞房[a]，又如勇士欢然在自己的路途上奔跑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“婚礼华盖”，也可译“新婚居室”。希伯来语 חֻפָּה 可指婚礼所用的华盖，也可指新婚居室。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: 它
  rationale: 代词回指上一节的太阳。现代汉语用“它”自然地指无生命之物；句首的希伯来语连接词在本句中不必机械译作“而”。
- source_word: כְּחָתָן
  choice: 如新郎
  rationale: חָתָן 指新郎；“新郎”准确、自然，也保留婚礼意象。
- source_word: יֹצֵא
  choice: 走出
  rationale: יצא 表示从里面出去；“走出”保留分词所呈现的生动画面。
- source_word: מֵחֻפָּתוֹ
  choice: 走出洞房
  rationale: חֻפָּה 在这里可指婚礼华盖，也可指新婚居室。“洞房”用简洁、庄重的现代汉语呈现新郎从婚房出来的意象，同时以脚注保留词义歧义。
- source_word: יָשִׂישׂ
  choice: 欢然
  rationale: 该动词表达兴高采烈、欢欣雀跃；“欢然”简练而有诗意，与诗篇语体相称。
- source_word: כְּגִבּוֹר
  choice: 如勇士
  rationale: גִּבּוֹר 可指勇士、壮士或大能者；“勇士”兼具力量与英武之感，符合奔跑的英雄意象。
- source_word: לָרוּץ
  choice: 奔跑
  rationale: רוץ 的基本义是跑；“奔跑”传达充满力量的动作，不额外加入竞赛含义。
- source_word: אֹרַח
  choice: 自己的路程
  rationale: אֹרַח 指道路、路径。结合太阳横越天空的语境，“路程”自然传达所奔行的轨道；“自己的”在汉语中明确回指太阳，属于为行文通顺所作的轻度显化。
