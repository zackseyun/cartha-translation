base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/006.yaml
  text: Its rising is from one end of the heavens[a], and its circuit to their ends[c][b], and nothing is hidden from its heat.
translation:
  language: zh_hans
  text: 它从天的一端升起[a]，运行到天的尽头[b]；没有什么能躲过它的热力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “升起”也可译作“出来”或“出发”；希伯来语可指太阳的出现或其行出的起点。
    reason: lexical_alternative
  - marker: b
    text: “运行”也可译作“周行”或“循环”；希伯来语带有环行、走完行程的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: 从天这边
  rationale: קָצֶה指边缘、尽头；结合后半句复数“各端”，译作“天这边……天那边”自然呈现从一端到另一端的诗歌图景。汉语“天”也能自然表达שָׁמַיִם所指的穹苍，无须机械保留复数形式。
- source_word: מוֹצָאוֹ
  choice: 升起
  rationale: מוֹצָא本义为出来、出发之处或行动；承接上节的太阳，在此可指太阳升起。正文采用符合语境的“升起”，脚注保留较宽泛的“出来”。
- source_word: וּתְקוּפָתוֹ
  choice: 绕行
  rationale: תְּקוּפָה可指转动、循环或周行；“绕行”既保留其环行意象，又比名词化的“循环”更符合现代汉语诗句。
- source_word: עַל קְצוֹתָם
  choice: 到天那边
  rationale: 介词עַל与“绕行”连用，表达行程达到诸天另一端的范围；译为“到天那边”与前句“从天这边”形成自然对举。
- source_word: וְאֵין נִסְתָּר
  choice: 没有什么能躲过
  rationale: אֵין加被动分词נִסְתָּר表示没有任何人或物得以隐藏；“没有什么能躲过”在汉语中自然，并与后接מִן所表达的避开、免受相配。
- source_word: מֵחַמָּתוֹ
  choice: 它的热力
  rationale: חַמָּה在此指太阳发出的热；“热力”比“温暖”更有强度，也自然表达其作用范围。代词“它”指太阳，不把希伯来语阳性语法误作神话性人格。
theological_decisions:
- issue: 太阳拟人化的程度
  choice: 使用汉语中性的“它”，同时保留太阳升起、绕行以及万物无法躲避其热力的诗性描写。
  alternative: 以“他”对应希伯来语阳性单数后缀，强化拟人表达。
  rationale: 希伯来语阳性后缀首先由“太阳”的语法性别决定。现代汉语通常用“它”指太阳，可避免无根据地引入神格化意味，同时不削弱受造界作见证的诗歌图景。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“天这边……天那边”保留原文两端相对的空间意象；分号呈现后一句由太阳行程转向其热力普及万物的推进。所有代词均按现代汉语自然用法处理。
