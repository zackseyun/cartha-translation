base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/008.yaml
  text: The precepts of Yahweh are right[a], rejoicing the heart; the commandment of Yahweh is pure, enlightening the eyes.
translation:
  language: zh_hans
  text: '雅威的训令正直，使心欢喜；

    雅威的诫命纯净[a]，使眼目明亮。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纯净”或译“明澈”；这个希伯来语形容词可强调纯洁，也可由此带出清澈明亮的意味，与下句“使眼目明亮”相呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקּוּדֵי
  choice: 训令
  rationale: 该词指所颁定的指示或要求。“训令”既保留其指令性，也与本节后半句的“诫命”有所区别。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号代替。
- source_word: יְשָׁרִים
  choice: 正直
  rationale: 这里描述训令本身端正、正确；“正直”简洁地保留希伯来语“直、正”的意象与道德含义。
- source_word: מְשַׂמְּחֵי לֵב
  choice: 使人心欢喜
  rationale: 保留使役含义及分词所表达的持续功效；补出泛指的“人”，使现代汉语自然明白。
- source_word: לֵב
  choice: 心
  rationale: 保留希伯来诗歌的具体表达；此词在语境中可涵盖人的情感、思想和意志。
- source_word: מִצְוַת
  choice: 诫命
  rationale: 保留其盟约性命令的含义，并与前半句的“训令”形成原文中的同义而不完全同词的对应。
- source_word: בָּרָה
  choice: 纯净
  rationale: 该阴性形容词的基本含义是纯洁、洁净，与“诫命”搭配自然；“明澈”虽能与下句的光明意象衔接，却较具解释性，故列入脚注。
- source_word: מְאִירַת עֵינָיִם
  choice: 使人眼目明亮
  rationale: 保留使役分词的作用和“眼目”的具体光明意象；较直译的“照亮眼目”在现代汉语中略显生硬。
- source_word: עֵינָיִם
  choice: 眼目
  rationale: 保留原文具体名词及诗体色彩，不将其直接抽象化为“悟性”或“理解力”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近现今学界对该名读音的通行重构，也避免用“主”等称号代替专名。
- issue: בָּרָה 的语义取向
  choice: 纯净
  alternative: 明澈
  rationale: 正文采用词语本身较基本的纯洁、洁净含义，同时以脚注保留“明澈”这一可与“使人眼目明亮”形成紧密意象联系的理解，不消除原文的语义张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语；两行保持原文平行结构，并以“使人……”对应两个使役分词。
