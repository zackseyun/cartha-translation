id: PSA.19.14
reference: Psalms 19:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִֽהְי֥וּ לְ/רָצ֨וֹן אִמְרֵי פִ֡/י וְ/הֶגְי֣וֹן לִבִּ֣/י לְ/פָנֶ֑י/ךָ יְ֝הוָ֗ה צוּרִ֥/י וְ/גֹאֲלִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/014.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable before you[a], O Yahweh[b], my rock and my redeemer.
translation:
  language: zh_hans
  text: '愿我口中的言语、心里的默想，

    在你面前蒙悦纳[a]。

    雅威啊，我的磐石，我的救赎者[b]！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在你眼中蒙悦纳”。希伯来原文直译为“在你面前”。
    reason: lexical_alternative
  - marker: b
    text: “救赎者”所译的词，可指赎回或搭救人的一方；在古代以色列的法律和社会生活中，这一行动常与近亲应尽的责任有关。
    reason: cultural_note
lexical_decisions:
- source_word: יִהְיוּ
  choice: 愿……蒙
  rationale: 该未完成式在祷告语境中表达愿望或祈求；用“愿”自然传达其祈愿语气。
- source_word: לְרָצוֹן
  choice: 蒙悦纳
  rationale: 此结构表示在上帝面前被接受、得喜悦；“蒙悦纳”既自然庄重，也保留祷告和敬拜语境中的含义。
- source_word: אִמְרֵי פִי
  choice: 我口中的言语
  rationale: 保留原文“口”这一具体意象，并以现代汉语自然表达所说的话。
- source_word: הֶגְיוֹן לִבִּי
  choice: 心里的默想
  rationale: הֶגְיוֹן可指沉思、默念或内在思绪；“默想”与外在的“言语”构成清楚的内外对应，同时不把词义限定为单纯思想或出声低语。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 贴近原文“在你面前／临在中”，兼具关系性和接受评判的意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，不以称号替代原文的专名。
- source_word: צוּרִי
  choice: 我的磐石
  rationale: 直接保留原文的岩石隐喻，表达稳固、保护和倚靠，而不将其解释性改写为“避难所”。
- source_word: וְגֹאֲלִי
  choice: 我的救赎者
  rationale: גאל指赎回、解救或为近亲权益采取行动者；“救赎者”简洁地保留这一称谓，又避免在正文中过度限定为法律意义上的近亲。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”以音译专名，避免用“主”等称号替换；“耶和华”是汉语传统形式，但较不贴近通常重构的读音。
- issue: צוּרִי 的隐喻
  choice: 我的磐石
  alternative: 我的避难所
  rationale: 保留诗歌原有隐喻和其中开放的神学意涵，不把形象缩减为单一的保护功能。
- issue: גֹאֲלִי 的身份含义
  choice: 我的救赎者
  alternative: 我的至亲救赎者
  rationale: 该词具有赎回、解救及近亲责任等背景，但本节没有明确限定具体法律情境，因此正文采用较宽的“救赎者”，并以脚注说明文化背景。
translation_notes:
  register: 采用现代、庄重而易懂的祷告体。诗行保留“口中的言语／心里的默想”的内外平行结构，以及“磐石／救赎者”两个并列称谓；“雅威啊”明确呈现呼语。
