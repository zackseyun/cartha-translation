  text: Day to day pours forth speech[b][a], and night to night reveals knowledge.
translation:
  language: zh_hans
  text: 日日涌出话语[a]，夜夜显明知识[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “涌出话语”也可译作“说出话语”；原文动词描绘丰沛涌流的景象，不只是一般的说话。
    reason: lexical_alternative
  - marker: b
    text: “显明知识”也可译作“宣告知识”或“使人知道”。
    reason: lexical_alternative
lexical_decisions:
- source_word: י֣וֹם ... לְיוֹם
  choice: 一日向一日
  rationale: 保留重复名词与介词 ל 所表达的日与日之间的接续或传递，也维持两行的诗体结构。
- source_word: יַבִּיעַ
  choice: 涌出
  rationale: 该动词使役形带有泉水涌流、丰沛流出的意象；“涌出”比单纯的“说出”更能保留原文画面。
- source_word: אֹמֶר
  choice: 言语
  rationale: 此处泛指说出的表达或信息；“言语”自然庄重，并与下半句的“知识”形成平行。
- source_word: וְלַיְלָה לְּלַיְלָה
  choice: 一夜向一夜
  rationale: 对应上半句“一日向一日”，保留原文严格的平行与逐夜传递之意。
- source_word: יְחַוֶּה
  choice: 传扬
  rationale: 该词在此表示使人知道、宣告；“传扬”既体现向外传达，也适合本节一日一夜相继述说的诗意语境。
- source_word: דָּעַת
  choice: 知识
  rationale: 直接对应原文表示知识、认识的名词，并保留它与“言语”的概念平行。
