  text: שְׁגִיא֥וֹת מִֽי יָבִ֑ין מִֽ/נִּסְתָּר֥וֹת נַקֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/012.yaml
  text: Who can discern his errors? Clear me from hidden faults[a].
translation:
  language: zh_hans
  text: 谁能察觉自己的过错？求你使我脱离隐秘的过错[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“隐秘的罪”或“隐藏的事”。希伯来语可指隐藏的过错，也可能泛指隐藏的事；它没有说明这些事是当事人自己未察觉、他人所不知，还是一般意义上隐藏的事。“使我脱离”也可译为“洁净我，使我脱离”或“免除我对此的罪责”。
    reason: 保留מִנִּסְתָּרוֹת所指及“隐藏”对象的歧义，并说明נקה可带有洁净、免除罪责或宣告无罪的语义，不限于“赦免”。
lexical_decisions:
- source_word: שְׁגִיאוֹת
  choice: 过错
  rationale: 该词可指偏差、错误或因失误而犯的罪。“过错”在现代汉语中自然简洁，也保留了语境中的道德含义，却不把它限定为“无意之罪”。
- source_word: מִי
  choice: 谁能
  rationale: 疑问代词与后面的动词合译为“谁能”，自然传达反问所强调的人无法完全认识自身过错。
- source_word: יָבִין
  choice: 察觉
  rationale: 该动词有理解、辨明、识别之意；“察觉”适合人认不出自身过错的语境，同时不把含义缩窄为纯理性理解。
- source_word: מִנִּסְתָּרוֹת
  choice: 隐而未现的罪
  rationale: 该形式直译可作“隐藏之事”。与上句“过错”平行时，最可能指隐藏的过犯；“隐而未现”保留了它可能不为本人察觉、也可能不为他人所知的开放性。
- source_word: נַקֵּנִי
  choice: 求你赦免我
  rationale: 该命令式可表示使人无罪、免除罪责或洁净。“赦免我”在中文祈祷语体中自然，并传达从相关罪责中得释放的核心意思；“求你”补出希伯来命令式在祈求语境中的语气。
theological_decisions:
- issue: “隐藏之事”的性质及隐藏对象
  choice: 按上下句平行关系译作“隐而未现的罪”，但不说明是对本人隐藏还是对他人隐藏
  alternative: 可译作“隐秘的罪”或更宽泛的“隐藏之事”
  rationale: 与“过错”的平行关系强烈支持道德性的所指，但希伯来文没有明确说明这些罪向谁隐藏，因此正文和脚注均保留这种张力。
- issue: נקה所表达的是赦罪、宣告无罪还是洁净
  choice: 正文采用“赦免”，表达从隐藏过犯的罪责中得释放
  alternative: 可译作“洁净我”或“判我无罪”
  rationale: 该动词具有司法与洁净相交叠的语义范围；中文“赦免”在此语境自然，但脚注提醒读者原文也可侧重洁净或免除罪责，避免建立过窄的神学区分。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语言。“谁能察觉自己的过错”保持反问的简洁力度；“隐而未现”是常见且自然的圣诗式表达，但仍能被普通现代读者理解。脚注标记[a]已在正文出现。
