id: PSA.19.4
reference: Psalms 19:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/כָל הָ/אָ֨רֶץ יָ֘צָ֤א קַוָּ֗/ם וּ/בִ/קְצֵ֣ה תֵ֭בֵל מִלֵּי/הֶ֑ם לַ֝/שֶּׁ֗מֶשׁ שָֽׂם אֹ֥הֶל בָּ/הֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/004.yaml
  text: Their line has gone out through all the earth[a], and their words to the end of the world. In them he has set a tent for the sun[b],
translation:
  language: zh_hans
  text: '它们的准绳遍及全地[a]，

    它们的话语传到世界的尽头。

    他在它们中间为太阳安设了帐篷[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们的声音传遍全地。”希伯来文辅音文本作“它们的准绳”，但一些古代译本和许多解释者认为，在这一诗歌语境中意思是“声音”。
    reason: alternative_reading
  - marker: b
    text: “它们”很可能指上文所说的诸天或穹苍。
    reason: cross_reference
lexical_decisions:
- source_word: קַוָּם
  choice: 它们的准绳
  rationale: 马所拉文本作“它们的绳、准绳”。正文保留这一较直译且有争议的读法，不把诗歌中的隐喻直接解释成“声音”；另在脚注列出古代译本所支持的理解。
- source_word: יָצָא
  choice: 遍及
  rationale: 该动词字面为“出去”。这里与“全地”连用，译作“遍及”更符合现代汉语诗句，同时表达其延伸到各处的结果。
- source_word: מִלֵּיהֶם
  choice: 它们的话语
  rationale: 该词指言语、话语；这一译法自然地与前一分句构成平行，也保留受造界无声宣告的拟人表达。
- source_word: תֵבֵל
  choice: 世界
  rationale: 该词常指有人居住的世界；“世界”在本诗句中简洁自然。
- source_word: שָׂם
  choice: 安设了
  rationale: 表达上帝放置、设立的行动；“安设”兼顾准确、庄重和诗歌语体。
- source_word: אֹהֶל
  choice: 帐篷
  rationale: 采用该词的一般含义，不译作可能引入敬拜场所色彩的“会幕”。
- source_word: בָּהֶם
  choice: 在它们中间
  rationale: 保留希伯来文复数代词，不在正文中明说其所指；其先行词很可能是上文的诸天或穹苍。
- source_word: לַשֶּׁמֶשׁ
  choice: 为太阳
  rationale: 直接表达介词短语的受益或安排对象，无须增补解释。
theological_decisions:
- issue: “它们”在“他在它们中间”中的所指
  choice: 正文保留复数代词“它们”
  alternative: 直接译作“在诸天中”
  rationale: 原文没有在本节重述名词。保留代词可维持篇章衔接及原文的指代形式，并用脚注说明它很可能回指上文的诸天或穹苍。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。分行呈现希伯来诗歌的平行结构；正文保留“准绳”和复数代词造成的真实歧义，并以脚注辅助理解。
