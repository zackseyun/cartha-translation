id: PSA.19.7
reference: Psalms 19:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/007.yaml
  text: The law of Yahweh is perfect[a], restoring the soul; the testimony of Yahweh is trustworthy, making the simple wise.
translation:
  language: zh_hans
  text: 雅威的训诲完备，使生命复苏[a]；雅威的法度可靠，使缺乏经验的人有智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使生命恢复”；原文也可含有使人回转、重新得力的意思。
    reason: 保留מְשִׁיבַת נָפֶשׁ在“恢复、回转”与“复苏”之间的词义幅度。
lexical_decisions:
- source_word: תּוֹרַת
  choice: 训诲
  rationale: תּוֹרָה在这里指雅威所启示、具有约束力的教导，不仅限于成文法规。“训诲”既保留教导之意，也适合本诗庄重的平行句式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见的音译“雅威”呈现四字神名，保留其作为以色列之神专名的性质，不以头衔代替。
- source_word: תְּמִימָה
  choice: 完备
  rationale: 该词表示完整、健全、毫无缺欠；“完备”比“完美”更直接体现完整无缺的核心含义。
- source_word: מְשִׁיבַת
  choice: 使……复苏
  rationale: 该使役分词源自שׁוב，可表示使之返回、恢复，也可在此语境中表示使之重新焕发生机；正文采用自然的“复苏”，并以脚注保留“恢复”的词根意味。
- source_word: נָפֶשׁ
  choice: 生命
  rationale: נֶפֶשׁ可指生命、整个人或内在自我；“生命”在“使……复苏”的搭配中自然，并避免把希伯来语概念收窄为与身体分离的“灵魂”。
- source_word: עֵדוּת
  choice: 法度
  rationale: 此词在诗篇的启示术语系列中指雅威所确立、为其旨意作证的规定；“法度”能简洁表达其约法与规范色彩。
- source_word: נֶאֱמָנָה
  choice: 可靠
  rationale: 该词表示坚稳、可信赖；“可靠”是清楚自然的现代汉语表达。
- source_word: מַחְכִּימַת
  choice: 使……有智慧
  rationale: 该使役分词表示使人成为有智慧的人；此译法直接、自然。
- source_word: פֶּתִי
  choice: 缺乏经验的人
  rationale: פֶּתִי指阅历不足、容易受影响的人，不必然表示道德败坏；此译法比“愚人”更准确地保留这种含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质；不以“主”替换，也不采用源于混合读音传统的“耶和华”。
- issue: מְשִׁיבַת נָפֶשׁ的含义
  choice: 使生命复苏
  alternative: 使生命恢复；使人回转
  rationale: 该短语既可强调恢复生机，也可能保留שׁוב“返回、恢复”的意味。正文采用最符合诗歌语境的自然表达，并在脚注中保留另一种可能，避免消除原文张力。
- issue: נָפֶשׁ的人观含义
  choice: 生命
  alternative: 心灵；灵魂；整个人
  rationale: 此处不必把נָפֶשׁ理解为与身体分离的实体。“生命”能涵盖人的生机与整体存在，同时与动词自然搭配。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，并保持两组平行结构。“训诲”“法度”略带诗体和经典语域，但仍易于一般读者理解；“缺乏经验的人”避免了“愚人”可能带来的过强道德贬义。
