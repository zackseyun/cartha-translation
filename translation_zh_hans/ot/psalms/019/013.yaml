- from: 也求你拦阻你仆人，不让他犯任意妄为的罪[a]；不要让这些罪辖制我。这样，我就纯全[b]，并且免犯大罪[c]。
  to: 也求你拦阻你的仆人，使我不犯任意妄为的罪[a]；不要让这些罪辖制我。这样，我就必纯全[b]，得以脱离重大的悖逆[c]。
  rationale: 修正祷告者人称的一致性，并将末句改为“得以脱离重大的悖逆”，以更贴近“我将得以清白／脱离重大过犯”的原文表达，同时不在正文中预断其究竟侧重预防犯罪、获判清白或摆脱罪责。保留原有关于狂傲者、完整和清白的必要歧义说明。
