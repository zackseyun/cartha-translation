  source_fidelity: 正文对מִזֵּדִים采用“任意妄为的罪”，并以脚注保留“狂傲的人”的可能，符合上下文，也保留了原文歧义。“辖制”准确传达יִמְשְׁלוּ בִי的支配意象。末句原译“免犯大罪”将וְנִקֵּיתִי较具体地解释为预防犯罪；原文更直接表达从重大悖逆中得以清白／脱离，宜采用较不预设的译法。
  naturalness: “也求你”及祷告体自然庄重。但“你仆人，不让他……不要让……我”在同一句中由第三人称转为第一人称，汉语指代不够连贯。改为“你的仆人……使我”可既保持祷告中“你的仆人”的自称，也使第一人称祈求一致。
  terminology: “纯全”可表达אֵיתָם的完整、正直，适合保留，并由脚注说明不指绝对无罪。“重大的悖逆”比泛称“大罪”更能体现פֶּשַׁע的反叛、违犯意味；“得以脱离”避免把נקה限定为“免犯”或单一司法宣告。
