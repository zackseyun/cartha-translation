id: PSA.19.13
reference: Psalms 19:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּ֤ם מִ/זֵּדִ֨ים חֲשֹׂ֬ךְ עַבְדֶּ֗/ךָ אַֽל יִמְשְׁלוּ בִ֣/י אָ֣ז אֵיתָ֑ם וְ֝/נִקֵּ֗יתִי מִ/פֶּ֥שַֽׁע רָֽב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/013.yaml
  text: Also keep your servant back from presumptuous sins[a]; do not let them rule over me[d][c][b]. Then I will be blameless and be cleared from great transgression.
translation:
  language: zh_hans
  text: 也求你拦阻你的仆人，使我不犯任意妄为的罪[a]；不要让这些罪辖制我。这样，我就必纯全[b]，得以脱离重大的悖逆[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你的仆人远离狂傲的人。”希伯来语可指狂傲的人，也可指任意妄为的罪。
    reason: alternative_reading
  - marker: b
    text: 或译：“无可指摘”或“完整”。这里所说的是正直、完整，不一定指绝对无罪。
    reason: lexical_alternative
  - marker: c
    text: 或译：“从重大的悖逆中得以清白”或“免去重大悖逆的罪责”。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: גַּם
  choice: 也求你
  rationale: 承接上一节关于隐而未现之错的祈求；加上“求”使汉语祷告语气自然，而“也”保留其递进、附加作用。
- source_word: מִזֵּדִים
  choice: 不让他犯任意妄为的罪
  rationale: זֵדִים既可指狂傲的人，也可指由狂傲而来的妄为之罪。结合上文的过错和下文罪的辖制，正文采用罪行义；“任意妄为”兼顾故意与狂傲色彩。
- source_word: חֲשֹׂךְ
  choice: 拦阻
  rationale: 此命令式动词表达求上帝抑制、阻止诗人；“拦阻”简洁自然，并保留主动约束之意。
- source_word: עַבְדֶּךָ
  choice: 你仆人
  rationale: 在向上帝祷告的语境中，“你仆人”自然表达归属、顺服与自谦。
- source_word: אַל יִמְשְׁלוּ בִי
  choice: 不要让这些罪辖制我
  rationale: משל与介词ב连用表示支配、掌权；“辖制”保留罪如权势一般控制人的比喻。
- source_word: אָז
  choice: 这样
  rationale: 在汉语中自然引出前述祈求实现后的结果，保留希伯来文的结果关系。
- source_word: אֵיתָם
  choice: 我就纯全
  rationale: 该词表示完整、正直或无可指摘；“纯全”保留整体正直的含义，又不必然暗示绝对无罪。
- source_word: וְנִקֵּיתִי
  choice: 并且免犯
  rationale: נקה在此可表达无罪责、得以免除或保持清白；结合介词מִ与“大罪”，“免犯”在现代汉语中顺畅，并表达因蒙拦阻而不落入该罪。
- source_word: מִפֶּשַׁע רָב
  choice: 大罪
  rationale: פשע带有越界、悖逆的严重意味；“大罪”简明保留罪行的重大性质，脚注补明“重大悖逆”的可能译法。
theological_decisions:
- issue: מִזֵּדִים的所指
  choice: 正文译为任意妄为的罪
  alternative: 狂傲的人
  rationale: 上下文集中于过错和罪，且“辖制我”很自然地描写罪的权势；但希伯来词形也可直接指狂傲者，因此以脚注保留另一解释。
- issue: אֵיתָם的意义范围
  choice: 纯全
  alternative: 无可指摘／完整
  rationale: “纯全”表达道德上的正直与完整，不把经文解释成绝对无罪或某种特定的完全论。
- issue: וְנִקֵּיתִי מִפֶּשַׁע רָב的关系
  choice: 并且免犯大罪
  alternative: 并且从大罪中得以清白／免去大罪的罪责
  rationale: 希伯来文可侧重不陷入大罪，也可侧重从其罪责中被判为清白；正文依祈求上帝拦阻犯罪的上下文采用“免犯”，脚注保留司法或罪责层面的理解。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“任意妄为”保留זֵדִים中故意与狂傲的双重色彩；“辖制”保存罪人格化为统治权势的意象。正文避免把“纯全”解释为绝对无罪，并用脚注明示原文关于狂傲者、完整及免罪责的真实歧义。
