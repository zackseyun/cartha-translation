lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: מְנַצֵּחַ在诗篇题记中通常指负责音乐演奏或歌唱的人；“乐长”简洁庄重，也符合礼仪音乐语境。前缀לַ译作“交给”，表达题记中交付或指示演奏负责人的含义。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: מִזְמוֹר是带有音乐含义的诗篇体裁名称；在本题记中译作“诗”自然简洁，并与汉语诗篇题记的惯用表达相符。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词לְ在诗篇题记中可表示作者、归属、关联或奉献对象。“大卫的”在现代汉语中自然，也保留了原文关系未完全确定的含义，避免直接限定为“大卫所作”或“为大卫而作”。
theological_decisions:
- issue: 题记中לְדָוִד所表示的关系
  choice: 大卫的
  alternative: 大卫所作的；为大卫而作的
  rationale: 原文没有明确限定大卫与本诗之间究竟是作者、关联者还是奉献对象。采用“大卫的”保留这种真实歧义，不对作者身份或奉献关系作超出原文的断定。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保持诗篇题记的短句形式。“乐长”属于较凝练的礼仪音乐用语，但在上下文中清楚自然。
