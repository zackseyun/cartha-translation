  text: אֵֽין אֹ֭מֶר וְ/אֵ֣ין דְּבָרִ֑ים בְּ֝לִ֗י נִשְׁמָ֥ע קוֹלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/003.yaml
  text: There is no speech[a], and there are no words; their voice is not heard.
translation:
  language: zh_hans
  text: 没有言语，也没有话语；它们的声音没有被听见。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”或译“声响”。希伯来语 קוֹל 可指“声音”或“声响”。
    reason: 词汇替代
lexical_decisions:
- source_word: אֵין
  choice: 没有
  rationale: 作存在否定；用现代汉语“没有”自然地统摄“言语”和“话语”，并保留两个否定分句的并行关系。
- source_word: אֹמֶר
  choice: 言语
  rationale: 指说出的表达，不限于某一句话；“言语”庄重自然，也与下句“话语”构成诗歌同义并行。
- source_word: דְּבָרִים
  choice: 话语
  rationale: 上下文关乎传达与听见，因此取“话语”义，而非“事情”；复数含义可由现代汉语集合性名词自然表达。
- source_word: בְּלִי
  choice: 无人
  rationale: 与被动式“听见”结合译作“无人听见”，自然表达缺乏听闻这一情形，同时避免生硬的“没有被听见”。
- source_word: נִשְׁמָע
  choice: 听见
  rationale: 直接表达שׁמע的被动听觉意义；汉语以“无人听见”呈现原文“未被听见”的含义。
- source_word: קוֹלָם
  choice: 它们的声音
  rationale: קוֹל既可指“声音”，也可指“嗓音/话音”。这里以“声音”兼顾受造界发声的拟人意象和非语言声响的可能性；“它们”承接上文诸天等受造界。
theological_decisions:
- issue: 诸天的见证是否属于无声的传达
  choice: 译为“没有言语，也没有话语；它们的声音无人听见”，保留普通语言缺席且声音不可听见的表层句法。
  alternative: 也可将末句理解为“没有听不见它们声音的地方”，即它们的声音无处不被听见；或理解为它们不用言语便作见证。
  rationale: 马所拉文本的短句存在解释张力。按词面，בְּלִי נִשְׁמָע קוֹלָם较自然地表达“它们的声音未被听见”；但诗篇19:2、4的上下文又强调其宣告普及全地。正文不借上下文改写本句，以保留创造界既“述说”又无通常可听言语的诗意张力。
translation_notes:
  register: 采用现代、简洁而庄重的诗体汉语；保留三个分句的否定递进和原文的拟人表达。脚注标记置于正文句末，与脚注条目完全对应。
