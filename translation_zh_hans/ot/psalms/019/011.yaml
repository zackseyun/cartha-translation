  text: גַּֽם עַ֭בְדְּ/ךָ נִזְהָ֣ר בָּ/הֶ֑ם בְּ֝/שָׁמְרָ֗/ם עֵ֣קֶב רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/011.yaml
  text: Also[a], your servant is warned by them[b]; in keeping them there is great reward.
translation:
  language: zh_hans
  text: 你的仆人也因这些受到警戒[a]；谨守这些，就有丰厚的回报[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“也从这些得到警告”；原文动词可表示“受到警戒”，也可表示“得到警告／留意警戒”。
    reason: lexical_alternative
  - marker: b
    text: “回报”也可译作“结果”或“报偿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 承接上文对耶和华话语与典章的赞美，保留添加、递进的语气。
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: 诗人向上帝说话，并以敬虔关系中的“仆人”自称；此处不必突出法律意义上的奴隶身份。
- source_word: נִזְהָר
  choice: 受到警戒
  rationale: 保留该词尼法勒形态所表达的被动或结果意味，同时符合现代汉语表达。
- source_word: בָּהֶם
  choice: 从中
  rationale: 指上文所说耶和华的典章等；与“受到警戒”搭配自然，并可表达这些话语作为警戒来源或媒介。
- source_word: בְּשָׁמְרָם
  choice: 遵守这些
  rationale: 简明表达介词加不定词结构所含的情境或方式意义，即在遵守它们这件事上。
- source_word: עֵקֶב
  choice: 回报
  rationale: 此处指遵守之后所得的有益结果；“回报”既保留奖赏意味，也不强行限定为功德所得。
- source_word: רָב
  choice: 丰厚
  rationale: 表达数量或程度之大，与汉语“回报”搭配自然。
theological_decisions:
- issue: 本节是否宣称人在上帝面前凭功劳赚取奖赏
  choice: 表述遵守上帝启示的话语会有丰厚回报，但不进一步界定其功德性质。
  alternative: 把经文明确译成遵命便从上帝那里赚得奖赏。
  rationale: 希伯来文肯定遵守与丰厚回报之间的联系，却未说明一套功德论；译文应保留这种正面结果及其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从中受到警戒”贴近原文被动意味；“遵守这些，就有……”用自然汉语表达原文的情境或方式结构。所有脚注标记均已置于正文。
