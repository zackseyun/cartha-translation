  text: They are more desirable than gold[a], even than much fine gold, and sweeter than honey and drippings from the honeycomb.
translation:
  language: zh_hans
  text: 它们比金子、比许多精金更可羡慕[a]；比蜜、比蜂房滴下的蜜更甘甜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“比金子更可羡慕……比蜜更甘甜，胜过蜂房的滴蜜。”希伯来文使用分词和比较短语；末句较直译可作“蜂房的滴蜜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּחֱמָדִים
  choice: 更令人爱慕
  rationale: 该词是חמד的被动分词，承接上一节所说耶和华的典章；与后面的比较介词מִן连用，因此译作“更令人爱慕”，既表达可羡慕、值得渴求之意，也符合现代汉语。
- source_word: מִזָּהָב
  choice: 比金子
  rationale: 介词מִן在此表示比较，“比金子”自然承接“更令人爱慕”。
- source_word: וּמִפַּז רָב
  choice: 甚至胜过许多精金
  rationale: פַּז指精炼、纯净而贵重的金，רָב表示数量多；“甚至胜过”呈现由一般金子到许多精金的递进。
- source_word: וּמְתוּקִים
  choice: 更甘甜
  rationale: 该形容词与前面的分词平行，并由后续比较介词מִן构成比较；“更甘甜”准确而自然。
- source_word: מִדְּבַשׁ
  choice: 比蜜
  rationale: מִן在此同样表示比较，以“比蜜”与“更甘甜”搭配。
- source_word: וְנֹפֶת צוּפִים
  choice: 蜂房滴下的蜜
  rationale: נֹפֶת描写流出或滴下的蜜，צוּפִים可能指蜂房或蜂巢的蜜格；此译保留鲜明意象，并表达上等蜂蜜的甘甜。
