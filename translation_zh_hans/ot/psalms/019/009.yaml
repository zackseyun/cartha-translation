id: PSA.19.9
reference: Psalms 19:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִרְאַ֤ת יְהוָ֨ה טְהוֹרָה֮ עוֹמֶ֪דֶת לָ֫/עַ֥ד מִֽשְׁפְּטֵי יְהוָ֥ה אֱמֶ֑ת צָֽדְק֥וּ יַחְדָּֽו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/009.yaml
  text: The fear of Yahweh is pure[a], enduring forever; the judgments of Yahweh are true[d][c][b]; they are altogether righteous.
translation:
  language: zh_hans
  text: 对耶和华的敬畏是纯洁的[a]，存到永远[b]；耶和华的裁决[c]真实，全都公义[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“站立到永远”。
    reason: lexical_alternative
  - marker: c
    text: 或译“判决”“典章”或“法令”。
    reason: lexical_alternative
  - marker: d
    text: 希伯来文也可理解为“合在一起完全公义”，强调这些裁决作为整体全然公义。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: 对耶和华的敬畏
  rationale: 保留希伯来文“敬畏耶和华”的丰富含义，包括畏惧、崇敬和忠诚；加“对”可在现代汉语中清楚表明敬畏的对象，避免误解为耶和华自身所怀的敬畏。
- source_word: טְהוֹרָה
  choice: 纯洁
  rationale: 既可表达道德或礼仪上的洁净，也能自然地描述本节所称颂的敬畏；“洁净”作为可行的近义译法列入脚注。
- source_word: עוֹמֶדֶת לָעַד
  choice: 存到永远
  rationale: 该短语直译为“站立到永远”，在此表达恒久不变；“存到永远”兼顾原意和现代汉语的自然表达。
- source_word: מִשְׁפְּטֵי יְהוָה
  choice: 耶和华的裁决
  rationale: מִשְׁפָּט可指审判、裁定、典章或法令；“裁决”保留司法意味，同时在现代汉语中清楚自然。
- source_word: אֱמֶת
  choice: 真实
  rationale: 此处作谓语，说明耶和华的裁决真实、可信；译作“真实”不额外限定它究竟侧重事实正确还是信实可靠。
- source_word: צָדְקוּ יַחְדָּו
  choice: 全都公义
  rationale: 动词צָדְקוּ表明这些裁决是公义的，יַחְדָּו强调它们合在一起或无一例外；“全都公义”简洁保留其总体和全称意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，以专名而非一般称号呈现四字神名。
theological_decisions:
- issue: 在一系列描述神启示与训诲的用语中，“对耶和华的敬畏”所指为何
  choice: 保留“对耶和华的敬畏”这一希伯来表达
  alternative: 译作“耶和华的宗教”或“对耶和华的敬拜”
  rationale: 此语可能在上下文中转喻敬虔生活、敬拜或神所启示的信仰，但原文自身具有敬畏、崇敬和忠诚等多重含义，不宜在正文中将其缩减为单一解释。
- issue: יַחְדָּו所表达的公义范围
  choice: 译作“全都公义”
  alternative: 译作“合在一起完全公义”
  rationale: 原文既可强调所有裁决无一不公义，也可强调它们作为整体完全公义；正文采用能容纳两者的简洁说法，脚注说明其集体意味。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“纯洁”“存到永远”“真实”“公义”保持诗体的凝练和平行感；避免使用过度古雅的句式。所有脚注标记均紧随其所说明的词语或分句。
