lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题注中通常指负责音乐演奏的人。“乐长”简洁庄重，也比“得胜者”等字面译法更符合礼仪音乐语境。
- source_word: לִידוּתוּן
  choice: 按耶杜顿
  rationale: 介词 לְ 可表示归属、对象或关联；“按耶杜顿”保留可能涉及曲调、演奏方式或乐班传统的关联，同时以脚注说明其他可能。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: מִזְמוֹר 是诗篇中的音乐作品类别名称；在中文圣经语境中，“诗”自然、简明，并与“诗篇”这一书名相称。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 在诗篇题注中语义宽泛。“大卫的”比“大卫所作”更能保留作者、归属或关联等可能性。
