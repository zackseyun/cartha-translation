  text: וְ/עַתָּ֣ה מַה קִּוִּ֣יתִי אֲדֹנָ֑/י תּ֝וֹחַלְתִּ֗/י לְ/ךָ֣ הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/007.yaml
  text: And now[a], Lord, what do I wait for? My hope is in you.
translation:
  language: zh_hans
  text: '如今，主啊，我等候[a]什么呢？

    我的盼望在于你。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如今，主啊，我所盼望的是什么呢？”较贴近完成式也可译作“我一直等候（或盼望）什么呢？”希伯来语动词 קוה 兼有“等候”和“盼望”之意。
    reason: 保留 קוה 在“等候”与“盼望”之间的语义重叠，并说明其完成式形式所容许的较正式替代译法，避免把该形式简单限定为汉语过去时。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 既保留连接语气和时间转折，也自然引出诗人此刻所得的结论。
- source_word: מַה
  choice: 什么
  rationale: 作为疑问代词，引出带有反问意味的问题。
- source_word: קִוִּיתִי
  choice: 我还等候
  rationale: קוה兼有怀着期待等候和盼望之意；主文用“等候”与下句的“盼望”相互照应。“还”使“如今……等候什么”在现代汉语中自然，并体现当前指向，但不排除完成式所容许的译法，故以脚注说明。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝的尊称；译作“主”，并用“啊”明确呼语功能。
- source_word: תּוֹחַלְתִּי
  choice: 我的盼望
  rationale: 该名词表示盼望、期待；“我的盼望”准确而自然。
- source_word: לְךָ
  choice: 在于你
  rationale: 介词短语指出盼望所指向和倚靠的对象；“在于你”符合现代汉语表达。
- source_word: הִיא
  choice: 在于
  rationale: 阴性独立代词回指“我的盼望”，在无系词的希伯来语名词句中起强调或复指作用；汉语以判断结构自然表达，不另译为“它”。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 我的主
  rationale: אֲדֹנָי 在此是直接称呼上帝的惯用尊称。译作“主”既保留称号性质，也避免把其历史形态机械展开为领属短语。
- issue: 盼望所指向对象的表达
  choice: 我的盼望在于你
  alternative: 我的盼望是向着你
  rationale: לְךָ 可表达方向或对象；“在于你”自然传达诗人把盼望寄托于上帝，同时不额外界定这种倚靠的神学机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“如今”承接上下文并标示思路转折；“主啊”保留直接呼告；两行安排贴合诗歌节奏。脚注只处理原文真实存在的词义和体貌歧义。
