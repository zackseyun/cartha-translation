  text: הוֹדִ֘יעֵ֤/נִי יְהוָ֨ה קִצִּ֗/י וּ/מִדַּ֣ת יָמַ֣/י מַה הִ֑יא אֵ֝דְעָ֗ה מֶה חָדֵ֥ל אָֽנִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/004.yaml
  text: O Yahweh[a], make me know my end and what is the measure of my days; let me know how fleeting I am.
translation:
  language: zh_hans
  text: 雅威啊，求你使我知道我的结局，我年日的尺度究竟如何；好让我知道自己何等短暂。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己何等脆弱”或“自己何等转瞬即逝”。希伯来语表达十分凝练，既可强调人的脆弱，也可强调人生短暂。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנִי
  choice: 求你使我知道
  rationale: 这是 ידע 的使役式祈使形，带第一人称单数后缀，直译为“使我知道”；加“求你”使汉语祷告语气自然庄重。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名处理四字神名，采用现代汉语中常见的音译“雅威”，不以称号替代。
- source_word: קִצִּי
  choice: 我的结局
  rationale: קֵץ 指终点或尽头；此处关乎人生的终点，“结局”既贴近原义，也不额外引入“命运”的含义。
- source_word: וּמִדַּת יָמַי
  choice: 我年日的尺度
  rationale: מִדָּה 本义为“尺度、度量”；保留原文的度量意象，同时让上下文表达生命年日的限度。
- source_word: מַה הִיא
  choice: 究竟如何
  rationale: 疑问词与代词询问年日尺度的性质或大小；“究竟如何”比逐字译作“它是什么”更符合现代汉语。
- source_word: אֵדְעָה
  choice: 好让我知道
  rationale: 意愿式在这里表达前面祈求的目的或所求结果；“好让我知道”清楚保留这一关系。
- source_word: מֶה חָדֵל אָֽנִי
  choice: 自己何等短暂
  rationale: חָדֵל 在此语义凝练，可指会止息、脆弱或短暂无常；结合本节对人生终点和年日尺度的追问，“何等短暂”最自然，但以脚注保留“脆弱、转瞬即逝”等可能。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文以音译“雅威”保留其作为以色列之神专名的功能，不用称号“主”替代；“耶和华”是传统形式，但较不贴近通常重构的读音。
- issue: מֶה חָדֵל אָֽנִי 所强调的人生处境
  choice: 何等短暂
  alternative: 何等脆弱；何等转瞬即逝
  rationale: 原表达可兼有生命短促、会止息和人之脆弱的意味。正文依据上下文突出生命短暂，同时用脚注保留其真实语义张力，不把它限定为单一教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“年日的尺度”有意保留希伯来文的度量意象；分号呈现祈求与目的之间的关系。脚注标记置于其所解释的末句之后。
