source:
  edition: WLC
  text: שִֽׁמְעָ֥/ה תְפִלָּתִ֨/י יְהוָ֡ה וְ/שַׁוְעָתִ֨/י הַאֲזִינָ/ה֮ אֶֽל דִּמְעָתִ֗/י אַֽל תֶּ֫חֱרַ֥שׁ כִּ֤י גֵ֣ר אָנֹכִ֣י עִמָּ֑/ךְ תּ֝וֹשָׁ֗ב כְּ/כָל אֲבוֹתָֽ/י־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/012.yaml
  text: Hear my prayer[a], O Yahweh, and give ear to my cry; do not be deaf to my tears. For I am a sojourner with you[b], a resident alien like all my fathers.
translation:
  language: zh_hans
  text: 雅威啊，求你听我的祷告，侧耳听我的呼求；不要对我的眼泪闭耳不听[a]。因为我在你这里是客旅，是寄居者，像我所有的祖先一样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要对我的眼泪缄默。”希伯来语动词可表示“沉默”；但上文接连求神“听”和“侧耳听”，也支持主文“闭耳不听”的听觉理解。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“像我所有的父辈一样。”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: 求你听
  rationale: 这是向雅威发出的直接祈求；加“求”符合现代汉语祷告语体，又保留命令式恳求的力量。
- source_word: תְפִלָּתִי
  choice: 我的祷告
  rationale: 该词通常指祷告，此处直译自然明确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现神的专名，不用称号替代。
- source_word: וְשַׁוְעָתִי
  choice: 我的呼求
  rationale: שַׁוְעָה指人在困苦中的呼喊，常含求助意味；“呼求”兼顾情感力度和祈求语境。
- source_word: הַאֲזִינָה
  choice: 侧耳听
  rationale: 保留“耳”的意象，并与前句“听”构成诗歌平行。
- source_word: אֶל־דִּמְעָתִי
  choice: 对我的眼泪
  rationale: 原文单数可作集合用法；汉语“眼泪”自然地保留哭泣的具体意象。
- source_word: אַל־תֶּחֱרַשׁ
  choice: 不要……充耳不闻
  rationale: חרשׁ可指沉默，也可指不听；上下文连续使用“听”和“侧耳听”，主文采用听觉意义，同时用脚注保留“缄默”的可能。
- source_word: כִּי
  choice: 因为
  rationale: 引出诗人提出这一祈求的理由，现代汉语中清楚自然。
- source_word: גֵר
  choice: 寄居者
  rationale: 指住在非本族土地、没有本地人完整身份或产业地位的人；“寄居者”也保留人生短暂无属的意涵。
- source_word: עִמָּךְ
  choice: 在你这里
  rationale: עם基本义为“与、同”，此处表示诗人在神那里、神的领域中居住；“在你这里”比生硬的“与你”更符合现代汉语，同时避免过度解释。
- source_word: תּוֹשָׁב
  choice: 暂住者
  rationale: 与גֵר相关却不完全相同，强调居住而无永久归属；“暂住者”与“寄居者”形成可辨别的对应。
- source_word: כְּכָל־אֲבוֹתָי
  choice: 和我所有的祖先一样
  rationale: אבות字面为“父辈”，在这里泛指历代先人；“祖先”在现代汉语中自然明确，字面表达另见脚注。
theological_decisions:
- issue: 是否区分גֵר与תּוֹשָׁב这两个社会身份用语
  choice: 分别译为“寄居者”和“暂住者”
  alternative: 合并或近乎同义地译成“客旅”和“寄居者”
  rationale: 原文并列两个相关而有区别的身份词，以表达诗人在神面前没有永久产业和归属的处境；分别译出可避免把二者压平。
- issue: אַל־תֶּחֱרַשׁ在此表示“不听”还是“沉默”
  choice: 主文译为“不要……充耳不闻”
  alternative: “不要对我的眼泪缄默”
  rationale: 前两分句反复求神“听”和“侧耳听”，支持听觉意义；但动词也确实可以表示沉默，故以脚注保存歧义，不把另一含义排除。
- issue: אֲבוֹתָי的性别化祖先用语
  choice: 主文译为“我的祖先”
  alternative: “我的父辈”
  rationale: 此处复数“父辈”按希伯来语习惯指历代先人；现代汉语“祖先”准确表达所指范围，脚注同时说明字面形式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“侧耳听”保留诗歌意象；“寄居者／暂住者”刻意区分原文两个相关身份词。标点按汉语诗体处理，以分号呈现前后祈求与理由的转折层次。
