  rationale: 修订仅处理两处会影响词义精度的表达：以“闭耳不听”取代含有故意漠视色彩的“充耳不闻”，并以“客旅／寄居者”对应并区分 גֵר／תּוֹשָׁב。“在你这里”保留 עִמָּךְ 的直接关系表达，未将其解释性地改为“在你面前”。脚注继续保留动词“沉默”的可行释义及“父辈”的字面形式。
