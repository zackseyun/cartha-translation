review_pass:
  verdict: revise
  source_fidelity: 主句基本忠实地呈现了三重听闻意象、祈求的理由，以及 גֵר／תּוֹשָׁב 的并列。惟“充耳不闻”通常含有故意不理会之意，较原文在此语境中的“不要聋耳不听／不要沉默”更强；“暂住者”则容易将 תּוֹשָׁב 误解为短期停留者，未能恰当表达其居住而非本地拥有者的身份。
  naturalness: 整体庄重自然。“闭耳不听”保留听觉比喻，语气比“充耳不闻”更贴近祈祷中的恳求。“客旅”和“寄居者”是现代汉语中自然且具有诗篇语体的对应组合。
  terminology: “雅威”“祷告”“呼求”恰当。将 גֵר 译为“客旅”、תּוֹשָׁב 译为“寄居者”，可在汉语中保留两个相关身份词的区别，而不把后者误作单纯的短暂停留。“祖先”准确指称 אֲבוֹתַי，脚注保留其字面男性祖先用语。
  issues:
  - severity: medium
    issue: “充耳不闻”语义偏强
    rationale: 该成语往往指明知而故意不听，带有较强的责难意味；原文动词可指“聋”或“沉默”。在前文听觉平行中，“闭耳不听”较直接地保留听觉理解，并避免增加故意无视的含义。
  - severity: medium
    issue: “暂住者”未准确对应 תּוֹשָׁב
    rationale: תּוֹשָׁב 的重点是居住者但不具本地完整身份或产业地位，并非主要强调住期短暂。“寄居者”较能表达此社会身份；与“客旅”并列也能维持原文双词结构。
