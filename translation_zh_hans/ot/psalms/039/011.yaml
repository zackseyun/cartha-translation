  text: בְּֽ/תוֹכָ֘ח֤וֹת עַל עָוֺ֨ן יִסַּ֬רְתָּ אִ֗ישׁ וַ/תֶּ֣מֶס כָּ/עָ֣שׁ חֲמוּד֑/וֹ אַ֤ךְ הֶ֖בֶל כָּל אָדָ֣ם סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/011.yaml
  text: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
translation:
  language: zh_hans
  text: 你因罪孽用责备管教人；你像蛀虫一样，使他所珍爱的消损[a]。人全然不过如一口气[b]。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他所珍爱的”也可较具体地理解为“他的美貌”，或较广义地理解为“他的珍宝”。原句也可理解为：你使他所珍爱的像被蛀虫侵蚀一样消损。
    reason: lexical_alternative
  - marker: b
    text: “一口气”译自希伯来语 hevel，描写如呼气或雾气一般短暂、难以持存；传统常译作“虚空”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  choice: 以责罚
  rationale: 复数名词表示责备、纠正或惩戒；介词 בְּ 在此表手段。“以责罚”既保留工具性，也与下文“管教”自然衔接。
- source_word: עַל עָוֺן
  choice: 因人的罪过
  rationale: עָוֺן 可指罪孽、罪责或罪罚；此处最自然地说明管教的缘由。“罪过”保留道德与归责意味。补出“人的”使现代汉语关系清楚，并未增加新的指称。
- source_word: יִסַּרְתָּ אִישׁ
  choice: 管教他
  rationale: יסר 表示借惩戒加以纠正；אִישׁ 是代表性的阳性单数。汉语以“人……他”自然保留单数男性代词，同时具有泛指作用。
- source_word: וַתֶּמֶס
  choice: 你使……消损
  rationale: מסס 的使役形表达使之消融、衰残或消耗。“使……消损”保留渐渐败坏的意味，适合与蛀虫意象搭配。
- source_word: כָּעָשׁ
  choice: 如蛀虫侵蚀般
  rationale: עָשׁ 通常指蛀蚀衣物的虫或蛾。“蛀虫侵蚀”在现代汉语中更直接传出逐渐毁损的比喻功能。
- source_word: חֲמוּדוֹ
  choice: 他所珍爱的
  rationale: 该词指可喜爱、可珍视之物，也可能具体指美貌或广指珍宝。正文采用范围较宽的表达，避免无根据地限定。
- source_word: אַךְ
  choice: 果真
  rationale: 此处作强调性的总结。“果真”自然传达确然、郑重的语气。
- source_word: הֶבֶל
  choice: 一口气
  rationale: הֶבֶל 的基本意象是呼气、雾气般短暂而无实质之物。“一口气”在汉语中保留呼吸意象及转瞬即逝感，并由脚注说明传统译法。
- source_word: כָּל אָדָם
  choice: 世人……都
  rationale: אָדָם 在此泛指人类。“世人都”准确表达普遍范围，也符合现代汉语，不必机械复制希伯来语的语法性别。
- source_word: סֶלָה
  choice: （细拉）
  rationale: 该礼仪或音乐术语的确切含义不明，采用传统音译，避免过度解释。
theological_decisions:
- issue: 管教与罪的关系
  choice: 译作“因人的罪过，以责罚管教他”
  alternative: “以责罚惩治人的罪孽”
  rationale: עַל עָוֺן 较自然地交代管教人的原因，而不是把罪孽本身当作管教对象；正文保留神因罪而施行纠正性惩戒的张力。
- issue: חֲמוּדוֹ 所指范围
  choice: “他所珍爱的”
  alternative: “他的美貌”或“他的珍宝”
  rationale: 原词可具体指美好之处，也可泛指珍爱之物。正文选较宽表达，脚注保存具体与广义两种可能。
- issue: הֶבֶל 的人论意象
  choice: “世人果真都不过是一口气”
  alternative: “世人都不过是虚空”
  rationale: 原文首先唤起气息般短暂、无实质的意象；采用具体意象而不把它抽象化为某一套神学判断。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话。“责罚—管教”保留原文纠正与惩戒并存的语气；“蛀虫侵蚀”使古代意象对现代读者清楚。“细拉”置于括号内，标示其礼仪性插语。所有脚注标记均已置入正文。
