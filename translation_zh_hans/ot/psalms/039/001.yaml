base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/001.yaml
  text: I said[a], “I will guard my ways from sinning with my tongue; I will keep a muzzle for my mouth while the wicked is before me.”
translation:
  language: zh_hans
  text: 我曾说：“我要谨慎自己的道路，免得我用舌头犯罪；恶人在我面前的时候，我要给我的口套上口套。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: 我曾说
  rationale: 直译 Qal 完成式第一人称单数，表明诗人先前所说或立下的自我约束；不将其解释性地改成“我决心”。
- source_word: אֶשְׁמְרָה דְרָכַי
  choice: 我要谨慎自己的道路
  rationale: שׁמר 在此表达审慎看守，דְרָכַי 指个人的行事为人；保留“道路”这一希伯来意象，同时使现代汉语自然。
- source_word: מֵחֲטוֹא בִלְשׁוֹנִי
  choice: 免得舌头犯罪
  rationale: מן 加不定词表达避免或防止，ב 为工具用法；此译简洁地保留“舌头”作为言语器官的具体形象。
- source_word: אֶשְׁמְרָה לְפִי מַחְסוֹם
  choice: 我要给自己的嘴套上笼头
  rationale: מַחְסוֹם 是限制牲畜嘴部的笼头或口套；“套上笼头”保留原文鲜明的克制言语意象。
- source_word: בְּעוֹד רָשָׁע לְנֶגְדִּי
  choice: 恶人在我面前的时候
  rationale: בְּעוֹד 表同时发生的时间，לְנֶגְדִּי 意为“在我面前/在我面前出现”；רָשָׁע 为阳性单数的名词化形容词，译作单数“恶人”。
theological_decisions:
- issue: רָשָׁע 的单数及性别表达
  choice: 恶人
  alternative: 一个恶人／邪恶的人
  rationale: 原文是阳性单数的名词化形容词。现代汉语“恶人”自然保留单数类别意义，且不额外加入原文没有的“男人”；上下文未说明此人身份，不作进一步神学限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“道路、舌头、笼头、在我面前”等原文具体意象；两个“我要”传达 cohortative/imperfect 所表达的坚定自我约束。
