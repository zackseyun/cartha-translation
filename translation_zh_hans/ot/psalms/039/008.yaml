  text: מִ/כָּל פְּשָׁעַ֥/י הַצִּילֵ֑/נִי חֶרְפַּ֥ת נָ֝בָ֗ל אַל תְּשִׂימֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/008.yaml
  text: Deliver me from all my transgressions[a]; do not make me the reproach of a fool.
translation:
  language: zh_hans
  text: 求你救我脱离我一切的过犯；不要使我受愚顽人的羞辱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要使我成为愚顽人的耻辱。”希伯来语既可理解为受到愚顽人的羞辱，也可理解为成为与愚顽人或愚顽相关的耻辱。
    reason: 保留希伯来语属格结构חֶרְפַּת נָבָל在施事关系和关联关系之间的词义歧义。
lexical_decisions:
- source_word: מִכָּל פְּשָׁעַי
  choice: 脱离我一切的过犯
  rationale: מִן与כָּל合用表示从全部事物中脱离；פֶּשַׁע指违背正当权威的过犯或悖逆。“过犯”自然、庄重，并保留其道德和神学分量。
- source_word: הַצִּילֵנִי
  choice: 求你救我
  rationale: נצל的使役式祈使形表示搭救、解救。汉语祷告中加“求你”能自然表达希伯来语祈使语气，而“救我”简明地保留解救之意。
- source_word: חֶרְפַּת
  choice: 羞辱
  rationale: חֶרְפָּה可指责骂、羞耻或公开受辱。“羞辱”兼顾他人的鄙视与荣辱层面的含义，也符合现代汉语表达。
- source_word: נָבָל
  choice: 愚顽人
  rationale: 此词在诗篇中通常不只表示智力不足，更指道德上顽梗、藐视上帝的人。“愚顽人”比单纯的“愚人”更能保留这一含义，又不过度释义。
- source_word: אַל תְּשִׂימֵנִי
  choice: 不要使我受
  rationale: שׂים带人称宾语时可表示“使某人成为/处于某种境况”。结合חֶרְפַּת，译作“不要使我受”是自然汉语，同时表达诗人求上帝不让自己成为羞辱对象。
theological_decisions:
- issue: 诗人所求免受的羞辱与愚顽人的关系
  choice: 诗人求上帝不要让自己受到愚顽人的羞辱
  alternative: 不要使诗人成为与愚顽人相关的耻辱，或落入愚顽人的可耻处境
  rationale: 希伯来语构造חֶרְפַּת נָבָל可以表示愚顽人所施加的羞辱，也可能表示与愚顽人相关的耻辱。正文采用语境中较自然的施事理解，但用脚注保留构造本身的歧义，不把诗人明确说成愚顽人。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你救我”自然体现祈求语气；“过犯”和“愚顽人”保留诗篇的道德神学色彩。脚注标记置于其实际所解释的第二分句之后。
