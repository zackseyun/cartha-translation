- from: 我默然无声，连善言也不说[a]；我的痛苦就翻腾起来。
  to: 我默然无声；我连善言也缄口不言，我的痛苦便被搅动起来。[a]
  rationale: 修订保留“默然无声”所体现的加强表达，并以“缄口不言”清楚呈现第二个沉默动词。删除“就”所引入的强时序／因果意味，改以“被搅动起来”对应 נֶעְכָּר 的被动、受扰动态。脚注以自然中文保留 מִטּוֹב 的歧义，不把“善言”当作原文明确的词语。
