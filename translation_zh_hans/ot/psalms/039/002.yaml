  - severity: low
    issue: 脚注“对善保持沉默”表述不够清楚
    rationale: 这一直译式说法在现代汉语中不自然，且容易使读者误以为原文的宾语明确是“善”而非省略的善言。应说明原文仅作紧凑的“从／离开善”表达，并列出主要理解。
