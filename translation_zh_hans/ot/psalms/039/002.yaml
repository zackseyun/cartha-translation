source:
  edition: WLC
  text: נֶאֱלַ֣מְתִּי ד֭וּמִיָּה הֶחֱשֵׁ֣יתִי מִ/טּ֑וֹב וּ/כְאֵבִ֥/י נֶעְכָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/002.yaml
  text: I was mute in silence[a]; I kept silent from good[b], and my pain was stirred up.
translation:
  language: zh_hans
  text: 我默然无声；我连善言也缄口不言，我的痛苦便被搅动起来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“缄默”后直作“从／离开善”，其具体含义不明；可指甚至不说善言，也可指不使自己享受或接触美善之事。
    reason: 原文 מִטּוֹב 的介词结构紧凑而有歧义；正文按上下文译作“连善言也缄口不言”，脚注保留较宽泛的可能。
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: 我默然
  rationale: 该词为 אלם 的尼פעל完成时第一人称单数，可表示成为哑然、不能或不肯说话。“默然”保留了无言的状态，又不武断判定沉默是自愿还是被迫。
- source_word: דּוּמִיָּה
  choice: 无声
  rationale: 该名词表示寂静、无声；与前面的动词合译为“默然无声”，自然地体现希伯来文的加强和平行表达。
- source_word: הֶחֱשֵׁיתִי
  choice: 不说
  rationale: חשׁה 的使役形在此表示保持安静、缄默；结合后面的“善”译作“不说”，使中文通顺，同时借脚注交代原文结构的含混。
- source_word: מִטּוֹב
  choice: 连善言也
  rationale: 原文直译近似“离开善／不及于善”，结构简约且含义有争议。正文按语境理解为诗人甚至不说好的话，并用“连……也”表达强调；脚注保留较直译的其他可能。
- source_word: וּכְאֵבִי
  choice: 我的痛苦
  rationale: כְּאֵב 可指身体或内心的疼痛、苦楚；“痛苦”范围较广，不把诗人的经历局限为身体疼痛或某一种情绪。
- source_word: נֶעְכָּר
  choice: 翻腾起来
  rationale: עכר 的尼פעל形可表示被搅动、受扰或加剧。“翻腾起来”传达因压抑不语而内在痛苦被激起的动态感。
theological_decisions:
- issue: מִטּוֹב 所指的“善”是善言还是更广泛的美善
  choice: 正文译为“连善言也不说”，脚注保留较宽泛的理解
  alternative: “远离美善”或“对善保持沉默”
  rationale: 上下文讨论约束舌头和保持沉默，因此“善言”最符合直接语境；但原文没有“言语”一词，不宜彻底排除指一切美善之事的可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“默然无声”保留原文的加强表达；“善言”略带书面色彩，但普通读者容易理解，并适合诗篇语体。
