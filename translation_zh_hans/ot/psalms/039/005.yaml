source:
  edition: WLC
  text: הִנֵּ֤ה טְפָח֨וֹת נָ֘תַ֤תָּה יָמַ֗/י וְ/חֶלְדִּ֣/י כְ/אַ֣יִן נֶגְדֶּ֑/ךָ אַ֥ךְ כָּֽל הֶ֥בֶל כָּל אָ֝דָ֗ם נִצָּ֥ב סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/005.yaml
  text: Behold[a], you have made my days a few handbreadths, and my lifetime is as nothing before you; surely every man, though standing firm, is altogether vapor[c][b]. Selah
translation:
  language: zh_hans
  text: 看哪，你使我的年日不过几掌宽；我的寿数在你面前如同无有。世人即使站立得稳[a]，也全然不过是雾气[b]。细拉[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “站立得稳”也可译作“站立”或“坚定地站立”。
    reason: lexical_alternative
  - marker: b
    text: “雾气”也可译作“气息”或“虚空”；希伯来语 הֶבֶל 描绘短暂、倏忽即逝而难以把握之物。
    reason: lexical_alternative
  - marker: c
    text: “细拉”一词的确切含义不明，可能是诗歌或音乐上的提示。
    reason: textual_or_liturgical_clarification
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人郑重注意的诗歌语气，同时符合现代中文圣经体表达。
- source_word: טְפָחוֹת
  choice: 不过几掌宽
  rationale: 保留以手掌宽度衡量人生的具体意象，并用“几”体现复数及短促之意。
- source_word: נָתַתָּה יָמַי
  choice: 你使我的年日
  rationale: 此处 נתן 表示使之成为或规定；“使我的年日不过几掌宽”自然表达上帝所定人生之短暂。
- source_word: וְחֶלְדִּי
  choice: 我一生的岁月
  rationale: חלד 在此指人在世的生命期限；该译法与“年日”形成平行，也便于现代读者理解。
- source_word: כְאַיִן נֶגְדֶּךָ
  choice: 在你面前如同无有
  rationale: 保留比较及处于上帝面前的关系含义，不将其收窄为仅指上帝的评价。
- source_word: אַךְ
  choice: 也
  rationale: 在此与让步结构“即使……也……”结合，表达强调性的结论；其限制或强调的细微语气由整句体现。
- source_word: כָּל אָדָם
  choice: 世人
  rationale: אָדָם 是泛指全人类的单数集合性用法；“世人”简洁、庄重且不造成只指男性的误解。
- source_word: נִצָּב
  choice: 站立得稳
  rationale: 保留“站立”的字面意象，同时传达安稳、确立的可能含义；“即使”呈现语境中的让步张力。
- source_word: כָּל הֶבֶל
  choice: 全然不过是雾气
  rationale: הֶבֶל 的具体意象是气息、雾气，强调短暂和虚幻；“全然”体现 כָּל 的总括力度，而不把含义局限为道德性的“虚妄”。
- source_word: סֶלָה
  choice: 细拉
  rationale: 其确切功能不明，沿用传统音译，以免作出过度确定的解释。
theological_decisions:
- issue: אָדָם 在普遍性陈述中的范围
  choice: 世人
  alternative: 每一个人／人人
  rationale: 原文以泛指单数概括全人类。“世人”既保留整体概括，也自然包含男女所有人，不引入性别限定。
- issue: נִצָּב 与 הֶבֶל 的关系
  choice: 世人即使站立得稳，也全然不过是雾气
  alternative: 凡站立的人，全是雾气／人在最安稳时也不过是雾气
  rationale: 分词可指站立、被安置或稳固。采用让步表达呈现“看似稳固却仍短暂无常”的张力，但用脚注保留较字面的可能。
- issue: הֶבֶל 的隐喻含义
  choice: 雾气
  alternative: 气息／虚空／虚妄
  rationale: 采用具体意象，容纳短暂、无常、虚幻等多重含义，避免以“虚妄”提前锁定抽象或道德判断。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体中文。“几掌宽”保留希伯来诗的身体尺度意象；分号和句号呈现由个人感叹转向全人类结论的结构。所有不确定处均避免过度释义，并以脚注保留主要替代读法。
