  yaml_path: translation/ot/psalms/039/013.yaml
  text: Look away from me[a], so that I may smile again before I go and am no more.
translation:
  language: zh_hans
  text: 求你把目光从我身上移开，好让我重新振作，在我离去、不复存在之前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“好让我恢复力量”或“好让我重展笑容”。这里的希伯来语动词可表达重新明朗、得到舒缓或恢复力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁע
  choice: 转眼不看
  rationale: 这是阳性单数第二人称命令式；在本哀歌语境中，诗人求上帝移开注视，不再以使他受苦的目光对着他。“转眼不看”简洁自然，也保留了原文的目光意象。
- source_word: מִמֶּנִּי
  choice: 我
  rationale: 介词加第一人称单数后缀，表示从诗人身上移开；与“转眼不看”合译为“转眼不看我”。
- source_word: וְאַבְלִיגָה
  choice: 使我……重新有喜色
  rationale: בלג在此可指脸色重新明亮、心情舒展或力量恢复。“重新有喜色”保留明亮、振作的形象，同时以脚注说明“恢复力量”等可能含义。
- source_word: בְּטֶרֶם
  choice: 在……之前
  rationale: 准确表达时间关系，符合现代汉语。
- source_word: אֵלֵךְ
  choice: 离去
  rationale: הלך本义为“去、行走”，此处含蓄指向死亡。“离去”既保留委婉表达，也比直译“走”更符合庄重诗体。
- source_word: וְאֵינֶנִּי
  choice: 不复存在
  rationale: 表达不再在场或不再存活的终局性；“不复存在”保持原文含蓄庄重，并与“离去”构成诗意递进。
theological_decisions:
- issue: 是否把אֵלֵךְ וְאֵינֶנִּי所指的死亡明说出来
  choice: 译作“在我离去、不复存在之前”，保留原文的委婉说法
  alternative: 在我死去、从世上消逝之前
  rationale: 上下文显然指向死亡，但希伯来文没有直接使用“死”字。保留含蓄表达可维护诗歌的克制和原有张力，避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语气。“求你”补出命令式在对上帝祷告中的恳求色彩；句法保留原文从求告、目的到死亡期限的推进。
