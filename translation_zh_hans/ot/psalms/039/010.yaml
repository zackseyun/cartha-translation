source:
  edition: WLC
  text: הָסֵ֣ר מֵ/עָלַ֣/י נִגְעֶ֑/ךָ מִ/תִּגְרַ֥ת יָ֝דְ/ךָ֗ אֲנִ֣י כָלִֽיתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/010.yaml
  text: Remove your plague from me[d][c][b][a]; by the blow of your hand I am consumed.
translation:
  language: zh_hans
  text: 求你把你的灾殃[a]从我身上除去；因你手的攻击[b]，我已衰残[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾殃”或译“击打”或“苦难”。
    reason: lexical_alternative
  - marker: b
    text: “攻击”或译“打击”，也可理解为“敌对冲击”。
    reason: lexical_alternative
  - marker: c
    text: “衰残”或译“耗尽”或“消逝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: 除去
  rationale: 这是使役式命令语气，表达诗人直接恳求上帝移走临到自己的苦难；“除去”简洁庄重，并保留命令式的力度。
- source_word: מֵעָלַי
  choice: 从我身上
  rationale: 原文兼有“从”与“在……之上”的空间意象；“从我身上”既符合现代汉语习惯，也比单说“离开我”更充分地保留重压临身的画面。
- source_word: נִגְעֶךָ
  choice: 你的灾殃
  rationale: נגע可指击打、灾害或苦难。此处没有明确限定为疾病；“灾殃”能表达来自上帝的严重苦难，同时避免把具体性质说得过死。
- source_word: מִתִּגְרַת
  choice: 因……的攻击
  rationale: תִּגְרָה含争斗、敌对冲击或攻击之意，与“你的手”连用时，描绘上帝之手施加的强力冲击。“攻击”较自然，并保留原词带有的敌对、压迫性色彩。
- source_word: יָדְךָ
  choice: 你手
  rationale: 保留希伯来文以上帝的“手”表示其能力和作为的拟人意象，不改写为抽象的“能力”。
- source_word: אֲנִי כָלִיתִי
  choice: 我已经耗尽
  rationale: 显明主语“我”的强调，并以“已经”体现完成式所呈现的境况；“耗尽”传达诗人在上帝重击下精力、生命力近乎枯竭，却不必断定他已经死亡。
theological_decisions:
- issue: נִגְעֶךָ所指苦难的性质
  choice: 译作“你的灾殃”，明确其来自上帝，却不限定为疾病或某一种审判。
  alternative: 你的击打／你的苦难
  rationale: 经文把苦难直接归于上帝的行动，但没有说明其确切形式；译文保留这种神学张力，不额外断定它是瘟疫、疾病或特定刑罚。
- issue: “你手的攻击”所呈现的上帝行动
  choice: 保留强烈的“攻击”意象。
  alternative: 你手的打击／你手的敌意
  rationale: 原文用语强烈，诗人感到自己正承受上帝之手的压迫。译文不弱化这一哀诉，也不据此推演上帝对诗人的最终态度。
- issue: כָלִיתִי描述的状态
  choice: 译作“我已经耗尽”，表达极度衰竭。
  alternative: 我消逝了／我衰残了／我完了
  rationale: 完成式可强调已达到或正经历的耗竭状态；“耗尽”保留严重程度，同时避免把诗人的诗性哀叹解释成已经死亡。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“求你……除去”保留直接恳求的语气；分号维持原文两分句的紧密因果联系。避免使用过于医学化的“瘟疫”，也避免以抽象说法削弱“你手”的具体意象。
