  text: נֶ֭אֱלַמְתִּי לֹ֣א אֶפְתַּח פִּ֑/י כִּ֖י אַתָּ֣ה עָשִֽׂיתָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/009.yaml
  text: I am mute[a]; I do not open my mouth[b], because you have done it.
translation:
  language: zh_hans
  text: 我默然无声[a]，不开口，因为这是你所行的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我被使沉默”，或“我保持沉默”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“因为你行了”，宾语没有明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: 我默然无声
  rationale: 该词为אלם的尼法勒完成式，可表达进入沉默后所处的状态，也可能带有“被使沉默”的意味。“默然无声”自然、庄重，并保留结果状态；其他可能译法列于脚注。
- source_word: לֹא אֶפְתַּח פִּי
  choice: 不开口
  rationale: 原文直译为“不张开我的口”，是表示不说话的惯用语。“不开口”在现代汉语中自然简洁，并未把未完成式过度限定为将来或意愿。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出诗人保持沉默的原因，译作“因为”清楚表达因果关系。
- source_word: אַתָּה
  choice: 你
  rationale: 希伯来文明确使用第二人称代词，并置于动词之前而带有强调。“这是你所行的”借助汉语句式保留这一强调。
- source_word: עָשִׂיתָ
  choice: 这是你所行的
  rationale: עשה语义宽泛，可指“做、行”。原文没有明说宾语；“这是你所行的”以指示词承接语境，读来通顺，同时不具体界定神所行之事。
theological_decisions:
- issue: עָשִׂיתָ未明说的宾语及神的行动
  choice: 因为这是你所行的
  alternative: 因为你已经行了；因为是你做的
  rationale: 希伯来文只说“因为你行了”，宾语留白。正文用“这”承接上下文，却不进一步说明所指，既自然表达诗人承认神的行动，也保留经文对于苦难与神之作为之间关系的张力。
translation_notes:
  register: 采用现代、庄重且易懂的诗歌语体。“默然无声”与“不开口”保留原文的近义复沓；不补出神具体做了什么，以维持原文的简洁和含蓄。
