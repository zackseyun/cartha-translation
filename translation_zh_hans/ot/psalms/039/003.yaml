lexical_decisions:
- source_word: חַם
  choice: 发热
  rationale: 保留谓语所表达的内在热度及语境中的渐进意味，同时不提前混同下句明确的“火燃烧”意象。
- source_word: לִבִּי
  choice: 我的心
  rationale: “心”保留希伯来语关于内在自我、思想与情感中心的身体意象。
- source_word: בְּקִרְבִּי
  choice: 在我里面
  rationale: 自然表达热度发生于诗人内在，并保留原文的内部方位强调。
- source_word: בַּהֲגִיגִי
  choice: 我默想时
  rationale: הֲגִיג可指内心思索、低声沉吟或默想；此处将介词短语按时间关系表达，但不把活动限定为出声或不出声。
- source_word: תִבְעַר אֵשׁ
  choice: 火就燃烧起来
  rationale: 保留“火”的鲜明比喻，并用“燃烧起来”呈现由内心发热发展到火燃起的意象递进；“火”在原文无冠词，中文无需强加定指。
- source_word: דִּבַּרְתִּי
  choice: 于是我……说道
  rationale: “于是”自然呈现内在积聚继而发言的语篇次序；“说道”也为下一节直接引语作铺垫。
- source_word: בִּלְשׁוֹנִי
  choice: 开口说道
  rationale: 原文字面为“用我的舌头说”；中文若直译略显生硬，采用“开口说道”自然表达实际出声，同时脚注保留身体意象。
