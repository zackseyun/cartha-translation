  text: 我心里发热；我默想[a]时，火燃烧起来；于是我开口说：[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “默想”也可译作“沉思”或“低声沉吟”。原词可指内心思索，也可能包含轻声自语。
    reason: lexical_alternative
  - marker: b
    text: “开口说”直译为“用我的舌头说”。
