id: PSA.39.6
reference: Psalms 39:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַךְ בְּ/צֶ֤לֶם יִֽתְהַלֶּךְ אִ֗ישׁ אַךְ הֶ֥בֶל יֶהֱמָי֑וּ/ן יִ֝צְבֹּ֗ר וְֽ/לֹא יֵדַ֥ע מִי אֹסְפָֽ/ם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/006.yaml
  text: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[c][b]. He heaps up wealth and does not know who will gather it.
translation:
  language: zh_hans
  text: 人走来走去，确实不过如幻影[a]；人们忙乱，也全是徒然[b]。他积聚财物[c]，却不知道谁会收取这些。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幻影”原文直译为“形像”，也可译作“虚影”“幻象”；此处形容人生缺乏实质。
    reason: lexical_alternative
  - marker: b
    text: 原文是复数：“他们忙乱。”前一句虽用单数“人”，这里可能泛指人类众人。
    reason: grammatical_ambiguity
  - marker: c
    text: 原文只说“积聚”，没有明说所积聚的是什么；下文“这些”是复数，指他所积聚的各样财物。
    reason: implicit_object
lexical_decisions:
- source_word: אַךְ
  choice: 确实；也全是
  rationale: 该词在本节两次出现，用来加强断言。译文以“确实”和“也全是”传达强调及诗句的呼应，同时避免生硬重复。
- source_word: בְּצֶלֶם
  choice: 如幻影
  rationale: צֶלֶם本义为“形像”，此处强调人生如影像般虚幻、无实质；“如幻影”在现代汉语中自然，也保留诗性比喻。
- source_word: יִתְהַלֶּךְ אִישׁ
  choice: 人走来走去
  rationale: הלך的Hitpael形式可指来回走动或四处活动；אִישׁ是单数，此处以一个“人”概括人类的一般处境。
- source_word: הֶבֶל
  choice: 徒然
  rationale: 该词可指气息、虚空或虚妄；在这里修饰忙乱的活动，“徒然”准确表达其无益、无结果。
- source_word: יֶהֱמָיוּן
  choice: 人们忙乱
  rationale: המה表示喧嚷、躁动或忙乱。原文动词为复数，虽前句以单数“人”为主语，这里仍保留复数所表达的泛指人群。
- source_word: יִצְבֹּר
  choice: 他积聚财物
  rationale: צבר意为堆积、积聚；原文宾语省略，但下句的复数代词表明所积聚的是各样财物，故在正文补明。
- source_word: מִי אֹסְפָם
  choice: 谁会收取这些
  rationale: 原文直译为“谁会收取它们”，复数后缀指前面所积聚的各样财物；“这些”在汉语中既自然又保留复数指向。
theological_decisions:
- issue: אִישׁ的代表性单数用法
  choice: 人
  alternative: 一个男人；世人
  rationale: 原文以阳性单数אִישׁ代表一般人。汉语“人”可以保留单数泛指，不必额外强调男性，也不把第一分句直接改成复数。
- issue: 单数“人”之后出现复数动词יֶהֱמָיוּן
  choice: 前句译“人”，后句译“人们”
  alternative: 全节统一为单数“他”；全节统一为复数“世人”
  rationale: 保留原文由代表性单数转为泛指复数的张力，不擅自校正动词数，也使现代汉语读者能够理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“走来走去”“忙乱”贴近日常表达，“幻影”“徒然”保留诗篇的凝练感。分号呈现两组并列判断，末句以“却”凸显积聚与无知之间的反差。
