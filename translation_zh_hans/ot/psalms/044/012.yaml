  text: תִּמְכֹּֽר עַמְּ/ךָ֥ בְ/לֹא ה֑וֹן וְ/לֹ֥א רִ֝בִּ֗יתָ בִּ/מְחִירֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/012.yaml
  text: You sell your people for no gain[a], and you have not increased by their price.
translation:
  language: zh_hans
  text: 你把你的子民卖了，毫无所得[a]；你也没有因他们的价钱而获益。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你白白卖了你的子民；你没有因他们的价钱而增加财富。”
    reason: “בְלֹא הוֹן”可按语境译为“毫无所得”或“白白”；“רִבִּיתָ”字面含“使增加”之意，在此可明确为因其价钱而增加财富。
lexical_decisions:
- source_word: תִּמְכֹּר
  choice: 你把……卖掉
  rationale: 这是 מכר 的 Qal 未完成式第二人称阳性单数，直接向上帝陈诉。诗歌中可表达当前或鲜明呈现的行动；中文用不标明时态的“卖掉”，既自然，也保留现在与过去之间的语境弹性。
- source_word: עַמְּךָ
  choice: 你的子民
  rationale: עַם 指与上帝有归属关系的群体；“你的子民”比“你的国民”更能传达这里的关系意味。
- source_word: בְלֹא הוֹן
  choice: 一无所得
  rationale: הוֹן 可指财富、资财；在买卖语境中，该短语强调这次出售没有带来有价值的收益。“一无所得”符合现代汉语，同时保留无收益之意。
- source_word: וְלֹא רִבִּיתָ
  choice: 你并没有……增添什么
  rationale: רִבִּיתָ 源自 רבה 的 Piel，意为使增多或有所增加。此处不明确补出“财富”或“利润”，以尽量保留原文表达，同时使中文完整。
- source_word: בִּמְחִירֵיהֶם
  choice: 因卖他们所得的价款
  rationale: מְחִירֵיהֶם 字面为“他们的价钱”；בְּ 可表示凭借、由于或关联。结合出售语境，“因卖他们所得的价款”清楚表达增益的来源，又不把句意改写成单纯的商业术语。
theological_decisions:
- issue: 上帝“卖掉”其子民的拟人化与控诉语气
  choice: 直接保留“你把你的子民卖掉”
  alternative: 你任凭你的子民被卖
  rationale: 原文明确以第二人称动词将行动归于上帝。改成“任凭”会缓和诗人的控诉，并加入原文没有明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。分号呈现两个紧密相连的平行分句；正文保留第二句“增添”的原文意象，脚注提供更顺畅的商业语境译法。
