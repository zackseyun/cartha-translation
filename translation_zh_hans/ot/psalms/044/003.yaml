id: PSA.44.3
reference: Psalms 44:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י לֹ֪א בְ/חַרְבָּ֡/ם יָ֥רְשׁוּ אָ֗רֶץ וּ/זְרוֹעָ/ם֮ לֹא הוֹשִׁ֪יעָ֫ה לָּ֥/מוֹ כִּֽי יְמִֽינְ/ךָ֣ וּ֭/זְרוֹעֲ/ךָ וְ/א֥וֹר פָּנֶ֗י/ךָ כִּ֣י רְצִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/003.yaml
  text: For they did not possess the land by their sword[a], and their arm did not save them; but your right hand, your arm, and the light of your face did[b], because you delighted in them.
translation:
  language: zh_hans
  text: 因为他们不是靠自己的刀剑得了那地，他们的膀臂也没有救他们；成就这一切的，是你的右手、你的膀臂和你脸上的光[a]，因为你喜爱他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你临在的光”；希伯来文直译为“你脸上的光”，是上帝施恩、悦纳人的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ אָרֶץ
  choice: 得了那地
  rationale: יָרַשׁ在征服土地的语境中可指取得并占有；“得了那地”自然地表达这一含义，也由“那地”指向上下文中的特定疆土。
- source_word: בְחַרְבָּם
  choice: 靠自己的刀剑
  rationale: 介词ב在此表达凭借的手段；“刀剑”保留具体的军事意象，“自己的”明确其与后文上帝作为的对比。
- source_word: זְרוֹעָם / זְרוֹעֲךָ
  choice: 他们的膀臂 / 你的膀臂
  rationale: 两处均保留“膀臂”这一身体隐喻，不将其化约为“力量”，从而维持诗句中人力与神力的平行对照。
- source_word: הוֹשִׁיעָה לָּמוֹ
  choice: 没有救他们
  rationale: ישׁע的使役式在此指拯救或解救；直译为“救他们”既符合军事处境，也保留该词常见的救援含义。
- source_word: יְמִינְךָ
  choice: 你的右手
  rationale: 保留希伯来语中象征有力行动的传统意象，并与“你的膀臂”构成诗意并列。
- source_word: אוֹר פָּנֶיךָ
  choice: 你脸上的光
  rationale: 按原文保留“脸”与“光”的复合意象，不直接解释成“同在”或“恩宠”；其象征含义在脚注中说明。
- source_word: רְצִיתָם
  choice: 你喜爱他们
  rationale: רצה在此表达悦纳、喜悦和施恩的态度；“喜爱他们”自然、贴近原文，也不过度扩展其神学机制。
- source_word: כִּי ... כִּי
  choice: 因为……因为
  rationale: 首个כִּי承接上文并作解释，末个כִּי说明上帝如此行动的原因；中文重复“因为”仍清楚自然，并保留原诗的逻辑结构。
theological_decisions:
- issue: 上帝的作为与人的军事力量
  choice: 明确否定以色列人靠自己的刀剑和膀臂得地、获救，并将成就归于上帝的右手、膀臂和脸上的光。
  alternative: 概括译成一般性的“他们不是靠自己的力量，而是靠上帝”。
  rationale: 原文以“他们的刀剑／膀臂”与“你的右手／膀臂／脸上的光”形成具体对照；保留这些意象可忠实呈现神圣作为与人力之间的张力，而不扩写成普遍教义。
- issue: אוֹר פָּנֶיךָ所表达的恩宠与临在
  choice: 正文保留“你脸上的光”的字面意象。
  alternative: 译为“你同在的光”或直接译为“你的恩宠”。
  rationale: 该短语确实传达上帝的恩宠和有利临在，但原文借脸上发光来表达，具有丰富而未被完全限定的诗意；正文不宜把这一意象化约为单一解释。
- issue: 正面分句中省略谓语
  choice: 用“成就这一切的，是……”补足中文句法。
  alternative: 分别补成“使他们得地、救了他们的是……”。
  rationale: 希伯来文在“你的右手……”前省略了动词，回指前述得地与蒙救两件事；“成就这一切”既使中文完整，又避免只把并列主语错误地限定于其中一个动作。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“膀臂”比日常口语“胳膊”更适合诗篇语体，同时仍为普通读者所理解；分号和“成就这一切的，是……”清楚呈现原文的强烈转折与省略结构。
