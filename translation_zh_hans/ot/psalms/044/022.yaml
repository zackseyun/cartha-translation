  text: כִּֽי עָ֭לֶי/ךָ הֹרַ֣גְנוּ כָל הַ/יּ֑וֹם נֶ֝חְשַׁ֗בְנוּ כְּ/צֹ֣אן טִבְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/022.yaml
  text: For your sake we are killed all day long[b][a]; we are regarded as sheep for slaughter.
translation:
  language: zh_hans
  text: '为你的缘故，我们终日被杀[a]；

    我们被看作待宰的羊[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你的缘故”也可译作“因你”或“因着你”。希伯来语可表示他们所受的苦难是为神的缘故，或与神有关。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我们被算作待宰的羊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前文申诉的理由或根据；“因为”自然承接上下文，同时不过度加强语气。
- source_word: עָלֶיךָ
  choice: 为了你的缘故
  rationale: עַל加第二人称后缀在这里表示受苦与神有关或因神而受；这一译法保留忠于神而受苦的含义，又不明确断言神是杀害的直接施事者。正文依汉语习惯表达为“因为你的缘故”。
- source_word: הֹרַגְנוּ
  choice: 我们被杀
  rationale: 该词虽为完成式，但诗歌哀诉结合“终日”表达持续或反复发生的处境；现代汉语用“被杀”可自然保留这种时态开放性。
- source_word: כָל הַיּוֹם
  choice: 终日
  rationale: 简洁、庄重地表达整日不断或持续发生。
- source_word: נֶחְשַׁבְנוּ
  choice: 我们被看作
  rationale: 准确表达חָשַׁב被动式中“被视为、被认为”的评价意义；“被算作”亦可能，列入脚注。
- source_word: כְּצֹאן
  choice: 羊
  rationale: 比较前缀כְּ与后面的用途短语合成“看作待宰的羊”，在汉语中已自然表达“如同羊”的比拟。
- source_word: טִבְחָה
  choice: 待宰的
  rationale: 该名词表示宰杀；“待宰的羊”自然、凝练而庄重地表达“供宰杀的羊”。
theological_decisions:
- issue: 本节是否表示苦难由神造成，还是因忠于神而承受
  choice: 正文译为“因为你的缘故”，表示这苦难因人与神的关系而临到，但不把神明确说成杀害者。
  alternative: 可译“因你”或“因着你”。
  rationale: 希伯来语介词可涵盖原因、关联或所为对象。正文保留诗篇中的神学张力，不把因果关系或责任归属解释得超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“终日”保持简洁的平行节奏；分为两行以呈现希伯来诗句的对应关系。
