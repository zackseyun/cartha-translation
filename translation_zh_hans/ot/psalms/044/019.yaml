  yaml_path: translation/ot/psalms/044/019.yaml
  text: For you crushed us in a place of jackals and covered us with deep darkness[a][b].
translation:
  language: zh_hans
  text: 因为你在豺狼出没之地[b]压碎了我们，又用浓重的黑暗[a]遮盖我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又用死荫遮盖我们。”
    reason: lexical_alternative
  - marker: b
    text: “豺狼”是此处荒凉景象中较可能的意思；较早的译本常译作“龙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接上文，说明诗人所述处境的缘由；“因为”自然体现解释性的篇章关系。
- source_word: דִכִּיתָנוּ
  choice: 你压碎了我们
  rationale: דכה含压碎、打垮或使受辱之意；“压碎”保留原文强烈而具体的受创意象。
- source_word: בִּמְקוֹם תַּנִּים
  choice: 在豺狼出没之地
  rationale: תַּנִּים在荒凉陆地的诗歌图景中最可能指豺狼；“出没之地”比机械的“豺狼之地”更符合现代汉语，同时保留荒废场景。
- source_word: וַתְּכַס עָלֵינוּ
  choice: 又用……遮盖我们
  rationale: 保留动词“遮盖”的具体隐喻，并用“又”延续对上帝的直接陈述。
- source_word: בְצַלְמָוֶת
  choice: 用幽暗
  rationale: צַלְמָוֶת可指浓重幽暗，也传统上可理解为“死荫”；正文采用自然而不限定为死亡的“幽暗”，另以脚注保留传统译法。
theological_decisions:
- issue: בְצַלְמָוֶת的理解
  choice: 幽暗
  alternative: 死荫
  rationale: 该词可作为表示浓重黑暗的词，也可能唤起死亡阴影的意象。正文不将其限定为直接指死亡，脚注保留“死荫”，以保存原文的语义和神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的诗体汉语。“压碎”保留原文力度；“豺狼出没之地”传达荒凉环境；两个脚注标记均置于正文相关句末。
