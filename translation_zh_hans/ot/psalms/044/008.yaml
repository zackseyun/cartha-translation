base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/008.yaml
  text: In God we boast all day long[a], and we will give thanks to your name forever[b]. Selah
translation:
  language: zh_hans
  text: 我们终日以神夸耀[a]；我们要永远称谢你的名[b]。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们终日因神而自豪”，也可理解为“我们终日以神为荣耀”或“我们终日在神里面赞美”。希伯来语动词在这里既可表示赞美，也可表示欢然夸耀。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“称谢你的名”。“名”在圣经中常指神所显明的品格和声誉。
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: 以神为
  rationale: 介词 בְּ 在这里最自然地表示夸耀所依据和指向的对象；“以神为”既保留这一关系，也符合现代汉语表达。
- source_word: הִלַּלְנוּ
  choice: 夸耀
  rationale: הלל 的 Piel 形式可表示“赞美”，但与 בֵּאלֹהִים 连用时有“以……夸耀、因……自豪”的含义。“夸耀”保留了原文既可指赞美又可指欢然自豪的语义张力。
- source_word: כָל הַיּוֹם
  choice: 终日
  rationale: 原短语表示贯穿整日的持续状态；“终日”简洁、自然，并保留具体的时间意象。
- source_word: וְשִׁמְךָ
  choice: 你的名
  rationale: 原文以“你的名”为称谢的对象；直译保留诗篇中“名”所承载的启示、品格和声誉含义。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 此处表示持续无尽的时间，“永远”是现代汉语中清楚自然的对应表达。
- source_word: נוֹדֶה
  choice: 我们要……称谢
  rationale: ידה 的 Hiphil 形式常指感恩地承认、称谢或赞美；“称谢”与前句的“夸耀”保持词义区别。未完成式在这里表达持续或宣告性的意向，以“要”呈现，但不将其缩减为单纯时间上的未来。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该礼仪或乐谱术语的确切含义不明，因此采用传统音译，不作推测性解释。
theological_decisions:
- issue: “以神夸耀”是否改写为单纯“赞美神”
  choice: 保留“以神为夸耀”
  alternative: 终日赞美神
  rationale: 原文结构不仅可表达赞美，也可表达以神为荣耀和自豪的根据；保留这一措辞可避免消解其神学与修辞张力。
- issue: “你的名”的指涉
  choice: 正文直译为“你的名”，以脚注说明
  alternative: 你所显明的品格和声誉
  rationale: “名”是原文的重要圣经意象，不宜在正文中解释性替换；脚注可帮助现代读者理解而不限定其丰富含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“夸耀”保留希伯来语的双重语感，以“称谢”体现感恩式赞美，并用分号呈现两行诗句的平行关系。“细拉”沿用通行音译。
