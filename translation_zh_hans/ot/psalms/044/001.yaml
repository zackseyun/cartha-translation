source:
  edition: WLC
  text: אֱלֹהִ֤ים בְּ/אָזְנֵ֬י/נוּ שָׁמַ֗עְנוּ אֲבוֹתֵ֥י/נוּ סִפְּרוּ לָ֑/נוּ פֹּ֥עַל פָּעַ֥לְתָּ בִֽ֝/ימֵי/הֶ֗ם בִּ֣/ימֵי קֶֽדֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/001.yaml
  text: God[a], we have heard with our ears; our fathers have told us the deed you did in their days[c][b], in days of old.
translation:
  language: zh_hans
  text: 神啊，我们亲耳听见了；我们的先祖向我们述说：在他们的年代，在古时，你所成就的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你所成就的事”也可译作“你所行的作为”。
    reason: 原文פֹּעַל פָּעַלְתָּ使用同根名词和动词，强调神所施行的行动；汉语有不止一种自然表达。
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 这是句首的直接称呼；现代汉语通常用“啊”自然标明呼格，并不增添原文所无的神学含义。
- source_word: בְּאָזְנֵינוּ שָׁמַעְנוּ
  choice: 我们亲耳听见了
  rationale: “亲耳”保留希伯来语“用我们的耳朵”的具身强调，同时比逐字译作“用我们的耳朵听见”更符合现代汉语。
- source_word: אֲבוֹתֵינוּ
  choice: 我们的先祖
  rationale: 此处指把上古事迹传给当代人的前辈世代；“先祖”自然表达宗族和历史传承，也避免现代汉语“父亲们”可能造成的狭窄理解。
- source_word: סִפְּרוּ לָנוּ
  choice: 向我们述说
  rationale: סִפֵּר表示讲述、 recount；“述说”保留郑重的诗歌语体及代际传承意味。
- source_word: פֹּעַל פָּעַלְתָּ
  choice: 你所成就的事
  rationale: 原文以同根名词和动词表达“你施行的作为”；汉语用“所成就的事”自然传达神已施行的行动，虽不能机械复制同根修辞。
- source_word: בִּימֵיהֶם
  choice: 在他们的年代
  rationale: 直接保留时间定位，所指为先祖生活的时期。
- source_word: בִּימֵי קֶדֶם
  choice: 在古时
  rationale: 简洁表达遥远的往昔，保持诗意而不显古奥。
theological_decisions:
- issue: “他们的年代”与“古时”的关系
  choice: 并列保留两个时间短语：“在他们的年代，在古时”
  alternative: 把二者合并为“在他们古时的年代”
  rationale: 原文连续使用两个时间短语，第二个可能同位说明、也可能加强久远之意；并列翻译保留这种修辞层次和一定的解释开放性。
- issue: “先祖”是否应直译为“父辈”
  choice: 先祖
  alternative: 父辈
  rationale: אֲבוֹתֵינוּ字面为“我们的父亲/列祖”，在此历史传统语境中涵盖历代祖先；“先祖”不将所指限定为紧邻的一代，也不引入特定宗派解释。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“亲耳听见”保留原文强调；分号和冒号显明听见、先祖述说以及述说内容之间的关系。脚注标记置于整节末尾，对应正文中的相关措辞。
