  text: לֹא נָס֣וֹג אָח֣וֹר לִבֵּ֑/נוּ וַ/תֵּ֥ט אֲשֻׁרֵ֗י/נוּ מִנִּ֥י אָרְחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/018.yaml
  text: Our heart has not turned back[a], nor have our steps turned aside from your path.
translation:
  language: zh_hans
  text: 我们的心没有退后，我们的脚步也没有偏离你的道路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们的心没有转回，我们的步履也没有偏离你的路径。”
    reason: 词义与诗体表达的可选译法；נָסוֹג可译“退后”或“转回”，אֲשֻׁרֵינוּ与אָרְחֶךָ也可分别译作“步履”和“路径”。
lexical_decisions:
- source_word: נָסוֹג אָחוֹר
  choice: 退后
  rationale: נָסוֹג与אָחוֹר连用，表示向后退、转回或撤退。“退后”在现代汉语中自然简洁，也保留了忠诚动摇或背离的隐喻空间。
- source_word: לִבֵּנוּ
  choice: 我们的心
  rationale: “心”在希伯来语中指人的内在，包括意志、思想和忠诚；保留这一意象，避免窄化为“思想”或“忠心”。
- source_word: וַתֵּט
  choice: 偏离
  rationale: נטה可指倾斜、转向或偏离；在道路意象中，“偏离”准确表达离开既定路线的含义。
- source_word: אֲשֻׁרֵינוּ
  choice: 我们的脚步
  rationale: 该词指步履、步伐或行踪。“脚步”既自然，又保留诗句的行路意象。
- source_word: מִנִּי אָרְחֶךָ
  choice: 你的道路
  rationale: מִנִּי表示从某处离开；אֹרַח指道路或路径，也可隐喻生活准则。“偏离你的道路”符合现代汉语搭配，并保留具体与伦理双重意象。
theological_decisions:
- issue: “心”的人论隐喻
  choice: 直译为“我们的心”
  alternative: 我们的忠心／我们的思想
  rationale: 原文的“心”涵盖意志、思想与忠诚，不宜只解释为其中一个层面。
- issue: 道路意象的指向
  choice: 保留“你的道路”
  alternative: 你的旨意／你所规定的生活方式
  rationale: 原文以道路隐喻上帝所指示的生活方向；保留意象可避免加入超过经文所明说的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“退后—偏离—道路”保留希伯来诗歌中的行动与路径意象；集体单数“心”照原文保留。脚注标记置于正文句末，涵盖整句的词汇替代译法。
