base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/016.yaml
  text: because of the voice of one who reproaches and blasphemes[b][a], because of the enemy and the avenger.
translation:
  language: zh_hans
  text: 因那辱骂、亵渎[a]之人的声音，因仇敌和报仇者的缘故[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亵渎”也可译作“谩骂”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“从仇敌和报仇者面前”；这是表示原因的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: 因……的声音
  rationale: 介词 מִן 在此表示原因或缘由；保留“声音”这一具体意象，同时用“因”清楚表达因果关系。
- source_word: מְחָרֵף
  choice: 辱骂
  rationale: 该分词指以轻蔑、羞辱的话攻击他人；“辱骂”是现代汉语中自然且准确的表达。
- source_word: וּמְגַדֵּף
  choice: 并亵渎
  rationale: גדף 可泛指恶言谩骂，也常带有冒犯、亵渎神圣者的意味；“亵渎”保留了这里可能具有的宗教分量，而脚注注明较宽泛的译法。
- source_word: מִפְּנֵי
  choice: 因……的缘故
  rationale: 该短语字面与“面前”有关，但此处是表示原因的习语；按上下文译为“因……的缘故”。
- source_word: אֹיֵב
  choice: 仇敌
  rationale: 保留希伯来文单数的代表性称谓，符合诗歌语体。
- source_word: וּמִתְנַקֵּם
  choice: 报仇之人
  rationale: 该 Hitpael 分词表示采取报复或施行报仇的人；用“报仇之人”保留其动作性，且不预先判断其报仇是否正当。
theological_decisions:
- issue: 敌对言语是否带有亵渎神圣者的含义
  choice: 亵渎
  alternative: 谩骂
  rationale: גדף 的语义既可指一般辱骂，也可能指带有不敬神意味的亵渎。正文采用较强且符合诗篇语境的“亵渎”，同时以脚注保留较宽泛的理解，避免抹去原文的语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那辱骂并亵渎之人”表明两个分词描述同一个人；全句保留两次“因”的平行结构，并保留“声音”这一希伯来诗歌意象。
