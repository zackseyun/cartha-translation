  text: כִּ֣י ה֭וֹשַׁעְתָּ/נוּ מִ/צָּרֵ֑י/נוּ וּ/מְשַׂנְאֵ֥י/נוּ הֱבִישֽׁוֹתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/007.yaml
  text: For you have saved us from our adversaries[a], and you have put those who hate us to shame.
translation:
  language: zh_hans
  text: 因为你救我们脱离了敌手，又使恨我们的人蒙羞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本节承接上文，说明以神为夸耀并称谢他的缘由；“因为”自然保留了因果说明的作用。
- source_word: הוֹשַׁעְתָּנוּ
  choice: 你救我们
  rationale: 使役词干在此表示拯救、搭救；直译为“救我们”既保留神直接施行拯救的意思，也不把含义缩窄为军事上的得胜。
- source_word: מִצָּרֵינוּ
  choice: 脱离了敌手
  rationale: צַר 指与人敌对、使人困苦者。“敌手”符合诗歌语体，也保留敌对者的含义；介词 מִן 表明从其威胁或权势下获救。
- source_word: וּמְשַׂנְאֵינוּ
  choice: 又……恨我们的人
  rationale: 原文是表示持续或特征性行为的分词，直指“那些恨我们的人”；此译比“仇敌”更明确地保留“恨”的词义。
- source_word: הֱבִישׁוֹתָ
  choice: 使……蒙羞
  rationale: 使役词干表示使对方陷入羞耻。“使……蒙羞”自然、庄重，并保留原文的使役意义。
theological_decisions: []
