  text: כִּ֤י לֹ֣א בְ/קַשְׁתִּ֣/י אֶבְטָ֑ח וְ֝/חַרְבִּ֗/י לֹ֣א תוֹשִׁיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/006.yaml
  text: For I do not trust in my bow[b][a], and my sword does not save me.
translation:
  language: zh_hans
  text: 因为我不倚靠我的弓[a]，我的剑也不能救我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我不会倚靠我的弓，我的剑也不会救我。”希伯来语的未完成式也可带将来意味。
    reason: lexical_alternative
  - marker: b
    text: “救我”在这里也可译为“使我得胜”或“解救我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出本节作为上下文陈述的理由或根据；“因为”在现代汉语中自然地保留了解释关系。
- source_word: בְקַשְׁתִּי
  choice: 我的弓
  rationale: קֶשֶׁת 指作战用的“弓”；介词 בְּ 受 בּטח 支配，整体表达“倚靠我的弓”。
- source_word: אֶבְטָח
  choice: 我不倚靠
  rationale: בטח 在 Qal 中意为“信靠、倚靠”。未完成式在这里可表达一般或持续状态，也可带将来意味；正文采用自然的现在时表达。
- source_word: וְחַרְבִּי
  choice: 我的刀也
  rationale: חֶרֶב 指刀剑类兵器；“也”自然呈现弓与刀之间的诗体平行关系。
- source_word: תוֹשִׁיעֵנִי
  choice: 不能救我
  rationale: ישׁע 的 Hiphil 可指拯救、解救或使人得胜。“救我”保留较宽的语义范围；“不能”在汉语中自然表达兵器并非施救者或可靠的救助来源。
theological_decisions:
- issue: 军事语境中 ישׁע 的拯救含义
  choice: 救我
  alternative: 使我得胜；解救我
  rationale: 上下文涉及战争，“使我得胜”合乎语境，但会缩窄词义。“救我”既可涵盖战场上的解救，也保留该词更广的神学张力，不把诗句仅限于军事胜利。
- issue: 希伯来语未完成式的时态或体貌
  choice: 正文采用一般现在意义：“不倚靠……不能救我”
  alternative: 将来意义：“不会倚靠……不能救我”或“不会救我”
  rationale: 两个未完成式可表达惯常、持续的立场，也可能带将来意味。正文按诗句中的一般性宣告处理，同时以脚注保留将来式理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“倚靠”比单纯“相信”更适合人对武器的依赖；“刀”是现代读者易懂的兵器称呼。正文保留两行平行结构，并用脚注呈现未完成式和军事救援用语的真实歧义。
