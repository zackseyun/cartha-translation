  text: בְּ֭/ךָ צָרֵ֣י/נוּ נְנַגֵּ֑חַ בְּ֝/שִׁמְ/ךָ֗ נָב֥וּס קָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/005.yaml
  text: Through you we push back our foes[b][a]; through your name we trample those who rise against us.
translation:
  language: zh_hans
  text: 靠着你[a]，我们击退仇敌[b]；靠着你的名，我们把起来反对我们的人踏在脚下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠着你”也可译作“借着你”或“凭着你”；原文的介词表达凭借或依靠。
    reason: lexical_alternative
  - marker: b
    text: “击退”原文所用的动词本指动物用角抵撞，这里比喻猛烈地冲击并驱退仇敌。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: 靠着你
  rationale: 介词 בְּ 在此表达凭借或施力的媒介；“靠着你”在现代汉语中自然地表明胜利依赖上帝，同时不把人的争战行动抹去。
- source_word: צָרֵינוּ
  choice: 我们的仇敌
  rationale: צָר 指敌对、压迫人的对手；“仇敌”简洁庄重，适合诗篇的争战语境。
- source_word: נְנַגֵּחַ
  choice: 我们击退
  rationale: 该动词本指动物用角抵撞，此处比喻猛烈地冲击敌人。“击退”保留强力驱退的含义，又避免在正文中造成不必要的动物形象误解。
- source_word: בְּשִׁמְךָ
  choice: 靠着你的名
  rationale: 与首句“靠着你”形成平行，表明上帝的名所代表的身份、权柄和能力是得胜的凭借；不将其窄化为口头公式。
- source_word: נָבוּס
  choice: 我们把……踏在脚下
  rationale: בוס 意为践踏、踩在脚下；这一表达自然、鲜明，并保留争战得胜的强烈意象。
- source_word: קָמֵינוּ
  choice: 起来攻击我们的人
  rationale: 分词源自 קום，字面为“起来反对我们的人”；结合军事语境译为“起来攻击我们的人”，既保留动态意味，也清楚表达敌对行动。
theological_decisions:
- issue: 争战得胜中上帝与人的作用
  choice: 以两次“靠着”凸显上帝是得胜的决定性凭借，同时保留“我们击退”“我们……踏在脚下”所表达的人的实际行动。
  alternative: 只突出人的军事行动，或把“你的名”理解为具有自动效力的口头咒式。
  rationale: 希伯来文的两个介词短语与两个第一人称复数动词并列，同时呈现神的施力与群体的参与；译文不消解这一张力。
- issue: “你的名”的含义
  choice: 保留“你的名”这一圣经意象，不在正文中解释性改写。
  alternative: 直接译为“你的权能”或“你的权柄”。
  rationale: “名”可涵盖上帝所启示的身份、权柄与能力，直接替换为其中单一概念会缩窄原文丰富性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两分句结构平行；“击退”与“踏在脚下”保留原文逐步增强的争战意象。“靠着你的名”有意保留希伯来语的神学意象及其含义张力。
