  yaml_path: translation/ot/psalms/044/015.yaml
  text: All day long my disgrace is before me[a], and the shame of my face has covered me.
translation:
  language: zh_hans
  text: 我的耻辱终日在我面前；我脸上的羞愧[a]遮盖了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我脸的羞愧遮盖了我。”希伯来语直译为“我脸的羞愧遮盖了我”。
    reason: 说明“我脸上的羞愧”所对应的希伯来语属格结构，并保留较形式对应的译法。
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 自然简洁地表达“整天、从早到晚”的持续意义，并保持诗歌语体。
- source_word: כְּלִמָּתִי
  choice: 我的耻辱
  rationale: 该词侧重公开受辱、蒙羞的社会性含义；译作“耻辱”也可与下句的“羞愧”有所区分。
- source_word: נֶגְדִּי
  choice: 在我面前
  rationale: 保留原文“在我对面、眼前”的空间意象，表达耻辱始终摆在诗人眼前。
- source_word: וּבֹשֶׁת
  choice: 羞愧
  rationale: 直接呈现内在羞耻感，并与“耻辱”形成近义平行而不完全重复。
- source_word: פָּנַי
  choice: 我脸上的
  rationale: 希伯来语字面为“我脸的羞愧”；中文用“我脸上的羞愧”较自然，同时保留脸面的意象。
- source_word: כִּסָּתְנִי
  choice: 笼罩着我
  rationale: 动词本义为“遮盖”；“笼罩着我”既保留覆盖的比喻，又自然表达羞愧持续包围诗人的状态。
