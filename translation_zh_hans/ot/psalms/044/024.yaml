base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/024.yaml
  text: Why do you hide your face and forget our affliction and our oppression?[a]
translation:
  language: zh_hans
  text: 你为什么隐藏你的面，忘记我们的苦难和所受的压迫？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的临在”。原文直译为“你的面”；这在希伯来语中是指有利的关注、眷顾或临近的常用表达。
    reason: 说明“面”的词义替代及其惯用含义，同时保留正文的字面意象。
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 这是询问原因的常用词；“为什么”自然直接，保留了哀歌向上帝发问的语气。
- source_word: פָנֶיךָ
  choice: 面
  rationale: 原文直译为“你的面”，在希伯来语中常表示上帝有利的关注或临近。译作“掩面不顾”既保留身体性意象，也符合现代汉语表达。
- source_word: תַסְתִּיר
  choice: 掩
  rationale: 该使役词形在这里意为“使之隐藏、隐藏”；与“面”组合为“掩面”，简洁且保留诗歌意象。
- source_word: תִּשְׁכַּח
  choice: 忘记
  rationale: 原词本义是“忘记”；上下文虽含不理会、忽略之意，仍保留“忘记”以呈现哀歌大胆质问上帝的张力。
- source_word: עָנְיֵנוּ
  choice: 我们的苦难
  rationale: 该词可指困苦、苦难或受苦；“苦难”是现代汉语中自然而庄重的概括，不限定痛苦的具体形式。
- source_word: וְלַחֲצֵנוּ
  choice: 我们所受的压迫
  rationale: לַחַץ 可表示压迫、逼迫或重压；本诗共同体受敌人侵害的语境突出外来的敌对压力，因此译作“所受的压迫”。
theological_decisions:
- issue: “你的面”所含的上帝拟人化语言
  choice: 在正文中译作“掩面不顾”，保留“面”的意象。
  alternative: 隐藏你的临在；不再眷顾我们
  rationale: 原文以身体性的关系语言表达上帝的眷顾、关注和临近。保留“面”的意象，而以“不顾”提示其惯用含义，可维持诗歌力度及神学张力，不把隐喻完全抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“掩面不顾”保留希伯来语的“面”之意象，同时避免“你为什么隐藏你的面”在现代汉语中的生硬感；“忘记”保留原文直接质问的力度。
