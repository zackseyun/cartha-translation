  text: כָּל זֹ֣את בָּ֭אַתְ/נוּ וְ/לֹ֣א שְׁכַחֲנ֑וּ/ךָ וְ/לֹֽא שִׁ֝קַּ֗רְנוּ בִּ/בְרִיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/017.yaml
  text: All this has come upon us[a], yet we have not forgotten you, and we have not been false to your covenant.
translation:
  language: zh_hans
  text: 这一切虽临到我们，我们却没有忘记你，也没有对你的约不忠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל זֹאת
  choice: 这一切
  rationale: 作为概括性短语，回指上文所述的种种苦难；“这一切”自然保留了 כָּל 的全面性和 זֹאת 的集合性指代。
- source_word: בָּאַתְנוּ
  choice: 临到我们
  rationale: בוא 的基本意象是“来到”；在灾祸语境中，“临到我们”既保留原文意象，也符合现代汉语的庄重表达。
- source_word: וְלֹא
  choice: 虽……却没有
  rationale: 原文以连接词加否定形成语境中的转折：尽管遭逢这一切，群体仍否认自己忘记神或对约不忠。“虽……却……”清楚呈现这一关系。
- source_word: שְׁכַחֲנוּךָ
  choice: 没有忘记你
  rationale: 直接保留动词“忘记”及第二人称单数宾语，维持对神直接陈诉的关系性语气。
- source_word: שִׁקַּרְנוּ
  choice: 没有背弃
  rationale: שקר 在此搭配“约”，所指不只是口头说谎，而是以虚假、不忠的方式对待约；“背弃”以自然简洁的汉语表达违约不忠。
- source_word: בִּבְרִיתֶךָ
  choice: 你的约
  rationale: 保留第二人称单数所属关系；介词 ב 与 שקר 连用，表示虚假行为所涉及的对象或领域，汉语以“背弃你的约”自然表达。
theological_decisions:
- issue: 受苦中的群体如何申明无辜
  choice: 译为对两项具体 covenantal fidelity 的申明：没有忘记神，也没有背弃他的约。
  alternative: 扩展为在神面前完全无罪的普遍性宣称。
  rationale: 希伯来文只否认忘记神和对他的约行假，并未明说绝对无罪；译文保留诗篇中受苦与忠诚申诉之间的张力，不作超出原文的神学推论。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“临到”保留苦难来袭的原文意象；“虽……却……”明确上下分句的让步转折。“背弃你的约”比直译“向你的约行虚假”更自然，并准确传达 covenantal disloyalty。
