source:
  edition: WLC
  text: כִּ֤י שָׁ֣חָה לֶ/עָפָ֣ר נַפְשֵׁ֑/נוּ דָּבְקָ֖ה לָ/אָ֣רֶץ בִּטְנֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/025.yaml
  text: For our soul has sunk down to the dust[b][a]; our belly clings to the earth.
translation:
  language: zh_hans
  text: 因为我们的性命伏倒在尘土中[a]；我们的肚腹紧贴地面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们的性命”也可译作“我们的灵魂”或“我们自己”；“伏倒”也可译作“沉落”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词在上下文中引出随后求救的缘由；“因为”自然保留其因果作用。
- source_word: שָׁחָה
  choice: 伏倒
  rationale: 该动词可表示俯伏、低伏或沉下；与“尘土”连用时，“伏倒”既保留身体姿态的鲜明意象，也传达受压低落的处境。
- source_word: לֶעָפָר
  choice: 在尘土中
  rationale: עָפָר意为“尘土”；介词可表达朝向或所达到的状态。“在尘土中”符合现代汉语诗性表达，并保留卑微、受辱及死亡的联想。
- source_word: נַפְשֵׁנוּ
  choice: 我们的性命
  rationale: נֶפֶשׁ可指生命、性命、自我，也可传统地译作“灵魂”。此处“我们的性命”自然地指全人的生命，并避免把词义限定为非物质部分。
- source_word: דָּבְקָה
  choice: 紧贴
  rationale: 该词表示黏附、紧靠；在肚腹与地面的身体意象中，“紧贴”比“依附”更具体自然。
- source_word: לָאָרֶץ
  choice: 地面
  rationale: אֶרֶץ可指地、土地或地面；这里与肚腹紧贴的姿势相连，“地面”最符合具体场景，并与上句“尘土”形成自然平行。
- source_word: בִּטְנֵנוּ
  choice: 我们的肚腹
  rationale: בֶּטֶן直指腹部，也可指身体内部；“肚腹”保留原文具体而庄重的身体意象，不将其泛化为“身体”。
theological_decisions:
- issue: נַפְשֵׁנוּ的人论含义
  choice: 我们的性命
  alternative: 我们的灵魂／我们自己
  rationale: 原词涵盖性命、生命、自我等含义。正文采用“性命”，使读者理解为全人的生命处境；脚注保留“灵魂”和“我们自己”的可能性，不把希伯来语人论预先限定为某一种二分框架。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。以“伏倒—紧贴”和“尘土—地面”的平行结构保留原诗的身体性与低伏意象；不用较古雅的“俯伏于”“腹部贴于大地”，也避免把 נֶפֶשׁ 过度抽象化。
