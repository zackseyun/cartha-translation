  text: תִּ֭תְּנֵ/נוּ כְּ/צֹ֣אן מַאֲכָ֑ל וּ֝/בַ/גּוֹיִ֗ם זֵרִיתָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/011.yaml
  text: You give us over like sheep for food[b][a], and among the nations you have scattered us.
translation:
  language: zh_hans
  text: 你把我们交出去，如同供人食用的羊[a]；又把我们分散在列国[b]中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“如同作食物的羊”；这里没有明确使用“宰杀”一词。
    reason: lexical_alternative
  - marker: b
    text: “列国”在这里指以色列以外的各民族或国家，百姓被分散在他们中间。
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְּנֵנוּ
  choice: 你把我们交出去
  rationale: נתן的基本义是“给、交出”；在本哀歌语境中，指把百姓交在敌对势力手中。“交出去”既保留基本词义，也自然表达任人处置的含义。
- source_word: כְּצֹאן
  choice: 如同……的羊
  rationale: 介词כְּ表示比较，צֹאן指羊群或羊；中文用“如同……的羊”自然保留明喻。
- source_word: מַאֲכָל
  choice: 供人食用
  rationale: מַאֲכָל意为“食物、可吃之物”，这里描写羊成为食物；译为“供人食用”符合中文表达，同时不擅自具体化为“宰杀”。
- source_word: וּבַגּוֹיִם
  choice: 又……在列国中
  rationale: גּוֹיִם在此指以色列以外的各民族或国家。“列国”是诗篇语体中自然、庄重且不带新约专门色彩的译法；וּ按上下文译作“又”。
- source_word: זֵרִיתָנוּ
  choice: 把我们分散
  rationale: זרה可指撒散或簸扬；这里描述百姓散居于列国之中，“分散”清楚表达语境含义，同时保留动作的直接性。
theological_decisions:
- issue: 百姓被比作供人食用的羊
  choice: 保留“如同供人食用的羊”这一严厉意象
  alternative: 如同被宰的羊；如同任人吞吃的羊
  rationale: 原文מַאֲכָל强调成为食物，并未明确使用“宰杀”或“吞吃”的动词。译文不淡化哀歌的力度，也不加入原文没有明说的细节。
- issue: 上帝在交出和分散百姓之事中的主动角色
  choice: 两句都直接以“你”为主语，保留上帝主动施行这些行动的表达
  alternative: 我们如羊被交出；我们被分散在列国中
  rationale: 希伯来文两个动词均为第二人称阳性单数，直接指向上帝。改用被动语态会弱化本节哀歌中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“交出去”比单说“给”更准确地传达任人处置之意；分号呈现原文两个平行分句。
