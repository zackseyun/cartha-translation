  text: ע֤וּרָ/ה לָ֖/מָּה תִישַׁ֥ן אֲדֹנָ֑/י הָ֝קִ֗יצָ/ה אַל תִּזְנַ֥ח לָ/נֶֽצַח׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/023.yaml
  text: Awake! Why do you sleep[a], Lord? Rouse yourself; do not reject us forever.
translation:
  language: zh_hans
  text: 醒来吧！主啊，你为什么沉睡？起来吧！不要永远弃绝我们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוּרָה
  choice: 醒来吧
  rationale: 该祈使式直接呼唤上帝醒来；译文保留哀歌大胆、迫切的语气。
- source_word: לָמָּה
  choice: 为什么
  rationale: 这是引出质问的常用疑问副词，现代汉语自然对应“为什么”。
- source_word: תִישַׁן
  choice: 沉睡
  rationale: 保留希伯来文“睡眠”的拟人意象；“沉睡”庄重自然，也能表达诗人所感受到的持续静默。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝的直接称呼；“主啊”准确体现呼格和主权称号。
- source_word: הָקִיצָה
  choice: 起来吧
  rationale: 这是与前句平行的醒来祈使语。译作“起来吧”既避免汉语生硬重复，也保留递进的催促感。
- source_word: אַל תִּזְנַח
  choice: 不要……弃绝我们
  rationale: זנח表示拒绝、丢弃或弃绝；“弃绝”符合庄重诗体，并清楚表达关系性的拒斥。
- source_word: לָנֶצַח
  choice: 永远
  rationale: 自然表达持续到永久之意。
theological_decisions:
- issue: 以沉睡和醒来拟人化地描述上帝
  choice: 在正文中保留“沉睡”“醒来/起来”的直接意象
  alternative: 意译为“你为什么似乎不采取行动”
  rationale: 原文以大胆的哀诉向上帝发问。译文不将这一张力解释掉；这里是诗性申诉，并非断言上帝实际会睡眠。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。“醒来吧”“起来吧”形成平行催促；保留直面上帝的强烈哀诉，不作神学弱化。英文材料所列脚注内容与其标记位置似不相符，且希伯来原文在“沉睡”处无相应词义异文，因此中文稿不沿用该脚注。
