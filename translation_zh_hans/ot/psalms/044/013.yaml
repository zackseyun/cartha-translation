  text: תְּשִׂימֵ֣/נוּ חֶ֭רְפָּה לִ/שְׁכֵנֵ֑י/נוּ לַ֥עַג וָ֝/קֶ֗לֶס לִ/סְבִיבוֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/013.yaml
  text: You have made us a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: zh_hans
  text: 你使我们在邻邦中蒙受羞辱，成为四围之人嘲笑和讥讽的对象。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: 你使我们
  rationale: שׂים意为“放置、使成为”。此处是向上帝陈诉；汉语“你使我们”自然表达动作造成的处境，也无须强加原文未明示的时态。
- source_word: חֶרְפָּה
  choice: 受羞辱
  rationale: חֶרְפָּה可指羞辱、耻辱或受人责骂。“受羞辱”准确传达他们在邻邦眼中蒙受耻辱、被人蔑视的关系性含义。
- source_word: לִשְׁכֵנֵינוּ
  choice: 在邻邦中
  rationale: לִשְׁכֵנֵינוּ直指“我们的邻近者”。诗篇语境所指是周边民族；“邻邦”比现代汉语中容易理解为个人邻居的“邻舍”更准确，而“在……中”自然表达其在这些群体中的处境。
- source_word: לַעַג
  choice: 嘲笑
  rationale: לַעַג表示嘲弄或讥笑。“嘲笑”是自然、清楚的现代汉语，并与下一词形成并列加强。
- source_word: קֶלֶס
  choice: 讥讽
  rationale: קֶלֶס指带有轻蔑意味的讥刺或嘲弄。“讥讽”既保留与לַעַג的近义平行，也避免将二词完全合并。
- source_word: לִסְבִיבוֹתֵינוּ
  choice: 四周人
  rationale: 该词组字面为“在我们四周的（人）”，在语境中泛指周围的民族或人群。“四周人”简洁保留宽泛所指。
theological_decisions:
- issue: 上帝作为使这一羞辱处境发生的主语
  choice: 保留直接陈诉“你使我们”
  alternative: 弱化为“我们在邻邦中受了羞辱”
  rationale: 希伯来文明确以第二人称单数“你”为主语，诗人是在哀歌中直接向上帝陈诉。译文不淡化这一神学张力，也不额外解释上帝使之发生的方式。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“邻邦”点明周边民族语境；后半句用“成为……的对象”使两个并列名词在汉语中自然落地，同时保留公开受辱和反复嘲弄的力度。
