  yaml_path: translation/ot/psalms/044/014.yaml
  text: You make us a proverb among the nations[b][a], a shaking of the head among the peoples.
translation:
  language: zh_hans
  text: 你使我们成了列国中的笑柄[a]，成了万民摇头嘲弄的对象[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一句俗语”或“话柄”。希伯来语מָשָׁל可指箴言、俗语，也可指供人讥讽的话柄。
    reason: lexical_alternative
  - marker: b
    text: “摇头”在这里是表示讥笑或轻蔑的动作。
    reason: cultural_note
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: 你使我们……成了
  rationale: שׂים在此表达使某人成为某种处境或对象；这一译法既保留对上帝的第二人称直接称呼，也符合现代汉语表达。
- source_word: מָשָׁל
  choice: 笑谈
  rationale: מָשָׁל可指箴言、俗语或供人讥讽的话柄；本节与“摇头嘲弄”平行，语境明显带有蔑视意味，因此译作“笑谈”，并以脚注保留“话柄”等可能表达。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם指周围的各国或各民族；“列国”简洁庄重，也避免引入后期技术意义上的“外邦人”。
- source_word: מְנוֹד רֹאשׁ
  choice: 人摇头嘲弄的对象
  rationale: 该短语描写以摇头表示轻蔑、讥笑的动作。直译“摇头”在汉语中未必自动表达嘲弄，补出“嘲弄的对象”可清楚传达其语用意义，同时保留具体意象。
- source_word: בַּל אֻמִּים
  choice: 在万民中
  rationale: 此处与“在列国中”构成诗歌平行；“万民”自然呈现群体性范围，并保持措辞变化。
theological_decisions: []
translation_notes:
