base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/026.yaml
  text: Rise up as our help[c][b][a], and redeem us for the sake of your steadfast love.
translation:
  language: zh_hans
  text: 求你起来帮助我们[a]；为了你坚定的慈爱[b]，救赎我们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“起来，作我们的帮助”。希伯来文近乎直译为“起来，帮助给我们”，使用的是“帮助”这一名词，而不是动词。
    reason: lexical_alternative
  - marker: b
    text: “坚定的慈爱”所译的希伯来词חסד（hesed）兼有慈爱、忠诚和恒久信实的意味，常用于上帝与他子民的关系。
    reason: cultural_note
  - marker: c
    text: 或译“赎回我们”或“搭救我们”；这个希伯来动词既可指付出代价而赎回，也可指以有力的行动施行解救。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: 求你起来
  rationale: 这是קום的阳性单数命令式，表达催促上帝采取行动。汉语补入“求你”符合祈祷语境，也保留恳切而强烈的呼求。
- source_word: עֶזְרָתָה לָנוּ
  choice: 作我们的帮助
  rationale: 原文使用名词“帮助”并接“给我们／为我们”，不是直接使用“帮助”这一动词；此译法尽量保留名词结构及其与“起来”的紧密关系。
- source_word: וּפְדֵנוּ
  choice: 救赎我们
  rationale: פדה可指付代价赎回，也可指施行干预而解救。“救赎”保留该词的赎回与拯救内涵，同时不在正文中限定具体方式。
- source_word: לְמַעַן
  choice: 因
  rationale: 这里引出上帝行动的根据或缘由。简洁的“因”在现代汉语祈祷文中自然，并与后面的“坚定的慈爱”顺畅衔接。
- source_word: חַסְדֶּךָ
  choice: 你坚定的慈爱
  rationale: חסד兼有慈爱、忠诚与持守关系的含义。“坚定的慈爱”既通顺，也呈现这种持续可靠的爱，而不把经文本身未明说的“约”直接加入正文。
theological_decisions:
- issue: פדה是否应译成带有特定神学含义的词
  choice: 救赎我们
  alternative: 搭救我们／赎回我们
  rationale: “救赎”保留诗篇中上帝施行拯救以及赎回的双重色彩，但不把后来发展出的具体救赎机制强加于本节。
- issue: 如何呈现חסד的关系性与忠诚内涵
  choice: 你坚定的慈爱
  alternative: 你忠贞的爱／你的怜悯
  rationale: 此处呼求以上帝的חסד为拯救的根据。“坚定的慈爱”同时传达慈爱和恒久可靠，且避免将“盟约”这一解释性用语直接写入正文。
- issue: עֶזְרָתָה לָנוּ的名词结构是否应改写为动词
  choice: 作我们的帮助
  alternative: 起来帮助我们
  rationale: 选择保留原文较突出的名词“帮助”，让呼求仍带有“起来，成为我们的帮助”这一凝练而略带诗性的张力。
translation_notes:
  register: 采用现代、庄重而可朗读的祈祷语体。“求你”使希伯来语命令式在汉语中成为自然的恳求；“作我们的帮助”刻意保留原文名词结构。脚注标记依正文出现顺序排列。
