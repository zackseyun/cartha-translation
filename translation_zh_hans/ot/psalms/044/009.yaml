  text: אַף זָ֭נַחְתָּ וַ/תַּכְלִימֵ֑/נוּ וְ/לֹא תֵ֝צֵ֗א בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/009.yaml
  text: Yet you have rejected us and put us to shame[a], and you do not go out with our armies.
translation:
  language: zh_hans
  text: 可是，你已经弃绝我们，使我们蒙羞；你不与我们的军队一同出战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你不在我们的军队中出战。”
    reason: 希伯来语介词 ב 可较直译为“在……中”；正文按此处较自然的伴随意义译为“与……一同”。
lexical_decisions:
- source_word: אַף
  choice: 可是
  rationale: 此处引出与上文所述上帝昔日施行拯救的鲜明转折。“可是”自然表达哀歌中的对比与抗辩语气。
- source_word: זָנַחְתָּ
  choice: 你已经弃绝我们
  rationale: זנח 表示拒绝、抛弃。“弃绝”保留关系性的强烈含义；“已经”体现完成式所表达、且影响延续至今的行动。
- source_word: וַתַּכְלִימֵנוּ
  choice: 使我们蒙羞
  rationale: כלם 的使役式表示使人受羞辱。“使我们蒙羞”既保留使役意义，也符合现代汉语哀歌语体。
- source_word: וְלֹא תֵצֵא
  choice: 你不再……出战
  rationale: יצא 的基本义是“出去”；在军事语境中译为“出战”较自然。“不再”传达本节与上文昔日同在之对比，但不额外说明撤回同在的原因。
- source_word: בְּצִבְאוֹתֵינוּ
  choice: 与我们的军队一同
  rationale: צָבָא 在此指军队；介词 ב 按伴随意义译为“与……一同”，形成自然的现代汉语，同时以脚注保留更贴近形式的译法。
theological_decisions:
- issue: 上帝在争战中的撤离
  choice: 译作上帝“不再与我们的军队一同出战”，呈现诗人所控诉的军事与盟约性弃绝。
  alternative: 较贴近希伯来语形式可译为“你不在我们的军队中出战”。
  rationale: 译文保留诗人直面上帝、声称上帝弃绝其民的神学张力，不替诗人解释原因，也不将这句哀诉扩展成超出经文的系统性论断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“弃绝”“蒙羞”保持诗篇哀歌的力度；“与我们的军队一同出战”清楚呈现军事语境。脚注标记置于其所说明的末句之后。
