base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/010.yaml
  text: You make us turn back from the foe[b][a], and those who hate us plunder for themselves.
translation:
  language: zh_hans
  text: 你使我们在敌人面前退却[a]；恨我们的人抢掠战利品归自己所有[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你使我们从敌人那里退回。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“恨我们的人任意抢掠。”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיבֵנוּ אָחוֹר
  choice: 你使我们……败退
  rationale: שׁוב的使役式表达“使转回、使后退”；在战争语境中，“使我们败退”自然传达被迫撤退之意。
- source_word: מִנִּי צָר
  choice: 在敌人面前
  rationale: 此处介词短语可理解为“从敌人那里退回”，也可按战场语境表达为“在敌人面前败退”；正文采用较自然的现代汉语，脚注保留另一种译法。
- source_word: מְשַׂנְאֵינוּ
  choice: 恨我们的人
  rationale: 保留希伯来语分词的主动含义，不将其笼统归并为“敌人”，也维持与前半句צָר用词的区别。
- source_word: שָׁסוּ
  choice: 掠夺
  rationale: 该动词指夺取战利品；“掠夺”简洁、自然，也适合诗歌中的战争场景。
- source_word: לָמוֹ
  choice: 任意
  rationale: לָמוֹ字面可作“为自己”，在此也可传达敌对者随意取掠之意；正文采用流畅的“任意”，脚注保留较贴近形式的译法。
theological_decisions:
- issue: 上帝作为败退的使动者
  choice: 保留“你使我们”
  alternative: 我们败退
  rationale: 希伯来语明确使用第二人称单数使役式，不应弱化诗人将败局归于上帝行动的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“败退”准确体现军事场景；分号呈现两行之间的平行关系。所有歧义均以脚注保留。
