source:
  edition: WLC
  text: אַתָּה ה֣וּא מַלְכִּ֣/י אֱלֹהִ֑ים צַ֝וֵּ֗ה יְשׁוּע֥וֹת יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/004.yaml
  text: You are my King[a], O God; command victories for Jacob.
translation:
  language: zh_hans
  text: 你就是我的王，神啊！求你下令，使雅各得胜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你下令，拯救雅各”，或“求你命定雅各蒙拯救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: 你就是
  rationale: 两个代词连用带有强调意味；“你就是”以自然的现代汉语保留这一强调。
- source_word: מַלְכִּי
  choice: 我的王
  rationale: 名词带第一人称单数后缀，直译为“我的王”；用于对神的直接称呼，庄重而自然。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 此处最自然地理解为呼格；“神啊”明确表现祷告中的直接呼求。
- source_word: צַוֵּה
  choice: 求你下令
  rationale: צוה 的 Piel 祈使式意为“命令、下令”。汉语祷告中在祈使语前加“求你”，既自然又不削弱其命令万事成就的语义。
- source_word: יְשׁוּעוֹת
  choice: 使……得胜
  rationale: 该复数名词可指多次或充分的拯救、解救；本诗的争战语境使“得胜”成为合宜的具体表达，但脚注保留更宽的拯救含义。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 保留原文的诗意称谓“雅各”，不直接改作解释性的“以色列”；这里整体指雅各的子民。
theological_decisions:
- issue: 争战语境中 יְשׁוּעוֹת 的含义
  choice: 正文译作“使雅各得胜”
  alternative: “赐雅各拯救”或“命定雅各蒙拯救”
  rationale: 上下文涉及仇敌与争战，因此“得胜”清楚传达具体的集体性拯救；脚注保留原词较宽的“拯救”语义，避免将含义完全限缩为军事胜利。
- issue: אֱלֹהִים 的句法功能
  choice: 作为呼格译成“神啊”
  alternative: 理解为同位语“我的王——神”或陈述“我的王是神”
  rationale: 本句处于祷告之中，语序最自然地支持直接呼求：“你就是我的王，神啊！”
- issue: צַוֵּה 所表达的神圣权柄
  choice: 译作“求你下令”
  alternative: “求你命定”或“求你颁令”
  rationale: “下令”直接保留祈使动词的基本意义，不额外引入关于预定方式的系统神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的祷告体。“你就是”体现原文强调；“求你下令”符合汉语祈求表达，同时保留神以权柄施行拯救的意象。脚注标记已置于正文对应句末。
