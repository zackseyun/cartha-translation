  text: הֲ/לֹ֣א אֱ֭לֹהִים יַֽחֲקָר זֹ֑את כִּֽי ה֥וּא יֹ֝דֵ֗עַ תַּעֲלֻמ֥וֹת לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/021.yaml
  text: Would not God search this out? For he knows the hidden things of the heart[a].
translation:
  language: zh_hans
  text: 难道上帝不会查究这事吗？因为他知道人心中隐藏的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人心的秘密”。
    reason: 词汇上的另一种可能译法；תַּעֲלֻמוֹת 可指隐藏之事，也可译作“秘密”。
lexical_decisions:
- source_word: הֲלֹא
  choice: 难道……不会……吗
  rationale: 引出预期肯定回答的反问，既保留疑问形式，也符合现代汉语的庄重表达。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处形态虽为复数形式，却用作指以色列之上帝的单数神圣称号；“上帝”是自然、通行的汉语对应词。
- source_word: יַחֲקָר
  choice: 查究
  rationale: 该动词表示深入搜查、审察；“查究”兼具彻查和审断的意味，也比“发现”更贴近原文。
- source_word: זֹאת
  choice: 这事
  rationale: 指向上文所谈之事；汉语补出“事”比单说“这”更自然，同时没有进一步限定所指。
- source_word: כִּי
  choice: 因为
  rationale: 引出支持前面反问的理由，清楚保留原文的因果逻辑。
- source_word: יֹדֵעַ
  choice: 知道
  rationale: 分词表达上帝恒常具有的认识；汉语一般现在意义的“知道”自然准确。
- source_word: תַּעֲלֻמוֹת
  choice: 隐藏的事
  rationale: 该复数名词指被隐藏、隐秘之事；此译保留较宽泛的词义，不把它收窄为刻意保守的秘密。
- source_word: לֵב
  choice: 人心中
  rationale: “心”保留希伯来语关于内在之人的意象，涵盖思想、意愿和情感；加“人”和方位词使现代汉语表达自然。
theological_decisions:
- issue: לֵב 所表达的人观
  choice: 人心中
  alternative: 内心深处；心思中
  rationale: 原词所指不限于情感，也包括思想和意志。“人心”保存圣经的核心意象及其广度，避免将含义缩窄为单纯的理智或情绪。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“难道……不会……吗”保留反问力度；“查究”体现彻底审察的意味。脚注标记[a]已置于正文相应位置。
