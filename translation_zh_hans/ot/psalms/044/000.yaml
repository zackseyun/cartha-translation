  rationale: 该词在诗篇题注中通常指负责音乐或礼仪演出的领班。“圣乐团长”自然简洁，也保留其礼仪音乐职能；介词 לַ 可表示交付或供其使用，因此另列异译。
- source_word: לִבְנֵי קֹרַח
  choice: 可拉子孙的诗
  rationale: 题注中的介词 לִ 可表示归属、用途、关联或作者身份。“……的诗”在中文中简洁自然，但不把具体关系写死；脚注说明“为……所用”及“由……所作”等可能。原文未明说“诗”，此处按汉语题注习惯补出。
- source_word: קֹרַח
  choice: 可拉
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: מַשְׂכִּיל
  choice: 一首“玛斯基勒”
  rationale: 这是若干诗篇题注中的希伯来术语，确切所指不明，可能是体裁、音乐或文学术语。音译可避免武断地解释为“训诲诗”或“默想诗”；量词“一首”使中文题注自然。
