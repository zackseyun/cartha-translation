source:
  edition: WLC
  text: אַתָּ֤ה יָדְ/ךָ֡ גּוֹיִ֣ם ה֭וֹרַשְׁתָּ וַ/תִּטָּעֵ֑/ם תָּרַ֥ע לְ֝אֻמִּ֗ים וַֽ/תְּשַׁלְּחֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/002.yaml
  text: You[a], by your hand, drove out nations and planted them; you afflicted peoples and sent them out.
translation:
  language: zh_hans
  text: 你亲手赶出列国，栽种了我们的先祖；你使万民遭祸，把他们赶了出去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你使万民遭祸，使我们的先祖扩展。”这里末尾的“他们”可理解为以色列的先祖，而不是万民。
    reason: 保留希伯来文末尾代词所指及 שלח 在此处含义的另一种可能解释。
lexical_decisions:
- source_word: יָדְךָ
  choice: 亲手
  rationale: 这里“手”表示上帝亲自施展能力；“亲手”在现代汉语中自然凝练，也保留了具体的身体意象。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 指原先居住在那地的各民族或邦国；“列国”适合诗歌语体，也不带后世“外邦人”的特定宗教对比意味。
- source_word: הוֹרַשְׁתָּ
  choice: 赶出
  rationale: ירשׁ 的使役式在征服语境中表示使人失去产业、被逐离；“赶出”清楚表达驱逐之意。
- source_word: וַתִּטָּעֵם
  choice: 栽种了我们的先祖
  rationale: 保留“栽种”这一建立并安置民族的农业比喻。希伯来文仅用复数代词，但结合上节的“我们的祖先”和本节的对照，正文明确其所指，以免汉语误读为栽种列国。
- source_word: תָּרַע
  choice: 使……遭祸
  rationale: רעע 的使役式可指加害、使遭灾祸；此译表达审判性的伤害，同时不限定具体方式。
- source_word: לְאֻמִּים
  choice: 万民
  rationale: 与前半句“列国”形成诗意同义对应，同时保留原文 גּוֹיִם 与 לְאֻמִּים 的用词变化。
- source_word: וַתְּשַׁלְּחֵם
  choice: 把他们赶了出去
  rationale: שלח 基本义为“送出、放出”；在列国遭祸及失地的语境中，“赶了出去”自然表达被迫离开的含义，又不过度扩展为特定的流散观念。
theological_decisions:
- issue: “栽种他们”和末句“把他们送出”的复数代词分别指谁
  choice: 前者指以色列的先祖，后者指列国或万民
  alternative: 两个代词都可理解为以色列的先祖；末句相应可译为“使他们扩展”
  rationale: 诗句高度压缩，代词所指并未逐一明说。上下文最自然的对照是：上帝赶出列国而栽种以色列的先祖，又使万民遭祸并将他们赶出；但末句也可能延续“先祖”为所指，并把 שלח 理解为使其伸展或扩展，因此以脚注保存这一歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“亲手”“列国”“万民”保持简洁和平行结构；分号呈现原文两组彼此对应的行动。
