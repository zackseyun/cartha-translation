  yaml_path: translation/ot/psalms/044/020.yaml
  text: If we had forgotten the name of our God and spread out our hands to a foreign god—[a]
translation:
  language: zh_hans
  text: 如果我们忘记了我们上帝的名，又向别神摊开双手——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “别神”也可译作“外邦的神”或“陌生的神”。希伯来语形容词指不属于以色列圣约敬拜的神祇。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 引出假设性的申辩；“如果”自然、准确，也与下文条件句相接。
- source_word: שָׁכַחְנוּ
  choice: 我们忘记了
  rationale: Qal完成式第一人称复数在此表示所假设的既成行为；现代汉语用“忘记了”即可自然表达。
- source_word: שֵׁם אֱלֹהֵינוּ
  choice: 我们上帝的名
  rationale: 保留希伯来文“名”的具体表达；这里所指不只是称谓，也涉及上帝被承认和求告的身份。
- source_word: וַנִּפְרֹשׂ כַּפֵּינוּ
  choice: 又……摊开双手
  rationale: פרשׂ与כף构成伸展手掌祷告或呼求的动作；“摊开双手”保留具体姿势，不直接释作“敬拜”。
- source_word: לְאֵל זָר
  choice: 向别神
  rationale: לְ表示动作所朝向的对象；אֵל זָר指不属于以色列圣约敬拜的神祇。“别神”是现代汉语圣经语境中自然明确的说法。
theological_decisions:
- issue: 向异教神祇伸手的动作含义
  choice: 向别神摊开双手
  alternative: 向外邦的神伸开双手
  rationale: 原文很可能描写祷告、求告或敬拜的姿势，但没有直接使用“敬拜”一词，因此保留动作本身，避免把含义解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们上帝的名”保留原文的郑重表达；“摊开双手”呈现祷告姿势而不作过度阐释。句末破折号保留未完条件句与下一节衔接的张力。
