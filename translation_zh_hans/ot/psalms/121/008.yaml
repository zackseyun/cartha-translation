  text: יְֽהוָ֗ה יִשְׁמָר צֵאתְ/ךָ֥ וּ/בוֹאֶ֑/ךָ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/008.yaml
  text: Yahweh will keep your going out and your coming in from now on and forever[a][b].
translation:
  language: zh_hans
  text: 雅威必看顾你的出入，从今直到永远。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你出去和进来”。“出入”是兼举的说法，可泛指人的一切行动或整个生活历程。
    reason: lexical_alternative
  - marker: b
    text: 或译：“从现在直到永远。”
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，避免用称号替代；“雅威”是现代汉语中通行且较贴近 Yahweh 的译法。
- source_word: יִשְׁמָר
  choice: 必看顾
  rationale: שׁמר 可指守护、看守、保全；“看顾”自然表达持续的保护，也能与本诗反复出现的同一动词保持用词联系。
- source_word: צֵאתְךָ וּבוֹאֶךָ
  choice: 你的出入
  rationale: 原文直指“你出去和进来”，二者构成首尾兼举，泛指人的一切行动乃至生活历程；汉语“出入”既保留具体意象，也自然简洁。
- source_word: מֵעַתָּה
  choice: 从今
  rationale: 表示以现在为起点；“从今”凝练而符合诗歌语体。
- source_word: וְעַד עוֹלָם
  choice: 直到永远
  rationale: 原文以“直到”标明持续至无尽的将来；此译准确、自然，并与“从今”形成清楚的时间跨度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，而非普通称号。音译“雅威”保留其专名性质，不以称号代替，也不把后期形成的“耶和华”读音带入正文。
- issue: “出入”的涵盖范围
  choice: 保留具体的“出入”，并以脚注说明其广义用法
  alternative: 意译为“你一生所行的一切”
  rationale: 原文以“出去”和“进来”构成兼举，可能涵盖日常行动和整个人生；正文保留意象，可避免把其范围限定得过窄或解释得过满。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。“必看顾”表达希伯来文未完成式在此语境中的应许意味；“你的出入”保留原文平行意象，“从今直到永远”则自然呈现由现在延续至无尽将来的时间跨度。
