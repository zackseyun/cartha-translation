source:
  edition: WLC
  text: יוֹמָ֗ם הַ/שֶּׁ֥מֶשׁ לֹֽא יַכֶּ֗/כָּה וְ/יָרֵ֥חַ בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/006.yaml
  text: By day the sun will not strike you[b][a], nor the moon by night.
translation:
  language: zh_hans
  text: 白天，太阳必不伤害你；夜间，月亮也必不伤害你。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伤害”原文直译为“击打”。在这里可指造成伤害或有害影响。
    reason: lexical_alternative
  - marker: b
    text: “白天……夜间”可概括一切时候，表达全天候的保护；太阳和月亮既可按字面理解，也可视为诗意表达。
    reason: cultural_note
lexical_decisions:
- source_word: יוֹמָם
  choice: 白天
  rationale: 作时间副词，意为“在白天”；与后半句“夜间”形成简洁自然的平行。
- source_word: הַשֶּׁמֶשׁ
  choice: 太阳
  rationale: 保留原文明确而具体的名词意象。
- source_word: לֹא
  choice: 必不
  rationale: 表达诗歌语境中的否定性应许；“必不”在现代中文中庄重而自然。
- source_word: יַכֶּכָּה
  choice: 伤害你
  rationale: נכה 的使役式可直译为“击打你”，但在太阳和月亮作主语的语境中，所指是其有害影响；“伤害你”自然地传达语境含义，具体的字面义在脚注中保留。
- source_word: וְיָרֵחַ
  choice: 月亮也必不伤害你
  rationale: 连词引出受前句否定支配的平行分句。中文重复谓语比单用“也不”更清楚，并保留诗句的平衡。
- source_word: בַּלָּיְלָה
  choice: 夜间
  rationale: 时间短语，与“白天”相对，保存昼夜平行结构。
theological_decisions:
- issue: 应许之保护的性质
  choice: 正文保留太阳与月亮的具体意象，不限定为字面、比喻或二者兼有。
  alternative: 可理解为免受自然环境伤害，或以昼夜概括时时刻刻的全面保护，也可能涉及古代人对月亮致病的观念。
  rationale: 原诗借太阳、月亮和昼夜构成平行意象；译文不应替原文排除其中任何合理层面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“白天……夜间”保持希伯来诗歌的对称；重复“必不伤害你”使中文句法完整，并避免“月亮也不”可能产生的省略歧义。
