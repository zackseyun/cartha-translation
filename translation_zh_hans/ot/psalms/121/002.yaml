  text: My help comes from Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: zh_hans
  text: '我的帮助来自雅威——

    创造天地的那一位。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文首句没有明说限定动词，较直译可作：“我的帮助从雅威而来，创造天地的那一位。”末句的“创造”在原文中是分词，可作描述，也可带有“创造者”的称谓意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶזְרִי
  choice: 我的帮助
  rationale: עֵזֶר意为“帮助、援助”；“我的帮助”自然、简洁，也保留诗人亲身依靠上帝的表达。
- source_word: מֵעִם
  choice: 来自
  rationale: 该复合介词表示帮助的来源，直译近于“从……那里”；汉语用“来自”能自然补出希伯来语名词句中未明说的动词关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文所用的专名，而不以称号替代。
- source_word: עֹשֵׂה
  choice: 就是创造……的主
  rationale: 分词指称雅威是创造者，带有身份性、称谓性的意味；译作“创造……的主”在现代汉语中庄重自然，并避免把分词仅限于一次过去动作。
- source_word: שָׁמַיִם וָאָרֶץ
  choice: 天地
  rationale: 这是涵盖整个受造界的两极表达；“天地”是现代汉语中准确而凝练的对应。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其专名性质，不把它静默替换成称号。
- issue: עֹשֵׂה的时态与身份含义
  choice: 创造天地的主
  alternative: 造了天地的那一位；创造天地的那一位
  rationale: 希伯来语分词既可指创造行为，也可作为特征性称谓。正文保留其“创造者”身份的持续意味，不将其单纯处理为过去时。
- issue: 首句无显式限定动词
  choice: 我的帮助来自雅威
  alternative: 我的帮助是从雅威而来
  rationale: 原文首句是省略系词的名词性结构；汉语补出“来自”以自然表达来源，但不增加原文没有的因果或方式含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“我的帮助来自雅威”简洁有力；第二行用“就是”清楚表明后半句同位说明雅威的身份。“天地”符合汉语固定表达，也保留原文涵盖整个受造界的范围。
