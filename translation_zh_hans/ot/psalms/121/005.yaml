base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/005.yaml
  text: Yahweh is your keeper[a]; Yahweh is your shade at your right hand.
translation:
  language: zh_hans
  text: 雅威守护你；雅威在你右边作你的荫凉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“阴影”。希伯来文描绘雅威近在身旁，如荫凉一般保护你。
    reason: 说明 צֵל 的词义范围及其保护性意象。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现上帝的专名，不以“主”这一称号代替；本节两次出现均保持一致。
- source_word: שֹׁמְרֶךָ
  choice: 看顾你的
  rationale: שׁמר 的分词表达持续的守护行动。“看顾”自然庄重，也能与本诗反复出现的守护主题保持词义联系。
- source_word: צִלְּךָ
  choice: 你的荫凉
  rationale: צֵל 的本义是“荫凉、影子”。正文保留具体意象，不直接抽象化为“保护”或“庇护”；“荫凉”也契合下文日头不伤人的语境。
- source_word: עַל יַד יְמִינֶךָ
  choice: 在你右边
  rationale: 该短语字面涉及“右手”，在此表示紧靠右侧的位置。现代汉语用“在你右边”自然地表达贴近与随时护卫，同时避免误解为荫凉位于手掌之上。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此正文以“雅威”音译，保留其专名性质，不用称号取代。
- issue: 是否把“荫凉”解释性改译为抽象的保护
  choice: 保留“荫凉”的具体比喻
  alternative: 庇护；保护者
  rationale: 原文以近身遮荫描绘雅威的保护，并由下一节的日头意象延续。保留比喻可避免提前消解诗歌意象及其神学张力。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。两个分句重复“雅威”，保留原文的平行结构和强调；“是看顾你的”略带诗体色彩，以体现希伯来文分词的持续性和名词性。
