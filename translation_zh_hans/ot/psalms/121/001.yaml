id: PSA.121.1
reference: Psalms 121:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁ֗יר לַֽ/מַּ֫עֲל֥וֹת אֶשָּׂ֣א עֵ֭ינַ/י אֶל הֶ/הָרִ֑ים מֵ֝/אַ֗יִן יָבֹ֥א עֶזְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/001.yaml
  text: A Song of Ascents[a]. I lift up my eyes to the mountains— from where will my help come?
translation:
  language: zh_hans
  text: 上行之诗。我举目望向群山[a]——我的帮助从何而来？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“山冈”。
    reason: הָרִים可按地形和语境译为“山”或“山冈”；正文采用“群山”以保留较强的山岳意象。
lexical_decisions:
- source_word: שִׁיר
  choice: 诗
  rationale: 该词意为“歌、诗歌”；在诗篇标题中译作“诗”简洁自然，又不额外限定更具体的体裁。
- source_word: לַמַּעֲלוֹת
  choice: 上行之
  rationale: 保留由עלה所表达的“上行、上升”意义及标题的凝练形式，不武断解释为朝圣旅程、台阶礼仪或比喻性上升。
- source_word: אֶשָּׂא עֵינַי
  choice: 我举目
  rationale: 这是现代汉语中自然而庄重的表达，完整传达“举起我的眼睛”的动作，也保留诗句鲜明的当下感。
- source_word: אֶל הֶהָרִים
  choice: 望向群山
  rationale: אֶל表示朝向，הָרִים可指山或山冈；“群山”既自然又保留其较强的山岳意象，不赋予这些山正面或负面的象征意义。
- source_word: מֵאַיִן
  choice: 从何
  rationale: 准确表达对来源的询问，简洁而符合现代书面汉语。
- source_word: יָבֹא עֶזְרִי
  choice: 我的帮助……而来
  rationale: 将未完成式译为前瞻性的“而来”，并以疑问结构表达帮助将从哪里到来；“帮助”直接对应עֵזֶר。
theological_decisions:
- issue: 后半句应译为陈述还是疑问
  choice: 译作直接疑问：“我的帮助从何而来？”
  alternative: 译作含蓄陈述，如“我的帮助所从来的地方”
  rationale: מֵאַיִן与未完成式יָבֹא最自然地构成直接问句；这样保留第1节提出问题、第2节作出回答的诗意张力。
- issue: “群山”的象征意义
  choice: 保持中性，不说明群山代表什么
  alternative: 明确解释为锡安或圣殿之山，或解释为危险、异教邱坛
  rationale: 本节希伯来文本没有明说这些山的象征意义；中性翻译避免把特定神学解释写入正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“上行之诗”保留传统且凝练的标题形式；破折号呈现由举目望山转入追问帮助来源的诗行推进。脚注标记依其实际词汇对象置于“群山”之后。
