  text: הִנֵּ֣ה לֹֽא יָ֭נוּם וְ/לֹ֣א יִישָׁ֑ן שׁ֝וֹמֵ֗ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/004.yaml
  text: Look[a], the keeper of Israel neither slumbers nor sleeps.
translation:
  language: zh_hans
  text: 看哪[a]，以色列的守护者既不打盹，也不睡觉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，以色列的守护者必不打盹，也不睡觉。”
    reason: 希伯来语未完成体在此可表达恒常事实，也可带有确信性的将来意味；正文采用一般现在时语义，脚注保留另一种可能。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意并加强语气的提示词；“看哪”既保留其指示和强调作用，也符合庄重的诗歌语体。
- source_word: לֹא ... וְלֹא
  choice: 既不……也不……
  rationale: 用现代汉语的关联结构自然对应两个并列否定，同时保留原文的递进式诗意表达。
- source_word: יָנוּם
  choice: 打盹
  rationale: 指困倦、短暂瞌睡；“打盹”与后面的普通睡眠用词形成原文所有的词义区别。
- source_word: יִישָׁן
  choice: 睡觉
  rationale: 这是表示睡眠的普通动词；译为“睡觉”，与“打盹”清楚区分。
- source_word: שֹׁמֵר
  choice: 守护……的
  rationale: 分词在此作名词性用法，意为持续看守、保护的那一位；这一表达也能与本诗反复出现的同一词根保持一致。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用该专名的现代汉语标准译法。
theological_decisions:
- issue: 以拟人化语言描写上帝不间断的警醒
  choice: 保留“既不打盹，也不睡觉”的诗歌形象，表达以色列的守护者从不疏忽。
  alternative: 抽象地解释为“上帝时刻警醒”，或将其处理成关于上帝不能睡眠的哲学命题。
  rationale: 原文用两种睡眠状态构成拟人化诗句；直保留意象，既不削平诗意，也不超出经文作系统性推论。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“守护以色列的”保留名词性分词的表达和身份上的含蓄，不额外明说“上帝”；“打盹／睡觉”保留原文近义并列中的词义层次。
