lexical_decisions:
- source_word: שִׁיר לַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 保留传统且简洁的标题表达；מַעֲלוֹת 可指上行、登阶或朝圣上耶路撒冷，正文不将其具体所指限定死。
- source_word: הֶהָרִים
  choice: 群山
  rationale: 该词为 הַר 的复数，通常指山或山岭；译作“群山”符合这里的复数形式和诗歌语境。
- source_word: מֵאַיִן יָבֹא עֶזְרִי
  choice: 我的帮助从何而来？
  rationale: 按希伯来语疑问结构直译，保留诗人发问的张力，不预先把下一节的回答并入本节。
theological_decisions:
- issue: 举目望山与帮助来源之间的关系
  choice: 保留为一个陈述句和一个疑问句，不说明帮助来自群山或越过群山而来
  alternative: 译成带有解释性的“我向群山举目，帮助是否从那里而来？”或“我越过群山仰望”
  rationale: 原文只说举目向山，并问帮助从何而来；两者关系具有诗意张力，应由下文回答，不宜在翻译中提前解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；标题沿用读者熟悉的“上行之歌”，正文保持希伯来诗歌的简洁和疑问语气。
