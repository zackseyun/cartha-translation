  text: אַל יִתֵּ֣ן לַ/מּ֣וֹט רַגְלֶ֑/ךָ אַל יָ֝נ֗וּם שֹֽׁמְרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/003.yaml
  text: He will not let your foot slip[b][a]; your keeper will not slumber.
translation:
  language: zh_hans
  text: 他必不让你的脚滑跌[a][b]；守护你的那一位必不打盹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他不让你的脚滑跌；愿守护你的那一位不打盹。”希伯来文的形式既可理解为祈愿，也可理解为确信的宣告。
    reason: alternative_reading
  - marker: b
    text: “滑跌”也可译作“动摇”、“踉跄”或“失足”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: 必不
  rationale: אַל与未完成式连用可带祈愿语气，但本诗上下文以确信和应许为主；“必不”自然表达坚定的否定保证，同时在脚注中保留祈愿式理解。
- source_word: יִתֵּן
  choice: 让
  rationale: נתן本义为“给”，但此处与后续成分构成“容许、任凭”的意思；现代汉语用“让”最自然。
- source_word: לַמּוֹט
  choice: 滑跌
  rationale: מוֹט可指摇动、失稳、踉跄或滑倒；与“脚”连用时，“滑跌”既保留具体意象，也表达失去稳固的含义。
- source_word: רַגְלֶךָ
  choice: 你的脚
  rationale: 保留希伯来文第二人称阳性单数及“脚”的单数形式，也符合汉语表达。
- source_word: יָנוּם
  choice: 打盹
  rationale: נוּם指困倦、打瞌睡，并非强调完全熟睡；“打盹”准确而自然，也为下一节更完整的“不打盹，也不睡觉”作铺垫。
- source_word: שֹׁמְרֶךָ
  choice: 守护你的那一位
  rationale: שׁמר有看守、护卫、保守之意；此译法自然地保留分词结构及本诗反复出现的“守护”主题，又不预先在本节加上原文未明说的称谓。
theological_decisions:
- issue: אַל与未完成式动词所表达的语气
  choice: 陈述式确信：“他必不……必不……”
  alternative: 祈愿式：“愿他不让……愿守护你的那一位不打盹。”
  rationale: 这些希伯来文形式既可听作祈愿，也可在诗篇的语境中表达确信。上下文着重宣告耶和华可靠的守护，因此正文采用陈述式保证；脚注保留祈愿式的真实可能性，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“必不”传达诗歌中的坚定确信；“守护你的那一位”兼顾自然表达与关键词שׁמר在全诗中的连贯性。脚注标记均置于正文相关词句之后。
