  text: יְֽהוָ֗ה יִשְׁמָרְ/ךָ֥ מִ/כָּל רָ֑ע יִ֝שְׁמֹ֗ר אֶת נַפְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/007.yaml
  text: Yahweh will keep you from all evil[a]; he will keep your soul.
translation:
  language: zh_hans
  text: 雅威必保护你免受一切祸害；他必保护你的生命[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”所译的希伯来词也可指“自己”“整个人”或“灵魂”。
    reason: 说明 נֶפֶשׁ 的语义范围，避免把它限定为非物质的灵魂或仅指肉体性命。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现上帝的圣名，而不以“主”替代；“雅威”也避免采用源自另一种读音传统的“耶和华”来对应 Yahweh。
- source_word: יִשְׁמָרְךָ / יִשְׁמֹר
  choice: 必保护你 / 必保护
  rationale: שׁמר兼有守护、看守、保全之意。“保护”在现代汉语中自然清楚，并通过重复保留原文的关键词和诗歌呼应。
- source_word: מִכָּל רָע
  choice: 免受一切祸害
  rationale: רָע在这里可涵盖邪恶、患难、灾祸及伤害。“祸害”保留较宽的负面含义，不把经文限定为纯粹道德之恶或某一种灾难。
- source_word: נַפְשֶׁךָ
  choice: 你的生命
  rationale: נֶפֶשׁ可指生命、活着的人、自我，也可传统地译作灵魂；本诗语境中的“生命”自然且不强加狭义的身心二分。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名。音译“雅威”保留其专名性质，不以称号替换，也与将其读作 Yahweh 的取向一致。
- issue: נַפְשֶׁךָ 所指的范围
  choice: 你的生命
  alternative: 你的灵魂；你整个人
  rationale: “生命”能表达上帝对人的存留与保护，同时保留 נֶפֶשׁ 可指生命、本人或灵魂的语义张力；脚注列出其他可能理解。
- issue: רָע 是道德之恶还是临到人的灾害
  choice: 祸害
  alternative: 邪恶；灾祸；患难
  rationale: 上下文强调保护，但该词本身语义宽广；“祸害”既可指有害之事，也不完全排除恶的层面，避免无依据地缩窄含义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“必”表达未完成式在诗歌语境中的确信和应许色彩；分号对应两个平行分句，并保留“保护”的重复。
