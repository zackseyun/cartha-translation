  yaml_path: translation/ot/psalms/099/003.yaml
  text: Let them praise your great and fearsome name[c][b][a]; he is holy.
translation:
  language: zh_hans
  text: 愿他们颂赞你伟大而可畏的名[a][b]；他是圣洁的。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可畏”也可译作“令人敬畏”；希伯来文描述这名使人生出敬畏和惧怕。
    reason: lexical_alternative
  - marker: b
    text: “颂赞”也可译作“称谢”；希伯来文动词可表达称谢或赞美，在这里以神的名为对象，译作“颂赞”更合语境。
    reason: lexical_alternative
  - marker: c
    text: 或按原文次序译作：“你伟大而可畏的名；圣洁的是他。”
    reason: previous_rendering
lexical_decisions:
- source_word: יוֹדוּ
  choice: 愿他们颂赞
  rationale: 该词是ידה的Hiphil未完成式第三人称复数，可表示“称谢、颂赞、承认”。本句以神的“名”为宾语，语境侧重公开颂扬；未完成式在这里宜理解为祈愿或劝勉语气。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 保留希伯来文“名”的表达，既指称呼，也承载名声和所启示之品格的含义。
- source_word: גָּדוֹל
  choice: 伟大
  rationale: 直接表达该形容词“大的、伟大的”之义，也符合现代汉语对神之名的庄重描述。
- source_word: וְנוֹרָא
  choice: 而可畏
  rationale: 该词描述令人敬畏、甚至生出惧怕的对象。“可畏”保留敬 reverence 与畏惧并存的较强语义，不弱化为一般赞叹。
- source_word: קָדוֹשׁ
  choice: 圣洁的
  rationale: “圣洁”保留本诗礼仪性反复句的神学分量，也自然表达分别为圣和纯全的含义。
- source_word: הוּא
  choice: 他
  rationale: 独立代词带有强调作用；按全诗语境，其所指是耶和华。中文用“他”清楚表达这一主要理解，同时在脚注交代希伯来语可能产生的句法关联。
theological_decisions:
- issue: 末句“他”的所指及其与“名”的关系
  choice: 正文将הוּא理解为指向耶和华：“他是圣洁的”
  alternative: 因“名”在希伯来语中为阳性名词，末句也可在句法上与“名”紧密相连，译作“他的名是圣洁的”或理解为礼仪性的欢呼“圣洁的是他”
  rationale: 诗篇99篇反复宣告耶和华圣洁，语境支持代词指神；但原文的简洁结构及“名”的阳性语法形式形成真实的关联空间，因此不在正文中扩写因果词，并以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“愿他们”保留原文第三人称复数及祈愿语气；分号维持两个简短分句之间的张力，不补入原文没有的“因为”。
