  text: בְּ/עַמּ֣וּד עָ֭נָן יְדַבֵּ֣ר אֲלֵי/הֶ֑ם שָׁמְר֥וּ עֵ֝דֹתָ֗י/ו וְ/חֹ֣ק נָֽתַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/007.yaml
  text: In a pillar of cloud he spoke to them[a]; they kept his testimonies and the statute he gave them.
translation:
  language: zh_hans
  text: 他在云柱中向他们说话[a]；他们遵守他的法度和他赐给他们的律例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他借着云柱向他们说话。”希伯来语介词可表示位置，也可表示借助的方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַמּוּד עָנָן
  choice: 在云柱中
  rationale: בְּ 可表示位置“在……中”，也可能表示来源“从……中”；正文采用自然且保留云柱意象的“在云柱中”，另一可能见脚注。
- source_word: יְדַבֵּר
  choice: 说话
  rationale: 未完成式在此历史诗歌语境中可概括耶和华过去向前节所述人物说话的行动；汉语由上下文自然表达过去，不必另加“曾”。
- source_word: אֲלֵיהֶם
  choice: 向他们
  rationale: 直接保留代词，承接上一节提到的摩西、亚伦和撒母耳，不在正文中扩展所指。
- source_word: שָׁמְרוּ
  choice: 遵守
  rationale: שׁמר 在盟约和律法语境中表示谨守、遵行；“遵守”是现代汉语中自然清楚的表达。
- source_word: עֵדֹתָיו
  choice: 他的法度
  rationale: עֵדוֹת 指上帝所设立、具有见证性质的规范；“法度”既保留律法语域，也与下文单数 חֹק 区分。
- source_word: וְחֹק
  choice: 和……律例
  rationale: חֹק 为单数，指规定或定例；“律例”符合庄重的现代圣经语体。名词前不强加量词，以免使希伯来语单数在中文中显得生硬，但其单一所指仍由关系分句体现。
- source_word: נָתַן לָמוֹ
  choice: 他赐给他们的
  rationale: 此分句最自然地修饰 חֹק，即“他赐给他们的律例”；“赐给”适合上帝颁授律例的语境。
theological_decisions:
- issue: “他”和“他们”的所指
  choice: 保留代词；“他”依语境指耶和华，“他们”首先承接上一节的摩西、亚伦和撒母耳。
  alternative: “他们”也可经由这些代表人物泛指以色列民。
  rationale: 紧邻上文明确列出三人，故不在正文中泛化为以色列；同时保留原文代词，使诗歌的概括性和可能的代表性不被排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“云柱”“法度”“律例”保留诗篇的传统律法意象和词汇区分；句式简洁，并保留原文代词及介词的真实歧义。
