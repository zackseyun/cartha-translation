  text: מֹ֘שֶׁ֤ה וְ/אַהֲרֹ֨ן בְּֽ/כֹהֲנָ֗י/ו וּ֭/שְׁמוּאֵל בְּ/קֹרְאֵ֣י שְׁמ֑/וֹ קֹרִ֥אים אֶל יְ֝הוָ֗ה וְ/ה֣וּא יַעֲנֵֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/006.yaml
  text: Moses and Aaron were among his priests[a], and Samuel among those who called on his name; they called to Yahweh, and he answered them.
translation:
  language: zh_hans
  text: 摩西和亚伦列在他的祭司中；撒母耳也列在求告他名的人中[a]。他们呼求雅威，他就应允他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “求告他名”也可译为“呼求他名”。原文直译为“呼求他的名”。
    reason: 说明与英文审校记录相对应的词汇替代，并保留原文“他的名”这一表达，不作超出本节的神学扩展。
lexical_decisions:
- source_word: בְּכֹהֲנָיו
  choice: 在他的祭司中
  rationale: 介词 בְּ 在这里最自然地表达群体中的归属，即摩西和亚伦被列在上帝的祭司中。保留“在……中”，既忠实于原文的部分性表达，也不把摩西与亚伦的具体祭司职分完全等同。
- source_word: בְּקֹרְאֵי שְׁמוֹ
  choice: 在求告他名的人中
  rationale: 该分词短语与“在他的祭司中”平行，表示撒母耳属于以求告上帝之名为特征的一群人。“求告他名”保留了原文有关祷告、敬拜和倚靠上帝的圣经用语。
- source_word: קֹרִאים אֶל
  choice: 他们呼求
  rationale: 此处重新概括前述人物向上帝发出的祷告。“呼求”自然表达 קרא אל 的方向性和祈求含义，又不限定为只在危难中哀求。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝的专名，避免用称号替代原文的四字神名。
- source_word: יַעֲנֵם
  choice: 他就应允他们
  rationale: 未完成式在这里可表达过去反复发生或概括性的行动；结合诗篇回顾这些人物的语境，以“就应允他们”简洁呈现上帝对其呼求的回应。
- source_word: שְׁמוֹ
  choice: 他名
  rationale: 原文明说“他的名”；保留这一表达，以呈现借着上帝之名向他祷告和敬拜的含义，而不简化成“求告他”。
theological_decisions:
- issue: 如何既把摩西、亚伦和撒母耳呈现为蒙垂听的代求者，又不抹平他们职分上的区别
  choice: 摩西和亚伦在他的祭司中，撒母耳也在求告他名的人中
  alternative: 摩西和亚伦是他的祭司，撒母耳求告他的名
  rationale: 原文用两个平行的分类短语。“在他的祭司中”保留部分性含义，不把摩西与亚伦狭义的礼仪职分完全等同；“在求告他名的人中”则同样把撒母耳归入一个群体。这样既保留三人作为蒙上帝垂听者的共同点，也不替原文消除职分上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两个“在……中”刻意保持原文平行结构；“他名”保留圣经习语，“雅威”保留神名而不用称号替代。
