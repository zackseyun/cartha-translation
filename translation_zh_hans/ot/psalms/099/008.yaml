  text: יְהוָ֣ה אֱלֹהֵי/נוּ֮ אַתָּ֪ה עֲנִ֫יתָ֥/ם אֵ֣ל נֹ֭שֵׂא הָיִ֣יתָ לָ/הֶ֑ם וְ֝/נֹקֵ֗ם עַל עֲלִילוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/008.yaml
  text: O Yahweh our God[a], you answered them; you were a forgiving God to them[b], yet an avenger of their deeds.
translation:
  language: zh_hans
  text: 雅威，我们的神啊，你应允了他们；你曾是赦免他们的神[a]，却也因他们所行的事施行报应[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赦免”原文也可理解为“为他们担当”或“替他们除去（罪责）”；所用分词本有抬起、承担或带走之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“却也为他们所行的事施行报应。”原文分词既可指“报应者”，也可表达“施行报应”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的现代汉语音译，不以“主”这一称号替代专名。
- source_word: אֱלֹהֵינוּ
  choice: 我们的神
  rationale: 准确表达带第一人称复数后缀的结构；与“雅威”合成呼语“雅威我们的神啊”。
- source_word: אַתָּה עֲנִיתָם
  choice: 你应允了他们
  rationale: 保留显明主语的强调；结合上文求告的语境，“应允”比一般性的“回答”更自然。
- source_word: אֵל נֹשֵׂא הָיִיתָ לָהֶם
  choice: 你曾作赦免他们的神
  rationale: נֹשֵׂא本义为“抬起、承担、带走”，用于罪责时可表示赦免；此译在汉语中自然，同时以脚注保留其形象性。
- source_word: וְנֹקֵם
  choice: 却也追讨
  rationale: 分词可作名词性的“报应者”，也可表达持续或特征性的行动。汉语用动词“追讨”较自然；“却也”显出赦免与公义追究之间的张力。
- source_word: עַל עֲלִילוֹתָם
  choice: 他们所行的事
  rationale: עֲלִילוֹתָם泛指他们的行为或作为，不直接增添“恶”字；与“追讨”搭配已显明惩治语境。
theological_decisions:
- issue: 神的赦免与追讨并列
  choice: 同时保留神赦免他们和追讨其行为这两方面，不解释二者如何协调。
  alternative: 将追讨理解为只临到别人，或把赦免弱化为暂缓惩罚。
  rationale: 希伯来文直接并列神的应允、赦免与追讨；译文不消解其中真实的神学张力。
- issue: 追讨的对象
  choice: 译作“追讨他们所行的事”，贴近介词עַל与“行为”的原文表达。
  alternative: 译作“因他们所行的报应他们”，明确把人作为受罚对象。
  rationale: 所选译法避免补足原文未明确说出的受罚对象，并保留“针对其行为”的表述。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪性诗歌语言。“雅威”保留神名；“应允”“赦免”“追讨”简洁地呈现经文的平行结构。脚注标记均置于对应词组之后。
