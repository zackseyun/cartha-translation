  text: יְ֭הוָה בְּ/צִיּ֣וֹן גָּד֑וֹל וְ/רָ֥ם ה֝֗וּא עַל כָּל הָֽ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/002.yaml
  text: Yahweh is great in Zion[a], and he is exalted above all the peoples.
translation:
  language: zh_hans
  text: '雅威在锡安为大；

    他高过万民。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在万民之上。”
    reason: 原文介词 עַל 可直译为“在……之上”；正文“高过”结合了 רָם（高、崇高）与该介词的表达。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现上帝的专名，而不以“耶和华”或“主”等传统译名、称号代替。
- source_word: בְּצִיּוֹן
  choice: 在锡安
  rationale: 介词 בְּ 在此表达地点；“在锡安”自然地保留了原文的所在地含义。
- source_word: גָּדוֹל
  choice: 为大
  rationale: גָּדוֹל 表示“伟大、尊大”；诗歌语境中用“为大”简洁庄重，也避免将其局限为能力上的“强大”。
- source_word: וְרָם הוּא
  choice: 他高过
  rationale: רָם 表示崇高、高升；独立代词 הוּא 带有明确或强调作用，因此译出“他”。结合下文 עַל，用“高过”形成自然完整的汉语表达。
- source_word: עַל כָּל הָעַמִּים
  choice: 高过万民
  rationale: עַל 在这里可表示“在……之上”或相对于众民的崇高地位；כָּל הָעַמִּים 指所有族群，译作“万民”既准确又符合汉语诗歌体。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”旨在保留其作为专名的性质，不以称号替代，也不据此加入额外的宗派性解释。
- issue: “高过万民”所表达的关系
  choice: 保留空间与地位双重意象的“高过”
  alternative: 在万民之上
  rationale: רָם 与 עַל 的组合既有“高”的诗性图像，也表达超越众民的崇高地位；“高过”不进一步限定为政治统治或单纯空间位置。
translation_notes:
  register: 采用简洁、庄重而易懂的现代汉语诗体；分行保留希伯来诗歌的平行结构。“万民”较“所有民族”更凝练，也不把 עַמִּים 限定为现代国家。
