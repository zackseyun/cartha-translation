  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְֽ֭/הִשְׁתַּחֲווּ לַ/הֲדֹ֥ם רַגְלָ֗י/ו קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/005.yaml
  text: Exalt Yahweh our God[a], and bow down at his footstool[b]; he is holy.
translation:
  language: zh_hans
  text: 要尊崇耶和华我们的神；要在他的脚凳[b]前[a]俯伏；他是圣洁的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处“在……前”也可按“向着”理解；全句可译作“向他的脚凳下拜”。这里的希伯来介词在敬拜语境中有不止一种译法。
    reason: lexical_alternative
  - marker: b
    text: “他的脚凳”可能指神在地上设立宝座之处，例如约柜或圣所；但原文没有明说这一意象具体指什么。
    reason: cultural_note
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: 尊崇
  rationale: 复数命令式，意为使之崇高、颂扬。“尊崇”既自然，又保留诗歌中敬拜性的庄重语气。
- source_word: יְהוָ֤ה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式表达希伯来文神名，区别于普通称谓“主”。
- source_word: אֱלֹהֵינוּ
  choice: 我们的神
  rationale: 准确保留第一人称复数后缀所表达的群体归属关系。
- source_word: וְהִשְׁתַּחֲווּ
  choice: 俯伏
  rationale: 该动词首先描写屈身下拜的动作，也可引申为敬拜；译作“俯伏”保留其具体、身体性的意象。
- source_word: לַהֲדֹם רַגְלָיו
  choice: 在他的脚凳前
  rationale: “脚凳”直译 הֲדֹם，并将“他脚的”按自然中文合并为“他的脚凳”。介词 ל 在敬拜语境中可表达朝向或所在之处；“在……前”既通顺，也避免暗示脚凳本身是受敬拜的对象。
- source_word: קָדוֹשׁ הוּא
  choice: 他是圣洁的
  rationale: 直接呈现形容词谓语与代词的关系，语言自然清楚，并保留本句作为前面两个命令之依据的作用。
theological_decisions:
- issue: “他的脚凳”所指为何
  choice: 正文保留“他的脚凳”这一隐喻，不明确指定其所指
  alternative: 将其解释为约柜、锡安、圣所或神在地上的宝座所在
  rationale: 本节并未明说脚凳具体指什么；保留原有意象，避免把一种可能的解释写入正文。
- issue: 俯伏动作与敬拜对象的关系
  choice: 译作“在他的脚凳前俯伏”
  alternative: 译作“向他的脚凳下拜”
  rationale: 希伯来介词容许不同理解；所选表达保留敬拜场景，同时避免让读者误以为脚凳本身就是受敬拜者。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌敬拜语体。“尊崇”“俯伏”“圣洁”均为当代中文宗教语境中通行的词，同时避免古奥倒装和过度解释。
