  text: יְהוָ֣ה מָ֭לָךְ יִרְגְּז֣וּ עַמִּ֑ים יֹשֵׁ֥ב כְּ֝רוּבִ֗ים תָּנ֥וּט הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/001.yaml
  text: Yahweh reigns[a]; let the peoples tremble. He sits enthroned upon the cherubim[b]; let the earth quake.
translation:
  language: zh_hans
  text: 雅威为王[a]；万民当战兢。他坐在基路伯之上为王[b]；大地当震动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“万民战兢……大地震动。”希伯来语的未完成式动词也可按直陈语气理解，而不一定是呼吁式。
    reason: alternative_reading
  - marker: b
    text: “坐在基路伯之上为王”也可译作“在基路伯之间作王”或“坐在基路伯之上”。这个希伯来语表达是雅威的王权—圣殿称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译保留上帝在希伯来文本中的专名，不用“耶和华”或“主”替代。
- source_word: מָלָךְ
  choice: 作王
  rationale: 该完成式在诗歌宣告中表达雅威现今的王权；“作王”简洁庄重，也不强加“开始登基”的起始含义。
- source_word: יִרְגְּזוּ
  choice: 都当战兢
  rationale: 将未完成式按诗歌语境理解为意愿式、呼吁式回应；“战兢”表达万民面对神圣君王时的震惧。直陈式读法保留在脚注中。
- source_word: עַמִּים
  choice: 万民
  rationale: 用自然的现代汉语表达复数集合意义，指众多民族或族群，而非单一百姓。
- source_word: יֹשֵׁב כְּרוּבִים
  choice: 坐在基路伯之上为王
  rationale: 兼顾 יֹשֵׁב 的“坐着”和这一王权—圣殿称号的登基含义；“之上”不把空间关系限定为“二基路伯之间”。
- source_word: כְּרוּבִים
  choice: 基路伯
  rationale: 采用简体中文圣经语域中这一类天上活物的通行音译；汉语不另加复数词尾。
- source_word: תָּנוּט
  choice: 都当震动
  rationale: 与前句的呼吁式平行，表达大地在神圣王权面前摇撼震动；直陈式仍属可行读法。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 本篇作王诗语境具有普世、宇宙范围，“大地”比特定地域意义的“土地”更合适。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，故以“雅威”保留其专名性质，而不以称号替代。
- issue: יִרְגְּזוּ 与 תָּנוּט 的语气
  choice: 呼吁式：“都当战兢……都当震动”
  alternative: 直陈式：“万民战兢……大地震动”
  rationale: 作王诗的宣告之后可自然接呼吁式回应，但希伯来语未完成式也容许直陈理解，因此在脚注中保留歧义。
- issue: יֹשֵׁב כְּרוּבִים 所表达的位置与王权
  choice: 坐在基路伯之上为王
  alternative: 在基路伯之间作王；坐在基路伯之上
  rationale: 该表达是带有王权和圣殿意象的称号；正文传达登基作王的功能，同时避免把未明说的具体空间关系断定为“之间”。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。分号保留两组平行宣告与回应；“都当”使呼吁语气在普通话中清楚自然。
