id: PSA.99.9
reference: Psalms 99:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ֭/הִֽשְׁתַּחֲווּ לְ/הַ֣ר קָדְשׁ֑/וֹ כִּֽי קָ֝ד֗וֹשׁ יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/009.yaml
  text: Exalt Yahweh our God[a], and bow down at his holy mountain, for Yahweh our God is holy.
translation:
  language: zh_hans
  text: 你们要尊崇耶和华我们的上帝，向他的圣山俯伏敬拜[a]；因为耶和华我们的上帝是圣洁的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他的圣山俯伏敬拜。”希伯来语介词既可表示“向着”，也可表示“在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: 尊崇
  rationale: 复数命令式，意为高举、尊为至高；“尊崇”在现代汉语中自然庄重，并适合对上帝的颂赞。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式译出四字神名，而不以称号“主”替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 准确表达名词加第一人称复数所有格后缀。
- source_word: וְהִשְׁתַּחֲווּ
  choice: 俯伏敬拜
  rationale: 该动词既指身体俯伏，也常在敬拜语境中表示敬拜；合译可保留动作形象及其宗教含义。
- source_word: לְהַר קָדְשׁוֹ
  choice: 向他的圣山
  rationale: 介词לְ可表达朝向或与地点的关联；“向”保留方向性，也不暗示圣山本身是受敬拜的对象。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述命令的理由，现代汉语中清楚自然。
- source_word: קָדוֹשׁ
  choice: 圣洁的
  rationale: 准确传达神分别为圣、绝对圣洁的核心意义，并呼应本诗反复出现的主题。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名；正文保留专名而不替换为“主”。“耶和华”是现代中文圣经传统中辨识度最高且通行的形式。
- issue: הִשְׁתַּחֲווּ是仅译身体动作还是明说敬拜
  choice: 俯伏敬拜
  alternative: 俯伏
  rationale: 原词兼有俯伏动作和敬拜功能。中文若只说“俯伏”，宗教语境仍可理解，但“俯伏敬拜”更自然完整，同时没有抹去身体姿态。
- issue: לְהַר קָדְשׁוֹ的空间关系
  choice: 向他的圣山
  alternative: 在他的圣山
  rationale: לְ既可作方向性理解，也可表示地点关系。正文采用“向”以避免暗示敬拜者必定位于山上，并以脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体汉语。两个命令以逗号相连，理由分句前用分号，使经文层次清楚；重复“耶和华我们的上帝”，保留原文首尾呼应。
