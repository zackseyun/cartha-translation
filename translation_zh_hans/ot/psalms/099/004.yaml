  text: וְ/עֹ֥ז מֶלֶךְ֮ מִשְׁפָּ֪ט אָ֫הֵ֥ב אַ֭תָּה כּוֹנַ֣נְתָּ מֵישָׁרִ֑ים מִשְׁפָּ֥ט וּ֝/צְדָקָ֗ה בְּ/יַעֲקֹ֤ב אַתָּ֬ה עָשִֽׂיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/004.yaml
  text: The strength of the King loves justice[a]; you have established uprightness[b]; you have done justice and righteousness in Jacob.
translation:
  language: zh_hans
  text: 大有能力的君王喜爱公平[a]；你确立了公正[b]；你在雅各中施行了公平和公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文开头的表达十分凝练，字面可作“君王的力量喜爱公平”，也可理解为“君王以力量喜爱公平”。
    reason: alternative_reading
  - marker: b
    text: “公正”也可译作“正直”或“平正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹז מֶלֶךְ
  choice: 君王的力量
  rationale: 保留希伯来文以“力量”和“君王”构成的压缩表达，不擅自将名词改作形容词；其句法歧义另以脚注说明。
- source_word: מִשְׁפָּט
  choice: 公平
  rationale: 此处指公正的治理和司法秩序；两次出现均译为“公平”，以保留诗句的重复。
- source_word: אָהֵב
  choice: 喜爱
  rationale: 完成式在诗歌中表达恒常特征，现代汉语用“喜爱”自然传达这一惯常意义。
- source_word: כּוֹנַנְתָּ
  choice: 确立了
  rationale: 表达建立并使之稳固的行动，也保留完成动作的意味。
- source_word: מֵישָׁרִים
  choice: 正直
  rationale: 该词指道德或司法意义上的正直、公正；“正直”较直接保留其伦理色彩。
- source_word: וּ/צְדָקָה
  choice: 和公义
  rationale: 与“公平”并列，保留两个相关而不完全相同的希伯来概念。
- source_word: בְּ/יַעֲקֹב
  choice: 在雅各中
  rationale: 保留原文的介词表达和诗性的盟约名称“雅各”，不直接解释为“以色列”。
- source_word: עָשִׂיתָ
  choice: 施行了
  rationale: 相较字面的“做了”，“施行了公平和公义”更符合现代汉语搭配，同时准确表达实际成就。
theological_decisions:
- issue: 如何理解压缩且句法困难的 וְעֹז מֶלֶךְ
  choice: 君王的力量喜爱公平
  alternative: 大有能力的君王喜爱公平；君王以他的力量喜爱公平
  rationale: 正文尽量显明希伯来文“力量—君王”的表层结构，不把歧义悄然消解为形容词结构；较通顺的理解置于脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原诗三分句的平行结构，并以分号呈现。对首句真正存在的句法张力不在正文中强行解决，而用脚注提供自然的替代读法。
