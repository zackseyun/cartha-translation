source:
  edition: WLC
  text: אַ֣ךְ לֵ֭/אלֹהִים דּ֣וֹמִּי נַפְשִׁ֑/י כִּי מִ֝מֶּ֗/נּוּ תִּקְוָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/005.yaml
  text: For God alone[a], be silent, my soul[c][b], for my hope is from him.
translation:
  language: zh_hans
  text: 我的心哪，你当惟独在上帝面前静默[a][b]，因为我的盼望从他而来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的心惟独在上帝面前静默等候”，把动词理解为描述性的陈述，而不是劝勉。
    reason: alternative_reading
  - marker: b
    text: “静默”所译的希伯来语动词也可表达安静、静止或默然等候；因此有些译法作“静默等候”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 惟独
  rationale: 此处表示排他性的强调，限定心所转向、静候的对象只有上帝；“惟独”庄重而清楚，也符合本诗反复强调单单倚靠上帝的语境。
- source_word: לֵאלֹהִים
  choice: 向上帝
  rationale: 介词 ל 表明静默所朝向的对象。现代汉语用“向上帝”比生硬的“为上帝”更自然，同时保留原文的指向关系。
- source_word: דּוֹמִּי
  choice: 你要……静默
  rationale: 该阴性单数形式在此按命令式理解，与阴性名词 נֶפֶשׁ 呼应，构成诗人对自己内心的劝勉。“静默”直接保留安静、不出声的核心意义，不把语境中可能含有的“等候”直接写入正文。
- source_word: נַפְשִׁי
  choice: 我的心哪
  rationale: 原文是诗人对自身 נֶפֶשׁ 的呼唤。在现代汉语诗歌和祷告语体中，“我的心哪”比“我的灵魂啊”更自然，也能表达内在的自我，而不把该词限缩为与身体相对的灵魂实体。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出劝勉的理由：诗人的盼望来自上帝。
- source_word: מִמֶּנּוּ
  choice: 从他而来
  rationale: 代词回指上帝；“从他而来”自然地保留来源关系，没有把 אַךְ 的排他意义重复移入本短语。
- source_word: תִּקְוָתִי
  choice: 我的盼望
  rationale: תִּקְוָה 在此指期待和盼望；“盼望”是清楚、自然且适合诗篇语域的表达。
theological_decisions:
- issue: דּוֹמִּי 应理解为对内心的劝勉，还是描述内心状态的陈述
  choice: 正文采用劝勉：“我的心哪，你要……静默”
  alternative: “我的心惟独向上帝静默等候”
  rationale: 马所拉元音所呈现的形式可自然理解为阴性单数命令式，并与 נַפְשִׁי 的自我呼告相合。不过，诗歌句法容许把整句理解为状态陈述，因此以脚注保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。“我的心哪”保留希伯来诗歌的自我呼告；“惟独向上帝静默”尽量贴近原文的排他强调与简洁表达。正文保留命令式解读，脚注说明陈述式及“等候”的可能性。
