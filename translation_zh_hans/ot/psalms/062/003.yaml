base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/003.yaml
  text: How long will you assail a man? Will you all break him down[a], like a leaning wall[c][b], a tottering fence?
translation:
  language: zh_hans
  text: 你们要攻击一个人到几时呢？你们众人都要把他击垮吗？[a]——如同一堵倾斜的墙、一道被推倒的篱笆。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把他击垮”也可译作“杀害他”。原动词通常有“杀害”的意思，但这里也可能因下文墙和篱笆的意象而作比喻理解。
    reason: lexical_alternative
  - marker: b
    text: 末尾的比喻在原文中未明确说明所指。它可能把受攻击的人描写为脆弱、濒临倒下；也有人认为，它描写攻击者像一堵倾斜的墙，成群逼向他。
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהֽוֹתְת֣וּ
  choice: 攻击
  rationale: 该罕见动词表示猛烈袭击或连续冲击；“攻击”在现代汉语中自然清楚，同时保留敌对和暴力意味。
- source_word: עַל אִישׁ
  choice: 一个人
  rationale: 保留希伯来文单数个体的指向；此处说的是一个受围攻的人，而非泛指人类。
- source_word: תְּרָצְּחוּ
  choice: 把他击垮
  rationale: 该词通常可指杀害，但紧接倾斜之墙和将倒篱笆的比喻，语境支持“击垮”的隐喻义；此译仍保留暴力威胁，并使结构倒塌的意象连贯。
- source_word: כֻלְּכֶם
  choice: 你们大家都
  rationale: 体现复数代词的强调和攻击者集体行动的意味。
- source_word: כְּקִיר נָטוּי
  choice: 如同倾斜的墙
  rationale: 直接保留墙体倾斜、濒临倒塌的形象。
- source_word: גָּדֵר הַדְּחוּיָה
  choice: 摇摇欲坠的篱笆
  rationale: 原词描写被推歪、排开或压倒的围墙、篱笆；“摇摇欲坠”自然传达其不稳和将要倒塌的状态。
theological_decisions: []
