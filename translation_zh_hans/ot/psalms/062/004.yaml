  text: אַ֤ךְ מִ/שְּׂאֵת֨/וֹ יָעֲצ֣וּ לְ/הַדִּיחַ֮ יִרְצ֪וּ כָ֫זָ֥ב בְּ/פִ֥י/ו יְבָרֵ֑כוּ וּ֝/בְ/קִרְבָּ֗/ם יְקַלְלוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/004.yaml
  text: They only plan to cast him down from his high position[a]; they delight in falsehood. With their mouth they bless, but inwardly they curse[b]. Selah
translation:
  language: zh_hans
  text: 他们只图谋把他从高位上推下[a]；他们喜爱虚假。他们口里祝福，心里却咒诅[b]。细拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高位”或译“尊荣”、“崇高之处”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文此处的形式直译为“用他的口”；但根据上下文及平行结构，主文按集合意义译为“他们口里”。意思是：他们外表祝福，内心却咒诅。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 只
  rationale: 在此具限制作用，表明仇敌一心只顾图谋下文所述之事。
- source_word: מִשְּׂאֵתוֹ
  choice: 从高位上
  rationale: שְׂאֵת可指高升、尊荣或崇高地位；“高位”保留地位与高度的双重意象，又不限定为某种具体职位。
- source_word: יָעֲצוּ
  choice: 图谋
  rationale: 该动词指商议、筹划；上下文带敌对意味，“图谋”自然地呈现其恶意。
- source_word: לְהַדִּיחַ
  choice: 推下
  rationale: 使役式表达使人离开、被赶逐或倒下；与“从高位上”结合时，“推下”保留鲜明的倾覆意象。
- source_word: יִרְצוּ כָזָב
  choice: 他们喜爱虚假
  rationale: רצה与כָזָב连用表示悦纳或以欺假为乐；“喜爱虚假”既简洁又保留其宽泛的道德含义。
- source_word: בְּפִיו יְבָרֵכוּ
  choice: 他们口中祝福
  rationale: 原文代词形式直译可作“用他的口”，但复数主语与后半句的平行结构更支持集合意义，即他们在言语上祝福；脚注保留形式上的难点。
- source_word: וּבְקִרְבָּם
  choice: 内心
  rationale: 字面为“在他们里面”，这里指内在意念；“内心”自然呈现其与外在言语的对照。
- source_word: יְקַלְלוּ
  choice: 咒诅
  rationale: 直接保留与“祝福”针锋相对的含义。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该礼仪或音乐术语确切含义不明，按中文圣经传统音译，以免强加解释。
theological_decisions:
- issue: “从他的高位”中单数男性后缀及“推下”的对象
  choice: 以“他”指诗人或本诗中受仇敌攻击的单数个人
  alternative: 可泛指“一个人”；“高位”也可侧重其尊荣或尊严
  rationale: 希伯来文明确使用阳性单数后缀，译作“他”保留其个人指向，却不进一步认定特定的神学身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“图谋”“推下”呈现敌意和由高处倾覆的意象；“口中……内心却……”保持原诗鲜明的外内对照。保留传统音译“细拉”，并以括号标示其礼仪性插语。
