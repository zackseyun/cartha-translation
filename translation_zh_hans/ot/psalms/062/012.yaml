  text: וּ/לְ/ךָֽ אֲדֹנָ֥/י חָ֑סֶד כִּֽי אַתָּ֨ה תְשַׁלֵּ֖ם לְ/אִ֣ישׁ כְּֽ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/012.yaml
  text: And to you[a], O Lord, belongs steadfast love[b], for you repay each man according to his work.
translation:
  language: zh_hans
  text: 主啊，慈爱也归于你[a]；因为你按各人所做的报偿各人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是无动词句，直译可作“主啊，慈爱也归于你”；前置的“给你／归你”强调慈爱的归属。
    reason: lexical_alternative
  - marker: b
    text: “报偿”译自原文一个表示按应得给予回报的动词；可包括奖赏或惩罚，并非只指负面后果。“各人”对应原文语法上的阳性单数泛指用法。
    reason: lexical_clarification
lexical_decisions:
- source_word: וּלְךָ
  choice: 也属于你
  rationale: 前置的介词短语表达归属并带有强调；中文补出“属于”，自然呈现希伯来语无动词句，并以“也”承接上文。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝的称号兼直接呼语；“主啊”符合现代中文诗歌祷告语体。
- source_word: חָסֶד
  choice: 慈爱
  rationale: “慈爱”兼具仁爱、怜悯和忠贞之意，是中文圣经语境中表达חסד的简洁而庄重的用语。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前句的根据，说明上帝的慈爱如何与公正报偿相连。
- source_word: תְשַׁלֵּם
  choice: 报应
  rationale: 该动词表示按应得的给予回报，可包含正面或负面的结果；“报应”在此作中性动词使用，不将含义限于奖赏。
- source_word: לְאִישׁ
  choice: 各人
  rationale: 单数אִישׁ在这里具有泛指和逐一分配的作用；“各人”自然表达每一个人的含义，不把经文所指不必要地限于男性。
- source_word: כְּמַעֲשֵׂהוּ
  choice: 照各人所做的
  rationale: 表达回报与个人行为相称；采用“所做的”比直译“工作”更符合现代汉语，也保留行为结果的开放范围。
theological_decisions:
- issue: 上帝的慈爱与按行为报偿之间的关系
  choice: 并列保留上帝的慈爱和他照各人所做的施行报应
  alternative: 把חסד仅解释为宽恕，或把תשלם仅译为正面的奖赏
  rationale: 原文把慈爱与公正报偿放在同一句中，并未消除二者之间的张力；译文不将报偿限定为奖赏或惩罚。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祷告语体。“主啊”保留直接呼语；“慈爱”延续熟悉的圣经用词；“各人所做的”避免生硬直译，同时准确表达泛指及逐一报偿。
