  text: אַל תִּבְטְח֣וּ בְ/עֹשֶׁק֮ וּ/בְ/גָזֵ֪ל אַל תֶּ֫הְבָּ֥לוּ חַ֤יִל כִּֽי יָנ֑וּב אַל תָּשִׁ֥יתוּ לֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/010.yaml
  text: Do not trust in oppression[a], and do not put vain hope in robbery; if wealth increases, do not set your heart on it.
translation:
  language: zh_hans
  text: 不要倚仗欺压，也不要在抢夺中徒然自恃[a]；财富若增多，不要把心系在其上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要把虚妄的希望寄托在抢夺上”，或“不要因抢夺而夸耀”。这里的希伯来语动词含义较难确定，可表示徒然行事、虚妄自恃或夸耀。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבְטְחוּ
  choice: 倚仗
  rationale: בטח表示信靠、依赖；“倚仗”自然地传达把欺压当作可靠手段的含义。
- source_word: בְעֹשֶׁק
  choice: 欺压
  rationale: עֹשֶׁק涵盖压迫、剥削和勒索；“欺压”保留其广泛的伦理含义。
- source_word: בְגָזֵל
  choice: 因抢夺
  rationale: גָזֵל指抢夺或以强力夺取之物；介词短语译作“因抢夺”，既保留关联，也与所选动词自然搭配。
- source_word: תֶּהְבָּלוּ
  choice: 自负
  rationale: 该词源自הבל，语义较难确定，可指变得虚妄、徒然自恃或夸耀；正文采用“自负”，保留因抢夺而虚妄自恃的警告，其他可能性列入脚注。
- source_word: חַיִל
  choice: 财富
  rationale: חַיִל可指力量、资源或财富；与“增多”连用时，物质财富最合语境。
- source_word: כִּי יָנוּב
  choice: 若增多
  rationale: נוב本指萌发、增长；用于财富时自然译为“增多”，כִּי在这里可表达条件。
- source_word: תָּשִׁיתוּ לֵב
  choice: 放在心上
  rationale: שׁית לב指把心思投注于某物；“放在心上”保留“心”的意象，并表达看重、依恋和倚赖。
theological_decisions:
- issue: 中间分句的含义
  choice: 译为“不要因抢夺而自负”，保留虚妄自恃或夸耀的含义。
  alternative: 也可理解为“不要把虚妄的希望寄托在抢夺上”或“不要因抢夺而夸耀”。
  rationale: תֶּהְבָּלוּ的确切语义存在困难。正文不把它单一限定为“寄望”，脚注则呈现主要可能读法，从而保留原文的歧义和伦理张力。
- issue: 末句对财富的警告范围
  choice: 把警告理解为即使财富本身增多，也不可把心系在其上。
  alternative: 可将其更紧密地理解为前文不义所得的增加。
  rationale: 末句的“财富”没有明说只限于不义之财，因而保留从不义手段扩展到财富本身的普遍警告。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倚仗”“欺压”“抢夺”保持诗句的伦理力度；分号呈现前两项不义手段与末句财富警告之间的推进。
