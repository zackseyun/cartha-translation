  text: אַ֣ךְ אֶל אֱ֭לֹהִים דּֽוּמִיָּ֣ה נַפְשִׁ֑/י מִ֝מֶּ֗/נּוּ יְשׁוּעָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/001.yaml
  text: Only for God is my soul silent[b][a]; from him comes my salvation.
translation:
  language: zh_hans
  text: 我的心只在上帝面前静默[a]；我的拯救从他而来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的心只静候上帝”，或“我的心只在上帝那里安息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 只
  rationale: 既保留限制性与专一性，也符合汉语诗句的简洁表达，表明心专一朝向上帝。
- source_word: אֶל
  choice: 候……（朝向关系隐含于“静候上帝”）
  rationale: 原词表示朝向；汉语用“静候上帝”可自然表达心朝向上帝、等候他的意思，避免生硬的“向着上帝静默”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处是单数指称，指以色列的上帝；“上帝”是现代标准汉语中自然、庄重的译法。
- source_word: דּוּמִיָּה
  choice: 静候
  rationale: 该名词可表示静默、安静或宁静；“静候”兼顾静默的核心意象和语境中等候的含义，同时保持现代汉语自然。脚注保留其他可能。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נֶפֶשׁ在此指整个人的内在自我；汉语诗体中“我的心”比“我的灵魂”更自然，也不把它狭义化为独立于身体的实体。
- source_word: מִמֶּנּוּ
  choice: 从他而来
  rationale: 准确表达来源；专一性已由“只”体现，无须再次添加“唯独”。
- source_word: יְשׁוּעָתִי
  choice: 我的拯救
  rationale: 既可表达从危难中获救的具体意义，也保留诗篇中的神学分量；较“救恩”少一些后期术语色彩。
theological_decisions:
- issue: דּוּמִיָּה נַפְשִׁי所表达的是静默、等候还是安息
  choice: 正文译作“我的心只静候上帝”
  alternative: “我的心只在上帝面前静默”或“我的心只在上帝里面安息”
  rationale: 希伯来语容许静默、宁静和安静等候等相互关联的理解。“静候”在自然汉语中保留安静信靠并等候的张力；脚注列明更贴近形式的其他译法，不把语义限定为单一神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“静候”避免“向上帝沉默”可能产生的负面误解；分号保留两分句之间的紧密因果与诗行节奏。
