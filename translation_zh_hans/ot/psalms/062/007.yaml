  yaml_path: translation/ot/psalms/062/007.yaml
  text: On God rest my salvation and my glory[a]; the rock of my strength, my refuge[b], is in God.
translation:
  language: zh_hans
  text: 我的救恩和荣耀都倚靠上帝[a]；上帝是我力量的磐石；我的避难所在上帝里面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”也可译为“尊荣”或“荣誉”，可指诗人的尊严或所获的昭雪。
    reason: lexical_alternative
  - marker: b
    text: 较形式化地译作：“我的避难所在上帝那里。”
    reason: syntactic_alternative
lexical_decisions:
- source_word: עַל
  choice: 倚靠
  rationale: 希伯来语介词表达救恩和荣耀以上帝为依托；“倚靠”自然保留这种依赖、支承的意象。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指以色列的上帝；采用现代汉语中清楚而庄重的常用译名。
- source_word: יִשְׁעִי
  choice: 我的救恩
  rationale: 该词表示拯救、解救；“救恩”保留诗歌中现实获救与更广阔神学含义的张力。
- source_word: וּכְבוֹדִי
  choice: 和荣耀
  rationale: כָּבוֹד 可指荣耀、尊荣或荣誉；正文译为“荣耀”，并以脚注保留“尊荣”的可能。
- source_word: צוּר
  choice: 磐石
  rationale: 保留原文以岩石象征稳固与保护的比喻；“磐石”符合现代中文圣诗体语感。
- source_word: עֻזִּי
  choice: 我力量的
  rationale: עֹז 的直接含义是力量或能力；不译作“堡垒”，以免加入原词没有明说的建筑意象。
- source_word: מַחְסִי
  choice: 我的避难所
  rationale: 该名词表示可投靠、躲避危险之处；“避难所”准确清楚。
- source_word: בֵּאלֹהִים
  choice: 他是……我的避难所
  rationale: 原文直译为“我的避难所在上帝里面”。为使中文自然，并与前面的“上帝”相承，以“他是”表达省略的系词关系，同时未改变避难所归于上帝的含义。
theological_decisions:
- issue: 开头介词短语与无动词分句的关系
  choice: 译为“我的救恩和荣耀都倚靠上帝”，表达二者以上帝为依托。
  alternative: 较形式化地译为“我的救恩和荣耀都在于上帝”。
  rationale: 原文是无系词的诗句。“倚靠”保留 עַל 所含的依托意象，又比逐字结构更符合现代汉语；不把依赖关系扩展为额外的教义说明。
- issue: 末句 בֵּאלֹהִים 的句法表达
  choice: 将上帝直接表述为诗人的避难所。
  alternative: 译为“我的避难所在上帝里面”。
  rationale: 两种表达都可反映原文。正文的拟人指代在中文中更自然，也与“力量的磐石”形成连贯并列；脚注保留较形式化的结构。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“救恩”“磐石”“避难所”保留诗篇的核心意象；句式简洁，适合朗读。
