  yaml_path: translation/ot/psalms/062/011.yaml
  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
translation:
  language: zh_hans
  text: 神说了一件事[a]；我听见了两件事：力量属于神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神说了一次，我两次听见这话。”希伯来语的表达既可按“一次／两次”理解，也可按“一件事／两件事”的数句格式理解。
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת
  choice: 一件事
  rationale: 该阴性单数数词本义为“一”；与后面的“二”构成递进式数句。“一件事”在现代汉语中自然，也保留了计数结构。
- source_word: דִּבֶּר
  choice: 说了
  rationale: 完成式表示已经发生的言说；“说了”简洁自然，不额外限定其时间或持续效果。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处虽为形态上的复数形式，却具有单数意义，指以色列的神。
- source_word: שְׁתַּיִם
  choice: 两件
  rationale: 与אַחַת相配，按数句公式理解；补出量词“件”，符合现代汉语表达。
- source_word: זוּ
  choice: 由“两件”及后面的内容关系体现
  rationale: 该指示形式指向下文；若硬译为“这个”会使汉语不自然，因此通过“两件：”的结构表达。
- source_word: שָׁמָעְתִּי
  choice: 我听见了
  rationale: 完成式表示诗人已经听见；“听见了”保留听闻动作，不将其解释性地改为“领悟”。
- source_word: כִּי
  choice: 冒号引出内容
  rationale: כִּי在此引出所听见的内容；现代汉语用冒号比直译“就是”或“因为”更清楚自然。
- source_word: עֹז
  choice: 能力
  rationale: 该词表示力量、权能或强力；“能力”在此清楚庄重，并能涵盖神施展力量的含义。
- source_word: לֵאלֹהִים
  choice: 属于神
  rationale: 介词ל在此表达归属或属性；“属于神”明确保留这一关系。
theological_decisions:
- issue: “一……二……”数句的理解
  choice: 译为“神说了一件事，我听见了两件”
  alternative: “神说了一次，我却听见了两次这话”
  rationale: 希伯来语既可能把数词理解为“一次／两次”，也可能理解为“一件／两件”的递进式数句。正文采用后者，因为它较自然地衔接下文的内容；脚注保留前者，避免消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原诗“一／二”的修辞张力，并以脚注呈现另一种语法上可行的读法。
