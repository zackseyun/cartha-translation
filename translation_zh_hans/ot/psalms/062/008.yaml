  text: בִּטְח֘וּ ב֤/וֹ בְ/כָל עֵ֨ת עָ֗ם שִׁפְכֽוּ לְ/פָנָ֥י/ו לְבַבְ/כֶ֑ם אֱלֹהִ֖ים מַחֲסֶה לָּ֣/נוּ סֶֽלָה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/008.yaml
  text: Trust in him at all times[a], O people; pour out your hearts before him. God is a refuge for us[d][c][b]. Selah
translation:
  language: zh_hans
  text: 众民哪，你们要时时信靠他[a]；要在他面前倾心吐意[b]。上帝是我们的避难所。细拉[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时时”原文直译为“在每一个时候”，也可译作“随时”或“始终”。
    reason: lexical_alternative
  - marker: b
    text: “倾心吐意”原文为“倾倒你们的心”，指在上帝面前毫无保留地陈明内心的思想、愿望和感受。
    reason: lexical_alternative
  - marker: c
    text: “细拉”可能是礼仪或音乐术语，确切含义不明。
    reason: cultural_note
lexical_decisions:
- source_word: בִּטְחוּ בּוֹ
  choice: 信靠他
  rationale: בטח的复数命令式表示信任、倚靠；“信靠他”在现代汉语中自然，并保留以神为信靠对象的含义。
- source_word: בְכָל־עֵת
  choice: 时时
  rationale: 原文直译为“在每一个时候”，意为任何时候、始终；“时时”简洁而符合诗歌语体。
- source_word: עָם
  choice: 众民哪
  rationale: 此处在命令句后作呼语，直接称呼共同体；“众民哪”既显明呼语功能，也不把所指限缩为政治意义上的国家。
- source_word: שִׁפְכוּ לְפָנָיו לְבַבְכֶם
  choice: 要在他面前倾心吐意
  rationale: 字面意象是“在他面前倾倒你们的心”。汉语成语“倾心吐意”自然表达毫无保留地陈明内心，同时保留“倾倒”的核心隐喻及复数群体语境。
- source_word: אֱלֹהִים מַחֲסֶה לָנוּ
  choice: 上帝是我们的避难所
  rationale: מַחֲסֶה指躲避危险、获得保护之处；“避难所”准确、简明，也呼应本诗信靠的主题。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词的确切功能不明，可能是礼仪或音乐术语；采用传统音译，避免用解释性译法消除原文的不确定性。
theological_decisions:
- issue: עָם的群体呼语性质
  choice: 译作“众民哪”，将劝勉明确呈现为对敬拜群体的直接呼唤。
  alternative: 只译“众民”而不显出呼语，或译作“国民”。
  rationale: 该名词位于复数命令式的劝勉中，自然充当呼语；此译法保留共同体维度，又不擅自限定其民族或政治范围。
- issue: “倾倒心”的内在含义
  choice: 译作“倾心吐意”，表达人在上帝面前毫无保留地陈明内心。
  alternative: 按字面译作“倾倒你们的心”，或解释性地译作“说出你们所有的思想和愿望”。
  rationale: 原文以“心”涵盖思想、意愿和情感；采用自然汉语习语可保留开放陈诉的含义，而不把“心”的神学与人论内涵窄化为单一心理功能。
- issue: סֶלָה的处理
  choice: 保留音译“细拉”。
  alternative: 译作“停顿”“间奏”等。
  rationale: 该词的确切意义仍不确定；音译能透明地保存这种不确定性，避免把某一种礼仪或音乐解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“众民哪”标明直接呼语；“时时”保持节奏简洁；“倾心吐意”使希伯来习语在中文中自然可懂。正文中的每个脚注标记均与脚注对应。
