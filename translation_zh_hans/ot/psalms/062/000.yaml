lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇标题中通常指负责统筹音乐演奏的人。“乐长”简洁、庄重，也符合标题语境；用“交给”表达前缀 לַ 所带的指向意味。
- source_word: עַל
  choice: 按
  rationale: 在诗篇标题中，此介词与专名连用时，可能表示依照某种曲调、风格或演奏指示。“按”保留了这种未明确说明的关系，没有将其限定为单一含义。
- source_word: יְדוּתוּן
  choice: 耶杜顿
  rationale: 这是专名，采用现代中文音译。它可能指利未音乐家耶杜顿，也可能指与他有关的曲调、风格或演奏方式。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 此词是诗篇标题中的体裁名称，通常指配合音乐吟唱的诗歌；中文传统而自然的表达“大卫的诗”简明庄重。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 前缀 לְ 在诗篇标题中可表示作者、归属、奉献对象或关联。“大卫的”保留其语义宽度，避免径直断定为“大卫所作”。
theological_decisions:
- issue: 标题中 לְדָוִד 的含义
  choice: 大卫的
  alternative: 大卫所作；献给大卫；与大卫有关
  rationale: 希伯来文并未要求在作者身份、奉献对象和广义关联之间作出唯一判断。“大卫的”最能保留原文的开放性。
translation_notes:
  register: 采用现代、简洁而庄重的诗篇标题体。“交给乐长”清楚表达礼仪和音乐执行语境；“按耶杜顿”刻意保持简练及关系上的含混，并以脚注说明可能含义。所有脚注标记均紧随其所解释的词语。
