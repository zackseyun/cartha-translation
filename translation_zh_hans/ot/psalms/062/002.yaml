  text: אַךְ ה֣וּא צ֭וּרִ/י וִֽ/ישׁוּעָתִ֑/י מִ֝שְׂגַּבִּ֗/י לֹא אֶמּ֥וֹט רַבָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/002.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be greatly shaken.
translation:
  language: zh_hans
  text: 唯有他是我的磐石、我的拯救、我的堡垒；我必不至于大大动摇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必不动摇。”希伯来文在“动摇”一词后含有表示“大大地”或“厉害地”的程度词。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 唯有
  rationale: 在本诗语境中表示排他和强调，指出上帝是诗人唯一的保障；“唯有”自然保留这一语气。
- source_word: הוּא
  choice: 他
  rationale: 第三人称阳性单数代词，指向上帝；现代汉语在此明说主语最为自然。
- source_word: צוּרִי
  choice: 我的磐石
  rationale: 保留以坚固岩石象征稳定和保护的希伯来诗歌意象；“磐石”庄重而易懂。
- source_word: וִישׁוּעָתִי
  choice: 我的拯救
  rationale: 该词可指拯救、解救或胜利；“我的拯救”既保留名词性平行结构，也涵盖诗中蒙救护、得安全的意义。
- source_word: מִשְׂגַּבִּי
  choice: 我的堡垒
  rationale: 原词指安全的高处或坚固据点；“堡垒”在现代汉语中清楚表达防护和安全感。
- source_word: לֹא אֶמּוֹט
  choice: 我必不会动摇
  rationale: 原动词可表示摇动、失足或倾覆；“不会动摇”自然保留因信靠上帝而站立稳固的比喻。
- source_word: רַבָּה
  choice: 大大
  rationale: 这里作程度修饰语，表示“大大地”或“厉害地”；译出这一成分，可避免把本句与诗中没有该修饰语的绝对说法强行协调。
theological_decisions:
- issue: 末句所表达的安稳程度
  choice: 我必不会大大动摇
  alternative: 我必不动摇
  rationale: 希伯来文保留了程度修饰语 רַבָּה。正文将其译出，忠实呈现诗人所说的不是绝对不会有任何摇动，而是不会受到严重动摇；脚注同时说明较简洁的传统译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“磐石—拯救—堡垒”保留原文连续并列的保障意象；末句略带希伯来诗歌语感，以准确保留程度修饰语。
