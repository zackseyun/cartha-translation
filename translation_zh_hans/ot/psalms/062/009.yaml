revisions:
- from: 人的子孙不过是一口气，男子的子孙都不可靠[a]；放在天平上，他们便翘起来；合在一起，比一口气还轻。
  to: 人类不过是一口气；世人不过是虚假[a]。在天平上，他们会上升；他们合在一起，比一口气还轻。
  rationale: 修订以自然的现代汉语表达原文的两组平行人类称谓，并借“人类／世人”保留其相近而不完全相同的效果。删除“男子的子孙”所造成的性别和后裔误解；以“虚假”恢复כָּזָב的直接断言。天平句仍直译“上升”，末句保留“合在一起”及“比一口气还轻”的比较和集合意义。
