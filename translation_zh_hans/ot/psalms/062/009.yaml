source:
  edition: WLC
  text: אַ֤ךְ הֶ֥בֶל בְּנֵֽי אָדָם֮ כָּזָ֪ב בְּנֵ֫י אִ֥ישׁ בְּ/מֹאזְנַ֥יִם לַ/עֲל֑וֹת הֵ֝֗מָּה מֵ/הֶ֥בֶל יָֽחַד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/009.yaml
  text: Surely the sons of man are a breath; the sons of men are a lie[a]. In the balances they go up; together they are lighter than a breath.
translation:
  language: zh_hans
  text: 人类不过是一口气；世人不过是虚假[a]。在天平上，他们会上升；他们合在一起，比一口气还轻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按解释译作：“平民不过是一口气，权贵不过是虚假。”希伯来文较直译为“亚当之子”和“人之子”，是两组相近而有别的人类称谓。
    reason: 说明这组希伯来语平行称谓可被理解为社会地位的对照，同时不在正文中消除其词语层面的歧义。
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 这里带有限定兼强调的语气；“不过”自然地突出人本质上的轻微和不足。
- source_word: הֶבֶל
  choice: 一口气
  rationale: 该词可指气息、雾气，引申为短暂、空虚、无分量；“一口气”保留具体意象，并与后面的天平比喻呼应。
- source_word: בְּנֵי אָדָם
  choice: 人的子孙
  rationale: 尽量保留希伯来语“人的众子”的形式，也使它与下一短语的用词差别仍然可见。
- source_word: כָּזָב
  choice: 不可靠
  rationale: 该名词既可指谎言、虚假，也可指不能倚靠之物；在评价人时，“不可靠”比直译“是谎言”更合乎现代汉语，同时保留其倚靠不得的含义。
- source_word: בְּנֵי אִישׁ
  choice: 男子的子孙
  rationale: 保留原文与“人的子孙”相近而不完全相同的平行表达，不在正文中径自解释为社会阶层。
- source_word: בְּמֹאזְנַיִם
  choice: 放在天平上
  rationale: 明确呈现称量的场景，符合现代汉语习惯。
- source_word: לַעֲלוֹת
  choice: 便翘起来
  rationale: 原文直指“上升”；在天平意象中，托盘上升表示毫无分量。“翘起来”自然保留这一画面，而不改写成泛泛的“被称量”。
- source_word: מֵהֶבֶל
  choice: 比一口气还轻
  rationale: 按语境取比较义，并借“轻”把气息意象与天平意象连在一起。
- source_word: יָחַד
  choice: 合在一起
  rationale: 表达所有人作为一个整体受衡量，保留原文的集合意味。
theological_decisions:
- issue: 如何翻译 בְּנֵי אָדָם / בְּנֵי אִישׁ 这一对表达
  choice: 正文保留为“人的子孙／男子的子孙”，不直接划分社会等级。
  alternative: “平民／权贵”或“卑微人／尊贵人”
  rationale: 把两者理解为不同社会阶层很有可能，但原文表面使用的是两个相近的人类称谓。正文保留其词语张力，脚注说明阶层性的解释，避免消除原有歧义。
translation_notes:
  register: 采用现代、庄重而具诗性的普通话。“一口气”“天平”“翘起来”构成连贯的轻重意象；略显陌生的“人的子孙／男子的子孙”是有意保留原文词语差别，并由脚注帮助读者理解。
