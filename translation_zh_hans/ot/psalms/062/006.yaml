  yaml_path: translation/ot/psalms/062/006.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be shaken.
translation:
  language: zh_hans
  text: 唯有他是我的磐石、我的拯救、我的高台；我必不被动摇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必不被挪移。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 唯有
  rationale: 本诗语境中兼具排他与强调作用；“唯有他”自然地保留“只有他”的含义。
- source_word: הוּא
  choice: 他
  rationale: 阳性第三人称单数代词，承接上文所指的上帝；中文保留明确主语。
- source_word: צוּרִי
  choice: 我的磐石
  rationale: 保留上帝赐人稳固与保护的岩石意象；“磐石”在庄重的现代中文诗歌中自然贴切。
- source_word: וִישׁוּעָתִי
  choice: 我的拯救
  rationale: יְשׁוּעָה可指救恩、解救或胜利；“拯救”既保留行动及结果的开放性，也适合此处诗歌性的名词并列。
- source_word: מִשְׂגַּבִּי
  choice: 我的保障
  rationale: 原词指高处的安全堡垒；“保障”以自然现代中文表达安全保护的核心含义，虽弱化了高垒的空间形象。
- source_word: לֹא אֶמּוֹט
  choice: 我必不动摇
  rationale: מוֹט的被动式可表达被摇动、挪移或失去稳固；“不动摇”保留稳定隐喻，并清楚传达信靠中的确信。
theological_decisions:
- issue: 末句所表达的确信程度
  choice: 我必不动摇
  alternative: 我必不被挪动
  rationale: 希伯来文表达诗人因上帝是稳固保护者而有的坚定信靠；此译保留动摇与稳定的隐喻，却不扩展为不受任何伤害的绝对宣称。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语，保留“磐石”的诗性意象和三个第一人称所属语的并列节奏。脚注给出末句较贴近“被移动”意象的另一译法。
