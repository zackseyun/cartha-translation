  yaml_path: translation/ot/psalms/021/006.yaml
  text: For you make him blessings forever[b][a]; you gladden him with joy in your presence.
translation:
  language: zh_hans
  text: 因为你使他永远满有福分[a]；你使他在你面前欢欣喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你永远把福分赐给他”或“你使他永远成为福分”。希伯来语表达简洁，既可能指君王蒙受丰盛的福分，也可能指他自己成为福分。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明前述颂赞的缘由；“因为”自然表达其因果或解释作用。
- source_word: תְשִׁיתֵהוּ בְרָכוֹת
  choice: 你使他……成为福分
  rationale: שׁית 有“安置、使成为”之意，后接复数“福分”。中文无法直接呈现名词复数，译为“使他成为福分”既保留谓语名词结构，也避免生硬的“使他成为诸福”。原文究竟侧重福分临到君王，还是君王自身成为福分，仍以脚注保留。
- source_word: לָעַד
  choice: 永远
  rationale: 准确而自然地表达持续不止的时间。
- source_word: תְּחַדֵּהוּ
  choice: 使他欢欣
  rationale: 该动词的加强词干具有使役意味；“使他欢欣”兼顾使役形式和庄重、自然的中文表达。
- source_word: בְשִׂמְחָה
  choice: 以……喜乐
  rationale: 介词 בְּ 可表示方式或媒介；“以……喜乐”保留“借着喜乐使其欢欣”的表达。
- source_word: אֶת־פָּנֶיךָ
  choice: 你面前
  rationale: “你的面”在此指来到神面前、处于神的临在中；译作“你面前”保留原有意象，也符合现代中文习惯。
theological_decisions:
- issue: “使他成为福分”所表达的福分归属
  choice: 正文译为“使他永远成为福分”，保留君王自身体现或成为福分的可能。
  alternative: “把福分永远赐给他”或“使他永远满有福分”。
  rationale: 希伯来语以复数“福分”作紧凑的谓语成分，既可能强调君王蒙受丰盛福分，也可能表示他本身成为福分或福分的承载者。正文与脚注共同保留这种张力，不将其限定为单纯物质昌盛，也不预设特定弥赛亚解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“成为福分”在中文中自然且具有圣经诗歌色彩；后半句保留使役结构和“你面前”的临在意象。
