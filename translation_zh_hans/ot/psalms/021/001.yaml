id: PSA.21.1
reference: Psalms 21:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְֽהוָ֗ה בְּ/עָזְּ/ךָ֥ יִשְׂמַח מֶ֑לֶךְ וּ֝/בִ/ישׁ֥וּעָתְ/ךָ֗ מַה יגיל מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/001.yaml
  text: O Yahweh[a], in your strength the king rejoices, and in your salvation how greatly he exults!
translation:
  language: zh_hans
  text: 雅威啊，王因你的力量欢喜；因你的拯救[a]，他何等欢欣！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语词也可译作“解救”或“胜利”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威啊
  rationale: 以“雅威”音译上帝的立约之名；原文在此为直接呼告，故加“啊”。
- source_word: בְּעָזְּךָ
  choice: 因你的力量
  rationale: 介词 בְּ 在此可表示喜乐所依据的根基或缘由；“因你的力量”符合现代汉语，也保留君王的喜乐源于雅威能力的意思。
- source_word: יִשְׂמַח
  choice: 欢喜
  rationale: 诗歌中的未完成式可表达当前、持续或概括性的情形；汉语不强加明确时态，以免把原文限定为将来。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 虽然希伯来文没有冠词，语境所指仍是特定的王；汉语用“王”即可自然表达。
- source_word: וּבִישׁוּעָתְךָ
  choice: 因你的拯救
  rationale: יְשׁוּעָה 可指拯救、解救或胜利；正文采用范围较广的“拯救”，介词译作“因”，与上半句形成自然的平行。
- source_word: מַה יגיל מְאֹד
  choice: 他何等欢欣
  rationale: מַה 在此是感叹加强词，מְאֹד 进一步强化程度；“何等欢欣”自然凝练地传达强烈、洋溢的喜乐。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”音译，以保留其作为立约之名的性质，而不以称号替代。
- issue: יִשְׂמַח 与 יגיל 的时态
  choice: 不在汉语中明示现在或将来
  alternative: 必欢喜／必欢欣
  rationale: 诗歌未完成式可有当前、持续、概括或将来的色彩；正文采用无显式时态的汉语表达，保留原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；以分号呈现两个平行分句，并用“何等”保留原文的感叹力度。脚注标记置于其实际解释的“拯救”之后。
