source:
  edition: WLC
  text: תְּשִׁיתֵ֤/מוֹ כְּ/תַנּ֥וּר אֵשׁ֮ לְ/עֵ֪ת פָּ֫נֶ֥י/ךָ יְ֭הוָה בְּ/אַפּ֣/וֹ יְבַלְּעֵ֑/ם וְֽ/תֹאכְלֵ֥/ם אֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/009.yaml
  text: You will make them like a fiery furnace at the time of your presence; Yahweh in his anger will swallow them up[a], and fire will consume them.
translation:
  language: zh_hans
  text: 你显现的时候[a]，必使他们如同燃烧的火炉；雅威必在怒中吞灭他们，烈火必烧尽他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你显现的时候”：直译“在你面容的时候”；也可译作“你临在的时候”。
    reason: 保留פָּנֶיךָ在“面容、临在、显现”之间的语义幅度。
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ
  choice: 必使他们
  rationale: שׁית的基本义是“安置、使成为”。这里后接比喻性表语“如同燃烧的火炉”，译作“使他们……”最自然地表达结果状态。
- source_word: כְּתַנּוּר אֵשׁ
  choice: 如同燃烧的火炉
  rationale: תנור可指炉或烤炉，אֵשׁ突出火焰与毁灭性的热力；此译保留具体意象，同时符合现代汉语表达。
- source_word: לְעֵת פָּנֶיךָ
  choice: 你显现的时候
  rationale: 字面为“在你面容的时候”。פָּנִים在此可表达临在或显现；“你显现的时候”在汉语中自然，并保留其时间含义，其他可能含义收入脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: בְּאַפּוֹ
  choice: 在怒中
  rationale: אַף字面与鼻子有关，在此为表示愤怒的惯用语；“在怒中”简洁而庄重。
- source_word: יְבַלְּעֵם
  choice: 吞灭他们
  rationale: בלע意为“吞下、吞没”。“吞灭”保留生动的吞噬意象，也明确表达毁灭结果。
- source_word: וְתֹאכְלֵם אֵשׁ
  choice: 烈火必烧尽他们
  rationale: אכל用于火时表示吞噬、烧尽。“烧尽”是自然汉语，并与前句“吞灭”有所区别；“烈火”体现此处火的毁灭性。
theological_decisions:
- issue: “你面容的时候”这一拟人化表达
  choice: 你显现的时候
  alternative: 你临在的时候；直译“你面容的时候”
  rationale: 原文既可指面对面的临到，也可强调显现。正文采用自然且不过度技术化的“显现”，脚注保留“临在”及字面表达，避免将其限定为某种特定的末世事件。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用音译以保留原文作为神之专名的功能；“雅威”较接近学界通常重构的读音。
- issue: 第二人称“你”与第三人称“雅威”的关系
  choice: 保留原文人称转换
  alternative: 将两者统一为同一人称
  rationale: 希伯来文先说“你……”，随后明确说“雅威必在他的怒中……”。译文不擅自判定前一个“你”究竟直接指神还是受膏君王，从而保留诗句本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；保留“火炉—吞灭—烈火烧尽”的递进意象，并保留原文由第二人称转为第三人称神名的结构。
