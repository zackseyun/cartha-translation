  text: חַיִּ֤ים שָׁאַ֣ל מִ֭מְּ/ךָ נָתַ֣תָּה לּ֑/וֹ אֹ֥רֶךְ יָ֝מִ֗ים עוֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/004.yaml
  text: He asked life from you[b][a]; you gave it to him—length of days forever and ever.
translation:
  language: zh_hans
  text: 他向你求生命；你赐给他——长久的年日[a]，直到永永远远[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长久的年日”直译为“日子的长度”，意思是长寿。
    reason: lexical_alternative
  - marker: b
    text: “永永远远”既可理解为王室诗歌中对君王长寿和统治长久的强调，也可理解为在弥赛亚身上得到更完全的应验。
    reason: alternative_reading
lexical_decisions:
- source_word: חַיִּים
  choice: 生命
  rationale: 该词虽为复数形式，却常作抽象单数，表示“生命”。后面的“长久的年日”进一步说明其延续时间，因此不在此处直接译作“长寿”。
- source_word: שָׁאַל מִמְּךָ
  choice: 向你求
  rationale: שָׁאַל 表示请求，מִמְּךָ 表示所求的来源；“向你求”符合现代汉语表达，也保留人与上帝之间直接祈求的关系。
- source_word: נָתַתָּה לּוֹ
  choice: 你就赐给他
  rationale: 完成式在诗歌叙述中可自然译为已经发生的行动。“赐给”适合上帝向君王施恩的语境；宾语由上一分句的“生命”和后面的同位说明承接。
- source_word: אֹרֶךְ יָמִים
  choice: 长久的年日
  rationale: 原文直指“日子的长度”，是长寿的惯用说法。“长久的年日”既保留诗歌意象，又比直译“日子的长度”自然，并避免与前面的“生命”完全合并。
- source_word: עוֹלָם וָעֶד
  choice: 直到永永远远
  rationale: 这一叠加强调无尽的持续时间。“永永远远”保留其强化语气；“直到”使它与“长久的年日”自然衔接。
theological_decisions:
- issue: 王所得生命的期限
  choice: 正文照原文译作“直到永永远远”，不限定其含义
  alternative: 将其解释为对君王长寿、长久统治的宫廷夸张，或明确指向弥赛亚永恒的生命与统治
  rationale: 希伯来文直接使用表示无尽持续的强化表达。正文应保留王室诗篇中历史君王与更丰满的弥赛亚应验之间的张力，不在翻译中预先裁定。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。破折号保留后半句对“生命”的展开说明；避免加入原文没有明确表达的因果或解释性措辞。
