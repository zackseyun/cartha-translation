source:
  edition: WLC
  text: תַּאֲוַ֣ת לִ֭בּ/וֹ נָתַ֣תָּה לּ֑/וֹ וַ/אֲרֶ֥שֶׁת שְׂ֝פָתָ֗י/ו בַּל מָנַ֥עְתָּ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/002.yaml
  text: You have given him his heart’s desire[a], and you have not withheld the request of his lips[b]. Selah
translation:
  language: zh_hans
  text: 他心里所愿的，你赐给了他；他嘴唇所求的[a]，你也没有拒绝。细拉[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所求的”所译的希伯来语名词十分罕见，也可译作“愿望”或“祈求”。这里很可能指由嘴唇说出的请求，与上句“心里所愿的”相呼应。
    reason: lexical_alternative
  - marker: b
    text: “细拉”是希伯来语的音译。其确切含义或作用不能确定，可能表示音乐或礼仪上的停顿。
    reason: cultural_note
lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  choice: 他心里所愿的
  rationale: תַּאֲוָה表示愿望、渴望；与לֵב合用，指人内心的愿望。译文既保留“心”的意象，也符合现代汉语表达。
- source_word: נָתַתָּה לּוֹ
  choice: 你赐给了他
  rationale: 动词完成式在本诗的感恩语境中陈述已经成就的行动；“赐给”自然体现上帝是赐予者。
- source_word: וַאֲרֶשֶׁת
  choice: 所求的
  rationale: אֲרֶשֶׁת是罕见名词，通常按上下文理解为说出口的请求或祈求；“所求的”与下一词“嘴唇”结合自然，并与上句内心的愿望形成平行。
- source_word: שְׂפָתָיו
  choice: 他嘴唇
  rationale: 保留希伯来诗歌中“嘴唇”代表言语表达的具体意象。
- source_word: בַּל מָנַעְתָּ
  choice: 你也没有拒绝
  rationale: מנע意为扣留、不予或阻止。汉语中对“所求的”说“没有拒绝”较为自然，同时表达没有留而不赐的意思。
- source_word: סֶּלָה
  choice: 细拉
  rationale: 该词的确切含义和礼仪或音乐功能不确定，因此采用传统音译，避免作出未经证实的解释。
theological_decisions:
- issue: 内心愿望与口中请求的平行关系
  choice: 保留为两个相应而不完全相同的表达：“心里所愿的”与“嘴唇所求的”
  alternative: 把两句都统一译成“愿望”或“祈求”
  rationale: 希伯来诗句可能以第二句说明第一句，但罕见词אֲרֶשֶׁת的含义并非绝对确定；保留内在愿望与言语请求之间的张力，不把二者强行等同。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。调整语序以形成汉语平行句；保留“心”和“嘴唇”的希伯来意象，并音译“细拉”。
