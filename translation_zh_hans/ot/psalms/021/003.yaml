id: PSA.21.3
reference: Psalms 21:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי תְ֭קַדְּמֶ/נּוּ בִּרְכ֣וֹת ט֑וֹב תָּשִׁ֥ית לְ֝/רֹאשׁ֗/וֹ עֲטֶ֣רֶת פָּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/003.yaml
  text: For you meet him with blessings of good[c][b][a]; you set a crown of fine gold on his head.
translation:
  language: zh_hans
  text: '因为你以美好的福分迎接他[a]；

    你把精金[b]的冠冕戴在他头上。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走在他前面”，也可理解为“前来迎接他”。希伯来语动词既可表示迎面相逢，也可表示预先走在某人前面。
    reason: lexical_alternative
  - marker: b
    text: “精金”也可译作“纯金”或“炼净的金子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 这里承接上文，为君王的喜乐和蒙应允说明缘由；“因为”自然保留了希伯来语的解释性连接。
- source_word: תְקַדְּמֶנּוּ
  choice: 迎接他
  rationale: קדם 的加强词干在此可指主动前去迎接，也可含走在前面、预先相迎之意。“迎接他”在现代汉语中自然，并保留上帝主动赐福的意味；其他可能意义列入脚注。
- source_word: בִּרְכוֹת טוֹב
  choice: 美好的福分
  rationale: 保留复数所表达的丰富性，同时用自然汉语呈现“福分与美好之物”的宽泛含义，不限定为物质兴盛或属灵恩惠。
- source_word: תָּשִׁית
  choice: 戴在
  rationale: 原词意为放置、安放；用于冠冕时，汉语说“把冠冕戴在他头上”最为自然，也清楚表达施事者为上帝。
- source_word: לְרֹאשׁוֹ
  choice: 在他头上
  rationale: 介词 לְ 与放置类动词连用，在此自然表示冠冕所在的位置。
- source_word: עֲטֶרֶת
  choice: 冠冕
  rationale: 在君王诗篇的语境中指王冠；“冠冕”庄重且为现代读者熟悉。
- source_word: פָּז
  choice: 精金
  rationale: 指优质、纯净或炼净的黄金；“精金”简洁庄重，也保留其诗歌色彩。
theological_decisions:
- issue: 赐给君王之福的性质
  choice: 译作宽泛的“美好的福分”，不具体限定其内容
  alternative: 具体解释为物质繁荣，或专指盟约性、属灵的福分
  rationale: 希伯来语 בִּרְכוֹת טוֹב 本身涵义宽广，可包括各种美善与恩福；正文不应加入原文未明说的神学分类。
- issue: 上帝迎接君王的行动
  choice: 正文采用“迎接他”，脚注保留“走在他前面”的可能
  alternative: 直接译为“走在他前面”或“预先赐福给他”
  rationale: קדם 可表达相迎，也可表达走在前面或预先行动；“迎接”最合乎汉语表达，而脚注避免抹去其词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以分行和分号呈现希伯来诗句的两部分平行结构；“美好的福分”避免生硬直译，也不将恩福窄化为某一类别。
