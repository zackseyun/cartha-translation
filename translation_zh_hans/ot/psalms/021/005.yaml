id: PSA.21.5
reference: Psalms 21:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גָּד֣וֹל כְּ֭בוֹד/וֹ בִּ/ישׁוּעָתֶ֑/ךָ ה֥וֹד וְ֝/הָדָר תְּשַׁוֶּ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/005.yaml
  text: Great is his glory through your salvation[b][a]; you bestow splendor and majesty on him.
translation:
  language: zh_hans
  text: 他的荣耀因你的拯救[b][a]而大；你将尊荣和威严加在他身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着你的拯救”或“在你的拯救中”；这里的希伯来语介词既可表示凭借的手段，也可表示所处的范围。
    reason: lexical_alternative
  - marker: b
    text: “拯救”在这里也可理解为“解救”；在君王语境中，还可指“胜利”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: 大
  rationale: 作前置的谓语形容词，强调君王的荣耀广大；汉语以“荣耀……而大”自然表达这一谓语关系。
- source_word: כְּבוֹדוֹ
  choice: 他的荣耀
  rationale: כָּבוֹד在君王语境中可指荣耀或尊荣；译作“荣耀”既贴近核心义，也与后半句的近义词组有所区分。
- source_word: בִּישׁוּעָתֶךָ
  choice: 因你的拯救
  rationale: ב可表达原因、凭借的手段或所处范围；正文采用自然的“因”，但以脚注保留“借着／在……中”的可能。יְשׁוּעָה译作“拯救”，并注明王室语境下也可指“解救”或“胜利”。
- source_word: הוֹד
  choice: 尊荣
  rationale: הוֹד表示庄严显赫的荣光或尊贵；“尊荣”适合君王语境，也避免与前句“荣耀”完全重复。
- source_word: וְהָדָר
  choice: 和威严
  rationale: הָדָר可指华美、尊荣或威严；与הוֹד并列时译作“威严”，呈现成对而不完全同义的王者品质。
- source_word: תְּשַׁוֶּה
  choice: 你将……加在
  rationale: שׁוה在此与עַל连用，表达把某物安置或赋予某人；“加在……身上”既保留施加的意象，也符合庄重的现代汉语。
- source_word: עָלָיו
  choice: 他身上
  rationale: 直接体现עַל加第三人称单数后缀的方位与施加关系。
theological_decisions:
- issue: 王室诗篇中יְשׁוּעָה的含义
  choice: 拯救
  alternative: 解救；胜利
  rationale: “拯救”保留该词宽广的词义和神学张力，不将经文仅限于军事获胜；脚注说明在君王语境中“胜利”亦可能是具体所指。
- issue: 介词בְּ所表达的关系
  choice: 因
  alternative: 借着；在……中
  rationale: 语境可理解为上帝的拯救使君王得荣耀，也可能突出手段或范围；正文取自然可读的因果表达，脚注保留希伯来语的多义性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。前半句保留“荣耀……而大”的强调结构；后半句以“尊荣和威严”再现希伯来语近义并列。脚注标记按英文审校层的出现次序置为[b][a]，且与脚注项目一一对应。
