  text: כִּי נָט֣וּ עָלֶ֣י/ךָ רָעָ֑ה חָֽשְׁב֥וּ מְ֝זִמָּ֗ה בַּל יוּכָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/011.yaml
  text: For they intended evil against you[a]; they devised a scheme[b], but they could not carry it out.
translation:
  language: zh_hans
  text: 因为他们图谋加害你[a]，筹划恶计[b]，却不能得逞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“他们向你伸展恶意”；这是希伯来语表达，意思是他们把恶意指向你，企图加害你。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“谋划诡计，却不能实现”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明前述审判临到的原因；“因为”自然保留了解释性连接。
- source_word: נָטוּ עָלֶיךָ רָעָה
  choice: 图谋加害你
  rationale: נָטָה 的字面义是“伸展、转向”，与 רָעָה 和 עַל 连用时表达把恶意指向某人、意图加害；此译法在现代汉语中自然，并保留敌对和蓄意的意味。
- source_word: חָשְׁבוּ
  choice: 筹划
  rationale: חשׁב 在此指有意识地谋划，与上半句形成平行。
- source_word: מְזִמָּה
  choice: 恶计
  rationale: 该词可指计谋或谋划，在此语境中具有明显的敌意；“恶计”简洁体现其负面性质。
- source_word: בַּל יוּכָלוּ
  choice: 却不能得逞
  rationale: בַּל 是诗体否定词，יוּכָלוּ 表示“能够”；“却”呈现谋划与失败之间的反差，“得逞”自然补足语境中隐含的实施结果。
theological_decisions: []
