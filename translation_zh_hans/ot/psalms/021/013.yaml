  text: ר֣וּמָ/ה יְהוָ֣ה בְּ/עֻזֶּ֑/ךָ נָשִׁ֥ירָה וּֽ֝/נְזַמְּרָה גְּבוּרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/013.yaml
  text: Be exalted[a], O Yahweh[b], in your strength! We will sing and make music to your might.
translation:
  language: zh_hans
  text: '雅威啊，愿你在你的力量中显为至高[a]！


    我们要歌唱，奏乐颂扬你的大能。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你凭你的力量兴起！”希伯来语动词可理解为“被高举”或“显为至高”，也可理解为“兴起”并采取行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּמָה
  choice: 愿你……显为至高
  rationale: 该词是 רום 的祈使形式，可表达“居高、被高举、受尊崇”，也可在语境中理解为“兴起”。“显为至高”在现代汉语中自然地表达诗人祈愿雅威在其力量中被彰显为崇高，同时用脚注保留“兴起”的可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的专名性质音译为“雅威”，不以称号“主”取代。
- source_word: בְּעֻזֶּךָ
  choice: 以你的力量
  rationale: 介词 בְּ 在此可表示凭借、方式或范围；“以你的力量”既贴近原文，也符合现代汉语诗歌表达。
- source_word: נָשִׁירָה
  choice: 我们要歌唱
  rationale: 第一人称复数鼓励式可表示决意或共同邀请；“我们要”保留其意愿和决心。
- source_word: וּנְזַמְּרָה
  choice: 奏乐
  rationale: זמר 在敬拜语境中指以歌唱或乐声赞美；与“歌唱”并列译作“奏乐”，保留音乐层面的区别。
- source_word: גְּבוּרָתֶךָ
  choice: 你的大能
  rationale: גְּבוּרָה 表示强大、威力或彰显出来的能力；译作“大能”与前面的“力量”有所区分，并适合赞美诗语境。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。采用现代汉语音译“雅威”，保存其专名性质，避免以称号取代；这不引入任何宗派性解释。
- issue: רומה 是“显为至高”还是“兴起”
  choice: 显为至高
  alternative: 兴起
  rationale: רום 的基本语义与高升、崇高有关，本诗结尾的赞美语境支持“显为至高”；但祈求神采取行动的“兴起”读法也真实存在，故在脚注中保留。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“显为至高”保留诗歌和敬拜语气；“歌唱奏乐，颂扬”使两个希伯来动词在中文中自然并列。主文中的脚注标记与脚注完全对应。
