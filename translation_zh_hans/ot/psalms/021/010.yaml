  text: פִּ֭רְיָ/מוֹ מֵ/אֶ֣רֶץ תְּאַבֵּ֑ד וְ֝/זַרְעָ֗/ם מִ/בְּנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/010.yaml
  text: You will destroy their fruit from the earth[a], and their offspring from among the sons of man.
translation:
  language: zh_hans
  text: 你必从地上除灭他们的果实，也必从世人[a]中除灭他们的后裔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”原文直译为“人之子们”，是泛指全人类的希伯来语表达。
    reason: 说明מִבְּנֵי אָדָם的字面形式及其泛指人类的实际所指。
lexical_decisions:
- source_word: פִּרְיָמוֹ
  choice: 他们的果实
  rationale: פְּרִי本义为“果实、出产”，在此可比喻后代。译作“果实”保留诗歌意象，并与下句“后裔”形成平行而不完全同义的表达。
- source_word: מֵאֶרֶץ
  choice: 从地上
  rationale: אֶרֶץ可指“地、土地、国土”。本诗审判语境较广，“从地上”自然地保留其广泛范围，也符合汉语中“从地上除灭”的惯用搭配。
- source_word: תְּאַבֵּד
  choice: 你必……除灭
  rationale: אבד的Piel形表达使之灭亡、毁灭之意；“除灭”既传达彻底消除的力度，也适合庄重的诗体。该动词统摄两个并列宾语，汉译在第二分句补出“除灭”以求清楚。
- source_word: וְזַרְעָם
  choice: 他们的后裔
  rationale: זֶרַע本义为“种子”，用于人时常指后代。“后裔”清楚表达人的后代，同时与“果实”的生育意象相呼应。
- source_word: מִבְּנֵי אָדָם
  choice: 从世人中
  rationale: בְּנֵי אָדָם是指人类成员的惯用语，直译为“人的众子”在现代汉语中生硬且可能被误解。“世人”准确表达其泛指全人类的功能，并保留诗体庄重感。
theological_decisions:
- issue: בְּנֵי אָדָם中אָדָם的表达
  choice: 世人
  alternative: 人的众子／人类
  rationale: 原短语虽为阳性形式，整体却是泛指人类的希伯来惯用语。汉语“世人”不把所指限制为男性，也不额外引入神学解释；脚注保留其字面结构。
- issue: “果实”与“后裔”的关系
  choice: 保留“果实”的比喻，并将זֶרַע译为“后裔”
  alternative: 两处都明确译成“子孙／后代”
  rationale: 平行结构显示“果实”在语境中很可能也指后代，但原文使用两个不同词语。保留前者的具体意象，可避免把诗意和可能存在的语义张力抹平。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“除灭”传达审判语气；第二分句补出动词，符合汉语平行句表达。脚注标记置于相关整句之后。
