base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/008.yaml
  text: Your hand will find all your enemies[a]; your right hand will find those who hate you.
translation:
  language: zh_hans
  text: 你的手必找到你所有的仇敌[a]；你的右手必找到那些恨你的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “找到”也可译作“触及”或“追上”；在这里，希伯来文可指成功地寻获或抓住仇敌。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: 必找到
  rationale: מצא的基本义是“找到”。在本节争战语境中，也可含成功触及、抓住或追上之意；正文保留希伯来文“找到”的具体意象，并用脚注说明语境含义。
- source_word: יָדְךָ
  choice: 你的手
  rationale: 直译以保留“手”所表达的行动和能力意象，也维持诗句与“右手”的平行结构。
- source_word: לְכָל
  choice: 所有的
  rationale: 自然表达כל的周全范围，指仇敌无一例外。
- source_word: אֹיְבֶיךָ
  choice: 你的仇敌
  rationale: 准确保留名词“仇敌”及第二人称阳性单数所属后缀。
- source_word: יְמִינְךָ
  choice: 你的右手
  rationale: 保留希伯来诗歌中象征力量、行动与得胜的具体意象，并与上半句“你的手”形成递进式平行。
- source_word: שֹׂנְאֶיךָ
  choice: 那些恨你的人
  rationale: 该词是分词形式；译作“那些恨你的人”既符合现代汉语，也保留其动作性，不简单并入“仇敌”一词。
theological_decisions:
- issue: 王室诗篇中“手”和“右手”的具象语言所指向的王权或神圣能力
  choice: 保留“你的手”和“你的右手”
  alternative: 你的力量必追上你所有的仇敌
  rationale: 原文直接对受话者使用身体意象；将其抽象化为“力量”会削弱诗歌的平行、力度及可能保留的王室语境。译文不额外判定此处的受话者是王还是上帝。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。重复“找到”以保存原文的平行结构；“必”表达未完成式在此处的预期或确定将来语气。正文脚注标记与脚注一致。
