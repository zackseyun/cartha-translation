base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/007.yaml
  text: For the king trusts in Yahweh[b][a], and through the steadfast love of the Most High he will not be shaken.
translation:
  language: zh_hans
  text: 因为王倚靠雅威，因着至高者那不变的慈爱，他必不动摇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在至高者那不变的慈爱中”；希伯来语介词既可表示凭借，也可表示所处的范围。“慈爱”也可译为“信实之爱”或“盟约忠诚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的宣告说明根据；“因为”在现代汉语中自然保留这一解释或因果功能。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 带定冠词的名词，指本诗中的君王；汉语诗歌语境用“王”自然明确。
- source_word: בֹּטֵחַ
  choice: 倚靠
  rationale: Qal主动分词表达持续或特有的信赖；“倚靠”既体现信任，也保留依赖之意。
- source_word: בַּיהוָה
  choice: 倚靠雅威
  rationale: 介词标明信赖的对象；将四字神名按其专名音译为“雅威”。
- source_word: וּבְחֶסֶד
  choice: 因着……坚定的慈爱
  rationale: 将介词理解为工具或原因，说明王得以稳固的凭借；חֶסֶד表示持久、忠诚的慈爱，“坚定的慈爱”兼顾其恒久与关系忠诚的内涵。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 该词在此作实体化的神圣称号；“至高者”是准确而自然的现代汉语表达。
- source_word: בַּל
  choice: 必不
  rationale: 诗歌否定词与未完成式连用，表达坚定的否定；“必不”在汉语中自然传达上下文中的确信，而不译成绝对时间性的“永不”。
- source_word: יִמּוֹט
  choice: 动摇
  rationale: 该动词描写被移动、摇撼或踉跄；“动摇”保留稳定性的隐喻，也符合现代汉语习惯。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神专名的性质，不以称号替代。
- issue: בְּחֶסֶד 的介词关系
  choice: 因着至高者坚定的慈爱
  alternative: 在至高者坚定的慈爱中
  rationale: 前缀介词 בְּ 可表示凭借，也可表示所处范围；正文采用更符合本句逻辑的工具或原因义，同时以脚注保留处所或领域义的真实可能。
- issue: חֶסֶד 的关系性内涵
  choice: 坚定的慈爱
  alternative: 信实之爱／盟约忠诚
  rationale: 该词兼含慈爱、忠诚与持守关系的意味；正文避免把“盟约”这一未明说的名词直接加入句中，但脚注说明其可译方向。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号呈现两个彼此关联的分句；“倚靠”“至高者”“动摇”均为普通读者容易理解、同时适合诗篇语体的用词。
