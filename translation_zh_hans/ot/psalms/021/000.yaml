lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐指挥
  rationale: 该词用于诗篇标题，通常指负责音乐演奏或歌唱的人；前缀 לַ־ 在此可自然表达为“交给”。“圣乐指挥”既体现礼仪音乐语境，也比泛称“领袖”明确。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是带有音乐性质的诗篇体裁名称；在中文诗篇标题中译作“诗”简洁、自然，也符合传统用语。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ־ 在诗篇标题中可表示作者、归属、关联或献给对象。“大卫的”保留了一定的语义宽度，避免径直断定为“大卫所作”或“献给大卫”。
theological_decisions:
- issue: 大卫标题语的含义
  choice: 大卫的
  alternative: 大卫所作；献给大卫
  rationale: לְדָוִד 的语义范围较宽。正文采用自然但不完全限定作者身份的表达，并以脚注说明其他可能理解，以免把希伯来文未明确解决的问题单一化。
translation_notes:
  register: 采用现代、庄重而简洁的诗篇标题体。“交给圣乐指挥”明确其礼仪音乐功能；脚注标记紧接“大卫的诗”，与所说明的 לְדָוִד 对应。
