  text: For you will make them turn their back[c][b][a]; with your bowstrings you will aim at their faces.
translation:
  language: zh_hans
  text: 因为你必使他们转身逃跑[a]；你必用你的弓弦瞄准他们的脸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“你必使他们成为肩”。这句希伯来语可能是说使敌人转身败退，也可能是说使他们的肩（背）露出，成为攻击目标。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你必用你的弦，朝着他们的脸预备好（弓箭）。”原文意象十分凝练，没有明说弓或箭。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接上文，为前述确信说明理由；译作“因为”最符合诗句的论述衔接。
- source_word: תְּשִׁיתֵמוֹ שֶׁכֶם
  choice: 你必使他们转背
  rationale: שׁית本义为“安置、使成为”，שֶׁכֶם本义为“肩、背”；合起来是高度凝练的军事意象，可能指使敌人转身败退，也可能指使其肩背成为目标。“使他们转背”在现代汉语中自然，并保留败退的画面。
- source_word: בְּמֵיתָרֶיךָ
  choice: 用你的弓弦
  rationale: מֵיתָר可泛指绳索或弦；在瞄准敌人的军事语境中，最可能指弓弦。
- source_word: תְּכוֹנֵן
  choice: 瞄准
  rationale: 该动词在此有“预备、使就绪”之意；结合弓弦和敌人的脸，译作“瞄准”清楚表达语境中的动作，同时以脚注保留较直译的可能。
- source_word: עַל־פְּנֵיהֶם
  choice: 他们的脸
  rationale: פָּנִים直指“脸、面”；עַל在敌对动作中表示所针对的方向，译文保留原文正面直指敌人的强烈画面。
