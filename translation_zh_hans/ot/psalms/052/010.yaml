source:
  edition: WLC
  text: אוֹדְ/ךָ֣ לְ֭/עוֹלָם כִּ֣י עָשִׂ֑יתָ וַ/אֲקַוֶּ֖ה שִׁמְ/ךָ֥ כִֽי ט֝֗וֹב נֶ֣גֶד חֲסִידֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/010.yaml
  text: I will give thanks to you forever[a], because you have done it; I will wait for your name, for it is good[c][b], in the presence of your faithful ones.
translation:
  language: zh_hans
  text: 我要永远称谢你，因你已经行了这事；我要在你忠信的人面前仰望你的名，因为你的名是美善的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹדְךָ
  choice: 称谢你
  rationale: ידה的使役式在此表示向上帝感谢、赞美；“称谢”兼有感谢与颂赞之意，并保留第二人称宾语。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 自然表达持续无尽的时间，与原文的庄重语气相称。
- source_word: כִּי עָשִׂיתָ
  choice: 因为这是你所做的
  rationale: 第一个כִּי表原因；עשה本义宽泛，原文未明说宾语。“这是你所做的”用中文补足句法，同时不把上帝的作为具体限定为审判或拯救。
- source_word: וַאֲקַוֶּה
  choice: 我要……仰望
  rationale: קוה兼有等候和盼望之意。“仰望”在现代中文中自然表达带着信靠的期待，并与“你的名”搭配顺畅；脚注保留较直译的“等候”。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 保留希伯来语“名”的意象，不将其化约为“声誉”或直接改作“你”，使上帝所启示的身份与品格这一内涵仍可被读出。
- source_word: כִּי טוֹב
  choice: 因为你的名是美善的
  rationale: טוֹב为阳性单数，最近且语法相合的所指是阳性单数的שֵׁם“名”。中文若只说“因为是好的”会生硬且指代不清，因此明确补出“你的名”。
- source_word: נֶגֶד חֲסִידֶיךָ
  choice: 在你忠信的人面前
  rationale: נֶגֶד表示在他人面前或同在中；חסיד指以忠诚、敬虔回应上帝慈爱的人。“忠信的人”避免把该词处理成后来的技术性宗教称号。
theological_decisions:
- issue: חֲסִידֶיךָ所指的盟约群体
  choice: 你忠信的人
  alternative: 你的圣民／敬虔人
  rationale: “忠信的人”既体现忠诚与委身，也不额外引入特定教会传统中的技术含义。
- issue: “美善”的语法所指
  choice: 你的名是美善的
  alternative: 因为这是美善的／因为它是美善的
  rationale: 原文谓语简洁，未重复主语，但阳性单数的טוֹב与最近的阳性单数שִׁמְךָ自然相合。中文明确补出主语可避免含混，同时不增加原文以外的神学判断。
- issue: קוה与“名”的关系
  choice: 仰望你的名
  alternative: 等候你的名／寄望于你的名
  rationale: 原文将קוה直接用于“你的名”，兼具等候和盼望信靠的张力。“仰望”在中文中保留期待与信赖两面；脚注提示其等候义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“称谢”“仰望”“美善”保留诗歌和敬拜语域，但仍为普通现代读者所能理解。分号对应原文两个并列的第一人称承诺。
