translation:
  language: zh_hans
  text: 当以东人多益来，向扫罗报告说：“大卫已经到了亚希米勒家。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫到了亚希米勒家。”希伯来语完成式在转述中既可侧重过去发生的事，也可突出其在报告当时仍有现实关联。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: 来见
  rationale: 介词 בְּ 加 בוא 的不定式构造引出时间背景；结合 לְשָׁאוּל，译作“来见扫罗”自然表达“来到扫罗那里”之意。
- source_word: דּוֹאֵג
  choice: 多益
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: הָאֲדֹמִי
  choice: 以东人
  rationale: 族属称谓，指来自以东或属于以东的人；“以东人”简洁自然。
- source_word: וַיַּגֵּד לְשָׁאוּל
  choice: 向扫罗报告
  rationale: נגד 的 Hiphil 词形在此表示告知、报告；“报告”符合向君王禀报的语境。
- source_word: וַיֹּאמֶר לוֹ
  choice: 向他说
  rationale: 保留希伯来文引出直接引语的表达；中文以“报告说”合并呈现，避免重复累赘。
- source_word: בָּא
  choice: 到了
  rationale: בוא 的 Qal 完成式表示已经发生的到达；“到了”既可自然表达完成动作，也保留其对报告时点的现实关联。
- source_word: דָוִד
  choice: 大卫
  rationale: 采用现代中文圣经的通行人名译法。
- source_word: אֶל בֵּית
  choice: 到……家
  rationale: אֶל 表示趋向，בֵּית 在此最自然地指亚希米勒的住所；中文“到……家”比“到……的房屋”更地道。
- source_word: אֲחִימֶלֶךְ
  choice: 亚希米勒
  rationale: 采用现代中文圣经的通行人名译法。
