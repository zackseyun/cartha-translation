  text: וַ/אֲנִ֤י כְּ/זַ֣יִת רַ֭עֲנָן בְּ/בֵ֣ית אֱלֹהִ֑ים בָּטַ֥חְתִּי בְ/חֶֽסֶד אֱ֝לֹהִ֗ים עוֹלָ֥ם וָ/עֶֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/009.yaml
  text: But as for me[a], I am like a flourishing olive tree in the house of God[b]; I trust in the steadfast love of God forever and ever.
translation:
  language: zh_hans
  text: 至于我，我却像神的殿中一棵青翠茂盛的橄榄树[a]；我倚靠神的慈爱[b]，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “青翠茂盛”也可译作“青翠”或“鲜绿”；希伯来语形容词强调植物鲜活旺盛的生命力，不只是颜色。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来语חֶסֶד，常指神忠贞、信实而恒久的爱；也可译作“忠贞之爱”“信实的爱”或“怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我，我却
  rationale: 连词与独立代词共同突出诗人与上文恶人的对比；此译法在现代汉语中自然地保留强调和转折。
- source_word: כְּזַיִת
  choice: 像……一棵橄榄树
  rationale: 前缀כְּ表示比拟；זַיִת在此意象中指橄榄树，汉语需明确译出“树”。
- source_word: רַעֲנָן
  choice: 青翠茂盛
  rationale: 该词不只表示绿色，也强调鲜活、繁盛的生命力；“青翠茂盛”兼顾色泽与旺盛状态。
- source_word: בְּבֵית אֱלֹהִים
  choice: 在神的殿中
  rationale: 直译为“在神的家中”；诗篇语境中的“神的殿”自然保留敬拜场所的意象，又不额外限定具体建筑。
- source_word: בָּטַחְתִּי
  choice: 我倚靠
  rationale: 完成式在此表达已经确立且持续的信靠状态；汉语现在时“倚靠”能与后面的永久期限自然衔接。
- source_word: בְחֶסֶד
  choice: 神的慈爱
  rationale: חֶסֶד兼有恩慈、忠贞和持久信实的意味。“慈爱”是简洁自然的现代汉语表达，其较丰富的语义由脚注说明。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处明确指以色列的神；“神”是标准而直接的译法。
- source_word: עוֹלָם וָעֶד
  choice: 直到永永远远
  rationale: 这一成对表达强化无尽的持续时间；“直到永永远远”保留其强调语气，并清楚修饰“倚靠”。
theological_decisions:
- issue: 盟约语境中חֶסֶד的译法
  choice: 慈爱
  alternative: 忠贞之爱；信实的爱；怜悯
  rationale: 本节把诗人的信心建立在神持久而忠诚的恩爱上。“慈爱”自然、凝练且有广泛可理解性；脚注补明其忠贞与信实的内涵，避免将该词收窄为单一教义术语。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“神的殿”保留原文“神的家”的圣所意象；分号对应两项彼此关联的自我陈述。脚注标记分别紧随其实际解释的词语，避免英文咨询层中标记位置与脚注内容不对应的问题。
