  yaml_path: translation/ot/psalms/052/005.yaml
  text: You love all words of destruction[a], O deceitful tongue.
translation:
  language: zh_hans
  text: 你爱一切吞噬的话语，诡诈的舌头啊！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: 你爱
  rationale: 这是 אָהַב 的 Qal 完成式第二人称阳性单数。诗中直接指控一种已经形成并持续显明的倾向；现代汉语用“你爱”比机械译成过去时更自然，同时保留“喜爱”的核心意义。
- source_word: כָל דִּבְרֵי
  choice: 一切……的话
  rationale: כָל 接复数构造形式 דִּבְרֵי，表示范围无一遗漏。“一切……的话”既体现总括性，也符合现代汉语表达。
- source_word: בָלַע
  choice: 吞灭人的
  rationale: 该词源于“吞下、吞噬”，在这里描写言语造成毁灭的作用。“吞灭”兼顾吞噬意象和毁灭含义；补出“人”使汉语修饰关系自然，但不限定具体受害者。
- source_word: לְשׁוֹן מִרְמָה
  choice: 诡诈的舌头
  rationale: 原文直译为“诡诈之舌”或“欺骗的舌头”。保留“舌头”这一借代言语的诗歌意象，并以“诡诈的”自然表达 מִרְמָה。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。末尾“啊”标明“诡诈的舌头”是直接呼语；保留“舌头”的希伯来诗歌意象，不将其平化为“言语”。
