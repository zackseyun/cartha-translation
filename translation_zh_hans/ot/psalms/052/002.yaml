  yaml_path: translation/ot/psalms/052/002.yaml
  text: Why do you boast in evil, mighty man? The steadfast love of God endures all day long.
translation:
  language: zh_hans
  text: 勇士啊，你为什么以恶自夸？上帝的慈爱终日长存。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְהַלֵּל בְּרָעָה
  choice: 以恶事自夸
  rationale: 保留介词 בְּ 所表达的凭借、所涉领域之意；“以恶事自夸”既贴近原文，也符合现代汉语表达。
- source_word: הַגִּבּוֹר
  choice: 勇士
  rationale: 该词可指勇士、强者或有权势者；此处用作呼语。“勇士”保留原文带有反讽可能性的称谓，不将其解释性改写为“强人”或“权贵”。
- source_word: חֶסֶד אֵל
  choice: 上帝的慈爱
  rationale: חֶסֶד 可涵盖忠贞之爱、慈爱与信实；“慈爱”是简洁庄重且语境合宜的译法。אֵל 译为“上帝”。
- source_word: כָּל־הַיּוֹם
  choice: 终日
  rationale: 准确表达“整天、一直”的持续意义，并保持诗句凝练。
theological_decisions:
- issue: 末句与前句的逻辑关系及动词省略
  choice: 上帝的慈爱终日长存
  alternative: 上帝的慈爱终日常在／上帝的慈爱终日不息
  rationale: 希伯来文本为名词句，没有明写“长存”这一动词；按语境补出存在和持续意义，但不额外指定它是对恶人的审判、对义人的保护，或其他更具体的神学解释。
- issue: “勇士”的语气
  choice: 保留直译称谓，不明说反讽
  alternative: 你这强人啊／有权势的人啊
  rationale: 上下文可能使该称谓带反讽色彩，但本节词形本身仍是“勇士、强者”；译文保留这种张力，让语境传达语气。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。前句保留质问语气，后句简洁陈述；不添加原文没有的因果连接词，以保存两句之间开放而有张力的关系。
