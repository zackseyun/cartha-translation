  text: You devise destruction[a]; your tongue is like a sharpened razor[c][b], working deceit.
translation:
  language: zh_hans
  text: 你图谋祸害[a]；你的舌头像一把磨利的剃刀，施行诡诈。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸害”原文为复数，可理解为“种种祸害”或“毁灭性的恶事”。
    reason: lexical_alternative
  - marker: b
    text: “施行诡诈”可能描述“你的舌头”，也可能指受斥责的人是施行诡诈者。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: 毁坏
  rationale: 该词为复数，指造成毁灭、祸害的事；中文用集合意义的“毁坏”既自然，又保留其破坏性含义。
- source_word: תַּחְשֹׁב
  choice: 图谋
  rationale: 此处不是一般的“思想”，而是蓄意筹划害人的事；“图谋”准确传达其谋划意味。
- source_word: לְשׁוֹנֶךָ
  choice: 你的舌头
  rationale: 保留身体意象，呈现言语如工具般造成伤害的诗歌比喻。
- source_word: כְתַעַר מְלֻטָּשׁ
  choice: 像磨利的剃刀
  rationale: כְּ标示明喻；מְלֻטָּשׁ在刀刃语境中指经过磨砺而锋利，“磨利”比单纯“擦亮”更能体现危险性。
- source_word: עֹשֵׂה רְמִיָּה
  choice: 施行诡诈
  rationale: 保留分词所表达的持续、主动行为，也维持该短语在句法上可能指舌头或受斥责之人的含混性。
