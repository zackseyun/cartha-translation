  text: 'The righteous will see and fear[b][a], and they will laugh at him:'
translation:
  language: zh_hans
  text: 义人必看见而惧怕[a]；他们必笑他[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“害怕”。希伯来语也可表示敬畏；这里可能兼有目睹上帝审判时的惊惧与敬畏。
    reason: lexical_alternative
  - marker: b
    text: 或译“向他发笑”“因他而笑”或“嘲笑他”。该动词基本义为“笑”，但在这里的语境中含有讥嘲的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְאוּ
  choice: 看见了
  rationale: ראה的Qal未完成式第三人称复数；在诗歌性的连续叙述中指义人目睹前述审判。汉语用“看见了”自然承接已发生在他们眼前的情景。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词作名词使用；“义人”是现代中文圣经语体中自然、庄重且清楚的道德类别称谓。
- source_word: וְיִירָאוּ
  choice: 就会惧怕
  rationale: ירא的Qal未完成式第三人称复数。“惧怕”保留面对上帝审判时既可能指惊惧、也可能含敬畏的语义张力，不收窄为单纯害怕或纯粹敬仰。
- source_word: וְעָלָיו
  choice: 他
  rationale: 介词עַל与שׂחק连用时标明嘲笑的对象；中文“嘲笑他”无需另译介词，表达自然。
- source_word: יִשְׂחָקוּ
  choice: 要嘲笑
  rationale: שׂחק基本义为“笑”，在本处以受审判的恶人为对象，语境明显带讥笑意味；中文“嘲笑”能简洁表达该搭配的实际含义。
theological_decisions:
- issue: 义人目睹审判后“惧怕”的性质
  choice: 惧怕
  alternative: 害怕；敬畏
  rationale: 原文ירא在此可涵盖因审判而生的恐惧与对上帝的敬畏。“惧怕”保留这种张力，不把反应限定为单纯惊恐，也不将其美化为纯粹崇敬。
- issue: 义人对受审判者发笑的性质
  choice: 嘲笑
  alternative: 向他发笑；因他而笑
  rationale: 原文动词本义是“笑”，但与עַל及人物宾语连用，并置于恶人受审判的语境中，具有讥嘲意味。“嘲笑”呈现语境含义，同时脚注保留较贴近字面的译法。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“看见了，就会惧怕”保持诗句动作推进；末尾用“说：”承接下一节引语，虽该词由上下文补出，但符合中文分节呈现习惯。所有脚注标记均置于相关词语之后。
