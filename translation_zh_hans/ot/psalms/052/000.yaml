lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇标题中通常指向负责音乐或礼仪演唱的领袖。“乐长”简洁庄重，也比“合唱团长”更能涵盖其可能的职能；前缀 לַ 可理解为“交给”或“给”。
- source_word: מַשְׂכִּיל
  choice: “玛斯基勒”
  rationale: 这是诗篇标题中的体裁或演唱术语，确切含义不明。采用音译可避免把有争议的含义径直确定为“训诲诗”或“默想诗”。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 在诗篇标题中可表示作者、归属、题献或关联。“大卫的”在中文中较为凝练，并保留一定的关系歧义，不直接断定为大卫所作。
theological_decisions:
- issue: 标题中 לְדָוִד 所暗示的作者身份或关联关系
  choice: 译作“大卫的”
  alternative: “大卫所作”或“为大卫而作”
  rationale: 希伯来文没有无歧义地断定作者身份，因此正文采用较中性的所属表达，并在脚注中说明其他可能。
translation_notes:
  register: 采用现代、庄重而简洁的诗篇标题体。保留不确定的希伯来术语“玛斯基勒”，并以脚注提供可能含义；“大卫的”刻意不把作者身份绝对化。所有脚注标记均紧随其所解释的词语。
