  text: הִנֵּ֤ה הַ/גֶּ֗בֶר לֹ֤א יָשִׂ֥ים אֱלֹהִ֗ים מָֽע֫וּזּ֥/וֹ וַ֭/יִּבְטַח בְּ/רֹ֣ב עָשְׁר֑/וֹ יָ֝עֹ֗ז בְּ/הַוָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/008.yaml
  text: Look[a], this is the man who did not make God his refuge[b], but trusted in the abundance of his riches and sought strength in his destruction.
translation:
  language: zh_hans
  text: 看哪，这就是那不以神为避难所[a]的人！他反倒倚仗自己丰厚的财富，在自己的毁灭中逞强[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “避难所”也可译作“堡垒”或“坚固保障”。
    reason: lexical_alternative
  - marker: b
    text: “毁灭”所译的希伯来语也可指“灾祸”“恶欲”或“毁灭性的图谋”；全句也可理解为“在自己的恶欲中逞强”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是指示性强的感叹词，引出一个供人鉴戒的对象；“看哪”既保留强调语气，也符合庄重的现代汉语。
- source_word: הַגֶּבֶר
  choice: 那……的人
  rationale: גֶּבֶר为阳性单数，指诗中作为反面典型的男子；汉语用“那……的人”自然表达定指关系，不额外强化“勇士”之意。
- source_word: לֹא יָשִׂים אֱלֹהִים מָעוּזוֹ
  choice: 不以神为避难所
  rationale: שׂים在此表示把某位立为、视为某种依靠；מָעוֹז指安全或力量的所在。“以神为避难所”准确而自然。
- source_word: וַיִּבְטַח בְּרֹב עָשְׁרוֹ
  choice: 反倒倚仗自己丰厚的财富
  rationale: 连接词在上下文中形成对比，故译作“反倒”；רֹב עֹשֶׁר兼有财富数量多、程度大的意思，“丰厚的财富”符合现代汉语。
- source_word: יָעֹז
  choice: 壮大自己
  rationale: 该动词表示强盛或变得有力；“壮大自己”保留其主动增强力量的语义，同时不把形式明确解释为单纯的内心感受。
- source_word: בְּהַוָּתוֹ
  choice: 靠自己的毁灭
  rationale: הַוָּה语义范围包括毁灭、灾祸，也可能指恶欲或毁灭性的图谋。正文采用较直接的“毁灭”，并在脚注保存其他可能。
theological_decisions:
- issue: הַגֶּבֶר的性别与代表性
  choice: 那……的人
  alternative: 那男子／那强人
  rationale: 原文为阳性单数，但本节重点是指出这个反面人物，而不是强调其体力或勇武；“人”在汉语中可自然指该男子，又不把“强人”的附加含义写入正文。
- issue: הַוָּה的语义
  choice: 毁灭
  alternative: 灾祸／恶欲／毁灭性的图谋
  rationale: 此词本身具有真实的多义性。正文保留“毁灭”所形成的反讽：他竟从最终带来毁灭之物获取力量；脚注则明确列出其他可成立的理解，不替读者消除张力。
- issue: יָעֹז与בְּהַוָּתוֹ的关系
  choice: 靠自己的毁灭壮大自己
  alternative: 在自己的恶欲中逞强／以毁灭性的图谋为力量
  rationale: 原文把“强盛”与含义困难的הַוָּה直接相连。译文保留这种令人不安的搭配，不把它改写成明确的因果结局。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留诗歌中公开指认、引人注目的语气；后句以“反倒”呈现不以神为依靠与倚仗财富之间的对照。末句刻意保留原文的语义张力，并用脚注说明歧义。
