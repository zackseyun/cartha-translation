base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/006.yaml
  text: But God will also tear you down forever[a]; he will snatch you up and pull you from your tent, and uproot you from the land of the living[c][b]. Selah
translation:
  language: zh_hans
  text: 但上帝也必永远拆毁你；他必攫取你[a]，把你从帐篷中拔出，又把你的根从活人之地拔出。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “攫取你”所译的希伯来语动词较罕见，也可译作“抓住你”或“把你带走”；它表达强行移除。“帐篷”也可泛指“住处”。末句直译为“你的根从活人之地［拔出］”，动词在诗歌中省略；意为从活人之地把你的根拔出。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 但……也
  rationale: 本义含“也、确实”；结合上文语境带出转折性的反衬，同时保留其附加意味。
- source_word: אֵל
  choice: 上帝
  rationale: 此处指以色列的上帝；“上帝”是自然、庄重且通行的现代汉语译法。
- source_word: יִתָּצְךָ
  choice: 拆毁你
  rationale: נתץ常用于拆毁建筑；此处以人作宾语，保留强烈的拆除意象，并与后文“连根拔出”呼应。
- source_word: לָנֶצַח
  choice: 永远
  rationale: 最自然地表达持续、永久的终局性，不把它弱化为单纯的程度副词。
- source_word: יַחְתְּךָ
  choice: 把你抓走
  rationale: 罕见动词 חתה 在此表示强行拿起或攫走；“抓走”自然地体现突然而有力的移除。
- source_word: וְיִסָּחֲךָ
  choice: 从帐篷里拔出你
  rationale: נסח有拉走、拔除之意；“拔出”既保留具体动作，也承接后面的根株意象。
- source_word: מֵאֹהֶל
  choice: 从帐篷里
  rationale: אֹהֶל直译为“帐篷”；正文保留诗歌的具体意象，不先行泛化为“住处”。
- source_word: וְשֵׁרֶשְׁךָ
  choice: 把你连根拔出
  rationale: 希伯来文形式直译是“你的根”，句法高度省略；汉语以“连根拔出你”清楚表达其意，同时保留根的意象。
- source_word: מֵאֶרֶץ חַיִּים
  choice: 从活人之地
  rationale: 这是指现世生命领域、与死亡相对的希伯来语惯用语；此译简洁并保留传统诗歌表达。
- source_word: סֶלָה
  choice: 细拉
  rationale: 确切含义不明，因此按惯例音译，不作推测性解释。
theological_decisions:
- issue: לָנֶצַח所表达的审判性质
  choice: 永远
  alternative: 彻底；一举而永远地
  rationale: 该词最自然表示持久、永久。译文保留神审判的严厉和终局性，但不进一步界定经文没有说明的形而上含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留“拆毁—拔出—连根拔出”的递进意象，并将“细拉”音译。脚注合并说明罕见动词、帐篷的可能引申义及末句的省略结构。
