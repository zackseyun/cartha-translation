  text: You have loved evil more than good[a], falsehood more than speaking righteousness. Selah
translation:
  language: zh_hans
  text: 你爱恶胜过爱善；爱虚假胜过说正直的话。[a]细拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“爱谎言胜过说正确的话。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: 你爱
  rationale: 这是אהב的Qal完成式第二人称阳性单数，直接指斥恶人。汉语诗句用“你爱”即可表达已显明并持续相关的倾向，无须生硬标出完成体。
- source_word: רָּע
  choice: 恶
  rationale: 与“善”相对，语境是道德谴责；“恶”简洁地保留其伦理含义。
- source_word: מִטּוֹב
  choice: 胜过爱善
  rationale: 介词מן在偏好比较中表示“胜过、而不”。补出第二个“爱”，使汉语对比自然清楚，同时保留比较意味。
- source_word: שֶׁקֶר
  choice: 虚假
  rationale: 该名词可指虚假、谎言或欺骗。这里用较宽泛的“虚假”，不把含义限缩为个别谎话，并与后面的正直言语形成对照。
- source_word: מִדַּבֵּר
  choice: 胜过说
  rationale: מן再次引出被轻看的比较项；“胜过说”保留原文平行结构。
- source_word: צֶדֶק
  choice: 正直的话
  rationale: צֶדֶק有公义、正义、正直等含义；在与“虚假”及“说”相连的语境中，“正直的话”最自然地表达诚实、正当的言语，同时不消除其道德分量。
- source_word: סֶלָה
  choice: 细拉
  rationale: 此礼仪或音乐术语的确切含义不明，因此按传统音译，避免作出未经证实的解释。
theological_decisions:
- issue: צֶדֶק在言语语境中的译法
  choice: 正直的话
  alternative: 公义；正义的话；正确的话
  rationale: 原词具有道德和神学分量，但这里直接与“虚假”和“说”构成对照。“正直的话”既符合现代汉语，又保留伦理含义；脚注提示原文名词也可译为“公义”，不把其意义完全限定为诚实言语。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。“爱恶胜过爱善”与下半句保持平行；保留“细拉”作为未释义的传统音译。
