base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/002.yaml
  text: It is like the good oil on the head[a], running down on the beard, on Aaron’s beard[b], which runs down on the collar of his robes.
translation:
  language: zh_hans
  text: 好比那流在头上的上好的油[a]，流到胡须上，流到亚伦的胡须上，又流到他衣袍的领口[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“珍贵的油”。希伯来文更直译为“好油”，这里指品质上好的油。
    reason: lexical_alternative
  - marker: b
    text: 或译“他衣袍的开口（或边缘）”。希伯来文直译涉及衣服的“口”，可能指衣袍上端的开口或领口。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: כַּשֶּׁמֶן
  choice: 好比……油
  rationale: 前缀 כ־表示比较；“好比”自然承接上一节，把弟兄和睦同住比作油。
- source_word: הַטּוֹב
  choice: 上好之
  rationale: טוֹב基本义为“好”；“上好之油”既贴近原文，又比“好油”更符合现代汉语的庄重诗歌语体，并表达油的优良品质。
- source_word: יֹרֵד / שֶׁיֹּרֵד
  choice: 流到……又流到
  rationale: ירד本义为“下降”；用于油时译作“流到”可自然呈现向下流淌的动态。后一次采用“又流到”，保留原文恢复并强化这一动作的效果。
- source_word: הָרֹאשׁ
  choice: 头上
  rationale: 按通常的身体部位含义直译，并保留介词 עַל 所表达的位置。
- source_word: הַזָּקָן / זְקַן אַהֲרֹן
  choice: 胡须上，流到亚伦的胡须上
  rationale: 保留原文对“胡须”的诗意重复，而不压缩成一次提及。
- source_word: פִּי מִדּוֹתָיו
  choice: 他衣袍的领口
  rationale: פֶּה字面为“口”，与衣服连用可指衣服的开口或边缘；此处油由头和胡须向下流，领口是自然的语境理解。מִדּוֹתָיו在此指他的衣服，译为“衣袍”符合亚伦的礼仪场景。
theological_decisions:
- issue: 油的意象是否应明说为祭司膏油
  choice: 只保留亚伦、油及其向下流淌的诗歌意象，不在正文中增添“膏抹”或“祭司膏油”
  alternative: 在译文中明确写成亚伦受膏时所用的膏油
  rationale: 本节明显使人联想到亚伦受膏，但希伯来文本在此采用诗歌比喻，并未直接解释其神学象征；保留意象可避免把合理联想写成原文明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“上好之油”比口语化的“好油”更自然；连续三次使用“流到”及两次出现“胡须”，尽量保留希伯来诗句的层递与重复。所有脚注标记均已置于正文对应位置。
