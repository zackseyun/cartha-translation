  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד הִנֵּ֣ה מַה טּ֭וֹב וּ/מַה נָּעִ֑ים שֶׁ֖בֶת אַחִ֣ים גַּם יָֽחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/001.yaml
  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is when brothers dwell together!
translation:
  language: zh_hans
  text: '大卫的上行之诗[a][b]。


    看哪，弟兄一同居住[c][d]，


    是多么美好，多么可喜！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上行”也可理解为“登阶”。这一标题见于诗篇120—134篇；它可能与上耶路撒冷朝圣有关，但标题本身没有明说具体场景。
    reason: 标题用语及可能背景
  - marker: b
    text: 原文直译为“大卫的”；这里的介词可表示大卫所作、与大卫有关或献给大卫。
    reason: 保留希伯来语介词的歧义
  - marker: c
    text: “弟兄”可指亲兄弟，也可广指同族的人或共同体中的成员。
    reason: 词义范围
  - marker: d
    text: “一同”所对应的希伯来语表达带有强调意味，突出共同居住；也有译本据语境译作“和睦同住”。
    reason: 强调语气及翻译选择
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之诗
  rationale: 保留מַעֲלוֹת“上行、登阶”的字面意象和诗篇120—134篇共有的标题形式，不把其具体历史场景限定为朝圣。
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 这是中文诗篇标题中自然、庄重的表达；脚注说明介词לְ可能表示作者、归属或奉献对象，避免把它单一解释为“大卫所作”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文唤起注意并表达赞叹的诗歌语气。
- source_word: מַה טּוֹב וּמַה נָּעִים
  choice: 是多么美好，多么令人喜悦
  rationale: 用两个并列的感叹结构再现מַה的感叹作用；“令人喜悦”自然表达נָעִים所指的愉悦、可喜。
- source_word: שֶׁבֶת אַחִים
  choice: 弟兄……居住
  rationale: שֶׁבֶת表示居住、共处的状态；אַחִים直译为“弟兄”，既可指亲兄弟，也可扩指同族或共同体成员。
- source_word: גַּם יָחַד
  choice: 一同
  rationale: 直接表达יָחַד“共同、在一起”；גַּם在此加强共同居住的意味。中文正文避免额外加入“和睦”，以免把语境所暗示的和谐直接写成原文没有明说的词。
theological_decisions:
- issue: אַחִים所指的范围
  choice: 正文保留“弟兄”
  alternative: 译作“亲族”“同胞”或“众人”
  rationale: 原词为阳性复数，可指亲兄弟，也可广指以色列同胞或盟约共同体成员。正文不将范围预先限定，较宽的可能性在脚注中说明。
- issue: גַּם יָחַד的语义力度
  choice: 译作“一同”，并以脚注说明其强调意味
  alternative: 译作“和睦同住”或“一同合一地居住”
  rationale: “和睦”符合整节的正面语境，却比יָחַד本身更明确；采用“一同”更贴近词义，同时保留共同居住所呈现的和谐张力。
- issue: לְדָוִד的标题关系
  choice: 正文采用惯用的“大卫的诗”，脚注保留介词关系的多义性
  alternative: 明确译为“大卫所作”或“献给大卫”
  rationale: 标题中的לְ可表示作者、归属、关联或奉献；不应在证据不足时只确定一种关系。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以分行和重复的“多么”保留原文的感叹与平行结构；正文尽量直译“一同”，不把语境中的和谐意味过度显化。
