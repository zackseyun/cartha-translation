source:
  edition: WLC
  text: כְּ/טַל חֶרְמ֗וֹן שֶׁ/יֹּרֵד֮ עַל הַרְרֵ֪י צִ֫יּ֥וֹן כִּ֤י שָׁ֨ם צִוָּ֣ה יְ֭הוָה אֶת הַ/בְּרָכָ֑ה חַ֝יִּ֗ים עַד הָ/עוֹלָֽם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/003.yaml
  text: like the dew of Hermon[a], which falls on the mountains of Zion. For there Yahweh commanded the blessing[b], life forever.
translation:
  language: zh_hans
  text: 如黑门的甘露[a]，降在锡安的群山上。因为雅威在那里命定了福分[b]，就是永远的生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“如那降在锡安群山上的黑门甘露。”
    reason: 希伯来语关系从句的修饰范围可在中文中用不同语序表达；此译法把“降在锡安群山上”整体紧接“黑门甘露”。
  - marker: b
    text: 末句也可译作：“福分，生命直到永远。”
    reason: 希伯来诗句没有现代标点；“生命直到永远”既可看作解释“福分”的同位语，也可较松散地作为并列或独立强调语。
lexical_decisions:
- source_word: כְּ/טַל
  choice: 如……的甘露
  rationale: 前缀 כְּ 表示比拟，טַל 意为“露水、甘露”；“如……的甘露”在现代汉语中自然，并保留诗歌的明喻。
- source_word: חֶרְמוֹן
  choice: 黑门
  rationale: 采用该地名在现代中文圣经语境中通行的音译。
- source_word: שֶׁ/יֹּרֵד
  choice: 降在
  rationale: 动词 ירד 表示“下来、降下”；“甘露降在”既符合汉语搭配，也保留其向下落的动态。
- source_word: עַל הַרְרֵי צִיּוֹן
  choice: 在锡安的群山上
  rationale: הַרְרֵי 是复数附属形式，直指“锡安的诸山”；译作“群山”保留复数而不显生硬。
- source_word: כִּי שָׁם
  choice: 因为……在那里
  rationale: כִּי 在此承接上文并说明缘由；שָׁם 仅作“那里”，不在正文中限定其所指，以保留诗意的含蓄。
- source_word: צִוָּה
  choice: 命定了
  rationale: צוה 基本义为“命令、吩咐”。中文若直说“吩咐福分”较不自然；“命定了福分”保留雅威以权柄发令、使福分确立的语力，同时避免增添“赐下”等原文没有的动词。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: אֶת הַ/בְּרָכָה
  choice: 福分
  rationale: 定冠词所限定的直接宾语；“福分”较“祝福”更适合指所命定的福祉内容。
- source_word: חַיִּים עַד הָ/עוֹלָם
  choice: 就是直到永远的生命
  rationale: 将该短语按同位关系理解为对“福分”的说明；“直到永远”保留 עַד הָעוֹלָם 的持续意味。
theological_decisions:
- issue: 末句与“福分”的关系
  choice: 以“就是”表达同位关系，说明这福分是“直到永远的生命”。
  alternative: 保留为并列或独立的诗句：“福分，生命直到永远。”
  rationale: 希伯来语“福分，生命直到永远”最自然可读作紧凑的同位结构，但标点和句法仍容许较松散的并列理解，因此在脚注中保留另一可能。
- issue: “那里”的所指
  choice: 正文只译作“那里”。
  alternative: 明确译作“在锡安”或“在弟兄和睦同住之处”。
  rationale: 原文没有进一步解释 שָׁם 的指向；不将其明说为某一地点或群体，可保留它与锡安及全诗“和睦同住”主题之间的诗性张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“甘露”“群山”“福分”等词保留诗歌色彩，但避免古奥句式；神名译作“雅威”。
