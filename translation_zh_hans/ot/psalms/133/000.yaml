base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/000.yaml
  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is for brothers to dwell together.
translation:
  language: zh_hans
  text: '上行之歌。大卫的诗[a]。


    看哪，弟兄[b]同住在一起[c]，是多么美好，多么可喜！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”也可理解为“属于大卫”“为大卫而作”或“关于大卫”；希伯来文标题中的这一表达可以表示多种关联。
    reason: 标题中介词结构的语义范围
  - marker: b
    text: “弟兄”可指亲兄弟，也可广指同族的人或共同体成员。
    reason: 词义范围
  - marker: c
    text: 希伯来文在“一起”之前另有加强语气的词，着重表达确实共同居住；也可按含义译作“和睦同住”。
    reason: 原文强调语气及翻译选择
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 沿用清楚而庄重的传统表达；原文可能指上行朝圣时所唱的歌，也可能指一种特定诗歌体裁，因此不在正文中进一步限定。
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 这是诗篇标题中自然、常见的译法；希伯来介词 לְ 所表达的关系可有一定幅度，故以脚注保留其他可能。
- source_word: אַחִים
  choice: 弟兄
  rationale: 直接对应阳性复数名词，可指亲兄弟，也可广指同族或盟约群体的成员；正文保留具体称谓，脚注说明语义范围。
- source_word: שֶׁבֶת
  choice: 同住
  rationale: 该不定式在此表达弟兄共同居住或生活的情景；译作“同住”简洁自然。
- source_word: גַּם יָחַד
  choice: 在一起
  rationale: יַחַד 的核心意义是“一起”；גַּם 在这里加强共同相处的意味。正文用现代汉语自然表达，脚注交代原文的强调语气。
- source_word: טּוֹב ... נָּעִים
  choice: 美好……可喜
  rationale: 保留两个并列评价词的诗意平行；“可喜”表达令人愉悦、可爱悦之意，又避免把第二词简单重复为“美”。
theological_decisions:
- issue: “弟兄”所指的群体范围
  choice: 正文译作“弟兄”，不限定为亲兄弟或以色列全体
  alternative: 弟兄姊妹；同胞；同族的人
  rationale: 原文 אַחִים 是阳性复数，可依语境具有更广的共同体意义。正文保留原有意象，并以脚注说明可能范围，避免将其神学含义缩窄或扩张。
- issue: 共同居住是否明确包含“和睦”
  choice: 译作“同住在一起”
  alternative: 和睦同住；团结共处
  rationale: 原文直接强调共同居住，并未使用明确表示“和睦”或“合一”的名词。和谐含义可由语境自然引出，但不在正文中将其明说，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以“看哪”保留 הִנֵּה 的引人注意功能，以“多么……多么……”再现 מַה...וּמַה 的平行感叹结构。正文避免使用较古旧的“何等地善、何等地美”，也不把“和睦”直接加入正文，因为该含义虽合乎整体语境，却不是 יַחַד 的唯一词汇对应。
