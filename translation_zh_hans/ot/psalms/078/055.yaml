  text: וַ/יְגָ֤רֶשׁ מִ/פְּנֵי/הֶ֨ם גּוֹיִ֗ם וַֽ֭/יַּפִּילֵ/ם בְּ/חֶ֣בֶל נַחֲלָ֑ה וַ/יַּשְׁכֵּ֥ן בְּ֝/אָהֳלֵי/הֶ֗ם שִׁבְטֵ֥י יִשְׂרָאֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/055.yaml
  text: He drove out nations before them and allotted them an inheritance by measuring line[b][a]; he settled the tribes of Israel in their tents.
translation:
  language: zh_hans
  text: 他从他们面前赶出列国，用准绳把土地分给他们作产业[a]，又使以色列各支派住在那些人的帐棚里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用丈量的绳为他们划定产业。”希伯来语的说法兼有分配产业和丈量土地之意。
    reason: lexical_alternative
  - marker: b
    text: “帐棚”也可泛指“住处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: 赶出
  rationale: 该动词表示驱逐、赶走；“赶出”自然地保留了使列国离开那地的力度。
- source_word: מִפְּנֵיהֶם
  choice: 从他们面前
  rationale: 贴近希伯来语空间表达，同时可自然表示上帝为以色列人除去面前的列国。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 此处指居住在迦南的非以色列诸族；“列国”符合诗篇语体，也不加入“外邦人”等额外宗教色彩。
- source_word: וַיַּפִּילֵם
  choice: 把土地分给他们
  rationale: נפל在分配产业的语境中可指份额落定或归给某人。结合下文的“准绳”和“产业”，译出土地分配之意比直译“使之落下”更清楚。
- source_word: בְּחֶבֶל
  choice: 用准绳
  rationale: חבל本义为绳索，此处指丈量、划分土地所用的绳，保留原文具体意象。
- source_word: נַחֲלָה
  choice: 作产业
  rationale: נחלה常指承受而得的土地产业；“产业”在此既自然，也保留土地承受与归属的含义。
- source_word: וַיַּשְׁכֵּן
  choice: 使……住进
  rationale: 该使役形态表示“使居住、安置”；“使……住进”保留上帝主动安置以色列各支派的含义。
- source_word: בְּאָהֳלֵיהֶם
  choice: 住进那些人的帐棚
  rationale: אהל直指帐棚；代词后缀按语境回指被赶出的列国。“那些人”在中文中澄清所指，同时保留帐棚意象。
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列各支派
  rationale: 自然、准确地表达该结构，并符合现代中文圣经语体。
theological_decisions:
- issue: 征服与安置行动的主体
  choice: 各分句都以上帝为行动者；他赶出列国、分配土地并安置以色列支派。
  alternative: 将土地取得或定居主要表述为以色列人的行动。
  rationale: 本节延续诗篇对上帝作为的叙述；保留神圣主体，但不添加经文之外的征服神学解释。
- issue: 帐棚所属对象
  choice: “那些人的帐棚”按语境指被赶出的列国之帐棚。
  alternative: 保留“他们的帐棚”，不明确代词所指。
  rationale: 希伯来语代词形式本身仅为复数第三人称，但语境最自然地回指列国；中文若只写“他们”容易误解为以色列各支派，因此作最低限度的指代澄清。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“准绳”“产业”“支派”保留诗篇和土地分配语境所需的传统词汇；句法保持紧凑，并以“又”连接连续的神圣行动。
