  text: וַ/יַּךְ צָרָ֥י/ו אָח֑וֹר חֶרְפַּ֥ת ע֝וֹלָ֗ם נָ֣תַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/066.yaml
  text: He struck his foes backward[a]; he put everlasting disgrace on them.
translation:
  language: zh_hans
  text: 他击打仇敌的背部[a]；又使他们永远蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他击打仇敌，使他们后退。”希伯来语 אָחוֹר 可作副词，表示“向后”；也可指受击打的部位，即“背部”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: 击打
  rationale: נכה 的连续式未完成时在叙事中表达过去的动作。“击打”自然、庄重，并不额外断定仇敌被杀死。
- source_word: צָרָיו
  choice: 仇敌
  rationale: 指他的敌人或敌对者；“仇敌”简洁，适合诗歌语体，也清楚表达敌对关系。
- source_word: אָחוֹר
  choice: 使他们后退
  rationale: 按副词性用法理解为“向后、后退”。中文若直译为“向后击打”不够自然，因此以“使他们后退”表达击打所造成的后退，同时在脚注保留“击打他们的背部”的另一种语法理解。
- source_word: חֶרְפַּת עוֹלָם
  choice: 永远蒙羞
  rationale: 该结构表示长久持续的羞辱或耻辱。采用自然的现代汉语谓语表达，保留其公开受辱且长久不消的含义；“永远”在此不必强解为形而上的绝对永恒。
- source_word: נָתַן לָמוֹ
  choice: 使他们……蒙
  rationale: נתן 加 ל 可表示把某种处境加在某人身上；结合“羞辱”，译为“使他们蒙羞”比逐字译作“把羞辱给他们”更符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。前半句以结果式“使他们后退”自然呈现希伯来语的方向含义；后半句避免生硬直译，同时保留“长久受辱”的力度。
