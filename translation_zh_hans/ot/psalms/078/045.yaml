lexical_decisions:
- source_word: יְשַׁלַּח
  choice: 放到／放去
  rationale: 此处是 פיעל 形式，表示使灾物出动、临到埃及人；结合两种灾物，中文用“放到……中间”和承前省略的“放去”，自然且保留主动施灾的力度。
- source_word: בָּהֶם
  choice: 到他们中间
  rationale: בְּ 加代词后缀在此主要表达灾物进入他们当中；“到他们中间”比“攻击他们”更直接反映其空间意义。
- source_word: עָרֹב
  choice: 成群的飞虫
  rationale: 该词在出埃及灾祸语境中指成群侵袭的虫类，传统常理解为苍蝇；主文用较宽泛的“飞虫”避免把词义不确定性过度限定，并以脚注说明。
- source_word: וַיֹּאכְלֵם
  choice: 吞噬他们
  rationale: אָכַל 字面为“吃”，在灾祸诗歌中带有强烈的吞吃、耗损意味；“吞噬”保留其鲜明力度。
- source_word: וּצְפַרְדֵּעַ
  choice: 又把青蛙放去
  rationale: 原文单数名词在这里具有集合意义，现代汉语自然地用不标数的“青蛙”；补出承前的“把……放去”，使两个灾祸分句清楚而不改变施事者。
- source_word: וַתַּשְׁחִיתֵם
  choice: 毁坏他们
  rationale: שׁחת 的使役形式表达造成败坏或毁灭；“毁坏”既保留强度，也不把结果过度收窄为死亡。
