  text: בְּ/כָל זֹ֭את חָֽטְאוּ ע֑וֹד וְ/לֹֽא הֶ֝אֱמִ֗ינוּ בְּ/נִפְלְאוֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/032.yaml
  text: In spite of all this[a], they still sinned and did not believe in his wondrous works.
translation:
  language: zh_hans
  text: 尽管这一切，他们仍旧犯罪，也不相信他所行的奇事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不相信他所行的奇事”也可译作“不信靠他所行的奇事”。希伯来语动词可表示“相信”或“信靠”；其后介词所表达的关系，在汉语中也可略作不同处理。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל זֹאת
  choice: 尽管如此
  rationale: 此处介词短语具有让步意味，承接上文神的管教与供应，表达百姓虽经历这一切仍继续犯罪。
- source_word: חָטְאוּ עוֹד
  choice: 仍旧犯罪
  rationale: חָטְאוּ直译为“犯罪”，עוֹד表示行为在此前事件之后仍持续；“仍旧”自然传达其顽固延续。
- source_word: וְ/לֹא הֶאֱמִינוּ
  choice: 不信
  rationale: הֶאֱמִינוּ是אמן的使役形，可表示相信或信靠；此处简洁译作“不信”，保留其语义张力。
- source_word: בְּ/נִפְלְאוֹתָיו
  choice: 他所行的奇事
  rationale: נִפְלְאוֹתָיו指神所施行的非凡奇妙作为；译为“他所行的奇事”既明确是具体行动，也符合现代汉语表达。
theological_decisions:
- issue: 以色列面对神奇妙作为时失败的性质
  choice: 不信他所行的奇事
  alternative: 不信靠他所行的奇事；不相信他所行的奇事
  rationale: 希伯来语动词兼有“相信”和“信靠”的语义，ב所引出的对象关系也可有不同理解。正文采用自然简洁的“不信”，不额外规定这是单纯否认事实还是拒绝信靠，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语言。“尽管如此”表达让步关系；“仍旧犯罪”体现持续性；句式简洁，保留原文并列结构与“相信／信靠”之间的含义空间。
