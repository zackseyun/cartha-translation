source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לֶ/חָסִ֣יל יְבוּלָ֑/ם וִֽ֝/יגִיעָ֗/ם לָ/אַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/046.yaml
  text: He gave their produce to the devouring locust[b][a], and their labor to the swarming locust.
translation:
  language: zh_hans
  text: '他把他们的出产交给吞食庄稼的蝗虫[a]，

    把他们劳碌所得[b]交给成群的蝗虫。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“毛虫”。希伯来语 חָסִיל 泛指吞食庄稼的昆虫；在记述灾祸的经文中，通常理解为某一类蝗虫。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们的劳碌”。希伯来语 יְגִיעַ 既可指劳碌本身，也可指劳碌所得。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 交给
  rationale: נתן的基本意思是“给”；在审判语境中，“交给”自然表达任由蝗虫吞吃的含义，又不强化为原文未明说的“毁灭”。
- source_word: לֶחָסִיל
  choice: 给吞食庄稼的蝗虫
  rationale: חָסִיל指毁坏作物的昆虫，在灾祸经文中通常理解为某类蝗虫。“吞食庄稼的蝗虫”既传达其破坏性，也避免把难以确定的昆虫种类说得过于精确。
- source_word: יְבוּלָם
  choice: 他们的出产
  rationale: יְבוּל指土地的产物或收成；“出产”简洁、自然，也比“庄稼”涵盖面更广。
- source_word: וִיגִיעָם
  choice: 他们劳碌所得
  rationale: יְגִיעַ既可指劳碌本身，也可转指劳碌所得。这里与“出产”平行，语境较可能指劳动成果；脚注保留“劳碌”这一较贴近词面的译法。
- source_word: לָאַרְבֶּה
  choice: 给成群的蝗虫
  rationale: אַרְבֶּה是常用的“蝗虫”一词。“成群的”体现蝗灾的典型景象，并在中文中与前一昆虫名称形成可辨认的平行，但不主张精确的动物分类。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达，以两个“交给”呈现希伯来文的平行结构。昆虫名称用描述性译法区分חָסִיל与אַרְבֶּה，同时借脚注保留物种不确定性；“劳碌所得”按上下文表达转喻意义，并在脚注中保留原词歧义。
