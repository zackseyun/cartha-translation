lexical_decisions:
- source_word: בְּנֵי אֶפְרַיִם
  choice: 以法莲的子孙
  rationale: 保留“某人的众子”这一希伯来语支派与血缘表达，同时符合现代汉语圣经语体。
- source_word: נוֹשְׁקֵי
  choice: 装备兵器
  rationale: 该分词在此表示武装或配备武器；“装备兵器”既体现军备状态，也避免擅自限定具体武器。
- source_word: רוֹמֵי קָשֶׁת
  choice: 拉弓射箭
  rationale: 原文直指用弓发射的人；译作“拉弓射箭”保留动作意象，又比生硬的“投弓者”自然。
- source_word: הָפְכוּ
  choice: 转身退后
  rationale: 既保留动词“转回、转向后方”的形象，也在战斗语境中自然表达退却，而不将其强化为溃败。
- source_word: בְּיוֹם קְרָב
  choice: 在交战之日
  rationale: 直接保留时间短语和庄重语气；“交战”准确表达战斗情境。
