  text: וַ֭/יְבִיאֵ/ם אֶל גְּב֣וּל קָדְשׁ֑/וֹ הַר זֶ֝֗ה קָנְתָ֥ה יְמִינֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/054.yaml
  text: So he brought them to his holy border[d][c][b][a], this mountain that his right hand acquired.
translation:
  language: zh_hans
  text: 于是，他带他们来到他圣洁的疆域[a]，就是他右手所得的这座山[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他圣洁的疆域”直译可作“他圣洁的边界”或“他的神圣疆域”。希伯来词可指边界、疆界或疆域。
    reason: lexical_alternative
  - marker: b
    text: “这座山”也可理解为“这片山地”。上下文可能指上帝赐给以色列的山地，也可能使人联想到锡安。
    reason: alternative_reading
  - marker: c
    text: “所得的”也可译作“取得的”“占有的”或“购得的”；这里指他右手所获取、掌握的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵם
  choice: 于是，他带领他们来到
  rationale: 使役形在这里表示“带来、领到”；“于是”自然承接诗中对上帝作为的叙述。
- source_word: גְּבוּל קָדְשׁוֹ
  choice: 他的圣地
  rationale: גְּבוּל可指边界，也可指边界以内的疆域、地域；此处与“来到”搭配，并由下句“这座山”进一步说明，译作“圣地”较自然，同时以脚注保留“圣界、神圣疆域”等可能。
- source_word: הַר זֶה
  choice: 这座山
  rationale: 保留原文明确的指示表达，不在正文中径直认定为锡安或迦南山地。
- source_word: קָנְתָה
  choice: 所得的
  rationale: קנה可表示取得、获得、购得或拥有；这里描写上帝右手凭能力取得此山，“所得”不引入商业购买的意味，也不把词义限定为创造。
- source_word: יְמִינוֹ
  choice: 他右手
  rationale: 保留希伯来文以“右手”象征能力与得胜的拟人表达。
theological_decisions:
- issue: “这座山”所指为何
  choice: 正文保留“这座山”
  alternative: 明确译作“锡安”或“迦南山地”
  rationale: 本节没有明说所指；上下文可能使人联想到应许之地的山地，也可能预示锡安。为避免消解经文张力，不在正文中指定。
- issue: “圣地”与“这座山”的关系
  choice: 用“就是”表达同位说明
  alternative: 视为两个彼此分开的目的地
  rationale: 诗句后半很自然地对前半的地点作进一步说明；同位结构也避免误解为先后抵达两个不同地点。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“圣地”简洁自然，脚注保留גְּבוּל的空间义歧义；“所得”保留קנה的宽泛语义，并避免过度解释为购买或创造。
