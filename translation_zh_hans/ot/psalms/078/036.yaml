  yaml_path: translation/ot/psalms/078/036.yaml
  text: But they flattered him with their mouth[a], and with their tongue they lied to him.
translation:
  language: zh_hans
  text: 他们却用口向他谄媚[a]，用舌向他说谎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欺骗他”或“引诱他”。希伯来语动词可有这些含义；这里较可能是指用虚假、不真诚的话讨好他。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתּוּהוּ
  choice: 他们却……谄媚他
  rationale: פָּתָה 的 piel 可表示引诱、欺骗或哄骗；本节与“说谎”平行，重点在以不真诚的话讨好上帝。“谄媚”既保留言语操弄的意味，也不暗示他们实际骗过了上帝。וַ 在语境中译作“却”，突出他们表面回转与内心不忠之间的反差。
- source_word: בְּפִיהֶם
  choice: 用口
  rationale: בְּ 表示手段；“口”保留希伯来诗歌的具体意象，并与下句“舌”形成平行。中文无需补出复数领属词，仍可自然表达“他们用自己的口”。
- source_word: וּבִלְשׁוֹנָם
  choice: 用舌
  rationale: לָשׁוֹן 本义为“舌”，在此转指言语。直译“舌”可保存与“口”的诗性平行。
- source_word: יְכַזְּבוּ
  choice: 说谎
  rationale: כזב 的 piel 表示说谎或虚假行事；“说谎”直接、自然，并清楚表达道德指控。
- source_word: לוֹ
  choice: 向他
  rationale: לְ 加代词后缀在此最自然地标示虚假话语所针对的对象，即他们向上帝说谎。
theological_decisions:
- issue: 本节是否表示人实际欺骗了上帝
  choice: 译作“谄媚他”，描写他们以虚假讨好的话对待上帝，而不断言上帝实际受骗。
  alternative: 可译作“欺骗他”或“哄骗他”，更直接保留 פתה 的其他词义及其张力。
  rationale: 上下文指向以色列虚假的回转和不忠；“谄媚”符合与“说谎”的诗歌平行，也避免把词义窄化成成功蒙骗上帝。脚注保留原词可能的其他含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“用口……用舌……”保留原文的身体意象和平行结构；“向他说谎”比“对他说谎”略显书面，但在诗歌语体中自然，并清楚对应间接宾语。
