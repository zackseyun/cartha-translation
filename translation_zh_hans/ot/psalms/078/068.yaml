  yaml_path: translation/ot/psalms/078/068.yaml
  text: But he chose the tribe of Judah[b][a], Mount Zion which he loved.
translation:
  language: zh_hans
  text: 他却拣选了犹大支派和他所爱的锡安山。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只用一个“拣选”，统摄两个宾语：“犹大支派”和“他所爱的锡安山”。
    reason: 说明希伯来文以一个动词统摄两个直接宾语，并澄清“他所爱的”修饰“锡安山”。
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: 他却拣选了
  rationale: 动词意为“选择、拣选”；承接上文弃绝约瑟帐棚、不拣选以法莲支派的叙述，此处用“却”自然表达语境中的转折。
- source_word: שֵׁבֶט יְהוּדָה
  choice: 犹大支派
  rationale: שֵׁבֶט 在以色列宗族语境中指“支派”，该组合自然译为“犹大支派”。
- source_word: הַר צִיּוֹן
  choice: 锡安山
  rationale: 采用现代中文圣经语境中通行、清楚的地名表达。
- source_word: אֲשֶׁר אָהֵב
  choice: 他所爱的
  rationale: 关系从句紧接“锡安山”，最自然地修饰锡安山；不扩展经文本身未明说的神学含义。
- source_word: אֶת ... אֶת
  choice: 也拣选了
  rationale: 希伯来文用两个直接宾语标记列出“犹大支派”和“锡安山”，共用一个动词。中文补出第二个“拣选了”可避免把两者误读为同位关系，同时脚注保留原文单一动词结构。
theological_decisions:
- issue: 上帝拣选犹大与锡安之间的句法关系
  choice: 将犹大支派和锡安山理解为“拣选”的两个并列宾语
  alternative: 把“锡安山”视为“犹大支派”的同位说明
  rationale: 两个名词短语前均有直接宾语标记 אֶת，较自然地表明二者都是同一动词的宾语；译文不进一步发挥“拣选”的教义内涵。
- issue: 关系从句“他所爱的”的所指
  choice: 修饰紧邻的“锡安山”
  alternative: 广义地同时涵盖犹大支派与锡安山
  rationale: 希伯来文的单数关系结构紧随“锡安山”，直接修饰该名词短语最为自然。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“拣选”保留诗篇中神主动选择的语气；以“也拣选了”明确两个宾语，避免中文逗号造成同位误读。
