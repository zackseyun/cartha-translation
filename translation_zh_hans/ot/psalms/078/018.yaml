  text: וַ/יְנַסּוּ אֵ֥ל בִּ/לְבָבָ֑/ם לִֽ/שְׁאָל אֹ֥כֶל לְ/נַפְשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/018.yaml
  text: They tested God in their heart by asking for food for themselves[a][b].
translation:
  language: zh_hans
  text: 他们在心里试探上帝，为自己求食物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己”原文为 נֶפֶשׁ（nephesh），可指“生命”“自身”“欲望”或“食欲”；这里因所求的是食物，也可译作“为满足自己的食欲”。
    reason: 说明原文词义范围及语境中的另一种译法。
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: 试探
  rationale: נסה 的皮勒词干在此指“试验、考验、试探”。现代汉语中“试探上帝”自然地表达他们以要求来挑战、验证上帝，并不必然表示引诱上帝犯罪。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל 在这里是常见的神圣称号，译作“上帝”清楚、自然。
- source_word: בִּלְבָבָם
  choice: 心里
  rationale: 希伯来语为单数名词加第三人称复数后缀，直译是“在他们的心中”。“他们心里”既符合现代汉语习惯，也保留内在意念的含义。
- source_word: לִשְׁאָל
  choice: 索要
  rationale: ל 加不定词在此说明他们试探上帝的方式。“索要”比单纯的“求”更能体现上下文中带着挑战意味的要求，同时避免增添原文没有明说的对象代词。
- source_word: אֹכֶל
  choice: 食物
  rationale: אֹכֶל 是泛指食物的词，不宜缩窄为“饼”或“粮食”。
- source_word: לְנַפְשָׁם
  choice: 为自己
  rationale: נֶפֶשׁ 可指生命、自身、欲望或食欲；这里与食物连用，带有满足自身食欲的意味。正文采用自然且较少解释性的“为自己”，并用脚注保留“食欲/欲望”的语义可能。
theological_decisions:
- issue: 食物语境中 נֶפֶשׁ 的译法
  choice: 为自己
  alternative: 为满足自己的食欲；照自己的欲望
  rationale: 此处 נֶפֶשׁ 很可能指人的食欲或欲求，但正文译作“为自己”更贴近希伯来语表达的开放性，不把它限定为抽象的“灵魂”，也不在正文中过度明确其道德评价；脚注说明与食欲有关的语境义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“心里”表达内在意念；“索要”体现其要求带有试探意味。正文保持简洁，脚注保留 נֶפֶשׁ 在“自身”与“食欲”之间的语义张力。
