  text: 他们出言反对上帝，说[a]：“上帝能在旷野摆设筵席吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们谈论上帝。”希伯来语这一结构也可作较中性的理解；后文仍以“说”引出直接引语。但这里的上下文更支持“反对”的意思，突出了以色列人对上帝的抱怨和质疑。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: 他们出言
  rationale: 保留叙事性动词“说话”的基本意义，同时与后面的“说”自然区分，避免汉语中生硬重复。
- source_word: בֵּאלֹהִים
  choice: 反对上帝
  rationale: דבר 与介词 ב 的组合本可较中性地表示谈及某人，但本诗叙述以色列人的悖逆，随后问题又带有质疑语气，因此正文采用敌对性的“反对”。
- source_word: אָמְרוּ
  choice: 说
  rationale: 明确保留希伯来文第二个引述动词，引出直接引语。
- source_word: הֲיוּכַל
  choice: 岂能
  rationale: 表达能力疑问，也以自然庄重的汉语传达此处带挑战和不信色彩的反问语气。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是对神的称呼，与前面的 אֱלֹהִים 对应；不另译为“全能者”，以免过度解释其力量色彩。
- source_word: לַעֲרֹךְ
  choice: 摆设
  rationale: ערך 与“桌席”搭配时表示摆好、备办；“摆设筵席”既保留具体图像，也自然表达供应食物之意。
- source_word: שֻׁלְחָן
  choice: 筵席
  rationale: 字面为“桌子”，在“摆设桌子”的惯用表达中转喻备办饮食；现代汉语“摆设筵席”保留席面图像，并比“摆一张桌子”更准确传达语境中的食物供应。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: 指以色列漂流之地，不限于沙漠地貌；“旷野”符合现代中文圣经语域且清楚自然。
theological_decisions:
- issue: 以色列人谈论上帝时的语气
  choice: 正文译作“反对上帝”
  alternative: “谈论上帝”或“对上帝说”
  rationale: 介词结构本身容许较中性的理解，但全诗上下文把这番话置于悖逆、试探和不信之中，因此敌对义更符合语境；脚注仍保留原文结构可能具有的中性理解。
- issue: 质问是否为带不信色彩的反问
  choice: 译作“岂能……吗”
  alternative: “能不能……”或“能够……吗”
  rationale: 原文形式上询问能力，语境则显示这不是单纯求问，而是对上帝供应能力的挑战；“岂能”传达该语用色彩，却不把问题改写成明确陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出言反对”与“说”保留原文两段式引语公式；“摆设筵席”保持具体意象，并自然传达旷野中供应饮食的含义。
