  text: וְ/אַ֤ף אֱלֹהִ֨ים עָ֘לָ֤ה בָ/הֶ֗ם וַֽ֭/יַּהֲרֹג בְּ/מִשְׁמַנֵּי/הֶ֑ם וּ/בַחוּרֵ֖י יִשְׂרָאֵ֣ל הִכְרִֽיעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/031.yaml
  text: Then the anger of God rose against them[a], and he killed the stoutest among them; he struck down the young men of Israel.
translation:
  language: zh_hans
  text: 那时，上帝的怒气向他们发作；他杀了他们中肥壮的人[a]，击倒了以色列的青年人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他们中肥胖的人”，可能指他们中肥壮或强健的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף אֱלֹהִים
  choice: 那时，上帝的怒气
  rationale: אַף在这里是“怒气”，不是字面的“鼻子”；“那时”体现叙事连接词וְ所表达的推进。
- source_word: עָלָה בָהֶם
  choice: 向他们升起
  rationale: 保留“怒气升起”的希伯来意象，并以“向他们”表达בָהֶם在敌对语境中的指向。
- source_word: וַיַּהֲרֹג
  choice: 他杀了
  rationale: 直接、清楚地表达הרג，不弱化审判行动。
- source_word: בְּמִשְׁמַנֵּיהֶם
  choice: 他们中肥壮的人
  rationale: 该词源于“肥、丰腴”，可指体格健壮或养尊处优者；“肥壮的人”较贴近原文，又不武断限定为“最强壮的人”。
- source_word: וּבַחוּרֵי יִשְׂרָאֵל
  choice: 以色列的青年
  rationale: בָּחוּר通常指正值壮年的年轻男子；“青年”自然简洁，并保留其年龄含义。
- source_word: הִכְרִיעַ
  choice: 击倒了
  rationale: 该使役形式表达使人屈膝、倒下；“击倒”符合死亡审判的上下文，也与前句构成诗歌平行。
theological_decisions:
- issue: 以拟人方式描述上帝的愤怒
  choice: 上帝的怒气向他们升起
  alternative: 上帝向他们发怒
  rationale: 原文把“怒气”描绘为升起；正文保留这一形象，不把它消解成一般性的意译。
- issue: “肥壮的人”的具体所指
  choice: 保留为“肥壮的人”并加注
  alternative: 他们中最强壮的人
  rationale: 原词确与“肥”有关，但在此可能表示健壮、精壮或居于优越地位的人；不在正文中将其含义过度限定为单纯的力量。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；保留“怒气升起”的原文意象和两个审判动词之间的平行结构。
