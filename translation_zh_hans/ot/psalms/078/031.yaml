  source_fidelity: “向他们升起”在现代汉语中搭配不自然，也没有清楚表达希伯来语 עָלָה בָהֶם 的敌对指向。改为“向他们发作”，既保留怒气兴起/临到的动态，亦明确其针对性。“他们中肥壮的人”可保留原词的‘肥/丰腴’语义及其所指的不确定性。
  naturalness: 建议以“那时，上帝的怒气向他们发作”替换“向他们升起”。后者略显直译，且“怒气向人升起”不合现代标准汉语惯用表达。其余行文庄重、简洁，适合诗歌语体。
  terminology: “上帝”“以色列”译名一致且恰当。“青年”可指年轻男子，但“青年人”更明确对应 בַּחוּרֵי（正值壮年的男子），避免泛指青年群体。脚注不宜加入“地位优越的人”：该解释在此语境中依据不足，容易将词义引向社会身分；宜限于“肥胖、肥壮或强健的人”。
  issues:
