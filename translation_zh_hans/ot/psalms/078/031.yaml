  rationale: 修订“怒气”的中文表达，使其自然地传达原文中上帝怒气兴起、针对他们而发的审判行动；保留“肥壮的人”的字面关联及必要的语义开放性，并收紧脚注中缺乏充分语境支持的社会地位解释。将“青年”改为“青年人”，以较准确地对应原文所指的年轻男子。
