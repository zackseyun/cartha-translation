source:
  edition: WLC
  text: לְמַ֤עַן יֵדְע֨וּ דּ֣וֹר אַ֭חֲרוֹן בָּנִ֣ים יִוָּלֵ֑דוּ יָ֝קֻ֗מוּ וִֽ/יסַפְּר֥וּ לִ/בְנֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/006.yaml
  text: so that a later generation might know[a], children yet to be born, and might arise and tell their children,
translation:
  language: zh_hans
  text: 好让后来的世代——将要出生的儿女——得以知道；他们要兴起，向自己的儿女述说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: 好让
  rationale: 引出目的或预期结果；“好让”自然地保留了希伯来语的目的含义。
- source_word: יֵדְעוּ
  choice: 能够知道
  rationale: 未完成式用于לְמַעַן之后，表达预期的目的或结果；“能够知道”符合现代汉语表达。
- source_word: דּוֹר אַחֲרוֹן
  choice: 后来的世代
  rationale: 指随后或将来的世代，并不必然指末世意义上的“最后一代”。
- source_word: בָּנִים יִוָּלֵדוּ
  choice: 将要出生的儿女
  rationale: 保留被动的未来指向；בָּנִים虽为阳性复数，但此处泛指后代，译作“儿女”较准确自然。
- source_word: יָקֻמוּ
  choice: 起来
  rationale: קום在这里表示兴起并采取行动，既保留原文形象，也适合代际传承的语境。
- source_word: וִיסַפְּרוּ
  choice: 讲给……听
  rationale: ספר在此指把所知之事口头传给下一代；“讲给……听”是自然清楚的现代汉语。
- source_word: לִבְנֵיהֶם
  choice: 给自己的儿女
  rationale: 此处阳性复数泛指他们的后代；“自己的儿女”清楚表达亲属关系和代际延续。
theological_decisions:
- issue: בָּנִים / לִבְנֵיהֶם 的性别形式与所指范围
  choice: 译作“儿女／自己的儿女”，按语境泛指后代
  alternative: 译作“儿子／他们的儿子”
  rationale: 希伯来语阳性复数可代表性地泛指子女；本节关注真理在世代之间的传递，并没有把范围限定为男性后代。
- issue: דּוֹר אַחֲרוֹן 是否具有末世含义
  choice: 后来的世代
  alternative: 最后的世代
  rationale: 原短语在本段语境中指后续、未来的世代；不额外加入末世论限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“就是将要出生的儿女”保留“后来的世代”与“将要出生的儿女”之间的同位关系；分号使后半句的代际行动链条更清楚。
