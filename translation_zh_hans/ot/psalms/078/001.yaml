lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: 训诲诗
  rationale: 这是诗篇标题中的专门术语，确切含义未定，可能指具有教导性、默想性或需技巧创作的诗。正文采用自然且符合本篇内容的“训诲诗”，并以脚注保留其不确定性。
- source_word: לְאָסָף
  choice: 亚萨的
  rationale: 标题中的介词 לְ 可表示作者、归属、关联或用途；“亚萨的”在现代汉语中简洁自然，同时不过度限定具体关系。
- source_word: הַאֲזִינָה
  choice: 要留心听
  rationale: 该命令式不只是要求听见，而是要求专心聆听；“留心听”准确表达其语用力度，又符合现代汉语。
- source_word: עַמִּי
  choice: 我的子民啊
  rationale: 保留第一人称所属关系；“子民”适合诗篇庄重语体，句末“啊”自然标示呼语。
- source_word: תּוֹרָתִי
  choice: 我的教导
  rationale: תּוֹרָה 在此指诗人将要传授的训诲，不宜狭义理解为成文律法；“教导”贴合智慧诗与历史训诲的语境。
- source_word: הַטּוּ אָזְנְכֶם
  choice: 你们要侧耳听
  rationale: 保留“使耳朵倾向”的具体听觉意象，也传达专注聆听的意思；补出“你们”以自然反映希伯来语复数命令式。
- source_word: לְאִמְרֵי פִי
  choice: 我口中的话
  rationale: 保留“口”与“耳”的诗性对应；“口中的话”是自然、清楚而庄重的现代汉语表达。
