  text: He turned their rivers to blood[a], and their flowing streams[c][b], so that they could not drink.
translation:
  language: zh_hans
  text: 他使他们的河流[a]变成血；他们也不能喝流动的水[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河流”或译“尼罗河的水道”；这个希伯来词在埃及背景中常指尼罗河或其支流、沟渠。
    reason: lexical_alternative
  - marker: b
    text: “流动的水”或译“溪流”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: 使……变成
  rationale: הפך表示使事物转变为另一状态；“使……变成”在现代汉语中自然，并清楚保留结果含义。
- source_word: לְדָם
  choice: 变成血
  rationale: 介词לְ标示变化后的状态；与“使……变成”搭配，准确表达水成为血。
- source_word: יְאֹרֵיהֶם
  choice: 他们的河道
  rationale: יְאֹר在埃及语境中常指尼罗河及其水道。译作“河道”既符合复数形式和当地水系背景，也避免把所指限定得过窄。
- source_word: וְנֹזְלֵיהֶם
  choice: 他们流动的水
  rationale: 该词源于“流动”之义，此处指流动的水体。“流动的水”保留词根意象，并与前面的“河道”有所区别。
- source_word: בַּל יִשְׁתָּיוּן
  choice: 他们也不能喝
  rationale: בַּל是诗歌性的否定词；与未完成式动词连用，在此表达这些水已无法饮用。“不能喝”简洁自然，并保留原文复数主体。
