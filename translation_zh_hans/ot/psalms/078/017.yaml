base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/017.yaml
  text: Yet they continued to sin against him[a], rebelling against the Most High in the dry land.
translation:
  language: zh_hans
  text: 然而，他们仍不断犯罪得罪他，在干旱之地悖逆至高者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在荒漠中”或“在焦旱之地”。希伯来语特指干燥、贫瘠的地方。
    reason: 说明בַּצִּיָּה的词义范围，并指出它比一般的“旷野”更突出干旱特征。
lexical_decisions:
- source_word: וַיּוֹסִיפוּ עוֹד
  choice: 还继续
  rationale: הוסיף与不定式连用表示继续或再次做某事，עוֹד进一步强化延续或重复之意。“还继续”保留两者叠加的语气，同时符合现代汉语表达。
- source_word: לַחֲטֹא לוֹ
  choice: 得罪他
  rationale: חטא与ל连用在此表示向某人犯罪、得罪某人；代词按上下文指上帝。“得罪他”自然简明，也保留关系性的冒犯含义。
- source_word: לַמְרוֹת
  choice: 悖逆
  rationale: מרה表示反叛、不服从。“悖逆”准确传达对上帝的公然抗拒，并保持诗篇所需的庄重语体。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 这是上帝的称号，意为“至高者”；采用现代中文圣经语境中清楚、庄重且不带宗派限定的对应词。
- source_word: בַּצִּיָּה
  choice: 在干旱之地
  rationale: צִיָּה特指干燥、焦旱之地，不只是泛称“旷野”。“干旱之地”保留其明确的干燥意象，也符合本诗的旷野背景。
theological_decisions:
- issue: 神圣称号עֶלְיוֹן的译法
  choice: 至高者
  alternative: 至高的上帝
  rationale: 原文使用称号而非带“上帝”的解释性短语；“至高者”既保留称号形式和神学分量，也避免增加原文没有的成分。
- issue: לוֹ所指对象
  choice: 译为“他”，按上下文指上帝
  alternative: 明译为“上帝”
  rationale: 原文使用第三人称代词，上文语境足以确定所指。保留“他”更贴近原文，也避免不必要地将代词改写为专名。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌叙述语体。“然而”承接上下文的反差，“还继续”保留原文双重延续语气；脚注标记紧接“至高者”，但脚注内容解释整个位于句末的地点短语“在干旱之地”。
