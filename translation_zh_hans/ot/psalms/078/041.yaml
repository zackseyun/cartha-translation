  yaml_path: translation/ot/psalms/078/041.yaml
  text: Again they turned back and tested God[a], and they limited the Holy One of Israel.
translation:
  language: zh_hans
  text: 他们又回头试探上帝，冒犯了[a]以色列的圣者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冒犯了”所译的希伯来语动词十分罕见，含义难定；或译“限制了”，也可能有“给……划定界限”“在……身上作记号”或“惹怒了”的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: 又回头
  rationale: שׁוּב在这里带出重复、重蹈旧辙的意思；“又回头”既保留动作意象，也符合诗篇所述反复悖逆的语境。
- source_word: וַיְנַסּוּ
  choice: 试探
  rationale: נסה意为“试验、试探”；这里指人因不信而挑战上帝，现代中文圣经语体中“试探”准确而自然。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל在本节用作以色列之神的称谓；译作“上帝”清楚自然，不额外加入原文在此处未明确表达的“大能”含义。
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 保留这一重要的圣经称号，兼顾上帝的圣洁及他与以色列的关系。
- source_word: הִתְווּ
  choice: 触犯了
  rationale: 此动词罕见，词义难定。按与“试探上帝”的诗歌平行关系，“触犯”可表达以色列对上帝的冒犯，同时避免把不确定的“限制”释义直接写入正文。
theological_decisions:
- issue: 罕见动词הִתְווּ的译法
  choice: 触犯了
  alternative: 限制了；给……划定界限；在……身上作记号；惹怒了
  rationale: 原词的确切含义存在争议。正文采用符合上下文和平行结构的“触犯”，但不把经文解释成受造者在本体意义上限制上帝；传统的“限制”及较贴近字面构形的其他可能译法在脚注中保留，以呈现原文的真实不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“又回头”保留反复转回旧路的诗歌意象；“以色列的圣者”保留固定称号。脚注标记紧接有争议的动词所在分句。
