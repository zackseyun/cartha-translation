source:
  edition: WLC
  text: לֹ֣א שָׁ֭מְרוּ בְּרִ֣ית אֱלֹהִ֑ים וּ֝/בְ/תוֹרָת֗/וֹ מֵאֲנ֥וּ לָ/לֶֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/010.yaml
  text: They did not keep the covenant of God[a], and they refused to walk in his law.
translation:
  language: zh_hans
  text: 他们不遵守上帝的约，也不肯按他的律法[a]行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“教导”。希伯来语“妥拉”可指上帝的律法、教导或训诲。
    reason: 保留תּוֹרָה的词义广度，避免把它仅限于法规。
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: 遵守
  rationale: שׁמר与“约”连用时表示持守、谨守并履行；“遵守”是现代汉语中自然明确的搭配，也保留了顺服之意。
- source_word: בְּרִית אֱלֹהִים
  choice: 上帝的约
  rationale: 该结构表示由上帝所立、属于上帝的约；“上帝的约”简洁自然，并符合诗篇庄重的语体。
- source_word: וּבְתוֹרָתוֹ
  choice: 按他的律法
  rationale: תּוֹרָה既可指律法，也可指教导、训诲。本节将其与守约并列，“律法”较能体现其规范性；介词ב所表达的行为准则或范围，以“按”自然呈现。
- source_word: מֵאֲנוּ
  choice: 不肯
  rationale: מאן表示拒绝或不愿意；“不肯”既准确表达有意拒绝，也比生硬的直译更符合现代汉语。
- source_word: לָלֶכֶת
  choice: 行事
  rationale: הלך字面义为“行走”，在道德与盟约语境中喻指生活行为。“行事”在现代汉语中自然传达这一比喻含义，并与“按……律法”顺畅搭配。
- source_word: לֹא
  choice: 不
  rationale: 以汉语普通否定词直接表达原文的明确否定。
theological_decisions:
- issue: 盟约语境中תּוֹרָה的译法
  choice: 律法
  alternative: 教导／训诲
  rationale: 本节把遵守上帝的约与按他的תּוֹרָה行事并列，因此“律法”较好保留盟约义务和规范力量；但该词义域比成文法规更广，故以脚注保留“教导”这一真实可能。
- issue: הלך的行为隐喻
  choice: 行事
  alternative: 行走
  rationale: 原文以“行走”比喻人的生活方式。汉语直译“在律法中行走”不自然，“按……行事”可传达同一伦理与盟约含义，而不额外限定具体行为。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“遵守……约”与“按……行事”构成清楚的平行结构；脚注标记置于“律法”之后，与所说明的词准确对应。
