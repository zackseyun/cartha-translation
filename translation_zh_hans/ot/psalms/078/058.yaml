id: PSA.78.58
reference: Psalms 78:58
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּכְעִיס֥וּ/הוּ בְּ/בָמוֹתָ֑/ם וּ֝/בִ/פְסִילֵי/הֶ֗ם יַקְנִיאֽוּ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/058.yaml
  text: They provoked him to anger with their high places[c][b][a], and with their carved images they made him jealous.
translation:
  language: zh_hans
  text: 他们用自己的丘坛[a]惹他发怒，又用自己的雕刻偶像[b]使他嫉妒[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丘坛”指当地的祭祀或敬拜场所，常与不合正道的敬拜和偶像崇拜有关。
    reason: cultural_note
  - marker: b
    text: 或译：“雕像”。原文指雕刻而成的宗教形像。
    reason: lexical_alternative
  - marker: c
    text: 或译：“激起他的忌邪之心”。这里的“嫉妒”指神因百姓转向偶像而产生的盟约性忌邪。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּהוּ
  choice: 惹他发怒
  rationale: כעס的使役形式表示使某人发怒；“惹他发怒”自然清楚地保留了使役含义。
- source_word: בְּבָמוֹתָם
  choice: 用自己的丘坛
  rationale: במות指用于祭祀的高处或设在高处的敬拜场所；“丘坛”保留其具体宗教文化含义，介词ב按工具或方式理解为“用”。
- source_word: וּבִפְסִילֵיהֶם
  choice: 又用自己的雕刻偶像
  rationale: פסילים指雕刻而成、供人敬拜的形像；“雕刻偶像”既呈现制作方式，也明确其偶像性质。
- source_word: יַקְנִיאוּהוּ
  choice: 使他嫉妒
  rationale: קנא的使役形式在这里表示使神嫉妒或激起他的忌邪之情；直译为“使他嫉妒”保留原文关系性和盟约性的张力。
theological_decisions:
- issue: 描述神“嫉妒”的语言
  choice: 使他嫉妒
  alternative: 激起他的忌邪之心
  rationale: 原文明确使用קנא。译作“使他嫉妒”不把这一表达淡化为一般的愤怒，也不预先用解释性神学术语消解其张力；脚注说明其语境含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“丘坛”作为较专门的圣经文化词汇予以保留并加注；全句保持希伯来诗句两个平行分句的结构。
