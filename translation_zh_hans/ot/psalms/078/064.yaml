  text: כֹּ֭הֲנָי/ו בַּ/חֶ֣רֶב נָפָ֑לוּ וְ֝/אַלְמְנֹתָ֗י/ו לֹ֣א תִבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/064.yaml
  text: His priests fell by the sword[a], and his widows could not weep.
translation:
  language: zh_hans
  text: 他的祭司倒在刀剑之下；他的寡妇没有哀哭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不能哀哭。”希伯来文直译为“没有哀哭”；这既可只是陈述事实，也可能暗示灾祸惨重，使她们无暇或无法按常规举哀。
    reason: 保留否定动词在事实陈述与语境所暗示的无力举哀之间的解释空间。
lexical_decisions:
- source_word: כֹּהֲנָיו
  choice: 他的祭司
  rationale: כֹּהֵן通常指承担礼仪职分的“祭司”；保留第三人称阳性单数后缀，译作“他的”。
- source_word: בַּחֶרֶב
  choice: 在刀剑之下
  rationale: 介词ב在此表示致死的手段；“倒在刀剑之下”是自然庄重的汉语，也保留了希伯来诗歌的战争意象。
- source_word: נָפָלוּ
  choice: 倒下
  rationale: נפל的基本义是“倒下”；结合“刀剑”即可清楚表达战死，无须增译为“被杀”。正文按汉语搭配表达为“倒在刀剑之下”。
- source_word: וְאַלְמְנֹתָיו
  choice: 他的寡妇
  rationale: 原文后缀为第三人称阳性单数。尽管汉语中“他们的遗孀”更顺畅，仍保留单数所属关系，以免抹平诗中集合性单数的表达。
- source_word: לֹא תִבְכֶּינָה
  choice: 没有哀哭
  rationale: 原文直陈否定“没有哭泣”。“哀哭”符合丧亡语境，同时不在正文中断定她们究竟是不能哀哭，还是事实上没有哀哭。
theological_decisions:
- issue: 寡妇未哀哭的含义
  choice: 正文译作事实陈述“没有哀哭”，保留原文的含混性。
  alternative: 译作“不能哀哭”，理解为灾难使正常举哀无法进行。
  rationale: 否定未完成式本身并未明确表达能力上的“不可能”。上下文可能暗示灾祸严重到无暇或无法举哀，但不宜在正文中把这一推论确定化；脚注说明该可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；以分号呈现两个平行分句。“刀剑之下”保留战争死亡的形象，“哀哭”点明丧亡语境。
