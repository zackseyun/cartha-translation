  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹ֤א נְכַחֵ֨ד מִ/בְּנֵי/הֶ֗ם לְ/ד֥וֹר אַחֲר֗וֹן מְֽ֭סַפְּרִים תְּהִלּ֣וֹת יְהוָ֑ה וֶ/עֱזוּז֥/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר עָשָֽׂה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/004.yaml
  text: We will not hide them from their children[a], telling the coming generation the praiseworthy deeds of Yahweh, and his strength[c][b], and his wonders that he has done.
translation:
  language: zh_hans
  text: 我们不向他们的儿女隐瞒这些事，却要向后来的世代[b]述说雅威可颂的作为[a]、他的大能，以及他所行的奇事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“对雅威的颂赞”或“雅威值得称颂之处”。原文既可指献给雅威的颂赞，也可指他可颂的作为；本节与“大能”和“奇事”并列，较支持后者。
    reason: lexical_alternative
  - marker: b
    text: 或译“下一代”或“将来的世代”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכַחֵד
  choice: 隐瞒
  rationale: 该词的 Piel 词形在这里表示把事情隐藏起来、不让人知道；“隐瞒”自然地表达了有意不传告的含义。
- source_word: מִבְּנֵיהֶם
  choice: 向他们的儿女
  rationale: בנים 可指儿子，也可泛指儿女或后代；本节谈世代相传，因此用不限定性别的“儿女”。介词 מִן 在“隐瞒”这一语境中自然译为“向……隐瞒”。
- source_word: לְדוֹר אַחֲרוֹן
  choice: 向后来的世代
  rationale: 该短语指随后或将来的世代；“后来的世代”保留其时间指向，也不把它过度限定为紧接着的唯一一代。
- source_word: מְסַפְּרִים
  choice: 述说
  rationale: 分词说明“不隐瞒”的具体方式，即讲述、传扬；中文以“却要……述说”清楚表达诗句中从否定到积极传承的推进。
- source_word: תְּהִלּוֹת יְהוָה
  choice: 雅威可颂的作为
  rationale: תהלות 既可指献给雅威的颂赞，也可指雅威值得称颂之处或作为。它与“大能”和“奇事”并列，语境较支持后者；“可颂的作为”既自然，又保留赞颂色彩。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，而不以称号代替专名。
- source_word: עֱזוּזוֹ
  choice: 他的大能
  rationale: 该名词表示力量、威力；“大能”适合诗歌语域，并能表达这里所述的神圣能力。
- source_word: נִפְלְאוֹתָיו
  choice: 他所行的奇事
  rationale: 该词指令人惊奇、超乎寻常的作为；结合后面的 אֲשֶׁר עָשָׂה，合译为“他所行的奇事”简洁自然。
- source_word: אֲשֶׁר עָשָׂה
  choice: 他所行的
  rationale: 关系从句修饰“奇事”；中文前置为“他所行的”，准确而流畅。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，不用称号取代，也不借此加入额外的宗派性解释。
- issue: תְּהִלּוֹת יְהוָה 的语义
  choice: 雅威可颂的作为
  alternative: 对雅威的颂赞；雅威值得称颂之处
  rationale: 该词本身容许“颂赞”与“可颂之事”两种理解。因其与雅威的“大能”和“奇事”并列，正文采用较符合上下文的作为义，同时以脚注保留真实的词义歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“却要”明确表现“不隐瞒”与积极“述说”之间的对照；整体保留原文的世代传承主题和并列节奏，避免古奥措辞。
