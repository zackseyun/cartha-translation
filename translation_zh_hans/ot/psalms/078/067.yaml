  text: וַ֭/יִּמְאַס בְּ/אֹ֣הֶל יוֹסֵ֑ף וּֽ/בְ/שֵׁ֥בֶט אֶ֝פְרַ֗יִם לֹ֣א בָחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/067.yaml
  text: Then he rejected the tent of Joseph[b][a], and he did not choose the tribe of Ephraim.
translation:
  language: zh_hans
  text: 于是，他厌弃约瑟的帐棚[a][b]，没有拣选以法莲支派。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厌弃”也可译作“弃绝”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“约瑟”以其主要支派以法莲为代表；下文将提到上帝拣选犹大和锡安。
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: 于是，他厌弃
  rationale: מָאַס可表示拒绝、厌弃或藐视。此处选“厌弃”，既保留原词较强的否定意味，又适合庄重的历史诗歌语境；“于是”体现叙事推进的连接关系。
- source_word: בְּאֹהֶל יוֹסֵף
  choice: 约瑟的帐棚
  rationale: אֹהֶל直译为“帐棚”。这里可能借指与约瑟诸支派相关的居所、圣所或地域，但正文保留具体意象，避免把借代含义解释得过死。
- source_word: וּבְשֵׁבֶט אֶפְרַיִם
  choice: 以法莲支派
  rationale: שֵׁבֶט可指支派、杖或权杖；与“约瑟的帐棚”平行并接在族名“以法莲”之前时，“支派”最自然。
- source_word: לֹא בָחָר
  choice: 没有拣选
  rationale: בָּחַר意为选择、拣选。“没有拣选”直接保留原文措辞，也与诗篇中上帝选择犹大和锡安的语境相呼应，而不额外引入系统神学含义。
theological_decisions:
- issue: 上帝厌弃约瑟并未拣选以法莲的历史—神学含义
  choice: 按具体支派和圣所中心的历史语言翻译，保留“约瑟的帐棚”和“以法莲支派”。
  alternative: 把“约瑟”和“以法莲”直接解释为整个北国，或把“帐棚”明译为北方圣所。
  rationale: 本诗回顾以色列历史，随后转向上帝拣选犹大、锡安和大卫。正文应保留希伯来文的具体部族意象，不把其更广泛的历史指向直接写入译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“帐棚”保留诗歌的具体意象；“厌弃”传达מָאַס的力度，但脚注列出较中性的译法。脚注标记按首次相关位置依次排列。
