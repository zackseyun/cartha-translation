id: PSA.78.5
reference: Psalms 78:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּ֤קֶם עֵד֨וּת בְּֽ/יַעֲקֹ֗ב וְ/תוֹרָה֮ שָׂ֤ם בְּ/יִשְׂרָ֫אֵ֥ל אֲשֶׁ֣ר צִ֭וָּה אֶת אֲבוֹתֵ֑י/נוּ לְ֝/הוֹדִיעָ֗/ם לִ/בְנֵי/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/005.yaml
  text: For he established a testimony in Jacob and set a law in Israel[c][b][a], which he commanded our fathers to make known to their children.
translation:
  language: zh_hans
  text: 他在雅各中设立法度，在以色列中颁下律法[a]；他吩咐我们的列祖[b]，要把这些传给他们的儿女[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“训诲”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“我们的父辈”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“他们的儿子”，这里指他们的儿女。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 设立
  rationale: 使役形表达“使之立定、确立”；“设立”自然庄重，也符合制度与圣约语境。
- source_word: עֵדוּת
  choice: 法度
  rationale: 此词可指见证，也可指具有约束力的圣约规定；诗篇语境中的“法度”保留传统经文用语和规范意味，同时不过度限定为一般法律。
- source_word: בְּיַעֲקֹב
  choice: 在雅各中
  rationale: 保留介词和“雅各”作为立约群体的转喻，并与下句“在以色列中”形成诗歌平行。
- source_word: וְתוֹרָה
  choice: 律法
  rationale: תּוֹרָה兼有训诲与规范之意；此处与法度并列，又涉及上帝命令代代传承，译作“律法”较能体现其规范性。
- source_word: שָׂם
  choice: 颁下
  rationale: 字面为放置、设定；汉语在律法语境中用“颁下”更自然，并与前句“设立”避免机械重复。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列中
  rationale: 保留与“在雅各中”对应的介词结构及群体意义。
- source_word: אֲשֶׁר צִוָּה
  choice: 他吩咐
  rationale: 关系从句在汉语中顺译为新的分句；不额外判定命令的范围或方式。
- source_word: אֶת אֲבוֹתֵינוּ
  choice: 我们的列祖
  rationale: 原文为明确的阳性复数“我们的父辈”；“列祖”在庄重现代汉语中保留男性祖辈与群体先辈的意味。
- source_word: לְהוֹדִיעָם
  choice: 要把这些传给
  rationale: 使役形本义是“使人知道”；结合代际传递语境，“传给”自然表达使下一代知晓的动作。“这些”承接前述法度与律法。
- source_word: לִבְנֵיהֶם
  choice: 他们的儿女
  rationale: בנים形式上可指儿子，在此代际语境中泛指后代；“儿女”既保留亲子用语，也自然涵盖子女整体。
theological_decisions:
- issue: 诗篇圣约语境中 תּוֹרָה 的译法
  choice: 律法
  alternative: 训诲
  rationale: 本节强调上帝设立并命令传承的规范性内容，因此“律法”较贴合；但该希伯来词也可表达“训诲”，故以脚注保留此义。
- issue: עֵדוּת 的语义范围
  choice: 法度
  alternative: 见证
  rationale: 与 תּוֹרָה 平行时，此词很可能指上帝所立的圣约规定；“法度”呈现规范意味，但“见证”仍是词源和其他语境中的真实可能。
- issue: 关系代词所指与复数宾语的表达
  choice: 把这些传给
  alternative: 把它传给
  rationale: 原文后缀为阳性复数，可概括前述“法度”和“律法”；译作“这些”保留复数指涉，不把两者强行合并为单一实体。
- issue: 亲属称谓中的性别表达
  choice: 我们的列祖……他们的儿女
  alternative: 我们的祖先……他们的儿子
  rationale: אבות明确为男性父辈，故用“列祖”；בנים在代际传承语境中通常泛指子女，故用“儿女”，避免无根据地把传承限于男性后代。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留“雅各／以色列”的诗歌平行和“列祖”的明确男性指称。以“法度、律法”呈现圣约性与规范性，同时用脚注保留 תּוֹרָה 的“训诲”义。
