  text: שָׁמַ֣ע אֱ֭לֹהִים וַֽ/יִּתְעַבָּ֑ר וַ/יִּמְאַ֥ס מְ֝אֹ֗ד בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/059.yaml
  text: God heard and was furious[b][a], and he utterly rejected Israel.
translation:
  language: zh_hans
  text: 神听见了，就大发烈怒[a]，并且极其厌弃[b]以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被激怒”。希伯来语动词可表示变得愤怒，或怒气被激起。
    reason: lexical_alternative
  - marker: b
    text: 或译“弃绝”或“鄙弃”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: 听见了
  rationale: 此处为Qal完成式，承接上文以色列人的行为，并引出神的回应；“听见了”简洁自然，也保留原文表述。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 虽然词形为复数形式，但此处与单数意义的动词搭配，明确指以色列的神。
- source_word: וַיִּתְעַבָּר
  choice: 大发烈怒
  rationale: עבר的Hitpael形式在此表示怒气被激起、变得极其愤怒；“大发烈怒”保留原文强烈的情感与审判色彩，又符合庄重的现代汉语。
- source_word: וַיִּמְאַס
  choice: 厌弃
  rationale: מאס可指拒绝、弃绝或鄙弃；“厌弃”兼有强烈排斥与拒绝之意，适合此处的圣约审判语境，同时不把含义局限为单纯的情绪蔑视。
- source_word: מְאֹד
  choice: 极其
  rationale: 该副词强烈修饰“厌弃”；“极其”准确传达程度，并保持庄重自然。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列
  rationale: 介词ב在מאס之后标示厌弃的对象；现代汉语自然地将“以色列”直接置于及物动词之后。
theological_decisions:
- issue: 神发怒并厌弃以色列的拟人化表述
  choice: 保留“大发烈怒”和“极其厌弃”的强烈措辞。
  alternative: 弱化为“不悦”和“不再眷顾”。
  rationale: 希伯来原文使用强烈的圣约审判语言。译文不应为减轻神学张力而淡化其力度；这节经文本身强调神对以色列悖逆行为的严厉回应。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“大发烈怒”与“极其厌弃”保留诗篇审判语言的力度；两个脚注分别说明原文动词可容纳的词义范围。
