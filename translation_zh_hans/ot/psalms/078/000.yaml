  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: zh_hans
  text: '亚萨的训诲诗[a]。


    我的子民哪，要留心听我的教导；

    要侧耳听我口中的话。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
