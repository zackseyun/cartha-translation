lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: 训诲诗
  rationale: 这是诗篇标题中的专门术语，词义并不完全确定；“训诲诗”保留其可能具有教导、启迪性质的含义，并以脚注说明其不确定性。
- source_word: תּוֹרָתִי
  choice: 我的教导
  rationale: 此处 תּוֹרָה 指诗人要百姓聆听的训示，不必限定为成文律法；“教导”符合语境，也避免过度收窄词义。
- source_word: הַאֲזִינָה / הַטּוּ אָזְנְכֶם
  choice: 留心听／侧耳听
  rationale: 分别传达两个近义祈使表达，并保留希伯来诗歌的平行结构；措辞自然而庄重。
