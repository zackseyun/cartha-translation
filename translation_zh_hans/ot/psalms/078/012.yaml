  text: נֶ֣גֶד אֲ֭בוֹתָ/ם עָ֣שָׂה פֶ֑לֶא בְּ/אֶ֖רֶץ מִצְרַ֣יִם שְׂדֵה צֹֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/012.yaml
  text: Before their fathers he did wonders in the land of Egypt[b][a], in the fields of Zoan.
translation:
  language: zh_hans
  text: '他在他们祖先眼前施行奇事，

    在埃及地，在琐安的田野[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琐安的田野”也可理解为琐安周围的田野或琐安地区。
    reason: cultural_note
lexical_decisions:
- source_word: נֶגֶד אֲבוֹתָם
  choice: 在他们祖先眼前
  rationale: נֶגֶד 表示在某人面前或视线之内；“在……眼前”自然传达这些事是祖先亲眼见证的。אֲבוֹתָם 直译为“他们的父辈”，此处指以色列人的先祖，译作“祖先”更符合现代汉语且不改变所指。
- source_word: עָשָׂה פֶלֶא
  choice: 施行奇事
  rationale: עָשָׂה 与 פֶלֶא 构成“行奇妙之事”的表达；“施行奇事”庄重自然，并避免用“神迹”额外强化解释。פֶלֶא 虽为单数形式，在此可作集合意义理解。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 保留原文明确出现的“地”，维持地理表达的具体性。
- source_word: שְׂדֵה צֹעַן
  choice: 在琐安的田野
  rationale: 构造短语字面为“琐安之田野/田地”；译作“琐安的田野”保留原文意象，而其所指可能是琐安周围的田野或地区。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；分成两个平行短句，保留希伯来诗句的地理层递。未为“在他们祖先眼前”增设异译脚注，因为正文已直接表达 נֶגֶד 的可见性含义。
