base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/026.yaml
  text: He stirred up the east wind in the heavens[b][a], and by his strength he guided the south wind.
translation:
  language: zh_hans
  text: 他使东风在天空中吹起[a]，又凭他的能力引导南风[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使东风在天空中出发。”
    reason: 原文动词字面意思是“使出发、使动身”；用于风时可理解为使风开始吹动。
  - marker: b
    text: 原文作“南方”；这里与“东风”平行，可能指“南风”。
    reason: 保留方向名词 תֵימָן 在此处究竟直接指风还是仅指方向的词义张力。
lexical_decisions:
- source_word: יַסַּע
  choice: 使……吹起
  rationale: 希伯来语使役式本义为“使出发、使动身”；以风为宾语时，表示使风开始运行或吹动。译为“使……吹起”既自然，也明确保留上帝的主动作用。
- source_word: קָדִים
  choice: 东风
  rationale: 该词常指从东方吹来的风；结合下半句的方向词和平行结构，译作“东风”最清楚。
- source_word: בַּשָּׁמָיִם
  choice: 在天空中
  rationale: שָׁמַיִם形式上可指“诸天”，但此处是风运行的空域；现代汉语“天空中”准确自然，也不削弱诗歌意象。
- source_word: וַיְנַהֵג
  choice: 引来
  rationale: נהג可表示带领、引导或驱赶。这里描写上帝调动风以带来鹌鹑，“引来”在汉语中自然，并保留他支配风向的含义。
- source_word: בְּעֻזּוֹ
  choice: 以自己的能力
  rationale: עֹז表示力量、能力或威力；介词短语说明上帝施行此事所凭借的力量。
- source_word: תֵימָן
  choice: 南风
  rationale: 字面可指“南方”或南部地区；与“东风”平行，并结合上下文所述的风，补明为“南风”较清楚。
theological_decisions:
- issue: 上帝对自然力量的主动支配
  choice: 两个分句都以上帝为行动主体，表达他使东风吹起并以能力引来南风。
  alternative: 采用较弱的表达，只描述风自行兴起或吹来。
  rationale: 原文两个动词均以上帝为主语，诗篇语境强调他为以色列供应时对风的主动调动；译文保留这一点，却不添加原文之外的教义说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使……吹起”与“引来”形成自然的诗歌平行；脚注保留原文动词的字面意象及“南方／南风”的歧义。
