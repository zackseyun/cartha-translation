source:
  edition: WLC
  text: וְ/ה֤וּא רַח֨וּם יְכַפֵּ֥ר עָוֺן֮ וְֽ/לֹא יַ֫שְׁחִ֥ית וְ֭/הִרְבָּה לְ/הָשִׁ֣יב אַפּ֑/וֹ וְ/לֹֽא יָ֝עִיר כָּל חֲמָתֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/038.yaml
  text: But he[a], being compassionate, made atonement for iniquity and did not destroy; he often turned back his anger and did not stir up all his wrath.
translation:
  language: zh_hans
  text: 但他满有怜悯，为罪孽赎罪[a]，没有毁灭他们；他屡次收回怒气，也没有激起自己全部的烈怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赦免罪孽”。这里的希伯来语动词通常用于表达“赎罪”。
    reason: 说明语境可支持的自然译法，同时保留原词的赎罪含义。
lexical_decisions:
- source_word: רַחוּם
  choice: 满有怜悯
  rationale: 该形容词描述持续的怜悯品格；“满有怜悯”在现代汉语中自然庄重，并保留其品格描述。
- source_word: יְכַפֵּר עָוֺן
  choice: 为罪孽赎罪
  rationale: כפר的加强词干常表示赎罪或除罪；译作“为罪孽赎罪”保留原文的赎罪分量，同时不擅自说明赎罪的具体方式。
- source_word: יַשְׁחִית
  choice: 毁灭
  rationale: 此处指施行毁灭性的审判；“毁灭”准确而清楚。
- source_word: וְהִרְבָּה לְהָשִׁיב
  choice: 屡次收回
  rationale: הִרְבָּה加不定式表示反复或多次行动；“屡次”自然传达这一副词性含义。
- source_word: אַפּוֹ
  choice: 怒气
  rationale: אַף字面可指“鼻子”，此处按常见习语表示愤怒；译作“怒气”保留诗句的情绪力度。
- source_word: יָעִיר כָּל חֲמָתוֹ
  choice: 激起他的全部烈怒
  rationale: עור的使役形意为唤醒、激起；“激起”贴近原文意象，“全部烈怒”明确保留כָּל的范围。
theological_decisions:
- issue: 历史诗篇中כפר的译法
  choice: 为罪孽赎罪
  alternative: 赦免罪孽
  rationale: “赦免”能表达语境中的结果，却会淡化כפר通常具有的赎罪含义。正文保留“赎罪”，脚注列出符合语境的“赦免”译法，以维持原文的词义张力而不规定赎罪机制。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“满有怜悯”“屡次收回怒气”流畅自然；分号保留诗句两组平行陈述。代词“他们”由上下文补出，使“没有毁灭”的对象在汉语中明确。
