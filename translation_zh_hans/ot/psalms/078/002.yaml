    text: 马太福音 13:35 引用本节，用来说明耶稣以比喻讲论。
    reason: cross_reference
lexical_decisions:
- source_word: אֶפְתְּחָה
  choice: 我要开
  rationale: 该词是פתח的第一人称单数形式，带诗歌中的意愿或将来语气；与“口”连用，译作“我要开口”自然且保留原文的具体意象。
- source_word: בְמָשָׁל
  choice: 讲比喻
  rationale: מָשָׁל可指箴言、比喻或寓意性言论；在这里与“谜语”平行，译作“比喻”既保留形象性教诲的含义，也不把词义局限为单一文类。
- source_word: פִּי
  choice: 口
  rationale: 直译为“我的口”；汉语“我要开口”已自然表达第一人称所属，无须重复“我的”。
- source_word: אַבִּיעָה
  choice: 倾吐
  rationale: נבע的使役形本有使之涌流、倾泻之意，转用于言语；“倾吐”兼顾其生动意象与说出的含义。
- source_word: חִידוֹת
  choice: 谜语
  rationale: חִידָה指谜语、难解之言或隐晦的言辞；“谜语”是直接对应，同时以脚注保留其他可能译法。
- source_word: מִנִּי קֶדֶם
  choice: 古时的
  rationale: 该短语指来自远古或往昔；“古时的”在汉语中简洁自然，也避免将其过度限定为创造之初。
theological_decisions:
- issue: 本节与马太福音13:35的关系，以及מָשָׁל和חִידוֹת的含义
  choice: 按希伯来文本身译为“比喻”和“谜语”，并以脚注提示新约引用。
  alternative: 译为“箴言”和“古时的隐秘事”，或依新约引文协调为“隐藏的事”。
  rationale: 以原文证据为先，保留诗篇中形象、难解的教诲这一含义，不为配合后来的希腊文引述而把“谜语”改成“隐藏的事”。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“开口”保留希伯来语的具体表达；“倾吐”呈现动词所含的涌流意象。脚注标记紧随各自相关词语，并将跨经文说明置于“比喻”之后。
