  text: 我要开口说比喻[a][d]；我要说出古时的[c]谜语[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比喻”或译“箴言”“格言”。希伯来语 מָשָׁל 可指箴言、比喻或寓意性的言论。
    reason: lexical_alternative
  - marker: b
    text: “谜语”或译“隐晦的话”“难解之言”。
    reason: lexical_alternative
  - marker: c
    text: “古时的”或译“从远古传来的”。
    reason: lexical_alternative
