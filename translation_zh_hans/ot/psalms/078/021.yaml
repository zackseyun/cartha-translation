  text: לָ/כֵ֤ן שָׁמַ֥ע יְהוָ֗ה וַֽ/יִּתְעַבָּ֥ר וְ֭/אֵשׁ נִשְּׂקָ֣ה בְ/יַעֲקֹ֑ב וְ/גַם אַ֝֗ף עָלָ֥ה בְ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/021.yaml
  text: Therefore Yahweh heard and was enraged[a]; and a fire was kindled against Jacob[c][b], and anger also rose against Israel.
translation:
  language: zh_hans
  text: 因此，雅威听见了，便震怒[a]；火向雅各烧起[b]，怒气也向以色列升腾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “震怒”也可译作“被激怒”或“怒气勃发”。
    reason: lexical_alternative
  - marker: b
    text: “向雅各”和“向以色列”，希伯来文直译均为“在……中”；这里按敌对审判的语境译作“向”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 明确承接上文，保留因果推论关系。
- source_word: שָׁמַע
  choice: 听见了
  rationale: 直接表达听见，并由上下文自然带出雅威留意百姓言语之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留四字神名，不以称号替代专名。
- source_word: וַיִּתְעַבָּר
  choice: 就震怒
  rationale: 该词形在此表示强烈发怒；“震怒”既保留力度，也符合庄重的现代汉语。
- source_word: אֵשׁ נִשְּׂקָה
  choice: 有火……燃起
  rationale: 保留“火”的意象及被点燃、燃起的含义，不判定其为字面或比喻。
- source_word: בְיַעֲקֹב
  choice: 向雅各
  rationale: 介词字面可作“在……中”，但在敌对审判语境中，“向”自然表达火所针对的对象，同时以脚注保留字面可能。
- source_word: וְגַם אַף
  choice: 怒气也
  rationale: “也”保留附加和并行关系；אַף按固定转喻译为“怒气”。
- source_word: עָלָה
  choice: 升腾
  rationale: 保留怒气向上升起的空间意象，又比单纯“上升”更符合汉语诗歌语感。
- source_word: בְיִשְׂרָאֵל
  choice: 向以色列
  rationale: 与“向雅各”平行，表达审判所针对的群体；字面介词信息见脚注。
theological_decisions:
- issue: 如何表达神的愤怒而不削弱原文力度
  choice: 采用“震怒”和“怒气……升腾”
  alternative: 译作较弱的“不悦”，或把拟人化表达改写为一般性的惩罚
  rationale: 希伯来文以强烈、具体的愤怒语言回应以色列的言行；译文应保留其神学分量和诗歌张力。
- issue: 火是字面事件还是审判的比喻
  choice: 正文保留“有火……燃起”的原始意象，不作解释性限定
  alternative: 明确译成字面的火，或直接改写为神的审判
  rationale: 本节本身没有要求译者排除字面或比喻中的任何一种可能，故保留其开放性。
- issue: 两个介词短语的敌对指向
  choice: 译作“向雅各”和“向以色列”
  alternative: 按形式直译为“在雅各中”和“在以色列中”
  rationale: 上下文显示火与怒气针对百姓；“向”在汉语中自然呈现这种审判方向，同时脚注交代希伯来文的字面形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅各／以色列”保留诗歌平行结构，二者在此均指神的百姓。分号呈现雅威震怒与随后火、怒气并列展开的关系；不把连接词强行解释为因果说明。
