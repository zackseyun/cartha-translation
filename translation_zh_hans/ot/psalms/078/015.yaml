  text: יְבַקַּ֣ע צֻ֭רִים בַּ/מִּדְבָּ֑ר וַ֝/יַּ֗שְׁקְ כִּ/תְהֹמ֥וֹת רַבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/015.yaml
  text: He split rocks in the wilderness and gave them drink abundantly[a], as from the great depths.
translation:
  language: zh_hans
  text: 他在旷野劈开岩石，使他们饱饮，如同从浩瀚的深渊得水一般。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们喝那浩瀚深渊的水。”
    reason: 希伯来语末句的结构凝缩。כ通常表示“如同、仿佛”，但该短语也可被理解为直接描写水来自宏大的深渊。
lexical_decisions:
- source_word: יְבַקַּע
  choice: 劈开
  rationale: 该词是 בקע 的加强词干，表示用力裂开、劈开；“劈开”自然鲜明，也保留原文强有力的动作感。
- source_word: צֻרִים
  choice: 磐石
  rationale: צוּר 的复数指大块岩石或岩体；汉语集合性名词“磐石”既符合诗体，也不必生硬地逐一标出复数。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר 可指旷野或沙漠；“旷野”符合以色列行程的语境，又不把地貌限缩为纯粹沙漠。
- source_word: וַיַּשְׁקְ
  choice: 使他们饱饮
  rationale: שׁקה 的使役式意为使人喝、给人水喝；“他们”由上下文补出。“饱饮”自然表达供水充足，并与末尾 רַבָּה 的丰盛意味相呼应。
- source_word: כִּתְהֹמוֹת
  choice: 仿佛水源自……深渊
  rationale: 前缀 כ 表示比较，תְּהֹמוֹת 描绘深处或深渊之水；译文保留比喻，同时补出汉语理解所需的“水”。
- source_word: רַבָּה
  choice: 浩瀚的
  rationale: רַבָּה 在此强调深渊之水的广大、丰盛；“浩瀚”兼顾水量充沛和诗歌的宏阔意象。
theological_decisions:
- issue: 水源与深渊意象的性质
  choice: 保留“仿佛”所表达的比喻，不断言水确实来自某种地下宇宙水库。
  alternative: 使他们喝那浩瀚深渊的水。
  rationale: 希伯来语的 כ 首先表示比较。保留比喻可呈现诗歌意象，又避免把诗句解释成特定的古代宇宙构造。
- issue: רַבָּה 所修饰的重点
  choice: 以“饱饮”和“浩瀚”共同传达水量丰盛。
  alternative: 只译作“使他们大量饮水”，弱化“深渊”的宏阔意象。
  rationale: 原文的词形与句法关系较为凝缩，既可强调饮水充足，也可突出深渊之广大；中文用两处相互呼应，保留这层张力而不作过度限定。
translation_notes:
  register: 采用现代、庄重而清晰的诗体汉语。“劈开磐石”保留动作力度；“饱饮”简洁表达供应丰足；“浩瀚的深渊”保留原文宏阔的水域意象。
