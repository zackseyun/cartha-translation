revisions:
- from: 于是，他领自己的子民如羊群起行，又在旷野中引导他们，如同牧养群羊。
  to: 于是，他使自己的子民像羊群一样起行；在旷野中，他引导他们，如同带领羊群。
  rationale: 修订保留原文两个并列的比较结构：百姓“像羊群一样”起行，并且上帝“如同带领羊群”那样在旷野中引导他们。未将牧羊意象解释性地扩展为“牧养”，同时维持现代普通话中庄重、清晰的表达。
