  text: וַ/יַּסַּ֣ע כַּ/צֹּ֣אן עַמּ֑/וֹ וַֽ/יְנַהֲגֵ֥/ם כַּ֝/עֵ֗דֶר בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/052.yaml
  text: Then he led out his people like sheep, and guided them like a flock in the wilderness.
translation:
  language: zh_hans
  text: 于是，他使自己的子民像羊群一样起行；在旷野中，他引导他们，如同带领羊群。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסַּע
  choice: 领……起行
  rationale: 该词是נסע的使役形，表达使人启程、带领人前行；“领……起行”既保留使役意味，也自然契合出埃及的语境。
- source_word: כַּצֹּאן
  choice: 如羊群
  rationale: צאן指羊等小型牲畜；此处是牧者意象，译作“羊群”简洁自然，并与下半节的群羊形象呼应。
- source_word: עַמּוֹ
  choice: 自己的子民
  rationale: עם在这里指属于上帝的以色列民；“自己的子民”自然表达原文的所属关系，而不额外增添神学解释。
- source_word: וַיְנַהֲגֵם
  choice: 引导他们
  rationale: נהג可指带领、驱赶或引导。牧羊语境强调沿途带领，“引导”保留其方向性，也避免把语气不必要地强化为粗暴驱赶。
- source_word: כָּעֵדֶר
  choice: 如同牧养群羊
  rationale: עדר本指畜群。原文动词“引导”带有牧人领群的画面；汉语若直译为“像一群”容易产生“他们引导谁”的歧义，因此以“如同牧养群羊”自然呈现这一明喻，同时未改变其基本意象。
- source_word: בַּמִּדְבָּר
  choice: 在旷野中
  rationale: מִדְבָּר指荒野、旷野地带，不必专指沙漠；“旷野”符合出埃及叙事的地理背景及现代中文圣经语域。
theological_decisions:
- issue: 出埃及背景中的神圣牧者意象
  choice: 直接保留上帝带领其子民如牧人领羊群的双重比喻。
  alternative: 把比喻解释性扩展为上帝保护、供应或拯救以色列。
  rationale: 原文聚焦于带领和引导；保留牧者意象及所属关系即可，不将后续经文或特定神学发展预先写入本节。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“于是”承接前文叙事；上下两分句保留希伯来诗歌的平行结构。为避免中文“引导他们如同一群”语义悬空，下半句用“如同牧养群羊”显明牧者与羊群的关系。
