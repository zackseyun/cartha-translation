  source_fidelity: 译文准确反映了希伯来文的两项交付：将“他的力量”交付于被掳的境地，并将“他的荣美”交在敌人手中。“使……被掳”以合乎汉语的方式表达了 לַשְּׁבִי 所指的被掳状态，且没有在正文中把诗性的“力量”“荣美”具体化为约柜或圣所。
  naturalness: “他使自己的力量被掳，把自己的荣美交在敌人手中”庄重、清楚，适合诗篇的诗歌体。两分句的结构虽不机械对称，但符合现代汉语，且避免了“交给被掳”一类生硬直译。
