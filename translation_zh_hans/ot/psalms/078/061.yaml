  text: וַ/יִּתֵּ֣ן לַ/שְּׁבִ֣י עֻזּ֑/וֹ וְֽ/תִפְאַרְתּ֥/וֹ בְ/יַד צָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/061.yaml
  text: He gave his strength to captivity[c][b][a], and his splendor into the hand of the foe.
translation:
  language: zh_hans
  text: 他使自己的力量被掳[a]，把自己的荣美交在敌人手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “力量”可能暗指约柜；约柜在以色列中间是上帝能力的标志。原文没有直接点明。
    reason: cultural_note
  - marker: b
    text: “荣美”也可译作“荣耀”或“华美”；“交在敌人手中”意为交在敌人的权势之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 使……被掳／交在
  rationale: נתן在两行中表示“交出、任凭落入”；按汉语搭配分别译为“使……被掳”和“交在……手中”，既保留简练叙事，也显明审判语境中的交付之意。
- source_word: לַשְּׁבִי
  choice: 被掳
  rationale: שְׁבִי在此指被掳、落入俘虏状态。译作“被掳”比直译“给被掳”更符合现代汉语，同时不具体指明被掳之物。
- source_word: עֻזּוֹ
  choice: 自己的力量
  rationale: עֹז意为力量、能力；保留诗歌中的转喻表达，不在正文中直接解释为约柜、圣所或神同在的象征。
- source_word: וְתִפְאַרְתּוֹ
  choice: 自己的荣美
  rationale: תִּפְאֶרֶת可指荣美、荣耀或华美。“荣美”兼具尊荣与华美之意，并保留原词的语义幅度。
- source_word: בְיַד
  choice: 交在……手中
  rationale: 保留希伯来语“在某人手中”的意象；现代汉语也能自然表达落入对方权势控制之下。
- source_word: צָר
  choice: 敌人
  rationale: צַר指敌人、仇敌或压迫者；“敌人”清楚、自然，适合普通现代读者。
theological_decisions:
- issue: 是否把“他的力量”和“他的荣美”明确解释为约柜、圣所或神彰显的同在
  choice: 正文保留“自己的力量”和“自己的荣美”的诗性说法
  alternative: 在正文中明确译为约柜，或解释为圣所及神荣耀的同在
  rationale: 上下文很可能影射约柜被敌人掳去的事件，但希伯来文本没有直接点明所指。保留转喻可维护原文的含蓄与神学张力，脚注仅提示可能的历史指向。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两行保持诗歌式平行结构；避免生硬直译“给被掳”，也不在正文中提前解明“力量”和“荣美”的具体所指。
