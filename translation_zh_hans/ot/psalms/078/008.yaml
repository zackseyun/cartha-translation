    rationale: 原译逗号后的“成为顽梗悖逆的一代”可被误读为目的对象“他们”成为该代，而原文是把“他们的祖先”描述为“顽梗悖逆的一代”。应以“就是那……”明确同位关系。
  - severity: low
    issue: “没有坚定自己的心”使动表达略显生硬
    rationale: הֵכִין לִבּוֹ表达使心确立、坚定；“没有使自己的心坚定”在现代汉语中更自然，且不缩窄其为单纯心理意愿。
  - severity: low
    issue: 脚注b的替代译法不够符合现代汉语搭配
    rationale: “与上帝并不坚定”不自然。以“在上帝面前并不坚定”表达“steadfast with God”的可能含义较通顺。
  revised_text: 使他们不至像他们的祖先，就是那顽梗悖逆的一代；那一代没有使自己的心坚定[a]，灵也不忠于上帝[b]。
