  to: 使他们不至像他们的祖先，就是那顽梗悖逆的一代；那一代没有使自己的心坚定[a]，灵也不忠于上帝[b]。
  rationale: 修订仅消除中文句法歧义并改善使动表达和脚注搭配：祖先仍是“顽梗悖逆的一代”，而非受教者将要成为的一代；“心”与“灵”、集体性的“一代”、以及其对上帝的不忠信均予保留。脚注标记继续紧随所说明的短语。
