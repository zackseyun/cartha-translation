  text: וְ/לֹ֤א יִהְי֨וּ כַּ/אֲבוֹתָ֗/ם דּוֹר֮ סוֹרֵ֪ר וּ/מֹ֫רֶ֥ה דּ֭וֹר לֹא הֵכִ֣ין לִבּ֑/וֹ וְ/לֹא נֶאֶמְנָ֖ה אֶת אֵ֣ל רוּחֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/008.yaml
  text: and that they should not be like their fathers[a], a stubborn and rebellious generation[b], a generation that did not set its heart aright and whose spirit was not faithful to God.
translation:
  language: zh_hans
  text: 使他们不至像他们的祖先，就是那顽梗悖逆的一代；那一代没有使自己的心坚定[a]，灵也不忠于上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使自己的心坚定”也可译作“预备自己的心”或“确立自己的心”。
    reason: lexical_alternative
  - marker: b
    text: “灵也不忠于上帝”也可译作“灵在上帝面前并不坚定”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יִהְיוּ
  choice: 使他们不至……成为
  rationale: 承接上文的目的意味，表达后代受教是为了不重蹈覆辙；中文以“使……不至”自然呈现。
- source_word: כַאֲבוֹתָם
  choice: 像自己的祖先
  rationale: אָבוֹת直译为“父辈”，在跨世代回顾中指先祖；“祖先”在现代汉语中更清楚，也不限定为直接父亲。
- source_word: דּוֹר
  choice: 一代
  rationale: 保留诗句中重复出现的世代群体概念。
- source_word: סוֹרֵר וּמֹרֶה
  choice: 顽梗悖逆
  rationale: 前者强调固执偏离，后者强调主动反抗；“顽梗悖逆”兼顾两词并保持庄重而常见的圣经语体。
- source_word: הֵכִין לִבּוֹ
  choice: 坚定自己的心
  rationale: הֵכִין可表示预备、确立或使之坚定；此译保留“心”的隐喻，并突出内在意志未被确立，脚注保留另一可能。
- source_word: לִבּוֹ
  choice: 自己的心
  rationale: 保留希伯来人观中的“心”，涵盖意志、思想和内在取向。
- source_word: נֶאֶמְנָה
  choice: 忠诚
  rationale: אמן的尼法勒形在此表示可靠、坚定或忠信；“忠诚”适合其以神为关系对象的语境。
- source_word: אֶת אֵל
  choice: 对上帝
  rationale: 该结构表达灵与神之间的关系或朝向；“对上帝”符合现代汉语搭配。
- source_word: רוּחוֹ
  choice: 他们的灵
  rationale: 保留“灵”与前句“心”的区别；中文采用复数领属语，使集体名词“一代”所包含的成员关系更自然。
theological_decisions:
- issue: “心”与“灵”的人论配对
  choice: 分别保留为“心”和“灵”
  alternative: 合并译为“内心”或“心思”
  rationale: 原文有意使用两个相关而不相同的词，分别描写内在意志未坚定以及对神不忠；不宜将两者压平。
- issue: נֶאֶמְנָה אֶת אֵל的关系含义
  choice: 他们的灵对上帝也不忠诚
  alternative: 他们的灵与上帝并不坚定
  rationale: 原文既可侧重忠信，也可侧重坚定可靠；正文采用关系性的“忠诚”，脚注注明“坚定”这一真实可能，避免消除歧义。
- issue: 集体名词דּוֹר后的单数词尾
  choice: 按现代汉语用“他们的心／他们的灵”所代表的复数领属表达
  alternative: 机械保留为“这一代的心／它的灵”
  rationale: 希伯来文以单数集体名词搭配单数词尾；现代汉语用复数代词指该世代中的人更自然，且不改变其群体责任。
translation_notes:
  register: 采用现代、庄重且易懂的汉语。“顽梗悖逆”保留诗歌的凝练力度；分号呈现同位说明。所有脚注标记均置于正文相应短语之后。
