  text: וַ/יִּקַ֖ץ כְּ/יָשֵׁ֥ן אֲדֹנָ֑/י כְּ֝/גִבּ֗וֹר מִתְרוֹנֵ֥ן מִ/יָּֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/065.yaml
  text: Then the Lord awoke as from sleep[a], like a warrior shouting because of wine.
translation:
  language: zh_hans
  text: 那时，主如同从睡梦中醒来，又像勇士因酒而高声呐喊[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“像勇士因酒而欢呼”，或“像壮士因酒而呐喊”。
    reason: “מִתְרוֹנֵן”可表示呐喊或欢呼，“גִּבּוֹר”也可译为“壮士”；原文容许这些相近理解。
lexical_decisions:
- source_word: וַיִּקַץ
  choice: 醒来
  rationale: יקץ表示从睡眠中醒来；“醒来”自然简明，并保留诗中的拟人形象。
- source_word: כְּיָשֵׁן
  choice: 如同从睡梦中
  rationale: 前缀כְּ标明比喻；此译明确表达诗歌性的类比，而非断言主实际睡着。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 此处是神圣称号אֲדֹנָי，并非四字神名；现代中文以“主”准确对应。
- source_word: כְּגִבּוֹר
  choice: 像勇士
  rationale: גִּבּוֹר可指强者或战士；上下文中的战斗意象使“勇士”既贴切又有力度。
- source_word: מִתְרוֹנֵן
  choice: 高声呐喊
  rationale: 该分词表达响亮的呼喊，也可能含有欢呼、振奋之意；正文采用“高声呐喊”以契合勇士形象，同时在脚注保留词义的开放性。
- source_word: מִיַּיִן
  choice: 因酒而
  rationale: 介词מִן在此可表达原因或作用来源，即勇士受酒影响而呼喊；“因酒而”是自然中文，也保留原文略显突兀的意象。
theological_decisions:
- issue: 主醒来以及受酒激发的勇士之拟人比喻
  choice: 保留大胆的诗歌比喻，不弱化主“醒来”或勇士“因酒”呐喊的形象。
  alternative: 将经文释义为主结束沉默、开始行动，并删去或淡化睡眠与酒的意象。
  rationale: 原文借拟人和勇士的比喻描绘主在似乎静默之后果断介入；翻译应保存这种文学力度及其神学张力，而不在正文中替诗人解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“那时”承接叙事推进；以“如同……又像……”清楚呈现两层比较，并保留原文鲜明、略带冲击力的诗歌意象。
