  text: הֵ֤ן הִכָּה צ֨וּר וַ/יָּז֣וּבוּ מַיִם֮ וּ/נְחָלִ֪ים יִ֫שְׁטֹ֥פוּ הֲ/גַם לֶ֭חֶם י֣וּכַל תֵּ֑ת אִם יָכִ֖ין שְׁאֵ֣ר לְ/עַמּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/020.yaml
  text: Look[a], he struck the rock, and waters gushed out, and streams overflowed. Can he also give bread, or provide meat for his people?
translation:
  language: zh_hans
  text: 看哪，他击打磐石，水就涌出，溪流奔腾。他也能赐下饼吗？能为他的百姓预备肉[a]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉”原文直译为“肉”；这里很可能指可食用的肉。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 保留指示和强调作用；“看哪”庄重而仍为现代读者所熟悉。
- source_word: הִכָּה צוּר
  choice: 击打磐石
  rationale: 准确表达有力的击打动作，并以“磐石”呼应旷野事件中的特定对象。
- source_word: וַיָּז֣וּבוּ מַיִם
  choice: 水就涌出
  rationale: “涌出”传达水大量流出的鲜明动态；中文用集合名词“水”自然。
- source_word: וּנְחָלִים יִשְׁטֹפוּ
  choice: 溪流奔腾
  rationale: נְחָלִים 可指溪流或急流，יִשְׁטֹפוּ 描绘汹涌流动；“奔腾”保留强烈动态而不限定为泛滥。
- source_word: הֲגַם לֶחֶם יוּכַל תֵּת
  choice: 他也能赐下饼吗
  rationale: 以疑问句保留百姓怀疑上帝能力的反问语气；“也”承接此前赐水之事，“饼”保留具体食物意象。
- source_word: אִם
  choice: 分作并列的第二个问句
  rationale: 此处引出选择性或递进性的第二问；中文分句可自然呈现其修辞力度，而不机械译作“或”。
- source_word: יָכִין
  choice: 预备
  rationale: 保留希伯来词“使之准备好”的基本意义，同时在供给食物的语境中自然可懂。
- source_word: שְׁאֵר
  choice: 肉
  rationale: 该词字面指肉身或肉，此处与饼并列，所指最可能是可食用的肉。
- source_word: לְעַמּוֹ
  choice: 为他的百姓
  rationale: 准确表达为其人民供应之意；“百姓”符合诗篇历史与群体语境。
theological_decisions:
- issue: 以色列人怀疑的反问力度
  choice: 把末尾两小句译为连续的疑问句，明确呈现对上帝能否供应食物的质疑
  alternative: 译成较平直的陈述，或合并为“他也能赐饼、为百姓预备肉吗？”
  rationale: 疑问词 הֲ 与上下文支持反问理解；分成两个疑问句可保留希伯来文从饼到肉逐步推进的质疑语气，而不替说话者化解张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留诗歌性的强调；“涌出、奔腾”再现水流的动态。末句用两个连续问句表达原文的怀疑语气。
