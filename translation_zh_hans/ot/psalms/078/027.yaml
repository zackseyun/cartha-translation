- from: 他把肉像尘土一样降在他们身上，把有翅膀的飞鸟像海边的沙一样降下。[a]
  to: 他使肉如尘土般降在他们身上，使有翅的飞鸟如海边的沙[a]一般降下。
  rationale: 修订仅改善现代汉语句法和诗体平行，同时更明确保留“使……降下”的使役意义。正文仍以“海边的沙”自然表达原文习语，脚注在相应短语处说明原文“众海”的复数形式。
