lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: 降在……身上／降下
  rationale: 该词是 מטר 的使役形，表示“使……如雨降下”。中文用“降在……身上”和省略重复宾语后的“降下”，既保留如雨降落的意象，也较自然。
- source_word: עֲלֵיהֶם
  choice: 在他们身上
  rationale: 介词 עַל 加第三人称复数后缀，直指“在他们身上／到他们那里”；此处与“降”搭配自然。
- source_word: כֶּעָפָר
  choice: 像尘土一样
  rationale: 前缀 כְּ 表示比拟；“尘土”保留数量繁多、遍地散布的诗歌意象。
- source_word: שְׁאֵר
  choice: 肉
  rationale: שְׁאֵר 可指“肉体”或供食用的“肉”；旷野赐食的上下文中译作“肉”最自然，同时不必在正文中具体指明鹌鹑。
- source_word: וּכְחוֹל יַמִּים
  choice: 像海边的沙一样
  rationale: 原文直译为“像众海的沙”；这是表达浩瀚水域岸边沙粒无数的希伯来语说法。现代中文以“海边的沙”传达其惯用意义，并在脚注保留复数形式。
- source_word: עוֹף כָּנָף
  choice: 有翅膀的飞鸟
  rationale: 该组合字面为“有翅之鸟”，指能飞的鸟类；“有翅膀的飞鸟”保留原文略带强调的翅膀意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。首分句保留“像尘土”的比喻；次分句以“海边的沙”呈现希伯来语习语，并用脚注说明原文的复数形式。为避免中文中不自然的重复，第二分句承接前面的“他把”，但补出“降下”以使句法完整。
