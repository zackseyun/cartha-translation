  yaml_path: translation/ot/psalms/078/039.yaml
  text: He remembered that they were flesh[a], a wind that passes and does not return.
translation:
  language: zh_hans
  text: 他记得他们是血肉之躯[a]，是一阵去而不返的风。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是血肉之躯，是一口去而不返的气息。”希伯来语“רוּחַ”可指“风”“气息”或“灵”；这里最可能强调人的短暂和脆弱。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: 他顾念
  rationale: 该词是זכר的Qal叙事形式，语境中的主语是上帝。这里不只是想起事实，也含按人的脆弱处境加以体恤之意；“顾念”自然、庄重，并符合诗篇语境。
- source_word: כִּי בָשָׂר הֵמָּה
  choice: 他们不过是血肉之躯
  rationale: כִּי引出所顾念的内容。בָשָׂר直译为“肉”，此处强调人的受造、脆弱和必死性；“血肉之躯”保留具体意象，而“不过”在汉语中自然传达该句的限制意味。
- source_word: רוּחַ
  choice: 风
  rationale: רוּחַ可指风、气息或灵。此处与“吹过”和“不再返回”相连，主要描绘短暂易逝，因此正文采用“风”，同时以脚注保留“气息”的可能。
- source_word: הוֹלֵךְ
  choice: 吹过
  rationale: 该分词表示行去、经过。以风为意象时，“吹过”是自然的现代汉语，也鲜明表达转瞬即逝。
- source_word: וְלֹא יָשׁוּב
  choice: 便不再返回
  rationale: 未完成式在此可表达一般性的结果或将来意味。“不再返回”忠实保留原文的否定与返回意象；“便”使汉语诗句衔接自然。
theological_decisions:
- issue: 人的脆弱与רוּחַ的含义
  choice: 将本节理解为以“血肉”和“一阵不返回的风”描绘人的脆弱、必死和短暂。
  alternative: 把רוּחַ译为“灵”，并将本句理解为人的灵离去后不返回。
  rationale: 平行结构和直接语境侧重人的短暂与软弱，并未要求对灵魂或灵作技术性的教义陈述。译作“风”可避免把后来的系统性人论带入经文，同时脚注保留原词的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“顾念”兼顾记起与体恤的语境含义；“血肉之躯”保留原文具体意象；整句保持简洁和诗性，不把רוּחַ解释为专门的人论术语。
