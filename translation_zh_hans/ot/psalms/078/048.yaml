  text: He gave over their cattle to the hail[a], and their livestock to the lightning bolts.
translation:
  language: zh_hans
  text: 他把他们的牲畜交给冰雹，把他们的家畜交给闪电[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“烈焰”或“火矢”；希伯来语这个词可指燃烧或闪耀的毁灭力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: 交给
  rationale: סגר在此不是通常的“关闭”，而是“交出、任凭……处置”；“交给”自然地表达上帝使牲畜落入灾害之下。
- source_word: לַבָּרָד
  choice: 给冰雹
  rationale: בָּרָד明确指“冰雹”，前缀ל表示牲畜被交付给这一毁灭力量。
- source_word: בְּעִירָם
  choice: 他们的牲畜
  rationale: בְּעִיר泛指役畜或家畜；“牲畜”是现代汉语中自然且范围适当的集合称谓。
- source_word: וּמִקְנֵיהֶם
  choice: 他们的牛群
  rationale: מִקְנֶה指作为财产饲养的家畜、畜群；译作“牛群”与前句“牲畜”有所区分，同时保留诗歌平行中的语义重叠。
- source_word: לָרְשָׁפִים
  choice: 给火焰般的闪电
  rationale: רְשָׁפִים可指火焰、火矢或闪耀而有毁灭性的力量；结合冰雹灾害的气象语境，“火焰般的闪电”既呈现较可能的闪电含义，也保留原词的火焰色彩。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“交给”保留原文任凭灾害处置的力度；两组家畜称谓体现诗歌平行。“火焰般的闪电”避免把含义完全限定为单一气象现象，脚注列出真实的词义可能性。
