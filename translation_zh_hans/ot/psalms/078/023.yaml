  text: וַ/יְצַ֣ו שְׁחָקִ֣ים מִ/מָּ֑עַל וְ/דַלְתֵ֖י שָׁמַ֣יִם פָּתָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/023.yaml
  text: Yet he commanded the clouds above[b][a], and opened the doors of heaven.
translation:
  language: zh_hans
  text: 然而，他吩咐上面的云层[a]，又打开天上的门[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上面的高天”或“上面的天空”。
    reason: שְׁחָקִים可表示云层，也可表示天空或高天。
  - marker: b
    text: 直译：“天的门”（“门”为复数）；也可译作“天门”。
    reason: 希伯来文使用“门”的复数构词，描绘天被开启的诗歌意象。
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: צוה表示发出命令或吩咐；这里采用过去叙事语气。“吩咐”自然、庄重，也保留了上帝权威发令的意味。
- source_word: שְׁחָקִים
  choice: 云层
  rationale: שׁחקים既可指“云层”，也可指“天空”。下文描写天门敞开、吗哪降下，因此“云层”使诗歌意象具体，同时不排除其天空之义。
- source_word: מִמָּעַל
  choice: 上面的
  rationale: 该词表示“在上面／从上面”。它在此修饰“云层”，译作“上面的云层”符合现代汉语表达，并保留其空间方位。
- source_word: דַלְתֵי
  choice: 门
  rationale: דלת的通常意义是“门”，此处为复数构词形式。汉语“天上的门”可自然承载希伯来诗歌把天空描绘成有门可开的意象。
- source_word: שָׁמַיִם
  choice: 天上
  rationale: שמים可指天、天空或诸天；在“天上的门”这一结构中，“天上”自然庄重，也保留了诗句的高远意象。
- source_word: פָּתָח
  choice: 敞开
  rationale: פתח意为“打开”。“敞开”比单用“打开”略具诗体色彩，却没有额外加入猛烈或突然的意味。
- source_word: וַ
  choice: 然而
  rationale: 连接词ו本身可译为“于是／又／而”，但结合前文以色列人的不信和本节上帝仍然赐粮的反差，译作“然而”能清楚表达上下文的转折关系。
theological_decisions:
- issue: 句首ו在以色列人不信与上帝供应之间的篇章关系
  choice: 译作“然而”
  alternative: “于是”或“他又”
  rationale: 希伯来连接词本身语义宽泛；上下文却显出百姓不信与上帝仍施行供应之间的张力。“然而”表达这一篇章层面的转折，但不把它解释成某一特定教义立场。
- issue: שְׁחָקִים所指的是云层还是天空
  choice: 正文译“云层”
  alternative: “高天”或“天空”
  rationale: 本段涉及从天降下粮食，“云层”提供具体且连贯的自然意象；同时以脚注保留该词指“天空／高天”的真实可能性，避免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“吩咐……敞开……”保留两个并列的神圣行动；“上面的云层”较口语化但不失尊严，脚注则保存“高天”的诗性备选。
