  yaml_path: translation/ot/psalms/078/024.yaml
  text: He rained down manna on them to eat[a], and gave them the grain of heaven.
translation:
  language: zh_hans
  text: 他使吗哪如雨降在他们身上，给他们吃；又把天上的谷物[a]赐给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上的谷物”是对吗哪的诗意描述；也可较解释性地译作“从天上来的食物”，但原文直译为“天上的谷物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: 降下……如雨落在
  rationale: 该词为使役形式，意为“使之如雨降下”。此译法既保留降雨意象和使役含义，也符合现代汉语表达。
- source_word: עֲלֵיהֶם
  choice: 在他们身上
  rationale: 介词及代词后缀表达“在他们之上／身上”的方向关系；与“如雨落在”搭配自然。
- source_word: מָן
  choice: 吗哪
  rationale: 采用现代中文圣经语境中通行的音译，准确指以色列人在旷野所得的食物。
- source_word: לֶאֱכֹל
  choice: 给他们吃
  rationale: 带介词 ל 的不定式表示目的；补出隐含的受事者“他们”，使中文清楚自然。
- source_word: דְגַן
  choice: 五谷
  rationale: דְגַן 指谷物或粮谷。“五谷”在现代中文中自然且具有诗意，能保留原文将吗哪比作天上谷物的意象。
- source_word: שָׁמַיִם
  choice: 天上的
  rationale: 构成“天上的五谷”，既保留来源与诗性，也不将其解释性改写为“天粮”或“天上的食物”。
- source_word: נָתַן
  choice: 赐给
  rationale: נָתַן 的基本义为“给”。在以神为主语的庄重诗歌语境中，“赐给”自然，又不增加原文没有的神学含义。
- source_word: לָמוֹ
  choice: 他们
  rationale: 这是诗体中的第三人称复数代词形式，意为“给他们”；中文置于“赐给”之后最自然。
theological_decisions:
- issue: 将吗哪比作“天上的五谷”
  choice: 保留“五谷”这一诗性隐喻
  alternative: 译作“天上的食物”或“天粮”
  rationale: 原文明确使用 דְגַן（谷物），并与“吗哪”形成诗歌平行。保留隐喻可避免借相关经文中的“饼”或较宽泛的“食物”来解释本句。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“降下……如雨落在”保留希伯来文的降雨意象；“五谷”保留 דְגַן 的具体隐喻。脚注标记置于全节末尾，说明该诗性短语。
