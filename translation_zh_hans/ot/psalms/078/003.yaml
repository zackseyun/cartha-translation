  yaml_path: translation/ot/psalms/078/003.yaml
  text: that we have heard and known, and our fathers have told us—
translation:
  language: zh_hans
  text: 就是我们所听见、所知道的；我们的祖辈曾讲给我们听——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 是……的
  rationale: 承接上一节所说的内容，用现代汉语关系结构保留原文的从属衔接。
- source_word: שָׁמַעְנוּ וַנֵּדָעֵם
  choice: 我们所听见、所知道的
  rationale: 分别保留“听见”和“知道”两个并列动作，不把二者合并或解释为更具体的认识方式。
- source_word: אֲבוֹתֵינוּ
  choice: 我们的祖辈
  rationale: 此处强调代际传承；“祖辈”比现代汉语中的“父亲们”更自然，也能涵盖希伯来语在此语境中的先辈含义。
- source_word: סִפְּרוּ לָנוּ
  choice: 讲给我们听
  rationale: 体现主动讲述和口传性质，符合诗篇所述由上一代传给下一代的语境。
theological_decisions:
- issue: 代际信仰传承的主体范围
  choice: 祖辈
  alternative: 父辈／列祖
  rationale: 选择不局限于亲生父亲，也不额外赋予“列祖”可能带出的特定族长称谓，保留一般性的世代传承。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所听见、所知道”保留诗歌的平行节奏；末尾破折号承接下一节，反映句意尚未完结。
