id: PSA.78.50
reference: Psalms 78:50
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְפַלֵּ֥ס נָתִ֗יב לְ/אַ֫פּ֥/וֹ לֹא חָשַׂ֣ךְ מִ/מָּ֣וֶת נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם לַ/דֶּ֥בֶר הִסְגִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/050.yaml
  text: He leveled a path for his anger[a]; he did not spare their soul from death[c][b], but gave over their life to the plague.
translation:
  language: zh_hans
  text: 他为自己的怒气铺平道路[a]；他不使他们的性命免于死亡[b]，反而把他们的生命交给瘟疫[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为自己的烈怒开辟道路。”
    reason: lexical_alternative
  - marker: b
    text: “性命”原文直译可作“他们的魂”；这里指他们的生命。
    reason: lexical_alternative
  - marker: c
    text: “瘟疫”也可译作“疫病”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַלֵּס נָתִיב
  choice: 铺平道路
  rationale: פִּלֵּס的强意词干在此有修平、开辟之意，与“道路”搭配，保留怒气循路而行的具体诗歌意象。
- source_word: לְאַפּוֹ
  choice: 为自己的怒气
  rationale: אַף字面与“鼻子”有关，此处是常见的“怒气”义；第三人称后缀译为“自己的”，清楚指向上帝。
- source_word: לֹא חָשַׂךְ מִמָּוֶת
  choice: 不使……免于死亡
  rationale: חָשַׂךְ与介词מִן构成“不使免于、不保全脱离”的意思，直接保留原文的否定表达。
- source_word: נַפְשָׁם
  choice: 他们的性命
  rationale: נֶפֶשׁ在此指会死亡的生命，而不是特指非物质的灵魂；“性命”既贴近语义，又适合“免于死亡”的搭配。
- source_word: וְחַיָּתָם
  choice: 他们的生命
  rationale: חַיָּה在此与נֶפֶשׁ平行，指活着的生命或生存状态；“生命”保留这种平行，同时避免机械重复“性命”。
- source_word: לַדֶּבֶר
  choice: 给瘟疫
  rationale: דֶּבֶר指造成广泛死亡的疫病，审判语境中译作“瘟疫”准确而自然。
- source_word: הִסְגִּיר
  choice: 交给
  rationale: סגר的使役形在此表示交出、任由某种势力处置；“交给”简洁地表达主动交付。
theological_decisions:
- issue: 上帝审判的拟人化表达
  choice: 保留“为自己的怒气铺平道路”的比喻
  alternative: 让自己的怒气畅行；发尽自己的怒气
  rationale: 原文把怒气描绘成沿道路前行，保留这一意象可传达诗句的力度，也不添加原文没有明说的神学解释。
- issue: נֶפֶשׁ的含义
  choice: 译作“性命”
  alternative: 灵魂
  rationale: 死亡与瘟疫的上下文表明这里谈的是人的有死生命；译作“灵魂”容易带入原词在本句中并不要求的身心二分观念。
- issue: 两个生命用语的平行关系
  choice: 分别译作“性命”和“生命”
  alternative: 两处均译作“生命”；译作“灵魂”和“生命”
  rationale: 原文使用两个相近而不完全相同的词。中文以近义词保留平行与细微差异，同时不把差异扩大成关于灵魂本体的主张。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“铺平道路”保存希伯来诗歌的具体意象；“反而”明确后半句与前半句的语义转折，但不增添因果解释。“性命／生命”自然呈现平行结构，并避免把נֶפֶשׁ误解为专指非物质灵魂。
