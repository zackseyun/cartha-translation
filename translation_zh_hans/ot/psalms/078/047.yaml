    reason: lexical_alternative
lexical_decisions:
- source_word: יַהֲרֹג
  choice: 摧毁
  rationale: 该动词通常意为“杀死、击杀”，但这里的宾语是葡萄树和桑无花果树；译作“摧毁”既符合现代汉语习惯，也保留其强烈的毁灭意味。
- source_word: בַּבָּרָד
  choice: 用冰雹
  rationale: 介词 בְּ 在此表示手段；“用冰雹”自然地传达冰雹是毁坏葡萄树的媒介。
- source_word: גַּפְנָם
  choice: 他们的葡萄树
  rationale: גֶּפֶן 是带复数所属后缀的集合性单数，指葡萄藤本身，而不是葡萄园这片土地；“葡萄树”是普通读者熟悉的说法。
- source_word: וְשִׁקְמוֹתָם
  choice: 他们的桑无花果树
  rationale: שִׁקְמָה 指结无花果状果实的桑科树木（sycomore fig）。译作“桑无花果树”比可能让现代读者联想到悬铃木的“西克莫无花果树”或“悬铃木”更准确。
- source_word: בַּחֲנָמַל
  choice: 用严霜
  rationale: חֲנָמַל 是仅见于此处的罕见词，词义不确定。上下句平行，且语境是农作物受灾，因此正文采用传统且语境通顺的“严霜”，同时以脚注保留其他主要解释。
