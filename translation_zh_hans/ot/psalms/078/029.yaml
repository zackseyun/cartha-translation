  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׂבְּע֣וּ מְאֹ֑ד וְ֝/תַֽאֲוָתָ֗/ם יָבִ֥א לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/029.yaml
  text: So they ate and were very full[a], and he brought them what they craved.
translation:
  language: zh_hans
  text: 他们吃了，吃得十分饱；他把他们所渴求的[a]带给了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的欲望”或“他们的渴望”。希伯来词可指抽象的欲望，也可指所欲求之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: 他们就吃了
  rationale: 这是 אָכַל（吃）的 Qal 叙事形式；译作“吃了”自然、直接。“就”承接上文的叙事进展。
- source_word: וַיִּשְׂבְּעוּ מְאֹד
  choice: 而且吃得非常饱
  rationale: שׂבע 表示吃饱、饱足，מְאֹד 加强程度。“吃得非常饱”既保留进食的具体意象，也符合现代汉语表达。
- source_word: תַאֲוָתָם
  choice: 他们所贪求的
  rationale: תַּאֲוָה 可指欲望、渴求，也可按语境指所渴求之物。这里以“所贪求的”自然地表达对象含义，同时保留本诗上下文对其欲求的负面色彩。
- source_word: יָבִא לָהֶם
  choice: 他把……赐给了他们
  rationale: בוא 的 Hiphil 形式可表示使某物来到、带来；此处隐含主语是上帝。“赐给”符合上帝供应食物的语境，并以自然汉语表达“使之临到他们”。
theological_decisions:
- issue: יָבִא 的隐含主语
  choice: 以“他”表达，按上下文指上帝
  alternative: 译成非人称的“他们所贪求的临到了他们”
  rationale: 该动词是使役形式，且诗篇叙事中上帝是供应食物的行动者。保留代词“他”既反映隐含施事者，也不在正文中额外增补“上帝”。
- issue: תַאֲוָתָם 的评价色彩
  choice: 译作“他们所贪求的”
  alternative: 译作较中性的“他们所想要的”或抽象的“他们的欲望”
  rationale: “贪求”保留 תַּאֲוָה 在本诗责备语境中可能带有的不当欲求色彩，但未将其强化为特定性质的“邪欲”或“情欲”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句式简洁，保留希伯来文两个连续动作以及后半句上帝作为隐含行动者的结构。
