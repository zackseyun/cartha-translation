  yaml_path: translation/ot/psalms/078/013.yaml
  text: He split the sea and made them pass through[c][b][a]; he made the waters stand like a heap.
translation:
  language: zh_hans
  text: 他劈开海，使他们从中经过；他使众水立起，如同堆垒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堆垒”也可译“一堆”；原文指堆积起来的一团。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַע
  choice: 劈开
  rationale: 该动词表示劈开、裂开；“劈开”生动自然，并保留原文强烈的动作感。
- source_word: יָם
  choice: 海
  rationale: 原文诗句虽未带冠词，但出埃及传统的语境清楚指向以色列人经过的海；不擅自具体化为“红海”。
- source_word: וַיַּעֲבִירֵם
  choice: 使他们从中经过
  rationale: 保留使役词形的含义；补出“从中”符合汉语表达，也清楚呈现他们经过被劈开的海。
- source_word: וַיַּצֶּב
  choice: 使……立起
  rationale: 保留动词使水站立、稳立的使役意象，而不弱化为较抽象的“挡住”。
- source_word: מַיִם
  choice: 众水
  rationale: “众水”以庄重而可懂的现代汉语保留希伯来文复数集合名词的诗歌色彩。
- source_word: כְּמוֹ
  choice: 如同
  rationale: 直接表达比较关系，语体自然庄重。
- source_word: נֵד
  choice: 垒起的水堆
  rationale: נֵד指堆积起来的一团或一堆；“垒起的水堆”保留水聚集成堆的具体图像，且比单说“堆”更自然清楚。
theological_decisions:
- issue: 海水神迹的图像和性质
  choice: 保留“使众水立起，如同垒起的水堆”这一具体图像，不解释其机制。
  alternative: 意译为“挡住众水”，或把它明确解释成一道墙。
  rationale: 原文以具体而富诗意的语言描述上帝的作为。译文不把图像弱化为抽象结果，也不替文本裁定其物理机制或诗歌性质。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“劈开海”保留原文力度；“众水立起”保留诗歌的拟人化和神迹意象。将脚注置于相关短语之后。
