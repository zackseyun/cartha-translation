  text: וְ/יָשִׂ֥ימוּ בֵֽ/אלֹהִ֗ים כִּ֫סְלָ֥/ם וְ/לֹ֣א יִ֭שְׁכְּחוּ מַֽעַלְלֵי אֵ֑ל וּ/מִצְוֺתָ֥י/ו יִנְצֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/007.yaml
  text: so that they might set their hope in God and not forget the deeds of God[b][a], but keep his commandments.
translation:
  language: zh_hans
  text: 好让他们把盼望[a]寄托在上帝身上，不忘记上帝的作为[b]，并谨守他的诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“信心”或“信赖”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“上帝的事迹”或“上帝的工作”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׂימוּ
  choice: 好让他们把……寄托
  rationale: שׂים的基本义是“放置、安放”。这里承接上文的目的关系，以“好让”表达未完成式在语境中的目的含义；与“盼望”搭配时，“寄托”是自然的现代汉语。
- source_word: בֵאלֹהִים
  choice: 在上帝身上
  rationale: 介词ב在此标明信赖所指向的对象；“把盼望寄托在上帝身上”准确而自然。
- source_word: כִּסְלָם
  choice: 他们的盼望
  rationale: כֶּסֶל在此可表示盼望、信心或信赖。“盼望”符合诗篇劝勉后代仰赖上帝的语境，同时以脚注保留其他可能译法。
- source_word: וְלֹא יִשְׁכְּחוּ
  choice: 不忘记
  rationale: 直接表达否定的Qal未完成式，并与前面的目的关系连贯衔接。
- source_word: מַעַלְלֵי אֵל
  choice: 上帝的作为
  rationale: מַעֲלָלִים指所行的事、作为或行动；“作为”庄重、清楚，也适合诗歌语体。
- source_word: וּמִצְוֺתָיו
  choice: 他的诫命
  rationale: מִצְוֹת意为命令、诫命；“诫命”保留经文中的立约与教导语域。
- source_word: יִנְצֹרוּ
  choice: 谨守
  rationale: נצר有守护、保守、遵守之意。以诫命为宾语时，“谨守”既自然，也保留认真守护并遵行的意味。
theological_decisions:
- issue: 平行诗句中אֱלֹהִים与אֵל两个神圣称谓的译法
  choice: 两者均译为“上帝”
  alternative: 将אֵל译为“大能者”或“全能的上帝”
  rationale: 本节以两个常见的希伯来语神圣称谓构成诗歌平行，并未使用圣约名יהוה。统一译为“上帝”保留其基本所指，也避免加入原文没有特别强调的称谓差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好让”呈现承接上文的目的关系；“寄托在……身上”符合现代汉语搭配；“谨守”保留诗篇劝诫语气及נצר所含的守护、遵行意味。
