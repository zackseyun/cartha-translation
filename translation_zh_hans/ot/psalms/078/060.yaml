  text: וַ֭/יִּטֹּשׁ מִשְׁכַּ֣ן שִׁל֑וֹ אֹ֝֗הֶל שִׁכֵּ֥ן בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/060.yaml
  text: So he abandoned the tabernacle of Shiloh[b][a], the tent where he dwelt among mankind.
translation:
  language: zh_hans
  text: '于是，他离弃了示罗的圣幕，

    就是他在人间所设立的帐棚。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就是他在人间居住的帐棚。”
    reason: 原文动词为强意形式，可理解为“使居住、设立”；在上下文中，也可理解为神在人间借这帐棚居住。
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: 离弃
  rationale: 该动词表示撇下、弃置；“离弃”既保留神撤离圣所的强烈意味，又符合庄重的诗歌语体。
- source_word: מִשְׁכַּן
  choice: 圣幕
  rationale: מִשְׁכָּן指神居住的帐幕性圣所。“圣幕”能体现其礼仪和历史含义，并与下半句的“帐棚”有所区别。
- source_word: שִׁלֹה
  choice: 示罗
  rationale: 采用该地名在现代中文圣经传统中通行的译名。
- source_word: אֹהֶל
  choice: 帐棚
  rationale: 直译为“帐棚”，与“圣幕”形成希伯来诗歌中的同义复述，同时不把两个不同的原词完全合并。
- source_word: שִׁכֵּן
  choice: 安置
  rationale: 这是שׁכן的强意词干形式，可表达“使居住、安置”。在本句中把“帐棚”理解为所安置之物，译作“安置”较贴近其及物形式。
- source_word: בָּאָדָם
  choice: 在人间
  rationale: אָדָם在此为集合性用法，指人类。“在人间”自然、简洁，也适合诗体，不会被误解为只指男性。
theological_decisions:
- issue: שִׁכֵּן所表达的安置或居住
  choice: 他安置在人间的帐棚
  alternative: 他在人间居住的帐棚
  rationale: 原文使用强意词干，形式上更容易理解为“使……居住、安置”，因此正文保留及物意味；但上下文显然关联神在人类中间的临在，传统上也可按此译为神“居住”的帐棚，故收入脚注，不把语法与神学意象之间的张力静默消除。
- issue: אָדָם的范围
  choice: 人间
  alternative: 人类中间
  rationale: 这里不是指某一个男子，而是泛指人类。“人间”准确传达集合意义，并保持诗句凝练。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“圣幕／帐棚”保留原文平行句中两个名词的区别；“在人间”比“在人类中间”更凝练自然。
