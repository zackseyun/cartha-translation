  text: וַ/יִּסֹּ֣גוּ וַֽ֭/יִּבְגְּדוּ כַּ/אֲבוֹתָ֑/ם נֶ֝הְפְּכ֗וּ כְּ/קֶ֣שֶׁת רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/057.yaml
  text: But they turned back and acted treacherously like their fathers[a]; they turned aside like a deceitful bow.
translation:
  language: zh_hans
  text: 他们却退后，像他们的父辈一样背信行事；他们像一张诡诈的弓一样转偏了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“松弛的弓”或“有毛病的弓”，即一张不能可靠地射准的弓。
    reason: רְמִיָּה在这里可按“诡诈”理解，也可能描述弓的松弛、失准或不可靠。
lexical_decisions:
- source_word: וַיִּסֹּגוּ
  choice: 退后
  rationale: סוּג表示从原先的道路退回或转离；“退后”简洁保留了逆转、退却的动态，也避免加入“背道”等后期神学术语。
- source_word: וַיִּבְגְּדוּ
  choice: 行事诡诈
  rationale: בגד常指背信、欺诈或背叛。“行事诡诈”保留其道德与关系层面的严重性，同时不擅自补出行为的对象。
- source_word: כַּאֲבוֹתָם
  choice: 像他们的父辈一样
  rationale: 原文直译为“像他们的父亲们”；“父辈”在现代汉语中自然地表达先前世代，并保留原词的男性家族称谓。
- source_word: נֶהְפְּכוּ
  choice: 偏离了
  rationale: הפך在此与弓的比喻相连，表达转向、变向或不再循着正确方向；“偏离了”既自然，也保留结果未明说的简略性。
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: 如同一张诡诈的弓
  rationale: קֶשֶׁת是“弓”；רְמִיָּה可指诡诈、松弛或不可靠。“诡诈的弓”保留原文鲜明的拟人化及词义张力，其他可行理解收入脚注。
theological_decisions:
- issue: 以色列不忠行为的圣约含义
  choice: 用“行事诡诈”表达背信的道德与关系分量，但不明说其对象或添加“违背圣约”。
  alternative: 译作“对上帝不忠”或“背弃了圣约”。
  rationale: 全诗语境涉及以色列对上帝的不忠，但本节动词本身没有明列对象，也没有出现“圣约”一词；译文应保留其含义力度而不作超出原文的神学扩展。
- issue: 弓的比喻所强调的性质
  choice: 正文保留“诡诈的弓”，借脚注说明其可能指松弛、有毛病或不能可靠射准的弓。
  alternative: 直接译作“失准的弓”或“靠不住的弓”。
  rationale: רְמִיָּה的词义容许“诡诈”和“松弛、不可靠”等理解；正文与脚注结合可保留这种真实的词汇歧义，而不把比喻限定为单一机械故障。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“父辈”较“列祖”更便于普通现代读者理解；保留“诡诈的弓”这一略带陌生感的比喻，并用脚注澄清其具体形象。
