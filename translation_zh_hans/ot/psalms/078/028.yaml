  text: 他使它落在他们营地中间[a]，落在他们住处的四周。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的营”和“他的住处”；单数后缀很可能把以色列全体视为一个集合，因此正文译作“他们的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: 他使它落下
  rationale: נפל的使役式表达使某物落下；宾语承接上文神所送来的飞鸟，汉语以“它”自然补出。正文结合后接地点，译作“使它落在”。
- source_word: בְּקֶרֶב
  choice: 在……中
  rationale: 表示内部位置，即落在营地之内；“在……中”准确而自然。
- source_word: מַחֲנֵהוּ
  choice: 他们的营
  rationale: 原文后缀在形态上是第三人称阳性单数，但所指的以色列是集合体；现代汉语用复数“他们的”较自然，同时以脚注保留原文形式。
- source_word: סָבִיב
  choice: 遍布在……周围
  rationale: 该词表示四周、环绕；与使役落下的语境结合，“遍布在……周围”传达鸟落在住处四围的广泛分布。
- source_word: לְמִשְׁכְּנֹתָיו
  choice: 在他们的住处周围
  rationale: מִשְׁכָּן在此泛指居住之处，不宜收窄为“帐棚”；לְ与סָבִיב合用表达围绕住处的位置。物主后缀按集合意义译作“他们的”。
