  text: כִּ֤י לֹ֣א הֶ֭אֱמִינוּ בֵּ/אלֹהִ֑ים וְ/לֹ֥א בָ֝טְח֗וּ בִּֽ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/022.yaml
  text: because they did not believe in God, and did not trust in his salvation.
translation:
  language: zh_hans
  text: 因为他们不信靠上帝，也不倚靠他的拯救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ בֵּאלֹהִים
  choice: 信靠上帝
  rationale: 希伯来语动词 אמן 的使役式在此与介词 ב 连用，表达相信并信赖的意思；“信靠上帝”既保留介词所体现的对象关系，也符合现代汉语表达。
- source_word: בָטְחוּ
  choice: 倚靠
  rationale: בטח 表示信赖、依靠；译作“倚靠”可与前句“信靠”形成近义平行，同时保留诗句措辞的变化。
- source_word: בִּישׁוּעָתוֹ
  choice: 他的拯救
  rationale: יְשׁוּעָה 在这里指上帝所施行的救助或拯救；“他的拯救”保留原文名词结构及其一定的语义宽度。
theological_decisions:
- issue: “相信上帝”还是“信靠上帝”
  choice: 信靠上帝
  alternative: 相信上帝
  rationale: 原文使用 הֶאֱמִינוּ 与介词 ב，语境不只涉及承认上帝真实，也涉及对他的信赖；“信靠”较准确地传达这一关系含义，并与下句构成平行。
- issue: יְשׁוּעָה 的表达
  choice: 他的拯救
  alternative: 他的救恩
  rationale: “拯救”在本诗叙述以色列旷野经历的语境中较为具体自然，也避免把该词无必要地限定为后来的系统神学术语；同时不排除其更广的神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文表达。保留原文两个否定分句及近义平行结构，以“信靠／倚靠”体现措辞变化。
