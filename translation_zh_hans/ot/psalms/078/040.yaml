base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/040.yaml
  text: How often they rebelled against him in the wilderness and grieved him in the wasteland![a][b]
translation:
  language: zh_hans
  text: 他们在旷野一次又一次地[a]悖逆他，在荒漠使他忧伤[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们在旷野多少次悖逆他。”开头的表达着重指出他们一再悖逆。
    reason: lexical_alternative
  - marker: b
    text: “使他忧伤”也可译作“使他痛苦”或“使他烦恼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: 多少次
  rationale: 在感叹性的回顾中强调屡次发生的行为；“多少次”既保留原文近似问句的形式，也自然表达反复之意。
- source_word: יַמְרוּהוּ
  choice: 悖逆他
  rationale: מרה 的使役词干形式在此表达对上帝的反抗和不顺从；“悖逆”准确、凝练，并符合庄重的诗体语域。
- source_word: בַמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר 指以色列人漂流经过的荒野地区；“旷野”保留其圣经地理背景，且不把它狭义化为沙漠。
- source_word: יַעֲצִיבוּהוּ
  choice: 使他忧伤
  rationale: עצב 的使役形式可指使人痛苦、忧伤或烦恼；“使他忧伤”自然地传达关系性和情感性的伤害。
- source_word: בִּישִׁימוֹן
  choice: 在荒漠
  rationale: יְשִׁימוֹן 指荒凉、无人烟之地；“荒漠”与“旷野”相互平行而不完全重复，保留两个希伯来词的差异。
theological_decisions:
- issue: יַעֲצִיבוּהוּ 对上帝使用拟人情感语言
  choice: 在正文中保留“使他忧伤”
  alternative: 使他痛苦；使他烦恼
  rationale: 原文以人的情感语言描述以色列的行为给上帝带来的真实关系性冒犯。译文不将其淡化为纯粹客观的“惹怒”或“触犯”，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“旷野”与“荒漠”保留平行结构及两个近义地理词之间的细微区别；感叹号体现原句回顾性的哀叹语气。
