  yaml_path: translation/ot/psalms/078/016.yaml
  text: He brought streams out of the rock and made water flow down like rivers[a].
translation:
  language: zh_hans
  text: 他使水流从磐石中涌出，使水如江河般流下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: 使……涌出
  rationale: 该词是יצא的使役式，表示上帝使某物出来；“使……涌出”既保留使役含义，也符合水从磐石出来的自然汉语表达。
- source_word: נוֹזְלִים
  choice: 水流
  rationale: 该分词指流动之物，结合本节后半的“水”和旷野出水语境，译作“水流”清楚自然，同时保留流动意象。
- source_word: מִסָּלַע
  choice: 从磐石中
  rationale: סלע指岩石或岩壁；“磐石”适合庄重诗体，也自然呼应旷野磐石出水的叙事背景。
- source_word: וַיּוֹרֶד
  choice: 使……流下
  rationale: 该词是ירד的使役式，直义为“使下降”；用于水时，“使……流下”既保留使役性，也符合现代汉语搭配。
- source_word: כַּנְּהָרוֹת
  choice: 如江河般
  rationale: 前缀כ表示比较，נהרות为“江河”的复数；此译明确保留明喻和水量浩大的诗意。
- source_word: מָיִם
  choice: 水
  rationale: מָיִם虽在希伯来语中具有复数形态，此处作物质名词，现代汉语译作“水”最自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；两个“使”对应原文连续的使役动词，并保留“水流—江河”的意象递进。原文נוֹזְלִים可较直译为“流动之物／流水”，正文选“水流”已充分呈现其语义，因此不另设脚注。
