  text: וַ/יַּנְחֵ֣/ם בֶּ/עָנָ֣ן יוֹמָ֑ם וְ/כָל הַ֝/לַּ֗יְלָה בְּ/א֣וֹר אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/014.yaml
  text: He led them with a cloud by day[a], and all the night with the light of fire.
translation:
  language: zh_hans
  text: 白天，他用云彩引导他们；整夜，他用火光引导他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“白天，他借着云彩带领他们；整夜，借着火光带领他们。”
    reason: 词汇与表达方式的替代译法：נחה可译“带领”或“引导”，介词ב可表达“用、借着”。
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: 他……引导他们
  rationale: נחה的使役式在此带第三人称阳性复数宾语后缀，意为“带领、引导他们”。“引导”自然地表达神在旷野中为以色列人指引方向，也不超出原文。
- source_word: בֶּעָנָן
  choice: 用云彩
  rationale: 介词ב在语境中表示工具或方式，即借着云彩引导。“用云彩”在现代汉语中简洁自然，并保留原文意象。
- source_word: יוֹמָם
  choice: 白天
  rationale: 这是表示时间的副词用法，意为“在白天”。译作“白天”简练，并与后半句“整夜”形成对应。
- source_word: וְכָל הַלַּיְלָה
  choice: 整夜
  rationale: 原文直指“整个夜晚”。“整夜”既保留时间范围的完整性，也符合现代汉语表达。
- source_word: בְּאוֹר אֵשׁ
  choice: 用火光
  rationale: 该短语字面为“以火的光”。“火光”保留“火”与照明的含义，且比“用火的光”更自然。后半句补出“引导他们”，是为汉语清晰而承接上文谓语，并未增加新的动作。
theological_decisions:
- issue: 旷野中云彩与火光的引导意象
  choice: 按历史叙述译为神白天用云彩、夜间用火光引导以色列人，不在正文中增添解释。
  alternative: 在正文中将云彩和火光明确作预表性或教义性阐释。
  rationale: 本节本身是在回述出埃及与旷野引导的事件。翻译应保留这一叙述，不把经文未明说的预表解释加入正文。
- issue: 后半句省略谓语
  choice: 在“整夜”之后补出“他用火光引导他们”。
  alternative: 保留省略，译作“整夜都有火光”。
  rationale: 希伯来文后半句承接前面的“引导他们”。现代汉语补出谓语和宾语，可清楚呈现原有句法关系，同时避免误解为仅仅描述火光存在。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“白天／整夜”形成清晰对称；分号呈现希伯来诗句的两个平行分句。脚注标记置于整节末尾，对应整句的词汇替代译法。
