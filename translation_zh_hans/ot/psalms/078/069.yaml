  source_fidelity: 译文总体保留了两个比较、圣所、大地及“永远”的核心意象；但“如他奠定到永远的大地”在现代汉语中修饰关系和“永远”的语义辖域不够清楚。希伯来文的阴性宾语后缀可回指“大地”，此处宜明确为“他所奠立的大地”，同时让“永远”表达其长存、稳固的意涵，而不把它误读为单指奠基动作持续到永远。
