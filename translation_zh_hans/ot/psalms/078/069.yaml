  terminology: “圣所”恰当，既对应מִקְדָּשׁ，也不不当窄化为特定圣殿。“高处”可保留רָמִים的凝练与歧义，避免正文断定为“高天”或山岳。“奠立”适合对应יסד；脚注应给出真正可行的替代措辞。
