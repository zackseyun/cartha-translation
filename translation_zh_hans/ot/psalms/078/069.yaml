  text: וַ/יִּ֣בֶן כְּמוֹ רָ֭מִים מִקְדָּשׁ֑/וֹ כְּ֝/אֶ֗רֶץ יְסָדָ֥/הּ לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/069.yaml
  text: And he built his sanctuary like the heights[b][a], like the earth that he established forever.
translation:
  language: zh_hans
  text: 他建造自己的圣所，如同高处一般[a]，又如他所奠立、永远稳固的大地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如高天一般”或“如巍峨的高处一般”。希伯来语富有诗意，可能使人联想到高天或山岳。
    reason: lexical_alternative
  - marker: b
    text: 或译：“又如他所奠立、直到永远的大地。”此处的“永远”表达大地经神奠立而长存、稳固的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 他建造
  rationale: 保留叙事推进和“建造”的直接含义；汉语中无需机械译出连接词也能承接上文。
- source_word: כְּמוֹ רָמִים
  choice: 如高处一般
  rationale: “高处”保留诗句中崇高、在上的意象，同时不把所指限定为高天或山岳。
- source_word: מִקְדָּשׁוֹ
  choice: 自己的圣所
  rationale: “圣所”准确涵盖献作神圣用途的居所，不将含义过早限定为某一具体圣殿建筑；“自己的”清楚表达第三人称所有关系。
- source_word: כְּאֶרֶץ
  choice: 如……大地
  rationale: 此处与崇高意象构成宇宙性的诗歌对仗，“大地”比“土地”更合适。
- source_word: יְסָדָהּ
  choice: 他奠定
  rationale: 该动词的基本意义是立下根基、奠定；这里保留建筑性意象，并与圣所的稳固相呼应。
- source_word: לְעוֹלָם
  choice: 到永远
  rationale: 自然表达持续、长久不移的诗意，同时保留原文的永久性力度。
theological_decisions:
- issue: 圣所与רָמִים的比较意象
  choice: 译作“如高处一般”，不明确限定具体所指
  alternative: “如高天一般”或“如巍峨的山岳一般”
  rationale: 原文意象凝练而具有多义性，可能令人联想到高天或高山。正文保留这种张力，避免添加原文未明确规定的宇宙观或山岳解释。
- issue: 圣所与大地之比较的重点
  choice: 保留“大地”以及“奠定到永远”的表述
  alternative: 意译为“像永远稳固的大地”
  rationale: 直陈神奠定大地，既保存神的行动主体，也保留圣所稳定长存的神学诗意，不把比喻完全解释化。
translation_notes:
  register: 采用现代、庄重而可诵读的诗歌体汉语。“使它……又如……”明确两个比较都修饰圣所；措辞尽量贴近希伯来语的建筑与宇宙意象，并借脚注保存רָמִים及יסד表达上的可能译法。
