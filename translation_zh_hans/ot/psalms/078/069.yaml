revisions:
- from: 他建造自己的圣所，使它如高处一般[a]，又如他奠定到永远的大地[b]。
  to: 他建造自己的圣所，如同高处一般[a]，又如他所奠立、永远稳固的大地[b]。
  rationale: 修订保留原文的圣所、高处与大地的双重比较，也不在正文判定“高处”究竟指高天还是山岳。将末句改为自然的定语结构，明确大地是神所奠立，并以“永远稳固”传达לְעוֹלָם在此诗歌比较中的持久性。
