  text: Man ate the bread of the mighty[a]; he sent them provisions to the full.
translation:
  language: zh_hans
  text: 人吃了大能者的饼[a]；他把充足的粮食送给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天使的饼。”希伯来文更直译为“大能者的饼”或“大能者们的饼”。
    reason: alternative_reading
lexical_decisions:
- source_word: לֶחֶם
  choice: 饼
  rationale: 保留“饼”的具体意象；此处指可食之物，但不宜泛化为“食物”而失去诗歌画面。
- source_word: אַבִּירִים
  choice: 大能者
  rationale: 该词直接表示强者、大能者；原文并未明确说“天使”，因此正文保留其词义和指称上的张力。
- source_word: אָכַל
  choice: 吃了
  rationale: 完成式在此诗体叙事中自然表达为过去发生的动作。
- source_word: אִישׁ
  choice: 人
  rationale: 单数在这里具有泛指、代表性意义；“人”既保留单数形式，也符合现代汉语表达。
- source_word: צֵידָה
  choice: 食物
  rationale: 本词指为需要而供应的粮食或口粮；译作“食物”自然清楚，并与前句具体的“饼”有所区别。
- source_word: שָׁלַח
  choice: 赐下
  rationale: 基本义是“送出、送来”；结合上帝从天供应食物的语境，“赐下”在汉语中自然且不改变施予方向。
- source_word: לָהֶם
  choice: 他们
  rationale: 作为接受供应的间接宾语，在“使他们饱足”这一汉语结构中自然呈现。
- source_word: לָשֹׂבַע
  choice: 使他们饱足
  rationale: 该短语表示达到饱足、满足的程度；如此翻译清楚表达供应充足的结果。
theological_decisions:
- issue: “אַבִּירִים之饼”的所指
  choice: 正文译作“大能者的饼”
  alternative: “天使的饼”或“大能者们的饼”
  rationale: 虽然传统解释常因吗哪与天上供应的背景将其理解为“天使的饼”，但希伯来词本身并不明确等于“天使”。正文采用较直接的词义，脚注保留传统理解，以免消解原文的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。正文保留诗句的两分结构，并以脚注呈现“天使”这一古老而常见的解释。
