source:
  edition: WLC
  text: לֹא זָכְר֥וּ אֶת יָד֑/וֹ י֝֗וֹם אֲֽשֶׁר פָּדָ֥/ם מִנִּי צָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/042.yaml
  text: They did not remember his hand[b][a], the day when he redeemed them from the foe.
translation:
  language: zh_hans
  text: 他们不记得他的手[a]，也不记得他救赎他们脱离仇敌[b]的那一天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的能力”，或“他手所行的事”。希伯来原文直译为“他的手”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“敌人”或“敌对者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרוּ
  choice: 记得
  rationale: Qal 形表示“记得、记念、回想”。与否定词 לֹא 连用，译作“不记得”既贴近原文，也比“忘了”更少解释性。
- source_word: יָדוֹ
  choice: 他的手
  rationale: 原文直译为“他的手”，是表示能力或作为的具体比喻。正文保留这一意象，并以脚注说明其含义。
- source_word: יוֹם אֲשֶׁר
  choice: ……的那一天
  rationale: 保留原文的时间名词“日”，同时用现代汉语定语结构自然表达“他……的那一天”。
- source_word: פָּדָם
  choice: 救赎他们
  rationale: פדה 可指付代价赎回，也可指从奴役或危难中解救。出埃及的历史语境使“救赎”既能保留词义分量，也不把它泛化为单纯的“解救”。
- source_word: מִנִּי צָר
  choice: 从仇敌手中
  rationale: צָר 指敌对者、仇敌或压迫者。“从仇敌手中”是自然的现代汉语表达；其中“手中”是汉语表示脱离某人控制的惯用补足，并非把原文前面的 יָדוֹ 重复译出。
theological_decisions:
- issue: “他的手”的比喻意义
  choice: 正文保留“他的手”
  alternative: 他的能力；他手所行的事
  rationale: “手”是圣经希伯来语中常见的能力与行动意象。现代汉语虽略带诗性，却仍可理解；保留它可避免将原文的具体意象直接化为抽象解释。
- issue: 出埃及语境中 פדה 的译法
  choice: 救赎
  alternative: 赎回；解救
  rationale: 本节回顾上帝使以色列脱离压迫的作为。“救赎”保留 פדה 所含的赎回与拯救色彩，但不在正文中引入超出本节的后期教义说明。
- issue: “他的手”与“那一天”的句法关系
  choice: 用“也不记得”把两个宾语并列呈现
  alternative: 他们不记得他的手，就是他……的那一天；他们在他……的那一天不记得他的手
  rationale: 希伯来文在“他的手”之后直接接“他……的那一天”，没有连接词，句法较为凝缩。将二者处理为同受“记得”支配的并列内容，符合诗歌省略连接成分的可能性，也使汉语清楚；没有把“那一天”误说成“他的手”的同位语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不记得”保留原文重复回顾、指责遗忘的语气；“仇敌”符合诗篇语体而不过度古雅。正文中的脚注标记均置于相应词语之后。
