  text: וַ/יְנַסּ֣וּ וַ֭/יַּמְרוּ אֶת אֱלֹהִ֣ים עֶלְי֑וֹן וְ֝/עֵדוֹתָ֗י/ו לֹ֣א שָׁמָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/056.yaml
  text: Yet they tested God Most High and rebelled[c][b][a], and they did not keep his testimonies.
translation:
  language: zh_hans
  text: 他们却试探至高的神，悖逆他，也不遵守他的法度。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “法度”或译“训词”或“律例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: 试探
  rationale: נסה在这里指人对神加以试验、挑战；“试探”保留责难意味，也符合现代汉语的圣经语境。
- source_word: וַיַּמְרוּ
  choice: 悖逆
  rationale: מרה表示公然反抗、不顺从；“悖逆”准确传达对神的主动反叛，语体庄重而通行。
- source_word: אֶת אֱלֹהִים עֶלְיוֹן
  choice: 至高的神
  rationale: אֶת标明共同受事，“试探、悖逆至高的神”在汉语中可自然地让两个动词共用宾语；“至高的神”清楚保留神的尊称。
- source_word: וְעֵדוֹתָיו
  choice: 他的法度
  rationale: עֵדוֹת指神所颁布、为其旨意作见证的约中规定；“法度”在汉语中自然简洁，并保留律法与盟约语境。
- source_word: לֹא שָׁמָרוּ
  choice: 不遵守
  rationale: שׁמר与神的法度连用时意为谨守、遵行；现代汉语用“不遵守”最清楚自然。
- source_word: וַ
  choice: 却
  rationale: 虽然וַ延续叙事，但本节相对于上文神的作为形成鲜明转折；“却”表达语篇中的反差。
theological_decisions:
- issue: 神圣称号אֱלֹהִים עֶלְיוֹן的表达
  choice: 至高的神
  alternative: 神，至高者
  rationale: “至高的神”自然保留神至高无上的称号意义，不增添希伯来文本以外的教义解释。
- issue: עֵדוֹתָיו的律法与盟约含义
  choice: 他的法度
  alternative: 他的训令；他的律例
  rationale: “法度”既表明这些是神所规定的准则，也适合本诗所述的盟约不忠语境；脚注保留其他可能的法律性表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“试探、悖逆”以并列动词共用宾语，贴近希伯来语结构，也避免把“反抗”的介词意义不当加在“试探”上。
