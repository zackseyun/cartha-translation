  yaml_path: translation/ot/psalms/078/070.yaml
  text: He chose David his servant and took him from the sheepfolds[a].
translation:
  language: zh_hans
  text: 他拣选大卫——他的仆人；又把他从羊圈中带出来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“牲畜栏”或“围圈”。
    reason: 原词指圈养牲畜的围栏或圈舍；“羊圈”结合了后面的“羊”，但较宽泛的词义也可译作“牲畜栏”或“围圈”。
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: 他拣选
  rationale: בחר的Qal叙事形式表示过去发生的选择行动；“拣选”自然、庄重，也不在动词本身之外增添神学解释。
- source_word: בְּדָוִד
  choice: 大卫
  rationale: 按现代汉语圣经人名的通行译法处理专名。
- source_word: עַבְדּוֹ
  choice: 自己的仆人大卫
  rationale: עבד可指仆人或奴隶；此处是大卫与上帝关系中的尊称，重点在服事和归属，而非受奴役的社会身份。“自己的”清楚表达第三人称所属关系。
- source_word: וַיִּקָּחֵהוּ
  choice: 把他……带出来
  rationale: לקח基本义为“取、带走”；结合从羊圈到受召承担王权的语境，“带出来”既保留移动含义，又符合现代汉语表达。
- source_word: מִמִּכְלְאֹת
  choice: 从羊圈中
  rationale: מִכְלְאֹת指圈养牲畜的围圈；与צאן连用时译作“羊圈”最自然。复数形式在汉语中不必机械标出。
- source_word: צֹאן
  choice: 羊
  rationale: צאן泛指羊群或绵羊、山羊等小型牲畜；在该搭配中，其动物含义自然融入复合词“羊圈”。
theological_decisions:
- issue: 大卫作为עבד与上帝的关系
  choice: 自己的仆人
  alternative: 自己的奴仆／奴隶
  rationale: 此处以尊称表明大卫属于并服事上帝，并未突出受强制奴役的社会身份；“仆人”较准确地传达这一语境，同时不削弱其归属关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“自己的仆人大卫”避免连续两个“他”造成所属关系含混；“带出来”体现从羊圈离开的动作。脚注保留מִכְלְאֹת在具体设施类型上的词义范围。
