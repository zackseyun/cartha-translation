base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/051.yaml
  text: He struck down every firstborn in Egypt[a], the firstfruits of their vigor in the tents of Ham.
translation:
  language: zh_hans
  text: 他击杀了埃及所有的长子——含的帐篷中生育精力最初产生的后代。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们力量最初所生的”；希伯来语这一习语指生育能力最初产生的后代。
    reason: 词义替代译法及习语说明
lexical_decisions:
- source_word: וַיַּךְ
  choice: 他击杀了
  rationale: 该动词在上下文中指埃及长子之死；“击杀”既表达击打，也明确其致命结果。
- source_word: כָּל בְּכוֹר
  choice: 所有的长子
  rationale: 保留כָּל的总体范围，不添加原文未明说的“男性”。
- source_word: בְּמִצְרַיִם
  choice: 埃及
  rationale: 介词ב表示地点；汉语以“埃及所有的长子”自然表达“在埃及的所有长子”。
- source_word: רֵאשִׁית אֹנִים
  choice: 他们精力初结的果实
  rationale: רֵאשִׁית表示开始、初产之物，אֹנִים在此涉及生育能力或生命精力；此译法保留比喻及其生殖含义，不将其简化为“长子”。
- source_word: בְּאָהֳלֵי חָם
  choice: 含的帐棚中
  rationale: 保留以“含”诗意指称埃及的族谱性意象，也保留“帐棚”的具体画面。
theological_decisions:
- issue: 以“含”诗意指称埃及
  choice: 在正文保留“含的帐棚”
  alternative: 埃及人的住处
  rationale: 本节前半已经明确提到埃及，后半的“含”构成诗意复述并保留经文的族谱背景；不宜解释性地替换。
- issue: רֵאשִׁית אֹנִים的生殖性隐喻
  choice: 他们精力初结的果实
  alternative: 他们力量的初生者
  rationale: 原文把长子描写为生育精力最初产生的成果；正文保留这一隐喻，脚注说明其含义，避免过度确定为单纯的体力或抽象力量。
translation_notes:
  register: 采用现代、庄重而可懂的诗歌语言；以“击杀”体现上下文中的死亡，以“含的帐棚”保留原文的诗意和族谱意象。
