  text: לֹא זָר֥וּ מִ/תַּאֲוָתָ֑/ם ע֝֗וֹד אָכְלָ֥/ם בְּ/פִי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/030.yaml
  text: They had not yet turned away from their craving[a]; their food was still in their mouths.
translation:
  language: zh_hans
  text: 他们还没有离开自己的贪欲[a]，食物仍在他们口中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们还没有与自己的贪欲疏离。”希伯来语动词可较形式化地如此翻译；正文按上下文表达较可能的意思，即他们尚未离开或停止这种贪求。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָרוּ
  choice: 离开
  rationale: 该动词在此与介词 מִן 连用，表达离开、转离或停止追随之意。“离开”在现代汉语中自然，并保留原文可能含有的疏离意味。
- source_word: מִתַּאֲוָתָם
  choice: 自己的贪欲
  rationale: תַּאֲוָה 可指欲望、渴求；本诗语境是对食物的贪求。“贪欲”能体现这种过度而失序的欲望，又不局限于性方面。
- source_word: עוֹד
  choice: 仍
  rationale: 表示食物当时尚在他们口中的持续状态，与前句“还没有”共同强化审判突然临到的时间关系。
- source_word: אָכְלָם
  choice: 食物
  rationale: 按 אֹכֶל 的通常意义直译为“食物”，简洁且符合上下文。
- source_word: בְּפִיהֶם
  choice: 在他们口中
  rationale: 希伯来语为“在他们的口中”；汉语以集合性的“口中”表达最自然，无须机械译成“嘴巴里”。
theological_decisions: []
