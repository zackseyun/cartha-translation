  yaml_path: translation/ot/psalms/078/053.yaml
  text: He led them securely[a], and they were not afraid; and the sea covered their enemies.
translation:
  language: zh_hans
  text: 他领他们安然前行，他们并不惧怕；海[a]淹没了他们的仇敌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“那海／海”。本节回顾出埃及过海的事件，但原文在这里没有说明是“红海”还是“芦苇海”。
    reason: 说明原文定冠词所指的海及其未具体命名的历史指涉，避免在正文加入原文没有的名称。
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: 他领他们前行
  rationale: נחה 的使役式在此表示引领、带领；结合出埃及行程语境，以“领……前行”自然地保留移动意象。
- source_word: לָבֶטַח
  choice: 安然
  rationale: בֶּטַח 表示安全、安稳；前置的 ל 在这里作副词性用法，“安然”简洁地说明引领的方式。
- source_word: וְלֹא פָחָדוּ
  choice: 他们并不惧怕
  rationale: 直译并列连词 וְ，不额外规定为目的或结果关系；“惧怕”符合诗体庄重语域。
- source_word: אֹיְבֵיהֶם
  choice: 他们的仇敌
  rationale: 准确对应 אויב；“仇敌”是现代汉语圣经诗体中清楚而庄重的表达。
- source_word: כִּסָּה
  choice: 淹没了
  rationale: כסה 基本义为“遮盖”；以海为主语且对象为仇敌时，“淹没”是自然汉语，并保留海水覆盖他们的具体图景。
- source_word: הַיָּם
  choice: 海
  rationale: 原文仅为带定冠词的普通名词“那海/海”，没有在本节中明确写“红海”或“芦苇海”，故正文不作具体化。
theological_decisions:
- issue: 所指之海与出埃及事件的关系
  choice: 正文保留泛称“海”
  alternative: 红海；芦苇海
  rationale: 本节显然回顾出埃及过海，但希伯来文本这里只写 הַיָּם（“海”）。不把历史指涉的具体名称加入正文，以保持原文措辞。
- issue: 两个分句之间的逻辑关系
  choice: 译作并列的“他们并不惧怕”
  alternative: 所以他们不惧怕；使他们不惧怕
  rationale: 原文使用简单连词 וְ；安全引领与不惧怕之间可以含有结果意味，但语法未明确标示，故不在译文中单一化解释。
- issue: 末句与前句的关系
  choice: 用“却”表达叙事中的对照
  alternative: 并且海淹没了他们的仇敌
  rationale: 希伯来文仍用 וְ，并未显式使用转折词；但安全获救的以色列人与被海淹没的仇敌形成明显对照。汉语“却”使句意自然，同时不改变事件内容。
translation_notes:
  register: 采用现代、清楚而庄重的诗体汉语。“安然前行”兼顾 לָבֶטַח 的安全含义与 נחה 的行程意象；句式简洁，适合普通读者朗读。原文没有需要在本节正文中设置的异文或必要脚注。
