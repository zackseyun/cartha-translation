base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/034.yaml
  text: When he killed them[a], they sought him[b]; they returned and sought God earnestly.
translation:
  language: zh_hans
  text: 他击杀他们的时候，他们就寻求他；他们回转[a]，切切寻求上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回转”也可译作“转回来”；在本语境中可以含有悔改之意，但原词的基本意思是返回、转回。
    reason: lexical_alternative
  - marker: b
    text: 原文也可直译为“清早寻求上帝”，这是表示殷切、勤恳寻求的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ……的时候
  rationale: 这里的 אִם 在诗歌性的历史叙述中表达反复出现的时机或情形，而非单纯假设；译作“……的时候”自然地保留这种时间意义。
- source_word: הֲרָגָם
  choice: 他击杀他们
  rationale: הרג 明确表示杀死、击杀；主语为第三人称阳性单数，按上下文指上帝。“击杀”庄重而不古奥。
- source_word: וּדְרָשׁוּהוּ
  choice: 他们就寻求他
  rationale: דרש 带人物宾语时可指寻求、求问某人；“寻求他”保留了直接宾语，也适合此处转向上帝的语境。
- source_word: וְשָׁבוּ
  choice: 他们回转
  rationale: שוב 的基本意义是返回、转回；“回转”既保留词义，也容许语境中的悔改意味，而不直接把该词释为“悔改”。
- source_word: וְשִׁחֲרוּ
  choice: 切切寻求
  rationale: שחר 的强化词干可表达清早寻求，并由此形成殷切、勤恳寻求的含义；“切切寻求”用自然而庄重的现代汉语传达其迫切意味。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל 在这里是通常的神圣称谓；“上帝”清楚自然，不额外扩展为“全能者”等解释性称号。
theological_decisions:
- issue: 是否把 וְשָׁבוּ 明译为悔改
  choice: 他们回转
  alternative: 他们悔改／他们转回来
  rationale: 该动词在语境中可以带有悔改含义，但其核心词义是返回或转回。正文保留“回转”，避免把语境暗示直接提升为明确的神学断言。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“击杀”保留诗篇叙事的严肃力度；两个“寻求”对应原文两个不同动词，而以“切切”显出后一个动词的强化意味。所有代词均依原文保留，未在正文中补入“幸存者”等解释。
