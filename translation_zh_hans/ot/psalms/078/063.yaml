  yaml_path: translation/ot/psalms/078/063.yaml
  text: Fire consumed his young men[a], and his virgins were not praised in song.
translation:
  language: zh_hans
  text: 火吞灭了他的青年男子；他的少女也没有被歌颂[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的少女也没有受到庆贺。”这里很可能是指灾难使年轻女子没有婚礼之歌。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרָיו
  choice: 他的青年
  rationale: בָּחוּר通常指正值壮年的年轻男子；“青年”自然简洁，并与下句“少女”构成对应。
- source_word: אָכְלָה אֵשׁ
  choice: 烈火吞灭了
  rationale: אָכַל本义为“吃”，以火为主语时表示“吞噬、烧毁”；“烈火吞灭”保留了原文鲜明的毁灭意象。
- source_word: וּבְתוּלֹתָיו
  choice: 他的少女
  rationale: בְּתוּלָה指未婚、具童贞身份的年轻女子；现代汉语中“少女”较自然，也适合与婚嫁背景相关的语境，而不把正文写得生硬。
- source_word: לֹא הוּלָּלוּ
  choice: 无人歌颂
  rationale: הלל的Pual形式可指“被颂扬、被歌唱庆贺”；此处或暗指因灾难而没有婚礼之歌。“无人歌颂”保留措辞及其文化含义的开放性。
