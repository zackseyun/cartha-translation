  text: יְשַׁלַּח בָּ֨/ם חֲר֬וֹן אַפּ֗/וֹ עֶבְרָ֣ה וָ/זַ֣עַם וְ/צָרָ֑ה מִ֝שְׁלַ֗חַת מַלְאֲכֵ֥י רָעִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/049.yaml
  text: He sent against them his burning anger[a], fury, indignation, and distress, a band of destructive messengers.
translation:
  language: zh_hans
  text: 他把自己的烈怒、暴怒、愤慨和患难降在他们身上，派出一队带来灾祸的使者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一队降灾的天使”；传统译作“一队邪恶的天使”。希伯来语也可能是说，这些使者以带来毁灭性的灾祸为特征，而不一定指他们在道德上邪恶。
    reason: alternative_reading
lexical_decisions:
- source_word: יְשַׁלַּח בָּם
  choice: 他向他们倾泻
  rationale: שׁלח 的加强式在敌对审判语境中表示把某物遣向、释放到对象身上；“倾泻”自然承接后列的烈怒等审判内容，也体现行动的猛烈。
- source_word: חֲרוֹן אַפּוֹ
  choice: 自己的烈怒
  rationale: 该习语本指“他鼻中之热”，即炽烈的怒气；“烈怒”以简洁、庄重的现代汉语保留强度。
- source_word: עֶבְרָה
  choice: 暴怒
  rationale: 此词可指猛烈、漫溢的愤怒；“暴怒”既保留力度，又与前后的近义怒词有所区别。
- source_word: וָזַעַם
  choice: 愤慨
  rationale: זעם 可表示带有谴责意味的怒气；“愤慨”保留这种色彩，同时呈现原文近义词层叠的诗性效果。
- source_word: וְצָרָה
  choice: 和患难
  rationale: צָרָה 表示困苦、患难或压迫性的灾难；这里是临到受审判者的灾患，因此译为“患难”。
- source_word: מִשְׁלַחַת
  choice: 一队
  rationale: 该名词表示一批被派出的队伍或所派遣的一群；与“使者”搭配时，“一队”在汉语中自然，并保留集体受差遣之意。
- source_word: מַלְאֲכֵי
  choice: 使者
  rationale: מַלְאָך 可指一般使者，也可指天使；主文用“使者”保留原词的语义宽度，不预先断定其本体身份。
- source_word: רָעִים
  choice: 带来灾祸的
  rationale: רַע 可表示道德上的恶，也可表示有害、灾祸性的性质或结果；在神施行审判的语境中，此译法突出其带来灾祸的作用，而不武断认定这些使者在道德上邪恶。
theological_decisions:
- issue: מַלְאֲכֵי רָעִים 是否指道德上邪恶的天使，还是施行灾祸性审判的使者
  choice: 一队带来灾祸的使者
  alternative: 一队邪恶的天使；一队降灾的天使
  rationale: 原文 מַלְאָך 可译“使者”或“天使”，רַע 既可指邪恶，也可指有害或灾祸。主文保留身份上的开放性，并按上下文表达其灾祸性作用；脚注保存传统及其他可能读法，不消除原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以四个并列名词重现原文怒气与灾患逐层累积的节奏；用“就是”使末句可自然理解为前述审判的具体施行方式，同时不把其句法关系解释得过死。
