base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/062.yaml
  text: He gave his people over to the sword[b][a], and was enraged with his inheritance.
translation:
  language: zh_hans
  text: 他把自己的子民交给刀剑[a]，向自己的产业大发震怒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“任凭自己的子民倒在刀下”。
    reason: 说明“交给刀剑”是交付于战争杀戮的希伯来表达，同时正文保留原文意象。
  - marker: b
    text: 或译：“对自己的产业极其愤怒”。
    reason: 提供 הִתְעַבָּר 的自然词汇替代译法。
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: 交给
  rationale: 此处 סגר 的使役式表示把人交在另一力量的权下；与“刀剑”连用时，“交给”既自然，也保留使役含义。
- source_word: לַחֶרֶב
  choice: 给刀剑
  rationale: חֶרֶב 本义为“刀剑”，在此借指战争中的杀戮或死亡；保留“刀剑”可保存希伯来文的具体意象。
- source_word: עַמּוֹ
  choice: 自己的子民
  rationale: עַם 加第三人称阳性单数后缀，意为“他的民”；“自己的子民”在中文中清楚表明他们属于上帝，并具有合宜的圣约语感。
- source_word: וּבְנַחֲלָתוֹ
  choice: 向自己的产业
  rationale: נַחֲלָה 是“产业、所承受之业”，在此是对以色列的圣约性称谓；介词 ב 在发怒的结构中自然译作“向”。
- source_word: הִתְעַבָּר
  choice: 大发震怒
  rationale: עבר 的 Hitpael 在此表达强烈发怒；“大发震怒”传达其强度，并保持庄重而不过度解释。
theological_decisions:
- issue: 如何翻译指称以色列的圣约性用语
  choice: 自己的子民……自己的产业
  alternative: 他的百姓……他的基业
  rationale: 保留“子民”和“产业”两个不同称谓，使经文仍呈现这一张力：上帝所审判的，仍是属于他的人和产业。
- issue: 上帝震怒的指向
  choice: 向自己的产业大发震怒
  alternative: 因自己的产业而大发震怒
  rationale: 介词 ב 在这里可有一定语义弹性，但上下文最自然地指向上帝对其产业发怒；译文不进一步说明震怒的缘由，以免消解原文的简洁与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“交给刀剑”保留诗歌意象；“子民”和“产业”保留两个彼此对应的圣约称谓。脚注标记均置于相关正文之后。
