    rationale: “跟随”描写大卫随在羊后，“那里”却通常引出地点；补作“从跟随……的地方”可使汉语表达通顺，仍保留原文“从……之后／跟随……”的画面。
  - severity: low
    issue: 脚注a“带崽的母羊”语体偏口语。
    rationale: “带着幼崽的母羊”较合现代标准汉语的庄重经文语体，也准确表达“正在哺乳的母羊”。
