- from: 他把大卫从跟随哺乳的母羊[a]那里带来，使他牧养自己的子民雅各，牧养自己的产业[b]以色列。
  to: 他把大卫从跟随那些哺乳母羊的地方领来，使他牧养雅各——上帝的子民，和以色列——上帝的产业。[a][b]
  rationale: 修订明确“子民”和“产业”属于上帝，避免将原文的第三人称后缀误解为指大卫；同时以自然汉语保留大卫跟随哺乳母羊、随后受命牧养以色列的文学关联。脚注a保留“从……之后”的空间／跟随意象，脚注b保留נַחֲלָה的常见替代译法。
