  text: from following the nursing ewes he brought him[a], to shepherd Jacob his people[b], and Israel his inheritance.
translation:
  language: zh_hans
  text: 他把大卫从跟随那些哺乳母羊的地方领来，使他牧养雅各——上帝的子民，和以色列——上帝的产业。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从带着幼崽的母羊之后。”
    reason: lexical_alternative
  - marker: b
    text: “产业”也可译作“基业”“产业份”或“所拥有的子民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחַר
  choice: 从跟随……那里
  rationale: מִן与אַחַר连用，表示从羊群后面或从跟随羊群的生活中被带走；此译保留原文的牧羊图景，又符合现代汉语表达。
- source_word: עָלוֹת
  choice: 哺乳的母羊
  rationale: 该阴性复数形式在此指给幼崽哺乳的母羊；译文保留羊群的具体特征，而不笼统译作“羊”。
- source_word: הֱבִיאוֹ
  choice: 他把大卫……带来
  rationale: 希伯来语使役式在此意为“带来”，上文表明隐含主语是上帝，宾语后缀所指是大卫。正文明确“大卫”，避免现代汉语中连续代词造成指代不清。
- source_word: לִרְעוֹת
  choice: 使他牧养
  rationale: רעה可指放牧、喂养或作牧人；对象是雅各和以色列，因此“牧养”既自然，也保留大卫从牧羊人到治理百姓的诗意关联。
- source_word: בְיַעֲקֹב עַמּוֹ
  choice: 牧养自己的子民雅各
  rationale: 将“雅各”理解为与“自己的子民”同位，保留原文的民族称谓以及与下一分句的平行结构。
- source_word: וּבְיִשְׂרָאֵל נַחֲלָתוֹ
  choice: 牧养自己的产业以色列
  rationale: נַחֲלָה通常指继承所得的产业，也可延伸为基业或所属之民；“产业”在现代汉语中较直接，并保留圣约语境中的归属意味。
theological_decisions:
- issue: 大卫蒙召中的君王—牧人意象
  choice: 明确保留“牧养”，使大卫实际牧羊的经历与他后来照管以色列的职责相连。
  alternative: 译作“带领”或“照管”。
  rationale: 原诗刻意重复牧羊语汇，形成文学和神学上的关联；译作较泛的“带领”会削弱这一意象，而保留“牧养”并不额外引入后来的教义解释。
- issue: 上帝与大卫的代词指向
  choice: 保留上帝为隐含主语，并在宾语处明说“大卫”。
  alternative: 直译为“他把他……带来”。
  rationale: 上下文已确定行动者和受召者；汉语若连续使用“他把他”容易含混，明确宾语只是恢复语境所给的信息，并未改变神学内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。通过重复“牧养”呈现诗句的平行结构，并保留从照料羊群到照管上帝子民的核心意象。正文中的[a]、[b]与脚注逐一对应。
