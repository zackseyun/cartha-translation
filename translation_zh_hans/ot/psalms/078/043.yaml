  text: when he set his signs in Egypt[a], and his wonders in the fields of Zoan.
translation:
  language: zh_hans
  text: 他在埃及显出他的神迹，在琐安[a]的田野显出他的奇事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 琐安是埃及的一座城，通常被认为就是塔尼斯。
