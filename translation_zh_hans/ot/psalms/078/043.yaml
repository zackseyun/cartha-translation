lexical_decisions:
- source_word: אֲשֶׁר
  choice: 那时
  rationale: 承接上文“记念”的内容，在此具有时间意味；译作“那时”比直译为关系词更符合现代汉语。
- source_word: שָׂם
  choice: 施行
  rationale: 基本义是“放置、设立”；与“神迹、奇事”搭配时，“施行”在汉语中自然，同时不具体解释这些作为如何发生。
- source_word: בְּמִצְרַיִם
  choice: 在埃及
  rationale: 介词在此首先表示地点；不译作“攻击埃及”，以免加入原文未明说的敌对含义。
- source_word: אֹתוֹתָיו
  choice: 他的神迹
  rationale: אוֹת 指具有指示意义的记号或征兆；“神迹”是现代中文圣经语境中自然的表达，并与下文“奇事”保持一定区别。
- source_word: וּמוֹפְתָיו
  choice: 他的奇事
  rationale: מוֹפֵת 指令人惊异的奇事或异象；“奇事”保留与“神迹”的并列表达，避免两词都译成同一个词。
- source_word: בִּשְׂדֵה
  choice: 在……的田野
  rationale: 虽为单数形式，但与地名连用可指该城周围的田野或地域；中文用“田野”自然且贴近原文意象。
- source_word: צֹעַן
  choice: 琐安
  rationale: 按希伯来地名音译，并采用现代中文圣经读者较熟悉的写法；其与塔尼斯的对应关系放入脚注。
