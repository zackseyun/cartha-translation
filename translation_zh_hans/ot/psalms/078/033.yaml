  text: וַ/יְכַל בַּ/הֶ֥בֶל יְמֵי/הֶ֑ם וּ֝/שְׁנוֹתָ֗/ם בַּ/בֶּהָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/033.yaml
  text: So he consumed their days in futility[a], and their years in terror.
translation:
  language: zh_hans
  text: 于是，他使他们的日子徒然消逝，使他们的年岁在惊恐中消逝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “徒然”也可译为“虚空”或“空虚”，并含有如气息般虚幻的意象；“惊恐”也可译为“骤然的恐惧”或“慌乱”。
    reason: 保留הֶבֶל的虚幻、空虚及徒然等语义范围，并保留בֶּהָלָה所含惊惧、慌乱及可能的骤然性。
lexical_decisions:
- source_word: וַיְכַל
  choice: 使……消逝／终结
  rationale: כלה在此为连续式未完成体，语境中的隐含主语是上帝，可表示“耗尽、结束、使终结”。按两行平行结构分别译为“使……消逝”和“使……终结”，自然传达上帝使其生命年日归于结束的结果。
- source_word: בַּהֶבֶל
  choice: 在虚空中
  rationale: הֶבֶל本义涉及气息、蒸气，引申为虚空、徒然、短暂无常；“虚空”保留其意象和多义张力，既可指徒然，也暗含转瞬即逝。
- source_word: יְמֵיהֶם
  choice: 他们的岁月
  rationale: 字面为“他们的日子”，在诗歌中指人生时日。此处译作“岁月”以符合现代汉语表达，并与下行“年日”形成时间意象的平行。
- source_word: וּשְׁנוֹתָם
  choice: 他们的年日
  rationale: 字面为“他们的年岁”。译作“年日”保留与前行人生时日相呼应的诗性平行。
- source_word: בַּבֶּהָלָה
  choice: 在惊恐中
  rationale: בֶּהָלָה可指惊恐、慌乱、骤然临到的恐怖或仓促。审判语境中“惊恐”最自然地表达恐惧与震骇，同时脚注保留“骤然的恐怖”这一可能侧重。
theological_decisions:
- issue: 动词的隐含主语
  choice: 明确译出“他”，指语境中的上帝
  alternative: 采用非人称表达，如“他们的岁月就在虚空中消逝”
  rationale: 希伯来文动词为阳性单数，前后文将审判行动归于上帝；明确“他”既保留语法形式，也不淡化神圣行动者。
- issue: 审判的方式与结果
  choice: 保留“在虚空中／在惊恐中”的开放表达
  alternative: 解释性地译成“因人生徒劳而死去／在恐怖中猝死”
  rationale: 介词短语可能描述其年日的性质、处境或终结方式。正文不将其收窄为单一解释，以保存原诗的含蓄和神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，维持两行诗句的时间意象和平行结构。以“虚空”保留希伯来诗歌中气息般短暂、徒然无实的复合意蕴；脚注标记置于正文句末。
