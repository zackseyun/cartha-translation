  text: וַ/יִּשְׁכְּח֥וּ עֲלִילוֹתָ֑י/ו וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר הֶרְאָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/011.yaml
  text: They forgot his deeds[b][a], and his wonders that he had shown them.
translation:
  language: zh_hans
  text: 他们忘记了他的作为[a]，也忘记了他让他们看见的奇事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作为”也可译作“所行的事”。
    reason: lexical_alternative
  - marker: b
    text: “奇事”也可译作“奇妙的作为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: 他们忘记了
  rationale: 这是שׁכח的Qal叙事形式，表示过去叙事中的连续动作；“忘记了”直接自然，不扩展为较具解释性的“忽视了”。
- source_word: עֲלִילוֹתָיו
  choice: 他的作为
  rationale: עֲלִילוֹתָיו指他所行的事；“作为”在现代汉语中庄重而宽泛，适合指上帝在历史中的行动。
- source_word: וְנִפְלְאוֹתָיו
  choice: 也忘记了……奇事
  rationale: נִפְלְאוֹתָיו指令人惊奇、非凡的作为；“奇事”保留其奇妙性质，又不把词义收窄为特定意义上的“神迹”。重复“忘记了”使中文关系清楚顺畅。
- source_word: אֲשֶׁר
  choice: 的
  rationale: 将关系从句自然地处理为汉语定语结构，修饰“奇事”。
- source_word: הֶרְאָם
  choice: 他让他们看见的
  rationale: 这是ראה的Hiphil完成式，字面为“使他们看见”；“让他们看见”既保留使役意义，也符合现代汉语表达。
theological_decisions:
- issue: 物主后缀所指
  choice: “他的作为……奇事”中的“他”指上帝。
  alternative: 不在正文中明说所指，仅保留第三人称代词。
  rationale: 诗篇上下文讲述上帝的作为与以色列的遗忘；用“他”忠实保留原文代词及其上下文所指，不额外加入神名。
- issue: “奇事”的语义范围
  choice: 译作“奇事”。
  alternative: 译作“神迹”或“奇妙作为”。
  rationale: “奇事”保留非凡、令人惊叹之义，同时避免将其限定为较窄的超自然神迹范畴。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免“他的作为和他让他们看见的奇事”产生结构上的短暂歧义，第二分句重复“忘记了”；同时保留原文中“作为”与“奇事”的区分。
