  text: So he shepherded them with integrity of heart[b][a], and guided them with the skill of his hands.
translation:
  language: zh_hans
  text: 他以心中的正直牧养他们，以手中的巧妙引导他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以手中的巧妙”原文直译可作“以他手中的明辨（或智慧）”；此处指他以明辨和娴熟的才干施行引导。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֵם
  choice: 他……牧养他们
  rationale: רעה意为牧放、牧养。上下文以大卫为受拣选的牧者和君王，因此保留“牧养”的明确意象，不泛化为“照管”或“带领”。
- source_word: כְּתֹם לְבָבוֹ
  choice: 以正直的心
  rationale: תֹם表示纯全、正直或无可指摘；“正直的心”在现代汉语中自然庄重，也保留了לֵבָב所指向的内在品格。前缀כ可表示依照或伴随的方式，正文采用流畅的方式义“以”。
- source_word: וּבִתְבוּנוֹת כַּפָּיו
  choice: 以灵巧的双手
  rationale: תְּבוּנָה基本义为理解力、明辨或才智；与“手”连用时，突出实际治理中的娴熟与才干。“灵巧的双手”既符合汉语表达，也保留身体意象；脚注说明较直译的可能。
- source_word: יַנְחֵם
  choice: 引导他们
  rationale: נחה的使役式表示带领、引导；“引导”与前句的牧者意象相称，并表达有判断力的领导。
theological_decisions:
- issue: 大卫作为君王的牧者意象
  choice: 正文明确保留“牧养”
  alternative: 译为较笼统的“照管”或“带领”
  rationale: 本节总结诗篇对大卫作为耶和华所拣选之牧者君王的描写。保留牧者意象可呈现原文的神学关联，同时不加入本节没有明说的后续弥赛亚解释。
- issue: “心的正直”与介词כ的关系
  choice: 译作方式义“以正直的心”
  alternative: 译作准则义“按照他内心的正直”
  rationale: 希伯来语כ在此可理解为“以”或“按照”。正文采用自然的方式表达，但不把另一种语法细微差异提升为确定的神学判断。
- issue: “双手的诸般明辨”的含义
  choice: 按语境译为“灵巧的双手”
  alternative: 较直译为“以双手的明辨”或译为“以手中的才智”
  rationale: 复数תְבוּנוֹת与כַּפָּיו的搭配兼具理解力和实际能力的意味。正文表达领导行动的娴熟，脚注保留原文较不寻常的措辞。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“牧养—引导”保留希伯来诗歌的平行结构；“心—双手”则保留内在品格与实际能力的对照。脚注标记置于相关分句之后。
