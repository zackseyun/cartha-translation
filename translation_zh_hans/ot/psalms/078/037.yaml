  text: וְ֭/לִבָּ/ם לֹא נָכ֣וֹן עִמּ֑/וֹ וְ/לֹ֥א נֶ֝אֶמְנ֗וּ בִּ/בְרִיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/037.yaml
  text: Their heart was not steadfast with him[b][a], and they were not faithful to his covenant.
translation:
  language: zh_hans
  text: 他们的心对他并不坚定[a]，他们也不忠于他的约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的心与他并不坚定。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他们在他的约中并不忠信”；按现代汉语习惯译为“不忠于他的约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבָּם
  choice: 他们的心
  rationale: 原文用单数“心”配复数后缀，集体性地指以色列民的内心、意志与倾向；中文保留单数“心”自然且贴近原文。
- source_word: נָכוֹן
  choice: 坚定
  rationale: 此处形容他们的心在与上帝的关系中缺乏稳固和恒常；“坚定”兼顾词义与汉语表达，也与下半句的盟约忠诚形成平行。
- source_word: עִמּוֹ
  choice: 对他
  rationale: עִם本义为“与”，但“心与他不坚定”在现代汉语中生硬；结合关系指向译作“对他”，自然表达内心对上帝并不坚定，同时在脚注保留较直译的可能。
- source_word: נֶאֶמְנוּ
  choice: 不忠于
  rationale: 该词为אמן的尼法勒式，在盟约语境中表示可靠、忠诚；与“他的约”搭配时，“不忠于”准确表达未守盟约的关系性含义。
- source_word: בִּבְרִיתוֹ
  choice: 他的约
  rationale: 原文介词ב直译为“在……中”，但现代汉语通常说“忠于……的约”；因此与谓语合译为“不忠于他的约”，保留盟约忠诚之意。
theological_decisions:
- issue: 盟约忠诚用语
  choice: 将本节理解为以色列民在内心倾向和盟约关系上缺乏忠诚。
  alternative: 较字面地译为“他们在他的约中并不可靠（或并未站立得稳）”。
  rationale: 上下两句形成平行：心不坚定对应在盟约中不忠诚。这样翻译保留关系与道德层面的含义，不把经文缩减为关于理智信念的陈述，也不引入后来的教义范畴。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“他们的心”保留希伯来文的集体单数；“对他并不坚定”避免生硬直译，同时以脚注呈现原文“与他”的关系表达。所有脚注标记均置于相关正文之后。
