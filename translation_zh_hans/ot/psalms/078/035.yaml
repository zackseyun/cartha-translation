  text: וַֽ֭/יִּזְכְּרוּ כִּֽי אֱלֹהִ֣ים צוּרָ֑/ם וְ/אֵ֥ל עֶ֝לְיוֹן גֹּאֲלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/035.yaml
  text: Then they remembered that God was their rock[a], and God Most High was their redeemer.
translation:
  language: zh_hans
  text: 他们便想起：上帝是他们的磐石，至高的上帝是他们的救赎主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְכְּרוּ
  choice: 他们便想起
  rationale: 叙事性连接形式推进诗篇所述的事件；“便”自然表达承接关系，同时保留“想起、记起”的基本意义。
- source_word: כִּי
  choice: 冒号
  rationale: 这里引出“想起”的具体内容。现代汉语用冒号比直译为“他们想起……是……”更自然清楚。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为复数形态，却指以色列的独一上帝；采用现代汉语中通行、庄重的称呼。
- source_word: צוּרָם
  choice: 他们的磐石
  rationale: 直接保留“磐石”的诗歌隐喻，表达稳固、保护和倚靠，不将其解释性改写为“避难所”或“力量”。
- source_word: וְאֵל עֶלְיוֹן
  choice: 至高的上帝
  rationale: אֵל是神圣称号，עֶלְיוֹן修饰它；译作“至高的上帝”既符合希伯来语词序与意义，也避免音译“埃勒”造成陌生或被误解为另一位神。
- source_word: גֹּאֲלָם
  choice: 他们的救赎主
  rationale: 保留名词性分词所表达的身份与持续角色；不译作“至亲救赎者”，因为本诗句并未突出特定的亲属法律背景。
theological_decisions:
- issue: 两个神圣称号 אֱלֹהִים 与 אֵל עֶלְיוֹן 的关系
  choice: 两处都译为“上帝”，后者译作“至高的上帝”
  alternative: “上帝是他们的磐石，至高者是他们的救赎主”
  rationale: 两个称号在诗歌平行结构中指同一位上帝。重复“上帝”可保留原文的平行与明确性，不暗示两位不同的神。
- issue: גאל 在本节中的含义范围
  choice: 救赎主
  alternative: 至亲救赎者；救他们的那一位
  rationale: “救赎主”保留该词的神学与诗歌张力，同时不把亲属法层面的特殊含义强加于本节。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“磐石”和“救赎主”保留原文的核心意象与称号；补出两处汉语判断词“是”，使句子自然完整。
