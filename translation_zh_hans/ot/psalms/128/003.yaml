  text: אֶשְׁתְּ/ךָ֤ כְּ/גֶ֥פֶן פֹּרִיָּה֮ בְּ/יַרְכְּתֵ֪י בֵ֫יתֶ֥/ךָ בָּ֭נֶי/ךָ כִּ/שְׁתִלֵ֣י זֵיתִ֑ים סָ֝בִ֗יב לְ/שֻׁלְחָנֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/003.yaml
  text: Your wife will be like a fruitful vine in the recesses of your house[b][a]; your children will be like olive shoots around your table.
translation:
  language: zh_hans
  text: 你的妻子在你家深处，如同多结果子的葡萄树；你的儿子[a]围绕你的桌子，好像橄榄树的幼苗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子”也可按代表性用法理解为包括所有子女。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתְּךָ
  choice: 你的妻子
  rationale: 该词在此婚姻与家庭语境中明确指“妻子”；这样译自然且准确。
- source_word: כְּגֶפֶן פֹּרִיָּה
  choice: 如同多结果子的葡萄树
  rationale: 保留כ所表达的明喻，以及פֹּרִיָּה兼具植物结果与生育兴旺联想的形象；“多结果子的”比单说“茂盛”更贴近原文。
- source_word: בְּיַרְכְּתֵי בֵיתֶךָ
  choice: 在你家深处
  rationale: יַרְכְּתֵי可指里面、深处或较隐蔽的部分；“在你家深处”保留空间意象，同时避免过度具体化为某种房间。
- source_word: בָּנֶיךָ
  choice: 你的儿子
  rationale: 原文为阳性复数，通常具体指“儿子”；正文保留其性别标记，并以脚注说明在家庭祝福语境中也可能概括后代。
- source_word: כִּשְׁתִלֵי זֵיתִים
  choice: 好像橄榄树的幼苗
  rationale: שְׁתִלֵי指栽植的幼株或嫩苗；“幼苗”体现年轻、成长与生命力，并保留橄榄树意象。
- source_word: סָבִיב לְשֻׁלְחָנֶךָ
  choice: 围绕你的桌子
  rationale: 直接保留围坐于家庭餐桌周围的空间和家庭图景。
theological_decisions:
- issue: 后代称谓的性别范围
  choice: 你的儿子
  alternative: 你的孩子
  rationale: בָּנֶיךָ在词形和通常词义上是阳性复数“你的儿子”。正文不抹平这一标记，但脚注保留其在诗歌家庭图景中代表所有子女或后代的可能性。
- issue: 葡萄树“结果”意象的含义
  choice: 多结果子的葡萄树
  alternative: 繁茂的葡萄树／多产的葡萄树
  rationale: 直译保留农业、生育和蒙福兴旺之间的诗性张力，不把该意象限定为单一的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来诗歌的两个平行家庭意象；“家深处”忠实呈现较内、较隐蔽之处的空间含义，同时保持中文简洁自然。
