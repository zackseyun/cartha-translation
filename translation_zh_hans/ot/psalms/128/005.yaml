  text: יְבָרֶכְ/ךָ֥ יְהוָ֗ה מִ/צִּ֫יּ֥וֹן וּ֭/רְאֵה בְּ/ט֣וּב יְרוּשָׁלִָ֑ם כֹּ֝֗ל יְמֵ֣י חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/005.yaml
  text: May Yahweh bless you from Zion[a], and may you see the prosperity of Jerusalem all the days of your life.
translation:
  language: zh_hans
  text: 愿雅威从锡安赐福给你；愿你一生都得见耶路撒冷的福祉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶路撒冷的美善”或“耶路撒冷的繁荣”。
    reason: 词义选择：טוּב 的语义范围包括美善、福祉和繁荣。
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: 愿……赐福给你
  rationale: 此处的未完成式在祝福语境中表达祈愿；“愿……赐福给你”自然传达祝祷语气，并保留第二人称单数。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: מִצִּיּוֹן
  choice: 从锡安
  rationale: 介词 מִן 表示来源；“从锡安”直接保留福分由锡安而来的空间及神学意象。
- source_word: וּרְאֵה
  choice: 愿……看见
  rationale: 该词在前一句祝愿之后虽为命令式，但语用上延续祝祷；译作“愿……看见”比直译为命令更符合本节语气。
- source_word: בְּטוּב
  choice: 福祉
  rationale: טוּב 可指美善、福分、兴盛或安康。“福祉”在现代汉语中自然概括耶路撒冷整体的良好境况，同时不把含义限缩为物质繁荣。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用该地名在现代简体中文圣经及一般用语中的通行译名。
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: 你一生的日子
  rationale: 贴近原文“你生命的一切日子”的表达，同时以现代汉语可理解的形式保留“日子”这一意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；以“主”代称
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质；不以“主”替代，也不借译文引入额外解释。
- issue: “从锡安”所表达的祝福来源
  choice: 保留“从锡安”，不在正文中加以神学扩释
  alternative: 明确解释为从圣殿、弥赛亚中心或神的居所而来
  rationale: 原文将锡安表述为赐福的来源或地点，却未在本节明确展开其含义；直译可保存地理与神学张力，避免加入经文未明说的解释。
- issue: טוּב יְרוּשָׁלִָם 的含义
  choice: 耶路撒冷的福祉
  alternative: 耶路撒冷的美善；耶路撒冷的繁荣
  rationale: “福祉”兼顾群体安康、兴盛与美好境况，避免把祝福仅物质化；脚注保留原词可能具有的其他侧重。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。以两个“愿”维持希伯来诗歌的祝祷语气；保留“锡安”和“耶路撒冷”等传统专名，并用分号呈现两个平行分句。
