  yaml_path: translation/ot/psalms/128/002.yaml
  text: For you will eat the labor of your hands[a]; blessed are you[b], and it will be well with you.
translation:
  language: zh_hans
  text: 你必吃自己双手劳碌所得[a]；你有福[b]，一切都会顺利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“你双手的劳碌。”这里可指亲手劳碌所得的成果。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你是幸福的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: 自己双手劳碌所得的
  rationale: יְגִיעַ 可指劳碌本身，也可指劳碌所得；与“吃”搭配时，指亲手劳作所得的食物或成果。译文保留“双手”的具体意象，同时用“所得的”使汉语自然。
- source_word: כִּי תֹאכֵל
  choice: 你必吃
  rationale: כִּי 在此可有强调或承接说明的作用，不必在汉语中另译；未完成式结合上下文表达预期的福分，因此译作“必吃”。
- source_word: אַשְׁרֶיךָ
  choice: 你是有福的
  rationale: 这是智慧文学和祝福语境中的称福用语，既可指幸福，也可指处境蒙福；“有福”保留其宽广含义。
- source_word: וְטוֹב לָךְ
  choice: 必得安好
  rationale: 该短语表示境况良好、生活顺遂。译作“必得安好”简洁庄重，并避免把福祉限缩为物质兴旺。
theological_decisions:
- issue: 智慧诗中称福语 אַשְׁרֶיךָ 的表达
  choice: 你是有福的
  alternative: 你是幸福的／你是有福气的
  rationale: “有福”既符合诗篇称福语的传统语感，也不把原文仅仅理解为主观快乐；但脚注保留“幸福”的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自己双手劳碌所得的”保留原文身体意象，又避免“吃双手的劳碌”在汉语中的生硬感；“必得安好”概括原文所表达的整体福祉。
