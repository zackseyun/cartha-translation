  text: וּ/רְאֵֽה בָנִ֥ים לְ/בָנֶ֑י/ךָ שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/006.yaml
  text: May you see your children's children[b][a]. Peace be upon Israel.
translation:
  language: zh_hans
  text: 愿你看见你儿女的儿女。[a]愿平安[b]临到以色列！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“你儿子们的儿子们”，即“孙辈”或“你儿女的儿女”。
    reason: lexical_alternative
  - marker: b
    text: “平安”所译的希伯来语也可包含安康、完整和兴盛之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/רְאֵה
  choice: 愿你看见
  rationale: 该形式字面可作“并且看”，但在本诗祝福语境中具有祈愿色彩；译作“愿你看见”既自然，也避免将其处理成单纯命令或确定预言。
- source_word: בָנִים לְ/בָנֶי/ךָ
  choice: 你儿女的儿女
  rationale: 希伯来语直译近于“你儿子们的儿子们”，是指后代、孙辈的惯用表达；“你儿女的儿女”保留原句的代际结构，同时符合现代汉语。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: “平安”是最直接且传统的对应词，也能承载该词所包含的安康、完整与兴盛等宽广含义。
- source_word: עַל
  choice: 临到
  rationale: 在祝福语“שָׁלוֹם עַל”中，“临到”自然表达平安落在某群体之上的方向感，比生硬的“在……之上”更符合现代汉语。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用该专名的标准中文译法，不在正文中扩展其所指。
theological_decisions:
- issue: 末句祝福的对象范围
  choice: 保留“以色列”，按诗篇文本明确指称的约民来翻译
  alternative: 解释性扩展为一般敬拜群体或预表性的教会
  rationale: 原文明确使用“以色列”；翻译应保留其历史与盟约语境，不把后来的神学延伸直接写入正文。
- issue: 首句的语气
  choice: 按祝福或祈愿译为“愿你看见”
  alternative: 译为命令“你要看见”或预告“你必看见”
  rationale: 上下文属于祝福语境；祈愿式能反映语用功能，同时不把祝愿强化为无条件的预言。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。正文以两个“愿”明确呈现诗末的祈愿性质；保留“你儿女的儿女”的原文意象，并用脚注说明其较直译形式。
