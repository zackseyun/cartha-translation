  text: הִנֵּ֣ה כִי כֵ֭ן יְבֹ֥רַךְ גָּ֗בֶר יְרֵ֣א יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/004.yaml
  text: Behold[a], thus shall the man who fears Yahweh be blessed.
translation:
  language: zh_hans
  text: 看哪，敬畏耶和华的人[a]必这样蒙福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为阳性名词“男人”；这里按格言式用法，泛指以敬畏耶和华为特征的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是强调并唤起注意的诗歌性标记；“看哪”既保留宣告语气，也符合现代中文圣经文体。
- source_word: כִי כֵן
  choice: 这样
  rationale: 该组合强调前文所述的方式或结果；“这样”简洁地回指上文家庭蒙福的景象，不额外限定其逻辑关系。
- source_word: יְבֹרַךְ
  choice: 必……蒙福
  rationale: 此处为ברך的Pual未完成式，表达领受祝福；“蒙福”保留被动含义，“必”传达格言式的确定语气。
- source_word: גָּבֶר
  choice: 人
  rationale: 该阳性名词在此具有格言性的代表功能，指以敬畏耶和华为特征的人；中文“人”自然涵盖这种泛指，同时脚注说明原文形式。
- source_word: יְרֵא יְהוָה
  choice: 敬畏耶和华
  rationale: 分词结构描述此人的恒常特征；“敬畏”保留智慧文学中兼具畏惧与尊崇的固定含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式译出四字神名，保留其专名性质，而不改译为称号“主”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且庄重的“耶和华”，明确作为专名处理；“雅威”是更接近学界常见拟音的替代译法。
- issue: 阳性名词גָּבֶר的代表范围
  choice: 人，并以脚注说明原文为阳性形式
  alternative: 男人
  rationale: 上下文以丈夫和父亲为直接图景，但本句具有格言式概括作用。译作“人”保留自然中文的泛指功能，脚注则避免遮蔽原文的阳性形式及其语境。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“看哪”保留诗歌的强调与宣告感；语序调整为中文自然表达，同时以“这样”回指上文所描绘的福分。
