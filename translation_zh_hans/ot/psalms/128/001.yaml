base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/001.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: zh_hans
  text: 上行之歌。凡敬畏耶和华、行在他道路上的人，都有福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福”也可译作“幸福”。希伯来语אַשְׁרֵי可指蒙福、兴盛的生命状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 保留מַעֲלוֹת“上行、登阶”的具体意象，又不武断限定其历史背景；也是这组诗篇标题的自然、庄重译法。
- source_word: אַשְׁרֵי
  choice: 都是有福的
  rationale: 表达智慧文学中蒙福、兴盛的状态；“有福”比单纯“快乐”更能承载原文的庄重语域。因כָּל具有周遍分配意义，汉语以“凡……都是……”自然呈现。
- source_word: כָּל יְרֵא
  choice: 凡敬畏……的人
  rationale: 原文为泛指性的阳性单数分词；此译法保留“每一个”的周遍意义，又不加入不必要的男性限定。
- source_word: יְרֵא יְהוָה
  choice: 敬畏耶和华
  rationale: “敬畏”保留智慧传统中兼有畏惧、崇敬和顺服的分量，不弱化为一般性的尊重。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，而不是用“主”这一称号替代。
- source_word: הַהֹלֵךְ
  choice: 遵行
  rationale: 原义为“行走”，在“道路”这一伦理隐喻中指生活行事；中文“遵行他道路”自然表达持续按其道路而行，同时保留道路意象。
- source_word: בִּדְרָכָיו
  choice: 他道路
  rationale: 保留דֶּרֶךְ复数所表达的道路/行事方式隐喻；代词自然回指耶和华。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文采用中文圣经传统中广为人知的专名“耶和华”，避免以称号“主”取代专名；“雅威”是较接近学界重构发音的另一译法。
- issue: אַשְׁרֵי所表达的福乐状态
  choice: 有福的
  alternative: 幸福的；多么有福
  rationale: “有福”保留智慧文学宣告中客观蒙福与生命兴盛的张力，不把意义缩减为主观快乐。
- issue: כָּל יְרֵא的性别与数
  choice: 凡……的人
  alternative: 每一个敬畏……的男子；所有敬畏……的人
  rationale: 阳性单数分词在此具有代表性的泛指作用；“凡……的人”准确传达包举每个人的意义，同时不制造男性专指。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌智慧语体。“凡……都是……”符合现代汉语习惯；“敬畏”和“道路”保留原文核心神学与伦理意象。
