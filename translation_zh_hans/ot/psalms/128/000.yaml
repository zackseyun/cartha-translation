  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: zh_hans
  text: '上行之歌。


    凡敬畏耶和华、行在他的道路上的人，都是有福的[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福的”也可译作“幸福的”；希伯来语 אַשְׁרֵי 表示处于蒙福、福乐或兴盛的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 保留传统且简洁的诗篇标题译法；“上行”对应复数 מַעֲלוֹת，其具体所指仍保持开放。
- source_word: אַשְׁרֵי
  choice: 有福的
  rationale: 表达蒙福、福乐和兴盛的状态，同时以脚注提示也可译作“幸福”。
- source_word: יְרֵא יְהוָה
  choice: 敬畏耶和华
  rationale: “敬畏”兼具敬重、畏惧与虔诚顺服之意；用“耶和华”对应神圣四字名。
- source_word: הַהֹלֵךְ בִּדְרָכָיו
  choice: 行在他道路上
  rationale: 保留“行走—道路”的希伯来语比喻，指按他的旨意生活；单数分词与前面的“凡……的人”自然衔接。
theological_decisions:
- issue: אַשְׁרֵי 所表达的是神赐福还是人的幸福状态
  choice: 正文译为“有福的”
  alternative: “幸福的”
  rationale: “有福”既可指蒙福，也可指处于福乐兴盛的状态，不把原文的语义张力局限为主观感受。
- issue: 神圣四字名 יְהוָה 的译法
  choice: 耶和华
  alternative: “上主”或“雅威”
  rationale: 采用现代中文圣经读者最熟悉的专名形式，并明确区别于一般称号“主”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。标题独立成行；正文保留希伯来诗歌中“行在道路上”的生活隐喻，并避免添加原文未明说的因果关系。
