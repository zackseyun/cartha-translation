  yaml_path: translation/ot/psalms/047/008.yaml
  text: God reigns over the nations[a]; God sits on his holy throne.
translation:
  language: zh_hans
  text: '上帝在列国之上作王[a]；

    上帝坐在他的圣洁宝座上。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝已经在列国之上作王；上帝已经登上他的圣洁宝座。”希伯来文的完成式动词也可能强调他的王权已经确立。
    reason: 保留希伯来文完成式可能具有的起始性或结果性解读。
lexical_decisions:
- source_word: מָלַךְ
  choice: 统管
  rationale: 该完成式在诗歌宣告中可表达现今持续或结果性的王权状态。“统管”自然传达上帝施行王权，避免把可能的起始意义写死为“登基作王”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为形态上的复数形式，却明确指以色列的独一上帝；两个诗行都重复译出，以保留原文的强调和平行结构。
- source_word: עַל
  choice: 统管（列国）／在……上（宝座）
  rationale: 同一介词依搭配分别表达管辖范围和空间位置：与列国连用时融入“统管”，与宝座连用时译作“在……上”。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 指各国、各民族的总体；“列国”简洁庄重，也不引入“外邦人”可能附带的后期宗教语义。
- source_word: יָשַׁב
  choice: 坐
  rationale: 保留动词“坐”的具体意象；结合“宝座”，读者自然能理解其君王安坐、掌权的含义。
- source_word: כִּסֵּא
  choice: 宝座
  rationale: 在上帝君王的语境中指王座；“宝座”是现代中文圣经及庄重语体中自然明确的对应词。
- source_word: קָדְשׁוֹ
  choice: 他的圣
  rationale: 原文直译为“他圣洁的宝座／他之圣的宝座”；中文用“他的圣宝座”自然地表达归属与圣洁性质。
theological_decisions:
- issue: 希伯来诗歌中完成式所表达的上帝王权
  choice: 现时宣告：“上帝统管……上帝坐在……”
  alternative: 起始或完成意义：“上帝已经作王……上帝已经坐上他的圣宝座。”
  rationale: 上下文是对上帝普世王权的礼仪性欢呼，完成式可宣告已经确立并持续为真的状态。正文采用自然的中文现在时表达，同时以脚注保留其可能强调王权确立的起始或完成意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“统管列国”比“在列国之上作王”更自然；分行保留希伯来诗歌的平行结构，并保留两次“上帝”的重复。
