  text: יַדְבֵּ֣ר עַמִּ֣ים תַּחְתֵּ֑י/נוּ וּ֝/לְאֻמִּ֗ים תַּ֣חַת רַגְלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/003.yaml
  text: He subdues peoples under us[a], and nations under our feet.
translation:
  language: zh_hans
  text: 他使万民臣服在我们之下[a]，使列国屈服在我们脚下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使万民归服在我们之下。”这里的希伯来语动词表示使人受制、归服，不是“说话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְבֵּר
  choice: 使……臣服
  rationale: 此处与“在我们之下”和“在我们脚下”相配，表示使人归服、受制，而不是“说话”。“使……臣服”既传达使役含义，也符合诗篇的君王与征服语境。
- source_word: עַמִּים
  choice: 万民
  rationale: 复数形式指多个族群或人民。“万民”是庄重而自然的现代中文表达，并与下一分句的“列国”有所区别。
- source_word: תַּחְתֵּינוּ
  choice: 在我们之下
  rationale: 保留原文的空间隐喻，表示处于我们的权下，并与“在我们脚下”构成平行。
- source_word: וּלְאֻמִּים
  choice: 使列国
  rationale: לְאֻמִּים 指众国家或族群；译作“列国”可与前句“万民”保持词汇区别。第二分句承接前句动词，中文补出“使”，使句意清楚自然。
- source_word: תַּחַת רַגְלֵינוּ
  choice: 在我们脚下
  rationale: 直译并保留征服、辖制的传统意象，符合诗歌的平行结构。
theological_decisions:
- issue: 征服语境中的主体与群体声音
  choice: 以上帝为行动主体，由他使其他族群臣服在“我们”之下。
  alternative: 把本句泛化为以色列军事得胜的王室宣言。
  rationale: 上文明确以上帝为主语，并宣告他的威严和王权。本译文保留第一人称复数“我们”，不淡化臣服与脚下的征服意象，也不加入后来的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“万民／列国”和“在我们之下／在我们脚下”保留希伯来诗歌的同义平行与词汇层次；不回避原文的征服意象。
