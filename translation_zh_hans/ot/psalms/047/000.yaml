lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题注中通常指负责音乐或礼仪演奏的领班；“乐长”简洁庄重，也比“诗班长”更能涵盖器乐与歌唱。前置词 לַ 译作“交给”，自然表达题注中的交付或指向关系，同时以脚注保留“供乐长使用”的可能。
- source_word: לִבְנֵי קֹרַח
  choice: 可拉子孙的
  rationale: “可拉”采用现代中文圣经传统中通行的专名形式。前置词 לִ 可表示归属、关联、用途或作者关系；正文用“……的”保留较宽泛的关联，不断定是由他们创作还是交给他们使用，并以脚注说明其他可能。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇题注中常见的体裁名称，指供歌唱或配乐的诗歌；中文标题语境下译作“诗”简明自然，且不误解为整卷《诗篇》中的编号名称。
