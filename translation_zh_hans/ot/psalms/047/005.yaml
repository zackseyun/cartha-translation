  yaml_path: translation/ot/psalms/047/005.yaml
  text: God has gone up with a shout[a]; Yahweh[b], with the sound of a trumpet.
translation:
  language: zh_hans
  text: '上帝在呼喊声中上升[a]；

    耶和华在号角声中上升[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上去了”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“朔法尔角”（shofar），是一种角制号角，传统上常用公羊角制成。
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה
  choice: 升上去
  rationale: 该动词意为“上去、上升”。“升上去”自然地保留方向性，又不把本诗的登位意象限定为后来的特定神学事件。希伯来语完成式在此作诗歌性的宣告，中文不必强行标明具体时态。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处与下行的יהוה平行，明确指以色列的上帝；虽然词形为复数，所指仍是单数。
- source_word: בִּתְרוּעָה
  choice: 在呼喊声中
  rationale: תְּרוּעָה可指高声呼喊、欢呼或呐喊。“呼喊声”保留其宽泛含义，避免擅自限定为喜乐欢呼或战争呐喊；“在……声中”也自然呈现伴随的声响场景。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中最通行且可辨识的专名“耶和华”呈现四字神名，不以“主”这一称号取代原文的专名。
- source_word: בְּקוֹל
  choice: 在……声中
  rationale: קוֹל在此表示号角发出的声音。结合上下行的平行结构，译作“在号角声中”简洁自然。
- source_word: שׁוֹפָר
  choice: 号角
  rationale: שׁוֹפָר是用于发信号和敬拜的角制吹奏器。“号角”在中文中兼具可读性与古代礼仪色彩，其通常以公羊角制成的文化信息置于脚注。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留专名而不改译为称号“主”；在“耶和华”与“雅威”之间，采用普通中文读者最熟悉、现行圣经传统中最易识别的“耶和华”。
- issue: “上升”语言可能引发的基督论联想
  choice: 升上去
  alternative: 升天
  rationale: 本诗直接表达上帝在欢呼和号角声中上升、登位的君王意象。“升上去”忠实保留原文，同时不以“升天”强行加入原文未明说的后来基督论指向。
- issue: 第二行省略谓语的处理
  choice: 补出“升上去”
  alternative: 耶和华伴着号角声
  rationale: 希伯来诗歌第二行承接第一行的动词。现代汉语若完全省略谓语会显得残缺，因此重复“升上去”，明确平行关系而不增加新的语义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两行平行排布，并重复谓语，以符合自然汉语；“呼喊声”刻意保留原词可指欢呼、呐喊或高声呼叫的语义幅度。所有脚注标记均置于其所说明的词语之后。
