  yaml_path: translation/ot/psalms/047/001.yaml
  text: Clap your hands[a], all peoples[b]; shout to God with a voice of joy.
translation:
  language: zh_hans
  text: 万民哪，你们都要拍掌！要向上帝欢呼，发出喜乐的声音！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעַמִּים
  choice: 万民哪，你们都
  rationale: כָּל与复数定冠词名词הָעַמִּים合指所有族群；“万民”自然、庄重，也保留普世性的集体复数含义。增添“哪，你们”明确其呼语功能。
- source_word: תִּקְעוּ כָף
  choice: 拍掌
  rationale: 该短语字面涉及击打手掌，在此是集体庆贺、欢呼的动作；现代汉语以“拍掌”简洁而自然。
- source_word: הָרִיעוּ
  choice: 欢呼
  rationale: רוע的使役命令式指发出响亮的欢呼或胜利呼声；“欢呼”既体现声音之大，也符合喜庆语境。
- source_word: לֵאלֹהִים
  choice: 向上帝
  rationale: 介词ל在此标明欢呼所朝向的对象；“向上帝”准确自然。
- source_word: בְּקוֹל רִנָּה
  choice: 高声颂喜
  rationale: קוֹל指声音，רִנָּה可指欢欣的呼声或歌唱。“高声颂喜”保留发声与喜乐赞颂两层含义，同时与前面的“欢呼”避免机械重复。
theological_decisions:
- issue: 呼召对象的范围
  choice: 把经文理解为对所有族群的普遍呼召
  alternative: 仅在修辞上指以色列周边各族
  rationale: 原文明确使用“所有的众民”，本诗宣告上帝为王的语境也支持普世性的呼召；译文不把范围缩窄。
translation_notes:
  register: 采用现代、庄重且适合诗歌诵读的普通话。“万民哪”体现呼语，“拍掌／欢呼”形成平行命令；末句用“高声颂喜”传达喜乐呼声或欢唱的语义张力。
