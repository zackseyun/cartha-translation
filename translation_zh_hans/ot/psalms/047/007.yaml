  yaml_path: translation/ot/psalms/047/007.yaml
  text: For God is the King of all the earth[a]; sing a psalm with understanding.
translation:
  language: zh_hans
  text: 因为上帝是全地的王；你们要以悟性歌颂[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要巧妙地歌颂”；也可能译为“要唱一首玛斯基尔”。“玛斯基尔”是一个含义不确定的诗歌或音乐术语。
    reason: 词义与语法功能存在歧义：מַשְׂכִּיל 可按副词性理解，也可能指一种诗歌或音乐体裁。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的赞美呼召并说明理由；“因为”自然保留了原文的因果、解释作用。
- source_word: מֶלֶךְ כָּל־הָאָרֶץ
  choice: 全地的王
  rationale: 贴近原文“全地之王”的结构，并保留上帝王权遍及全地的普遍范围。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为复数形式，却按单数使用，指以色列的上帝；“上帝”是现代汉语中庄重而通行的对应词。
- source_word: זַמְּרוּ
  choice: 你们要……歌颂
  rationale: 复数命令式，呼召众人以歌唱和音乐赞美；补出“你们要”可在汉语中清楚表达命令语气和复数受命者。
- source_word: מַשְׂכִּיל
  choice: 有悟性地
  rationale: 该词可表达领悟、明智或技巧，也可能是诗歌体裁名称。正文采用可作副词理解的译法，既自然承接“歌颂”，又避免把不确定的体裁含义定死；其他可能性收入脚注。
theological_decisions:
- issue: 上帝王权的范围
  choice: 上帝是“全地的王”
  alternative: 上帝是全境或全世界的王
  rationale: כָּל־הָאָרֶץ 在本诗语境中自然指向普世范围；译文不将其缩窄为某一地区，也不添加经文未明说的教义解释。
- issue: מַשְׂכִּיל 的语法与诗歌含义
  choice: 按副词性含义译为“有悟性地”
  alternative: “巧妙地”或作为术语译成“训诲诗”
  rationale: 原词的确切功能存在争议。正文保留其与领悟相关的基本意义，脚注则呈现技巧性和诗歌体裁两种真实可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全地的王”保留诗歌的凝练感；“有悟性地歌颂”略带经文语体，但普通读者仍可理解，并能较好承载原词与领悟有关的意义。
