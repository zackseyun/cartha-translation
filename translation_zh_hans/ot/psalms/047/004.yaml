  text: יִבְחַר לָ֥/נוּ אֶת נַחֲלָתֵ֑/נוּ אֶ֥ת גְּא֨וֹן יַעֲקֹ֖ב אֲשֶׁר אָהֵ֣ב סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/004.yaml
  text: He chooses for us our inheritance[a], the pride of Jacob, whom he loves[c][b]. Selah
translation:
  language: zh_hans
  text: 他为我们选择我们的产业[a]，就是他所爱的雅各的荣耀[b]。细拉[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “选择”也可译作“必选择”。全句也可译作：“他必为我们选择我们的产业，就是他所爱的雅各的荣耀。”
    reason: lexical_alternative
  - marker: b
    text: “他所爱的”也可能指“产业”或土地，而不是“雅各”。
    reason: alternative_reading
  - marker: c
    text: “细拉”是一个含义不确定的希伯来礼仪或音乐术语，传统上音译而不翻译。
    reason: cultural_note
lexical_decisions:
- source_word: יִבְחַר
  choice: 选择
  rationale: 该词是 בחר 的 Qal 未完成式第三人称阳性单数，可表达当前、持续或将来的行动。现代汉语“选择”本身不强行限定时态，能够保留原文的时间开放性。
- source_word: לָנוּ
  choice: 为我们
  rationale: 介词 לָ־ 带第一人称复数后缀，表示受益或关涉对象；“为我们”自然地传达“为我们、替我们”的意思。
- source_word: נַחֲלָתֵנוּ
  choice: 我们的产业
  rationale: נַחֲלָה 可指承受所得之物、祖业或分得的土地。“产业”在中文圣经语境中既能表达承受与分配的含义，也适合此处可能指应许之地的背景。
- source_word: אֶת ... אֶת
  choice: 首个不单独译出，第二个用“就是”表达同位说明
  rationale: 两个 אֶת 都是直接宾语标记；第二个所引出的“雅各的荣耀”进一步说明“我们的产业”，中文用“就是”可清楚呈现这一同位关系。
- source_word: גְּאוֹן
  choice: 荣耀
  rationale: גְּאוֹן 可表示高贵、威荣、荣美，也可在其他语境中表示骄傲。此处是正面描述雅各引以为荣、尊贵荣美之物；“荣耀”比现代汉语中常带贬义的“骄傲”更合适，同时保留其崇高含义。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 按原文保留这个兼具个人与群体意义的名称，不直接解释性改译为“以色列”。
- source_word: אֲשֶׁר אָהֵב
  choice: 他所爱的
  rationale: אָהֵב 是完成式，但“爱”作为状态动词可表达延续至今的爱。关系从句在句法上既可能指“雅各”，也可能指前面的产业；正文按较自然的“雅各”处理，并以脚注保留另一种读法。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该希伯来礼仪或音乐术语的确切含义不明，因此按传统音译而不臆测其功能。
theological_decisions:
- issue: “他所爱的”所指为何
  choice: 正文理解为修饰“雅各”
  alternative: 也可能修饰“产业”，即“他所爱的雅各的荣耀/产业”
  rationale: “雅各”是邻近的单数先行项，且上帝爱雅各的表达符合圣经常见用法；但希伯来语关系代词本身不标明性和数，语序也容许该从句指向作为产业的土地，因此在脚注中保留歧义。
- issue: יִבְחַר 的时间含义
  choice: 正文用不明确标示时态的“选择”
  alternative: 可明确译为将来意义的“必选择”
  rationale: 希伯来语未完成式可表达进行、惯常或将来行动。中文正文避免过度限定，脚注提示将来读法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“产业”保留承受之业与分得土地的圣经含义；“荣耀”避免“骄傲”在现代汉语中的主要贬义。正文尽量保存希伯来语未完成式的时间开放性，并通过脚注呈现关系从句所指的真实歧义。
