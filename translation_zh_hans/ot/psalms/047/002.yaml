  text: כִּֽי יְהוָ֣ה עֶלְי֣וֹן נוֹרָ֑א מֶ֥לֶךְ גָּ֝דוֹל עַל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/002.yaml
  text: For Yahweh Most High is to be feared[a], a great King over all the earth.
translation:
  language: zh_hans
  text: 因为至高的耶和华令人敬畏[a]；他是统治全地的伟大君王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可畏”或“令人畏惧”。希伯来语形容耶和华使人心生敬畏与畏惧。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文呼召万民欢呼的内容，说明赞美的原因；“因为”自然保留因果关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式音译四字神名，保留其作为以色列之神名字的功能，而不改作一般称号。
- source_word: עֶלְיוֹן
  choice: 至高的
  rationale: 表达其超越一切的崇高地位；在此作为修饰神名的尊称，中文以“至高的耶和华”自然呈现。
- source_word: נוֹרָא
  choice: 令人敬畏
  rationale: 该词源于 ירא，描述耶和华使人产生畏惧与崇敬；“令人敬畏”兼顾威严、惧怕和敬仰，不将意义缩减为恐怖。
- source_word: מֶלֶךְ גָּדוֹל
  choice: 大君王
  rationale: 保留君王意象和 גָּדוֹל 所表达的崇高伟大；“大君王”在庄重诗歌语体中自然简洁。
- source_word: עַל כָּל הָאָרֶץ
  choice: 统管全地
  rationale: עַל 与“君王”连用表示统治范围；“统管全地”自然表达其在全地之上的王权，且此处 אֶרֶץ 按普世语境理解为全地。
theological_decisions:
- issue: 如何呈现神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，译文保留专名而不以“主”替代；“耶和华”是现代中文圣经传统中最广为人知的形式。
- issue: נוֹרָא 所含的惧怕与敬仰
  choice: 令人敬畏
  alternative: 可畏／令人畏惧
  rationale: 原词既可突出可畏，也可指激发敬畏与惊叹；正文采用“令人敬畏”以保留敬拜语境中的复合意味，并在脚注列出较偏向惧怕或震撼感的译法。
- issue: עַל כָּל הָאָרֶץ 的王权范围
  choice: 统管全地
  alternative: 作全地的王／高过全地
  rationale: 在登基诗语境中，此短语表达普世性的统治权；译文明确王权关系，但不进一步解释其实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“至高的耶和华”保留原文称号与神名的紧密排列；“大君王”保持王权意象；正文中的脚注标记与脚注完全对应。
