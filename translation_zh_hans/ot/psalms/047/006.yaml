base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/006.yaml
  text: Sing praises to God[a], sing praises; sing praises to our King, sing praises.
translation:
  language: zh_hans
  text: 你们要歌颂上帝[a]，要歌颂！你们要歌颂我们的王，要歌颂！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要向上帝奏乐……要向我们的王奏乐。”希伯来语动词可泛指以音乐赞美，不只限于歌唱。
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ / זַמֵּרוּ
  choice: 歌颂
  rationale: 此复数祈使动词在礼拜语境中指以歌唱或音乐来赞美。“歌颂”既自然凝练，又兼顾歌唱与赞美之意；四次重复照应希伯来文的鲜明节奏。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指以色列的上帝，是赞美所指向的对象；“上帝”是现代普通话中自然且庄重的对应表达。
- source_word: לְמַלְכֵּנוּ
  choice: 我们的王
  rationale: 介词 לְ 在此表示赞美所指向的对象。上下文明确以掌权的上帝为王，因此译作“我们的王”，既保留君王称号，也不增添原文没有的解释。
theological_decisions:
- issue: 上帝的君王称号
  choice: 我们的王
  alternative: 我们的君王
  rationale: 诗篇上下文颂扬上帝作王；“我们的王”直接保留原文的王权意象和亲近的归属表达，同时保持简洁。
translation_notes:
  register: 采用现代、庄重而易懂的礼拜诗歌语体。以两组平行祈使句和四次“歌颂”保存原文反复、强烈的节奏；感叹号用于呈现呼召赞美的力度。
