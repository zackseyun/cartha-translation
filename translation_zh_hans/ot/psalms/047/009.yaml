  text: נְדִ֘יבֵ֤י עַמִּ֨ים נֶאֱסָ֗פוּ עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭/אלֹהִים מָֽגִנֵּי אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/009.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[a], for the shields of the earth belong to God[b]; he is greatly exalted.
translation:
  language: zh_hans
  text: 万民的首领聚集，成为亚伯拉罕的上帝的子民[a]；因为大地的盾牌都属于上帝[b]；他极其崇高。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与亚伯拉罕的上帝的子民一同聚集。”原文紧缩的结构可以表示密切联合，也可以表示身份认同。
    reason: alternative_reading
  - marker: b
    text: “大地的盾牌”也可理解为“大地的统治者”或“世上的首领”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדִיבֵי עַמִּים
  choice: 万民中的尊贵人
  rationale: נְדִיבֵי 在此指有地位的尊贵人或首领；“尊贵人”既自然，也不过早把称谓限定为政治统治者。עַמִּים 译作“万民”，表达多个族群的集合。
- source_word: נֶאֱסָפוּ
  choice: 都聚集起来
  rationale: 该词为 אסף 的尼法勒完成式，在这里适合按不及物意义理解为聚集、会合；“聚集起来”符合诗歌宣告的语气。
- source_word: עַם אֱלֹהֵי אַבְרָהָם
  choice: 成为亚伯拉罕之上帝的子民
  rationale: 希伯来语是紧缩的同位结构，可能表示这些尊贵人被认同为上帝的子民，也可能表示他们与这子民一同聚集。正文采用前一种较符合上下文的理解，并以脚注保留另一种读法。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出前述宣告的根据，现代汉语用“因为”清楚自然。
- source_word: לֵאלֹהִים
  choice: 都属于上帝
  rationale: 介词 לְ 在此表达归属关系；“属于上帝”明确传达这一含义。
- source_word: מָגִנֵּי אֶרֶץ
  choice: 大地的盾牌
  rationale: 直译保留“盾牌”这一鲜明比喻；它在语境中可能指大地上的统治者或保护者，相关解释列于脚注。
- source_word: מְאֹד נַעֲלָה
  choice: 他被高高尊崇
  rationale: נַעֲלָה 为阳性单数，承接上帝为主语；在赞美诗语境中表示上帝极其崇高、受尊崇。“高高尊崇”兼顾原文程度副词与庄重语体。
theological_decisions:
- issue: 聚集的万民尊贵人与亚伯拉罕之上帝子民的关系
  choice: 正文理解为他们聚集起来，成为亚伯拉罕之上帝的子民。
  alternative: 他们与亚伯拉罕之上帝的子民一同聚集。
  rationale: 原文 עַם 前没有明确介词，结构紧缩，可以表达身份认同，也可以理解为密切联合或伴随。全诗宣告上帝作万国之王，身份认同的理解与语境相称，但脚注保留伴随式读法，避免消除原文的张力。
- issue: “大地的盾牌”所指
  choice: 正文保留盾牌的比喻。
  alternative: 直接译作“大地的统治者”或“世上的首领”。
  rationale: “盾牌”可能转喻统治者或保护者，但原文意象清楚有力；保留比喻可避免把其政治含义解释得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”与所给咨询文本保持一致；“万民”“尊贵人”“高高尊崇”保留诗篇的公共赞美语气。脚注标记置于各自所解释的短语之后，并按原文实际歧义校正了咨询层中疑似错置的标记对应关系。
