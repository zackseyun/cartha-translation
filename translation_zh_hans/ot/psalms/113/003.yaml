  text: מִ/מִּזְרַח שֶׁ֥מֶשׁ עַד מְבוֹא֑/וֹ מְ֝הֻלָּ֗ל שֵׁ֣ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/003.yaml
  text: From the rising of the sun to its setting[b][a], the name of Yahweh is to be praised.
translation:
  language: zh_hans
  text: 从日出到日落[a]，雅威[b]的名当受赞美。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从东方到西方”；原文直译为“从太阳升起到它落下”。
    reason: lexical_alternative
  - marker: b
    text: 原文为YHWH（四字神名）；传统上译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: 从日出
  rationale: מִזְרַח既可指太阳升起，也可指东方；与שֶׁמֶשׁ连用，并和后面的“日落”形成诗歌性的首尾表达，因此正文采用自然而贴近原文的“从日出”。
- source_word: עַד מְבוֹאוֹ
  choice: 到日落
  rationale: מְבוֹאוֹ字面指太阳“进入”或落下，第三人称阳性单数词尾指向太阳；“到日落”以现代汉语自然表达这一意象。
- source_word: מְהֻלָּל
  choice: 当受赞美
  rationale: 该词为被动分词，可表达“受赞美”或“配受赞美”；“当受赞美”兼顾恒常陈述与隐含的敬拜召唤，不将其改成原文没有的直接命令。
- source_word: שֵׁם
  choice: 名
  rationale: 保留“名”的原文意象，使其可以承载名声、启示出来的身份以及敬拜中所认识的那一位等丰富含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名YHWH，而不以“主”这一称号替代；脚注说明其原文形式与传统译法。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名YHWH。正文保留为专名，避免以称号“主”取代；“耶和华”在现代中文圣经传统中辨识度高，脚注补充原文信息。
- issue: מְהֻלָּל在本节中的语气
  choice: 当受赞美
  alternative: 受到赞美；愿……受赞美
  rationale: 被动分词既可作一般性陈述，也带有规范和劝勉意味。“当受赞美”保留这种张力，同时避免译成明确祈愿或直接命令。
- issue: “日出到日落”的范围
  choice: 正文保留太阳运行的诗歌意象
  alternative: 从东到西
  rationale: 原文既可表达一天从早到晚，也可借日出与日落之处表达从东到西的普世范围；正文不将双重可能性限定为其中之一，脚注列出空间性理解。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“从日出到日落”保留希伯来诗歌的对称意象；“当受赞美”兼具陈述与劝勉色彩。脚注标记均置于正文相应词语之后。
