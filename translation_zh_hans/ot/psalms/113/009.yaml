  text: מֽוֹשִׁיבִ֨י עֲקֶ֬רֶת הַ/בַּ֗יִת אֵֽם הַ/בָּנִ֥ים שְׂמֵחָ֗ה הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/009.yaml
  text: He gives the barren woman a home[a], as a joyful mother of children[b]. Praise Yah!
translation:
  language: zh_hans
  text: 他使不能生育的妇人在家中安居，成为儿女的母亲，满心喜乐。你们要赞美雅！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “雅”是希伯来文神名的短式；“你们要赞美雅”传统音译为“哈利路亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: מֽוֹשִׁיבִי
  choice: 他使……安居
  rationale: 这是ישׁב的使役分词，表达“使居住、使安顿”。“使……安居”既保留使役意义，也符合诗歌语体。
- source_word: עֲקֶרֶת
  choice: 不能生育的妇人
  rationale: 该词指不能生育、没有孩子的女子；此译法比“不孕妇女”少医学色彩，也比“不能生育的妻子”更少加入原文未明说的身份。
- source_word: הַבַּיִת
  choice: 家中
  rationale: בַּיִת既可指房屋，也可指家庭生活的场域；“家中”自然表达安顿和归属，同时没有过度解释为拥有一所房产。
- source_word: אֵם הַבָּנִים
  choice: 儿女的母亲
  rationale: בָּנִים可专指儿子，也常泛指儿女；本句重点是从不能生育到成为母亲，并不强调孩子的性别。
- source_word: שְׂמֵחָה
  choice: 满心喜乐
  rationale: 原词是阴性形容词“喜乐的”，修饰母亲；中文拆作“满心喜乐”，更自然地保留她喜乐的状态。
- source_word: הַֽלְלוּ יָהּ
  choice: 你们要赞美雅
  rationale: הַלְלוּ是复数命令式，故明确译作“你们要赞美”；יָהּ是神名的短式，音译为“雅”，不与完整的四字神名混同。
theological_decisions:
- issue: 结尾神名短式יָהּ的译法
  choice: 雅
  alternative: 主；哈利路亚
  rationale: 原文使用神名短式יָהּ，而不是四字神名יהוה。“雅”保留其名称性质及形式差异；“主”会将名称改为称号，“哈利路亚”则是整个短语的传统音译。
- issue: 不能生育者与母亲身份之间的关系
  choice: 用“作儿女的母亲”表达处境的逆转
  alternative: 只按同位结构直译为“儿女的喜乐母亲”
  rationale: 希伯来文以同位性短语描绘上帝行动带来的结果。中文用“作”自然呈现这一结果，但不说明其具体实现方式，以免加入原文没有交代的神学或生理解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不能生育”避免过度临床化；“安居家中”保留诗意和归属感。末句保留复数命令语气及神名短式。
