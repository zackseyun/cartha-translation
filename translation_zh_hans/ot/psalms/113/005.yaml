  yaml_path: translation/ot/psalms/113/005.yaml
  text: Who is like Yahweh our God[a], who is seated on high[b],
translation:
  language: zh_hans
  text: 谁能像耶和华——我们的上帝[a]？他高坐在上[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”译自希伯来文神名יהוה；也常音译作“雅威”，一些译本译作“上主”。
    reason: 说明神名的原文性质及常见的中文译法。
  - marker: b
    text: 较直译：“使自己升高而坐”；“坐”也可译作“居住”。这里表达耶和华居于至高尊位的形象。
    reason: 交代使役分词与לָשָׁבֶת的字面结构，并保留“坐”与“居住”的词义空间。
lexical_decisions:
- source_word: מִי כַּ/יהוָה
  choice: 谁能像耶和华
  rationale: מִי与比较前缀כ构成反问，表达无人可与之相比；汉语用“谁能像”自然保留不可比拟的语气。יהוה音译为“耶和华”，明确呈现神的专名。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 该词带第一人称复数后缀，直译为“我们的上帝”，与“耶和华”同位。
- source_word: הַמַּגְבִּיהִי
  choice: 他升居至高之处
  rationale: 该使役形分词有“使之高、升高”的意味；结合后面的“不定式‘坐/居’”，译为“升居”兼顾主动升高和尊位意象，避免仅译“住在高处”而削弱其崇高性。
- source_word: לָשָׁבֶת
  choice: 居
  rationale: ישׁב可指坐下、居住或居于尊位；此处与“升高”结合，“居”在现代汉语中较自然，也保留高处安坐或掌权的含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。中文采用广为人知的专名“耶和华”，而不以称号替代；脚注说明其性质及其他常见音译。
- issue: הַמַּגְבִּיהִי לָשָׁבֶת所表达的形象
  choice: 升居至高之处
  alternative: 坐在高处；高高在上；使自己升高而坐
  rationale: 原文形式可较直地理解为“升高而坐/居”，并可能带有崇高宝座的意象。正文保留“升”的动态色彩与“居”的语义宽度，不把它完全限定为居住或登基。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“谁能像”保留反问力量；“升居至高之处”兼顾原文形式、崇高意象和中文自然度。句末逗号保留本节与下一节平行结构的延续感。
