  text: הַ֥לְלוּ יָ֨הּ הַ֭לְלוּ עַבְדֵ֣י יְהוָ֑ה הַֽ֝לְלוּ אֶת שֵׁ֥ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/001.yaml
  text: Praise Yah! Praise[a], servants of Yahweh[b]; praise the name of Yahweh.
translation:
  language: zh_hans
  text: 你们要赞美雅[a]！雅威的仆人哪[b]，你们要赞美；你们要赞美雅威的名！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“哈利路—雅”直译为“赞美雅”；“雅”是神名的缩略形式。
    reason: lexical_alternative
  - marker: b
    text: 或译“奴仆”。希伯来语此词可指服事者，也可指受奴役的人；这里的敬拜语境较适合译作“仆人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: 你们要赞美
  rationale: 这是动词הלל的皮埃勒词干复数祈使式，直接呼召众人赞美；译出“你们”和“要”，可在现代汉语中清楚保留复数祈使语气及原文三次重复的力度。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的缩略形式，与本节后两处完整形式יְהוָה有别；音译为“雅”，既保留原文区别，也显明“哈利路亚”一语的构成。
- source_word: עַבְדֵי
  choice: 仆人
  rationale: עבד的复数附属形式可指服事者或奴仆；本节是在敬拜语境中称呼属雅威、事奉他的人，“仆人”自然贴切，同时脚注保留“奴仆”的词义可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文神名四辅音的常见学术重构音译，避免以称号替代专名，并与缩略形式“雅”保持形式上的区别。
- source_word: אֶת שֵׁם יְהוָה
  choice: 雅威的名
  rationale: 忠实表达由直接宾语标记引出的附属结构“雅威的名”，并保留“名”作为赞美对象的强调。
theological_decisions:
- issue: 同一节中יָהּ与יְהוָה的译法
  choice: 分别译作“雅”和“雅威”
  alternative: 把两者都译作“耶和华”或“主”
  rationale: 原文有意并用神名的缩略形式与完整形式；分别音译可保留这一差异，而不以称号取代神名。
- issue: עַבְדֵי在敬拜者身份上的表达
  choice: 仆人
  alternative: 奴仆
  rationale: 两种含义都在该词的语义范围内；此处直接呼召敬拜者赞美，“仆人”较符合现代汉语诗歌与敬拜语境，但不否定其可指受役属之人的含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“……哪”表达诗歌中的直接呼语，并三次保留“你们要赞美”，重现原文反复呼召的节奏与力度；神名使用“雅／雅威”以呈现缩略形式和完整形式的区别。
