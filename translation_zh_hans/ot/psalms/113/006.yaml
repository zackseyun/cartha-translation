  text: הַֽ/מַּשְׁפִּילִ֥י לִ/רְא֑וֹת בַּ/שָּׁמַ֥יִם וּ/בָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/006.yaml
  text: who stoops down to look on the heavens and the earth[a].
translation:
  language: zh_hans
  text: 他俯身察看天上和地上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他谦卑自己，观看诸天和大地。”
    reason: 词汇替代译法：הַמַּשְׁפִּילִי 可较直译为“使自己降低／谦卑自己”；בַּשָּׁמַיִם וּבָאָרֶץ 也可将天地理解为直接观看的对象。
lexical_decisions:
- source_word: הַמַּשְׁפִּילִי
  choice: 他俯身
  rationale: 该词是 שׁפל 的使役式分词，在这里描绘至高的上帝使自己降低、俯身而下。“俯身”保留鲜明的拟人意象，也避免把经文抽象化为“留意”。
- source_word: לִרְאוֹת
  choice: 察看
  rationale: ראה 的不定词在此表达俯身的目的。“察看”既保留“看”的基本意义，也符合庄重而自然的现代汉语表达。
- source_word: בַּשָּׁמַיִם
  choice: 天上
  rationale: שׁמים 指诸天；介词 בְּ 在此可表达察看的领域或范围。“天上”与下文“地上”构成自然的宇宙性对应。
- source_word: וּבָאָרֶץ
  choice: 和地上
  rationale: אָרֶץ 是与诸天相对的大地；保留介词所表达的范围，以“天上和地上”呈现两极并举的整体范围。
theological_decisions:
- issue: 上帝超越万有却俯身察看的拟人描写
  choice: 保留“俯身”的形象
  alternative: 他谦卑自己；他从高处俯视
  rationale: 前一节宣告上帝居于至高之处，本节则以拟人方式表明，连诸天也在他之下，他仍俯身察看。译文保留上帝的超越与俯就之间的张力，不将其化约为抽象的“关注”，也不额外解释其方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“俯身察看”保留希伯来诗歌的具体意象；“天上和地上”简洁呈现宇宙性的两极并举。脚注标记已置于正文。
