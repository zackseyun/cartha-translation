  yaml_path: translation/ot/psalms/113/008.yaml
  text: to seat him with nobles[b][a], with the nobles of his people.
translation:
  language: zh_hans
  text: 使他与显贵同坐[a]，与他百姓中的显贵同坐。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显贵”也可译作“首领”或“诸侯”；希伯来词可指身份显赫或具统治地位的人。
    reason: lexical_alternative
  - marker: b
    text: “他百姓”中的“他”较可能指耶和华；也可能指被扶起的贫寒人。
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹשִׁיבִי
  choice: 使他……同坐
  rationale: 这是ישׁב的使役式不定词，承接上一节，表达目的或结果，即使那贫寒人得以坐在尊贵人中；“使他……同坐”既保留使役义，也符合现代汉语诗体。
- source_word: עִם
  choice: 与
  rationale: 直译为“与”，并在两处重复，以保留希伯来文的平行结构和强调。
- source_word: נְדִיבִים / נְדִיבֵי
  choice: 尊贵人
  rationale: 此词在这里指社会地位崇高、居领导地位的人。“尊贵人”比“慷慨的人”更切合语境，又不像“王子”或“诸侯”那样过度限定身份。
- source_word: עַמּוֹ
  choice: 他百姓
  rationale: עַם通常指一个群体或民族；在本诗赞颂耶和华眷顾卑微者的语境中，译作“他百姓”自然，并保留代词所指可能存在的歧义。
theological_decisions:
- issue: “他百姓”中“他”的所指
  choice: 正文保留“他”，脚注说明较可能指耶和华
  alternative: 也可能指被高举的贫寒人，即“那人本族的尊贵人”
  rationale: 希伯来语第三人称单数后缀在语法上可能指耶和华，也可能回指被扶起的人。上下文持续以耶和华为行动主体，因此较可能指耶和华的百姓，但正文不应消除原文真实的指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语；重复“与……同坐”以体现原文两次עִם及诗句平行。脚注标记均置于正文相应位置。
