base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/007.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap.
translation:
  language: zh_hans
  text: '他从尘土中扶起贫穷的人，

    从灰堆[a]中高举穷乏的人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“废物堆”。希伯来语 אַשְׁפֹּת 指弃置灰烬或废物的地方，描绘极其卑微的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקִימִי
  choice: 扶起
  rationale: 该词是 קום 的使役分词，表示使低微者起来或站起。“扶起”自然地保留使人从卑下处境中起来的动态意象，并与下半句“抬举”形成诗歌平行。
- source_word: מֵעָפָר
  choice: 从尘土中
  rationale: עָפָר 指尘土、松散的泥土；מִן 表示起点。“从尘土中”保留了卑微、受辱的具体图像。
- source_word: דָּל
  choice: 贫寒人
  rationale: דָּל 可指贫穷、弱小或社会地位低微的人。“贫寒人”在现代汉语中清楚自然，也保留经济贫困与低微处境的含义。
- source_word: מֵאַשְׁפֹּת
  choice: 从灰堆中
  rationale: אַשְׁפֹּת 指弃置灰烬或废物的堆积处。“灰堆”保留传统而具体的图像；脚注说明也可理解为垃圾堆，以呈现词义范围。
- source_word: יָרִים
  choice: 抬举
  rationale: 该词来自 רום 的使役形，意为使升高、举起。“抬举”既与“扶起”构成平行，也可含社会地位被提升之意，但不提前展开下一节的具体结果。
- source_word: אֶבְיוֹן
  choice: 穷乏人
  rationale: אֶבְיוֹן 指贫困、缺乏生活所需的人。“穷乏人”与上半句“贫寒人”有所区分，同时保留两者语义重叠的诗歌平行。
theological_decisions:
- issue: 社会性与物质性的翻转意象
  choice: 保留贫寒人、穷乏人、尘土和灰堆等具体图像，不将其灵意化。
  alternative: 将本节泛化为上帝提升谦卑者，或专指属灵层面的卑微与高升。
  rationale: 希伯来文使用具体的社会类别和物质场景，直接描绘上帝使困苦卑微者翻转处境。译文保留这一张力，不排除进一步的神学应用，也不把该应用写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；两行保持结构平行。“扶起／抬举”和“贫寒人／穷乏人”既体现同义平行，也避免机械重复。脚注标记置于其实际说明的“灰堆”之后。
