  text: רָ֖ם עַל כָּל גּוֹיִ֥ם יְהוָ֑ה עַ֖ל הַ/שָּׁמַ֣יִם כְּבוֹדֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/004.yaml
  text: Yahweh is high above all nations; his glory is above the heavens.
translation:
  language: zh_hans
  text: 耶和华高居万国之上；他的荣耀高过诸天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָם
  choice: 高居
  rationale: 此处是谓语形容词，表达崇高、居于高处。“高居”在现代汉语中自然庄重，也保留诗句的垂直空间意象。
- source_word: עַל כָּל גּוֹיִם
  choice: 万国之上
  rationale: עַל在此兼有位置高于和超越之意；“万国之上”与下半句“高过诸天”形成清晰的平行结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名在现代简体中文圣经语境中的通行音译，而不以称号替代。
- source_word: עַל הַשָּׁמַיִם
  choice: 高过诸天
  rationale: שָׁמַיִם在诗歌语境中译作“诸天”；“高过”自然表达עַל所表示的超越，并与上半句形成变化中的平行。
- source_word: כְּבוֹדוֹ
  choice: 他的荣耀
  rationale: כָּבוֹד可指荣耀、尊荣或威荣；在敬拜语境中，“荣耀”最贴切，也不额外限定其表现方式。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文正文采用读者最熟悉且长期通行的专名“耶和华”，保留其作为专名的性质，不以“主”等称号替代；“雅威”是依据现代学界常见拟音的可行替代。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。上下两句分别用“万国之上”和“高过诸天”，既保留希伯来文平行结构，也避免中文机械重复。
