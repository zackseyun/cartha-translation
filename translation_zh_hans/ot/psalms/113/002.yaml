id: PSA.113.2
reference: Psalms 113:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהִ֤י שֵׁ֣ם יְהוָ֣ה מְבֹרָ֑ךְ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/002.yaml
  text: May the name of Yahweh be blessed from now and forever[a].
translation:
  language: zh_hans
  text: 愿耶和华的名从今直到永远都受称颂。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿耶和华的名蒙福。”
    reason: 保留 מְבֹרָךְ 更为字面的被动祝福表达；正文按诗篇敬拜语境译为“受称颂”。
lexical_decisions:
- source_word: יְהִי
  choice: 愿……受
  rationale: 这是动词 היה 的祈愿式，在此表达祝愿或劝勉，而非普通陈述；“愿”自然保留了这一语气。
- source_word: שֵׁם
  choice: 名
  rationale: 直译为“名”，并保留希伯来语中名字代表其本人及声誉的含义，不在正文中扩展解释。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名“耶和华”呈现四字神名，保留其专名性质，不以“主”这一称号替代。
- source_word: מְבֹרָךְ
  choice: 受称颂
  rationale: 该词是 ברך 的被动分词；在神的名作为承受者的诗歌语境中，“受称颂”既保留被动形式，也比字面“被祝福”更符合现代汉语敬拜用语。
- source_word: מֵעַתָּה
  choice: 从今
  rationale: 简洁自然地表达从当前时刻开始。
- source_word: וְעַד עוֹלָם
  choice: 直到永远
  rationale: 准确表达延续至无穷久远的时间范围，并与“从今”构成自然的汉语搭配。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名。正文采用现代中文圣经传统中最通行、普通读者最易识别的音译“耶和华”，而不以称号“主”代替；“雅威”则是另一种可能的音译。
- issue: מְבֹרָךְ 在敬拜语境中的表达
  choice: 受称颂
  alternative: 蒙福；受祝福
  rationale: 原词形式为被动分词，但用于神的名时，中文“受称颂”更自然，也保留颂赞归于神的含义；“蒙福”容易使读者理解为神从更高者领受福分。
translation_notes:
  register: 采用自然、庄重而清晰的现代标准汉语。“从今直到永远”保留原文时间跨度；“都”使中文谓语衔接顺畅，不增加实质意义。
