source:
  edition: WLC
  text: דִּמִּ֣ינוּ אֱלֹהִ֣ים חַסְדֶּ֑/ךָ בְּ֝/קֶ֗רֶב הֵיכָלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/009.yaml
  text: We have reflected on your steadfast love[a], O God, in the midst of your temple.
translation:
  language: zh_hans
  text: 神啊，我们在你的殿中默想[a]你的慈爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“思想”或“思量”。希伯来语动词在这里可表示反复思想、揣摩。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמִּינוּ
  choice: 默想
  rationale: 该词为 דמה 的 piel 完成式第一人称复数；此处最自然地表示在心里思想、揣摩。译作“默想”符合圣殿敬拜的语境，也保留了沉思的意味。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 上下文表明这是直接称呼；用“神啊”清楚、自然地呈现呼格和祷告语气。
- source_word: חַסְדֶּךָ
  choice: 你的慈爱
  rationale: חֶסֶד 在这里指神持久、忠诚而带有关系性的爱。“慈爱”是简洁庄重、普通读者易懂的表达，也没有把词义缩窄为单纯的怜悯。
- source_word: בְּקֶרֶב
  choice: 在……中
  rationale: 该短语表示处在某物内部或当中；汉语“在你的殿中”自然保留其空间意义。
- source_word: הֵיכָלֶךָ
  choice: 你的殿
  rationale: הֵיכָל 可指宫殿或圣殿；本诗的锡安与敬拜语境明确支持“殿”。“你的殿”也比补译为“你的圣殿”更贴近原文的简洁表达。
theological_decisions:
- issue: חֶסֶד 所表达的神之爱的性质
  choice: 慈爱
  alternative: 怜悯；信实的爱；盟约之爱
  rationale: “慈爱”能兼顾恩慈与持久忠诚，不把意义限于怜悯，也不在正文中加入原词未明说的技术性“盟约”措辞。
- issue: אֱלֹהִים 是直接称呼还是一般指称
  choice: 按直接称呼译为“神啊”
  alternative: 按一般指称译为“神”
  rationale: 句法和诗歌祷告语境最自然地支持呼格；“啊”只明确原有语气，并未增添神学内容。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。“默想”贴合敬拜场景；语序“在你的殿中默想你的慈爱”自然清楚，并保留原文的地点与对象。
