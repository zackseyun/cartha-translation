lexical_decisions:
- source_word: רְעָדָה
  choice: 战栗
  rationale: 该名词指颤抖、震颤；此处作主语。“战栗”既保留身体颤抖的具体意象，也自然传达恐惧。
- source_word: אֲחָזָתַם
  choice: 抓住他们
  rationale: אחז意为抓住、攫住。采用“抓住他们”保留原文突然被强大力量控制的形象，并与阴性单数主语“战栗”相应。
- source_word: שָׁם
  choice: 在那里
  rationale: 忠实表达地点副词，使场景保持鲜明。
- source_word: חִיל
  choice: 痛苦
  rationale: 该词可指扭动、产痛或极深的痛苦。“痛苦”在正文中兼顾身心煎熬，而分娩的明喻进一步说明其强烈程度；脚注保留“扭动”的词义可能。
- source_word: כַּיּוֹלֵדָה
  choice: 如临产的妇人
  rationale: 该比较短语来自ילד的分词形式，指正在分娩的女子。“如临产的妇人”简洁、庄重且符合现代汉语。
