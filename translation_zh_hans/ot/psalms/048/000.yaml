  yaml_path: translation/ot/psalms/048/000.yaml
  text: A song, a psalm, of[a] the sons of Korah.
translation:
  language: zh_hans
  text: 一首歌，一篇诗，归于[a]可拉子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“交给可拉子孙”。希伯来语介词在诗篇标题中可表示关联、作者、题献对象或演唱安排。
    reason: 保留标题介词 לְ 的多义性，避免把它狭义确定为作者标记。
lexical_decisions:
- source_word: שִׁיר
  choice: 歌
  rationale: 这是表示“歌曲、歌”的常用名词；译作“歌”自然明白，也不额外限定为赞美诗。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 在诗篇标题中指配合音乐的诗歌体裁。译作“诗”可与前面的“歌”区分，保留原文并列的双重称谓；卷名语境已清楚表明这是诗篇。
- source_word: לִבְנֵי
  choice: 归于……子孙
  rationale: 标题中的介词 לְ 含义宽泛，可涉及归属、创作、献予或演唱安排。“归于”比“由……所作”更少限定作者身份，并以脚注保留其他可能。
- source_word: קֹרַח
  choice: 可拉
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בְנֵי קֹרַח
  choice: 可拉子孙
  rationale: בְנֵי 在此可指可拉的后代或以其名相连的群体；“可拉子孙”简洁，并保留传统称呼。
theological_decisions:
- issue: 标题短语 לִבְנֵי קֹרַח 的功能
  choice: 归于可拉子孙
  alternative: 交给可拉子孙；可拉子孙所作
  rationale: 希伯来语介词 לְ 在诗篇标题中可能表示归属、作者、题献对象或礼仪演唱关系。正文不把它明确限定为作者身份，脚注提示其语义范围。
translation_notes:
  register: 采用简洁庄重的标题体。“一首歌，一篇诗”保留 שִׁיר 与 מִזְמוֹר 的并列，不合并成单一的“诗歌”；量词使现代汉语自然。脚注标记紧接“归于”，明确对应有歧义的介词。
