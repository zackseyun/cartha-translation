  text: יְפֵ֥ה נוֹף֮ מְשׂ֪וֹשׂ כָּל הָ֫/אָ֥רֶץ הַר צִ֭יּוֹן יַרְכְּתֵ֣י צָפ֑וֹן קִ֝רְיַ֗ת מֶ֣לֶךְ רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/002.yaml
  text: Beautiful in elevation[a], the joy of all the earth, is Mount Zion, in the far north, the city of the great King.
translation:
  language: zh_hans
  text: 锡安山高耸秀美，是全地的喜乐；它在北方极处[a]，是大君王的城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在北面的山坡上”；直译“在北方的深处（或边缘）”。这句话也可能呼应与撒分山有关的神山意象。
    reason: 原文短语יַרְכְּתֵי צָפוֹן含义有争议，既可能是地形或方位描述，也可能带有古代神山意象。
lexical_decisions:
- source_word: יְפֵה נוֹף
  choice: 高耸秀美
  rationale: נוֹף含义较难确定，可能指高度、地势或高耸的外观；与יְפֵה合译为“高耸秀美”，既自然凝练，也保留地貌与美感两方面。
- source_word: מְשׂוֹשׂ כָּל הָאָרֶץ
  choice: 全地的喜乐
  rationale: מְשׂוֹשׂ意为“喜乐、欢喜之源”；הָאָרֶץ在本诗宏阔的赞美语境中译作“地”比“土地”更合适，并保留普世意味。
- source_word: הַר צִיּוֹן
  choice: 锡安山
  rationale: 采用现代中文圣经语境中通行且易懂的地名译法。
- source_word: יַרְכְּתֵי צָפוֹן
  choice: 在北方极处
  rationale: יַרְכְּתֵי可指边缘、深处或极处，צָפוֹן既可表示北方，也可能让人联想到撒分；“北方极处”保留其地理表达和潜在的神山意象，不在正文中强行判定。
- source_word: קִרְיַת מֶלֶךְ רָב
  choice: 大君王的城
  rationale: 按希伯来语组合关系直译；“大君王”在诗篇语境中自然指至高掌权的上帝，同时不额外增补解释。
theological_decisions:
- issue: יַרְכְּתֵי צָפוֹן与锡安山的关系
  choice: 正文译作“在北方极处”，保留其地理与诗性张力
  alternative: “在北面的山坡上”或理解为对撒分神山意象的呼应
  rationale: 原文可能是地形描述，也可能借用古代近东关于北方神山的意象来宣告锡安的独特地位。正文不消解这种歧义，脚注列明主要可能。
- issue: מֶלֶךְ רָב的指称
  choice: 译作“大君王”
  alternative: “一位大君王”
  rationale: 该短语与锡安作为上帝之城的诗篇语境相符；“大君王”保持明确而庄重，但不在正文中另加“上帝”以免超出本节字面。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体中文。“高耸秀美”凝练表达地势与美感；分号呈现锡安山、北方极处与大君王之城之间的同位和说明关系。脚注标记[a]紧随有歧义的短语。
