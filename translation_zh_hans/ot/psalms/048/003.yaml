  yaml_path: translation/ot/psalms/048/003.yaml
  text: God is known in her citadels as a stronghold[a][b].
translation:
  language: zh_hans
  text: 神在她的堡垒中被认作坚固的保障[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒”或译“宫殿”。希伯来语可指宏伟的居所，也可指设防的建筑；这里的上下文强调这城的安全。
    reason: lexical_alternative
  - marker: b
    text: “坚固的保障”或译“避难所”“堡垒”或“安全的高处”。所译的希伯来语指高而安全、可供保护之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处虽为形态上的复数形式，却在诗篇语境中作为以色列之神的单数称谓；现代汉语自然译作“神”。
- source_word: בְּאַרְמְנוֹתֶיהָ
  choice: 在她的堡垒中
  rationale: אַרְמוֹן可指宫殿或设防的宏伟建筑。诗篇48篇强调锡安的安全，故正文采用“堡垒”；阴性单数后缀译作“她的”，指拟人化的锡安城。
- source_word: נוֹדַע
  choice: 显明自己
  rationale: ידע的Niphal形式可表达“被认识、为人所知”，也可按语境译作“使自己为人所知”。汉语用“显明自己”能自然表达神在城中被认识为保障，但原文语态的歧义以脚注保留。
- source_word: לְמִשְׂגָּב
  choice: 是坚固的保障
  rationale: מִשְׂגָּב指高处的安全之地，引申为避难所、保障或堡垒。为避免与前面的“堡垒”重复，正文译为“坚固的保障”，保留保护和安全的意象。
theological_decisions:
- issue: “她的堡垒”中阴性后缀的所指
  choice: 指本诗所颂扬的锡安城，并以“她”保留城市拟人化的表达
  alternative: 泛指土地或群体
  rationale: 紧邻语境集中于锡安山和神的城，因此后缀最自然地指锡安城；不过本节没有再次明说其名称。
- issue: נוֹדַע的语态和神的自我显明
  choice: 正文译“显明自己”，表达神在城中为人所认识
  alternative: 译“为人所知”或“被认作”
  rationale: Niphal既可按状态或被动理解，也可在此语境中表达自我显明。为避免把一种语法解释绝对化，脚注列出较形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“她”承接锡安城的拟人化；“坚固的保障”避免同句连续使用“堡垒”，同时保留原文安全高地和保护之所的意象。
