  text: שִׁ֤יתוּ לִבְּ/כֶ֨ם לְֽ/חֵילָ֗/ה פַּסְּג֥וּ אַרְמְנוֹתֶ֑י/הָ לְמַ֥עַן תְּ֝סַפְּר֗וּ לְ/ד֣וֹר אַחֲרֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/013.yaml
  text: Set your heart on her rampart[a]; pass through her citadels[b], so that you may tell the next generation.
translation:
  language: zh_hans
  text: 你们要留心察看她的城墙[a]，巡行她的堡垒[b]，好把这一切述说给后来的世代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城墙”或译“外墙”或“壁垒”。希伯来语泛指城邑的防御工事。
    reason: lexical_alternative
  - marker: b
    text: “堡垒”或译“宫殿”。希伯来语可指宫殿建筑，也可指坚固的要塞；本节察看城防的语境支持译作“堡垒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתוּ לִבְּכֶם
  choice: 你们要留心察看
  rationale: 该短语直译为“把你们的心放在……上”，在此表示专心留意、仔细察看。译作“留心察看”既传达希伯来语“心”所涵盖的思想与注意，也符合现代汉语表达。
- source_word: לְחֵילָה
  choice: 她的城墙
  rationale: חֵיל在城邑语境中泛指防御工事，可能特指外墙或壁垒。“城墙”自然易懂，并保留较宽泛的所指；其他可能性列入脚注。
- source_word: פַּסְּגוּ
  choice: 巡行
  rationale: 这是一个罕见动词，在本节勘察城防的语境中，可能表示穿行、经过或仔细查看。“巡行”兼具实际行走和巡视察看的意味，不把它缩减为纯粹的思想活动。
- source_word: אַרְמְנוֹתֶיהָ
  choice: 她的堡垒
  rationale: אַרְמוֹן可指宫殿，也可指坚固高大的建筑或要塞。与前面的城防设施并列时，“堡垒”较贴合上下文，但“宫殿”仍是真实的词义可能，故用脚注保留。
- source_word: לְמַעַן
  choice: 好
  rationale: 表示目的。汉语“好……”简洁自然地引出巡察锡安之后向后代传讲的目的。
- source_word: תְּסַפְּרוּ
  choice: 述说
  rationale: ספר的加强语干在此意为讲述、 recount。“述说”庄重而通俗，适合把所见传给后代的语境。
- source_word: לְדוֹר אַחֲרוֹן
  choice: 后来的世代
  rationale: 字面意思是“后来的一个世代”。译作“后来的世代”保留其可指下一代或未来世代的开放性，避免过度限定为紧接的一代。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们”体现两个复数命令式；用阴性代词“她”承接诗歌中人格化的锡安。正文保持勘察城防并传述后世的动作顺序；“这一切”作为汉语中“述说”的自然宾语，概括所察看的城墙与堡垒，不增添具体神学解释。
