  yaml_path: translation/ot/psalms/048/011.yaml
  text: Let Mount Zion rejoice[a]; let the daughters of Judah be glad because of your judgments.
translation:
  language: zh_hans
  text: 愿锡安山欢喜；愿犹大的女儿们因你的审判而快乐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמַח
  choice: 愿……欢喜
  rationale: שׂמח 的 Qal 未完成式在诗歌语境中可表达祈愿或劝愿；“愿……欢喜”自然保留这种意愿色彩。
- source_word: הַר צִיּוֹן
  choice: 锡安山
  rationale: 这是现代汉语中自然且通行的专名表达，同时保留地形意象。
- source_word: תָּגֵלְנָה
  choice: 愿……快乐
  rationale: גיל 表示欢欣、喜乐；采用“快乐”与前句“欢喜”形成诗意变化，同时保留同一喜乐语义场。
- source_word: בְּנוֹת יְהוּדָה
  choice: 犹大的众城
  rationale: 字面为“犹大的女儿们”，但在希伯来诗歌中常指从属的城镇或聚落；正文采用现代读者更易理解的地理含义，并以脚注保留字面表达。
- source_word: לְמַעַן
  choice: 因为
  rationale: 此处引出欢喜快乐的缘由；“因为”简洁自然地表达因果关系。
- source_word: מִשְׁפָּטֶיךָ
  choice: 你的审判
  rationale: 结合本诗上文，主要指上帝作为君王和审判者所施行的裁决，而非主要指律例；“审判”也保留该词在公义、裁决和法令之间的语义张力。
theological_decisions:
- issue: מִשְׁפָּטֶיךָ 在本节语境中的含义
  choice: 你的审判
  alternative: 你的公正；你的律例
  rationale: 上下文庆贺上帝挫败敌对诸王的作为，因此更可能指他所施行的审判；此译法不把含义过度限定为律法条文，也未将其抽象化为单纯的“公正”。
translation_notes:
  register: 采用现代、庄重而易懂的诗体语言。“愿……愿……”保留两句平行结构；“众城”使地理所指清楚，脚注则呈现原文意象及其可能范围。
