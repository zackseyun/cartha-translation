  text: כַּ/אֲשֶׁ֤ר שָׁמַ֨עְנוּ כֵּ֤ן רָאִ֗ינוּ בְּ/עִיר יְהוָ֣ה צְ֭בָאוֹת בְּ/עִ֣יר אֱלֹהֵ֑י/נוּ אֱלֹ֘הִ֤ים יְכוֹנְנֶ֖/הָ עַד עוֹלָ֣ם סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/008.yaml
  text: 'Just as we have heard[a], so we have seen in the city of Yahweh of hosts, in the city of our God: God will establish her forever. Selah'
translation:
  language: zh_hans
  text: 我们所听见的，正如我们在万军之雅威的城中、在我们上帝的城中所看见的：上帝必使她[a]坚立，直到永远。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝必使它坚立。”希伯来语的阴性单数后缀指“城”；正文用“她”保留诗中的拟人表达。
    reason: 说明阴性后缀所指，并标示汉语不采用拟人表达时的自然替代译法。
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 怎样……也照样
  rationale: 保留希伯来语前后呼应的比较结构，同时符合现代汉语表达。
- source_word: שָׁמַעְנוּ ... רָאִינוּ
  choice: 我们听见……我们看见
  rationale: 两个完成式彼此平行，表达先前听闻之事如今得到亲眼印证；汉语无需强加英语完成时形式。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译神名יהוה；“万军”保留צְבָאוֹת的广泛含义，不限定为地上的军队。
- source_word: בְּעִיר ... בְּעִיר
  choice: 在……的城中，在……的城中
  rationale: 保留原文重复及两个介词短语的诗歌平行结构。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 直接表达第一人称复数所属后缀。
- source_word: יְכוֹנְנֶהָ
  choice: 必使她坚立
  rationale: כון在此有使之稳固、确立之意；阴性单数后缀回指阴性名词“城”，以“她”保留诗意拟人。
- source_word: עַד עוֹלָם
  choice: 直到永远
  rationale: 自然表达持续至无穷的时间含义，并保留עַד的延续感。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切功能不明，沿用音译，避免加入未经证实的解释。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名，采用较贴近学界通常复原读音的“雅威”，以神名而非称号来呈现。
- issue: יְכוֹנְנֶהָ中阴性后缀的所指与表达
  choice: 上帝必使她坚立
  alternative: 上帝必使它坚立
  rationale: 阴性单数后缀最自然地回指阴性名词“城”；“她”在汉语中体现诗意拟人，但“它”也可作为不拟人的自然译法。
- issue: “听见”与“看见”的关系
  choice: 保留“怎样……也照样”的对应关系
  alternative: 将其释义为听闻的报告已获证实
  rationale: 原文明确比较所听与所见，却未具体说明听见的内容；正文不补入解释，以保留诗句的概括性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文“听见—看见”与两次“城中”的平行结构；“细拉”音译，不作解释性扩写。
