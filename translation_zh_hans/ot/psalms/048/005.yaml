lexical_decisions:
- source_word: הֵמָּה
  choice: 他们
  rationale: 这是带强调意味的第三人称阳性复数独立代词；现代汉语以“他们”自然表达，语境和句首位置足以承载其强调。
- source_word: רָאוּ
  choice: 看见了
  rationale: ראה的Qal完成式，基本义为“看见”；加“了”自然呈现已发生的动作。
- source_word: כֵּן
  choice: 就
  rationale: 该词在此衔接所见与随后的反应，具有承接或结果意味；“就”简洁自然，又不把逻辑关系说得过满。
- source_word: תָּמָהוּ
  choice: 惊讶不已
  rationale: תמה的Qal完成式，表示惊异、诧异；此译保留中性的惊讶含义，同时符合连续增强的反应。
- source_word: נִבְהֲלוּ
  choice: 惊恐万分
  rationale: בהל的Nifal完成式，可指慌乱、惊惶或恐惧；在本节递进的惊慌场景中，以较强的“惊恐万分”表达其力度。
- source_word: נֶחְפָּזוּ
  choice: 慌忙逃走
  rationale: חפז的Nifal完成式强调受压力驱使的急速行动；上下文支持逃离，但词本身的核心是仓促、慌乱，因此正文兼顾“慌忙”与“逃走”，脚注保留较少解释性的译法。
