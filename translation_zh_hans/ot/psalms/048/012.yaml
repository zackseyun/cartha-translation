  yaml_path: translation/ot/psalms/048/012.yaml
  text: Walk around Zion and go around her[a]; count her towers.
translation:
  language: zh_hans
  text: '你们要绕行锡安，环绕她[a]；

    数点她的城楼。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“绕她一周”。
    reason: 原词表示环行、绕行；此处也可用更明确强调完整环绕的说法。
lexical_decisions:
- source_word: סֹבּוּ
  choice: 绕行
  rationale: 这是复数命令式，表示绕着某处行走。“绕行”简洁自然，保留了具体的空间行动，没有将其抽象化为“察看”。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 原文仅为专名“锡安”，没有“山”字，因此不增译为“锡安山”。
- source_word: וְהַקִּיפוּהָ
  choice: 环绕她
  rationale: 这是带阴性单数宾语后缀的复数命令式，意为绕着锡安一周。“环绕她”既与前一命令形成近义并列，也保留原文把锡安视为阴性的表达；不用“包围她”，以免无根据地引入敌对意味。
- source_word: סִפְרוּ
  choice: 数点
  rationale: 在察看城防设施的语境中，此命令指逐一计数。“数点”比“述说”更准确，也符合庄重的现代汉语表达。
- source_word: מִגְדָּלֶיהָ
  choice: 她的城楼
  rationale: 名词带阴性单数所属后缀，回指锡安。“她的”保留原文对城的阴性拟人化；“城楼”比泛指的“高楼”更符合城防语境。
theological_decisions: []
