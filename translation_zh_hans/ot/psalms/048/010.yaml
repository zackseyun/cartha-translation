  yaml_path: translation/ot/psalms/048/010.yaml
  text: As your name[a], O God, so your praise reaches to the ends of the earth[b]; your right hand is full of righteousness.
translation:
  language: zh_hans
  text: 神啊，正如你的名传到地极，你所受的赞美也传到地极；你的右手满有公义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”或译“公正”。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשִׁמְךָ ... כֵּן תְּהִלָּתְךָ
  choice: 你的名怎样，你所受的赞美也怎样
  rationale: 以“怎样……也怎样”保留希伯来文כ...כֵן的对应比较结构；将“你的赞美”表达为“你所受的赞美”，在现代汉语中更清楚地指向归给神的赞美，同时不改作“声誉”。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 上下文是直接称呼；“神啊”自然体现呼格语气。
- source_word: עַל קַצְוֵי אֶרֶץ
  choice: 传到地极
  rationale: עַל字面可指“在……之上、遍及”；结合赞美和“地极”，译作“传到”自然表达其延展范围。
- source_word: צֶדֶק
  choice: 公义
  rationale: 该词可涵盖正直、公义与公正；“公义”适合描述神右手所彰显的属性和作为，另以脚注保留“公正”。
- source_word: מָלְאָה יְמִינֶךָ
  choice: 你的右手充满
  rationale: 保留“右手”这一能力与行动的诗歌意象；完成式在此表达现有状态，译为“充满”简洁自然。
theological_decisions:
- issue: צֶדֶק描述神的右手时的译法
  choice: 公义
  alternative: 公正
  rationale: 原词兼有道德正直和施行公正的语义，不应在正文中把两者强行合并；正文采用较宽广且传统自然的“公义”，脚注注明“公正”这一可行译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。保留“名—赞美”的平行比较和“右手”的具体意象；正文仅设置一个确有文本依据的语义脚注。
