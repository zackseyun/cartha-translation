base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/014.yaml
  text: For this God is our God forever and ever; he will guide us beyond death.
translation:
  language: zh_hans
  text: 因为这位上帝永永远远是我们的上帝；他必引领我们，直到死时。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到死时”：希伯来语此短语的词义和句法不确定，也可理解为“越过死亡”或“在死亡之上”。无元音标记的辅音也可作不同划分；有些解释认为它可能是诗歌或音乐用语。
    reason: 保留 עַל־מוּת 的真实文本和解释歧义，同时正文按马所拉文本的词语划分采用较直接的“直到死时”。
lexical_decisions:
- source_word: כִּי זֶה אֱלֹהִים אֱלֹהֵינוּ
  choice: 因为这位上帝……是我们的上帝
  rationale: 保留指示语“这位”和归属表达“我们的上帝”；按现代汉语语序，将时间短语置于系词之前。
- source_word: עוֹלָם וָעֶד
  choice: 永永远远
  rationale: 这一固定搭配强调无尽的持续，汉语“永永远远”自然、庄重，并保留加强语气。
- source_word: הוּא יְנַהֲגֵנוּ
  choice: 他必引领我们
  rationale: נהג在此指带领、引导；未完成式在诗歌宣告中表达确定的将来，故译“必引领”。
- source_word: עַל־מוּת
  choice: 超越死亡
  rationale: 原文末语读法和含义存在困难；按两个词理解时可指越过或直到死亡。正文采用“超越死亡”，与本诗对上帝永久归属和引领的宣告相衔接，同时以脚注保留另一常见理解。
theological_decisions:
- issue: 上帝的引领与死亡之间的关系
  choice: 超越死亡
  alternative: 直到死；或将末尾读作一个难解的词/音乐标记
  rationale: 正文不把死亡视为上帝引领的明确终点，但原文不足以排除“直到死”的理解，因此不将来世教义展开写入正文，而在脚注中明示文本歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“永永远远”保留诗体力度；“超越死亡”简洁凝练，脚注承担必要的文本说明。
