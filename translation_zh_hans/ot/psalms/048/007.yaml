  text: בְּ/ר֥וּחַ קָדִ֑ים תְּ֝שַׁבֵּ֗ר אֳנִיּ֥וֹת תַּרְשִֽׁישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/007.yaml
  text: With an east wind you shatter the ships of Tarshish[a].
translation:
  language: zh_hans
  text: 你用东风击碎他施的船只[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“开往他施的船只”，也可能指“他施船”，即与他施相关的远洋商船。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּחַ קָדִים
  choice: 用东风
  rationale: רוּחַ与קָדִים连用，在航海意象中指具有破坏力的东风；介词בְּ表示施行动作的手段，译为“用”自然且准确。
- source_word: תְּשַׁבֵּר
  choice: 你……击碎
  rationale: שׁבר的Piel形式表达强力破坏；“击碎”既体现加强语气，也适合船只遭风摧毁的图景。第二人称阳性单数保留为对上帝的直接称呼。
- source_word: אֳנִיּוֹת
  choice: 船只
  rationale: 该复数名词意为“船”；“船只”符合现代汉语书面表达，不额外添加原文没有的限定含义。
- source_word: תַּרְשִׁישׁ
  choice: 他施
  rationale: 作为专名，采用现代中文圣经传统中通行的音译。“他施的船只”保留原短语在所属地、目的地或船型类别之间的语义开放性。
theological_decisions:
- issue: 第二人称动词的受话者
  choice: 直接称呼上帝（“你……击碎”）
  alternative: 译为无人称或一般性陈述
  rationale: 动词为第二人称阳性单数，结合诗篇上下文，最自然地延续对上帝的直接称呼；如此处理保留诗歌张力而不增添额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体语言。“用东风击碎”简洁有力；专名“他施”遵循中文圣经惯用译法。脚注保留אֳנִיּוֹת תַּרְשִׁישׁ这一短语可能表示来源、目的地或船只类别的歧义。
