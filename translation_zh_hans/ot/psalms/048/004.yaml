  text: כִּֽי הִנֵּ֣ה הַ֭/מְּלָכִים נֽוֹעֲד֑וּ עָבְר֥וּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/004.yaml
  text: For look, the kings assembled; they passed by together.
translation:
  language: zh_hans
  text: 看哪，众王会合；他们一同经过。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “经过”或译“越过”。
    reason: 希伯来语 עָבְרוּ 的基本义可指经过或越过；脚注简要保留其可译范围，而不将上下文推测的“前来”提升为正文含义。
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: 看哪
  rationale: 这里的 כִּי 与 הִנֵּה 共同引出值得注意的情景；汉语以“看哪”自然保留突现和强调语气，不必机械译出因果关系。
- source_word: הַמְּלָכִים נוֹעֲדוּ
  choice: 众王会合
  rationale: נוֹעֲדוּ 表示聚集、会合；“众王会合”简洁保留诸王联合行动的含义，但不额外说明其目的。
- source_word: עָבְרוּ יַחְדָּו
  choice: 一同前来
  rationale: עָבַר 基本义是经过、越过，也可按语境指向某处进发。此处接续诸王会合并在下一节看见锡安的场景，“前来”较符合汉语叙事，同时以脚注保留字面歧义。
theological_decisions:
- issue: 诸王行动的方向和性质
  choice: 不明说他们是来攻城，只译作“一同前来”
  alternative: “一同经过”或“一同进军而来”
  rationale: 本节本身没有明说战争目的；上下文虽暗示敌对行动，正文仍避免将推论写成明示内容。
translation_notes:
  register: 采用庄重而自然的现代汉语。“看哪”保留诗歌中突然引人注目的语气；句式简洁，与本诗紧凑的叙事推进相称。
