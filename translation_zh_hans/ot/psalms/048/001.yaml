source:
  edition: WLC
  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד בְּ/עִ֥יר אֱ֝לֹהֵ֗י/נוּ הַר קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/001.yaml
  text: Great is Yahweh[a], and greatly to be praised, in the city of our God, his holy mountain.
translation:
  language: zh_hans
  text: 雅威至大，极当受赞美[a]；在我们上帝的城中，在他的圣山上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“备受赞美。”希伯来语使用被动分词，既可较直接地表达“受到赞美”，也可按语境理解为“配受赞美”。
    reason: 保留מְהֻלָּל在实际受赞美与配受赞美之间的词义可能性。
lexical_decisions:
- source_word: גָּדוֹל
  choice: 本为大
  rationale: 作谓语的形容词置于句首，表达雅威的伟大，而不把含义限缩为能力强大；“本为”使现代汉语句子自然庄重。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行音译处理，保留其专名性质，不以“主”这一称号替代。
- source_word: וּמְהֻלָּל מְאֹד
  choice: 极当受赞美
  rationale: מְהֻלָּל是הלל的被动分词，מְאֹד加强程度；正文采用合乎汉语习惯的应受赞美义，同时以脚注保留“备受赞美”这一较直接的被动理解。
- source_word: בְּעִיר אֱלֹהֵינוּ
  choice: 在我们上帝的城中
  rationale: בְּ表地点，构造关系译为“我们上帝的城”；保留群体性的“我们”。
- source_word: הַר קָדְשׁוֹ
  choice: 在他的圣山上
  rationale: 直译为“他的圣山”；依前一地点短语补出汉语所需的“在……上”，并保留它与“我们上帝的城”之间可能的并列或同位关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此以“雅威”音译，保留其作为以色列之上帝专名的功能，不用称号取代。
- issue: מְהֻלָּל的被动状态与应然含义
  choice: 极当受赞美
  alternative: 备受赞美
  rationale: 被动分词本身可陈述“受到赞美”，在颂赞语境中也自然带有“配受赞美”的意味；正文采用自然而不失庄重的应然表达，脚注说明较字面的另一译法。
- issue: 两个地点短语的关系
  choice: 并列保留“在……城中，在……圣山上”
  alternative: 把“他的圣山”明确处理为“我们上帝的城”的同位说明
  rationale: 希伯来语没有显式连接词或说明词；不加“就是”等词，以免消除并列、同位或诗行延展之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“本为大”“极当受赞美”保持颂赞语气；分号及重复的“在”呈现原文两个地点短语的并置，不擅自补出解释性关系。
