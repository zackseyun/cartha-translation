  text: בְּ֭/שִׁמְ/ךָ יְגִיל֣וּ/ן כָּל הַ/יּ֑וֹם וּ/בְ/צִדְקָתְ/ךָ֥ יָרֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/016.yaml
  text: In your name they rejoice all day long[a], and in your righteousness they are exalted.
translation:
  language: zh_hans
  text: 他们因你的名终日欢喜；因你的公义得以高举。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因你的公正得以高举。”
    reason: “公义”（צְדָקָה）也可译为“公正”或“正义”；正文保留在诗篇颂赞语境中较宽广的“公义”。
lexical_decisions:
- source_word: בְּשִׁמְךָ
  choice: 因你的名
  rationale: 介词 בְּ 在这里可表示喜乐的根据或凭借；“你的名”指上帝所彰显的品格与声誉，不只是称谓。译作“因你的名”比机械的“在你的名里”更符合现代汉语。
- source_word: יְגִילוּן
  choice: 欢喜
  rationale: 该词表示欣喜、欢腾。“欢喜”自然庄重，也保留了公开而强烈的喜乐意味。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 这一表达强调贯穿整日、持续不断；“终日”简洁自然，并保留时间上的延续性。
- source_word: וּבְצִדְקָתְךָ
  choice: 因你的公义
  rationale: צְדָקָה 可涵盖公义、公正及合乎正道的作为。此处诗歌赞美的语境适合用较宽广的“公义”，而介词译为“因”可表达上帝的公义是他们高升的根据。
- source_word: יָרוּמוּ
  choice: 他们得以高升
  rationale: רום 的基本意思是升高、居高或被尊崇。希伯来语形式本身不是明确的被动式；“得以高升”既表明其升高与上帝的公义有关，又避免过度断定具体是被高举、身份提升还是兴盛。
theological_decisions:
- issue: 赞美语境中“公义”的含义
  choice: 正文译作“公义”
  alternative: 公正
  rationale: 原词兼有道德正直与施行公正的含义。正文用“公义”保留其较宽广的盟约与颂赞色彩，脚注则保存“公正”这一真实可行的理解。
- issue: “高升”的施动关系
  choice: 译作“得以高升”
  alternative: 被高举
  rationale: 上下文表明上帝的公义是百姓升高的根据，但原文动词为主动词形，并未明说施动者。“得以高升”体现因果关系，同时不把句法明确改成被动。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“终日”凝练流畅；分号呈现两个平行分句。“因你的名”按现代汉语表达喜乐的根据，避免生硬直译。
