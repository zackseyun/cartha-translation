  text: אַיֵּ֤ה חֲסָדֶ֖י/ךָ הָ/רִאשֹׁנִ֥ים אֲדֹנָ֑/י נִשְׁבַּ֥עְתָּ לְ֝/דָוִ֗ד בֶּ/אֱמוּנָתֶֽ/ךָ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/049.yaml
  text: Where are your former acts of steadfast love[a], Lord[b], which you swore to David in your faithfulness?
translation:
  language: zh_hans
  text: 主啊，你从前的慈爱之举[a]在哪里呢？你曾凭你的信实[b]向大卫起誓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你从前的诸般慈爱”或“你从前的怜悯”。原文“慈爱”为复数。
    reason: lexical_alternative
  - marker: b
    text: “凭你的信实”也可译作“在你的信实中”；原文介词短语可表示起誓的方式或依据。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: 在哪里呢
  rationale: 这是询问所在或是否仍可见的疑问词；结合哀歌语境，用“在哪里呢”自然表达追问。
- source_word: חֲסָדֶיךָ הָרִאשֹׁנִים
  choice: 你从前的慈爱之举
  rationale: חֶסֶד在此指上帝对盟约坚定忠诚的慈爱；原文为复数，以“慈爱之举”明确表达过去多次具体的施恩作为，同时保持现代汉语自然。הָרִאשֹׁנִים按上下文译为“从前的”。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝的称呼；“主啊”符合直接呼告的句法和庄重语体。
- source_word: נִשְׁבַּעְתָּ
  choice: 你曾……起誓
  rationale: 指上帝先前所立的誓言；“曾”清楚标示过去背景。
- source_word: לְדָוִד
  choice: 向大卫
  rationale: 介词לְ在此标示起誓所面向的对象，译为“向大卫”最自然。
- source_word: בֶּאֱמוּנָתֶךָ
  choice: 凭你的信实
  rationale: אֱמוּנָה表示信实、可靠；介词בְּ可指起誓的方式或依据。“凭”简洁自然，同时保留一定语义张力，并以脚注说明另一译法。
theological_decisions:
- issue: 盟约哀歌中חֶסֶד的译法
  choice: 慈爱
  alternative: 怜悯；信实之爱
  rationale: 本节追问上帝向大卫所应许的盟约之爱。“慈爱”在现代中文圣经语境中庄重、易懂，也不把该词缩减为单纯情感或怜悯。
- issue: 是否明确表达חֲסָדֶיךָ的复数
  choice: 慈爱之举
  alternative: 慈爱；诸般慈爱
  rationale: 原文复数可能指上帝从前多次彰显盟约忠诚的作为。“慈爱之举”在中文中自然，并保留具体、多次彰显的意味。
- issue: בֶּאֱמוּנָתֶךָ与誓言的关系
  choice: 凭你的信实
  alternative: 在你的信实中
  rationale: 介词短语可能表示起誓的方式、范围或依据。“凭”适合中文表达，但脚注保留“在你的信实中”这一较形式对应的理解，避免过度限定。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“主啊”保留直接呼告；首句用“呢”呈现哀歌中的迫切追问。将原文复数具体化为“慈爱之举”，兼顾形式信息与中文自然度。
