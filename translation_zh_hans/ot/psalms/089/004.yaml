  yaml_path: translation/ot/psalms/089/004.yaml
  text: I will establish your offspring forever[a], and build your throne for generation after generation[b]. Selah
translation:
  language: zh_hans
  text: 我要使你的后裔永远坚立[a]，使你的王位世世代代得以建立。细拉[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文直译为“种子”；希伯来语用单数形式，也可集合性地指子孙后代。
    reason: lexical_alternative
  - marker: b
    text: “细拉”可能是音乐或礼仪用语，确切含义不明。
    reason: cultural_note
lexical_decisions:
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 该短语表示持续不止的久远时限；“永远”是现代汉语中自然、庄重的对应，也保留盟约应许的恒久意味。
- source_word: אָכִין
  choice: 使……坚立
  rationale: כון的使役式有使之稳固、确立之意；“使……坚立”既表达稳固性，也适合王朝盟约语境。
- source_word: זַרְעֶךָ
  choice: 你的后裔
  rationale: זֶרַע为单数集合名词，可指种子或子孙；“后裔”在现代汉语中自然地表达历代子孙，同时不把它限定为某一个人。
- source_word: וּבָנִיתִי
  choice: 使……稳固
  rationale: 原词字面为“建造”，其完成式在与前句未完成式平行时具有将来意义。汉语若直说“建造王位”较生硬，译作“使王位稳固”传达建立并巩固王权的比喻含义。
- source_word: לְדֹר וָדֹר
  choice: 世世代代
  rationale: 这一惯用语强调一代接一代地延续；“世世代代”简洁自然，并保留反复延续的意味。
- source_word: כִּסְאֲךָ
  choice: 你的王位
  rationale: 在王室语境中，כִּסֵּא不仅指实体座椅，更指君王的权位及其王朝统治；“王位”准确传达此义。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词的确切功能不明，可能是音乐或礼仪标记；采用传统音译，避免在正文中强定其义。
theological_decisions:
- issue: 王室盟约中关于后裔和王位的应许
  choice: 保留对受应许之王的第二人称直接称呼，以王朝性的语言表达，不在正文中明说后来的弥赛亚实现。
  alternative: 在译文中直接加入弥赛亚解释，或将其弱化为一般性的子孙兴旺应许。
  rationale: 希伯来文直接说“你的后裔”和“你的王位”。译文应保存其历史性的王室盟约表达及其可延展的正典意义，而不把后来的神学结论直接写入本节。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“坚立”保留盟约及诗歌语体；“王位”明确王权含义。“细拉”保留音译并以脚注说明其不确定性。
