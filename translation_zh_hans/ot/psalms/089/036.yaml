  text: זַ֭רְע/וֹ לְ/עוֹלָ֣ם יִהְיֶ֑ה וְ/כִסְא֖/וֹ כַ/שֶּׁ֣מֶשׁ נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/036.yaml
  text: His offspring will endure forever[c][b][a], and his throne will be like the sun before me.
translation:
  language: zh_hans
  text: 他的后裔[a]必存到永远；他的宝座必如太阳，在我面前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文直译为“种子”，在这里集合性地指后代。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在我面前”；也可译作“在我眼前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעוֹ
  choice: 他的后裔
  rationale: זֶרַע本义为“种子”，也可集合性地指后代；本节处于君王之约的语境，“后裔”自然表达王朝后代，同时保留集合含义。
- source_word: לְעוֹלָם
  choice: 到永远
  rationale: 这里表示盟约应许中持续不止的久远期限；“到永远”符合现代汉语诗体和经文语体。
- source_word: יִהְיֶה
  choice: 必存
  rationale: 该动词直译为“必存在／必是”；与“到永远”连用时译作“必存”更自然，并表达持续存在，并未超出原文语义。
- source_word: וְכִסְאוֹ
  choice: 他的宝座
  rationale: כִּסֵּא直指“宝座”，在此象征王权；保留具体意象，不抽象化为“国度”或“统治”。
- source_word: כַשֶּׁמֶשׁ
  choice: 如太阳一般
  rationale: 前缀כ表示比拟；此译保留原文鲜明、直接的太阳意象。
- source_word: נֶגְדִּי
  choice: 在我面前
  rationale: נֶגֶד加第一人称单数后缀可指“在我面前／在我同在中”；“在我面前”较贴近原文字面，也保留上帝直接说话的语气。
theological_decisions:
- issue: נֶגְדִּי中第一人称所指及其表达
  choice: 保留为上帝直接说的“在我面前”
  alternative: 译作“在我同在中”
  rationale: 本段以耶和华谈论大卫及其后裔的直接话语为框架；保留第一人称既体现盟约话语的力度，也不把“面前／同在”的语义范围缩窄。
- issue: 第二分句的省略动词
  choice: 不补入“长存”，采用“他的宝座在我面前必如太阳一般”
  alternative: 译作“他的宝座必在我面前如太阳长存”
  rationale: 希伯来文第二分句没有明写动词，可从前句承接，也可理解为“宝座如太阳”；不补“长存”可避免把诗句的句法歧义单向落实，同时现代汉语仍可顺畅理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“必存到永远”清楚表达第一分句的持续存在；第二分句保持简洁，不重复补出“长存”，以保留希伯来诗句的省略结构及其张力。
