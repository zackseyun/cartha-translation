id: PSA.89.30
reference: Psalms 89:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם יַֽעַזְב֣וּ בָ֭נָי/ו תּוֹרָתִ֑/י וּ֝/בְ/מִשְׁפָּטַ֗/י לֹ֣א יֵלֵכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/030.yaml
  text: If his sons abandon my law and do not walk in my judgments[b][a],
translation:
  language: zh_hans
  text: 如果他的儿子们离弃我的律法，不遵行我的典章[a][b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”或译“教导”。希伯来语“妥拉”既可指律法，也可指教导；这里因与“我的典章”平行，正文译作“律法”。
    reason: lexical_alternative
  - marker: b
    text: “不遵行我的典章”或译“行事不依照我的法令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 引出条件从句，保留希伯来文直接的条件意义，不暗示此事必然发生。
- source_word: יַעַזְבוּ
  choice: 离弃
  rationale: עזב可指离开、抛弃；“离弃”在现代汉语中自然庄重，也能表达盟约关系中的不忠。
- source_word: בָנָיו
  choice: 他的儿子们
  rationale: 希伯来文为阳性复数，并带第三人称阳性单数所属后缀；在大卫之约的语境中保留明确的男性所指。
- source_word: תּוֹרָתִי
  choice: 我的律法
  rationale: תּוֹרָה既可指教导，也可指律法；本句与“我的典章”平行，法律与盟约色彩较为突出。
- source_word: וּבְמִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּטִים可指判例、裁决或法令；“典章”保留法律语域，并与“律法”构成自然平行。
- source_word: לֹא יֵלֵכוּן
  choice: 不遵行
  rationale: הלך在盟约语境中可指按某种准则行事；汉语以“遵行”自然表达“行在……中”的隐喻含义，避免生硬直译。
theological_decisions:
- issue: 盟约与法律语境中 תּוֹרָה 的译法
  choice: 我的律法
  alternative: 我的教导
  rationale: 该词本可宽泛地表示教导，但与下半句“我的典章”平行时，法律—盟约色彩更明显；“律法”既贴合上下文，也不超出原文。
- issue: בָנָיו 的性别表达
  choice: 他的儿子们
  alternative: 他的子孙
  rationale: 原文明确使用阳性复数“儿子们”。正文保留这一形式，不将其泛化；其延续后裔的语境可由上下文体现。
- issue: הלך 隐喻的汉语表达
  choice: 不遵行我的典章
  alternative: 不行在我的典章中
  rationale: 原文保留“行走”的生活行为隐喻，但逐字译成“行在……中”在现代汉语中较生硬。“遵行”准确传达按典章生活行事之意；脚注保留较贴近形式的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准汉语。以“离弃—遵行”和“律法—典章”形成平衡的诗歌平行结构；句末逗号表明条件句在下一节继续。所有脚注标记均置于相关正文短语之后。
