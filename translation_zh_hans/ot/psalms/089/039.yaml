  text: נֵ֭אַרְתָּה בְּרִ֣ית עַבְדֶּ֑/ךָ חִלַּ֖לְתָּ לָ/אָ֣רֶץ נִזְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/039.yaml
  text: You have renounced the covenant of your servant[b][a]; you have defiled his crown to the ground.
translation:
  language: zh_hans
  text: 你废弃了与你仆人所立的约[a]；你亵渎了他的冠冕，使它坠落在地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “废弃”也可译作“拒绝”“厌弃”或“弃绝”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你把他的冠冕抛在地上，任其受亵渎。”原文“冠冕”一词也含有分别为圣的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵאַרְתָּה
  choice: 废弃了
  rationale: 此处为 נאר 的强意词形，表达拒绝、厌弃或 repudiation；“废弃”既自然，又能体现对盟约的主动摒弃，而不只表达情绪上的厌恶。
- source_word: בְּרִית
  choice: 所立的约
  rationale: בְּרִית 在大卫王约语境中指正式而具有神学分量的约；补出“所立”符合现代汉语表达，未增加原文所无的立约主体。
- source_word: עַבְדֶּךָ
  choice: 你的仆人
  rationale: 在本篇王室语境中指作为上帝属下代表的大卫王或其后裔；“仆人”比“奴隶”自然，并保留其隶属关系。
- source_word: חִלַּלְתָּ
  choice: 玷污
  rationale: חלל 的强意词形表示使神圣或尊贵之物成为俗污、受亵渎；“玷污”可与冠冕自然搭配，同时保留亵渎与羞辱的意味。
- source_word: לָאָרֶץ
  choice: 在地
  rationale: 字面为“向地／在地上”。与“玷污”连用时译作“玷污在地”保留原文凝练而强烈的落地受辱意象；脚注说明也可理解为扔到地上。
- source_word: נִזְרוֹ
  choice: 他的冠冕
  rationale: נֵזֶר 可指冠冕、王冠，也带有分别为圣的含义；在王室诗篇中“冠冕”最清楚，同时其神圣意味与“玷污”形成有意张力。
theological_decisions:
- issue: 大卫之约遭废弃与受膏君王蒙羞之间的张力
  choice: 直译诗人对上帝的控诉，保留“废弃盟约”和“玷污冠冕”的强烈措辞。
  alternative: 将措辞弱化为暂时的政治失败，或直接按后来的弥赛亚应验作解释。
  rationale: 本节是对大卫王朝似乎崩塌的哀诉；译文应保存盟约应许与现实经历之间尚未化解的神学张力，不预先替诗人解决。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“与你仆人所立的约”明确关系而不作过度解释；分号保留希伯来诗歌两行之间的并列推进。所有脚注标记均置于正文相关短语之后。
