base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/051.yaml
  text: with which your enemies have taunted[a], O Yahweh[b], with which they have taunted the footsteps of your anointed.
translation:
  language: zh_hans
  text: 耶和华啊，你的仇敌借这些事羞辱；他们借这些事羞辱你受膏者的脚踪。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “脚踪”也可译作“脚跟”“脚步”或“足迹”。这词可能比喻受膏者的行动、行程或来临。
    reason: lexical_alternative
  - marker: b
    text: “受膏者”也可译作“弥赛亚”。本诗的直接语境很可能指大卫王系的君王；同时，这个词也带有弥赛亚意蕴。
    reason: theological_alternative
lexical_decisions:
- source_word: חֵרְפוּ
  choice: 辱骂
  rationale: חרף表示带着蔑视的责骂、羞辱或讥诮。“辱骂”在现代汉语中自然、庄重，也保留了敌意与羞辱意味；重复两次，以对应原文的平行结构。
- source_word: אוֹיְבֶיךָ
  choice: 你的仇敌
  rationale: 准确表达名词及第二人称阳性单数后缀；“仇敌”符合诗篇的庄重语体。
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代中文读者熟悉的专名“耶和华”表达四字神名，并用“啊”标明呼格。
- source_word: אֲשֶׁר
  choice: 这样
  rationale: 两处关系词承接上一节所说的辱骂内容或方式。中文采用“这样”可自然连接语意，并保留原文两次重复的结构。
- source_word: עִקְּבוֹת
  choice: 脚踪
  rationale: 该词可指脚跟、脚步或足迹。“脚踪”保留具体的行走意象，也能容纳所指为受膏者的行动、行程或来临的可能性。
- source_word: מְשִׁיחֶךָ
  choice: 你受膏者
  rationale: 在本诗的直接语境中主要指属于耶和华的大卫王系受膏君王。“受膏者”贴近词义，同时保留其弥赛亚含义，不在正文中提前把它限定为专名。
theological_decisions:
- issue: 王室诗篇中מְשִׁיחֶךָ兼具当下君王与弥赛亚意蕴
  choice: 你受膏者
  alternative: 你的弥赛亚
  rationale: 直接语境指向大卫之约中的受膏君王，但同一词也承载弥赛亚意蕴。正文采用描述性译法，注释说明另一种可能，以保留神学张力。
- issue: עִקְּבוֹת所表达的隐喻范围
  choice: 脚踪
  alternative: 脚跟／脚步／足迹，也可能泛指受膏者的行动或来临
  rationale: 原文意象具体而含义开放，不宜在正文中将它解释性地限定为某一种行动或末世性的来临。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留原文“辱骂”的重复和平行结构；用“耶和华啊”清楚表达呼格。正文尽量维持“脚踪”与“受膏者”的开放性，避免以解释取代翻译。
