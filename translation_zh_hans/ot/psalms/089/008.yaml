  text: יְהוָ֤ה אֱלֹ֘הֵ֤י צְבָא֗וֹת מִֽי כָֽמ֖וֹ/ךָ חֲסִ֥ין יָ֑הּ וֶ֝/אֱמֽוּנָתְ/ךָ֗ סְבִיבוֹתֶֽי/ךָ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/008.yaml
  text: O Yahweh[a], God of hosts, who is mighty like you, O Yah? Your faithfulness surrounds you.
translation:
  language: zh_hans
  text: 雅威，万军之神啊，谁能像你？大能的雅[a]啊，你的信实环绕着你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”对应希伯来文神名短式“Yah”（יָהּ），与本节前面的“雅威”相对应。此处也可按另一种句法译作：“谁像你一样大有能力？雅啊，你的信实环绕着你。”
    reason: 说明神名短式，并保留חֲסִין יָהּ可能的另一种句法分析。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译保留上帝的专名，不以“耶和华”或“主”替代。
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: 万军之神
  rationale: “万军”保留צְבָאוֹת所指众军、众天军等集合性的宽广含义；“之神”既体现构造关系，也保持庄重诗体。
- source_word: מִי כָמוֹךָ
  choice: 谁像你一样
  rationale: 保留反问式的无可比拟表达，措辞自然直接。
- source_word: חֲסִין
  choice: 大有能力
  rationale: 该词表示强健、有力；“大有能力”适合向上帝发出的诗歌颂赞，又不把含义缩窄为武力。
- source_word: יָהּ
  choice: 雅
  rationale: 按希伯来文保留神名短式，并与本节前面的יְהוָה“雅威”有所区别。
- source_word: וֶאֱמוּנָתְךָ
  choice: 你的信实
  rationale: אֱמוּנָה在此指可靠、坚定、忠信的属性；“信实”是自然且庄重的现代汉语表达。
- source_word: סְבִיבוֹתֶיךָ
  choice: 环绕着你
  rationale: 将复数方位表达译成自然的汉语动词结构，同时保留信实环绕上帝的诗歌意象。
theological_decisions:
- issue: 同一节中יְהוָה与其短式יָהּ的译法
  choice: 分别译作“雅威”和“雅”
  alternative: 两处都译作“主”，或都译作“雅威”
  rationale: 原文有意采用两个不同形式；分别音译可保留文本差异，也避免用称号取代专名。
- issue: חֲסִין与יָהּ的句法关系
  choice: 译作“谁像你一样大有能力？雅啊”
  alternative: 译作“谁能像你？大能的雅啊”
  rationale: 原文可理解为形容“你”大有能力，也可把“大能的”视为对“雅”的修饰。本译文依照语境中的比较问句采用前者，同时在注释中保留另一种句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“雅威—万军之神啊”以破折号呈现同位呼告；后半节保留直接呼告和“信实环绕”的原文意象。
