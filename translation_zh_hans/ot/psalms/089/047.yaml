source:
  edition: WLC
  text: זְכָר אֲנִ֥י מֶה חָ֑לֶד עַל מַה שָּׁ֝֗וְא בָּרָ֥אתָ כָל בְּנֵי אָדָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/047.yaml
  text: Remember how short my lifetime is! For what vanity have you created all the sons of man?[a][b]
translation:
  language: zh_hans
  text: '求你记得，我的一生何其短暂！[a]

    你为何为虚空创造所有世人呢？[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的一生何其短暂”也可译作“我何其短暂”。原文简约，直译近于“记得我——我的寿命是何等短暂”。
    reason: 说明אֲנִי与מֶה חָלֶד的简约表达，并保留“我”与“寿命短暂”之间的句法张力。
  - marker: b
    text: “所有世人”原文直译为“所有人之子”。“为虚空”也可理解为“使他们归于虚空”；本句可译作：“你为何创造所有世人，使他们归于虚空呢？”
    reason: 说明בְּנֵי אָדָם的泛指习语，并保留עַל־מַה שָּׁוְא所表达的目的性与结果性张力。
lexical_decisions:
- source_word: זְכָר
  choice: 求你记得
  rationale: 这是向上帝发出的阳性单数祈使语。汉语祷告语境中加“求你”既保留直接恳求的语气，也自然庄重。
- source_word: אֲנִי מֶה חָלֶד
  choice: 我的一生何其短暂
  rationale: חֶלֶד指人的寿命、人生时日或在世年日；此处מֶה带感叹意味。译文按汉语习惯表达诗人对人生短促的哀叹，同时以脚注保留原文结构可能容纳的另一种理解。
- source_word: עַל מַה
  choice: 为何
  rationale: 该短语在这里引出带目的意味的反问；“为何”比生硬的“为了什么”更符合现代汉语诗歌和祷告语体。
- source_word: שָּׁוְא
  choice: 徒然
  rationale: 该词可表示虚空、无益或徒劳。这里用副词“徒然”自然连接“创造”，并传达诗人质问人类受造是否竟归于虚空的张力。
- source_word: בָּרָאתָ
  choice: 你……创造
  rationale: 第二人称阳性单数，所指为上帝。汉语无需明标完成体，也能在上下文中清楚指向上帝的创造行动。
- source_word: כָל בְּנֵי אָדָם
  choice: 所有世人
  rationale: 该希伯来习语字面为“所有人之子”，在此泛指全体人类。“所有世人”在现代汉语中准确、自然，也不把אָדָם不必要地专名化为亚当。
theological_decisions:
- issue: עַל מַה שָּׁוְא是目的反问还是带感叹色彩的陈述
  choice: 译作反问：“你为何徒然创造所有世人呢？”
  alternative: “你竟为了虚空创造所有世人。”
  rationale: עַל מַה通常引出“为了什么／为何”的问题，整节哀歌语境也支持反问；但שָׁוְא究竟修饰创造行为还是表示创造所趋向的“虚空”，原文仍有一定张力，故脚注列出替代译法。
- issue: בְּנֵי אָדָם的泛指范围
  choice: 所有世人
  alternative: 所有人之子／所有亚当的子孙
  rationale: 该表达泛指全人类。译为“世人”既涵盖男女，也符合现代汉语；脚注交代其字面形式，以免掩盖希伯来意象。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。“何其短暂”保留感叹力度，“为何……呢”呈现哀歌中的反问；不以抽象术语过度解释诗人关于受造、短寿与虚空之间的神学张力。
