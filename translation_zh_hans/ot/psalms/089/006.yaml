  text: כִּ֤י מִ֣י בַ֭/שַּׁחַק יַעֲרֹ֣ךְ לַ/יהוָ֑ה יִדְמֶ֥ה לַ֝/יהוָ֗ה בִּ/בְנֵ֥י אֵלִים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/006.yaml
  text: For who in the skies can be compared to Yahweh? Who among the sons of God is like Yahweh?[a]
translation:
  language: zh_hans
  text: 因为在天空中，谁能与耶和华相比？在神的众子中，谁能像耶和华呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在天上的众生中”、“在神圣的众者中”或“在大能者的众子中”。希伯来文此短语字面可作“在神（或众神）的众子中”。
    reason: 保留 בִּבְנֵי אֵלִים 的词义歧义及其所唤起的天上议会意象，避免在正文中作单一解释。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的赞美陈明理由；在汉语中用“因为”能自然引出两个反问句。
- source_word: בַשַּׁחַק
  choice: 在天空中
  rationale: שַׁחַק可指天空、诸天或云天；“在天空中”是自然、清楚的现代汉语，也保留天上领域的语境。
- source_word: יַעֲרֹךְ לַיהוָה
  choice: 能与耶和华相比
  rationale: ערך的基本意象是摆在旁边、排列或衡量；此处表达比较，“能与……相比”准确传达反问的力量。
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达四字神名，避免把它与普通称谓“主”混同。
- source_word: יִדְמֶה לַיהוָה
  choice: 能像耶和华
  rationale: דמה在这里表示相像或可比；“能像”简洁自然，并与前半句的“相比”构成平行。
- source_word: בִּבְנֵי אֵלִים
  choice: 神明之子中
  rationale: 尽量保留希伯来文“诸神/神圣者之子”的亲属称谓意象及其天上议会背景，不在正文中直接化解为解释性的“天上的众生”；其他可行理解列入脚注。
theological_decisions:
- issue: יהוה的译法
  choice: 耶和华
  alternative: 上主
  rationale: 原文使用的是以色列之神的专名。正文采用中文读者熟悉的“耶和华”，使专名性质清楚；“上主”则体现以“主”代读神名的传统，但会把专名转化为称谓。
- issue: בִּבְנֵי אֵלִים所指的群体
  choice: 神明之子中
  alternative: 天上的众生中
  rationale: 该短语可能指天上议会中的神圣存在。正文保留原文较具体且带有张力的称呼，不将其直接解释成较宽泛的“天上的众生”，并用脚注列出主要译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个反问句保持希伯来诗歌的平行结构；“神明之子”略带古雅色彩，以承载原文特殊的天上议会意象。
