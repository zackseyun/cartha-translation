  text: לְ/ךָ֣ שָׁ֭מַיִם אַף לְ/ךָ֥ אָ֑רֶץ תֵּבֵ֥ל וּ֝/מְלֹאָ֗/הּ אַתָּ֥ה יְסַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/011.yaml
  text: The heavens are yours; the earth also is yours[a]. The world and its fullness—you founded them.
translation:
  language: zh_hans
  text: 诸天属于你，大地也属于你；你奠定了世界和其中的一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְךָ
  choice: 属于你
  rationale: 介词 לְ 加第二人称阳性单数后缀表达归属；“属于你”在现代汉语中直接、自然地传达所有关系。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 保留希伯来语复数所具有的宏阔诗意，也与“大地”形成庄重的宇宙性对举。
- source_word: אַף
  choice: 也
  rationale: 此处表示递进和扩展：不仅诸天，大地也属于上帝；“也”最自然地再现平行关系。
- source_word: אָרֶץ
  choice: 大地
  rationale: 本节与“诸天”“世界”并列，指宇宙范围内的地，而非某一片土地；“大地”兼具准确性和诗体庄重感。
- source_word: תֵּבֵל
  choice: 世界
  rationale: תֵּבֵל 指有秩序、可居住的世界；“世界”是现代汉语中自然且足够准确的表达。
- source_word: מְלֹאָהּ
  choice: 其中的一切
  rationale: 字面为“它的丰满/充满之物”，语义指世界所包含的一切；“其中的一切”比“它的丰满”自然清楚，同时不缩窄其范围。
- source_word: יְסַדְתָּם
  choice: 都是你奠定的
  rationale: יסד 含奠基、建立之意；“奠定”保留宇宙创造的根基意象。复数宾语后缀指向“世界和其中的一切”，以“都是”明确其复数涵盖范围。
theological_decisions:
- issue: 上帝的所有权与创造行动
  choice: 既表达诸天和大地属于上帝，也表达世界及其中一切由他奠定。
  alternative: 增译为从无到有的创造，或仅理解为统治权而弱化创造含义。
  rationale: 原文明确并列归属表达 לְךָ 与奠基动词 יסד；译文保留两者，但不加入经文本身未明说的后期教义表述。
- issue: יְסַדְתָּם 的复数所指
  choice: 将复数后缀落实为“世界和其中的一切”两项。
  alternative: 宽泛地理解为前文全部宇宙实体，即诸天、大地、世界及其中一切。
  rationale: 语法上最近的复合宾语“世界和其中的一切”最直接地解释阳性复数后缀；同时整节语义上仍把上帝呈现为整个宇宙秩序的奠定者。
translation_notes:
  register: 采用现代、庄重而清楚的诗体汉语。“诸天—大地”保留原文平行结构；分号呈现两组诗句的推进，末句用“都是”自然对应复数宾语。
