  yaml_path: translation/ot/psalms/089/022.yaml
  text: No enemy will exact tribute from him[b][a], and no son of wickedness will afflict him.
translation:
  language: zh_hans
  text: 仇敌必不向他索取贡赋[a]；邪恶之徒也必不压迫他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “索取贡赋”也可译作“欺骗”“强加负担”或“盘剥”。原文动词有几个彼此相关的含义；这里依敌对压迫及保护君王的上下文，译为“索取贡赋”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“不义之子”或“邪恶之子”，是指邪恶的人、作恶者的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשִּׁא
  choice: 勒索
  rationale: 该动词在此处可表示欺骗、强加负担或勒索；结合介词 בּוֹ、与下句“苦害”构成的平行，以及君王受保护的语境，“勒索”自然地表达敌对势力施加经济或政治压迫的意思，同时不把具体对象限定为贡赋。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 准确对应单数名词，符合诗篇的庄重语体和敌对语境。
- source_word: בּוֹ
  choice: 向他
  rationale: 与“勒索”搭配自然，表达敌人以他为勒索对象；若将动词理解为“欺骗”或“强加负担”，介词关系也会相应变化。
- source_word: בֶן עַוְלָה
  choice: 邪恶之徒
  rationale: 希伯来语直译为“邪恶之子”，是指邪恶之人或作恶者的习语；译为“邪恶之徒”既传达习语意义，也保留诗歌的凝练和庄重。
- source_word: עַוְלָה
  choice: 邪恶
  rationale: 该词可指不义、恶行或邪恶；此处用“邪恶”涵盖其较广的道德含义。
- source_word: יְעַנֶּנּוּ
  choice: 苦害他
  rationale: Piel 词形在此表示使人受苦、压迫或折磨；“苦害”简洁自然，并与上句的敌对压迫相呼应。
theological_decisions:
- issue: 受保护者所指为何
  choice: 保留第三人称单数“他”，不作解释性扩展。
  alternative: 明确译成“大卫”“大卫王系的君王”或按预表解释为“弥赛亚”。
  rationale: 希伯来文本在圣约与君王语境中使用单数代词。正文应保留这一措辞及其神学张力，不把所指暗中限定为某一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仇敌不能……也不能……”保留希伯来诗歌的平行结构；“邪恶之徒”避免生硬直译“邪恶之子”，并以脚注保留原文形象。
