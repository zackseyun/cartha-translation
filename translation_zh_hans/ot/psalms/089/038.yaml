  text: וְ/אַתָּ֣ה זָ֭נַחְתָּ וַ/תִּמְאָ֑ס הִ֝תְעַבַּ֗רְתָּ עִם מְשִׁיחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/038.yaml
  text: But you have cast off and rejected[a]; you have become enraged with your anointed one.
translation:
  language: zh_hans
  text: 但你却丢弃、厌弃了他；你向你的受膏者[a]大发烈怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文也可译作“你的弥赛亚”。这里直接所指的是上帝所膏立的大卫王朝的君王；“受膏者”所译的希伯来词，与“弥赛亚”所对应的是同一个词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 但你却
  rationale: 独立代词配合连接词形成强烈转折，与上文对上帝立约信实的宣告构成鲜明对比；“但你却”符合现代汉语哀歌语气。
- source_word: זָנַחְתָּ
  choice: 丢弃
  rationale: 保留该词“抛弃、弃绝”的形象性，并与下一个近义动词形成递进。
- source_word: וַ/תִּמְאָס
  choice: 厌弃
  rationale: 该词不仅表示拒绝，也含嫌恶之意；“厌弃”既区别于“丢弃”，又保留希伯来文并列强化的效果。
- source_word: הִתְעַבַּרְתָּ
  choice: 大发烈怒
  rationale: 此处התעבר表达怒气猛烈发作；“大发烈怒”自然、庄重，并准确传达强烈愤怒。
- source_word: עִם
  choice: 向
  rationale: 原词直译为“与”，但在汉语中与发怒搭配时，“向……大发烈怒”更自然，同时不额外强化为明确的敌对行动。
- source_word: מְשִׁיחֶךָ
  choice: 你的受膏者
  rationale: 直译为“你的受膏者”，在本诗直接指大卫之约下的君王，同时保留该词后来与“弥赛亚”相连的神学张力。
theological_decisions:
- issue: 王室哀歌中מְשִׁיחֶךָ的弥赛亚意涵
  choice: 你的受膏者
  alternative: 你的弥赛亚
  rationale: 本节直接语境指上帝所膏立的大卫王系君王；正文采用“受膏者”以免把后来的明确基督论认同直接代入本节，同时用脚注保留它与“弥赛亚”是同一希伯来词的事实。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“丢弃、厌弃”保留原文两个近义动词的并列强化；分号呈现控诉的两层内容。
