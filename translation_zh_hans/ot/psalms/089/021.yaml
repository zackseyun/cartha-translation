  text: אֲשֶׁ֣ר יָ֭דִ/י תִּכּ֣וֹן עִמּ֑/וֹ אַף זְרוֹעִ֥/י תְאַמְּצֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/021.yaml
  text: with whom my hand will be established[a]; indeed[c][b], my arm will strengthen him.
translation:
  language: zh_hans
  text: 我的手必坚定地与他同在[a]；我的膀臂[b]也必使他刚强。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我的手必与他一同坚立。”原文以“我的手”为“坚立”的主语；正文以较自然的汉语表达其与他同在且稳固的含义。
    reason: 说明原文语法结构及正文的自然化表达。
  - marker: b
    text: “膀臂”是表示力量和权能的诗歌意象。
    reason: 帮助现代读者理解希伯来诗歌中的身体意象，同时在正文中予以保留。
lexical_decisions:
- source_word: אֲשֶׁר ... עִמּוֹ
  choice: 与他同在
  rationale: אֲשֶׁר承接上一节所说的受膏者，עִמּוֹ直译为“与他”。汉语按本节独立呈现时，用“与他同在”自然地表达关系从句的内容。
- source_word: יָדִי
  choice: 我的手
  rationale: 保留希伯来诗歌中表示上帝施行能力和扶持的具体身体意象，不抽象化为“我的力量”。
- source_word: תִּכּוֹן
  choice: 坚立不移
  rationale: 该词为כון的Nifal未完成式，表达稳固、坚立的状态；“坚立不移”既体现承诺语境中的将来含义，也比生硬的“被建立”更符合现代汉语。
- source_word: אַף
  choice: 也
  rationale: 此处连接并加强平行句。“也”在汉语中自然体现递进兼并列的强调作用。
- source_word: זְרוֹעִי
  choice: 我的膀臂
  rationale: 保留原文“膀臂”的诗歌意象；它象征能力和权能。
- source_word: תְאַמְּצֶנּוּ
  choice: 必使他刚强
  rationale: אמץ的Piel形式带有使之强壮、坚固的含义；“使他刚强”准确保留其使役色彩。
theological_decisions:
- issue: 上帝行动的拟人化表达
  choice: 保留“我的手”和“我的膀臂”
  alternative: 译为“我的能力”和“我的力量”
  rationale: 原文以身体意象描写上帝对所拣选君王的扶持。保留意象可维护诗歌特色，也不会把经文本身的表达预先解释成抽象概念。
- issue: תִּכּוֹן的主语及其与受膏者的关系
  choice: 译作“我的手必与他同在，坚立不移”
  alternative: 译作“我的手必使他站立得稳”
  rationale: 希伯来文的语法主语是“我的手”，不是“他”；因此不把“坚立”直接改成使受膏者站稳，以免消除原文的结构和细微张力。
- issue: 未完成式的时间与体貌
  choice: 用“必”表达应许性的将来
  alternative: 译作一般现在状态
  rationale: 在本诗的立约和应许语境中，两个未完成式自然带有将来承诺或持续保证的意味。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“坚立不移”保留原文稳固持久的意味；分号呈现两个平行分句。所有脚注标记均置于正文相应位置。
