  yaml_path: translation/ot/psalms/089/033.yaml
  text: But my steadfast love I will not remove from him[b][a], nor will I deal falsely in my faithfulness.
translation:
  language: zh_hans
  text: 但我绝不从他收回我的慈爱[a]，也绝不违背自己的信实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“坚定的爱”或“盟约之爱”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我绝不在我的信实上行虚假”或“我绝不使我的信实落空”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: 我的慈爱
  rationale: חֶסֶד在此指坚定、忠贞而带有盟约关系色彩的爱。“慈爱”是现代中文圣经语体中自然且庄重的表达，并由脚注补明“信实的爱、盟约之爱”等含义。
- source_word: אָפִיר
  choice: 绝不……收回
  rationale: פור的使役形在此表示使某物离开、将其撤去；与מֵעִמּוֹ连用时，“从他收回”准确表达不撤去恩爱。לֹא在神的应许语境中译作“绝不”，自然传达坚定否定。
- source_word: מֵעִמּוֹ
  choice: 从他
  rationale: 介词组合表示从所指之人那里离开；“从他”简洁贴合原文关系。
- source_word: אֲשַׁקֵּר
  choice: 背弃
  rationale: שׁקר的加强词干可指行虚假、不守信；“背弃”与“信实”搭配自然，也超越单纯言语上的说谎，表达行为上违背自己的可靠承诺。
- source_word: בֶּאֱמוּנָתִי
  choice: 我的信实
  rationale: אֱמוּנָה在此表示忠诚、可靠；בְ所构成的关系在中文中以“背弃我的信实”作习惯化表达，脚注保留“在我的信实上行虚假”的形式可能性。
- source_word: וְ
  choice: 但；也
  rationale: 首个וְ承接上文惩治的话而带转折，译为“但”；第二个וְ连接两个并列否定句，译为“也”。
theological_decisions:
- issue: 神惩治大卫后裔与他持守盟约之爱的张力
  choice: 以“慈爱”和“信实”表达神在施行管教时仍不撤回忠贞之爱，也不违背自己的可靠承诺。
  alternative: 译作“怜悯”和“真实”，采用较传统但盟约意味较不明显的措辞。
  rationale: 本节强调惩治并不等于取消神所立的承诺；译文保留这一张力，而不引入后来的系统神学术语。
- issue: אֲשַׁקֵּר בֶּאֱמוּנָתִי的关系
  choice: 译作“背弃我的信实”，使中文自然，并表达神不会在行为上有违自己的信实。
  alternative: 译作“在我的信实上行虚假”或“使我的信实落空”。
  rationale: 希伯来语介词结构略带习语性；正文不把它缩减为口头“说谎”，脚注则保留更贴近形式的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“绝不”传达两个否定句的坚定语气；“收回慈爱”和“背弃信实”搭配自然。两个脚注标记均置于其所解释的词组之后。
