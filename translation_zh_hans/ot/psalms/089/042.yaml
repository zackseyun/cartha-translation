  source_fidelity: 译文准确对应希伯来文的两个完成式使役动词：『高举了』传达 הֲרִימוֹתָ 对敌方『右手』所赋予的优势或力量，『使……欢喜』保留 הִשְׂמַחְתָּ 的致使意义。『右手』没有被过度解释为权力；两个第三人称阳性单数后缀均恰当地保留为『他』。
