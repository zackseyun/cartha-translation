source:
  edition: WLC
  text: הֲ֭רִימוֹתָ יְמִ֣ין צָרָ֑י/ו הִ֝שְׂמַ֗חְתָּ כָּל אוֹיְבָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/042.yaml
  text: You have exalted the right hand of his foes[a]; you have made all his enemies rejoice.
translation:
  language: zh_hans
  text: 你高举了他敌手的右手[a]；你使他所有的仇敌欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你抬起了他敌对者的右手。”
    reason: 词义上的另一种译法；הֲרִימוֹתָ可较直译为“抬起”，צָרָיו也可译为“敌对者”。
lexical_decisions:
- source_word: הֲרִימוֹתָ
  choice: 高举了
  rationale: 该词是רוּם的使役形完成式第二人称阳性单数，表示使之升高。与“右手”连用时既保留抬高的意象，也传达使敌手得势、力量增强的含义。
- source_word: יְמִין
  choice: 右手
  rationale: 直译为“右手”，在希伯来语中也常象征力量和权势；保留这一意象，不将象征意义直接释入正文。
- source_word: צָרָיו
  choice: 他敌手的
  rationale: 指敌对者、对手。译作“敌手”既自然，也与下半句的“仇敌”有所区分，以反映原文使用两个近义词。
- source_word: הִשְׂמַחְתָּ
  choice: 你使……欢喜
  rationale: שׂמח的使役形，明确表达“使之欢喜、令其高兴”的致使意义。
- source_word: כָּל
  choice: 所有的
  rationale: 修饰复数名词，译作“所有的”自然地表达整体范围。
- source_word: אוֹיְבָיו
  choice: 他的仇敌
  rationale: 这是表示敌人的常用名词；译作“仇敌”准确自然，并避免与上半句完全重复。
theological_decisions:
- issue: 两个第三人称阳性单数后缀所指
  choice: 译作“他”，按诗篇当前语境指向大卫家的受膏君王
  alternative: 采用更笼统的表达，不在译文中明确代词所指
  rationale: 原文两处后缀均为第三人称阳性单数。诗篇89篇此段哀叹上帝似乎逆转了对大卫及其受膏者的应许；保留“他”忠实呈现语法指向，同时不进一步限定其神学身份。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。正文保留希伯来语“右手”的力量意象，并以“敌手／仇敌”对应原文两个近义词。
