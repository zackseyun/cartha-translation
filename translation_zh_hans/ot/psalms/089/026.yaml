  yaml_path: translation/ot/psalms/089/026.yaml
  text: He will call to me[a], ‘You are my Father, my God, and the rock of my salvation.’
translation:
  language: zh_hans
  text: 他要呼求我[a]，说：“你是我的父，我的上帝，是我救恩的磐石。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“呼叫我”，也可理解为“向我呼喊”。希伯来语动词在这里可带有祷告中呼求的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: 他
  rationale: 保留希伯来文独立的第三人称阳性单数代词，体现对主语的强调。
- source_word: יִקְרָאֵנִי
  choice: 要呼求我
  rationale: קרא可表示“呼叫、呼求”；本节是向上帝祷告式的直接称呼，“呼求我”自然传达呼喊求告的语境，同时保留第一人称宾语后缀。
- source_word: אָבִי
  choice: 我的父
  rationale: 该词为“父”加第一人称单数后缀。现代汉语中“我的父”既保留原文形式，也具有庄重的直接称呼语气。
- source_word: אָתָּה
  choice: 你是
  rationale: 原文显明使用独立代词“你”；汉语补出判断词“是”，使直接引语清楚自然。
- source_word: אֵלִי
  choice: 我的上帝
  rationale: אֵל在这里与“我的父”和“拯救我的磐石”并列，明确指上帝；译作“我的上帝”准确而通顺。
- source_word: וְצוּר יְשׁוּעָתִי
  choice: 是拯救我的磐石
  rationale: צוּר保留为常见的神学隐喻“磐石”；יְשׁוּעָתִי可指“我的拯救/救恩”。汉语译作“拯救我的磐石”自然表达上帝是施行拯救者，同时维持原文意象。
theological_decisions:
- issue: 君王/弥赛亚语境中对上帝的称呼
  choice: 按直接称呼译为“你是我的父，我的上帝，是拯救我的磐石”
  alternative: 将“父”弱化为一般性的比喻，或在译文中明确加入后来的弥赛亚解释
  rationale: 本节在大卫之约与君王诗篇的语境中，以关系性和盟约性的语言直接称呼上帝。译文保留这一神学张力，不削弱其分量，也不把后来的教义结论加进正文。
- issue: יְשׁוּעָתִי的名词结构
  choice: 译为“拯救我的”
  alternative: 译为“我救恩的”或“使我得救的”
  rationale: “我救恩的磐石”更贴近形式却不符合普通现代汉语习惯；“拯救我的磐石”保留拯救含义及磐石意象，但不限定拯救仅为属灵意义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“磐石”保留诗歌意象和传统经文语感；“呼求”符合向上帝祷告的语境。脚注标记[a]已置于正文对应词后。
