  text: אַף תָּ֭שִׁיב צ֣וּר חַרְבּ֑/וֹ וְ/לֹ֥א הֲ֝קֵימֹת֗/וֹ בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/043.yaml
  text: Indeed[a], you turn back the edge of his sword[b], and you have not made him stand in battle.
translation:
  language: zh_hans
  text: '你竟使他的剑刃转钝[a]，

    没有使他在战斗中站立得住[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“使他的剑刃转回”，表达使剑刃失去锋利、不能奏效。
    reason: lexical_alternative
  - marker: b
    text: 或译：“没有在战斗中扶持他”，或“没有使他能在战斗中站稳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: 竟
  rationale: 此处是哀歌中带强调意味的递进语气；“竟”既承接上文，也自然表达诗人对上帝行动的震惊和控诉。
- source_word: תָּשִׁיב
  choice: 使……退回
  rationale: 使役形保留“使之转回、退回”的基本意象，而不直接把其效果解释为“使……变钝”。
- source_word: צוּר חַרְבּוֹ
  choice: 他的刀锋
  rationale: צוּר 在此与“他的刀”构成属格关系，按军事语境指刀刃、锋口，而不是常见义“磐石”。
- source_word: וְלֹא הֲקֵימֹתוֹ
  choice: 没有使他……站立得住
  rationale: קום 的使役形表示“使站立、使稳立”；“站立得住”在现代汉语中既保留具体意象，也表达使其能在战斗中守住阵脚。
- source_word: בַּמִּלְחָמָה
  choice: 在战场上
  rationale: 按上下文译为自然的军事表达；其意义相当于“在战斗中”。
theological_decisions:
- issue: 诗人直接把大卫王的军事挫败归于上帝的行动
  choice: 保留对上帝的第二人称直接控诉：“你竟使……没有使……”
  alternative: 改用被动或非人格表达，淡化上帝的主动作用
  rationale: 原文明确以第二人称把两项行动归给上帝；译文保留哀歌中的神学张力，不加以缓和。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“刀锋退回”有意保留希伯来文的具体意象，并以脚注说明其可能表达的实际效果；“站立得住”兼顾军事场景和原文“使站立”的措辞。
