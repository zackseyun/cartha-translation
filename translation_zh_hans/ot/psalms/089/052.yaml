base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/052.yaml
  text: Blessed be Yahweh forever[a]. Amen and amen.
translation:
  language: zh_hans
  text: 雅威[a]当受称颂，直到永远！阿们，阿们！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝之名 יְהוָה 的拟音；传统上也译作“耶和华”。
    reason: 说明神名的译法及常见传统译名。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 当受称颂
  rationale: 这是用于颂赞的被动分词表达。译作“当受称颂”既保留祝颂语气，也比单说“有福”更符合现代汉语对上帝的颂赞用法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音译出其专名性质，不以“主”这一称号代替。
- source_word: לְעוֹלָם
  choice: 直到永远
  rationale: 准确表达持续至永恒的时间意义，同时符合自然、庄重的现代汉语。
- source_word: אָמֵן וְאָמֵן
  choice: 阿们，阿们
  rationale: 保留礼仪性的音译和重复所产生的郑重、加强语气；汉语以逗号连接，比生硬译出“和”更自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。正文用“雅威”保留专名，脚注交代汉语读者熟悉的传统译名；不以称号“主”取代原文专名。
translation_notes:
  register: 采用简洁、庄重而适合公共诵读的颂赞语体。“阿们”重复两次，保留本诗卷末尾礼仪性结束语的强调效果。
