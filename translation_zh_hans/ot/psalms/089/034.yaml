  text: לֹא אֲחַלֵּ֥ל בְּרִיתִ֑/י וּ/מוֹצָ֥א שְׂ֝פָתַ֗/י לֹ֣א אֲשַׁנֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/034.yaml
  text: I will not violate my covenant[b][a], or alter what has gone out from my lips.
translation:
  language: zh_hans
  text: 我必不违背我的约[a]，也不更改从我嘴唇发出的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亵渎我的约”或“破坏我的约”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“我嘴唇所出的”，指我已经说出的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַלֵּל
  choice: 违背
  rationale: 该词是 חלל 的 Piel 形式，在约的语境中表示使之受亵渎、遭破坏，即违背约。“违背”在现代汉语中自然，并保留严重违反盟约的含义。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: בְּרִית 是圣经中表示“约”的标准用词；保留第一人称所属后缀。
- source_word: מוֹצָא שְׂפָתַי
  choice: 从我嘴唇发出的话
  rationale: 原文直译近于“我嘴唇所出的”，以具体形象指已经说出的话；此译既保留嘴唇与发出的意象，也符合现代汉语表达。
- source_word: אֲשַׁנֶּה
  choice: 更改
  rationale: שנה 的 Piel 形式意为改变、更改；“更改”适合已经说出的承诺或宣告。
- source_word: לֹא ... לֹא
  choice: 必不……也不……
  rationale: 保留两个否定所构成的平行结构；“必不”也自然传达此处神亲自宣告的坚定语气。
theological_decisions:
- issue: 神所作承诺的表达
  choice: 保留“约”和从嘴唇发出的话这两个具体意象
  alternative: 将其概括为“我决不改变我的应许”或扩展为关于神不改变的教义陈述
  rationale: 本节直接谈到神的约和他说出的话；译文不把经文抽象化，也不加入原文没有明说的系统神学结论。
- issue: אֲחַלֵּל 的语义张力
  choice: 正文译为“违背”，脚注保留“亵渎”与“破坏”的可能表达
  alternative: 正文直接译为“亵渎我的约”
  rationale: “违背约”是自然的现代汉语搭配；脚注则保留该动词所含的使之俗化、亵渎或破坏的较强色彩。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“我必不……也不……”保留希伯来诗句的平行和坚定语气；“从我嘴唇发出的话”保留原文意象，同时避免生硬直译。
