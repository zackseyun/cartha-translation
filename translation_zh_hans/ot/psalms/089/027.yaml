  text: אַף אָ֭נִי בְּכ֣וֹר אֶתְּנֵ֑/הוּ עֶ֝לְי֗וֹן לְ/מַלְכֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/027.yaml
  text: Indeed[a], I will make him the firstborn, the highest of the kings of the earth.
translation:
  language: zh_hans
  text: 我也要立他为长子[a]，使他高过地上的众王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长子”在这里表示最高的地位和特权，不一定指实际的出生次序；也可译为“居首位者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: 也
  rationale: 此处承接上文，进一步陈明上帝的承诺；“也”自然表达递进兼添加意味。其强调色彩由显明的主语“我”和整体语序共同体现。
- source_word: אָ֭נִי
  choice: 我
  rationale: 希伯来文使用独立人称代词，带有强调作用，因此在中文中明确保留“我”。
- source_word: בְּכוֹר
  choice: 长子
  rationale: 保留原文的亲属与继承身份意象；在这里主要指尊位、继承权和特权，并不必然表示实际出生次序。
- source_word: אֶתְּנֵהוּ
  choice: 立他为
  rationale: נתן与身份性补语连用时可表示设立或使之成为某种身份；“立他为”既符合君王语境，也自然庄重。
- source_word: עֶלְיוֹן
  choice: 至高的
  rationale: 这里描述他相对于世上诸王的最高地位；“至高”准确保留尊崇和等级含义，同时不把它误读为此处直接使用上帝的称号。
- source_word: לְמַלְכֵי אָרֶץ
  choice: 地上君王中
  rationale: 介词לְ在这里表达关系或比较范围；“地上君王中”自然呈现其在诸王之中居于最高地位。
theological_decisions:
- issue: “长子”的王权及潜在弥赛亚含义
  choice: 正文保留“长子”这一身份意象，并以脚注说明其在本节主要表示最高尊位和特权。
  alternative: 直接译为“最尊贵者”“首位者”或“继承人”。
  rationale: 本诗直接语境指大卫王系的君王，在基督教正典阅读中又可具有弥赛亚意义。保留“长子”能保存原文的王权、继承和神学张力，而不在译文中把潜在含义解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立他为长子”保留希伯来诗歌中的王权身份意象；后半句用“使他成为”清楚呈现与前半句平行而递进的关系。
