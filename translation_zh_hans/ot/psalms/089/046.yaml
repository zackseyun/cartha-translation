  text: עַד מָ֣ה יְ֭הוָה תִּסָּתֵ֣ר לָ/נֶ֑צַח תִּבְעַ֖ר כְּמוֹ אֵ֣שׁ חֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/046.yaml
  text: How long[a], O Yahweh? Will you hide yourself forever? Will your wrath burn like fire?
translation:
  language: zh_hans
  text: 耶和华[a]啊，还要多久？你要隐藏自己到永远吗？你的烈怒要像火一样燃烧吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；传统上也译作“上主”。
    reason: 说明神名原文及传统替代译法。
lexical_decisions:
- source_word: עַד מָה
  choice: 还要多久
  rationale: 这是希伯来哀歌中询问苦难持续时间的惯用表达；“还要多久”自然传达迫切的申诉语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，并用脚注说明其原文及传统译法。
- source_word: תִּסָּתֵר
  choice: 隐藏自己
  rationale: 该词为סתר的尼法勒式，在此可表达反身或被动意味；“隐藏自己”保留诗人感到上帝不显现的哀诉。
- source_word: לָנֶצַח
  choice: 到永远
  rationale: 表示无尽的持续时间，并与疑问句结合，保留诗人强烈而未获解答的张力。
- source_word: תִּבְעַר
  choice: 燃烧
  rationale: 直接保留בער的燃烧意象；其阴性单数形式与“烈怒”相应，不扩展为“吞灭”等结果含义。
- source_word: כְּמוֹ אֵשׁ
  choice: 像火一样
  rationale: 直译原文的明喻，中文自然清楚。
- source_word: חֲמָתֶךָ
  choice: 你的烈怒
  rationale: חֵמָה可指热烈的愤怒；“烈怒”兼顾火焰意象、诗歌力度和庄重语体。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”是简体中文圣经传统中广为人知的专名形式，可保留直接呼求以色列之上帝名字的性质；脚注同时交代原文神名及传统替代译法，避免把专名无说明地化为称号。
- issue: 两个未完成式疑问句的时间与语气
  choice: 你要……吗？
  alternative: 难道你会……吗？；你仍要……吗？
  rationale: 原文未完成式在哀诉中具有延续或将来指向；采用“要……吗”保留开放的时间感及质问张力，不将其解释成断言。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。首句独立成问，突出诗人的迫切呼求；后两问保持原文平行结构。“隐藏自己”和“像火一样燃烧”保留原文具象表达，不淡化其中的神学张力。
