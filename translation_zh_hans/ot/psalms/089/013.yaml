  text: לְ/ךָ֣ זְ֭רוֹעַ עִם גְּבוּרָ֑ה תָּעֹ֥ז יָ֝דְ/ךָ֗ תָּר֥וּם יְמִינֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/013.yaml
  text: Yours is an arm with might[a]; your hand is strong; your right hand is exalted.
translation:
  language: zh_hans
  text: 你有大能的膀臂[a]；你的手强而有力；你的右手高高升起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大能的膀臂属于你；你的手显出力量；你的右手高高升起。”
    reason: 词汇及句法上的可行译法；לְךָ 可译为归属结构，תָּעֹז 可突出“显出力量”，תָּרוּם 也可表达为“高高升起”。
lexical_decisions:
- source_word: לְךָ
  choice: 你有
  rationale: 句首的介词加人称后缀表达归属或所有。现代汉语用“你有”自然简洁，也保留句首对上帝的强调。
- source_word: זְרוֹעַ
  choice: 膀臂
  rationale: 保留“臂膀”这一具体的拟人化意象，不将其抽象化为“能力”；“膀臂”符合庄重的诗歌语体。
- source_word: עִם גְּבוּרָה
  choice: 大能的
  rationale: עִם 与 גְּבוּרָה 表示伴随或特征；汉语以定中结构“大能的膀臂”自然表达膀臂具有大能。
- source_word: תָּעֹז
  choice: 强而有力
  rationale: 该动词表达强壮、有力量。译作“强而有力”能以自然汉语呈现谓语含义，并与“你的手”顺畅结合。
- source_word: יָדְךָ
  choice: 你的手
  rationale: 直译以保留希伯来诗歌中表示施行能力的拟人化形象。
- source_word: תָּרוּם
  choice: 高高举起
  rationale: רום 可表示高、升高或被高举。此处译为“高高举起”，保留空间性意象，并避免把本可作升高理解的词义单定为尊荣意义上的“崇高”。
- source_word: יְמִינֶךָ
  choice: 你的右手
  rationale: 直译以保留诗句的平行结构，以及右手所承载的力量和得胜意象。
theological_decisions:
- issue: 描写上帝能力的拟人化语言
  choice: 正文保留“膀臂”“手”“右手”等身体意象。
  alternative: 将这些意象抽象译为“能力”或“力量”。
  rationale: 原文以拟人化诗语描写上帝的大能；保留这些意象更忠实于希伯来诗歌，也不以解释性概念取代原文。
- issue: תָּרוּם 所表达的是升高还是尊崇
  choice: 译作“高高举起”，保留升高的形象。
  alternative: 译作“被尊崇”或“崇高”。
  rationale: 该动词兼有“升高”和“崇高”语义；上下文以身体部位为意象，因此采用空间性的表达，同时不排除其所暗含的尊荣与得胜。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留希伯来文三重身体意象及平行结构；“强而有力”避免生硬直译，“高高举起”保留原文可见的升高图景。
