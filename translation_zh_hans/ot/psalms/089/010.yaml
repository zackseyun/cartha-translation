source:
  edition: WLC
  text: אַתָּ֤ה דִכִּ֣אתָ כֶ/חָלָ֣ל רָ֑הַב בִּ/זְר֥וֹעַ עֻ֝זְּ/ךָ֗ פִּזַּ֥רְתָּ אוֹיְבֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/010.yaml
  text: You crushed Rahab like one slain[a]; with your mighty arm you scattered your enemies.
translation:
  language: zh_hans
  text: 你击碎拉哈伯，使它如同被杀的人；你用大能的膀臂驱散了你的仇敌。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִכִּאתָ
  choice: 击碎
  rationale: 该动词表达强力打碎、压碎；“击碎”既保留力度，也符合本节争战诗歌的意象。
- source_word: כֶחָלָל
  choice: 如同击杀一个人
  rationale: 前缀כ表示比较，חָלָל通常指在争战中被刺死或杀死的人；此译保留明示的比喻，又避免限定其具体身份。
- source_word: רָהַב
  choice: 拉哈伯
  rationale: 保留这个诗歌性专名，不在正文中将其直接解释为埃及或混沌怪物，以保存原文的多重联想。
- source_word: בִּזְרוֹעַ עֻזְּךָ
  choice: 用大能的膀臂
  rationale: 该短语表示凭借上帝有力的膀臂；此译保留拟人意象，并以自然庄重的现代汉语表达工具意义。
- source_word: פִּזַּרְתָּ
  choice: 驱散
  rationale: 该动词意为使分散；“驱散”在敌对语境中自然，同时没有像“击溃”那样额外强化军事结果。
- source_word: אוֹיְבֶיךָ
  choice: 你的仇敌
  rationale: 直接表达复数所有关系；“仇敌”符合诗篇庄重而有争战色彩的语域。
theological_decisions:
- issue: 诗歌语境中רָהַב的身份
  choice: 正文保留“拉哈伯”，作为被上帝击败的诗歌性专名。
  alternative: 可理解为埃及，也可理解为混沌怪物或混沌势力。
  rationale: 原词既能作为埃及的诗歌称号，也能唤起上帝战胜混沌势力的意象。正文若直接译成其中任何一种，都会过早消除原文有意保留的张力，因此以音译配合脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；平行句式清楚，保留“膀臂”的拟人意象和“拉哈伯”的文学张力。
