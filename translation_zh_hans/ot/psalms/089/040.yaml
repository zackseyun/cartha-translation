  text: פָּרַ֥צְתָּ כָל גְּדֵרֹתָ֑י/ו שַׂ֖מְתָּ מִבְצָרָ֣י/ו מְחִתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/040.yaml
  text: You have broken down all his walls[c][b][a]; you have made his strongholds a ruin.
translation:
  language: zh_hans
  text: 你拆毁了他所有的围墙[a]；使他的堡垒[b]沦为废墟[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他所有的屏障”或“他所有的篱墙”。原文所用的词可泛指围护或防御设施。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的要塞”或“他的坚固据点”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“毁灭”。原文名词也可在某些语境中指“惊恐”或“惊惶”；但这里与防御工事遭毁的语境较支持“废墟”或“毁坏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַצְתָּ
  choice: 攻破了
  rationale: 动词 פרץ 表示冲破、攻破或打开缺口；与防御性的“围墙”搭配时，“攻破”自然地传达毁坏防线的力量。
- source_word: כָל
  choice: 所有的
  rationale: 保留原文所强调的全面性。
- source_word: גְּדֵרֹתָיו
  choice: 他的围墙
  rationale: גְּדֵרָה 可指墙、篱笆或围护设施；这里与“堡垒”平行，主要具有防御意味，因此译作“围墙”，同时在脚注保留其他可能。
- source_word: שַׂמְתָּ
  choice: 使……沦为
  rationale: שׂים 的含义宽泛，包括放置、设立、使成为；在此与结果状态 מְחִתָּה 连用，译作“使……沦为”符合现代汉语表达。
- source_word: מִבְצָרָיו
  choice: 他的堡垒
  rationale: מִבְצָר 指设防之地或坚固据点；“堡垒”简洁、自然，并保留其军事防御色彩。
- source_word: מְחִתָּה
  choice: 废墟
  rationale: 此处的防御工事语境和上下句平行关系支持“毁坏、废墟”之义；该词也可能表示毁灭、惊恐，故在脚注说明。
theological_decisions:
- issue: 第三人称阳性单数后缀“他的”在诗篇89篇盟约哀歌中的所指
  choice: 正文保留“他的”，不明说具体所指。
  alternative: 明确译作“君王的”，或按群体意义解释为锡安／耶路撒冷的防御设施。
  rationale: 希伯来文使用第三人称阳性单数后缀；上下文指向大卫之约中的受膏者，却仍保有诗歌性的指涉空间。保留代词可避免将解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗体语言。“攻破—围墙”与“堡垒—废墟”形成清楚的平行结构；保留阳性单数代词，不擅自限定其神学所指。
