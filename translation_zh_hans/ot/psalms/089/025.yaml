  text: 我要把他的手放在海上[a]，把他的右手放在众河上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要把他的手置于海之上，把他的右手置于众河之上。”这意象可能表示统治权或势力所及的范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: 我要使……伸到
  rationale: שׂים本义为“放置、安放”。但汉语若直译为“把他的手放在海上”容易显得动作生硬；结合支配疆域的诗歌意象，译作“使……伸到”既保留手的具体形象，也自然表达范围延伸，且没有直接将隐喻解释为统治。
- source_word: בַיָּם
  choice: 海上
  rationale: 介词ב在此可表示在、于或涉及某一领域。“海上”保留较贴近原文的空间意象；“海之上”则可能更明确地暗示管辖，故列入脚注说明。
- source_word: יָדוֹ
  choice: 他的手
  rationale: 保留原文具体的身体意象，不直接抽象化为“权力”或“统治”。
- source_word: וּבַנְּהָרוֹת
  choice: 众河之上
  rationale: נְהָרוֹת为“河流”的复数。“众河”简洁而有诗歌韵味，并与前半句“海上”形成平行。
- source_word: יְמִינוֹ
  choice: 他的右手
  rationale: 直译原文，保留与“手”的平行结构，以及右手所含力量和权威的联想。
theological_decisions:
- issue: 君王的疆域与统治意象
  choice: 保留“手”和“右手”伸到海与众河之上的具体诗歌形象，让广阔权柄的含义由语境呈现。
  alternative: 我要使他的权力遍及海洋，使他的统治临到众河。
  rationale: 原文以身体和空间意象间接表达上帝赐予君王的广大权柄。正文不应把这一隐喻直接改写成抽象的政治统治陈述。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“伸到”避免“把手放在海上”的生硬感，同时保留原文的身体意象与诗歌平行；“众河之上”略带诗体色彩，适合诗篇语域。
