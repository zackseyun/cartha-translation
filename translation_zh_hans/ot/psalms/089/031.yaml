  text: אִם חֻקֹּתַ֥/י יְחַלֵּ֑לוּ וּ֝/מִצְוֺתַ֗/י לֹ֣א יִשְׁמֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/031.yaml
  text: If they profane my statutes and do not keep my commandments,[a]
translation:
  language: zh_hans
  text: 如果他们亵渎我的律例[a]，不遵守我的诫命，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“违犯我的律例。”希伯来语动词可指亵渎，或把神圣之物当作凡俗；“亵渎”保留了较强的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 这是引出条件从句的连词；“如果”直接保留其条件意味，也与下一节承接的结果相呼应。
- source_word: חֻקֹּתַי
  choice: 我的律例
  rationale: חֻקָּה 指所制定的法则、条例；“律例”在现代中文中庄重而清楚，并与下文“诫命”保持词义区别。
- source_word: יְחַלֵּלוּ
  choice: 亵渎
  rationale: חלל 的 Piel 词形可表示亵渎、使之失去神圣地位或视为凡俗；“亵渎”保留了此处强于一般“违犯”的语气。
- source_word: וּמִצְוֺתַי
  choice: 我的诫命
  rationale: מִצְוָה 在盟约和律法语境中指命令、诫命；“诫命”自然、庄重，并与“律例”构成平行。
- source_word: לֹא יִשְׁמֹרוּ
  choice: 不遵守
  rationale: שׁמר 与诫命连用时常指谨守、遵行；现代中文用“不遵守”简明自然。
theological_decisions:
- issue: חלל 用于“律例”时所表达的违约强度
  choice: 译作“亵渎我的律例”
  alternative: “违犯我的律例”
  rationale: 原文动词不仅可指违反，也带有亵慢、把神圣之物视为凡俗的意味。“亵渎”保留这种盟约与宗教语境中的严重性，同时在脚注中提供更平实的语境译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语言。“如果”保留条件结构；句末用逗号，表明本节的条件从句在下一节继续展开。
