id: PSA.89.14
reference: Psalms 89:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: צֶ֣דֶק וּ֭/מִשְׁפָּט מְכ֣וֹן כִּסְאֶ֑/ךָ חֶ֥סֶד וֶ֝/אֱמֶ֗ת יְֽקַדְּמ֥וּ פָנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/014.yaml
  text: Righteousness and justice are the foundation of your throne[a]; steadfast love and faithfulness go before you.
translation:
  language: zh_hans
  text: 公义和公正是你宝座的根基；忠贞之爱和信实在你面前先行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你面前”所对应的希伯来语字面含有“在你的脸前”之意，也可按习语理解为“在你临在之处”。
    reason: 说明פָנֶיךָ的字面面容意象及其可指临在的习语含义；正文同时保留“先行”这一动词意义。
lexical_decisions:
- source_word: צֶדֶק
  choice: 公义
  rationale: 表示合乎正道的品格与秩序；与 מִשְׁפָּט 并列时，用“公义”可避免把二者都译成司法层面的“公正”。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 在宝座与统治的语境中，突出审断和施政合乎正义的一面，同时与“公义”形成自然搭配。
- source_word: מְכוֹן
  choice: 根基
  rationale: 原词指稳固、确立之处；用于宝座的比喻时，“根基”准确且自然。
- source_word: כִּסְאֶךָ
  choice: 你宝座
  rationale: 保留君王统治的意象和第二人称单数所属关系。
- source_word: חֶסֶד
  choice: 忠贞的爱
  rationale: 兼顾爱、忠诚和持久不变的关系性内涵，比单用“慈爱”更明确地传达其忠贞意味，又不把经文限定为某一套约的术语。
- source_word: אֱמֶת
  choice: 信实
  rationale: 在 חֶסֶד וֶאֱמֶת 这一并列语中，重点是可靠、忠信；“信实”比抽象的“真实”更切合此处。
- source_word: יְקַדְּמוּ
  choice: 行在……面前
  rationale: 保留“走在前面、先行”的动态诗歌意象；以“行在”表达拟人化的随侍与先导作用，庄重而简洁。
- source_word: פָנֶיךָ
  choice: 你面前
  rationale: 希伯来语字面为“你的脸前”，也可表示“你的临在”；“你面前”既是自然汉语，也保留了原文具体的面容意象。
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת 这一组合的译法
  choice: 忠贞的爱和信实
  alternative: 慈爱和真实；慈爱和信实
  rationale: 该组合同时包含关系中的爱、忠诚和可靠性。译作“忠贞的爱和信实”保留其丰富张力，而不将其缩减为抽象的真理或单纯的怜悯。
- issue: פָנֶיךָ 应按字面“你的脸”还是按习语“你的临在”表达
  choice: 你面前
  alternative: 在你临在之处；在你跟前
  rationale: “你面前”在现代汉语中自然可懂，同时对应原文“脸”的具体诗意，并能表达神的临在，不必在正文中排除其中任何一层含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“公义和公正”保持两个近义概念的区别；分号对应原文两个平行分句。脚注标记置于其实际说明的“你面前”之后。
