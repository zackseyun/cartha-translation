  text: וְ/כַתּוֹתִ֣י מִ/פָּנָ֣י/ו צָרָ֑י/ו וּ/מְשַׂנְאָ֥י/ו אֶגּֽוֹף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/023.yaml
  text: And I will crush his adversaries before him[b][a], and strike down those who hate him.
translation:
  language: zh_hans
  text: 我要在他面前击碎他的敌人[a]，击倒那些恨他的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他面前”也可译作“从他面前除去”，更直接保留希伯来语的表达方式。
    reason: lexical_alternative
  - marker: b
    text: “击倒”也可译作“击打”或“使遭灾”；原文动词可指在审判或战斗中施加强力打击。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַתּוֹתִי
  choice: 我要……击碎
  rationale: כתת在这一连串神圣应许中虽为带连接词的完成式，却表达将来的行动。“击碎”保留其强烈、具体的战斗意象。
- source_word: מִפָּנָיו
  choice: 在他面前
  rationale: 字面为“从他面前／从他面前除去”。正文采用自然且仍贴近希伯来习语的“在他面前”，上下文中的“击碎”已传达清除敌人的结果；脚注保留更字面的方向含义。
- source_word: צָרָיו
  choice: 他的敌人
  rationale: צָרָיו指与他敌对的人。“敌人”在现代汉语中自然、庄重，并与后半句“那些恨他的人”保持词义区分。
- source_word: וּמְשַׂנְאָיו
  choice: 那些恨他的人
  rationale: 该分词表达持续或特征性的仇恨；此译法保留动词意味，也比“恨他者”更符合现代汉语。
- source_word: אֶגּוֹף
  choice: 击倒
  rationale: נגף可指打击、击杀或使遭灾。在战斗平行句中，“击倒”传达强力且决定性的打击，同时不把方式限定为瘟疫。
theological_decisions:
- issue: 大卫之约应许中的神圣战士语言
  choice: 保留上帝亲自击碎、击倒王之仇敌的强烈军事意象。
  alternative: 弱化为“战胜”或“制服”。
  rationale: 原文两个动词都具有强烈的打击色彩。直译这种力度可忠实呈现经文中的王权与盟约语境，而不将其泛化为抽象的保护，也不引入后来的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两分句保持平行结构，并保留“击碎／击倒”的力度差异。所有脚注标记均置于其所说明的正文成分之后。
