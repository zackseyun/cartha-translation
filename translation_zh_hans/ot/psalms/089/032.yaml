  text: וּ/פָקַדְתִּ֣י בְ/שֵׁ֣בֶט פִּשְׁעָ֑/ם וּ/בִ/נְגָעִ֥ים עֲוֺנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/032.yaml
  text: Then I will punish their transgression with the rod[a], and their iniquity with blows.
translation:
  language: zh_hans
  text: 我要用杖惩罚他们的过犯，用击打惩罚他们的罪孽。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惩罚”所译的希伯来语动词也可指“追讨”（即追究并施行惩罚），有时可指“察看”。“击打”也可译作“灾祸”或“灾害”。本节较形式化可译为：“我要用杖追讨他们的过犯，用击打追讨他们的罪孽。”
    reason: 保留 פקד 和 נגע 的词义范围，并说明较形式对应的替代译法；避免将 נגע 无依据地限定为“鞭打”。
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: 我要……惩罚
  rationale: פקד语义范围包括“察看、处理、惩罚”。本节以杖和击打为管教手段，惩罚义最符合语境；前面的连接词在中文中不另译为“然后”，以免把希伯来语普通连接结构过度明确化。
- source_word: בְשֵׁבֶט
  choice: 用杖
  rationale: שֵׁבֶט可指杖、棍或权杖；这里是惩戒的器具，因此译作“杖”，保留诗歌意象。
- source_word: פִּשְׁעָם
  choice: 他们的过犯
  rationale: פֶּשַׁע可指越界、悖逆或过犯。“过犯”既保留道德分量，也不把含义限定为政治性叛乱。
- source_word: וּבִנְגָעִים
  choice: 用鞭打
  rationale: נֶגַע可指灾病、创伤、击打或灾祸。它与“杖”平行，在惩戒语境中宜译作具体的“鞭打”；“鞭”并非原文另有的器具名，而是现代汉语表达受杖责打的自然说法，故以脚注保留其他可能。
- source_word: עֲוֹנָם
  choice: 他们的罪孽
  rationale: עָוֹן可表示罪孽、罪责或罪的后果。“罪孽”保留其道德重量，并与“过犯”形成诗体平行。
theological_decisions:
- issue: 上帝对盟约群体犯罪的回应性质
  choice: 直译为真实而具体的惩罚，同时不在本节加入最终弃绝的结论
  alternative: 弱化为一般性的察看、处理或纠正
  rationale: “杖”和“击打”构成明确的惩戒意象，不宜淡化；但更广语境中惩戒与信实之间的张力也不应由译文擅自消解。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两行重复“惩罚”，清楚呈现原文同一动词统摄两个平行宾语的结构；以脚注说明较字面的替代译法。
