source:
  edition: WLC
  text: לְ֭/עוֹלָ֗ם אשמור ל֣/וֹ חַסְדִּ֑/י וּ֝/בְרִיתִ֗/י נֶאֱמֶ֥נֶת לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/028.yaml
  text: Forever I will keep my steadfast love for him[a], and my covenant will remain faithful to him.
translation:
  language: zh_hans
  text: 我必永远为他存留我的慈爱；我的约也必对他信实[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的约也必为他坚定可靠”，或“我的约也必为他坚立”。
    reason: נֶאֱמֶנֶת可表示信实、可靠、稳固或坚立；原文容许这些相近理解。
lexical_decisions:
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 表达持续无尽的时长，符合本节所强调的盟约恒久性，也是现代汉语中自然庄重的说法。
- source_word: אֶשְׁמֹר
  choice: 守住
  rationale: שׁמר在此有持守、保守之意；“守住”体现主动维系，又能自然地与“慈爱”搭配。
- source_word: לוֹ
  choice: 为他／向他
  rationale: 第一处按受益关系译作“为他”，第二处与“信实”搭配译作“向他”；两者均保留ל所表达的关系指向。
- source_word: חַסְדִּי
  choice: 我的慈爱
  rationale: חסד兼具慈爱与忠贞不渝的内涵；“慈爱”是简洁、庄重且为普通读者熟悉的译法，盟约语境补足其忠诚意味。
- source_word: וּבְרִיתִי
  choice: 我的约
  rationale: בְּרִית在大卫之约的语境中指神所立的约；“约”准确而简洁。
- source_word: נֶאֱמֶנֶת
  choice: 必……信实
  rationale: אמן的尼法勒分词表示可靠、坚定、可信；“信实”直接保留其属性表达，并不把原文含义限定为单纯的稳固状态。
theological_decisions:
- issue: 盟约语言与弥赛亚应验的关系
  choice: 按原文译为神对“他”的直接应许，不在正文中明说弥赛亚身份。
  alternative: 在正文中明确译出弥赛亚式的指向。
  rationale: 本诗直接语境涉及大卫及其后裔；其更广的正典意义不应借增译而取代希伯来文本本身的表达。
- issue: נֶאֱמֶנֶת所修饰对象及其语义张力
  choice: 保留“我的约……信实”这一拟人化属性表达。
  alternative: 译作“我的约必为他坚定可靠”或“我的约必为他坚立”。
  rationale: 阴性分词与“约”一致，原文直接说约是可靠、信实的；中文虽稍显凝练，却能保留原文中可靠性与稳固性并存的张力。
translation_notes:
  register: 采用现代、庄重而简洁的诗体汉语。“守住我的慈爱”比“保守我的慈爱”更贴近日常现代汉语，同时保留主动持守之意；分号呈现两个平行分句。
