  naturalness: 改为“凡从路上经过的人都掠夺了他”更合现代汉语，也保留诗歌的简洁。以“邻舍所耻笑的对象”明确“成为邻舍的羞辱（reproach）”这一关系，避免“邻舍的羞辱”在汉语中被理解为邻舍本身感到羞耻。
  terminology: “掠夺”对应שסה的劫掠、夺取；“耻笑的对象”在本节语境中自然表达חֶרְפָּה的“受人蔑视、讥诮之对象”。代词仍仅作“他”，不预设其具体所指。
