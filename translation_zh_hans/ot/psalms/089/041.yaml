  text: שַׁ֭סֻּ/הוּ כָּל עֹ֣בְרֵי דָ֑רֶךְ הָיָ֥ה חֶ֝רְפָּ֗ה לִ/שְׁכֵנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/041.yaml
  text: All who pass by the way have plundered him[a]; he has become a reproach to his neighbors.
translation:
  language: zh_hans
  text: 凡从路上经过的人都掠夺了他；他成了邻舍所耻笑的对象。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁסֻּהוּ
  choice: 抢掠他
  rationale: 该动词表示掠夺、劫掠；“抢掠他”保留敌意夺取的具体含义，也符合现代汉语表达。
- source_word: כָּל עֹבְרֵי דָרֶךְ
  choice: 凡从路上经过的
  rationale: 保留“经过道路的人”这一希伯来语意象；“凡……的”自然表达 כָּל 的周遍范围。
- source_word: הָיָה
  choice: 成了
  rationale: 此完成式在语境中表达此前受辱所造成的现今状态；“成了”简洁呈现状态变化及其结果。
- source_word: חֶרְפָּה
  choice: 羞辱
  rationale: 该词可指羞耻、凌辱或受人蔑视的对象；“成了羞辱”保留诗歌凝练表达，并避免将其仅解释为人的嘲弄行为。
- source_word: לִשְׁכֵנָיו
  choice: 在邻舍中
  rationale: שָׁכֵן 指邻近居住者；介词 ל 可表达相对于、在……眼中。“在邻舍中”自然传达他在周围人那里蒙羞的关系。
theological_decisions:
- issue: 第三人称单数代词所指
  choice: 仅译作“他”，不在正文中明确其身份。
  alternative: 明确译为大卫家的君王、受膏者，或由君王代表的百姓。
  rationale: 上下文指向大卫家的君王或受膏者，但本节本身只使用第三人称单数形式；保留“他”可避免替原文消解其指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇哀歌语体。上下两分句维持平行结构；不添加原文没有的明确所指。
