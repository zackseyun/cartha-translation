id: PSA.89.9
reference: Psalms 89:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַתָּ֣ה מ֭וֹשֵׁל בְּ/גֵא֣וּת הַ/יָּ֑ם בְּ/שׂ֥וֹא גַ֝לָּ֗י/ו אַתָּ֥ה תְשַׁבְּחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/009.yaml
  text: You rule over the swelling of the sea[a]; when its waves rise[b], you still them.
translation:
  language: zh_hans
  text: 你统管海的汹涌[a]；海浪翻腾时，你使它们平息[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“海的高傲”或“海的威势”。希伯来语词可指高升、威严或水势上涨；这里的上下文更适合海水汹涌的画面。
    reason: lexical_alternative
  - marker: b
    text: 或译“你使它们止息”或“你制伏它们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: 统管
  rationale: 该分词表达持续施行的主权。“统管”自然简洁，也保留了主动治理和掌权的含义。
- source_word: בְּגֵאוּת
  choice: 海的汹涌
  rationale: גֵּאוּת可指高升、威势或水势上涨；与“海”和下半句的海浪相连时，“汹涌”最贴合具体诗歌意象。介词按汉语习惯与“统管”搭配处理。
- source_word: הַיָּם
  choice: 海
  rationale: יָם的标准对应词，符合本节的诗歌语境。
- source_word: בְּשׂוֹא
  choice: 翻腾时
  rationale: 此处不定式结构说明海浪涌起的情形；译作“……时”清楚地表达时间或伴随关系，“翻腾”则自然呈现波浪扬起、涌动的画面。
- source_word: גַלָּיו
  choice: 海浪
  rationale: 原文为“它的浪”，后缀回指海；汉语直接说“海浪”更自然，并避免代词指向含混。
- source_word: תְשַׁבְּחֵם
  choice: 你使它们平息
  rationale: שׁבח的Piel词形在此表示使汹涌的水安静、止息。“使它们平息”既保留使役含义，也与上文海浪翻腾形成鲜明对应。
theological_decisions:
- issue: 上帝对混沌水域的主权
  choice: 直接陈明上帝统管海及其波浪
  alternative: 将本节明确解释为上帝战胜宇宙混沌的神话诗意暗示
  rationale: 经文本身清楚描绘上帝对海的掌控。译文保留这一具体而有力的诗歌图景，但不把可能存在的更广泛古代混沌争战背景写进正文，以免将解释变成明说。
translation_notes:
  register: 采用现代、庄重而清楚的诗歌语言。“统管”突出持续的主权，“汹涌—翻腾—平息”形成自然连贯的动态画面。所有代词均保持易于普通读者辨认的指向。
