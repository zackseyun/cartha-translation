  text: כְּ֭/יָרֵחַ יִכּ֣וֹן עוֹלָ֑ם וְ/עֵ֥ד בַּ֝/שַּׁ֗חַק נֶאֱמָ֥ן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/037.yaml
  text: Like the moon[a], it will be established forever, and the witness in the sky is faithful[b]. Selah
translation:
  language: zh_hans
  text: 它必如月亮永远坚立；天上的见证者是可信的。[a]（细拉）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上的见证者”通常被理解为月亮；月亮以稳定运行的天象，为圣约的长存作可靠的见证。但原文并未明确指出其身份。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּיָרֵחַ
  choice: 如月亮
  rationale: 前缀כְּ表示比较，יָרֵחַ意为“月亮”；“如月亮”自然、庄重，并保留诗歌中的明喻。
- source_word: יִכּוֹן
  choice: 它必……坚立
  rationale: כון的尼法勒未完成式表达被坚立、稳固长存；“坚立”既保留结果状态，也适合诗歌语体。代词“它”承接上文，但不擅自明确为王位或后裔。
- source_word: עוֹלָם
  choice: 永远
  rationale: 在圣约诗歌语境中表示长久不止、永久存续；“永远”简洁且分量相称。
- source_word: וְעֵד
  choice: 见证者
  rationale: עֵד意为“见证者/见证”；译作“见证者”可与后面的נֶאֱמָן自然搭配，同时不在正文中判定其身份。
- source_word: בַּשַּׁחַק
  choice: 天上的
  rationale: שַׁחַק在诗歌中可指天空、穹苍或云天；“天上的”自然涵盖其空间意象，又不过度限定为云层。
- source_word: נֶאֱמָן
  choice: 是可信的
  rationale: 该词表达可靠、确实、忠信；“可信的”在“见证者”这一搭配中自然，并突出其可靠作证的含义。
- source_word: סֶלָה
  choice: 细拉
  rationale: 此词确切含义未明，沿用中文圣经传统音译，避免作推测性翻译。
theological_decisions:
- issue: “必坚立”的隐含主语
  choice: 以“它”承接上文，不在本节明说具体所指
  alternative: 明确译为“他的王位”或“他的后裔”
  rationale: 希伯来文本本节没有明示主语，须由前文补足；保留代词既符合中文需要，也避免在王位与后裔之间作过窄判定。
- issue: “天上的见证者”的身份
  choice: 正文保留为未明确身份的“见证者”
  alternative: 直接认定为月亮，或解释为彩虹等天象
  rationale: 原文没有明确指出见证者是谁。月亮很可能既是前一分句的比拟对象，也是这里的天上见证者，但正文不应消除这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“永远坚立”保留圣约语境的持久性；“可信的”避免把נֶאֱמָן的意义仅限于道德层面的“忠诚”。正文中的脚注标记置于相关分句之后。
