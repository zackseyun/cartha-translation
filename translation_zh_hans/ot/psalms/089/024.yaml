  text: וֶֽ/אֶֽמוּנָתִ֣/י וְ/חַסְדִּ֣/י עִמּ֑/וֹ וּ֝/בִ/שְׁמִ֗/י תָּר֥וּם קַרְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/024.yaml
  text: And my faithfulness and my steadfast love will be with him[a], and in my name his horn will be exalted.
translation:
  language: zh_hans
  text: 我的信实和慈爱必与他同在；他的角必因我的名而高举[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角”是希伯来语中的形象说法，可象征力量、尊荣或王权。
    reason: cultural_note
lexical_decisions:
- source_word: אֱמוּנָתִי
  choice: 我的信实
  rationale: 此处指上帝可靠、守信的品格，而非相信这一行为；“信实”也与下文的“慈爱”形成合宜的盟约语境并列。
- source_word: חַסְדִּי
  choice: 我的慈爱
  rationale: חֶסֶד在此表达持久、忠贞的爱；“慈爱”是现代中文圣经语体中自然而庄重的表达，既不缩窄为单纯怜悯，也不过度添加解释。
- source_word: עִמּוֹ
  choice: 与他同在
  rationale: 准确表达伴随、支持之意，同时符合现代汉语习惯。
- source_word: בִּשְׁמִי
  choice: 因我的名
  rationale: 介词短语直译为“在我的名里”，但在本句中表达王的能力与尊荣源自上帝的名；“因我的名”在中文中较自然，同时保留“名”这一重要意象。
- source_word: תָּרוּם
  choice: 必……高举
  rationale: רוּם表示升高、被高举；与“角”搭配时保留原文具象而庄重的诗歌表达。
- source_word: קַרְנוֹ
  choice: 他的角
  rationale: 保留希伯来诗歌中“角”的原始意象，不在正文中将其扁平化为抽象的“力量”或“权势”；其象征意义由脚注说明。
theological_decisions:
- issue: 是否保留君王诗歌中的“角”这一隐喻
  choice: 他的角必……高举
  alternative: 他的力量必增强／他的权势必被高举
  rationale: 原文以“角”象征力量、尊荣或王权。保留这一意象能呈现诗篇的文学与盟约君王语境，同时避免把多义象征限定为某一种抽象含义。
- issue: בִּשְׁמִי所表达的关系
  choice: 因我的名
  alternative: 在我的名里／借着我的名
  rationale: 上下文表明君王的高升与上帝的名相关。“因”在现代汉语中自然地表达其根据或来源，但不进一步限定为某种具体机制。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“信实和慈爱”保留盟约语境中的并列关系；分号呈现两个诗歌分句。“角”保留原文隐喻，并以脚注帮助普通读者理解。
