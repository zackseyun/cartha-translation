source:
  edition: WLC
  text: זְכֹ֣ר אֲ֭דֹנָ/י חֶרְפַּ֣ת עֲבָדֶ֑י/ךָ שְׂאֵתִ֥/י בְ֝/חֵיקִ֗/י כָּל רַבִּ֥ים עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/050.yaml
  text: Remember[a], Lord, the reproach of your servants[b], which I bear in my bosom from many peoples.
translation:
  language: zh_hans
  text: 主啊，求你记念你仆人所受的羞辱；我把来自许多民族的羞辱都揣在怀中[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我把所有众多民族的羞辱都揣在怀中。”原文在“怀中”之后句法简略，末尾的短语既可表示羞辱的来源（“来自许多民族”），也可表示所承受之物的内容或范围（“所有众多民族的羞辱”）。
    reason: alternative_reading
  - marker: b
    text: “揣在怀中”是希伯来语的形象说法，表示亲自而深切地承受，并非仅指实际放在胸前携带。
    reason: cultural_note
lexical_decisions:
- source_word: זְכֹר
  choice: 求你记念
  rationale: 这是阳性单数祈使式，在哀歌祷告中是向上帝发出的直接恳求。“求你记念”既保留祷告语气，也比单说“记住”更庄重自然。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 此处是对上帝的固定尊称，并非要突出“我的”这一所有关系；加“啊”自然表达直接呼告。
- source_word: חֶרְפַּת
  choice: 所受的羞辱
  rationale: חֶרְפָּה可指羞辱、辱骂或蒙羞的处境。“羞辱”保留其较宽广的哀歌含义；“所受的”使“你仆人的羞辱”在现代汉语中清楚自然。
- source_word: עֲבָדֶיךָ
  choice: 你仆人
  rationale: 在向上帝祷告的语境中，עבד指属于并事奉上帝的人；“仆人”比“奴隶”更符合此处语域，且不额外引入不必要的制度性含义。
- source_word: שְׂאֵתִי
  choice: 我……揣
  rationale: 该词源于נשׂא，基本义为拿起、携带、承担。结合“怀中”的具体意象，用“揣”可自然表达贴身带着并亲自承受。
- source_word: בְחֵיקִי
  choice: 在怀中
  rationale: חֵיק指胸怀或怀抱。“在怀中”保留希伯来语的身体意象，表示诗人亲自而深切地承受羞辱。
- source_word: כָּל רַבִּים עַמִּים
  choice: 来自许多民族的
  rationale: 原文结构高度压缩。正文将该短语理解为羞辱的来源，并以“来自”补足现代汉语所需的关系；עַמִּים为复数，故译“民族”而非泛指许多个体。כָּל的总体意味以“都”体现。
theological_decisions:
- issue: 神圣称号אֲדֹנָי的译法
  choice: 主
  alternative: 我的主
  rationale: 此词在这里是诗篇中呼求上帝时使用的固定神圣称号。译作“主”符合其实际用法，也避免把历史形态误读为此处特意强调的第一人称所有关系。
- issue: 末句压缩句法的理解
  choice: 羞辱来自许多民族
  alternative: 承受所有众多民族的羞辱
  rationale: 正文采用来源关系，使全句在汉语中顺畅，但原文没有明示“来自”的介词，因而不排除将末尾短语理解为所承受羞辱的内容或范围；脚注保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“求你记念”保留哀歌中的恳求口吻；“揣在怀中”保留原文具体意象，同时以脚注说明其惯用含义。正文没有消除末句原有的句法张力，而以替代译法明确保留。
