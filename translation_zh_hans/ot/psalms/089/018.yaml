source:
  edition: WLC
  text: כִּ֣י לַֽ֭/יהוָה מָֽגִנֵּ֑/נוּ וְ/לִ/קְד֖וֹשׁ יִשְׂרָאֵ֣ל מַלְכֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/018.yaml
  text: For our shield belongs to Yahweh[a], and our king to the Holy One of Israel.
translation:
  language: zh_hans
  text: 因为我们的盾牌属耶和华[a]，我们的王也属以色列的圣者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “属耶和华”也可译作“是耶和华的”。希伯来文采用省略式表达，并有鲜明的平行结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的欢呼与信靠说明根据；现代汉语中“因为”自然保留这一连接和解释作用。
- source_word: לַיהוָה
  choice: 属耶和华
  rationale: 前缀 ל 在此表达归属或关系；“属”既简洁，又保留希伯来文省略谓语的诗性结构。神名 יהוה 音译为“耶和华”，并以脚注提示另一种传统译法。
- source_word: מָגִנֵּנוּ
  choice: 我们的盾牌
  rationale: 保留“盾牌”的具体诗歌意象，不抽象化为“保护者”；它既可指保护，也可能隐喻王，译文不强行确定所指。
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: 也属以色列的圣者
  rationale: 第二个 ל 与前句平行，同样表示归属或关系；补出“属”使现代汉语清楚，同时保留两行的对应。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 这是希伯来圣经中固定而庄重的神圣称号，宜直译，不作解释性改写。
- source_word: מַלְכֵּנוּ
  choice: 我们的王
  rationale: 直译“王”，保留王权意象以及可能指向以色列人间君王的含义。
theological_decisions:
- issue: “我们的盾牌”和“我们的王”的所指
  choice: 译为二者都“属”神，同时不在正文中断定“盾牌”究竟直接指神的保护，还是隐喻属神的人间君王。
  alternative: 把“我们的盾牌”直接解释为神，而把“我们的王”解释为人间君王；或明确把二者都解释为人间君王。
  rationale: 两个分句使用平行的 ל 介词结构：“属耶和华”与“属以色列的圣者”。“盾牌”在诗篇中既能作为神保护的意象，也可指作为保护者的君王。直译其平行和省略性，能保存原文真实的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“属……也属……”重现希伯来文的平行关系；保留“盾牌”“王”“以色列的圣者”等核心意象和称号。
