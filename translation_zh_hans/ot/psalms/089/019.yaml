source:
  edition: WLC
  text: אָ֤ז דִּבַּ֥רְתָּֽ בְ/חָ֡זוֹן לַֽ/חֲסִידֶ֗י/ךָ וַ/תֹּ֗אמֶר שִׁוִּ֣יתִי עֵ֭זֶר עַל גִּבּ֑וֹר הֲרִימ֖וֹתִי בָח֣וּר מֵ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/019.yaml
  text: Then you spoke in a vision to your faithful ones and said[a], “I have set help upon a mighty one[d][c][b]; I have exalted one chosen from the people.”
translation:
  language: zh_hans
  text: '那时，你在异象中对你忠信的人[a]说：


    “我已将援助赐给一位勇士[b]；


    我已高举一位从民中拣选的人[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有文本读法作“对你忠信的那一位说”。
    reason: textual_variant
  - marker: b
    text: “勇士”也可译作“强者”或“英雄”。
    reason: lexical_alternative
  - marker: c
    text: “拣选的人”也可理解为“青年”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作时间副词，引出过去叙事中的神谕；“那时”自然、庄重。
- source_word: דִּבַּרְתָּ
  choice: 你……说
  rationale: דבר表示说话；中文无需为与后面的אמר保持词形差别而使用生硬措辞，借引语结构自然传达。
- source_word: בְחָזוֹן
  choice: 在异象中
  rationale: ב在此表示启示发生的方式或场景，“在异象中”贴近原文且符合现代汉语。
- source_word: לַחֲסִידֶיךָ
  choice: 对你忠信的人
  rationale: חסיד指以忠贞、敬虔为特征的人；“忠信的人”保留盟约忠诚的意味，也避免“圣徒”可能带入的后期宗教称谓。按所给WLC文本取复数含义；汉语形式本身不强标单复数，脚注说明异读。
- source_word: שִׁוִּיתִי עֵזֶר עַל
  choice: 我已把救助加在……身上
  rationale: 保留“安置/加上—救助—在……之上”的原文意象，同时使用可理解的现代汉语；不将עֵזֶר窄化为“力量”。
- source_word: גִּבּוֹר
  choice: 一位勇士
  rationale: גבור可指强者、勇士或英雄；在君王与争战语境中，“勇士”自然，并保留人物的阳性、英武意味。
- source_word: הֲרִימוֹתִי
  choice: 我已高举
  rationale: רום的使役形表示使之升高、尊崇；“高举”兼具动作意象与王权提升的含义。
- source_word: בָּחוּר
  choice: 拣选的人
  rationale: 该词可理解为“被选中的人”，也可作“青年”；本节与神的选立、高举相呼应，正文采用“拣选的人”，并以脚注保存另一词义。
- source_word: מֵעָם
  choice: 从民中
  rationale: מן表示来源或从一群人中选出；“从民中”简洁而富诗意。
theological_decisions:
- issue: 本节人物在诗篇89篇之大卫之约语境中的所指
  choice: 正文停留在诗篇直接所述的受拣选、被高举之人，不明说为弥赛亚。
  alternative: 在译文中明确加入指向弥赛亚的解释。
  rationale: 本节直接语境关乎神对大卫的拣选与立约；后续的预表或弥赛亚理解可由整体正典语境展开，但不应写入本节原文未明说的内容。
- issue: לַחֲסִידֶיךָ的数
  choice: 按所给WLC文本理解为复数“你忠信的人”。
  alternative: 依另有文本传统理解为单数“你忠信的人（单数）”。
  rationale: 所给文本支持复数；另有版本所反映的单数读法确实存在，故在脚注中保留，不在正文中静默调和。
- issue: בָּחוּר的语义
  choice: 译作“拣选的人”。
  alternative: 译作“青年”。
  rationale: 本节神主动高举某人的语境支持“被拣选者”，但该词也确可表示青年，故保存词义张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。以两行引语呈现平行结构；“救助加在……身上”略带诗性，以保留希伯来原文的安置意象，而不作过度解释。所有脚注标记均置于正文相应位置。
