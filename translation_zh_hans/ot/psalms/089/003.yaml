  text: כָּרַ֣תִּֽי בְ֭רִית לִ/בְחִירִ֑/י נִ֝שְׁבַּ֗עְתִּי לְ/דָוִ֥ד עַבְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/003.yaml
  text: 'I have made a covenant with my chosen one[a]; I have sworn to David my servant:'
translation:
  language: zh_hans
  text: “我与我所拣选的人立了约[a]；我向我的仆人大卫起了誓：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译：“我与我所拣选的人切了约。”
    reason: 说明“立约”所翻译的希伯来语固定说法，保留其字面意象。
lexical_decisions:
- source_word: כָּרַתִּי
  choice: 立了
  rationale: 希伯来语“כרת ברית”直译为“切约”，是表示订立盟约的固定用语；现代汉语以“立约”最自然、庄重，也保留其盟约含义。完成式在此陈述已经确立且仍具效力的行动。
- source_word: בְּרִית
  choice: 约
  rationale: “约”是现代中文圣经语境中对盟约关系的简洁、庄重表达；与“立”组成固定搭配“立约”，不宜弱化为一般性的“协议”。
- source_word: לִבְחִירִי
  choice: 与我所拣选的人
  rationale: 介词 ל 在“立约”结构中按汉语习惯译作“与”；בְחִירִי 表示“我所拣选的人”，既明确其属神，也比名词化的“我的选民”更准确地保留单数个人所指。
- source_word: נִשְׁבַּעְתִּי
  choice: 我……起了誓
  rationale: נשבע 表示郑重起誓。中文“起了誓”自然地表达已经作出的庄严誓言，并与前句“立了约”形成诗歌平行。
- source_word: לְדָוִד
  choice: 向……大卫
  rationale: 介词 ל 标明誓言所指向的对象；现代汉语用“向大卫起誓”最直接自然。为使“我的仆人”清楚修饰“大卫”，译作“向我的仆人大卫”。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: עבד 可指仆人或奴仆；此处是大卫在与神关系中的尊称和身份称谓，“我的仆人”准确、庄重，且不额外突出奴役含义。
theological_decisions:
- issue: “我所拣选的人”的身份
  choice: 保留经文本身的表达，并由平行下句自然表明其直接所指是大卫。
  alternative: 在译文中直接将其解释为弥赛亚，或把前半句明确改写为“大卫”。
  rationale: 本节把“我所拣选的人”与“我的仆人大卫”平行对应，直接语境所指为大卫；更广的预表或弥赛亚意义属于解释层面，不应添加进正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“立约”“起誓”“仆人”符合诗篇中的盟约语域。句末保留冒号，因为下一节继续引述誓言内容。
