  text: וְ/י֘וֹד֤וּ שָׁמַ֣יִם פִּלְאֲ/ךָ֣ יְהוָ֑ה אַף אֱ֝מֽוּנָתְ/ךָ֗ בִּ/קְהַ֥ל קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/005.yaml
  text: The heavens will praise your wonders[a], O Yahweh—indeed, your faithfulness in the assembly of the holy ones.
translation:
  language: zh_hans
  text: 诸天要颂赞你的奇事，耶和华啊；在众圣者的集会中，也要颂赞你的信实。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众圣者”也可理解为“圣民”；按上下文，这里很可能指天上的众圣者或其他天上存在。
    reason: 保留קְדֹשִׁים的指称歧义，同时说明诗篇89篇天上议会意象所支持的较可能理解。
lexical_decisions:
- source_word: וְיֹודוּ
  choice: 要颂赞
  rationale: ידה的Hiphil形式在此表示称颂、赞美；以“诸天”为主语、以神的奇事为对象时，“颂赞”自然且符合诗体。未完成式依语境译出将来或宣告性的“要”。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 保留希伯来语复数及圣经诗歌的庄重语感，也与下文天上议会的意象相合。
- source_word: פִּלְאֲךָ
  choice: 你的奇事
  rationale: פלא指非凡、令人惊奇之事，在赞美语境中可概括耶和华奇妙的作为；“奇事”比抽象的“奇妙”更适合作动词宾语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中通行的圣经专名音译表达四字神名，不以称号替代。呼格语气由“耶和华啊”体现。
- source_word: אַף
  choice: 也
  rationale: 此处承接并加强前句，同时引出并列的第二个受词；中文用“也”能自然表达附加和强调，而不把语义解释得过重。
- source_word: אֱמוּנָתְךָ
  choice: 你的信实
  rationale: אֱמוּנָה在这里指神可靠、守信的属性；“信实”准确而庄重。
- source_word: בִּקְהַל
  choice: 在……的会中
  rationale: קהל指聚集起来的群体或集会；“会中”保留具体的议会、集会图景。
- source_word: קְדֹשִׁים
  choice: 众圣者
  rationale: קדשים字面为“圣者们”，上下文很可能指天上的众存在，但词本身并未明确限定为天使；“众圣者”保留这一开放性。
theological_decisions:
- issue: קְדֹשִׁים所指的对象
  choice: 正文译作“众圣者”，不直接明确为天使；脚注说明上下文很可能指天上的众存在。
  alternative: 圣民；天使
  rationale: 本诗相邻经文谈到诸天和天上的会众，因此天上存在是较可能的所指；然而原词本身也可用于分别为圣的人，故正文不将歧义完全消除。
- issue: 第二分句省略谓语的处理
  choice: 补出“受颂赞”，使“你的信实”明确承接首句的颂赞动作。
  alternative: 直译为“你的信实也在众圣者的会中”，保留希伯来语的谓语省略。
  rationale: 希伯来诗歌中第二分句自然沿用前句谓语。中文若完全省略会成为不完整句；补出“受颂赞”既传达平行结构，又不增加新的神学主张。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“诸天”“奇事”“信实”“众圣者的会”保留原文的平行结构和天上议会意象；为符合自然中文，在第二分句补出承接的谓语“受颂赞”。
