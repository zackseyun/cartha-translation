base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/044.yaml
  text: You have brought his splendor to an end and cast his throne to the ground[a][b].
translation:
  language: zh_hans
  text: 你使他的荣光止息[a]，又把他的宝座抛到地上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你使他的光彩止息”，或“你使他的纯净止息”。希伯来语原词可指明亮、纯净或荣美；这里按君王的语境译作“荣光”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“又把他的宝座投于地上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּתָּ
  choice: 你使……止息
  rationale: 该词是 שׁבת 的使役式，表示“使停止、使终止”。“使……止息”保留使役含义，也符合诗歌体的庄重语域。
- source_word: מִטְּהָרוֹ
  choice: 他的荣光
  rationale: טֹהַר 可指明亮、纯净或光彩；在王权受辱的语境中，“荣光”自然表达君王威仪与光彩，同时不把它误解为道德上的纯洁。介词 מִן 与动词结合，表达使其不再有这种荣光。
- source_word: וְכִסְאוֹ
  choice: 又把他的宝座
  rationale: כִּסֵּא 直指“宝座”；以“又”承接前一分句，以“把”字结构自然配合后面的抛摔动作。
- source_word: לָאָרֶץ
  choice: 在地上
  rationale: אֶרֶץ 在此表示地面；与“摔”搭配译作“在地上”符合现代汉语，并传达宝座遭贬抑的形象。
- source_word: מִגַּרְתָּה
  choice: 摔
  rationale: 该动词表达投下、掷下或拖倒。“摔在地上”简洁有力，保留宝座被暴力降下的诗意画面。
theological_decisions:
- issue: 第三人称单数后缀所指
  choice: 保留为“他的”，不在正文中明确所指人物。
  alternative: 明确译为“大卫王的”“受膏者的”或“那位君王的”。
  rationale: 希伯来文只用第三人称单数后缀，本节没有重述先行词。保留“他的”既维持诗歌衔接，也避免把上下文中的王权所指进一步限定为某一解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“荣光”适合王权语境；“使……止息”保留希伯来文的使役力度；两个“他的”不补明所指，以保存原文的含蓄性。
