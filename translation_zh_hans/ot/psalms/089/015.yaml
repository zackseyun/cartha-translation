id: PSA.89.15
reference: Psalms 89:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַשְׁרֵ֣י הָ֭/עָם יוֹדְעֵ֣י תְרוּעָ֑ה יְ֝הוָ֗ה בְּֽ/אוֹר פָּנֶ֥י/ךָ יְהַלֵּכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/015.yaml
  text: Blessed are the people who know the joyful shout[a]; O Yahweh[b], they walk in the light of your face.
translation:
  language: zh_hans
  text: 懂得欢呼[a]的民有福了！雅威啊，他们行在你面容[b]的光中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“节庆的欢呼”；也可能包括敬拜中号角的鸣响。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“你的面容”；可表示你的同在或恩宠。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是诗歌中宣告福分的感叹式表达；“有福了”既保留庄重、礼仪性的语气，也比单指心理感受的“快乐”更贴近原意。
- source_word: הָעָם
  choice: 民
  rationale: 此处指作为群体的百姓；“民”简洁自然，并与诗篇的群体敬拜语境相称。
- source_word: יוֹדְעֵי
  choice: 懂得
  rationale: 分词描述这群民持续具有的特征。“懂得”不仅可指听过或知道，也可包含认识、参与并回应这种欢呼，且不把含义过度具体化。
- source_word: תְרוּעָה
  choice: 欢呼声
  rationale: 该词可指欢呼、节庆呐喊、号角声或战场呼喊。此处语境偏向敬拜与庆典，因此正文采用“欢呼声”，脚注保留节庆及号角伴奏的可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用的学术音译呈现四字神名，保留其作为专名的性质，而不以“主”这一称号代替。
- source_word: בְּאוֹר
  choice: 在……光中
  rationale: 介词与“光”组合，主要表达所处的范围或氛围；“在……光中”贴近希伯来文意象。
- source_word: פָּנֶיךָ
  choice: 你面容的
  rationale: 正文保留“面容”这一具体而富关系性的希伯来意象，不直接释为“同在”或“恩宠”；这些隐含意义在脚注中说明。
- source_word: יְהַלֵּכוּן
  choice: 他们行
  rationale: 保留“行走”的圣经意象，也可自然表达持续生活、行事为人的状态；简洁的“行”适合诗歌语体。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威啊
  alternative: 耶和华啊；主啊
  rationale: 原文直接使用四字神名并构成呼语。正文用“雅威”保存专名及直接称呼的语气，不以称号“主”替代；“耶和华”虽为汉语传统形式，但并非较准确的现代音译。
- issue: פָּנֶיךָ 应直译为“你的面容”还是意译为“你的同在/恩宠”
  choice: 你面容的光中
  alternative: 你同在的光中；你恩宠的光中
  rationale: “面容”是原文明确意象，同时可以蕴含神的同在、眷顾与恩宠。正文保留这种多义张力，脚注说明其可能含义，而不限定为单一解释。
- issue: תְרוּעָה 是人的欢呼还是号角声
  choice: 欢呼声
  alternative: 节庆的欢呼；号角声
  rationale: 词义范围允许人声欢呼和礼仪性的号角鸣响。诗篇语境支持喜庆敬拜，但不足以断定仅指乐器，因此正文采用较宽泛的“欢呼声”，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“有福了”延续智慧诗与礼仪文本的宣告语气；“行在……光中”保留原文的生活道路和神面容之光两重意象。脚注标记均置于正文相关词语之后。
