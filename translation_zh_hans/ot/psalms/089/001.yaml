source:
  edition: WLC
  text: חַֽסְדֵ֣י יְ֭הוָה עוֹלָ֣ם אָשִׁ֑ירָה לְ/דֹ֥ר וָ/דֹ֓ר אוֹדִ֖יעַ אֱמוּנָתְ/ךָ֣ בְּ/פִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/001.yaml
  text: I will sing of the steadfast love of Yahweh forever[a]; from generation to generation I will make your faithfulness known with my mouth.
translation:
  language: zh_hans
  text: 我要永远歌唱雅威的慈爱[a]；我要用口向世世代代传扬你的信实。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“怜悯”或“慈爱之举”。希伯来词 חַסְדֵי 可指雅威忠贞不渝的爱，也可着重这种爱在一次次怜悯行动中的彰显。
    reason: 保留 חֶסֶד 的词义范围及此处复数形式可能具有的行动含义。
lexical_decisions:
- source_word: חַסְדֵי
  choice: 慈爱
  rationale: 该词是 חֶסֶד 的复数构造形式，在本诗的圣约语境中兼含忠贞的爱、恩慈及其一再显出的行动。“慈爱”自然庄重，并保留其关系性与持久性；复数所含的多次施恩之举在脚注中说明。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文所写的四字神名作音译，以保留其作为以色列之神专名的性质，而不以“主”这一称号替代。
- source_word: עוֹלָם
  choice: 永远
  rationale: 此处作时间副词，修饰“歌唱”，表达持续无尽的决心；“永远”是现代汉语中自然明确的对应。
- source_word: אָשִׁירָה
  choice: 我要……歌唱
  rationale: 该鼓励式形式可表达意愿或坚定决心；“我要”贴切传达诗人的自我立志。
- source_word: לְדֹר וָדֹר
  choice: 向世世代代
  rationale: 该习语指接续不断的各代人。“向世世代代”在本句中既自然，也与“使……知道”的对象关系相符。
- source_word: אוֹדִיעַ
  choice: 传扬
  rationale: ידע 的使役式本义为“使知道”。结合口头宣告的语境，“传扬”以简洁自然的汉语表达使人知晓之意。
- source_word: אֱמוּנָתְךָ
  choice: 你的信实
  rationale: אֱמוּנָה 在此指神可靠、守信的品格；“信实”与“慈爱”构成恰当的诗歌平行。
- source_word: בְּפִי
  choice: 用口
  rationale: 保留希伯来文以“口”指有声宣告的具体意象，同时符合现代汉语表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留专名性质，并较贴近通常重构的读音；不以称号“主”替代。
- issue: חַסְדֵי 的单复数表达
  choice: 正文用集合性的“慈爱”，脚注补明也可指多次慈爱行动
  alternative: 怜悯；慈爱之举
  rationale: 汉语“慈爱”可概括神持久而忠贞的爱，但希伯来文复数也可能突出这种爱在多次施恩行动中的显明，因此不在正文中把含义限定为单一抽象品格。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留原文从第三人称“雅威”转为第二人称“你的”的直接称呼，也保留“用口”的具体意象；分号呈现两行平行结构。
