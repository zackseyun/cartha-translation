  text: מִ֤י גֶ֣בֶר יִֽ֭חְיֶה וְ/לֹ֣א יִרְאֶה מָּ֑וֶת יְמַלֵּ֨ט נַפְשׁ֖/וֹ מִ/יַּד שְׁא֣וֹל סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/048.yaml
  text: What man can live and not see death? Can he deliver his soul from the hand of Sheol? Selah[a][b][c]
translation:
  language: zh_hans
  text: 有谁能活着而不见死亡[a]呢？他能救自己的性命[b]脱离阴间[c]的手吗？细拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见死亡”也可译作“经历死亡”。原文直译为“见死亡”。
    reason: lexical_alternative
  - marker: b
    text: “自己的性命”也可译作“自己的灵魂”或“自己”。
    reason: lexical_alternative
  - marker: c
    text: “阴间”对应希伯来语“示奥尔”，指死者所在之域；也可译作“坟墓”。
    reason: alternative_reading
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: 有谁
  rationale: 引出反问，所问虽以阳性名词גֶבֶר表达，却指向无人能够逃避死亡这一普遍事实；现代汉语用“有谁”自然保留反问力度，也不必生硬补出“男人”。
- source_word: יִחְיֶה
  choice: 能活着
  rationale: 未完成式置于反问中表达可能性，以“能”传达“谁有可能活着而……”的语气。
- source_word: וְלֹא יִרְאֶה מָוֶת
  choice: 而不见死亡
  rationale: 保留希伯来语“见死亡”的诗性意象；其含义也可理解为“经历死亡”，列于注脚。
- source_word: יְמַלֵּט
  choice: 能救
  rationale: Piel词形表达使之逃脱、搭救；“能救”与前句的可能性反问呼应。
- source_word: נַפְשׁוֹ
  choice: 自己的性命
  rationale: נפש在此与死亡和阴间相对，主要指人的生命或本人；“性命”比现代汉语“灵魂”更少引入身魂二分的特定理解，同时保留“自己”这一反身关系。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 直译“从……手中”，表达脱离其掌控；“阴间的手”保留拟人化的诗歌意象。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 以汉语圣经语境中较成熟的对应词表达死者所在之域，不译作“地狱”，以免加入后期教义上的刑罚含义；注脚说明其含义及“坟墓”这一可选译法。
- source_word: סֶלָה
  choice: 细拉
  rationale: 原词确切功能不明，沿用音译，避免作无根据的解释性翻译。
theological_decisions:
- issue: שְׁאוֹל的含义
  choice: 译作“阴间”，指死者所在之域
  alternative: 坟墓；音译“示奥尔”
  rationale: 上下文强调人人都会死亡、无人能摆脱שְׁאוֹל的权势。“阴间”可自然表达这一古希伯来概念，同时不将其等同于“地狱”；注脚保留其他理解。
- issue: נַפְשׁוֹ是否译作“灵魂”
  choice: 自己的性命
  alternative: 自己的灵魂；自己
  rationale: נפש语义可涵盖生命、本人或魂。此处“救……脱离阴间的手”首先关乎逃脱死亡，故正文采用“性命”，并在注脚保留语义宽度，避免断定特定的人论结构。
- issue: גֶבֶר的代表性阳性表达
  choice: 在反问中译作“有谁”
  alternative: 哪个男人；什么人
  rationale: 原词为阳性名词，但诗句论及普遍的人类必死性。汉语“有谁”既准确呈现代表性反问，又不把范围误限为男性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留两重反问、“见死亡”“阴间的手”等诗性意象。将“细拉”置于注脚标记之前，使三个标记明确对应全节中的词语说明。
