  yaml_path: translation/ot/psalms/089/020.yaml
  text: I have found David my servant[a]; with my holy oil I have anointed him.
translation:
  language: zh_hans
  text: 我已找到我的仆人大卫[a]；我已用我的圣油膏立了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我找到了我的仆人大卫；我用我的圣油膏立了他。”希伯来语的完成式在中文中也可用一般过去的完成性说法表达。
    reason: 保留希伯来语完成式可译为“已……”或以一般过去完成事件来表达的可能性。
lexical_decisions:
- source_word: מָצָאתִי
  choice: 我已找到
  rationale: 这是מצא的Qal完成式第一人称单数。译作“已找到”既表达行动已经完成，也保留这项行动对当前立约宣告仍有意义的语感。
- source_word: דָּוִד
  choice: 大卫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: עַבְדִּי
  choice: 我的仆人大卫
  rationale: עבד既可指仆人，也可指奴隶；此处是大卫作为受上帝拣选之王的尊荣性立约称谓，因此译作“仆人”，不突出受奴役的身份。
- source_word: בְּשֶׁמֶן קָדְשִׁי
  choice: 用我的圣油
  rationale: 介词ב在膏抹语境中表示所用的媒介，中文自然译为“用”；קדשׁי表示归上帝为圣、分别出来，译作“我的圣油”准确而简洁。
- source_word: מְשַׁחְתִּיו
  choice: 我已……膏立了他
  rationale: 这是משׁח的Qal完成式第一人称单数，带第三人称阳性单数宾语后缀。“膏立”在中文中清楚表达以油膏抹并授予王职；“已”与前句呼应，体现行动已经完成。
theological_decisions:
- issue: 君王受膏的措辞及其可能具有的弥赛亚意义
  choice: 按经文直接所指，保留大卫受上帝膏立的历史陈述，不加入“弥赛亚”或“受膏者”等称号。
  alternative: 采用解释性译法，明确突出弥赛亚或受膏者的预表意义。
  rationale: 本节直接点名大卫。整篇诗在基督教诠释中可以具有预表意义，但译文不应加入希伯来文本本节没有明说的称号或教义结论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“膏立”比单用“膏”更便于普通读者理解王权委任的语境，同时没有增添具体职衔。两个“已”形成平衡的诗句，并保留完成行动具有当前意义的语感。
