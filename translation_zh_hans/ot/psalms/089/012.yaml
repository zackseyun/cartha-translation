  text: צָפ֣וֹן וְ֭/יָמִין אַתָּ֣ה בְרָאתָ֑/ם תָּב֥וֹר וְ֝/חֶרְמ֗וֹן בְּ/שִׁמְ/ךָ֥ יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/012.yaml
  text: The north and the south—you created them[b][a]; Tabor and Hermon sing for joy in your name.
translation:
  language: zh_hans
  text: 北方和南方，是你所创造的[a]；他泊山和黑门山奉你的名欢唱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“北方和右边，是你所创造的。”这里的“右边”很可能是表示“南方”的地理用语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“奉你的名欢呼。”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוֹן
  choice: 北方
  rationale: 该词通常指北方或北部地区；这里与יָמִין配对，构成涵盖地域两端的诗歌表达，因此采用方向意义。
- source_word: יָמִין
  choice: 南方
  rationale: 该词本义为“右手、右边”，但按古代面向东方的方位表达，可指“南方”；与“北方”并列时，这一地理意义最符合上下文。脚注保留字面译法。
- source_word: בְרָאתָם
  choice: 都是你创造的
  rationale: 这是Qal完成式第二人称阳性单数，带第三人称阳性复数后缀；译文明确表达北方和南方同为上帝所造。
- source_word: תָּבוֹר
  choice: 他泊山
  rationale: 这是地名Tabor；采用现代中文圣经地名的通行音译，并加“山”帮助普通读者识别所指。
- source_word: חֶרְמוֹן
  choice: 黑门山
  rationale: 这是地名Hermon；采用现代中文圣经地名的通行音译，并加“山”说明所指。
- source_word: בְּשִׁמְךָ
  choice: 因你的名
  rationale: 介词בְּ在此可表示凭借、缘由或所处范围；“因你的名”自然地传达欢欣与上帝所启示的身份和声誉相关，同时不把语义限定得过窄。
- source_word: יְרַנֵּנוּ
  choice: 欢唱
  rationale: רנן的Piel形表达响亮的喜乐呼声，可指欢唱或欢呼；“欢唱”适合诗篇中群山拟人赞美的意象，脚注保留“欢呼”这一可能译法。
theological_decisions:
- issue: יָמִין与צָפוֹן并列时的解释
  choice: 按方位合称译为“北方和南方”
  alternative: 按字面译为“北方和右边”
  rationale: 本节颂扬上帝创造广阔世界，随后列举两座山；将יָמִין理解为地理意义上的“南方”，既保存诗句涵盖两端的修辞，也避免字面直译造成意义晦涩。
- issue: 他泊山和黑门山的拟人化
  choice: 保留群山亲自“欢唱”的诗歌拟人
  alternative: 解释为山中或周围的居民欢唱
  rationale: 两个地名共同作复数动词的主语，而诗篇常描写受造界赞美上帝；因此不把这一意象改写为居民的行动。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“都是你创造的”清楚呈现复数宾语关系；“欢唱”保留诗歌节奏和群山拟人意象。地名使用简体中文读者较熟悉的“他泊山、黑门山”。
