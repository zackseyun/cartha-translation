source:
  edition: WLC
  text: אֵ֣ל נַ֭עֲרָץ בְּ/סוֹד קְדֹשִׁ֣ים רַבָּ֑ה וְ֝/נוֹרָ֗א עַל כָּל סְבִיבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/007.yaml
  text: God is greatly feared in the council of the holy ones[b][a], and awesome above all who surround him.
translation:
  language: zh_hans
  text: 神在圣者的议事会中深受敬畏[a][b]；他比所有环绕他的众者更为可畏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“集会”；该希伯来词可指亲密的议事团体或商议性的集会。
    reason: lexical_alternative
  - marker: b
    text: 这里的“圣者”很可能指天上的众存在，而不是人间的圣徒。
    reason: cultural_note
lexical_decisions:
- source_word: אֵל
  choice: 神
  rationale: 此处指以色列的神，而非泛指某个神明；“神”自然、庄重。
- source_word: נַעֲרָץ ... רַבָּה
  choice: 大受敬畏
  rationale: נַעֲרָץ 表示被人以敬畏甚至惧怕之心看待，רַבָּה 在此加强程度；“大受敬畏”保留被动含义及敬惧色彩。
- source_word: בְּסוֹד
  choice: 在……议会中
  rationale: סוֹד 可指亲密的议事圈或集会；上下文较可能描写天上的议会。“议会”保留商议性，同时不将其解释得过满。
- source_word: קְדֹשִׁים
  choice: 圣者
  rationale: 直译为“圣洁者们”；此处很可能指天上的众存在。“圣者”不直接限定其身份，也避免“圣徒”通常引发的人类信徒联想。
- source_word: וְנוֹרָא
  choice: 更为可畏
  rationale: נוֹרָא 指令人敬畏、令人惧怕；结合 עַל 的比较意味译作“更为可畏”，与下句的比较结构相合。
- source_word: עַל כָּל סְבִיבָיו
  choice: 比一切环绕他的
  rationale: עַל 在此最自然地表达比较或超越；סְבִיבָיו 可统指在神周围的众者，中文保留“一切”的宽泛形式及原文未明说的名词。
theological_decisions:
- issue: “圣者”及环绕神者的身份
  choice: 正文保留“圣者”的宽泛称呼，注释说明较可能指天上的众存在
  alternative: 人间的圣徒，或由天上与人间敬拜者组成的群体
  rationale: 本诗相邻经文谈到诸天和“神的众子”，因此天上议会的理解最合语境；但原文仅称“圣者”，正文不把推断直接写死。
- issue: 神在议会中“大受敬畏”的含义
  choice: 保留敬畏与惧怕并存的张力
  alternative: 仅译为“备受尊崇”或“令人赞叹”
  rationale: נַעֲרָץ 与 נוֹרָא 都包含畏惧成分；弱化为单纯尊崇会损失原文的威严与震慑力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“议会”呈现天上议事群体的语境；“大受敬畏／更为可畏”维持两行平行及敬惧语气。脚注标记按先词义、后身份说明的顺序置于相关短语之后。
