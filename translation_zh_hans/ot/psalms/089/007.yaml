  to: 神在圣者的议事会中深受敬畏[a][b]；他比所有环绕他的众者更为可畏。
  rationale: 修订仅改善现代汉语的句法和搭配：“议事会”体现 סוֹד 的议事性而不等同于现代政治议会；“深受敬畏”保留被动及程度加强；“众者”使第二行完整地表达环绕神者这一原文隐含的对象。脚注保留“圣者”可能指天上存在的说明，同时不在正文中过度限定。
