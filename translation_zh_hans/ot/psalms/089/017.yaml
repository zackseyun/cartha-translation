  text: כִּֽי תִפְאֶ֣רֶת עֻזָּ֣/מוֹ אָ֑תָּה וּ֝/בִ/רְצֹנְ/ךָ֗ תרים קַרְנֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/017.yaml
  text: For you are the glory of their strength[b][a], and by your favor you exalt our horn.
translation:
  language: zh_hans
  text: 因为你是他们力量的荣耀[a]；因你的恩宠，我们的角得以高举[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”也可译作“荣美”或“华美”。
    reason: lexical_alternative
  - marker: b
    text: “角”是希伯来诗歌中的比喻，可表示力量、权势、尊荣或高升的地位。此处马所拉书写形式可理解为“你高举我们的角”；诵读传统则作“我们的角得以高举”。
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明原因；现代汉语中“因为”清楚自然。
- source_word: תִפְאֶרֶת
  choice: 荣耀
  rationale: 该词可指荣美、华美或荣耀；这里译为“荣耀”，既表达其尊荣，也保留“他们的力量以神为荣耀”的诗性张力。
- source_word: עֻזָּמוֹ
  choice: 他们的力量
  rationale: 名词意为力量、能力，后缀为第三人称阳性复数；据此保留“他们”，不与后半句的“我们”调和。
- source_word: אָתָּה
  choice: 你是
  rationale: 独立代词具有强调作用，并在名词句中作表语主语；汉语补出“是”以使句意明晰。
- source_word: וּבִרְצֹנְךָ
  choice: 因你的恩宠
  rationale: רָצוֹן 在此指恩惠、悦纳或善意；介词可表达凭借或原因。“因你的恩宠”自然地突出神的惠顾。
- source_word: תרים
  choice: 必被高举
  rationale: 马所拉经文书写形式 תרים 在无元音时可有分析空间；WLC 的附注显示此处存在书写与诵读问题。按诗句语境及传统理解表达“高举”，并以被动式与“我们的角”搭配；相关文本问题列入脚注。
- source_word: קַרְנֵנוּ
  choice: 我们的角
  rationale: 直译为“我们的角”，是希伯来诗歌中表示力量、尊荣或地位高升的惯用比喻；正文保留意象，脚注解释。
theological_decisions:
- issue: “角”的比喻意义
  choice: 正文保留“我们的角”
  alternative: 我们的力量／权势／尊荣
  rationale: 保留希伯来诗歌的鲜明意象，不在正文中把其丰富含义限定为单一解释，并用脚注帮助现代读者理解。
- issue: “他们”与“我们”的人称转换
  choice: 保留“他们的力量……我们的角”
  alternative: 将两处统一译为“我们的”
  rationale: 原文确有第三人称复数到第一人称复数的转换；不为求顺畅而消除这一真实张力。
- issue: תרים 的文本与语态
  choice: 译作“必被高举”，并注明抄本传统问题
  alternative: 你高举
  rationale: WLC 所示形式及马所拉旁注涉及读法问题；正文采用符合语境的传统理解，但不掩盖原文证据中的歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留诗歌意象及原文人称转换；分号呈现两小句的紧密平行关系。
