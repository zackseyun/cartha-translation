  text: כִּֽי אָמַ֗רְתִּי ע֭וֹלָם חֶ֣סֶד יִבָּנֶ֑ה שָׁמַ֓יִם תָּכִ֖ן אֱמוּנָתְ/ךָ֣ בָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/002.yaml
  text: For I said[a], “Steadfast love will be built up forever; in the heavens you will establish your faithfulness.”
translation:
  language: zh_hans
  text: 因为我曾说：“慈爱必被建造起来，直到永远[a]；你必在诸天中坚立你的信实。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“慈爱必永远建立。”希伯来语动词既可直译为“建造”，也可较概括地译为“建立”；正文保留了建筑的诗歌意象。
    reason: 词义备选
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 保留该词在语篇中引出理由或说明的作用；此处用“因为”自然承接上文。
- source_word: אָמַרְתִּי
  choice: 我曾说
  rationale: 对应第一人称单数完成式，表达诗人已经说出或认定的宣告，同时不强化为“我宣告”。
- source_word: עוֹלָם
  choice: 永远
  rationale: 在本句中作时间副词，简明表达持续无尽之意。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: “慈爱”在现代中文圣经语体中兼含恩慈、眷爱和忠贞，不将其过度限定为单纯情感、怜悯或专门术语“盟约之爱”。
- source_word: יִבָּנֶה
  choice: 建造起来
  rationale: 该词是בנה的尼法勒未完成式；译文保留被建造的建筑意象及面向将来的诗性断言，而不直接将其平化为“建立”。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 以凝练而庄重的中文反映希伯来语的复数形式及诗歌语域。
- source_word: תָּכִן
  choice: 你必……坚立
  rationale: 使役形式表示使之稳固、确立；“坚立”既体现稳固含义，也与前半句的建造意象相呼应。
- source_word: אֱמוּנָתְךָ
  choice: 你的信实
  rationale: 该名词指坚定、可靠和忠信；“信实”准确而自然地表达这里所称颂的上帝属性。
- source_word: בָהֶם
  choice: 在诸天之中
  rationale: 复数代词回指“诸天”；中文明确重述其先行词，使指代清楚，同时保留“在其中”的空间表达。
theological_decisions:
- issue: חֶסֶד在盟约诗歌语境中的含义
  choice: 慈爱
  alternative: 盟约之爱；怜悯；忠贞之爱
  rationale: “慈爱”保留恩爱与忠诚并存的丰富含义，却不把该词收窄为某一项教义术语或仅仅怜悯。
- issue: 下半句是否直接称呼上帝
  choice: 按第二人称直呼：“你必……坚立你的信实”
  alternative: 采用无人称表达：“信实必在天上坚立”
  rationale: 动词的第二人称阳性单数形式及名词后的第二人称后缀都清楚支持直接称呼上帝。
- issue: “信实”与“诸天”的关系
  choice: 你在诸天之中坚立你的信实
  alternative: 你的信实像诸天一样坚立；你建立诸天和你的信实
  rationale: בָהֶם最自然地回指前置的“诸天”，译文保留其地点关系，不额外引入比较或并列宾语。
translation_notes:
  register: 采用现代、庄重而可懂的诗歌语言。“建造起来”有意保留原文将抽象的“慈爱”描写为建筑物的张力；“诸天”保持诗体的凝练感。脚注标记紧随相关动词意象，而非置于“我曾说”之后，以清楚标示注释对象。
