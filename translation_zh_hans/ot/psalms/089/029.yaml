  text: וְ/שַׂמְתִּ֣י לָ/עַ֣ד זַרְע֑/וֹ וְ֝/כִסְא֗/וֹ כִּ/ימֵ֥י שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/029.yaml
  text: I will establish his offspring forever[a], and his throne as the days of heaven.
translation:
  language: zh_hans
  text: 我要使他的后裔永远长存，他的宝座也如天之久。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译：“他的宝座与天同久。”
    reason: 原文כִּימֵי שָׁמָיִם直译近于“如天的日子”，这里表达与天一样长久；脚注提供较为意译的中文说法。
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: 我要使……长存
  rationale: שׂים的基本义是“放置、设立”；在王朝应许的语境中，与“永远”连用，表达使其后裔得以确立并持续存留。译作“使……长存”符合现代汉语，也保留应许的延续意味。
- source_word: לָעַד
  choice: 永远
  rationale: לָעַד表示持续到永久；“永远”简明、自然，并准确传达诗句强烈的恒久性。
- source_word: זַרְעוֹ
  choice: 他的后裔
  rationale: זֶרַע可指“种子”，也可集合性地指后代。“后裔”在中文中既自然，又保留大卫之约语境中的集合含义，不限定为某一个或多个具体人物。
- source_word: וְכִסְאוֹ
  choice: 他的宝座也
  rationale: כִּסֵּא直指“宝座”，在上下文中代指大卫王系的王权；“也”自然承接前一分句。
- source_word: כִּימֵי שָׁמָיִם
  choice: 如天之久
  rationale: כְּ表示比较，יְמֵי שָׁמַיִם字面是“天的日子”。“如天之久”以凝练、庄重的中文保留比较意象及持续时间的含义，避免生硬直译为“如天的日子”。
theological_decisions:
- issue: 大卫之约应许中的恒久性语言
  choice: 保留“永远”及“如天之久”的强烈恒久表达，不对其实现方式作解释
  alternative: 译成“世世代代”或明确解释为“只要诸天仍然存在”
  rationale: 原文以诗性的永久语言陈述应许。译文应保留其力度及神学张力，不预先限定为某种王朝、末世或弥赛亚解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“如天之久”略带诗性，以对应希伯来文的宇宙性比喻；避免使用较古奥的“苗裔”“穹苍”或带特定教义解释的扩译。
