  text: הִ֭קְצַרְתָּ יְמֵ֣י עֲלוּמָ֑י/ו הֶֽעֱטִ֨יתָ עָלָ֖י/ו בּוּשָׁ֣ה סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/045.yaml
  text: You have shortened the days of his youth; you have covered him with shame[a]. Selah
translation:
  language: zh_hans
  text: '你缩短了他青春的年日；

    你使他披上羞耻[a]。细拉'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你使羞耻遮盖他。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְצַרְתָּ
  choice: 你缩短了
  rationale: 该词是קצר的使役形完成式，意为“使……变短、缩短”。译作“你缩短了”直接、自然，并保留已经施行之行动的语气。
- source_word: יְמֵי
  choice: 年日
  rationale: 该词为“日子”的复数附属形式，可指一段人生时期。“年日”既保留希伯来诗歌的表达，也符合现代汉语的庄重语体。
- source_word: עֲלוּמָיו
  choice: 他青春的
  rationale: 该名词指青春或青年时期；与“年日”组合为“他青春的年日”，贴近原文，同时不把意思扩展为“精力”或“壮年”。
- source_word: הֶעֱטִיתָ
  choice: 你使……披上
  rationale: עטה的使役形可表示使某物覆盖、包裹或披在某人身上。与“羞耻”搭配时，“使他披上羞耻”保留原文鲜明的衣着意象。
- source_word: עָלָיו
  choice: 他
  rationale: 该介词短语直译为“在他身上”。汉语“使他披上”已自然包含施加在他身上的关系，未省略其意义。
- source_word: בּוּשָׁה
  choice: 羞耻
  rationale: 该词表示羞耻、耻辱。“羞耻”是基本且清晰的对应词，并适合此处诗歌语境。
- source_word: סֶלָה
  choice: 细拉
  rationale: 这是含义未能确定的礼仪或音乐术语，采用传统音译“细拉”，避免对其功能作无根据的解释。
theological_decisions:
- issue: “他的青春”和施加羞耻对象中的第三人称单数所指
  choice: 保留阳性单数代词“他”，不明确指定所指对象。
  alternative: 将所指明确解释为大卫家的君王，或人格化的大卫王朝／受膏者。
  rationale: 上下文指向受辱的受膏君王或王朝，但本节只使用阳性单数后缀，并未再次明说其身份。保留“他”可维持原文的诗意与所指张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。分行体现希伯来诗歌的平行结构；“青春的年日”保留原文表达，“披上羞耻”保留עטה的衣着意象。脚注标记[a]已置于正文对应位置。
