  text: אַ֭חַת נִשְׁבַּ֣עְתִּי בְ/קָדְשִׁ֑/י אִֽם לְ/דָוִ֥ד אֲכַזֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/035.yaml
  text: Once I have sworn by my holiness[b][a]; I will not lie to David.
translation:
  language: zh_hans
  text: 我曾一次凭自己的圣洁起誓[a]：我绝不向大卫说谎。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我曾一次而永远地凭自己的圣洁起誓”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“若我向大卫说谎……”。这是誓言用语，意思是“我绝不向大卫说谎”，也可理解为“我绝不对大卫失信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: 郑重
  rationale: 此词在誓言语境中强调一次作出、确定不移的宣誓；汉语以“郑重起誓”自然表达其决定性，关于“一次／永远一次”的字面色彩留在脚注说明。
- source_word: נִשְׁבַּעְתִּי
  choice: 起誓
  rationale: נפעל词形在此意为“宣誓、起誓”。汉语不强制标明完成时，语境已表明这是已经作出并持续有效的誓言。
- source_word: בְקָדְשִׁי
  choice: 凭自己的圣洁
  rationale: 介词 בְּ 表明起誓所凭的保证；“自己的圣洁”准确保留神以自身圣洁为誓言凭据的含义。
- source_word: אִם
  choice: 绝不
  rationale: 在誓言之后，אִם 构成省略式的否定誓词，字面为“若我……”，实际语力是“我绝不……”。现代汉语宜明示这一否定。
- source_word: לְדָוִד
  choice: 向大卫
  rationale: לְ 标示虚假言语所针对的对象；“向大卫”符合现代汉语表达。
- source_word: אֲכַזֵּב
  choice: 说谎
  rationale: כזב 的此词形可指说假话或不守承诺；“说谎”直接保留人格性的道德力度，同时不把经文扩写为特定的盟约解释。
theological_decisions:
- issue: 如何表达省略式的神圣誓言而不增添希伯来文未明说的内容
  choice: 我绝不向大卫说谎
  alternative: 若我向大卫说谎……
  rationale: 原文 אִם 在誓言公式中以未说出的惩罚后果表达强烈否定。正文明确译出实际语义，脚注保留其字面结构与可能的“失信”含义，既易懂又不消除原文修辞。
- issue: 神以何者起誓
  choice: 凭自己的圣洁
  alternative: 凭我的圣所／凭我的圣者
  rationale: בְקָדְשִׁי 在此最自然地指神自己的圣洁，是誓言的凭据；其他解释在当前上下文中可能性较低。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“郑重起誓”传达誓言确定不移的语力；正文以“绝不”明示希伯来誓言公式隐含的否定，脚注保留字面形式及“失信”的语义可能。所有脚注标记均置于正文相应位置。
