  text: אֱֽלֹהִ֗ים שִׁ֣יר חָ֭דָשׁ אָשִׁ֣ירָה לָּ֑/ךְ בְּ/נֵ֥בֶל עָ֝שׂ֗וֹר אֲזַמְּרָה לָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/009.yaml
  text: O God[a], I will sing a new song to you; on a ten-stringed harp I will make music to you.
translation:
  language: zh_hans
  text: 上帝啊，我要向你唱一首新歌；我要用十弦琴[a]向你奏乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用十弦的弦乐器”；נֵבֶל所指的古代乐器究竟是哪一种，不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处是直接呼告；“啊”自然表达希伯来诗歌中的呼语语气，并未增添实质内容。
- source_word: שִׁיר חָדָשׁ
  choice: 一首新歌
  rationale: 直接保留诗篇中“新歌”的固定意象，现代汉语也自然清楚。
- source_word: אָשִׁירָה
  choice: 我要唱
  rationale: 第一人称祈愿式在这里表达意愿和决心；“我要唱”比单纯“我唱”更能体现其意志色彩。
- source_word: לָּךְ
  choice: 向你
  rationale: 介词指明赞美和歌唱的对象；汉语中“向你唱”与“向你奏乐”自然贴切。
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: 用十弦琴
  rationale: נֵבֶל所指古代弦乐器的确切形制不明；“琴”可概括弦乐器而避免武断确定为竖琴或琵琶，“用”准确表达伴随或凭借乐器演奏。
- source_word: אֲזַמְּרָה
  choice: 我要奏乐
  rationale: 该动词可指歌唱赞美或演奏音乐；因本句明确提到乐器，“奏乐”在汉语中最自然，并与前面的“唱”形成诗意对应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；保留原文两行中“我要……向你……”的平行结构，并以“唱”与“奏乐”区分声乐和器乐表达。
