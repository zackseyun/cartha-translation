  text: הַ/נּוֹתֵ֥ן תְּשׁוּעָ֗ה לַ/מְּלָ֫כִ֥ים הַ֭/פּוֹצֶה אֶת דָּוִ֥ד עַבְדּ֗/וֹ מֵ/חֶ֥רֶב רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/010.yaml
  text: the one who gives salvation to kings[b][a], who rescues David his servant from the evil sword.
translation:
  language: zh_hans
  text: 就是那位赐君王救恩[a]、救他的仆人大卫脱离凶恶的刀剑[b]的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救恩”或译“解救”或“胜利”。
    reason: lexical_alternative
  - marker: b
    text: 或译“致命的刀剑”。希伯来文直译为“凶恶的刀剑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: 那位赐……的
  rationale: 带冠词的Qal主动分词作名词性用法，指向上帝；用“那位……的”保留原文的分词结构，而不改写为普通限定动词。
- source_word: תְּשׁוּעָה
  choice: 救恩
  rationale: 该名词可指拯救、解救或战场上的胜利。“救恩”保留上帝施行拯救的广度和神学分量，脚注注明本节军事语境中可能的译法。
- source_word: לַמְּלָכִים
  choice: 赐君王
  rationale: 介词ל标明接受者；汉语以“赐君王救恩”自然表达“把救恩赐给君王”。
- source_word: הַפּוֹצֶה
  choice: 救……脱离
  rationale: 该分词在此表示营救、解救；“救……脱离”既符合现代汉语，也清楚表达从危险中获救。
- source_word: אֶת דָּוִד
  choice: 大卫
  rationale: אֶת为直接宾语标记；דָּוִד采用现代中文圣经传统通行人名“大卫”。
- source_word: עַבְדּוֹ
  choice: 他的仆人
  rationale: עבד可指奴仆或仆人；这里是大卫在上帝面前的王室及盟约性称谓，“仆人”自然且不额外强化受奴役的含义。
- source_word: מֵחֶרֶב
  choice: 脱离……刀剑
  rationale: 介词מן表示从危险中脱离；“刀剑”在汉语中可代表武力、战争或致命攻击。
- source_word: רָעָה
  choice: 凶恶
  rationale: 形容词字面义为“恶的、坏的”；修饰刀剑时兼有邪恶、凶险和致命的意味。“凶恶”保留原文措辞及其可能的道德与毁灭性含义。
theological_decisions:
- issue: 王室及军事语境中תְּשׁוּעָה的范围
  choice: 救恩
  alternative: 解救；胜利
  rationale: 上下文涉及君王以及大卫从刀剑下获救，显然带有军事色彩；但该希伯来词的意义不限于战场胜利。“救恩”保留较广的拯救内涵，脚注呈现较窄的语境性译法。
- issue: 大卫称为עַבְדּוֹ
  choice: 他的仆人
  alternative: 他的奴仆
  rationale: 这里主要表达大卫对上帝的归属与事奉，是常见的王室和盟约称谓；“仆人”避免无根据地突出受奴役的社会身份。
- issue: “凶恶刀剑”的意义张力
  choice: 正文保留“凶恶”，脚注提供“致命”
  alternative: 直接译为“致命的刀剑”
  rationale: 原文רָעָה直译为“恶的、坏的”，在此也可指造成伤害或死亡。正文保留字面及道德色彩，脚注说明语境中的结果性理解，不将歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那位……的”保留本节承接上文的名词性分词结构；“赐君王救恩”较凝练，符合诗歌语体。正文中的[a]、[b]分别紧随所说明的词语。
