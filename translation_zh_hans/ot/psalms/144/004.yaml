  yaml_path: translation/ot/psalms/144/004.yaml
  text: Man is like a breath[b][a]; his days are like a passing shadow.
translation:
  language: zh_hans
  text: 人像一口气[a]；他的年日如同掠过的影子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一口气”所译的希伯来语也可译作“雾气”“虚空”或“虚幻”，在这里突出人的短暂和虚渺。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: 人
  rationale: 此处泛指人类或世人，以单数“人”保留希伯来诗句的概括性和后文单数领属形式，同时符合现代汉语表达。
- source_word: לַהֶבֶל
  choice: 不过像一口气
  rationale: הֶבֶל的具体意象是气息、雾气，进而表达短暂无常和虚幻无实；“一口气”保留可感的比喻。“不过”自然传达人之微不足道，但不把词义限定为道德性的“虚空”。
- source_word: דָּמָה
  choice: 像
  rationale: 该动词表示“相像、类似”；“像”简洁自然，并保留明喻。
- source_word: יָמָיו
  choice: 他的年日
  rationale: 保留原文第三人称单数领属关系；“年日”在庄重的诗体中文中自然地指人的一生时日。
- source_word: כְצֵל
  choice: 如同……影子
  rationale: 保留כְ所引出的明喻和צֵל的诗歌意象。
- source_word: עוֹבֵר
  choice: 掠过的
  rationale: 分词描绘正在经过、随即消逝的动态；“掠过”比单纯“逝去”更能保留影子移动而过的画面。
