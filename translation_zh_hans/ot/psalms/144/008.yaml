  text: whose mouth speaks emptiness[b][a], and whose right hand is a right hand of falsehood.
translation:
  language: zh_hans
  text: 他们的口说虚妄的话[a]；他们的右手是诡诈的右手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚妄”也可译作“虚假”；原词可表示空虚、虚妄或欺骗。
    reason: lexical_alternative
  - marker: b
    text: 原文重复“右手……右手”以加强语气。右手常象征起誓、力量或所作的保证，因此“诡诈的右手”可暗示背信或欺骗；原文并未限定其具体所指。
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 他们的……
  rationale: 承接上一节所说的外邦人，引出描述其特征的关系从句；汉语以“他们的口……他们的右手……”自然表达。
- source_word: פִּיהֶם
  choice: 他们的口
  rationale: 保留希伯来语单数名词加第三人称复数词尾的集体表达。
- source_word: דִּבֶּר
  choice: 说
  rationale: 完成式在此描述惯常特征，现代汉语用一般时态“说”最自然。
- source_word: שָׁוְא
  choice: 虚妄的话
  rationale: שָׁוְא可指空虚、虚妄、虚假或欺骗；“虚妄的话”既通顺，又保留其语义宽度，不与下半句的“虚假”完全等同。
- source_word: וִימִינָם
  choice: 他们的右手
  rationale: 开启平行的第二分句，并明确复数所指。
- source_word: יְמִין
  choice: 右手
  rationale: 保留原文“右手……右手”的刻意重复和强调。
- source_word: שָׁקֶר
  choice: 虚假
  rationale: 表达谎假、欺骗的性质，并使“虚假的右手”保持原文抽象而富象征性的说法。
theological_decisions:
- issue: “右手”的象征含义
  choice: 正文保留“他们的右手是虚假的右手”，不在译文中限定其具体所指。
  alternative: 意译为“他们起假誓”或“他们行事诡诈”。
  rationale: 右手可能涉及起誓、能力或所作的保证；原文未明确限定，故保留其神学与文化意象，并在脚注说明可能含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留两个平行分句以及“右手”的重复；以“虚妄的话”避免生硬的“说虚妄”，同时不将שָׁוְא过度限定为单纯的谎言。
