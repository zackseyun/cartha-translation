base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/005.yaml
  text: O Yahweh[a], bend your heavens and come down[b]; touch the mountains so that they smoke.
translation:
  language: zh_hans
  text: 耶和华啊，求你使你的诸天低垂，降临；触摸群山，使它们冒烟。〔a〕
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代中文最通行的圣名音译“耶和华”表达四字神名，并用“啊”体现直接呼求；不以称号代替专名。
- source_word: הַט שָׁמֶיךָ
  choice: 求你使诸天低垂
  rationale: הַט是命令式，有“使……倾斜、低下”之意；“使诸天低垂”既保留向下弯垂的诗性画面，也符合中文祈求语气。第二人称所属在中文中由“你使”自然体现，避免生硬的“你的诸天”。
- source_word: וְתֵרֵד
  choice: 亲自降临
  rationale: 字面为“并且下来”。在向上帝发出的诗性呼求中，“降临”自然庄重；“亲自”显明主语仍是耶和华，但不增添新的行动内容。
- source_word: גַּע בֶּהָרִים
  choice: 求你触摸群山
  rationale: נגע通常指“触摸、碰触”，不强化为“击打”；“群山”自然表达带定冠词的复数הָרִים，并保留神显场景的宏阔感。
- source_word: וְיֶעֱשָׁנוּ
  choice: 使山冒烟
  rationale: 该未完成式承接命令语气，可表达触摸所产生的结果，也可能带意愿色彩。“使山冒烟”在中文中简洁呈现结果关系；“山”补明复数后缀所指，避免代词歧义。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名，正文保留专名而不替换为“主”。“耶和华”是现代简体中文读者最熟悉、最易识别的音译；“雅威”更接近学界常见的拟音，但不宜据不确定的古代发音排除传统通行形式。
- issue: וְיֶעֱשָׁנוּ与前一命令的关系
  choice: 译作结果：“使山冒烟”
  alternative: 并愿群山冒烟／群山就会冒烟
  rationale: 承接“触摸群山”，该动词可理解为所导致的结果；译文呈现这种紧密关系，同时不将冒烟解释成任何特定的自然现象或审判教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留希伯来诗歌的呼求、平行结构与神显意象。两句均以“求你”起首，使连续的命令式在中文祷告语境中自然清楚；不另加脚注，因为正文已能准确表达主要读法，现有英文脚注标记与内容似有错位，不能据此移植。
