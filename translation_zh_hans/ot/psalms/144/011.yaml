  text: פְּצֵ֥/נִי וְ/הַצִּילֵ/נִי֮ מִ/יַּ֪ד בְּֽנֵי נֵ֫כָ֥ר אֲשֶׁ֣ר פִּ֭י/הֶם דִּבֶּר שָׁ֑וְא וִֽ֝/ימִינָ֗/ם יְמִ֣ין שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/011.yaml
  text: Rescue me and deliver me from the hand of foreigners[c][b][a], whose mouth speaks falsehood and whose right hand is a right hand of deceit.
translation:
  language: zh_hans
  text: 求你救我，搭救我脱离外族人[a]的手；他们口中说的是虚妄[b]，他们的右手是诡诈的右手[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“异族之子”；这是指外族人的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “虚妄”也可译为“虚假”或“虚空”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文重复“右手”：“他们的右手是诡诈的右手。”右手常象征能力、承诺或行动。
    reason: cultural_note
lexical_decisions:
- source_word: פְּצֵנִי
  choice: 求你救我
  rationale: פצה 的命令式带第一人称单数词尾，表达恳求释放或救援；加“求你”自然体现希伯来祈求语气。
- source_word: וְהַצִּילֵנִי
  choice: 搭救我
  rationale: נצל 的使役命令式意为夺回、解救；与“救我”并列，保留两个近义动词的诗歌平行。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 保留“手”的原文意象，表示权势或控制；现代汉语虽带经文语体，仍清楚易懂。
- source_word: בְּנֵי נֵכָר
  choice: 外族人
  rationale: 字面为“异族之子”，是指外族人的惯用表达；译作“外族人”自然，并避免生硬直译。
- source_word: פִּיהֶם דִּבֶּר שָׁוְא
  choice: 他们口中说虚妄的话
  rationale: שָׁוְא 可指虚空、虚妄或虚假；此处与 שֶׁקֶר 平行。“虚妄的话”保留其语义宽度，不把含义限缩为直接撒谎。
- source_word: וִימִינָם
  choice: 他们的右手
  rationale: 按原文保留“右手”的具体意象，并与下文重复形成强调。
- source_word: יְמִין שָׁקֶר
  choice: 虚假的右手
  rationale: 保留希伯来文“右手……右手”的重复；שֶׁקֶר 可指虚假、欺骗，此处用“虚假的”既自然，也不武断限定右手所象征的是誓约、权力还是行为。
theological_decisions:
- issue: “右手”意象的具体所指
  choice: 正文保留“右手”，不明确解释为权力、誓约或行动
  alternative: 直接译为“他们的行为尽是欺骗”或“他们起假誓”
  rationale: 原文意象可能涉及能力、承诺或行动，具体所指并不唯一；保留意象可维持诗句的神学与修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈求语体。“求你”呈现命令式在祷告中的恳求功能；保留“手”和重复的“右手”等希伯来意象。
