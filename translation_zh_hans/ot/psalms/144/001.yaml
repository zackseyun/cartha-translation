  text: לְ/דָוִ֨ד בָּ֘ר֤וּךְ יְהוָ֨ה צוּרִ֗/י הַֽ/מְלַמֵּ֣ד יָדַ֣/י לַ/קְרָ֑ב אֶ֝צְבְּעוֹתַ֗/י לַ/מִּלְחָמָֽה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/001.yaml
  text: Of David. Blessed be Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: zh_hans
  text: '大卫的诗[a]。


    愿雅威受称颂！他是我的磐石；


    他训练我的手争战，

    训练我的指头打仗。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 诗题也可译作“大卫所作”或“献给大卫”；希伯来语介词可表示作者、关联或奉献对象。
    reason: 保留诗题介词 לְ 的语义歧义。
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 诗题中的介词 לְ 可表示作者、归属或奉献对象。“大卫的诗”符合现代汉语诗篇标题的习惯，同时以脚注保留原文的多义性。
- source_word: בָּרוּךְ
  choice: 愿……受称颂
  rationale: 该被动分词在颂赞公式中构成祝颂式感叹。“愿……受称颂”自然地传达其礼仪语气，而不把它仅处理为静态描述。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: צוּרִי
  choice: 我的磐石
  rationale: 保留 צוּר 的具体岩石意象及其象征上帝稳固、保护的含义，避免直接释义为“避难所”。
- source_word: הַמְלַמֵּד
  choice: 他教
  rationale: 分词表达持续而具有特征性的行动；“教”简洁自然，并可同时支配下两行平行的军事动作。
- source_word: יָדַי
  choice: 我的手
  rationale: 保留原文身体部位的具体表达及诗歌意象。
- source_word: לַקְרָב
  choice: 争战
  rationale: קְרָב 指战斗、交战；“争战”在庄重诗体中简洁，并与下句形成平行。
- source_word: אֶצְבְּעוֹתַי
  choice: 我的指头
  rationale: 准确保留原文特指手指的细致意象，不泛化为“手”。
- source_word: לַמִּלְחָמָה
  choice: 打仗
  rationale: מִלְחָמָה 指战争；在“教我的指头……”这一结构中，“打仗”比抽象的“战争”更合乎现代汉语搭配，并与“争战”保持近义平行。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质；不用“主”这一称号替代，也不采用较晚形成的混合读音“耶和华”。
- issue: 上帝与军事行动的关系
  choice: 保留“教我的手争战，教我的指头打仗”的军事意象
  alternative: 弱化为赐力量、坚忍或属灵争战
  rationale: 希伯来文明确描写上帝训练诗人进行实际战斗。译文不将这一历史和神学张力抽象化或属灵化。
- issue: 诗题 לְדָוִד 的关系含义
  choice: 正文采用“大卫的诗”，脚注保留其他可能
  alternative: 大卫所作；献给大卫
  rationale: 介词 לְ 本身不能在此唯一确定作者、关联或奉献关系，因此不在正文中把作者身份说死。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。以短行保留希伯来平行结构；“手／指头”和“争战／打仗”的对应维持原文具体而有力的军事意象。
