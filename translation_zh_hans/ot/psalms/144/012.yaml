  text: אֲשֶׁ֤ר בָּנֵ֨י/נוּ כִּ/נְטִעִים֮ מְגֻדָּלִ֪ים בִּֽ/נְעוּרֵ֫י/הֶ֥ם בְּנוֹתֵ֥י/נוּ כְ/זָוִיֹּ֑ת מְ֝חֻטָּב֗וֹת תַּבְנִ֥ית הֵיכָֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/012.yaml
  text: May our sons be like well-grown plants in their youth[c][b][a], and our daughters like corner pillars carved in the pattern of a palace.
translation:
  language: zh_hans
  text: 愿我们的儿子在青春年华如茁壮长成的植物；我们的女儿如按宫殿样式雕琢的角柱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宫殿”也可译为“圣殿”或“宏伟厅堂”；希伯来语原词可指这些宏伟建筑。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 愿
  rationale: 该词本为关系词，但结合上文祈求及本节所描绘的福乐景象，此处用“愿”自然表达其祝愿语气，同时不把景象改写成确定事实。
- source_word: בָּנֵינוּ
  choice: 我们的儿子
  rationale: 准确保留“儿子”的性别所指，并与下句“我们的女儿”形成平行。
- source_word: כִּנְטִעִים מְגֻדָּלִים
  choice: 如茁壮成长的栽种
  rationale: נְטִעִים 指所栽种的植物，מְגֻדָּלִים 表示被培育长大或长得成熟；“茁壮成长的栽种”保留栽培意象，又符合现代汉语诗体。
- source_word: בִּנְעוּרֵיהֶם
  choice: 在青春年华
  rationale: 表达“在他们年轻的时候”，并使中文行文庄重自然。
- source_word: בְּנוֹתֵינוּ
  choice: 我们的女儿
  rationale: 忠实保留原文具体的亲属和性别称谓。
- source_word: כְזָוִיּוֹת
  choice: 如……角柱
  rationale: 该词基本义与“角、拐角”有关；在此建筑比喻中，“角柱”能较自然地表达位于建筑转角、兼具形制与美感的构件，但不将其误作通常意义上的“房角石”。
- source_word: מְחֻטָּבוֹת
  choice: 雕琢
  rationale: 该被动分词表示经砍削、凿刻而成；用于宫殿建筑意象时，“雕琢”比单纯“砍成”更贴切。
- source_word: תַּבְנִית
  choice: 式样
  rationale: 该词可指形制、样式或设计；“式样”简洁保留建筑造型之意。
- source_word: הֵיכָל
  choice: 宫殿
  rationale: 该词可指宫殿、圣殿或宏伟厅堂。本诗此处描绘家国兴盛，“宫殿”较契合上下文；“圣殿”的可能性以脚注保留。
theological_decisions:
- issue: הֵיכָל 在女儿的建筑比喻中指宫殿还是圣殿
  choice: 正文译作“宫殿”
  alternative: “圣殿”或“宏伟厅堂”
  rationale: 原词本身容许世俗与宗教建筑两种所指；紧邻语境集中描绘家庭和国家的繁荣，并无明确祭祀标记，因此正文采用“宫殿”，同时用脚注保留“圣殿”，避免排除真实的词义可能。
- issue: 本节开头 אֲשֶׁר 的句法功能
  choice: 译为祝愿语气“愿”
  alternative: 译作关系句“他们……”，与前文连接
  rationale: 希伯来语形式上是关系词，句法上可承接前文；但本段祷告语境使其带有祝愿色彩。中文用“愿”能自然呈现该语用功能，又不把福乐陈述处理为已经实现的事实。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体。“青春年华”与“茁壮成长”使农业比喻自然清楚；“角柱”保留原文较为凝练的建筑意象，不额外解释女儿所象征的美丽、尊贵或稳固，以免消解诗歌本身的开放性。
