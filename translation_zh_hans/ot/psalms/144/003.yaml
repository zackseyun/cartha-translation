base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/003.yaml
  text: O Yahweh[a], what is man that you know him[c][b], the son of man that you think of him?
translation:
  language: zh_hans
  text: 耶和华啊，人算什么，你竟认识他？人子算什么，你竟顾念他？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”原文直译为“人的儿子”，是泛指人的诗歌表达，尤其使人想到人的有限和脆弱；这里不是弥赛亚称号。
    reason: lexical_alternative
  - marker: b
    text: 本节与诗篇8:4的措辞十分相近。
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 直接译出神圣之名，并用“啊”体现呼格语气；这是现代中文圣经语体中自然、庄重且广为人知的表达。
- source_word: מָה אָדָם
  choice: 人算什么
  rationale: 保留反问句所表达的人之渺小；“人”在此为代表性单数，泛指人类。
- source_word: וַתֵּדָעֵהוּ
  choice: 你竟认识他
  rationale: 保留 ידע“认识”的基本词义；“竟”自然传达反问中的惊叹，却不把神的认识进一步解释成特定形式的眷顾。
- source_word: בֶּן אֱנוֹשׁ
  choice: 世人
  rationale: 该诗歌性短语泛指有死、脆弱的人，与前句“人”构成平行；译作“世人”既简洁自然，也避免在本处误读为专称。
- source_word: וַתְּחַשְּׁבֵהוּ
  choice: 你竟顾念他
  rationale: חשב在此指把某人放在心上、予以关注；“顾念”符合诗篇语域，并与上句“认识”形成有区别的平行表达。
theological_decisions:
- issue: 神圣之名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用现代中文读者最熟悉且庄重的音译“耶和华”，不以“主”替代专名。
- issue: אָדָם / בֶּן אֱנוֹשׁ 的泛指意义
  choice: 人……世人
  alternative: 人……人子
  rationale: 两者在这里以代表性单数泛指人类，第二个短语尤其突出人的有限与脆弱。译为“世人”保留泛指功能，避免把“人子”误解为本节中的弥赛亚专称。
- issue: 神对人的 דעה 与 חשב
  choice: 认识……顾念
  alternative: 留意……看重
  rationale: 保留两个动词之间的诗意张力：前者采用“认识”的词义核心，后者表达记挂与关注，不将二者合并成单一神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。两个平行问句均用“算什么……竟……”呈现惊叹和反问；保留单数代词“他”，以反映原文代表性单数。脚注标记均置于正文相关句末。
