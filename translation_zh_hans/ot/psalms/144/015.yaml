  yaml_path: translation/ot/psalms/144/015.yaml
  text: Blessed are the people for whom it is so[b][a]; blessed are the people whose God is Yahweh.
translation:
  language: zh_hans
  text: 境况如此的百姓有福了；以耶和华为他们的上帝的百姓有福了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是希伯来文上帝之名יהוה（YHWH）的传统中文译音，也常译作“雅威”。
    reason: translation_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是希伯来语祝福宣告的固定形式，表达处于可羡慕、蒙福的境况；“有福了”既庄重又符合现代中文《诗篇》的诗体表达。
- source_word: הָעָם
  choice: 人民
  rationale: עָם在这里指一个整体性的族群；“人民”比政治色彩较强的“国家”更贴合上下文。
- source_word: שֶׁכָּכָה לּוֹ
  choice: 这样蒙福的
  rationale: 字面近于“对他而言是这样”。这里回指前文所描绘的丰盛安稳景况；译为“这样蒙福的”使中文自然，并保留所指依赖上文的特点。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的形式音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: אֱלֹהָיו
  choice: 以上帝为……的
  rationale: 三单阳性后缀集合性地回指“人民”，意为“其上帝是”；中文用“以……为上帝”自然表达这种归属关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文保留专名而非译作“主”；“耶和华”是现代标准汉语圣经传统中最通行、最易识别的形式，脚注注明另一常见拟音。
- issue: 首句所指的范围
  choice: 保留“这样”对前文景况的概括指向
  alternative: 明确释为“享有这一切”
  rationale: שֶׁכָּכָה לּוֹ本身简略且依赖前文。正文不把它限定为某一种具体福分，以免消除原诗的概括性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并保留两句平行的祝福宣告。首句通过“这样”承接前文；句末助词“了”使“有福”具有宣告语气，而非仅作静态描述。
