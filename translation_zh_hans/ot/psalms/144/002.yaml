source:
  edition: WLC
  text: חַסְדִּ֥/י וּ/מְצוּדָתִ/י֮ מִשְׂגַּבִּ֪/י וּֽ/מְפַלְטִ֫/י לִ֥/י מָ֭גִנִּ/י וּ/ב֣/וֹ חָסִ֑יתִי הָ/רוֹדֵ֖ד עַמִּ֣/י תַחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/002.yaml
  text: My steadfast love and my fortress[a], my stronghold and my deliverer, my shield, and in him I take refuge[b], the one who subdues peoples under me.
translation:
  language: zh_hans
  text: 他是我的慈爱、我的堡垒，我的高台、我的救主，我的盾牌；我投靠他。他使我的百姓服在我以下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的百姓”：一些古译本作“万民”或“列邦”；诗篇18:47的平行经文也采用复数表达。
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְדִּי
  choice: 我的慈爱
  rationale: חֶסֶד可指坚定不移的爱、信实与怜悯；在一连串对上帝的称谓中，以“我的慈爱”自然地将其作为上帝的称号，同时保留诗篇常见的圣约之爱内涵。
- source_word: מְצוּדָתִי
  choice: 我的堡垒
  rationale: 指防御性的坚固处所；“堡垒”准确保留军事保护的意象。
- source_word: מִשְׂגַּבִּי
  choice: 我的高台
  rationale: 指高而安全、难以攻取的庇护之处；“高台”既保留高度意象，也与前面的“堡垒”有所区分。
- source_word: מְפַלְטִי לִי
  choice: 我的救主
  rationale: מְפַלְטִי是使人脱险者，לִי加强与诗人的切身关系。汉语若译成“为我的我的救主”会重复累赘，因此以“我的救主”自然表达整体含义。
- source_word: מָגִנִּי
  choice: 我的盾牌
  rationale: 直接保留军事性保护比喻。
- source_word: וּבוֹ חָסִיתִי
  choice: 我投靠他
  rationale: חסה意为寻求庇护、投靠。完成式可表示已经投靠或由过去延续至今的信赖；汉语“我投靠他”自然，并保留庇护意象而不泛化为“信靠”。
- source_word: הָרוֹדֵד
  choice: 他使……服在
  rationale: 该分词在此表示使人降服、置于统辖之下；“使……服在”适合君王语境，又不过度强化为暴力压服。
- source_word: עַמִּי
  choice: 我的百姓
  rationale: 马所拉文本的元音标注直接读作带第一人称单数后缀的“我的百姓”。正文依WLC保留这一读法，古译本所反映的“万民/列邦”另收入脚注。
- source_word: תַחְתָּי
  choice: 在我以下
  rationale: 直译为空间关系“在我之下”，在君王语境中表示处于其治理或权柄之下；“在我以下”保留原文比喻。
theological_decisions:
- issue: עַמִּי应译为“我的百姓”，还是按部分古译本及平行经文理解为“万民/列邦”
  choice: 我的百姓
  alternative: 万民（或列邦）
  rationale: WLC所据马所拉文本明确为“我的百姓”，故正文遵从原文首要原则。此语可表达上帝使君王自己的百姓归于其治理，并不必然表示压迫。部分古译本和诗篇18:47的平行措辞支持复数理解，因此以脚注保存真实的文本差异。
- issue: חַסְדִּי作为上帝称号应译为抽象名词还是人格化表达
  choice: 他是我的慈爱
  alternative: 他以慈爱待我／他是向我施慈爱的那一位
  rationale: 原文以名词直接列入上帝的称谓，不明确补出动作。译为“他是我的慈爱”保留诗歌张力及称号性质，避免解释性扩写。
- issue: חָסִיתִי的完成式应表达过去、现在完成还是持续状态
  choice: 我投靠他
  alternative: 我曾投靠他／我已经投靠他
  rationale: 希伯来语完成式在诗歌告白中可概括既成且持续的信赖关系。汉语无须强制标明时体；简洁的“我投靠他”保留一定时态开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“慈爱、堡垒、高台、救主、盾牌”形成紧凑的称谓排比；分号划分保护性称谓与个人投靠的告白。正文所有脚注标记均已对应列出。
