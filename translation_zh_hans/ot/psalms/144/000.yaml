  yaml_path: translation/ot/psalms/144/000.yaml
  text: Of David. Blessed is Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: zh_hans
  text: '大卫的诗。[a]


    我的磐石耶和华是当受颂赞的！

    他训练我的手争战，

    我的指头作战。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 诗题也可译作“为大卫而作”或“关于大卫”；希伯来文介词可表示作者身份、关联或献给。
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 当受颂赞的
  rationale: 该词在颂赞上帝的语境中表示配受称颂；译为“当受颂赞的”既保留敬拜语气，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中广为人知的专名形式，明确对应希伯来文四字神名。
- source_word: צוּרִי
  choice: 我的磐石
  rationale: 保留“磐石”的具体意象及其坚固、庇护的隐喻意义，不将其释义化为“保障”等抽象词。
- source_word: הַמְלַמֵּד
  choice: 教导／训练
  rationale: 分句中对“手”译为“教导”，对省略谓语的平行句补出“训练”，自然呈现希伯来诗歌的平行关系。
- source_word: לַקְרָב / לַמִּלְחָמָה
  choice: 争战／作战
  rationale: 两个近义词形成诗歌平行；用相近而不完全相同的汉语措辞保留其修辞效果，且不人为扩大语义差别。
theological_decisions:
- issue: 诗题中 לְדָוִד 的关系
  choice: 大卫的诗
  alternative: 为大卫而作／关于大卫
  rationale: 介词 לְ 可表示作者、归属、关联或献给；正文采用汉语传统且自然的“大卫的诗”，脚注保留原文关系上的真实歧义。
- issue: 战争训练的施动者
  choice: 明确以耶和华为教导和训练者
  alternative: 将分词处理为独立称号
  rationale: 希伯来文分词 הַמְלַמֵּד 修饰前文“我的磐石”，其最终所指为耶和华；用“他”清楚呈现句法关系而不添加额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“磐石”“颂赞”保留诗篇的传统诗性；分行体现希伯来诗歌的平行结构。脚注标记已置于诗题之后。
