  text: אַלּוּפֵ֗י/נוּ מְֽסֻבָּ֫לִ֥ים אֵֽין פֶּ֭רֶץ וְ/אֵ֣ין יוֹצֵ֑את וְ/אֵ֥ין צְ֝וָחָ֗ה בִּ/רְחֹבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/014.yaml
  text: Our cattle are heavy with young[a]; there is no breach and no going out[c][b], and no cry in our streets.
translation:
  language: zh_hans
  text: 我们的牲畜怀着幼崽[a]；没有破口，也没有人离去[b]，我们的街道上也没有哀号。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们的牛满载重物。”译作“牲畜”的希伯来词也可指“牛”，并可指“首领”；“怀着幼崽”所对应的词字面有“负载、承受重担”之意。结合上下文，许多人认为此句描写牲畜繁殖兴旺。
    reason: 词义存在多种可能，正文采用最符合丰饶语境的理解。
  - marker: b
    text: 或译：“没有人被掳出去”“没有人流亡”，或“没有人出去”。希伯来原文十分简略，没有说明离去者是谁，也没有说明离去的方式或原因。
    reason: 保留原文省略所造成的多重解释可能。
lexical_decisions:
- source_word: אַלּוּפֵינוּ
  choice: 我们的牲畜
  rationale: אַלּוּף虽常指“首领”，在本节与מְסֻבָּלִים搭配，并处于牲畜繁盛、社会安宁的语境中，理解为家畜（尤指牛）最连贯；“牲畜”也避免把所指过度限定为役牛。
- source_word: מְסֻבָּלִים
  choice: 怀满幼崽
  rationale: 该词字面意为“负载、满载”。结合上下文的丰饶图景，用“怀满幼崽”自然表达牲畜繁殖兴旺，同时在脚注保留“满载重物”的字面可能。
- source_word: אֵין פֶּרֶץ
  choice: 没有缺口
  rationale: פֶּרֶץ表示破口、裂口或突破；“缺口”保留城防遭突破的可能，也不过度明确其具体对象。
- source_word: וְאֵין יוֹצֵאת
  choice: 也没有出去的事
  rationale: 希伯来语措辞简短且省略所指出去者或出去方式。“出去的事”在中文中保留其非人称表达和含混性，不直接断定是被掳、流亡或一般离去。
- source_word: וְאֵין צְוָחָה
  choice: 也没有哀号
  rationale: צְוָחָה指因患难而发的呼喊或哀叫；“哀号”比泛指声音的“呼喊”更能传达这里的灾祸语境。
- source_word: בִּרְחֹבֹתֵינוּ
  choice: 我们的街市上
  rationale: רְחֹבוֹת指城中的宽阔街道、广场等公共空间；“街市”既自然，又涵盖街道和公共场所。
theological_decisions:
- issue: “首领”还是“牲畜”
  choice: 按“牲畜”翻译
  alternative: 我们的首领／族长承担重任
  rationale: 词形本身容许“首领”，但本诗相邻经文集中描写子女、仓廪和羊群兴旺；将此处理解为牲畜，使整段祝福的结构更连贯。这是语境判断，不涉及特定教派立场。
- issue: “出去”所指为何
  choice: 正文保留笼统的“出去的事”
  alternative: 被掳出去／流亡／有人出城
  rationale: 原文没有明说主体、原因或性质，不宜在正文中把它限定为被掳或流亡；脚注列出主要解释，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。以分号分开牲畜兴旺与城中平安两幅图景，并用重复的“没有”体现希伯来语的平行结构。
