  text: שְׁלַ֥ח יָדֶ֗י/ךָ מִ/מָּ֫ר֥וֹם פְּצֵ֣/נִי וְ֭/הַצִּילֵ/נִי מִ/מַּ֣יִם רַבִּ֑ים מִ֝/יַּ֗ד בְּנֵ֣י נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/007.yaml
  text: Stretch out your hand from on high[a]; rescue me and deliver me from many waters[b], from the hand of foreign sons.
translation:
  language: zh_hans
  text: 求你从高天[a]伸出你的手，救拔我，搭救我脱离滔滔大水[b]，脱离外族人的手[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从高处”。原文指高处或崇高之处，并未直接使用“天”一词。
    reason: lexical_alternative
  - marker: b
    text: 直译“许多的水”或“浩大的水”；这一诗歌意象也可表示压倒性的危险。
    reason: lexical_alternative
  - marker: c
    text: 原文直译“外族之子”，是指外族人的希伯来语习语。
    reason: idiom_explanation
lexical_decisions:
- source_word: שְׁלַח יָדֶיךָ
  choice: 伸出你的手
  rationale: שׁלח与“手”连用，在这里表示把手伸出；保留上帝施行拯救的具体形象，也符合现代汉语表达。
- source_word: מִמָּרוֹם
  choice: 从高天
  rationale: מָרוֹם指高处或崇高之处。“高天”在诗歌语境中自然庄重，同时避免在正文中把该词完全抽象化。
- source_word: פְּצֵנִי
  choice: 救拔我
  rationale: 该动词在此有拉出、解救之意。“救拔”既保留从险境中拔出的动态感，也能与下句构成诗歌平行。
- source_word: וְהַצִּילֵנִי
  choice: 搭救我
  rationale: נצל表示从危险或掌控中救出。“搭救”与“救拔”意义相近而不完全重复，呈现原文的同义平行。
- source_word: מִמַּיִם רַבִּים
  choice: 脱离滔滔大水
  rationale: 字面为“许多的水”或“浩大的水”。“滔滔大水”保留水的诗歌意象，又自然传达其众多、浩大而具有威胁的特点。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 原文直译为“从……的手中”，可指权势或控制。正文保留“手”，与前面的“你的手”形成鲜明的诗歌呼应。
- source_word: בְּנֵי נֵכָר
  choice: 外族人
  rationale: 原文形式为“外族之子”，在希伯来语中是指异族人的习语。正文采用自然、清楚的现代汉语“外族人”，脚注保留其字面形式。
theological_decisions:
- issue: 上帝行动的拟人化表达
  choice: 保留“伸出你的手”的具体形象
  alternative: 意译为“从天上出手干预”或“施行拯救”
  rationale: 原文以“手”描绘上帝的拯救行动；保留形象可避免把诗歌语言化约为抽象解释。
- issue: “大水”是实景还是象征
  choice: 正文保留水的意象，不断定其仅为象征
  alternative: 直接译作“重重危险”或“强敌”
  rationale: 诗句容许“大水”指真实水患，也可象征压倒性的危险；正文保留这一开放性，脚注说明其诗歌用法。
- issue: בְּנֵי נֵכָר的性别与习语形式
  choice: 正文译为“外族人”，脚注注明字面为“外族之子”
  alternative: 正文直译为“外族之子”
  rationale: “外族之子”在现代汉语中容易被误解为外族人的儿子，而希伯来语习语所指是外族人。此译法传达实际所指，同时由脚注保留原文的阳性亲属称谓。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”使连续命令式在汉语祷告中自然呈现；“救拔／搭救”保留同义平行，“你的手／外族人的手”则保留原文首尾呼应的意象。
