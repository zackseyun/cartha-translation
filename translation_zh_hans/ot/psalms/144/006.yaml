  text: בְּר֣וֹק בָּ֭רָק וּ/תְפִיצֵ֑/ם שְׁלַ֥ח חִ֝צֶּ֗י/ךָ וּ/תְהֻמֵּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/006.yaml
  text: Flash forth lightning and scatter them[a]; send out your arrows and throw them into confusion.
translation:
  language: zh_hans
  text: 求你发出闪电，使他们四散；射出你的箭，使他们惊慌失措。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们溃败。”末尾的动词可指使人在战斗中惊慌、混乱或败退。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוֹק
  choice: 发出
  rationale: 这是动词ברק的命令式，与后面的“闪电”构成同根表达。汉语若直译为“闪耀闪电”不自然，因此用“发出闪电”保留动作性和直接祈求的语气。
- source_word: בָּרָק
  choice: 闪电
  rationale: 该名词可指闪电或一道闪电；这里用汉语集合性名词“闪电”，自然且符合诗歌意象。
- source_word: וּתְפִיצֵם
  choice: 使他们四散
  rationale: פוץ的使役形式表示使敌人分散、溃散；“使他们四散”既保留使役意义，也适合战争语境。
- source_word: שְׁלַח
  choice: 射出
  rationale: שלח基本义为发出、送出；以“箭”为宾语时，现代汉语“射出”最自然，并清楚呈现发箭的图像。
- source_word: חִצֶּיךָ
  choice: 你的箭
  rationale: 按复数名词及第二人称单数所有格直译，保留神圣战士的诗歌意象。
- source_word: וּתְהֻמֵּם
  choice: 使他们惊乱
  rationale: המם在战事语境中可指使人惊慌、混乱或溃败。“惊乱”同时涵盖恐慌与阵势混乱，又不把词义限定为彻底击溃。
theological_decisions:
- issue: 神圣战士意象
  choice: 保留向上帝直接祈求，以闪电和箭使敌人四散、惊乱的战争意象。
  alternative: 弱化为笼统请求上帝帮助或审判。
  rationale: 希伯来文以命令式直接呼求上帝，并明确使用闪电与箭的战斗图像；译文不应淡化诗篇本身的神学描绘。
- issue: 末尾动词的结果强度
  choice: 译为“使他们惊乱”，保留恐慌、混乱与战场失序之间的语义张力。
  alternative: 译为“击溃他们”或“使他们混乱”。
  rationale: 原词可涵盖惊慌、混乱乃至溃败；正文采用较宽的表达，脚注交代更强的战事含义，避免无根据地锁定单一结果。
translation_notes:
  register: 采用现代、庄重而清楚的祈求语体。“求你”补明希伯来语命令式在诗篇祷告中的功能；分号保留两组平行命令。“惊乱”略带诗体色彩，但普通读者仍易理解。
