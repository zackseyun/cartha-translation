  text: מְזָוֵ֣י/נוּ מְלֵאִים֮ מְפִיקִ֥ים מִ/זַּ֗ן אֶ֫ל זַ֥ן צֹאונֵ֣/נוּ מַ֭אֲלִיפוֹת מְרֻבָּב֗וֹת בְּ/חוּצוֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/013.yaml
  text: May our storehouses be full[a], supplying every kind of produce; may our flocks multiply by thousands, by tens of thousands[b], in our open fields.
translation:
  language: zh_hans
  text: 愿我们的仓房充盈，供应各样出产[a]；愿我们的羊群在我们的空旷之处[b]成千上万地繁增。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从一种到一种”，表示出产种类繁多。
    reason: lexical_alternative
  - marker: b
    text: 或译“街道上”或“城外”。原词可指聚居地内外的街道或开放空间；这里因涉及羊群，译作“空旷之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזָוֵינוּ
  choice: 我们的仓房
  rationale: 该罕见名词指储藏粮食或物资之处；“仓房”自然易懂，也符合本节农业丰收的语境。
- source_word: מְלֵאִים
  choice: 充盈
  rationale: 作谓语表示“满”；结合上下文祈愿式的祝福语气，译作“愿……充盈”。
- source_word: מְפִיקִים
  choice: 供应
  rationale: 分词源于“取出、产出”之意，描写仓房不断提供储存的出产；“供应”兼顾向外供给的动态和现代汉语表达。
- source_word: מִזַּן אֶל זַן
  choice: 各样出产
  rationale: 字面为“从一种到一种”，表示品类繁多；结合仓房语境，以“各样出产”清楚传达其分配性含义。
- source_word: צֹאנֵנוּ
  choice: 我们的羊群
  rationale: 该集合名词泛指小型牲畜，主要是绵羊和山羊；“羊群”保留集合意义并符合汉语习惯。
- source_word: מַאֲלִיפוֹת מְרֻבָּבוֹת
  choice: 成千上万地繁增
  rationale: 两个分词分别由“千”和“万”相关词根构成，形成递进并描写大量增殖；“成千上万地繁增”在现代汉语中自然地保留数量递进与兴旺之意。
- source_word: בְּחוּצוֹתֵינוּ
  choice: 在我们的空旷之处
  rationale: חוּץ可指街道、户外或聚居地内外的开放空间；“空旷之处”保留词义弹性，也适合羊群所在的牧养语境，避免把它过度限定为田野。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祝福祈愿语体。“愿……；愿……”承接诗篇上下文的祈愿语气；用“仓房”“羊群”“繁增”等常用词，避免古奥表达。
