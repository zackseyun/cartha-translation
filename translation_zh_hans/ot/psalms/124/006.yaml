  text: בָּר֥וּךְ יְהוָ֑ה שֶׁ/לֹּ֥א נְתָנָ֥/נוּ טֶ֝֗רֶף לְ/שִׁנֵּי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/006.yaml
  text: Blessed be Yahweh[a], who has not given us as prey to their teeth.
translation:
  language: zh_hans
  text: 愿雅威[a]受称颂！他没有把我们当作猎物交给他们的牙齿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自希伯来文上帝之名 יהוה（YHWH）；中文传统也常译作“耶和华”。“愿……受称颂”也可译为“……是当受称颂的”。
    reason: 说明四字神名的译法，并保留希伯来文祝颂公式可作陈述式或祈愿式表达的译法差异。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 是当受称颂的
  rationale: 这是用于颂赞的被动分词祝颂公式。译为“是当受称颂的”既保留祝颂含义，也以自然、庄重的现代汉语表达其礼仪性和感叹语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名“耶和华”直接呈现四字神名，不以称号替代。
- source_word: שֶׁלֹּא
  choice: 他没有
  rationale: 此处引出受称颂的原因或内容。汉语另起分句并明确主语“他”，比生硬的关系从句更自然，同时不必限定为“因为”这一单一逻辑关系。
- source_word: נְתָנָנוּ
  choice: 把我们交给
  rationale: 动词基本义为“给、交出”；在受敌人吞噬的语境中，“交给”自然表达没有任凭我们落入对方之手，又未采用更强的“出卖”等解释性措辞。
- source_word: טֶרֶף
  choice: 猎物
  rationale: 与“牙齿”共同构成猛兽捕食的鲜明比喻；“猎物”比“食物”更能保留敌人如野兽般撕咬的意象。
- source_word: לְשִׁנֵּיהֶם
  choice: 给他们的牙齿
  rationale: 尽量保留希伯来文具体而强烈的“牙齿”意象，并与“作猎物”组成自然可懂的汉语表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。正文采用现代中文圣经传统中最通行、普通读者最熟悉的“耶和华”，脚注说明另一种按学界常见拟音的译法，避免将专名改成“主”这一称号。
- issue: בָּרוּךְ 的祝颂语气
  choice: 耶和华是当受称颂的
  alternative: 愿耶和华受称颂
  rationale: 希伯来语公式在语法上可理解为陈述，也具有颂赞性的祈愿力量。正文以“是当受称颂的”兼顾二者，不把它仅仅化为事实陈述或愿望。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌颂赞语体。感叹号传达祝颂公式的颂赞力度；后句保留“牙齿—猎物”的动物性比喻，不将其解释性改写为一般性的“落入敌手”。
