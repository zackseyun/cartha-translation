translation:
  language: zh_hans
  text: 那时，狂傲的水就会漫过我们的性命[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那时，狂暴的水就会漫过我们。”这里的希伯来语形容词可指“狂傲的”“放肆的”或“擅敢的”；它以拟人手法描写水势的凶猛逼人。原文“我们的性命”也可按上下文整体译为“我们”或“我们的生命”。
    reason: 词义存在可保留的另一种译法；同时说明נפש可指人的生命或整个人。
lexical_decisions:
- source_word: אֲזַי
  choice: 那时
  rationale: 这是承接上文未实现条件的时间副词；“那时”自然地延续“若不是……”所引出的结果。
- source_word: עָבַר עַל
  choice: 漫过
  rationale: 基本义是“从……上面经过”；以水为主语时，“漫过”既保留空间意象，也符合现代汉语表达。
- source_word: נַפְשֵׁנוּ
  choice: 我们的性命
  rationale: נפש在这里可指人的生命或整个人；“性命”保留生命受吞没的意味，也维持希伯来文集合性单数的诗歌表达。
- source_word: הַמַּיִם
  choice: 水
  rationale: 希伯来语用复数形式指水体；现代汉语通常以不可数的“水”自然表达。
- source_word: הַזֵּידוֹנִים
  choice: 狂暴的
  rationale: 该词本义涉及狂傲、放肆或僭越，用来拟人化地描写水势；“狂暴的”在汉语中传达其凶猛压人的力量，而“狂傲的”作为较直译的可能保留在脚注中。
