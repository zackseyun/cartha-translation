  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/001.yaml
  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: zh_hans
  text: '上行之歌。大卫的诗。


    若不是雅威站在我们这边[a]——


    以色列现在要说——'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“为我们”。
    reason: “站在我们这边”是שֶׁהָיָה לָנוּ在现代汉语中自然的表达；脚注保留原文较简约的关系性措辞。
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 保留希伯来文“上行”的基本意象及其朝圣、礼仪背景，同时采用现代中文圣经读者容易理解的篇题表达。
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: לְ 可表示作者、归属或关联；“大卫的诗”比“大卫作”更少限定为明确的作者署名，仍保留一定歧义。
- source_word: לוּלֵי
  choice: 若不是
  rationale: 准确引出反事实条件，并让未完的句法自然延续到下一节。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文对以色列之神盟约名字的明确指称。
- source_word: שֶׁהָיָה לָנוּ
  choice: 帮助我们
  rationale: 该希伯来语表达指雅威支持、护佑以色列；“帮助我们”是自然、庄重的现代中文，同时以脚注保留更贴近空间隐喻的译法。
- source_word: יֹאמַר נָא
  choice: 现在要说
  rationale: 体现祈使或劝告语气；与主语“以色列”组合后，在中文中构成自然的礼仪性呼召。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 按通行译名直接指称盟约群体，不作解释性扩写。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以保留其专名性质，不以称号“主”替代。
- issue: שֶׁהָיָה לָנוּ 所表达的神圣支持
  choice: 帮助我们
  alternative: 站在我们这边
  rationale: 正文用自然中文表达雅威为以色列施行支持和护佑，但不进一步说明支持的具体方式；脚注保留更具原文关系和空间色彩的另一译法。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌体。破折号保留本节反事实条件尚未完成、并引向下一节的悬置结构；“以色列现在要说”体现会众式呼召。
