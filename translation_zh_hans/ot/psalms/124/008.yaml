  text: עֶ֭זְרֵ/נוּ בְּ/שֵׁ֣ם יְהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/008.yaml
  text: Our help is in the name of Yahweh[a], maker of heaven and earth.
translation:
  language: zh_hans
  text: 我们的帮助在于雅威[a]的名；他是创造天地的那一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה）；也常译作“耶和华”。
    reason: 说明四字神名的原文形式及常见的另一中文译名。
lexical_decisions:
- source_word: עֶזְרֵנוּ
  choice: 我们的帮助
  rationale: עֵזֶר带第一人称复数后缀，所指是“我们的帮助、援助”，而不是“我们的帮助者”。
- source_word: בְּשֵׁם
  choice: 在于……的名
  rationale: 介词ב与“名”连用，在此表达帮助所凭借、所依靠的根基；“在于……的名”既贴近原文，也保留其敬拜与信靠色彩。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，并以脚注注明其希伯来文形式及另一种音译。
- source_word: עֹשֵׂה
  choice: 他是创造……的主
  rationale: 该主动分词描述耶和华持续而具有特征性的身份与作为；此译法在现代汉语中自然，并避免把它仅限于一次过去的动作。
- source_word: שָׁמַיִם וָאָרֶץ
  choice: 天地
  rationale: 这是涵盖全部受造界的固定并列表达；“天地”简洁、庄重，也符合现代中文圣经语体。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。正文采用中文传统且广为人知的“耶和华”，脚注保留“雅威”这一更接近常见学术重构发音的音译，以透明呈现原文证据。
- issue: עֹשֵׂה的时间与身份含义
  choice: 他是创造天地的主
  alternative: 他造了天地
  rationale: 原文使用分词，可表达具有恒常特征的行动或身份；不改为单纯过去时，以保留“创造者”这一持续身份意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们的帮助在于……”保留诗句的宣告语气；后半句用代词承接，使中文流畅，同时不削弱原文将耶和华描述为天地创造者的含义。
