translation:
  language: zh_hans
  text: 那时，他们早就会把我们活活吞下[a]，当他们对我们怒火中烧时[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们把我们活活吞下了。”若把这里的完成式理解为简单过去时，可如此翻译；但第2—5节的整体语境支持反事实的意思，即“他们早就会把我们活活吞下”。
    reason: lexical_alternative
  - marker: b
    text: “怒火中烧”原文直译为“他们的鼻子向我们发热”，这是希伯来语表示发怒的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲזַי
  choice: 那时
  rationale: 这是时间副词，在第2—5节的反事实结构中引出后果；“那时”自然地承接上文。
- source_word: חַיִּים
  choice: 活活
  rationale: 该词在此作状语，表示“仍活着”；“活活吞下”既符合现代汉语习惯，也保留原文的强烈意象。
- source_word: בְּלָעוּנוּ
  choice: 早已把我们……吞下
  rationale: 该完成式置于上下文的反事实条件结构中，宜表达本来会发生而实际未发生的结果；“早已”与上文隐含的“若不是”配合，并保留“吞下”的具体比喻。
- source_word: בַּחֲרוֹת
  choice: 怒火中烧
  rationale: 这是带介词的 חרה 不定式结构，字面表示“在燃烧时”；汉语成语“怒火中烧”同时传达时间情境和燃烧意象。
- source_word: אַפָּם
  choice: 怒火
  rationale: אַף 字面可指“鼻子”，在此是希伯来语表示愤怒的习语；译作“怒火”清楚自然，并与 חרה 的燃烧意象相合。
- source_word: בָּנוּ
  choice: 向我们
  rationale: 介词 ב 与发怒用语连用时表示敌意所针对的对象；“向我们怒火中烧”在现代汉语中表达其指向性。
theological_decisions:
- issue: 完成式在反事实语境中的时态语气
  choice: 译为“早已把我们……吞下”
  alternative: 译为“把我们……吞下了”
  rationale: 单看动词形式可作简单过去时，但第2—5节由“若不是耶和华帮助我们”统摄，支持反事实结果。正文据语境表达这一点，同时以脚注保留形式上的另一种理解。
translation_notes:
  register: 采用现代、庄重且易懂的诗歌语言。“活活吞下”保留原文鲜明的吞噬意象；“怒火中烧”自然传达希伯来语中鼻子发热的愤怒习语。正文须与第2节连读，因此用“早已”表达反事实结果。
