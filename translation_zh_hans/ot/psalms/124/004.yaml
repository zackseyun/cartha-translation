  yaml_path: translation/ot/psalms/124/004.yaml
  text: then the waters would have swept us away[a]; the stream would have passed over our soul.
translation:
  language: zh_hans
  text: 那时，水早已把我们冲走；急流早已漫过我们的性命[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”原文也可指“生命”或“整个人”，因此也可译为“我们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲזַי
  choice: 那时
  rationale: 承接上一节的反事实条件，表示在设想的情形下将会发生的结果。
- source_word: הַמַּיִם
  choice: 洪水
  rationale: 原文为带冠词的复数“水”；在淹没人的诗歌意象中译作“洪水”，自然地传达汹涌而致命的水势。
- source_word: שְׁטָפוּנוּ
  choice: 早已把我们淹没
  rationale: 该动词表示洪水冲刷、漫过或淹没；结合上文未实现的条件，用“早已”表达反事实结果，而不额外重复条件词。
- source_word: נַחְלָה
  choice: 湍流
  rationale: 该词可指溪流、河谷中的水流；此处语境强调危险而奔涌的水势，“湍流”兼顾其水流义和诗歌力度。
- source_word: עָבַר עַל
  choice: 漫过
  rationale: 基本意思是从上面经过；用于洪水时，“漫过”既保留方向意象，也符合现代汉语表达。
- source_word: נַפְשֵׁנוּ
  choice: 我们的性命
  rationale: נֶפֶשׁ 此处指人的生命或整个人，并非必然指与身体分离的“灵魂”；“性命”贴合致命危险的语境，同时保留诗意。
theological_decisions:
- issue: 危险语境中 נֶפֶשׁ 的含义
  choice: 我们的性命
  alternative: 我们的灵魂；我们
  rationale: 上下文描写群体面临被洪水吞没的死亡危险，因此该词主要指生命或整个人。译作“性命”避免引入二分式人论，同时不把原文简化为单纯代词；脚注保留其语义范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以“早已”承接上文反事实结构，并用“洪水—湍流—漫过”保持希伯来诗歌的水灾意象和平行关系。
