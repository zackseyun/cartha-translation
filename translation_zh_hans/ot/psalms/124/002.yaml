  text: לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ בְּ/ק֖וּם עָלֵ֣י/נוּ אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/002.yaml
  text: If Yahweh had not been for us when man rose up against us—[a]
translation:
  language: zh_hans
  text: 若不是雅威站在我们这一边，当人起来攻击我们时——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若不是雅威帮助我们，当人起来攻击我们时——”
    reason: 说明“雅威是为我们／在我们一方”的支持性含义，也可按语境意译为“帮助我们”。
lexical_decisions:
- source_word: לוּלֵי
  choice: 若不是
  rationale: 引出与事实相反的条件，且本节的条件句要到下一节才出现结果；“若不是”既自然，也保留这种悬而未决的诗行结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接出现的四字神名，以现代汉语音译“雅威”呈现其专名性质，不以“主”这一称号替代。
- source_word: שֶׁהָיָה לָנוּ
  choice: 帮助我们
  rationale: 字面结构是“为着我们／在我们一方”，在此表示支持和维护。“帮助我们”是自然简明的汉语表达；“站在我们这边”作为较形象的替代译法收入脚注。
- source_word: בְּקוּם
  choice: 当……起来……时
  rationale: 介词 בְּ 加不定词在此标示动作发生的时间；קום 在敌对语境中表示起来采取行动。
- source_word: עָלֵינוּ
  choice: 攻击我们
  rationale: עַל 在敌对行动的语境中有“反对、敌对”的含义；与 קום 合译为“起来攻击我们”，符合现代汉语表达。
- source_word: אָדָם
  choice: 人
  rationale: 此处单数名词可作集合性、泛指用法，指发动攻击的人类或众人；译作“人”保留原文单数形式及其概括性。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用的是神的专名而非“主”这一称号；采用“雅威”以较直接地音译该名，同时避免把专名无提示地改成称号。
- issue: שֶׁהָיָה לָנוּ 所表达的支持关系
  choice: 帮助我们
  alternative: 站在我们这边；与我们同在
  rationale: “帮助我们”表达雅威对群体的支持而不刻意引入阵营化措辞。“与我们同在”虽符合常见神学语言，却更像希伯来语 עִמָּנוּ，因而不作为正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留破折号，表明反事实条件句的结果延续至下一节；不在本节自行补出结果。
