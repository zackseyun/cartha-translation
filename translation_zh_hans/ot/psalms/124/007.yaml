base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/007.yaml
  text: Our soul has escaped like a bird from the snare of the fowlers[a]; the snare is broken[b], and we have escaped.
translation:
  language: zh_hans
  text: 我们的性命[a]如飞鸟从捕鸟人的网罗[b]中逃脱了；网罗破裂，我们便逃脱了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们的性命”也可译作“我们自己”或“我们的灵魂”。希伯来语 נֶפֶשׁ 可指生命、本人或灵魂；这里着重于整个生命得以保全。
    reason: lexical_alternative
  - marker: b
    text: “捕鸟人”原文指设置圈套的人，也可译作“设网罗的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: 我们的性命
  rationale: נֶפֶשׁ可指生命、本人或传统所说的“灵魂”。本节描写从致命危险中获救，“性命”既贴合语境，也避免现代“灵魂”一词可能带来的身心二分联想；保留单数集合表达。
- source_word: כְּצִפּוֹר
  choice: 如飞鸟
  rationale: צִפּוֹר泛指鸟，并非特指麻雀；“如飞鸟”简洁保留明喻和诗体语感。
- source_word: נִמְלְטָה / נִמְלָטְנוּ
  choice: 逃脱了／逃脱了
  rationale: מלט的Niphal在此表示脱离危险。前后重复“逃脱”，保留希伯来诗句的复现与收束。
- source_word: מִפַּח / הַפַּח
  choice: 网罗／网罗
  rationale: פַּח指捕捉鸟兽的圈套或罗网。“网罗”符合飞鸟意象，并保留原文两次重复。
- source_word: יוֹקְשִׁים
  choice: 捕鸟人
  rationale: 该分词指设置圈套者；在飞鸟与网罗的直接语境中，“捕鸟人”自然明确，同时脚注保留较宽泛的词义。
- source_word: נִשְׁבָּר
  choice: 破裂
  rationale: 被动完成形表示网罗已被破坏。“破裂”简明呈现其失效的结果状态。
- source_word: וַאֲנַחְנוּ
  choice: 我们便
  rationale: 原文显式代词带有强调作用；“我们便”既使汉语承接自然，也突出网罗破裂之后获救的群体。
theological_decisions:
- issue: נֶפֶשׁ的人论含义
  choice: 正文译“性命”，脚注列出“我们自己／我们的灵魂”
  alternative: 直接译“我们的灵魂”
  rationale: 语境重点是全人及生命从死亡威胁中获救，不必把该词限定为与身体分离的实体；脚注保留其传统译法与词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。保留“网罗”和“逃脱”的重复，以再现希伯来文的意象与诗行收束；“如飞鸟”不擅自具体化为某一种鸟。
