  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: zh_hans
  text: '上行之歌。[a]大卫的。[b]


    若不是耶和华站在我们这边[a]——


    请以色列现在说——'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上行”也可指登上台阶或前往耶路撒冷；此标题的具体含义不能确定。此处“站在我们这边”直译为“为我们”。
    reason: lexical_alternative
  - marker: b
