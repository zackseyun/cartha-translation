    reason: source_ambiguity
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 传统而简洁的译法；保留“上行”的空间或礼仪意象，不武断限定为朝圣、台阶或曲调名称。
- source_word: לְדָוִד
  choice: 大卫作
  rationale: 在诗篇标题中采用自然中文表达；介词לְ可表示归于大卫、与大卫有关或由大卫所作，但正文从简，潜在歧义以脚注说明。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，区别于一般称谓“主”。
- source_word: שֶׁהָיָה לָנוּ
  choice: 帮助我们
  rationale: 字面近于“为我们/属我们这一边”；在此危难语境中译为“帮助我们”较自然，同时用脚注保留“站在我们这边”的表达。
- source_word: יֹאמַר נָא
  choice: 愿……现在说
  rationale: 兼顾נָא的劝请语气和“现在”之意，并保留未完句式，引出下一节的会众复述。
theological_decisions:
- issue: 耶和华与以色列同在的表达
  choice: 帮助我们
  alternative: 站在我们这边
  rationale: 不把经文扩展为抽象的阵营神学；译文突出危难中的援助，脚注保存更具阵营色彩的惯用表达。
- issue: לְדָוִד所表达的大卫关系
  choice: 正文译“大卫作”
  alternative: “大卫的”或“与大卫有关”
  rationale: “大卫作”符合中文标题习惯，但原介词本身并不绝对排除其他关系，因此以脚注提示其范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；以破折号保留希伯来文悬句结构，使本节自然引向下一节。脚注标记应置于正文对应处。
