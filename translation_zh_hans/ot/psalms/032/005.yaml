id: PSA.32.5
reference: Psalms 32:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חַטָּאתִ֨/י אוֹדִ֪יעֲ/ךָ֡ וַ/עֲוֺ֘נִ֤/י לֹֽא כִסִּ֗יתִי אָמַ֗רְתִּי אוֹדֶ֤ה עֲלֵ֣י פְ֭שָׁעַ/י לַ/יהוָ֑ה וְ/אַתָּ֨ה נָ֘שָׂ֤אתָ עֲוֺ֖ן חַטָּאתִ֣/י סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/005.yaml
  text: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
translation:
  language: zh_hans
  text: 我向你承认我的罪，也没有掩盖我的罪孽。我说：“我要向雅威承认我的过犯。”你就赦免了我所犯之罪的罪责。[a]细拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赦免”所译的希伯来语动词本义可指“举起”“背负”或“带走”；它在这里与罪责连用，惯用地表示赦免。
    reason: 保留נשא的字面负担意象及其可能的语义张力，同时说明正文采用惯用义的依据。
lexical_decisions:
- source_word: חַטָּאתִי
  choice: 我的罪
  rationale: חטאת在此指罪或犯罪行为；“我的罪”直接自然，也与后文“罪孽”“过犯”形成近义词组。
- source_word: אוֹדִיעֲךָ
  choice: 我向你承认
  rationale: ידע的使役形本义为“使……知道”。在向上帝坦白罪的语境中，“向你承认”比生硬的“使你知道”更符合现代汉语，同时保留主动公开、不再隐瞒之意。
- source_word: עֲוֺנִי
  choice: 我的罪孽
  rationale: עון可指罪孽、罪责或罪所带来的后果；此处译作“罪孽”，与חטאת和פשע保持词汇区别。
- source_word: לֹא כִסִּיתִי
  choice: 不再掩盖
  rationale: כסה本义为“遮盖”。“掩盖”既保留遮盖的意象，又自然表达不隐瞒罪；“不再”结合上下文表达诗人由沉默转向认罪。
- source_word: אוֹדֶה
  choice: 我要……承认
  rationale: ידה的使役形可指称谢或承认、 confess；以“我的过犯”为内容时，显然是认罪，现代汉语用“承认”清楚自然。
- source_word: עֲלֵי פְשָׁעַי
  choice: 我的过犯
  rationale: על在此标明承认的事项，汉语自然地将“我的过犯”作为“承认”的宾语；פשע带有反叛、越界之意，译作“过犯”。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: יהוה是上帝的专名；采用“雅威”音译，以区别于称号“主”，并保留原文直接使用圣名的特点。
- source_word: נָשָׂאתָ
  choice: 你就赦免了
  rationale: נשא本义为举起、背负或带走；以罪孽为宾语时惯用地表示除去罪责、赦免。正文采用自然明确的“赦免”，字面意象收入脚注。
- source_word: עֲוֺן חַטָּאתִי
  choice: 我犯罪的罪责
  rationale: 该组合直译近于“我之罪的罪孽”。此处עון可侧重罪责；译为“我犯罪的罪责”既保存层叠表达，也避免汉语“我的罪的罪孽”的生硬。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切含义不明，因此按传统音译，不擅自解释为“停顿”或“间奏”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为立约之神专名的性质，不以称号替代，也不把有争议的确切发音说成完全确定。
- issue: נָשָׂאתָ עֲוֺן应保留字面负担意象还是译出赦免含义
  choice: 正文译“你就赦免了”，脚注保留“举起、带走或担当”的意象
  alternative: 你带走了我犯罪的罪责／你担当了我犯罪的罪责
  rationale: 这里的惯用含义是上帝赦罪，正文用“赦免”最易理解；但“举起、背负、带走”的意象具有真实的词义张力，故在脚注说明，避免把单一字面方向绝对化。
- issue: עֲוֺן חַטָּאתִי中的עון偏重罪行还是罪责
  choice: 我犯罪的罪责
  alternative: 我罪中的罪孽／我罪的罪孽
  rationale: עון兼有罪孽与罪责的语义，且与נשא搭配时“除去罪责”的意思突出；译文保留חטאת所指的犯罪，同时不抹平其结果或责任层面。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。用“罪、罪孽、过犯”保留原文三个相关但不同的罪词；“细拉”音译以保留其不确定性。
