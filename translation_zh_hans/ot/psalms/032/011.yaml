  text: שִׂמְח֬וּ בַֽ/יהוָ֣ה וְ֭/גִילוּ צַדִּיקִ֑ים וְ֝/הַרְנִ֗ינוּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/011.yaml
  text: Be glad in Yahweh and rejoice[a], you righteous; shout for joy[b], all you upright in heart.
translation:
  language: zh_hans
  text: 义人哪，你们要以雅威[a]为乐，欢喜快乐；凡心里正直的人，都要欢呼[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 יהוה（YHWH），即神名；这里译作“雅威”，中文传统也常译作“耶和华”。
    reason: lexical_alternative
  - marker: b
    text: “欢呼”也可译作“欢唱”。这个希伯来动词指发出响亮的喜乐之声，可以是呼喊，也可以是歌唱。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: 欢喜
  rationale: 这是复数命令式，呼吁人喜乐；译作“欢喜”自然明白，并与下一个表示热烈喜悦的动词有所区别。
- source_word: בַיהוָה
  choice: 因雅威
  rationale: 介词 בַּ 可表示喜乐所归向的对象、所在的范围或缘由。“因雅威”符合现代汉语表达，同时表明喜乐以雅威为对象和根源。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名 YHWH。译作“雅威”，保留这是以色列上帝专名的性质，而不以“主”这一称号代替。
- source_word: וְגִילוּ
  choice: 快乐
  rationale: גיל 表示强烈、洋溢的喜悦。与“欢喜”并列译作“快乐”，在汉语中流畅地保留两个喜乐命令的叠加强调。
- source_word: צַדִּיקִים
  choice: 义人哪
  rationale: 这里是对受命者的直接称呼。“义人哪”清楚保留呼语功能，语气庄重自然。
- source_word: וְהַרְנִינוּ
  choice: 欢呼
  rationale: רנן 的使役词干命令式表示发出响亮的喜乐之声，可以是呼喊，也可以是歌唱。“欢呼”既保留有声的热烈喜悦，也不限定为唱歌。
- source_word: כָּל
  choice: 凡……都
  rationale: 用现代汉语的总括结构表达“所有、全体”，明确涵盖整个群体。
- source_word: יִשְׁרֵי לֵב
  choice: 心里正直的人
  rationale: 该短语指内在品格正直的人。“心里正直”保留“心”的内在维度，也比直译“心直”更准确自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 经文使用的是上帝的专名 YHWH，而非“主”这一称号。“雅威”较直接地呈现学界通常采用的读音；脚注同时说明希伯来辅音形式及常见中文传统译名。
- issue: בַיהוָה 所表达的关系
  choice: 因雅威欢喜
  alternative: 在雅威里面欢喜；向雅威欢喜
  rationale: 介词 ב 在这里可以表示范围、对象或缘由。正文采用自然的汉语“因雅威”，但不把它解释成某一套特定的神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“义人哪”保留诗歌中的直接呼告，以“欢喜快乐”体现两个近义命令的叠加强调；后半句用“凡……都……”形成自然的平行结构。
