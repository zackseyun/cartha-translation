  yaml_path: translation/ot/psalms/032/008.yaml
  text: I will instruct you and teach you in the way you should go[c][b][a]; I will counsel you with my eye upon you.
translation:
  language: zh_hans
  text: 我[c]要使你明白，指教你当走的路[a]；我要劝导你，我的眼目在你身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你将走的路”或“你将走这条路”。原文可以按较直白的将来意义理解；这里按训诲语境译作“当走的路”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“我的眼目在你身上。”这可以表示留心引导，也可以表示专注的看顾。
    reason: lexical_alternative
  - marker: c
    text: 本节的说话者可能理解为耶和华，也可能理解为诗人；本节原文本身没有明确指出。
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׂכִּילְךָ
  choice: 我要使你明白
  rationale: 该词是שׂכל的使役式，重点在于使人获得理解或洞见。“使你明白”保留使役含义，并与下句“指教你”形成自然的同义并行。
- source_word: וְאוֹרְךָ
  choice: 指教你
  rationale: ירה的使役式可表示教导、指引或指示；“指教”兼具教导与引导意味，适合智慧诗歌的庄重语体。
- source_word: בְּדֶרֶךְ זוּ תֵלֵךְ
  choice: 当走的路
  rationale: 原文近于“你将走的这条／那条路”，但在训诲语境中表达应当行走的道路。“当走的路”自然传达指导的语力，同时以脚注保留原文可能具有的直陈将来意义及指示词含义。
- source_word: אִיעֲצָה
  choice: 我要劝导你
  rationale: יעץ意为出谋、劝告。“劝导”既保留提供忠告的意义，也与全节的教导语境协调。
- source_word: עָלֶיךָ עֵינִי
  choice: 我的眼目看顾着你
  rationale: 原文直译为“我的眼目在你身上”。正文保留“眼目”的意象，并用“看顾着”自然表达专注留意、守望引导或关怀的可能意味；直译见脚注。
theological_decisions:
- issue: 诗篇32:8说话者的身份
  choice: 正文保持第一人称，不明说说话者是耶和华还是诗人。
  alternative: 明确译为耶和华说话，或明确理解为诗人在对听者说话。
  rationale: 本节希伯来文本本身没有点明说话者。保持第一人称可保留文本的开放性，避免在翻译中解决属于释经层面的问题。
- issue: “我的眼目在你身上”的功能
  choice: 译作“我的眼目看顾着你”，并在脚注保留直译及多重可能。
  alternative: 译作“我要定睛劝导你”或“我要注视着你给你劝告”。
  rationale: 希伯来语短语结构简练，其与“劝导”的确切句法关系及语用色彩并非完全单一；正文表达自然的守望关怀，脚注保留其可表示留心引导或专注看顾的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使你明白—指教你—劝导你”保留原文三个相关但不完全相同的教导动作；“眼目”保留诗歌意象，“看顾着”则避免生硬直译。所有解释性补足均尽量受上下文约束，并用脚注标示原文的替代读法。
