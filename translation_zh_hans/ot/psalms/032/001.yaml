  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/001.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: zh_hans
  text: '大卫的玛斯基勒[a]。


    过犯蒙赦免[b]、罪被遮盖的人有福了！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛斯基勒”是希伯来文诗篇标题用语，确切含义不明；可能指训诲性或默想性的作品。
    reason: cultural_note
  - marker: b
    text: “蒙赦免”原文直译可作“被举起”或“被带走”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 诗题中介词 לְ 与人名连用，可表示作者、归属或关联。“大卫的”在现代汉语中自然简洁，同时不把这种关系限定为单一含义。
- source_word: מַשְׂכִּיל
  choice: 玛斯基勒
  rationale: 这是诗篇标题中的术语，确切含义和功能不明。采用音译可避免在正文中武断译作“训诲诗”或“默想诗”，并由脚注说明可能含义。
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 该形式在这里是宣告或赞叹某人处于蒙福的景况。“有福了”既自然庄重，也保留了其宗教和诗歌意味。
- source_word: נְשׂוּי
  choice: 蒙赦免
  rationale: 该词源自动词 נשׂא，基本意象是“举起、承担、带走”；与“过犯”搭配时，惯用意义是罪责获得赦免。正文采用清楚自然的意义译法，字面意象保留在脚注中。
- source_word: פֶּשַׁע
  choice: 过犯
  rationale: 此词常指对权威或约的蓄意违逆。“过犯”既能表达越界违背，也与下句“罪”形成合宜的诗歌平行。
- source_word: כְּסוּי
  choice: 被遮盖
  rationale: 这是 כסה 的被动分词，直译为“被遮盖”。保留这一比喻，并与前句“蒙赦免”构成平行。
- source_word: חֲטָאָה
  choice: 罪
  rationale: 在这里与“过犯”平行，所指是道德上的罪，而不是“赎罪祭”。
theological_decisions:
- issue: 福语所指对象的单数与性别
  choice: ……的人有福了
  alternative: 有福的是那人／……的人们有福了
  rationale: 希伯来文所指在语法和意义上是代表性的单数，但并非特指男性。“……的人”保留单数泛指，又不额外加入男性限定。
- issue: 诗题术语 מַשְׂכִּיל 的处理
  choice: 正文音译为“玛斯基勒”
  alternative: 训诲诗／默想诗
  rationale: 此术语的确切意义及礼仪或文学功能仍有不确定性。音译并加注能保留这种真实歧义，不把某一种解释写入正文。
- issue: 赦免罪过的意象
  choice: 正文译“蒙赦免”，脚注保留“被举起／被带走”的字面意象
  alternative: 过犯被带走／过犯被举起
  rationale: 在此搭配中，词语表达赦免，但其“举起、承担、带走”的意象可能具有神学和诗歌价值。意义译法保证正文清楚，脚注则避免抹去原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。诗题以“大卫的玛斯基勒”连成自然的汉语名词短语；正文保留两句被动结构的平行，并以“有福了”呈现福语的赞叹语气。
