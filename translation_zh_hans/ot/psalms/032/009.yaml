  text: אַל תִּֽהְי֤וּ כְּ/ס֥וּס כְּ/פֶרֶד֮ אֵ֤ין הָ֫בִ֥ין בְּ/מֶֽתֶג וָ/רֶ֣סֶן עֶדְי֣/וֹ לִ/בְל֑וֹם בַּ֝֗ל קְרֹ֣ב אֵלֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/009.yaml
  text: Do not be like a horse or like a mule[a], without understanding, whose trappings are bit and bridle to restrain it, or else it will not come near you.
translation:
  language: zh_hans
  text: 你们不要像没有悟性的马或骡子；它的装具是嚼环和辔头，用来约束它；不然，它就不肯靠近你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句末尾的希伯来文较难确定，也可译作：“它的装具是嚼环和辔头，用来约束它，免得它靠近你。”正文理解为牲畜若不受约束，就不肯靠近；另一种理解则是必须约束它，免得它冲近。原文此处的“你”是单数。
    reason: 保留末句的句法歧义，并说明人称由前面的复数转为单数。
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: 你们不要像
  rationale: אַל加未完成式构成禁止语气；动词为复数，故译出“你们不要”。与后面的比较结构合译，使现代汉语自然。
- source_word: כְּסוּס כְּפֶרֶד
  choice: 像……马和骡子
  rationale: 两个כ比较结构分别引出“马”和“骡子”；中文以“像……马和骡子”简洁保留并列意象。
- source_word: אֵין הָבִין
  choice: 无知的
  rationale: 该短语指缺乏理解力或辨识力；“无知的”通俗凝练，并在此处修饰马和骡子。
- source_word: בְּמֶתֶג וָרֶסֶן
  choice: 用嚼环和辔头
  rationale: מֶתֶג与רֶסֶן是控制牲畜的口衔、笼头或缰辔一类装具；“嚼环和辔头”既保留两个名词，也符合中文畜具用语。
- source_word: עֶדְיוֹ
  choice: 作装具
  rationale: 该词通常有装饰、佩饰之意，但在嚼环和辔头的语境中指套在牲畜身上的装备；“装具”保留具体形象而不把它误解为纯装饰。
- source_word: לִבְלֹם
  choice: 来约束
  rationale: 词义为勒住、制止或约束；“约束”准确表达嚼环和辔头的功能。
- source_word: בַּל קְרֹב אֵלֶיךָ
  choice: 否则就不肯靠近你
  rationale: 末句希伯来文结构艰深。正文采用牲畜若不受嚼环和辔头控制便不肯靠近人的理解；“你”为单数，保留原文由复数命令转为单数称呼的变化。
theological_decisions:
- issue: 末句说明牲畜不靠近，还是防止牲畜靠近
  choice: 正文译为“否则就不肯靠近你”
  alternative: “免得它靠近你”或“使它不能冲近你”
  rationale: בַּל קְרֹב אֵלֶיךָ的句法和逻辑关系存在真实歧义。正文采用与需要外在控制才服从相符的理解，同时以脚注保留另一种可能，不据神学立场消除张力。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“嚼环和辔头”保留古代牲畜装具的具体形象；分号呈现劝诫与解释之间的停顿。正文保留“你们”到“你”的人称变化，脚注予以说明。
