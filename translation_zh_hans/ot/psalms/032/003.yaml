source:
  edition: WLC
  text: כִּֽי הֶ֭חֱרַשְׁתִּי בָּל֣וּ עֲצָמָ֑/י בְּ֝/שַׁאֲגָתִ֗/י כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/003.yaml
  text: For when I kept silent[a], my bones wasted away through my groaning all day long.
translation:
  language: zh_hans
  text: 我缄默不语时，我的骨头因终日哀号[a]而衰残。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吼叫”。这个希伯来词常指猛兽的吼声，在这里表达痛苦而强烈的呼喊。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ……时
  rationale: כִּי 语义灵活；这里与第一人称完成式连用，引出诗人先前处境的时间背景。汉语用“……时”自然简洁，也不必把它限定为严格的因果关系。
- source_word: הֶחֱרַשְׁתִּי
  choice: 我缄默不语
  rationale: חרשׁ 在此意为保持沉默。“缄默不语”体现持续不说的状态，同时不在正文中擅自补出沉默所涉及的对象。
- source_word: בָּלוּ
  choice: 衰残
  rationale: בלה 表示磨损、衰败或耗尽。用于“骨头”时，“衰残”保留身体逐渐耗损的诗歌意象，又符合庄重的现代汉语。
- source_word: עֲצָמַי
  choice: 我的骨头
  rationale: 直译以保留希伯来诗歌借骨头表达整个人身心状况的身体意象。
- source_word: בְּשַׁאֲגָתִי
  choice: 因……哀号
  rationale: שׁאגה 本可指如猛兽般的吼叫，在这里描写痛苦而强烈的发声。“哀号”既传达声音的强烈，也符合诗篇的悲苦语境；介词 בְּ 表示伴随情状或导致耗损的经历，译作“因”使汉语关系清楚。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 自然、凝练地表达整天持续不断的意思，并保持诗体语感。
theological_decisions:
- issue: 是否明确说明诗人是对自己的罪缄默不言
  choice: 正文保留原文的隐含表达，不补出“对自己的罪”
  alternative: 我对自己的罪缄默不言时，我的骨头因终日哀号而衰残。
  rationale: 上下文暗示沉默与未承认的罪有关，但本节希伯来文本没有明说沉默的对象。保留省略可避免把上下文解释直接写入译文。
- issue: שַׁאֲגָה 应理解为兽吼般的叫声还是痛苦的呻吟哀号
  choice: 正文译作“哀号”，脚注保留“吼叫”这一较字面的可能表达
  alternative: 因终日吼叫而衰残
  rationale: 该词具有强烈、大声呼喊的色彩，并非轻微的叹息；“哀号”在本诗悔罪与痛苦的语境中较自然，同时脚注保存其原有的兽吼意象和词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“缄默不语”“终日”“衰残”略具诗体色彩，但普通读者容易理解。脚注标记置于其实际说明的“哀号”之后；英文咨询稿的标记虽附在“kept silent”后，注释内容实际针对 שַׁאֲגָה。
