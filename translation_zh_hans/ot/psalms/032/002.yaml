id: PSA.32.2
reference: Psalms 32:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי אָדָ֗ם לֹ֤א יַחְשֹׁ֬ב יְהוָ֣ה ל֣/וֹ עָוֺ֑ן וְ/אֵ֖ין בְּ/רוּח֣/וֹ רְמִיָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/002.yaml
  text: Blessed is the man to whom Yahweh does not count iniquity[b][a], and in whose spirit there is no deceit.
translation:
  language: zh_hans
  text: 耶和华不把罪孽算在他身上、心灵里也没有诡诈的人，是有福的！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”也可译作“罪”或“罪责”；“诡诈”也可译作“欺骗”或“虚假”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 是有福的
  rationale: 这是希伯来语诗体中的祝福宣告；译为“有福”既自然庄重，也避免把含义缩减为主观的快乐。
- source_word: אָדָם
  choice: 人
  rationale: 此处虽为阳性单数形式，却具有泛指作用；现代汉语“人”准确表达个体而不限定为男性。
- source_word: יַחְשֹׁב ... לֹו
  choice: 不把……算在他身上
  rationale: 保留חשב在此处的计算、归账意象，同时用普通读者易懂的现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中辨识度最高的专名译法，明确对应四字神名，而非以“主”替代。
- source_word: עָוֹן
  choice: 罪孽
  rationale: 该词可涵盖罪行、罪责及其后果；“罪孽”保留其道德重量，而不把语义单限定为罪责。
- source_word: בְּרוּחוֹ
  choice: 心灵里
  rationale: 这里的רוּחַ指人的内在性情或内心；“心灵”比单用“灵”更符合现代汉语，同时仍保留内在层面。
- source_word: רְמִיָּה
  choice: 诡诈
  rationale: 该词表示欺骗、虚假或奸诈；“诡诈”庄重且适合本节所强调的内在真诚，与单纯一次性的“欺骗”有所区别。
theological_decisions:
- issue: 泛指的阳性单数 אָדָם
  choice: 人
  alternative: 男子／这人
  rationale: 原文形式为阳性单数，但语用上泛指任何个体。中文“人”既保留单数个体的焦点，也不会误导为仅指男性。
- issue: 上帝不归算罪孽的账目意象
  choice: 不把罪孽算在他身上
  alternative: 不追究他的罪孽／不将罪归给他
  rationale: “算在……身上”保留原文的归算意象，而不把它扩展为某一后来的系统神学表述；同时没有消除עָוֹן可指罪行或罪责的张力。
- issue: רוּחַ所指的内在人
  choice: 心灵里
  alternative: 灵里／内心
  rationale: 语境强调人里面没有虚假；“心灵”自然表达内在性情，但不把רוּחַ完全等同于情绪或思想。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句序以前置关系分句突出蒙福之人的特征，并以“是有福的”收束祝福宣告；“耶和华”保留神名，“算在他身上”保留原文的账目意象。
