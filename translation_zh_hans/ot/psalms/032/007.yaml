source:
  edition: WLC
  text: אַתָּ֤ה סֵ֥תֶר לִ/י֮ מִ/צַּ֪ר תִּ֫צְּרֵ֥/נִי רָנֵּ֥י פַלֵּ֑ט תְּס֖וֹבְבֵ֣/נִי סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/007.yaml
  text: You are a hiding place for me[a]; from distress you preserve me; you surround me with shouts of deliverance[b]. Selah
translation:
  language: zh_hans
  text: '你是我的藏身之处；

    你保护我脱离困境；

    你以解救的欢呼声环绕我。[a]

    细拉。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “解救的欢呼声”也可译作“蒙救的歌声”或“脱险的响亮呼喊”。
    reason: lexical_alternative
  - marker: b
    text: “细拉”可能是音乐或礼仪用语，确切含义不明。
    reason: cultural_note
lexical_decisions:
- source_word: סֵתֶר
  choice: 藏身之处
  rationale: 该词指隐蔽或受保护之处。“藏身之处”在现代汉语中自然，也保留了诗中以神为避难所在的具体比喻。
- source_word: מִצַּר
  choice: 脱离困境
  rationale: צַר可指困苦、患难或窘迫处境；结合介词מִן，译作“脱离困境”既保留险境之意，也不限定为某个具体仇敌。
- source_word: תִּצְּרֵנִי
  choice: 你保护我
  rationale: נצר有看守、护卫、保全之意。“保护我”简洁自然，并与“藏身之处”的意象相呼应。
- source_word: רָנֵּי
  choice: 欢呼声
  rationale: רִנָּה的复数构造形式可指响亮而通常带喜乐意味的呼喊。“欢呼声”兼顾声音的强度和喜乐色彩，不将其过早限定为歌曲。
- source_word: פַלֵּט
  choice: 解救
  rationale: 该形式源于פלט，表达解救、逃脱或获救。“解救”保留救援含义，又避免加入后期神学术语。
- source_word: תְּסוֹבְבֵנִי
  choice: 你以……环绕我
  rationale: סבב意为环绕、围住。此译保留神为施事者以及诗人被四面环绕的图像。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词的确切意义不明，可能是音乐或礼仪记号，因此按中文圣经传统音译，不武断译成“暂停”或“间奏”。
theological_decisions:
- issue: 环绕诗人的“解救的欢呼声”由谁发出及具体性质
  choice: 译作“你以解救的欢呼声环绕我”，不说明欢呼者是谁
  alternative: 你使得胜的歌声环绕我；你以蒙救的歌声环绕我
  rationale: 希伯来语רָנֵּי פַלֵּט结构凝练，可理解为有关解救、因获救而发或带来解救的欢呼。正文保留这种诗意张力，不指定声音来自神、诗人还是敬拜群体。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；三个分句保持希伯来诗歌的平行推进。“困境”避免把צַר具体化为仇敌；“欢呼声”保留רָנֵּי既可能是歌唱也可能是呼喊的幅度。脚注标记均置于其所说明的正文之后。
