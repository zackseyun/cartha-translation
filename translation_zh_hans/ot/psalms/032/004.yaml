  text: כִּ֤י יוֹמָ֣ם וָ/לַיְלָה֮ תִּכְבַּ֥ד עָלַ֗/י יָ֫דֶ֥/ךָ נֶהְפַּ֥ךְ לְשַׁדִּ֑/י בְּ/חַרְבֹ֖נֵי קַ֣יִץ סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/004.yaml
  text: For day and night your hand was heavy upon me[a]; my vitality was dried up as by the heat of summer[b]. Selah
translation:
  language: zh_hans
  text: 因为你的手昼夜沉重地压在我身上；我的精力[a]在盛夏的干旱中枯竭了[b]。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精力”也可译作“体内的水分”或“生命的津液”。
    reason: lexical_alternative
  - marker: b
    text: 或较直译为：“我的精力在盛夏的干旱中变了样。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，说明诗人终日呻吟、精力衰败的原因；中文“因为”能自然表达这一解释关系。
- source_word: יוֹמָם וָלַיְלָה
  choice: 昼夜
  rationale: 保留表示持续不断的时间概括，语言简洁而庄重。
- source_word: תִּכְבַּד ... יָדֶךָ
  choice: 你……重压
  rationale: 保留“手沉重”的具体压力意象，同时以自然现代汉语表达其作用；不进一步界定这种神圣施压的性质。
- source_word: עָלַי
  choice: 在我身上
  rationale: 准确表达压力落在诗人身上，符合现代汉语习惯。
- source_word: נֶהְפַּךְ
  choice: 枯竭
  rationale: 该词本义为“转变、变成”；结合“精力/体液”和夏季干旱的语境，译为“枯竭”传达结果性含义，相关直译可能性由脚注保留。
- source_word: לְשַׁדִּי
  choice: 我的精力
  rationale: 该罕见词可指身体的汁液、水分或生命活力；“精力”在上下文中自然，并保留身体活力耗尽的意象。
- source_word: בְּחַרְבֹנֵי קַיִץ
  choice: 如同遭逢盛夏的干旱
  rationale: חרבוני指灼热造成的干燥或干旱；此译与“枯竭”的意象相连，并保留复数形式所表达的强烈、持续状态。
- source_word: סֶלָה
  choice: 细拉
  rationale: 按惯例音译这一含义未能确定的礼仪或音乐标记，不武断解释其功能。
theological_decisions:
- issue: 苦难中的神圣作用
  choice: 译文明确保留“你的手”持续重压诗人的表述
  alternative: 把本节泛化为没有明确神圣作用的一般痛苦，或强化为一套完整的惩罚教义
  rationale: 希伯来文明确把沉重的“手”归于受话者上帝，但本节没有详细说明这种施压的神学机制，因此既不淡化神的作用，也不作超出经文的教义推断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“昼夜”“细拉”保持诗体和礼仪色彩；“重压”“枯竭”使希伯来文的身体压力与干旱意象在中文中连贯可感。
