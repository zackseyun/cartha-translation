  text: עַל זֹ֡את יִתְפַּלֵּ֬ל כָּל חָסִ֨יד אֵלֶי/ךָ֮ לְ/עֵ֪ת מְ֫צֹ֥א רַ֗ק לְ֭/שֵׁטֶף מַ֣יִם רַבִּ֑ים אֵ֝לָ֗י/ו לֹ֣א יַגִּֽיעוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/006.yaml
  text: Therefore let every godly one pray to you at a time when you may be found[a]; surely when the great floodwaters come[b], they will not reach him.
translation:
  language: zh_hans
  text: 因此，凡敬虔的人都当在你可寻见的时候向你祷告[a]；诚然，众水的洪流也不会临到他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡敬虔的人都当为此在可寻见你的时候向你祷告。”
    reason: “为此／因此”与“可寻见的时候”的句法关系可有不同理解。
  - marker: b
    text: 直译：“在众多水的洪流中。”
    reason: 保留希伯来文“众多水”的洪流意象及其较贴近字面的表达。
lexical_decisions:
- source_word: עַל זֹאת
  choice: 因此
  rationale: 承接上文认罪蒙赦免之事，表达由此得出的劝勉；“因此”自然保留推论和因果联系。
- source_word: יִתְפַּלֵּל
  choice: 都当……祷告
  rationale: 此处未完成式在语境中带劝勉意味，用“当”表达合宜而不显生硬。
- source_word: כָּל חָסִיד
  choice: 凡忠信于你的人
  rationale: חָסִיד指以忠诚、敬虔为特征的人；“忠信于你的人”兼顾盟约忠诚的意味和现代汉语的可读性，避免带有特定教会传统色彩的称谓。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 准确表达祷告所指向的对象，不增补原文未明说的“神”。
- source_word: לְעֵת מְצֹא
  choice: 趁你可寻见的时候
  rationale: 按常见理解，将מצא作被动含义，指神可被寻见之时；“趁……的时候”自然传达及时祷告的劝勉，同时在脚注保留另一种句法关联。
- source_word: רַק
  choice: 即使
  rationale: 结合后面的洪水意象，以让步语气自然连接保护的应许；该粒子的确切语用存在弹性，不把它机械译为限制性的“只有”。
- source_word: לְשֵׁטֶף מַיִם רַבִּים
  choice: 洪水泛滥
  rationale: 原文直指“众水的奔流／泛滥”；此译在现代汉语中形象自然，并由脚注保留较贴近字面的表达。
- source_word: אֵלָיו לֹא יַגִּיעוּ
  choice: 也必淹不到他
  rationale: 保留水灾意象，并用自然汉语表达众水不能达到、触及此人的意思；不把诗歌比喻解释成更具体的灾难类型。
theological_decisions:
- issue: 保护应许中“他”的所指及洪水的性质
  choice: “他”指前文忠信祷告的人；保留洪水这一诗歌意象
  alternative: 理解为字面洪灾，或把“他”解作神
  rationale: 阳性单数代词אֵלָיו在近距离句法上最自然地回指“忠信的人”。众水在诗篇中可象征压倒性的患难或审判，但正文不将其解释性改写，以保留诗歌意象及其神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“忠信于你的人”比“圣徒”更少宗派色彩；“淹不到他”与洪水意象呼应，又不把比喻限定为单一历史事件。正文脚注标记[a]、[b]均已对应列出。
