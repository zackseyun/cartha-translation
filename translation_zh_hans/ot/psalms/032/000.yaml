  yaml_path: translation/ot/psalms/032/000.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: zh_hans
  text: '大卫的诗。玛斯基勒[a]。


    过犯被除去[b]、罪恶被遮盖的人有福了！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“玛斯基勒”，是一种诗篇标题，确切含义不明，可能指训诲性或默想性的作品。
    reason: cultural_note
  - marker: b
    text: 原文直译为“被举起”或“被带走”，在这里指得蒙赦免。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 介词短语可表示作者、归属或关联；正文采用诗篇标题中自然简洁的传统表达，同时不进一步断定其具体关系。
- source_word: מַשְׂכִּיל
  choice: “玛斯基勒”
  rationale: 这是含义不确定的诗篇标题术语；音译能避免把“训诲诗”或“默想诗”等推测直接写入正文。
- source_word: נְשׂוּי
  choice: 被除去
  rationale: 该词字面意象为“被举起、被带走”，在此表示过犯不再归在此人身上；“被除去”既自然，也比单写“获赦免”更多保留原文意象。
- source_word: כְּסוּי
  choice: 被遮盖
  rationale: 直译原文的遮盖意象，并保留它与前一分句“被除去”的诗性平行。
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 表达蒙福、值得称羡的状态，符合诗篇祝福语的庄重语体。
theological_decisions:
- issue: 过犯蒙赦免的意象
  choice: 正文译作“过犯被除去”，脚注说明字面含义及“得蒙赦免”的语境义
  alternative: 过犯得蒙赦免
  rationale: 原文以“举起、带走”表达赦免；保留这一意象可避免抹平诗句与下一行“遮盖”的并列张力。
- issue: “罪恶被遮盖”的含义
  choice: 保留“被遮盖”
  alternative: 罪恶得赦免／不被追究
  rationale: 原文确用遮盖意象；不在译文中把它解释为特定的赎罪机制或仅仅等同于隐瞒罪恶。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“玛斯基勒”以音译保留标题术语的不确定性；正文两行保留“除去／遮盖”的平行意象。所有脚注标记均置于其所解释的词语之后。
