  yaml_path: translation/ot/psalms/032/010.yaml
  text: Many pains belong to the wicked[b][a], but steadfast love surrounds the one who trusts in Yahweh.
translation:
  language: zh_hans
  text: 恶人有许多痛苦[a]；但倚靠雅威的人，有忠贞的慈爱[b]环绕他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “痛苦”也可译作“愁苦”或“苦难”。希伯来语此词可指身体的疼痛、内心的忧伤或所受的苦楚。
    reason: lexical_alternative
  - marker: b
    text: “忠贞的慈爱”所译的希伯来语词也可译作“怜悯”、“慈爱”或“信实之爱”；此词兼有慈爱、忠诚和持久不变的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: 许多
  rationale: 保留原文置于句首的数量强调，同时符合现代汉语表达。
- source_word: מַכְאוֹבִים
  choice: 痛苦
  rationale: 该复数名词可指身体疼痛、内心愁苦或所受苦难；“痛苦”在汉语中具有相近的语义宽度。
- source_word: לָרָשָׁע
  choice: 恶人有
  rationale: 介词ל在此表示归属或临到的关系；以“恶人有许多痛苦”自然呈现原文的名词性陈述，不额外说明痛苦的成因。
- source_word: וְהַבּוֹטֵחַ
  choice: 但倚靠……的人
  rationale: 分词在此作名词用，指“倚靠的人”；连接词按上下句的鲜明对比译为“但”。
- source_word: בַּיהוָה
  choice: 倚靠雅威
  rationale: בטח与介词ב连用表示信赖、倚靠；יהוה按其专名译作“雅威”。
- source_word: חֶסֶד
  choice: 忠贞的慈爱
  rationale: 兼顾该词所包含的慈爱、忠诚与持久信实，避免只译作“怜悯”而缩窄含义。
- source_word: יְסוֹבְבֶנּוּ
  choice: 环绕他
  rationale: 该动词表示环绕、围住；三单阳性宾语后缀指前述倚靠雅威的人。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地音译该专名，同时不以称号代替。
- issue: רָשָׁע的代表性阳性单数
  choice: 恶人
  alternative: 邪恶的男子
  rationale: 此处为泛指的一类人，并非特指某一男性；“恶人”既保留单数类称功能，也不无端限定性别。
- issue: חֶסֶד的神学语义范围
  choice: 忠贞的慈爱
  alternative: 怜悯
  rationale: 原词兼有慈爱、忠诚和信实的意味；译文保留这种丰富性，却不强行加入原句未明说的“圣约”一词。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“恶人有许多痛苦”保留原文简洁的名词性判断，不擅自改成因果或将来结果；后半句保持“慈爱”为环绕动作的主体。
