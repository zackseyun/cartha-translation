  text: How they became a desolation in a moment! They came to an end[b][a]; they were consumed by terrors.
translation:
  language: zh_hans
  text: 他们竟在顷刻间成了荒凉！他们灭尽了[a]，因惊恐而灭绝净尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灭尽了”或译“消灭了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: 竟
  rationale: 这里是感叹性的修辞表达，并非询问信息；“竟”自然传达诗人面对骤然逆转时的震惊。
- source_word: הָיוּ לְשַׁמָּה
  choice: 沦为荒凉
  rationale: הָיוּ 与 לְשַׁמָּה 构成结果性表达，强调从原有境况转为毁坏荒凉；“沦为”体现转变，“荒凉”保留 שַׁמָּה 的核心意象。
- source_word: כְרָגַע
  choice: 在顷刻间
  rationale: כְ 在此形成表示极短时间的惯用表达；“顷刻间”兼具突发性和诗歌庄重感。
- source_word: סָפוּ
  choice: 灭亡了
  rationale: 该词表示终结、消亡；“灭亡了”简洁地表达其结局，又不额外限定灭亡方式。
- source_word: תַמּוּ
  choice: 彻底消逝
  rationale: 该词与 סָפוּ 构成同义递进，着重完全终结；“彻底消逝”既体现完全性，也避免口语化的“被收拾掉”。
- source_word: מִן בַּלָּהוֹת
  choice: 因种种惊恐
  rationale: בַּלָּהוֹת 是复数，指令人战栗的恐怖或惊恐之事；מִן 在语境中可表示导致结局的原因，“因”保留这种因果关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。保留原文两个终结动词的平行递进，并以感叹句呈现 אֵיךְ 的震惊语气；不将“惊恐”具体解释为某种特定审判方式。
