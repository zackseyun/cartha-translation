- from: 他们竟在顷刻间沦为荒凉！他们灭亡了[a]，因种种惊恐而彻底消逝。
  to: 他们竟在顷刻间成了荒凉！他们灭尽了[a]，因惊恐而灭绝净尽。
  rationale: 将“消逝”改为“灭绝净尽”，以准确呈现第二个终结动词的完全性，并保留与“灭尽了”的同义递进。将“沦为荒凉”简化为“成了荒凉”，使诗体汉语更顺畅，同时维持原文的结果性表达与含蓄的惊骇意味。
