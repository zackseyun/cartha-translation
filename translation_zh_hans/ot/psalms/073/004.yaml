  text: כִּ֤י אֵ֖ין חַרְצֻבּ֥וֹת לְ/מוֹתָ֗/ם וּ/בָרִ֥יא אוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/004.yaml
  text: For they have no pains until death, and their body is fat.
translation:
  language: zh_hans
  text: 因为他们死时没有痛苦[a]，他们的身体健壮[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死时”：原文此处的词也可按上下文理解为“直到死时”；首个名词的确切含义也有讨论，可指痛楚或束缚。
    reason: 保留 לְמוֹתָם 的时间理解及 חַרְצֻבּוֹת 的词义不确定性，不在正文中加入未明说的时间范围。
  - marker: b
    text: “身体”所对应的原文词罕见，词义不完全确定；也有人理解为“力量”。
    reason: 说明 אוּלָם 的词义争议，同时保留正文中合乎上下文的传统理解。
lexical_decisions:
- source_word: חַרְצֻבּוֹת
  choice: 痛苦
  rationale: 该词可指束缚、痛楚或剧痛；在死亡语境中译作“痛苦”自然且不过度限定为某一种疼痛。
- source_word: לְמוֹתָם
  choice: 直到死时
  rationale: 介词 לְ 与“他们的死亡”结合，语义可理解为临到死亡、在死亡之际；依本句对恶人安逸境况的描写，采用“直到死时”，同时以脚注保留“死时”的可能。
- source_word: בָרִיא
  choice: 肥壮
  rationale: 本义为肥、丰壮，此处描述外在健康兴盛；“肥壮”保留古代以肥硕象征康健富足的表达。
- source_word: אוּלָם
  choice: 身体
  rationale: 此处形式罕见、词义不完全确定；结合 בָרִיא，传统上理解为身体或躯体，译作“身体”最符合上下文，并用脚注注明另一种理解。
theological_decisions:
- issue: 恶人是否在死亡过程中也全无痛苦
  choice: 直到死时也没有痛苦
  alternative: 他们死时没有痛苦
  rationale: 原文介词短语存在范围歧义。正文依诗人对恶人一生顺遂的观察表达“直到死时”，不将其扩展为关于所有恶人死亡状态的绝对教义；脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“肥壮”保留希伯来诗歌中以肥硕表现康健与兴盛的意象；两个脚注分别交代时间关系和罕见名词的歧义。
