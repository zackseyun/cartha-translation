  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אַ֤ךְ ט֭וֹב לְ/יִשְׂרָאֵ֥ל אֱלֹהִ֗ים לְ/בָרֵ֥י לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/001.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to those pure in heart.
translation:
  language: zh_hans
  text: 亚萨的诗。神实在善待以色列，善待内心纯洁的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可把“内心纯洁的人”理解为对“以色列”的具体说明。
    reason: 原文中“以色列”和“内心纯洁的人”均由 לְ 引出；二者可理解为并列对象，也可理解为后者说明前者。正文不以“就是”或“也”预先决定其关系。
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中的常用体裁词；中文以“诗”简洁、自然，也符合《诗篇》的文学语境。
- source_word: לְאָסָף
  choice: 亚萨的
  rationale: 标题中的 לְ 可表示作者、归属、关联或用途；“亚萨的”在现代中文中自然，并保留这种关系上的一定含混性。
- source_word: אַךְ
  choice: 实在
  rationale: 此处用作强调肯定的语篇标记，宣告全诗的核心确信；“实在”庄重而自然，未取可能不合本句语境的限制义“惟独”。
- source_word: טוֹב
  choice: 恩待
  rationale: 原词基本义为“好”，在“神对某人是好/有益”的结构中包含善意和施恩的行动；“恩待”比直译“是好的”更符合现代汉语，同时保留其惠益意味。
- source_word: לְיִשְׂרָאֵל
  choice: 恩待以色列
  rationale: 介词 לְ 表示对象或受益者；融入谓语译为“恩待以色列”，符合现代汉语表达。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处为单数意义，指以色列的神；译作“神”准确且通行。
- source_word: לְבָרֵי לֵבָב
  choice: 那些内心纯洁的人
  rationale: בָרֵי 表示纯净、清洁，לֵבָב 指人的内在思想、意愿和品格；“内心纯洁”自然传达其伦理与内在含义。
theological_decisions:
- issue: “以色列”与“内心纯洁的人”的关系
  choice: 以同位说明处理：“就是那些内心纯洁的人”
  alternative: 把两者理解为并列的两个受惠群体：“恩待以色列，也恩待内心纯洁的人”
  rationale: 两个带 לְ 的短语在希伯来诗句中很自然地可构成重述或具体说明。正文采用“就是”呈现较可能的同位关系，但脚注保留并列理解，以免把句法及其神学张力绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“亚萨的诗”保留标题关系的含混性；正文用“实在”表达郑重确信，用“恩待”自然呈现神对以色列为善的关系。
