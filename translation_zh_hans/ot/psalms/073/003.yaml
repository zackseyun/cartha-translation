    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，说明诗人险些失脚的原因，保留因果关系。
- source_word: קִנֵּאתִי
  choice: 就嫉妒
  rationale: קנא在此指因别人境遇优越而心生嫉妒；用“就”自然连接所见与内心反应。
- source_word: בַּהוֹלְלִים
  choice: 那些狂傲的人
  rationale: הוללים在此指自夸、傲慢之人；“狂傲”既表达其张扬，也体现其道德姿态。
- source_word: שְׁלוֹם
  choice: 安享太平
  rationale: שלום的基本语义是平安、安稳，也可涵盖福祉与顺遂；此处结合“安享”表达恶人表面上安逸无忧的处境，同时保留“太平”的核心意象。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 诗篇与智慧文学中对该道德类别的常规、凝练译法。
- source_word: אֶרְאֶה
  choice: 我看见
  rationale: 虽为未完成式，此处表达引发嫉妒的所见情形；译为“我看见”符合汉语叙述，也不额外限定为一次性观看。
