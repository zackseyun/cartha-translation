  yaml_path: translation/ot/psalms/073/012.yaml
  text: Behold[a], these are the wicked, always at ease[b]; they increase in wealth.
translation:
  language: zh_hans
  text: 看哪，这些恶人长久安逸[a]，他们的财富不断增多[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永远安逸”或“长久安稳”。原文直译近于“永远安逸的”，在这里指持续的安逸或安稳。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们取得了财富”或“他们积聚了财富”。原文动词既可侧重取得，也可侧重增长、积累。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、指示眼前事实的强调语气；“看哪”在现代中文圣经文体中庄重而易懂。
- source_word: אֵלֶּה
  choice: 这些
  rationale: 直接对应指示代词，指向上文所描述的那一类人。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 保留诗篇中带有道德判断的类别称谓，不额外引入宗派性含义。
- source_word: וְשַׁלְוֵי עוֹלָם
  choice: 他们总是安逸
  rationale: שָׁלֵו 表示安逸、安稳，עוֹלָם 在此表达持续长久；译文采用自然中文，同时以脚注保留“长久安稳”等可能理解。
- source_word: הִשְׂגּוּ
  choice: 不断增加
  rationale: 该动词可表示达到、取得，也可在此语境中表达积累或增长；结合恶人兴旺的上下文，正文采用“不断增加”，脚注保留“取得、积聚”的可能。
- source_word: חָיִל
  choice: 财富
  rationale: חַיִל 可指力量、能力、军队或资财；本节论恶人的兴盛，经济意义最切合语境。
theological_decisions:
- issue: 恶人安逸与兴盛所造成的张力
  choice: 直接陈述他们总是安逸、财富增加
  alternative: 添加“看似”或“暂时”等限定
  rationale: 原文在本节没有使用“看似”或“暂时”来缓和这一观察；保留诗人面对恶人兴盛时的真实张力，不提前用后文解释本节。
translation_notes:
  register: 采用现代、庄重而通顺的诗体散文。“看哪”保留原文的强调；冒号呈现后半句对“这些恶人”的具体说明。脚注标记按其实际所注词语分别置于“安逸”和“增加”之后。
