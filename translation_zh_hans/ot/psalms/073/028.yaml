source:
  edition: WLC
  text: וַ/אֲנִ֤י קִֽרֲבַ֥ת אֱלֹהִ֗ים לִ֫/י ט֥וֹב שַׁתִּ֤י בַּ/אדֹנָ֣/י יְהֹוִ֣ה מַחְסִ֑/י לְ֝/סַפֵּ֗ר כָּל מַלְאֲכוֹתֶֽי/ךָ׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/028.yaml
  text: But as for me[a], the nearness of God is good for me; I have made the Lord GOD my refuge, so that I may tell of all your works.
translation:
  language: zh_hans
  text: 然而，对我来说，亲近上帝是有益的[a]；我以主耶和华为我的避难所，为要述说你一切的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的临近对我有益。”希伯来语名词构词可指亲近上帝，也可指上帝的临近，或与上帝之间的亲近关系。
    reason: 保留קִרֲבַת אֱלֹהִים在关系方向上的词义歧义。
lexical_decisions:
- source_word: וַאֲנִי
  choice: 然而，对我来说
  rationale: 连词加独立代词承接上文，突出诗人与恶人的结局形成对比；此译法在现代汉语中自然表达转折和强调。
- source_word: קִרֲבַת אֱלֹהִים
  choice: 亲近上帝
  rationale: קִרְבָה表示临近、亲近或亲密关系。正文采用自然的汉语表达，同时用脚注保留其可理解为“上帝的临近”或与上帝关系亲近的歧义。
- source_word: לִי טוֹב
  choice: 对我来说……就是福分
  rationale: 该结构表示对诗人有益、是他的好处；“就是福分”比生硬的“是好的”更符合诗篇语体，也保留个人所得之益。
- source_word: שַׁתִּי
  choice: 我以……作
  rationale: 该动词意为放置、设立；与“避难所”连用时，表示诗人有意识地把主当作自己的倚靠。
- source_word: בַּאדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留אֲדֹנָי的称号“主”和יהוה所代表的神名；“主耶和华”是现代中文圣经语境中清楚而庄重的称呼。
- source_word: מַחְסִי
  choice: 我的避难所
  rationale: מַחְסֶה指躲避危险、获得庇护之处；“避难所”准确且符合诗篇惯用语。
- source_word: לְסַפֵּר
  choice: 为要述说
  rationale: 带ל的动词不定式在这里表达目的；“述说”兼具现代可懂性和庄重感。
- source_word: כָּל מַלְאֲכוֹתֶיךָ
  choice: 你一切的作为
  rationale: מְלָאכָה在此泛指上帝所做的事；“作为”比“工作”更适合赞颂上帝行动的语境，并保留כָּל“一切”。
theological_decisions:
- issue: קִרֲבַת אֱלֹהִים所表达的亲近方向
  choice: 正文译作“亲近上帝”，脚注保留“上帝的临近”
  alternative: 上帝的临近于我有益
  rationale: 希伯来语采用名词构造，既可能侧重诗人亲近上帝，也可能侧重上帝的临近或双方的关系亲近。正文选用自然汉语，但不把另一层含义静默排除。
- issue: 复合称呼אֲדֹנָי יְהוִה中的神名
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 此译既区分“主”这一称号与יהוה这一专名，也采用普通中文读者较熟悉且庄重的神名形式，不将两者压缩成一个泛称。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。“福分”“避难所”“述说”“作为”具有适度的经文庄严感，但不使用艰深文言。
