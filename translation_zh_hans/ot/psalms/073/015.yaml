  text: אִם אָ֭מַרְתִּי אֲסַפְּרָ֥ה כְמ֑וֹ הִנֵּ֤ה ד֭וֹר בָּנֶ֣י/ךָ בָגָֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/015.yaml
  text: If I had said[a], “I will speak thus,” behold, I would have betrayed the generation of your children.
translation:
  language: zh_hans
  text: 如果我曾说：“我要这样说”，看哪，我就背叛了你儿女这一代人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我就背叛了你儿女这一代人”也可译作“我就对你众子这一代人不忠了”。
    reason: 保留בָגָדְתִּי“背叛／不忠”的词义幅度，以及בָּנֶיךָ较字面的“众子”译法。
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: 如果我曾说
  rationale: אִם引出假设条件；完成式在此表达诗人回顾中未付诸行动的设想。“如果我曾说”既保留条件意味，也符合现代汉语表达。
- source_word: אֲסַפְּרָה כְמוֹ
  choice: 我要这样讲
  rationale: ספר在此不是专指逐项叙述，而是把前文那种看法说出来；כְמוֹ回指前述言论，因此译为自然而不加解释的“这样讲”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留希伯来语表示突然醒悟和强调的修辞停顿；“看哪”庄重且为普通读者所能理解。
- source_word: דּוֹר בָּנֶיךָ
  choice: 你众儿女的世代
  rationale: דּוֹר直译为“世代”；בָּנֶיךָ字面为“你的众子”，在这里指属上帝的群体，译作“众儿女”传达其集合性和代表性。
- source_word: בָגָדְתִּי
  choice: 我就是背叛了
  rationale: בגד表示以诡诈或不忠的方式对待某人；条件语境中的“就是……了”自然表达假设后果，同时“背叛”保留强烈的关系性不忠含义。
theological_decisions:
- issue: “你的众儿女”所指及诗人的行为性质
  choice: 理解为诗人向上帝说话，并承认若公开说出前文的疑惑，就是背叛属上帝的群体。
  alternative: 将בָּנֶיךָ较字面地译作“你的众子”，并将בגד译作“对……不忠”。
  rationale: 第二人称阳性单数后缀最自然地指向上帝；“众儿女”在汉语中可涵盖整个信仰群体，又不把原文限定为仅指男性。正文采用“背叛”，脚注保留“对……不忠”的词义可能。
translation_notes:
  register: 采用现代、庄重而可诵读的诗歌语言。“看哪”保留原文突出的修辞转折；“你众儿女的世代”略带希伯来诗歌结构感，以避免把דּוֹר弱化为泛指“人们”。脚注标记置于整句之后。
