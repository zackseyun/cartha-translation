  yaml_path: translation/ot/psalms/073/025.yaml
  text: Whom have I in heaven but you? And besides you[a], I desire nothing on earth.
translation:
  language: zh_hans
  text: 天上除你以外，我有谁呢？地上除你以外，我也无所爱慕。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“而与你同在，我在地上并不爱慕（别的事物）。”希伯来文此处措辞简省；“与你”同否定句及“在地上”的关系可有不同理解。正文按上下句的平行关系理解为：诗人除上帝以外，在地上别无所爱慕。
    reason: 保留 וְעִמְּךָ（字面为“而与你／同你”）的句法位置、未明说的宾语及其与下句成分关系的含混。
lexical_decisions:
- source_word: מִי לִי
  choice: 我有谁呢
  rationale: מִי是疑问代词，לִי直译为“对我、属于我”；二者在此构成存在或归属关系。译作“我有谁呢”既自然，也保留反问语气。
- source_word: בַשָּׁמָיִם
  choice: 天上
  rationale: שָׁמַיִם虽为复数形式，在这里指天上的领域；“天上”与下句“地上”形成简洁、自然的诗歌对仗。
- source_word: וְעִמְּךָ
  choice: 除你以外
  rationale: 字面义为“并且与你同在／有你相伴”。结合上下句的平行结构，这里表达对上帝的专一归属或愿望；正文采用自然的“除你以外”，并以脚注保留希伯来文的省略和字面可能性。
- source_word: לֹא חָפַצְתִּי
  choice: 我也无所爱慕
  rationale: חפץ可表示渴望、喜爱或以某事为乐。完成式在此表达诗人已经确立并持续持守的心志，中文用现在性的“无所爱慕”较为贴切；“也”体现两行之间的承接。
- source_word: בָאָרֶץ
  choice: 在地上
  rationale: 这里指与“天上”相对的尘世领域，而非特定土地；译作“在地上”保留天地对照。
theological_decisions:
- issue: 下半句中 וְעִמְּךָ 与否定句的关系
  choice: 理解为诗人在地上除上帝以外别无所爱慕
  alternative: 较字面地理解为“与你同在，我在地上并无所爱慕”
  rationale: 希伯来文措辞简省，未明说“任何事物”。正文依照与上半句的平行关系表达专一爱慕，但脚注保留“与你同在”的字面结构，避免把句法上的含混完全消除。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我有谁呢”保留反问力度；“无所爱慕”兼顾 חפץ 的愿望与喜爱含义，并维持诗句的敬虔语体。
