  text: וַ/אֲנִ֣י תָמִ֣יד עִמָּ֑/ךְ אָ֝חַ֗זְתָּ בְּ/יַד יְמִינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/023.yaml
  text: Yet I am continually with you[a]; you have held my right hand.
translation:
  language: zh_hans
  text: 然而，我常与你同在；你握住了我的右手。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你抓住了我的右手”。希伯来语动词既可着重抓握的动作，也可表达由此而有的扶持。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 然而，我
  rationale: 前缀连词结合独立代词，在上下文中带有转折意味；“然而，我”既保留强调，也自然承接诗人先前的困惑。
- source_word: תָמִיד
  choice: 常
  rationale: 表达持续、恒常的状态；“常”简洁庄重，符合诗歌语体，也不把时间意味限定得过死。
- source_word: עִמָּךְ
  choice: 与你同在
  rationale: 直接保留“与……同在”的陪伴、亲近含义，并维持原文由诗人说自己与神同在的表述方向。
- source_word: אָחַזְתָּ
  choice: 你握住了
  rationale: אָחַז表示抓住、握住；“握住了”兼顾抓握动作及其带来的扶持结果，也保留完成体的表达。
- source_word: בְּיַד יְמִינִי
  choice: 我的右手
  rationale: 按现代汉语习惯，将介词结构自然译为动词的宾语，同时保留“右手”的具体意象。
theological_decisions:
- issue: 神扶持行动的时体与持续意味
  choice: 你握住了我的右手
  alternative: 你抓住了我的右手／你一直握着我的右手
  rationale: 希伯来语完成式可指已经发生、而其结果仍具现实意义的行动。“握住了”不将其限定为纯粹过去，也不明确增添原文没有直说的持续体。
- issue: “我常与你同在”的关系方向
  choice: 保留第一人称主体：我常与你同在
  alternative: 你常与我同在
  rationale: 原文明确以“我”为主语。虽然上下文强调神的扶持，译文仍不倒转语法关系，以保留诗人主动依附于神与神主动扶持诗人之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“然而”显出上下文的转折；分号保留两小句的平衡关系。脚注标记置于相关分句末尾。
