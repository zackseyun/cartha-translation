  yaml_path: translation/ot/psalms/073/017.yaml
  text: until I entered the sanctuaries of God[b][a]; then I understood their end.
translation:
  language: zh_hans
  text: 直到我进入上帝的众圣所[a]，才明白他们的结局[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的圣所。”希伯来语采用复数形式“圣所”，可能集合性地指上帝神圣的区域。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们最终的归宿”或“他们的结果”。希伯来语所指的是他们最终的命运或结局。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: 直到
  rationale: 标示诗人困惑持续到某个转折点；与后面的“才”搭配，符合现代汉语表达。
- source_word: אָבוֹא אֶל
  choice: 我进入
  rationale: 在עַד引导的语境中指一次决定性的进入；“进入”自然表达朝圣圣空间内部而去。
- source_word: מִקְדְּשֵׁי אֵל
  choice: 上帝的众圣所
  rationale: 保留希伯来语复数形式，同时用“众”明确其复数性质；可集合性地指上帝神圣的处所或圣域。
- source_word: אָבִינָה
  choice: 才明白
  rationale: בין在此表达获得洞察；“才”与“直到”呼应，清楚呈现转折后的领悟。
- source_word: לְאַחֲרִיתָם
  choice: 他们的结局
  rationale: אַחֲרִית指最终的归宿或结果；“结局”简洁而有分量，并保留最终命运的意味。
theological_decisions:
- issue: מִקְדְּשֵׁי应按传统译成单数，还是保留希伯来语复数
  choice: 上帝的众圣所
  alternative: 上帝的圣所
  rationale: 依原文优先原则保留复数，不把它默认为传统单数；此复数可以集合性地指上帝的神圣区域，并不强制某一种教义解释。
- issue: אַחֲרִיתָם所指是一般结果还是最终命运
  choice: 他们的结局
  alternative: 他们最终的归宿／他们的结果
  rationale: “结局”既可表达最终结果，也可含命运意味，保留原词在结果与终局之间的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“直到……才……”自然呈现原句的转折关系；“众圣所”有意保留原文复数，并以脚注说明可作集合性单数理解。
