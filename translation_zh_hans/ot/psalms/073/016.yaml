  text: וָֽ֭/אֲחַשְּׁבָ/ה לָ/דַ֣עַת זֹ֑את עָמָ֖ל היא בְ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/016.yaml
  text: But when I thought to understand this[a], it was trouble in my eyes.
translation:
  language: zh_hans
  text: 但当我想要明白这事时，觉得实在劳苦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但当我思量要知道这事时，在我看来实在是劳苦。”
    reason: 保留לָדַעַת译作“知道”、עָמָל译作“劳苦”以及בְּעֵינַי译作“在我看来”的词义选择。
lexical_decisions:
- source_word: וָאֲחַשְּׁבָה
  choice: 但我思量……时
  rationale: חשׁב在此指思考、揣摩；与不定式לָדַעַת连用，表达试图在思想上把握此事。连接词ו在上下文中带转折意味，译为“但”。
- source_word: לָדַעַת
  choice: 要明白
  rationale: ידע基本义为“知道”，这里以“这事”为思想对象，语境重在理解、弄明白，故译为“明白”。
- source_word: זֹאת
  choice: 这事
  rationale: 指回上文令诗人困惑的问题。汉语补出“事”较自然，同时不具体限定所指。
- source_word: עָמָל
  choice: 令人苦恼
  rationale: עמל可指劳苦、艰辛、苦恼；此处描述理解此事所带来的痛苦困难，以“令人苦恼”表达其谓语作用及心理重负。
- source_word: הִיא
  choice: 它……实在
  rationale: 阴性代词回指זֹאת。汉语用“它”承接“这事”；“实在”体现判断的沉重语气，并非另增事实内容。
- source_word: בְּעֵינַי
  choice: 在我眼中
  rationale: 保留希伯来语“在我眼中”的形象，既可指个人观感，也可表达“对我而言”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的普通话；保留“在我眼中”的希伯来语意象，并以脚注呈现主要词义替代，不对诗人的困惑作神学化解释。
