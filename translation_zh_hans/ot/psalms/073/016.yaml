  naturalness: “我思量要明白这事时”在现代普通话中略显生硬；改为“当我想要明白这事时”更自然、庄重。以“觉得实在劳苦”表达“在我眼中”，可保留第一人称的评断而不硬译成不自然的结构。
  terminology: “明白”恰当传达לָדַעַת在语境中的理解义；“劳苦”可对应עָמָל，并保留脚注中的“知道／在我看来”等替代译法。
