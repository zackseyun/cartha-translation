  text: בַּ/עֲמַ֣ל אֱנ֣וֹשׁ אֵינֵ֑/מוֹ וְ/עִם אָ֝דָ֗ם לֹ֣א יְנֻגָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/005.yaml
  text: They are not in the trouble of mortal man[a], and they are not plagued with mankind.
translation:
  language: zh_hans
  text: 他们不像世人那样受苦，也不像众人那样遭灾。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们没有世人的劳苦，也不与众人一同受击打。”
    reason: 保留 עָמָל 可译为“劳苦”，以及 יְנֻגָּעוּ 较为直译的“受击打”，并呈现原文否定存在式和伴随结构。
lexical_decisions:
- source_word: בַּעֲמַל
  choice: 受苦
  rationale: עָמָל 可指劳苦、患难或困苦；本节描述恶人似乎免受常人之苦，“受苦”自然涵盖其重担与苦难之意。
- source_word: אֱנוֹשׁ
  choice: 世人
  rationale: אֱנוֹשׁ 可突出人的脆弱与必死性；“世人”在现代汉语中保留泛指凡人的意味，且与下半句“众人”形成诗意对应。
- source_word: אֵינֵמוֹ
  choice: 他们不像……那样
  rationale: 带第三人称复数后缀的否定存在式表示这种劳苦不临到他们；结合介词结构，译成比较式更符合自然汉语。
- source_word: וְעִם
  choice: 也不像……那样
  rationale: עִם 表示与……一同；此处以汉语比较结构表达他们没有与众人一同遭受灾患。
- source_word: אָדָם
  choice: 众人
  rationale: אָדָם 在此泛指人类整体；“众人”表达普遍人群，并避免与前半句完全重复。
- source_word: יְנֻגָּעוּ
  choice: 遭灾
  rationale: נגע 的被动形式表示受击打、受灾害或遭患难；“遭灾”简洁表达外来灾患临到人的意思，同时保留诗歌力度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；两个分句保持平行，并以“不像……那样”自然传达恶人似乎免于常人苦难的语境。
