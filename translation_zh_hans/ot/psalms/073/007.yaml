  yaml_path: translation/ot/psalms/073/007.yaml
  text: Their eyes bulge out from fatness[a]; the imaginations of their heart overflow.
translation:
  language: zh_hans
  text: 他们的眼睛因肥胖而凸出[a]；他们心中的想象越过限度。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的眼睛从肥脂中凸出；他们心中的构想漫溢。”
    reason: 保留מֵחֵלֶב表示来源的较字面译法，以及עָבְרוּ可表达“越过、漫溢”的词义范围；מַשְׂכִּיּוֹת也可译作“构想”。
lexical_decisions:
- source_word: יָצָא
  choice: 凸出
  rationale: 该动词本义为“出去、出来”；以“眼睛”为主语并与“肥脂”连用时，描绘眼睛向外突出的具体形象。“凸出”既自然，又保留原诗的身体意象。
- source_word: מֵחֵלֶב
  choice: 因肥胖
  rationale: חֵלֶב本指“脂肪、肥脂”。介词מִן可表达来源或原因；正文用“因肥胖”清楚传达肥脂使眼睛凸出的图景，同时在脚注保留更直译的可能。
- source_word: עֵינֵמוֹ
  choice: 他们的眼睛
  rationale: 复数名词带第三人称阳性复数后缀，直译为“他们的眼睛”。
- source_word: עָבְרוּ
  choice: 漫溢无度
  rationale: 该动词基本义为“越过、超过”。此处描述内心的构想越过界限；“漫溢无度”兼顾越界与充溢的诗性画面。
- source_word: מַשְׂכִּיּוֹת
  choice: 想象
  rationale: 该词可指形象、构想、念头或谋划。此处与“心”相连，“想象”保留其内在心思的宽泛含义，避免擅自限定为偶像或恶谋。
- source_word: לֵבָב
  choice: 他们心中
  rationale: 原文为单数“心”，未另带所属后缀，但语境自然指前述众人的内心。汉语用“他们心中”表达这一关系，并保持集合性的理解。
