  yaml_path: translation/ot/psalms/073/013.yaml
  text: Surely in vain I have kept my heart pure[b][a], and washed my hands in innocence.
translation:
  language: zh_hans
  text: '我实在徒然洁净了自己的心；

    又以清白洗了双手[b]。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “徒然”或译“白白地”“白费工夫”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在清白中洗我的手（直译：手掌）”；这是以洗手描绘道德上的清白，并非仅指身体的清洗。
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: 实在
  rationale: 此处是加强断言和反思结论的语气词；“实在”自然表达诗人带着苦涩所得出的结论，又不误解为狭义的“只是”。
- source_word: רִיק
  choice: 徒然
  rationale: 表达付出没有结果、没有益处；“徒然”简洁而有诗意，适合本节的哀叹语境。
- source_word: זִכִּיתִי
  choice: 我洁净
  rationale: 该动词在这里以“我的心”为宾语，指使之洁净或保持纯洁；“洁净”保留主动自洁的表达及道德含义。
- source_word: לְבָבִי
  choice: 自己的心
  rationale: “心”在此指人的内在生命及道德、意志中心；现代汉语仍能自然承载这一诗歌意象。
- source_word: וָאֶרְחַץ
  choice: 我……洗净
  rationale: 保留“洗”的具体动作，并与上半句“洁净自己的心”构成内外对应的平行结构。
- source_word: בְּנִקָּיוֹן
  choice: 以清白
  rationale: 原词可指洁净或无辜；“清白”突出语境中的道德无辜，同时保留与洗手意象之间有意形成的张力。
- source_word: כַּפָּי
  choice: 双手
  rationale: 字面为“双掌”，但在这一惯用意象中，现代汉语用“双手”更自然，也不损失原文意义。
theological_decisions:
- issue: 道德纯洁与礼仪洁净的关系
  choice: 保留洗手的具体意象，并用“清白”显示其主要指向道德上的无辜与纯洁。
  alternative: 将本句理解为主要描述礼仪性的洗濯，或直接意译为“我一直行为清白”。
  rationale: “心”与“双手”的平行，以及全诗关于义人与恶人结局的争辩，都表明这里不只是身体或礼仪上的洗净；但译文不消除洗濯意象，以免把可能包含的礼仪背景完全排除。
- issue: 诗人是否断言追求纯洁本身毫无价值
  choice: 按原文保留“实在是徒然”这一尖锐而暂时的结论。
  alternative: 弱化为疑问或解释为“我曾以为这一切徒然”。
  rationale: 本节直接陈述诗人在困惑中的判断；不提前用后文的领悟修正它，才能保留诗篇推进中的信仰张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。上下两行保留“心”与“双手”、“洁净”与“洗净”的平行；“以清白洗净双手”略带诗性，以保存原文不同寻常的洗手意象，并由脚注说明。
