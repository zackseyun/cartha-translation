  text: וָ/אֱהִ֣י נָ֭גוּעַ כָּל הַ/יּ֑וֹם וְ֝/תוֹכַחְתִּ֗/י לַ/בְּקָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/014.yaml
  text: For I was afflicted all day long[b][a], and chastened every morning.
translation:
  language: zh_hans
  text: 因为我终日受苦[a]，每天早晨都受管教[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受苦”或译“遭击打”或“遭灾”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“我的纠正（或责罚）在每天早晨”，意思是每天早晨反复受到管教。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: 因为我……受
  rationale: 带前缀的完成式承接上一节，语境中具有解释缘由的作用；“因为”自然表达这一关系，并保留第一人称陈述。
- source_word: נָגוּעַ
  choice: 受苦
  rationale: 该词表示被击打、遭灾或受折磨；“受苦”是自然、庄重且范围较广的现代汉语，不把苦难限定为疾病或某一种惩罚。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 准确表达整日持续之意，也保留诗歌语言的凝练。
- source_word: וְתוֹכַחְתִּי
  choice: 受管教
  rationale: 原文是带第一人称后缀的名词结构，直译近于“我的责罚／纠正”；在此与前句平行，表示诗人所经历的反复纠正或惩戒。“受管教”在汉语中自然，同时不局限于口头责备。
- source_word: לַבְּקָרִים
  choice: 每天早晨
  rationale: 复数“早晨”在这里具有逐次、反复的意义；“每天早晨”清楚传达这种分配性用法。
theological_decisions:
- issue: 苦难的性质
  choice: 采用概括性的受苦与管教用语，不具体认定为疾病或刑罚性震怒
  alternative: 译为遭瘟疫击打，或仅指受到言语责备
  rationale: 希伯来语同时使用了可指遭击打、受苦的广义词和可指纠正、责罚的名词；上下文没有充分限定苦难的具体形式，故保留其广度与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“终日”保持凝练；“每天早晨都”突出苦难反复临到。脚注标记均置于对应主文词语之后。
