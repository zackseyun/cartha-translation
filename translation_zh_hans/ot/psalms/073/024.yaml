  text: בַּ/עֲצָתְ/ךָ֥ תַנְחֵ֑/נִי וְ֝/אַחַ֗ר כָּב֥וֹד תִּקָּחֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/024.yaml
  text: With your counsel you guide me[a], and afterward you will receive me to glory.
translation:
  language: zh_hans
  text: 你用你的劝告引导我，随后必接我进入荣耀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“随后必以尊荣接纳我。”
    reason: 原文中“荣耀／尊荣”与“接我”的句法关系简约，可理解为目的地或伴随方式。
lexical_decisions:
- source_word: בַּעֲצָתְךָ
  choice: 以你的谋略
  rationale: עֵצָה可指谋略、劝告或计划；前缀בַּ在此表示凭借的方式。“以你的谋略”自然表达上帝借其谋略引导诗人。
- source_word: תַנְחֵנִי
  choice: 引导我
  rationale: נחה的使役式表示带领、引导；“引导”与前面的“谋略”搭配自然。
- source_word: וְאַחַר
  choice: 随后
  rationale: אַחַר在此作时间副词，指现今引导之后发生的事；“随后”简洁保留时间次序。
- source_word: כָּבוֹד
  choice: 荣耀
  rationale: כָּבוֹד既可指荣耀，也可指尊荣；正文采用“荣耀”，保留本句崇高且可能指向终末的意味，同时不把具体情形说死。
- source_word: תִּקָּחֵנִי
  choice: 必接我
  rationale: לקח可表示拿、带走或接去。此处“接我”既符合上帝作主语的语境，也比单纯“拿我”更自然；“必”表达未完成式在此处的将来指向。
theological_decisions:
- issue: אַחַר כָּבוֹד תִּקָּחֵנִי这一紧凑短语的含义
  choice: “随后必接我进入荣耀”
  alternative: “随后必尊荣地接纳我”
  rationale: 希伯来文没有明示相当于“进入”或“以”的介词，因此既可理解为被接入荣耀，也可理解为在尊荣中被接纳。正文采用符合诗篇趋向亲近上帝之脉络的“进入荣耀”，脚注保留“尊荣地”的可能，避免消除原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谋略”比“劝告”更能兼顾上帝的智慧计划；句式简洁，保留诗歌语气及原文末句的歧义。
