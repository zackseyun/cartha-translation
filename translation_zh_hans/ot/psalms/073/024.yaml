  terminology: “荣耀”适当地保留כָבוֹד的崇高、开放含义；脚注的“尊荣”准确呈现其另一常见语义。“接我”可表达לקח在此的接取、带去之意；“进入”是为汉语通顺所作的最小补足，并由脚注说明替代理解。
