  source_fidelity: 原文的时间推进（“随后”）和上帝引导、接取诗人的基本意思均已表达。惟“谋略”在现代汉语中常偏向策略、权谋或计策，未能最自然地表达עֵצָה在此处可指的“劝告／指引”；改为“劝告”更贴近原文及诗篇中上帝施行引导的语境。末句“接我进入荣耀”作为对紧凑希伯来语的一种自然理解可保留，脚注保留“以尊荣接纳”的替代句法理解。
