base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/000.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to the pure of heart.
translation:
  language: zh_hans
  text: '亚萨的诗。[a]


    神实在对以色列是良善的，对内心纯洁的人也是如此。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚萨的”也可理解为“属于亚萨的”或“为亚萨而作的”。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 指配以乐器吟唱的诗歌；在诗篇标题中译为“诗”，自然简洁。
- source_word: לְאָסָף
  choice: 亚萨的
  rationale: 介词 לְ 在标题中可表示归属、作者或相关对象；“亚萨的诗”保留一定宽度，并以脚注提示其他可能。
- source_word: אַךְ
  choice: 实在
  rationale: 此处为强调或断言语气，可译“实在、确实、诚然”；“实在”符合现代汉语诗体。
- source_word: טוֹב ... אֱלֹהִים
  choice: 神实在恩待
  rationale: 直译为“神对……是好的”；“恩待”在中文中自然表达神向人的良善行动，又不把后文的神学张力解释掉。
- source_word: לְיִשְׂרָאֵל
  choice: 以色列
  rationale: 按马所拉文本直译民族名称，不作文本校改。
- source_word: לְבָרֵי לֵבָב
  choice: 内心纯洁的人
  rationale: בַּר 表示清洁、纯净，לֵבָב 指内在思想、意愿与品格；译文兼顾清楚和庄重。
theological_decisions:
- issue: “以色列”与“内心纯洁的人”的关系
  choice: 用重复的“恩待”将两者并列呈现
  alternative: 将后者解释为“以色列中内心纯洁的人”
  rationale: 希伯来文可将后一个介词短语视为同位说明或进一步限定，但未明说“以色列中”；正文不强行限定二者关系。
- issue: 神的“良善”是属性陈述还是施恩行动
  choice: 译作“恩待”
  alternative: “神对以色列实在是良善的”
  rationale: 上下文聚焦神如何对待人；“恩待”较自然，但脚注保留更贴近表层句法的属性表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。标题独立成行，正文保留诗歌断言的简洁力度；不用教派化术语，也不把“以色列”与“内心纯洁的人”的关系解释得超过原文。
