  text: לָ֭/כֵן עֲנָקַ֣תְ/מוֹ גַאֲוָ֑ה יַעֲטָף שִׁ֝֗ית חָמָ֥ס לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/006.yaml
  text: Therefore pride is their necklace[a]; violence covers them like a garment.
translation:
  language: zh_hans
  text: 所以，骄傲是他们的项链[a]；暴力如衣裳裹住他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以，骄傲像项链一样环绕他们；暴力如衣裳将他们包裹。”
    reason: 原文颈饰意象的句法可理解为“骄傲是他们的项链”，也可动态表达为“骄傲像项链一样环绕他们”。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 作为承接上文的结果标记，译作“所以”自然清楚，并保留与前文的逻辑联系。
- source_word: עֲנָקַתְמוֹ
  choice: 成了他们的项链
  rationale: 该词源于表示颈饰、项链的词根；这里以项链为喻，描写骄傲如装饰般戴在他们颈上。
- source_word: גַאֲוָה
  choice: 骄傲
  rationale: 此处表示负面的自高与傲慢；“骄傲”是现代汉语中直接、自然且符合语境的表达。
- source_word: יַעֲטָף
  choice: 裹住
  rationale: 动词表达包裹、环绕之意；“裹住”保留原文鲜明的穿衣意象。
- source_word: שִׁית
  choice: 如衣裳
  rationale: 该名词指衣服或遮盖物；加“如”明确汉语中的比喻关系，同时不改变原文意象。
- source_word: חָמָס
  choice: 暴力
  rationale: 该词常指暴力以及由此体现的强暴不义；“暴力”最直接地保留本句的道德谴责。
- source_word: לָמוֹ
  choice: 他们
  rationale: 该代词指前文所说的恶人；在汉语句法中作为“裹住”的对象译为“他们”最自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“项链”与“衣裳”保留上下两行彼此呼应的穿戴意象；“裹住”比“遮盖”更贴近原文包裹、环绕的动作感。
