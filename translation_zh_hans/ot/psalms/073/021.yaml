lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词在此承接上文，为诗人的自白说明缘由；“因为”自然保留了解释性的因果关系。
- source_word: יִתְחַמֵּץ
  choice: 变得酸苦
  rationale: 该词本义涉及发酸、发酵，在此比喻内心变得苦涩。“酸苦”既保留原文的酸化意象，也传达怨愤痛苦的情绪。
- source_word: לְבָבִי
  choice: 我的心
  rationale: “心”是希伯来文对思想、情感和内在自我的常用表达；直译既自然，也保留其人观意象。
- source_word: וְכִלְיוֹתַי
  choice: 我的肾脏
  rationale: 原词字面指肾脏，在希伯来表达中可指人最深处的情感或肺腑。正文保留具体身体意象，并用脚注说明其比喻含义。
- source_word: אֶשְׁתּוֹנָן
  choice: 被刺痛
  rationale: 这是罕见的动词形式，表达受到尖锐刺扎般的伤害。“被刺痛”保留身体性的强烈意象，同时符合现代汉语表达。
