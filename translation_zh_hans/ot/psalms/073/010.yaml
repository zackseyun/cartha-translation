  text: לָ/כֵ֤ן ישיב עַמּ֣/וֹ הֲלֹ֑ם וּ/מֵ֥י מָ֝לֵ֗א יִמָּ֥צוּ לָֽ/מוֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/010.yaml
  text: Therefore his people turn back here[c][b][a], and waters of fullness are drained by them.
translation:
  language: zh_hans
  text: 因此，他的子民回到这里[a]，满盈的水被他们吸尽[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因此，他的子民被带回这里。”这里的动词既可理解为“回来／回转”，也可理解为“使……回来／带回”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“满盈之水”，可能指大量的水；这一意象较难确定。
    reason: lexical_alternative
  - marker: c
    text: 或译：“满盈的水为他们榨出。”这里的动词和末尾带后缀的介词形式都不易解释；本句也可能是说有丰盛的一份供应给他们，而不是水被他们吸尽。
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 表示由上文引出的结果，保留诗句的逻辑衔接。
- source_word: ישיב
  choice: 回到
  rationale: שוב 的使役形在此句法艰涩，既可理解为不及物的“回来／回转”，也可理解为及物的“使……回来”；正文采用较自然且不过度补出宾语的“回到”。
- source_word: עַמּוֹ
  choice: 他的子民
  rationale: 保留第三人称阳性单数后缀，不在正文中判定“他”究竟指谁。
- source_word: הֲלֹם
  choice: 这里
  rationale: 准确表达“这里／到这里”的方位意义，符合现代汉语。
- source_word: וּמֵי מָלֵא
  choice: 丰盈的水
  rationale: 原文直译近于“满盈之水”，意象不易确定；“丰盈的水”兼顾诗意、可读性和“充满／丰盛”的含义。
- source_word: יִמָּצוּ
  choice: 被……吸尽
  rationale: מצה 的被动形可表示“被吸尽、榨尽或排尽”；“吸尽”保留原文强烈而难解的意象。
- source_word: לָמוֹ
  choice: 被他们
  rationale: 在被动动词结构中按施事理解，但该介词也可能表示“给他们／为他们”，故另加脚注。
theological_decisions:
- issue: “他的子民”中“他”的所指
  choice: 正文保持不明确
  alternative: 可指恶人一方的人，也可指上帝的子民
  rationale: 希伯来语后缀没有明说先行词；上下文和本节句法均有困难，不宜在翻译中替读者作神学判断。
- issue: 水是被他们吸尽，还是为他们供应
  choice: 正文采用“被他们吸尽”
  alternative: “满盈之水为他们榨出／供他们饮用”
  rationale: 动词的被动形式和介词 לָמוֹ 容许不同句法理解；正文选择一种连贯读法，同时在脚注保留另一种重要可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“子民”保留 עַם 的群体色彩；“丰盈的水”“吸尽”保留原文难解的诗歌意象，不以解释性改写消除歧义。
