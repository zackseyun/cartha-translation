base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/026.yaml
  text: My flesh and my heart may fail[b][a], but God is the rock of my heart and my portion forever.
translation:
  language: zh_hans
  text: 我的肉身和我的心纵然衰残[a]，神却是我心里的磐石[b]，是我的福分，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的肉身和我的心衰残了。”希伯来语动词可表示衰败、耗尽或到了尽头；这里也可理解为当前或一般性的状况。
    reason: lexical_alternative
  - marker: b
    text: 或译：“神却是我心里的力量。”希伯来语直译为“我心的磐石”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: 衰残
  rationale: 该动词表示耗尽、衰败或到了尽头。用于“肉身”和“心”时，“衰残”既能涵盖身体衰弱和内在力量消退，也保留过程性与一般性，不把希伯来语的时体强限定为某一时间点。
- source_word: שְׁאֵרִי
  choice: 我的肉身
  rationale: שְׁאֵר虽可指肉、身体或亲属，但此处与“我的心”并列，所指是诗人的身体生命。“肉身”保留原文意象，又能与内在的“心”自然对应。
- source_word: לְבָבִי
  choice: 我的心／我心里
  rationale: לֵבָב指人的内在，包括思想、意志和情感。译作“心”既符合现代汉语的圣经语体，也保留原文两次出现该词所形成的呼应。介词结构“我心里的磐石”用自然汉语表达“我心之磐石”。
- source_word: צוּר
  choice: 磐石
  rationale: צוּר本义为岩石，用于神时比喻稳固、可靠与庇护。译作“磐石”保留具体意象，不将其缩减为单一的抽象含义“力量”。
- source_word: חֶלְקִי
  choice: 我永远的福分
  rationale: חֵלֶק指分得的一份、产业或所得。现代汉语中称神为人的“福分”，能自然表达神就是诗人所得、所拥有的那一份；“份额”过于生硬，“产业”则可能使读者只想到财物。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处指以色列的神，是诗人的直接信仰宣认；“神”是自然、庄重的现代汉语译法。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 该词表示无尽或恒久的延续。“永远”清楚自然，并与全句的诗歌语体相称。
theological_decisions:
- issue: 开头关于人之脆弱的表达
  choice: 我的肉身和我的心纵然衰残
  alternative: 我的肉身和我的心已经衰残／可能衰竭
  rationale: 原文动词可描述衰败、耗尽或走到尽头，其完成体在诗歌中未必只表示已经完成的事件。“纵然”使汉语读者看出前后两句的对比，也不把衰残明确限定为已经发生或仅仅可能发生。
- issue: צוּר用于神的比喻
  choice: 神却是我心里的磐石
  alternative: 神却是我心里的力量
  rationale: 原文采用具体的“磐石”意象，表达稳固、可靠与支撑；保留该比喻可避免将其神学内涵收窄为“力量”一个方面。
- issue: 神作为诗人的חֵלֶק
  choice: 是我永远的福分
  alternative: 是我永远的份／产业
  rationale: 这里宣认神自己就是诗人所得的那一份。“福分”在现代汉语中较自然，并保留关系性和敬虔含义；脚注说明其较直译的“份”义，以免遮蔽原文分配或产业的意象。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留“心”和“磐石”的圣经意象，并用“纵然……却……”自然呈现两小句之间明显但未以显式连词完全展开的对比。所有脚注标记均已置于正文相应位置。
