  text: וַ/אֲנִ֗י כִּ֭/מְעַט נטוי רַגְלָ֑/י כְּ֝/אַ֗יִן שפכה אֲשֻׁרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/002.yaml
  text: But as for me[a], my feet had almost stumbled; my steps had nearly slipped.
translation:
  language: zh_hans
  text: 至于我，我的双脚几乎失足；我的脚步险些滑跌。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: 但我
  rationale: 连接词与独立代词共同突出诗人与上文所述对象的对比；“但我”简洁自然，并保留转折和强调。
- source_word: כִּמְעַט
  choice: 几乎
  rationale: 表示某事差一点发生；译作“几乎”符合现代汉语表达。
- source_word: נטוי（据语境理解为 נטה 的屈折形式）
  choice: 失足
  rationale: 该词基本意象是倾斜、偏转；与“脚”搭配时表达脚步不稳、几乎偏离或跌倒。“失足”保留身体动作的比喻，也不把它明确解释为失去信仰或道德堕落。
- source_word: רַגְלָי
  choice: 双脚
  rationale: 保留原文具体的身体意象；现代汉语以“双脚”表达自然。
- source_word: כְּאַיִן
  choice: 险些
  rationale: 此处惯用义接近“几乎、差一点”；用“险些”既自然，又与前半句的“几乎”形成诗歌变化。
- source_word: שפכה（据传统读法理解为 שׁפך 的复数形式）
  choice: 滑跌
  rationale: 该动词基本义为倾倒、泼出；用于“脚步”时形成失去立足点的诗性意象。“滑跌”以自然汉语传达这一语境义。
- source_word: אֲשֻׁרָי
  choice: 脚步
  rationale: 指人的步履或步伐；“脚步”保留人生道路与稳定状态的隐喻空间。
theological_decisions:
- issue: 身体失稳意象所指的属灵或道德含义
  choice: 保留“双脚”“失足”“脚步”“滑跌”等具体意象，不明说其属灵含义
  alternative: 解释性译为“我几乎失去信心”或“我几乎在信仰上跌倒”
  rationale: 原文暗示诗人的生命、信心或道德状态濒临失稳，却未在本节限定具体所指；保留诗歌隐喻可维持原文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个分句结构平行，以“几乎／险些”避免机械重复；保留“脚”和“脚步”的具体诗歌意象。
