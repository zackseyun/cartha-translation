  text: כִּֽי הִנֵּ֣ה רְחֵקֶ֣י/ךָ יֹאבֵ֑דוּ הִ֝צְמַ֗תָּה כָּל זוֹנֶ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/027.yaml
  text: For behold[a], those far from you will perish; you destroy all who are unfaithful to you.
translation:
  language: zh_hans
  text: 因为，看哪，那些远离你的人必灭亡；凡对你不忠的人[a]，你都灭绝了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“如妓女般背离你的人”，是以妓女／淫乱的意象比喻在属灵或盟约关系上对神不忠。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人为何以亲近神为福，保留原文的因果、解释作用。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示语气及诗歌中庄重的强调作用。
- source_word: רְחֵקֶיךָ
  choice: 那些远离你的人
  rationale: 将形容词复数的实体用法自然译出，并保留人与神之间关系疏远的含义。
- source_word: יֹאבֵדוּ
  choice: 必灭亡
  rationale: אבד表示灭亡、归于败亡；“必”也传达此处断言的确定性。
- source_word: הִצְמַתָּה
  choice: 你都除灭了
  rationale: צמת的使役式表示使之灭亡或终结；希伯来语完成式按原貌译为“了”，与前句未完成式形成时态张力，同时可表达已确定的审判。
- source_word: כָּל
  choice: 凡……都
  rationale: 以自然汉语保留原文涵盖无一例外的范围。
- source_word: זוֹנֶה מִמֶּךָּ
  choice: 背弃你的
  rationale: 该分词与介词组合以淫乱比喻对神的不忠；“背弃”在正文中清楚传达关系及盟约层面的背离，又由脚注保留原始意象。
theological_decisions:
- issue: זנה用于人与神关系时的比喻含义
  choice: 正文译作“背弃你的”
  alternative: 直译为“离开你行淫的”或“对你不忠的”
  rationale: 上下文以远离神和亲近神相对照，故此处主要指属灵或盟约上的不忠。正文采用自然而有力度的现代汉语，脚注保留性方面不忠的希伯来比喻，避免抹平其先知性张力。
- issue: הִצְמַתָּה完成式的时间与断言功能
  choice: 译作“你都除灭了”
  alternative: “你都必除灭”或“你都除灭”
  rationale: 原文前句用未完成式“必灭亡”，后句用完成式。保留“了”可呈现这种形式差异，并容纳诗歌中以已成之事表达审判确定性的可能，不将其单一定为过去或未来。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“看哪”保留原文的郑重强调；分号呈现两行平行结构。脚注标记置于对应经文末尾。
