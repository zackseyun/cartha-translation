  naturalness: “凡背弃你的”在现代汉语中虽可理解，但省略中心词后略显悬置；“凡对你不忠的人”更完整自然。“你都灭绝了”比“你都除灭了”更合乎此处审判性诗歌语境，也更贴近צמת的“灭绝、消灭”之义。
  terminology: “对你不忠”恰当地表达此处相对于神的关系性、盟约性不忠，不将隐喻误读为字面的性罪行；脚注保留“如妓女般”的原文比喻，不抹平其修辞力量。
