  rationale: 修订使中文更完整自然，并在正文准确表达该隐喻的关系性含义；脚注则保留希伯来文的妓女／淫乱意象。第二句仍采用完成式“灭绝了”，可体现原文以既成事实表达审判确定性的诗歌用法，且不强行排除其确定的前瞻意味。
