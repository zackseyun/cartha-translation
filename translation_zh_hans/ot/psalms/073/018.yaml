  text: אַ֣ךְ בַּ֭/חֲלָקוֹת תָּשִׁ֣ית לָ֑/מוֹ הִ֝פַּלְתָּ֗/ם לְ/מַשּׁוּאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/018.yaml
  text: Surely you set them in slippery places[b][a]; you cast them down to ruin.
translation:
  language: zh_hans
  text: 的确，你把他们安置在滑地[a]，使他们坠入毁灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在光滑之处”。这里描绘的是容易滑倒、立足不稳的地方。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使他们坠入荒废之中”或“使他们坠入废墟”。原文名词为复数。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 的确
  rationale: 此处承接诗人的顿悟并加强断言，不宜译作限制性的“只是”；“的确”自然保留强调语气。
- source_word: בַּחֲלָקוֹת
  choice: 在滑地
  rationale: 字面指“光滑之处”，语境中的意象是脚下易滑、处境不稳；“在滑地”简洁保留这一空间隐喻。
- source_word: תָּשִׁית לָמוֹ
  choice: 你把他们安置
  rationale: שׁית 表示放置、安置；译文保留第二人称单数所表达的上帝直接行动，以及复数宾语“他们”。
- source_word: הִפַּלְתָּם
  choice: 使他们坠入
  rationale: נפל 的使役形表示“使……倒下/坠落”；“使他们坠入”明确保留使役意义，并与后面的结局自然衔接。
- source_word: לְמַשּׁוּאוֹת
  choice: 毁灭
  rationale: 该复数名词可指荒废、废墟或毁灭的状态；此处“毁灭”在现代汉语中自然，并保留审判所导致的终局意味。
theological_decisions:
- issue: 恶人败亡中的上帝主动作为
  choice: “你把他们安置……使他们坠入”
  alternative: 弱化上帝主动性的译法，如“他们站在滑地，终于坠落”
  rationale: 两个动词都以第二人称单数直接称呼上帝，原文明确把安置与坠落归于上帝的行动；译文不将这种神学张力淡化为纯粹的环境或自然后果。
- issue: “安置在滑地”是否暗示即时败亡
  choice: 保留“安置”与“使……坠入”两个连续而有区别的动作
  alternative: 合并为“你让他们因地滑而灭亡”
  rationale: 原文先描绘其所处位置，再陈述上帝使其坠落；保留两句结构，可呈现看似稳妥与实际危险之间的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“滑地”比“滑溜之地”简练，也比抽象的“险境”更能保留原文的具体意象；分句保持诗歌的紧凑和直接。
