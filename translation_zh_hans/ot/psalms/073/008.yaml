  text: They scoff and speak with malice[a]; from on high they speak oppression.
translation:
  language: zh_hans
  text: 他们讥讽，恶意地说话；他们从高处说出欺压的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们嘲弄，说邪恶的话；他们傲慢地说出欺压的话。”开头的希伯来语动词含义难定；“从高处”也可能不是指位置，而是表示高傲的说话姿态。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִיקוּ
  choice: 讥讽
  rationale: 该动词在此处词义难定；结合上下文中恶人的狂傲言语，“讥讽”可表达轻蔑、嘲弄的语气，同时不采用较具推测性的“败坏”。
- source_word: וִידַבְּרוּ
  choice: 说话
  rationale: 保留连接词所承接的言语行为；现代汉语无需再次明说主语。
- source_word: בְרָע
  choice: 恶意
  rationale: 介词与“恶”组成的短语可描述说话的方式或内容；“恶意说话”自然地传达其道德上的恶与敌意，又不把它限定为某一种恶言。
- source_word: עֹשֶׁק
  choice: 欺压
  rationale: 该名词指压迫、剥削或强取；“欺压”适合本节言语语境，并保留其社会伦理意味。
- source_word: מִמָּרוֹם
  choice: 从高处
  rationale: 按字面保留“从高处”的空间意象，让正文不预先断定它究竟指位置，还是比喻高傲的姿态；脚注说明后一可能。
- source_word: יְדַבֵּרוּ
  choice: 谈论
  rationale: 保留希伯来文第二次出现的“说”，以呈现平行和强调；译作“谈论”使现代汉语较为顺畅。
