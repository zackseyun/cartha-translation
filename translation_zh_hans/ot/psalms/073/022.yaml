  text: וַ/אֲנִי בַ֭עַר וְ/לֹ֣א אֵדָ֑ע בְּ֝הֵמ֗וֹת הָיִ֥יתִי עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/022.yaml
  text: Then I was senseless and did not know[a]; I was like a beast before you.
translation:
  language: zh_hans
  text: 那时，我愚顽无知；我与你同在时，竟如同牲畜[a]一般。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牲畜”在希伯来文中为复数形式，可能是集合性或加强性的说法，意思是“像牲畜一样”或“如同畜类”。
    reason: 说明原文复数形式及其可能的集合或加强用法。
lexical_decisions:
- source_word: וַאֲנִי
  choice: 那时，我
  rationale: 连词承接上文诗人的醒悟与回顾；“那时”自然表达其反思语气，又不把逻辑关系说得过满。
- source_word: בַעַר
  choice: 愚顽
  rationale: 该词不只是缺少知识，也含有像牲畜般迟钝、不明事理的贬义；“愚顽”能保留这种道德与认知层面的力度。
- source_word: וְלֹא אֵדָע
  choice: 无知
  rationale: 原文直译为“不知道”；与“愚顽”并列时，“无知”简洁自然，并保留诗句的自我谴责。
- source_word: בְּהֵמוֹת
  choice: 如同牲畜一般
  rationale: 原词形态上为复数，但此处可作集合或加强表达，描写诗人像无理性的牲畜；汉语用单数类称“牲畜”最自然。
- source_word: הָיִיתִי
  choice: 我……如同
  rationale: 该完成式描述诗人当时所处的状态，而非强调变成某种状态；汉语比喻句中无需机械译出“是”。
- source_word: עִמָּךְ
  choice: 在你面前
  rationale: 介词通常表示“与你同在”，但在此自我评估的语境中也可表达处于上帝面前；“在你面前”使汉语比喻自然，同时保留关系性的场景。
theological_decisions:
- issue: 诗人以牲畜自比的力度
  choice: 译为“我如同牲畜一般”，视为对自己愚顽无知的尖锐比喻。
  alternative: 直译为“我在你那里是牲畜”，或强化为“我在你面前像没有理性的畜类”。
  rationale: 本节是在上帝面前承认自己缺乏理解，并非对全体人性作系统性的教义判断。所选译法保留其谦卑和比喻的尖锐感，却不额外加入“没有理性”等解释。
- issue: עִמָּךְ 所表达的关系
  choice: 译为“在你面前”。
  alternative: 译为“与你同在”或“在你身边”。
  rationale: 原介词的基本义是“与”，而上下文也涉及诗人与上帝持续的关系；但本句强调他在上帝面前显得如牲畜般愚顽。“在你面前”是自然且语境相称的表达，不把它解释成空间上的“身边”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“愚顽无知”保留诗人自责的力度；“牲畜”比“野兽”更贴近 בְּהֵמוֹת 的常见词义，也与愚钝、缺乏理解的比喻相合。
