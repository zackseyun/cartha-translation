review_pass:
  verdict: revise
  source_fidelity: 译文整体准确呈现了梦醒与主醒起（起来行动）的对应，以及主对“他们的形象”的藐视。惟“形影”不是 צֶלֶם 的最直接现代汉语对应，容易转为“身影、踪影”之义；宜改为“形象”，以保留原文开放的“image/form”含义。
  naturalness: “醒起”在现代标准汉语中较不自然；“醒来时”自然、庄重，并保留与前句“人醒来时”的刻意诗歌呼应。
  terminology: “主啊”“必藐视”均适切。“他们的形象”比“他们的形影”更准确对应 צַלְמָם，且不把它解释为他们的荣华或幻影。脚注应同步使用同一术语。
  issues:
  - severity: medium
    issue: “形影”对应 צַלְמָם 不够准确
    rationale: “形影”在现代汉语通常指人的身影、形迹，或用于“形影不离”；而 צֶלֶם 的基本义是形象、形像、样式。译为“形象”既更贴近词义，也保留诗句所刻意未明说的指涉。
  - severity: low
    issue: “醒起”略显生硬
    rationale: 现代标准汉语通常说“醒来”或“苏醒”。本节上下文正以醒梦为喻，“你醒来时”可自然保留该呼应，不须引入较少用的“醒起”。
