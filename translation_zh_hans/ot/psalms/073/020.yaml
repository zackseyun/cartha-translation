  text: כַּ/חֲל֥וֹם מֵ/הָקִ֑יץ אֲ֝דֹנָ/י בָּ/עִ֤יר צַלְמָ֬/ם תִּבְזֶֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/020.yaml
  text: Like a dream when one awakes[a], Lord, when you rouse yourself, you will despise their image.
translation:
  language: zh_hans
  text: 如同人醒来时的梦，主啊，你醒来时必藐视他们的形象。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: 如同……梦
  rationale: 前缀 כ־表示比较，חֲלוֹם意为“梦”；用“如同”保留明喻，并使中文诗句自然。
- source_word: מֵהָקִיץ
  choice: 人醒来时
  rationale: 源自动词“醒来”，前缀 מ־在此可表达时间关系；“人醒来时”清楚呈现梦在醒来之际消逝的比喻。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝的称号及直接称呼；“主啊”符合现代中文祷告诗歌的庄重语体。
- source_word: בָּעִיר
  choice: 你醒起时
  rationale: 按与 עור“唤醒、醒起”相关的动词读法理解，既与上半句的“醒来”呼应，也符合诗篇语境中主起来施行行动的意思；“醒起”保留醒来与起来行动的双重色彩。
- source_word: צַלְמָם
  choice: 他们的形影
  rationale: צֶלֶם可指“形像、形态”；此处“形影”既保留外在形态之意，也传达梦境般短暂无实的意味，而不把所指解释得过死。
- source_word: תִּבְזֶה
  choice: 必藐视
  rationale: בזה意为“藐视、轻看”；未完成式在此具有将来指向，“必藐视”准确而庄重。
theological_decisions:
- issue: בָּעִיר的读法
  choice: 按动词理解为“你醒起时”
  alternative: 按地点名词理解为“在城中”
  rationale: 紧接“人醒来时的梦”这一比喻，动词读法形成明显的诗意呼应，也更符合上下文；但辅音文本确实允许“在城中”的读法，因此以脚注保留此歧义。
- issue: צַלְמָם所指
  choice: 译作“他们的形影”，不进一步限定
  alternative: 明确解释为“他们虚幻的荣华”或“他们的幻影”
  rationale: 原词本身是“形像、形态”，上下文虽暗示恶人的景况如梦般短暂，却未直接把该词等同于荣华；采用较开放的译法以保留诗意和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“醒起”略带诗性，用来呼应前句“醒来”，同时表达主起来行动；“形影”保留原文意象的开放性。
