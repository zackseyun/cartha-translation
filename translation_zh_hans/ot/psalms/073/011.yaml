  yaml_path: translation/ot/psalms/073/011.yaml
  text: And they say[b][a], “How does God know? Is there knowledge in the Most High?”
translation:
  language: zh_hans
  text: 他们说[a]：“神怎么知道？至高者[b]有知识吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们说了”；若将这里的希伯来语完成式理解为一般过去时，而不是对惯常言论的描述。
