  - marker: b
    text: 希伯来文直译为“在至高者里面有知识吗？”，意思是质问至高者是否具有知识。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: 他们说
  rationale: 希伯来语完成式在诗歌叙述中可描写反复或一贯的言论；结合本诗对恶人的持续刻画，现代汉语用现在时的“说”最自然，同时以脚注保留简单过去时的可能。
- source_word: אֵיכָה
  choice: 怎么会
  rationale: 该疑问副词意为“怎样、怎么”；在这里构成带有轻蔑和质疑语气的反问。“怎么会”符合现代汉语表达，同时不把问题改写成明确否认。
- source_word: יָדַע
  choice: 知道
  rationale: 采用常用义“知道”，并与后半句的“知识”保留词义上的呼应。
- source_word: אֵל
  choice: 神
  rationale: אֵל在此是对神的普通称谓，而非需音译的专名；译作“神”准确自然。
- source_word: וְיֵשׁ
  choice: 有……吗
  rationale: 存在词יֵשׁ在此处按疑问结构理解；现代汉语以“有……吗”自然表达其存在或拥有之意。
- source_word: דֵּעָה
  choice: 知识
  rationale: 该名词可指知识、认知或洞察；“知识”最直接，并保留与前句“知道”的词根呼应及讥讽式平行。
- source_word: בְעֶלְיוֹן
  choice: 至高者有
  rationale: 介词ב字面为“在……里面”，但此处表达知识是否存在于至高者之中，即至高者是否具有知识。正文采用自然汉语的领有结构，并由脚注说明原文措辞。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 这是强调神至高地位的神圣称号；“至高者”是准确、庄重且通行的现代汉语译法。
theological_decisions:
- issue: 神圣称号עֶלְיוֹן的译法
  choice: 至高者
  alternative: 至高的那一位
  rationale: “至高者”保留该称号对神无上地位的强调，简洁庄重，也不加入原文没有的宗派性解释。
- issue: 后半句是在断言还是发问
  choice: 译作疑问：“至高者有知识吗？”
  alternative: 译作陈述：“至高者有知识。”
  rationale: 上下文的质疑语气以及前半句的疑问使后半句最自然地延续为反问；不过希伯来语本身没有显式疑问词，句法张力主要由语境确定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怎么会知道”传达恶人带有轻蔑意味的反问；“至高者有知识吗”保持原文对“知道／知识”的平行。脚注标记均置于正文相应位置。
