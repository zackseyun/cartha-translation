  text: שַׁתּ֣וּ בַ/שָּׁמַ֣יִם פִּי/הֶ֑ם וּ֝/לְשׁוֹנָ֗/ם תִּֽהֲלַ֥ךְ בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/009.yaml
  text: They set their mouth against the heavens[b][a], and their tongue struts through the earth.
translation:
  language: zh_hans
  text: 他们张口攻击诸天[a]，舌头在地上横行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们把口置于诸天之中。”希伯来语介词直译为“在……中”，但上下文更可能是指他们狂妄地向天发言。
    reason: lexical_alternative
  - marker: b
    text: 或译：“舌头在地上行走。”希伯来语动词直译为“行走、来往”；正文用“横行”表现本节狂妄放肆的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתּוּ
  choice: 张口
  rationale: 该动词本义为“放置、安放”；与“口”连用时，直译在现代汉语中生硬。“张口”自然表达他们主动发言的动作，而敌对意味由“攻击诸天”及上下文体现。
- source_word: בַשָּׁמַיִם
  choice: 攻击诸天
  rationale: 介词字面为“在……中”，但本句描写恶人狂妄的言语；译作“攻击诸天”表达其话语公然指向天上的敌对意味。“诸天”保留希伯来语的复数形式和诗歌语体，同时以脚注保留字面理解。
- source_word: פִּיהֶם
  choice: 口
  rationale: 希伯来语使用带复数领属后缀的单数“口”，具有集合或代表性用法。汉语“他们张口”无需标明单复数，既自然又保持凝练。
- source_word: וּלְשׁוֹנָם
  choice: 舌头
  rationale: 原文为单数，代表他们的言语；汉语单数“舌头”可自然保留这一拟人化意象，并与上半句的“口”构成平行。
- source_word: תִּהֲלַךְ
  choice: 横行
  rationale: 该词字面为“行走、来往”。结合全诗所描写的狂妄姿态，“横行”既保留行动意象，也传达其言语肆无忌惮的语气；脚注同时给出较字面的译法。
- source_word: בָּאָרֶץ
  choice: 在地上
  rationale: 在运动动词语境中译作“在地上”符合现代汉语；“地”与上半句“诸天”形成天地对照，范围不局限于某一地域。
theological_decisions:
- issue: 恶人的口与诸天之间的关系
  choice: 译为“张口攻击诸天”
  alternative: “把口置于诸天之中”或“向着诸天张口”
  rationale: 原文介词允许字面空间意义，但上下文支持狂妄、敌对的言语指向天上。正文采用较符合语境的表达，脚注保留原文结构可能产生的另一理解，避免把歧义完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“张口攻击”清楚表达上半句的语境意义；“舌头在地上横行”保留原文拟人化和天地对照，并以脚注呈现较字面的可能译法。
