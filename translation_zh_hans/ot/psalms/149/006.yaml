base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/006.yaml
  text: The high praises of God are in their throat[a], and a two-edged sword is in their hand[d][c][b],
translation:
  language: zh_hans
  text: 他们喉中有对上帝的崇高赞美[a]，手中有两刃的剑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “崇高赞美”或译“尊崇的颂赞”“高昂的颂赞”。“喉中”直译希伯来语“在他们的喉咙中”。
    reason: 说明 רוֹמְמוֹת 的词义幅度，并保留 בִּגְרוֹנָם 的具体身体意象。
  - marker: b
    text: “两刃的剑”也可译为“双刃的剑”；字面是“有两口的剑”。“手中”的“手”在希伯来语中为单数，带复数后缀，可作集合用法，故也可理解为“他们手中”。
    reason: 说明 פִּיפִיּוֹת 的词义及 בְּיָדָם 的单数集合用法。
lexical_decisions:
- source_word: רוֹמְמוֹת
  choice: 颂扬……的歌声
  rationale: 该复数名词指高昂、尊崇的赞美；结合“在喉咙中”这一身体意象，译为“颂扬……的歌声”较符合现代汉语，同时保留赞美发声的画面。
- source_word: אֵל
  choice: 上帝
  rationale: 此处 אֵל 是指以色列之上帝的神圣称号；“上帝”在现代标准普通话中自然、庄重。
- source_word: בִּגְרוֹנָם
  choice: 充满他们的喉咙
  rationale: גרון 直指“喉咙”。用“充满”表达原文省略系词的名词句，保留鲜明的身体意象，不泛化为“口中”。
- source_word: וְחֶרֶב
  choice: 两刃的剑
  rationale: וְ 连接平行的第二分句；חֶרֶב 在此为非特指的“剑”，中文不必另加不定冠词。
- source_word: פִּיפִיּוֹת
  choice: 两刃的
  rationale: 该词字面涉及“两口”，在兵器语境中指有两面刃口；“两刃的剑”准确而有诗体感。
- source_word: בְּיָדָם
  choice: 握在他们手中
  rationale: 希伯来语“在他们的手中”以单数“手”配复数后缀，具有集合用法；汉语“他们手中”自然地保留这种表达。
theological_decisions:
- issue: 敬拜与武力意象并置
  choice: 照原文并列颂赞与两刃之剑，不将剑改译为隐喻
  alternative: 在正文中把剑解释为属灵或象征性的武器
  rationale: 原文以诗歌平行结构直接并置喉中颂赞与手中刀剑；翻译应保留这种张力，不在正文中替作者作神学解释。
- issue: 两个无动词分句的语气
  choice: 依诗篇上下文译作愿望式“愿……愿……”
  alternative: 译作陈述句“……在他们喉中，……在他们手中”
  rationale: 本节希伯来语自身无明示动词，既可作状态陈述，也可在149:5—9的劝勉语境中理解为愿望或号召；正文采用自然的愿望式，并以脚注保留陈述式可能。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。“喉咙”保留原文具体而强烈的身体意象；“两刃的剑”避免过度解释。以“愿……愿……”衔接诗篇相邻经文的劝勉语境，同时用脚注明确保留无动词名词句也可作陈述语气的可能。
