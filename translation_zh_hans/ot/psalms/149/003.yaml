  text: יְהַֽלְל֣וּ שְׁמ֣/וֹ בְ/מָח֑וֹל בְּ/תֹ֥ף וְ֝/כִנּ֗וֹר יְזַמְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/003.yaml
  text: Let them praise his name with dancing[c][b][a]; let them make music to him with tambourine and lyre.
translation:
  language: zh_hans
  text: 愿他们以舞蹈赞美他的名[a]；愿他们用手鼓和里拉琴[c]向他奏乐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在舞蹈中”或“随着舞蹈”。希伯来语 מָחוֹל 可指跳舞这一活动，也可指一支或一种舞蹈。
    reason: lexical_alternative
  - marker: b
    text: 或译“向他歌颂”。动词 זמר 既可指歌唱赞美，也可指用乐器奏乐。
    reason: lexical_alternative
  - marker: c
    text: 传统译作“竖琴”；希伯来语 כִּנּוֹר 更确切地指一种类似里拉琴的弦乐器。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַֽלְל֣וּ
  choice: 愿他们……赞美
  rationale: 该词是הלל的Piel未完成式，在诗歌语境中带劝勉或愿望语气；“愿他们”既保留这种意愿色彩，也符合现代汉语诗体。
- source_word: שְׁמוֹ
  choice: 他的名
  rationale: 原文明确说“他的名”；保留“名”既忠实于措辞，也保留圣经中名字代表其本人及其彰显之身份的含义。
- source_word: בְמָחוֹל
  choice: 以舞蹈
  rationale: מָחוֹל可指跳舞这一活动，也可指某种舞蹈或舞会场景。“以舞蹈”自然地表达伴随赞美的方式，同时不把词义限定得过窄。
- source_word: בְּתֹף
  choice: 伴着手鼓
  rationale: תֹף指框鼓或类似铃鼓的打击乐器。“手鼓”通俗、简洁，也比古雅的传统称谓更便于现代读者理解。
- source_word: וְכִנּוֹר
  choice: 和里拉琴
  rationale: כִּנּוֹר是类似里拉琴的古代弦乐器，并非现代意义上的竖琴；采用“里拉琴”更准确。
- source_word: יְזַמְּרוּ
  choice: 愿他们……奏乐
  rationale: זמר的Piel词形可指歌唱赞美，也可指作乐；本句明确提到乐器，因此“奏乐”贴合直接语境，同时以脚注保留“歌颂”的可能。
- source_word: לוֹ
  choice: 向他
  rationale: 介词ל在此标示赞美或奏乐所归向的对象；“向他”是自然且准确的汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿他们”传达诗歌中的劝勉或愿望语气；“伴着手鼓和里拉琴”避免生硬罗列，并保留原文两种乐器。“里拉琴”虽不如“竖琴”传统，却更符合古代乐器所指，脚注补充传统译法。
