source:
  edition: WLC
  text: כִּֽי רוֹצֶ֣ה יְהוָ֣ה בְּ/עַמּ֑/וֹ יְפָאֵ֥ר עֲ֝נָוִ֗ים בִּ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/004.yaml
  text: For Yahweh delights in his people[a]; he adorns the humble with salvation.
translation:
  language: zh_hans
  text: 因为耶和华喜爱他的子民；他以拯救[a]装饰谦卑人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“解救”或“胜利”。希伯来语这个词可指救援、解救，也可指胜利。
    reason: 保留 יְשׁוּעָה 的词义范围及本诗语境中可能的具体含义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出赞美的理由；“因为”自然体现其解释和因果作用。
- source_word: רוֹצֶה
  choice: 喜爱
  rationale: 此处表示对人怀有悦纳和喜悦，不只是意愿；“喜爱”在现代汉语中自然且有温度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名；“耶和华”是现代简体中文读者最熟悉的传统音译。
- source_word: בְּעַמּוֹ
  choice: 他的子民
  rationale: 介词 בְּ 在 רצה 之后标示所喜悦的对象，汉语无需另译介词。
- source_word: יְפָאֵר
  choice: 增添荣美
  rationale: פאר 的 Piel 形表达使之美丽、荣耀或以美物装饰；“增添荣美”保留赐予美丽与尊荣的意象，同时避免误解为外在装饰品。
- source_word: עֲנָוִים
  choice: 谦卑人
  rationale: 该词可指谦卑、温柔或处境卑微的人；“谦卑人”保留主要伦理含义，又不采用较古雅的“谦卑者”。
- source_word: בִּישׁוּעָה
  choice: 以拯救
  rationale: יְשׁוּעָה 可指拯救、解救或胜利；“拯救”在此既能指神的救助行动，也不把语义限缩为军事胜利。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号，故保留专名；正文采用现代中文圣经传统中最通行、最易识别的音译“耶和华”，不以“主”替代。
- issue: יְשׁוּעָה 在赞美诗中的含义
  choice: 拯救
  alternative: 胜利、解救
  rationale: “拯救”保留该词较宽的救援含义和神学张力；本诗语境也容许“胜利”，因此以脚注保存其他合理理解。
- issue: יְפָאֵר 与 בִּישׁוּעָה 的关系
  choice: 他以拯救为谦卑人增添荣美
  alternative: 他以胜利装饰谦卑人
  rationale: 按工具格理解介词 בְּ，并保留“使美丽、使有尊荣”的诗歌意象，不将其具体化为加冕或政治抬举。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以分号对应两句平行结构；“增添荣美”兼顾原文意象和自然汉语。正文中的脚注标记与脚注完全对应。
