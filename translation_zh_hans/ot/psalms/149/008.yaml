id: PSA.149.8
reference: Psalms 149:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֶ/אְסֹ֣ר מַלְכֵי/הֶ֣ם בְּ/זִקִּ֑ים וְ֝/נִכְבְּדֵי/הֶ֗ם בְּ/כַבְלֵ֥י בַרְזֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/008.yaml
  text: to bind their kings with chains[a], and their honored men with iron fetters,
translation:
  language: zh_hans
  text: 为要用锁链捆绑他们的君王，用铁镣锁住他们的显贵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显贵”或译“尊贵的人”或“达官贵人”。
    reason: 保留וְנִכְבְּדֵיהֶם可指受尊崇者、显要人物或贵胄的词义范围。
lexical_decisions:
- source_word: לֶאְסֹר
  choice: 为要……捆绑
  rationale: 不定式结构承接上一节，表达目的；“捆绑”保留实际束缚的意象，不扩大为正式监禁。
- source_word: מַלְכֵיהֶם
  choice: 他们的君王
  rationale: מֶלֶךְ明确指君王；保留第三人称复数所属后缀。
- source_word: בְּזִקִּים
  choice: 用锁链
  rationale: זִקִּים指锁链或拘束人的链具；“用锁链”与“捆绑”搭配自然，也保留具体意象。
- source_word: וְנִכְבְּדֵיהֶם
  choice: 他们的显贵
  rationale: 该词源于כבד，在此指受尊崇、地位显赫的人；“显贵”简洁自然，并保留其社会地位含义，而不把范围限定为某种正式爵位。
- source_word: בְּכַבְלֵי בַרְזֶל
  choice: 用铁镣锁住
  rationale: כבל指镣铐、桎梏一类束缚物；“铁镣”保留材质与拘束意象，并与前半句的“锁链”形成原文所有的词语变化。
theological_decisions:
- issue: וְנִכְבְּדֵיהֶם所指群体的身份与性别表达
  choice: 他们的显贵
  alternative: 他们尊贵的人／他们的贵族
  rationale: 原文为阳性复数，语境指各国君王之下有地位的人物。现代汉语“显贵”通常可自然指称这一群体，无须添加原文没有的性别词；同时不将其过度限定为具有世袭身份的“贵族”。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。以“为要”显明本节与上一节的目的关系；两处分别用“锁链”和“铁镣”，再现希伯来文两个不同拘束名词的变化。
