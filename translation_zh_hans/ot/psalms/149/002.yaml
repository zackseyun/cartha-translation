  text: יִשְׂמַ֣ח יִשְׂרָאֵ֣ל בְּ/עֹשָׂ֑י/ו בְּנֵֽי צִ֝יּ֗וֹן יָגִ֥ילוּ בְ/מַלְכָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/002.yaml
  text: Let Israel rejoice in his Maker[b][a]; let the sons of Zion exult in their King.
translation:
  language: zh_hans
  text: 愿以色列因他的创造者[a]欢喜；愿锡安的子民因他们的王[b]欢腾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的创造者”：希伯来文形式为复数，直译可作“他的创造者们”；这里通常理解为指创造以色列的上帝。
    reason: lexical_alternative
  - marker: b
    text: “他们的王”很可能与上句平行，指上帝；也可理解为以色列地上的君王。
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמַח
  choice: 愿……欢喜
  rationale: שׂמח 的 Qal 未完成式在诗歌平行句中带祈愿、劝勉语气；“愿……欢喜”自然保留这一语气。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 按现代汉语通行译名处理此专名，所指为以色列群体。
- source_word: בְּעֹשָׂיו
  choice: 因造他的主
  rationale: 介词 בְ 在此表示喜乐所因、所系；עֹשָׂיו 字面为复数“造他的诸位”，但上下文指向造以色列的上帝。汉语用“造他的主”既自然，又与下句“他们的王”形成平行；复数形态另以脚注说明。
- source_word: בְּנֵי צִיּוֹן
  choice: 锡安的子民
  rationale: 字面为“锡安之子”，在此是对锡安群体的集体称呼；“子民”在现代汉语中较自然，也不把诗句误限于男性。
- source_word: יָגִילוּ
  choice: 愿……欢腾
  rationale: גיל 表示洋溢、跃动的喜乐；“欢腾”比一般的“欢喜”语势更强，并保留与上句既平行又有变化的诗意。
- source_word: בְמַלְכָּם
  choice: 因他们的王
  rationale: בְ 表示喜乐所因、所系；מַלְכָּם 是“他们的王”。在中文正文中不以大小写预先限定所指，并以脚注保存其可能指上帝或地上君王的张力。
theological_decisions:
- issue: “他们的王”所指是谁
  choice: 正文保留“他们的王”，结合与“造他的主”的平行关系，可自然理解为上帝
  alternative: 也可能指以色列地上的君王
  rationale: 两句平行强烈支持上帝为所指，但希伯来文本中的“王”一词本身并未以书写形式排除地上君王。中文没有英文大小写的区别，因此正文可保持开放，并在脚注中交代两种理解。
- issue: עֹשָׂיו 的数
  choice: 正文按单数所指译为“造他的主”
  alternative: 按形态直译为“造他的诸位”
  rationale: 该词在形态上是复数并带第三人称阳性单数后缀，但此处语境通常理解为指创造以色列的上帝。直译复数在现代汉语中会造成不必要的多位创造者之意，故正文采用单数，脚注保留原文信息。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿……欢喜／愿……欢腾”保留希伯来诗歌的劝勉语气和平行结构；“锡安的子民”传达集体称谓，避免现代读者将“儿子”误解为仅指男性。所有脚注标记均置于相关词组之后。
