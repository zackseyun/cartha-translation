  yaml_path: translation/ot/psalms/149/007.yaml
  text: to execute vengeance on the nations[a], punishments on the peoples,
translation:
  language: zh_hans
  text: 为要向列国施行报复，向万民施行惩罚，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惩罚”也可译作“责备”或“管教”。希伯来语词可指责备、纠正；但在这里与“报复”平行，很可能带有司法惩处的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: 施行
  rationale: ל 加不定式表达目的；与“报复、惩罚”搭配时，“施行”自然庄重，也保留实施审判行动的意味。
- source_word: נְקָמָה
  choice: 报复
  rationale: 该名词指报仇、雪恨或报应；“报复”保留原文强烈的司法和争战色彩，不将其弱化为泛泛的“正义”。
- source_word: בַּגּוֹיִם
  choice: 向列国
  rationale: 介词 ב 在这里标示行动所针对的对象；“向列国”符合现代汉语表达，并保留复数集合意义。
- source_word: תּוֹכֵחוֹת
  choice: 惩罚
  rationale: 该词通常可指责备、管教或纠正，但在与“报复”平行、且上下文涉及拘禁君王的司法—争战语境中，“惩罚”较能表达其惩戒性，同时以脚注保留词义歧义。
- source_word: בַּל
  choice: 向
  rationale: 此处为诗歌性的介词形式，与前半句的 בַּ 平行，表示行动针对的对象；统一译作“向”可显出两分句的对应。
- source_word: אֻמִּים
  choice: 万民
  rationale: 该复数名词指诸民族、众民；“万民”在中文诗歌语体中自然，并与“列国”形成近义平行而不完全重复。
theological_decisions:
- issue: 是否为避免把神所认可的审判归于神的子民，而弱化本节的强烈措辞
  choice: 保留“报复”和“惩罚”的强烈司法性语言
  alternative: 译作较缓和的“伸张正义”和“责备”
  rationale: 希伯来文在颂赞与争战的语境中明确使用强烈的审判用语。译文不替文本消解其神学张力，也不超出本节说明这种行动的范围或条件。
- issue: תּוֹכֵחוֹת 应理解为口头责备还是司法惩处
  choice: 正文采用语境上较可能的“惩罚”，脚注保留“责备、管教”等可能
  alternative: 正文译作“责备”或“管教”
  rationale: 该词本身具有责备、纠正和惩戒的语义范围；它与“报复”平行，并处于后文捆绑君王、执行判决的语境，因此正文采用较强的司法含义，但不抹去词汇歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“为要”承接上一节的目的结构；两个“向……施行……”保留希伯来诗句的平行结构。脚注标记置于相关分句之后。
