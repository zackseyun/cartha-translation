  text: הַ֥לְלוּ יָ֨הּ שִׁ֣ירוּ לַֽ֭/יהוָה שִׁ֣יר חָדָ֑שׁ תְּ֝הִלָּת֗/וֹ בִּ/קְהַ֥ל חֲסִידִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/001.yaml
  text: Praise Yah! Sing to Yahweh a new song[b][a], his praise in the assembly of the faithful.
translation:
  language: zh_hans
  text: 要赞美雅[a]！要向雅威唱新歌；在忠信者[b]的会众中赞美他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”是希伯来文神名的短式；“要赞美雅”就是“哈利路亚”一语的字面意思。
    reason: lexical_alternative
  - marker: b
    text: “忠信者”也可译作“虔诚人”或“忠贞的人”；传统上有时译作“圣民”或“圣徒”。
    reason: alternative_reading
  - marker: c
    text: 原文此处没有明示动词，直译为“他的赞美，在忠信者的会众中”；正文把它理解为承接前面的劝勉。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: הַלְלוּ
  choice: 要赞美
  rationale: 这是הלל的复数祈使式，直接呼召众人赞美；“要赞美”既保留命令语气，也符合现代汉语诗歌体。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的短式，单独位于“赞美”之后。音译为“雅”，以区别本节随后出现的完整神名יהוה，并由脚注说明。
- source_word: שִׁירוּ לַיהוָה
  choice: 要向雅威唱
  rationale: שירו是复数祈使式；介词ל表示歌唱的对象。“向……唱”在现代汉语中自然，并准确表达方向和对象。
- source_word: שִׁיר חָדָשׁ
  choice: 新歌
  rationale: 直译这一诗篇中的固定搭配，简洁自然，并保留其文学呼应。
- source_word: תְּהִלָּתוֹ
  choice: 赞美他
  rationale: 原文是带第三人称阳性单数后缀的“他的赞美”，全句没有明示动词。正文承接前面的祈使语气，译成“赞美他”较符合汉语；脚注保留名词性理解。
- source_word: בִּקְהַל
  choice: 在……的会众中
  rationale: קהל指聚集起来的群体。“会众”简明地表达共同聚集的场景，又不过度限定为某种制度化宗教组织。
- source_word: חֲסִידִים
  choice: 忠信者
  rationale: 该词指以忠诚、虔敬和坚贞之爱为特征的人。“忠信者”兼顾盟约忠诚的意味，并避免“圣徒”可能带入的后期技术性含义。
theological_decisions:
- issue: 同一节中神名短式יָהּ与完整形式יהוה的译法
  choice: 分别译作“雅”和“雅威”
  alternative: 两者都译作“耶和华”，或将短式音译为“哈利路亚”的一部分
  rationale: 原文有意使用两个不同形式。分别音译可保留这一差别，也不以称号取代神名；脚注帮助普通读者理解不常见的短式。
- issue: חֲסִידִים所指群体的性质
  choice: 忠信者
  alternative: 虔诚人、圣民、圣徒
  rationale: “忠信者”保留忠诚与敬虔的语义范围，不把该词限定为后期教会术语，也不把“圣洁”这一并非该词核心的概念置于前景。
- issue: תְּהִלָּתוֹ的无动词结构
  choice: 正文按前句祈使语气译为“赞美他”
  alternative: 译为名词性短语“他的赞美”或理解为“他所得的赞美”
  rationale: 希伯来诗句允许无动词续句。汉语正文补出承前的动作最自然，但脚注明确原文形式，从而不排除名词性或同位语式理解。
translation_notes:
  register: 采用现代、庄重而可诵读的诗歌语体。两个“要”使并列祈使句清楚有力；“会众”保留集体敬拜场景。“雅”虽不常见，但配合脚注可忠实呈现神名短式，并与“雅威”区分。
