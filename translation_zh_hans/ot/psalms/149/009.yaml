  text: לַ/עֲשׂ֤וֹת בָּ/הֶ֨ם מִשְׁפָּ֬ט כָּת֗וּב הָדָ֣ר ה֭וּא לְ/כָל חֲסִידָ֗י/ו הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/009.yaml
  text: to execute on them the written judgment[a]. This is an honor for all his faithful ones[d][c][b]. Praise Yah!
translation:
  language: zh_hans
  text: 在他们身上执行所写的判决[a]；这是他一切忠信之人的尊荣[b]。你们要赞美雅[c]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所写的判决”也可译作“已写明的判决”，指已经记载或规定的审判。
    reason: lexical_alternative
  - marker: b
    text: “忠信之人”传统上常译作“圣民”或“圣徒”；原词强调对上帝的忠诚与敬虔。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“你们要赞美雅！”其中“雅”是神名“耶和华”的短式；整句话传统上音译为“哈利路亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת בָּהֶם
  choice: 在他们身上执行
  rationale: לַעֲשׂוֹת与“判决”搭配，并承接上文的争战与审判图景，表示执行判决；בָּהֶם指出审判所临到的对象。
- source_word: מִשְׁפָּט כָּתוּב
  choice: 所写定的判决
  rationale: מִשְׁפָּט在此指具体的司法判决；כָּתוּב本义为“写下的”，译作“写定”既保留书写意象，也自然表达该判决已经记载或规定。
- source_word: הָדָר
  choice: 尊荣
  rationale: 此处指归给上帝忠信之人的尊贵与荣耀；“尊荣”比视觉性的“华美”更符合语境，同时不必强行解释为一项特权。
- source_word: חֲסִידָיו
  choice: 他所有忠信之人
  rationale: חסיד指以忠诚、敬虔回应上帝的人；“忠信之人”保留盟约忠诚的色彩，又避免“圣徒”可能带来的后期宗派联想。
- source_word: הַלְלוּ יָהּ
  choice: 你们要赞美耶和华
  rationale: הַלְלוּ是复数命令式，故明示“你们要赞美”；יָהּ是神名的短式，汉语正文采用读者熟悉的“耶和华”，脚注说明原文形式。
theological_decisions:
- issue: הָדָר הוּא的指向与语气
  choice: 这是他所有忠信之人的尊荣
  alternative: 这对他所有忠信之人来说是一项荣耀
  rationale: 希伯来文只断言“这是……的尊荣”，没有明确限定为可数的“一项”特权，因此采用较贴近原文、也保留其概括性的表达。
- issue: 短神名יָהּ的译法
  choice: 耶和华
  alternative: 雅
  rationale: יָהּ确为神名的短式；正文使用现代中文圣经读者熟悉的“耶和华”，并以脚注交代原文短式及“哈利路亚”的传统音译，不把短式与全式之间的差异完全隐去。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“执行判决”保留司法力度；“所写定的”兼顾希伯来文的书写意象与汉语习惯；末句补出复数命令式的主语“你们”，增强中文可读性。
