source:
  edition: WLC
  text: יַעְלְז֣וּ חֲסִידִ֣ים בְּ/כָב֑וֹד יְ֝רַנְּנ֗וּ עַל מִשְׁכְּבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/005.yaml
  text: Let the faithful exult in glory[c][b][a]; let them sing for joy on their beds.
translation:
  language: zh_hans
  text: 愿忠信的人[a]在荣耀中[c]欢欣；愿他们在床榻上欢唱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“虔诚的人”或“圣民”。希伯来语指以忠贞和敬虔为特征的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“欢呼”。原词可指以歌声或呼喊发出喜乐之声。
    reason: lexical_alternative
  - marker: c
    text: “荣耀”也可理解为“尊荣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעְלְזוּ
  choice: 愿……欢欣
  rationale: 该未完成式在诗歌平行结构中带有劝勉意味；“愿……欢欣”既表达劝愿语气，也保留强烈、喜庆的情感。
- source_word: חֲסִידִים
  choice: 忠信的人
  rationale: 此词指以忠贞、虔诚回应圣约之爱的人。“忠信的人”在现代汉语中清楚自然，也避免把它处理成后世特定的宗教身份术语。
- source_word: בְּכָבוֹד
  choice: 在荣耀中
  rationale: 介词 בְּ 与 כָבוֹד 的组合可表示欢欣所处的境况或范围。“在荣耀中”保留原文较厚重的诗意，也不排除“尊荣”的理解。
- source_word: יְרַנְּנוּ
  choice: 愿他们……欢唱
  rationale: רנן 的强化词干表示发出响亮的喜乐之声，可能是歌唱，也可能是欢呼；正文用“欢唱”切合诗篇语境，脚注保留另一可能。
- source_word: עַל
  choice: 在……上
  rationale: 这里直接表示位于床榻之上，无须加入更具解释性的含义。
- source_word: מִשְׁכְּבוֹתָם
  choice: 他们的床榻
  rationale: 该词指躺卧之处；“床榻”准确、简洁，并具有适度的诗体庄重感。
theological_decisions:
- issue: חֲסִידִים 的身份含义
  choice: 忠信的人
  alternative: 虔诚的人；圣民
  rationale: 原文强调对上帝忠贞、敬虔的群体，却没有要求采用后世制度化或宗派化的身份称谓；“忠信的人”较好地保留其圣约忠诚的意味。
- issue: בְּכָבוֹד 的语义
  choice: 在荣耀中
  alternative: 在尊荣中
  rationale: 正文保留“荣耀”这一较宽广、厚重的诗性表达，同时以脚注说明“尊荣”的可能，避免过早判定荣耀的具体性质或来源。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两个“愿”对应原文平行的劝勉语气；“床榻”比“床”略具诗意，却仍是普通读者熟悉的表达。
