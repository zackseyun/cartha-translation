id: PSA.15.1
reference: Psalms 15:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/001.yaml
  text: A psalm of David[a]. O Yahweh[b], who may sojourn in your tent? Who may dwell on your holy mountain?
translation:
  language: zh_hans
  text: '大卫的诗[a]。

    雅威啊，谁能寄居在你的帐篷[b]里？谁能住在你的圣山上？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“大卫所作的诗”或“献给大卫的诗”；希伯来语标题可表示作者、归属、关联或奉献。
    reason: alternative_reading
  - marker: b
    text: “帐篷”在这里可能指圣所，即作为神居所的圣幕。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题的常用体裁词；在现代汉语圣经语境中，“诗”简洁、自然，也准确表明其诗歌性质。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 在诗篇标题中可表示作者、归属、关联或献给某人；“大卫的”保留这种关系上的含混，不武断限定为“大卫所作”或“献给大卫”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其最可能的读音音译四字神名，保留经文所用的专名，而不以“主”等称号代替。
- source_word: יָגוּר
  choice: 寄居
  rationale: גור 表示以旅居者或客人的身份暂住；“寄居”保留这一语义，并与下句较稳定的“住”形成平行中的层次。
- source_word: בְּאָהֳלֶךָ
  choice: 在你的帐篷里
  rationale: אֹהֶל 的基本义是“帐篷”；此处可能唤起圣所作为神居所的意象，但正文保留具体形象，不直接改译为解释性的“圣幕”。
- source_word: יִשְׁכֹּן
  choice: 住
  rationale: שׁכן 表示居住、安居；译作“住”自然清楚，并与前句“寄居”对应。
- source_word: בְּהַר קָדְשֶׁךָ
  choice: 在你的圣山上
  rationale: 自然表达“你的圣山”这一结构，所指可让上下文决定；“山”准确对应 הַר。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列神的四字神名。译作“雅威”力求按其最可能的古代读音呈现该专名，避免用称号代替，也不把传统形式当作唯一可能的读音。
- issue: 标题 לְדָוִד 所表达的关系
  choice: 大卫的诗
  alternative: 大卫所作的诗；献给大卫的诗
  rationale: 希伯来语介词本身没有明确限定作者身份，也可能表示归属、关联或奉献；正文保留这种真实的含混。
- issue: 谁能进入神圣空间这一问句的性质
  choice: 保留为开放式修辞问句
  alternative: 改写为关于得救资格或礼仪准入的明确命题
  rationale: 本节提出谁适合寄居于神的帐篷、住在圣山上的问题，但尚未单独说明这究竟专指礼仪准入、敬拜资格还是更广泛的与神同住；不在译文中提前解决这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“寄居”保留原文暂住或作客的意味，“住”则呈现平行下句较稳定的居住概念。“帐篷”比“帐幕”更直接对应原词，同时脚注说明其圣所意涵。
