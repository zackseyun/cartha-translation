base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/003.yaml
  text: He does not slander with his tongue[a], does not do evil to his neighbor[c][b], and does not bear reproach against his close one.
translation:
  language: zh_hans
  text: 他不以舌头毁谤人[a]，不向邻舍行恶[b]，也不对亲近的人加以羞辱[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不以舌头到处搬弄是非。”
    reason: lexical_alternative
  - marker: b
    text: “邻舍”也可译作“朋友”或“同伴”。
    reason: lexical_alternative
  - marker: c
    text: “亲近的人”可指亲属、关系密切者，或共同体中身边的人；末句也可译作：“不向亲近的人发出责难。”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָגַל עַל־לְשֹׁנוֹ
  choice: 用舌头毁谤人
  rationale: רָגַל在这一搭配中指借言语中伤别人，也可能含有四处搬弄是非之意。“用舌头毁谤人”保留了舌头的具体意象，并以现代汉语清楚表达其伦理含义。
- source_word: עָשָׂה ... רָעָה
  choice: 行恶
  rationale: 原文含义宽泛，指向别人做恶事或坏事。“行恶”保留其道德范畴，避免缩窄为单纯造成身体或物质伤害。
- source_word: לְרֵעֵהוּ
  choice: 向邻舍
  rationale: רֵעַ可指朋友、同伴或共同体中的邻舍；“邻舍”适合本节普遍性的伦理语境，同时不限定双方必须关系亲密。
- source_word: חֶרְפָּה
  choice: 羞辱
  rationale: 该词可指辱骂、斥责，也可指由此造成的耻辱。“羞辱”兼顾言语攻击与社会性受辱的意味。
- source_word: נָשָׂא ... עַל
  choice: 把……加在……身上
  rationale: 这一表达保留了原文“举起、承载……攻击某人”的形象，并在汉语中表达主动把羞辱施加于人的意思；具体可理解为辱骂、传播羞辱性言论或参与羞辱。
- source_word: קְרֹבוֹ
  choice: 亲近的人
  rationale: קָרוֹב本义是“近的”，可指亲属、关系密切者或身边的人。“亲近的人”保留关系上的邻近性，不武断限定为血亲。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个“不”保持希伯来诗句的平行结构；“用舌头”保留原文具体意象，“行恶”保留宽泛的道德意义，末句则保留“羞辱”及“亲近的人”在原文中的语义张力。
