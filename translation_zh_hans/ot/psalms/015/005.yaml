  text: כַּסְפּ֤/וֹ לֹא נָתַ֣ן בְּ/נֶשֶׁךְ֮ וְ/שֹׁ֥חַד עַל נָקִ֗י לֹ֥א לָ֫קָ֥ח עֹֽשֵׂה אֵ֑לֶּה לֹ֖א יִמּ֣וֹט לְ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/005.yaml
  text: He does not lend his money at interest[a], and does not take a bribe against the innocent[b]. The one who does these things will never be shaken.
translation:
  language: zh_hans
  text: 他不以自己的钱放贷取利[a]，也不收受贿赂加害无辜的人。行这些事的人必永不动摇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“放贷收取利息”；希伯来语 נֶשֶׁךְ 指贷款所收的利息，并不只指过高的利息。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפּוֹ
  choice: （隐含在“放贷”中）
  rationale: 该词直译为“他的银子”，在借贷语境中指钱财。现代汉语“放贷”本身已包含借出钱财之意，无须生硬重复“把自己的钱”。
- source_word: נָתַן בְּנֶשֶׁךְ
  choice: 放贷取利
  rationale: נֶשֶׁךְ 指贷款所收的利息，不必限定为过高或非法利息。“放贷取利”既自然简洁，也保留原文谴责借贷取息的广义表达。
- source_word: שֹׁחַד
  choice: 贿赂
  rationale: 该词指用来左右裁断或行为的贿赂；“收受贿赂”是现代汉语中清楚而庄重的法律伦理用语。
- source_word: עַל נָקִי
  choice: 陷害无辜的人
  rationale: 介词 עַל 在此表达贿赂所针对的不利对象。译作“陷害无辜的人”明确传达收受贿赂而加害无罪者的司法语境。
- source_word: עֹשֵׂה אֵלֶּה
  choice: 行这些事的人
  rationale: 分词作名词使用，描述以这些行为为特征的人；此译简洁自然，并保留单数泛指。
- source_word: לֹא יִמּוֹט לְעוֹלָם
  choice: 必永不动摇
  rationale: מוֹט 的尼法勒形态表达被摇动、失去稳固；与否定词和 לְעוֹלָם 连用，表示永远不被动摇。“必永不动摇”保留其稳固不移的比喻与强烈保证。
theological_decisions:
- issue: 取利禁令的范围
  choice: 将 נֶשֶׁךְ 译为“取利”，不把含义缩窄为只禁止高利贷。
  alternative: 译为“放高利贷”。
  rationale: 原词可指贷款利息；“高利贷”会加入利率过高或违法的现代限定，从而缩小原文表述的范围。译文不进一步判定这一禁令在不同经济制度中的具体适用方式。
- issue: 不动摇的含义
  choice: 保留“动摇”的比喻，不具体解释为今生安稳、社会地位稳定或终极得救。
  alternative: 释义为“永远稳妥”或“永不败亡”。
  rationale: 原文以 מוֹט 表达稳固不移，但未在本句中明确限定其具体层面；保留比喻可避免替诗篇消解其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“放贷取利”保留经济伦理力度；“陷害无辜的人”自然呈现司法语境；末句保持诗歌式的稳固比喻。
