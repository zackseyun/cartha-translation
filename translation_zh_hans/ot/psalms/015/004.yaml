language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נִבְזֶ֤ה בְּֽ/עֵ֘ינָ֤י/ו נִמְאָ֗ס וְ/אֶת יִרְאֵ֣י יְהוָ֣ה יְכַבֵּ֑ד נִשְׁבַּ֥ע לְ֝/הָרַ֗ע וְ/לֹ֣א יָמִֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/004.yaml
  text: In his eyes a despised person is rejected[a], but he honors those who fear Yahweh[b]; he swears to his own harm and does not change.
translation:
  language: zh_hans
  text: 在他眼中，被鄙视的人遭弃绝[a]；他却尊重敬畏雅威的人。他起誓，即使自己受损，也不更改所起的誓言[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来语十分紧凑，也可译作：“在他眼中，卑劣的人受鄙视。”两个词都可带被动意味，彼此关系并不完全明确。
    reason: alternative_reading
  - marker: b
    text: 原文直译近于“他起誓以致受损，也不更改”。通常理解为：即使所起的誓后来使自己蒙受损失，他仍不更改誓言；“自己”和“誓言”都是按语境补明的。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְזֶה
  choice: 被鄙视的人
  rationale: 保留希伯来语被动／形容词形式，指受到轻视的人；不径自强化为带明确道德定论的“卑劣的人”。
- source_word: בְּעֵינָיו
  choice: 在他眼中
  rationale: 保留希伯来语表示判断或评价的常见比喻，在现代汉语中也自然。
- source_word: נִמְאָס
  choice: 遭弃绝
  rationale: 表达被拒绝、被视为不可接受之意，同时避免与前面的“被鄙视”机械重复。
- source_word: יִרְאֵי יְהוָה
  choice: 敬畏雅威的人
  rationale: “敬畏”保留圣约语境中兼具畏惧与尊崇的含义，不弱化为单纯“尊敬”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: יְכַבֵּד
  choice: 尊重
  rationale: 此处使役加强词干表示给予分量、尊荣或看重；“尊重”符合人物品格对照，也自然易懂。
- source_word: נִשְׁבַּע
  choice: 起了誓
  rationale: 明确表达立誓行为；与下句“不改变”连用，呈现即使付出代价仍信守誓言的品格。
- source_word: לְהָרַע
  choice: 即使自己受损
  rationale: 原文简约，字面近于“为着受害／受损”；按上下文表达誓言后来对本人不利，同时用“即使”标明这是语境理解。
- source_word: יָמִר
  choice: 不改变
  rationale: 保留使役词形在此“更改、替换”的核心意思；隐含宾语是所起的誓或承诺。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”以专名而非称号呈现，并避免把传统混合读音当作原始发音。
- issue: 难句 נִבְזֶה בְּעֵינָיו נִמְאָס 的理解
  choice: 在他眼中，被鄙视的人遭弃绝
  alternative: 在他眼中，卑劣的人受鄙视；他鄙弃可鄙的人
  rationale: 希伯来语结构紧凑，前后两个被动形式的关系存在歧义。正文尽量保存其形式和评价张力，不擅自把 נִבְזֶה 明确定性为道德上“卑劣”。
- issue: לְהָרַע 所指的受害者
  choice: 理解为起誓者自己受损
  alternative: 字面译作“起誓要加害，却不更改”
  rationale: 传统且符合品格清单语境的理解是：即使誓言后来对自己不利，仍不反悔；不过原文没有明说“自己”，故以脚注交代其省略与另一种字面可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。用分号和短句呈现诗行中的人物对照；“遭弃绝”略具书面色彩，以配合诗篇语体。“雅威”作为神名音译。正文中的[a]、[b]均与脚注对应。
