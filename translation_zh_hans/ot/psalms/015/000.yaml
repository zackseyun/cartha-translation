  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/000.yaml
  text: A psalm of David[a]. Yahweh[b], who may dwell in your tent? Who may live on your holy mountain?
translation:
  language: zh_hans
  text: '大卫的诗[a]。


    耶和华，谁能寄居在你的帐幕[b]里？谁能安住在你的圣山上？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”也可理解为“大卫所作的诗”、“献给大卫的诗”或“与大卫有关的诗”；希伯来文标题可表示作者、归属、关联或献呈。
    reason: alternative_reading
  - marker: b
    text: 也可译为“帐篷”；希伯来文直译为“帐篷”，在这里很可能唤起上帝居所，即圣所的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 指配合音乐吟唱的诗歌；在诗篇标题中译作“诗”自然、简明。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名对应四字神名，并保留经文中直接呼告上帝的形式。
- source_word: יָגוּר
  choice: 寄居
  rationale: 该动词有作为寄居者暂住、蒙准居留之意；“寄居”保留其与下一分句“安住”之间的语义张力。
- source_word: בְּאָהֳלֶךָ
  choice: 在你的帐幕里
  rationale: 原文直译为“在你的帐篷中”，语境指向上帝的圣所；“帐幕”既保留帐篷意象，也自然唤起敬拜场所。
- source_word: יִשְׁכֹּן
  choice: 安住
  rationale: 表示定居、居住；“安住”与“寄居”形成递进式平行，又不把许可或永久性过度写入译文。
- source_word: בְּהַר קָדְשֶׁךָ
  choice: 在你的圣山上
  rationale: 忠实保留“你的圣山”这一圣所和上帝临在的空间意象。
theological_decisions:
- issue: 标题中 לְדָוִד 的关系
  choice: 大卫的诗
  alternative: 大卫所作的诗；献给大卫的诗；与大卫有关的诗
  rationale: 希伯来介词 לְ 可表示作者、归属、关联或献呈；正文采用传统而简洁的“大卫的诗”，并以脚注保留其真实歧义。
- issue: 进入圣所的两个动词是否表示暂居与永久居住的严格对立
  choice: 寄居／安住
  alternative: 居住／居住；暂住／长住
  rationale: 保留 יגור 与 ישכן 的词汇差异及可能的递进，但避免断言诗人有意建立严格的暂时—永久神学区分。
- issue: “帐幕”是否明确等同于会幕
  choice: 帐幕
  alternative: 帐篷；会幕
  rationale: 原词本义为帐篷，语境很可能指上帝的圣所；“帐幕”兼顾两者，而不将其限定为某一特定历史形态的会幕。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“寄居／安住”保留两行平行中的词义差别；“帐幕／圣山”维持圣所意象。神名按现代中文圣经通行形式译为“耶和华”。
