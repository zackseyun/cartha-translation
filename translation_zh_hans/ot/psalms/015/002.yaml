id: PSA.15.2
reference: Psalms 15:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הוֹלֵ֣ךְ תָּ֭מִים וּ/פֹעֵ֥ל צֶ֑דֶק וְ/דֹבֵ֥ר אֱ֝מֶ֗ת בִּ/לְבָבֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/002.yaml
  text: He who walks blamelessly[a], and does what is right[b], and speaks truth in his heart.
translation:
  language: zh_hans
  text: 就是行事纯全[a]、做正义之事[b]、心里说实话的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为人正直”。这里的希伯来词可指品行完整、正直，并不一定表示绝对完美。
    reason: lexical_alternative
  - marker: b
    text: 或译“行公义”或“秉行公正”。这里的希伯来名词兼有公义、正义、公正和正确之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: 行事
  rationale: הלך的分词在这里惯用于描述人的生活方式和品行。“行事”自然传达这一惯用义，也保留动态色彩。
- source_word: תָּמִים
  choice: 纯全
  rationale: 此词表示品行完整、正直、无可指责，不必然指绝对无罪或毫无缺陷。“纯全”保留了希伯来词“完整”的核心意味。
- source_word: וּפֹעֵל
  choice: 做
  rationale: פעל的分词表示实行或做出；“做”与后面的“正义之事”搭配自然，并与其余分词结构形成平行。
- source_word: צֶדֶק
  choice: 正义之事
  rationale: צֶדֶק可指公义、正义或正确之事。译作“正义之事”既表达实际行动，也保留其公义与公正的语义范围。
- source_word: וְדֹבֵר
  choice: 说
  rationale: דבר在此直接表示说话；“说”简洁地维持三个分词短语的平行结构。
- source_word: אֱמֶת
  choice: 实话
  rationale: אמת可表示真实、真理或信实；与“说”搭配时，“实话”自然突出言语真实，同时不排除内在诚实。
- source_word: בִּלְבָבוֹ
  choice: 心里
  rationale: 该短语直译为“在他的心里”。“心里”保留希伯来文以心指内在之人的表达，并可体现内外一致的诚实。
theological_decisions:
- issue: 纯全是否意味着绝对无罪
  choice: 行事纯全
  alternative: 行为完美
  rationale: תָּמִים在本节着重品格完整、正直和无可指责；“纯全”保留伦理力度，却不将经文扩大为绝对无罪的断言。
- issue: 阳性单数的代表性表达
  choice: ……的人
  alternative: 他行事……在他心里
  rationale: 希伯来文使用阳性单数分词和代词后缀，但在此具有代表性、泛指作用。现代汉语用“……的人”自然保留单数人物形象，且不把语法阳性误解为只限男性。
- issue: “心里说实话”的含义
  choice: 心里说实话
  alternative: 从心里说实话
  rationale: 介词בְּ首先是“在……里面”。保留“心里”使经文既可能指内心所存的真实，也包含发自内心的诚实，不把这层张力单向限定为外在言语的真诚。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“行事纯全—做正义之事—心里说实话”维持原文三个分词短语的诗歌平行；以“就是……的人”承接诗篇15:1的问题语境。
