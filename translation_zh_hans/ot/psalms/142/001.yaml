  yaml_path: translation/ot/psalms/142/001.yaml
  text: With my voice I cry out to Yahweh[c][b][a]; with my voice I plead to Yahweh for mercy.
translation:
  language: zh_hans
  text: 我出声向耶和华呼求；我出声向耶和华恳求。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两次重复“我的声音”，以加强语气并形成诗歌平行。“恳求”也可译为“恳求施恩”或“恳求怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלִי
  choice: 我出声
  rationale: 原文直译为“我的声音”，两次前置以加强语气并构成诗歌平行。现代汉语用“我出声”既自然地表达有声呼求，也保留两次重复。
- source_word: אֶל
  choice: 向
  rationale: 介词表示呼求所指向的对象；“向”符合现代汉语中“向……呼求／恳求”的习惯搭配。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”音译四字神名，保留其作为以色列之神名字的性质，而不以头衔替代。
- source_word: אֶזְעָק
  choice: 呼求
  rationale: זעק表示因急难而发出的强烈呼喊；“呼求”兼具出声呼喊和求助之意，适合祷告语境。
- source_word: אֶתְחַנָּן
  choice: 恳求怜悯
  rationale: חנן的Hitpael形式表示恳切求恩惠或怜悯；“恳求怜悯”以自然现代汉语传达这种迫切求恩的含义。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非头衔。正文采用中文传统且广为人知的音译“耶和华”，不译作“主”；“雅威”是另一种较接近学界拟音的译法。
- issue: אֶתְחַנָּן所求恩惠是否明说为怜悯
  choice: 恳求怜悯
  alternative: 恳求施恩
  rationale: 该动词可指求恩、求怜悯，语义并不局限于某一具体恩惠；正文采用汉语中自然的“恳求怜悯”，脚注保留“求施恩”的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留原文两个分句的严整平行和“我出声”的重复，避免古雅的“哀告”“祈恩”等措辞。
