base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/004.yaml
  text: 'Look to the right and see: there is no one who recognizes me[a]; refuge has perished from me[b]; no one seeks my life.'
translation:
  language: zh_hans
  text: 求你看看我右边，察看：没有人认得我；我已无处可逃[a]；没有人顾念我的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逃生之路已从我这里消失。”希伯来语名词可指逃生之处或逃脱途径。
    reason: lexical_alternative
  - marker: b
    text: 直译：“没有人寻求我的性命（或：我本人）。”这里的“生命”（希伯来语nephesh）很可能指人的性命或本人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּיט יָמִין וּרְאֵה
  choice: 你向右边观看，看一看
  rationale: 保留两个祈使动词的叠加强调及“右边”的空间意象；补出隐含主语“你”，符合现代汉语表达。
- source_word: מַכִּיר
  choice: 认得我
  rationale: 此处表示认出、承认或理会某人；“认得我”既贴近词义，也符合诗人遭人遗弃的语境。
- source_word: אָבַד מָנוֹס מִמֶּנִּי
  choice: 我已无处可逃
  rationale: מָנוֹס可指逃生之处或逃脱途径；将希伯来语字面上“逃处从我消失”自然表达为“我已无处可逃”，保留绝境感。
- source_word: דּוֹרֵשׁ לְנַפְשִׁי
  choice: 顾念我的性命
  rationale: דרש字面为寻求、查问，在此结构和哀歌语境中可表示关切；“顾念”避免被误解为追索或谋害，而“性命”体现נפש在此主要指生命或本人。
theological_decisions:
- issue: נֶפֶשׁ在哀歌语境中的含义
  choice: 我的性命
  alternative: 我的灵魂／我本人
  rationale: 上下文关乎孤立无援与逃生，נפש最自然地指诗人的生命或本人；译作“性命”不引入希伯来文本未明确要求的身心二分。
- issue: דּוֹרֵשׁ的语用含义
  choice: 顾念
  alternative: 寻求／查问
  rationale: 直译“寻求我的性命”在现代汉语中容易被理解为追杀；“顾念”表达无人过问其安危的语境意义，同时以注释保留较字面的可能性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留原诗两个观看命令的强调，并用脚注呈现מָנוֹס与נפש的真实词义幅度。
