  text: A Maskil[a] of David[b], when he was in the cave. A prayer.
translation:
  language: zh_hans
  text: 大卫的[b]马斯基勒[a]，当他在洞中时。一篇祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “马斯基勒”是诗篇标题中的希伯来语专门术语，确切含义不明；也可能指默想诗、教导性的诗或其他相关体裁。
    reason: lexical_alternative
  - marker: b
    text: “大卫的”也可译作“大卫所作”“献给大卫”或“与大卫有关”；希伯来语标题可表示作者、归属、奉献或关联。
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: 训诲诗
  rationale: 这是诗篇标题中的专门术语，确切含义不明；“训诲诗”采用常见且易懂的功能性译法，同时以脚注保留“默想诗”等可能解释及术语的不确定性。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 标题中的介词 לְ 可表示作者、归属、献给或关联；“大卫的”在现代汉语中自然，也比“由大卫所作”更能保留原文关系的宽泛性。
- source_word: בִּהְיוֹתוֹ
  choice: 是他……时
  rationale: 介词 בְּ 加 היה 的不定词构造及第三人称后缀在此表达时间，译作“是他……时”符合自然汉语。
- source_word: בַמְּעָרָה
  choice: 在洞里
  rationale: 原文带定冠词，指语境中已知的洞；汉语通常无需显式翻出定冠词。“洞里”自然简洁，且不擅自认定具体是哪一个洞。
- source_word: תְפִלָּה
  choice: 一篇祷告
  rationale: 此词在标题末尾标明体裁；单列为“一篇祷告”，保留其独立的标题作用。
theological_decisions:
- issue: לְדָוִד 在诗篇标题中所表示的关系
  choice: 大卫的
  alternative: 大卫所作；献给大卫；与大卫有关
  rationale: 原文可表示作者身份、归属、奉献或关联；正文采用含义较宽的“大卫的”，并用脚注明确保留其他可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。标题分为三段，以保留原文“训诲诗—在洞里时—祷告”的结构；不指明具体洞穴，也不将大卫与诗篇的关系限定为作者身份。
