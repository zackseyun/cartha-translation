source:
  edition: WLC
  text: זָעַ֥קְתִּי אֵלֶ֗י/ךָ יְה֫וָ֥ה אָ֭מַרְתִּי אַתָּ֣ה מַחְסִ֑/י חֶ֝לְקִ֗/י בְּ/אֶ֣רֶץ הַֽ/חַיִּים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/005.yaml
  text: I cried out to you[a], O Yahweh; I said, “You are my refuge, my portion in the land of the living.”
translation:
  language: zh_hans
  text: 我向你呼求，耶和华[a]啊！我说：“你是我的避难所，是我在活人之地的份。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是希伯来文神名 יהוה 的传统中文音译；“雅威”是另一种常见的中文拟音。
    reason: 说明神名的音译选择，同时不将古代读音表述为毫无争议。
lexical_decisions:
- source_word: זָעַקְתִּי
  choice: 我……呼求
  rationale: 该动词表示迫切发声求助；“呼求”既保留强烈求援的意味，也符合现代汉语祷告语境。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 准确表达呼求所指向的对象，现代汉语自然明晰。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式音译四字神名，不以称号替代；脚注列出另一常见拟音。
- source_word: אָמַרְתִּי
  choice: 我说
  rationale: 按其常用义直译，并与前句“我……呼求”构成连贯的过去叙述。
- source_word: אַתָּה
  choice: 你是
  rationale: 保留独立人称代词所带的强调，并补出汉语判断词，使表述自然。
- source_word: מַחְסִי
  choice: 我的避难所
  rationale: 准确表达受威胁时藏身、得保护之处，也是诗篇语境中自然庄重的译法。
- source_word: חֶלְקִי
  choice: 我……所得的份
  rationale: “份”保留所分得之分、所拥有之分的语义，不径自具体化为“产业”或泛化为“福分”。
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: 在活人之地
  rationale: 贴近希伯来语固定表达，指现世活人所在的领域，与死亡或阴间相对。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名，因此正文保留专名而不用“主”替代。“耶和华”是现代中文读者最熟悉的传统音译；“雅威”反映另一种常见的学术拟音，列入脚注，以免把不确定的古代读音处理成毫无争议。
- issue: חֶלְקִי 所表达的“份”
  choice: 我在活人之地所得的份
  alternative: 我在活人之地的福分／产业
  rationale: 原词可指分得的一份，并在以神为对象时具有深厚的信仰内涵；正文保留“份”的开放性，不把它限定为物质产业，也不完全解释成抽象福分。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“耶和华啊”保留直接呼告；“活人之地”保留诗歌意象；全句维持原文两个第一人称动词及随后直接引语的结构。
