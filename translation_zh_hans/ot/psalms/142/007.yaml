base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/007.yaml
  text: Bring my soul out of prison[a], so that I may give thanks to your name; the righteous will gather around me, for you will deal bountifully with me.
translation:
  language: zh_hans
  text: 求你把我从监牢中领出来，使我称谢你的名；义人必聚集在我周围[a]，因为你必厚待我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人必围绕我。”该动词也可作较少见的理解：“义人必因我而自戴冠冕”，或“义人必因我而夸耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיאָה
  choice: 求你领……出离
  rationale: 这是 יצא 的使役式祈使语气，表示请求上帝使诗人出来。“领……出离”既保留使役含义，也符合现代汉语祷告语体。
- source_word: מִמַּסְגֵּר
  choice: 出离监牢
  rationale: מַסְגֵּר 指拘禁之处或牢狱；“监牢”清楚自然，并不预先限定这里是实指还是比喻。
- source_word: נַפְשִׁי
  choice: 我
  rationale: נֶפֶשׁ 在这里指诗人的整个自我或生命。汉语若直译为“我的灵魂”容易把身心二分的含义带入原文，因此在“领我出离”中自然表达为“我”。
- source_word: לְהוֹדוֹת אֶת שְׁמֶךָ
  choice: 使我称谢你的名
  rationale: לְ 表目的，ידה 的使役式在此表示称谢或颂赞；“称谢你的名”保留原文的“名”，也符合庄重的现代汉语。
- source_word: בִּי יַכְתִּרוּ
  choice: 必聚集在我周围
  rationale: כתר 在此可理解为围绕，בִּי 则指向诗人。“聚集在我周围”表达义人因见证拯救而围聚的图景，同时将较少见的其他理解保留在脚注中。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 这是形容词作名词，指行义的人；“义人”简洁、庄重，也是汉语圣经语境中易懂的表达。
- source_word: כִּי
  choice: 因为
  rationale: 引出义人聚集在诗人周围的理由。
- source_word: תִגְמֹל עָלָי
  choice: 你必厚待我
  rationale: גמל על 可表示如何对待某人，在此期待上帝施恩。“厚待”体现慷慨恩惠，却不把经文收窄为按功劳报偿。
theological_decisions:
- issue: 末句是否表示按功劳给予报偿
  choice: 译为上帝将厚待诗人，保留其恩惠与善待的含义
  alternative: 你必报答我／按我所配得的回报我
  rationale: 哀歌与求拯救的语境支持正面的施恩期待；原动词虽可涉及报偿，但本节并未明确宣称诗人凭功劳赚取回报。
- issue: “监牢”是实际牢狱还是困境的比喻
  choice: 正文保留“监牢”，不作解释性限定
  alternative: 解救我脱离困境
  rationale: 原文使用具体的拘禁用语，但上下文不足以强行判定为实际囚禁或纯粹比喻；直译可保存这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“出离”略具诗体色彩，与诗篇体裁相称；正文避免过度解释 נֶפֶשׁ、监牢的性质，以及 גמל 是否包含严格报偿观。
