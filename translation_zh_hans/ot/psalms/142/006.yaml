source:
  edition: WLC
  text: הַקְשִׁ֤יבָ/ה אֶֽל רִנָּתִ/י֮ כִּֽי דַלּ֪וֹתִ֫י מְאֹ֥ד הַצִּילֵ֥/נִי מֵ/רֹדְפַ֑/י כִּ֖י אָמְצ֣וּ מִמֶּֽ/נִּי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/006.yaml
  text: Attend to my cry[a], for I am brought very low; deliver me from my pursuers[c][b], for they are stronger than I.
translation:
  language: zh_hans
  text: 求你留心听我的呼求[a]，因为我已极其衰弱[b]；求你救我脱离追赶我的人[c]，因为他们比我强大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你侧耳听我的呼声。”原文动词含专心倾听之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为我已经落到极低的地步。”原文可表示大为衰减、变得软弱或低微。
    reason: lexical_alternative
  - marker: c
    text: 或译：“求你搭救我，使我脱离那些追赶我的人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: 留心听
  rationale: 该祈使式不只是听见，更含专注倾听之意；“留心听”在现代汉语中自然地保留了恳切语气。
- source_word: רִנָּתִי
  choice: 我的呼求
  rationale: רִנָּה 可指响亮的呼声；在哀歌语境中是求助的呼喊，译作“呼求”比“欢呼”或“歌唱”贴切。
- source_word: דַלּוֹתִי מְאֹד
  choice: 我已极其衰弱
  rationale: דלל 表示变得低微、衰弱或力量大减；“已极其衰弱”兼顾结果状态与 מְאֹד 的加强语气，同时不把它局限为经济上的贫穷。
- source_word: הַצִּילֵנִי
  choice: 求你救我脱离
  rationale: 此处 נצל 指从现实追赶者手中获救；“救我脱离”清楚表达具体解救，又不额外引入经文未明说的系统性救恩含义。
- source_word: מֵרֹדְפַי
  choice: 追赶我的人
  rationale: רדף 的分词直接指追逐、追赶诗人的人；采用短语比“追赶者”更自然，也避免“逼迫者”可能带来的意义窄化。
- source_word: אָמְצוּ מִמֶּנִּי
  choice: 他们比我强大
  rationale: אָמְצוּ 表示强壮、有力，מִמֶּנִּי 构成比较；此译直接保留双方力量悬殊的意思。
theological_decisions:
- issue: הַצִּילֵנִי 是否译为带有广义救恩色彩的“拯救”
  choice: 救我脱离
  alternative: 拯救我／搭救我
  rationale: 上下文明确指从人类追赶者手中获救，因此用“救我脱离”保留具体处境，不将其静默扩展为更宽泛的教义性救恩。
- issue: דַלּוֹתִי 的状态及语态色彩
  choice: 我已极其衰弱
  alternative: 我被压得极其卑微／我已经落到极低的地步
  rationale: 希伯来语可表达变得低微、被削弱或大为衰减，具体致因并未明说；正文采用自然且不强加施事者的译法，并以脚注保留“落到极低地步”的可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你”补足汉语祈求语气；分号维持原句两组请求与理由的平行结构。所有脚注标记均置于相应正文词组之后。
