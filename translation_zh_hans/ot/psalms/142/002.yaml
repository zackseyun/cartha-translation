  text: I pour out my complaint before him[b][a]; I declare my distress before him.
translation:
  language: zh_hans
  text: 我在他面前倾吐我的苦情[a]；在他面前陈明我的患难[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苦情”或译“默想”、“沉思”或“诉怨”；希伯来词 שִׂיחִי 含义较广，在本篇哀歌的语境中较可能指说出来的苦情。
    reason: lexical_alternative
  - marker: b
    text: “患难”或译“困境”、“苦难”或“窘迫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁפֹּךְ
  choice: 倾诉
  rationale: 该动词本义为“倾倒”。与言语、哀诉连用时，现代汉语用“倾诉”既保留毫无保留地倒出的意象，也表达向上帝诉说的动作。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 直译为“在他面前／面容之前”，表示进入他的临在并向他陈说。两行都保留这一短语，以呈现希伯来诗歌的平行与重复。
- source_word: שִׂיחִי
  choice: 我的苦情
  rationale: שִׂיחַ 可指沉思、低语或诉怨；本篇为困苦中的哀歌，且与“我的困境”平行，因此“苦情”较自然地涵盖带着痛苦的倾诉，同时不把它强化为责难。
- source_word: צָרָתִי
  choice: 我的困境
  rationale: צָרָה 指患难、窘迫或苦难处境。“困境”兼顾外在处境及其造成的压力，且符合现代汉语表达。
- source_word: אַגִּיד
  choice: 陈明
  rationale: נגד 的使役词干表示告知、说明或陈说。“陈明”体现有意识地把自己的处境说清楚，语体庄重而不生硬。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留两行“在他面前”的重复，以再现原文平行结构；“倾诉／陈明”和“苦情／困境”形成自然对应，同时保留原词的语义幅度。
