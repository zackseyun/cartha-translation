  text: בְּ/הִתְעַטֵּ֬ף עָלַ֨/י רוּחִ֗/י וְ/אַתָּה֮ יָדַ֪עְתָּ נְֽתִיבָ֫תִ֥/י בְּ/אֹֽרַח ז֥וּ אֲהַלֵּ֑ךְ טָמְנ֖וּ פַ֣ח לִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/003.yaml
  text: When my spirit grows faint within me[a], you know my path. On the way where I walk[b], they have hidden a trap for me.
translation:
  language: zh_hans
  text: 当我心灵衰弱时[a]，你知道我的路径。在我所行的路上，他们暗中为我设下陷阱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当我的心灵不堪重压时。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“网罗。”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִתְעַטֵּף
  choice: 当……渐渐衰弱时
  rationale: 介词 בְּ 加不定式构成时间从句。该动词可表示衰弱、昏厥或被重压；“渐渐衰弱”在现代汉语中自然，也保留困顿加深的意味。
- source_word: רוּחִי עָלַי
  choice: 我里面的灵
  rationale: רוּחַ 在此指诗人受困时的内在生命或精神；עָלַי 字面为“在我之上”，但在这一希伯来语表达中译作“我里面”更符合汉语习惯，也不把它误解为空间位置。
- source_word: יָדַעְתָּ
  choice: 你知道
  rationale: 完成式在诗歌和状态动词中可表达当前持续的事实；“你知道”符合诗人此刻向上帝祷告的语境。
- source_word: נְתִיבָתִי
  choice: 我的路径
  rationale: 该词指小径、路径，也可比喻人生行程；“路径”简洁地保留了原文意象。
- source_word: בְּאֹרַח זוּ אֲהַלֵּךְ
  choice: 在我所行的路上
  rationale: זוּ 在此作关系词，引出修饰“路”的从句；הלך 表示行走。这样的译法自然，并保留道路意象。
- source_word: טָמְנוּ
  choice: 暗中……设下
  rationale: 该动词本义为藏匿，常用于暗设捕捉人的器具；结合宾语译为“暗中设下”，清楚表达敌对行动的隐蔽性。
- source_word: פַח לִי
  choice: 为我设下圈套
  rationale: פַח 指捕捉用的陷阱或网罗；“圈套”是普通现代读者易懂的表达，לִי 表明圈套针对诗人。
theological_decisions:
- issue: 上帝对诗人所行道路的认识
  choice: 你知道我的路径
  alternative: 你早已知道我的路径
  rationale: 原文完成式可按状态意义理解为当前的“知道”。不添加“早已”，可避免超出原文明确表达，同时保留上帝在诗人困境中对其道路的现实知晓。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。首句保留“灵”这一直接对应词，并以“我里面”表达希伯来语惯用结构；后半句保留连续的道路意象，同时用“暗中设下圈套”使隐蔽敌意清楚易懂。
