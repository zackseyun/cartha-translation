  yaml_path: translation/ot/psalms/109/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: zh_hans
  text: 交给乐长。大卫[a]的诗。神啊，我所赞美的神，求你不要缄默。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的”也可译作“大卫所作”“为大卫而作”或“献给大卫”；希伯来语题注的表达有歧义。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题注中通常指负责音乐或敬拜演奏的人；译作“交给乐长”自然地表达其受事或用途含义，同时不把具体礼仪职务说得过死。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 在题注中可表示作者、归属、关联或献予；正文采用传统而简洁的“大卫的”，并以脚注保留其歧义。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 指配乐吟唱的诗歌；现代中文标题中用“诗”简洁庄重，且与诗篇体裁相称。
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: 神啊，你是我所赞美的
  rationale: 希伯来语直译近于“我赞美的神”；采用关系句使现代中文自然，并保留诗人以神为其赞美对象的含义。
- source_word: אַל־תֶּחֱרַשׁ
  choice: 求你不要缄默
  rationale: חרש 在此指保持沉默、不作回应；“缄默”庄重且符合向神呼求的语境，“求”体现希伯来语禁令在祈求中的语用功能。
theological_decisions:
- issue: “我所赞美的神”的语义关系
  choice: 神啊，你是我所赞美的
  alternative: 神啊，你是我的荣耀／赐我赞美的神
  rationale: תְהִלָּתִי 最直接表示“我的赞美”，可理解为诗人赞美的对象；译文不将其扩展为神赐予诗人荣耀或赞美，以免加入原文未明说的神学因果。
- issue: 神的“沉默”
  choice: 不要缄默
  alternative: 不要置之不理
  rationale: 保留原文拟人化且带张力的“沉默”意象，不把它解释性地收窄为不理会、不开口或不施行审判。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“乐长”保留古代圣殿音乐职分的色彩；“缄默”与后文控诉语境协调。脚注标记已置于正文相关句末。
