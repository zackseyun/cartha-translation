source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְה֘וִ֤ה אֲדֹנָ֗/י עֲֽשֵׂה אִ֭תִּ/י לְמַ֣עַן שְׁמֶ֑/ךָ כִּי ט֥וֹב חַ֝סְדְּ/ךָ֗ הַצִּילֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/021.yaml
  text: But you[a], O Lord Yahweh, deal with me for your name’s sake; because your steadfast love is good[d][c][b], deliver me.
translation:
  language: zh_hans
  text: 但你，耶和华，我的主啊[a]，求你为你名的缘故眷顾我[b]；因你的慈爱[c]本为美善，求你搭救我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文连续使用两个称谓：“耶和华，我的主”。有些译本译作“主耶和华”。
    reason: alternative_reading
  - marker: b
    text: “眷顾我”原文较直译为“对我行事”，也可译作“为我行事”。
    reason: lexical_alternative
  - marker: c
    text: “慈爱”所译的希伯来词 חֶסֶד 也含忠贞、信实、恩慈和怜悯等意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 但你
  rationale: 连接词在上下文中带有转折意味，诗人从仇敌的攻击转向对上帝的呼求；“但你”自然地表达这一对比。
- source_word: יְהוָה אֲדֹנָי
  choice: 耶和华—我的主啊
  rationale: 保留原文连续使用的两个不同称号及其次序；破折号帮助现代汉语读者辨认这是同一位受呼求者的双重称谓。
- source_word: עֲשֵׂה אִתִּי
  choice: 眷顾我
  rationale: 字面近于“对我行事／与我行事”，在祈求搭救的语境中是请求上帝有利地介入。“眷顾我”符合现代汉语祷告语体，同时以脚注保留原文较宽泛的表达。
- source_word: לְמַעַן שְׁמֶךָ
  choice: 为你名的缘故
  rationale: 保留希伯来语以神之“名”为诉求依据的惯用表达，不将“名”解释性改写为名誉或品格。
- source_word: כִּי טוֹב חַסְדְּךָ
  choice: 因你的慈爱本为美善
  rationale: 将 כִּי 处理为因果连词，并保留 טוֹב 对 חֶסֶד 的判断。“本为”使汉语谓语关系清楚，但未增添新的神学内容。
- source_word: חַסְדְּךָ
  choice: 你的慈爱
  rationale: “慈爱”是现代中文圣经语境中自然且庄重的对应语，可涵盖怜爱、忠诚与信实；脚注说明该词的丰富语义。
- source_word: הַצִּילֵנִי
  choice: 搭救我
  rationale: 准确表达 נצל Hiphil 从危险中救出的意思，并保持诗篇祈求语体。
theological_decisions:
- issue: 如何翻译双重神圣称谓 יְהוָה אֲדֹנָי
  choice: 耶和华—我的主啊
  alternative: 主耶和华啊；耶和华主啊
  rationale: 马所拉文本依次写出神名 YHWH 和称谓 Adonai；译文不把二者合并成一个称号，也不颠倒次序。“我的主”体现 אֲדֹנָי 的传统读法及诗人的直接、个人性呼求。
- issue: עֲשֵׂה אִתִּי 是否明确表示有利行动
  choice: 正文译作“眷顾我”，脚注保留“对我行事”的宽泛表达
  alternative: 为我行事；照你的旨意待我；对我行事
  rationale: 该短语本身语义宽泛，但后面的“搭救我”和全节祈求语境表明诗人期待有利介入。正文采用自然汉语，脚注避免把原文潜在的开放性完全抹去。
- issue: חֶסֶד 的盟约色彩
  choice: 慈爱
  alternative: 信实的爱；忠贞之爱；怜悯
  rationale: 原词兼有爱、忠诚、恩慈等内涵；“慈爱”不把其限定为单一教义术语，脚注则提示其忠贞、信实维度。
translation_notes:
  register: 采用现代、庄重而可朗读的诗篇祈祷语体。“求你”补足汉语祈使表达所需的礼敬语气；分号保留诗行中前一请求及其理由、后一明确请求之间的推进关系。
