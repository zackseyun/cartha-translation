  text: יְקַֽלְלוּ הֵמָּה֮ וְ/אַתָּ֪ה תְבָ֫רֵ֥ךְ קָ֤מוּ וַ/יֵּבֹ֗שׁוּ וְֽ/עַבְדְּ/ךָ֥ יִשְׂמָֽח־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/028.yaml
  text: They may curse[a], but you will bless. They rise up and are put to shame[b], but your servant will rejoice.
translation:
  language: zh_hans
  text: 任凭他们咒诅[a]，你却要赐福。他们起来，必蒙羞[b]；你的仆人却要欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让他们咒诅，你却赐福。”开头的未完成式也可理解为祈愿或容许语气。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译：“他们起来，就蒙羞。”这里的“起来”可能暗示采取敌对行动，但原文只明说他们“起来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַֽלְלוּ הֵמָּה
  choice: 任凭他们咒诅
  rationale: 动词为Piel未完成式，结合后面的转折，可表达让步或容许意味；“任凭他们”既体现独立代词 הֵמָּה 的强调，也保留“他们尽管咒诅”的语气。
- source_word: וְ/אַתָּה תְבָ֫רֵךְ
  choice: 你却要赐福
  rationale: 连词在此表达鲜明对比，译作“却”；“赐福”自然表达上帝施予福分的行动，未完成式按语境译作将来或意愿性的“要”。
- source_word: קָ֤מוּ
  choice: 他们起来
  rationale: קום 的基本义是“起来、站起”；上下文可能暗含敌对行动，但原文没有明说攻击，因此不将其具体化。
- source_word: וַ/יֵּבֹ֗שׁוּ
  choice: 必蒙羞
  rationale: בוש 可指羞愧或遭受羞辱；“蒙羞”侧重客观受辱的结果，也保留诗篇咒诅语境中的公开羞耻意味。连续式在这里结合诗歌语境自然表达预期结果，故用“必”。
- source_word: וְֽ/עַבְדְּ/ךָ֥
  choice: 你的仆人却
  rationale: עבד 加第二人称单数后缀即“你的仆人”；连词因与敌人的蒙羞形成对比而译作“却”。
- source_word: יִשְׂמָֽח
  choice: 要欢喜
  rationale: שמח 表示欢喜、喜乐；未完成式与前文的预期结果相应，译作“要欢喜”，语言庄重而自然。
theological_decisions:
- issue: “你的仆人”的所指
  choice: 保留为说话者在上帝面前的自称
  alternative: 泛指一位义仆，或直接赋予弥赛亚专称意义
  rationale: 本节在祷告语境中最直接地表现诗人谦卑自称；译文不额外限定其神学所指，也不排除读者在更广正典语境中的理解。
- issue: 咒诅与赐福的关系
  choice: 保留敌人咒诅与上帝赐福之间的对照
  alternative: 解释为敌人的咒诅无效，或明确补出赐福对象
  rationale: 原文没有明说上帝赐福的对象，也未直接陈述咒诅是否生效；译文不补足这些含义，以保存原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“任凭……却……”呈现首句的让步性对照；“蒙羞”与“欢喜”形成简洁平衡。所有原文未明确的行动对象和神学指向均未擅自补入。
