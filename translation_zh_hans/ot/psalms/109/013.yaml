source:
  edition: WLC
  text: יְהִֽי אַחֲרִית֥/וֹ לְ/הַכְרִ֑ית בְּ/ד֥וֹר אַ֝חֵ֗ר יִמַּ֥ח שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/013.yaml
  text: May his posterity be cut off[a]; in the next generation may their name be blotted out.
translation:
  language: zh_hans
  text: 愿他的后代被剪除[a]；愿他们的名在下一代被涂抹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他的结局归于灭亡。”原文所用的词可指“结局”或“未来”，但本节下半句提到“他们的名”，所以正文按“后代”理解。
    reason: 词义上的另一种可能
lexical_decisions:
- source_word: יְהִי
  choice: 愿……
  rationale: 该动词为祈愿式，表达祈求或咒诅；“愿”自然保留其意愿语气，而不把它弱化为一般预言。
- source_word: אַחֲרִיתוֹ
  choice: 他的后代
  rationale: 此词可指“结局”“未来”，但下句转用复数“他们的名”，且语境涉及家系断绝，因此此处以“后代”最能衔接上下文，同时用脚注保留词义歧义。
- source_word: לְהַכְרִית
  choice: 被剪除
  rationale: לְ 加使役式不定词表达所趋向的结果；“被剪除”既保留原文意象，也自然表达家系遭断绝。
- source_word: בְּדוֹר אַחֵר
  choice: 在下一代
  rationale: 字面可作“在另一个世代”，语境指随后的世代；“下一代”在现代汉语中清楚自然。
- source_word: יִמַּח
  choice: 被涂抹
  rationale: 该词的被动形表示被抹去或除掉，与“名”搭配时，“被涂抹”保留原文图像及圣经语体。
- source_word: שְׁמָם
  choice: 他们的名
  rationale: 原文后缀为复数，承接作为群体的后代；保留单数集合名词“名”，体现从单数对象转向其众后代的语法变化。
theological_decisions:
- issue: 本节的咒诅祈愿语气
  choice: 保留针对恶人后代的祈愿式审判用语
  alternative: 改译为对其未来的中性预言
  rationale: 祈愿式动词及诗篇109篇的上下文表明，这是求施行审判的祷告，并非单纯预测；译文不淡化其严厉性，也不添加解释以消解张力。
- issue: אַחֲרִיתוֹ所指对象
  choice: 正文译作“他的后代”
  alternative: 译作“他的结局”或“他的未来”
  rationale: 下一分句的复数“他们的名”更自然地回指后代或家系；但原词确有“结局/未来”的词义，因此以脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“剪除”“涂抹”保留诗歌的强烈意象和经文语感；分号呈现两个平行的祈愿句。
