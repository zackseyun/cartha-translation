  text: יִֽהְיֽוּ יָמָ֥י/ו מְעַטִּ֑ים פְּ֝קֻדָּת֗/וֹ יִקַּ֥ח אַחֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/008.yaml
  text: May his days be few[a]; may another take his office.
translation:
  language: zh_hans
  text: 愿他的日子短少；愿别人接替他的职分。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “职分”或译“监管之责”、“职责”或“职位”。希伯来语指受托的责任或受任的角色。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: 愿……
  rationale: 在咒愿语境和平行结构中表达祈愿式语气，而非普通将来时。
- source_word: יָמָיו מְעַטִּים
  choice: 他的日子短少
  rationale: 直译为日子数目不多，也自然传达寿命短促之意。
- source_word: פְּקֻדָּתוֹ
  choice: 他的职分
  rationale: 该词指受托的职责、监管或任命的职位；“职分”既能表达受托角色，又不把诗篇语境过度限定为教会职务。
- source_word: יִקַּח אַחֵר
  choice: 愿别人接替
  rationale: יִקַּח 字面为“拿取”，此处指另一人取得并承担该职分；“接替”在现代汉语中准确自然，并保留祈愿语气。
theological_decisions:
- issue: 如何翻译后来在《使徒行传》1:20中引用的 פְּקֻדָּתוֹ
  choice: 职分
  alternative: 监管之责、职责、职位
  rationale: “职分”保留受托责任和所任角色的含义，也与后来的引用自然衔接，但不把原诗中的词强行解释为专门的教会职位。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“愿……愿……”保留本节咒愿式平行结构；“日子短少”兼顾原文形式与自然表达。脚注标记置于相关词“职分”之后。
