  text: יִזָּכֵ֤ר עֲוֺ֣ן אֲ֭בֹתָי/ו אֶל יְהוָ֑ה וְ/חַטַּ֥את אִ֝מּ֗/וֹ אַל תִּמָּֽח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/014.yaml
  text: May the guilt of his fathers be remembered before Yahweh[c][b][a], and may the sin of his mother not be blotted out.
translation:
  language: zh_hans
  text: 愿他列祖[b]的罪责[a]在雅威面前被记住；愿他母亲的罪不被涂抹[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪责”也可译作“罪孽”；希伯来词可指罪恶本身、罪责，或犯罪所带来的责任。
    reason: lexical_alternative
  - marker: b
    text: “列祖”原文直译为“他的父亲们”，可泛指他的先祖。
    reason: lexical_alternative
  - marker: c
    text: “涂抹”也可译作“抹去”或“消除”，保留了把罪视为记录而予以擦除的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזָּכֵר
  choice: 愿……被记住
  rationale: 这是זכר的尼法勒未完成式，在咒诅祈愿语境中表达愿望；用被动式保留原文形态。
- source_word: עֲוֺן
  choice: 罪责
  rationale: עָוֹן可指罪孽、罪责或犯罪所带来的责任；本句强调这责任在雅威面前被记住，因此译作“罪责”，并以脚注保留其他可能。
- source_word: אֲבֹתָיו
  choice: 他列祖
  rationale: 原文直译为“他的众父亲”，在此指男性先祖；“列祖”既简洁庄重，也比“父亲们”更符合现代汉语亲属表达。
- source_word: אֶל יְהוָה
  choice: 在雅威面前
  rationale: 介词אֶל与“记念”连用，在此表达处于神面前、由神记住的意思；“在……面前”也保留可能的审判语感。
- source_word: וְחַטַּאת אִמּוֹ
  choice: 他母亲的罪
  rationale: חַטָּאת在此与עָוֹן平行，指罪而非赎罪祭；所属关系按原文直译。
- source_word: אַל תִּמָּח
  choice: 愿……不被涂抹
  rationale: מחה意为擦去、抹除；此处是否定祈愿，采用被动表达，并保留罪如同记录可被涂抹的意象。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也明确保留专名性质，不以称号替代。
- issue: 列祖之罪责被记住的表述
  choice: 按原文保留祈愿式咒诅语言
  alternative: 解释为后代自动承担祖先的罪
  rationale: 本节是在诗人的咒诅祈愿中说话；译文不把这句话扩展成关于罪责代际归算方式的系统教义，也不削弱原文的尖锐张力。
translation_notes:
  register: 采用现代、庄重而易懂的祈愿句式。“列祖”略带经文语体，但在现代汉语中仍清楚自然；两个“愿”对应原文平行结构。“雅威”作为专名使用。
