base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/011.yaml
  text: May a creditor seize all that belongs to him[a], and may strangers plunder the fruit of his labor.
translation:
  language: zh_hans
  text: 愿债主夺取他所有的一切[a]；愿外人掠走他劳碌所得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿债主设下网罗，夺取他所有的一切。”原文动词可指设下网罗或捕捉；在这里与“债主”连用，很可能是指债主索取并夺走他的财产。
    reason: 词义备选
lexical_decisions:
- source_word: יְנַקֵּשׁ
  choice: 夺取
  rationale: 该动词的强化词干可指设网罗、捕捉；与“债主”及“他所有的一切”连用时，语境指债主强行扣取其财产。“夺取”既自然，也保留其强制意味。
- source_word: נ֭וֹשֶׁה
  choice: 债主
  rationale: 指借出钱财并追讨偿还的人；“债主”是现代汉语中自然且准确的对应表达。
- source_word: לְכָל אֲשֶׁר לוֹ
  choice: 他所有的一切
  rationale: 概括指属于他的全部财物，保留原文全面而明确的所有关系。
- source_word: וְיָבֹזּוּ
  choice: 掠走
  rationale: בזז 表示以强力抢掠战利品或财物；“掠走”清楚传达掠夺并带走的动作。
- source_word: זָרִים
  choice: 陌生人
  rationale: 指亲族或群体以外的人；“陌生人”保留关系上的疏离，不将含义过度限定为外族或外国人。
- source_word: יְגִיעוֹ
  choice: 他劳碌所得
  rationale: יְגִיעַ 在此指劳作产生的成果或收益，而不只是劳作本身；“劳碌所得”简洁传达这一含义。
theological_decisions:
- issue: 咒诅祈愿中的祈使语气
  choice: 将两个未完成式译作祈愿：“愿……夺取……；愿……掠走……”。
  alternative: 译作单纯将来：“债主必夺取……，陌生人必掠走……”。
  rationale: 诗篇109篇这一段是咒诅性的祈愿，原文未完成式在语境中具有祈愿语气。用“愿”既保留祷告／咒诅的力度，也避免将其处理成单纯的未来预告。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“债主”比“债权人”更贴近日常表达；“劳碌所得”保留诗意，同时明确所掠夺的是劳动成果。主文中的[a]与脚注标记一致。
