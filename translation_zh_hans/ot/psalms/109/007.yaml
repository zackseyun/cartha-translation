  text: בְּ֭/הִשָּׁ֣פְט/וֹ יֵצֵ֣א רָשָׁ֑ע וּ֝/תְפִלָּת֗/וֹ תִּהְיֶ֥ה לַֽ/חֲטָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/007.yaml
  text: When he is judged[a], let him come out guilty[b], and let his prayer become sin.
translation:
  language: zh_hans
  text: 他受审判时，愿他被判有罪；愿他的祷告算为罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被判有罪”也可译作“显为恶人”；“算为罪”也可译作“成为罪”。
    reason: 保留 רָשָׁע 的司法性与品格性词义，以及 היה ל 结构在“算为”与“成为”之间的表达空间。
lexical_decisions:
- source_word: בְּהִשָּׁפְטוֹ
  choice: 他受审判时
  rationale: 介词 בְּ 加 שׁפט 的尼法勒不定式构造及第三人称阳性单数词尾，表达时间关系，并保留被动、司法性的含义。
- source_word: יֵצֵא רָשָׁע
  choice: 愿他被判有罪
  rationale: יֵצֵא 字面为“出来”，在法庭语境中指案件审理的结果；רָשָׁע 在此可指被裁定有罪。中文以“被判有罪”自然表达这一司法习语，同时用“愿”体现祈愿语气。
- source_word: וּתְפִלָּתוֹ
  choice: 愿他的祷告也
  rationale: תְּפִלָּה 是“祷告”；连词 וּ 将本分句与前一祈愿并列，译作“也”可清楚呈现递进并列关系。
- source_word: תִּהְיֶה לַחֲטָאָה
  choice: 算为罪
  rationale: היה 加 ל 可表达成为、归作或结果；“算为罪”符合汉语习惯，并保留祷告被视作罪的司法或评定意味。
theological_decisions:
- issue: 咒诅祷告语境中动词形式的语气
  choice: 译为祈愿：“愿他……；愿他的……”
  alternative: 译为预告性的将来：“他必……；他的祷告必……”
  rationale: 本诗段落是一连串祈愿；用“愿”能体现希伯来语未完成式在此处的祈愿功能，又不把话语改写成确定预言。
- issue: רָשָׁע 在司法语境中的含义
  choice: 被判有罪
  alternative: 显为恶人／带着恶名出来
  rationale: 该词既可表示“邪恶的”，也可在法庭语境中表示“有罪的”。因前句明确提到受审，正文采用司法意义，同时以脚注保留较宽泛的词义。
- issue: 祷告“成为罪”的关系
  choice: 算为罪
  alternative: 成为罪／归于罪
  rationale: 原文未说明祷告为何或以何种机制成为罪，因此不补入“神不垂听”等解释；“算为罪”保留其评定性的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“受审判”“被判有罪”保持法庭语境；两个“愿”清楚传达咒诅祷告中的祈愿语气。
