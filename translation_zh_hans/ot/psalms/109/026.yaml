  text: עָ֭זְרֵ/נִי יְהוָ֣ה אֱלֹהָ֑/י ה֭וֹשִׁיעֵ֣/נִי כְ/חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/026.yaml
  text: Help me[a], O Yahweh my God; save me according to your steadfast love.
translation:
  language: zh_hans
  text: 雅威——我的上帝啊，求你帮助我；照着你坚贞的爱[a]拯救我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照着你坚贞的爱”也可译作“按你盟约中的信实”。希伯来语חֶסֶד表示忠贞、持久的爱，也可带有盟约意味。
    reason: 词义替代译法
lexical_decisions:
- source_word: עָזְרֵנִי
  choice: 求你帮助我
  rationale: עזר的祈使式带第一人称单数后缀，是直接而急切的求助；“求你帮助我”符合现代汉语祈祷语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 该词带第一人称单数后缀，在此与“雅威”同位并构成直接呼告。
- source_word: הוֹשִׁיעֵנִי
  choice: 拯救我
  rationale: ישׁע的使役词干祈使式带第一人称单数后缀；“拯救我”保留了诗篇中从危难获得神圣救援的宽泛含义。
- source_word: כְחַסְדֶּךָ
  choice: 照你坚贞的爱
  rationale: 前置词כְ表示准则或依据；חֶסֶד指忠贞、持久的爱，并可带有盟约语境。“坚贞的爱”既自然，又不过度明说经文未直接表达的“盟约”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；采用“雅威”保留专名，并避免以“主”这一称号替代。
- issue: חֶסֶד是否明译为盟约忠信
  choice: 坚贞的爱
  alternative: 盟约中的信实／慈爱
  rationale: 该词可含盟约意味，但本节未明说“盟约”；正文保留爱、忠贞与持久兼具的语义，脚注说明可能的盟约内涵。
translation_notes:
  register: 采用现代、庄重而自然的祈祷语体；以“求你”表达两个祈使式的恳求语气，并保留原文两个平行请求。
