  text: My knees give way from fasting[a], and my flesh grows lean from lack of fat.
translation:
  language: zh_hans
  text: 我的双膝因禁食而发软；我的肉身也因缺少脂肪而消瘦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的肉身也消瘦，毫无脂肪。”希伯来语这一表达指身体脂肪消失，即身体变得枯瘦。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּי
  choice: 我的双膝
  rationale: 该词是“膝”的复数形式，带第一人称单数后缀；译作“我的双膝”自然地保留了身体软弱的具体形象。
- source_word: כָּשְׁלוּ
  choice: 发软
  rationale: 该动词可指绊跌、摇晃或衰弱；与“双膝”及禁食造成的身体虚弱连用时，“发软”是现代汉语中自然且贴切的表达。
- source_word: מִצּוֹם
  choice: 因禁食
  rationale: 介词 מִן 在此表示原因，“因禁食”清楚传达双膝无力的缘由，同时不把禁食改释为一般性的缺粮。
- source_word: וּבְשָׂרִי
  choice: 我的肉体也
  rationale: בשר 的基本义是“肉、肉体”；这里描述身体状况，保留“肉体”比泛化为“身体”更接近原文。“也”自然承接并列分句。
- source_word: כָּחַשׁ
  choice: 消瘦
  rationale: 该动词在此表示变瘦、枯瘦；“消瘦”准确体现身体脂肪减少所造成的状态。
- source_word: מִשָּׁמֶן
  choice: 失去了脂肪
  rationale: 字面结构简约而略有歧义，可理解为肉体因脂肪消失而变得瘦弱。“失去了脂肪”在现代汉语中清楚传达这一身体消瘦的图景，又不引入额外病因。
