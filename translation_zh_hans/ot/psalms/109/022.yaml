  yaml_path: translation/ot/psalms/109/022.yaml
  text: For I am poor and needy[a], and my heart is wounded within me.
translation:
  language: zh_hans
  text: '因为我困苦穷乏，

    我心在我里面受了伤[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受了伤”或译“被刺透”；这里的希伯来语可表示被刺伤、被击伤，甚至遭受致命打击。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词引出诗人恳求的理由；“因为”在现代汉语中自然地保留了这一因果连接。
- source_word: עָנִי
  choice: 贫穷
  rationale: 此词可指贫穷、受苦或受压迫的人；与 אֶבְיוֹן 并列时，“贫穷”保留其困顿处境，又不过度限定为单纯的属灵谦卑。
- source_word: אֶבְיוֹן
  choice: 穷乏
  rationale: 表示缺乏、贫困而无力自助；译作“穷乏”既与“贫穷”有所区别，也保留原文成对用词的加强作用。
- source_word: אָנֹכִי
  choice: 我
  rationale: 原文使用独立人称代词，带有强调意味；汉语以明确的“我”自然表达。
- source_word: לִבִּי
  choice: 我的心
  rationale: “心”忠实保留希伯来语对人内在生命、情感与意志中心的表达。
- source_word: חָלַל
  choice: 受了重创
  rationale: 此处该动词描写内在如同被刺伤或遭到致命打击；“受了重创”保留伤害的强烈程度，同时不把其多义性局限为某一种具体伤法。
- source_word: בְּקִרְבִּי
  choice: 在我里面
  rationale: 直陈伤痛发生在诗人内部，保留原文的空间性隐喻及其强调效果。
theological_decisions:
- issue: “心受创”是身体创伤还是内在痛苦
  choice: 保留“我的心在我里面受了重创”的形象表达
  alternative: 意译为“我内心痛苦不堪”
  rationale: 原文以强烈的受伤意象描述内在状态；不将其简化为一般情绪痛苦，也不武断认定为字面的身体伤害。
translation_notes:
  register: 采用现代、庄重而易懂的诗体语言。保留“我的心在我里面”略带希伯来诗歌色彩的表达，以传达原文内在受创的鲜明意象；分行呈现两个并列诗句。
