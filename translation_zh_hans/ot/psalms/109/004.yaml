  yaml_path: translation/ot/psalms/109/004.yaml
  text: In return for my love[a], they accuse me, but I am prayer.
translation:
  language: zh_hans
  text: '他们以敌意回报我的爱；

    但我祷告。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“但我（是）祷告”。也可译作“但我祷告”或“但我是个祷告的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: 以……回报
  rationale: 此处表示交换或报偿关系，并带有以恶报爱的反差；“以……回报”在现代汉语中自然地传达这一含义。
- source_word: אַהֲבָתִי
  choice: 我的爱
  rationale: 直接保留名词“爱”，既符合原词，也保留与全节敌对行为之间的鲜明对照。
- source_word: יִשְׂטְנוּנִי
  choice: 他们以敌对回报
  rationale: שׂטן 的动词在此可指作对、敌视或控告。结合 תַּחַת 译作“以敌对回报”，保留较宽的敌对含义，避免无充分语境时将司法性的“控告”定为唯一解释。
- source_word: וַאֲנִי
  choice: 但我
  rationale: 连接词形式上可作“而我”，此处明显引出与敌人行为相对照的诗人反应，故译“但我”。
- source_word: תְפִלָּה
  choice: 就是祷告
  rationale: 原文是无系词的名词句，直译为“我祷告”，同时以脚注保留更明确的自然表达。
theological_decisions:
- issue: וַאֲנִי תְפִלָּה 这一无动词名词句的表达力度
  choice: 但我就是祷告
  alternative: 但我祷告；但我是个祷告的人
  rationale: 主文保留希伯来语把说话者与“祷告”直接等同的凝练、强烈表达，不把它无声地解释为一次动作或一种固定身份；脚注列出语义上更明确的可能表达。
- issue: יִשְׂטְנוּנִי 的敌对或控告色彩
  choice: 以敌对回报
  alternative: 控告我；与我作对
  rationale: 该动词可带一般敌对和司法控告的色彩。此节自身未明确限定场景，采用较宽的“敌对”以保存歧义，不把司法含义定死。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分号和换行突出敌人的敌对回应与诗人专注祷告之间的对照；“就是祷告”刻意保留原文罕见而凝练的名词句。
