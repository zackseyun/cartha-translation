  text: יִהְי֣וּ נֶֽגֶד יְהוָ֣ה תָּמִ֑יד וְ/יַכְרֵ֖ת מֵ/אֶ֣רֶץ זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/015.yaml
  text: May they be before Yahweh continually[a], and may he cut off their memory from the earth.
translation:
  language: zh_hans
  text: 愿这些事常在耶和华面前；愿他从世上[a]除去人对它们的记念。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世上”或译“那地”；希伯来语 אֶרֶץ 可指全地，也可指特定的土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: 愿……摆在
  rationale: 这是 היה 的第三人称阳性复数未完成式；在咒诅祈祷的语境中具有祈愿语气。“愿……摆在”既表达祈求，也与 נֶגֶד 所表示的持续呈于面前相配。
- source_word: נֶגֶד
  choice: 在……面前
  rationale: 表示处于某人面前或其临在之中；“在耶和华面前”自然、庄重，并保留可能含有的审察意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以一般性称号替代。
- source_word: תָּמִיד
  choice: 常
  rationale: 表达持续不断的状态；“常摆在……面前”是自然凝练的现代中文，也符合诗歌语体。
- source_word: וְיַכְרֵת
  choice: 愿他……除灭
  rationale: כרת 的使役未完成式承接前句，在本段咒诅祈祷中宜作祈愿理解。“除灭”传达彻底消除之意，又适合其宾语“记念”。
- source_word: מֵאֶרֶץ
  choice: 从世上
  rationale: אֶרֶץ 可指全地或特定土地；此处“从世上”自然表达从人间彻底消除，但以脚注保留“从那地”的可能。
- source_word: זִכְרָם
  choice: 他们的记念
  rationale: 这里指他们留在人间、被人记起的名声或纪念。“记念”保留希伯来语的纪念性内涵，比单纯心理层面的“记忆”更贴切。
theological_decisions:
- issue: 两个未完成式的咒诅性／祈愿性语气
  choice: 两句都译为祈愿：“愿……；愿……”。
  alternative: 可理解为直陈的将来：“这些事必常在耶和华面前，他也必……”。
  rationale: 上下文是咒诅祈祷，两个未完成式自然可承载祈愿语气。如此翻译保留诗人祈求审判的力度，不将其弱化为单纯预言。
- issue: 复数主语“他们”所指
  choice: 译作“这些事”，承接上文所列祖先的罪孽与母亲的罪恶。
  alternative: 也可较字面地译作“愿它们”，但现代中文中指代不清；若理解为上文人物，则可译“愿他们”。
  rationale: 希伯来语 יִהְיוּ 为阳性复数，而上文“罪孽”和“罪恶”在希伯来语中均为阳性名词，因此最自然地回指这些罪恶。中文用“这些事”明确指代，同时不额外界定其具体内容。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“常摆在耶和华面前”保留原文的空间性意象和持续意味；“除灭他们的记念”保持咒诅诗的强烈措辞。脚注标记[a]已置于正文对应词后。
