revisions:
- from: 愿这些事常摆在耶和华面前；愿他从世上[a]除灭他们的记念。
  to: 愿这些事常在耶和华面前；愿他从世上[a]除去人对它们的记念。
  rationale: 修订纠正“摆在”所引入的放置动作，改为直接表达原文“在……面前”的持续状态；并以符合现代汉语的“除去人对它们的记念”呈现“从地上剪除其记念”的惯用意义。保留“这些事”而不将其进一步限定为某一类罪或某一群人，以维持原文代词在上下文中的指涉弹性。
