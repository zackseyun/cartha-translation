  text: וַ/יִּלְבַּ֥שׁ קְלָלָ֗ה כְּ/מַ֫דּ֥/וֹ וַ/תָּבֹ֣א כַ/מַּ֣יִם בְּ/קִרְבּ֑/וֹ וְ֝/כַ/שֶּׁ֗מֶן בְּ/עַצְמוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/018.yaml
  text: He clothed himself with cursing as his garment[a]; it came into his inward parts like water[c][b], and like oil into his bones.
translation:
  language: zh_hans
  text: 他把咒诅当作衣服穿上[a]；咒诅就像水一样进入他体内[b]，又像油一样渗入他的骨头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他把咒诅当作袍子披上。”
    reason: lexical_alternative
  - marker: b
    text: “他体内”也可译作“他的内在深处”；原文可指人的内部。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְבַּשׁ
  choice: 穿上
  rationale: לָבַשׁ表示穿衣或给自己穿上；“穿上”自然简洁，并保留主动披戴的意象。
- source_word: קְלָלָה
  choice: 咒诅
  rationale: קְלָלָה既可指咒诅的话或行为，也可指所招致的诅咒；中文“咒诅”保留这种施咒与受咒之间的张力。
- source_word: כְּמַדּוֹ
  choice: 当作衣服
  rationale: מַד指衣服、袍服；结合“穿上”，译为“当作衣服”自然地呈现明喻，不把衣物过度具体化为袍子。
- source_word: וַתָּבֹא
  choice: 就……进入
  rationale: 阴性单数动词承接阴性名词“咒诅”；“进入”准确表达其深入人体内部的动态意象。
- source_word: כַמַּיִם
  choice: 像水一样
  rationale: 直接保留水渗透内部的比喻。
- source_word: בְּקִרְבּוֹ
  choice: 他里面
  rationale: קֶרֶב可指内部、内里或内在生命；“他里面”既自然，也保留身体与内在层面的含混。
- source_word: וְכַשֶּׁמֶן
  choice: 又像油一样
  rationale: 保留并列结构与油深入渗透的诗歌意象；这里不引入祝福等额外含义。
- source_word: בְּעַצְמוֹתָיו
  choice: 渗入他的骨头
  rationale: 介词本可译“在”或“进入”；受前面运动动词支配并与“进入他里面”平行，“渗入”更自然地表达彻底浸透。
theological_decisions:
- issue: 咒诅意象及其施动者
  choice: 描述此人主动以咒诅为衣，而咒诅随后深入他自身；不明说这一结果由上帝直接施加。
  alternative: 明确译成上帝把咒诅加在他身上，或把它仅解释为心理后果。
  rationale: 希伯来文本强调此人与咒诅的主动关系及随后发生的反转，却没有在本节说明作用机制；译文保留诗性报应和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。以“穿上—进入—渗入”形成逐步深入的动作线，保留水、油、骨头的身体性意象，并避免把“咒诅”单向限定为咒骂行为或临到他的诅咒。
