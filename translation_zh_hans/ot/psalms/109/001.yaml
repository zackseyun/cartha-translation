  yaml_path: translation/ot/psalms/109/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: zh_hans
  text: 交给音乐指挥。大卫的[a]诗篇。\n我所赞美的上帝啊，求你不要沉默[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“由大卫所作”“为大卫而作”或“献给大卫”；希伯来语标题中的介词含义不确定。
    reason: alternative_reading
  - marker: b
    text: 或译“不要缄默”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐指挥
  rationale: 这是诗篇标题中的惯用语，指向负责音乐演唱或演奏的领唱、主管者；“圣乐指挥”在现代汉语中清楚自然，也符合诗篇的礼仪语境。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 希伯来介词 לְ 在标题中可表示作者、归属、关联或题献。“大卫的”在汉语中较为简洁，并保留一定的归属歧义，不明确限定为“大卫所作”。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 该词表示配合音乐的诗歌，是诗篇标题中的体裁名称；此处用“大卫的诗”比重复使用“诗篇”更自然。
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: 上帝啊，你是我所赞美的
  rationale: 直译为“我赞美的上帝”或“我赞美之上帝”。采用关系分句，既保留直接呼求，也以自然现代汉语表达“我的赞美”与上帝之间的关系，避免生硬的“我赞美的上帝啊”。
- source_word: אַל תֶּחֱרַשׁ
  choice: 求你不要沉默
  rationale: אַל 加未完成式在此表达迫切的否定祈求；חרשׁ 在语境中指保持沉默、不作回应。“求你不要沉默”准确呈现祷告语气。
theological_decisions:
- issue: 标题 לְדָוִד 的含义
  choice: 译作“大卫的”，不在正文中明确断定作者身份
  alternative: “大卫所作”“献给大卫”“关于大卫”
  rationale: 原文介词可表达作者、题献或关联。译文保留归属上的开放性，不作超出原文的作者论断。
- issue: אֱלֹהֵי תְהִלָּתִי 的关系
  choice: 译作“你是我所赞美的”
  alternative: “我的赞美之上帝”“使我得赞美的上帝”“我以你为荣耀的上帝”
  rationale: 原文构造简练而略有张力，最直接指诗人所赞美的上帝。译文不引入“赐下赞美”或“使人得荣耀”等原文未明确表达的神学解释。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告语言。标题保持短句节奏；正文以“上帝啊”呈现呼语，以“求你”体现 אַל 所表达的迫切恳求。无脚注，因此正文不设脚注标记。
