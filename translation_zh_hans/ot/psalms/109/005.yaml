  text: וַ/יָּ֘שִׂ֤ימוּ עָלַ֣/י רָ֭עָה תַּ֣חַת טוֹבָ֑ה וְ֝/שִׂנְאָ֗ה תַּ֣חַת אַהֲבָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/005.yaml
  text: They repaid me evil for good[a], and hatred for my love.
translation:
  language: zh_hans
  text: 他们以恶报我所行的善[a]，以恨报我的爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们把恶加在我身上，代替善。”希伯来语动词的字面意思是“放置、加上”，但这里很可能表示回报或报偿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: 他们……报
  rationale: שׂוּם本义为“放置、加上”；在עָלַי与两个תַּחַת对应短语构成的语境中，表达以某物回报某物。“报”自然传达这种报偿或回敬关系，同时以脚注保留字面译法。
- source_word: עָלַי
  choice: 我
  rationale: עַל加第一人称后缀字面为“在我身上/向着我”；汉语“报我所行的善”把它自然地纳入受事结构。
- source_word: רָעָה
  choice: 恶
  rationale: “恶”保留רָעָה在哀歌语境中的道德与敌意分量，也与下文“善”形成鲜明对照；“伤害”则会把含义收窄。
- source_word: תַּחַת
  choice: 以……报……
  rationale: תַּחַת可表示替代或交换。中文用“以恶报善、以恨报爱”的结构，清楚传达“作为……的回报”这一关系。
- source_word: טוֹבָה
  choice: 我所行的善
  rationale: טוֹבָה本身是广义的“善/好处”。为避免“报我的善”在现代汉语中生硬，并明确第一人称所有关系所指的是诗人的善行，译作“我所行的善”；不缩窄为“恩惠”。
- source_word: וְשִׂנְאָה
  choice: 以恨
  rationale: 名词שִׂנְאָה意为“仇恨、恨意”。“恨”在现代汉语诗歌平行句中简洁自然，并与“爱”形成名词性对仗。
- source_word: אַהֲבָתִי
  choice: 我的爱
  rationale: 该词是“爱”加第一人称单数后缀，直译为“我的爱”。此译法保留原文的简练与广义，不增添“我向他们所显的”等解释。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两个“以……报……”构成紧凑平行，保留“恶/善、恨/爱”的对照；脚注说明动词的字面意义及其语境含义。
