base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/031.yaml
  text: For he stands at the right hand of the poor[b][a], to save him from those who judge his soul.
translation:
  language: zh_hans
  text: '因为他站在穷乏人的右边，

    救他脱离审判他的人。[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判他的人”也可译作“他的审判官”或“判他有罪的人”；原文既可指担任审判者的人，也可泛指对他作出不利判决的人。
    reason: lexical_alternative
  - marker: b
    text: “他”原文直译为“他的性命”；也可指“生命”、“本人”或“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在此引出上一节赞美上帝的理由；“因为”自然保留其解释和因果作用。
- source_word: יַעֲמֹד
  choice: 必站在
  rationale: 未完成式在诗歌中可表达将来或确定无疑的行动；“必”传达上帝坚定可靠的扶助，同时不把它局限为一次性的过去行动。
- source_word: לִימִין
  choice: 在……的右边
  rationale: 保留原文的空间隐喻；在本语境中表示临近、支持和保护。
- source_word: אֶבְיוֹן
  choice: 穷乏人
  rationale: 该词指贫困、缺乏而易受欺压的人；“穷乏人”简洁地兼顾物质困顿与社会弱势。
- source_word: לְהוֹשִׁיעַ
  choice: 救
  rationale: 目的不定式表示上帝站在其右边是为了施行拯救；“救”适用于这里司法与生命受威胁的语境。
- source_word: מִשֹּׁפְטֵי
  choice: 脱离那些审判……的人
  rationale: 该分词可指担任审判者的人，也可泛指对他作出不利判决的人；正文保留“审判”的司法色彩，不直接限定为“定罪”。
- source_word: נַפְשׁוֹ
  choice: 他的性命
  rationale: נֶפֶשׁ在这里可指人的生命、本人或灵魂；“性命”切合受敌对审判者威胁的处境，又未将其限定为非物质的灵魂。
theological_decisions:
- issue: נֶפֶשׁ所表达的人观含义
  choice: 正文译作“性命”
  alternative: “灵魂”或“本人”
  rationale: 本节着重于穷乏者在敌对审判下蒙拯救。“性命”较自然地表达整个生命受到威胁，同时脚注保留“灵魂”和“本人”等可能含义，避免把原词过早限定为可与身体分离的非物质部分。
- issue: 上帝站在穷乏人右边的时间与性质
  choice: 译作“必站在”
  alternative: “站在”或“要站在”
  rationale: 希伯来语未完成式可表达将来、惯常行为或确定的行动；“必站在”突出诗人确信上帝会扶助穷乏人，但不将句子处理成单纯的时间预测。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“穷乏人”和“右边”保留诗篇常见的社会与空间意象；分行体现因由与拯救行动之间的平行推进。脚注标记置于相关分句末，正文中的[a][b]与脚注完全对应。
