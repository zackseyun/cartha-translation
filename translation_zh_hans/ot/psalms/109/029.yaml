  text: יִלְבְּשׁ֣וּ שׂוֹטְנַ֣/י כְּלִמָּ֑ה וְ/יַעֲט֖וּ כַ/מְעִ֣יל בָּשְׁתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/029.yaml
  text: May my accusers be clothed with disgrace[a], and wrap themselves in their shame like a robe.
translation:
  language: zh_hans
  text: 愿控告我的人披上羞辱[a]，愿他们以自己的羞耻裹身，如同裹上外袍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与我为敌的人”。希伯来语这个词既可泛指敌对者，也可较具体地指控告者。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִלְבְּשׁוּ
  choice: 愿……披上
  rationale: לבשׁ 的 Qal 未完成式第三人称阳性复数；在本诗祈求惩治仇敌的语境中，宜表达愿望语气。“披上”也保留了贯穿本节的穿衣意象。
- source_word: שׂוֹטְנַי
  choice: 控告我的人
  rationale: 该词是 שׂטן 的复数形式并带第一人称单数词尾，可泛指敌对者，也可特指控告者。上下文兼有敌对和控诉色彩，正文采用自然的“控告我的人”，并以脚注保留较宽泛的词义。
- source_word: כְּלִמָּה
  choice: 羞辱
  rationale: 该名词指公开蒙羞、受辱。“羞辱”与后面的“羞耻”有所区分，同时保留二者共同的羞耻语义场。
- source_word: וְיַעֲטוּ
  choice: 愿他们……裹身
  rationale: עטה 的 Qal 未完成式第三人称阳性复数，表示包裹、披裹；此处延续愿望语气。“裹身”自然呈现其反身意味及衣着比喻。
- source_word: כַמְעִיל
  choice: 如同披上外袍
  rationale: מְעִיל 指穿在外面的长衣或袍服。“外袍”清楚表达衣物种类；补出“披上”使中文比喻自然，并与前句的衣着意象呼应。
- source_word: בָּשְׁתָּם
  choice: 自己的羞耻
  rationale: בֹּשֶׁת 带第三人称阳性复数词尾，直指“他们的羞耻”。中文用反身领属“自己的”更自然，也明确羞耻归于这些控告者。
theological_decisions:
- issue: 咒诅诗语境中未完成式的语气
  choice: 译作祈愿：“愿……愿……”
  alternative: 译作将来陈述：“……必……”
  rationale: 诗篇109篇的上下文是一连串向上帝发出的祈求，因此两处未完成式自然可理解为祈愿或请求。采用“愿”保留诗人的祷告语气，而不把它强化为单纯的未来预言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“披上—裹身—外袍”保留原文连续的衣着意象；“羞辱”与“羞耻”分别对应两个近义而不完全相同的希伯来语名词，避免不必要的重复。
