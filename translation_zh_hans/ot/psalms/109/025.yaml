  text: 我成了他们羞辱的对象；他们看见我，就摇头。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִיתִי חֶרְפָּה לָהֶם
  choice: 我成了他们羞辱的对象
  rationale: הָיִיתִי 表达“成为/成了”，חֶרְפָּה 指羞辱、讥诮或受辱的对象；这样译既保留原句结构，也符合现代汉语表达。
- source_word: יִרְאוּנִי
  choice: 他们看见我
  rationale: 直接对应第三人称复数动词及第一人称宾语，不额外补入时间或条件关系。
- source_word: יְנִיעוּן רֹאשָׁם
  choice: 就摇头
  rationale: 该短语直指摇动自己的头；中文“摇头”自然传达公开轻蔑或嘲弄的动作，同时不把隐含态度写死。
