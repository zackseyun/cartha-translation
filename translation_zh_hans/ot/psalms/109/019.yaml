  text: תְּהִי ל֭/וֹ כְּ/בֶ֣גֶד יַעְטֶ֑ה וּ֝/לְ/מֵ֗זַח תָּמִ֥יד יַחְגְּרֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/019.yaml
  text: May it be like a garment that he wraps around himself[a], and like a belt that he always girds on.
translation:
  language: zh_hans
  text: 愿这咒诅对他如同他披在身上的衣服，又如他常常束在腰间的腰带。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿它对他如同所穿的衣服，又如他不断束在身上的腰带。”
    reason: 保留 ל֭וֹ 的“对他”关系，以及 עטה、חגר 较直译的另一种表达。
lexical_decisions:
- source_word: תְּהִי
  choice: 愿……如
  rationale: 这是 היה 的第三人称阴性单数祈愿式；结合咒诅语境，用“愿”自然表达祈愿或咒愿的语气，而非单纯预告未来。
- source_word: ל֭וֹ
  choice: 他……身上
  rationale: 介词 ל 加第三人称单数阳性后缀表示这事临到该人；中文将关系自然融入“他披在身上”和“束在腰间”的表述中。
- source_word: כְּבֶגֶד
  choice: 如……衣服
  rationale: בגד 泛指衣物，不限定袍服等具体样式；“衣服”通俗自然，并保留比喻。
- source_word: יַעְטֶה
  choice: 披在身上
  rationale: עטה 可指披上、裹上或以衣物遮身；“披在身上”既保留穿裹意象，也符合现代汉语表达。
- source_word: וּלְמֵזַח
  choice: 如……带子
  rationale: מֵזַח 指束系之物，可译腰带或带子；选“带子”避免把原文未明说的部位过度具体化，后文“腰间”则由 חגר 的束腰动作体现。
- source_word: תָּמִיד
  choice: 时常
  rationale: 表示持续、经常或不断；“时常”在此自然地传达反复或持续束系的状态。
- source_word: יַחְגְּרֶהָ
  choice: 束在腰间
  rationale: חגר 指束腰、系上，阴性宾语后缀回指前面的束带之物；“束在腰间”保留具体动作，比笼统的“穿戴”更贴近原文。
theological_decisions:
- issue: 咒诅语境中的祈愿式语气
  choice: 译作“愿这咒诅……”
  alternative: 译作“这咒诅必……”
  rationale: 希伯来语形式与诗篇109篇的咒愿语境相合，表达所祈求的审判，而非仅作未来预测。补出“这咒诅”承接上一节阴性所指，使中文代词关系清楚，但不增添额外教义解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“愿”保留咒愿语气；用“披在身上”“束在腰间”维持衣服包裹与腰带紧束的并行意象。主文中的“这咒诅”按上文语境明示希伯来语阴性主语的所指。
