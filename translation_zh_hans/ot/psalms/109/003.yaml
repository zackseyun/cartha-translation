  yaml_path: translation/ot/psalms/109/003.yaml
  text: Words of hatred surround me[a], and they fight against me without cause.
translation:
  language: zh_hans
  text: 仇恨的话语包围了我；他们无缘无故地与我交战[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们无缘无故地向我开战。”原文动词带有争战、交锋的意象。
    reason: 说明该动词可译为较强的“开战”，并保留其争战意象。
lexical_decisions:
- source_word: דִבְרֵי שִׂנְאָה
  choice: 仇恨的话语
  rationale: 保留原文“话语”的复数概念及其与“仇恨”的组合，表达充满敌意、出于仇恨的言语。
- source_word: סְבָבוּנִי
  choice: 包围了我
  rationale: 动词意为“环绕、包围”；采用完成体“了”体现希伯来语完成式，同时保留诗中敌意言语从四面压迫诗人的形象。
- source_word: וַיִּלָּחֲמוּנִי
  choice: 与我交战
  rationale: לחם 的尼法勒词干具有“争战、交战”的含义；“与我交战”保留其较强的战斗意象，又可用于比喻性的敌对行动。
- source_word: חִנָּם
  choice: 无缘无故地
  rationale: 该副词表示没有正当理由或无端而为；“无缘无故地”是自然、清楚的现代汉语表达，也传达行为的不公正。
