id: PSA.109.9
reference: Psalms 109:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִֽהְיוּ בָנָ֥י/ו יְתוֹמִ֑ים וְ֝/אִשְׁתּ/וֹ אַלְמָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/009.yaml
  text: May his sons be fatherless[a], and his wife a widow.
translation:
  language: zh_hans
  text: 愿他的儿子失去父亲[a]，他的妻子成为寡妇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成为孤儿”。希伯来语可指失去父亲的孩子；这里与“他的妻子成为寡妇”相对应，所以正文译作“失去父亲”。
    reason: 词义有可保留的替代译法；注释说明上下文为何支持正文措辞。
lexical_decisions:
- source_word: יִהְיוּ
  choice: 愿……
  rationale: 该形式在本诗的咒诅祈愿语境中具有祈愿意味；用“愿”自然保留愿望或祷告的语气，而不译成单纯的将来陈述。
- source_word: בָנָיו
  choice: 他的儿子
  rationale: בֵּן 的阳性复数附加第三人称阳性单数词尾，具体指“他的儿子”，不泛化为“儿女”或“孩子”。
- source_word: יְתוֹמִים
  choice: 失去父亲
  rationale: 该词可指孤儿或丧父者；这里与“他的妻子成为寡妇”平行，重点是丈夫兼父亲的丧失。“失去父亲”在现代汉语中准确且自然。
- source_word: וְאִשְׁתּוֹ
  choice: 他的妻子
  rationale: אִשָּׁה 在带所属词尾的此处明确表示“妻子”；连接词在汉语并列结构中可不另译，以保持自然。
- source_word: אַלְמָנָה
  choice: 成为寡妇
  rationale: 该名词意为“寡妇”。汉语需配合 יִהְיוּ 的共同支配补出“成为”，形成自然的谓语结构。
theological_decisions:
- issue: 本节的咒诅祈愿语气
  choice: 译作祈愿：“愿他的儿子失去父亲，他的妻子成为寡妇。”
  alternative: 预言式将来：“他的儿子必失去父亲，他的妻子必成为寡妇。”
  rationale: 动词形式及诗篇109篇的文学语境更支持祈愿或咒诅语气，而非单纯预告未来；译文不淡化其尖锐张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“失去父亲”比书面色彩较重的“无父”自然，也比“成为孤儿”更明确呈现本节与“寡妇”的平行关系。
