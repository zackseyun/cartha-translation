  text: זֹ֤את פְּעֻלַּ֣ת שֹׂ֭טְנַ/י מֵ/אֵ֣ת יְהוָ֑ה וְ/הַ/דֹּבְרִ֥ים רָ֝֗ע עַל נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/020.yaml
  text: This is the reward of my accusers from Yahweh[b][a], and of those who speak evil against my life.
translation:
  language: zh_hans
  text: 这就是控告我的人从雅威所得的报应[a]，也是那些说恶言攻击我的人所得的报应[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报应”所译的希伯来词也可指“作为、行为”或“所做之事”；“控告我的人”也可译作“敌对我的人”。
    reason: lexical_alternative
  - marker: b
    text: “我”原文直译为“我的魂”；此词在这里也可指“我自己”或“我的生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: 这就是
  rationale: 阴性单数指示词用于无明示系词的名词句；按现代汉语自然补出“就是”，将上文所述指认为下文的“报应”。
- source_word: פְּעֻלַּת
  choice: 报应
  rationale: 该词本义可指“作为、行为、工作”，在本节语境中指雅威使敌对者所得的回报；“报应”保留负面语境及按其所行而得结果的意味。
- source_word: שֹׂטְנַי
  choice: 控告我的人
  rationale: שׂטן可指敌对或控告；本诗反复强调恶言和指控，因此译作“控告我的人”，同时在脚注保留较宽泛的“敌对我的人”。
- source_word: מֵאֵת יְהוָה
  choice: 从雅威所得
  rationale: מֵאֵת表示来源或施事者；“从雅威所得”以自然汉语表达报应来自雅威。神名四字母词按专名音译为“雅威”。
- source_word: וְהַדֹּבְרִים רָע
  choice: 也是那些说恶言……之人
  rationale: 保留连接词 וְ，并将 רָע 与“说”结合译为“说恶言”，既保留其道德分量，也符合汉语表达。此并列成分可能进一步描述前述控告者，也可能指并列的一群人；译文不强行判定。
- source_word: עַל נַפְשִׁי
  choice: 攻击我性命
  rationale: עַל在此表达敌对方向；נֶפֶשׁ可指魂、自身或性命。结合敌意与咒诅语境，“性命”自然且保留生命受威胁的具体意味。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名四字母词；音译“雅威”保留其专名性质，不以称号代替。
- issue: 本句是宣告还是祈愿
  choice: 按无系词名词句译为宣告：“这就是……”
  alternative: 愿这成为……的报应
  rationale: 希伯来文本没有明示祈愿形式；虽然上文的咒诅语境容许祈愿色彩，本节句法更直接支持总结性的指认或宣告，因此不在正文中补入“愿”。
- issue: 后半句所指群体与前半句的关系
  choice: 用“也是”保持并列而不明确合并
  alternative: 将“那些说恶言的人”解释为“控告我的人”的同位说明
  rationale: וְ可连接另一组人，也可进一步说明同一群人。译文保持这种可能性，不将二者强制等同或分开。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这就是……所得的报应”呈现本节对上文的总结作用；两个“所得的报应”虽有重复，但使并列关系清楚，并避免误把后半句仅当作无争议的同位说明。所有脚注标记均置于相应词语之后。
