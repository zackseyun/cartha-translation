source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר לֹ֥א זָכַר֮ עֲשׂ֪וֹת חָ֥סֶד וַ/יִּרְדֹּ֡ף אִישׁ עָנִ֣י וְ֭/אֶבְיוֹן וְ/נִכְאֵ֨ה לֵבָ֬ב לְ/מוֹתֵֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/016.yaml
  text: because he did not remember to show kindness[a], but pursued the poor and needy man, and the brokenhearted[b], to put them to death.
translation:
  language: zh_hans
  text: 因为他不记得要施慈爱[a]，反倒追逼贫穷困苦的人和心灵破碎的人[b]，要置他们于死地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“施怜悯”。希伯来语“慈爱”也可含忠贞之爱或守约信实之意；这里侧重向弱小者实际施行的恩慈。
    reason: lexical_alternative
  - marker: b
    text: 直译“贫穷困苦的人，以及心里破碎的人”。原文用单数，可能具有代表性，描述他所追逼的是哪一类人。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 这一复合表达引出上下文中受审判的原因；“因为”自然、清楚地保留因果关系。
- source_word: לֹא זָכַר עֲשׂוֹת חָסֶד
  choice: 不记得要施慈爱
  rationale: זָכַר 加不定式表示没有将某事放在心上并付诸行动。חָסֶד 可指慈爱、怜悯、忠贞之爱或盟约忠诚；本节着重对弱者应有的实际善待，译作“施慈爱”既保留词义厚度，也符合现代汉语。
- source_word: וַיִּרְדֹּף
  choice: 反倒追逼
  rationale: 动词本义为追赶、追逐；在此指敌意逼迫。“反倒”体现他不但未施慈爱，反而加害弱者的对比，但不改变叙述的连续性。
- source_word: אִישׁ עָנִי וְאֶבְיוֹן
  choice: 贫穷困苦的人
  rationale: עָנִי 与 אֶבְיוֹן 并列表达贫困、受压和缺乏帮助的处境。原文用单数 אִישׁ，具有代表性；汉语“……的人”可自然涵盖这一用法。
- source_word: וְנִכְאֵה לֵבָב
  choice: 和心灵破碎的人
  rationale: נִכְאֵה 表示被击打、压碎，לֵבָב 指内心；“心灵破碎”保留原文强烈的内在创伤意象。
- source_word: לְמוֹתֵת
  choice: 要置他们于死地
  rationale: 该不定式说明追逼的目的或结果，含使人死亡之意；“置他们于死地”准确传达致命意图。
theological_decisions: []
