  text: Like a shadow when it lengthens[a], I am gone[c][b]; I am shaken off like a locust.
translation:
  language: zh_hans
  text: 我如同渐渐拉长的影子[a]，消逝而去[b]；我像蝗虫[c]一样被抖落。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“渐渐倾斜的”或“转斜时”；希伯来语动词可指影子伸展、倾斜或向晚转移。
    reason: lexical_alternative
  - marker: b
    text: 或译“我逝去”或“我离去”；希伯来语原用“去、行走”这一动词，在此表达消失。
    reason: lexical_alternative
  - marker: c
    text: “蝗虫”是这个希伯来词通常的意思；也有译本译作“蚱蜢”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצֵל
  choice: 像……影子
  rationale: 前缀 כ 表示比较，צֵל 意为“影子”；用“像……影子”自然保留明喻。
- source_word: כִּנְטוֹתוֹ
  choice: 渐渐拉长的
  rationale: נטה 可表示伸展、倾斜或转向；用于影子时，描绘影子向晚伸长的景象，同时不将其词义过度限定为单纯的“衰退”。
- source_word: נֶהֱלָכְתִּי
  choice: 逐渐消逝
  rationale: 这是 הלך 的尼法勒形态，字面涉及“去、离去”，在渐长的影子这一诗歌意象中表达逝去或消失；“逐渐消逝”在现代汉语中自然传达其语境意义。
- source_word: נִנְעַרְתִּי
  choice: 被抖落
  rationale: נער 的尼法勒形态表示被抖掉或抖出；“被抖落”保留被动语态及轻易遭除去的意象。
- source_word: כָּאַרְבֶּה
  choice: 像蝗虫一样
  rationale: אַרְבֶּה 通常指“蝗虫”；该译法保留原文常见的圣经意象。
