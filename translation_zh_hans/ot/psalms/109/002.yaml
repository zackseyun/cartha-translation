  text: For the mouth of the wicked and the mouth of deceit have opened against me[b][a]; they have spoken to me with a lying tongue.
translation:
  language: zh_hans
  text: 因为恶人的口和诡诈的口都向我张开；他们以虚谎的舌头向我说话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向我说话”或译“同我说话”。原文介词可表示“与、同”；但在此敌对语境中，很可能指敌对的话直接向诗人而发。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明诗人求告的原因，保留因果关系。
- source_word: פִי רָשָׁע
  choice: 恶人的口
  rationale: 按原文保留“口”的具体意象；רָשָׁע在此作名词用，可指恶人。
- source_word: וּפִי מִרְמָה
  choice: 和诡诈的口
  rationale: 保留原文重复“口”所形成的平行与强调；מִרְמָה可指欺骗、诡诈。
- source_word: עָלַי פָּתָחוּ
  choice: 向我张开
  rationale: 保留“张开口”的希伯来语意象；עָלַי在敌对言语的语境中表示矛头指向诗人。
- source_word: דִּבְּרוּ אִתִּי
  choice: 对我说话
  rationale: אִתִּי字面可作“与我”，但此处语境更自然地表示言语是向诗人说的；以脚注保留另一可能。
- source_word: לְשׁוֹן שָׁקֶר
  choice: 用说谎的舌头
  rationale: 保留原文“舌头”的具体表达；שָׁקֶר表示虚假、谎言。
