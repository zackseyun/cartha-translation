  text: א֘וֹדֶ֤ה יְהוָ֣ה מְאֹ֣ד בְּ/פִ֑/י וּ/בְ/ת֖וֹךְ רַבִּ֣ים אֲהַֽלְלֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/030.yaml
  text: I will give great thanks to Yahweh with my mouth[b][a]; in the midst of many I will praise him.
translation:
  language: zh_hans
  text: 我要用口大大感谢雅威[a]；我要在众人中[b]赞美他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大大感谢”也可译作“非常感谢”或“大大称谢”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在许多人中间”，意指在众人面前公开赞美。
    reason: cultural_note
lexical_decisions:
- source_word: א֘וֹדֶ֤ה
  choice: 感谢
  rationale: ידה 的使役词干在诗篇敬拜语境中通常表示“感谢、称谢”；这里与下半句“赞美”平行，“感谢”自然且准确。
- source_word: יְהוָ֣ה
  choice: 雅威
  rationale: 按希伯来文本保留上帝的专名，以现代汉语常见音译“雅威”表达，而不以称号替代。
- source_word: מְאֹ֣ד
  choice: 大大
  rationale: 该词加强“感谢”的程度；“大大感谢”既保留副词功能，也符合现代汉语诗体表达。
- source_word: בְּ/פִ֑/י
  choice: 用口
  rationale: 介词 ב 在这里表示凭借的器官或方式；“用口”保留原文具体的身体意象。
- source_word: וּ/בְ/ת֖וֹךְ רַבִּ֣ים
  choice: 在众人中
  rationale: 直译为“在许多人中间”；“在众人中”自然地保留空间与群体含义，不额外加入原文未明说的“会众”。
- source_word: אֲהַֽלְלֶֽ/נּוּ
  choice: 赞美他
  rationale: הלל 的加强词干在此意为“赞美”，第三人称阳性单数后缀回指雅威。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质；“耶和华”是另一传统音译，“上主”则是尊称替代。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；上下两句保留“感谢—赞美”的诗歌平行结构，并保留“用口”的具体意象。
