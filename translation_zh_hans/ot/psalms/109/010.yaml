  text: May his children wander about and beg[a]; may they seek from their ruins.
translation:
  language: zh_hans
  text: 愿他的儿女四处漂泊，乞讨；愿他们从他们的废墟中寻求[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他们离开他们的废墟而寻求。”这里的介词也可表示离开或分离，而非来源。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַ יָנוּעוּ
  choice: 愿……四处漂泊
  rationale: 不定式绝对式与未完成式连用，强化“摇动、漂泊”的动作；在咒诅祈愿语境中，用“愿”表达祈愿色彩，“四处漂泊”自然保留反复流离之意。
- source_word: בָנָיו
  choice: 他的儿女
  rationale: בנים可专指儿子，也可泛指子女；此处采用现代汉语较自然且不无故限缩性别的“儿女”。
- source_word: וְשִׁאֵלוּ
  choice: 沿街乞讨
  rationale: שאל基本义为“求、问”，在漂泊和荒废的语境中指乞求施舍；“乞讨”准确传达语境含义，“沿街”使汉语搭配自然，并与“四处漂泊”相应。
- source_word: וְדָרְשׁוּ
  choice: 愿他们……寻求
  rationale: דרש意为“寻求、搜寻”；原文没有明说所寻求的对象，因此不补入“食物”，保留原文的省略和开放性。
- source_word: מֵחָרְבוֹתֵיהֶם
  choice: 从自己的废墟中
  rationale: חרבות指废墟或荒废之地；מן可表示来源，也可表示分离。正文按来源义直译，另以脚注保留分离义的可能。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“寻求”刻意不补宾语，以保存希伯来原文的省略；分号呈现两个并列的祈愿分句。
