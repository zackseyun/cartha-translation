base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/017.yaml
  text: He loved cursing[a], and it came upon him; he did not delight in blessing[b], and it was far from him.
translation:
  language: zh_hans
  text: 他喜爱咒诅[a]，咒诅就临到他；他不以祝福[b]为乐，祝福就远离他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他喜爱一个诅咒。”希伯来语名词既可泛指咒诅，也可指一个具体的诅咒。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他不喜爱祝福。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: 他喜爱
  rationale: אהב在此直接表达喜爱或意愿；“喜爱”既自然，也与下半句的“不喜爱”形成鲜明对照。
- source_word: קְלָלָה
  choice: 咒诅
  rationale: 该名词既可指咒诅这一行为或范畴，也可指一次具体的诅咒；正文采用不定量的“咒诅”，保留类别意义，并以脚注说明另一种理解。
- source_word: וַתְּבוֹאֵהוּ
  choice: 咒诅就临到他
  rationale: בוא带第三人称阳性单数宾语后缀，阴性主语回指“咒诅”；中文补出主语可避免“它”的指代含混，“临到”也贴合不利后果降临的语境。
- source_word: וְלֹא חָפֵץ
  choice: 他不喜爱
  rationale: חפץ可表示喜悦、乐意或以某事为乐；“不喜爱”简洁自然，并保留与前句“喜爱”的诗体对照。
- source_word: בִּבְרָכָה
  choice: 祝福
  rationale: 与“咒诅”构成反义平行；采用范畴性的“祝福”，不强行限定为某一次具体的福分。
- source_word: וַתִּרְחַק מִמֶּנּוּ
  choice: 祝福就远离他
  rationale: רחק表示变得遥远或处于远处。中文“远离他”自然表达祝福与他隔绝的结果，又不额外加入持续时长。
