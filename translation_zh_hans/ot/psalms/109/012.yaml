source:
  edition: WLC
  text: אַל יְהִי ל֭/וֹ מֹשֵׁ֣ךְ חָ֑סֶד וְֽ/אַל יְהִ֥י ח֝וֹנֵ֗ן לִ/יתוֹמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/012.yaml
  text: Let there be no one to extend kindness to him[b][a], and let there be no one to show favor to his fatherless children.
translation:
  language: zh_hans
  text: 愿没有人继续向他施恩[a]；愿没有人恩待他丧父的儿女[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “继续向他施恩”直译为“向他拉长（或拉出）慈爱”，也可译作“延续对他的恩惠”。
    reason: lexical_alternative
  - marker: b
    text: “丧父的儿女”也可译作“他的孤儿”；希伯来语此词常特指失去父亲的孩子。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁךְ
  choice: 延续
  rationale: 该分词本义为“拉、牵引”，与חָסֶד搭配时表示把慈爱持续下去。“延续”既保留这一意象的时间含义，也符合现代汉语表达。
- source_word: חָסֶד
  choice: 慈爱
  rationale: 此处指人向困苦者施予的怜悯、忠厚之爱。“慈爱”保留其仁慈及可能含有的忠诚意味，又不过度限定为盟约术语。
- source_word: חוֹנֵן
  choice: 恩待
  rationale: חנן表示施恩、眷顾或怜悯。“恩待”在现代汉语中自然凝练，适合这里人与人之间的施惠。
- source_word: יְתוֹמָיו
  choice: 他失去父亲的儿女
  rationale: יָתוֹם可泛指孤儿，在希伯来社会语境中常特指丧父的孩子；结合第三人称后缀，这样译清楚表达他们因他之死而失去父亲，同时不把他们误解为父母双亡。
- source_word: אַל יְהִי
  choice: 愿无人
  rationale: 否定祈愿式表达愿望或祈求。“愿无人”简洁地保留咒诅性祈愿的直接力度，而没有改译成单纯的未来陈述。
theological_decisions:
- issue: 是否弱化咒诅性祈求的语气
  choice: 保留直接的祈愿：“愿无人……愿无人……”
  alternative: 译为描述性的未来句，如“必没有人……”
  rationale: 原文两次使用否定祈愿结构，表达愿望或呼求，并非仅仅预告未来；保留其直接力度，同时不额外解释说话者或祈求对象。
- issue: חָסֶד是否限定为盟约之爱
  choice: 译作较宽泛的“慈爱”
  alternative: 译作“守约的慈爱”或仅作“怜悯”
  rationale: 这里的施予者是未明确身份的人，词义可涵盖忠诚、仁慈和怜悯；不在正文中加入“守约”，可避免把可能的盟约色彩定为唯一解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“愿无人”对应诗歌中的否定祈愿式，并用平行句保留原文力度；“失去父亲的儿女”比“他的孤儿”更自然，也显明希伯来词在本语境中的丧父含义。
