  text: הַפְקֵ֣ד עָלָ֣י/ו רָשָׁ֑ע וְ֝/שָׂטָ֗ן יַעֲמֹ֥ד עַל יְמִינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/006.yaml
  text: Appoint a wicked man over him[a], and let an accuser stand at his right hand.
translation:
  language: zh_hans
  text: 委派一个恶人管辖他；让一个控告者[a]站在他右边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “控告者”也可译为“敌手”，或作专名“撒但”。希伯来词可作普通名词，意为控告者或敌对者；在某些语境中也可作专名“撒但”。
    reason: 保留שָׂטָן作为普通名词或专名的语义与解释空间。
lexical_decisions:
- source_word: הַפְקֵד
  choice: 派
  rationale: 该词为פקד的使役命令式，在这里表示派定或安置某人担任管辖者；“派”自然地保留了命令语气，也不额外限定具体职分。
- source_word: עָלָיו
  choice: 管辖他
  rationale: 介词על与פקד连用时，可指被置于某人之上而掌权；在汉语中将这一关系融入“管辖他”，比直译“在他之上”更自然。
- source_word: רָשָׁע
  choice: 一个恶人
  rationale: 此处指邪恶的人；“一个恶人”明确保留其人物指称，语言简洁庄重。
- source_word: שָׂטָן
  choice: 一个控告者
  rationale: 该词在这里可作普通名词，意为控告者或敌手；上下文具有司法色彩，“控告者”与站在右边控诉的场景最吻合，同时以脚注保留其他可能。
- source_word: יַעֲמֹד
  choice: 让……站
  rationale: 未完成式承接前面的命令式，在此具有祈使、愿望意味；“让……站”准确表达这种咒诅式诉求。
- source_word: עַל יְמִינוֹ
  choice: 站在他右边
  rationale: 保留“右边”这一原文方位意象；在司法语境中，它可表示控告者所处的位置，但译文不进一步解释或限定。
theological_decisions:
- issue: שָׂטָן应译作专名“撒但”，还是普通名词
  choice: 普通名词“一个控告者”
  alternative: “一个敌手”或专名“撒但”
  rationale: 希伯来文在此不要求将该词理解为专名；紧邻语境描写一名控告者站在被告右边，普通名词读法更直接。为避免排除传统的专名理解，脚注保留“撒但”这一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“派……管辖”表达任命在某人之上的关系；分号保留两句诗行之间紧密并列的咒诅语气。
