  text: וְֽ֭/יֵדְעוּ כִּי יָ֣דְ/ךָ זֹּ֑את אַתָּ֖ה יְהוָ֣ה עֲשִׂיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/027.yaml
  text: Let them know that this is your hand; you[a], O Yahweh, have done it.
translation:
  language: zh_hans
  text: 愿他们知道[a]：这是出于你的手；雅威啊，是你做了这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让他们知道”或“他们会知道”。原文动词在此处可按语境理解为祈愿语气；其未完成式形式也可作非祈愿性理解。
    reason: 保留 וְיֵדְעוּ 的语气歧义；上下文较倾向祈愿。
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: 愿他们知道
  rationale: 该词是ידע的Qal未完成式第三人称阳性复数，前接连词；在本语境中带祈愿语气。“愿他们知道”自然表达诗人的祈求，同时保留其愿望色彩。
- source_word: כִּי
  choice: （引出“知道”的内容，不另译）
  rationale: 这里引出认知内容。现代汉语可直接说“知道，这是……”，无需硬译为“因为”；逗号标示后接的内容。
- source_word: יָדְךָ
  choice: 你的手
  rationale: 保留希伯来语“手”的原有意象，既可指上帝的行动，也蕴含能力与主导，不将比喻窄化。
- source_word: זֹּאת
  choice: 这
  rationale: 阴性单数指示词指向前文所述的介入或作为；译作“这”保留指代的开放性，并由下句“做了这事”予以说明。
- source_word: אַתָּה
  choice: 是你
  rationale: 独立人称代词置于神名之前带强调作用；汉语用“是你”突出行动者。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神圣专名“耶和华”，不以称号“主”替代四字神名。
- source_word: עֲשִׂיתָהּ
  choice: 做了这事
  rationale: עשה意为“做、行”；所带阴性单数宾语后缀回指前面的זֹּאת。汉语以“这事”明确自然地表达该回指，同时不限定具体作为。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文保留专名而不代以“主”；采用普通中文读者最熟悉、且庄重自然的“耶和华”。
- issue: “手”的神学意象
  choice: 保留“你的手”
  alternative: 你的能力／你的作为
  rationale: 直译保留神亲自施行、掌权和显能的多重意涵，不将原文的比喻单一化。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈祷语体。“愿他们知道”表达祈愿；分号后的“是你”保留原文独立代词的强调。脚注标记置于整节末尾，对应动词语气的译法。
