  text: אֶשְׁתַּחֲוֶ֨ה אֶל הֵיכַ֪ל קָדְשְׁ/ךָ֡ וְ/א֘וֹדֶ֤ה אֶת שְׁמֶ֗/ךָ עַל חַסְדְּ/ךָ֥ וְ/עַל אֲמִתֶּ֑/ךָ כִּֽי הִגְדַּ֥לְתָּ עַל כָּל שִׁ֝מְ/ךָ֗ אִמְרָתֶֽ/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/002.yaml
  text: I bow down toward your holy temple and give thanks to your name for your steadfast love and your faithfulness[a], for you have exalted your word above all your name.
translation:
  language: zh_hans
  text: 我要向你的圣殿下拜，因你的慈爱和信实称谢你的名；因为你使你的话超越你一切的名[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你使你的应许超越一切。”本句希伯来文含义较难确定；也有人理解为：“你使你的名和你的话超越万有。”
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשְׁתַּחֲוֶה
  choice: 下拜
  rationale: 该动词在敬拜语境中常指俯身或伏地的具体动作。“下拜”既保留身体动作，也符合现代中文的庄重表达。
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: 向你的圣殿
  rationale: אֶל 表示朝向；הֵיכָל 在本诗敬拜语境中宜译为“圣殿”。此译法不暗示诗人已经进入殿内。
- source_word: וְאוֹדֶה אֶת שְׁמֶךָ
  choice: 称谢你的名
  rationale: ידה 的使役词干可表示感谢或赞美；后面的 עַל 短语说明称谢的缘由。“称谢”兼具感谢与颂赞意味，并保留“你的名”这一希伯来表达。
- source_word: עַל חַסְדְּךָ
  choice: 因你的慈爱
  rationale: חסד 包含坚定、忠贞和守约的爱。“慈爱”是中文圣经语体中自然而凝练的对应词；在此搭配中能表达上帝恒久恩爱的含义。
- source_word: וְעַל אֲמִתֶּךָ
  choice: 和信实
  rationale: אמת 可指真实、可靠或信实；与 חסד 并列时，“信实”最能体现上帝可信赖的品格。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出称谢的理由，译作“因为”清楚自然。
- source_word: הִגְדַּלְתָּ
  choice: 你使……超越
  rationale: גדל 的使役词干意为使之为大、使之崇高。结合介词 עַל，“使……超越”较贴近句法关系，同时保留尊崇、抬高的意味。
- source_word: עַל כָּל שִׁמְךָ
  choice: 超越你一切的名
  rationale: 马所拉文本的结构艰涩。正文依照词序和表面句法直译，不以较顺畅的解释性译法取代原文张力。
- source_word: אִמְרָתֶךָ
  choice: 你的话
  rationale: אִמְרָה 可指话语、言说或应许。“你的话”涵盖面较广，也让上下文中的应许意味保持开放。
theological_decisions:
- issue: 难句 כִּי הִגְדַּלְתָּ עַל כָּל שִׁמְךָ אִמְרָתֶךָ 的解释
  choice: 因为你使你的话超越你一切的名
  alternative: 或译：“因为你使你的应许超越一切”；也有人理解为：“你使你的名和你的话超越万有。”
  rationale: 马所拉文本的句法困难，翻译传统中有多种理解。正文尽量保留原文次序及“话”与“名”之间不易化解的关系，不将它解释成上帝的话贬低其名；其他较顺畅但解释性更强的读法列入脚注。
translation_notes:
  register: 采用现代、庄重且适合诵读的普通话。“下拜”“称谢”“慈爱”“信实”保留诗歌敬拜语域，又避免过度古雅。正文保留末句的希伯来文歧义，并以脚注列出主要替代读法。
