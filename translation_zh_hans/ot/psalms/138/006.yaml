  text: כִּי רָ֣ם יְ֭הוָה וְ/שָׁפָ֣ל יִרְאֶ֑ה וְ֝/גָבֹ֗הַּ מִ/מֶּרְחָ֥ק יְיֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/006.yaml
  text: For Yahweh is high[a], yet he sees the lowly[c][b]; but the haughty he knows from afar.
translation:
  language: zh_hans
  text: 因为雅威崇高，却看见卑微的人[a]；高傲的人，他远远地知道[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“留意”或“看顾”。原文直译为“看见”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他从远处知道。”也可译作“他从远处认得”。这可能暗示关系上的距离，但原文没有明说他把高傲的人拒于远处。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人称颂雅威的理由；“因为”保留希伯来语的解释或因果作用。
- source_word: רָם
  choice: 崇高
  rationale: 此处作谓语描述雅威地位尊高。“崇高”保留垂直空间意象，也符合现代汉语的庄重诗体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现以色列上帝的专名，不以称号替代。
- source_word: שָׁפָל
  choice: 卑微的人
  rationale: 该词可指地位低微或心性谦卑的人；“卑微的人”兼顾社会处境与姿态，不收窄为单纯的道德谦逊。
- source_word: יִרְאֶה
  choice: 看顾
  rationale: 字面义为“看见”，语境中含留意、眷顾之意；“看顾”使现代汉语自然，并以脚注保留字面译法。
- source_word: גָבֹהַּ
  choice: 高傲的人
  rationale: 字面为“高的”，与“卑微的人”相对时带有骄傲自高的贬义；“高傲的人”清楚表达该语境义。
- source_word: מִמֶּרְחָק
  choice: 从远处
  rationale: 直接保留空间距离的比喻，不把它解释性扩展为拒绝或排斥。
- source_word: יְיֵדָע
  choice: 认得
  rationale: 保留 ידע“知道、认识”的核心意义；“认得”与“从远处”搭配自然，同时没有明确断言亲密、悦纳或审判。
theological_decisions:
- issue: 雅威与高傲之人的关系距离
  choice: 译作“他从远处就认得”
  alternative: 他使高傲的人远离／他从远处察看高傲的人
  rationale: 原文只说雅威“从远处知道／认识”高傲的人。距离可能暗示关系上的疏远，却没有明说拒绝、定罪或驱逐，因此正文保留这种张力。
- issue: 雅威崇高却关注卑微者的反差
  choice: 以“却”表达让步反差
  alternative: 雅威崇高，并看见卑微的人
  rationale: 希伯来语连接词本身可作简单连接，但上下文形成显著反差：雅威虽居高位，仍关注卑微者。“却”自然呈现这一语用关系，而不改变命题内容。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。分号凸显雅威对卑微者与高傲者的不同关系；避免使用生硬古语，也不把“从远处知道”过度解释为明确的拒绝或审判。
