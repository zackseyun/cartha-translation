  text: וְ֭/יָשִׁירוּ בְּ/דַרְכֵ֣י יְהוָ֑ה כִּ֥י גָ֝ד֗וֹל כְּב֣וֹד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/005.yaml
  text: and they will sing of the ways of Yahweh[a], for great is the glory of Yahweh.
translation:
  language: zh_hans
  text: 他们要歌颂雅威的道路[a]，因为雅威的荣耀伟大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译作“在雅威的道路中／上”。这里的短语很可能指歌唱雅威的道路，即他的作为或行事方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׁירוּ
  choice: 他们要歌颂
  rationale: 这是שׁיר的Qal未完成式第三人称阳性复数；承接上一节列王赞美雅威的语境，以将来意义“要歌颂”最为顺畅，不强行赋予祈使语气。
- source_word: בְּדַרְכֵי
  choice: 行事之道
  rationale: דֶּרֶךְ复数指道路、方式或行事作为；与“歌唱”连用时，介词בְּ可能表示“在……中”，也很可能标示歌唱的内容。正文采用自然的“歌颂……的行事之道”，并以脚注保留较为字面的读法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留四字神名，而不以“主”这一称号代替；“雅威”对应YHWH的常见学术重构读音。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出歌颂的理由，因果意义清楚；“因为”比“诚然”更准确地表达这一关系。
- source_word: גָדוֹל
  choice: 何等伟大
  rationale: גָדוֹל基本义为“伟大”。希伯来语将形容词置前以突出强调，汉语用“何等伟大”自然再现诗歌性的强调，而不改变基本意义。
- source_word: כְּבוֹד
  choice: 荣耀
  rationale: כָּבוֹד用于雅威时表示其彰显的尊荣与威荣；“荣耀”既符合现代汉语圣经语域，也比单纯的“尊荣”更能涵盖其神学意蕴。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用“雅威”以保留专名性质；“耶和华”源于另一种传统音译，“上主”则以称号代替专名。
- issue: בְּדַרְכֵי所表达的关系
  choice: 把雅威的行事之道理解为歌颂的内容
  alternative: 在雅威的道路上歌唱
  rationale: 介词בְּ容许较为字面的“在……中／上”，但在שׁיר之后也可引出歌唱所关乎的内容。正文采用符合汉语习惯且契合上下文的内容义，同时借脚注保留原文结构与另一种可能。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“歌颂”符合以神及其作为为对象的诗歌语境；“行事之道”避免把דֶּרֶךְ误解为单纯的实体道路。“何等伟大”再现原文形容词前置所形成的强调。
