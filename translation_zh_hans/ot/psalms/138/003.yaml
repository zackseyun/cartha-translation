  yaml_path: translation/ot/psalms/138/003.yaml
  text: On the day I called[a], you answered me; you made me bold in my soul with strength.
translation:
  language: zh_hans
  text: 我呼求的那天，你回答了我；你以力量使我心里壮胆。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你以力量使我心里壮胆”也可译作“你以力量使我内心宽广”，或较意译为“你使我内心刚强”。原文动词含义较难确定，可能有使人壮胆、宽广或刚强之意；“力量”与前面短语的关系也不完全明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם
  choice: ……的那天
  rationale: 保留“日子”的具体时间表达，同时在现代汉语中自然地引出后续事件。
- source_word: קָרָאתִי
  choice: 我呼求
  rationale: 在祷告语境中，“呼求”准确表达向上帝呼叫求助之意，又不额外加入原文未明确表达的强烈情绪。
- source_word: וַתַּעֲנֵנִי
  choice: 你就应允我
  rationale: 明确译出第一人称宾语后缀；“应允”符合祷告语境，也表现呼求与回应之间的关系。
- source_word: תַּרְהִבֵנִי
  choice: 你使我……壮胆
  rationale: 该词的使役形式在此含义困难，可能指使人胆壮、宽广或刚强；“使……壮胆”保留使役意义，并切合内在力量的语境。
- source_word: בְנַפְשִׁי
  choice: 我内心
  rationale: נפש在这里指人的内在自我；“内心”比直译“灵魂里”更符合现代汉语，同时仍清楚表达内在层面。
- source_word: עֹז
  choice: 刚强
  rationale: 表达“力量、刚强”之意，并与“壮胆”共同呈现原文中内在得力的意义；该词与前述难解动词的句法关系存在一定不确定性。
theological_decisions:
- issue: תַּרְהִבֵנִי בְנַפְשִׁי עֹז这一难解短语的诠释
  choice: 译为“你使我内心刚强壮胆”，理解为上帝使诗人里面得着力量和勇气。
  alternative: 也可译为“你使我的心因力量而宽广”，或更概括地译为“你使我内心刚强”。
  rationale: 原文动词可涉及壮胆、使宽广或使刚强，且עֹז与短语其余部分的关系不完全明确。正文采用自然而贴近语境的内在刚强之义，脚注则保留其他真实可能，避免将词义困难静默抹平。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“我呼求的那天”保留原文具体时间表达；“内心刚强壮胆”兼顾原文使役结构、נפש所指的内在自我，以及עֹז的力量含义，并以脚注交代词义歧义。
