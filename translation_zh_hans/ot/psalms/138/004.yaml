source:
  edition: WLC
  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַלְכֵי אָ֑רֶץ כִּ֥י שָׁ֝מְע֗וּ אִמְרֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/004.yaml
  text: All the kings of the earth will give thanks to you[a], O Yahweh, for they have heard the words of your mouth.
translation:
  language: zh_hans
  text: 耶和华[a]啊，地上所有的君王都要称谢你，因为他们听见了你口中的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为四字神名“YHWH”。其古代确切读音并无定论；这里按中文惯例译作“耶和华”。
    reason: 说明神名的原文形式及音译选择，保留读音问题的不确定性。
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: 都要称谢你
  rationale: ידה的使役词干在此表示向某人称谢或赞颂；保留第二人称宾语“你”，并以“称谢”契合本诗的感恩语境。未强行区分预言性将来与诗性期望，“要”保留未完成体所容许的开放性。
- source_word: יְהוָה
  choice: 耶和华[a]
  rationale: 这是四字神名YHWH。中文正文采用现代读者熟悉的专名形式“耶和华”，而不以“主”这一称号取代；脚注交代原文形式。
- source_word: כָּל מַלְכֵי אָרֶץ
  choice: 地上所有的君王
  rationale: 按原文保留“君王”这一具体统治者称谓；“地上所有的”自然表达其整体范围。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出君王称谢的原因；“因为”在现代汉语中清楚自然。
- source_word: שָׁמְעוּ
  choice: 他们听见了
  rationale: 完成式表达已经发生的听见，构成随后称谢的依据；“听见了”保留完成意义而不作额外阐释。
- source_word: אִמְרֵי פִיךָ
  choice: 你口中的话
  rationale: 保留希伯来文“口”与“话”的具体意象，同时符合自然、庄重的现代汉语。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名。采用中文传统中广为人知的音译“耶和华”，既将其作为专名呈现，也避免以称号“主”取代；脚注注明其希伯来文形式，不把有争议的古代读音说成确定无疑。
- issue: 君王称谢的时态与语气
  choice: 都要称谢你
  alternative: 都称谢你；愿都称谢你
  rationale: יוֹדוּךָ为未完成式，可表达将来、预期或诗性的展望。“都要”在中文中保留这种前瞻性，又不把它明确改写为命令或愿望。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“称谢”具有诗篇所需的礼仪与感恩色彩；句法基本对应原文的两分结构，以“因为”清楚连接原因。
