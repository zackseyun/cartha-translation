  text: יְהוָה֮ יִגְמֹ֪ר בַּ֫עֲדִ֥/י יְ֭הוָה חַסְדְּ/ךָ֣ לְ/עוֹלָ֑ם מַעֲשֵׂ֖י יָדֶ֣י/ךָ אַל תֶּֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/008.yaml
  text: Yahweh will fulfill his purpose for me[a]; O Yahweh, your steadfast love endures forever[b]. Do not forsake the work of your hands.
translation:
  language: zh_hans
  text: '雅威必成全关乎我的事[a]；


    雅威啊，你的慈爱永远长存。


    求你不要撇下你手所做的工[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威必完成与我有关的事。”
    reason: בַּעֲדִי可表示“为我”或“关乎我”；原文没有明说所完成的具体对象。
  - marker: b
    text: 或译：“求你不要放下你手所做的工。”
    reason: רפה可表示松手、放下、停止或离弃；מַעֲשֵׂי为复数，汉语可用集合性的“工”表达。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: יִגְמֹר בַּעֲדִי
  choice: 必成全关乎我的事
  rationale: גמר表示完成、使之达到终点；בעדי可指“为我、关乎我”。此译法不补入原文未明说的“旨意”，并保留行动对象的开放性。
- source_word: חַסְדְּךָ
  choice: 你忠贞的爱
  rationale: חסד在此表达持久、可靠而忠诚的爱；“忠贞的爱”兼顾关系忠诚与慈爱之意，避免把词义限缩为单纯怜悯。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文为“到永远”，与前面的חסד构成无显式系词的名词句；汉语补出“长存”，自然表达其恒久性。
- source_word: מַעֲשֵׂי יָדֶיךָ
  choice: 你亲手所做的一切
  rationale: מַעֲשֵׂי为复数，直指神手所做的诸般工作；“亲手所做的一切”既保留复数范围，也符合现代汉语习惯。
- source_word: אַל תֶּרֶף
  choice: 求你不要撇下
  rationale: רפה本义包括松手、放下、停止；在向神祈求不要放弃自己所做之事的语境中，“不要撇下”自然且保留关系意味。“求”体现希伯来语否定祈使在祷告中的语气。
theological_decisions:
- issue: יִגְמֹר בַּעֲדִי所指的完成行动
  choice: 译作“成全关乎我的事”
  alternative: “为我成就一切”或“实现他对我的旨意”
  rationale: 希伯来文没有明说“旨意”这一宾语；所选译文保留神将与诗人有关之事带到完成的确信，而不把开放表达限定为某种特定旨意观。
- issue: מַעֲשֵׂי יָדֶיךָ的指涉范围
  choice: 译作“你亲手所做的一切”
  alternative: “你手所做的工”
  rationale: 复数表达可能包括神在诗人身上的作为，也可能泛指神的诸般工作。正文不限定其范围，以保留原文的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“成全关乎我的事”略带诗体色彩，但清楚保留原文的含混；分行呈现希伯来诗歌的三个意群。
