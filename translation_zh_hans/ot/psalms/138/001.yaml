  text: לְ/דָוִ֨ד אוֹדְ/ךָ֥ בְ/כָל לִבִּ֑/י נֶ֖גֶד אֱלֹהִ֣ים אֲזַמְּרֶֽ/ךָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/001.yaml
  text: Of David[a]. I will give thanks to you with my whole heart; before the gods I will sing praises to you.
translation:
  language: zh_hans
  text: '大卫的诗。


    我要全心称谢你；

    在众神[a]面前，我要歌颂你。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天上的众灵”或“天使”。希伯来语这个词可按语境指众神、上帝或天上的存在。
    reason: 保留 אֱלֹהִים 在此处所指的原文歧义。
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 介词 לְ 可表示作者、归属或关联；“大卫的诗”符合汉语诗篇标题的惯用表达，同时不明确限定为“大卫所写”或“献给大卫”。
- source_word: אוֹדְךָ
  choice: 我要……称谢你
  rationale: ידה 的 Hiphil 形式在敬拜语境中可指称谢、赞美或宣认；“称谢你”既保留感恩意味，也自然表达第二人称宾语。
- source_word: בְכָל לִבִּי
  choice: 全心
  rationale: 原文直译为“以我的全心”；“全心”简洁自然，表达内心毫无保留、专一投入。
- source_word: נֶגֶד
  choice: 在……面前
  rationale: נֶגֶד 表示位于某者面前或在其临在之中；此译法准确而符合现代汉语。
- source_word: אֱלֹהִים
  choice: 众神
  rationale: 此处形式为复数，可指诸神或天上的存在；“众神”最直接保留复数形式及诗句的修辞张力，其他可能含义列入脚注。
- source_word: אֲזַמְּרֶךָ
  choice: 我要歌颂你
  rationale: זמר 的 Piel 形式指以歌唱或音乐赞美；“歌颂你”兼顾歌唱和敬拜赞美两层含义，并保留第二人称宾语。
theological_decisions:
- issue: אֱלֹהִים 在“在……面前”一语中的所指
  choice: 众神
  alternative: 天上的众灵、天使，或上帝
  rationale: 该词在形态上可为复数，在本诗语境中可能指列国的神明或天上的存在。正文采用直接的复数译法，避免用单数“上帝”过早消除原文的歧义；脚注说明其他可能解释，不额外加入论战性理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“全心称谢”与“歌颂”保留平行节奏；“众神”虽带来神学张力，却忠实呈现希伯来语复数形式，并以脚注说明语义范围。
