  text: לְ/דָוִ֨ד אוֹדְ/ךָ֥ בְ/כָל לִבִּ֑/י נֶ֖גֶד אֱלֹהִ֣ים אֲזַמְּרֶֽ/ךָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/000.yaml
  text: Of David[a]. I will give thanks to you with all my heart; before the gods I will sing praises to you.
translation:
  language: zh_hans
  text: '大卫的诗[a]。


    我要全心称谢你；

    我要在众神[b]面前歌颂你。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫的诗”也可理解为“大卫作的”或“与大卫有关的”；希伯来语题注本身没有明确说明这种归属关系。
    reason: source_ambiguity
  - marker: b
    text: “众神”也可译作“天上众灵”或“天使”。这里的希伯来词可依语境指上帝、众神或天上的存在。
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 希伯来语介词短语直译为“大卫的”；按诗篇题注的自然汉语表达补出“诗”，但不在正文中把作者归属解释得过于绝对。
- source_word: אוֹדְךָ
  choice: 称谢你
  rationale: 保留向上帝表达感谢与赞美的敬拜语义；“称谢”庄重且为现代读者所理解。
- source_word: בְכָל־לִבִּי
  choice: 全心
  rationale: 准确表达“以我的全部内心”，并采用自然简洁的现代汉语。
- source_word: אֱלֹהִים
  choice: 众神
  rationale: 此处无冠词且位于“面前”之后，形式和语境容许复数理解；正文保留其鲜明措辞，并以脚注说明“天上众灵”等可能解释。
- source_word: אֲזַמְּרֶךָּ
  choice: 歌颂你
  rationale: 该动词表示以歌唱或乐声赞美；“歌颂”兼顾动作与赞美对象。
theological_decisions:
- issue: אֱלֹהִים 在本句所指为何
  choice: 正文译作“众神”，不把所指预先限定为天使或其他天上存在
  alternative: 天上众灵；天使；上帝
  rationale: 希伯来词 אֱלֹהִים 可依语境指上帝、众神或天上存在。本句可能描绘诗人在天上众灵面前赞美上帝，也可能以“众神”为修辞对照；正文与脚注共同保留这种张力。
- issue: לְדָוִד 的归属关系
  choice: 译作“大卫的诗”，并用脚注保留介词关系的宽度
  alternative: 大卫作的；献给大卫的
  rationale: לְ 可标示作者、归属或关联；传统题注译法自然，但不应断言其只能表示作者身份。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语；诗行简洁并保留希伯来原文的平行结构。“称谢”与“歌颂”体现敬拜语域，同时避免古奥表达。
