  text: אִם אֵלֵ֤ךְ בְּ/קֶ֥רֶב צָרָ֗ה תְּחַ֫יֵּ֥/נִי עַ֤ל אַ֣ף אֹ֭יְבַ/י תִּשְׁלַ֣ח יָדֶ֑/ךָ וְ/ת֖וֹשִׁיעֵ֣/נִי יְמִינֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/007.yaml
  text: If I walk in the midst of trouble[a], you preserve my life; you stretch out your hand against the anger of my enemies[c][b], and your right hand saves me.
translation:
  language: zh_hans
  text: 我若行在患难之中[a]，你使我存活[b]；你伸出你的手，抵挡我仇敌的怒气[c]，你的右手拯救我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“即使我行在患难之中。”希伯来语 אִם 在这里既可表示条件，也可带有让步意味。
    reason: lexical_alternative
  - marker: b
    text: “使我存活”也可译为“使我复苏”或“保全我的性命”。原文动词可指使人活过来、恢复生机，或使人继续存活。
    reason: lexical_alternative
  - marker: c
    text: “怒气”所译的希伯来词本义为“鼻子”，常用作表示愤怒的惯用语；原文直译近于“抵挡我仇敌的怒气”。
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: “若”直接表达条件意味，同时在诗歌语境中可容纳近于“即使”的让步意味；另一可能在脚注中保留。
- source_word: אֵלֵךְ בְּקֶרֶב צָרָה
  choice: 行在患难之中
  rationale: 保留“行走”及“在……之中”的空间意象；“患难”自然、庄重，也能涵盖困苦与危急。
- source_word: תְּחַיֵּנִי
  choice: 使我存活
  rationale: 贴近使役形式及“生命”的词义，既可指在威胁中保全性命，也保留“使我复苏”的可能。
- source_word: עַל אַף אֹיְבַי
  choice: 抵挡我仇敌的怒气
  rationale: אַף本义为“鼻子”，在此是表示怒气的希伯来语惯用法；保留神所抵挡的是仇敌之怒，而不简化为仅仅抵挡仇敌。
- source_word: תִּשְׁלַח יָדֶךָ
  choice: 你伸手
  rationale: 自然表达神主动介入的拟人意象，也比机械的“发出你的手”更符合现代汉语。
- source_word: וְתוֹשִׁיעֵנִי
  choice: 拯救我
  rationale: 准确表达ישע使役式的拯救、解救含义，不限定具体的施救方式。
- source_word: יְמִינֶךָ
  choice: 你的右手
  rationale: 保留希伯来诗歌中象征力量和施行拯救的具体形象。
theological_decisions:
- issue: תְּחַיֵּנִי所指的神圣行动
  choice: 译为“使我存活”，在当前危难中首先表达保全生命
  alternative: 使我复苏／使我重新得力
  rationale: 上下文涉及患难、仇敌与拯救，因此保全生命是直接语境中的重点；但采用较贴近原文的措辞，不排除恢复生命力量的含义。
- issue: עַל אַף אֹיְבַי中神所针对的对象
  choice: 神伸手抵挡仇敌的怒气
  alternative: 神伸手攻击仇敌本身
  rationale: 原文明确保留אַף“怒气”的惯用意义；如此翻译既不淡化敌意，也不把神行动的对象扩大为原文未明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。句式保留原文从患难、神的介入到右手施救的推进；用“若”及脚注保存条件与让步两种可能，不擅自消除原文张力。
