  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַשְׁלֵ֤ךְ עַל יְהוָ֨ה יְהָבְ/ךָ֮ וְ/ה֪וּא יְכַ֫לְכְּלֶ֥/ךָ לֹא יִתֵּ֖ן לְ/עוֹלָ֥ם מ֗וֹט לַ/צַּדִּֽיק־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/022.yaml
  text: Cast your burden on Yahweh[a], and he will sustain you[b]; he will never allow the righteous to be shaken.
translation:
  language: zh_hans
  text: 你要把你的重担[a]卸给耶和华，他必扶持你；他永不让义人[b]动摇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的际遇”“你的忧虑”，也可能指“他所赐给你的”。这个希伯来名词十分罕见，可泛指落在一个人身上的事物。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为阳性单数“义人”，这里很可能用单数代表所有义人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלֵךְ
  choice: 卸给
  rationale: 该命令式动词本义是“投、抛”。“把重担卸给”在现代汉语中自然，也保留了将所负之物转交给另一位承担的鲜明意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，采用现代中文读者最熟悉且庄重的传统音译“耶和华”，而不以“主”替代。
- source_word: יְהָבְךָ
  choice: 你的重担
  rationale: 这是一个罕见名词，可指落在一个人身上的担子、际遇或挂虑。“重担”与下句上帝扶持人的应许衔接自然；其他可能含义在脚注中保留。
- source_word: יְכַלְכְּלֶךָ
  choice: 他必扶持你
  rationale: כלכל在这里有供养、支撑、维持之意。“扶持”既能表达支撑，也符合诗篇中信靠上帝的语境。
- source_word: לֹא יִתֵּן לְעוֹלָם
  choice: 他永不让
  rationale: 这一结构表达持续而坚决的不容许；译作“永不让”比逐字译法自然，同时保留其绝对语气。
- source_word: מוֹט
  choice: 动摇
  rationale: 该词表示失稳、摇动或倾倒。“动摇”保留了不稳的比喻，又是自然庄重的现代汉语。
- source_word: לַצַּדִּיק
  choice: 义人
  rationale: 原文是带定冠词的阳性单数名词化形容词，在此很可能具有代表性或泛指作用。中文“义人”既保留单数形式的简洁，也无需额外加入原文没有的性别限定。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。采用中文传统且广为人知的专名“耶和华”，既不以称号取代神名，也保持庄重和可读性。
- issue: לַצַּדִּיק 的单数与代表性
  choice: 义人
  alternative: 那个义人；义人男子
  rationale: 希伯来文虽为阳性单数，但在格言式应许中可代表一类人。中文“义人”保留了原文的称谓和潜在单数，又不把语法性别扩展成不必要的生理性别说明。
- issue: “永不让义人动摇”的应许范围
  choice: 保留绝对而诗性的表述
  alternative: 解释为义人绝不会遭遇任何困苦；解释为义人最终不会败亡
  rationale: 原文本身没有说明“动摇”的具体程度或时间层面，因此不在正文中把它限定为免受一切患难或仅指最终结局，以保留诗句的神学张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“把重担卸给”沿用汉语中清楚易懂的承重意象；分号呈现原文从劝勉到双重应许的推进。所有词义歧义均留在脚注或决策说明中，正文不作过度解释。
