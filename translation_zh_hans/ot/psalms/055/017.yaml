  yaml_path: translation/ot/psalms/055/017.yaml
  text: Evening[a], morning, and noon I complain and groan[c][b], and he hears my voice.
translation:
  language: zh_hans
  text: 傍晚、早晨和中午，我哀诉并呻吟；他听见我的声音。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哀诉”也可译作“默想”或“诉说”；“呻吟”也可译作“叹息”或“哀鸣”。本节“他”的所指从上下文看是神，但希伯来文没有在本节明说主语。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרֶב וָבֹקֶר וְצָהֳרַיִם
  choice: 晚上、早晨和中午
  rationale: 按希伯来文保留三个时段并列的诗歌节奏；中文以时间名词直接排列，自然且简洁。
- source_word: אָשִׂיחָה
  choice: 我都哀诉
  rationale: שׂיח可指思想、言说或倾诉；本诗为哀歌，又与表示出声不安的אֶהֱמֶה并列，因此译作“哀诉”，同时在脚注保留其他词义可能。
- source_word: וְאֶהֱמֶה
  choice: 叹息
  rationale: המה在此表达可听见的激动、呻吟或哀鸣；“叹息”符合现代汉语哀歌语境，又不过度强化声音形象。
- source_word: וַיִּשְׁמַע
  choice: 他就听见
  rationale: 诗歌中的连续式未完成时可表达随之发生的结果或确信；“就听见”既保留结果关系，也不强行限定为过去或将来。
- source_word: קוֹלִי
  choice: 我的声音
  rationale: 直译其常用义，保留祈求具有可听见声音的个人色彩。
theological_decisions:
- issue: וַיִּשְׁמַע的隐含主语
  choice: 正文译作“他”，不补出神名
  alternative: “神听见我的声音”或“耶和华听见我的声音”
  rationale: 希伯来文仅以第三人称阳性单数动词暗示主语；上下文指向神，但本节没有明说其名，因此不在正文增补。
- issue: וַיִּשְׁמַע的时态与体貌
  choice: “他就听见”
  alternative: “他必听见”或“他听见了”
  rationale: 原形式在诗歌中可有结果、确信或叙述色彩；中文采用不明确标定绝对时间的表达，以保留一定张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“哀诉叹息”凝练地呈现两动词并列；“晚上、早晨和中午”保持原文三项时间序列。脚注标记置于正文相关句末。
