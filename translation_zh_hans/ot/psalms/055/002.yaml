  text: הַקְשִׁ֣יבָ/ה לִּ֣/י וַ/עֲנֵ֑/נִי אָרִ֖יד בְּ/שִׂיחִ֣/י וְ/אָהִֽימָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/002.yaml
  text: Pay attention to me and answer me[a]; I am restless in my complaint[b], and I moan.
translation:
  language: zh_hans
  text: 求你留心听我，回答我！我在哀诉[a]中烦躁不安[b]，发出呻吟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哀诉”也可译作“沉思”或“默想”；这里根据哀歌的上下文译作“哀诉”。
    reason: lexical_alternative
  - marker: b
    text: “烦躁不安”所译的希伯来语动词，也可表示因痛苦而“徘徊不定”或躁动不宁。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: 留心听
  rationale: 该祈使式要求对方专注地聆听。“留心听”既保留恳求的迫切语气，也符合现代汉语表达。
- source_word: לִּי
  choice: 我
  rationale: 第一人称单数代词作听取的对象；在“听我”中自然体现。
- source_word: וַעֲנֵנִי
  choice: 回答我
  rationale: ענה在此指回应祈求；“回答我”直接、自然，并适合祷告语境。
- source_word: אָרִיד
  choice: 烦躁不安
  rationale: 该动词可表达在困苦中躁动、漂荡不定的状态。“烦躁不安”自然传达诗人内心无法安定，同时以脚注保留“徘徊不定”的动态可能。
- source_word: בְּשִׂיחִי
  choice: 在哀诉中
  rationale: שׂיח可指默想、沉思或诉说苦情；本诗哀歌语境支持“哀诉”，但脚注保留其他词义。
- source_word: וְאָהִימָה
  choice: 发出呻吟
  rationale: המה表示出声、喧响、哼鸣或呻吟；此处“发出呻吟”贴合痛苦哀歌的语境，并保留声音层面。
theological_decisions: []
