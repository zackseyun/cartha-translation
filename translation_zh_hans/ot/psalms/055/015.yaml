id: PSA.55.15
reference: Psalms 55:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ישימות עָלֵ֗י/מוֹ יֵרְד֣וּ שְׁא֣וֹל חַיִּ֑ים כִּֽי רָע֖וֹת בִּ/מְגוּרָ֣/ם בְּ/קִרְבָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/015.yaml
  text: Let death come upon them[a]; let them go down alive to Sheol, for evil is in their dwelling[d][c][b], in their midst.
translation:
  language: zh_hans
  text: 愿死亡临到他们[a]；愿他们活着下到阴间[b]，因为邪恶在他们的住处[c]，也在他们中间[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头的希伯来语词形难解；也可译作“愿毁灭临到他们”或“愿死亡突然临到他们”等。
    reason: textual_variant
  - marker: b
    text: “阴间”对应希伯来语“示奥尔”，指死者所在之处；也可译作“坟墓”或“死者之境”。
    reason: lexical_alternative
  - marker: c
    text: “住处”也可译作“居所”或“寄居之处”。
    reason: lexical_alternative
  - marker: d
    text: “在他们中间”也可理解为“在他们里面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ישימות
  choice: 愿死亡临到
  rationale: 这个词形和词源关系难以确定。结合下句“活着下到阴间”的平行表达，正文采用涉及死亡临到的诅咒语气；至于是否含有突然、袭击或毁灭之意，则不在正文中强行确定。
- source_word: עָלֵימוֹ
  choice: 他们
  rationale: 介词加第三人称阳性复数后缀；在“临到他们”中自然表达“在他们身上／临到他们”。
- source_word: יֵרְדוּ
  choice: 愿他们……下到
  rationale: 语境中带祈愿或诅咒的语气。“下到”保留原文向下进入死者领域的空间意象。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: “阴间”是现代中文中对希伯来语“示奥尔”较为自然的对应，指死者所在之处；避免译作“地狱”，以免引入原文未明确表达的后期教义含义。
- source_word: חַיִּים
  choice: 活着
  rationale: 在句中作状态表达，说明他们仍活着时便下到阴间；“活着”自然且准确。
- source_word: כִּי
  choice: 因为
  rationale: 引出前面祈愿或诅咒的理由。
- source_word: רָעוֹת
  choice: 邪恶
  rationale: 这里主要指道德上的恶，而非单纯的灾祸；中文用集合意义的“邪恶”表达自然。
- source_word: בִּמְגוּרָם
  choice: 在他们的住处
  rationale: 本词在此最可能指居所或栖身之处；正文采用清楚自然的“住处”，同时在脚注保留“寄居之处”的可能。
- source_word: בְּקִרְבָּם
  choice: 在他们中间
  rationale: 该短语既可能表示群体之中，也可能表示他们里面。结合前面的地点短语，正文采用“在他们中间”，但以脚注保留内在含义。
theological_decisions:
- issue: שְׁאוֹל所指的死者领域
  choice: 正文译作“阴间”
  alternative: 示奥尔；坟墓；死者之境
  rationale: “阴间”既能自然传达希伯来圣经中死者领域的意象，又不等同于“地狱”。脚注说明其原文术语和可译范围，以保留原有的神学张力。
- issue: 开头难解词形的诅咒语气
  choice: 愿死亡临到他们
  alternative: 愿毁灭临到他们；愿死亡突然临到他们
  rationale: 下句提到活着下到阴间，因此正文采用“死亡临到”的理解；但原词的确切细微含义不确定，不把“突然”等解释性成分写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“愿……；愿……”保留希伯来诗句的祈愿兼诅咒语气；“活着下到阴间”保留原文鲜明而紧张的意象。脚注标记按正文相应词语依次排列。
