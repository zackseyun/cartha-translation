  text: שָׁלַ֣ח יָ֭דָי/ו בִּ/שְׁלֹמָ֗י/ו חִלֵּ֥ל בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/020.yaml
  text: He stretched out his hands against those at peace with him[b][a]; he profaned his covenant.
translation:
  language: zh_hans
  text: 他伸手攻击与他和睦的人[a]；他亵渎了自己的约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的朋友”或“他的盟友”。希伯来语所指的是与他保持和平关系的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“他违背了自己的约”。希伯来语动词更直白地有“亵渎”或“当作污秽之物”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח יָדָיו
  choice: 伸手攻击
  rationale: 该短语直译为“伸出他的手”，在本语境中带有敌意行动的含义。“伸手攻击”既保留“手”的具体意象，也使现代汉语读者清楚看出加害之意；汉语惯用单数“手”，无需机械译出希伯来语复数。
- source_word: בִּשְׁלֹמָיו
  choice: 与他和睦的人
  rationale: שָׁלוֹם在这里指和平、和好的关系；此译保留关系层面的含义，且不把这些人过窄地限定为朋友或政治盟友。介词结合敌意动作按汉语表达处理。
- source_word: חִלֵּל
  choice: 亵渎
  rationale: חלל的Piel词形可指亵渎、使之成为俗物或视为污秽。与“约”连用时，“亵渎”比单纯的“违背”更能保留原文的道德与神圣分量。
- source_word: בְּרִיתוֹ
  choice: 自己的约
  rationale: בְּרִית通常译为“约”。第三人称阳性单数后缀在此自然指主语所负的约；“自己的约”符合现代汉语指代习惯，同时不进一步说明这约的具体类别或对象。
theological_decisions:
- issue: “约”的性质
  choice: 采用“约”与“亵渎”，保留原文的盟约性和道德分量，但不指明这是与上帝所立的约。
  alternative: 可较一般地译作“协议”或“盟约”，并把动词译为“违背”或“践踏”。
  rationale: 上下文责备亲近之人的背信行为，并未明确说这里是上帝之约。因此保留“约”的庄重用语，却不加入特定神学所指。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“伸手攻击”保留希伯来语的身体意象并表达语境中的敌意；分号对应两个紧密相连的控诉。所有脚注标记均置于相关词句之后。
