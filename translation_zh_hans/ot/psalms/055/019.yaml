source:
  edition: WLC
  text: יִשְׁמַ֤ע אֵ֨ל וְֽ/יַעֲנֵ/ם֮ וְ/יֹ֤שֵׁ֥ב קֶ֗דֶם סֶ֥לָה אֲשֶׁ֤ר אֵ֣ין חֲלִיפ֣וֹת לָ֑/מוֹ וְ/לֹ֖א יָרְא֣וּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/019.yaml
  text: God will hear and answer them—he who sits enthroned from of old (Selah)—because they have no changes[c][b][a], and they do not fear God.
translation:
  language: zh_hans
  text: 上帝必听见，也必回应他们[a]；他自亘古以来在位。（细拉）他们没有变故[b]，也不敬畏上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回应他们”也可译为“使他们降卑”或“惩治他们”；这种译法按上下文理解为上帝施行审判。
    reason: alternative_reading
  - marker: b
    text: 或译：“他们没有改变”或“他们没有经历变故”。原文短语含义较难确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: 必听见
  rationale: שׁמע的Qal未完成式在祈祷语境中表达诗人对上帝将采取行动的确信；“必听见”兼具将来和确定意味。
- source_word: אֵל
  choice: 上帝
  rationale: 这是诗歌中常见的神称；译作“上帝”自然庄重，也不额外强化词源上的能力含义。
- source_word: וְיַעֲנֵם
  choice: 也必回应他们
  rationale: 按马所拉文本的读音，直译为“回应他们”最为稳妥；但在敌人受审判的上下文中，这回应可能具有惩治意味，另见脚注。
- source_word: וְיֹשֵׁב קֶדֶם
  choice: 他就是那亘古坐在宝座上的主
  rationale: יֹשֵׁב可指坐着、居住或掌权；用于上帝时，“坐在宝座上”自然传达其亘古掌权的王权意象。“主”为汉语句法中的尊称补足，并非另译一个希伯来词。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切含义和礼仪功能不明，沿用传统音译，避免作无把握的解释性翻译。
- source_word: אֲשֶׁר אֵין חֲלִיפוֹת לָמוֹ
  choice: 因为他们的境遇从未改变
  rationale: חֲלִיפוֹת可表示改变、交替或逆转；结合下句，这里很可能描述长期安稳、未遭变故而滋生的不敬畏。译文保留“改变”的核心含义，脚注列出另一种自然理解。
- source_word: וְלֹא יָרְאוּ אֱלֹהִים
  choice: 也不敬畏上帝
  rationale: 完成式在此可描述已经形成并持续存在的态度；现代汉语用“不敬畏”自然表达这种定型的品性。
theological_decisions:
- issue: וְיַעֲנֵם所表达的是回应还是惩治
  choice: 正文采用“回应他们”
  alternative: “使他们降卑”或“惩治他们”
  rationale: 马所拉读音直接支持“回应”，但诗篇上下文以恶人受审判为主题，因此也可把同一形式理解为上帝使他们降卑或受苦。正文不把“回应”解释成恩惠，脚注保留司法性读法。
- issue: “没有改变”与不敬畏上帝之间的关系
  choice: 理解为他们的境遇长期未变，因此安逸自满
  alternative: 理解为他们本身毫无改变，或他们未遭命运逆转
  rationale: 希伯来短语简略而困难；正文采用较自然的处境性表达，但不明确加入“安逸”或“自满”等解释，避免消除原文含混。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌散文体。“细拉”独立置于括号内，既保留传统形式，也提示诵读中的停顿。破折号凸显对亘古掌权之上帝的插入说明；正文避免加入宗派性解释。
