source:
  edition: WLC
  text: פָּ֘דָ֤ה בְ/שָׁל֣וֹם נַ֭פְשִׁ/י מִ/קֲּרָב לִ֑/י כִּֽי בְ֝/רַבִּ֗ים הָי֥וּ עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/018.yaml
  text: He has redeemed my soul in peace from the battle against me[a], for many were with me.
translation:
  language: zh_hans
  text: 他救赎我的性命，使我平安脱离针对我的争战；因为有许多人与我同在[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为有许多人攻击我。”希伯来文直译为“因为有许多人与我同在”；结合争战的上下文，也可理解为人数众多的敌人正在与我为敌。
    reason: alternative_reading
lexical_decisions:
- source_word: פָּדָה
  choice: 救赎了
  rationale: 该动词表示付代价赎回或施行拯救；“救赎”保留其较强的赎回、解救意味，“了”自然表达此处完成式所陈述的成就。
- source_word: בְשָׁלוֹם
  choice: 使我平安
  rationale: שָׁלוֹם涵盖平安、安稳和完整；译作“使我平安”既保留核心语义，也使中文句法自然，并避免缩窄为仅仅“安全”。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ在此可指生命、自身或魂；“我的性命”既符合危难获救的语境，也比“我的灵魂”更少引入后来的身魂二分观念。
- source_word: מִקֲּרָב לִי
  choice: 脱离攻击我的争战
  rationale: קְרָב指争战或战斗，לִי在此按语境表达敌对关系；此译保留军事意象，同时清楚说明争战是针对诗人的。
- source_word: כִּי
  choice: 因为
  rationale: כִּי引出前句的理由或解释；“因为”在现代汉语中明确而自然。
- source_word: בְרַבִּים הָיוּ עִמָּדִי
  choice: 有许多人和我在一起
  rationale: עִמָּדִי最直接的意思是“和我在一起”。主文保留这一表层含义及其与争战语境形成的张力，不擅自判定这些人是同伴还是敌手。
theological_decisions:
- issue: 末句בְרַבִּים הָיוּ עִמָּדִי的身份与关系
  choice: 因为有许多人和我在一起
  alternative: 因为有许多人攻击我／与我为敌
  rationale: 介词עִם通常表示“与……同在”，但争战语境可使整句被理解为许多敌人围攻诗人。主文依希伯来语的直接措辞保留歧义，脚注说明可行的敌对性理解，避免把经文张力归结为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体。“救赎了我的性命”保留原文的拯救力度；后半句用脚注呈现原文在“同在”与“敌对”之间的语境歧义。
