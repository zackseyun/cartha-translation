lexical_decisions:
- source_word: אָחִישָׁה
  choice: 我要赶快
  rationale: 该词是חוּשׁ的第一人称意愿式，表达急切的个人意愿或决心；“我要赶快”在现代汉语中兼顾第一人称意愿与紧迫感，而不把它弱化为普通将来时。
- source_word: מִפְלָט
  choice: 避难之处
  rationale: 此名词可指逃脱的途径或避难处；结合风暴意象，“避难之处”自然地保留了寻求庇护及逃离危险的双重含义。
- source_word: לִי
  choice: 为自己
  rationale: 介词ל加第一人称后缀表示说话者自身的利益或归属；“为自己”明确呈现其个人关切。
- source_word: מֵרוּחַ
  choice: 躲开……风
  rationale: רוּחַ在此与风暴词汇并列，宜取气象意义“风”；前缀מִן表示远离或脱离，汉语以“躲开”自然表达。
- source_word: סֹעָה
  choice: 狂
  rationale: 该分词修饰风，描写猛烈席卷的动态；“狂风”是自然、凝练且有力度的现代汉语表达。
- source_word: מִסָּעַר
  choice: 躲开暴雨
  rationale: סַעַר指风暴或暴风雨；“暴雨”与前面的“狂风”组成自然的汉语风暴图景，并以重复“躲开”对应希伯来文重复的מִן，保留平行结构。
