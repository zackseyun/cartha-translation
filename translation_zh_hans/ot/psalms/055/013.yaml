  text: וְ/אַתָּ֣ה אֱנ֣וֹשׁ כְּ/עֶרְכִּ֑/י אַ֝לּוּפִ֗/י וּ/מְיֻדָּֽעִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/013.yaml
  text: But you—a man as my equal[a], my companion, and my familiar friend.
translation:
  language: zh_hans
  text: 但你却是与我同等的人，是我的密友[a]，是我的知己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “密友”或译“引导我的人”；希伯来语原词既可指亲密同伴，也可指领袖或引导者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 但你却
  rationale: 连词与独立代词在上下文中形成强烈转折；“但你却”自然凸显诗人对亲近之人背叛自己的震惊。
- source_word: אֱנוֹשׁ
  choice: 人
  rationale: 此词指人，有时含脆弱、必死之意；本节重点是背叛者与诗人同为亲近的人，故不把“必死”这一可能色彩明说。
- source_word: כְּעֶרְכִּי
  choice: 与我同等
  rationale: 源自 עֵרֶךְ，表达相当、同等或地位相称；此译简洁地保留其关系和身份层面的含义。
- source_word: אַלּוּפִי
  choice: 我的密友
  rationale: אַלּוּף 可指亲密同伴，也可指领袖或引导者。此处与“知己”并列，亲密伙伴之义较合语境，同时以脚注保留“引导我的人”这一词义可能。
- source_word: וּמְיֻדָּעִי
  choice: 是我的知己
  rationale: 该词由 ידע 构成，带第一人称后缀，指我所熟知、亲近的人；“知己”比“熟人”更能表达本段哀歌中的亲密关系和背叛之痛。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的普通话。“但你却”突出上下文的反差；两个“是”形成递进式直接指认。“密友”和“知己”既避免生硬重复，也传达亲近关系。
