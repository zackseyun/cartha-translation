  yaml_path: translation/ot/psalms/055/007.yaml
  text: Look[a], I would wander far away; I would lodge in the wilderness[c][b]. Selah
translation:
  language: zh_hans
  text: '看哪，我要远远逃走；

    我要在旷野过夜。[a]

    细拉。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “远远逃走”也可译作“远远离去”或“远走”；“过夜”也可译作“住宿”或“留宿”。
    reason: 原文将表示“使自己远离”的动词与可表示逃遁、游荡的不定式连用；“过夜”的动词指住宿或夜宿。
  - marker: b
    text: “细拉”是音译，确切含义不明，可能是音乐或礼仪上的标记。
    reason: 保留原文中意义不确定的术语，并向现代读者说明其可能性质。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意、加强现场感的语气，同时采用现代读者仍能自然理解的庄重表达。
- source_word: אַרְחִיק נְדֹד
  choice: 我要远远逃离
  rationale: אַרְחִיק表达远离，后接不定式绝对形נְדֹד，强化或具体说明离去的动作；结合本诗逃避危难的语境，“远远逃离”自然地传达主动远走，也不把它弱化为静态的距离。
- source_word: אָלִין
  choice: 我要……过夜
  rationale: 该动词通常指住宿、留宿或过夜；“过夜”保留其具体的夜宿含义，比笼统的“停留”更准确。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר可指荒野、旷野或草原地带，并不专指沙漠；“旷野”涵盖面较广，也符合诗歌语体。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切含义不明，可能是音乐或礼仪标记；依照传统音译保留，不作推测性翻译。
