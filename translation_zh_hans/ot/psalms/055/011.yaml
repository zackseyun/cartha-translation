base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/011.yaml
  text: Destruction is within her[b][a]; oppression and deceit do not depart from her square.
translation:
  language: zh_hans
  text: 她里面尽是祸患；欺压和诡诈从不离开她的广场。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她的街道”。原词通常指城中宽阔的公共场所，也可较宽泛地理解为街道。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: 种种祸害
  rationale: 该词是复数，可指造成毁坏的恶事、灾祸或败坏；“种种祸害”既保留复数意味，也自然表达城中遍布的毁灭性邪恶。
- source_word: בְּקִרְבָּהּ
  choice: 她里面
  rationale: 原文直译为“在她当中”，阴性后缀把城人格化；“她里面”保留空间意义和这一人格化表达。
- source_word: יָמִישׁ
  choice: 从不离开
  rationale: 该动词表示移开、离去；否定式表达欺压和诡诈持续存在。希伯来语动词虽为单数，但位于复合主语之前，中文无须标示数。
- source_word: מֵרְחֹבָהּ
  choice: 她的广场
  rationale: רְחוֹב通常指城中的宽阔公共场所或广场；“广场”比泛指道路的“街道”更贴近其核心城市空间含义。
- source_word: תֹּךְ
  choice: 欺压
  rationale: 该名词可指压迫、勒索或欺诈；在城市公共生活的语境中，“欺压”自然涵盖以强凌弱的社会恶行。
- source_word: וּמִרְמָה
  choice: 和诡诈
  rationale: מִרְמָה可指欺骗、诡诈或欺诈行为；“诡诈”既简明庄重，也能与“欺压”构成原文并列的两种恶行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“她”延续原文对城市的阴性人格化；“种种祸害”保留复数语义，避免用抽象单数消解原文的多重毁灭性恶事。
