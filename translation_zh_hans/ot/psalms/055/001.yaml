  yaml_path: translation/ot/psalms/055/001.yaml
  text: Give ear[a], O God, to my prayer, and do not hide yourself from my supplication.
translation:
  language: zh_hans
  text: 上帝啊，求你侧耳听我的祷告；不要躲避我的恳求。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要不理会我的恳求。”原文直译为“不要隐藏自己，不回应我的恳求”，表示拒绝留意或回应祷告。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: 求你侧耳听
  rationale: 该动词是命令式，意为“侧耳、留心听”。“侧耳听”保留希伯来语的形象和恳切的祈祷语气；加“求你”符合现代汉语祷告中的自然表达。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处直接称呼以色列的上帝；原文不是圣约之名，故不译为“耶和华”。
- source_word: תְּפִלָּתִי
  choice: 我的祷告
  rationale: תְּפִלָּה是表示祷告的常用词，“我的祷告”准确、自然。
- source_word: וְאַל
  choice: 不要
  rationale: 连接第二个祈求并带否定意义。汉语以分号连接两个平行祈求，无须机械译出连接词。
- source_word: תִּתְעַלַּם
  choice: 隐藏自己
  rationale: 该反身形式表达把自己隐藏起来、使自己不回应。保留“隐藏自己”的比喻，可呈现诗句的关系性张力，而不直接释义为“不理会”。
- source_word: מִתְּחִנָּתִי
  choice: 在我的恳求面前
  rationale: תְּחִנָּה指恳切求恩的请求；“恳求”兼具清晰度和迫切感。介词מִן与“隐藏”连用表示躲避、避开，译作“在……面前”使汉语自然，同时保留原文意象。
theological_decisions: []
