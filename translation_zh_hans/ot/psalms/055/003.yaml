id: PSA.55.3
reference: Psalms 55:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ/קּ֤וֹל אוֹיֵ֗ב מִ/פְּנֵ֣י עָקַ֣ת רָשָׁ֑ע כִּי יָמִ֥יטוּ עָלַ֥/י אָ֝֗וֶן וּ/בְ/אַ֥ף יִשְׂטְמֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/003.yaml
  text: Because of the voice of the enemy[a], because of the oppression of the wicked; for they cast trouble upon me[b], and in anger they hate me.
translation:
  language: zh_hans
  text: 因仇敌的声音，因恶人的欺压；他们把祸患加在我身上[a]，怒气冲冲地仇视我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸患”也可译作“邪恶”或“伤害”；本句也可译为“他们使祸患落在我身上”。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: מִקּוֹל אוֹיֵב
  choice: 因仇敌的声音
  rationale: מִן在此与下句מִפְּנֵי平行，宜表原因；保留“声音”这一具体意象，也保留单数“仇敌”的集体或代表性用法。
- source_word: מִפְּנֵי עָקַת רָשָׁע
  choice: 因恶人的欺压
  rationale: עָקַת表示压力、困迫或压迫；在敌对者施加痛苦的语境中，“欺压”自然且准确。רָשָׁע虽为单数，汉语“恶人”可作类别或代表性称呼。
- source_word: יָמִיטוּ עָלַי אָוֶן
  choice: 他们把祸患加在我身上
  rationale: יָמִיטוּ是复数使役形式，描写使某物落到或临到诗人身上；“加在我身上”保留敌意施加的方向。אָוֶן在此可指祸患、伤害，也可能含邪恶之意。
- source_word: וּבְאַף
  choice: 怒气冲冲地
  rationale: אַף本义为“鼻子”，此处惯用义为“怒气”；介词ב使全语具有方式意味，译作副词性表达更合现代汉语。
- source_word: יִשְׂטְמוּנִי
  choice: 仇视我
  rationale: 该动词表示怀恨、敌视或憎恨；“仇视”兼顾持续敌意与自然中文表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。前两分句保留希伯来文“因……因……”的平行结构；后半句避免过度解释אָוֶן，并以脚注保存其词义及动词意象上的歧义。
