id: PSA.55.23
reference: Psalms 55:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֤ה אֱלֹהִ֨ים תּוֹרִדֵ֬/ם לִ/בְאֵ֬ר שַׁ֗חַת אַנְשֵׁ֤י דָמִ֣ים וּ֭/מִרְמָה לֹא יֶחֱצ֣וּ יְמֵי/הֶ֑ם וַ֝/אֲנִ֗י אֶבְטַח בָּֽ/ךְ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/023.yaml
  text: But you[a], God, will bring them down to the pit of destruction; men of bloodshed and deceit will not live out half their days[b], but I will trust in you.
translation:
  language: zh_hans
  text: 但你，神啊，必使他们下到毁灭的深坑[a]；好流人血、行诡诈的人，活不到他们年日的一半[b]。至于我，我要倚靠你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“朽坏的深坑”“坟墓的坑”或“深坑”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“不能把自己的年日分成两半”，意思是他们的寿命将被截短。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרִידֵם
  choice: 必使他们下到
  rationale: 使役形动词意为“使……下去”。“使他们下到”保留使役含义，也不额外规定审判实施的具体方式。
- source_word: לִבְאֵר שַׁחַת
  choice: 毁灭的深坑
  rationale: בְּאֵר 指坑或井，שַׁחַת 可指坑、毁灭或朽坏。“毁灭的深坑”兼顾具体意象和死亡、毁灭的含义，同时避免将其限定为某个后世教义术语。
- source_word: אַנְשֵׁי דָמִים
  choice: 好流人血的人
  rationale: 原文直译近于“血的人”，是指惯行暴力、负有血债的人。“好流人血”在现代汉语中清楚而有尊严，并保留血腥暴力的具体意味。
- source_word: וּמִרְמָה
  choice: 行诡诈
  rationale: מִרְמָה 可指欺骗、诡诈或背信。与“人”搭配时译作“行诡诈”，自然表达这类人的行为和品格。
- source_word: לֹא יֶחֱצוּ יְמֵיהֶם
  choice: 活不到他们年日的一半
  rationale: חצה 本义为“分成两半”。这里沿用原文“年日的一半”这一强烈说法，同时用“活不到”清楚表达寿命被截短之意。
- source_word: וַאֲנִי אֶבְטַח בָּךְ
  choice: 至于我，我要倚靠你
  rationale: 独立人称代词使“我”带有强调和对比意味。“至于我”保留诗人与恶人命运之间的转折，“倚靠”自然表达信赖与投靠。
theological_decisions:
- issue: “毁灭的深坑”所表达的审判性质
  choice: 保留为神施行审判、使人走向死亡和毁灭的诗性意象
  alternative: 明确译作“坟墓”“阴间”或某个末世刑罚术语
  rationale: 此处希伯来语意象强烈，却不足以唯一确定某个专门的末世论概念；因此保留其审判和死亡的力度，不作超出经文的教义限定。
- issue: “活不到他们年日的一半”的性质
  choice: 保留为恶人寿命遭截短的诗性审判宣告
  alternative: 解释成所有好流人血、行诡诈者必定在数学意义上的人生中点以前死亡
  rationale: 原文采用“不能把自己的年日过到一半”的强烈表达，重点在生命因审判而缩短；译文保留措辞，不将诗歌宣告扩展为机械性的普遍寿命公式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“神啊”保留直接呼告；分号呈现神对恶人的审判与诗人信靠之间的结构。“至于我，我要……”保留原文人称代词的强调。脚注[a]按其内容置于“毁灭的深坑”之后，以对应相关词语。
