  yaml_path: translation/ot/psalms/055/006.yaml
  text: And I said[a], “Who will give me wings like a dove? I would fly away and dwell.”
translation:
  language: zh_hans
  text: 我说[a]：“谁能给我鸽子般的翅膀？我就飞去，住下。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按愿望的语气意译为：“但愿我有鸽子般的翅膀！我就飞去，得享安歇。”
    reason: 希伯来语“谁能给我”在这里是表达强烈愿望的习用说法；“得享安歇”是结合语境对“住下”的意译，而非该词唯一的直接词义。
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我便说
  rationale: 未完成式连续体在这里引出诗人的话；“便”自然地表达叙事推进，又不过度强化因果或时间关系。
- source_word: מִי יִתֶּן לִּי
  choice: 谁给我
  rationale: 保留希伯来文“谁会给我”的问句形式及其愿望色彩，不在正文中直接改写为“但愿我有”。
- source_word: אֵבֶר
  choice: 翅膀
  rationale: 该词虽为单数形式，此处却整体指飞行所需的翼；现代汉语自然使用“翅膀”。
- source_word: כַיּוֹנָה
  choice: 鸽子般的
  rationale: 准确表达比较词כְּ所标示的比拟，并符合现代汉语习惯。
- source_word: אָעוּפָה
  choice: 我要飞走
  rationale: 祈愿式表达诗人想要逃离的愿望；“我要”保留第一人称意愿，“飞走”自然呈现离去的方向感。
- source_word: וְאֶשְׁכֹּנָה
  choice: 住下来
  rationale: שׁכן的基本义是居住、定居；“住下来”直接而自然，并避免把上下文隐含的安歇之意写成本词的明说含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。正文保留原文问句所表达的愿望形式，并以脚注提供更符合汉语习惯的意译；不把“居住”与“安歇”之间的词义和语境差别混为一谈。
