  text: 'For the choirmaster: with stringed instruments. A Maskil[a] of David[b].'
translation:
  language: zh_hans
  text: 交给乐长：用弦乐器。大卫的[b]玛斯基勒诗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛斯基勒”是希伯来语音译；也可理解为“训诲诗”或“默想诗”。这个词在诗篇题注中的确切含义不明。
    reason: lexical_alternative
  - marker: b
    text: “大卫的”也可理解为“大卫所作”或“献给大卫”。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 该词在诗篇题注中通常指负责圣乐演奏的人；“乐长”简洁、庄重，也保留前缀 ל 所表达的交付或指示关系。
- source_word: בִּנְגִינֹת
  choice: 配弦乐器
  rationale: 该词在题注中很可能指弦乐伴奏；“配弦乐器”自然地表达演唱或诵唱时使用弦乐伴奏，且不把介词 בִּ 过度限定为“在……上”。
- source_word: מַשְׂכִּיל
  choice: 玛斯基勒诗
  rationale: 这是诗篇题注中的体裁或音乐技术用语，确切含义不明。正文采用音译并补上“诗”以便现代中文读者理解，可能的含义则收入脚注，避免武断译成“训诲诗”或“默想诗”。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 介词 לְ 可表示作者、归属、关联或献给某人。“大卫的”在中文中保留了一定幅度的关系含义，不强行断定必为大卫亲笔所作。
theological_decisions:
- issue: 题注 לְדָוִד 所表达的大卫与本诗的关系
  choice: 大卫的
  alternative: 大卫所作；献给大卫
  rationale: 原文没有明确限定这种关系究竟是作者、归属、关联还是奉献对象。采用“大卫的”可保留这种真实的歧义，避免加入强于原文的作者身份断言。
translation_notes:
  register: 采用简明、庄重的现代标准汉语。题注按三个短语处理；对含义不确定的体裁术语保留音译，并用脚注解释。脚注标记紧跟各自所说明的词语。
