  text: Together we sweetened counsel[c][b][a]; in the house of God we walked in the throng.
translation:
  language: zh_hans
  text: 我们曾一同畅谈心事[a]；又在上帝的殿中随众而行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “畅谈心事”也可译作“亲密商议”“密谈”或“共享甜美的密谈”。原文动词有“使之甜美”的比喻意味，名词可指私密、亲近的交谈或商议。
    reason: lexical_alternative
  - marker: b
    text: “随众而行”也可译作“在人群中行走”或“在喧闹的人群中行走”。原文也可能带有群众涌动或骚动的意味；“在上帝的殿中”按原文是与“行走”相连的处所表达。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: אֲשֶׁר יַחְדָּו
  choice: 我们曾一起
  rationale: 关系词承接上一节所说的同伴；本节独立呈现时，用“一起”自然保留共同经历的重点。补出“曾”表达诗人在追忆昔日惯常经历的语境。
- source_word: נַמְתִּיק סוֹד
  choice: 甜蜜地倾心交谈
  rationale: נמתיק含“使之甜美”的意象，סוד可指亲密而保密的交谈或商议。此译保留“甜蜜”的比喻，同时以现代汉语表达亲密、推心置腹的交流，不把词义限缩为一般建议。
- source_word: בְּבֵית אֱלֹהִים
  choice: 走进上帝的殿
  rationale: 原文介词短语与行走动词结合，可表示在上帝的殿中行走，也可按朝圣场景理解为前往、进入圣殿；正文采用自然且符合群体敬拜场景的表达，并以脚注保留另一种句法理解。
- source_word: נְהַלֵּךְ
  choice: 我们曾……走进
  rationale: 该未完成式在追忆语境中可表达过去反复或惯常的行动；“曾”使现代汉语的时间关系清楚。
- source_word: בְּרָגֶשׁ
  choice: 在熙攘的人群中
  rationale: רֶגֶשׁ可指聚集的人群，也带喧闹、涌动之感。“熙攘的人群”兼顾群体与声势，却不将圣殿敬拜场景误写成骚乱。
theological_decisions:
- issue: “上帝的殿”所描绘的是殿内同行还是随众前往圣殿
  choice: 走进上帝的殿
  alternative: 在上帝的殿中行走
  rationale: 希伯来语介词结构容许两种理解；上下文很可能回忆二人随敬拜群众前往圣所。正文采用较自然的朝圣图景，但通过脚注保留位置性的读法，避免把句法张力绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“倾心交谈”传达旧友之间亲密可信的交流；“熙攘”保留人群聚集与声势，却避免“骚乱”所带来的负面含义。两个脚注标记均已置于正文相应位置。
