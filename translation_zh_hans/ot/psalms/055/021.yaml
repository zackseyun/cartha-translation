    text: 或译：“他口中说出谄媚的话。”原文表达罕见，可能更具体地指像奶油一样柔滑的话，或奉承讨好的言语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“拔出的剑。”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלְקוּ מַחְמָאֹת פִּיו
  choice: 他口中的话柔滑
  rationale: 原文是罕见而具象的表达，可能带有“像奶油般柔滑”或“谄媚”的意味。正文用现代汉语“话柔滑”保留言语表面悦耳却不可信的意象，并在脚注说明其他可能译法。
- source_word: וּקֲרָב לִבּוֹ
  choice: 心里却是争战
  rationale: קֲרָב 是“争战、战斗”的名词。此译保留原文凝练的隐喻，不将其直接释义为一般的“敌意”。
- source_word: רַכּוּ דְבָרָיו מִשֶּׁמֶן
  choice: 他的话比油还柔和
  rationale: רַכּוּ 表示柔软、柔和，מִן 构成比较；“比油还柔和”直接保留原文的触觉比喻。
- source_word: וְהֵמָּה
  choice: 其实是
  rationale: 连词与强调代词在此形成强烈反差；“其实”自然呈现柔和言辞背后的真实危险。
- source_word: פְתִחוֹת
  choice: 出鞘的剑
  rationale: 此词在这里通常理解为已经打开、拔出的武器。“出鞘的剑”既符合上下文，也保留暴力迫近的形象。
