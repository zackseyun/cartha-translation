  text: כִּ֤י לֹֽא אוֹיֵ֥ב יְחָֽרְפֵ֗/נִי וְ/אֶ֫שָּׂ֥א לֹֽא מְ֭שַׂנְאִ/י עָלַ֣/י הִגְדִּ֑יל וְ/אֶסָּתֵ֥ר מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/012.yaml
  text: For it is not an enemy who taunts me—then I could bear it[b][a]; it is not one who hates me who has magnified himself against me—then I could hide from him.
translation:
  language: zh_hans
  text: 因为嘲骂我的并不是仇敌——若是仇敌，我还可以忍受[a]；向我妄自尊大的也不是恨我的人——若是恨我的人，我还可以躲避他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嘲骂”也可译作“辱骂”或“羞辱”；希伯来语原词指带着蔑视的言语攻击。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为诗人的哀叹说明缘由；现代汉语中“因为”清楚自然。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 准确表达敌对者，且符合诗篇庄重而通俗的语体。
- source_word: יְחָרְפֵנִי
  choice: 嘲骂我的
  rationale: חרף表示带着蔑视的言语羞辱；“嘲骂”兼顾讥嘲与辱骂的意味。
- source_word: וְאֶשָּׂא
  choice: 我还可以忍受
  rationale: נשׂא在此为“承受、忍受”；根据前后并列的反事实结构，用“还可以”自然表达隐含的假设语气。
- source_word: מְשַׂנְאִי
  choice: 恨我的人
  rationale: 以自然汉语表达该分词所指持续敌视诗人的人。
- source_word: עָלַי הִגְדִּיל
  choice: 向我妄自尊大
  rationale: 保留“使自己为大”的希伯来语意象，并用“妄自尊大”传达针对诗人的傲慢敌对行为。
- source_word: וְאֶסָּתֵר מִמֶּנּוּ
  choice: 若是他，我还可以躲开
  rationale: Niphal形态表达自己隐藏、躲避；“躲开”在现代汉语中自然，也保留远离那人的意思。
