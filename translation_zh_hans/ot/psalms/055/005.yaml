  text: יִרְאָ֣ה וָ֭/רַעַד יָ֣בֹא בִ֑/י וַ֝/תְּכַסֵּ֗/נִי פַּלָּצֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/005.yaml
  text: Fear and trembling come upon me[a], and horror covers me.
translation:
  language: zh_hans
  text: 恐惧和战兢临到我，惊骇[a]笼罩着我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“战栗”。
    reason: 原词 פַּלָּצוּת 既可表示强烈的惊恐，也可侧重因恐惧而产生的战栗。
lexical_decisions:
- source_word: יִרְאָה
  choice: 恐惧
  rationale: 该名词表示惧怕或畏惧；“恐惧”直接、自然，并能与下文的“战兢”形成合乎汉语习惯的搭配。
- source_word: וָרַעַד
  choice: 和战兢
  rationale: 该词指因恐惧而身体发抖；“战兢”兼顾身体颤抖与内心惧怕的含义，也保留原文庄重的诗歌语体。
- source_word: יָבֹא בִי
  choice: 临到我
  rationale: 原文直译近于“进入我里面”，在此表示恐惧与战兢袭来；“临到我”既保留希伯来语的表达方向，又符合现代汉语。
- source_word: וַתְכַסֵּנִי
  choice: 笼罩着我
  rationale: 动词基本义为“遮盖”。“笼罩着我”在汉语中自然地保留了被某种强烈感受覆盖、包围的意象，避免直接解释成“压倒我”。
- source_word: פַּלָּצוּת
  choice: 惊骇
  rationale: 该名词可指强烈的惊恐、恐怖，也可侧重因恐惧而战栗。“惊骇”表达其强度，同时避免与前句“恐惧”完全重复；脚注保留“战栗”的可能含义。
theological_decisions: []
