  text: יוֹמָ֤ם וָ/לַ֗יְלָה יְסוֹבְבֻ֥/הָ עַל חוֹמֹתֶ֑י/הָ וְ/אָ֖וֶן וְ/עָמָ֣ל בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/010.yaml
  text: Day and night they go around her on her walls[b][a], and trouble and misery are within her.
translation:
  language: zh_hans
  text: 它们昼夜在城墙上绕行[a]；罪恶和苦难都在城中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们昼夜在城墙上围住这城。”原文动词既可强调绕行，也可强调包围。
    reason: lexical_alternative
  - marker: b
    text: “罪恶和苦难”也可译作“邪恶和欺压”或“罪孽和祸患”；原文两个词既可指道德上的恶，也可指恶所造成的患难。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  choice: 昼夜
  rationale: 这是表示持续不断的时间对语；“昼夜”简洁自然，也保留了原文的诗歌节奏。
- source_word: יְסוֹבְבֻהָ
  choice: 它们……绕城而行
  rationale: סבב既可指绕行，也可指围住。此处用“绕城而行”保留动作感；复数主语在本节中未明说，因此以“它们”承接上下文中的拟人化力量，不另行指明所指。
- source_word: עַל חוֹמֹתֶיהָ
  choice: 在城墙上
  rationale: עַל通常表示“在……上”；这里直接呈现这些力量在城墙上绕城而行的图景。
- source_word: אָוֶן
  choice: 罪恶
  rationale: 该词可表示邪恶、罪孽，也可表示邪恶造成的祸患；“罪恶”在此凸显城内的道德败坏，同时与后面的“苦难”形成张力。
- source_word: עָמָל
  choice: 苦难
  rationale: 该词可表示劳苦、患难，也可指欺压性的恶行；“苦难”传达其造成的痛苦后果，又不把含义限定为某一种社会罪行。
- source_word: בְּקִרְבָּהּ
  choice: 在城中
  rationale: 原文直译为“在她里面/当中”，以阴性代词指拟人化的城；现代汉语以“在城中”自然保留所指。
theological_decisions:
- issue: אָוֶן与עָמָל兼具道德邪恶和受苦后果的含义
  choice: 正文译作“罪恶和苦难”
  alternative: “邪恶和欺压”“罪孽和祸患”
  rationale: 此译法分别突显恶本身及其痛苦后果，同时用脚注保留两个词语义范围彼此交叠的张力，避免只按道德罪责或只按受害经历来解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“绕城而行”保留诗句的动态画面；“它们”维持原文复数主语未在本节明说的特点。脚注标记依正文出现顺序排列。
