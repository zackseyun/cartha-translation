id: PSA.55.9
reference: Psalms 55:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּלַּ֣ע אֲ֭דֹנָ/י פַּלַּ֣ג לְשׁוֹנָ֑/ם כִּֽי רָאִ֨יתִי חָמָ֖ס וְ/רִ֣יב בָּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/009.yaml
  text: Confuse them[a], Lord; divide their speech[b], for I have seen violence and strife in the city.
translation:
  language: zh_hans
  text: '主啊，求你使他们混乱；[a]

    使他们的言语分裂，[b]

    因为我看见城中有暴力和争斗。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“吞灭他们，主啊”，或“毁灭他们，主啊”。希伯来语动词通常可带有更直接的毁灭意味；但在这里，它也可能是求上帝使他们陷入混乱，令其谋划败坏。
    reason: alternative_reading
  - marker: b
    text: 直译：“使他们的舌头分裂”；意思是扰乱他们共同说话或彼此沟通的能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  choice: 使他们混乱
  rationale: 该动词通常有“吞下、吞灭”的意思；但它在这里与下一句“使他们的言语分裂”并列，语境可能指使敌人的谋划因混乱而败坏。因此正文按语境译为“使他们混乱”，同时以脚注保留更直译且带毁灭意味的可能读法。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是称呼上帝的头衔“主”，并非四字神名；呼格译作“主啊”自然、庄重。
- source_word: פַּלַּג
  choice: 使……分裂
  rationale: 该祈使式意为“分开、分裂”。译文保留其主动造成分裂的力度，也不排除与巴别事件相似的意象。
- source_word: לְשׁוֹנָם
  choice: 他们的言语
  rationale: 原文直译为“他们的舌头”，此处以身体部位转指言语或语言。“言语”在现代汉语中清楚自然，同时脚注保留原文意象。
- source_word: כִּי
  choice: 因为
  rationale: 该连词引出诗人祈求的理由，译作“因为”明确而自然。
- source_word: רָאִיתִי
  choice: 我看见
  rationale: 完成式表示诗人已经观察到、并以此作为祈求根据的现实；汉语“我看见”无需额外标明时态。
- source_word: חָמָס
  choice: 暴力
  rationale: 该词可指暴力、残暴或暴虐不法；“暴力”准确且为现代读者易懂。
- source_word: וְרִיב
  choice: 和争斗
  rationale: רִיב可指争讼、纷争或争斗；“争斗”与“暴力”搭配自然，并保留城市内部冲突的意味。
- source_word: בָּעִיר
  choice: 城中
  rationale: 简洁表达“在那城里”的地点意义，符合汉语诗体表达。
theological_decisions:
- issue: 开头祈使词 בַּלַּע 与随后“使他们的言语分裂”的关系
  choice: 正文译为求上帝“使他们混乱”
  alternative: “吞灭他们”或“毁灭他们”
  rationale: 该词本身通常带“吞下、吞灭”的毁灭性含义，但紧接着的平行句聚焦言语被分裂，因此也可能表达使敌人的沟通和谋划陷入混乱。正文采用语境性译法，脚注保留字面及毁灭性读法，不把原文的张力静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。保留两行祈求与一行理由的结构；“主啊，求你……”体现祷告语气。正文不用过于古雅的“吞灭”作为唯一读法，而由脚注保存原文的字面力度与解释张力。
