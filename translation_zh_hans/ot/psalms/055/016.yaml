  yaml_path: translation/ot/psalms/055/016.yaml
  text: As for me[a], I call to God, and Yahweh will save me.
translation:
  language: zh_hans
  text: 至于我，我向上帝呼求；雅威必拯救我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי
  choice: 至于我
  rationale: 独立人称代词置于句首，带有强调和对比意味；“至于我”在现代汉语中自然地体现这一作用。
- source_word: אֶל־אֱלֹהִים אֶקְרָא
  choice: 我要向上帝呼求
  rationale: אֶל 表示呼求所指向的对象；קרא 的未完成式可有现在、习惯或将来意味。结合上下文，译作“我要……呼求”既保留意愿与前瞻色彩，也符合诗歌语气；“呼求”比单纯“呼叫”更贴合向上帝求告的语境。
- source_word: וַיהוָה
  choice: 雅威
  rationale: 直接音译神名 יהוה，并以分号表达两个紧密相连而主语不同的分句；连接词 ו 的衔接作用由标点自然承载。
- source_word: יוֹשִׁיעֵנִי
  choice: 必拯救我
  rationale: ישׁע 的使役式表示“拯救、解救”；未完成式在此表达诗人对将来行动的确信，因此用“必拯救我”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，不以称号取代，也不引入特定宗派解释。
- issue: יוֹשִׁיעֵנִי 的时态与确信程度
  choice: 必拯救我
  alternative: 要拯救我；拯救我
  rationale: 希伯来语未完成式本身可承载多种时体意味；在本节的信靠宣告中，“必”自然表达面向未来的确信，但不进一步规定拯救的方式或时间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于我”保留句首强调；分号呈现呼求与确信之间的诗意推进。
