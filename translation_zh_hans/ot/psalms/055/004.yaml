  text: My heart writhes within me[a], and the terrors of death have fallen upon me.
translation:
  language: zh_hans
  text: 我心在我里面翻腾[a]；死亡的惊恐落在我身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我心在我里面颤抖。”希伯来语动词可表示翻腾、颤抖或痛苦不安。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: 我的心
  rationale: לֵב在此指人的内在思想与情感中心；译作“我的心”自然、庄重，也保留原文具身的情感表达。
- source_word: יָחִיל
  choice: 翻腾
  rationale: חול/חיל在此可表示翻腾、战抖或痛苦不安。“翻腾”传达强烈的内在震荡，同时在脚注中保留“战抖”的可能。
- source_word: בְּקִרְבִּי
  choice: 在我里面
  rationale: קֶרֶב加第一人称后缀指人的内部；“在我里面”贴近原文，并适合诗歌语体。
- source_word: אֵימוֹת
  choice: 惊恐
  rationale: אֵימָה的复数表示压倒人的恐惧与可怖之感。汉语“惊恐”虽不显形态复数，却能自然表达这一集合性的强烈恐惧。
- source_word: מָוֶת
  choice: 死亡的
  rationale: 保留原文与“惊恐”之间的属格关系，不进一步断定死亡是恐惧的来源、对象，还是拟人化力量。
- source_word: נָפְלוּ
  choice: 临到
  rationale: 原义为“落下”；与恐惧搭配时，“临到”是自然庄重的汉语表达，也传达恐惧突然压到诗人身上的结果。
- source_word: עָלָי
  choice: 我身上
  rationale: עַל加第一人称后缀直译为“在我之上／身上”；与“临到”连用可自然表达灾祸压在诗人身上。
