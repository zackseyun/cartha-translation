  text: לֹֽא יֵ֭בֹשׁוּ בְּ/עֵ֣ת רָעָ֑ה וּ/בִ/ימֵ֖י רְעָב֣וֹן יִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/019.yaml
  text: They will not be put to shame in a time of trouble[c][b][a], and in days of famine they will be satisfied.
translation:
  language: zh_hans
  text: 他们在患难之时不致蒙羞[a][b]；在饥荒的日子，他们仍得饱足[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不会羞愧”。希伯来语动词既可指内心感到羞愧，也可指受辱、蒙羞。
    reason: lexical_alternative
  - marker: b
    text: “患难”也可译作“灾祸”或“逆境”；这里不是指道德意义上的邪恶。
    reason: lexical_alternative
  - marker: c
    text: “得饱足”也可译作“吃得饱”或“得到满足”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: 不致蒙羞
  rationale: בושׁ可指感到羞愧，也可指因期待落空而受辱、蒙羞。这里以“不致蒙羞”表达结果性的公开羞辱，同时不排除羞愧这一语义。
- source_word: בְּעֵת רָעָה
  choice: 在患难之时
  rationale: רָעָה在此指逆境、灾祸，而非道德意义上的邪恶；“患难之时”自然庄重，也保留较宽的涵盖范围。
- source_word: וּבִימֵי רְעָבוֹן
  choice: 在饥荒的日子
  rationale: 该结构直译为“在饥荒的日子”；רְעָבוֹן在此最恰当地表示严重缺粮的饥荒。
- source_word: יִשְׂבָּעוּ
  choice: 仍得饱足
  rationale: שׂבע表示吃饱、得到充分供应。“得饱足”准确传达充足供给；“仍”体现即使在饥荒中也如此的对比关系，但不增添供给方式。
