  text: כִּ֤י זְרוֹע֣וֹת רְ֭שָׁעִים תִּשָּׁבַ֑רְנָה וְ/סוֹמֵ֖ךְ צַדִּיקִ֣ים יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/017.yaml
  text: For the arms of the wicked will be broken[a], but Yahweh upholds the righteous.
translation:
  language: zh_hans
  text: 因为恶人的手臂必被折断[a]，但雅威扶持义人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“手臂”；此处可能借指恶人的力量或权势。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出对上下文劝勉的原因或解释，保留原文的因果说明作用。
- source_word: זְרוֹעוֹת
  choice: 膀臂
  rationale: 原义为复数“手臂”，在诗歌中也可转指力量或权势；“膀臂”保留具体意象，同时符合庄重的诗篇语体。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 名词化的复数形容词，指邪恶之人；“恶人”简洁自然，并保留其道德范畴。
- source_word: תִּשָּׁבַרְנָה
  choice: 必被折断
  rationale: 尼法勒未完成式阴性复数，与“膀臂”一致；被动表达直接保留原文，且“必”传达诗句所宣告的将来结局。
- source_word: וְ
  choice: 但
  rationale: 形式上可译“而/和”，此处两分句形成鲜明对比，译作“但”更准确地表达语篇关系。
- source_word: סוֹמֵךְ
  choice: 扶持
  rationale: 分词表示持续托住、支撑；“扶持”自然地呈现耶和华不断支持义人的意思。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 名词化复数形容词，指行义或被视为正直的人；“义人”是诗篇和智慧文学中清楚、凝练的对应语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 按现代中文圣经传统以“耶和华”呈现四字神名，使普通读者能辨识这是以色列之神的专名，而非一般称号。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且能明确标示专名的“耶和华”；“雅威”是较接近学界重构发音的另一种译法，但原始读音并非完全确定。
- issue: 恶人“膀臂”被折断的意象
  choice: 正文保留“膀臂”
  alternative: 译作“力量”或“权势”
  rationale: 原文使用具体身体意象，可能借喻恶人的力量或权势。保留意象可避免把诗句的隐喻含义限定为单一解释，并用脚注说明其可能所指。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。句式保留两分句的因果与对比结构；“膀臂”略带诗性，用以保存希伯来文的具体意象，脚注则帮助普通读者理解其转喻意义。
