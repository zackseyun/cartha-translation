  text: וּֽ֭/פֹשְׁעִים נִשְׁמְד֣וּ יַחְדָּ֑ו אַחֲרִ֖ית רְשָׁעִ֣ים נִכְרָֽתָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/038.yaml
  text: But transgressors are destroyed together[a]; the future of the wicked is cut off.
translation:
  language: zh_hans
  text: 但悖逆的人必一同灭亡；恶人的前途必被断绝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “前途”或译“结局”；希伯来语 אַחֲרִית 可指未来、结局或末后。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֹשְׁעִים
  choice: 但悖逆的人
  rationale: פֹשְׁעִים 指反叛、违逆或越界的人；“悖逆的人”保留其主动反叛的意味。前缀 וּ 按上下文译为“但”，突出与前文义人结局的对比。
- source_word: נִשְׁמְדוּ
  choice: 必……灭亡
  rationale: שׁמד 的尼法勒形表示被毁灭、灭绝；汉语用“灭亡”自然凝练，也保留审判的严厉性。完成式在诗歌中的确定性语境下以“必”表达。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 该副词可指“一起”或“全都”；“一同”既自然，也保留悖逆者共同遭遇同一结局的画面。
- source_word: אַחֲרִית
  choice: 前途
  rationale: אַחֲרִית 可表示未来、结局、末后或后裔。此处“前途”自然表达恶人最终的指望和走向，同时以脚注保留“结局”这一可行译法。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: “恶人”是诗篇和智慧文学中对 רְשָׁעִים 的简明标准译法，保留其道德类别。
- source_word: נִכְרָתָה
  choice: 必被断绝
  rationale: כרת 的尼法勒形常表示“被剪除、断绝”；“被断绝”保留原文的司法性意象，并与“前途”搭配自然。
theological_decisions:
- issue: 审判语境中 אַחֲרִית 的含义
  choice: 恶人的前途必被断绝
  alternative: 恶人的结局必被断绝；恶人的后裔必被断绝
  rationale: 该词可指未来、最终结局或后裔。上下文着重对比义人与恶人的归宿，因此正文采用“前途”，避免把含义限定为后裔；脚注保留“结局”，以呈现原文真实的词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达；两分句保持平行结构。“悖逆的人”比单纯“罪人”更贴近 פֹשְׁעִים 的反叛意味。
