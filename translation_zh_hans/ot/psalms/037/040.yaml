  text: וַֽ/יַּעְזְרֵ֥/ם יְהוָ֗ה וַֽ/יְפַ֫לְּטֵ֥/ם יְפַלְּטֵ֣/ם מֵ֭/רְשָׁעִים וְ/יוֹשִׁיעֵ֑/ם כִּי חָ֥סוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/040.yaml
  text: Yahweh helps them and delivers them[a]; he delivers them from the wicked and saves them[b], because they take refuge in him.
translation:
  language: zh_hans
  text: 雅威帮助他们，解救他们[a]；他解救他们脱离恶人，拯救他们，因为他们投靠他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “解救”也可译作“搭救”。希伯来文连续两次使用同一个解救动词，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: “投靠他”也可译作“信靠他”；希伯来文更具体地描写到他那里寻求庇护。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，而不以“主”这一称号代替；“雅威”是现代汉语中对该名称的通行音译之一。
- source_word: וַיַּעְזְרֵם
  choice: 帮助他们
  rationale: עזר表示帮助、援助；汉语不强加时态，以适合诗篇总结性的陈述。
- source_word: וַיְפַלְּטֵם / יְפַלְּטֵם
  choice: 解救他们；他解救他们
  rationale: 两处都源于פלט，表示使人脱险、解救；保留原文紧接的重复，以传达强调作用。
- source_word: מֵרְשָׁעִים
  choice: 脱离恶人
  rationale: רְשָׁעִים是复数名词化形容词，指邪恶之人；“恶人”在现代汉语中可自然表达这一群体，不添加原文没有的性别信息。
- source_word: וְיוֹשִׁיעֵם
  choice: 拯救他们
  rationale: ישׁע具有拯救、使脱离危难的宽广含义；“拯救”既自然，也保留该词在诗篇中的神学分量。
- source_word: כִּי
  choice: 因为
  rationale: 此处自然引出雅威施行拯救的原因。
- source_word: חָסוּ בוֹ
  choice: 他们投靠他
  rationale: חסה的基本意象是到某处寻求庇护；“投靠”在汉语中兼具寻求保护和信赖的含义，比单译为“信靠”更能保留避难意象。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名；采用音译可保留其作为以色列上帝专名的性质，而不以称号替代。
- issue: 是否保留相邻两次出现的פלט
  choice: 保留为“解救他们；他解救他们”
  alternative: 合并为一次“解救他们”
  rationale: 原文重复同一动词以加强语势；保留重复可避免抹平诗句的强调，同时不额外解释两次解救为不同事件。
- issue: חָסוּ בוֹ的庇护与信赖含义
  choice: 他们投靠他
  alternative: 他们信靠他
  rationale: 选择保留寻求庇护的具体意象，同时让其中蕴含的信赖关系保持可感，不把词义缩减为抽象的内在相信。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文重复的诗歌语势；不用“恶人们”等生硬复数形式，也不添加原文未明说的性别。
