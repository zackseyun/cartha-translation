  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֗וֹב וּ/שְׁכֹ֥ן לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/027.yaml
  text: Turn away from evil and do good[a], and dwell forever.
translation:
  language: zh_hans
  text: 要远离恶，行善，并永远居住[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按本诗反复出现的主题理解为：“并永远住在这地。”也可译为：“并永远安稳度日。”这里的希伯来文没有明确说“在这地”。
    reason: 说明诗篇上下文所支持的补足读法及较宽泛的理解，同时明确地点宾语并未出现在本节希伯来文中。
lexical_decisions:
- source_word: סוּר
  choice: 离开
  rationale: 该命令式动词表示转离、离开。中文“离开恶”简洁自然，并保留主动拒绝恶的伦理意味。
- source_word: מֵרָע
  choice: 恶
  rationale: 介词 מִן 表示所离开的对象；在本节伦理语境中，רַע 译为“恶”最贴切。
- source_word: וַעֲשֵׂה טוֹב
  choice: 行善
  rationale: 这是命令式动词与名词化形容词的组合。“行善”是现代汉语中自然、凝练的表达，也与前句“离开恶”形成对称。
- source_word: וּשְׁכֹן
  choice: 并且安居
  rationale: 该动词通常指居住、定居。“安居”保留稳定居住的意象；“并且”明确承接原文的连接词而不改变命令语气。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: עוֹלָם 在这里表示长久或无尽的延续；“永远”是自然且标准的对应表达，同时保留原文的简洁。
theological_decisions:
- issue: וּשְׁכֹן לְעוֹלָם 所表达的劝勉或应许
  choice: 译作“并且永远安居”，不在正文补出地点宾语。
  alternative: “就必永远安居”；“永远安居在这地”；“永远安稳度日”
  rationale: 希伯来文保持命令式序列，且本节没有明说“在这地”。诗篇37篇反复谈到承受并居住在地上，因此可从上下文理解为“永远安居在这地”；也有人按较宽泛的意义理解为永久安稳生活。正文不补足原文省略的信息，以保留其简练与歧义，并在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“离开恶，行善”简明有力；“安居”比单纯“居住”更能传达定居、持续居留的意象，但未扩写为明确的结果应许。脚注标记[a]置于“行善”之后，以与所给审校层的位置一致；脚注内容实际说明后续整句的歧义。
