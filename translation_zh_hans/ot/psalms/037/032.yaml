  yaml_path: translation/ot/psalms/037/032.yaml
  text: The wicked watches the righteous and seeks to put him to death[a][b].
translation:
  language: zh_hans
  text: 恶人窥伺义人[a]，想要置他于死地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“监视义人”，或“埋伏等候义人”。这里的希伯来语动词可指观看或守候；在本节语境中含有恶意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“要杀他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צוֹפֶה
  choice: 窥伺
  rationale: 该分词基本义是观看、守望；在本节敌对语境中带有监视并伺机加害的意味。“窥伺”自然地表达这种恶意，同时未具体添加原文没有明说的行动方式。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 单数形容词名词化，指一个恶人，也具有代表性；现代汉语以“恶人”表达简洁自然。
- source_word: לַצַּדִּיק
  choice: 义人
  rationale: 保留诗篇中“恶人”与“义人”的伦理对照，也是现代中文圣经语体中清楚而凝练的表达。
- source_word: וּמְבַקֵּשׁ
  choice: 想要
  rationale: בקש 在此表示寻求达成或企图实施杀害。“想要”准确传达其敌对意图，且符合现代汉语表达。
- source_word: לַהֲמִיתוֹ
  choice: 置他于死地
  rationale: מות 的使役式不定词意为使其死亡。“置他于死地”保留使役意味和庄重力度；脚注列出更直接的译法。
- source_word: וּ
  choice: ，
  rationale: 希伯来语连词连接两个并列分词动作。中文以逗号顺接更自然，语义上的并列关系仍然清楚。
theological_decisions: []
