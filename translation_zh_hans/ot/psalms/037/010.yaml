  yaml_path: translation/ot/psalms/037/010.yaml
  text: Yet a little while[a], and the wicked will be no more; though you look carefully at his place, he will not be there.
translation:
  language: zh_hans
  text: 再过片刻，恶人[a]就不复存在；即使你细察他的所在之处，他也不在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶人”在希伯来文中为阳性单数，可代表一类人，也可作泛指理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד מְעַט
  choice: 再过片刻
  rationale: 这是表示短暂时间的习语；“再过片刻”自然地表达面向将来的“还有一点时候”。
- source_word: וְאֵין רָשָׁע
  choice: 恶人就不复存在
  rationale: 存在否定词置于面向将来的语境中，表示恶人将不再存在或出现；“不复存在”保留原文庄重而明确的语气。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 希伯来文阳性单数在此作名词用，可指一个具有代表性的恶人，也可作泛指或集合性理解；汉语“恶人”自然保留这种开放性。
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: 即使你细察
  rationale: 该词形表达专注观察或仔细考察；结合上下文，译作“即使”可体现语境中的让步关系，但不把观察弱化为随意一看。
- source_word: עַל מְקוֹמוֹ
  choice: 他的住处
  rationale: מָקוֹם 是其所在之处；“住处”保留具体地点的图像，也符合细察恶人原先所在之地的语境。
- source_word: וְאֵינֶנּוּ
  choice: 他也已经不在那里了
  rationale: 末句再次强调从刚才所说地点消失；“不在那里了”具体呈现缺席，“已经”在汉语中自然表达从查找者视角所发现的结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不复存在”保持诗体力度；“细察他的住处”保留原文由人物转向其所在之地的具体意象。脚注说明希伯来文单数的代表性或泛指功能，避免将其限定为某一个男性个体。
