  text: The wicked plots against the righteous and gnashes his teeth at him[a][b].
translation:
  language: zh_hans
  text: 恶人图谋加害义人，向他咬牙切齿。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “图谋加害”也可译作“算计义人”或“图谋恶事攻击义人”。
    reason: lexical_alternative
  - marker: b
    text: “咬牙切齿”是表达愤怒和敌意的惯用语。
    reason: cultural_note
lexical_decisions:
- source_word: זֹמֵם
  choice: 图谋害
  rationale: 该分词表示谋划、算计，在本句中带明显敌意。“图谋害”用现代汉语自然表达其恶意指向，同时不把具体手段说得过实。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词在此作名词，指邪恶的人；“恶人”简洁、庄重，也符合诗篇和智慧文学的表达。
- source_word: לַצַּדִּיק
  choice: 义人
  rationale: 介词在此标示敌意所针对的对象；汉语借助前面的“图谋害”自然表达“针对义人”的关系，无须另译“反对”。
- source_word: חֹרֵק
  choice: 咬牙切齿
  rationale: 该动词与“牙齿”构成表达愤怒和敌意的动作；“咬牙切齿”是现代汉语中最自然、力度相当的对应说法。
- source_word: עָלָיו
  choice: 向他
  rationale: 表示咬牙切齿这一敌对动作所朝向的对象；“向他”保留动作的指向性。
- source_word: שִׁנָּיו
  choice: 牙齿（融入“咬牙切齿”）
  rationale: 原文是“他的牙齿”；汉语固定表达“咬牙切齿”已明确包含牙齿意象，若另加“他的牙齿”会显得累赘。
