  text: קַוֵּ֤ה אֶל יְהוָ֨ה וּ/שְׁמֹ֬ר דַּרְכּ֗/וֹ וִֽ֭/ירוֹמִמְ/ךָ לָ/רֶ֣שֶׁת אָ֑רֶץ בְּ/הִכָּרֵ֖ת רְשָׁעִ֣ים תִּרְאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/034.yaml
  text: Wait for Yahweh and keep his way[a], and he will exalt you to inherit the land; when the wicked are cut off[c][b], you will see it.
translation:
  language: zh_hans
  text: 要等候[a]雅威，谨守他的道；他必高举你，使你承受土地[b][c]。恶人被剪除时，你必看见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候”也可译作“仰望”或“期待”。原文表示怀着信赖和盼望耐心等候。
    reason: lexical_alternative
  - marker: b
    text: “土地”也可译作“大地”。希伯来语 אָרֶץ 既可指土地或特定地域，也可指大地；这里按本诗反复出现的产业承受用语译作“土地”。
    reason: alternative_reading
  - marker: c
    text: 参马太福音5:5；那里也应许温柔的人将承受地土／大地。
    reason: cross_reference
lexical_decisions:
- source_word: קַוֵּה אֶל
  choice: 等候
  rationale: קוה 与 אֶל 连用，表达怀着信赖与期待耐心等候；“等候”在现代汉语中简洁自然，并保留耐心和盼望两方面的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，而不以称号代替这个专名。
- source_word: וּשְׁמֹר דַּרְכּוֹ
  choice: 谨守他的道
  rationale: שׁמר 可指守住、遵守；“谨守他的道”既保留原文“道”的意象，也自然表达忠实遵行。
- source_word: וִירוֹמִמְךָ
  choice: 他必高举你
  rationale: רום 的使役形表示使人升高；“高举”符合诗歌语体，也保留蒙伸冤、得尊荣的意味。
- source_word: לָרֶשֶׁת אָרֶץ
  choice: 使你承受这地
  rationale: ירשׁ 在此可表示承受或取得产业；“承受”保留产业与应许的语感。אָרֶץ 可指土地、那地或大地，正文依诗篇37篇反复出现的承受土地主题译为“这地”，并以脚注保留另一可能。
- source_word: בְּהִכָּרֵת רְשָׁעִים
  choice: 恶人被剪除时
  rationale: בְּ 加上 כרת 的被动不定式构成时间情状。“被剪除”保留希伯来语带有审判意味的形象，没有泛化为“被毁灭”。
- source_word: תִּרְאֶה
  choice: 你必看见
  rationale: 原文只说“你必看见”，未明说宾语；中文正文同样不补出宾语，让上下文自然指向恶人被剪除一事。
theological_decisions:
- issue: 在圣约—智慧文学语境中如何翻译 אָרֶץ
  choice: 这地
  alternative: 大地／全地
  rationale: 诗篇37篇多次使用承受 אָרֶץ 的应许语言，“这地”较能保留其旧约土地产业背景；但该词也可指大地，因此以脚注保留更广的读法，不排除其后续正典呼应。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“谨守他的道”“被剪除”保留原文意象；句式简洁，对应希伯来诗句的劝勉、应许与审判三层推进。
