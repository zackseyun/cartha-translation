  text: תּוֹרַ֣ת אֱלֹהָ֣י/ו בְּ/לִבּ֑/וֹ לֹ֖א תִמְעַ֣ד אֲשֻׁרָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/031.yaml
  text: The law of his God is in his heart[a]; his steps do not slip.
translation:
  language: zh_hans
  text: 他的上帝的律法在他心里[a]；他的脚步不会滑跌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“训诲”。本句后半也可译作：“他的脚步不至失足。”
    reason: 保留תּוֹרָה及מעד在本语境中的词义选择。
lexical_decisions:
- source_word: תּוֹרַת
  choice: 律法
  rationale: תּוֹרָה可指教导、训诲或律法；在本智慧诗及上帝权威旨意的语境中，“律法”保留其规范性与圣约色彩，同时以脚注注明较宽泛的译法。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 名词带第三人称阳性单数后缀，直接表达“他的上帝”，保留个人与上帝的关系。
- source_word: בְּלִבּוֹ
  choice: 在他心里
  rationale: 介词בְּ加“心”表示内在存留；希伯来语的“心”涵盖思想、意志和内在生命，现代汉语“在他心里”自然且准确。
- source_word: לֹא תִמְעַד
  choice: 不会滑跌
  rationale: מעד可指滑倒、失足或动摇；主语为“脚步”，译作“滑跌”保留行走稳固的意象。未完成式在此表达义人的一般性稳固，故用“不会”。
- source_word: אֲשֻׁרָיו
  choice: 他的脚步
  rationale: 该复数名词指脚步或步履，也隐喻人生道路；“他的脚步”简洁自然，并保留原文意象。
theological_decisions:
- issue: 智慧诗语境中תּוֹרָה的含义
  choice: 律法
  alternative: 训诲／教导
  rationale: 本节所说的是义人内化上帝权威性的指引。“律法”保留其规范性和圣约分量，但原词语义范围更广，故在脚注中保留“训诲”这一可能译法。
- issue: לֹא תִמְעַד的时间与语气
  choice: 不会滑跌
  alternative: 不滑跌／不至失足
  rationale: 希伯来语未完成式在格言式陈述中可表达通常状况或结果。译作“不会”符合上下文，但不把它扩展为脱离诗歌意象的绝对无罪或永不受苦之说。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“上帝”与“律法”保持常见圣经用语；“滑跌”与“脚步”搭配，保留原文关于行路稳固的诗歌意象。
