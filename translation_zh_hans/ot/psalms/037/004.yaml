base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/004.yaml
  text: Delight yourself in Yahweh[a], and he will give you the desires of your heart.
translation:
  language: zh_hans
  text: 你要以雅威为乐；他就会赐给你心中所愿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你心中所求的事。”希伯来语这个名词既可指内心所愿，也可指所求或请求。
    reason: 词义存在真实的两种侧重；脚注保留“所求、请求”的可能，正文采用符合上下文和现代汉语的“心中所愿”。
lexical_decisions:
- source_word: הִתְעַנַּג
  choice: 以……为乐
  rationale: 该词是Hitpael命令式，表达主动从某对象获得喜悦、以之为乐；此译法自然简洁，并保留劝勉语气。
- source_word: עַל
  choice: 以
  rationale: 此处若直译为“在……之上”不合现代汉语习惯；与“为乐”搭配译作“以……为乐”，准确表达希伯来语的关系性用法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用上帝的专名四字神名；采用现代汉语中常见的音译“雅威”，不以称号替代专名。
- source_word: יִתֶּן
  choice: 他就会……赐给你
  rationale: 连接词加未完成式在此劝勉与智慧诗语境中自然表示随后的结果或应许；“就会”清楚呈现这一关系，同时不额外添加条件。
- source_word: מִשְׁאֲלֹת
  choice: 愿望
  rationale: 该复数名词既可指内心所愿，也可指提出的请求；与“你的心”连用时，“愿望”最符合自然汉语，另在脚注保留“所求的”这一词义可能。
- source_word: לִבֶּךָ
  choice: 你心中的
  rationale: 希伯来语“心”涵盖人的意愿、渴望和内在生命；直译为“心”即可，无须在正文中作解释性扩充。
theological_decisions:
- issue: 此应许可能被理解为无条件满足个人欲望
  choice: 按照原文直接陈述“他就会把你心中的愿望赐给你”
  alternative: 在正文中限定为“合他心意的愿望”，或解释为“他会改变并成全你的愿望”
  rationale: 原文没有明说这些限定或过程。译文应保留智慧诗应许本身的力度及其可能产生的神学张力，不把解释加入正文。
- issue: 神名的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名יהוה。译作“雅威”保留其专名性质，而不是以“主”这一称号代替。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你要……他就会……”保持诗歌劝勉与应许的简洁结构；不增添原文没有的神学限定。
