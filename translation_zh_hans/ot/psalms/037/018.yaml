  text: יוֹדֵ֣עַ יְ֭הוָה יְמֵ֣י תְמִימִ֑ם וְ֝/נַחֲלָתָ֗/ם לְ/עוֹלָ֥ם תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/018.yaml
  text: Yahweh knows the days of the blameless[b][a], and their inheritance will be forever.
translation:
  language: zh_hans
  text: 雅威知道纯全的人的年日[a]；他们的产业必永远存在[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纯全的人”也可译作“正直的人”或“全心全意的人”；这里并不一定指绝对无罪的人。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他们的产业将永远存在”。这句话可能表示他们将长久拥有产业，也可能强调产业的恒久稳固。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现上帝的专名，不用“耶和华”或“主”替代。
- source_word: יוֹדֵעַ
  choice: 知道
  rationale: 直接保留 ידע 所表达的持续、关切性的认识，不把其含义扩展为“看顾”或“认可”。
- source_word: יְמֵי
  choice: 年日
  rationale: 原文直译为“日子”；“年日”是自然而庄重的汉语圣经表达，可指一生的时日，同时保留原文意象。
- source_word: תְמִימִם
  choice: 纯全人
  rationale: 表达完整、正直、无可指摘的品格，而不暗示绝对无罪；“纯全人”也适合诗篇中义人与恶人的智慧文学对照。
- source_word: נַחֲלָתָם
  choice: 他们的产业
  rationale: “产业”兼顾承受之业、分得之地与盟约背景，比单纯的“财产”涵盖面更广。
- source_word: לְעוֹלָם
  choice: 到永远
  rationale: 准确表达持续无尽的时间范围，并符合现代汉语习惯。
- source_word: תִּהְיֶה
  choice: 必存
  rationale: 在汉语中自然表达将来的持续存在；“存”并未限定产业以何种方式长存。
theological_decisions:
- issue: “纯全人”的含义
  choice: 指品格完整、行事正直的人，并非断言其绝对无罪。
  alternative: “正直人”或“全心的人”
  rationale: תְמִימִם 强调完整和无可指摘；译文保留智慧文学中的道德评价，同时不加入原文没有明说的无罪论断。
- issue: 雅威“知道”的含义
  choice: 保留为“知道”，容许其中含有关切、眷顾的意味。
  alternative: “看顾”或“留意”
  rationale: 上下文可能赋予该词关系性和盟约性的深意，但原文用的是“知道”，不宜在正文中把隐含意义改写成更明确的神学解释。
- issue: 产业“到永远”的含义
  choice: 直译为“产业必存到永远”，保留其可指恒久拥有或永久稳固的开放性。
  alternative: “他们必永远拥有产业”
  rationale: 原文陈述产业将永远存在，没有明确说明重点是所有权、享用还是产业本身的长存，因此不在正文中消除这种张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“年日”“产业”保留诗歌和盟约语境的质感；分号呈现两个平行分句。脚注标记分别紧随其所解释的词语或分句。
