  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י רְשָׁעִ֨ים יֹאבֵ֗דוּ וְ/אֹיְבֵ֣י יְ֭הוָה כִּ/יקַ֣ר כָּרִ֑ים כָּל֖וּ בֶ/עָשָׁ֣ן כָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/020.yaml
  text: For the wicked will perish[a], and the enemies of Yahweh are like the glory of the pastures; they vanish—like smoke they vanish away.
translation:
  language: zh_hans
  text: '因为恶人必灭亡；

    雅威的仇敌必像草场的荣美一样消逝[a]；

    他们必如烟消散。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按传统解释译作“像羊羔的脂油一样”。这句希伯来语短语的含义不确定。
    reason: 保留疑难希伯来语短语的传统替代解释。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，表达原因或解释，现代汉语用“因为”自然清楚。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 符合诗篇和智慧文学中的常见用法，指行恶的人，而不只是在法律上被判有罪的人。
- source_word: יֹאבֵדוּ
  choice: 必灭亡
  rationale: 保留动词“灭亡、归于毁灭”的意义，并以“必”体现此处未完成式所表达的确定结局。
- source_word: וְאֹיְבֵי יְהוָה
  choice: 雅威的仇敌
  rationale: 直接表达原文的附属结构，并保留神的专名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代。
- source_word: כִּיקַר כָּרִים
  choice: 好像草场的荣美
  rationale: 该短语疑难；按马所拉文本的元音及诗歌语境，将 יקר 理解为“荣美、华美”，כרים 理解为“草场”。传统的另一种解释在脚注中保留。
- source_word: כָּלוּ
  choice: 必消逝
  rationale: כלה 在这里表示终结、消失；译为“消逝”可与烟的意象自然配合，并保留全然消失的语气。
- source_word: בֶעָשָׁן
  choice: 如烟
  rationale: 将介词 ב 理解为比拟用法，使汉语意象自然，同时与敌人彻底消逝的上下文相合。
- source_word: כָּלוּ
  choice: 消逝
  rationale: 原文重复同一动词以加强语势，译文也重复“消逝”，保留诗歌的强调和节奏。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其作为神专名的性质，避免用称号替代。
- issue: 疑难短语 כִּיקַר כָּרִים 的解释
  choice: 好像草场的荣美
  alternative: 好像羊羔的脂油
  rationale: 所选译法按马所拉文本可将 יקר 取“荣美”，将 כרים 取“草场”，也与随后迅速消逝的意象相连；由于希伯来语短语含义不确定，传统解释以脚注保留，不在正文中暗自排除。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；用分行和重复的“消逝”保留原文的平行结构与强调。脚注标记紧跟其所解释的疑难短语。
