  text: I have seen a wicked[a], ruthless man spreading himself out like a flourishing native tree.
translation:
  language: zh_hans
  text: 我曾见一个强横残暴的恶人，像一棵在本土生长、枝叶青翠的树般舒展。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我看见一个强横残暴的恶人，像一棵青翠茂盛的本土树木般伸展开来。”希伯来语此处的表达较难确定；“树”很可能是原文所隐含的意象。“在本土生长的树”试图表达“本地的／本土生的”这一词义，以及树木因扎根本土而茂盛的形象。
    reason: 词义及隐含意象存在译法选择
lexical_decisions:
- source_word: רָאִיתִי
  choice: 我见过
  rationale: 这是ראה的Qal完成式第一人称单数；“我见过”自然表达诗人回顾亲历之事及其当前意义，同时不排除简单过去时的理解。
- source_word: רָשָׁע
  choice: 凶恶的人
  rationale: 指道德败坏、作恶的人；“凶恶”在本句中自然，并与后面的压迫性形容相协调。
- source_word: עָרִיץ
  choice: 强暴
  rationale: 该词可指强横、残暴、令人畏惧的压迫者；“强暴”保留其权势与暴虐色彩，而不限定为某一种具体暴力行为。
- source_word: וּמִתְעָרֶה
  choice: 伸展繁茂
  rationale: Hitpael分词带有伸展、生长旺盛的动态和一定的反身意味；“伸展繁茂”兼顾枝叶铺展与兴旺的比喻。
- source_word: כְּאֶזְרָח
  choice: 像本地……的树
  rationale: אֶזְרָח通常意为“本地的、本土生的”。诗句很可能省略“树”的意象，指扎根本土而长势旺盛的树；正文补出“树”以使现代汉语比喻完整。
- source_word: רַעֲנָן
  choice: 青翠
  rationale: 表示鲜绿、茂盛而富有生机；“青翠”直接保留树木的视觉意象，也暗含兴旺。
