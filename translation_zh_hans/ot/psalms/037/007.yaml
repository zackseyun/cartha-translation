  text: דּ֤וֹם לַ/יהוָה֮ וְ/הִתְח֪וֹלֵ֫ל ל֥/וֹ אַל תִּ֭תְחַר בְּ/מַצְלִ֣יחַ דַּרְכּ֑/וֹ בְּ֝/אִ֗ישׁ עֹשֶׂ֥ה מְזִמּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/007.yaml
  text: Be still before Yahweh[a], and wait patiently for him; do not burn with anger because of one who prospers in his way[c][b], because of a man who carries out schemes.
translation:
  language: zh_hans
  text: 你当在雅威面前静默[a]，耐心等候他[b]；不要因那行事亨通、施行诡计的人而怒火中烧[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在雅威面前安静无声。”原文动词既可强调安静，也可强调不作声。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“切切等候他”。原文动词可能带有辗转、痛苦而迫切等候的意味。
    reason: lexical_alternative
  - marker: c
    text: 传统常译作“不要焦躁”或“不要心怀不平”；原文更直接地描写怒气发热、燃烧。
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹם
  choice: 静默
  rationale: 该命令式兼有安静、不作声之意；“静默”既保留言语上的沉默，也能表达在神面前安静克制。
- source_word: לַיהוָה
  choice: 在雅威面前
  rationale: 此处介词 ל 与 דום 连用，表达朝向雅威、处于他面前的关系；按专名直接译为“雅威”。
- source_word: וְהִתְחוֹלֵל לוֹ
  choice: 耐心等候他
  rationale: חול 的 Hitpolel 形式可有辗转、战兢或痛苦期待的色彩；在本节劝勉语境中译作“耐心等候”最自然，同时以脚注保留其迫切甚至煎熬的意味。
- source_word: אַל תִּתְחַר
  choice: 不要……怒火中烧／不要……发怒
  rationale: חרה 的基本意象是发热、燃烧，表示怒气被点燃；首处保留火焰隐喻，末处为汉语句式自然地承接为“发怒”。
- source_word: בְּמַצְלִיחַ דַּרְכּוֹ
  choice: 因那道路亨通的人
  rationale: ב 标示引发怒气的对象或缘由；מצליח 为使道路顺利、取得成功者，דרך 保留“道路”这一人生行径的意象。
- source_word: בְּאִישׁ
  choice: 因那……的人
  rationale: איש 为阳性单数，但这里指代表性个体；现代汉语以“人”即可准确表达，不必额外添加性别信息。
- source_word: עֹשֶׂה מְזִמּוֹת
  choice: 施行诡计的人
  rationale: עשה 表示实行、做出，מזמות 指谋划、计策，在此语境带负面意味；“施行诡计”简洁地表达付诸实施的恶谋。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号替代。
- issue: וְהִתְחוֹלֵל 的等候意味
  choice: 耐心等候他
  alternative: 切切等候他／为他辗转不安
  rationale: 语境要求安静信靠，但该动词本身可能含痛苦、迫切的动态色彩；正文采用通顺的劝勉表达，并用脚注保留语义张力。
- issue: 对恶人亨通的反应
  choice: 怒火中烧
  alternative: 焦躁／心怀不平
  rationale: חרה 明确带发热、燃烧及发怒之意；译文不把它弱化为一般忧虑，也不将本节扩展为超出原文的伦理判断。
translation_notes:
  register: 采用现代、庄重且便于诵读的普通话。“静默—耐心等候”形成平行劝勉；后半句重复“不要因……”，以清楚呈现两个介词短语共同受 אַל תתחר 支配。正文保留“道路”与“怒火”意象，脚注说明主要词义歧义。
