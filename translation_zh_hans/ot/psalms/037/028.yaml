source:
  edition: WLC
  text: כִּ֤י יְהוָ֨ה אֹ֘הֵ֤ב מִשְׁפָּ֗ט וְ/לֹא יַעֲזֹ֣ב אֶת חֲ֭סִידָי/ו לְ/עוֹלָ֣ם נִשְׁמָ֑רוּ וְ/זֶ֖רַע רְשָׁעִ֣ים נִכְרָֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/028.yaml
  text: For Yahweh loves justice and does not forsake his faithful ones[a]; they are kept forever[b], but the offspring of the wicked will be cut off.
translation:
  language: zh_hans
  text: 因为雅威喜爱公正，不撇弃他的忠信者[a]；他们永远蒙保守[b]，恶人的后代却必被剪除。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的忠信者”也可译作“他的圣民”、“敬虔的人”或“忠于他的人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文也可更紧密地理解为：“他的忠信者永远蒙保守。”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保存上帝的立约之名，并区别于一般称谓“主”。
- source_word: אֹהֵב
  choice: 喜爱
  rationale: 直接表达 אהב 的爱与悦纳之意，在本句中与“公正”搭配自然。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 此处指合乎正义的秩序与判断；“公正”比单指裁判行为的“审判”更符合语境。
- source_word: יַעֲזֹב
  choice: 撇弃
  rationale: 保留 עזב 所含离弃、不再照顾之意，也符合诗篇的立约和牧养语气。
- source_word: חֲסִידָיו
  choice: 忠于他的人
  rationale: חסיד 与 חסד 的忠诚、虔敬语义相关；此译自然地表达这些人对雅威的忠贞，又避免把词义限缩为后来的技术性宗教称谓。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 准确而自然地表达持续无尽的时间意义。
- source_word: נִשְׁמָרוּ
  choice: 蒙保守
  rationale: שמר 的尼法勒式表达被动意义，即受到看守、保存或保护；“蒙保守”也与前句“不撇弃”呼应。
- source_word: זֶרַע
  choice: 后代
  rationale: זֶרַע 在这里指人的子孙或后裔，而非字面的种子。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 以现代汉语中常见的集合称谓表达复数实体词，保留智慧文学中义人与恶人的对照。
- source_word: נִכְרָת
  choice: 必被剪除
  rationale: 保留 כרת 尼法勒式“被割断、被除去”的形象和司法意味；“必”体现此处未完成式在诗歌宣告中的确定将来意义。
theological_decisions:
- issue: חֲסִידָיו 所指的人及其语义力度
  choice: 译作“忠于他的人”，指以忠诚和虔敬回应雅威的人。
  alternative: 可译作“他的忠信者”、“他的圣民”或“敬虔的人”。
  rationale: 该词与 חסד 的忠诚、慈爱语义有关。正文保留关系性的忠贞含义，同时不把它处理成后期教会语境下的专门身份称号。
- issue: 中间两个分句的关系
  choice: 译作“不撇弃忠于他的人；他们永远蒙保守”，以两个彼此补充的陈述呈现。
  alternative: 也可更紧密地理解为“不撇弃他那些永远蒙保守的忠信者”或“忠于他的人永远蒙保守”。
  rationale: 希伯来语的连续句法容许后一分句补充说明前一分句。分号既保留被动动词的独立陈述，也不排除两句紧密相连的理解。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“雅威”保留专名；“蒙保守”和“被剪除”适度保留诗歌及圣经语体，但普通读者仍容易理解。正文中的[a]、[b]均与脚注对应。
