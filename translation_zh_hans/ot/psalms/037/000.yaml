  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/000.yaml
  text: Of David[a]. Do not fret because of evildoers[b]; do not be envious of those who do wrong.
translation:
  language: zh_hans
  text: 大卫的诗。不要因作恶的人而恼怒[a]；不要嫉妒行不义的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要因作恶的人而焦躁”或“动怒”。希伯来语动词可表示心里发热、激愤或烦恼。
    reason: lexical_alternative
  - marker: b
    text: 或译：“行不公之事的人”或“作恶的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 介词 לְ 可表示作者归属或关联；在诗篇题署中译作“大卫的诗”自然庄重，同时不额外加入原文没有的具体体裁词。
- source_word: אַל תִּתְחַר
  choice: 不要……恼怒
  rationale: חרה 的此种形式可表达心里发热、激愤或烦恼；“恼怒”兼顾情绪上的焦躁与愤慨，且符合现代汉语。
- source_word: בַּמְּרֵעִים
  choice: 因作恶的人
  rationale: 介词 בְּ 在这里表达引发情绪的缘由；מְרֵעִים 指作恶者，译文保留其行为性质。
- source_word: אַל תְּקַנֵּא
  choice: 不要嫉妒
  rationale: קנא 在此语境指因恶人处境而生羡妒；“嫉妒”是直接且自然的对应。
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: 行不义的人
  rationale: עַוְלָה 可指不义、不公或恶行；“行不义的人”保留其道德与公义层面的含义。
theological_decisions:
- issue: 对恶人的情绪禁令
  choice: 保留“恼怒”与“嫉妒”两个并列而有区别的命令
  alternative: 将两者合并解释为“不要因恶人亨通而不平”
  rationale: 希伯来文给出两个不同动词，且没有在本句明说恶人亨通；译文不把后文语境提前写入本句。
- issue: עַוְלָה 的道德含义
  choice: 译作“不义”
  alternative: 译作“坏事”或“不法”
  rationale: “不义”既可涵盖错误行为，也保留与公义相对的神学张力，而不将范围缩窄为违法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大卫的诗”作为简洁题署；正文使用对称句式，保留希伯来诗句的平行结构。脚注标记均置于所解释的词语之后。
