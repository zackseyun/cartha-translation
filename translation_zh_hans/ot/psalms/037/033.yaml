  text: יְ֭הוָה לֹא יַעַזְבֶ֣/נּוּ בְ/יָד֑/וֹ וְ/לֹ֥א יַ֝רְשִׁיעֶ֗/נּוּ בְּ/הִשָּׁפְטֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/033.yaml
  text: Yahweh will not leave him in his hand[c][b][a], nor condemn him when he is judged.
translation:
  language: zh_hans
  text: 耶和华必不把他撇在恶人的手中[a]；他受审判时，耶和华也不判他有罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“撇在他的手中”；“他”指恶人，“在手中”表示处于其权势或控制之下。
    reason: lexical_alternative
  - marker: b
    text: “判他有罪”也可译作“定他的罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中通行的专名音译来呈现四字神名，不用“主”这一称号替代。
- source_word: יַעַזְבֶנּוּ
  choice: 必不把他撇在
  rationale: עזב可表示离开、撇弃或丢下；结合后面的“在……手中”，译为“不把他撇在”既自然，又保留不任其落入对方控制的含义。
- source_word: בְיָדוֹ
  choice: 在恶人的手中
  rationale: 原文直译为“在他的手中”；上文表明这个“他”指恶人。正文补明所指，同时保留“手中”这一表示权势或控制的希伯来语意象。
- source_word: יַרְשִׁיעֶנּוּ
  choice: 不判他有罪
  rationale: רשע的使役形在此具有司法含义，指宣判有罪；“判他有罪”准确而符合现代中文法律语域。
- source_word: בְּהִשָּׁפְטוֹ
  choice: 他受审判时
  rationale: 介词ב加שפט的不定式结构在此表达时间；被动式译法保留了原文未明说审判者或审判场合的特点。
theological_decisions:
- issue: 本节各代词的所指
  choice: 宾语“他”指上下文中的义人，“他的手”中的物主指恶人；正文将后者译明为“恶人的手中”。
  alternative: 完全照字面译为“把他撇在他的手中”，让读者依上下文判断两个“他”分别指谁。
  rationale: 诗篇37篇紧邻语境持续对照恶人与义人。中文若连续使用两个指向不同人物的“他”，容易造成不必要的歧义；补明“恶人”没有增加新的解释，只清楚呈现上下文所指。
- issue: 下半句的司法含义
  choice: 译为“判他有罪”，保留法庭式、司法性的表达。
  alternative: 译为“不算他为恶”或“不使他显为恶人”。
  rationale: 使役形יַרְשִׁיעֶנּוּ与שפט的审判语境共同支持“宣判有罪”的含义；同时不进一步限定这是人间法庭、终末审判或其他特定神学范畴。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“必不……也不……”传达诗句两分句的并列承诺；以分号保留希伯来诗歌的平行结构。正文补出“恶人”以消除中文代词歧义，但脚注保留原文的字面形式。
