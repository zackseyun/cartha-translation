  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/001.yaml
  text: Of David[a]. Do not be provoked by evildoers[b]; do not envy those who do wrong.
translation:
  language: zh_hans
  text: 大卫的诗[a]。不要因作恶的人而恼怒[b]；不要嫉妒行不义的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可理解为“大卫作的”或“献给大卫的”；这里的介词可表示作者、归属或献呈关系。原文没有“诗”字，是按诗题的文体补出。
    reason: textual_ambiguity
  - marker: b
    text: 或译“不要因作恶的人心中烦躁”或“不要向作恶的人动怒”。原文动词可表示内心发热、激动或恼怒。
    reason: lexical_alternative
  - marker: c
    text: “行不义”也可译作“作不公之事”或“行恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: 大卫的诗
  rationale: 介词 לְ 与“大卫”组成诗题，可表示作者、归属或献呈对象。“大卫的诗”符合现代汉语诗篇标题的表达，同时以脚注保留原文关系的开放性；“诗”是按文体补出的。
- source_word: אַל
  choice: 不要
  rationale: אַל 与未完成式连用表示禁止；“不要”是自然、准确的现代汉语表达。
- source_word: תִּתְחַר
  choice: 恼怒
  rationale: חרה 的此处形态表达内心发热、激动或动怒。“恼怒”既保留愤激情绪，也不把程度限定为暴怒。
- source_word: בַּמְּרֵעִים
  choice: 因作恶的人
  rationale: 介词 בְּ 在此可标示引发情绪的对象或缘由；“因……而”自然地表达作恶者是恼怒的缘由。מְרֵעִים 是表示持续或惯常行为的分词，译为“作恶的人”。
- source_word: תְּקַנֵּא
  choice: 嫉妒
  rationale: קנא 可指嫉妒、妒羡或忌恨；本诗语境涉及恶人的景况，“嫉妒”保留了对其所有或境遇产生妒羡的含义。
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: 行不义的人
  rationale: עֹשֵׂי 是“行、做”的分词；עַוְלָה 可指不义、不公或邪恶。“行不义的人”简洁庄重，并保留行为性与道德、社会层面的宽度。
theological_decisions:
- issue: 诗题 לְדָוִד 与大卫的关系
  choice: 正文译“大卫的诗”，脚注说明其开放性
  alternative: “大卫作的诗”或“献给大卫的诗”
  rationale: 原文介词结构本身不能单独确定作者身份或献呈关系，因此不在正文中把其中一种解释定为唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作恶的人”与“行不义的人”保留希伯来文两组分词结构的平行关系；分号呈现两个禁令之间的诗行对应。
