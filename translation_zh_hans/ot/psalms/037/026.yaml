  text: כָּל הַ֭/יּוֹם חוֹנֵ֣ן וּ/מַלְוֶ֑ה וְ֝/זַרְע֗/וֹ לִ/בְרָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/026.yaml
  text: All day long he is gracious and lends[a], and his offspring are a blessing.
translation:
  language: zh_hans
  text: 他终日恩待人，借给人；他的后裔也成为祝福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的后裔也蒙福。”希伯来文直译为“他的后裔为（或作）祝福”。
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 保留“整日”的时间意象，同时在现代汉语中自然地表达持续、惯常的行动。
- source_word: חוֹנֵן
  choice: 恩待人
  rationale: 该分词表示施恩、厚待；“恩待人”既保留核心词义，也与下文借贷给人的具体善举自然衔接。
- source_word: וּמַלְוֶה
  choice: 借给人
  rationale: 此处是使役词形，意为把东西借给别人，而非向人借取；补出“人”使汉语语义明确、行文自然。
- source_word: וְזַרְעוֹ
  choice: 他的后裔
  rationale: זֶרַע在此为集合意义，指其后代；“后裔”比“种子”准确，也比“儿女”更能保留跨代范围。
- source_word: לִבְרָכָה
  choice: 也成为祝福
  rationale: 希伯来文直译为“归于/作为祝福”。“成为祝福”自然表达后裔本身被视为祝福或给人带来祝福，同时不把它改成单纯“蒙福”。
theological_decisions:
- issue: 末句 לִבְרָכָה 的含义
  choice: 他的后裔也成为祝福
  alternative: 他的后裔也蒙福
  rationale: 介词 לְ 与“祝福”连用，较直接地表示“作为祝福”或“成为祝福”，重点在后裔被表述为祝福；“蒙福”则把重点转为后裔接受祝福。正文保留较贴近原文的理解，并以脚注说明另一种可能。
translation_notes:
  register: 采用现代、庄重且易懂的表达。“终日”简洁保留诗体色彩；“恩待人，借给人”呈现两个并列的惯常行动；末句用“成为祝福”保留原文介词结构的方向性与一定含混性。
