base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/015.yaml
  text: Their sword will enter their own heart[a], and their bows will be broken.
translation:
  language: zh_hans
  text: 他们的刀必刺入自己的心[a]；他们的弓必被折断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们各人的心”。希伯来文“心”用单数，却带复数所属词尾，是常见的集合表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבָּם
  choice: 他们的刀
  rationale: חֶרֶב为单数，带第三人称阳性复数词尾；保留集合性单数“刀”，既可指恶人这一群体的兵器，也可作逐一分配理解。
- source_word: תָּבוֹא
  choice: 必刺入
  rationale: בוא的Qal未完成式与阴性单数主语“刀”一致；在“刀”与בְּ加“心”的语境中，译作“刺入”比泛指的“来到”更自然，并保留诗歌中的预告意味。
- source_word: בְלִבָּם
  choice: 自己的心
  rationale: 字面为“在／进入他们的心”；“自己的”明确表达语境中兵器反过来伤及持有者的反身关系。
- source_word: וְקַשְּׁתוֹתָם
  choice: 他们的弓
  rationale: 复数名词带第三人称阳性复数词尾，直译为“他们的弓”，并以分号体现并列诗行。
- source_word: תִּשָּׁבַרְנָה
  choice: 必被折断
  rationale: שבר的Niphal未完成式为阴性复数，表达被动含义；“被折断”直接自然，不额外强化为“粉碎”。
theological_decisions: []
translation_notes:
