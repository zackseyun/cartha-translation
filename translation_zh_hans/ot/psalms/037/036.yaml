base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/036.yaml
  text: But he passed by[a], and behold, he was no more; I sought him, but he could not be found.
translation:
  language: zh_hans
  text: 他却过去了[a]；看哪，他已经不在了！我寻找他，却寻不着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他经过了。”希伯来语动词既可表示“经过”，也可表示“逝去”；这里描写那恶人从眼前消失。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 他却过去了
  rationale: עבר的基本义是“经过、过去”，在此也可能指从眼前消逝。译作“过去了”保留空间上的“经过”与生命或境况上的“逝去”之间的含混，不直接断定他已经死亡；“却”承接上节恶人兴盛与本节突然不见之间的转折。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留הִנֵּה引人注意、突出意外结果的诗性和修辞力量。
- source_word: אֵינֶנּוּ
  choice: 他已经不在了
  rationale: 自然表达其不再出现或不在原处，同时不把该短语解释为灭绝。
- source_word: וָאֲבַקְשֵׁהוּ
  choice: 我寻找他
  rationale: 准确传达בקשׁ的主动寻求之意，语言简洁而庄重。
- source_word: וְלֹא נִמְצָא
  choice: 却寻不着
  rationale: 用现代汉语自然表达“未被找到”的结果；“却”清楚呈现寻找与未找到之间的反差。
theological_decisions:
- issue: 恶人的“不在”是否明确指死亡
  choice: 不明确断定死亡，以“过去了……已经不在了”保留原文的消失意象
  alternative: 译作“死去了”或“消亡了”
  rationale: 原文עבר与איננו可以描述经过、离去或不再可见；上下文强调恶人忽然消失，但本节本身没有使用明确表示死亡的词。
translation_notes:
  register: 采用现代、庄重而简洁的诗体汉语。“看哪”保留原文突显骤变的语气；分号和感叹号呈现由经过到突然不见的节奏。
