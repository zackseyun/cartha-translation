  text: לֹוֶ֣ה רָ֭שָׁע וְ/לֹ֣א יְשַׁלֵּ֑ם וְ֝/צַדִּ֗יק חוֹנֵ֥ן וְ/נוֹתֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/021.yaml
  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
translation:
  language: zh_hans
  text: 恶人借贷，却不偿还；义人却恩待人[a]，并且施与。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩待人”也可译作“施恩”或“慷慨待人”。希伯来文这个词有向人施恩、施惠的意思；其后另有“施与”一词，表示给人。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹוֶה
  choice: 借贷
  rationale: לוה 的 Qal 分词表示借入、借贷；此处用一般性表述，保留智慧文学中格言式的语气。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词在此作名词使用，指具有代表性的恶人；“恶人”自然保留了希伯来文单数类别称谓。
- source_word: לֹא יְשַׁלֵּם
  choice: 不偿还
  rationale: שלם 的 Piel 在借贷语境中指偿还所欠；“偿还”准确而简洁。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该形容词在此作名词使用，与“恶人”形成单数、格言式对照；“义人”也是现代中文圣经语体中清楚而庄重的表达。
- source_word: חוֹנֵן
  choice: 施恩
  rationale: חנן 的 Qal 分词核心意义是向人施恩、施惠；“施恩”保留其恩惠语义，并与下文实际给予的行动相合。
- source_word: וְנוֹתֵן
  choice: 给人
  rationale: נתן 通常意为“给”；希伯来文没有明确说“借给”，因此不把意义收窄为放贷。中文补出宾语“人”，使表达自然，但不限定受惠者。
theological_decisions:
- issue: 智慧文学中阳性单数的代表性对照
  choice: 采用“恶人……义人”的单数类别称谓
  alternative: 恶人们……义人们；一个恶人……一个义人
  rationale: 希伯来文以阳性单数作格言式、代表性的类别称谓。中文“恶人”和“义人”既可保留这种形式，也不必把经文改写为复数。
- issue: 义人的给予是赠与还是借出
  choice: 译作“给人”，不明确限定为借贷
  alternative: 借给人；慷慨施舍
  rationale: 上下文中的“借贷”可能使人把义人的行动理解为慷慨借出，但 נתן 本身只说“给”。译文保留其宽泛含义，避免把一种解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的格言式中文；用分号呈现两类人的鲜明对照。“却”在两个分句中分别突出恶人行为的反常及义人与恶人的反差。
