  text: וְ/הוֹצִ֣יא כָ/א֣וֹר צִדְקֶ֑/ךָ וּ֝/מִשְׁפָּטֶ֗/ךָ כַּֽ/צָּהֳרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/006.yaml
  text: He will bring forth your righteousness like the light[b][a], and your justice like the noonday.
translation:
  language: zh_hans
  text: 他必使你的公义[a]如光显明，使你的公道[b]如正午显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“清白”或“被证明为正”。
    reason: lexical_alternative
  - marker: b
    text: “公道”也可译作“正当诉求”或“案件中的权利”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: 他必使……显明／显现
  rationale: 这是יצא的使役式，表示使某事显露、出现。中文采用“使……显明／显现”，既保留使役意义，也自然衔接本节光明的意象。
- source_word: כָאוֹר
  choice: 如光
  rationale: 前缀כ表示比较，אוֹר意为“光”。“如光”简洁保留诗歌中的明喻和公开可见的意象。
- source_word: צִדְקֶךָ
  choice: 你的公义
  rationale: צדק可指公义、正直或被证明为正。在本节与משפט平行，可能含有使人的正当或清白公开显明之意；正文采用较具词汇透明度的“公义”，另以脚注保留语境中的“清白”含义。
- source_word: וּמִשְׁפָּטֶךָ
  choice: 你的公正
  rationale: משפט可指审判、公正、判定或案件中的正当权益。这里与“公义”平行，重点在于人的正当一面得到显露；“公正”保留核心司法语义，而脚注说明“正当诉求”这一语境可能。
- source_word: כַצָּהֳרָיִם
  choice: 如正午
  rationale: צָהֳרַיִם指正午或中午。“如正午”保留原文简练的比较，也传达毫无遮蔽、清楚明亮的诗意。
theological_decisions:
- issue: 本节是泛指道德公义，还是指受屈者得到申雪
  choice: 正文保留“公义／公正”的宽广表达
  alternative: 译为“清白／正当诉求”，明确强调申雪
  rationale: 上下文支持上帝使义人的正当一面公开显明，但צדק与משפט本身仍有较宽的语义范围。正文不把含义限定为法律上的申雪，脚注则保留该语境解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“如光……如正午”保留希伯来诗歌的平行结构；用“显明／显现”避免中文机械重复，同时没有增添原文之外的具体行动或结果。
