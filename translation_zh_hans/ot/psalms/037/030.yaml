  yaml_path: translation/ot/psalms/037/030.yaml
  text: The mouth of the righteous utters wisdom[b][a], and his tongue speaks justice.
translation:
  language: zh_hans
  text: 义人的口谈论智慧[a]；他的舌头讲说公平[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“默想智慧”或“低声说出智慧”。希伯来语动词可指低声言说或沉思；但这里与“舌头讲说”平行，较可能是指说出口来。
    reason: lexical_alternative
  - marker: b
    text: 或译“审判”“判断”或“正当之事”。希伯来语词可指公平、司法裁决或合宜正确的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי צַדִּיק
  choice: 义人的口
  rationale: 保留希伯来文“口”的转喻和与下句“舌头”的诗歌对应；צַדִּיק是阳性单数实体化形容词，但汉语“义人”自然且不必添加原文没有的“男人”。
- source_word: יֶהְגֶּה
  choice: 吐露
  rationale: הגה可指低声念说、喃喃自语或默想；本句以“口”为主语，又与“舌头讲说”平行，语境更偏向发声表达。“吐露”兼顾出声和经过思量的意味。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是חָכְמָה在智慧诗歌中的常规、自然对应词。
- source_word: וּלְשׁוֹנוֹ
  choice: 他的舌头
  rationale: 直译身体部位意象，并保留与“口”的平行结构。
- source_word: תְּדַבֵּר
  choice: 讲说
  rationale: דבר的Piel形式在此表示说出、讲论；“讲说”庄重自然，也与上句“吐露”有所变化。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: מִשְׁפָּט语义可涵盖公正、审判、判决及合宜之事；在描述义人言语的智慧语境中，“公正”最自然，同时以脚注保留其他可能。
theological_decisions:
- issue: 智慧诗歌中阳性单数“义人”的表达
  choice: 义人
  alternative: 义人男子／公义的人
  rationale: 希伯来文为语法上的阳性单数，描写一个典型的义者；现代汉语“义人”可自然保留单数类称意味，并不需要加入原文未明说的“男子”。
- issue: מִשְׁפָּט的伦理与司法含义
  choice: 公正
  alternative: 审判／判断／正当之事
  rationale: 不把该词限定为法庭判决；正文采用符合本节智慧语境的“公正”，脚注则保留其司法和判断层面的真实多义性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；以分号呈现两个紧密平行的分句。“吐露智慧／讲说公正”保留原文口与舌的身体意象、同义平行及词义张力。
