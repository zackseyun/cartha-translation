  text: Better is a little that belongs to the righteous than the abundance of many wicked people[a][b].
translation:
  language: zh_hans
  text: 义人所拥有的一点，胜过许多恶人的丰盛[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人所得的一点，胜过恶人的丰盛。”希伯来文是省略式表达，“拥有”或“所得”的意思是由上下文补出的。
    reason: lexical_alternative
  - marker: b
    text: “许多”也可理解为与恶人的丰盛或所有之物相联，而非指恶人的人数。
    reason: source_ambiguity
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 在这一比较式箴言中表示“更好”；用“胜过”自然呈现比较关系，也保留凝练语气。
- source_word: מְעַט
  choice: 虽少
  rationale: 表示数量不多；与后文“丰盛”构成鲜明对照。
- source_word: לַצַּדִּיק
  choice: 义人拥有的
  rationale: 前缀 ל 在此省略式结构中可表达归属；译文补出“拥有的”，使现代汉语清楚自然，同时保留单数集合意义。
- source_word: מֵהֲמוֹן
  choice: 胜过……的丰盛
  rationale: הָמוֹן 可指丰富、大量或众多；“丰盛”比“财富”范围更宽，不把含义限定为金钱财物。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 实词化的复数形容词，指作恶的人；现代汉语用“恶人”简洁而庄重。
- source_word: רַבִּים
  choice: 许多
  rationale: 最自然地修饰复数的“恶人”，即“许多恶人”；另一个可能理解在脚注中说明。
