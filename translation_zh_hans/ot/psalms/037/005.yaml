  yaml_path: translation/ot/psalms/037/005.yaml
  text: Commit your way to Yahweh[a]; trust in him[b], and he will act.
translation:
  language: zh_hans
  text: 你要把你的道路交托给雅威[a]，并信靠他；他必行事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“把你的道路滚在雅威身上”；这是把自己的人生道路托付给他的表达。
    reason: lexical_alternative
  - marker: b
    text: 或译“他必成就”或“他必使之成就”。希伯来文只说“他必做／行事”，没有明说宾语。
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹל
  choice: 交托
  rationale: 该祈使式字面为“滚”，但与“在……之上”和“你的道路”连用时，是把自己的人生道路托付给雅威的习语。“交托”自然保留了托付与倚靠之意。
- source_word: עַל
  choice: 给
  rationale: 原义为“在……之上”；与中文“交托”搭配时用“给”较自然，原有的形象在脚注中说明。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，以保留经文中的专名，而不以称号代替。
- source_word: דַּרְכֶּךָ
  choice: 你的道路
  rationale: “道路”既直接对应原词，也能在诗歌和智慧文学语境中表示人的人生方向、行事方式或历程。
- source_word: וּבְטַח
  choice: 要信靠
  rationale: 准确表达祈使语气和对雅威的个人倚赖；“信靠”在现代汉语中清楚而庄重。
- source_word: עָלָיו
  choice: 他
  rationale: 希伯来语字面有“倚在他之上”的意味；中文“信靠他”已自然表达这种倚赖关系。
- source_word: וְהוּא
  choice: 他必
  rationale: 独立代词强调行动者是雅威；中文以“他必”兼顾主语强调和后续应许的语气。
- source_word: יַעֲשֶׂה
  choice: 有所作为
  rationale: 原动词范围宽泛，可指“做、施行、行动”，且没有明说宾语。“有所作为”在中文中自然，并避免擅自补出具体对象。
theological_decisions:
- issue: 如何译 יְהוָה 这一神名
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”音译，保留其作为以色列之神专名的性质，而不改成称号。
- issue: 是否为 יַעֲשֶׂה 补出隐含宾语
  choice: 以“他必有所作为”保留开放性
  alternative: 他必成全这事；他必使之成就
  rationale: 希伯来文没有明说行动的对象。保留开放表达，可避免把应许具体化到原文没有明确陈述的程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“当”保留诗歌式劝勉语气；“交托”自然传达原文习语，脚注保留“滚到……之上”的具体意象；末句避免补出原文未明说的行动对象。
