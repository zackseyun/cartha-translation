  text: כִּֽי יִפֹּ֥ל לֹֽא יוּטָ֑ל כִּֽי יְ֝הוָ֗ה סוֹמֵ֥ךְ יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/024.yaml
  text: Though he falls[a], he will not be hurled down[b], for Yahweh holds his hand.
translation:
  language: zh_hans
  text: 他虽跌倒[a]，也不会被抛倒[b]，因为耶和华扶着他的手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虽”也可译作“因为”“如果”或“即使”；这里的希伯来语连接词须按上下文确定其关系。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“也不至倒地不起”。
    reason: interpretive_alternative
lexical_decisions:
- source_word: כִּי
  choice: 虽
  rationale: 首个כִּי在上下文中可表达让步关系：义人即使跌倒，也不会就此被摔倒；“虽”在现代汉语中自然地保留了这种转折张力。
- source_word: יִפֹּל
  choice: 跌倒
  rationale: נפל的基本义为“倒下、跌倒”。这里不限定为犯罪、背道或身体遇险，保留其可指各种挫败的宽泛比喻意义。
- source_word: יוּטָל
  choice: 被摔倒
  rationale: טול的使役被动式表示“被扔下、被摔倒”。采用被动表达，并与前面的主动“跌倒”相区别；不擅自加入“彻底”或“永远”等原文未明说的限定。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文中通行且可辨识的形式音译四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: סוֹמֵךְ
  choice: 扶着
  rationale: סמך表示支撑、扶持；分词形式体现持续的行动。“扶着”既符合“手”作宾语的句法，也符合自然汉语搭配。
- source_word: יָדוֹ
  choice: 他的手
  rationale: 原文明确为“他的手”，即耶和华扶着前述之人的手；直译可保留牵扶跌倒者的具体意象。
theological_decisions:
- issue: “跌倒”的比喻范围
  choice: 泛指义人所遭遇的挫折或倒下，不限定其性质
  alternative: 专指犯罪或属灵失败；或仅指身体危险
  rationale: 希伯来文没有说明跌倒的具体种类。译文保留其开放性，不把经文收窄为某一种带有特定教义意味的解释。
- issue: “不会被摔倒”的程度
  choice: 保留被动的“摔倒”意象，不在正文加入“彻底”或“永不再起”
  alternative: 译作“不会一蹶不振”或“不会倒地不起”
  rationale: 上下文可能含有不至最终覆灭之意，但יוּטָל本身主要表示被扔下或摔倒。正文从原词出发，较强的结果性理解列入脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“跌倒／被摔倒”有意保留原文两个近义而不同的动词及其主动、被动之别；末句用“扶着他的手”，避免生硬的“扶持他的手”，同时保留具体的手部意象。
