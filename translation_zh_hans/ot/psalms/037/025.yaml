source:
  edition: WLC
  text: נַ֤עַר הָיִ֗יתִי גַּם זָ֫קַ֥נְתִּי וְֽ/לֹא רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב וְ֝/זַרְע֗/וֹ מְבַקֶּשׁ לָֽחֶם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/025.yaml
  text: I was young[a], and now I am old[b], yet I have not seen the righteous forsaken or his offspring begging for bread.
translation:
  language: zh_hans
  text: 我曾年幼，如今也已年老，却未曾见过义人被遗弃，也未见他的后裔[b]讨饭吃[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “讨饭吃”也可译作“寻求食物”。原文动词的基本意思是“寻找”或“求取”；此处很可能指为维持生活而乞求食物。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他的种子”，这里指他的后代或子孙。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: 我曾年幼
  rationale: נַעַר在此与系词连用，作表语；译为“年幼”自然地表达人生阶段，并与下文“年老”构成对照。
- source_word: גַּם זָקַנְתִּי
  choice: 如今也已年老
  rationale: גַּם基本义为“也”，在从幼年到老年的回顾中兼有承接意味；“如今也已”既保留“也”，又自然呈现时间进展。זָקַנְתִּי表示已经进入老年。
- source_word: וְלֹא רָאִיתִי
  choice: 却未曾见过
  rationale: 保留第一人称经验性陈述。“却”体现上下文中的轻微转折，“未曾见过”涵盖说话人从年幼到年老的经历。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该阳性单数词在此具有代表性、泛指作用；“义人”是自然且凝练的现代汉语圣经用语，不额外限定性别。
- source_word: נֶעֱזָב
  choice: 被遗弃
  rationale: 该词为עזב的被动形式，表示遭撇下或弃置；“被遗弃”保留其较强的生存与关系层面的分量。
- source_word: וְזַרְעוֹ
  choice: 也未见他的后裔
  rationale: זֶרַע字面为“种子”，用于人时指后代或后裔。补出受前文“未曾见过”支配的“未见”，并以“也”清楚表达两种都未见到的情形。
- source_word: מְבַקֶּשׁ לָחֶם
  choice: 讨饭吃
  rationale: מְבַקֶּשׁ基本义为“寻找、求取”，לֶחֶם为“饼、食物”。在贫乏处境中，“讨饭吃”自然表达为基本口粮求人施舍，同时保留“饭食”的具体意象。
theological_decisions:
- issue: 本节是绝对保证，还是诗人的亲身观察
  choice: 保留“我曾……却未曾见过”的第一人称经验陈述
  alternative: 译成义人及其后代绝不会陷入贫困的普遍、无条件应许
  rationale: 希伯来文明确以说话人从年幼到年老的亲身见闻为框架。译文不把观察性见证强化为超出原文的绝对命题，从而保留本节与现实经验之间的张力。
- issue: צַדִּיק与זַרְעוֹ的数和指代
  choice: 译作单数代表性的“义人”和“他的后裔”
  alternative: 改为复数“义人们和他们的儿女”，或明确译成“义男子”
  rationale: 原文为阳性单数，但具有泛指、代表作用。“义人”在汉语中可自然泛指，而“他的后裔”保留原文单数代词关系，不擅自复数化或强化生理性别。
- issue: 两个所见情形之间的关系
  choice: 译作“未曾见过……也未见……”
  alternative: 只用“和”连接，可能使人误以为原文仅否定两种情形同时发生
  rationale: 第二分句仍受וְלֹא רָאִיתִי支配。重复“未见”明确表示诗人声称两种情形都没有见过，却不改变其观察性表述。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“我曾年幼，如今也已年老”保持诗性对称；“被遗弃”保留原文力度；“讨饭吃”较“乞求饼食”自然易懂。脚注标记均置于其实际说明的词语之后，并纠正英语咨询层中标记位置与脚注内容不相配的问题。
