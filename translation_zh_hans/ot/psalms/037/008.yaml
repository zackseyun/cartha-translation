source:
  edition: WLC
  text: הֶ֣רֶף מֵ֭/אַף וַ/עֲזֹ֣ב חֵמָ֑ה אַל תִּ֝תְחַ֗ר אַךְ לְ/הָרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/008.yaml
  text: Let go of anger[a], and abandon wrath[b]; do not be provoked—it only leads to evil.
translation:
  language: zh_hans
  text: 止住怒气，离弃烈怒；不要气恼[a]，那只会使你作恶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气恼”也可译作“心中焦躁”或“心怀不平”。原词含有情绪发热、激动的意味。
    reason: lexical_alternative
  - marker: b
    text: 末句也可较直译为：“只是为了作恶。”
    reason: alternative_reading
lexical_decisions:
- source_word: הֶרֶף מֵאַף
  choice: 止住怒气
  rationale: הֶרֶף是רפה的祈使式，在这里表示停止、放下；אַף常以“鼻子”的形象指怒气。译作“止住怒气”既保留命令语气，也符合现代汉语表达。
- source_word: וַעֲזֹב חֵמָה
  choice: 离弃烈怒
  rationale: עזב表示离开、弃绝；חֵמָה指炽烈的愤怒。译作“烈怒”既与前面的“怒气”有所区别，也保留希伯来诗句的平行结构。
- source_word: אַל תִּתְחַר
  choice: 不要气恼
  rationale: חרה的此处词形可表达情绪发热、激动或恼怒。“气恼”自然简洁，并保留该词既可指发怒、也可指焦躁不平的语义范围。
- source_word: אַךְ לְהָרֵעַ
  choice: 那只会使你作恶
  rationale: אַךְ具有限定意味；לְ加רעע的不定式可表示目的或结果。正文按上下文译为结果性的警告，同时用脚注保留更贴近形式的目的性读法。
theological_decisions:
- issue: 末句是表达目的还是结果
  choice: 那只会使你作恶
  alternative: 只是为了作恶／只至于作恶
  rationale: לְהָרֵעַ可以紧凑地表示目的或结果。诗篇语境是在警告气恼的后果，因此正文采用自然的结果表达；脚注保留目的性直译，避免消除原文的句法张力。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语。两组命令保持希伯来诗歌的平行感；“怒气／烈怒”体现两个近义词的强度差异。
