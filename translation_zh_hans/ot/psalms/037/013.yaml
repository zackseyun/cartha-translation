  text: אֲדֹנָ֥/י יִשְׂחַק ל֑/וֹ כִּֽי רָ֝אָ֗ה כִּֽי יָבֹ֥א יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/013.yaml
  text: The Lord laughs at him[b][a], for he sees that his day is coming.
translation:
  language: zh_hans
  text: 主笑他[a]，因为主看见他的日子快到了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“嗤笑他”或“讥笑他”；希伯来文直译为“笑他”，在这里的语境中带有嘲讽意味。
    reason: lexical_alternative
  - marker: b
    text: “他的日子”指恶人注定败亡或受审判的日子。
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是指上帝的尊称；“主”是现代中文圣经语体中自然、庄重而准确的对应。
- source_word: יִשְׂחַק
  choice: 笑
  rationale: שׂחק 的基本义是“笑”；上下文使其带有嘲讽意味，但正文保留原词的直译，以免把语气解释得过满。
- source_word: לוֹ
  choice: 他
  rationale: 介词 לֹוֹ 在“笑”这一动词之后标明笑的对象；中文“笑他”自然表达“对着他发笑／嗤笑他”的意思。
- source_word: כִּי
  choice: 因为
  rationale: 第一个 כִּי 引出主发笑的原因。
- source_word: רָאָה
  choice: 看见
  rationale: 保留 ראה 的感知义；完成式在这里表达主已经看清并确知那将临的结局，中文可自然译为“看见”。
- source_word: כִּי
  choice: （所看见的内容）
  rationale: 第二个 כִּי 引出“看见”的内容；中文无需另译“即”，可直接接宾语从句。
- source_word: יָבֹא
  choice: 快到了
  rationale: 该未完成式表示日子将要来到；“快到了”传达其临近感，但不改变未来指向。
- source_word: יוֹמוֹ
  choice: 他的日子
  rationale: 按希伯来文保留简洁而有意涵的表达；其具体所指由诗篇上下文说明。
theological_decisions:
- issue: 上帝发笑的性质
  choice: 正文译作“主笑他”，以语境表达带审判意味的嘲讽
  alternative: 主嗤笑他／主讥笑他
  rationale: 原文动词的基本义是“笑”，而恶人将受审判的上下文赋予它轻蔑、嘲讽的色彩。保留“笑”既忠于词义，也不把神学语气解释得超过原文。
- issue: “他的日子”的所指
  choice: 保留诗性的“他的日子”，脚注说明为恶人败亡或受审判之日
  alternative: 他受审判的日子／他灭亡的日子
  rationale: 原文没有明说“审判”或“灭亡”，虽上下文强烈指向这一含义，正文仍应保存其含蓄与简练。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“主笑他”简洁有力，并保留原文的拟人表达；两个脚注标记均置于其所解释的短语之后。
