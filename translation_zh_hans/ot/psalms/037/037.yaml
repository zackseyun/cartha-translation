  text: שְׁמָר תָּ֭ם וּ/רְאֵ֣ה יָשָׁ֑ר כִּֽי אַחֲרִ֖ית לְ/אִ֣ישׁ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/037.yaml
  text: Observe the blameless[a], and see the upright[c][b], for there is a future for the man of peace.
translation:
  language: zh_hans
  text: 你要留心纯全的人[a]，察看正直的人；因为平安的人必有前途[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留心”也可译作“注意”或“留意”。“纯全的人”指品格完整、正直无可指摘的人，并非指绝对无罪。
    reason: lexical_alternative
  - marker: b
    text: “前途”所译的希伯来语也可指“末后”“结局”或“将来”；有人理解为“后代”。
    reason: lexical_alternative
  - marker: c
    text: “平安的人”也可译作“和平的人”或“和睦的人”；“平安”一词也可包含福祉、完满的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר
  choice: 留心
  rationale: 此处命令式不是“保护”或“遵守”，而是仔细注意、观察某人；“留心”自然地保留了劝诫语气。
- source_word: תָּם
  choice: 纯全的人
  rationale: תָּם表示品格完整、正直无可指摘，并非绝对无罪；“纯全的人”兼顾诗篇语体与现代可懂性。
- source_word: וּרְאֵה
  choice: 察看
  rationale: 作为与שְׁמָר平行的第二个命令，“察看”保留了直接性和诗歌对仗。
- source_word: יָשָׁר
  choice: 正直的人
  rationale: 该词在此作名词性形容词，指品行正直者；“正直的人”准确而自然。
- source_word: כִּי
  choice: 因为
  rationale: 引出前面劝诫的理由；现代汉语用“因为”关系清楚。
- source_word: אַחֲרִית
  choice: 前途
  rationale: 该词可指末后、结局或将来；上下文强调正直者最终仍有正面的盼望，“前途”在汉语中简洁自然，同时以脚注保留其他可能。
- source_word: לְאִישׁ
  choice: 人必有
  rationale: אִישׁ是阳性单数，但在本句智慧文学格言中指一个具有所述品格的人；汉语“人”无需添加原文没有明确表达的性别。介词לְ表明这种前途属于此人。
- source_word: שָׁלוֹם
  choice: 爱好和平
  rationale: שָׁלוֹם在此修饰אִישׁ，可描述与和平相称、以和睦为取向的人；“爱好和平的人”比生硬的“和平之人”自然，并以脚注保留福祉、完满等语义。
theological_decisions:
- issue: אִישׁ的阳性单数在智慧文学格言中的表达
  choice: 人
  alternative: 男人／男子
  rationale: 现代汉语的“人”既能对应单数个体，也不必把语法阳性强化为生理性别；这保留了格言的代表性，而没有否认原文形式。
- issue: אַחֲרִית所指的义人命运
  choice: 必有前途
  alternative: 有结局／有将来／有后代
  rationale: 上下文将正直者的最终景况与恶人的灭绝相对照。“前途”传达正面展望，但不把所指限定为今生成功、终末命运或子孙；其他词义在脚注中注明。
- issue: אִישׁ שָׁלוֹם的关系
  choice: 爱好和平的人
  alternative: 平安的人／享有福祉的人／和平之人
  rationale: 该短语可以侧重人的和平品格，也可能包含福祉、完满的状态。正文采用自然且符合伦理语境的表达，脚注保留较宽语义，避免把它收窄为特定教义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌劝诫语体。“留心／察看”保留两个平行命令；分号呈现前半劝诫与后半理由的结构。正文不刻意复制希伯来语名词短语的生硬形式，并通过脚注保留אַחֲרִית与שָׁלוֹם的真实语义幅度。
