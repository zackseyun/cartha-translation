base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/029.yaml
  text: The righteous will inherit the land and dwell on it forever[a].
translation:
  language: zh_hans
  text: 义人必承受土地，并永远住在其上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地”。希伯来语אֶרֶץ可指“土地”或“大地”；本节正文采用“土地”，以呼应诗篇37篇反复出现的措辞。
    reason: alternative_reading
lexical_decisions:
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词作名词用，指具有公义品格的一类人；“义人”是现代中文圣经语境中自然、庄重且准确的表达。
- source_word: יִירְשׁוּ
  choice: 必承受
  rationale: ירשׁ既可指继承，也可指取得产业；“承受”保留诗篇37篇反复出现的应许和产业意味，“必”则表达未完成式在此语境中的确定将来意义。
- source_word: אָרֶץ
  choice: 那地
  rationale: אֶרֶץ既可指特定的土地，也可指全地或大地。诗篇37篇反复谈到承受土地，故正文采用“那地”，同时用脚注保留“大地”的可能。
- source_word: וְיִשְׁכְּנוּ
  choice: 并……住
  rationale: שׁכן表示居住、定居；“住”是现代中文最自然的表达，并保留安居其上的含义。
- source_word: לָעַד
  choice: 永远
  rationale: 准确传达持续不止、永久的时间意义。
- source_word: עָלֶיהָ
  choice: 在其上
  rationale: 介词עַל加阴性单数后缀回指“地”；“在其上”直接保留原文的空间表达和指代关系。
theological_decisions:
- issue: 应许语境中 אָרֶץ 的范围
  choice: 那地
  alternative: 大地
  rationale: 本诗反复使用承受土地的措辞，正文译作“那地”较能体现篇内连贯性和产业应许的背景；但希伯来词也可能具有更广的“大地”之义，因此以脚注保留这一真实歧义，不作教义性消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“义人”“承受”保留诗歌及应许语体；“在其上”略具书面色彩，但能清楚对应原文，并避免把“地”的范围预先解释为某一特定神学结论。
