  text: וּ/תְשׁוּעַ֣ת צַ֭דִּיקִים מֵ/יְהוָ֑ה מָֽ֝עוּזָּ֗/ם בְּ/עֵ֣ת צָרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/039.yaml
  text: The salvation of the righteous is from Yahweh[c][b][a]; he is their stronghold in a time of trouble.
translation:
  language: zh_hans
  text: 义人的拯救[a]来自雅威[b]；患难时，他是他们的堡垒[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“解救”或“得胜”；原文此词可指救援、脱险或胜利。
    reason: lexical_alternative
  - marker: b
    text: 原文为“YHWH”（四字神名）；传统常译“耶和华”或“上主”。
    reason: alternative_reading
  - marker: c
    text: 或译“避难所”或“坚固保障”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשׁוּעַת
  choice: 拯救
  rationale: תְּשׁוּעָה可指救助、解救或胜利；“拯救”既保留诗篇的神学语域，也适合本节具体脱离患难的语境。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词在此作名词使用，指以公义为特征的一类人；“义人”是自然、庄重且通行的现代汉语圣经用语。
- source_word: מֵיְהוָה
  choice: 来自雅威
  rationale: 介词מִן表示来源；“来自”清楚表达义人的拯救以雅威为源头。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其专名和盟约称谓的性质。
- source_word: מָעוּזָּם
  choice: 他们的堡垒
  rationale: מָעוֹז表示坚固、防护之处或力量的保障；“堡垒”保留原词鲜明的防御意象，词尾后缀译为“他们的”。
- source_word: בְּעֵת צָרָה
  choice: 患难时
  rationale: 简洁自然地表达“在患难的时候”；“患难”兼具困境与痛苦的语义，符合诗歌语体。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；译作“雅威”保留专名性质，而不以称号取代。
- issue: 第二分句无系词名词句的处理
  choice: 患难时，他是他们的堡垒
  alternative: 患难时的堡垒
  rationale: 希伯来文第二分句没有明写系词；汉语补出“是”，并以“他”承接雅威，使句法自然而不增加新的神学内容。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“义人”“患难”保持诗篇的传统语感；“堡垒”呈现原文具体的防御意象。分号对应两句平行陈述，并保留第二句以雅威为主语的自然承接。
