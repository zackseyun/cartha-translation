  text: וַ/עֲנָוִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ֝/הִתְעַנְּג֗וּ עַל רֹ֥ב שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/011.yaml
  text: But the humble will inherit the land and delight themselves in abundant peace[a][b].
translation:
  language: zh_hans
  text: 但谦卑的人[a]必承受这地[b]，并以丰盛的平安为乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“温柔的人”。
    reason: lexical_alternative
  - marker: b
    text: “这地”或译“大地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: 谦卑的人
  rationale: 该词可指卑微、谦卑或温柔的人。“谦卑的人”符合本诗的伦理语境，现代汉语清楚自然；“温柔的人”作为传统且具有经文互文意义的译法列入脚注。
- source_word: יִירְשׁוּ
  choice: 必承受
  rationale: ירשׁ可表示继承、承受或取得产业。“承受”保留其未来指向和产业、应许方面的含义；“必”体现未完成体在此处所表达的确定将来。
- source_word: אָרֶץ
  choice: 这地
  rationale: אֶרֶץ既可指特定的土地，也可泛指大地。本诗多次谈到承受或从地上被剪除，语境较支持“这地”，同时在脚注保留“大地”这一可行译法。
- source_word: וְהִתְעַנְּגוּ
  choice: 并……为乐
  rationale: ענג的Hitpael形式表达享受、欣然以某事为乐。“以……为乐”是自然、庄重的现代汉语，也传达主动沉浸于喜乐中的意味。
- source_word: עַל
  choice: 以
  rationale: 该介词本义范围包括在、于、因或以；与“为乐”搭配时译作“以”最符合汉语习惯，并未排除因丰盛平安而喜乐的语义。
- source_word: רֹב
  choice: 丰盛的
  rationale: רֹב表示丰富、充足或众多。译为“丰盛的”自然地修饰“平安”，并保留充盈有余的含义。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם涵盖和平、安康与完整兴盛。“平安”是简洁而涵义较宽的汉语圣经用语，也适合本节安稳蒙福的语境。
theological_decisions:
- issue: 与马太福音5:5及“温柔的人必承受地土”这一传统译法的互文关系
  choice: 正文按希伯来文本和诗篇语境译作“谦卑的人必承受这地”，脚注保留“温柔的人”和“大地”。
  alternative: 温柔的人必承受大地。
  rationale: 正文优先反映希伯来词语在本诗中的语义，不因后来的熟悉表达而固定其歧义；同时，传统译法在词义和互文上确有根据，因此用脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但”承接上下文的对比；“承受这地”和“以丰盛的平安为乐”保留诗歌的应许语气与平行节奏。
