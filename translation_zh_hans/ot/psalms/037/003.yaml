base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/003.yaml
  text: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
translation:
  language: zh_hans
  text: 要信靠耶和华，行善；住在这地，以信实为粮。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“持守信实”；也可译：“安享保障。”原文的表达较难确定，可能带有吃草、牧养或从信实可靠中得滋养的意象。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח
  choice: 信靠
  rationale: 该命令式表示把信心和倚赖放在某一对象上；“信靠”在现代汉语中自然，并明确对应其后的耶和华。
- source_word: בַּיהוָה
  choice: 耶和华
  rationale: 介词 ב 标明信靠的对象；专名 יהוה 采用现代中文圣经读者熟悉的“耶和华”。
- source_word: וַעֲשֵׂה טוֹב
  choice: 行善
  rationale: 简洁表达“做良善之事”，保留希伯来文命令语气及凝练的智慧文学风格。
- source_word: שְׁכָן אֶרֶץ
  choice: 住在这地
  rationale: שׁכן 意为居住、安居；在本诗反复谈及承受并居住于地的语境中，אֶרֶץ 更适合译作“这地”，而非泛指“地球”。
- source_word: וּרְעֵה
  choice: 以……为粮
  rationale: רעה 的基本语义涉及牧放、吃草或喂养；“以……为粮”保留取食和得滋养的意象，同时在现代汉语中较为可懂。
- source_word: אֱמוּנָה
  choice: 信实
  rationale: אֱמוּנָה 可指坚定、可靠、忠信或安稳；“信实”保留其伦理和关系层面的含义，但不排除“可靠、安稳”的语义色彩。
theological_decisions:
- issue: 神圣名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经传统中最为人熟悉的专名形式，明确保留原文的神圣名，而不以普通称号代替。
- issue: וּרְעֵה אֱמוּנָה 的解释
  choice: 以信实为粮
  alternative: 持守信实；安享保障
  rationale: 原短语含义困难且存在真实歧义。正文保留 רעה 的牧养、取食意象，并将 אֱמוּנָה 译作“信实”；脚注列出伦理性和安稳性解释，避免把争议含义静默固定为单一理解。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。四个劝勉以短句并列，尽量保留希伯来诗句的凝练节奏；脚注标记置于所解释的歧义短语之后。
