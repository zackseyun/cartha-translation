    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的劝勉，引出其理由；现代汉语中“因为”自然清楚。
- source_word: כֶחָצִיר
  choice: 像草一样
  rationale: חָצִיר在此指草或草木，以常见的“草”最能直接传达短暂无常的比喻。
- source_word: מְהֵרָה
  choice: 迅速
  rationale: 保留原文对消逝之快的强调，并维持庄重简洁的语体。
- source_word: יִמָּלוּ
  choice: 枯萎
  rationale: 结合草木意象，理解为干枯、凋萎；该词也可能被理解为遭割下，故以脚注保留词义空间。
- source_word: וּכְיֶרֶק דֶּשֶׁא
  choice: 又如青绿的嫩草
  rationale: יֶרֶק表示青绿植物，דֶּשֶׁא表示新鲜嫩生的草木；“青绿的嫩草”兼顾颜色与鲜嫩生长的意象。
- source_word: יִבּוֹלוּן
  choice: 衰残
  rationale: 表示植物凋谢、枯萎；“衰残”与前句“枯萎”形成平行而不机械重复。
