  text: מֵ֭/יְהוָה מִֽצְעֲדֵי גֶ֥בֶר כּוֹנָ֗נוּ וְ/דַרְכּ֥/וֹ יֶחְפָּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/023.yaml
  text: From Yahweh a man's steps are established[b][a], and he delights in his way.
translation:
  language: zh_hans
  text: '诗篇 37:23


    人的脚步由耶和华立定；

    耶和华也喜爱他所走的道路。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喜爱”的主语在原文中没有明说。也可理解为：“他也喜爱自己所走的道路”，其中“他”指那人，而不是耶和华。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵיְהוָה
  choice: 由耶和华
  rationale: 介词 מִן 在这里表示来源或施事；与被动意义的“立定”搭配时，“由耶和华”既贴近原文“从耶和华而来”的表达，也符合现代汉语习惯。神名 יהוה 译为“耶和华”。
- source_word: מִצְעֲדֵי
  choice: 脚步
  rationale: 该词指行走的步伐，并可比喻人生的行动和历程；“脚步”自然、简洁，也保留诗歌意象。
- source_word: גֶבֶר
  choice: 人
  rationale: 该阳性名词可指男子，但在本节智慧诗式的普遍陈述中泛指一个人；现代汉语用“人”即可自然表达，不必加入原文在此处并未着重强调的“强壮”含义。
- source_word: כּוֹנָנוּ
  choice: 立定
  rationale: 该词为 כון 的被动形态，含确立、使稳固之意。“立定”保留稳固和确立的语义，也符合中文圣诗的庄重语体。
- source_word: וְדַרְכּוֹ
  choice: 他所走的道路
  rationale: דֶּרֶךְ 可指实际道路，也可比喻人的行事和人生道路；补入“所走的”使现代汉语更自然，同时保留比喻空间。
- source_word: יֶחְפָּץ
  choice: 喜爱
  rationale: חפץ 表示喜悦、乐意或以……为乐。“喜爱”简洁自然；正文将隐含主语理解为耶和华，但以脚注保留其可能指那人的歧义。
theological_decisions:
- issue: יֶחְפָּץ（“喜爱”）的主语
  choice: 正文将主语明确为耶和华：耶和华喜爱那人所走的道路。
  alternative: 主语也可能是那人，即“他也喜爱自己所走的道路”。
  rationale: 希伯来文动词只有第三人称阳性单数形式，主语并未明说。耶和华是前半句中最自然的先行对象，因此正文采用这一理解；但语法上仍可能指那人，故在脚注中保留此真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。首句保留原文的被动结构和神圣来源重点；次句为避免中文代词造成无意的混乱，在正文中明确重复“耶和华”，同时以脚注保存原文的主语歧义。
