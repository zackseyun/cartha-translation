  text: חֶ֤רֶב פָּֽתְח֣וּ רְשָׁעִים֮ וְ/דָרְכ֪וּ קַ֫שְׁתָּ֥/ם לְ֭/הַפִּיל עָנִ֣י וְ/אֶבְי֑וֹן לִ֝/טְב֗וֹחַ יִשְׁרֵי דָֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/014.yaml
  text: The wicked have drawn the sword and bent their bow[a], to bring down the poor and needy[b], to slaughter those upright in way.
translation:
  language: zh_hans
  text: 恶人已经拔刀，拉开他们的弓，要击倒困苦贫穷的人，要屠杀行事正直的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶרֶב פָּתְחוּ
  choice: 已经拔刀
  rationale: פּתח本义为“打开”，与“刀”连用表示拔刀出鞘；“拔刀”是自然、准确的现代汉语表达。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 保留诗篇中按道德性质划分的群体称谓，不额外限定性别。
- source_word: וְדָרְכוּ קַשְׁתָּם
  choice: 拉开他们的弓
  rationale: דרך与“弓”连用指踩弓或张弓，意在备战射击；“拉开弓”清楚自然。希伯来文“弓”为单数并带第三人称复数所有格，译文照此保留。
- source_word: לְהַפִּיל
  choice: 要击倒
  rationale: 使役词形意为“使倒下”；结合持刀张弓的暴力语境，“击倒”比一般的“使倒下”更自然。
- source_word: עָנִי וְאֶבְיוֹן
  choice: 困苦贫穷的人
  rationale: עָנִי可指贫穷、受苦或受压者，אֶבְיוֹן指贫乏、有需要者；此译既保留两词的重叠平行，也避免把前者仅限于经济贫困。
- source_word: לִטְבֹחַ
  choice: 要屠杀
  rationale: 该词强于普通的“杀”，带有宰杀、残酷杀戮之意；“屠杀”保留其力度。
- source_word: יִשְׁרֵי דָרֶךְ
  choice: 行事正直的人
  rationale: 字面为“道路正直者”，其中“道路”常喻生活方式和品行；“行事正直的人”在现代汉语中自然，并保留道德行为层面的含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文两组目的短语的并列推进，以及拔刀、张弓、击倒、屠杀所形成的强烈暴力意象；不添加原文没有的神学解释。
