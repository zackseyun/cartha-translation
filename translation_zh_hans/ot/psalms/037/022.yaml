  text: כִּ֣י מְ֭בֹרָכָי/ו יִ֣ירְשׁוּ אָ֑רֶץ וּ֝/מְקֻלָּלָ֗י/ו יִכָּרֵֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/022.yaml
  text: For those blessed by him will inherit the land[a], but those cursed by him will be cut off.
translation:
  language: zh_hans
  text: 因为他所赐福的人必承受那地[a]，他所咒诅的人却必被剪除。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地”。希伯来语 אֶרֶץ 可指“那地”或“大地”；这里按本诗的盟约背景译作“那地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，为其陈述提供理由；现代汉语中“因为”能自然表达这一论证关系。
- source_word: מְבֹרָכָיו
  choice: 蒙他赐福的人
  rationale: 保留被动分词及第三人称阳性单数后缀的关系含义；“他”按诗篇上下文指耶和华。
- source_word: יִירְשׁוּ
  choice: 必承受
  rationale: 既表达将来的应许，也保留 ירש 所含继承、得着产业的盟约色彩。
- source_word: אָרֶץ
  choice: 那地
  rationale: 在诗篇37篇反复出现的应许语境中，首先指所应许之地；原词也可泛指“大地”，故以脚注保留。
- source_word: וּמְקֻלָּלָיו
  choice: 被他咒诅的人却
  rationale: 保留被动意义和后缀所指的施事者，并用“却”明确上下两句的对比。
- source_word: יִכָּרֵתוּ
  choice: 必被剪除
  rationale: 保留 כרת 的被动形式及“剪除”这一审判性希伯来语意象，避免弱化为一般性的消失。
theological_decisions:
- issue: 两个第三人称阳性单数后缀所指为何
  choice: 译作“蒙他赐福”与“被他咒诅”，按上下文将“他”理解为耶和华。
  alternative: 更贴近形式地译作“他所赐福的人”和“他所咒诅的人”，或“他的蒙福者”和“他的受咒诅者”。
  rationale: 希伯来文后缀本身表达与该单数主体的关系，上下文清楚指向耶和华；中文明确施事关系可增进可读性，并未增添原文没有的神学主张。
- issue: אָרֶץ 的范围
  choice: 正文译“那地”。
  alternative: “大地”或“全地”。
  rationale: 本篇反复使用这一词来表达义人承受土地的应许，“那地”较好保留盟约和智慧文学背景；但该词确可有更广范围，因此以脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙……赐福”“承受那地”“被剪除”保留诗歌的平行结构、盟约色彩和审判意象；不将 אָרֶץ 的潜在广义解释写死在正文中。
