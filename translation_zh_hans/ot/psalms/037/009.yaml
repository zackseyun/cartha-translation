  text: For evildoers will be cut off[a], but those who wait for Yahweh—they will inherit the land.
translation:
  language: zh_hans
  text: 因为作恶的人必被剪除；但等候耶和华的人，他们必承受土地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地”。希伯来语 אֶרֶץ 可指“土地”，也可指“大地”；在本诗的盟约语境中，“土地”的理解较为贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明其理由，保留希伯来语的解释性连接作用。
- source_word: מְרֵעִים
  choice: 作恶的人
  rationale: 准确表达该使役词形所指的持续行恶者，也比生硬的名词化表达更符合现代汉语。
- source_word: יִכָּרֵתוּן
  choice: 必被剪除
  rationale: 保留כרת在此处“被除掉、断绝”的审判意味，并避免径直窄化为“被杀灭”。
- source_word: וְקֹוֵי
  choice: 但等候……的人
  rationale: קוה含带着盼望耐心等候之意；“但”自然显明前后两类人的对比。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名音译，明确其为专名而非称号。
- source_word: הֵמָּה
  choice: 他们
  rationale: 以独立代词“他们”保留原文的强调语气。
- source_word: יִירְשׁוּ
  choice: 必承受
  rationale: 保留ירשׁ在应许和盟约语境中的领受产业色彩；“承受”在中文中庄重而自然。
- source_word: אָרֶץ
  choice: 那地
  rationale: 本诗反复出现承受土地的应许，具有盟约背景；定指的“那地”较能体现这一语境，同时在脚注保留“全地”的可能。
theological_decisions:
- issue: אָרֶץ所指范围
  choice: 那地
  alternative: 全地（或大地）
  rationale: 本诗的近期语境呼应以色列承受应许之地的盟约语言，因此正文采用“那地”；但希伯来词本身也可泛指全地，故以脚注保留其更广含义，不把经文的张力绝对化。
- issue: יִכָּרֵתוּן的审判强度
  choice: 必被剪除
  alternative: 必被毁灭
  rationale: “剪除”保留原文可能涵盖被除去、断绝或毁灭的幅度，不将具体方式说得超过原文。
translation_notes:
  register: 采用现代、庄重且易懂的中文。“剪除”和“承受”保留诗篇的审判与应许语感；分号及复指的“他们”呈现原文鲜明对照和独立代词的强调。
