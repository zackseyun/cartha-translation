  text: אַל תִּ֭ירָא כִּֽי יַעֲשִׁ֣ר אִ֑ישׁ כִּֽי יִ֝רְבֶּה כְּב֣וֹד בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/016.yaml
  text: Do not fear when a man becomes rich[a], when the glory of his house increases;
translation:
  language: zh_hans
  text: 不要因有人富足、他家的荣耀增多而惧怕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירָא
  choice: 不要……惧怕
  rationale: אַל与未完成式连用构成禁令；“不要……惧怕”准确而庄重。希伯来文只有一个禁令统摄两个כִּי从句，中文第二分句补出“也不要……就惧怕”，使句法关系清楚。
- source_word: כִּי
  choice: 因……就
  rationale: 两处כִּי都引出不应使人惧怕的情形；中文用“因……就”自然表达这种处境关系，同时不把它处理成命令的理由。
- source_word: יַעֲשִׁיר אִישׁ
  choice: 有人富足
  rationale: יַעֲשִׁיר在此为不及物意义“变得富有”；אִישׁ在箴言式语境中可泛指某个人。“有人富足”比“一个男人变得富有”更符合现代汉语，也不增添不必要的性别限定。
- source_word: יִרְבֶּה
  choice: 增多
  rationale: רבה表示增多、增长；“增多”保留数量或程度上扩大的开放含义。
- source_word: כְּבוֹד
  choice: 荣耀
  rationale: כָּבוֹד可指荣耀、尊荣、显赫或财富所带来的分量。“荣耀”保留原文较宽的意象，避免将其仅化约为财富。
- source_word: בֵּיתוֹ
  choice: 他家中
  rationale: בַּיִת既可指房屋，也可指家庭、家业或家族。“他家中”保留“家”的原文意象，并允许较广的语义范围。
theological_decisions: []
