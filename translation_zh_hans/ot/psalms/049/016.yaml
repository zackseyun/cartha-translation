  naturalness: “他家中的荣耀”在现代汉语中容易被理解为“在他家内部的荣耀”，不够自然，也没有准确呈现希伯来语属格结构。“他家的荣耀”较自然，且保留“家”可指家族、家业或住宅的开放性。
