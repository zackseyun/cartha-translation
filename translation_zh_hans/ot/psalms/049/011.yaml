base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/011.yaml
  text: Their inward thought is that their houses will last forever[a], their dwelling places from generation to generation[b]; they have called lands by their own names.
translation:
  language: zh_hans
  text: 他们心里以为，自己的房屋必存到永远[a]，住处必留到世世代代；他们用自己的名字给土地命名[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按另一种文本理解译作：“他们的坟墓是他们永远的房屋，是他们世世代代的住处。”
    reason: textual_variant
  - marker: b
    text: 直译：“他们在土地上以自己的名字称呼（它们）。”意思是他们以自己的名字给土地或产业命名。
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבָּם
  choice: 他们心里以为
  rationale: 马所拉经文读作“他们里面、内心”；本节为无动词句，结合上下文，以“心里以为”自然表达他们对产业长存的内在设想，同时在脚注保留“坟墓”的另一文本理解。
- source_word: בָּתֵּימוֹ
  choice: 自己的房屋
  rationale: בַּיִת通常指房屋或家宅；此处与“住处”平行，并指他们认为可永久保有的产业。
- source_word: לְעוֹלָם
  choice: 必存到永远
  rationale: 该短语表示永久延续；希伯来文是无动词结构，中文补出“必存”，以清楚表达其内心所认定的长久性。
- source_word: מִשְׁכְּנֹתָם
  choice: 住处
  rationale: 指居住之所；“住处”简洁自然，也保留与“房屋”的诗歌平行。
- source_word: לְדֹר וָדֹר
  choice: 世世代代
  rationale: 这是表示历代延续的惯用语；“世世代代”符合现代中文诗体表达。
- source_word: קָרְאוּ בִשְׁמוֹתָם
  choice: 用自己的名字……命名
  rationale: קרא在此有“称呼、命名”之意，介词ב与“名字”连用，表示以自己的名字作为名称。
- source_word: עֲלֵי אֲדָמוֹת
  choice: 给土地
  rationale: 字面近于“在诸土地之上”；语境所指是土地或地产，以“给土地命名”传达其为产业冠上自己名字的含义，较逐字表达自然。
theological_decisions:
- issue: קִרְבָּם的理解
  choice: 正文按马所拉元音理解为“他们心里以为”
  alternative: “他们的坟墓是他们永远的房屋”
  rationale: WLC所提供的元音支持“内心、里面”的读法；另一理解具有古老文本传统与语境可能性，因此不在正文中混合两者，而以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留诗句的平行结构；“心里以为”补足希伯来文无动词句的隐含判断，“必留”承接前句谓语，使中文流畅。脚注标记均已置于正文相应位置。
