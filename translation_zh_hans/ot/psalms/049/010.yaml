source:
  edition: WLC
  text: כִּ֤י יִרְאֶ֨ה חֲכָ֘מִ֤ים יָמ֗וּתוּ יַ֤חַד כְּסִ֣יל וָ/בַ֣עַר יֹאבֵ֑דוּ וְ/עָזְב֖וּ לַ/אֲחֵרִ֣ים חֵילָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/010.yaml
  text: For he sees that wise men die[a]; together the fool and the brutish man perish[c][b], and they leave their wealth to others.
translation:
  language: zh_hans
  text: 因为他看见智慧人也会死[a]；愚昧人和愚钝人[b]一同灭亡，把自己的财富[c]留给别人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “智慧人”原文采用阳性复数形式，在这里代表有智慧的一类人。
    reason: lexical_alternative
  - marker: b
    text: “愚钝人”指无知、缺乏理性的人；该词可含近乎禽兽般无知的意味。
    reason: lexical_alternative
  - marker: c
    text: “财富”也可译作“资财”或“产业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的论述说明理由；“因为”自然保留希伯来语的解释性连接作用。
- source_word: יִרְאֶה
  choice: 他看见
  rationale: 保留第三人称单数形式，并以现在时表达普遍可见的事实。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 这是智慧文学中指有智慧之人的类别用语；“智慧人”庄重、清楚，也避免将其误解为仅有聪明才智的人。
- source_word: יָמוּתוּ
  choice: 也会死
  rationale: “会死”自然表达普遍结局；“也”凸显即使智慧人也不能免死的语境重点。
- source_word: יַחַד
  choice: 一同
  rationale: 强调不同类别的人共有相同结局，不必限定为在同一时刻死亡。
- source_word: כְּסִיל
  choice: 愚昧人
  rationale: 保留智慧文学中兼具道德与认知意味的“愚昧”类别，而非仅指智力不足。
- source_word: בַעַר
  choice: 蒙昧人
  rationale: 表示缺乏认识、近乎凭本能行事的人；正文采用自然现代汉语，脚注补明其近似禽兽般无知的语意。
- source_word: יֹאבֵדוּ
  choice: 灭亡
  rationale: 比单纯“死亡”更能体现 אָבַד 所含的消逝、败亡意味，同时不额外界定死后的状态。
- source_word: וְעָזְבוּ
  choice: 把自己的……留给
  rationale: 清楚表达死后财物被留下并归于他人的结果；“自己的”在汉语中自然回指这些人。
- source_word: לַאֲחֵרִים
  choice: 给别人
  rationale: 忠实表达不特定的“其他人”，不强化为“陌生人”或“外人”。
- source_word: חֵילָם
  choice: 自己的财富
  rationale: חֵיל 在此指所拥有的财力、资财或产业；“财富”是最清楚自然的统称。
theological_decisions:
- issue: 智慧人、愚昧人与蒙昧人共同面对死亡
  choice: 保留各类人的并列及共同结局，不把“灭亡”解释为特定的死后教义
  alternative: 将“灭亡”释为永远沉沦，或只译作“死亡”
  rationale: 本节重点是智慧与愚昧都不能使人逃避死亡、财物终将留给别人；原文在此没有明确界定最终审判或死后状态。
- issue: 阳性类别词在汉语中的表达
  choice: 以“智慧人”“愚昧人”“蒙昧人”表达代表性的人类类别
  alternative: 明确译为“有智慧的男人”等仅限男性的说法
  rationale: 希伯来语使用语法上的阳性形式，但在本智慧诗语境中代表一般的人类类型；现代汉语的“人”可自然保留这种类别意义而不武断限定为男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“也会死”凸显智慧人同样不能免死；分号保留前后两组陈述的诗行层次。“愚昧人”与“蒙昧人”区分两个近义的智慧文学类别，并用脚注说明后者较强的兽性、无理性意味。
