  text: אַךְ אֱלֹהִ֗ים יִפְדֶּ֣ה נַ֭פְשִׁ/י מִֽ/יַּד שְׁא֑וֹל כִּ֖י יִקָּחֵ֣/נִי סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/015.yaml
  text: But God will redeem my life from the hand of Sheol[a], for he will take me[b]. Selah
translation:
  language: zh_hans
  text: 但上帝必从阴间的手中救赎我的生命，因为他必接我[b]。细拉
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“因为他必接纳我。”
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: 但
  rationale: 此处与上文富足之人同样难逃死亡的结局形成鲜明对比；“但”自然表达转折作用，同时不把该词限定为“惟有”或“诚然”
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 这里以单数意义指以色列的上帝；“上帝”是现代普通话中庄重而通行的对应词。
- source_word: יִפְדֶּה
  choice: 必救赎
  rationale: פדה 表示从某种权势或处境中赎回、解救；“救赎”兼顾赎回与拯救的含义，又不把经文具体化为某一种救援方式。
- source_word: נַפְשִׁי
  choice: 我的生命
  rationale: נפש 在此主要指人的生命或整个人，而非特指与身体分离的非物质灵魂；“我的生命”符合死亡与获救的语境。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 保留希伯来语“从……手中”的拟人意象，表达摆脱某种权势或掌控；中文以“脱离……的手”既贴近原文，也保有诗意。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל 指死者所在之境；中文“阴间”比音译更易懂，也不等同于最终刑罚之地。脚注说明其含义并保留其他表达。
- source_word: כִּי
  choice: 因为
  rationale: 此处最自然地说明前句信心的根据；“因为”清楚表达因果关系。
- source_word: יִקָּחֵנִי
  choice: 他必接我去
  rationale: לקח 的基本意思是“取、带走、接去”。“接我去”保留动作及方向的含蓄性，又比单说“取我”更合乎现代汉语；脚注保留“接纳我”的可能理解。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词的确切意义和礼仪功能不明，因此采用传统音译，不作未经证实的解释。
theological_decisions:
- issue: נַפְשִׁי 在死亡与拯救语境中的含义
  choice: 译为“我的生命”
  alternative: “我的灵魂”或“我本人”
  rationale: 这样避免把后期较明确的身心二分观念带入希伯来诗歌；本节所谈的是人面对死亡时蒙上帝救赎，故“生命”最贴合直接语境。
- issue: 从阴间得救的具体所指
  choice: 保持“救赎我的生命脱离阴间的手……接我去”的宽广表达
  alternative: 明确译成身体复活、死后与上帝同在，或仅仅免于早死
  rationale: 希伯来文本坚定宣告上帝胜过死亡的权势，却没有用系统神学术语界定实现方式；译文保留复活、死后被上帝接纳及今生获救等理解之间的张力。
- issue: יִקָּחֵנִי 所表达的神人关系
  choice: 正文译“接我去”
  alternative: “接纳我”
  rationale: “接我去”较直接保留 לקח 的动作含义，也可能使人联想到上帝把人接到自己那里，但不明说目的地；“接纳我”的关系性含义列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。保留“阴间的手”这一拟人化意象，并以传统音译“细拉”呈现意义未明的礼仪或音乐术语；标点将“细拉”置于括号中，以反映其可能的诗歌或礼仪功能，而不武断解释。
