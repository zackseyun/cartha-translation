  yaml_path: translation/ot/psalms/049/013.yaml
  text: This is their way—their folly[a]; yet after them, people approve their words[b]. Selah
translation:
  language: zh_hans
  text: '这正是他们愚妄的道路[a]；

    后来的人仍称许他们口中的话[b]。

    细拉'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愚妄”所译的希伯来词也可表示“自恃、信赖”或“倚仗”。原文措辞简略，亦可理解为：“这就是他们的道路；这对他们乃是自恃。”
    reason: lexical_alternative
  - marker: b
    text: “后来的人”也可译作“他们的后代”。“他们口中的话”原文直译为“他们的口”；句法关系紧凑，也可能理解为后来的人喜爱他们自己口中所说的。
    reason: alternative_reading
lexical_decisions:
- source_word: זֶה
  choice: 这就是
  rationale: 指回上文所描述的人生道路；汉语补出“就是”，使判断句自然明确。
- source_word: דַרְכָּם
  choice: 他们的道路
  rationale: 保留“道路”的比喻，同时可自然指人的生活方式和行事方向。
- source_word: כֵּסֶל לָמוֹ
  choice: 是他们的愚妄
  rationale: כֶּסֶל在此最自然地表示“愚妄”，לָמוֹ以所属关系表达；同时用脚注保留该词可能表示“倚仗、信靠”的歧义。
- source_word: וְאַחֲרֵיהֶם
  choice: 后来的人仍
  rationale: 指在他们之后来临或跟随他们的人，不限定为血缘后代；“仍”传达这种愚妄继续得到认同的反讽意味。
- source_word: בְּפִיהֶם
  choice: 他们口中的话
  rationale: 原文直译为“他们的口”；按希伯来语转喻，在汉语中译出“口中的话”，既自然又保留与言语有关的意象。
- source_word: יִרְצוּ
  choice: 称许
  rationale: רצה在此表示喜悦、认可或赞同；“称许”能自然表达后来者对其言论持赞赏态度。
- source_word: סֶלָה
  choice: 细拉
  rationale: 沿用传统音译，因为该礼仪或音乐术语的确切功能不能确定。
theological_decisions:
- issue: כֵּסֶל的含义
  choice: 愚妄
  alternative: 倚仗、信靠
  rationale: 上下文批判倚仗财富之人的道路，故“愚妄”最符合智慧诗的评价语气；但该词也可表达“信靠、倚仗”，因此在脚注中保留另一理解。
- issue: וְאַחֲרֵיהֶם的所指
  choice: 后来的人
  alternative: 他们的后代
  rationale: 希伯来语既可泛指在他们之后的人，也可能特指后代。正文采用较宽泛的说法，避免把经文未明确限定的关系解释为血缘关系。
- issue: בְּפִיהֶם中代词的指向及表达
  choice: 他们口中的话
  alternative: 后来的人喜爱自己口中所说的
  rationale: 正文依上下文理解为后来者称许前人的言论；但原文代词衔接紧凑，可能理解为后来者喜爱自己口中所说的，因此以脚注保留句法上的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“道路”保留原文比喻；“称许”比口语化的“赞同”略为凝练，并涵盖喜爱与认可。分为三行，以呈现判断、延续和礼仪标记的结构。
