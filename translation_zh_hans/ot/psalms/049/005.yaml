  yaml_path: translation/ot/psalms/049/005.yaml
  text: Why should I fear in days of evil[a], when the iniquity of my pursuers surrounds me?
translation:
  language: zh_hans
  text: 我何必惧怕？在患难的日子，企图绊倒我的人的罪孽包围我时[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “企图绊倒我的人的罪孽”：原文直译可作“我脚跟的罪孽”。这句话也可能指紧随我脚后的罪孽，或指那些追逼、企图绊倒我的人的罪孽；也有人理解为我自己的罪孽紧随着我。
    reason: 原文 עֲוֹן עֲקֵבַי 含义不确定，需要保留其字面意象和主要替代解释。
lexical_decisions:
- source_word: לָמָּה אִירָא
  choice: 我何必惧怕
  rationale: 这是带有反问意味的表达；“何必惧怕”自然地传达未完成式在此处的修辞语气，而不将其误作单纯的将来时。
- source_word: בִּימֵי רָע
  choice: 在患难的日子
  rationale: רָע 在此可泛指灾祸、逆境或邪恶带来的患难。“患难的日子”符合现代汉语习惯，又不把含义局限为道德上的邪恶。
- source_word: עֲוֹן
  choice: 所行的罪孽
  rationale: עָוֹן 可指罪孽、罪责或罪的后果；本处保留其道德含义，并用“所行的”使汉语关系清楚。
- source_word: עֲקֵבַי
  choice: 企图绊倒我的人
  rationale: 该词字面与“脚跟”有关，也可使人联想到从后追逼或使人绊倒。正文采用符合上下文的敌对者含义，疑难和其他可能性则保留在脚注中。
- source_word: יְסוּבֵּנִי
  choice: 包围我
  rationale: 准确表达 סבב 的环绕、围困之意，并保留原文单数动词与前述整体短语的关系。
theological_decisions:
- issue: עֲוֹן עֲקֵבַי 的解释
  choice: 理解为企图绊倒诗人的敌对者所行的罪孽
  alternative: “我脚跟的罪孽”“紧随我脚后的罪孽”，或诗人自己的罪孽追随着他
  rationale: 原文高度凝练，עֲקֵבַי 字面是“我的脚跟”，其具体所指存在真实歧义。诗篇上下文谈到强势、富有的敌对者，因此正文采用敌人企图绊倒诗人的理解；脚注同时保存字面形式及其他解释，避免把争议完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“何必惧怕”保留诗句的反问力度；“患难的日子”避免把 רָע 过度限定为单一类型的恶。
