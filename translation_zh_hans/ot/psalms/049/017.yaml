  text: כִּ֤י לֹ֣א בְ֭/מוֹת/וֹ יִקַּ֣ח הַ/כֹּ֑ל לֹא יֵרֵ֖ד אַחֲרָ֣י/ו כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/017.yaml
  text: For at his death he will take nothing[c][b][a]; his glory will not go down after him.
translation:
  language: zh_hans
  text: 因为他死的时候，什么也带不走[a]；他的荣华[b]不会跟着他下去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他什么都不能带走。”原文直译为“他不能带走全部／一切”。
    reason: lexical_alternative
  - marker: b
    text: “荣华”也可译为“荣耀”“尊荣”或“显赫地位”；在本诗语境中也可包含财富。
    reason: lexical_alternative
  - marker: c
    text: “下去”在这里可能指下到坟墓或阴间，但希伯来文没有明说目的地。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在本节中引出对前文劝诫的解释或理由；“因为”自然体现诗篇的论证衔接。
- source_word: בְמוֹתוֹ
  choice: 他死的时候
  rationale: 介词 בְּ 在此具有时间意义，加上“他的死”，译为“他死的时候”符合现代汉语表达。
- source_word: יִקַּח הַכֹּל（在否定词 לֹא 之下）
  choice: 什么也带不走
  rationale: הַכֹּל 字面为“全部／一切”；在否定结构中表示一点也不能拿走。结合死亡语境，“带不走”自然传达随身拿去之意，同时不改变核心含义。
- source_word: כְּבוֹדוֹ
  choice: 他的荣华
  rationale: כָּבוֹד 可指荣耀、尊荣、显赫或财富所显出的荣华。本诗语境侧重世上的财富与地位；“荣华”既自然又保留其诗意，脚注说明词义范围。
- source_word: יֵרֵד אַחֲרָיו
  choice: 不会随他一同下去
  rationale: 保留“下去”的空间意象，并以“随他一同”自然表达 אַחֲרָיו 的跟随含义；不在正文中补明坟墓或阴间。
theological_decisions:
- issue: 死后“下去”的目的地
  choice: 保留“随他一同下去”，不明说目的地
  alternative: 不会随他下到坟墓／阴间
  rationale: “下去”在死亡语境中可能使人联想到坟墓或阴间，但希伯来文未明说目的地。正文保留含蓄意象，避免加入比原文更具体的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“什么也带不走”是自然汉语；分号保留两句之间紧密的诗意并列。正文不把“下去”的隐含目的地具体化。
