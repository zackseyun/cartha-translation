  text: תָּ֭בוֹא עַד דּ֣וֹר אֲבוֹתָ֑י/ו עַד נֵ֝֗צַח לֹ֣א יִרְאוּ אֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/019.yaml
  text: He will go to the generation of his fathers[c][b][a]; they will never again see the light.
translation:
  language: zh_hans
  text: 你[a]必归入他祖先的世代[b]；他们永远不再见光[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文开头的动词是第二人称阳性单数：“你必来到／归入”；后半句却转为第三人称复数：“他们不再看见”。有些译本按上下文将前者顺译为“他必归入”，或把全句统一为单数；这里保留原文在人称和数上的转换。
    reason: alternative_reading
  - marker: b
    text: “他祖先的世代”直译为“他父辈的世代”；此处指他已故先祖所组成的群体，而不只是一个时间时期。
    reason: lexical_alternative
  - marker: c
    text: “见光”在这里是与生命有关的希伯来语意象，意思是他们永远不能再回到今世的生命中。
    reason: cultural_note
lexical_decisions:
- source_word: תָּבוֹא
  choice: 你必归到
  rationale: 马所拉文本所写形式为בוא的Qal未完成式第二人称阳性单数。译作“你必归到”保留原文的人称形式；“归到”在死亡归入先祖之列的语境中比直译“来到”更自然。
- source_word: עַד
  choice: 到
  rationale: 此处表示所达到的归宿或范围，与后面的“他祖先的行列”搭配自然。
- source_word: דּוֹר אֲבוֹתָיו
  choice: 他祖先的行列
  rationale: דּוֹר通常指“世代”，但此处所指不是单纯的时期，而是已死先祖所属的群体。“行列”传达这一语境含义；“祖先”自然表达复数אֲבוֹת及第三人称单数所属后缀。脚注保留更贴近字面的译法。
- source_word: עַד נֵצַח
  choice: 永远不再
  rationale: 与否定词和后续动词连用，表示此事永久不会再发生；“永远不再”符合现代汉语表达。
- source_word: לֹא יִרְאוּ
  choice: 他们……不再见
  rationale: 动词为第三人称阳性复数，译文保留复数，指那人将要加入的死者群体，也保留本节由第二人称单数转为第三人称复数的张力。
- source_word: אוֹר
  choice: 光
  rationale: 保留希伯来文的意象；在本诗死亡语境中，“见光”可指活着、经历今世生命，但正文不把隐喻直接释义。
theological_decisions:
- issue: 本节的人称与数发生转换
  choice: 首句按文本形态译为第二人称单数“你”，次句按文本译为第三人称复数“他们”。
  alternative: 按上下文将首句顺译为“他必归到”，或将全节统一为单数：“他必归到……他永远不再见光。”
  rationale: תָּבוֹא按形态是第二人称阳性单数，יִרְאוּ则是第三人称阳性复数。统一人称虽然更流畅，却会消除马所拉文本中真实存在的转换。正文保留这一转换，并以脚注说明其语篇张力。
- issue: “见光”的生命含义
  choice: 正文保留“见光”的诗性意象，以脚注解释其在此处与生命有关。
  alternative: 正文直接意译为“他们永远不能再活在世上”。
  rationale: 原文既可呈现光的具体意象，又在死亡语境中具有“经历生命”的惯用含义。保留意象可避免把诗歌表达过度释义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“归到……的行列”既符合死亡归入先祖群体的语境，也避免把דּוֹר误解为单纯的年代。分号清楚呈现个体转入死者群体的视角变化。
