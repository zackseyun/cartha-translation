source:
  edition: WLC
  text: שִׁמְעוּ זֹ֭את כָּל הָֽ/עַמִּ֑ים הַ֝אֲזִ֗ינוּ כָּל יֹ֥שְׁבֵי חָֽלֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/001.yaml
  text: Hear this[a], all peoples; give ear, all inhabitants of the world,
translation:
  language: zh_hans
  text: 万民哪，你们都要听这话；世上[a]所有的居民哪，你们都要侧耳听！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“地上”。希伯来语“חָלֶד”可指人类生活的世界，也可指尘世领域。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 复数命令式，呼吁众人专心听；“听”保留诗歌中直接、庄重的召唤语气。
- source_word: זֹאת
  choice: 这话
  rationale: 指下文诗人将要宣告的教训；汉语用“这话”比单说“这”更自然，也未限定具体内容。
- source_word: כָּל הָעַמִּים
  choice: 万民
  rationale: 表示所有民族、民众群体；“万民”简洁庄重，并保留普世性的呼召。
- source_word: הַאֲזִינוּ
  choice: 要侧耳听
  rationale: 该使役词形是要求留心倾听的命令；“侧耳听”既体现专注，也与前句“要听”形成诗体平行。
- source_word: כָּל יֹשְׁבֵי
  choice: 所有的居民
  rationale: 分词结构指居住在某处的人；此译自然表达“所有居住于世上的人”。
- source_word: חָלֶד
  choice: 世上
  rationale: 此词可指人类生活的世界或尘世领域；“世上”在本节普遍召唤的语境中自然贴切，同时以脚注保留“地上”的可能译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“万民哪……居民哪”保留两行平行呼语；两个“都要”传达希伯来语复数命令的普遍范围。脚注标记置于其实际说明的“世上”之后。
