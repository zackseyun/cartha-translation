  yaml_path: translation/ot/psalms/049/003.yaml
  text: My mouth will speak wisdom[a], and the meditation of my heart will be understanding.
translation:
  language: zh_hans
  text: 我的口要说出智慧[a]；我心所默想的，是明辨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “智慧”和“明辨”在希伯来原文中均为复数形式，这里很可能用作抽象名词。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: 我的口
  rationale: 保留希伯来文以“口”指发言的身体意象；这一表达在现代汉语中自然可懂。
- source_word: יְדַבֵּר
  choice: 要说出
  rationale: 未完成式在此表达诗人的宣告和意向；“要说出”既自然，也与后面的内容宾语衔接顺畅。
- source_word: חָכְמוֹת
  choice: 智慧
  rationale: 原文虽为复数形式，但很可能用作抽象名词；汉语用单数概念“智慧”最为自然。
- source_word: הָגוּת
  choice: 所默想的
  rationale: 该词可指内心的沉思、默想，也可能涉及由思索而出的表达；这里采用“所默想的”，保留其内在思想活动的主要含义。
- source_word: לִבִּי
  choice: 我心
  rationale: 保留圣经希伯来语以“心”为思想和领悟中心的意象，同时符合汉语表达。
- source_word: תְבוּנוֹת
  choice: 聪明
  rationale: 原文为复数形式，但很可能表达抽象概念；“聪明”在智慧文学语境中可指理解力和洞察，且与“智慧”形成自然对应。
