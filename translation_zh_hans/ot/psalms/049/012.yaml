id: PSA.49.12
reference: Psalms 49:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָדָ֣ם בִּ֭/יקָר בַּל יָלִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/012.yaml
  text: But man in honor does not remain[c][b][a]; he is like the beasts that perish.
translation:
  language: zh_hans
  text: 然而，人身居尊荣，却不能长久[a][b]；他如同灭亡的兽类[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”也可译作“人类”；希伯来文此处用单数代表全人类。
    reason: lexical_alternative
  - marker: b
    text: “不能长久”直译为“不能住宿（或过夜）”，在这里指不能持续处于尊荣之中。
    reason: lexical_alternative
  - marker: c
    text: 或译：“如同被毁灭的兽类。”末一动词传统上理解为灭亡或被毁灭。
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: 人
  rationale: 此处单数具有代表性，泛指人或人类；现代汉语用“人”既自然，也保留原文的单数表达。
- source_word: בִּיקָר
  choice: 身居尊荣
  rationale: יָקָר可指尊荣、贵重或显赫；本诗语境关注人的地位与荣耀，“身居尊荣”比限定为财富更贴切。
- source_word: בַּל יָלִין
  choice: 却不能长久
  rationale: 该动词本义为住宿、过夜，此处表达不能持续处于尊荣的状态；译为“不能长久”传达其智慧文学中的引申义。
- source_word: נִמְשַׁל
  choice: 如同
  rationale: 该被动词形在此表示被比作、与之相似；“如同”简洁自然。
- source_word: כַּבְּהֵמוֹת
  choice: 兽类
  rationale: בְּהֵמוֹת在此泛指动物或兽类；“兽类”避免把范围不必要地限于家畜，同时保持庄重语体。
- source_word: נִדְמוּ
  choice: 灭亡的
  rationale: 此词在本节传统上理解为灭亡或被毁灭，与全诗关于死亡的主题相符；定语结构使汉语表达自然。
theological_decisions:
- issue: 人在尊荣中的短暂性
  choice: 保留为概括性的人生陈述，不增添关于财富、身份或死后命运的解释
  alternative: 将“尊荣”具体解释为财富，或把“不能长久”明确解释为死亡
  rationale: 原文措辞较宽，既涉及人的尊贵地位，也强调其不能持久；译文不应缩窄或扩展其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“然而……却……”呈现原句的转折；分号保留上下半句紧密的比喻关系。所有脚注标记均置于正文相应词句之后。
