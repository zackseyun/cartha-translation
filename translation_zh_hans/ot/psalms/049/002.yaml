  text: both low and high[b][a], rich and poor together.
translation:
  language: zh_hans
  text: 平民和显贵[a]，富人和穷人，都一同听[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“亚当之子和男人之子”；这两个表达在此成对使用，指地位普通的人和地位显赫的人。
    reason: lexical_alternative
  - marker: b
    text: “听”承接上一节；本节希伯来文没有重复这个动词。
    reason: supplied_context
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: ……和……都
  rationale: 重复的 גַּם 表明两类人都包括在内；中文用“……和……都”自然表达这种兼括关系。
- source_word: בְּנֵי אָדָם
  choice: 平民
  rationale: 与 בְּנֵי אִישׁ 对举时，这一表达指社会地位普通或较低的人；译作“平民”比逐字译法更能传达此处的身份对比。
- source_word: בְּנֵי אִישׁ
  choice: 显贵
  rationale: 与 בְּנֵי אָדָם 构成社会地位上的对比，指有身份、有地位的人；“显贵”简洁而有诗体庄重感。
- source_word: יַחַד
  choice: 一同
  rationale: 表示上述各类人被共同召唤来听；“一同”既忠实又符合现代中文表达。
- source_word: עָשִׁיר
  choice: 富人
  rationale: 在与穷人相对的社会经济语境中，这是直接、自然的对应词。
- source_word: וְאֶבְיוֹן
  choice: 和穷人
  rationale: אֶבְיוֹן 可指贫穷或困乏的人；在与“富人”的明确对举中，“穷人”最自然。
theological_decisions: []
