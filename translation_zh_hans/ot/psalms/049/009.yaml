id: PSA.49.9
reference: Psalms 49:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וִֽ/יחִי ע֥וֹד לָ/נֶ֑צַח לֹ֖א יִרְאֶ֣ה הַ/שָּֽׁחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/009.yaml
  text: that he should still live on forever and not see the Pit[a].
translation:
  language: zh_hans
  text: 使他能永远活下去，不见深坑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坟墓”或“朽坏”。
    reason: 词义存在合理的翻译选择；שחת在此可指坑、坟墓或腐朽毁坏。
lexical_decisions:
- source_word: וִיחִי
  choice: 使他能……活下去
  rationale: 该词为חיה的Qal未完成式/祈愿式第三人称阳性单数，在上下文中承接前句，表达赎价所要达到却无法达到的结果或目的；“使他能……活下去”既体现句法关联，也符合现代汉语。
- source_word: עוֹד
  choice: 活下去
  rationale: 此处表示生命继续延续；将其与动词合译为“活下去”，比机械译作“仍然”更自然。
- source_word: לָנֶצַח
  choice: 永远
  rationale: ל与נֶצַח连用表示永久、无尽的时长；“永远”准确而通俗。
- source_word: לֹא
  choice: 不
  rationale: 保留原文对后续动词的直接否定。
- source_word: יִרְאֶה
  choice: 见
  rationale: 保留ראה“看见”的希伯来语诗歌表达；在死亡语境中可隐含“经历、遭遇”之意，而不在正文中将隐喻解释掉。
- source_word: הַשָּׁחַת
  choice: 深坑
  rationale: שחת在诗歌的死亡语境中可指坑、坟墓或朽坏。“深坑”保留具体意象，并让其继续承载死亡与毁灭的广义内涵。
theological_decisions:
- issue: 死亡语境中שחת的含义
  choice: 深坑
  alternative: 坟墓；朽坏
  rationale: “深坑”保留原文诗歌意象及其语义张力，不把所指过早限定为埋葬之处或身体腐朽；其他传统可能译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“活下去”自然表达持续生存；“不见深坑”保留原文以“看见”表示“经历”的含蓄说法。本节承接上一节，故以“使他能”呈现目的或结果关系。
