  text: וְ֭/יֵקַר פִּדְי֥וֹן נַפְשָׁ֗/ם וְ/חָדַ֥ל לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/008.yaml
  text: For the ransom of their life is costly[a], and it ceases forever[b],
translation:
  language: zh_hans
  text: 赎回他们性命[a]的赎价极其昂贵，永远也无法付清[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”也可译作“生命”或“人”；希伯来语 נֶפֶשׁ 在这里不一定专指与身体相对的“灵魂”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“便永远止息”。这句话十分简略，也可理解为赎价永远无法付足，或人只得永远放弃赎回的尝试。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵקַר
  choice: 代价高昂
  rationale: יקר表示贵重、昂贵；与“赎价”语境结合，译为“代价高昂”自然地保留经济交易的比喻，又不额外强化为“贵得无法支付”。
- source_word: פִּדְיוֹן
  choice: 赎回……的代价
  rationale: 该词指为使人获释而付出的赎价。汉语用“赎回……的代价”既清楚表达交易含义，也能顺畅连接“生命”。
- source_word: נַפְשָׁם
  choice: 他们的生命
  rationale: נפש在此主要指人的生命或活着的人，不必限定为与身体相对的非物质“灵魂”。
- source_word: וְחָדַל לְעוֹלָם
  choice: 永远也付不起
  rationale: 原文是高度压缩的表达，直译近似“便永远止息”。结合赎价的语境，此处表达赎价始终无法付成或赎回之举必须作罢；正文采用自然汉语呈现其语境意义，同时以脚注保留字面表达和歧义。
theological_decisions:
- issue: נפש在死亡与赎价语境中的含义
  choice: 生命
  alternative: 灵魂
  rationale: 本诗讨论人不能用赎价使人免于死亡；“生命”最贴合上下文，也避免把后来的身灵二分观念带入该词。
- issue: וְחָדַל לְעוֹלָם的主语与确切含义
  choice: 永远也付不起
  alternative: 便永远止息；人只得永远作罢；永远不能足够
  rationale: 希伯来语没有明说是谁或什么“止息”，语句也十分省略。正文依赎价语境译出无法支付的含义，但不把这一解释伪装成毫无歧义，故在脚注列出较字面的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“付不起”是普通读者熟悉的经济用语，与本节赎价意象相合；脚注说明原文的省略和多义，避免正文过度确定化。
