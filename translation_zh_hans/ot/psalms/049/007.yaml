  text: אָ֗ח לֹא פָדֹ֣ה יִפְדֶּ֣ה אִ֑ישׁ לֹא יִתֵּ֖ן לֵ/אלֹהִ֣ים כָּפְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/007.yaml
  text: Surely no man can redeem a brother[a], or give to God his ransom—
translation:
  language: zh_hans
  text: 任何人都绝不能赎回弟兄[a]，也不能把他的赎价交给上帝——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可译作：“一个弟兄绝不能赎回另一个人。”也有人把开头理解为强调语，译作：“诚然，谁也不能赎回自己的弟兄。”希伯来原文的语序十分简练，句法关系并不完全明确。
    reason: 保留 אָח 与 אִישׁ 之间可能的不同句法关系，以及开头一词的另一种传统理解。
lexical_decisions:
- source_word: אָח
  choice: 弟兄
  rationale: 该词本义为“兄弟”。此处可能指亲近的同胞或另一个人；译作“弟兄”保留单数和亲属意象，不直接泛化为“任何人”。
- source_word: פָדֹה יִפְדֶּה
  choice: 绝不能赎回
  rationale: 不定式绝对式与未完成式连用，加强动词语气；在否定句中译作“绝不能”，自然表达彻底无力赎回的含义。
- source_word: אִישׁ
  choice: 任何人都
  rationale: אִישׁ为单数“人、男人”；此处具有泛指作用。现代汉语用“任何人都”准确表达全称否定，同时不暗示只有男性在内。
- source_word: לֵאלֹהִים
  choice: 给上帝
  rationale: 在诗篇语境中 אֱלֹהִים 指独一的上帝；“把……交给上帝”符合现代汉语支付赎价的表达。
- source_word: כָּפְרוֹ
  choice: 他的赎价
  rationale: כֹּפֶר指为使人获释或保全性命而付的代价。“赎价”保留经济与救赎意象，避免加入原文未明确要求的祭祀性“赎罪”含义。
theological_decisions:
- issue: 向上帝交付 כֹּפֶר 的含义
  choice: 为人的性命向上帝交付赎价
  alternative: 向上帝献上赎罪价；泛指换取释放的代价
  rationale: 上下文强调人无法用财富使自己或他人免于死亡。“赎价”保留向上帝付出代价以求释放的图像，却不预先把它限定为某种祭祀赎罪制度。
- issue: 赎回者与被赎者的句法关系
  choice: אִישׁ作主语，אָח作前置宾语：任何人都不能赎回弟兄
  alternative: אָח作主语：一个弟兄不能赎回另一个人；或将开头理解为强调语“诚然”
  rationale: 主译顺应本节平行结构及主要语境，把“人”理解为实施赎回者；脚注保留希伯来语简练语序所产生的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“赎回”和“赎价”保留原文重复的救赎词场；句末破折号承接下一节对赎价高昂的说明。脚注标记[a]已置于相关词后。
