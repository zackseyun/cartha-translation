  text: כִּֽי נַ֭פְשׁ/וֹ בְּ/חַיָּ֣י/ו יְבָרֵ֑ךְ וְ֝/יוֹדֻ֗/ךָ כִּי תֵיטִ֥יב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/018.yaml
  text: For his soul blesses itself during his life[a], and they praise you when you do well for yourself.
translation:
  language: zh_hans
  text: 因为他活着的时候自以为有福[a]；人也称赞你，当你为自己谋得好处时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他在世时祝福自己（即认为自己有福）；当你为自己谋得好处时，人就称赞你。”
    reason: 保留נַפְשׁוֹ יְבָרֵךְ的较直显反身表达，以及תֵיטִיב לָךְ可指为自身带来好处的开放含义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明富足者虽自庆有福、受人称赞，终究仍要死亡；译作“因为”保留论证关系。
- source_word: נַפְשׁוֹ
  choice: 自己
  rationale: נֶפֶשׁ在此与动词构成反身性表达，所指是整个人自身。直译“他的灵魂”在现代汉语中容易被误解为灵魂独立施事，因此正文采用自然的“自己”，脚注保留较贴近字面的可能表达。
- source_word: בְּחַיָּיו
  choice: 活着的时候
  rationale: 表达“在其一生中、尚在人世时”的时间范围；现代汉语自然明白。
- source_word: יְבָרֵךְ
  choice: 以为有福
  rationale: 这里的祝福用语带反身意味，即把自己看作蒙福之人；“自以为有福”既切合语境，也不额外断定福分是否真实。
- source_word: וְיוֹדֻךָ
  choice: 人就称赞你
  rationale: 动词可指称颂、感谢；此处无明确复数主语，宜作泛指的“人”。财富与顺遂带来的社会赞誉使“称赞”比“感谢”更合语境。
- source_word: כִּי
  choice: 若
  rationale: 第二个כִּי引出受称赞的情形，可理解为“当……时”或“因为”。汉语“若”简洁表达一般性的条件情形，同时不把因果关系说得过死。
- source_word: תֵיטִיב לָךְ
  choice: 使自己亨通
  rationale: יטב的使役式与לָךְ可表达使自身处境良好、为自己谋得好处。在财富语境中“亨通”自然，但原语也可能包含“善待自己”的意味，故收入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“自以为有福”传达希伯来语反身习语，避免生硬的“他的灵魂祝福自己”；分号呈现两小句之间紧密并列、互相阐释的关系。
