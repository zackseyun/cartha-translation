  terminology: “有福”适当对应此处“祝福自己／视自己为有福”的表达，不引入额外神学判断。“称赞”适切对应יוֹדֻךָ在社会赞誉语境中的含义。“为自己谋得好处”保留תֵיטִיב לָךְ的自利／自我境况改善的开放性，不限定为物质亨通或道德意义的善待。
