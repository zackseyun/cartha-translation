    reason: lexical_alternative
lexical_decisions:
- source_word: אַטֶּה
  choice: 我要侧耳听
  rationale: 希伯来语 נטה 的使役式在以“耳”为宾语时表示使耳倾向、专心聆听。中文“侧耳听”自然保留了主动留心聆听的意象。
- source_word: לְמָשָׁל
  choice: 箴言
  rationale: מָשָׁל 可指箴言、比喻或智慧格言；在本篇智慧诗的语境中，“箴言”最贴切，同时以脚注保留“比喻”等可能。
- source_word: אָזְנִי
  choice: 耳
  rationale: 原文为单数并带第一人称单数后缀；中文惯用语“侧耳听”不必显出领属词，主语“我”已明确其为“我的耳”。
- source_word: אֶפְתַּח
  choice: 解开
  rationale: פתח 的基本义为“打开”。与“谜语”搭配时，中文“解开”既延续开启的隐喻，也自然表达将隐晦之言展开陈明，而不限定为单纯解释。
- source_word: בְּכִנּוֹר
  choice: 用琴
  rationale: כִּנּוֹר 指古代里拉琴一类的弦乐器；“琴”是现代中文简洁自然的对应，介词 ב 在此按工具义译为“用”。脚注说明更精确的乐器类别及“在琴声中”的句法可能。
- source_word: חִידָתִי
  choice: 我的谜语
  rationale: חִידָה 可指谜语、隐语或难解之言。“谜语”清楚保留其需要领悟的性质，第一人称领属也按原文保留。
