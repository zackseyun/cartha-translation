  text: 我要侧耳听箴言[a]；我要用琴声道出我的隐语[c]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“比喻”或“智慧格言”。希伯来语 מָשָׁל 可指箴言、比喻或智慧性的言语。
    reason: lexical_alternative
  - marker: b
