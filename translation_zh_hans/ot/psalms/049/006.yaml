  text: those who trust in their wealth and boast in the abundance of their riches—[a][b]
translation:
  language: zh_hans
  text: 那些倚仗自己的财富、以丰厚的财宝自夸的人——[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以财宝的丰厚为荣。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来语 חַיִל 也可指“力量”或“资源”，但这里与“财宝”平行，表明所指的是物质财富。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּטְחִים
  choice: 那些倚仗……的人
  rationale: 带冠词的阳性复数主动分词在此作名词用，指以倚仗财富为特征的一类人；“那些……的人”自然保留这一用法。
- source_word: עַל
  choice: 倚仗
  rationale: 与 בטח 连用时标明信赖、依靠的对象；汉语以“倚仗”整体表达该结构，比逐字译出介词更自然。
- source_word: חֵילָם
  choice: 自己的财富
  rationale: חַיִל 可指力量、军力、资源或财富；本句与“财宝丰厚”构成平行，语境支持物质财富之义。“自己”清楚表达复数领属关系。
- source_word: וּבְרֹב
  choice: 因……丰厚
  rationale: רֹב 表示数量多、丰盛；介词 בְּ 在夸耀的语境中可表达所夸耀的根据或对象。译为“因……丰厚”符合现代汉语，同时保留因财富众多而自夸的含义。
- source_word: עָשְׁרָם
  choice: 财宝
  rationale: עֹשֶׁר 指财富、富有；用“财宝”与前面的“财富”有所变化，保留诗句平行而不把两个词完全合并。
- source_word: יִתְהַלָּלוּ
  choice: 夸耀
  rationale: הלל 的 Hitpael 形式在此意为自夸、以某事为荣；“夸耀”清楚、庄重，也适合诗歌语体。
