  text: כַּ/צֹּ֤אן לִֽ/שְׁא֣וֹל שַׁתּוּ֮ מָ֤וֶת יִ֫רְעֵ֥/ם וַ/יִּרְדּ֘וּ בָ֤/ם יְשָׁרִ֨ים לַ/בֹּ֗קֶר ו/ציר/ם לְ/בַלּ֥וֹת שְׁא֗וֹל מִ/זְּבֻ֥ל לֽ/וֹ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/014.yaml
  text: Like sheep they are appointed for Sheol[a]; death will shepherd them, and the upright will rule over them in the morning. Their form will waste away in Sheol[d][c][b], far from its lofty dwelling.
translation:
  language: zh_hans
  text: 他们如同羊群，被安置在阴间[a]；死亡必牧养他们。到了早晨，正直人必管辖他们。他们的形体必被阴间消灭[b][c]，远离尊贵的居所[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”指死者所在之境，含义比实体的“坟墓”更广；这里不是“地狱”的同义词。
    reason: cultural_note
  - marker: b
    text: “他们的形体”所据的希伯来文含义有争议；也可理解为“他们的磐石”或“他们的力量”。
    reason: lexical_alternative
  - marker: c
    text: 本句希伯来文十分困难；“必被阴间消灭”是按一种可行的句法理解译出。也可译作“他们的形体必在阴间消损”，或作“他们的力量必被耗尽”。
    reason: alternative_reading
  - marker: d
    text: 末尾短语的希伯来文句法及代词所指不明确。“尊贵的居所”按一种理解译出；也可理解为“阴间成为他们的居所”，或作类似译法。
    reason: alternative_reading
lexical_decisions:
- source_word: כַּצֹּאן
  choice: 如同羊群
  rationale: צֹאן是集合名词，指羊群或小型牲畜；此处译为“羊群”自然地保留了整群被驱赶、无力自主的比喻。
- source_word: לִשְׁאוֹל שַׁתּוּ
  choice: 被安置在阴间
  rationale: שַׁתּוּ表示被放置、安置，לִשְׁאוֹל表示归宿或趋向；译文保留这种被置于既定归宿的意味，但不额外强化为神学上的“预定”。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל所指宽于实体坟墓，是死者所在之境；“阴间”是现代中文圣经语域中较为简明且不等同于“地狱”的对应词。
- source_word: מָוֶת יִרְעֵם
  choice: 死亡要牧养他们
  rationale: יִרְעֵם来自רעה“牧放、牧养”；直译保留“羊群—牧者”的延续意象，以及由死亡充当牧者的反讽。
- source_word: וַיִּרְדּוּ בָם יְשָׁרִים
  choice: 正直人必管辖他们
  rationale: יְשָׁרִים是“正直的人”；动词在此最自然地表达统治、管辖，避免将其过度具体化为“践踏”。
- source_word: לַבֹּקֶר
  choice: 到了早晨
  rationale: 保留时间表达及其可能暗示的局势逆转，却不明确规定“早晨”所代表的末世或其他神学时点。
- source_word: וְצוּרָם
  choice: 他们的形体
  rationale: 马所拉文本的词形和语境关系困难；“形体”能与随后的“消损”构成通顺意义，但“磐石／力量”等词源上更直接的可能性须在脚注中保留。
- source_word: לְבַלּוֹת
  choice: 必……消损
  rationale: בלה表示磨损、衰残或耗尽；“消损”既保留渐趋败坏的含义，也符合庄重的诗歌语体。
- source_word: מִזְּבֻל לוֹ
  choice: 远离其高大的居所
  rationale: זְבֻל可指高处或尊贵的居所，而整个短语句法极难；正文采用一种可通读的理解，同时以脚注说明其他可能读法。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 坟墓；死者之境
  rationale: “坟墓”过窄，容易只指埋葬之处；“阴间”较能保留希伯来词所指死者领域的宽泛性，同时不把它等同于后世教义中的地狱。
- issue: “早晨”的含义
  choice: 保留为未加解释的时间意象
  alternative: 明确译作复活、审判或得胜之时
  rationale: 原文只说“到了早晨”，虽可能象征逆转或伸冤，却没有明说具体教义事件，因此不在正文中消除其张力。
- issue: 正直人与死者之间的关系
  choice: 必管辖他们
  alternative: 必践踏他们
  rationale: “管辖”较符合此处动词的通常意义，并保留诗中正直人与倚仗财富者地位反转的图景，不增添惩罚方式。
translation_notes:
  register: 采用现代、庄重而可理解的普通话诗歌语体。“牧养”刻意保留原文羊群意象；“管辖”清楚而不过度古雅。“阴间”沿用中文圣经中可辨识的术语，并以脚注明确其范围。对וְצוּרָם及מִזְּבֻל לוֹ的困难不在正文中武断解决，而以脚注保存真实歧义。
