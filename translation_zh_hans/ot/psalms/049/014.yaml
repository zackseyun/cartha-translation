  rationale: 修订只处理末句中可安全改善的语义与中文表达：以“尊贵的”表达זְבֻל所含的崇高／尊贵意味，避免“高大的”所引起的物理尺寸含义；同时以“必被阴间消灭”采用原文中可行的施事分析。由于该句文本和句法困难，脚注明确保存“形体／磐石／力量”及末语结构的歧义，而不将任何一种解释当作确定结论。
