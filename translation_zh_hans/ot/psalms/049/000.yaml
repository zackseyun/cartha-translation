- source_word: לִבְנֵי קֹרַח
  choice: 可拉子孙的
  rationale: ל־ 在此可表示归属、作者、用途或关联；正文采用自然且相对开放的“……的”，不把关系限定为作者身份，并以脚注说明其他可能。
- source_word: קֹרַח
  choice: 可拉
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 该词是配合音乐的诗歌体裁名称；题注中译作“诗”自然凝练，也符合中文诗篇的传统表达。
