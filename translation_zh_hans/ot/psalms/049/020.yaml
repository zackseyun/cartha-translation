  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/020.yaml
  text: Man in honor[a], yet without understanding, is like the beasts that perish.
translation:
  language: zh_hans
  text: 人虽享尊荣，却不明悟，如同必灭亡的兽类。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人虽享尊荣，却不明悟，如同兽类。”希伯来文末尾的动词也可能表示“相像”，而非“灭亡”。
    reason: 保留希伯来文末尾动词的另一种可能读法。
lexical_decisions:
- source_word: אָדָם
  choice: 人
  rationale: 此处单数作泛指，用“人”自然地表达普遍、箴言式的论断，也不把所指局限于某一个个体。
- source_word: בִּיקָר
  choice: 身居尊荣
  rationale: 该短语表示处于尊贵、荣耀或显赫的地位；“身居尊荣”既保留状态含义，又符合庄重的现代汉语表达。
- source_word: וְלֹא יָבִין
  choice: 却不明悟
  rationale: בין 表示理解、辨明；“却”传达尊荣与缺乏洞见之间的反差，“明悟”简洁而有诗意。
- source_word: נִמְשַׁל
  choice: 就如……一样
  rationale: 该词的尼法勒形式表示被比作或相像；此译法在汉语中自然，并清楚呈现比喻关系。
- source_word: כַּבְּהֵמוֹת
  choice: 牲畜
  rationale: בְּהֵמוֹת 在这里泛指与人相对的兽类；“牲畜”保持诗篇中人与无理性动物之间的鲜明对照。
- source_word: נִדְמוּ
  choice: 灭亡的
  rationale: 结合全诗关于财富、尊荣不能使人逃脱死亡的主题，将此词理解为“灭亡”能形成凝练有力的结句；其可能表示“相像”的读法另以脚注保存。
theological_decisions:
- issue: 末尾动词 נִדְמוּ 的含义
  choice: 按“灭亡”理解，修饰前面的“牲畜”
  alternative: 按“相像”理解，即“他如同牲畜；他们彼此相像”
  rationale: “灭亡”读法与本诗反复强调人在尊荣中仍无法逃避死亡的主题紧密相合。不过，该词在此处也可能与“相像”有关，因此不在正文中消除这一释义张力，而在脚注中注明。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留原文的箴言式语气、平行节奏以及“尊荣—不明悟—牲畜”的强烈反差。
