  yaml_path: translation/ot/psalms/120/006.yaml
  text: My soul has long dwelt with one who hates peace[a].
translation:
  language: zh_hans
  text: 我已与恨恶和平的人同住许久[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我与恨恶和平的人同住太久了。”希伯来文开头强调时间长，也可能暗示这段时间长得令人难以忍受。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: 许久
  rationale: 此词与后面的动词连用，表示持续时间长。译作“许久”自然表达长期持续；“太久”也有可能，但会更明确地加入“过度”的判断。
- source_word: שָׁכְנָה
  choice: 同住
  rationale: שכן表示居住、定居；结合עִם，“同住”既保留居住含义，也自然表达与某人共处。完成体与时间表达合用，译成“已……许久”，体现过去开始且至今仍有现实影响。
- source_word: לָּהּ
  choice: 不另行译出，以“我”为句子主语
  rationale: 这个阴性单数代词后缀在句法上较难解释，通常视为与נַפְשִׁי相呼应的复指或冗余成分。中文不宜勉强另加代词。
- source_word: נַפְשִׁי
  choice: 我
  rationale: נפש在这里指说话者本人。现代汉语若直译“我的灵魂同住”较不自然，因此用“我”准确传达整体人格，同时保持诗句简洁。
- source_word: עִם
  choice: 与
  rationale: 该介词表示相伴、共处；“与”直接而庄重。
- source_word: שׂוֹנֵא
  choice: 恨恶……的人
  rationale: 分词表示持久的性情或特征。“恨恶……的人”保留其动词力量，胜于仅译作“……的敌人”。
- source_word: שָׁלוֹם
  choice: 和平
  rationale: שָׁלוֹם可指和平、完整和福祉；本节处在敌意与和平相对的语境中，“和平”最清楚自然。
