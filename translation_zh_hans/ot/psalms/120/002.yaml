  text: יְֽהוָ֗ה הַצִּ֣ילָ/ה נַ֭פְשִׁ/י מִ/שְּׂפַת שֶׁ֑קֶר מִ/לָּשׁ֥וֹן רְמִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/002.yaml
  text: O Yahweh[a], deliver my soul from lying lips[b], from a deceitful tongue.
translation:
  language: zh_hans
  text: 雅威啊，求你救我[a]脱离说谎的嘴唇[b]，脱离诡诈的舌头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“我的生命”或“我的灵魂”；这里也可指“我本人”。
    reason: lexical_alternative
  - marker: b
    text: 也可直译为“脱离虚假的嘴唇，脱离诡诈的舌头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来神名四字母的通常拟音译出专名，不以“主”这一称号替代；“雅威”在现代汉语中简洁、清楚。
- source_word: הַצִּילָה
  choice: 求你救……脱离
  rationale: 这是נצל的祈使形式，表达恳求搭救；“救……脱离”既符合汉语祷告语体，也自然衔接两个由מִן引出的威胁来源。
- source_word: נַפְשִׁי
  choice: 我
  rationale: נפש在此指说话者本人或其性命。正文译作“我”最自然，同时以脚注保留“我的性命／我的魂”的字面表达和语义幅度。
- source_word: מִשְּׂפַת שֶׁקֶר
  choice: 脱离说谎的嘴唇
  rationale: שׂפה字面为“嘴唇”，在此借指言语；שׁקר表示虚假。保留“嘴唇”可呈现原诗与下句“舌头”的身体意象和平行结构。
- source_word: מִלָּשׁוֹן רְמִיָּה
  choice: 脱离诡诈的舌头
  rationale: לשון字面为“舌头”，借指言语；רמיה表示欺骗、诡诈。译文保留名词性身体意象，并用“诡诈的”自然表达希伯来语附属结构。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 译作音译专名“雅威”，保留以色列上帝的个人名，而不以称号替代；不据任何宗派传统附加解释。
- issue: נַפְשִׁי所指的范围
  choice: 正文译“我”，脚注保留“我的性命／我的魂”
  alternative: 我的灵魂；我的性命
  rationale: 此处נפש可指整个人、生命或“魂”。单译“灵魂”容易在汉语中把含义收窄为与身体相对的非物质部分，因此正文采用自然的“我”，脚注保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语气。“说谎的嘴唇／诡诈的舌头”保留希伯来诗歌的平行结构与具体意象；“求你”明确呈现祈使句在祷告中的恳求语气。
