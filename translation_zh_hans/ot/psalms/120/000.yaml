  text: A Song of Ascents. To Yahweh in my distress I called[a], and he answered me.
translation:
  language: zh_hans
  text: '上行之歌。[a]


    我在患难中求告耶和华，他就回答我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上行之歌”是诗篇120—134篇共有的传统标题；也可译作“登阶之歌”或“上去之歌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: 沿用简明庄重的传统译法；מַעֲלוֹת 可指上行、登阶或朝圣上耶路撒冷，正文保留“上行”的概括性，脚注说明其可能含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式来对应四字神名。
- source_word: בַּצָּרָתָה לִּי
  choice: 我在患难中
  rationale: 自然表达“在我的困境/患难中”，保留说话者身处逼迫困境的语义。
- source_word: קָרָאתִי
  choice: 求告
  rationale: 在以耶和华为对象的语境中，“求告”比一般的“呼叫”更准确地表达祈求。
- source_word: וַיַּעֲנֵנִי
  choice: 他就应允了我
  rationale: 未完成式连续体在此叙述已发生的回应；“应允”自然表达上帝对求告的答复。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经传统中最通行、最易识别的专名表达；不以“主”替换，从而保留原文使用神名的特点。
- issue: 回答是否暗示请求已获满足
  choice: 应允了我
  alternative: 回答了我
  rationale: 这里的 ענה 表示对求告作出回应；“应允”符合诗篇祷告语境，但不进一步说明回应的具体方式，避免添加原文没有的信息。
translation_notes:
  register: 采用现代、庄重而通俗的诗歌语言。标题独立成行，正文保持希伯来语简洁的求告—回应结构；脚注只说明标题中 מַעֲלוֹת 的真实词义范围，不断定其历史背景。
