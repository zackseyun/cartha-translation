  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֶל יְ֭הוָה בַּ/צָּרָ֣תָ/ה לִּ֑/י קָ֝רָ֗אתִי וַֽ/יַּעֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/001.yaml
  text: A Song of Ascents. In my distress I called to Yahweh[a], and he answered me.
translation:
  language: zh_hans
  text: '上行之歌[a]。


    我在患难中向雅威呼求，

    他回答了我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上行之歌”是诗篇120—134篇所用的标题；也可译作“上升之歌”或“登阶之歌”。
    reason: 保留מַעֲלוֹת所含“向上行、上升”的词义，并提示这一固定标题有合理的替代译法。
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: 上行之歌
  rationale: “שִׁיר”直指“歌”；“מַעֲלוֹת”含向上行、上升之意。“上行之歌”既保留原文意象，也是诗篇120—134篇这一组标题的自然、凝练译法。
- source_word: בַּצָּרָתָה לִּי
  choice: 我在患难中
  rationale: 原文直译近似“在临到我的困境中”，这里以现代汉语所有关系表达为“我在患难中”，既自然又保留困苦、窘迫的强度。
- source_word: קָרָאתִי
  choice: 求告
  rationale: 该动词基本义为“呼叫、呼求”。对象是雅威，语境是祷告；“求告”在中文中准确表达向上帝呼求，同时不额外增强为“哀号”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是上帝的专名四字神名YHWH；“雅威”按其通行学术拟音音译，避免用“主”这一称号取代原文专名，也不采用源自较晚混合读法的“耶和华”。
- source_word: וַיַּעֲנֵנִי
  choice: 他就应允了我
  rationale: 该形式表示随后发生的回应。“就”自然呈现叙事上的承接；在祷告语境中，“应允”比一般的“回答”更贴切，而“我”保留了动词中的第一人称宾语。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名YHWH。译作“雅威”保留其专名性质；“主”会把专名替换成称号，“耶和华”则反映较晚形成的混合读法。
- issue: “应允”是否表示请求必然按祈求者所愿实现
  choice: 按祷告语境译为“应允”，不进一步说明回应的具体方式
  alternative: 回答了我
  rationale: ענה的核心是“回答、回应”。“应允”符合诗篇祷告语体，但本节没有交代回应的内容或方式，因此译文不添加具体结果。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。分行呈现标题、呼求和回应；使用“患难”“求告”“应允”等普通读者能够理解、又适合诗篇祷告语境的词。
