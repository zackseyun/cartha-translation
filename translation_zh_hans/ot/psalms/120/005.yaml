  text: אֽוֹיָה לִ֭/י כִּי גַ֣רְתִּי מֶ֑שֶׁךְ שָׁ֝כַ֗נְתִּי עִֽם אָהֳלֵ֥י קֵדָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/005.yaml
  text: Woe to me[a], for I have sojourned in Meshech[b]; I have dwelt among the tents of Kedar.
translation:
  language: zh_hans
  text: '我有祸了！

    因我寄居在米设[a]，

    住在基达的帐篷中[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 米设和基达可能在诗中代表遥远、敌对的民族，并不一定表示诗人曾实际先后或同时住在这两个地方。
    reason: cultural_note
  - marker: b
    text: 或译：“与基达的帐篷同住。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹיָה לִי
  choice: 我有祸了
  rationale: 这是表达个人痛苦与困境的哀叹语。“我有祸了”保留原文简短而沉重的语气，比单纯的“唉”更有力度。
- source_word: כִּי
  choice: 因
  rationale: 在这里引出哀叹的原因；“因”简洁并适合诗歌体。
- source_word: גַרְתִּי
  choice: 我寄居
  rationale: גור表示以外来者身份居留，不只是一般的“居住”；“寄居”保留了漂泊和不属于当地的意味。
- source_word: מֶשֶׁךְ
  choice: 米设
  rationale: 原文为族群或地域专名，按现代中文圣经常用音译保留，以维持历史和诗歌意象。
- source_word: שָׁכַנְתִּי
  choice: 住
  rationale: שכן意为居住、栖居。此处用自然的现代汉语“住”，同时借上下文与“寄居”形成语义层次。
- source_word: עִם
  choice: 在……中
  rationale: 字面是“与……一起”，但结合“帐篷”这一集合性意象，译作“在……中”自然表达住在基达帐篷群体之中的意思；字面译法列入脚注。
- source_word: אָהֳלֵי קֵדָר
  choice: 基达的帐篷
  rationale: 保留原文具体的帐篷意象及“基达”专名，不把这一转喻直接改译为“基达人”。
theological_decisions:
- issue: 米设和基达应按专名直译，还是在正文中解释为遥远、敌对的民族
  choice: 正文保留“米设”和“基达”两个专名
  alternative: 译成“遥远而敌对的民族”，或直接解释为诗人在异族中的生活
  rationale: 希伯来文明确使用两个专名。保留专名可维护原文的历史—诗歌意象，也不武断判定诗人是否曾实际同时住在两地；其可能的诗意功能由脚注说明。
translation_notes:
  register: 采用简洁、庄重的现代汉语诗体，分三行呈现原文的哀叹及两个平行居住语句。“寄居”保留外来者处境，“住”则避免连续使用较书面的同一词语。
