  text: Sharp arrows of a warrior[b][a], with coals of the broom tree.
translation:
  language: zh_hans
  text: 勇士的利箭[a]，连同罗腾木的炭火[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“勇士的锋利之箭。”
    reason: lexical_alternative
  - marker: b
    text: “罗腾木”是生长在沙漠地区的一种灌木；用它烧成的木炭能够长久保持热力。
    reason: cultural_note
lexical_decisions:
- source_word: חִצֵּי
  choice: ……的箭
  rationale: חֵץ的复数构造形，与后面的גִבּוֹר构成所属关系；汉语以“勇士的……箭”自然表达。
- source_word: גִבּוֹר
  choice: 勇士
  rationale: 该词可指强者、勇士或战士；本节以箭为意象，“勇士”既保留力量意味，也符合军事语境。
- source_word: שְׁנוּנִים
  choice: 利
  rationale: 该词源于“磨利”，在此形容箭已经锋利；“利箭”是自然、凝练的现代汉语诗歌表达。
- source_word: עִם
  choice: 连同
  rationale: 准确连接“利箭”与“炭火”两个并列意象，同时比单用“和”更能体现原文的组合关系。
- source_word: גַּחֲלֵי
  choice: 炭火
  rationale: 该词指燃烧或灼热的炭；“炭火”既不额外添加原文没有的形容词，又比仅说“炭”更准确地传达其灼烧意象。
- source_word: רְתָמִים
  choice: 罗腾木
  rationale: 采用该沙漠灌木的传统中文名称；原文复数在此可指这一树种或其木材，汉语用单数类称自然表达。
