  yaml_path: translation/ot/psalms/120/003.yaml
  text: What will he give to you[a], and what more will he add to you, O deceitful tongue?
translation:
  language: zh_hans
  text: 他要给你什么呢，诡诈的舌头啊？还要加给你什么呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他要怎样对付你，诡诈的舌头啊？还要进一步怎样对付你呢？”原文没有明说“他”是谁，可以作一般性的理解；但按上下文，许多人认为是指神施行审判。
    reason: 说明“给……／加给……”在此语境中可按“对付、施行报应”理解，并保留隐含主语的歧义。
lexical_decisions:
- source_word: מַה
  choice: 什么
  rationale: 作为疑问代词引出修辞性问句；“什么”直接保留希伯来文的问法。
- source_word: יִתֵּן
  choice: 他要给
  rationale: נתן 的 Qal 未完成式第三人称阳性单数；译作“他要给”保留未来指向，也不补明原文省略的主语。
- source_word: לְךָ / לָךְ
  choice: 给你
  rationale: 介词 ל 加第二人称后缀在此自然译作“给你”；后一个阴性形式与被呼语称呼的阴性名词“舌头”一致。
- source_word: וּמַה יֹסִיף
  choice: 还要加……什么
  rationale: יסף 的 Hiphil 未完成式有“增加、再加”的含义；“还要加”既保留词义，也呈现上下句递进平行。
- source_word: לָשׁוֹן
  choice: 舌头
  rationale: 保留原文以“舌头”代指言语的生动拟人表达。
- source_word: רְמִיָּה
  choice: 诡诈的
  rationale: 表达欺骗、奸诈之意；“诡诈的舌头”在现代汉语中庄重自然，并保留其道德力度。
theological_decisions:
- issue: 两个第三人称阳性单数动词的隐含主语
  choice: 正文保留“他”，不明确指认
  alternative: 按上下文明确译作“神要怎样对付你”
  rationale: 希伯来文未明说主语。上下文可使人理解为神的审判，但正文不应消除这一真实的语法含混；脚注说明一般性和神审判两种理解。
- issue: נתן……ל 与 יסף……ל 的语义
  choice: 按字面译为“给……、加给……”
  alternative: 意译为“怎样对付……、还要怎样对付……”
  rationale: 字面译法保留两动词的词汇和诗歌平行结构；另一种译法能表达语境中的报应含义，列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。将呼语前置，使中文指向清楚；保留“舌头”的拟人和两句平行结构。脚注标记[a]置于第一问句中，对应其替代译法及隐含主语问题。
