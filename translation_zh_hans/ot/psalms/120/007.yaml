translation:
  language: zh_hans
  text: 我主张和平[a]；但我说话时[b]，他们却要打仗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“我——和平”；这里按其含义译为“我主张和平”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“而当我说话时”。希伯来文连接词也可作较平直的连接，但上下文更支持转折语气。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי שָׁלוֹם
  choice: 我主张和平
  rationale: 希伯来文是无系词短句，直译近于“我——和平”。“我主张和平”自然表达说话者站在和平一边，同时避免“我是和平”在中文中可能产生的本体性含义。
- source_word: וְכִי
  choice: 但……一……
  rationale: וְ与כִי在本处结合上下文表示时间关系，并带有鲜明转折。“但我一开口”自然呈现和平意愿与对方好战反应之间的对照；也可能较平直地理解为“而当……时”。
- source_word: אֲדַבֵּר
  choice: 我一开口
  rationale: דבר的Piel未完成式第一人称单数在此表达诗歌中的一般情形。“开口”是“说话”的自然中文表达，但不补入原文未明说的“谈论和平”。
- source_word: הֵמָּה
  choice: 他们
  rationale: 保留第三人称复数代词，并借助前后强烈对照体现原文的强调。
- source_word: לַמִּלְחָמָה
  choice: 就要战争
  rationale: 介词ל表示朝向、倾向或立场。中文“要战争”与“主张和平”形成简洁平行，也表达他们一心趋向战争，而不额外限定为已经开战。
