  text: אֲנִ֗י בְּ֭/צֶדֶק אֶחֱזֶ֣ה פָנֶ֑י/ךָ אֶשְׂבְּעָ֥ה בְ֝/הָקִ֗יץ תְּמוּנָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/015.yaml
  text: As for me[a], in righteousness I will behold your face; when I awake[b], I will be satisfied with your likeness.
translation:
  language: zh_hans
  text: 至于我，我必在公义中得见你的面；我醒来时[a]，必因你的形像[b]而心满意足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “醒来”可指通常从睡眠中醒来，也可理解为末后得申雪或复活时的苏醒。
    reason: alternative_reading
  - marker: b
    text: 或译“形状”或“样式”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: 在公义中
  rationale: 保留介词短语的凝练表达，并不限定这里的“公义”究竟侧重诗人的正直、上帝的公正申雪，还是某种法理地位。
- source_word: אֶחֱזֶה
  choice: 得见
  rationale: חזה 不只是偶然看见，也可含专注观看、瞻仰之意。“得见”既有庄重感，又自然地表达面对上帝的盼望。
- source_word: פָנֶיךָ
  choice: 你的面
  rationale: 按希伯来文保留具体的“面”，不在正文中直接意译为“同在”。
- source_word: אֶשְׂבְּעָה
  choice: 心满意足
  rationale: שׂבע 表示得到满足或饱足；“心满意足”符合现代汉语，也适合此处属灵和诗歌性的语境。
- source_word: בְּהָקִיץ
  choice: 我醒来时
  rationale: ב 加不定词在这里表示时间。“醒来时”保留原文所未说明的模糊性，不判定这是日常睡醒还是末后的苏醒。
- source_word: תְּמוּנָתֶךָ
  choice: 你的形像
  rationale: תְּמוּנָה 可指形状、形像或样式。“形像”保留具体意象，同时不把它限定为明确的物质形体。
theological_decisions:
- issue: בְּהָקִיץ 是指日常从睡眠中醒来，还是暗示末后的申雪或复活
  choice: 正文译作“我醒来时”，不说明苏醒的性质。
  alternative: 可理解为日常睡醒，也可理解为末后得申雪或复活时的苏醒。
  rationale: 希伯来文本身没有明确界定所指；保留这一张力，可避免把某一种末世论解释写进正文。
- issue: “在公义中”所指的公义归属与性质
  choice: 保留“在公义中”的开放表达。
  alternative: 可解释为诗人的正直、上帝公义的申雪，或法理意义上的公义地位。
  rationale: 原文介词结构简洁，未明确说明公义的主体或具体机制；译文不应替诗句消除这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“至于我”凸显诗人与前文对象的对比；分号保存两行诗意之间的推进关系。正文尽量贴近希伯来文，同时以“因……而心满意足”使末句符合自然汉语。
