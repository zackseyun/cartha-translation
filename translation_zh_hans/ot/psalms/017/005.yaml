base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/005.yaml
  text: My steps have held fast in your paths[b][a]; my feet have not slipped.
translation:
  language: zh_hans
  text: 求你扶持我的脚步，使我行在你的路径上；我的脚步就不致滑跌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “路径”或译“轨迹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמֹךְ
  choice: 紧守
  rationale: 该动词表达牢牢抓住、扶持或持守。正文按陈述理解，与下句“没有滑跌”形成自然平行；同时用脚注保留其可作祈求理解的语法可能。
- source_word: אֲשֻׁרַי
  choice: 我的脚步
  rationale: 该词指脚步或行走的进程；“我的脚步”既自然，也保留原文具体的行路意象。
- source_word: בְּמַעְגְּלוֹתֶיךָ
  choice: 你的路径
  rationale: מַעְגָּל指可供行走的路径、轨道。“路径”符合现代汉语诗体表达，并保留人生行程的隐喻；脚注列出更具象的译法。
- source_word: בַּל
  choice: 没有
  rationale: 该诗歌否定词在此直接否定滑跌，以“没有”表达最自然。
- source_word: נָמֹטּוּ
  choice: 滑跌
  rationale: מוט可指滑动、摇晃或动摇；在脚步意象中，“滑跌”准确而清楚。
- source_word: פְעָמָי
  choice: 我的双脚
  rationale: 该词可指脚步、足迹或脚；与“滑跌”搭配时译作“双脚”符合现代汉语，也与上句“脚步”构成同义平行而避免重复。
theological_decisions:
- issue: 首句是陈述还是祈求
  choice: 正文译作诗人陈述自己的脚步紧守上帝的路径
  alternative: “求你使我的脚步稳行在你的路径上”
  rationale: 希伯来语形式可被理解为表示坚定状态的陈述，也可被理解为求上帝扶持的请求。上下文及与下句完成性陈述的平行支持正文选择，但语法歧义真实存在，故以脚注明示，不据此作神学消解。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。保留“脚步—双脚—路径—滑跌”的具体行路意象和两行平行结构；不把路径抽象改写为品德或教义术语。
