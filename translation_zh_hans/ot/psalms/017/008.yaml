  yaml_path: translation/ot/psalms/017/008.yaml
  text: Keep me like the pupil of the eye[a]; hide me in the shadow of your wings.
translation:
  language: zh_hans
  text: '求你像保护眼中的瞳仁那样保护我；

    把我藏在你翅膀的荫下。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: 求你保护我
  rationale: שׁמר 表示看守、守护或保全。译作“求你保护我”自然地表达祈求语气，也准确传达诗人求上帝护卫的意思。
- source_word: כְּאִישׁוֹן בַּת עָיִן
  choice: 像保护眼中的瞳仁
  rationale: 这一希伯来语表达指眼睛中央的瞳孔，借此描绘对脆弱而珍贵之物的严密保护。汉语补出第二个“保护”，使比喻关系清楚自然，而不改变原意。
- source_word: בְּצֵל
  choice: 在……的荫下
  rationale: צֵל 可指阴影或荫蔽之处。与“翅膀”连用时，“荫下”在现代汉语中既自然，又保留遮蔽保护的诗歌意象。
- source_word: כְּנָפֶיךָ
  choice: 你翅膀
  rationale: כָּנָף 意为“翅膀”。直译保留原文以鸟翼描绘上帝保护的具象比喻，不将其抽象化为“看顾”或“保护”。
- source_word: תַּסְתִּירֵנִי
  choice: 把我藏在
  rationale: סתר 的使役式在此表示使某人隐藏、将某人藏起。“把我藏在”直接传达动词意义，也与后面的荫蔽意象自然衔接。
theological_decisions:
- issue: 如何翻译保护眼睛的希伯来语习语
  choice: 正文按习语所指译为“眼中的瞳仁”
  alternative: 直译为“眼睛的女儿”
  rationale: 原文以瞳仁这一敏感而受严密保护的部位为喻，并非提出独立的教义命题。正文传达习语实际所指，脚注保留其希伯来语字面形式。
- issue: 是否保留上帝“翅膀”的形象
  choice: 保留“你翅膀的荫下”这一比喻
  alternative: 意译为“在你的保护下”
  rationale: 原文使用具体的诗歌形象表达上帝的庇护。保留比喻能维持经文的文学与神学张力，避免用解释取代原文意象。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“求你”明确诗歌中的祈求语气；分为两个平行诗行，以呈现原文的诗体结构。
