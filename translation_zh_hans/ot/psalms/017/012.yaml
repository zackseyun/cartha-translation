lexical_decisions:
- source_word: דִּמְיֹנוֹ
  choice: 他如
  rationale: 原文直译近于“他的形状如”或“他的样子像”，但现代汉语如此表达较显重复；用“他如”自然地传达直接比拟，同时不改变所指对象。
- source_word: כְּאַרְיֵה
  choice: 如狮子
  rationale: 比较前缀כְּ与“狮子”构成明喻；“如狮子”简洁、庄重，并适合诗体。
- source_word: יִכְסוֹף
  choice: 渴望
  rationale: 该动词表示强烈向往或欲求；在猛兽捕食语境中，“渴望”保留其欲求强度，而不额外加入行动已经开始的含义。
- source_word: לִטְרוֹף
  choice: 撕裂猎物
  rationale: טרף在猛兽意象中可指撕裂、攫取或吞食猎物；“撕裂猎物”既呈现动作的猛烈，也在汉语中补明隐含的捕食对象。
- source_word: וְכִכְפִיר
  choice: 又如少壮狮子
  rationale: כְּפִיר指年轻而有力的狮子；“少壮狮子”比“小狮子”更能避免幼兽意味。连接词וְ译为“又”，保留第二重平行比喻。
- source_word: יֹשֵׁב
  choice: 蹲伏
  rationale: 字面义为“坐着、停留”；在狮子藏身伺机的语境中，“蹲伏”自然呈现其姿态和伏击意味，但不采用更强解释性的“潜伏”。
- source_word: בְּמִסְתָּרִים
  choice: 在隐蔽之处
  rationale: 该复数名词指隐藏、遮蔽的地方；汉语集合性表达“隐蔽之处”自然地保留地点含义。
