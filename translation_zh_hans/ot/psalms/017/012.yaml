  text: He is like a lion eager to tear[c][b][a], like a young lion sitting in hiding places.
translation:
  language: zh_hans
  text: 他像一头狮子，急欲撕裂；又像一头年轻的狮子，坐在隐蔽处。[a]
  philosophy: optimal-equivalence
