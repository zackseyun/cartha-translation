  text: קוּמָ֤/ה יְהוָ֗ה קַדְּמָ֣/ה פָ֭נָי/ו הַכְרִיעֵ֑/הוּ פַּלְּטָ֥/ה נַ֝פְשִׁ֗/י מֵ/רָשָׁ֥ע חַרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/013.yaml
  text: Rise up[a], O Yahweh; confront him, bring him low[b]; deliver my life from the wicked by your sword.
translation:
  language: zh_hans
  text: 耶和华啊，求你起来，迎面拦阻他，使他仆倒！求你用你的刀剑[a]救我的性命[b]脱离恶人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“救我的性命脱离恶人；恶人是你的刀剑。”希伯来语也可能把恶人描写为耶和华手中的刀剑，即他所使用的工具。
    reason: alternative_reading
  - marker: b
    text: 希伯来语为“נפש”（尼斐示），常可译作“灵魂”，这里更可能指人的“性命”或“本人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: 求你起来
  rationale: 这是向耶和华发出的祈使呼求；“求你起来”既保留紧迫感，也符合现代汉语祷告语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代简体中文读者熟悉的专名“耶和华”译出四字神名，不以称号替代。
- source_word: קַדְּמָה פָנָיו
  choice: 迎面拦阻他
  rationale: 原文直译近于“到他面前”；在敌对冲突的语境中表示迎上前去阻挡或对抗。“迎面拦阻”兼顾具体意象和语境含义。
- source_word: הַכְרִיעֵהוּ
  choice: 使他屈服
  rationale: 该使役式命令表达使对方屈膝、降卑或倒下；“使他屈服”保留使敌手被压服的含义，而不过度限定其具体姿态。
- source_word: פַּלְּטָה
  choice: 救……脱离
  rationale: 该动词表示搭救、解救；“救……脱离”在现代汉语中自然，并保留诗篇呼求拯救的庄重语气。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נפש可指生命、本人或魂；此处处于暴力威胁的语境，“我的性命”最准确地表达诗人受威胁的生命。
- source_word: מֵרָשָׁע
  choice: 脱离恶人
  rationale: 单数形式可指一个恶人，也可作类称；上下文以单数代词指敌手，因此保留简洁的“恶人”，不额外指定性别。
- source_word: חַרְבֶּךָ
  choice: 用你的刀剑
  rationale: 主译文将“你的刀剑”理解为耶和华施行拯救的工具；“刀剑”保留原文的武力意象，相关句法歧义则收入脚注。
theological_decisions:
- issue: “你的刀剑”与“恶人”的句法及神学关系
  choice: 将“你的刀剑”理解为耶和华搭救诗人的工具
  alternative: 将恶人视为“你的刀剑”，即恶人是耶和华手中的工具
  rationale: 希伯来语 מֵרָשָׁע חַרְבֶּךָ 结构紧凑，两种理解在句法上均有可能。上下文连续呼求上帝亲自介入，主译采用工具性理解；但另一读法会影响对上帝主权及恶人作为工具的理解，因此以脚注保留。
- issue: נפש在此处是“魂”还是“性命”
  choice: 我的性命
  alternative: 我的灵魂／我自己
  rationale: 这里所求的是从暴力敌手手中获救，重点是具体生命受到威胁，而非在区分身体与非物质灵魂；故主译为“性命”，同时注明原词的较宽语义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“耶和华啊”保留直接呼告；三个祈使动作以“求你”统摄，并用感叹号体现紧迫性。脚注标记分别紧随存在歧义的“刀剑”和具有多义性的“性命”。
