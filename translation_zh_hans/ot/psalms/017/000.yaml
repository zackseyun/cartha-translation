  yaml_path: translation/ot/psalms/017/000.yaml
  text: A prayer of David. Hear righteousness[a], Yahweh; pay attention to my cry; give ear to my prayer from lips without deceit.
translation:
  language: zh_hans
  text: '大卫的祷告。


    耶和华啊，求你垂听正当的申诉[a]，留心听我的呼求；求你侧耳听我那从没有诡诈的嘴唇发出的祷告。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公义”或“正义”。希伯来语“公义”也可表示正义、公正或正当的案情；这里可能指诗人所陈述的正当案件。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: 大卫的祷告
  rationale: 标题可表示“大卫的祷告”，也可能有“献给大卫、与大卫有关”的广义；此处采用传统且自然的标题表达。
- source_word: צֶדֶק
  choice: 公义
  rationale: 保留希伯来文抽象名词的形式及其语义张力；该词也可指正义、正当之事或正当的申诉，故附注说明。
- source_word: רִנָּתִי
  choice: 我的呼求
  rationale: 在本祈祷语境中指向神发出的恳切呼喊；“呼求”既自然，又不把它误解为欢呼或歌唱。
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: 这祷告不是出于诡诈的嘴唇
  rationale: 明确该短语修饰诗人的祷告及其发言方式，同时保留“嘴唇”的具体意象和“诡诈”的道德含义。
theological_decisions:
- issue: 诗人所求垂听的“公义”具体指什么
  choice: 正文保留“公义”，不明确限定为诗人自己的义或案件
  alternative: 求你垂听我正当的申诉／求你主持公道
  rationale: 原文只用抽象名词צֶדֶק，可能指公义、正义或正当的案情。正文不替原文消除这种含混，脚注则提示语境中的可能理解。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 上主／雅威
  rationale: 采用现代简体中文圣经读者熟悉的专名形式，表明原文使用的是神的专名，而非普通称号。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。三个听觉祈使依次译为“垂听、留心听、侧耳听”，保留原文的平行递进；末句拆解为解释性分句，以避免生硬的“从无诡诈的嘴唇而来的祷告”，同时不改变其意义。
