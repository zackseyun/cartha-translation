  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד שִׁמְעָ֤/ה יְהוָ֨ה צֶ֗דֶק הַקְשִׁ֥יבָ/ה רִנָּתִ֗/י הַאֲזִ֥ינָ/ה תְפִלָּתִ֑/י בְּ֝/לֹ֗א שִׂפְתֵ֥י מִרְמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/001.yaml
  text: A prayer of David. Hear[a], O Yahweh, a just cause; attend to my cry; give ear to my prayer from lips without deceit.
translation:
  language: zh_hans
  text: '大卫的祷告。


    雅威啊，求你垂听正当的申诉[a]，留心听我的呼求，侧耳听我的祷告，出自没有诡诈的嘴唇。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“垂听公义”，即垂听正直、公正之事。希伯来语“公义”（צֶדֶק）可指公义、正义或正当的案件；这里很可能指诗人有理的申诉。
    reason: 保留 צֶדֶק 在抽象的“公义”与具体的“正当申诉”之间的词义空间。
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: 大卫的祷告
  rationale: 按诗篇标题中 לְ 加人名的常见用法，表达作品与大卫的归属或关联；“大卫的祷告”自然简洁，也与正文中的“我的祷告”保持词汇呼应。
- source_word: שִׁמְעָה
  choice: 求你垂听
  rationale: 这是 שׁמע 的祈使式。加“求你”符合汉语祷告语气，“垂听”庄重而仍为现代读者熟悉。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: צֶדֶק
  choice: 我公正的申诉
  rationale: צֶדֶק 在这里作“垂听”的宾语，可指公义、公正之事或有理的案件；结合祈求申辩的语境，“公正的申诉”自然传达其司法性含义，同时用脚注保留词义歧义。
- source_word: הַקְשִׁיבָה
  choice: 留心听
  rationale: 该词要求专注地听；“留心听”既传达加强语气，也避免与前后两个听觉动词完全重复。
- source_word: רִנָּתִי
  choice: 我的呼求
  rationale: רִנָּה 可指响亮的呼喊或欢呼；在哀诉祷告中，“呼求”最贴合恳切求告的语境。
- source_word: הַאֲזִינָה
  choice: 侧耳听
  rationale: 保留希伯来语中侧耳倾听的形象，同时符合汉语诗歌和祷告语体。
- source_word: תְפִלָּתִי
  choice: 我的祷告
  rationale: 直接表达该词的通常含义，并与标题中的 תְּפִלָּה 保持词汇联系。
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: 这祷告并非出于诡诈的嘴唇
  rationale: 将介词短语理解为说明祷告的来源，清楚表达诗人所说的话并非由欺骗的嘴唇发出；分成分号后的独立说明，使现代汉语自然明晰。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列神的四字神名。译作“雅威”保留专名，并采用现代汉语中对 Yahweh 的常见音译；不以“主”这一称号代替。
- issue: צֶדֶק 是抽象的“公义”还是诗人的正当案件
  choice: 我公正的申诉
  alternative: 公义；正义；正当的案件
  rationale: 该词在本句中是“垂听”的宾语，语境偏向诗人请求神审理其有理的申诉。不过原词也可直接表示“公义/正义”，因此不把这一理解绝对化，并以脚注保留另一读法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。连续使用“垂听、留心听、侧耳听”再现原文三个近义听觉祈使词的诗意递进；以“雅威啊”表达直接呼告。末句用分号展开，以避免逐字直译造成生硬，同时保留祷告出自无诡诈之口的意思。
