source:
  edition: WLC
  text: מִֽ/מְתִ֥ים יָדְ/ךָ֨ יְהוָ֡ה מִֽ/מְתִ֬ים מֵ/חֶ֗לֶד חֶלְקָ֥/ם בַּֽ/חַיִּים֮ ו/צפינ/ך תְּמַלֵּ֪א בִ֫טְנָ֥/ם יִשְׂבְּע֥וּ בָנִ֑ים וְ/הִנִּ֥יחוּ יִ֝תְרָ֗/ם לְ/עוֹלְלֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/014.yaml
  text: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[c][b], and they leave their abundance to their children.
translation:
  language: zh_hans
  text: 耶和华啊，求你用你的手救我脱离世人[a]，脱离那些属今世的人；他们的份在今生。你以你所储存的充满他们的腹中；他们因儿子而满足[b]，又把自己的余裕留给年幼的孩子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文句法简省，也可理解为“求你救我脱离世人，借着你的手”，或“求你救我脱离属你手的世人”。
    reason: alternative_reading
  - marker: b
    text: 原文直译：“他们因儿子而满足”。“儿子”为阳性复数；也可能译作“他们的儿子都得饱足”。
    reason: alternative_reading
  - marker: c
    text: “年幼的孩子”原文特指小孩子；也可泛译为“儿女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְתִים יָדְךָ יְהוָה
  choice: 耶和华啊，求你亲手救我脱离世人
  rationale: 承接上一节的求救语意，将重复的介词短语理解为“脱离世人”，并把“你的手”表为施行拯救的方式；希伯来语句法高度压缩，其他可能结构列入脚注。
- source_word: מֵחֶלֶד
  choice: 属今世的人
  rationale: חֶלֶד在此指短暂的现世人生领域；“今世”既表达时间限定，也避免把它误解为抽象的宇宙。
- source_word: חֶלְקָם בַּחַיִּים
  choice: 他们所得的份只在今生
  rationale: “份”保留产业或所得的比喻；上下文支持现世性的理解。“只”显明短语在诗句中的限定作用，但不进一步明说末世结局。
- source_word: וּצְפוּנְךָ
  choice: 你所珍藏的
  rationale: 该词指隐藏或储存之物。采用较宽泛的表达，不武断限定为财富、福分或惩罚。
- source_word: תְּמַלֵּא בִטְנָם
  choice: 使他们饱足
  rationale: 原文直译为“充满他们的腹中”；中文以“饱足”自然传达具体意象及满足之意，并与后句呼应。
- source_word: יִשְׂבְּעוּ בָנִים
  choice: 他们因儿子众多而满足
  rationale: 把恶人视为动词主语，并保留בָנִים的阳性复数“儿子”；“众多”表达以众子为兴旺满足的语境含义。
- source_word: וְהִנִּיחוּ יִתְרָם
  choice: 又把剩余的财物留给
  rationale: יֶתֶר指余剩、盈余；结合传给后代的语境译为“剩余的财物”，比单说“剩余”更清楚。
- source_word: לְעוֹלְלֵיהֶם
  choice: 自己的幼儿
  rationale: עוֹלֵל较具体地指年幼的孩子；译作“幼儿”保留年龄色彩。
theological_decisions:
- issue: “世人”与“你的手”的句法关系及上帝护理
  choice: 正文理解为诗人求耶和华亲手施救，使他脱离世人。
  alternative: “脱离你手下的世人”或“脱离世人——他们是你的手”。
  rationale: 原文结构简省，可把“你的手”理解为拯救的工具、与世人的所属关系，甚至把世人理解为上帝所用的手。正文采用中文较通顺且承接上节的读法，同时以脚注保存歧义，不把敌人明确界定为审判工具。
- issue: 恶人在今生所得的份
  choice: 描述他们的份限于今生。
  alternative: “他们的份在活人中”或“他们在生命中有自己的份”。
  rationale: 上下文支持现世兴盛与诗人盼望之间的对照，但本节并未完整陈述死后审判，因此不在正文中扩展末世论结论。
- issue: “你所珍藏的”究竟是恩惠还是惩罚
  choice: 保留为中性的“你所珍藏的”，并按句法说它使他们饱足。
  alternative: 上帝所储备的福分、财富，或所储备的刑罚。
  rationale: 原词本身只表达隐藏、储存之物；虽然语境多被理解为丰盛供应，译文不把其神学性质说得超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“耶和华”保留圣名的传统汉语形式；“今世／今生”呈现时间性的平行关系。正文适度补出“求你……救我”以承接第13节省略而延续的祈求，但通过脚注保留原文关于“你的手”的句法歧义。所有脚注标记均已置于正文对应位置。
