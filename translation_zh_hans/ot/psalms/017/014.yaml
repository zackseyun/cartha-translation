  - severity: medium
    issue: “亲手”固定了“你的手”的句法关系
    rationale: 原文可理解为“借着你的手”施行拯救，也可能指“属你手的人”。“亲手”强调亲自行动，未能保留所需歧义。
  - severity: medium
    issue: “因儿子众多而满足”添加“众多”
    rationale: בנים是“儿子”的阳性复数，但原文并未直接说“众多”；应保留为“因儿子而满足”，并在脚注说明另一种主语划分。
  - severity: medium
    issue: “剩余的财物”将יתר限定为物质财产
    rationale: יתר可指余剩、余裕或丰裕；本节语境支持丰盛，却不必限定为财物。
  - severity: low
    issue: 脚注a的“他们是你的手”不够忠实且中文不自然
    rationale: “men of your hand”至多可表达为“属你手的世人”；将人直接等同为“你的手”是较强的释义。
