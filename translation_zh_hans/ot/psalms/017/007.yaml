source:
  edition: WLC
  text: הַפְלֵ֣ה חֲ֭סָדֶי/ךָ מוֹשִׁ֣יעַ חוֹסִ֑ים מִ֝/מִּתְקוֹמְמִ֗ים בִּֽ/ימִינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/007.yaml
  text: Show your wondrous steadfast love[a], O Savior of those who take refuge from those who rise up against them[b], by your right hand.
translation:
  language: zh_hans
  text: 求你彰显你奇妙的慈爱[a]！你用右手拯救投靠你的人，使他们脱离那些起来攻击他们的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你的慈爱显得奇妙。”希伯来语命令式既可指将某事彰显为非凡，也可指使之特别、奇妙。
    reason: lexical_alternative
  - marker: b
    text: 末尾的“用右手”也可能与“投靠你的人”相连，译作：“投靠在你右边的人。”
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  choice: 彰显……奇妙的
  rationale: 该词为פלא的使役命令式，可表示使之奇妙、使之显为非凡或特别彰显。祷告语境中译为“彰显你奇妙的”自然地表达诗人恳求上帝以非凡方式显明慈爱，同时在脚注保留“使……显得奇妙”的可能。
- source_word: חֲסָדֶיךָ
  choice: 你的慈爱
  rationale: חסד兼有怜悯、忠诚和坚定不移之爱的内涵；“慈爱”是现代中文圣经语体中自然而庄重的表达，不把盟约含义扩写进正文。
- source_word: מוֹשִׁיעַ
  choice: 你……拯救
  rationale: 该分词描写上帝是实施拯救者。中文以第二人称陈述“你……拯救”承接前面的直接呼求，比名词性称呼“拯救者啊”更自然，同时保留其持续、特征性的行动。
- source_word: חוֹסִים
  choice: 投靠你的人
  rationale: חסה表示寻求或取得庇护；“投靠你”保留具体的避难意象，也合乎现代汉语表达。原文宾语虽可由语境补出，所投靠的对象显然是受祈求的上帝。
- source_word: מִמִּתְקוֹמְמִים
  choice: 脱离那些起来攻击他们的人
  rationale: קום的反身强化词干分词带有敌对地起来之意；“起来攻击”保留动作意象。原文未明说攻击对象，正文依最自然的关系补为“他们”，避免误解，同时不在正文中加上过多解释。
- source_word: בִּימִינֶךָ
  choice: 用右手
  rationale: 介词ב在此最自然地表示手段，即上帝以右手施行拯救；“用右手”是清楚自然的现代中文，并保留象征能力与干预的拟人图像。
theological_decisions:
- issue: 末尾短语בִּימִינֶךָ的句法归属
  choice: 修饰上帝的拯救行动：“你用右手拯救……”
  alternative: 修饰“投靠的人”：“投靠在你右边的人”；也可能较宽松地与敌对者相连。
  rationale: 希伯来语介词短语位于句末，句法连接确有歧义。正文采用语境中最连贯的工具义，即上帝用右手拯救；脚注保留其修饰投靠者的真实可能，不将歧义静默消除。
- issue: “起来攻击”之隐含对象
  choice: 译为“攻击他们”，指投靠上帝的人
  alternative: 可不补对象，或理解为起来敌挡上帝。
  rationale: 原文没有显式宾语；紧邻的“投靠者”使“他们”成为最自然的语境补足。此处理仅为中文表达清晰，并不据此建立额外神学主张。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“求你……！”体现命令式在祈求中的语用功能；用主动句调整希伯来语成分次序，使中文自然清楚。所有脚注标记均置于正文相应位置。
