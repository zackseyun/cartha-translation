  text: מִ/פְּנֵ֣י רְ֭שָׁעִים ז֣וּ שַׁדּ֑וּ/נִי אֹיְבַ֥/י בְּ֝/נֶ֗פֶשׁ יַקִּ֥יפוּ עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/009.yaml
  text: from the wicked who devastate me[a], my deadly enemies who surround me.
translation:
  language: zh_hans
  text: '脱离那些摧残我的恶人，

    脱离那些要夺我性命[a]、围困我的仇敌。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “要夺我性命”：希伯来语直译近于“以性命（生命、魂）”。这短语也可能形容仇敌围攻时全心投入或带着贪婪；因此也可理解为“我的仇敌全力／贪婪地围困我”。
    reason: 保留 בְּנֶפֶשׁ 可指诗人性命、也可修饰仇敌行动方式的词义和句法歧义。
lexical_decisions:
- source_word: מִפְּנֵי
  choice: 脱离
  rationale: 本节承接上文“保护我”的祈求，表示诗人求神救他脱离敌对者；“脱离”比直译“从……面前”更符合现代汉语。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 保留该词对人的道德定性，不额外限定性别。
- source_word: שַׁדּוּנִי
  choice: 摧残我的
  rationale: שׁדד 表示猛烈破坏、掠夺或毁坏；“摧残”传达严重伤害，又不必断定已经彻底毁灭。
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: 直接表达复数所属关系和公开敌对的含义。
- source_word: בְּנֶפֶשׁ
  choice: 要我命
  rationale: 这里很可能表示仇敌以诗人的性命为目标；用现代汉语“要我命”保留生命受到威胁的力度，同时以脚注说明希伯来语的歧义。
- source_word: יַקִּיפוּ עָלָי
  choice: 把我团团围住
  rationale: 该短语描写敌人环绕、包围诗人；“团团围住”自然且形象。
theological_decisions:
- issue: בְּנֶפֶשׁ 所指的是诗人的性命，还是仇敌自身的欲望或全副心力
  choice: 正文译为“要我命”
  alternative: “拼命地围住我”或“贪婪地围住我”
  rationale: “性命”是 נֶפֶשׁ 的常见语义，在敌人包围诗人的语境中，最自然地表达致命威胁；但介词短语也可能修饰仇敌行动的方式，因此不在正文中排除其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。为补足中文独立成句所需的语境，重复上节隐含的祈求“求你保护我”，并以两个“脱离”呈现希伯来语中介词统摄两个敌对者描述的关系；分行为意群服务，不改变诗句内容。
