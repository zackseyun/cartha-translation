  text: לִ/פְעֻלּ֣וֹת אָ֭דָם בִּ/דְבַ֣ר שְׂפָתֶ֑י/ךָ אֲנִ֥י שָׁ֝מַ֗רְתִּי אָרְח֥וֹת פָּרִֽיץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/004.yaml
  text: As for the deeds of man[a], by the word of your lips I have kept myself from the paths of the violent.
translation:
  language: zh_hans
  text: 至于世人的作为，我因你嘴唇所说的话，避开强暴人的道路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “避开”是按上下文对希伯来文“我谨守强暴人的道路”的理解。该动词也可指“留意”或“看守”，故本句也可理解为“我留意（或看守）强暴人的道路”；但本诗申明正直的语境较支持避开这些道路的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְעֻלּוֹת אָדָם
  choice: 至于人的行为
  rationale: 介词 לְ 在这里引出所论的范围或话题；אָדָם 是泛指人类的单数名词。“人的行为”既保留原文结构，也符合现代汉语表达。
- source_word: בִּדְבַר שְׂפָתֶיךָ
  choice: 凭你口中的话
  rationale: בְּ 表示凭借或依据；直译“你嘴唇的话”在汉语中较生硬，因此以“你口中的话”保留神说话的诗性形象，同时自然清楚。
- source_word: שָׁמַרְתִּי
  choice: 保守自己不走
  rationale: שׁמר 可指守住、谨守或留意。结合后面的“道路”和本诗自陈纯正的语境，正文表达为约束自己、避开那些道路；原文可能的另一理解在脚注中保留。
- source_word: אָרְחוֹת
  choice: 道路
  rationale: 保留以道路比喻生活方式或行为路线的诗歌意象。
- source_word: פָּרִיץ
  choice: 残暴人
  rationale: 该词指施行暴力、凶暴或强横的人；“残暴人”比泛泛的“恶人”更准确地传达其暴力色彩。
theological_decisions:
- issue: שָׁמַרְתִּי אָרְחוֹת פָּרִיץ 的句法和语义
  choice: 诗人说自己凭上帝的话约束自己，不走残暴人的道路。
  alternative: 也可理解为“我留意了残暴人的道路”或“我谨防残暴人的道路”。
  rationale: שׁמר 通常可表示“守、谨守、留意”，原句没有明说“自己”或“不走”。但在本诗申明正直的语境中，避开残暴人的道路较为合适；为免消除原文真实歧义，脚注列出较形式对应的译法及另一可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“凭你口中的话”保留神圣言语的诗性表达；“保守自己不走”使正文语义自然，同时用脚注保存希伯来文 שׁמר 的歧义。
