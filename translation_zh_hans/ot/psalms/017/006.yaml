  text: אֲנִֽי קְרָאתִ֣י/ךָ כִֽי תַעֲנֵ֣/נִי אֵ֑ל הַֽט אָזְנְ/ךָ֥ לִ֝֗/י שְׁמַ֣ע אִמְרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/006.yaml
  text: I call on you[a], for you answer me, O God; incline your ear to me[b]; hear my words.
translation:
  language: zh_hans
  text: 上帝啊，我呼求你，因为你应允我[a]；求你侧耳听我[b]，垂听我的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝啊，我曾呼求你，因为你会应允我。”希伯来诗歌中的动词形式可带过去、现在或确信将来的意味。
    reason: alternative_reading
  - marker: b
    text: “侧耳听我”按希伯来文直译，是请求上帝留心聆听的形象说法。
    reason: cultural_note
lexical_decisions:
- source_word: קְרָאתִיךָ
  choice: 我呼求你
  rationale: קרא 的 Qal 完成式第一人称单数，带第二人称阳性单数后缀。在诗歌祷告中可指已经发出的呼求，也可作为当前祈求的陈述；“我呼求你”自然地保留直接呼告的语气。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出呼求上帝的理由，采用现代汉语中简洁自然的因果连接词。
- source_word: תַעֲנֵנִי
  choice: 你必应允我
  rationale: ענה 的未完成式第二人称阳性单数，带第一人称单数后缀；语境表现诗人确信上帝会回应。“必应允”传达这种信赖，同时以脚注保留现在时等可能理解。
- source_word: אֵל
  choice: 上帝啊
  rationale: 此处为直接呼格。“上帝啊”符合现代汉语庄重祷告语体，不额外展开为“全能者”等解释性称号。
- source_word: הַט אָזְנְךָ לִי
  choice: 求你侧耳听我
  rationale: 字面为“把你的耳朵倾向我”，是请求专心聆听的希伯来语形象表达；“侧耳听我”既保留意象，也符合汉语表达习惯。
- source_word: שְׁמַע
  choice: 垂听
  rationale: שמע 的 Qal 命令式。用“垂听”表达直接恳求，并与前面的“侧耳”形成庄重而自然的诗歌平行。
- source_word: אִמְרָתִי
  choice: 我的话
  rationale: 该词在所给 WLC 文本中为单数形式，指诗人所说的话或陈词；汉语“我的话”无需标示单复数，可自然涵盖整段祈言。
theological_decisions:
- issue: 上帝回应的时态与语气
  choice: 译作“你必应允我”，正文突出诗人对上帝将要回应的确信。
  alternative: “你应允我”或“你已经应允我”
  rationale: 希伯来诗歌中的完成式与未完成式可带过去、现在或确信将来的意味；正文选择最符合祷告语境的确信将来，但用脚注明示其他可能，避免把时态含义绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“呼求”“侧耳”“垂听”保留诗歌的平行结构与恳切语气；正文不强行消除希伯来动词时态的诗性弹性，并借脚注说明。
