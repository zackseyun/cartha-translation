  text: בָּ֘חַ֤נְתָּ לִבִּ֨/י פָּ֘קַ֤דְתָּ לַּ֗יְלָה צְרַפְתַּ֥/נִי בַל תִּמְצָ֑א זַ֝מֹּתִ֗י בַּל יַעֲבָר פִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/003.yaml
  text: You have examined my heart; you have visited me by night; you have tested me and find nothing[a]. I have purposed that my mouth will not transgress.
translation:
  language: zh_hans
  text: 你察验了我的心；你在夜间察看我；你熬炼我，找不出什么。[a]我已立定心意：我的口决不越界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“我已经定意；我的口必不越过。”意思是诗人定意不在言语上越界。
    reason: 保留末句压缩句法，以及“越过”这一字面表达所容许的另一种译法。
lexical_decisions:
- source_word: בָּחַנְתָּ
  choice: 察验
  rationale: 该动词表示考察、检验人的内在品格；“察验”与“我的心”搭配自然，也保留评判性的意味。
- source_word: לִבִּי
  choice: 我的心
  rationale: “心”直接保留希伯来语的人观表达，在此涵盖思想、意图等内在生命。
- source_word: פָּקַדְתָּ
  choice: 察看
  rationale: פקד语义较广，可指探访、关注或查验；在上帝审察人的语境中，“察看”既自然，也体现查验之意。
- source_word: לַּיְלָה
  choice: 在夜间
  rationale: 该词在这里作时间状语；“在夜间”是现代汉语中庄重而自然的表达。
- source_word: צְרַפְתַּנִי
  choice: 你熬炼我
  rationale: צרף本指熔炼金属，也比喻检验人；“熬炼”保留原文意象及其检验含义，且与诗体语域相称。
- source_word: בַל תִּמְצָא
  choice: 却找不出什么
  rationale: 原文没有明说所找不到的对象；“什么”保留这种省略和简洁，不擅自补入“罪恶”等解释。
- source_word: זַמֹּתִי
  choice: 我已立定心意
  rationale: 将该形式理解为动词“我已筹划／定意”；“立定心意”在汉语中清楚表达诗人的决意。
- source_word: בַל יַעֲבָר פִּי
  choice: 决不让我的口越界
  rationale: עבר字面意为经过、越过；与“我的口”连用时指言语不越过界限。“口越界”保留原文意象，同时让汉语读者能理解为言语上的过犯。
theological_decisions:
- issue: 末句压缩句法的解释
  choice: 理解为诗人就自己的言语所作的决定：“我已立定心意，决不让我的口越界。”
  alternative: 也可理解为状态性的陈述：“我的口没有越界”；或较直译为：“我所定意的，我的口不越过。”
  rationale: 希伯来文末句简练且句法有一定歧义。把זַמֹּתִי视为动词，并把后句看作决意的内容，符合上下文中诗人受察验后申明正直的思路；脚注同时保留较直译的可能性，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。前三个分句保留原文逐层审察的排比；“熬炼”保存冶炼隐喻。末句用“口越界”兼顾希伯来语意象与汉语可懂度，并以脚注说明句法和词义上的另一可能。
