    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּמוֹ
  choice: 自己肥厚的心
  rationale: 原文直译为“他们的脂肪”，没有明说“心”。这里的“脂肪”很可能比喻麻木、自满而刚硬的内心。正文补出“心”以使现代汉语可懂，同时用“肥厚”保留原文具体意象；脚注说明其字面形式和可能含义。
- source_word: סָּגְרוּ
  choice: 封闭了
  rationale: 该动词意为“关闭、封住”。“封闭了”能自然搭配所补出的“心”，并保留与外界隔绝、变得迟钝的形象。
- source_word: פִּימוֹ
  choice: 他们的口
  rationale: 原词为单数名词带复数所属后缀，可按集合意义译作“他们的口”；这也保持希伯来语诗句的形式。
- source_word: דִּבְּרוּ
  choice: 说出
  rationale: 希伯来语完成式在诗歌语境中可描写当前或一贯的行为。现代汉语不必显式标注时态，“说出”自然表达其言语表现。
- source_word: בְגֵאוּת
  choice: 傲慢的话
  rationale: 该词表示骄傲、高傲或狂妄。译作“说出傲慢的话”符合现代汉语习惯，并保留其负面的道德含义。
