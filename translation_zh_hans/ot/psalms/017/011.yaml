  yaml_path: translation/ot/psalms/017/011.yaml
  text: They have now surrounded our steps[c][b][a]; they set their eyes to cast us down to the ground.
translation:
  language: zh_hans
  text: 我们的脚步——他们如今包围了我[a]；他们定睛注视，要把我压倒在地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“我们的脚步——他们如今包围了我”；“我们的”与“我”之间有人称转换。也可理解为“他们如今紧逼我们的脚步”。
    reason: textual_variant
  - marker: b
    text: “把我压倒”原文没有明说受事者；也可译作“要使人俯伏在地”或“要把我们压倒在地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשֻּׁרֵינוּ
  choice: 我们的脚步
  rationale: 该名词指脚步、步履或足迹；译作“我们的脚步”保留复数第一人称所有格和受敌人紧逼的行路意象。
- source_word: עַתָּה
  choice: 如今
  rationale: 表示当前危机已经临到；“如今”简洁、庄重，也符合诗歌语体。
- source_word: סבבוני
  choice: 他们包围了我
  rationale: 动词意为包围、环绕，其后缀明确为第一人称单数“我”。译文保留原文从“我们的”转为“我”的人称变化，不为求整齐而改成“我们”。
- source_word: עֵינֵיהֶם יָשִׁיתוּ
  choice: 他们定睛
  rationale: שׁית基本义为放置、设定；“定睛”自然表达敌人把目光锁定目标的敌意，同时保留眼目的形象。
- source_word: לִנְטוֹת
  choice: 要把我压倒
  rationale: נטה常指倾斜、弯下或使偏斜；在敌对语境及“在地上”的搭配中，译为“压倒”表达使人倒地之意。原文未明说受事者，因此另以脚注保留较直译的可能。
- source_word: בָּאָרֶץ
  choice: 在地
  rationale: 此处 אֶרֶץ 最自然地指地面或大地；“压倒在地”是现代汉语中清楚而有力的表达。
theological_decisions:
- issue: “我们的脚步”与“包围了我”之间的人称转换
  choice: 在正文中保留“我们的……我”的转换
  alternative: 统一译作“他们如今包围了我们的脚步”或“包围了我们”
  rationale: 马所拉文本的名词带第一人称复数后缀，而动词带第一人称单数宾语后缀。保留这一张力更忠实于现存希伯来文本，也可表现诗人身处群体共同危难中的个人处境。
- issue: לנטות 的隐含受事者
  choice: 按上下文补出“我”，译作“把我压倒在地”
  alternative: 不补受事者，译作“要倾倒在地”或补作“我们”
  rationale: 希伯来文不明说不定式的受事者；上下文最近的明确受事者是“我”，故正文采用单数，但用脚注说明原文的省略和其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。破折号用来呈现希伯来语开头悬置成分的突兀感，并保留“我们的脚步”与“包围了我”之间不寻常的人称转换；不以流畅为由消除原文张力。
