id: PSA.17.2
reference: Psalms 17:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ֭/לְּ/פָנֶי/ךָ מִשְׁפָּטִ֣/י יֵצֵ֑א עֵ֝ינֶ֗י/ךָ תֶּחֱזֶ֥ינָה מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/002.yaml
  text: May my judgment come forth from before you[b][a]; may your eyes behold what is upright.
translation:
  language: zh_hans
  text: 愿我的判决从你面前发出[a]；愿你的眼睛察看正直之事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿为我伸冤的裁决从你面前发出。”
    reason: alternative_reading
  - marker: b
    text: 或译：“愿你的眼睛察看公平”，或“察看正当的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  choice: 从你面前
  rationale: 保留原文“从你面前／临在之处”的空间意象，也契合判决由上帝面前发出的法庭语境。
- source_word: מִשְׁפָּטִי
  choice: 我的判决
  rationale: מִשְׁפָּטִי 可指与诗人有关的判决、公断或案件；“我的判决”贴近原文，并保留判决究竟指裁断还是伸冤结果的张力。
- source_word: יֵצֵא
  choice: 发出
  rationale: יצא 的基本意思是“出去、出来”；“发出”在中文中自然表达判决从上帝面前颁出，同时保存其动态意象。
- source_word: עֵינֶיךָ
  choice: 你的眼睛
  rationale: 保留原文具体的拟人表达，不将其抽象化为单纯的“你”。
- source_word: תֶּחֱזֶינָה
  choice: 察看
  rationale: חזה 表示观看、注视；“察看”既是现代中文，也传达审视意味，适合法庭与鉴察的语境。
- source_word: מֵישָׁרִים
  choice: 正直之事
  rationale: 该复数名词可指正直、公平或正当之事；“正直之事”保留道德与司法两方面的含义，而不限定为抽象的“公平”。
theological_decisions:
- issue: 两个未完成式应译为祈愿还是陈述／将来
  choice: 译作祈愿：“愿……发出；愿……察看”
  alternative: 陈述或将来：“我的判决必从你面前发出；你的眼睛察看正直之事”
  rationale: 希伯来语未完成式本身可有不同语气；在本篇向上帝祈求的上下文中，祈愿读法较自然，但不把它强化为语法上无可置疑的必然宣告。
- issue: מִשְׁפָּטִי 是中性的判决还是有利的伸冤
  choice: 正文采用较中性的“我的判决”
  alternative: “为我伸冤的裁决”
  rationale: 上下文确有求上帝为诗人伸冤之意，但原词本身可指判决、公断或案件；正文避免预先锁定判决结果，较具解释性的读法置于脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“从你面前发出”保留原诗的空间—法庭意象；“察看”比“看见”更能体现审视意味，又不使用过度古雅的措辞。
