  text: Why[a], O Yahweh[b], do you reject my soul? Why do you hide your face from me?
translation:
  language: zh_hans
  text: 雅威啊，你为何弃绝我[a]？为何向我掩面[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“我的 נפש”（nephesh）；此处可指“我自己”。也可译为“我的生命”或“我的性命”。
    reason: lexical_alternative
  - marker: b
    text: “掩面”是希伯来语表达，常指不再施予眷顾或关注。
    reason: cultural_note
lexical_decisions:
- source_word: לָמָה
  choice: 为什么
  rationale: 直接表达原因疑问，简洁自然，并保留哀歌质问的力度。原文第二分句虽未重复疑问词，汉语为使并列问句清楚自然，补出“为什么”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见拟音译出其专名性质，不以“主”这一称号替代，也不采用源于另一种传统读法的“耶和华”。
- source_word: תִּזְנַח
  choice: 弃绝
  rationale: 该动词表示拒绝、摒弃；“弃绝”符合诗篇哀诉的庄重语域，也保留关系被拒斥的强烈意味。
- source_word: נַפְשִׁי
  choice: 我
  rationale: נֶפֶשׁ在此可指说话者本人、其性命或生命。译作“我”最符合现代汉语表达，避免“我的灵魂”可能引入并非原文重点的身心二分观；字面表达及其他可能含义列入脚注。
- source_word: תַּסְתִּיר פָּנֶיךָ מִמֶּנִּי
  choice: 向我掩面
  rationale: 保留“隐藏你的脸”这一希伯来语具体意象，同时用现代汉语中简洁、庄重的“向我掩面”表达；其所含撤回眷顾或临在之意在脚注说明。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非称号。“雅威”较直接反映通常重构的读音，并保留专名功能；不以“上主”替代，也不采用源自传统混合读法的“耶和华”。
- issue: נַפְשִׁי所指的人性层面
  choice: 我
  alternative: 我的性命；我的生命；我的灵魂
  rationale: 上下文是诗人以整个人向神哀诉，并不要求将נֶפֶשׁ限定为与身体相分离的“灵魂”。译作“我”保留其整体人格指向，脚注则保留“性命／生命”的词义张力。
- issue: “掩面”的神学含义
  choice: 保留具体意象，不在正文释为“撤回同在”
  alternative: 为什么不再眷顾我；为什么离弃我
  rationale: “掩面”可能涉及撤回恩宠、关注或可感知的临在，但原文以意象表达，并未把含义限定为其中一种；正文保留这一张力，脚注作必要说明。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“雅威啊”保留直接呼告；两次“为什么”使汉语并列质问清晰有力。“弃绝我”避免生硬的“弃绝我的灵魂”，而“向我掩面”保留原文的具体意象与未完全解释的神学张力。
