  text: May my prayer come before you[b][a]; incline your ear to my cry.
translation:
  language: zh_hans
  text: 愿我的祷告来到你面前；求你侧耳听我的呼求。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּבוֹא
  choice: 愿……达到
  rationale: 这是בוא的Qal未完成式第三人称阴性单数，与阴性主语“我的祷告”一致；在祈求语境中表达愿望，以“愿……达到”自然呈现其祈愿语气。
- source_word: לְפָנֶיךָ
  choice: 你面前
  rationale: 字面涉及“你的面”，是来到某人面前、进入其临在的惯用表达；“你面前”既保留原文意象，又符合现代汉语。
- source_word: תְּפִלָּתִי
  choice: 我的祷告
  rationale: תְּפִלָּה通常指“祷告”；此处无需缩窄为“恳求”。
- source_word: הַטֵּה
  choice: 侧……听
  rationale: נטה的Hiphil命令式本有“倾、伸、转向”之意，与“耳”搭配表示专心垂听；“侧耳听”在现代汉语中自然，并保留身体意象。
- source_word: אָזְנְךָ
  choice: 耳
  rationale: 保留原文单数“耳”的意象，组成汉语惯用表达“侧耳听”。
- source_word: לְרִנָּתִי
  choice: 我的呼求
  rationale: רִנָּה可指响亮的呼喊，在诗篇88篇的哀歌语境中，“呼求”能表达迫切哀告而不误带欢呼色彩。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿……；求……”清楚呈现两分句的祈求语气；“侧耳听”保留希伯来语的听觉与身体隐喻，同时便于普通读者理解。
