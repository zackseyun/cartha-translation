  text: הַ/יְסֻפַּ֣ר בַּ/קֶּ֣בֶר חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ בָּ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/011.yaml
  text: Is your steadfast love declared in the grave[a], your faithfulness in Abaddon?
translation:
  language: zh_hans
  text: 你的慈爱岂会在坟墓中被传扬，你的信实岂会在灭亡之地[a]被传扬？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“亚巴顿”，意为“灭亡”或“灭亡之地”，是指死亡领域的诗意用语。
    reason: 保留אֲבַדּוֹן作为音译词、抽象名词或领域称谓之间的词义空间。
lexical_decisions:
- source_word: הַיְסֻפַּר
  choice: 岂会……被传扬
  rationale: 疑问词与Pual未完成式构成反问，动词是被动语态；“被传扬”既保留被动意义，也符合诗篇中述说上帝作为与品格的语境。第二分句依希伯来诗歌省略动词，中文补出以求清楚。
- source_word: בַּקֶּבֶר
  choice: 在坟墓中
  rationale: קֶבֶר指坟墓或埋葬之处；“坟墓”是现代汉语中准确、自然的对应词。
- source_word: חַסְדֶּךָ
  choice: 你的慈爱
  rationale: חֶסֶד包含持久、忠诚的爱；“慈爱”是简明庄重且为普通中文读者易懂的表达，并与“信实”形成恰当对应。
- source_word: אֱמוּנָתְךָ
  choice: 你的信实
  rationale: אֱמוּנָה在此指上帝可靠、信守不渝的属性；“信实”准确保留其神学分量。
- source_word: בָּאֲבַדּוֹן
  choice: 在灭亡之地
  rationale: אֲבַדּוֹן可指毁灭，也可诗意地指死亡与毁灭的领域。此处与“坟墓”平行，“灭亡之地”既表达地点含义，也保留其毁灭意象；脚注注明音译及其他可能译法。
theological_decisions:
- issue: אֲבַדּוֹן应译作抽象的“灭亡”，音译为“亚巴顿”，还是译作死亡领域
  choice: 正文译为“灭亡之地”
  alternative: “灭亡”；“亚巴顿”
  rationale: 与前半句“坟墓”的诗歌平行表明，这里较可能是死亡、毁灭的领域，而不只是抽象事件。中文“亚巴顿”容易使普通读者误以为是专名或启示录中的个体；正文采用“灭亡之地”，脚注保留音译和词义歧义，避免过度确定。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。全句以“岂会”呈现反问语气；第二分句补出希伯来文省略的“岂会……被传扬”，使中文平行结构清楚。
