base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/016.yaml
  text: Your burning anger swept over me[c][b][a]; your terrors destroyed me.
translation:
  language: zh_hans
  text: '你的烈怒[b]席卷我[a]；

    你的惊吓毁灭了我[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从我身上经过”；希伯来语动词的基本义是“经过、越过”，上下文则带有压倒性的力量。
    reason: lexical_alternative
  - marker: b
    text: “烈怒”所译的希伯来语与燃烧、发热有关；也可译作“如火的怒气”或“震怒”。
    reason: lexical_alternative
  - marker: c
    text: “毁灭了我”或译：“剪除了我”或“灭绝了我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: 漫过我
  rationale: 介词 עַל 加第一人称单数词尾表示力量从诗人身上越过或压到他身上；与动词合译为“漫过我”，既自然，也保留被淹没般的空间意象。
- source_word: עָבְרוּ
  choice: 漫过
  rationale: עבר 基本义为“经过、越过”。此处以神的烈怒为主语，“漫过”保留原有运动意象，同时传达势不可挡的力量；脚注保留较字面的译法。
- source_word: חֲרוֹנֶיךָ
  choice: 你的烈怒
  rationale: חָרוֹן 指炽烈、如火燃烧的怒气。汉语“烈怒”简洁庄重，表达强度；原文形式虽为复数，在此具有抽象或加强作用，汉语自然地用单数集合概念表达。
- source_word: בִּעוּתֶיךָ
  choice: 你的恐怖
  rationale: 该名词指令人惊骇的事物或恐惧。译作“你的恐怖”保留它可能兼指恐怖本身及造成恐怖之事的张力，不具体化为某类行动。
- source_word: צִמְּתוּתֻנִי
  choice: 摧毁了我
  rationale: צמת 可指毁灭、灭绝或剪除。“摧毁了我”符合哀歌中的强烈夸张表达，在现代汉语中也比“灭绝了我”更自然；脚注保留“剪除”这一可能译法。
theological_decisions:
- issue: 神的“恐怖”是主观感受还是客观降下的灾祸
  choice: 采用“你的恐怖”，不进一步说明其机制
  alternative: 你所降的恐怖 / 你可怕的作为
  rationale: 原文名词可表示恐怖之事或引发惊恐的力量；不增补“所降的”或“作为”，以免消除诗句本身的含混与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语言。两行保持希伯来诗歌的平行结构；“漫过”保存运动意象，“摧毁”表达第二行的极端强度，同时避免生硬的字面措辞。所有脚注标记均紧随其所说明的词语。
