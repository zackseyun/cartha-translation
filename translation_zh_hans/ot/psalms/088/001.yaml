  text: יְ֭הוָה אֱלֹהֵ֣י יְשׁוּעָתִ֑/י יוֹם צָעַ֖קְתִּי בַ/לַּ֣יְלָה נֶגְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/001.yaml
  text: O Yahweh[a], God of my salvation, by day I cry out; at night I am before you.
translation:
  language: zh_hans
  text: '耶和华啊，我救恩的上帝！

    我白天呼求；夜间，在你面前[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“夜间，在你面前”；这一分句没有明示动词，也可理解为从上句承接“我呼求”。
    reason: 保留无动词分句的语法含混，并说明另一种可能的承接方式。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代中文通行的专名“耶和华”译出四字神名；“啊”表达祷告中的直接呼告。
- source_word: אֱלֹהֵי יְשׁוּעָתִי
  choice: 我救恩的上帝
  rationale: 保留希伯来语构造链“我救恩的上帝”，既自然，又不把救恩具体限定为某一种解救。
- source_word: יוֹם
  choice: 白天
  rationale: 在与“夜间”对举的时间副词用法中，译为“白天”简洁自然。
- source_word: צָעַקְתִּי
  choice: 我……呼求
  rationale: 该动词表示急切地喊叫或求告；“呼求”符合哀歌祷告语境，也保留其迫切意味。完成式在此按持续祷告的诗歌语境译成现代汉语未标明时态的表达。
- source_word: בַלַּיְלָה
  choice: 夜间
  rationale: 与“白天”形成清楚、庄重的时间对举。
- source_word: נֶגְדֶּךָ
  choice: 在你面前
  rationale: 贴近介词短语的字面意义，不擅自补入确定的谓语，从而保留希伯来诗句无动词结构的含混与张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最为大众熟悉的专名“耶和华”，而不以称号“主”替代；“雅威”是较接近学界常见拟音的可行选择。
- issue: 末句无动词结构的理解
  choice: 夜间也在你面前
  alternative: 夜间我也向你呼求
  rationale: 原文“夜间，在你面前”没有明示动词。正文不从前句补出“呼求”，以免消除原诗可能表达的持续临在、祷告或呼求之多义性；加“也”仅使昼夜对举在中文中顺畅。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。以两行呈现昼夜对举；“呼求”体现哀歌的迫切感，末句则尽量保留原文简约而含混的诗性结构。
