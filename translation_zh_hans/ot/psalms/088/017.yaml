  text: סַבּ֣וּ/נִי כַ֭/מַּיִם כָּל הַ/יּ֑וֹם הִקִּ֖יפוּ עָלַ֣/י יָֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/017.yaml
  text: They surrounded me like water all day long[a]; together they closed in on me.
translation:
  language: zh_hans
  text: 它们如水整天环绕我[a]，一同把我团团围住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们如水整天围住我……它们一同环绕我”，以更明显地保留两个希伯来语动词之间紧密的词义平行。
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי
  choice: 环绕我
  rationale: 该词是סבב的Qal完成式第三人称复数，带第一人称单数宾语后缀，表示众多威胁围住诗人。“环绕我”自然、庄重，并保留受困的意象。
- source_word: כַמַּיִם
  choice: 如水
  rationale: 前缀כ表示比较；“如水”简洁地保留水从四面包围、淹没的比喻。
- source_word: כָּל הַיּוֹם
  choice: 整天
  rationale: 表示整个白昼持续如此；“整天”符合现代汉语，并保留持续性。
- source_word: הִקִּיפוּ
  choice: 把我团团围住
  rationale: 该动词与前句形成紧密平行，表达从四周包围。“团团围住”既保留重复加强的效果，也使中文表达自然。
- source_word: עָלַי
  choice: 把我
  rationale: 介词עַל带第一人称单数后缀，在此与“围住”结合表达威胁临到并包围说话者；汉语用处置式“把我”自然呈现其受事关系。
- source_word: יָחַד
  choice: 一同
  rationale: 表示这些威胁共同、同时采取行动；“一同”保留其集体合围之意。
theological_decisions: []
