source:
  edition: WLC
  text: וַ/אֲנִ֤י אֵלֶ֣י/ךָ יְהוָ֣ה שִׁוַּ֑עְתִּי וּ֝/בַ/בֹּ֗קֶר תְּֽפִלָּתִ֥/י תְקַדְּמֶֽ/ךָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/013.yaml
  text: But as for me[a], O Yahweh, I cry out to you; in the morning my prayer comes before you.
translation:
  language: zh_hans
  text: 但我向你呼求，耶和华啊；清晨，我的祷告来到你面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来到你面前”也可译作“迎见你”或“先行来到你面前”。希伯来语动词可表示来到面前、迎见或在前。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 但我却
  rationale: 连词与独立代词共同形成对比和主语强调；“但我却”在现代汉语中自然地保留这一语气。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词表示呼求所指向的对象；“向你”符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文直接使用四字神名；采用现代中文读者熟悉的专名音译“耶和华”，不以称号替代。
- source_word: שִׁוַּעְתִּי
  choice: 呼求
  rationale: 该动词指为求援而大声呼喊；“呼求”兼具求助含义与庄重的诗歌语体。希伯来语完成式在此诗歌祷告中可表达已经发出并持续相关的呼求，中文不强加明确时态。
- source_word: וּבַבֹּקֶר
  choice: 清晨
  rationale: 表示在早晨这一时间；“清晨”简洁自然。连接词的衔接作用由分号体现。
- source_word: תְּפִלָּתִי
  choice: 我的祷告
  rationale: 保留原文第一人称单数所属关系及单数名词。
- source_word: תְקַדְּמֶךָּ
  choice: 来到你面前
  rationale: קדם的使役词干在此可指来到某人面前、迎见或先于；以祷告为主语时，“来到你面前”自然保留祷告抵达上帝面前的意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列上帝的专名而非“主”这一称号。中文采用广为人知的传统音译“耶和华”，同时不把专名替换为称谓。
- issue: שִׁוַּעְתִּי 的时态体意义
  choice: 呼求（不标明明确汉语时态）
  alternative: 曾呼求／一直呼求
  rationale: 希伯来语完成式可能回顾已经发出的呼求，而诗歌语境也使其带有当前持续恳求的力量；中文裸谓语可避免过度限定。
- issue: תְקַדְּמֶךָּ 的意象
  choice: 来到你面前
  alternative: 迎见你／先到你面前
  rationale: 该动词有来到面前、迎见或在先等语义可能；正文选取与“祷告”为主语最自然的表达，并以脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“但我却”突出与上下文的对比；以分号呈现两小句的并列推进。神名保留为专名“耶和华”。
