  text: הִרְחַ֥קְתָּ מְיֻדָּעַ֗/י מִ֫מֶּ֥/נִּי שַׁתַּ֣/נִי תוֹעֵב֣וֹת לָ֑/מוֹ כָּ֝לֻ֗א וְ/לֹ֣א אֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/008.yaml
  text: You have driven my companions far from me[a]; you have made me abhorrent to them[c][b]. I am confined and cannot go out.
translation:
  language: zh_hans
  text: 你使我的熟人[a]远离我；你使我成为他们所憎恶的对象[b]。我被困住[c]，不能出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的相识”或“我所认识的人”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“你使我成为他们眼中的可憎之物”；“可憎之物”在原文中为复数形式。
    reason: lexical_alternative
  - marker: c
    text: 或译：“我被关起来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: 你使……远离
  rationale: 这是רחק的使役式，表示使人产生距离；“使……远离”既保留使役意义，也符合现代汉语表达。
- source_word: מְיֻדָּעַי
  choice: 熟识我的人
  rationale: 该词源于ידע，指诗人认识或与他相识的人，并不必然具有“挚友”那么强的亲密含义；“熟识我的人”保留了这种关系范围。
- source_word: מִמֶּנִּי
  choice: 我
  rationale: 介词מן在此表示分离，与“远离”合译为“远离我”。
- source_word: שַׁתַּנִי
  choice: 你使我成为
  rationale: שׂים本义为“放置、设立”，与后面的表语搭配时表示“使……成为”。
- source_word: תוֹעֵבוֹת
  choice: 所厌恶的
  rationale: 该词形式上是复数名词，表达强烈的可憎、令人憎恶之意；译为“所厌恶的”在汉语中自然地呈现其表语功能，同时脚注保留较形式对应的译法。
- source_word: לָמוֹ
  choice: 他们
  rationale: 该代词回指前面的“熟识我的人”；在汉语结构中译作“他们所厌恶的”。
- source_word: כָּלֻא
  choice: 我被困住
  rationale: כלא在此为被动或状态意义，指受到拘束、被关闭而无法外出；“被困住”不把处境过度具体化为正式监禁。
- source_word: וְלֹא אֵצֵא
  choice: 不能出去
  rationale: 字面为“我不出去”，但承接“被困住”时表达的是受限而无法出去；“不能出去”传达了上下文中的能力受阻。
theological_decisions:
- issue: 诗人苦境中的神圣行动者
  choice: 保留两处第二人称使役表达：“你使……”“你使……”
  alternative: 弱化为无人称结果，如“他们远离了我”“我成了他们所厌恶的”
  rationale: 希伯来文明确以神为这些行动的主语。译文保留诗篇哀歌中对神直接而尖锐的陈诉，不替诗人缓和其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“熟识我的人”避免把关系强化为“挚友”；“所厌恶的”自然传达强烈排斥感；末句简洁保留受困、无法外出的压迫感。所有第二人称使役结构均按原文保留。
