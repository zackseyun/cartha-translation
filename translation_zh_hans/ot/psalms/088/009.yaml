  text: עֵינִ֥/י דָאֲבָ֗ה מִנִּ֫י עֹ֥נִי קְרָאתִ֣י/ךָ יְהוָ֣ה בְּ/כָל י֑וֹם שִׁטַּ֖חְתִּי אֵלֶ֣י/ךָ כַפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/009.yaml
  text: My eye grows weak because of affliction; I call on you every day[a], O Yahweh; I spread out my hands to you.
translation:
  language: zh_hans
  text: 我的眼睛因困苦而衰弱[a]；耶和华啊，我天天呼求你；我向你伸开双手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衰弱”或译“衰残”或“痛苦”。
    reason: 原文动词可指因苦难而衰残、耗损，也可能表达痛苦；脚注锚定在所释词语后。
lexical_decisions:
- source_word: עֵינִי
  choice: 我的眼
  rationale: 原文为单数，保留诗歌中具体的身体意象；在汉语中也可自然指视力或整个人的精力。
- source_word: דָאֲבָה
  choice: 衰弱
  rationale: 该动词可表达衰残、憔悴或因痛苦而耗损；“衰弱”自然传达结果，同时不把含义限定为身体疼痛。
- source_word: מִנִּי עֹנִי
  choice: 因困苦
  rationale: 介词短语表原因或来源；“困苦”兼顾受苦、苦难与悲惨处境，且符合本诗语境。
- source_word: קְרָאתִיךָ
  choice: 我……呼求你
  rationale: 结合“天天”，完成式在此适合表达持续或反复的祷告行为；“呼求”体现向神求告而不过度增添情绪强度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，而不以称号替代。
- source_word: בְּכָל יוֹם
  choice: 天天
  rationale: 表达逐日反复的分配意义，比“整天”更符合此处语境。
- source_word: שִׁטַּחְתִּי
  choice: 伸开
  rationale: 该动词描写祷告时将手展开、伸向神的动作；“伸开”在现代汉语中自然且保留具体姿态。
- source_word: כַפָּי
  choice: 双手
  rationale: 原词为“手掌”的双数形式；在中文祷告姿态中译作“双手”最自然，也保留双数信息。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文稿保留专名而非以“主”等称号替代；“耶和华”是现代中文圣经传统中最广为人知、普通读者最易识别的形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我的眼”保留希伯来文单数的诗意表达；分号呈现哀诉与祷告行动之间的推进。脚注标记置于整节末尾，所释词清楚可辨。
