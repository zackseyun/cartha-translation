  text: I am counted among those going down to the pit[b][a]; I have become like a man without strength.
translation:
  language: zh_hans
  text: 我被算在下到坑里的人中间[a]；我成了一个毫无力量的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑”也可译作“坟墓”；在希伯来诗歌中，这是死亡的常见意象。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“像一个毫无力量的壮士”。“人”一词可带有强健之人的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶחְשַׁבְתִּי
  choice: 我被算在
  rationale: 该词为חשב的尼法勒完成式，表示被视为或被算作某一群体中的一员；中文用被动结构保留原文的受动含义。
- source_word: עִם
  choice: 中间
  rationale: 字面为“与……一起”，在“被算在……中间”这一结构中自然表达归入某一群体。
- source_word: יוֹרְדֵי בוֹר
  choice: 下坑的人
  rationale: 分词结构描写正在下到坑中的人；“下坑”保留希伯来诗歌中走向死亡的动态意象。
- source_word: בּוֹר
  choice: 坑
  rationale: 此处是死亡或阴间的常见诗歌意象；主文保留具体的“坑”，不直接解释成“坟墓”。
- source_word: הָיִיתִי
  choice: 我成了
  rationale: 虽为היה的完成式，但语境强调诗人已落入某种结果状态；“成了”自然传达这种转变。
- source_word: כְּגֶבֶר
  choice: 一个……的人
  rationale: גבר可泛指成年男子，也可能含强健之意；主文用自然的“人”，避免过度限定，同时由脚注说明其潜在反讽。
- source_word: אֵין אֱיָל
  choice: 毫无力气
  rationale: אֱיָל表示力量、精力；“毫无力气”简明自然，并保留原文极度衰弱的语气。
