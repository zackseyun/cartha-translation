base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/015.yaml
  text: I am afflicted and near death from my youth[a]; I bear your terrors; I am overwhelmed.
translation:
  language: zh_hans
  text: 我自幼困苦，濒临死亡；我承受你的惊吓，茫然失措。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “茫然失措”所译的希伯来词含义不确定，也可理解为“被压垮”“困惑不安”或“无所适从”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי
  choice: 困苦
  rationale: 在本诗哀歌语境中，主要指受苦、悲惨的处境，而非经济上的贫穷；“困苦”自然且保留其广泛含义。
- source_word: וְגֹוֵעַ
  choice: 濒临死亡
  rationale: גוע 的分词表达持续处于将死、衰亡的状态；“濒临死亡”比单说“死去”更能体现持续性。
- source_word: מִנֹּעַר
  choice: 自幼
  rationale: 介词 מִן 表示从幼年开始并延续至今；“自幼”简洁、自然。
- source_word: נָשָׂאתִי
  choice: 我承受
  rationale: נשׂא 的基本义为承担、背负；完成式可指已经并持续承受，中文“承受”不强行限定时貌。
- source_word: אֵמֶיךָ
  choice: 你的惊吓
  rationale: 复数名词 אֵימִים 指令人恐惧之事或恐怖；“你的惊吓”保留第二人称归属及神施行之事带来的恐惧，不淡化其张力。
- source_word: אָפוּנָה
  choice: 茫然失措
  rationale: 该词形和确切词义困难，可能表达被压倒、困惑、无所适从或毁坏；“茫然失措”较好呈现困惑与崩溃感，同时以脚注保留其他可能。
theological_decisions:
- issue: “你的惊吓”的所指与神的作用
  choice: 保留直接对神说的“你的”，使这些惊吓与神的作为直接相关。
  alternative: 理解为仅仅是在神面前感受到的恐惧，而不暗示来自神。
  rationale: 第二人称后缀自然表明这些恐怖属于神或源于他的处置；译文不缓和诗人对神的直接申诉，也不进一步界定神施行这些事的方式。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语言。分号呈现两组并列陈述；“我承受”保留希伯来语时貌上的开放性。脚注标记置于相关难词所在句末。
