id: PSA.88.10
reference: Psalms 88:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/לַ/מֵּתִ֥ים תַּעֲשֶׂה פֶּ֑לֶא אִם רְ֝פָאִ֗ים יָק֤וּמוּ יוֹד֬וּ/ךָ סֶּֽלָה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/010.yaml
  text: Do you work wonders for the dead? Do the departed spirits rise up to praise you? Selah[a]
translation:
  language: zh_hans
  text: 你岂会为死人行奇事？亡灵岂会起来称颂你？细拉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亡灵”也可译作“阴魂”；希伯来语“利乏音”（Rephaim）在这里是指阴间死者的诗歌用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלַמֵּתִים
  choice: 岂会为死人
  rationale: 疑问词 הֲ 与介词 לַ 构成“为死人吗”的反问；“死人”自然直接，并保留原诗的力度。
- source_word: תַּעֲשֶׂה פֶּלֶא
  choice: 行奇事
  rationale: עשה 与 פֶּלֶא 搭配表示施行非凡之事；“行奇事”既贴近希伯来文，也符合现代中文诗体表达。
- source_word: אִם
  choice: 岂会
  rationale: 此处引出与前句平行的第二个反问，并非条件句；用“岂会”明确传达反问语气。
- source_word: רְפָאִים
  choice: 亡灵
  rationale: 在此诗歌性阴间语境中，指死去的人，而非族名；“亡灵”简明地保留其阴间意象，又不额外规定中间状态的教义细节。
- source_word: יָקוּמוּ
  choice: 起来
  rationale: 保留 קום 的具体动态意象；其究竟侧重站起、从阴间兴起或复起，原诗并未完全说明。
- source_word: יוֹדוּךָ
  choice: 称颂你
  rationale: ידה 的使役形在敬拜语境中可指感谢或赞美；“称颂”自然庄重，并适合本诗关于死者能否赞美上帝的语境。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该词确切功能不明，采用中文圣经传统音译，避免加入推测性解释。
theological_decisions:
- issue: רְפָאִים 在诗歌性阴间语境中的含义
  choice: 亡灵
  alternative: 阴魂；死者；利乏音人
  rationale: 本节已提到“死人”，此词在平行句中指阴间里的死者。“亡灵”保留诗歌意象，不误解为古代族群，也不借此断定关于死后状态或复活的完整教义。
- issue: “起来”是否明确指末日复活
  choice: 保留“起来”的开放意象
  alternative: 复活
  rationale: קום 本身是“起来、兴起”，上下文形成死者起来赞美的反问，但并未使用更明确的复活术语；因此不把潜在意象收窄为明确的末日复活陈述。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。两个平行反问均用“岂会”表达，保留哀歌的张力；“细拉”沿用传统音译。
