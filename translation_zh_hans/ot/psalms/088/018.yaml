base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/018.yaml
  text: You have put far from me lover and friend[b][a]; my acquaintances are darkness.
translation:
  language: zh_hans
  text: 你使爱我的人和朋友都远离我；我的熟人就是黑暗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的熟人都在黑暗中”，又或：“黑暗是我唯一的伙伴。”希伯来文结尾十分简短，可有不止一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: 你使……远离
  rationale: 使役式完成时第二人称阳性单数，直接指向上帝，表达“你使之远离”的因果作用；此译法在现代汉语中自然，并保留使役语气。
- source_word: מִמֶּנִּי
  choice: 远离我
  rationale: 介词 מן 加第一人称单数后缀，表示与诗人分离；与“使……远离”自然搭配。
- source_word: אֹהֵב
  choice: 爱我的人
  rationale: אהב 的实体化分词，指爱诗人的人。“爱我的人”保留施爱者的方向，且避免现代汉语“爱人”可能专指配偶的歧义。
- source_word: וָרֵעַ
  choice: 和朋友
  rationale: רֵעַ 在此关系语境中指朋友或同伴；与“爱我的人”并列时，“朋友”最贴合哀诉中亲近关系的丧失。
- source_word: מְיֻדָּעַי
  choice: 我的熟人
  rationale: 该词源于 ידע，带第一人称单数后缀，指诗人所认识的人。“熟人”保留与“认识”有关的词义，同时不把亲密程度提升到前面的“朋友”。
- source_word: מַחְשָׁךְ
  choice: 就是黑暗
  rationale: 末尾名词构成简短的无系词句。正文按马所拉文本的词序，将“黑暗”作为“我的熟人”的谓语，保留原文突兀而强烈的意象；脚注说明其他可能分析。
theological_decisions:
- issue: 末句 מְיֻדָּעַי מַחְשָׁךְ 的句法关系
  choice: 我的熟人就是黑暗
  alternative: 我的熟人在黑暗中；黑暗是我唯一的伙伴
  rationale: 希伯来文结尾极其简省，没有明示介词或系词。按词序可理解为“我的熟人—黑暗”的无系词判断句，但也可能补出地点关系，或把“黑暗”理解为诗人仅存的伙伴。正文采用贴近词序且保持张力的译法，不将歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“爱我的人”避免“爱人”在现代汉语中通常指配偶；末句刻意保留原文突兀的隐喻和句法张力。
