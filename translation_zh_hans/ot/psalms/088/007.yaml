base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/007.yaml
  text: Your wrath has rested on me[a], and with all your breakers you have afflicted me. Selah
translation:
  language: zh_hans
  text: '你的烈怒压在我身上；

    你以你的一切碎浪[a]使我受苦。

    细拉'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “碎浪”也可译作“浪涛”或“巨浪”；希伯来词描绘冲击、破碎的海浪。
    reason: lexical_alternative
lexical_decisions:
- source_word: סָמְכָה
  choice: 压在
  rationale: 该动词本义涉及支撑、倚靠；以“烈怒”为主语并与“在我身上”连用时，表达怒气落在诗人身上并施加压力。“压在”既保留空间意象，也符合现代汉语表达。
- source_word: חֲמָתֶךָ
  choice: 你的烈怒
  rationale: חֵמָה可指怒气、烈怒或暴怒。“烈怒”保留其强烈程度及哀歌中神审判的严肃性。
- source_word: מִשְׁבָּרֶיךָ
  choice: 你所有的浪涛
  rationale: מִשְׁבָּר指冲击、破碎的海浪。现代汉语中“浪涛”自然且能承载猛烈海浪的意象；其更具体的“碎浪、巨浪”含义列入脚注。
- source_word: עִנִּיתָ
  choice: 使我受苦
  rationale: ענה的Piel词形可指使人受苦、使人卑微或压迫人。这里的宾语“我”由语境补出；“使我受苦”准确表达神施加苦难，却不把含义缩窄为社会性的压迫。
- source_word: וְכָל
  choice: 你用你所有的
  rationale: וְכָל连接第二分句并强调浪涛的全体。按上下文将工具关系明确译为“用”，使汉语自然，同时保留“所有”的总体性。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该礼仪或音乐术语的确切含义不明，因此按惯例音译，不作未经证实的解释。
theological_decisions:
- issue: 神的烈怒及其在苦难中的主动作用
  choice: 直译为神的烈怒压在诗人身上，并且神用自己的浪涛使诗人受苦。
  alternative: 弱化神的主动作用，把浪涛处理成非人格化的困境，或把“烈怒”淡化为一般痛苦。
  rationale: 希伯来文直接以神的烈怒为主语，并以第二人称动词把使人受苦的行动归于神。译文保留哀歌中的神学张力，不加以缓和。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分行保留希伯来诗歌的两个分句，并以“细拉”单独收束。
