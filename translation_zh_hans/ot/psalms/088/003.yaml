  text: כִּֽי שָֽׂבְעָ֣ה בְ/רָע֣וֹת נַפְשִׁ֑/י וְ/חַיַּ֗/י לִ/שְׁא֥וֹל הִגִּֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/003.yaml
  text: For my soul is full of troubles[a], and my life draws near to Sheol.
translation:
  language: zh_hans
  text: 因为我的心灵充满患难，我的生命临近示奥尔[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示奥尔”是希伯来语Sheol；也可译为“坟墓”或“亡者之境”。
    reason: 保留שְׁאוֹל的希伯来语概念及其词义范围，避免将其预先限定为特定的后期冥界观。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出诗人处境的原因，保留原文的因果关系，并符合现代汉语表达。
- source_word: שָׂבְעָה בְרָעוֹת
  choice: 充满患难
  rationale: שׂבע表示饱足、充满；רָעוֹת在此指临到诗人的灾祸和苦难，而非他所犯的道德罪恶。译作“充满患难”既保留充盈的意象，也自然庄重。
- source_word: נַפְשִׁי
  choice: 我的心灵
  rationale: נֶפֶשׁ可指生命、自我或心灵。下半句已有חַיַּי“我的生命”，故译作“我的心灵”以保留词汇区别和诗歌平行结构。
- source_word: וְחַיַּי
  choice: 我的生命
  rationale: חַיִּים虽具复数形式，在这里是表示“生命”的常用抽象名词；用单数“生命”符合现代汉语。
- source_word: לִשְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל指亡者所在之境。汉语“阴间”简洁且能保留原文世界的意象；脚注说明其希伯来专名及可选译法，以免把它等同于坟墓或后期神学中的地狱。
- source_word: הִגִּיעוּ
  choice: 已临近
  rationale: 该动词本义为到达、触及；结合לִשְׁאוֹל和哀歌语境，“已临近”自然表达生命逼近死亡之境，同时不把诗人的死亡说成已经完成。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 坟墓；亡者之境；音译“示奥尔”
  rationale: “阴间”在汉语中可表达亡者所在之境，又不将原词缩窄为实体坟墓。脚注明确其希伯来语为Sheol，并避免将其直接解释为某种后期形成的特定地狱观。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“心灵／生命”保留两行之间的词汇区别；“充满患难／已临近阴间”维持原文由深重苦难推进到死亡迫近的张力。
