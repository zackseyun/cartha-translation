  text: שַׁ֭תַּ/נִי בְּ/ב֣וֹר תַּחְתִּיּ֑וֹת בְּ֝/מַחֲשַׁכִּ֗ים בִּ/מְצֹלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/006.yaml
  text: You have put me in the lowest pit[a], in dark places, in the depths.
translation:
  language: zh_hans
  text: 你把我放在极深的坑里[a]，在黑暗之处，在深渊中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你把我安置在最底层的坑里，在黑暗中，在深处。”
    reason: 原文תַּחְתִּיּוֹת既可作为修饰“坑”的词，表达“极深的坑”，也可较直译地表达“最底层之处”；其余两个复数名词也可概括译作“黑暗”和“深处”。
lexical_decisions:
- source_word: שַׁתַּנִי
  choice: 你把我放在
  rationale: 该词表示“放置、安置”，是第二人称阳性单数作主语、第一人称单数作宾语。译文保留诗人对上帝的直接称呼和归因，同时采用自然的现代汉语表达。
- source_word: בְּבוֹר
  choice: 在……坑里
  rationale: בּוֹר可指坑、蓄水池或地牢般的深坑。本节带有濒死和阴间的意象；译作“坑”既保留比喻，也不把它过度限定为“坟墓”。
- source_word: תַּחְתִּיּוֹת
  choice: 极深的
  rationale: 该词指最低之处或最深之处。结合“坑”作定语译为“极深的”，以自然汉语表达其极端低下、深沉的空间意象。
- source_word: בְּמַחֲשַׁכִּים
  choice: 在黑暗之处
  rationale: 原文为复数形式，可指黑暗处或重重黑暗。译作“黑暗之处”保留具体空间感，也与本节各平行短语协调。
- source_word: בִּמְצֹלוֹת
  choice: 在深渊中
  rationale: 该词表示深处，尤其可用于深水或深不可测之地。“深渊”简洁地传达其幽深、压迫性的诗歌意象，但不明确限定为水域。
theological_decisions:
- issue: 哀歌中上帝的施动角色
  choice: 保留直接的第二人称表达：“你把我放在”
  alternative: 改用无主句或被动句，淡化上帝的直接施动
  rationale: 希伯来文明确把上帝说成将诗人置于这种境地的那一位。直译这一关系可保留哀歌本有的神学张力，而不加以缓和或解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。三个“在……”短语保留原文的平行结构；“你”维持直接呼告，“极深的坑—黑暗之处—深渊”逐层强化下沉与绝望的意象。
