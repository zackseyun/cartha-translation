  text: בַּ/מֵּתִ֗ים חָ֫פְשִׁ֥י כְּמ֤וֹ חֲלָלִ֨ים שֹׁ֥כְבֵי קֶ֗בֶר אֲשֶׁ֤ר לֹ֣א זְכַרְתָּ֣/ם ע֑וֹד וְ֝/הֵ֗מָּה מִ/יָּדְ/ךָ֥ נִגְזָֽרוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/005.yaml
  text: I am set free among the dead[a], like the slain who lie in the grave, whom you remember no more[c][b], and they are cut off from your hand.
translation:
  language: zh_hans
  text: 我在死人中得了自由[a]，如同那些躺在坟墓里的被杀者；你不再记念他们[b]，他们也从你手中被隔绝[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我在死人中是自由的”。原文使用“自由、获释”的说法，可能带有反讽意味：诗人仿佛已经死去，脱离了活人的领域。
    reason: lexical_alternative
  - marker: b
    text: 这里的“记念”可能不只是心里想起，也含有眷顾某人、为他采取行动的意思。
    reason: lexical_alternative
  - marker: c
    text: “手”在希伯来语中可象征权能、掌管或照顾；“被隔绝”也可译作“被割断”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמֵּתִים
  choice: 在死人中
  rationale: 介词 בְּ 与复数名词“死人”在这里表示所处的领域或群体；“在死人中”保留诗人已被归入死亡境域的意象。
- source_word: חָפְשִׁי
  choice: 被释放
  rationale: 该词意为“自由的、获释的”。上下文带有强烈反讽：诗人不是获得可喜的自由，而是仿佛脱离活人的世界，归入死人之中。
- source_word: חֲלָלִים
  choice: 被杀者
  rationale: 该词在诗歌中通常指遭杀戮而死的人；“被杀者”既保留其暴力死亡的含义，也适合庄重的诗体。
- source_word: שֹׁכְבֵי קֶבֶר
  choice: 躺在坟墓里的
  rationale: 分词结构描写持续的状态；此译自然地保留“躺卧于坟墓”的图景。
- source_word: אֲשֶׁר לֹא זְכַרְתָּם עוֹד
  choice: 你不再记念他们
  rationale: “记念”保留 זכר 的基本意象，同时在圣经语境中可涵盖眷顾并为某人采取行动，不把含义缩减为单纯的心理回忆。
- source_word: מִיָּדְךָ
  choice: 从你手中
  rationale: 直译“手”的比喻，以保留能力、掌管和照顾等多重可能含义。
- source_word: נִגְזָרוּ
  choice: 被隔绝
  rationale: גזר 的尼法勒式表达被切断、被割离；“被隔绝”在现代汉语中自然，又保留关系断绝的强烈意象。
theological_decisions:
- issue: 上帝“不再记念”死人所表达的意义
  choice: 正文译作“你不再记念他们”
  alternative: 你不再眷顾他们／你不再顾念他们
  rationale: 哀歌从受苦者的经验发声。“记念”既忠实保留原文，也容纳关系性和行动性的含义，而不把诗句解释成上帝在认知上遗忘了他们。
- issue: “在死人中自由”的反讽含义
  choice: 译作“我在死人中被释放”
  alternative: 我在死人中是自由的／我被撇在死人中
  rationale: 原文刻意使用“自由、获释”的悖论性语言。保留“释放”可传达其诗意张力，避免直接改写成“被遗弃”等较强的神学解释。
- issue: “从你手中被隔绝”的神学张力
  choice: 保留“手”的原文意象
  alternative: 脱离你的权能／不再蒙你照顾
  rationale: “手”可能兼指权能、掌管或照顾。正文不限定其中一种解释，以保存哀歌中关于死亡与上帝关系的张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。“死人”“坟墓”“手”等具体意象均予保留；用分号呈现前后两个紧密相关的诗意层次，不额外加入原文未明说的因果关系。
