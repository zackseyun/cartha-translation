    text: “玛哈拉·利安诺”的意思不能确定，可能指某种曲调或音乐形式；也有人理解为“按麻哈拉调，作应答歌唱”或“按麻哈拉调，关于苦难”。
    reason: lexical_alternative
  - marker: b
    text: “玛斯基勒”是诗篇标题中的专门用语，其确切含义不能确定，通常理解为具有教导或默想性质的诗。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר מִזְמוֹר
  choice: 诗歌
  rationale: 两个并列的体裁词都与音乐诗作有关。合译为自然的汉语“诗歌”，避免生硬重复，同时保留标题的体裁功能。
- source_word: לִבְנֵי קֹרַח
  choice: 可拉子孙的
  rationale: 前缀 ל 可表示作者、归属或关联；汉语“的”不强行限定具体关系。
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐指挥
  rationale: 这是诗篇标题中的演奏指示，指负责音乐演出的人；“圣乐指挥”在敬拜语境中清楚自然。
- source_word: עַל
  choice: 调用
  rationale: 在音乐标题中可引出曲调或演唱方式；“调用”简洁表达按某曲调或方式演唱，但不断定该术语的具体性质。
- source_word: מָחֲלַת לְעַנּוֹת
  choice: 麻哈拉·利亚诺
  rationale: 其确切意义有争议，采用音译并在脚注说明可能解释，以保存原文的不确定性。
- source_word: מַשְׂכִּיל
  choice: 训诲诗
  rationale: 这是诗篇标题中的技术术语，通常与教导或默想有关；译为“训诲诗”既便于理解，也以脚注保留其语义不确定性。
- source_word: לְהֵימָן
  choice: 希幔的
  rationale: 前缀 ל 所表达的作者、归属或关联关系并不完全确定；“的”保留这种开放性。
- source_word: הָאֶזְרָחִי
  choice: 以斯拉人
  rationale: 按传统理解作族属或称号，译为“以斯拉人”；也可能与“谢拉人”相关，但正文不作此判定。
