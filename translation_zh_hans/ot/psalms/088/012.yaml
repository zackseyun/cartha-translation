  text: הֲ/יִוָּדַ֣ע בַּ/חֹ֣שֶׁךְ פִּלְאֶ֑/ךָ וְ֝/צִדְקָתְ/ךָ֗ בְּ/אֶ֣רֶץ נְשִׁיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/012.yaml
  text: Is your wonder made known in the darkness[b][a], or your righteousness in the land of forgetfulness?
translation:
  language: zh_hans
  text: 你的奇事岂能在黑暗中被知晓？你的公义[a]岂能在遗忘之地[b]被知晓？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“公正”。
    reason: lexical_alternative
  - marker: b
    text: “遗忘之地”是指死者所在领域的诗意说法。
    reason: cultural_note
lexical_decisions:
- source_word: הֲיִוָּדַע
  choice: 岂会……被人知道
  rationale: 该词是ידע的尼法勒未完成式，位于反问句中；用“岂会……被人知道”既保留被动含义，也自然表达此处预期否定回答的诗歌反问。第二行承前省略谓语，中文补出以使平行结构清楚。
- source_word: בַּחֹשֶׁךְ
  choice: 在黑暗中
  rationale: 介词加定冠词直译为“在黑暗中”；上下文同时使其带有死亡领域的意象，但正文不将这一意象直接解释为“阴间”。
- source_word: פִּלְאֶךָ
  choice: 你的奇事
  rationale: 希伯来文为带第二人称单数后缀的单数名词，可指上帝奇妙的作为；中文“奇事”既能保持形式上的单数，也可作概括性表达。
- source_word: וְצִדְקָתְךָ
  choice: 你的公义
  rationale: וְ在两个平行反问分句之间可由中文句式表达而不必机械译作“和”；צדקה译为“公义”，同时以脚注保留“公正”这一语境上可行的译法。
- source_word: בְּאֶרֶץ נְשִׁיָּה
  choice: 在遗忘之地
  rationale: 按诗歌意象译为“遗忘之地”，保留其字面隐喻；脚注说明它在本节中指向死者所在的领域。
theological_decisions:
- issue: 诗歌语境中צדקה所指上帝的属性或作为
  choice: 公义
  alternative: 公正
  rationale: צדקה兼有正直、公义与施行公正的语义。“公义”保留较宽的语义范围，不把此处仅限定为司法性的公正；脚注列出可行替代译法。
- issue: “黑暗”与“遗忘之地”的死亡意象
  choice: 正文保留诗歌隐喻，仅在脚注解释“遗忘之地”
  alternative: 正文直接译为“阴间”或“死者之地”
  rationale: 原文使用意象而非直接采用“阴间”一词；保留隐喻可避免把诗句的诗性张力过早解释掉。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两行均用“岂会……被人知道”形成清晰的平行反问；正文保留“黑暗”和“遗忘之地”的原文意象，不作教派化解释。
