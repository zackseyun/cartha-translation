  text: שָׁאֲפ֣וּ שׁ֭וֹרְרַ/י כָּל הַ/יּ֑וֹם כִּֽי רַבִּ֨ים לֹחֲמִ֖ים לִ֣/י מָרֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/002.yaml
  text: My enemies pant after me all day long[a], for many fight against me from on high.
translation:
  language: zh_hans
  text: 我的仇敌终日急切追逼我[a]，因为有许多人从高处攻击我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“至高者啊，我的仇敌终日急切追逼我，因为有许多人攻击我。”末尾的希伯来词也可理解为描述敌人“从高处”或“居高位”攻击，另有人译作“狂傲地”。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאֲפוּ
  choice: 急切追逼
  rationale: 该动词带有喘息、嗅气般紧追猎物的生动意味，在敌对语境中表示迫切追赶或猛烈侵害；译作“急切追逼”既自然，也保留其追猎感，而不武断限定为“践踏”。
- source_word: שׁוֹרְרַי
  choice: 我的仇敌
  rationale: 指敌对者；“我的仇敌”简明、庄重，符合哀歌语境。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 准确而凝练地表达持续一整天之意，适合诗歌体。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出前句申诉的原因。
- source_word: רַבִּים
  choice: 有许多人
  rationale: 直接表达敌对者人数众多，并使现代汉语句法自然。
- source_word: לֹחֲמִים לִי
  choice: 攻击我
  rationale: 分词结构表达持续敌对、争战；“攻击我”通顺且保留军事性的敌意。
- source_word: מָרוֹם
  choice: 从高处
  rationale: 保留该词“高处、高位”的空间或地位意象，同时不在正文中强行判定为“狂傲地”或对上帝的呼语。
theological_decisions:
- issue: מָרוֹם 的句法与神学指向
  choice: 从高处
  alternative: 或作“至高者啊”；也可能意为“狂傲地”
  rationale: 末词句法高度凝缩，可描述敌人从高处或高位发动攻击，也可作对上帝的呼语，或按副词理解为“狂傲地”。正文保留“高”的基本意象，脚注列出其他可能，以免消除原文的歧义与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“急切追逼”传达捕猎般紧迫的敌意；“从高处”有意保留原文末词的意象与歧义。脚注标记[a]已置于相关分句之后。
