source:
  edition: WLC
  text: בֵּ/אלֹהִים֮ אֲהַלֵּ֪ל דְּבָ֫ר֥/וֹ בֵּ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה בָשָׂ֣ר לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/004.yaml
  text: In God I will praise his word[a]; in God I have trusted; I will not fear[c][b]. What can flesh do to me?
translation:
  language: zh_hans
  text: 我靠着上帝，要赞美他的话[a]；我信靠上帝，必不惧怕。血肉之人[b]能把我怎么样呢？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠着上帝”也可译作“在上帝里面”；这里的介词可表示赞美所依凭的根基或所在的范围。
    reason: lexical_alternative
  - marker: b
    text: “血肉之人”直译为“肉身”或“血肉”，这里指与上帝相比软弱有限的人。
    reason: cultural_note
  - marker: c
    text: 原文形式上是“血肉之人会对我做什么？”这里按表达确信的反问译为“能把我怎么样呢？”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: 靠着上帝／信靠上帝
  rationale: 介词ב与“上帝”连用，在首句表示赞美所依凭的根基或范围；第二处与בטחתי构成“信靠上帝”。中文按各自句法自然表达，同时保留两句以上帝为中心的平行结构。
- source_word: אֲהַלֵּל
  choice: 我要赞美
  rationale: Piel未完成式第一人称单数在诗歌中可表达将来或决意；“我要赞美”传达诗人的坚定意愿。
- source_word: דְּבָרוֹ
  choice: 他的话
  rationale: דבר可指话语、所说之事或应许；“他的话”保留原词的宽度，不将其限定为某一项具体应许。
- source_word: בָּטַחְתִּי
  choice: 我信靠
  rationale: 完成式表示已经作出的信靠，并带来当前的安稳。现代汉语用“我信靠”比“我已经信靠了”更自然，也能承接下句“不惧怕”。
- source_word: לֹא אִירָא
  choice: 必不惧怕
  rationale: 否定词加未完成式表达持续或面向将来的无惧；“必不惧怕”兼具确信与决意。
- source_word: מַה יַּעֲשֶׂה
  choice: 能把……怎么样呢
  rationale: 字面为“会对我做什么”，但此处是表达信心的反问。中文“能把我怎么样呢”自然传达其无能为害的语用含义。
- source_word: בָשָׂר
  choice: 血肉之人
  rationale: בשר字面为“肉身／血肉”，此处转指与上帝相对、软弱有限的人。“血肉之人”既保留意象，也让现代读者清楚其所指。
- source_word: לִי
  choice: 把我怎么样／对我
  rationale: לִי直译为“对我”；配合中文反问习惯，整句表达为“能把我怎么样呢”。
theological_decisions:
- issue: בָשָׂר所表达的人论对比
  choice: 血肉之人
  alternative: 世人／凡人／血肉
  rationale: 经文把上帝与脆弱有限的人相对照。“血肉之人”保留希伯来语的具体意象，同时避免单用“血肉”在中文中指代不明。
- issue: 信靠与不惧怕之间的关系
  choice: 以分号连接“我信靠上帝，必不惧怕”与前一赞美分句，并在信靠与无惧之间使用逗号
  alternative: 将三句完全拆开，或明确译作“所以我不惧怕”
  rationale: 原文并无明示因果连词。现有标点让读者感受到信靠与无惧的紧密关系，却不额外加入“所以”来锁定句法。
- issue: 首个בֵּאלֹהִים的语义
  choice: 靠着上帝
  alternative: 在上帝里面／因上帝
  rationale: 介词可表达范围、根基或凭借；“靠着上帝”在现代汉语中自然，并保留赞美以上帝为依凭的含义，但脚注注明其可能的表达范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“血肉之人”保留诗歌意象；“能把我怎么样呢”使用普通读者易懂的反问句式。标点保留三个分句的连贯推进，同时不把原文未明说的因果关系显性化。
