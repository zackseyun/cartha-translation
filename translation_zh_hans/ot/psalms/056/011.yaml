  text: בֵּֽ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/011.yaml
  text: In God I have trusted; I will not fear[a]. What can man do to me?
translation:
  language: zh_hans
  text: 我倚靠上帝，必不惧怕。人能把我怎么样呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: 倚靠上帝
  rationale: 介词 בְּ 与 אֱלֹהִים 在此标明信靠的对象；现代汉语用“倚靠上帝”自然表达这一信靠公式。
- source_word: בָּטַחְתִּי
  choice: 我倚靠
  rationale: 这是 בטח 的 Qal 完成式第一人称单数，表达已经确立、持续有效的信靠。汉语不强制标示完成体；若译作“已经倚靠”，容易误解为信靠已经结束，因此正文采用简洁而坚定的“我倚靠”。
- source_word: לֹא אִירָא
  choice: 必不惧怕
  rationale: 否定词 לֹא 加未完成式第一人称单数，在语境中表达由信靠而来的坚定决意或将来确信。“必不惧怕”兼顾其前瞻性与宣告语气。
- source_word: מַה יַּעֲשֶׂה
  choice: 能把……怎么样
  rationale: מַה 字面为“什么”，与 עשה“做”构成反问。汉语“能把我怎么样”自然传达“能对我做什么”的修辞力度，并未把实际可能受害解释为绝对不可能。
- source_word: אָדָם
  choice: 人
  rationale: אָדָם 为单数，在这里代表任何与上帝相对的人。现代汉语“人”既保留单数代表性，也无需加入原文没有的性别限定。
- source_word: לִי
  choice: 把我……怎么样
  rationale: לִי 字面为“对我／向我”；在汉语反问句“能把我怎么样”中，其受事关系由“把我”自然表达。
theological_decisions:
- issue: 信靠上帝与人的伤害能力之间的张力
  choice: 保留反问：“人能把我怎么样呢？”
  alternative: 译成绝对命题，如“人不能伤害我”
  rationale: 原文用反问表达诗人的无惧，并未直接断言人无法造成任何现实伤害；保留反问可避免消解诗篇中信靠与苦难并存的张力。
- issue: אָדָם 的代表性单数
  choice: 人
  alternative: 世人／人类／男人
  rationale: “人”最贴近该词在此处所指的单个、代表性的人类对手；“世人／人类”会转成集合概念，“男人”则加入上下文并未强调的性别含义。
translation_notes:
  register: 采用现代、庄重而口语可懂的诗歌语言。“倚靠”比“信赖”更贴近圣诗语域，又不显陈旧；“必不惧怕”保持坚定宣告，“能把我怎么样呢”则以自然汉语保存原文反问的力度。
