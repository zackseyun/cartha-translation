    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给乐长
  rationale: 这是诗篇标题中的常见用语，指向负责统筹音乐演奏的人；“乐长”简洁庄重，也不把其职责限缩为合唱指挥。
- source_word: עַל
  choice: 调用
  rationale: 在诗篇标题中，עַל 后接曲调或曲名时，常表示按某曲调演唱；“调用”符合中文音乐标题的表达。
- source_word: יוֹנַת אֵלֶם רְחֹקִים
  choice: 《远方无声之鸽》
  rationale: 该短语含义不明，很可能是曲名。按较直接的词义译出并用书名号标明标题性质，同时以脚注保留不确定性。
- source_word: לְדָוִד
  choice: 大卫的
  rationale: 保留 לְ 所能表达的作者、归属或关联等空间，不明确收窄为“大卫所作”。
- source_word: מִכְתָּם
  choice: 米克坦
  rationale: 这是诗篇标题中的专门术语，确切含义不明；音译比推测性意译更稳妥。
- source_word: בֶּאֱחֹז אֹתוֹ
  choice: 抓住他时
  rationale: בְּ 加不定式结构交代写作背景或场合；“抓住”准确表达采取控制的敌对行动，又不必过度断定正式俘虏的细节。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经读者熟悉的民族名称。
- source_word: בְּגַת
  choice: 在迦特
  rationale: 按地点介词的通常含义翻译，并采用通行地名译法。
theological_decisions:
- issue: 诗篇标题的经文地位与译法
  choice: 把标题作为经文正文翻译，保留其中的音乐、归属和历史背景信息
  alternative: 将其仅作为编辑性元数据，或省略不译
  rationale: 马所拉文本将本行作为诗篇标题保存；正文翻译能忠实呈现源文本，同时不对其文学或教义功能作额外判断。
- issue: לְדָוִד 所表达的大卫关联
  choice: 译作“大卫的”
  alternative: 译作“大卫所作”或“献给大卫”
  rationale: 希伯来介词结构可指作者、归属或关联；中文“大卫的”较能保留这种未完全限定的关系。
- issue: מִכְתָּם 的含义
  choice: 音译为“米克坦”
  alternative: 意译为“金诗”“铭刻诗”等
  rationale: 该术语的词源和具体功能不确定，意译会把推测写入正文。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。标题以短句呈现；曲名使用书名号，专门术语采用音译。正文中的[a]、[b]与脚注逐一对应。
