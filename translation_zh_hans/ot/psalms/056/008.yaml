  yaml_path: translation/ot/psalms/056/008.yaml
  text: You have counted my wanderings[a]; put my tears in your bottle—are they not in your book?
translation:
  language: zh_hans
  text: 我的漂泊，你都数算过；求你把我的眼泪放在你的皮袋里[a]。难道不在你的册子里吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮袋”指古代用兽皮制成、用来盛液体的容器，也可译作“皮囊”或“瓶”。
    reason: 说明 נֹאד 所指的古代兽皮容器，避免读者理解为现代玻璃瓶。
lexical_decisions:
- source_word: נֹדִי
  choice: 我的漂泊
  rationale: נוד在这里指被迫流离、四处漂荡。“漂泊”保留具体的行动和处境，也不把它抽象化为“苦难”。
- source_word: סָפַרְתָּה
  choice: 你都数算过
  rationale: ספר的基本义是数点、计算，也可引申为记录。“数算过”保留具体动词意象，并表达上帝对诗人每次漂泊的留意。
- source_word: שִׂימָה
  choice: 求你……收在
  rationale: 这是שׂים的祈使形式，基本义为放置。中文以“求你”体现祈求语气，以“收在”自然配合把眼泪存入容器的诗歌意象。
- source_word: דִמְעָתִי
  choice: 我的眼泪
  rationale: 直译并保留诗中具体、个人性的哀痛意象；希伯来语为单数形式，在此可作集合意义，中文“眼泪”自然涵盖这一点。
- source_word: בְנֹאדֶךָ
  choice: 在你的皮囊里
  rationale: נֹאד指用兽皮制成、可盛液体的囊。“皮囊”比现代意义的“瓶子”更准确地呈现古代器物，同时保持意象简洁。
- source_word: הֲלֹא
  choice: 难道不……吗
  rationale: 保留原文预期肯定回答的反问语气，不将其改写成平直的陈述。
- source_word: בְסִפְרָתֶךָ
  choice: 记在你的册子上
  rationale: 该词指书册或记录。中文“册子”既自然，又避免过度限定为某种特定材质的书卷；补出“记”使反问在中文中通顺，并承接记录的含义。
theological_decisions:
- issue: 上帝收存眼泪并有册子记录的拟人化意象
  choice: 保留“皮囊”和“册子”的具体意象
  alternative: 意译为“你记得我一切的痛苦”
  rationale: 原文以鲜明意象表达上帝对受苦者的细致关注。保留这些意象可维持诗歌张力，避免把经文缩减成抽象解释。
- issue: 末句反问中省略的内容
  choice: 译作“难道不都记在你的册子上吗？”
  alternative: 明确补作“我的眼泪难道不都记在你的册子上吗？”
  rationale: 原文反问简练，所指可由前文理解。中文用“都”承接前面的漂泊与眼泪，同时不把语法所容许的指向强行限定为仅指眼泪。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“我的漂泊，你都数算过”保留原文前置宾语的强调；全句维持从被数算的漂泊、被收存的眼泪到册中记录的具体意象推进。
