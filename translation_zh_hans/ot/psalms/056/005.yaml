lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 表达整日持续不断的行动，简洁自然，并保留希伯来语的延续意味。
- source_word: דְּבָרַי
  choice: 我的话
  rationale: דָּבָר也可指事情或事务，但与此处敌对行为及动词搭配时，理解为诗人的言语最合适。
- source_word: יְעַצֵּבוּ
  choice: 歪曲
  rationale: 该词在此较难确定，也可能表达使痛苦、伤害等意思；以“我的话”为宾语时，“歪曲”最自然地表达恶意曲解。
- source_word: עָלַי
  choice: 针对我
  rationale: 介词短语在敌对语境中具有不利、对抗的意味；“针对我”既自然，也不把它误解为单纯的空间关系。
- source_word: כָּל מַחְשְׁבֹתָם
  choice: 他们的一切意念
  rationale: מַחְשָׁבוֹת可指思想、打算或计谋；“意念”保留其范围，不预先限定为已经形成的计划。
- source_word: לָרָע
  choice: 要加害于我
  rationale: 字面为“为了恶／祸害”，在本句中表示恶意和伤害目的；如此译法符合现代汉语，同时保留敌意所指向的实际祸害。
