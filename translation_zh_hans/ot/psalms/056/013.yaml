  source_fidelity: 译文忠实反映希伯来文：כִּי译为“因为”，承接前文；完成式“你救了”恰当表达已施行的拯救。“我的性命，使我脱离死亡”自然传达נַפְשִׁי מִמָּוֶת的生命/全人意涵，且脚注保留词义范围。הֲלֹא的肯定性反问由“你岂不也”清楚体现；“保守我的双脚免于失足”准确表达脚与跌倒的意象。末句保留目的关系、在神面前行走，以及“生命之光”的诗性表达。
  naturalness: 现代标准汉语流畅、庄重，适合诗篇。分号后的反问与末尾目的分句衔接清晰；“在上帝面前行走，在生命之光中”虽保留诗歌式重复，仍自然可读。
