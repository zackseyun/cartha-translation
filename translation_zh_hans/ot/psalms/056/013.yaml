id: PSA.56.13
reference: Psalms 56:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י הִצַּ֪לְתָּ נַפְשִׁ֡/י מִ/מָּוֶת֮ הֲ/לֹ֥א רַגְלַ֗/י מִ֫/דֶּ֥חִי לְ֭/הִֽתְהַלֵּךְ לִ/פְנֵ֣י אֱלֹהִ֑ים בְּ֝/א֗וֹר הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/013.yaml
  text: For you have delivered my soul from death[a]; have you not also kept my feet from stumbling[d][c][b], that I may walk before God in the light of life?
translation:
  language: zh_hans
  text: 因为你救了我的性命，使我脱离死亡[a]；你岂不也保守我的双脚免于失足[b]，使我能在上帝面前行走，在生命之光中[c]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的性命”也可译作“我的灵魂”或“我”。希伯来语נֶפֶשׁ可指灵魂、生命或整个人。
    reason: lexical_alternative
  - marker: b
    text: “失足”也可译作“跌倒”。
    reason: lexical_alternative
  - marker: c
    text: “生命之光”也可译作“活人之光”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明诗人感恩与信靠的缘由；现代汉语用“因为”自然保留其因果连接作用。
- source_word: הִצַּלְתָּ
  choice: 你救了
  rationale: 使役形完成式表示上帝已经施行拯救；“救了”简洁自然，也保留已完成而仍有现实意义的语气。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ在此与“死亡”搭配，主要指诗人的生命乃至整个人。“性命”在现代汉语中自然贴切，同时以脚注保留“灵魂/我”的词义幅度。
- source_word: מִמָּוֶת
  choice: 使我脱离死亡
  rationale: 原文介词表达从死亡或死亡威胁中获救；汉语补出“使我”可使句法顺畅，而不增加新的语义。
- source_word: הֲלֹא
  choice: 你岂不也
  rationale: 保留期待肯定回答的反问语气，并将第二项拯救与前句连接起来。
- source_word: רַגְלַי
  choice: 我的双脚
  rationale: 保留原文具体的身体意象，并与后文“行走”相呼应。
- source_word: מִדֶּחִי
  choice: 免于失足
  rationale: דֶּחִי可指跌倒、倾覆；“失足”与“双脚”和“行走”的诗歌意象衔接自然。
- source_word: לְהִתְהַלֵּךְ
  choice: 使我能……行走
  rationale: ל加不定式表达目的或结果；此译法既能表示蒙拯救后的目的，也不排除结果意味。
- source_word: לִפְנֵי אֱלֹהִים
  choice: 在上帝面前
  rationale: 忠实保留“在上帝面前/临在中”的表达，简洁而庄重。
- source_word: בְּאוֹר הַחַיִּים
  choice: 在生命之光中
  rationale: 直译并保留原文关于光与生命的诗性意象；חַיִּים也可能指活着的人，故列脚注说明。
theological_decisions:
- issue: נַפְשִׁי所表达的人论含义
  choice: 我的性命
  alternative: 我的灵魂；我
  rationale: 上下文聚焦于脱离死亡，不要求把נֶפֶשׁ理解为与身体分离的技术性“灵魂”。“性命”最贴合语境，同时脚注保留该词可指灵魂、生命或整个人的张力。
- issue: בְּאוֹר הַחַיִּים的意象
  choice: 在生命之光中
  alternative: 在活人之光中
  rationale: 保留构词和诗性含混，不把它限定为仅指今世存活，也不将其扩展成经文本身没有明说的末世论概念。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“救了我的性命，使我脱离死亡”避免生硬直译；分号保留“死亡”后的主要停顿，随后以反问句呈现הֲלֹא。末句维持原文“行走—面前—光—生命”的连续意象。
