source:
  edition: WLC
  text: עַל אָ֥וֶן פַּלֶּט לָ֑/מוֹ בְּ֝/אַ֗ף עַמִּ֤ים הוֹרֵ֬ד אֱלֹהִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/007.yaml
  text: Because of iniquity[a], do not let them escape; in anger bring down the peoples[b], O God.
translation:
  language: zh_hans
  text: 因他们的罪孽，不要让他们逃脱[a]；上帝啊，求你在怒中使众民[b]降卑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文十分凝缩，也可译作：“因罪孽，不要搭救他们。”原动词既可指“逃脱”，也可指“搭救”；原文没有明写否定词。另有人把本句理解为反问：“他们岂能因罪孽而逃脱？”
    reason: alternative_reading
  - marker: b
    text: 或译：“列国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אָוֶן
  choice: 因他们的罪孽
  rationale: עַל在这里最可能表示原因或根据，אָוֶן指罪恶、不义之事。“因他们的罪孽”自然地表达诗人求上帝施行审判的理由；“他们的”虽未在此短语中明说，却由לָמוֹ及上下文清楚限定。
- source_word: פַּלֶּט לָמוֹ
  choice: 不要让他们逃脱
  rationale: פלט可指逃脱，也可作使役义“搭救、解救”。本句结构高度凝缩；结合后半句求上帝使众民降卑的审判语境，正文采用否定祈求的理解，但在脚注保留更直接的“不要搭救他们”译法及句法上的不确定性。
- source_word: בְּאַף
  choice: 在怒中
  rationale: אַף在此是“怒气、烈怒”的惯用义。“在怒中”保留介词表达的情状或方式，也不把原文未明说的“你的”加入正文。
- source_word: עַמִּים
  choice: 众民
  rationale: עַמִּים是עַם的复数，基本义为多个民族或民众群体。“众民”较贴近原词，也避免正文直接把它限定为政治意义上的国家；脚注列出“列国”这一合适的语境译法。
- source_word: הוֹרֵד
  choice: 使……降卑
  rationale: 这是ירד的使役命令式，字面为“使下降”。“使……降卑”保留下降的意象，同时在现代汉语中自然表达使之败落、受制伏的含义。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处是直接呼求；句末的希伯来语呼格在汉语中前置为“上帝啊”，使祈求对象清楚而自然。
theological_decisions:
- issue: 咒诅性祈求及凝缩首句中未明说的否定
  choice: 将首句译为求上帝不要让作恶者逃脱，后句译为求上帝在怒中使众民降卑。
  alternative: 可理解为“因罪孽，不要搭救他们”；也有人把首句理解为陈述或反问：“他们岂能因罪孽而逃脱？”
  rationale: 马所拉文本没有明写否定词，且פַּלֶּט既可涉及“逃脱”，也可表示“搭救”。然而本诗上下文及与后半句的并行关系支持审判性的否定祈求。正文采用这一较可能的连贯读法，脚注则明确保留原文的困难和主要替代解释，不弱化诗篇中的审判诉求，也不把有争议的句法说成毫无疑问。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇祈祷语体。“求你”使希伯来语命令式在向上帝祈求的汉语语境中自然得体；分号保留两项紧密相连的审判祈求。所有脚注标记均已置于正文对应位置。
