  yaml_path: translation/ot/psalms/056/010.yaml
  text: In God I will praise the word[a]; in Yahweh I will praise the word.
translation:
  language: zh_hans
  text: 我在上帝里面，我要赞美他的话语[a]；我在雅威里面，我要赞美他的话语。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话语”也可译作“应许”；两行中的希伯来语 דָּבָר 均可指“话语、事情”或“应许”，具体含义取决于语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: 我倚靠上帝
  rationale: 介词 בְּ 在这里表示倚靠、信赖的关系。译成“我倚靠上帝”既符合诗歌语境，也与下半句 בַּיהוָה 严整对应；若直译为“在上帝里”，现代汉语不够自然。
- source_word: אֲהַלֵּל
  choice: 赞美
  rationale: 这是 הלל 的 Piel 未完成式第一人称单数，可表达当下持续的宣告或意愿。上下文更像诗人的信靠宣言，汉语用“赞美”简洁自然，同时不强行限定为现在或将来。
- source_word: דָּבָר
  choice: 他的话
  rationale: דָּבָר 可指“话、事情、应许”。此处所赞美的是上帝所说的话；加入“他”使汉语对象关系清楚，但保留“话”而不直接译成“应许”，以保存原文的语义宽度。
- source_word: בַּיהוָה
  choice: 我倚靠雅威
  rationale: 介词 בְּ 与上半句平行，译作“倚靠”；神名 יהוה 音译为“雅威”，保留经文直接使用的圣约之名。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近学界通行重构读音的“雅威”，使它与上半句的“上帝”之称形成原文已有的对应与区别。
- issue: 所赞美的是“话”还是“应许”
  choice: 话
  alternative: 应许
  rationale: 上下文可能特指上帝的应许，但 דָּבָר 本身的意义较宽。正文译“话”以保存词义张力，并在脚注说明“应许”这一合乎语境的理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两行保持严格平行，并重复“赞美他的话”，以再现希伯来诗句的结构和强调；不以“应许”替代正文中的宽义词。
