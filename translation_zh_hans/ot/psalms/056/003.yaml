  text: When I am afraid[a], I will trust in you.
translation:
  language: zh_hans
  text: 我惧怕的时候[a]，我要信靠你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在我惧怕的日子，我——要信靠你。”
    reason: 说明יוֹם的字面表达，并呈现独立代词אֲנִי所带的强调。
lexical_decisions:
- source_word: י֥וֹם
  choice: ……的时候
  rationale: יוֹם本义为“日子”，但在“我惧怕的日子”这一结构中引出时间从句；现代汉语用“……的时候”更自然，同时保留其时间意义。
- source_word: אִירָ֑א
  choice: 我惧怕
  rationale: ירא的Qal未完成式第一人称单数在此指面对威胁时的害怕，而非敬畏；“惧怕”准确且符合诗歌的庄重语体。
- source_word: אֲ֝נִ֗י
  choice: 我仍要
  rationale: 独立人称代词אֲנִי在已有第一人称动词的情况下带有强调作用。“仍”自然地传达“我”面对惧怕却作出信靠回应的强调；脚注保留原文较直译的形式。
- source_word: אֵלֶ֥י/ךָ
  choice: 信靠你
  rationale: 介词אֶל表示信靠指向“你”；汉语“信靠你”自然表达这一关系，不必机械译出“向”。
- source_word: אֶבְטָֽח
  choice: 要信靠
  rationale: בטח意为“信靠、倚靠”。此处未完成式适合表达诗人的决意，因此译为“要信靠”，而不是单纯陈述习惯。
theological_decisions:
- issue: 惧怕与信靠的关系
  choice: 保留诗人确实惧怕、却仍决意信靠上帝的张力。
  alternative: 译成信心使惧怕完全消失。
  rationale: 希伯来文并未否认惧怕，而是把“我惧怕”与“我信靠你”并置；“仍要”表达回应而不把经文扩展为毫无惧怕。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“惧怕”比口语化的“害怕”更适合诗篇语体；“仍要”传达原文独立人称代词的强调，同时避免生硬的“我，我要”。
