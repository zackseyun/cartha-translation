  text: Be gracious to me[a], O God, for man pants after me; all day long, fighting, he oppresses me.
translation:
  language: zh_hans
  text: 上帝啊，求你恩待我，因为有人穷追我不舍[a]；他终日攻击，压迫我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穷追我不舍”或译“践踏我”、“对我喘息般地紧追”，或“想吞吃我”；希伯来语动词描绘敌意的喘息或急切追逐。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: 求你恩待我
  rationale: 该词是 חנן 的皮勒式祈使形，带第一人称单数后缀，表达向上帝恳求施恩眷顾。“恩待我”自然、庄重，也不额外加入悔罪语境。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 在祷告中作直接呼语；“上帝啊”准确体现呼格语气。
- source_word: כִּי
  choice: 因为
  rationale: 引出恳求上帝恩待诗人的理由，现代汉语用“因为”清楚自然。
- source_word: שְׁאָפַנִי
  choice: 穷追我不舍
  rationale: שׁאף 可描写喘息、嗅气，进而表示带着敌意急切追逐或企图吞噬。“穷追不舍”在现代汉语中保留其凶猛追逼的动态意象，但具体词义存在歧义，故加脚注说明。
- source_word: אֱנוֹשׁ
  choice: 有人
  rationale: 该单数名词指脆弱、必死的人；此处语境所指是一个人类仇敌。“有人”符合自然汉语，并保留对方不过是人的含义，而不把所指扩大为全人类。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁而有诗体色彩，准确表达持续整天。
- source_word: לֹחֵם
  choice: 攻击
  rationale: לחם 的主动分词描写持续争战的动作；与下句有限动词构成伴随关系。汉语译作“攻击”能自然表现敌对行动。
- source_word: יִלְחָצֵנִי
  choice: 压迫我
  rationale: לחץ 表示挤压、逼迫或欺压；“压迫我”既保留压力意象，也准确表达敌意侵害。
theological_decisions:
- issue: אֱנוֹשׁ 所指的人及其与上帝的对照
  choice: 有人
  alternative: 世人／一个必死的人
  rationale: 上下文描写具体的人类仇敌，而不是泛指整个人类。“有人”在汉语中自然地维持单数、不特定的人类所指；不加“必死的”则避免在正文中过度阐释，但仍保留人类敌手与上帝之间的隐含对照。
- issue: שְׁאָפַנִי 的敌对意象
  choice: 穷追我不舍
  alternative: 践踏我／冲我喘气／想吞吃我
  rationale: 希伯来动词的语义和意象有争议，可能指敌意喘息、急切追逐、践踏或吞噬。正文采用自然且贴合语境的追逼表达，脚注保留其他真实可能，避免把歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“上帝啊，求你……”符合汉语诗篇体裁；“终日”保持简练诗意。脚注标记置于整节末尾，对正文中的“穷追我不舍”作词义说明。
