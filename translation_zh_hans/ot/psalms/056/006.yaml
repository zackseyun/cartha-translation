  yaml_path: translation/ot/psalms/056/006.yaml
  text: They gather together[a]; they hide themselves; they watch my steps[d][c][b], as they wait for my life.
translation:
  language: zh_hans
  text: 他们聚集，藏匿起来；他们窥察我的脚踪[a]，等候要害我的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “脚踪”原文直译为“脚后跟”，在这里指脚步、踪迹或行动。
    reason: lexical_alternative
  - marker: b
    text: “等候要害我的性命”也可理解为“伺机害我的性命”；原文动词通常意为“等候”或“盼望”，在这里带有敌意。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוּרוּ
  choice: 他们聚集
  rationale: 在敌对语境中，此词表示聚集、结伙；译作“聚集”既自然，也不额外明说攻击行动。
- source_word: יצפינו
  choice: 藏匿起来
  rationale: 该使役形在此具有反身意味，指把自己隐藏起来；上下文自然带出暗中埋伏的色彩。
- source_word: הֵמָּה
  choice: 他们
  rationale: 独立代词带有强调作用；汉语以明确重复主语“他们”表达，不采用生硬的“他们自己”。
- source_word: עֲקֵבַי
  choice: 我的脚踪
  rationale: 字面为“我的脚后跟”，在此指留下的踪迹或行动路线；“脚踪”兼顾身体意象和跟踪语境。
- source_word: יִשְׁמֹרוּ
  choice: 窥察
  rationale: שמר 在此不是保护性“看守”，而是敌意地监视、盯住；“窥察”能体现隐蔽而敌对的观察。
- source_word: כַּאֲשֶׁר
  choice: 等候……
  rationale: 此处关系可理解为“正如／当……时”，也可能联结前后动作的方式；中文采用并列衔接，避免强行判定比较、时间或原因关系。
- source_word: קִוּוּ
  choice: 等候
  rationale: 保留 קוה 的核心义“等待、期待”，敌意由“取我的性命”及全句语境显明，不直接强化为“埋伏”。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נפש 在此指人的生命或本人；敌人等待机会加害，因此“性命”比“灵魂”更符合语境。
theological_decisions:
- issue: 末句敌人的目的及 כַּאֲשֶׁר 与前句的关系
  choice: 译为“等候取我的性命”，表达敌意目的，同时不显式锁定连接词为比较、时间或因果。
  alternative: “正如他们等候我的性命”或“因为他们图谋我的性命”
  rationale: 原文的 כַּאֲשֶׁר 通常可作“如同／当……时”，但此句句法略显紧缩；直译成汉语容易生硬，而译作“因为”又会过早消除歧义。
- issue: נפש 的指向
  choice: 性命
  alternative: 灵魂／我本人
  rationale: 本节描述敌人的跟踪和加害，所威胁的是诗人的生命；译作“性命”不引入灵魂与身体的神学二分。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。分号保留三个连续敌对动作的推进感；“藏匿起来”“窥察”“性命”自然呈现暗中跟踪与谋害的场景。
