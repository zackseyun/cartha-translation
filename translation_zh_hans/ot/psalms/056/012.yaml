  text: עָלַ֣/י אֱלֹהִ֣ים נְדָרֶ֑י/ךָ אֲשַׁלֵּ֖ם תּוֹדֹ֣ת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/012.yaml
  text: Your vows are upon me[a], O God[b]; I will render thank offerings to you.
translation:
  language: zh_hans
  text: 神啊，我向你所许的愿在我身上[a]；我要向你献上感谢祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你的愿在我身上”。这里可能是指诗人向神所许、归神所有并由诗人承担的愿。
    reason: alternative_reading
  - marker: b
    text: 或译“感谢”或“感恩的表达”；原词既可指感谢的表达，也可指感谢祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: 压在我身上
  rationale: 保留介词短语“在我身上”的具体意象，同时用“压”自然表达承担义务之意，避免直接释作“约束我”而过度解释。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 此处是直接称呼；“神啊”在现代汉语中自然体现呼格。
- source_word: נְדָרֶיךָ
  choice: 你的愿
  rationale: 依希伯来语第二人称单数后缀直译为“你的愿”，保留原文不寻常而可能含有“归你、欠你的愿”之意的表达；较顺畅的解释置于脚注。
- source_word: אֲשַׁלֵּם
  choice: 献上
  rationale: 该动词在此含偿付、履行所欠之意；与“感谢祭”搭配时，汉语用“献上”较自然，并由上句“压在我身上”保留偿还义务的语境。
- source_word: תּוֹדֹת
  choice: 感谢祭
  rationale: 该复数名词既可指感谢的表达，也可指感恩祭物；结合许愿及偿付义务的语境，祭献含义较可能。
- source_word: לָךְ
  choice: 向你
  rationale: 忠实表达接受者，符合现代汉语“向你献上”的搭配。
theological_decisions:
- issue: “你的愿”与神的关系
  choice: 正文保留“你的愿”这一贴近原文的说法，并以脚注说明可理解为“我向你所许的愿”。
  alternative: 我向你所许的愿
  rationale: 原文形式直译是“你的愿”，可能指归神所有、应向神偿还的愿。正文不把这一特殊表达无声地改写为第一人称所有关系，以保留其张力。
- issue: תּוֹדֹת 是感谢言辞还是祭物
  choice: 正文译作“感谢祭”。
  alternative: 感谢；感恩
  rationale: 许愿与偿付的语境支持祭献含义，但该词本身也可表示感谢或感恩的表达，因此在脚注保留词义上的另一可能。
translation_notes:
  register: 采用现代、庄重而可理解的诗体汉语。“压在我身上”保留原文负担或义务临到诗人的意象；分号呈现两分句之间由义务到履行的推进。
