  text: נִכְסְפָ֬ה וְ/גַם כָּלְתָ֨ה נַפְשִׁ/י֮ לְ/חַצְר֪וֹת יְה֫וָ֥ה לִבִּ֥/י וּ/בְשָׂרִ֑/י יְ֝רַנְּנ֗וּ אֶ֣ל אֵֽל חָֽי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/002.yaml
  text: My soul longs—indeed[a], it even faints—for the courts of Yahweh; my heart and my flesh cry out to the living God.
translation:
  language: zh_hans
  text: 我的心灵渴想雅威的庭院，甚至因渴慕而衰竭；我的心和肉体向永活的上帝欢呼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢呼”也可译作“欢唱”或“高声呐喊”。这个希伯来语动词通常指发出响亮、喜乐的呼声；本节在强烈渴慕上帝同在的语境中，也带有迫切而热切的意味。
    reason: 保留 יְרַנְּנוּ 所表达的响亮喜乐之声，并说明其在本节语境中的热切力度，避免将其误作祈求性的“呼求”。
lexical_decisions:
- source_word: נִכְסְפָה
  choice: 渴想
  rationale: 表达强烈而深切的向往；“渴想”简洁庄重，也能与下文递进的强度相配。
- source_word: וְגַם
  choice: 甚至
  rationale: 这里不只是并列两个动作，而是加强后一动词，形成“渴想—甚至昏厥”的递进。
- source_word: כָּלְתָה
  choice: 渴慕得昏厥
  rationale: 该词本义涉及耗尽、衰竭；在强烈渴慕的语境中，用“渴慕得昏厥”自然传达因向往而近乎力竭的形象。
- source_word: נַפְשִׁי
  choice: 我的灵魂
  rationale: 保留与后半句“我的心和肉体”的区分，并表达渴想的内在主体。
- source_word: לְחַצְרוֹת
  choice: 雅威的院宇
  rationale: 指圣所或圣殿范围内的院落；“院宇”简洁庄重，也能体现敬拜场所的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文所用的专名，而不以称号替代。
- source_word: לִבִּי
  choice: 我的心
  rationale: 自然对应人的内在思想、意愿和情感。
- source_word: וּבְשָׂרִי
  choice: 和肉体
  rationale: 保留“心和肉体”这一内外并举的希伯来表达，不缩减为较笼统的“全人”。
- source_word: יְרַנְּנוּ
  choice: 欢呼
  rationale: 该动词通常表示发出响亮而喜乐的呼声；“欢呼”保留其常见的喜乐色彩，同时脚注说明语境中也可理解为强烈呼求。
- source_word: אֶל
  choice: 向
  rationale: 直接体现动作朝向永活的上帝，比因渴慕语境而译作“为”更贴近原文。
- source_word: אֵל חָי
  choice: 永活的上帝
  rationale: “永活”自然表达上帝是活着且常存的，并保留这一圣经称谓的庄严感。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用上帝的专名；采用接近其通常重建读音的“雅威”，避免以称号“主”取代，也不把后期形成的混合读法放入正文。
- issue: יְרַנְּנוּ 的情感色彩
  choice: 欢呼
  alternative: 呼喊／呼求
  rationale: 该动词常带喜乐欢呼的意味，但本节强烈渴慕的语境也容许理解为呼求；正文采用常见词义，脚注保留另一种语境性理解，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“灵魂—心和肉体”保留原文的身体与内在生命意象；“院宇”体现圣所庭院的敬拜背景。句式以分号呈现两组平行诗行，并用“甚至”保留递进力度。
