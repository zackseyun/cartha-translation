source:
  edition: WLC
  text: יְהוָ֥ה צְבָא֑וֹת אַֽשְׁרֵ֥י אָ֝דָ֗ם בֹּטֵ֥חַ בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/012.yaml
  text: O Yahweh of hosts[b][a], blessed is the man who trusts in you.
translation:
  language: zh_hans
  text: 万军之雅威啊，信靠你的人有福了[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福了”也可译作“多么幸福”或“真是有福”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留这是上帝专名的性质，而不以“主”等称号代替。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 该词指成群的军旅或众军；在与神名连用的固定称号中译作“万军之”，既保留原文意象，也符合庄重自然的现代汉语表达。
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是诗歌和智慧文学中的感叹式蒙福宣告。“有福”比单指情绪的“快乐”涵义更宽，同时不把福分的具体性质解释得过细。
- source_word: אָדָם
  choice: 人
  rationale: 原文是单数的泛指名词，指任何这样信靠神的人；汉语“人”自然保留了这种代表性和普遍性。
- source_word: בֹּטֵחַ
  choice: 信靠
  rationale: 分词表达持续或具有特征性的信赖状态；“信靠”准确传达对雅威的倚赖，而不额外引入“投奔避难”的意象。
- source_word: בָּךְ
  choice: 你
  rationale: 保留第二人称单数的直接称呼；“信靠你”在现代汉语中已自然表达希伯来介词所标示的信赖对象。
theological_decisions:
- issue: 神名与称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之雅威
  alternative: 万军之耶和华；全能的主
  rationale: “雅威”直接音译神名，“万军之”保留 צְבָאוֹת 的军旅意象，避免用“全能”把称号所暗示的能力解释为一个较抽象的属性。句末“啊”自然标明诗人是在直接呼求雅威。
- issue: אַשְׁרֵי 所宣告福分的性质
  choice: 有福了
  alternative: 快乐；幸运
  rationale: 原文可涵盖幸福、可称羡和处境蒙福等意义。“有福”保留这种丰富性，不将其缩减为主观快乐或偶然好运。
translation_notes:
  register: 采用简洁、庄重而易懂的现代书面汉语。“万军之雅威啊”保留诗篇直接呼求的语气；后半句按汉语习惯组织为“信靠你的人有福了”，没有改变原文焦点。
