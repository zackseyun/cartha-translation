  text: Blessed are those who dwell in your house[a]; they will still praise you[c][b]. Selah
translation:
  language: zh_hans
  text: 住在你家中的人多么有福！[a]他们仍要赞美你。细拉[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“住在你家中的人有福了！”“你的家”在这里很可能指上帝的圣所或圣殿。
    reason: lexical_alternative
  - marker: b
    text: “细拉”是希伯来语礼仪或音乐用语，确切含义不明，传统上音译保留。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 多么有福
  rationale: 这是复数感叹式的福乐宣告；“多么有福”既保留感叹语气，也比单说“有福了”更自然地引出本句。
- source_word: יוֹשְׁבֵי
  choice: 住在……中的人
  rationale: ישׁב在此表示居住、常在，而不只是坐着；此译保留分词所表达的持续状态。
- source_word: בֵיתֶךָ
  choice: 你的殿中
  rationale: 字面为“你的房屋/家中”，在本诗语境中指上帝的圣所；中文“殿”能自然表达敬拜场所，同时不限定为某一具体建筑阶段。
- source_word: עוֹד
  choice: 还要
  rationale: עוֹד可表示仍然、继续或再；与未完成式连用时，“还要”自然保留延续及前瞻意味。
- source_word: יְהַלְלוּךָ
  choice: 他们……赞美你
  rationale: 未完成式可表达将来或惯常持续的行动；“还要赞美你”保留这种开放性，不强化为“不断”。
- source_word: סֶּלָה
  choice: 细拉
  rationale: 该礼仪或音乐术语的确切含义不明，因此按中文圣经传统音译，不作解释性翻译。
theological_decisions:
- issue: “你的殿”所指为何
  choice: 正文译为“你的殿”，指向上帝的圣所，但不进一步限定为圣殿建筑。
  alternative: 你的家中／你的房屋中
  rationale: בֵיתֶךָ字面是“你的房屋”，诗篇语境很可能指上帝的圣所。中文若直译“家”容易被理解为普通住所；“殿”保留敬拜语境，同时避免过度具体化。
- issue: 赞美行动的时态与持续性
  choice: 译作“还要赞美你”。
  alternative: 仍在赞美你／不断赞美你
  rationale: 希伯来语未完成式兼有将来、惯常或持续含义；“还要”保留此张力，不把它单一解释为现在持续或永不间断。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“多么有福”保留אַשְׁרֵי的感叹色彩；“殿”符合汉语敬拜语境。正文简洁，两个脚注分别说明“殿”的字面与语境含义，以及“细拉”的不确定性。
