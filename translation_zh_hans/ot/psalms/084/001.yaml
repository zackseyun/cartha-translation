  text: מַה יְּדִיד֥וֹת מִשְׁכְּנוֹתֶ֗י/ךָ יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/001.yaml
  text: How lovely are your dwelling places[a], O Yahweh of hosts!
translation:
  language: zh_hans
  text: 万军之雅威啊，你的居所多么可爱！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可爱”或译“令人喜爱”，也可译“美好”；“居所”原文为复数。
    reason: 保留 יְּדִידוֹת 的“可爱、可亲、令人喜爱、美好”等语义幅度，并说明汉语正文未显明的复数形式。
lexical_decisions:
- source_word: מַה
  choice: 多么
  rationale: 此处是感叹用法，并非疑问；“多么”自然地传达诗句的赞叹语气。
- source_word: יְּדִידוֹת
  choice: 可爱
  rationale: 该词可表达可爱、可亲、令人喜爱或美好；“可爱”简洁保留了对圣所的深切爱慕，同时不把含义局限为外观上的美丽。
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: 你的居所
  rationale: 该词为复数，指属于上帝的住处或圣所范围。汉语“居所”可自然作集合性表达，既保留居住这一词根含义，也避免“帐幕”使人只联想到摩西时代的会幕。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号代替。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 在神圣称号中，“万军”是简洁而庄重的表达，范围可涵盖天上的军队及受上帝统辖的众军，而不狭义限定为地上的军队。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”以呈现其作为专名的性质，而不以称号代替。“耶和华”是传统汉译音，但其语音形式较间接。
- issue: 称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之雅威
  alternative: 万军之主；军队的雅威
  rationale: 此译同时保留神名和 צְבָאוֹת 的广泛、庄严含义，不把所指仅限于人间军队。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；以“多么”呈现感叹句，并用“啊”自然标示呼语。正文保持简洁，脚注交代关键词的词义幅度及原文复数。
