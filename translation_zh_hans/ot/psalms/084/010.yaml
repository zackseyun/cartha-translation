base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/010.yaml
  text: For a day in your courts is better than a thousand[b][a]; I would rather stand at the threshold in the house of my God than dwell in the tents of wickedness.
translation:
  language: zh_hans
  text: 在你的院宇住一日，胜过一千[b]；我宁愿站在我上帝殿宇的门槛边[a]，也不愿住在邪恶的帐棚里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我选择留在我上帝殿宇的门槛边”；传统译作：“在我上帝的殿中看门。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“胜过一千”，没有明说“一千日”或“在别处的一千日”。
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב י֥וֹם בַּחֲצֵרֶיךָ מֵאָלֶף
  choice: 在你的院宇住一日，胜过千日
  rationale: טוֹב与比较介词מִן构成比较，译为“胜过”；原文只说“千”，汉语为使比较项自然，补出前文已明示的量词性内容“日”，但不加入原文没有的“别处”。“院宇”既保留圣所庭院的具体意象，也符合庄重诗歌语体。
- source_word: בָּחַרְתִּי
  choice: 我宁愿
  rationale: 形式上是完成式“我选择了”，在两种处境的诗性对比中表达明确偏好，现代汉语用“我宁愿”自然传达其意愿和比较意味。
- source_word: הִסְתּוֹפֵף
  choice: 站在……门槛边
  rationale: 此词罕见，语境指处于门口或门槛附近的卑微位置；不译作“看门”，以免加入原文未明确表达的正式职分。
- source_word: בְּבֵית אֱלֹהַי
  choice: 在我上帝殿宇的
  rationale: בַּיִת直译为“房屋、家”，此处指上帝的圣所。“殿宇”在现代汉语中自然呈现敬拜场所，又不必将其过度限定为某一建筑阶段的“圣殿”。
- source_word: מִדּוּר
  choice: 也不愿住
  rationale: 不定式“居住”承接前面的偏好比较；以“也不愿”清楚表达与“宁愿”相对的结构。
- source_word: בְּאָהֳלֵי רֶשַׁע
  choice: 在邪恶的帐棚里
  rationale: רֶשַׁע是抽象名词“邪恶、恶行”，译为“邪恶的帐棚”保留道德性质，而不改成指人的“恶人的帐棚”。
theological_decisions:
- issue: 圣所意象
  choice: 你的院宇／我上帝的殿宇
  alternative: 你的院子／我上帝的圣殿
  rationale: 保留原文“院”和“房屋”的具体空间意象，同时使用适合诗篇的庄重汉语；不以“圣殿”过度具体化בַּיִת。
- issue: 门槛位置与职分
  choice: 站在门槛边
  alternative: 在我上帝的殿中看门
  rationale: 原文强调宁居圣所边缘也不住邪恶之处的对比，但并未明确指定“看门人”职分，因此正文保留地点和卑微位置，脚注列出传统译法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。以“院宇”“殿宇”“门槛边”保存圣所的空间层次；句式用“宁愿……也不愿……”清楚呈现诗中的价值对比。脚注标记按正文出现顺序保留为[b]、[a]，与所给英文审校层的标记对应。
