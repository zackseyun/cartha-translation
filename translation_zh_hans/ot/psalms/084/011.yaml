  text: כִּ֤י שֶׁ֨מֶשׁ וּ/מָגֵן֮ יְהוָ֪ה אֱלֹ֫הִ֥ים חֵ֣ן וְ֭/כָבוֹד יִתֵּ֣ן יְהוָ֑ה לֹ֥א יִמְנַע ט֝֗וֹב לַֽ/הֹלְכִ֥ים בְּ/תָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/011.yaml
  text: For Yahweh God is a sun and shield[a]; Yahweh gives favor and honor[b]. He does not withhold good from those who walk blamelessly.
translation:
  language: zh_hans
  text: 因为雅威上帝是太阳和盾牌；雅威赐下恩惠和尊荣[a]，不向那些行事纯全的人[b]扣留好处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恩典和荣耀。”
    reason: lexical_alternative
  - marker: b
    text: “纯全”在这里指为人正直、表里一致，并非毫无罪过的完美。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出本节对上文信靠之福的根据；“因为”自然表达希伯来语的因果衔接。
- source_word: שֶׁמֶשׁ וּמָגֵן
  choice: 太阳，是盾牌
  rationale: 保留两个并列的诗歌意象，不将“太阳”解释性改写为“光”或“光源”，也保留“盾牌”所表达的保护形象。
- source_word: יְהוָה אֱלֹהִים
  choice: 雅威上帝
  rationale: 以“雅威”音译四字神名，以“上帝”表达 אֱלֹהִים；二者在原文中并置。
- source_word: חֵן וְכָבוֹד
  choice: 恩惠和尊荣
  rationale: חֵן 在此指蒙赐的恩惠，כָבוֹד 在上帝赐给人的语境中可指尊荣；脚注保留“恩典和荣耀”这一同样可行的译法。
- source_word: יִתֵּן
  choice: 赐下
  rationale: 未完成式在诗歌中表达一贯、恒常的作为；汉语无需明标将来时。“赐下”也符合由上帝施予的语境。
- source_word: לֹא יִמְנַע טוֹב
  choice: 不扣留好处
  rationale: 直接表达“不阻止、不扣住任何美善之物”的含义，同时保持原文概括性的“好”。
- source_word: לַהֹלְכִים בְּתָמִים
  choice: 不给那些行事纯全的人
  rationale: הלך 在伦理语境中指生活行事；תָמִים 强调整全、正直和诚实无伪，并非宣称绝对无罪。此处与前面的“不扣留”共同构成汉语自然的双宾语表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名；“雅威”较贴近学界通常重构的读音，并避免以头衔替代专名。
- issue: בְּתָמִים 是否表示无罪的完美
  choice: 行事纯全
  alternative: 行为正直；行事无可指责
  rationale: 该词在这里描述完整、正直的生活取向，不必理解为绝对无罪；正文保留其较强的伦理分量，脚注说明其范围。
- issue: 太阳与盾牌是否应解释性改写
  choice: 保留“太阳”和“盾牌”
  alternative: 光明和保护者
  rationale: 原文以两个隐喻描述雅威；保留隐喻可维护诗歌张力，不把其具体神学意涵限缩为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“太阳”“盾牌”和伦理性的“行事”这些诗篇意象；用分号呈现两组陈述的诗歌平行关系，并将所有脚注标记放在其实际说明的词组之后。
