source:
  edition: WLC
  text: אַשְׁרֵ֣י אָ֭דָם עֽוֹז ל֥/וֹ בָ֑/ךְ מְ֝סִלּ֗וֹת בִּ/לְבָבָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/005.yaml
  text: Blessed is the man whose strength is in you[b][a], in whose heart are the highways.
translation:
  language: zh_hans
  text: 以你为力量、心中[a]有大道[b]的人有福了！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们心中有大道。”希伯来文这里是“他们的心”，使用复数后缀，而本节开头的“人”是单数。
    reason: lexical_alternative
  - marker: b
    text: 这里的“大道”很可能指通往上帝居所的朝圣道路，但本节并未明确说“通往锡安”。
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是希伯来语福语的惯用表达；“有福了”既保留庄重、智慧文学式的语气，也比单纯的“快乐”更能涵盖蒙福的状态。
- source_word: אָדָם
  choice: 人
  rationale: 此处是阳性单数的泛称，代表任何符合描述的人。现代汉语的“人”自然保留其泛指功能，并不抹去原文语法信息。
- source_word: עֹז לוֹ בָךְ
  choice: 以你为力量
  rationale: 原文直译近于“他的力量在你里面”。“以你为力量”在现代汉语中自然清楚，同时保留力量所依托、所在于上帝的关系，避免解释成仅仅“从你得力量”。
- source_word: מְסִלּוֹת
  choice: 大道
  rationale: 该词指修筑或垫高的道路、大路。这里不把上下文可能暗示的目的地“锡安”补入正文，以免消除原文的含蓄。
- source_word: בִּלְבָבָם
  choice: 心中有
  rationale: 希伯来语字面为“在他们的心中”，其复数后缀与前面的单数泛称“人”发生数的转换。正文按自然汉语承接为单数泛指，脚注保留原文的复数形式。
theological_decisions:
- issue: אָדָם的阳性单数泛称
  choice: 人
  alternative: 男人；世人
  rationale: 原文所指并非专指成年男性，而是以单数阳性名词作代表性泛称。汉语“人”最准确自然，不额外限定性别或扩大为全人类。
- issue: מְסִלּוֹת所暗示的朝圣道路
  choice: 大道
  alternative: 通往锡安的大道；朝圣之路
  rationale: 全诗语境很可能指前往上帝居所的朝圣道路，但本节没有明说“锡安”或“朝圣”。正文保留字面意象，相关语境信息置于脚注。
- issue: 单数“人”与复数“他们的心”之间的转换
  choice: 正文采用自然的单数泛指，脚注说明复数后缀
  alternative: 直译为“他们心中有大道”
  rationale: 数的转换可能源于集合性或代表性表达，不宜据此建立额外神学含义；脚注保存形式差异，同时避免正文在现代汉语中指代突兀。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“以你为力量”比生硬的“力量在你里面”更符合汉语表达；保留“大道”的道路意象及目的地未明的含蓄。感叹号体现福语的宣告语气。
