source:
  edition: WLC
  text: עֹבְרֵ֤י בְּ/עֵ֣מֶק הַ֭/בָּכָא מַעְיָ֣ן יְשִׁית֑וּ/הוּ גַּם בְּ֝רָכ֗וֹת יַעְטֶ֥ה מוֹרֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/006.yaml
  text: As they pass through the Valley of Baca[a], they make it a spring[b]; even the early rain covers it with blessings.
translation:
  language: zh_hans
  text: 他们经过巴迦谷[a]，使它成为泉源；连秋雨[b]也以福分覆盖它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴迦”可能使人联想到希伯来语中表示“哭泣”的词，因此也可理解为“哭泣谷”。
    reason: alternative_reading
  - marker: b
    text: “秋雨”指雨季初降的雨。这个希伯来词也可译作“教师”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבְרֵי בְּעֵמֶק
  choice: 他们经过……谷
  rationale: 分词复数在上下文中指朝圣者；译作“他们经过”既符合现代汉语，也保留行经山谷的动态含义。
- source_word: הַבָּכָא
  choice: 巴迦
  rationale: 该词很可能用作地名，同时可能使人联想到“哭泣”；正文音译可避免把含义过早限定，相关联想收入脚注。
- source_word: מַעְיָן יְשִׁיתוּהוּ
  choice: 使它成为泉源
  rationale: מַעְיָן 指泉源，שׁית 在此有使之成为、设置之意；代词所指为山谷。
- source_word: גַּם
  choice: 连……也
  rationale: 表达递进和增添的诗意语气，与后半句的高潮相称。
- source_word: בְּרָכוֹת
  choice: 福分
  rationale: 马所拉文本自然读作“福分”；保留其祝福含义，同时与滋润山谷的雨水意象相互映照。
- source_word: יַעְטֶה
  choice: 披满
  rationale: 原词表达遮盖、披覆；“披满”保留拟人化的诗歌意象，又符合汉语表达。
- source_word: מוֹרֶה
  choice: 秋雨
  rationale: 此词在农业语境中可指雨季初降的雨，即秋雨；与泉源及滋润的上下文吻合。它也可表示“教师”，故在脚注注明歧义。
theological_decisions:
- issue: הַבָּכָא 是地名还是应释为“哭泣”
  choice: 正文作地名“巴迦”
  alternative: 哭泣谷
  rationale: 该形式在句中自然可作地名，但又可能唤起“哭泣”的联想；音译并加注可保留诗句的真实歧义。
- issue: מוֹרֶה 的含义
  choice: 秋雨
  alternative: 教师
  rationale: 水与雨的上下文支持季节性降雨之义；但希伯来词也确实可指“教师”，因此不完全抹去另一种可能。
translation_notes:
  register: 采用现代、庄重而自然的诗体汉语。“泉源”“披满福分”保留原文水与祝福交织的意象；正文中的[a]、[b]与脚注标记一一对应。
