  text: יֵ֭לְכוּ מֵ/חַ֣יִל אֶל חָ֑יִל יֵרָאֶ֖ה אֶל אֱלֹהִ֣ים בְּ/צִיּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/007.yaml
  text: They go from strength to strength[b][a]; each one appears before God in Zion.
translation:
  language: zh_hans
  text: 他们越走越有力量[a]；人人都在锡安朝见上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从力量到力量”。“力量”一词也可指勇力、军力或队伍，因此也可理解为“从一队到一队”或“从一次胜利到另一次胜利”。
    reason: lexical_alternative
  - marker: b
    text: “朝见”原文也可直译为“在上帝面前显现”；在此语境中，很可能指来到上帝面前敬拜。也有人理解为“被上帝看见”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: 他们越走
  rationale: 该词是הלך的Qal未完成式第三人称阳性复数，表示行进中的持续动作。结合朝圣语境，“越走”自然地带出旅程推进之意，又不限定具体步行方式。
- source_word: מֵחַיִל אֶל חָיִל
  choice: 越走越有力量
  rationale: חַיִל可指力量、勇力、军队或队伍。此处采用汉语递进表达，传达“从力量到力量”的惯用含义，同时以脚注保留其他真实可能。
- source_word: יֵרָאֶה
  choice: 朝见
  rationale: ראה的Niphal未完成式第三人称阳性单数，在朝圣和敬拜语境中可指到神面前显现、觐见。“朝见”简洁自然，也体现敬拜者来到上帝面前的语用含义。
- source_word: אֶל אֱלֹהִים
  choice: 上帝
  rationale: 介词אֶל字面为“向、到”，与יֵרָאֶה构成敬拜语境中的表达；汉语“朝见上帝”已自然包含“到上帝面前”的方向关系。
- source_word: בְצִיּוֹן
  choice: 在锡安
  rationale: 按现代普通话惯用译名音译地名；בְ译作“在”，指出朝见发生的地点。
- source_word: יֵרָאֶה（复数语境中的单数）
  choice: 人人都
  rationale: 虽然前半句主语为复数，יֵרָאֶה却是单数；“人人都”保留其逐一、分配性的语感，避免简单改成复数而抹平形式变化。
theological_decisions:
- issue: יֵרָאֶה אֶל אֱלֹהִים的礼仪性含义
  choice: 理解为朝圣者在锡安到上帝面前敬拜，即“朝见上帝”
  alternative: 也可较被动地理解为“在锡安被上帝看见”
  rationale: ראה的Niphal在朝圣与礼仪语境中常有“到神面前显现、觐见”的用法；正文采用较可能的礼仪性理解，脚注保留希伯来语形式及被动解读的可能，避免把歧义完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“越走越有力量”兼顾诗歌的递进节奏与朝圣语境；“朝见”保留礼仪色彩但不显古奥。所有脚注标记均已置于正文相应位置。
