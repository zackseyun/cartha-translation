  text: 'For the choir director: according to the Gittith[c][b][a]. A psalm of the sons of Korah.'
translation:
  language: zh_hans
  text: 交给圣乐指挥，按“迦提特”[a]。可拉子孙的诗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦提特”是希伯来语的音译，可能指一种曲调、演奏方式或乐器，确切含义不明。
    reason: lexical_alternative
  - marker: b
    text: “可拉子孙的”也可译作“给可拉子孙的”；希伯来语介词在诗篇题注中可以表示作者、所属或关联，也可以表示受献对象。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: 交给圣乐指挥
  rationale: 此词在诗篇题注中通常指负责统筹音乐演奏的人。“圣乐指挥”既符合敬拜音乐的语境，也比泛称“领袖”更明确；介词 לַ 译作“交给”，自然表达题注所指的交付对象。
- source_word: עַל הַגִּתִּית
  choice: 按“迦提特”
  rationale: עַל 在音乐题注中可引出曲调、演奏方式或乐器；“按”保留这种关系上的开放性。“迦提特”采用音译，以免武断地把含义限定为某种曲调、乐器或“酒榨歌”。
- source_word: לִבְנֵי קֹרַח
  choice: 可拉子孙的
  rationale: 介词 לְ 在诗篇题注中可能表示作者、所属群体、关联或受献对象。简洁的“的”保留了这种关系上的含混，不明确断定其为作者。
- source_word: מִזְמוֹר
  choice: 诗
  rationale: מִזְמוֹר 指用于歌唱或乐器伴奏的诗歌；在诗篇题注中译作“诗”简明、自然，也符合现代中文圣经文体。
