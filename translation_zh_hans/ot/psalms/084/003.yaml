  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּם צִפּ֨וֹר מָ֪צְאָה בַ֡יִת וּ/דְר֤וֹר קֵ֥ן לָ/הּ֮ אֲשֶׁר שָׁ֪תָה אֶפְרֹ֫חֶ֥י/הָ אֶֽת מִ֭זְבְּחוֹתֶי/ךָ יְהוָ֣ה צְבָא֑וֹת מַ֝לְכִּ֗/י וֵ/אלֹהָֽ/י־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/003.yaml
  text: Even the sparrow has found a home[a], and the swallow a nest for herself, where she may lay her young—at your altars, O Yahweh of Armies[c][b], my King and my God.
translation:
  language: zh_hans
  text: 连麻雀也找到了栖身之所；燕子也为自己找到了巢，可以在那里安放幼雏[a]——就在你的祭坛那里[b]，万军之耶和华[c]，我的王、我的上帝！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“她已在那里安放了幼雏”。原文动词可理解为已完成的动作，而不只是说明鸟巢的用途。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“在你的祭坛旁边”或“在你的祭坛附近”。原文结构紧凑，可能表示邻近，而不一定是直接在祭坛上。
    reason: lexical_alternative
  - marker: c
    text: “耶和华”是希伯来文神名 יהוה 的传统中文音译；也有译本译作“雅威”。“万军之耶和华”传统也译作“万军之主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 连……也
  rationale: 表达强调和递进：连微小的鸟儿也能在上帝的居所附近安家，符合诗句的修辞力量。
- source_word: צִפּוֹר
  choice: 麻雀
  rationale: 该词可泛指小鸟，但在此与燕子并列，译作传统且合乎词义范围的“麻雀”自然清楚。
- source_word: מָצְאָה בַיִת
  choice: 为自己找到了家
  rationale: “家”比字面的“房屋”更贴切地表达鸟儿得到栖身之所；完成体译为“找到了”，保留已经取得居所的结果意味。
- source_word: דְרוֹר
  choice: 燕子
  rationale: 这是该鸟名最常见且易懂的对应词；“雨燕”也有可能，但确定性较低。
- source_word: קֵן לָהּ
  choice: 自己的窝
  rationale: לָהּ表达归属或受益，“自己的窝”自然保留阴性单数鸟儿为自己得着巢穴的意思。
- source_word: אֲשֶׁר שָׁתָה אֶפְרֹחֶיהָ
  choice: 可以安放幼雏
  rationale: שָׁתָה的核心义是放置、安放；此译让关系从句自然说明窝的用途，同时不把动作过度具体化为“产卵”。希伯来语完成体也可理解为已完成动作，但正文保留诗意概括。
- source_word: אֶת מִזְבְּחוֹתֶיךָ
  choice: 就在你的祭坛那里
  rationale: 原文结构紧凑，若直译成把幼雏放在祭坛上容易造成误解；“祭坛那里”保留鲜明意象，并容纳在祭坛旁或附近的空间关系。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”在现代中文圣经语境中是神名的通行音译；“万军”是צְבָאוֹת在该固定称号中的庄重、易识别译法，也保留天上与地上众军之主的宏大含义。
- source_word: מַלְכִּי וֵאלֹהָי
  choice: 我的王，我的上帝
  rationale: 保留两个并列的第一人称信仰称谓和直接呼告的语气；中文用逗号比补入“和”更庄重自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文采用现代简体中文圣经读者最熟悉的“耶和华”，而不以“主”替代神名；“雅威”更接近现代学界常用的拟音，故在注释中说明。
- issue: 称号 צְבָאוֹת 的译法
  choice: 万军
  alternative: 众军
  rationale: “万军之耶和华”在中文中庄重、透明且广为人知；“万”在此表示众多，不限定为数字一万。“众军”较直白，但作为固定神圣称号不如正文自然。
- issue: 鸟窝与祭坛的空间关系
  choice: 祭坛那里
  alternative: 祭坛旁边／附近
  rationale: 原文紧凑，语法关系可能形成“在你的祭坛那里”的概括性定位，不宜断言鸟巢实际在祭坛表面；正文保留一定含混，脚注列出邻近义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体。“连……也”突出微小鸟儿尚且得着居所的惊叹；破折号把鸟巢意象引向圣所，末句改用直接呼告并以感叹号收束。避免将祭坛位置解释得过实，也不把“安放幼雏”限定为产卵或已完成的单一时态理解。
