  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְ֭בָאוֹת שִׁמְעָ֣/ה תְפִלָּתִ֑/י הַאֲזִ֨ינָ/ה אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/008.yaml
  text: O Yahweh God of hosts[a], hear my prayer; give ear, O God of Jacob[b]. Selah
translation:
  language: zh_hans
  text: 雅威[a]——万军的上帝啊，求你垂听我的祷告；雅各的上帝啊，求你侧耳倾听！细拉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝之名 יהוה 的音译；传统汉译常作“耶和华”，有些译本以“主”代称。
    reason: alternative_reading
  - marker: b
    text: “细拉”是一个含义不确定的希伯来礼仪或音乐术语，可能表示“停顿”或“间奏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的汉语音译呈现上帝的专名，而不以称号替代。
- source_word: אֱלֹהִים צְבָאוֹת
  choice: 万军之上帝
  rationale: 保留“军旅、众军”这一宽广意象，并采用自然、庄重的汉语神圣称谓。
- source_word: שִׁמְעָה תְפִלָּתִי
  choice: 求你垂听我的祷告
  rationale: “垂听”符合现代汉语祷告语体，也准确表达祈使语气和“我的祷告”。
- source_word: הַאֲזִינָה
  choice: 求你侧耳倾听
  rationale: 保留与前句“垂听”的诗歌平行，同时呈现该动词侧耳留心听的形象。
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: 雅各的上帝
  rationale: 直接保留原文的所属结构及其盟约历史关联，不额外解释为“以色列的上帝”。
- source_word: סֶלָה
  choice: 细拉
  rationale: 该礼仪或音乐术语的确切意义不明，因此采用汉语音译，不武断译作“停顿”或“间奏”。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名；音译“雅威”保留其作为专名的性质，避免以“主”这一称号取代。
- issue: 如何处理 סֶלָה
  choice: 细拉
  alternative: 停顿；间奏
  rationale: 其确切含义与礼仪功能尚无定论，音译可保留原文特征和解释空间。
- issue: צְבָאוֹת 所指的范围
  choice: 万军
  alternative: 众军；天军
  rationale: “万军”既保留传统诗歌表达，也不将所指范围限定为地上的军队或天上的军队。
translation_notes:
  register: 采用现代、庄重且适合诗歌祷告的汉语。“垂听／侧耳倾听”保留原文两个听觉动词的平行与递进；破折号帮助读者辨明“雅威”与“万军之上帝”是连续呼语。
