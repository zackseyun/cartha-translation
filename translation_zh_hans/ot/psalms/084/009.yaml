source:
  edition: WLC
  text: מָ֭גִנֵּ/נוּ רְאֵ֣ה אֱלֹהִ֑ים וְ֝/הַבֵּ֗ט פְּנֵ֣י מְשִׁיחֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/009.yaml
  text: Look on our shield[a], O God[b], and look on the face of your anointed.
translation:
  language: zh_hans
  text: 神啊，求你垂顾我们的盾牌[a]，注视你受膏者[b]的脸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的保护者”。希伯来文直译为“我们的盾牌”；这是一个诗歌比喻，可能指作为保护者的神，也可能指君王。
    reason: lexical_alternative
  - marker: b
    text: “受膏者”一词与“弥赛亚”同源；这里首先很可能指大卫王系的君王，同时也可能具有更广的弥赛亚意蕴。
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנֵּנוּ
  choice: 我们的盾牌
  rationale: מָגֵן本义为“盾牌”，在诗歌中可比喻保护者，也可能指作为百姓护卫的君王。保留具体意象，不替原文消除所指的含混。
- source_word: רְאֵה
  choice: 垂顾
  rationale: 此处祈使式不是单指看见，而是祈求神留意并施恩；“垂顾”既表达恳求语气，也适合庄重而自然的祷告文体。
- source_word: אֱלֹהִים
  choice: 神啊
  rationale: 原文在此为直接呼语；“啊”自然标明呼告语气。
- source_word: וְהַבֵּט
  choice: 注视
  rationale: נבט表示把目光投向某人或某物；“注视”保留其定向、专注之意，并与前句“垂顾”形成有变化的平行。
- source_word: פְּנֵי
  choice: ……的脸
  rationale: פָּנִים直指“脸、面容”，此处保留希伯来诗歌的具体关系性意象，而不抽象化为“临在”。
- source_word: מְשִׁיחֶךָ
  choice: 你受膏者
  rationale: מָשִׁיחַ意为“受膏者”。本诗直接语境最可能指大卫王系的君王，不宜在正文中径译为已经专名化的“弥赛亚”。
theological_decisions:
- issue: “我们的盾牌”的所指
  choice: 保留“我们的盾牌”这一比喻，不指定它是神还是君王。
  alternative: 解释为“我们的保护者”，或明确解释为神／大卫王系君王。
  rationale: 希伯来文容许不同理解，并可能有意使“我们的盾牌”与“你受膏者”彼此呼应。保留意象可维持原文的诗意和神学张力。
- issue: “你受膏者”的所指
  choice: 译作“你受膏者”，不直接译作“弥赛亚”。
  alternative: 译作“你的弥赛亚”。
  rationale: 在诗篇的直接历史语境中，这个称谓首先很可能指受膏的大卫王系君王；原词与“弥赛亚”同源并可能具有更广的弥赛亚意蕴，故在脚注中说明，而不在正文中预先限定。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“垂顾”表达求神施恩关注的语用含义；“盾牌”和“脸”保留原文的具体诗歌意象。脚注标记均置于其所解释的词语之后。
