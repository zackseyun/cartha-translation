  yaml_path: translation/ot/psalms/107/023.yaml
  text: Those who go down to the sea in ships[a], doing business on great waters—
translation:
  language: zh_hans
  text: '那些乘船出海的人，

    在浩瀚水域上劳作[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“工作”或“经商”。希伯来语此处可泛指在海上从事的劳作，也可含商业或贸易的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרְדֵי
  choice: 下海的人
  rationale: 该词是ירד的Qal主动分词复数，在此作名词用，指一类人。“下海的人”既保留“下去”的动态，也符合现代汉语对出海航行的自然表达。
- source_word: הַיָּם
  choice: 海
  rationale: 带定冠词的普通名词，语境泛指海洋，并非特定专名。
- source_word: בָּאֳנִיּוֹת
  choice: 乘船
  rationale: 介词ב加“船”的复数，在汉语中以“乘船”最自然；与“下海”连读，也清楚表达航海方式。
- source_word: עֹשֵׂי מְלָאכָה
  choice: 劳作
  rationale: עשה的分词与מְלָאכָה构成“从事工作”的意思。“劳作”保留宽泛的职业活动含义，不将语境中过海经商的可能性写死。
- source_word: בְּמַיִם רַבִּים
  choice: 在大水之上
  rationale: 较贴近希伯来诗歌“在广大水域中／之上”的形象；“大水”在庄重汉语中可指辽阔、汹涌的水域，并与上一分句的“海”形成诗意呼应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。保留希伯来文“下海”和“大水”的空间意象；正文用较宽泛的“劳作”，脚注交代商业或贸易含义，以免过早消除原文的词义张力。
