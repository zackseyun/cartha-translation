  text: He made the storm be still[c][b][a], and their waves were hushed.
translation:
  language: zh_hans
  text: 他使风暴归于平静[a]，他们所遇的波浪也平息了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使风暴化为宁静。”希伯来语直译表达的是使风暴进入静止、寂静的状态。
    reason: lexical_alternative
  - marker: b
    text: 原文为复数所有格，可指前文的航海者，故译作“他们所遇的波浪”；若把这个词尾理解为指海或水，也可译作“海浪也平息了”或“它的波浪也平息了”。
    reason: referential_ambiguity
lexical_decisions:
- source_word: יָקֵם
  choice: 使……归于
  rationale: 这是קום的使役形，和表示结果的לִדְמָמָה连用，意为使风暴进入某种状态；“使……归于”既保留使役和结果含义，也符合现代汉语表达。
- source_word: סְעָרָה
  choice: 风暴
  rationale: 该词指猛烈的风暴或暴风雨；本节处于海上遇险的语境中，“风暴”清楚、自然。
- source_word: לִדְמָמָה
  choice: 平静
  rationale: דְּמָמָה可指寂静、静止或平静，前置词ל在此表示结果。“归于平静”保留了从风暴转为安静状态的动态。
- source_word: וַיֶּחֱשׁוּ
  choice: 沉寂了
  rationale: 该动词表示安静、无声；用于波浪时，“沉寂了”自然地表达波涛止息，同时没有把句法强行改成被动。
- source_word: גַּלֵּיהֶם
  choice: 他们的波浪
  rationale: 词尾形式上是第三人称阳性复数“他们的”。正文保留这一形式及其指代张力，不擅自改为单数“它的”；脚注说明上下文中的另一种理解。
