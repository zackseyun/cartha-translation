  text: He led them by a straight way to go to a city to dwell in[a].
translation:
  language: zh_hans
  text: 他带领他们沿着平直的路走，前往一座可居住的城。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较贴近形式地说：“前往一座居住之城。”
    reason: 保留עִיר מוֹשָׁב这一名词组合较贴近形式的译法。
lexical_decisions:
- source_word: וַיַּדְרִיכֵם
  choice: 他领他们走
  rationale: דרך的使役形在这里表示引领、引导；译为“领他们走”既保留使役意味，也符合现代汉语表达。
- source_word: בְּדֶרֶךְ יְשָׁרָה
  choice: 平直的路
  rationale: דֶּרֶךְ指道路、路径；יְשָׁרָה在行路语境中首先描写平直、正直的道路。“平直”保留具体的道路意象，同时不把词义限定为道德层面的“正直”。
- source_word: לָלֶכֶת אֶל
  choice: 前往
  rationale: 不定式לָלֶכֶת与方向介词אֶל共同表达行进的目的和方向；“前往”在汉语中简洁自然。
- source_word: עִיר מוֹשָׁב
  choice: 可以定居的城
  rationale: 这是“城”与“居所、居住、定居”构成的组合，指适合人居住或安顿的城。“可以定居的城”既表达旷野漂流者得着安居之所，也避免生硬的“居住之城”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“平直的路”保留旅途中的具体图景；“可以定居的城”让普通读者清楚理解漂流者终于能安顿下来的含义。
