  text: וַ/יְשַׂגֵּ֣ב אֶבְי֣וֹן מֵ/ע֑וֹנִי וַ/יָּ֥שֶׂם כַּ֝/צֹּ֗אן מִשְׁפָּחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/041.yaml
  text: But he sets the needy on high[a], away from affliction, and makes their families like a flock.
translation:
  language: zh_hans
  text: 但他使穷乏人脱离困苦，把他们置于高处[a]；又使他们的家族如羊群一般。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把穷乏人从困苦中高举起来。”末句也可理解为：使他们的家族繁多如羊群。
    reason: “置于高处”对应שׂגב所含的高举、安置于安全之处的意象；“如羊群”保留כַּצֹּאן的比较范围，脚注说明其常被理解为家族繁衍、数目增多。
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: 安置在高处
  rationale: שׂגב兼有升到高处和置于安全之地的含义；“安置在高处”保留空间意象，也自然暗示保护。
- source_word: אֶבְיוֹן
  choice: 穷乏人
  rationale: אֶבְיוֹן指贫穷、缺乏而需要帮助的人；“穷乏人”庄重易懂，又不把含义限于单一处境。
- source_word: מֵעֹנִי
  choice: 脱离困苦
  rationale: 介词מִן表示从某种境况中出来；עֹנִי可指困苦、苦难或贫困。“脱离困苦”符合本诗由患难转为蒙拯救的语境。
- source_word: וַיָּשֶׂם
  choice: 又使
  rationale: שׂים本义为放置、设立；与比较短语及“家族”连用时，“使……多如”能自然表达其结果。
- source_word: כַּצֹּאן
  choice: 多如羊群
  rationale: צֹאן是羊群等小型牲畜的集合名词。原文直译为“如羊群”；结合家族繁衍的语境，正文用“多如羊群”明示比喻的数量意涵，并以脚注保留较形式对应的译法。
- source_word: מִשְׁפָּחוֹת
  choice: 他们的家族
  rationale: 原文为复数“家族”，没有明示所属代词；上下文自然指穷乏人的家族。“他们的”在现代汉语中澄清关系，“家族”也能体现复数群体。
theological_decisions:
- issue: “家族”所属关系是否明示
  choice: 他们的家族
  alternative: 家族
  rationale: 希伯来文没有所属后缀，但语境把这些家族与获救的穷乏人联系起来；补出“他们的”是汉语表达所需的关系澄清，不构成新的神学断言。
- issue: 羊群比喻是否明确为数量增长
  choice: 多如羊群
  alternative: 使家族如同羊群
  rationale: 诗篇上下文强调处境逆转与兴旺，羊群常呈现繁多的群体形象；但原文本身只明说“像羊群”，因此脚注保留不明确比喻具体着眼点的直译。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“穷乏人”“困苦”延续诗体语域但不显陈旧；以“但……又……”呈现希伯来文连续叙述及本节与上文的转折。
