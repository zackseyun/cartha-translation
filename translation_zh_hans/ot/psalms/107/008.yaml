  rationale: 将称谢的对象直接译为“雅威”，使句法更清楚，并保留原文中两项以“因”引出的称谢缘由。保留“慈爱”“奇妙作为”和“世人”，以维持庄重、现代且贴近原文的表达。修订脚注，使其准确说明希伯来惯用语的字面构成与泛指人类的功能。
