  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/008.yaml
  text: Let them give thanks to Yahweh for his steadfast love[a], and for his wondrous deeds to the children of man.
translation:
  language: zh_hans
  text: 愿他们称谢雅威，因他的慈爱，因他向世人所行的奇妙作为。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹדוּ
  choice: 愿他们……称谢他
  rationale: 该词在本诗反复出现的副歌中表示向神感恩、颂赞；“称谢”既保留诗歌的庄重语体，也自然表达因神作为而献上感谢。
- source_word: לַיהוָה
  choice: 向雅威／称谢他
  rationale: 介词 ל 标明称谢的对象；在汉语句式中将“雅威”前置，并以“他”承接，使表达自然。神名 יהוה 音译为“雅威”，保留原文所用的专名。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד 包含忠贞、持久的恩慈与关系性的信实；“慈爱”是现代中文圣经语境中自然而庄重的对应，不把其含义过度限定为某一神学术语。
- source_word: וְנִפְלְאוֹתָיו
  choice: 他……所行的奇妙作为
  rationale: נִפְלָאוֹת 指令人惊叹的非凡作为；补出“所行”可在中文中清楚表达其行动含义。
- source_word: לִבְנֵי אָדָם
  choice: 为世人
  rationale: 该短语字面为“给人的子孙／人之子”，是泛指全人类的希伯来惯用语。“世人”准确传达其集合性所指，脚注保留原文意象。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列神的四字神名；音译“雅威”可保留其专名性质，不以头衔代替，也不采用较晚形成的混合读音。
- issue: חֶסֶד 的语义范围
  choice: 慈爱
  alternative: 坚定的爱；信实之爱；怜悯
  rationale: 原词兼具恩慈、忠贞和持久之爱的意味。“慈爱”保持一定语义宽度，避免在正文中把它专门化为仅指“盟约之爱”。
- issue: בני אדם 的人类总称
  choice: 世人
  alternative: 人的子孙；人类
  rationale: 此处泛指人类，并非只指男性。“世人”传达实际所指；脚注说明原文的具体表达，以保留其希伯来意象。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“愿他们……称谢他”保留原文劝愿式语气；两个“因”呈现称谢的两项缘由，并将“为世人所行”明确连接到“奇妙作为”。
