  text: He turns a wilderness into a pool of water[c][b][a], and dry land into springs of water.
translation:
  language: zh_hans
  text: 他使[a]旷野[b]成为水潭，使干旱之地成为泉源[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“变……为”；这个希伯来语动词可指“放置”“使成为”或“变为”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“沙漠”。
    reason: lexical_alternative
  - marker: c
