    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: 使……成为
  rationale: שׂים的基本义包括“放置、设立、使成为”。在本节两组地貌与水源的对照中，“使……成为”自然表达状态的转变，同时不过度扩展原文。
- source_word: מִדְבָּר
  choice: 旷野
  rationale: מִדְבָּר指荒野、旷野或沙漠地带。“旷野”范围较广，既符合诗歌语境，也不把意象限于沙质沙漠。
- source_word: לַאֲגַם מַיִם
  choice: 成为水潭
  rationale: אֲגַם可指水潭、池沼或长芦苇的水域。“水潭”简洁清楚，并与旷野形成鲜明对照。
- source_word: וְאֶרֶץ צִיָּה
  choice: 干旱之地
  rationale: צִיָּה表示干燥、焦渴之地。“干旱之地”准确保留土地缺水的意象，语体庄重而易懂。
- source_word: לְמֹצָאֵי מָיִם
  choice: 成为泉源
  rationale: מוֹצָאֵי מָיִם字面指水流出的地方或水的源头，复数形式可表达多处水源。“泉源”在汉语诗歌中自然，并保留水从源头涌出的意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的诗歌语言。两个“使……成为”显明希伯来诗句的平行结构；“水潭”与“泉源”分别保留静水和涌出之水的不同意象。
