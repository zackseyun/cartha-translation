  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/015.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: zh_hans
  text: 愿他们因他的慈爱，并因他为世人[b]所行的奇事，向雅威[a]称谢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神圣名 יהוה 的音译；汉语传统也常译作“耶和华”。
    reason: 名称音译说明
  - marker: b
    text: 希伯来文直译为“人的子孙”，泛指世人或人类。
    reason: 保留原文习语及词义范围
lexical_decisions:
- source_word: יוֹדוּ
  choice: 愿他们……称谢他
  rationale: 该词是ידה的使役词干复数未完成式，在诗篇反复出现的劝勉句中带有祈愿、号召意味。“愿他们……称谢”既保留语气，也符合现代汉语诗歌体表达。
- source_word: לַיהוָה
  choice: 向雅威／称谢他
  rationale: 介词ל־标明称谢的对象；汉语采用“称谢他”使句子自然，并以“雅威”呈现经文中的神圣名יהוה。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חסד包含持久、信实、施恩的爱。“慈爱”是简洁庄重且易懂的汉语对应词；上下文中的所有格保留为“他的”。
- source_word: וְנִפְלְאוֹתָיו
  choice: 并因他……所行的奇事
  rationale: 该复数名词源于פלא，指非凡、令人惊叹的作为。译作“所行的奇事”明确其行动含义，并与“慈爱”并列作为称谢的原因。
- source_word: לִבְנֵי אָדָם
  choice: 为世人
  rationale: 该短语直译为“向人的众子”，在这里泛指人类，并表示这些奇事所施予或惠及的对象。“为世人”在现代汉语中自然，也不把语法阳性误解为仅指男性。
theological_decisions:
- issue: 神圣名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用接近学界通常重构读音的音译“雅威”，不以称号代替专名；脚注列出汉语传统中常见的音译。
- issue: בני אדם所指的范围
  choice: 世人
  alternative: 人的子孙；人类
  rationale: 这里的语法阳性短语具有总体、代表性意义，指所有人，而非仅指男性。“世人”保留具体的人群指向，同时避免把它抽象化为概念。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。“愿他们……称谢”保留劝勉语气；“因……并因……”呈现两个并列的称谢缘由。正文避免生硬照搬希伯来语序，同时用脚注交代神名音译和“人的子孙”这一原文习语。
