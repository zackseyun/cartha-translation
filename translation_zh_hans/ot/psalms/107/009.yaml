source:
  edition: WLC
  text: כִּי הִ֭שְׂבִּיעַ נֶ֣פֶשׁ שֹׁקֵקָ֑ה וְ/נֶ֥פֶשׁ רְ֝עֵבָה מִלֵּא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/009.yaml
  text: For he satisfies the thirsty soul[b][a], and he fills the hungry soul with good things.
translation:
  language: zh_hans
  text: 因为他使干渴的人[a]得满足，使饥饿的人饱享美物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”：原文词也可译作“生命”、“自己”或“灵魂”；这里指整个活人。
    reason: lexical_alternative
  - marker: b
    text: “饱享美物”也可译作“以美善充满饥饿的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明人应当称谢耶和华的理由，保留原文的解释、因果作用。
- source_word: הִשְׂבִּיעַ
  choice: 使……得到满足
  rationale: 使役式表达“使满足、使饱足”；这里与“干渴”搭配，用“得到满足”自然清楚。
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 此处指有需要的整个活人，而不只是与身体相对的非物质“灵魂”；译作“人”符合现代汉语，也避免加入二元人观。
- source_word: שֹׁקֵקָה
  choice: 干渴的
  rationale: 该词可表示渴求、切望；结合第5节的饥渴背景及下句“饥饿”的平行结构，“干渴”最贴合语境，同时仍带有深切需求之意。
- source_word: רְעֵבָה
  choice: 饥饿的
  rationale: 直接表达饥饿，并与“干渴的”构成诗歌平行。
- source_word: מִלֵּא
  choice: 饱享
  rationale: 原义为“充满、装满”；汉语以“饱享”表达使饥饿者因所得而充足，既自然又保留饱足的意象。
- source_word: טוֹב
  choice: 美物
  rationale: 此处名词化使用，指上帝所赐美好、有益之物；“美物”凝练庄重，适合诗体。
theological_decisions:
- issue: נֶפֶשׁ 的人论含义
  choice: 两处均按整体的人译为“人”
  alternative: 译作“心灵”“灵魂”或“生命”
  rationale: 在本节中，נֶפֶשׁ 是会干渴、饥饿并得饱足的生命主体，主要指整个人。这样翻译不把经文限定为只谈人的非物质部分；脚注保留较直译的可能。
- issue: שֹׁקֵקָה 所指的是身体干渴还是广义渴求
  choice: 正文译作“干渴的”
  alternative: 译作“渴慕的”或“切望的”
  rationale: 上下文明确提到饥饿与干渴，且本节与“饥饿”平行，因此采用具体的“干渴”；同时不排除诗句延伸表达人的深层需要。
- issue: טוֹב 的具体或抽象含义
  choice: 译作“美物”
  alternative: 译作“美善”或“美好的事物”
  rationale: 原文只说“好／美善”，没有限定具体所赐何物；“美物”保留其宽泛性，不把它缩窄为物质供应或纯属灵福分。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“干渴—饥饿”保持两行的平行关系；“得到满足—饱享美物”传达两个使人充足的动词。避免把“人”译成容易被理解为仅指非物质部分的“灵魂”，并用脚注说明原词范围。
