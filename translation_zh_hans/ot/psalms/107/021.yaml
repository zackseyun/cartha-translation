  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/021.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: zh_hans
  text: 愿他们因耶和华的慈爱，和他向世人所行的奇妙作为，感谢他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹדוּ
  choice: 愿他们……感谢他
  rationale: 此处是诗篇反复出现的劝愿式表达；ידה 的使役词形在蒙拯救后的回应语境中最自然地译为“感谢”。
- source_word: לַיהוָה
  choice: 感谢耶和华
  rationale: 介词 ל 标明感谢的对象；神名 יהוה 采用中文圣经传统中通行且庄重的“耶和华”。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חסד 表达持久、信实的恩慈；“慈爱”在现代中文中简洁自然，也保留其关系性与忠贞意味。
- source_word: וְנִפְלְאוֹתָיו
  choice: 他所行的奇事
  rationale: נפלאות 指令人惊叹的非凡作为；译作“所行的奇事”比抽象的“奇妙”更清楚地表达具体行动。
- source_word: לִבְנֵי אָדָם
  choice: 为世人
  rationale: 字面为“向人的众子”，是泛指全人类的希伯来表达。现代中文用“世人”自然、庄重，并明确其普遍所指。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文译作“耶和华”保留专名功能，并符合普通中文读者熟悉的圣经用语；“雅威”也是按学术重构发音的可行译法。
- issue: לבני אדם 的泛指范围
  choice: 世人
  alternative: 人的子孙
  rationale: 该短语在此泛指人类，不限于男性。“世人”避免现代读者误解为仅指男性，同时不把其范围缩窄。
- issue: 两个介词短语与“感谢”的关系
  choice: 分别以“因……感谢”呈现
  alternative: 愿他们感谢耶和华的慈爱和他为世人所行的奇事
  rationale: 原文可理解为因耶和华的慈爱和奇事而感谢他。重复“感谢他”使现代中文关系清楚，同时不改变两个感谢缘由的并列结构。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“愿他们”保留劝勉兼愿望的语气；句中重复“感谢他”，使中文结构清晰并保持经文的平行感。
