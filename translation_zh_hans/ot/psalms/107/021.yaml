revisions:
- from: 愿他们因耶和华的慈爱感谢他，因他为世人所行的奇事[a]感谢他。
  to: 愿他们因耶和华的慈爱，和他向世人所行的奇妙作为，感谢他。
  rationale: 修订将原文单一的劝愿式谓语“感谢”统摄两个并列的感谢缘由，删去中文中不必要的谓语重复；以“奇妙作为”突出神所行之事的行动性。脚注保留“人的众子”的字面背景及替代译法。
