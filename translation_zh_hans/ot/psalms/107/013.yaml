base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/013.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: zh_hans
  text: 于是他们在患难中向雅威呼求；他救他们脱离困境[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困境”原文为复数，也可译作“种种困苦”或“窘迫”。
    reason: 说明原文复数形式及词义范围；正文采用自然的汉语集合表达。
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: 于是……呼求
  rationale: וַ־推动叙事，并呼应本诗反复出现的模式；זעק表示在急难中大声求助。“呼求”自然、庄重，也保留求援的迫切感。
- source_word: אֶל
  choice: 向
  rationale: 与“呼求”搭配，准确表达呼求所指向的对象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，不以称号代替。
- source_word: בַּצַּר לָהֶם
  choice: 在患难中
  rationale: צַר在此指困苦、危难的处境；“在患难中”符合现代汉语表达，也保留希伯来文单数集合性的概括。
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: 脱离困境
  rationale: מְצוּקוֹת为复数，指压迫、窘迫或走投无路的处境。汉语“困境”可作集合表达，避免生硬的“诸般困苦”；复数及其他可能译法由脚注说明。
- source_word: יוֹשִׁיעֵם
  choice: 他救他们
  rationale: ישׁע的使役式表示拯救、解救；此处用“救”直接自然，并保留简洁有力的诗体。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质，而不改译为“主”等称号。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语言。“于是”体现叙事推进及本诗副歌式结构；分号保留前后呼求与拯救的紧密对应。
