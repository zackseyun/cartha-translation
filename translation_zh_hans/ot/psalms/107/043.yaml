  text: מִי חָכָ֥ם וְ/יִשְׁמָר אֵ֑לֶּה וְ֝/יִתְבּֽוֹנְנ֗וּ חַֽסְדֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/043.yaml
  text: Who is wise? Let him keep these things[c][b][a], and let them consider the steadfast love of Yahweh.
translation:
  language: zh_hans
  text: 谁有智慧？就当留心这些事；愿他们[a]思量雅威的慈爱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先用单数“他”，随后转为复数“他们”；这里保留了这一人称变化。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”在原文中为复数，可指雅威多次彰显的慈爱与怜悯。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי חָכָם
  choice: 谁有智慧？
  rationale: 保留智慧文学式的直接反问；现代汉语用“谁有智慧”比“谁是智慧的”自然。
- source_word: וְיִשְׁמָר
  choice: 愿他留心
  rationale: 该未完成式在反问之后可带劝勉语气。“留心”既表达谨慎关注，也适合其宾语为诗中所叙述的事，不把含义局限为遵守命令。
- source_word: אֵלֶּה
  choice: 这些事
  rationale: 指回全诗所讲述的事件；补出“事”符合现代汉语表达。
- source_word: וְיִתְבּוֹנְנוּ
  choice: 愿他们领悟
  rationale: 该词表达经过思考而获得洞见；“领悟”兼顾思想和明白的含义。用复数“他们”保留希伯来文由单数转为复数的变化。
- source_word: חַסְדֵי
  choice: 种种的慈爱
  rationale: 原文为复数构造形式，既可指雅威恒久慈爱的多次彰显，也可整体理解为他的慈爱；“种种”把复数意味呈现在正文中。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其作为以色列上帝专名的功能音译，不以“主”等称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: “雅威”直接呈现神的专名，并对应原文四字神名；不以称号取代专名。
- issue: 单数劝勉与复数劝勉之间的人称变化
  choice: 愿他……愿他们……
  alternative: 愿有智慧的人留心这些事，并领悟……
  rationale: 原文先用阳性单数动词，随后转为复数。正文保留这一不寻常的转换，不将其统一为单数或泛指结构。
- issue: חסד 复数的表达
  choice: 种种的慈爱
  alternative: 慈爱；信实之爱；一次次施慈爱
  rationale: 既保留复数所暗示的多次彰显，也不把 חסד 过度限定为某一种系统神学术语。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“愿他……愿他们……”略显突兀，但这是为保留原文真实的人称变化；脚注予以说明。分号使两个相连的劝勉层次清楚。
