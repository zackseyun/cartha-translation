  text: וַ/יּ֣וֹשֶׁב שָׁ֣ם רְעֵבִ֑ים וַ֝/יְכוֹנְנ֗וּ עִ֣יר מוֹשָֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/036.yaml
  text: There he settled the hungry[a], and they established a city to live in.
translation:
  language: zh_hans
  text: 他使饥饿的人住在那里；他们建起了一座供人居住的城。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一座作为住处的城。”
    reason: 原文מוֹשָׁב可表达居住的用途，也可作名词性修饰语，指住处或定居之地。
lexical_decisions:
- source_word: וַיּוֹשֶׁב
  choice: 他使……住
  rationale: 该词是ישׁב的使役词形，表示“使人居住、安置”。译为“他使……住”既保留使役意义，也符合现代汉语表达。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达地点，与上文所述之地衔接自然。
- source_word: רְעֵבִים
  choice: 饥饿的人
  rationale: 原文形容词在此作名词使用，泛指处于饥饿中的人；这样译清楚自然，并保留其群体含义。
- source_word: וַיְכוֹנְנוּ
  choice: 他们建起了
  rationale: כון在此词形中有建立、设立、使稳固之意。与“城”搭配时，“建起”自然，也不必过度限定为正式“建城”或“奠基”。
- source_word: עִיר
  choice: 一座……城
  rationale: עִיר通常指城或城邑；“城”简洁、庄重，并符合圣经语境。
- source_word: מוֹשָׁב
  choice: 供人居住的
  rationale: 该词表示居所、居住或定居之处。将עִיר מוֹשָׁב译为“供人居住的城”，以自然汉语传达其用途或性质，同时在脚注保留更贴近名词结构的译法。
theological_decisions:
- issue: 单数动词וַיּוֹשֶׁב的隐含主语
  choice: 用“他”承接上下文中作为施事者的上帝，不在本节另行明说“耶和华”或“上帝”
  alternative: 采用不指明主语的表达，如“有人使……住在那里”
  rationale: 本诗上下文持续叙述耶和华的作为，因此该单数动词自然承接这一主语；用“他”既忠实于原文的代词式衔接，也避免在本节加入原文未明说的神名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使饥饿的人住在那里”保留原文使役关系；分号体现两个连续而紧密相关的行动。脚注标记置于其实际对应的“供人居住的城”之后。
