id: PSA.107.1
reference: Psalms 107:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 你们要称谢耶和华[a]，因为他本为善；他的慈爱永远长存[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”译自希伯来文上帝的专名יהוה；也常按拟音译作“雅威”。
    reason: divine_name
  - marker: b
    text: “慈爱”所译的希伯来词חֶסֶד也包含忠贞、信实和盟约之爱的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹדוּ
  choice: 你们要称谢
  rationale: 该词是ידה的使役词干复数命令式；在诗篇的礼仪语境中，表示向上帝献上感谢和颂赞。“称谢”简洁庄重，也保留了会众共同回应的语气。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 介词ל标明称谢的对象；יהוה是上帝的专名。采用现代中文圣经读者熟悉的“耶和华”，并以脚注说明其来源与可能读法。
- source_word: כִּי טוֹב
  choice: 因为他本为善
  rationale: כִּי引出称谢的理由，טוֹב概括上帝的良善及施恩。“本为善”是自然、庄重的中文表达，并未把“善”缩窄为单纯的仁慈。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: 原文直译近于“直到永远”；与“慈爱”搭配时，“永远长存”自然表达其持续不息，而不改变原意。
- source_word: חַסְדּוֹ
  choice: 他的慈爱
  rationale: חֶסֶד兼有慈爱、忠贞、信实与盟约忠诚的内涵。“慈爱”在现代中文中简明可懂，并以脚注提示原词较宽广的意义。
theological_decisions:
- issue: 上帝专名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文圣经传统中最通行、普通读者最熟悉的“耶和华”，脚注说明“雅威”是按现代学术界常见拟音的另一译法，不以普通称号替代专名。
- issue: חֶסֶד的神学与语义范围
  choice: 慈爱
  alternative: 忠贞的爱；盟约信实
  rationale: 该词既表达慈爱，也常包含坚定忠诚和盟约关系中的信实。“慈爱”适合正文，但脚注保留其丰富含义，避免只理解为情感上的爱或只理解为法律性的守约。
- issue: 两个כִּי分句之间的关系
  choice: 第一处译作“因为”，第二处以分号承接
  alternative: 两处都译作“因为”
  rationale: 两个כִּי都可表达称谢的根据。中文用分号并列“他本为善”与“他的慈爱永远长存”这两个理由，既保留结构，也避免重复造成生硬；不排除第二个כִּי带有进一步解释其良善的意味。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇礼仪语体。“你们要”明确复数命令语气；分号使两个称谢的理由层次清楚，同时保持经文的简洁与节奏。
