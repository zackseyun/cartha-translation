lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: 有人坐在
  rationale: 该分词指处于坐着或居住状态的人；结合本诗依次描述不同受困群体的结构，用“有人坐在”自然地转为现代汉语陈述句，同时保留其身处某种境况的意味。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 直接表达字面或比喻意义上的 darkness，也是现代汉语中最清楚、自然的对应词。
- source_word: צַלְמָוֶת
  choice: 幽暗
  rationale: 该词可指极深的黑暗或阴沉可怖之境；“幽暗”保留诗意和强度，却不在正文中明确加入“死亡”这一可能但有争议的词源理解。传统译法“死荫”列入脚注。
- source_word: אֲסִירֵי
  choice: 被困
  rationale: 原词指被捆绑或囚禁的人。以“被困”承接前面的“有人”，符合现代汉语句法，也保留囚禁处境。
- source_word: עֳנִי
  choice: 苦难
  rationale: 该名词可指困苦、患难或贫穷；在囚禁和铁制刑具的语境中，“苦难”较宽泛，不把含义缩限为经济贫困。
- source_word: בַרְזֶל
  choice: 铁链
  rationale: 希伯来文直译为单数“铁”，此处以材质代指铁制束缚物；“铁链”在汉语中清楚呈现囚禁意象，同时避免生硬的“铁”。
