  text: וַ/יִּשְׂמְח֥וּ כִֽי יִשְׁתֹּ֑קוּ וַ֝/יַּנְחֵ֗/ם אֶל מְח֥וֹז חֶפְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/030.yaml
  text: Then they were glad that they grew quiet[b][a], and he led them to their desired haven.
translation:
  language: zh_hans
  text: 风浪平静下来[a]，他们就欢喜；他领他们到了所向往的港湾[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它们（或他们）平静下来”；主语没有明说，按上下文可理解为风浪或水波止息。
    reason: lexical_alternative
  - marker: b
    text: “港湾”也可译作“港口”或“目的地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: 他们就欢喜
  rationale: שׂמח表示欢喜、喜悦；叙事性的前接连词用“就”自然体现事情的先后与结果。
- source_word: כִי יִשְׁתֹּקוּ
  choice: 风浪平静下来
  rationale: שׁתק意为安静、止息。动词没有明说主语，但上文海上风暴及“波浪”构成最自然的所指；正文按语境补出“风浪”，脚注保留原文主语未明的特点。
- source_word: וַיַּנְחֵם
  choice: 他领他们
  rationale: נחה意为引领、带领；第三人称阳性单数的隐含主语在上下文中指上主，译作“他”既保留其主动作为，也不额外增添称谓。
- source_word: מְחוֹז
  choice: 港湾
  rationale: 该词可指抵达之处、港口或避风港；“港湾”符合海上叙事，也保有诗歌语感。
- source_word: חֶפְצָם
  choice: 所向往的
  rationale: 源于חפץ，表达喜爱、愿望或渴求；“所向往的港湾”自然呈现他们盼望抵达之处。
theological_decisions:
- issue: וַיַּנְחֵם的隐含主语
  choice: 译作“他”，按上下文指上主
  alternative: 改为被动式“他们被领到”或明说“上主领他们”
  rationale: 原文为第三人称阳性单数，保留“他”可体现神亲自引领的行动，同时避免在本节重复补入原文未明说的神名。
- issue: יִשְׁתֹּקוּ的主语
  choice: 正文按上下文译为“风浪平静下来”，并以脚注说明原文只说“它们/他们”
  alternative: 直译为“它们平静下来”或理解为水浪止息
  rationale: 上下文明确描写海浪止息，但本节动词本身没有明说主语；正文保证可读性，脚注则保存语法上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“风浪平静下来”顺应中文叙事习惯，并将希伯来文未明说主语的现象留在脚注中；分号呈现欢喜与蒙引领抵达之间的推进。
