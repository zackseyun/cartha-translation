  text: וַ/יֹּ֗אמֶר וַֽ֭/יַּעֲמֵד ר֣וּחַ סְעָרָ֑ה וַ/תְּרוֹמֵ֥ם גַּלָּֽי/ו׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/025.yaml
  text: For he spoke and raised up a storm wind[a], and it lifted up its waves.
translation:
  language: zh_hans
  text: 因为他一说话，就使暴风兴起；暴风掀起海中的波浪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他发话，使风暴之风兴起；它扬起海的波浪。”
    reason: 保留“说／发话”、“暴风／风暴之风”及“掀起／扬起”的词汇替代；“海的波浪”按上下文说明原文“它的波浪”所指。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他一发话
  rationale: אמר通常意为“说、发话”。这里以上帝为承接上下文的主语；“一发话”自然表达风暴随其话语而起，又不把动词过度解释为“命令”。
- source_word: וַיַּעֲמֵד
  choice: 使……兴起
  rationale: עמד的使役式表达使某物起来、出现。“使……兴起”保留使役意义，也比直译“使站立”更符合现代汉语。
- source_word: רוּחַ סְעָרָה
  choice: 风暴
  rationale: 该词组指带来暴风的强风。现代汉语“风暴”已明确包含强风意象，简洁而自然；脚注另保留较贴近字面的“暴风”。
- source_word: וַתְּרוֹמֵם
  choice: 风暴掀起
  rationale: רום在此为使之升高；阴性单数动词与רוּחַ相应，因此以风暴为主语。“掀起”准确呈现风使波浪升高的图景。
- source_word: גַּלָּיו
  choice: 海中的波浪
  rationale: 原文为“它的波浪”，阳性单数后缀按语境最自然地指海。中文若直译“它的波浪”指代容易含混，因此明示为“海中的波浪”，不改变所指。
theological_decisions:
- issue: 省略的神圣主语
  choice: 译为“他”，按上下文指耶和华
  alternative: 不明确主语，或译成被动句
  rationale: 希伯来文动词明确带第三人称阳性单数主语，而上下文以耶和华为施事者。译出“他”保持叙事衔接，并未加入诗篇之外的神学主张。
- issue: 神的话与风暴兴起之间的关系
  choice: 以“一发话，就使”表达直接因果关系
  alternative: 译为两个松散并列动作：“他说，又兴起风暴”
  rationale: 连续动词与上下文呈现上帝发话并使风暴兴起；“一……就……”传达诗句的紧凑力度，同时没有把אמר特定化为正式命令。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一发话”“兴起”“掀起”富有诗歌动感，但不古奥。正文脚注标记[a]置于句末，涵盖整节的词汇替代译法。
