  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: zh_hans
  text: 于是，他们在患难中向耶和华呼求；他救他们脱离种种困厄。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: 于是……呼求
  rationale: 叙事性连接词推进诗篇反复出现的拯救模式；“呼求”准确表达紧急求助，而非一般祷告或说话。
- source_word: אֶל־יְהוָה
  choice: 向耶和华
  rationale: אֶל表示呼求所指向的对象；“向”符合现代汉语习惯。神名 יהוה 采用中文传统且通行的音译“耶和华”。
- source_word: בַּצַּר לָהֶם
  choice: 在患难中
  rationale: 原文直译近于“在属于他们的困厄中”；汉语用“在患难中”自然表达其处境，并保留单数集合意义。
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: 脱离困境
  rationale: מְצוּקוֹת为复数，指压迫性的窘迫、困厄；汉语集合名词“困境”可自然涵盖多重困厄，并与前面的“患难”保持词汇区别。
- source_word: יוֹשִׁיעֵם
  choice: 他救他们
  rationale: ישׁע的使役形在此表示施行拯救；“救他们”简洁自然，也保留神施救的神学分量。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。简体中文圣经传统及普通读者最熟悉“耶和华”；该译法保留专名功能，而不以“主”这一称号替代。由于此处正文并无文本异读，不增设脚注来制造歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留诗篇反复句式的紧凑节奏，并用“患难／困境”反映原文两个相关而不同的困厄词。
