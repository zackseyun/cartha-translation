source:
  edition: WLC
  text: וַ/יִּצְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם מִ֝/מְּצֽוּקוֹתֵי/הֶ֗ם יַצִּילֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/006.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he delivered them from their distresses.
translation:
  language: zh_hans
  text: 他们在患难中向雅威呼求，他就救他们脱离重重困境。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “重重困境”也可译作“种种患难”或“各种窘境”。希伯来文在这里用复数，突出他们所受困苦的多样与深重。
    reason: 说明מְצוּקוֹתֵיהֶם的复数形式及可行的词义选择。
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: 他们……呼求
  rationale: צעק在患难语境中表示急切地呼喊求助；“呼求”自然、庄重，也清楚表达向上帝求救。前缀וַ־推动叙事，在后半句以“就”自然体现先后关系，无须机械译出“于是”。
- source_word: אֶל יְהוָה
  choice: 向雅威
  rationale: אֶל表示动作所指的对象，译作“向”；יְהוָה是上帝的专名，采用现代中文音译“雅威”，不以称号替代。
- source_word: בַּצַּר לָהֶם
  choice: 在患难中
  rationale: צַר在此指困苦、危难的处境；“在患难中”简洁自然，并保留希伯来文单数的概括性表达。
- source_word: מִמְּצוּקוֹתֵיהֶם
  choice: 脱离重重困境
  rationale: מְצוּקוֹת为复数，指压力逼迫下的多种困苦或窘迫处境。“重重困境”既保留复数强调，也比生硬的“诸困苦”更符合现代汉语。
- source_word: יַצִּילֵם
  choice: 他就救他们脱离
  rationale: נצל的使役形表示搭救、解救。“救……脱离”准确表达从困境中获救；“就”承接前句，体现诗句中的回应与叙事次序。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质；不以“主”这一称号替代，也不采用受后期混合读音影响的“耶和华”。
- issue: יַצִּילֵם的时态与体貌
  choice: 他就救他们脱离
  alternative: 他必救他们脱离
  rationale: 该动词形式本身可有未完成体色彩，但在前面的叙事性וַיִּצְעֲקוּ之后，诗歌反复句描述雅威对呼求的实际回应。用“就救”符合上下文，同时不把它改写为脱离当前叙事的普遍应许。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“患难—困境”既避免不必要的重复，又保留原文צַר与מְצוּקוֹת之间相关但不完全相同的措辞；整句保持诗歌反复句的简洁和节奏。
