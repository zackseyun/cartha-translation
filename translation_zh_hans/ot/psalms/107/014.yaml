base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/014.yaml
  text: He brought them out from darkness and the shadow of death[b][a], and he tore apart their bonds.
translation:
  language: zh_hans
  text: 他领他们脱离黑暗和死荫[a]，又扯断他们的锁链。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“幽暗”或“极深的黑暗”。希伯来语 צַלְמָוֶת 可指“死荫”，也可指极深的黑暗。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצִיאֵם
  choice: 他领他们脱离
  rationale: יצא 的使役式表示使人出来、领人出来；本节在诗篇的叙事性赞美中回顾上帝的拯救行动，译作过去完成意义自然，但汉语不必显式标注时态。
- source_word: מֵחֹשֶׁךְ
  choice: 脱离黑暗
  rationale: חֹשֶׁךְ 是普通的“黑暗”；介词 מִן 表示从其中出来，与“领……脱离”搭配自然。
- source_word: וְצַלְמָוֶת
  choice: 和死荫
  rationale: צַלְמָוֶת 可理解为“死荫”或“幽暗、深沉的黑暗”。正文保留传统且在此危险与囚禁语境中贴切的“死荫”，脚注说明另一可能。
- source_word: וּמוֹסְרוֹתֵיהֶם
  choice: 他们的锁链
  rationale: מוֹסְרוֹת 指捆绑人的束缚、镣铐或锁链；“锁链”具体而自然，符合上下文的囚禁图景。
- source_word: יְנַתֵּק
  choice: 挣断
  rationale: נתק 的 Piel 式表达用力扯开、扯断或挣脱；与“锁链”搭配时，“挣断”既自然，也保留强力解除束缚的画面。
theological_decisions:
- issue: צַלְמָוֶת 的译法
  choice: 死荫
  alternative: 幽暗；深沉的黑暗
  rationale: 该词既可唤起死亡威胁的意象，也可泛指极深的黑暗。正文采用传统且语境上成立的“死荫”，同时用脚注保留词义上的真实歧义，不将其限定为单一神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“领他们脱离”表达救出之意；“挣断他们的锁链”保留原文强烈、具体的释放画面。
