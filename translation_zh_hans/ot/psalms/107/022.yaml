  text: Let them offer sacrifices of thanksgiving[b][a], and recount his works with joyful singing.
translation:
  language: zh_hans
  text: 愿他们献上感恩祭[a]，欢呼着述说他的作为。[b]
  philosophy: optimal-equivalence
  footnotes:
