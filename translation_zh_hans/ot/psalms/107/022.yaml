lexical_decisions:
- source_word: וְיִזְבְּחוּ
  choice: 愿他们献上
  rationale: 未完成式在此承接全诗的劝勉语气，译作“愿他们”；祭祀语境中以“献上”表达献祭自然且准确。
- source_word: זִבְחֵי תוֹדָה
  choice: 感恩祭
  rationale: 该附属结构指因感恩而献的祭；“感恩祭”简洁、符合现代汉语宗教语境，也保留其礼仪性质。
- source_word: וִיסַפְּרוּ
  choice: 述说
  rationale: Piel词形表示讲述、 recount；“述说”既可涵盖较详尽的叙说，也保持诗歌语体。
- source_word: מַעֲשָׂיו
  choice: 他的作为
  rationale: מַעֲשֶׂה在此指上帝所行的事；“作为”比“工作”自然，并能表达其行动与功业。
- source_word: בְּרִנָּה
  choice: 欢呼着
  rationale: רִנָּה可指喜乐的呼喊或歌唱；“欢呼着”保留声音响亮、喜乐表达的核心，同时不把含义限定为歌唱。
