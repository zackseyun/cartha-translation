  yaml_path: translation/ot/psalms/107/034.yaml
  text: a fruitful land into a salt waste[a], because of the evil of those who dwell in it.
translation:
  language: zh_hans
  text: '使肥沃之地变成盐碱地[a]，

    因当地居民的恶行。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“盐地”或“含盐之地”；希伯来文所呈现的景象可能指贫瘠、无法出产的地区。
    reason: 词义有不同表达方式，需保留“盐”的字面意象；贫瘠和不能出产是该意象在本语境中可能蕴含的结果。
lexical_decisions:
- source_word: אֶרֶץ פְּרִי
  choice: 肥沃之地
  rationale: פְּרִי 字面为“果实”，与 אֶרֶץ 构成短语时指能出产、富饶的土地；“肥沃之地”在现代汉语中自然，并保留农业生产力的含义。
- source_word: לִמְלֵחָה
  choice: 变成盐碱荒地
  rationale: 前缀 לְ 表示变化的结果；מְלֵחָה 指含盐或盐碱状态，在这里暗示土地贫瘠、无法生产。“盐碱荒地”兼顾盐的具体意象及荒芜的语境含义。
- source_word: מֵרָעַת
  choice: 因为……作恶
  rationale: 介词 מִן 在此表示原因，רָעָה 指恶或邪恶；译成动词性结构“因为……作恶”符合现代汉语表达，同时保留明确的道德因果关系。
- source_word: יֹשְׁבֵי בָהּ
  choice: 住在那里的人
  rationale: 分词 יֹשְׁבֵי 表示居住者，בָהּ 指“在其中”；此译法保留动作意味，并清楚回指那片土地。
theological_decisions:
- issue: 土地荒芜的原因
  choice: 明确表述肥沃之地变为盐碱荒地，是因为当地居民作恶
  alternative: 将变化仅理解为环境或历史现象，不表达道德原因
  rationale: 希伯来文 מֵרָעַת יֹשְׁבֵי בָהּ 明确建立居民之恶与土地变化之间的因果联系；译文应保留这种审判意味的道德因果关系，但不额外说明施事者。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“使……变成……”承接上下文的平行句式；不在本节补出希伯来文未明说的主语，以保留诗歌结构。
