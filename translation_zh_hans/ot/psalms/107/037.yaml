  yaml_path: translation/ot/psalms/107/037.yaml
  text: They sowed fields and planted vineyards[a], and produced the fruit of the harvest.
translation:
  language: zh_hans
  text: 他们在田里播种，栽种葡萄园，产出了收成[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“产出农作物的果实。”
    reason: 原文“果实／成果”（פְּרִי）与“农作物的出产”（תְבוּאָה）连用；正文按现代汉语农业表达译为“收成”。
lexical_decisions:
- source_word: וַיִּזְרְעוּ שָׂדוֹת
  choice: 他们在田里撒种
  rationale: זָרַע是“撒种、播种”的常用动词；将宾语“田地”自然地转换为中文处所短语“在田里”，既保留农耕动作，也避免“播种田地”的生硬表达。
- source_word: וַיִּטְּעוּ כְרָמִים
  choice: 栽种葡萄园
  rationale: נָטַע表示栽种，כְּרָמִים指葡萄园而非仅指葡萄藤；此译保留原文具体的农业意象。
- source_word: וַיַּעֲשׂוּ
  choice: 获得了
  rationale: עָשָׂה本义为“做、产生”；用于农作物出产时，现代汉语用“获得”较自然，并保留人的耕作带来产出的因果关系。
- source_word: פְּרִי תְבוּאָה
  choice: 田地的出产
  rationale: פְּרִי意为果实或成果，תְּבוּאָה意为出产、收成。译作“田地的出产”以通顺中文表达整体农业产物，不擅自加入“丰盛”等原文未明说的程度含义；直译形式则收入脚注。
theological_decisions: []
