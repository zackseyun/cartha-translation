  text: וִֽ֭/ירֹמְמוּ/הוּ בִּ/קְהַל עָ֑ם וּ/בְ/מוֹשַׁ֖ב זְקֵנִ֣ים יְהַלְלֽוּ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/032.yaml
  text: Let them exalt him in the assembly of the people[b][a], and praise him in the council of the elders.
translation:
  language: zh_hans
  text: 愿他们在民众的集会[a]中尊崇他，在长老的议事会[b]中赞美他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “集会”也可译作“会众”或“会”。
    reason: lexical_alternative
  - marker: b
    text: 原文意为“坐席”或“聚坐之处”；这里指长老聚坐议事的集会。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירֹמְמוּהוּ
  choice: 愿他们……尊崇他
  rationale: רומם在此表示在众人面前高举、尊荣；“尊崇”自然庄重，并避免“高举”可能带来的过强空间意象。前缀形式在语境中带劝愿色彩，译作“愿他们”。
- source_word: בִּקְהַל עָם
  choice: 在民众的会中
  rationale: קהל指聚集起来的群体或集会，עָם指民众；此译保留公共聚会的含义，也避免把它限定为现代教会组织。
- source_word: וּבְמוֹשַׁב זְקֵנִים
  choice: 在长老的议会中
  rationale: מוֹשָׁב本义与坐席、聚坐有关，与זְקֵנִים连用时指长老聚坐议事的集会；“议会”传达其公共议事性质。
- source_word: זְקֵנִים
  choice: 长老
  rationale: 这里所指不只是年长者，也是群体中有公认地位的领袖；“长老”保留其社会职分含义。
- source_word: יְהַלְלוּהוּ
  choice: 愿他们……赞美他
  rationale: הלל的强意词干在敬拜语境中通常表示赞美；汉语并列句承接句首“愿他们”，不必重复“愿”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体表达。“民众的会”保留原文公共群体色彩；两个平行分句分别用“尊崇”和“赞美”，呈现希伯来诗歌的对应结构。
