source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/031.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: zh_hans
  text: 愿他们称谢雅威[b]，因他坚定的慈爱，也因他向世人[a]所行的奇事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”直译为“人的众子”，也可译作“人类”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是神圣名字 יהוה（YHWH）的音译；传统上也译作“耶和华”，或以“上主”代称。
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּ
  choice: 愿他们称谢
  rationale: 该词是ידה的使役词干未完成式，在诗篇反复出现的副歌中表达劝勉或愿望；“愿他们称谢”既保留语气，也符合现代中文的诗歌体。
- source_word: לַיהוָה
  choice: 称谢雅威
  rationale: 介词ל标示称谢的对象；יהוה按其专名译作“雅威”，而不是将其普通名词化。
- source_word: חַסְדּוֹ
  choice: 他的忠贞之爱
  rationale: חסד兼有慈爱、信实和持久忠诚之意；“忠贞之爱”比单用“慈爱”更充分传达这种坚定而守信的爱，同时避免把含义限定为某一套神学术语。
- source_word: וְנִפְלְאוֹתָיו
  choice: 也因他……所行的奇事
  rationale: נפלאות指令人惊叹的非凡作为；补出“所行”使中文自然，并以“也因”明确它与前一项同为称谢的缘由。
- source_word: לִבְנֵי אָדָם
  choice: 向世人
  rationale: 该短语字面为“向人的众子”，在希伯来语中代表人类；“向世人”自然表达这些奇事以人类为对象，又不误导为仅指男性后代。
theological_decisions:
- issue: 神圣名字יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；正文采用较贴近其通行学术读音的音译“雅威”，脚注列出中文传统译名及称号译法。
- issue: בני אדם所指的范围
  choice: 世人
  alternative: 人的众子；人类
  rationale: 该阳性复数习语在此具有人类总体的代表意义；“世人”保留群体意味并符合自然现代汉语，脚注注明其字面形式，以免掩盖原文措辞。
- issue: חסד的神学语义
  choice: 忠贞之爱
  alternative: 慈爱；信实之爱
  rationale: 译文兼顾爱、恩慈与持久忠诚，不把该词静默缩减为单纯怜悯，也不强行加入原文未明说的“盟约”一词。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“称谢”保留诗篇敬拜语域而不显陈旧；句式依照原文先提出称谢对象，再列举两个缘由，适合作为本诗反复出现的副歌。
