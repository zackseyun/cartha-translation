  text: יַעֲל֣וּ שָׁ֭מַיִם יֵרְד֣וּ תְהוֹמ֑וֹת נַ֝פְשָׁ֗/ם בְּ/רָעָ֥ה תִתְמוֹגָֽג׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/026.yaml
  text: They rose up to the heavens; they went down to the depths[a]. Their soul melted away in distress.
translation:
  language: zh_hans
  text: 他们升到天上，又降到深渊；他们的心灵在患难中消融[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的心灵”也可译作“他们的生命”；“患难”也可译作“灾祸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלוּ
  choice: 升到
  rationale: עלה的Qal未完成式第三人称复数，表示向上运动；“升到”简洁自然，并与下句“降到”形成鲜明对照。
- source_word: שָׁמַיִם
  choice: 天上
  rationale: שָׁמַיִם在此构成风浪把船上抛的诗意图景；“天上”既保留夸张意象，也符合现代汉语表达。
- source_word: יֵרְדוּ
  choice: 降到
  rationale: ירד的Qal未完成式第三人称复数，与“升到”对举；不额外加入“沉没”等原文未明说的含义。
- source_word: תְהוֹמוֹת
  choice: 深渊
  rationale: תְּהוֹם的复数在风暴语境中指海的极深处或浪谷；汉语以集合性的“深渊”自然表达其诗意，无须机械标出复数。
- source_word: נַפְשָׁם
  choice: 他们的心灵
  rationale: נֶפֶשׁ可指生命、自我或内在生命；“心灵”在这里表达人在恐惧中的内在状态，同时避免把词义限定为与身体相分离的“灵魂”。
- source_word: בְּרָעָה
  choice: 因患难
  rationale: רָעָה在此不是道德意义的“恶”，而是风暴带来的灾难和困苦；介词ב在语境中可自然理解为处境或原因，译作“因患难”符合现代汉语。
- source_word: תִּתְמוֹגָג
  choice: 消融
  rationale: מוג的此形态描绘融化、瓦解；“消融”保留诗歌隐喻，比直接译为“丧胆”更贴近原文形象。
theological_decisions:
- issue: נֶפֶשׁ所指是“心灵”还是“生命”
  choice: 正文译为“心灵”
  alternative: “生命”或“他们整个人”
  rationale: 上下文强调风暴中人的内在崩溃，但נֶפֶשׁ本身具有“生命、自我、内在生命”等宽广义域；正文保留内在感受的诗意，脚注提示“生命”这一真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以“升到……降到……”保存希伯来诗句的上下对举，以“消融”保留内在瓦解的隐喻；脚注呈现נֶפֶשׁ与רָעָה的词义幅度。
