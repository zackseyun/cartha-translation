  text: יִרְא֣וּ יְשָׁרִ֣ים וְ/יִשְׂמָ֑חוּ וְ/כָל עַ֝וְלָ֗ה קָ֣פְצָה פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/042.yaml
  text: The upright see and rejoice[a], and all injustice shuts its mouth.
translation:
  language: zh_hans
  text: 正直人看见并欢喜；一切不义都闭上了嘴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不义”在希伯来文中是阴性单数名词；“它的嘴”中的后缀也为阴性单数。本句把不义拟人化，描写它闭上了嘴。也可译作“一切邪恶都闭上了嘴”。
    reason: 说明原文的拟人手法、阴性词形及词义选择
lexical_decisions:
- source_word: יִרְאוּ
  choice: 看见
  rationale: ראה的Qal未完成式第三人称复数；诗句可表达将来或概括性的情形。中文用“看见”自然保留这种开放性。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 形容词复数作名词使用，指为人正直者；“正直人”贴近“正直、端正”的伦理含义，也避免改译为来源不同的专门术语。
- source_word: וְיִשְׂמָחוּ
  choice: 就欢喜
  rationale: שמח的Qal未完成式第三人称复数。“欢喜”体现积极喜乐；“就”自然连接看见与欢喜的反应关系，虽未另译连接词“和”，并未增添因果教义。
- source_word: וְכָל
  choice: 一切……都
  rationale: כָל表示整体范围；中文“一切……都”自然准确。句首连接词以分号所表达的并列推进关系体现，避免生硬重复“而”。
- source_word: עַוְלָה
  choice: 不义
  rationale: 该阴性单数抽象名词表示不正、错谬或邪恶。“不义”简洁庄重，保留抽象主体，不把它擅自具体化为“不义的人”。
- source_word: קָפְצָה
  choice: 闭上了
  rationale: קפץ在与“口”搭配时意为关闭、闭住；完成式以“了”体现动作达到闭合状态，同时适合诗中正直人欢喜与不义噤声的画面。
- source_word: פִּיהָ
  choice: 嘴
  rationale: 原文为“她的口”，阴性单数后缀与עַוְלָה呼应。现代汉语无需用代词标示语法性别；“不义都闭上了嘴”完整保留拟人意象。
theological_decisions:
- issue: 对“不义”的拟人化
  choice: 保留抽象名词“不义”为主语，并译作“闭上了嘴”
  alternative: 改为“不义的人都闭口无言”或“一切邪恶都闭上了嘴”
  rationale: 希伯来文主语是抽象名词עַוְלָה，并非指人的名词。保留抽象主体与“嘴”的搭配，可以传达原诗把不义拟人化并使之噤声的张力，不将其解释成某一群人。
- issue: 动词时态与诗句陈述方式
  choice: 前半句不明标将来，后半句用“了”呈现完成状态
  alternative: “正直人必看见并欢喜；一切不义必闭口无言”
  rationale: 前两个动词是未完成式，后一个是完成式。上下文可有将来、典型情形或诗意结果等理解；译文不统一加“必”，以免把原有体貌差异化约为单一预言语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正直人”清楚凝练；“闭上了嘴”比“杜口”更通俗，同时保留希伯来诗歌鲜明的拟人画面。分号呈现两个诗行之间并列而带对照的关系。
