  text: יֹ֭אמְרוּ גְּאוּלֵ֣י יְהוָ֑ה אֲשֶׁ֥ר גְּ֝אָלָ֗/ם מִ/יַּד צָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/002.yaml
  text: Let the redeemed of Yahweh say so[a], whom he has redeemed from the hand of the foe,
translation:
  language: zh_hans
  text: '愿雅威所救赎的人这样说：

    他从仇敌[a]手中救赎了他们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仇敌”也可译作“敌人”或“压迫者”。希伯来语这个词指敌对、困迫人的一方。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: 愿……这样说
  rationale: 未完成式在此承接上一节的呼召，具有劝勉、祈愿意味。“愿……说”保留意愿语气；“这样”补足现代汉语表达中由上文提供的隐含内容，并未另添具体信息。
- source_word: גְּאוּלֵי / גְּאָלָם
  choice: 救赎的人／救赎出来
  rationale: 两处同源于 גאל，译文重复“救赎”，保留原文的词语呼应，也表达雅威施行解救、将人从他者权势下领回的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名，故以现代汉语常见的音译“雅威”呈现，不以称号替代专名。
- source_word: מִיַּד
  choice: 从……手中
  rationale: 保留希伯来语“从某人手中”的形象；现代汉语也自然用此说法表达脱离某人的权势或控制。
- source_word: צָר
  choice: 敌人
  rationale: 此处名词最自然地指敌对者，也可带有压迫者的意味。“敌人”简明自然，并保留其单数集合性用法。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名而非“主”这一称号；采用较贴近学界通行重构读音的“雅威”，使专名在译文中清楚可见。
- issue: גאל 的救赎含义
  choice: 救赎
  alternative: 赎回
  rationale: “救赎”能同时涵盖从敌对权势下解救和归回所属关系的含义，不把本句窄化为纯粹的金钱交易；两次重复也保留原文强调。
- issue: יֹאמְרוּ 的语气
  choice: 愿……这样说
  alternative: ……要这样说
  rationale: 上下文是对蒙救赎者的呼召，形式可理解为劝勉性的未完成式。用“愿”保留其祈愿或号召色彩，不将其定为单纯将来时。
translation_notes:
  register: 采用庄重而自然的现代书面汉语，并按诗歌节奏分为两行。关系从句改为“他们就是……”以避免汉语中连续修饰造成拗口；分号体现后半句对前半句人物身份的说明。
