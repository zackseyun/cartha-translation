  terminology: “雅威”恰当呈现神名；“救赎”恰当保留גאל的词汇重复及其救援含义。“仇敌”比一般的“敌人”稍具诗歌语体，也适合单数集合性的“敌对者”；脚注应保留“压迫者”为可行替代。
