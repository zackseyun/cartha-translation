  yaml_path: translation/ot/psalms/107/005.yaml
  text: Hungry and thirsty[b][a], their soul fainted within them.
translation:
  language: zh_hans
  text: 他们又饥又渴，心力渐渐衰竭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的生命渐渐衰微”，或“他们自己渐渐昏弱”。希伯来语“נֶפֶשׁ”可指心灵、生命或自身。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵבִים
  choice: 饥
  rationale: 该形容词表示饥饿；“饥”简洁自然，不额外强化为“饿得要死”。
- source_word: גַּם
  choice: 又……又……
  rationale: גַּם具有添加、并列之意；与两个形容词连用时，“又饥又渴”既符合现代汉语习惯，也保留“不仅饥饿，也口渴”的叠加意味。
- source_word: צְמֵאִים
  choice: 渴
  rationale: 直接表达口渴，与“饥”构成自然、凝练的并列。
- source_word: נַפְשָׁם
  choice: 心力
  rationale: נֶפֶשׁ可指生命、自身或内在生命。此处与表示衰弱的动词连用，“心力”能自然表现内在生命力量的耗尽，同时以脚注保留“生命、自己”等词义可能。
- source_word: בָּהֶם
  choice: 在他们里面
  rationale: 保留希伯来语的内部方位意象，表示衰竭发生在他们自身之内。
- source_word: תִּתְעַטָּף
  choice: 衰竭
  rationale: 该动词在此描写内在力量因饥渴而衰弱、昏沉；“衰竭”比字面的“包裹自己”更准确传达语境意义，又不必断定他们已实际昏倒。
theological_decisions:
- issue: נֶפֶשׁ的人观表达
  choice: 正文译为“心力”，脚注注明“生命”或“他们自己”
  alternative: 灵魂
  rationale: 原词语义范围包括生命、自身和内在生命，并不必然指与身体分离的“灵魂”。“心力”在本句中自然地表达内在生命力量，同时脚注保留原文的多义性，避免导入特定的人观。
translation_notes:
  register: 采用现代、凝练而有诗意的标准普通话。“又饥又渴”自然体现גַּם的添加作用；“在他们里面”刻意保留原文的内在方位意象。
