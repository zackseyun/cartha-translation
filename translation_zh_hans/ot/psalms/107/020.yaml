  text: He sent his word and healed them[a], and delivered them from their pits.
translation:
  language: zh_hans
  text: 他发出话语，医治他们，救他们脱离深坑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“毁灭”或“坟墓”。希伯来语这个词可指坑穴，也可指毁灭、败坏或死亡之境。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: 发出
  rationale: 该词为Qal未完成式第三人称阳性单数；在本诗回顾耶和华作为的叙事语境中，用过去时意义理解。汉语“发出”与“话”搭配自然，也保留差遣、送出的动态。
- source_word: דְּבָרוֹ
  choice: 自己的话
  rationale: דבר在此可指“话、言语”或“命令”。译作“自己的话”保留原文简洁表达及上帝话语产生功效的意味，同时不把它限定为命令、信息或位格化的“道”。
- source_word: וְיִרְפָּאֵם
  choice: 医治他们
  rationale: רפא的Qal词干通常意为“医治”；宾语后缀指本段中受苦患病的人。“医治他们”直接、自然。
- source_word: וִימַלֵּט
  choice: 救他们脱离
  rationale: מלט的Piel词干表达使人逃脱、搭救之意。“救……脱离”既符合现代汉语，也保留诗篇中的拯救意味。
- source_word: מִשְּׁחִיתוֹתָם
  choice: 脱离深坑
  rationale: 该复数名词带第三人称阳性复数后缀，可理解为“他们的坑”，也可指毁灭、败坏或坟墓。正文采用语境中形象而自然的“深坑”；汉语由“救他们脱离”已可明确这些坑与他们有关，无须生硬重复“他们的”。其他可能含义列入脚注。
theological_decisions:
- issue: “自己的话”是否指位格化或弥赛亚性的“道”
  choice: 按上帝所发出的有效话语来翻译，不明确指向一个位格
  alternative: 译作“命令”，或将其解释为位格化的“道”
  rationale: 本节明确说上帝发出他的话施行医治和拯救，却没有在本诗中明说这“话”是一位格。译文保留可能的正典共鸣，但不把后来的神学认定写入正文。
- issue: מִשְּׁחִיתוֹתָם所指的危险
  choice: 正文译作“深坑”，脚注保留“毁灭、坟墓”等语义可能
  alternative: 正文直接译作“毁灭”或“坟墓”
  rationale: 原词兼有坑穴及毁灭、败坏等相关含义，且本节处于濒死者蒙拯救的语境。采用“深坑”保留诗歌意象，同时用脚注避免排除抽象或死亡层面的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“发出自己的话”保留原文的紧凑和平行节奏；“医治他们，救他们脱离深坑”适合朗读，也没有加入原文未明说的教派性解释。
