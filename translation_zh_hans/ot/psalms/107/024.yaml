  yaml_path: translation/ot/psalms/107/024.yaml
  text: They saw the works of Yahweh[a], and his wonders in the deep.
translation:
  language: zh_hans
  text: 他们看见雅威的作为，也看见他在深水[a]中的奇事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“深处”。这里的希伯来词指深水，与本诗航海的语境相符。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: 他们亲眼
  rationale: 独立三复阳代词带有强调作用；译作“他们亲眼”以自然汉语表达这些航海者亲身目睹的强调语气。
- source_word: רָאוּ
  choice: 看见
  rationale: ראה 的 Qal 完成式第三人称复数，在诗歌叙述中指他们实际目睹的经历。
- source_word: מַעֲשֵׂי
  choice: 作为
  rationale: מַעֲשֶׂה 的复数构造式；“作为”既庄重自然，又能概括雅威所行的事，并与后文“奇事”形成平行。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通常拟音译出其专名，不以“主”这一称号替代。
- source_word: וְנִפְלְאוֹתָיו
  choice: 也看见他的奇事
  rationale: נִפְלָאוֹת 表示令人惊奇、敬畏的非凡作为，第三人称阳性单数后缀译为“他的”；补出“也看见”使汉语平行关系清楚自然。
- source_word: בִּמְצוּלָה
  choice: 在深水中
  rationale: מְצוּלָה 指深处，尤其指深水；本段明确以航海为背景，因此“深水”形象而准确，同时用脚注保留“深处”这一较形式对应的译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”保留专名性质，并避免以称号“主”取代；“耶和华”虽是汉语传统形式，但较接近历史上的混合读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌叙述语体。“亲眼”传达独立代词的强调作用；第二个“看见”使希伯来文的并列结构在现代汉语中清晰顺畅。
