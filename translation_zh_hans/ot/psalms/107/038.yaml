base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/038.yaml
  text: He blessed them[a], and they multiplied greatly; and he did not let their livestock decrease.
translation:
  language: zh_hans
  text: 他赐福给他们；他们的人数大大增多；他也没有使他们的牲畜减少。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的牲畜也没有减少。”希伯来文动词为阳性单数，可以理解为上帝继续作主语，也可以把这句理解为前述赐福所带来的结果。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: 他赐福给他们
  rationale: ברך 的皮珥形带第三人称阳性复数词尾，表示把福分赐给他们；依诗篇上下文，以“他”承接上帝为主语。
- source_word: וַיִּרְבּוּ מְאֹד
  choice: 使他们人数大大增多
  rationale: רבה 在此表示数量增加，מְאֹד 加强程度。中文补出“人数”以清楚表达人口繁增，并用“使”自然呈现赐福所带来的结果。
- source_word: וּבְהֶמְתָּם
  choice: 他们的牲畜
  rationale: בְּהֵמָה 在此为集合名词，泛指家养牲畜；“牲畜”比“牛群”范围更准确，也比“动物”更符合语境。
- source_word: לֹא יַמְעִיט
  choice: 他也没有使其减少
  rationale: מעט 的使役形意为“使变少、减少”。保留阳性单数动词所容许的神为主语，并以“使其减少”贴近使役形式。
theological_decisions:
- issue: 末句主语的延续
  choice: 将上帝理解为主语：“他也没有使其减少”
  alternative: 理解为结果陈述：“他们的牲畜也没有减少”
  rationale: 希伯来文 יַמְעִיט 是阳性单数，最自然地可承接前面“他赐福”的神为主语；但因 בְהֶמְתָּם 为集合名词，末句也可能按结果来理解。正文保留神主动施福的表达，脚注注明另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人数大大增多”避免单说“繁衍”可能带来的生硬感；末句采用前置宾语，使中文顺畅，同时保留原文对牲畜的强调。
