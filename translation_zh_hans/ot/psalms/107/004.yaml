  text: תָּע֣וּ בַ֭/מִּדְבָּר בִּ/ישִׁימ֣וֹן דָּ֑רֶךְ עִ֥יר מ֝וֹשָׁ֗ב לֹ֣א מָצָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/004.yaml
  text: They wandered in the wilderness[a], in a desolate way; they found no city to dwell in.
translation:
  language: zh_hans
  text: 他们在旷野，沿着荒漠中的道路漂泊；找不到可居住的城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּעוּ
  choice: 漂泊
  rationale: 该动词可指迷路、游荡或漂泊；本节描写人在荒野中找不到定居之处，“漂泊”既表达无定向的行走，也不额外赋予道德上的“偏离”含义。
- source_word: בַמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר 指荒无人烟的旷野或沙漠地带；“旷野”自然、庄重，也符合诗篇语域。
- source_word: בִּישִׁימוֹן דָּרֶךְ
  choice: 在荒漠的路上
  rationale: יְשִׁימוֹן 表示荒凉、荒芜之地，דָּרֶךְ 表示道路或路径。译作“荒漠的路上”保留两词之间紧凑而略有歧义的关系，同时形成自然的现代汉语。
- source_word: עִיר מוֹשָׁב
  choice: 可居住的城
  rationale: 该短语指可供居住、定居的城邑。“可居住的城”既保留居住含义，也没有把它限定为他们已经居住的城市。
- source_word: לֹא מָצָאוּ
  choice: 找不到
  rationale: 希伯来语否定完成式表明他们未能找到；汉语“找不到”简洁自然，并适合诗歌叙述。
theological_decisions: []
