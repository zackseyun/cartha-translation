base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/017.yaml
  text: Fools[a], because of the way of their transgression and because of their iniquities[c][b], were afflicted.
translation:
  language: zh_hans
  text: 愚昧人因自己悖逆的行径，又因自己的罪孽而受苦。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因”所对应的希伯来语介词也可较直译为“从”；这里很可能表示原因。
    reason: lexical_alternative
  - marker: b
    text: “悖逆”也可译作“过犯”；“罪孽”也可译作“罪”或“罪责”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: 愚昧人
  rationale: 指道德和属灵上愚顽的人，并非单指智力不足；“愚昧人”自然地保留了智慧文学中的道德类别。
- source_word: מִדֶּרֶךְ פִּשְׁעָם
  choice: 因自己悖逆所走的道路
  rationale: מִן在此按原因理解为“因”；דֶּרֶךְ保留为人的道路或生活方式，פֶּשַׁע译作“悖逆”，突出其反抗、违逆的意味。
- source_word: וּמֵעֲוֺנֹתֵיהֶם
  choice: 又因自己的罪孽
  rationale: 第二个מִן同样明确译出原因；עָוֹן可指罪孽、罪责或其后果，此处复数主要指他们有罪的恶行，译作“罪孽”也与“悖逆”保持词义区分。
- source_word: יִתְעַנּוּ
  choice: 受苦
  rationale: 该Hitpael形式在此表示遭受困苦或折磨；“受苦”简明自然，并依诗篇上下文的叙事语境理解为过去发生的状况。
theological_decisions:
- issue: 罪与苦难之间的因果关系
  choice: 本节说这些人因自己的悖逆道路和罪孽而受苦。
  alternative: 介词也可较形式化地译为“由于／从……而”，使因果表达稍显含蓄。
  rationale: 两个מִן在本诗境中最可能都表示原因；译文保留本节明确的道德因果，却不把它扩大成“一切苦难都由个人犯罪直接造成”的普遍教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“悖逆所走的道路”保留原文“道路”的生活方式隐喻；重复“因”以对应希伯来文两个并列的介词短语，并使两项原因清晰可辨。
