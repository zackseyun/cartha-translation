  text: וַ/יַּכְנַ֣ע בֶּ/עָמָ֣ל לִבָּ֑/ם כָּ֝שְׁל֗וּ וְ/אֵ֣ין עֹזֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/012.yaml
  text: So he humbled their heart with hard labor[a]; they stumbled[c][b], and there was no one to help.
translation:
  language: zh_hans
  text: 他使他们的心因劳苦[a]降卑；他们失足[b]，无人帮助。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劳苦”或译“苦难”“困苦”。原词可指沉重的劳作，也可指痛苦和患难。
    reason: lexical_alternative
  - marker: b
    text: “失足”或译“绊跌了”“跌倒了”“倒下了”。原词可指绊跌、踉跄，也可指倒下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: 他……压低
  rationale: 使役形表达使人降卑、受压低；“压低”既保留因果作用，也与“心”自然搭配。根据上下文，省略的主语是上主，正文保留希伯来文的代词形式“他”。
- source_word: בֶּעָמָל
  choice: 用劳苦
  rationale: עָמָל可指劳碌、苦难或困苦；“劳苦”保留词义范围，不把语境过度限定为制度性的“苦役”。
- source_word: לִבָּם
  choice: 他们的心
  rationale: 原文以单数“心”配复数所属后缀，具有集合用法；中文“他们的心”可自然保留这一表达，并指向内心、意志或勇气。
- source_word: כָּשְׁלוּ
  choice: 他们跌倒了
  rationale: כשל可表示绊跌、摇晃或倒下；此处“跌倒”简明地保留其形象及可能达到的结果。
- source_word: וְאֵין עֹזֵר
  choice: 却无人帮助
  rationale: אֵין加主动分词表示帮助者不存在；“无人帮助”符合现代汉语，也保留完全没有援助的意思。“却”体现困顿与无援之间的语义推进。
theological_decisions:
- issue: וַיַּכְנַע的省略主语
  choice: 按上下文理解为上主，以“他”表达
  alternative: 改用无主句：“他们的心因劳苦而降卑”
  rationale: 上下文把管教与拯救归于耶和华；保留主动使役结构及“他”，既延续诗篇的神学因果，也不在本节擅自补出原文未重复的神名。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“压低他们的心”保留原文的身体空间隐喻和集合单数“心”；分号呈现两小句的平行推进。
