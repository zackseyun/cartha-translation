id: PSA.107.40
reference: Psalms 107:40
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שֹׁפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/040.yaml
  text: He pours contempt on nobles and makes them wander in a trackless waste[a][b].
translation:
  language: zh_hans
  text: 他使权贵[a]饱受蔑视，又使他们在无路的荒野中漂泊[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“贵族”或“首领”。希伯来语 נְדִיבִים 可指贵族、统治者或地位显赫的人。
    reason: lexical_alternative
  - marker: b
    text: 直译“在荒芜之地，没有路”，即在没有路径可走的荒凉之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: 使……饱受
  rationale: 该分词本义为“倾倒”。汉语若直译“把蔑视倾倒在……身上”较为生硬；“使……饱受”自然表达大量、持续临到的意象，并以现在时的一般性陈述呈现上帝的作为。
- source_word: בּוּז
  choice: 蔑视
  rationale: בּוּז表示鄙视、轻蔑，也可包含因受鄙视而蒙羞的意味。“蔑视”保留其核心语义，不把它缩窄为单纯的羞辱或灾祸。
- source_word: נְדִיבִים
  choice: 权贵
  rationale: 此词可指贵族、首领或地位显赫的人；上下文着重有权势者被降卑。“权贵”在现代汉语中自然，也避免将其限定为王室的“王子”。
- source_word: וַיַּתְעֵם
  choice: 使他们……漂泊
  rationale: תעה的使役式意为“使其游荡、迷行”。这里与荒野和无路的意象相连，“漂泊”突出没有方向和道路的处境，而不将其解释为思想或信仰上的“误入歧途”。
- source_word: בְּתֹהוּ
  choice: 在……荒野中
  rationale: תֹהוּ可指荒芜、空虚、混沌；本节结合“无路”描绘荒凉之地。“荒野”符合此处的空间意象，且为普通读者容易理解。
- source_word: לֹא דָרֶךְ
  choice: 无路的
  rationale: 原文简洁地说“没有路”。译作“无路的”既保留否定结构，也自然修饰“荒野”，没有把它过度具体化为道路、车道或踪迹。
theological_decisions:
- issue: 未明说的主语
  choice: 以“他”承接诗篇上下文所指的上帝
  alternative: 理解为泛指或无人称的行动者
  rationale: 本节希伯来文动词没有明列主语，但诗篇107篇的上下文将这些翻转与审判归于耶和华；汉语需要明确承接主语，因此用“他”，不额外加入神学称号。
- issue: “使其漂泊”的意象性质
  choice: 保留为在荒野中无路可行的漂泊
  alternative: 解释为属灵或道德上的迷失
  rationale: 紧接的“荒野、无路”首先支持空间性的游荡意象。译文不排除其比喻意义，但不在正文中替作者作神学化限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“饱受蔑视”以自然汉语传达“倾倒蔑视”的强烈意象；“无路的荒野中漂泊”保留原文简练、荒凉和失去方向的诗歌画面。所有脚注标记均置于正文相应词句之后。
