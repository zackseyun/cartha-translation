  text: כִּֽי שִׁ֭בַּר דַּלְת֣וֹת נְחֹ֑שֶׁת וּ/בְרִיחֵ֖י בַרְזֶ֣ל גִּדֵּֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/016.yaml
  text: For he shattered the doors of bronze and cut through the bars of iron[a].
translation:
  language: zh_hans
  text: 因为他击碎了青铜门[a]，斩断了铁闩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“青铜城门”。原文名词更具体指“门”或“门扇”，但上下文可能是指坚固城门。
    reason: 保留 דַּלְתוֹת 的具体词义及其在语境中的另一种理解。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明应当称谢耶和华的理由；“因为”自然保留了解释关系。
- source_word: שִׁבַּר
  choice: 击碎
  rationale: 该动词表示强力而彻底地打破；“击碎”传达鲜明、果断的破坏动作。
- source_word: דַּלְתוֹת
  choice: 门
  rationale: 原词具体指门或门扇；正文采用普通而准确的“门”，同时以脚注保留上下文中可能指坚固城门的理解。
- source_word: נְחֹשֶׁת
  choice: 青铜
  rationale: 在此类古代金属语境中通常指青铜或铜合金；“青铜”比“黄铜”更符合历史背景，也比宽泛的“铜”更明确。
- source_word: בְרִיחֵי
  choice: 门闩
  rationale: 指用来闩住门的横杠或闩条；“门闩”在现代汉语中清楚自然，并与前句的门相呼应。
- source_word: בַרְזֶל
  choice: 铁
  rationale: 该金属名称的标准对应词。
- source_word: גִּדֵּעַ
  choice: 斩断
  rationale: 该动词有砍下、截断之意；用于铁闩时，“斩断”既自然，又保留原文强烈的动作感。
theological_decisions:
- issue: 施行动作的主体
  choice: 他
  alternative: 耶和华
  rationale: 本节希伯来文只有第三人称阳性单数动词，没有明说主语；主体由上下文回指耶和华。译作“他”保留原文的篇章衔接，不在本节补出神名。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“击碎／斩断”形成平行结构，保留希伯来诗句的力度；使用普通代词“他”，不额外引入带有特定传统色彩的神圣代词写法。
