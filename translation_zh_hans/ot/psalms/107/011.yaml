  text: כִּֽי הִמְר֥וּ אִמְרֵי אֵ֑ל וַ/עֲצַ֖ת עֶלְי֣וֹן נָאָֽצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/011.yaml
  text: For they rebelled against the words of God and despised the counsel of the Most High[a].
translation:
  language: zh_hans
  text: 因为他们违背上帝的话，藐视至高者的劝告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝告”也可译作“旨意”；本句也可译作：“因为他们抗拒上帝的话，蔑视至高者的旨意。”
    reason: 保留 הִמְרוּ、עֵצָה 和 נָאָצוּ 的词义替代及语气差异。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出他们受苦处境的原因；现代汉语中“因为”能清楚连接上文。
- source_word: הִמְרוּ
  choice: 背叛
  rationale: 该词表达反抗、悖逆；“背叛……的话”保留了对上帝言语的公然抗拒及关系层面的破裂。
- source_word: אִמְרֵי
  choice: ……的话
  rationale: 这是“言语、话语”的复数构造形式；译作“话”自然简明，也足以涵盖上帝所说的一切。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是常见的神圣称谓；“上帝”清楚自然，并与下半句的“至高者”形成称谓上的平行。
- source_word: וַעֲצַת
  choice: 劝告
  rationale: עֵצָה可指劝告、谋略或旨意；此处“劝告”与人的藐视相配，同时避免把含义限定为预定计划。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 保留这一神圣称号及其崇高语气，并与“上帝”构成诗歌平行。
- source_word: נָאָצוּ
  choice: 藐视
  rationale: 该词表示轻蔑、鄙弃；“藐视”简洁有力，准确表现他们以轻蔑态度拒斥上帝的劝告。
theological_decisions:
- issue: 平行结构中 אֵל 与 עֶלְיוֹן 两个神圣称谓的译法
  choice: 上帝……至高者
  alternative: 大能者……至高者
  rationale: 原文使用两个不同而常见的神圣称谓。“上帝……至高者”既保留区别和诗歌平行，也不额外引入原文未强调的教义含义。
- issue: עֵצָה 在此处所指的范围
  choice: 劝告
  alternative: 旨意／谋略
  rationale: 原词可指劝告、计划或旨意。正文用“劝告”保留智慧指引的语感；脚注列出“旨意”，以保留其可能指上帝计划或定意的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语言。“背叛”与“藐视”保持两行中的强烈反抗语气；“上帝……至高者”保留原文神圣称谓的平行。
