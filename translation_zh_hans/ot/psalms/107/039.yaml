  text: Then they were diminished and brought low through oppression[a], calamity, and sorrow.
translation:
  language: zh_hans
  text: 后来，他们人数减少，又被压低；这是因压迫、祸患和忧愁所致。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“后来，他们变得稀少，因压制、患难和悲伤而屈身低伏。”
    reason: 保留“变得稀少”对应 מעט、“压制”对应 עֹצֶר，以及 שׁחח 所含较具体的“屈身低伏”意象。
lexical_decisions:
- source_word: וַיִּמְעֲטוּ
  choice: 他们人数减少
  rationale: מעט的Qal连续式在此表示变少、人数减少；明确译出“人数”，自然呈现本诗上下文中群体由兴盛转为衰微的逆转。
- source_word: וַיָּשֹׁחוּ
  choice: 卑微屈下
  rationale: שׁחח表示低伏、屈下或落到卑微境地；此译兼顾可能的身体意象与社会处境，又不限定为单纯的外在动作。
- source_word: מֵעֹצֶר
  choice: 因受压迫
  rationale: עֹצֶר可指拘束、压制或压迫；介词מִן在此自然表达原因，“因受压迫”符合语境，也保留其受制于人的意味。
- source_word: רָעָה
  choice: 遭遇祸患
  rationale: רָעָה在此更可能指不幸、灾祸，而非道德意义的邪恶；补出“遭遇”使三个致困因素在现代汉语中衔接自然。
- source_word: וְיָגוֹן
  choice: 忧愁
  rationale: יָגוֹן指悲伤、愁苦；“忧愁”清楚自然，并保留情感层面的痛苦。
