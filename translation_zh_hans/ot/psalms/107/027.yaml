  text: יָח֣וֹגּוּ וְ֭/יָנוּעוּ כַּ/שִּׁכּ֑וֹר וְ/כָל חָ֝כְמָתָ֗/ם תִּתְבַּלָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/027.yaml
  text: They reel and stagger like a drunkard[a], and all their wisdom is swallowed up.
translation:
  language: zh_hans
  text: 他们东倒西歪，摇摇晃晃，像醉酒的人；他们的一切智慧[a]都被吞没了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “智慧”也可译作“本领”；这里指他们在海上应变的实际经验和能力全都失效了。
    reason: 说明חָכְמָה在航海危难语境中的实践性含义，同时保留正文较宽泛的词义。
lexical_decisions:
- source_word: יָח֣וֹגּוּ
  choice: 东倒西歪
  rationale: 此动词在风浪语境中描写站立不稳、踉跄打转的动作；“东倒西歪”自然而形象，并与下一动词构成近义平行。
- source_word: וְיָנוּעוּ
  choice: 摇摇晃晃
  rationale: 该词表达摇动、蹒跚或动荡；此译保留反复、不稳的动态，并避免与前一动词完全重合。
- source_word: כַּשִּׁכּוֹר
  choice: 像醉酒的人
  rationale: 保留原文以单数醉者为喻的比较结构；现代汉语自然易懂，且语体庄重不过度。
- source_word: וְכָל חָכְמָתָם
  choice: 他们的一切智慧
  rationale: חָכְמָה通常指“智慧”，此处也可指在海上应变的实际本领。正文保留较直接且含义宽广的“智慧”，脚注说明语境义，不把它窄化为特定的航海技术。
- source_word: תִּתְבַּלָּע
  choice: 都被吞没了
  rationale: 保留源自动词“吞下、吞没”的具体隐喻，表现风暴中人的智慧和能力完全不起作用，而不以“失效”之类解释性译法取代诗歌意象。
theological_decisions: []
translation_notes:
  register: 采用现代、清晰而有诗意的标准普通话。“东倒西歪，摇摇晃晃”再现两个近义动作动词的平行和节奏；分号区分身体失稳与智慧被吞没两个分句。
