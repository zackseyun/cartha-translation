  text: יָשֵׂ֣ם נְהָר֣וֹת לְ/מִדְבָּ֑ר וּ/מֹצָ֥אֵי מַ֝֗יִם לְ/צִמָּאֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/033.yaml
  text: He turns rivers into a wilderness[a], and springs of water into thirsty ground.
translation:
  language: zh_hans
  text: 他使江河变为荒野，使水泉变为干渴之地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“干旱之地。”希伯来语名词直译为“口渴”或“干渴”，在这里指干燥无水的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: 使……变为
  rationale: 该动词本义为“放置、设立、使成为”；在这里描述环境的转变，用“使……变为”既贴近原文，也符合现代汉语表达。
- source_word: נְהָרוֹת
  choice: 江河
  rationale: 复数名词通常指河流；“江河”自然、庄重，也保留复数的整体意象。
- source_word: לְמִדְבָּר
  choice: 变为荒野
  rationale: מִדְבָּר可指旷野或沙漠；“荒野”保留荒凉、无人之地的较广含义，介词ל在此表示结果状态。
- source_word: וּמֹצָאֵי מַיִם
  choice: 水泉
  rationale: מֹצָאֵי意为水流出的源头；“水泉”简洁地表达涌水之处，并与“江河”形成诗歌平行。
- source_word: לְצִמָּאוֹן
  choice: 变为干渴之地
  rationale: 该名词字面意为“口渴、干渴”，此处借指缺水的状态或地方；“干渴之地”保留拟人化意象，又让现代读者清楚理解其空间含义。
