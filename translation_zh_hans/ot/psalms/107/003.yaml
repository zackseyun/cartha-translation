  text: וּֽ/מֵ/אֲרָצ֗וֹת קִ֫בְּצָ֥/ם מִ/מִּזְרָ֥ח וּ/מִֽ/מַּעֲרָ֑ב מִ/צָּפ֥וֹן וּ/מִ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/003.yaml
  text: and gathered them from the lands[a], from the east and from the west[b], from the north and from the sea.
translation:
  language: zh_hans
  text: 又从各地把他们聚集起来——从东方、西方、北方，也从海上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“南方”。希伯来原文是“海”；“海”有时也可用作方位词，通常指西方，但本节已经明确提到“西方”。
    reason: 保留原文“海”的词义及四方位式理解之间的歧义。
lexical_decisions:
- source_word: וּמֵאֲרָצוֹת
  choice: 又从各地
  rationale: אֲרָצוֹת是אֶרֶץ的复数，在此指多个地域；“各地”比带有现代政治含义的“各国”更自然，也保留了来源广泛的意思。
- source_word: קִבְּצָם
  choice: 把他们聚集起来
  rationale: קבץ意为“聚集、收集”；这里承接被救赎者归聚的语境，“聚集起来”准确而自然。
- source_word: מִמִּזְרָח
  choice: 从东方
  rationale: מִזְרָח指日出之处，即东方；在方位列举中译作“东方”清楚自然。
- source_word: וּמִמַּעֲרָב
  choice: 西方
  rationale: מַעֲרָב指西方；与“东方、北方”构成简洁平衡的并列。
- source_word: מִצָּפוֹן
  choice: 北方
  rationale: צָפוֹן是基本方位词“北方”。
- source_word: וּמִיָּם
  choice: 也从海上
  rationale: יָם通常意为“海”。它有时可作方位词，表示与海相关的西方，但本节已经明确用了מַעֲרָב“西方”，因此正文保留“海”的本义，并以脚注说明另一种理解。
