  text: וַ/יִּצְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם וּֽ֝/מִ/מְּצֽוּקֹתֵי/הֶ֗ם יוֹצִיאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/028.yaml
  text: Then they cried out to Yahweh in their trouble[a], and he brought them out of their distresses.
translation:
  language: zh_hans
  text: 于是，他们在患难中向耶和华呼求；他就把他们从种种困境中带出来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为复数，意为“他们的种种困境”；也可译为“从他们的种种困境中”。
    reason: 保留英语审校链的脚注锚点，并说明原文复数及介词短语的可行中文表达。
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: 于是……呼求
  rationale: וַ־推动叙事进程，结合本诗反复出现的模式译作“于是”；צעק表示在危急中迫切求助，译作“呼求”比一般的“呼喊”更准确自然。
- source_word: אֶל־יְהוָה
  choice: 向耶和华
  rationale: אֶל表示呼求所指向的对象；יהוה是以色列上帝的专名，采用现代中文中通行且庄重的“耶和华”。
- source_word: בַּצַּר לָהֶם
  choice: 在患难中
  rationale: צַר在此指困苦、危难的处境；לָהֶם表达这是他们所遭遇的患难。中文“在患难中”简洁自然，也与诗篇107篇的重复副歌协调。
- source_word: וּמִמְּצוּקוֹתֵיהֶם
  choice: 脱离困境
  rationale: מְצוּקוֹת是复数，指压迫、窘迫或困苦的处境；中文集合性名词“困境”可以自然涵盖多重危困，מִן的分离义由“脱离”表达。
- source_word: יוֹצִיאֵם
  choice: 他就救他们脱离
  rationale: 这是יצא的使役形，字面为“使他们出来、把他们带出”。与מִן短语连用时，中文“救……脱离”既保留解救含义，也自然传达从困境中被带出的意象。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。简体中文圣经传统及普通读者最熟悉“耶和华”；这一译法保留专名功能，不以“主”这一称号替代。
- issue: יוֹצִיאֵם是否明确译为神的拯救行动
  choice: 救他们脱离
  alternative: 把他们带出
  rationale: 使役动词与“脱离他们的困境”搭配，在语境中明显表达解救；译为“救他们脱离”自然明确，但不增添有关拯救方式的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来诗歌中“呼求—蒙救”的因果与叙事推进，并以分号呈现两个平衡分句。
