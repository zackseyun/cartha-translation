  text: כָּל אֹ֭כֶל תְּתַעֵ֣ב נַפְשָׁ֑/ם וַ֝/יַּגִּ֗יעוּ עַד שַׁ֥עֲרֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/018.yaml
  text: Their soul loathed all food[a], and they drew near to the gates of death.
translation:
  language: zh_hans
  text: 他们厌恶一切食物[a]，临近死亡之门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“他们的נֶפֶשׁ厌恶一切食物”。נֶפֶשׁ按语境可指人自身、生命或食欲；这里正文译作“他们”，也可理解为“他们的胃口厌恶一切食物”。
    reason: 说明נֶפֶשׁ在此可指整个人、生命或食欲，并交代正文采用自然汉语代词的依据。
lexical_decisions:
- source_word: כָּל אֹכֶל
  choice: 一切食物
  rationale: כָּל与אֹכֶל连用，泛指所有食物；“一切食物”在现代汉语中自然，并保留原文的完全性。
- source_word: תְּתַעֵב
  choice: 厌恶
  rationale: תעב的Piel词干表达强烈的反感与排斥。“厌恶”庄重而通俗，也适合人与食物之间的搭配。
- source_word: נַפְשָׁם
  choice: 他们（正文隐含其主体意义）
  rationale: נֶפֶשׁ在此可指整个人、生命或食欲。若直译为“他们的灵魂”，现代汉语容易使读者误解为灵肉二分；正文以“他们”自然表达整体的人，并用脚注保留“性命／胃口”等语义可能。
- source_word: וַיַּגִּיעוּ עַד
  choice: 临近
  rationale: נגע的Hifil形式与עַד连用，表示到达或逼近某一界限；在“死亡之门”的比喻中，“临近”传达死亡迫在眉睫，而不暗示已经越过门槛。
- source_word: שַׁעֲרֵי מָוֶת
  choice: 死亡之门
  rationale: 直译原文的构造短语，保留以门象征死亡边界的诗歌意象；不改译为“阴间之门”，因为原文所用的是“死亡”而非“阴间”。
theological_decisions:
- issue: 重病语境中נֶפֶשׁ的译法
  choice: 正文译作“他们”，脚注说明原文为“他们的נֶפֶשׁ”
  alternative: 他们的心／他们的胃口／他们的性命
  rationale: 这里的נֶפֶשׁ既可代表整个人，也可能因食物语境而带有“胃口、食欲”的意味。正文用现代汉语自然的“他们”，避免把经文限定为灵魂厌食或仅指生理食欲；脚注则保留原文的人论色彩和真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“厌恶一切食物”直接有力；“死亡之门”保留希伯来诗歌的边界意象。句式简洁，与本诗叙述危难的节奏相称。
