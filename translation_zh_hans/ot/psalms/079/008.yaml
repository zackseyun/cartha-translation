  to: 求你不要记念往昔的罪孽而追究我们；愿你的怜悯快快临到我们，因为我们已经极其衰微。
  rationale: 修订仅处理现代汉语的自然度与意象方向：“临到我们”自然表达怜悯迅速来到、先行临及求告者的祈求，不将其误读为“欢迎”；“记念……而追究”则保留原文“记念”与不利司法效果的关联。正文继续不指定“往昔的罪孽”究竟是祖先所犯还是群体早先所犯，脚注保留两种主要理解。
