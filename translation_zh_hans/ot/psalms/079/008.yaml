  text: אַֽל תִּזְכָּר לָ/נוּ֮ עֲוֺנֹ֪ת רִאשֹׁ֫נִ֥ים מַ֭הֵר יְקַדְּמ֣וּ/נוּ רַחֲמֶ֑י/ךָ כִּ֖י דַלּ֣וֹנוּ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/008.yaml
  text: Do not remember against us the iniquities of former times; let your mercies quickly come to meet us[a], for we have been brought very low.
translation:
  language: zh_hans
  text: 求你不要记念往昔的罪孽而追究我们；愿你的怜悯快快临到我们，因为我们已经极其衰微。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּזְכָּר לָנוּ
  choice: 求你不要记着……来追究我们
  rationale: אַל与未完成式在祷告中表达禁止性的恳求；תִּזְכָּר保留“记着”的基本意象，而לָנוּ在罪责语境中的不利、司法意味以“来追究我们”自然表达。
- source_word: עֲוֺנֹת רִאשֹׁנִים
  choice: 往昔的罪孽
  rationale: עָוֹן兼有罪行与罪责的分量，译为“罪孽”；רִאשֹׁנִים指先前、往昔，但未明确这些罪孽属于祖先还是本群体从前所犯，因此采用不标明归属的时间性表达。
- source_word: מַהֵר
  choice: 快
  rationale: 直接表达恳求中的紧迫感，符合现代汉语祷告语体。
- source_word: יְקַדְּמוּנוּ
  choice: 来迎接我们
  rationale: קדם在此有来到前面、迎上来的意象；以“来迎接我们”保留上帝的怜悯主动临到求告者的画面。
- source_word: רַחֲמֶיךָ
  choice: 你的怜悯
  rationale: רַחֲמִים虽为形态上的复数，现代汉语通常以不可数的“怜悯”自然表达，不必机械复数化。
- source_word: כִּי
  choice: 因为
  rationale: 引出恳求的理由，现代汉语中清楚自然。
- source_word: דַלּוֹנוּ מְאֹד
  choice: 我们已经极其衰微
  rationale: דלל表示被削弱、降低或陷入困乏；“已经极其衰微”兼顾完成体所表达的既成处境和מְאֹד的强烈程度，同时不把具体困境限定为贫穷。
theological_decisions:
- issue: “往昔的罪孽”的归属
  choice: 正文仅译为“往昔的罪孽”，不明确归给祖先或当下群体。
  alternative: 可理解为“我们祖先的罪孽”，也可理解为“我们从前的罪孽”。
  rationale: 希伯来语עֲוֺנֹת רִאשֹׁנִים只有时间性的修饰语，没有明确的所有格；正文保留其真实歧义，脚注列出主要理解。
- issue: 上帝“记着”罪孽的司法意味
  choice: 译为“记着……来追究我们”。
  alternative: 可较直译为“不要向我们记念往昔的罪孽”，或较意译为“不要因往昔的罪孽追讨我们”。
  rationale: 正文既保留זכר的记忆意象，也把לָנוּ在不利语境中的追责意味表达出来，但不进一步断定追究的具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”体现诗篇恳求口吻；“怜悯快来迎接我们”保留原文拟人化意象；避免使用过度古雅的“昔日之罪”“速速临到”等表达。
