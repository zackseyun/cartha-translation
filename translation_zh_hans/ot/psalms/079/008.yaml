  terminology: “罪孽”“怜悯”“极其衰微”均适合本节庄重的诗篇祷告语体。“罪孽”保留עָוֹן的罪责重量；“怜悯”可自然承载רַחֲמֶיךָ的复数性集体表达，无须在汉语中机械译作复数。
