  text: עָזְרֵ֤/נוּ אֱלֹ֘הֵ֤י יִשְׁעֵ֗/נוּ עַל דְּבַ֥ר כְּבֽוֹד שְׁמֶ֑/ךָ וְ/הַצִּילֵ֥/נוּ וְ/כַפֵּ֥ר עַל חַ֝טֹּאתֵ֗י/נוּ לְמַ֣עַן שְׁמֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/009.yaml
  text: Help us[a], God of our salvation, for the glory of your name[b]; deliver us and atone for our sins for your name’s sake.
translation:
  language: zh_hans
  text: 拯救我们的神啊，求你因你名的荣耀[a]帮助我们；求你搭救我们，为你名的缘故，为我们的罪施行赎罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为了你名的荣耀”。
    reason: 原文介词短语既可强调行动的根据，也可强调行动的目的或所维护的尊荣。
  - marker: b
    text: 或译：“为我们的罪赎罪”。原文动词具有“赎罪”的含义，不只是“赦免”。
    reason: 保留 כפר 的赎罪语义，并提示较为简洁的表达。
lexical_decisions:
- source_word: עָזְרֵנוּ
  choice: 帮助我们
  rationale: 这是带第一人称复数宾语后缀的命令式；“帮助我们”直接、自然，也保留了祈求的迫切感。
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: 拯救我们的神
  rationale: 原文直译为“我们救恩的神”，表达神是救恩的源头；“拯救我们的神”在现代汉语中更自然，同时避免生硬的名词属格结构。
- source_word: עַל דְּבַר כְּבוֹד שְׁמֶךָ
  choice: 因你名的荣耀
  rationale: עַל דְּבַר 在这里表示行动的根据或动因；译为“因”简洁自然，并分别保留“名”和“荣耀”两个概念。
- source_word: וְהַצִּילֵנוּ
  choice: 搭救我们
  rationale: נצל 的使役式在此意为救出、解救；“搭救”既符合诗篇祈祷的语体，也避免与前面的“拯救我们的神”完全重复。
- source_word: וְכַפֵּר עַל
  choice: 赎去
  rationale: כפר 与 עַל 连用，含有赎罪、除去罪责之意。“赎去”比单译“赦免”更能保留赎罪语义，又比“施行赎罪”更符合自然汉语。
- source_word: חַטֹּאתֵינוּ
  choice: 我们的罪
  rationale: 原文为带第一人称复数后缀的复数名词；汉语“我们的罪”可以自然地统摄多项罪行，无须机械标示复数。
- source_word: לְמַעַן שְׁמֶךָ
  choice: 为你名的缘故
  rationale: 这是以神的名，即他的品格与声誉，为祈求根据的惯用表达；此译保留了原文的动机从句。
theological_decisions:
- issue: 忏悔祈求中 כפר 的译法
  choice: 赎去我们的罪
  alternative: 赦免我们的罪；为我们的罪赎罪
  rationale: 原文动词不只表示宽恕，还带有赎罪、处理罪责的分量。“赎去”保留这一神学张力，却不引入原文未说明的具体赎罪机制。
- issue: 以神的名为行动根据的双重表达
  choice: 因你名的荣耀……为你名的缘故
  alternative: 为了你荣耀的名……因你的名
  rationale: 本节两次诉诸神的名，第一次同时提到“荣耀”，第二次直接说“为你名的缘故”。译文保留两处呼应而不将其合并，也不把祈求建立在人的功德上。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“拯救我们的神啊”保留呼告语气；两个“求你”使并列命令式在汉语中清楚自然。“赎去”略带礼仪和神学色彩，配合脚注说明，以兼顾可读性与原文分量。
