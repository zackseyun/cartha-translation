  text: וְ/הָ֘שֵׁ֤ב לִ/שְׁכֵנֵ֣י/נוּ שִׁ֭בְעָתַיִם אֶל חֵיקָ֑/ם חֶרְפָּ֘תָ֤/ם אֲשֶׁ֖ר חֵרְפ֣וּ/ךָ אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/012.yaml
  text: And repay to our neighbors sevenfold into their lap the reproach with which they reproached you[b][a], O Lord.
translation:
  language: zh_hans
  text: 主啊，求你使我们的邻邦用来羞辱你的辱骂，七倍归到他们怀中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归到他们怀中”是希伯来语的形象说法，指使他们对你所施的羞辱回到他们自己身上；“七倍”也可译作“七次”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָשֵׁב
  choice: 求你……归到
  rationale: 使役命令式的基本意象是“使之返回”；在祈祷语境中用“求你”表达命令式的恳求语气，用“归到”保留羞辱回到施辱者身上的图像。
- source_word: לִשְׁכֵנֵינוּ
  choice: 我们邻邦
  rationale: 该词本义为住在近旁者；本诗是民族性哀歌，语境所指很可能是周围各族或国家。“邻邦”既自然，也避免误解为个别邻居。
- source_word: שִׁבְעָתַיִם
  choice: 七倍
  rationale: 表示“七倍”或“七次”，在这里强调充分、加重的报应；“七倍”简洁且符合诗歌语体。
- source_word: אֶל חֵיקָם
  choice: 归到他们怀中
  rationale: חֵיק指胸怀、怀中；此处的希伯来语意象是让所行之事回落到本人怀里。“怀中”保留原有身体隐喻。
- source_word: חֶרְפָּתָם אֲשֶׁר חֵרְפוּךָ
  choice: 羞辱你的话
  rationale: 名词与动词同源，意为羞辱、辱骂。汉语若机械重复“他们羞辱你的羞辱”不自然，因此以“羞辱你的话”传达言语性侮辱，同时保持对象是神。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 神圣称号，且在句中是直接呼告；“主啊”符合现代汉语祷告与诗歌语体。
theological_decisions:
- issue: 咒诅性祈求及报应强度
  choice: 直接保留求主使羞辱七倍归回敌对者的祈求
  alternative: 弱化为求神主持公义或制止羞辱
  rationale: 原文明确祈求神施行加重的回报。译文不把这种张力抽象化为一般的公义诉求，也不替经文缓和其措辞。
translation_notes:
  register: 采用现代、庄重的祷告诗体。“邻邦”体现民族哀歌的群体语境；保留“怀中”的希伯来意象，并以脚注说明其含义。
