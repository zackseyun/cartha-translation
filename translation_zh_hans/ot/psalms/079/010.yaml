base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/010.yaml
  text: Why should the nations say[b][a], “Where is their God?” Let the vengeance of your servants' shed blood be made known among the nations before our eyes.
translation:
  language: zh_hans
  text: 为什么让列国说：“他们的上帝在哪里？”愿你为仆人所流之血施行的报仇，在列国中、在我们眼前显明出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ
  choice: 为什么容……说
  rationale: לָמָּה引出抗议性的反问；结合祈求语境，“为什么容……说”比直译“为什么说”更自然，并表达诗人求上帝不再容许列国讥诮的语气。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 指以色列以外的各国；“列国”符合诗篇语体，又不带入后期宗教族群术语。
- source_word: אַיֵּה אֱלֹהֵיהֶם
  choice: 他们的上帝在哪里
  rationale: 保留列国直接而讥讽的问话；“上帝”所指是以色列的上帝。
- source_word: יִוָּדַע
  choice: 得以伸雪
  rationale: 原词为被动式“被知道／显明”；与后面的“报仇”结合，译为“得以伸雪”自然表达这报应借公开行动而显明。其较形式对应的结构在脚注中保留。
- source_word: בַגּוֹיִם לְעֵינֵינוּ
  choice: 在列国中、在我们眼前
  rationale: 分别保留行动公开显于列国之中，以及祈求者亲眼见证的含义。顿号帮助读者把两个介词短语都理解为修饰伸冤行动。
- source_word: נִקְמַת
  choice: ……的仇……伸雪
  rationale: נקמה明确表示报仇、惩罚性报应；中文用“仇……伸雪”保留其强烈的申冤报仇意味，而不淡化为泛泛的“公义”。
- source_word: דַּם עֲבָדֶיךָ הַשָּׁפוּךְ
  choice: 你仆人所流之血
  rationale: “血”表示仆人遭暴力杀害；“所流之血”以凝练而庄重的中文表达被倾倒、被流出的血。
theological_decisions:
- issue: 求上帝报仇的咒诅性祈求
  choice: 保留“仇……伸雪”的明确祈求
  alternative: 求你为仆人所流的血主持公道
  rationale: 希伯来文נקמה明确指报仇或惩罚性的报应；若只译为“主持公道”，会削弱本节真实的神学张力。
- issue: “在我们眼前”的句法关系
  choice: 使其修饰公开发生的伸冤报仇
  alternative: 将其紧接于“你仆人所流之血的仇”
  rationale: 原文词序存在一定句法弹性；正文按自然中文表达诗人求亲眼看见上帝在列国中施行报应，脚注保留更贴近形式的另一种表达。
- issue: יִוָּדַע的被动含义
  choice: 以“得以伸雪”表达报仇行动被公开显明
  alternative: 愿……的报仇在列国中、在我们眼前显明出来
  rationale: 正文优先采用自然中文，但不把“显明”的被动语义理解为单纯的信息告知，而是上帝报仇行动成为可见事实。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈祷语体。“列国”“所流之血”略带经文庄重感，但仍为现代读者所理解；正文保留反问、讥诮与求报仇的张力。
