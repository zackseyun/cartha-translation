  yaml_path: translation/ot/psalms/079/004.yaml
  text: We have become a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: zh_hans
  text: '我们成了邻国眼中的耻辱，

    成了周围之人嘲笑和讥讽的对象。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִינוּ
  choice: 我们成了
  rationale: Qal完成式第一人称复数在此表达先前灾难所造成、延续至今的状态；“成了”在现代汉语中自然地兼顾状态转变及其结果。
- source_word: חֶרְפָּה
  choice: 羞辱
  rationale: 该名词既可指公开的耻辱，也可指受人鄙视、辱骂的对象；“成了……的羞辱”保留其关系性和哀歌中的受辱意味。
- source_word: לִשְׁכֵנֵינוּ
  choice: 邻国
  rationale: שׁכן指邻近者；本诗关乎列国侵入及周边群体的讥笑，译作“邻国”比日常个体意义的“邻居”更符合民族性语境。
- source_word: לַעַג
  choice: 嘲笑
  rationale: 该词表示带有轻蔑意味的嘲弄；“嘲笑”通俗自然，并维持与下一个羞辱词汇的并列。
- source_word: קֶלֶס
  choice: 讥讽
  rationale: 该词与לַעַג语义相近而不完全相同，含讥笑、奚落之意；“讥讽”保留希伯来诗句叠加强化羞辱的表达。
- source_word: לִסְבִיבוֹתֵינוּ
  choice: 四围之人
  rationale: 原文指在我们周围者；“四围之人”简洁庄重，也保持其范围比前句“邻国”更宽泛的可能性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；两行均用“成了”呈现平行结构和结果状态。“羞辱”略带浓缩的诗性，避免把原文明确化为单纯的主观羞耻或某一具体辱骂行为。
