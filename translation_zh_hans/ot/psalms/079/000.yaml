base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/000.yaml
  text: A psalm of Asaph. God[a], nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem into ruins.
translation:
  language: zh_hans
  text: '亚萨的诗。


    上帝啊，列国进入了你的产业，玷污了你的圣殿，使耶路撒冷成为废墟。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使耶路撒冷成为一堆堆废墟。”
    reason: 希伯来语使用复数名词，可突出成堆瓦砾或多处废墟的景象。
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: 亚萨的诗
  rationale: לְ 可表示归属、作者关系或相关关系；“亚萨的诗”简洁自然，同时不进一步限定具体关系。
- source_word: גוֹיִם
  choice: 列国
  rationale: 该词为复数，指外邦诸国或各民族；“列国”符合诗歌语体，又不额外限定其身份。
- source_word: נַחֲלָתֶךָ
  choice: 你的产业
  rationale: נַחֲלָה 可指产业、基业或所分得的领地；“产业”保留其归属和承受之物的含义，且不武断限定为土地、人民或圣城。
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: 你的圣殿
  rationale: 字面为“你圣洁的殿”；在此语境中指耶路撒冷圣所，“圣殿”是准确、自然的现代汉语表达。
- source_word: לְעִיִּים
  choice: 成为废墟
  rationale: עִיִּים 为复数，可指废墟或瓦砾堆；正文采用自然的集合性表达，脚注保留复数意象。
theological_decisions:
- issue: “你的产业”所指范围
  choice: 保留“你的产业”这一宽泛表达
  alternative: 译作“你的土地”或“你的子民”
  rationale: 原文可唤起土地、圣城及立约子民等多重关联，正文不将其缩窄为单一对象。
- issue: 亚萨与本诗的关系
  choice: 译作“亚萨的诗”
  alternative: “亚萨所作的诗”或“献给亚萨的诗”
  rationale: 标题中的 לְ 具有一定语义弹性；采用不明确断定作者身份的常用表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。保留短句的哀诉力度，并避免以“入侵”等词把原文“进入”所蕴含但未明说的敌对性质过度明示。
