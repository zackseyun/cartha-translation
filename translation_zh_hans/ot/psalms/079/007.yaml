  text: כִּ֭י אָכַ֣ל אֶֽת יַעֲקֹ֑ב וְֽ/אֶת נָוֵ֥/הוּ הֵשַֽׁמּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/007.yaml
  text: For they have devoured Jacob and laid waste his dwelling place[a].
translation:
  language: zh_hans
  text: 因为他们吞噬了雅各，使他的居所荒凉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他们吞吃了雅各，使他的住处荒废。”
    reason: 词义替代：אָכַל可较直译为“吞吃”，נָוֶה可译“住处”，הֵשַׁמּוּ也可表达为“使……荒废”。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明祈求审判的理由；“因为”在现代汉语中自然地保留因果或解释作用。
- source_word: אָכַל
  choice: 吞噬了
  rationale: 原义为“吃”，此处描写敌国毁灭百姓，采用“吞噬”既保留强烈比喻，也传达暴力侵害的意味。
- source_word: אֶת יַעֲקֹב
  choice: 雅各
  rationale: 保留希伯来诗歌中的盟约名称，不直接释为“以色列”或“雅各的后裔”。
- source_word: נָוֵהוּ
  choice: 他的居所
  rationale: 该词可指住所、居住之地或牧场；此处以后缀“他的”回指雅各，译为“居所”既自然，也不把所指限定为圣殿。
- source_word: הֵשַׁמּוּ
  choice: 使……荒凉
  rationale: 使役词形表达造成荒废、凄凉；“使他的居所荒凉”准确保留句法和诗意。
theological_decisions:
- issue: “他的居所”的所指
  choice: 宽泛理解为雅各／以色列的居住之地
  alternative: 专指圣殿或圣所；或泛指全地
  rationale: 后缀最自然地回指“雅各”。全诗语境容许联想到圣殿，但本分句本身并未要求把含义限定于圣殿，因此保留较宽泛的表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“吞噬”保留原文暴烈的进食隐喻；“雅各”保留诗歌称谓；“居所”避免无根据地将所指缩窄为圣殿。脚注标记已在正文中对应出现。
