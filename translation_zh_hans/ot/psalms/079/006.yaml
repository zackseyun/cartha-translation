  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שְׁפֹ֤ךְ חֲמָתְ/ךָ֨ אֶֽל הַ/גּוֹיִם֮ אֲשֶׁ֪ר לֹא יְדָ֫ע֥וּ/ךָ וְ/עַ֥ל מַמְלָכ֑וֹת אֲשֶׁ֥ר בְּ֝/שִׁמְ/ךָ֗ לֹ֣א קָרָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/006.yaml
  text: Pour out your wrath on the nations that do not know you[b][a], and on the kingdoms that do not call on your name.
translation:
  language: zh_hans
  text: 求你把烈怒倾倒在不认识你的列国身上[a]，也倾倒在不求告你名的各王国身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不承认你的。”希伯来语“认识”可指关系上的认识和承认，不只是知道有关你的事。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不呼求你名的。”希伯来语“求告……的名”是向神祈求或敬拜的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: 倾倒
  rationale: 保留“倒出”烈怒的鲜明意象；在现代汉语中，“倾倒”与“烈怒”搭配庄重而自然。
- source_word: חֲמָתְךָ
  choice: 你的烈怒
  rationale: חֵמָה指强烈、如火燃烧的愤怒；“烈怒”既表达强度，也符合诗篇祈求审判的语域。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 这里指以色列之外的各民族或国家；“列国”简洁地保留诗歌语体，也避免“外邦人”可能带入的后期术语色彩。
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: 不认识你的
  rationale: יָדַע不仅可指认知，也可包含关系上的认识和承认；正文保留“认识”，不把含义收窄为单纯“不承认”或“不敬拜”。
- source_word: מַמְלָכוֹת
  choice: 各王国
  rationale: מַמְלָכוֹת指政治性的国度或王国；“各王国”准确，并与前面的“列国”构成平行。
- source_word: אֲשֶׁר בְּשִׁמְךָ לֹא קָרָאוּ
  choice: 不求告你名的
  rationale: קרא בשם是向神呼求、祷告或敬拜的惯用表达；“求告你名”保留原文宗教性习语，同时为现代读者所能理解。
theological_decisions:
- issue: 列国“不认识”神的含义
  choice: 正文译作“不认识你的”
  alternative: “不承认你的”或“不敬拜你的”
  rationale: 原文的“认识”可能包含关系上的承认，但并未只限定为敬拜行为。保留较宽的表达，既维持神学张力，也让下一分句“不求告你名”另行表达祷告和敬拜层面。
- issue: “求告神名”的范围
  choice: 保留“不求告你名”这一习语
  alternative: “不向你祷告”或“不敬拜你”
  rationale: 原文习语可涵盖呼求、祷告和敬拜；若只译成其中一种，会不必要地缩窄含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈祷语体。“求你”使希伯来语命令式在汉语祷告中自然呈现；重复“倾倒在……身上”以清楚保留两组对象的平行结构。
