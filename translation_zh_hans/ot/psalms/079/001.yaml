base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/001.yaml
  text: A psalm of Asaph. O God[a], the nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem a heap of ruins.
translation:
  language: zh_hans
  text: 亚萨的诗。上帝啊，列国进入了你的产业，玷污了你的圣殿，使耶路撒冷沦为废墟[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使耶路撒冷成为一堆堆废墟。”
    reason: 希伯来文 עִיִּים 是复数，可理解为“废墟”或更具体的“废墟堆”；正文采用自然简洁的表达，脚注保留其复数意象。
lexical_decisions:
- source_word: מִזְמוֹר
  choice: 诗
  rationale: 这是诗篇标题中常见的体裁用语；译作“诗”简洁自然，也符合汉语圣经诗歌标题的语体。
- source_word: לְאָסָף
  choice: 亚萨的
  rationale: 介词 לְ 在诗篇标题中可表示作者、归属或关联；“亚萨的”保留这种关联性，不进一步断定具体关系。
- source_word: אֱלֹהִים
  choice: 上帝啊
  rationale: 此处是哀歌中的直接呼告；“啊”自然表达希伯来文虽无呼格词却具有的呼语功能。
- source_word: בָּאוּ גוֹיִם
  choice: 列国侵入了
  rationale: בָּאוּ 本义为“来了、进入了”；结合介词 בְּ 和敌国亵渎、毁坏的语境，“侵入”以自然汉语表达其进入上帝产业的敌对性质。
- source_word: בְּנַחֲלָתֶךָ
  choice: 你的产业
  rationale: נַחֲלָה 可指承受所得并归属上帝的土地或子民；“产业”保留其盟约和归属含义，不将所指限定为土地或人民。
- source_word: טִמְּאוּ
  choice: 玷污了
  rationale: 该词具有礼仪上使之不洁、亵渎圣物的含义；“玷污”兼顾宗教语义与现代可读性。
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: 你的圣殿
  rationale: הֵיכָל 在这里指圣殿建筑，קָדְשֶׁךָ 表明其为上帝神圣的殿；“你的圣殿”是准确自然的表达。
- source_word: שָׂמוּ אֶת־יְרוּשָׁלִַם לְעִיִּים
  choice: 使耶路撒冷沦为废墟
  rationale: שׂוּם 与表示结果的 לְ 连用，有“使成为”之意；“沦为废墟”自然传达城市遭毁后的结果。
theological_decisions:
- issue: “你的产业”的盟约含义及指称范围
  choice: 保留“你的产业”
  alternative: 你的土地／你的子民
  rationale: 原文没有明确将 נַחֲלָה 限定为土地或人民；保留较宽泛的“产业”，可同时唤起上帝所拥有的土地和子民，不替经文消除其含义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。标题简洁；正文保留哀歌的直接呼告和三重灾难陈述。标点按现代汉语处理，脚注标记紧接其所说明的“废墟”。
