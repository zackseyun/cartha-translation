  yaml_path: translation/ot/psalms/079/003.yaml
  text: They have poured out their blood like water all around Jerusalem[a], and there is no one to bury them.
translation:
  language: zh_hans
  text: 他们把你仆人和忠信者的血像水一样倾倒在耶路撒冷四围[a]，也无人埋葬他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们在耶路撒冷四围流了你仆人和忠信者的血，如同水一样。”
    reason: 原文动词可译为“倾倒”，以保留与“水”的比喻；在血的语境中也可译为“流（血）”或“倾流”。
lexical_decisions:
- source_word: שָׁפְכוּ
  choice: 倾倒
  rationale: 该词为完成式，描写已经发生的暴行；“倾倒”保留了原文与下文“像水一样”相呼应的鲜明意象。
- source_word: דָמָם
  choice: 你众仆人的血
  rationale: 原文直译为“他们的血”，其所指承接上一节的“你仆人的尸首”。为避免现代汉语中主语和领属语都用“他们”造成误解，正文明确复现其先行词，但不把“血”解释为较具诠释性的“生命”。
- source_word: כַמַּיִם
  choice: 像水一样
  rationale: 前缀 כ 表示比较；“像水一样”是自然的现代汉语，也保留原诗的比喻。
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: 在耶路撒冷四围
  rationale: “四围”准确表达城市周边各处的空间范围，并保持庄重、凝练的诗体语感。
- source_word: וְאֵין קוֹבֵר
  choice: 也无人埋葬他们
  rationale: אין 与分词 קוֹבֵר 构成否定存在表达，意为“没有埋葬者”。汉语补出从上下文可知的宾语“他们”，使句意完整自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“倾倒”保留原文强烈而具体的意象；“四围”较凝练，适合诗篇语体。为消除汉语“他们把他们的血”可能造成的指代混乱，依据紧邻上文将领属代词明确为“你众仆人的”。
