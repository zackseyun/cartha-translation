  text: נָֽתְנ֡וּ אֶת נִבְלַ֬ת עֲבָדֶ֗י/ךָ מַ֭אֲכָל לְ/ע֣וֹף הַ/שָּׁמָ֑יִם בְּשַׂ֥ר חֲ֝סִידֶ֗י/ךָ לְ/חַיְת/וֹ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/002.yaml
  text: They have given the corpses of your servants as food to the birds of the heavens[b][a], the flesh of your faithful ones to the beasts of the earth.
translation:
  language: zh_hans
  text: 他们把你仆人的尸体交给天空的飞鸟作食物，把你忠信之人[a]的肉交给地上的野兽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的圣民”或“你的虔诚人”。希伯来语此词可指以盟约忠诚委身于上帝的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְנוּ
  choice: 他们把……给……作
  rationale: 该词为Qal完成式第三人称复数，表示敌人已经做成的事；汉语在哀歌叙述中用“把”字句自然呈现其完成的恶行，无须另加时态助词。
- source_word: נִבְלַת
  choice: 尸体
  rationale: 准确表达死者的遗体，并保留无人安葬、任其受辱的惨烈意象；比“尸首”更符合现代标准普通话。
- source_word: עֲבָדֶיךָ
  choice: 你仆人的
  rationale: 在诗篇对上帝的称呼中，“仆人”自然表达归属和事奉关系，不突出法律意义上的奴隶身份。
- source_word: מַאֲכָל
  choice: 作食物
  rationale: 表达尸体被交给飞鸟吞食的用途，简洁自然，并对应希伯来语的谓语性用法。
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: 给天空的飞鸟
  rationale: עוֹף在此作集合意义，译为“飞鸟”自然；הַשָּׁמַיִם在本语境指鸟类活动的天空，译为“天空”既贴合意象，也避免“诸天”可能带来的非必要宇宙论色彩。
- source_word: בְּשַׂר
  choice: 肉
  rationale: 保留原文具体而刺目的肉身意象，并与前半句“尸体”形成诗性平行。
- source_word: חֲסִידֶיךָ
  choice: 你忠信之人的
  rationale: חסיד指以忠贞、委身回应上帝的人；“忠信之人”既表达盟约忠诚的意味，又不引入后期宗教术语的技术含义。
- source_word: לְחַיְתוֹ אָרֶץ
  choice: 给地上的野兽
  rationale: חיה在此指吞食尸体的野生动物；“野兽”凝练且具有庄重的诗歌语体，并与“天空的飞鸟”平行。
theological_decisions:
- issue: 如何翻译盟约性称谓 חֲסִידֶיךָ
  choice: 你忠信之人
  alternative: 你的圣民／你的虔诚人
  rationale: 该词兼有对上帝忠贞、蒙受慈爱并委身于他的含义。“忠信之人”保留其盟约忠诚的核心，同时以脚注呈现“圣民”“虔诚人”等真实可能，避免将其固定为后期教会术语。
translation_notes:
  register: 采用现代、庄重而清晰的诗歌语言。保留“尸体”“肉”的强烈身体意象，以及“天空的飞鸟／地上的野兽”的平行结构。脚注标记紧随“忠信之人”，正文与脚注对应完整。
