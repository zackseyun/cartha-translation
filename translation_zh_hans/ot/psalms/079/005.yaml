  yaml_path: translation/ot/psalms/079/005.yaml
  text: How long[a], O Yahweh? Will you be angry forever? Will your jealousy burn like fire?
translation:
  language: zh_hans
  text: 雅威啊，你要发怒到几时呢？你会永远发怒吗？你的嫉妒[a]会像火一样燃烧吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“热忱”。希伯来词 קִנְאָה 可表示“嫉妒”或“热忱”。
    reason: 该词具有“嫉妒”与“热忱／热心”的可行语义范围；脚注保留此处不宜消除的词义张力。
lexical_decisions:
- source_word: עַד מָה
  choice: 要到几时呢
  rationale: 这是哀歌中询问苦难将持续多久的惯用表达；此译自然地传达迫切诘问的语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，不以“主”这一称号替代。
- source_word: תֶּאֱנַף
  choice: 发怒
  rationale: 准确表达 אנף 所指的愤怒，同时避免用“震怒”等词无根据地强化语气。
- source_word: לָנֶצַח
  choice: 永远
  rationale: 在哀歌语境中，诗人诘问上帝的怒气是否会无休止地持续。
- source_word: תִּבְעַר
  choice: 燃烧
  rationale: 保留 בער 的燃烧意象，并与后面的火之比喻自然衔接。
- source_word: כְּמוֹ אֵשׁ
  choice: 如火
  rationale: 简洁而直接地保留原文的明喻。
- source_word: קִנְאָתֶךָ
  choice: 你的嫉妒
  rationale: קִנְאָה 可指嫉妒，也可指热忱；“嫉妒”在此保留上帝因圣约关系而有的强烈排他性，而脚注列出另一种可行译法。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”是现代汉语中较贴近通行学术重构读音的音译，保留其作为专名而非称号的性质。
- issue: 如何理解用于上帝的 קִנְאָה
  choice: 嫉妒
  alternative: 热忱
  rationale: 上下文将该词与上帝的怒气及燃烧之火相连，“嫉妒”较鲜明地保留圣约关系中的排他性；但原词也确可表示“热忱”，故以脚注保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“要到几时呢”保留迫切申诉的语气；连续两个问句依照希伯来文的修辞推进。
