  text: תָּ֤ב֣וֹא לְ/פָנֶי/ךָ֮ אֶנְקַ֪ת אָ֫סִ֥יר כְּ/גֹ֥דֶל זְרוֹעֲ/ךָ֑ ה֝וֹתֵ֗ר בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/011.yaml
  text: Let the groaning of the prisoner come before you; according to the greatness of your arm[a], preserve the children of death.
translation:
  language: zh_hans
  text: 愿被囚之人的呻吟来到你面前；求你按你膀臂的大能，保全那些将死的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“死亡之子”，是指面临死亡、受死亡威胁或被定要死的人。
    reason: 保留希伯来习语的字面意象及其语义范围，避免将其限定为宿命性“注定”或某一特定司法处境。
lexical_decisions:
- source_word: תָּבוֹא לְפָנֶיךָ
  choice: 愿……达到你面前
  rationale: 未完成式在祷告中带祈愿语气；“达到你面前”自然表达呼求进入上帝垂听范围的空间与关系意象。
- source_word: אֶנְקַת אָסִיר
  choice: 被囚之人的呻吟
  rationale: אֶנְקָה指痛苦中可听见的叹息或呻吟；אָסִיר指被拘禁者。此译保留单数集合表达，并避免把处境限定为军事俘虏。
- source_word: כְּגֹדֶל זְרוֹעֲךָ
  choice: 按你膀臂的大能
  rationale: כְּגֹדֶל表示以某种广大程度为尺度；“膀臂”保留希伯来文以肢体象征力量的具体意象，“大能”传达גֹדֶל在此处所强调的强大程度。
- source_word: הוֹתֵר
  choice: 保全
  rationale: יתר的使役式命令语气在此是求上帝使人存留、不致死亡；“保全”简洁涵盖“留下活命、饶过”的含义。
- source_word: בְּנֵי תְמוּתָה
  choice: 那些注定要死的人
  rationale: 字面为“死亡之子”，是表示受死亡威胁、面临死刑或必死处境的希伯来习语；正文采用现代汉语易懂的意义表达，字面形式收入脚注。
theological_decisions:
- issue: בְּנֵי תְמוּתָה是否表示上帝预定其死亡
  choice: 译为“那些注定要死的人”，按处境性习语理解，不明确指定是谁作出判决或命定
  alternative: “被判死刑的人”或“死亡之子”
  rationale: 原文强调他们处在死亡权势或必死结局之下，却未说明判决主体；避免擅自加入司法背景或特定预定论含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿……；求你……”呈现诗篇祷告的恳求语气；保留“膀臂”的圣诗性具体意象，同时用“大能”使其意义清楚。
