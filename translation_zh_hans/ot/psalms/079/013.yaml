source:
  edition: WLC
  text: וַ/אֲנַ֤חְנוּ עַמְּ/ךָ֨ וְ/צֹ֥אן מַרְעִיתֶ/ךָ֮ נ֤וֹדֶ֥ה לְּ/ךָ֗ לְ/ע֫וֹלָ֥ם לְ/דֹ֥ר וָ/דֹ֑ר נְ֝סַפֵּ֗ר תְּהִלָּתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/013.yaml
  text: But we[a], your people and the sheep of your pasture, will give thanks to you forever[b]; from generation to generation we will recount your praise.
translation:
  language: zh_hans
  text: 但我们是你的子民，是你草场上的羊；我们要永远称谢你，世世代代述说对你的赞美。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: 但我们
  rationale: 连词加独立代词在此承接前文，并突出受灾的列国与属神群体之间的对照；“但我们”自然表达这一转折。
- source_word: עַמְּךָ
  choice: 你的子民
  rationale: 这是以色列与神关系中的常见表达；“子民”在现代中文中庄重而自然，也能体现归属关系。
- source_word: וְצֹאן מַרְעִיתֶךָ
  choice: 是你草场上的羊
  rationale: 保留原文“羊”和“草场”的牧养意象。第二个“是”使“你的子民”与“你草场上的羊”作为并列身份表述更符合中文句法。
- source_word: נוֹדֶה לְּךָ
  choice: 我们要……称谢你
  rationale: ידה的使役词干在此表示向神献上感谢或赞美；译作“称谢”既准确庄重，又与后半句的“赞美”保持词义区分。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 直接表达持续无尽的时间，符合诗歌中群体向神称谢的宣告。
- source_word: לְדֹר וָדֹר
  choice: 世世代代
  rationale: 这是该希伯来语习语自然、凝练的现代中文表达，体现一代接一代的延续。
- source_word: נְסַפֵּר
  choice: 述说
  rationale: ספר的加强词干可指讲述、数说；“述说”既保留反复传讲之意，又适合诗歌语体。
- source_word: תְּהִלָּתֶךָ
  choice: 对你的赞美
  rationale: 该名词既可指向神发出的赞美，也可能指值得赞美的事。正文采用自然的对象性理解，同时不扩写成“可称颂的作为”。
theological_decisions:
- issue: 神子民的牧养隐喻
  choice: 明确保留“你草场上的羊”
  alternative: 你的羊群
  rationale: 原文同时称群体为神的子民和他草场上的羊。保留“羊”与“草场”维持约的归属和牧者照料的意象，不引入后来的教义解释。
- issue: תְּהִלָּתֶךָ所指
  choice: 对你的赞美
  alternative: 你可称颂的作为
  rationale: 原词可表示献给神的赞美，也可含被赞颂的内容。正文选择与平行句自然衔接的“对你的赞美”，但不把意义限定为某类具体作为。
translation_notes:
  register: 采用现代、庄重且适合会众诵读的简体中文。“称谢”略带诗体色彩，但普通读者易懂；分号保留两个诗行之间的平行推进。原文在本节并无必须以脚注标出的文本异文；英文咨询层的脚注标记与其实际脚注内容似有错位，因此未照搬。
