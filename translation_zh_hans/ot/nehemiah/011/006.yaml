base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/006.yaml
  text: All the sons of Perez who lived in Jerusalem were four hundred sixty-eight valiant men[a].
translation:
  language: zh_hans
  text: 住在耶路撒冷的法勒斯子孙，共有四百六十八人，都是勇士[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有能力的人”。希伯来语这一短语可指以力量、才干或英勇见称的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: 共……都是
  rationale: 结合总数句式表达全体范围；“共”引出总数，“都是”表明这四百六十八人全属后述类别，符合现代汉语名册体表达。
- source_word: בְּנֵי פֶרֶץ
  choice: 法勒斯子孙
  rationale: בְּנֵי 字面为“儿子们”，但在族谱和居民名册中指后裔群体；译作“子孙”既保留亲属谱系色彩，也避免误解为法勒斯的直接儿子。
- source_word: הַיֹּשְׁבִים
  choice: 住在
  rationale: ישׁב 的分词在定居语境中表示居住；“住在”自然、简洁，适合现代汉语。
- source_word: בִּירוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 按标准中文圣经地名译法处理，介词 בְּ 由“在”表达。
- source_word: אַרְבַּע מֵאוֹת שִׁשִּׁים וּשְׁמֹנָה
  choice: 四百六十八人
  rationale: 以中文数字完整写出希伯来文基数，并补量词“人”，使名册统计句自然清楚。
- source_word: אַנְשֵׁי חָיִל
  choice: 勇士
  rationale: 该短语可指以力量、才干或英勇见称的男子；“勇士”简洁保留赞许和勇武意味，脚注说明其较宽的语义范围。
