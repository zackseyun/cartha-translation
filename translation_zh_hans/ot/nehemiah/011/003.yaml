source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ רָאשֵׁ֣י הַ/מְּדִינָ֔ה אֲשֶׁ֥ר יָשְׁב֖וּ בִּ/ירוּשָׁלִָ֑ם וּ/בְ/עָרֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ אִ֤ישׁ בַּ/אֲחֻזָּת/וֹ֙ בְּ/עָ֣רֵי/הֶ֔ם יִשְׂרָאֵ֤ל הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֣ם וְ/הַ/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֥י שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/003.yaml
  text: 'These are the heads of the province who lived in Jerusalem[a]. But in the cities of Judah, each man lived in his own possession in their cities: Israel, the priests, the Levites, the temple servants[b], and the descendants of Solomon’s servants.'
translation:
  language: zh_hans
  text: 这些是住在耶路撒冷的本省首领。至于犹大各城，以色列[a]、祭司、利未人、殿役[b]和所罗门仆人的后代，各人都住在自己的产业上，在各自的城里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希伯来文直译为“以色列”，在这里可能是名单中的集合称谓。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“尼提宁”，指被指派承担圣殿事务的一类人。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַמְּדִינָה
  choice: 本省首领
  rationale: רָאשֵׁי是表示领导者的“头领、首领”；הַמְּדִינָה在波斯时期指行政省。“本省首领”既体现历史行政背景，也符合现代汉语表达。
- source_word: אֲשֶׁר יָשְׁבוּ בִּירוּשָׁלִָם
  choice: 住在耶路撒冷的
  rationale: יָשַׁב在此人口与定居名录的语境中表示居住；“住在”自然、准确，不额外强调迁居或定居过程。
- source_word: וּבְעָרֵי יְהוּדָה יָשְׁבוּ
  choice: 至于犹大各城……住在
  rationale: 句首连接词在此转向耶路撒冷以外的犹大诸城。“至于”清楚表达话题转换，而不把连接词强化为绝对对立。
- source_word: אִישׁ
  choice: 各人
  rationale: 单数אִישׁ在此作分配用法，意为群体中的每一个人；“各人”保留分配意义，在中文中也比“各男人”自然。
- source_word: בַּאֲחֻזָּתוֹ
  choice: 在自己的产业上
  rationale: אֲחֻזָּה指所持有、往往可世袭的土地产业。“产业”保留土地占有与家族份地的含义，“在……上”也表明实际居住于该地。
- source_word: בְּעָרֵיהֶם
  choice: 在各自的城里
  rationale: 第三人称复数后缀表示这些群体各自所属的城镇；“各自的城里”清楚保留其分配关系。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文使用无冠词的专名יִשְׂרָאֵל，可能作为集合称谓列在各群体之首。正文保留“以色列”，不直接替原文判定为“以色列人”。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 这是כֹּהֵן复数的常规、明确译法。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是לֵוִי群体名称的标准中文译法。
- source_word: הַנְּתִינִים
  choice: 殿役
  rationale: 该词指被指派承担圣殿事务的一类人。“殿役”简洁表达其制度性服役身份；脚注保留音译可能。
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  choice: 所罗门仆人的后代
  rationale: בְּנֵי在群体名录中可泛指后裔，不限于第一代亲生儿子；“后代”准确体现延续的家族群体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。调整语序，使名单中的群体明确成为“住在”的主语，同时保留“自己的产业”和“各自的城”这两个原文地点成分。脚注标记均置于所说明的词语之后。
