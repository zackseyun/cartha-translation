  language: zh_hans
  text: 殿役[a]住在俄斐勒；西哈和基斯帕管理殿役。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“殿役”（נְתִינִים，尼提宁）是指被指派从事圣殿服事的一类人。
    reason: 说明“殿役”作为专门制度性群体称谓的原文背景，并使脚注内容与其锚点一致。
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: 殿役
  rationale: 这是被指派从事圣殿事务之群体的专门称谓。“殿役”简明地表达其制度身份和职能；脚注保留该词作为专名“尼提宁”的可能译法。
- source_word: יֹשְׁבִים
  choice: 住在
  rationale: ישׁב的分词在此表示持续居住的状态；现代汉语用“住在”自然清楚，无须另加进行体标记。
- source_word: בָּעֹפֶל
  choice: 住在俄斐勒
  rationale: עֹפֶל在此是地名或地形名称，音译为“俄斐勒”；介词ב在汉语中按居住语境自然译作“在”。
- source_word: צִיחָא
  choice: 西哈
  rationale: 人名按希伯来语形式音译。
- source_word: גִשְׁפָּא
  choice: 基斯帕
  rationale: 人名按希伯来语形式音译。
- source_word: עַל
  choice: 管理
  rationale: 在行政语境中，עַל表示居于其上、负有管辖或监督责任；“管理”比汉语直译“在……之上”更自然，同时保留职权关系。
