    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 保留“弟兄”的字面亲属称谓；在本段名册语境中，指与前述人员同属一群体的男性成员。
- source_word: גִּבּוֹרֵי חַיִל
  choice: 英勇善战的人
  rationale: 该短语兼有勇力、胆识和军事能力之意；此译自然地传达其军事色彩，又不把它限定为某种正式军职。
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: 一百二十八名
  rationale: 准确表达人数；量词“名”符合现代汉语名册语境。
- source_word: וּפָקִיד עֲלֵיהֶם
  choice: 管理他们的是
  rationale: פָקִיד指受委派负责监督或管理的人；译文保留行政或组织管理含义，不强化为特定军职。
- source_word: זַבְדִּיאֵל
  choice: 撒巴第业
  rationale: 按常见中文圣经人名形式音译。
- source_word: בֶּן הַגְּדוֹלִים
  choice: 哈革多琳的儿子
  rationale: 正文将הַגְּדוֹלִים视为家族名或专名并音译，同时以脚注保留其可能是描述性短语的歧义。
