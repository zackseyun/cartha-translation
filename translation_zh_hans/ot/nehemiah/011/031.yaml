  text: And the sons of Benjamin were from Geba[a], Michmash, Aijah, and Bethel and its villages.
translation:
  language: zh_hans
  text: 便雅悯子孙从迦巴起，住在密抹、亚雅[a]、伯特利和伯特利所属的村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“艾”。此处希伯来文作“亚雅”（עַיָּה）；它可能与“艾”指同一地点，或是与之密切相关的地名形式。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: 便雅悯子孙
  rationale: 字面为“便雅悯的儿子们”，在此定居名单中指便雅悯支派的成员或后裔；“便雅悯子孙”既保留亲属与支派表达，也符合现代汉语圣经语体。
- source_word: מִגָּבַע
  choice: 住处从迦巴起
  rationale: 介词 מִן 表示起点；本节承接定居地点名单，补出“住处”使残略的希伯来语列表在汉语中成句，同时保留“从迦巴起”的范围含义。
- source_word: מִכְמָשׂ
  choice: 密抹
  rationale: 采用该地名在中文圣经传统中通行且易识别的译名。
- source_word: וְעַיָּה
  choice: 亚雅
  rationale: 按此处马所拉文本 עַיָּה 音译，不在正文中直接等同于“艾”；可能的地名对应关系留在脚注说明。
- source_word: וּבֵית אֵל
  choice: 伯特利
  rationale: 采用该地名在现代中文圣经中的通行译法。
- source_word: וּבְנֹתֶיהָ
  choice: 属伯特利的村庄
  rationale: 字面为“它的女儿们”，是指附属于中心城镇的卫星聚落或村庄的惯用语；明确重复“伯特利”可避免汉语代词指代含混。
