  yaml_path: translation/ot/nehemiah/011/009.yaml
  text: And Joel son of Zichri was overseer over them[a], and Judah son of Hassenuah was second over the city.
translation:
  language: zh_hans
  text: 约珥是细基利的儿子，负责管理他们；犹大是哈西努亚的儿子，负责管理这城，位居第二。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “负责管理这城，位居第二”也可译作“作管理这城的副手”或“作这城的第二位负责人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקִיד
  choice: 负责管理
  rationale: 该词指受委任承担监督或行政职责的人；译作“负责管理”在现代汉语中自然，也不把职务过度限定为军事或王室官职。
- source_word: עֲלֵיהֶם
  choice: 他们
  rationale: 与“负责管理”组合为“负责管理他们”，明确表达对前述群体的管辖关系。
- source_word: מִשְׁנֶה
  choice: 位居第二
  rationale: 该词可指居次位者或副手；“位居第二”保留原文的简练及职权性质上的开放性。
- source_word: עַל הָעִיר
  choice: 在城中
  rationale: 此处表示与该城行政管辖有关的地位；结合“位居第二”，自然表达其城市治理中的次席身份，同时避免补入原文未明说的具体官衔。
- source_word: הַסְּנוּאָה
  choice: 哈西努亚
  rationale: 作为人名按希伯来语形式音译，并将冠词成分纳入名称，以对应本节的马所拉文本。
- source_word: וְ
  choice: ；
  rationale: 首个连接词承接前文，但中文逐节呈现时无需机械译出“和”；句中连接词用分号体现并列关系，使名单叙述自然庄重。
