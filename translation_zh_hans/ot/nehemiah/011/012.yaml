base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/012.yaml
  text: And their brothers[a], doers of the work for the house, were eight hundred twenty-two; and Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah.
translation:
  language: zh_hans
  text: 他们的弟兄，就是为圣殿做工的，共八百二十二名；又有耶罗罕的儿子亚大雅，耶罗罕是毗拉利雅的儿子，毗拉利雅是暗洗的儿子，暗洗是撒迦利亚的儿子，撒迦利亚是巴施户珥的儿子，巴施户珥是玛基雅的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 原词直译为“他们的弟兄”。这里按祭司名册的语境可指同族或同属一群的祭司，但正文保留希伯来文的亲属称谓，不直接改释为“同任祭司的人”。
- source_word: עֹשֵׂי הַמְּלָאכָה לַבַּיִת
  choice: 为圣殿做工的人
  rationale: עֹשֵׂי הַמְּלָאכָה 指“做工的人”，לַבַּיִת 字面为“为这屋”。在本段祭司名册的语境中，“这屋”指圣殿；正文采用自然明确的“圣殿”，脚注保留字面信息。
- source_word: שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: 八百二十二名
  rationale: 准确表达基数，并以量词“名”配合人员统计，使现代汉语自然清楚。
- source_word: בֶּן
  choice: 是……的儿子
  rationale: 逐层保留家谱公式“某人是某人的儿子”，不在没有明确依据时泛化为“后裔”。
- source_word: עֲדָיָה / יְרֹחָם / פְּלַלְיָה / אַמְצִי / זְכַרְיָה / פַּשְׁחוּר / מַלְכִּיָּה
  choice: 亚大雅／耶罗罕／毗拉利雅／暗洗／撒迦利亚／巴施户珥／玛基雅
  rationale: 人名按现代中文圣经中较通行的音译形式处理，并保持整条谱系的次序。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“共有八百二十二名”使名册统计自然；家谱不用容易误示隔代关系的“孙子、曾孙”，而逐项重复“是……的儿子”，以忠实呈现原文结构。
