id: NEH.11.11
reference: Nehemiah 11:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שְׂרָיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖ד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/011.yaml
  text: Seraiah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub[b], leader of the house of God.
translation:
  language: zh_hans
  text: 西莱雅——希勒家的儿子，希勒家是米书兰的儿子，米书兰是撒督的儿子，撒督是米拉约的儿子，米拉约是亚希突的儿子——是神的殿[a]的主管[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神的殿”原文直译为“神的家”，指圣殿。
    reason: cultural_note
  - marker: b
    text: “主管”也可译作“领袖”或“首领”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂרָיָה
  choice: 西莱雅
  rationale: 按现代中文圣经人名的通行音译处理专名。
- source_word: בֶן
  choice: ……的儿子
  rationale: 逐层保留家谱中反复出现的父子关系；虽然该词有时可泛指后裔，本节没有充分理由将其泛化。
- source_word: נְגִיד
  choice: 主管
  rationale: 该词指被置于领导或管理职位的人；“主管”符合圣殿职务语境，又避免“统治者”可能带来的王权意味。
- source_word: בֵּית הָאֱלֹהִים
  choice: 神的殿
  rationale: 保留“神的居所”这一原文表达，同时用现代中文自然地指向圣殿；脚注注明其字面形式。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 此处所指是以色列的神，短语整体不是“众神的殿”。
theological_decisions: []
