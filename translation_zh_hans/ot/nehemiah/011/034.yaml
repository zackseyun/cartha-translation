- source_word: צְבֹעִים
  choice: 泽波音
  rationale: 这是便雅悯地区的地名，按希伯来语 Ṣəḇōʿîm 音译。“音”近似表现词尾复数形式的读音，同时避免把地名按其普通词义翻译。
- source_word: נְבַלָּט
  choice: 尼巴拉
  rationale: 这是地名，按希伯来语 Nəḇallāṭ 音译。汉语音译不以重复汉字表示辅音叠音，因此无需仿照某些英语拼法写出双辅音。
