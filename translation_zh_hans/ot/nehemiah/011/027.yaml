  text: 又住在哈萨书亚、别是巴及其村庄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“它的女儿们”，是指隶属于一座城的村庄或聚居点。
    reason: 说明希伯来语的地理习语及其字面表达。
lexical_decisions:
- source_word: וּ/בַ/חֲצַר שׁוּעָל
  choice: 又住在哈萨·书亚
  rationale: וּבַ含连接词和介词，结合本段连续列举居民住处的句法，以“又住在”自然承接上文；חֲצַר שׁוּעָל作为地名音译，不按词源译作“狐狸村”。
- source_word: וּ/בִ/בְאֵר שֶׁבַע
  choice: 别是巴
  rationale: בְּאֵר שֶׁבַע是知名地名，采用现代中文圣经读者熟悉的传统译名“别是巴”，不按可能的词源译作“七之井”或“誓约之井”；并列关系以顿号表达。
- source_word: וּ/בְנֹתֶיהָ
  choice: 和属别是巴的村庄
  rationale: בנותיה字面为“它的女儿们”，在城镇地理语境中是指附属于母城的村落或聚居点。译作“属别是巴的村庄”既传达从属关系，也明确阴性单数后缀所指的是别是巴。
