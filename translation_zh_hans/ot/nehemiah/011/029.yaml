lexical_decisions:
- source_word: וּ/בְ/עֵין רִמּוֹן
  choice: 又住在隐·临门
  rationale: וּבְ含“和/又在”之意；本节承接上文居民所住的城镇，汉语补出“住”以使句意自然。עֵין רִמּוֹן是地名，采用中文圣经传统且易辨认的音译“隐·临门”，中点表明其为复合地名。
- source_word: וּ/בְ/צָרְעָה
  choice: 琐拉
  rationale: צָרְעָה为地名，采用中文圣经中通行的音译“琐拉”。原文重复的连接词与介词在汉语并列结构中不逐一重复，以免行文生硬。
- source_word: וּ/בְ/יַרְמוּת
  choice: 耶末
  rationale: יַרְמוּת为地名，采用中文圣经中通行的音译“耶末”。其前缀וּבְ表示“和在”，在中文中由“住在……、……和……”的整体结构表达。
