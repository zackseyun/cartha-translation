base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/017.yaml
  text: And Mattaniah son of Micah[a], son of Zabdi, son of Asaph, was the head, who began the thanksgiving in prayer; and Bakbukiah was second among his brothers; and Abda son of Shammua, son of Galal, son of Jeduthun.
translation:
  language: zh_hans
  text: 玛他尼雅，米迦的儿子；米迦是撒底的儿子，撒底是亚萨的儿子。玛他尼雅是领袖，在祷告中带头称谢[a]。巴卜迦在弟兄中居第二位。还有押大，是沙母亚的儿子；沙母亚是加拉的儿子，加拉是耶杜顿的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文结构简略，也可译作“是开始祷告称谢的领袖”；较直译为“是开始之首，在祷告中称谢”。这可能表示玛他尼雅负责领起或开始称谢。
    reason: 保留רֹאשׁ הַתְּחִלָּה יְהוֹדֶה לַתְּפִלָּה这一不寻常结构在职分、次序和动作关系上的歧义。
lexical_decisions:
- source_word: רֹאשׁ
  choice: 领袖
  rationale: 这里指玛他尼雅在礼仪职分中的领导地位；“领袖”既保留其身份含义，也比直译“头”更符合现代汉语。
- source_word: הַתְּחִלָּה
  choice: 带头
  rationale: 原文名词“开始”与“领袖”相连，表达发起或领起某项礼仪行动的职分；译为“带头”较自然，同时不把具体礼仪程序说得过细。
- source_word: יְהוֹדֶה
  choice: 称谢
  rationale: ידה的使役式在圣殿敬拜语境中通常表示称谢或赞美；“称谢”保留了礼仪性的感谢含义，而不采用此处语境较不支持的“认罪”。
- source_word: לַתְּפִלָּה
  choice: 在祷告中
  rationale: 介词ל在这里可表示相关领域或场合；“在祷告中”自然地表达称谢与祷告之间的关系，又不限定为某一种仪式。
- source_word: מִשְׁנֶה
  choice: 居第二位
  rationale: 该词表示次位或副手地位；“居第二位”保留原文对次序或职级的含蓄表达，不擅自明确为正式官衔。
- source_word: מֵאֶחָיו
  choice: 在他的弟兄中
  rationale: 按原文字面保留群体亲属称谓“弟兄”，避免扩展为“利未同胞”等解释性说法。
- source_word: יְדִיתוּן
  choice: 耶杜顿
  rationale: 采用现代中文圣经传统中通行且易辨认的人名音译。
theological_decisions:
- issue: 敬拜语境中ידה的含义
  choice: 称谢
  alternative: 赞美；认罪
  rationale: 亚萨家系和礼仪职分的上下文更支持“称谢／赞美”；“称谢”能较好保留该词在祷告中的感谢意味，但这一选择属于语境判断，并非教义限定。
- issue: 玛他尼雅职分的具体性质
  choice: 是领袖，在祷告中带头称谢
  alternative: 是开始祷告称谢的首领；是领唱称谢者
  rationale: 原文结构简略且不寻常，可指领导、发起或首先进行称谢。正文表达领导和起始作用，但不把他具体定为“领唱者”，以免超出原文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。家谱链条分句展开，便于普通读者辨认人物关系；“领袖”“带头称谢”“居第二位”避免古奥官样表达，同时保持圣殿服事名单的正式语体。
