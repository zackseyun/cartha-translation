lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: 在他之后
  rationale: 该短语直译为“在他之后”。在这份居民或宗族名录中，最自然地表示登记次序；同时以脚注保留空间关系的较小可能性。
- source_word: גַּבַּי
  choice: 迦拜
  rationale: 按现代中文圣经人名音译惯例处理这一专名。
- source_word: סַלָּי
  choice: 撒来
  rationale: 按现代中文圣经人名音译惯例处理这一专名。
- source_word: תְּשַׁע מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: 九百二十八人
  rationale: 希伯来文数字为九百加二十加八，即928；补出量词“人”，使中文自然，并符合上下文统计居民人数的语境。
