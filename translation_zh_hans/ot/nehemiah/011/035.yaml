lexical_decisions:
- source_word: לֹד
  choice: 罗德
  rationale: 地名，采用现代中文圣经地名的常见音译。
- source_word: וְ/אוֹנוֹ
  choice: 、阿挪，以及
  rationale: 阿挪为地名，采用常见音译；希伯来语连接词置于阿挪之前，但本节是地名列举，中文用顿号及“以及”自然呈现并列关系。
- source_word: גֵּי
  choice: 谷
  rationale: 该词是“谷”的构造形，与后面的名词组成地名；中文按自然地名结构译为“匠人谷”。
- source_word: הַחֲרָשִׁים
  choice: 匠人
  rationale: 该复数名词可泛指工匠，也可能特指铁匠等手艺人；正文采用较宽泛的“匠人”，保留词义范围及地名性质。
