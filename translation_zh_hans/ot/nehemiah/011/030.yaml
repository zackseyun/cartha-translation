base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/030.yaml
  text: Zanoah[a], Adullam and their villages, Lachish and its fields, Azekah and its daughter towns[b]. So they camped from Beer-sheba as far as the Valley of Hinnom.
translation:
  language: zh_hans
  text: 撒挪亚、亚杜兰和它们的村庄；拉吉和它的田野；亚西加和它的附属城镇[a]。他们从别是巴直到欣嫩谷安营[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “附属城镇”原文直译为“它的女儿们”，指隶属于亚西加的村庄或城镇。
    reason: lexical_alternative
  - marker: b
    text: “安营”也可译作“扎营”；在这里也可能引申为“定居”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנֹחַ
  choice: 撒挪亚
  rationale: 地名，采用现代中文圣经语境中通行且易辨认的音译。
- source_word: עֲדֻלָּם
  choice: 亚杜兰
  rationale: 地名，按中文通行形式音译。
- source_word: חַצְרֵיהֶם
  choice: 属它们的村庄
  rationale: חָצֵר在城镇名录中通常指隶属于较大城镇的乡村聚落；复数代词指前述撒挪亚和亚杜兰。
- source_word: לָכִישׁ
  choice: 拉吉
  rationale: 地名，按中文通行形式音译。
- source_word: שְׂדֹתֶיהָ
  choice: 属它的田野
  rationale: 保留שָׂדֶה“田野、田地”的具体意象，同时表达城周围所属的农地。
- source_word: עֲזֵקָה
  choice: 亚西加
  rationale: 地名，按中文通行形式音译。
- source_word: בְנֹתֶיהָ
  choice: 属它的附属城镇
  rationale: 希伯来语直译为“它的女儿们”，在地理名录中指隶属某城的聚落；正文采用自然清楚的功能性表达，脚注保留原文隐喻。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה的基本义是扎营、安营；本段为居民分布语境，也可能引申为定居，故正文保留基本义并用脚注说明语境义。
- source_word: מִבְּאֵר שֶׁבַע
  choice: 从别是巴
  rationale: בְּאֵר שֶׁבַע为地名，采用中文通行译名；介词מִן表达范围起点。
- source_word: עַד
  choice: 直到
  rationale: 自然表达地理范围的终点。
- source_word: גֵּיא הִנֹּם
  choice: 欣嫩谷
  rationale: 构词短语意为“欣嫩的谷”，采用现代中文中熟悉、简洁的地名形式。
theological_decisions:
- issue: וַיַּחֲנוּ在居民安置语境中的含义
  choice: 正文译作“安营”
  alternative: “定居”或“居住”
  rationale: 原动词的直接词义是“安营”，但上下文可能表示居民在该地域落户。正文不把语境引申义确定化，脚注同时交代另一理解，以保留原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。地名使用简体中文圣经读者较熟悉的形式；所属关系明确译出，以对应希伯来语代词。句末“一带”使“从……直到……”的居民分布范围在中文中更自然，同时不改变其地理界限。
