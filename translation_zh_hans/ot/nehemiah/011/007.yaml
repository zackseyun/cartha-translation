base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
translation:
  language: zh_hans
  text: 便雅悯的子孙[a]如下：撒路，是米书兰的儿子；米书兰是约叶[b]的儿子；约叶是毗大雅的儿子；毗大雅是哥赖雅的儿子；哥赖雅是玛西雅的儿子；玛西雅是以铁的儿子；以铁是耶筛亚的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子孙”原文直译为“儿子们”；在支派名册中，也可理解为“后裔”或“便雅悯人”。
    reason: lexical_alternative
  - marker: b
    text: 此处“约叶”依马所拉文本；平行族谱《历代志上》9:7作“何达威雅”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 如下
  rationale: 这个连接词和指示词用于引出下一组名单；译作“如下”符合现代汉语名册体例，也承接上下文。
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯的子孙
  rationale: 原文形式上是“便雅悯的儿子们”，但在支派和族谱名单中可泛指后裔或族人；“子孙”既自然，又保留世系含义。
- source_word: סַלֻּא
  choice: 撒路
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בֶּן
  choice: 是……的儿子
  rationale: 按族谱链条逐层表达父子关系；展开重复句式，可避免中文长串属格造成关系含混。
- source_word: מְשֻׁלָּם
  choice: 米书兰
  rationale: 采用通行的中文圣经人名译法。
- source_word: יוֹעֵד
  choice: 约叶
  rationale: 依马所拉文本所保存的名字音译，不用平行经文的不同名字替换。
- source_word: פְּדָיָה
  choice: 毗大雅
  rationale: 采用通行的中文圣经人名译法。
- source_word: קוֹלָיָה
  choice: 哥赖雅
  rationale: 采用通行的中文圣经人名译法，反映原名的主要音节。
- source_word: מַעֲשֵׂיָה
  choice: 玛西雅
  rationale: 采用通行的中文圣经人名译法。
- source_word: אִיתִיאֵל
  choice: 以铁
  rationale: 采用通行的中文圣经人名译法。
- source_word: יְשַׁעְיָה
  choice: 耶筛亚
  rationale: 采用族谱语境中的通行音译，并与先知以赛亚的惯用中文名相区别。
