base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/013.yaml
  text: and his brothers[a], heads of fathers’ houses, 242; and Amashsai son of Azarel, son of Ahzai, son of Meshillemoth[c][b], son of Immer.
translation:
  language: zh_hans
  text: 他的弟兄[a]，即父家的首领，共242人[b]；还有亚玛筛[c]，是亚撒列的儿子；亚撒列是亚哈赛的儿子；亚哈赛是米示利末的儿子；米示利末是音麦的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里也可指同族的男性亲属或同一祭司群体的成员。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文作“二百四十二”。
    reason: lexical_alternative
  - marker: c
    text: “亚玛筛”是按本节希伯来文本的拼写音译；这个名字也常译作“亚玛赛”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶחָיו
  choice: 他的弟兄
  rationale: 保留אָח复数加第三人称单数后缀的直接含义；在此祭司宗族名册中，也可能泛指同族男性成员，故加脚注说明。
- source_word: רָאשִׁים לְאָבוֹת
  choice: 父系家族的首领
  rationale: 该短语指宗族或父家体系中的首领；“父系家族”既呈现希伯来社会结构，又比生硬直译“父家之首”更符合现代汉语。
- source_word: מָאתַיִם אַרְבָּעִים וּשְׁנָיִם
  choice: 242人
  rationale: 原文明确为二百四十二；名册中采用阿拉伯数字便于阅读，并依语境补出量词“人”。
- source_word: וַעֲמַשְׁסַי
  choice: 还有亚玛筛
  rationale: 按马所拉文本的具体拼写音译；连接词在汉语中译作“还有”，自然承接名单中的下一人。
- source_word: בֶּן
  choice: 是……的儿子
  rationale: 重复的家谱公式通常表示“某人的儿子”；逐层展开，避免连续多个“之子”在现代汉语中造成亲属关系含混。
- source_word: עֲזַרְאֵל
  choice: 亚撒列
  rationale: 依希伯来语人名音译，并采用现代中文圣经人名常见形式。
- source_word: אַחְזַי
  choice: 亚哈赛
  rationale: 按本节马所拉文本的读音音译，不与其他可能相近的人名强行协调。
- source_word: מְשִׁלֵּמוֹת
  choice: 米示利末
  rationale: 按本节希伯来语拼写音译，保留其特定名称形式。
- source_word: אִמֵּר
  choice: 音麦
  rationale: 按希伯来语人名音译；此名也可代表祭司家族，但正文不额外解释。
