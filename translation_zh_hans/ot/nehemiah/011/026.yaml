  text: 又住在耶书亚、摩拉大和伯帕列[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯帕列”按字面可理解为“帕列的家”；也可能有“逃脱之家”的意思。这里是地名，因此正文采用音译。
