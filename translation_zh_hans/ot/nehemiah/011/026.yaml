lexical_decisions:
- source_word: וּ/בְ
  choice: 又住在／和
  rationale: וּבְ 在三个地名之前重复出现，兼有连接和地点含义。汉语在首项译作“又住在”，承接上文的居住名单；后两项用顿号和“和”自然连接，避免机械重复。
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 这是地名，按现代中文圣经人名、地名的通行音译处理，不按词义翻译。
- source_word: מוֹלָדָה
  choice: 摩拉大
  rationale: 这是专有地名，采用通行的中文音译。
- source_word: בֵית פָּלֶט
  choice: 伯帕列
  rationale: 这是复合地名，正文采用通行音译，不将其字面意义直接译入正文；字面构成在脚注说明。
