base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/004.yaml
  text: 'And in Jerusalem there lived some of the sons of Judah and some of the sons of Benjamin[a]. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel[b], of the sons of Perez.'
translation:
  language: zh_hans
  text: 在耶路撒冷居住[a]的人中，有犹大子孙和便雅悯子孙[b]中的一些人。犹大子孙中有亚他雅；他是乌西雅的儿子，乌西雅是撒迦利雅的儿子，撒迦利雅是亚玛利雅的儿子，亚玛利雅是示法提雅的儿子，示法提雅是玛哈拉列的儿子；亚他雅属于法勒斯的后代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “居住”也可译作“定居”。希伯来语动词既可表示住在某处，也可表示安顿下来。
    reason: lexical_alternative
  - marker: b
    text: “犹大子孙”和“便雅悯子孙”在这里指属于这两个支派族系的成员或后裔。
    reason: cultural_note
lexical_decisions:
- source_word: וּבִירוּשָׁלַם
  choice: 在耶路撒冷
  rationale: 介词短语在希伯来文中前置；中文也采用前置结构。句首连接词 וּ 表示承接上文，但在本节中文句首不必机械译作“而”，以免生硬。
- source_word: יָשְׁבוּ
  choice: 居住
  rationale: ישב 在此表示住在某处；“居住”自然、庄重，并保留其也可能含有定居意味的语义范围。
- source_word: מִבְּנֵי יְהוּדָה וּמִבְּנֵי בִנְיָמִן
  choice: 犹大子孙和便雅悯子孙中的一些人
  rationale: בני 在族谱语境中指族系成员或后裔；מִן 具有部分意义，因此用“中的一些人”明确这里不是指全部族人。
- source_word: מִבְּנֵי יְהוּדָה
  choice: 犹大子孙中有
  rationale: 第二次出现时用于引出犹大支派的具体名单；“中有”符合现代中文名单叙述。
- source_word: בֶּן
  choice: 是……的儿子
  rationale: 按族谱的表面形式译为父子关系，不将其改写为较宽泛的“后裔”；古代族谱可能省略世代，但正文保留原文表达。
- source_word: מִבְּנֵי פָרֶץ
  choice: 法勒斯的后代
  rationale: 此处不是直接父子链中的另一个“儿子”，而是说明亚他雅所属的宗族支系，因此译为“后代”更清楚。
- source_word: עֲתָיָה ... עֻזִּיָּה ... זְכַרְיָה ... אֲמַרְיָה ... שְׁפַטְיָה ... מַהֲלַלְאֵל ... פָרֶץ
  choice: 亚他雅……乌西雅……撒迦利雅……亚玛利雅……示法提雅……玛哈拉列……法勒斯
  rationale: 采用现代中文圣经读者较熟悉的人名音译，并保持各人在族谱中的次序。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的名单体中文。首句保留原文的部分关系；族谱部分适度展开重复主语，避免连续多个“儿子”造成指代不清，同时不改变父系链条。
