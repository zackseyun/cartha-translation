source:
  edition: WLC
  text: וְ/אֶל הַ/חֲצֵרִ֖ים בִּ/שְׂדֹתָ֑/ם מִ/בְּנֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ בְּ/קִרְיַ֤ת הָֽאַרְבַּע֙ וּ/בְנֹתֶ֔י/הָ וּ/בְ/דִיבֹן֙ וּ/בְנֹתֶ֔י/הָ וּ/בִֽ/יקַּבְצְאֵ֖ל וַ/חֲצֵרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/025.yaml
  text: As for the villages in their fields[a], some of the sons of Judah lived in Kiriath-arba and its villages, and in Dibon and its villages[c][b], and in Jekabzeel and its settlements.
translation:
  language: zh_hans
  text: 至于他们田野中的村庄，犹大子孙中有人住在基列·亚巴[a]及其附属村庄[b]，住在底本及其附属村庄，也住在叶甲薛[c]及其聚落。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基列·亚巴”是希伯仑的旧名；参看《约书亚记》14:15。
    reason: cross_reference
  - marker: b
    text: 希伯来文直译为“它的女儿们”，是指一座城所辖或周围的附属村庄。
    reason: lexical_alternative
  - marker: c
    text: 在一些相关传统和经文中，“叶甲薛”也作“甲薛”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל הַחֲצֵרִים בִּשְׂדֹתָם
  choice: 至于他们田野中的村庄
  rationale: וְאֶל 在此引出名单中的新类别，译作“至于”比直译方向性的“到”更符合篇章功能；חֲצֵרִים 在乡村地理语境中指村庄或小型聚居地，בִּשְׂדֹתָם 保留为“他们田野中的”。
- source_word: מִבְּנֵי יְהוּדָה
  choice: 犹大子孙中有人
  rationale: מִן 表示整体中的一部分，译为“……中有人”；“犹大子孙”保留原文的宗族、支派称谓。
- source_word: יָשְׁבוּ
  choice: 住在
  rationale: 此处表示居住，不必强化为开始定居或开拓殖民；“住在”自然简明。
- source_word: בְּקִרְיַת הָאַרְבַּע
  choice: 在基列·亚巴
  rationale: 按地名音译；原文本节没有直接解释其为希伯仑，因此将该辨识信息置于脚注。
- source_word: וּבְנֹתֶיהָ
  choice: 及其附属村庄
  rationale: 字面为“她的女儿们”，是以中心城镇与附属村庄之间的关系为喻；正文采用现代汉语中清楚自然的“附属村庄”，脚注保留原文比喻。
- source_word: וּבְדִיבוֹן
  choice: 住在底本
  rationale: 地名按通行形式音译；为使汉语并列结构清楚，补出前文已有的动词“住在”。
- source_word: וּבִיקַּבְצְאֵל
  choice: 也住在叶甲薛
  rationale: 依本节马所拉文本的带 י 形式音译；相关经文或传统中的较短形式另列脚注。
- source_word: וַחֲצֵרֶיהָ
  choice: 及其聚落
  rationale: חֲצֵרִים 在此仍指该城周围或所属的小型居住点；译作“聚落”，既符合语境，也与前面的“附属村庄”有所区分。
theological_decisions:
- issue: מִבְּנֵי יְהוּדָה 的性别与支派表达
  choice: 犹大子孙中有人
  alternative: 犹大人中有人
  rationale: “犹大子孙”保留 בְּנֵי 的亲族、支派表述；“有人”表达 מִן 的部分性，同时不把本节误解为只强调个别男性居民。此处是人口与地域名单，并不据此扩展任何性别方面的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的名单体表达。重复“住在”以理清汉语长并列结构；地名保留音译，解释性辨识和异名放入脚注，不写入正文。所有脚注标记均已在正文出现。
