  yaml_path: translation/ot/nehemiah/011/016.yaml
  text: And Shabbethai and Jozabad[a], from the heads of the Levites, were over the outside work of the house of God.
translation:
  language: zh_hans
  text: 利未人的首领中，沙比太和约撒拔负责上帝的殿外面的事务。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的殿外面的事务”也可译作“为上帝的殿办理的外部事务”。希伯来语可能指在圣殿主体之外进行的工作，与殿内的职务相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְּתַי וְיוֹזָבָד
  choice: 有沙比太和约撒拔
  rationale: 按现代中文圣经人名惯例音译；在承接名单的语境中，用“有”自然引出二人，并保留并列关系。
- source_word: עַל
  choice: 负责
  rationale: 此处表示承担管理或监督职责；“负责”比直译“在……之上”更符合现代汉语行政语境。
- source_word: הַמְּלָאכָה
  choice: 事务
  rationale: 该词可泛指工作、职务或任务；此处指与圣殿有关的指定职责，“事务”保持宽泛，不把它限定为体力劳动或礼仪服事。
- source_word: הַחִיצֹנָה
  choice: 外面的
  rationale: 保留“外部、外面”的空间性含义，并避免武断断定具体职责内容。
- source_word: לְבֵית הָאֱלֹהִים
  choice: 上帝殿……的
  rationale: 介词短语说明这些事务与上帝的殿相关；中文组合为“上帝殿外面的事务”，自然且贴近原文。
- source_word: מֵרָאשֵׁי הַלְוִיִּם
  choice: 利未人的首领中
  rationale: 保留介词 מִן 的“从……中、在……中”含义，表明二人属于利未人的领袖群体。
theological_decisions:
- issue: “外面的事务”所指范围
  choice: 保留为“上帝殿外面的事务”
  alternative: “上帝殿的外务”或“为上帝殿办理外部事务”
  rationale: 原文可指在圣殿主体之外进行的工作，也可能泛指对外事务；正文保留空间性表达，脚注说明可能含义，不将其具体化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上帝殿”简洁表达“上帝的殿”；“负责……事务”符合现代汉语，同时保留原文的行政职责意味。
