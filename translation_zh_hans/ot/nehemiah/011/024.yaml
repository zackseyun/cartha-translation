base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/024.yaml
  text: And Pethahiah son of Meshezabel[a], from the sons of Zerah son of Judah[b], was at the king’s side for every matter concerning the people.
translation:
  language: zh_hans
  text: 犹大的儿子谢拉的子孙中，有米示萨别的儿子毗他希雅；他在王身边[a]，负责一切有关百姓的事务[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在王身边”原文直译为“在王的手边”，也可理解为“作王的代理人”或“在王手下任职”。
    reason: lexical_alternative
  - marker: b
    text: “有关百姓”也可译作“为百姓”；原文既可能指涉及百姓的事务，也可能指替百姓办理的事务。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְתַֽחְיָה
  choice: 有……毗他希雅
  rationale: 连词承接前文名单；按中文名单叙述习惯调整语序，以“有”自然引出人物。人名采用现代和合本常见译名“毗他希雅”。
- source_word: בֶּן מְשֵֽׁיזַבְאֵל
  choice: 米示萨别的儿子
  rationale: 保留明确的父子关系，并采用中文圣经传统中易辨认的人名译法。
- source_word: מִ/בְּנֵי זֶרַח בֶּן יְהוּדָה
  choice: 犹大儿子谢拉的子孙中
  rationale: מִן表示出自某一宗族；“子孙中”比逐字译作“众子中”更自然，也准确表达谱系来源，同时保留“谢拉是犹大的儿子”这一链条。
- source_word: לְ/יַד הַ/מֶּלֶךְ
  choice: 在王身边
  rationale: 保留希伯来语“在王的手边”的具体意象，同时以自然中文表达其在王侧近任职的含义；不在正文中限定为单纯的近侍或全权代理。
- source_word: לְ/כָל דָּבָר
  choice: 办理一切……事务
  rationale: דָּבָר在行政语境中指事项或事务；补出“办理”使中文句法完整，但不缩窄职责范围。
- source_word: לָ/עָם
  choice: 有关百姓的
  rationale: 将ל理解为关系范畴，即涉及百姓的事务；正文保留宽泛含义，脚注说明也可能指替百姓办理事务。
