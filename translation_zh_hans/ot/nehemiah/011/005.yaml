base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/005.yaml
  text: and Maaseiah son of Baruch[a], son of Col-hozeh, son of Hazaiah, son of Adaiah, son of Joiarib, son of Zechariah, son of the Shilonite.
translation:
  language: zh_hans
  text: 还有玛西雅，他是巴录的儿子；巴录是谷何西的儿子；谷何西是哈赛雅的儿子；哈赛雅是亚大雅的儿子；亚大雅是约雅立的儿子；约雅立是撒迦利雅的儿子；撒迦利雅是示罗人[a]的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“示罗尼人”。这个希伯来称谓可能指与示罗这地方有关的人，也可能指家谱传统中与示拉／示罗尼宗族有关的人。
    reason: 保留该希伯来族属或地域称谓在地名“示罗”与可能的示拉／示罗尼宗族关联之间的词义歧义。
lexical_decisions:
- source_word: וּ/מַעֲשֵׂיָה
  choice: 还有玛西雅
  rationale: 保留前缀连词所表示的名单延续关系；人名按现代中文圣经常用译名音译。
- source_word: בֶן
  choice: 是……的儿子
  rationale: 逐层保留家谱链中反复出现的“儿子”关系，不将其泛化为“后代”。
- source_word: בָּרוּךְ
  choice: 巴录
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: כָּל חֹזֶה
  choice: 谷何西
  rationale: 该形式在此作专名，采用通行音译，不按字面译为描述性短语。
- source_word: חֲזָיָה
  choice: 哈赛雅
  rationale: 采用通行的中文人名音译。
- source_word: עֲדָיָה
  choice: 亚大雅
  rationale: 采用通行的中文人名音译。
- source_word: יוֹיָרִיב
  choice: 约雅立
  rationale: 按本处较短的希伯来形式采用通行音译，不补出更完整的神名成分。
- source_word: זְכַרְיָה
  choice: 撒迦利雅
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: הַ/שִּׁלֹנִי
  choice: 示罗人
  rationale: 将带冠词的族属或地域称谓译为“示罗人”，同时以脚注保留它也可能关联示拉宗族的歧义。
