  text: 'And the gatekeepers: Akkub[a], Talmon, and their brothers who kept watch at the gates, were one hundred seventy-two.'
translation:
  language: zh_hans
  text: 守门的是押谷、达们和他们的弟兄[a]；他们在各门口值守，共一百七十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的族人”；希伯来语“弟兄”也可指近亲，或同一群体中的男性成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשּׁוֹעֲרִים
  choice: 守门的
  rationale: 指受派看守或管理城门、殿门的人；“守门的”自然简洁，也保留其职分含义。
- source_word: עַקּוּב
  choice: 押谷
  rationale: 人名，采用现代中文圣经中通行且易辨认的音译。
- source_word: טַלְמוֹן
  choice: 达们
  rationale: 人名，采用现代中文圣经中通行且易辨认的音译。
- source_word: וַאֲחֵיהֶם
  choice: 和他们的弟兄
  rationale: אָח 的基本义为“兄弟”；此处也可能泛指同族男性或同一职分群体的成员。正文保留直译，并以脚注说明语义范围。
- source_word: הַשֹּׁמְרִים
  choice: 他们……守卫
  rationale: 分词表示持续承担看守职责；“守卫”在中文中准确表达其实际任务。
- source_word: בַּשְּׁעָרִים
  choice: 在各门
  rationale: 介词短语说明值守地点；复数定指在中文语境中自然译为“各门”。
- source_word: מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: 一百七十二人
  rationale: 准确表达总人数，并补出中文计数所需的量词“人”。
