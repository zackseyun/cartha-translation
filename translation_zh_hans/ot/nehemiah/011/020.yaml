  text: וּ/שְׁאָ֨ר יִשְׂרָאֵ֜ל הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה אִ֖ישׁ בְּ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/020.yaml
  text: And the rest of Israel[a], the priests, and the Levites were in all the cities of Judah, each in his inheritance.
translation:
  language: zh_hans
  text: 其余的以色列人、祭司和利未人都住在犹大的一切城邑，各自住在自己的地业中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁאָר יִשְׂרָאֵל
  choice: 其余的以色列人
  rationale: שְׁאָר表示余下的人；结合上文已列出的耶路撒冷居民，译为“其余的以色列人”自然清楚。יִשְׂרָאֵל在这里指以色列民，汉语补出“人”以避免被误解为地域或国家名称。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: כֹּהֲנִים指祭司群体，采用现代中文圣经语域中的标准译法。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: לְוִיִּם指利未支派或群体成员，采用通行译名“利未人”。
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: 住在犹大的各城
  rationale: 介词בְּ在此表示地点；原文省略显式谓语，中文依上下文补出“住”，准确表达居住状态。“各城”比“所有城”更符合自然汉语。
- source_word: אִישׁ בְּנַחֲלָתוֹ
  choice: 各自在自己的产业中
  rationale: אִישׁ在此具有逐一分配的功能，译作“各自”；单数后缀־וֹ在汉语中自然体现为“自己的”。נַחֲלָה指承受或分得的产业，保留“产业”以表达土地承受的含义。
theological_decisions:
- issue: 分配性阳性单数结构的表达
  choice: 各自在自己的产业中
  alternative: 各人在他的产业中
  rationale: 希伯来文אִישׁ及其后的阳性单数后缀具有分配性。现代汉语用“各自……自己的”既保留逐一对应的意义，也不必把语法性阳性僵硬地译成“他的”；这不扩大或缩小原文所指群体。
- issue: נַחֲלָה的土地与承受含义
  choice: 产业
  alternative: 土地；财产；所分得的产业
  rationale: “产业”在此可兼顾家族承受之地和所分配持有之物的含义，避免用“财产”削弱经文中的土地承受背景，也避免在正文中加入原文未明说的“分得”。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。按希伯来文的并列结构保留“以色列人、祭司和利未人”三个称谓；为使省略谓语的希伯来语名词句在中文中通顺，补出“住”。本节无需脚注；英文咨询层所列脚注内容实际对应אִישׁ的分配性，而不是“以色列”，中文“各自在自己的”已在正文中清楚表达。
