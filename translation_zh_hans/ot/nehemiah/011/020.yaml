  rationale: 修订明确译出“在犹大所有城邑中”的范围，并以“地业”保留承受产业的土地背景。重复使用“住在”是为使中文清楚呈现：前半句说明群体分布于犹大各城，后半句说明每人各居其承受的地业。原文分配性单数不要求在中文中机械保留阳性单数；“各自……自己的”充分表达其逐一分配功能。
