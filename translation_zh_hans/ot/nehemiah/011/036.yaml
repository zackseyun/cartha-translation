  yaml_path: translation/ot/nehemiah/011/036.yaml
  text: And from the Levites[a], divisions in Judah belonged to Benjamin.
translation:
  language: zh_hans
  text: 至于利未人，犹大境内的一些班次归于便雅悯。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文十分简略，也可直译作：“至于利未人，犹大的班次归于便雅悯。”其中“犹大”可理解为“犹大境内”或“与犹大有关”；原文没有明说它与“便雅悯”之间的确切关系。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן
  choice: 至于……其中
  rationale: 连接前文，并引出利未人中有关的一部分；鉴于本句是高度省略的名单结语，用“至于……其中”比生硬直译“并从”更符合现代汉语，同时保留来源或部分关系。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 直接对应希伯来文名词，不额外限定为家族、宗族或职务群体。
- source_word: מַחְלְקוֹת
  choice: 班次
  rationale: 该词可指划分出来的群体或行政编组；“班次”适合利未人的编组语境，也保留其复数、分组的意味。
- source_word: יְהוּדָה
  choice: 原属犹大的
  rationale: 希伯来文只并列“班次”和“犹大”，关系省略。正文按上下文表达可能的归属关系，并以脚注说明也可理解为“犹大境内的”。
- source_word: לְבִנְיָמִין
  choice: 归于便雅悯
  rationale: 介词לְ表示朝向、关系或划归；“归于”以简洁方式表达这些班次与便雅悯之间的归属或划拨关系，但不具体断定其行政机制。
theological_decisions:
- issue: “犹大”与“便雅悯”之间的具体关系
  choice: 正文译作利未人的某些班次原属犹大而归于便雅悯
  alternative: 利未人在犹大境内的一些班次归便雅悯；或“利未人的班次，犹大的归便雅悯”
  rationale: 原文极为简略，没有明示动词，也没有明确标出“犹大”是来源、地域还是所属关系。正文采用合乎上下文且自然的理解，脚注保留句法歧义，避免把推断当作原文明说。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“班次”保留行政分组色彩；以脚注说明原文的省略和歧义，不在正文中作过度解释。
