  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה בֶּן בּוּנִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/015.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
translation:
  language: zh_hans
  text: 利未人中有示玛雅；他是哈述的儿子[a]，哈述是押利甘的儿子，押利甘是哈沙比雅的儿子，哈沙比雅是布尼的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“儿子”在家谱名单中有时也可指较远的后裔，不一定表示直接的父子关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: ……中有
  rationale: 前缀连词与介词承接上文名单；中文用“……中有”自然引出利未人中的人物，并保留衔接作用。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 指作为特定群体的利未支派成员；“利未人”是现代中文圣经语境中准确而通行的称呼。
- source_word: שְׁמַעְיָה
  choice: 示玛雅
  rationale: 依希伯来语读音音译人名。
- source_word: בֶן
  choice: 儿子
  rationale: 家谱中通常译作“儿子”；虽也可能表示较远的男性后裔，但正文保留希伯来文的常规家谱表达，并以脚注说明。
- source_word: חַשּׁוּב
  choice: 哈述
  rationale: 按希伯来语 חַשּׁוּב 音译，采用自然、常见的现代中文圣经人名形式。
- source_word: עַזְרִיקָם
  choice: 押利甘
  rationale: 按希伯来语人名音译，采用中文圣经中通行的形式。
- source_word: חֲשַׁבְיָה
  choice: 哈沙比雅
  rationale: 按希伯来语人名音译，保留名称各音节的可辨识性。
- source_word: בּוּנִּי
  choice: 布尼
  rationale: 按希伯来语人名音译；希伯来语辅音的加强不需在中文译名中另行标示。
theological_decisions:
- issue: 家谱用语 בֶן 所表示的亲属距离
  choice: 正文译作“儿子”，脚注说明也可能指较远的后裔
  alternative: 直接译作“后裔”
  rationale: 原文使用通常表示“儿子”的 בֶן，但家谱语境可能跨代。正文保留其基本意义，脚注保存语义范围，避免武断确定每一代都是直接父子关系。
translation_notes:
  register: 采用现代、庄重且易懂的名单体表达。为避免连续多个“……的儿子”造成归属关系含混，后续各代重复人名，使家谱链条清楚；分号承接上文并引出人物。
