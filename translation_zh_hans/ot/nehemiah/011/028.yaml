  text: and in Ziklag[a], and in Mekonah and its daughter villages.
translation:
  language: zh_hans
  text: 又住在洗革拉、米哥拿和属米哥拿的村庄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它的女儿们”，是指隶属于米哥拿的较小村庄或附属聚落。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/צִֽקְלַג
  choice: 又住在洗革拉
  rationale: 介词 בְּ 在本段居民居住地的清单中自然补译为“住在”；וּ 承接上文译作“又”。צִקְלַג 按现代中文圣经地名惯例音译为“洗革拉”。
- source_word: וּ/בִ/מְכֹנָה
  choice: 米哥拿
  rationale: מְכֹנָה 是地名，按希伯来语读音音译为“米哥拿”；与前面的“住在”并列共用，避免中文重复累赘。
- source_word: וּ/בִ/בְנֹתֶֽי/הָ
  choice: 和属米哥拿的村庄
  rationale: בְּנוֹתֶיהָ 字面为“它的女儿们”，在城邑地理语境中指隶属于中心城镇的附属聚落。译为“属米哥拿的村庄”清楚表达其惯用义，并明确阴性单数后缀所指的是米哥拿。
