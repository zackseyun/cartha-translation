revisions:
- from: 百姓的首领住在耶路撒冷；其余的百姓抽签，十人中选出一人来住在圣城耶路撒冷，其余九份留在各城镇。[a]
  to: 百姓的官长住在耶路撒冷；其余的百姓抽签，使十人中有一人来住在圣城耶路撒冷，其余十分之九的人仍住在各城镇[a]。
  rationale: 修订解决“九份”在汉语中的不自然和指代不清，并更充分表达“使人来到”的使役意义；不增添原文未明示的神学或历史解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:23:20Z'
review_pass:
  verdict: revise
  source_fidelity: 原译整体准确地表达了百姓首领居住在耶路撒冷、其余百姓借抽签安排十分之一迁居圣城的内容。“其余九份留在各城镇”虽可追溯至原文“九手”的习语，却在现代汉语中不自然，也没有明确说明所指为人。修订以“其余十分之九的人”明示原文的比例及省略的人群指向，并在脚注保留该习语的字面信息。将“选出”改为“使……来住在”，更贴近使役式לְהָבִיא（使/带来）。
  naturalness: 修订后的句子保持庄重、现代的叙事语体。“抽签，使十人中有一人来住在……”清楚呈现抽签的目的；“其余十分之九的人仍住在各城镇”比“其余九份留在各城镇”更符合现代标准汉语。
  terminology: “官长”适合שָׂרֵי הָעָם在本段行政语境中的含义；“圣城”“抽签”“住在”均准确自然。脚注将“九只手”说明为表示比例的希伯来语习语，不把字面说法误作中文正文。
  issues:
  - severity: medium
    issue: “其余九份留在各城镇”在现代汉语中指代不明且搭配生硬。
    rationale: “份”通常需要明确所分的对象；此处原文的“九手”是指其余九个比例份额，即其余十分之九的百姓。正文宜明示人群，字面习语可置于脚注。
  - severity: low
    issue: “十人中选出一人来住在”弱化了לְהָבִיא的使役／使人来到之意。
    rationale: “选出”表达抽签的结果，但“使十人中有一人来住在”同时保留抽签安排人迁入耶路撒冷的目的。
  revised_text: 百姓的官长住在耶路撒冷；其余的百姓抽签，使十人中有一人来住在圣城耶路撒冷，其余十分之九的人仍住在各城镇[a]。
  revised_footnotes:
