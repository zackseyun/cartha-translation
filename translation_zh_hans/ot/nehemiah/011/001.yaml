base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/001.yaml
  text: The officials of the people lived in Jerusalem[a], and the rest of the people cast lots to bring one out of ten to live in Jerusalem, the holy city, while nine parts remained in the towns.
translation:
  language: zh_hans
  text: 百姓的官长住在耶路撒冷；其余的百姓抽签，使十人中有一人来住在圣城耶路撒冷，其余十分之九的人仍住在各城镇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其余十分之九的人”希伯来文直译为“九只手”；这是表示比例的习语，指十份中其余的九份人仍留在其他城镇。
    reason: 解释“九只手”的希伯来语习语，同时说明正文所表达的比例和隐含的人群指向。
lexical_decisions:
- source_word: שָׂרֵי הָעָם
  choice: 百姓的首领
  rationale: שָׂרִים可指官长、领袖或统治者；此处指百姓中居领导地位的人。“首领”自然庄重，也避免“王子”等不合语境的含义。
- source_word: וַיֵּשְׁבוּ
  choice: 住在
  rationale: ישׁב在此表示居住，而不是坐下；“住在”符合现代汉语。
- source_word: וּשְׁאָר הָעָם
  choice: 其余的百姓
  rationale: שְׁאָר表示剩余的人；此译简明自然。
- source_word: הִפִּילוּ גוֹרָלוֹת
  choice: 抽签
  rationale: 该词组直译为“掷签”，指借签选定人选；现代汉语通常说“抽签”。
- source_word: לְהָבִיא
  choice: 选出……来
  rationale: 该使役式不定词本义为“使之来、带来”。结合抽签及迁居语境，“选出……来”自然表达使被选者来到耶路撒冷的结果。
- source_word: אֶחָד מִן הָעֲשָׂרָה
  choice: 十人中选出一人
  rationale: 原文表达十分之一的选取比例；结合所指为百姓，用“十人中……一人”清楚自然。
- source_word: לָשֶׁבֶת
  choice: 住在
  rationale: 此处同样表示定居、居住；“住在”不额外强调初次安置。
- source_word: עִיר הַקֹּדֶשׁ
  choice: 圣城
  rationale: 准确、简洁地表达“神圣之城”，也是现代汉语中自然且通行的称呼。
- source_word: וְתֵשַׁע הַיָּדוֹת
  choice: 其余九份
  rationale: 字面为“九只手”，在这里是指十份中的九份。保留“份”的表达，既传达比例，也避免把原文直接改写成抽象的“十分之九”。
- source_word: בֶּעָרִים
  choice: 在各城镇
  rationale: עָרִים可指城或镇；这里与耶路撒冷相对，泛指犹大的其他聚居地，“各城镇”较为自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。用分号划分首领已住在耶路撒冷与其余百姓抽签迁居两层信息；不添加原文没有的时间副词。脚注标记置于与其所释“其余九份”相邻的句末。
