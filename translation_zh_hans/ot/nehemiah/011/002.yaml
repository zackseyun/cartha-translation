  text: And the people blessed all the men who willingly offered themselves to live in Jerusalem[a].
translation:
  language: zh_hans
  text: 百姓为所有自愿住在耶路撒冷的男子祝福[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“百姓为所有甘心献身住在耶路撒冷的男子祝福。”
    reason: “自愿”所译的希伯来语动词含有甘心、主动献上自己之意。
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: 为……祝福
  rationale: 皮埃勒词形通常表示“祝福”。这里受词是人，意为百姓为他们祝福；保留“祝福”也维持了原词的神学与词汇联系，未弱化为单纯“称赞”。
- source_word: הָעָם
  choice: 百姓
  rationale: עַם 是集合名词，意为“人民、百姓”；“百姓”在叙事语境中自然、庄重。
- source_word: לְכֹל הָאֲנָשִׁים
  choice: 那些……的人
  rationale: אֲנָשִׁים 在形式上为阳性复数，但此处中文用“人”即可自然指涉这群居民，不必添加原文没有明示的性别词；“都”表达 כֹל 的全称范围。
- source_word: הַמִּתְנַדְּבִים
  choice: 自愿
  rationale: נדב 的希特帕埃勒分词表达主动自愿、甘心承担之意；“自愿”准确而简洁，中文无需硬译反身形式。
- source_word: לָשֶׁבֶת
  choice: 住
  rationale: יָשַׁב 在此指居住、定居；“住”是现代汉语最自然的表达。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 按地点介词 בְּ 的通常用法译出，并采用标准中文地名。
theological_decisions:
- issue: הָאֲנָשִׁים 的性别表达
  choice: 那些……的人
  alternative: 那些男子
  rationale: 希伯来语名词为阳性复数，但现代汉语“人”本身不标示语法性别，也没有证据表明本节的重点在限定生理性别。译作“人”既不虚构女性参与，也避免在中文中作超出语境的强调。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“自愿住在”自然传达自我献上的意愿；句末脚注标记与正文对应。
