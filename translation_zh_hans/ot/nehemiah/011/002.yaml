revisions:
- from: 百姓都为那些自愿住在耶路撒冷的人祝福[a]。
  to: 百姓为所有自愿住在耶路撒冷的男子祝福[a]。
  rationale: 修订恢复“男子”以对应原文的 הָאֲנָשִׁים 和英文审校记录的性别准确性决定；保留简洁自然的“自愿住在”。脚注改为呈现 הַמִּתְנַדְּבִים 的“甘心献上自己”语义，且维持正文的“祝福”作为对 וַיְבָרֲכוּ 的核心翻译。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:09Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的“百姓”“所有……男子”“甘心／自愿”和“住在耶路撒冷”均应明确保留。草稿将 הָאֲנָשִׁים（男子）泛化为“人”，弱化了原文及英文审校记录所保留的男性指称；宜改为“男子”。
  naturalness: “百姓为所有自愿住在耶路撒冷的男子祝福”在现代标准汉语中自然、庄重，也忠实保留了对人的“祝福”这一措辞。
  terminology: “百姓”“祝福”“男子”“自愿住在”“耶路撒冷”分别对应 הָעָם、וַיְבָרֲכוּ、הָאֲנָשִׁים、הַמִּתְנַדְּבִים לָשֶׁבֶת 与 בִּירוּשָׁלִָם。脚注应呈现“自愿”的“甘心献上自己”这一反身、主动的语义，而非将脚注仅用于替换“祝福”为“称赞”。
  issues:
  - severity: medium
    issue: “那些自愿住在耶路撒冷的人”未保留 הָאֲנָשִׁים 的男性指称。
    rationale: 原文使用“男子”，英文审校记录也明确决定保留“all the men”。中文虽无语法性别，但以“人”替代“男子”会抹平此处可表达且已受审校确认的词汇信息。
  - severity: low
    issue: 现有脚注未对应英文审校轨迹中为 הַמִּתְנַדְּבִים 提供的词汇替代。
    rationale: 脚注将重点放在“祝福／称赞”的语境可能性；这并非不可能，但英文脚注所标记的是“自愿／志愿”的表达。改以说明“甘心献上自己”的替代，更能保留该反身动词的语义。
  revised_text: 百姓为所有自愿住在耶路撒冷的男子祝福[a]。
  revised_footnotes:
  - marker: a
    text: 或译：“百姓为所有甘心献身住在耶路撒冷的男子祝福。”
    reason: “自愿”所译的希伯来语动词含有甘心、主动献上自己之意。
  revision_rationale: 修订恢复“男子”以对应原文的 הָאֲנָשִׁים 和英文审校记录的性别准确性决定；保留简洁自然的“自愿住在”。脚注改为呈现 הַמִּתְנַדְּבִים 的“甘心献上自己”语义，且维持正文的“祝福”作为对 וַיְבָרֲכוּ 的核心翻译。
