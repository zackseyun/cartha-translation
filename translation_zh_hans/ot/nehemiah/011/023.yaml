base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/023.yaml
  text: For the king’s command was upon them[a], and a fixed provision for the singers[b], each day’s matter on its day.
translation:
  language: zh_hans
  text: 因为王的命令临到他们[a]；关于歌唱者，也有既定的供给[b]，每天各按当天的需要。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“王的命令在他们身上”，意思是王的命令对他们具有约束力。
    reason: lexical_alternative
  - marker: b
    text: 译作“既定的供给”的希伯来语也可指确定的安排或既定的义务。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明原因；现代汉语用“因为”自然清楚。
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: 王给他们下了命令
  rationale: 指王所颁布、具有权威的行政命令；采用主动表达，使汉语顺畅，同时保留命令的约束力。
- source_word: עֲלֵיהֶם
  choice: 给他们
  rationale: 原文可直译为“在他们身上”，表示命令临到他们并对他们具有约束力；正文按现代汉语表达为“给他们”。
- source_word: וַאֲמָנָה
  choice: 又……定了固定的供给
  rationale: אֲמָנָה在此行政语境中可指确定的安排、义务或供给；结合歌唱者每日所需，正文采用“固定的供给”，同时以脚注保留词义范围。
- source_word: עַל הַמְשֹׁרְרִים
  choice: 为歌唱的人
  rationale: 此处介词短语说明该固定安排所关涉或惠及的对象；译作“为歌唱的人”最符合自然汉语。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: 每天按当天的需要供应
  rationale: 该习语字面为“一日的事在其日”，在本节行政供给语境中表示逐日处理或供应当天所需；译文保留逐日性的核心含义。
