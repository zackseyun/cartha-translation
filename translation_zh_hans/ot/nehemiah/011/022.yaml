  to: 在耶路撒冷，利未人的主管是乌西；他是巴尼的儿子，巴尼是哈沙比雅的儿子，哈沙比雅是玛他尼的儿子，玛他尼是米迦的儿子。乌西是亚萨子孙中的歌唱者，负责上帝殿的事务。[a]
