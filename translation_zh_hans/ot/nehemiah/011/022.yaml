base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/022.yaml
  text: And the overseer of the Levites in Jerusalem was Uzzi son of Bani[a], son of Hashabiah, son of Mattaniah, son of Mica, from the sons of Asaph, the singers, over the work of the house of God.
translation:
  language: zh_hans
  text: 在耶路撒冷，利未人的主管是乌西；他是巴尼的儿子，巴尼是哈沙比雅的儿子，哈沙比雅是玛他尼的儿子，玛他尼是米迦的儿子。乌西是亚萨子孙中的歌唱者，负责上帝殿的事务。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在上帝殿的事务上。”这里的希伯来语短语可表示对圣殿事务负有监督或管理责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקִיד הַלְוִיִּם
  choice: 利未人的主管
  rationale: פְקִיד指受委任承担管理或监督职责的人；“主管”在现代汉语中清楚自然，也不额外引入军事或官僚色彩。属格关系译作“利未人的”，监督含义由“主管”表达。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 按介词בְּ的地点含义直译。
- source_word: עֻזִּי בֶן בָּנִי בֶּן חֲשַׁבְיָה בֶּן מַתַּנְיָה בֶּן מִיכָא
  choice: 乌西；他是巴尼的儿子，巴尼是哈沙比雅的儿子，哈沙比雅是玛他尼的儿子，玛他尼是米迦的儿子
  rationale: 逐层保留重复的בן所表达的家谱链，避免汉语连续使用“之子”时可能产生的归属歧义；人名采用现代中文圣经常见的音译形式。
- source_word: מִבְּנֵי אָסָף
  choice: 出自亚萨的子孙
  rationale: 自然表达字面意义“来自亚萨的众子”，在家族和职分语境中“子孙”比仅指亲生儿子的“儿子们”更准确。
- source_word: הַמְשֹׁרְרִים
  choice: 就是那些歌唱者
  rationale: 该分词指明亚萨后裔在圣殿中的歌唱职分；“歌唱者”比范围更宽的“乐师”贴近原文。
- source_word: לְנֶגֶד מְלֶאכֶת
  choice: 负责……事务
  rationale: לְנֶגֶד在此行政语境中表示相对于圣殿工作的责任或监管关系；“负责……事务”自然表达该含义，同时以脚注保留较宽的关系性理解。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  rationale: 既保留“上帝之家”的圣殿所指，又符合现代汉语的庄重表达；译作“殿”比字面“家”更不易误解。
theological_decisions:
- issue: לְנֶגֶד是否明确表示监督圣殿事务
  choice: 正文译为“负责上帝殿中的事务”
  alternative: “与上帝殿中的事务有关”或“在上帝殿的事务之上”
  rationale: 上下文中的פְקִיד支持职责或监管含义，但לְנֶגֶד本身可较宽泛地表达与某事相对或相关，因此正文采用合乎语境的表达，并用脚注保留其语义张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。为避免冗长家谱链在汉语中产生修饰歧义，将其拆成连续短句；保留“歌唱者”的职分名称，并以“上帝的殿”明确圣殿所指。
