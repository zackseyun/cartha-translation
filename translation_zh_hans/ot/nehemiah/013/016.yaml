base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/016.yaml
  text: Also Tyrians lived in it[a], bringing in fish and every kind of merchandise[b], and selling them on the Sabbath to the sons of Judah, and in Jerusalem.
translation:
  language: zh_hans
  text: 还有推罗人住在城里，把鱼和各样货物运来，在安息日卖给犹大人[a]，也在耶路撒冷卖[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“犹大的子孙”，这里指犹大地区或犹大群体的人。
    reason: lexical_alternative
  - marker: b
    text: 原文也可理解为“甚至就在耶路撒冷卖”；末尾连接语是否带有强调意味，并不完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצֹּרִים
  choice: 还有推罗人
  rationale: צֹרִים指来自推罗的人；句首连接词结合上下文译作“还有”，承接前文所列安息日违规之事。
- source_word: יָשְׁבוּ בָהּ
  choice: 住在城里
  rationale: יָשְׁבוּ在此表示居住；阴性代词后缀所指为耶路撒冷，现代汉语用“城里”自然表达这一回指。
- source_word: מְבִיאִים דָּאג וְכָל מֶכֶר
  choice: 把鱼和各样货物运来
  rationale: מְבִיאִים表示把东西带来或运入，דָּאג是鱼，מֶכֶר指供出售的货物；“各样货物”兼顾整体范围和市场语境。
- source_word: וּמֹכְרִים בַּשַּׁבָּת
  choice: 在安息日卖
  rationale: 分词延续对其经常性商业活动的描述；时间短语明确指出交易发生在安息日。
- source_word: לִבְנֵי יְהוּדָה
  choice: 卖给犹大人
  rationale: 该短语字面为“犹大的子孙”，在此作为群体称谓，现代汉语以“犹大人”表达自然，并以脚注保留字面形式。
- source_word: וּבִירוּשָׁלִָם
  choice: 而且就在耶路撒冷售卖
  rationale: 保留连接词及地点成分，并用“而且就在”传达末尾补充地点可能具有的强调意味；脚注说明较中性的译法。
