source:
  edition: WLC
  text: הֲ/ל֣וֹא עַל אֵ֣לֶּה חָטָֽא שְׁלֹמֹ֣ה מֶ֣לֶךְ יִשְׂרָאֵ֡ל וּ/בַ/גּוֹיִ֣ם הָ/רַבִּים֩ לֹֽא הָיָ֨ה מֶ֜לֶךְ כָּמֹ֗/הוּ וְ/אָה֤וּב לֵֽ/אלֹהָי/ו֙ הָיָ֔ה וַ/יִּתְּנֵ֣/הוּ אֱלֹהִ֔ים מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵ֑ל גַּם אוֹת֣/וֹ הֶחֱטִ֔יאוּ הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/026.yaml
  text: Was it not because of these things that Solomon king of Israel sinned? Yet among the many nations there was no king like him[a], and he was loved by his God, and God made him king over all Israel. Even him foreign women caused to sin.
translation:
  language: zh_hans
  text: 以色列王所罗门不正是因这些事犯了罪吗？在众多邦国中，没有一个王能与他相比；他蒙他的神所爱，神又立他作全以色列的王。外邦女子[a]甚至使他也犯了罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外邦妻子”。希伯来文直译为“外邦女子”；根据所罗门故事的上下文可理解为妻子，但本节没有明确使用“妻子”一词。
    reason: 保留原词的词汇范围，同时说明上下文所支持但并非本节明说的另一译法。
lexical_decisions:
- source_word: הֲלוֹא עַל אֵלֶּה
  choice: 不正是因这些事……吗
  rationale: 以反问句保留 הֲלוֹא 所预期的肯定回答，并将 עַל אֵלֶּה 的原因或缘由义自然表达为“因这些事”。
- source_word: חָטָא
  choice: 犯了罪
  rationale: 在道德与宗教语境中，“犯罪”准确传达该动词的常用意义。
- source_word: וּבַגּוֹיִם הָרַבִּים לֹא הָיָה מֶלֶךְ כָּמֹהוּ
  choice: 列国中没有一个王能与他相比
  rationale: “列国中”表达比较范围；“能与他相比”以自然汉语保留“没有王像他”的意义。
- source_word: וְאָהוּב לֵאלֹהָיו הָיָה
  choice: 他蒙他的神所爱
  rationale: 保留 אָהוּב 的被动含义和“他的神”这一代词关系，不改用原文未出现的神名。
- source_word: וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ
  choice: 神又立他作……王
  rationale: נתן 在宾语加身份补语的结构中表示授予职位；“立他作王”准确而符合庄重汉语。
- source_word: גַּם אוֹתוֹ
  choice: 就连他
  rationale: 保留前置宾语的强调，突出连所罗门这样的人也未能免于犯罪。
- source_word: הֶחֱטִיאוּ
  choice: 使他犯了罪
  rationale: 明确表达 חטא 的使役形含义，同时不添加诱惑方式等原文未明说的细节。
- source_word: הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: 外邦女子
  rationale: 直译“外来的／异族的女人”，既符合以色列语境，也不在正文中擅自把“女子”明确化为“妻子”。
theological_decisions:
- issue: 所罗门犯罪的成因
  choice: 外邦女子使他犯了罪
  alternative: 外邦女子引诱他犯罪；他的外邦婚姻损害了他对神的忠诚
  rationale: 希伯来语使役动词明确说这些女子使所罗门犯罪，但本节没有说明具体方式，因此不补入“引诱”或政治、婚姻层面的解释。
- issue: אֱלֹהִים 的译法
  choice: 他的神；神
  alternative: 耶和华
  rationale: 第一处有第三人称单数后缀，译作“他的神”；后一处没有后缀，译作“神”。原文没有使用神名，故不译作“耶和华”。
- issue: 外邦女子是否明确为妻子
  choice: 正文保留“外邦女子”
  alternative: 外邦妻子
  rationale: 所罗门故事的上下文可支持“妻子”，但本节名词本身只说“女子／女人”；正文保留原文措辞，并以脚注提供上下文所容许的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不正是……吗”保留反问力度；“列国”“蒙……所爱”“立他作王”保持经文语体但不过分古雅。脚注标记置于“外邦女子”之后，与所说明的词语直接对应。
