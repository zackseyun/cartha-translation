id: NEH.13.22
reference: Nehemiah 13:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה לַ/לְוִיִּ֗ם אֲשֶׁ֨ר יִֽהְי֤וּ מִֽטַּהֲרִים֙ וּ/בָאִים֙ שֹׁמְרִ֣ים הַ/שְּׁעָרִ֔ים לְ/קַדֵּ֖שׁ אֶת י֣וֹם הַ/שַּׁבָּ֑ת גַּם זֹאת֙ זָכְרָ/ה לִּ֣/י אֱלֹהַ֔/י וְ/ח֥וּסָ/ה עָלַ֖/י כְּ/רֹ֥ב חַסְדֶּֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/022.yaml
  text: And I told the Levites that they should purify themselves and come to guard the gates[a], to keep the Sabbath day holy. Remember this also in my favor, my God[b], and spare me according to the greatness of your steadfast love.
translation:
  language: zh_hans
  text: 我告诉利未人，要洁净自己，前来守卫城门，使安息日分别为圣。我的上帝啊，求你也为我记念这事[a]；照你丰盛的慈爱[b]怜恤我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的上帝啊，求你也因这事记念我。”希伯来语的表达既可侧重记念尼希米本人，也可侧重记念他刚做的这事，使他因此蒙恩。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来语是 hesed，常指上帝忠贞、守约并施怜悯的爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לַלְוִיִּם
  choice: 我告诉利未人
  rationale: אמר在这里引出尼希米对利未人的行政性指示；译作“告诉”自然准确，又不把语气强化为原文未明确表达的“命令”。
- source_word: אֲשֶׁר יִהְיוּ מִטַּהֲרִים
  choice: 要洁净自己
  rationale: היה加分词表达预期或应当采取的行动；טהר的Hitpael形式在此具有反身意义。
- source_word: וּבָאִים שֹׁמְרִים הַשְּׁעָרִים
  choice: 前来守卫城门
  rationale: 将连续的分词动作按现代汉语自然表达为“前来守卫”，保留利未人到场并承担看守职责的意思。
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: 使安息日分别为圣
  rationale: קדשׁ表示使之成为圣、分别出来归为圣；此处说明守卫城门的目的。“分别为圣”保留原文的宗教含义，也适合现代汉语经文语体。
- source_word: גַּם זֹאת זָכְרָה לִּי
  choice: 求你也为我记念这事
  rationale: 保留“也”的递加意味，并以“为我记念”反映לִי的受益含义；原短语可侧重记念尼希米本人，也可侧重记念他所做的这事，故以脚注保留另一种理解。
- source_word: וְחוּסָה עָלַי
  choice: 怜恤我
  rationale: חוס可表示怜惜、顾惜或饶恕；在向上帝祈求的语境中，“怜恤我”自然地表达求蒙眷顾和宽待的意思。
- source_word: כְּרֹב חַסְדֶּךָ
  choice: 照你丰盛的慈爱
  rationale: רֹב表达丰盛、广大；חסד在此指上帝忠贞而施恩的爱。“慈爱”是现代中文中简洁且有神学分量的对应词。
theological_decisions:
- issue: 祈祷中חסד的译法
  choice: 慈爱
  alternative: 信实之爱；盟约之爱；怜悯
  rationale: “慈爱”兼顾上帝的恩慈与持久忠信，不把该词缩减为单纯情感或仅仅宽恕，也不在正文中加入原词未明说的解释性术语。
- issue: זָכְרָה לִּי所指的受益关系
  choice: 求你也为我记念这事
  alternative: 求你也因这事记念我
  rationale: 希伯来语习语允许重点落在尼希米本人或刚提到的行为上；正文尽量贴近原有结构，脚注列出自然的另一译法，避免消除真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“分别为圣”保留קדשׁ的核心宗教含义；祷告部分使用“求你”“怜恤我”，保持真挚而不古奥。所有脚注标记均置于正文相应词句之后。
