  yaml_path: translation/ot/nehemiah/013/003.yaml
  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
translation:
  language: zh_hans
  text: 他们听见律法，就把所有混杂的人群[a]从以色列中分别出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“混血的人”或“混合的群众”。希伯来语 עֵרֶב 是指混合群体的集合用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 就
  rationale: 该叙事形式承接前文并引出随后发生的事；结合时间从句，用“就”自然表达事件的推进，不机械译为“事情发生了”。
- source_word: כְּשָׁמְעָם
  choice: 他们听见……时
  rationale: 介词כְּ加带后缀的不定式构造时间从句；在整句中译作“他们听见……，就……”符合现代汉语叙事习惯。
- source_word: הַתּוֹרָה
  choice: 这律法
  rationale: תּוֹרָה在此指当众宣读、具有权威的律法；“这律法”既承接上文所读的内容，也保留其盟约语境。
- source_word: וַיַּבְדִּילוּ
  choice: 分别出来
  rationale: בדל表示分开、区分；“从以色列中分别出来”直接保留原文的分离动作，不进一步解释其动机或具体执行方式。
- source_word: כָל
  choice: 所有
  rationale: כָל修饰集合名词，指整个相关群体；“所有”在现代汉语中自然清楚。
- source_word: עֵרֶב
  choice: 混杂的群体
  rationale: עֵרֶב是指混合群体的集合用语。“混杂的群体”保留其集合性及语义宽度，避免正文直接断定它只指混血后裔；其他可能含义置于脚注。
- source_word: מִיִּשְׂרָאֵל
  choice: 从以色列中
  rationale: 介词מִן表示从某一群体中分离；保留专名“以色列”，使其继续兼具群体和盟约身份的含义。
theological_decisions:
- issue: 被分别之人的身份及 עֵרֶב 的范围
  choice: 正文译作“混杂的群体”，不限定为血统混合者
  alternative: “混血的人”或“杂族群众”
  rationale: 原词是集合性用语，可指由不同背景者构成的群体，也可能在本语境中涉及外族或混合血统。正文保留这种含混性，避免把群体身份单纯归结为血统。
- issue: 被称为“以色列”的群体
  choice: 保留“以色列”这一名称
  alternative: “以色列人”或“以色列会众”
  rationale: 原文使用专名יִשְׂרָאֵל。保留该名称可呈现其集体与盟约身份，不额外限定为族裔称谓或正式会众组织。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“听见……就……”自然呈现希伯来叙事次序；“分别出来”保留经文语体，同时仍为普通读者所理解。脚注标记[a]已置于相关词组之后。
