  terminology: “上帝”“祖先”“灾祸”“安息日”“亵渎”“烈怒”均符合现代标准汉语圣经语体及本节语义。原文未在末句明言烈怒的主体；不必在正文补出“上帝”，上下文已足以表明其所指。
