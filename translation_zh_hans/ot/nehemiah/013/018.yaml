base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/018.yaml
  text: Did not your fathers do this[a], and our God brought all this evil on us and on this city? Yet you are adding wrath against Israel by profaning the Sabbath.
translation:
  language: zh_hans
  text: 你们的祖先不也是这样做的吗？我们的上帝使这一切灾祸临到我们和这座城。而你们却亵渎安息日，给以色列加增烈怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹוא כֹה עָשׂוּ
  choice: 不正是这样做的吗
  rationale: 以自然的汉语反问句表达原文期待肯定回答的语气；“这样”回指上文所述的行为。
- source_word: אֲבֹתֵיכֶם
  choice: 你们的祖先
  rationale: 此处指前代之人；现代汉语用“祖先”比字面的“父辈”范围更准确，也更自然。
- source_word: וַיָּבֵא
  choice: 使……临到
  rationale: 保留使役意义，并明确上帝是审判性灾祸临到百姓和城的施行者。
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: 这一切灾祸
  rationale: רָעָה 在本节的审判语境中指临到群体和城市的祸患、灾难；译为“灾祸”可避免现代读者误解为上帝施行道德邪恶。
- source_word: חָרוֹן
  choice: 烈怒
  rationale: 该词表达炽烈的怒气；在这里语境明确指上帝因违约而发的审判之怒。
- source_word: מוֹסִיפִים חָרוֹן עַל יִשְׂרָאֵל
  choice: 使上帝对以色列的烈怒越发加重
  rationale: 按汉语习惯把隐含的烈怒主体补为“上帝”，并表达 מוֹסִיפִים 的持续增加含义；不把以色列误作烈怒的主体。
- source_word: לְחַלֵּל אֶת הַשַּׁבָּת
  choice: 亵渎安息日
  rationale: 保留“使之成为俗常、侵犯其神圣性”的宗教伦理分量，并以目的或方式关系连接前句。
theological_decisions:
- issue: 上帝所带来的 רָעָה 应如何表达
  choice: 灾祸
  alternative: 祸患；灾难；恶
  rationale: 语境所指是因犯罪而临到百姓与耶路撒冷的审判性灾难。“灾祸”既保留负面审判意义，又不暗示上帝实施道德上的恶。
- issue: חָרוֹן 的主体在原文中未明说
  choice: 在译文中补出“上帝对以色列的烈怒”
  alternative: 使烈怒临到以色列；加增以色列所受的烈怒
  rationale: 上下文以及上一分句的“我们的上帝”表明，这是上帝针对以色列的审判之怒。补足主体符合现代汉语表达，同时没有削弱原文的神学张力。
- issue: וְאַתֶּם 的对比力度
  choice: 如今你们却
  alternative: 而你们；但你们
  rationale: 突出祖先因同类罪行受罚之后，当代人仍继续亵渎安息日的强烈反差；“如今”是语境性连接，不另加新的时间主张。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“祖先”“灾祸”“烈怒”“亵渎”兼顾可读性与经文的历史及神学分量。原文首句可连贯理解为一个反问句，随后陈述后果；译文据此断句。
