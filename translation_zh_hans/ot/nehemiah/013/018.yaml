revisions:
- from: 你们的祖先不正是这样做的吗？因此，我们的上帝使这一切灾祸临到我们和这座城。如今你们却亵渎安息日，使上帝对以色列的烈怒越发加重。
  to: 你们的祖先不也是这样做的吗？我们的上帝使这一切灾祸临到我们和这座城。而你们却亵渎安息日，给以色列加增烈怒。
  rationale: 修订删去“因此”和“如今”这两项非必要的解释性连接，保留原文的反问、灾祸临到百姓与城，以及当代人亵渎安息日而加增烈怒的逻辑。末句不补出原文未明说的主体，且以更紧凑的汉语对应“加增烈怒在以色列身上”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:15Z'
