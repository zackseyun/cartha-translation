- from: 于是，我洁净了他们，使他们脱离一切外来的事物；又为祭司和利未人安排职责[a]，各人各按其职。
  to: 于是，我洁净他们，除去他们中一切外来的成分；又为祭司和利未人设立职守[a]，各人按自己的职分。
  rationale: 修订保持“他们”和“一切外来的”未具体限定的范围，避免将其限定为外族人或外族女子；以“除去他们中一切外来的成分”更贴近“洁净……脱离/除去……”的语义关系。将“职责”改为“职守”，并将末句改为“各人按自己的职分”，更清楚地呈现为祭司和利未人逐一设定其工作范围。
