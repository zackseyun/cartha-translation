  text: וְ/טִֽהַרְתִּ֖י/ם מִ/כָּל נֵכָ֑ר וָ/אַעֲמִ֧ידָ/ה מִשְׁמָר֛וֹת לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם אִ֥ישׁ בִּ/מְלַאכְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/030.yaml
  text: So I cleansed them from everything foreign[a], and I assigned duties for the priests and for the Levites, each in his work,
translation:
  language: zh_hans
  text: 于是，我洁净他们，除去他们中一切外来的成分；又为祭司和利未人设立职守[a]，各人按自己的职分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “职守”或译“班次”“服事安排”。
    reason: 希伯来词 מִשְׁמָרוֹת 可指职守、轮值班次或所安排的服事任务；此处语义侧重不能完全确定。
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: 于是，我洁净了他们
  rationale: טהר的 piel 形表示“洁净、使纯净”；“于是”体现前文改革行动所带来的承接和结果关系。“他们”保留希伯来文第三人称复数宾语，不擅自限定所指。
- source_word: מִכָּל נֵכָר
  choice: 使他们脱离一切外来的事物
  rationale: נֵכָר指外来的、异己的事物或成分，原文并未明确限于外族人；此译保留其宽泛含义，也使“洁净……脱离……”符合现代汉语表达。
- source_word: וָאַעֲמִידָה
  choice: 又……安排
  rationale: עמד的使役形在此有设置、委派、确立之意；与后面的职责搭配时，“安排”自然地表达行政性整顿。
- source_word: מִשְׁמָרוֹת
  choice: 职责
  rationale: 该词可指轮值、班次、职守或受托的服事任务；“职责”在上下文中清楚自然，同时以脚注保留其他可能译法。
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: 为祭司和利未人
  rationale: 准确保留两个服事群体以及希伯来文介词所表达的安排对象。
- source_word: אִישׁ בִּמְלַאכְתּוֹ
  choice: 各人各按其职
  rationale: אִישׁ在此具有逐一分配的作用；מְלָאכָה指工作、任务或职事。“各人各按其职”简洁地传达每人承担自己工作范围的意思。
theological_decisions:
- issue: “他们”及“一切外来的事物”的范围
  choice: 保留泛指，表达相关群体从一切外来成分中得洁净
  alternative: 具体译为“我洁净他们，使他们离开所有外族人”或限定为外族女子
  rationale: 原文的宾语代词和נֵכָר都没有在本句中作更具体的限定。上下文涉及尼希米的圣约改革，但译文不应把本句收窄为单指族裔或婚姻问题。
- issue: אִישׁ的分配性阳性表达
  choice: 各人各按其职
  alternative: 每个男人各做自己的工作
  rationale: 此处重点是祭司和利未人中每一位成员的职责分配，而非强调生理性别；“各人”既保留逐一分配的意义，也符合现代汉语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“洁净”保留礼仪与圣约改革语境中的用词；分号呈现两项相连的改革行动。脚注标记置于其实际解释的“职责”之后。
