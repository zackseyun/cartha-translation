base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/027.yaml
  text: Should we then listen to you and do all this great evil[b][a], acting unfaithfully against our God by marrying foreign women?
translation:
  language: zh_hans
  text: 难道我们还要听从你们，行这一切大恶事，对我们的上帝不忠，娶外族女子为妻[a]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “娶外族女子为妻”直译为“使外族女子住下”；本段语境指把她们接入家中作妻子。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִשְׁמַע ... וְלָכֶם
  choice: 难道我们要听从你们
  rationale: 将 שׁמע 的尼法勒式按此处反问语境理解为“听从、依从”，并把 לָכֶם 处理为其对象；“难道”自然传达希伯来语疑问词的责问语气。另有非人称式“这种事岂可在你们中间听闻”的分析，但上下文中直接责问的理解更合适。
- source_word: לַעֲשֹׂת אֵת כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: 行这一切大恶
  rationale: 保留 עשה 的基本义“行”，并以“这一切大恶”传达 כָּל、指示词及“重大邪恶”的整体力度。
- source_word: לִמְעֹל בֵּאלֹהֵינוּ
  choice: 背信于我们的上帝
  rationale: מעל 表示失信、背信，常带关系或盟约层面的不忠；“背信于”既保留其神学分量，也避免将含义限定为礼仪性的“干犯”。
- source_word: לְהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: 娶外族女子为妻
  rationale: הושיב 字面为“使……居住”，但在本段婚姻语境中指把外族女子接入家中作妻子；正文采用自然明确的语境义，字面形式置于脚注。
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: 外族女子
  rationale: “外族”比现代政治意义较强的“外国”更贴合古代族群语境；保留“女子”，婚姻关系由“娶……为妻”表达。
theological_decisions:
- issue: לִמְעֹל בֵּאלֹהֵינוּ 所指罪行的性质
  choice: 对上帝背信
  alternative: 一般性地得罪上帝；在礼仪上干犯上帝
  rationale: מעל 通常强调关系或盟约中的失信。译作“背信于我们的上帝”保留这种张力，同时不把本节限定为纯礼仪范畴。
- issue: 外族婚姻受责备的表达范围
  choice: 按本段叙事直接译出“娶外族女子为妻”
  alternative: 将其概括为对所有跨族婚姻的普遍判断
  rationale: 原文在尼希米记特定群体、信仰忠诚与盟约危机的语境中发出责问；译文不额外扩展其适用范围，也不淡化原文的严厉评价。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面语。“难道……吗”保留强烈反问；“背信”呈现盟约性不忠而不过度术语化。脚注标记置于正文句末，说明其所涉及的婚姻短语。
