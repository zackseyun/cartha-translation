source:
  edition: WLC
  text: וּ/בְ/כָל זֶ֕ה לֹ֥א הָיִ֖יתִי בִּֽ/ירוּשָׁלִָ֑ם כִּ֡י בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וּ/שְׁתַּ֜יִם לְ/אַרְתַּחְשַׁ֤סְתְּא מֶֽלֶךְ בָּבֶל֙ בָּ֣אתִי אֶל הַ/מֶּ֔לֶךְ וּ/לְ/קֵ֥ץ יָמִ֖ים נִשְׁאַ֥לְתִּי מִן הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/006.yaml
  text: But during all this I was not in Jerusalem[a], for in the thirty-second year of Artaxerxes king of Babylon I went to the king[b], and after some time I asked leave from the king.
translation:
  language: zh_hans
  text: 在这一切事发生期间，我不在耶路撒冷；因为在巴比伦王[a]亚达薛西在位第三十二年，我去见王。过了一段日子[b]，我向王请求准我离开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“巴比伦王”。这里按经文原样翻译，没有依照当时波斯帝国的历史背景改作“波斯王”。
    reason: textual_variant
  - marker: b
    text: 或译：“到了一些日子的尽头”；意思是“过了一段时间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֶה
  choice: 在这一切事发生期间
  rationale: 将介词短语理解为时间背景，说明前述事情发生时尼希米一直不在场；同时以自然汉语表达连接词的承接作用。
- source_word: לֹא הָיִיתִי בִּירוּשָׁלִָם
  choice: 我不在耶路撒冷
  rationale: 直译过去叙事中的缺席状态，简洁自然。
- source_word: כִּי
  choice: 因为
  rationale: 引出尼希米不在耶路撒冷的原因。
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם
  choice: 三十二年
  rationale: 按汉语惯用方式表达君王在位纪年。
- source_word: לְאַרְתַּחְשַׁסְתְּא
  choice: 亚达薛西
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 忠实保留马所拉文本的称号，不按波斯帝国的历史背景改写为“波斯王”。
- source_word: בָּאתִי אֶל הַמֶּלֶךְ
  choice: 我到王那里去
  rationale: בוא可依叙事视角译作“来”或“去”；此处用“去”符合尼希米离开耶路撒冷、前往王处的汉语叙事视角。
- source_word: וּלְקֵץ יָמִים
  choice: 过了一段日子
  rationale: 该短语字面为“到了一些日子的尽头”，此处表示一段未明确长度的时间；译文既自然，又保留“日子”的原文意象。
- source_word: נִשְׁאַלְתִּי מִן הַמֶּלֶךְ
  choice: 我向王请假
  rationale: 按语境将שאל的被动词干形式表达为向王请求准假；避免译成“王准了我的假”，因为原句着重请求本身，未在此明确陈述获准的结果。
theological_decisions:
- issue: 亚达薛西的王号与波斯时期历史背景之间的张力
  choice: 巴比伦王
  alternative: 波斯王
  rationale: WLC原文明确写作מֶלֶךְ בָּבֶל，故正文按原文保留“巴比伦王”，不以历史协调取代文本证据。
- issue: 请假是否明确包含已经获准
  choice: 我向王请假
  alternative: 王准我离开
  rationale: 译文保留请求与获准之间的潜在张力，不把上下文可能暗示的结果直接写进本句。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“在这一切事发生期间”清楚交代时间背景；“过了一段日子”保留原文意象而不显生硬。脚注标记按其实际所注释的词语放置：有关王号的脚注置于“亚达薛西”之后，有关时间短语的脚注置于“过了一段日子”之后。
