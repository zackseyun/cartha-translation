  text: וַ/יֵּ֥רַֽע לִ֖/י מְאֹ֑ד וָֽ/אַשְׁלִ֜יכָ/ה אֶֽת כָּל כְּלֵ֧י בֵית טוֹבִיָּ֛ה הַ/ח֖וּץ מִן הַ/לִּשְׁכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/008.yaml
  text: And it displeased me greatly[b][a], and I threw all the household goods of Tobiah out of the chamber.
translation:
  language: zh_hans
  text: 我非常不悦，就把多比雅的一切物品[a]都从那房间[b]里扔了出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“多比雅家里的一切器物。”希伯来语所用的词含义较广，可指器皿、用具、陈设或财物。
    reason: lexical_alternative
  - marker: b
    text: 这里的“房间”指圣殿建筑群中的一间房。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרַע לִי מְאֹד
  choice: 我非常不悦
  rationale: 该习语直译为“这在我看来非常不好”，表达某事令说话者极其不快。“我非常不悦”既自然凝练，也不把情绪具体化为悲伤或愤怒。
- source_word: וָאַשְׁלִיכָה
  choice: 扔了出去
  rationale: שלך的使役形式表示扔出、抛出；结合הַחוּץ和מן，译作“扔了出去”保留动作的力度与方向。
- source_word: כָּל
  choice: 一切
  rationale: 表达完整、无一遗漏的范围，与“物品”搭配自然。
- source_word: כְּלֵי בֵית טוֹבִיָּה
  choice: 多比雅的一切物品
  rationale: כְּלִי语义宽泛，可指器具、用品、家具或财物；בֵית在这里可涉及家宅或家中所属之物。正文采用宽泛自然的“物品”，避免误解为圣殿礼仪器皿，并以脚注保留更贴近形式的译法。
- source_word: הַחוּץ מִן הַלִּשְׁכָּה
  choice: 从那房间里……出去
  rationale: 该结构表示由房间内部向外移动；中文用“从……里扔了出去”自然呈现起点与方向。
- source_word: הַלִּשְׁכָּה
  choice: 那房间
  rationale: לִשְׁכָּה指建筑群中的房间或厢房；本段语境是圣殿院区。正文用现代通俗的“房间”，脚注交代其位置。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“非常不悦”保留原文评价性习语，不额外指定为悲伤或愤怒；“扔了出去”体现原文动作的果断有力。脚注标记按正文出现顺序排列。
