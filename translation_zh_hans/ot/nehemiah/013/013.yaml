base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/013.yaml
  text: And I appointed over the storerooms Shelemiah the priest[a], Zadok the scribe, and Pedaiah from the Levites, and Hanan son of Zaccur, son of Mattaniah, at their side, because they were considered faithful[c][b]; and it was upon them to distribute to their brothers.
translation:
  language: zh_hans
  text: 我委派祭司示利米雅、文士撒督和利未人毗大雅管理库房；又委派哈难——撒刻的儿子、玛他尼的孙子——在他们身边任职[a]。这些人被认为忠信可靠[b]；他们负责分给自己的弟兄[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他们手下任职”。这个希伯来语习语既可表示在旁共事，也可表示受其指挥。
    reason: lexical_alternative
  - marker: b
    text: 或译“被认定为可信赖的人”。
    reason: lexical_alternative
  - marker: c
    text: “弟兄”直译希伯来语的阳性称谓；这里指他们在共同体中的同伴。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹצְרָה עַל אוֹצָרוֹת
  choice: 我委派……管理库房
  rationale: 该动词在这里表示任命人员掌管事务；结合介词短语“在库房之上”，译为“委派……管理库房”既体现行政任命，也符合现代汉语表达。
- source_word: שֶׁלֶמְיָה הַכֹּהֵן
  choice: 祭司示利米雅
  rationale: 按现代汉语通常语序先列职衔，再音译人名。
- source_word: צָדוֹק הַסּוֹפֵר
  choice: 文士撒督
  rationale: סֹפֵר可指文士、书记或行政官员；“文士”保留其传统职衔的宽泛含义，不进一步限定具体官职。
- source_word: וּפְדָיָה מִן הַלְוִיִּם
  choice: 利未人毗大雅
  rationale: 原文直译为“来自利未人中的毗大雅”，汉语以“利未人毗大雅”自然表达其群体身份。
- source_word: וְעַל יָדָם
  choice: 在他们身边任职
  rationale: 该习语可表示在某人身边共事，也可能含有受其指挥的意味；正文采用不明确规定等级关系的表达，并以脚注保留另一可能。
- source_word: חָנָן בֶּן זַכּוּר בֶּן מַתַּנְיָה
  choice: 玛他尼的孙子、撒刻的儿子哈难
  rationale: 按汉语自然的谱系表达重组“哈难，撒刻之子，玛他尼之孙”，不改变亲属关系。
- source_word: כִּי נֶאֱמָנִים נֶחְשָׁבוּ
  choice: 这些人被认为忠信可靠
  rationale: נֶאֱמָנִים兼有忠信、可信赖之意，נֶחְשָׁבוּ表示被认定或看作；译文保留外界评价和品格可靠这两层意思。
- source_word: וַעֲלֵיהֶם לַחֲלֹק
  choice: 负责分配
  rationale: וַעֲלֵיהֶם表示责任落在他们身上，לַחֲלֹק在物资供应语境中指按份分发。
- source_word: לַאֲחֵיהֶם
  choice: 给他们的弟兄
  rationale: 保留原文阳性复数亲属称谓“弟兄”，不将所指范围擅自限定为利未人或全体以色列人。
theological_decisions:
- issue: אֲחֵיהֶם的性别和群体范围
  choice: 他们的弟兄
  alternative: 他们的同胞／同族人／其他利未人
  rationale: 原文使用阳性复数亲属词“弟兄”，但本节没有明说其所指仅限哪个群体；正文保留原有称谓，脚注说明这里是共同体中的同伴，避免过度限定。
- issue: עַל יָדָם所表达的职务关系
  choice: 在他们身边任职
  alternative: 在他们手下任职／协助他们
  rationale: 这一习语既可表示紧密共事，也可能指从属关系；正文保留关系上的开放性，不断言哈难必然与前三人同级或必然从属于他们。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“管理库房”“负责分配”清楚呈现圣殿物资管理的行政语境；人名使用中文圣经中常见的音译形式。正文保留“在他们身边任职”的关系歧义及“弟兄”的原文称谓，并借脚注交代其他合理理解。
