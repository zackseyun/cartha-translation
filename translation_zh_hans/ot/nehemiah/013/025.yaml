  text: וָ/אָרִ֤יב עִמָּ/ם֙ וָ/אֲקַֽלְלֵ֔/ם וָ/אַכֶּ֥ה מֵ/הֶ֛ם אֲנָשִׁ֖ים וָֽ/אֶמְרְטֵ֑/ם וָ/אַשְׁבִּיעֵ֣/ם בֵּֽ/אלֹהִ֗ים אִם תִּתְּנ֤וּ בְנֹֽתֵי/כֶם֙ לִ/בְנֵי/הֶ֔ם וְ/אִם תִּשְׂאוּ֙ מִ/בְּנֹ֣תֵי/הֶ֔ם לִ/בְנֵי/כֶ֖ם וְ/לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/025.yaml
  text: 'So I contended with them and cursed them[a], and I struck some of the men and pulled out their hair, and I made them swear by God: “You shall not give your daughters to their sons[b], nor take any of their daughters for your sons or for yourselves.”'
translation:
  language: zh_hans
  text: 于是我与他们争辩，咒诅他们[a]，又打了其中一些人，扯掉他们的头发。我叫他们指着上帝起誓：“你们不可把自己的女儿嫁给他们的儿子[b]，也不可从他们的女儿中为你们的儿子或你们自己娶妻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向他们宣告咒诅。”
    reason: “咒诅”可指对他们宣告咒诅或咒罚，并非仅指辱骂；此动作应与后文使他们起誓分别理解。
  - marker: b
    text: 希伯来文直译为“如果你们把……；如果你们娶……”。在起誓的语境中，这种说法表达严厉的禁止。
    reason: 保留 אִם 的字面条件句形式及其在誓言中的禁止语力。
lexical_decisions:
- source_word: וָאָרִיב
  choice: 我斥责他们
  rationale: ריב在此带有争辩、责难和追究的意味；“斥责”在现代汉语中自然地表达尼希米对他们的严厉责问，又不额外加入正式审判程序。
- source_word: וָאֲקַלְלֵם
  choice: 咒诅他们
  rationale: קלל在此最自然地指发出咒诅或宣布咒诅，不宜弱化为单纯辱骂；“咒诅”保留原文的强烈措辞。
- source_word: וָאַכֶּה מֵהֶם אֲנָשִׁים
  choice: 打了其中一些人
  rationale: מן表示从这群人中取一部分；译文既保留身体暴力的直接叙述，也不把 מכה 夸大成原文未明说的严重殴打。
- source_word: וָאֶמְרְטֵם
  choice: 拔下他们的头发
  rationale: מרט指拔、扯毛发；希伯来文以人称后缀指受罚者，汉语需明说隐含的“头发”才自然清楚。
- source_word: וָאַשְׁבִּיעֵם בֵּאלֹהִים
  choice: 我叫他们指着上帝起誓
  rationale: שבע的使役式表示使人起誓；בֵּאלֹהִים在誓言语境中表示以上帝为誓言的凭据。“指着上帝起誓”符合现代汉语的庄重表达。
- source_word: אִם תִּתְּנוּ
  choice: 你们不可……嫁给
  rationale: אִם在起誓语境中引出带有自我咒诅背景的誓言内容，实际语力为严禁；汉语用“不可”清楚传达这一功能，同时在脚注保留字面结构。
- source_word: בְּנֹתֵיכֶם לִבְנֵיהֶם
  choice: 把自己的女儿嫁给他们的儿子
  rationale: 这是把女儿给人作妻子的婚姻用语；汉语用“嫁给”明确婚姻含义，并保留关系方向。
- source_word: וְאִם תִּשְׂאוּ מִבְּנֹתֵיהֶם
  choice: 也不可从他们的女儿中娶妻
  rationale: נשא在此为娶妻用语。“从……中娶妻”保留介词 מן 的取自含义，也比字面“带走女儿”更准确自然。
- source_word: לִבְנֵיכֶם וְלָכֶם
  choice: 给你们的儿子或你们自己
  rationale: 禁令同时涵盖为儿子娶妻和本人娶妻两种情形；否定句中用“或”自然表达任何一种都不许可。
theological_decisions:
- issue: 如何呈现尼希米以暴力执行群体纪律的行为
  choice: 直译咒诅、击打和拔头发等行为，不作道德评注
  alternative: 弱化为口头责备，或强化为严酷殴打
  rationale: 本节直接叙述尼希米的严厉行动。译文应保留叙事中的张力，既不因神学或伦理顾虑淡化，也不超出希伯来文加重暴力程度。
- issue: 誓言中 אִם 所引分句的语力
  choice: 正文译为禁止式“不可”
  alternative: 按形式直译为“如果你们……”
  rationale: 在使人起誓之后，אִם可引出省略了惩罚后果的誓言公式，语用上表达坚决禁止。正文采用自然汉语的禁止式，脚注同时保存希伯来文的形式信息。
- issue: “指着上帝起誓”与咒诅的关系
  choice: 将 וָאֲקַלְלֵם 与后面的使其起誓分别翻译
  alternative: 把“咒诅他们”解释并合并为“叫他们在上帝面前起誓”
  rationale: 马所拉文本把两个不同动词及其动作依次列出。虽然语境可能使咒诅带有立誓制裁色彩，但不应在正文中消除两者的区别。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。以“斥责”“咒诅”“指着上帝起誓”保留叙事的强烈程度和誓约语气；婚姻表达使用普通读者易懂的“嫁给”“娶妻”。
