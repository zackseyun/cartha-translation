  rationale: 将“我发现”调整为“我得知”，同样表达获知而更贴近叙事报告语气；以“应得的份额”清楚表达利未人未获供应。删除“逃回”的“回”，避免补入原文未明示的返回含义。以“就是做这工的”保留该分词短语对利未人和歌唱者的说明，且不将工作性质具体化。脚注锚点及内容均保留并与修订文本对应。
