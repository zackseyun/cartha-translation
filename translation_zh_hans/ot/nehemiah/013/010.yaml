base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/010.yaml
  text: And I learned that the portions of the Levites had not been given[b][a], so the Levites and the singers who did the work had each fled to his field.
translation:
  language: zh_hans
  text: 我得知，利未人应得的份额[a]没有发给他们，因此利未人和歌唱者，就是做这工的，都各自逃到自己的田地去了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“规定给利未人的份额”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“各人到自己的田地去。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵדְעָה
  choice: 我发现
  rationale: ידע在此叙事语境中表示尼希米获知、察觉这一情况；“发现”比静态的“知道”更自然地表达开始得知。
- source_word: מְנָיוֹת הַלְוִיִּם
  choice: 利未人的份
  rationale: מְנָיוֹת指分配或规定供应的份额；保留简洁的构造关系，并以脚注说明其可理解为规定给利未人的份。
- source_word: לֹא נִתָּנָה
  choice: 没有发给他们
  rationale: 保留נתן被动结构所表达的供应未落实之意；汉语补出“他们”，使接受者明确而不改变原意。
- source_word: וַיִּבְרְחוּ
  choice: 于是……逃回
  rationale: ברח本义为逃离；结合各人回到自己田地的语境，“逃回”自然表达他们因失去供应而离开职守。
- source_word: אִישׁ לְשָׂדֵהוּ
  choice: 都各自逃回自己的田地
  rationale: אִישׁ具有逐一、各自的分配含义；“各自……自己的”在现代汉语中清楚传达这一点。
- source_word: וְהַמְשֹׁרְרִים
  choice: 和歌唱者
  rationale: 按原文直译其圣殿礼仪职分，不额外加入原文未明说的“圣殿”。
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: 负责供职的
  rationale: 该分词短语修饰利未人和歌唱者，指承担相关职务的人；“负责供职的”比泛泛的“做工的”更符合本段圣殿事务语境，同时不细化具体工作。
theological_decisions: []
