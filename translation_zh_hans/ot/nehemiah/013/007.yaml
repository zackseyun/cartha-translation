base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/007.yaml
  text: When I came to Jerusalem[b][a], I understood the evil that Eliashib had done for Tobiah by making a chamber for him in the courts of the house of God.
translation:
  language: zh_hans
  text: 我来到耶路撒冷后，明白了以利亚实为多比雅所做的恶事：他在上帝的殿院内为多比雅安排了一间房间[b]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的殿”指圣殿。
    reason: cultural_note
  - marker: b
    text: “房间”也可译作“屋子”或“内室”；原词指圣殿建筑群内的一间房。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבוֹא לִירוּשָׁלִָם
  choice: 我来到耶路撒冷时
  rationale: 连续叙事形式在本句中兼有时间背景作用；译作“……时”符合现代汉语，也清楚交代尼希米是在抵达后察觉此事。
- source_word: וָאָבִינָה
  choice: 才明白
  rationale: בין 表示明白、察知；“才”自然呈现抵达耶路撒冷后方才认识到此事的语境，但不增添获知方式。
- source_word: בָרָעָה
  choice: 恶事
  rationale: רָעָה 在这里是对行为的道德评价；“恶事”保留其分量，也比抽象的“邪恶”更适合指一项具体行为。
- source_word: אֲשֶׁר עָשָׂה אֶלְיָשִׁיב לְטוֹבִיָּה
  choice: 以利亚实为多比雅所做的恶事
  rationale: לְטוֹבִיָּה 表示为了多比雅或使他得益处；“为多比雅”保留这一受益关系。
- source_word: לַעֲשׂוֹת לוֹ נִשְׁכָּה
  choice: 为多比雅预备了一间屋子
  rationale: לַעֲשׂוֹת 可表达做成、设置或预备；结合既有空间，“预备”比“建造”更谨慎。נִשְׁכָּה 泛指殿宇范围内的房间，不强行限定为储藏室。
- source_word: בְּחַצְרֵי בֵּית הָאֱלֹהִים
  choice: 在上帝殿的院子里
  rationale: בֵּית הָאֱלֹהִים 字面为“上帝的殿/上帝之家”，此处明确指圣殿；חַצְרֵי 是复数，但汉语集合表达“院子里”自然且不改变地点含义。
theological_decisions:
- issue: 如何表达以利亚实行为的道德性质
  choice: 恶事
  alternative: 错事；坏事
  rationale: 原文 רָעָה 明确带有道德谴责；“恶事”保留这种力度，又不额外说明其罪责性质。
- issue: “上帝的殿”与“上帝之家”
  choice: 上帝殿
  alternative: 上帝之家；圣殿
  rationale: “上帝殿”既贴近 בֵּית הָאֱלֹהִים，又让现代读者明白这里是圣殿建筑群；脚注说明其所指，不在正文中扩展解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文保留“恶事”的道德力度，以“预备了一间屋子”避免把原文具体化为新建或储藏用途；专名采用通行圣经译名“以利亚实”“多比雅”。
