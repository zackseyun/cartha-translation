id: NEH.13.14
reference: Nehemiah 13:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י עַל זֹ֑את וְ/אַל תֶּ֣מַח חֲסָדַ֗/י אֲשֶׁ֥ר עָשִׂ֛יתִי בְּ/בֵ֥ית אֱלֹהַ֖/י וּ/בְ/מִשְׁמָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/014.yaml
  text: Remember me for this[a], my God[b], and do not wipe out my deeds of covenant faithfulness that I have done for the house of my God and for its services.
translation:
  language: zh_hans
  text: 我的上帝啊，求你因这事记念我，不要抹去我为我上帝的殿和其中的职守所行的忠信之事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信之事”也可译作“忠诚的行为”“慈爱之举”。“职守”也可译作“职责”或“当守之务”，指与上帝的殿有关的各项责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי ... עַל זֹאת
  choice: 求你因这事记念我
  rationale: 祈使式祷告中，לִי指被记念的人，עַל זֹאת回指前述之事；译文采用自然的现代汉语，同时保留祈求和因由。
- source_word: אֱלֹהַי
  choice: 我的上帝啊
  rationale: 保留第一人称单数所属关系和直接呼告的语气。
- source_word: וְאַל תֶּמַח
  choice: 不要抹去
  rationale: מחה有擦去、涂抹、除掉之意；“抹去”保留从记录或记忆中除去的意象。
- source_word: חֲסָדַי
  choice: 我……所行的忠信之事
  rationale: חסד可表达慈爱、忠诚或盟约忠信；此处为复数，并由“我所行的”加以说明，指尼希米以忠诚付诸实行的事。
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: 我……所行的
  rationale: 作为关系从句修饰חֲסָדַי，简洁保留行动意义。
- source_word: בְּבֵית אֱלֹהַי
  choice: 为我上帝的殿
  rationale: בְ本可作“在……中”，但在此语境中指为上帝的殿及其事务所做的事；“为”较自然地传达关联和投入。
- source_word: וּבְמִשְׁמָרָיו
  choice: 和其中的职守
  rationale: מִשְׁמָר可指职分、职责、当守之务；此处指与圣殿有关的各项职责。“其中”明确其所指为上帝的殿。
theological_decisions:
- issue: 第一人称祷告中חֲסָדַי的含义
  choice: 忠信之事
  alternative: 善行；慈爱之举；忠诚的行为
  rationale: 该词既可能强调仁慈，也可能强调忠诚或盟约忠信。译作“忠信之事”保留其神学分量，却不把经文解释成靠功德称义。
- issue: 祷告可能呈现的自我功劳色彩
  choice: 保留尼希米求上帝记念其所行之事的直接诉求
  alternative: 以释义弱化第一人称诉求
  rationale: 希伯来文本明确记录这一祈求；翻译应保存其张力，不因神学顾虑而淡化。
translation_notes:
  register: 采用现代、庄重而易懂的祷告体。“我的上帝啊”保留直接呼告；“忠信之事”兼顾חסד的忠诚、慈爱和盟约色彩；将两个主要词汇歧义合并收入同一脚注，且标记已置于正文。
