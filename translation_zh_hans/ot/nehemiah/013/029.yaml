  naturalness: “我的上帝啊，求你记住他们”可以理解，但祷告语境中“求你记念他们”更庄重、自然，也更贴近圣经汉语常用的祈求措辞。以“玷污了……以及……”连接两个受词，可避免不必要的重复，句子更流畅。
  terminology: “祭司职分”恰当表达הַכְּהֻנָּה的抽象意义；“祭司职分和利未人之约”保留了原文压缩的属格／并列关系，未擅自界定该约是与谁所立。现有脚注的引文误作“玷污祭司职分、祭司职分和利未人之约的人”，造成宾语重复且缺乏清楚的并列连接，必须修正。
