  text: זָכְרָ֥/ה לָ/הֶ֖ם אֱלֹהָ֑/י עַ֚ל גָּאֳלֵ֣י הַ/כְּהֻנָּ֔ה וּ/בְרִ֥ית הַ/כְּהֻנָּ֖ה וְ/הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/029.yaml
  text: Remember them[a], my God, because they have defiled the priesthood and the covenant of the priesthood and the Levites.
translation:
  language: zh_hans
  text: 我的上帝啊，求你记念他们[a]，因为他们玷污了祭司职分，以及祭司职分和利未人之约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“我的上帝啊，求你记念他们，关于那些玷污祭司职分，以及祭司职分和利未人之约的人。”
    reason: 原文“玷污”是作名词用的分词，עַל也可译作“因、关于”；主文为使汉语自然，将其处理为说明原因的动词分句。
lexical_decisions:
- source_word: זָכְרָה
  choice: 求你记住
  rationale: 这是尼希米向上帝发出的直接祈求。“求你记住”既保留动词“记念、记住”的基本意义，也以自然的现代汉语表达祈使语气；不把动词本身直接释为“惩罚”。
- source_word: לָהֶם
  choice: 他们
  rationale: 介词 ל 加第三人称复数后缀在 זכר 之后可自然译为“他们”。上下文使这次“记住”带有不利、审判性的意味，但这一意味由后面的罪状表明，无须在代词中增译“对付”。
- source_word: אֱלֹהָי
  choice: 我的上帝啊
  rationale: 原文为“上帝”加第一人称单数后缀；“啊”自然表达祷告中的直接呼告。
- source_word: עַל
  choice: 因为
  rationale: 此处 עַל 引出祈求的根据，即这些人所犯的罪。“因为”在现代汉语中清楚表达其因由关系。
- source_word: גָּאֳלֵי
  choice: 他们玷污了
  rationale: 该词是 גאל“玷污”的复数分词，作实体性用法，直译可为“玷污……的人”。主文改用动词分句，使汉语自然清楚，同时保留其负面意义；此处并非“救赎”之义。
- source_word: הַכְּהֻנָּה
  choice: 祭司的职分
  rationale: 该抽象名词指祭司身份、职务或制度，而不只是祭司个人。“祭司的职分”比单译“祭司”更准确，也比“祭司制度”更符合经文语境。
- source_word: וּבְרִית הַכְּהֻנָּה
  choice: 祭司职分……的约
  rationale: 保留原文“约”与“祭司职分”之间压缩的属格关系，不擅自明确为“与祭司所立的约”或其他较具体的解释。
- source_word: וְהַלְוִיִּם
  choice: 和利未人
  rationale: 按原文把“利未人”与前面的“祭司职分”并列，并让二者共同受“约”支配；此译法避免把利未人误作另一个被玷污的独立宾语。
theological_decisions:
- issue: 祈求上帝“记住”这些人是有利还是不利
  choice: 保留“记住”的基本表达，由玷污圣职与约的罪状显明其审判性质
  alternative: 直接译为“求你惩罚他们”或只作中性理解
  rationale: 原文动词本身是“记念、记住”，在不同语境中可有正面或负面含义。本节的指控清楚表明这是不利的记念，但把它直接改成“惩罚”会消除原文措辞及其张力。
- issue: “祭司职分和利未人的约”的范围
  choice: 理解为一个涉及祭司职分和利未人的约，同时保留压缩的句法
  alternative: 只把“约”与祭司职分相连，再把“利未人”视为独立宾语；或明确译成“与祭司和利未人所立的约”
  rationale: 原文最自然地把“利未人”与“祭司职分”并列在“约”之下，但属格的具体性质并未展开。译文保持这一关系，不进一步规定约究竟是“与他们所立”还是“关于他们职分”的约。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“我的上帝啊，求你……”符合尼希米祷告的直接语气；用“祭司的职分”表达抽象名词，避免古奥的“祭司职”或可能过度制度化的“祭司制度”。主文略作句法展开，以两个“玷污了”清楚标示两个宾语，同时不消除原文关于“约”的关系所保留的含混。
