  text: וְ/לִ/פְנֵ֣י מִ/זֶּ֔ה אֶלְיָשִׁיב֙ הַ/כֹּהֵ֔ן נָת֖וּן בְּ/לִשְׁכַּ֣ת בֵּית אֱלֹהֵ֑י/נוּ קָר֖וֹב לְ/טוֹבִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/004.yaml
  text: Before this[a], Eliashib the priest, who had been appointed over the chamber of the house of our God, was related to Tobiah—
translation:
  language: zh_hans
  text: 在这以前，祭司以利亚实曾受派管理我们神的殿里的一间房；他与多比雅关系密切[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“是多比雅的亲属”或“与多比雅交好”。希伯来语可表示亲属关系，也可表示社会关系上的亲近。
    reason: 保留 קָרוֹב לְ 在亲属关系与社会交往关系之间的词义开放性。
lexical_decisions:
- source_word: וְלִפְנֵי מִזֶּה
  choice: 在这事以前
  rationale: 按时间意义译出“在此事以前”；句首的 וְ 在中文中无需机械译作“而/并且”，上下文衔接已足够清楚。
- source_word: אֶלְיָשִׁיב הַכֹּהֵן
  choice: 祭司以利亚实
  rationale: 按现代汉语习惯将职分置于人名前；专名采用通行圣经译名。
- source_word: נָתוּן בְּלִשְׁכַּת
  choice: 受派管理……一间房
  rationale: נָתוּן 在此可表达被指派、被安置负责某事；结合圣殿房间的语境译作“受派管理”，避免误解为仅仅身处房内。
- source_word: בֵּית אֱלֹהֵינוּ
  choice: 我们神殿里
  rationale: “神的殿”在现代汉语中自然合成为“神殿”；保留第一人称复数“我们”。
- source_word: לִשְׁכַּת
  choice: 一间房
  rationale: 该词指建筑中的房间，圣殿语境下也可能是储藏室；正文采用较宽泛的“房”，不把具体用途写死。
- source_word: קָרוֹב לְטוֹבִיָּה
  choice: 与多比雅关系亲近
  rationale: קָרוֹב לְ 可指亲属关系，也可指社会交往上的亲近；“关系亲近”保留这种语义幅度，不断定二人必有血缘或姻亲关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一间房”避免过早限定为储藏室；破折号保留原段落尚未说完、下节继续展开的叙事效果。
