  yaml_path: translation/ot/nehemiah/013/012.yaml
  text: And all Judah brought the tithe of the grain[a], the new wine, and the oil into the storehouses.
translation:
  language: zh_hans
  text: 犹大众人把五谷、新酒和油的十分之一送进库房[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“府库”。希伯来语这个词既可指储藏物资的房间，也可指存放财物的府库；这里所列的是五谷、新酒和油，因此正文译作“库房”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: 犹大众人
  rationale: כָּל加地名在这里指犹大整个群体；译为“犹大众人”既自然，也避免把行动主体误解为地理区域本身。句首连接词וְ按中文叙事习惯不另译。
- source_word: הֵבִיאוּ
  choice: 送进
  rationale: בוא的使役形表示“带来、送入”；目的地是库房，译为“送进”清楚表达向内运送的动作。
- source_word: מַעְשַׂר
  choice: 十分之一
  rationale: 这是指按规定献纳的十分之一。现代中文“十分之一”直接明白，也保留希伯来文单数集合用法；其范围包括后列的五谷、新酒和油。
- source_word: הַ/דָּגָן
  choice: 五谷
  rationale: דָּגָן泛指粮食谷物；“五谷”是现代中文圣经语境中自然且概括性的表达，并非限定为严格的五种作物。
- source_word: וְ/הַ/תִּירוֹשׁ
  choice: 新酒
  rationale: תִּירוֹשׁ通常指新酿或新产的酒，与泛称酒的יַיִן有所区别；“新酒”保留这一词义差别。
- source_word: וְ/הַ/יִּצְהָר
  choice: 油
  rationale: יִצְהָר在农产清单中通常指油，多为橄榄油；正文译作“油”既自然，也不加入原文未明说的作物种类。
- source_word: לָ/אוֹצָרוֹת
  choice: 进库房
  rationale: אוֹצָרוֹת为复数，可指储藏物资的房间，也可指府库；本节所存的是五谷、酒和油，因此“库房”最合语境。
