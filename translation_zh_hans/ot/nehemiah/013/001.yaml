  source_fidelity: 正文准确传达了经文的时间、公开宣读、所发现的书面规定、亚扪人与摩押人、上帝的会众及持续性禁令。但“在百姓耳中”是对希伯来语习语的逐词移植，不合现代汉语；“书中有话写着”也没有明确表达“发现（其中）写着”。《摩西书》作为固定书名不够稳妥，原文只称“摩西的书”，并未给出该书名。
  naturalness: “在百姓耳中诵读”明显生硬，应改为“向百姓诵读”或“读给百姓听”。“发现其中写着”既自然，也保留原文的发现性表述。
  terminology: “上帝的会众”可保留，既对应קהל אלהים，也避免后期教会制度用语。“亚扪人或摩押人”在否定禁令中较清楚地表达两类人任何一类均不得进入。“摩西的书”比《摩西书》更贴近原文且不误作现代固定书名。
