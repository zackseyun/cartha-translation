source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נִקְרָ֛א בְּ/סֵ֥פֶר מֹשֶׁ֖ה בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/נִמְצָא֙ כָּת֣וּב בּ֔/וֹ אֲ֠שֶׁר לֹא יָב֨וֹא עַמֹּנִ֧י וּ/מֹאָבִ֛י בִּ/קְהַ֥ל הָ/אֱלֹהִ֖ים עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
translation:
  language: zh_hans
  text: 那一天，有人向百姓诵读摩西的书[a]，发现其中写着：亚扪人或摩押人永不可进入上帝的会众[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书”也可译作“书卷”；希伯来语这个词可指书或卷轴。
    reason: lexical_alternative
  - marker: b
    text: “会众”也可译作“集会”。
    reason: lexical_alternative
  - marker: c
    text: “永远”即“直到永远”或“世世代代”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 指向特定的一天，简洁保留希伯来语的时间表达。
- source_word: נִקְרָא
  choice: 有人……诵读
  rationale: 该动词为被动或无人称用法；中文用“有人诵读”自然表达未指明朗读者的公开宣读，又不额外强调原文未明说的“高声”。
- source_word: בְּסֵפֶר מֹשֶׁה
  choice: 《摩西书》
  rationale: סֵפֶר 可指书、卷轴或文书；正文采用现代中文中清楚而庄重的书名形式，并以脚注保留“书卷”的可能。
- source_word: בְּאָזְנֵי הָעָם
  choice: 在百姓耳中
  rationale: 较贴近原文“在百姓耳中”的身体意象，同时在“诵读”语境中可自然理解为让百姓听见。
- source_word: וְנִמְצָא כָּתוּב בּוֹ
  choice: 书中有话写着
  rationale: 用自然中文传达“发现其中写着”的结果，不使被动结构显得生硬。
- source_word: עַמֹּנִי וּמֹאָבִי
  choice: 亚扪人和摩押人
  rationale: 保留原文连接词“和”；在否定句中自然表示两类人均在禁令之内。
- source_word: בִּקְהַל הָאֱלֹהִים
  choice: 上帝的会众
  rationale: קָהָל 指聚集的群体或共同体；“会众”既自然又不导入后来的特定教会制度含义。
- source_word: עַד עוֹלָם
  choice: 永远不可
  rationale: 保留法律禁令中持续、无期限的排除意味，现代中文简洁有力。
theological_decisions:
- issue: בִּקְהַל הָאֱלֹהִים 所指共同体的表达
  choice: 上帝的会众
  alternative: 上帝的集会
  rationale: “会众”保留这是属于上帝并聚集为群体的含义，同时避免把它专门解释成后世某种教会组织。
- issue: עַד עוֹלָם 在禁令中的效力
  choice: 永远不可进入
  alternative: 不可进入，直到永远
  rationale: 正文直接传达原文所述禁令的长久效力，不对其与其他经文的关系作额外神学调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“有人……诵读”处理希伯来语无人称/被动结构；保留“在百姓耳中”的原文意象。脚注标记均置于正文相应词语之后，并按出现顺序排列。
