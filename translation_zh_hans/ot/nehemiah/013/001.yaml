revisions:
- from: 那一天，有人在百姓耳中诵读《摩西书》[a]，书中有话写着：亚扪人和摩押人永远不可进入上帝的会众[b][c]。
  to: 那一天，有人向百姓诵读摩西的书[a]，发现其中写着：亚扪人或摩押人永不可进入上帝的会众[b][c]。
  rationale: 修订以自然现代汉语表达“在百姓耳中”的公开聆听含义，并恢复“发现其中写着”的叙述成分。将《摩西书》改为“摩西的书”，避免把原文的属格短语过度定为固定书名。其余关键术语及脚注锚点均保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:15Z'
review_pass:
