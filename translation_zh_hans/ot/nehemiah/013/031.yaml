base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/031.yaml
  text: And for the offering of wood at appointed times[a], and for the firstfruits—remember me, my God, for good.
translation:
  language: zh_hans
  text: 又为按指定的时候献上木柴和初熟之物的事。我的上帝啊，求你记念我，施恩给我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֻרְבַּן הָעֵצִים
  choice: 献上木柴
  rationale: 该短语指按期为圣殿礼仪供应木柴；译作“献上木柴”既保留献呈含义，也比生硬的“木柴祭”更符合现代汉语。
- source_word: בְּעִתִּים מְזֻמָּנוֹת
  choice: 在指定的日期
  rationale: 表示预先规定、按计划安排的时间；“指定的日期”自然清楚。
- source_word: בִּכּוּרִים
  choice: 初熟之物
  rationale: 指首先成熟并献给上帝的出产；这是简明而有尊严的汉语表达。
- source_word: זָכְרָה לִּי
  choice: 求你记念我
  rationale: 保留尼希米反复出现的祈求句式，并用“求你”自然体现希伯来语祈使形式在祷告中的语气。
- source_word: אֱלֹהַי
  choice: 我的上帝啊
  rationale: 准确表达第一人称所属关系和直接呼告。
- source_word: לְטוֹבָה
  choice: 赐福给我
  rationale: 该短语字面为“为着好处／福祉”，在此祷告中表达求上帝以恩惠相待；“赐福给我”是自然的功能对应，但具体所求之福仍未加限定。
theological_decisions:
- issue: קֻרְבַּן הָעֵצִים 的礼仪含义
  choice: 献上木柴
  alternative: 木柴祭
  rationale: 经文所指是为圣殿祭坛按期供应木柴，不宜让“祭”暗示木柴本身是焚献的祭物；正文采用透明的动词结构，脚注补明背景。
- issue: 末句 לְטוֹבָה 的含义
  choice: 赐福给我
  alternative: 以善意记念我／为我的益处记念我
  rationale: 希伯来语简短，可能涵盖蒙悦纳、恩待或有益的结果。“赐福给我”在现代汉语祷告中自然，同时不具体限定福的形式。
translation_notes:
  register: 采用现代、庄重而易懂的祷告与叙述语言。“记念”保留经文的圣经语体和尼希米记中的重复主题；避免采用可能造成祭物类别误解的“木柴祭”。
