base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/009.yaml
  text: Then I gave the order[a], and they cleansed the chambers; and I brought back there the vessels of the house of God[b], with the grain offering and the frankincense.
translation:
  language: zh_hans
  text: 于是我下令，他们就洁净[a]了那些房间；我又把上帝殿里的器具、素祭和乳香搬回那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洁净”也可译作“使……洁净”；原文既可包含实际清理，也可包含礼仪上除去污秽的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: 于是我吩咐
  rationale: 该词字面为“我说”，但上下文表明尼希米发出随后得到执行的命令；“吩咐”自然传达语境中的施令意味，同时“于是”体现叙事推进。
- source_word: וַיְטַהֲרוּ
  choice: 洁净
  rationale: טהר既可指实际清除污秽，也常含礼仪上的洁净意味；“洁净”比单纯的“打扫干净”更能兼顾两层含义。
- source_word: הַלְּשָׁכוֹת
  choice: 那些房间
  rationale: לשכה指圣殿范围内的房间或屋子；上下文虽可能作储藏之用，但原词本身并不限定为储藏室，因此采用较宽泛自然的“房间”。
- source_word: וָאָשִׁיבָה שָּׁם
  choice: 搬回那里
  rationale: שוב在此为使役意义，即把先前移走的物品带回原处；“搬回那里”适合具体物件，也明确保留שם“那里”。
- source_word: כְּלֵי בֵּית הָאֱלֹהִים
  choice: 上帝殿里的器具
  rationale: כְּלִי泛指器具、用具或物件；在圣殿语境中译作“器具”准确自然。“上帝殿”保留“上帝的殿”这一希伯来表达的核心意象。
- source_word: אֶת הַמִּנְחָה
  choice: 素祭
  rationale: מִנְחָה在祭祀语境中专指以谷物等献上的祭物；“素祭”是现代中文圣经语境中简洁而明确的对应词。句法上将其与器具、乳香并列为搬回去的对象。
- source_word: וְהַלְּבוֹנָה
  choice: 和乳香
  rationale: לְבוֹנָה特指乳香，而非泛指各种香料或香，因此采用精确的“乳香”。
theological_decisions:
- issue: 洁净的性质
  choice: 正文采用可兼具实际与礼仪含义的“洁净”
  alternative: “打扫干净”或“使……礼仪洁净”
  rationale: 原文טהר可涵盖实际清理及礼仪除污，正文不将其限制为其中一种，并以脚注说明其语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“吩咐人洁净”把原文“我说，他们就洁净”的语境施令关系自然化；“那些房间”避免把לשכות过度限定为“储藏室”。正文唯一脚注标记[a]已在相应词语后标出。
