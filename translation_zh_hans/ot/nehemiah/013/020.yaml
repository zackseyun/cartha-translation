base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/020.yaml
  text: Then the merchants and sellers of every kind of goods spent the night outside Jerusalem once or twice[a][b].
translation:
  language: zh_hans
  text: 于是，商人和贩卖各样货物的人在耶路撒冷城外过夜，有一两次。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“一次和两次”，是指“一两次”的习惯说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלִינוּ
  choice: 过夜
  rationale: 该动词源自 לון，表示住宿或度过夜晚；“过夜”自然简洁，并保留明确的时间含义。
- source_word: הָרֹכְלִים
  choice: 商人
  rationale: רֹכֵל 指从事贸易的人；“商人”符合上下文，也与后面的卖货者形成自然搭配。
- source_word: וּמֹכְרֵי כָל מִמְכָּר
  choice: 和贩卖各样货物的人
  rationale: 该短语涵盖各种可出售之物；此译法保留 כָל 的广泛范围，同时采用现代汉语容易理解的表达。
- source_word: מִחוּץ לִירוּשָׁלָם
  choice: 在耶路撒冷城外
  rationale: מִחוּץ 表示位于外面；补出“城”符合汉语习惯，并清楚表明他们在耶路撒冷城墙之外。
- source_word: פַּעַם וּשְׁתָּיִם
  choice: 有一两次
  rationale: 希伯来语字面为“一次和两次”，是表示“一两次”的习语；加入“有”使句子在现代汉语中更自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“过夜”准确传达短期留宿，不暗示长期居住；正文仅保留一个有实际解释价值的脚注，避免为汉语中没有实质差别的近义措辞另设脚注。
