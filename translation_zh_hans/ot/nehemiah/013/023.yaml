id: NEH.13.23
reference: Nehemiah 13:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּ֣ם בַּ/יָּמִ֣ים הָ/הֵ֗ם רָאִ֤יתִי אֶת הַ/יְּהוּדִים֙ הֹשִׁ֗יבוּ נָשִׁים֙ אשדודיות עמוניות מוֹאֲבִיּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/023.yaml
  text: Also in those days I saw the Jews who had married women of Ashdod[a], Ammonite women[b], and Moabite women.
translation:
  language: zh_hans
  text: 那些日子，我也看见犹太人[a]娶了[b]亚实突女子、亚扪女子和摩押女子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”或译“犹大人”。
    reason: lexical_alternative
  - marker: b
    text: “娶了”原文直译为“使女子住下”或“安置了女子”；这里指娶这些女子为妻。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּיָּמִים הָהֵם
  choice: 那些日子，我也
  rationale: 保留时间短语和 גַּם 的追加意味；此语序符合现代汉语叙事习惯。
- source_word: רָאִיתִי
  choice: 我看见
  rationale: 采用普通的视觉动词，保留尼希米亲眼所见的第一人称见证语气。
- source_word: הַיְּהוּדִים
  choice: 犹太人
  rationale: 在被掳归回后的群体语境中，“犹太人”自然明确；原词也可按地域色彩译为“犹大人”，故以脚注保留。
- source_word: הֹשִׁיבוּ נָשִׁים
  choice: 娶了……女子
  rationale: 字面涉及“使……居住/安置”，但在本段婚姻语境中表示娶这些女子为妻；用“娶了”清楚传达该习语，同时以脚注说明字面形式。
- source_word: אשדודיות
  choice: 亚实突女子
  rationale: 该阴性复数族称指来自亚实突的女子；此译简洁自然。
- source_word: עמוניות
  choice: 亚扪女子
  rationale: 按族属阴性复数形式翻译，并采用通行地名“亚扪”。
- source_word: מוֹאֲבִיּוֹת
  choice: 摩押女子
  rationale: 按族属阴性复数形式翻译，并采用通行地名“摩押”。
theological_decisions:
- issue: הַיְּהוּדִים 的群体指称
  choice: 犹太人
  alternative: 犹大人
  rationale: 上下文所指是被掳归回后的盟约群体，“犹太人”在现代汉语中最容易理解；“犹大人”可突出地域来源，故不排除并列入脚注。
- issue: הֹשִׁיבוּ נָשִׁים 的婚姻含义
  choice: 娶了……女子
  alternative: 使女子住下／安置了女子
  rationale: 本节及随后经文明确讨论婚姻和子女，故正文表达其语境中的婚娶含义；脚注保留希伯来语较为特殊的字面表达，避免掩盖原文形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“娶了……女子”避免生硬直译，同时不额外加入对这些婚姻的评价；三个族属名称保持平行结构。
