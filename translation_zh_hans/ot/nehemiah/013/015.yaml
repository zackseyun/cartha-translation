base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/015.yaml
  text: In those days I saw in Judah people treading winepresses on the Sabbath, and bringing in heaps of grain and loading them on donkeys—and also wine, grapes, figs, and every kind of load—and bringing them into Jerusalem on the Sabbath day. So I testified against them on the day they sold food.
translation:
  language: zh_hans
  text: 那些日子，我在犹大看见有人在安息日踩踏酒榨，搬运成堆的谷物，装载在驴背上；又把酒、葡萄、无花果和各样货物，在安息日运进耶路撒冷。他们卖食物的那一天，我就警告他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּרְכִים גִּתּוֹת
  choice: 踩榨酒池
  rationale: 直译为“踩踏酒榨”，所指是在榨酒池中踩压葡萄；“踩榨酒池”既保留原文动作和设施，又符合现代汉语表达。
- source_word: הָעֲרֵמוֹת
  choice: 一堆堆谷物
  rationale: 该词本义为“堆、堆积物”，上下文未明说谷物，但与装驴并列且传统上常理解为谷物堆；补出“谷物”使中文可理解，同时用“一堆堆”保留复数意象。
- source_word: כָל מַשָּׂא
  choice: 各样货物
  rationale: מַשָּׂא意为所负载、所搬运之物；此处处于商业运输语境，“货物”比泛泛的“重担”自然。
- source_word: וָאָעִיד
  choice: 我就警告他们
  rationale: 该动词在此有郑重作证、告诫或警告之意；中文“警告”最能传达尼希米针对违规交易所作的严正劝诫。
- source_word: צָיִד
  choice: 食物
  rationale: 本词可指食物、粮食或供应品；此处是出售的东西，译作“食物”简明且不把范围限定为某一种粮食。
theological_decisions:
- issue: 安息日行为的定性
  choice: 只叙述在安息日生产、运输和售卖，并译出尼希米的警告
  alternative: 直接称这些行为为“亵渎安息日”或“犯罪”
  rationale: 本节原文通过叙事与警告表达谴责，但没有在本句明用“亵渎”或“犯罪”等词；不额外加入神学定性。
- issue: וָאָעִיד 的对象
  choice: 译为“警告他们”，让代词按上下文自然指向从事售卖者
  alternative: 译为“我作证反对他们”或补明某一特定群体
  rationale: 原文未明确另列宾语身份；保留“他们”可避免把对象过度限定为犹大人、商人或耶路撒冷居民。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留叙事中的重复时间表达“在安息日……在安息日”，并以分号整理长串并列项，使普通读者易于朗读和理解。
