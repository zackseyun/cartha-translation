revisions:
- from: 那些日子，我在犹大看见有人在安息日踩榨酒池，又运来一堆堆谷物，驮在驴上；还把酒、葡萄、无花果和各样货物，在安息日运进耶路撒冷。他们卖食物的那一天，我就警告他们。
  to: 那些日子，我在犹大看见有人在安息日踩踏酒榨，搬运成堆的谷物，装载在驴背上；又把酒、葡萄、无花果和各样货物，在安息日运进耶路撒冷。他们卖食物的那一天，我就警告他们。
  rationale: 仅作必要的汉语表达和句法修订：“踩踏酒榨”准确表达踩踏酒榨的动作；“搬运成堆的谷物，装载在驴背上”恢复原文中搬运、装载的关系。保留原文未具体说明的警告对象为“他们”，并保留“食物”对צַיִד的宽泛含义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:27Z'
