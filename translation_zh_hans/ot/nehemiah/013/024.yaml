base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/024.yaml
  text: And half of their children spoke Ashdodite[a], and they were not able to speak Judean, but only the language of one people or another.
translation:
  language: zh_hans
  text: 他们的儿女有一半说亚实突话，不会说犹大话[a]，所说的是按各族的语言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们不懂得说犹大话，而是按各族的语言说话。”
    reason: 原文מכיר与不定式的组合可侧重“不懂得如何”；末句的分配结构可直译为“按各族的语言”。
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: 他们的儿女
  rationale: בנים在此泛指这些混合婚姻家庭的后代；“儿女”自然且不限定为男性。
- source_word: חֲצִי
  choice: 有一半
  rationale: 表示儿女中只有一部分具有下文所述的语言状况；汉语以“有一半”表达最自然。
- source_word: מְדַבֵּר אַשְׁדּוֹדִית
  choice: 说亚实突话
  rationale: 分词描述惯常的语言使用或语言能力；“亚实突话”保留其与亚实突相关的地域—族群语言称谓。
- source_word: וְאֵינָם מַכִּירִים לְדַבֵּר
  choice: 不会说
  rationale: מכיר与不定式连用，在这里指不具备如何说某种语言的知识或能力；“不会说”简洁自然，同时不把原因解释为生理上不能说。
- source_word: יְהוּדִית
  choice: 犹大话
  rationale: 该词指犹大人所用的语言；“犹大话”比笼统的“犹太话”更贴近地域名称，也不擅自将其明确等同于“希伯来语”。
- source_word: וְכִלְשׁוֹן עַם וָעָם
  choice: 说的却是这个族或那个族的语言
  rationale: עַם וָעָם具有逐一分配的语气，指各族不同的语言。“这个族或那个族”在现代汉语中保留这种分配意义；“却是”体现与不会说犹大话之间的对比，但不另加原文未明说的“只”。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“亚实突话”和“犹大话”保留原文的地域—族群语言名称，不把后者直接解释为希伯来语。正文以“不会说”自然表达语言能力，并用脚注保留偏重认知含义的译法；末句不加入原文没有明说的“只”。
