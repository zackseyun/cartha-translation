base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/021.yaml
  text: So I warned them and said to them[a], “Why are you spending the night in front of the wall? If you do it again, I will lay hands on you.” From that time on they did not come on the Sabbath.
translation:
  language: zh_hans
  text: 于是我警告他们，对他们说：“你们为什么在城墙前过夜？如果再这样，我就要对你们动手了[a]。”从那时起，他们在安息日就没有再来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我就要用武力对付你们。”希伯来语这个习语直译为“我要向你们伸出手”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָעִידָה
  choice: 我警告他们
  rationale: 此处希菲勒词形表示郑重警告或告诫；结合尼希米制止商贩行为的语境，“警告”自然且准确。
- source_word: לֵנִים
  choice: 过夜
  rationale: 该词意为住宿、留宿或过夜；“过夜”是现代汉语中简洁自然的表达。
- source_word: נֶגֶד הַחוֹמָה
  choice: 在城墙前
  rationale: נֶגֶד表示在……前面或对面；“在城墙前”保留空间关系，不额外加入原文未明说的“城外”。
- source_word: אִם תִּשְׁנוּ
  choice: 如果再这样
  rationale: שנה在此意为重复、再次做；宾语由上下文补足，“再这样”符合汉语表达。
- source_word: יָד אֶשְׁלַח בָּכֶם
  choice: 我就要对你们动手了
  rationale: 原文直译近于“向你们伸出/派出手”，在此是采取强制行动的威胁；“对你们动手”既保留“手”的意象，也自然传达威慑语气。
- source_word: מִן הָעֵת הַהִיא
  choice: 从那时起
  rationale: 自然表达从某一时点开始持续产生的结果。
- source_word: לֹא בָאוּ בַּשַּׁבָּת
  choice: 他们在安息日就没有再来
  rationale: 否定完成式在结果语境中表明此后停止前来；加入“再”使汉语清楚传达持续性的停止。
theological_decisions: []
