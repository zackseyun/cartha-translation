base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/011.yaml
  text: So I contended with the officials and said[b][a], “Why has the house of God been neglected?” Then I gathered them and stationed them at their posts.
translation:
  language: zh_hans
  text: 于是我责问那些官长，说：“为什么上帝的殿被忽略了呢？”[a] 随后，我把他们召集起来，安置在各自的岗位上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被忽略”也可译作“被离弃”或“被撇下”。原文为被动式；在这里的语境中，指上帝之殿的供给和服事受到忽视。
    reason: lexical_alternative
  - marker: b
    text: 直译为“使他们站在自己的位置上”。这可指让有关人员恢复所分派的职务。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: 我斥责
  rationale: ריב表示争辩、责难或与人理论；此处尼希米针对官长失职提出严厉质问。“斥责”自然传达对抗和责难的语气，又不把它弱化为一般询问。
- source_word: הַסְּגָנִים
  choice: 那些官长
  rationale: סְגָנִים指承担行政职责的官员或副职领袖；“官长”符合古代语境，也为现代中文读者所理解。
- source_word: נֶעֱזַב
  choice: 任凭……被冷落
  rationale: עזב的被动式可指被撇下、离弃。结合上下文，殿并非完全废弃，而是因供给中断、服事人员离岗而无人尽责照管；“任凭……被冷落”保留被撇下的意味及官长放任不管的责任。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  rationale: 直译结构为“上帝的家／殿”。汉语中“上帝的殿”既保留原文的宗教分量，也清楚指向圣殿。
- source_word: וָאֶקְבְּצֵם
  choice: 我把他们召集起来
  rationale: קבץ意为聚集、召集；“召集起来”符合尼希米以行政方式恢复人员安排的语境。代词所指依上下文可能是前文离开的利未人和歌唱者。
- source_word: וָאַעֲמִידֵם עַל־עָמְדָם
  choice: 使他们各就各位
  rationale: עמד的使役式连同“在他们的位置上”表示使人回到指定岗位；“各就各位”简洁自然，并传达恢复其职分的功能意义。
theological_decisions:
- issue: “被冷落／被离弃”的力度
  choice: 正文译作“任凭上帝的殿被冷落”
  alternative: “上帝的殿被离弃”
  rationale: 原文被动动词本身容许“离弃”，但本章语境聚焦圣殿供给和人员服事遭到疏忽，并非宣称圣殿已彻底废弃。正文采用语境化表达，脚注保留较强的词义可能。
- issue: 召集对象的代词所指
  choice: 保留“他们”，不在正文明确补出身份
  alternative: “把利未人和歌唱者召集起来”
  rationale: 希伯来文本只用第三人称复数代词；上下文很可能指前文离开的利未人和歌唱者，但正文不应把推断写成明示内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“官长”保留历史行政色彩；“任凭……被冷落”使质问语气顺畅，并呈现官长放任失职的含义；“各就各位”清楚表达恢复岗位，同时由脚注交代较直译的措辞。
