source:
  edition: WLC
  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר צָֽלֲלוּ֩ שַׁעֲרֵ֨י יְרוּשָׁלִַ֜ם לִ/פְנֵ֣י הַ/שַּׁבָּ֗ת וָ/אֹֽמְרָ/ה֙ וַ/יִּסָּגְר֣וּ הַ/דְּלָת֔וֹת וָ/אֹ֣מְרָ֔/ה אֲשֶׁר֙ לֹ֣א יִפְתָּח֔וּ/ם עַ֖ד אַחַ֣ר הַ/שַּׁבָּ֑ת וּ/מִ/נְּעָרַ֗/י הֶֽעֱמַ֨דְתִּי֙ עַל הַ/שְּׁעָרִ֔ים לֹא יָב֥וֹא מַשָּׂ֖א בְּ/י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/019.yaml
  text: When the gates of Jerusalem began to grow dark[a] before the Sabbath, I ordered the doors shut and commanded that they not be opened until after the Sabbath. I stationed some of my servants[b] at the gates so that no load[c] would be brought in on the Sabbath day.
translation:
  language: zh_hans
  text: 安息日前，耶路撒冷的城门渐暗时[a]，我就下令关闭城门，又吩咐安息日过后才可打开城门。我又派几个随从[b]守在各城门，不准人在安息日把任何货担[c]运进城来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“傍晚的阴影开始笼罩耶路撒冷的城门时”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我的几个仆役”。这里的词可指尼希米身边的侍从人员。
    reason: lexical_alternative
  - marker: c
    text: “货担”指人所搬运的负载；从上下文看，其中包括运进城交易的货物。
    reason: cultural_note
lexical_decisions:
- source_word: צָלֲלוּ
  choice: 渐渐暗下来
  rationale: 该动词描写临近傍晚时城门转暗；此译自然地表达安息日开始前天色变暗的时间背景，同时保留可能是阴影笼罩城门的具体意象于脚注。
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的城门
  rationale: 忠实表达希伯来语的属格结构，现代汉语自然清楚。
- source_word: לִפְנֵי הַשַּׁבָּת
  choice: 安息日前
  rationale: 直接表达安息日开始之前的时间关系。
- source_word: וָאֹמְרָה
  choice: 我就下令／又吩咐
  rationale: 字面为“我说”，但在省长发布行政指令的语境中具有命令语力；分别译作“下令”和“吩咐”可避免生硬重复。
- source_word: וַיִּסָּגְרוּ הַדְּלָתוֹת
  choice: 关上门扇
  rationale: 城门语境中的 דְּלָתוֹת 指可关闭的门扇；译文保留动作，又不添加原文未指明的执行者。
- source_word: אֲשֶׁר לֹא יִפְתָּחוּם עַד אַחַר הַשַּׁבָּת
  choice: 人在安息日过后才可开门
  rationale: 以自然汉语表达“不可开启，直到安息日之后”的禁令，并以泛指的“人”承接未明说的执行者。
- source_word: וּמִנְּעָרַי
  choice: 我的几个随从
  rationale: נַעַר 可指年轻人、仆人或侍从；在尼希米的行政扈从语境中，“随从”较自然，并以脚注保留词义范围。
- source_word: הֶעֱמַדְתִּי עַל הַשְּׁעָרִים
  choice: 派……守在各城门
  rationale: 按守卫和监管语境表达“使站立／安置在城门处”的功能。
- source_word: לֹא יָבוֹא מַשָּׂא
  choice: 不准……把任何货担运进来
  rationale: מַשָּׂא 基本义为负载、担子；上下文涉及进入耶路撒冷进行交易的货物，因此“货担”兼顾具体负载与商业语境，“运进来”明示其经过城门进入城内。
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: 在安息日
  rationale: 现代汉语中“安息日”已经包含“日”，无须重复译为“安息日那一天”。
theological_decisions:
- issue: שַׁבָּת 的译法
  choice: 安息日
  alternative: 休息日
  rationale: 此词特指以色列律法和盟约生活中的每周安息日，并非泛指休息的一天；采用通行的“安息日”保留其历史与神学特指。
- issue: 安息日开始时间的表达
  choice: 以城门渐暗和“安息日前”呈现，不在正文补入“日落即开始”
  alternative: 译成“安息日快在日落时开始”
  rationale: 原文以天色转暗标示时间，但没有直接陈述历法规则；正文不作解释性扩写，以免消除原文意象或加入超出本节措辞的说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“下令”“吩咐”“派……守在”准确传达行政措施；“门扇”区别于整座城门，“货担”则保留原文具体名词并契合商业上下文。所有脚注标记均紧随所解释的词语。
