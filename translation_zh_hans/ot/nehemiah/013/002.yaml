    text: 希伯来文直译为“要咒诅他”，把以色列看作一个整体。
    reason: 保留原文单数代词与汉语正文复数表达之间的差异。
  revision_rationale: 本修订以更自然且更准确的“以色列人”对应 בְּנֵי יִשְׂרָאֵל，以“以饼和水迎接”表达接待和供应，并删去笼统重复的“对付”。“又雇了”仍省略施事，避免对原文单数动词所暗示但未明说的主体作超出文本的判定。脚注保留集合单数的译注。
