source:
  edition: WLC
  text: כִּ֣י לֹ֧א קִדְּמ֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/לֶּ֣חֶם וּ/בַ/מָּ֑יִם וַ/יִּשְׂכֹּ֨ר עָלָ֤י/ו אֶת בִּלְעָם֙ לְ/קַֽלְל֔/וֹ וַ/יַּהֲפֹ֧ךְ אֱלֹהֵ֛י/נוּ הַ/קְּלָלָ֖ה לִ/בְרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/002.yaml
  text: because they did not meet the sons of Israel with bread and water[a], and hired Balaam against them to curse them, but our God turned the curse into a blessing.
translation:
  language: zh_hans
  text: 因为他们没有以饼和水迎接以色列人，又雇了巴兰去咒诅他们[a]；但我们的上帝却使咒诅变为祝福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“要咒诅他”，把以色列看作一个整体。
    reason: 保留原文单数代词与汉语正文复数表达之间的差异。
lexical_decisions:
- source_word: קִדְּמוּ
  choice: 迎接
  rationale: 此处指前去会见、接待来者；“迎接”在现代汉语中自然，并保留具体行动。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子民
  rationale: 既保留“子民”的亲属与群体色彩，也比逐字译作“以色列的儿子们”更符合现代汉语。
- source_word: בַּלֶּחֶם וּבַמָּיִם
  choice: 拿着饼和水
  rationale: 保留原文所列的基本供应品，并自然表达用这些东西前去迎接。
- source_word: וַיִּשְׂכֹּר עָלָיו אֶת־בִּלְעָם
  choice: 又雇了巴兰来对付他们
  rationale: “雇”准确表达雇用之意，“来对付”传达 עָלָיו 的敌对方向；汉语省略主语，避免强行判定单数动词的隐含施事。
- source_word: לְקַלְלוֹ
  choice: 要咒诅他们
  rationale: 上下文所指是以色列群体，汉语复数表达清楚；原文单数后缀所体现的集合单数另在脚注说明。
- source_word: וַיַּהֲפֹךְ
  choice: 使……变为
  rationale: 自然表达从一种状态转变为另一种状态，也保留上帝主动扭转结果的含义。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 保留原文明确的第一人称复数所属后缀。
- source_word: הַקְּלָלָה לִבְרָכָה
  choice: 使咒诅变为祝福
  rationale: 简洁自然地保留“咒诅—祝福”的鲜明对照。
theological_decisions:
- issue: 以色列的亲属性群体称谓
  choice: 以色列子民
  alternative: 以色列人／以色列的儿子们
  rationale: “子民”保留原文 בְּנֵי 的群体和亲属色彩，同时避免现代汉语中生硬且可能误解为仅指男性的逐字表达。
- issue: 咒诅对象的集合单数
  choice: 要咒诅他们
  alternative: 要咒诅他
  rationale: 原文以阳性单数后缀指作为整体的以色列；正文用现代汉语自然的复数指称，脚注保留原文形式，避免掩盖集合单数。
- issue: 雇用巴兰者的隐含身份
  choice: 省略显式主语
  alternative: 他雇了／他们雇了
  rationale: 希伯来文动词为单数，但本节没有明说主语；汉语可自然省略主语，从而不擅自认定是巴勒个人或前文所说的群体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；“饼和水”保留经文的具体意象，“却”突出咒诅与祝福之间的转折。
