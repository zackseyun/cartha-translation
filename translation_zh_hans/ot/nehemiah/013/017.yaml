  text: וָ/אָרִ֕יבָ/ה אֵ֖ת חֹרֵ֣י יְהוּדָ֑ה וָ/אֹמְרָ֣/ה לָ/הֶ֗ם מָֽה הַ/דָּבָ֨ר הָ/רָ֤ע הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים וּֽ/מְחַלְּלִ֖ים אֶת י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/017.yaml
  text: So I contended with the nobles of Judah and said to them[a], “What is this evil thing that you are doing, profaning the Sabbath day?”
translation:
  language: zh_hans
  text: 于是，我责问犹大的贵族，对他们说：“你们做的是什么恶事，竟然亵渎安息日[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“干犯安息日”或“玷污安息日”。希伯来语动词含有把圣洁之物当作普通之物的意思。
    reason: 词义替代译法
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: 于是，我责问
  rationale: ריב在此表示与人争辩、提出指责或斥责。“责问”保留对抗和谴责的力度，又不把场景过度限定为正式诉讼；“于是”体现叙事承接。
- source_word: חֹרֵי יְהוּדָה
  choice: 犹大的贵族
  rationale: חֹרִים通常指社会地位显要的人或贵族；“贵族”准确反映其身份，也符合本段语境。
- source_word: וָאֹמְרָה לָהֶם
  choice: 对他们说
  rationale: 自然表达连续发生的叙事动作；汉语无需再次明说主语。
- source_word: מָה הַדָּבָר הָרָע הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: 你们做的是什么恶事
  rationale: 保留原文反问结构及רָע的道德谴责意味；“恶事”比“坏事”更能传达其严肃性。
- source_word: וּמְחַלְּלִים
  choice: 竟然亵渎
  rationale: חלל在此指把圣洁之物当作普通之物。“亵渎”保留圣俗对立；“竟然”使原文并列结构在现代汉语中自然地说明这恶事就是亵渎安息日，而未改变指责的内容。
- source_word: אֶת יוֹם הַשַּׁבָּת
  choice: 安息日
  rationale: “安息日”是现代汉语中对该术语的标准表达，已包含“日”的意义，无需译成生硬的“安息之日”。
theological_decisions:
- issue: 如何表达对安息日的冒犯
  choice: 亵渎安息日
  alternative: 干犯安息日；玷污安息日
  rationale: 原文动词强调把分别为圣的事物当作普通之物，而不仅是违反规定。“亵渎”较完整地保留安息日之神圣性及行为的宗教伦理分量。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“责问”体现尼希米严厉指责贵族，但不把原文过度解释为正式司法控告；反问句保留原文的责备力度。
