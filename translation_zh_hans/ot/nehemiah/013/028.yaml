base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/028.yaml
  text: And one of the sons of Joiada son of Eliashib the high priest was a son-in-law of Sanballat the Horonite[b][a], so I drove him away from me.
translation:
  language: zh_hans
  text: 大祭司以利亚实的儿子耶何耶大的一个儿子，是和伦人参巴拉的女婿[a]；我就把他从我面前赶走了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与参巴拉结了亲”。希伯来语这个词可泛指姻亲关系，但在本语境中，“女婿”是最具体、自然的理解。
    reason: lexical_alternative
  - marker: b
    text: 或译“把他逐走了”或“把他放逐了”。希伯来语动词强调强行使他离开，但没有说明这一行动具体采取了何种行政形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: 有一个儿子
  rationale: 介词מִן与复数“儿子们”构成部分表达，指耶何耶大的众子之一；用“有一个儿子”符合现代汉语叙事习惯，也保留未具名的特点。
- source_word: יוֹיָדָע
  choice: 耶何耶大
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: בֶּן אֶלְיָשִׁיב
  choice: 以利亚实的儿子
  rationale: 按原文保留父子关系，使家谱脉络清楚。
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司
  rationale: 这是该希伯来职衔在现代汉语中的标准、自然译法。
- source_word: חָתָן לְסַנְבַלַּט
  choice: 是……参巴拉的女婿
  rationale: חָתָן表示姻亲关系；在本语境中，“女婿”是最具体、自然的理解，同时以脚注保留较宽泛的可能。
- source_word: הַחֹרֹנִי
  choice: 和伦人
  rationale: 以地名或族属称谓表达参巴拉的身份，沿用通行中文译名。
- source_word: וָאַבְרִיחֵהוּ
  choice: 我就把他……赶走了
  rationale: ברח的使役形表示使人逃离或强行逐走；“赶走”体现行动的强制性，又不擅自规定其法律或行政形式。
- source_word: מֵעָלָי
  choice: 从我这里
  rationale: 该短语直译近于“从我之上”，在此惯用地指离开尼希米的面前、身边或管辖范围；“从我这里”简洁而不把范围限定得过窄。
