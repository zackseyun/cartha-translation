translation_notes:
  register: 采用庄重而自然的现代标准汉语。句首先交代以利亚实的大祭司身份及父子关系，再引出耶何耶大众子中的一人，以避免汉语中修饰层级不清。两个脚注标记分别紧跟所解释的“女婿”和“赶走了”。
