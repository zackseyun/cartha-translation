base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/005.yaml
  text: He made for him a large chamber[a], where formerly they had put the grain offering, the frankincense, the vessels, and the tithe of grain, new wine, and oil—the portion commanded for the Levites, the singers[d][c][b], and the gatekeepers—and the contribution for the priests.
translation:
  language: zh_hans
  text: 他为那人预备了一间大房间[a]；从前，人们常把谷物祭、乳香、器皿，以及按规定给利未人、歌唱者和守门人的谷物、新酒和油的十分之一[c]，并给祭司的奉献[d]，存放在那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个大储藏室”。这里的希伯来语可指圣殿建筑群内用来储物的房间。
    reason: lexical_alternative
  - marker: b
    text: 原文的表达强调这是从前惯常的做法。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“利未人、歌唱者和守门人的命令／规定”；这里指按规定归给他们的份额。
    reason: lexical_alternative
  - marker: d
    text: “奉献”也可译作“举祭”，指分别出来献上的一份。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: 他为那人预备了
  rationale: עָשָׂה配合לְ与代词，可指“为他制作、预备”。结合房间的语境，“预备”比字面的“做了”更符合现代汉语；“那人”也自然承接上文所指的人物。
- source_word: לִשְׁכָּה גְדוֹלָה
  choice: 一间大屋子
  rationale: לִשְׁכָּה指圣殿建筑群内的房间，常兼作储藏之用。“屋子”自然易懂，同时不把其用途限定为仓库。
- source_word: וְשָׁם הָיוּ לְפָנִים נֹתְנִים
  choice: 从前，人们一向……存放在那里
  rationale: הָיוּ加分词表达过去惯常进行的行为，לְפָנִים意为“从前”。“一向”保留其惯常性，而“存放”切合所列圣殿物品和供物。
- source_word: הַמִּנְחָה
  choice: 谷物祭
  rationale: 在圣殿礼仪语境中，מִנְחָה特指以谷物制品献上的祭，比泛称“供物”更准确；“谷物祭”也比传统术语“素祭”更直观。
- source_word: הַלְּבוֹנָה
  choice: 乳香
  rationale: לְבוֹנָה在献祭语境中特指乳香。
- source_word: הַכֵּלִים
  choice: 圣殿的器皿
  rationale: כֵּלִים可指器具、物件；在此指圣殿事奉所用器皿。补出“圣殿的”能在不改变所指的前提下避免理解为普通容器。
- source_word: מַעְשַׂר הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: 五谷、新酒和油的十分之一
  rationale: מַעְשֵׂר是十分之一；דָּגָן、תִּירוֹשׁ、יִצְהָר构成常见的农产三联语。“新酒”保留תִּירוֹשׁ与普通酒类用词的区别。
- source_word: מִצְוַת הַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: 这些是按规定给利未人、歌唱者和守门人的份额
  rationale: 希伯来语字面为“利未人、歌唱者和守门人的规定／命令”，在物资清单中语意省略，指按规定归给这些群体的份额。译文补明“份额”，同时以脚注保留字面结构。
- source_word: תְרוּמַת הַכֹּהֲנִים
  choice: 给祭司的奉献
  rationale: תְּרוּמָה指分别出来献上的一份。“奉献”是清楚、庄重的现代汉语表达，并避免以较生僻的“举祭”过度限定礼仪动作。
theological_decisions:
- issue: מִצְוַת在物资清单中的省略表达
  choice: 按规定给……的份额
  alternative: 利未人、歌唱者和守门人的命令
  rationale: 上下文列举所储存的十分之一，语义上是按律法规定归给圣殿服事人员的份额；直译为“命令”在汉语中会误成这些人发出的命令。脚注保留原文形式与可能的理解张力。
- issue: תְרוּמָה的礼仪含义
  choice: 奉献
  alternative: 举祭
  rationale: 原词核心是从整体中分别出来献上的部分，未必需要在正文中落实为特定动作名称。“奉献”保持广义，脚注提示传统礼仪译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大屋子”保留空间性质而不在正文中限定为仓库；“谷物祭”比“素祭”更直观；“份额”和“奉献”清楚表达圣殿供应制度，同时用脚注交代希伯来语较直译的形式及传统术语。
