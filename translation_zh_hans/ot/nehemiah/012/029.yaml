  text: וּ/מִ/בֵּית֙ הַגִּלְגָּ֔ל וּ/מִ/שְּׂד֥וֹת גֶּ֖בַע וְ/עַזְמָ֑וֶת כִּ֣י חֲצֵרִ֗ים בָּנ֤וּ לָ/הֶם֙ הַ/מְשֹׁ֣רֲרִ֔ים סְבִיב֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/029.yaml
  text: and from Beth-gilgal[a], and from the fields of Geba and Azmaveth, for the singers had built villages for themselves around Jerusalem.
translation:
  language: zh_hans
  text: 又从伯吉甲[a]，从迦巴和押玛弗的田野而来；因为歌唱的人在耶路撒冷周围为自己建了村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯吉甲”也可译作“吉甲之家”；这里很可能是地名。
    reason: 保留בֵּית הַגִּלְגָּל作为复合地名与按字面理解之间的可能性。
lexical_decisions:
- source_word: וּמִבֵּית הַגִּלְגָּל
  choice: 又从伯吉甲
  rationale: 前缀表示“又从”；בֵּית在此与地名结合，宜作为专名“伯吉甲”，避免误解为一座具体房屋。
- source_word: וּמִשְּׂדוֹת גֶּבַע וְעַזְמָוֶת
  choice: 从迦巴和押玛弗的田野
  rationale: שָׂדוֹת直译为“田野”，此处指两地所属的田地或郊野；保留原文复数所表达的地域范围。
- source_word: כִּי
  choice: 因为
  rationale: 引出歌唱者从这些地方而来的原因，现代汉语用“因为”清楚自然。
- source_word: חֲצֵרִים
  choice: 村庄
  rationale: 该词虽可指围院或圈围之地，但在这里是耶路撒冷周围供人居住的聚落，“村庄”最符合地理语境。
- source_word: בָּנוּ לָהֶם
  choice: 为自己建了
  rationale: 忠实保留“建造”和反身受益含义；汉语不必以过去完成时另作标记。
- source_word: הַמְשֹׁרֲרִים
  choice: 歌唱的人
  rationale: 该分词指负责歌唱者；“歌唱的人”准确且便于普通现代读者理解。
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: 在耶路撒冷周围
  rationale: 自然表达其环绕耶路撒冷的空间位置。
theological_decisions: []
