  text: Jeshua fathered Joiakim[a], and Joiakim fathered Eliashib[b], and Eliashib fathered Joiada.
translation:
  language: zh_hans
  text: 耶书亚生了约雅金[a]；约雅金生了以利亚实；以利亚实生了约雅大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生了”是希伯来家谱中的惯用表达，字面意思是“使……出生”，这里表示“成为……的父亲”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文此处作较短形式“约雅大”；“耶何耶大”是相应名字较完整形式的常见译法。
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 按现代中文圣经人名惯例音译，并与较早的“约书亚”加以区分；此处指被掳归回时期家谱中的人物。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 该词是 ילד 的使役式，在家谱公式中表示“使……出生”，即成为其父亲；中文家谱惯用“生了”，简洁自然，也保留父系谱系的含义。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在中文中没有对应的独立词义，由语序自然表达。
- source_word: יוֹיָקִים
  choice: 约雅金
  rationale: 采用中文圣经传统中对该希伯来名字的通行译名；名字本身按音译处理。
- source_word: אֶלְיָשִׁיב
  choice: 以利亚实
  rationale: 采用现代中文圣经传统中较通行的音译形式。
- source_word: יוֹיָדָע
  choice: 耶何耶大
  rationale: 采用中文圣经传统中较易辨认的通行音译；希伯来文本中的形式较短，亦可音译为“约雅大”。
