  text: וַ/יִּפָּקְד֣וּ בַ/יּוֹם֩ הַ/ה֨וּא אֲנָשִׁ֜ים עַל הַ/נְּשָׁכ֗וֹת לָ/א֨וֹצָר֥וֹת לַ/תְּרוּמוֹת֮ לָ/רֵאשִׁ֣ית וְ/לַ/מַּֽעַשְׂרוֹת֒ לִ/כְנ֨וֹס בָּ/הֶ֜ם לִ/שְׂדֵ֤י הֶ/עָרִים֙ מְנָא֣וֹת הַ/תּוֹרָ֔ה לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם כִּ֚י שִׂמְחַ֣ת יְהוּדָ֔ה עַל הַ/כֹּהֲנִ֥ים וְ/עַל הַ/לְוִיִּ֖ם הָ/עֹמְדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
translation:
  language: zh_hans
  text: 那一天，有人被委派管理用作库房的房间，负责把奉献物[a]、初熟的出产和十分之一，就是律法规定给祭司和利未人的份额[b]，从各城的田地收集起来，存入其中；因为犹大人因祭司和利未人侍立供职[c]而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文指分别出来、归给上帝和圣所事务使用的奉献之物；也常译作“举祭”。
    reason: lexical_alternative
  - marker: b
    text: 直译“律法的份额”，指律法规定祭司和利未人应得的份额。
    reason: lexical_alternative
  - marker: c
    text: 直译“站立”。在圣殿语境中，指侍立并履行职务。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ אֲנָשִׁים
  choice: 人们派专人管理
  rationale: 该被动结构表示有人被正式委派负责管理；现代汉语用“派专人管理”自然，也保留了受命承担职责的含义。
- source_word: הַנְּשָׁכוֹת לָאוֹצָרוֹת
  choice: 储藏室
  rationale: נשכות本指房间或内室，而לָאוֹצָרוֹת说明其储藏用途；合译为“储藏室”可避免误解为另有一组“库房”。
- source_word: לַתְּרוּמוֹת
  choice: 举祭
  rationale: תרומות指分别出来归给圣所或祭司的奉献之物；“举祭”承接律法语境中的专门含义，并用脚注说明。
- source_word: לָרֵאשִׁית
  choice: 初熟之物
  rationale: 此处指首先收获、献上的出产；“初熟之物”比单说“初熟果子”涵盖范围更准确。
- source_word: וְלַמַּעַשְׂרוֹת
  choice: 十分之一
  rationale: 这是מעשרות在律法与圣殿行政语境中的常用准确表达。
- source_word: לִכְנוֹס בָּהֶם
  choice: 收存在里面
  rationale: 兼顾收集并存入这些房间的方向与用途。
- source_word: לִשְׂדֵי הֶעָרִים
  choice: 从各城的田地
  rationale: 指归属各城镇的农业用地；此译法简洁并贴近原文。
- source_word: מְנָאוֹת הַתּוֹרָה
  choice: 律法所规定的份额
  rationale: 直译为“律法的份额”，实际表示律法为祭司和利未人规定的应得部分。
- source_word: כִּי שִׂמְחַת יְהוּדָה
  choice: 因为犹大众人……而欢喜
  rationale: “犹大”在这里可指犹大共同体；补出“众人”使现代汉语清楚，同时保留因果关系。
- source_word: הָעֹמְדִים
  choice: 在岗位上供职
  rationale: 字面为“站立的人”，在圣殿语境中指站班侍立、履行职务；译文兼顾形象与实际含义。
theological_decisions:
- issue: הָעֹמְדִים在圣殿语境中的含义
  choice: 在岗位上供职
  alternative: 侍立
  rationale: “侍立”较贴近字面，却可能只被理解为站着；“在岗位上供职”明确其履行圣殿职务的语境，同时以脚注保留字面信息。
- issue: תרומות的礼仪含义
  choice: 举祭
  alternative: 奉献物
  rationale: “奉献物”较通俗但范围过宽；“举祭”保留律法礼仪术语，并以脚注帮助普通读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句法适度拆分，以免希伯来语长句在中文中显得拖沓；保留圣殿行政和律法背景中的关键术语，并借脚注解释较专门的表达。
