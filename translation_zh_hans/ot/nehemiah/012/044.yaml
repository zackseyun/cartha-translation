  to: 那一天，有人被委派管理用作库房的房间，负责把奉献物[a]、初熟的出产和十分之一，就是律法规定给祭司和利未人的份额[b]，从各城的田地收集起来，存入其中；因为犹大人因祭司和利未人侍立供职[c]而欢喜。
  rationale: 修订恢复原文“有人被委派”的被动行政表达，删去无依据的未来式“要”，并以“用作库房的房间”及“收集起来，存入其中”呈现房间的储藏用途和动作方向。结尾保留“犹大人”作为犹大共同体的自然中文表达，并将“站立”的圣殿职务含义置于正文和脚注中。
