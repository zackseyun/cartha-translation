lexical_decisions:
- source_word: לְ/סַלַּי
  choice: 属撒莱家的
  rationale: 介词 לְ 在这份祭司家族名录中表示归属或关联；译作“属……家的”自然地标明祭司家族，同时保留其名单标题式功能。人名 סַלַּי 音译为“撒莱”。
- source_word: קַלָּי
  choice: 迦莱
  rationale: 按希伯来语辅音和词尾音音译该专名，并采用简洁、易读的现代中文形式。
- source_word: לְ/עָמוֹק
  choice: 属亚摩家的
  rationale: 与本节前半句平行，לְ 表示与亚摩祭司家族的归属关系；译作“属亚摩家的”能清楚呈现名单结构。
- source_word: עֵבֶר
  choice: 希伯
  rationale: 采用中文圣经传统中通行且易识别的人名形式“希伯”；此处是专名，不按普通名词“彼岸”等义翻译。
