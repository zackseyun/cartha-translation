  text: 比勒迦家族的代表是沙母亚[a]；示玛雅家族的代表是约拿单[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文介词可直译为“属于”或“归于”。在这类祭司家族首领名录中，它标示家族与所列代表的对应关系。
    reason: lexical_alternative
  - marker: b
    text: 原文作“耶何拿单”（Yehonatan），是这个名字的较完整希伯来文形式；中文通常仍译作“约拿单”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: 属比勒迦的
  rationale: 介词 לְ 在这份祭司家族及其代表的名录中表示归属或对应关系；译作“属……的”既保留原文结构，也符合现代汉语表达。专名 בִלְגָּה 按通行圣经译名译为“比勒迦”。
- source_word: שַׁמּוּעַ
  choice: 沙母亚
  rationale: 这是与比勒迦家对应的代表之名，采用现代中文圣经中易于辨认的音译“沙母亚”。
- source_word: לִ/שְׁמַעְיָה
  choice: 属示玛雅的
  rationale: 与本节前半句的 לְ 用法相同，表示示玛雅家及其代表之间的归属或对应关系；译作“属示玛雅的”。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 原文是较完整的名字形式 יְהוֹנָתָן（Yehonatan）。现代中文圣经通常将其与较短形式 יוֹנָתָן 一并译作“约拿单”，因此正文采用读者熟悉的译名，并用脚注说明原文形式。
