base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/026.yaml
  text: These were in the days of Joiakim son of Jeshua[a], son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest, the scribe.
translation:
  language: zh_hans
  text: 这些人属于约雅金（耶书亚的儿子、约萨达的孙子）的时代，也属于尼希米省长和以斯拉——祭司、文士——的时代。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些人生活在
  rationale: 复数指示代词回指前文所列的人；希伯来文为无动词句，中文补出“生活在”以自然表达其所处年代。
- source_word: בִּימֵי
  choice: 在……在世的日子
  rationale: 保留希伯来语“在某人的日子”的历史定位功能，同时用“在世”帮助现代汉语读者理解。
- source_word: יוֹיָקִים
  choice: 约雅金
  rationale: 按常见中文圣经人名译法音译此被掳归回时期的祭司人物。
- source_word: בֶּן יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: 耶书亚的儿子、约萨达的孙子
  rationale: 希伯来文连续两次使用“儿子”；中文转换第二层亲属关系为“孙子”，清楚保留家谱关系。
- source_word: וּבִימֵי
  choice: 也生活在……在世的日子
  rationale: 保留原文重复的年代短语和附加的时间参照。
- source_word: נְחֶמְיָה הַפֶּחָה
  choice: 省长尼希米
  rationale: פֶּחָה 指帝国行政体系下的地方长官；“省长”简明且符合上下文。
- source_word: וְעֶזְרָא הַכֹּהֵן הַסּוֹפֵר
  choice: 祭司兼经学家以斯拉
  rationale: 两个带定冠词的名词均同位修饰以斯拉；“兼”自然表明同一人兼有两种身份，“经学家”表达抄写、研习并讲解律法者的语境含义。
theological_decisions: []
