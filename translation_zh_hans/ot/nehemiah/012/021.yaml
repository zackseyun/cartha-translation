  text: 希勒家族的代表是哈沙比雅；耶大雅家族的代表是拿坦业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“属希勒家的是哈沙比雅；属耶大雅家的是拿坦业。”希伯来文介词 ל 在这份名册中可表示归属或代表关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חִלְקִיָּה
  choice: 希勒家族的代表是
  rationale: 结合本段祭司家族名册的语境，前缀 ל 表示哈沙比雅所归属或代表的家族。译出“家族的代表是”，补明希伯来文省略的名册关系，使现代汉语自然清楚，同时不把“希勒家”误作另一个人名。
- source_word: חֲשַׁבְיָה
  choice: 哈沙比雅
  rationale: 专名按现代中文圣经常用音译处理。
- source_word: לִ/ידַעְיָה
  choice: 耶大雅家族的代表是
  rationale: 与前一分句保持平行；ל 在名册中标示家族归属或代表关系，译文按上下文补出“家族的代表是”。
- source_word: נְתַנְאֵל
  choice: 拿坦业
  rationale: 专名采用现代中文圣经中常见且易识别的音译。
