base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/008.yaml
  text: And the Levites were Jeshua[a], Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah, who, with his brothers[b], was over the thanksgiving songs.
translation:
  language: zh_hans
  text: 利未人有耶书亚、宾内、甲篾、示利比、犹大和玛他尼；玛他尼和他的弟兄负责感恩的颂歌[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “感恩的颂歌”原文也可译作“感恩”或“称谢”，可指感恩、赞美的礼仪表达。后半句的单数代词最自然地指玛他尼；也有人把这句话理解为上述利未人共同负责这项职责。
    reason: 说明“感恩／称谢”一词在礼仪语境中的较宽词义，并保留单数代词所指的另一种可能理解。
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: 利未人有
  rationale: 希伯来文是承接上文的无动词名录句；现代汉语用“有”自然引出名单，不必机械译出句首连接词。
- source_word: יֵשׁוּעַ בִּנּוּי קַדְמִיאֵל שֵׁרֵבְיָה יְהוּדָה מַתַּנְיָה
  choice: 耶书亚、宾内、甲篾、示利比、犹大和玛他尼
  rationale: 各词均为人名，采用现代中文圣经语境中清楚而稳妥的音译形式。
- source_word: עַל
  choice: 负责
  rationale: 此处表示承担管理或主管职责；“负责”比直译“在……之上”更符合现代汉语，同时保留职责含义。
- source_word: הֻיְּדוֹת
  choice: 献上感恩颂歌
  rationale: 该词是复数，基本义涉及感谢、称谢或赞美；在利未人的礼仪职责语境中，很可能指感恩赞美的礼仪性表达或颂歌。“献上感恩颂歌”使这一语境自然明确，同时以脚注保留较宽的词义。
- source_word: הוּא וְאֶחָיו
  choice: 玛他尼和他的弟兄
  rationale: 单数代词最自然地回指名单末尾的玛他尼，随后加上“他的弟兄”；中文明确重述姓名，可避免代词指向含混。
theological_decisions:
- issue: 单数代词 הוּא 的所指
  choice: 将其理解为回指最后一位玛他尼，即玛他尼和他的弟兄负责此项职责
  alternative: 也可较宽泛地把后半句理解为上述利未人共同负责感恩赞美
  rationale: 从句法看，单数代词最自然地指向紧邻的玛他尼；但名单与后续职责之间仍存在一定的集合性理解空间，因此不把另一读法静默排除，而在脚注中说明。
- issue: הֻיְּדוֹת 的礼仪含义
  choice: 感恩颂歌
  alternative: 感恩、称谢或赞美的礼仪表达
  rationale: 上下文涉及利未人的圣殿职责，音乐或颂唱含义很可能存在；不过原词本身并不专指“歌曲”，故用脚注保留较宽词义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事名录体。以分号区分名单与职责说明，并在正文中明确玛他尼为单数代词最可能的所指；脚注保留原文在礼仪词义及集合性理解上的有限歧义。
