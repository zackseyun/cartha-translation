  yaml_path: translation/ot/nehemiah/012/009.yaml
  text: And Bakbukiah and Unno[a], their brothers, stood opposite them in the divisions of service.
translation:
  language: zh_hans
  text: 巴卜迦和乌挪[a]，以及他们的弟兄，按着班次站在他们对面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可能译作：“他的弟兄按着班次回应他们。”这是把“乌挪”读作动词“回应”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַקְבֻּקְיָה
  choice: 巴卜迦
  rationale: 人名按希伯来语音译；前缀连词与后续人名一并译为“和”。
- source_word: ו/ענו
  choice: 乌挪
  rationale: 依本节名单体裁和马所拉传统，将其理解为人名；同时以脚注保留将其读作动词“回应”的可能性。
- source_word: אֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 直译希伯来语亲属称谓；在此也可指同族或同工群体，但不在正文中缩窄含义。
- source_word: לְנֶגְדָּם
  choice: 站在他们对面
  rationale: 介词短语意为“在他们对面／与他们相对”；根据人员按班次排列的语境补出“站”，使中文自然。
- source_word: לְמִשְׁמָרוֹת
  choice: 按着班次
  rationale: 复数名词在圣殿职事语境中指轮值或服事的班次；“按着班次”简洁表达其组织安排。
theological_decisions:
- issue: ו/ענו 的词性与句法歧义
  choice: 正文作人名“乌挪”
  alternative: “他的弟兄按着班次回应他们”
  rationale: 上下文正在列举利未人的名字，专名解读较为顺畅；但无元音辅音文本可支持动词解读，因此用脚注保留真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“弟兄”保留经文的亲属／群体称谓；“按着班次”体现圣殿服事的轮班安排，不额外加入“服事”等原文未明说的词。
