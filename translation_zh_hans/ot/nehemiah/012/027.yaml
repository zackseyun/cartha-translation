base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/027.yaml
  text: At the dedication of the wall of Jerusalem[a], they sought the Levites from all their places, to bring them to Jerusalem to celebrate the dedication with gladness, with thanksgivings, and with song, with cymbals, harps[c][b], and lyres.
translation:
  language: zh_hans
  text: 耶路撒冷城墙举行奉献礼时，他们到利未人所住的各处寻找利未人[a]，把他们带到耶路撒冷，欢欢喜喜地举行奉献礼[b]，以称谢和歌唱，用钹、竖琴和里拉琴[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“找来利未人”；按上下文也可能有“召集利未人”的意思。希伯来语动词的基本意思是“寻找”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“行奉献礼”或“做奉献礼”。
    reason: lexical_alternative
  - marker: c
    text: 译作“竖琴”和“里拉琴”的两个希伯来语词指两种不同的弦乐器，但它们与现代乐器的确切对应关系不能确定。
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲנֻכַּת חוֹמַת יְרוּשָׁלִַם
  choice: 耶路撒冷城墙举行奉献礼时
  rationale: 将介词 בְּ 所表达的时间背景自然译出，同时保留 חֲנֻכָּה“奉献礼”的名词意义。
- source_word: בִּקְשׁוּ
  choice: 寻找
  rationale: 保留 בקשׁ 的基本词义；上下文可能含有召集之意，但正文不将这一语用含义绝对化。
- source_word: מִכָּל מְקוֹמֹתָם
  choice: 从利未人所住的各处
  rationale: מָקוֹם 本义为“地方”；补出“所住的”使现代汉语清楚，同时不把它进一步限定为村庄或城镇。
- source_word: לַהֲבִיאָם לִירוּשָׁלִָם
  choice: 把他们带到耶路撒冷
  rationale: 准确表达 בוא 的使役形“使……来／带来”。
- source_word: לַעֲשֹׂת חֲנֻכָּה
  choice: 举行奉献礼
  rationale: 希伯来语直译为“行／做奉献礼”；汉语以“举行奉献礼”表达同一事件，庄重且自然。
- source_word: וְשִׂמְחָה
  choice: 欢欢喜喜地
  rationale: 把表示喜乐的名词转为自然的汉语状语，说明举行礼仪时的喜乐状态。
- source_word: וּבְתוֹדוֹת וּבְשִׁיר
  choice: 献上感谢，歌唱
  rationale: 分别保留 תּוֹדוֹת 的感谢、称谢含义和 שִׁיר 的歌唱含义，不把两者合并为“感谢之歌”。
- source_word: מְצִלְתַּיִם נְבָלִים וּבְכִנֹּרוֹת
  choice: 击钹、弹奏竖琴和里拉琴
  rationale: 钹的所指明确；后两词指两种不同的弦乐器，采用常见近似名称，并以脚注说明其精确对应关系不确定。
