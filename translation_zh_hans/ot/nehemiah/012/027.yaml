  to: 耶路撒冷城墙举行奉献礼时，他们到利未人所住的各处寻找利未人[a]，把他们带到耶路撒冷，欢欢喜喜地举行奉献礼[b]，以称谢和歌唱，用钹、竖琴和里拉琴[c]。
