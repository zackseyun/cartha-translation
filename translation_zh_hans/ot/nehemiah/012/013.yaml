- source_word: לְ/עֶזְרָא
  choice: 以斯拉家
  rationale: 前缀 לְ 在这份祭司家族首领的名单中表示归属或对应关系；中文用“以斯拉家”简洁表达“以斯拉家族的代表”，比直译为“给以斯拉”自然。
- source_word: מְשֻׁלָּם
  choice: 米书兰
  rationale: 按现代中文圣经人名的通行音译处理此专名，不翻译其可能的词源含义。
- source_word: לַ/אֲמַרְיָה
  choice: 亚玛利雅家
  rationale: 与本节前一分句平行，לַ 表示亚玛利雅所属的祭司家族；“亚玛利雅家”保留名单的省略结构，并清楚表达家族归属。
- source_word: יְהוֹחָנָן
  choice: 约哈难
  rationale: 依希伯来语 יְהוֹחָנָן 的完整形式音译，并采用现代中文较易辨识的专名写法。
