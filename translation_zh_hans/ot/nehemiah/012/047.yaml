  text: וְ/כָל יִשְׂרָאֵל֩ בִּ/ימֵ֨י זְרֻבָּבֶ֜ל וּ/בִ/ימֵ֣י נְחֶמְיָ֗ה נֹֽתְנִ֛ים מְנָי֛וֹת הַ/מְשֹׁרְרִ֥ים וְ/הַ/שֹּׁעֲרִ֖ים דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ וּ/מַקְדִּשִׁים֙ לַ/לְוִיִּ֔ם וְ/הַ/לְוִיִּ֔ם מַקְדִּשִׁ֖ים לִ/בְנֵ֥י אַהֲרֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/047.yaml
  text: And all Israel[a], in the days of Zerubbabel and in the days of Nehemiah, gave the portions for the singers and the gatekeepers, as each day required; and they set apart the consecrated portions for the Levites[c][b], and the Levites set apart the consecrated portions for the sons of Aaron.
translation:
  language: zh_hans
  text: 在所罗巴伯的日子和尼希米的日子，全以色列都按每日所需[b]，把歌唱者和守门人的份例[a]交给他们；他们又把给利未人的份分别为圣，利未人也把给亚伦子孙[c]的份分别为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “份例”也可译作“规定的份额”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“每日的事在当日”，意思是每天按当天所需供应。
    reason: lexical_alternative
  - marker: c
    text: “亚伦子孙”在这里指亚伦谱系中的祭司。
    reason: clarification
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: 全以色列
  rationale: 保留希伯来文对整个以色列共同体的集合性称呼；现代中文自然且带有庄重的历史语体。
- source_word: בִּימֵי זְרֻבָּבֶל וּבִימֵי נְחֶמְיָה
  choice: 在所罗巴伯的日子和尼希米的日子
  rationale: 保留原文两次出现的“在……的日子”，体现两个历史时期的并列和强调。
- source_word: נֹתְנִים
  choice: 都……交给他们
  rationale: 分词在历史概述中表示持续或惯常的行动；“都……交给他们”既自然，也交代了份例的接受者。
- source_word: מְנָיוֹת
  choice: 份例
  rationale: 指分配给圣殿职事人员的规定份额或供应；“份例”兼具分配和惯例的含义。
- source_word: הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: 歌唱者和守门人
  rationale: 准确表达圣殿中的两类固定职事，采用普通现代读者易懂的称呼。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: 按每日所需
  rationale: 这是表示每日应办之事或每日定额的习语；译文传达按日供应的规律性，同时以脚注保留字面形式。
- source_word: וּמַקְדִּשִׁים לַלְוִיִּם
  choice: 又把给利未人的份分别为圣
  rationale: 使役形态的קדש在圣殿供给语境中保留“使之成为圣、专门归出”的意义。中文补出由上下文可知的“份”，避免无宾语造成含混。
- source_word: וְהַלְוִיִּם מַקְדִּשִׁים לִבְנֵי אַהֲרֹן
  choice: 利未人也把给亚伦子孙的份分别为圣
  rationale: 保留与前一分句平行的结构和神圣用途的含义，并保留原文的亲属谱系称谓。
- source_word: בְּנֵי אַהֲרֹן
  choice: 亚伦子孙
  rationale: 形式上贴近原文，并保留其作为祭司谱系称号的表达，不直接在正文中改释为“祭司”。
theological_decisions:
- issue: 圣殿供给语境中 מַקְדִּשִׁים 的含义
  choice: 译为“把……分别为圣”，指将有关份额专门归给利未人及亚伦子孙。
  alternative: 可较宽泛地译为“拨给”或“献给”，理解为一般性的供给行为。
  rationale: קדש在此仍具有神圣、归为专用的语义，不宜弱化成普通的给予；同时，“分别为圣”不额外规定具体礼仪方式，保留原文在行政分配与神圣奉献之间的张力。
- issue: “亚伦子孙”的身份表达
  choice: 正文保留谱系称谓“亚伦子孙”。
  alternative: 按其职分解释为“亚伦家的祭司”或“亚伦系祭司”。
  rationale: 原文明确采用谱系语言；保留这一称呼可避免把隐含的职分意义直接替代原文表达，脚注则说明其通常所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“在……的日子”的历史性表达及“全以色列”“分别为圣”等经文语汇；通过“按每日所需”和补出“份”使句意在现代汉语中清楚，但不消解原文关于圣物分别与实际供给之间的语义张力。
