    reason: lexical_alternative
lexical_decisions:
- source_word: ל/מלוכי
  choice: 玛路基族的代表
  rationale: 介词ל在本段祭司家族首领的名单格式中表示所属家族与其代表之间的对应关系。译出“族的代表”使省略的名单结构在现代汉语中清楚自然；“玛路基”按希伯来语名מלוכי音译。
- source_word: יונתן
  choice: 约拿单
  rationale: 按通行中文圣经人名形式译写יוֹנָתָן。
- source_word: ל/שבניה
  choice: 示巴尼族的代表
  rationale: 与前一分句保持相同的名单结构，将ל理解为家族或父家与代表者的对应标记；“示巴尼”按שְׁבַנְיָה音译。
- source_word: יוסף
  choice: 约瑟
  rationale: 采用יוֹסֵף的通行中文圣经人名形式。
