lexical_decisions:
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 此处位于参与者姓名的并列名单中，宜理解为人名或支派名，而不是地名“犹太地”；采用现代中文圣经中通行的专名译法。
- source_word: בִנְיָמִן
  choice: 便雅悯
  rationale: 并列名单中的专名，采用现代中文圣经中通行且易于辨认的译名。
- source_word: שְׁמַעְיָה
  choice: 示玛雅
  rationale: 希伯来人名，采用中文圣经中通行的音译形式。
- source_word: יִרְמְיָה
  choice: 耶利米
  rationale: 希伯来人名，采用现代中文读者熟悉的传统译名。
- source_word: וְ / וּ
  choice: 、……和……
  rationale: 希伯来文以重复连接词串联各名；现代汉语自然地用顿号列举，并在末项前用“和”，既保留并列关系，又避免生硬重复。
