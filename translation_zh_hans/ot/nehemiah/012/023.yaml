  text: בְּנֵ֤י לֵוִי֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת כְּתוּבִ֕ים עַל סֵ֖פֶר דִּבְרֵ֣י הַ/יָּמִ֑ים וְ/עַד יְמֵ֖י יֽוֹחָנָ֥ן בֶּן אֶלְיָשִֽׁיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/023.yaml
  text: The sons of Levi[a], heads of fathers’ houses, were recorded in the book of the chronicles[b], up to the days of Yohanan son of Eliashib.
translation:
  language: zh_hans
  text: 利未子孙中各父家的首领，都记载在史册[a]上，直到以利亚实的儿子约哈难的时代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“史册”指官方的历史记录或编年记录，不一定是《历代志》。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי לֵוִי
  choice: 利未子孙
  rationale: 保留原文“利未的子孙”这一具体表达，而不直接概括为“利未人”，同时使后接“各父家的首领”结构清楚自然。
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 各父家的首领
  rationale: 该短语指按父系家族划分的家族首领；“父家”保留古代宗族制度的概念，“各……的首领”符合现代汉语表达。
- source_word: כְּתוּבִים
  choice: 都记载在
  rationale: 此处是被动意义，表示这些首领的名字被写入正式记录；汉语用“记载在”比直译为“被写在”更自然。
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: 在史册上
  rationale: 该短语指编年或官方历史记录；“史册”简洁体现文献性质，介词按汉语习惯译作“在……上”。
- source_word: וְעַד יְמֵי
  choice: 直到……的时代
  rationale: 表达记录所达到的时间界限；“时代”自然传达 יְמֵי 在此并非若干具体日子，而是某人在世或任职的时期。
- source_word: יוֹחָנָן
  choice: 约哈难
  rationale: 采用现代中文圣经读者熟悉、又能对应希伯来语人名的音译。
- source_word: בֶּן אֶלְיָשִׁיב
  choice: 以利亚实的儿子
  rationale: 按自然汉语表达希伯来语父子称谓，清楚保留人物关系。
theological_decisions: []
