  text: וַ/יֵּאָ֣סְפ֔וּ בְּנֵ֖י הַ/מְשֹׁרְרִ֑ים וּ/מִן הַ/כִּכָּר֙ סְבִיב֣וֹת יְרוּשָׁלִַ֔ם וּ/מִן חַצְרֵ֖י נְטֹפָתִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/028.yaml
  text: And the sons of the singers were gathered from the district around Jerusalem and from the settlements of the Netophathites[a][b].
translation:
  language: zh_hans
  text: 歌唱者的子孙从耶路撒冷周围的地区[a]和尼陀法人的村落[b]聚集起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶路撒冷周围的平原”。希伯来语“基卡尔”可按语境指平原、环形地带或地区。
    reason: lexical_alternative
  - marker: b
    text: “村落”也可译作“小型聚居地”。这里的希伯来语常指小村庄或没有城墙的聚居地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: 聚集起来
  rationale: 该词为 אסף 的尼法勒式连续未完成时，可有被动或自复意味；“聚集起来”在现代汉语中自然，也不明确断定他们是自行聚集还是受召而来。
- source_word: בְּנֵי הַמְשֹׁרְרִים
  choice: 歌唱者的子孙
  rationale: בְּנֵי 直译为“儿子们／子孙”，在这里也可能指歌唱者群体的成员；正文保留希伯来语的亲属性表达，避免直接改释为职业团体成员。הַמְשֹׁרְרִים 特指歌唱者，而非泛指乐师。
- source_word: הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם
  choice: 耶路撒冷周围的地区
  rationale: כִּכָּר 可指平原、环形地带或区域；与“耶路撒冷周围”连用时，“地区”最自然地表达周边地域，同时以脚注保留“平原”的可能。
- source_word: חַצְרֵי
  choice: 村落
  rationale: חָצֵר 虽可指院落或围地，但在地名和聚落语境中常指小型或无城墙的村庄；“村落”符合本节的地理语境。
- source_word: נְטֹפָתִי
  choice: 尼陀法人
  rationale: 这是与尼陀法相关的族称，指当地居民而非仅指地名；“尼陀法人”保留其居民称谓的特点。
theological_decisions: []
