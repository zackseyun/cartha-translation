id: NEH.12.36
reference: Nehemiah 12:36
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְֽ/אֶחָ֡י/ו שְֽׁמַעְיָ֡ה וַ/עֲזַרְאֵ֡ל מִֽלֲלַ֡י גִּֽלֲלַ֡י מָעַ֞י נְתַנְאֵ֤ל וִֽ/יהוּדָה֙ חֲנָ֔נִי בִּ/כְלֵי שִׁ֥יר דָּוִ֖יד אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/עֶזְרָ֥א הַ/סּוֹפֵ֖ר לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/036.yaml
  text: and his brothers—Shemaiah[a], Azarel, Milalai, Gilalai, Maai, Nethanel, Judah, and Hanani—with the musical instruments of David the man of God, and Ezra the scribe before them.
translation:
  language: zh_hans
  text: 还有他的弟兄示玛雅、亚萨列、米拉莱、基拉莱、玛艾、拿坦业、犹大和哈拿尼，带着神人大卫的乐器[a]；文士以斯拉走在他们前面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“歌唱的器具”。
    reason: 说明בִּכְלֵי שִׁיר的较直译表达；正文“乐器”采用自然的现代汉语。
lexical_decisions:
- source_word: וְאֶחָיו
  choice: 还有他的弟兄
  rationale: 按字面保留“他的弟兄”；在此名单和队列的语境中也可能泛指同族或同组的利未人，但不在正文中扩大其含义。
- source_word: שְׁמַעְיָה ... חֲנָנִי
  choice: 示玛雅、亚萨列、米拉莱、基拉莱、玛艾、拿坦业、犹大和哈拿尼
  rationale: 人名依照现代中文圣经常用译名音译；名单中的连接关系按希伯来文呈现。
- source_word: בִּכְלֵי שִׁיר
  choice: 带着……的乐器
  rationale: כְּלֵי指器具或乐器，שִׁיר指歌唱或音乐；“乐器”是自然、准确的现代汉语表达。“带着”在行列语境中自然传达介词בְּ所表达的伴随关系。
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: 神人大卫
  rationale: “神人”保留אִישׁ הָאֱלֹהִים这一传统尊称及其经文互文意义；“大卫的乐器”保留原文所属或关联关系，不进一步断定这些乐器是由大卫制作、指定还是使用的。
- source_word: וְעֶזְרָא הַסּוֹפֵר
  choice: 文士以斯拉
  rationale: הַסּוֹפֵר译为“文士”，作为以斯拉的身份称谓；中文采用自然的“称谓＋姓名”次序。
- source_word: לִפְנֵיהֶם
  choice: 走在他们前面
  rationale: לִפְנֵיהֶם表示在他们前方；结合行列语境补出“走”，使现代汉语完整自然，并未增加新的角色关系。
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים这一尊称的译法
  choice: 神人
  alternative: 属神的人
  rationale: “神人”是简洁且具有经文传统色彩的尊称，既保留原文形式，也避免把它解释为一般性的敬虔评价。
- issue: “大卫的乐器”所表示的关联
  choice: 保留为“大卫的乐器”
  alternative: 大卫所指定的乐器
  rationale: 原文属格关系本身未明确说明乐器是大卫制作、指定还是曾经使用的，因此正文保留其含混性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。经文承接上文，保留名单式结构；用分号区分同行人员与以斯拉在队列中的位置。脚注标记置于其实际所说明的“乐器”之后。
