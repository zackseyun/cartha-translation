base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/024.yaml
  text: And the heads of the Levites were Hashabiah[a], Sherebiah, and Jeshua son of Kadmiel, with their brothers opposite them, to praise and to give thanks according to the command of David the man of God[b], watch corresponding to watch.
translation:
  language: zh_hans
  text: 利未人的首领是哈沙比雅、示利比雅和甲篾的儿子耶书亚；他们的弟兄在他们对面[a]，照着神人大卫的命令赞美、称谢，班与班相对[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“面对他们”或“与他们相对应”。这句话可能是说两组利未人在敬拜时彼此面对或相互配合。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“守班与守班相对”，可能指彼此对应或轮替供职的班组。
    reason: cultural_note
lexical_decisions:
- source_word: רָאשֵׁי הַלְוִיִּם
  choice: 利未人的首领
  rationale: רָאשֵׁי 是表示领导地位的复数构造形式；译作“首领”自然、庄重，也保留其群体领导者的含义。
- source_word: חֲשַׁבְיָה שֵׁרֵבְיָה וְיֵשׁוּעַ בֶּן קַדְמִיאֵל
  choice: 哈沙比雅、示利比和甲篾的儿子耶书亚
  rationale: 按现代中文圣经人名惯例音译，并明确保留“甲篾的儿子”这一父子关系。
- source_word: וַאֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 保留原文阳性复数亲属称谓；在此指与这些首领一同供职的男性利未人。
- source_word: לְנֶגְדָּם
  choice: 在他们对面
  rationale: 该词可表示位于对面、面对或彼此对应；正文采用直接的空间表达，同时以脚注保留对应关系的可能含义。
- source_word: לְהַלֵּל לְהוֹדוֹת
  choice: 赞美、称谢
  rationale: 分别呈现两个不定式所表达的礼仪行动，不将二者合并为一个笼统概念。
- source_word: בְּמִצְוַת דָּוִיד אִישׁ הָאֱלֹהִים
  choice: 照着神人大卫的命令
  rationale: 介词 בְּ 表示遵照权威命令；“神人”保留 אִישׁ הָאֱלֹהִים 这一传统称号。
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: 一班与一班相对
  rationale: מִשְׁמָר 在此可能指守班或供职班组；译文保留重复结构及“彼此相对”的关系，又避免生硬直译为“守班对着守班”。
theological_decisions:
- issue: אֲחֵיהֶם 的性别与群体身份
  choice: 他们的弟兄
  alternative: 他们的同伴／其他利未人
  rationale: 原文为阳性复数“弟兄”，语境指参与圣殿职事的男性利未人；保留性别明确的亲属用语，不作中性化改写。
- issue: מִשְׁמָר לְעֻמַּת מִשְׁמָר 所指的礼仪安排
  choice: 一班与一班相对
  alternative: 各班轮流供职／两组对唱
  rationale: 经文表明利未人按相对或对应的班组有秩序地供职，却没有明说他们轮流或对唱；因此不在正文中补入更具体的礼仪解释。
- issue: “神人大卫”这一称号
  choice: 神人大卫
  alternative: 属神的人大卫
  rationale: “神人”是 אִישׁ הָאֱלֹהִים 的固定先知性称号；直译可保留其称号性质，避免将其泛化为个人敬虔的描述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“神人”保留传统经文称号；末句以“一班与一班相对”维持原文简短、重复且略带省略的表达。所有解释性扩展均置于脚注，正文不把该安排确定为对唱或轮班。
