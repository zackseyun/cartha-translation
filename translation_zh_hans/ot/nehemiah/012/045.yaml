  text: וַֽ/יִּשְׁמְר֞וּ מִשְׁמֶ֤רֶת אֱלֹֽהֵי/הֶם֙ וּ/מִשְׁמֶ֣רֶת הַֽ/טָּהֳרָ֔ה וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים כְּ/מִצְוַ֥ת דָּוִ֖יד שְׁלֹמֹ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/045.yaml
  text: And they kept the charge of their God and the charge of purification[a], and so did the singers and the gatekeepers[b], according to the command of David and Solomon his son.
translation:
  language: zh_hans
  text: 他们履行侍奉他们上帝的职责和有关洁净的职责[a]；歌唱者和守门人也照样履行各自的职责[b]，遵照大卫和他儿子所罗门的命令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有关洁净的职责”也可译作“洁净礼方面的职责”或“保持洁净的职责”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文在“歌唱者和守门人”这里采用省略表达，可能是说这些人也履行各自受派的职责。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְרוּ מִשְׁמֶרֶת
  choice: 谨守……所托付的职责
  rationale: שׁמר与מִשְׁמֶרֶת构成“履行、谨守受托职责”的表达。“谨守”保留守护、遵行之意，“所托付的职责”自然传达正式委派的责任。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 保留希伯来文明确的第三人称复数领属后缀，不额外加强其含义。
- source_word: וּמִשְׁמֶרֶת הַטָּהֳרָה
  choice: 和洁净的职责
  rationale: הַטָּהֳרָה在圣殿礼仪语境中指洁净或保持洁净方面的职责；译为“洁净”保留其礼仪含义，也不强行判定它专指洁净过程还是洁净状态。
- source_word: וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: 歌唱者和守门人也照样谨守各自的职责
  rationale: 原文为省略结构，没有再次写出动词。按上下文补出“也照样谨守各自的职责”，使现代汉语清楚，同时用脚注说明原文的简略性。
- source_word: שֹׁעֲרִים
  choice: 守门人
  rationale: 在圣殿职分语境中，“守门人”是准确、通行且自然的称呼。
- source_word: כְּמִצְוַת
  choice: 遵照……的命令
  rationale: מִצְוָה在这里指大卫和所罗门对圣殿职事所作的权威规定；“遵照……的命令”符合现代汉语并保留正式语气。
- source_word: דָּוִיד שְׁלֹמֹה בְנוֹ
  choice: 大卫和他儿子所罗门
  rationale: 明确בְנוֹ指所罗门，以自然汉语呈现希伯来文各成分及其关系。
theological_decisions:
- issue: 圣殿职事语境中הַטָּהֳרָה的性质
  choice: 洁净
  alternative: 纯洁；洁净礼
  rationale: 上下文涉及利未人与礼仪职务，因此该词具有礼仪洁净的维度；采用较宽的“洁净”，避免把它泛化为道德纯洁，也避免无根据地限定为某一种具体仪式。
- issue: 歌唱者和守门人与前述职责的句法关系
  choice: 将他们理解为同样履行所派职责的群体
  alternative: 将该短语直接并列于“洁净的职责”之后而不补明关系
  rationale: 希伯来文表达省略，语境最自然地表明歌唱者和守门人也履行其职责；正文补足汉语必需信息，脚注保留原文的省略现象。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“谨守”体现宗教职事的郑重性，“职责”比生硬的“职守”更清楚；对原文省略处作最低限度补足，并以脚注保存其句法含混。
