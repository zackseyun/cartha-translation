base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/035.yaml
  text: 'and from the sons of the priests[a], with trumpets: Zechariah son of Jonathan, son of Shemaiah, son of Mattaniah, son of Micaiah, son of Zaccur, son of Asaph.'
translation:
  language: zh_hans
  text: 还有一些祭司的子孙[a]带着号筒：撒迦利亚，是约拿单的儿子；约拿单是示玛雅的儿子；示玛雅是玛他尼的儿子；玛他尼是米该雅的儿子；米该雅是撒刻的儿子；撒刻是亚萨的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“还有祭司的子孙，带着号筒”。原文表达其中一部分。
    reason: 说明מן所表达的部分关系，以及较形式化的译法；不添加原文没有的“出来的”。
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי הַ/כֹּהֲנִים
  choice: 还有一些祭司的子孙
  rationale: וּמִן־表达承接与部分关系；现代汉语用“还有一些”自然表明这些人属于祭司群体中的一部分。בני在此可指后裔，译作“子孙”既符合名单语境，也避免断定每一层都是直接父子关系。
- source_word: בַּ/חֲצֹצְרוֹת
  choice: 拿着号
  rationale: 介词ב在此表示伴随或工具；结合礼仪行列的场景，“拿着号”比生硬的“用号”更自然，同时不额外断定他们此刻正在吹奏。
- source_word: זְכַרְיָה
  choice: 撒迦利亚
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: יֽוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: שְׁמַֽעְיָה
  choice: 示玛雅
  rationale: 按希伯来语形式音译，并采用中文圣经常见写法。
- source_word: מַתַּנְיָה
  choice: 玛他尼
  rationale: 采用中文圣经人名的通行译法。
- source_word: מִיכָיָה
  choice: 米该雅
  rationale: 采用中文圣经人名的通行译法，并与较短的“弥迦”相区别。
- source_word: זַכּוּר
  choice: 撒刻
  rationale: 采用中文圣经人名的通行译法。
- source_word: אָסָף
  choice: 亚萨
  rationale: 采用中文圣经人名的通行译法。
- source_word: בֶן
  choice: 是……的儿子
  rationale: 逐层保留反复出现的谱系标记；中文以分句重复表达，比连续堆叠“某某的儿子”更清楚。
theological_decisions:
- issue: 亚萨谱系中“儿子”的关系
  choice: 按经文逐层译作“是……的儿子”，不加入行会、作者身份或广义后裔等解释
  alternative: 将最后的“亚萨的儿子”解释性译为“亚萨的后裔”
  rationale: 原文反复使用בן。正文保留其谱系表达及可能具有的宽泛性，不用额外历史判断消除这种张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以分号展开较长谱系，便于普通读者辨认每一代关系；保留本节作为上一节行列名单之延续的承接语气。
