revisions:
- from: 那一天，他们献上了隆重的祭物，并且欢喜[a]，因为上帝使他们大大欢喜[b]。妇女[c]和孩子们也都欢喜；耶路撒冷的欢声远处都能听见[d]。
  to: 那一天，他们献上了丰盛的祭物，并且欢喜[a]，因为上帝使他们大大欢喜[b]。妇女[c]和孩子们也都欢喜；耶路撒冷欢庆的声音远在他处也能听见[d]。
  rationale: 修订末句，使其在汉语中语法完整、自然地表达原文“耶路撒冷的喜乐从远处被听见”的意象；同时把祭物的“隆重”调整为“丰盛”，避免将原文对祭物规模或分量的描述窄化为仪式气氛。脚注a相应改为自然且不额外限定祭物种类的替代译法。
