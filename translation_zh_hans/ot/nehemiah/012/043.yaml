  text: וַ/יִּזְבְּח֣וּ בַ/יּוֹם הַ֠/הוּא זְבָחִ֨ים גְּדוֹלִ֜ים וַ/יִּשְׂמָ֗חוּ כִּ֤י הָ/אֱלֹהִים֙ שִׂמְּחָ/ם֙ שִׂמְחָ֣ה גְדוֹלָ֔ה וְ/גַ֧ם הַ/נָּשִׁ֛ים וְ/הַ/יְלָדִ֖ים שָׂמֵ֑חוּ וַ/תִּשָּׁמַ֛ע שִׂמְחַ֥ת יְרוּשָׁלִַ֖ם מֵ/רָחֽוֹק־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/043.yaml
  text: On that day they offered great sacrifices and rejoiced[a], because God had made them rejoice with great joy. Also the women and the children rejoiced[d][c][b], and the joy of Jerusalem was heard from far away.
translation:
  language: zh_hans
  text: 那一天，他们献上了丰盛的祭物，并且欢喜[a]，因为上帝使他们大大欢喜[b]。妇女[c]和孩子们也都欢喜；耶路撒冷欢庆的声音远在他处也能听见[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们献了大祭，并且欢喜。”
    reason: 原文动词和名词同属献祭词根；此译法较贴近原文的重复表达。
  - marker: b
    text: 或译：“因为上帝赐给他们极大的喜乐。”原文更直译是上帝“使他们以极大的喜乐欢喜”。
    reason: 说明使动结构及同根词加强语气的另一种自然表达。
  - marker: c
    text: “妇女”也可译作“妻子”。
    reason: 希伯来词נָשִׁים依语境可有两义。
  - marker: d
    text: 或译：“耶路撒冷的喜乐从远处就被听见了。”
    reason: 保留希伯来语被动表达及“喜乐”的抽象名词形式。
lexical_decisions:
- source_word: וַיִּזְבְּחוּ זְבָחִים גְּדוֹלִים
  choice: 献上了隆重的祭物
  rationale: זבח在祭祀语境中指献祭；与名词זְבָחִים连用时，译为“献上……祭物”可避免中文生硬重复。גְּדוֹלִים可指规模、分量或盛大程度，“隆重的”保留其宽泛性，不擅自限定为数量多。
- source_word: וַיִּשְׂמָחוּ
  choice: 欢喜
  rationale: 保留שׂמח在本节反复出现所形成的词汇呼应，并使用自然、庄重的现代汉语。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出众人欢喜的原因，因果关系明确。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 在叙事中指以色列的上帝；希伯来语冠词无需在汉语中另行体现。
- source_word: שִׂמְּחָם שִׂמְחָה גְדוֹלָה
  choice: 使他们大大欢喜
  rationale: 保留Piel动词的使动意义及同根名词所表达的加强语气，同时避免不自然的“使他们以大喜乐欢喜”。
- source_word: וְגַם הַנָּשִׁים וְהַיְלָדִים שָׂמֵחוּ
  choice: 妇女和孩子们也都欢喜
  rationale: “也”体现וְגַם的增补强调，“都”自然表达这些群体同样参与欢庆；נָשִׁים的“妻子”义保留在脚注。
- source_word: וַתִּשָּׁמַע שִׂמְחַת יְרוּשָׁלִַם מֵרָחוֹק
  choice: 耶路撒冷的欢声远处都能听见
  rationale: 被动式וַתִּשָּׁמַע直译为“被听见”；汉语用“能听见”更自然。将抽象的“喜乐”译作可听见的“欢声”，符合语境，但在脚注保留较形式对应的译法。
theological_decisions:
- issue: 喜乐的施动者
  choice: 上帝使他们大大欢喜
  alternative: 上帝赐给他们极大的喜乐
  rationale: 希伯来语שִׂמְּחָם是明确的使动形式，正文保留上帝使众人欢喜的直接施动关系。
- issue: 欢庆群体的范围
  choice: 明确提到妇女和孩子们也都欢喜
  alternative: 将其概括为全体会众欢喜
  rationale: 原文特意点出这两个群体，译文不将其并入笼统的集体称谓。
- issue: נָשִׁים的语义范围
  choice: 妇女
  alternative: 妻子
  rationale: 该词可指“妇女”或“妻子”；此处没有明示所属关系，正文采用范围较宽的“妇女”，脚注保存另一可能。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“欢喜—大大欢喜—欢声”兼顾原文שׂמח词根的反复与汉语可读性；分号使最后两组并列内容层次清楚。所有脚注标记均置于相应正文词句之后。
