lexical_decisions:
- source_word: ל/עדיא
  choice: 亚大雅族的代表
  rationale: 所给WLC正文作 עדיא，对应“亚大雅”，不是“易多”；前缀 ל 在这份祭司家族名录中表示归属或代表关系。为使现代汉语读者明白省略式名单的结构，译作“亚大雅族的代表”。
- source_word: זְכַרְיָה
  choice: 撒迦利亚
  rationale: 采用现代中文圣经中通行的人名译法；此人是名单中与亚大雅家族对应的代表。
- source_word: לְ/גִנְּתוֹן
  choice: 基拿顿族的代表
  rationale: 前缀 ל 与本节前半句用法相同，表示家族归属或代表关系；“基拿顿”按专名音译。
- source_word: מְשֻׁלָּם
  choice: 米书兰
  rationale: 采用现代中文圣经中通行的人名译法；此人是与基拿顿家族对应的代表。
