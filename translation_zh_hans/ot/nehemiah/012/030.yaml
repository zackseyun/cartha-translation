base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/030.yaml
  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
translation:
  language: zh_hans
  text: 祭司和利未人洁净了自己[a]，又洁净了百姓、城门和城墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使自己洁净……使百姓、城门和城墙洁净”。希伯来语两处使用同一词根，前一处为反身用法，后一处为及物用法。
    reason: 说明词汇替代译法及原文同词根在不同语态中的对应关系。
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  choice: 洁净了自己
  rationale: 希伯来语此处为Hitpael反身形式，表示祭司和利未人先使自己在礼仪上洁净；“洁净了自己”自然、庄重，并保留礼仪语境。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 这是该词在圣殿礼仪语境中的标准译法。
- source_word: וְהַלְוִיִּם
  choice: 和利未人
  rationale: 采用该支派及圣殿职分群体的传统、通行名称。
- source_word: וַיְטַהֲרוּ
  choice: 又洁净了
  rationale: 此处为Piel形式，表示使对象洁净；与前面的反身形式使用同一中文动词，以呈现原文词根的重复，同时以宾语结构显明及物意义。
- source_word: הָעָם
  choice: 百姓
  rationale: 指参与相关礼仪的民众；“百姓”比“会众”更直接对应通常含义，也符合本段语境。
- source_word: הַשְּׁעָרִים
  choice: 城门
  rationale: 原词意为门；上下文明确是耶路撒冷城墙的门，译作“城门”在现代汉语中更清楚自然。
- source_word: הַחוֹמָה
  choice: 城墙
  rationale: 上下文所指为耶路撒冷的城墙；中文“城墙”比单说“墙”更准确自然。
theological_decisions:
- issue: 洁净用语的性质
  choice: 保留礼仪性洁净的含义
  alternative: 一般性的清洗，或道德上的净化
  rationale: טהר在圣殿与城墙奉献的语境中主要指礼仪或仪式上的洁净，并非仅指物理清洗或道德净化；“洁净”能保留这一含义而不擅自补充具体仪式。
translation_notes:
  register: 采用现代、庄重而通俗的圣经汉语。“洁净”贯穿两处，以保留原文同一词根的重复；“又”自然连接先自洁、后洁净其他对象的动作。
