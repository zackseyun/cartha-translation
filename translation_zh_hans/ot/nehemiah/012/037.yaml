base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/037.yaml
  text: And by the Fountain Gate[a], in front of them, they went up by the stairs of the city of David, at the ascent of the wall, above the house of David[b], and as far as the Water Gate on the east.
translation:
  language: zh_hans
  text: 在泉门那里，他们前面的队伍沿着大卫城的台阶上去，经城墙的上坡处，在大卫宫上方，直到东边的水门。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: 泉门
  rationale: עַיִן在此指水泉、水源；“泉门”既简洁自然，也适合作为耶路撒冷城门的名称。
- source_word: וְנֶגְדָּם
  choice: 他们径直
  rationale: נֶגֶד带第三人称复数后缀，字面可表示“在他们面前”；在行进路线的语境中，表达朝正前方直行，译作“径直”更符合现代汉语。
- source_word: עָלוּ עַל מַעֲלוֹת עִיר דָּוִיד
  choice: 沿着大卫城的台阶上去
  rationale: עלה表示“上去”，מַעֲלוֹת可指台阶或阶梯；结合城市地形，译作具体的“台阶”最为清楚。
- source_word: בַּמַּעֲלֶה לַחוֹמָה
  choice: 从通往城墙的坡道登上城墙
  rationale: מַעֲלֶה指上坡、上行处或坡道，לַחוֹמָה表示朝向城墙；此译把路线关系自然地表达出来，同时不将其误作前面的复数“台阶”。
- source_word: מֵעַל לְבֵית דָּוִיד
  choice: 经过大卫宫殿的上方
  rationale: מֵעַל表示“在……上方”；路线语境表明队伍从较高处经过。בֵית דָּוִיד在此是地理建筑标志，译作“大卫宫殿”比可能被理解为家族或王朝的“大卫家”更清楚。
- source_word: שַׁעַר הַמַּיִם מִזְרָח
  choice: 东边的水门
  rationale: מִזְרָח表示东或向东；“东边的水门”在现代汉语中简洁自然，并保留其方位信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留大卫城、城墙、大卫宫殿和水门之间的地形路线关系；用“台阶”与“坡道”分别对应复数מַעֲלוֹת和单数מַעֲלֶה，避免中文重复含混。
