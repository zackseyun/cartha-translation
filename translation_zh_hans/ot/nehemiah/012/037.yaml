  naturalness: 整体行文通顺，但“他们径直”在此既不准确，也使队伍之间的空间关系消失。修订后保留路线叙述所需的简洁、庄重语体。
  terminology: “泉门”“大卫城”“水门”均可保留。“大卫宫”作为此处地标性“House of David”的译法可行；避免“大卫宫殿”所带来的不必要强化。
