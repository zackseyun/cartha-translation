base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/012.yaml
  text: 'And in the days of Joiakim, there were priests, heads of the fathers’ houses: for Seraiah, Meraiah; for Jeremiah, Hananiah.'
translation:
  language: zh_hans
  text: 约雅金在位的日子，祭司中各宗族的首领如下：西莱雅宗族是米拉雅；耶利米宗族是哈拿尼雅。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִימֵי יוֹיָקִים
  choice: 约雅金在位的日子
  rationale: “在……的日子”指约雅金任大祭司的时期；补出“在位”使现代汉语自然，但不另行界定其具体职分。
- source_word: כֹהֲנִים רָאשֵׁי הָאָבוֹת
  choice: 祭司中各宗族的首领
  rationale: 这里列举祭司宗族的代表。“宗族”比直译“父家”更符合现代汉语，也与上下文的家族名录相合。
- source_word: לִשְׂרָיָה מְרָיָה
  choice: 西莱雅宗族是米拉雅
  rationale: 介词לְ标示米拉雅所代表或隶属的西莱雅宗族；译出“宗族”可清楚呈现名单结构。
- source_word: לְיִרְמְיָה חֲנַנְיָה
  choice: 耶利米宗族是哈拿尼雅
  rationale: 沿用前一分句的对应结构，表明哈拿尼雅是耶利米宗族的首领。
