base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/040.yaml
  text: So the two thanksgiving choirs took their stand in the house of God[a], and I, and half of the officials with me,
translation:
  language: zh_hans
  text: 于是，两个感恩队伍在上帝的殿里站定[a]；我和随同我的一半官长也站在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “两个感恩队伍”原文直译为“两个感恩（礼）”；按上下文，是指两支献上感谢的行进队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: 站定
  rationale: 该词为阴性复数形式，与“两个感恩队伍”呼应；“站定”既表达停止行进，也体现礼仪中各就其位的含义。
- source_word: שְׁתֵּי הַתּוֹדֹת
  choice: 两个感恩队伍
  rationale: 字面为“两个感恩（礼）”，在本章语境中借指分成两队、边行进边称谢的群体。“感恩队伍”比“感恩诗班”更能保留其行列性质，也不排除其中歌唱者的角色。
- source_word: בְּבֵית הָאֱלֹהִים
  choice: 在上帝的殿里
  rationale: 保留“上帝的殿”这一希伯来表达，同时以“殿”自然指明这里是圣殿；介词按其处所义译作“在……里”。
- source_word: וַאֲנִי
  choice: 我……也
  rationale: 原文以连词连接尼希米本人和前述队伍；汉语用“也”自然表达并列和随同关系。
- source_word: וַחֲצִי הַסְּגָנִים
  choice: 和一半的官长
  rationale: סגנים泛指具有行政或领导职分的人；“官长”简洁、庄重，并保留其较宽泛的含义。
- source_word: עִמִּי
  choice: 同我
  rationale: 直接表达陪同关系；结合汉语句法补出“站在那里”，使未完的并列结构读来自然。
theological_decisions: []
