revisions:
- from: 在以利亚实、耶何耶大、约哈难[c]和押杜亚的日子，利未人的宗族首领[a]都登记在册[b]；祭司也登记在册，直到波斯人大利乌在位的时候[d]。
  to: 在以利亚实、耶何耶大、约哈难[c]和押杜亚的日子，利未人被登记为宗族首领[a][b]；祭司则在波斯人大利乌在位时被登记。
  rationale: 修订只调整末尾时间短语的译法和位置：以“在……在位时”准确表达 עַל מַלְכוּת，并明确该短语限定“祭司”被登记，而非作为全句登记活动的终点。删除原脚注 d，因为其“直到”的译法不受原文支持，且“在……在位时”无需以歧义脚注保留。其余译名、行政记录用语及宗族术语均保留。
  reviewer_model: gpt-5.6-terra
