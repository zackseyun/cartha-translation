source:
  edition: WLC
  text: הַ/לְוִיִּם֩ בִּ/ימֵ֨י אֶלְיָשִׁ֜יב יוֹיָדָ֤ע וְ/יוֹחָנָן֙ וְ/יַדּ֔וּעַ כְּתוּבִ֖ים רָאשֵׁ֣י אָב֑וֹת וְ/הַ/כֹּ֣הֲנִ֔ים עַל מַלְכ֖וּת דָּרְיָ֥וֶשׁ הַ/פָּֽרְסִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/022.yaml
  text: In the days of Eliashib[a], Joiada, Johanan, and Jaddua, the Levites were recorded as heads of fathers’ houses, and the priests also[c][b], during the reign of Darius the Persian.
translation:
  language: zh_hans
  text: 在以利亚实、耶何耶大、约哈难[c]和押杜亚的日子，利未人被登记为宗族首领[a][b]；祭司则在波斯人大利乌在位时被登记。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族首领”原文直译为“父家的首领”，指父系宗族或祖族单位的首领。
    reason: cultural_note
  - marker: b
    text: 或译：“被写下”或“被记录”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文本作“约哈难”；有些译本作“约拿单”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 采用现代中文圣经读者熟悉的标准族群及职分称谓。
- source_word: בִּימֵי
  choice: 在……的日子
  rationale: 保留希伯来文常见的时代指示语气，同时在现代中文中仍自然庄重。
- source_word: אֶלְיָשִׁיב יוֹיָדָע וְיוֹחָנָן וְיַדּוּעַ
  choice: 以利亚实、耶何耶大、约哈难和押杜亚
  rationale: 依希伯来文本音译人名；其中 וְיוֹחָנָן 是“约哈难”，不是“约拿单”。
- source_word: כְּתוּבִים
  choice: 登记在册
  rationale: 该词表示被写下、载入记录；本节属于宗族和职分名录的语境，“登记在册”比单纯“写下”更准确自然。
- source_word: רָאשֵׁי אָבוֹת
  choice: 宗族首领
  rationale: 这是家系行政用语，指父系家族或祖族单位的首领；译作“宗族首领”既简明，也避免把“父家”误解为个别核心家庭。
- source_word: וְהַכֹּהֲנִים
  choice: 祭司也登记在册
  rationale: 希伯来文在此省略前述谓语；中文补出“登记在册”，清楚表达祭司同样被记录，而不增加新的内容。
- source_word: עַל מַלְכוּת
  choice: 直到……在位的时候
  rationale: 在这份历代名录的语境中，将介词短语理解为记录延续的时间界限；同时以脚注保留“在……统治期间”的可能译法。
- source_word: דָּרְיָוֶשׁ הַפָּרְסִי
  choice: 波斯人大利乌
  rationale: 按同位称谓处理 הַפָּרְסִי，译出其波斯身份，并采用中文常见人名“大利乌”。
theological_decisions:
- issue: 祭司与“登记在册”的句法关系
  choice: 补出省略的谓语，译为“祭司也登记在册”
  alternative: 直译为“以及祭司”，保留未完句式
  rationale: 原文通过并列承接前面的被动分词；中文若完全保留省略会显得残缺，补出谓语不涉及教义推断。
- issue: עַל מַלְכוּת 的时间关系
  choice: 译为“直到……在位的时候”
  alternative: “在……统治期间”
  rationale: 上下文是名录记录所延续的时期，“直到”较符合历时界限的理解；但介词 עַל 本身容许不同时间关系，因此在脚注中明确保留另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。人名沿用简体中文圣经传统中较熟悉的形式；行政和宗族术语避免生硬直译。分号呈现利未人与祭司两组记录之间的并列关系，并以脚注保存原文时间短语的歧义。
