  yaml_path: translation/ot/nehemiah/012/041.yaml
  text: 'and the priests: Eliakim[a], Maaseiah, Miniamin, Micaiah, Elioenai, Zechariah, and Hananiah, with trumpets.'
translation:
  language: zh_hans
  text: 还有祭司以利亚敬、玛西雅、米拿民、米该雅、以利约乃、撒迦利亚和哈拿尼雅，带着号筒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带着号筒”或译“用号筒”。希伯来语也可能只是表示这些祭司配备号筒，或负责号筒。
    reason: 保留介词בְּ所表达的伴随、工具或职责关系的歧义，避免将其限定为手持或正在吹奏。
lexical_decisions:
- source_word: וְ/הַ/כֹּהֲנִים
  choice: 还有祭司
  rationale: וְ承接上一节的行列名单；中文用“还有”自然表达名单的延续。הַכֹּהֲנִים按通常含义译为“祭司”。
- source_word: אֶלְיָקִים
  choice: 以利亚敬
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: מַעֲשֵׂיָה
  choice: 玛西雅
  rationale: 按希伯来语形式音译，并采用易于现代读者辨认的中文写法。
- source_word: מִנְיָמִין
  choice: 米拿民
  rationale: 依本节马所拉文本的辅音与读音音译，保留其与其他相近名字的区别。
- source_word: מִיכָיָה
  choice: 米该雅
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: אֶלְיוֹעֵינַי
  choice: 以利约乃
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: זְכַרְיָה
  choice: 撒迦利亚
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: חֲנַנְיָה
  choice: 哈拿尼雅
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: בַּ/חֲצֹצְרֽוֹת
  choice: 拿着号筒
  rationale: 介词בְּ在这里可表示伴随、配备或使用乐器；“拿着号筒”符合献城礼行列的场景，同时不明确断言他们此刻正在吹奏。
