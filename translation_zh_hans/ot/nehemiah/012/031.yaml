  to: 于是，我带领犹大的首领登上城墙，并安排两大队称谢的队伍列队巡行[a]；其中一队在城墙上向右行进，朝粪厂门而去[b]。
  rationale: 修订将称谢群体与其巡行行动合并为“称谢的队伍列队巡行”，使中文句法和“其中一队”的指代清楚，同时保留原文未明言其为诗班的谨慎性。脚注a相应改正字面说明，并解释译文如何表达相关的行进语义。
