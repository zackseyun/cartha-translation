base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/031.yaml
  text: Then I brought the leaders of Judah up onto the wall[a], and I appointed two great thanksgiving choirs and processions[b], one going to the right on the wall toward the Dung Gate.
translation:
  language: zh_hans
  text: 于是，我带领犹大的首领登上城墙，并安排两大队称谢的队伍列队巡行[a]；其中一队在城墙上向右行进，朝粪厂门而去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“两个大的称谢”。在这里，这个说法很可能转指成队称谢的礼仪队伍；原文并没有明确称其为诗班。“列队巡行”表达紧随其后的“行进、巡行”之意。
    reason: lexical_alternative
  - marker: b
    text: “朝粪厂门而去”也可译作“到粪厂门去”；这里的介词可表示方向，也可表示目的地。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַעֲלֶה
  choice: 我带领……登上
  rationale: עלה的使役形在此表示使人上去；“带领……登上”自然地保留了第一人称叙事和使役含义。
- source_word: שָׂרֵי יְהוּדָה
  choice: 犹大的首领
  rationale: שָׂרִים可指首领、官长或贵族；此处用“首领”既符合公共礼仪语境，也不暗示王室身份。
- source_word: מֵעַל לַחוֹמָה
  choice: 登上城墙
  rationale: 该短语描写移动到城墙顶部；“登上城墙”符合中文习惯和巡行场景。
- source_word: וָאַעֲמִידָה
  choice: 安排了
  rationale: עמד使役形本义为使站立、安置；此处指尼希米组织并布置礼仪队伍，“安排”最为自然。
- source_word: שְׁתֵּי תוֹדֹת גְּדוֹלֹת
  choice: 两大队称谢的人
  rationale: 字面为“两大称谢”；上下文表明这是以称谢为职能的有组织群体。译作“两大队称谢的人”保留转喻及称谢重点，避免将其武断限定为现代意义的诗班。
- source_word: וְתַהֲלֻכֹת
  choice: 和行列
  rationale: 该词源自“行走”，可指行进、行列或巡行。与前面的称谢群体并列时，“行列”保留了希伯来文结构上的含混。
- source_word: לַיָּמִין
  choice: 向右
  rationale: 直译为“向右”；不把依据方位推断出的“向南”写入正文。
- source_word: לְשַׁעַר הָאַשְׁפֹּת
  choice: 朝粪厂门而去
  rationale: ל在此为方向用法，可表示朝向或到达；“朝……而去”保留方向性。“粪厂门”是该城门名称在中文圣经传统中清楚且通行的译法。
