base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/046.yaml
  text: For in the days of David and Asaph[a], of old, there were heads of the singers[b], and songs of praise and thanksgiving to God.
translation:
  language: zh_hans
  text: 因为在古时大卫和亚萨的日子[a]，歌唱者已有首领[b]，也有赞美和感谢上帝的歌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古时”所对应的希伯来语也可译作“从前”或“自古以来”；它也可能主要与后半句相连，意为“从古时就有”。
    reason: lexical_alternative
  - marker: b
    text: “首领”直译为“头”，也可译作“领袖”或“领班”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明缘由；用“因为”自然体现此处的解释功能。
- source_word: בִימֵי דָוִיד וְאָסָף
  choice: 在大卫和亚萨的时代
  rationale: 保留希伯来语的时间表达，同时符合现代汉语习惯。
- source_word: מִקֶּדֶם
  choice: 早
  rationale: 与“在……时代”组合为“早在……时代”，既表达往昔、从前之意，也避免生硬重复；其具体句法关联仍可有不同理解，故加注说明。
- source_word: רֹאשׁ הַמְשֹׁרְרִים
  choice: 歌唱者的领班
  rationale: רֹאשׁ虽为单数形式，此处可作集合或职分类称；“领班”自然表达负责带领歌唱者的人。
- source_word: וְשִׁיר תְּהִלָּה וְהֹדוֹת
  choice: 也有了……赞美和感谢之歌
  rationale: שִׁיר为单数，可指歌曲这一类或集合性内容；“赞美和感谢之歌”准确而自然地表达敬拜语境。
- source_word: לֵאלֹהִים
  choice: 献给上帝的
  rationale: לְ标明赞美与感谢所指向的对象；“献给”在中文敬拜语境中清楚自然。
theological_decisions:
- issue: מִקֶּדֶם与前后成分的句法关系
  choice: 译作“早在大卫和亚萨的时代”，把它理解为强化前面的时间说明
  alternative: 可理解为“从古时就有歌唱者的领班”，使其主要修饰后面的存在陈述
  rationale: 原文语序允许一定句法张力；正文采用较自然的汉语组合，脚注保留另一种关联方式，不据此引申额外神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“早在……时代，就有了……”保持原文的解释性语气和时间重点；“歌唱者”比宽泛的“乐师”更贴近词根含义。
