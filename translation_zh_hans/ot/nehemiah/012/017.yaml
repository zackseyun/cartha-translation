- from: 亚比雅族的是细基利；米拿民族的[a]；摩亚底雅[b]族的是毗勒太。
  to: 亚比雅的，是细基利；米拿民的[a]；摩亚底雅的，是毗勒太。
  rationale: 修订删除不必要且可能误导的“族／民族”，用现代汉语可接受的“某某的，是某某”名录格式表达 לְ 的对应关系。米拿民条目仍故意保留省略，不补足任何人名。保留摩亚底雅异体拼写脚注；该脚注虽未在正文另设锚点，仍对应此名称。
