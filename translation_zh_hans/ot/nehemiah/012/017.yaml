  terminology: 人名“亚比雅、细基利、米拿民、摩亚底雅、毗勒太”可用。删除“民族”，避免将人名所指的祭司家系／班次误称为现代意义的民族；也不在正文加入“班”或“家族”，以免超过原文简略措辞。
