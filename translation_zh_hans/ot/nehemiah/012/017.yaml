translation:
  language: zh_hans
  text: 亚比雅的，是细基利；米拿民的[a]；摩亚底雅的，是毗勒太。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本在“米拿民”之后没有记载相应的人名。
    reason: textual_ellipsis
lexical_decisions:
- source_word: לַ/אֲבִיָּה
  choice: 亚比雅族的
  rationale: 介词 לְ 在这份祭司家族及其首领的名录中表示归属或对应关系；译作“……族的”既符合汉语名录表达，也保留原文的省略结构。
- source_word: זִכְרִי
  choice: 细基利
  rationale: 这是人名，按现代中文圣经常见的音译形式处理，不赋予词义性翻译。
- source_word: לְ/מִנְיָמִין
  choice: 米拿民族的
  rationale: 介词 לְ 表示与米拿民族的对应关系。马所拉文本在此名称之后没有列出相应的人名，因此正文保留未完的名录结构，并以脚注说明。
- source_word: לְ/מוֹעַדְיָה
  choice: 摩亚底雅族的
  rationale: 辅音文本支持人名“摩亚底雅”；加“族”表达本节名录中的家族归属关系。相关文本传统中的异体拼写另见脚注。
- source_word: פִּלְטָי
  choice: 毗勒太
  rationale: 这是人名，采用音译；在句法结构中，他是与摩亚底雅家族对应的人。
