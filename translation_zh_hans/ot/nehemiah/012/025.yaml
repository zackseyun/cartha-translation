  text: Mattaniah, Bakbukiah, Obadiah, Meshullam, Talmon, and Akkub were guards, gatekeepers, keeping watch at the storehouses of the gates.
translation:
  language: zh_hans
  text: 玛他尼雅、巴卜基亚、俄巴底亚、米书兰、达们和亚谷是守卫、守门的，负责看守城门的库房。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמְרִים שֹׁעֲרִים
  choice: 都是守卫，是守门人
  rationale: 保留原文两个相邻的复数分词及其略显紧凑的同位关系；既表达看守职能，也明确其守门人身份。
- source_word: מִשְׁמָר
  choice: 值守
  rationale: 该词在此表示守望、当班或警戒职责；“值守”自然简洁，并与前面的“守卫”呼应而不机械重复。
- source_word: בַּאֲסֻפֵּי הַשְּׁעָרִים
  choice: 在城门的库房
  rationale: אֲסֻפִּים/אֲסֻפֵּי 在此通常理解为储藏处、库房；“城门的库房”保留其与诸门的属格关系。
- source_word: מַתַּנְיָה וּבַקְבֻּקְיָה עֹבַדְיָה מְשֻׁלָּם טַלְמוֹן עַקּוּב
  choice: 玛他尼、巴革布迦、俄巴底亚、米书兰、达们和亚谷
  rationale: 按希伯来语人名音译，并采用现代中文经文中清晰、可读的列名格式。
