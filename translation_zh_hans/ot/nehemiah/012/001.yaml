base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/001.yaml
  text: 'These were the priests and the Levites who came up with Zerubbabel son of Shealtiel[a], and Jeshua: Seraiah, Jeremiah, Ezra.'
translation:
  language: zh_hans
  text: 以下是同撒拉铁的儿子所罗巴伯和耶书亚[a]一起上来的祭司和利未人：西莱雅、耶利米、以斯拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶书亚”是按此处希伯来文人名的形式音译；若将该名字规范为较长的常见形式，也可译作“约书亚”。
    reason: 保留人名音译与规范化译名之间的词汇选择。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 用自然的现代汉语引出下文名单；“以下”承接语境并标明列表开始，不把句首连接词误解为时间副词。
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: 祭司和利未人
  rationale: 按名单语境直译两个并列群体，采用现代中文圣经语体中通行且清楚的称谓。
- source_word: אֲשֶׁר עָלוּ
  choice: 上来的
  rationale: 保留עלה在归回故土、前往耶路撒冷语境中的“上去/上来”意象；不在正文中补出原文未明说的目的地。
- source_word: עִם
  choice: 同……一起
  rationale: 明确表达同行关系，符合现代汉语习惯。
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: 撒拉铁的儿子所罗巴伯
  rationale: 直接表达父子关系，并采用这些人名在简体中文圣经传统中的通行音译。
- source_word: וְיֵשׁוּעַ
  choice: 和耶书亚[a]
  rationale: 按此处希伯来文的短式人名יֵשׁוּעַ音译为“耶书亚”，不直接统一为较长形式所对应的“约书亚”；脚注保留另一种规范化译法。
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  choice: 西莱雅、耶利米、以斯拉
  rationale: 将三个专名作为冒号后的名单平列呈现，采用通行中文音译。
theological_decisions: []
