  rationale: 人名采用现代中文圣经中通行且易于辨认的音译“以斯拉”。希伯来文此名前没有连接词，中文以顿号自然连接名单中的项目。
- source_word: וּ/מְשֻׁלָּם
  choice: 和米书兰
  rationale: מְשֻׁלָּם是人名，采用通行音译“米书兰”；词首连接词וּ标明名单最后一项，译作“和”。
