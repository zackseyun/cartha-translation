base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/039.yaml
  text: and above the Gate of Ephraim[a], and above the Old Gate, and above the Fish Gate, and the Tower of Hananel, and the Tower of the Hundred, and as far as the Sheep Gate[b]; and they stood at the Gate of the Guard.
translation:
  language: zh_hans
  text: 又从以法莲门、古门和鱼门的上方经过，经过哈楠业楼和百楼，直到羊门；他们站在守卫门那里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “站在”也可按行进语境译作“停下”或“站定”。“守卫门”也可译作“监牢门”或“守望门”。
    reason: 原文动词 עמד 的基本义是“站立”，在行进叙述中也可指停住或驻足；מַטָּרָה 可指守卫、看守，亦可能与拘禁处有关。
lexical_decisions:
- source_word: וּמֵעַל לְשַׁעַר אֶפְרַיִם
  choice: 又从以法莲门上方
  rationale: 保留 מֵעַל 的空间含义“从……上方”，并使本节自然承接上一节的行进路线。
- source_word: וְעַל שַׁעַר הַיְשָׁנָה וְעַל שַׁעַר הַדָּגִים
  choice: 经过古门上方、鱼门上方
  rationale: עַל 在城墙行进的语境中指沿着这些城门上方经过；“经过……上方”既保留空间关系，也符合现代汉语。הַיְשָׁנָה 直译为“旧的”，故译“古门”；הַדָּגִים 为“鱼”。
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: 哈楠业楼
  rationale: מִגְדָּל 指塔楼；חֲנַנְאֵל 按专名音译。采用“楼”与耶路撒冷城防建筑名称的常见中文表达相协调。
- source_word: מִגְדַּל הַמֵּאָה
  choice: 百楼
  rationale: 原文形式为“那一百之楼”，确切所指不明；采用简洁直译，不把“一百”解释为人数、长度或其他单位。
- source_word: וְעַד שַׁעַר הַצֹּאן
  choice: 直到羊门
  rationale: עַד 表示路线所达到的界限；“直到”准确表达这一终点含义。
- source_word: וְעָמְדוּ
  choice: 他们……停下
  rationale: עמד 基本义为“站立”，在行进叙事中也可表示“停下”；此处队伍一路行进至某门，“停下”更自然，同时以脚注保留“站定”的可能。
- source_word: בְּשַׁעַר הַמַּטָּרָה
  choice: 在护卫门
  rationale: מַטָּרָה 可涉及看守、警卫或拘禁设施；“护卫门”保留安保相关含义，又不武断限定为监狱。脚注列出其他合理译法。
theological_decisions: []
