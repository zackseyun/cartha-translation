revisions:
- from: 又从以法莲门上方，经过古门上方、鱼门上方、哈楠业楼和百楼，直到羊门；他们在护卫门停下[a]。
  to: 又从以法莲门、古门和鱼门的上方经过，经过哈楠业楼和百楼，直到羊门；他们站在守卫门那里[a]。
  rationale: 修订使城墙路线的空间表达合乎现代汉语，同时保留原文对城门上方的描写；以“站在”对应 וְעָמְדוּ 的基本义，并把“停下”的语境性理解放入脚注。脚注锚点移至同时涉及动词和“守卫门”替代译法的完整短语，结构清晰。
