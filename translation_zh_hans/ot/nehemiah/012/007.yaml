  text: סַלּ֣וּ עָמ֔וֹק חִלְקִיָּ֖ה יְדַֽעְיָ֑ה אֵ֣לֶּה רָאשֵׁ֧י הַ/כֹּהֲנִ֛ים וַ/אֲחֵי/הֶ֖ם בִּ/ימֵ֥י יֵשֽׁוּעַ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/007.yaml
  text: Sallu[a], Amok, Hilkiah[c][b], Jedaiah—these were the heads of the priests and their brothers in the days of Jeshua.
translation:
  language: zh_hans
  text: 撒路、亚木、希勒家、耶大雅——这些人是在耶书亚[c]的日子作祭司和他们弟兄[b]的首领[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”原文直译为“头”；也可译作“领袖”。这里不是后期作为特定职衔的“祭司长”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“他们的弟兄”；按上下文，也可能指他们的亲族或同为祭司的人。
    reason: lexical_alternative
  - marker: c
    text: “耶书亚”是被掳归回时期常见的名字形式，与通常译作“约书亚”的名字相关。
    reason: cultural_note
lexical_decisions:
- source_word: סַלּוּ
  choice: 撒路
  rationale: 人名按《以斯拉记—尼希米记》语境中的常见现代中文圣经译名音译。
- source_word: עָמוֹק
  choice: 亚摩
  rationale: 名单中的专名，采用常见中文音译。
- source_word: חִלְקִיָּה
  choice: 希勒家
  rationale: 采用该希伯来人名的通行中文圣经译名。
- source_word: יְדַעְיָה
  choice: 耶大雅
  rationale: 采用该希伯来人名的通行中文圣经译名。
- source_word: אֵלֶּה
  choice: 这些人
  rationale: 希伯来文直译为“这些”；中文补出“人”，明确回指前列诸名而不增加实质含义。
- source_word: רָאשֵׁי
  choice: 首领
  rationale: 该词字面义为“头”，此处用于领导者；“首领”既保留其领袖含义，也避免误解为后世具有特定制度含义的“祭司长”。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 准确表达带定冠词的复数名词；现代汉语中类属复数通常无需另加“们”。
- source_word: וַאֲחֵיהֶם
  choice: 和他们弟兄
  rationale: 保留希伯来文“弟兄”的亲属称谓及其语境张力；在本段祭司班次语境中，也可能泛指同族或同为祭司者。
- source_word: בִּימֵי
  choice: 在……的日子
  rationale: 保留希伯来文常见的时间表达，同时在现代中文中仍庄重自然。
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 采用以斯拉—尼希米时期该名字较短形式的通行中文音译，并与通常译作“约书亚”的较完整形式相区别。
theological_decisions:
- issue: וַאֲחֵיהֶם 所指范围
  choice: 他们弟兄
  alternative: 他们的亲族；与他们同作祭司的人
  rationale: 原文使用阳性复数“弟兄”。上下文可能指祭司家族中的亲属或同工，但正文保留原词，不把这种语境可能性定为唯一解释。
- issue: רָאשֵׁי 的职分含义
  choice: 首领
  alternative: 领袖；祭司长
  rationale: 此处表示在祭司及其弟兄中居领导地位的人，不宜译成可能让读者联想到后期固定职衔的“祭司长”。
- issue: רָאשֵׁי הַכֹּהֲנִים וַאֲחֵיהֶם 的修饰范围
  choice: 祭司和他们弟兄的首领
  alternative: 祭司中的首领，以及他们的弟兄
  rationale: 希伯来语可使“和他们的弟兄”被理解为与“祭司”并列、同受“首领”支配，也可能被理解为另加的一组人。正文依原语序保留前一种自然读法，不以增词彻底排除另一种句法理解。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。人名沿用通行中文圣经译法；破折号标明名单与说明句之间的转折。句法尽量贴近希伯来文，并借脚注保留“首领”和“弟兄”的词义范围及短语修饰关系上的可能张力。
