  to: 第二队称谢行列[a]向左行进，我跟在后面；一半的百姓在城墙上，从炉楼以上直到宽墙。
  rationale: 修订仅消除汉语中“上方”的潜在误解及“第二队称谢的队伍”的重复，并删去未明示于原文的“也”。保留“称谢行列”的礼仪性和语义弹性，保留“炉楼”“宽墙”作为城墙地点名称，也保留脚注对诗班/行列两种理解的说明。
