base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/038.yaml
  text: And the second thanksgiving choir was going to the left[a], and I followed behind it, with half of the people on the wall, from above the Tower of the Ovens as far as the Broad Wall.
translation:
  language: zh_hans
  text: 第二队称谢行列[a]向左行进，我跟在后面；一半的百姓在城墙上，从炉楼以上直到宽墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“第二队称谢的诗班”或“第二支感恩行列”。希伯来语在这里可指奉献礼中称谢的一队人，不一定只指歌唱本身。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתּוֹדָה
  choice: 称谢的队伍
  rationale: 本词基本义与称谢、感恩有关；在本段城墙奉献礼的语境中，具体指参与礼仪行进的一队人，可能包含歌唱者，但不宜仅限定为诗班。
- source_word: הַשֵּׁנִית
  choice: 第二队
  rationale: 序数词修饰前面的称谢队伍；汉语将量词“队”与“第二”结合，表达自然清楚。
- source_word: הַהוֹלֶכֶת
  choice: 行进
  rationale: 分词描写队伍正在前行的动态；“行进”符合礼仪队伍的庄重场景。
- source_word: לְמוֹאל
  choice: 向左
  rationale: מוֹאל表示左边或左侧方向；本段两队分向行进的场景支持这一方向义。
- source_word: אַחֲרֶיהָ
  choice: 跟在队伍后面
  rationale: 阴性后缀回指称谢的队伍，表达空间上的跟随；补出“队伍”可避免现代汉语代词指向含混。
- source_word: חֲצִי הָעָם
  choice: 一半的百姓
  rationale: 准确表达会众中一半的人，并保持叙事用语自然。
- source_word: מֵעַל לְהַחוֹמָה
  choice: 在城墙上
  rationale: 介词组合在此描述队伍位于城墙顶部并沿其行进；按现代汉语习惯译为“在城墙上”。
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: 炉楼
  rationale: 这是由“楼塔”和“炉子”构成的地点名称；“炉楼”简洁保留专名性质，也符合中文圣经地名的表达习惯。
- source_word: הַחוֹמָה הָרְחָבָה
  choice: 宽墙
  rationale: 此处看来是耶路撒冷城墙一个已知段落的专名；“宽墙”既直译其意义，也保留地名功能。
