base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/042.yaml
  text: and Maaseiah[a], Shemaiah, Eleazar, Uzzi, Jehohanan, Malkijah, Elam, and Ezer. And the singers made their voices heard[b], with Izrahiah the overseer.
translation:
  language: zh_hans
  text: 还有玛西雅、示玛雅、以利亚撒、乌西、约哈难、玛基雅、以拦和以谢。歌唱者放声歌唱[a]，伊斯拉希雅是主管[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“使（声音）被听见”；也可译作“高声歌唱”。
    reason: 说明希伯来语使役动词的字面形式及其在歌唱语境中的含义。
  - marker: b
    text: 或译：“监督”“负责人”。
    reason: 原词表示受委派管理或监督的人，具体职衔并不确定。
lexical_decisions:
- source_word: מַעֲשֵׂיָה
  choice: 玛西雅
  rationale: 人名采用现代中文圣经中通行且易辨认的音译。
- source_word: שְׁמַעְיָה
  choice: 示玛雅
  rationale: 人名音译，沿用现代中文读者熟悉的形式。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 人名音译，采用中文圣经通行形式。
- source_word: עֻזִּי
  choice: 乌西
  rationale: 人名音译。
- source_word: יְהוֹחָנָן
  choice: 约哈难
  rationale: 人名音译，体现原文较完整的辅音形式，而不简化为“约翰”。
- source_word: מַלְכִּיָּה
  choice: 玛基雅
  rationale: 人名音译，采用自然、通行的中文形式。
- source_word: עֵילָם
  choice: 以拦
  rationale: 此处是人名而非地名，按人名音译。
- source_word: עָזֶר
  choice: 以谢
  rationale: 人名音译，采用中文圣经中常见形式。
- source_word: וַיַּשְׁמִיעוּ הַמְשֹׁרְרִים
  choice: 歌唱的人放声歌唱
  rationale: 使役形动词字面为“使人听见”；结合歌唱者的语境，表达响亮而清楚的歌唱。“放声歌唱”自然地保留其使声音被听见的意味。
- source_word: יִזְרַחְיָה
  choice: 伊斯拉希雅
  rationale: 人名音译，尽量反映原文音节。
- source_word: הַפָּקִיד
  choice: 主管
  rationale: 指受委派负责管理或监督的人；“主管”符合本段音乐事奉的行政语境，同时不夸大其职级。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。人名以中文圣经通行音译为主；“放声歌唱”避免生硬直译，同时用脚注保留希伯来语使役结构；“担任主管”使末句在中文中完整顺畅，又不把原文职务具体化过度。
