  text: Hoshaiah and half of the officials of Judah went behind them[a].
translation:
  language: zh_hans
  text: 何沙雅和犹大官长中的一半跟在他们后面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们之后”。希伯来语可指在空间上位于他们后面，也可指按队列次序随后而行。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 走在
  rationale: הלך在此叙事中表示行进；结合游行队伍的语境，用“走在……后面”自然表达其相对位置。
- source_word: אַחֲרֵיהֶם
  choice: 他们后面
  rationale: אַחֲרֵי带第三人称复数后缀，可指在某些人之后或后面；正文以“后面”明确队伍中的空间次序，同时用脚注保留“随后”的可能表达。
- source_word: הוֹשַׁעְיָה
  choice: 何沙雅
  rationale: 按现代中文圣经人名的常见音译形式处理，不翻译其词源含义。
- source_word: וַחֲצִי
  choice: 和一半的
  rationale: חֲצִי意为“一半”；前置连词וַ将何沙雅与这组官长并列。
- source_word: שָׂרֵי
  choice: 官长
  rationale: שַׂר可指首领、官员或长官；在犹大行政与礼仪队伍的语境中，“官长”既保留身份分量，也不暗示王室血统。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用该地名及支派名的标准中文译名。
