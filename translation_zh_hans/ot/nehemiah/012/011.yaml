base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/011.yaml
  text: And Joiada fathered Jonathan[a], and Jonathan fathered Jaddua.
translation:
  language: zh_hans
  text: 约雅大生约拿单[a]；约拿单生押杜亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本和译本作“约哈难”，而非“约拿单”。这里所据的希伯来文本作“约拿单”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: （不单独译出，以分号承接）
  rationale: 此处连接词只是把本条家谱与上文相连；中文逐字译作“并且”略显累赘，以自然的家谱句式表达其承接作用。
- source_word: יוֹיָדָע
  choice: 约雅大
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较熟悉的译名。
- source_word: הוֹלִיד
  choice: 生
  rationale: 该词在家谱中表示“生育、成为……的父亲”；中文家谱惯用“生”，简洁自然，也保留父系世系含义。
- source_word: אֶת
  choice: （不译）
  rationale: 这是希伯来语直接宾语标记，中文无需对应词，其语法功能由语序体现。
- source_word: יוֹנָתָן
  choice: 约拿单
  rationale: 所据希伯来文本明确读作 יוֹנָתָן，故按此音译；异文“约哈难”收入脚注。
- source_word: יַדּוּעַ
  choice: 押杜亚
  rationale: 按希伯来语形式音译，并采用现代中文圣经中通行的人名形式。
