  text: וָ/אֵ֣רֶא וָ/אָק֗וּם וָ/אֹמַ֞ר אֶל הַ/חֹרִ֤ים וְ/אֶל הַ/סְּגָנִים֙ וְ/אֶל יֶ֣תֶר הָ/עָ֔ם אַל תִּֽירְא֖וּ מִ/פְּנֵי/הֶ֑ם אֶת אֲדֹנָ֞/י הַ/גָּד֤וֹל וְ/הַ/נּוֹרָא֙ זְכֹ֔רוּ וְ/הִֽלָּחֲמ֗וּ עַל אֲחֵי/כֶם֙ בְּנֵי/כֶ֣ם וּ/בְנֹתֵי/כֶ֔ם נְשֵׁי/כֶ֖ם וּ/בָתֵּי/כֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/008.yaml
  text: Then I looked[a], rose up, and said to the nobles, to the officials, and to the rest of the people, “Do not be afraid of them. Remember the Lord, who is great and fearsome, and fight for your brothers, your sons, your daughters, your wives[b], and your houses.”
translation:
  language: zh_hans
  text: 我看见这情形，就站起来，对贵族、官员和其余的百姓说：“不要怕他们。要记住那位伟大而可畏的主[a]，并要为你们的弟兄[b]、儿子、女儿、妻子和房屋争战。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可畏”也可译作“令人敬畏”。希伯来语这个词可指使人心生敬畏或畏惧。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”所译的希伯来语是阳性复数亲属称谓；本节随后另行列出儿子、女儿和妻子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: 我察看了
  rationale: ראה在连续叙事中引出尼希米随后的回应；“察看”保留主动观察的意味，也与“起来、说”自然衔接。
- source_word: וָאָקוּם
  choice: 就起来
  rationale: קום在此表示采取果断行动；“起来”简洁自然，并保留叙事推进力。
- source_word: הַחֹרִים
  choice: 贵族
  rationale: 指具有社会地位的领袖阶层；“贵族”是准确而通行的现代汉语表达。
- source_word: הַסְּגָנִים
  choice: 官长
  rationale: 指治理或行政人员；“官长”在庄重的经文语体中清楚，又不把具体官阶解释得过窄。
- source_word: יֶתֶר הָעָם
  choice: 其余的百姓
  rationale: 明确区分前述领袖与其余民众，贴近原文结构。
- source_word: אַל תִּירְאוּ מִפְּנֵיהֶם
  choice: 不要怕他们
  rationale: 自然直接地传达面对敌人时不可惧怕的禁令。
- source_word: אֶת אֲדֹנָי
  choice: 主
  rationale: 原文是神圣称号אֲדֹנָי，而非四字神名יהוה，因此译作“主”，不译作“耶和华”。
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: 伟大而可畏
  rationale: נורא可指使人敬畏、畏惧；“可畏”保留其强烈含义，也避免将其弱化为一般的“令人赞叹”。
- source_word: זְכֹרוּ
  choice: 要记住
  rationale: 保留命令语气及“铭记、以之为行动依据”的分量。
- source_word: וְהִלָּחֲמוּ עַל
  choice: 并要为……争战
  rationale: 介词עַל在此表示为保护某人或某物而战；“为……争战”简明且符合语境。
- source_word: אֲחֵיכֶם
  choice: 你们的弟兄
  rationale: 原文是阳性复数亲属称谓；“弟兄”保留男性所指，不擅自扩展为“弟兄姐妹”。
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם
  choice: 儿子、女儿、妻子和房屋
  rationale: 逐项保留原文具体而累加的列举；“房屋”也保留בָּתִּים可能涉及居所及家业的表达空间。
theological_decisions:
- issue: 神圣称号אֲדֹנָי的译法
  choice: 主
  alternative: 主人
  rationale: 此处以אֲדֹנָי称呼上帝，而非使用יהוה；“主”既符合汉语圣经传统，也避免与神名混同。
- issue: הַנּוֹרָא所表达的神圣威严
  choice: 可畏
  alternative: 令人敬畏
  rationale: 上下文刻意以对主的敬畏抗衡对敌人的惧怕；“可畏”保留使人震慑、敬惧的张力，而不将其淡化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留原文连续动作和直接命令的力度；“贵族、官长、百姓”体现社会层级，“争战”保持经文语境的严肃性。脚注标记均置于其实际说明的词语之后，并纠正咨询层中标记与注释内容错位的问题。
