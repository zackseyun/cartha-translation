source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ צָרֵ֗י/נוּ לֹ֤א יֵדְעוּ֙ וְ/לֹ֣א יִרְא֔וּ עַ֛ד אֲשֶׁר נָב֥וֹא אֶל תּוֹכָ֖/ם וַ/הֲרַגְנ֑וּ/ם וְ/הִשְׁבַּ֖תְנוּ אֶת הַ/מְּלָאכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/005.yaml
  text: And our adversaries said[a], “They will not know, and they will not see, until we come into their midst and kill them and stop the work.”
translation:
  language: zh_hans
  text: 我们的敌人说：“他们不会知道，也不会看见，直到我们进入他们中间[a]，杀死他们，使这工程停下来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“来到他们当中”。
    reason: 原文אֶל תּוֹכָם可表达进入他们中间，也可较一般地译为来到他们当中。
lexical_decisions:
- source_word: צָרֵינוּ
  choice: 我们的敌人
  rationale: צַר指怀有敌意、与人对抗者；“敌人”是现代汉语中直接自然的表达，符合此处策划袭击的语境。
- source_word: יֵדְעוּ
  choice: 他们不会知道
  rationale: יָדַע在这里表示知道或察觉；译作“知道”保留原文的基本词义，并与下句“看见”构成平行。
- source_word: יִרְאוּ
  choice: 也不会看见
  rationale: רָאָה的基本义是“看见”；直译可保留原文与“知道”的并列及突袭威胁的鲜明语气，语境也容许读者理解为“发现、察觉”。
- source_word: עַד אֲשֶׁר
  choice: 直到
  rationale: 该组合标明时间界限：对方在袭击者来到以前一直毫无察觉；“直到”简洁而准确。
- source_word: נָבוֹא אֶל תּוֹכָם
  choice: 我们进入他们中间
  rationale: בּוֹא与אֶל共同表达进入、来到，תּוֹךְ表示内部或中间；“进入他们中间”既体现空间上的侵入，也传达突袭的意味。
- source_word: וַהֲרַגְנוּם
  choice: 杀死他们
  rationale: הָרַג是“杀、杀死”的普通动词；此译法清楚直接，保留原文威胁的 blunt force。
- source_word: וְהִשְׁבַּתְנוּ
  choice: 使……停下来
  rationale: שׁבת的使役式表示使某事停止；“使这工程停下来”明确呈现使役意义，又符合现代汉语表达。
- source_word: הַמְּלָאכָה
  choice: 这工程
  rationale: מְלָאכָה在上下文中特指重建城墙的工作；“这工程”比笼统的“工作”更自然地指向该建设任务。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。保留“知道／看见”的希伯来语平行结构，不以“察觉”合并两层表达；用“使这工程停下来”准确传达使役式。
