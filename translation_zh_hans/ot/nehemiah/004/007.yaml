  source_fidelity: 译文整体准确传达了两次“安置／部署”、按家族编组，以及刀、矛、弓三类武器。惟原文的三个地点短语依次为“那地方的低处／城墙后面／在罕见词所指的处所”；现有中文将后两项合成“城墙后面的空旷地带”，使“空旷地带”成为“城墙后面”的定语，略削弱原文并列地点的结构。
