base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/007.yaml
  text: Then I stationed men in the lowest parts of the place[a], behind the wall, in the exposed areas; and I stationed the people by families, with their swords, their spears, and their bows.
translation:
  language: zh_hans
  text: 于是，我把人安置在那地方的低处，在城墙后面、在空旷之处[a]；又按家族部署百姓，各自带着刀、矛和弓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“裸露之处”或“开阔之处”。这里的希伯来语词十分罕见，可能指无遮蔽、易受攻击的地段。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעֲמִיד
  choice: 布置人手
  rationale: 这是 עמד 的使役形，在军事语境中指派人驻守防御位置；“布置人手”自然表达这一含义，并避免生硬直译为“使……站立”。
- source_word: מִתַּחְתִּיּוֹת לַמָּקוֹם
  choice: 那地方的低处
  rationale: מִתַּחְתִּיּוֹת 表示较低或最低的部分，לַמָּקוֹם 指该处；译文保留空间意义，不进一步断定其具体地形。
- source_word: מֵאַחֲרֵי לַחוֹמָה
  choice: 城墙后面
  rationale: 自然表达位于城墙后方的方位关系，符合防守部署的语境。
- source_word: בצחחיים
  choice: 空旷地带
  rationale: 这是罕见词，可能指裸露、无遮蔽或开阔之处；“空旷地带”保留其开放、易受攻击的语境含义，脚注注明其他可能理解。
- source_word: וָאַעֲמִיד אֶת־הָעָם
  choice: 又……部署百姓
  rationale: 保留原文重复的使役动词及其有意组织防线的意味；“部署”符合军事语境。
- source_word: לְמִשְׁפָּחוֹת
  choice: 按家族
  rationale: מִשְׁפָּחוֹת 可指家族或宗族单位；“按家族”清楚易懂，也保留其社会组织方式。
- source_word: עִם חַרְבֹתֵיהֶם רָמְחֵיהֶם וְקַשְּׁתֹתֵיהֶם
  choice: 让他们带着刀、矛和弓
  rationale: 准确保留三类武器的并列；中文用“带着”自然表达 עִם 所表示的随身装备。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的军事叙事语体。“布置人手”与“部署百姓”既反映原文动词重复，又避免中文重复显得僵硬；武器名称采用普通现代读者熟悉的“刀、矛和弓”。
