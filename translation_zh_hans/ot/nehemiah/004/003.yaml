base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/003.yaml
  text: So we prayed to our God and stationed a guard against them day and night because of them[a][b].
translation:
  language: zh_hans
  text: 于是，我们向我们的上帝祷告，并因他们的缘故[b]，昼夜设立守卫防备他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“设立守卫来防备他们。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“从他们面前”；此处意为“因为他们”或“由于他们的缘故”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּתְפַּלֵּל
  choice: 我们……祷告
  rationale: 该词是 פלל 的 Hitpael 形式，通常意为“祷告”；不额外加入“恳切”等原文未明说的强度。
- source_word: אֶל אֱלֹהֵינוּ
  choice: 向我们的上帝
  rationale: 保留介词 אֶל 的方向含义以及第一人称复数后缀“我们的”；“向……祷告”符合现代汉语习惯。
- source_word: וַנַּעֲמִיד
  choice: 派人
  rationale: עמד 的 Hiphil 形式在这里表示使人站立、安排就位；结合守卫语境，“派人”自然表达有意部署人员的动作。
- source_word: מִשְׁמָר
  choice: 防备
  rationale: 该词可指守卫、警戒或值守；与“派人”搭配译作“防备”，简洁地传达设置警戒的集体行动。
- source_word: עֲלֵיהֶם
  choice: 防备他们
  rationale: עַל 基本义可为“在……之上”，但在敌对语境中表示针对对方采取警戒措施；“防备他们”既自然又符合上下文。
- source_word: יוֹמָם וָלַיְלָה
  choice: 昼夜
  rationale: 这是表示持续警戒的固定并列表达；“昼夜”凝练、庄重且符合现代汉语。
- source_word: מִפְּנֵיהֶם
  choice: 因他们的缘故
  rationale: 字面为“从他们面前”，此处说明设防的缘由。“因他们的缘故”保留因果含义，同时不擅自解释为明确的恐惧。
theological_decisions:
- issue: 面对敌对势力时的回应
  choice: 并列呈现向上帝祷告和实际设防两项行动，不偏重其中任何一项。
  alternative: 只强调祷告，或只强调防卫部署。
  rationale: 希伯来文以两个连续且并列的动词叙述祷告和设防；译文保留属灵依靠与实际行动之间的张力，不将经文简化为单一层面的回应。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文；用“又”清楚并列祷告与设防。“因他们的缘故”略带原文式重复，旨在保留 מִפְּנֵיהֶם 的独立因果表达及其语义余地。
