base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/001.yaml
  text: When Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repair of Jerusalem’s walls had gone up[a], that the breaches had begun to be closed[b], they became very angry.
translation:
  language: zh_hans
  text: 参巴拉、多比雅、阿拉伯人、亚扪人和亚实突人听说耶路撒冷城墙的修复有了进展[a]，城墙上的破口开始被堵住[b]，就非常愤怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶路撒冷城墙逐渐恢复起来。”希伯来语在这里使用了一个常与“医治”或“恢复”有关的词，比喻城墙得到修复。
    reason: lexical_alternative
  - marker: b
    text: “破口”也可译作“缺口”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: ……听说……就……
  rationale: 该叙事结构引出新的时间场景。现代汉语无需直译为“事情发生在……时”，用“听说……就……”自然表达时间与后续反应。
- source_word: שָׁמַע
  choice: 听说
  rationale: 此处指听到消息；“听说”比单用“听见”更符合现代汉语语境。
- source_word: סַנְבַלַּט וְטוֹבִיָּה
  choice: 参巴拉、多比雅
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: הָעַרְבִים
  choice: 阿拉伯人
  rationale: 直接、自然地表达该族群名称。
- source_word: הָעַמֹּנִים
  choice: 亚扪人
  rationale: 采用该古代族群的通行中文名称。
- source_word: הָאַשְׁדּוֹדִים
  choice: 亚实突人
  rationale: 表达来自亚实突的居民或族群，采用通行地名音译。
- source_word: עָלְתָה אֲרוּכָה
  choice: 修复有了进展
  rationale: אֲרוּכָה本可指医治、恢复，此处比喻城墙的修复；עָלְתָה表示修复工作向前推进。“有了进展”既自然，又保留动态含义。
- source_word: לְחֹמוֹת יְרוּשָׁלִַם
  choice: 耶路撒冷城墙的
  rationale: 按现代汉语所属关系自然处理，组成“耶路撒冷城墙的修复”。
- source_word: הַפְּרֻצִים
  choice: 破口
  rationale: 指城墙破损形成的缺口；“破口”准确且符合中文建筑语境。
- source_word: לְהִסָּתֵם
  choice: 堵上
  rationale: 该被动形式表示缺口被封闭。“堵上”在城墙破口的语境中自然明确。
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: 就非常愤怒
  rationale: 希伯来语惯用语字面涉及怒火燃烧，现代汉语用“非常愤怒”准确表达强烈怒气。
