  yaml_path: translation/ot/nehemiah/004/004.yaml
  text: And Judah said[a], “The strength of the burden-bearers has failed, and there is much rubble[b], and we are not able to build the wall.”
translation:
  language: zh_hans
  text: 犹大人说[a]：“搬运工的力气已经衰竭，瓦砾又多，我们无力建造城墙。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“犹大说”；这里的“犹大”很可能统指犹大群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: 犹大人
  rationale: 原文是单数专名“犹大”，在此以集体方式指犹大群体。正文译作“犹大人”较符合现代汉语表达，同时以脚注保留原文形式。
- source_word: כָּשַׁל כֹּחַ
  choice: 已经力竭
  rationale: 字面为“力量衰败／绊跌”，在劳作语境中自然表示体力耗尽；“已经力竭”简洁地保留失败、衰弱之意。
- source_word: הַסַּבָּל
  choice: 搬运者
  rationale: 该名词特指负重搬运的人。原文为单数但有集合意义，汉语“搬运者”可自然涵盖这一群体。
- source_word: הֶעָפָר
  choice: 瓦砾
  rationale: 该词通常指尘土或土；在修复被毁城墙的语境中，所指应是废墟中的碎石杂物，故正文译作“瓦砾”，并以脚注注明字面意义。
- source_word: הַרְבֵּה
  choice: 又多
  rationale: 表达数量众多；“瓦砾又多”在列举施工困难时自然凝练。
- source_word: לֹא נוּכַל
  choice: 我们无力
  rationale: 表示能力不足而非不愿意；“无力”也与前句体力耗尽相呼应。
- source_word: לִבְנוֹת בַּחוֹמָה
  choice: 建造城墙
  rationale: ב 与“建造”连用可标示工作的对象或范围。现代汉语直接说“建造城墙”最自然，不宜机械译成“在城墙上建造”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“已经力竭”“无力……了”传达工人因疲惫和瓦砾众多而无法继续施工的语气；正文脚注标记与脚注完整对应。
