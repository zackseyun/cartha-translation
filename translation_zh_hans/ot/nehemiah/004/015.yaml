base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/015.yaml
  text: So we kept doing the work[a], while half of them held the spears from the rising of the dawn until the coming out of the stars.
translation:
  language: zh_hans
  text: 于是，我们继续做工，其中一半人手持长矛，从破晓起，直到星辰出现。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更自然地译作：“从天亮直到星星出来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: 继续做工
  rationale: 分词表达持续进行的行动；“继续做工”既体现延续性，也自然承接叙事语境。
- source_word: וְחֶצְיָם
  choice: 其中一半人
  rationale: 后缀所指可由上下文理解为参与者；“其中一半人”清楚表达分工，同时不额外限定具体群体。
- source_word: מַחֲזִיקִים בָּרְמָחִים
  choice: 手持长矛
  rationale: מַחֲזִיקִים 是持续性分词，指拿着或持守；“手持”符合现代汉语叙事习惯。רֹמַח 在此为军用长矛。
- source_word: מֵעֲלוֹת הַשַּׁחַר
  choice: 从黎明升起
  rationale: 尽量保留原文“黎明升起”的具体意象，而不只译作“天亮”。
- source_word: עַד צֵאת הַכּוֹכָבִים
  choice: 直到星辰出现
  rationale: 保留原文“星辰出来”的可见意象，以自然庄重的现代汉语表达。
theological_decisions: []
