  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר תִּשְׁמְעוּ֙ אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר שָׁ֖מָּ/ה תִּקָּבְצ֣וּ אֵלֵ֑י/נוּ אֱלֹהֵ֖י/נוּ יִלָּ֥חֶם לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/014.yaml
  text: At the place where you hear the sound of the trumpet[a], gather there to us. Our God will fight for us.
translation:
  language: zh_hans
  text: 你们在哪一处听见号角声[a]，就到那里来与我们会合。我们的上帝必为我们争战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“羊角号声”。希伯来语 שׁוֹפָר 指一种角制的号；也可特指羊角号。
    reason: 保留该器物名称的较具体替代译法，同时正文采用现代汉语中易懂的“号角”。
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: 在哪里
  rationale: 介词 בְּ、名词 מָקוֹם及关系词 אֲשֶׁר共同引出地点关系从句；现代汉语用“在哪里”自然表达，同时保留具体的空间指向。
- source_word: תִּשְׁמְעוּ
  choice: 听见
  rationale: שׁמע的Qal未完成式在此表示“听见”；“听见”比“听从”或“听说”更符合号角声这一直接宾语。
- source_word: קוֹל הַשּׁוֹפָר
  choice: 号角声
  rationale: קוֹל明确表示“声音”，שׁוֹפָר指角制的号；“号角声”简洁、自然，并以脚注保留“羊角号”这一更具体的译法。
- source_word: שָׁמָּה
  choice: 就要……到……这里来
  rationale: שָׁמָּה带有朝向所指地点的意味；结合אֵלֵינוּ，汉语用“到我们这里来”清楚表达向说话者一方聚集，关联词“就”则对应前后地点与行动的关系。
- source_word: תִּקָּבְצוּ
  choice: 聚集
  rationale: קבץ的Niphal形式在这里具有命令作用，表示众人集合到一处；“聚集”准确且为现代汉语常用表达。
- source_word: אֵלֵינוּ
  choice: 到我们这里来
  rationale: 该形式明确是第一人称复数“到我们这里”；保留“我们”，不将其改成单数“我”。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 保留原文第一人称复数所属后缀，体现说话者与听众共同认信的表达。
- source_word: יִלָּחֶם לָנוּ
  choice: 必为我们争战
  rationale: לחם的Niphal在此指投入战斗，לָנוּ表示为我们的益处或代表我们；“为我们争战”直接保留原文将行动归于上帝的强调，“必”自然传达此处未完成式在宣告中的将来与确信语气。
theological_decisions:
- issue: 上帝争战的表述
  choice: 我们的上帝必为我们争战
  alternative: 我们的上帝必帮助我们争战
  rationale: 原文以“我们的上帝”为יִלָּחֶם的主语，并未把上帝的行动仅仅说成帮助人的战斗；直译为“为我们争战”可保留神亲自行动的重点，又不额外说明人与神之间具体如何分工。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在哪里……就……”使地点条件关系清楚；“聚集到我们这里来”保留原文复数指向；“争战”符合历史战事语境及圣经叙事语体，但不过度古雅。
