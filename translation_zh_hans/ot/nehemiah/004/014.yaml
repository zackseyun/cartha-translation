  to: 你们在哪一处听见号角声[a]，就到那里来与我们会合。我们的上帝必为我们争战。
  rationale: 修订明确保留“在哪一处……到那里”的地点对应，并以“与我们会合”自然表达原文“到我们这里”的复数指向。其余关键表达维持不变：号角的声音、上帝的所属关系，以及上帝亲自为其子民争战。
