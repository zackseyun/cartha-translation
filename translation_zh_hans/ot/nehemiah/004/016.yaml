base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/016.yaml
  text: Also at that time I said to the people[a], “Let each man and his servant spend the night within Jerusalem[b], and let them be a guard for us by night and workers by day.”
translation:
  language: zh_hans
  text: 那时，我也对百姓说：“各人和他的随从都要在耶路撒冷城内过夜[a]；他们夜间为我们守卫，白天做工。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随从”或译“仆人”或“年轻人”；希伯来语 נַעַר 可按语境指少年、仆人、随从或属下。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בָּעֵת הַהִיא
  choice: 那时，我也
  rationale: 保留גַּם的附加、承接作用，并以现代汉语自然的语序表达时间背景。
- source_word: אִישׁ וְנַעֲרוֹ
  choice: 各人和他的随从
  rationale: אִישׁ在这里具有逐一分配的意义；נַעַר可指少年、仆人或随从，本处涉及共同住宿、守卫和做工，“随从”既体现从属关系，又不无根据地强调年龄或奴仆身份。
- source_word: יָלִינוּ
  choice: 都要……过夜
  rationale: 该动词表示住宿、留宿一夜；“过夜”简洁自然，语境中的指令意味由“要”表达。
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: 在耶路撒冷城内
  rationale: בְּתוֹךְ强调在城市范围之内；补出“城”使现代中文表达更清楚。
- source_word: וְהָיוּ לָנוּ
  choice: 好让他们……为我们
  rationale: 结合前面的指令，将并列形式理解为预期目的或结果；“好让”在中文中自然传达这一关系，同时不改变人员所承担的双重职能。
- source_word: הַלַּיְלָה מִשְׁמָר
  choice: 夜间为我们守卫
  rationale: מִשְׁמָר可指守卫、警戒或值守；动词化为“守卫”符合现代汉语，并与白天做工形成平行。
- source_word: וְהַיּוֹם מְלָאכָה
  choice: 白天做工
  rationale: מְלָאכָה是工作、劳作；“做工”清楚表达白天继续修建工作的意思，又不额外限定具体工种。
