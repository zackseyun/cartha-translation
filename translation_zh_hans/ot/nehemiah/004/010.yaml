base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
translation:
  language: zh_hans
  text: 从那一天起，我的随从[a]有一半做工，另一半拿着矛、盾牌、弓和铠甲[b]；官长们则在犹大全体人众的后面[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随从”也可译作“年轻人”“仆人”或“侍从”；希伯来语 נְעָרַי 可随语境具有这些含义。
    reason: lexical_alternative
  - marker: b
    text: “铠甲”指护身甲，也可译作“战甲”；原词可能指鳞甲或锁子甲，但这里不必限定其具体样式。
    reason: lexical_alternative
  - marker: c
    text: “在犹大全体人众的后面”可能表示官长们在犹大工人后方提供军事支援或进行督导；原文没有明确说明其具体作用。
    reason: cultural_note
lexical_decisions:
- source_word: נְעָרַי
  choice: 我的随从
  rationale: 该词可指年轻人、仆人或侍从；这里指尼希米属下参与施工和警戒的一队人。“随从”既符合军事—劳作语境，也避免把年龄这一未必确定的信息写入正文。
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: 做工
  rationale: 简洁自然地表达持续从事城墙工程。
- source_word: מַחֲזִיקִים
  choice: 拿着
  rationale: 在武器清单前表示持有、执持，贴近原文而不额外解释为“装备着”。
- source_word: הָרְמָחִים הַמָּגִנִּים וְהַקְּשָׁתוֹת וְהַשִּׁרְיֹנִים
  choice: 矛、盾牌、弓和铠甲
  rationale: 逐项保留军事装备清单；“铠甲”表达身体护甲，同时不武断限定其具体样式。
- source_word: הַשָּׂרִים
  choice: 官长们
  rationale: שַׂר 可指官员、首领或将领；“官长”适合尼希米记的行政兼军事语境，又不暗示王族身份。
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  choice: 在犹大全家众人后面
  rationale: 保留 אַחֲרֵי 的空间意义“在……后面”，并以“犹大全家众人”传达 בֵּית יְהוּדָה 的群体性表达。
