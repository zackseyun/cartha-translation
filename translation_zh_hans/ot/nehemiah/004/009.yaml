source:
  edition: WLC
  text: וַ/יְהִ֞י כַּֽ/אֲשֶׁר שָׁמְע֤וּ אוֹיְבֵ֨י/נוּ֙ כִּי נ֣וֹדַֽע לָ֔/נוּ וַ/יָּ֥פֶר הָ/אֱלֹהִ֖ים אֶת עֲצָתָ֑/ם ו/נשוב כֻּלָּ֨/נוּ֙ אֶל הַ֣/חוֹמָ֔ה אִ֖ישׁ אֶל מְלַאכְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/009.yaml
  text: And it happened that when our enemies heard that it had become known to us[a], and that God had frustrated their plan, we all returned to the wall[c][b], each man to his work.
translation:
  language: zh_hans
  text: 当我们的仇敌听说我们已经得知这事[a]，并且上帝已经挫败了他们的谋划[b]时，我们全都回到城墙，各自做自己的工作[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这事已经被我们知道。”希伯来文直译为“这事已被我们知道”。
    reason: 说明原文נודע לנו的被动表达，并保留自然的中文替代译法。
  - marker: b
    text: “谋划”也可译作“计策”或“计划”；“挫败”也可指使其落空。
    reason: 保留עֵצָה与הפר在本语境中的词义幅度。
  - marker: c
    text: 希伯来文直译为“各人到自己的工作”；“回到”承接前面的“我们全都回到”，这是表示每个人各归其工的分配式说法。
    reason: 解释共享动词的希伯来语句法及分配式表达。
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: 后来……听说
  rationale: 这是叙事推进并引出时间情境的表达。译为“后来……听说”符合现代汉语叙事习惯，又保留事件随之发展的关系。
- source_word: אוֹיְבֵינוּ
  choice: 我们的仇敌
  rationale: 准确表达带第一人称复数后缀的“仇敌”，也与本段敌对行动的语境相符。
- source_word: כִּי נוֹדַע לָנוּ
  choice: 这事已经被我们知道
  rationale: ידע的尼法勒式为被动意义“被知道”。“这事”在上下文中指敌人的谋划；正文保留原文的被动表达，不直接改成较具解释性的“我们识破了”。
- source_word: וַיָּפֶר
  choice: 挫败了
  rationale: הפר以“谋划”为宾语时表示使之落空、破坏或挫败；“挫败”在现代汉语中自然，并准确表达行动结果。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 定冠词形式在这里指以色列的上帝；中文以“上帝”作专名式称呼，无须另译定冠词。
- source_word: עֲצָתָם
  choice: 他们的谋划
  rationale: עֵצָה可指计策、计划或谋议；此处是敌人针对修城者的行动安排，“谋划”既贴合语境，又不过度增添“阴谋”等贬义色彩。
- source_word: וְנָשׁוּב כֻּלָּנוּ
  choice: 我们就全都回到
  rationale: שוב表示返回，כֻּלָּנוּ强调全体。“就”自然呈现前述危机解除后众人恢复工作的叙事进展。
- source_word: הַחוֹמָה
  choice: 城墙
  rationale: 上下文明确指正在重建的耶路撒冷城墙；中文译作“城墙”比单说“墙”更清楚。
- source_word: אִישׁ אֶל מְלַאכְתּוֹ
  choice: 各自做自己的工
  rationale: אִישׁ在此为逐一分配式用法，重点是每个人回到各自负责的工作。“各自做自己的工”自然传达这一结构，同时不把语法阳性不必要地扩大为只限男性。
theological_decisions:
- issue: 挫败敌人谋划的主语
  choice: 明确译为“上帝也挫败了他们的谋划”
  alternative: 弱化为“他们的谋划落空了”或归因于情势变化
  rationale: 希伯来文明确以上帝为וַיָּפֶר的主语，直接把敌人谋划的落空归于上帝；译文保留这一神学陈述，不将其淡化为非人格化的结果。
- issue: אִישׁ的分配式阳性表达
  choice: 译为“各自做自己的工”
  alternative: “各人回去做自己的工”或“各人回到各自的工作岗位”
  rationale: 此处אִישׁ的主要功能是表达群体成员逐一回到各自任务，并非专门讨论性别。中文“各自”准确保留分配意义，避免添加原文没有强调的性别限制。
- issue: 敌人听闻内容的句法范围
  choice: 保留“听说这事已经被我们知道，上帝也挫败了他们的谋划”的并列关系
  alternative: 明确解释为敌人只听说计谋泄露，而叙述者另行说明上帝挫败计谋
  rationale: 希伯来文中כִּי之后接“这事被我们知道”，随后以וַ连接上帝挫败谋划；连接关系允许一定句法张力。译文不额外插入断句性解释，以免武断限定敌人所听见的内容。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“后来”推进叙事；“仇敌、谋划、挫败、城墙”清楚而不过分口语化。“各自做自己的工”保留经文语体，同时普通读者易于理解。
