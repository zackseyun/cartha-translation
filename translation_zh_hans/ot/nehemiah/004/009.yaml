  to: 当我们的仇敌听说我们已经得知这事[a]，并且上帝已经挫败了他们的谋划[b]时，我们全都回到城墙，各自做自己的工作[c]。
  rationale: 修订以“当……时”明确原文的时间框架，并以“并且”清楚连接英文审校轨迹所理解的听闻内容。正文改用自然的汉语主动表达“我们已经得知这事”，同时由脚注保存原文被动形式；其余关键术语与上帝直接挫败敌人谋划的陈述均予保留。
