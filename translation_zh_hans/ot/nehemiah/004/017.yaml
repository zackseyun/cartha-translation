base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/017.yaml
  text: And neither I[a], nor my brothers, nor my young men, nor the men of the guard who were behind me, took off our clothes; each kept his weapon in his right hand, even for water.
translation:
  language: zh_hans
  text: 我、我的弟兄、我的随从，以及跟在我后面的护卫，都不脱衣服；各人连去打水时也带着兵器。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句的希伯来文含义不明，直译近似“各人他的兵器，那水”。可能是说“各人去打水时也带着兵器”，也可能是说“各人把兵器放在手边，甚至取水时也是如此”。
    reason: 原文末句语法简略且可能有多种解释，正文采用符合上下文的一种理解，同时保留其他可能。
lexical_decisions:
- source_word: אֵין ... אֵין
  choice: 都不脱
  rationale: אֵין与分词连用，表示持续的否定状态；中文用“都不脱”自然涵盖前面列举的各组人。
- source_word: אַחַי
  choice: 我的弟兄
  rationale: 保留亲属称谓的字面形式；此处也可能泛指亲近的同伴，但上下文不足以进一步限定。
- source_word: נְעָרַי
  choice: 我的随从
  rationale: נַעַר可指年轻人、仆人或侍从；在尼希米的行政与防卫语境中，“随从”自然且不过度强调年龄或奴仆身份。
- source_word: אַנְשֵׁי הַמִּשְׁמָר
  choice: 护卫
  rationale: מִשְׁמָר含守卫、警戒之意；“护卫”简洁表达承担守卫职责的人。
- source_word: אֲשֶׁר אַחֲרַי
  choice: 跟在我后面的
  rationale: 保留אַחֲרַי的空间或随行含义，不武断判定他们是列队站在后方还是跟随尼希米。
- source_word: פֹשְׁטִים בְּגָדֵינוּ
  choice: 脱衣服
  rationale: פשט与בגדים连用通常指脱去衣服；译文采用现代汉语的自然表达。
- source_word: אִישׁ
  choice: 各人
  rationale: אִישׁ在这里作分配性用法，意为每一个人。
- source_word: שִׁלְחוֹ
  choice: 带着兵器
  rationale: שֶׁלַח可指兵器，尤可指投射或矛类武器；译作泛称“兵器”，避免无根据地限定具体种类或加入原文没有明说的“右手”。
- source_word: הַמָּיִם
  choice: 去打水时
  rationale: 末句极其简略且文本含义困难；按一种合乎语境的理解，指各人取水时仍不离兵器，并以脚注保留不确定性。
