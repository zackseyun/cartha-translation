base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/012.yaml
  text: And the builders each had his sword strapped at his side while they built[a], and the one blowing the trumpet was beside me.
translation:
  language: zh_hans
  text: 建造者各人腰间都佩着剑，一面建造；吹号角[a]的人在我身旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “号角”原文指羊角号。
    reason: 说明שׁוֹפָר所指的具体乐器，避免把它误解为现代金属号。
lexical_decisions:
- source_word: הַבּוֹנִים / וּבוֹנִים
  choice: 建造的人 / 一面建造
  rationale: 前一分词作名词用，指“建造的人”；后一分词在语境中表示他们同时继续施工。译文重复“建造”，保留原文词根的呼应。
- source_word: אִישׁ
  choice: 各自
  rationale: 此处为逐一分配用法，说明建造者人人如此；“各自”符合现代汉语表达。
- source_word: חַרְבּוֹ
  choice: 刀
  rationale: חֶרֶב指用于战斗的刀剑；此处译作普通读者易懂且自然的“刀”。
- source_word: אֲסוּרִים עַל מָתְנָיו
  choice: 腰间佩着
  rationale: 原意为武器被系在腰胯处。“腰间佩着”既表达固定在身上的状态，也自然呈现随时可以使用的情景。
- source_word: וְהַתּוֹקֵעַ בַּשּׁוֹפָר
  choice: 吹号角的人
  rationale: 保留分词所表达的动作，并把שׁוֹפָר译为现代读者易懂的“号角”；脚注说明其具体所指。
- source_word: אֶצְלִי
  choice: 在我身旁
  rationale: 表示与说话者近距离相伴；“在我身旁”准确而自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一面建造”简洁表达施工与佩刀戒备同时进行；分号清楚区分建造者的状态与吹号者的位置。
