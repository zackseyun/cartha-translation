base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/002.yaml
  text: And all of them conspired together to come and fight against Jerusalem and to cause confusion in it[a].
translation:
  language: zh_hans
  text: 他们就全都同谋，要一起来攻打耶路撒冷，使城中陷入混乱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使城中发生骚乱（或祸患）。”希伯来语这个词可指混乱、扰乱或失序。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: 同谋
  rationale: קשר在此表示为敌对行动共同策划、结盟；“同谋”简洁地传达其合谋性质。
- source_word: כֻלָּם יַחְדָּו
  choice: 全都……一起
  rationale: 分别保留“所有人”和“共同”的双重强调，同时使现代汉语自然流畅。
- source_word: לָבוֹא לְהִלָּחֵם
  choice: 要一起来攻打
  rationale: 希伯来文先有“来”，再有“争战”；合译为“一起来攻打”，既保留趋向与共同行动，也符合汉语表达。
- source_word: בִּירוּשָׁלָם
  choice: 攻打耶路撒冷
  rationale: 介词与争战动词连用时表明敌对行动的目标；汉语以“攻打”直接表达。
- source_word: וְלַעֲשׂוֹת לוֹ תּוֹעָה
  choice: 使城中陷入混乱
  rationale: עשה与תּוֹעָה构成使某种状态发生的表达；לוֹ回指耶路撒冷，译作“城中”可自然传达地点关系。
- source_word: תּוֹעָה
  choice: 混乱
  rationale: 该词可指混乱、扰乱或失序；正文采用涵盖面较广的“混乱”，脚注保留其他可能含义。
