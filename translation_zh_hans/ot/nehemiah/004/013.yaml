base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/013.yaml
  text: And I said to the nobles[a], to the officials, and to the rest of the people, “The work is great and spread out, and we are separated along the wall, far from one another.”
translation:
  language: zh_hans
  text: 我对贵族、官长和其余的百姓说：“工程浩大，范围又广；我们分散在城墙各处，彼此相隔很远[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“各人离自己的弟兄”；这是希伯来语习用语，意思是彼此分开。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: 贵族
  rationale: 在《尼希米记》中指社会上有地位的显贵或领袖阶层；“贵族”简明自然，也不把词义泛化为一般的“自由人”。
- source_word: הַסְּגָנִים
  choice: 官长
  rationale: 此词指掌权办事的次级领袖或行政人员；“官长”符合古代行政语境，同时为现代读者所理解。
- source_word: יֶתֶר הָעָם
  choice: 其余的百姓
  rationale: 直接表达除上述领袖以外的其他民众。
- source_word: הַמְּלָאכָה
  choice: 工程
  rationale: 上下文特指重建城墙的工作；“工程”比泛指的“工作”更清楚地呈现施工语境。
- source_word: הַרְבֵּה
  choice: 浩大
  rationale: 作谓语描述工程规模很大；“浩大”庄重而自然。
- source_word: וּרְחָבָה
  choice: 范围又广
  rationale: 原义为“宽广”，在此指工程延伸的范围很广；保留空间广度，又符合现代汉语表达。
- source_word: נִפְרָדִים
  choice: 分散
  rationale: 被动分词表达众人在空间上彼此分开；“分散”不暗示关系破裂或敌对。
- source_word: עַל הַחוֹמָה
  choice: 在城墙各处
  rationale: עַל基本义为“在……上”，结合众人彼此分散的语境，用“各处”自然呈现沿整段城墙分布的含义。
- source_word: רְחוֹקִים
  choice: 相隔很远
  rationale: 准确表达工人之间距离遥远，并与后面的相互关系短语自然衔接。
- source_word: אִישׁ מֵאָחִיו
  choice: 彼此
  rationale: 字面为“各人离开他的弟兄”，是表达相互分隔的希伯来语习用语；“彼此”准确传达其互指意义，字面形式在脚注中说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“工程浩大，范围又广”保留原文两个并列形容语的力度；“分散在城墙各处”兼顾 עַל 的位置含义和全句所强调的空间分布。
