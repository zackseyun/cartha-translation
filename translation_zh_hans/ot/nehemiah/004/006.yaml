base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/006.yaml
  text: And when the Jews who lived near them came and told us ten times[a], “From all the places where you turn[b], they will come up against us,”
translation:
  language: zh_hans
  text: 那些住在敌人附近的犹太人来了，十次告诉我们：“你们无论转向哪里[a]，他们都会来攻击我们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们无论返回哪里。”希伯来语动词通常有“返回”的意思；此处句法较难，也可能指转向任何方向。
    reason: lexical_alternative
  - marker: b
    text: 原文末句未明确说出“他们”或“会来攻击我们”，字面上近似“从所有你们转向（或返回）的地方，……向着我们”。本译文按上下文补出敌对者及其攻击的意思。
    reason: textual_clarity
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר בָּאוּ
  choice: 来了
  rationale: 这一叙事结构引出新的情节发展；现代汉语无需逐字译出“事情发生在……的时候”，直接以“来了”承接上文更自然。
- source_word: הַיְּהוּדִים
  choice: 犹太人
  rationale: 此处指犹太群体；“犹太人”比仅限地域含义的“犹大人”更符合上下文。
- source_word: הַיֹּשְׁבִים אֶצְלָם
  choice: 住在敌人附近的
  rationale: אֵצֶל 表示空间上的邻近；结合上下文，代词“他们”指敌对势力。译出“敌人”可避免现代汉语中指代不清。
- source_word: וַיֹּאמְרוּ לָנוּ
  choice: 告诉我们
  rationale: 这里是把警讯传给尼希米一方；“告诉”符合报告信息的语境。
- source_word: עֶשֶׂר פְּעָמִים
  choice: 接连十次
  rationale: 保留原文明确的数字，同时以“接连”表达反复警告的语用效果。
- source_word: מִכָּל הַמְּקֹמוֹת
  choice: 无论……哪里
  rationale: 以自然汉语表达“从所有地方”的周遍、分配意义。
- source_word: אֲשֶׁר תָּשׁוּבוּ
  choice: 你们……转向
  rationale: שׁוב 通常可指“返回”，但此处句法和语境困难；“转向”保留第二人称复数，并能表达朝任何方向行动的意思。
- source_word: עָלֵינוּ
  choice: 攻击我们
  rationale: עַל 字面可作“在我们之上／向着我们”，在敌对语境中表达针对说话者的攻击；汉语用“攻击我们”清楚传达其敌意。
