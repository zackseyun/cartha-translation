base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/011.yaml
  text: The builders on the wall[a], and those who carried burdens, loaded themselves so that with one hand each did the work[b], and with the other held his weapon.
translation:
  language: zh_hans
  text: 修造城墙的人和搬运重物的人都负着重物[a]；他们各用一只手做工，另一只手拿着兵器[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “负着重物”所译的希伯来语分词很少见，确切含义不易确定；也可理解为“把重物装在自己身上”或“正装载重物”。这里的意思是工人一边处理建筑材料，一边保持武装。
    reason: lexical_alternative
  - marker: b
    text: “兵器”所译的希伯来语词也可更具体地指矛、标枪或其他武器。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים בַּחוֹמָה
  choice: 在城墙上建造的人
  rationale: 将实词化的复数分词译为“建造的人”；介词 בְּ 依施工语境译为“在……上”。
- source_word: וְהַנֹּשְׂאִים בַּסֶּבֶל
  choice: 和搬运重物的人
  rationale: נשא 与 סבל 在这里表示搬运施工所需的重物或材料；“搬运重物”具体而自然。
- source_word: עֹמְשִׂים
  choice: 都负着重物
  rationale: 这是罕见词形，语境指工人负载或担着材料；采用“负着重物”保留持续负重的图景，又不武断限定具体搬运方式。
- source_word: בְּאַחַת יָדוֹ
  choice: 他们各用一只手
  rationale: 原文为单数形式，但在复数群体中具有逐一分配的意义；“他们各”在汉语中清楚表达每个工人的情形。
- source_word: עֹשֶׂה בַמְּלָאכָה
  choice: 做工
  rationale: עשה 与 מלאכה 的组合表示从事工作；简洁译为“做工”符合现代汉语。
- source_word: וְאַחַת מַחֲזֶקֶת
  choice: 另一只手拿着
  rationale: 阴性单数分词与省略但可由上下文补出的“手”相应；汉语需明确补出“另一只手”。
- source_word: הַשָּׁלַח
  choice: 兵器
  rationale: 该词可指投射武器、矛或其他武器；“兵器”保留类别上的宽泛性，避免无根据地限定具体器械。
theological_decisions: []
