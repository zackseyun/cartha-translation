base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/010.yaml
  text: But they are your servants and your people[b][a], whom you redeemed by your great power and by your strong hand.
translation:
  language: zh_hans
  text: 然而，他们是你的仆人和你的子民，就是你用你的大能和有力的手所救赎的。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救赎”也可译作“赎回”或“解救”；希伯来语动词含有借着拯救行动使人获得释放的意思。
    reason: lexical_alternative
  - marker: b
    text: “有力的手”也可译作“大能的手”；希伯来语直译为“强的手”，是形容上帝大能作为的常用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: 然而，他们
  rationale: 连词在上下文中承接前文，并带有轻微转折意味：尽管百姓犯罪、遭受流散，他们仍属于上帝。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: עבד 可指奴仆或仆人；此处重点是百姓与上帝的归属和盟约关系，用“仆人”自然且贴合语境。
- source_word: וְעַמֶּךָ
  choice: 是你的子民
  rationale: עם 在盟约语境中指作为整体的百姓；“子民”能自然表达他们属于上帝，并保留所有格意义。
- source_word: אֲשֶׁר פָּדִיתָ
  choice: 你曾……救赎他们
  rationale: פדה 表示使人得释放，可译为救赎、赎回或解救；这里很可能呼应出埃及的拯救行动，“救赎”保留其盟约与神学分量。
- source_word: בְּכֹחֲךָ הַגָּדוֹל
  choice: 用你的大能
  rationale: כח 指力量或能力；“大能”在现代中文中庄重自然，并准确表达施行救赎的能力。
- source_word: וּבְיָדְךָ הַחֲזָקָה
  choice: 和强有力的手
  rationale: 原文直译为“强壮的手”，是描述上帝有力行动的拟人惯用语；“强有力的手”既保留“手”的意象，又符合现代中文表达。
theological_decisions:
- issue: 尼希米祷告中的救赎用语
  choice: 救赎
  alternative: 赎回；解救
  rationale: 经文回顾上帝过去使其百姓得释放的盟约行动，很可能呼应出埃及传统。“救赎”保留该词的神学分量，同时不把后来的具体教义含义强加于本节。
- issue: “手”的拟人表达
  choice: 保留“手”的意象
  alternative: 意译为“大力作为”
  rationale: “手”是原文显著的神人同形表达，也是圣经中常见的神圣行动意象；保留它不等于主张上帝具有物质身体。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“然而”呈现上下文中的轻微转折；将两个并列名词短语处理为“是你的仆人，是你的子民”，使中文流畅。脚注标记依其所释词语置于正文句末，顺序为[a][b]。
