base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/003.yaml
  text: And they said to me[a], “The remnant there in the province who survived the captivity are in great trouble and disgrace, and the wall of Jerusalem is broken down[b], and its gates have been burned with fire.”
translation:
  language: zh_hans
  text: 他们对我说：“那些从被掳[a]中存留下来、在那省的人，正遭受极大的苦难和羞辱[b]。耶路撒冷的城墙破损，城门也被火焚烧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“流亡”。希伯来语这个短语可理解为“从被掳中”，也可理解为“从流亡中”。
    reason: lexical_alternative
  - marker: b
    text: 或译“正处于极大的困苦和凌辱之中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: 他们对我说
  rationale: 以自然的现代汉语承接叙事；希伯来语的连续叙事形式在此不必机械译出“于是”或“并且”。
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ
  choice: 那些……存留下来……的人
  rationale: 两个同源于 שׁאר 的形式强调灾变之后仍存留的人；“存留下来”既保留余民含义，也符合现代汉语表达。
- source_word: מִן הַשְּׁבִי
  choice: 从被掳中
  rationale: 该短语可指从被掳或流亡的处境中存留下来；正文采用较贴近名词 שְׁבִי 的“被掳”，并以脚注保留“流亡”的可能。
- source_word: בַּמְּדִינָה
  choice: 住在那省
  rationale: 波斯时期的 מְדִינָה 指行政省份；“那省”忠实反映定冠词，而“住在”使地点关系在汉语中清楚自然。
- source_word: בְּרָעָה גְדֹלָה
  choice: 正遭受极大的苦难
  rationale: רָעָה 在此不是道德意义的邪恶，而是严重的患难、困境；“苦难”清楚传达其处境。
- source_word: וּבְחֶרְפָּה
  choice: 和羞辱
  rationale: חֶרְפָּה 表示公开的耻辱、凌辱或被人蔑视的处境；“羞辱”兼顾社会性耻辱与外来的凌辱。
- source_word: חוֹמַת יְרוּשָׁלִַם מְפֹרָצֶת
  choice: 耶路撒冷的城墙被拆毁
  rationale: 被动分词 מְפֹרָצֶת 描述城墙遭破坏、出现缺口的现状；“被拆毁”自然且保留被动意味。
- source_word: וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  choice: 城门也被火焚烧
  rationale: 保留希伯来语“用火焚烧”的具体表达，并以“也”顺畅连接城墙和城门的毁坏。
theological_decisions: []
translation_notes:
