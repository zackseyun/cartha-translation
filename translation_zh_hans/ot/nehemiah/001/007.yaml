base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/007.yaml
  text: We have acted very corruptly against you and have not kept the commandments[a], the statutes[b], and the judgments that you commanded your servant Moses.
translation:
  language: zh_hans
  text: 我们实在对你作了极其败坏的事，没有遵守你所吩咐你仆人摩西的诫命、律例和典章[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “典章”也可译作“法规”或“条例”；希伯来语这个词可指司法裁决或具体法例。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל חָבַלְנוּ
  choice: 我们实在败坏自己
  rationale: 不定式绝对形与限定动词同用，强化“败坏、行事败坏”的意思。“实在”自然传达强调语气；“败坏自己”保留该动词可能带有的自身败坏意味，同时不排除其指败坏行为。
- source_word: לָךְ
  choice: 得罪了你
  rationale: 介词直译为“向你／对你”，在认罪语境中表示行为冒犯上帝。汉语用“得罪了你”能自然表达这种关系性的侵犯。
- source_word: שָׁמַרְנוּ
  choice: 没有遵守
  rationale: שׁמר与诫命等律法用语搭配时，意为谨守、遵行；“遵守”是现代汉语中清楚自然的表达。
- source_word: הַמִּצְוֺת
  choice: 诫命
  rationale: 指上帝所命定的义务。“诫命”保持其圣约与律法语域。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: 指制定并确立的法规。“律例”既符合庄重的法律语域，也与“诫命”和“典章”有所区别。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: 该词可指判例、裁决或法规。“典章”在中文圣经语域中可涵盖法定规章，并保留它与前两个律法词的区分；另见脚注。
- source_word: צִוִּיתָ
  choice: 你吩咐
  rationale: 原词直接表示命令。此处“吩咐”与“你仆人摩西”搭配自然，并保留上帝权威命令的含义。
- source_word: עַבְדֶּךָ
  choice: 你仆人
  rationale: 用于摩西与上帝的关系时，“仆人”是准确而合宜的称谓，强调受差遣的服事。
theological_decisions:
- issue: 是否区分三个律法术语
  choice: 诫命、律例和典章
  alternative: 命令、法令和判例
  rationale: 希伯来文连用三个不同的法律词汇。译文分别处理，以保留经文的律法—圣约质感，又不把三者套入更狭窄的教义分类。
- issue: חֲבֹל חָבַלְנוּ的及物性与强调
  choice: 我们实在败坏自己，得罪了你
  alternative: 我们对你所行的极其败坏
  rationale: 原文以不定式绝对形加强同根动词，且其具体句法语义可理解为行事败坏或使自己败坏。正文采用自然中文表达其强调和可能的反身意味，同时以“得罪了你”表达לָךְ所标示的冒犯方向，不将张力缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“实在”传达希伯来语同根形式的强调；“得罪了你”使关系性的冒犯在中文中清楚自然。三个律法术语保持彼此区分。
