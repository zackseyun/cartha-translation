  text: וָ/אֹמַ֗ר אָֽנָּ֤א יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם הָ/אֵ֥ל הַ/גָּד֖וֹל וְ/הַ/נּוֹרָ֑א שֹׁמֵ֤ר הַ/בְּרִית֙ וָ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/005.yaml
  text: And I said[a], “Please, O Yahweh, God of heaven, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: zh_hans
  text: 我说：“恳求你，耶和华——天上的上帝，伟大而可畏的上帝，向爱你、遵守你诫命的人守约，施慈爱[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“信实不变的爱”或“忠贞之爱”；原词在这里与“约”并列，强调坚定、忠诚的爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我说
  rationale: 未完成式连续体在此引出尼希米祷告的原话；简洁译作“我说”，符合中文叙事衔接。
- source_word: אָנָּא
  choice: 求你垂听
  rationale: 这是祷告中的恳求语气词。中文若只译“求”便悬空，结合本句呼告译作“求你垂听”，自然传达恳求语气，但不把它误作具体祈求内容。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语圣经传统中通行的专名“耶和华”呈现四字神名，保留其作为名字而非称号的性质。
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: 天上的上帝
  rationale: 该结构意为“天之上帝”；“天上的上帝”在现代汉语中自然清楚。
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: 伟大而可畏的上帝
  rationale: נוֹרָא指使人敬畏、令人畏惧；“可畏”保留敬畏与惧怕之间的语义张力，不弱化为一般赞美语。
- source_word: שֹׁמֵר הַבְּרִית
  choice: 守约
  rationale: 希伯来语直译为“守那约”；中文“守约”凝练自然，并保留盟约语义。
- source_word: וָחֶסֶד
  choice: 施慈爱
  rationale: חֶסֶד在盟约语境中含坚定、忠诚的爱；“施慈爱”是自然中文，并用脚注提示其信实不变的内涵。
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: 向爱你、遵守你诫命的人
  rationale: 两个介词短语共同说明上帝守约施慈爱的对象；合并为中文并列定语，保持平行关系。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用的是上帝的专名。正文采用现代汉语读者最熟悉的专名形式“耶和华”，不以“主”替代；“雅威”是另一种较接近学术重构读音的音译。
- issue: נוֹרָא 所表达的敬畏与惧怕
  choice: 可畏
  alternative: 令人敬畏
  rationale: “可畏”既可表达威严所引发的敬畏，也不排除惧怕，较完整保留原词张力。
- issue: בְּרִית 与 חֶסֶד 的关系
  choice: 守约，施慈爱
  alternative: 守约，显出信实的爱
  rationale: 原文并列“约”和“慈爱”，不明确把二者合并成一个复合概念；正文保留并列，脚注说明חֶסֶד在此含忠贞、信实的意味。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。呼告中的“啊”与“求你垂听”保留祷告的恳切语气；“可畏”保留原文敬畏与惧怕的双重色彩。经文在本节末仍属未完句，与下一节相接，因此不加收束性的句号或补足后续祈求。
