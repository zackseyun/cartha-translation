  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָנָּ֣א אֲדֹנָ֗/י תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַ֠שֶּׁבֶת אֶל תְּפִלַּ֨ת עַבְדְּ/ךָ֜ וְ/אֶל תְּפִלַּ֣ת עֲבָדֶ֗י/ךָ הַֽ/חֲפֵצִים֙ לְ/יִרְאָ֣ה אֶת שְׁמֶ֔/ךָ וְ/הַצְלִֽיחָ/ה נָּ֤א לְ/עַבְדְּ/ךָ֙ הַ/יּ֔וֹם וּ/תְנֵ֣/הוּ לְ/רַחֲמִ֔ים לִ/פְנֵ֖י הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/אֲנִ֛י הָיִ֥יתִי מַשְׁקֶ֖ה לַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/011.yaml
  text: Please[a], Lord, let your ear be attentive to the prayer of your servant and to the prayer of your servants who delight to fear your name, and please give success to your servant today and grant him compassion before this man[c][b]. Now I was cupbearer to the king.
translation:
  language: zh_hans
  text: 主啊，求你侧耳听你仆人的祷告，也听你众仆人的祷告；他们乐意敬畏你的名。[a]求你使你的仆人今天顺利，又使他在这个人[c]面前蒙怜悯。[b]那时，我是王的司酒官。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乐意敬畏”也可译作“愿意敬畏”或“喜爱敬畏”；“敬畏”兼有尊崇、惧怕和肃然起敬之意。
    reason: lexical_alternative
  - marker: b
    text: “蒙怜悯”也可译作“蒙恩”或“得到这个人的善待”。希伯来语直译近于“使他得着怜悯”。
    reason: lexical_alternative
  - marker: c
    text: “这个人”指王；下一句说明尼希米当时是王的司酒官。
    reason: cross_reference
lexical_decisions:
- source_word: אָנָּא
  choice: 求你
  rationale: 这是表示恳求的语气词；在向上帝祷告的直接称呼中，“求你”自然、庄重，也传达迫切请求。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 此处是对上帝的称呼，并非四字神名；“主啊”符合现代汉语祷告语体。
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  choice: 求你侧耳听
  rationale: 保留“耳”的身体隐喻，同时用汉语常见的祷告表达传达留心垂听之意。
- source_word: תְּפִלַּת עַבְדְּךָ
  choice: 你仆人的祷告
  rationale: עבד在此是人在上帝面前谦卑的自称，“仆人”比“奴隶”更符合此处语用。
- source_word: עֲבָדֶיךָ
  choice: 你众仆人
  rationale: 与单数“仆人”保持词汇一致，并清楚表达复数群体。
- source_word: הַחֲפֵצִים לְיִרְאָה אֶת שְׁמֶךָ
  choice: 他们乐意敬畏你的名
  rationale: חפץ可表示喜悦、乐意或愿望；“乐意”自然地连接不定式，而“敬畏你的名”保留敬惧与尊崇并存的圣经表达。
- source_word: וְהַצְלִיחָה נָּא לְעַבְדְּךָ הַיּוֹם
  choice: 求你使仆人今天顺利
  rationale: 使役式动词表示使其成功、顺遂；“使……顺利”保留上帝为行动成就者，也符合现代汉语。
- source_word: וּתְנֵהוּ לְרַחֲמִים
  choice: 又使他……蒙怜悯
  rationale: 希伯来语直译近于“将他交付于怜悯”，实际请求他受到怜恤对待；此译保留“怜悯”的语义，而不泛化为一般的“恩宠”。
- source_word: לִפְנֵי הָאִישׁ הַזֶּה
  choice: 在这个人面前
  rationale: 保留原文略带距离感的“这个人”及“在……面前”的空间—关系表达；所指由下一句说明。
- source_word: וַאֲנִי הָיִיתִי מַשְׁקֶה לַמֶּלֶךְ
  choice: 那时，我是王的司酒官
  rationale: 这是祷告后的叙事说明。“司酒官”准确表达宫廷职务；“那时”自然引入背景信息，避免将וַאֲנִי机械译作强转折。
theological_decisions:
- issue: 祷告语境中עבד的译法
  choice: 仆人
  alternative: 奴仆／奴隶
  rationale: 此处强调人在上帝面前谦卑服事的身份，而非法律上的受奴役状态；“仆人”保留从属与服事含义，不额外强化制度性奴役。
- issue: “敬畏你的名”中ירא的译法
  choice: 敬畏你的名
  alternative: 尊崇你的名／畏惧你的名
  rationale: 原词兼具惧怕、尊崇和肃然敬重。“敬畏”在现代汉语中仍能承载这种张力，不宜单纯弱化为“尊敬”，也不宜只突出恐惧。
- issue: לְרַחֲמִים所表达的待遇
  choice: 蒙怜悯
  alternative: 蒙恩／得这个人的好感
  rationale: 选择保留רחמים的怜恤、慈悲内涵；同时以“蒙”表达这是从对方得到的待遇，而非尼希米自身产生怜悯。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“侧耳听”保留原文意象；分号划分两类祷告对象及其说明，避免长句层次不清。脚注标记均置于相关主文之后。
