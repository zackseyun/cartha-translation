  text: וַ/יָּבֹ֨א חֲנָ֜נִי אֶחָ֧ד מֵ/אַחַ֛/י ה֥וּא וַ/אֲנָשִׁ֖ים מִֽ/יהוּדָ֑ה וָ/אֶשְׁאָלֵ֞/ם עַל הַ/יְּהוּדִ֧ים הַ/פְּלֵיטָ֛ה אֲשֶֽׁר נִשְׁאֲר֥וּ מִן הַ/שֶּׁ֖בִי וְ/עַל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/002.yaml
  text: Hanani[a], one of my brothers, came—he and some men from Judah—and I asked them about the Jews who had escaped, who were left from the captivity[c][b], and about Jerusalem.
translation:
  language: zh_hans
  text: 我的一个兄弟哈拿尼和几个人从犹大来到。我问他们那些逃脱[b]、从被掳[c]中存留下来的犹太人[a]的情况，也问了耶路撒冷的情况。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”或译“犹大人”。希伯来语这个词既可指犹大地区的人，也可较广泛地指犹太民族。
    reason: lexical_alternative
  - marker: b
    text: “逃脱”或译“幸存”或“作为余民存留”。
    reason: lexical_alternative
  - marker: c
    text: “被掳”或译“流亡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: 该叙事形式表示过去发生的移动；“来到”符合第一人称叙事视角，也自然简洁。
- source_word: חֲנָנִי
  choice: 哈拿尼
  rationale: 按现代中文圣经人名的常见音译处理。
- source_word: אֶחָד מֵאַחַי הוּא
  choice: 我的一个兄弟
  rationale: 保留“兄弟”的男性亲属称谓及“其中一个”的含义，不擅自扩大为较宽泛的“族人”。
- source_word: וַאֲנָשִׁים מִיהוּדָה
  choice: 和几个人从犹大
  rationale: 表达哈拿尼有来自犹大的数名同行者；“几个人”在中文中自然，且不暗示确切人数。
- source_word: וָאֶשְׁאָלֵם
  choice: 我问他们……的情况
  rationale: שׁאל在这里指询问；补出“情况”使两个以עַל引出的询问主题在现代中文中清楚自然。
- source_word: הַיְּהוּדִים
  choice: 犹太人
  rationale: 在波斯时期语境中可指犹大人，也可较广泛地指犹太群体；正文采用现代中文较通行的“犹太人”，并以脚注保留另一可能。
- source_word: הַפְּלֵיטָה
  choice: 那些逃脱……的
  rationale: 原文虽为集合名词，可指逃脱者、幸存者或余民；正文用关系结构连接“犹太人”，避免生硬，同时保留逃脱之意。
- source_word: אֲשֶׁר נִשְׁאֲרוּ
  choice: 存留下来的
  rationale: 体现该词的存留、剩下之义及其结果状态，不把它专门化为带较强神学色彩的术语。
- source_word: מִן הַשֶּׁבִי
  choice: 从被掳中
  rationale: שׁבי可指被掳、囚禁或流亡处境；“被掳”贴近原词，并符合中文历史叙述习惯。
- source_word: וְעַל יְרוּשָׁלִָם
  choice: 也问了耶路撒冷的情况
  rationale: 保留耶路撒冷作为第二个询问主题，并用“也”呈现与前项的并列关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文保留原文两项询问对象的结构，并通过脚注呈现“犹太人/犹大人”、“逃脱者/幸存者/余民”及“被掳/流亡”的真实词义幅度。
