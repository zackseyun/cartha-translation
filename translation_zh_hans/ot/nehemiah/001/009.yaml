  text: וְ/שַׁבְתֶּ֣ם אֵלַ֔/י וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אִם יִהְיֶ֨ה נִֽדַּחֲ/כֶ֜ם בִּ/קְצֵ֤ה הַ/שָּׁמַ֨יִם֙ מִ/שָּׁ֣ם אֲקַבְּצֵ֔/ם ו/הבואתי/ם אֶל הַ/מָּק֔וֹם אֲשֶׁ֣ר בָּחַ֔רְתִּי לְ/שַׁכֵּ֥ן אֶת שְׁמִ֖/י שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/009.yaml
  text: but if you return to me and keep my commandments and do them[a], though your outcasts are at the end of the heavens, from there I will gather them and bring them to the place that I have chosen[c][b], to make my name dwell there.
translation:
  language: zh_hans
  text: 但你们若归向我，谨守我的诫命，并遵行这些诫命，即使你们被驱散的人[a]远在天的尽头[b]，我也要从那里招聚他们，把他们带到我所选择、使我的名住在那里的地方[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被驱散的人”也可译作“被赶逐的人”或“流散的人”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“在天的尽头”，是指远到极点。
    reason: cultural_note
  - marker: c
    text: “使我的名住在那里”也可译作“把我的名安置在那里”；原文保留了上帝之名居住在所选之地的意象。
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתֶּם אֵלַי
  choice: 但你们若归向我
  rationale: שׁוּב与אֶל连用表示“归回、转向”。本句承接上一节的条件结构，因此用“若”；“但”体现警告与归回应许之间的转折。
- source_word: וּשְׁמַרְתֶּם מִצְוֺתַי
  choice: 谨守我的诫命
  rationale: שׁמר与“诫命”搭配，指留心持守和遵守；“谨守”自然保留盟约语境中的郑重意味。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: 并且遵行
  rationale: 原文另用עשׂה强调实际实行。译文没有把它与“谨守”合并，以保留两层表达；汉语可省略已明确的宾语“这些诫命”。
- source_word: נִדַּחֲכֶם
  choice: 你们中被驱散的人
  rationale: נדח描述被赶离、驱散的人，符合流亡背景；此译法保留其被动意味，也避免“被弃绝的人”可能带来的神学误解。
- source_word: בִּקְצֵה הַשָּׁמַיִם
  choice: 在天的尽头
  rationale: 较贴近原文的宇宙空间意象，同时在汉语中可理解为极其遥远之处。
- source_word: מִשָּׁם אֲקַבְּצֵם
  choice: 从那里招聚他们
  rationale: קבץ常用于招聚分散或流亡的群体；“招聚”既自然，也体现主动召集、重新聚合之意。
- source_word: וַהֲבֹאתִים
  choice: 把他们带到
  rationale: בוא的使役式在此自然译为“带到”，保留目的地关系。
- source_word: הַמָּקוֹם אֲשֶׁר בָּחַרְתִּי
  choice: 我所选择……的地方
  rationale: בחר表示上帝对圣所所在地的拣选；“所选择”庄重而不生硬。
- source_word: לְשַׁכֵּן אֶת שְׁמִי שָׁם
  choice: 使我的名住在那里
  rationale: 保留שׁכן使役式及“名居住”的申命记式意象，不将其弱化为仅仅“立名”，也不把上帝本身局限于某一空间。
theological_decisions:
- issue: 圣所语句中上帝之名与临在的表达
  choice: 使我的名住在那里
  alternative: 把我的名安置在那里
  rationale: 原文采用上帝使自己的名“居住”在所选之地的固定表达。直译其居住意象，既显示该地与上帝临在的特殊关联，也不暗示上帝的本体被空间限制。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“谨守……并且遵行”保留原文两重顺服用语；“天的尽头”和“使我的名住在那里”保留希伯来文的重要意象，并以脚注说明其习语和可选译法。
