base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
translation:
  language: zh_hans
  text: 哈迦利亚的儿子尼希米的记述[a]。在第二十年[b]基斯流月，我在书珊卫城[c]时，发生了这样的事：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记述”或译“言语”。希伯来文这一标题可指一个人的话语、事迹或叙事记录。
    reason: lexical_alternative
  - marker: b
    text: 原文只说“第二十年”，本节没有明确说明是哪位君王在位的第二十年；后文显示是亚达薛西王。
    reason: cultural_note
  - marker: c
    text: “卫城”或译“堡垒”。原词指设防的王室建筑群。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: 记言
  rationale: 该词组可指一个人的话语、事迹或记述。“记言”适合作为书卷标题，并保留原文没有明确限定为“回忆录”或“记事”的宽泛含义。
- source_word: נְחֶמְיָה בֶּן חֲכַלְיָה
  choice: 哈迦利亚的儿子尼希米
  rationale: 按现代汉语习惯表达父子关系；人名采用常见中文圣经译名。
- source_word: וַיְהִי
  choice: 事情是这样发生的
  rationale: 体现希伯来叙事公式开启正文的功能；句末冒号自然引出下文，而不采用古雅的“事情发生了”。
- source_word: בְחֹדֶשׁ כִּסְלֵו
  choice: 基斯流月
  rationale: 音译希伯来历月名，并用“月”明确其历法性质。
- source_word: שְׁנַת עֶשְׂרִים
  choice: 二十年
  rationale: 紧贴原文日期表达，不在正文补入原文未明说的君王或年号归属。
- source_word: וַאֲנִי הָיִיתִי
  choice: 我在……时
  rationale: 以时间从句自然表达叙述者当时所处的情境。
- source_word: שׁוּשַׁן
  choice: 书珊
  rationale: 采用该地名在中文圣经传统中通行且易辨认的译名。
- source_word: הַבִּירָה
  choice: 城堡
  rationale: 该词指设防的王室建筑群或堡垒；“城堡”简明自然，并避免误释为整个首都。
theological_decisions:
- issue: “二十年”的纪年归属
  choice: 正文仅译“二十年”
  alternative: 亚达薛西王二十年
  rationale: 本节本身没有明说是哪位君王的在位年；不依据后文提前补明，以保存原文在此处的信息范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。开头保留标题性质，以“记言”维持 דִּבְרֵי 可涵盖话语与记述的弹性；后半句用冒号承接下一节，符合本句作为叙事开端的功能。所有脚注标记均置于对应正文词语之后。
