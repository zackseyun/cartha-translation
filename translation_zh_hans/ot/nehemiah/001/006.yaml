  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַשֶּׁ֣בֶת וְֽ/עֵינֶ֪י/ךָ פְתֻוּח֟וֹת לִ/שְׁמֹ֣עַ אֶל תְּפִלַּ֣ת עַבְדְּ/ךָ֡ אֲשֶׁ֣ר אָנֹכִי֩ מִתְפַּלֵּ֨ל לְ/פָנֶ֤י/ךָ הַ/יּוֹם֙ יוֹמָ֣ם וָ/לַ֔יְלָה עַל בְּנֵ֥י יִשְׂרָאֵ֖ל עֲבָדֶ֑י/ךָ וּ/מִתְוַדֶּ֗ה עַל חַטֹּ֤אות בְּנֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֣ר חָטָ֣אנוּ לָ֔/ךְ וַ/אֲנִ֥י וּ/בֵית אָבִ֖/י חָטָֽאנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/006.yaml
  text: Please let your ear be attentive and your eyes open to hear the prayer of your servant that I am now praying before you day and night, for the sons of Israel, your servants, while confessing the sins of the sons of Israel that we have sinned against you. I and my father's house have sinned.
translation:
  language: zh_hans
  text: 求你侧耳留心，睁开双眼，垂听你仆人的祷告；我如今在你面前昼夜为以色列子孙——你的仆人——祷告，同时承认以色列子孙所犯的罪，就是我们得罪了你的罪。我和我父家都犯了罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהִי נָא
  choice: 求你……
  rationale: 祈愿式配合 נָא 表达恳求；“求你”在现代汉语祷告语体中自然、庄重。
- source_word: אָזְנְךָ קַשֶּׁבֶת
  choice: 侧耳留心
  rationale: 保留“耳”的拟人意象，并以“留心”表达 קַשֶּׁבֶת 的专注聆听之意。
- source_word: וְעֵינֶיךָ פְתֻוּחוֹת
  choice: 睁眼垂看
  rationale: 保留复数“眼睛张开”的拟人图像；汉语以“睁眼垂看”与“侧耳留心”形成自然的祷告平行句。
- source_word: לִשְׁמֹעַ אֶל תְּפִלַּת עַבְדְּךָ
  choice: 听你仆人的祷告
  rationale: 直接传达 שׁמע 的听取之意；“仆人”符合敬虔自称的语境。
- source_word: אֲשֶׁר אָנֹכִי מִתְפַּלֵּל לְפָנֶיךָ הַיּוֹם יוֹמָם וָלַיְלָה
  choice: 就是我如今在你面前昼夜……所献的祷告
  rationale: “如今”体现 הַיּוֹם 的当前时间指向，“昼夜”保留持续祷告的表达；“在你面前”直译关系语义。
- source_word: עַל בְּנֵי יִשְׂרָאֵל עֲבָדֶיךָ
  choice: 为以色列子孙——你的仆人——
  rationale: עַל 在代祷语境中译作“为”；“以色列子孙”保留 בְּנֵי יִשְׂרָאֵל 的亲族、圣约表达，插入语明确“你的仆人”与其同位。
- source_word: וּמִתְוַדֶּה עַל חַטֹּאות
  choice: 我也承认……所犯的罪
  rationale: 协调分词表示与祷告同时进行的认罪行动；“承认……罪”清楚传达 ידה Hitpael 的认罪含义。
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: 就是我们得罪了你
  rationale: לָךְ 在此标明犯罪所针对的对象；“得罪了你”是自然且有道德分量的汉语。
- source_word: וַאֲנִי וּבֵית אָבִי חָטָאנוּ
  choice: 我和我父家都犯了罪
  rationale: 保留尼希米本人及父系家族共同认罪的范围；“父家”为可理解的圣经家族用语。
theological_decisions:
- issue: 对上帝使用“耳”和“眼”的拟人语言
  choice: 保留为“侧耳留心，睁眼垂看”
  alternative: 意译为“求你留意并垂听”
  rationale: 原文刻意使用身体意象表现上帝的关注；译文保留其修辞，不把它解释为上帝具有物质身体。
- issue: בְּנֵי יִשְׂרָאֵל 的表达
  choice: 以色列子孙
  alternative: 以色列人／以色列民
  rationale: “以色列子孙”保留原文的亲族与圣约色彩，同时在现代汉语中仍然清楚。
- issue: 认罪主体的扩展
  choice: 先说“我们”，再明确“我和我父家”
  alternative: 将两句合并为笼统的集体认罪
  rationale: 保留原文从以色列群体转向尼希米本人及其父家的张力和责任承担。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告语体。保留原文拟人意象和“以色列子孙”的亲族表达；以破折号处理同位成分，避免长句关系含混。
