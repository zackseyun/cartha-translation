  text: וַ/יְהִ֞י כְּ/שָׁמְעִ֣/י אֶת הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה יָשַׁ֨בְתִּי֙ וָֽ/אֶבְכֶּ֔ה וָ/אֶתְאַבְּלָ֖/ה יָמִ֑ים וָֽ/אֱהִ֥י צָם֙ וּ/מִתְפַּלֵּ֔ל לִ/פְנֵ֖י אֱלֹהֵ֥י הַ/שָּׁמָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/004.yaml
  text: And when I heard these words[a], I sat down and wept and mourned for days[b], and I was fasting and praying before the God of heaven.
translation:
  language: zh_hans
  text: 我一听见这些话[a]，就坐下哭泣，哀伤了数日，并且一直在天上的上帝面前禁食祷告。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这些事”。希伯来语 דְּבָרִים 可指“话”“事”或“事情”。
    reason: lexical_alternative
  - marker: b
    text: 或译“禁食祷告”。希伯来语用“是”加分词的结构，表示这些行动持续进行。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעִי
  choice: 我一听见
  rationale: 这是常见的叙事时间结构；“我一听见”自然表达事件承接及随即发生的反应，无须生硬译出“事情发生了”。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דְּבָרִים 可指“话”“事情”或“事件”；此处承接上一节所述报告，译作“这些话”既贴近字面，也可自然指报告的内容。
- source_word: יָשַׁבְתִּי
  choice: 坐下
  rationale: יָשַׁבְתִּי 的基本义为“坐、居住、停留”；在强烈悲痛的语境中，“坐下”最自然地表现尼希米当时的身体反应。
- source_word: וָאֶבְכֶּה
  choice: 哭泣
  rationale: בכה 是普通的“哭泣、流泪”；“哭泣”准确而庄重，适合哀恸语境。
- source_word: וָאֶתְאַבְּלָה
  choice: 悲哀
  rationale: אבל 表示为悲痛之事哀悼，常含持续性；“悲哀了好些日子”在现代汉语中自然，并保留其哀悼意味。
- source_word: יָמִים
  choice: 好些日子
  rationale: 复数“日子”在这里作时间长度用；“好些日子”自然表达一段未明确限定的多日时间。
- source_word: וָאֱהִי צָם וּמִתְפַּלֵּל
  choice: 禁食祷告
  rationale: היה 加分词表达持续进行的行动。汉语通常无需用进行体标记也能由上下文表达持续性；脚注说明亦可直译为“持续禁食祷告”。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: לִפְנֵי 可指“在……面前、在……的同在中”；此译法简洁自然，并保留祷告是在上帝面前进行的关系性含义。
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: 天上的上帝
  rationale: 这是以“天”为属格内容的神圣称号。现代汉语“天上的上帝”自然明确，并未把原文没有出现的耶和华之名带入经文。
theological_decisions:
- issue: 神圣称号 אֱלֹהֵי הַשָּׁמָיִם 的译法
  choice: 天上的上帝
  alternative: 天之上帝
  rationale: 原文是“天的上帝”这一称号，而不是耶和华之名。采用现代汉语惯用的“天上的上帝”，既保留称号的内容，也避免引入原文未有的圣约名。
- issue: 禁食与祷告的持续体
  choice: 正文译作“禁食祷告”，脚注说明持续含义
  alternative: 持续禁食祷告
  rationale: היה 加两个分词确有持续或反复进行的意味；正文采用简洁自然的汉语，不把持续性解释得过满，同时用脚注保留原文体貌信息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我一听见……就……”体现希伯来叙事的时间承接；“悲哀了好些日子”保留哀悼的持续性。所有脚注标记均已置于正文。
