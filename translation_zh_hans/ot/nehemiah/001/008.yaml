id: NEH.1.8
reference: Nehemiah 1:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זְכָר נָא֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר צִוִּ֛יתָ אֶת מֹשֶׁ֥ה עַבְדְּ/ךָ֖ לֵ/אמֹ֑ר אַתֶּ֣ם תִּמְעָ֔לוּ אֲנִ֕י אָפִ֥יץ אֶתְ/כֶ֖ם בָּ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/008.yaml
  text: Please remember the word that you commanded your servant Moses[a], saying, ‘If you act unfaithfully[b], I will scatter you among the peoples.’
translation:
  language: zh_hans
  text: 求你记念你吩咐你仆人摩西的话，说：‘你们若背信[a]，我就把你们分散在万民中[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不忠”或“违背信义”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“列国中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: 求你记念
  rationale: 祈使式“记念”加恳求语气词 נָא；“求你”自然传达尼希米敬重而迫切的祈求。
- source_word: הַדָּבָר
  choice: 话
  rationale: דָּבָר 此处指上帝借摩西所宣告的具体内容；“话”既贴近原词，也符合现代汉语表达。
- source_word: צִוִּיתָ
  choice: 吩咐
  rationale: צוה 表示命令、吩咐；此处“吩咐你仆人摩西”比生硬的“命令摩西”更自然，同时保留权威意味。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 摩西在这里是服事上帝的仆人；这一译法符合语境和庄重的圣经叙述语体。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留引出所吩咐内容的引语公式。
- source_word: תִּמְעָלוּ
  choice: 背信
  rationale: מעל 指不忠、违背信义，常含盟约关系中的失信意味；“背信”简洁地保留这一含义，而不泛化为一般的“犯罪”。
- source_word: אָפִיץ
  choice: 分散
  rationale: פוץ 的使役形表示使之散开；“分散”准确而自然地表达审判中的驱散。
- source_word: בָּעַמִּים
  choice: 在万民中
  rationale: עַמִּים 是“众民、各族人民”的复数；“万民”是现代汉语中庄重自然的集合表达，不必限定为政治国家。
theological_decisions:
- issue: 条件句中 מעל 的盟约性不忠含义
  choice: 你们若背信
  alternative: 你们若不忠；你们若违背信义
  rationale: “背信”保留对关系或盟约不忠的张力，又不额外规定具体违犯的法律类别。
- issue: בָּעַמִּים 所指群体的表达
  choice: 在万民中
  alternative: 在列国中
  rationale: 原文使用 עַמִּים（众民），并非明确采用通常译作“列国”的 גּוֹיִם；正文因此保留“民”的语义，脚注列出语境上可能的译法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你记念”体现恳求语气；“你仆人摩西”沿用自然的宗教叙述表达。引文中的复数“你们”及“我就”保留原文人称与条件—后果结构。
