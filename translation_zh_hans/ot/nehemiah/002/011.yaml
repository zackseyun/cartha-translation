lexical_decisions:
- source_word: וָאָבוֹא
  choice: 于是我来到
  rationale: 叙事性的连续式推动事件向前；“于是”自然表达承接关系，“来到”准确传达第一人称抵达目的地。
- source_word: אֶל
  choice: 到
  rationale: 与移动动词连用时表示目的地；现代汉语用“到”最自然。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用该地名通行的现代中文译名。
- source_word: וָאֱהִי
  choice: 住了
  rationale: היה本义宽泛，为“是、处于”；在地点副词和时段表达的语境中表示停留或居住。“住了”符合现代汉语，同时保留其在当地度过一段时间的含义。
- source_word: שָׁם
  choice: 在那里
  rationale: 指回耶路撒冷；补出介词“在”使中文自然清楚。
- source_word: יָמִים שְׁלֹשָׁה
  choice: 三天
  rationale: 该结构表示持续时间；“住了三天”直接、自然地表达这一时长。
