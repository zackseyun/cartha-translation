  text: וָ/אָק֣וּם לַ֗יְלָה אֲנִי֮ וַ/אֲנָשִׁ֣ים מְעַט֮ עִמִּ/י֒ וְ/לֹא הִגַּ֣דְתִּי לְ/אָדָ֔ם מָ֗ה אֱלֹהַ/י֙ נֹתֵ֣ן אֶל לִבִּ֔/י לַ/עֲשׂ֖וֹת לִ/ירוּשָׁלִָ֑ם וּ/בְהֵמָה֙ אֵ֣ין עִמִּ֔/י כִּ֚י אִם הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אֲנִ֖י רֹכֵ֥ב בָּֽ/הּ׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/012.yaml
  text: So I arose in the night[a], I and a few men with me, and I had not told anyone what my God was putting into my heart to do for Jerusalem[c][b]. And there was no animal with me except the animal on which I was riding.
translation:
  language: zh_hans
  text: 那夜，我起来，只有几个人跟我在一起；我没有告诉任何人，我的上帝正在把要为耶路撒冷做的事放在我心里。[a]除了我所骑的牲口以外，我身边没有别的牲口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正在把……放在我心里”也可译作“已经把……放在我心里”或“正在在我心里激发……”。原文分词可表达持续的行动，也可生动地描述先前形成的意念。
    reason: 原文נֹתֵן是分词；脚注说明可行的时体表达，且不把上帝的内在推动解释为特定形式的启示。
lexical_decisions:
- source_word: וָאָקוּם לַיְלָה
  choice: 于是，我在夜间起来
  rationale: קום的叙事形式表示接续发生的动作；“起来”庄重而自然。“在夜间”准确表达行动的时间。
- source_word: אֲנִי וַאֲנָשִׁים מְעַט עִמִּי
  choice: 带着几个人
  rationale: 原文明确说尼希米与少数人同行；汉语不必重复“我”，用“带着几个人”即可自然保留同行者人数很少这一信息。
- source_word: וְלֹא הִגַּדְתִּי לְאָדָם
  choice: 我没有告诉任何人
  rationale: לְאָדָם在这里是不定泛指，现代汉语以“任何人”最自然准确，不限定性别。
- source_word: מָה אֱלֹהַי נֹתֵן אֶל־לִבִּי
  choice: 我的上帝正在把……放在我心里
  rationale: נֹתֵן是分词，保留进行或生动的动作意味；“放在我心里”保留希伯来语关于内在思想与意志的表达，不把它强化为明确的言语启示。
- source_word: לַעֲשׂוֹת לִירוּשָׁלִָם
  choice: 他要我为耶路撒冷做的事
  rationale: “为耶路撒冷做”保留介词结构的宽泛性，不提前具体说明为重建或改革；补出“他要我”使汉语句法清楚，同时仍把行动的发起归于上帝。
- source_word: וּבְהֵמָה אֵין עִמִּי כִּי אִם הַבְּהֵמָה
  choice: 除了我所骑的牲口以外，我没有带别的牲口
  rationale: בְּהֵמָה是泛指牲畜，在此为骑乘用牲口；“牲口”比“动物”更符合古代出行语境，也不擅自指定为马、驴或骡。
- source_word: אֲשֶׁר אֲנִי רֹכֵב בָּהּ
  choice: 我所骑的
  rationale: 简洁表达关系从句和骑乘动作，符合现代汉语。
theological_decisions:
- issue: 上帝对尼希米内心计划的推动
  choice: “我的上帝正在把他要我……做的事放在我心里”
  alternative: “我的上帝已经把……放在我心里”或“我的上帝正在感动我……”
  rationale: 原文分词可呈现持续或生动的行动，但并未明确说明言语启示的方式。译文保留上帝的主动与尼希米的人类行动之间的张力，不把它解释成某种特定启示机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“牲口”符合古代骑乘语境，并保留原文未说明具体牲畜种类的概括性。脚注标记置于相关分句之后。
