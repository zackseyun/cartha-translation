  text: וַ/יְהִ֣י בְּ/חֹ֣דֶשׁ נִיסָ֗ן שְׁנַ֥ת עֶשְׂרִ֛ים לְ/אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּ֖לֶךְ יַ֣יִן לְ/פָנָ֑י/ו וָ/אֶשָּׂ֤א אֶת הַ/יַּ֨יִן֙ וָ/אֶתְּנָ֣/ה לַ/מֶּ֔לֶךְ וְ/לֹא הָיִ֥יתִי רַ֖ע לְ/פָנָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/001.yaml
  text: And it happened in the month of Nisan[a], in the twentieth year of King Artaxerxes, when wine was before him, that I took up the wine and gave it to the king. Now I had not been sad in his presence.
translation:
  language: zh_hans
  text: 亚达薛西王第二十年尼散月，酒摆在王面前；我拿起酒来，递给王。在此以前，我在王面前从未面带愁容[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“我在他面前并没有显得不好。”希伯来文直译是“我在他面前不是坏的”；在这里指人在王面前显出忧愁或不悦的神色。
    reason: 说明希伯来语习语的字面意义及其在宫廷语境中的含义，并保留较直译的可能。
lexical_decisions:
- source_word: וַיְהִי בְּחֹדֶשׁ נִיסָן
  choice: 尼散月
  rationale: וַיְהִי承接叙事并引出日期，汉语可由整句时序自然表达，无须机械译为“事情发生了”；“尼散”采用现代中文圣经中通行的月份音译。
- source_word: שְׁנַת עֶשְׂרִים לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: 亚达薛西王第二十年
  rationale: 按君王在位年份纪年；“亚达薛西”是该波斯王名在中文圣经中的通行译名。
- source_word: יַיִן לְפָנָיו
  choice: 酒摆在王面前
  rationale: 保留原文的“酒”而不增补原文未明说的“杯”；将代词明确为“王”，使中文指代清楚。
- source_word: וָאֶשָּׂא אֶת־הַיַּיִן
  choice: 我拿起酒来
  rationale: נשא在此指拿起或端起用于侍奉王的酒；不擅自具体化为“酒杯”。
- source_word: וָאֶתְּנָה לַמֶּלֶךְ
  choice: 递给王
  rationale: נתן基本义为“给”；宫廷侍酒场景中“递给”比生硬的“给了”更自然，同时未增添“给王喝”等原文未明说的信息。
- source_word: וְלֹא הָיִיתִי רַע לְפָנָיו
  choice: 在此以前，我在王面前从未面带愁容
  rationale: רַע字面为“坏、不好”，此处结合王下一节对尼希米脸色的观察，指在王面前显出愁苦或不悦的神色。汉语以“面带愁容”表达该语境义；“在此以前”呈现叙事所暗示的先前状态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留“酒”而不补作“酒杯”，避免超出原文；将重复代词适度明确为“王”，以符合现代汉语表达。脚注标记置于其实际解释的“面带愁容”之后。
