base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/016.yaml
  text: But the officials did not know where I had gone or what I was doing[a], and until then I had not told the Jews, the priests, the nobles, the officials, or the rest who were doing the work.
translation:
  language: zh_hans
  text: 官员们并不知道我去了哪里，也不知道我在做什么；在此之前，我还没有把这事告诉犹太人[a]、祭司、贵族、官员，以及其余从事这工作的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译为“犹大人”。希伯来语 יְהוּדִים 既可按地域指犹大人，也可较广泛地指犹太群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּגָנִים
  choice: 官长们
  rationale: 该词指地位较高但从属的行政官员；“官长”既符合历史叙事语体，也不武断限定为某一波斯官职。
- source_word: יָדְעוּ
  choice: 并不知道
  rationale: ידע的基本义为“知道”；否定形式按叙事语境直译为“并不知道”。
- source_word: אָנה הָלַכְתִּי
  choice: 我去了哪里
  rationale: אָנה表示去向；现代汉语以“去了哪里”自然表达此前行动的目的地，无须用形态明确标示过去完成。
- source_word: וּמָה אֲנִי עֹשֶׂה
  choice: 也不知道我在做什么
  rationale: 分词עֹשֶׂה可表示正在进行的行动；重复“也不知道”使汉语句法清楚，并保留原文两个未知事项的并列关系。
- source_word: לַיְּהוּדִים
  choice: 犹太人
  rationale: יְהוּדִים可指犹大地区的人，也可泛指犹太群体；正文采用现代读者较熟悉的“犹太人”，另以脚注保留“犹大人”的地域性可能。
- source_word: לַכֹּהֲנִים
  choice: 祭司
  rationale: כֹּהֲנִים的直接、通行译法。
- source_word: לַחֹרִים
  choice: 贵族
  rationale: 在本节行政和社会群体的语境中，חֹרִים指有地位的显贵或上层人士；“贵族”简明贴切。
- source_word: וּלְיֶתֶר עֹשֵׂה הַמְּלָאכָה
  choice: 以及其余参与这项工程的人
  rationale: יֶתֶר表示“其余”，עֹשֵׂה הַמְּלָאכָה为具有集合意义的单数分词结构；“参与这项工程的人”自然传达从事该项任务者，且“工程”契合城墙修复语境。
- source_word: עַד כֵּן
  choice: 在此之前
  rationale: 该短语标示截至当时的时间界限；“在此之前”符合现代汉语叙事表达。
- source_word: הִגַּדְתִּי
  choice: 我还没有把这事告诉
  rationale: נגד使役式意为告诉、报告或使人知道；“告诉”自然准确，“这事”承接前文所做之事，在汉语中补足宾语。
