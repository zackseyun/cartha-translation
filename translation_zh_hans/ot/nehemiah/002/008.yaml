  text: וְ/אִגֶּ֡רֶת אֶל אָסָף֩ שֹׁמֵ֨ר הַ/פַּרְדֵּ֜ס אֲשֶׁ֣ר לַ/מֶּ֗לֶךְ אֲשֶׁ֣ר יִתֶּן לִ֣/י עֵצִ֡ים לְ֠/קָרוֹת אֶת שַׁעֲרֵ֨י הַ/בִּירָ֤ה אֲשֶׁר לַ/בַּ֨יִת֙ וּ/לְ/חוֹמַ֣ת הָ/עִ֔יר וְ/לַ/בַּ֖יִת אֲשֶׁר אָב֣וֹא אֵלָ֑י/ו וַ/יִּתֶּן לִ֣/י הַ/מֶּ֔לֶךְ כְּ/יַד אֱלֹהַ֖/י הַ/טּוֹבָ֥ה עָלָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/008.yaml
  text: and a letter to Asaph[a], the keeper of the king’s forest, that he should give me timber to make beams for the gates of the fortress by the temple, and for the wall of the city, and for the house that I will occupy. And the king gave them to me[d][c][b], according to the good hand of my God upon me.
translation:
  language: zh_hans
  text: 又请王赐我一封给管理王室园林的亚萨的信[a]，好让他给我木料，为那座属于圣殿的堡垒的各门架梁[b]，又供修造城墙和我将要住的房屋之用。王就照着我上帝美善的手在我身上所施的恩，把我所求的赐给了我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王室园林”也可译作“王室林苑”或“王室园囿”；希伯来词指由王室管理的园地、园囿或林地。
    reason: lexical_alternative
  - marker: b
    text: 直译为“属于那殿的堡垒的各门”。“殿”在这里很可能指圣殿；这座堡垒也可理解为“圣殿旁的堡垒”或“圣殿的堡垒”。
    reason: lexical_alternative
  - marker: c
    text: 直译为“照着我上帝美善的手在我身上”。“手”是形容上帝施恩、帮助和眷顾的形象说法。
    reason: cultural_note
lexical_decisions:
- source_word: אִגֶּרֶת
  choice: 一封信
  rationale: 该词可指书信或公文；在王向官员下达授权的语境中，“一封信”自然清楚，也保留其文书性质。
- source_word: שֹׁמֵר הַפַּרְדֵּס אֲשֶׁר לַמֶּלֶךְ
  choice: 管理王室园林的
  rationale: פַּרְדֵּס 指受管理的园林、园囿或林苑；因其能供应建筑木料，“王室园林”比单纯“果园”宽泛，并以脚注保留“林苑”的可能。
- source_word: יִתֶּן לִי עֵצִים
  choice: 给我木料
  rationale: עֵצִים 可指树木或木材；建筑语境明确要求可供施工的木料。
- source_word: לְקָרוֹת
  choice: 架梁
  rationale: 该动词表示安设梁木，并可延伸为盖顶；“架梁”既简洁又贴近具体建筑动作。
- source_word: שַׁעֲרֵי הַבִּירָה אֲשֶׁר לַבָּיִת
  choice: 圣殿所属堡垒的各门
  rationale: בִּירָה 是堡垒或城堡，אֲשֶׁר לַבַּיִת 表示与“殿”所属或相关；译文采用“圣殿所属”，不把关系擅自限定为空间上的“邻近”。
- source_word: הַבַּיִת אֲשֶׁר אָבוֹא אֵלָיו
  choice: 我将要入住的房屋
  rationale: 字面为“我将要进入的房屋”，语境指尼希米将使用的住所；“入住”在现代汉语中自然表达这一含义。
- source_word: וַיִּתֶּן לִי הַמֶּלֶךְ
  choice: 王就把我所求的赐给我
  rationale: 希伯来文未明说宾语，中文若只译“王就给了我”不完整；“我所求的”从上文补出隐含宾语，同时不限定为某一样物件。
- source_word: כְּיַד אֱלֹהַי הַטּוֹבָה עָלַי
  choice: 因为我上帝施恩的手扶助我
  rationale: 保留“手”的拟人意象，并用“施恩”“扶助”自然表达“好手在我身上”所指的眷顾和帮助。
theological_decisions:
- issue: “我上帝美善的手在我身上”所表达的神圣护理
  choice: 因为我上帝施恩的手扶助我
  alternative: 照着我上帝在我身上的美善之手
  rationale: 译文保留“手”的核心意象及上帝主动施助的意义，同时避免生硬直译；不把这句话弱化为抽象的好运，也不加入经文本身没有说明的教义细节。
- issue: הַבַּיִת 在堡垒关系短语中的所指
  choice: 圣殿所属堡垒
  alternative: 殿旁的堡垒／属于那殿的堡垒
  rationale: 此处“殿”在上下文中很可能指圣殿，但介词关系可表示所属或关联，未必只表示位置；正文采用“所属”，脚注提示“殿”的字面形式及关系上的可能译法。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“王室园林”“架梁”“入住”便于普通读者理解；对堡垒与圣殿之间关系的歧义用正文和脚注共同保留。所有脚注标记均置于相关正文之后。
