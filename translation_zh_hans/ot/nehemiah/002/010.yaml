  terminology: 专名‘参巴拉’、‘多比雅’、‘和伦’、‘亚扪’一致且可辨认。‘奴隶’保留 עֶבֶד 的直接社会身份含义；‘以色列人’在这里自然地表达‘以色列的子民／子孙’这一民族共同体称谓。
