  text: וַ/יִּשְׁמַ֞ע סַנְבַלַּ֣ט הַ/חֹרֹנִ֗י וְ/טֽוֹבִיָּה֙ הָ/עֶ֣בֶד הָֽ/עַמֹּנִ֔י וַ/יֵּ֥רַע לָ/הֶ֖ם רָעָ֣ה גְדֹלָ֑ה אֲשֶׁר בָּ֥א אָדָ֔ם לְ/בַקֵּ֥שׁ טוֹבָ֖ה לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/010.yaml
  text: When Sanballat the Horonite and Tobiah the Ammonite slave heard this[b][a], it was very displeasing to them that a man had come to seek the welfare of the children of Israel.
translation:
  language: zh_hans
  text: 和伦人参巴拉和亚扪人奴隶多比雅听见此事[a]，就大为不悦[b]，因有人来为以色列人谋求福祉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“听见”，没有明说所听见的对象；“此事”由上文补出。
    reason: supplied_word
  - marker: b
    text: 直译近于“这在他们看来是极大的恶事”；原文重复“坏／恶”一词的词根，以加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见此事
  rationale: 动词本义是“听见”；宾语在希伯来文中省略。中文为衔接上文自然补出“此事”，指尼希米抵达并奉派办理的事。
- source_word: הַחֹרֹנִי
  choice: 和伦人
  rationale: 这是表示籍贯或地域归属的称谓；采用中文圣经传统中易于辨认的地名音译。
- source_word: הָעֶבֶד הָעַמֹּנִי
  choice: 亚扪人奴隶
  rationale: עֶבֶד可指奴隶或仆人；此处作为多比雅的社会身份称谓，正文采用较直接的“奴隶”，不将其解释性改写为“官员”。
- source_word: וַיֵּרַע לָהֶם רָעָה גְדֹלָה
  choice: 就大为不悦
  rationale: 原文重复“坏／恶”词根以加强语气，表达他们强烈的不快；“大为不悦”在现代中文中自然庄重，重复形式则在脚注说明。
- source_word: אָדָם
  choice: 一个人
  rationale: 保留单数个体所指，语境中指尼希米；不泛化为“有人来做这件事”之类的抽象表达。
- source_word: לְבַקֵּשׁ טוֹבָה
  choice: 谋求福祉
  rationale: 该短语表示为他人寻求好处、益处或安康；“谋求福祉”贴合语境，也保留主动为以色列人求益的含义。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 为以色列人
  rationale: 直译为“为以色列的子孙”；此处是民族共同体称谓，现代中文以“以色列人”表达最自然准确。
theological_decisions:
- issue: אָדָם的个体性及性别表达
  choice: 一个人
  alternative: 有人／某个人
  rationale: 原文为单数名词，语境明确指尼希米。中文“一个人”保留个体性，但不像英文语法那样必须额外标明性别，因而不强加“男人”。
- issue: עֶבֶד的身份含义
  choice: 奴隶
  alternative: 仆人／臣仆／官员
  rationale: 该词本身可涵盖奴隶与仆役。正文采用直接的社会身份用语“奴隶”，避免以“官员”预先断定其政治职务；词义范围在脚注中交代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大为不悦”传达强烈反应而不显生硬；“谋求福祉”适合公共、群体性的益处。专名采用常见中文圣经译名：参巴拉、多比雅、和伦、亚扪。
