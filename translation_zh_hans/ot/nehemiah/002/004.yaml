base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/004.yaml
  text: Then the king said to me, “What is it that you are seeking?” So I prayed to the God of heaven.
translation:
  language: zh_hans
  text: 王对我说：“你所求的是什么？”于是我向天上的上帝祷告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל מַה זֶּה
  choice: 究竟……什么
  rationale: 该短语直指所求之事；“究竟”自然传达问句中的强调，而不额外增添不耐烦等语气。
- source_word: מְבַקֵּשׁ
  choice: 想求
  rationale: 此处指向君王提出请求；“想求”既保留“寻求、求取”的语义，也符合君臣对话的现代汉语表达。
- source_word: וָאֶתְפַּלֵּל
  choice: 于是，我……祷告
  rationale: wayyiqtol 叙事形式表示紧接着的行动；“于是”自然体现顺承，但不把原文未明说的默祷方式写入正文。
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: 天上的上帝
  rationale: 准确保留称号的构造和尊崇语气，且符合现代标准汉语。
theological_decisions:
- issue: 尼希米祷告的方式
  choice: 仅译作“祷告”
  alternative: “默默祷告”或“在心里祷告”
  rationale: 上下文可能暗示祷告十分短促，但本节原文并未明说是默祷或心祷，因此不将推断写入正文。
translation_notes:
  register: 采用简洁、庄重而口语自然的现代标准汉语。“王问我”避免生硬重复，“于是”保留叙事推进；引语简明，适合普通读者。
