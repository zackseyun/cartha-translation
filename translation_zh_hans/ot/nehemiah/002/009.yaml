    text: “河西”所译的希伯来语意为“大河那边”，是波斯帝国对幼发拉底河以西行政区域的称呼，常称为“河外”（Trans-Euphrates）。
    reason: cultural_note
  revision_rationale: 仅作安全且必要的语义修订：以“王的信函”对应原文的“王的书信”，避免“诏书”所带来的文类强化；同时修订文化脚注，使其准确说明“河西”作为波斯行政区域名称的历史指向。未增添英文审校记录中“省”的正文用语，也未改变军事随行的含义。
