base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/009.yaml
  text: So I came to the governors Beyond the River and gave them the king’s letters[b][a]. Now the king had sent with me army officers and horsemen.
translation:
  language: zh_hans
  text: 于是，我来到河西[a]的各省长那里，把王的信函交给他们。王还派了军官和骑兵随我同行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河西”所译的希伯来语意为“大河那边”，是波斯帝国对幼发拉底河以西行政区域的称呼，常称为“河外”（Trans-Euphrates）。
    reason: cultural_note
lexical_decisions:
- source_word: פַּחֲווֹת
  choice: 各省长
  rationale: 指波斯帝国辖区内的行政长官；“省长”在现代中文中清楚自然，也保留其官职性质。
- source_word: עֵבֶר הַנָּהָר
  choice: 河西
  rationale: 这是波斯帝国对幼发拉底河以西地区的行政称呼；正文采用简洁、具有名称感的“河西”，脚注说明其所指。
- source_word: אִגְּרוֹת הַמֶּלֶךְ
  choice: 王的诏书
  rationale: 这些是王交给尼希米、供沿途官员查验并执行的正式文书；“诏书”比泛称“信件”更能体现王室授权语境。
- source_word: שָׂרֵי חַיִל
  choice: 军官
  rationale: 该词组指军队中的领兵者或长官；“军官”简洁自然，不额外限定具体军衔。
- source_word: פָרָשִׁים
  choice: 骑兵
  rationale: 可指骑马的人或作为护卫的骑兵；本节与军官并列，中文用“骑兵”最符合军事护送语境。
- source_word: וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ
  choice: 王还派了……随我同行
  rationale: 希伯来语继续叙事，同时补充交代王所安排的护卫；“还”自然表达这一背景补充，而不强行引入原文未明说的时态层级。
- source_word: וָאָבוֹא
  choice: 于是，我来到
  rationale: 保留连续叙事的推进关系，并符合现代中文叙事习惯。
theological_decisions: []
