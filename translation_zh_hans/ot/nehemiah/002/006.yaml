base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/006.yaml
  text: Then the king said to me[a], while the queen was sitting beside him, “How long will your journey be, and when will you return?” So it pleased the king to send me, and I gave him a time.
translation:
  language: zh_hans
  text: 王对我说，当时王后[a]坐在他身旁：“你这一趟要多久？什么时候回来？”王乐意差遣我，我便给他定了一个日期。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王的配偶”或“王妃”。原文指王的王室配偶。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 叙事语境明确指掌权的君王；用“王”简洁自然，也符合中文圣经历史叙事的庄重语体。
- source_word: הַשֵּׁגַל
  choice: 王后
  rationale: 该词指王的女性配偶或宫廷中的王室配偶；“王后”在现代中文中最自然，并以脚注保留“王妃”的词义可能。
- source_word: יוֹשֶׁבֶת אֶצְלוֹ
  choice: 坐在他身旁
  rationale: 分词结构提供同时发生的背景情景；“坐在他身旁”自然表达其姿态与近距离位置。
- source_word: עַד מָתַי יִהְיֶה מַהֲלָכֲךָ
  choice: 你这一趟要多久
  rationale: 原文直指此行将持续到何时；中文以“这一趟要多久”自然表达旅程所需的时长。
- source_word: וּמָתַי תָּשׁוּב
  choice: 什么时候回来
  rationale: שׁוּב在此意为返回；“回来”符合王从自身所在地点发问的叙事视角。
- source_word: וַיִּיטַב לִפְנֵי הַמֶּלֶךְ
  choice: 王乐意
  rationale: 这是表示某事在王眼中合宜、蒙王认可的希伯来习语；“王乐意”简洁保留其批准与意愿。
- source_word: וַיִּשְׁלָחֵנִי
  choice: 差遣我
  rationale: 动词表示派出或准许前往；“差遣”适合君王授权臣仆出行的正式语境。
- source_word: וָאֶתְּנָה לוֹ זְמָן
  choice: 我就给他定了一个期限
  rationale: זְמָן可指指定的时间或期限；结合王询问何时返回，此处以“定了一个期限”表达尼希米向王提出明确时限，同时不过度具体化为某一日期。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以破折号处理“当时王后坐在他身旁”这一插入式背景说明，使王的问话保持清晰；保留原文对王后身份用词的词义幅度，并避免对她在场的意义作额外解释。
