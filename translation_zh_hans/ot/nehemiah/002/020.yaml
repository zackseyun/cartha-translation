  text: וָ/אָשִׁ֨יב אוֹתָ֜/ם דָּבָ֗ר וָ/אוֹמַ֤ר לָ/הֶם֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם ה֚וּא יַצְלִ֣יחַֽ לָ֔/נוּ וַ/אֲנַ֥חְנוּ עֲבָדָ֖י/ו נָק֣וּם וּ/בָנִ֑ינוּ וְ/לָ/כֶ֗ם אֵֽין חֵ֧לֶק וּ/צְדָקָ֛ה וְ/זִכָּר֖וֹן בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/020.yaml
  text: Then I answered them and said[a], “The God of heaven, he will make us prosper, and we his servants will arise and build[b]. But you have no share or right or memorial in Jerusalem.”
translation:
  language: zh_hans
  text: 于是我回答他们说：“天上的上帝必使我们成功。我们作他仆人的，要起来建造；至于你们，在耶路撒冷无分、无权，也无留名。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָשִׁיב אוֹתָם דָּבָר וָאוֹמַר לָהֶם
  choice: 于是我回答他们说
  rationale: “שׁוב + דָּבָר”是“回答、回复”的惯用语；与后面的“对他们说”合并为自然、庄重的现代汉语叙事表达，同时保留回应对象。
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: 天上的上帝
  rationale: 准确表达被掳后时期常见的神圣称号，符合现代汉语习惯。
- source_word: הוּא יַצְלִיחַ לָנוּ
  choice: 必使我们成功
  rationale: יַצְלִיחַ是使役形，表示上帝使这项工程顺利、赐下成功；“必”也传达独立代词הוּא在此处加强断言的语气。
- source_word: עֲבָדָיו
  choice: 作他仆人的
  rationale: 此处强调归属上帝并服事他的身份，不突出社会制度中的奴隶地位；“仆人”最合语境。
- source_word: נָקוּם וּבָנִינוּ
  choice: 要起来建造
  rationale: 保留“起来”所表达的决意和行动起点；“建造”紧贴原文，而不把上下文所含的“重建”直接写入正文。
- source_word: אֵין חֵלֶק
  choice: 无分
  rationale: חֵלֶק指份额或所属之分；“无分”简洁庄重，也适合后续三项并列。
- source_word: וּצְדָקָה
  choice: 无权
  rationale: 这里不是一般的道德“公义”，而是对耶路撒冷所具有的正当权利或资格；“无权”自然地表达这一法律—政治语境。
- source_word: וְזִכָּרוֹן
  choice: 无人记念
  rationale: 保留זִכָּרוֹן的“记念、留名”意义，指在耶路撒冷没有可被承认或记念的历史身份；比现代汉语中易被理解为纪念物的“纪念”更清楚。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 采用标准处所表达。
theological_decisions:
- issue: 上帝与建造成功之间的关系
  choice: 必使我们成功
  alternative: 必赐我们顺利
  rationale: 保留使役语义：成功来自上帝，而不是仆人自身；同时不把这种成功扩展成一般物质兴旺。
- issue: עֲבָדָיו的身份用语
  choice: 作他仆人的
  alternative: 他的奴仆
  rationale: 本节对比的是奉上帝之命服事者与在耶路撒冷没有地位的反对者，重点在效忠和服事，而非受奴役的社会身份。
- issue: צְדָקָה在排除公式中的含义
  choice: 无权
  alternative: 无正当主张
  rationale: 语境所否定的是反对者在耶路撒冷的合法权利或资格；译作“公义”会误导为抽象的道德或救赎论判断。
- issue: זִכָּרוֹן的含义
  choice: 无人记念
  alternative: 无名分
  rationale: 原词本义仍指记念或留名，可能涉及被承认的历史、公共或群体身份。正文保留这一意象，不将其完全解释为法律身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“无分、无权，也无人记念”保留原文三项递进式排比；不增补“城墙”作建造对象，因为原文在本节未明说。
