revisions:
- from: 但和伦人参巴拉、亚扪人多比雅——那奴仆[a]，以及阿拉伯人基善听见了，就嘲笑我们，鄙视我们，说：“你们在做什么事？难道你们要背叛王吗？”
  to: 但和伦人参巴拉、亚扪人奴仆多比雅[a]和阿拉伯人基善听说了，就嘲笑我们，鄙视我们，说：“你们在做什么事？难道你们是在背叛王吗？”
  rationale: 修订多比雅称谓的汉语语序，使其与其余两人的身份称谓平行，并删除不自然且无明确所指的“那”。将“听见了”调整为汉语中自然的“听说了”，不改变叙事关系。末句改为“是在背叛”，以反映原文分词在敌对质问中的进行性／指控性，而不引入未来意图。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:20:54Z'
