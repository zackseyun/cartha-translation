  terminology: 保留“和伦人”“亚扪人”“阿拉伯人”作为地缘／族群称谓。עֶבֶד正文仍译“奴仆”，脚注保留“仆人”和官职称号的可能，未把有争议的称谓直接解释为“官员”。
