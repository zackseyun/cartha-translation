base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/003.yaml
  text: I said to the king[a], “May the king live forever! Why should my face not be sad, when the city, the place of my fathers’ tombs, lies in ruins and its gates have been consumed by fire?”
translation:
  language: zh_hans
  text: 我对王说：“愿王万岁！我的脸怎能不面带愁容呢？我祖先坟墓所在的那座城[a]荒凉，城门又被火烧毁。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我祖先坟墓所在的那座城”，希伯来文直译为“我祖先坟墓的房屋”；这是一种指与祖先安葬有关之地的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר לַמֶּלֶךְ
  choice: 我对王说
  rationale: 以自然的汉语叙事表达 wayyiqtol 及间接宾语；上下文已表明叙事承接，无须机械补出“于是”。
- source_word: הַמֶּלֶךְ לְעוֹלָם יִחְיֶה
  choice: 愿王万岁
  rationale: 这是向君王所用的恭敬祝愿语；“愿王万岁”在现代汉语中简洁、庄重，也保留宫廷语气。
- source_word: מַדּוּעַ לֹא יֵרְעוּ פָנַי
  choice: 我怎能不面带愁容呢
  rationale: 保留原文以“脸面”表达悲伤外显的意象，同时用反问句自然呈现未完成式在此处的情态意味。
- source_word: הָעִיר בֵּית קִבְרוֹת אֲבֹתַי
  choice: 我祖先坟墓所在的那座城
  rationale: בֵּית 字面为“房屋、所在之处”，此处与“祖先的坟墓”连用，说明这城是祖先安葬之地；译文保留“城”且避免误解为一座墓屋。
- source_word: חֲרֵבָה
  choice: 已经荒废
  rationale: 谓语形容词描述城遭毁后的荒凉状态；“荒废”清楚自然，并与城门被焚的语境相合。
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: 城门也被火烧毁
  rationale: אכל 的被动形式用于火，字面有“吞噬”之意；“被火烧毁”在现代汉语中自然准确地表达彻底毁坏。
