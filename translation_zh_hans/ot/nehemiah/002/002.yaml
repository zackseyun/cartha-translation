  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ מַדּ֣וּעַ פָּנֶ֣י/ךָ רָעִ֗ים וְ/אַתָּה֙ אֵֽינְ/ךָ֣ חוֹלֶ֔ה אֵ֣ין זֶ֔ה כִּי אִ֖ם רֹ֣עַֽ לֵ֑ב וָ/אִירָ֖א הַרְבֵּ֥ה מְאֹֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/002.yaml
  text: And the king said to me[a], “Why is your face sad[b], though you are not sick? This is nothing but sadness of heart.” Then I was very much afraid.
translation:
  language: zh_hans
  text: 王对我说：“你并没有生病，为什么面带愁容[a]？这无非是心里忧愁[b]。”我就非常害怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你的脸不好”，是指忧愁或困扰的神情。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“心中悲伤”或“内心困扰”。希伯来文直译为“心的坏处”，这里指内心的痛苦，并非道德上的邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 这是询问原因的普通疑问词；“为什么”自然、准确。
- source_word: פָּנֶיךָ רָעִים
  choice: 面带愁容
  rationale: 希伯来文直译为“你的脸不好”，在此是指忧愁或困扰的神情；“面带愁容”保留了“脸色”的意象，又符合现代汉语表达。
- source_word: חוֹלֶה
  choice: 生病
  rationale: 直接表达身体患病，与下文内心的忧愁形成对照。
- source_word: אֵין זֶה כִּי אִם
  choice: 这无非是
  rationale: 该结构排除其他解释，表示“这不是别的，只是……”；“无非是”简洁地保留其排他语气。
- source_word: רֹעַ לֵב
  choice: 心里忧愁
  rationale: 字面为“心的坏/恶”，但语境将身体疾病与内在痛苦对照，并非指道德邪恶；译作“心里忧愁”能准确表达内心的悲伤或困扰。
- source_word: וָאִירָא
  choice: 我就……害怕
  rationale: 连续式动词推进叙事；“就”自然呈现王说话之后尼希米的即时反应。
- source_word: הַרְבֵּה מְאֹד
  choice: 非常
  rationale: 两个强化成分共同强调恐惧的程度；现代汉语“非常害怕”自然且保留强调。
theological_decisions:
- issue: רֹעַ לֵב 是否含道德意义
  choice: 按语境译为“心里忧愁”
  alternative: “心中有恶意”或“心怀不轨”
  rationale: 王先指出尼希米并未患病，再判断其神色源于内心痛苦；上下文支持情绪上的忧愁，而非道德上的邪恶或政治上的恶意。脚注保留字面词义及“内心困扰”的可能范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你既没有生病”在汉语中自然表达身体无病却显出愁容的反差；“面带愁容”兼顾原文脸部意象和汉语习惯。所有脚注标记均置于相应正文词语之后。
