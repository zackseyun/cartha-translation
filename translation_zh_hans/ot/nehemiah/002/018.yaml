base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/018.yaml
  text: So I told them that the hand of my God was good upon me[a], and also the words of the king that he had spoken to me. And they said[c][b], “Let us rise up and build.” So they strengthened their hands for the good work.
translation:
  language: zh_hans
  text: 于是，我把我上帝施恩的手怎样帮助我，以及王对我所说的话，都告诉了他们。他们说：“我们起来建造吧！”于是，他们就为这项善工坚定自己的手。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַגִּיד
  choice: 于是，我……告诉了他们
  rationale: 连续式叙事动词推进情节；“于是”承接上文，“告诉”自然表达尼希米向众人陈述经历。
- source_word: יַד אֱלֹהַי
  choice: 我上帝的手
  rationale: 保留希伯来文“手”的比喻，表达上帝主动施行的能力与眷顾，不将其仅抽象化为“恩惠”。
- source_word: אֲשֶׁר הִיא טוֹבָה עָלַי
  choice: 怎样恩待我
  rationale: 希伯来文直译为“如何在我身上是好的”。中文用“恩待我”自然表达其有利、施恩的含义，同时由脚注保留原文措辞。
- source_word: וְאַף דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר לִי
  choice: 以及王对我所说的话
  rationale: 保留“王的话”与关系从句的结构；“以及”清楚添加尼希米所报告的第二项内容。
- source_word: נָקוּם וּבָנִינוּ
  choice: 我们起来建造吧
  rationale: 两个第一人称复数形式在语境中表达共同的决心与劝勉；句末“吧”自然呈现倡议语气。
- source_word: וַיְחַזְּקוּ יְדֵיהֶם
  choice: 于是，他们……振作双手
  rationale: 尽量保留“使他们的手强壮”这一具体意象；“振作双手”在中文中传达鼓起力量、预备行动的意思。
- source_word: לַטּוֹבָה
  choice: 为这美好的事
  rationale: 原文为“为着善/好事”，未明说“工作”；“这美好的事”让中文指向当前的建造行动，同时避免过度补入“工程”或“工作”。
theological_decisions:
- issue: 如何表达“我上帝的手在我身上是好的”这一神圣行动惯用语
  choice: 正文保留“我上帝的手”，并以“恩待我”表达其作用
  alternative: 译作“我上帝的恩惠临到我”或“我的上帝施恩给我”
  rationale: 这样既保留上帝之“手”所体现的主动能力与介入，也使现代中文自然可懂；不把上帝的行动仅缩减为抽象的好感或一般性眷顾。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“我上帝”比“我的神”更贴近现代普通读者，并保留个人归属表达；“王”符合古代宫廷语境。正文保留“上帝的手”这一核心希伯来意象，其他略显生硬的结构则以脚注说明。
