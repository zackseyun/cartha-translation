base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/007.yaml
  text: Then I said to the king[a], “If it pleases the king, let letters be given to me for the governors Beyond the River[c][b], so that they may let me pass through until I come to Judah.”
translation:
  language: zh_hans
  text: 我又对王说：“王若看为好，请赐我致大河以西各省长[a]的书信，好让他们准我通行，直到我抵达犹大。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大河以西”是波斯帝国的行政区域名称，指幼发拉底河以西的地区。
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我又对王说
  rationale: 连续式叙事动词推进情节；“又……说”在现代汉语中自然地承接上文。
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: 王若看为好
  rationale: 保留波斯宫廷中的敬语表达及其字面意象，同时符合庄重、自然的现代汉语。
- source_word: אִגְּרוֹת יִתְּנוּ לִי
  choice: 请赐我诏书
  rationale: 原文是请求王将书信交给尼希米；在王室语境中，“诏书”清楚表达这些文书具有王命和通行授权的性质。
- source_word: פַּחֲווֹת
  choice: 各省长
  rationale: 指波斯帝国辖区的行政长官；“省长”比泛称“官员”更准确，“各”体现复数。
- source_word: עֵבֶר הַנָּהָר
  choice: 大河以西
  rationale: 这是波斯行政用语，所称“大河”即幼发拉底河；从帝国中心视角指其西面的地区。
- source_word: אֲשֶׁר יַעֲבִירוּנִי
  choice: 让他们准我通行
  rationale: 使役形在此语境中表示获准安全通过各辖区；“准我通行”自然表达旅行授权。
- source_word: עַד אֲשֶׁר אָבוֹא אֶל־יְהוּדָה
  choice: 直到我抵达犹大
  rationale: 直接保留终点和时间界限；“抵达”比字面的“来到”更符合行程语境。
