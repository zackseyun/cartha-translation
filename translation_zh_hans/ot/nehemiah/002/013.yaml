base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/013.yaml
  text: So I went out by night through the Valley Gate[a], toward the Dragon Spring and toward the Dung Gate[b], and I inspected the walls of Jerusalem that had been broken down and its gates that had been consumed by fire.
translation:
  language: zh_hans
  text: 我在夜间从谷门出去，往龙泉[a]，又往粪厂门走；我察看[b]耶路撒冷的城墙，那些城墙有破口，城门也被火烧毁了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “龙泉”也可译作“蛇泉”或“野狗泉”；希伯来语 תַּנִּין 可指龙、蛇或类似生物。
    reason: lexical_alternative
  - marker: b
    text: 这里译为“察看”的希伯来语表达在字面和句法上较难确定；其词根通常有“打破”之义，但按尼希米巡视受损城墙的语境，可理解为“察看”或“检视”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵצְאָה
  choice: 我……出去
  rationale: 第一人称单数叙事形式；中文按上下文自然表达事件的推进，无须机械译出连接词。
- source_word: בְשַׁעַר הַגַּיְא
  choice: 从谷门出去
  rationale: 在移动语境中，介词 בְּ 表示经由门出城；“谷门”保留该门的地形名称。
- source_word: לַיְלָה
  choice: 夜间
  rationale: 作时间状语，简洁自然。
- source_word: וְאֶל־פְּנֵי עֵין הַתַּנִּין
  choice: 往龙泉……走
  rationale: עֵין 在此指泉；תַּנִּין 可指龙、蛇或类似生物。“龙泉”保留词义力度，路线语境中的 אֶל־פְּנֵי 译为方向性的“往”。
- source_word: שַׁעַר הָאַשְׁפֹּת
  choice: 粪厂门
  rationale: אַשְׁפֹּת 指粪土、废物堆；采用中文圣经地名中通行且易辨识的“粪厂门”。
- source_word: וָאֱהִי שֹׂבֵר
  choice: 我察看
  rationale: שֹׂבֵר 字面形式较难，通常词根有“打破”之义；但此处夜间巡视受损城墙的语境支持“察看、检视”。中文简单过去叙述比直译进行结构更自然。
- source_word: בְּחוֹמֹת יְרוּשָׁלַםִ
  choice: 耶路撒冷的城墙
  rationale: 作为察看的对象，按现代汉语自然表达。
- source_word: אֲשֶׁר הַמְּפֹרָצִים
  choice: 墙已经坍塌
  rationale: 被动分词表示城墙已遭破坏、出现缺口；“坍塌”在此清楚传达毁坏状态。
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: 城门也被火烧毁了
  rationale: אכל 与火连用，字面有“吞吃”之意，实际表示被火烧尽；“烧毁”自然保留结果意义。
