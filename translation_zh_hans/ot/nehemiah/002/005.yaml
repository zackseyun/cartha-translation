base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/005.yaml
  text: Then I said to the king[a], "If it pleases the king, and if your servant has found favor before you, that you would send me to Judah, to the city of my fathers' graves[c][b], so that I may rebuild it."
translation:
  language: zh_hans
  text: 我对王说：“王若看为好，仆人若在你面前蒙恩，求你差我往犹大，到我祖先坟墓所在的城去，好让我重建那城[a][b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“到我祖先坟墓的城。”
    reason: lexical_alternative
  - marker: b
    text: 原文动词是“建造”；这里译作“重建”，是根据上文所说城墙被拆毁的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר לַמֶּלֶךְ
  choice: 我对王说
  rationale: 叙事中的 waw-consecutive 推进事件；现代汉语无需机械译出“于是”，上下文已清楚表达先后。
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: 王若看为好
  rationale: 这是宫廷请愿用语，表达王的认可或喜悦；“看为好”既保留原文措辞，又有恭敬庄重的语气。
- source_word: וְאִם יִיטַב עַבְדְּךָ לְפָנֶיךָ
  choice: 仆人若蒙你恩准
  rationale: 原文直陈仆人在王面前是否被看为好，语境指得到王的好感和准许；此译自然呈现谦卑的宫廷自称及请愿含义。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 在对君王的陈言中，这是谦卑的自称；“仆人”比“奴隶”更符合此处社会语域。
- source_word: תִּשְׁלָחֵנִי
  choice: 就请差我
  rationale: 原义为“差遣我”；“请”从条件式宫廷请求的句法中自然体现，不把话译成生硬命令。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经地名的通行译法。
- source_word: אֶל־עִיר קִבְרוֹת אֲבֹתַי
  choice: 到我祖先坟墓所在的城
  rationale: 原文直译为“我列祖坟墓的城”；“祖先”准确表明 אבות 不只指亲生父亲，关系从句则使现代汉语自然易懂。
- source_word: וְאֶבְנֶנָּה
  choice: 好让我重建那城
  rationale: cohortative 在此表达目的；动词本义为“建造”，但上下文明确该城已经毁坏，因此正文用“重建”，并以脚注保留原词信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的宫廷请愿语气。“王若看为好……仆人若蒙你恩准”保留两个并列条件，不将其合并；“就请差我”使希伯来语请求结构在普通现代汉语中自然成立。
