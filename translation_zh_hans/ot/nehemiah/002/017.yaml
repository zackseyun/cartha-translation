base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/017.yaml
  text: 'Then I said to them[a], “You see the trouble we are in: Jerusalem lies in ruins, and its gates have been burned with fire. Come, let us rebuild the wall of Jerusalem[c][b], so that we may no longer be a reproach.”'
translation:
  language: zh_hans
  text: 我对他们说：“你们看见我们所处的困境[a]了：耶路撒冷已成废墟[b]，城门也被火焚烧。来吧，我们重建耶路撒冷的城墙，使我们不再成为羞辱[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困境”或译“苦难”“灾祸”。这里的希伯来词指灾难或逆境，不一定指道德上的邪恶。
    reason: lexical_alternative
  - marker: b
    text: “已成废墟”或译“荒凉”。
    reason: lexical_alternative
  - marker: c
    text: “成为羞辱”或译“成为耻辱”“成为受人讥诮的对象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָה
  choice: 困境
  rationale: 此处指群体因城池毁坏而陷入的灾难和艰难处境，并非道德意义上的“邪恶”；“困境”在现代汉语中自然且贴合上下文。
- source_word: אֲשֶׁר אֲנַחְנוּ בָהּ
  choice: 我们所处的
  rationale: 按希伯来语表达其置身其中的现状，与“困境”搭配简洁自然。
- source_word: חֲרֵבָה
  choice: 已经荒废
  rationale: 该词描述耶路撒冷遭毁坏后的残破、荒凉状态；“荒废”保留状态性，“已经”突出眼前既成的结果。
- source_word: נִצְּתוּ בָאֵשׁ
  choice: 被火焚烧
  rationale: 保留被动含义及希伯来文“用火”的明说；“焚烧”庄重而易懂。
- source_word: לְכוּ
  choice: 来吧
  rationale: 字面可作“去”，但这里是号召众人共同采取行动；现代汉语以“来吧”最自然地表达邀请和劝勉。
- source_word: וְנִבְנֶה
  choice: 我们重建
  rationale: 该形式表达共同意愿；城墙原先存在而后遭毁，因此“重建”比单纯“建造”更符合语境。
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: 耶路撒冷的城墙
  rationale: 直接呈现原文的所属结构；“城墙”明确指城市防御墙。
- source_word: וְלֹא נִהְיֶה עוֹד חֶרְפָּה
  choice: 免得我们再蒙受羞辱
  rationale: חֶרְפָּה涉及公开的羞耻、凌辱和受人讥诮；“蒙受羞辱”是自然庄重的汉语，也保留群体性受辱的含义。“免得”在此自然表达行动所要避免的结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“来吧，我们重建”保留尼希米向群体发出的共同号召；不额外补入行动主体或神学解释。
