revisions:
- from: 我对他们说：“你们看见我们所处的困境[a]了：耶路撒冷已经荒废[b]，城门也被火焚烧。来吧，我们重建耶路撒冷的城墙，免得我们再蒙受羞辱[c]。”
  to: 我对他们说：“你们看见我们所处的困境[a]了：耶路撒冷已成废墟[b]，城门也被火焚烧。来吧，我们重建耶路撒冷的城墙，使我们不再成为羞辱[c]。”
  rationale: 修订“荒废”为“已成废墟”，以更准确表达城市遭毁后的状态；修订末句为“使我们不再成为羞辱”，以保留原文的目的／结果关系以及“成为受人讥诮的对象”的群体性含义。其余措辞和脚注锚点均可保留。
