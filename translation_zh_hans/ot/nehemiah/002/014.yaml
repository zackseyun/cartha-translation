base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/014.yaml
  text: Then I went on to the Fountain Gate and to the King’s Pool[b][a], but there was no place for the animal under me to pass.
translation:
  language: zh_hans
  text: 我又走到泉门[a]和王池那里；可是没有地方让我们所骑的牲口通过[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泉门”也可译作“水泉门”。希伯来语 עַיִן 在这里指泉水或水源。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在我下面的牲口没有地方通过”，指尼希米所骑的牲口。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר
  choice: 我又往前走
  rationale: עָבַר在此叙事中表示继续行进；“又往前走”自然表达尼希米夜间勘察路线的延续，不强加“横渡”之意。
- source_word: שַׁעַר הָעַיִן
  choice: 泉门
  rationale: עַיִן在此地名中指泉水或水源；“泉门”简洁、自然，也符合城门名称的汉语形式。
- source_word: בְּרֵכַת הַמֶּלֶךְ
  choice: 王池
  rationale: בְּרֵכָה指水池或蓄水池，属格结构直译为“王池”，适合作为地点名称。
- source_word: וְאֵין מָקוֹם
  choice: 可是地方太窄
  rationale: 原文直陈“没有地方”，上下文表明是空间不足而妨碍通行；“地方太窄”以现代汉语自然传达其结果，连接词“可是”体现语境中的转折。
- source_word: לַבְּהֵמָה
  choice: 牲口
  rationale: בְּהֵמָה是泛指家畜或走兽的词，原文未说明具体种类；“牲口”在骑乘语境中自然，同时保留其非特指性。
- source_word: לַעֲבֹר
  choice: 通过
  rationale: 不定式表达从狭窄处通行；“通过”准确、简明。
- source_word: תַּחְתָּי
  choice: 我所骑的
  rationale: 原文字面为“在我下面的”，语境明确指尼希米所骑的牲口；正文采用自然汉语表达，并以脚注保留字面形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“泉门”和“王池”作为地名保持简洁；正文将希伯来语“在我下面的牲口”自然化为“我所骑的牲口”，并在脚注中保留原文表达。
