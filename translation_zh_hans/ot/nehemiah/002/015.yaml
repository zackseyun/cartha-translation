base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/015.yaml
  text: So I went up by the wadi at night and inspected the wall[a]. Then I turned back and entered by the Valley Gate[b], and returned.
translation:
  language: zh_hans
  text: 夜里，我沿着溪谷[a]往上走，察看城墙[b]。随后我折返，从谷门进去，就回去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪谷”指沟谷或季节性水道，也可译作“河谷”或“溪涧”。
    reason: cultural_note
  - marker: b
    text: 或译“检视”“勘察”。这里的希伯来语动词通常意为“打破”，但按本节语境，一般理解为尼希米在察看受损的城墙。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלֶה
  choice: 往上走
  rationale: 与היה连用，描写当时正在进行的路线行动；“往上走”既保留上行含义，也符合现代汉语叙事习惯。
- source_word: בַנַּחַל
  choice: 沿着溪谷
  rationale: נחל在此指干旱地区的沟谷或季节性水道；“溪谷”兼顾地形和水道含义，“沿着”自然表达路线语境中的介词ב，同时不武断断定是在谷底还是谷边。
- source_word: לַיְלָה
  choice: 夜里
  rationale: 自然、简洁地保留夜间行动的时间背景。
- source_word: שֹׂבֵר
  choice: 察看
  rationale: שבר通常意为“打破”，但在本节路线勘察的语境中，直译为“破坏城墙”不合情境；“察看”表达尼希米查看受损城墙的动作，同时用脚注保留原词的异常之处。
- source_word: בַּחוֹמָה
  choice: 城墙
  rationale: 保留希伯来文单数所指的整体防御城墙；汉语“城墙”比单说“墙”更明确、自然。
- source_word: וָאָשׁוּב
  choice: 我折返
  rationale: 第一次出现时表示路线方向发生逆转；“折返”比一般的“回来”更清楚地传达这一点。
- source_word: וָאָבֹוא בְּשַׁעַר הַגַּיְא
  choice: 从谷门进去
  rationale: בוא配合城门名称表示由该门进入；“谷门”是שַׁעַר הַגַּיְא简明透明的专名译法。“进去”不额外补出原文未明说的目的地。
- source_word: וָאָשׁוּב
  choice: 就回去了
  rationale: 末次שוב概括此次夜间行程的结束；译文保留原文未说明具体返回地点的含蓄。
theological_decisions:
- issue: שֹׂבֵר的异常词义
  choice: 正文译作“察看”，脚注说明其通常含义
  alternative: 直译为“破坏”或“打破”城墙
  rationale: 上下文讲述尼希米秘密查看城墙状况，而不是进一步毁坏城墙；但该希伯来词在此用法特殊，不应完全掩盖其词汇张力，因此以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“夜里”前置，使时间背景清楚；“随后我折返……就回去了”保留路线叙述的紧凑节奏。脚注按中文正文中的出现顺序重新编号，以避免标记倒序。
