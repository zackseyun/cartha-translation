  text: And on the sealed document were Nehemiah the governor[a], son of Hacaliah[b], and Zedekiah.
translation:
  language: zh_hans
  text: 在加封的文书上署名的[a]有：省长尼希米，哈迦利亚的儿子，以及西底家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “署名的”：原文直译为“被封印的”（复数）。在这里可指加封的文书；也可理解为在文书上盖印或署名的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 在……上
  rationale: 这里的介词引出加封文书上的署名名单；中文以“在……上”自然表达其空间及文书关联意义。句首连接词 וְ 在单节中文中无需机械译为“并且”，其承接作用由语序体现。
- source_word: הַחֲתוּמִים
  choice: 加封的文书上署名的
  rationale: 该词形式上是带冠词的阳性复数被动分词，直译近于“被封印的（复数）”。结合本段列出立约文书上的人名，译文以“在加封的文书上署名的”表达其行政文书语境，同时用脚注保留原文形式及所指的歧义。
- source_word: נְחֶמְיָה
  choice: 尼希米
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: הַתִּרְשָׁתָא
  choice: 省长
  rationale: 这是波斯时期的行政官衔；译作“省长”可让现代读者直接理解其职务，脚注保留原文官衔的音译。
- source_word: בֶּן חֲכַלְיָה
  choice: 哈迦利亚的儿子
  rationale: בֶּן 是常见的父子关系标记；人名 חֲכַלְיָה 按中文通行形式译作“哈迦利亚”。
- source_word: וְצִדְקִיָּה
  choice: 以及西底家
  rationale: 连接词表明西底家是名单中的另一人；“以及”适合中文名单语体，人名采用通行音译。
