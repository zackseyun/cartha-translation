source:
  edition: WLC
  text: וּ/שְׁאָ֣ר הָ/עָ֡ם הַ/כֹּהֲנִ֣ים הַ֠/לְוִיִּם הַ/שּׁוֹעֲרִ֨ים הַ/מְשֹׁרְרִ֜ים הַ/נְּתִינִ֗ים וְֽ/כָל הַ/נִּבְדָּ֞ל מֵ/עַמֵּ֤י הָ/אֲרָצוֹת֙ אֶל תּוֹרַ֣ת הָ/אֱלֹהִ֔ים נְשֵׁי/הֶ֖ם בְּנֵי/הֶ֣ם וּ/בְנֹתֵי/הֶ֑ם כֹּ֖ל יוֹדֵ֥עַ מֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/029.yaml
  text: and the rest of the people—the priests[a], the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the lands to the law of God—their wives, their sons, and their daughters[b], everyone who knew and understood—
translation:
  language: zh_hans
  text: 其余的百姓，就是祭司、利未人、守门的人、歌唱的人、殿役[a]，以及所有从各地的民中分别出来、归向上帝的律法的人，连同他们的妻子、儿子和女儿，凡有知识、能明白事理的人[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿役”传统上也音译为“尼提宁人”，指一类被指派服事圣殿的人员。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在“所有从……分别出来的人”和“凡有知识、能明白事理的人”这两处均使用具有集合意义的阳性单数形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הָעָם
  choice: 其余的百姓
  rationale: שְׁאָר指余下的人；在盟约群体语境中，עָם译作“百姓”自然且准确。
- source_word: הַכֹּהֲנִים הַלְוִיִּם הַשּׁוֹעֲרִים הַמְשֹׁרְרִים
  choice: 祭司、利未人、守门的、歌唱的
  rationale: 分别保留各类圣殿人员的身份；后两项采用现代汉语中简洁自然的名词化表达。
- source_word: הַנְּתִינִים
  choice: 殿役
  rationale: 该词指被指派从事圣殿事务的一类人员；“殿役”简洁传达其职分，并以脚注保留传统音译。
- source_word: וְכָל הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת אֶל תּוֹרַת הָאֱלֹהִים
  choice: 以及所有离开各地族群、归向上帝律法的人
  rationale: נבדל表达从某群体分别出来；אֶל保有方向和归附意味，故译“归向”。“各地族群”保留עַמֵּי与אֲרָצוֹת的复数观念，同时避免生硬直译。
- source_word: נְשֵׁיהֶם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: 连同他们的妻子、儿女
  rationale: “儿女”在现代汉语中自然涵盖原文明确列举的儿子和女儿，而“妻子”单独保留。
- source_word: כֹּל יוֹדֵעַ מֵבִין
  choice: 凡有知识、能明白的
  rationale: 保留两个并列分词所表达的认知与理解能力，也符合此处参与盟约者具备理解力的语境。
theological_decisions:
- issue: “分别出来”与“归向律法”的关系
  choice: 译作“离开各地族群、归向上帝律法”
  alternative: “从各地族群中分别出来，遵从上帝律法”
  rationale: 原文介词אֶל表达朝向或归附，不宜直接解释成“遵从”；正文保留从旧归属离开并转向上帝律法的张力。
- issue: 阳性单数形式的集体意义
  choice: 用“所有……的人”和“凡……的”表达集体范围，并加脚注说明原文形式
  alternative: 逐字译作“每一个把自己分别出来的人”
  rationale: 希伯来语以阳性单数分词配合כֹּל作集合表达；现代汉语无需标示语法性别，且上下文明确包括妻子、儿子和女儿。
- issue: נְתִינִים的身份称谓
  choice: 正文译“殿役”
  alternative: 音译“尼提宁人”
  rationale: 意义明确的中文职称更便于普通读者理解，脚注则保留传统音译及其性质。
translation_notes:
  register: 采用庄重而现代的标准普通话。“殿役”简洁而略带经文语体；“归向上帝律法”保留原文方向性。末尾破折号显示本节句法承接下一节。
