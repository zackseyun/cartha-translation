  text: 'and the Levites: Jeshua son of Azaniah[a], Binnui from the sons of Henadad[b], Kadmiel.'
translation:
  language: zh_hans
  text: 还有利未人：亚撒尼雅的儿子耶书亚、希拿达子孙中的宾内[a]、甲篾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从希拿达的众子中”；这里可能指属于希拿达宗族或后裔的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: 以及利未人
  rationale: 保留连接上文名单的 וְ，并将定冠词复数名词自然译为“利未人”；原文没有限定动词，因此用冒号引出名字，不另加“是”或“有”。
- source_word: וְיֵשׁוּעַ
  choice: 耶书亚
  rationale: 按现代中文圣经人名的通行形式音译；其前的连接词在“以及利未人”及后续并列名单中已自然体现，不机械重复。
- source_word: בֶּן אֲזַנְיָה
  choice: 亚撒尼雅的儿子
  rationale: 按希伯来语父子关系结构直译，同时采用自然的中文语序。
- source_word: בִּנּוּי
  choice: 宾内
  rationale: 按该希伯来人名的通行中文形式音译。
- source_word: מִבְּנֵי חֵנָדָד
  choice: 希拿达子孙中的
  rationale: מִן 表示“从……中／属于……”，בְּנֵי 在族谱语境中可指后裔或宗族成员；译文既体现介词，也避免让读者误解为希拿达的几个亲生儿子。
- source_word: קַדְמִיאֵל
  choice: 甲篾
  rationale: 按该希伯来人名在现代中文圣经中的通行形式音译。
