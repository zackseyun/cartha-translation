  text: 'the heads of the people: Parosh[a], Pahath-moab, Elam, Zattu, Bani.'
translation:
  language: zh_hans
  text: 百姓的首领[a]：巴录、巴哈·摩押、以拦、萨土、巴尼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“百姓的族长”或“百姓的领袖”。希伯来文直译为“百姓的众头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי
  choice: 首领
  rationale: 该词是 רֹאשׁ（“头”）的复数附属形，在这里以比喻义指居领导地位的人。“首领”自然、庄重，也保留了原文所表达的群体领头者之意。
- source_word: הָעָם
  choice: 百姓
  rationale: 此处指参与立约的犹大共同体；“百姓”符合名单和共同体语境，也是现代中文圣经文体中自然的表达。
- source_word: פַּרְעֹשׁ
  choice: 巴录
  rationale: 这是人名或宗族名，按中文圣经中通行的专名形式音译。
- source_word: פַּחַת מוֹאָב
  choice: 巴哈·摩押
  rationale: 这是由两个部分构成的人名或宗族名；用间隔号标明复合结构，同时不把名字按字义翻译。
- source_word: עֵילָם
  choice: 以拦
  rationale: 本节是首领名单，因此该词在此应视为人名或宗族名，而不是地名。
- source_word: זַתּוּא
  choice: 萨土
  rationale: 这是人名或宗族名，采用中文圣经中通行的音译形式。
- source_word: בָּנִי
  choice: 巴尼
  rationale: 马所拉文本此处的形式支持“巴尼”，不按其他相近名单中的名字加以协调。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的名单体表达。以“首领”传达希伯来语“头”的惯用比喻义，并在脚注中保留其字面形象及可接受的译法。专名依现代简体中文圣经的常见形式处理；复合名“巴哈·摩押”以间隔号显示结构。
