  text: וּ/בְ/כָל זֹ֕את אֲנַ֛חְנוּ כֹּרְתִ֥ים אֲמָנָ֖ה וְ/כֹתְבִ֑ים וְ/עַל֙ הֶֽ/חָת֔וּם שָׂרֵ֥י/נוּ לְוִיֵּ֖/נוּ כֹּהֲנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
translation:
  language: zh_hans
  text: 因着这一切，我们订立一项有约束力的约定，并将它写成文书；在盖印的文书上，有我们官长、利未人和祭司的名字。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在盖印的文书上，是我们的官长、利未人和祭司”；“名字”是按上下文补出的。
    reason: implicit_content
lexical_decisions:
- source_word: וּבְכָל זֹאת
  choice: 因这一切
  rationale: 介词短语回指前文的认罪与处境，在这里自然地表达原因；“因这一切”简洁保留了这种回指和因果关系。
- source_word: כֹּרְתִים אֲמָנָה
  choice: 立下有约束力的约定
  rationale: כרת与约定类名词连用是“立约、订立约定”的惯用语；אֲמָנָה强调坚定、可靠而具约束力的承诺。此译既避免生硬直译“切”，也保留正式、郑重的意味。
- source_word: וְכֹתְבִים
  choice: 并写成文书
  rationale: 该词表明约定被正式写下来；“写成文书”符合现代汉语，也与下文封缄的书面文件衔接。
- source_word: וְעַל הֶחָתוּם
  choice: 在封缄的文书上
  rationale: הֶחָתוּם字面为“那被封印的”，语境中指正式封缄的书面约定；补出“文书”使汉语清楚自然，同时保留法律性和正式性。
- source_word: שָׂרֵינוּ
  choice: 我们官长
  rationale: שָׂרִים在被掳归回后的行政语境中指有公职或领导地位的人；“官长”庄重且不暗示王室身份。
- source_word: לְוִיֵּנוּ
  choice: 利未人
  rationale: 采用现代中文圣经语境中通行的族群与宗教职分名称；所属关系在并列结构中由“我们”统摄。
- source_word: כֹּהֲנֵינוּ
  choice: 祭司
  rationale: 采用通行且准确的职分名称；所属关系在“我们官长、利未人和祭司”的并列中自然共享。
theological_decisions:
- issue: אֲמָנָה所指承诺的性质
  choice: 有约束力的约定
  alternative: 坚定的盟约／信实的承诺
  rationale: 原词可指坚定可靠的正式承诺，未必等同于通常以בְּרִית表示的“约”。译为“有约束力的约定”保留正式义务性，又不把术语差异抹平。
- issue: 封缄文书上实际出现的内容
  choice: 有……的名字，并以脚注说明原文省略“名字”
  alternative: 在封缄的文书上，是我们的官长、利未人和祭司
  rationale: 上下文列出签署者姓名，汉语需要补明“名字”才自然；但原文只说这些群体“在封缄之物上”，因此用脚注标示补足，避免把解释伪装成明说。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“立下……约定”传达希伯来语立约惯用语，“封缄的文书”保留正式法律文书的语感。脚注标记已置于正文中。
