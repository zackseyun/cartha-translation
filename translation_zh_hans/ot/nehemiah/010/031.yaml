  text: וַ/אֲשֶׁ֛ר לֹא נִתֵּ֥ן בְּנֹתֵ֖י/נוּ לְ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם לֹ֥א נִקַּ֖ח לְ/בָנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/031.yaml
  text: and that we will not give our daughters to the peoples of the land[b][a], nor take their daughters for our sons.
translation:
  language: zh_hans
  text: 并且，我们不把自己的女儿嫁给这地的各族[a]，也不为自己的儿子娶他们的女儿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是复数，直译为“这地的众民”或“这地的各民族”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“取”；这里指娶来为妻。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: 并且
  rationale: 承接前文誓约内容，引出另一项共同承诺；现代汉语用“并且”自然表达连接作用，无须生硬补出“我们承诺”。
- source_word: לֹא נִתֵּן בְּנֹתֵינוּ
  choice: 我们不把自己的女儿嫁给
  rationale: 字面为“不把我们的女儿给”；在与儿女婚配有关的语境中，“嫁给”清楚表达其含义，同时保留由家族安排婚姻的表述视角。
- source_word: לְעַמֵּי הָאָרֶץ
  choice: 这地的各族
  rationale: עַמֵּי 是复数，译作“各族”保留复数含义；“这地”自然对应带定冠词的 הָאָרֶץ，且不擅自添加“异教”或“外邦”等解释。
- source_word: לֹא נִקַּח
  choice: 不……娶
  rationale: לָקַח 字面为“取”，在婚姻语境中指娶妻；汉语译作“娶”比“取”自然明确。
- source_word: בְּנֹתֵיהֶם לְבָנֵינוּ
  choice: 为自己的儿子娶他们的女儿
  rationale: 准确保留“他们的女儿”和“我们的儿子”的对应关系，并以自然汉语表达婚配安排。
theological_decisions:
- issue: 如何表达婚配禁令而不引入族裔或种族意识形态
  choice: 这地的各族
  alternative: 这地的异教民族／外族／当地居民
  rationale: 原文只说“这地的各族”，并未在本节明说“异教”或“外族”。保留原有社会—盟约措辞，避免超出经文解释，同时不抹平复数形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“嫁给／娶”明确呈现婚姻语境；“各族”保留希伯来文复数，并避免加入原文未明说的宗教或族群标签。
