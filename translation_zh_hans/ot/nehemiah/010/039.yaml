source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/כֹּהֵ֧ן בֶּֽן אַהֲרֹ֛ן עִם הַ/לְוִיִּ֖ם בַּ/עְשֵׂ֣ר הַ/לְוִיִּ֑ם וְ/הַ/לְוִיִּ֞ם יַעֲל֨וּ אֶת מַעֲשַׂ֤ר הַֽ/מַּעֲשֵׂר֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ אֶל הַ/לְּשָׁכ֖וֹת לְ/בֵ֥ית הָ/אוֹצָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/039.yaml
  text: And the priest[a], a son of Aaron, shall be with the Levites when the Levites collect the tithe, and the Levites shall bring up the tithe of the tithe to the house of our God[b], to the chambers of the storehouse.
translation:
  language: zh_hans
  text: 在利未人收取十一奉献时，亚伦子孙中的一位祭司要与他们同在。利未人要把所收十一奉献的十分之一[a]送到我们上帝的殿中库房的储藏室[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“十一奉献的十一奉献”，指利未人从他们所收的十一奉献中交出的十分之一。
    reason: lexical_alternative
  - marker: b
    text: 或译“宝库的房间”或“财库的房间”。这里很可能指存放十一奉献和其他供物的库房，并不专指存放钱财的财库。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 要……同在
  rationale: 在盟约规条的语境中，这一形式表达将要遵行的规定；“要”既保留规范语气，也符合现代汉语。
- source_word: הַכֹּהֵן בֶּן־אַהֲרֹן
  choice: 亚伦子孙中的一位祭司
  rationale: “亚伦的儿子”在此指亚伦祭司家系；译为“亚伦子孙中的一位祭司”既交代血统身份，也避免让现代读者误以为仅指亚伦的亲生儿子。
- source_word: עִם
  choice: 与……同在
  rationale: 保留原文单纯的陪同、在场之意，不额外断定祭司具体承担监督或见证职能。
- source_word: בַּעְשֵׂר הַלְוִיִּם
  choice: 看着他们收取十一奉献
  rationale: 不定式结构表示利未人办理收取十一奉献之事的时刻。“收取”由上下文说明利未人是十一奉献的接收者；加入“看着”使前句在汉语中自然，并表达祭司在场，但不赋予超出原文的行政权力。
- source_word: יַעֲלוּ
  choice: 带到
  rationale: Hiphil形式意为“使上去、带上去”。汉语“带到”自然表达运送至圣殿的动作；目的地已明确，上行色彩不必生硬直译。
- source_word: מַעֲשַׂר הַמַּעֲשֵׂר
  choice: 十一奉献中的十一奉献
  rationale: 保留原文刻意重复的技术表达及其神学、制度张力；脚注说明实际指利未人从所收十一奉献中再献出的十分之一。
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: 到我们上帝的殿
  rationale: “殿”在此自然指上帝的圣殿，既传达“上帝的家／房屋”，又符合现代中文宗教语境。
- source_word: הַלְּשָׁכוֹת
  choice: 储藏室
  rationale: 这些房间在本节用于存放十一奉献；“储藏室”比单称“房间”更清楚。
- source_word: לְבֵית הָאוֹצָר
  choice: 就是库房
  rationale: 将后一个短语理解为对前述储藏室的进一步说明。“库房”适合存放农产品及奉献物，不限于金钱。
theological_decisions:
- issue: 祭司与利未人同在时所承担的角色
  choice: 只明确祭司在场，不规定其为监督者
  alternative: 译成“监督利未人”或“作见证”
  rationale: 原文只有“与……同在”，没有明确使用“监督”或“作见证”的词；译文避免加入特定礼制职权。
- issue: 利未人献上的份额
  choice: 正文保留“十一奉献中的十一奉献”
  alternative: 直接译为“所收十一奉献的十分之一”
  rationale: 直译保留原文的技术措辞，脚注则帮助普通读者理解这是利未人从所收取的十一奉献中再献出十分之一。
- issue: 圣殿储存区域的性质
  choice: 库房
  alternative: 银库／财库
  rationale: 上下文涉及十一奉献，可能包括农产物；“库房”不把所存之物限缩为钱财。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“十一奉献”是普通读者较易识别的礼制用语；正文保留关键希伯来语重复结构，并以脚注解释。句子分为两句，以清楚呈现祭司在场和利未人运送奉献这两个规定。
