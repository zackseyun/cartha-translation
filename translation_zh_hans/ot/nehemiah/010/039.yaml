revisions:
- from: 亚伦子孙中的一位祭司要与利未人同在，看着他们收取十一奉献。利未人要把十一奉献中的十一奉献[a]带到我们上帝的殿，送进储藏室，就是库房[b]。
  to: 在利未人收取十一奉献时，亚伦子孙中的一位祭司要与他们同在。利未人要把所收十一奉献的十分之一[a]送到我们上帝的殿中库房的储藏室[b]。
  rationale: 修订删除“看着”，以免为祭司添加监督性角色；重组首句以自然表达原文的时间关系和陪同关系。将“十一奉献的十一奉献”所指的十分之一置于正文，并以脚注保留原文重复的字面措辞。末句明确储藏室属于圣殿库房，同时保留“宝库／财库”的词汇可能性及其语境限制。
