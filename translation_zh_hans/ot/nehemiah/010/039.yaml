  source_fidelity: 草稿准确表达祭司须与利未人同在，以及利未人须缴纳所收十一奉献之一部分的基本意思。不过“看着他们收取”把原文简单的“与……同在”扩展为观看或监督，超过了原文所明说的内容。将技术性重复语改为“所收十一奉献的十分之一”，并在脚注保留字面表达，可在不损失含义的前提下使中文更清楚。
  naturalness: “要与利未人同在，看着他们收取……”中“同在”与“看着”语义叠加且后者显得口语化、带有监督意味。改为“在……时，……要与他们同在”更自然、庄重，也更贴合规条语体。“殿，送进储藏室，就是库房”可改为“殿中库房的储藏室”，更清楚反映储藏室与库房的从属关系。
  terminology: “亚伦子孙中的一位祭司”“利未人”“十一奉献”“我们上帝的殿”均可接受。“宝库”作为或译须说明并非必指钱财；“库房”适合本处存放十一奉献等物资的语境。
  issues:
