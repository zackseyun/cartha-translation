id: NEH.10.36
reference: Nehemiah 10:36
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/לְ/הָבִ֞יא אֶת בִּכּוּרֵ֣י אַדְמָתֵ֗/נוּ וּ/בִכּוּרֵ֛י כָּל פְּרִ֥י כָל עֵ֖ץ שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בֵ֖ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/036.yaml
  text: and to bring the firstfruits of our land and the firstfruits of all the fruit of every tree[a], year by year, to the house of Yahweh[b],
translation:
  language: zh_hans
  text: 并且每年把我们土地[a]出产的初熟之物，以及每棵树所结一切果子的初熟之物，带到雅威的殿[b]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “土地”也可译作“田地”或“地土”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“雅威的家”，在这里指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/הָבִיא
  choice: 并且……带到
  rationale: 连词加不定词承接上下文所列的盟约义务；“带到”自然表达把供物送至圣殿的礼仪行动。
- source_word: בִּכּוּרֵי
  choice: 初熟之物
  rationale: 该词指首先成熟并献给上帝的出产；“初熟之物”既保留礼仪含义，也适用于土地出产和树上果子。
- source_word: אַדְמָתֵנוּ
  choice: 我们的土地
  rationale: אֲדָמָה在此指可耕作、出产农作物的土地；“土地”比“土壤”更自然，同时不赋予领土性的额外含义。
- source_word: וּ/בִכּוּרֵי כָּל פְּרִי כָל עֵץ
  choice: 以及每棵树所结一切果子的初熟之物
  rationale: 保留原文“所有果子—每棵树”的全面范围，并用现代汉语的定语结构清楚表达。
- source_word: שָׁנָה בְ/שָׁנָה
  choice: 每年
  rationale: 这个希伯来语重叠式表示逐年、定期重复；“每年”是简洁自然的现代汉语。
- source_word: לְ/בֵית יְהוָה
  choice: 到雅威的殿里
  rationale: “殿”在本语境中自然指雅威的圣殿；脚注保留“家／房屋”的字面表达。神名按辅音形式译作“雅威”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以常见的现代汉语音译保留其作为专名的功能，而不以称号“主”替代。
- issue: בֵּית יהוה 的表达
  choice: 雅威的殿
  alternative: 雅威的家；雅威的殿宇
  rationale: 字面为“雅威的家”，但在本节献上初熟之物的语境中明确指圣殿；正文采用自然的“殿”，并以脚注交代字面形式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“出产的”和“所结”使希伯来语连续属格结构在汉语中清楚自然；保留“初熟之物”的礼仪色彩，并以“每年”表达持续履行的年度义务。
