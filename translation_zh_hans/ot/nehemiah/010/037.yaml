source:
  edition: WLC
  text: וְ/אֶת בְּכֹר֤וֹת בָּנֵ֨י/נוּ֙ וּ/בְהֶמְתֵּ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָ֑ה וְ/אֶת בְּכוֹרֵ֨י בְקָרֵ֜י/נוּ וְ/צֹאנֵ֗י/נוּ לְ/הָבִיא֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ לַ/כֹּ֣הֲנִ֔ים הַ/מְשָׁרְתִ֖ים בְּ/בֵ֥ית אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/037.yaml
  text: and the firstborn of our sons and of our livestock[a], as it is written in the Law, and the firstborn of our herds and of our flocks, to bring to the house of our God[b], to the priests who minister in the house of our God.
translation:
  language: zh_hans
  text: 并把我们儿子中的长子和牲畜中头生的——照律法所写的——以及牛群和羊群中头生的，带到我们神的殿，交给在我们神殿里供职的祭司。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֹרוֹת בָּנֵינוּ
  choice: 我们儿子中的长子
  rationale: “中的”清楚表达从众子中所出的长子，保留复数集合意义，也不额外说明赎回方式。
- source_word: וּבְהֶמְתֵּינוּ
  choice: 牲畜中头生的
  rationale: בְּהֵמָה泛指家畜；“牲畜”比“牛”范围更广，并与下文具体的牛群、羊群相配。
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: 照律法上所写的
  rationale: 这是诉诸成文妥拉规定的固定表达；“律法”在中文中自然、庄重，并指向特定的摩西律法传统。
- source_word: בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ
  choice: 牛群和羊群中头生的
  rationale: בָּקָר指牛类大牲畜，צֹאן指绵羊和山羊等小牲畜；正文采用自然的集合表达，脚注保留后者的词义范围。
- source_word: לְהָבִיא
  choice: 带到
  rationale: 该不定式表达 covenant 清单中的目的；“带到”适合人和牲畜都作为前置宾语的句法环境。
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: 到我们神的殿
  rationale: בֵּית直译为“房屋/家”，但在此明确指敬拜场所；现代汉语以“神的殿”自然表达其圣殿所指，同时未加入原文没有的专名。
- source_word: לַכֹּהֲנִים הַמְשָׁרְתִים
  choice: 交给……供职的祭司
  rationale: לַכֹּהֲנִים标明接受者，补出“交给”使汉语关系清楚；分词הַמְשָׁרְתִים表示这些祭司持续履行圣所职务。
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: 在我们神殿里
  rationale: 保留原文对敬拜场所的重复，体现祭司供职地点，不因汉语简洁而删去。
theological_decisions:
- issue: 是否在正文中说明长子要赎回、头生牲畜要献上
  choice: 只译“长子”和“头生的”，不补充具体处置方式
  alternative: 译作“要赎回的长子”或“头生的祭物”
  rationale: 本节只援引律法，并未在此区分人的长子应赎回与不同牲畜的具体处理方式；保持概括可避免把相关律例的细节直接写进正文。
- issue: בֵּית אֱלֹהֵינוּ应译为字面的“我们神的家”还是所指的“我们神的殿”
  choice: 我们神的殿
  alternative: 我们神的家
  rationale: 希伯来语字面为“我们神的房屋”，语境所指是圣殿；现代汉语“神的家”容易被理解为家庭或信徒群体，而“神的殿”准确传达地点含义，且不超出原文所指。
- issue: צֹאן是否仅指绵羊
  choice: 正文译“羊群”，脚注说明包括绵羊和山羊
  alternative: 译“绵羊”或“绵羊和山羊”
  rationale: 该词可统指小型群畜，包括绵羊和山羊；“羊群”在正文中自然并保留集合性，脚注则防止读者把范围误限于绵羊。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“长子”用于人，以“头生的”用于牲畜，符合汉语习惯并保留原文区分；重复“我们神的殿”，呼应希伯来文的强调。
