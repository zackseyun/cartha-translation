base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/030.yaml
  text: They join with their brothers[a], their nobles, and enter into a curse and an oath, to walk in the law of God, which was given by the hand of Moses the servant of God, and to keep and to do all the commandments of Yahweh our Lord[d][c][b], and his judgments and his statutes.
translation:
  language: zh_hans
  text: 他们与自己的弟兄，就是他们的显贵，紧密联合[a]，接受咒诅和誓言的约束[b]，要照着神的律法行事；这律法是借神的仆人摩西的手赐下的[c]；又要谨守遵行耶和华我们主的一切诫命、典章和律例[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坚定地依附自己的弟兄，就是他们的显贵。”这里的希伯来语习语表示在立约中与群体的领袖紧密联合。
    reason: lexical_alternative
  - marker: b
    text: “咒诅和誓言”指带有自我咒诅性质的立约承诺：他们起誓顺服，并接受违约时所招致的惩罚。
    reason: cultural_note
  - marker: c
    text: 也可译：“这律法是借着摩西赐下的。”原文直译为“借摩西的手赐下”。
    reason: lexical_alternative
  - marker: d
    text: “典章”也可译作“法令”或“规则”；“律例”也可译作“定例”或“法规”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיקִים עַל
  choice: 紧密联合
  rationale: 该习语在立约语境中表示坚定地依附、联合，而非单指给予支持；此译法既自然，也保留群体同心立约的含义。
- source_word: אֲחֵיהֶם אַדִּירֵיהֶם
  choice: 自己的弟兄，就是他们中间的显贵
  rationale: 将“显贵”理解为对“弟兄”的进一步说明；保留原文阳性亲属称谓，并以现代汉语说明这些人是群体中有地位者。
- source_word: בְּאָלָה וּבִשְׁבוּעָה
  choice: 以咒诅和誓言约束自己
  rationale: 原文是进入“咒诅和誓言”；汉语直译生硬，因此表达为接受誓言及违约咒诅的约束，同时保留两个关键名词。
- source_word: לָלֶכֶת בְּתוֹרַת הָאֱלֹהִים
  choice: 照着神的律法行事
  rationale: 以自然汉语传达“行在律法中”这一关乎生活行为的比喻；本处立约和诫命语境支持将 תּוֹרָה 译作“律法”。
- source_word: אֲשֶׁר נִתְּנָה בְּיַד מֹשֶׁה
  choice: 这律法是借神仆人摩西的手颁布的
  rationale: 保留“借……的手”这一中介表达，也用“颁布”清楚传达律法被赐下的法律语境。
- source_word: עֶבֶד הָאֱלֹהִים
  choice: 神仆人
  rationale: 此处是摩西的尊称；“仆人”比“奴隶”更符合该称号在本语境中的功能。
- source_word: וְלִשְׁמוֹר וְלַעֲשׂוֹת
  choice: 谨守遵行
  rationale: 用两个相配的动词保留原文“守”和“做”的双重强调，同时符合现代庄重汉语。
- source_word: יְהוָה אֲדֹנֵינוּ
  choice: 耶和华—我们的主
  rationale: 将四字神名作为专名译为汉语中通行的“耶和华”，并保留随后“我们的主”这一称号，避免把二者合并。
- source_word: מִשְׁפָּטָיו וְחֻקָּיו
  choice: 他的典章和律例
  rationale: 采用汉语圣经及法律语体中清楚、庄重的对应词，保留两类规范用语之间的并列。
theological_decisions:
- issue: 四字神名 יְהוָה 的表达
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名而非仅用称号，因此正文保留专名。“耶和华”是现代汉语读者最熟悉的专名形式；“雅威”更接近常见学术拟音，而“上主”则会以称号替代专名。
- issue: אֲחֵיהֶם 的性别与群体范围
  choice: 自己的弟兄
  alternative: 自己的同胞；自己人
  rationale: 原文明确使用阳性复数亲属词，故保留“弟兄”；上下文可能涉及更广的立约群体，但本节不宜擅自将词义中性化。
- issue: 摩西作为 עֶבֶד הָאֱלֹהִים
  choice: 神仆人
  alternative: 神的奴仆
  rationale: עֶבֶד 可指仆人或奴隶，但这里作为摩西的荣誉称号，重点是忠诚事奉与受托身份，不在法律上的奴隶地位。
- issue: 咒诅与誓言的关系
  choice: 以咒诅和誓言约束自己
  alternative: 进入咒诅和誓言之中；立下带有咒诅的誓言
  rationale: 保留原文两个并列名词，不把它们完全合并；同时用“约束自己”表明这是承担违约后果的郑重承诺，而不是向别人施咒。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文保留“弟兄”“耶和华”“诫命、典章和律例”等具有立约和律法色彩的词，同时避免生硬照搬希伯来语句法；以分号呈现三个承诺层次。
