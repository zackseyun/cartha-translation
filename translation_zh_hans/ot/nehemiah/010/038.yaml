source:
  edition: WLC
  text: וְ/אֶת רֵאשִׁ֣ית עֲרִיסֹתֵ֣י/נוּ וּ֠/תְרוּמֹתֵי/נוּ וּ/פְרִ֨י כָל עֵ֜ץ תִּיר֣וֹשׁ וְ/יִצְהָ֗ר נָבִ֤יא לַ/כֹּהֲנִים֙ אֶל לִשְׁכ֣וֹת בֵּית אֱלֹהֵ֔י/נוּ וּ/מַעְשַׂ֥ר אַדְמָתֵ֖/נוּ לַ/לְוִיִּ֑ם וְ/הֵם֙ הַ/לְוִיִּ֔ם הַֽ/מְעַשְּׂרִ֔ים בְּ/כֹ֖ל עָרֵ֥י עֲבֹדָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/038.yaml
  text: And we will bring the first of our dough[a], our contributions, the fruit of every tree, the new wine, and the oil to the priests, to the chambers of the house of our God, and the tithe of our land to the Levites; for they, the Levites[c][b], are the ones who collect the tithes in all the cities where we labor.
translation:
  language: zh_hans
  text: 我们要把面团中最先的一份[a]、分别献上的供物、每棵树的果子、新酒和油，带给祭司，送到我们上帝殿的库房[b]；又要把我们土地的十分之一交给利未人，因为利未人正是在我们劳作的各城[c]收取十分之一的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“初熟的面团”。原文指从揉好的面团中最先取出、分别献上的一份。
    reason: lexical_alternative
  - marker: b
    text: 或译“房间”。原词指上帝殿建筑群中的房室，这些房室常用于储藏供物。
    reason: lexical_alternative
  - marker: c
    text: 原文直译“在我们工作的各城”；这个短语较为简略，也可理解为“在我们服役的各城”或“在我们耕作所在的各城”。
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית עֲרִיסֹתֵינוּ
  choice: 面团中最先的一份
  rationale: רֵאשִׁית指最先取出、献上的一份；עֲרִיסָה在此指揉好的面团。这样既保留具体意象，也比“初熟的面团”更清楚地表达所献的是其中的一份。
- source_word: תְרוּמֹתֵינוּ
  choice: 分别献上的礼物
  rationale: תְּרוּמָה指从所有物中分别出来献上的礼物或供物；此译法自然易懂，又不采用容易造成误解的古老礼仪术语。
- source_word: פְרִי כָל עֵץ
  choice: 各种树木的果子
  rationale: כָל在该结构中有周遍意义；译文以自然汉语表达所有各类树木所产的果子。
- source_word: תִּירוֹשׁ
  choice: 新酒
  rationale: 该词在农产清单中通常指新酿或新产的酒，译作“新酒”保留其农业语境。
- source_word: יִצְהָר
  choice: 油
  rationale: 该词通常指农产中的油，多为橄榄油；原文并未明说橄榄，因此正文保留较宽泛的“油”。
- source_word: נָבִיא
  choice: 我们要……带到
  rationale: 这是בוא的使役形第一人称复数，在立约承诺的语境中表达共同体将要履行的义务。
- source_word: לִשְׁכוֹת
  choice: 库房
  rationale: לִשְׁכָּה指圣殿建筑群中的房间，此处用于接收和存放供物，故“库房”最贴合上下文；脚注保留较一般的“房间”这一可能译法。
- source_word: מַעְשַׂר אַדְמָתֵנוּ
  choice: 土地出产的十分之一
  rationale: 原文直译为“我们土地的十分之一”，语境所指是土地出产中应交的十分之一；补出“出产”使现代汉语意思明确。
- source_word: הַמְעַשְּׂרִים
  choice: 收取十分之一
  rationale: 此分词在上下文中指利未人收取什一之物的职能；“收取”准确表达行政与礼仪层面的行动。
- source_word: בְּכֹל עָרֵי עֲבֹדָתֵנוּ
  choice: 在我们劳作的各城
  rationale: עֲבֹדָה可指劳动、工作或服役；结合土地出产和什一之物的语境，“劳作”较自然，同时用脚注保留原短语的压缩性和其他理解空间。
theological_decisions:
- issue: 祭司与利未人所接收供物的区分
  choice: 明确把初献之物交给祭司，把土地出产的十分之一交给利未人
  alternative: 将整串供物笼统写为送入圣殿库房，不明确各自接收者
  rationale: 原文以לַכֹּהֲנִים和לַלְוִיִּם清楚区分两类接收者；译文保留这一制度性区分，不作额外神学发挥。
- issue: 利未人收取十分之一的强调
  choice: 译为“收取十分之一的正是利未人”
  alternative: 译为较平直的“利未人收取十分之一”
  rationale: 原文重复“他们，就是利未人”，具有强调作用；用“正是”自然传达这种焦点，同时不改变其含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“面团中最先的一份”保留具体献物意象；“分别献上的礼物”避免生硬的礼仪术语；后半句调整汉语语序，使祭司与利未人各自接收的项目清楚。所有不确定性均以脚注保留，未加入宗派性解释。
