  text: לְ/לֶ֣חֶם הַֽ/מַּעֲרֶ֡כֶת וּ/מִנְחַ֣ת הַ/תָּמִ֣יד וּ/לְ/עוֹלַ֣ת הַ֠/תָּמִיד הַ/שַּׁבָּת֨וֹת הֶ/חֳדָשִׁ֜ים לַ/מּוֹעֲדִ֗ים וְ/לַ/קֳּדָשִׁים֙ וְ/לַ֣/חַטָּא֔וֹת לְ/כַפֵּ֖ר עַל יִשְׂרָאֵ֑ל וְ/כֹ֖ל מְלֶ֥אכֶת בֵּית אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/034.yaml
  text: for the bread of the arrangement[a], and for the regular grain offering, and for the regular burnt offering, for the Sabbaths, the new moons, the appointed times, and the holy things, and for the sin offerings to make atonement for Israel[e][d][c][b], and for all the work of the house of our God.
translation:
  language: zh_hans
  text: 用来供给陈设饼[a]、常献的素祭和燔祭[b]，以及安息日、朔日和指定节期[c]所需之物、圣物[d]和为以色列赎罪的赎罪祭[e]，并用于我们上帝殿里的一切事务。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陈设饼”也可直译为“陈列的饼”或“摆设的饼”。
    reason: lexical_alternative
  - marker: b
    text: “常献的”也可译作“持续献的”；希伯来文中这一说法分别修饰素祭和燔祭。
    reason: lexical_alternative
  - marker: c
    text: “指定节期”指规定的敬拜日期，可包括节庆。
    reason: lexical_alternative
  - marker: d
    text: “圣物”也可译作“分别为圣之物”或“神圣供物”。
    reason: lexical_alternative
  - marker: e
    text: “赎罪祭”在祭祀语境中也可理解为“洁净祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: 陈设饼
  rationale: 直译为“陈列之饼”。“陈设饼”是现代中文圣经语境中较为清楚且庄重的礼仪用语；脚注保留更直白的译法。
- source_word: מִנְחַת הַתָּמִיד
  choice: 常献的素祭
  rationale: מִנְחָה在祭祀语境中指以谷物为主的祭物，中文惯称“素祭”；תָּמִיד表示持续按规定献上，而非必然只强调每日。
- source_word: עֹלַת הַתָּמִיד
  choice: 常献的燔祭
  rationale: עֹלָה是全烧的祭，采用通行且准确的“燔祭”；תָּמִיד译为“常献的”，保留其经常、持续之意。
- source_word: הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים
  choice: 安息日、朔日和指定节期所需的
  rationale: 三个复数名词表示规定敬拜的日期或场合。希伯来句法省略了所供给之物，中文补出“所需的”以承接全句，但不将它们强行限定为只修饰常献的燔祭。
- source_word: וְלַקֳּדָשִׁים
  choice: 以及圣物
  rationale: קֳדָשִׁים范围宽泛，可指分别为圣的物品或供物；“圣物”保留这一宽度，不缩窄为某一种祭物。
- source_word: וְלַחַטָּאוֹת
  choice: 赎罪祭
  rationale: חַטָּאת在祭祀语境中通常指赎罪祭；脚注说明也可按其洁净功用理解为洁净祭。
- source_word: לְכַפֵּר עַל יִשְׂרָאֵל
  choice: 为以色列赎罪
  rationale: 保留כפר在祭祀语境中的传统神学与礼仪含义，同时不进一步界定赎罪机制。
- source_word: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ
  choice: 我们上帝殿里的一切事务
  rationale: מְלָאכָה涵盖工作、事务及相关需要；“一切事务”在此比“事奉”范围更宽，也更自然地承接供给圣殿运作的上下文。
theological_decisions:
- issue: 祭祀术语是否采用解释性译法
  choice: 保留“素祭、燔祭、赎罪祭、赎罪”等既有礼仪术语
  alternative: 译作“谷物祭、全烧祭、洁净祭、施行洁净”
  rationale: 本节列举圣殿供应与献祭义务。既有术语能保留希伯来的祭祀类别，又不把后来的特定教义解释加入正文；可能的“洁净祭”义在脚注中交代。
- issue: קֳדָשִׁים的范围
  choice: 圣物
  alternative: 神圣供物／分别为圣之物
  rationale: 原文没有明确限定为供物、礼物或器具，采用宽泛译法以保留歧义。
- issue: 安息日、朔日和指定节期与前文的句法关系
  choice: 译为这些日期“所需的”，与各项圣殿供应并列
  alternative: 将它们直接理解为修饰“常献的燔祭”
  rationale: 原文介词结构允许与供应事项相连；中文补入最少量的“所需的”，避免形成不自然的名词堆列，同时不明确限定具体祭物。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“陈设饼、素祭、燔祭、赎罪祭”等已通行的圣经礼仪词汇，并以简短脚注解释较不透明之处。“上帝”依人民开放圣经中文体例使用。所有脚注标记均置于正文相应词语之后。
