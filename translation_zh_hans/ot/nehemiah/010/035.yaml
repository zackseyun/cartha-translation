  terminology: “雅威”恰当保留 יהוה 作为专名；“父家”是本节古代家族／宗族分组的准确术语，正文保留此表达并可由上下文理解。“献木柴”改作“木柴供献”相关表达，以更直接对应 קֻרְבַּן。
