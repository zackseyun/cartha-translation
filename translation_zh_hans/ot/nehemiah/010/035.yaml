id: NEH.10.35
reference: Nehemiah 10:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/גּוֹרָל֨וֹת הִפַּ֜לְנוּ עַל קֻרְבַּ֣ן הָ/עֵצִ֗ים הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ וְ/הָ/עָם֒ לְ֠/הָבִיא לְ/בֵ֨ית אֱלֹהֵ֧י/נוּ לְ/בֵית אֲבֹתֵ֛י/נוּ לְ/עִתִּ֥ים מְזֻמָּנִ֖ים שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בַעֵ֗ר עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/035.yaml
  text: We cast lots concerning the wood offering—the priests[a], the Levites, and the people—to bring it to the house of our God, according to our fathers’ houses, at appointed times year by year, to burn on the altar of Yahweh our God, as it is written in the Law.
translation:
  language: zh_hans
  text: 我们——祭司、利未人和百姓——就献木柴的事[a]抽签，按各父家，每年在指定的时候把木柴送到我们上帝的殿，以供在雅威我们上帝的祭坛上焚烧，正如律法所记载的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“为供应木柴”。希伯来语介词既可引出抽签所涉及的事项，也可表示目的；这里是指借抽签分派供应木柴的责任。
    reason: 保留 עַל 在“关于”与“为了”之间的词义可能。
lexical_decisions:
- source_word: וְהַגּוֹרָלוֹת הִפַּלְנוּ
  choice: 抽了签
  rationale: 使役形态的 נפל 与 גּוֹרָלוֹת 构成“抽签、掣签”的惯用语；“抽了签”符合现代汉语表达。
- source_word: עַל קֻרְבַּן הָעֵצִים
  choice: 为献木柴的事
  rationale: עַל 在此引出抽签所处理的事项；קֻרְבַּן הָעֵצִים 指为祭坛供应、献上的木柴。译文表达其行政分派的含义，同时以脚注保留介词也可表示目的的可能。
- source_word: הַכֹּהֲנִים הַלְוִיִּם וְהָעָם
  choice: 我们祭司、利未人和百姓
  rationale: 保留参与抽签的三类群体；依本句第一人称复数谓语补出“我们”，使汉语主语清楚。
- source_word: לְהָבִיא לְבֵית אֱלֹהֵינוּ
  choice: 把木柴送到我们上帝的殿
  rationale: 不定式说明抽签的目的；宾语由上文木柴补出。“殿”自然表达 בַּיִת 在此所指的圣殿。
- source_word: לְבֵית אֲבֹתֵינוּ
  choice: 按照我们的宗族
  rationale: “父家”在此指祖系家族或宗族单位；“按照我们的宗族”既传达分组安排，也便于现代读者理解。
- source_word: לְעִתִּים מְזֻמָּנִים שָׁנָה בְשָׁנָה
  choice: 每年在指定的日期
  rationale: 合并表达定期安排与逐年重复；“指定的日期”准确传达预先排定的时段。
- source_word: לְבַעֵר עַל מִזְבַּח
  choice: 好在……祭坛上焚烧
  rationale: בער 在本语境指燃烧木柴；目的连词“好”对应不定式的目的功能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现经文中的四字神名，不以称号替代专名。
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: 正如律法上所写的
  rationale: 保留援引成文律法规定的固定表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质；不采用“主”，以免把专名改为称号。“耶和华”是传统汉译音形，但较不贴近通常重构的发音。
- issue: 木柴用途与抽签责任的关系
  choice: 抽签分派献木柴的责任，使木柴在祭坛上焚烧
  alternative: 把抽签本身理解为一种供物
  rationale: 后文“把木柴送到……殿”和“在……祭坛上焚烧”表明，抽签是为各宗族排定供应木柴的责任，并非把签作为祭物。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宗族”解释古代“父家”的社会单位；“殿”按语境表达上帝的圣殿。句序略作汉语化调整，但保留抽签、按宗族、逐年定期送木柴、在祭坛焚烧及律法依据等全部信息。
