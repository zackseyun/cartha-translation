revisions:
- from: 我们祭司、利未人和百姓为献木柴的事[a]抽了签，按照我们的宗族，每年在指定的日期把木柴送到我们上帝的殿，好在雅威我们上帝的祭坛上焚烧，正如律法上所写的。
  to: 我们——祭司、利未人和百姓——就献木柴的事[a]抽签，按各父家，每年在指定的时候把木柴送到我们上帝的殿，以供在雅威我们上帝的祭坛上焚烧，正如律法所记载的。
  rationale: 修订仅处理汉语同位语的歧义、时间词的语义范围及用途结构的清晰度。“按各父家”保留原文以父家为分派单位的社会结构，不将其泛化为现代意义的宗族；脚注继续保留介词 עַל 的两种可行理解。
