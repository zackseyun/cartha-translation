  text: וְ/עַמֵּ֣י הָ/אָ֡רֶץ הַֽ/מְבִיאִים֩ אֶת הַ/מַּקָּח֨וֹת וְ/כָל שֶׁ֜בֶר בְּ/י֤וֹם הַ/שַּׁבָּת֙ לִ/מְכּ֔וֹר לֹא נִקַּ֥ח מֵ/הֶ֛ם בַּ/שַּׁבָּ֖ת וּ/בְ/י֣וֹם קֹ֑דֶשׁ וְ/נִטֹּ֛שׁ אֶת הַ/שָּׁנָ֥ה הַ/שְּׁבִיעִ֖ית וּ/מַשָּׁ֥א כָל יָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/032.yaml
  text: As for the peoples of the land who bring goods and any grain on the Sabbath day to sell[a], we will not buy from them on the Sabbath or on a holy day; and we will forego the seventh year and every debt.
translation:
  language: zh_hans
  text: 至于这地各族的人，就是那些在安息日带着货物和粮食来卖的，我们在安息日或圣日都不向他们购买；第七年，我们也必休耕，并免除一切债务[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“放弃一切债权”或“免除一切索取”；希伯来语直译近于“各人手中的担子（或索取）”。
    reason: 原文 מַשָּׁא כָל יָד 是含义有争议的简短习语；在第七年语境中通常理解为债务或债权的免除，但“债权”“索取”等译法也有依据。
lexical_decisions:
- source_word: עַמֵּי הָאָרֶץ
  choice: 当地各族的人
  rationale: 保留复数“各族”，并按这一惯用语在本处所指周边居民或非犹大群体来表达；“当地”比直译“地上的”更符合现代汉语，也避免误解为全世界的人。
- source_word: הַמַּקָּחוֹת
  choice: 货物
  rationale: 该词指用于交易的物品；“货物”自然、宽泛，适合市场语境。
- source_word: שֶׁבֶר
  choice: 各样粮食
  rationale: 在买卖语境中通常指作为商品的谷粮；译作“粮食”比“食物”更具体，又比只说“谷物”略自然。
- source_word: לֹא נִקַּח מֵהֶם
  choice: 不向他们购买
  rationale: לקח本义较宽，可指“取”，但上文明确说对方带来货粮出售，因此此处是购买之意。
- source_word: וּבְיוֹם קֹדֶשׁ
  choice: 或圣日
  rationale: 原文以连接词并列；在否定句中，现代汉语用“或”自然地表示禁令也适用于圣日。
- source_word: וְנִטֹּשׁ אֶת הַשָּׁנָה הַשְּׁבִיעִית
  choice: 第七年，我们也必休耕
  rationale: נטש有放下、撇下、不加经营之意；结合第七年的律法背景，“休耕”简洁表达土地停止耕作，但不把“第七年”改写成术语“安息年”。
- source_word: מַשָּׁא כָל יָד
  choice: 免除一切债务
  rationale: 这是一个简短而难解的希伯来语词组，字面涉及“担子／索取”和“各人的手”，在第七年语境中很可能指放弃债权或免除债务；正文采用最可能且清楚的法律经济含义，并以脚注保留其他可能。
theological_decisions:
- issue: 第七年义务及末句的解释
  choice: 将本句理解为第七年让土地休耕，并免除债务。
  alternative: 可理解为“放弃一切债权／一切索取”，或更贴近字面地译为“各人手中的担子（或索取）”。
  rationale: 本句呼应安息年相关律法，可能同时涉及土地停止耕种和债务豁免；但末尾的希伯来语习语含义不完全确定，因此正文给出最可能的语境义，脚注保留真实歧义，不把它发展成额外的教义判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于……若……”清楚呈现 covenant stipulation 的结构；“都不向他们购买”符合现代商业表达。脚注标记置于真正存在词义歧义的末句，而非“来卖”之后。
