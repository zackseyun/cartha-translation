revisions:
- from: 至于当地各族的人，若在安息日带货物和各样粮食来卖，我们在安息日或圣日都不向他们购买；第七年，我们也必休耕，并免除一切债务[a]。
  to: 至于这地各族的人，就是那些在安息日带着货物和粮食来卖的，我们在安息日或圣日都不向他们购买；第七年，我们也必休耕，并免除一切债务[a]。
  rationale: 修订仅调整首句的句法关系及“各样粮食”的范围表达，使译文更贴近希伯来语中修饰“这地各族之人”的分词结构。其余措辞和脚注保留原译对第七年及末句真实歧义的谨慎处理。
