base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/033.yaml
  text: We also laid on ourselves the obligation to give yearly a third of a shekel for the service of the house of our God[a].
translation:
  language: zh_hans
  text: 我们也为自己定下规条：每年奉献三分之一舍客勒，用于我们上帝殿里的事奉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “规条”也可译作“义务”；“事奉”也可译作“殿务”或“工作”。
    reason: 保留 מִצְוֺת 的集合性表达，以及 עֲבֹדָה 在圣殿语境中的词义幅度；避免以不完整的句子作为“全句”替代译文。
lexical_decisions:
- source_word: וְהֶעֱמַדְנוּ עָלֵינוּ
  choice: 我们也为自己定下
  rationale: העמיד 的使役形式与 עַל 连用，在此表示共同体把一项有约束力的要求加在自己身上。“为自己定下”既保留自我约束之意，也符合现代汉语表达。
- source_word: מִצְוֺת
  choice: 规条
  rationale: 该词虽为复数形态，却可作集合或抽象用法，后接“奉献”的不定式说明其具体内容。“规条”保留其规范性与约束力，同时不武断地限定为单数或多项命令。
- source_word: לָתֵת
  choice: 奉献
  rationale: 字面为“给出”。在为上帝殿提供款项的语境中，“奉献”自然表达用途，但比单纯“缴纳”更少引入税费含义。
- source_word: שְׁלִשִׁית הַשֶּׁקֶל
  choice: 三分之一舍客勒
  rationale: 准确保留原文的分数金额及古代重量、货币单位。
- source_word: בַּשָּׁנָה
  choice: 每年
  rationale: 该短语在此表示按年反复履行，现代汉语以“每年”最自然清楚。
- source_word: לַעֲבֹדַת
  choice: 用于……事奉
  rationale: עֲבֹדָה 在圣殿语境中可指礼仪事奉及相关事务；“事奉”保留敬拜语境，而脚注提示也可理解为殿务工作。
- source_word: בֵּית אֱלֹהֵינוּ
  choice: 我们上帝的殿
  rationale: 原文直译为“我们上帝的家”。在此明确指圣殿，译作“殿”自然准确，并保留“我们的上帝”这一群体归属表达。
theological_decisions:
- issue: מִצְוֺת 所指要求的性质
  choice: 译为共同体“为自己定下”的有约束力规条
  alternative: 诫命；义务；多项规条
  rationale: 经文强调群体主动约束自己，但没有把这项安排软化成普通习惯，也不必断言它是直接颁下的新神圣诫命。
- issue: לַעֲבֹדַת 的范围
  choice: 正文用“事奉”，容纳圣殿敬拜及相关事务
  alternative: 工作；殿务；服事
  rationale: 原词范围可涵盖礼仪服务和维持圣殿运作的工作，不宜把意义只限于其中一项。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“舍客勒”沿用常见圣经度量衡音译；句中使用冒号，使“规条”的具体内容清楚可读。
