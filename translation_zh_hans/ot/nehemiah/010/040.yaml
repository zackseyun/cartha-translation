  to: 因为以色列人和利未人[a]要把五谷、新酒和油的奉献带到库房；那里有圣所的器皿，也有供职的祭司、守门人和歌唱者。我们绝不忽略我们上帝的殿。[b]
  rationale: 修订仅消除两处不必要的解释性表达：以“那里有／也有”直接对应原文地点陈述，避免将器皿的所在明确说成“存放”；以“绝不忽略”采用更庄重自然的现代汉语，同时在本段圣殿供给与事奉的上下文中传达不弃置圣殿事务的含义。
