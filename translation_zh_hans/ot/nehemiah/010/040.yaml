language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אֶל הַ֠/לְּשָׁכוֹת יָבִ֨יאוּ בְנֵי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י הַ/לֵּוִ֗י אֶת תְּרוּמַ֣ת הַ/דָּגָן֮ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָר֒ וְ/שָׁם֙ כְּלֵ֣י הַ/מִּקְדָּ֔שׁ וְ/הַ/כֹּהֲנִים֙ הַ/מְשָׁ֣רְתִ֔ים וְ/הַ/שּׁוֹעֲרִ֖ים וְ/הַ/מְשֹׁרְרִ֑ים וְ/לֹ֥א נַעֲזֹ֖ב אֶת בֵּ֥ית אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/040.yaml
  text: For the sons of Israel and the sons of Levi will bring the contribution of the grain[a], the new wine, and the oil to the chambers, where the vessels of the sanctuary are, and the priests who minister, and the gatekeepers, and the singers[b]. And we will not neglect the house of our God.
translation:
  language: zh_hans
  text: 因为以色列人和利未人[a]要把五谷、新酒和油的奉献带到库房；那里有圣所的器皿，也有供职的祭司、守门人和歌唱者。我们绝不忽略我们上帝的殿。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子和利未的众子”。
    reason: 保留原文群体称谓的字面形式。
  - marker: b
    text: 或译：“我们决不离弃我们上帝的殿。”
    reason: 说明原动词较形式对应的另一译法，并保留“不忽略”与“离弃”之间的语义张力。
lexical_decisions:
- source_word: לְּשָׁכוֹת
  choice: 库房
  rationale: 该词指圣殿附属房间；本节用于收纳五谷、新酒和油，译作“库房”既自然，也符合具体语境。
- source_word: בְנֵי יִשְׂרָאֵל וּבְנֵי הַלֵּוִי
  choice: 以色列人和利未人
  rationale: 希伯来语直译为“以色列的众子和利未的众子”，这里是群体称谓；现代汉语用“以色列人和利未人”清楚自然，并保留两组人的平行关系。
- source_word: תְּרוּמַת
  choice: 奉献
  rationale: 指分别出来归作神圣用途的供物或捐献；与五谷、新酒和油搭配时，“奉献”兼顾宗教用途和现代可懂性。
- source_word: דָּגָן
  choice: 五谷
  rationale: 泛指谷类出产；“五谷”是自然、庄重的现代汉语表达，并不限定为某一种谷物。
- source_word: תִּירוֹשׁ
  choice: 新酒
  rationale: 保留该词所指新近酿成或出产之酒的农业语境，不泛化为“酒”。
- source_word: יִצְהָר
  choice: 油
  rationale: 在五谷、新酒、油这一固定农产组合中通常指橄榄油；正文简译“油”，避免不必要的增译。
- source_word: כְּלֵי הַמִּקְדָּשׁ
  choice: 圣所的器皿
  rationale: 指圣殿礼仪所用的器具；“器皿”保留原文的具体物件意义和经文语体。
- source_word: הַכֹּהֲנִים הַמְשָׁרְתִים
  choice: 供职的祭司
  rationale: 分词表明这些祭司正在履行圣所职务；“供职”简洁且符合现代庄重语体。
- source_word: הַשּׁוֹעֲרִים
  choice: 守门人
  rationale: 这是负责圣殿各门的职分名称，“守门人”是准确而通行的译法。
- source_word: לֹא נַעֲזֹב
  choice: 决不撇下……不管
  rationale: עָזַב可表示离弃、撇下；在本节供给圣殿事奉的语境中，“撇下……不管”自然地兼顾不离弃与不疏忽照管两层意味。
theological_decisions:
- issue: 盟约群体称谓中的男性复数表达
  choice: 以色列人和利未人
  alternative: 以色列的众子和利未的众子
  rationale: 这里的“众子”是希伯来语民族和支派群体称谓。直译在现代汉语中容易被误解为只指男性后裔，因此正文采用群体名称，并以脚注保存原文形式。
- issue: 不离弃上帝之殿的实际含义
  choice: 我们决不撇下我们上帝的殿不管
  alternative: 我们决不离弃我们上帝的殿
  rationale: 原动词确有“离弃”之义，而上下文特别涉及持续供应圣殿及其事奉。“撇下……不管”不把含义缩减为身体上的离开，也不排除盟约性的“不离弃”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。用“因为”保留句首 כִּי 与前文誓约内容的因果衔接；以两个并列分句说明库房中器皿和圣殿人员的所在，避免生硬照搬希伯来语的名词串列。结句用“决不”呈现共同承诺的坚定语气。
