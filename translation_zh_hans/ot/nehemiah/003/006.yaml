  text: וְ/אֵת֩ שַׁ֨עַר הַיְשָׁנָ֜ה הֶחֱזִ֗יקוּ יֽוֹיָדָע֙ בֶּן פָּסֵ֔חַ וּ/מְשֻׁלָּ֖ם בֶּן בְּסֽוֹדְיָ֑ה הֵ֣מָּה קֵר֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו וּ/מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/006.yaml
  text: And Joiada son of Paseah and Meshullam son of Besodeiah repaired the Old Gate. They laid its beams and set up its doors[a], its bolts, and its bars.
translation:
  language: zh_hans
  text: 巴西亚的儿子约雅大和比所玳的儿子米书兰修缮了古门[a]。他们架设门梁，装上门扇、门闩和横闩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶沙拿门”，即把“古”所对应的词理解为地名“耶沙拿”，而不是形容词。
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחֱזִיקוּ
  choice: 修缮
  rationale: 在尼希米记第3章的施工记录中，此动词表示着手修复、加固某段城墙或城门；“修缮”既自然，也保留修复建筑的语境。
- source_word: שַׁעַר הַיְשָׁנָה
  choice: 古门
  rationale: 该短语最自然地可理解为以“古”命名的城门。“古门”简洁庄重；同时用脚注保留将第二词视为地名“耶沙拿”的可能。
- source_word: קֵרֻהוּ
  choice: 架设门梁
  rationale: 此动词源于表示以梁木覆盖、搭顶的词根。城门语境中，“架设门梁”比笼统的“盖顶”更具体，并明确代词所指。
- source_word: וַיַּעֲמִידוּ
  choice: 装上
  rationale: 原义为使之立起、安置就位；用于门扇和门闩等构件时，“装上”符合现代汉语建筑语境。
- source_word: דַּלְתֹתָיו
  choice: 门扇
  rationale: 原文为复数，指城门成对的门板。“门扇”比“门”更准确地区分门板与整座城门结构。
- source_word: מַנְעֻלָיו
  choice: 门闩
  rationale: 该词指门的扣锁或闩闭装置；“门闩”具体而不引入现代锁具的含义。
- source_word: בְרִיחָיו
  choice: 横闩
  rationale: 该词常指用来加固、封闭门扇的横向木杠；译作“横闩”可与前一类扣锁装置有所区分。
- source_word: הֵמָּה
  choice: 他们
  rationale: 独立代词强调上述两人是随后工程的执行者；汉语用“他们”承接自然，无需额外强化。
- source_word: יֽוֹיָדָע ... וּמְשֻׁלָּם
  choice: 约雅大……米书兰
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: פָּסֵחַ / בְּסוֹדְיָה
  choice: 巴西亚／比所玳
  rationale: 父名采用现代中文圣经人名的通行音译。
theological_decisions: []
