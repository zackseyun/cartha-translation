  text: פָּלָ֣ל בֶּן אוּזַי֮ מִ/נֶּ֣גֶד הַ/מִּקְצוֹעַ֒ וְ/הַ/מִּגְדָּ֗ל הַ/יּוֹצֵא֙ מִ/בֵּ֤ית הַ/מֶּ֨לֶךְ֙ הָֽ/עֶלְי֔וֹן אֲשֶׁ֖ר לַ/חֲצַ֣ר הַ/מַּטָּרָ֑ה אַחֲרָ֖י/ו פְּדָיָ֥ה בֶן פַּרְעֹֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/025.yaml
  text: Palal son of Uzai repaired opposite the angle and the tower projecting from the upper house of the king[a], which is by the court of the guard[c][b]. After him Pedaiah son of Parosh repaired.
translation:
  language: zh_hans
  text: '乌赛的儿子巴拉修建了面对转角[a]和从王的上屋[b]向外凸出的城楼的那一段；那城楼在护卫院[c]旁。此后，巴录的儿子毗大雅接着修建。


    [a] 或译“墙角”。


    [b] 原文直译“王的上屋”，也可译“上层王宫”。


    [c] 或译“监院”；这个词可能指有人看守、用来拘禁人的院子。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“墙角”。
    reason: הַמִּקְצוֹעַ 可表示墙体或建筑的转角、墙角。
  - marker: b
    text: 原文直译“王的上屋”，也可译“上层王宫”。
    reason: בֵּית 可泛指房屋，也可在王室语境中指宫殿建筑；“上”与该建筑的确切关系略有解释空间。
  - marker: c
    text: 或译“监院”；这个词可能指有人看守、用来拘禁人的院子。
    reason: מַטָּרָה 既有看守之意，在相关语境中也可指拘禁场所。
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: 对面
  rationale: 在尼希米记第3章的修建清单中，这个介词表示所修部分面对某个地标；“对面”自然保留了空间关系，又不限定具体距离。
- source_word: הַמִּקְצוֹעַ
  choice: 转角
  rationale: 此词指墙体或建筑的转折、夹角处。“转角”适合建筑语境；“墙角”也是可能译法，列入脚注。
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: 向外凸出的城楼
  rationale: 分词 הַיּוֹצֵא 在这里描述城楼从建筑群向外伸出；“向外凸出”清楚而符合现代汉语建筑表达。
- source_word: מִבֵּית הַמֶּלֶךְ הָעֶלְיוֹן
  choice: 从王的上宫
  rationale: בֵּית הַמֶּלֶךְ 可指王的房屋或宫殿建筑，הָעֶלְיוֹן 表示其位置较高。“王的上宫”兼顾原文结构与汉语可读性，并在脚注保留更直译及较解释性的译法。
- source_word: אֲשֶׁר לַחֲצַר הַמַּטָּרָה
  choice: 位于护卫院旁
  rationale: 该关系从句说明前述城楼或王宫建筑所在的位置。מַטָּרָה 在此指受看守的院落，并可能兼作拘禁场所；正文采用不过度强调刑罚含义的“护卫院”。
- source_word: אַחֲרָיו
  choice: 在他之后
  rationale: 这是本章修建清单中引出下一位工人或下一段工程的固定表达。
- source_word: פָּלָל
  choice: 巴拉
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: אוּזַי
  choice: 乌赛
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: פְּדָיָה
  choice: 毗大雅
  rationale: 采用中文圣经中较通行的人名译法。
- source_word: פַּרְעֹשׁ
  choice: 巴录
  rationale: 采用中文圣经中较通行的人名译法。
- source_word: '[פָּלָל בֶּן־אוּזַי 后省略的修建动词]'
  choice: 修建了
  rationale: 本节首句在马所拉文本中没有明写动词，但从第3章反复出现的清单句式可明确补出修建动作；中文为形成完整句子需要补译。
- source_word: '[פְּדָיָה בֶן־פַּרְעֹשׁ 后省略的修建动词]'
  choice: 接着修建
  rationale: 希伯来文在名字后省略动词，承接本章修建清单的语境；“接着修建”同时表达 אַחֲרָיו 所标示的顺序。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“修建了……对面的部分”使 מִנֶּגֶד 同时支配“转角”和“城楼”，避免误解为巴拉直接修建这两个地标。分号将地标描述与主要施工陈述分开，以保持长句清晰。关系从句按最近先行词处理为说明城楼的位置，但措辞仍容许它与王宫建筑群整体相关。
