  yaml_path: translation/ot/nehemiah/003/030.yaml
  text: After him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph repaired another section[b][a]. After him Meshullam son of Berechiah repaired opposite his chamber.
translation:
  language: zh_hans
  text: 在他之后[a]，示利米雅的儿子哈拿尼雅和撒拉的第六个儿子哈嫩修缮了另一段城墙[b]。在他之后，比利迦的儿子米书兰在自己房间的对面修缮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处书写形式可译作“在我之后”；传统读法及本章反复出现的次序表达支持“在他之后”。
    reason: textual_variant
  - marker: b
    text: 希伯来文直译为“第二份量”，在本章语境中指另外一段分配给他们修缮的城墙。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרַי / אַחֲרָיו
  choice: 在他之后
  rationale: 本章反复使用这一表达，按修墙者的次序或相邻位置推进。第一处书写形式可直译为“在我之后”，但传统读法和上下文支持“在他之后”；以脚注保留这一文本现象。
- source_word: הֶחֱזִיק
  choice: 修缮
  rationale: 该动词本义涉及加固、修复；在尼希米记第3章的城墙工程语境中，“修缮”自然且准确。
- source_word: הַשִּׁשִּׁי
  choice: 第六个儿子
  rationale: 希伯来文仅作“第六”，在“撒拉的儿子哈嫩”之后，最自然是指他在家中排行第六；补出“儿子”使现代汉语清楚。
- source_word: מִדָּה שֵׁנִי
  choice: 另一段
  rationale: 字面为“第二份量”，本章中指另行分配、继续修缮的一段城墙；“另一段”符合上下文，也避免误解为精确计量。
- source_word: נֶגֶד
  choice: 在……的对面
  rationale: 表示面对、正对或在某处前方的空间关系；“在……的对面”保留其地形描述。
- source_word: נִשְׁכָּתוֹ
  choice: 自己的房间
  rationale: 该名词指房间或内室，具体用途不明；“房间”不额外限定为住宅、办公室或圣殿用房。
- source_word: חֲנַנְיָה / שֶׁלֶמְיָה / חָנוּן / צָלָף / מְשֻׁלָּם / בֶּרֶכְיָה
  choice: 哈拿尼雅 / 示利米雅 / 哈嫩 / 撒拉 / 米书兰 / 比利迦
  rationale: 人名按现代中文圣经中通行的音译形式处理，不翻译其词义。
