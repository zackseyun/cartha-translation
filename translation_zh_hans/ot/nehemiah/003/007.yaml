base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/007.yaml
  text: And next to them Melatiah the Gibeonite and Jadon the Meronothite made repairs[a], along with the men of Gibeon and Mizpah, for the seat of the governor of the province Beyond the River.
translation:
  language: zh_hans
  text: 在他们旁边，基遍人米拉提和米罗挪人雅顿修造；还有基遍和米斯巴的人，为河西总督的官邸修造[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官邸”原文直译为“座位”或“宝座”（即河西总督的“座位”）。此处可能指总督的官邸或驻所；也可能较宽泛地指其在该地区的管辖权。“河西”是波斯时期对幼发拉底河以西地区的行政称呼。
    reason: 保留לְכִסֵּא在行政语境中的词义及其所指的解释空间，同时说明“河西”这一历史行政称谓。
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: 在他们旁边
  rationale: עַל־יָד在本章的修造名单中表示相邻的位置；这样译自然地保留了空间关系。
- source_word: הֶחֱזִיק
  choice: 修造
  rationale: 该动词在尼希米记第3章反复用于城墙工程，既有修缮也有加固、重建的语境；“修造”简洁而不过度限定工程性质。
- source_word: מְלַטְיָה הַגִּבְעֹנִי
  choice: 基遍人米拉提
  rationale: 人名按读音音译；族属或籍贯形容词译作“基遍人”。
- source_word: וְיָדוֹן הַמֵּרֹנֹתִי
  choice: 和米伦人雅顿
  rationale: 保留连接词，音译人名，并把地名衍生的称谓自然译作“米伦人”。
- source_word: אַנְשֵׁי גִבְעוֹן וְהַמִּצְפָּה
  choice: 他们是基遍和米斯巴的人
  rationale: אַנְשֵׁי加地名表示属于或来自这些城镇的人；补出“他们是”以清楚连接前述两位人物，同时不添加原文没有的同工群体。
- source_word: לְכִסֵּא פַּחַת עֵבֶר הַנָּהָר
  choice: 属河西总督的官署
  rationale: כִּסֵּא本义为“座位、宝座”，在波斯行政语境中可指总督的驻所、官署或其管辖权。“官署”在正文中保持行政语境，并以脚注保留两种主要理解。
- source_word: עֵבֶר הַנָּהָר
  choice: 河西
  rationale: 这是波斯时期对幼发拉底河以西地区的行政称呼；“河西”简洁地保留古代视角，不额外补入原文没有的“省”。
