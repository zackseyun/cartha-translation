- from: 在他们旁边，基遍人米拉提和米伦人雅顿修造；他们是基遍和米斯巴的人，属河西总督的官署[a]。
  to: 在他们旁边，基遍人米拉提和米罗挪人雅顿修造；还有基遍和米斯巴的人，为河西总督的官邸修造[a]。
  rationale: 修订恢复了原文中两位具名修造者与“基遍和米斯巴的人”并列参与工程的句法结构。末句以“为……官邸修造”表达לְ的目的／关联用法和工程上下文；脚注则不把“座位”究竟指实际驻所还是权辖范围定为唯一解释。
