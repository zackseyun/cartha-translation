  text: אַחֲרָ֧י/ו הֶחֱזִ֛יק צָד֥וֹק בֶּן אִמֵּ֖ר נֶ֣גֶד בֵּית֑/וֹ וְ/אַחֲרָ֤י/ו הֶחֱזִיק֙ שְׁמַֽעְיָ֣ה בֶן שְׁכַנְיָ֔ה שֹׁמֵ֖ר שַׁ֥עַר הַ/מִּזְרָֽח־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/029.yaml
  text: After him Zadok son of Immer made repairs opposite his house[a], and after him Shemaiah son of Shecaniah, keeper of the East Gate[c][b], made repairs.
translation:
  language: zh_hans
  text: 在他之后，音麦的儿子撒督修缮了自己房屋对面的那一段[a]。在他之后，东门的守门人[b]、示迦尼的儿子示玛雅也进行了修缮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对面”也可译作“前面”；原文没有明说“那一段”，这里按本章修缮城墙的语境补出。
    reason: lexical_alternative
  - marker: b
    text: “守门人”也可译作“东门的守卫”或“东门的看守者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: 在他之后
  rationale: 这是尼希米记第3章修缮名单中的衔接套语，既可表示施工次序，也可暗示相邻位置；译作“在他之后”保留原文表达，不把空间关系说得过死。
- source_word: הֶחֱזִיק
  choice: 修缮／进行了修缮
  rationale: חזק的使役形字面与“使坚固”有关，但在本章语境中惯指承担城墙或城门的修复工作；中文用“修缮”自然且准确。
- source_word: צָדוֹק בֶּן אִמֵּר
  choice: 音麦的儿子撒督
  rationale: 按现代中文圣经人名惯例音译，并以自然汉语语序表达父子关系。
- source_word: נֶגֶד בֵּיתוֹ
  choice: 自己房屋对面的那一段
  rationale: נֶגֶד可指“在……前面／对面”；补出“那一段”是依据全章修城墙的语境所作的最小显化，避免误解为修缮房屋本身。“自己”明确希伯来语第三人称后缀回指撒督。
- source_word: שְׁמַעְיָה בֶן שְׁכַנְיָה
  choice: 示迦尼的儿子示玛雅
  rationale: 依现代中文常见音译形式处理专名，并保留原文家系表达。
- source_word: שֹׁמֵר
  choice: 守门人
  rationale: 该主动分词表示示玛雅的职分，可译“看守者”或“守卫”；与“门”结合译作“守门人”最符合自然汉语。
- source_word: שַׁעַר הַמִּזְרָח
  choice: 东门
  rationale: 原文是带定冠词的特定门名；“东门”简洁自然，并保留方位名称。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。重复“在他之后”以保留原文名单的节奏；后半句用“也进行了修缮”避免中文生硬，同时对应原文重复的动词。所有脚注标记均置于相关正文之后。
