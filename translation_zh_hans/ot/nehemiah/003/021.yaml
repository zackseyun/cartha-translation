base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/021.yaml
  text: After him[a], Meremoth son of Uriah, son of Hakkoz, repaired another section, from the entrance of the house of Eliashib to the end of the house of Eliashib.
translation:
  language: zh_hans
  text: 继他之后，乌利亚的儿子、哈哥斯的孙子米利末又修了一段[a]，从以利亚实家的入口直到以利亚实家的尽头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第二段。”希伯来语此短语可指米利末另外承担的一段工程，也可较形式地译为“第二段长度”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: 在他之后
  rationale: 在尼希米记第3章的修建名单中，这一短语承接前一项工程，主要表示次序；译作“在他之后”既自然，也避免把含义限定为空间上的相邻。
- source_word: הֶחֱזִיק
  choice: 修
  rationale: 该词本义与“使坚固”有关，但在本章语境中惯用于修缮城墙或相关建筑；简洁译作“修”符合现代汉语叙事。
- source_word: מְרֵמוֹת בֶּן אוּרִיָּה בֶּן הַקּוֹץ
  choice: 哈哥斯的孙子、乌利亚的儿子米利末
  rationale: 按汉语习惯将父系谱链明确表达为“孙子、儿子”，同时保留原文所提供的身份次序与全部人名。
- source_word: מִדָּה שֵׁנִית
  choice: 又修了一段
  rationale: 原文直译近于“第二段／第二长度”，很可能指米利末继本章4节以后再承担的一段工程。“又……一段”自然表达追加工程，同时以脚注保留较形式化的译法。
- source_word: מִפֶּתַח בֵּית אֶלְיָשִׁיב
  choice: 从以利亚实家的入口
  rationale: פֶּתַח指开口、门口或入口；此处用于界定工程起点，“入口”清楚而自然。
- source_word: בֵּית אֶלְיָשִׁיב
  choice: 以利亚实家
  rationale: 希伯来语构词直为“以利亚实的房屋”；现代汉语用“以利亚实家”既可指其住宅，也保持表达简洁。
- source_word: וְעַד תַּכְלִית בֵּית אֶלְיָשִׁיב
  choice: 直到以利亚实家的尽头
  rationale: תַּכְלִית在此表示空间上的终点或界限，而非抽象的“完成”；“尽头”准确呈现所修地段的终界。
