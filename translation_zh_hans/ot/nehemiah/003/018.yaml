base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/018.yaml
  text: 'After him their brothers repaired: Bavvai son of Henadad[a], ruler of half the district of Keilah.'
translation:
  language: zh_hans
  text: 在他之后，他们的弟兄修造了城墙：即希拿达的儿子巴瓦伊[a]；他是基伊拉一半地区的官长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本传统作“宾内”，而不是“巴瓦伊”。
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרָיו
  choice: 在他之后
  rationale: 既保留希伯来语的空间／次序表达，也自然衔接本章按城墙区段排列的修造名单。
- source_word: הֶחֱזִיקוּ
  choice: 修造城墙
  rationale: 该动词字面有“使坚固”之意，但在尼希米记第3章的语境中惯用于修复城墙；补出“城墙”使现代读者清楚。
- source_word: אֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 保留原文“弟兄”的表达，不擅自限定为亲兄弟、族人或同工。
- source_word: בַּוַּי
  choice: 巴瓦伊
  rationale: 依WLC本节的读音转写；其他文本传统的异读“宾内”列入脚注。
- source_word: בֶּן חֵנָדָד
  choice: 希拿达的儿子
  rationale: 以自然中文表达标准的希伯来父名结构。
- source_word: שַׂר
  choice: 官长
  rationale: 此处是地方行政语境；“官长”既体现其治理职分，也避免“统治者”或“司令”带来的过强色彩。
- source_word: חֲצִי פֶּלֶךְ
  choice: 半区
  rationale: 指行政区的一半；简洁表达其辖区，同时不把פֶּלֶךְ误解为规模更大的省。
- source_word: קְעִילָה
  choice: 基伊拉
  rationale: 按希伯来地名音译，并采用现代中文圣经人名地名中清楚可辨的形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“修造城墙”明确本章语境；冒号保留“他们的弟兄”与随后领头人物之间略显紧缩的原文句法关系，而不强行解释这些人是否为巴瓦伊的亲兄弟。
