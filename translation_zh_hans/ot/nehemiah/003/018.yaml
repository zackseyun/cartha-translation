    rationale: 可被理解为一个称作“基伊拉半区”的区域；改作“基伊拉一半地区的官长”更直接反映其管辖基伊拉地区的一半，而不增加具体行政制度解释。
  revised_text: 在他之后，他们的弟兄修造了城墙：即希拿达的儿子巴瓦伊[a]；他是基伊拉一半地区的官长。
