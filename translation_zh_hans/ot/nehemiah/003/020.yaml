base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/020.yaml
  text: After him[a], Baruch son of Zabbai zealously repaired a second section[b], from the angle to the entrance of the house of Eliashib the high priest.
translation:
  language: zh_hans
  text: 在他之后，萨拜的儿子巴录[a]格外热心地修筑[b]第二段城墙，从转角处直到大祭司以利亚实的房屋的入口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译本所反映的另一人名传统作“萨改的儿子巴录”。
    reason: alternative_reading
  - marker: b
    text: “格外热心地修筑”所对应的希伯来语表达很不寻常，可能强调巴录施工时的热忱或非同寻常的勤奋。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: 在他之后
  rationale: 在本章修筑城墙的名单中，这一短语兼有承接前一位工人及标明相邻施工位置的作用；“在他之后”保留这两层含义。
- source_word: הֶחֱרָה הֶחֱזִיק
  choice: 格外热心地修筑
  rationale: הֶחֱזִיק在本章语境中指修筑或修复；前面的הֶחֱרָה用法罕见，带有热切、奋发的强化意味。“格外热心地修筑”既表达其力度，也符合现代汉语习惯。
- source_word: בָּרוּךְ בֶּן זבי
  choice: 萨拜的儿子巴录
  rationale: 按希伯来语辅音形式音译人名；采用现代中文圣经语境中通行、易辨认的“巴录”和“萨拜”。异名传统收入脚注。
- source_word: מִדָּה שֵׁנִית
  choice: 另一段城墙
  rationale: 此处指所分配的又一段施工区间，而非实际的度量单位；补出“城墙”使中文指称清楚。“另一段”也避免误解为全工程按次序排列的第二段。
- source_word: מִן הַמִּקְצוֹעַ
  choice: 从转角处
  rationale: 该名词指墙体的角、转折或转向处；“转角处”自然地保留建筑空间含义。
- source_word: עַד פֶּתַח בֵּית
  choice: 直到……住宅的入口
  rationale: פֶּתַח是入口或门口，בֵּית在此最可能指以利亚实的住所或宅院；“住宅的入口”比抽象的“家族入口”更贴合空间界标。
- source_word: אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司以利亚实
  rationale: הַכֹּהֵן הַגָּדוֹל是祭司职分的标准称号，译作“大祭司”；中文按自然语序置于人名前。
