base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/005.yaml
  text: And next to them the Tekoites made repairs[b][a], but their nobles would not put their necks to the work of their lords.
translation:
  language: zh_hans
  text: 在他们旁边，提哥亚人也进行修缮；但他们的显贵[a]不肯屈颈服事他们的主人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显贵”也可译作“领头人”“有权势的人”或“贵族”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“没有把他们的颈项带到他们主人的劳役中”。“屈颈”以颈项负轭为喻，表示不肯顺服或投入劳作。“主人”为复数，也可译作“上司”；其具体所指未明。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: 在他们旁边
  rationale: עַל־יָד在尼希米记第三章的修城名单中表示相邻的位置；此译自然地保留施工段落依次相接的空间关系。
- source_word: הֶחֱזִיקוּ
  choice: 进行修缮
  rationale: 该动词本可表示“使坚固、抓住”，但在本章语境中反复指承担城墙修复工作；“进行修缮”符合修城名单的行文。
- source_word: הַתְּקוֹעִים
  choice: 提哥亚人
  rationale: 这是由地名提哥亚构成的居民称谓，指来自或居住在提哥亚的人。
- source_word: וְאַדִּירֵיהֶם
  choice: 他们的贵族
  rationale: אַדִּיר可指显贵、有权势者或领袖；在此城邑共同体语境中，“贵族”简明地表达当地上层人物，同时以脚注保留“领头人”的可能译法。
- source_word: לֹא הֵבִיאוּ צַוָּרָם
  choice: 不肯俯首承担
  rationale: 原文直译为“不把颈项带来”，以颈项负轭的形象表达不肯顺服或投入劳作。“不肯俯首承担”在现代汉语中可理解，也保留拒绝服从和出力的双重意味。
- source_word: בַּעֲבֹדַת אֲדֹנֵיהֶם
  choice: 他们主事者所派的工程
  rationale: עֲבֹדָה在修城语境中指劳作或工程；אֲדֹנֵיהֶם为复数“他们的主人／上司”。“主事者”避免误读为神圣称号，“所派的工程”则自然表达在这些权责人物之下承担修城任务的关系。
theological_decisions:
- issue: “他们的主人”（אֲדֹנֵיהֶם）的所指
  choice: 指与修城事务有关的人间主事者或上级
  alternative: 把它顺译成单数的“主的工作”，理解为上帝的工程
  rationale: 希伯来文是带复数词尾的“他们的主人／上司”，不宜将其神学化并改成单数神称。正文采用“主事者”，保留人间权责关系，也避免武断确定其具体官职。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“修缮”与本章施工名单相称；“俯首承担”保留希伯来文颈项负轭的形象而避免生硬直译。脚注标记均置于相关词句之后。
