base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/031.yaml
  text: After him Malkijah son of the goldsmith repaired as far as the house of the temple servants and the merchants, opposite the Inspection Gate, and as far as the upper room of the corner.
translation:
  language: zh_hans
  text: 在他以后，金匠的儿子玛基雅修造，直到殿役和商人的房屋，对着检阅门，又直到城角的上层房间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצֹּרְפִי
  choice: 金匠
  rationale: 该词指冶炼、精炼贵金属的工匠；在此作为职业称谓，译作“金匠”自然简明。
- source_word: הַנְּתִינִים
  choice: 殿役
  rationale: 指被派在圣殿中服役的一类人；“殿役”既保留其群体身份，也比音译更便于现代读者理解。
- source_word: הָרֹכְלִים
  choice: 商人
  rationale: 该词通常指往来贩卖货物的商贩；此处用概括性的“商人”，不额外限定其经营方式。
- source_word: שַׁעַר הַמִּפְקָד
  choice: 检阅门
  rationale: מִפְקָד 可涉及点名、清点、检阅或指定；“检阅门”保留该名称可能与集合清点有关的含义，同时不把它过度解释为固定功能。
- source_word: עֲלִיַּת הַפִּנָּה
  choice: 城角的楼房
  rationale: עֲלִיָּה 指楼上的房间或楼房，הַפִּנָּה 指城墙转角；译文用“城角的楼房”表达空间关系，并以“城”补足上下文所指。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体；沿用尼希米记修城段落中“在他以后……修造，直到……”的重复句式。原文“殿役和商人的房屋”在单数“房屋”与两个群体之间关系略有含混，译文不增添“各自”等解释，以保留这种含混。
