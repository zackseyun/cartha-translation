  text: וְ/אַל תְּכַס֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תִּמָּחֶ֑ה כִּ֥י הִכְעִ֖יסוּ לְ/נֶ֥גֶד הַ/בּוֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/037.yaml
  text: And do not cover over their guilt[a], and do not let their sin be blotted out from before you[b], for they have provoked anger in the presence of the builders.
translation:
  language: zh_hans
  text: 不要遮盖他们的罪孽[a]，也不要让他们的罪从你面前被抹去；因为他们在建造者面前激起了怒气[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不要赦免他们的罪孽”；希伯来文的意象是“不要遮盖他们的罪孽”。
    reason: lexical_alternative
  - marker: b
    text: 或译“因为他们在建造者面前惹你发怒”。希伯来文没有明说惹怒的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַס ... עַל עֲוֺנָם
  choice: 遮盖他们的罪孽
  rationale: 保留כסה עַל“遮盖”的希伯来语意象；在这里，这一意象也可表达不追究或赦免罪孽。
- source_word: עֲוֺנָם
  choice: 他们的罪孽
  rationale: עָוֹן可指罪恶、罪责或相应刑罚；“罪孽”既保留其道德分量，也与下文“罪”形成近义平行。
- source_word: חַטָּאתָם
  choice: 他们的罪
  rationale: חַטָּאת通常指“罪”；采用直接、常用的译法，以保留原文平行结构。
- source_word: מִלְּפָנֶיךָ
  choice: 从你面前
  rationale: 贴近原文空间及关系性的表达，保留罪不可从上帝面前消除的鲜明意象。
- source_word: תִּמָּחֶה
  choice: 被涂抹
  rationale: מחה可指擦去、除去或从记录中抹除；“涂抹”保留原文有关消除罪或记念的意象。
- source_word: הִכְעִיסוּ
  choice: 惹动了怒气
  rationale: 该使役形表示惹怒、激起怒气；原文未明说受词，因此正文不补出“你”，保留其简约与歧义。
- source_word: לְנֶגֶד הַבּוֹנִים
  choice: 当着建造者的面
  rationale: לְנֶגֶד主要表示“在……面前”；此译法自然表达嘲讽是在参与建造的人面前公开进行的。
theological_decisions:
- issue: 针对仇敌之罪的咒诅性祷告
  choice: 保留祈求上帝不要遮盖或涂抹其罪的直接而严厉的措辞。
  alternative: 弱化为“不要忽视他们的恶行”。
  rationale: 原文明确提出严厉的祈求；译文不作教义性缓和，以保留经文自身的神学张力。
- issue: 惹怒的对象是否明说
  choice: 正文译为“惹动了怒气”，不补出对象。
  alternative: 译为“惹你发怒”。
  rationale: 上下文很可能指他们惹上帝发怒，但希伯来文没有明说受词；正文保留这种省略，并在脚注提供符合语境的明确译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“遮盖”“从你面前被涂抹”刻意保留希伯来文意象；“当着建造者的面”比直译式“在建造者面前”更符合自然汉语。
