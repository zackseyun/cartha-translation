  text: וְ/אֵ֣ת שַׁ֣עַר הָ/אַשְׁפּ֗וֹת הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן רֵכָ֔ב שַׂ֖ר פֶּ֣לֶךְ בֵּית הַכָּ֑רֶם ה֣וּא יִבְנֶ֔/נּוּ וְ/יַעֲמִיד֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/014.yaml
  text: And Malchijah son of Rechab[a], ruler of the district of Beth-haccherem, repaired the Dung Gate. He built it and set up its doors, its bolts, and its bars.
translation:
  language: zh_hans
  text: 利甲的儿子玛基雅，伯哈基琳区的主管，修复了粪门[a]。他建造了这门，又安上门扇、门闩和横木。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“废弃物门”。希伯来语名称指粪秽或废弃物。
    reason: 说明城门名称所含词语的语义范围，并保留无现代汉语歧义的合理替代译法。
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: 修复
  rationale: 该动词本义可指加固；在尼希米记第3章的城墙施工清单中，它惯用于表示负责修缮某一段或某座门，因此译为“修复”最符合语境。
- source_word: שַׁעַר הָאַשְׁפּוֹת
  choice: 粪门
  rationale: אַשְׁפּוֹת指粪秽或废弃物；“粪门”简洁地保留了希伯来名称的具体含义，并作为耶路撒冷城门名称处理。
- source_word: שַׂר פֶּלֶךְ
  choice: 区的主管
  rationale: שַׂר表示首领或官员，פֶּלֶךְ表示行政区域；“区的主管”以自然的现代汉语表达其行政职务。
- source_word: בֵּית הַכָּרֶם
  choice: 伯哈基琳
  rationale: 这是地名，采用音译而不按“葡萄园之家”的字面意义翻译。
- source_word: הוּא יִבְנֶנּוּ
  choice: 他建造了这门
  rationale: בנה本义是“建造”；虽然上下文是修复工程，但不额外加入“重建”的语义。הוּא的显明主语也在译文中保留。
- source_word: וְיַעֲמִיד
  choice: 又安上
  rationale: עמד的使役式在此表示把门的部件立起、安置就位；“安上”符合现代汉语建筑语境。
- source_word: דַּלְתֹתָיו
  choice: 门扇
  rationale: 复数形式指城门的门板或两扇门；“门扇”比笼统的“门”更准确。
- source_word: מַנְעֻלָיו
  choice: 门闩
  rationale: 该词指用于关闭或锁定城门的装置；“门闩”是清楚自然的对应表达。
- source_word: וּבְרִיחָיו
  choice: 横木
  rationale: בְּרִיחַ指横插以加固、封闭门扇的木杠；译作“横木”既与“门闩”有所区分，也符合古代城门结构。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。人名、地名沿用较易识别的传统音译；行政职衔采用现代读者易懂的“区的主管”。将脚注标记置于实际涉及词义选择的“粪门”之后。
