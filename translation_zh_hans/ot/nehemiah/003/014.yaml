  - severity: medium
    issue: 脚注替代译名“废物门”有现代汉语歧义
    rationale: “废物”在现代普通话中通常指无用的人或东西，容易偏离אַשְׁפּוֹת所指的粪秽、垃圾或废弃物。应使用“废弃物门”等无歧义表达。
