  source_fidelity: 译文准确呈现了玛基雅的父名、所辖地区的行政身份、修复粪门，以及建造城门并安装门扇、门闩和横木的施工次序。“建造”忠实对应בנה，未擅自增添“重建”之意。
  naturalness: 原文以分号将同一人物的身份说明与行动割开，虽可理解，但“玛基雅是……主管；他修复了……”略显生硬。改为同位语结构更符合现代汉语叙事和本章修造名单的行文。
  terminology: “粪门”“修复”“门扇”“门闩”“横木”均可接受，并能区分两类门禁构件。脚注中的“废物门”在现代汉语中常指“无用之人”，不适合作为城门名称的替代译法；改为“废弃物门”以准确表达refuse之义。
