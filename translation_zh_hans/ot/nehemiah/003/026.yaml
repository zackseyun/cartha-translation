revisions:
- from: 殿役[a]住在俄斐勒，直到朝东的水门对面和凸出的城楼那里。
  to: 殿役[a]住在俄斐勒，直到东边水门的对面和那座向外突出的塔楼一带。
  rationale: 修订仅澄清方位和句法：以“东边水门”避免将“向东”的方位误解为水门的朝向；以“塔楼”对应原文较中性的建筑称谓；以“一带”自然表达“直到”的居住范围。保留“殿役”、地名音译及尼提宁脚注，不加入有关该群体来源或身份的推测。
