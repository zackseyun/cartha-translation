  text: וְ/הַ֨/נְּתִינִ֔ים הָי֥וּ יֹשְׁבִ֖ים בָּ/עֹ֑פֶל עַ֠ד נֶ֜גֶד שַׁ֤עַר הַ/מַּ֨יִם֙ לַ/מִּזְרָ֔ח וְ/הַ/מִּגְדָּ֖ל הַ/יּוֹצֵֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/026.yaml
  text: The temple servants were living on the Ophel[a], as far as opposite the Water Gate toward the east and the projecting tower.
translation:
  language: zh_hans
  text: 殿役[a]住在俄斐勒，直到东边水门的对面和那座向外突出的塔楼一带。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“尼提宁”（נְתִינִים），指一个专门在圣殿服役的群体。
    reason: 说明原文专名式职称及其含义，避免“殿役”掩盖该群体的特定名称。
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: 殿役
  rationale: 该词指一个公认的圣殿服役群体，传统音译为“尼提宁”。译作“殿役”既点明其职分，又比单纯音译更便于现代读者理解。
- source_word: הָיוּ יֹשְׁבִים
  choice: 住在
  rationale: היה与分词构成的表达表示持续居住的状态；“住在”自然简洁，符合现代汉语。
- source_word: בָּעֹפֶל
  choice: 在俄斐勒
  rationale: עֹפֶל在此是耶路撒冷一处高地的名称，采用音译“俄斐勒”，不额外加入原文未明说的地形解释。
- source_word: עַד נֶגֶד
  choice: 直到……对面
  rationale: 保留עַד所表示的范围终点，以及נֶגֶד所表示的相对方位。
- source_word: שַׁעַר הַמַּיִם
  choice: 水门
  rationale: 这是城门名称，直译为“水门”，简明且符合汉语地名表达。
- source_word: לַמִּזְרָח
  choice: 朝东的
  rationale: 该短语表示向东的方位；置于“水门”前作修饰语，保留原文的方向信息，同时使汉语顺畅。
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: 凸出的城楼
  rationale: יֹצֵא字面为“出去”，在建筑语境中指向外伸出；“凸出的城楼”准确呈现其形态。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“殿役”简洁呈现其圣殿职分，并以脚注保留传统名称；地名“俄斐勒”采用音译。句末“那里”使“直到……对面和……城楼”的范围表达在汉语中更完整。
