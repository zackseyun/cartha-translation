base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/011.yaml
  text: Malchijah son of Harim and Hasshub son of Pahath-moab repaired another section[b][a], and also the Tower of the Ovens.
translation:
  language: zh_hans
  text: 哈琳的儿子玛基雅和巴哈·摩押的儿子哈述修复了另一段[a]，也修复了炉子塔[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第二段”。希伯来语原文可较直译为此；这里指另行分配修复的一段。
    reason: lexical_alternative
  - marker: b
    text: 或译：“烤炉塔”或“熔炉塔”。希伯来语所用的词既可指烤炉，也可指熔炉。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּה שֵׁנִית
  choice: 另一段
  rationale: 该短语直译可作“第二段”，但在尼希米记第3章的修墙语境中，指另行分配、继续修复的一段；“另一段”自然且保留其附加部分之意。
- source_word: הֶחֱזִיק
  choice: 修复了
  rationale: 该动词基本义与“抓住、使坚固”有关，在本章城墙工程的语境中表示修缮或加固；译作“修复了”最清楚。
- source_word: מַלְכִּיָּה בֶן חָרִם
  choice: 哈琳的儿子玛基雅
  rationale: 按现代中文圣经人名音译惯例处理专名，并明确保留父子关系。
- source_word: וְחַשּׁוּב בֶּן פַּחַת מוֹאָב
  choice: 和巴哈·摩押的儿子哈述
  rationale: 保留并列关系、父子结构及复合专名；以间隔号标示“巴哈·摩押”为一个复合族名或人名。
- source_word: וְאֵת
  choice: 也修复了
  rationale: 连词和宾语标记引出另一项修复对象；中文补出动词，并用“也”清楚表达附加关系。
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: 炉楼
  rationale: מִגְדָּל指塔楼，תַּנּוּרִים可指烤炉或熔炉；“炉楼”简洁地保留地名性质，同时不限定炉的具体用途。
