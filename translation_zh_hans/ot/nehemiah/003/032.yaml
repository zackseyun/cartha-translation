  text: And between the upper room of the corner and the Sheep Gate[a], the goldsmiths and the merchants made repairs.
translation:
  language: zh_hans
  text: 城角的上层建筑[a]和羊门之间，是金匠和商人修缮的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“城角的上坡处”或“城角的上层房间”。希伯来语“עֲלִיָּה”可以指上层房间或楼房，也可以指上坡处；这里所指的具体建筑结构不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  choice: 从……到……之间
  rationale: 这里划定城墙最后一段的范围；现代汉语用“从……到……之间”自然表达两个地标之间的区段，并保留连接上下文的作用。
- source_word: עֲלִיַּת
  choice: 上层建筑
  rationale: 该词可指楼房、上层房间或上升处；“上层建筑”保留其位于高处或属于上部构造的含义，同时避免断定具体建筑形态。
- source_word: הַפִּנָּה
  choice: 城角
  rationale: 原词意为“角、拐角”；结合城墙修缮语境译作“城角”，清楚而不过度具体化为角楼。
- source_word: לְשַׁעַר הַצֹּאן
  choice: 到羊门
  rationale: “羊门”是本章明确的城门名称；介词在区段边界结构中自然译为“到”。
- source_word: הֶחֱזִיקוּ
  choice: 修缮
  rationale: 该动词在尼希米记第3章反复指修复城墙或城门的工程；“修缮”符合建筑语境，也比字面上的“加固”更准确。
- source_word: הַצֹּרְפִים
  choice: 金匠
  rationale: 该职业名本义涉及熔炼、加工贵金属；“金匠”是简洁、传统且符合语境的称呼。
- source_word: וְהָרֹכְלִים
  choice: 和商人
  rationale: 该词指从事买卖、贸易的人；“商人”是现代汉语中自然且范围适当的表达。
