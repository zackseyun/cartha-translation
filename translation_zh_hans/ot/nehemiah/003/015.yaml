  text: וְ/אֵת֩ שַׁ֨עַר הָ/עַ֜יִן הֶ֠חֱזִיק שַׁלּ֣וּן בֶּן כָּל חֹזֶה֮ שַׂ֣ר פֶּ֣לֶךְ הַ/מִּצְפָּה֒ ה֤וּא יִבְנֶ֨/נּוּ֙ וִ/יטַֽלְלֶ֔/נּוּ ו/יעמידו דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ֠/אֵת חוֹמַ֞ת בְּרֵכַ֤ת הַ/שֶּׁ֨לַח֙ לְ/גַן הַ/מֶּ֔לֶךְ וְ/עַד הַֽ/מַּעֲל֔וֹת הַ/יּוֹרְד֖וֹת מֵ/עִ֥יר דָּוִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/015.yaml
  text: And Shallun son of Col-hozeh[a], official of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it, and set up its doors, its bolts, and its bars, and repaired the wall of the Pool of Shelah by the king’s garden, as far as the stairs that go down from the City of David.
translation:
  language: zh_hans
  text: 各荷西的儿子沙仑，是米斯巴区的长官；他修缮泉门，重建这门，给它盖顶，又安上门扇、门闩和横杠。他又修缮王园旁西拉池的城墙，直到从大卫城往下的台阶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: 泉门
  rationale: עַיִן在此指水泉；“泉门”简洁自然，也符合耶路撒冷水利设施的地理语境。
- source_word: הֶחֱזִיק
  choice: 修缮
  rationale: 该动词在尼希米记第3章惯用于修复城墙或城门的工程；“修缮”既传达修复，也保持庄重文体。
- source_word: שַׂר פֶּלֶךְ הַמִּצְפָּה
  choice: 米斯巴区的长官
  rationale: פֶּלֶךְ指行政辖区，שַׂר指主管者；“区的长官”清楚表达行政职务，又不把官阶过度具体化为总督。
- source_word: הוּא יִבְנֶנּוּ וִיטַלְלֶנּוּ
  choice: 他重建门楼，给它盖上顶
  rationale: הוּא带强调意味，יִבְנֶנּוּ在修复语境中宜译为“重建”；טָלַל指给门的建筑结构加盖。“门楼”由语境补明，以免中文误解为重建门扇本身。
- source_word: ויעמידו דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו
  choice: 又安上门扇、门闩和横杠
  rationale: 该短语描述安装城门的各部件。מַנְעֻלִים指扣合或固定装置，译为“门闩”；בְּרִיחִים是横向加固的杠，译为“横杠”，以保留两者区别。句法上下文以沙仑为单数主语，故采用“他”所延续的单数表达。
- source_word: חוֹמַת בְּרֵכַת הַשֶּׁלַח
  choice: 西拉池旁的城墙
  rationale: בְּרֵכָה是水池；הַשֶּׁלַח按本节马所拉读音音译为“西拉”。“池旁的城墙”比直译“池的墙”更符合现代汉语，并保留其地理关联。
- source_word: לְגַן הַמֶּלֶךְ
  choice: 王园边
  rationale: 介词לְ在此为地理关系，可表示邻近或朝向；“王园边”自然地呈现城墙与王园的相对位置，同时不作过度精确的界定。
- source_word: וְעַד הַמַּעֲלוֹת הַיּוֹרְדֹות מֵעִיר דָּוִיד
  choice: 直到从大卫城往下的台阶
  rationale: מַעֲלוֹת可指阶梯，הַיּוֹרְדֹות明确其向下延伸；“从大卫城往下”保留מִן所表达的起点。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。专名沿用现代中文圣经中常见形式“各荷西、沙仑、米斯巴、大卫城”；对较不熟悉的הַשֶּׁלַח则按希伯来语读音译作“西拉”，并以脚注交代传统名称。避免机械重复物主代词，使工程部件的列举符合自然汉语。
