source:
  edition: WLC
  text: שְׁמַ֤ע אֱלֹהֵ֨י/נוּ֙ כִּֽי הָיִ֣ינוּ בוּזָ֔ה וְ/הָשֵׁ֥ב חֶרְפָּתָ֖/ם אֶל רֹאשָׁ֑/ם וּ/תְנֵ֥/ם לְ/בִזָּ֖ה בְּ/אֶ֥רֶץ שִׁבְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/036.yaml
  text: Hear[a], our God, for we are despised. Turn their reproach back on their own heads[c][b], and give them over as plunder in a land of captivity.
translation:
  language: zh_hans
  text: 我们的神啊，求你垂听！因为我们已受人藐视[a]。求你把他们的辱骂归到他们自己头上，使他们在被掳之地[c]成为掠物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我们成了受藐视的对象。”希伯来文直译是“因为我们成了藐视”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把他们交出去任人掠夺”或“使他们成为战利品”。
    reason: lexical_alternative
  - marker: c
    text: 也可理解为“在一个被掳之地”或“在那被掳之地”；希伯来语原文没有冠词，具体程度须由语境判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: 求你垂听
  rationale: 这是向神发出的第二人称阳性单数命令式；“垂听”符合现代汉语祷告语体，又没有把原文未明说的宾语“我们”加进译文。
- source_word: אֱלֹהֵינוּ
  choice: 我们的神啊
  rationale: 准确表达第一人称复数所属关系，并以“啊”自然标明呼格。
- source_word: כִּי הָיִינוּ בוּזָה
  choice: 因为我们已受人藐视
  rationale: כִּי引出祈求的理由；完成式配合名词“藐视、轻蔑”，表达已经形成并持续存在的受辱处境。正文采用自然汉语，脚注保留“成了受藐视的对象”这一更贴近字面的表达。
- source_word: וְהָשֵׁב חֶרְפָּתָם אֶל רֹאשָׁם
  choice: 求你把他们的辱骂归到他们自己头上
  rationale: 使役命令式表达让辱骂反归施辱者；“归到……自己头上”保留原文报应逆转的身体意象和惯用表达。
- source_word: וּתְנֵם לְבִזָּה
  choice: 使他们……成为掠物
  rationale: נתן与לְבִזָּה连用，表示将他们置于成为战利品的处境；“成为掠物”准确而不额外指定掠夺者。
- source_word: בְּאֶרֶץ שִׁבְיָה
  choice: 在被掳之地
  rationale: 保留“地”与“被掳”两个核心概念；汉语不以冠词区分特指和非特指，因此脚注说明语境上的可能理解。
theological_decisions:
- issue: 针对仇敌的惩罚性祈求
  choice: 直接保留求神使辱骂反归仇敌、使他们成为掠物的祈求
  alternative: 淡化为笼统的伸张正义，或将其解释为纯粹比喻
  rationale: 希伯来文明确使用两个命令式提出报应性的请求。翻译应保存其力度和神学张力，不因读者可能感到不适而弱化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语祷告语体。“垂听”与“归到他们自己头上”保留经文的肃穆感和原文意象；避免古奥虚词，也不淡化咒诅性祈求。脚注标记均在正文出现，并紧随各自所说明的词组。
