  text: And next to him the men of Jericho built[a], and next to them Zaccur the son of Imri built.
translation:
  language: zh_hans
  text: 在他旁边，耶利哥人建造[a]；在他旁边，音利的儿子撒刻也建造。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两句都说“在他旁边”；第二句中的“他”也可能按施工名单的次序理解为指前述耶利哥人。
    reason: 保留第二个阳性单数代词所指对象的语篇含混，避免像英文正文那样直接改为复数。
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: 在他旁边
  rationale: 短语עַל יָד加代词后缀在本章表示城墙施工次序中的相邻位置；译作“在他旁边”自然且保留阳性单数后缀。两处均如此翻译，以保存原文措辞及第二处所指可能存在的含混。
- source_word: בָנוּ / בָנָה
  choice: 建造
  rationale: בנה的基本义是“建造”。虽然上下文涉及修复城墙，本节没有使用明确表示“重建”或“修复”的动词，因此采用较克制的“建造”。
- source_word: אַנְשֵׁי יְרֵחוֹ
  choice: 耶利哥人
  rationale: 字面为“耶利哥的男子们”，在名单语境中指与耶利哥相关的施工群体；“耶利哥人”是现代汉语中简洁自然的群体称谓，且不额外断定他们当时是从耶利哥前来。
- source_word: זַכּוּר בֶּן אִמְרִי
  choice: 音利的儿子撒刻
  rationale: 按现代中文圣经人名习惯音译，并以自然汉语表达希伯来文父子关系。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。重复“在他旁边……建造”以呈现希伯来文施工名单的平行结构；加入“也”使中文衔接自然，但不改变事件内容。
