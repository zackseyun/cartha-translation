base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/017.yaml
  text: 'After him the Levites carried out repairs: Rehum son of Bani[a]. Next to him Hashabiah, ruler of half the district of Keilah[c][b], carried out repairs for his district.'
translation:
  language: zh_hans
  text: 在他之后，利未人巴尼的儿子利宏修缮[a]。在他旁边[b]，基伊拉一半辖区的长官哈沙比雅为自己所辖的区[c]修缮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“修复”或“加固”。希伯来语动词字面意思是“使坚固”，在尼希米记第3章中指修复城墙的工程。
    reason: lexical_alternative
  - marker: b
    text: 字面为“在他手边”，这里指“在他旁边”。
    reason: lexical_alternative
  - marker: c
    text: 或译“为自己所分得的部分修缮”。希伯来语既可能指哈沙比雅管辖的行政区，也可能指分派给他的那一段城墙。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: 在他之后
  rationale: 在本章修筑名单中，这一短语承接前一位施工者，也可暗示相邻位置；“在他之后”自然保留这种次序关系。
- source_word: הֶחֱזִיקוּ / הֶחֱזִיק
  choice: 修筑
  rationale: חזק 的使役形在尼希米记第3章中是修复、加固城墙的惯用表达；“修筑”简洁自然，也适合反复出现的名单格式。
- source_word: הַלְוִיִּם רְחוּם בֶּן־בָּנִי
  choice: 利未人巴尼的儿子利宏
  rationale: 保留“利未人”的身份称谓及“某人的儿子”这一谱系表达。希伯来文中“利未人”为复数，但紧接着只列出利宏一人；中文采用集合称谓后接代表人物的自然结构，未擅自补入其他人名。
- source_word: עַל יָדוֹ
  choice: 在他旁边
  rationale: 字面为“在他手边”，在本章施工语境中指相邻的修筑位置。
- source_word: שַׂר חֲצִי פֶלֶךְ קְעִילָה
  choice: 基伊拉半区的长官
  rationale: שַׂר 指行政长官，פֶלֶךְ 在此为行政区；该表达自然对应“基伊拉区一半辖区的长官”。
- source_word: לְפִלְכּוֹ
  choice: 为自己所辖的区
  rationale: 介词 לְ 可表示为某范围负责或代表该范围施工；“为自己所辖的区”保留行政责任意味，同时不把具体施工地点说得过死。
