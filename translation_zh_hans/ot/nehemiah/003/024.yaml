base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/024.yaml
  text: After him[a], Binnui son of Henadad repaired another section[b], from the house of Azariah as far as the angle and as far as the corner.
translation:
  language: zh_hans
  text: 在他之后，希拿达的儿子宾内修筑了另一段[a]，从亚撒利雅的房屋起，直到墙的转角，又直到墙角[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“第二段”。希伯来语可指宾内另外修筑的一段，也可指第二个量定的区段。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“转角”和“墙角”的两个希伯来词意义相近，却并不相同，可能指彼此邻近的两处建筑结构。
    reason: cultural_note
lexical_decisions:
- source_word: אַחֲרָיו
  choice: 在他之后
  rationale: 在尼希米记第3章的修城名单中，此语主要标示叙述次序；译作“在他之后”自然，也不把空间上的紧邻关系说得过强。
- source_word: הֶחֱזִיק
  choice: 修筑
  rationale: 该动词本义涉及使坚固，但在本章语境中惯用于修复、加固城墙；“修筑”既符合工程语境，也适用于本节未明说“城墙”的句式。
- source_word: בִּנּוּי בֶּן חֵנָדָד
  choice: 希拿达的儿子宾内
  rationale: 按现代中文圣经人名的通行音译处理，并以自然的中文领属结构表达父子关系。
- source_word: מִדָּה שֵׁנִית
  choice: 另一段
  rationale: 该短语可指此人另修的一段，也可较字面地指“第二段”或“第二个量定的区段”；正文用“另一段”顺应本章工程清单的语境，同时以脚注保留歧义。
- source_word: מִבֵּית עֲזַרְיָה
  choice: 从亚撒利雅的房屋起
  rationale: 保留起点关系，并用“起”使中文的范围表达完整自然。
- source_word: עַד הַמִּקְצוֹעַ
  choice: 直到墙的转角
  rationale: 此词指建筑或城墙转折成角之处；译作“转角”可与下一词“墙角”保持必要区别。
- source_word: וְעַד הַפִּנָּה
  choice: 又直到墙角
  rationale: פִּנָּה通常指角、角落或角部结构；重复“直到”以保留原文两次עַד所呈现的地形推进。
