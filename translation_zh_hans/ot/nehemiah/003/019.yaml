base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/019.yaml
  text: Next to him Ezer son of Jeshua[a], official of Mizpah[c][b], repaired another section opposite the ascent to the armory at the angle.
translation:
  language: zh_hans
  text: 在他旁边，米斯巴的官长、耶书亚的儿子以谢，修造了另一段[a]，就在转角[c]处通往军械库[b]的上坡路对面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“第二段”。希伯来语可能强调以谢还修造了另一段城墙。
    reason: lexical_alternative
  - marker: b
    text: 或译“兵器”。此处可能指存放兵器的地方。
    reason: lexical_alternative
  - marker: c
    text: 或译“拐角”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: 修造
  rationale: 该动词本义为“使坚固”，但在尼希米记第3章的城墙工程语境中，指修缮、重建；“修造”既自然，也保留建造与加固的意味。
- source_word: עַל יָדוֹ
  choice: 在他旁边
  rationale: 这是本章反复使用的工程位置表达，表示紧邻前一位修造者。
- source_word: שַׂר הַמִּצְפָּה
  choice: 米斯巴的官长
  rationale: שַׂר 在此指地方行政首长；“官长”庄重而不过度暗示王室身份。
- source_word: מִדָּה שֵׁנִית
  choice: 另一段
  rationale: 字面可作“第二段”，在本章中通常表示某人另行负责的一段城墙；正文采用自然的“另一段”，脚注保留字面可能。
- source_word: מִנֶּגֶד
  choice: 对面
  rationale: 表示面对或位于某地标的对面，适合这里的方位描述。
- source_word: עֲלֹת
  choice: 上坡处
  rationale: 源自动词“上去”，在地形语境中指上行的坡道或入口；“上坡处”比名词化的“上升处”更符合现代汉语。
- source_word: הַנֶּשֶׁק
  choice: 军械库
  rationale: 该词可指兵器，也可能在此借指存放兵器之处；结合地标语境，译作“军械库”，并以脚注保留另一可能。
- source_word: הַמִּקְצֹעַ
  choice: 城墙转角
  rationale: 该词指角、拐角或转折处；补出“城墙”可使所指清楚，且符合本段建筑语境。
