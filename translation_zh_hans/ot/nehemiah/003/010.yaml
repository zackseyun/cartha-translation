base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/010.yaml
  text: Next to them Jedaiah son of Harumaph made repairs opposite his house[a], and next to him Hattush son of Hashabneiah made repairs.
translation:
  language: zh_hans
  text: 在他们旁边，哈路抹的儿子耶大雅在自己房屋对面[a]修造；在他旁边，哈沙尼雅的儿子哈突修造。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对面”也可译作“前面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: 在他们旁边
  rationale: עַל יָד在本章的修造名录中是表示相邻位置的惯用语；译作“在他们旁边”既自然，也保留施工段落依次相接的空间关系。
- source_word: הֶחֱזִיק
  choice: 修造
  rationale: חזק的使役形在尼希米记第3章中是参与城墙修复工程的固定说法。“修造”适合城墙施工语境，也可保持本章重复句式的简洁。
- source_word: יְדָיָה
  choice: 耶大雅
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: בֶן חֲרוּמַף
  choice: 哈路抹的儿子
  rationale: 直接表达希伯来语父子关系；חֲרוּמַף音译为“哈路抹”。
- source_word: וְנֶגֶד בֵּיתוֹ
  choice: 自己房屋对面的那一段
  rationale: נֶגֶד表示“在……前面／对面”。补出“那一段”承接本章城墙分段修造的语境，但不把所修对象误解为房屋本身；“自己”明确后缀所指为耶大雅。
- source_word: וְעַל יָדוֹ
  choice: 在他旁边
  rationale: 与本节前半相同的相邻位置惯用语，此处单数后缀指上一位修造者耶大雅。
- source_word: חַטּוּשׁ
  choice: 哈突
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: בֶן חֲשַׁבְנְיָה
  choice: 哈沙尼雅的儿子
  rationale: 直接表达父子关系；חֲשַׁבְנְיָה音译为“哈沙尼雅”。
theological_decisions: []
