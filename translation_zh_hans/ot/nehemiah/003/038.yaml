base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/038.yaml
  text: So we rebuilt the wall[a], and the whole wall was joined together up to half its height, for the people had a heart to work.
translation:
  language: zh_hans
  text: 于是我们重修城墙；整道城墙都已连成一体，修到一半高，因为百姓一心做工。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“百姓有心去做”，意思是他们内心愿意，并决心投入这项工作。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּבְנֶה
  choice: 于是我们重修
  rationale: 该词是בנה的Qal连续式未完成时第一人称复数，承接叙事中的下一步行动。上下文是修复耶路撒冷原有的城墙，因此译作“重修”；“于是”自然体现叙事推进。
- source_word: הַחוֹמָה
  choice: 城墙
  rationale: חוֹמָה指城市的防御墙；汉语在此用“城墙”比单说“墙”更明确自然。
- source_word: וַתִּקָּשֵׁר
  choice: 连接起来
  rationale: קשר的Niphal形式在此表示各段城墙彼此接合，成为连续的整体。“连接起来”保留结果意义，同时符合现代汉语表达。
- source_word: כָּל הַחוֹמָה
  choice: 整道城墙
  rationale: כָּל加定指名词表示整体。“整道城墙”自然表达城墙全线，而不暗示每一部分都已达到最终高度。
- source_word: עַד חֶצְיָהּ
  choice: 达到一半的高度
  rationale: 原文直译为“达到它的一半”。按修筑城墙的语境，通常指达到城墙预定高度的一半；正文作必要的语境明示。
- source_word: וַיְהִי לֵב לָעָם
  choice: 因为百姓都一心
  rationale: 原文近于“百姓有心”，表达内在的意愿与决心。译作“一心”保留“心”的意象，并在汉语中自然表达共同投入；“因为”呈现此句对前述进展的原因说明。
- source_word: לַעֲשׂוֹת
  choice: 做工
  rationale: עשה本义宽泛，可指“做、行”。在修筑城墙的具体语境中，“做工”自然准确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“整道城墙连接起来”说明各段已经连成一线；“一半的高度”则表达工程的垂直进度。脚注保留希伯来文“心”的习语背景。
