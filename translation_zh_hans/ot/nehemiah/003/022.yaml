  text: וְ/אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/כֹּהֲנִ֖ים אַנְשֵׁ֥י הַ/כִּכָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/022.yaml
  text: After him the priests[a], the men of the plain, made repairs.
translation:
  language: zh_hans
  text: 在他之后，来自平原地区[a]的祭司们接着修缮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平原地区”也可译为“那一带”或“环形地区”。希伯来语“基卡尔”可指平原或近似圆形的区域；这里具体指哪里，不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: 在他之后
  rationale: 保留连接词与介词结构所表达的施工次序；在本章反复出现的修城名单中，这一表达自然清楚。
- source_word: הֶחֱזִיקוּ
  choice: 接着修缮
  rationale: 该动词本义与“抓住、使坚固”有关，但在尼希米记第3章中是参与修复城墙的惯用说法；“修缮”符合施工语境，“接着”也体现上下文中的承接关系。
- source_word: הַכֹּהֲנִים
  choice: 祭司们
  rationale: 准确表达带定冠词的阳性复数名词。
- source_word: אַנְשֵׁי
  choice: 来自……的
  rationale: 原文是“……的人”的构词形式，指这些祭司所属或来自的地域；中文用“来自……的祭司们”比直译“……的人，就是祭司们”更自然，同时保留地域关联。
- source_word: הַכִּכָּר
  choice: 平原地区
  rationale: 该词可指平原、圆形地带或一个区域；“平原地区”保留主要地理含义，又避免把具体地点说得过于确定。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事表达。“接着修缮”顺应本章工程名单的重复句式；脚注保留地点词的真实歧义，不把它强行确定为约旦河平原或耶路撒冷周边某一区域。
