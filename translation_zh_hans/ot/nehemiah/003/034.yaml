base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/034.yaml
  text: And he said before his brothers and the army of Samaria[a], and said, “What are these feeble Jews doing? Will they restore it for themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones from the heaps of dust, though they are burned?”
translation:
  language: zh_hans
  text: 他在他的弟兄和撒马利亚的军队面前说：“这些软弱的犹大人在做什么？他们要自行重建吗？[a]他们要献祭吗？他们能在一天之内完工吗？他们能从尘土堆中使那些已被焚烧的石头复活吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们要自行重建吗？”所译的希伯来语短语含义不明确。也可理解为“他们要为自己恢复吗？”；若按该动词通常的字面意义，也可作“他们要把这事留给自己吗？”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶחָיו
  choice: 在他的弟兄……面前
  rationale: לִפְנֵי表示在某人面前或在场时；אֶחָיו直译为“他的弟兄”，此处也可能泛指同僚或同伴。正文保留原文的亲属称谓及其潜在的群体含义。
- source_word: וְחֵיל שֹׁמְרוֹן
  choice: 和撒马利亚军队
  rationale: חֵיל在此军事语境中指军队或武装力量；“军队”是现代汉语中自然、清楚的表达。
- source_word: הָאֲמֵלָלִים
  choice: 软弱的
  rationale: 该词在嘲讽中形容力量微薄、处境可怜；“软弱的”既保留侮辱意味，也适合连续反问的语气。
- source_word: הֲיַעַזְבוּ לָהֶם
  choice: 他们要靠自己修复城墙吗
  rationale: 此短语含义困难。עזב通常指“离开、撇下”，但在修墙语境中可能指为自己恢复工程或独力重建。正文采用语境较通顺的“靠自己修复城墙”，并以脚注保留字面和其他解释。
- source_word: הֲיִזְבָּחוּ
  choice: 他们要献祭吗
  rationale: זבח指献上祭物；“献祭”简洁地保留原文连珠式嘲讽的节奏。
- source_word: הַיְכַלּוּ בַיּוֹם
  choice: 他们能在一天之内完工吗
  rationale: כלה的加强词干表示完成；“在一天之内完工”自然地表达对工程速度的讥讽。
- source_word: הַיְחַיּוּ אֶת הָאֲבָנִים
  choice: 他们能使……石头复活吗
  rationale: חיה在使役词干中意为“使活、使复生”。保留“使石头复活”的拟人隐喻，不将其弱化为一般的“再利用”或“修复”。
- source_word: מֵעֲרֵמוֹת הֶעָפָר
  choice: 尘土堆中
  rationale: עֲרֵמוֹת是堆积物，עָפָר是尘土或松散泥土；“尘土堆”贴近原文，同时让废墟语境自然呈现。
- source_word: וְהֵמָּה שְׂרוּפוֹת
  choice: 那些已经被火烧过的
  rationale: 原文说明石头已经遭火焚烧。汉语将该分句前置为定语，使所修饰对象明确，同时保留石头受火损坏的状态。
