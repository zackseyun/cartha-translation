base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/004.yaml
  text: And next to them Meremoth son of Uriah[a], son of Hakkoz, made repairs; and next to them Meshullam son of Berechiah, son of Meshezabel, made repairs[c][b]; and next to them Zadok son of Baana made repairs.
translation:
  language: zh_hans
  text: 在他们旁边[b]，乌利亚的儿子、哈哥斯的孙子米利末修造[a]；在他们旁边，米示萨别的孙子、比利迦的儿子米书兰修造；在他们旁边，巴拿[c]的儿子撒督修造。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“修理”或较直译为“加固”。本章反复用这个希伯来语动词表示修复一段城墙或一座城门。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“在他们手边”，是表示“在他们旁边”的惯用语。
    reason: lexical_alternative
  - marker: c
    text: “巴拿”也可音译为“巴阿拿”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: 在他们旁边
  rationale: 该短语字面为“在他们手边”，在本章修城名单中是表示相邻施工位置的惯用语；译作“在他们旁边”自然且保留空间关系。
- source_word: הֶחֱזִיק
  choice: 修造
  rationale: 该动词基本义与“使坚固、加强”有关，在尼希米记第3章反复用作修复城墙或城门的固定用语。“修造”既符合工程语境，也不必在原文省略宾语处擅自补出“城墙”。
- source_word: בֶּן
  choice: 儿子／孙子
  rationale: 原文两次使用“儿子”，构成“某人的儿子、某人的儿子”的父系谱系表达。中文按实际关系自然表达为“某人的儿子、某人的孙子”，没有将其泛化为不确定的“后裔”。
- source_word: מְרֵמוֹת
  choice: 米利末
  rationale: 采用现代中文圣经人名的常见音译。
- source_word: אוּרִיָּה
  choice: 乌利亚
  rationale: 采用现代中文圣经人名的常见音译。
- source_word: הַקּוֹץ
  choice: 哈哥斯
  rationale: 按希伯来语形式音译，并保留专名中冠词成分所反映的 ha- 音。
- source_word: מְשֻׁלָּם
  choice: 米书兰
  rationale: 采用现代中文圣经人名的常见音译。
- source_word: בֶּרֶכְיָה
  choice: 比利迦
  rationale: 采用现代中文圣经人名的常见音译。
- source_word: מְשֵׁיזַבְאֵל
  choice: 米示萨别
  rationale: 按希伯来语辅音和元音作通行中文音译。
- source_word: צָדוֹק
  choice: 撒督
  rationale: 采用现代中文圣经人名的常见音译。
- source_word: בַּעֲנָא
  choice: 巴拿
  rationale: 按本节希伯来语形式作简洁的中文音译；另有“巴阿拿”等音译方式。
