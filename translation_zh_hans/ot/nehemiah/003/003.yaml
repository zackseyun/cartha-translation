base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/003.yaml
  text: The sons of Hassenaah built the Fish Gate[a]; they roofed it and set up its doors, its bolts[b], and its bars.
translation:
  language: zh_hans
  text: 哈西拿的子孙建造鱼门；他们架上梁木[a]，又安设门扇、门闩和横闩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“给它盖顶”。希伯来语动词在建筑语境中指覆盖建筑物，也可指架设梁木。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הַדָּגִים
  choice: 鱼门
  rationale: 这是带定冠词的属格结构，指耶路撒冷一座与鱼有关的特定城门；“鱼门”符合现代中文地名表达和圣经传统用法。
- source_word: בָּנוּ
  choice: 建造
  rationale: בנה的基本义是“建造”。上下文虽是修复城墙，本句却未用更具体的“修补”一词，因此保留其直接含义。
- source_word: בְּנֵי הַסְּנָאָה
  choice: 哈西拿的子孙
  rationale: בני在族谱和群体称谓中可指后代或宗族成员；“子孙”既自然，也避免限定为亲生儿子。专名按带冠词的辅音形式音译为“哈西拿”。
- source_word: הֵמָּה
  choice: 他们
  rationale: 独立代词重申前述主语；中文用“他们”自然承接，无须用“他们亲自”强化，以免加入原文未必要求的对比意味。
- source_word: קֵרוּהוּ
  choice: 架上梁木
  rationale: קרה在建筑语境中指覆盖、加顶或架梁；“架上梁木”具体呈现施工动作，同时以脚注保留“盖顶”的可能。
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: 安设门扇
  rationale: 原文直译为“使门扇立起”；“安设”符合城门安装语境，“门扇”准确区别于整个城门结构。
- source_word: מַנְעוּלָיו
  choice: 门闩
  rationale: 该词指门的锁闭装置；在古代城门语境中，“门闩”比现代意义的“锁”更贴切。
- source_word: וּבְרִיחָיו
  choice: 横闩
  rationale: בריח指横穿门扇以加固、封闭门口的杠；译作“横闩”可与前一类锁闭构件有所区别。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“哈西拿的子孙”把该群体理解为家族或宗族后裔；建筑构件使用普通读者可理解的“门扇、门闩和横闩”。原英文脚注标记与内容存在错配：有关“子孙”的说明不应附在“门闩”之后，因此中文正文不沿用该错误标记，仅为קֵרוּהוּ的真实词义歧义设置脚注。
