  yaml_path: translation/ot/nehemiah/003/028.yaml
  text: Above the Horse Gate[a], the priests made repairs, each one opposite his own house.
translation:
  language: zh_hans
  text: 马门[a]以上，祭司们各自在自己房屋对面修造。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“马匹之门”。
    reason: 保留希伯来语属格结构的较直译表达；正文按地名惯例译作“马门”。
lexical_decisions:
- source_word: מֵעַל
  choice: 以上
  rationale: 表示相对于前一段城墙工程较高或更往上的位置；“以上”简洁自然，也适合本章逐段记述工程位置的语境。
- source_word: שַׁעַר הַסּוּסִים
  choice: 马门
  rationale: 这是带定冠词的属格结构，在地名语境中译作“马门”符合现代汉语地名习惯；脚注保留较直译的可能。
- source_word: הֶחֱזִיקוּ
  choice: 修造
  rationale: 该动词本义涉及加固、抓牢，在尼希米记第3章的建筑语境中指承担修复工程；“修造”既包含修缮，也不把具体工程方式说得过死。
- source_word: הַכֹּהֲנִים
  choice: 祭司们
  rationale: 直接表达定指复数名词，并以“们”自然标明群体。
- source_word: אִישׁ
  choice: 各自
  rationale: 此处为逐一分配的用法；与后面的第三人称单数所有格相呼应，现代汉语用“各自”最自然。
- source_word: לְנֶגֶד
  choice: 对面
  rationale: 表示正对着、面对着某处；在城墙区段与住宅相对的空间描述中，“对面”准确简明。
- source_word: בֵּיתוֹ
  choice: 自己的房屋
  rationale: 第三人称阳性单数后缀随分配性的“各自”理解，指每位祭司各自的房屋；反身表达避免汉语中代词指向含混。
