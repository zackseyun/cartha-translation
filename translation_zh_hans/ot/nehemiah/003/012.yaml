base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/012.yaml
  text: Next to him Shallum son of Hallohesh[a], ruler of half the district of Jerusalem, made repairs—he and his daughters.
translation:
  language: zh_hans
  text: 在他旁边[a]，耶路撒冷半区的官长哈罗黑的儿子沙龙修造城墙；他和他的女儿们也参与修造。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在他的手旁边”；这是本章表示施工区段相邻的惯用说法。
    reason: 说明“在他旁边”所译的希伯来语惯用表达，并保留其相邻施工区段的含义。
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: 在他旁边
  rationale: 这是尼希米记第3章中表示相邻施工区段的惯用语；如此译法自然地保留了空间与叙事次序。
- source_word: הֶחֱזִיק
  choice: 修建城墙
  rationale: חזק 的使役式在本章反复指参与修复、加固城墙；结合语境译为“修建城墙”比直译“使坚固”清楚。
- source_word: שַׁלּוּם
  choice: 沙龙
  rationale: 按现代中文圣经人名的常见形式音译。
- source_word: בֶּן הַלּוֹחֵשׁ
  choice: 哈罗黑之子
  rationale: 父名按希伯来语音译，并以简洁庄重的“之子”表达父子关系。
- source_word: שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם
  choice: 管理耶路撒冷半区的
  rationale: שַׂר 表示主管或官长，פֶּלֶךְ 在本书指行政辖区；“管理……半区”既准确又符合现代汉语。
- source_word: הוּא וּבְנוֹתָיו
  choice: 他和他的女儿们一同参与
  rationale: 原文以代词和并列结构强调沙龙本人及其女儿们都是施工者；“一同参与”补足汉语表达，同时不具体限定她们承担的工序。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“半区”体现该行政区由两名主管分管；保留女儿们参与工程这一显著信息。
