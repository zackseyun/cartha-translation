base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/023.yaml
  text: After him Benjamin and Hasshub made repairs opposite their house. After him Azariah son of Maaseiah[a], son of Ananiah, made repairs beside his house.
translation:
  language: zh_hans
  text: 在他之后，便雅悯和哈述[a]在他们的房屋对面修复。在他之后，亚难尼的孙子、玛西雅的儿子亚撒利雅，在自己的房屋旁边修复。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈述”也可音译为“哈舒伯”。
    reason: 保留希伯来人名 חַשּׁוּב 的另一种可行音译；正文采用现代中文圣经较通行的“哈述”。
lexical_decisions:
- source_word: אַחֲרָיו
  choice: 接着他
  rationale: 本章反复用这一短语标示城墙修复段落的接续次序；“接着他”既保留单数代词，也自然体现名单沿线推进。
- source_word: הֶחֱזִיק
  choice: 修复
  rationale: חזק 的使役式在尼希米记第3章中惯指参与城墙修缮；译作“修复”比字面的“加固”更符合本章语境。
- source_word: בִּנְיָמִן וְחַשּׁוּב
  choice: 便雅悯和哈述
  rationale: 按现代中文圣经人名的通行形式音译；并保留两人为并列主语。
- source_word: נֶגֶד בֵּיתָם
  choice: 在他们的房屋对面
  rationale: נֶגֶד 表示面对或正对的位置；בֵּיתָם 是单数名词带复数所属后缀，因此保留为“他们的房屋”，不改成复数。
- source_word: עֲזַרְיָה בֶן־מַעֲשֵׂיָה בֶן־עֲנָנְיָה
  choice: 亚难尼的孙子、玛西雅的儿子亚撒利雅
  rationale: 按汉语习惯将希伯来语连续的“某某之子”关系明确表达为祖孙和父子关系，同时不改变谱系信息。
- source_word: אֵצֶל בֵּיתוֹ
  choice: 在自己的房屋旁边
  rationale: אֵצֶל 表示邻近、在旁边；反身领属“自己的”自然指向本句主语亚撒利雅，并保留具体地理参照。
