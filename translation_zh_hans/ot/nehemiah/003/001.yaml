  naturalness: “他的弟兄众祭司”在现代标准汉语中缺少必要的同位说明连接，读起来不够自然，且可能一时被理解为“弟兄”和“众祭司”是并列对象。改作“他的弟兄，就是众祭司”可清楚保留原文“弟兄”及其祭司身份。其余措辞庄重、通顺。
