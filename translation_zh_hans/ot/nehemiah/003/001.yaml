revisions:
- from: 于是，大祭司以利亚实和他的弟兄众祭司起来，建造羊门。他们把这门分别为圣[a]，安上门扇；又将这一段分别为圣，直到百楼，直到哈楠业楼。
  to: 于是，大祭司以利亚实和他的弟兄，就是众祭司，起来建造羊门。他们把这门分别为圣[a]，安上门扇；又将这一段分别为圣，直到百楼，直到哈楠业楼。
  rationale: 仅调整“他的弟兄众祭司”为带同位标记的“他的弟兄，就是众祭司”，解决现代汉语的结构歧义，同时完整保留原文的亲属/群体称谓及祭司身份。其余文本与脚注无需改动。
