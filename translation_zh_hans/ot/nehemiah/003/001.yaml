id: NEH.3.1
reference: Nehemiah 3:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּ֡קָם אֶלְיָשִׁיב֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וַ/יִּבְנוּ֙ אֶת שַׁ֣עַר הַ/צֹּ֔אן הֵ֣מָּה קִדְּשׁ֔וּ/הוּ וַֽ/יַּעֲמִ֖ידוּ דַּלְתֹתָ֑י/ו וְ/עַד מִגְדַּ֤ל הַ/מֵּאָה֙ קִדְּשׁ֔וּ/הוּ עַ֖ד מִגְדַּ֥ל חֲנַנְאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/001.yaml
  text: Then Eliashib the high priest rose up with his brothers the priests[a], and they built the Sheep Gate. They consecrated it and set up its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hananel.
translation:
  language: zh_hans
  text: 于是，大祭司以利亚实和他的弟兄，就是众祭司，起来建造羊门。他们把这门分别为圣[a]，安上门扇；又将这一段分别为圣，直到百楼，直到哈楠业楼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奉献”。希伯来语动词可指使某物分别为圣，也可指将其特别奉献出来。
    reason: 保留 קדשׁ 在此处“分别为圣”与“奉献”之间的词义幅度。
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: 保留קום在连续叙事中表示起身采取行动、开始工作的语气，同时避免增译为单纯的“动工”。
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司
  rationale: 这是该希伯来称号在现代汉语中的标准对应，准确表示祭司体系中的最高职分。
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: 和他的弟兄众祭司
  rationale: 保留“弟兄”这一亲属或群体称谓，也保留“祭司”对这些人的明确说明，不径直化约为“其他祭司”。
- source_word: שַׁעַר הַצֹּאן
  choice: 羊门
  rationale: 采用简洁自然的城门专名，保留原文“羊”的具体意象。
- source_word: הֵמָּה
  choice: 他们
  rationale: 独立代词带有一定强调作用；汉语用明确主语“他们”承接即可，若译成“正是他们亲自”会使强调过重。
- source_word: קִדְּשׁוּהוּ
  choice: 把这门分别为圣／将这一段分别为圣
  rationale: קדשׁ表示使之成为圣或特别归作神圣用途。“分别为圣”保留其宗教含义；第二次出现时，阳性单数宾语所指的是延伸至两座楼之间的工程段落，汉语以“这一段”自然承接而不重复含混的“它”。
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: 安上门扇
  rationale: 表达把城门的门扇置于适当位置，既自然又不对具体安装方式作过度推断。
- source_word: מִגְדַּל הַמֵּאָה
  choice: 百楼
  rationale: 按希伯来语构词直译为传统而简洁的地名；“百”究竟表示数量、名称或其他所指，原文本身未说明。
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: 哈楠业楼
  rationale: 将人名或地名חֲנַנְאֵל音译为“哈楠业”，并以“楼”表示防御塔楼。
- source_word: וְעַד ... עַד
  choice: 直到……直到……
  rationale: 保留原文两次עַד所标示的范围和重复结构。
theological_decisions:
- issue: קדשׁ用于城门及城墙工程时的礼仪性含义
  choice: 分别为圣
  alternative: 奉献
  rationale: “分别为圣”明确保留把对象划归神圣用途的含义，也不将行动弱化为一般性的落成奉献；脚注保留“奉献”这一在本语境中可能的译法。
- issue: 第二个קִדְּשׁוּהוּ的宾语范围
  choice: 将这一段分别为圣
  alternative: 将它分别为圣
  rationale: 原文使用阳性单数代词，却以“直到……直到……”说明范围。译作“这一段”让现代汉语读者能够理解所指的城防工程段落，同时不额外断言他们把两座楼本身都分别为圣。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“起来，建造”保留希伯来叙事推进感；“门扇”“楼”符合古城防御工程语境。标点将建门、安门扇与延伸段落的分别为圣清楚分层。
