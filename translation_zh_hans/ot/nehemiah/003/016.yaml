base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/016.yaml
  text: After him Nehemiah son of Azbuk[a], ruler of half the district of Beth-zur, made repairs as far as opposite the tombs of David, and as far as the pool that was made[b], and as far as the house of the mighty men.
translation:
  language: zh_hans
  text: 在他之后[a]，伯夙半个行政区的官长亚斯布的儿子尼希米修缮，直到大卫坟墓对面的地方，又直到那座造好的池子，并直到勇士之屋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他之后”也可理解为“在他旁边”，即指工程位置相邻，而非修缮次序。
    reason: lexical_alternative
  - marker: b
    text: “勇士之屋”也可译作“战士之屋”。原文可能指某座军事建筑，但其确切用途和地点无法确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: 在他之后
  rationale: 本章修墙名单中，这一惯用语通常承接上一位修缮者或上一段工程；译作“在他之后”保留次序含义，同时不排除空间上相邻的可能。
- source_word: הֶחֱזִיק
  choice: 接着修缮
  rationale: חזק 的使役式在尼希米记第3章是修复城墙工程的惯用表达；“修缮”自然地涵盖修理和加固，“接着”则使名单中的承接关系清楚。
- source_word: שַׂר חֲצִי פֶּלֶךְ
  choice: 管理……半区的
  rationale: שַׂר 指行政首长或官员，פֶּלֶךְ 在波斯时期语境中指行政区；此处用动词性表达，符合现代汉语习惯，又不把该区域夸大为行省。
- source_word: בֵּית צוּר
  choice: 伯夙
  rationale: 这是地名，按常见中文圣经人名地名音译处理。
- source_word: עַד נֶגֶד קִבְרֵי דָוִיד
  choice: 直到大卫坟墓对面的地方
  rationale: נֶגֶד 表示面对、在……对面；该译法明确是工程延伸到与坟墓相对的位置，并未暗示进入墓地。
- source_word: הַבְּרֵכָה הָעֲשׂוּיָה
  choice: 那座建成的池子
  rationale: 原文直译为“被造的池子”；“建成的池子”保留被动结果含义，避免进一步推定其工程性质。
- source_word: בֵּית הַגִּבֹּרִים
  choice: 勇士之屋
  rationale: גִּבֹּרִים 可指勇士或战士，而该建筑的确切用途不明；采用较直译的名称，避免武断译为“兵营”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留本章工程名单的承接句式，并以“修缮”表达修复、加固城墙的惯用含义。专名采用常见中文圣经译名；对“建成的池子”和“勇士之屋”保持原文的不确定性，不具体化为人工池或兵营。
