base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/008.yaml
  text: Next to him Uzziel son of Harhaiah[a], one of the goldsmiths, made repairs; and next to him Hananiah, one of the perfumers, made repairs. And they restored Jerusalem as far as the Broad Wall.
translation:
  language: zh_hans
  text: 在他旁边，金匠中的一位——哈海雅的儿子乌薛——进行了修缮；在他旁边，香料调制师中的一位哈拿尼雅也进行了修缮。他们修复了耶路撒冷，直到宽墙。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们把耶路撒冷留到宽墙那里。”这里的希伯来语动词通常意为“离开、留下”，但在本章重建的语境中，常被理解为“修复”或“修缮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָדוֹ
  choice: 他旁边／再旁边
  rationale: 这是尼希米记第3章依次说明相邻施工位置的惯用语；如此表达既保留空间关系，也符合现代汉语。
- source_word: הֶחֱזִיק
  choice: 负责修缮
  rationale: 该词基本含义与“加固、使坚固”有关，但本章语境中指参与城墙修复工程；“负责修缮”自然地传达施工含义。
- source_word: צֹרְפִים
  choice: 金匠
  rationale: 此处复数形式表示乌薛所属的行业群体；“金匠”比泛称“金属工匠”更符合传统词义和上下文。
- source_word: בֶּן הָרַקָּחִים
  choice: 香料调制师之一
  rationale: 原文直译近似“香料调制师们之子”，在此很可能表示行业归属。译作“之一”避免不自然的汉语，同时不虚构一个名为“哈拿尼雅父亲”的人物。
- source_word: וַיַּעַזְבוּ
  choice: 他们修复了
  rationale: 该动词通常意为“离开、留下”，但在全章修复工程的语境中，多被理解为罕见的“修复”用法。正文采用符合语境的译法，并以脚注保留通常词义所产生的真实歧义。
- source_word: יְרוּשָׁלַםִ
  choice: 耶路撒冷
  rationale: 原文以城市本身为宾语，可能借城市代指其防御工事；正文不擅自增补“城墙”。
- source_word: עַד הַחוֹמָה הָרְחָבָה
  choice: 直到宽墙
  rationale: 这里似乎指耶路撒冷一处有特定称谓的防御设施；“宽墙”简洁保留名称及形容词含义。
theological_decisions: []
