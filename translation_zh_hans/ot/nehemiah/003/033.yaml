base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/033.yaml
  text: When Sanballat heard that we were rebuilding the wall[a], he became angry and very enraged, and he mocked the Jews.
translation:
  language: zh_hans
  text: 参巴拉听说我们正在重建城墙[a]，就发怒，极其恼怒，并嘲笑犹太人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译作“犹大人”。希伯来语这个词既可按地域指犹大地的人，也可较广泛地指犹太人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……时／听说……就……
  rationale: 这是引出叙事新进展的结构。中文以“听说……就……”自然表达时间关系和事件推进，无须机械译出“事情发生了”。
- source_word: שָׁמַע
  choice: 听说
  rationale: 该动词基本义为“听见”，此处指听到消息；“听说”在现代汉语中准确自然。
- source_word: סַנְבַלַּט
  choice: 参巴拉
  rationale: 采用现代中文圣经语境中通行且易辨识的人名音译。
- source_word: כִּי אֲנַחְנוּ בוֹנִים
  choice: 我们正在重建
  rationale: 分词表示持续进行的行动；结合耶路撒冷城墙受损后被修复的语境，“正在重建”比泛指的“正在建造”更准确。
- source_word: הַחוֹמָה
  choice: 城墙
  rationale: חוֹמָה意为防御性墙垣；上下文明确指耶路撒冷的城墙，中文译作“城墙”比单说“墙”更清楚自然。
- source_word: וַיִּחַר לוֹ
  choice: 发怒
  rationale: 原文是怒气如火燃烧的惯用语；“发怒”简洁传达其意义。
- source_word: וַיִּכְעַס הַרְבֵּה
  choice: 极其恼恨
  rationale: 第二个愤怒用语带有הַרְבֵּה“非常、极其”的强化作用；用“极其恼恨”保留与前一“发怒”的递进，又避免中文重复。
- source_word: וַיַּלְעֵג
  choice: 嘲笑
  rationale: 该动词表示带着轻蔑的讥讽或嘲弄；“嘲笑”简明、自然且力度适当。
- source_word: עַל הַיְּהוּדִים
  choice: 犹太人
  rationale: יְהוּדִים既可指广义的犹太人，也可按地域指犹大人；正文采用现代读者最易理解的“犹太人”，并以脚注保留另一可能。
theological_decisions: []
