    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: 在他们旁边
  rationale: 这是尼希米记第3章中表示相邻施工位置的惯用语；如此翻译自然地保留了名单沿城墙依次推进的意味。
- source_word: הֶחֱזִיק
  choice: 修造了城墙
  rationale: חזק 的使役形本义为“使坚固”，但在本章语境中惯指参与城墙修复；正文采用自然明确的语境义，并以脚注保留字面含义。
- source_word: רְפָיָה
  choice: 利法雅
  rationale: 按普通话圣经人名的通行音译处理该专名。
- source_word: בֶן־חוּר
  choice: 户珥之子
  rationale: 直接表达希伯来语中以父名辨识人物的常用结构。
- source_word: שַׂר
  choice: 管理
  rationale: שַׂר 表示官长或主管者；在此行政语境中用动词“管理”连接辖区，现代汉语更自然。
- source_word: חֲצִי פֶּלֶךְ יְרוּשָׁלִַם
  choice: 耶路撒冷区一半地区
  rationale: פֶּלֶךְ 指行政区；原文说明利法雅负责耶路撒冷区的一半。译文保留这种行政区划关系，未将其扩大为省。
