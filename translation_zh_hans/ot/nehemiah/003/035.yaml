base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/035.yaml
  text: And Tobiah the Ammonite was beside him[a], and he said, “Even what they are building—if a fox climbs up on it[b], he will break through their stone wall!”
translation:
  language: zh_hans
  text: 亚扪人多比雅在他身旁，说：“就连他们正在建造的，若有一只狐狸[a]爬上去，也会冲破[b]他们的石墙！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狐狸”所译的希伯来词在某些语境中也可泛指狐狸一类的犬科动物，有时译作“豺”；此处通常译为“狐狸”。
    reason: lexical_alternative
  - marker: b
    text: “冲破”也可译作“拆毁”或“冲垮”。这里的希伯来动词指破开、造成缺口，突出多比雅对城墙不堪一击的嘲弄。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְלוֹ
  choice: 在他身旁
  rationale: אצל加第三人称单数后缀表示贴近某人；此处指多比雅在参巴拉身旁。译文简洁自然，不额外补入原文没有明说的动作。
- source_word: גַּם אֲשֶׁר הֵם בּוֹנִים
  choice: 就连他们所建的这墙
  rationale: גַּם在嘲讽中带强调意味，译作“就连”；“这墙”由上下文明确补出，使汉语自然，同时保留“他们所建的”这一进行中的工程意味。
- source_word: אִם
  choice: 哪怕
  rationale: אִם引出条件。这里并非中性的假设，而是夸张的讥讽；“哪怕”既保留条件关系，也传达轻蔑语气。
- source_word: יַעֲלֶה שׁוּעָל
  choice: 有一只狐狸爬上去
  rationale: שׁוּעָל通常译为“狐狸”；יַעֲלֶה表示上去或登上。汉语用“爬上去”自然呈现动物登上墙的画面。
- source_word: וּפָרַץ
  choice: 它也会冲破
  rationale: פרץ可指冲破、攻破或造成缺口。单数动词顺承前面的单数主语“狐狸”，所以明确译出“它”，保留嘲讽中狐狸竟能破墙的夸张画面。
- source_word: חוֹמַת אַבְנֵיהֶם
  choice: 他们的石墙
  rationale: 该结构直译为“他们石头的墙”；“他们的石墙”符合现代汉语，又保留墙由石头筑成的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就连”“哪怕”传达原句的讥讽和夸张，但不额外强化其内容；“这墙”依据上下文补明原文省略的指称。脚注标记与所注词语直接对应。
