  text: אֵת֩ שַׁ֨עַר הַ/גַּ֜יְא הֶחֱזִ֣יק חָנוּן֮ וְ/יֹשְׁבֵ֣י זָנוֹחַ֒ הֵ֣מָּה בָנ֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ/אֶ֤לֶף אַמָּה֙ בַּ/חוֹמָ֔ה עַ֖ד שַׁ֥עַר הָ/שֲׁפֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/013.yaml
  text: Hanun and the inhabitants of Zanoah repaired the Valley Gate[a]. They built it and set up its doors, its bolts, and its bars, and repaired a thousand cubits of the wall[c][b], as far as the Dung Gate.
translation:
  language: zh_hans
  text: 哈嫩和撒挪亚的居民修缮了谷门[a]。他们把门建好，安上门扇、门闩和横闩，又修缮了一千肘[b]长的城墙，直到粪厂门[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “修缮”或译“加固”；这里的希伯来语动词可指使之坚固，在本章重建的语境中也可指修复。
    reason: lexical_alternative
  - marker: b
    text: 一千肘约合457米。
    reason: cultural_note
  - marker: c
    text: “粪厂门”或译“垃圾门”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: 修缮
  rationale: 该动词本义可指使之坚固；在尼希米记第3章重建城墙的语境中，表示承担并完成某段修复工程。“修缮”自然且保留修复、加固的意味。
- source_word: שַׁעַר הַגַּיְא
  choice: 谷门
  rationale: 这是由“谷”构成的城门名称；“谷门”简洁自然，也符合中文圣经地名的表达方式。
- source_word: יֹשְׁבֵי זָנוֹחַ
  choice: 撒挪亚的居民
  rationale: 分词形式指居住在撒挪亚的人；“居民”准确、简明。
- source_word: הֵמָּה בָנוּהוּ
  choice: 他们把门建好
  rationale: 原文直译为“他们建造它”。上下文是修复工程，“建好”既贴近动词，又能自然承接前句，且不强行改作“重建”。
- source_word: וַיַּעֲמִידוּ
  choice: 安上
  rationale: 该使役动词意为使之立定、放置就位；用于门扇和门闩时，“安上”是自然的现代汉语建筑用语。
- source_word: דַּלְתֹתָיו
  choice: 门扇
  rationale: 复数名词指城门的门板或两扇门；“门扇”比泛称“门”更具体。
- source_word: מַנְעֻלָיו
  choice: 门闩
  rationale: 在古代城门构造语境中指用于闭合、固定门扇的装置；“门闩”比现代意义的“锁”更贴合。
- source_word: בְרִיחָיו
  choice: 横闩
  rationale: 指横置以加固、封闭城门的长闩；加“横”可与前一项门闩有所区分，并呈现其结构功能。
- source_word: אֶלֶף אַמָּה
  choice: 一千肘
  rationale: 保留原文古代长度单位及其明确数值，并用脚注提供约合现代单位的距离。
- source_word: בַּחוֹמָה
  choice: 一千肘长的城墙
  rationale: 介词短语结合前文重复省略的修缮动作，表示所修城墙的延伸范围；中文补出“长”使量度关系清楚。
- source_word: שַׁעַר הָשֲׁפוֹת
  choice: 粪厂门
  rationale: 该门名与粪便、垃圾堆放或清运有关。“粪厂门”是凝练的专名译法；“垃圾门”也是可能译法，故以脚注说明。
