base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/027.yaml
  text: After him the Tekoites repaired another section[a], opposite the great projecting tower, as far as the wall of Ophel.
translation:
  language: zh_hans
  text: 在他之后，提哥亚人又修造了一段[a]，在那座向外凸出的大塔楼对面，直到俄斐勒的城墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第二段”。希伯来语可强调，提哥亚人在先前承担的工程之外又修造了一段。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: 在他之后
  rationale: 本章修造名录中，这一表达通常标明工程次序；三单阳性后缀承接前文的人物。
- source_word: הֶחֱזִיקוּ
  choice: 修造
  rationale: 该动词本义为“使坚固”，但在尼希米记第3章中是修复、重建城墙的惯用词；“修造”兼顾修缮与建造语境。
- source_word: הַתְּקֹעִים
  choice: 提哥亚人
  rationale: 这是由地名提哥亚构成的居民称谓，译为“提哥亚人”自然明确。
- source_word: מִדָּה שֵׁנִית
  choice: 又……一段
  rationale: 直译可作“第二段”；结合他们先前已有一项工程，正文用“又……一段”自然表达追加的一段，同时以脚注保留字面可能。
- source_word: מִנֶּגֶד
  choice: 对面
  rationale: 表示面对某地标或与之相对的位置。
- source_word: הַמִּגְדָּל הַגָּדוֹל הַיּוֹצֵא
  choice: 那座向外凸出的大楼
  rationale: מִגְדָּל 指塔楼，גָּדוֹל 表示大，分词 הַיּוֹצֵא 在建筑语境中指向外伸出；“向外凸出的大楼”准确呈现其形态。
- source_word: וְעַד
  choice: 直到
  rationale: 标明该段工程延伸的终点；汉语无需机械译出连接词“和”。
- source_word: חוֹמַת הָעֹפֶל
  choice: 俄斐勒的城墙
  rationale: חוֹמַת 是“城墙”的附属形，后接耶路撒冷地名俄斐勒。
theological_decisions: []
