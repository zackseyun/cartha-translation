base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/005.yaml
  text: 'Then my God put it into my heart to assemble the nobles[a], the officials, and the people to be enrolled by genealogy. And I found the book of the genealogy of those who came up first[b], and I found written in it:'
translation:
  language: zh_hans
  text: 于是，我的神把这意念放在我心里，使我召集贵族、官员和百姓，按家谱登记[a]。我找到最先上来的人的家谱名册[b]，发现其中写着：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“按家族世系核定登记”。希伯来语指依据家族血统进行正式登记。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“最先上来的人的家谱记录”。这里指最早从流亡之地归回的那批人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֱלֹהַי אֶל לִבִּי
  choice: 我的神把这意念放在我心里
  rationale: 保留希伯来语“给到我心里”的意象和神主动引导的含义，同时用自然的现代汉语表达，不把这种内在促动明确解释为某种特定启示方式。
- source_word: וָאֶקְבְּצָה
  choice: 要我召集
  rationale: 结合前面的内心促动，将该形式表达为神放在尼希米心中的行动意向；“召集”符合正式的行政场景。
- source_word: הַחֹרִים
  choice: 贵族
  rationale: 在尼希米记的社会与行政语境中，该词指有地位的社会领袖，而非泛指自由民。
- source_word: הַסְּגָנִים
  choice: 官员
  rationale: 该词指行政体系中的治理者或属官；“官员”准确、清楚，也适合现代汉语。
- source_word: הָעָם
  choice: 百姓
  rationale: 符合本节与贵族、官员并列的群体称谓，也保持圣经叙事的庄重语体。
- source_word: לְהִתְיַחֵשׂ
  choice: 按家谱登记
  rationale: 该词指依据家族世系核定身份并正式登记；此译法兼顾家谱依据和行政登记过程。
- source_word: סֵפֶר הַיַּחַשׂ
  choice: 家谱册
  rationale: 指实际存在的书面世系名册；“家谱册”简洁地保留“册”和“家谱”两层含义。
- source_word: הָעוֹלִים בָּרִאשׁוֹנָה
  choice: 最初上来之人
  rationale: 保留“上来”这一前往犹大和耶路撒冷的圣经地理表达，也传达这是最早一批归回者。
- source_word: וָאֶמְצָא כָתוּב בּוֹ
  choice: 发现其中写着
  rationale: 自然地引出后续名录内容，并忠实反映尼希米在册中发现文字记录。
theological_decisions:
- issue: 神对尼希米内心的引导
  choice: 我的神把这意念放在我心里
  alternative: 我的神感动我／我的神启示我
  rationale: 原文说明神主动使尼希米心中产生这一意向，却没有界定启示的具体方式；所选译法保留这种神学张力，避免将其强化为正式启示或弱化为单纯个人想法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“贵族、官员和百姓”清楚呈现社会群体层次；“上来”保留原文前往圣地的表达，而脚注说明其归回背景。
