  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑א וַ/יְגֹֽאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/064.yaml
  text: These sought their record among those enrolled by genealogy[a], but it was not found[b], so they were excluded from the priesthood.
translation:
  language: zh_hans
  text: 这些人在按家系登记的名册中查找自己的记录[a]，却没有找到；因此，他们被排除在祭司职分之外[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“查找证明自己世系的文书。”希伯来文指用来确认家系的书面凭据。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被判定不配担任祭司。”这里的希伯来文表示，他们因世系无法核实而被视为不具祭司资格。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些人
  rationale: 复数指示词回指前文所述群体；中文补出“人”使指代自然清楚，并未增加身份判断。
- source_word: בִּקְשׁוּ
  choice: 查找
  rationale: בקשׁ 在此表示寻找、搜寻；“查找”适合书面记录的行政语境。
- source_word: כְתָבָם
  choice: 自己的……记录
  rationale: כְּתָב 指书写物或文书；结合后面的家系登记语境，译为“记录”既明确又不过度限定文书形式。
- source_word: הַמִּתְיַחְשִׂים
  choice: 族谱记录
  rationale: יחשׂ 的 Hitpael 形式涉及按家系确认或登记身份；“族谱记录”用自然中文表达书面世系凭据，并以脚注保留结构上的其他理解。
- source_word: וְלֹא נִמְצָא
  choice: 却没有找到
  rationale: 单数被动式最自然地以所查找的记录为隐含主语；中文省略重复宾语，仍清楚指该记录未被找到。
- source_word: וַיְגֹאֲלוּ
  choice: 被排除
  rationale: 此处 גאל 表示因世系无法核实而被视为不合资格；译出实际处置结果，避免“玷污”等字眼使人误解为一般礼仪不洁。
- source_word: מִן הַכְּהֻנָּה
  choice: 在祭司职分之外
  rationale: כְּהֻנָּה 指祭司身份、职分或制度；与“被排除在……之外”搭配，中文自然且保留制度性含义。
theological_decisions:
- issue: וַיְגֹאֲלוּ 所表达的是玷污状态还是任职资格的排除
  choice: 正文译为“被排除在祭司职分之外”
  alternative: “被判定不配担任祭司”或较直译的“被视为污秽”
  rationale: 上下文的原因是谱系凭据未获查证，焦点在祭司资格；正文表达实际后果，同时在脚注说明原词也可译为不合资格，避免把无法证实世系直接等同于道德或礼仪上的污秽。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“族谱记录”简洁呈现行政和家系语境；两个脚注分别说明文书性质及排除祭司资格的语义。
