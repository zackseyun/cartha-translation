  source_fidelity: 正文将“自己的族谱记录”作为所查找的对象，基本传达了意思；但原文的结构是“在按家系登记者的记录中查找他们的文书/记录”，现译未明确“在……中查找”这一层，且“族谱记录”略把两项表达合并。修订后保留所查记录未获找到的单数指向，并更贴近原文行政登记语境。
  naturalness: “在按家系登记的名册中查找自己的记录”是现代标准汉语中自然、清晰且庄重的表述。“被排除在祭司职分之外”搭配得当。
  terminology: “家系”“名册”“祭司职分”准确反映谱系登记与祭司资格的制度性语境。脚注避免将原文的资格排除直接说成当事人已“失去”原有资格，因原文并未明说其先前拥有该资格。
  issues:
