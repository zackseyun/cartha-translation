revisions:
- from: 这些人查找自己的族谱记录[a]，却没有找到，因此被排除在祭司职分之外[b]。
  to: 这些人在按家系登记的名册中查找自己的记录[a]，却没有找到；因此，他们被排除在祭司职分之外[b]。
  rationale: 修订将“按家系登记的名册”明确为查找的范围，并以“自己的记录”对应所寻的书面凭据，较完整地呈现原文句法。对祭司职分的处置仍译为实际结果“被排除在……之外”；脚注则谨慎说明资格未获证实所导致的判定，不添加其先前曾具资格的含义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:03Z'
