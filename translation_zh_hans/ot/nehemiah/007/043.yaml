lexical_decisions:
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 定冠词加复数名词，在人口登记名单中引出一个群体；按名单体例不补出谓语。
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在族谱和人口登记语境中，该词常泛指后裔或家族成员；译作“子孙”既保留血缘表达，也避免误解为仅指亲生儿子。
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 采用现代中文圣经中对这一被掳归回时期人物的通行译名，并与“约书亚”这一较完整名字的常用译法相区别。
- source_word: לְקַדְמִיאֵל
  choice: 属于甲篾
  rationale: 前缀 לְ 在此表示家族归属或关联；译作“属于”可自然表达名单中的从属关系。
- source_word: לִבְנֵי לְהוֹדְוָה
  choice: 何达瓦家族的
  rationale: 连续的 לְ 与 בְּנֵי 构成层叠的家族关系表达；用“家族”传达其可指较广泛宗族而非直系儿子的含义。
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: 七十四人
  rationale: 按现代汉语基数词表达，并补“人”作为人口统计量词。
