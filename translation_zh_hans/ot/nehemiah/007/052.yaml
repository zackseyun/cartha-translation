  yaml_path: translation/ot/nehemiah/007/052.yaml
  text: the sons of Besai[a], the sons of Meunim[c][b], the sons of Nephushesim.
translation:
  language: zh_hans
  text: 比赛的子孙，米乌宁的子孙[a]，尼弗示心的子孙[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米乌宁”也可理解为族群称谓，译作“米乌人”。
    reason: lexical_alternative
  - marker: b
    text: 以斯拉记2:50的平行名单作“尼弗心”；本节希伯来文本的拼写较长。
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 本节处于回归者的宗族名录中，这一构词形式引出家族或群体。“子孙”既保留谱系意味，也比逐字译作“儿子”更符合现代汉语名录的表达。
- source_word: בֵסַי
  choice: 比赛
  rationale: 这是专名，按希伯来语读音音译；采用现代中文圣经人名中自然、简洁的形式。
- source_word: מְעוּנִים
  choice: 米乌宁
  rationale: 该词可能是族群称谓，也可能在反复出现的名录句式中充当家族名。正文音译，以免把其性质过早限定为民族称谓。
- source_word: נפושסים
  choice: 尼弗示心
  rationale: 这是家族或群体名称，按本节马所拉文本的辅音形式音译；脚注说明平行经文所见异文。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的名录体，并重复“……的子孙”以保留原文三次出现的固定句式。专名以现代普通话可读的音译呈现；对“米乌宁”的名称性质及末一名称与平行名单的差异，以脚注保留歧义。
