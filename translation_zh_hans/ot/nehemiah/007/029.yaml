lexical_decisions:
- source_word: אַנְשֵׁי
  choice: 人
  rationale: 这是城名列表中的附属结构，指与这些城镇相关的男子或代表成员。汉语用“人”最自然，也避免生硬重复“男人”，同时没有擅自扩展为全体居民。
- source_word: קִרְיַת יְעָרִים
  choice: 基列·耶琳
  rationale: 按希伯来语地名音译，并用间隔号清楚标示复合地名。
- source_word: כְּפִירָה
  choice: 基非拉
  rationale: 按希伯来语辅音与常见圣经中文地名形式音译。
- source_word: וּבְאֵרוֹת
  choice: 和比录
  rationale: 保留连接词“和”，地名按希伯来语音译。
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וּשְׁלֹשָׁה
  choice: 743名
  rationale: 原文数字为七百四十三；名单语境中使用阿拉伯数字更清晰，“名”作为人数单位符合现代汉语。
