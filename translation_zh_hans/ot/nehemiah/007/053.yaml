- source_word: בַקְבּוּק
  choice: 巴卜
  rationale: 专名按希伯来语音译；采用简洁、适合现代汉语圣经人名体系的形式。
- source_word: חֲקוּפָא
  choice: 哈古法
  rationale: 专名按希伯来语辅音与读音音译，不赋予词义。
- source_word: חַרְחוּר
  choice: 哈珥户珥
  rationale: 专名音译；其词义不确定，在本名单中也无须意译。
