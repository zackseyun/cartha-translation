  language: zh_hans
  text: 另一处尼波[a]的人，共五十二名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “另一处尼波”也可译作“别的尼波”。希伯来语中的这个形容词既可表示“另一个”，也可表示“别的”；这里很可能是为了把这个地方与名单中另一处名叫尼波的地方区别开来。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ……的人
  rationale: 这是 אִישׁ 的复数构造形式；在归回者名录中，指来自某地的人或家族代表。译作“……的人”既贴近原文，也符合现代汉语名录体表达。
- source_word: נְבוֹ
  choice: 尼波
  rationale: 专有地名，按现代汉语常用音译处理。
- source_word: אַחֵר
  choice: 另一个
  rationale: 该形容词可表示“另一个”或“别的”。此处很可能用来区分名单中两个同名为尼波的地方；正文采用自然且不失原意的“另一个”，并以脚注保留词义差异。
- source_word: חֲמִשִּׁים וּשְׁנָיִם
  choice: 五十二名
  rationale: 按现代汉语数词顺序译为“五十二”；加量词“名”使人数名单的表达自然清楚。
theological_decisions: []
