lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ……人
  rationale: 这是 אִישׁ 的复数构造式，在名单中表示属于或来自某地的人。汉语用“……人”自然简洁，也适合人口登记名单的体例；不必另加原文未明说的“男子”。
- source_word: בֵית עַזְמָוֶת
  choice: 伯·亚斯玛威
  rationale: 在本段回归者名册的语境中，此词组用作地名，按音译处理；“伯”对应地名构词成分 בֵית，并以间隔号显示复合地名的结构。
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: 四十二名
  rationale: 采用现代汉语常用数词形式；量词“名”使人数统计自然清楚。
