lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 该词是בֵּן的复数附属形式；在归回者名册中表示同一家族或宗族的成员。译作“子孙”比直译“儿子”更符合现代汉语名册语境，同时保留谱系含义。
- source_word: עֵילָם
  choice: 以拦
  rationale: 按现代中文圣经人名的通行音译处理；本节指以拦这一家族的归回成员，而非作为地理区域的以拦。
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 一千二百五十四名
  rationale: 希伯来语数词合计为1,254。正文用中文数字表达，并补出符合汉语人数清单习惯的量词“名”；它是语法上的必要补足，并非另加身份说明。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的名册体。“以拦的子孙”自然表达宗族归属；人数不加“人”等源文未明说的身份名词，仅使用现代汉语所需的量词“名”。
