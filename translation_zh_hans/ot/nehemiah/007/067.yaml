  text: besides their male and female slaves[a], of whom there were 7,337; and they had 245 male and female singers.
translation:
  language: zh_hans
  text: 此外，还有他们的男奴和女奴[a]，共7,337人；他们另有男女歌手245人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“男仆和女仆”。这两个希伯来语词也可较宽泛地指仆役；但在这里的人口统计语境中，很可能是指各家所属的男女奴隶。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: 此外，还有
  rationale: 该词表示前述总数之外的附加人数；“此外，还有”符合现代汉语人口统计语境。
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: 他们的男奴和女奴
  rationale: עֶבֶד可指仆人或奴隶，אָמָה指女奴或婢女；此处二者成对，并作为归属于各家的人口另行统计，因此译作“男奴和女奴”较准确地反映其社会身份，同时保留性别区分。
- source_word: אֵלֶּה
  choice: 共
  rationale: 字面为“这些”；在汉语统计句式中用“共”自然地引出其总数。
- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: 7,337人
  rationale: 准确保留数值；采用现代数字格式，并补“人”以使汉语表达完整。
- source_word: וְלָהֶם
  choice: 他们另有
  rationale: 希伯来语所有结构直译为“归他们所有”；“他们另有”既自然，也显示这些歌手是在上一组之外另行统计。
- source_word: מְשֹׁרֲרִים וּמְשֹׁרֲרוֹת
  choice: 男女歌手
  rationale: 原文分别使用阳性和阴性形式，明确包含男性和女性；“男女歌手”简洁保留这一区分。
- source_word: מָאתַיִם וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: 245人
  rationale: 准确保留数值，并依现代汉语统计表达补出量词。
