base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/001.yaml
  text: When the wall had been built and I had set up the doors[a], the gatekeepers, the singers[b], and the Levites were appointed.
translation:
  language: zh_hans
  text: 城墙建成、我安好门扇以后，守门的人、歌唱的人和利未人都已派定[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “派定”也可译作“指派”或“登记”；希伯来语动词在这里可以表达较宽泛的行政安排，不一定专指正式任命。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……以后
  rationale: 该结构引出叙事中的时间背景；结合后面的完成性动词，用“……以后”自然表达事件的先后关系，不生硬直译为“事情发生了”。
- source_word: נִבְנְתָה הַחוֹמָה
  choice: 城墙建成
  rationale: נִבְנְתָה是בנה的尼法勒完成式，表达被动且已完成；“建成”既保留“建造”的词义，也自然体现完成状态。הַחוֹמָה依上下文指耶路撒冷的城墙。
- source_word: וָאַעֲמִיד הַדְּלָתוֹת
  choice: 我安上门扇
  rationale: עמד的使役式在此表示使门立定、安装到位；דְּלָתוֹת指实际的门板或门扇。“安上门扇”比笼统的“设立门”更符合现代汉语，也没有额外加入原文未明说的“城门”。
- source_word: וַיִּפָּקְדוּ
  choice: 都被派定了
  rationale: פקד的尼法勒式在行政语境中可指被委派、指派或登记。“被派定”保留被动形式及职责安排的意味，同时脚注说明其较宽的语义范围。
- source_word: הַשּׁוֹעֲרִים
  choice: 守门的
  rationale: 该词指负责看守门口或城门的人；“守门的”自然、清楚，并保留原文的职分类称呼。
- source_word: הַמְשֹׁרְרִים
  choice: 歌唱的
  rationale: 该词源于“歌唱”，在此指承担歌唱职分的人。“歌唱的”直接对应原词，并与并列的职分类称呼协调。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是该族群及圣职群体在现代中文圣经语境中的通行名称。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句首以“……以后”整合希伯来语的叙事引入语和时间从句；用“门扇”准确表达具体门板，用“守门的、歌唱的”保持并列结构及职分类称呼。
