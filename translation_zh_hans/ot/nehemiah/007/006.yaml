base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/006.yaml
  text: 'These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away, and who returned to Jerusalem and to Judah[c][b], each man to his city:'
translation:
  language: zh_hans
  text: 以下是本省的子民[a]：他们从被掳流亡中上来[b]；这些人曾被巴比伦王尼布甲尼撒掳走，后来返回耶路撒冷和犹大，各人回到自己的城[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子民”原文直译为“儿子们”，这里是表示属于本省之人的习语。
    reason: lexical_alternative
  - marker: b
    text: 原文用了两个相关名词，较直译为“从流亡者的被掳中”；也可较顺畅地译为“从被掳流亡中”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“各人到自己的城”，是分配式说法，在这份名单中也可涵盖随各人归回的家庭或宗族单位。
    reason: lexical_clarification
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: 本省的子民
  rationale: “בְּנֵי”直译为“儿子们”，在名单语境中是表示归属的习语；“子民”既保留其群体归属意味，又比“儿子们”更符合现代汉语。מְדִינָה指波斯时期的行政省份，因此译为“省”。
- source_word: הָעֹלִים
  choice: 上来
  rationale: 保留עלה描述前往犹大和耶路撒冷时惯用的“上去、上来”意象，不将其完全弱化为一般性的“归来”。
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: 从被掳流亡之地
  rationale: 用“被掳”和“流亡”分别体现שְׁבִי与גּוֹלָה两个相关名词，同时调整为可读的现代汉语。
- source_word: אֲשֶׁר הֶגְלָה
  choice: 这些人曾被……掳走
  rationale: 明确尼布甲尼撒是强制迁徙的施事者，并以“曾”交代该行动先于归回。
- source_word: נְבוּכַדְנֶצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经和历史叙述中通行的人名译法。
- source_word: וַיָּשׁוּבוּ
  choice: 后来返回
  rationale: 将希伯来语的连续叙事动词作为主要事件表达，不把它强行改成与前面分词完全平行的关系从句；“后来”自然呈现事件次序。
- source_word: לִירוּשָׁלַם וְלִיהוּדָה
  choice: 返回耶路撒冷和犹大
  rationale: 保留两个目的地；这里“犹大”指较广的地区，而不只是支派。
- source_word: אִישׁ לְעִירוֹ
  choice: 各人回到自己的城
  rationale: 以现代汉语的分配式表达对应字面的“一人到他的城”，既保留逐一归返的意义，也避免把代表家族或家庭单位的阳性单数误解为只涉及成年男性。
theological_decisions:
- issue: אִישׁ的阳性代表性表达
  choice: 各人回到自己的城
  alternative: 各男人回到自己的城
  rationale: 原文阳性单数在此作分配式用法，所指归回者也按家庭或宗族单位统计。“各人”忠实表达其语法功能，又不额外断言只有男性归返。
- issue: “上来”所含的地域与传统意象
  choice: 保留“上来”
  alternative: 译为“归来”
  rationale: עלה是前往以色列地或耶路撒冷的惯用动词；保留方向性措辞可呈现原文意象，同时不将其扩展为特定教义解释。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“子民”维持名单开头的正式语体；分号理清原文较长的修饰与叙事结构。保留“上来”与“被掳／流亡”的源语意象，并通过脚注说明较直译形式。
