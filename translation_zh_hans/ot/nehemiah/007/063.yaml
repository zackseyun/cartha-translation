  text: וּ/מִן הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/063.yaml
  text: 'And from the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: zh_hans
  text: 祭司中有哈巴雅的子孙、哈哥斯的子孙和巴西莱的子孙；巴西莱娶了基列人巴西莱的一个女儿为妻，就以他们的名字为名。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“并按他们的名字被称呼”。“他们”是复数，具体所指有解释空间；通常理解为妻子所属的巴西莱家。
    reason: 保留希伯来语被动表达和复数代词，同时不把其所指作超出原文的确定化。
lexical_decisions:
- source_word: וּמִן הַכֹּהֲנִים
  choice: 祭司中有
  rationale: 保留介词 מִן 的部分整体关系，并以自然的现代汉语引出祭司家族名单。
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 在族谱和名册语境中指家族后裔；“子孙”既准确又比逐字的“儿子们”更符合汉语名册表达。
- source_word: חֳבַיָּה
  choice: 哈巴雅
  rationale: 按希伯来语人名音译，并与现代中文圣经人名的常见音译风格协调。
- source_word: הַקּוֹץ
  choice: 哈哥斯
  rationale: 音译祭司家族名，并将原词中的冠词视为传统名字形式的一部分。
- source_word: בַרְזִלַּי
  choice: 巴西莱
  rationale: 同一节中家族先祖与基列人的名字均统一音译为“巴西莱”。
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת בַּרְזִלַּי הַגִּלְעָדִי אִשָּׁה
  choice: 这巴西莱娶了基列人巴西莱的一个女儿为妻
  rationale: 将希伯来语婚娶惯用结构自然译出；“这巴西莱”说明关系从句中的单数人物是前述家族所源出的那位巴西莱，而不把两个同名者混为一人。
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: 并以他们家族的名字为名
  rationale: 保留动词的被动命名含义和复数代词，同时补出汉语所需的“家族”，表明所取的是妻方家族之名。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留名册中三个家族名称的平行结构；后半句用两个同名的“巴西莱”如实呈现原文，并借“这巴西莱”帮助读者辨明人物关系。
