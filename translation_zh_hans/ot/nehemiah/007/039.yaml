  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], nine hundred seventy-three.'
translation:
  language: zh_hans
  text: 祭司：耶大雅的子孙[a]，属耶书亚家[b]，共九百七十三人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子孙”也可指后裔或同一家族谱系的成员，不一定是亲生儿子。
    reason: lexical_alternative
  - marker: b
    text: “耶书亚”也可译作“约书亚”；这里采用“耶书亚”，以反映被掳归回时期所用名字的希伯来语形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 定冠词加复数名词，在名单中引出祭司这一组；简洁译作“祭司”符合现代中文名册体例。
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在族谱和人口登记语境中，此词可指后裔或家族成员，并不只指亲生儿子；“子孙”既保留血统含义，也避免误解为直接儿子。
- source_word: יְדַעְיָה
  choice: 耶大雅
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: לְבֵית יֵשׁוּעַ
  choice: 属耶书亚家
  rationale: בַּיִת与人名连用表示家族或宗族，前置词לְ在此说明归属；“属……家”自然而准确。
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 按该被掳归回时期名字יֵשׁוּעַ的希伯来语形式音译，并与通常译作“约书亚”的较长形式有所区分。
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: 九百七十三人
  rationale: 数词合计为973；中文名单中补出量词“人”，使表达完整自然，并未改变原意。
