  text: 哈难的子孙[a]、基德的子孙、迦哈的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“……的儿子”；这里重复出现的希伯来语族谱用语也可指“后裔”或一个家族，并不只指亲生儿子。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 该词是בֵּן的复数附属形；在这类归回者及圣殿仆役名录中，通常指一个家族或后裔群体，并非仅指亲生儿子。“子孙”既自然，也能准确表达谱系和宗族含义。
- source_word: חָנָן
  choice: 哈难
  rationale: 人名或宗族名，按希伯来语音译；采用现代中文圣经读者较熟悉的形式。
- source_word: גִדֵּל
  choice: 吉德
  rationale: 名录中的人名或宗族名，依希伯来语音译，保留其双写辅音所体现的名称辨识度。
- source_word: גָחַר
  choice: 迦哈
  rationale: 名录中的人名或宗族名，依希伯来语的辅音和元音音译。
