base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/045.yaml
  text: 'The gatekeepers: the sons of Shallum[a], the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, 138.'
translation:
  language: zh_hans
  text: 守门人：沙龙的子孙[a]、亚特的子孙、达们的子孙、亚谷的子孙、哈提他的子孙、朔拜的子孙，共一百三十八人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子孙”所译的希伯来语字面意思是“儿子们”，在这里也可泛指后裔、家族或宗族成员，并不只指亲生儿子。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: 守门人
  rationale: 该词指负责看守门户的人；在本段圣殿服役人员的名单中，“守门人”简洁、自然，也准确表达其职分。
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 本词字面为“儿子们”，但在被掳归回时期的家谱和人口名册中，常泛指某一祖先的后裔、家族或宗族成员。“子孙”既保留谱系关系，也避免误解为仅指亲生儿子。
- source_word: שַׁלּוּם
  choice: 沙龙
  rationale: 按现代中文圣经人名的常见音译处理。
- source_word: אָטֵר
  choice: 亚特
  rationale: 按希伯来语人名音译，并采用简洁、通行的中文形式。
- source_word: טַלְמֹן
  choice: 达们
  rationale: 按现代中文圣经人名的常见形式音译。
- source_word: עַקּוּב
  choice: 亚谷
  rationale: 按现代中文圣经人名的常见形式音译；源语中的双辅音无需在中文中另行标示。
- source_word: חֲטִיטָא
  choice: 哈提他
  rationale: 依希伯来语读音音译，保留末尾元音。
- source_word: שֹׁבָי
  choice: 朔拜
  rationale: 依希伯来语读音音译，并体现词尾的双元音。
- source_word: מֵאָה שְׁלֹשִׁים וּשְׁמֹנָה
  choice: 一百三十八人
  rationale: 希伯来语数词合计为一百三十八；补出量词“人”符合中文人口名册的自然表达，且未增加实质信息。
theological_decisions: []
