  text: 基遍的子孙[a]，九十五名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“基遍的众子”。这里是名册中的惯用说法，可以泛指基遍的后代、家族成员或当地人，并不一定只指亲生儿子。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 这是בֵּן（儿子）的复数构造式。在归回者名册中，它通常是家族或群体称谓，不限于亲生儿子；译作“子孙”既保留谱系表达，也符合现代汉语名册的自然用法。
- source_word: גִבְעוֹן
  choice: 基遍
  rationale: 专有地名，采用现代中文圣经传统中通行的音译“基遍”。此处也可能借地名指来自该地的群体。
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: 九十五名
  rationale: 该数词短语意为九十五；按现代汉语表达为“九十五”，并加量词“名”以明确所数的是人员。
theological_decisions: []
