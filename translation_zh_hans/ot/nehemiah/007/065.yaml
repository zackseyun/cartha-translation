base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/065.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b].
translation:
  language: zh_hans
  text: 省长[a]对他们说：“你们不可吃至圣之物[b]，直到有祭司带着乌陵和土明出现。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“特沙他”，这是波斯行政体系中的一种官职称号。
    reason: lexical_alternative
  - marker: b
    text: 指归类为“至圣”的祭司食物或祭物份额，不是圣殿内的“至圣所”。
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: 省长
  rationale: 这是波斯行政体系中的官职称号，并非人名；译为“省长”既传达职能，也符合现代汉语表达。音译形式在脚注中保留。
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: 你们不可吃
  rationale: 该从句表达省长命令的内容。汉语直接引语比间接转述更自然，“不可”清楚表达上下文中的禁令。
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: 至圣之物
  rationale: 该短语具有最高级含义；结合祭司资格与食用份额的上下文，所指是归类为至圣的祭司食物或祭物，而不是圣所中的至圣所。
- source_word: עַד עֲמֹד הַכֹּהֵן
  choice: 直到有……的祭司出现
  rationale: עַד加不定式表示禁令持续到将来的某一时点。定冠词可作类别性用法，因此用“有……的祭司”避免误指前文已经提到的某位祭司。
- source_word: לְאוּרִים וְתוּמִּים
  choice: 能用乌陵和土明求问
  rationale: 乌陵和土明是传统沿用的祭司求问媒介名称。介词לְ在此可表示相关用途；补出“求问”使现代读者明白其功能，同时不具体规定求问的操作方式或结果。
theological_decisions:
- issue: “至圣之物”的所指
  choice: 祭司可食用的至圣份额或祭物
  alternative: 圣殿中的至圣所
  rationale: 上下文讨论族谱无法确认者是否有资格担任祭司并享用祭司份额，因此这里关乎圣物的食用资格，而非进入至圣所的资格。
- issue: 波斯官衔的译法
  choice: 省长
  alternative: 特沙他（音译）
  rationale: 该词是行政官衔而非专名；正文意译有助于普通读者理解，脚注保留音译及其性质。
- issue: 乌陵和土明与祭司的关系
  choice: 祭司能用乌陵和土明求问
  alternative: 带着乌陵和土明的祭司
  rationale: 原文介词关系简略，可表示祭司拥有或使用乌陵和土明。译文以功能性表达呈现语境所需含义，但不进一步解释其神谕机制。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。正文将间接引语自然转换为直接引语；“至圣之物”保留原文的礼仪性和最高级意味，并用脚注澄清其语境所指。
