    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 在被掳归回后的宗族名录中，该词用于引出家族或宗族谱系；译作“子孙”既自然，也比逐字的“儿子们”更准确地传达此处群体性含义。
- source_word: יַעְלָא
  choice: 雅拉
  rationale: 按本节希伯来文本音译人名；不按可能的词源意义翻译。
- source_word: דַרְקוֹן
  choice: 达昆
  rationale: 按希伯来语读音音译专名。
- source_word: גִדֵּל
  choice: 吉德
  rationale: 按希伯来语读音音译专名，并以简洁、常见的汉语音节呈现。
