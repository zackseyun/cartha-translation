  yaml_path: translation/ot/nehemiah/007/060.yaml
  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: zh_hans
  text: 所有殿役和所罗门仆人的子孙，共三百九十二人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿役”或音译作“尼提宁”，指一类在圣殿服役的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: 所有……共
  rationale: 在人数统计的语境中，כָּל涵盖所列两个群体；用“所有……共”自然引出总数。
- source_word: הַנְּתִינִים
  choice: 殿役
  rationale: 该词指归属于圣殿事务的一类服役人员；“殿役”简洁、清楚，并避免音译对现代读者造成理解障碍。传统音译在脚注中保留。
- source_word: וּבְנֵי עַבְדֵי שְׁלֹמֹה
  choice: 和所罗门仆人的子孙
  rationale: בְנֵי字面为“儿子们”，在群体名录中可涵盖后代，故译“子孙”；עַבְדֵי可指仆人或奴仆，此处作为社会或行政群体的称谓，译“仆人”较中性且自然。
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: 三百九十二人
  rationale: 准确表达希伯来文基数词，并补出汉语人数统计所需的量词“人”。
