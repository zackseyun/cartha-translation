  text: וַ/אֲשֶׁ֣ר נָתְנוּ֮ שְׁאֵרִ֣ית הָ/עָם֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שְׁתֵּ֣י רִבּ֔וֹא וְ/כֶ֖סֶף מָנִ֣ים אַלְפָּ֑יִם וְ/כָתְנֹ֥ת כֹּֽהֲנִ֖ים שִׁשִּׁ֥ים וְ/שִׁבְעָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/071.yaml
  text: And what the rest of the people gave was twenty thousand gold darics[a], two thousand minas of silver[c][b], and sixty-seven priests’ tunics.
translation:
  language: zh_hans
  text: 其余百姓所献的，是两万枚波斯金币[a]、两千弥那的银子[b]，以及六十七件祭司的长衣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “波斯金币”原文为“达利克”（复数），是古代波斯的一种金币。
    reason: cultural_note
  - marker: b
    text: “弥那”是古代的重量单位，也可用来表示相应的货币价值。
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲשֶׁר נָתְנוּ
  choice: 所献的，是
  rationale: 这是承接上文、引出清单项目的关系结构。汉语用“所献的，是”自然地保留其总结和列举功能；在奉献清单的语境中，“献”比单纯的“给”更明确，但不暗示额外的礼仪含义。
- source_word: שְׁאֵרִית הָעָם
  choice: 其余百姓
  rationale: 这里是在行政性清单中区分先前所列的捐献者与其余民众，并非强调具有神学意义的“余民”。
- source_word: זָהָב דַּרְכְּמוֹנִים
  choice: 波斯金币
  rationale: דַּרְכְּמוֹנִים 指波斯时期的一种金币。正文采用普通读者容易理解的类别名称，具体历史名称置于脚注。
- source_word: שְׁתֵּי רִבּוֹא
  choice: 两万枚
  rationale: 按现代汉语数字表达译为“两万”；“枚”用于计数金币。
- source_word: וְכֶסֶף מָנִים אַלְפָּיִם
  choice: 两千弥那银子
  rationale: 保留古代重量兼货币价值单位“弥那”，不强行换算为现代重量或币值，以免制造虚假的精确性。
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: 祭司的袍子
  rationale: כָּתְנֹת 指长衣、袍子一类衣物；此处以自然汉语表达所属关系，不额外断定其具体礼仪样式。
- source_word: שִׁשִּׁים וְשִׁבְעָה
  choice: 六十七件
  rationale: 采用现代汉语标准数字形式，并加入适合衣物的量词“件”。
theological_decisions:
- issue: שְׁאֵרִית 是否译作具有神学色彩的“余民”
  choice: 其余百姓
  alternative: 百姓中的余民
  rationale: 本节是捐献数目的行政性清单，语境指先前所列捐献者之外的其余民众；采用“余民”容易引入原文在此处未必强调的神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留古代单位“弥那”，并以脚注解释；将较陌生的币名“达利克”在正文中意译为“波斯金币”，脚注补出专名。所有脚注标记均置于相关词语之后。
