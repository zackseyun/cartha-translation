revisions:
- from: 其余百姓所献的，是两万枚波斯金币[a]、两千弥那银子[b]，以及六十七件祭司的袍子。
  to: 其余百姓所献的，是两万枚波斯金币[a]、两千弥那的银子[b]，以及六十七件祭司的长衣。
  rationale: 修订仅澄清银的单位关系，并将“袍子”调整为更贴近כָּתְנֹת的“长衣”。其余百姓、数额、达利克的历史说明及弥那的保留均维持原译处理。
  reviewer_model: gpt-5.6-terra
