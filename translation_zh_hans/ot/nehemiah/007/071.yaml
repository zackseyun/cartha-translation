    issue: “祭司的袍子”对כָּתְנֹת的衣物类型略显宽泛。
    rationale: כָּתְנֹת通常指贴身或及膝、及踝的长衣／内袍（tunic），并不必然是汉语“袍子”常联想的外袍。改作“祭司的长衣”更稳妥，且不额外断定其礼仪用途。
  - severity: low
    issue: “两千弥那银子”中单位与银的修饰关系略可更明晰。
    rationale: “两千弥那的银子”在现代汉语中更清楚地表示两千弥那这一单位量的银，同时不改变原文的语义。
