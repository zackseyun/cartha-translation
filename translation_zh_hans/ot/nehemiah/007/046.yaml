  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[b], the sons of Tabbaoth.'
translation:
  language: zh_hans
  text: 殿役[a]：西哈的子孙、哈苏法[b]的子孙、答巴俄的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿役”是指被指派从事圣殿事务的一类人；希伯来语传统音译为“尼提宁”。
    reason: lexical_alternative
  - marker: b
    text: “哈苏法”也可音译为“哈舒法”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: 殿役
  rationale: 这是被指派从事圣殿事务的一类人的专称。“殿役”简洁地表达其职分，也比单纯音译更便于现代读者理解；传统音译“尼提宁”收入脚注。
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 在家族名录中，此词引出某位祖先所属的后裔群体。“子孙”既贴近字面“儿子们”，又符合现代汉语族谱和名单的表达习惯。
- source_word: צִחָא
  choice: 西哈
  rationale: 按希伯来语专名音译，并采用简明、常见的中文音节对应。
- source_word: חֲשֻׂפָא
  choice: 哈苏法
  rationale: 按马所拉文本所标示的辅音和元音音译；另有受传统拼写影响的音译，收入脚注。
- source_word: טַבָּעוֹת
  choice: 答巴俄
  rationale: 按希伯来语专名音译，保留中间辅音的加强音感，并以自然的中文音节呈现。
