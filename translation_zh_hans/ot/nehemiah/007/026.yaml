  text: 伯利恒和尼陀法的人，共一百八十八名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: 人
  rationale: 这是 אִישׁ 的复数附属形，在人口与归回名单中常用来指某地的人。中文用“人”既符合名单语体，也不必机械限定为成年男子；脚注保留其字面形式。
- source_word: בֵית לֶחֶם
  choice: 伯利恒
  rationale: 地名采用现代中文圣经传统中通行且易识别的音译。
- source_word: וּנְטֹפָה
  choice: 和尼陀法
  rationale: 连词 וּ 表示并列；“尼陀法”采用通行音译。原文把伯利恒与尼陀法合列，并只给出一个总数，因此保持简单并列。
- source_word: מֵאָה שְׁמֹנִים וּשְׁמֹנָה
  choice: 一百八十八名
  rationale: 准确表达希伯来文基数188；“名”自然承接人员统计名单，“共”表明这是前述两地合计，但不改变原意。
