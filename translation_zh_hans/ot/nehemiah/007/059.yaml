  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pochereth-hazzebaim[b], the sons of Amon.
translation:
  language: zh_hans
  text: 示法提雅的子孙[a]、哈替的子孙、玻黑列哈斯巴音的子孙[b]、亚们的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节各处“……的子孙”也可理解为“……的后代”或“……家族的人”；希伯来语直译为“……的众子”，在族谱和名册中常泛指一个家系。
    reason: lexical_alternative
  - marker: b
    text: “玻黑列哈斯巴音”也可译作“洗巴音的玻黑列”；这里将希伯来语形式作为一个专名音译。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 这是 בֵּן 的复数附属形。在归回者的家族名册中，所指通常是某人的后裔或家族成员，不限于亲生儿子；译作“子孙”既符合现代汉语名册用法，也保留家系含义。
- source_word: שְׁפַטְיָה
  choice: 示法提
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: חַטִּיל
  choice: 哈替
  rationale: 此处是人名或家族名，依希伯来语音译，不按可能的词源意义翻译。
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: 波黑列·哈洗巴音
  rationale: 整组词在名单中用作家族名称；以间隔号连接两个音译成分，既保存希伯来语形式，又表明二者共同构成一个名称。
- source_word: אָמֽוֹן
  choice: 亚们
  rationale: 此处是名单中的人名或家族名，按希伯来语 אָמוֹן 音译；不把它解释为普通名词或神学术语。
