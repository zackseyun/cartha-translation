  text: 迦散的子孙[a]、乌撒的子孙、巴西亚的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子孙”也可译为“儿子”；这里的希伯来语家谱用语也可以泛指后代或家族成员。本节其余两处相同。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 这是בֵּן（儿子）的复数构造形式；在家谱和名册中常泛指某人的后代或家族成员。“……的子孙”既符合现代汉语名册体例，也保留了家系含义。
- source_word: גַזָּם
  choice: 迦散
  rationale: 人名按现代中文圣经常用形式音译；对应希伯来语Gazzam。
- source_word: עֻזָּא
  choice: 乌撒
  rationale: 人名按现代中文圣经常用形式音译；对应希伯来语Uzza。
- source_word: פָסֵחַ
  choice: 巴西亚
  rationale: 人名按现代中文圣经常用形式音译；对应希伯来语Paseah。
