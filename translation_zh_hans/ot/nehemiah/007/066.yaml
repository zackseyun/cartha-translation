lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: 全会众
  rationale: כָּל 与带定冠词的 הַקָּהָל 合用，涵盖整个聚集的群体；“全会众”简洁、庄重，也适合名单与人口统计的语境。
- source_word: כְּאֶחָד
  choice: 合计
  rationale: 字面为“如同一个”或“作为一个整体”。在本节的数字汇总中，表示把全体作为一个总数计算；“合计”符合现代汉语表达，并保留统计语境。
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת וְשִׁשִּׁים
  choice: 四万二千三百六十人
  rationale: 希伯来文依次为“四个万、二千、三百和六十”，总数即四万二千三百六十；补出量词“人”使汉语自然清楚。
