- source_word: שֵׁשׁ מֵאוֹת חֲמִשִּׁים וַחֲמִשָּׁה
  choice: 六百五十五人
  rationale: 希伯来语直陈人数为“六百、五十又五”；现代汉语合并为“六百五十五”，并补出量词“人”，使名册句式自然清楚。
