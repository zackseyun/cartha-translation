  text: הַ/בָּאִ֣ים עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְחֶמְיָ֡ה עֲ֠זַרְיָה רַֽעַמְיָ֨ה נַחֲמָ֜נִי מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפֶּ֥רֶת בִּגְוַ֖י נְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/007.yaml
  text: 'those who came with Zerubbabel were Jeshua[a], Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, and Baanah[c][b]. The number of the men of the people of Israel:'
translation:
  language: zh_hans
  text: 与所罗巴伯一同来的是：耶书亚、尼希米、亚撒利雅、拉米雅[a]、拿哈玛尼、末底改、必珊、米斯毗列、比革瓦伊、尼宏[b]和巴拿。以色列民中男子的数目[c]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在以斯拉记2:2的平行名单中，这个名字作“利来雅”。
    reason: alternative_reading
  - marker: b
    text: 在以斯拉记2:2的平行名单中，这个名字作“利宏”。
    reason: alternative_reading
  - marker: c
    text: 这句话引出从下一节开始的统计数目。
    reason: cross_reference
lexical_decisions:
- source_word: הַבָּאִים עִם
  choice: 与……一同来的是
  rationale: 带定冠词的分词作名词使用，指特定的一群人；译为自然的现代汉语关系结构，同时保留“与……同来”的伴随含义。
- source_word: זְרֻבָּבֶל
  choice: 所罗巴伯
  rationale: 采用现代中文圣经读者熟悉的标准人名译法。
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 按以斯拉—尼希米记语境采用通行音译，以区别通常译作“约书亚”的其他同名人物。
- source_word: רַעַמְיָה
  choice: 拉米雅
  rationale: 依本节马所拉文本的人名形式音译；不与以斯拉记2:2的不同形式协调。
- source_word: נַחֲמָנִי
  choice: 拿哈玛尼
  rationale: 依马所拉文本的读音音译该专名。
- source_word: מִסְפֶּרֶת
  choice: 米斯毗列
  rationale: 采用中文圣经传统中较为熟悉的专名音译，同时将其作为人名而非普通名词处理。
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: 以色列民中男子的数目如下
  rationale: 保留אַנְשֵׁי明确的阳性复数“男子”，并用“如下”自然引出从下一节开始的统计名单。
theological_decisions:
- issue: אַנְשֵׁי עַם יִשְׂרָאֵל中的性别用语
  choice: 以色列民中男子的数目
  alternative: 以色列民的数目
  rationale: 原文明确使用“男子”一词；保留这一表达是出于原文准确性，并不额外断定妇女是否属于归回群体。
- issue: 与以斯拉记2:2平行名单不同的人名形式
  choice: 正文依尼希米记马所拉文本译作“拉米雅”和“尼宏”
  alternative: 按以斯拉记2:2译作“利来雅”和“利宏”
  rationale: 以当前经节的希伯来文本为准，不在正文中将两处平行名单强行协调；差异留在脚注中说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。人名以中文圣经读者较熟悉的传统音译为主；句法保持名单引言的简洁性。脚注标记分别紧跟其所解释的人名或引介句，避免英文咨询层中标记位置可能造成的歧义。
