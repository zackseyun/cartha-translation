base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/070.yaml
  text: 'And some of the heads of the fathers’ houses gave to the treasury for the work: twenty thousand gold darics and two thousand two hundred minas of silver[a][b][c].'
translation:
  language: zh_hans
  text: 有些宗族的族长捐给工程的库房两万达利克金币[a]和两千二百弥那银子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “达利克”是古代波斯的一种金币。
    reason: cultural_note
  - marker: b
    text: “弥那”是古代的重量单位，也可引申为按重量计算的货币价值。
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: 有些宗族的族长
  rationale: 介词מִן在此表示“从……中”，按汉语习惯译为“有些”；רָאשֵׁי הָאָבוֹת指以父系祖先家族为单位的首领，用“宗族的族长”保留其宗族—行政含义，同时自然易懂。
- source_word: נָתְנוּ
  choice: 捐献了
  rationale: 基本义是“给”；在为工程库房提供金银的语境中，“捐献”自然表达自愿贡献，而不额外规定其礼仪性质。
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: 为这工程的库房
  rationale: אוֹצָר是存放财物的库房，הַמְּלָאכָה指上下文中的工程；此译保留“库房”与“工程”的关系，并避免误解为抽象财政机构。
- source_word: דַּרְכְּמוֹנִים
  choice: 大流士金币
  rationale: 该词指波斯达利克金币；“大流士金币”是现代汉语中较易理解且能保留历史特指的名称，并以脚注解释。
- source_word: שְׁתֵּי רִבּוֹת
  choice: 两万枚
  rationale: 字面为“两个万”；结合金币采用汉语量词“枚”。
- source_word: מָנִים
  choice: 弥那
  rationale: 保留古代重量及货币计量单位的历史名称，不换算成不精确的现代单位，并以脚注说明。
- source_word: אַלְפַּיִם וּמָאתָיִם
  choice: 两千二百
  rationale: 按现代汉语数词习惯直译。
