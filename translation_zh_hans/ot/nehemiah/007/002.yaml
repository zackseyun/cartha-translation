  text: וָ/אֲצַוֶּ֞ה אֶת חֲנָ֣נִי אָחִ֗/י וְ/אֶת חֲנַנְיָ֛ה שַׂ֥ר הַ/בִּירָ֖ה עַל יְרוּשָׁלִָ֑ם כִּי הוּא֙ כְּ/אִ֣ישׁ אֱמֶ֔ת וְ/יָרֵ֥א אֶת הָ/אֱלֹהִ֖ים מֵ/רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/002.yaml
  text: Then I appointed my brother Hanani and Hananiah[a], the commander of the fortress, over Jerusalem[b], because he was a faithful man and feared God more than many.
translation:
  language: zh_hans
  text: 我委任我的兄弟哈拿尼和堡垒的长官哈拿尼雅管理耶路撒冷；因为他[a]是个忠信的人，比许多人更敬畏上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“他”，最自然地指哈拿尼雅；也有人认为，这项称许更广泛地说明了这次任命的理由。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: 委派
  rationale: צוה通常表示“吩咐”，但在这里带人名宾语及表示管辖范围的עַל，语境是授予职责；“委派”自然地表达行政任命的功能。
- source_word: חֲנָנִי אָחִי
  choice: 我的弟兄哈拿尼
  rationale: 忠实表达אָחִי的第一人称单数所属关系，并采用自然的现代汉语语序。
- source_word: חֲנַנְיָה
  choice: 哈拿尼雅
  rationale: 按希伯来语人名音译。
- source_word: שַׂר הַבִּירָה
  choice: 堡垒长
  rationale: שַׂר指主管、长官，בִּירָה指设防的堡垒或城堡建筑群；“堡垒长”简洁表达其行政兼军事职分。
- source_word: עַל יְרוּשָׁלַ͏ִם
  choice: 一同管理耶路撒冷
  rationale: עַל接在委派语境之后，表示对耶路撒冷负有管辖责任；“管理”在现代汉语中清楚自然，“一同”说明两人同受委派而不把后续单数评价改为复数。
- source_word: כִּי הוּא
  choice: 因为哈拿尼雅
  rationale: כִּי引出委派的理由；希伯来语单数代词最自然地回指较近的先行词哈拿尼雅。正文明确名字以免汉语“他”产生不必要的指代模糊，同时用脚注保留句法上的讨论空间。
- source_word: כְּאִישׁ אֱמֶת
  choice: 是个忠信的人
  rationale: אֱמֶת在品格和任职语境中表示可靠、忠实；“忠信”兼顾可信与忠诚，也保留原文较庄重的伦理意味。
- source_word: וְיָרֵא אֶת־הָאֱלֹהִים
  choice: 敬畏上帝
  rationale: 直接保留圣经中“敬畏上帝”的表达，指对上帝怀有敬重与畏惧。
- source_word: מֵרַבִּים
  choice: 胜过许多人
  rationale: 比较介词מִן与רַבִּים构成“比许多人更……”；“胜过许多人”保留比较范围，不收窄为“胜过大多数人”。
theological_decisions:
- issue: 评价从句中单数代词的所指
  choice: 正文将其主要理解为哈拿尼雅，并保留脚注说明
  alternative: 把这一评价理解为对两人任命的概括性支持
  rationale: 希伯来语的单数代词和单数谓语最自然地指向最近的单数先行词哈拿尼雅，但上下文是在说明两人共同受任命，因此不应把另一种理解完全排除。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“堡垒长”简明呈现职务；“忠信”保留אֱמֶת兼具可靠与忠诚的含义。正文仅设[a]，且标记已在相应人名后出现。
