  language: zh_hans
  text: 歌唱者：亚萨的子孙[a]，一百四十八人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚萨的儿子们”。希伯来语“……的儿子们”也可指其后裔、家族成员或所属群体的成员，并不只指亲生儿子。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: 歌唱者
  rationale: 该词是动词“歌唱”的分词名词化形式，指负责歌唱的人；“歌唱者”准确、自然，也避免用范围更广的“乐师”。
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在族谱和群体名册中，该词虽字面为“儿子们”，却常指后裔、家族成员或同一传统群体中的成员；此处“子孙”符合名册语境，同时以脚注保留“儿子”的形式对应。
- source_word: אָסָף
  choice: 亚萨
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: מֵאָה אַרְבָּעִים וּשְׁמֹנָה
  choice: 一百四十八人
  rationale: 希伯来文数字明确；中文补出量词“人”，使人口名册中的总数表达自然清楚。
