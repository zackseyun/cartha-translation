base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/069.yaml
  text: And some of the heads of the fathers’ houses gave to the work[a]. The governor gave to the treasury one thousand gold darics, fifty basins[c][b], and five hundred thirty-five priests’ tunics.
translation:
  language: zh_hans
  text: 父系家族的首领中，有些人为这项工程捐献。省长[a]捐入库房一千枚达利克金币[b]、五十个盆，以及五百三十五件祭司袍[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“提尔沙他”；这是波斯行政体系中的官衔。
    reason: lexical_alternative
  - marker: b
    text: 达利克是波斯金币。
    reason: cultural_note
  - marker: c
    text: 《以斯拉记》2:69的平行记载作“一百件祭司袍”；有些译本依照该平行经文或不同的文本传统调整了这里的数字。
    reason: textual_variant
lexical_decisions:
- source_word: וּמִקְצָת רָאשֵׁי הָאָבוֹת
  choice: 各宗族的首领中，有些人
  rationale: 以自然的现代汉语保留 מִקְצָת 的部分含义；רָאשֵׁי הָאָבוֹת 是被掳归回时期宗族或父系家族的首领。
- source_word: לַמְּלָאכָה
  choice: 为这项工程
  rationale: מְלָאכָה 在此指当时共同承担的建设工作；“工程”比孤立的“工作”更符合捐献语境。
- source_word: הַתִּרְשָׁתָא
  choice: 省长
  rationale: 这是波斯行政体系中的官衔；正文译出职务以便读者理解，音译形式放入脚注。
- source_word: לָאוֹצָר
  choice: 捐入库房
  rationale: אוֹצָר 可指库房或财库；上下文列举贵重捐献，“库房”既保留存放之意，也不把其范围限定为现金财库。
- source_word: זָהָב דַּרְכְּמֹנִים אֶלֶף
  choice: 一千枚达利克金币
  rationale: דַּרְכְּמֹנִים 在波斯时期语境中指达利克金币；译出币名并加“枚”，兼顾历史准确性和汉语可读性。
- source_word: מִזְרָקוֹת
  choice: 盆
  rationale: 该词指礼仪中使用的盆或碗状器皿；原文此处没有进一步说明用途，故不增译为“洒血盆”。
- source_word: כָּתְנוֹת כֹּהֲנִים
  choice: 祭司袍
  rationale: כָּתְנוֹת 指长衣、袍服一类衣物；“祭司袍”简明表达这是供祭司穿着的衣袍。
- source_word: שְׁלֹשִׁים וַחֲמֵשׁ מֵאוֹת
  choice: 五百三十
  rationale: 马所拉文本的数词结构是“三十和五百”，即五百三十；不采用咨询层误列的“五百三十五”。
