lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 该词是בֵּן的复数附属形；在这份家族名录中表示后裔或家族成员。译作“子孙”既符合现代汉语的族谱语境，也避免把所指范围不必要地限于亲生儿子。
- source_word: רְאָיָה
  choice: 利亚
  rationale: 按希伯来语专名音译，并采用中文圣经传统中较通行的形式。
- source_word: רְצִין
  choice: 利汛
  rationale: 按希伯来语专名音译，并采用中文圣经传统中较通行的形式。
- source_word: נְקוֹדָא
  choice: 尼哥大
  rationale: 按希伯来语专名音译，并采用中文圣经传统中较通行的形式。
