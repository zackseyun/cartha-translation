base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/057.yaml
  text: 'The sons of Solomon’s servants: the sons of Sotai[a], the sons of Sophereth[b], the sons of Perida.'
translation:
  language: zh_hans
  text: 所罗门仆人的后裔：琐太的子孙、琐斐列的子孙、比利大的子孙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: 后裔／子孙
  rationale: 在归回者名册中，该词通常指家族谱系或宗族成员，不限于亲生儿子。总称用“后裔”，各家族则用中文名册体中自然的“子孙”表达。
- source_word: עַבְדֵי
  choice: 仆人
  rationale: עַבְדֵי שְׁלֹמֹה在此是世袭群体的称谓；“仆人”既符合上下文，也避免在证据不足时强化为“奴隶”。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: סוֹטַי
  choice: 琐太
  rationale: 按马所拉读音转写，并采用现代中文圣经人名的常见形式。
- source_word: סוֹפֶרֶת
  choice: 琐斐列
  rationale: 此处是家族名，故按专名音译，不按与书写或计数相关的词根意译。
- source_word: פְרִידָא
  choice: 比利大
  rationale: 按马所拉元音所反映的专名读音音译，末尾元音以“大”表示。
theological_decisions: []
