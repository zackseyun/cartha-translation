lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在归回者名册和族谱语境中，בְּנֵי 常指某人的后裔或某一宗族的成员，而非仅指亲生儿子；“子孙”既自然，也准确表达家族谱系。
- source_word: אָטֵר
  choice: 亚特
  rationale: 人名或宗族名，按现代中文圣经人名惯例音译。
- source_word: לְחִזְקִיָּה
  choice: 就是希西家这一支
  rationale: 前缀 לְ 在此很可能表示归属或宗族中的分支；这一译法使名单结构在现代汉语中清楚可懂，同时不把“亚特”与“希西家”的确切关系解释得过死。
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: 九十八人
  rationale: 按现代汉语表达基数，并根据人口名册语境补出量词“人”。
