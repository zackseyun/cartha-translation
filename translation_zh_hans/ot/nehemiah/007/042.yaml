- source_word: בְּנֵי
  choice: 子孙
  rationale: 在家谱和人口登记名单中，该词常指某一祖先的后裔或家族成员；译作“子孙”比字面的“儿子们”更符合现代汉语习惯，同时保留家族谱系含义。
- source_word: חָרִם
  choice: 哈琳
  rationale: 这是人名或家族名，按希伯来语读音音译；“哈琳”也与现代中文圣经中常见的译名形式相符。
- source_word: אֶלֶף שִׁבְעָה עָשָׂר
  choice: 一千零十七人
  rationale: 希伯来语数词表示一千零十七；中文正文采用汉字数字，并补出量词“人”，使人口名册的表达自然清楚。
