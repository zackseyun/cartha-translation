  text: ו/יאמר לָ/הֶ֗ם לֹ֣א יִפָּֽתְח֞וּ שַׁעֲרֵ֤י יְרוּשָׁלִַ֨ם֙ עַד חֹ֣ם הַ/שֶּׁ֔מֶשׁ וְ/עַ֨ד הֵ֥ם עֹמְדִ֛ים יָגִ֥יפוּ הַ/דְּלָת֖וֹת וֶ/אֱחֹ֑זוּ וְ/הַעֲמֵ֗יד מִשְׁמְרוֹת֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם אִ֚ישׁ בְּ/מִשְׁמָר֔/וֹ וְ/אִ֖ישׁ נֶ֥גֶד בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/003.yaml
  text: And I said to them[a], “The gates of Jerusalem must not be opened until the sun is hot. While they are still standing guard, let them shut the doors and fasten them. And appoint guards from the inhabitants of Jerusalem[c][b], each at his watch and each opposite his own house.”
translation:
  language: zh_hans
  text: 我对他们说：“耶路撒冷的城门，要等到日头晒得很热[a]才可打开。他们还在站岗的时候，就要把门关上，并闩牢[b]。要从耶路撒冷的居民中派定守卫[c]；每个人按自己的岗位值守，也在自己房屋的对面值守。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“等到日头变热”；意思是不在日出时立刻开门，而要等到早晨较晚的时候。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“抓住它们”或“使它们固定”；这里指关门后将门闩牢、固定妥当。
    reason: lexical_alternative
  - marker: c
    text: 或译“要从耶路撒冷的居民中安排守卫班次”。希伯来语这个词既可指守卫人员，也可指守卫的班次或任务。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפָּתְחוּ
  choice: 才可打开
  rationale: 该词为被动形态，配合否定禁令，表示在规定时间以前不可开门；汉语用“要等到……才可打开”自然体现这一限制。
- source_word: עַד חֹם הַשֶּׁמֶשׁ
  choice: 等到太阳晒热了
  rationale: 保留“太阳变热、发热”的具体意象，不将其直接解释成“天大亮”或“日上三竿”。
- source_word: וְעַד הֵם עֹמְדִים
  choice: 他们还在站岗的时候
  rationale: עֹמְדִים 字面为“站立”，在城门守卫语境中指仍在岗位上值守。
- source_word: יָגִיפוּ הַדְּלָתוֹת
  choice: 把门关上
  rationale: הגיף 在此指关闭城门的门扇；“把门关上”符合现代汉语表达。
- source_word: וֶאֱחֹזוּ
  choice: 闩牢
  rationale: אחז 字面有“抓住、使固定”之意；紧接关门动作时，表示将门固定、确保关闭。“闩牢”准确传达实际功能，同时脚注说明原文措辞。
- source_word: וְהַעֲמֵיד מִשְׁמְרוֹת
  choice: 派人守卫
  rationale: העמיד 表示使站立、安置或指派；מִשְׁמְרוֹת 可指守卫人员，也可指守卫班次或任务。正文采用自然且符合语境的“派人守卫”。
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: 从耶路撒冷的居民中
  rationale: 表达守卫人员取自城中居民这一部分关系。
- source_word: אִישׁ בְּמִשְׁמָרוֹ
  choice: 各守自己的岗位
  rationale: אִישׁ 在此为逐一分配用法；מִשְׁמָר可指各人的守卫职责或岗位。
- source_word: וְאִישׁ נֶגֶד בֵּיתוֹ
  choice: 各守在自己房屋对面
  rationale: 保留 נֶגֶד 的空间含义“在……对面／前面”，不将具体位置泛化为“附近”。
