lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ……的人
  rationale: 这是 אִישׁ 的复数附属形，字面为“……的男人”，在此按地点界定被数点的群体。汉语“……的人”自然、准确，也不额外限定为居民。
- source_word: בֵית אֵל
  choice: 伯特利
  rationale: 采用现代中文圣经中通行的地名音译，不按词源直译为“上帝之家”。
- source_word: וְהָעָי
  choice: 和艾城
  rationale: וְ 表示“和”；עַי 是地名。采用中文通行译名“艾城”，其中“城”属于惯用地名形式，并非另加原文没有的群体信息。
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: 一百二十三名
  rationale: 准确保留人数；量词“名”符合现代汉语人口名册语境。
