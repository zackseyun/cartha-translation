  text: 第莱雅的子孙、多比雅的子孙、尼哥大的子孙，共六百四十二人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 在户籍和宗族名单中，该词指以某位先祖为名的家族成员；译作“子孙”比“儿子”更能自然表达跨代宗族关系，同时保留重复的名单结构。
- source_word: דְלָיָה
  choice: 第莱雅
  rationale: 人名按现代中文圣经常用音译处理。
- source_word: טוֹבִיָּה
  choice: 陀比雅
  rationale: 人名采用现代中文读者熟悉的常用音译。
- source_word: נְקוֹדָא
  choice: 尼哥大
  rationale: 人名采用现代中文圣经常见音译，与本名单中的家族名称相协调。
- source_word: שֵׁשׁ מֵאוֹת וְאַרְבָּעִים וּשְׁנָיִם
  choice: 共六百四十二人
  rationale: 准确表达总数；补出原文语境中隐含的“人”，并以“共”自然衔接前三个家族名称。
theological_decisions: []
translation_notes:
