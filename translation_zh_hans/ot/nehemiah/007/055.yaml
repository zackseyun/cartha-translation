  text: the sons of Barkos[a], the sons of Sisera, the sons of Temah.
translation:
  language: zh_hans
  text: 巴可斯的子孙、西西拉的子孙、答玛的子孙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 这是בֵּן的复数附属形式；在归回者名录中表示某一家族或宗族成员。译作“子孙”比逐字的“儿子们”更符合现代汉语名录语境，同时保留血缘家族的含义。
- source_word: בַרְקוֹס
  choice: 巴可斯
  rationale: 专名按希伯来语音译；首音节元音为a，末尾保留-s音。
- source_word: סִיסְרָא
  choice: 西西拉
  rationale: 专名按希伯来语音译，并采用现代中文圣经中对该名字常见的译名。
- source_word: תָמַח
  choice: 答玛
  rationale: 专名按马所拉读音Tāmaḥ音译；末尾喉音ח不在现代汉语中另加音节。英文注释所列“Tamah”只是拉丁字母转写差异，在中文音译中不会形成有意义的不同译名。
theological_decisions: []
