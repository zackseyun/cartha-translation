  language: zh_hans
  text: 巴洗律的子孙、米希大的子孙、哈沙的子孙——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 在归回者名录中，该词用于引出家族或宗族，而非仅指某人的亲生儿子；译作“子孙”既符合现代汉语，也保留血缘群体的含义。
- source_word: בַצְלִית
  choice: 巴悉
  rationale: 这是专名，按希伯来语形式音译；采用现代中文圣经读者较易识别的译名“巴悉”。
- source_word: מְחִידָא
  choice: 米希大
  rationale: 这是专名，按希伯来语辅音和元音音译为“米希大”。
- source_word: חַרְשָׁא
  choice: 哈沙
  rationale: 此处作为家族祖先的专名使用，故音译为“哈沙”，不按其可能的普通词词义翻译。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的名录体。三个并列成分均用“……的子孙”，清楚呈现希伯来文反复出现的 בְּנֵי；句末破折号承接后续名单。
