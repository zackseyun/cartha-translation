  language: zh_hans
  text: 拉玛和迦巴[a]的人，共六百二十一名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“迦巴”。有些译本受《以斯拉记》2:26平行名单影响，或因相似地名容易混淆，译作“基比亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ……的人
  rationale: 这是 אִישׁ 的复数构造形式，在人口名册中指与这些城镇相关的人员。现代汉语用“……的人”自然简洁；句末加“名”表达人数，同时不额外限定其身份。
- source_word: הָרָמָה
  choice: 拉玛
  rationale: 按希伯来语地名音译，并采用现代中文圣经中通行且易辨认的形式。
- source_word: וָגָבַע
  choice: 和迦巴
  rationale: 马所拉文本为 גבע，对应“迦巴”，而不是拼写为 גבעה 的“基比亚”；正文依现存希伯来文本翻译。
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: 六百二十一名
  rationale: 按希伯来语基数准确译出；“名”符合现代汉语统计人数的表达。
theological_decisions: []
