  text: the sons of Pahath-moab[a], of the sons of Jeshua and Joab, 2,818.
translation:
  language: zh_hans
  text: 巴哈·摩押的子孙[a]，就是耶书亚和约押的子孙，共二千八百一十八人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“儿子们”。这里的希伯来语通常泛指一个家族的后裔，并不只是亲生儿子。
    reason: 说明宗族名册中 בְּנֵי 的宽泛谱系含义及其直译形式。
lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在归回者名册的宗族语境中，该词指家族或后裔群体，并非仅指亲生儿子；“子孙”既自然，也准确传达其宽泛含义。
- source_word: פַחַת מוֹאָב
  choice: 巴哈·摩押
  rationale: 这是专名，采用音译；用间隔号标明复合名称的两个部分。
- source_word: לִבְנֵי
  choice: 就是……的子孙
  rationale: 前缀 ל 在此说明巴哈·摩押宗族中的支系；“就是”使同位或次级分类关系在中文中清楚，同时不把关系过度限定为严格的父子关系。
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 按此处较短的希伯来名字形式音译，以区别于完整形式“约书亚”。
- source_word: וְיוֹאָב
  choice: 和约押
  rationale: 保留简单并列关系，并采用通行的中文圣经人名译法。
- source_word: אַלְפַּיִם וּשְׁמֹנֶה מֵאוֹת שְׁמֹנָה עָשָׂר
  choice: 共二千八百一十八人
  rationale: 准确表达人数；补出量词“人”符合中文名册行文，“共”自然引出统计数目。
theological_decisions: []
