  text: the sons of another Elam[a], 1,254.
translation:
  language: zh_hans
  text: 另一个以拦的子孙[a]，共1,254人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “另一个以拦”是为了与本章前面所列的以拦相区别；原文也可理解为“别的以拦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 该词为“儿子”的复数构造形式；在回归者家族名册中指某祖先或家族的后裔。译作“子孙”既保留亲属联系，也比逐字译作“儿子们”更符合现代汉语。
- source_word: עֵילָם
  choice: 以拦
  rationale: 专名，按现代中文圣经中通行的音译处理；此处用作家族或祖先之名。
- source_word: אַחֵר
  choice: 另一个
  rationale: 该形容词可表示“另一个”或“别的”。这里用来区分本条的以拦与本章较早出现的以拦，译作“另一个”既自然，也不把二者关系解释得过死。
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254人
  rationale: 原文依次为“一千、二百、五十和四”。名册中采用阿拉伯数字便于阅读，并补出量词“人”，不改变人数。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语名册体。“共”与量词“人”为汉语表达所需的适度补充；保留“另一个”的措辞，以呈现原文אַחֵר的区分作用和一定的开放性。
