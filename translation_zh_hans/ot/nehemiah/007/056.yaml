- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 该词字面可指“儿子们”，但在被掳归回者的宗族名册中是表示家系或后裔群体的固定用语。译作“子孙”既符合现代汉语名册的自然表达，也保留其群体与家系含义。
- source_word: נְצִיחַ
  choice: 尼细亚
  rationale: 这是人名，按希伯来语 נְצִיחַ 的读音音译；采用现代中文圣经读者较易辨认的形式。
- source_word: חֲטִיפָא
  choice: 哈提法
  rationale: 这是家系名册中的人名，按希伯来语 חֲטִיפָא 音译，并用自然、易读的现代汉语字形表示。
