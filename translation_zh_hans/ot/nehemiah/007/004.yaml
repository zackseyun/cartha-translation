  yaml_path: translation/ot/nehemiah/007/004.yaml
  text: The city was wide and large[a], but the people within it were few, and no houses had been built.
translation:
  language: zh_hans
  text: 这座城宽阔广大[a]，但城里的人很少，也没有房屋建成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这座城宽阔广大，城里的人很少，也没有房屋建成。”希伯来文采用较直接的并列结构。
    reason: 保留原文连接词所容许的较形式对应译法；正文用“但”自然表达上下句之间的反差。
lexical_decisions:
- source_word: וְהָעִיר
  choice: 这城
  rationale: הָעִיר意为“这城／那城（即上下文所说的城）”；句首וְ主要承接叙事，现代汉语无需机械译作“并且”。
- source_word: רַחֲבַת יָדַיִם
  choice: 宽阔
  rationale: 该习语字面为“双手宽广”，实际形容空间宽广；译作“宽阔”自然清楚。
- source_word: וּגְדוֹלָה
  choice: 广大
  rationale: גָּדוֹל在此描述城的规模，与“宽阔”并列，不是指地位尊贵。
- source_word: וְהָעָם מְעַט בְּתוֹכָהּ
  choice: 但城里的人很少
  rationale: מְעַט表示数量少；“但”明确呈现大城与少数居民之间的语意反差，同时脚注保留希伯来文较直接的并列结构。
- source_word: וְאֵין בָּתִּים בְּנוּיִם
  choice: 也没有建成的房屋
  rationale: אֵין表达不存在，בְנוּיִם是“建造”的被动分词。“建成的房屋”贴近原文，不擅自加入“重建”的含义。
theological_decisions: []
