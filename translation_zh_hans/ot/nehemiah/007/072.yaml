  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֡ם וְ/הַ/שּׁוֹעֲרִים֩ וְ/הַ/מְשֹׁרְרִ֨ים וּ/מִן הָ/עָ֧ם וְ/הַ/נְּתִינִ֛ים וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶ֑ם וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/072.yaml
  text: So the priests[a], the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel lived in their cities. And when the seventh month arrived[b], the sons of Israel were in their cities.
translation:
  language: zh_hans
  text: 于是，祭司、利未人、守门人、歌唱者、一些百姓、圣殿仆役[a]和全体以色列人都住在各自的城里。第七个月来到时，以色列人[b]在各自的城里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“尼提宁人”，这是这一类圣殿仆役名称的传统音译。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“以色列的儿子们”；这里是指以色列民族整体，亦可译为“以色列民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: 住
  rationale: 在安置、定居的语境中，ישׁב表示居住；“住”自然简明，也保留了在各自城邑居住的意思。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: כהנים的标准汉语译法。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 保留这一支派及圣殿职分群体的惯用名称。
- source_word: הַשּׁוֹעֲרִים
  choice: 守门人
  rationale: 指负责看守门户的人；“守门人”比可能引起现代职业联想的其他说法更准确。
- source_word: הַמְשֹׁרְרִים
  choice: 歌唱者
  rationale: 该分词直接指歌唱的人，尤其是承担圣殿歌唱职务者；此译法既明确又不过度扩展为所有乐师。
- source_word: וּמִן הָעָם
  choice: 一些百姓
  rationale: 字面为“百姓中的一部分”，在列举专职群体的语境中具有部分意义；“一些百姓”符合现代汉语。
- source_word: הַנְּתִינִים
  choice: 殿役
  rationale: 指归属于圣殿服役的特定群体。“殿役”简洁表达其职能，传统音译在脚注中保留。
- source_word: וְכָל יִשְׂרָאֵל
  choice: 和全以色列人
  rationale: 将集体名称自然译为“全以色列人”，不改变其整体性。
- source_word: בְּעָרֵיהֶם
  choice: 在自己的城里
  rationale: עיר可指城或城镇；结合复数后缀，汉语用“各自／自己的城里”自然表达分住各城的含义。
- source_word: וַיִּגַּע הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: 到了七月
  rationale: נגע与月份连用表示某月来到；“到了七月”是自然的现代汉语时间转换表达。
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 以色列的儿子们
  rationale: בני字面为“儿子们”，主文保留原文带性别的形式及其可能产生的张力；其作为民族统称的惯用意义在脚注说明。
theological_decisions:
- issue: בני ישראל这一带性别形式的集体称谓
  choice: 以色列的儿子们
  alternative: 以色列人／以色列民
  rationale: 原文明确使用阳性复数“儿子们”，但该短语在这里又作为整个群体的惯用名称。主文保留形式，脚注说明其集体含义，避免无声地消除原文的性别表达。
- issue: נתינים这一制度性称谓
  choice: 殿役
  alternative: 尼提宁人
  rationale: 正文采用职能性译法以便普通读者理解，同时在脚注保留传统音译，避免把这一特定群体完全等同于泛指的所有圣殿仆役。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。首句以“于是”承接上下文；第二句用“到了七月”自然表达月份来到。保留两处脚注标记，并在正文中分别置于“殿役”和“以色列的儿子们”之后。
