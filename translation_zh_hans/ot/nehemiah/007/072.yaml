revisions:
- from: 于是，祭司、利未人、守门人、歌唱者、一些百姓、殿役[a]和全以色列人都住在自己的城里。到了七月，以色列的儿子们[b]都在自己的城里。
  to: 于是，祭司、利未人、守门人、歌唱者、一些百姓、圣殿仆役[a]和全体以色列人都住在各自的城里。第七个月来到时，以色列人[b]在各自的城里。
  rationale: 修订以现代标准汉语自然表达原文的民族集体称谓和复数属格，同时保留所需的词汇审计信息。第二句不添加“都”或“已经”等原文未明说的强调；“第七个月来到时”保留原文时间转换而不把以色列历月误解为现代公历月份。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:17Z'
review_pass:
  verdict: revise
  source_fidelity: “以色列的儿子们”虽逐词对应 בני ישראל，却在现代汉语中通常指男性后裔，不能自然承载此处作为以色列民族整体的固定称谓，且会不当地排除妇女。应译为“以色列人”，并以脚注保留字面形式。其余列举和“第七个月来到”的时间推进均与希伯来文相符。
  naturalness: “全以色列人”不如“全体以色列人”自然；“自己的城里”容易使各群体被理解为共同拥有同一座城，“各自的城里”更准确。以“圣殿仆役”替代较压缩且现代读者未必明白的“殿役”，语义更清楚，仍保持庄重。
  terminology: “祭司、利未人、守门人、歌唱者”均可接受。“圣殿仆役”准确表达 נְתִינִים 所指附属于圣殿服役的特定群体；脚注保留“尼提宁人”。“以色列人”是 בני ישראל 在本节民族统称用法的标准现代汉语对应，脚注说明其字面构成。
  issues:
  - severity: medium
    issue: 将 וּבְנֵי יִשְׂרָאֵל 译为“以色列的儿子们”
    rationale: 该短语在此是以色列民族的常用集体称谓，不是仅指男性的儿子群体。现代汉语的“儿子们”会产生不符合上下文的性别限定；应以“以色列人”翻译，并在脚注保留“以色列的儿子们”的字面译法。
  - severity: low
    issue: “全以色列人”和“自己的城里”措辞欠自然、指向略不够明确
    rationale: “全体以色列人”是更自然的集体表达；“各自的城里”清楚反映复数后缀所表示的分居各城。
  - severity: low
    issue: “殿役”对现代读者略显压缩
    rationale: “圣殿仆役”更明确说明其服务所属，同时不将这一制度性群体过度泛化；传统名称仍应保留于脚注。
