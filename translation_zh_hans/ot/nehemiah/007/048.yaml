  text: 利巴拿的子孙[a]，哈迦巴的子孙，沙买[b]的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子孙”直译为“儿子们”；这里的希伯来语谱系用语也可指某人的后裔或所属家族。以下各处同。
    reason: lexical_alternative
  - marker: b
    text: 在平行名录的某些文本传统中，末一个名字作“萨买”；本节希伯来文本作“沙买”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 该词是בֵּן的复数附属形；在归回者家族名录中通常指某一祖先的后裔或家族成员，不限于亲生儿子。译作“子孙”既符合现代汉语名录表达，也保留谱系含义。
- source_word: לְבָנָה
  choice: 利巴拿
  rationale: 按马所拉文本的读音音译此专名，不翻译其可能具有的普通词词义。
- source_word: חֲגָבָה
  choice: 哈迦巴
  rationale: 按希伯来语辅音和元音音译此圣殿仆役家族名。
- source_word: שַׁלְמָי
  choice: 沙买
  rationale: 依本节马所拉文本的形式音译；词首שׁ以汉语“沙”近似表达，末尾双元音以“买”表达。
