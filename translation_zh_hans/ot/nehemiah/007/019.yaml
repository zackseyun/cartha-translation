lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在归回者名册的家族谱系语境中，构造复数 בְּנֵי 指属于某一祖先家系的人；译作“子孙”比直译“儿子们”更符合现代汉语，同时保留谱系含义。
- source_word: בִגְוָי
  choice: 比革瓦伊
  rationale: 这是人名或家族名，按希伯来语读音音译，并采用中文圣经中通行的名称形式。
- source_word: אַלְפַּיִם שִׁשִּׁים וְשִׁבְעָה
  choice: 二千零六十七人
  rationale: 原文数目为“两千、六十和七”，准确合并为“二千零六十七”；补出量词“人”，使名册条目在现代汉语中自然清楚。
