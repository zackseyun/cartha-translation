  text: וְ/אֵ֗לֶּה הָֽ/עוֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדּ֖וֹן וְ/אִמֵּ֑ר וְ/לֹ֣א יָכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/061.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addon, and Immer, but they were not able to declare their fathers’ houses or their offspring[c][b], whether they were from Israel.
translation:
  language: zh_hans
  text: 以下这些人从特勒·米拉、特勒·哈沙、基鲁、亚顿[a]和音麦上来，但他们无法说明自己的父家[b]和世系，也无法确认自己是否为以色列人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》2:59的对应记载作“亚但”，本节的希伯来文本作“亚顿”。
    reason: textual_variant
  - marker: b
    text: “父家”指以父系计算的家族或宗族。希伯来文直译为“父亲们的家”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“是否出自以色列”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הָעוֹלִים
  choice: 以下这些人……上来
  rationale: 承接名单并引出一个新群体；“上来”保留流亡者返回犹大时所用的方向性表达。
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר
  choice: 从特勒·米拉、特勒·哈沙、基鲁、亚顿和音麦
  rationale: 按马所拉文本音译这些地名或族名；“亚顿”对应本节的 אַדּוֹן，并以脚注注明《以斯拉记》2:59的异文。
- source_word: וְלֹא יָכְלוּ לְהַגִּיד
  choice: 但他们无法说明
  rationale: “但”自然呈现转折；הגיד 在这里表示申明、说明，而“证明”会比原文更偏向法律性解释。
- source_word: בֵּית אֲבוֹתָם
  choice: 自己的父家
  rationale: 保留希伯来文父系家族单位的表达，同时用“自己的”使现代汉语行文自然；脚注说明其含义。
- source_word: וְזַרְעָם
  choice: 世系
  rationale: זֶרַע 字面可指“种子、后裔”，在族谱语境中“世系”更自然，也能表达其血缘谱系而不局限于本人之后的子孙。
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: 是否出自以色列
  rationale: 贴近原文“是否从以色列而来”的结构，保留其关于以色列血统归属的不确定性，不压缩成身份断言。
theological_decisions:
- issue: “以色列”所表达的是地域来源、族裔血统还是群体身份
  choice: 是否出自以色列
  alternative: 是否是以色列人
  rationale: 原文措辞可涉及血统及群体归属；主文采用较贴近形式且范围较宽的译法，不把含义限定为现代意义上的国籍或单一身份类别。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。人名地名以间隔号标示复合音译；“父家”保留经文的族谱用语，并用脚注帮助普通读者理解。“世系”比字面的“后裔”更符合本节查验家族来源的语境。
