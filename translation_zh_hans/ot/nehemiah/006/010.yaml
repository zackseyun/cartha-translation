source:
  edition: WLC
  text: וַ/אֲנִי בָ֗אתִי בֵּ֣ית שְֽׁמַֽעְיָ֧ה בֶן דְּלָיָ֛ה בֶּן מְהֵֽיטַבְאֵ֖ל וְ/ה֣וּא עָצ֑וּר וַ/יֹּ֡אמֶר נִוָּעֵד֩ אֶל בֵּ֨ית הָ/אֱלֹהִ֜ים אֶל תּ֣וֹךְ הַֽ/הֵיכָ֗ל וְ/נִסְגְּרָה֙ דַּלְת֣וֹת הַ/הֵיכָ֔ל כִּ֚י בָּאִ֣ים לְ/הָרְגֶ֔/ךָ וְ/לַ֖יְלָה בָּאִ֥ים לְ/הָרְגֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/010.yaml
  text: Then I went to the house of Shemaiah son of Delaiah[a], son of Mehetabel, who was confined, and he said, “Let us meet at the house of God, inside the temple, and let us shut the doors of the temple, for they are coming to kill you—yes, at night they are coming to kill you.”
translation:
  language: zh_hans
  text: 于是，我来到示玛雅家；他是德莱雅的儿子、米希大别的儿子，那时他闭门不出。他说：“我们到上帝的殿去，在圣殿内部会面吧，并且关上圣殿的门，因为有人要来杀你——他们要在夜间来杀你。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿内部”或译“圣所里面”。希伯来语“赫卡尔”可特指圣殿建筑或圣所，而不只是较大的圣殿范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי בָאתִי
  choice: 于是，我来到
  rationale: 连词加独立代词承接叙事，并略微突出“我”；“于是”自然表达事件的推进，“来到”符合本句叙述视角。
- source_word: בֵּית שְׁמַעְיָה
  choice: 示玛雅家
  rationale: 与人名连用时，בֵּית指其住所；现代汉语用“家”比“房屋”自然。
- source_word: שְׁמַעְיָה בֶן דְּלָיָה בֶּן מְהֵיטַבְאֵל
  choice: 第莱雅的儿子、米希大别的孙子示玛雅
  rationale: 按汉语习惯交代父系关系，同时避免把后一个בֶן机械译成“儿子”而造成亲属关系不清。
- source_word: וְהוּא עָצוּר
  choice: 那时他闭门不出
  rationale: עָצוּר可指被关住、受限制或自行闭居；“闭门不出”保留原因未明的含混性，也符合现代叙事表达。
- source_word: נִוָּעֵד
  choice: 我们……会面吧
  rationale: 该形式表达共同会面的提议；“会面吧”自然传达劝议语气。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  rationale: 保留“上帝之家”的圣殿称谓含义，同时用现代汉语宗教语境中自然、庄重的“殿”。
- source_word: אֶל תּוֹךְ הַהֵיכָל
  choice: 在圣殿内部
  rationale: הֵיכָל在此很可能指圣殿建筑本身，而非整个殿区；“圣殿内部”明确进入建筑之内，却不擅自限定为至圣所。
- source_word: וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל
  choice: 并且关上圣殿的门
  rationale: 延续共同提议的语气，并保留关门这一具体动作。
- source_word: כִּי בָּאִים לְהָרְגֶךָ
  choice: 因为有人要来杀你
  rationale: 希伯来文复数分词的主语未明；汉语用“有人”自然保留不定施事者，目的意义译为“要来杀你”。
- source_word: וְלַיְלָה בָּאִים לְהָרְגֶךָ
  choice: 他们要在夜间来杀你
  rationale: 保留原文重复所产生的紧迫感；“在夜间”不收窄为特指的“今晚”。
theological_decisions:
- issue: הֵיכָל在涉及受限制圣域的语境中如何翻译
  choice: 圣殿（正文作“圣殿内部”）
  alternative: 圣所
  rationale: 下节表明尼希米认为自己不应进入该处，因此“圣所”在语境上很有分量；但הֵיכָל本身可指圣殿建筑或圣所。正文采用较自然且不过度限定的“圣殿内部”，脚注保留“圣所”这一可能。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。保留“闭门不出”的原因含混、行凶者身份未明，以及“圣殿／圣所”的语义张力。脚注标记置于整节末尾，说明正文中的“圣殿内部”。
