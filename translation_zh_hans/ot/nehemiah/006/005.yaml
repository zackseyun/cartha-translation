  text: וַ/יִּשְׁלַח֩ אֵלַ֨/י סַנְבַלַּ֜ט כַּ/דָּבָ֥ר הַ/זֶּ֛ה פַּ֥עַם חֲמִישִׁ֖ית אֶֽת נַעֲר֑/וֹ וְ/אִגֶּ֥רֶת פְּתוּחָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/005.yaml
  text: Then Sanballat sent his servant to me a fifth time in this manner[a], with an open letter in his hand.
translation:
  language: zh_hans
  text: 于是，参巴拉第五次照样派他的随从到我这里来，随从手里拿着一封未封缄的信[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一封打开的信”。
    reason: פְּתוּחָה 字面可指“打开的”；在书信语境中通常可理解为“未封缄的”。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是……派
  rationale: 连续式叙事动词推动事件发展；“于是”自然表达先后承接，“派”符合差遣使者的语境。
- source_word: אֵלַי
  choice: 来见我
  rationale: 介词 אֶל 表示朝向说话者；这里指随从被派到尼希米那里。“来见我”在汉语中自然表达方向和受信者身份。
- source_word: סַנְבַלַּט
  choice: 参巴拉
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: כַּדָּבָר הַזֶּה
  choice: 照样
  rationale: 该短语回指前四次同样的做法；“照样”简洁保留“按这同一方式”的承前意义。
- source_word: פַּעַם חֲמִישִׁית
  choice: 第五次
  rationale: 准确表达重复行为的次数，并符合现代汉语习惯。
- source_word: אֶת נַעֲרוֹ
  choice: 他的随从
  rationale: נַעַר 可指年轻人、仆人或侍从；在奉命传信的语境中，“随从”既体现其职分，也避免无根据地强调年龄。
- source_word: וְאִגֶּרֶת פְּתוּחָה
  choice: 一封没有封口的信
  rationale: פְּתוּחָה 字面为“打开的、敞开的”；用于古代书信时，语境所指最可能是信件未封口。这样翻译也避免现代汉语“公开信”这一固定文体名称造成误解，同时以脚注保留较字面的另一理解。
- source_word: בְּיָדוֹ
  choice: 手里拿着
  rationale: 保留原文具体的持信画面，并以自然汉语表达携带方式。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”“照样”保持叙事流畅；分号使差遣与随从携带未封书信这两个紧密相关的动作层次清楚。
