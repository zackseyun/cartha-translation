  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר שָֽׁמְעוּ֙ כָּל א֣וֹיְבֵ֔י/נוּ וַ/יִּֽרְא֗וּ כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתֵ֔י/נוּ וַ/יִּפְּל֥וּ מְאֹ֖ד בְּ/עֵינֵי/הֶ֑ם וַ/יֵּ֣דְע֔וּ כִּ֚י מֵ/אֵ֣ת אֱלֹהֵ֔י/נוּ נֶעֶשְׂתָ֖ה הַ/מְּלָאכָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/016.yaml
  text: And it happened that when all our enemies heard[a], and all the nations around us saw, they fell greatly in their own eyes, and they knew that this work had been done by our God.
translation:
  language: zh_hans
  text: 我们所有的仇敌听见这事，周围所有的列国看见了，就都大受挫折[a]；他们知道，这工程是由我们的神成就的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们在自己眼中大大坠落”。这是表示他们自觉地位降低、气势大挫或失去信心的意象。
    reason: 保留希伯来语“在自己眼中坠落”的独特意象，并说明其在上下文中的可能含义。
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר שָׁמְעוּ
  choice: 这事传到……耳中
  rationale: 将希伯来语叙事过渡式和“听见”自然地合并表达；“这事”依上下文指城墙完工，不额外缩窄其含义。
- source_word: כָּל אֹיְבֵינוּ
  choice: 我们所有仇敌
  rationale: 直接保留全称范围和第一人称复数所属关系。
- source_word: וַיִּרְאוּ
  choice: 害怕
  rationale: 按马所拉读音和本节语境理解为 ירא（惧怕），而非 ראה（看见）；这也与随后他们气势受挫的描述衔接。
- source_word: כָּל הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: 周围各国的人
  rationale: גּוֹיִם 在此指周围的列国或族群；译作“各国的人”在现代汉语中自然，也避免引入后期“外邦人”的神学色彩。
- source_word: וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם
  choice: 他们就自觉大大失势
  rationale: 原文意象是“在自己眼中大大坠落”，表示自觉受挫、气势低落；正文以较自然的汉语传达其含义，并用脚注保留原有意象及可能语感。
- source_word: וַיֵּדְעוּ
  choice: 并且知道
  rationale: 直译认知动词，保留他们因所见结果而作出的明确认识。
- source_word: מֵאֵת אֱלֹהֵינוּ
  choice: 是出于我们的神
  rationale: מֵאֵת 可表达来源和施事；“出于我们的神”兼顾神是工程完成的来源与决定性施事，而不具体规定其实现方式。
- source_word: נֶעֶשְׂתָה הַמְּלָאכָה הַזֹּאת
  choice: 这工程能够完成
  rationale: 被动式指工程已经做成；汉语用“能够完成”结合后文“出于我们的神”，自然表达已完成的结果及其归因。
theological_decisions:
- issue: 工程完成中的神圣施事
  choice: 这工程能够完成，是出于我们的神
  alternative: 这工程是由我们的神完成的
  rationale: “出于”较贴近 מֵאֵת 所兼有的来源和施事意义，明确把工程完成归因于神，同时不把人的实际劳动排除在外，也不对神如何促成此事作超出原文的说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“这事传到……耳中”自然承接上下文；分号呈现仇敌惧怕与自觉失势之间的推进关系。正文脚注标记与脚注完全对应。
