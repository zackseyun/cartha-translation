  text: וַ/יִּשְׁלַ֨ח סַנְבַלַּ֤ט וְ/גֶ֨שֶׁם֙ אֵלַ֣/י לֵ/אמֹ֔ר לְכָ֞/ה וְ/נִֽוָּעֲדָ֥ה יַחְדָּ֛ו בַּ/כְּפִירִ֖ים בְּ/בִקְעַ֣ת אוֹנ֑וֹ וְ/הֵ֨מָּה֙ חֹֽשְׁבִ֔ים לַ/עֲשׂ֥וֹת לִ֖/י רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/002.yaml
  text: So Sanballat and Geshem sent to me[a], saying, “Come[b], and let us meet together in the villages in the plain of Ono.” But they were planning to do me harm.
translation:
  language: zh_hans
  text: 于是，参巴拉和基善派人来对我说：“来吧，让我们在阿挪平原的村庄[a]一起会面。”其实，他们图谋害我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “村庄”也可能是地名“基非琳”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人来
  rationale: 原文未明说所派的是人还是信息，但“派人来对我说”符合希伯来叙事表达，也使现代汉语自然；不额外补出信息内容。
- source_word: סַנְבַלַּט וְגֶשֶׁם
  choice: 参巴拉和基善
  rationale: 按现代中文圣经常用译名音译人名。
- source_word: לְכָה
  choice: 来吧
  rationale: 该命令式字面与“行走”有关，但在邀请语境中自然表示“来吧”。
- source_word: וְנִוָּעֲדָה יַחְדָּו
  choice: 让我们……一起会面
  rationale: נִוָּעֲדָה 表示约定相会，יַחְדָּו 强调共同参与；“一起会面”兼顾原意与自然汉语。
- source_word: בַּכְּפִירִים
  choice: 在……村庄
  rationale: 主文将其理解为普通名词复数“村庄”；该词也可能是地名“基非琳”，故保留脚注。
- source_word: בְּבִקְעַת אוֹנוֹ
  choice: 阿挪平原
  rationale: בִּקְעָה 指宽阔谷地或平原；此处译作“平原”简明自然，同时承认“谷地”也可表达其地形含义。
- source_word: וְהֵמָּה חֹשְׁבִים
  choice: 其实，他们图谋
  rationale: 分句与表面邀请形成反差；חֹשְׁבִים 在此不是一般思考，而是谋划、企图。用“其实”自然显明叙事转折。
- source_word: לַעֲשׂוֹת לִי רָעָה
  choice: 害我
  rationale: 原文指对尼希米施加祸害，但未限定具体手段；“害我”保留其宽泛而明确的敌意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留邀请与暗中敌意之间的张力；不把未说明的伤害具体化。阿挪的 בִּקְעָה 译为“平原”，其“谷地”语义不影响本节要旨，故不另设脚注。
