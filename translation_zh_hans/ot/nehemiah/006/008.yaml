base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/008.yaml
  text: So I sent to him[a], saying, “These things that you are saying have not happened, for you are inventing them out of your own heart.”
translation:
  language: zh_hans
  text: 于是我派人去回复他，说：“你所说的这些事并没有发生；这些都是你自己心里捏造的[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些都是你凭自己的心思编造的。”
    reason: “心”在希伯来语中也可指思想、意念；此译法明示该词在本句中的含义，并以“编造”表达“捏造”的词义。
lexical_decisions:
- source_word: וָאֶשְׁלְחָה אֵלָיו
  choice: 于是我派人回复他
  rationale: וָאֶשְׁלְחָה承接叙事进程，译作“于是”；结合本章以使者传话的语境，“派人回复他”比直译“送到他那里”更符合现代汉语，同时保留间接送信之意。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的常用结构，汉语用“说”自然简洁。
- source_word: לֹא נִהְיָה כַּדְּבָרִים הָאֵלֶּה
  choice: 这些事根本没有发生
  rationale: היה在此否认所指控之事的真实性或发生；“根本没有发生”自然有力地传达断然否认，דברים按语境译为“事”。
- source_word: אֲשֶׁר אַתָּה אוֹמֵר
  choice: 你所说的
  rationale: 参与式אוֹמֵר表示对方正在提出的说法；“你所说的”是自然、准确的定语表达。
- source_word: כִּי
  choice: 都是
  rationale: 此处引出对前述否认的解释和对照。汉语以“都是”顺畅连接两句，并突出这些说法的来源。
- source_word: מִלִּבְּךָ
  choice: 你心里
  rationale: 保留לֵב“心”的人体意象；在本句中指人的思想、意念和主观构想。
- source_word: בּוֹדָאם
  choice: 捏造出来的
  rationale: בדא意为凭空制造、虚构；“捏造”准确表达蓄意编造虚假指控，且符合庄重的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“心里捏造出来”保留原文意象，同时在汉语中仍自然清楚；用“回复”体现这是对前文来信中指控的回应。
