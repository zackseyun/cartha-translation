base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/018.yaml
  text: For many in Judah were bound by oath to him[a], because he was the son-in-law of Shecaniah son of Arah[b], and Jehohanan his son had taken the daughter of Meshullam son of Berechiah as his wife.
translation:
  language: zh_hans
  text: 原来，在犹大有许多人曾向他起誓[a]；因为他是亚拉的儿子示迦尼的女婿，而他的儿子约哈难娶了比利迦的儿子米书兰的女儿为妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于“在犹大有许多人是对他持有誓言的人”，意思是他们因誓言而对他负有义务。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים בִּיהוּדָה
  choice: 在犹大有许多人
  rationale: 将介词短语按处所理解，指犹大境内或犹大群体中的许多人；这样的汉语表达自然，也不把“犹大”仅限于地理概念。
- source_word: בַּעֲלֵי שְׁבוּעָה לוֹ
  choice: 向他起誓效忠
  rationale: 原文直译近于“对他拥有誓言的人”，表示他们因誓言而对他负有义务。在本段政治结盟的语境中，“起誓效忠”自然传达这种约束关系。
- source_word: כִּי ... כִּי
  choice: 因为……；（隐含因果关系）
  rationale: 第一个כִּי承接上文，说明原因，译作“因为”；第二个כִּי说明许多人受誓言约束的缘由，汉语以分号后直接陈述亲属关系即可清楚表达，避免连续使用两个“因为”造成累赘。
- source_word: חָתָן הוּא לִשְׁכַנְיָה
  choice: 他是……示迦尼的女婿
  rationale: חָתָן在亲属语境中通常指“女婿”，此处明确表达婚姻关系，符合上下文。
- source_word: וִיהוֹחָנָן בְּנוֹ
  choice: 而他的儿子约哈难
  rationale: 按紧邻先行词理解，“他的”指示迦尼；调整为现代汉语常用语序，同时保留原文的亲属链条。
- source_word: לָקַח אֶת בַּת
  choice: 娶了……的女儿为妻
  rationale: 这是希伯来语婚姻惯用语，字面为“取了……的女儿”；译出“为妻”可避免被理解为一般的带走或收养。
- source_word: בַּת מְשֻׁלָּם בֶּן בֶּרֶכְיָה
  choice: 比利迦的儿子米书兰的女儿
  rationale: 按原文保留父系身份链条，在中文中明确表示女子是比利迦之子米书兰的女儿。
