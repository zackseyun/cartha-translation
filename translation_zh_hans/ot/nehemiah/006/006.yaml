  text: כָּת֣וּב בָּ֗/הּ בַּ/גּוֹיִ֤ם נִשְׁמָע֙ וְ/גַשְׁמ֣וּ אֹמֵ֔ר אַתָּ֤ה וְ/הַ/יְּהוּדִים֙ חֹשְׁבִ֣ים לִ/מְר֔וֹד עַל כֵּ֛ן אַתָּ֥ה בוֹנֶ֖ה הַ/חוֹמָ֑ה וְ/אַתָּ֗ה הֹוֶ֤ה לָ/הֶם֙ לְ/מֶ֔לֶךְ כַּ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/006.yaml
  text: It was written in it[a], “It is being reported among the nations—and Geshem also says it—that you and the Jews are planning to rebel. Therefore you are rebuilding the wall, and according to these reports you are to become their king.”
translation:
  language: zh_hans
  text: 信上写着[a]：“列国中流传着这样的说法，迦施慕也这样说：你和犹大人图谋反叛，所以你才重建城墙；照这些传言，你要作他们的王。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦施慕”是此处希伯来文本中的名字形式，通常认为就是第1节所称的“基善”。
    reason: 说明同一人物名字在本章中的不同形式，避免读者误以为是两个人。
lexical_decisions:
- source_word: כָּתוּב בָּהּ
  choice: 信上写着
  rationale: 被动分词结构引出信件内容；中文以“信上写着”自然承接叙事，并明确בָּהּ所指为信。
- source_word: בַּגּוֹיִם נִשְׁמָע
  choice: 列国中流传着这样的说法
  rationale: נשמע为Niphal，表示某事被听见或传开；“流传着”保留传闻正在传播的意味，“列国”保持גוים在此处的民族—政治含义。
- source_word: וְגַשְׁמוּ אֹמֵר
  choice: 迦施慕也这样说
  rationale: “也”体现连接词所带的附加佐证意味；按马所拉文本音译גַשְׁמוּ为“迦施慕”，不在正文中改作另一名字形式。
- source_word: חֹשְׁבִים לִמְרוֹד
  choice: 图谋反叛
  rationale: חשב加不定式表示筹划或意图；“图谋反叛”准确表达蓄意行动，同时符合诬告语境。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 表达指控者从谋反传言推论到修建城墙的因果关系。
- source_word: בּוֹנֶה הַחוֹמָה
  choice: 重建城墙
  rationale: בנה本义为建造，结合尼希米记中修复旧城墙的语境译为“重建”。
- source_word: וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ
  choice: 你要作他们的王
  rationale: הוה配לְ可表示成为；“要作”保留传言所指控的意图或预期结果，不把它断定为已经发生。
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: 照这些传言
  rationale: דברים字面可指“话”或“事情”，在此回指前述流言内容；“传言”符合书信指控的语境。
theological_decisions:
- issue: 尼希米称王的说法是否为事实
  choice: 保留为信中转述的传言和指控
  alternative: 将“你要作他们的王”表达成叙述者确认的事实
  rationale: 整句属于公开信的内容，原文只呈现敌对者散播的指控，并未认可其真实性。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“信上写着”自然引出引文；“列国中流传着”“图谋反叛”保持公开信中政治诬告的语气。
