base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/009.yaml
  text: For all of them were trying to frighten us[a], saying, “Their hands will grow weak from the work, and it will not be done.” But now[b], strengthen my hands.
translation:
  language: zh_hans
  text: 因为他们都想吓唬我们，说：“他们的手会因这工程而发软，工程就完不成了。”但现在，求你坚固我的手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 末句是一句简短的祷告。马所拉文本的元音支持把它读作尼希米直接向上帝祈求：“求你坚固我的手。”
    reason: alternative_reading
lexical_decisions:
- source_word: מְיָרְאִים
  choice: 想吓唬
  rationale: Hiphil分词表示使人惧怕；结合上下文译为“想吓唬”，既体现持续施压，也表达其企图。
- source_word: אוֹתָנוּ
  choice: 我们
  rationale: 马所拉文本明确为第一人称复数，表明尼希米将自己与共同体及施工人员连在一起，不因末句转为单数而改译。
- source_word: לֵאמֹר
  choice: 心想
  rationale: 此处引出的是敌人的意图或盘算，并非必然是实际说出口的话；“心想”在中文中自然地引出其预期。
- source_word: יִרְפּוּ יְדֵיהֶם
  choice: 他们的手会……发软
  rationale: 保留希伯来语“手松弛、无力”的身体意象，也自然表达失去力量或干劲，并与末句“坚固我的手”形成呼应。
- source_word: מִן הַמְּלָאכָה
  choice: 因这工程
  rationale: מְלָאכָה在语境中指重建城墙的工程；介词מן在这里可表达因工作而手软，译成“因这工程”较自然。
- source_word: וְלֹא תֵעָשֶׂה
  choice: 工程就完不成了
  rationale: Niphal未完成式表示工程不会被做成；中文用“完不成”清楚传达结果，同时明确隐含的主语是工程。
- source_word: וְעַתָּה
  choice: 但现在
  rationale: 标示从敌人的盘算转向尼希米祷告的转折，“但现在”保留连接词和对比。
- source_word: חַזֵּק אֶת יָדָי
  choice: 求你坚固我的手
  rationale: 按马所拉元音读作第二人称阳性单数命令式，是向上帝发出的简短祈求；保留“手”的意象，以呼应前文。
theological_decisions:
- issue: 末句由叙述转为直接祷告
  choice: 译作尼希米向上帝的直接祈求：“但现在，求你坚固我的手。”
  alternative: 按不同元音或文本理解为自我陈述：“但现在，我使自己的手刚强。”
  rationale: 马所拉文本חַזֵּק是第二人称阳性单数命令式，最自然地指向上帝；这也符合尼希米记中插入简短祷告的写法。
- issue: 敌人内容是言语还是内心盘算
  choice: 用“心想”引出其企图。
  alternative: 用“说”引出直接引语。
  rationale: לֵאמֹר通常可译“说”，但本句上下文强调敌人企图制造恐惧，其后内容可理解为他们的盘算。原文在实际发言与意图表达之间留有一定空间，脚注说明另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“手发软”保留原文惯用意象，并与“坚固我的手”前后呼应；“工程”使重建城墙的语境明确。所有脚注标记均置于正文相应位置。
