  register: 采用庄重而自然的现代标准汉语。“常”与“不断”呈现原文两个持续或反复行动；“说……的好话”符合当代读者习惯，又借脚注保留טוֹבֹתָיו的语义宽度。所有脚注标记均已置于正文对应位置。
