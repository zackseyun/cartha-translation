base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/019.yaml
  text: Also they kept speaking of his good deeds in my presence[a], and they kept reporting my words to him[b]. Tobiah sent letters to frighten me.
translation:
  language: zh_hans
  text: 他们也常在我面前称赞多比雅的好处[a]，又不断把我的话传给他[b]。多比雅寄来信，要使我惧怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的好处”“他的优点”。原文所指比具体的善行更宽，可包括多比雅的品行、作为或其他可称道之处；这里是说有人在尼希米面前替他美言。
    reason: lexical_alternative
  - marker: b
    text: 直译“把我的话带出去给他”，意思是把尼希米所说的话转告或传报给多比雅。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 也；还
  rationale: 前两分句用“也”承接上文，末句用“还”自然表达本节所补充的一连串行动。
- source_word: טוֹבֹתָיו
  choice: 多比雅的好话
  rationale: 希伯来语是“他的好处/好事”的复数实体用法，范围可包括品行、作为或可称道之处；语境强调众人在尼希米面前替多比雅美言，故译为“说多比雅的好话”，同时以脚注保留较宽的词义。
- source_word: הָיוּ אֹמְרִים
  choice: 常……说
  rationale: היה加分词表达过去持续或反复发生的行动；“常……说”在现代汉语中简洁自然。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 贴近字面“在我面前”，也自然表达当着尼希米的面。
- source_word: וּדְבָרַי
  choice: 我的话
  rationale: דבר在此最自然地指尼希米所说的话，保留原文直接而未过度解释。
- source_word: הָיוּ מוֹצִיאִים לוֹ
  choice: 不断传给他
  rationale: 字面为“把……带出去给他”，在语境中指把消息转告或传报给多比雅；“不断”体现持续、反复的结构。
- source_word: אִגְּרוֹת
  choice: 信
  rationale: 该词指书信或函件；汉语集合表达“寄信”无需强加复数形式。
- source_word: שָׁלַח
  choice: 寄
  rationale: 与“信”搭配时，“寄信”比泛称“送信”更符合现代汉语习惯。
- source_word: לְיָרְאֵנִי
  choice: 来恐吓我
  rationale: 介词לְ表达目的，动词形式在此表示使人惧怕；“恐吓”既传达有意制造恐惧，也符合敌对政治语境。
