base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/003.yaml
  text: So I sent messengers to them[a], saying, “I am doing a great work, and I cannot come down. Why should the work stop while I leave it and come down to you?”
translation:
  language: zh_hans
  text: 于是我派人去对他们说：“我正在做一项大工程，不能下去。我一放下这工程，下去到你们那里，工程为什么要停顿呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: 于是我派
  rationale: 该叙事性连续形式推进下一步行动；“于是”自然表达上下文中的承接和结果关系。
- source_word: עֲלֵיהֶם מַלְאָכִים
  choice: 人去对他们
  rationale: מַלְאָכִים在此指传递口信的人，而非天使；结合中文习惯，“派人去对他们说”比直译“派使者到他们那里”更自然，且未丢失信息。
- source_word: מְלָאכָה גְדוֹלָה
  choice: 一项重大的工程
  rationale: מְלָאכָה可指工作、任务或工程；此处语境是城墙重建，“工程”具体自然，“重大”保留גְדוֹלָה所强调的重要性和规模。
- source_word: אֲנִי עֹשֶׂה
  choice: 我正在做
  rationale: 独立代词加分词表达正在持续的行动；“正在做”准确呈现其进行状态。
- source_word: וְלֹא אוּכַל לָרֶדֶת
  choice: 不能下去
  rationale: 保留ירד的空间方向，即从耶路撒冷下去；中文无需补出“来”或“去”也能自然表达。
- source_word: לָמָּה תִשְׁבַּת הַמְּלָאכָה
  choice: 为什么要让工程停顿呢
  rationale: שׁבת在此意为停止、停顿，并非守安息日；反问句式传达尼希米认为没有理由中断工程。
- source_word: כַּאֲשֶׁר אַרְפֶּהָ
  choice: 我若停下工程
  rationale: רפה的使役形在此有放手、停下手中工作的意思，阴性单数后缀指前述מְלָאכָה；“若”自然表达此处设想的条件性情形。
- source_word: וְיָרַדְתִּי אֲלֵיכֶם
  choice: 到你们那里去
  rationale: 译出目的地和移动方向；前句已有“下去”，此处避免中文生硬重复，同时完整保留离开工程前往对方所在地之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。将מְלָאכָה按重建城墙的语境译为“工程”，并保留原文反问的力度。原文句法可理解为工程会因尼希米放手离开而停止；正文以自然中文重组，但不增添神学解释。
