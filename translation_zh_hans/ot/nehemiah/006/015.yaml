base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/015.yaml
  text: So the wall was finished on the twenty-fifth day of Elul[b][a], in fifty-two days.
translation:
  language: zh_hans
  text: 城墙于以禄月[a]二十五日完工，历时五十二天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 以禄月是希伯来历的第六个月。
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: 完工了
  rationale: 该动词为שלם的Qal叙事形式，以阴性单数“城墙”为主语，表达工程达到完成状态；“完工了”在现代汉语中自然、明确，也保留事件完成之意。
- source_word: הַחוֹמָה
  choice: 城墙
  rationale: 带定冠词的名词，按上下文特指耶路撒冷的城墙；汉语用“城墙”即可清楚表达。
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה
  choice: 二十五日
  rationale: 介词与基数词构成日期表达；现代汉语日期习惯补出“日”。
- source_word: לֶאֱלוּל
  choice: 以禄月
  rationale: 这是希伯来历的月份名称，采用中文圣经语境中易辨识的音译“以禄”，并补“月”。
- source_word: לַחֲמִשִּׁים וּשְׁנַיִם יוֹם
  choice: 共用了五十二天
  rationale: לְ与数词短语表示完成工程所经历的总时长；“共用了五十二天”自然传达工期总计，避免误解为完成后又过了五十二天。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“完工了”比“被完成”更符合汉语习惯；以“共用了”清楚表达五十二天是工程持续的总时间。正文脚注标记紧随月份名称。
