  text: וְ/גַם נְבִיאִ֡ים הֶעֱמַ֣דְתָּ לִ/קְרֹא֩ עָלֶ֨י/ךָ בִֽ/ירוּשָׁלִַ֜ם לֵ/אמֹ֗ר מֶ֚לֶךְ בִּֽ/יהוּדָ֔ה וְ/עַתָּה֙ יִשָּׁמַ֣ע לַ/מֶּ֔לֶךְ כַּ/דְּבָרִ֣ים הָ/אֵ֑לֶּה וְ/עַתָּ֣ה לְכָ֔/ה וְ/נִֽוָּעֲצָ֖ה יַחְדָּֽו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/007.yaml
  text: And you have even appointed prophets to proclaim concerning you in Jerusalem[a], saying, ‘There is a king in Judah!’ And now these reports will be heard by the king. So now, come[b], and let us consult together.
translation:
  language: zh_hans
  text: 你甚至还设立了先知，让他们在耶路撒冷宣告有关你的事，说：“犹大有王！”[a] 如今，这些话[b]将会传到王那里。所以现在来吧，让我们一同商议。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“王在犹大”，是一个简短的无动词句；上下文暗指尼希米有称王之意，但引语本身没有明说他的名字。
    reason: alternative_reading
  - marker: b
    text: “这些话”也可译为“这些事”或“这样的消息”。原词可泛指言语、事情或传闻。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 你甚至还
  rationale: 兼顾连接词与附加、强调语气，符合信中指控逐步加重的口吻。
- source_word: נְבִיאִים
  choice: 先知
  rationale: 采用该词通常且直接的含义；上下文没有充分依据将其弱化为一般的传话人。
- source_word: הֶעֱמַדְתָּ
  choice: 设立了
  rationale: 使役词形在这里表示安排人担任某种职分；“设立”既贴近原文，也适合先知受命公开宣告的语境。
- source_word: לִקְרֹא עָלֶיךָ
  choice: 宣告有关你的事
  rationale: 保留介词所表达的“关于、涉及”之意，不把它解释得更具体。
- source_word: בִירוּשָׁלַם
  choice: 在耶路撒冷
  rationale: 按地点意义直接翻译。
- source_word: מֶלֶךְ בִּיהוּדָה
  choice: 犹大有王了
  rationale: 原文是简短的无动词句；此译传达出现君王或有人称王的政治性消息，又不在引语中擅自补出尼希米的名字。
- source_word: וְעַתָּה יִשָּׁמַע לַמֶּלֶךְ כַּדְּבָרִים הָאֵלֶּה
  choice: 如今，这些话必传到王那里
  rationale: 以自然汉语表达原文“被王听见”的被动含义；“这些话”可涵盖言语、事情或消息，并由上下文明确其为将传到波斯王那里的指控。
- source_word: וְעַתָּה לְכָה
  choice: 所以现在来吧
  rationale: 既保留劝请式命令，也体现从威胁转向提议会面的语篇推进。
- source_word: וְנִוָּעֲצָה יַחְדָּו
  choice: 让我们一同商议
  rationale: 保留共同筹议的意愿语气，并采用自然、庄重的现代汉语。
theological_decisions:
- issue: 有关称王指控的性质
  choice: 将引语译为“犹大有王了”，不在引语内明确补出尼希米。
  alternative: “你在犹大作王了”或“尼希米在犹大作王了”
  rationale: 上下文清楚表明尼希米是被指控的对象，但希伯来文引语本身只是简短的“王在犹大／犹大有王”，没有明说姓名或第二人称。译文保留指控的力度，也保留原文的省略与含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你甚至还”表现书信指控的加强语气；“传到王那里”用自然汉语保留被波斯王听见的含义。引语保持短促，呈现政治谣言式的宣告口吻。
