  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר נִשְׁמַ֣ע לְ/סַנְבַלַּ֣ט וְ֠/טוֹבִיָּה וּ/לְ/גֶ֨שֶׁם הָֽ/עַרְבִ֜י וּ/לְ/יֶ֣תֶר אֹֽיְבֵ֗י/נוּ כִּ֤י בָנִ֨יתִי֙ אֶת הַ֣/חוֹמָ֔ה וְ/לֹא נ֥וֹתַר בָּ֖/הּ פָּ֑רֶץ גַּ֚ם עַד הָ/עֵ֣ת הַ/הִ֔יא דְּלָת֖וֹת לֹא הֶעֱמַ֥דְתִּי בַ/שְּׁעָרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/001.yaml
  text: When Sanballat[a], Tobiah, Geshem the Arab[b], and the rest of our enemies heard that I had rebuilt the wall and that no breach was left in it—though up to that time I had not set up the doors in the gates—
translation:
  language: zh_hans
  text: 当参巴拉、多比雅、阿拉伯人基善[b]和我们其他的仇敌听说我已经重建了城墙[a]，墙上没有留下一处缺口时——只是直到那时，我还没有在城门上安设门扇——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“建造了城墙”。原文动词只是“建造”；正文根据修复原有城墙的上下文译作“重建”。
    reason: lexical_alternative
  - marker: b
    text: 或译“阿拉伯的基善”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: ……听说
  rationale: 该结构引出新的叙事进展，并构成时间从句；现代汉语无需另加“现在”或生硬地译作“事情发生了”。
- source_word: נִשְׁמַע לְסַנְבַלַּט ...
  choice: 参巴拉……听说
  rationale: 原文虽采用尼法勒形式，汉语以具名人物作主语译为“听说”更自然，也准确表达消息传到他们那里。
- source_word: סַנְבַלַּט ... טוֹבִיָּה ... גֶשֶׁם הָעַרְבִי
  choice: 参巴拉、多比雅、阿拉伯人基善
  rationale: 人名采用通行的汉语音译；הָעַרְבִי是族属称谓，译作“阿拉伯人”。
- source_word: יֶתֶר אֹיְבֵינוּ
  choice: 我们其余的仇敌
  rationale: 保留“我们”和“其余”两层含义；“仇敌”符合叙事语体。
- source_word: כִּי
  choice: 听说，……
  rationale: כִּי在这里引出所听见的内容；汉语可借标点和后续分句自然表达，不必机械加入“即”。
- source_word: בָנִיתִי אֶת־הַחוֹמָה
  choice: 我已经重建了城墙
  rationale: 动词本义是“建造”，但上下文所述是修复耶路撒冷原有城墙，因此正文采用“重建”，并以脚注保留较字面的译法。
- source_word: לֹא נוֹתַר בָּהּ פָּרֶץ
  choice: 墙上没有留下一处缺口
  rationale: פָּרֶץ在城墙语境中指破口或缺口；此译清楚表达城墙已连续封合。
- source_word: גַּם עַד הָעֵת הַהִיא
  choice: 不过直到那时
  rationale: 此处引出对工程完成程度的限定；“不过”自然传达语境中的转折或让步意味。
- source_word: דְּלָתוֹת
  choice: 门扇
  rationale: 原词特指安装在城门结构中的门板，而非整个城门；“门扇”可保留这一区别。
- source_word: לֹא הֶעֱמַדְתִּי בַשְּׁעָרִים
  choice: 我还没有把门扇装在城门上
  rationale: הֶעֱמַדְתִּי在此表示安置、装设；“装在城门上”符合现代汉语，并不额外限定具体安装方式。
