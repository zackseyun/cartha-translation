base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/013.yaml
  text: 'He was hired for this purpose: that I should become afraid and act that way and sin[a], so that they would have grounds for an evil report[b], in order that they might reproach me.'
translation:
  language: zh_hans
  text: 他被雇来，正是为了使我惧怕，照这样去做而犯罪[a]；这样他们就有毁谤我的把柄，可以羞辱我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被雇”也可译作“被收买”或“受了贿赂”。原文最直接的意思是“受雇”或“受酬”；上下文显示这笔酬劳具有收买的目的。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“这会成为他们的恶名”。这是习语性的说法；在上下文中，很可能指尼希米犯罪会给敌人提供恶意毁谤他的材料。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שָׂכוּר הוּא
  choice: 他被雇来，正是要
  rationale: 保留被动分词“被雇”的直接词义，并用“正是要”表达首个לְמַעַן的目的意味及הוּא所带的强调。
- source_word: אִירָא
  choice: 使我害怕
  rationale: 未完成式位于目的结构中，表示对尼希米预期造成的结果；“使我害怕”在现代汉语中自然清楚。
- source_word: וְאֶעֱשֶׂה כֵן
  choice: 照他说的去做
  rationale: כֵן直译为“这样”；结合上文示玛雅提出的行动方案，以“照他说的去做”明确所指，同时不额外界定具体行为。
- source_word: וְחָטָאתִי
  choice: 而犯罪
  rationale: 表达照做所导致的犯罪结果，并保留原文将该行为判定为罪的力度。
- source_word: וְהָיָה לָהֶם לְשֵׁם רָע
  choice: 好让他们有把柄败坏我的名声
  rationale: 原文直译近于“这就给他们作恶名”；语义上指尼希米的犯罪会给敌人提供毁谤、败坏其名声的材料。“有把柄”自然传达לָהֶם所表示的可供利用之处。
- source_word: יְחָרְפוּנִי
  choice: 羞辱我
  rationale: חרף可指辱骂、嘲弄或使人蒙羞；此处“羞辱”兼顾敌对言语与公开损害名誉的语境。
theological_decisions:
- issue: 尼希米所说的“犯罪”是否需要具体解释
  choice: 正文仅译作“犯罪”
  alternative: 明确译为“违犯律法”或“亵渎圣殿”
  rationale: 本节本身没有明说罪的具体性质；上下文虽涉及进入殿内，译文仍应保留原文的简洁与一定程度的解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“有把柄”较口语化但已属标准现代汉语，能准确表达敌人将其过失用作毁谤材料；全句保留原文连续的目的链条。
