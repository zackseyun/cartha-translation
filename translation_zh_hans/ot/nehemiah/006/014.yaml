  text: זָכְרָ֧/ה אֱלֹהַ֛/י לְ/טוֹבִיָּ֥ה וּ/לְ/סַנְבַלַּ֖ט כְּ/מַעֲשָׂ֣י/ו אֵ֑לֶּה וְ/גַ֨ם לְ/נוֹעַדְיָ֤ה הַ/נְּבִיאָה֙ וּ/לְ/יֶ֣תֶר הַ/נְּבִיאִ֔ים אֲשֶׁ֥ר הָי֖וּ מְיָֽרְאִ֥ים אוֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/014.yaml
  text: Remember Tobiah and Sanballat[a], my God, according to these deeds of theirs, and also Noadiah the prophetess and the rest of the prophets who were trying to make me afraid.
translation:
  language: zh_hans
  text: 我的神啊，求你按多比雅和参巴拉所行的这些事记念他们[a]；也求你记念女先知挪亚底和其余的先知，他们一直企图使我惧怕。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“所行的这些事”带单数“他”的词尾；在这里可集体指多比雅和参巴拉，正文按上下文译为“他们”。
    reason: 保留希伯来文单数词尾与上下文复数指称之间的语法张力，避免把词尾形式误作无歧义的复数。
  - marker: b
    text: 或译：“他们一直设法恐吓我。”
    reason: 该词表示使人惧怕；此处过去时动词加分词表达过去持续进行的使人惧怕／恐吓行动。
lexical_decisions:
- source_word: זָכְרָה אֱלֹהַי
  choice: 我的神啊，求你记住
  rationale: זָכְרָה在祷告中是直接向神发出的祈求；用“求你记住”既保留命令式的直接语气，也符合现代汉语祷告表达。אֱלֹהַי按第一人称单数词尾译为“我的神”。
- source_word: לְטוֹבִיָּה וּלְסַנְבַלַּט
  choice: 多比雅和参巴拉
  rationale: 按通行中文圣经人名音译；介词לְ在זָכְרָה之后标示“记住”的对象，无须另译。
- source_word: כְּמַעֲשָׂיו אֵלֶּה
  choice: 照他们所做的这些事
  rationale: כְּ表示依照、相称于；“照……”保留向神祈求按其行为记念他们的含义，而不擅自增添“审判”或“报应”。词尾形式为阳性单数，但上下文刚提到两人，正文采用自然的复数指称，并以脚注保留形式上的歧义。
- source_word: וְגַם לְנוֹעַדְיָה הַנְּבִיאָה
  choice: 也求你记住女先知挪亚底
  rationale: וְגַם具有追加作用，中文用“也”衔接；הַנְּבִיאָה明确为阴性名词，译作“女先知”，自然且保留原文的性别标记。
- source_word: וּלְיֶתֶר הַנְּבִיאִים
  choice: 和其余的先知
  rationale: יֶתֶר指剩余的人，译作“其余的先知”简明准确。
- source_word: אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי
  choice: 他们一直想使我害怕
  rationale: הָיוּ加分词表达过去持续进行的行动；מְיָרְאִים在此为使人惧怕的用法。“一直想使我害怕”传达持续施压及其使尼希米恐惧的目的，同时脚注保留可译为实际“恐吓”的较强表达。
theological_decisions:
- issue: 求神“记住”敌对者是否应明译为审判或追讨
  choice: 保留“求你记住……照他们所做的这些事”的含蓄表达
  alternative: 求你审判他们／追讨他们的罪
  rationale: 希伯来文有严肃的祈求和隐含的追责意味，却没有明说“审判”或“报应”；正文不将隐含意义扩写为明确司法措辞。
- issue: 先知身份与敌对行为之间的张力
  choice: 直译“女先知……和其余的先知”，不解释其真假
  alternative: 假女先知／假先知
  rationale: 原文称他们为先知，却未在本节加入“假”这一评价；译文保留这种张力，不替文本作神学判定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我的神啊，求你……”保持祷告语气；人名采用简体中文圣经中通行的译名。避免古奥表达，也不把原文未明说的审判或“假先知”含义加入正文。
