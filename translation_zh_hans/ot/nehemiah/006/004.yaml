  text: They sent to me four times in this way[a], and I answered them in the same way.
translation:
  language: zh_hans
  text: 他们四次这样传话给我[a]，我也都这样回答他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在前后两句都用了“照这话”这一短语：可指他们每次所传的内容相同、我每次所答的内容也相同，也可泛指以同样的方式传话和答复。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֵלַי
  choice: 传话给我
  rationale: שלח的基本义是“差遣、发送”，原文未明说所差的是使者还是所传的是话。汉语用“传话给我”自然表达这里反复联络的语境，同时不具体断定使者身份。
- source_word: כַּדָּבָר הַזֶּה
  choice: 这样
  rationale: 该短语直译为“照这话”，既可侧重同样的内容，也可侧重同样的方式；“这样”保留这种指代弹性。
- source_word: אַרְבַּע פְּעָמִים
  choice: 四次
  rationale: 准确表达动作发生了四回。
- source_word: וָאָשִׁיב אוֹתָם
  choice: 我也都这样回答他们
  rationale: שוב的使役形在传话语境中可表示“回话、回答”；“都”自然表明四次均有相同回应。
- source_word: כַּדָּבָר הַזֶּה
  choice: 这样
  rationale: 重复采用“这样”，对应原文相同短语的复现，并保留它可指回答内容或回答方式的余地。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而口语自然的现代汉语。“传话”补足汉语表达所需的交际动作；前后重复“这样”，以呈现希伯来文刻意的对应结构。
