  text: וָ/אֹמְרָ֗/ה הַ/אִ֤ישׁ כָּמ֨וֹ/נִי֙ יִבְרָ֔ח וּ/מִ֥י כָמ֛וֹ/נִי אֲשֶׁר יָב֥וֹא אֶל הַ/הֵיכָ֖ל וָ/חָ֑י לֹ֖א אָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/011.yaml
  text: But I said[a], “Should a man like me flee? And who is like me, who could go into the temple and live? I will not go in.”
translation:
  language: zh_hans
  text: 我却说：“像我这样的人，岂能逃跑？又有谁像我这样，能进入圣殿[a]而活呢？我绝不进去！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣所”。这里可能不只是说躲进建筑物，而是指进入圣殿中受到限制的区域；尼希米进入那里并不合宜，这也说明了“而活”这句话的分量。
    reason: 说明הַהֵיכָל的词义范围及上下文可能包含的礼仪限制，同时避免在主文中消除歧义。
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: 我却说
  rationale: 连词推动叙事；结合上下文，尼希米是在反驳先前的提议，因此用“却”自然表达转折。
- source_word: הָאִישׁ כָּמוֹנִי
  choice: 像我这样的人
  rationale: 这里是修辞性自指，强调尼希米的身份、职责和荣誉，而非指某个特定男子。
- source_word: יִבְרָח
  choice: 逃跑
  rationale: 该动词表示因惧怕而逃离；“逃跑”在现代汉语中清楚保留了此处的道德和修辞力度。
- source_word: וּמִי כָמוֹנִי
  choice: 又有谁像我这样
  rationale: 保留原文与前一句相呼应的修辞问句及对自身身份的强调。
- source_word: אֲשֶׁר יָבוֹא
  choice: 竟能进入
  rationale: 希伯来语关系从句较为省略；“竟能”表达反问中的不可思议和不应当之意，同时不把具体原因写死。
- source_word: הַהֵיכָל
  choice: 圣殿
  rationale: 此词在这里指圣殿建筑或其中的圣所区域。“圣殿”是普通读者最清楚的主文译法，具体空间范围的可能性留在脚注说明。
- source_word: וָחָי
  choice: 而活
  rationale: 尽量贴近原文，保留“进入之后仍活着”与“借此保命”之间的张力，不明确限定为哪一种。
- source_word: לֹא אָבוֹא
  choice: 我绝不进去
  rationale: 重现前句“进入”的空间动作；“绝不”自然传达尼希米坚决拒绝的语气。
theological_decisions:
- issue: 进入圣殿所包含的含义
  choice: 主文保持“进入圣殿而活”的宽泛表达，脚注提示可能涉及进入受限制的圣所区域。
  alternative: 仅理解为尼希米拒绝躲进一座建筑物避难。
  rationale: 上下文（尼6:10—13）表明，这项建议意在诱使尼希米犯罪并使他名誉受损；但本节本身没有明说具体禁令，因此不在主文中把这一含义解释得过满。
- issue: וָחָי所表达的结果
  choice: 译作“而活”，保留其可能指进入后仍存活，也可能指进去避难以保命。
  alternative: 明确译作“保住性命”。
  rationale: “保住性命”容易把经文只理解成避难策略；较直译的表达能保留原文与圣所限制有关的潜在威胁和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个反问保留原文的平行和强烈语气；“我绝不进去”简洁地呈现最终拒绝。脚注标记紧随其所解释的“圣殿”。
