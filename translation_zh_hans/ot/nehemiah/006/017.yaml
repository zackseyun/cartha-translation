  to: 那时，犹大的显贵频频把信送给多比雅；多比雅送来的信也不断送到他们那里。[a]
  rationale: 修订以“频频把信送给”保留原文信件递送与反复发生的语义，避免加入“写作”这一未明说的动作；以“显贵”更稳妥地表达犹大社会中的显要人士。第二分句明确为“多比雅送来的信”，并在脚注中保留原文省略结构及其解释的不确定性。
