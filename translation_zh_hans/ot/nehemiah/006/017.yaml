  yaml_path: translation/ot/nehemiah/006/017.yaml
  text: Also[a], in those days the nobles of Judah were sending many letters to Tobiah, and those from Tobiah were coming to them.
translation:
  language: zh_hans
  text: 那时，犹大的显贵频频把信送给多比雅；多比雅送来的信也不断送到他们那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“他们的信去到多比雅那里，属于多比雅的那些来到他们那里。”后半句很可能根据前半句省略了“信”；因此译作“多比雅送来的信”。
    reason: 说明原文的字面结构、后半句省略的名词，以及按上下文平行关系对属格短语所作的理解。
lexical_decisions:
- source_word: גַּם
  choice: 还
  rationale: 表达在前文所述情形之外另有一事，保留附加语气，并自然连接上下文。
- source_word: בַּיָּמִים הָהֵם
  choice: 那些日子
  rationale: 按希伯来语常用时间表达直译，庄重而自然。
- source_word: מַרְבִּים
  choice: 常常写信
  rationale: 该分词在此与“信”连用，表达持续、频繁的通信；“常常”体现反复性，“写信给”则符合现代汉语习惯。
- source_word: חֹרֵי יְהוּדָה
  choice: 犹大的贵族
  rationale: 此词指犹大社会中地位显要的领袖阶层；“贵族”比泛称“官员”更贴近其社会身份。
- source_word: אִגְּרֹתֵיהֶם הוֹלְכוֹת עַל טוֹבִיָּה
  choice: 写信给多比雅
  rationale: 原文较直译为“他们的信去到多比雅那里”；译文采用自然汉语表达通信行为，同时以脚注保留原文形式。
- source_word: וַאֲשֶׁר לְטוֹבִיָּה
  choice: 多比雅的信
  rationale: 原文为省略结构，字面是“属于多比雅的那些”；根据前半句平行关系补出“信”，但在脚注中说明这一补足。
- source_word: בָּאוֹת אֲלֵיהֶם
  choice: 不断寄到他们那里
  rationale: 分词体现持续或反复发生；“寄到”明确表达书信抵达，符合现代汉语。
