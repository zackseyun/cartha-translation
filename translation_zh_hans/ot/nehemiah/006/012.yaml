  text: וָ/אַכִּ֕ירָ/ה וְ/הִנֵּ֥ה לֹֽא אֱלֹהִ֖ים שְׁלָח֑/וֹ כִּ֤י הַ/נְּבוּאָה֙ דִּבֶּ֣ר עָלַ֔/י וְ/טוֹבִיָּ֥ה וְ/סַנְבַלַּ֖ט שְׂכָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/012.yaml
  text: Then I recognized, and behold, God had not sent him; rather, he had spoken the prophecy against me because Tobiah and Sanballat had hired him.
translation:
  language: zh_hans
  text: 我就看出，原来不是上帝差他来的；他之所以说这预言攻击我，是因为多比雅和参巴拉收买了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַכִּירָה
  choice: 我就看出
  rationale: 该词表示尼希米辨明、识破了实情；“看出”在现代汉语中自然，并保留认知过程。
- source_word: וְהִנֵּה
  choice: 原来
  rationale: 此处引出识破后的事实，译作“原来”比直译“看哪”更符合现代汉语叙事，同时保留揭示意味。
- source_word: הַנְּבוּאָה דִּבֶּר עָלַי
  choice: 说这预言攻击我
  rationale: דבר עלי 在此语境中指针对尼希米说出预言；“攻击我”表达敌对指向，又没有把“预言”改译为较弱的“话”。
- source_word: שְׂכָרוֹ
  choice: 收买了他
  rationale: 字面为“雇了他”；在阴谋语境中，“收买”自然传达付钱使其作伪的含义。
theological_decisions:
- issue: 示玛雅所说之话是否来自上帝
  choice: 不是上帝差他来的
  alternative: 上帝没有差遣他
  rationale: 保留原文明确否定其神圣差遣的判断，不进一步推断其预言机制或属灵来源。
- issue: הַנְּבוּאָה 的性质
  choice: 这预言
  alternative: 预言的话
  rationale: 保留原文对其言论所使用的“预言”称谓，同时由“不是上帝差他来的”揭示其并非真正出于上帝，避免在译文中提前改称“假预言”而消除原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。分号呈现“并非上帝差遣—而是受人收买”的解释转折；不添加原文没有的专名指代或教派性解释。
