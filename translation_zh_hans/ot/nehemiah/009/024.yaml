  text: וַ/יָּבֹ֤אוּ הַ/בָּנִים֙ וַ/יִּֽירְשׁ֣וּ אֶת הָ/אָ֔רֶץ וַ/תַּכְנַ֨ע לִ/פְנֵי/הֶ֜ם אֶת יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ הַ/כְּנַ֣עֲנִ֔ים וַֽ/תִּתְּנֵ֖/ם בְּ/יָדָ֑/ם וְ/אֶת מַלְכֵי/הֶם֙ וְ/אֶת עַֽמְמֵ֣י הָ/אָ֔רֶץ לַ/עֲשׂ֥וֹת בָּ/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/024.yaml
  text: So the sons came in and took possession of the land[a], and you subdued before them the inhabitants of the land, the Canaanites, and gave them into their hand, both their kings and the peoples of the land[c][b], to do with them according to their will.
translation:
  language: zh_hans
  text: 于是，那些子孙进来，占领了这地[a]。你使这地的居民，就是迦南人，在他们面前屈服，又把迦南人连同他们的君王和这地的各族都交在他们手中[b]，让他们随意处置这些人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “占领了这地”也可译作“得了这地为业”。
    reason: lexical_alternative
  - marker: b
    text: “交在他们手中”意思是“交在他们的权下”。
    reason: idiom_clarification
  - marker: c
    text: 直译：“让他们按自己的意愿对待这些人。”
    reason: literal_rendering
lexical_decisions:
- source_word: הַבָּנִים
  choice: 那些子孙
  rationale: 原文直译为“儿子们”，在上下文中指先祖的后代，即进入迦南的以色列人。“那些子孙”既保留家族世系用语，也比单说“儿子们”更符合现代汉语语境。
- source_word: וַיִּירְשׁוּ אֶת הָאָרֶץ
  choice: 占领了这地
  rationale: ירשׁ 在征服土地的语境中表示取得并占有。“占领”清楚表达主动取得土地的含义；脚注同时保留“得了这地为业”的产业表达。
- source_word: וַתַּכְנַע לִפְנֵיהֶם
  choice: 你使……在他们面前屈服
  rationale: כנע 表示使人降服、受制；此译保留上帝是行动主体及军事政治语境。
- source_word: יֹשְׁבֵי הָאָרֶץ הַכְּנַעֲנִים
  choice: 这地的居民，就是迦南人
  rationale: 保留“居民”和“迦南人”两层表述，并以“就是”自然呈现原文的同位关系。
- source_word: וַתִּתְּנֵם בְּיָדָם
  choice: 把……交在他们手中
  rationale: 保留希伯来语“交在手中”的权力与控制意象；现代汉语也能自然理解。
- source_word: מַלְכֵיהֶם
  choice: 他们的君王
  rationale: 代词自然回指迦南人，忠实保留原文后缀。
- source_word: עַמְמֵי הָאָרֶץ
  choice: 这地的各族
  rationale: עַמְמֵי 为复数，指当地多个群体。“各族”比“人民们”自然，同时保留复数意义。
- source_word: לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם
  choice: 任由他们处置
  rationale: 准确传达“照他们的意愿对待他们”，用语自然凝练；脚注给出较贴近原文结构的译法。
theological_decisions:
- issue: “子孙”的所指
  choice: 理解为进入并占有迦南地的先祖后代
  alternative: 直接解释为“以色列人”
  rationale: 原文使用家族世系词 הַבָּנִים，而非族群名称；保留“子孙”可维持本祷告中先祖与后代之间的叙事联系。
- issue: 征服叙事的力度
  choice: 保留“使……屈服”和“交在……手中”的强烈措辞
  alternative: 弱化为“帮助他们胜过”
  rationale: 原文明确把迦南人被制服并落入以色列人权下归于上帝的行动，翻译不应淡化这种军事政治含义。
- issue: “任由他们处置”的范围
  choice: 保持原文对处置方式不作具体说明
  alternative: 具体解释为杀灭、奴役或其他行动
  rationale: 原文只说“按他们的意愿对待他们”，未明确列出具体行为；译文应保留这种概括性。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“那些子孙”承接先祖与后代的关系；“占领”“屈服”“交在手中”保留原文征服语境的力度，不作神学弱化。所有脚注标记均置于正文相应位置。
