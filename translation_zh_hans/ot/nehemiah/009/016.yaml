  text: וְ/הֵ֥ם וַ/אֲבֹתֵ֖י/נוּ הֵזִ֑ידוּ וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וְ/לֹ֥א שָׁמְע֖וּ אֶל מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/016.yaml
  text: But they[a], our fathers, acted presumptuously and stiffened their neck[c][b], and did not listen to your commandments.
translation:
  language: zh_hans
  text: 然而，他们——我们的祖先——狂妄行事[a]，硬着颈项[b]，不听从[c]你的诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“傲慢行事”或“放肆行事”。
    reason: lexical_alternative
  - marker: b
    text: “硬着颈项”是希伯来语惯用语，表示顽梗、悖逆，不肯顺服。
    reason: cultural_note
  - marker: c
    text: 或译：“不理会”或“不服从”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם וַאֲבֹתֵינוּ
  choice: 然而，他们，就是我们的祖先
  rationale: 独立代词与连接词在上下文中形成转折，故译作“然而”；“我们的祖先”自然表达历代先辈，也保留当前群体与前代的共同认同。“就是”显明“他们”与“我们的祖先”同位。
- source_word: הֵזִידוּ
  choice: 竟狂妄行事
  rationale: 该动词表示出于骄傲、僭越或放肆而行动；“狂妄行事”兼顾态度与行为，“竟”则自然凸显其行为与上文上帝恩惠之间的反差。
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: 硬着颈项
  rationale: 保留希伯来语身体隐喻，并以现代中文可理解的形式表达顽梗、不肯顺服。
- source_word: וְלֹא שָׁמְעוּ אֶל
  choice: 不听从
  rationale: שׁמע אֶל兼有听取、理会并顺从之意；“听从”既保留听的词义，又符合“诫命”作为宾语的自然汉语搭配。
- source_word: מִצְוֺתֶיךָ
  choice: 你的诫命
  rationale: “诫命”准确保留盟约和律法语域，比一般性的“命令”更符合本段历史祷告的语境。
theological_decisions:
- issue: 当前群体与先前犯罪世代的共同认同
  choice: 译作“我们的祖先”
  alternative: 我们的父辈
  rationale: 原文直译为“我们的父亲们”，在此指历代先辈；“我们的祖先”在现代汉语中更自然，也保留祷告者将本群体与以往世代相连的历史和群体认同，不额外引入特定教义。
- issue: 不听诫命所包含的悖逆意味
  choice: 不听从
  alternative: 不听／不服从
  rationale: “不听从”同时呈现原词的听取义与实际不顺服的结果，避免只选“听”而弱化伦理意味，也避免只译“服从”而完全消去听的意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“狂妄行事”保留道德与宗教语境中的僭越意味；“硬着颈项”保留源语隐喻，并用脚注解释。所有脚注标记均置于对应主文表达之后。
