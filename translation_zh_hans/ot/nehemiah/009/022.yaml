revisions:
- from: 你把列国和各族赐给他们，又把这些分给他们，直到各处[a]。于是他们占领了西宏的地，就是希实本王的地，也占领了巴珊王噩的地。
  to: 你把列国和各族赐给他们，又按区域把它们分给他们[a]。于是他们占领了西宏之地，也就是希实本王之地，以及巴珊王噩之地。
  rationale: 修订仅更正困难短语 לְפֵאָה 的误导性、不通顺译法，并相应调整脚注。土地清单保持马所拉文本的结构：西宏之地与希实本王之地以“也就是”呈同位说明，巴珊王噩之地另作并列项目。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:07Z'
