base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/022.yaml
  text: You gave them kingdoms and peoples, and allotted them to every corner. So they took possession of the land of Sihon, that is, the land of the king of Heshbon, and the land of Og king of Bashan.
translation:
  language: zh_hans
  text: 你把列国和各族赐给他们，又按区域把它们分给他们[a]。于是他们占领了西宏之地，也就是希实本王之地，以及巴珊王噩之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按区域”所译的希伯来语含义和句法关系不确定；也可理解为“按份额”或“向各方”。
    reason: 保留 וַתַּחְלְקֵם לְפֵאָה 中“分配”与 פֵאָה 的空间/份额意义，同时不将有争议的短语译成“直到各处”。
lexical_decisions:
- source_word: מַמְלָכוֹת וַעֲמָמִים
  choice: 列国和各族
  rationale: 分别表达“王国”和“各民族、族群”，在现代汉语中简洁自然。
- source_word: וַתַּחְלְקֵם לְפֵאָה
  choice: 又把这些分给他们，直到各处
  rationale: פֵאָה 基本义为“边、角、方位”；句法和所指存在困难，因此正文保留空间分配的概念，并用脚注交代其他可能理解。
- source_word: וַיִּירְשׁוּ
  choice: 占领了
  rationale: 此处指以色列人取得并持有这些土地；“占领”符合叙事语境，也避免“继承”在现代汉语中容易产生的家产含义。
- source_word: אֶרֶץ סִיחוֹן
  choice: 西宏的地
  rationale: 按马所拉文本直译，保留人名与土地之间的所属关系。
theological_decisions:
- issue: “西宏的地”与“希实本王的地”的关系
  choice: 用“就是”表达同位解释
  alternative: 译作两个并列的领地
  rationale: 上下文及民数记21:26支持西宏就是希实本王；将后语理解为对前语的说明最合适，但不增添源文没有的称号。
- issue: לְפֵאָה 的理解
  choice: 正文译为“直到各处”，脚注保留歧义
  alternative: “按区域分给他们”或“把各族分散在各方”
  rationale: 该短语罕见且语义不够确定，不应在正文中无声锁定单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；“列国和各族”“占领”符合普通读者习惯。所有脚注标记均已置于正文。
