  naturalness: “又把这些分给他们，直到各处”在现代汉语中搭配不通，且“这些”的指代与“直到”的逻辑关系不清。改为“又按区域把它们分给他们”庄重、自然，并保留脚注所需的不确定性。
  terminology: “列国和各族”“占领”“西宏、希实本、巴珊、噩”均可接受。将“西宏的地”改作“西宏之地”可使后续同位语与并列宾语更清晰，且维持经文的庄重叙事语体。
