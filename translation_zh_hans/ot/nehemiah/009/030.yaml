source:
  edition: WLC
  text: וַ/תִּמְשֹׁ֤ךְ עֲלֵי/הֶם֙ שָׁנִ֣ים רַבּ֔וֹת וַ/תָּ֨עַד בָּ֧/ם בְּ/רוּחֲ/ךָ֛ בְּ/יַד נְבִיאֶ֖י/ךָ וְ/לֹ֣א הֶאֱזִ֑ינוּ וַֽ/תִּתְּנֵ֔/ם בְּ/יַ֖ד עַמֵּ֥י הָ/אֲרָצֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/030.yaml
  text: For many years you were patient with them and testified against them by your Spirit through your prophets[a], but they would not listen. So you gave them into the hand of the peoples of the lands.
translation:
  language: zh_hans
  text: 多年以来，你一直宽容他们，又借着你的灵，通过你的先知警告他们[a]；他们却不肯听。因此，你把他们交在各地的民族手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“指证他们”。
    reason: 原文动词可表示警告、告诫，也可表示作证反对或指证；脚注保留较强的司法含义。
lexical_decisions:
- source_word: וַתִּמְשֹׁךְ עֲלֵיהֶם שָׁנִים רַבּוֹת
  choice: 多年以来，你一直宽容他们
  rationale: 此处 משׁך 与 עַל 构成延长时日、暂缓处置的表达；结合上下文，译作“一直宽容他们”自然地传达长期忍耐、延迟审判之意，同时保留“多年”的时间重点。
- source_word: וַתָּעַד בָּם
  choice: 又……警告他们
  rationale: עוד 的使役式在此可指作证、告诫或警告。上下文着重先知反复劝戒百姓，因此正文采用现代汉语清楚自然的“警告”；其“作证指控”的司法色彩列入脚注。
- source_word: בְּרוּחֲךָ
  choice: 借着你的灵
  rationale: 介词 בְּ 表示凭借或媒介；在先知传言的语境中，רוּחַ 最合理地指上帝的灵，是先知警告的神圣来源。
- source_word: בְּיַד נְבִיאֶיךָ
  choice: 通过你的先知
  rationale: “在……手中／借……之手”是表示代理或媒介的希伯来语惯用法；“通过你的先知”符合现代汉语表达。
- source_word: וְלֹא הֶאֱזִינוּ
  choice: 他们却不肯听
  rationale: האזין 指留心听从；“不肯听”不仅表达未听，也贴切呈现面对反复警告仍拒绝听从的语境。
- source_word: וַתִּתְּנֵם בְּיַד
  choice: 因此，你把他们交在……手中
  rationale: 连续式在语境中引出前述拒绝的结果。“交在……手中”保留希伯来语“落入其权势”的形象，也为现代读者所能理解。
- source_word: עַמֵּי הָאֲרָצוֹת
  choice: 各地各族
  rationale: 原文两个名词均为复数，指不同地域的诸民族。“各地各族”简洁保留地域与民族的双重含义，并避免误读为全地所有人。
theological_decisions:
- issue: “你的灵”的所指
  choice: 指上帝的灵，作为先知发出警告的神圣媒介
  alternative: 指上帝的气息或心意、性情
  rationale: “借着你的灵、通过你的先知”这一结构最自然地表明，上帝的灵借先知施行劝戒；这样的翻译不额外引入后期教义细节。
- issue: וַתָּעַד בָּם 的警告与作证含义
  choice: 正文译为“警告他们”，脚注保留“作证指控他们”
  alternative: 正文直接译为“作证指控他们”
  rationale: 该动词兼具告诫和作证的语义。正文按先知劝戒的语境采用通顺的“警告”，脚注保存其可能具有的司法或盟约诉讼色彩，不把原文张力静默消除。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“宽容”表达长期容忍与延迟惩罚；“不肯听”呈现持续拒绝；“交在……手中”适度保留圣经希伯来语的形象。脚注标记已在正文相应位置标出。
