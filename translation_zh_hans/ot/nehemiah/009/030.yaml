  naturalness: 正文庄重清楚。“借着你的灵、通过你的先知”虽可理解，但两个近义媒介短语并列稍显滞涩；改为“借着你的灵，通过你的先知”可使层次清晰。
  terminology: “灵”符合先知语境，且不附加后期教义细节；“宽容”“不肯听”“交在……手中”均恰当。“各地的民族”较准确地表达原文复数的“各地/各国之民”。
