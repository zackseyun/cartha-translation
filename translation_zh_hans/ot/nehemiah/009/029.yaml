  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תָּ֨עַד בָּ/הֶ֜ם לַ/הֲשִׁיבָ֣/ם אֶל תּוֹרָתֶ֗/ךָ וְ/הֵ֨מָּה הֵזִ֜ידוּ וְ/לֹא שָׁמְע֤וּ לְ/מִצְוֺתֶ֨י/ךָ֙ וּ/בְ/מִשְׁפָּטֶ֣י/ךָ חָֽטְאוּ בָ֔/ם אֲשֶׁר יַעֲשֶׂ֥ה אָדָ֖ם וְ/חָיָ֣ה בָ/הֶ֑ם וַ/יִּתְּנ֤וּ כָתֵף֙ סוֹרֶ֔רֶת וְ/עָרְפָּ֥/ם הִקְשׁ֖וּ וְ/לֹ֥א שָׁמֵֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/029.yaml
  text: You warned them in order to bring them back to your law[a], but they acted presumptuously and did not listen to your commandments; they sinned against your judgments, by which a man shall live if he does them. They gave a stubborn shoulder, stiffened their neck[b], and would not listen.
translation:
  language: zh_hans
  text: 你警告他们，为要使他们归回你的律法；他们却狂妄行事，不听从你的诫命，违犯了你的典章；人若遵行这些典章，就必因它们而活。[a]他们扭转肩头，硬着颈项，不肯听从。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 参利未记18:5。这里的“人”泛指任何人；“因它们而活”保留原文的表达，未限定其具体含义。
    reason: cross_reference_and_lexical_clarification
  - marker: b
    text: “扭转肩头”和“硬着颈项”都是形容顽固抗拒、不肯顺服的比喻。
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתָּעַד בָּהֶם
  choice: 你警告他们
  rationale: עוד 的使役式在这里表示郑重警戒、劝诫；“警告”自然地表达其力度，也符合本章上帝反复召回百姓的语境。
- source_word: לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  choice: 要使他们回转，归向你的律法
  rationale: 保留 שׁוב 使役式“使之回转”的动态含义；תורה 在此盟约语境中译作“律法”。
- source_word: הֵזִידוּ
  choice: 狂妄行事
  rationale: זיד 指出于傲慢、僭妄而行动，不只是内心骄傲；“狂妄行事”兼顾行为性和悖逆意味。
- source_word: לֹא שָׁמְעוּ לְמִצְוֺתֶיךָ
  choice: 不听从你的诫命
  rationale: “听从”保留 שׁמע 的听闻意象，同时明确包含顺服之意。
- source_word: וּבְמִשְׁפָּטֶיךָ חָטְאוּ בָם
  choice: 反而得罪了你的典章
  rationale: מִשְׁפָּטִים 在这里指上帝所定的法规、典章；“得罪了”表达 חטא 与介词 ב 的敌对或违犯关系。
- source_word: אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  choice: 人若遵行这些典章，就必因它们而活
  rationale: אָדָם 在此为泛指的人，现代汉语用“人”准确自然；条件句表达希伯来文关系从句的语义，并保留“因它们而活”的原文表达及其神学张力。
- source_word: וַיִּתְּנוּ כָתֵף סוֹרֶרֶת
  choice: 他们硬着肩膀
  rationale: 保留“悖逆的肩膀”这一拒不受轭、顽抗的身体隐喻，同时采用较自然的中文表达。
- source_word: וְעָרְפָּם הִקְשׁוּ
  choice: 梗着颈项
  rationale: 这是希伯来文描写顽梗悖逆的惯用隐喻；“梗着颈项”庄重且为中文圣经语域所熟悉。
- source_word: וְלֹא שָׁמֵעוּ
  choice: 不肯听从
  rationale: 末句概括其持续而有意的抗拒；“不肯”突出意志性的拒绝。
theological_decisions:
- issue: “遵行典章便活”的表述
  choice: 人若遵行这些典章，就必因它们而活
  alternative: 人遵行这些典章，就必在其中存活
  rationale: 本句呼应利未记18:5。译文保留行为与生命之间的陈述关系，不将“活”预先限定为今世生存、盟约福分或永生，从而保存原文的神学张力。
- issue: אָדָם 的泛指范围
  choice: 人
  alternative: 一个人／世人
  rationale: 这里的单数 אָדָם 泛指任何人；现代汉语“人”不带不必要的性别限定，也不削弱其代表性和普遍性。
- issue: “硬着肩膀”和“梗着颈项”的双重隐喻
  choice: 保留两个身体隐喻
  alternative: 意译为“顽梗悖逆”
  rationale: 原文并列两个鲜明意象，强调百姓主动抗拒；保留二者比概括性意译更忠实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“律法、诫命、典章”分别对应 תורה、מצוות、משפטים，以保留原文的词汇层次；身体隐喻予以保留，并以脚注说明。
