  text: וּ/תְבוּאָתָ֣/הּ מַרְבָּ֗ה לַ/מְּלָכִ֛ים אֲשֶׁר נָתַ֥תָּה עָלֵ֖י/נוּ בְּ/חַטֹּאותֵ֑י/נוּ וְ/עַ֣ל גְּ֠וִיֹּתֵי/נוּ מֹשְׁלִ֤ים וּ/בִ/בְהֶמְתֵּ֨/נוּ֙ כִּ/רְצוֹנָ֔/ם וּ/בְ/צָרָ֥ה גְדוֹלָ֖ה אֲנָֽחְנוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/037.yaml
  text: Its abundant produce goes to the kings whom you have set over us because of our sins[a]. They rule over our bodies and over our livestock as they please[b], and we are in great distress.
translation:
  language: zh_hans
  text: 这地丰富的出产[a]归给你因我们的罪立在我们之上的那些君王。他们随意辖制我们的身体[b]和牲畜，我们正处在极大的患难中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出产”也可译作“收成”或“产物”；原文的“它的”指上一节所说的那地。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我们本人”或“我们的人身”；原文直译为“我们的身体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְבוּאָתָהּ
  choice: 这地……的出产
  rationale: תְּבוּאָה指土地的出产或收成；阴性单数后缀承接上一节所说的“地”。明说“这地”，使跨节指代在中文中清楚自然。
- source_word: מַרְבָּה
  choice: 丰富的
  rationale: 该词表达增多、丰盛；译作“丰富的”自然修饰“出产”，保留产物丰多之意。
- source_word: לַמְּלָכִים
  choice: 都归了那些君王
  rationale: 介词ל可表达趋向或受益者；“归了”自然传达土地出产落入君王手中、供其享用的意思。
- source_word: אֲשֶׁר נָתַתָּה עָלֵינוּ
  choice: 你把他们立在我们之上
  rationale: נתן与עַל连用在此表示将人置于他人之上掌权；译文直接保留上帝的施事角色。
- source_word: בְּחַטֹּאותֵינוּ
  choice: 因我们的罪
  rationale: 此处בְּ表达原因；“因我们的罪”简洁明确地说明受外邦君王统治的缘由。
- source_word: גְּוִיֹּתֵינוּ
  choice: 我们的身体
  rationale: גְּוִיָּה可指身体；这里与牲畜并列，指百姓自身受君王支配，而不是指尸体。直译保留原文具体而强烈的措辞。
- source_word: מֹשְׁלִים
  choice: 辖制
  rationale: 分词表示持续的统治；在哀诉语境中，“辖制”既传达掌权，也符合其受压迫的语气。
- source_word: וּבִבְהֶמְתֵּנוּ
  choice: 和牲畜
  rationale: בְּהֵמָה在此集合性地指家养牲畜；“牲畜”是现代中文中准确而宽泛的表达。
- source_word: כִּרְצוֹנָם
  choice: 随意
  rationale: 原短语意为“照他们的意愿”；“随意辖制”自然传达君王按自己意愿行使权力。
- source_word: וּבְצָרָה גְדוֹלָה אֲנָחְנוּ
  choice: 我们正处在极大的患难中
  rationale: צָרָה表示患难、困苦；“极大的患难”保留群体哀诉的沉重程度，“正处在”也自然表达当前状态。
theological_decisions:
- issue: 上帝在外邦君王统治中的施事角色
  choice: 译作“因我们的罪，你把他们立在我们之上”，直接陈述上帝因百姓的罪使这些君王居于其上掌权。
  alternative: 可弱化为上帝只是“容许”这些君王统治，或强化为上帝认可君王所做的一切。
  rationale: 希伯来文נָתַתָּה עָלֵינוּ直接把百姓的臣服归于上帝的行动，并以בְּחַטֹּאותֵינוּ说明其与罪有关；但经文本身并未说上帝赞同君王任意辖制的一切行为，因此译文既不削弱上帝的施事角色，也不增加道德认可的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“都归了”清楚表达出产落入君王手中；“辖制”比中性的“治理”更贴合患难与受压迫的语境。保留“身体”这一具体措辞，并用脚注说明其在上下文中指百姓本人。
