  text: וְ/הֵ֣ם בְּ/מַלְכוּתָ/ם֩ וּ/בְ/טוּבְ/ךָ֨ הָ/רָ֜ב אֲשֶׁר נָתַ֣תָּ לָ/הֶ֗ם וּ/בְ/אֶ֨רֶץ הָ/רְחָבָ֧ה וְ/הַ/שְּׁמֵנָ֛ה אֲשֶׁר נָתַ֥תָּ לִ/פְנֵי/הֶ֖ם לֹ֣א עֲבָד֑וּ/ךָ וְֽ/לֹא שָׁ֔בוּ מִ/מַּֽעַלְלֵי/הֶ֖ם הָ/רָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/035.yaml
  text: Even in their kingdom[a], and amid your great goodness that you gave them, and in the broad and fertile land that you set before them[d][c][b], they did not serve you and did not turn from their evil deeds.
translation:
  language: zh_hans
  text: 他们在自己的国中[a]，在你所赐给他们的丰盛恩惠中，又在你摆在他们面前的宽广肥沃之地[b]上，仍不事奉你[c]，也不转离自己的恶行[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他们的王权之下”或“在他们的国度中”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“宽广肥沃（字面‘肥’）之地”；“肥”用于土地，指土地肥沃、丰饶。
    reason: cultural_note
  - marker: c
    text: 或译“敬拜你”；原文动词也可包括服事、顺服和敬拜。
    reason: lexical_alternative
  - marker: d
    text: 或译“也不为自己的恶行悔改”；原文直译为“也不从他们的恶行转离”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַלְכוּתָם
  choice: 在自己的国中
  rationale: מַלְכוּת可指王权、统治或国度；此处回顾百姓在本国安居并享有国家主权的时期，“在自己的国中”贴近原文，也符合现代汉语。
- source_word: וּבְטוּבְךָ הָרָב
  choice: 享受你赐给他们的丰盛恩惠
  rationale: טוּב兼有良善、厚恩和丰裕供应之意。结合后面的“你赐给他们”，译作“丰盛恩惠”保留上帝良善与慷慨供应两层含义；补出“享受”使连续的介词结构在汉语中自然。
- source_word: אֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה
  choice: 宽广肥沃的土地
  rationale: רְחָבָה意为宽广；שְׁמֵנָה字面为“肥的”，用于土地时是肥沃、丰饶之意。“宽广肥沃”准确而自然。
- source_word: אֲשֶׁר נָתַתָּ לִפְנֵיהֶם
  choice: 你摆在他们面前
  rationale: לִפְנֵיהֶם字面意为“在他们面前”。“摆在他们面前”保留原有空间意象，也表达上帝将土地赐予并交在他们面前。
- source_word: לֹא עֲבָדוּךָ
  choice: 不事奉你
  rationale: עבד用于对上帝的关系时，涵盖服事、顺服和敬拜。“事奉”保留这一较宽的盟约性含义，不把语义缩窄为礼仪性的敬拜。
- source_word: וְלֹא שָׁבוּ מִמַּעַלְלֵיהֶם הָרָעִים
  choice: 也不离弃自己的恶行
  rationale: שׁוב与介词מן连用，表示从某事转离。汉语“离弃恶行”自然地表达这一具体动作，同时避免直接用“悔改”替代原文的转离意象。
theological_decisions:
- issue: עבד用于人与上帝的关系
  choice: 事奉你
  alternative: 敬拜你
  rationale: 该动词既可涉及敬拜，也包含服事与顺服；“事奉”较完整地保留其神学范围。
- issue: שׁוב מִן在道德语境中的表达
  choice: 不离弃自己的恶行
  alternative: 不为自己的恶行悔改
  rationale: 原文具体说从恶行转离。“离弃”保留这一动作图像，不将其直接改写成较抽象、神学化的“悔改”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“却仍”突出他们虽蒙厚恩仍不事奉上帝的强烈反差；不添加原文没有的宗派性解释。
