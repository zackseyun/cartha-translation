  text: אַ֗ף כִּֽי עָשׂ֤וּ לָ/הֶם֙ עֵ֣גֶל מַסֵּכָ֔ה וַ/יֹּ֣אמְר֔וּ זֶ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר הֶעֶלְ/ךָ֖ מִ/מִּצְרָ֑יִם וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/018.yaml
  text: Even when they made for themselves a cast metal calf and said[a], ‘This is your god who brought you up out of Egypt,’ and committed great blasphemies[b],
translation:
  language: zh_hans
  text: 即使他们为自己铸造了一头牛犊，说：“这就是你的神，是他把你从埃及领上来的。”他们又以极其亵渎的行为冒犯你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以极其亵渎的行为冒犯你”也可译作“做了极其惹你发怒的事”或“做了极其轻蔑的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: 即使
  rationale: 在上下文中引出让步情形：即使百姓犯下造偶像的重罪，神仍没有离弃他们；“即使”简洁自然，并保留与下一节的句法衔接。
- source_word: עָשׂוּ לָהֶם
  choice: 他们为自己铸造了
  rationale: “为自己”保留 לָהֶם 的反身、受益含义，表明他们制造偶像供自己使用和敬拜。
- source_word: עֵגֶל מַסֵּכָה
  choice: 一头牛犊
  rationale: 结合动词“铸造”表达 מַסֵּכָה 所指的铸造偶像；“牛犊”准确呈现 עֵגֶל，避免汉语中“铸造的一头铸像牛犊”的累赘。
- source_word: זֶה אֱלֹהֶיךָ
  choice: 这就是你的神
  rationale: 希伯来文的指示词和第二人称后缀均为单数形式；译作单数“神”，保留百姓对牛犊所作的宣称，而不承认其正当性。
- source_word: אֲשֶׁר הֶעֶלְךָ מִמִּצְרָיִם
  choice: 是他领你从埃及上来的
  rationale: “领……从埃及上来”保留出埃及叙事中 עלה מן 的惯用表达；补出“是他”使关系从句在现代汉语中清楚自然。
- source_word: וַיַּעֲשׂוּ נֶאָצוֹת גְּדֹלוֹת
  choice: 他们还做了大大亵渎你的事
  rationale: נֶאָצוֹת 表示蔑视、侮慢或亵渎性的行为；“亵渎你的事”在本祷告向神说话的语境中明确其对象，“大大”保留 גְּדֹלוֹת 的强烈程度。
theological_decisions:
- issue: 偶像语境中 אֱלֹהֶיךָ 的处理
  choice: 你的神
  alternative: 你的上帝；你的众神
  rationale: 原文就近形态为单数，故不用“众神”；这句话是引述百姓的偶像崇拜宣称，译文不加解释性贬称，以免替原文预先化解其讽刺与神学张力。
- issue: נֶאָצוֹת 的神向含义
  choice: 亵渎你的事
  alternative: 惹你发怒的事；轻蔑的事
  rationale: 该词可泛指蔑视、侮慢或挑衅行为；此处祷告直接向神陈述金牛犊事件，因此“亵渎你的事”自然表达对神的公然冒犯，同时用脚注保留较宽的词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的祷告叙事语体。全节在原文中是通向下一节“你仍没有离弃他们”的让步从句，因此以“即使”开头并保留未完全收束的衔接感；引语按现代汉语调整语序。
