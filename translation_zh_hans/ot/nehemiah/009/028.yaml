language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/כְ/נ֣וֹחַ לָ/הֶ֔ם יָשׁ֕וּבוּ לַ/עֲשׂ֥וֹת רַ֖ע לְ/פָנֶ֑י/ךָ וַ/תַּֽעַזְבֵ֞/ם בְּ/יַ֤ד אֹֽיְבֵי/הֶם֙ וַ/יִּרְדּ֣וּ בָ/הֶ֔ם וַ/יָּשׁ֨וּבוּ֙ וַ/יִּזְעָק֔וּ/ךָ וְ/אַתָּ֞ה מִ/שָּׁמַ֧יִם תִּשְׁמַ֛ע וְ/תַצִּילֵ֥/ם כְּֽ/רַחֲמֶ֖י/ךָ רַבּ֥וֹת עִתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/028.yaml
  text: But when they had rest, they again did evil before you; so you left them in the power of their enemies[a], who ruled over them. Then they returned and cried out to you, and from heaven you heard and delivered them many times according to your mercies.
translation:
  language: zh_hans
  text: 但他们得享安歇时，又在你面前行恶；于是你把他们交在仇敌的权下[a]，仇敌便辖制他们。后来他们回转，向你呼求；你就从天上垂听，照你的怜悯多次解救他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在他们仇敌的手中”；这是希伯来语习语，表示处在仇敌的权势或控制之下。
    reason: cultural_note
lexical_decisions:
- source_word: וּכְנוֹחַ לָהֶם
  choice: 但他们一得安歇
  rationale: כְּ加不定式结构表示“当……时”；“一得安歇”自然表达进入安定状态，但不加入原文没有的“立刻/马上”。
- source_word: יָשׁוּבוּ לַעֲשׂוֹת רַע
  choice: 就又……行恶
  rationale: שׁוב加不定式在此表示重复某行动；译作“又行恶”比字面化的“回去行恶”更符合现代汉语。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 保留“在你面前/面容之前”的关系性意象，不缩减为单纯的“在你看来”，也不加强为“得罪你”。
- source_word: וַתַּעַזְבֵם בְּיַד אֹיְבֵיהֶם
  choice: 于是你把他们交在仇敌的权下
  rationale: עזב在上下文中指神撤去保护、任凭他们落入敌手；“交在……权下”既保留审判的严肃性，又避免暗示永久弃绝。
- source_word: וַיִּרְדּוּ בָהֶם
  choice: 仇敌便辖制他们
  rationale: 该动词在此表示施行统治或支配；“辖制”符合受敌人控制的历史语境，而不额外加入“欺压”等含义。
- source_word: וַיָּשׁוּבוּ וַיִּזְעָקוּךָ
  choice: 后来他们回转，向你呼求
  rationale: 此处שׁוב保留实际的“回转”意义，与前一句表示重复行为的用法区分；זעק表达急切求助的呼喊。
- source_word: מִשָּׁמַיִם תִּשְׁמַע
  choice: 你就从天上垂听
  rationale: 保留前置的来源短语“从天上”；“垂听”是自然而庄重的汉语圣经语体，也传达神回应呼求。
- source_word: וְתַצִּילֵם
  choice: 解救他们
  rationale: נצל在此具体指从仇敌手中搭救；“解救”准确而不引入更宽泛的系统神学含义。
- source_word: כְּרַחֲמֶיךָ רַבּוֹת עִתִּים
  choice: 照你的怜悯多次
  rationale: 按马所拉重音和句法，רבות修饰עתים，即“多次”，而不是修饰“怜悯”；“照你的怜悯”保留神施行解救的根据。
theological_decisions:
- issue: 神任凭百姓落入仇敌之手的表述
  choice: 你把他们交在仇敌的权下
  alternative: 你弃绝他们，把他们交在仇敌手中
  rationale: 上下文描写的是神撤去保护所施行的盟约审判，随后仍垂听并解救他们；所选译法保留审判力度，却不暗示彻底或永久的弃绝。
- issue: 末句未完成式的反复性
  choice: 你就从天上垂听，照你的怜悯多次解救他们
  alternative: 你屡次从天上垂听并解救他们
  rationale: 此处未完成式在历史概述中可表达反复发生的过去行动；以“多次”明确表达反复性，同时忠实保留“多次”直接修饰解救事件的句法。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“安歇”“辖制”“垂听”略带经文语体，但普通读者易懂；通过分号和重复主语清楚呈现背叛、受制、回转、蒙救的循环。
