  naturalness: 整体庄重、清楚，符合现代汉语经文语体。“得享安歇时”自然地表达时间背景，并避免“一得……就……”的过强即时意味。
  terminology: “行恶”“回转”“呼求”“垂听”“解救”在本段历史—祷告语境中准确且一致。“仇敌的权下”以自然汉语表达“在仇敌手中”的控制性习语，脚注保留原文意象。
