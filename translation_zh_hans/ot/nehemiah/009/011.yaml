  text: וְ/הַ/יָּם֙ בָּקַ֣עְתָּ לִ/פְנֵי/הֶ֔ם וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְֽ/אֶת רֹ֨דְפֵי/הֶ֜ם הִשְׁלַ֧כְתָּ בִ/מְצוֹלֹ֛ת כְּמוֹ אֶ֖בֶן בְּ/מַ֥יִם עַזִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/011.yaml
  text: You split the sea before them[a], and they passed through the midst of the sea on dry ground[b]; and you threw their pursuers into the depths like a stone in mighty waters.
translation:
  language: zh_hans
  text: 你在他们面前把海劈开[a]，他们在干地上从海中穿过；你把追赶他们的人投入深处，如石头落在浩大的水中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“分开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַעְתָּ
  choice: 劈开
  rationale: 该动词意为劈开、裂开；“劈开”生动而自然，保留海被打开的具体动作。
- source_word: לִפְנֵיהֶם
  choice: 在他们面前
  rationale: 直接表达“在他们前面”，符合祷告回顾历史事件的语体。
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: 从海中穿过
  rationale: 兼顾动词“经过、穿越”和 תוֹךְ 所表达的海之内部，现代汉语自然顺畅。
- source_word: בַּיַּבָּשָׁה
  choice: 在干地上
  rationale: 准确呈现海床成为干地这一叙事重点。
- source_word: רֹדְפֵיהֶם
  choice: 追赶他们的人
  rationale: 将分词具体译出，清楚指正在追击他们的人。
- source_word: הִשְׁלַכְתָּ
  choice: 抛进
  rationale: 表达使役形所含的投掷动作，并与后面的“深渊”自然搭配。
- source_word: בִמְצוֹלֹת
  choice: 深渊
  rationale: 该词指水的深处；“深渊”简洁保留深水吞没追兵的意象。
- source_word: כְּמוֹ אֶבֶן
  choice: 如石头
  rationale: 忠实保留原文简洁有力的明喻。
- source_word: בְּמַיִם עַזִּים
  choice: 落在汹涌的水中
  rationale: עַזִּים 可指强劲、有力；在水的语境中“汹涌”自然传达其力量。“落”由石头被抛入水中的比喻关系引出，使汉语完整，但不改变核心意象。
theological_decisions:
- issue: 出埃及回顾中的上帝行动
  choice: 保留第二人称直接称呼：“你……劈开”“你……抛进”
  alternative: 改为第三人称或非人称叙述
  rationale: 本节属于群体祷告，原文用第二人称直接述说上帝的历史性拯救与审判；保留这一人称可维持赞美和纪念的神学力度。
translation_notes:
  register: 采用现代、庄重而易懂的祷告叙事语体；保持两个第二人称动作的平行结构。原英文脚注 b 与其正文位置及所述词项不一致，且希伯来原文没有足以支持该处另译“进入深处”的独立歧义，因此未沿用，以免制造错误对应。
