revisions:
- from: 你在他们面前把海劈开[a]，他们就在干地上从海中穿过；你把追赶他们的人抛进深渊，如石头落在汹涌的水中。
  to: 你在他们面前把海劈开[a]，他们在干地上从海中穿过；你把追赶他们的人投入深处，如石头落在浩大的水中。
  rationale: 仅作两项安全的词语调整：“深处”更准确表达海的深处，“浩大的水”避免把“强大之水”具体解释为“汹涌”。其余措辞及唯一有来源依据的词汇备选脚注均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:01Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了祷告中对上帝的第二人称称述、海被劈开、百姓经海中而行、追兵被投入水深之处，以及“如石头”的比喻。惟“深渊”较易指陆地裂谷或抽象的无底深坑，不如“深处”准确对应 מְצוֹלוֹת 所指海水深处；“汹涌”则较“强大／浩大”更明确加入了原文未必含有的浪涛动态。
  naturalness: “在干地上从海中穿过”自然通顺。将末句调整为“投入深处，如石头落在浩大的水中”，既保持现代庄重语体，也使比喻在汉语中完整顺畅。
  terminology: “劈开”“干地”“追赶他们的人”均恰当。“深处”比“深渊”更适合此处的海洋语境；“浩大的水”可传达 עַזִּים 的强大、威力，避免将其具体化为“汹涌”。
