source:
  edition: WLC
  text: וְ/אַתָּה֙ בְּ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֔ים לֹ֥א עֲזַבְתָּ֖/ם בַּ/מִּדְבָּ֑ר אֶת עַמּ֣וּד הֶ֠/עָנָן לֹא סָ֨ר מֵ/עֲלֵי/הֶ֤ם בְּ/יוֹמָם֙ לְ/הַנְחֹתָ֣/ם בְּ/הַ/דֶּ֔רֶךְ וְ/אֶת עַמּ֨וּד הָ/אֵ֤שׁ בְּ/לַ֨יְלָה֙ לְ/הָאִ֣יר לָ/הֶ֔ם וְ/אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
translation:
  language: zh_hans
  text: 但你因你丰盛的怜悯[a]，没有在旷野撇弃他们。白天，云柱没有从他们上方离开，为要在路上引导他们；夜间，火柱也没有离开，为要照亮他们和他们要走的路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因你极大的慈悲。”希伯来文直译为“因你许多的怜悯”。
    reason: 保留רַחֲמִים的复数形式，并说明הָרַבִּים可表达“许多”或“极大”。
lexical_decisions:
- source_word: בְּרַחֲמֶיךָ הָרַבִּים
  choice: 因丰盛的怜悯
  rationale: רַחֲמִים虽为复数形式，在现代汉语中通常自然地以集合性单数“怜悯”表达；הָרַבִּים以“丰盛的”呈现其丰富、众多之意。介词ב在此可表达上帝不撇弃他们的依据或动因，译作“因”自然清楚。
- source_word: עֲזַבְתָּם
  choice: 没有把他们撇弃
  rationale: עזב可指离开、弃绝；“撇弃”既保留不离弃的关系意味，又符合庄重而通俗的现代汉语。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是以色列出埃及行程语境中对מִדְבָּר的准确常用译法，不把地貌收窄为沙漠。
- source_word: עַמּוּד הֶעָנָן
  choice: 云柱
  rationale: 采用简明、传统且透明的汉语构词，并与“火柱”形成平行。
- source_word: לֹא סָר מֵעֲלֵיהֶם
  choice: 没有从他们上方离开
  rationale: 保留סור“离开”以及מֵעֲלֵיהֶם“从他们上方”的空间含义。
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  choice: 引导他们走路
  rationale: נחה使役形为“引导”；בְּהַדֶּרֶךְ在行程语境中指在路上行进，汉语“引导他们走路”自然呈现其功能。
- source_word: עַמּוּד הָאֵשׁ
  choice: 火柱
  rationale: 与“云柱”平行，并承接出埃及叙事的固定意象。
- source_word: לְהָאִיר לָהֶם וְאֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  choice: 照亮他们和他们当走的路
  rationale: 保留וְאֶת所显示的并列宾语结构：火柱照亮他们，也照亮他们要走的路；“当走的路”简洁表达未完成式在关系从句中的预期或应当前行意味。
theological_decisions:
- issue: 上帝怜悯的复数形式
  choice: 正文译作“丰盛的怜悯”，脚注说明希伯来文直译为“你许多的怜悯”。
  alternative: “你极大的慈悲”或正文直接译作“你许多的怜悯”
  rationale: 现代汉语通常不把“怜悯”复数化；正文保持自然，同时用脚注保留原文复数及“许多”的强调，不把丰富多重的怜悯行为完全压平。
- issue: 火柱照明对象的句法关系
  choice: 译为“照亮他们和他们当走的路”，保留两个并列对象。
  alternative: “照亮他们所当走的路”或“使他们在当走的路上有光”
  rationale: וְאֶת הַדֶּרֶךְ最直接地将“路”标为与“他们”协调的受词；不改写为纯方位成分，以免消除原文略显特殊但真实存在的句法张力。
- issue: 云柱与火柱持续同在
  choice: 后半句补出“也没有离开，仍”，使汉语清楚呈现לֹא סָר同时支配两个平行主语。
  alternative: 只在云柱分句中保留“没有离开”，让火柱分句省略谓语
  rationale: 希伯来文通过并列结构使否定谓语延续到火柱；现代汉语若完全照搬省略容易误读，因此显明补足，但不增加新的神学主张。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“撇弃”“旷野”“云柱”“火柱”保留圣经叙事的熟悉表达；通过“白天……夜间……”维持原文平行结构，并适度补出汉语所需的省略成分。
