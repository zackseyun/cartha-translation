source:
  edition: WLC
  text: וַ/יָּק֨וּמוּ֙ עַל עָמְדָ֔/ם וַֽ/יִּקְרְא֗וּ בְּ/סֵ֨פֶר תּוֹרַ֧ת יְהוָ֛ה אֱלֹהֵי/הֶ֖ם רְבִעִ֣ית הַ/יּ֑וֹם וּ/רְבִעִית֙ מִתְוַדִּ֣ים וּ/מִֽשְׁתַּחֲוִ֔ים לַ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/003.yaml
  text: And they stood in their place[a], and they read from the Book of the Law of Yahweh their God for a fourth of the day[b]; and for another fourth they were confessing and bowing down to Yahweh their God.
translation:
  language: zh_hans
  text: 他们站在各自的位置上[a]，用一天四分之一的时间诵读他们的上帝耶和华的律法书[b]；又用一天四分之一的时间认罪，并向他们的上帝耶和华俯伏敬拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他们站立的地方”，也可能指“在他们所站的平台上”。原文表达较为简略。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“一天的四分之一……又四分之一”；即一天的四分之一用于诵读，另四分之一用于认罪和俯伏敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֨וּמוּ עַל עָמְדָם
  choice: 他们站在自己的位置上
  rationale: קום在叙事中表示站立；压缩的短语עַל עָמְדָם可指他们站立的位置。译文采用自然汉语，同时不把它具体化为台子。
- source_word: וַיִּקְרְאוּ בְּסֵפֶר תּוֹרַת
  choice: 诵读……律法书
  rationale: קרא与书卷连用表示从书中宣读；“诵读”既体现有文字文本，也适合会众礼仪场景。ספר可指书卷，但正文用现代读者熟悉的“书”，不额外限定载体形态。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中广为人知的专名“耶和华”音译四字神名，保留其作为以色列上帝名字的性质，而不以称号替代。
- source_word: רְבִעִית הַיּוֹם וּרְבִעִית
  choice: 用一天四分之一的时间……又用一天四分之一的时间
  rationale: 保留原文两个“四分之一”的平行结构，并在第二处补足汉语所需的时间表达；不擅自换算为小时。
- source_word: מִתְוַדִּים
  choice: 认罪
  rationale: Hitpael分词在此表示持续进行的承认行为；本段禁食、披麻和与外族隔离的语境表明所承认的是罪，因此“认罪”自然明确。持续意味由“四分之一的时间”表达。
- source_word: וּמִשְׁתַּחֲוִים
  choice: 俯伏敬拜
  rationale: 该动词兼有俯身、下拜及敬拜含义。“俯伏敬拜”既保留身体动作，也明确在耶和华面前的礼拜语境。
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: 向耶和华他们的上帝
  rationale: 介词ל指明动作的对象或方向；“向”自然表达他们俯伏敬拜的对象。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 正文保留神的专名而不以“主”这一称号替换；“耶和华”是现代中文普通读者最熟悉且庄重的专名形式。
- issue: מִשְׁתַּחֲוִים应侧重身体姿态还是抽象敬拜
  choice: 俯伏敬拜
  alternative: 俯伏；敬拜
  rationale: 原词在本语境中同时涉及身体下拜和对上帝的敬拜。合译可保留两层含义，不把它简化为纯身体动作或纯抽象礼拜。
- issue: מִתְוַדִּים所承认的内容
  choice: 认罪
  alternative: 承认；忏悔
  rationale: 虽然动词本身可泛指承认，但上下文的禁食、披麻及与外族隔离使认罪含义明确。“认罪”避免“忏悔”可能附带的特定宗派色彩。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留希伯来文两个时间段的平行关系；“诵读”“认罪”“俯伏敬拜”适合公共礼仪场景，但避免古奥措辞和宗派化术语。
