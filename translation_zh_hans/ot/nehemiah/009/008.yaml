id: NEH.9.8
reference: Nehemiah 9:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מָצָ֣אתָ אֶת לְבָב/וֹ֮ נֶאֱמָ֣ן לְ/פָנֶי/ךָ֒ וְ/כָר֨וֹת עִמּ֜/וֹ הַ/בְּרִ֗ית לָ/תֵ֡ת אֶת אֶרֶץ֩ הַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הָ/אֱמֹרִ֧י וְ/הַ/פְּרִזִּ֛י וְ/הַ/יְבוּסִ֥י וְ/הַ/גִּרְגָּשִׁ֖י לָ/תֵ֣ת לְ/זַרְע֑/וֹ וַ/תָּ֨קֶם֙ אֶת דְּבָרֶ֔י/ךָ כִּ֥י צַדִּ֖יק אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/008.yaml
  text: You found his heart faithful before you[a], and made a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, the Perizzite, the Jebusite, and the Girgashite—to give it to his offspring. And you have fulfilled your words[c][b], for you are righteous.
translation:
  language: zh_hans
  text: 你看出他在你面前有一颗忠信的心，就与他立约，要把迦南人、赫人、亚摩利人、比利洗人、耶布斯人和革迦撒人的土地赐下，赐给他的后裔[a]。你也成就了你的话[b]，因为你是公义的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文直译为“种子”，是表示众多后代的集合性单数名词。
    reason: lexical_alternative
  - marker: b
    text: “成就了”也可译作“使……成立”或“证实了”。
    reason: lexical_alternative
  - marker: c
    text: “公义的”也可译作“公正的”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָצָאתָ אֶת־לְבָבוֹ נֶאֱמָן לְפָנֶיךָ
  choice: 你看出他在你面前有一颗忠信的心
  rationale: “看出”自然表达מצא在此处鉴察并认定的含义；“心”保留לבב所指的内在意志与品格；“忠信”体现נאמן的可靠、信实之意，同时保留“在你面前”的关系和评定意味。
- source_word: וְכָרוֹת עִמּוֹ הַבְּרִית
  choice: 就与他立约
  rationale: כרת ברית是固定用语，现代汉语以“立约”最自然准确；不直译为“切约”。
- source_word: לָתֵת ... לָתֵת לְזַרְעוֹ
  choice: 要把……土地赐下，赐给他的后裔
  rationale: 保留原文两次לָתֵת的重复，呈现立约的内容和受益对象；“赐”符合上帝赐予土地的语境。
- source_word: אֶרֶץ הַכְּנַעֲנִי ... וְהַגִּרְגָּשִׁי
  choice: 迦南人、赫人、亚摩利人、比利洗人、耶布斯人和革迦撒人的土地
  rationale: 各族名在希伯来文中为集合性单数；汉语用通行族名并以“人的土地”表达其共同管有的地域。
- source_word: לְזַרְעוֹ
  choice: 他的后裔
  rationale: זֶרַע为集合性单数，可指一个人的后代整体；“后裔”在现代汉语中清楚自然，脚注说明其字面和语法特征。
- source_word: וַתָּקֶם אֶת־דְּבָרֶיךָ
  choice: 你也成就了你的话
  rationale: קום使役式与“话”搭配时表示使之成立、实现；“成就”既传达应验落实，也保留דברים的复数概念，不直接改译为“应许”。
- source_word: כִּי צַדִּיק אָתָּה
  choice: 因为你是公义的
  rationale: כִּי在此说明上帝成就其话的原因；“公义”保留צַדִּיק兼具正直、正当和守约可信的宽广含义。
theological_decisions:
- issue: צַדִּיק用于描述上帝时的译法
  choice: 公义的
  alternative: 公正的
  rationale: “公义”比“公正”含义更宽，不把本节关于守约信实的赞美限缩为司法意义；脚注保留“公正”的可能译法。
- issue: וַתָּקֶם אֶת־דְּבָרֶיךָ所表达的应验程度
  choice: 成就了你的话
  alternative: 使你的话成立／证实了你的话
  rationale: 上下文赞美上帝履行盟约，“成就”最贴合使所说之话成为事实的语境，但原词也可侧重确立或证实，因此在脚注保留替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“忠信”保留圣经语境中的可靠与信实；族名采用简体中文圣经传统中通行的译名。句中保留原文“赐下，赐给”的重复，以呈现希伯来文的强调和盟约结构。
