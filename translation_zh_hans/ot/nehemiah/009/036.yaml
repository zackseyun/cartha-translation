source:
  edition: WLC
  text: הִנֵּ֛ה אֲנַ֥חְנוּ הַ/יּ֖וֹם עֲבָדִ֑ים וְ/הָ/אָ֜רֶץ אֲשֶׁר נָתַ֣תָּה לַ/אֲבֹתֵ֗י/נוּ לֶ/אֱכֹ֤ל אֶת פִּרְיָ/הּ֙ וְ/אֶת טוּבָ֔/הּ הִנֵּ֛ה אֲנַ֥חְנוּ עֲבָדִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/036.yaml
  text: Look[a], today we are slaves; and in the land that you gave to our fathers to eat its fruit and its good things, look[c][b], we are slaves on it.
translation:
  language: zh_hans
  text: 看哪[a]，我们如今竟成了奴仆！你把这地赐给我们的祖先，让他们享用地上的出产和美物[b]；看哪，我们却在这地上作奴仆[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”也可译作“奴隶”；希伯来语指处于他人权下的人，此处侧重犹大百姓受外邦政权辖制。
    reason: lexical_alternative
  - marker: b
    text: “美物”也可译作“丰饶”或“美好之物”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“在这地上作奴仆”，强调他们正是在神赐给祖先的土地上受人辖制。
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意并加强哀叹语气的指示语；“看哪”在庄重的现代汉语中自然保留其强调作用。
- source_word: הַיּוֹם
  choice: 如今
  rationale: 此处强调当前受辖制的处境，与昔日蒙赐土地形成对照；“如今”比机械的“今天”更符合汉语语境。
- source_word: עֲבָדִים
  choice: 奴仆
  rationale: 该词可指奴隶或仆役；本节着重表达受外邦政权辖制、失去自主的状态。“奴仆”既保留受制含义，也避免在缺乏所有权语境时过度限定为现代意义的奴隶。
- source_word: וְהָאָרֶץ
  choice: 你把这地……；……在这地上
  rationale: 希伯来语结构紧凑，后文 עָלֶיהָ 明确具有地点意义。汉语重组语序，以清楚呈现：他们正在神所赐的同一片土地上受奴役。
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: 你把这地赐给我们的祖先
  rationale: 保留对神的直接称呼及土地作为恩赐的含义。“祖先”在现代汉语中准确指历代先辈，不必把 אבות 狭义理解为生身父亲。
- source_word: לֶאֱכֹל
  choice: 让他们享用
  rationale: 不定式表示赐地的目的；此处不只描述进食动作，也指享受土地的产物，因此译为自然的汉语“享用”。
- source_word: פִּרְיָהּ
  choice: 地上的出产
  rationale: 该词直译为“果实”，在土地语境中泛指农产；“出产”能自然传达此农业含义。
- source_word: טוּבָהּ
  choice: 美物
  rationale: 该词可指土地的美好、丰饶或所带来的好东西；“美物”保留其较宽泛的实体性含义，另以脚注提示“丰饶”。
- source_word: עָלֶיהָ
  choice: 在这地上
  rationale: 保留介词“在……上”的表层意象，并清楚突出讽刺张力：他们竟在神赐给祖先的土地上作奴仆。
theological_decisions:
- issue: 盟约哀歌语境中 עֲבָדִים 的译法
  choice: 奴仆
  alternative: 奴隶／仆人
  rationale: 上下文强调百姓在应许之地仍受帝国辖制。“奴仆”表达不自由和从属状态，同时保留希伯来词可涵盖奴隶与仆役的语义张力；脚注列出“奴隶”这一更强译法。
- issue: לַאֲבֹתֵינוּ 所指的先辈
  choice: 我们的祖先
  alternative: 我们的父辈／列祖
  rationale: 希伯来词为阳性复数，但在此指承受赐地之应许的历代先辈。“祖先”是现代标准汉语中清楚、庄重且不过度古雅的表达。
- issue: 受奴役与赐地之间的神学张力
  choice: 保留两次“看哪”及“在这地上”的重复强调
  alternative: 顺译为“我们如今在这地作奴仆”
  rationale: 原文藉重复 הִנֵּה 和末尾 עָלֶיהָ 突出悖论：神赐下供祖先享用的土地，百姓如今却在其上受辖制。译文不替文本解释这种盟约张力。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“看哪”保留祷告哀歌的强调语气；“竟”“却”显明原文的强烈反差，但不增添具体政治解释。脚注标记均置于相关正文处。
