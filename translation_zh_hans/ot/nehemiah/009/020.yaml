  text: וְ/רוּחֲ/ךָ֨ הַ/טּוֹבָ֔ה נָתַ֖תָּ לְ/הַשְׂכִּילָ֑/ם וּ/מַנְ/ךָ֙ לֹא מָנַ֣עְתָּ מִ/פִּי/הֶ֔ם וּ/מַ֛יִם נָתַ֥תָּה לָ/הֶ֖ם לִ/צְמָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/020.yaml
  text: You gave your good Spirit to instruct them[a], and you did not withhold your manna from their mouth, and you gave them water for their thirst.
translation:
  language: zh_hans
  text: 你赐下你良善的灵[a]教导他们；你没有从他们口中断绝你的吗哪，又赐水给他们解渴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译作“良善之灵”。希伯来语רוּחַ可指灵、风或气息；这里很可能指上帝所赐、引导并教导以色列人的灵。
    reason: 保留רוּחַ的词义范围，并说明此处依据语境所作的理解。
lexical_decisions:
- source_word: רוּחֲךָ הַטּוֹבָה
  choice: 你良善的灵
  rationale: רוּחַ可指“灵、风、气息”；此处与赐下、教导相连，最自然地指上帝施行教导的灵。“良善”直接保留定冠词所限定的形容词含义。中文不以大小写区分“灵”，因此用脚注保留也可理解为“良善之灵”的语义开放性。
- source_word: לְהַשְׂכִּילָם
  choice: 教导他们
  rationale: שׂכל的使役式表示使人明白、赐予洞见或教导；“教导他们”在现代汉语中自然，并保留使役目的。
- source_word: מַנְךָ
  choice: 你的吗哪
  rationale: 该词指旷野中上帝所赐的特定食物，采用现代中文圣经语境中通行的“吗哪”。
- source_word: מָנַעְתָּ מִפִּיהֶם
  choice: 你没有从他们口中断绝
  rationale: מנע意为阻止、扣留或断绝；保留“从他们口中”这一具体意象，而“断绝”比直译“扣留”更符合食物供应的中文表达。
- source_word: מַיִם ... לִצְמָאָם
  choice: 赐水给他们解渴
  rationale: לִצְמָאָם直译为“为着他们的口渴”；“给他们解渴”自然表达所赐之水满足其干渴，同时不增加因果内容。
theological_decisions:
- issue: רוּחֲךָ הַטּוֹבָה是否明确指上帝的圣灵
  choice: 正文译作“你良善的灵”
  alternative: “你的良善之灵”或将其理解为“良善的心志”
  rationale: 语境中的“赐下”与“教导”支持这是上帝施行引导和教导的灵，但希伯来词רוּחַ本身范围较广。中文没有英文大小写造成的明确神学标记，因此正文保持自然表达，并以脚注说明词义张力，不径直加入原文没有的“圣”字。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“从他们口中断绝”有意保留希伯来原文的具体意象；分号呈现本节并列的三项供应与引导。
