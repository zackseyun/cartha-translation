id: NEH.9.6
reference: Nehemiah 9:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַתָּה ה֣וּא יְהוָה֮ לְ/בַדֶּ/ךָ֒ את עָשִׂ֡יתָ אֶֽת הַ/שָּׁמַיִם֩ שְׁמֵ֨י הַ/שָּׁמַ֜יִם וְ/כָל צְבָאָ֗/ם הָ/אָ֜רֶץ וְ/כָל אֲשֶׁ֤ר עָלֶ֨י/הָ֙ הַ/יַּמִּים֙ וְ/כָל אֲשֶׁ֣ר בָּ/הֶ֔ם וְ/אַתָּ֖ה מְחַיֶּ֣ה אֶת כֻּלָּ֑/ם וּ/צְבָ֥א הַ/שָּׁמַ֖יִם לְ/ךָ֥ מִשְׁתַּחֲוִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/006.yaml
  text: You alone are Yahweh[a]. You made the heavens, the highest heavens and all their host, the earth and all that is on it, the seas and all that is in them; and you preserve all of them alive[c][b], and the host of heaven bows down to you.
translation:
  language: zh_hans
  text: 惟有你是耶和华[a]。你造了天、天上的天[b]和其中的万象，地和地上的一切，海和海里的一切。你使这一切都存活[c]；天上的万军都向你下拜[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是希伯来文 יהוה（YHWH）这一神名的传统中文音译。
    reason: divine_name
  - marker: b
    text: 希伯来文直译为“天之天”，可表示最高的天。
    reason: lexical_alternative
  - marker: c
    text: 或译：“赐生命给这一切”，或“使这一切都继续存活”。
    reason: alternative_reading
  - marker: d
    text: “天上的万军”也可理解为天上万象或天军；原文没有在此进一步限定。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式音译四字神名，不以“主”这一称号替代。
- source_word: אַתָּה הוּא יְהוָה לְבַדֶּךָ
  choice: 惟有你是耶和华
  rationale: 保留独立代词结构及“独有”的排他性强调，同时采用自然、庄重的中文句式。
- source_word: עָשִׂיתָ
  choice: 造了
  rationale: 此处 עשה 是一般性的“制作、造成”，译作“造了”贴合宇宙创造语境，又不强行等同于专门表示“创造”的其他希伯来语动词。
- source_word: הַשָּׁמַיִם
  choice: 天
  rationale: 在中文宇宙论语境中，“天”自然涵盖希伯来语复数形式所指的诸天。
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: 天上的天
  rationale: 紧贴希伯来语“诸天之天”的叠加强调结构，保留其古代宇宙观表达及可能的最高层含义。
- source_word: צְבָאָם
  choice: 其中的万象
  rationale: 此处后缀回指诸天；“万象”可涵盖天体及天上众类，避免武断限定为星辰或天使。
- source_word: הָאָרֶץ וְכָל אֲשֶׁר עָלֶיהָ
  choice: 地和地上的一切
  rationale: 创造清单中的 אֶרֶץ 指全地，中文表达简洁自然。
- source_word: הַיַּמִּים וְכָל אֲשֶׁר בָּהֶם
  choice: 海和海里的一切
  rationale: 保留天、地、海的三重创造清单；中文集合意义下用“海”较自然。
- source_word: מְחַיֶּה אֶת כֻּלָּם
  choice: 使这一切都存活
  rationale: 保留使役/维持生命之间的词义张力，既可指赐予生命，也可指持续保全生命。
- source_word: וּצְבָא הַשָּׁמַיִם
  choice: 天上的万军
  rationale: 保留 צבא 的集体性和军事意象，并避免将所指完全限定为星体或天使。
- source_word: מִשְׁתַּחֲוִים
  choice: 向你下拜
  rationale: 准确表达俯伏敬拜的动作和对象，语言庄重且易懂。
theological_decisions:
- issue: 耶和华的独一性
  choice: 惟有你是耶和华
  alternative: 你是独一的耶和华
  rationale: 原文强调“惟独你”；所选译法清楚表达排他性，又不额外加入“神”等原文未出现的名词。
- issue: מְחַיֶּה 表示赐生命还是维持生命
  choice: 使这一切都存活
  alternative: 赐生命给这一切／使这一切都继续存活
  rationale: 分词可涵盖使活和保全生命；正文采用较宽的表达，脚注列出两种可能重点，不把创造与护理之间的张力单向化。
- issue: 天军的所指
  choice: 天上的万军
  alternative: 天上万象／天军
  rationale: 原文可指天体组成的天上众军，也可令人想到天上灵界群体；采用宽泛集体词并以脚注说明，不限定为单一类别。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面中文。保留原文天、地、海的并列节奏，以“天上的天”保存希伯来语意象；对 מְחַיֶּה 与“天上的万军”的真实语义宽度用正文和脚注共同呈现。
