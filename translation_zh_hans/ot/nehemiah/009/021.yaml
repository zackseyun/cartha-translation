base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/021.yaml
  text: For forty years you sustained them in the wilderness[a]; they lacked nothing. Their clothes did not wear out[b], and their feet did not swell.
translation:
  language: zh_hans
  text: 四十年来，你在旷野供养他们，他们一无所缺；他们的衣服没有破旧，脚也没有肿胀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 参申命记8:4。
    reason: cross_reference
lexical_decisions:
- source_word: כִּלְכַּלְתָּם
  choice: 你供养他们
  rationale: כלכל在此表示持续供应所需、维持生活；“供养”既涵盖食物，也不把上帝的供应限于食物。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר指荒野或旷野；“旷野”符合以色列漂流的语境，也是现代中文圣经语体中自然、清楚的表达。
- source_word: לֹא חָסֵרוּ
  choice: 他们一无所缺
  rationale: 以自然的中文表达绝对否定，传达他们所需的一切都没有缺乏。
- source_word: שַׂלְמֹתֵיהֶם לֹא בָלוּ
  choice: 他们的衣服没有穿破
  rationale: שַׂלְמָה泛指衣物，בלה表示因长期使用而破旧损坏；“衣服没有穿破”简洁自然，并保留实际蒙保守的含义。
- source_word: וְרַגְלֵיהֶם לֹא בָצֵקוּ
  choice: 脚也没有肿
  rationale: בצק在本节表示肿起或肿胀；“脚也没有肿”是简明自然的现代中文。
- source_word: וְאַרְבָּעִים שָׁנָה
  choice: 四十年来
  rationale: 以时间状语自然承接上文；不另译句首连接词，也不损失其承接作用。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“供养”保留持续供应的广义，“一无所缺”突出供应充足；分号呈现后两项具体的保守。
