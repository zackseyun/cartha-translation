source:
  edition: WLC
  text: וַֽ/תִּתְּנֵ/ם֙ בְּ/יַ֣ד צָֽרֵי/הֶ֔ם וַ/יָּצֵ֖רוּ לָ/הֶ֑ם וּ/בְ/עֵ֤ת צָֽרָתָ/ם֙ יִצְעֲק֣וּ אֵלֶ֔י/ךָ וְ/אַתָּה֙ מִ/שָּׁמַ֣יִם תִּשְׁמָ֔ע וּֽ/כְ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֗ים תִּתֵּ֤ן לָ/הֶם֙ מֽוֹשִׁיעִ֔ים וְ/יוֹשִׁיע֖וּ/ם מִ/יַּ֥ד צָרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/027.yaml
  text: So you gave them into the hand of their adversaries[a], who oppressed them. But in the time of their distress they cried out to you, and you heard from heaven; and according to your abundant mercies you gave them deliverers, who saved them from the hand of their adversaries.
translation:
  language: zh_hans
  text: 于是，你把他们交在他们仇敌的手中，仇敌便压迫他们。他们遭难时向你呼求，你就从天上垂听，并照你丰盛的怜悯赐给他们拯救者[a]，救他们脱离他们仇敌的手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救者”也可译作“救助者”；原文来自“拯救”这个动词，这里指上帝兴起、用来解救他们的人。
    reason: 说明词源联系及此处所指的人间施救者，保留可能的译法，同时避免读者误以为这些人与上帝的拯救地位相同。
lexical_decisions:
- source_word: וַתִּתְּנֵם בְּיַד
  choice: 你把他们交在……手中
  rationale: 保留希伯来语“交在某人手中”的权势意象；中文表达自然，也清楚表示使他们落入他人掌控之下。
- source_word: צָרֵיהֶם
  choice: 仇敌
  rationale: 该词指敌对者；译作“仇敌”既符合历史语境，也避免与随后表示压迫的动词混同。
- source_word: וַיָּצֵרוּ לָהֶם
  choice: 仇敌便压迫他们
  rationale: 该动词表达逼迫、使人受困受苦；“压迫”准确传达敌人使他们陷入困境的含义。补出主语“仇敌”，使现代中文指代清楚。
- source_word: וּבְעֵת צָרָתָם
  choice: 他们遭难时
  rationale: 简洁传达“在他们患难的时候”，并与上下文的受压迫处境相连。
- source_word: יִצְעֲקוּ אֵלֶיךָ
  choice: 向你呼求
  rationale: “呼求”比普通的“呼叫”更能表现人在危难中急切求助的语气。
- source_word: מִשָּׁמַיִם תִּשְׁמָע
  choice: 你就从天上垂听
  rationale: 保留“从天上”的空间表述；“垂听”在庄重而通俗的祷告语体中自然，且表达上帝回应人的呼求。
- source_word: וּכְרַחֲמֶיךָ הָרַבִּים
  choice: 并照你丰盛的怜悯
  rationale: “丰盛的怜悯”自然传达复数形式所强调的丰富、众多以及 הָרַבִּים 的程度。
- source_word: מֹשִׁיעִים
  choice: 拯救者
  rationale: 该词由“拯救”一词派生，在这里指上帝赐下、借以解救百姓的人；“拯救者”保留原文词根联系。
- source_word: וְיוֹשִׁיעוּם
  choice: 救他们
  rationale: 与“拯救者”保持词义联系，同时以简洁的中文接续其实际行动。
- source_word: מִיַּד צָרֵיהֶם
  choice: 脱离仇敌的手
  rationale: 与前文“交在仇敌手中”前后照应，并保留原文重复出现的“手”这一权势意象。
theological_decisions:
- issue: 如何理解称为 מֹשִׁיעִים 的人物
  choice: 拯救者
  alternative: 救助者；施行拯救的人
  rationale: 原词与“拯救”同根，但本节所指是上帝赐下的、人间的解救者。正文保留原文的用词力度，脚注则说明他们是上帝使用的人，不把人的作用与上帝混为一谈。
translation_notes:
  register: 采用现代、庄重而易懂的祷告叙事语体。“于是”“便”“就”呈现行动之间的推进与转折；保留两次“仇敌的手”相关意象，并以“呼求”“垂听”“怜悯”维持经文语域。
