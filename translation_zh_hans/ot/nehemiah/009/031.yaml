source:
  edition: WLC
  text: וּֽ/בְ/רַחֲמֶ֧י/ךָ הָ/רַבִּ֛ים לֹֽא עֲשִׂיתָ֥/ם כָּלָ֖ה וְ/לֹ֣א עֲזַבְתָּ֑/ם כִּ֛י אֵֽל חַנּ֥וּן וְ/רַח֖וּם אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/031.yaml
  text: But in your abundant mercies you did not make an end of them or abandon them[a], for you are a gracious and compassionate God.
translation:
  language: zh_hans
  text: 然而，因着你丰盛的怜悯，你没有将他们灭尽，也没有离弃他们[a]；因为你是施恩、怜悯的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有彻底毁灭他们，也没有抛弃他们。”
    reason: 词汇替代译法：עשה כלה可明确译为“彻底毁灭”，עזב也可译为“抛弃”。
lexical_decisions:
- source_word: וּבְרַחֲמֶיךָ הָרַבִּים
  choice: 但你因自己丰盛的怜悯
  rationale: 句首的וּ在上下文中表示转折，与百姓的悖逆形成对比；בְ可按原因理解为“因”。רַחֲמִים的复数与הָרַבִּים共同强调怜悯的丰盛。
- source_word: לֹא עֲשִׂיתָם כָּלָה
  choice: 没有将他们灭尽
  rationale: עשה כלה是“使之彻底终结、灭绝”的习语。“灭尽”自然简洁，并保留完全毁灭的力度。
- source_word: וְלֹא עֲזַבְתָּם
  choice: 也没有离弃他们
  rationale: עזב可指离开、抛弃或离弃；“离弃”适合庄重经文语体，也清楚表达上帝没有放弃他们。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出上帝没有灭尽或离弃百姓的原因。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是对上帝的一般称谓，不必额外加入“全能”或“大能”等原文未明确表达的限定。
- source_word: חַנּוּן
  choice: 有恩典
  rationale: 表达乐意施恩的品格，并与后面的רַחוּם“有怜悯”保持词义区别。
- source_word: וְרַחוּם
  choice: 有怜悯
  rationale: 表达深切怜恤、慈悲的品格；采用“有怜悯”既自然，也呼应本节前半句的רַחֲמִים。
- source_word: אָתָּה
  choice: 你是
  rationale: 独立代词带有强调，汉语以明确保留“你”来体现；系词“是”使句子自然完整。
theological_decisions:
- issue: 神圣品格公式חַנּוּן וְרַחוּם的翻译
  choice: 有恩典、有怜悯
  alternative: 施恩而怜悯／有恩惠、有慈悲
  rationale: 分别呈现两个相近但不完全相同的形容词：前者侧重施恩，后者侧重怜恤，不把二者合并为单一概念，也不加入特定宗派解释。
- issue: 句首וּ的语篇功能
  choice: 转折性的“但”
  alternative: 连接性的“而／并且”
  rationale: 本句与前文所述百姓反复悖逆及所受管教形成鲜明对照，因此现代汉语用“但”更清楚地表达上下文关系。
- issue: לֹא עֲשִׂיתָם כָּלָה的力度
  choice: 没有将他们灭尽
  alternative: 没有使他们完全终结／没有彻底毁灭他们
  rationale: 该习语涉及彻底消灭；“灭尽”保留其严肃力度，同时不具体化毁灭的方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“灭尽”“离弃”略带经文庄重感，但仍是当代读者容易理解的词语；全句保留祷告中对上帝的第二人称称呼。
