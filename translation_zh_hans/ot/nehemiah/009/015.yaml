  text: וְ֠/לֶחֶם מִ/שָּׁמַ֜יִם נָתַ֤תָּה לָ/הֶם֙ לִ/רְעָבָ֔/ם וּ/מַ֗יִם מִ/סֶּ֛לַע הוֹצֵ֥אתָ לָ/הֶ֖ם לִ/צְמָאָ֑/ם וַ/תֹּ֣אמֶר לָ/הֶ֗ם לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר נָשָׂ֥אתָ אֶת יָדְ/ךָ֖ לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/015.yaml
  text: You gave them bread from heaven for their hunger[a], and you brought out water from the rock for their thirst, and you told them to go in to possess the land that you had sworn to give them.
translation:
  language: zh_hans
  text: 你从天上赐下粮食给他们充饥，又使水从磐石中流出来，给他们解渴。你告诉他们要进去取得那地，就是你曾举手起誓要赐给他们的地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“你曾举起你的手要赐给他们”；“举手”是起誓的表达。
    reason: 说明原文的具体意象及其惯用含义。
lexical_decisions:
- source_word: לֶחֶם מִשָּׁמַיִם
  choice: 从天上赐下粮食
  rationale: 保留“从天上”这一意象；לֶחֶם可指饼或一般食粮，此处译作“粮食”既自然，也不直接以“吗哪”取代原文用词。
- source_word: לִרְעָבָם
  choice: 给他们充饥
  rationale: 将介词ל与“他们的饥饿”按现代汉语习惯表达为用途，同时与后文“给他们解渴”形成平行。
- source_word: מַיִם מִסֶּלַע
  choice: 水从磐石中
  rationale: 保留水与磐石的具体意象；汉语无须强行标明定指或不定指，因而不消解希伯来语在此处的形式差异。
- source_word: הוֹצֵאתָ
  choice: 使……流出来
  rationale: 体现יצא的使役形含义，又符合水从磐石出来的现代汉语表达。
- source_word: לִצְמָאָם
  choice: 给他们解渴
  rationale: 自然表达用途，并与“给他们充饥”保持修辞上的平衡。
- source_word: וַתֹּאמֶר לָהֶם
  choice: 你告诉他们
  rationale: 原义为“你对他们说”；“告诉”可自然引出后面的不定式内容，又不像“命令”那样强化语气。
- source_word: לָבוֹא לָרֶשֶׁת
  choice: 要进去取得
  rationale: 分别保留“进入”和“取得、占有”的动作；“取得”比单纯“继承”更能呈现ירשׁ在土地语境中的占有含义。
- source_word: נָשָׂאתָ אֶת יָדְךָ
  choice: 你曾举手起誓
  rationale: 既保留“举手”的具体意象，也明示这一希伯来语动作在本句中的起誓含义，避免现代读者误解。
- source_word: לָתֵת לָהֶם
  choice: 要赐给他们
  rationale: “赐给”适合以神为施事者的庄重语境，并准确表达给予之意。
theological_decisions:
- issue: 神应许赐地时使用的举手起誓表达
  choice: 正文译作“你曾举手起誓要赐给他们”
  alternative: 只译作“你曾起誓要赐给他们”，或按字面译作“你曾举手要赐给他们”
  rationale: “举手起誓”同时保留原文的拟人化动作和立誓含义，不把盟约性的誓言淡化为一般应许，也不让纯字面表达变得含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事祷告语体。“充饥／解渴”形成自然平行；“举手起誓”保存原文意象及盟约语境。
