  text: וַ֠/תִּתֵּן אֹתֹ֨ת וּ/מֹֽפְתִ֜ים בְּ/פַרְעֹ֤ה וּ/בְ/כָל עֲבָדָי/ו֙ וּ/בְ/כָל עַ֣ם אַרְצ֔/וֹ כִּ֣י יָדַ֔עְתָּ כִּ֥י הֵזִ֖ידוּ עֲלֵי/הֶ֑ם וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/010.yaml
  text: You performed signs and wonders against Pharaoh[a], against all his servants, and against all the people of his land, for you knew that they acted presumptuously against them. So you made a name for yourself, as it is to this day.
translation:
  language: zh_hans
  text: 你在法老、他所有臣仆，以及他国中所有百姓身上施行了神迹奇事，因为你知道他们狂妄地对待他们[a]。这样，你为自己立了名，直到今日仍然如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 前一个“他们”指法老及埃及人；后一个“他们”最可能指以色列人。原文只用复数代词，未明说所指。“狂妄地”也可译为“傲慢地”“放肆地”或“擅妄地”。
    reason: 保留原文对受害对象的未明指称，同时说明 הֵזִידוּ 的词义范围。
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: 施行了
  rationale: 原义为“赐下、放置”，与“神迹奇事”连用时指使这些事发生；“施行”符合现代汉语搭配，也保留上帝主动作为的含义。
- source_word: אֹתֹת וּמֹפְתִים
  choice: 神迹奇事
  rationale: 保留两个并列名词：前者侧重具有指示意义的记号，后者侧重令人惊异的作为；“神迹奇事”是准确而通顺的固定表达。
- source_word: בְּפַרְעֹה וּבְכָל עֲבָדָיו וּבְכָל עַם אַרְצוֹ
  choice: 在法老、他所有臣仆和他国中全体百姓身上
  rationale: 此处介词 בְּ 表示神迹奇事所临到并受审判的对象。“在……身上”比单用“向”更清楚地传达其临到这些人的含义。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 在王室语境中可指法老的臣属、官员或仆役；“臣仆”既体现其服事君王的身份，又不限定具体官阶。
- source_word: הֵזִידוּ
  choice: 曾狂妄地对待
  rationale: 该词表示骄傲、放肆或擅妄地行事。“狂妄”在现代汉语中自然，并保留其强烈的道德贬义。
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: 你就为自己赢得了名声
  rationale: 这是建立名望、使名声传扬的习语；“赢得了名声”在现代汉语中自然，也保留“为自己得名”的结构。
- source_word: כְּהַיּוֹם הַזֶּה
  choice: 直到今日仍是如此
  rationale: 该惯用语表示此前形成的结果延续至说话者当时；此译法准确表达持续到今日的意味。
theological_decisions:
- issue: עֲלֵיהֶם（“对待那些人”）的指代
  choice: 正文保留较含蓄的“那些人”，脚注说明最自然是指以色列人
  alternative: 在正文中明确译作“你的百姓”或“以色列人”
  rationale: 出埃及事件的语境表明，法老和埃及人狂妄对待的对象最可能是以色列人；但希伯来文本本身只用复数代词，没有明说其身份，因此正文不将解释直接写入经文。
- issue: 神迹奇事与法老等人的关系
  choice: 译为“在……身上施行”，表达这些作为临到他们并带有审判性质
  alternative: 译为“向……施行”或“攻击……”
  rationale: 介词允许表达临到某对象的作为；“在……身上”既呈现审判背景，又避免把每一件神迹都狭义解释为直接攻击。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“臣仆”“神迹奇事”保留历史叙事和圣经语体色彩；句法避免生硬直译，同时在脚注中保留原文代词的含蓄性与词义张力。
