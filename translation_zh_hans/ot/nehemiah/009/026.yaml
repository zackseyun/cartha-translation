  text: וַ/יַּמְר֨וּ וַֽ/יִּמְרְד֜וּ בָּ֗/ךְ וַ/יַּשְׁלִ֤כוּ אֶת תּוֹרָֽתְ/ךָ֙ אַחֲרֵ֣י גַוָּ֔/ם וְ/אֶת נְבִיאֶ֣י/ךָ הָרָ֔גוּ אֲשֶׁר הֵעִ֥ידוּ בָ֖/ם לַ/הֲשִׁיבָ֣/ם אֵלֶ֑י/ךָ וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדוֹלֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/026.yaml
  text: But they acted presumptuously and rebelled against you[a], and they cast your law behind their backs. They killed your prophets, who had warned them in order to bring them back to you[d][c][b], and they committed great blasphemies.
translation:
  language: zh_hans
  text: 然而，他们狂妄悖逆，反抗你[a]，把你的律法[b]抛在背后；他们杀害了你的先知，就是那些严正警告他们、要使他们回转归向你的人[c]。他们还大大藐视你[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂妄悖逆”也可译作“不顺服”“桀骜抗命”或“触怒”；原文所用动词含有公然抗拒的意味。
    reason: lexical_alternative
  - marker: b
    text: “律法”也可译作“教导”或“训诲”。
    reason: lexical_alternative
  - marker: c
    text: “严正警告他们”也可译作“作证指控他们”；原文可指庄严地作证、告诫或警戒。
    reason: lexical_alternative
  - marker: d
    text: “大大藐视你”也可译作“极其侮慢你”“做了极其亵渎你的事”或“极大地触怒你”；原文不限于言语上的亵渎。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ
  choice: 狂妄悖逆
  rationale: 该动词表达桀骜、抗命的意味；译作“狂妄悖逆”，既体现公然抗拒，也与下一个更明确表示反叛的动词有所区别。
- source_word: וַיִּמְרְדוּ בָּךְ
  choice: 反抗你
  rationale: מרד明确表示反叛、反抗；保留בָּךְ所表达的直接对象，突出他们反抗的是神自己。
- source_word: וַיַּשְׁלִכוּ אֶת־תּוֹרָתְךָ אַחֲרֵי גַוָּם
  choice: 把你的律法抛在背后
  rationale: 保留希伯来文具体而强烈的意象，表达他们轻蔑地拒绝神的律法，而不只是消极忽视。
- source_word: תּוֹרָתְךָ
  choice: 你的律法
  rationale: תּוֹרָה也可泛指教导，但在这段圣约历史的认罪祷告中，“律法”自然且为读者熟悉。
- source_word: הֵעִידוּ בָם
  choice: 郑重警告他们
  rationale: 该使役形式可指作证、警戒或严正告诫；结合后面的挽回目的，“郑重警告”在现代汉语中清楚表达先知警戒的力度。
- source_word: לַהֲשִׁיבָם אֵלֶיךָ
  choice: 要使他们回转归向你
  rationale: 保留שׁוב使役形式的挽回作用，并明确归回的关系性方向是归向神。
- source_word: נֶאָצוֹת גְּדוֹלֹת
  choice: 做了极其亵渎你的事
  rationale: 该短语指严重藐视、侮慢神的行为，不限于言语上的亵渎；此译法既传达其神学严重性，也避免把含义缩窄为亵渎性话语。
theological_decisions:
- issue: 两个相邻的反叛动词 וַיַּמְרוּ / וַיִּמְרְדוּ 的处理
  choice: 分别译作“狂妄悖逆，反抗你”
  alternative: “不顺服你，背叛你”或“触怒你，反抗你”
  rationale: 原文使用两个相关但不同的动词，分别呈现桀骜抗命和公开反叛；区别翻译可保留其修辞递进，而不将两者合并。
- issue: נֶאָצוֹת גְּדוֹלֹת 的范围
  choice: 译作“做了极其亵渎你的事”
  alternative: “大大藐视你”或“做了极其冒犯你的事”
  rationale: 原词表达对神的严重蔑视和侮慢，范围可以包括言语和行为。采用“亵渎你的事”保留垂直指向，又不把含义限定为口头亵渎。
- issue: הֵעִידוּ בָם 的见证或警告含义
  choice: 正文采用“郑重警告他们”
  alternative: “作证指控他们”
  rationale: 希伯来文允许庄严作证或警告的理解；下文说明目的是使他们归向神，因此正文采用符合语境的“郑重警告”，脚注保留另一种可能。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“抛在背后”保留原文鲜明意象；“回转归向你”沿用普通读者可理解的圣经语汇。正文避免文言化，也不以教派术语解释原文。
