base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/001.yaml
  text: On the twenty-fourth day of this month[a], the sons of Israel assembled with fasting, in sackcloth[b], and with dirt on them.
translation:
  language: zh_hans
  text: 这个月二十四日，以色列人聚集在一起，禁食，身穿麻衣[a]，身上撒着尘土[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 麻衣是粗糙的布衣，常在哀恸或悔罪时穿着。
    reason: cultural_note
  - marker: b
    text: 原文直译为“泥土在他们身上”；把尘土撒在身上是哀恸和悔罪的表示。原文没有明确说只撒在头上。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ הַזֶּה
  choice: 这个月二十四日
  rationale: 希伯来语以“二十和四”表达日期；现代汉语自然译作“二十四日”。句首 וּ־承接上文，不必机械译出“并且”。
- source_word: נֶאֶסְפוּ
  choice: 聚集
  rationale: Nifal形式在此表示众人聚集到一起；汉语“聚集”自然表达共同会合，也不额外指定召集者。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在这里是民族共同体的常用称谓；“以色列人”准确、自然，并包含全体会众。
- source_word: בְּצוֹם
  choice: 禁食
  rationale: 介词短语表示聚集时伴随的悔罪行动；汉语用动词性表达“聚集禁食”简洁自然。
- source_word: וּבְשַׂקִּים
  choice: 身穿麻衣
  rationale: שַׂקִּים指表示哀恸、悔罪的粗麻衣；补出“身穿”使现代汉语清楚，但不增加原文未有的神学解释。
- source_word: וַאֲדָמָה עֲלֵיהֶם
  choice: 身上撒着尘土
  rationale: אֲדָמָה通常指土地、泥土；这里指把土置于身上，作为哀恸和悔罪的表示。原文只说“在他们身上”，因此不限定为头上。
theological_decisions: []
