  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ הַ/לְוִיִּ֡ם יֵשׁ֣וּעַ וְ֠/קַדְמִיאֵל בָּנִ֨י חֲשַׁבְנְיָ֜ה שֵׁרֵֽבְיָ֤ה הֽוֹדִיָּה֙ שְׁבַנְיָ֣ה פְתַֽחְיָ֔ה ק֗וּמוּ בָּרֲכוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם מִן הָ/עוֹלָ֖ם עַד הָ/עוֹלָ֑ם וִ/יבָֽרְכוּ֙ שֵׁ֣ם כְּבוֹדֶ֔/ךָ וּ/מְרוֹמַ֥ם עַל כָּל בְּרָכָ֖ה וּ/תְהִלָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/005.yaml
  text: Then the Levites—Jeshua[a], Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah—said, “Stand up; bless Yahweh your God from everlasting to everlasting. Blessed be your glorious name[b], which is exalted above all blessing and praise.”
translation:
  language: zh_hans
  text: 利未人耶书亚、甲篾、巴尼、哈沙尼雅、示利比、荷第雅、示巴尼和毗他希雅说：“你们要起来，称颂雅威——你们的神，从永远到永远！愿他们称颂[a]你那荣耀的名[b]；这名被高举，超乎一切称颂和赞美。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿人称颂。”希伯来文动词为第三人称复数，并带愿望或号召语气；本分句没有明说其所指的主语。
    reason: alternative_reading
  - marker: b
    text: 直译：“你荣耀之名。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הַלְוִיִּם
  choice: 利未人……说
  rationale: 连续式叙事动词推进叙事；现代汉语无需另译连接词，也能自然表达随后发生的言说。定冠词所指的群体译为“利未人”。
- source_word: יֵשׁוּעַ וְקַדְמִיאֵל בָּנִי חֲשַׁבְנְיָה שֵׁרֵבְיָה הוֹדִיָּה שְׁבַנְיָה פְתַחְיָה
  choice: 耶书亚、甲篾、巴尼、哈沙尼雅、示利比、荷第雅、示巴尼和毗他希雅
  rationale: 按现代中文圣经人名的通行音译形式处理，并以汉语列举标点清楚呈现名单。
- source_word: קוּמוּ
  choice: 你们要起来
  rationale: 复数命令式面向会众；“你们要起来”既明确复数对象，也符合公开礼仪场景。
- source_word: בָּרֲכוּ
  choice: 称颂
  rationale: 此处 ברך 的对象是神；“称颂”比一般性的“赞美”更能保留“宣告为有福、颂赞”的词义，并与后文 בְּרָכָה 呼应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文所用的盟约名字，不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 保留第二人称复数后缀及其对会众的直接称呼。
- source_word: מִן הָעוֹלָם עַד הָעוֹלָם
  choice: 从永远到永远
  rationale: 准确传达无始无终、无穷延续的惯用表达，同时保持现代汉语敬拜语言的庄重感。
- source_word: וִיבָרְכוּ
  choice: 愿人称颂
  rationale: 该形式为第三人称复数、带愿望或号召语气。汉语用泛指的“人”避免强行指定希伯来文未明说的主语，同时保留从第二人称命令转为第三人称的变化。
- source_word: שֵׁם כְּבוֹדֶךָ
  choice: 你荣耀的名
  rationale: 将字面上的“你荣耀之名”自然表达为“你荣耀的名”，既保留“荣耀”与“名”的关系，也避免生硬。
- source_word: וּמְרוֹמַם עַל כָּל בְּרָכָה וּתְהִלָּה
  choice: 这名被高举，超乎一切称颂和赞美
  rationale: “被高举”保留被动或状态性的形式；“这名”明确承接前项，“超乎”表达 עַל 在此所指的超越关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。译作“雅威”直接呈现专名，避免将其改为称号，同时不对神名的神学意义作额外解释。
- issue: וִיבָרְכוּ 的主语及语气
  choice: 愿人称颂
  alternative: 愿他们称颂；愿你的荣耀之名受称颂
  rationale: 马所拉文本是第三人称复数形式，带愿望或号召语气，但主语没有明说。“愿人称颂”保留这一语法张力；不改写成以“名”为单数主语的被动句，以免掩盖原文形式。
- issue: 神名超越一切称颂和赞美
  choice: 这名被高举，超乎一切称颂和赞美
  alternative: 这名至高，超过一切称颂和赞美
  rationale: 保留原文关于神名超越所有人所能献上的颂赞这一断言，同时不进一步界定这是本体性的超越还是礼仪性的表达。
translation_notes:
  register: 采用现代、庄重而适合公众诵读的普通话。名单使用通行的中文音译；命令句保留会众礼仪语气。对第三人称复数愿望式不作神学性消解，并用脚注说明其未明说的主语。
