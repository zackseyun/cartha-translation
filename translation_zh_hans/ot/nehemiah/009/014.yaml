base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/014.yaml
  text: You made your holy Sabbath known to them[b][a], and you commanded them commandments and statutes and a law by the hand of Moses your servant.
translation:
  language: zh_hans
  text: 你使他们知道你的圣安息日，又借着你的仆人摩西[a]，命令他们遵守诫命、律例和律法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“借着你仆人摩西的手”；这是表示代理或媒介的习语，意思是“通过你仆人摩西”。
    reason: lexical_alternative
  - marker: b
    text: “律法”也可译作“教导”；原词既可强调教导，也可强调具有约束力的律法。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת קָדְשְׁךָ
  choice: 你的圣安息日
  rationale: 保留“安息日”的盟约和礼仪特指；קָדְשְׁךָ在此作修饰性表达，译为“圣”。
- source_word: הוֹדַעַתָ
  choice: 使他们知道
  rationale: 准确体现ידע使役式“使……知道”的语义，也保持原文直接简洁。
- source_word: מִצְוֹת
  choice: 诫命
  rationale: 符合盟约法律语域，并与后面的“律例、律法”形成有区别的并列。
- source_word: חֻקִּים
  choice: 律例
  rationale: 表达规定、制定的条例，是现代中文圣经语境中清楚而庄重的法律用语。
- source_word: תוֹרָה
  choice: 律法
  rationale: 在“诫命、律例”这一法律性并列中，“律法”最符合上下文；该词也可指“教导”，以脚注保留其语义幅度。
- source_word: צִוִּיתָ לָהֶם
  choice: 吩咐他们遵守
  rationale: 原文直译近于“向他们命令诫命……”。中文若译作“吩咐他们诫命”不自然，补出“遵守”明确命令与宾语的关系，而不改变其命令效力。
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: 借着你仆人摩西的手
  rationale: 保留“借……的手”这一原文中表示媒介或代理的习语，同时脚注说明其自然含义。
theological_decisions:
- issue: מִצְוֹת וְחֻקִּים וְתוֹרָה这一法律词组三项的区分
  choice: 诫命、律例和律法
  alternative: 命令、条例和教导
  rationale: 保留三个法律与启示范畴的并列，不将其合并为泛指性的“教导”；同时以脚注说明תּוֹרָה的较宽语义。
- issue: 摩西在颁布命令中的角色
  choice: 借着你仆人摩西的手
  alternative: 通过你仆人摩西
  rationale: 原文将上帝表述为命令的发出者、摩西为传达媒介；保留该习语，不把摩西写成命令的最终来源。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“圣安息日”“诫命、律例和律法”等盟约法律用语；对希伯来语代理习语作形式保留，并用脚注解释。所有脚注标记均置于相关正文词语之后。
