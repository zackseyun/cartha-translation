id: NEH.9.12
reference: Nehemiah 9:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בְ/עַמּ֣וּד עָנָ֔ן הִנְחִיתָ֖/ם יוֹמָ֑ם וּ/בְ/עַמּ֥וּד אֵשׁ֙ לַ֔יְלָה לְ/הָאִ֣יר לָ/הֶ֔ם אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/012.yaml
  text: By a pillar of cloud you led them by day[a], and by a pillar of fire by night to give them light on the way in which they should go.
translation:
  language: zh_hans
  text: 白天，你借着云柱引导他们；夜间，你借着火柱为他们照亮他们该走的路。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְעַמּוּד עָנָן
  choice: 用云柱
  rationale: 介词 ב 在此可表示工具或处所；“用云柱”在现代汉语中自然地表达上帝借云柱引导，同时不把意象抽象化。
- source_word: הִנְחִיתָם
  choice: 引导他们
  rationale: נחה 的使役式在旷野行程语境中指带领、引导；“引导”准确而自然。
- source_word: יוֹמָם
  choice: 白天
  rationale: 作时间副词，与后文“夜间”形成清楚、整齐的对应。
- source_word: וּבְעַמּוּד אֵשׁ
  choice: 用火柱
  rationale: 与“用云柱”保持平行，并保留 ב 的工具性理解；处所性可能由脚注一并说明。
- source_word: לַיְלָה
  choice: 夜间
  rationale: 与“白天”对应，语体庄重而符合现代汉语。
- source_word: לְהָאִיר לָהֶם
  choice: 为他们照亮
  rationale: 使役式不定词表达目的或结果，לָהֶם 表示受益者；此译法简洁地保留两者。
- source_word: אֶת הַדֶּרֶךְ
  choice: 照亮……路
  rationale: אֵת 标明“路”是“照亮”的宾语；汉语可以直接说“照亮……路”，无需像英语那样改成介词结构。
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: 当走的
  rationale: 关系从句限定他们受引导要行的路线；“当走的路”表达所指定的方向，又不把语气强化成道德命令。
theological_decisions:
- issue: 旷野中云柱和火柱的神圣引导意象
  choice: 按经文直译为上帝用云柱引导、用火柱照路的历史行动
  alternative: 在译文中进一步解释为上帝临在或赋予预表意义
  rationale: 原文着重具体的引导与照明；译文不额外加入临在论、预表论或宗派性解释。
- issue: 目的短语 לְהָאִיר לָהֶם 的句法范围
  choice: 依最近成分把“为他们照亮”直接连于夜间的火柱
  alternative: 理解为概括云柱与火柱共同发挥的作用
  rationale: 希伯来语位置最自然地使目的短语修饰火柱，但语境上整个安排都服务于引路；译文保留原文的就近连接，不另行扩展。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言；以“白天……夜间……”保持原文的平行节奏。“当走的路”略带经文语体，但普通读者容易理解，也能准确表达指定路线。
