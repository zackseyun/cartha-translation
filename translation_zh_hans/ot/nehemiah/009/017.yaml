source:
  edition: WLC
  text: וַ/יְמָאֲנ֣וּ לִ/שְׁמֹ֗עַ וְ/לֹא זָכְר֤וּ נִפְלְאֹתֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ עִמָּ/הֶ֔ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וַ/יִּתְּנוּ רֹ֛אשׁ לָ/שׁ֥וּב לְ/עַבְדֻתָ֖/ם בְּ/מִרְיָ֑/ם וְ/אַתָּה֩ אֱל֨וֹהַּ סְלִיח֜וֹת חַנּ֧וּן וְ/רַח֛וּם אֶֽרֶךְ אַפַּ֥יִם וְ/רַב ו/חסד וְ/לֹ֥א עֲזַבְתָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/017.yaml
  text: But they refused to listen and did not remember your wonders that you had done among them. They stiffened their necks and, in their rebellion, appointed a leader to return to their slavery. But you are a forgiving God[a], gracious and compassionate, slow to anger and abundant in steadfast love, and you did not forsake them.
translation:
  language: zh_hans
  text: 他们却不肯听从，也不记念你在他们中间所行的奇事。他们硬着颈项，在悖逆中立了一个首领，要回去重作奴隶。但你是满有赦免的上帝[a]，满有恩典和怜悯，不轻易发怒，并有丰盛的慈爱；你没有离弃他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“赦免之上帝”；“赦免”一词采用复数形式，用来强调他丰盛的赦免。
    reason: 说明希伯来语复数抽象名词的强调作用，并交代正文自然化翻译所未直接呈现的形式。
lexical_decisions:
- source_word: וַיְמָאֲנוּ לִשְׁמֹעַ
  choice: 他们却不肯听从
  rationale: מָאֵן表示拒绝、不愿；שׁמע在此兼有听与服从之意。“不肯听从”自然表达其顽拒，同时不把含义缩减为单纯没有听见。
- source_word: נִפְלְאֹתֶיךָ אֲשֶׁר עָשִׂיתָ עִמָּהֶם
  choice: 你在他们中间所行的奇事
  rationale: נפלאות指令人惊叹的非凡作为；עם在这里可表达这些事发生在群体中间。“奇事”简洁庄重，也保留救赎历史语境。
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: 他们硬着颈项
  rationale: 保留希伯来语的身体意象；“硬着颈项”在中文圣经语体中可理解为顽梗不服。
- source_word: וַיִּתְּנוּ רֹאשׁ
  choice: 立了一个首领
  rationale: 字面为“设立一个头”，语境中指推举或设立领导者；译作“立了一个首领”既自然又保留动作的主动性。
- source_word: לָשׁוּב לְעַבְדֻתָם
  choice: 要回去再作奴隶
  rationale: עבדות指奴役状态。“再作奴隶”比抽象的“回到奴役”更符合现代汉语，并清楚连接出埃及背景。
- source_word: בְּמִרְיָם
  choice: 竟在悖逆中
  rationale: 介词短语可作情境性修饰，说明他们是在悖逆状态中立首领；“竟”适度传达上下文中的强烈反差，而不改写因果关系。
- source_word: אֱלוֹהַּ סְלִיחוֹת
  choice: 乐意饶恕的上帝
  rationale: 字面为“饶恕之上帝”，其中抽象名词用复数，强调饶恕的丰盛或反复施行。中文以“乐意饶恕”自然表达上帝这一恒常特质，复数形式另以脚注说明。
- source_word: חַנּוּן וְרַחוּם
  choice: 有恩典，有怜悯
  rationale: 分别保留施恩与怜恤的语义，不将两词合并为一个笼统概念。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒
  rationale: 这是希伯来语“鼻孔长”的惯用表达，意为迟延动怒；采用现代中文通行且准确的对应表达。
- source_word: רַב־חֶסֶד
  choice: 有丰盛的慈爱
  rationale: רב表示丰盛，חסד兼有慈爱、忠诚和守约的内涵。“慈爱”在此保持庄重与神学厚度，同时不把词义限定为某一系统性术语。
- source_word: וְלֹא עֲזַבְתָּם
  choice: 你没有离弃他们
  rationale: עזב可指离开、抛弃；“离弃”准确表达关系与盟约层面的不弃绝。
theological_decisions:
- issue: 如何表达 אֱלוֹהַּ סְלִיחוֹת 的复数抽象名词
  choice: 乐意饶恕的上帝[a]
  alternative: 饶恕人的上帝；满有赦免的上帝；饶恕之上帝
  rationale: 原文复数并非指若干种可数的“饶恕”，而是加强上帝丰富、屡次饶恕的属性。“乐意饶恕”在现代汉语中自然，又保留神主动施恩的意味；脚注交代原文形式，避免把强调完全隐去。
- issue: 如何处理 רַב־חֶסֶד 的盟约性内涵
  choice: 有丰盛的慈爱
  alternative: 满有信实的爱；大有守约之爱
  rationale: חסד确有忠诚与盟约关系的色彩，但本词本身不宜被缩窄为一个明确的教义释义。“慈爱”保留宽广语义，让上下文承载其忠贞、守约的含义。
- issue: “听”是否应明确译为“服从”
  choice: 不肯听从
  alternative: 不肯听；拒绝服从
  rationale: שׁמע在此同时涉及聆听与顺服。“听从”保存两者之间的张力，避免只译为听觉行为，也避免完全改写成抽象的服从。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“硬着颈项”“不轻易发怒”“慈爱”“离弃”等保留经文意象与礼仪性分量；其余句法依现代汉语调整。正文中的脚注标记[a]与脚注完全对应。
