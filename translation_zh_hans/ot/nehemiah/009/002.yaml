base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/002.yaml
  text: Then the offspring of Israel separated themselves from all foreigners[b][a], and they stood and confessed their sins and the iniquities of their fathers.
translation:
  language: zh_hans
  text: 以色列的后裔[a]与所有外族人分开；他们站着，承认自己的罪和他们祖先的罪孽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文直译为“种子”，指以色列的子孙。
    reason: lexical_alternative
  - marker: b
    text: 原文为“他们祖先的罪孽”；这里可能指群体认罪时一并承认祖先所犯的过错，并不明确说明后代承担祖先的个人罪责。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבָּדְלוּ
  choice: 分别出来
  rationale: 该词是בדל的尼法勒式，在此以人为主语，表达主动使自己与他者分开；“分别出来”自然保留了其反身意味。
- source_word: זֶרַע יִשְׂרָאֵל
  choice: 以色列的后裔
  rationale: זֶרַע字面为“种子”，此处是集合性用法，指源自以色列的后代；现代汉语用“后裔”既清楚又保留血缘承继之意。
- source_word: מִכֹּל בְּנֵי נֵכָר
  choice: 与一切外族人
  rationale: בְּנֵי נֵכָר是指外族人或外来族裔的惯用表达，并非专指男性；介词מִן在“分别”这一语境中自然译为“与……分别”。
- source_word: וַיַּעַמְדוּ
  choice: 站着
  rationale: עמד通常意为“站立”；此处描述认罪时的姿态，“站着”简洁自然。
- source_word: וַיִּתְוַדּוּ
  choice: 承认
  rationale: ידה的希特帕勒式在此意为认罪或作出承认；因宾语已明确为罪与罪孽，“承认”符合现代汉语并避免重复表达。
- source_word: חַטֹּאתֵיהֶם
  choice: 自己的罪
  rationale: חַטָּאת复数在此直接指他们所犯的罪；“自己的”清楚指回以色列后裔。
- source_word: עֲוֺנוֹת אֲבֹתֵיהֶם
  choice: 他们祖先的罪孽
  rationale: עָוֹן可指罪孽、罪责或惩罚；此处与“罪”平行并同受“承认”支配，译作“罪孽”保留其道德分量，也不把含义限定为后果。
theological_decisions:
- issue: 群体承认祖先的罪孽
  choice: 译明他们既承认自己的罪，也承认祖先的罪孽
  alternative: 将后半句理解为只承认祖先罪责所带来的后果，或仅作历史回顾
  rationale: 希伯来文把“他们的罪”和“他们祖先的罪孽”并列置于“承认”之下。译文保留这种群体性认罪的张力，但不进一步断言后代因此承受祖先的个人罪责。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“分别出来”保留原文的反身行动感；“外族人”避免把惯用语误解为仅指男性；“祖先”比“父辈”更适合此处跨世代的群体认罪语境。
