source:
  edition: WLC
  text: וַ/יָּ֜קָם עַֽל מַֽעֲלֵ֣ה הַ/לְוִיִּ֗ם יֵשׁ֨וּעַ וּ/בָנִ֜י קַדְמִיאֵ֧ל שְׁבַנְיָ֛ה בֻּנִּ֥י שֵׁרֵבְיָ֖ה בָּנִ֣י כְנָ֑נִי וַֽ/יִּזְעֲקוּ֙ בְּ/ק֣וֹל גָּד֔וֹל אֶל יְהוָ֖ה אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/004.yaml
  text: Then Jeshua[a], Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Kenani stood on the platform of the Levites, and they cried out with a loud voice to Yahweh their God.
translation:
  language: zh_hans
  text: 于是，耶书亚、巴尼、甲篾、示巴尼、布尼、示利比、巴尼和基拿尼站在利未人的台阶[a]上，大声向耶和华他们的神呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文可指“上升处”或“台阶”；这里也可能是指与利未人有关的高台。
    reason: 保留מַעֲלֵה在“台阶、上升处、高台”之间的词义空间，避免在正文中武断限定。
lexical_decisions:
- source_word: וַיָּקָם
  choice: 站在
  rationale: קום在此表示起身并站立；结合后面的地点短语，译作“站在”自然且准确。
- source_word: מַעֲלֵה הַלְוִיִּם
  choice: 利未人的台阶
  rationale: מַעֲלֵה可指上升处、台阶或高起的平台。“台阶”贴近词义，同时用脚注保留其可能指高台的语境含义。
- source_word: יֵשׁוּעַ וּבָנִי קַדְמִיאֵל שְׁבַנְיָה בֻּנִּי שֵׁרֵבְיָה בָּנִי כְנָנִי
  choice: 耶书亚、巴尼、甲篾、示巴尼、布尼、示利比、巴尼和基拿尼
  rationale: 按希伯来文音译人名，并保留原文中两次出现的“巴尼”，不作协调或删改。
- source_word: וַיִּזְעֲקוּ
  choice: 呼求
  rationale: זעק表示强烈呼喊，向神发出时常含求告意味；“呼求”兼顾声音的强度和祷告方向。
- source_word: בְּקוֹל גָּדוֹל
  choice: 大声
  rationale: 这是希伯来语表示高声说话的常用表达；现代汉语译作“大声”简洁自然。
- source_word: אֶל יְהוָה
  choice: 向耶和华
  rationale: 将四字神名直接译为汉语通行音译“耶和华”，保留其专名性质。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的神
  rationale: 忠实表达第三人称复数所属后缀，并保留原文“耶和华”与“他们的神”的同位关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。采用现代中文圣经传统中最通行、普通读者最易识别的专名“耶和华”，而不以称号“主”取代。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。人名沿用常见圣经音译；句式保持清楚流畅，并保留原文名单中重复出现的“巴尼”。
