  text: וַ/תֵּ֛רֶא אֶת עֳנִ֥י אֲבֹתֵ֖י/נוּ בְּ/מִצְרָ֑יִם וְ/אֶת זַעֲקָתָ֥/ם שָׁמַ֖עְתָּ עַל יַם סֽוּף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/009.yaml
  text: You saw the affliction of our fathers in Egypt[a], and you heard their cry at the Red Sea.
translation:
  language: zh_hans
  text: 你看见了我们祖先在埃及所受的苦难，也听见了他们在芦苇海[a]边的呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“红海”。希伯来语作“芦苇海”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 你看见了
  rationale: 直译 ראה，并保留祷告中对上帝的第二人称直接称呼；上下文自然包含上帝关注其苦情之意，无须在正文中增译。
- source_word: עֳנִי
  choice: 所受的苦难
  rationale: 涵盖困苦、患难和受压迫的处境，现代汉语自然，同时不过度限定苦难的具体成因。
- source_word: אֲבֹתֵינוּ
  choice: 我们祖先
  rationale: 此处指共同体在埃及的先辈；“祖先”在现代汉语中准确、自然，不必机械采用可能引起仅指父亲之误解的“列祖”。
- source_word: בְּמִצְרָיִם
  choice: 在埃及
  rationale: 直接表达地点。
- source_word: זַעֲקָתָם
  choice: 他们……的呼求
  rationale: זְעָקָה 是人在困境中发出的求助呼声；“呼求”兼具哀声与求援意味，适合祷告叙事语境。
- source_word: שָׁמַעְתָּ
  choice: 听见了
  rationale: 忠实保留“听见”的措辞；在本段救赎叙事中可蕴含垂听和回应，但不在正文中提前明说。
- source_word: עַל
  choice: 在……边
  rationale: עַל 与地点连用可表示临近、在旁；结合 ים，译为“在……海边”是自然的现代汉语。
- source_word: יַם סוּף
  choice: 芦苇海
  rationale: 按希伯来语词形直接呈现“芦苇海”，避免以传统地名“红海”取代原文的词汇表达；传统译名在脚注说明。
