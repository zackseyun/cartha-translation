base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/023.yaml
  text: You multiplied their children like the stars of the heavens[c][b][a], and you brought them into the land that you had told their fathers to enter and possess.
translation:
  language: zh_hans
  text: 你使他们的子孙[a]多如天上的星[b]，又带他们进入那地，就是你曾对他们祖先说要进去占有[c]的那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子孙”也可译作“儿女”或“后代”。
    reason: lexical_alternative
  - marker: b
    text: “多如天上的星”呼应上帝赐给族长的应许。
    reason: cross_reference
  - marker: c
    text: “占有”也可译作“取得”或“承受为业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: 他们的子孙
  rationale: בנים 可狭义指“儿子”，也可泛指儿女或后代。本节谈到民族人数增多，译作“子孙”既自然，也保留亲属与世代延续的含义。
- source_word: הִרְבִּיתָ
  choice: 你使……多
  rationale: רבה 的使役式表示“使之增多”。这一表达简洁地保留了上帝主动使他们人数增长的意思。
- source_word: כְּכֹכְבֵי הַשָּׁמָיִם
  choice: 多如天上的星
  rationale: 贴近希伯来语的比喻，并保留其对族长所得应许的呼应；“天上的星”也是自然、庄重的现代汉语。
- source_word: וַתְּבִיאֵם
  choice: 又带他们进入
  rationale: בוא 的使役式在这里意为“使进入、带入”；“带他们进入”自然表达了进入那地的动作及上帝的主动作为。
- source_word: אֶל הָאָרֶץ
  choice: 进入……那地
  rationale: 介词与移动动词合用，表达的不只是到达，而是进入该地。
- source_word: אֲשֶׁר אָמַרְתָּ לַאֲבֹתֵיהֶם
  choice: 你曾对他们祖先说
  rationale: 忠实保留 אָמַר“说”的一般含义，不直接扩译为“应许”，以免将上下文所暗示的应许性质写入词面；“祖先”在现代汉语中比“父亲们”更准确地指族长及先辈。
- source_word: לָבוֹא לָרָשֶׁת
  choice: 要他们进去占有
  rationale: 两个不定式连用，说明先前所说之事的内容或目的。ירשׁ 在此指取得并占有那地，同时仍可能带有“承受为业”的意味，故以脚注保留该词义张力。
theological_decisions:
- issue: 对族长应许的语言呼应
  choice: 保留“多如天上的星”和“他们祖先”的措辞
  alternative: 译作较口语化的“像天空中的星星那么多”，或将“祖先”进一步明确为“亚伯拉罕、以撒和雅各”
  rationale: 本节以应许性的语言回顾上帝的信实，但原文没有在本句点名具体族长。译文保留明显呼应而不作解释性扩充。
- issue: ירשׁ 的领地与产业含义
  choice: 正文译作“占有”，脚注保留“承受为业”
  alternative: 正文直接译作“承受为业”或“取得”
  rationale: “占有”最直接表达进入并取得土地的语境；“承受为业”则凸显应许与产业的神学色彩。将后者列入脚注，可保存原词的多义性而不在正文中单方面定调。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“你曾对他们祖先说、要他们……”保留希伯来语句法关系，同时以顿号避免修饰层次含混。正文不直接加入“应许”一词，以保存原文“说”的宽泛表达；借“天上的星”及脚注呈现其应许背景。
