id: NEH.9.34
reference: Nehemiah 9:34
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶת מְלָכֵ֤י/נוּ שָׂרֵ֨י/נוּ֙ כֹּהֲנֵ֣י/נוּ וַ/אֲבֹתֵ֔י/נוּ לֹ֥א עָשׂ֖וּ תּוֹרָתֶ֑/ךָ וְ/לֹ֤א הִקְשִׁ֨יבוּ֙ אֶל מִצְוֺתֶ֔י/ךָ וּ/לְ/עֵ֣דְוֺתֶ֔י/ךָ אֲשֶׁ֥ר הַעִידֹ֖תָ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/034.yaml
  text: Even our kings[a], our officials, our priests, and our fathers did not keep your law[c][b], and they did not listen to your commandments and your testimonies with which you warned them.
translation:
  language: zh_hans
  text: 我们的君王、首领、祭司和先祖都没有遵行你的律法，也没有听从你的诫命和你用来警戒他们的法度。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “法度”含有上帝所立的圣约见证和郑重告诫之意；“你用来警戒他们的”也可译作“你借此作证指控他们的”。
    reason: 保留עֵדוֹת与העיד的词根联系、圣约见证意味，以及介词结构可能表达的指控含义。
lexical_decisions:
- source_word: וְאֶת
  choice: 都
  rationale: 本节承接上文列举各群体；汉语不必机械译出宾语标记，以“都”自然体现这些人共同负有责任。
- source_word: מְלָכֵינוּ
  choice: 我们的君王
  rationale: 准确表达复数名词及第一人称复数领属后缀。
- source_word: שָׂרֵינוּ
  choice: 我们的首领
  rationale: שָׂרִים指掌权者或官长；“首领”庄重而通俗，也避免把他们限定为现代行政官员。
- source_word: כֹּהֲנֵינוּ
  choice: 我们的祭司
  rationale: כֹּהֵן的标准译法。
- source_word: וַאֲבֹתֵינוּ
  choice: 我们的先祖
  rationale: אָבוֹת字面为“父辈”，在此指以色列过去的世代；“先祖”在现代汉语中自然且保留历史承续意味。
- source_word: לֹא עָשׂוּ תּוֹרָתֶךָ
  choice: 没有遵行你的律法
  rationale: עשה与תּוֹרָה搭配表示实行、遵守；“遵行”比字面的“行”更清楚，同时保留律法的圣约语境。
- source_word: הִקְשִׁיבוּ
  choice: 没有听从
  rationale: 该词表示留心听并响应；“听从”兼顾聆听与顺服，不仅是听见。
- source_word: מִצְוֺתֶיךָ
  choice: 你的诫命
  rationale: 保留正式的圣约用语，并与“律法”和“法度”相区别。
- source_word: וּלְעֵדְוֺתֶיךָ
  choice: 和你的法度
  rationale: עֵדוֹת在此指上帝具有见证和约束作用的圣约规定；“法度”是自然、庄重的传统汉语表达。
- source_word: אֲשֶׁר הַעִידֹתָ בָהֶם
  choice: 你用来警戒他们的
  rationale: העיד在此有郑重作证、告诫之意；“警戒”传达告诫性质，“用来”保留בָהֶם与前述法度之间的工具关系。
theological_decisions:
- issue: תּוֹרָה的译法
  choice: 律法
  alternative: 训诲
  rationale: 本节处于民族性的圣约认罪中，所指是上帝赐下并要求遵行的律法；“律法”最符合语境，但该词本身也可泛指训诲。
- issue: עֵדוֹת与העיד之间的词根呼应
  choice: 正文译作“法度……警戒”并以脚注说明见证含义
  alternative: 见证……作证指控
  rationale: 直译能更明显保留词根呼应，却在现代汉语中生硬且可能使“见证”被误解为个人经历；正文传达语境意义，脚注保留圣约见证及另一种句法理解。
- issue: אָבוֹת所指群体
  choice: 先祖
  alternative: 父辈
  rationale: 此处指以色列过去世代，并非只强调直接父亲；“先祖”不改变其历史群体所指，也更符合现代汉语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“君王、首领、祭司、先祖”形成整齐列举；“遵行、听从、诫命、法度”保持经文的圣约语域而不过度古雅。
