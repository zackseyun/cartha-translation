  text: וְ/עַתָּ֣ה אֱ֠לֹהֵי/נוּ הָ/אֵ֨ל הַ/גָּד֜וֹל הַ/גִּבּ֣וֹר וְ/הַ/נּוֹרָא֮ שׁוֹמֵ֣ר הַ/בְּרִ֣ית וְ/הַ/חֶסֶד֒ אַל יִמְעַ֣ט לְ/פָנֶ֡י/ךָ אֵ֣ת כָּל הַ/תְּלָאָ֣ה אֲֽשֶׁר מְ֠צָאַתְ/נוּ לִ/מְלָכֵ֨י/נוּ לְ/שָׂרֵ֧י/נוּ וּ/לְ/כֹהֲנֵ֛י/נוּ וְ/לִ/נְבִיאֵ֥/נוּ וְ/לַ/אֲבֹתֵ֖י/נוּ וּ/לְ/כָל עַמֶּ֑/ךָ מִ/ימֵי֙ מַלְכֵ֣י אַשּׁ֔וּר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/032.yaml
  text: 'And now[a], our God—the great, mighty, and fearsome God, who keeps the covenant and steadfast love—do not let all the hardship that has come upon us seem small before you: upon our kings, our officials, our priests, our prophets, our fathers[b], and all your people, from the days of the kings of Assyria until this day.'
translation:
  language: zh_hans
  text: 现在，我们的上帝啊，你是那伟大、大能、可畏[a]的上帝，守约施慈爱；求你不要把从亚述诸王的日子直到今日临到我们、临到我们的君王、首领、祭司、先知、列祖[b]和你全体子民的一切苦难看作小事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可畏”也可译作“令人敬畏”。这里的希伯来语指上帝使人心生敬畏和畏惧。
    reason: lexical_alternative
  - marker: b
    text: “列祖”也可译作“先祖”。希伯来语为阳性复数，在这里指本民族历代的父辈。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: 上帝
  rationale: 此词与“我们的上帝”构成同位称呼，后接一系列神圣称号；译作“上帝”自然保留呼格语气，也避免生硬重复。
- source_word: הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא
  choice: 伟大、大能、可畏的
  rationale: 保留三个并列的盟约性称号；“可畏”表达令人敬畏、使人心生畏惧之意，而非仅指可怕。
- source_word: שׁוֹמֵר
  choice: 守
  rationale: 分词描述上帝持续不变的作为；“守约”是现代汉语中清楚、凝练且符合语境的表达。
- source_word: הַבְּרִית וְהַחֶסֶד
  choice: 守约并施慈爱
  rationale: 原文直译为“守约和慈爱”；汉语用“守约并施慈爱”明确两项并列内容，同时使 חֶסֶד 所指忠贞、坚定的盟约之爱自然可懂。
- source_word: אַל יִמְעַט לְפָנֶיךָ
  choice: 求你不要把……看作小事
  rationale: 这是请求上帝不要视其苦难为微不足道的惯用表达；如此翻译保留原意，并符合现代汉语祷告语体。
- source_word: כָּל הַתְּלָאָה
  choice: 一切苦难
  rationale: תלאה 指所经历的艰难、困苦；“苦难”适合这里涵盖全民历史遭遇的集合性含义。
- source_word: אֲשֶׁר מְצָאַתְנוּ
  choice: 临到我们
  rationale: 原文直译为“找到我们”，是灾祸降临于人的习语；“临到我们”准确且具有庄重的经文语体。
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ וּלְכֹהֲנֵינוּ וְלִנְבִיאֵינוּ וְלַאֲבֹתֵינוּ
  choice: 临到了我们的君王、首领、祭司、先知、先祖
  rationale: 介词 לְ 标明苦难所波及的对象；“首领”可涵盖行政和社会领袖，先祖则保留 אבותינו 所指以色列历代父辈的历史含义。
- source_word: וּלְכָל עַמֶּךָ
  choice: 和你的全体子民
  rationale: 将受苦者从各类领袖和先祖扩展到整个盟约群体；“全体子民”自然体现 כָּל 的整体范围。
- source_word: מִימֵי מַלְכֵי אַשּׁוּר
  choice: 从亚述诸王的日子
  rationale: 直接保留原文结构和历史起点；“诸王”表明复数。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 自然表达从亚述诸王时期延续到说话者当下的完整时间跨度。
theological_decisions:
- issue: 如何表达盟约语境中的神圣称号 נורא
  choice: 可畏的上帝
  alternative: 令人敬畏的上帝
  rationale: “可畏”简洁保留神使人产生敬畏乃至畏惧的张力，且与“伟大、大能”组成庄重的并列称号；脚注说明其并非单指恐怖。
- issue: 如何翻译 אבותינו
  choice: 我们的先祖
  alternative: 我们的父辈
  rationale: 该词为阳性复数，在此指民族历史中的列祖；“先祖”既不抹去历史上的父系所指，也比现代汉语中的“父亲们”自然准确。
- issue: חֶסֶד 在盟约语境中的表达
  choice: 施慈爱
  alternative: 信实之爱
  rationale: חֶסֶד 含忠贞坚定的盟约之爱；正文采用普通读者易懂的“慈爱”，并由“守约”这一紧邻表达保留其盟约语境，避免把词义过度限定为单一神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。开头以“我们的上帝啊”明确呼告；用短句分开对上帝的称颂与恳求，减轻希伯来语长句在汉语中的负担。保留“可畏”“守约”“慈爱”等神学分量，同时避免古奥或宗派化措辞。
