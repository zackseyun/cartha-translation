revisions:
- from: 然而，在临到我们的一切事上，你是公义的；因为你行事信实[a]，我们却行了恶。
  to: 然而，在临到我们的一切事上，你是公义的；因你所行的是信实的，我们所行的却是邪恶的[a]。
  rationale: 修订仅澄清汉语中“因为”可能造成的错误因果关联，并以平行结构更贴近原文“你行了 אמת／我们行了恶”的对照。脚注保留 אֱמֶת 的较字面译法，同时说明其在本语境中的“信实、可靠”含义。
