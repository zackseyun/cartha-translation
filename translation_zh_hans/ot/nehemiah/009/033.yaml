id: NEH.9.33
reference: Nehemiah 9:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֣ה צַדִּ֔יק עַ֖ל כָּל הַ/בָּ֣א עָלֵ֑י/נוּ כִּֽי אֱמֶ֥ת עָשִׂ֖יתָ וַ/אֲנַ֥חְנוּ הִרְשָֽׁעְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/033.yaml
  text: Yet you are righteous in all that has come upon us[a], for you have acted faithfully, but we have acted wickedly.
translation:
  language: zh_hans
  text: 然而，在临到我们的一切事上，你是公义的；因你所行的是信实的，我们所行的却是邪恶的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你行了真实。”这里指你行事信实、可靠。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 然而……你
  rationale: 连词与独立代词在上下文中形成鲜明对比；“然而”自然地承接前文的认罪，并突出神与百姓行为的反差。
- source_word: צַדִּיק
  choice: 公义的
  rationale: 此词宣告神在百姓所遭遇的一切事上道德正直、处置正当；“公义”保留其重要的圣约和神学分量。
- source_word: עַל כָּל הַ/בָּא עָלֵי/נוּ
  choice: 在临到我们的一切事上
  rationale: עַל在此表达神的公义所关涉的范围；该译法既贴近希伯来语结构，也符合现代汉语表达。
- source_word: כִּי
  choice: 因为
  rationale: 引出前一句宣告的根据：神行事信实，而百姓行了恶。
- source_word: אֱמֶת עָשִׂיתָ
  choice: 你行事信实
  rationale: 字面近于“你行了真实”；אֱמֶת与עשה搭配时表示行为可靠、忠信。“行事信实”在汉语中自然，并保留其圣约语义；脚注注明较直译的表达。
- source_word: וַ/אֲנַחְנוּ
  choice: 我们却
  rationale: 此处连词在语境中具有转折对比作用，把百姓的恶行与神的信实相对照。
- source_word: הִרְשָׁעְנוּ
  choice: 行了恶
  rationale: Hiphil形式在此指作恶、行事邪恶；“行了恶”简洁自然，并保留其主动行为含义。
theological_decisions:
- issue: 神与临到以色列之灾祸的关系
  choice: 宣告神在临到百姓的一切事上是公义的
  alternative: 明确译成“你惩罚我们是公正的”
  rationale: 原文肯定神对于百姓经历之事的公义，却没有在本句中把所有事件明确解释为直接的惩罚机制；译文保留这种神学张力，不作超出原文的限定。
- issue: אֱמֶת对神行为的描述
  choice: 译为“行事信实”
  alternative: 译为“行了真实”或“所行的都真实”
  rationale: 原文措辞以“真实/信实”描述神的行动；“行事信实”准确传达其可靠忠信的含义，同时以脚注保留较字面的词义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“临到我们的一切事”保留经文的概括性；“公义”“信实”使用普通读者可理解、同时具有经文分量的词语。主文中的[a]与脚注完全对应。
