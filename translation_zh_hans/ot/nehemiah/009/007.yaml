base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/007.yaml
  text: You are Yahweh God[a], who chose Abram, brought him out from Ur of the Chaldeans, and gave him the name Abraham.
translation:
  language: zh_hans
  text: 你就是耶和华上帝；你拣选了亚伯兰，把他从迦勒底人的吾珥带出来，又给他改名为亚伯拉罕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: 你就是
  rationale: 保留独立代词组合的强调和直接认定语气，同时符合现代汉语表达。
- source_word: יְהוָה הָאֱלֹהִים
  choice: 耶和华上帝
  rationale: 将四字神名按现代中文圣经传统音译为“耶和华”，并保留后面的“上帝”，体现原文中神名与称号的并置。
- source_word: בָּחַרְתָּ בְּאַבְרָם
  choice: 你拣选了亚伯兰
  rationale: בחר在此表示选择；“拣选”自然、庄重，也不额外引入后期系统神学含义。介词在该结构中标示所选择的对象，汉语用直接宾语。
- source_word: וְהוֹצֵאתוֹ
  choice: 领他出了
  rationale: 使役形表达使其出来或带领出来；“领他出了”兼顾动作主体、带领意味和自然汉语。
- source_word: מֵאוּר כַּשְׂדִּים
  choice: 迦勒底人的吾珥
  rationale: 采用现代中文圣经中通行的地名与族名译法，明确吾珥与迦勒底人的关联。
- source_word: וְשַׂמְתָּ שְׁמוֹ אַבְרָהָם
  choice: 又给他改名为亚伯拉罕
  rationale: 原文直译为“把他的名字定为亚伯拉罕”；在改名语境中，“给他改名为”准确而自然，并清楚呈现亚伯兰与亚伯拉罕的区别。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者较熟悉的“耶和华”，而脚注说明原文使用神名YHWH并列出“雅威”这一音译，以保留文本证据且避免把神名仅译成称号。
- issue: יהוה与האלהים的关系
  choice: 耶和华上帝
  alternative: 耶和华，就是上帝
  rationale: 两者在原文中相邻并形成认定关系。正文保留二者而不增添解释性系词，以维持原文简洁和可能的同位语语感。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“你就是”保留祷告中的强调；句中重复“你”使连续动作的主语清楚。“出了”与“改名为”均为自然现代汉语，同时忠实表达希伯来文动作。
