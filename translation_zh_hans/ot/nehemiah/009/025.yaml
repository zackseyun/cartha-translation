  to: 他们攻取了坚固城和肥沃的土地[a]，占有了装满各样美物的房屋、凿成的蓄水池、葡萄园、橄榄树，以及许许多多的果树。他们吃了，得以饱足，变得肥胖，并尽享你极大的恩惠[b]。
