  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֞וּ עָרִ֣ים בְּצֻרוֹת֮ וַ/אֲדָמָ֣ה שְׁמֵנָה֒ וַ/יִּֽירְשׁ֡וּ בָּתִּ֣ים מְלֵֽאִים כָּל ט֠וּב בֹּר֨וֹת חֲצוּבִ֜ים כְּרָמִ֧ים וְ/זֵיתִ֛ים וְ/עֵ֥ץ מַאֲכָ֖ל לָ/רֹ֑ב וַ/יֹּאכְל֤וּ וַֽ/יִּשְׂבְּעוּ֙ וַ/יַּשְׁמִ֔ינוּ וַ/יִּֽתְעַדְּנ֖וּ בְּ/טוּבְ/ךָ֥ הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/025.yaml
  text: They captured fortified cities and fertile land[a], and took possession of houses full of every good thing, hewn cisterns, vineyards, olive trees, and fruit trees in abundance. So they ate and were filled and grew fat[c][b], and they delighted themselves in your great goodness.
translation:
  language: zh_hans
  text: 他们攻取了坚固城和肥沃的土地[a]，占有了装满各样美物的房屋、凿成的蓄水池、葡萄园、橄榄树，以及许许多多的果树。他们吃了，得以饱足，变得肥胖，并尽享你极大的恩惠[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“肥美的土地”；原文直译为“肥的土地”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们因你极大的恩惠而安逸享乐。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: 攻取了
  rationale: לכד在城邑被征服的语境中指夺取、攻占；“攻取”自然保留了军事行动的意味。
- source_word: עָרִים בְּצֻרוֹת
  choice: 坚固城
  rationale: בצר表示设防、坚固；“坚固城”是简洁、通行且符合圣经历史叙事语体的表达。
- source_word: אֲדָמָה שְׁמֵנָה
  choice: 肥沃的土地
  rationale: 原文直译为“肥美的土地”，是指土壤丰饶多产；“肥沃的土地”以现代汉语自然传达这一习语。
- source_word: וַיִּירְשׁוּ
  choice: 占有了
  rationale: ירשׁ可指继承、占有或取得产业；这里承接征服行动，“占有了”保留取得并持有这些产业的含义，而不限定为血缘继承。
- source_word: בָּתִּים מְלֵאִים כָּל טוּב
  choice: 装满各样美物的房屋
  rationale: כָּל טוּב泛指各种美好而有价值的物品和供应；“各样美物”既保留概括性，也符合中文列举产业的语境。
- source_word: בֹּרוֹת חֲצוּבִים
  choice: 凿成的水池
  rationale: בּוֹר在此指储水的池或窖，חצוב指从岩土中凿出；“凿成的水池”准确且不增添原文没有明说的“早已”。
- source_word: כְּרָמִים וְזֵיתִים וְעֵץ מַאֲכָל
  choice: 葡萄园、橄榄树，以及……果树
  rationale: 按农业资产的具体所指翻译：כְּרָמִים是葡萄园，זֵיתִים在此为橄榄树，עֵץ מַאֲכָל是可供食用的果树。
- source_word: לָרֹב
  choice: 许许多多的
  rationale: 表达数量丰盛；放在“果树”前符合希伯来语最直接的句法关联，也以自然汉语体现数量之多。
- source_word: וַיֹּאכְלוּ וַיִּשְׂבְּעוּ
  choice: 他们吃了，得以饱足
  rationale: 保留两个连续动词及其因果推进；שׂבע既有吃饱也有满足之意，“饱足”兼顾具体与较庄重的语体。
- source_word: וַיַּשְׁמִינוּ
  choice: 身体肥胖
  rationale: 原词直指变得肥胖，是富足生活的鲜明身体意象；不将其弱化为抽象的“兴旺”，也不擅自加入道德评判。
- source_word: וַיִּתְעַדְּנוּ
  choice: 尽享福乐
  rationale: 该词表示享受丰裕、安逸或奢美的生活；“尽享福乐”自然传达其强烈的享乐意味，同时避免把经文本身未明定的谴责写入正文。
- source_word: בְּטוּבְךָ הַגָּדוֹל
  choice: 在你极大的恩惠中
  rationale: טוּב可指美善、福惠或丰盛供应；此处物质丰饶的上下文适合“恩惠”，而“在……中”保留介词ב的范围性表达。
theological_decisions:
- issue: “身体肥胖”是否含有道德谴责
  choice: 保留具体意象，不在译文中明示褒贬
  alternative: 译作“变得富足”或“养尊处优”
  rationale: 本节首先描述上帝所赐的丰盛；后文虽可能使这一状态带有反讽，但该动词本身不要求译者在此预先加入负面判断。
- issue: בְּטוּבְךָ הַגָּדוֹל中神的美善与物质丰盛的关系
  choice: 在你极大的恩惠中
  alternative: 因你丰盛的赏赐；在你极大的美善中
  rationale: “恩惠”既把供应归于神，又不把טוּב缩限为物质财富；介词译为“在……中”，保留可理解为处境、范围或原因的张力。
- issue: וַיִּתְעַדְּנוּ的享乐强度
  choice: 尽享福乐
  alternative: 生活奢华；安享丰盛
  rationale: 原词包含在丰裕中享乐的意味，但此句未明确判定这种享受为罪；“尽享福乐”保留强度而不强行作神学裁决。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文以短句推进希伯来语连续动词的节奏，并保留“身体肥胖”的具体意象；“凿成的水池”不添加原文未明说的“早已”。所有脚注标记均已置于正文相应位置。
