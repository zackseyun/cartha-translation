source:
  edition: WLC
  text: וְ/עַ֤ל הַר סִינַי֙ יָרַ֔דְתָּ וְ/דַבֵּ֥ר עִמָּ/הֶ֖ם מִ/שָּׁמָ֑יִם וַ/תִּתֵּ֨ן לָ/הֶ֜ם מִשְׁפָּטִ֤ים יְשָׁרִים֙ וְ/תוֹר֣וֹת אֱמֶ֔ת חֻקִּ֥ים וּ/מִצְוֺ֖ת טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/013.yaml
  text: You came down on Mount Sinai and spoke with them from heaven[a], and you gave them upright judgments, true laws[c][b], good statutes and commandments.
translation:
  language: zh_hans
  text: 你降临在西奈山上，从天上与他们说话[a]，赐给他们正直的典章、真实的训诲[b]、美善的律例和诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从天上对他们说话。”原文介词直译为“与”。
    reason: lexical_alternative
  - marker: b
    text: “真实的训诲”也可译作“真理的律法”或“可靠的教导”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַר סִינַי יָרַדְתָּ
  choice: 你降临在西奈山上
  rationale: “降临”自然表达 ירד 的下降动作，并适合此处上帝显现的庄重语境；“在西奈山上”准确呈现 עַל הַר סִינַי。
- source_word: וְדַבֵּר עִמָּהֶם מִשָּׁמָיִם
  choice: 从天上与他们说话
  rationale: 保留 עִם 的“与”义，不把互动色彩直接化约为单向的“对……说”；“从天上”直译 מִשָּׁמָיִם。
- source_word: וַתִּתֵּן לָהֶם
  choice: 赐给他们
  rationale: “赐给”符合 נתן ל־ 的含义，也适合上帝赐下律法的语境。
- source_word: מִשְׁפָּטִים יְשָׁרִים
  choice: 正直的典章
  rationale: “典章”保留 מִשְׁפָּטִים 的司法、法令语义；“正直”贴近 יְשָׁרִים 的正、直含义。
- source_word: וְתוֹרוֹת אֱמֶת
  choice: 真实的训诲
  rationale: תּוֹרוֹת 是复数，可指教导、训诲或律法；“训诲”既保留其教导面向，又避免与后面的律例、诫命混同。אֱמֶת 表明这些训诲真实可靠。
- source_word: חֻקִּים וּמִצְוֺת טוֹבִים
  choice: 美善的律例和诫命
  rationale: 分别以“律例”和“诫命”呈现两个法律名词；复数形容词 טוֹבִים 自然理解为修饰并列的两项，“美善”兼具道德价值与良善品质。
theological_decisions:
- issue: 是否区分本节四个法律相关名词
  choice: 分别译为“典章、训诲、律例、诫命”
  alternative: 合并译作“律法和命令”，或把 תּוֹרוֹת 译为“律法”
  rationale: 原文有意并列不同术语，强调上帝在西奈所赐启示的丰富性；保留区分可避免抹平原文层次。
- issue: עִמָּהֶם 所表达的说话关系
  choice: 与他们说话
  alternative: 对他们说话
  rationale: “与”较直接地保留希伯来介词 עִם 的互动色彩，同时不对神人交谈的具体方式作额外解释。
- issue: אֱמֶת 的表达
  choice: 真实的
  alternative: 真理的；可靠的
  rationale: “真实的”保留“真、可信、可靠”的语义张力，不把词义限缩为抽象教义意义或仅为实用可靠性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留四个法律术语的排比层次；“降临”“典章”“律例”“诫命”维持经文语体，但句法保持自然清晰。
