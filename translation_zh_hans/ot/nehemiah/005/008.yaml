source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה לָ/הֶ֗ם אֲנַ֣חְנוּ קָ֠נִינוּ אֶת אַחֵ֨י/נוּ הַ/יְּהוּדִ֜ים הַ/נִּמְכָּרִ֤ים לַ/גּוֹיִם֙ כְּ/דֵ֣י בָ֔/נוּ וְ/גַם אַתֶּ֛ם תִּמְכְּר֥וּ אֶת אֲחֵי/כֶ֖ם וְ/נִמְכְּרוּ לָ֑/נוּ וַֽ/יַּחֲרִ֔ישׁוּ וְ/לֹ֥א מָצְא֖וּ דָּבָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/008.yaml
  text: And I said to them[a], “We have bought back our Jewish brothers who were sold to the nations, as much as we were able. But now you yourselves are even selling your brothers[b], and they must be sold to us!” Then they were silent and found nothing to say.
translation:
  language: zh_hans
  text: 我对他们说：“我们已经尽力赎回那些被卖给外族人的犹太弟兄[a]；你们竟然还卖自己的弟兄，以致他们被卖给我们吗[b]？”他们便默不作声，无话可答。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太弟兄”也可译作“犹太同胞”。希伯来文直译为“我们的弟兄，那些犹太人”，使用阳性亲属称谓来指同一共同体的成员。
    reason: lexical_alternative
  - marker: b
    text: 这句希伯来文十分简略，也可理解为陈述荒谬的后果：“结果他们被卖给我们！”
    reason: alternative_reading
lexical_decisions:
- source_word: קָנִינוּ
  choice: 赎回
  rationale: 该动词本义为“买、购得”；在此语境中，尼希米等人出钱使被卖到外族中的犹太同胞脱离奴役。“赎回”自然表达付出代价买回并使之获释的含义，但不在此处额外引入系统神学意义。
- source_word: אַחֵינוּ הַיְּהוּדִים
  choice: 犹太弟兄
  rationale: 保留希伯来文阳性亲属称谓所表达的同族共同体关系，同时直接译出“犹太人”。
- source_word: הַנִּמְכָּרִים לַגּוֹיִם
  choice: 被卖给外族人的
  rationale: 被动表达对应原文分词；此处 גּוֹיִם 指犹太共同体以外的民族，“外族人”比“列国”更符合现代汉语中人口被卖给他人的叙事语境。
- source_word: כְּדֵי בָנוּ
  choice: 尽力
  rationale: 该简练习语表示在能力或财力所及的范围内；“尽力”以自然汉语保留其限度与努力之意。
- source_word: וְגַם אַתֶּם
  choice: 如今你们自己竟然还要
  rationale: “你们自己”保留独立代词的强调，“竟然还要”传达 וְגַם 在责问中的递进和反衬；“如今”使前后行为的鲜明对照在汉语中清楚。
- source_word: תִּמְכְּרוּ
  choice: 卖
  rationale: 按上下文译为正在发生或意图继续的行为；与“竟然还要”结合，形成直接而有力的斥责。
- source_word: וְנִמְכְּרוּ לָנוּ
  choice: 难道还要让他们再被卖给我们吗
  rationale: 原句简短且含混，可视为陈述荒谬后果，也可视为修辞问句。正文采用修辞问句，在现代汉语中较自然地表达尼希米的震惊与责备；脚注保留陈述式理解。
- source_word: וַיַּחֲרִישׁוּ וְלֹא מָצְאוּ דָּבָר
  choice: 默不作声，无话可答
  rationale: 前半保留“沉默”的动作，后半按希伯来语惯用表达译出“找不到话回应”的实际含义。
theological_decisions:
- issue: 亲属称谓 אַחֵינוּ / אַחֵיכֶם 的性别与共同体范围
  choice: 弟兄
  alternative: 同胞；弟兄姊妹
  rationale: 原文使用阳性复数亲属称谓，正文保留“弟兄”及其共同体团结色彩，不擅自扩展为“弟兄姊妹”；脚注说明其语境中也可自然理解为同族同胞。
- issue: וְנִמְכְּרוּ לָנוּ 的语气
  choice: 修辞问句：“难道还要让他们再被卖给我们吗？”
  alternative: 陈述式：“结果他们又得被卖给我们！”
  rationale: 希伯来文没有显式疑问标记，语句本身简短而有歧义。正文依上下文采用自然的修辞问句，但以脚注明确保留陈述荒谬后果的可能理解，避免将歧义绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“赎回”准确表达出钱买回并解救同胞；“竟然”“难道”体现当面斥责的力度。句末以“默不作声，无话可答”保持原文简洁有力的收束。
