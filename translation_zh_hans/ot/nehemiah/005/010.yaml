base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/010.yaml
  text: And I also[a], my brothers and my young men, are lending them money and grain. Please[c][b], let us stop this burden.
translation:
  language: zh_hans
  text: 我、我的弟兄和我的随从[a]也借给他们[b]银钱和粮食。我们还是放下这重担[c]吧！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随从”或译“年轻人”或“仆人”。
    reason: lexical_alternative
  - marker: b
    text: “借给他们”也可译为“作他们的债主”或“向他们索债”；希伯来语动词可指放贷，也可带有债权人催索的意味。
    reason: lexical_alternative
  - marker: c
    text: “这重担”在这里也可理解为“这债务”或“这种催索”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: 我……也
  rationale: 保留וְגַם的追加和强调意味，把尼希米及其同伴的做法与上文所责备的情形联系起来；按现代汉语语序将“也”置于复合主语之后。
- source_word: אַחַי
  choice: 我的弟兄
  rationale: 保留亲属称谓及其表达的群体情谊；上下文中也可能泛指亲族或同族同伴。
- source_word: וּנְעָרַי
  choice: 随从
  rationale: נְעָרִים可指年轻人，也常指侍从或仆役。此处有领属后缀，所指很可能是尼希米身边供职的人；“随从”在现代汉语中自然，也避免无根据地强调年龄。
- source_word: נֹשִׁים בָּהֶם
  choice: 借给他们
  rationale: 该分词表示放贷或以债权人身份对待某人。“借给他们”通顺清楚；其可能含有催索、盘剥意味的语义张力留在脚注中。
- source_word: כֶּסֶף וְדָגָן
  choice: 银钱和粮食
  rationale: כֶּסֶף本义为银，在借贷语境中指钱财；“银钱”兼顾词源形象和经济含义。דָגָן在此泛指谷物粮食，译作“粮食”更符合现代汉语。
- source_word: נַעַזְבָה נָּא
  choice: 请让我们放下……吧
  rationale: 第一人称复数祈愿式配合נָא，表达恳请式劝勉。“请……吧”传达请求语气，“让我们”保留共同停止这一行动的呼吁。
- source_word: הַמַּשָּׁא הַזֶּה
  choice: 这重担
  rationale: מַשָּׁא的基本意象是负担；在本段经济语境中可指债务或债权人的索取。正文保留“重担”这一比喻，不把具体所指过早限定为利息、债务或催索。
theological_decisions: []
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“放下这重担”保留原文的经济比喻及其多义性；正文不擅自把它明确化为免息、免债或停止催收。所有脚注标记均紧随相应词语出现。
