  text: גַּם חָצְנִ֣/י נָעַ֗רְתִּי וָֽ/אֹמְרָ֡/ה כָּ֣כָה יְנַעֵ֪ר הָֽ/אֱלֹהִ֟ים אֶת כָּל הָ/אִישׁ֩ אֲשֶׁ֨ר לֹֽא יָקִ֜ים אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה מִ/בֵּית/וֹ֙ וּ/מִ֣/יגִיע֔/וֹ וְ/כָ֛כָה יִהְיֶ֥ה נָע֖וּר וָ/רֵ֑ק וַ/יֹּאמְר֨וּ כָֽל הַ/קָּהָ֜ל אָמֵ֗ן וַֽ/יְהַלְלוּ֙ אֶת יְהוָ֔ה וַ/יַּ֥עַשׂ הָ/עָ֖ם כַּ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/013.yaml
  text: I also shook out the fold of my garment and said[a], “So may God shake out every man who does not fulfill this promise, from his house and from his labor; so may he be shaken out and emptied.” And all the assembly said, “Amen,” and praised Yahweh[c][b]. And the people did according to this promise.
translation:
  language: zh_hans
  text: 我也把衣襟[a]抖空了，说：“凡不履行这承诺的人，愿上帝也这样把他从他的家和劳碌所得[b]中抖出去；愿他也这样被抖空，一无所有。”全会众都说：“阿们！”并赞美耶和华[c]。百姓就照这承诺做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衣襟”也可译作“怀中”或“衣服前面的兜襟”。这里指袍服上可用来兜装物品的衣褶；尼希米把它抖空，象征违约者将被抖出去，失去所有。
    reason: lexical_alternative
  - marker: b
    text: “劳碌所得”也可译作“劳碌”。原词既可指劳作本身，也可指劳作所得的成果。
    reason: lexical_ambiguity
  - marker: c
    text: “耶和华”是希伯来文神名 יהוה 的传统中文音译；也常拟音为“雅威”。
    reason: divine_name
lexical_decisions:
- source_word: חָצְנִי
  choice: 衣襟
  rationale: 指袍服前部可兜装物品的衣褶；“衣襟”既具体自然，也适合抖空衣物这一象征动作。
- source_word: נָעַרְתִּי / יְנַעֵר / נָעוּר
  choice: 抖了抖／抖出去／被抖出去
  rationale: 保留同一词根的反复，使尼希米的象征动作与咒诅中的后果彼此呼应，并呈现被除去、被剥夺的意象。
- source_word: כָּכָה
  choice: 也这样／这样
  rationale: 在伴随象征动作的誓咒中表达“照此方式”的祈愿语气。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此处是对以色列之神的通常称呼；现代普通话中“上帝”庄重自然。
- source_word: כָּל הָאִישׁ
  choice: 凡……的人
  rationale: 希伯来语为概括性的阳性单数；汉语用“凡……的人”自然表达逐一涵盖的代表性含义，而不额外限定性别。
- source_word: יָקִים אֶת הַדָּבָר הַזֶּה
  choice: 履行这承诺
  rationale: 在当前起誓和归还财物的语境中，意为使所说之事成立并付诸实行；“履行这承诺”准确而自然。
- source_word: מִבֵּיתוֹ וּמִיגִיעוֹ
  choice: 从他的家和劳碌所得中
  rationale: יְגִיעַ可指劳碌本身或劳碌的成果；在被抖空、失去所有的语境中，“劳碌所得”较为顺畅，同时用脚注保留歧义。
- source_word: וָרֵק
  choice: 变得一无所有
  rationale: רֵק表示空无；此处承接“抖出去”的动作，指人被剥夺而落空，译法清楚表达意象所指。
- source_word: הַקָּהָל
  choice: 全会众
  rationale: 指聚集起来的整个群体；“会众”是庄重且为现代读者熟悉的群体称呼。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接呈现四字神名在现代简体中文圣经传统中广为人知的音译，不以头衔替代。
- source_word: כַדָּבָר הַזֶּה
  choice: 照这承诺
  rationale: 回指众人刚才承诺实行的事；按上下文译作“承诺”比字面的“话”更明确。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用现代中文读者最熟悉且庄重的传统音译“耶和华”，不以“主”这一称号取代神名；“雅威”是学术上常见的另一拟音。
- issue: 誓咒中上帝施行惩罚的语气
  choice: 愿上帝也这样把他……抖出去
  alternative: 上帝也必这样把他……抖出去
  rationale: 上下文是以象征动作伴随的咒诅性祈愿；“愿”保留其祈愿和誓咒性质，不把它单纯改写为直接预言。
- issue: הָאִישׁ 的概括性阳性单数
  choice: 凡不履行这承诺的人
  alternative: 每一个不履行这承诺的男人
  rationale: 原文单数阳性在此具有代表、概括作用。汉语“凡……的人”忠实传达涵盖每一个违约者的意义，避免加入上下文并未强调的生理性别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。通过“抖了抖／抖出去／被抖出去”保留原文的重复和象征性文字呼应；整体句式适合公开诵读。
