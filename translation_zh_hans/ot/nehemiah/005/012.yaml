source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ נָשִׁ֗יב וּ/מֵ/הֶם֙ לֹ֣א נְבַקֵּ֔שׁ כֵּ֣ן נַעֲשֶׂ֔ה כַּ/אֲשֶׁ֖ר אַתָּ֣ה אוֹמֵ֑ר וָ/אֶקְרָא֙ אֶת הַ/כֹּ֣הֲנִ֔ים וָֽ/אַשְׁבִּיעֵ֔/ם לַ/עֲשׂ֖וֹת כַּ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/012.yaml
  text: And they said[a], “We will restore it, and from them we will require nothing; we will do as you say.” Then I called the priests and made them swear to do according to this word.
translation:
  language: zh_hans
  text: 他们说：“我们必归还，不再向他们索要什么；我们会照你所说的做。”于是我召来祭司，让他们起誓，照这话[a]去做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译为“这件事”。希伯来语“דָּבָר”可指“话”或“事情”；在这里也带有公开承诺的意味。
    reason: 保留דָּבָר的词义范围，不把它仅限定为“承诺”。
lexical_decisions:
- source_word: נָשִׁיב
  choice: 我们必归还
  rationale: 这是שׁוב的使役式，在本段经济纠纷的语境中指归还先前取得或扣押之物。原文宾语承接上文而省略，中文也可自然省略，以免擅自限定具体归还之物。
- source_word: וּמֵהֶם לֹא נְבַקֵּשׁ
  choice: 不再向他们索要什么
  rationale: בקש在此不是一般的“寻找”，而是在债务和财产语境中表示索求或追讨。“索要”保留其要求偿付的力度，“不再”则自然表达终止现有索求的语境含义。
- source_word: כֵּן נַעֲשֶׂה כַּאֲשֶׁר אַתָּה אוֹמֵר
  choice: 我们会照你所说的做
  rationale: 将כֵּן与后面的比较从句合并为自然现代汉语，清楚表达他们同意按尼希米的话行事。
- source_word: וָאֶקְרָא אֶת־הַכֹּהֲנִים
  choice: 于是我召来祭司
  rationale: קרא带直接宾语时可指召来或召集；“于是”体现叙事连续关系。
- source_word: וָאַשְׁבִּיעֵם
  choice: 让他们起誓
  rationale: שׁבע的使役式表示使人宣誓。“让……起誓”简明庄重；代词“他们”保留原文代词所可能产生的指代张力，不在正文中强行补明。
- source_word: לַעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: 照这话去做
  rationale: כ保留为“照”，דָּבָר直译为“话”，既承接刚才的口头承诺，也不排除“事情、事项”的语义范围。
theological_decisions:
- issue: וָאַשְׁבִּיעֵם中代词“他们”的所指
  choice: 保留为“他们”，不在正文中明确指定
  alternative: 译为“让那些贵族和官长起誓”或“让祭司起誓”
  rationale: 上下文通常使人理解为先前作出承诺的人在祭司面前起誓，但原句最近的复数名词是“祭司”。为避免消除原文的指代张力，正文保留代词。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“必归还”表达郑重承诺；分号区分归还与停止索求两个并列承诺。脚注标记置于其实际说明的“这话”之后。
