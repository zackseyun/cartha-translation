base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/019.yaml
  text: Remember me[a], my God, for good, for all that I have done for this people.
translation:
  language: zh_hans
  text: 我的神啊，求你因我为这百姓所做的一切，施恩记念我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你为善记念我。”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: 求你记念我
  rationale: זכר与לִי构成祷告中的请求，意思是求上帝顾念说话者；现代汉语以“求你记念我”自然表达这一祈求，并保留“记念”的经文语体。
- source_word: אֱלֹהַי
  choice: 我的上帝啊
  rationale: 带第一人称单数后缀，并在此作直接称呼；“啊”清楚传达呼语和祷告语气。
- source_word: לְטוֹבָה
  choice: 赐福给我
  rationale: 字面为“为着好处／福祉”，在求上帝记念的语境中指带来好的、恩惠的结果。“赐福给我”在现代汉语中自然，但脚注保留“施恩记念”的词义可能。
- source_word: כֹּל אֲשֶׁר עָשִׂיתִי
  choice: 我……所做的一切
  rationale: 准确表达“所有我所做的”，并采用自然的现代汉语关系结构。
- source_word: עַל הָעָם הַזֶּה
  choice: 为这百姓
  rationale: עַל在此表示为百姓或代表百姓而做；“为这百姓”简洁地保留受益或代行的含义。
theological_decisions:
- issue: 尼希米求上帝记念其行为的性质
  choice: 译为求上帝记念并赐福，不把祈求解释成凭功劳索取报偿
  alternative: 译成求上帝公开为他申辩，或明确说上帝因其功劳而奖赏他
  rationale: 原文把有利的记念与尼希米为百姓所做之事联系起来，却未界定这种联系的系统神学性质；译文保留其祈求及内在张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“记念”保留圣经语境中不只是回想、也包含顾念并采取行动的含义；脚注明示לְטוֹבָה可与“记念”合译为“施恩记念”。
