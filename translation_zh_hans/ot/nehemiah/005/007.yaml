base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/007.yaml
  text: Then I took counsel with myself[a], and I brought charges against the nobles and the officials, and I said to them, “You are exacting interest[c][b], each from his brother.” And I assembled a great assembly against them.
translation:
  language: zh_hans
  text: 于是，我仔细斟酌[a]，便指责贵族和官长，对他们说：“你们各人竟向自己的弟兄收取利息[b]！”我又召集了一次大会反对他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我心里反复思量。”希伯来语是描述人在内心商议、权衡的习语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你们各人竟向自己的同胞加重债务负担！”“弟兄”强调他们都是以色列同胞；“利息”所译的希伯来词也可泛指借贷所加的负担。
    reason: lexical_alternative
  - marker: c
    text: 直译近于：“我把一个大会置于他们之上。”这是指召集一个大型公众集会反对他们的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵךְ לִבִּי עָלַי
  choice: 我仔细斟酌
  rationale: 这是描述内心权衡、商议的习语；译为“仔细斟酌”自然地表达尼希米在采取行动前深思熟虑，而不把它误解为单纯的愤怒。
- source_word: וָאָרִיבָה
  choice: 便指责
  rationale: ריב 可指争辩、控诉或提出指控。此处面对领袖揭露其行为，“指责”既保留责难和准司法意味，也符合现代汉语表达。
- source_word: הַחֹרִים
  choice: 贵族
  rationale: 指犹大社会中的上层人士；“贵族”是清楚而通行的对应词。
- source_word: הַסְּגָנִים
  choice: 官长
  rationale: 指行政管理者或地方领袖；“官长”兼顾圣经时代语境和现代读者的可理解性，而不过度限定具体官职。
- source_word: מַשָּׁא
  choice: 利息
  rationale: 在借贷剥削的经济语境中，指加在债务人身上的借贷负担，通常理解为利息；不用“高利贷”，以免加入“利率过高”这一原文未明说的限定。
- source_word: אִישׁ בְּאָחִיו
  choice: 向自己的弟兄
  rationale: 保留“弟兄”的亲族及圣约共同体色彩，表明这是以色列同胞彼此之间的行为；结合复数主语，“自己的”自然表达其分配性。
- source_word: נשאים
  choice: 收取
  rationale: 此处分词表示施加或索取债务负担；与“利息”搭配时，“收取”是自然、准确的现代汉语。
- source_word: וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה
  choice: 我又召集大会来对付他们
  rationale: נתן 字面为“给、置”，但这里与“大会”组成召集公开集会、使众人面对这些人的表达；“来对付他们”保留 עֲלֵיהֶם 的对抗性，同时避免生硬直译。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“竟”体现原句责问和控诉的语气；“贵族和官长”“弟兄”“大会”保留历史社会语境。脚注说明内心斟酌、ריב 的指控语气、מַשָּׁא 的语义范围，以及末句希伯来习语所含的公开对抗意味。
