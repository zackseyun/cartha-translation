- from: 现在，我们与我们的弟兄本是骨肉同胞[a]，我们的儿女与他们的儿女并无两样；可是，我们竟不得不把自己的儿女交出去做奴隶，我们有些女儿已经沦为奴隶。我们却无力制止[b]，因为我们的田地和葡萄园都归了别人。
  to: 现在，我们的血肉和我们弟兄的血肉一样，我们的儿女和他们的儿女一样；可是，看哪，我们正使自己的儿子和女儿沦为奴隶；我们有些女儿已经沦为奴隶。我们也无能为力[b]，因为我们的田地和葡萄园都归了别人。
