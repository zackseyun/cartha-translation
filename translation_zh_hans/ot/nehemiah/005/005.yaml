  text: וְ/עַתָּ֗ה כִּ/בְשַׂ֤ר אַחֵ֨י/נוּ֙ בְּשָׂרֵ֔/נוּ כִּ/בְנֵי/הֶ֖ם בָּנֵ֑י/נוּ וְ/הִנֵּ֣ה אֲנַ֣חְנוּ כֹ֠בְשִׁים אֶת בָּנֵ֨י/נוּ וְ/אֶת בְּנֹתֵ֜י/נוּ לַ/עֲבָדִ֗ים וְ/יֵ֨שׁ מִ/בְּנֹתֵ֤י/נוּ נִכְבָּשׁוֹת֙ וְ/אֵ֣ין לְ/אֵ֣ל יָדֵ֔/נוּ וּ/שְׂדֹתֵ֥י/נוּ וּ/כְרָמֵ֖י/נוּ לַ/אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/005.yaml
  text: And now[a], our flesh is like the flesh of our brothers, our children like their children; yet here we are, forcing our sons and our daughters into slavery, and some of our daughters have already been enslaved. But it is not in our power to help[b], and our fields and our vineyards belong to others.
translation:
  language: zh_hans
  text: 现在，我们的血肉和我们弟兄的血肉一样，我们的儿女和他们的儿女一样；可是，看哪，我们正使自己的儿子和女儿沦为奴隶；我们有些女儿已经沦为奴隶。我们也无能为力[b]，因为我们的田地和葡萄园都归了别人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 直译：“我们的手中没有能力。”这句话表示他们没有力量或手段扭转局面；下文田地和葡萄园已归别人，说明了这种无力的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּבְשַׂר אַחֵינוּ בְּשָׂרֵנוּ
  choice: 我们与我们的弟兄本是骨肉同胞
  rationale: 希伯来文直陈“我们的肉与我们弟兄的肉一样”，以共同的“肉”强调同胞关系和同等的人性。中文“骨肉同胞”保留身体意象，也自然传达共同血肉与族群亲属关系。
- source_word: אַחֵינוּ
  choice: 我们的弟兄
  rationale: 原词直译为“我们的弟兄”；保留阳性亲属称谓，不擅自改成更宽泛的群体标签。
- source_word: כִּבְנֵיהֶם בָּנֵינוּ
  choice: 我们的儿女与他们的儿女并无两样
  rationale: בנים 在此为集合性用法，可指儿女；下文另明确列出儿子和女儿。译作“儿女”符合比较句的整体含义。
- source_word: כֹבְשִׁים אֶת־בָּנֵינוּ וְאֶת־בְּנֹתֵינוּ לַעֲבָדִים
  choice: 我们竟不得不把自己的儿女交出去做奴隶
  rationale: כבשׁ 与“做奴隶”连用，表示使人受制并进入奴役状态。上下文是债务逼迫；“不得不……交出去做奴隶”兼顾说话者受迫的处境和奴役事实。
- source_word: מִבְּנֹתֵינוּ נִכְבָּשׁוֹת
  choice: 我们有些女儿已经沦为奴隶
  rationale: 被动分词描述女儿已经处于被制伏、受奴役的状态；“已经沦为奴隶”清楚表达既成的奴役处境。
- source_word: וְאֵין לְאֵל יָדֵנוּ
  choice: 我们却无力制止
  rationale: 这是表示手中没有能力或手段的习语；此处 אֵל 应按“力量、能力”理解，而非神名。“无力制止”自然承接儿女遭奴役的困境。
- source_word: וּשְׂדֹתֵינוּ וּכְרָמֵינוּ לַאֲחֵרִים
  choice: 因为我们的田地和葡萄园都归了别人
  rationale: 无动词分句表示产业已属他人，并解释他们为何无力改变局面；中文补出“归了”使所有权转移清楚自然。
theological_decisions:
- issue: 社会公义控诉中的亲属语言
  choice: 保留“弟兄”，并在集合性比较中译作“儿女”
  alternative: 全部译为中性的“同胞／亲族”，或全按形式译作“弟兄／儿子”
  rationale: 这样既保存 אַחֵינוּ 的阳性亲属称谓，也体现 בנים 在此处可统指儿女；下文明确提到不同性别时，中文以集合称谓自然涵盖。
- issue: 奴役措辞的强度
  choice: 使用“奴隶／沦为奴隶”
  alternative: 使用较弱的“仆役／服役”
  rationale: 经文所述是债务压力下儿女被迫进入受奴役身份；译作“奴隶”避免淡化其严重性。
- issue: וְאֵין לְאֵל יָדֵנוּ 中 אֵל 的理解
  choice: 理解为“能力、力量”
  alternative: 理解为神的称号
  rationale: 该固定表达及上下文都指当事人没有能力或手段挽回局面，不是在陈述他们的手与神之间的关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“骨肉同胞”保存原文具体的血肉意象；“竟不得不”表达债务困境造成的强迫，但不减弱他们把儿女交作奴隶这一行动。主文中的脚注标记与脚注完全对应。
