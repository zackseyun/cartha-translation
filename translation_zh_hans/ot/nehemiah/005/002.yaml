  text: And there were those who said[a], “We have many sons and daughters. Let us get grain, so that we may eat and live.”
translation:
  language: zh_hans
  text: 有些人说：“我们连同儿女在内，人数很多[a]。让我们取得粮食，以便吃、活下去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文更直译为：“我们的儿子、我们的女儿，我们，人数众多。”这个希伯来语句子把儿女与“我们”并列，强调全家的人口众多。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: 有些人说
  rationale: 这个存在句式在上下文中引出抱怨者中的一类人；译作“有些人说”既自然，也保留了分组陈述的作用。
- source_word: בָּנֵינוּ וּבְנֹתֵינוּ אֲנַחְנוּ רַבִּים
  choice: 我们和我们的儿女人数众多
  rationale: 原文把“我们的儿子、我们的女儿”和明确的“我们”并列压缩在一起。此译保留全家人口众多的重点，也没有把 אֲנַחְנוּ 静默省略。
- source_word: וְנִקְחָה
  choice: 让我们弄些
  rationale: 第一人称复数祈愿式表达共同的意愿或迫切主张；“让我们弄些”在现代汉语中自然，并传达设法取得粮食之意。
- source_word: דָגָן
  choice: 粮食
  rationale: 该词指谷物、粮谷；在这里用“粮食”既符合饥荒语境，又不泛化为所有食物。
- source_word: וְנֹאכְלָה וְנִחְיֶה
  choice: 来吃，好活下去
  rationale: 连续的动词在语境中说明取得粮食的目的；译文分别保留“吃”和“活”两个动作，并以“活下去”体现生存的紧迫性。
