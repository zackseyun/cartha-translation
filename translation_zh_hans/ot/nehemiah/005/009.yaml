base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/009.yaml
  text: So I said[a], “What you are doing is not good. Should you not walk in the fear of our God because of the reproach of the nations, our enemies?”
translation:
  language: zh_hans
  text: 我就说：“你们所做的事不好。鉴于列国，就是我们仇敌的辱骂[a]，你们岂不应当敬畏我们的上帝而行事吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为避免列国，就是我们仇敌的辱骂。”希伯来语介词在这里可理解为行为的原因或动机，也可理解为意在避免的结果。
    reason: 保留 מִן 在本句中的词义和句法歧义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 我就说
  rationale: 叙事中的连续式推进事件；“就”自然表达承接关系，而第一人称由上下文确定。
- source_word: לֹא טוֹב
  choice: 不好
  rationale: 直接保留希伯来语的评价措辞及其道德分量，不强化为“邪恶”或改释为“不妥”。
- source_word: הַדָּבָר אֲשֶׁר אַתֶּם עֹשִׂים
  choice: 你们所做的事
  rationale: 以自然的现代汉语表达原文名词性结构，并保留对当前行为的直接指责。
- source_word: הֲלוֹא
  choice: 岂不应当……吗
  rationale: 表达带劝诫意味的反问，兼顾疑问形式和道德诉求。
- source_word: בְּיִרְאַת אֱלֹהֵינוּ
  choice: 存敬畏我们上帝的心
  rationale: 保留 יִרְאָה 的“敬畏”含义，同时采用现代汉语中自然且庄重的搭配。
- source_word: תֵּלֵכוּ
  choice: 行事
  rationale: הלך 在这里是伦理行为的隐喻；“行事”保留“行”的意象，又比生硬的“行走”更符合现代汉语。
- source_word: מֵחֶרְפַּת
  choice: 鉴于……的辱骂
  rationale: 将介词 מִן 理解为原因或动机，表达因敌对列国的辱骂而应当敬畏上帝行事；另一个合理理解是为了避免这种辱骂，故加注说明。
- source_word: הַגּוֹיִם אֹיְבֵינוּ
  choice: 我们的仇敌列国
  rationale: גּוֹיִם 在此指周边敌对民族；“列国”符合旧约语境，“我们的仇敌”保留原文的同位说明。
theological_decisions:
- issue: הלך 在圣约伦理语境中的行为隐喻
  choice: 译为“行事”，保留“行”的伦理意象
  alternative: 译为“生活”或直译为“行走”
  rationale: “行事”既传达人的生活行为受敬畏上帝所支配，也避免现代读者把“行走”误解为身体动作。
- issue: מִן 在 מֵחֶרְפַּת 中的语义关系
  choice: 按原因或动机译为“鉴于……的辱骂”
  alternative: 按意图或避免结果译为“免得……辱骂”
  rationale: 介词在此可表达因由，也可能指应当避免的结果；正文采用较贴近形式且通顺的因由读法，并以脚注保留另一种理解，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”对应 אֱלֹהִים；反问句保留尼希米劝诫的力度。脚注标记紧接实际存在歧义的短语，而非置于引语动词之后。
