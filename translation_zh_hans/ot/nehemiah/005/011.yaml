source:
  edition: WLC
  text: הָשִׁיבוּ֩ נָ֨א לָ/הֶ֜ם כְּ/הַ/יּ֗וֹם שְׂדֹתֵי/הֶ֛ם כַּרְמֵי/הֶ֥ם זֵיתֵי/הֶ֖ם וּ/בָתֵּי/הֶ֑ם וּ/מְאַ֨ת הַ/כֶּ֤סֶף וְ/הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר אֲשֶׁ֥ר אַתֶּ֖ם נֹשִׁ֥ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/011.yaml
  text: Please restore to them this very day their fields[a], their vineyards, their olive orchards, and their houses, and the hundredth part of the money, the grain, the new wine[b], and the oil that you have been exacting from them.
translation:
  language: zh_hans
  text: 请今天就把他们的田地、葡萄园、橄榄园和房屋归还给他们，也归还你们向他们收取[b]的钱、谷物、新酒和油的百分之一[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “百分之一”可能指所收取的利息或加收部分；原文没有说明按什么周期计算。
    reason: lexical_alternative
  - marker: b
    text: “收取”也可理解为“向他们索债”或“借钱给他们并取利”。
    reason: alternative_reading
lexical_decisions:
- source_word: הָשִׁיבוּ
  choice: 归还
  rationale: 使役意义的复数命令式，指使财产回到原主手中；“归还”既适用于地产和房屋，也适用于所收取的钱粮。
- source_word: נָא
  choice: 请
  rationale: 表达缓和命令语气的恳请成分；现代汉语用“请”自然传达其劝告和敦促的语气。
- source_word: כְּהַיּוֹם
  choice: 今天就
  rationale: 这是强调即时行动的表达；“今天就”兼顾时间意义和紧迫感。
- source_word: שְׂדֹתֵיהֶם כַּרְמֵיהֶם זֵיתֵיהֶם וּבָתֵּיהֶם
  choice: 他们的田地、葡萄园、橄榄园和房屋
  rationale: 按原文列出被占有的各类不动产；“橄榄园”在现代汉语中自然地表达作为产业的橄榄种植地。
- source_word: וּמְאַת
  choice: 百分之一
  rationale: 字面意思为“一百份中的一份”。用“百分之一”清楚保留比例含义，同时不擅自说明其计算周期或具体金融制度。
- source_word: הַכֶּסֶף
  choice: 钱
  rationale: 该词可指银子或货币；在债务和收取财物的语境中，“钱”更符合其经济功能，也更自然易懂。
- source_word: הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: 五谷、新酒和油
  rationale: 分别表达谷物、新酿或新产的酒，以及通常指橄榄油的油；译文保留农产品类别及“新酒”的词义区别。
- source_word: נֹשִׁים בָּהֶם
  choice: 向他们收取
  rationale: 该债权语汇在此可指债主向欠债者索取或征收；“收取”保留压迫性债务实践的语境，又不把含义过窄地限定为某一种利息制度。
theological_decisions:
- issue: “百分之一”与后列钱粮的句法及金融含义
  choice: 译作“钱、五谷、新酒和油的百分之一”，不注明计算周期
  alternative: 译作“钱、五谷、新酒和油的百分之一的利息”，或明确为“每月百分之一”
  rationale: 原文最自然地把“一百份之一”与钱和农产品相连，但没有明说这是按何周期计算，也没有出现明确的“利息”名词。正文保留比例，脚注说明可能的金融含义，避免过度确定。
- issue: נֹשִׁים 的债权含义
  choice: 向他们收取
  alternative: 借给他们取利；向他们索债；向他们收利息
  rationale: 上下文谴责债务压迫，但该分词可广泛描述债权人的索取行为。“收取”保留道德力度及语义范围，不预先裁定所收的是本金、利息还是其他加收部分。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“请今天就”同时表达恳请与立即执行的紧迫性；财产清单保持整齐并列。正文以两个脚注保留金融术语和句法上的真实不确定性。
