base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/016.yaml
  text: And I also applied myself to the work on this wall[a], and we did not buy any field[b], and all my young men were gathered there for the work.
translation:
  language: zh_hans
  text: 我也亲自投入[a]这道墙的工程；我们没有买任何田地。我的年轻随从[b]都聚集在那里参与这项工程。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲自投入”也可译作“亲自参与”或“投身于”。原文动词可有抓住、着手或奋力从事某项工作的意思。
    reason: lexical_alternative
  - marker: b
    text: “年轻随从”也可译作“仆从”或“侍从”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 我也
  rationale: 保留连接上文的递进、补充意味；“也”直接体现 גַּם。
- source_word: בִּמְלֶאכֶת הַחוֹמָה הַזֹּאת
  choice: 修建这道城墙的工程
  rationale: מְלָאכָה 指工作、工程；结合“城墙”的语境，补出“修建”可使现代汉语自然明确，而不额外加入原文没有的“城”。
- source_word: הֶחֱזַקְתִּי
  choice: 亲自投入
  rationale: 此处 חזק 的使役式表示抓紧、投身于某事。“亲自投入”既表达尼希米实际参与，又避免误解为他独自“加固”城墙。
- source_word: וְשָׂדֶה לֹא קָנִינוּ
  choice: 我们没有买过任何田地
  rationale: 保留 קָנִינוּ 的第一人称复数“我们”；单数 שָׂדֶה 在否定句中可自然译作“任何田地”。
- source_word: נְעָרַי
  choice: 我的年轻随从
  rationale: נַעַר 可指年轻人、仆从或侍从；“年轻随从”兼顾其年龄词义与此处属于尼希米手下人员的语境。
- source_word: קְבוּצִים שָׁם עַל הַמְּלָאכָה
  choice: 全都聚集在那里做工
  rationale: 保留被聚集在工作地点的含义；“做工”自然表达 עַל הַמְּלָאכָה 所指的从事工程。
theological_decisions: []
