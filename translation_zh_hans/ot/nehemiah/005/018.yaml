  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲשֶׁר֩ הָיָ֨ה נַעֲשֶׂ֜ה לְ/י֣וֹם אֶחָ֗ד שׁ֣וֹר אֶחָ֞ד צֹ֠אן שֵׁשׁ בְּרֻר֤וֹת וְ/צִפֳּרִים֙ נַֽעֲשׂוּ לִ֔/י וּ/בֵ֨ין עֲשֶׂ֧רֶת יָמִ֛ים בְּ/כָל יַ֖יִן לְ/הַרְבֵּ֑ה וְ/עִם זֶ֗ה לֶ֤חֶם הַ/פֶּחָה֙ לֹ֣א בִקַּ֔שְׁתִּי כִּֽי כָֽבְדָ֥ה הָ/עֲבֹדָ֖ה עַל הָ/עָ֥ם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/018.yaml
  text: What was prepared for each day was one ox and six choice sheep[a]; also birds were prepared for me, and every ten days an abundance of all kinds of wine. Yet even with this, I did not demand the governor’s food allowance[b], because the service was heavy on this people.
translation:
  language: zh_hans
  text: 每天所预备的有一头牛、六只精选的羊[a]；也为我预备飞禽。每十天，还有大量各样的酒。尽管如此，我没有索取省长的膳食供给[b]，因为这百姓所承担的劳役十分沉重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊”也可理解为“羊群中挑选出来的牲畜”。原词可泛指绵羊、山羊等小型牲畜。
    reason: lexical_alternative
  - marker: b
    text: 直译“省长的饼”，也可译作“省长的口粮”或“省长的供给”，指与省长职务相连的膳食供应。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר הָיָה נַעֲשֶׂה לְיוֹם אֶחָד
  choice: 每天所预备的是
  rationale: 被动式 נַעֲשֶׂה 在膳食语境中指“预备”；לְיוֹם אֶחָד 表示每日一次的固定用量。中文不另加原文没有的“现在”。
- source_word: שׁוֹר אֶחָד
  choice: 一头牛
  rationale: שׁוֹר 指牛类牲畜；“一头牛”自然准确，也不把性别过度限定为公牛。
- source_word: צֹאן שֵׁשׁ בְּרֻרוֹת
  choice: 六只上好的羊
  rationale: צֹאן 可泛指小型牲畜，在此供膳并与数词连用，译作“羊”自然；בְּרֻרוֹת 指经过挑选、品质上好的。
- source_word: וְצִפֳּרִים נַעֲשׂוּ לִי
  choice: 也有飞禽为我预备
  rationale: צִפֳּרִים 是广义的鸟类；膳食语境中的“飞禽”比“鸟”更自然，同时不擅自指定具体种类。
- source_word: וּבֵין עֲשֶׂרֶת יָמִים
  choice: 每十天
  rationale: 此表达表示以十天为周期的重复间隔。
- source_word: בְּכָל יַיִן לְהַרְבֵּה
  choice: 大量各样的酒
  rationale: 兼顾 בְּכָל 所表达的种类广泛和 לְהַרְבֵּה 所表达的数量众多。
- source_word: לֶחֶם הַפֶּחָה
  choice: 省长的膳食供给
  rationale: 字面为“省长的饼/食物”，其中 לֶחֶם 可转指膳食或口粮；上下文指随省长职务而有的官方膳食供给。
- source_word: לֹא בִקַּשְׁתִּי
  choice: 我也没有索取
  rationale: בקשׁ 可指寻求、请求或要求；“索取”在这里表达尼希米没有领取本可按职权取得的供给，又避免强化为蛮横的“强求”。
- source_word: כִּי כָבְדָה הָעֲבֹדָה עַל הָעָם הַזֶּה
  choice: 因为这百姓承担的劳役十分沉重
  rationale: עֲבֹדָה 可指工作、劳役或服役，כָבְדָה 强调其沉重；此译法自然呈现负担压在百姓身上的意象。
theological_decisions:
- issue: 尼希米拒绝省长职务供给的社会经济含义
  choice: 表达他因百姓劳役沉重而不索取省长的膳食供给
  alternative: 仅理解为他没有向省长请求食物，或明确断定他免除了一项税赋
  rationale: 上下文支持这是与省长职务相连的膳食权益，且拒绝的原因是百姓负担沉重；译文保留这种伦理关联，但不把“膳食供给”进一步等同于原文未明说的某项具体税种。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“膳食供给”明确官方供应的语境；“劳役十分沉重”保留原文关于重担的力度。所有脚注标记均已置于正文相应位置。
