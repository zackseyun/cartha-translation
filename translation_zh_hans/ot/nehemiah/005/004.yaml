  naturalness: “另有一些人说”自然，直接引语也通顺。将“好为我们的田地和葡萄园缴纳王税”调整为“为支付王税；这税是加在我们的田地和葡萄园上的”可更清楚且合乎现代汉语。
  terminology: “钱”对应此处经济语境中的כֶסֶף恰当，脚注保留“银子”也合适。“王税”简洁准确；“王的贡税”可作为词汇替代，但“贡税”在中文里可能略显语义叠加，保留为或译尚可。
