  text: And there were those who said[b][a], “We have borrowed money for the king’s tax on our fields and our vineyards.”
translation:
  language: zh_hans
  text: 另有一些人说：“我们为支付王税[b]，借了钱[a]；这税是加在我们的田地和葡萄园上的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“银子”，即钱。
    reason: lexical_alternative
  - marker: b
    text: 或译：“王的贡税”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: 另有一些人说
  rationale: 承接前文，引出另一群申诉者；用现代汉语的叙事表达传达希伯来文存在句及分词所表示的陈述情形。
- source_word: לָוִינוּ
  choice: 我们借了
  rationale: 该动词指借入或取得贷款；“借了”简明自然，并保留债务已经形成、后果仍然存在的语境。
- source_word: כֶסֶף
  choice: 钱
  rationale: 原词字面为“银子”，但在此经济语境中指货币；正文采用现代汉语常用的“钱”，脚注保留字面信息。
- source_word: לְמִדַּת הַמֶּלֶךְ
  choice: 缴纳王税
  rationale: 该短语指应向王缴纳的核定款项；“王税”简洁地表达其财政性质，同时脚注注明“贡税”这一可能译法。
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ
  choice: 为我们的田地和葡萄园
  rationale: 句末名词很可能说明课税所依据的地产；“为……缴纳王税”在汉语中自然表达田地和葡萄园所产生或承担的税款。
