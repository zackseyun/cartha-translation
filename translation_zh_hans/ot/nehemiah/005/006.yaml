base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/006.yaml
  text: I became very angry when I heard their outcry and these words[a].
translation:
  language: zh_hans
  text: 我听见他们的呼求和这些话[a]，就非常愤怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这些事”。希伯来语这个词既可指说出的话，也可指所报告的事情。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לִי
  choice: 我……就非常愤怒
  rationale: 希伯来语惯用语表达怒气在说话者里面燃起；“愤怒”自然、庄重，并保留强烈情绪，而不生硬直译为“向我燃烧”。
- source_word: מְאֹד
  choice: 非常
  rationale: 准确表达程度副词的强化作用，符合现代普通话习惯。
- source_word: כַּאֲשֶׁר
  choice: ……就……
  rationale: 此处引出尼希米发怒的时间和缘由；用“听见……就……”自然呈现紧密的时序关系。
- source_word: שָׁמַעְתִּי
  choice: 我听见
  rationale: 直接表达实际听到百姓申诉的意思，不额外引入“听从”等含义。
- source_word: זַעֲקָתָם
  choice: 他们的呼求
  rationale: זעקה指因困苦或不公而发出的呼喊；“呼求”兼具痛苦与求助意味，比一般的“抱怨”更能保留原文力度。
- source_word: וְאֵת הַדְּבָרִים הָאֵלֶּה
  choice: 和这些话
  rationale: דברים既可指所说的话，也可指所报告的事情；正文采用直接、具体的“这些话”，并以脚注保留另一种可能。
