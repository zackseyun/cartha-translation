base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: The Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
translation:
  language: zh_hans
  text: 犹太人[a]和官员，共一百五十人，连同从我们周围各族来到我们这里的人，都在我席上用饭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”或译“犹大人”。
    reason: lexical_alternative
  - marker: b
    text: “在我席上用饭”表示尼希米接待他们，并供应他们的饮食。
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: 犹太人
  rationale: 该词在《尼希米记》中可泛指犹太群体，不必仅限于犹大地区的居民；“犹太人”是现代汉语中最自然的称呼，同时以脚注保留“犹大人”这一带有地域色彩的可能译法。句首的 וְ 不另译为时间副词。
- source_word: וְהַסְּגָנִים
  choice: 官员
  rationale: 该词指较低层级的民政领袖或行政人员；“官员”清楚表达其行政身份，又不把它限定为某一特定的波斯官衔。
- source_word: מֵאָה וַחֲמִשִּׁים אִישׁ
  choice: 共一百五十人
  rationale: 忠实表达人数；汉语以“共”自然地表明“犹太人和官员”合计一百五十人，无须机械译出 אִישׁ 为“男人”。
- source_word: וְהַבָּאִים אֵלֵינוּ
  choice: 连同……来到我们这里的人
  rationale: 分词在此作名词用，指前来的人；“来到我们这里的人”符合叙事语境和现代汉语表达。
- source_word: מִן הַגּוֹיִם
  choice: 从……各族
  rationale: גּוֹיִם 在这里指周围的非犹太民族或族群；“各族”保持宽泛含义，避免“外邦人”可能带来的额外神学色彩。
- source_word: אֲשֶׁר סְבִיבֹתֵינוּ
  choice: 我们周围
  rationale: 简洁保留原文所表达的地理邻近关系。
- source_word: עַל שֻׁלְחָנִי
  choice: 在我席上用饭
  rationale: 原文直译为“在我的桌上”，是指在尼希米所设的席上吃饭并由他供应；“在我席上用饭”既保留席面的意象，也让现代汉语读者自然理解。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“连同……都……”理清原文并列成分，以“在我席上用饭”保留原文席面的形象及款待含义；不添加原文没有的时间性话语标记。
