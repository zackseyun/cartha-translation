language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/פַּחוֹת֩ הָ/רִאשֹׁנִ֨ים אֲשֶׁר לְ/פָנַ֜/י הִכְבִּ֣ידוּ עַל הָ/עָ֗ם וַ/יִּקְח֨וּ מֵ/הֶ֜ם בְּ/לֶ֤חֶם וָ/יַ֨יִן֙ אַחַר֙ כֶּֽסֶף שְׁקָלִ֣ים אַרְבָּעִ֔ים גַּ֥ם נַעֲרֵי/הֶ֖ם שָׁלְט֣וּ עַל הָ/עָ֑ם וַ/אֲנִי֙ לֹא עָשִׂ֣יתִי כֵ֔ן מִ/פְּנֵ֖י יִרְאַ֥ת אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/015.yaml
  text: But the former governors who were before me laid heavy burdens on the people[a], and took from them bread and wine, besides forty shekels of silver. Even their servants ruled over the people. But I did not do so[c][b], because of the fear of God.
translation:
  language: zh_hans
  text: 在我以前的那些省长加重了百姓的负担，向他们索取饼和酒，此外还收取四十舍客勒银子[a]；甚至他们的侍从也辖制百姓[b]。但我因敬畏上帝，没有这样做[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “此外还收取四十舍客勒银子”：希伯来语短语较难理解，也可直译为“在四十舍客勒银子之后”；这里可能是说，四十舍客勒银子是在饼和酒之外另加的征收。
    reason: 保留原文短语的句法与语义歧义，并使说明与正文所采用的附加关系一致。
  - marker: b
    text: “侍从”也可译作“仆人”或“年轻人”，这里可能指省长手下的属员。
    reason: 说明נַעֲרֵיהֶם的词义范围及行政语境。
  - marker: c
    text: “敬畏上帝”也可译作“惧怕上帝”；原文直译为“由于对上帝的敬畏”。
    reason: 保留יִרְאַת אֱלֹהִים所含畏惧与尊崇的语义张力。
lexical_decisions:
- source_word: הַפַּחוֹת הָרִאשֹׁנִים אֲשֶׁר לְפָנַי
  choice: 在我以前的那些省长
  rationale: פֶּחָה在波斯时期指省级行政长官；整句自然表达尼希米以前的历任官员。
- source_word: הִכְבִּידוּ עַל הָעָם
  choice: 加重了百姓的负担
  rationale: 保留כבד使之沉重的比喻，同时在现代汉语中清楚表达苛重征敛。
- source_word: וַיִּקְחוּ מֵהֶם
  choice: 向他们索取
  rationale: לקח本义为拿取；财政语境下译为“索取”既贴合语境，也不过度具体化为正式税收。
- source_word: בְּלֶחֶם וָיַיִן
  choice: 饼和酒
  rationale: 保留原文列出的具体物品，不泛化为食物。
- source_word: אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  choice: 此外还收取四十舍客勒银子
  rationale: 将אַחַר理解为附加关系，即饼和酒之外另有银钱征收；因短语结构存在解释难点，附注说明。
- source_word: נַעֲרֵיהֶם
  choice: 侍从
  rationale: נַעַר可指年轻人、仆人或随从；行政语境中“侍从”较自然，并避免把年龄含义定死。
- source_word: שָׁלְטוּ עַל הָעָם
  choice: 辖制百姓
  rationale: שׁלט表示掌权、支配；“辖制”保留这里带有压迫色彩的权力运用。
- source_word: וַאֲנִי לֹא עָשִׂיתִי כֵן
  choice: 但我……没有这样做
  rationale: 直接保留尼希米与前任省长行为之间的对比。
- source_word: מִפְּנֵי יִרְאַת אֱלֹהִים
  choice: 因敬畏上帝
  rationale: 既传达字面“对上帝的畏惧”，又以现代汉语常用的圣经表达涵盖尊崇与向上帝负责之意。
theological_decisions:
- issue: יִרְאַת אֱלֹהִים的表达
  choice: 因敬畏上帝
  alternative: 因为惧怕上帝／由于对上帝的敬畏
  rationale: “敬畏”保留该词组兼具畏惧、尊崇和道德约束力的神学张力，不将其弱化为一般尊重，也不限定为恐惧。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“省长”符合波斯时期行政背景；“舍客勒”保留古代重量及货币单位。“辖制”比中性的“管理”更能体现上下文对滥权的批评。脚注标记均置于相关正文之后。
