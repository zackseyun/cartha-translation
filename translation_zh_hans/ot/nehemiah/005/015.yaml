revisions:
- from: 但在我以前的那些省长加重了百姓的负担，向他们索取饼和酒，此外还收取四十舍客勒银子。[a]连他们的侍从也辖制百姓。[b]但我因敬畏上帝，没有这样做。[c]
  to: 在我以前的那些省长加重了百姓的负担，向他们索取饼和酒，此外还收取四十舍客勒银子[a]；甚至他们的侍从也辖制百姓[b]。但我因敬畏上帝，没有这样做[c]。
  rationale: 修订仅改善汉语转折结构，并纠正脚注a与正文在“附加征收”方向上的不一致；不改变经文所表达的行为、历史行政称谓、银钱数额或神学用语。
