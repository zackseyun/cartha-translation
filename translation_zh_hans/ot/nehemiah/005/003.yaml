  text: And there were others who said[a], “We are mortgaging our fields, our vineyards, and our houses to get grain during the famine.”
translation:
  language: zh_hans
  text: 另有一些人说：“我们正拿田地、葡萄园和房屋作抵押[a]，以便在饥荒中取得粮食。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把我们的田地、葡萄园和房屋作为债务的担保物。”希伯来语动词指把财产作为债务的担保物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: 另有一些人说
  rationale: 该结构在申诉叙事中引出另一群人；“另有一些人说”自然简洁，并保留递进增列的篇章作用。
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ
  choice: 我们的田地、葡萄园和房屋
  rationale: 分别对应田地、葡萄园和房屋等具体产业；用词准确、通俗，并保留原文列举。
- source_word: אֲנַחְנוּ עֹרְבִים
  choice: 我们正拿……作抵押
  rationale: 这里的 ערב 表示将财产作为债务担保。“拿……作抵押”符合现代汉语经济语境，同时保留设定担保物的核心含义。
- source_word: וְנִקְחָה
  choice: 好……取得
  rationale: 此形式在语境中表达抵押产业的目的；“好……取得”保留目的关系。动词本身是取得、获得，并未明确表示购买。
- source_word: דָגָן
  choice: 粮食
  rationale: דָגָן 指谷物或粮食作物；汉语“粮食”自然准确，比泛称“食物”更具体。
- source_word: בָּרָעָב
  choice: 在饥荒中
  rationale: 介词短语表示取得粮食时所处的饥荒境况；此译法保留原文在时间、处境与原因之间的开放性，不强行解释为单纯因果。
