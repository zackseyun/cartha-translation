revisions:
- from: 此外，从他委任我在犹大地作省长之日起，也就是从亚达薛西王第二十年直到第三十二年，共十二年，我和我的弟兄都没有享用省长的膳食供给[a]。
  to: 此外，从他委任我在犹大地作他们的省长那天起，就是从亚达薛西王第二十年直到第三十二年，共十二年，我和我的弟兄都没有领取省长的粮食供给[a]。
  rationale: 修订仅恢复原文“他们的省长”中的复数人称后缀，并将末句调整为更符合行政供给语境的现代汉语。未明确“他们”的具体所指，也未将“他”擅自改为“王”。
