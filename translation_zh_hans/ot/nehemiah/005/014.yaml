id: NEH.5.14
reference: Nehemiah 5:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּ֞ם מִ/יּ֣וֹם אֲשֶׁר צִוָּ֣ה אֹתִ֗/י לִ/הְי֣וֹת פֶּחָ/ם֮ בְּ/אֶ֣רֶץ יְהוּדָה֒ מִ/שְּׁנַ֣ת עֶשְׂרִ֗ים וְ֠/עַד שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ לְ/אַרְתַּחְשַׁ֣סְתְּא הַ/מֶּ֔לֶךְ שָׁנִ֖ים שְׁתֵּ֣ים עֶשְׂרֵ֑ה אֲנִ֣י וְ/אַחַ֔/י לֶ֥חֶם הַ/פֶּ֖חָה לֹ֥א אָכַֽלְתִּי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/014.yaml
  text: Also[a], from the day that he appointed me to be governor in the land of Judah, from the twentieth year until the thirty-second year of King Artaxerxes—twelve years—I and my brothers did not eat the governor’s food allowance.
translation:
  language: zh_hans
  text: 此外，从他委任我在犹大地作他们的省长那天起，就是从亚达薛西王第二十年直到第三十二年，共十二年，我和我的弟兄都没有领取省长的粮食供给[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “粮食供给”原文直译为“省长的饼”，指省长按惯例取得的食物或供给。
    reason: 说明לֶחֶם的字面意义及其在行政经济语境中的引申义。
lexical_decisions:
- source_word: גַּם
  choice: 此外
  rationale: 承接上文，增补尼希米为自己所作的说明，保留其附加语气。
- source_word: מִיּוֹם אֲשֶׁר
  choice: 从……之日起
  rationale: 自然表达一个持续时期的起点，同时保持原文的时间结构。
- source_word: צִוָּה אֹתִי
  choice: 他委任我
  rationale: צִוָּה通常可指“命令”，但与担任官职的表达连用时，语境所指是正式任命；保留主语“他”，不擅自明确为王。
- source_word: לִהְיוֹת פֶּחָם
  choice: 作省长
  rationale: פֶּחָה是波斯行政体系中的省级长官；现代汉语以“省长”清楚传达其职衔。原文形式可能带复数第三人称后缀，但在此句中译作职务表达更自然，且不强行补出指代对象。
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: 在犹大地
  rationale: 贴近原文的地理表述，避免把“地”直接解释为行政上的“省”。
- source_word: מִשְּׁנַת עֶשְׂרִים וְעַד שְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: 从亚达薛西王第二十年直到第三十二年
  rationale: 按君王在位年纪年的公式译出，保留起止年份。
- source_word: שָׁנִים שְׁתֵּים עֶשְׂרֵה
  choice: 共十二年
  rationale: 将原文对前述时段的概括清楚地表达为补充说明。
- source_word: אֲנִי וְאַחַי
  choice: 我和我的弟兄
  rationale: 保留אַחַי的阳性复数和亲属称谓；虽然语境中也可能包含同伴或随从，但不在正文中消解其本义。
- source_word: לֶחֶם הַפֶּחָה
  choice: 省长的膳食供给
  rationale: לֶחֶם字面为“饼、食物”，此处指省长按惯例取得的食物或供给；“膳食供给”既保留食物意象，也传达行政经济语境。
- source_word: לֹא אָכַלְתִּי
  choice: 都没有享用
  rationale: 原文以“吃”表达取用省长供给；汉语用“享用”与“膳食供给”搭配自然，并保留实际未取用这些供给的含义。
theological_decisions:
- issue: אַחַי是否应扩展解释为同胞或同僚
  choice: 我的弟兄
  alternative: 我的同胞；我的同僚
  rationale: 原词明确是“我的弟兄”。其实际范围可能超过亲生兄弟，但正文保留原文称谓，以免把可能的社会关系解释写入译文。
- issue: לֶחֶם הַפֶּחָה应按字面还是按行政语境翻译
  choice: 省长的膳食供给
  alternative: 省长的饼；省长的口粮；省长的供给
  rationale: 上下文涉及省长从百姓取得的惯常供应。正文采用兼顾食物意象与制度含义的表达，脚注注明字面和可能范围。
- issue: 委任者的身份是否应在译文中明说
  choice: 他委任我
  alternative: 王委任我
  rationale: 原文只用第三人称单数动词而没有在本分句明说主语；尽管上下文很可能指亚达薛西王，正文仍保留原有的指代形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“亚达薛西”沿用常见圣经人名译法；“犹大地”保留地理措辞；以“也就是……共十二年”清楚呈现原文的纪年和总计结构。
