  text: וַ/תְּהִ֨י צַעֲקַ֥ת הָ/עָ֛ם וּ/נְשֵׁי/הֶ֖ם גְּדוֹלָ֑ה אֶל אֲחֵי/הֶ֖ם הַ/יְּהוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/001.yaml
  text: There arose a great outcry from the people and their wives against their Jewish brothers[a].
translation:
  language: zh_hans
  text: 百姓和他们的妻子对他们的犹太弟兄发出了强烈的抗议[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的犹大人弟兄。”希伯来语这个词可指犹太人，也可指犹大地区的人，取决于所强调的是民族身份还是地域身份。
    reason: 保留 הַיְּהוּדִים 在民族与地域意义之间的词义选择。
lexical_decisions:
- source_word: וַתְּהִי
  choice: （以“百姓……大声呼喊”的整句结构表达）
  rationale: 该叙事形式引出新的事态。现代汉语不必另加“现在”或机械译成“于是有了”，改用主谓句自然呈现事态的发生。
- source_word: צַעֲקַת
  choice: 大声呼喊
  rationale: 该名词表示因困苦或不公而发出的呼声、抗议；动词化译法符合现代汉语，并保留声音强烈及公开申诉的意味。
- source_word: הָעָם
  choice: 百姓
  rationale: 泛指群体中的民众；“百姓”简洁自然，也不擅自把他们限定为某一社会阶层。
- source_word: וּנְשֵׁיהֶם
  choice: 和他们的妻子
  rationale: 复数附属形式在此最自然地指“他们的妻子”，并明确保留妇女也参与呼喊这一信息。
- source_word: גְּדוֹלָה
  choice: 大声
  rationale: 该形容词修饰“呼声”，表达程度和声势之大；在汉语动词化句式中用“大声”自然传达其强烈程度。
- source_word: אֶל
  choice: 控诉
  rationale: 介词本义为“向、对着”，在申诉语境中标明抗议的对象；以“控诉”表达其对抗性，比单译“向”更清楚。
- source_word: אֲחֵיהֶם
  choice: 他们的……弟兄
  rationale: 直译“他们的弟兄”，既保留男性复数形式，也体现同族群成员之间本应有的亲属般团结。
- source_word: הַיְּהוּדִים
  choice: 犹太
  rationale: 此处作身份限定语；“犹太弟兄”在现代汉语中简洁地表达同一民族共同体成员，地域性的译法另见脚注。
theological_decisions:
- issue: יְהוּדִים 的民族或地域含义
  choice: 犹太
  alternative: 犹大
  rationale: 该词可侧重民族共同体身份，也可侧重犹大地区身份。本节所述为共同体内部的控诉，正文用“犹太”自然传达同族关系，同时以脚注保留地域性理解，避免消除原词的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大声呼喊，控诉”把希伯来语名词性结构自然转为汉语动作表达；正文保留“弟兄”，不把原文的亲属称谓弱化为一般性的“同胞”。
