  rationale: 修订以“发出了强烈的抗议”自然表达“有……极大的呼声”及其针对同族弟兄的申诉性对抗，同时避免把“极大”仅理解为音量，或把抗议过度限定为正式“控诉”。脚注保留原词在“犹太人/犹大人”之间的历史语义歧义。
