  text: They read from the book[a], from the law of God, clearly, and they gave the sense, so that they understood the reading.
translation:
  language: zh_hans
  text: 他们从书中，即从上帝的律法中，清楚地[a]诵读，并讲明意思，使人明白所读的内容。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “清楚地”也可译作“分明地”。原文这个词可能指清晰诵读、通过讲解使经文清楚，或可能指为听众翻译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: 他们……念
  rationale: קרא以书卷为对象时通常指诵读；“念”自然体现本段公开朗读的场景。
- source_word: בַסֵּפֶר בְּתוֹרַת הָאֱלֹהִים
  choice: 上帝律法书
  rationale: 两个介词短语在此构成同位关系，即“那书，也就是上帝的律法”；合译为“上帝律法书”符合现代汉语，同时保留其具体文本所指。
- source_word: מְפֹרָשׁ
  choice: 清楚地
  rationale: 该词表示使内容清楚、分明，但可能涉及清晰诵读、解释，甚至为听众翻译；正文采用较宽泛的“清楚地”，不排除这些可能。
- source_word: וְשׂוֹם שֶׂכֶל
  choice: 并讲明意思
  rationale: 这个短语直译近于“赋予理解”，在语境中表示使经文的意义易于领会；“讲明意思”既自然，也保留解释性的功能。
- source_word: וַיָּבִינוּ
  choice: 使百姓明白
  rationale: 结合上下文，动词表达读经并讲解所产生的结果。希伯来文未明说主语转换后的对象，但本段语境所指为聚集的百姓，因此在汉语中补出“百姓”以避免误读。
- source_word: בַּמִּקְרָא
  choice: 所念的内容
  rationale: מִקְרָא可指朗读这一行为或所读的内容；“所念的内容”在本句中自然，并保留公开诵读的含义。
