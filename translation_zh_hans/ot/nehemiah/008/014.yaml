source:
  edition: WLC
  text: וַֽ/יִּמְצְא֖וּ כָּת֣וּב בַּ/תּוֹרָ֑ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה אֲשֶׁר֩ יֵשְׁב֨וּ בְנֵֽי יִשְׂרָאֵ֧ל בַּ/סֻּכּ֛וֹת בֶּ/חָ֖ג בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/014.yaml
  text: And they found it written in the Law that Yahweh had commanded through Moses that the sons of Israel should dwell in booths during the feast[a], in the seventh month.
translation:
  language: zh_hans
  text: 他们发现律法上写着，耶和华曾借摩西吩咐以色列人[a]，要在七月的节期中住在棚里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列的众子”，即以色列人。
    reason: 说明希伯来文的字面形式及其集体含义。
lexical_decisions:
- source_word: וַיִּמְצְאוּ כָּתוּב
  choice: 他们发现……写着
  rationale: 保留希伯来文“发现……写着”的结构，同时符合现代汉语叙事表达。
- source_word: בַּתּוֹרָה
  choice: 律法上
  rationale: 此处指成文的摩西律法；汉语以“律法上写着”自然明确。
- source_word: צִוָּה יְהוָה
  choice: 耶和华曾……吩咐
  rationale: 直译圣名 יהוה 为“耶和华”；“曾”表明命令早已颁布，而本节叙述的是后来从律法中发现它。
- source_word: בְּיַד מֹשֶׁה
  choice: 借摩西
  rationale: 希伯来习语“借摩西之手”表示摩西是传达命令的中介；“借摩西”简洁自然。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在此作为全体民族的称谓；“以色列人”准确、自然且不误解为仅限男性。
- source_word: יֵשְׁבוּ בַּסֻּכּוֹת
  choice: 要……住在棚里
  rationale: ישׁב 在节期语境中指居住，סֻכּוֹת 指临时搭成的棚；此译具体而易懂。
- source_word: בֶּחָג בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: 在七月的节期中
  rationale: 保留“节期”与“第七月”的时间关系；“七月”按希伯来历理解，而非现代公历七月。
theological_decisions:
- issue: 神圣名号 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。现代中文圣经传统中“耶和华”辨识度最高，并作为专名呈现，而不以“主”代替。
- issue: בְנֵי יִשְׂרָאֵל 的涵盖范围
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语在这里是民族整体的固定称谓，命令涉及全体节期群体；采用自然的集体称呼，不将适用范围默默缩窄为男性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“棚”保留住棚节临时棚舍的具体意象；句序稍作汉语化处理，以“在七月的节期中”统摄居住命令。
