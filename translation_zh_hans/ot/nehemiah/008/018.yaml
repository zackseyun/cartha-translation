  text: וַ֠/יִּקְרָא בְּ/סֵ֨פֶר תּוֹרַ֤ת הָ/אֱלֹהִים֙ י֣וֹם בְּ/י֔וֹם מִן הַ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן עַ֖ד הַ/יּ֣וֹם הָ/אַחֲר֑וֹן וַ/יַּֽעֲשׂוּ חָג֙ שִׁבְעַ֣ת יָמִ֔ים וּ/בַ/יּ֧וֹם הַ/שְּׁמִינִ֛י עֲצֶ֖רֶת כַּ/מִּשְׁפָּֽט׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/018.yaml
  text: And he read from the Book of the Law of God day by day[a], from the first day to the last day. And they kept the feast seven days, and on the eighth day there was a solemn assembly[c][b], according to the ordinance.
translation:
  language: zh_hans
  text: 他天天诵读上帝律法书[a]，从第一天直到最后一天。他们守节[b]七天；第八天照规定[c]举行庄严集会。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法书”也可译作“律法书卷”；希伯来词可泛指书写的文献，包括卷轴。
    reason: lexical_alternative
  - marker: b
    text: “守节”也可译作“庆祝这节期”。
    reason: lexical_alternative
  - marker: c
    text: “照规定”也可译作“按照条例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 他诵读
  rationale: קרא与书卷连用时指从文字中读出，语境也表明是公开宣读；保留希伯来文第三人称单数，与后文群体性的“他们”区分。
- source_word: בְּסֵפֶר תּוֹרַת הָאֱלֹהִים
  choice: 上帝律法书
  rationale: 按汉语习惯将介词关系融入“诵读……书”；סֵפֶר可泛指书写文献，也可能具体为书卷，正文不强行限定载体形式。
- source_word: יוֹם בְּיוֹם
  choice: 天天
  rationale: 自然表达逐日反复进行的动作，准确传达希伯来语叠用结构的持续性。
- source_word: מִן הַיּוֹם הָרִאשׁוֹן עַד הַיּוֹם הָאַחֲרוֹן
  choice: 从第一天直到最后一天
  rationale: 直接保留起止范围及原文首尾呼应的表达。
- source_word: וַיַּעֲשׂוּ חָג
  choice: 他们守节
  rationale: עשה与חג连用表示遵守或庆祝节期；“守节”简洁地保留按礼仪度节的含义。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接对应原文数目和时段。
- source_word: עֲצֶרֶת
  choice: 庄严集会
  rationale: 该词指节期末按规定举行的特别宗教集会；“庄严集会”既保留礼仪分量，也比单说“集会”明确。
- source_word: כַּמִּשְׁפָּט
  choice: 照规定
  rationale: 此处מִשְׁפָּט指规范节期礼仪的既定要求；“照规定”自然表达其规范和法律意味，而非一般习俗。
theological_decisions:
- issue: 诵读者为单数，而守节者为复数
  choice: 保留“他诵读”与“他们守节”
  alternative: 将前句泛化为“他们诵读”或“有人诵读”
  rationale: 希伯来文刻意使用单数动词指诵读者，并以复数动词指群体；保留区别可避免抹平叙事角色。
- issue: עֲצֶרֶת的礼仪性质
  choice: 译作“庄严集会”
  alternative: “集会”或“闭幕集会”
  rationale: 正文保留其神圣、规定性的集会性质，但不把“结束、闭幕”这一可能的语义解释写死，也不引入后来的宗派含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“诵读”体现公开读出经文，“守节”和“庄严集会”保留礼仪语境，但避免古奥句式。所有脚注紧接相关词语标示。
