base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/001.yaml
  text: And all the people gathered as one man at the square that was before the Water Gate[a], and they told Ezra the scribe to bring the Book of the Law of Moses, which Yahweh had commanded Israel.
translation:
  language: zh_hans
  text: 众民都如同一人[a]聚集在水门前的广场上。他们请文士以斯拉把雅威所吩咐以色列人的摩西律法书带来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“如同一个人”，是表示众人一致行动、同心聚集的习语。
    reason: 说明希伯来语习语的含义，同时保留正文的原文意象。
lexical_decisions:
- source_word: וַיֵּאָסְפוּ כָל־הָעָם
  choice: 众民都……聚集
  rationale: 准确表达全体民众共同聚集的行动；“众民”庄重而易懂。
- source_word: כְּאִישׁ אֶחָד
  choice: 如同一人
  rationale: 保留希伯来语“一人”的具体意象，同时在现代汉语中自然表达同心一致。
- source_word: הָרְחוֹב
  choice: 广场
  rationale: 这里指城中的开阔公共空间，不是现代意义上的街道。
- source_word: לִפְנֵי שַׁעַר הַמָּיִם
  choice: 在水门前
  rationale: 自然、直接地表达该地点位于水门前方。
- source_word: וַיֹּאמְרוּ לְעֶזְרָא הַסֹּפֵר לְהָבִיא
  choice: 他们对文士以斯拉说，要他把……带来
  rationale: 既保留“说”的基本词义，也清楚呈现不定式所表达的要求。
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  choice: 摩西律法书
  rationale: סֵפֶר可指书卷或书；此处采用汉语圣经语境中清楚而不过度限定载体形式的“书”。
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־יִשְׂרָאֵל
  choice: 就是雅威吩咐以色列人的律法
  rationale: 关系从句在希伯来语中修饰“摩西律法书”，而语义核心是其中的律法；此译法使汉语关系清楚，同时保留“吩咐以色列人”的对象关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见现代汉语音译处理，保留其专名性质，不以称号替代。
theological_decisions:
- issue: כְּאִישׁ אֶחָד的统一行动意象
  choice: 如同一人
  alternative: 同心一致
  rationale: 正文保留原文具体而有力的“一人”意象，注释说明其习语意义，不把它提前抽象化。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；“雅威”较直接反映YHWH的学界通行拟音，也避免用称号“主”取代专名。
- issue: אֲשֶׁר从句的指向
  choice: 明确为“雅威吩咐以色列人的律法”
  alternative: 雅威吩咐以色列人的书
  rationale: 希伯来语语法上关系从句承接整个“摩西律法书”短语，但“吩咐”的实际内容是律法；译文以复指方式澄清汉语表达，不主张超出原文的作者论或律法范围。
translation_notes:
  register: 采用现代、庄重且便于朗读的普通话书面语。“文士”保留以斯拉的传统职衔；句式避免古奥，同时维持叙事的正式感。
