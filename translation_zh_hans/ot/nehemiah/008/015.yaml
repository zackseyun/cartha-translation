  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר יַשְׁמִ֗יעוּ וְ/יַעֲבִ֨ירוּ ק֥וֹל בְּ/כָל עָרֵי/הֶם֮ וּ/בִ/ירוּשָׁלִַ֣ם לֵ/אמֹר֒ צְא֣וּ הָ/הָ֗ר וְ/הָבִ֨יאוּ֙ עֲלֵי זַ֨יִת֙ וַ/עֲלֵי עֵ֣ץ שֶׁ֔מֶן וַ/עֲלֵ֤י הֲדַס֙ וַ/עֲלֵ֣י תְמָרִ֔ים וַ/עֲלֵ֖י עֵ֣ץ עָבֹ֑ת לַ/עֲשֹׂ֥ת סֻכֹּ֖ת כַּ/כָּתֽוּב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/015.yaml
  text: and that they should proclaim and spread the message through all their cities and in Jerusalem[a], saying, “Go out to the hill country and bring branches of olive, oil tree, myrtle, palm, and other leafy trees, to make booths[b], as it is written.”
translation:
  language: zh_hans
  text: 又记载着，要在他们各城和耶路撒冷宣告，并把消息传遍，说：“你们要到山地去，取来橄榄树的枝叶、油树[a]的枝叶、香桃木的枝叶、棕榈树的枝叶，以及枝叶茂密之树的枝叶，用来搭棚[b]，正如经上所写的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “油树”所指的具体树种不能确定；也可译作“产油树”或“野橄榄树”。
    reason: 保留 עֵץ שֶׁמֶן 的植物辨识不确定性，避免正文把有争议的树种固定下来。
  - marker: b
    text: 原文逐项说“橄榄树的叶子……香桃木的叶子……”。这里译作“枝叶”，因为这些材料是取来搭棚的。
    reason: 说明正文为符合汉语和搭棚语境而采用“枝叶”，同时交代希伯来语的字面表达。
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: 又记着，要
  rationale: 承接第14节“发现律法上写着”的内容；用“又记着”自然表达希伯来语连接词与关系词所引出的另一项记载。
- source_word: יַשְׁמִיעוּ וְיַעֲבִירוּ קוֹל
  choice: 宣告并传话
  rationale: 前者表示使人听见、公开宣布，后者是使声音或宣告传遍各处的习语；译文保留两个相近而不完全相同的动作。
- source_word: בְּכָל עָרֵיהֶם וּבִירוּשָׁלַם
  choice: 在他们各城和耶路撒冷
  rationale: 按原文保留“他们各城”以及单独列出的耶路撒冷。
- source_word: צְאוּ הָהָר
  choice: 到山地去
  rationale: הָהָר 可指山或山区；此处是前往高地采集树木枝叶，“山地”符合地理语境。
- source_word: עֲלֵי
  choice: 枝叶
  rationale: 字面义为“叶子”，但所取材料用于搭棚，语境涉及带叶枝条；“枝叶”兼顾原文字面和实际用途。
- source_word: עֵץ שֶׁמֶן
  choice: 油木
  rationale: 原文直译为“油树/油木”，具体树种不能确定；正文采用较形式对应且不武断指定树种的名称，并以脚注说明。
- source_word: הֲדַס
  choice: 番石榴树
  rationale: 此处指 myrtle（Myrtus communis），现代中文常称“香桃木”或“番石榴树”；选用较易理解的传统圣经植物名称。
- source_word: תְמָרִים
  choice: 棕榈树
  rationale: 该词指海枣椰树一类的棕榈；在枝叶清单中译为通行而易懂的“棕榈树”。
- source_word: עֵץ עָבֹת
  choice: 枝叶茂密之树
  rationale: עָבֹת 表示浓密、茂密；译文不把它误作某个确定树种。
- source_word: לַעֲשֹׂת סֻכֹּת
  choice: 用来搭棚
  rationale: סֻכּוֹת 是节期所搭的临时棚子；“搭棚”自然简洁，并与上下文住棚节相连。
- source_word: כַכָּתוּב
  choice: 正如经上所写的
  rationale: 表达“按照所写的”，在律法记载的语境中，“经上”清楚指向书面律法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“宣告并传话”保留原文并列动作；植物名称尽量通俗，但对无法确定的 עֵץ שֶׁמֶן 用脚注保留歧义。所有脚注标记均置于相关正文词语之后。
