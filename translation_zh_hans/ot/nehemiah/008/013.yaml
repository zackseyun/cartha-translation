  text: וּ/בַ/יּ֣וֹם הַ/שֵּׁנִ֡י נֶאֶסְפוּ֩ רָאשֵׁ֨י הָ/אָב֜וֹת לְ/כָל הָ/עָ֗ם הַ/כֹּֽהֲנִים֙ וְ/הַ/לְוִיִּ֔ם אֶל עֶזְרָ֖א הַ/סֹּפֵ֑ר וּ/לְ/הַשְׂכִּ֖יל אֶל דִּבְרֵ֥י הַ/תּוֹרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/013.yaml
  text: And on the second day[a], the heads of the fathers’ houses of all the people, the priests, and the Levites gathered to Ezra the scribe to gain insight into the words of the law.
translation:
  language: zh_hans
  text: 第二天，全体民众中各父家的首领[a]、祭司和利未人聚集到文士以斯拉那里，为要明白律法的话语。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父家”指以共同祖先相连的大家族或宗族；也可译作“各宗族的首领”。
    reason: 解释希伯来语社会结构用语，并提供较通俗的译法。
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: 第二天
  rationale: 以自然的汉语表达叙事中的时间推进；希伯来语连接词וּ在此无须机械译出，句际承接仍然清楚。
- source_word: נֶאֶסְפוּ
  choice: 聚集
  rationale: 此处Niphal复数形式具有不及物的集合义，“聚集”准确、简洁，也符合现代汉语叙事表达。
- source_word: רָאשֵׁי הָאָבוֹת לְכָל הָעָם
  choice: 众民各父家的首领
  rationale: 保留“父家”这一以父系家族或宗族为单位的社会结构，同时用“各”自然表达这些首领来自全体民众。
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: 祭司和利未人
  rationale: 按希伯来语列举结构，将这两个群体与父家首领并列。
- source_word: אֶל עֶזְרָא הַסֹּפֵר
  choice: 到文士以斯拉那里
  rationale: אֶל表示朝向或来到某人那里；“文士”是סֹפֵר在此律法语境中的传统且恰当译法。
- source_word: וּלְהַשְׂכִּיל
  choice: 要深入领会
  rationale: 该Hiphil不定式表达目的，含有获得洞见、明智理解之意；“深入领会”比单纯“明白”更能体现其语义力度。
- source_word: אֶל דִּבְרֵי הַתּוֹרָה
  choice: 律法的话语
  rationale: דִּבְרֵי既可指具体言辞，也可指内容事项；“话语”在此保留对律法具体内容与措辞的关注，而“律法”符合本段的盟约教导语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“父家”保留古代以色列的家族组织概念，并以脚注解释；“深入领会”体现众首领、祭司和利未人聚集的目的，不把含义窄化为仅仅阅读或查考。
