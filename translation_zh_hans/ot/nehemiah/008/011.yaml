id: NEH.8.11
reference: Nehemiah 8:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם מַחְשִׁ֤ים לְ/כָל הָ/עָם֙ לֵ/אמֹ֣ר הַ֔סּוּ כִּ֥י הַ/יּ֖וֹם קָדֹ֑שׁ וְ/אַל תֵּעָצֵֽבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/011.yaml
  text: And the Levites were quieting all the people[a], saying, “Be still, for the day is holy[b]; do not be grieved.”
translation:
  language: zh_hans
  text: 利未人使全体百姓安静[a]，说：“肃静！因为今天是圣日；不要忧伤[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让全体百姓静下来”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不要悲痛”或“不要难过”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: 利未人
  rationale: 采用现代中文中对这一群体的通行称呼，准确指向承担敬拜相关职责的利未群体。
- source_word: מַחְשִׁים
  choice: 使……安静
  rationale: 该分词描写利未人当时持续让百姓静下来的行动；“使……安静”既保留使役含义，也能自然衔接后面的直接命令。
- source_word: לְכָל הָעָם
  choice: 全体百姓
  rationale: 这里指聚集在场的全体民众；“全体百姓”自然表达 כָל 的整体范围。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然引出后面的直接引语。
- source_word: הַסּוּ
  choice: 肃静
  rationale: 这是要求停止出声、保持安静的复数命令；“肃静”简洁有力，也符合庄重场合。
- source_word: כִּי הַיּוֹם קָדֹשׁ
  choice: 因为今天是圣日
  rationale: כִּי 引出命令的理由；“圣日”自然表达这一天分别为圣的性质，同时保留 קָדֹשׁ 的神学分量。
- source_word: וְאַל תֵּעָצֵבוּ
  choice: 不要忧伤
  rationale: עצב 的此处形式表示处于悲痛、忧愁之中；“不要忧伤”保留情感层面的广度，不将其限定为礼仪性的哀悼。
theological_decisions:
- issue: 敬拜场景中 קָדֹשׁ 的表达
  choice: 圣日
  alternative: 神圣的日子
  rationale: “圣日”简明地表达这一天被分别为圣的性质，比泛化的“神圣的日子”更能保留盟约与敬拜语境中的神学分量。
- issue: 百姓情绪的描述是否限定为礼仪性哀悼
  choice: 不要忧伤
  alternative: 不要哀悼
  rationale: 原词可以指悲痛或忧愁，语境虽涉及百姓哭泣，却未必专指正式哀悼仪式，因此采用范围较宽的“忧伤”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“肃静”保留直接命令的力度；整句避免过度古雅，也不把百姓的忧伤解释为特定礼仪行为。
