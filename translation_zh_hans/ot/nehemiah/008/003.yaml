  text: וַ/יִּקְרָא ב/וֹ֩ לִ/פְנֵ֨י הָ/רְח֜וֹב אֲשֶׁ֣ר לִ/פְנֵ֣י שַֽׁעַר הַ/מַּ֗יִם מִן הָ/אוֹר֙ עַד מַחֲצִ֣ית הַ/יּ֔וֹם נֶ֛גֶד הָ/אֲנָשִׁ֥ים וְ/הַ/נָּשִׁ֖ים וְ/הַ/מְּבִינִ֑ים וְ/אָזְנֵ֥י כָל הָ/עָ֖ם אֶל סֵ֥פֶר הַ/תּוֹרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/003.yaml
  text: And he read from it before the square that was in front of the Water Gate[a], from daybreak until midday, in the presence of the men and the women and those who could understand[c][b]; and the ears of all the people were attentive to the Book of the Law.
translation:
  language: zh_hans
  text: 他在水门前的广场上，向男人、女人和所有能理解的人，从天一亮直到中午宣读律法书的内容；全体百姓都侧耳聆听律法书。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא בּוֹ
  choice: 宣读那书
  rationale: 上下文是向会众公开诵读成文律法；“宣读”兼顾 קרא 的公开性，中文也自然。“那书”承接上一节所提摩西律法书。
- source_word: לִפְנֵי הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמַּיִם
  choice: 在水门前的广场上，向众人
  rationale: 希伯来语连续使用 לִפְנֵי，字面结构若直译会造成中文位置关系不清。按句法理解，宣读发生在水门前的广场，并面对会众；中文重组以清楚表达场景。
- source_word: מִן הָאוֹר
  choice: 从天一亮
  rationale: 字面为“从光（出现）时”，在时间语境中指破晓、天亮；“从天一亮”自然且保留起始时刻。
- source_word: עַד מַחֲצִית הַיּוֹם
  choice: 直到中午
  rationale: 字面为“直到白日的一半”，惯用意义是正午；“中午”是现代汉语最清楚自然的表达。
- source_word: נֶגֶד הָאֲנָשִׁים וְהַנָּשִׁים וְהַמְּבִינִים
  choice: 男人、女人和一切能听懂的人都在场
  rationale: נֶגֶד 表示在这些听众面前；הַמְּבִינִים 是“能理解的人”。“都在场”自然表达公开宣读面对这些群体，不把第三组的范围过度限定为儿童。
- source_word: וְאָזְנֵי כָל הָעָם אֶל
  choice: 全体百姓都侧耳听
  rationale: 原文具体地说众人的耳朵朝向律法书。“侧耳听”保留身体意象和专注聆听的含义，又符合现代中文。
- source_word: סֵפֶר הַתּוֹרָה
  choice: 律法书
  rationale: סֵפֶר 可指书卷或文书，תּוֹרָה 在此指公开宣读的权威成文律法。“律法书”既符合上下文，也不必武断限定载体形态。
theological_decisions:
- issue: תּוֹרָה 在公开宣读盟约文本的语境中如何表达
  choice: 律法
  alternative: 教导；妥拉
  rationale: 该词本可广指教导，但尼希米记第8章明确指成文并具有权威的摩西律法。“律法”在现代中文中清楚传达此语境，同时不引入特定宗派解释。
- issue: הַמְּבִינִים 所指群体的范围
  choice: 一切能听懂的人
  alternative: 有悟性的人；所有懂事的人
  rationale: 分词表达理解能力，可能包括年龄足以听懂的孩子，但原文没有明说年龄。“能听懂的人”保留范围上的开放性，避免把他们明确等同于儿童或某种属灵阶层。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“宣读”“侧耳听”保留公共诵读和专注聆听的画面；句序适度调整，以免重复“在……前”造成歧义。未设置脚注，因为“天一亮”“能听懂的人”“律法书”已能在正文中准确自然地传达原文，且无需用脚注解决实质歧义。
