id: NEH.8.10
reference: Nehemiah 8:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֡ם לְכוּ֩ אִכְל֨וּ מַשְׁמַנִּ֜ים וּ/שְׁת֣וּ מַֽמְתַקִּ֗ים וְ/שִׁלְח֤וּ מָנוֹת֙ לְ/אֵ֣ין נָכ֣וֹן ל֔/וֹ כִּֽי קָד֥וֹשׁ הַ/יּ֖וֹם לַ/אֲדֹנֵ֑י/נוּ וְ/אַל תֵּ֣עָצֵ֔בוּ כִּֽי חֶדְוַ֥ת יְהוָ֖ה הִ֥יא מָֽעֻזְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/010.yaml
  text: Then he said to them[a], “Go, eat rich food and drink sweet drinks, and send portions to anyone for whom nothing is prepared, for this day is holy to our Lord. And do not be grieved[c][b], for the joy of Yahweh is your stronghold.”
translation:
  language: zh_hans
  text: 他对他们说：“你们去吃肥美的食物，喝甘甜的饮品，也要把食物分送给没有预备的人[a]；因为今天是我们主的圣日。不要忧愁，因为雅威[c]的喜乐[b]是你们的堡垒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“把食物分送给那没有预备的人。”
    reason: 原文使用单数形式表达泛指；正文用自然汉语译为泛指的“人”。
  - marker: b
    text: “雅威的喜乐”也可理解为“以雅威为乐”。
    reason: 希伯来语属格关系存在解释空间，正文保留其形式，脚注列出主要替代读法。
  - marker: c
    text: “雅威”对应希伯来文神名יהוה（YHWH）。
    reason: 说明正文所用神名音译的原文依据，并与称号“主”相区别。
lexical_decisions:
- source_word: מַשְׁמַנִּים
  choice: 肥美的食物
  rationale: 本义指肥腻、丰盛之物；在节庆语境中指丰盛可口的食物。“肥美的食物”既保留原文意象，也符合现代汉语表达。
- source_word: מַמְתַקִּים
  choice: 甘甜的饮品
  rationale: 该词泛指甜美之物；受动词“喝”限定，此处译为“甘甜的饮品”，不将其过度限定为甜酒。
- source_word: מָנוֹת
  choice: 食物分送
  rationale: 在宴席语境中指分给别人的份额，通常是食物；译文以动词化表达自然传达分送食物份额之意。
- source_word: לְאֵין נָכוֹן לוֹ
  choice: 给没有预备的人
  rationale: נָכוֹן在此指已经预备妥当的节庆用品或食物；译文保留“没有预备”的开放表达，不擅自解释其贫困程度或原因。
- source_word: קָדוֹשׁ
  choice: 圣
  rationale: 该词表示分别为圣、归于上帝；“圣日”简洁、庄重，并保留其宗教分量。
- source_word: לַאֲדֹנֵינוּ
  choice: 我们主的
  rationale: אֲדֹנֵינוּ是对上帝的尊称，直译为“我们的主”；汉语所有关系中采用“我们主的圣日”自然凝练。
- source_word: תֵּעָצֵבוּ
  choice: 忧愁
  rationale: 该动词表示悲伤、痛苦；结合百姓因听见律法而哭泣的上下文，“不要忧愁”准确且自然。
- source_word: חֶדְוַת יְהוָה
  choice: 雅威的喜乐
  rationale: 保留希伯来语属格结构，使其可指来自雅威、属于雅威或与雅威有关的喜乐，不在正文中限定为“以雅威为乐”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，区别于称号“主”。
- source_word: מָעֻזְּכֶם
  choice: 你们的堡垒
  rationale: 该词可指坚固之处、保障或力量来源；“堡垒”保留原文具体的防护意象，避免弱化为抽象的“力量”。
theological_decisions:
- issue: חֶדְוַת יְהוָה中属格关系的理解
  choice: 雅威的喜乐
  alternative: 以雅威为乐
  rationale: 原文属格具有真实的解释空间；正文保留形式上的含混，脚注列出常见的关系性理解，而不把解释写进正文。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 正文采用音译以呈现专名，并借脚注说明其对应希伯来文四字神名；不把专名与本节的称号“我们的主”混为一谈。
- issue: מָעוֹז的隐喻力度
  choice: 堡垒
  alternative: 力量；保障；避难所
  rationale: 原词兼具坚固处与力量来源的含义；正文保留具体防御隐喻，避免在神学上预先限定喜乐如何成为力量。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。宴席用语保持喜庆感；“圣日”“雅威的喜乐”“堡垒”等核心表达尽量保留原文的宗教分量、属格含混与具体隐喻。
