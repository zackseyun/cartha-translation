  terminology: “祭司以斯拉”“会众”“律法”均适合本段正式叙事语体。“律法”忠实对应תּוֹרָה，不额外具体化为“律法书”。“听懂”自然保留לִשְׁמֹעַ所涉及的听闻与理解。
