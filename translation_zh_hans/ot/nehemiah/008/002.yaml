base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/002.yaml
  text: Then Ezra the priest brought the law before the assembly[a], both men and women, and all who could understand what they heard[b], on the first day of the seventh month.
translation:
  language: zh_hans
  text: 祭司以斯拉在第七月初一把律法带到会众面前；会众中无论男女，凡能听懂的人都在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “能听懂的人”也可译作“能借着聆听而明白的人”或“有能力听懂的人”，指能够理解所听内容的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיא
  choice: 把……带到
  rationale: 该动词在叙事中表示以斯拉将律法带到会众面前；中文以“把”字句自然表达其动作和宾语。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 保留原文中以斯拉的明确身份称谓。
- source_word: הַתּוֹרָה
  choice: 律法书
  rationale: 本段语境是公开宣读摩西律法；“律法书”既体现תּוֹרָה的约书性质，也比单说“律法”更清楚地表达被带来并宣读的文本。
- source_word: לִפְנֵי הַקָּהָל
  choice: 到会众面前
  rationale: 准确表达公开呈于聚集群体面前的场景；“会众”在此指集会的人群，不特指后世教会。
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: 包括男人、女人
  rationale: 原文直译为“从男人到女人”，是表示范围周全的结构；中文用“包括男人、女人”自然保留明确的性别范围。
- source_word: וְכֹל מֵבִין לִשְׁמֹעַ
  choice: 以及所有能听明白的人
  rationale: 保留“听”与“理解”之间的联系，表示有能力理解所听内容的人，而不只是听觉正常者。
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: 在第七月初一
  rationale: 这是希伯来日期公式在现代中文中的自然表达。
theological_decisions:
- issue: תּוֹרָה的译法
  choice: 律法书
  alternative: 律法；妥拉；训诲
  rationale: 上下文所指是带到会众前并公开宣读的摩西律法文本。“律法书”清楚、自然，并保留其圣约和规范性分量，不额外加入宗派解释。
- issue: 听众范围的性别表述
  choice: 包括男人、女人
  alternative: 从男人到女人
  rationale: 原文以单数的“男人”和“女人”界定会众的完整范围。正文保留两类明确称谓，同时采用自然现代中文；不将其泛化为无性别表述。
- issue: מֵבִין לִשְׁמֹעַ所描述的能力
  choice: 能听明白
  alternative: 能听懂；有理解力可以听
  rationale: 该结构可理解为借着聆听而明白，或有能力听懂。译文保留听与理解的结合，不把年龄或身份等原文未明说的条件加入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为使日期修饰关系清楚，将“第七月初一”前置；分号用于区分带来律法书的主干动作与会众范围的说明。
