  text: וַ/יַּֽעֲשׂ֣וּ כָֽל הַ֠/קָּהָל הַ/שָּׁבִ֨ים מִן הַ/שְּׁבִ֥י סֻכּוֹת֮ וַ/יֵּשְׁב֣וּ בַ/סֻּכּוֹת֒ כִּ֣י לֹֽא עָשׂ֡וּ מִ/ימֵי֩ יֵשׁ֨וּעַ בִּן נ֥וּן כֵּן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/ה֑וּא וַ/תְּהִ֥י שִׂמְחָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/017.yaml
  text: And all the assembly of those who had returned from the captivity made booths and lived in the booths[a], for the sons of Israel had not done so from the days of Jeshua son of Nun until that day. And there was very great rejoicing.
translation:
  language: zh_hans
  text: 从被掳中归回的全体会众都搭了棚，住在棚里；因为从嫩的儿子耶书亚[a]的日子起，直到那一天，以色列子孙都没有这样做过。于是有极大的欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶书亚”就是嫩的儿子约书亚。
    reason: 说明本节较短名字形式所指的人物，保留原文形式差异并帮助读者识别。
lexical_decisions:
- source_word: הַקָּהָל
  choice: 全体会众
  rationale: 表达聚集成群体的整体百姓；“会众”保留共同体色彩，“全体”对应 כָל。
- source_word: הַשָּׁבִים מִן הַשְּׁבִי
  choice: 从被掳之地归回的
  rationale: 保留“归回”与“被掳”两层含义，并用“之地”使现代汉语表达自然，指明他们从被掳处境中归来。
- source_word: סֻכּוֹת
  choice: 棚
  rationale: 指节期所搭的临时棚屋；“棚”简洁清楚，也避免“帐幕”可能引起的圣所联想。
- source_word: וַיֵּשְׁבוּ בַסֻּכּוֹת
  choice: 住在棚里
  rationale: 此处 יָשַׁב 指在节期的棚中居住，而非单纯坐下。
- source_word: כִּי לֹא עָשׂוּ ... כֵּן
  choice: 因为……都没有这样做过
  rationale: 保留原文简约的回指表达；“这样”指前述搭棚并住在棚里的做法，不将其扩展为从未守过该节期。
- source_word: מִימֵי יֵשׁוּעַ בִּן נוּן
  choice: 从嫩的儿子耶书亚的日子
  rationale: 正文按本节所见 יֵשׁוּעַ 音译为“耶书亚”，并以注释说明其通常熟知的名字“约书亚”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留希伯来语“以色列的众子”这一阳性、盟约群体称谓，同时略去汉语中不必要的结构助词，使表达较为凝练。
- source_word: וַתְּהִי שִׂמְחָה גְּדוֹלָה מְאֹד
  choice: 众人就极其欢喜
  rationale: 以自然现代汉语表达群体中出现极大欢喜的意思；“极其”对应 מְאֹד 对“大”的加强。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列众子
  alternative: 以色列人
  rationale: 原文采用语法上为阳性的“以色列的众子”，也是传统的盟约民族称谓；正文保留该形式，不将其无标记地中性化。
- issue: יֵשׁוּעַ בִּן נוּן 的身份与名字形式
  choice: 嫩的儿子耶书亚
  alternative: 嫩的儿子约书亚
  rationale: 本节实际使用较短形式 יֵשׁוּעַ，正文据此音译；同时用脚注指出他就是通常称为“约书亚”的人物，既尊重本节字形，也避免读者误认为是另一人。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“搭了棚，住在棚里”保留原文动作的重复与节期实践；分号呈现因果关系。脚注标记紧随“耶书亚”，与注释内容准确对应。
