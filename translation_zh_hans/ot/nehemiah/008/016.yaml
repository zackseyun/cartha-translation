base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/016.yaml
  text: So the people went out and brought them[a], and made booths for themselves, each on his roof, and in their courtyards, and in the courtyards of the house of God, and in the square of the Water Gate[b], and in the square of the Gate of Ephraim.
translation:
  language: zh_hans
  text: 于是，百姓出去，把它们带来[a]；各人在自己的屋顶上、自己的院子里、神殿的院子里、水门的广场[c]上和以法莲门的广场上，为自己搭起棚子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“它们”所指何物；所带来的东西承接上一节所列的树枝和叶子。
    reason: implicit_object
  - marker: b
    text: “棚子”也可译作“临时遮棚”；这里保留“棚”字，以显明它与住棚节的联系。
    reason: lexical_alternative
  - marker: c
    text: “广场”原文指城门附近开阔的公共场地，传统上也译作“宽阔处”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ הָעָם
  choice: 百姓出去
  rationale: 按叙事顺序直译“百姓出去”；“百姓”自然表达这里作为整体的民众。
- source_word: וַיָּבִיאוּ
  choice: 把枝叶带回来
  rationale: 希伯来文没有明说宾语，所带之物承接上一节提到的树枝和叶子；译文补出“枝叶”以便独立阅读，并用脚注说明。
- source_word: וַיַּעֲשׂוּ לָהֶם סֻכּוֹת
  choice: 为自己搭起棚子
  rationale: “为自己”对应 לָהֶם；“搭起棚子”符合现代汉语，也保留 סֻכּוֹת 与住棚节名称之间的词语联系。
- source_word: אִישׁ עַל גַּגּוֹ
  choice: 有的搭在自家屋顶上
  rationale: אִישׁ 在此有逐一、分配的意味；结合后续多个地点，用“有的……有的……”自然表达各家分别搭棚，而不暗示每个人在所有地点都搭棚。
- source_word: וּבְחַצְרֹתֵיהֶם
  choice: 有的搭在自家院子里
  rationale: חָצֵר 指围合的院落；“自家院子”清楚传达复数所有格所指的私人院落。
- source_word: וּבְחַצְרוֹת בֵּית הָאֱלֹהִים
  choice: 神殿的院子里
  rationale: בֵּית הָאֱלֹהִים 在本叙事场景中指圣殿；“神殿”简洁自然，“院子”保留 חֲצֵרוֹת 的空间含义。
- source_word: רְחוֹב
  choice: 广场
  rationale: 此词指城门附近开阔的公共场地；“广场”比字面的“宽阔处”更符合现代汉语地理表达。
- source_word: שַׁעַר הַמַּיִם
  choice: 水门
  rationale: 作为城门专名，采用简洁、通行的“水门”。
- source_word: שַׁעַר אֶפְרָיִם
  choice: 以法莲门
  rationale: 按希伯来文属格结构表达这一城门专名，符合现代中文圣经地名习惯。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号分开行动与搭棚地点，并用“有的……有的……也有的……”表达原文分配性的 אִישׁ 和随后地点清单，避免让读者误以为每个人在所有地点都各搭一棚。
