base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/004.yaml
  text: Ezra the scribe stood on a wooden platform that they had made for the purpose[a], and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah[b], and Meshullam on his left hand.
translation:
  language: zh_hans
  text: 文士以斯拉站在他们为这事搭建的木台[a]上。在他右边站着玛他提雅、示玛、亚奈雅、乌利亚、希勒家和玛西雅；在他左边站着毗大雅、米沙利、玛基雅、哈顺、哈沙巴大拿、撒迦利亚和米书兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木台”原文直译为“木塔”，即高起的木制台子。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֵץ
  choice: 木台
  rationale: 字面为“木制的塔”，但在公开宣读律法的场景中，指供人站立的高起木制台子；“木台”自然简洁，同时由脚注保留字面意象。
- source_word: לַדָּבָר
  choice: 为这事
  rationale: דָּבָר 可指“话、事情、事务、目的”；此处指为当时所办之事搭建木台。“为这事”保留原文一定的宽泛性，不将其过度限定为某一具体用途。
- source_word: הַסֹּפֵר
  choice: 文士
  rationale: סֹפֵר 在此指熟悉并从事律法文本工作的人；“文士”是中文圣经语境中准确且通行的称谓。
- source_word: אֶצְלוֹ
  choice: 在他……边
  rationale: 表示与以斯拉相邻站立；结合后面的左右方位，分别译作“在他右边”和“在他左边”，中文清楚自然。
- source_word: עַל יְמִינוֹ / וּמִשְּׂמֹאלוֹ
  choice: 在他右边 / 在他左边
  rationale: 准确表达方位关系，也使两组人名的结构清晰对称。
- source_word: וַיַּעֲמֹד
  choice: 站
  rationale: 按叙事语境译为已经发生的动作；现代汉语通常无需额外标明过去时，并保留以斯拉与众人都“站着”的重复。
