  text: וַ/יְבָ֣רֶךְ עֶזְרָ֔א אֶת יְהוָ֥ה הָ/אֱלֹהִ֖ים הַ/גָּד֑וֹל וַ/יַּֽעֲנ֨וּ כָל הָ/עָ֜ם אָמֵ֤ן אָמֵן֙ בְּ/מֹ֣עַל יְדֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּשְׁתַּחֲוֻּ֛ לַ/יהוָ֖ה אַפַּ֥יִם אָֽרְצָ/ה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/006.yaml
  text: And Ezra blessed Yahweh[a], the great God, and all the people answered, “Amen, Amen,” while lifting up their hands. Then they bowed down and worshiped Yahweh with their faces to the ground.
translation:
  language: zh_hans
  text: 以斯拉称颂雅威这位伟大的上帝；众民都举起双手回应说：“阿们！阿们！”[a] 随后，他们俯身，面伏于地，敬拜雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿们”是表示认同、确认的礼仪性回应；原文重复两次，以加强语气。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: 称颂
  rationale: ברך 的对象为上帝时，表示向上帝献上祝颂或赞美。“称颂”既保留祝颂意味，也比现代汉语中容易产生歧义的“祝福上帝”更自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: הָאֱלֹהִים הַגָּדוֹל
  choice: 这位伟大的上帝
  rationale: 该短语与“雅威”构成同位说明；加入“这位”使现代汉语关系清楚，同时保留“伟大”的强调。
- source_word: וַיַּעֲנוּ
  choice: 回应说
  rationale: ענה 在这里引出众民对称颂的礼仪性口头回应；“回应说”符合现代汉语叙事。
- source_word: אָמֵן אָמֵן
  choice: 阿们！阿们！
  rationale: 保留礼仪用语的音译及原文重复，表达众民强烈的认同与响应。
- source_word: בְּמֹעַל יְדֵיהֶם
  choice: 都举起双手
  rationale: 介词短语表示回应时伴随的动作；融入主句后自然清楚。“双手”符合 יְדֵיהֶם 的复数含义。
- source_word: וַיִּקְּדוּ
  choice: 俯身
  rationale: קדד 表示弯身低头；“俯身”与随后面伏于地的姿态衔接自然，也不与敬拜一词合并。
- source_word: וַיִּשְׁתַּחֲווּ
  choice: 敬拜
  rationale: 该词既可指俯伏动作，也可表达敬拜行为；前一动词已交代俯身，因此此处用“敬拜”保留宗教行动的重点。
- source_word: אַפַּיִם אָרְצָה
  choice: 面伏于地
  rationale: 这是表示完全俯伏的惯用语；“面伏于地”简洁、庄重，并准确传达脸朝地面的姿势。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以现代汉语音译方式保留专名，而不以“主”这一称号取代；“耶和华”虽有深厚汉语圣经传统，但反映的是较晚形成的混合读音。
- issue: ברך 以上帝为宾语时的表达
  choice: 称颂
  alternative: 祝福；赞美
  rationale: “称颂”保留向上帝发出祝颂之言的语义，又避免现代读者把“祝福上帝”理解为人向上帝赐福；同时不把词义完全收窄为一般性的“赞美”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“称颂”“俯身”“面伏于地”保留经文礼仪场景的肃穆感，同时避免生硬直译。脚注标记置于“阿们！阿们！”之后，使其与脚注实际说明的内容对应。
