  text: וְ/יֵשׁ֡וּעַ וּ/בָנִ֡י וְ/שֵׁרֵ֥בְיָ֣ה יָמִ֡ין עַקּ֡וּב שַׁבְּתַ֣י הֽוֹדִיָּ֡ה מַעֲשֵׂיָ֡ה קְלִיטָ֣א עֲזַרְיָה֩ יוֹזָבָ֨ד חָנָ֤ן פְּלָאיָה֙ וְ/הַ/לְוִיִּ֔ם מְבִינִ֥ים אֶת הָ/עָ֖ם לַ/תּוֹרָ֑ה וְ/הָ/עָ֖ם עַל עָמְדָֽ/ם׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/007.yaml
  text: And Jeshua[a], Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan[b], Pelaiah, and the Levites explained the law to the people, while the people remained in their places.
translation:
  language: zh_hans
  text: 耶书亚、巴尼、示利比雅、雅悯、亚谷、沙比太、荷第雅、玛西雅、基利他、亚撒利雅、约撒拔、哈难、毗莱雅和利未人，使百姓明白律法[a]；百姓仍站在原处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向百姓讲解律法。”希伯来语动词为使役形式，意思是使百姓明白。
    reason: lexical_alternative
  - marker: b
    text: 或译：“百姓都留在各自的位置上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁוּעַ ... פְּלָאיָה
  choice: 耶书亚、巴尼、示利比、雅悯、亚谷、沙比太、荷第雅、玛西雅、基利他、亚撒利雅、约撒拔、哈难、毗莱雅
  rationale: 人名按希伯来语音译，并尽量采用现代中文圣经读者较熟悉的旧约译名形式。
- source_word: וְהַלְוִיִּם
  choice: 以及利未人
  rationale: 保留希伯来文连词与名词的并列结构，不武断判定前列诸人是否就是这里所说的全部利未人。
- source_word: מְבִינִים אֶת־הָעָם לַתּוֹרָה
  choice: 帮助百姓明白律法
  rationale: מְבִינִים 是 בין 的使役分词，表达“使人明白”。此译法自然地保留使役含义；לַתּוֹרָה 在本语境中指向公开宣读的律法。
- source_word: וְהָעָם עַל עָמְדָם
  choice: 百姓都站在原处
  rationale: 较贴近短语字面所表达的站立状态及所在位置，同时符合现代汉语表达。
theological_decisions:
- issue: 利未人所做之事是讲解，还是使百姓明白
  choice: 帮助百姓明白律法
  alternative: 向百姓讲解律法
  rationale: 希伯来语直接强调使百姓获得理解；“讲解”很可能是所用方式，但经文本身首先陈述的是结果性、使役性的行动，因此正文保留这一重点，并在脚注列出自然的解释性译法。
- issue: 百姓当时是持续站立，还是留在各自位置
  choice: 站在原处
  alternative: 留在各自的位置上
  rationale: עַל עָמְדָם 可涉及“站立”及“所在位置”两层意思；正文兼顾二者，脚注保留偏重位置的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。人名使用简体中文旧约常见音译；句式保留名单的正式感，并以分号清楚区分利未人的行动与百姓的状态。
