  to: 耶书亚、巴尼、示利比雅、雅悯、亚谷、沙比太、荷第雅、玛西雅、基利他、亚撒利雅、约撒拔、哈难、毗莱雅和利未人，使百姓明白律法[a]；百姓仍站在原处[b]。
