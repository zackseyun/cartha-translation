base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/012.yaml
  text: And all the people went away to eat and drink[a], to send portions, and to celebrate with great joy[b], because they had understood the words that had been made known to them.
translation:
  language: zh_hans
  text: 众人都离去，去吃喝、分送食物[a]，并举行盛大的欢庆；因为他们已经明白了向他们传达的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“分送各份”，这里指把食物分送给别人，作为节庆的一部分。
    reason: lexical_alternative
  - marker: b
    text: “话”也可译作“事情”；“向他们传达”直译为“使他们知道”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל הָעָם
  choice: 众人就都离去
  rationale: 叙事形式表示众人从聚会处离开；“都”保留 כָל 的整体含义，“离去”也自然引出随后各项活动。
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: 吃喝
  rationale: 两个不定式说明离去后所做的事，直译简洁自然。
- source_word: וּלְשַׁלַּח מָנוֹת
  choice: 分送食物
  rationale: מָנוֹת 指分出的份额，在节庆语境中具体指食物；“分送”兼顾“送出”及与别人分享之意。
- source_word: וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה
  choice: 大大欢喜
  rationale: 原文直义近于“成就极大的欢喜”；此译法符合现代汉语习惯，又保留 גְדוֹלָה 所表达的强烈程度。
- source_word: כִּי הֵבִינוּ
  choice: 因为他们明白了
  rationale: כִּי 清楚引出欢喜的原因；“明白了”表达已经获得理解这一完成状态。
- source_word: בַּדְּבָרִים
  choice: 那些话
  rationale: דְּבָרִים 可指“话”或“事情”；本段围绕律法的宣读和讲解，“话”更贴合近距离语境，同时以脚注保留另一可能。
- source_word: אֲשֶׁר הוֹדִיעוּ לָהֶם
  choice: 向他们讲明的
  rationale: ידע 的使役形表示“使人知道”；“讲明”在教学语境中自然，但不限定具体讲解方式。
theological_decisions:
- issue: 百姓欢喜的根据
  choice: 明确保留“因为”所表达的因果关系：他们因明白所传达的话而欢喜。
  alternative: 将本句扩展解释为悔改后的欢庆或技术意义上的立约更新。
  rationale: 经文本身只明说他们的欢喜源于明白了那些话；译文不加入本节未明说的系统神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“众人就都离去”保持叙事推进感；“大大欢喜”兼具圣经文体的凝练与现代可懂度。
