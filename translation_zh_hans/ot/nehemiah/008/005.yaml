base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/005.yaml
  text: Ezra opened the book in the sight of all the people[a], for he was above all the people; and when he opened it, all the people stood.
translation:
  language: zh_hans
  text: 以斯拉在全体民众眼前打开那书[a]，因为他站在高过全体民众的地方；他一打开，所有民众都站了起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那卷轴”。希伯来语 סֵפֶר 可指书面文献；在当时也可以指卷轴形式的文献。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: 展开
  rationale: פתח的基本义是“打开”。这里的对象很可能是卷轴，现代汉语用“展开”既自然，也符合其实际形态；并未采用更具体的“摊开”或“解开”。
- source_word: הַסֵּפֶר
  choice: 那书卷
  rationale: סֵפֶר可指书、文书或卷轴。此处是公开诵读的律法文本，古代载体很可能是卷轴；“书卷”既保留书面文本之义，也符合历史形态。脚注列出较宽泛的“那书”。
- source_word: לְעֵינֵי
  choice: 在……眼前
  rationale: 此短语直译为“在……眼中／眼前”，强调众人都能看见；“在众民眼前”保留了公开可见的意味。
- source_word: כָל הָעָם
  choice: 众民／众民都
  rationale: עָם指聚集的民众。中文以“众民”简洁、庄重地表达整体人群；末句借“都”明确כָל的全体意味。
- source_word: כִּי מֵעַל כָּל הָעָם הָיָה
  choice: 因为他站的位置高过众民
  rationale: מֵעַל在此表示空间位置较高，而非身份优越。原文没有明说“站的位置”，但中文若只说“他高过众民”容易误解为身高或地位，因此作最小限度的明示。
- source_word: וּכְפִתְחוֹ
  choice: 他一展开
  rationale: כְּ在此表达时间关系，可译“当……时”或“一……就”。结合后面的动作，“一展开……就……”自然地表现紧接发生的情形，同时不额外解释原因。
- source_word: עָמְדוּ
  choice: 站起来
  rationale: עמד可表示站立，也可在语境中表示起身站立。前文描述以斯拉打开书卷，众民随即“站起来”是自然中文；保留了他们原先可能并非站立这一语境含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“众民”呼应本节三次出现的כָל הָעָם；首处和中间处由“众民”在语境中表达整体，末处用“都”加强全体性。
