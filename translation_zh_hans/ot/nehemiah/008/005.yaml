  to: 以斯拉在全体民众眼前打开那书[a]，因为他站在高过全体民众的地方；他一打开，所有民众都站了起来。
  rationale: 修订将正文的“书卷／展开”改为“书／打开”，以保留希伯来原文及英语审计轨迹中的词汇宽度；卷轴这一合理的历史形态转置于脚注。并调整有关以斯拉所处高度的表述，使其在现代汉语中更自然且明确为物理位置。
