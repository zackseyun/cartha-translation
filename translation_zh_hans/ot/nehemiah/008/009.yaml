  naturalness: 整体庄重、通顺，适合现代标准普通话。“律法上的话”略显生硬，改为“律法的话语”更自然；命令句用“不要哀伤，也不要哭泣”也更符合现代书面语。
  terminology: “耶和华”保留神名性质，且与中文既有圣经语域相符。“祭司和经学家”清楚保留两个并列身份；避免“兼”可能带来的现代职务兼任联想。
