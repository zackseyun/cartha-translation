revisions:
- from: 于是，省长[a]尼希米、祭司兼经学家以斯拉，以及教导百姓明白律法的利未人，对全体百姓说：“今天是耶和华你们上帝的圣日。不要悲哀，也不要哭泣。”因为百姓听见律法上的话时，都哭了。
  to: 于是，省长[a]尼希米、祭司和经学家以斯拉，以及向百姓讲解的利未人，对全体百姓说：“今天是耶和华你们的上帝的圣日。不要哀伤，也不要哭泣。”因为全体百姓听见律法的话语时，都在哭泣。
  rationale: 修订删除了对利未人所讲解内容的非必要补足，改进两处中文搭配，并以“和”中性地表达以斯拉并列的祭司与经学家身份。保留“今天是……的圣日”以表达该日归属于耶和华；“都在哭泣”则保留原文分词所呈现的持续动作。原英文审计材料中妥拉脚注的锚点错置，中文正文不应沿用；本节只保留与“省长”对应的脚注。
