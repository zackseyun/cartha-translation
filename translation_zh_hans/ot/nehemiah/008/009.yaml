source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר נְחֶמְיָ֣ה ה֣וּא הַ/תִּרְשָׁ֡תָא וְ/עֶזְרָ֣א הַ/כֹּהֵ֣ן הַ/סֹּפֵ֡ר וְ/הַ/לְוִיִּם֩ הַ/מְּבִינִ֨ים אֶת הָ/עָ֜ם לְ/כָל הָ/עָ֗ם הַ/יּ֤וֹם קָדֹֽשׁ הוּא֙ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֔ם אַל תִּֽתְאַבְּל֖וּ וְ/אַל תִּבְכּ֑וּ כִּ֤י בוֹכִים֙ כָּל הָ/עָ֔ם כְּ/שָׁמְעָ֖/ם אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/009.yaml
  text: Then Nehemiah the governor[a], Ezra the priest and scribe, and the Levites who were instructing the people said to all the people, “This day is holy to Yahweh your God[b]. Do not mourn or weep.” For all the people were weeping as they heard the words of the law.
translation:
  language: zh_hans
  text: 于是，省长[a]尼希米、祭司和经学家以斯拉，以及向百姓讲解的利未人，对全体百姓说：“今天是耶和华你们的上帝的圣日。不要哀伤，也不要哭泣。”因为全体百姓听见律法的话语时，都在哭泣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“提尔沙他”，这是一个波斯行政官衔。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: 省长
  rationale: 这是波斯时期的行政官衔；译作“省长”能让现代读者直接理解其职能，同时以脚注保留音译的可能。
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: 祭司兼经学家
  rationale: 两个名词都说明以斯拉的身份；“兼”自然表达一人兼具两种职分。“经学家”在此指抄写、研习并讲解律法者，比现代行政意义的“书记”准确。
- source_word: הַלְוִיִּם הַמְּבִינִים אֶת־הָעָם
  choice: 教导百姓明白律法的利未人
  rationale: 使役形式表达使百姓明白或向百姓讲解；上下文明确他们所教导的是律法，补出“律法”使中文自然清楚。
- source_word: הַיּוֹם קָדֹשׁ הוּא
  choice: 今天是……的圣日
  rationale: 保留该日分别为圣的宗教含义；中文以“圣日”表达比“今天是圣的”更自然。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 直接以中文传统且广为人知的专名“耶和华”呈现四字神名，并保留此日归属于他的含义。
- source_word: תִּתְאַבְּלוּ
  choice: 悲哀
  rationale: 该词指哀悼、悲痛；“悲哀”与下文“哭泣”相配，又不把场景限定为丧礼。
- source_word: תִּבְכּוּ / בוֹכִים
  choice: 哭泣／哭了
  rationale: 保持庄重语体，并在命令句与叙述句中采用自然的现代汉语表达。
- source_word: כְּשָׁמְעָם
  choice: 听见……时
  rationale: 表达百姓听到律法话语之际便哭泣的同时关系。
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: 律法上的话
  rationale: 在公开宣读盟约律法的语境中，“律法”清楚自然；“上的话”表明所听见的是律法文本中的话语，同时保留“妥拉”的脚注选项。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉的传统专名“耶和华”，而不是以称号“主”替代，从而保留盟约之神的专名性质。
- issue: תּוֹרָה 在本节中的范围
  choice: 律法
  alternative: 妥拉／训诲
  rationale: 本段是公开宣读盟约文本的场景，“律法”最符合上下文；但原词也可音译为“妥拉”，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“经学家”避免把 סֹפֵר 误解为普通文书；句式尽量贴近希伯来文的叙事顺序。英文资料将“words of the Torah”的脚注误标为[b]接在神名之后；为避免脚注错位，正文仅在“省长”处设置[a]，没有沿用该错误标记。
