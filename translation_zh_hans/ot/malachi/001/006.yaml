  text: בֵּ֛ן יְכַבֵּ֥ד אָ֖ב וְ/עֶ֣בֶד אֲדֹנָ֑י/ו וְ/אִם אָ֣ב אָ֣נִי אַיֵּ֣ה כְבוֹדִ֡/י וְ/אִם אֲדוֹנִ֣ים אָנִי֩ אַיֵּ֨ה מוֹרָאִ֜/י אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת לָ/כֶם֙ הַ/כֹּֽהֲנִים֙ בּוֹזֵ֣י שְׁמִ֔/י וַ/אֲמַרְתֶּ֕ם בַּ/מֶּ֥ה בָזִ֖ינוּ אֶת שְׁמֶֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/006.yaml
  text: A son honors his father, and a servant his master. If, then, I am a father, where is my honor? And if I am a master, where is the fear due me? says the LORD of Armies to you, O priests who despise my name. Yet you say, “How have we despised your name?”
translation:
  language: zh_hans
  text: 万军之耶和华对你们这些藐视我名的祭司说：“儿子尊敬父亲，奴仆尊敬主人。若我为父亲，我的尊荣在哪里？若我为主人，对我的敬畏在哪里？你们却说：‘我们在哪件事上藐视了你的名？’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְכַבֵּד / כְבוֹדִי
  choice: 尊敬 / 尊敬我的
  rationale: 同一词根 כבד 在本节形成首尾呼应，表示给予应有的分量、尊荣；用“尊敬”既自然，也尽量保留词汇联系。
- source_word: עֶבֶד
  choice: 奴仆
  rationale: 该词可指奴隶或仆役；此处与“主人”构成社会身份关系。“奴仆”比单纯“仆人”更清楚体现从属关系，同时符合庄重语体。
- source_word: אֲדֹנָיו / אֲדוֹנִים
  choice: 主人
  rationale: 前者指奴仆的主人，后者是复数形式而以单数表语“我”相配，用作尊称或威严复数；中文统一译作“主人”，保留父亲—主人的平行。
- source_word: מוֹרָאִי
  choice: 敬畏我的
  rationale: מוֹרָא 表示畏惧、敬畏。语境是主人应得的敬重与畏惧，译作“敬畏”可保留宗教与权威语境中的双重意味。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 按希伯来专名与称号直译；“万军”保留 צְבָאוֹת 所指诸军、众军的宽广含义，且为中文圣经传统中清楚而庄重的表达。
- source_word: בּוֹזֵי שְׁמִי
  choice: 藐视他名的
  rationale: בזה 指轻看、鄙视；“藐视”准确表达其强度。“名”在语境中代表耶和华的身份、声誉与权威，不在正文中扩展解释。
- source_word: בַּמֶּה
  choice: 在什么事上
  rationale: 比字面的“用什么”更符合这里质疑行为根据的语义，也使祭司的反问在现代汉语中自然。
theological_decisions:
- issue: 父亲与主人的陈述是否增添条件语气
  choice: 译作“我既是父亲……我既是主人”
  alternative: “如果我是父亲……如果我是主人”
  rationale: 希伯来语 וְאִם 形式上可译“如果”，但在此修辞问句中并非质疑上帝是否为父、为主，而是以既定身份追问应得的尊敬与敬畏。“既是”自然传达论证力量，同时没有补入更具体的神学关系。
- issue: אֲדוֹנִים 的复数形式
  choice: 按单数意义译“主人”
  alternative: 译作“众主人”或“主宰”
  rationale: 该词与单数“我”相配，在此作为对单一说话者的尊称或威严表达；译成复数会误导。
- issue: 人称转换
  choice: 保留“万军之耶和华……藐视他名”
  alternative: 统一为“我……藐视我的名”
  rationale: 原文在直接引语中出现先知引介语，并以第三人称“我的名”所指的说话者来描述祭司；中文用引号划分话语层次，并以“他名”顺应引介句语法，避免误以为祭司藐视的是先知之名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文父亲/主人、尊敬/敬畏两组严整平行，并用连续反问体现责备力度。正文不加脚注，因为本节的词义与句法可在译文中充分表达。
