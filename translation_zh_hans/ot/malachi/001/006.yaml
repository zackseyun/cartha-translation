- from: “儿子尊敬父亲，奴仆敬畏主人。我既是父亲，尊敬我的在哪里呢？我既是主人，敬畏我的在哪里呢？”万军之耶和华对你们这些藐视他名的祭司说。“你们却问：‘我们在什么事上藐视了你的名？’”
  to: 万军之耶和华对你们这些藐视我名的祭司说：“儿子尊敬父亲，奴仆尊敬主人。若我为父亲，我的尊荣在哪里？若我为主人，对我的敬畏在哪里？你们却说：‘我们在哪件事上藐视了你的名？’”
  rationale: 修订恢复希伯来文前两分句共享“尊敬”的结构，并把“敬畏”限定用于后面的 מוֹרָאִי；以“尊荣”对应 כְבוֹדִי，同时保持与“尊敬”的语义联系。重排引语和人称，使“万军之耶和华说”引介完整的第一人称神谕，并保留末句祭司的第二人称反问。无需脚注。
