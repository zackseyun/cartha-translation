language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ֤י גַם בָּ/כֶם֙ וְ/יִסְגֹּ֣ר דְּלָתַ֔יִם וְ/לֹֽא תָאִ֥ירוּ מִזְבְּחִ֖/י חִנָּ֑ם אֵֽין לִ֨/י חֵ֜פֶץ בָּ/כֶ֗ם אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/מִנְחָ֖ה לֹֽא אֶרְצֶ֥ה מִ/יֶּדְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/010.yaml
  text: Oh[a], that there were even one among you who would shut the doors, so that you would not kindle my altar in vain! I have no pleasure in you, says Yahweh of hosts[c][b], and I will not accept an offering from your hand.
translation:
  language: zh_hans
  text: 但愿你们中间哪怕有一个人把殿门关上，免得你们徒然在我的祭坛上生火！[a]万军之耶和华说：“我不喜悦你们，也不悦纳你们手中的供物。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们中间有谁肯把殿门关上，使你们不再徒然在我的祭坛上生火呢？”希伯来语可理解为反问，也可像正文一样理解为强烈的愿望。
    reason: alternative_reading
  - marker: b
    text: “供物”所译的希伯来语在献祭语境中也可特指“素祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי גַם בָּכֶם
  choice: 你们中间哪怕有一个人……该多好
  rationale: 这一短语形式上可作疑问句，语境中更可能表达强烈愿望和痛惜；正文采用自然的汉语愿望句，同时以脚注保留反问读法。
- source_word: וְיִסְגֹּר דְּלָתַיִם
  choice: 把殿门关上
  rationale: דְּלָתַיִם 是复数“门”；结合祭坛和祭司语境，所指是圣殿的门，补出“殿”可使现代读者明确场景。
- source_word: וְלֹא תָאִירוּ מִזְבְּחִי חִנָּם
  choice: 不让你们白白点燃我的祭坛之火
  rationale: אור 的使役式在此指点燃祭坛上的火；חִנָּם 表示徒然、毫无意义。“白白”保留其无益、徒劳之意。
- source_word: אֵין לִי חֵפֶץ בָּכֶם
  choice: 我不喜悦你们
  rationale: חֵפֶץ 表示喜悦或悦意；简洁保留上帝对受话者本身的不悦，而非仅否定其行为。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”呈现四字神名，以传统且可理解的“万军”表达 צְבָאוֹת，并保留这一神圣称号的经文关联。
- source_word: וּמִנְחָה
  choice: 供物
  rationale: מִנְחָה 可泛指礼物或供物，在祭祀语境中也可特指素祭。“供物”不把词义过度限定，具体可能性置于脚注。
- source_word: לֹא אֶרְצֶה מִיֶּדְכֶם
  choice: 也不悦纳你们手中的供物
  rationale: רצה 在献祭语境中指怀着悦意接受，即“悦纳”；“你们手中”保留原文身体隐喻及复数领属意义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经读者广泛熟悉的专名“耶和华”，而不以“主”替代神名；这不改变原文所用的盟约神名。
- issue: מִנְחָה 的范围
  choice: 供物
  alternative: 素祭
  rationale: 该词在祭祀语境中常可专指素祭，但本节对祭司敬拜的谴责具有较宽背景；正文保留较宽泛的“供物”，脚注说明具体词义。
- issue: 开篇句式的愿望与反问张力
  choice: 愿望句
  alternative: 反问句
  rationale: 上下文更自然地表达上帝宁愿有人关闭殿门、停止虚妄献祭的强烈愿望；因希伯来语形式仍容许反问，脚注明确保留该读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“该多好”传达开篇的痛惜和愿望而不过分古雅；“悦纳”作为献祭语境中的常用词，兼具准确性与可懂性。脚注标记均置于相关正文之后。
