  naturalness: 整体庄重、自然，符合现代标准汉语的先知宣告语体。“人必称他们为”可保留。将末尾改为并列的“为……，又为……”更顺畅，也更清楚地显示这两个称号同指以东。
  terminology: “以东”“万军之耶和华”“摧毁”“拆毁”均合适。“邪恶的疆域”比“邪恶之地”更贴合 גְּבוּל，且仍保持中文自然。对 זָעַם 译作“发怒”可接受；“永远向他们发怒”明确保留其对象，避免“向其”的指代滞涩。
