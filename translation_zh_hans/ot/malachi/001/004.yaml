language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי תֹאמַ֨ר אֱד֜וֹם רֻשַּׁ֗שְׁנוּ וְ/נָשׁוּב֙ וְ/נִבְנֶ֣ה חֳרָב֔וֹת כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הֵ֥מָּה יִבְנ֖וּ וַ/אֲנִ֣י אֶהֱר֑וֹס וְ/קָרְא֤וּ לָ/הֶם֙ גְּב֣וּל רִשְׁעָ֔ה וְ/הָ/עָ֛ם אֲשֶׁר זָעַ֥ם יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/004.yaml
  text: 'Though Edom says[a], “We are shattered, but we will return and rebuild the ruins,” this is what Yahweh of Armies says: “They may build, but I will tear down, and they will be called the territory of wickedness[d][c][b], the people with whom Yahweh is indignant forever.”'
translation:
  language: zh_hans
  text: 以东虽然说：“我们已被摧毁，却要回来重建废墟。”万军之耶和华如此说：“他们即使建造，我也必拆毁[a]。人必称他们为‘邪恶的疆域’[b]，又为‘耶和华永远向他们发怒的民族’。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们必建造，我必拆毁。”希伯来语也可按直陈的将来语气理解；正文依上下文表达让步意味。
    reason: alternative_reading
  - marker: b
    text: “邪恶的疆域”也可译为“邪恶的边地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֹאמַר אֱדוֹם
  choice: 以东虽然说
  rationale: כִּי 在此引出以东的宣称，并与耶和华随后反驳形成让步关系；“虽然”自然呈现上下文的对比，同时不把未完成式 תֹאמַר 限定为单纯将来时。
- source_word: רֻשַּׁשְׁנוּ
  choice: 我们已被摧毁
  rationale: 该被动形式表示遭到破坏、压倒或蹂躏；“被摧毁”适合描述以东国土和国家处境的毁坏，不将含义缩窄为贫困。
- source_word: וְנָשׁוּב וְנִבְנֶה חֳרָבוֹת
  choice: 却要回来重建废墟
  rationale: שׁוב 的基本义为“回来、返回”，不宜解释成被动的“复兴”；“重建废墟”是符合现代汉语习惯的表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神名“耶和华”，并以现代中文圣经语体中清楚、庄重的“万军”表达 צְבָאוֹת 的复数军旅意象。
- source_word: הֵמָּה יִבְנוּ וַאֲנִי אֶהֱרוֹס
  choice: 他们即使建造，我也必拆毁
  rationale: 两个独立代词形成强调性对照；“即使……也……”传达以东建造终归徒劳的语境力量，而脚注保留直陈将来式的读法。
- source_word: וְקָרְאוּ לָהֶם
  choice: 人必称他们为
  rationale: 希伯来语第三人称复数在此可作不定施事者；译为“人必称”比生硬的“他们必称”更符合现代汉语。
- source_word: גְּבוּל רִשְׁעָה
  choice: 邪恶之地
  rationale: גְּבוּל 可指边界，也可指疆域或领土；此处作为对以东的称号，“地”简洁自然，而“邪恶”保留 רִשְׁעָה 的道德判断。
- source_word: הָעָם אֲשֶׁר זָעַם יְהוָה עַד עוֹלָם
  choice: 耶和华永远向其发怒的民族
  rationale: זעם 表示强烈的愤怒或愤然责斥；“向其发怒”明确保留怒气所针对的对象，עַד עוֹלָם 直译为“永远”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文读者最熟悉的专名形式，同时把它作为神的专名而非普通称号处理。
- issue: 称号 צְבָאוֹת 的译法
  choice: 万军
  alternative: 众军／军队
  rationale: “万军之耶和华”既保留军旅和统帅意象，也不擅自把所指限定为天使、天军或以色列军队。
- issue: הֵמָּה יִבְנוּ 的语气
  choice: 让步式：他们即使建造
  alternative: 预告式：他们必建造
  rationale: 上下文重点在于以东的重建无法抗衡耶和华的拆毁；正文表达让步力量，脚注保留希伯来语未完成式可作将来预告的理解。
- issue: 永久发怒的表述
  choice: 耶和华永远向其发怒
  alternative: 耶和华永远谴责的
  rationale: 正文保留 זעם 的情感和关系性张力，不把它淡化为纯司法判语，也不进一步推断最终命运的具体教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“如此说”保留先知传信公式的正式感；引号中的两个称号维持原文的宣告力度。避免把“万军”具体化为某一类军队，也避免把以东重建与耶和华发怒之间的神学张力解释得超过原文。
