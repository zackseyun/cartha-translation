revisions:
- from: 以东虽然说：“我们已被摧毁，却要回来重建废墟。”万军之耶和华如此说：“他们即使建造，我也必拆毁[a]。人必称他们为‘邪恶之地’[b]，称他们为‘耶和华永远向其发怒的民族’。”
  to: 以东虽然说：“我们已被摧毁，却要回来重建废墟。”万军之耶和华如此说：“他们即使建造，我也必拆毁[a]。人必称他们为‘邪恶的疆域’[b]，又为‘耶和华永远向他们发怒的民族’。”
  rationale: 将正文的“邪恶之地”改为“邪恶的疆域”，以准确体现 גְּבוּל 的领土性含义；相应缩减脚注，避免把更贴近原文的译法仅置于备选。末句改为一个命名动作下的两个并列称谓，并明确“发怒”的对象，使中文更流畅且忠实于原文句法。其余内容无需改动。
