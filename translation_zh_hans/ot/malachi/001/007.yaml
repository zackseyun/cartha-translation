revisions:
- from: 你们把污秽的食物献在我的祭坛上[a]。你们却说：“我们在什么事上玷污了你[b]？”就是你们说：“雅威的桌子[c]是可轻视的。”
  to: 你们把污秽的食物献在我的祭坛上[a]。你们却说：“我们在什么事上玷污了你[b]？”因为你们说：“雅威的桌子[c]是被藐视的。”
  rationale: 将末句改为“是被藐视的”，以表达原文所陈述的实际轻蔑，而不引入“可”的可能性。将“就是”改为“因为”，更自然地表达他们借着这句话玷污神的方式／根据。脚注b相应更正为“污染”，避免“污辱”造成语义偏移。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:17:19Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了祭坛的第一人称所属、“玷污了你”这一直接以神为宾语的修辞，以及“雅威的桌子”这一未被解释性抹平的隐喻。“食物”在此献祭语境中也恰当地表达了לֶחֶם的广义。不过，נִבְזֶה הוּא陈述的是其实际被藐视／受轻看，而非仅仅“可”被轻视；宜明确译出这一状态。
  naturalness: 整体为庄重、清楚的现代汉语。“就是你们说”可以成立，但“因为你们说”更自然地表达介词加不定式所标示的方式／原因关系，并使引语与前述反问的回答衔接顺畅。
  terminology: “雅威”“祭坛”“食物”“玷污”均一致且适合本段礼仪语境。脚注b的“污辱”偏向侮辱，不能恰当作为גאל（玷污、污染）的替代译法，应改为“污染”。
