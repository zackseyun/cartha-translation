id: MAL.1.7
reference: Malachi 1:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַגִּישִׁ֤ים עַֽל מִזְבְּחִ/י֙ לֶ֣חֶם מְגֹאָ֔ל וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה גֵֽאַלְנ֑וּ/ךָ בֶּ/אֱמָרְ/כֶ֕ם שֻׁלְחַ֥ן יְהוָ֖ה נִבְזֶ֥ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/007.yaml
  text: By presenting defiled food on my altar[a]. But you say, “How have we defiled you?” By saying[c][b], “The table of Yahweh is despised.”
translation:
  language: zh_hans
  text: 你们把污秽的食物献在我的祭坛上[a]。你们却说：“我们在什么事上玷污了你[b]？”因为你们说：“雅威的桌子[c]是被藐视的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”原文直译为“饼”，但在这里的献祭语境中，泛指献在祭坛上的食物。
    reason: lexical_alternative
  - marker: b
    text: 或译“我们在什么事上污染了你？”原文直接以“你”称呼上帝，表明轻慢他的祭坛就是冒犯他本人。
    reason: alternative_reading
  - marker: c
    text: “雅威的桌子”是对祭坛及其献祭事奉的比喻。
    reason: cultural_note
lexical_decisions:
- source_word: מַגִּישִׁים
  choice: 献
  rationale: 该词为נגשׁ的使役分词，在这里承接上一节的责问，说明祭司藐视上帝之名的具体方式。汉语用“献”自然表达把祭物呈到祭坛上的礼仪动作。
- source_word: עַל מִזְבְּחִי
  choice: 在我的祭坛上
  rationale: 保留处所关系和第一人称所属形式，符合现代汉语表达。
- source_word: לֶחֶם
  choice: 食物
  rationale: 本义可指“饼”，但在献祭语境中泛指祭坛上献给上帝的食物；译作“食物”可避免让读者误以为这里只涉及烤饼。
- source_word: מְגֹאָל
  choice: 污秽的
  rationale: 该词表达玷污、不洁之意；“污秽的”兼具礼仪与道德上的负面色彩，并与下文“玷污”形成词根呼应。
- source_word: בַּמֶּה גֵאַלְנוּךָ
  choice: 我们在什么事上玷污了你？
  rationale: 原文宾语后缀明确为第二人称阳性单数，直接指向上帝。“在什么事上”是对במה的自然表达，同时保留“玷污了你”这一突出的修辞张力。
- source_word: בֶּאֱמָרְכֶם
  choice: 就是你们说
  rationale: 介词加不定式说明他们以何种方式玷污上帝；“就是你们说”在汉语中清楚引出答案，并承接前面的反问。
- source_word: שֻׁלְחַן יְהוָה
  choice: 雅威的桌子
  rationale: 保留原文把祭坛及其献祭事奉称作“桌子”的礼仪隐喻，并将神名יהוה音译为“雅威”。
- source_word: נִבְזֶה הוּא
  choice: 是可轻视的
  rationale: 原文述语形容词表示被看作卑贱、不值得尊重；“可轻视的”自然呈现祭司对雅威之桌的轻蔑判断，也与上一节“藐视”相关联。
theological_decisions:
- issue: 是否保留“我们玷污了你”中以上帝为直接宾语的说法
  choice: 保留直接称呼：“我们在什么事上玷污了你？”
  alternative: 我们在什么事上玷污了它／你的名／你的祭坛？
  rationale: 希伯来文后缀明确是第二人称单数。虽然实际行为涉及祭坛、祭物和上帝的名，原文有意把对敬拜的亵慢视为直接冒犯上帝；翻译不应消解这种神学张力。
- issue: 献祭语境中לֶחֶם的范围
  choice: 译作“食物”
  alternative: 饼
  rationale: 此处词义不限于日常饼食，而指摆在祭坛上的献祭食物。“食物”能准确传达礼仪语境，同时不改写“雅威的桌子”这一隐喻。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 采用神名的常见学术音译，以区别于称号，并保留原文使用专名的特点。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“献在……祭坛上”体现礼仪场景；保留“玷污了你”的不寻常直接宾语和“雅威的桌子”的隐喻，不在正文中将其解释性改写。脚注分别说明לֶחֶם的语境义、直接冒犯上帝的修辞，以及“桌子”的祭祀含义。
