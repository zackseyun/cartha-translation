    rationale: 原文的被动分词／形容词表明“雅威的桌子”被看作卑贱、遭受藐视；“可轻视”主要表示可被轻视的可能性或容许性。译为“是被藐视的”更贴合原文及英语审校轨迹。
  - severity: low
    issue: 脚注b将替代译法写作“污辱了你”。
    rationale: “污辱”在现代汉语通常指侮辱、羞辱，与此处“玷污／污染”的礼仪性语义不够相符；应使用“污染了你”。
