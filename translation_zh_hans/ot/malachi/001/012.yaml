  text: וְ/אַתֶּ֖ם מְחַלְּלִ֣ים אוֹת֑/וֹ בֶּ/אֱמָרְ/כֶ֗ם שֻׁלְחַ֤ן אֲדֹנָ/י֙ מְגֹאָ֣ל ה֔וּא וְ/נִיב֖/וֹ נִבְזֶ֥ה אָכְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/012.yaml
  text: But you are profaning it by saying[a], ‘The table of the Lord is defiled, and its fruit, its food[b], is despised.’
translation:
  language: zh_hans
  text: 但你们却亵渎我的名，说[a]：“主的桌子是污秽的，桌上的出产，即它的食物，是被藐视的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“亵渎它”；这里按上文译作“亵渎我的名”。这个代词也可能直接指主，译作“亵渎我”。
    reason: alternative_reading
lexical_decisions:
- source_word: מְחַלְּלִים
  choice: 亵渎
  rationale: 该词为 חלל 的强化词干形式，指把神圣之物当作凡俗；“亵渎”保留了祭祀语境中的宗教分量。
- source_word: אוֹתוֹ
  choice: 我的名
  rationale: 阳性单数宾语代词最自然地回指上一节的“我的名”。中文为明确衔接而重述先行词；也可能直接指主本人，见脚注。
- source_word: בֶּאֱמָרְכֶם
  choice: 说
  rationale: 介词加不定式结构表示方式或伴随情形；在中文中用“说”自然表达他们借此亵渎。
- source_word: שֻׁלְחַן אֲדֹנָי
  choice: 主的桌子
  rationale: 保留原文的祭祀图像及属有关系；在本段中指与祭坛和祭物有关的神圣桌子。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 此处是神圣称号 אֲדֹנָי，而非四字神名，故译作“主”。
- source_word: מְגֹאָל
  choice: 污秽的
  rationale: 被动分词表达受到玷污、不洁的状态；“污秽的”符合祭祀语境。
- source_word: נִיבוֹ
  choice: 桌上的出产
  rationale: ניב 基本义为“果实、出产”；补出“桌上的”明确代词所指，同时保留其与下一个词之间凝练的同位关系。
- source_word: נִבְזֶה
  choice: 可轻视的
  rationale: 该形式可表达被看作卑贱、可鄙；“可轻视的”自然呈现说话者贬低祭物的态度。
- source_word: אָכְלוֹ
  choice: 食物
  rationale: 字面意为“它的食物”。这里与“出产”并列或同位，所指很可能是祭坛之桌上的供物。
theological_decisions:
- issue: “亵渎”之宾语代词的所指
  choice: 回指上一节主的“名”，正文译为“我的名”
  alternative: 直接指主本人，可译为“亵渎我”
  rationale: 玛拉基书1:11聚焦“我的名”在列国中为大，1:12以“但你们”形成对照，因此回指“我的名”最合乎近距离语境；脚注保留直接指主的可能。
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 耶和华
  rationale: 马所拉文本此处为称号 אֲדֹנָי，并非四字神名，故不将两者混同。
- issue: נִיבוֹ אָכְלוֹ 的关系
  choice: 以解释性同位结构译为“桌上的出产，就是食物”
  alternative: 将两项理解为并列：“它的出产和食物”
  rationale: 原文关系高度凝练；解释性同位结构能保留两个词，并避免把它们武断地分成两类不同事物。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主的桌子”保留祭祀隐喻；正文适度明示代词所指，脚注则保存原文代词及其歧义。
