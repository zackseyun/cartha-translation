id: MAL.1.2
reference: Malachi 1:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָהַ֤בְתִּי אֶתְ/כֶם֙ אָמַ֣ר יְהוָ֔ה וַ/אֲמַרְתֶּ֖ם בַּ/מָּ֣ה אֲהַבְתָּ֑/נוּ הֲ/לוֹא אָ֨ח עֵשָׂ֤ו לְ/יַֽעֲקֹב֙ נְאֻם יְהוָ֔ה וָ/אֹהַ֖ב אֶֽת יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/002.yaml
  text: “I have loved you,” says Yahweh. But you say[a], “How have you loved us?” “Was not Esau Jacob’s brother?” declares Yahweh. “Yet I loved Jacob,”
translation:
  language: zh_hans
  text: “我爱你们[a]，”耶和华说。你们却问：“你怎样爱我们？”耶和华宣告：“以扫不是雅各的兄弟吗？我却爱雅各。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“我爱”和下文“你爱”均为完成式，可按语境理解为过去已经显明、并与当前有关的爱。现代汉语的“爱”不必明确标出时态；也可较形式化地译作“我曾爱你们……你曾怎样爱我们？”但“爱过”容易使人误以为这爱已经终止。
    reason: 说明希伯来语动词体与现代汉语时态表达之间无法完全对应，并交代未采用“爱过”的原因。
lexical_decisions:
- source_word: אָהַבְתִּי
  choice: 我爱
  rationale: אהב 的 Qal 完成式第一人称单数。现代汉语的“爱”本身不强制标明时态，既可表达过去已经显明、又在当前仍具效力的爱，避免“爱过”可能暗示如今不再爱，也避免加入原文没有明说的“一直”。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 宾格标记加第二人称阳性复数后缀，指作为群体受话者的以色列；“你们”明确保留复数。
- source_word: אָמַר יְהוָה
  choice: 耶和华说
  rationale: 先知话语公式。汉语用“说”自然引出当前呈现的神谕；神名 יהוה 音译为“耶和华”。
- source_word: וַאֲמַרְתֶּם
  choice: 你们却问
  rationale: 该动词字面为“你们说”，但其后内容是疑问句，汉语译作“问”更自然；“却”表达论辩结构中的反驳语气。
- source_word: בַּמָּה
  choice: 怎样
  rationale: 字面为“借着什么／在哪一方面”，在此询问爱的表现方式；“怎样”简明自然，并保留质疑意味。
- source_word: אֲהַבְתָּנוּ
  choice: 爱我们
  rationale: אהב 的 Qal 完成式第二人称阳性单数，加第一人称复数宾语后缀。汉语不显性限定时态，可与开头的表达保持呼应。
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 引出预期肯定回答的反问；汉语“不是……吗”准确保留其修辞功能。
- source_word: אָח
  choice: 兄弟
  rationale: 原词泛指男性手足，并未单独编码长幼次序；虽以扫是雅各的哥哥，正文采用“兄弟”以紧贴本节措辞。
- source_word: עֵשָׂו לְיַעֲקֹב
  choice: 以扫……雅各的
  rationale: 介词 לְ 标示二者的关系，汉语以所属结构“雅各的兄弟”自然表达。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: 庄严的先知神谕公式。译作“宣告”与前面的“说”有所区别，同时保留正式、权威的语气。
- source_word: וָאֹהַב אֶת יַעֲקֹב
  choice: 我却爱雅各
  rationale: 连接词在语境中形成对比：以扫虽与雅各是兄弟，神却爱雅各。“却”呈现此反差，而不把“爱”解释性扩写为“拣选”或“立约之爱”。
theological_decisions:
- issue: 是否把耶和华对雅各的“爱”明确解释为拣选或圣约之爱
  choice: 保留简单的“爱”
  alternative: 译作“拣选”或“以立约之爱来爱”
  rationale: 原文使用常见动词 אהב。上下文确有群体、圣约和拣选层面的含义，但本节没有用这些专门词语；保留“爱”可让原文的神学张力由上下文展开。
- issue: 是否将以扫与雅各的关系译成“哥哥”
  choice: 兄弟
  alternative: 哥哥
  rationale: 创世记背景表明以扫年长，但本节的 אָח 本身只表示男性手足。译作“兄弟”优先保留本节的词汇证据，不额外引入背景信息。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以直接引语重现先知论辩的问答节奏；“你们”保留对以色列群体的复数称呼。“耶和华说／耶和华宣告”既自然，又区分两个不同的神谕公式。
