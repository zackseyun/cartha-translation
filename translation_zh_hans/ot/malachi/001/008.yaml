revisions:
- from: 你们把瞎眼的牲畜献作祭物[a]，这难道不是恶吗？你们献上瘸腿或有病的牲畜，这难道不是恶吗？请把这样的牲畜送给你的省长吧！他会悦纳你[b]，或恩待你吗[c]？这是万军之耶和华说的。
  to: 你们把瞎眼的牲畜献作祭物[a]，难道不是恶事吗？你们献上瘸腿或有病的牲畜，难道不是恶事吗？请把这样的牲畜送给你的省长吧！他会接纳你[b]，或恩待你吗[c]？这是万军之耶和华说的。
  rationale: 仅作两项安全的汉语表达调整：“恶事”使责问更符合现代普通话，“接纳你”则在不丢失 רצה 以人为宾语这一重点的前提下，避免对省长使用过强的礼仪性用语。脚注锚点及其所说明的原文歧义和习语均完整保留。
