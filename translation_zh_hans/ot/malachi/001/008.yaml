id: MAL.1.8
reference: Malachi 1:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִֽי תַגִּשׁ֨וּ/ן עִוֵּ֤ר לִ/זְבֹּ֨חַ֙ אֵ֣ין רָ֔ע וְ/כִ֥י תַגִּ֛ישׁוּ פִּסֵּ֥חַ וְ/חֹלֶ֖ה אֵ֣ין רָ֑ע הַקְרִיבֵ֨/הוּ נָ֜א לְ/פֶחָתֶ֗/ךָ הֲ/יִּרְצְ/ךָ֙ א֚וֹ הֲ/יִשָּׂ֣א פָנֶ֔י/ךָ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/008.yaml
  text: When you present a blind animal for sacrifice[a], is that not evil? And when you present one that is lame or sick, is that not evil? Present it, please, to your governor. Will he accept you[c][b], or show you favor? says Yahweh of hosts.
translation:
  language: zh_hans
  text: 你们把瞎眼的牲畜献作祭物[a]，难道不是恶事吗？你们献上瘸腿或有病的牲畜，难道不是恶事吗？请把这样的牲畜送给你的省长吧！他会接纳你[b]，或恩待你吗[c]？这是万军之耶和华说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文两处直译均为“没有恶”；这里按照上下文的责问语气译成反问句。
    reason: lexical_alternative
  - marker: b
    text: “接纳你”也可译作“喜欢你”或“对你满意”。
    reason: alternative_reading
  - marker: c
    text: 希伯来文直译为“抬起你的脸”，是表示恩待、优待或接纳的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּשׁוּן / תַגִּישׁוּ
  choice: 献上
  rationale: 使役式在献祭语境中指把祭物带到坛前献上；现代汉语用“献上”自然，也保留其礼仪语境。
- source_word: עִוֵּר
  choice: 瞎眼的牲畜
  rationale: 形容词在此作名词使用，所指是有残疾的祭牲；补出“牲畜”使汉语清楚而不增加源文之外的实质信息。
- source_word: לִזְבֹּחַ
  choice: 献作祭物
  rationale: 不定式表达献祭的目的；“献作祭物”准确而通顺。
- source_word: אֵין רָע
  choice: 这难道不是恶吗？
  rationale: 字面可作“没有恶”，但上下文带有责问和反讽；以反问句传达责备力度，同时用脚注保留字面形式。
- source_word: פִּסֵּחַ
  choice: 瘸腿
  rationale: 指肢体有缺陷、行动不便的祭牲；“瘸腿”是普通读者易懂的现代用语。
- source_word: חֹלֶה
  choice: 有病
  rationale: 源词泛指患病；“有病”比“染病”或“患疾”更自然，也不过度限定病情。
- source_word: הַקְרִיבֵהוּ נָא
  choice: 请把这样的牲畜送给……吧
  rationale: 祈使式加 נָא 构成尖锐的反讽挑战；“请……吧”保留语气。“这样的牲畜”明确代词所回指的残损祭牲。
- source_word: פֶחָה
  choice: 省长
  rationale: 指波斯时期治理一省的官员；“省长”比泛称“官长”更具体，也符合历史行政背景。
- source_word: הֲיִרְצְךָ
  choice: 他会悦纳你
  rationale: רצה 可指喜悦、认可或接纳；宾语是第二人称，因此“悦纳你”保留对人的接纳之意及宗教语体。
- source_word: הֲיִשָּׂא פָנֶיךָ
  choice: 恩待你
  rationale: 字面是“抬起你的脸”，是表示给予优待或接纳的习语；正文译出自然含义，脚注说明字面形象。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”在现代简体中文圣经语境中直接标示四字神名；“万军之”保留 צְבָאוֹת 这一称号的传统、庄重表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 源文直接使用四字神名。中文正文以广为人知的“耶和华”音译呈现专名，而不以“主”替代；“雅威”是反映现代学界常见拟音的可行替代。
- issue: אֵין רָע 的话语力度
  choice: 译作责问：“这难道不是恶吗？”
  alternative: 较字面地译作陈述：“没有什么不对”
  rationale: 语法表面是“没有恶”，可能呈现祭司轻忽的态度，也可在语境中听作反讽责问。正文采用反问以自然传达先知的责备，脚注保留源文较直译的可能，避免掩盖张力。
- issue: רצה 所表达的接纳对象
  choice: 他会悦纳你
  alternative: 他会喜欢你吗／他会满意你吗
  rationale: 源文的宾语是“你”，焦点不只在礼物是否合意，也在献礼者本人是否获接纳；“悦纳”同时保留喜悦和接纳两层含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。重复“这难道不是恶吗”以保存源文平行结构和责备力度；“请……吧”刻意保留反讽语气。正文所有脚注标记均已对应列出。
