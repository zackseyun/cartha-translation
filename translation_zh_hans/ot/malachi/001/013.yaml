source:
  edition: WLC
  text: וַ/אֲמַרְתֶּם֩ הִנֵּ֨ה מַ/תְּלָאָ֜ה וְ/הִפַּחְתֶּ֣ם אוֹת֗/וֹ אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וַ/הֲבֵאתֶ֣ם גָּז֗וּל וְ/אֶת הַ/פִּסֵּ֨חַ֙ וְ/אֶת הַ֣/חוֹלֶ֔ה וַ/הֲבֵאתֶ֖ם אֶת הַ/מִּנְחָ֑ה הַ/אֶרְצֶ֥ה אוֹתָ֛/הּ מִ/יֶּדְ/כֶ֖ם אָמַ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/013.yaml
  text: And you say[a], ‘Look, what a weariness this is,’ and you snort at it, says Yahweh of hosts. And you bring what is stolen, and the lame, and the sick; thus you bring the offering[b]. Should I accept it from your hand? says Yahweh.
translation:
  language: zh_hans
  text: 你们说：“看哪，这多么令人厌烦！”又对它嗤之以鼻[a]。万军之雅威[b]说：你们把抢来的、瘸腿的和有病的带来，就这样献上供物。我会从你们手中悦纳它吗？雅威说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“又朝它轻蔑地喷气”。希伯来语动词描绘吹气或喷气的动作，在这里表示蔑视。
    reason: lexical_alternative
  - marker: b
    text: “万军之雅威”即统领众军、包括天上军队的雅威。
    reason: cultural_note
lexical_decisions:
- source_word: מַתְּלָאָה
  choice: 多么令人厌烦
  rationale: 该名词表示劳苦、疲乏或麻烦；在 הִנֵּה 引出的感叹中，是祭司嫌弃敬拜职责的抱怨。此译自然表达厌烦，同时不把含义强化为憎恨。
- source_word: וְהִפַּחְתֶּם אֹתוֹ
  choice: 又对它嗤之以鼻
  rationale: נפח 描绘吹气、喷气的动作，此处传达轻蔑。“嗤之以鼻”既保留身体动作的意象，也自然表达蔑视。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译神的立约之名；“万军”保留 צְבָאוֹת 所指众军、尤其天上军队的意象，而不将其概括为“全能者”。
- source_word: גָּזוּל
  choice: 抢来的
  rationale: 该被动分词指以抢夺或盗取方式得来的东西；“抢来的”简洁保留其不义来源及道德谴责。
- source_word: הַפִּסֵּחַ
  choice: 瘸腿的
  rationale: 指有跛足缺陷的祭牲；此译清楚、自然，并符合本节列举不合格祭牲的语境。
- source_word: הַחוֹלֶה
  choice: 有病的
  rationale: 该形式表示患病；“有病的”在现代汉语中自然，并与“瘸腿的”平行。
- source_word: הַמִּנְחָה
  choice: 供物
  rationale: מִנְחָה 可专指素祭，也可泛指呈献的礼物或供物。本节包含动物，故不宜窄化为“素祭”；“供物”保留较宽含义。
- source_word: הַאֶרְצֶה אֹתָהּ
  choice: 我会……悦纳它吗
  rationale: רצה 在献祭语境中指带着喜悦或认可而接纳；疑问形式在此构成责问。“悦纳”保留礼仪语境，“会……吗”不把原文擅自改成能力或义务问题。
- source_word: מִיֶּדְכֶם
  choice: 从你们手中
  rationale: 保留希伯来语“从某人手中接受”的具体习语，在现代汉语中也清楚可懂。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。音译“雅威”旨在呈现该立约之名，而非用“主”这一称号替代；“耶和华”是汉语传统中常见的另一音译。
- issue: צְבָאוֹת 在神圣称号中的含义
  choice: 万军
  alternative: 全能者
  rationale: “万军”保留原词与军队、众军尤其天军有关的具体意象；“全能者”虽表达神的大能，却会把称号解释性地抽象化。
- issue: 末句反问的情态
  choice: 我会从你们手中悦纳它吗？
  alternative: 我岂能从你们手中悦纳它呢？
  rationale: 原文疑问可表达强烈否定，但未明确诉诸神“不能”接纳。“会……吗”保留反问力度，也避免把问题改写为能力或道德可能性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“嗤之以鼻”传神地保留轻蔑喷气的动作意象；“供物”避免把 מִנְחָה 在有动物祭牲的上下文中误限为素祭。引语和神谕公式分句处理，以保持责备的节奏与清晰度。
