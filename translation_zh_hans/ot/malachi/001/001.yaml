  text: 'The burden of the word of the LORD to Israel by the hand of Malachi:'
translation:
  language: zh_hans
  text: 耶和华借玛拉基传给以色列的神谕[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神谕”直译为“重担”。这个希伯来词常用作先知信息的标题，也保留“负担、重担”的意象。
    reason: מַשָּׂא在此是先知书标题中的术语；正文以自然中文表达其“神谕／宣告”功能，脚注保留其字面意象及多义性。
lexical_decisions:
- source_word: מַשָּׂא
  choice: 重担
  rationale: 保留该词“负担、重担”的基本意象及先知领受信息之沉重感；脚注同时说明它在先知书标题中也可指“宣告”或“默示”，不把多义性静默化解。
- source_word: דְבַר יְהוָה
  choice: 耶和华……的话
  rationale: דְבַר译为“话”；以现代中文圣经读者熟悉的“耶和华”表达四字神名יהוה。
- source_word: אֶל יִשְׂרָאֵל
  choice: 论以色列
  rationale: 介词אֶל通常表示“向、对”；在本节宣告标题的语境中，“论以色列”自然表达信息所针对的对象，同时不排除“传给以色列”的理解。
- source_word: בְּיַד מַלְאָכִי
  choice: 藉玛拉基传来
  rationale: ביד直译“借……之手”，在此为表示媒介或代理的习语；译成“藉……传来”符合现代汉语，并保留玛拉基作为传话者的角色。
theological_decisions:
- issue: מַשָּׂא应译为“重担”还是“默示／宣告”
  choice: 正文译“重担”，脚注说明标题用法
  alternative: 默示；宣告；神谕
  rationale: “重担”保留希伯来词的鲜明意象，并与经审定的咨询文本一致；脚注承认该词已经形成先知宣告的术语用法，避免断言每处都必然强调心理或刑罚性的沉重。
- issue: אֶל יִשְׂרָאֵל所表达的是方向还是主题
  choice: 论以色列
  alternative: 向以色列；传给以色列
  rationale: “论以色列”在中文标题中较自然，也能表示信息针对以色列；但原介词本身容许“向以色列”的方向性，故不据此引申特定神学结论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留先知书标题的简洁感，以冒号引出后文；“藉”略具经文语体色彩，但仍为普通读者所能理解。
