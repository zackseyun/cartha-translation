revisions:
- from: 我却恨恶以扫[a]，使他的山岭[b]成为荒场，使他的产业成为旷野豺狼[c]出没之地。
  to: 我却恨恶以扫[a]，使他的山岭[b]成为荒凉之地，使他的基业归给旷野的豺狼[c]。
  rationale: 修订仅调整两个词语及末句句法：“荒凉之地”更充分表达荒废毁坏的状态；“基业”更贴近继承土地的含义；“归给旷野的豺狼”保留原文所表达的土地归属于荒野动物的审判结果。保留“我却恨恶以扫”的直接力度及全部脚注锚点和解释性替代译法。
