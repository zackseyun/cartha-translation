  yaml_path: translation/ot/malachi/001/003.yaml
  text: but Esau I hated[c][b][a], and I made his mountains a desolation and his inheritance for the jackals of the wilderness.
translation:
  language: zh_hans
  text: 我却恨恶以扫[a]，使他的山岭[b]成为荒凉之地，使他的基业归给旷野的豺狼[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弃绝”，或“少爱”。希伯来语动词通常意为“恨恶”；其他译法是从盟约中的取舍或偏爱来理解。
    reason: lexical_alternative
  - marker: b
    text: 或译“他的山地”。
    reason: lexical_alternative
  - marker: c
    text: 传统上也译作“旷野的龙”；这里的希伯来语很可能指豺狼。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: 我……恨恶
  rationale: 该动词在 Qal 词干中通常意为“恨恶”。正文保留其直接而强烈的表述，不以“弃绝”或“少爱”等解释性说法弱化原文。
- source_word: וָאָשִׂים
  choice: 使……成为
  rationale: שׂים 可表示“放置、设立、使成为”；与“荒场”连用时，译为“使……成为”自然地表达造成的结果。
- source_word: הָרָיו
  choice: 他的山岭
  rationale: הַר 的复数直指群山或山岭；“山岭”既保留复数地貌意象，也符合现代汉语表达。
- source_word: שְׁמָמָה
  choice: 荒场
  rationale: 该名词表示荒凉、废墟般的境况。“荒场”保留名词形式和先知话语的庄重语气。
- source_word: נַחֲלָתוֹ
  choice: 他的产业
  rationale: נַחֲלָה 指承受所得的土地或基业；“产业”保留土地承受与归属的含义，同时不作过度限定。
- source_word: לְתַנּוֹת מִדְבָּר
  choice: 成为旷野豺狼出没之地
  rationale: תַנּוֹת 按当前词汇研究很可能指豺狼；补出“出没之地”使“产业给旷野豺狼”这一简缩结构在汉语中自然清楚，并呈现土地荒废后为野兽占据的图景。
- source_word: וְאֶת
  choice: 却
  rationale: 连接词字面可作“和”，但此处承接上一节雅各与以扫的对比；“却”准确显明语境中的转折。
theological_decisions:
- issue: 上帝对以扫之“恨”的力度
  choice: 正文直译为“我却恨恶以扫”
  alternative: “我却弃绝以扫”或“我对以扫的爱较少”
  rationale: 希伯来语正文直接使用通常表示“恨恶”的动词。保留此措辞可维护原文的神学张力，不把盟约拣选、弃绝或相对偏爱的解释预先写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“恨恶”“荒场”“产业”保留原文的力度与土地意象；句式适度整合，使两项审判结果在汉语中平行清楚。
