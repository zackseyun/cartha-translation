  timestamp: '2026-07-14T08:17:26Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了与上一节雅各的对比、“恨恶”以扫，以及山岭和基业遭毁坏、归于旷野豺狼的审判图景。不过，“荒场”通常指荒废的场地或场院，较难充分表达 שְׁמָמָה 所指的荒凉、毁灭状态；“产业”在现代汉语中也容易联想到商业或财产，较“基业”少了一些承受之地的语义。
  naturalness: 原句整体通顺，但连续使用两个“使……成为”略显机械。“使他的基业归给旷野的豺狼”更简洁自然，也更贴近原文以“基业”与“豺狼”构成的归属关系。
  terminology: “恨恶”“以扫”“山岭”“旷野”“豺狼”均合宜。“基业”是此处 נַחֲלָתוֹ 更稳定的圣经汉语对应，也能避免将土地承受物误解为一般产业。“荒凉之地”恰当地表达 שְׁמָמָה。
