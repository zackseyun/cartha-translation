  text: וְ/עַתָּ֛ה חַלּוּ נָ֥א פְנֵי אֵ֖ל וִֽ/יחָנֵ֑/נוּ מִ/יֶּדְ/כֶם֙ הָ֣יְתָה זֹּ֔את הֲ/יִשָּׂ֤א מִ/כֶּם֙ פָּנִ֔ים אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/009.yaml
  text: And now[a], entreat God for favor, that he may be gracious to us. From your hand has this come[b]; will he show favor to any of you? says Yahweh of hosts.
translation:
  language: zh_hans
  text: 现在，你们要恳求上帝施恩[a]，求他恩待我们。这事出于你们的手[b]；他岂会悦纳你们中任何一人呢？万军之雅威说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“恳求上帝的面”；这是寻求上帝恩宠的惯用表达。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这事既出于你们的手，他岂会向你们中任何一人施恩呢？”
    reason: alternative_reading
lexical_decisions:
- source_word: חַלּוּ נָא פְנֵי אֵל
  choice: 要恳求上帝施恩
  rationale: 该短语直译为“求上帝的面”，是寻求恩宠的惯用语。译为“恳求上帝施恩”既体现祈求的迫切，也符合现代汉语表达。
- source_word: וִיחָנֵּנוּ
  choice: 使他恩待我们
  rationale: חנן表示“施恩、恩待”。此处未完成式承接命令语气，可表达目的或结果；“使他恩待我们”保留这种关系而不将结果说成必然。
- source_word: מִיֶּדְכֶם הָיְתָה זֹּאת
  choice: 这事出于你们的手
  rationale: 保留希伯来语“从你们的手而来”的来源及责任意象，指眼前受责备的献祭行为由祭司造成。
- source_word: הֲיִשָּׂא מִכֶּם פָּנִים
  choice: 他岂会悦纳你们中任何一人呢
  rationale: נשׂא פנים字面为“抬起脸”，此处表示给予恩宠或接纳。反问语境中“悦纳”能自然连接献祭与敬拜的背景；“任何一人”表达מִכֶּם的群体中个体含义。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”呈现四字神名，以“万军”保留צְבָאוֹת作为神圣称号的传统广义表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”是现代普通中文读者最熟悉且庄重的专名形式。
- issue: הֲיִשָּׂא מִכֶּם פָּנִים 的语义
  choice: 他岂会悦纳你们中任何一人呢
  alternative: 他岂会向你们任何一人施恩呢
  rationale: 上下文责备祭司献上有残疾的祭物，因此“悦纳”突出蒙神接纳的语境，同时不将该惯用语解释为关于神是否偏待人的抽象教义。
- issue: וִיחָנֵּנוּ 的目的与结果张力
  choice: 使他恩待我们
  alternative: 他就会恩待我们
  rationale: 原文形式可承接命令而表达目的或结果；采用“使”避免断言祭司如此祈求后必然得到恩待，保留上下文中的讽刺和张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“岂会”保留先知责问的修辞力度；句末“这是……说的”清楚标示神谕公式。
