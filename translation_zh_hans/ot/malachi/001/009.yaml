- from: 现在，你们要恳求上帝施恩[a]，使他恩待我们。这事出于你们的手[b]；他岂会悦纳你们中任何一人呢？这是万军之耶和华说的。
  to: 现在，你们要恳求上帝施恩[a]，求他恩待我们。这事出于你们的手[b]；他岂会悦纳你们中任何一人呢？万军之雅威说。
  rationale: 修订“使他恩待我们”为“求他恩待我们”，避免汉语使役歧义，并准确保留原文祈求性的句法关系。神名依英文审校轨迹统一为“雅威”，末句改为更自然的神谕公式。脚注a补足字面表达的惯用义；脚注b以“施恩”呈现נשא פנים在本处的另一自然译法。
