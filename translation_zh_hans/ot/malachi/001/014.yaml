- from: 那行欺诈的，牲畜群中明明有公畜，许了愿，却把有残疾的献给主，他必受咒诅！因为我是大君王；万军之雅威说：“我的名在列国中令人敬畏[b]。”[a]
  to: 那行欺诈的人，在自己的畜群中有公畜，却许愿，又把有残疾的祭牲献给主，他必受咒诅！“因为我是大君王，”万军之雅威[a]说，“我的名在列国中令人敬畏[b]。”
  rationale: 修订了宣告公式、引号和脚注锚点，使其对应原文语序与范围；同时以更自然的“在自己的畜群中有公畜”替换较生硬且强化语气的表达，并补出“祭牲”以明确“有残疾的”的所指。保留“许愿”的未指明对象，不采纳将其明确为许愿献上那只公畜的解释性补足。
