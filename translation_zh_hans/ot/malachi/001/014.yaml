source:
  edition: WLC
  text: וְ/אָר֣וּר נוֹכֵ֗ל וְ/יֵ֤שׁ בְּ/עֶדְר/וֹ֙ זָכָ֔ר וְ/נֹדֵ֛ר וְ/זֹבֵ֥חַ מָשְׁחָ֖ת לַֽ/אדֹנָ֑/י כִּי֩ מֶ֨לֶךְ גָּד֜וֹל אָ֗נִי אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/שְׁמִ֖/י נוֹרָ֥א בַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/014.yaml
  text: But cursed is the deceiver who has a male in his flock[a], and vows it, but sacrifices a blemished animal to the Lord. For I am a great King, says Yahweh of Armies[b], and my name is feared among the nations.
translation:
  language: zh_hans
  text: 那行欺诈的人，在自己的畜群中有公畜，却许愿，又把有残疾的祭牲献给主，他必受咒诅！“因为我是大君王，”万军之雅威[a]说，“我的名在列国中令人敬畏[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之雅威”也可译作“众军之雅威”；这里的“军”可包括天上的众军。
    reason: lexical_alternative
  - marker: b
    text: “令人敬畏”也可译作“为人所惧怕”；原文兼有惧怕、震慑和崇敬之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 这是宣告神审判的谓语；“必受咒诅”在现代汉语中清楚自然，也保留了原文的严厉语气。
- source_word: נוֹכֵל
  choice: 那行欺诈的
  rationale: 指在敬拜中弄虚作假、扣下合宜祭物的人；“行欺诈”比口语化的“骗子”更符合庄重语体。
- source_word: יֵשׁ בְּעֶדְרוֹ זָכָר
  choice: 牲畜群中明明有公畜
  rationale: עֵדֶר可指群养的祭牲，不必限定为羊；“明明”自然传达此人已有合宜公畜却故意另献残次祭物的罪责。
- source_word: וְנֹדֵר
  choice: 许了愿
  rationale: 原文没有明说所许的是哪一只祭牲，因此不在正文中补出“把它许给神”，以保留原文的简约。
- source_word: וְזֹבֵחַ
  choice: 却把……献给
  rationale: 连接词字面为“并且”，但上下文形成明显转折：许愿之后，实际献上的却是残次祭物。
- source_word: מָשְׁחָת
  choice: 有残疾的
  rationale: 在献祭语境中指损坏、有缺陷、不合献祭资格的牲畜；汉语中省略重复的“牲畜”仍清楚自然。
- source_word: לַאדֹנָי
  choice: 献给主
  rationale: אֲדֹנָי在此是对神的尊称，强调他是祭物所归属的主宰。
- source_word: כִּי מֶלֶךְ גָּדוֹל אָנִי
  choice: 因为我是大君王
  rationale: 保留כִּי的因果关系及神以君王身份所作的自我宣告。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译神的立约之名；“万军”保留צְבָאוֹת所表达的天上众军及一切军旅都受他统辖的君王意象。
- source_word: וּשְׁמִי
  choice: 我的名
  rationale: 直译并保留希伯来语“名”所包含的身份、名声与启示意义。
- source_word: נוֹרָא
  choice: 令人敬畏
  rationale: 兼顾该词引发惧怕、震慑与崇敬的语义范围，避免只译成单纯害怕或较弱的尊敬。
- source_word: בַגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם在先知书语境中指以色列以外的各国各族；“列国”庄重而明确。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近通常学术重构读音的现代汉语音译，而不以“主”代替神名。
- issue: 称号צְבָאוֹת的译法
  choice: 万军
  alternative: 众军
  rationale: “万军”是简洁、庄重且易懂的汉语表达，保留神统率天上众军并拥有至高王权的含义，不将其缩窄为人间军队。
- issue: נוֹרָא所含惧怕与崇敬的张力
  choice: 令人敬畏
  alternative: 为人所惧怕
  rationale: 该词既可强调可畏，也可指引发敬畏；“令人敬畏”保留两方面，不把列国对神之名的反应解释为纯粹恐惧或单纯尊崇。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“明明……却……”呈现原文所隐含的蓄意欺诈与强烈反差；保留祭祀语境，但避免使用普通读者难懂的礼仪术语。
