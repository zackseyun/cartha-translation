  terminology: “雅威”“万军”“主”“列国”“令人敬畏”均适合庄重的现代汉语圣经语体；“万军之雅威”保留神名及צְבָאוֹת的复数军旅意象。脚注a应紧随其所说明的“万军之雅威”，脚注b紧随“令人敬畏”。
