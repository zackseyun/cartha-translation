source:
  edition: WLC
  text: כִּ֣י מִ/מִּזְרַח שֶׁ֜מֶשׁ וְ/עַד מְבוֹא֗/וֹ גָּד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם וּ/בְ/כָל מָק֗וֹם מֻקְטָ֥ר מֻגָּ֛שׁ לִ/שְׁמִ֖/י וּ/מִנְחָ֣ה טְהוֹרָ֑ה כִּֽי גָד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/011.yaml
  text: For from the rising of the sun to its setting[a], my name is great among the nations, and in every place incense is offered, and a pure offering is brought, to my name; for my name is great among the nations[d][c][b], says Yahweh of hosts.
translation:
  language: zh_hans
  text: 因为从日出之地到日落之处[a]，我的名在列国中[b]为大；在各处，人们焚香，并向我的名献上洁净的供物[d]。因为我的名在列国中为大[c]；万军之耶和华说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从东方到西方”；直译是“从太阳升起之处到它落下之处”。
    reason: lexical_alternative
  - marker: b
    text: “列国”也可译作“外邦人”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文可理解为描述当下事实、先知性的现在，或将来必定发生的事；正文没有明确限定时间。
    reason: alternative_reading
  - marker: d
    text: “供物”译自希伯来语 minchah；此词可泛指献上的礼物或供物，在献祭语境中常特指素祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的责备并说明理由；保留其因果、解释作用。
- source_word: מִמִּזְרַח שֶׁמֶשׁ וְעַד מְבוֹאוֹ
  choice: 从日出之地到日落之处
  rationale: 贴近希伯来语意象，同时以自然中文表达遍及全地的范围。
- source_word: גָּדוֹל שְׁמִי
  choice: 我的名被尊为大
  rationale: “名”按原文保留；补出“被尊为”以自然中文传达名声崇高、受尊崇之意，又不把它简化为纯粹的知名度。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: “列国”符合先知书语域，范围比“外邦人”更中性，也避免引入新约时代色彩。
- source_word: מֻקְטָר
  choice: 献上馨香
  rationale: 该被动分词可指使祭物冒烟或焚香；“馨香”保留祭祀语境，却不武断限定只能是香料。
- source_word: מֻגָּשׁ לִשְׁמִי
  choice: 向我的名献上
  rationale: 保留献祭语境以及原文独特的“向我的名”表达，不改写成单纯的“向我”。
- source_word: מִנְחָה טְהוֹרָה
  choice: 洁净的供物
  rationale: מִנְחָה可泛指礼物或供物，在献祭语境中也常指素祭；采用较宽泛的“供物”，避免过度限定。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 按专名音译יהוה，并直译传统称号“万军”，保留其天军与统御色彩。
theological_decisions:
- issue: 本节是在描述当下事实、先知性的现在，还是未来的确定事实
  choice: 使用“被尊为大”“献上”等未明确标示时态的中文表述
  alternative: 译作“必被尊为大”“必有人献上”，明确处理为未来
  rationale: 希伯来文采用无系词句和分词结构，本身没有明确未来标记；中文不添加“必”或“将”，以保留时间指向的开放性。
- issue: 列国中的献祭用语应按字面还是按隐喻解释
  choice: 保留“馨香”和“供物”的祭祀语言
  alternative: 解释为祷告、赞美或属灵敬拜
  rationale: 原文明确使用祭祀词汇；直译其意象，不预先规定这敬拜如何实现。
- issue: “我的名为大”的含义
  choice: 译为“我的名被尊为大”
  alternative: 译为静态的“我的名是大的”或解释性的“我大受尊崇”
  rationale: 既保留“名”这一重要表达，也使现代中文清楚呈现尊荣含义，而不把“名”直接消解为“我”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“列国”“供物”“万军之耶和华”保留先知书与敬拜语域；句法略作调整，使两个被动分词在中文中清楚并列。
