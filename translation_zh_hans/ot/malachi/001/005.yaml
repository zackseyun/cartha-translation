source:
  edition: WLC
  text: וְ/עֵינֵי/כֶ֖ם תִּרְאֶ֑ינָה וְ/אַתֶּ֤ם תֹּֽאמְרוּ֙ יִגְדַּ֣ל יְהוָ֔ה מֵ/עַ֖ל לִ/גְב֥וּל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/005.yaml
  text: Your own eyes will see[a], and you yourselves will say, “Great is Yahweh beyond the border of Israel.”
translation:
  language: zh_hans
  text: 你们必亲眼看见；你们自己必说：“耶和华在以色列疆界以外为大！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华在以色列疆界以外是伟大的。”希伯来文既可理解为赞叹，也可理解为陈述。
    reason: 保留יִגְדַּל יְהוָה在语气上的真实歧义。
lexical_decisions:
- source_word: וְעֵינֵיכֶם תִּרְאֶינָה
  choice: 你们必亲眼看见
  rationale: 原文直译为“你们的眼睛必看见”。现代汉语用“亲眼看见”自然保留直接目睹的具体意象，并体现所属关系所带的强调；不补出原文没有明说的宾语“这事”。
- source_word: וְאַתֶּם
  choice: 你们自己也
  rationale: 独立人称代词 אַתֶּם 带有强调意味，“你们自己”在现代汉语中明确保留这一强调；וְ 在此顺接前句，译作“也”。
- source_word: תֹּאמְרוּ
  choice: 必说
  rationale: 未完成式在语境中指向将来的反应，“必说”既简洁，又符合预告语气。
- source_word: יִגְדַּל
  choice: 为大
  rationale: 该形式可表达宣告或赞叹，也可能带有意愿色彩。“为大”保留“显为伟大／被尊为大”的语义空间，并以脚注说明陈述式理解，避免只落实为单一语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式直接呈现四字神名，而不以“主”这一称号代替。
- source_word: מֵעַל לִגְבוּל יִשְׂרָאֵל
  choice: 在以色列疆界以外
  rationale: מֵעַל 与 גבול 连用，在这里表达越过或超出以色列边界的范围；“疆界以外”既保留空间意象，也自然表达耶和华的伟大不限于以色列境内。
theological_decisions:
- issue: 如何呈现神名 יְהוָה
  choice: 耶和华
  alternative: 主；雅威
  rationale: 原文使用专名而非称号，因此正文保留神名。采用中文广为人知的“耶和华”，便于普通现代读者识别，同时不把专名改成“主”。
- issue: יִגְדַּל יְהוָה 的语气
  choice: “耶和华……为大！”并以脚注保留陈述式理解
  alternative: “耶和华……是伟大的。”；“愿耶和华……被尊为大。”
  rationale: 希伯来文可作为赞叹性的称颂，也可作为对耶和华伟大的陈述；动词形式还容许意愿色彩。正文采用简洁的赞叹式，脚注明确保留陈述式可能，不把经文限定为祈愿或纯粹命题。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“亲眼看见”“你们自己”自然传达原文的双重强调；“疆界以外”保留地理意象。正文不补出“这事”，因为希伯来文没有明示宾语。
