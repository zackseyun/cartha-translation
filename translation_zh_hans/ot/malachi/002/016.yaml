  to: “因为他恨恶休妻[a]，”以色列的上帝耶和华说；“又有人以暴行遮盖自己的衣服，”万军之耶和华说。“所以，你们要在自己的灵里谨慎自守[b]，不可背信。”
  rationale: 修订恢复 שָׂנֵא 的第三人称“他恨恶”，不把它改成“我恨恶”。第二分句保留“以暴行遮盖自己的衣服”的比喻，并仅以“有人”使中文句子可读，不补入“也是我所恨恶的”。神名称号调整为自然的现代庄重中文；末句以“在自己的灵里谨慎自守”保留原文的内在警戒及反身意味。
