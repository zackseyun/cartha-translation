id: MAL.2.16
reference: Malachi 2:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי שָׂנֵ֣א שַׁלַּ֗ח אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כִסָּ֤ה חָמָס֙ עַל לְבוּשׁ֔/וֹ אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/נִשְׁמַרְתֶּ֥ם בְּ/רוּחֲ/כֶ֖ם וְ/לֹ֥א תִבְגֹּֽדוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/016.yaml
  text: For he hates divorce[a], says Yahweh, the God of Israel, and the one who covers his garment with violence, says Yahweh of Armies. So guard yourselves in your spirit[b], and do not act faithlessly.
translation:
  language: zh_hans
  text: “因为他恨恶休妻[a]，”以色列的上帝耶和华说；“又有人以暴行遮盖自己的衣服，”万军之耶和华说。“所以，你们要在自己的灵里谨慎自守[b]，不可背信。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译法：“‘我恨恶休妻，’以色列的上帝耶和华说。”这里的希伯来文本较难，可有不止一种理解。
    reason: alternative_reading
  - marker: b
    text: 或译“要谨守自己的心志”或“要在自己的灵里谨慎”。“灵”指人内在的心志、态度。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的警告并说明理由，符合本节论证关系。
- source_word: שָׂנֵא שַׁלַּח
  choice: 那休妻的，是我所恨恶的
  rationale: שָׂנֵא 按马所拉文本为第三人称阳性单数“他恨恶”，而 שַׁלַּח 在婚姻语境中指休妻。希伯来语句法极其简略；此译将隐含主语理解为耶和华，并以宾语前置保留第三人称形式，避免径直改成传统的“我恨恶休妻”。
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 耶和华以色列的上帝
  rationale: 准确保留神名与称号，使用现代中文常见而庄重的表达。
- source_word: וְכִסָּה חָמָס עַל לְבוּשׁוֹ
  choice: 那以暴行遮盖自己衣服的，也是我所恨恶的
  rationale: 保留“暴行”与“衣服”的原文意象；补出与前半句平行的判断语，使压缩的希伯来语在中文中可读，同时不具体解释衣服隐喻。
- source_word: חָמָס
  choice: 暴行
  rationale: 兼具暴力和严重不义的意味，较“暴力”更适合描述人的恶行。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 这是该神圣称号在庄重现代中文中的成熟表达，也保留其统帅天上众军的力量感。
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  choice: 所以，你们要谨守自己的心灵
  rationale: נשׁמר 在此有自我警醒、防守之意；רוּחַ 指人的内在心志或灵。“心灵”兼顾可懂度与内在道德焦点。
- source_word: וְלֹא תִבְגֹּדוּ
  choice: 不可背信
  rationale: בגד 指在盟约关系中行诡诈、失信；“背信”简洁表达婚约中的不忠与背叛。
theological_decisions:
- issue: שָׂנֵא 的第三人称形式与传统“我恨恶休妻”之间的张力
  choice: 正文译作“那休妻的，是我所恨恶的”，保留第三人称形式，并按语境把耶和华理解为恨恶者。
  alternative: “因为我恨恶休妻，”耶和华以色列的上帝说。
  rationale: 马所拉文本的 שָׂנֵא 在形式上是第三人称阳性单数，并非第一人称。译文不应无提示地改写为传统读法；同时，希伯来语压缩且歧义真实存在，故在脚注中列出传统译法。
- issue: “以暴行遮盖衣服”一语的句法和隐喻
  choice: 保留衣服被暴行遮盖的意象，并将其理解为耶和华所恨恶的另一类人。
  alternative: “他以暴行遮盖自己的衣服”或“暴行遮盖了他的衣服”。
  rationale: 原文句法紧缩，既可能延续前句主语，也可能构成平行描述。正文维持隐喻及平行性，不把衣服明确解释为婚姻、身份或罪污的象征。
translation_notes:
  register: 采用现代、庄重、可诵读的标准普通话。正文保留原文的两处核心张力：שָׂנֵא 的第三人称形式，以及“暴行遮盖衣服”的未定隐喻；用引号和补足判断语提高中文可读性，但不引入特定宗派解释。
