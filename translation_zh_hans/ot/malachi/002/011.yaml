id: MAL.2.11
reference: Malachi 2:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּגְדָ֣ה יְהוּדָ֔ה וְ/תוֹעֵבָ֛ה נֶעֶשְׂתָ֥ה בְ/יִשְׂרָאֵ֖ל וּ/בִ/ירֽוּשָׁלִָ֑ם כִּ֣י חִלֵּ֣ל יְהוּדָ֗ה קֹ֤דֶשׁ יְהוָה֙ אֲשֶׁ֣ר אָהֵ֔ב וּ/בָעַ֖ל בַּת אֵ֥ל נֵכָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/011.yaml
  text: Judah has acted treacherously[a], and an abomination has been committed in Israel and in Jerusalem, for Judah has profaned the sanctuary of Yahweh, which he loves[b], and has married the daughter of a foreign god.
translation:
  language: zh_hans
  text: 犹大背信弃义[a]；在以色列和耶路撒冷，发生了可憎的事。因为犹大亵渎了雅威所爱的圣物[b]，又娶了外邦神的女儿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背信弃义”也可译作“不忠”或“行事诡诈”；这里带有违背盟约关系的意味。
    reason: lexical_alternative
  - marker: b
    text: “圣物”原文也可理解为“雅威的圣所”“雅威的圣洁”或“雅威的圣民”。“所爱的”的主语也可能是犹大。
    reason: alternative_reading
  - marker: c
    text: 直译“外邦神的女儿”，可能指归属或委身于外邦神明崇拜的女子。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּגְדָה
  choice: 背信弃义
  rationale: 表达בגד在盟约语境中不忠、背叛的道德分量，同时不擅自补明背叛的对象。
- source_word: תוֹעֵבָה
  choice: 可憎之事
  rationale: 保留该词在先知话语中强烈的宗教与道德谴责意味，且符合现代汉语表达。
- source_word: נֶעֶשְׂתָה
  choice: 已经有人做了
  rationale: 希伯来语为被动式；汉语用不明确行为主体的表达，既自然，也不把行为人限定为犹大之外的人。
- source_word: חִלֵּל
  choice: 亵渎了
  rationale: 准确表达使圣物失去神圣尊荣、将其俗化的含义。
- source_word: קֹדֶשׁ יְהוָה
  choice: 雅威的圣物
  rationale: קֹדֶשׁ可指神圣之物、圣所、圣洁或圣民；“圣物”较贴近其名词形式，又以脚注保留具体所指的歧义。
- source_word: אֲשֶׁר אָהֵב
  choice: 所爱的
  rationale: 关系从句的主语在希伯来文中未明说；正文按最自然的理解以雅威为主语，同时在脚注说明也可理解为犹大所爱。
- source_word: וּבָעַל
  choice: 又娶了
  rationale: בעל以女子为宾语时通常指娶妻或成为其丈夫。
- source_word: בַּת אֵל נֵכָר
  choice: 外邦神的女儿
  rationale: 保留原文直译及其宗教性锋芒，不把问题简化为族裔意义上的外邦女子。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现神的专名，而不以称号替代。
theological_decisions:
- issue: קֹדֶשׁ יְהוָה的具体所指
  choice: 正文译为“雅威的圣物”，脚注保留歧义
  alternative: 雅威的圣所；雅威的圣洁；雅威的圣民
  rationale: 原文没有明确限定所指，不宜在正文中武断地收窄为圣殿、群体或抽象的圣洁。
- issue: אֲשֶׁר אָהֵב中“爱”的主语
  choice: 正文按雅威为主语译作“雅威所爱的”
  alternative: 犹大所爱的
  rationale: 希伯来文关系从句省略主语，语法上存在张力；雅威为主语较自然，但脚注保留另一可能。
- issue: “外邦神的女儿”的意义
  choice: 保留原文的宗教性隐喻
  alternative: 信奉外邦神的女子；外邦女子
  rationale: 直译能保留针对异教崇拜的先知性指控，避免将经文误解为单纯的族裔排斥。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“可憎之事”“亵渎”“圣物”保留先知宣告的宗教语域；句式适度拆分，便于普通读者理解。
