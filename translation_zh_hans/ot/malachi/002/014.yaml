id: MAL.2.14
reference: Malachi 2:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֖ם עַל מָ֑ה עַ֡ל כִּי יְהוָה֩ הֵעִ֨יד בֵּינְ/ךָ֜ וּ/בֵ֣ין אֵ֣שֶׁת נְעוּרֶ֗י/ךָ אֲשֶׁ֤ר אַתָּה֙ בָּגַ֣דְתָּה בָּ֔/הּ וְ/הִ֥יא חֲבֶרְתְּ/ךָ֖ וְ/אֵ֥שֶׁת בְּרִיתֶֽ/ךָ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/014.yaml
  text: But you say[a], “Why?” Because Yahweh has been a witness between you and the wife of your youth, to whom you have been unfaithful[b], though she is your companion and your wife by covenant.
translation:
  language: zh_hans
  text: 你们却说：“为什么？”因为耶和华在你和你年轻时所娶的妻子之间作证；你竟背信弃义地待她[a]，尽管她是你的伴侣，是与你立约的妻子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你背叛了她”或“你对她不忠。”希伯来语动词可指奸诈、背叛或背信，特别常见于盟约关系的语境。
    reason: lexical_alternative
  - marker: b
    text: 直译：“你盟约的妻子。”也可译：“你的盟约之妻。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: 你们却说
  rationale: וַ在此引出百姓对前文指控的反问，按语境译作“却”能自然表达其抗辩语气。
- source_word: עַל־מָה
  choice: 为什么？
  rationale: 这是询问缘由的惯用语，译作“为什么”简洁、自然，并保留反问力度。
- source_word: עַל כִּי
  choice: 因为
  rationale: 此短语直接回答前面的“为什么”，现代汉语用“因为”最为顺畅。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神圣名字音译，以区别于作为称号的“主”。
- source_word: הֵעִיד
  choice: 作证
  rationale: 该使役形动词在此具有司法和盟约语境中的见证含义；“作证”准确而简明。
- source_word: בֵּינְךָ וּבֵין
  choice: 在你和……之间
  rationale: 保留希伯来语表示双方关系的标准结构，说明耶和华是婚姻双方之间的见证者。
- source_word: אֵשֶׁת נְעוּרֶיךָ
  choice: 你年轻时所娶的妻子
  rationale: 将希伯来语习语自然展开，清楚表达她是男子年轻时迎娶、长久相伴的妻子。
- source_word: אֲשֶׁר אַתָּה בָּגַדְתָּה בָּהּ
  choice: 你竟背信弃义地待她
  rationale: בגד表示背叛、奸诈或不忠，尤其带有违背盟约的意味；“背信弃义”保留其强烈的道德及盟约分量，“竟”体现上下文的反差。
- source_word: וְהִיא
  choice: 尽管她是
  rationale: 此处连接词在论证中带让步意味：丈夫如此背信，她却是其伴侣和立约之妻。“尽管”清楚呈现这一张力。
- source_word: חֲבֶרְתְּךָ
  choice: 你的伴侣
  rationale: 该词指亲密结合、共同生活的人；“伴侣”符合婚姻语境，且是自然的现代汉语。
- source_word: אֵשֶׁת בְּרִיתֶךָ
  choice: 与你立约的妻子
  rationale: 这一译法明确保留婚姻的盟约性质，同时比生硬的“你盟约的妻子”更符合现代汉语。
theological_decisions:
- issue: 婚姻的盟约性质
  choice: 明确译出耶和华在婚姻双方之间作证，并称女子为“与你立约的妻子”。
  alternative: 弱化为一般人际关系中的不忠，不明确表达盟约含义。
  rationale: בגד与בְּרִית共同赋予本节鲜明的盟约和司法分量；译文应保留这一点，却不加入经文本身未说明的后期教义框架。
- issue: 丈夫行为的性质
  choice: 译作“背信弃义地待她”。
  alternative: 译作较弱的“对她不忠”。
  rationale: בגד不只可能指婚姻不忠，也可泛指奸诈、背叛和失信。选择较宽且有力度的表达，以免把原文限定为某一种具体行为。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“你们”承接群体发问，随后按希伯来语单数阳性形式用“你”直指群体中的每个丈夫。保留“作证”“背信弃义”“立约”等司法及盟约色彩，同时避免把בגד过度限定为通奸。
