  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הוֹגַעְתֶּ֤ם יְהוָה֙ בְּ/דִבְרֵי/כֶ֔ם וַ/אֲמַרְתֶּ֖ם בַּ/מָּ֣ה הוֹגָ֑עְנוּ בֶּ/אֱמָרְ/כֶ֗ם כָּל עֹ֨שֵׂה רָ֜ע ט֣וֹב בְּ/עֵינֵ֣י יְהוָ֗ה וּ/בָ/הֶם֙ ה֣וּא חָפֵ֔ץ א֥וֹ אַיֵּ֖ה אֱלֹהֵ֥י הַ/מִּשְׁפָּֽט־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/017.yaml
  text: You have wearied Yahweh with your words. Yet you say[a], “How have we wearied him?” By saying, “Everyone who does evil is good in the eyes of Yahweh, and he delights in them,” or, “Where is the God of justice?”
translation:
  language: zh_hans
  text: 你们用你们的话使雅威厌烦。你们却说：“我们怎样使他厌烦呢？”就是因你们说：“凡作恶的，在雅威眼中都是好的；他也喜爱他们。”或说：“施行公正[a]的上帝在哪里呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公正”或译“审判”。
    reason: 希伯来语 מִשְׁפָּט 可指公正、裁决或审判。本节语境强调上帝公正的治理；“审判”仍是有效的词义替代。
lexical_decisions:
- source_word: הוֹגַעְתֶּם / הוֹגָעְנוּ
  choice: 使……厌倦
  rationale: 使役形表达“使疲倦、使厌倦”。此译保留把人的言语说成令上帝厌倦的鲜明拟人表达，也符合现代汉语习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留这是以色列上帝之专名，而不以称号代替。
- source_word: בְּדִבְרֵיכֶם
  choice: 用自己的话
  rationale: 介词 ב 在此表示手段；“用自己的话”自然地说明他们凭言语使雅威厌倦。
- source_word: בַּמָּה
  choice: 怎么
  rationale: 在反问中表示“在哪一点上、以什么方式”；“怎么”简洁自然。
- source_word: בֶּאֱמָרְכֶם
  choice: 这是因为你们说
  rationale: 介词加不定式结构解释他们如何使雅威厌倦；此译清楚传达解释和原因关系。
- source_word: כָּל עֹשֵׂה רָע
  choice: 凡作恶的
  rationale: 保留分配性的“每一个/凡”及分词所表达的持续身份或行为，措辞简洁庄重。
- source_word: טוֹב
  choice: 都是好的
  rationale: 直译形容词“好”，不改为“蒙悦纳”等解释性表达，以保留百姓话语中的讽刺和指控。
- source_word: בְּעֵינֵי יְהוָה
  choice: 在雅威眼中
  rationale: 保留希伯来语“在……眼中”的评价性意象，现代读者也能自然理解。
- source_word: וּבָהֶם הוּא חָפֵץ
  choice: 他喜爱这些人
  rationale: חפץ 表示喜悦、乐意或喜爱；“这些人”明确复数代词所指的是前文作恶者。
- source_word: אוֹ
  choice: 又说
  rationale: אוֹ 可引出另一种说法。汉语用“又说”自然连接同一群人另一项带有质疑意味的言论，同时不把两句误合为一句。
- source_word: אַיֵּה
  choice: 在哪里
  rationale: 保留直接质问上帝似乎缺席的尖锐语气。
- source_word: אֱלֹהֵי הַמִּשְׁפָּט
  choice: 主持正义的上帝
  rationale: מִשְׁפָּט 在这里关乎公正的判断和道德秩序。“主持正义的上帝”比生硬的“正义之上帝”更自然，并表达属格结构所指的上帝施行公正。
theological_decisions:
- issue: 以“厌倦”描述上帝
  choice: 保留“使雅威厌倦了”的拟人措辞
  alternative: 使雅威生气了；给雅威增添了重担
  rationale: 原文明确使用“使疲倦”的词。保留这一表达，维持先知责备的力度及经文对上帝反应的类比性描述，不将其抽象化。
- issue: מִשְׁפָּט 的语义
  choice: 正义
  alternative: 审判
  rationale: 此处的质疑涉及上帝为何似乎容许恶人，以及他的公正治理何在。“正义”较能涵盖这一道德秩序层面；脚注保留“审判”的可能译法。
- issue: אוֹ 所连接的两种抱怨
  choice: 视为另一种相关说法，以“又说”引出
  alternative: 或说
  rationale: 原文既可能列举两种替代性的愤世言论，也可能把后一句作为同一抱怨的另一表述。“又说”在汉语中保留并列关系而不强行断定严格的逻辑互斥。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威”保留神名；“使……厌倦”“在……眼中”保留原文鲜明意象。“主持正义的上帝”避免生硬欧化，同时保留末句的神学张力。脚注标记置于实际存在词义差异的“正义”之后。
