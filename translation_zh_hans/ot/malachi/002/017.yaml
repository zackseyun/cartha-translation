  to: 你们用你们的话使雅威厌烦。你们却说：“我们怎样使他厌烦呢？”就是因你们说：“凡作恶的，在雅威眼中都是好的；他也喜爱他们。”或说：“施行公正[a]的上帝在哪里呢？”
  rationale: 修订保留原文的神名、拟人性责备、反问和道德讽刺；将“又说”改为“或说”以对应或（אוֹ）的替代性连接，并略微调整末句，使中文自然且不将“正义之上帝”的属格表达过度释义。脚注锚点仍紧邻存在词义分歧的“公正”。
