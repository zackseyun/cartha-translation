source:
  edition: WLC
  text: אִם לֹ֣א תִשְׁמְע֡וּ וְ/אִם לֹא֩ תָשִׂ֨ימוּ עַל לֵ֜ב לָ/תֵ֧ת כָּב֣וֹד לִ/שְׁמִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וְ/שִׁלַּחְתִּ֤י בָ/כֶם֙ אֶת הַ/מְּאֵרָ֔ה וְ/אָרוֹתִ֖י אֶת בִּרְכֽוֹתֵי/כֶ֑ם וְ/גַם֙ אָרוֹתִ֔י/הָ כִּ֥י אֵינְ/כֶ֖ם שָׂמִ֥ים עַל לֵֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/002.yaml
  text: If you will not listen[a], and if you will not take it to heart to give glory to my name, says Yahweh of Armies, then I will send the curse among you, and I will curse your blessings; indeed, I have already cursed them[b], because you are not taking it to heart.
translation:
  language: zh_hans
  text: 你们若不听，也不把将荣耀归给我的名这事放在心上——万军之耶和华说——我就要使咒诅临到你们，咒诅你们的福分；其实，我已经咒诅了这些福分[a]，因为你们没有把这事放在心上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文也可理解为：“我也必咒诅它们”；其中代词为阴性单数，直译可作“我已经咒诅了它”。
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמְעוּ
  choice: 听
  rationale: 保留“听、听从”的基本语义；在盟约警告的语境中自然含有留意并顺从之意，而不直接把它窄化为“服从”。
- source_word: תָשִׂימוּ עַל לֵב
  choice: 把这事放在心上
  rationale: 这是自然的现代汉语表达，传达认真看待、留心并内化的希伯来语习语含义；末句重复同一译法，以保留原文的修辞呼应。
- source_word: לָתֵת כָּבוֹד לִשְׁמִי
  choice: 将荣耀归给我的名
  rationale: כָּבוֹד 可指荣耀或尊荣；“将荣耀归给”符合庄重的先知性语体，并保留“我的名”所指向的上帝之身份与声誉。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”呈现四字神名，以现代中文圣经语境中清楚而庄重的“万军之”表达 צְבָאוֹת。
- source_word: וְשִׁלַּחְתִּי בָכֶם אֶת הַמְּאֵרָה
  choice: 我就要使咒诅临到你们
  rationale: 自然表达“差遣咒诅进入你们当中／临到你们”的意思，同时保留特定盟约性审判的力度。
- source_word: וְאָרוֹתִי אֶת בִּרְכוֹתֵיכֶם
  choice: 咒诅你们的福分
  rationale: 直译其宾语“你们的福分”，不擅自判定这是他们所得的福分、祭司所宣告的祝福，还是两者兼有。
- source_word: וְגַם אָרוֹתִיהָ
  choice: 其实，我已经咒诅了这些福分
  rationale: 把完成式理解为审判已经开始；用“这些福分”自然承接前面的复数名词，但脚注保留动词时态及阴性单数后缀的歧义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”在现代简体中文读者中辨识度高，并保持其为专名，而不是改译为称号“主”。
- issue: 末一 אָרוֹתִיהָ 的时态与代词所指
  choice: 我已经咒诅了这些福分
  alternative: 我也必咒诅它们／我已经咒诅了它
  rationale: 完成式在上下文中可表示咒诅已经发生或开始发生；然而也可能按先知性确定语气指将来的行动。阴性单数后缀与前面的复数“福分”在形式上不完全一致，因此在脚注中保存两方面的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“若不……也不……”保留条件句的递进结构；破折号标明先知话语中的发言者插语。正文仅设一处脚注，集中说明末句完成式和代词形式的真实歧义。
