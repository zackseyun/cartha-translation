  text: וִֽ/ידַעְתֶּ֕ם כִּ֚י שִׁלַּ֣חְתִּי אֲלֵי/כֶ֔ם אֵ֖ת הַ/מִּצְוָ֣ה הַ/זֹּ֑את לִֽ/הְי֤וֹת בְּרִיתִ/י֙ אֶת לֵוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/004.yaml
  text: Then you will know that I have sent this command to you[a], that my covenant with Levi may be[b], says Yahweh of Armies.
translation:
  language: zh_hans
  text: 你们就会知道，我把这条命令传给你们，是要使我与利未所立的约得以存立[a]。万军之耶和华[b]说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文十分简缩，较直译为“为使我与利未的约存在”。这可能指使该约继续有效，也可能表示这条命令与该约有更直接的关系。
    reason: alternative_reading
  - marker: b
    text: “万军之耶和华”也常译作“万军之主”。“耶和华”对应原文中的神名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: 你们就会知道
  rationale: 该形式在这里承接上文所宣告的惩罚，带有将来及结果意味；“就会”自然表达这种承接关系。
- source_word: כִּי
  choice: （知道）……
  rationale: 这里引出“知道”的内容，汉语无需另译连接词。
- source_word: שִׁלַּחְתִּי אֲלֵיכֶם
  choice: 我把……传给你们
  rationale: שׁלח 表示发出、送达；对象是一项命令，汉语用“传给”比直译“送给”自然，同时保留 אֶל 所表达的受事方向。
- source_word: הַמִּצְוָה הַזֹּאת
  choice: 这条命令
  rationale: מִצְוָה 指命令或训令；“这条命令”符合现代汉语搭配，也适合本段对祭司发出的告诫。
- source_word: לִהְיוֹת בְּרִיתִי אֶת־לֵוִי
  choice: 是要使我与利未所立的约得以存立
  rationale: 原文结构简缩。采用“存立”保留“成为、存在、保持有效”等可能意味，不明确限定为重新设立或单指继续存续；“与利未所立的约”自然表达 אֶת 的关联义。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”对应神名 יהוה；“万军”保留 צְבָאוֹת 的复数群军意味，也是庄重而易懂的现代中文表达。
- source_word: אָמַר
  choice: 这是……说的
  rationale: 对应先知信息中常见的宣告公式，在汉语中自然庄重，不额外加强为“宣告”。
theological_decisions:
- issue: 命令与“我同利未的约”之间的关系
  choice: 译作“是要使……约得以存立”，并以脚注说明原文的简缩性
  alternative: 可理解为命令旨在使该约继续有效，也可较直译为“为使我与利未的约存在”，甚至理解为这命令本身与该约构成更直接的关系
  rationale: לִהְיוֹת בְּרִיתִי אֶת־לֵוִי 没有明说“继续”“重新设立”等概念。正文以“存立”保持目的意味和神学张力，不把一种解释写死。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。“存立”略带书面色彩，但能避免用“延续”或“重新立约”过早消解原文的含混。所有脚注标记均置于正文相应位置。
