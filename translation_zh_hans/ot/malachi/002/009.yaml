source:
  edition: WLC
  text: וְ/גַם אֲנִ֞י נָתַ֧תִּי אֶתְ/כֶ֛ם נִבְזִ֥ים וּ/שְׁפָלִ֖ים לְ/כָל הָ/עָ֑ם כְּ/פִ֗י אֲשֶׁ֤ר אֵֽינְ/כֶם֙ שֹׁמְרִ֣ים אֶת דְּרָכַ֔/י וְ/נֹשְׂאִ֥ים פָּנִ֖ים בַּ/תּוֹרָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/009.yaml
  text: So I also have made you despised and abased before all the people[a], because you are not keeping my ways but are showing partiality in the law.
translation:
  language: zh_hans
  text: 所以，我也使你们在众民面前受人藐视、地位卑微，因为你们不遵守我的道路，却在律法上偏待人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“训诲”或“妥拉”。
    reason: 保留 תּוֹרָה 在此处真实存在的词义范围。
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: 所以，我也
  rationale: 承接上文的责备，并保留强调代词所表达的对应与强调意味。
- source_word: נָתַתִּי אֶתְכֶם
  choice: 使你们
  rationale: נתן 后接表语形容词，在此具有使役、结果义；译为“使你们”自然且贴合句法。
- source_word: נִבְזִים
  choice: 受藐视
  rationale: 表达被人轻看、蔑视的社会性羞辱，并保留其被动意味。
- source_word: וּשְׁפָלִים
  choice: 被贬低
  rationale: שׁפל 表示地位低下、遭贬抑；“被贬低”既贴近词义，也符合公开受辱的语境。
- source_word: לְכָל הָעָם
  choice: 在众民面前
  rationale: 这里的介词短语指羞辱显露于全体百姓的社会范围；如此翻译清楚表达公开性。
- source_word: כְּפִי אֲשֶׁר
  choice: 因为
  rationale: 字面为“按照……的情形”，在本句中引出神施行惩罚的依据，具有因果作用。
- source_word: אֵינְכֶם שֹׁמְרִים אֶת דְּרָכַי
  choice: 你们不遵行我的道路
  rationale: שׁמר 在盟约语境中指谨守、遵守；汉语“遵行我的道路”自然表达持续顺服的要求。
- source_word: וְנֹשְׂאִים פָּנִים
  choice: 反而……偏待人
  rationale: נשׂא פנים 是偏袒、看情面的惯用语；“偏待人”准确且适合庄重经文语体。“反而”显明此行为与遵行神道路相对。
- source_word: בַּתּוֹרָה
  choice: 在律法上
  rationale: תּוֹרָה 在祭司施教和裁断的语境中可指神的律法，但也保有“训诲”或“妥拉”的语义范围，故以脚注说明。
theological_decisions:
- issue: 祭司语境中 תּוֹרָה 的译法
  choice: 律法
  alternative: 训诲；妥拉
  rationale: 本节责备祭司在处理神所启示的规范时偏待人。“律法”能清楚传达盟约和裁断语境，同时脚注保留该词较广的“训诲”义及希伯来传统称谓。
- issue: 公开羞辱措辞的力度
  choice: 在众民面前受藐视、被贬低
  alternative: 在众民面前被轻看、成为卑微
  rationale: 译文保留神审判所造成的公开社会性降卑，但不将原文强化为额外的身体或心理伤害。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受藐视、被贬低”保留两个并列形容词的区别；“偏待人”准确传达希伯来语惯用表达。脚注标记置于相关词语之后。
