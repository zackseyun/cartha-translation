base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/001.yaml
  text: And now[a], this command is for you, O priests.
translation:
  language: zh_hans
  text: 现在，祭司们，这命令是给你们的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“这命令是向你们的。”原文介词可译为“向”或“对”；这里表示这命令特别是向祭司们发出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 这是承接上文并转入直接宣告的话语标记；现代汉语用“现在”即可自然表达这一推进，句首无需机械译出连接词“和”。
- source_word: אֲלֵיכֶם
  choice: 是对你们说的
  rationale: 介词 אֶל 带第二人称复数词尾，表示命令所指向的对象。译作“是对你们说的”既符合现代汉语习惯，也避免“给你们的”可能产生的受益意味。
- source_word: הַמִּצְוָה
  choice: 命令
  rationale: מִצְוָה 在这里指具有约束力的吩咐；“命令”直接、明确，也切合上下文的警告语气。
- source_word: הַזֹּאת
  choice: 这
  rationale: 保留指示词的近指意义，用现代汉语常用的“这”修饰“命令”。
- source_word: הַכֹּהֲנִים
  choice: 祭司们
  rationale: 该名词在句中是呼语；置于“现在”之后并以逗号隔开，自然体现直接称呼，无须使用较古雅的“祭司啊”。
theological_decisions: []
