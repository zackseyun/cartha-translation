source:
  edition: WLC
  text: וְ/אַתֶּם֙ סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ הִכְשַׁלְתֶּ֥ם רַבִּ֖ים בַּ/תּוֹרָ֑ה שִֽׁחַתֶּם֙ בְּרִ֣ית הַ/לֵּוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/008.yaml
  text: But you have turned aside from the way; you have caused many to stumble in the law; you have corrupted the covenant of Levi[a], says Yahweh of hosts.
translation:
  language: zh_hans
  text: 但你们却偏离了正道，使许多人在律法[a]的事上跌倒；你们败坏了利未之约——万军之雅威说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“教导”或“训诲”；本句也可理解为“借着教导使许多人跌倒”。
    reason: 希伯来语 תּוֹרָה 的词义及介词 בְּ 的句法均容许这些译法。
lexical_decisions:
- source_word: סַרְתֶּם מִן־הַדֶּרֶךְ
  choice: 偏离了正道
  rationale: 保留“离开道路”的比喻；“正道”以自然现代汉语表达这里伦理与信仰层面的道路，并不另行说明他们偏离的具体方式。
- source_word: הִכְשַׁלְתֶּם רַבִּים
  choice: 使许多人……跌倒
  rationale: 准确体现使役词形，并保留“跌倒”可能兼具受误导、犯罪或遭败坏的开放含义。
- source_word: בַּתּוֹרָה
  choice: 在律法上
  rationale: ב 可表示领域或关联；“在律法上”较少武断地指定律法是工具，同时保留 תּוֹרָה 在圣约语境中的正式含义。其“教导、训诲”义收入脚注。
- source_word: שִׁחַתֶּם
  choice: 败坏了
  rationale: 对应该加强词形“使败坏、毁坏”的含义，也适合与“约”搭配，而不把它窄化为纯法律意义的“违犯”。
- source_word: בְּרִית הַלֵּוִי
  choice: 利未之约
  rationale: 按希伯来语属格结构直译，保留此约是“与利未所立”还是“属于利未体系”的适度张力。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 以“雅威”音译神圣四字名，以“万军”保留 צְבָאוֹת 的传统广义称号，不将其限制为人间军队。
theological_decisions:
- issue: תּוֹרָה 在祭司语境中的含义
  choice: 律法
  alternative: 教导／训诲
  rationale: 上下文涉及祭司受托传授的圣约规范，“律法”能保留其正式、圣约性的分量；但原词也可指祭司的教导，因此在脚注中明示。
- issue: בַּתּוֹרָה 中介词 בְּ 的关系
  choice: 在律法上
  alternative: 因律法／借着教导
  rationale: 原介词可作领域义或工具义。正文采用较开放的领域表达，避免断定是律法本身，还是祭司对律法的教导，使人跌倒。
- issue: “利未之约”的关系
  choice: 利未之约
  alternative: 与利未所立的约
  rationale: 正文保留原文简洁的属格结构，不明断“利未”是立约对象、代表人物还是利未祭司体系。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“偏离正道”“跌倒”“败坏……之约”保留先知言辞的道路与圣约意象；句末“万军之雅威说”保持神谕宣告的力度。
