  text: בְּרִיתִ֣/י הָיְתָ֣ה אִתּ֗/וֹ הַֽ/חַיִּים֙ וְ/הַ֨/שָּׁל֔וֹם וָ/אֶתְּנֵֽ/ם ל֥/וֹ מוֹרָ֖א וַ/יִּֽירָאֵ֑/נִי וּ/מִ/פְּנֵ֥י שְׁמִ֖/י נִחַ֥ת הֽוּא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/005.yaml
  text: My covenant with him was one of life and peace[a], and I gave them to him; this called for reverence, and he revered me[b], and he stood in awe before my name.
translation:
  language: zh_hans
  text: 我的约是与他所立的，是生命与平安之约；我把这两样赐给他，使他心存敬畏[a]；他就敬畏我，并在我的名面前战兢[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他心存敬畏”对应原文中“我把这两样赐给他”之后的简省表达。也可理解为“连同敬畏赐给他”“为着敬畏赐给他”，或“这使他敬畏”。
    reason: lexical_alternative
  - marker: b
    text: “战兢”所译原词也可指“惊惶”“被压服”或“受震慑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיתִי הָיְתָה אִתּוֹ
  choice: 我与他所立的约
  rationale: 按现代汉语自然表达保留“我的约与他同在”的关系含义；上下文中的“他”指利未。
- source_word: הַחַיִּים וְהַשָּׁלוֹם
  choice: 生命与平安
  rationale: 直译两个带定冠词的并列名词；“平安”也包含健全、福祉的广义内涵。
- source_word: וָאֶתְּנֵם לוֹ
  choice: 我把这两样赐给他
  rationale: 阳性复数宾语后缀最自然地回指“生命与平安”；“赐”符合上帝施予约中福分的语境。
- source_word: מוֹרָא
  choice: 为要使他敬畏
  rationale: 此处希伯来语句法高度压缩；这样译出目的或结果关系，同时保留 מוֹרָא 的敬畏含义，但不把不确定的句法说得过满。
- source_word: וַיִּירָאֵנִי
  choice: 他就敬畏我
  rationale: 保留 ירא 的基本语义，并以“敬畏”表达约中带有畏惧与尊崇的回应。
- source_word: וּמִפְּנֵי שְׁמִי נִחַת הוּא
  choice: 并且在我的名面前谦卑战兢
  rationale: “在我的名面前”保留空间性隐喻；נחת（חתת 的被动式）可指被压服、惊惶或战兢，“谦卑战兢”在正面祭司语境中兼顾降卑与畏惧的力度。
theological_decisions:
- issue: 约中祭司对上帝的回应是敬畏还是恐惧
  choice: 用“敬畏”描述对上帝的回应，并用“谦卑战兢”保留其严肃和震慑力。
  alternative: 可更强烈地译为“惧怕我”“在我的名面前惊惶”或“被压服”。
  rationale: מוֹרָא、ירא 与 נחת 都不应被弱化为单纯尊敬；但“生命与平安之约”的正面语境表明，这里主要是因上帝而生的敬畏，而非与约相悖的绝望恐慌。
- issue: “我赐给他”之后 מוֹרָא 的句法关系
  choice: 译作目的关系：“为要使他敬畏”。
  alternative: 可理解为“连同敬畏赐给他”“因着敬畏赐给他”，或把它作为下句的前置成分。
  rationale: 原文表达简省，句法存在真实歧义；正文采用通顺且符合后句“他就敬畏我”的理解，并以脚注保留其他可能。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“生命与平安之约”使首句关系明确；“敬畏”保持经文的宗教与伦理分量，“谦卑战兢”避免把 נחת 过度柔化。
