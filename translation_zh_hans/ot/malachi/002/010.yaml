base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/010.yaml
  text: Do we not all have one Father? Has not one God created us? Why then are we faithless[a], each man to his brother[b], profaning the covenant of our fathers?
translation:
  language: zh_hans
  text: 我们不都是同有一位父亲[b]吗？不是同一位上帝创造了我们吗？那么，我们为什么各人对自己的弟兄不忠[a]，亵渎我们列祖的约呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不忠”也可译作“行事诡诈”。希伯来语动词常指在关系、尤其圣约关系中不忠或背叛。
    reason: lexical_alternative
  - marker: b
    text: “一位父亲”很可能指上帝，正如下句“同一位上帝创造了我们”所暗示的；也有人理解为共同的圣约祖先。
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלוֹא
  choice: 岂不／岂不是
  rationale: 引出预期肯定回答的反问；这样的汉语表达自然保留原文的修辞力度。
- source_word: אָב אֶחָד
  choice: 一位父
  rationale: 保留单数和“一”的统一主题，不在正文中明确判定所指是上帝还是共同祖先。
- source_word: אֵל אֶחָד
  choice: 一位上帝
  rationale: 直接表达独一上帝的含义，并与前句“一位父”形成平行。
- source_word: בְּרָאָנוּ
  choice: 创造了我们
  rationale: ברא在此以上帝为主语，“创造”保留其明确的创造含义。
- source_word: נִבְגַּד
  choice: 彼此背信
  rationale: בגד表示在关系、尤其约的关系中行事诡诈、不忠；“背信”简洁地联系下文的约。
- source_word: אִישׁ בְּאָחִיו
  choice: 各人背叛自己的弟兄
  rationale: 保留分配性的“各人”和亲属称谓“弟兄”；结合动词语义，用“背叛”自然表达对弟兄的不忠。
- source_word: לְחַלֵּל
  choice: 以致亵渎
  rationale: 既保留חלל使神圣之物受亵渎的力度，也自然表达该不忠行为所导致的结果。
- source_word: בְּרִית אֲבֹתֵינוּ
  choice: 我们列祖的约
  rationale: 保留属格表达及群体与先祖之间的圣约连续性。
theological_decisions:
- issue: “一位父”的身份
  choice: 正文译作“一位父”，不进一步明说其身份
  alternative: 译作“一位祖先”，或解释为“我们的父上帝”
  rationale: 后句“一位上帝创造了我们”强烈暗示这里指上帝，但原文仍分别使用“父”和“上帝”；译文保留这种措辞和可能的张力。
- issue: אִישׁ ... אָחִיו的性别与群体指向
  choice: 各人……自己的弟兄
  alternative: 每个人……同胞／彼此
  rationale: 保留原文阳性单数和亲属称谓，同时“各人”在现代汉语中可自然表达面向全体的分配意义。
- issue: 不忠与亵渎约的逻辑关系
  choice: 以致亵渎
  alternative: 为了亵渎／从而亵渎
  rationale: לְ加不定式可表达目的或结果；语境更适合以结果表达，但不把行为动机明确断定为故意亵渎。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个反问保持平行；“列祖的约”保留圣经语域但仍易于普通读者理解。脚注标记均置于正文中。
