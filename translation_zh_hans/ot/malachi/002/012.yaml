id: MAL.2.12
reference: Malachi 2:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַכְרֵ֨ת יְהוָ֜ה לָ/אִ֨ישׁ אֲשֶׁ֤ר יַעֲשֶׂ֨/נָּה֙ עֵ֣ר וְ/עֹנֶ֔ה מֵ/אָהֳלֵ֖י יַֽעֲקֹ֑ב וּ/מַגִּ֣ישׁ מִנְחָ֔ה לַֽ/יהוָ֖ה צְבָאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/012.yaml
  text: May Yahweh cut off from the tents of Jacob the man who does this[a], him who is awake and him who answers, and him who brings an offering to Yahweh of hosts.
translation:
  language: zh_hans
  text: 愿雅威把这样做的人从雅各的帐棚中剪除——警醒者和回应者[a]，以及向万军之雅威献供物的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “警醒者和回应者”原文含义不明。它可能是习语，意为“见证者和辩护者”，也可能泛指所有相关的人；另有“师傅和徒弟”等解释。
    reason: 保留难解希伯来语短语的多种可能解释，避免在正文中过度确定其含义。
lexical_decisions:
- source_word: יַכְרֵת
  choice: 愿……剪除
  rationale: 使役形通常表示“剪除、除灭”；这里的未完成式适合按祈愿式理解，保留先知宣告审判时的咒诅语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保存上帝的专名，而不以“主”这一称号替代。
- source_word: לָאִישׁ אֲשֶׁר יַעֲשֶׂנָּה
  choice: 这样做的人
  rationale: 阴性代词后缀指向上文所谴责的行为；汉语用“这样做”自然承接上下文，同时保留单数代表性表达。
- source_word: עֵר וְעֹנֶה
  choice: 警醒者和回应者
  rationale: 按两个分词的基本词义作相对直译，不在正文中武断确定这个难解短语的习语含义。
- source_word: מֵאָהֳלֵי יַעֲקֹב
  choice: 从雅各的帐棚中
  rationale: 保留“帐棚”的原文意象；该表达整体指雅各的群体或住处。
- source_word: וּמַגִּישׁ מִנְחָה
  choice: 以及……献供物的人
  rationale: 保留并列结构，不擅自加入“却、仍然”等转折意味；מִנְחָה 在此可泛指献给上帝的供物，故不限定为“素祭”。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “万军”保留 צְבָאוֹת 所指天上或作战军旅的意象，并与神名的译法保持一致。
theological_decisions:
- issue: 开头未完成式在审判语境中的语气
  choice: 愿雅威……剪除
  alternative: 雅威必……剪除
  rationale: 上下文更适合祈愿式或咒诅式宣告，但两种理解都包含上帝施行审判的意思。
- issue: 难解短语 עֵר וְעֹנֶה 的含义
  choice: 正文采用“警醒者和回应者”，脚注说明其不确定性
  alternative: 见证者和辩护者；师傅和徒弟；泛指所有相关的人
  rationale: 该短语的习语含义无法确定，正文保留词面张力，避免把某一种解释写成定论。
- issue: 献供物者与前述作恶者之间的逻辑关系
  choice: 以“以及”保留原文并列
  alternative: 却仍献供物的人
  rationale: 原文只有连接词和分词，没有明确的转折标记；不把上下文可能暗示的虚伪敬拜直接写入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“剪除”“帐棚”“万军之雅威”保留先知书的审判语气和原文意象；破折号标明后续成分与“这样做的人”的同位或展开关系，同时不强行消除希伯来句法的含混。
