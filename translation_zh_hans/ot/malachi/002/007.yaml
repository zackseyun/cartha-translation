id: MAL.2.7
reference: Malachi 2:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי שִׂפְתֵ֤י כֹהֵן֙ יִשְׁמְרוּ דַ֔עַת וְ/תוֹרָ֖ה יְבַקְשׁ֣וּ מִ/פִּ֑י/הוּ כִּ֛י מַלְאַ֥ךְ יְהוָֽה צְבָא֖וֹת הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/007.yaml
  text: For the lips of a priest should guard knowledge[a], and they should seek instruction from his mouth[b], because he is the messenger of Yahweh of Armies.
translation:
  language: zh_hans
  text: 因为祭司的嘴唇应当守护知识，人们应当从他口中寻求教导[a]，因为他是万军之耶和华[b]的使者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教导”或译“律法”或“训诲”；希伯来语为“妥拉”（torah）。
    reason: lexical_alternative
  - marker: b
    text: “万军”原文指众军，也可包括天上的众军。
    reason: lexical_range
lexical_decisions:
- source_word: שִׂפְתֵי כֹהֵן
  choice: 祭司的嘴唇
  rationale: 保留原文具体的身体意象和单数通称用法，指祭司作为一类人应有的言语职分。
- source_word: יִשְׁמְרוּ דַעַת
  choice: 应当守护知识
  rationale: 未完成式在责备祭司的语境中表达规范和职责，而非单纯预告未来；“守护知识”保留 שמר 的看守、保存之意。
- source_word: וְתוֹרָה
  choice: 教导
  rationale: תורה 在这里指人从祭司口中寻求的权威训诲，不宜只收窄为成文法规；脚注保留“律法、训诲”等可能译法。
- source_word: יְבַקְשׁוּ מִפִּיהוּ
  choice: 人们应当从他口中寻求
  rationale: 复数动词的主语未明说，译作“人们”自然表达不定复数；“从他口中”保留祭司口头教导的原文意象。
- source_word: מַלְאַךְ
  choice: 使者
  rationale: 本节所指是祭司作为奉差传达上帝话语的人，因此译作“使者”，而非“天使”。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 采用现代中文读者熟悉而庄重的神名与称号；“万军”保留 צבאות 所指众军、军队的意象，并以脚注提示其语义范围。
theological_decisions:
- issue: 未完成式是规范还是预告
  choice: 应当守护／应当寻求
  alternative: 将要守护／将要寻求
  rationale: 上下文正在责备祭司失职，本节陈述的是祭司及百姓本当遵行的秩序；规范义更符合语境，同时不把陈述改成命令句。
- issue: מַלְאַךְ 的身份含义
  choice: 使者
  alternative: 天使
  rationale: 句中“他”承接祭司，强调其受差遣传话的职分，并非把祭司认定为天上灵体。
- issue: יהוה צבאות 的称号
  choice: 万军之耶和华
  alternative: 众军之耶和华／万军之主
  rationale: “万军之耶和华”既保留专名，也承载原文军事及天军意象；不将其抽象化为单纯的“大能之主”。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留“嘴唇”“从他口中”等希伯来语具体意象；用“应当”明确语境中的职责意味。所有脚注标记均置于相应词语之后。
