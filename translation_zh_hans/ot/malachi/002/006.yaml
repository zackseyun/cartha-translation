source:
  edition: WLC
  text: תּוֹרַ֤ת אֱמֶת֙ הָיְתָ֣ה בְּ/פִ֔י/הוּ וְ/עַוְלָ֖ה לֹא נִמְצָ֣א בִ/שְׂפָתָ֑י/ו בְּ/שָׁל֤וֹם וּ/בְ/מִישׁוֹר֙ הָלַ֣ךְ אִתִּ֔/י וְ/רַבִּ֖ים הֵשִׁ֥יב מֵ/עָוֺֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/006.yaml
  text: The law of truth was in his mouth[a], and no injustice was found on his lips. He walked with me in peace and uprightness[c][b], and he turned many back from iniquity.
translation:
  language: zh_hans
  text: 真实的训诲在他口中[a]，他嘴唇上没有不义。他以平安和正直与我同行，并使许多人回转，离开罪孽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“真理的律法在他口中。”
    reason: תּוֹרָה既可指律法，也可指教导或训诲；构词关系也容许较直译的“真理的律法”。
  - marker: b
    text: “罪孽”也可译作“罪”或“罪责”。
    reason: עָוֹן的语义范围包括罪孽、罪责，有时也包括罪所招致的后果。
lexical_decisions:
- source_word: תּוֹרַת אֱמֶת
  choice: 真实的训诲
  rationale: תּוֹרָה在本节祭司职分的语境中主要指教导或训诲，同时仍带有上帝律法的背景；译作“真实的训诲”自然地表达其教学意义，并保留אֱמֶת所强调的真实可靠。
- source_word: בְּפִיהוּ
  choice: 在他口中
  rationale: 保留希伯来语以“口”指言语和教导的具体意象，现代汉语亦可理解。
- source_word: עַוְלָה
  choice: 不义
  rationale: 该词可指不公、邪恶或不正当之事；“不义”涵盖面较广，也与祭司言语的正直相称。
- source_word: נִמְצָא בִשְׂפָתָיו
  choice: 他嘴唇上没有
  rationale: 用自然汉语表达被动结构“在他嘴唇上未被发现”，同时保留“嘴唇”的原文意象。
- source_word: בְּשָׁלוֹם וּבְמִישׁוֹר
  choice: 以平安和正直
  rationale: שָׁלוֹם含完整、和谐与平安之意；מִישׁוֹר本指平直，转指正直、公正。此译保留二者并列的伦理与关系层面。
- source_word: הָלַךְ אִתִּי
  choice: 与我同行
  rationale: 保留圣约关系中“行走”的隐喻，不将其收窄为生活、服事或相交中的某一种解释。
- source_word: הֵשִׁיב
  choice: 使许多人回转
  rationale: 该动词为使役形，译文明确表达他促使许多人转回的含义。
- source_word: מֵעָוֺן
  choice: 离开罪孽
  rationale: עָוֹן可指罪孽、罪责或罪的后果；此处与“使……回转”搭配，最自然地指人所离开的罪孽。
theological_decisions:
- issue: 祭司口中的תּוֹרָה所指为何
  choice: 真实的训诲
  alternative: 真理的律法
  rationale: 上下文聚焦祭司教导百姓的职责，因此正文凸显“训诲”；脚注保留“律法”这一可能译法，以免抹去其与妥拉和圣约的联系。
- issue: “与我同行”的圣约隐喻
  choice: 保留“与我同行”
  alternative: 与我和睦相交／在我面前行事
  rationale: 原文既有关系性也有行为性的内涵；直译可保留这种张力，不限定为某一种神学解释。
- issue: הֵשִׁיב的悔改与使役含义
  choice: 使许多人回转，离开罪孽
  alternative: 使许多人脱离罪孽／使许多人从罪中归回
  rationale: “使……回转”保留使役语态及归回的动态意象；补出“离开”使现代汉语关系清楚，却不明确指定他们归向何处。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“口中”“嘴唇”“同行”“回转”等希伯来语核心意象；以“训诲”呈现祭司教导的语境，并用脚注保留“律法”的词义可能。
