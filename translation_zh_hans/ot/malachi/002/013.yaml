source:
  edition: WLC
  text: וְ/זֹאת֙ שֵׁנִ֣ית תַּֽעֲשׂ֔וּ כַּסּ֤וֹת דִּמְעָה֙ אֶת מִזְבַּ֣ח יְהוָ֔ה בְּכִ֖י וַֽ/אֲנָקָ֑ה מֵ/אֵ֣ין ע֗וֹד פְּנוֹת֙ אֶל הַ/מִּנְחָ֔ה וְ/לָ/קַ֥חַת רָצ֖וֹן מִ/יֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/013.yaml
  text: 'And this second thing you do: you cover the altar of Yahweh with tears[a], with weeping and groaning, because he no longer regards the offering or accepts it with favor from your hand.'
translation:
  language: zh_hans
  text: 你们还做这第二件事：你们用眼泪遮盖耶和华的祭坛，哭泣哀叹，因为他不再垂顾供物[a]，也不悦纳你们手中所献的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供物”或译“素祭”。希伯来语 מִנְחָה 既可专指素祭，也可较广泛地指献上的供物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת שֵׁנִית
  choice: 你们还做了第二件事
  rationale: 该短语在一连串指控中引出另一项罪责；“第二件事”保留 שֵׁנִית 的序数含义，“还”自然承接上文。
- source_word: תַּעֲשׂוּ
  choice: 做了
  rationale: 此处是先知对听众行为的直接指控；汉语用“做了”可自然陈述已经形成的事实，不必机械保留希伯来语未完成式的形式。
- source_word: כַּסּוֹת דִּמְעָה אֶת מִזְבַּח יְהוָה
  choice: 用眼泪遮盖耶和华的祭坛
  rationale: 保留 כסה“遮盖”的鲜明意象，并按希伯来语句法将“眼泪”理解为遮盖祭坛的媒介。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名最通行、最易识别的音译，保留其专名性质，而非改译为称号“主”。
- source_word: בְּכִי וַאֲנָקָה
  choice: 哭泣哀叹
  rationale: בְּכִי 指哭泣，אֲנָקָה 指叹息或呻吟；“哭泣哀叹”简洁、庄重，并传达有声的悲苦。
- source_word: מֵאֵין עוֹד פְּנוֹת אֶל הַמִּנְחָה
  choice: 以致他不再垂顾供物
  rationale: מֵאֵין עוֹד 表示某行为不再发生；פנה אל 在此不是单纯转身，而是留意、眷顾。“垂顾”自然表达神不再看顾并认可所献之物。
- source_word: הַמִּנְחָה
  choice: 供物
  rationale: מִנְחָה 可专指素祭，也可泛指献上的礼物或祭物；正文采用较宽泛的“供物”，并以脚注保留专指素祭的可能。
- source_word: וְלָקַחַת רָצוֹן מִיֶּדְכֶם
  choice: 也不再悦纳你们手中所献的
  rationale: לקח 与 רצון 共同表达带着认可而收受；“悦纳”符合敬拜语境，“你们手中所献的”保留 מִיֶּדְכֶם 的来源意象，又避免生硬重复“供物”。
theological_decisions:
- issue: 末句“垂顾”和“悦纳”的隐含主语
  choice: 以“他”明确指耶和华
  alternative: 保留无人称表达，如“不再有人垂顾供物”
  rationale: 希伯来语表达紧缩，但上下文明显论及耶和华拒绝他们所献的供物；补出“他”是汉语句法所需，并未增添原文之外的神学判断。
- issue: 眼泪、哭泣和哀叹的行为者
  choice: 不在正文中明确说明是谁哭泣
  alternative: 明确译为“你们用自己的眼泪……”
  rationale: 原文将这些情形与“你们所做的”相连，却没有另行明说眼泪属于谁；译文保留这一点，不把可能的语境解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“遮盖祭坛”保留原文意象；“垂顾”“悦纳”稍具敬拜语域色彩，但在现代中文中仍清楚自然。脚注标记置于其实际对应的“供物”之后。
