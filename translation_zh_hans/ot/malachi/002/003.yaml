source:
  edition: WLC
  text: הִנְ/נִ֨י גֹעֵ֤ר לָ/כֶם֙ אֶת הַ/זֶּ֔רַע וְ/זֵרִ֤יתִי פֶ֨רֶשׁ֙ עַל פְּנֵי/כֶ֔ם פֶּ֖רֶשׁ חַגֵּי/כֶ֑ם וְ/נָשָׂ֥א אֶתְ/כֶ֖ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/003.yaml
  text: Look[a], I am rebuking your offspring[c][b], and I will spread dung on your faces—the dung of your festival sacrifices—and one will carry you away with it.
translation:
  language: zh_hans
  text: 看哪，我要斥责你们的后裔[a]；我要把粪撒在你们脸上，就是你们节期祭牲的粪[b]；有人必把你们和这粪一同带走[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文也可译作“种子”；有人认为这里指谷物或庄稼。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“你们节期的粪”，可能指节期所献祭牲的粪便或废弃物。
    reason: lexical_alternative
  - marker: c
    text: 末句原文含义较难确定，主语和代词所指都不明确。大意可能是：祭司将与粪和祭牲废弃物一同被清除，送到不洁净之处。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי גֹעֵר
  choice: 看哪，我要斥责
  rationale: הִנְנִי与分词连用，表达迫近而郑重的宣告；“斥责”保留גער的基本义，也能承载审判语境中的强烈语气。
- source_word: הַזֶּרַע
  choice: 你们的后裔
  rationale: זֶרַע既可指种子、庄稼，也可指后代；本段直接谴责祭司，并涉及约与世系所受的审判，因此正文采用“后裔”，同时以脚注保留农业意义的可能性。
- source_word: וְזֵרִיתִי
  choice: 我要把……撒在
  rationale: זרה在此表示撒散；搭配“粪”和“脸上”，“撒在”既自然又保留羞辱性的具体动作。
- source_word: פֶּרֶשׁ
  choice: 粪
  rationale: 该词指牲畜的粪便或祭牲废弃物；“粪”直接、清楚，并保留原文刻意令人不适的措辞。
- source_word: פֶּרֶשׁ חַגֵּיכֶם
  choice: 你们节期祭牲的粪
  rationale: 字面为“你们节期的粪”。上下文指节期献祭牲畜所产生、须被清除的粪和废弃物；正文适度明示祭牲这一语境关联，脚注注明原文字面形式。
- source_word: וְנָשָׂא אֶתְכֶם אֵלָיו
  choice: 人也必把你们连同粪一起带走
  rationale: 原句的第三人称阳性单数主语及末尾代词所指都较难确定。用泛指的“人”表达未说明的执行者，并以“连同粪一起带走”传达祭司像祭牲废物一样被清除的整体意象，不具体指定去处。
theological_decisions:
- issue: הַזֶּרַע在针对祭司的审判宣告中所指为何
  choice: 后裔
  alternative: 种子，即谷物或庄稼
  rationale: 祭司与其约及世系是近处语境的重点，所以“后裔”较为可能；但该词确有农业含义，故不把另一解释从注释中删去。
- issue: 末句וְנָשָׂא אֶתְכֶם אֵלָיו的主语、代词和动作关系
  choice: 未说明的执行者把祭司连同粪一起带走
  alternative: 粪本身把他们带到它那里；或他们被带到粪那里
  rationale: 希伯来文结构高度压缩，所指不明。正文传达玷污后与祭牲废物一同被清除的判断，却不确定执行者身份或具体地点；脚注保留语法难点。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”保留先知宣告的提示语；“斥责”“祭牲”等词符合经文语域，但句法保持现代自然。正文保留原文粗粝的“粪”，不以较文雅的委婉语削弱羞辱与审判意象。
