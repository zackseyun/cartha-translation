  to: 看哪，我要斥责你们的后裔[a]；我要把粪撒在你们脸上，就是你们节期祭牲的粪[b]；有人必把你们和这粪一同带走[c]。
  rationale: 仅作低风险的汉语行文修订：以“有人必”替换“人也必”，使未指明的施事者在现代汉语中表达得更自然，并删除无必要的“也”。其余译文与脚注均可保留：它们忠实反映原文的审判、污辱和末句语法歧义，也与英文审校轨迹一致。
