  text: וְ/לֹא אֶחָ֣ד עָשָׂ֗ה וּ/שְׁאָ֥ר ר֨וּחַ֙ ל֔/וֹ וּ/מָה֙ הָֽ/אֶחָ֔ד מְבַקֵּ֖שׁ זֶ֣רַע אֱלֹהִ֑ים וְ/נִשְׁמַרְתֶּם֙ בְּ/ר֣וּחֲ/כֶ֔ם וּ/בְ/אֵ֥שֶׁת נְעוּרֶ֖י/ךָ אַל יִבְגֹּֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/015.yaml
  text: Did not the one God make them[a]? Yet a remnant of the Spirit was his. And what was the one seeking? Godly offspring. So guard yourselves in your spirit[c][b], and let no one deal treacherously with the wife of his youth.
translation:
  language: zh_hans
  text: 那独一的上帝不是造了他们吗？[a]然而，余剩的灵归他所有。[b]那独一位寻求什么呢？属上帝的后裔。[c]所以，你们当在自己的灵里谨慎自守；不可对自己年轻时的妻子行诡诈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文十分难解，直译近似“不是一位造了吗？”。这里把“那一位”理解为独一的上帝，把所造的理解为夫妻二人。另有解释为：“凡尚有一点灵的人都不会这样做”，或认为“那一位”指亚伯拉罕。
    reason: alternative_reading
  - marker: b
    text: 原文直译近似“余剩的灵属于他”。也可理解为“他有丰盛的灵”，或将“灵”理解为人的灵或生命气息。
    reason: lexical_alternative
  - marker: c
    text: 直译“上帝的种子”。也可译作“敬虔的后裔”或“上帝所赐的后裔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֶחָד עָשָׂה
  choice: 那独一的上帝不是造了他们吗？
  rationale: 希伯来文极为简略，直译近似“不是一位造了吗？”。按上下文将“独一位”理解为上帝，并从婚姻语境补出宾语“他们”，即夫妻二人；同时以脚注保留其他主要解释。
- source_word: וּשְׁאָר רוּחַ לוֹ
  choice: 他仍有余剩的灵
  rationale: שְׁאָר 的基本义是“余剩、余留之物”，רוּחַ 可指灵、气息或心灵。译文尽量保留原句难解的措辞，不在正文中强行判定这里是否专指上帝的灵。
- source_word: וּמָה הָאֶחָד מְבַקֵּשׁ
  choice: 那独一位寻求什么呢？
  rationale: 保留原文问句及 הָאֶחָד 与前句 אֶחָד 的呼应，不把问句改写成陈述。
- source_word: זֶרַע אֱלֹהִים
  choice: 属上帝的后裔
  rationale: זֶרַע 在婚姻语境中自然译为“后裔”。“属上帝的”保留 אֱלֹהִים 这一属格结构可能表达归属或性质的张力；“敬虔的后裔”列入脚注。
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  choice: 所以，你们要谨守自己的灵
  rationale: נשמר 的反身语气译为“谨守自己”，并保留 בְּרוּחֲכֶם 的“自己的灵”，突出内在生命与意念。
- source_word: וּבְאֵשֶׁת נְעוּרֶיךָ אַל יִבְגֹּד
  choice: 谁也不可背信，亏负自己年轻时所娶的妻子
  rationale: בגד 表示背信、行诡诈，尤其带有破坏盟约关系的意味。中文以“背信，亏负”兼顾盟约力度和婚姻语境；“年轻时所娶的妻子”自然表达希伯来文“你幼年／青春时期的妻子”。
theological_decisions:
- issue: 本节首句的主语及其婚姻含义
  choice: 将“那独一位”理解为独一的上帝，并将隐含宾语理解为夫妻二人
  alternative: 可译为“不是一位造了吗？”；也可能指亚伯拉罕，或意为“凡尚有一点灵的人都不会这样做”
  rationale: 这一理解与第14节上帝为婚约作见证以及本节关于婚姻忠诚的论述衔接较自然，但希伯来文句法确实异常，因此不把其他解释从脚注中删除。
- issue: רוּחַ 是否特指上帝的灵
  choice: 正文译作“灵”，不借中文排版明确限定为圣灵
  alternative: 可理解为人的灵、生命气息，或上帝所赐的灵；整句也可能表示“他有丰盛的灵”
  rationale: 希伯来文本身没有大小写之分，且整句含义存疑。中文“灵”允许保留所指未定的状态，避免凭大小写作出过度判定。
- issue: זֶרַע אֱלֹהִים 的属格关系
  choice: 属上帝的后裔
  alternative: 敬虔的后裔；上帝所赐的后裔
  rationale: 原文可表达归属，也可作性质性属格。正文保留较直接的结构，脚注说明更具解释性的译法。
translation_notes:
  register: 采用庄重而现代的普通话。“背信，亏负”既保留盟约语境中 בגד 的力度，也避免生硬的逐字表达。首句及“余剩的灵”因原文本身高度含混，正文保持简洁，主要异读集中列于脚注。
