  text: וְ/הֵשִׁ֤יב לֵב אָבוֹת֙ עַל בָּנִ֔ים וְ/לֵ֥ב בָּנִ֖ים עַל אֲבוֹתָ֑/ם פֶּן אָב֕וֹא וְ/הִכֵּיתִ֥י אֶת הָ/אָ֖רֶץ חֵֽרֶם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/024.yaml
  text: And he will turn the hearts of fathers to their children[a], and the hearts of children to their fathers, lest I come and strike the land with a ban of destruction.
translation:
  language: zh_hans
  text: 他要使父亲的心转向儿女，使儿女的心转向父亲，免得我来，以灭绝之禁击打这地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使这地全然毁灭。”传统译作“以咒诅击打这地”。希伯来语这个词指被置于禁令之下、归于毁灭。
    reason: 说明 חֵרֶם 的词义范围及传统译法；正文中的[a]置于相关短语之后。
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: 他要使……的心转向
  rationale: 使役形表达“使转回、使转向”。在亲属关系的语境中，“使……的心转向”自然保留了希伯来语关于内在意愿与情感重新定向的表达。
- source_word: לֵב
  choice: 心
  rationale: 希伯来语“心”指人的内在，包括意愿、思想和情感；汉语以单数集合式表达最自然。
- source_word: אָבוֹת
  choice: 父亲
  rationale: 原文为阳性复数，且与“儿女”相对，此处译作“父亲”比宽泛的“祖先”更贴近直接的代际关系。
- source_word: עַל
  choice: 转向
  rationale: 介词在此表达关系上的朝向；结合动词译为“心转向”符合现代汉语习惯，又不过度解释具体机制。
- source_word: בָּנִים
  choice: 儿女
  rationale: 该词虽可专指“儿子”，也常泛指后代或孩子；此处“儿女”准确传达家庭与代际的整体意义。
- source_word: אֲבוֹתָם
  choice: 父亲
  rationale: 原文带第三人称复数后缀，汉语在“儿女的心转向父亲”中所属关系已清楚，无须生硬添加“他们的”。
- source_word: פֶּן
  choice: 免得
  rationale: 引出应当避免的严重后果；“免得”简洁、庄重，并保持警告语气。
- source_word: אָבוֹא
  choice: 我来
  rationale: 直译第一人称未完成式，在“免得”之后自然表达所警告的可能来临。
- source_word: וְהִכֵּיתִי
  choice: 击打
  rationale: 保留原文“击打”的直接意象和审判力度，比“惩罚”更贴近词形，也不采用古奥措辞。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: אֶרֶץ可指土地、国土或全地；本书的盟约审判语境较支持“这地”，同时避免不必要地扩大为整个世界。
- source_word: חֵרֶם
  choice: 使它遭受毁灭之禁令
  rationale: 该词指被置于禁令之下、归于毁灭之物，并非普通的“咒诅”。正文保留“禁令”与“毁灭”两层含义，脚注说明传统译法。
theological_decisions:
- issue: 书卷结尾 חֵרֶם 的处理
  choice: 使它遭受毁灭之禁令
  alternative: 使这地全然毁灭；以咒诅击打这地
  rationale: חֵרֶם是与奉献归属及彻底毁灭相关的审判术语，不等同于普通“咒诅”。译文保留其禁令性质和毁灭后果，不把审判的范围或方式解释得超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“父亲—儿女”保留原文的代际对应；“心转向”保留希伯来语意象。末句使用较少见但可理解的“毁灭之禁令”，并以脚注补足其文化和神学含义。
