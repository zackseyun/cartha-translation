  text: וְ/גָעַרְתִּ֤י לָ/כֶם֙ בָּֽ/אֹכֵ֔ל וְ/לֹֽא יַשְׁחִ֥ת לָ/כֶ֖ם אֶת פְּרִ֣י הָ/אֲדָמָ֑ה וְ/לֹא תְשַׁכֵּ֨ל לָ/כֶ֤ם הַ/גֶּ֨פֶן֙ בַּ/שָּׂדֶ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/011.yaml
  text: And I will rebuke the devourer for you[a], so that it will not destroy for you the fruit of the ground, and the vine in the field will not fail to bear for you[b], says Yahweh of Armies.
translation:
  language: zh_hans
  text: 我必为你们斥责那吞吃者，使它不毁坏你们地里的出产；你们田间的葡萄树不会落果。万军之耶和华说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגָעַרְתִּי
  choice: 我必斥责
  rationale: 保留גָּעַר“斥责、喝止”的权威性及其产生实际制止效果的语气，而不弱化为单纯“约束”或“阻止”。
- source_word: בָּאֹכֵל
  choice: 那吞吃者
  rationale: 分词作名词，指吞噬农作物的破坏者或力量；译文不具体限定为蝗虫、虫害或灾病，以保留原文的开放性。
- source_word: יַשְׁחִת
  choice: 毁坏
  rationale: שׁחת的使役式在农业语境中表示使出产遭到破坏；“毁坏”自然且保留原文较强的力度。
- source_word: פְּרִי הָאֲדָמָה
  choice: 地里的出产
  rationale: פְּרִי本义为果实，整句指土地所出的农产；“地里的出产”在现代汉语中自然，也不把范围缩窄为某一种庄稼。
- source_word: תְשַׁכֵּל
  choice: 落果
  rationale: שׁכל用于葡萄树时借用失去胎儿或后代的形象，表示果实未成熟便失落；“落果”准确传达农业结果，并以脚注保留更直译的比喻。
- source_word: הַגֶּפֶן בַּשָּׂדֶה
  choice: 田间的葡萄树
  rationale: 按定冠词单数和地点短语直译，保持具体的农业图景；不将原文未明说的所有格加入名词本身。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”呈现四字神名，以“万军”表达צְבָאוֹת并承接现代中文读者熟悉的庄重称号；脚注说明其语义。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文公共圣经传统中“耶和华”辨识度高，明确作为专名使用；“雅威”更贴近学界常见的拟音，列作可选译法。原文直接使用神名，不以“主”替代。
- issue: 神圣称号צְבָאוֹת的译法
  choice: 万军
  alternative: 众军
  rationale: “万军”是自然、庄重且广为理解的中文表达，所指可涵盖耶和华统辖的天上众军及一切军旅；不在正文中把其范围限定为某一种军队。
- issue: 对“吞吃者”身份的理解
  choice: 保持未具体指明
  alternative: 明确译作蝗虫或害虫
  rationale: 原文仅用אכל的名词化分词“吞吃者”，没有明确说明是蝗虫、其他害虫、灾病或人格化力量，因此不作超出文本的神学或自然现象判定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“斥责那吞吃者”保留原文拟人化和神圣权威；“落果”使农业意义清楚，同时用脚注保存“流产”的原始比喻。句末“这是……说的”自然呈现先知宣告公式。
