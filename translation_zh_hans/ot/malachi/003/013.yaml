base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/013.yaml
  text: Your words have been hard against me[a], says Yahweh. But you say, “What have we spoken against you?”
translation:
  language: zh_hans
  text: 耶和华说：“你们用强硬的话攻击我[a]。”你们却说：“我们说了什么攻击你的话呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的话严厉地反对我。”希伯来原文可直译为“你们的话向我强硬”；“强硬”在这里形容言辞强烈、严厉。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזְקוּ עָלַי דִּבְרֵיכֶם
  choice: 你们说话严厉地攻击我
  rationale: חזק本义与“强、有力”有关；以“话”为主语并与עַל连用时，表示言辞强硬、严厉地针对某人。中文用“说话严厉地攻击我”自然表达其敌对意味，同时保留言辞严厉这一核心。
- source_word: עָלַי / עָלֶיךָ
  choice: 攻击我 / 攻击你
  rationale: 本节两处עַל前后呼应，语境带有敌对、针对之意；译作“攻击”比“论到”更符合争辩语境。
- source_word: דִּבְרֵיכֶם
  choice: 你们说话
  rationale: 字面为“你们的话”。结合中文表达，转为“你们说话”可避免“你们的话严厉地攻击我”的生硬，同时不改变意义。
- source_word: אָמַר יְהוָה
  choice: 耶和华说
  rationale: 采用现代汉语常见的先说话者、后引语结构；יהוה按中文圣经传统译作“耶和华”，明确保留神的专名。
- source_word: וַאֲמַרְתֶּם
  choice: 你们却说
  rationale: ו在此引出百姓对指控的反问与否认，“却”恰当地表达对比。
- source_word: מַה נִּדְבַּרְנוּ
  choice: 我们说了什么……话呢
  rationale: נִדְבַּרְנוּ在这里宜按言说行为理解。中文反问用“说了什么……话呢”简明自然，也保留百姓质疑指控的语气。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知的传统音译“耶和华”，而不以“主”替代，从而保留这是神的专名；“雅威”是较贴近现代学术重构发音的另一译法。
- issue: 百姓言辞所针对的对象
  choice: 攻击我／攻击你
  alternative: 谈论我／谈论你
  rationale: 两处עַל彼此对应，且חזק修饰言辞，整体语境是神的控诉及百姓的否认，敌对义最为合适；脚注保留“严厉地反对”的表达可能。
translation_notes:
  register: 采用现代、庄重而口语可懂的争辩体。首句调整为自然汉语动词结构；第二句保留百姓反问和否认的语气。脚注标记[a]已置于相关短语之后。
