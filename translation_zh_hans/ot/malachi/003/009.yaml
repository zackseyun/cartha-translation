  naturalness: “你们整个国族都在这样做”可懂，但“国族”在现代普通话圣经语体中较生硬；将末语处理为对“你们全体”的同位强调，会更自然且更贴近希伯来文的收束方式。
  terminology: 保留“咒诅”“抢夺我”和“国”作为本节的关键用语。“受咒诅”准确表达被动分词；以“在咒诅之下”保留前置词短语及重复强调。
