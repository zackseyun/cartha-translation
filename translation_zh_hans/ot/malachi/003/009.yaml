  text: בַּ/מְּאֵרָה֙ אַתֶּ֣ם נֵֽאָרִ֔ים וְ/אֹתִ֖/י אַתֶּ֣ם קֹבְעִ֑ים הַ/גּ֖וֹי כֻּלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/009.yaml
  text: You are cursed with a curse[a], for you are robbing me—the whole nation of you.
translation:
  language: zh_hans
  text: 你们是在咒诅之下受咒诅的[a]，因为你们抢夺我——你们全体，就是整个国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你们在咒诅中受咒诅。”原文以“咒诅”和“受咒诅”重复强调。连接词也可按语境译作“却”：“你们是在咒诅之下受咒诅的，却还抢夺我——你们全体，就是整个国。”
    reason: 说明希伯来文重复的强调语气，并保留连接词可作转折理解的可能性。
lexical_decisions:
- source_word: בַּמְּאֵרָה
  choice: 遭受咒诅
  rationale: מְאֵרָה意为“咒诅”；前缀ב可表达处于某种状态或承受某种作用。中文以“遭受咒诅”自然表达这种受咒诅的状态，而把希伯来语的强调式结构保留在脚注中。
- source_word: נֵאָרִים
  choice: 正遭受咒诅
  rationale: 这是ארר的被动分词，表示百姓处于持续或已形成的受咒诅状态。“正遭受”兼顾其被动与持续意味。
- source_word: וְאֹתִי
  choice: 却还在抢夺我
  rationale: וְ基本义为“而、和”，在此可按上下文理解为转折：“虽正受咒诅，却仍抢夺我”。“我”保留原文前置并受强调的直接宾语。连接词也可能作因果理解，故在脚注说明。
- source_word: קֹבְעִים
  choice: 抢夺
  rationale: קבע在本段指扣留当献之物，从而抢夺或欺诈上帝。“抢夺”清楚有力，也适合与上文反复出现的责问保持一致。
- source_word: הַגּוֹי כֻּלּוֹ
  choice: 你们整个国族
  rationale: 原文意为“整个国族，全体”，强调受责备的是整个群体。译文兼顾第二人称复数和集体性的国家／民族称谓；“都在这样做”自然表达כֻּלּוֹ的全体范围。
theological_decisions:
- issue: 审判的群体范围
  choice: 责备指向整个国族；全体共同被说成正在抢夺上帝并遭受咒诅。
  alternative: 可把“整个国族，全体”主要理解为加强“你们所有人”的语气，而不特别突出国族身份。
  rationale: הַגּוֹי כֻּלּוֹ明确具有集合性，同时上下文使用第二人称复数。译文保留群体责任和直接责问，不引入后来的神学分类。
- issue: 连接词וְ的逻辑关系
  choice: 译作转折性的“却还”，表现他们在受咒诅的状态中仍继续抢夺上帝。
  alternative: 可按因果关系译作“因为”，即他们因抢夺上帝而遭受咒诅。
  rationale: 希伯来语וְ本身未明确限定逻辑关系，两种理解都符合语境。正文采用自然且保留张力的转折表达，脚注注明因果读法，避免静默消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“遭受咒诅”避免生硬复制希伯来语重复结构；“抢夺我”保留原文直接、有力的指控；破折号呈现末尾“整个国族，全体”的补充强调。
