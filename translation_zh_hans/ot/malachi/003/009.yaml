    rationale: בַּמְּאֵרָה（“在／因咒诅中”）与נֵאָרִים（“被咒诅”）并置。草案仅作“正遭受咒诅”，虽通顺，却省去了原文刻意的重复性强调。
  - severity: low
    issue: “国族”不够自然
    rationale: “国族”在当代普通话中较少作为对古代以色列整体的普通叙述用词。“整个国”既保留גּוֹי的集体、国家性称谓，也更符合现代圣经中文语体。
  - severity: low
    issue: 连接词的转折意义不宜在正文中过度确定
    rationale: וְ可作普通连接，也可按语境理解为因果或转折。正文采用“因为”可顺应本节控诉与咒诅的关系；脚注应明确说明亦可理解为转折，保留句法上的讨论空间。
