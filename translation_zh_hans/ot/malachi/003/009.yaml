revisions:
- from: 你们正遭受咒诅[a]，却还在抢夺我——你们整个国族都在这样做。
  to: 你们是在咒诅之下受咒诅的[a]，因为你们抢夺我——你们全体，就是整个国。
  rationale: 修订恢复原文“咒诅／受咒诅”的双重表达，同时以“在咒诅之下”使现代汉语保持可读。末尾改为“你们全体，就是整个国”，将第二人称复数与集合性的הַגּוֹי כֻּלּוֹ均明确呈现，避免“国族”的生硬用语。
