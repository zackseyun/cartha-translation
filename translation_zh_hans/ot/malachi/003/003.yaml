id: MAL.3.3
reference: Malachi 3:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יָשַׁ֨ב מְצָרֵ֤ף וּ/מְטַהֵר֙ כֶּ֔סֶף וְ/טִהַ֤ר אֶת בְּנֵֽי לֵוִי֙ וְ/זִקַּ֣ק אֹתָ֔/ם כַּ/זָּהָ֖ב וְ/כַ/כָּ֑סֶף וְ/הָיוּ֙ לַֽ/יהוָ֔ה מַגִּישֵׁ֥י מִנְחָ֖ה בִּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/003.yaml
  text: He will sit as a refiner and purifier of silver[a], and he will purify the sons of Levi and refine them like gold and like silver, and they will be for Yahweh, presenting an offering in righteousness.
translation:
  language: zh_hans
  text: 他必坐下，作炼银、洁净银子的人；他必洁净利未子孙，熬炼他们如金如银。他们必属耶和华，以公义献上供物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“素祭”。希伯来语“明哈”（minḥah）常特指素祭，也可较广泛地指供物或礼物。
    reason: 保留מִנְחָה可泛指供物、又常特指素祭的词义空间。
lexical_decisions:
- source_word: וְיָשַׁב
  choice: 他必坐下
  rationale: 保留“坐下”的具体形象，呈现炼匠安坐、专注工作的画面，不将其解释性改写为“施行审判”等。
- source_word: מְצָרֵף וּמְטַהֵר כֶּסֶף
  choice: 作熬炼、洁净银子的人
  rationale: 两个分词共同描写炼银者的工作；“熬炼”保留冶金意象，“洁净”又能承载下文涉及礼仪与伦理的双重意味。
- source_word: בְּנֵי לֵוִי
  choice: 利未子孙
  rationale: 忠实保留“利未的众子”这一宗族性表达，同时比逐字译作“利未的儿子们”更符合现代汉语。
- source_word: וְזִקַּק אֹתָם
  choice: 熬炼他们
  rationale: 该动词在此指精炼金属；沿用冶金措辞，使施于祭司群体的比喻清晰连贯。
- source_word: כַּזָּהָב וְכַכָּסֶף
  choice: 如金如银
  rationale: 保留希伯来文两次使用比较介词所形成的对称与强调，中文表达凝练自然。
- source_word: וְהָיוּ לַיהוָה
  choice: 他们就必归耶和华
  rationale: “归耶和华”自然表达归属、奉献和服事关系，同时避免把该短语仅限于所有权含义。
- source_word: מַגִּישֵׁי מִנְחָה
  choice: 献上供物
  rationale: מגישׁ表示呈献，מנחה可泛指供物，也常特指素祭；正文采用较宽的“供物”，具体词义另以脚注说明。
- source_word: בִּצְדָקָה
  choice: 凭公义
  rationale: 保留צדקה的名词性和伦理、敬拜层面的分量；“凭公义”在现代汉语中比生硬的“在公义中”更自然。
- source_word: יהוה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应希伯来文神名。
theological_decisions:
- issue: 熬炼意象所指的对象
  choice: 正文明确保留“利未子孙”，指向祭司群体受到洁净，以便合宜献祭。
  alternative: 将其扩展为全以色列的洁净，或直接译入后来的弥赛亚解释。
  rationale: 本节直接点名利未子孙；更广的正典与弥赛亚应用属于解释层面，不应写入本节译文。
- issue: וְהָיוּ לַיהוָה的关系含义
  choice: 译作“归耶和华”，兼顾归属、奉献与服事。
  alternative: 只译为“向耶和华献上”，将לַיהוָה完全视为献祭的间接宾语。
  rationale: 希伯来语结构允许读出归属或奉献关系；正文保留这一意味，同时由后句说明他们献供物的职分。
- issue: מִנְחָה的具体祭物类别
  choice: 正文译作较宽泛的“供物”。
  alternative: 译作“素祭”。
  rationale: 该词在祭祀语境中常特指素祭，但也可泛指礼物或供物；正文不强行缩窄，脚注保留较具体的理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“熬炼、洁净”维持全节冶金与属灵洁净彼此交叠的意象；分号和句号帮助普通读者把握动作推进。脚注标记置于所解释的“供物”之后。
