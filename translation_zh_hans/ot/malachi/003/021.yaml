revisions:
- from: 你们必践踏恶人，因为在我行动的那日，他们必如灰烬，落在你们脚掌之下。这是万军之耶和华说的。
  to: 在我行动的那日，你们必践踏恶人；他们必成为你们脚掌之下的灰烬。这是万军之耶和华说的。
  rationale: 将“如灰烬”改为“成为……灰烬”，恢复原文直接陈述恶人化为灰烬的结果；删去原文未明示的“落在”。调整语序以使时间短语自然地修饰耶和华的行动，同时保留其未具体说明行动内容的省略性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:17:16Z'
