  verdict: revise
  source_fidelity: 草稿总体准确保留了践踏、恶人、灰烬、脚掌之下、耶和华行动之日及“万军之耶和华”的宣告。惟“必如灰烬”把希伯来文直接的名词谓语“必是灰烬”改成比较说法；“落在”则额外加入灰烬落下的动作，原文未明说。
  naturalness: 整体为自然、庄重的现代标准汉语。“在我行动的那日”可接受；将灰烬句改为“必成为你们脚掌之下的灰烬”，既合乎汉语，也更准确表达审判结果。
  terminology: “恶人”“践踏”“脚掌”“万军之耶和华”均恰当，并与中文圣经语域相称。保留“耶和华”能呈现神名；“万军”适切传达צְבָאוֹת。
