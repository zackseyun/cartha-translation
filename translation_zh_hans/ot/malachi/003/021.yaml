  text: וְ/עַסּוֹתֶ֣ם רְשָׁעִ֔ים כִּֽי יִהְי֣וּ אֵ֔פֶר תַּ֖חַת כַּפּ֣וֹת רַגְלֵי/כֶ֑ם בַּ/יּוֹם֙ אֲשֶׁ֣ר אֲנִ֣י עֹשֶׂ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/021.yaml
  text: And you will trample the wicked[a], for they will be ashes under the soles of your feet on the day when I act, says Yahweh of Armies.
translation:
  language: zh_hans
  text: 在我行动的那日，你们必践踏恶人；他们必成为你们脚掌之下的灰烬。这是万军之耶和华说的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַסּוֹתֶם
  choice: 你们必践踏
  rationale: 该形式在本节按通行词义理解为“践踏、踏下”；“践踏”保留得胜与制伏的具体意象，也符合现代汉语。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是作名词用的复数形容词，指邪恶之人；“恶人”简洁自然，并保留其道德类别。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述践踏的原因，清楚表达解释关系。
- source_word: יִהְיוּ אֵפֶר
  choice: 他们必如灰烬
  rationale: 希伯来文直译是“他们必是灰烬”，但汉语用“如灰烬”可自然表达其成为脚下灰烬的状态；不将此扩展为额外的神学说明。
- source_word: תַּחַת כַּפּוֹת רַגְלֵיכֶם
  choice: 落在你们脚掌之下
  rationale: כַּף 与“脚”连用指脚掌；加入“落在”使汉语句法自然，同时保持灰烬位于脚下的空间图景。
- source_word: בַּיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה
  choice: 在我行动的那日
  rationale: עֹשֶׂה 在此语意有所省略，指耶和华施行决定性作为；“行动”既通顺，也避免擅自补明具体作为。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 采用现代中文圣经语境中清楚而庄重的称号；“万军”涵盖 צְבָאוֹת 的众军、天军含义，“耶和华”呈现专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文读者最熟悉的专名形式是“耶和华”，可明确呈现四字神名而非以“主”替代；“雅威”则更接近学界常用的拟定读音。
- issue: צְבָאוֹת 在神圣称号中的译法
  choice: 万军
  alternative: 众军
  rationale: “万军之耶和华”是自然、庄重且广为理解的中文称号；“万”在此表示众多，并非精确数目，也未限定为单一的人间军队。
- issue: 恶人“是灰烬”的表述
  choice: 必如灰烬
  alternative: 必成为灰烬
  rationale: 原文使用直接的名词谓语“必是灰烬”，未明确标示比喻。“必如灰烬”在中文中保留形象而不显生硬；“必成为灰烬”更直接地按结果状态理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话书面语。保留“践踏—灰烬—脚掌之下”的强烈审判图景，并以“在我行动的那日”保留原文对神之作为的省略性。
