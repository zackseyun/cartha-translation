- from: 那时，敬畏雅威的人彼此交谈[a]；雅威留心聆听。在他面前，有一卷纪念册为那些敬畏雅威、看重他名的人写下。 [b]
  to: 那时，敬畏雅威的人彼此交谈[a]；雅威留心听见了。在他面前，有一卷纪念册写下，记念那些敬畏雅威、看重他名的人[b]。
  rationale: 修订仅处理两处可安全确定的表达问题：以“留心听见了”保留原文两个相连动词的区别；以“有一卷纪念册写下，记念……”构成自然的汉语不指明施事者表达，并传达该册是关于/记念这群人的。脚注 b 移至所注短语后。
