id: MAL.3.16
reference: Malachi 3:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָ֧ז נִדְבְּר֛וּ יִרְאֵ֥י יְהוָ֖ה אִ֣ישׁ אֶת רֵעֵ֑/הוּ וַ/יַּקְשֵׁ֤ב יְהוָה֙ וַ/יִּשְׁמָ֔ע וַ֠/יִּכָּתֵב סֵ֣פֶר זִכָּר֤וֹן לְ/פָנָי/ו֙ לְ/יִרְאֵ֣י יְהוָ֔ה וּ/לְ/חֹשְׁבֵ֖י שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/016.yaml
  text: Then those who feared Yahweh spoke with one another[a], and Yahweh paid attention and heard[b]; and a book of remembrance was written before him for those who fear Yahweh and who esteem his name.
translation:
  language: zh_hans
  text: 那时，敬畏雅威的人彼此交谈[a]；雅威留心听见了。在他面前，有一卷纪念册写下，记念那些敬畏雅威、看重他名的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“各人与自己的同伴”；这是表示彼此交谈的希伯来习语。
    reason: lexical_alternative
  - marker: b
    text: “看重他名”也可译作“思想他名”“顾念他名”或“尊崇他名”。
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 承接上文并标明随后发生的情形；现代汉语中自然清楚。
- source_word: נִדְבְּרוּ
  choice: 交谈
  rationale: 该尼法勒复数形式在语境中具有相互意义；与“彼此”合用，表达互相谈话。
- source_word: יִרְאֵי יְהוָה
  choice: 敬畏雅威的人
  rationale: 保留 ירא 同时包含畏惧、敬重与忠诚信靠的圣经神学分量，不弱化为单纯“尊敬”。
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: 彼此
  rationale: 这是分配性、相互性的希伯来习语；译为“彼此”符合现代汉语，同时脚注保留其字面形式。
- source_word: וַיַּקְשֵׁב
  choice: 留心
  rationale: קשב 表示专注、侧耳留意，比一般的“听见”更强。
- source_word: וַיִּשְׁמָע
  choice: 聆听
  rationale: 与前面的“留心”组成连续表达，既保留两个动词，也避免生硬地译成“留心并听见”。
- source_word: וַיִּכָּתֵב
  choice: 写下
  rationale: 保留尼法勒形式所表达的被动或不指明施事者的意义，不擅自说明是谁书写。
- source_word: סֵפֶר זִכָּרוֹן
  choice: 一卷纪念册
  rationale: סֵפֶר 指书卷或书面记录，זִכָּרוֹן 指为记念而保存的记录；“纪念册”简洁可懂，“一卷”也符合古代书卷语境。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 直接保留空间兼关系性的表达，不具体化为存放地点。
- source_word: לְיִרְאֵי יְהוָה
  choice: 为那些敬畏雅威的人
  rationale: לְ 可表达关涉或受益关系；“为”保留这种范围，不进一步断定具体用途。
- source_word: וּלְחֹשְׁבֵי שְׁמוֹ
  choice: 看重他名的人
  rationale: חשב 在此可指思想、顾念、重视或尊崇；“看重”自然表达对其名的郑重尊重，同时以脚注保留语义幅度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专有名的性质，而不以称号替代。
theological_decisions:
- issue: 如何表达“敬畏雅威”的群体称谓
  choice: 敬畏雅威的人
  alternative: 尊崇主的人
  rationale: “敬畏”保留该词兼具畏惧、崇敬和盟约忠诚的张力；“雅威”则保留原文专有神名。
- issue: 如何处理 וּלְחֹשְׁבֵי שְׁמוֹ 的语义幅度
  choice: 看重他名的人
  alternative: 思想他名的人／顾念他名的人／尊崇他名的人
  rationale: 原词既可涉及思想、留意，也可含重视之意；正文采用自然且能表达郑重态度的“看重”，脚注说明其他可能，避免把意义限定为纯认知或特定敬虔实践。
- issue: 纪念册的书写者
  choice: 采用不指明施事者的表达“写下”
  alternative: 雅威命人写下／他们写下
  rationale: 希伯来文使用被动形式，没有明说书写者；译文不补入未明示的主体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“雅威”作为专有名保留；“敬畏”保留原文的神学分量。句法尽量贴近希伯来文的推进，同时用“彼此交谈”“留心聆听”等现代汉语表达避免逐词硬译。
