    rationale: “为……写下”通常需要明确施事者或动作宾语补足；原文则是不指明施事者的被动句，并说明该纪念册与敬畏雅威、看重其名者有关。改为“有一卷纪念册在他面前写下，记念……”可自然保留被动及关涉。
  - severity: low
