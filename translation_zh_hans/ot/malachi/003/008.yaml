  text: הֲ/יִקְבַּ֨ע אָדָ֜ם אֱלֹהִ֗ים כִּ֤י אַתֶּם֙ קֹבְעִ֣ים אֹתִ֔/י וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה קְבַעֲנ֑וּ/ךָ הַֽ/מַּעֲשֵׂ֖ר וְ/הַ/תְּרוּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/008.yaml
  text: Will a man rob God? Yet you are robbing me[a]. But you say[b], “How have we robbed you?” In the tithe and the contribution.
translation:
  language: zh_hans
  text: 人竟会抢夺上帝吗？你们却在抢夺我[a]！你们还说：“我们在什么事上抢夺了你？”就是在十分之一和奉献之物[b]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抢夺”也可译作“欺诈”或“克扣”。这里指扣留本当归给上帝之物。
    reason: lexical_alternative
  - marker: b
    text: 或译“供物”“捐献”。原词指分别出来、归作神圣用途的奉献之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְבַּע / קֹבְעִים / קְבַעֲנוּךָ
  choice: 抢夺／抢夺／抢夺了
  rationale: קבע在本节指不把当归给上帝之物归给他，带有非法夺取、侵占的强烈意味。“抢夺”保留了先知质问的震撼力；“欺诈”较抽象，“掠夺”则容易让人联想到暴力洗劫。
- source_word: אָדָם
  choice: 人
  rationale: 这里的单数אָדָם泛指人类中的任何人。“人”在现代汉语中自然、简洁，也不带男性专指。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指以色列的上帝；“上帝”是现代汉语中清楚、庄重的对应词。
- source_word: כִּי
  choice: 却
  rationale: 这里引出与反问所表达的常理形成鲜明反差的事实；“却”自然传达这种转折意味。
- source_word: בַּמֶּה
  choice: 在什么事上
  rationale: 此短语询问他们以何种方式或在哪件事上抢夺了上帝。“在什么事上”比单用“怎么”更贴合下文列出的具体事项。
- source_word: הַמַּעֲשֵׂר
  choice: 当献的十分之一
  rationale: 该词指按规定归给上帝的十分之一。“当献的”点明这是应当交纳之物，同时避免只用较专门的教会术语“什一奉献”。
- source_word: הַתְּרוּמָה
  choice: 奉献之物
  rationale: תְּרוּמָה指分别出来供神圣用途的捐献或供物。“奉献之物”既与“十分之一”有别，也不过度限定为某一种礼仪动作。
theological_decisions:
- issue: אָדָם的泛指意义
  choice: 人竟会抢夺上帝吗？
  alternative: 世人岂会抢夺上帝吗？／一个人会抢夺上帝吗？
  rationale: 希伯来文单数אָדָם在此具有普遍、格言式的意义，并非专指男性；汉语“人”能直接保留这种泛指和简短有力的反问。
- issue: קבע所表达的罪责性质
  choice: 抢夺
  alternative: 欺诈／克扣
  rationale: 本节把扣留当归给上帝之物称为直接针对上帝的非法夺取。“抢夺”保留这一尖锐指控，但脚注说明也可按经济欺诈或克扣来理解，避免把词义限定为暴力劫掠。
- issue: 十分之一与奉献之物的关系
  choice: 并列为两类当归给上帝之物
  alternative: 把两词合并理解为泛称的奉献
  rationale: 原文以连接词明确并列הַמַּעֲשֵׂר和הַתְּרוּמָה，因此译文保留二者的区别，不把它们归并成单一制度，也不进一步规定其具体礼仪范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。首句用“竟会……吗”保留反问的惊诧与谴责；“你们却……我”维持从第三人称“上帝”突然转为第一人称神谕的张力。末句补出汉语所需的“是”，但不补充原文没有说明的制度细节。
