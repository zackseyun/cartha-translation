base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/023.yaml
  text: Look[b][a], I am sending Elijah the prophet to you before the coming of the great and fearful day of Yahweh.
translation:
  language: zh_hans
  text: 看哪，我要差遣以利亚先知[a]到你们那里，在耶和华大而可畏的日子来到以前。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以利亚”可理解为先知以利亚本人，也可理解为一位具有以利亚样式的先驱；希伯来文本本身只说“以利亚先知”。
    reason: cross_reference
  - marker: b
    text: “可畏”也可译作“可怕”或“令人敬畏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 用于引出郑重而强调的宣告；“看哪”在现代中文圣经语体中庄重、清楚，也保留了原文的指示和唤起注意之力。
- source_word: אָֽנֹכִי שֹׁלֵחַ
  choice: 我要差遣
  rationale: 独立代词强调说话者，分词则表达迫近或鲜明的将来行动。“我要差遣”符合现代汉语表达，并保留预告的迫切感。
- source_word: לָכֶם
  choice: 到你们那里
  rationale: 此处 לָכֶם 指差遣所面向的对象或目的地；这样表达比单说“给你们”更自然，也避免误解为把以利亚当作物品赐予。
- source_word: אֵלִיָּה הַנָּבִיא
  choice: 以利亚先知
  rationale: 直接保留人名及其同位称号，不在正文中加入其身份或预表意义的解释。
- source_word: לִפְנֵי בּוֹא
  choice: 在……来到以前
  rationale: 直接表达时间上的先后关系，并把希伯来语不定式结构自然转换为现代汉语。
- source_word: יוֹם יְהוָה
  choice: 耶和华……的日子
  rationale: 保留先知书中固定的“耶和华的日子”这一表达，并将四字神名按通行中文圣经传统译为“耶和华”。
- source_word: הַגָּדוֹל
  choice: 伟大
  rationale: 既表达这日子的重大和非凡，也保持庄严语气。
- source_word: וְהַנּוֹרָא
  choice: 而可畏
  rationale: 该词指令人敬畏、惧怕；“可畏”同时保留威严与恐惧的张力，不将其弱化为纯正面的“奇妙”。
theological_decisions:
- issue: “以利亚”的所指
  choice: 正文直译为“以利亚先知”，不作解释性扩展。
  alternative: 理解为一位具有以利亚样式或以利亚之灵与能力的先驱。
  rationale: 希伯来文本直接说“以利亚先知”。译文应保留其本身的开放性，不以正文预先裁定其为本人重临还是以利亚式的先驱。
- issue: “耶和华伟大而可畏的日子”的语气
  choice: 兼顾宏大、威严与令人惧怕的审判色彩。
  alternative: “耶和华伟大而可怕的日子”或“耶和华伟大而令人敬畏的日子”。
  rationale: “可畏”较凝练，既没有把 נוֹרָא 仅仅解释为恐怖，也没有用现代语感偏正面的词削弱其警告意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话圣经语体。“看哪”保留先知性宣告的强调；句序依照自然汉语调整，同时保留原文关于以利亚所指及“可畏”语义的张力。
