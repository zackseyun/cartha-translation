base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/006.yaml
  text: For I[a], Yahweh, do not change; and you, sons of Jacob[b], have not come to an end.
translation:
  language: zh_hans
  text: 因为我——雅威——不改变，你们雅各的子孙[b]也没有灭亡[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“没有被灭尽”“没有消亡”或“没有走到尽头”。希伯来语动词可表示完结、耗尽、灭尽或消亡。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“雅各的儿子们”，是对雅各后裔、即以色列的盟约性称呼。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前文所述事实的根据；“因为”保留希伯来语的解释、因由作用，并与下句自然衔接。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中通行的音译呈现四字神名，保留经文直接使用上帝盟约之名这一特点。
- source_word: לֹא שָׁנִיתִי
  choice: 没有改变
  rationale: שנה在此指“改变”；完成式结合语境表达雅威始终如一。“没有改变”既贴近形式，也可自然传达持续有效的恒常性。
- source_word: וְ/אַתֶּם
  choice: 所以你们……也
  rationale: וְ连接雅威不改变与雅各后裔未灭亡两项陈述；汉语用“所以……也”清楚表达语境中的结果关系。该连接词本身也可较直接地译作“而”。
- source_word: בְּנֵי יַעֲקֹב
  choice: 雅各的子孙
  rationale: 字面为“雅各的儿子们”，在这里是对雅各后裔、即以色列群体的盟约性称呼。“子孙”在现代汉语中自然且准确，不会误解为仅指雅各亲生的几个儿子。
- source_word: לֹא כְלִיתֶם
  choice: 没有灭亡
  rationale: כלה可指完结、耗尽、灭尽或消亡。此处主语是不及物意义上的复数第二人称，指雅各后裔没有走到尽头或被灭尽；“没有灭亡”简明自然，同时以脚注保留其他可能译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”旨在呈现这一专名，而不以“主”等称号替代。
- issue: לֹא שָׁנִיתִי所表达的上帝恒常性
  choice: 没有改变
  alternative: 从不改变
  rationale: “没有改变”紧贴希伯来语完成式，并在上下文中表达雅威始终如一；不额外引入超出经文本句的哲学术语。
- issue: 雅威不改变与雅各后裔未灭亡之间的关系
  choice: 因为……所以……也
  alternative: 因为……而你们……没有灭亡
  rationale: 上下文支持因由—结果关系；现代汉语需要较明确的关联结构才自然。此译法没有把“未灭亡”解释成无条件保障，而保留本节在审判与盟约信实之间的张力。
- issue: בְּנֵי יַעֲקֹב的群体指称
  choice: 雅各的子孙
  alternative: 雅各的儿子们
  rationale: 该短语在此指雅各的后裔，即以色列群体，而非只指男性或雅各的直接儿子；脚注注明其字面形式和盟约含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“因为……所以……”使句间逻辑符合汉语习惯；“雅各的子孙”保留群体和盟约色彩，同时避免将原文误解为仅指雅各的亲生儿子。脚注标记均置于其所解释的词语之后。
