id: MAL.3.12
reference: Malachi 3:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִשְּׁר֥וּ אֶתְ/כֶ֖ם כָּל הַ/גּוֹיִ֑ם כִּֽי תִהְי֤וּ אַתֶּם֙ אֶ֣רֶץ חֵ֔פֶץ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/012.yaml
  text: Then all the nations will call you blessed[a], for you will be a delightful land, says Yahweh of hosts.
translation:
  language: zh_hans
  text: 万国都要称你们为有福的，因为你们必成为可喜爱之地；万军之耶和华说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִשְּׁרוּ
  choice: 都要称……为有福的
  rationale: 该词为 אשר 的 Piel 形式，表示公开称某人为有福或幸福；“称……为有福的”自然且保留宣告和认可之意。
- source_word: כָּל הַגּוֹיִם
  choice: 万国
  rationale: גּוֹיִם 在此泛指各国或各民族；“万国”简洁庄重，也避免采用后来具有技术性色彩的“外邦人”。
- source_word: כִּי
  choice: 因为
  rationale: 引出万国称他们有福的原因，因果关系明确。
- source_word: תִהְיוּ אַתֶּם
  choice: 你们必成为
  rationale: היה 的未完成式在此表达将来的状态；独立代词 אַתֶּם 带有强调意味，但汉语直接保留“你们”即可自然表达。
- source_word: אֶרֶץ חֵפֶץ
  choice: 令人喜悦之地
  rationale: 该短语可直译为“喜悦之地”或“可喜爱之地”，既可能强调这地带来喜悦，也可能强调它令人向往；正文采用自然而庄重的“令人喜悦之地”，脚注保留词义幅度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式音译四字神名，保留其作为以色列之神名字的性质，而不以称号替代。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: “万军之耶和华”是自然、庄重且广为理解的固定表达；“万军”保留该词可涵盖天上和地上众军的广度。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神名。中文正文采用长期通行且普通读者易于辨识的专名“耶和华”，不以“主”等称号替代；“雅威”是另一种较贴近学术重构读音的音译。
- issue: אֶרֶץ חֵפֶץ 所表达的蒙福状态
  choice: 令人喜悦之地
  alternative: 可喜爱之地；令人向往之地
  rationale: 原文的 חֵפֶץ 可指喜悦、乐意或所喜爱的对象。译文不限定究竟是谁喜悦这地，也不把它缩减为单纯物质繁荣，从而保留其评价上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“万国”“有福”“万军之耶和华”与先知书语体协调；句末将神谕公式译为独立句，使中文清晰有力。
