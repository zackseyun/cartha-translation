  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שַׁבְתֶּם֙ וּ/רְאִיתֶ֔ם בֵּ֥ין צַדִּ֖יק לְ/רָשָׁ֑ע בֵּ֚ין עֹבֵ֣ד אֱלֹהִ֔ים לַ/אֲשֶׁ֖ר לֹ֥א עֲבָדֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/018.yaml
  text: Then you will again see the difference between the righteous and the wicked[a], between one who serves God and one who does not serve him.
translation:
  language: zh_hans
  text: 那时，你们必再次看出义人和恶人之间的区别[a]，也看出事奉上帝的人和不事奉他的人之间的区别。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“那时，你们必回来，看见义人与恶人之间的分别。”希伯来语这一表达很可能是说，他们将再次察觉这种区别。
    reason: 说明וְשַׁבְתֶּם的字面意义及其在本句中的惯用含义。
lexical_decisions:
- source_word: וְשַׁבְתֶּם
  choice: 那时，你们必再次
  rationale: שׁוב本义为“返回、回转”，但与后面的“看见”连用，在此自然表达重新看见或再次认识；译作“再次”既符合现代汉语，也保留重新辨识的含义。
- source_word: וּרְאִיתֶם
  choice: 看出
  rationale: ראה通常意为“看见”；本句语境强调察觉两类人之间的分别。“看出”保留视觉措辞，同时自然表达辨识之意。
- source_word: בֵּין ... לְ
  choice: ……和……之间的区别
  rationale: 重复的בֵּין构成鲜明对比。现代汉语用“看出……之间的区别”可清楚传达希伯来语隐含的区别意义。
- source_word: צַדִּיק
  choice: 义人
  rationale: צַדִּיק指公义、正直的人；“义人”是简明、庄重且沿用已久的现代中文圣经用语。
- source_word: רָשָׁע
  choice: 恶人
  rationale: רָשָׁע在先知书及智慧文学中常与צַדִּיק相对，指邪恶的人；“恶人”准确保留这一道德与神学对比。
- source_word: עֹבֵד אֱלֹהִים
  choice: 事奉上帝的人
  rationale: עבד以上帝为宾语时，涵盖敬拜、忠诚和顺服。“事奉上帝”保留其广度，不将含义缩窄为礼仪性的敬拜。
- source_word: לַאֲשֶׁר לֹא עֲבָדוֹ
  choice: 不事奉他的人
  rationale: 此关系从句与“事奉上帝的人”直接相对，动词后的代词指上帝。译作“不事奉他的人”适合类别性对比，也不强行突出希伯来语完成式可能具有的“未曾事奉”意味。
theological_decisions:
- issue: 是否把这一区别明确解释为末日审判
  choice: 译为将来再次看出义人与恶人的区别，不加入“末日审判”等解释性措辞。
  alternative: 明确译成“到审判时，你们就会再次分辨”。
  rationale: 上下文涉及上帝将要采取的行动以及对义人的伸冤，但本节本身只说听众将再次看见这一区别；译文保留原文张力，不补入原文未明说的教义细节。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“义人／恶人”和“事奉上帝／不事奉他”保持原文两组平行对比；“看出……之间的区别”以自然中文呈现希伯来语的比较结构。
