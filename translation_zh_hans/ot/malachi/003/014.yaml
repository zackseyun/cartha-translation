language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲמַרְתֶּ֕ם שָׁ֖וְא עֲבֹ֣ד אֱלֹהִ֑ים וּ/מַה בֶּ֗צַע כִּ֤י שָׁמַ֨רְנוּ֙ מִשְׁמַרְתּ֔/וֹ וְ/כִ֤י הָלַ֨כְנוּ֙ קְדֹ֣רַנִּ֔ית מִ/פְּנֵ֖י יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/014.yaml
  text: You have said[a], ‘It is vain to serve God[d][c][b]. And what profit is it that we have kept his charge and that we have walked in mourning before Yahweh of hosts?’
translation:
  language: zh_hans
  text: 你们说：“事奉上帝是徒然的[a]。我们遵守他的吩咐[b]，在万军之雅威面前忧伤地行走[c]，有什么益处[d]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “徒然”也可译作“毫无用处”或“徒劳”。
    reason: lexical_alternative
  - marker: b
    text: “他的吩咐”也可译作“他所要求的”或“他的规定”。
    reason: lexical_alternative
  - marker: c
    text: “忧伤地行走”也可理解为“神情阴郁地行走”，或指穿着丧服、表现哀恸或悔罪的样子。
    reason: lexical_alternative
  - marker: d
    text: “益处”也可译作“所得”或“利益”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: 徒然
  rationale: 表示空虚、无效或徒劳；“徒然”自然保留说话者认为事奉毫无成效的判断。
- source_word: עֲבֹד
  choice: 事奉
  rationale: 此处泛指向上帝尽服事之责，并不局限于礼仪性敬拜；“事奉”符合中文圣经语体且含义宽广。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 语境明确指以色列的上帝；“上帝”是现代普通话中自然而庄重的对应词。
- source_word: בֶּצַע
  choice: 益处
  rationale: 原词可指利益、收益或所得；“益处”适合反问句，也保留说话者计较回报的意味。
- source_word: מִשְׁמַרְתּוֹ
  choice: 他的吩咐
  rationale: 原词指受托遵守的责任、规定或要求；“他的吩咐”较“职守”自然，同时保留顺服义务的含义。
- source_word: קְדֹרַנִּית
  choice: 哀伤而行
  rationale: 该副词带有阴沉、悲哀、服丧般举止的含义；“哀伤而行”保留其行为方式，且不武断限定为穿黑衣。
- source_word: מִפְּנֵי
  choice: 在……面前
  rationale: 与神圣位格连用时自然表示在其面前或临在中；此处不译成因果性的“因为”。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”对应四字神名，以“万军”保留צְבָאוֹת所含天军、众军的意象；整体也是庄重且易懂的传统中文称号。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文普通读者对“耶和华”更为熟悉，且它作为专名区别于称号“主”；脚注注明“雅威”这一更贴近学术重构发音的译法，以透明呈现选择。
- issue: 说话者对宗教行为的抱怨范围
  choice: 把事奉上帝、遵守其吩咐和哀伤而行并列为他们认为没有益处的虔敬行为
  alternative: 仅指礼仪性的禁食或服丧行为
  rationale: 希伯来语句法将这些行为相联，但没有明确限定为某一种礼仪；译文保留广义抱怨，不补入经文未明说的动机或仪式背景。
- issue: קְדֹרַנִּית 所指的具体表现
  choice: 哀伤而行
  alternative: 神情阴郁地行走／穿黑衣而行
  rationale: 原词兼有阴沉、悲哀及可能穿丧服的联想；正文不把具体外在形式定死，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“事奉”“万军之耶和华”保留经文的宗教与称号语域；句式调整为自然中文反问。正文中的每个脚注标记均按顺序出现，并将可能影响理解的词义选择置于脚注。
