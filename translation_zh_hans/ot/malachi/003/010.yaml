source:
  edition: WLC
  text: הָבִ֨יאוּ אֶת כָּל הַֽ/מַּעֲשֵׂ֜ר אֶל בֵּ֣ית הָ/אוֹצָ֗ר וִ/יהִ֥י טֶ֨רֶף֙ בְּ/בֵיתִ֔/י וּ/בְחָנ֤וּ/נִי נָא֙ בָּ/זֹ֔את אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת אִם לֹ֧א אֶפְתַּ֣ח לָ/כֶ֗ם אֵ֚ת אֲרֻבּ֣וֹת הַ/שָּׁמַ֔יִם וַ/הֲרִיקֹתִ֥י לָ/כֶ֛ם בְּרָכָ֖ה עַד בְּלִי דָֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/010.yaml
  text: Bring the full tithe into the storehouse[a], so that there may be food in my house. And test me now in this, says Yahweh of hosts[c][b], whether I will not open for you the windows of heaven and pour out for you blessing until there is no more need.
translation:
  language: zh_hans
  text: 你们要把全部的十分之一奉献送进仓库[a]，使我的殿中有食物。万军之耶和华说：“现在就以此试试我，看我是否会为你们打开天上的窗户[b]，把福分倾倒给你们，以致绰绰有余[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全部的十分之一奉献”也可译作“所有的十分之一”或“完整的十分之一”。
    reason: lexical_alternative
  - marker: b
    text: “天上的窗户”也可译作“天上的闸门”；希伯来文直译为“天上的窗户”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文指丰盛到超过所需。传统上也译作“直到无处可容”或“不可胜数”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאוּ
  choice: 送进
  rationale: 使役命令式在此表示把所献之物带入指定地点；“送进”自然地保留了方向和命令语气。
- source_word: כָּל הַמַּעֲשֵׂר
  choice: 全部的十分之一奉献
  rationale: כָּל 强调完整、毫无扣留；מַעֲשֵׂר 指献上的十分之一。译文兼顾总量含义和现代中文可懂性。
- source_word: בֵּית הָאוֹצָר
  choice: 仓库
  rationale: 原文直指储藏物资的房屋；上下文是圣殿的储藏设施，“仓库”简洁准确，不另行限定其制度性质。
- source_word: וִיהִי
  choice: 使……有
  rationale: 该祈愿式承接命令，表达目的或结果；中文以“使”清楚呈现这一关系。
- source_word: טֶרֶף
  choice: 食物
  rationale: 此词本可指猎物，但在圣殿供给的语境中指可供食用的物资；“食物”最直接。
- source_word: בְּבֵיתִי
  choice: 我的殿中
  rationale: 字面为“我的家中／我的房屋中”；在本段明确指耶和华的圣殿，中文“我的殿中”避免误解，同时保留第一人称归属。
- source_word: וּבְחָנוּנִי נָא בָּזֹאת
  choice: 现在就以此试试我
  rationale: 保留神罕见地邀请人检验他的挑战语气；נָא 在这里以“现在就”表达即时性和强调。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”呈现专名，צְבָאוֹת 译作“万军”以保留其天军、众军与宇宙统御的称号色彩。
- source_word: אִם לֹא
  choice: 看我是否会
  rationale: 置于“试试我”之后，引出所要验证的内容；疑问式中文保留希伯来文强烈肯定但仍具修辞张力的结构。
- source_word: אֶפְתַּח ... אֲרֻבּוֹת הַשָּׁמַיִם
  choice: 打开天上的窗户
  rationale: אֲרֻבּוֹת 字面是窗户或开口；采用字面意象，并以脚注提示“闸门”这一语境化译法。
- source_word: וַהֲרִיקֹתִי לָכֶם בְּרָכָה
  choice: 把福分倾倒给你们
  rationale: הריק 在此有倒出、倾注之意；“福分”保留 בְּרָכָה 的宽泛性，不将承诺限定为某一种物质收益。
- source_word: עַד בְּלִי דָי
  choice: 直到丰盛无比
  rationale: 该短语语义和句法存在争议，核心意象是超出足用、难以容纳或不可测度的充盈；正文用自然中文保留其丰盛含义，脚注列出传统理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用普通简体中文读者最熟悉、且作为专名使用的“耶和华”；不以“主”替代原文神名，也不借此引入额外教义解释。
- issue: 所应许福分的具体性质
  choice: 宽泛的“福分”
  alternative: 物质富足或农业丰收
  rationale: 上下文涉及圣约中的农业供给，但 בְּרָכָה 本身没有把应许限于单一类别，因此不把经文改写成狭义的致富保证。
- issue: “试试我”的神学张力
  choice: 直译保留神的邀请
  alternative: 意译为“信靠我”
  rationale: 原文明确使用 בחן“试验、检验”；即使这一邀请不同寻常，也不应将其弱化或改写为一般性的信靠劝勉。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留命令、神直接发言和天窗倾福的经文意象；避免商业化、成功神学式措辞。所有脚注标记均置于正文相应词句之后。
