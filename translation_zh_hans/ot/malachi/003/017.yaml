source:
  edition: WLC
  text: וְ/הָ֣יוּ לִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת לַ/יּ֕וֹם אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה סְגֻלָּ֑ה וְ/חָמַלְתִּ֣י עֲלֵי/הֶ֔ם כַּֽ/אֲשֶׁר֙ יַחְמֹ֣ל אִ֔ישׁ עַל בְּנ֖/וֹ הָ/עֹבֵ֥ד אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/017.yaml
  text: And they will be mine[a], says Yahweh of Armies, on the day when I make them a treasured possession[c][b], and I will spare them as a man spares his son who serves him.
translation:
  language: zh_hans
  text: 万军之耶和华说：“在我使他们成为珍贵的产业[a]的那日，他们必属于我。我必顾惜他们，正如人顾惜那服侍他的儿子一样[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “珍贵的产业”指君王或主人特别珍视、专归自己所有的财产；也可译作“珍藏”或“特别的产业”。
    reason: lexical_alternative
  - marker: b
    text: “顾惜”所译的希伯来词也可表示“怜悯”或“饶过”；这里以人顾惜服侍他的儿子作比喻。
    reason: lexical_and_contextual_note
lexical_decisions:
- source_word: וְהָיוּ לִי
  choice: 他们必属于我
  rationale: 直译其将来归属关系，既自然，也保留盟约语境中的归属意味。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”按现代中文圣经传统呈现四字神名；“万军”保留צְבָאוֹת所含天上与军事群体的广阔意味。
- source_word: לַיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה סְגֻלָּה
  choice: 到了我把他们作为珍贵产业的那日
  rationale: 将עֹשֶׂה与סְגֻלָּה理解为“使／作为珍贵产业”，宾语由上下文中的“他们”补足；同时保留这是特定将来之日的表达。
- source_word: סְגֻלָּה
  choice: 珍贵产业
  rationale: 该词指君王或主人特别珍视、专归自己所有的财产；“珍贵产业”兼顾价值与归属，不把它弱化为一般财物。
- source_word: וְחָמַלְתִּי עֲלֵיהֶם
  choice: 我必顾惜他们
  rationale: חמל兼有怜悯、顾惜和不加毁灭之意；“顾惜”在中文中能够保留慈爱与免受惩罚两方面的张力。
- source_word: כַּאֲשֶׁר יַחְמֹל אִישׁ עַל בְּנוֹ
  choice: 正如人顾惜自己的儿子一样
  rationale: 重复使用“顾惜”以对应原文同一动词חמל，并保留“人—儿子”的明确男性亲属图像。
- source_word: הָעֹבֵד אֹתוֹ
  choice: 服侍自己的
  rationale: עבד在此描述儿子对父亲的服侍；“服侍”比单纯“为他工作”更能保留关系与忠诚意味。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉且庄重的专名形式“耶和华”，明确呈现专有神名，而不以“主”替代。
- issue: סְגֻלָּה是否明确加上第一人称所有格
  choice: 珍贵产业
  alternative: 我珍爱的产业／我的珍贵产业
  rationale: 希伯来词本身没有显式第一人称后缀，但前句“属于我”已清楚表明归属；正文不额外加入“我的”，脚注说明其专属含义。
- issue: חמל译作怜悯还是免除惩罚
  choice: 顾惜
  alternative: 怜悯／饶过
  rationale: 原词在此既可强调父亲般的怜爱，也可指在审判中保全、饶过；“顾惜”避免只固定其中一面。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“到了……的那日”保留先知性时间表达；“必属于我”“珍贵产业”“顾惜”均为普通读者可理解的现代表述，同时避免把原文关于归属、怜悯与免受审判的张力过度解释。
