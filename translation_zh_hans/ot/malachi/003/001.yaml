id: MAL.3.1
reference: Malachi 3:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנְ/נִ֤י שֹׁלֵחַ֙ מַלְאָכִ֔/י וּ/פִנָּה דֶ֖רֶךְ לְ/פָנָ֑/י וּ/פִתְאֹם֩ יָב֨וֹא אֶל הֵיכָל֜/וֹ הָ/אָד֣וֹן אֲשֶׁר אַתֶּ֣ם מְבַקְשִׁ֗ים וּ/מַלְאַ֨ךְ הַ/בְּרִ֜ית אֲשֶׁר אַתֶּ֤ם חֲפֵצִים֙ הִנֵּה בָ֔א אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/001.yaml
  text: Behold[a], I am sending my messenger, and he will clear the way before me. And suddenly the Lord whom you seek will come to his temple, and the messenger of the covenant in whom you delight—behold, he is coming[b], says Yahweh of Armies.
translation:
  language: zh_hans
  text: “看哪，我要差遣我的使者[a]，他必在我面前清理道路。你们所寻求的主必忽然来到他的殿；你们所喜悦的盟约的使者——看哪，他就要来了。”这是万军之耶和华说的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“天使”；本节“使者”和“盟约的使者”所对应的希伯来词都可有这两种含义。
    reason: lexical_alternative
  - marker: b
    text: “万军之耶和华”传统也常译作“万军之主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: הִנֵּה与第一人称后缀构成强调性的宣告；结合后面的分词，用“看哪，我要”自然表达行动迫近且确定，同时保留先知话语的力度。
- source_word: שֹׁלֵחַ
  choice: 差遣
  rationale: 分词与הִנְנִי连用，表示即将发生或确定的行动；现代汉语以“我要差遣”表达最自然。
- source_word: מַלְאָכִי
  choice: 我的使者
  rationale: מַלְאָךְ既可指传信的“使者”，也可指“天使”；此处其职责是预备道路，“使者”较宽泛，不预先限定其性质，另一义置于脚注。
- source_word: וּפִנָּה
  choice: 他必……清理
  rationale: פנה在此词形中有清除障碍、预备之意；“清理道路”保留具体意象，也符合现代汉语。
- source_word: דֶרֶךְ לְפָנָי
  choice: 在我面前清理道路
  rationale: 保留第一人称“我”，明确道路是在说话者耶和华面前预备；不因后文身份问题而改写。
- source_word: וּפִתְאֹם
  choice: 必忽然
  rationale: 忠实表达来临的突然性；“必”同时承接未完成式在预言语境中的确定性。
- source_word: יָבֹוא אֶל הֵיכָלוֹ
  choice: 来到他的殿
  rationale: הֵיכָל可指宫殿或圣殿；本书祭祀和敬拜语境明确指向圣殿，简体中文经文体用“殿”自然凝练。
- source_word: הָאָדוֹן
  choice: 主
  rationale: 带定冠词的אָדוֹן在此是尊称；“主”保留庄重和崇高意味，但不额外明说其身份。
- source_word: אֲשֶׁר אַתֶּם מְבַקְשִׁים
  choice: 你们所寻求的
  rationale: 分词表示持续的寻求，“所寻求的”在现代书面汉语中自然，并保持关系从句结构。
- source_word: וּמַלְאַךְ הַבְּרִית
  choice: 立约使者
  rationale: 直译可作“那约的使者”；“立约使者”是自然凝练的汉语表达，保留其与约的特定关系而不解释这种关系的性质。
- source_word: אֲשֶׁר אַתֶּם חֲפֵצִים
  choice: 你们所喜悦的
  rationale: חפץ兼有喜爱、乐意和渴望之意；“所喜悦的”保留对这位人物的正面期待和关系意味。
- source_word: הִנֵּה בָא
  choice: 看哪，他就要来了
  rationale: “看哪”保留指示和强调功能，“就要来了”传达分词所呈现的鲜明临近感。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 按专名与称号直译：יהוה音译为“耶和华”，צְבָאוֹת译作“万军”，保留其统领众军的称号意象。
theological_decisions:
- issue: “主”与“立约使者”的身份关系
  choice: 并列直译两个称号，不在译文中判定二者是同一位还是彼此有别。
  alternative: 把二者明确处理为同一位；或以措辞明确区分为两位。
  rationale: 希伯来文的并列结构容许紧密同位理解，却没有要求译者消除其语法和神学张力；破折号保留连续宣告而不作身份裁决。
- issue: הָאָדוֹן在常被视为弥赛亚预言的经文中的译法
  choice: 主
  alternative: 主人；统治者
  rationale: “主”符合该称号在圣殿来临语境中的崇高力度，也不把后来的基督论认定直接写入原文。
- issue: 第一人称说话者与来到圣殿者的关系
  choice: 保留“在我面前”及“他的殿”的人称转换。
  alternative: 为使身份关系显得一致而统一代词，或在译文中加以解释。
  rationale: 原文确有从“我”到“他的”的表达变化；忠实保留可避免替读者解决经文本身留下的身份张力。
translation_notes:
  register: 采用庄重而可懂的现代标准普通话。“看哪”保留先知宣告的修辞力度；“清理道路”比单纯“预备道路”更清楚呈现移除障碍的意象。主句用分号与破折号保持原文推进和并列关系，不解释“主”与“立约使者”是否同指一位。所有脚注标记均已置于正文。
