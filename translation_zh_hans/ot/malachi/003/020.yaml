source:
  edition: WLC
  text: וְ/זָרְחָ֨ה לָ/כֶ֜ם יִרְאֵ֤י שְׁמִ/י֙ שֶׁ֣מֶשׁ צְדָקָ֔ה וּ/מַרְפֵּ֖א בִּ/כְנָפֶ֑י/הָ וִֽ/יצָאתֶ֥ם וּ/פִשְׁתֶּ֖ם כְּ/עֶגְלֵ֥י מַרְבֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/020.yaml
  text: But for you who fear my name[a], the sun of righteousness will rise with healing in its wings[c][b]; and you will go out and leap like calves from the stall.
translation:
  language: zh_hans
  text: 但对你们这些敬畏我名的人，公义[a]的太阳必升起；它的翅膀上有医治[b]。你们必出来，像圈里的牛犊一样欢跳[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可理解为“正义”或“伸冤得正义”。希伯来语词可涵盖公义、正义或伸冤的含义。
    reason: 保留צְדָקָה的语义范围，并将说明准确锚定于“公义”。
  - marker: b
    text: “翅膀”在太阳的意象中也可指阳光的边缘或光芒。
    reason: 保留כָּנָף在太阳意象中的隐喻可能，并准确锚定于“翅膀”。
  - marker: c
    text: “欢跳”所译的希伯来语动词较罕见，也可理解为“蹦跳”或“嬉跃”；另有解释作“长得肥壮”。
    reason: 说明罕见动词וּפִשְׁתֶּם的词义不确定性。
lexical_decisions:
- source_word: וְזָרְחָה
  choice: 必升起
  rationale: זרח常指日月等发光体升起或照耀；“升起”自然延续太阳的意象，“必”体现此处预告的确定性。
- source_word: יִרְאֵי שְׁמִי
  choice: 你们这些敬畏我名的人
  rationale: 结合לָכֶם的第二人称指向，明确译出受话者；“敬畏我名”保留原文表达，不将“名”泛化为神本身。
- source_word: שֶׁמֶשׁ צְדָקָה
  choice: 公义的太阳
  rationale: 保留原文鲜明而含义宽广的隐喻；צדקה可涵盖公义、正义和伸冤，不在正文中收窄为单一法庭意义。
- source_word: וּמַרְפֵּא בִּכְנָפֶיהָ
  choice: 其翅膀带着医治
  rationale: מרפא译作“医治”，כנף直译“翅膀”，保留太阳被拟人化的具体意象；“带着”自然表达医治与翅膀相伴。
- source_word: וִיצָאתֶם
  choice: 你们必出来
  rationale: יצא表示出去或出来；此处与牛犊离开圈栏的比喻相呼应，“出来”较自然。
- source_word: וּפִשְׁתֶּם
  choice: 欢跳
  rationale: 该罕见动词在语境中很可能描写牛犊获释后的活跃动作；“欢跳”兼顾动作和喜悦色彩，同时以脚注保留不确定性。
- source_word: כְּעֶגְלֵי מַרְבֵּק
  choice: 像从圈里放出的牛犊一样
  rationale: מרבק指畜栏或育肥之处。补出“放出的”不是对应独立词项，而是借上下文显明“出来”与牛犊欢跳之间的比喻关系。
theological_decisions:
- issue: “公义的太阳”的弥赛亚解释
  choice: 正文保留隐喻，不直接将其认定为弥赛亚。
  alternative: 将“公义的太阳”明确译解为弥赛亚或基督的称号。
  rationale: 希伯来文本直接呈现的是为敬畏上帝之名者升起、带来医治的拯救性意象；虽然基督教传统常作弥赛亚式理解，译文不应把正文未明说的身份认定加入其中。
- issue: צדקה的意义范围
  choice: 正文采用“公义”，脚注说明也可理解为“伸冤得正义”。
  alternative: 正文译为“伸冤的太阳”或“正义的太阳”。
  rationale: “公义”能较宽地容纳道德、司法和拯救层面的含义，避免把末世性应许仅限于法庭式昭雪。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“公义的太阳”“翅膀”等核心诗性意象；用“圈”而非较书面的“厩”增强可理解性。所有脚注标记均已置于正文对应位置。
