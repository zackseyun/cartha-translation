source:
  edition: WLC
  text: לְ/מִ/ימֵ֨י אֲבֹתֵי/כֶ֜ם סַרְתֶּ֤ם מֵֽ/חֻקַּ/י֙ וְ/לֹ֣א שְׁמַרְתֶּ֔ם שׁ֤וּבוּ אֵלַ/י֙ וְ/אָשׁ֣וּבָה אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֥ה נָשֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/007.yaml
  text: From the days of your fathers you have turned aside from my statutes and have not kept them. Return to me[a], and I will return to you, says Yahweh of hosts. But you say, “How shall we return?”
translation:
  language: zh_hans
  text: 从你们祖先的日子以来，你们就偏离了我的律例，未曾遵守。你们要归向我，我就归向你们——万军之耶和华说。你们却问：“我们该怎样归向呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִימֵי אֲבֹתֵיכֶם
  choice: 从你们祖先的日子以来
  rationale: 介词短语表示从过去延续至今的时间范围；אבות在此泛指历代先祖，译作“祖先”比现代汉语的“父亲们”自然准确。
- source_word: סַרְתֶּם מֵחֻקַּי
  choice: 你们就偏离了我的律例
  rationale: סור含有偏离道路或准则的意象；“偏离”保留这一隐喻，חֻקַּי译为契约与律法语境中庄重明确的“我的律例”。
- source_word: וְלֹא שְׁמַרְתֶּם
  choice: 没有遵守
  rationale: שׁמר在律法语境中指谨守、遵行；“遵守”自然地承接前面的“律例”，无须重复宾语。
- source_word: שׁוּבוּ אֵלַי
  choice: 回到我这里来
  rationale: שׁוב既可指返回，也带有悔改归向之意；此译保留空间性的“回来”表达，同时不把悔改含义过度明说。
- source_word: וְאָשׁוּבָה אֲלֵיכֶם
  choice: 我也必回到你们那里去
  rationale: 重复“回到”以保留原文两次שׁוב形成的对应修辞；“必”表达此处意愿式/应许性的语气。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”直接呈现四字神名在现代中文圣经传统中的通行形式；“万军之”保留צְבָאוֹת所含天上军旅或众军的意象。
- source_word: בַּמֶּה נָשׁוּב
  choice: 我们该怎样回转呢？
  rationale: בַּמֶּה询问方式，“怎样”符合现代汉语；末句改用“回转”可自然表达百姓询问如何改变方向、重新归向，而不消除其质疑或不自知的语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代简体中文圣经语域中“耶和华”辨识度最高，也与“万军之”搭配自然；“雅威”更贴近主流学界对古代发音的重构，但中文接受度较低。
- issue: “你们回到我这里”与“我回到你们那里”的相互关系
  choice: 保留同一动词的对称表达
  alternative: 将后半句解释为“我就重新赐福给你们”
  rationale: 原文两处均使用שׁוב，形成刻意的呼应。直译保留盟约关系中的张力，不把神“回来”的具体表现限定为赐福或临在。
- issue: 百姓末句的语气
  choice: 译为开放而略带质疑的“我们该怎样回转呢？”
  alternative: 解释为悔改求问“我们应当怎样归向你？”
  rationale: 原文只问方式，既可能是不明白，也可能带有抗辩意味；不在正文中替读者确定其主观态度。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。句中破折号标明先知话语后的发言者公式；“律例”“万军之耶和华”保留经文语域。“回来/回到”与“回转”兼顾原文重复和中文自然度。
