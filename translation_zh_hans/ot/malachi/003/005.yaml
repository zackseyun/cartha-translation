source:
  edition: WLC
  text: וְ/קָרַבְתִּ֣י אֲלֵי/כֶם֮ לַ/מִּשְׁפָּט֒ וְ/הָיִ֣יתִי עֵ֣ד מְמַהֵ֗ר בַּֽ/מְכַשְּׁפִים֙ וּ/בַ/מְנָ֣אֲפִ֔ים וּ/בַ/נִּשְׁבָּעִ֖ים לַ/שָּׁ֑קֶר וּ/בְ/עֹשְׁקֵ֣י שְׂכַר שָׂ֠כִיר אַלְמָנָ֨ה וְ/יָת֤וֹם וּ/מַטֵּי גֵר֙ וְ/לֹ֣א יְרֵא֔וּ/נִי אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/005.yaml
  text: Then I will come near to you for judgment[a], and I will be a swift witness against sorcerers, against adulterers, against those who swear falsely, against those who oppress the wage of a hired worker, the widow, and the fatherless, and those who turn aside the sojourner, and do not fear me[c][b], says Yahweh of Armies.
translation:
  language: zh_hans
  text: “我要临近你们，施行审判；我要迅速作证，指控行邪术的、通奸的、起假誓的、克扣雇工工资[a]的、欺压寡妇和孤儿的、屈枉寄居者[b]的，以及又不敬畏我的人。”万军之耶和华[c]说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“欺压雇工的工资”，意思可能是扣留或侵吞雇工应得的工资。
    reason: 说明希伯来语的具体表达及正文所作的自然化处理。
  - marker: b
    text: “寄居者”也可译作“外来居民”或“外族人”，指住在以色列人中、应受当地社会保护的非本地人。原文动词有“使偏离、屈枉”之意。
    reason: 保留 גֵר 的社会法律含义，并说明 נטה 在此语境中的语义。
  - marker: c
    text: “耶和华”也常音译作“雅威”；“万军之耶和华”传统上也有译作“万军之主”的。
    reason: 交代神名读法与传统称号译法。
lexical_decisions:
- source_word: וְקָרַבְתִּי אֲלֵיכֶם לַמִּשְׁפָּט
  choice: 我要临近你们，施行审判
  rationale: 保留“临近你们”的方向性及司法语境；将目的短语译为自然的现代汉语“施行审判”，不改译为含义更强的“审判你们”。
- source_word: וְהָיִיתִי עֵד מְמַהֵר
  choice: 我要迅速作证，指控
  rationale: “迅速作证”传达神立即充当证人的意思；补出“指控”以自然连接后面由介词标出的被控对象，而没有把神仅仅写成法官。
- source_word: בַּמְכַשְּׁפִים
  choice: 行邪术的
  rationale: 指从事法术的人；此译法简明，并避免“女巫”等带有性别或特定文化色彩的称呼。
- source_word: וּבַמְנָאֲפִים
  choice: 通奸的
  rationale: 直接表达该分词所指惯行或犯通奸的人。
- source_word: וּבַנִּשְׁבָּעִים לַשָּׁקֶר
  choice: 起假誓的
  rationale: 既保留起誓行为，也不把范围缩窄为法庭上的伪证罪。
- source_word: וּבְעֹשְׁקֵי שְׂכַר שָׂכִיר
  choice: 克扣雇工工资
  rationale: 原文直译近于“欺压雇工的工资”，实际所指很可能是扣留、侵吞或不公对待应付工资；“克扣”在现代汉语中准确而自然。
- source_word: אַלְמָנָה וְיָתוֹם
  choice: 寡妇和孤儿
  rationale: 采用现代汉语中清楚、庄重的弱势群体称谓；“孤儿”在此对应父亲缺失、失去家庭保障的人。
- source_word: וּמַטֵּי גֵר
  choice: 排挤寄居者
  rationale: נטה的使役形式有使偏离、推开、屈枉之意；“排挤”保留社会性压迫而不擅自补入原文未明说的“公道/案件”。“寄居者”保留 גֵר 作为住在以色列人中、受其保护的外来居民这一社会身份。
- source_word: וְלֹא יְרֵאוּנִי
  choice: 他们不敬畏我
  rationale: “敬畏”同时保留惧怕与尊崇的盟约性含义；独立成句，使其自然地概括前述作恶者。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”呈现四字神名，以“万军”表达复数 צְבָאוֹת 的众军含义，并采用汉语读者熟悉而庄重的称号形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名，而非一般称号“主”；“耶和华”是现代中文圣经传统中最易辨识的专名形式。脚注注明另一种较接近学术重构读音的译法。
- issue: צְבָאוֹת 与神名连用时的理解
  choice: 万军之耶和华
  alternative: 万军之主
  rationale: 保留神名及“众军”的意象，不将其抽象化；同时避免英文传统“Hosts”在中文中的间接影响。
- issue: וְלֹא יְרֵאוּנִי 的主语范围
  choice: 让“他们”回指前面整组作恶者
  alternative: 另列一类“以及不敬畏我的人”
  rationale: 希伯来语可听作对前述群体的概括性描述，也可并列为最后一项。正文采用较自然的概括句，但不加入“都”等会完全锁定范围的词，以保留一定句法张力。
translation_notes:
  register: 采用庄重而可直接诵读的现代标准汉语。罪行列表使用并列短语，既保持原文法庭控诉的节奏，也避免生硬照搬希伯来语支配结构。“迅速作证，指控”兼顾证人意象和汉语搭配；全句不加入宗派性术语。
