source:
  edition: WLC
  text: וְ/עָֽרְבָה֙ לַֽ/יהוָ֔ה מִנְחַ֥ת יְהוּדָ֖ה וִ/ירֽוּשָׁלִָ֑ם כִּ/ימֵ֣י עוֹלָ֔ם וּ/כְ/שָׁנִ֖ים קַדְמֹנִיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/004.yaml
  text: Then the offering of Judah and Jerusalem will be pleasing to Yahweh[b][a], as in the days of old and as in former years.
translation:
  language: zh_hans
  text: 那时，犹大和耶路撒冷的供物[a]必蒙雅威悦纳[b]，如同古时，如同往昔的岁月。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供物”在某些祭祀语境中可更具体地译作“素祭”。
    reason: lexical_alternative
  - marker: b
    text: “必蒙雅威悦纳”也可译作“必使雅威喜悦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְבָה
  choice: 那时……必蒙……悦纳
  rationale: 动词 ערב 在此意为“令人喜悦、可蒙接纳”。结合上文洁净礼物的预言语境，用“必”表达未然意义；句首的连接词 וְ 在这里带出先后或结果关系，译作“那时”比单纯译作“并且”更自然。
- source_word: לַיהוָה
  choice: 蒙雅威悦纳
  rationale: 介词 ל 表示供物与雅威之间的关系，即供物为他所喜悦、接纳。将神名 יְהוָה 音译为“雅威”，保留经文中的盟约之名。
- source_word: מִנְחַת
  choice: 供物
  rationale: מִנְחָה 可专指素祭，也可泛指献给神的礼物或供物。正文采用较宽泛的“供物”，避免在本节中把祭物种类限定得过窄，并以脚注说明较具体的可能含义。
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: 犹大和耶路撒冷
  rationale: 采用现代中文圣经及一般读者熟悉的标准地名译法。
- source_word: כִּימֵי עוֹלָם
  choice: 如古时的日子
  rationale: עוֹלָם 在这里回指久远的过去，并非形而上的“永恒”；“古时的日子”保留原文的时间意象。
- source_word: וּכְשָׁנִים קַדְמֹנִיּוֹת
  choice: 如往昔的年岁
  rationale: 与前一短语构成诗意平行，指从前的年代；“往昔的年岁”既保留“年”的意象，也维持庄重而自然的中文节奏。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近常见学术重构读音的“雅威”，而不以称号“主”替代，以保留神名本身。
- issue: מִנְחָה 所指祭物的具体程度
  choice: 供物
  alternative: 素祭
  rationale: 该词在祭祀语境中常可专指素祭，但也有较宽泛的“礼物、供物”用法。本节重点是恢复后的敬拜蒙悦纳，正文不进一步限定祭物材料，并在脚注保留“素祭”的可能性。
- issue: וְעָרְבָה 的语态与神学表达
  choice: 必蒙雅威悦纳
  alternative: 必使雅威喜悦
  rationale: 原文形式上表达供物“对雅威成为可喜悦的”。中文用“蒙……悦纳”自然传达可接受、受喜悦之意；脚注保留更贴近表层句法的另一译法，避免抹去“喜悦”与“接纳”之间的语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“古时的日子／往昔的年岁”保留希伯来诗句的平行结构；“蒙……悦纳”是自然的宗教语域表达，但不过度古雅。
