id: MAL.3.19
reference: Malachi 3:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה הַ/יּוֹם֙ בָּ֔א בֹּעֵ֖ר כַּ/תַּנּ֑וּר וְ/הָי֨וּ כָל זֵדִ֜ים וְ/כָל עֹשֵׂ֤ה רִשְׁעָה֙ קַ֔שׁ וְ/לִהַ֨ט אֹתָ֜/ם הַ/יּ֣וֹם הַ/בָּ֗א אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֛ר לֹא יַעֲזֹ֥ב לָ/הֶ֖ם שֹׁ֥רֶשׁ וְ/עָנָֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/019.yaml
  text: For behold[a], the day is coming, burning like an oven, when all the arrogant and every evildoer will be stubble. The coming day will set them ablaze, says Yahweh of Armies[c][b], so that it will leave them neither root nor branch.
translation:
  language: zh_hans
  text: 因为看哪，那日将要来到，燃烧如火炉；一切狂傲的人和一切作恶的人都必成为碎秸。那将要来到的日子必把他们烧着——万军之耶和华说——不给他们留下根，也不留下枝条。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: 因为看哪
  rationale: כִּי承接上文并引出理由，译作“因为”；הִנֵּה用于郑重唤起注意，译作“看哪”，保留先知话语的庄严与迫切感。
- source_word: הַיּוֹם בָּא
  choice: 那日将要来到
  rationale: 定冠词所指的是先知语境中特定的审判之日；בָּא表达正在临近，故用自然的现代汉语“将要来到”。
- source_word: בֹּעֵר כַּתַּנּוּר
  choice: 燃烧如火炉
  rationale: תַּנּוּר本义为炉、烤炉；“火炉”既通俗又能清楚传达酷热燃烧的比喻，不扩大为较具工业色彩的熔炉。
- source_word: זֵדִים
  choice: 狂傲的人
  rationale: 该词指傲慢、僭妄之人；“狂傲”兼具内在骄傲与外在放肆的道德意味。
- source_word: כָל עֹשֵׂה רִשְׁעָה
  choice: 一切作恶的人
  rationale: 保留希伯来语“行作邪恶”的分词结构及其集合、周遍意义，比概括性的“恶人”更贴近原文。
- source_word: קַשׁ
  choice: 碎秸
  rationale: 指收割后留下、易燃的干秸秆或残梗；“碎秸”保留农业背景和迅速着火的意象，并避免误作糠秕。
- source_word: וְלִהַט אֹתָם
  choice: 必把他们烧着
  rationale: 动词表达使之燃烧、着火；“烧着”保留点燃的阶段性意象，不提前把后句所表达的彻底毁灭并入此处。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”呈现四字神名，以中文圣经语域中通行而庄严的“万军之”表达צְבָאוֹת所含天上与军事众军的称号。
- source_word: אֲשֶׁר לֹא יַעֲזֹב לָהֶם
  choice: 不给他们留下
  rationale: 关系从句说明那将来之日造成的结果；中文省略重复主语仍清楚以“那日”为施事，并直接保留否定。
- source_word: שֹׁרֶשׁ וְעָנָף
  choice: 根，也不留下枝条
  rationale: 保留从根到枝的整体性意象；重复“不留下”使汉语中的双重否定范围清楚，表达彻底除灭而不抹去原有比喻。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者熟悉且具有专名功能的“耶和华”，不以“主”替代，从而保留这是盟约之神名字的性质。
- issue: 是否将审判火焰直接释义为“烧尽”或“完全消灭”
  choice: 先译“把他们烧着”，再译“不给他们留下根，也不留下枝条”
  alternative: 把他们完全烧尽
  rationale: 原文先描写燃烧，随后以根与枝均不存说明彻底结果。分两步保留意象的发展，避免以神学性总结取代先知诗性表达。
- issue: “根与枝”是否解释为特定群体或后代
  choice: 保留“根”和“枝条”的比喻
  alternative: 祖先和后代／无一存留
  rationale: 原文本身未明说两者各自对应什么；直译可保留其整体毁灭的含义及具体指涉上的开放性。
translation_notes:
  register: 采用庄严而可懂的现代标准汉语，保留“看哪”“万军之耶和华”等先知宣告语域。句法依原文推进：日子临近并如炉燃烧，恶人成为碎秸，那日使他们着火，最终根枝皆不存。未设置脚注，因为正文可直接承载主要词义，且本节没有必须另注才能保存的文本异读。
