base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/022.yaml
  text: Remember the law of Moses my servant[c][b][a], which I commanded him at Horeb for all Israel—statutes and judgments.
translation:
  language: zh_hans
  text: 你们要记住我仆人摩西的律法[a]，就是我在何烈山[b]为全以色列所吩咐他的律例和典章[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“教导”。
    reason: lexical_alternative
  - marker: b
    text: “何烈”是西奈山的另一个名称；上帝曾在那里借着摩西把盟约的律法赐给以色列。
    reason: cultural_note
  - marker: c
    text: “律例和典章”也可译作“法令和审判条例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: 你们要记住
  rationale: 复数祈使式，既表达对全体听众的命令，也保留盟约语境中主动铭记并遵行的意味。
- source_word: תּוֹרַת מֹשֶׁה עַבְדִּי
  choice: 我仆人摩西的律法
  rationale: 本节提到摩西、何烈山及律例典章，语境具体指向摩西之约的律法；“仆人”在此是摩西受上帝差遣的尊称。
- source_word: אֲשֶׁר צִוִּיתִי אֹתוֹ
  choice: 就是我……吩咐他的
  rationale: 关系从句回指摩西的律法；中文以“就是”引出其内容，并以“他”保留摩西作为领受和传达命令者的角色。
- source_word: בְחֹרֵב
  choice: 在何烈山
  rationale: 介词在此表示地点；采用现代中文常见的圣经地名译法。
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: 为全以色列
  rationale: עַל 表示这些命令所关涉和适用的范围，即全体以色列。
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: 律例和典章
  rationale: 用两个相近但有区别的法律用语对应希伯来文并列词组，保留盟约规定及司法规范的色彩。
theological_decisions:
- issue: 盟约语境中 תּוֹרָה 的译法
  choice: 律法
  alternative: 教导
  rationale: 摩西、何烈山以及随后“律例和典章”的组合使法律与盟约含义居于前景；脚注保留该词较广的“教导”义。
- issue: 摩西称号 עַבְדִּי 的译法
  choice: 我仆人
  alternative: 我的奴仆
  rationale: 此处是上帝对摩西受托职分的尊称，重点不在受奴役身份；“我仆人”自然且符合上下文。
- issue: חֻקִּים וּמִשְׁפָּטִים 两词的区分
  choice: 律例和典章
  alternative: 条例和判例
  rationale: 正文采用庄重而可懂的传统法律措辞，同时在脚注提示另一种可行表达，不将两个希伯来词合并为一个概念。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“你们”明确复数命令对象；句法尽量贴近希伯来文，同时用“就是”使关系从句在中文中清楚自然。所有脚注标记均置于所注释词语之后。
