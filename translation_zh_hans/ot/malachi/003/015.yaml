source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֲנַ֖חְנוּ מְאַשְּׁרִ֣ים זֵדִ֑ים גַּם נִבְנוּ֙ עֹשֵׂ֣י רִשְׁעָ֔ה גַּ֧ם בָּחֲנ֛וּ אֱלֹהִ֖ים וַ/יִּמָּלֵֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/015.yaml
  text: So now we call the arrogant blessed[a]; evildoers are even built up[c][b]; they even test God and escape.’
translation:
  language: zh_hans
  text: 所以如今，我们称狂傲的人有福[a]；作恶的人竟然兴旺起来[b]；他们甚至试探上帝[c]，仍能逃脱。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂傲的人”也可译作“骄傲的人”或“放肆的人”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“被建造起来”，在这里指得以建立、稳固或兴盛。
    reason: lexical_alternative
  - marker: c
    text: “试探上帝”也可译作“考验上帝”，含有向上帝挑战的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以如今
  rationale: 既承接上文，也表达百姓由先前抱怨所得出的现实结论。
- source_word: מְאַשְּׁרִים
  choice: 称……有福
  rationale: 保留该词宣称或认定某人为有福、幸运的评价性含义。
- source_word: זֵדִים
  choice: 狂傲的人
  rationale: 指傲慢、放肆而僭越的人；“狂傲”既自然，也保留其负面的道德色彩。
- source_word: גַּם
  choice: 竟然／甚至
  rationale: 两次出现均带强调和递进意味；按各分句的汉语语境分别译为“竟然”和“甚至”。
- source_word: נִבְנוּ
  choice: 兴旺起来
  rationale: 本义为“被建造”，此处用作比喻，表示得以建立、稳固或兴盛；正文采用自然的语境义，脚注保留字面意象。
- source_word: עֹשֵׂי רִשְׁעָה
  choice: 作恶的人
  rationale: 准确呈现“行作邪恶之事的人”这一分词短语，并保留持续行为的意味。
- source_word: בָּחֲנוּ אֱלֹהִים
  choice: 试探上帝
  rationale: בחן可指检验或试验；此处描写人以僭越的行为挑战上帝，中文“试探上帝”能表达这一语用含义。
- source_word: וַיִּמָּלֵטוּ
  choice: 仍能逃脱
  rationale: 该动词可指逃脱或获救；抱怨的语境强调这些人试探上帝以后仍未受惩罚。“仍能”显明上下句的反常张力，但不补出原文未明说的具体灾祸。
theological_decisions:
- issue: אֱלֹהִים在此处的译法
  choice: 上帝
  alternative: 神
  rationale: 此处是指以色列的上帝，并非专名四字神名；采用现代普通话中庄重、清楚的“上帝”，不加入宗派性解释。
- issue: 恶人“逃脱”的含义
  choice: 仍能逃脱
  alternative: 仍能免受惩罚
  rationale: 原文没有明说他们逃脱什么；正文保留宾语未明的张力，不将其限定为某一种惩罚。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“竟然—甚至—仍能”表现两个גַּם所形成的递进抱怨，同时保留“试探上帝却逃脱”这一神学张力。句末保留引语结束符，以衔接本段直接引语。
