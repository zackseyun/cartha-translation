  text: וּ/מִ֤י מְכַלְכֵּל֙ אֶת י֣וֹם בּוֹא֔/וֹ וּ/מִ֥י הָ/עֹמֵ֖ד בְּ/הֵרָֽאוֹת֑/וֹ כִּֽי הוּא֙ כְּ/אֵ֣שׁ מְצָרֵ֔ף וּ/כְ/בֹרִ֖ית מְכַבְּסִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/002.yaml
  text: But who can endure the day of his coming[a], and who can stand when he appears? For he is like a refiner’s fire and like launderers’ soap.
translation:
  language: zh_hans
  text: 但他来临的日子，谁能承受呢？他显现的时候，谁能站立得住呢？因为他如炼金者所用的火，又如洗衣人的碱剂[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “碱剂”指古代洗涤布料所用的强碱性清洁物；传统上也译作“漂布工的皂”。
    reason: 说明古代物质及词义，也保留传统职业称谓的译法。
lexical_decisions:
- source_word: מְכַלְכֵּל
  choice: 能承受
  rationale: 此处指在那来临之日的压力和审判之下支撑得住；“能承受”既符合反问语气，也比直译为“供养”或“维持”更合乎上下文。
- source_word: יוֹם בּוֹאוֹ
  choice: 他来临的日子
  rationale: 保留希伯来语的属格结构及先知性分量，同时是自然、庄重的现代汉语。
- source_word: הָעֹמֵד
  choice: 能站立得住
  rationale: 与前句“谁能承受”构成平行，表达在严峻临到时仍能立住，而不只是身体姿势。
- source_word: בְּהֵרָאוֹתוֹ
  choice: 他显现的时候
  rationale: 将尼法勒不定式自然地译成时间从句，保留“成为可见、显现”的含义。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出前面两个反问的理由，符合此处解释性的逻辑关系。
- source_word: כְּאֵשׁ מְצָרֵף
  choice: 如炼净金属的火
  rationale: 把古代熔炼者用火除去杂质的意象清楚传达给现代读者，并保留严厉与洁净并存的比喻。
- source_word: וּכְבֹרִית מְכַבְּסִים
  choice: 又如洗衣人的碱剂
  rationale: בֹרִית指洗涤布料所用的强碱性清洁物；“碱剂”比泛称“肥皂”更贴近古代所指，“洗衣人”则清楚易懂。
theological_decisions:
- issue: 来临者行动的性质
  choice: 保留熔炼之火与强力洗涤剂所共同表达的严厉洁净意象
  alternative: 将其单独解释为毁灭性的审判，或单独解释为使人圣洁的洁净
  rationale: 经文本身的两个比喻既含危险和严厉，也含除去杂质、洗净污秽的作用；译文不把这种张力限定为某一单一教义范畴。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个反问句保持希伯来诗句的平行结构；“站立得住”传达承受审判而不倒下的语用含义。脚注标记置于其实际所解释的“碱剂”之后。
