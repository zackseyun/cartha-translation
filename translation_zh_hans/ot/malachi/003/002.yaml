revisions:
- from: 但他来临的日子，谁能承受呢？他显现的时候，谁能站立得住呢？因为他如炼净金属的火，又如洗衣人的碱剂[a]。
  to: 但他来临的日子，谁能承受呢？他显现的时候，谁能站立得住呢？因为他如炼金者所用的火，又如洗衣人的碱剂[a]。
  rationale: 仅将“炼净金属的火”改为“炼金者所用的火”，以更清楚、自然地对应希伯来语中“精炼者”的分词及其用火。其余措辞、平行结构和脚注均可保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:17:38Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了两个平行的反问、来临／显现的时间关系，以及炼火和洗涤碱剂这两个严厉而具洁净意味的比喻。惟“炼净金属的火”在汉语中容易被理解为“已经炼净金属的火”，且将施事者“炼炼者”（מְצָרֵף）弱化为过程性描述；改为“炼金者所用的火”更直接对应原文的施事者及其用火。
  naturalness: 整体庄重通顺，反问句和“站立得住”自然。“炼金者所用的火”比“炼净金属的火”更符合现代汉语的搭配和指称关系。“洗衣人的碱剂”清晰自然。
  terminology: “承受”“显现”“站立得住”“碱剂”均妥当。“炼金者”在这里指精炼金属的人，不限定为现代意义的黄金或炼金术；“所用的火”明确其为精炼用火。脚注准确说明了בֹּרִית的强碱性洗涤物含义，并保留传统译法。
  issues:
