  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּקָם֩ יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וּ/זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ וְ/אֶחָ֔י/ו וַ/יִּבְנ֕וּ אֶת מִזְבַּ֖ח אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/הַעֲל֤וֹת עָלָי/ו֙ עֹל֔וֹת כַּ/כָּת֕וּב בְּ/תוֹרַ֖ת מֹשֶׁ֥ה אִישׁ הָ/אֱלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/002.yaml
  text: Then Jeshua son of Jozadak arose with his brothers the priests[a], and Zerubbabel son of Shealtiel with his brothers, and they built the altar of the God of Israel to offer burnt offerings on it, as it is written in the Law of Moses[b], the man of God.
translation:
  language: zh_hans
  text: 于是，约萨达的儿子耶书亚和他的弟兄——众祭司[a]，以及撒拉铁的儿子所罗巴伯和他的弟兄，都起来建造以色列上帝的祭坛，要在坛上献燔祭，正如上帝之人摩西的律法[b]所写的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可指“亲族”或“同伴”；原文作“他的弟兄”，后面的“众祭司”说明耶书亚这一群人的身份。
    reason: lexical_alternative
  - marker: b
    text: “律法”所译的希伯来语“妥拉”，也可意为“教导”或“训诲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 都起来
  rationale: קום在此表示众人起而采取决定性的行动；“起来”既保留叙事推进，也不局限于身体站立。希伯来语谓语为单数，因复合主语以耶书亚开头；汉语按整体主语自然表达为“都起来”。
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 按希伯来语名字音译，并采用中文圣经语境中对被掳归回时期该名字的常见译法，以区别于通常译作“约书亚”的较早人物。
- source_word: וְאֶחָיו
  choice: 他的弟兄
  rationale: אָח的基本义是“兄弟”，也可指亲族或同伴；保留“弟兄”可呈现原文亲属式称谓，而后接“众祭司”说明耶书亚这一群体的身份。
- source_word: הַכֹּהֲנִים
  choice: 众祭司
  rationale: 这是对耶书亚“弟兄”的同位说明；“众祭司”在现代汉语中清楚表明该群体身份。
- source_word: זְרֻבָּבֶל
  choice: 所罗巴伯
  rationale: 采用现代中文圣经传统中广为人知的标准人名译法。
- source_word: שְׁאַלְתִּיאֵל
  choice: 撒拉铁
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיִּבְנוּ
  choice: 建造
  rationale: בנה本义为“建造”；历史背景可能涉及恢复祭坛，但原词未明确表达“重建”，故不增译。
- source_word: מִזְבַּח אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列上帝的祭坛
  rationale: 直接呈现原文所属结构，语言自然明确。
- source_word: לְהַעֲלוֹת עָלָיו עֹלוֹת
  choice: 要在坛上献燔祭
  rationale: עלה的使役式与עֹלוֹת构成献祭惯用语；“献燔祭”准确传达礼仪动作，“在坛上”明确保留עָלָיו。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 采用中文圣经与宗教文化中已确立的祭祀术语，指在火中全然焚烧献上的祭物。
- source_word: כַּכָּתוּב
  choice: 正如……上所写的
  rationale: 保留原文诉诸成文规定的公式，同时调整语序，使现代汉语流畅。
- source_word: בְּתוֹרַת מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: 上帝之人摩西的律法
  rationale: 按希伯来语关系，将“上帝之人”理解为对摩西的称谓，并保留“摩西的律法”的传统而清楚的表达。
theological_decisions:
- issue: 代表性群体中亲属词אחים的译法
  choice: 他的弟兄
  alternative: 他的亲族／他的同伴
  rationale: 原词为阳性复数，基本义是“兄弟”，语境中可扩展指同族或同工者。正文保留原文亲属式表达，并用脚注交代语义范围，不将其窄化为生物学兄弟。
- issue: 祭祀法规语境中תּוֹרָה的译法
  choice: 律法
  alternative: 教导／妥拉
  rationale: 这里强调按成文的献祭规定行事，“律法”能自然传达其规范性；脚注保留该词也可指“教导、训诲”的较宽语义。
- issue: אִישׁ הָאֱלֹהִים与摩西的关系
  choice: 上帝之人摩西
  alternative: 摩西，上帝的人
  rationale: 原文同位结构将该称号用于摩西；“上帝之人摩西”保持称号的庄重感，也避免把“上帝”误解为律法所属结构之外的新成分。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。人名沿用简体中文圣经语境中的通行译名；祭祀术语保留“祭坛”“燔祭”。句式适度调整为汉语自然语序，同时保留原文两组领袖及其群体并列行动的结构。
