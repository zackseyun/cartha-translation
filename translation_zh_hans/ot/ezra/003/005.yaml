base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/005.yaml
  text: And after that came the regular burnt offering[a], and the offerings for the new moons and for all the appointed feasts of Yahweh that were consecrated[c][b], and for everyone who willingly offered a freewill offering to Yahweh.
translation:
  language: zh_hans
  text: 此后，他们献上常献的燔祭[a]，也献上为月朔[b]、耶和华一切分别为圣的节期[c]所献的祭，以及所有甘心向耶和华献上甘心祭的人所献的祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“持续献的燔祭”或“每日的燔祭”。
    reason: lexical_alternative
  - marker: b
    text: “月朔”指每月开始时按新月举行的神圣礼仪。
    reason: cultural_note
  - marker: c
    text: “节期”也可译作“耶和华所定的日期”或“节庆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: 此后
  rationale: 自然表达与上文祭祀活动相连的时间次序；希伯来语连接词在汉语中由上下文衔接体现。
- source_word: עֹלַת תָּמִיד
  choice: 常献的燔祭
  rationale: עֹלָה指全烧的燔祭；תָּמִיד强调持续、定期献上。“常献的”既保留其规律性，也不把词义过度限定为“每日”。
- source_word: וְלֶחֳדָשִׁים
  choice: 月朔
  rationale: חֹדֶשׁ在此指每月开始时的新月圣日；“月朔”准确简洁，脚注说明其文化含义。
- source_word: וּלְכָל מוֹעֲדֵי יְהוָה
  choice: 耶和华一切……的节期
  rationale: מוֹעֵד在祭祀历法语境中指规定的神圣日期或节庆；“节期”兼顾固定日期与宗教庆典的含义。
- source_word: הַמְקֻדָּשִׁים
  choice: 分别为圣的
  rationale: 保留被动分词“被分别出来成为神圣”的意义，并明确修饰“节期”。
- source_word: וּלְכֹל מִתְנַדֵּב
  choice: 以及凡甘心……的人
  rationale: hitpael分词表达主动自愿的意愿；“甘心”与下文同词根的“甘心祭”形成原文所有的语义呼应。
- source_word: נְדָבָה
  choice: 甘心祭
  rationale: 这是自愿献上的祭物之标准祭祀术语；采用现代中文圣经语境中清楚而庄重的表达。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 以“耶和华”呈现专名יהוה，保留经文中的盟约之名，而不以普通称号替代。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。中文采用广为人知的专名“耶和华”，既与普通称号相区别，也保持自然可读；不凭本节解决其古代确切读音问题。
- issue: 省略谓语及祭物的补足
  choice: 补出“他们又献上”及“所规定的祭”
  alternative: 按原文名词短语直译，不补谓语
  rationale: 本节承接上文，希伯来语可借语境省略谓语；现代汉语需要补足动作才能清楚。所补内容以祭祀语境为限，不改变各项祭物之间的关系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“燔祭、月朔、节期、甘心祭”等必要的祭祀术语，并以脚注解释可能不熟悉或有合理替代译法之处。
