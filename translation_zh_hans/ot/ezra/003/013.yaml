base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/013.yaml
  text: And the people could not distinguish the sound of the shout of joy from the sound of the people’s weeping[a], for the people were shouting with a great shout[b], and the sound was heard far away.
translation:
  language: zh_hans
  text: 百姓分辨不出喜乐的欢呼声和百姓哭泣的声音[a]，因为百姓发出极大的欢呼声[b]，那声音在很远的地方也能听见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“百姓不能辨认出喜乐的欢呼声和百姓哭泣的声音。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“百姓欢呼极大的欢呼。”这里以同源动词和名词加强欢呼的强烈程度。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכִּירִים
  choice: 分辨不出
  rationale: 此处使役形表达无法将两种声音区别开来；“分辨不出”准确、自然。
- source_word: ק֚וֹל
  choice: 声音
  rationale: 经文所指是可听见的声响，并非言语内容；“声音”最贴合上下文。
- source_word: תְּרוּעַת הַשִּׂמְחָה
  choice: 欢呼的声音
  rationale: תְּרוּעָה 指响亮的呼喊；结合 שִׂמְחָה，以“欢呼”自然表达喜乐的呼喊。
- source_word: לְקוֹל בְּכִי הָעָם
  choice: 和百姓哭泣的声音
  rationale: לְ 在比较结构中连接被区别的另一种声音；“哭泣”保留其强烈情感。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出无法分辨两种声音的原因。
- source_word: מְרִיעִים תְּרוּעָה גְדוֹלָה
  choice: 大声欢呼
  rationale: 希伯来文采用同源动词与名词的强调结构；现代汉语以“大声欢呼”简洁传达响亮而强烈的呼喊。
- source_word: נִשְׁמַע
  choice: 能听见
  rationale: 被动式表示声音被人听到；汉语用“能听见”比机械直译为“被听见”更自然。
- source_word: עַד לְמֵרָחוֹק
  choice: 远处都
  rationale: 表达声音传到远方，配合“能听见”构成自然的现代汉语。
