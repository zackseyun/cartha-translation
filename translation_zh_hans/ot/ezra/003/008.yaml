  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/בוֹאָ֞/ם אֶל בֵּ֤ית הָֽ/אֱלֹהִים֙ לִ/יר֣וּשָׁלִַ֔ם בַּ/חֹ֖דֶשׁ הַ/שֵּׁנִ֑י הֵחֵ֡לּוּ זְרֻבָּבֶ֣ל בֶּן שְׁ֠אַלְתִּיאֵל וְ/יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וּ/שְׁאָ֥ר אֲחֵי/הֶ֣ם הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֗ם וְ/כָל הַ/בָּאִים֙ מֵ/הַ/שְּׁבִ֣י יְרֽוּשָׁלִַ֔ם וַ/יַּעֲמִ֣ידוּ אֶת הַ/לְוִיִּ֗ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/נַצֵּ֖חַ עַל מְלֶ֥אכֶת בֵּית יְהוָֽה־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/008.yaml
  text: And in the second year after their coming to the house of God at Jerusalem[a], in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, and the rest of their brothers the priests and the Levites, and all who had come from the captivity to Jerusalem, began and appointed the Levites from twenty years old and upward to oversee the work of the house of Yahweh.
translation:
  language: zh_hans
  text: 他们来到耶路撒冷上帝的殿之后，第二年二月，撒拉铁的儿子所罗巴伯、约萨达的儿子耶书亚、他们其余的弟兄，就是祭司和利未人，以及所有从被掳之地[a]来到耶路撒冷的人，都开始动工。他们委派二十岁以上的利未人督管耶和华殿的工程。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从流亡之地”。
    reason: מֵהַשְּׁבִי 可侧重被掳、流亡的状态或所在之地；两种译法均符合此处来到耶路撒冷的语境。
lexical_decisions:
- source_word: לְבוֹאָם אֶל בֵּית הָאֱלֹהִים לִירוּשָׁלַם
  choice: 他们来到耶路撒冷上帝的殿之后
  rationale: 将带介词和人称后缀的不定式译作时间从句；“上帝的殿”保留原文表达，不提前将尚在重建中的建筑明确解释为“圣殿”。
- source_word: בַחֹדֶשׁ הַשֵּׁנִי
  choice: 二月
  rationale: 这里指该年的第二个月；现代汉语用“二月”简洁自然，语境可避免理解为公历二月。
- source_word: הֵחֵלּוּ
  choice: 开始动工
  rationale: 原文只说“开始”，宾语省略；上下文明确涉及耶和华殿的工程。汉语补出“动工”以形成自然句子，但不进一步限定具体施工内容。
- source_word: וַיַּעֲמִידוּ
  choice: 委派
  rationale: 使役形式在此表示使利未人担任某项职责；“委派”比字面的“使站立”更符合行政和施工语境。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十岁以上
  rationale: 准确表达年龄下限，包括年满二十岁者，且符合现代汉语习惯。
- source_word: לְנַצֵּחַ
  choice: 督管
  rationale: 此处指监督、管理工程，不是该词在诗歌标题等处可能具有的音乐职能；“督管”兼有监督和负责之意。
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: 耶和华殿的工程
  rationale: מְלָאכָה在本段指建殿工作；“工程”自然表达施工语境，同时保留“耶和华殿”的所属关系。
- source_word: מֵהַשְּׁבִי
  choice: 从被掳之地
  rationale: 该名词可指被掳状态、流亡处境或被掳群体；主文采用具体而符合回归语境的“被掳之地”，脚注保留“流亡之地”的可能表达。
- source_word: אֲחֵיהֶם
  choice: 他们其余的弟兄
  rationale: 保留原文阳性复数亲属／同胞称谓，不泛化为中性的“同伴”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非“主”的称号。简体中文新教传统及普通读者最熟悉“耶和华”；“雅威”更接近现代学界常见的拟音，但不宜据不确定的古代元音重构排除传统译名。
- issue: בֵּית הָאֱלֹהִים 是否直接译为“圣殿”
  choice: 上帝的殿
  alternative: 上帝的圣殿
  rationale: 原文为“上帝的殿”，且此时重建工程尚未完成；采用较贴近原文的表达，避免让读者误以为完整建筑已经落成。
- issue: הֵחֵלּוּ 所省略的开始事项
  choice: 开始动工
  alternative: 开始了这项工作
  rationale: 原文保留宾语省略，但汉语若只说“开始”会不完整；根据紧接的“殿的工程”补出最低限度的“动工”，不说明原文未明说的具体工序。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。将原文很长的并列句分为两句，以免主语和谓语相隔过远；人名采用中文圣经中通行的译名。脚注标记紧随其所解释的“被掳之地”。
