id: EZR.3.10
reference: Ezra 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יִסְּד֥וּ הַ/בֹּנִ֖ים אֶת הֵיכַ֣ל יְהוָ֑ה וַ/יַּעֲמִידוּ֩ הַ/כֹּהֲנִ֨ים מְלֻבָּשִׁ֜ים בַּ/חֲצֹֽצְר֗וֹת וְ/הַ/לְוִיִּ֤ם בְּנֵֽי אָסָף֙ בַּֽ/מְצִלְתַּ֔יִם לְ/הַלֵּל֙ אֶת יְהוָ֔ה עַל יְדֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/010.yaml
  text: When the builders laid the foundation of the temple of Yahweh[a], they stationed the priests, clothed in their vestments, with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise Yahweh according to the directions of David king of Israel.
translation:
  language: zh_hans
  text: 建造者为雅威的殿立下根基时，他们让身穿礼服、带着号筒的祭司，以及带着钹的利未人，就是亚萨的子孙，各就各位，照以色列王大卫的指示[a]赞美雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“借以色列王大卫的手”，这里是说按照大卫的指示或安排。
    reason: 说明希伯来语习语的字面形式及其语境含义。
lexical_decisions:
- source_word: וְיִסְּדוּ הַבֹּנִים
  choice: 建造的人……立下根基
  rationale: יסד在建筑语境中指奠定或铺设根基；“立下根基”自然地表达具体建殿工程。分词הַבֹּנִים作名词使用，译为“建造的人”。
- source_word: הֵיכַל יְהוָה
  choice: 雅威的殿
  rationale: הֵיכָל在本段圣殿语境中指殿宇；“殿”简洁庄重。יהוה按其专名译作“雅威”。
- source_word: וַיַּעֲמִידוּ
  choice: 让……各就各位
  rationale: עמד的使役形在礼仪安排中表示使相关人员站到指定位置；此译比笼统的“设立”更符合现代汉语。
- source_word: הַכֹּהֲנִים מְלֻבָּשִׁים
  choice: 身穿礼服的祭司
  rationale: מְלֻבָּשִׁים直指“穿着衣服”；敬拜场景表明是履职时的正式服装，“礼服”在汉语中清楚而不过度细化。
- source_word: בַּחֲצֹצְרוֹת
  choice: 手拿号筒
  rationale: חֲצֹצְרָה是礼仪中使用的直管号筒。“手拿”自然表达בּ所标示的随身器具，但不额外断言此刻正在吹奏。
- source_word: וְהַלְוִיִּם בְּנֵי אָסָף
  choice: 亚萨子孙——利未人
  rationale: 保留“亚萨子孙”的家族称谓，并用同位结构明确他们属于利未人。
- source_word: בַּמְצִלְתַּיִם
  choice: 手拿钹
  rationale: מְצִלְתַּיִם指圣殿音乐所用的钹；“钹”是现代汉语准确、简明的乐器名称。
- source_word: לְהַלֵּל אֶת יְהוָה
  choice: 赞美雅威
  rationale: 不定式表示安排祭司和利未人就位的目的；汉语可直接以“赞美雅威”承接。
- source_word: עַל יְדֵי דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: 照以色列王大卫的指示
  rationale: עַל יְדֵי字面为“借着……的手”，此处在礼仪组织语境中指按大卫所传下的安排或指示行事；正文采用自然汉语，字面形式收入脚注。
theological_decisions:
- issue: 神圣四字名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文两次使用以色列上帝的专名。译作“雅威”保留专名性质，避免以称号代替，也与YHWH的通行学术拟音相符。
- issue: עַל יְדֵי דָּוִיד在圣殿敬拜语境中的含义
  choice: 照以色列王大卫的指示
  alternative: 借以色列王大卫的手；按以色列王大卫所定的规例
  rationale: 该表达既可表示媒介或代理，也可在此处指大卫所传达、制定的敬拜安排。正文呈现语境中的自然含义，脚注保留希伯来语的字面意象，从而不掩盖其表达方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“各就各位”体现礼仪性的人员安排；破折号标明“亚萨子孙”与“利未人”的同位关系。
