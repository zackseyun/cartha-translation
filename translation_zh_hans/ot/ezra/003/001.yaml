  text: וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בֶּ/עָרִ֑ים וַ/יֵּאָסְפ֥וּ הָ/עָ֛ם כְּ/אִ֥ישׁ אֶחָ֖ד אֶל יְרוּשָׁלִָֽםס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/001.yaml
  text: When the seventh month arrived[a], and the sons of Israel were in the cities[b], the people gathered as one man to Jerusalem.
translation:
  language: zh_hans
  text: 第七个月来到时，以色列子孙住在各城；众民如同一人[a]聚集到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语惯用语，字面为“如同一个人”，表示众人行动一致、同心合意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע
  choice: 到了
  rationale: נגע本义为“触及、到达”；以月份为主语时表示该月来到。“到了”符合现代汉语的时间表达。
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: 第七月
  rationale: 按原文保留月份序数，不以后来的月份名称代替。
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留בְּנֵי的阳性复数形式及其群体称谓色彩；“众子”比逐字的“儿子们”更庄重，也比“以色列人”更透明地反映原文。
- source_word: בֶּעָרִים
  choice: 住在各城
  rationale: 原文是省略系词的地点短语，直译为“在那些城中”。汉语补出“住”，使句意自然；“各城”表达复数城邑中分散居住的情形，但不加入原文没有明说的物主词“他们的”。
- source_word: וַיֵּאָסְפוּ
  choice: 聚集
  rationale: אָסף的尼法勒形在此表示众人集合；“聚集”简洁自然，无须再加“在一起”。
- source_word: הָעָם
  choice: 众民
  rationale: 表达归回群体的集合性，并保持经文体的庄重感。
- source_word: כְּאִישׁ אֶחָד
  choice: 如同一人
  rationale: 保留希伯来语字面意象及阳性单数形式，同时在汉语中自然表达众人行动一致。
- source_word: אֶל יְרוּשָׁלִָם
  choice: 到耶路撒冷
  rationale: אֶל在聚集的语境中指向目的地，因此译为“到”，而非静态的“在”。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל与כְּאִישׁ אֶחָד中的阳性群体用语
  choice: 正文保留“以色列众子”和“如同一人”
  alternative: 译作“以色列人”和“同心一致”
  rationale: 这两处都是希伯来语惯用的群体表达。保留其阳性形式和具体意象，可使译文对原文透明，同时脚注说明其群体性含义，避免将其误解为只涉及一个人或仅强调生理性别。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。分号呈现时间背景与主要行动之间的层次；“众子”“众民”“如同一人”保留原文的群体称谓和具体意象，并用脚注帮助普通读者理解。
