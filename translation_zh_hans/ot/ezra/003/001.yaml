  to: 第七个月来到时，以色列子孙住在各城；众民如同一人[a]聚集到耶路撒冷。
  rationale: 将不自然且可能误导的“以色列众子”改为通行的“以色列子孙”，并以脚注交代原文的字面表达和替代译法。为使脚注锚点与所注词语相符，锚点a置于“如同一人”后；关于“以色列子孙”的说明作为完整脚注b保留。其余措辞仅作必要的句法顺畅化，未改变经文意义。
