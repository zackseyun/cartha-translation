  text: וַֽ/יַּעֲשׂ֛וּ אֶת חַ֥ג הַ/סֻּכּ֖וֹת כַּ/כָּת֑וּב וְ/עֹלַ֨ת י֤וֹם בְּ/יוֹם֙ בְּ/מִסְפָּ֔ר כְּ/מִשְׁפַּ֖ט דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/004.yaml
  text: They kept the Festival of Booths as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required.
translation:
  language: zh_hans
  text: 他们照着所写的举行住棚节，又按规定的数目，每天献上当天规定的燔祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכּוֹת
  choice: 住棚节
  rationale: 这是该节期在现代中文圣经语境中通行且准确的名称；סֻכּוֹת 指临时搭建的棚子。
- source_word: וַיַּעֲשׂוּ
  choice: 守
  rationale: 动词本义为“做、举行”，用于节期时自然译为“守”，表达遵行并庆祝节期。
- source_word: כַּכָּתוּב
  choice: 照所写的
  rationale: 保留原文对成文律法的简洁指涉，不擅自补明具体经卷。
- source_word: וְעֹלַת יוֹם בְּיוֹם
  choice: 天天献上……燔祭
  rationale: יוֹם בְּיוֹם 表示逐日、每日；עֹלָה 是全然焚烧献上的祭，采用通行术语“燔祭”。
- source_word: בְמִסְפָּר כְּמִשְׁפָּט
  choice: 按规定的数目
  rationale: מִסְפָּר 指数目，מִשְׁפָּט 在此指既定规例；合译可自然表达每天祭牲数目依律例而定。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: 当日所需的
  rationale: 字面为“每日之事在其日”，语境中指各日应献的份额；此译保留逐日有相应要求的含义。
theological_decisions:
- issue: “照所写的”所指为何
  choice: 不补出具体律法出处
  alternative: 译作“照摩西律法上所写的”
  rationale: 本节希伯来文只说“照所写的”；虽可由上下文和律法文本辨明背景，正文不应增加原文未明说的限定。
- issue: 每日燔祭与住棚节祭物的关系
  choice: 译为节期中天天按当日要求献上的燔祭
  alternative: 理解为另行献常献的每日燔祭
  rationale: 原文可直指住棚节逐日规定数目的燔祭；避免用“常献的燔祭”等措辞过度限定其礼仪类别。
translation_notes:
  register: 采用庄重而现代的标准普通话。“照所写的”“按规定的数目”“当日所需的”简明呈现律法遵行与逐日献祭安排；不设置脚注，因为正文无需交代文本异读或不可避免的歧义。
