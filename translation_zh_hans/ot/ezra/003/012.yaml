base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/012.yaml
  text: But many of the priests and the Levites and the heads of the fathers’ houses[a], the old men who had seen the first house, were weeping with a loud voice when this house was founded before their eyes[c][b], while many were raising their voice with a shout of joy.
translation:
  language: zh_hans
  text: 可是，祭司、利未人和宗族首领中，有许多年长的人曾见过先前的殿；当这殿在他们眼前奠基时，他们放声大哭。许多人则欢喜地高声欢呼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרַבִּים
  choice: 可是……有许多
  rationale: וְ在此承接上文并形成反差；译作“可是”自然显出他们的哭泣与前一节欢呼之间的对照。מִן后的רַבִּים表示群体中的一部分，故用“……中，有许多”。
- source_word: מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת
  choice: 祭司、利未人和宗族首领中
  rationale: 保留מִן的部分意义。“宗族首领”以现代汉语表达祖系家族或氏族的领导者，避免将其误解为各个小家庭的家长。
- source_word: הַזְּקֵנִים
  choice: 年长的人
  rationale: 本处重点是他们年纪大到曾见过早先的圣殿，而不一定指正式职分上的“长老”。
- source_word: אֲשֶׁר רָאוּ אֶת הַבַּיִת הָרִאשׁוֹן
  choice: 曾见过从前的殿
  rationale: הָרִאשׁוֹן可指“先前的、从前的”；上下文明确בַּיִת所指为圣殿，汉语用“殿”既自然又保留“房屋”的意象。
- source_word: בְּיָסְדוֹ זֶה הַבַּיִת
  choice: 如今这殿……奠基时
  rationale: יסד在建筑语境中指立下根基；“奠基”准确简洁。补入“如今”只为使今昔两殿的对照在汉语中清楚，不增加新的时间信息。
- source_word: בְּעֵינֵיהֶם
  choice: 在他们眼前
  rationale: 直译该希伯来语惯用表达，突出这些年长者亲眼目睹奠基。
- source_word: בֹּכִים בְּקוֹל גָּדוֹל
  choice: 放声大哭
  rationale: 以自然现代汉语传达持续哭泣及“用大声”的强度。
- source_word: וְרַבִּים בִּתְרוּעָה בְשִׂמְחָה לְהָרִים קוֹל
  choice: 而许多人却欢呼，高声欢庆
  rationale: “而……却”表达同时存在的鲜明反差；“欢呼”对应תְּרוּעָה，“高声欢庆”结合בְשִׂמְחָה与“扬声”的含义，同时保留原文的喜乐和音量。
