source:
  edition: WLC
  text: וַֽ֠/יַּעֲנוּ בְּ/הַלֵּ֨ל וּ/בְ/הוֹדֹ֤ת לַֽ/יהוָה֙ כִּ֣י ט֔וֹב כִּֽי לְ/עוֹלָ֥ם חַסְדּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/כָל הָ/עָ֡ם הֵרִיעוּ֩ תְרוּעָ֨ה גְדוֹלָ֤ה בְ/הַלֵּל֙ לַֽ/יהוָ֔ה עַ֖ל הוּסַ֥ד בֵּית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/011.yaml
  text: 'And they sang responsively praising and giving thanks to Yahweh: “For he is good[c][b][a], for his steadfast love toward Israel is forever.” And all the people shouted a great shout in praise to Yahweh because the house of Yahweh had been founded.'
translation:
  language: zh_hans
  text: 他们彼此应和[a]，赞美、感谢耶和华，说：“因为他本为善；他对以色列的慈爱永远长存[b]。”众百姓都大声欢呼，赞美耶和华，因为耶和华的殿已经奠基[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼此应和”也可译作“回应”。希伯来语在这里可能指敬拜中的轮流唱和。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”也可译作“坚定的爱”或“忠贞之爱”；这词可包含恩慈、忠诚和持久眷爱的意思。
    reason: lexical_alternative
  - marker: c
    text: 原文较直译为“因为耶和华的殿被奠立”；按上下文，是指圣殿的根基已经奠立。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: 彼此应和
  rationale: ענה在此礼仪语境中表示回应或轮流唱和；“彼此应和”既保留回应之意，也自然呈现集体敬拜的场景，而不把原文未明说的具体演唱方式定得过死。
- source_word: בְּהַלֵּל וּבְהוֹדֹת
  choice: 赞美、感谢
  rationale: 两个并列形式分别表达赞美和称谢；采用动词表达符合现代汉语习惯，也保留两项行动。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行、普通读者最易识别的上帝圣名音译；不以“主”替代原文专名。
- source_word: כִּי טוֹב
  choice: 因为他本为善
  rationale: 补出汉语所需的主语“他”；“本为善”自然、庄重，并保留这句礼仪性认信的简洁力度。
- source_word: כִּי לְעוֹלָם חַסְדּוֹ עַל יִשְׂרָאֵל
  choice: 他对以色列的慈爱永远长存
  rationale: “慈爱”在中文中可涵盖恩慈、忠贞和眷爱；“对以色列”对应עַל所表达的指向，“永远长存”自然传达לְעוֹלָם。
- source_word: הֵרִיעוּ תְרוּעָה גְדוֹלָה
  choice: 都大声欢呼
  rationale: 原文以同源动词和名词加强语气。汉语若机械重复会显生硬，故以“大声欢呼”传达强烈、响亮的呼喊。
- source_word: בְהַלֵּל לַיהוָה
  choice: 赞美耶和华
  rationale: 此语说明欢呼的性质和对象；采用动词结构，使汉语流畅而不损失敬拜含义。
- source_word: עַל הוּסַד בֵּית יְהוָה
  choice: 因为耶和华的殿已经奠基
  rationale: הוּסַד是יסד的Hophal形式，表示“被奠立、被建立”；结合本章正在铺设圣殿根基的语境，“殿已经奠基”既准确又简明。
theological_decisions:
- issue: 神圣四字名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用上帝的专名而非称号。正文采用中文读者最熟悉的专名形式“耶和华”，避免以“主”抹去专名；“雅威”是另一种可能的学术音译。
- issue: חֶסֶד在盟约赞美公式中的含义
  choice: 慈爱
  alternative: 坚定的爱；忠贞之爱；怜悯
  rationale: 该词兼有恩慈、忠诚、眷爱等含义。“慈爱”简洁自然，并保留一定语义宽度；脚注提示其坚定、持久的一面，避免把它缩减为单纯情感或只限定为某一神学术语。
- issue: עַל יִשְׂרָאֵל与לְעוֹלָם的关系
  choice: 他对以色列的慈爱永远长存
  alternative: 他永远以慈爱待以色列
  rationale: 正文让“永远”修饰慈爱的持续，贴近常见赞美公式，同时保留“对以色列”的明确指向；另一译法更强调上帝持续施行慈爱，但会把名词结构转成行动表述。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜叙事语体。“彼此应和”保留礼仪回应的可能性，却不武断规定为某一种对唱形式；“大声欢呼”以自然汉语表达原文同源词加强语气的效果。引文采用分号区分两项互相关联的赞美理由。
