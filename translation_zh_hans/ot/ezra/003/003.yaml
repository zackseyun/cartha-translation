  text: וַ/יָּכִ֤ינוּ הַ/מִּזְבֵּ֨חַ֙ עַל מְכ֣וֹנֹתָ֔י/ו כִּ֚י בְּ/אֵימָ֣ה עֲלֵי/הֶ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת ו/יעל עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה עֹל֖וֹת לַ/בֹּ֥קֶר וְ/לָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/003.yaml
  text: They set up the altar on its foundations[a], for fear was upon them because of the peoples of the lands, and they offered up burnt offerings on it to Yahweh[b], burnt offerings morning and evening.
translation:
  language: zh_hans
  text: 他们把祭坛安设在它的基座上[a]，因为他们因各地的民众而惧怕，就在坛上向耶和华献燔祭，献早晨和晚上的燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基座”也可译作“根基”或“固定的位置”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: 安设
  rationale: 使役形在此指把祭坛安置妥当、预备使用；“安设”既自然，也能与后面的基座相衔接。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 祭祀语境中 מזבח 的标准中文译法。
- source_word: עַל מְכ֣וֹנֹתָיו
  choice: 在原有的基座上
  rationale: מְכוֹנוֹתָיו 可指祭坛的基座、根基或固定位置；“原有的”依所有格及重建语境表达其归属和原址意味，但不把它缩减为单纯的地点。
- source_word: כִּי בְּאֵימָה עֲלֵיהֶם מֵעַמֵּי הָאֲרָצוֹת
  choice: 他们因当地各族而心怀恐惧，却仍
  rationale: 介词 מִן 表示恐惧的来源或原因；“当地各族”自然保留 עַמֵּי הָאֲרָצוֹת 的复数群体含义。“却仍”显明 כִּי 在此更可能交代他们虽惧怕仍建坛献祭的背景关系，而非武断地把恐惧说成建坛的直接动机。
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: 在坛上……献上燔祭
  rationale: עלה 的使役形与 עֹלוֹת 构成献燔祭的惯用表达；“献上”也保留了上升的语感。马所拉文本动词形式为第三人称阳性单数，但上下文通常以复数群体为主语；中文不显动词数，避免强行消除文本张力。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 以“耶和华”呈现专名 יהוה，保留经文中的神圣名字。
- source_word: עֹלוֹת לַבֹּקֶר וְלָעָרֶב
  choice: 就是早晚的燔祭
  rationale: 保留原文重复的“燔祭”，并用“早晚”自然表达每日两个固定献祭时段。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；中文以广为人知且具专名功能的“耶和华”呈现，不改作称号“主”。
- issue: 恐惧与设坛之间的逻辑关系
  choice: 他们虽因当地各族而惧怕，却仍设坛献祭
  alternative: 他们因为惧怕当地各族，所以设立祭坛
  rationale: כִּי 可引出背景或原因，但上下文更自然地表现百姓在威胁之下仍恢复敬拜；译文用“却仍”避免暗示祭坛本身是防御手段，同时脚注保留希伯来语较直译的结构。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“安设”“燔祭”保留圣经祭祀语域；句式避免过度仿古。主文中的[a]与脚注完全对应。
