reference: Ezra 3:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ/יּ֤וֹם אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י הֵחֵ֕לּוּ לְ/הַעֲל֥וֹת עֹל֖וֹת לַ/יהוָ֑ה וְ/הֵיכַ֥ל יְהוָ֖ה לֹ֥א יֻסָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/006.yaml
  text: From the first day of the seventh month they began to offer burnt offerings to Yahweh[a], though the foundation of the temple of Yahweh had not been laid.
translation:
  language: zh_hans
  text: 从七月初一日起，他们开始向雅威献燔祭；而[a]雅威殿的根基还没有奠定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “而”也可译作“但”或“并且”。希伯来语连接词既可表示一般连接，也可在这里表示转折；本句说明献祭是在圣殿奠基以前开始的。
    reason: 保留连接词וְ的词义范围及其语境中的转折可能。
lexical_decisions:
- source_word: מִיּוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: 从七月初一日起
  rationale: מִן表示时间的起点；“从……日起”既保留起始含义，也符合现代汉语表达。“初一”自然地表达该月第一日。
- source_word: הֵחֵלּוּ
  choice: 他们开始
  rationale: 该使役词形在这里具有“开始”的常用意义；补出复数主语“他们”，符合汉语语法。
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: 献燔祭
  rationale: 这是祭祀语境中的固定搭配；עֹלָה指整只焚烧、使烟上升的祭物，汉语传统术语“燔祭”准确而简洁。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词לְ表示献祭的对象；“雅威”直接音译四字神名יהוה，保留其专名性质。
- source_word: וְהֵיכַל יְהוָה
  choice: 而雅威殿
  rationale: הֵיכָל在本段重建语境中指圣殿；וְ可表示单纯连接，也可带转折或让步意味，正文用较为开放的“而”，并以脚注说明。
- source_word: לֹא יֻסָּד
  choice: 根基还没有奠定
  rationale: יסד的被动式表示被奠基；原文以圣殿为语法主语，汉语改用惯常搭配“殿的根基……奠定”，明确表达其含义。“还没有”符合前后事件的时间关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”保留其作为盟约神专名的性质，同时不把它改写为称号。
- issue: 献祭开始与圣殿奠基之间的逻辑关系
  choice: 以“而”连接，并保留语义弹性
  alternative: “但”或“虽然……却……”
  rationale: 希伯来语连接词וְ本身可仅作连接，也可在语境中带转折或让步色彩。祭祀确实在圣殿奠基前开始，但正文不把隐含关系强化为唯一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“七月初一日起”“献燔祭”“根基还没有奠定”清楚易懂，同时保留经文的礼仪与历史语域。
