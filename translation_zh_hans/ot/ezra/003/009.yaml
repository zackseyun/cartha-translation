  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד יֵשׁ֡וּעַ בָּנָ֣י/ו וְ֠/אֶחָי/ו קַדְמִיאֵ֨ל וּ/בָנָ֤י/ו בְּנֵֽי יְהוּדָה֙ כְּ/אֶחָ֔ד לְ/נַצֵּ֛חַ עַל עֹשֵׂ֥ה הַ/מְּלָאכָ֖ה בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים בְּנֵי֙ חֵֽנָדָ֔ד בְּנֵי/הֶ֥ם וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּֽם־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/009.yaml
  text: Then Jeshua[a], his sons and his brothers, and Kadmiel and his sons, the sons of Judah, stood together as one to oversee those doing the work in the house of God, along with the sons of Henadad, their sons and their brothers, the Levites.
translation:
  language: zh_hans
  text: 耶书亚和他的儿子、弟兄；甲篾和他的儿子，就是犹大的子孙[a]；以及希拿达的子孙、他们的儿子和弟兄——这些利未人一同站立，督管上帝殿中做工的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“犹大的子孙”；一些古代译本和现代译本作“何达威的子孙”。
    reason: 文本异读
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 站出来
  rationale: עמד的基本义是“站立、站定”；在此表示承担督管职责。“站出来”既保留具体动作，也自然表达就位任职。
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 按现代中文圣经常用形式音译此人名，并与“约书亚”作适当区分。
- source_word: בָּנָיו וְאֶחָיו
  choice: 他的儿子、弟兄
  rationale: 保留原文明确的男性亲属称谓和并列结构。
- source_word: קַדְמִיאֵל וּבָנָיו
  choice: 甲篾和他的儿子
  rationale: 将第二个家族群体按原文直接并列，采用通行中文音译。
- source_word: בְּנֵי יְהוּדָה
  choice: 犹大的子孙
  rationale: 直接翻译所给马所拉文本的“犹大之子”，并以脚注保留古译本所见的异文。
- source_word: כְּאֶחָד
  choice: 齐心
  rationale: 表达群体一致行动的含义，较“一同如一人”更符合现代汉语，同时不削弱合一的意味。
- source_word: לְנַצֵּחַ
  choice: 督管
  rationale: 此处piel不定式指对工程人员的监督和指挥，并非音乐方面的领唱或指挥。
- source_word: עַל עֹשֵׂה הַמְּלָאכָה
  choice: 督管……做工的人
  rationale: 带冠词的单数分词具有集合意义；译为“做工的人”保留其动作性，不把工种说得过细。
- source_word: בְּבֵית הָאֱלֹהִים
  choice: 在上帝殿里
  rationale: 在圣殿语境中，“上帝的殿”比逐字的“上帝之家”更自然明确；“上帝”对应אֱלֹהִים。
- source_word: בְּנֵי חֵנָדָד בְּנֵיהֶם וַאֲחֵיהֶם הַלְוִיִּם
  choice: 还有希拿达的子孙和他们的儿子、弟兄——这些利未人
  rationale: 把末尾群体纳入共同主语，并保留“利未人”作为总结性同位说明；破折号帮助现代读者辨认长串主语的结构。
theological_decisions:
- issue: בְּנֵי יְהוּדָה的文本异读
  choice: 正文依马所拉文本译作“犹大的子孙”
  alternative: “何达威的子孙”
  rationale: 所给WLC正文明确作“犹大”；古代译本及部分现代译本所反映的另一名称不应无说明地取代正文，因此收入脚注。
- issue: הַלְוִיִּם所指范围
  choice: 以总结性同位语“这些利未人”收束所列群体
  alternative: 仅把“利未人”限定为紧邻的希拿达家族
  rationale: 希伯来语末置同位语的范围存在句法张力；结合本段所列人员承担圣殿工程督管职分，以总结性表达较顺畅，但不增添超出原文的宗派性身份解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。人名使用常见中文圣经译名；长主语以破折号收束，使句法清楚，同时保留原文家族名单和群体行动的结构。
