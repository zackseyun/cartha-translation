base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/007.yaml
  text: So they gave money to the stonecutters and to the craftsmen[a], and food and drink and oil to the Sidonians and the Tyrians, to bring cedar timber from Lebanon to the sea at Joppa[c][b], according to the authorization of Cyrus king of Persia upon them.
translation:
  language: zh_hans
  text: 于是，他们把钱[a]给凿石工和工匠，又把食物、饮料和油给西顿人和推罗人，好让他们把香柏木料从黎巴嫩运到雅法海边[b]，照着波斯王居鲁士给他们的许可[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“银子”。希伯来语这个词既可指银这种金属，也可在付款的语境中指钱财。
    reason: lexical_alternative
  - marker: b
    text: 或译“运到雅法港”。原文直译为“运到雅法的海”。
    reason: lexical_alternative
  - marker: c
    text: “许可”也可译作“授权”或“准许”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 于是，他们……交给
  rationale: 叙事性连续形式推进事件；“于是”自然表达承接和顺序。
- source_word: כֶסֶף
  choice: 钱
  rationale: 该词本义可指银，但在支付工价的语境中表示钱财；正文采用现代汉语较自然的“钱”，另以脚注保留“银子”。
- source_word: לַחֹצְבִים
  choice: 凿石匠
  rationale: חצב指开凿或采切石料；结合圣殿建造语境，“凿石匠”准确而易懂。
- source_word: וְלֶחָרָשִׁים
  choice: 和工匠
  rationale: חָרָשׁ泛指有专门手艺的工人，原文未明确限定其具体工种，因此不窄化为木匠。
- source_word: וּמַאֲכָל וּמִשְׁתֶּה וָשֶׁמֶן
  choice: 又把食物、饮料和油
  rationale: 按原文并列列出所供应的物品；“饮料”保留其泛称，不擅自具体化为酒，“油”也不额外指定为橄榄油。
- source_word: לַצִּדֹנִים וְלַצֹּרִים
  choice: 交给西顿人和推罗人
  rationale: 两个族称分别指来自西顿和推罗的人，采用现代中文通行地名构成。
- source_word: לְהָבִיא
  choice: 让他们……运到
  rationale: 不定式表达提供物资的目的；汉语用“让他们”明确承接西顿人和推罗人，并以“运到”贴合木料运输语境。
- source_word: עֲצֵי אֲרָזִים
  choice: 香柏木料
  rationale: 字面涉及香柏树木；在建筑语境中，“香柏木料”既自然又不限定为已经加工的木材或特定形态的原木。
- source_word: מִן הַלְּבָנוֹן
  choice: 从黎巴嫩
  rationale: 直接表达香柏木料的来源地。
- source_word: אֶל יָם יָפוֹא
  choice: 到雅法海边
  rationale: 较贴近字面的“到雅法的海”，又能在现代汉语中自然表达雅法沿海的装运地点；不在正文中直接解释为港口。
- source_word: כְּרִשְׁיוֹן כּוֹרֶשׁ מֶלֶךְ פָּרַס עֲלֵיהֶם
  choice: 这一安排是照着波斯王居鲁士给他们的许可办理的
  rationale: רִשְׁיוֹן表示许可或授权；“给他们的许可”自然表达עֲלֵיהֶם在王室许可用语中的关系，同时避免生硬直译为“在他们身上”。
