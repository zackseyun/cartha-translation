base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/018.yaml
  text: The document that you sent to us has been read plainly before me[a].
translation:
  language: zh_hans
  text: 你们送给我们的公文，已在我面前清楚地宣读了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公文”或译“信函”。
    reason: 原词可泛指正式书面文件，也可指书信；正文按行政语境译作“公文”。
lexical_decisions:
- source_word: נִשְׁתְּוָנָא
  choice: 公文
  rationale: 该词指官方书面通信；“公文”符合波斯王廷的行政语境，同时比单纯的“信”更能体现其正式性质。
- source_word: דִּי
  choice: （关系从句：你们送给我们的）
  rationale: 此关系词连接“公文”与修饰它的从句；现代汉语无需逐词另译。
- source_word: שְׁלַחְתּוּן
  choice: 你们送给
  rationale: 亚兰文第二人称阳性复数完成式；“送给”在公文往来的语境中自然，并表达已经完成的动作。
- source_word: עֲלֶינָא
  choice: 我们
  rationale: 介词短语在此表示文书送达王廷，即“给我们”，不取“攻击我们”的含义。
- source_word: מְפָרַשׁ
  choice: 清楚地
  rationale: 表达宣读得清楚、明白；不额外断定这里专指翻译或解释。
- source_word: קֱרִי
  choice: 已经……宣读了
  rationale: 上下文为公文在王面前被读出；“宣读”比一般的“阅读”更贴合正式场合及被动语境。
- source_word: קָדָמָי
  choice: 在我面前
  rationale: 保留王廷用语，表示在王本人面前、当着王的面进行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的行政叙事语体。“在我面前……宣读”保留王廷场景；“清楚地”紧贴原文，同时避免把其含义限定为翻译或解释。
