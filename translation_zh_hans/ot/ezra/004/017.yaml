base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/017.yaml
  text: 'The king sent a reply to Rehum the commander[a], Shimshai the scribe, and the rest of their associates who live in Samaria, and the rest beyond the River: Peace[c][b]. And now—'
translation:
  language: zh_hans
  text: 王给行政长官利宏[a]、书记伸帅，以及住在撒玛利亚的其余同僚和河西[b]其余的人发出答复：“愿你们平安。[c]现在——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行政长官”所译的亚兰文官衔含义并不确定，也可译作“主管”或“掌政官”。
    reason: lexical_alternative
  - marker: b
    text: “河西”是波斯帝国的行政地域称呼，指幼发拉底河以西的地区。
    reason: cultural_note
  - marker: c
    text: “愿你们平安”也可译作“向你们问安”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: 答复
  rationale: 此词可指正式话语或书面公文；本节承接前文来信，译作“答复”最能体现回应性质，又不把它过度限定为诏令。
- source_word: בְּעֵל טְעֵם
  choice: 行政长官
  rationale: 该官衔字面与“掌管裁断、谕令”有关，具体职权并不确定；“行政长官”既交代其官员身份，也避免用“总督”或“司令”等过于具体的称谓。
- source_word: סָפְרָא
  choice: 书记
  rationale: 在本处指负责文书事务的官员；“书记”比现代职业色彩较强的“秘书”更贴近古代行政语境。
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: 他们中……其他地方的人
  rationale: כנותהון 指与具名官员同属一方的人或同僚。汉语按居住地点整合句法，可自然表达其余相关人员。
- source_word: עֲבַר נַהֲרָה
  choice: 河西
  rationale: 这是波斯行政语境中对幼发拉底河以西地区的称呼。译作“河西”保留原文以方位命名的方式，并以脚注说明所指。
- source_word: שְׁלָם
  choice: 愿你们平安
  rationale: 这是书信问安语。“愿你们平安”既保留“平安”的词义，也符合现代汉语正式书信的表达。
- source_word: וּכְעֶת
  choice: 现在——
  rationale: 这是从问安转入正文的固定格式；破折号表明句意延续到下一节。
theological_decisions: []
