  register: 采用现代、庄重而易懂的公文叙述语体。“查考后发现”体现档案调查过程；“起来反抗”保留原词既可表示自高、又可表示敌对兴起的张力；“叛乱和煽乱”尽量区分两个相近的政治术语。
