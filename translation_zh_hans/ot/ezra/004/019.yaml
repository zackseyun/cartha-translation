  - severity: medium
    issue: “屡有”增加了反复频率。
    rationale: 原文说反叛与相关行为在城中被实行／发生，并未明确使用表示“屡次”或“常常”的副词。
  - severity: medium
    issue: “煽乱”不够自然且词义不明。
    rationale: 现代标准汉语通常说“煽动叛乱”或“煽动骚乱”；前者能较清楚表达与“叛乱”相关而又有区别的政治性行为。
