  source_fidelity: 译文基本正确地呈现了王下令查考档案并查得该城历史上敌对君王、城内发生反叛行为的意思。不过，“屡有”把原文的概括性完成式／被动式明确化为反复发生，略增语义；“煽乱”则不是现代标准汉语中自然、清晰的政治用语。
  naturalness: “一直起来反抗诸王”搭配不够自然；“煽乱之事”亦较生硬且容易误解。改为“自古以来，这城曾起来反抗诸王”及“反叛和煽动叛乱的事，都在城中发生过”，既保留正式叙述语体，也更符合现代汉语。
  terminology: “查考”“诸王”“叛乱”均合适。“煽乱”建议不用；以“煽动叛乱”对应英语审校轨迹中的 sedition，并在注释中保留“作乱／反叛”等较宽的可能译法。
