- from: 我下令[a]，他们查考后发现，这城自古以来一直起来反抗诸王[b]，城中屡有叛乱和煽乱之事[c]。
  to: 我下令[a]，他们查考后发现：自古以来，这城曾起来反抗诸王[b]，反叛和煽动叛乱的事都在城中发生过[c]。
  rationale: 修订消除不自然的“一直起来”和罕见的“煽乱”，不再以“屡有”加入未明说的频率；同时保留原文对该城历史性敌对王权，以及城内发生反叛与相关政治性动乱的指控。脚注保留反身动词“自高／起来反抗”的歧义，并说明末尾两个相近政治术语的替代译法。
