  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ וּ/בַקַּ֣רוּ וְ/הַשְׁכַּ֔חוּ דִּ֚י קִרְיְתָ֣/א דָ֔ךְ מִן יוֹמָת֙ עָֽלְמָ֔/א עַל מַלְכִ֖ין מִֽתְנַשְּׂאָ֑ה וּ/מְרַ֥ד וְ/אֶשְׁתַּדּ֖וּר מִתְעֲבֶד בַּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/019.yaml
  text: And a decree was issued by me[a], and they searched and found that this city has from ancient days risen up against kings[b], and rebellion and sedition have been carried out in it.
translation:
  language: zh_hans
  text: 我下令[a]，他们查考后发现：自古以来，这城曾起来反抗诸王[b]，反叛和煽动叛乱的事都在城中发生过[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“由我设立命令”；意为命令由王发出。
    reason: idiom
  - marker: b
    text: 或译“向诸王自高”。原词可指抬高自己；在此政治语境中可指起来反抗王权。
    reason: lexical_alternative
  - marker: c
    text: 原文也可译“叛乱和作乱的事都在城中发生过”或“反叛和骚乱都在城中发生过”。后一个名词与前面的“反叛”意义相近，但仍有所区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: 我下令
  rationale: 原文是“由我设立命令”的行政用语；译为“我下令”自然简洁，也明确保留命令出自王的意思。
- source_word: וּבַקַּרוּ וְהַשְׁכַּחוּ
  choice: 他们查考后发现
  rationale: 这里指奉命检索档案；“查考”体现正式调查，“发现”表达所得结果。
- source_word: קִרְיְתָא דָךְ
  choice: 这城
  rationale: 保留指向当前所议城市的指示语气。
- source_word: מִן יוֹמָת עָלְמָא
  choice: 自古以来
  rationale: 这是表达久远年代的亚兰语惯用语；现代汉语“自古以来”准确且庄重。
- source_word: עַל מַלְכִין מִתְנַשְּׂאָה
  choice: 一直起来反抗诸王
  rationale: 反身形式可含“抬高自己、起来”的意味；在政治语境中译作“起来反抗”既表达敌对行动，又不与下文明确的“叛乱”完全重合。
- source_word: וּמְרַד
  choice: 叛乱
  rationale: 这是反抗王权的常见政治用语。
- source_word: וְאֶשְׁתַּדּוּר
  choice: 煽乱
  rationale: 该词与“叛乱”意义相近但不完全相同；“煽乱”保留其挑动、制造政治动乱的色彩。
- source_word: מִתְעֲבֶד בַּהּ
  choice: 城中屡有……之事
  rationale: 原文以被动或非人称方式说明这些行为在城中发生或实行；“屡有”结合前文持续性的历史陈述，符合汉语表达。
theological_decisions: []
