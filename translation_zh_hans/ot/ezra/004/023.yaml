revisions:
- from: 亚达薛西王的诏书副本一在利宏、书记伸帅和他们的同僚面前宣读，他们就急忙赶到耶路撒冷，攻击犹太人[a]，用武力强迫他们停工[b]。
  to: 当亚达薛西王的文书副本在利宏、书记伸帅和他们的同僚面前一被宣读，他们就急忙赶到耶路撒冷，往犹太人那里[a]，用武力强迫他们停工[b]。
  rationale: 修订避免将介词的可能敌对含义在正文中定为“攻击”，并将“诏书”改为语义范围更合适的“文书”。其余措辞保留草稿的现代、庄重风格，以及原文的使役和强制意味。
