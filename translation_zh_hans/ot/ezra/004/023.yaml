  text: אֱדַ֗יִן מִן דִּ֞י פַּרְשֶׁ֤גֶן נִשְׁתְּוָנָ/א֙ דִּ֚י ארתחששתא מַלְכָּ֔/א קֱרִ֧י קֳדָם רְח֛וּם וְ/שִׁמְשַׁ֥י סָפְרָ֖/א וּ/כְנָוָתְ/ה֑וֹן אֲזַ֨לוּ בִ/בְהִיל֤וּ לִ/ירֽוּשְׁלֶם֙ עַל יְה֣וּדָיֵ֔/א וּ/בַטִּ֥לוּ הִמּ֖וֹ בְּ/אֶדְרָ֥ע וְ/חָֽיִל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/023.yaml
  text: Then[a], as soon as the copy of the letter of King Artaxerxes was read before Rehum and Shimshai the scribe and their associates, they went in haste to Jerusalem, to the Jews[b], and made them stop by force and power.
translation:
  language: zh_hans
  text: 当亚达薛西王的文书副本在利宏、书记伸帅和他们的同僚面前一被宣读，他们就急忙赶到耶路撒冷，往犹太人那里[a]，用武力强迫他们停工[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“攻击犹太人”或“针对犹太人”。亚兰语介词可只表示方向，也可带有敌对意味；下文以强力使他们停工显示其行动是敌对的。
    reason: 保留介词 עַל 在方向义与敌对义之间的词义可能。
  - marker: b
    text: 直译：“用臂膀和力量使他们停止。”
    reason: 保留 בְּאֶדְרָע וְחָיִל 的字面表达及使役结构。
lexical_decisions:
- source_word: אֱדַיִן מִן דִּי
  choice: 一……就……
  rationale: אֱדַיִן推进叙事，מִן דִּי在此引出时间关系；现代汉语用“一……就……”自然表达紧接发生的动作。
- source_word: פַּרְשֶׁגֶן נִשְׁתְּוָנָא
  choice: 诏书副本
  rationale: פַּרְשֶׁגֶן指副本或抄本，נִשְׁתְּוָנָא指官方文书；因文书出自君王，“诏书副本”简洁而符合语境。
- source_word: קֱרִי קֳדָם
  choice: 在……面前宣读
  rationale: 保留文书在官员面前被读出的被动语义；“宣读”也契合官方诏书的场景。
- source_word: רְחוּם וְשִׁמְשַׁי סָפְרָא וּכְנָוָתְהוֹן
  choice: 利宏、书记伸帅和他们的同僚
  rationale: 人名依普通话传统译名处理；סָפְרָא在行政语境中译作“书记”，כְנָוָתְהוֹן译作“同僚”。
- source_word: אֲזַלוּ בִבְהִילוּ
  choice: 急忙赶到
  rationale: 同时表达移动与急迫，符合现代汉语叙事习惯。
- source_word: עַל יְהוּדָיֵא
  choice: 攻击犹太人
  rationale: עַל可表示朝向或敌对行动；下文以武力勒令停工，使敌对义在本语境更为突出。脚注保留较中性的方向性理解。
- source_word: וּבַטִּלוּ הִמּוֹ
  choice: 强迫他们停工
  rationale: בַטִּלוּ是使役形式，表达使对方停止；语境所指是建造工程，因此补出“工”使中文清楚，但未增加新的行动。
- source_word: בְּאֶדְרָע וְחָיִל
  choice: 用武力
  rationale: 字面近于“用臂膀和力量”，整体是以强力胁迫的习语；“用武力”在中文中准确自然。脚注保留较形式对应的译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“诏书”“宣读”“同僚”体现行政文书语境；“急忙赶到”“用武力强迫他们停工”保持叙事清楚有力。所有脚注标记均已置于正文。
