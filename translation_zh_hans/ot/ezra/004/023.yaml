    issue: “攻击犹太人”过度落实介词 עַל 的含义。
    rationale: 该介词在此可表示朝向，也可带有敌对的“针对／攻击”色彩；紧随其后的强制停工确实显示敌意，但原文没有另一个明确的“攻击”动词。正文应保留歧义，敌对解读置于脚注。
  - severity: low
    issue: “诏书副本”将官方文书限定为诏令。
    rationale: פַּרְשֶׁגֶן נִשְׁתְּוָנָא是“文书／信函的副本”；虽出自君王，原文并未在此处要求译为特定体裁“诏书”。
  revised_text: 当亚达薛西王的文书副本在利宏、书记伸帅和他们的同僚面前一被宣读，他们就急忙赶到耶路撒冷，往犹太人那里[a]，用武力强迫他们停工[b]。
