base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/005.yaml
  text: And they hired counselors against them to frustrate their plan all the days of Cyrus king of Persia[a], even until the reign of Darius king of Persia.
translation:
  language: zh_hans
  text: 他们雇用谋士来反对他们，挫败他们的计划[a]；在波斯王居鲁士在位的整个时期，直到波斯王大流士在位期间，他们一直这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “计划”也可译作“谋议”或“意图”。希伯来语 עֲצָה 可有这些含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֹכְרִים
  choice: 还雇用
  rationale: 该分词在这里表示付钱聘人办事；“雇用”自然准确，也不把含义收窄为原文未明说的“贿赂”。“还”承接上文持续的敌对行动。
- source_word: עֲלֵיהֶם
  choice: 来反对他们
  rationale: 结合敌对语境和后面的“挫败”，介词短语在此具有明确的对抗含义。
- source_word: יוֹעֲצִים
  choice: 谋士
  rationale: 源自יעץ，指提供谋议的人；“谋士”简洁地保留其政治、行政语境，且比现代职业意义较强的“顾问”更合适。
- source_word: לְהָפֵר
  choice: 要挫败
  rationale: הפר可表示破坏、废除或使之落空；宾语是计划，因此“挫败”既自然又能表达蓄意阻挠。
- source_word: עֲצָתָם
  choice: 他们的计划
  rationale: עֵצָה可指谋议、计划或意图；在阻挠重建的语境中，“计划”最清楚，同时以脚注保留其词义幅度。
- source_word: כָּל יְמֵי
  choice: 从……在位的年间
  rationale: 这是表示整段时期的时间用语；结合后面的“直到”，译成此结构符合现代汉语表达。
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: 波斯王居鲁士
  rationale: 采用现代中文圣经与历史称谓中通行的人名音译，并按汉语习惯把国名和王号置于人名前。
- source_word: וְעַד
  choice: 直到
  rationale: 标明敌对行动从居鲁士时期延续至大流士统治时期；“直到”足以自然表达其时间界限。
- source_word: מַלְכוּת
  choice: 执政的时候
  rationale: 在这个时间结构中，该词指君王统治的时期，而非其国土；此译法避免误解为“王国”。
- source_word: דָּרְיָוֶשׁ מֶלֶךְ פָּרָס
  choice: 波斯王大流士
  rationale: 采用现代中文通行音译，并依汉语称号次序表达。
