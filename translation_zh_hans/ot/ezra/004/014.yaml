base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/014.yaml
  text: Because we eat the salt of the palace, and it is not fitting for us to see the king’s dishonor, therefore we have sent and informed the king,
translation:
  language: zh_hans
  text: 我们既吃王宫的盐[a]，就不宜坐视王受辱；因此我们上书禀告王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吃王宫的盐”是说受王宫供养、领王的俸禄，因此对王负有忠诚义务。
    reason: 原文是古代宫廷惯用语，直译可能令现代读者费解，故保留原有意象并加注说明。
lexical_decisions:
- source_word: מְלַח הֵיכְלָא מְלַחְנָא
  choice: 吃王宫的盐
  rationale: 保留亚兰文形象鲜明的宫廷供养惯用语；意思是受王宫供养、领受王的俸禄。
- source_word: עַרְוַת מַלְכָּא
  choice: 王受辱
  rationale: עַרְוָה本义涉及裸露、羞耻，此处指王所遭受的羞辱或损害；译为“受辱”既自然，也保留其荣誉层面的含义。
- source_word: שְׁלַחְנָא וְהוֹדַעְנָא
  choice: 特此上奏，禀告王
  rationale: 按奏章语境表达“我们派人呈报并使王知晓”；“上奏，禀告”符合现代中文的正式文书语体。
theological_decisions: []
