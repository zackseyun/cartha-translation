base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/012.yaml
  text: Let it be known to the king that the Jews who came up from you to us have come to Jerusalem[a]. They are rebuilding the rebellious and wicked city[b], finishing the walls and repairing the foundations.
translation:
  language: zh_hans
  text: 愿王知悉：那些从王那里上到我们这里来的犹太人[a]，已经到了耶路撒冷。他们正在重建那座反叛、邪恶的城，正在修筑城墙，并整修地基[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“犹大人”。这里的亚兰文词既可指犹大或犹太地区的人，也可泛指犹太人。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“铺设地基”或“安置地基”。这里的亚兰文表达较难确定，可能指修复已有的地基，也可能指把地基铺设妥当。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: 愿王知道
  rationale: 这是亚兰文书信中向君王报告事项的正式套语；译文简洁庄重，也符合现代汉语表达。
- source_word: יְהוּדָיֵא
  choice: 犹太人
  rationale: 该词既可指犹太人，也可侧重指犹大地区的人；正文采用现代读者最熟悉的“犹太人”，并以脚注保留另一可能。
- source_word: סְלִקוּ מִן לְוָתָךְ עֲלֶינָא
  choice: 从王那里上到我们这里来
  rationale: 保留 סלק 所表达的“上去／上来”以及写信者以自身所在地为视点的移动方向；用“王”代替直称“你”，符合中文臣下上奏的语体。
- source_word: אֲתוֹ לִירוּשְׁלֶם
  choice: 已经到了耶路撒冷
  rationale: 第二个到达动词具体说明目的地；“已经”体现该行动对当前报告的现实关联。
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  choice: 那座反叛、邪恶的城
  rationale: 保留控告者带有敌意的政治与道德定性，不将其弱化为一般的“不好”。
- source_word: בָּנַיִן
  choice: 正在重建
  rationale: 词面为“建造”，但语境所指是恢复原有的耶路撒冷；“重建”自然表达这一历史情境。
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ
  choice: 修完城墙
  rationale: 名词明确指城墙，动词表示完成或使之完整；“修完”兼顾修复语境与完成含义。
- source_word: וְאֻשַּׁיָּא יַחִיטוּ
  choice: 修整地基
  rationale: 这一亚兰文短语释义较难确定；“修整”适合城市复建语境，同时避免过度断定是在首次奠基。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的中文书信报告语体。“愿王知道”保留宫廷公文色彩；“反叛、邪恶”明确属于控告者的措辞。脚注标记分别紧随其实际解释的词语，避免所指不清。
