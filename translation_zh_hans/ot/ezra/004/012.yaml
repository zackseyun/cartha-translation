  to: 愿王知悉：那些从王那里上到我们这里来的犹太人[a]，已经到了耶路撒冷。他们正在重建那座反叛、邪恶的城，正在修筑城墙，并整修地基[b]。
  rationale: 仅作安全的语体和体貌调整：“愿王知悉”更适合正式奏报语境；将“修完城墙”改为“正在修筑城墙”，避免把建设过程误译为已经完成。其余译文和两则脚注均保留。
