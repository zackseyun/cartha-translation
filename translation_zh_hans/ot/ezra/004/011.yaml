base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/011.yaml
  text: 'This is a copy of the letter that they sent to King Artaxerxes: “Your servants[a], the men of Beyond the River[b], and now—”'
translation:
  language: zh_hans
  text: 以下是他们呈给亚达薛西王的信件副本：“你的臣仆，就是河西[a]的人，如今……”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河西”原文直译为“大河那边”，是波斯帝国对幼发拉底河以西行省的称呼；也可译作“幼发拉底河西地区”。
    reason: 说明行政地理名称及直译形式，避免将“河西”误解为中国地名。
  - marker: b
    text: 原文是正式书信中的套语，字面可译为“如今”或“现在”；也有人把它理解为类似“等等”的结语。下文接续在第12节。
    reason: 保留亚兰文书信套语的字面意义、解释余地及其与下文的承接关系。
lexical_decisions:
- source_word: דְּנָה
  choice: 以下是
  rationale: 这是引出公文引文的指示词；“以下是”在现代汉语中自然地呈现其介绍作用。
- source_word: פַּרְשֶׁגֶן
  choice: 副本
  rationale: 指官方文书的抄本或誊本；“副本”准确且符合现代行政语境。
- source_word: אִגַּרְתָּא
  choice: 信件
  rationale: 指正式书面通信；“信件”既通俗又保留公函性质。
- source_word: שְׁלַחוּ עֲלוֹהִי עַל
  choice: 他们呈给
  rationale: 此处表示把信送交君王；“呈给”既表达递送方向，也符合臣下致王的语境。
- source_word: אַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: 亚达薛西王
  rationale: 采用现代中文圣经传统中通行的王名音译，并按汉语习惯把称号置于姓名之后。
- source_word: עַבְדָיךְ
  choice: 你的臣仆
  rationale: 保留臣属自称和对君王的谦恭语气；“臣仆”比单纯“仆人”更清楚地体现宫廷公函语境，又不限定其具体官职。
- source_word: אֱנָשׁ
  choice: 人
  rationale: 该词虽为阳性形式，却在这里作集合用语；汉语“人”自然，也不额外缩窄所指范围。
- source_word: עֲבַר נַהֲרָה
  choice: 河西
  rationale: 这是波斯帝国对幼发拉底河以西地区的行政地理称呼；“河西”简洁，并由脚注说明其具体所指。
- source_word: וּכְעֶנֶת
  choice: 现陈如下——
  rationale: 这是书信中由称呼转入正文的格式用语，字面近于“现在”；此译保留过渡功能，破折号显示内容延续到下一节。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的公函语体。“呈给”“臣仆”“现陈如下”体现臣下致王的正式语境；不把“臣仆”具体解释为官员。脚注标记均置于正文相应词语之后。
