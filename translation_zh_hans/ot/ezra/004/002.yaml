  text: וַ/יִּגְּשׁ֨וּ אֶל זְרֻבָּבֶ֜ל וְ/אֶל רָאשֵׁ֣י הָֽ/אָב֗וֹת וַ/יֹּאמְר֤וּ לָ/הֶם֙ נִבְנֶ֣ה עִמָּ/כֶ֔ם כִּ֣י כָ/כֶ֔ם נִדְר֖וֹשׁ לֵֽ/אלֹהֵי/כֶ֑ם ו/לא אֲנַ֣חְנוּ זֹבְחִ֗ים מִ/ימֵי֙ אֵסַ֤ר חַדֹּן֙ מֶ֣לֶךְ אַשּׁ֔וּר הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ פֹּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/002.yaml
  text: Then they approached Zerubbabel and the heads of the fathers’ houses and said to them[a], “Let us build with you, for like you we seek your God, and we have been sacrificing to him since the days of Esar-haddon king of Assyria[b], who brought us up here.”
translation:
  language: zh_hans
  text: 他们就来到所罗巴伯和各宗族的首领面前，对他们说：“让我们和你们一起建造吧，因为我们像你们一样寻求你们的神[b]；自从亚述王以撒哈顿把我们带到这里以来，我们一直向他献祭[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 辅音文本作“我们不献祭”；传统读法作“我们向他献祭”。许多人也根据上下文按肯定意义理解此句。
    reason: textual_variant
  - marker: b
    text: “寻求”在这里也可译作“敬拜”或“求问”，原文动词可带有宗教含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: 他们就来到……面前
  rationale: 自然表达叙事中的趋近动作，既保留人物主动上前的意思，又符合现代汉语习惯。
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 各宗族的首领
  rationale: 这里指父系宗族或家族单位的领袖；“各宗族的首领”比直译“父家的首领”更自然，同时保留其亲族社会结构。
- source_word: נִבְנֶה עִמָּכֶם
  choice: 让我们和你们一起建造吧
  rationale: 第一人称复数未完成式在此带提议、意愿语气；“让我们……吧”准确传达这一语气，不额外补出原文没有明说的宾语。
- source_word: כִּי כָכֶם
  choice: 因为我们像你们一样
  rationale: 保留说话者以共同宗教行为作为合作理由的比较关系。
- source_word: נִדְרֹשׁ לֵאלֹהֵיכֶם
  choice: 寻求你们的神
  rationale: דרשׁ在宗教语境中可指寻求、求问或敬拜；“寻求”保留原词的宽度，不把说话者的主张解释得过于明确。
- source_word: וְלֹא אֲנַחְנוּ זֹבְחִים
  choice: 我们一直向他献祭
  rationale: 辅音文本写作“我们不献祭”，但传统读法及上下文支持“我们向他献祭”。正文采用符合语境的读法，并以脚注说明文本难点。
- source_word: מִימֵי אֵסַר חַדֹּן
  choice: 自从亚述王以撒哈顿……以来
  rationale: מִן与“日子”连用，表示从过去某时延续至今；“自从……以来”是自然准确的汉语表达。
- source_word: הַמַּעֲלֶה אֹתָנוּ פֹּה
  choice: 把我们带到这里
  rationale: 准确表达使役性迁移；汉语不必机械保留希伯来语移动表达中的“上来”，以免造成不必要的地理暗示。
theological_decisions:
- issue: 当地居民关于其宗教实践的主张
  choice: 中性译为“寻求你们的神”和“向他献祭”
  alternative: “敬拜你们的神”或“求问你们的神”
  rationale: 本节是在转述他们自己的说法，并未在措辞中确认其敬拜是否真诚或纯正；译文保留叙事所含的神学张力，不预先作判断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“宗族的首领”避免生硬直译，“一起建造”则保留原文未明说建造对象的简洁表达。脚注标记置于各自所解释的词句之后。
