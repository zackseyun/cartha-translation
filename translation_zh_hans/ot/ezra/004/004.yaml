  text: וַ/יְהִי֙ עַם הָ/אָ֔רֶץ מְרַפִּ֖ים יְדֵ֣י עַם יְהוּדָ֑ה ו/מבלהים אוֹתָ֖/ם לִ/בְנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/004.yaml
  text: Then the people of the land kept weakening the hands of the people of Judah and frightening them from building[a][b].
translation:
  language: zh_hans
  text: 于是，当地居民不断打击犹大人的士气[a]，又使他们惧怕，不敢建造[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“使犹大人的手软弱”，是指使他们灰心，削弱他们的力量或决心。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使他们害怕建造。”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: 于是
  rationale: 承接前文并推进叙事；现代汉语中自然，且不采用古奥的“事情发生了”。
- source_word: עַם הָאָרֶץ
  choice: 当地的居民
  rationale: 按上下文指周围本地居民；比直译“那地的民”更符合现代汉语，同时不把其具体族群说得过满。
- source_word: מְרַפִּים יְדֵי
  choice: 不断使……的手软弱
  rationale: 分词表示持续或反复的行动；保留希伯来语“使手软弱”的形象，并以脚注说明其劝阻、削弱意志之意。
- source_word: עַם יְהוּדָה
  choice: 犹大人
  rationale: 自然简洁地指正在建造的犹大群体。
- source_word: וּמְבַלְהִים
  choice: 又使他们惧怕
  rationale: 使役分词表达使人惊慌、害怕；“使……惧怕”既贴近原文，也保持庄重自然。
- source_word: אוֹתָם
  choice: 他们
  rationale: 宾格代词回指犹大人。
- source_word: לִבְנוֹת
  choice: 不敢建造
  rationale: ל 加不定式在此与使人惧怕相连，语法上可较直地理解为“使他们害怕建造”；正文采用自然汉语表达其受恐吓而不敢建造的效果，并以脚注保留较直译法。
