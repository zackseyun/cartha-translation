  text: בֵּ/אדַ֗יִן בְּטֵלַת֙ עֲבִידַ֣ת בֵּית אֱלָהָ֔/א דִּ֖י בִּ/ירוּשְׁלֶ֑ם וַ/הֲוָת֙ בָּֽטְלָ֔א עַ֚ד שְׁנַ֣ת תַּרְתֵּ֔ין לְ/מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/024.yaml
  text: Then the work on the house of God that is in Jerusalem stopped[c][b][a], and it remained stopped until the second year of the reign of Darius king of Persia.
translation:
  language: zh_hans
  text: 于是，耶路撒冷上帝的殿的工程停止了[a][b]，并且一直处于停工状态[c]，直到波斯王大流士在位第二年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “停止了”也可译作“停了下来”或“中断了”；原文动词表示停止或中断。
    reason: lexical_alternative
  - marker: b
    text: “上帝的殿”直译为“上帝的房屋”，即上帝的圣殿。
    reason: lexical_alternative
  - marker: c
    text: “一直处于停工状态”强调停工状态持续下去，并非只是再次提到工程停止。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 亚兰语叙事连接词，承接上文并标示随后发生的事；“于是”自然地保留因果与时序上的衔接。
- source_word: בְּטֵלַת
  choice: 停了下来
  rationale: בטל在此表示停止、中断；这一译法既表达工程开始停顿，也与后文持续停工的状态相区别。
- source_word: עֲבִידַת
  choice: 工程
  rationale: 该构造形式意为“工作”；在圣殿建造语境中，“工程”简洁自然，同时不把正文过度具体化为“建造工程”。
- source_word: בֵּית אֱלָהָא
  choice: 上帝殿
  rationale: 原文直译为“上帝的殿宇/房屋”。中文“上帝殿”既保留“殿”的具体意象，也清楚表达此处所指的圣殿。
- source_word: דִּי בִּירוּשְׁלֶם
  choice: 耶路撒冷
  rationale: 关系词加地点修饰“上帝殿”；汉语中前置为“耶路撒冷上帝殿”最自然，无须另加“位于”。
- source_word: וַהֲוָת בָּטְלָא
  choice: 并且一直处于停工状态
  rationale: 系词与בטל的状态形式共同表达持续状态，而非单纯重复“停止”；“一直处于停工状态”明确呈现其延续性。
- source_word: עַד שְׁנַת תַּרְתֵּין
  choice: 直到……第二年
  rationale: 按君王在位年数纪年，现代汉语自然译作“直到……在位第二年”。
- source_word: לְמַלְכוּת דָּרְיָוֶשׁ
  choice: 大流士在位
  rationale: מַלְכוּת在此指统治、王权时期；“在位”符合汉语君王纪年惯用表达。
- source_word: מֶלֶךְ פָּרָס
  choice: 波斯王
  rationale: 保留原文对大流士的王室头衔，采用简洁自然的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接前文；“停了下来”与“处于停工状态”分别呈现起始动作和持续状态。称谓采用“上帝”，君王纪年采用现代读者熟悉的“在位第二年”。
