base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/006.yaml
  text: And in the reign of Ahasuerus[a], at the beginning of his reign, they wrote an accusation against the inhabitants of Judah and Jerusalem.
translation:
  language: zh_hans
  text: 亚哈随鲁在位期间，在他统治之初，他们写了控告犹大和耶路撒冷居民的文书。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “控告……的文书”也可译作“控诉”或“敌意的指控”。希伯来语这个词含有敌对之意，在这里指以书面形式提出的控告。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/מַלְכוּת
  choice: 在位期间
  rationale: 介词短语在此交代时间背景；“在位期间”是现代汉语对君王统治时期自然、庄重的表达。句首连接词不机械译出，以符合汉语行文。
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: 亚哈随鲁
  rationale: 按希伯来名字的传统汉语音译处理，不以历史上的可能对应者“薛西斯”替换经文名称。
- source_word: בִּ/תְחִלַּת מַלְכוּת/וֹ
  choice: 在他统治之初
  rationale: 准确表达其统治开始的阶段，同时避免与前面的“在位期间”重复用词过重。
- source_word: כָּתְבוּ
  choice: 他们写了
  rationale: 原文为第三人称复数，未在本节明说主语；译文保留“他们”，不补定具体身份。
- source_word: שִׂטְנָה
  choice: 控告……的文书
  rationale: 该名词表示带有敌意的指控或控诉；结合“写了”，译作“控告……的文书”自然呈现书面指控的语境，同时不把文书体裁规定得过细。
- source_word: עַל
  choice: 控告……
  rationale: 在敌对指控的语境中标示针对的对象，汉语将其整合进“控告……的文书”这一结构。
- source_word: יֹשְׁבֵי יְהוּדָה וִ/ירוּשָׁלִָם
  choice: 犹大和耶路撒冷居民
  rationale: 分词实体化，指住在犹大和耶路撒冷的人；“居民”简洁、自然，并保留地域所指。
