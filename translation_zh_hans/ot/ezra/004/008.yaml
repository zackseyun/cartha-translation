  text: Rehum the commander and Shimshai the scribe wrote a letter against Jerusalem to King Artaxerxes as follows:[a]
translation:
  language: zh_hans
  text: 利宏官长[a]和书记伸帅写了一封信，控告耶路撒冷，呈给亚达薛西王，内容如下：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官长”也可译作“省长”或“宰相”。亚兰语官衔“בְּעֵל טְעֵם”的确切波斯行政职务不详。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְחוּם
  choice: 利宏
  rationale: 按现代中文圣经中较通行的译名音译人名。
- source_word: בְּעֵל טְעֵם
  choice: 司令
  rationale: 这是一个确切对应职务不明的亚兰语官衔；“司令”简明地表达其掌权官员身份，但不把它限定为某一特定波斯官职，另以脚注保留“总督”等可能。
- source_word: שִׁמְשַׁי
  choice: 申帅
  rationale: 按现代中文圣经中较通行的译名音译人名。
- source_word: סָפְרָא
  choice: 书记
  rationale: 该词指负责书写及文书事务的官员；“书记”既保留其文书职能，也比单纯的“文士”更符合此处行政语境。
- source_word: כְּתַבוּ
  choice: 写信
  rationale: 结合宾语“信”，用自然中文表达“写了一封信”，不额外加入“寄送”等原文未明说的含义。
- source_word: אִגְּרָה חֲדָה
  choice: 信
  rationale: חֲדָה在帝国亚兰语中可发挥类似不定冠词的作用；中文无需把数目“一”特别凸显，译作“写信”自然准确。
- source_word: עַל יְרוּשְׁלֶם
  choice: 控告耶路撒冷
  rationale: 上下文显示此信带有敌对和指控性质；“控告”自然传达עַל在此处的针对性，而不是中性的“论到”。
- source_word: לְאַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: 呈给亚达薛西王
  rationale: “呈给”符合臣属向君王递交公文的中文语境，并完整保留君王的姓名与称号。
- source_word: כְּנֵמָא
  choice: 信中写道：
  rationale: 该语篇标记引出下一节的信件内容；此译法在现代中文中自然清楚，并保留引文即将开始的功能。
theological_decisions: []
