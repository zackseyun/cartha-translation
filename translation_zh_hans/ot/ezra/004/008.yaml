  register: 采用庄重而自然的现代标准汉语。人名依中文圣经惯用形式译作“利宏、申帅、亚达薛西”；行政用语采用“书记、呈给”。主文以“控告”体现上下文的敌对性质，同时用脚注保留官衔的不确定性。
