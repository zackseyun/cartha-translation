  text: וַֽ/יִּשְׁמְע֔וּ צָרֵ֥י יְהוּדָ֖ה וּ/בִנְיָמִ֑ן כִּֽי בְנֵ֤י הַ/גּוֹלָה֙ בּוֹנִ֣ים הֵיכָ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/001.yaml
  text: The adversaries of Judah and Benjamin heard that the sons of the exile were building a temple for Yahweh[a], the God of Israel.
translation:
  language: zh_hans
  text: 犹大和便雅悯的敌人听说，被掳的群体[a]正在为雅威——以色列的神——建造圣殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“被掳者之子”；这是群体性称谓，指与被掳及归回经历相连的群体，并非严格只指被掳者的亲生儿子或后代。
    reason: 说明希伯来语“……之子”的群体性用法，避免将其误解为仅指生物学后代。
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: 听说
  rationale: 该动词在叙事中表示过去发生的听闻；“听说”自然地引出其后由כִּי所带出的消息内容，也不额外添加原文没有的“那时”或“如今”。
- source_word: צָרֵי
  choice: 敌人
  rationale: צר的复数附属形式指敌对者或对头；“敌人”简明保留其敌对性质，又不限定为军事交战者。
- source_word: יְהוּדָה וּבִנְיָמִן
  choice: 犹大和便雅悯
  rationale: 按现代汉语圣经人名、地名的通行形式音译这两个支派或地域名称。
- source_word: כִּי
  choice: （听说）
  rationale: 此处כִּי引出所听见的内容。汉语用“听说”直接统摄后面的内容，无须另译“因为”。
- source_word: בְנֵי הַגּוֹלָה
  choice: 被掳之人的子孙
  rationale: 尽量保留“……之子”的希伯来表达，同时以“被掳之人”传达הַגּוֹלָה所指与流亡群体相认同的共同体；脚注说明其字面形式和语境所指。
- source_word: בּוֹנִים
  choice: 正在……建造
  rationale: 分词在过去叙事语境中表示持续进行的行动；“正在建造”保留进行体，也不擅自增添“重建”。
- source_word: הֵיכָל
  choice: 圣殿
  rationale: 该词也可指宫殿，但这里明确是为以色列的神所建，因此语境确定为圣殿。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词ל在建造语境中自然译为“为”；神名יהוה以“雅威”音译，保留专名性质。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直译该附属结构，并作为同位语说明雅威的身份。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”可将其作为专名呈现，不以称号代替；同时不借此处理关于其精确古代读音的全部争议。
- issue: בְנֵי הַגּוֹלָה所指群体的表达
  choice: 被掳之人的子孙
  alternative: 被掳归回的人；流亡者
  rationale: 选择保留原文“……之子”的群体表达，不把所有成员都明确限定为亲历被掳后亲自归回的人，也不抹去他们与被掳群体的身份联系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“雅威——以色列的神——”用同位结构对应原文，并避免误读为两个对象；脚注标记紧随其所解释的“被掳之人的子孙”。
