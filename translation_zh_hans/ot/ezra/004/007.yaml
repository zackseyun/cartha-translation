translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在位期间”“上书”“文书”符合波斯宫廷行政语境，但避免增添本节未明说的“控告”。末句原文疑难，正文采用“亚兰文字／亚兰语”的常见区分，脚注明示另一主要解释。所有脚注标记均已置于正文。
