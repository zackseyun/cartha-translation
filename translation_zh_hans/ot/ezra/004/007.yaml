base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/007.yaml
  text: And in the days of Artaxerxes[a], Bishlam, Mithredath, Tabeel, and the rest of his associates wrote to Artaxerxes king of Persia[b]. The text of the letter was written in Aramaic and translated from Aramaic.
translation:
  language: zh_hans
  text: 亚达薛西在位期间，比施兰、米特利达、他别和其余同伴向波斯王亚达薛西上书[b]。这封文书用亚兰文字写成，并译成亚兰语[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“这封文书用亚兰语写成，并从亚兰语翻译出来。”原文措辞较难确定；有人认为这里区分的是文字与语言，也有人认为区分的是书写与翻译。
    reason: 保留原文末句在“亚兰文字／亚兰语”及“写成／翻译”关系上的真实歧义。
  - marker: b
    text: 或译：“和他们其余的同伴。”原文“其”的形式是单数，但所指的群体也可能按集合意义理解。
    reason: 保留כנותו单数后缀的形式与其可能具有集合所指之间的歧义。
lexical_decisions:
- source_word: וּבִימֵי
  choice: 在位期间
  rationale: 这是表示某人所处时代的时间用语；用于君王时译为“在位期间”符合现代汉语，也不额外限定具体年份。
- source_word: אַרְתַּחְשַׁשְׂתָּא
  choice: 亚达薛西
  rationale: 采用现代中文圣经传统中通行的波斯王名译法。
- source_word: כָּתַב
  choice: 上书
  rationale: 动词本义为“写”；在向君王呈递书面文件的行政语境中，“上书”自然简洁，且没有擅自加入“控告”的内容。
- source_word: בִּשְׁלָם מִתְרְדָת טָבְאֵל
  choice: 比施兰、米特利达、他别
  rationale: 按中文圣经人名的惯用音译处理。
- source_word: וּשְׁאָר כנותו
  choice: 和其余同伴
  rationale: שְׁאָר意为“其余”；疑难词כנותו通常理解为“同伴、同僚”。保留单数后缀所反映的“其”而不明确指定先行词。
- source_word: עַל
  choice: 上书……王
  rationale: 与“写”连用时可标示书信所针对或送达的对象；汉语“上书……王”符合行政语境，同时不强行译成“控告”。
- source_word: מֶלֶךְ פָּרָס
  choice: 波斯王
  rationale: 自然表达亚达薛西的王号，紧凑地保留原文同位关系。
- source_word: וּכְתָב הַנִּשְׁתְּוָן
  choice: 这封文书
  rationale: כְתָב指文字或文件，נִּשְׁתְּוָן是指书面文件的罕见借词；“文书”兼顾正式行政文体及词义的不确定性。
- source_word: כָּתוּב אֲרָמִית
  choice: 用亚兰文字写成
  rationale: אֲרָמִית可指亚兰语或亚兰文字。结合下句再次出现“亚兰”，主文采用常见解释，即前者指文字系统，并以脚注保留另一种理解。
- source_word: וּמְתֻרְגָּם אֲרָמִית
  choice: 并用亚兰语译述
  rationale: מְתֻרְגָּם可指翻译或解释、陈述；“译述”保留这两方面的可能性。与前句“亚兰文字”相对，可自然表达文书以亚兰字母书写、内容用亚兰语表述的理解。
