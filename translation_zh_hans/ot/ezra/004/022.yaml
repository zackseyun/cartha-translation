  text: וּ/זְהִירִ֥ין הֱו֛וֹ שָׁל֖וּ לְ/מֶעְבַּ֣ד עַל דְּנָ֑ה לְ/מָה֙ יִשְׂגֵּ֣א חֲבָלָ֔/א לְ/הַנְזָקַ֖ת מַלְכִֽין־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/022.yaml
  text: And be careful not to neglect doing this[b][a]. Why should the damage increase to the detriment of kings?
translation:
  language: zh_hans
  text: 你们务要谨慎，切不可疏忽办理此事[a]。为何要使祸害加增，以致使众王受损呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要小心，不可怠慢执行此事。”
    reason: lexical_alternative
  - marker: b
    text: 原文“众王”为复数；此处可能泛指王室或王权，故未简化为单数“王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְהִירִין הֱווֹ
  choice: 你们要谨慎
  rationale: 形容词与系词构成带命令意味的表达，既可指谨慎警觉，也含警告意味；“要谨慎”自然保留其劝诫语气。
- source_word: שָׁלוּ לְמֶעְבַּד עַל דְּנָה
  choice: 不可疏忽办理这事
  rationale: שָׁלוּ 表示疏忽、懈怠；לְמֶעְבַּד 指施行或办理，עַל דְּנָה 回指前述王令。“疏忽办理”符合行政语境，也保留原文结构。
- source_word: לְמָה יִשְׂגֵּא חֲבָלָא
  choice: 何必让损害加重
  rationale: לְמָה 引出反问；יִשְׂגֵּא 表示增大，חֲבָלָא 指损害或祸患。“何必让……加重”以自然汉语传达反问和可能造成的后果。
- source_word: לְהַנְזָקַת מַלְכִין
  choice: 以致有损众王的利益
  rationale: לְהַנְזָקַת 表示造成损害或不利，מַלְכִין 明确为复数。“众王”保留该复数，不擅自改为单数；补出“利益”使现代汉语表达清楚。
