base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/009.yaml
  text: Then Rehum the commander[a], Shimshai the scribe, and the rest of their associates—the judges, the officials, the Tarpelites, the Persians, the Erechites, the Babylonians, the men of Susa (that is[b], the Elamites)—
translation:
  language: zh_hans
  text: 那时，行政长官利宏、书记伸帅，以及他们其余的同僚：底尼斯人[a]、亚法萨提迦人[b]、他毗拉人、波斯人、亚基卫人、巴比伦人、书珊人（也就是以拦人）——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“审判官”。亚兰语“底尼斯人”可被理解为族群名称，也可能是行政职称；原词的理解并不确定。
    reason: alternative_reading
  - marker: b
    text: 或理解为某类“官员”。这个亚兰语词的含义不确定，传统译本多把它音译为族群名称。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱדַיִן
  choice: 那时
  rationale: 这是承接上文、推进叙事或公文内容的亚兰语副词；“那时”在现代汉语中自然地表达时间与顺序。
- source_word: רְחוּם
  choice: 利宏
  rationale: 人名，按常见圣经汉语译名音译。
- source_word: בְּעֵל טְעֵם
  choice: 行政长官
  rationale: 这一波斯帝国官衔的确切职掌有争议，字面涉及掌管命令或公文的人；“行政长官”既体现其官方权柄，也避免用“统帅”过度限定为军事职务。
- source_word: שִׁמְשַׁי
  choice: 伸帅
  rationale: 人名，采用通行的汉语音译形式。
- source_word: סָפְרָא
  choice: 书记
  rationale: 指负责书写、公文和行政事务的书记或文士；此处是官署语境，“书记”比“文士”更贴切。
- source_word: כְּנָוָתְהוֹן
  choice: 他们其余的同僚
  rationale: 该词指与利宏、伸帅同属一方或共同任事的人；“同僚”符合公文语境。
- source_word: דִּינָיֵא
  choice: 底拿人
  rationale: 该形式传统上被视为族群名称，但也有人从行政语境理解为“审判官”。原词辨识不确定，正文音译可避免将有争议的职称解释写死。
- source_word: אֲפַרְסַתְכָיֵא
  choice: 亚法萨提迦人
  rationale: 含义和所指不明，传统上当作族群名称音译；正文保留音译，避免无充分依据地译成某一级官员。
- source_word: טַרְפְּלָיֵא
  choice: 他毗拉人
  rationale: 身份不明的族群名称，按音译处理。
- source_word: אֲפָרְסָיֵא
  choice: 波斯人
  rationale: 这是明确指向波斯人的族称，采用现代通行名称。
- source_word: ארכוי
  choice: 亚基卫人
  rationale: 可能指来自以力／乌鲁克的人；采用传统音译族称，保留其地理身份的历史不确定性。
- source_word: בָבְלָיֵא
  choice: 巴比伦人
  rationale: 明确的族群或地域名称，采用通行译法。
- source_word: שׁוּשַׁנְכָיֵא דהוא עֵלְמָיֵא
  choice: 书珊人（也就是以拦人）
  rationale: 原文先称“书珊人”，随后以“也就是以拦人”加以说明；括号自然呈现同位解释关系。
theological_decisions: []
translation_notes:
