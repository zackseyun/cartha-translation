base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/010.yaml
  text: 'and the rest of the peoples whom the great and noble Osnappar deported and settled in the city of Samaria[c][b][a], and in the rest of Beyond the River—and now:'
translation:
  language: zh_hans
  text: 以及其余各族的人，就是伟大而尊贵的奥斯纳帕[a]所掳来、安置在撒马利亚城和大河以西的其余地区[b]的人。现在[c]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奥斯纳帕”通常被认作亚述王亚述巴尼拔；正文保留原文中的亚兰文名字形式。
    reason: cross_reference
  - marker: b
    text: “大河以西”是波斯帝国的行政用语，指幼发拉底河以西的地区。也可译作“河西”。
    reason: cultural_note
  - marker: c
    text: “现在”是亚兰文书信中转入正文的套语；也有译法作“等等”或“值此时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר אֻמַּיָּא
  choice: 其余各族的人
  rationale: שְׁאָר表示余下者，אֻמַּיָּא指各族群或各民族；译为“其余各族的人”既保留群体含义，也自然承接上文名单。
- source_word: הַגְלִי
  choice: 所掳来
  rationale: 该动词表示强制迁徙、使之流亡；“掳来”简洁体现帝国迁徙人口的强制性质，并与目的地视角相符。
- source_word: אָסְנַפַּר
  choice: 奥斯纳帕
  rationale: 按亚兰文专名音译，不在正文中直接等同于通常推定的亚述王亚述巴尼拔。
- source_word: רַבָּא וְיַקִּירָא
  choice: 伟大尊贵的
  rationale: 保留两个宫廷式尊称；“伟大尊贵”庄重而符合现代汉语。
- source_word: וְהוֹתֵב הִמּוֹ
  choice: 安置……的人
  rationale: 使役动词指使这些迁来者定居；“安置”能清楚表达行政性的人口安置。
- source_word: בְּקִרְיָה דִּי שָׁמְרָיִן
  choice: 在撒马利亚城
  rationale: 原文קִרְיָה为单数“城”，故不按部分传统译本依语境改作复数“诸城”。
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: 和大河以西其余地区
  rationale: עֲבַר נַהֲרָה是波斯行政用语，指幼发拉底河以西的地区；“大河以西”在汉语中清楚自然，脚注补明其专门含义。
- source_word: וּכְעֶנֶת
  choice: 现在：
  rationale: 这是亚兰文书信中引入正文的套语；“现在：”保留其转折和启下功能，冒号显示下文继续。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以关系从句重组原文较长的名词结构，使“各族的人”同时作为“掳来”和“安置”的受事；保留“撒马利亚城”的单数，并用冒号呈现书信套语的启下作用。
