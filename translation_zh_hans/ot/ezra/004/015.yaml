source:
  edition: WLC
  text: דִּ֡י יְבַקַּר֩ בִּֽ/סְפַר דָּכְרָ֨נַיָּ֜/א דִּ֣י אֲבָהָתָ֗/ךְ וּ֠/תְהַשְׁכַּח בִּ/סְפַ֣ר דָּכְרָנַיָּ/א֮ וְ/תִנְדַּע֒ דִּי֩ קִרְיְתָ֨/א דָ֜ךְ קִרְיָ֣א מָֽרָדָ֗א וּֽ/מְהַנְזְקַ֤ת מַלְכִין֙ וּ/מְדִנָ֔ן וְ/אֶשְׁתַּדּוּר֙ עָבְדִ֣ין בְּ/גַוַּ֔/הּ מִן יוֹמָ֖ת עָלְמָ֑/א עַ֨ל דְּנָ֔ה קִרְיְתָ֥/א דָ֖ךְ הָֽחָרְבַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/015.yaml
  text: so that a search may be made in the book of records of your fathers[a], and you may find in the book of records and know that this city is a rebellious city, harmful to kings and provinces, and that sedition has been made within it from ancient days[b]; for this reason this city was laid waste.
translation:
  language: zh_hans
  text: 请查考你先祖的档案册[a]；你就会从档案册中查到，并得知这城是一座反叛的城，危害列王和各省；自古以来，城中就发生叛乱[b]。正因如此，这城被毁坏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先祖”也可译为“前代君王”或“前任统治者”；原文直译为“你的父辈”。
    reason: lexical_alternative
  - marker: b
    text: 这里的阿拉姆语说法较罕见，指城中有叛乱或反抗活动；也可理解为发动、酝酿或煽动叛乱。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּר
  choice: 请查考
  rationale: 该动词在此承接奏文的请求语气。汉语用“请查考”既体现对君王的敬语，也比生硬的无人称被动句自然。
- source_word: סְפַר דָּכְרָנַיָּא
  choice: 档案册
  rationale: 指官方保存的书面记录。“档案册”兼顾行政语境和原文“册、书”的具体意象。
- source_word: אֲבָהָתָךְ
  choice: 你列祖
  rationale: 字面为“你的父辈”，在此可指王室先祖或前代君王；“列祖”保留亲缘式表达，并以脚注说明语境中的可能范围。
- source_word: וּתְהַשְׁכַּח
  choice: 你必会……查明
  rationale: 基本义为“找到”。结合查阅档案的行政语境，译作“查明”自然；“必会”表达预期结果，而不把它误解为独立命令。
- source_word: וְתִנְדַּע
  choice: 知道
  rationale: 直接保留“认识、得知”的意义，并与前面的“查明”形成结果序列。
- source_word: קִרְיְתָא דָךְ
  choice: 这城
  rationale: 指奏文正在谈论的耶路撒冷；“这城”准确保留指示语气。
- source_word: קִרְיָא מָרָדָא
  choice: 一座反叛的城
  rationale: 保留原文对城市一贯政治性质的指控，不弱化为一次性的反抗行为。
- source_word: מְהַנְזְקַת
  choice: 危害
  rationale: 该分词表示造成损害。“危害”涵盖政治、行政和经济方面的损失，适合正式奏文。
- source_word: מַלְכִין וּמְדִנָן
  choice: 列王和各省
  rationale: 分别指诸王及帝国行政区域；“各省”是现代汉语中清楚而稳妥的行政称谓。
- source_word: אֶשְׁתַּדּוּר עָבְדִין
  choice: 常有人煽动叛乱
  rationale: 该阿拉姆语组合较罕见，语境指城内长期发动或酝酿叛乱。“煽动叛乱”传达其使动、滋事意味；“有人”自然呈现原文未明确行为主体的表达。
- source_word: בְּגַוַּהּ
  choice: 城中
  rationale: 即“在它里面”；明确所指为城，符合自然汉语。
- source_word: מִן יוֹמָת עָלְמָא
  choice: 自古以来
  rationale: 这是表示久远年代的惯用语，并非严格意义上的永恒。“自古以来”简明而准确。
- source_word: עַל דְּנָה קִרְיְתָא דָךְ הָחָרְבַת
  choice: 正因如此，这城才被毁坏
  rationale: 保留明确的因果关系和原文被动语态；“才”凸显奏文所声称的历史因果。
