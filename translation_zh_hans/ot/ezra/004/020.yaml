  yaml_path: translation/ot/ezra/004/020.yaml
  text: And mighty kings were over Jerusalem, ruling over all the region Beyond the River, and tribute, tax, and toll were paid to them.
translation:
  language: zh_hans
  text: 从前有强大的君王统治耶路撒冷，管辖河西全境[a]；贡赋、税款和通行税[b]都缴纳给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河西”是波斯帝国的行政地域名称，指幼发拉底河以西的地区；也可译作“整个河西”。
    reason: cultural_note
  - marker: b
    text: “贡赋、税款和通行税”是三种不同的帝国财政收入类别；各词的具体区别不能完全确定，也可译作“贡赋、捐税和过境税”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִין תַּקִּיפִין
  choice: 强大的君王
  rationale: 复数名词与形容词合译，既表达君王的权势，也符合现代汉语习惯。
- source_word: הֲווֹ עַל יְרוּשְׁלֶם
  choice: 从前……统治耶路撒冷
  rationale: עַל 在此结合下文的管辖语义，表示对耶路撒冷拥有统治权；加入“从前”自然传达过去存在的 הֲווֹ。
- source_word: וְשַׁלִּיטִין
  choice: 管辖
  rationale: 以动词形式表达行使统治权，与前句“统治”衔接自然。
- source_word: בְּכֹל עֲבַר נַהֲרָה
  choice: 河西全境
  rationale: “河西”保留波斯行政语境中“河那边”，即幼发拉底河以西之地的专名意味；“全境”表达 בְּכֹל 的范围。
- source_word: מִדָּה
  choice: 贡赋
  rationale: 该词属于帝国财政三联用语，此处指向统治者缴纳的贡纳或赋税。
- source_word: בְלוֹ
  choice: 税款
  rationale: 指三类财政收入中的一种税项；采用普通读者容易理解的概括性用语，同时在脚注说明词义区分并不完全确定。
- source_word: הֲלָךְ
  choice: 关津
  rationale: 很可能指道路、运输或过境所征收的费用；“关津”能与一般税款区分，并适合历史行政语境。
- source_word: מִתְיְהֵב לְהוֹן
  choice: 都缴纳给他们
  rationale: 被动式直义为“被交给他们”；财政语境中译为“缴纳给他们”自然准确，“都”统摄前列三项。
