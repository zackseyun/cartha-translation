base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/016.yaml
  text: We make known to the king that if this city is rebuilt and its walls are completed[b][a], then because of this you will have no possession in the province Beyond the River.
translation:
  language: zh_hans
  text: 我们禀告王：若这城重建，城墙修筑完毕，王在河西省[b]就没有份额[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “份额”所译的亚兰文也可译作“权益”；在这里也可能特指王从该地区所得的财政收入。
    reason: lexical_alternative
  - marker: b
    text: “河西省”原文直译为“大河那边”，是波斯帝国对幼发拉底河以西行省的称呼。
    reason: cultural_note
lexical_decisions:
- source_word: מְהוֹדְעִין אֲנַחְנָה לְמַלְכָּא
  choice: 我们要禀告王
  rationale: 这是公函中的正式陈述。“禀告”自然体现下属向君王报告的语气；“要”承接亚兰文分词在书信中的陈述功能。
- source_word: דִּי הֵן
  choice: 如果
  rationale: 这组虚词引出报告内容中的真实条件；汉语以冒号和“如果”即可自然表达，不必机械加入“看哪”。
- source_word: קִרְיְתָא דָךְ
  choice: 这城
  rationale: 保留指示词“这”，指来信者所处并谈论的耶路撒冷。
- source_word: תִּתְבְּנֵא
  choice: 重建起来
  rationale: 被动式未完成体用于将来的条件句；“重建起来”既表达恢复建造，也符合现代汉语习惯。
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: 城墙也修完了
  rationale: יִשְׁתַּכְלְלוּן 表示工程达到完成状态；“修完”比生硬的“被完成”更自然，同时保留建筑语境。
- source_word: לָקֳבֵל דְּנָה
  choice: 那么
  rationale: 在汉语条件句中，“那么”清楚表达由前述情形所产生的结果，也避免冗赘地译成“因此因为这事”。
- source_word: חֲלָק
  choice: 产业
  rationale: 该词基本义为“份、分得之物”，在此行政政治语境中指王在该地区所拥有的权益或领地份额；“产业”保留这种较宽泛的含义，不限缩为税收。
- source_word: בַּעֲבַר נַהֲרָא
  choice: 在河西省
  rationale: 字面为“大河那边”，在波斯行政语境中是幼发拉底河以西地区的名称。正文采用现代中文常见且简洁的专名“河西省”，并以脚注解释。
- source_word: לָא אִיתַי לָךְ
  choice: 王……就再没有……了
  rationale: 存在句配与格表达领有；汉语以“没有”自然呈现。“再”体现警告中的结果意味，但不把对象具体化为单一税项。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代公函语体。“禀告王”体现臣属上奏的正式语气；条件句保持原文的警告力度。正文没有把 חֲלָק 过度限定为“税收”，脚注保留其“份额、权益、收入”等可能含义。
