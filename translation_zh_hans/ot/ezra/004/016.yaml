- from: 我们要禀告王：如果这城重建起来，城墙也修完了，那么王在河西省就再没有产业了。[a][b]
  to: 我们禀告王：若这城重建，城墙修筑完毕，王在河西省[b]就没有份额[a]。
  rationale: 修订以“份额”对应 חֲלָק，避免“产业”所带的地产或基业含义；删去“再”，不增添原文未表明的时间推论。其余条件句、正式上呈语气及“河西省”的行政称谓均可保留。脚注锚点改置于相应词语之后。
