base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/013.yaml
  text: Now let it be known to the king that if this city is rebuilt and its walls are completed, they will not pay tribute, tax, or toll, and in the end it will damage the revenue of the kings.
translation:
  language: zh_hans
  text: 现在请王知悉：这城若重建，城墙修完，居民就不会缴纳贡税、赋税和关税，最终必使诸王的收入受损[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“最终必使诸王遭受损失。”亚兰语原句十分简约；把所受损失具体理解为“收入受损”，是根据上文所说不缴纳贡税、赋税和关税作出的判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: 现在
  rationale: 这是引出警告或结论的亚兰语话语副词；“现在”保留其承接作用，不把它过度解释为严格的因果推论。
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: 奏请王知悉
  rationale: 原文是帝国亚兰语公文中的正式告知套语；此译既体现臣属上奏的语境，也保持庄重而自然的现代汉语表达。
- source_word: דִּי הֵן
  choice: 若
  rationale: 这一组合引出告知内容中的条件句；汉语用“若”简洁表达正式文体中的条件关系。
- source_word: קִרְיְתָא דָךְ
  choice: 这城
  rationale: 指写信者所说的耶路撒冷；“这城”直接保留指示词的近指语气。
- source_word: תִּתְבְּנֵא
  choice: 重建
  rationale: 条件语境中的被动未完成式指城市恢复建造；汉语无需另加被动标记。
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: 城墙若修完
  rationale: 动词表示完成、竣工；重复“若”使并列条件在现代汉语中清楚自然。
- source_word: מִנְדָּה
  choice: 贡银
  rationale: 这是波斯行政税项三联语中的一种国家征收项目；“贡银”可与后两项区分，并符合古代臣属缴纳的语境。
- source_word: בְלוֹ
  choice: 赋税
  rationale: 该词是行政税项之一；“赋税”是清楚且庄重的现代汉语统称，并与“贡银”和“关税”形成区别。
- source_word: הֲלָךְ
  choice: 关税
  rationale: 该词很可能指与通行或运输有关的税费；“关税”在此行政语境中简明易懂。
- source_word: לָא יִנְתְּנוּן
  choice: 居民就不会缴纳
  rationale: 动词字面为“给”，在税务语境中自然译为“缴纳”；原文复数主语未明说，按语境补出“居民”，避免汉语主语含混。
- source_word: וְאַפְּתֹם מַלְכִים תְּהַנְזִק
  choice: 最终必使诸王的收入受损
  rationale: 这一简约表达涉及对君王财政利益的损害；“收入”由前述不缴税项的上下文支持，但原句也可较宽泛地理解为使诸王遭受损失，因此加注保留歧义。
