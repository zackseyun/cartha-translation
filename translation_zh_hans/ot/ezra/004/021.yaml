base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/021.yaml
  text: Now issue a decree to make these men stop[b][a], and this city shall not be rebuilt until a decree is issued by me.
translation:
  language: zh_hans
  text: 现在，你们要下令[a]叫这些人停工；这城不得重建，直到我颁布命令为止[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下令”也可译作“颁布命令”；亚兰语习语直译为“设立命令”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“直到有命令从我而设。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: 现在
  rationale: 这是引出王当前命令的副词；“现在”自然地表达即时性，又不额外强化因果关系。
- source_word: שִׂימוּ טְּעֵם
  choice: 下令
  rationale: 亚兰语习语直译为“设立命令／决定”；“下令”符合现代汉语的王室行政语境，简洁而正式。
- source_word: לְבַטָּלָא
  choice: 叫……停工
  rationale: 该动词可指使停止、废止；结合重建工程的上下文，“叫这些人停工”清楚体现使役含义。
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: 这些人
  rationale: 原文为“这些男子／这些人”；现代汉语以“这些人”自然指称信函中所说的那群施工者，不额外突出性别。
- source_word: וְקִרְיְתָא דָךְ
  choice: 这城
  rationale: 准确保留近指；“这城”比“这座城市”更凝练，也符合庄重的历史叙事语体。
- source_word: לָא תִתְבְּנֵא
  choice: 不得重建
  rationale: 保留被动意义及行政禁令的语气；“不得”比单纯的“不会”更准确地表达王命所设的禁止。
- source_word: עַד מִנִּי טַעְמָא יִתְּשָׂם
  choice: 直到我颁布命令为止
  rationale: 原文直译为“直到有命令从我而设”；中文改用主动句更自然，同时明确后续命令须出自王本人。
theological_decisions: []
