  text: וַ/יֹּאמֶר֩ לָ/הֶ֨ם זְרֻבָּבֶ֜ל וְ/יֵשׁ֗וּעַ וּ/שְׁאָ֨ר רָאשֵׁ֤י הָֽ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לֹֽא לָ֣/כֶם וָ/לָ֔/נוּ לִ/בְנ֥וֹת בַּ֖יִת לֵ/אלֹהֵ֑י/נוּ כִּי֩ אֲנַ֨חְנוּ יַ֜חַד נִבְנֶ֗ה לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֣ר צִוָּ֔/נוּ הַ/מֶּ֖לֶךְ כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/003.yaml
  text: But Zerubbabel[a], Jeshua, and the rest of the heads of the fathers’ houses of Israel said to them, “You have no part with us in building a house for our God, for we alone will build it for Yahweh, the God of Israel, just as King Cyrus, the king of Persia[b], commanded us.”
translation:
  language: zh_hans
  text: 所罗巴伯、耶书亚和以色列其余的宗族首领对他们说：“你们不能和我们一同为我们的神建造殿宇[a]；因为我们自己[b]要为耶和华——以色列的神建造，正如波斯王居鲁士所吩咐我们的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿宇”原文直译为“房屋”，这里指圣殿。
    reason: 说明语境中的文化及词义所指。
  - marker: b
    text: “我们自己”所译的原文词可直译为“在一起”或“一同”。在这里拒绝对方参与的语境中，它指所罗巴伯一方作为一个群体自行建造，而不包括提出合作的人。
    reason: 保留 יַחַד 的字面义及其在本句中的语境含义，避免把词义简单等同于“独自”。
lexical_decisions:
- source_word: זְרֻבָּבֶל וְיֵשׁוּעַ
  choice: 所罗巴伯、耶书亚
  rationale: 按现代中文圣经人名的通行译法音译；“耶书亚”也保留此处希伯来名字的形式，有别于通常译作“约书亚”的较长形式。
- source_word: וּשְׁאָר רָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: 以色列其余的宗族首领
  rationale: 该词组指父系家族或宗族的负责人；“宗族首领”既体现古代社会结构，也比逐字译成“父家的头”自然。
- source_word: לֹא לָכֶם וָלָנוּ
  choice: 你们不能和我们一同
  rationale: 原文直译近于“不是你们和我们（共同）的事”，语境中明确拒绝双方共同参与；此译法在现代中文中自然传达排除共同建造的意思。
- source_word: בַּיִת לֵאלֹהֵינוּ
  choice: 为我们的神建造殿宇
  rationale: בַּיִת 字面是“房屋”，在本段明确指神殿；正文用“殿宇”避免误解，并以脚注保留字面信息。
- source_word: כִּי אֲנַחְנוּ יַחַד נִבְנֶה
  choice: 我们要一起建造
  rationale: יַחַד 的直接意义是“一起”。这里指犹太群体内部一起建造，而不是同前来提议的人合作；正文保留原词的表达张力，脚注说明语境。
- source_word: לַיהוָה
  choice: 为耶和华
  rationale: 原文使用四字神名 יהוה；采用现代中文广为人知的传统音译“耶和华”，而不以称号“主”替代专名。
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ פָּרָס
  choice: 波斯王居鲁士
  rationale: 保留君王姓名和波斯王的身份；中文不重复两个“王”更为自然，而信息无损。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用以色列神的专名。正文以中文读者最熟悉的专名形式“耶和华”呈现，不用“上主”将专名改成称号；“雅威”则是另一种较接近学术拟音的译法。
- issue: 拒绝共同建殿的范围
  choice: 译为“你们不能和我们一同”，并将“我们要一起”理解为以色列归回群体内部的共同行动
  alternative: 译为“你们和我们无分”；或把 יַחַד 直接解释为“只有我们”
  rationale: 上下文显示领袖拒绝提议者参与，但 יַחַד 本身通常意为“一起”，并非词汇上直接等于“独自”。因此正文保留“一起”，借语境及脚注说明其所指群体，不把解释写成原词本义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宗族首领”交代古代家族领导结构；“殿宇”比“房屋”更能让普通读者立即明白所指，同时由脚注保留原文字面意义。引语中的转折以分号体现，避免额外加入原文没有的强转折词。
