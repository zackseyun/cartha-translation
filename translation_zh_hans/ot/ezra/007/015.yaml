  text: וּ/לְ/הֵיבָלָ֖ה כְּסַ֣ף וּ/דְהַ֑ב דִּֽי מַלְכָּ֣/א וְ/יָעֲט֗וֹ/הִי הִתְנַדַּ֨בוּ֙ לֶ/אֱלָ֣הּ יִשְׂרָאֵ֔ל דִּ֥י בִֽ/ירוּשְׁלֶ֖ם מִשְׁכְּנֵֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/015.yaml
  text: and to bring the silver and gold that the king and his counselors have freely offered to the God of Israel[a], whose dwelling is in Jerusalem,
translation:
  language: zh_hans
  text: 并把王和他的谋士甘心献给以色列的上帝、就是那位居所在耶路撒冷的上帝的金银带去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就是那位住在耶路撒冷的上帝。”亚兰文更直译为“其居所在耶路撒冷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהֵיבָלָה
  choice: 并……带去
  rationale: 这是带有连词和介词的亚兰文不定式，在王命中承接前文，表达所要执行的事项。“带去”自然地体现把金银运往耶路撒冷，而不额外限定运输方式。
- source_word: כְּסַף וּדְהַב
  choice: 金银
  rationale: 对应“银和金”。现代汉语惯用“金银”，而后面的关系从句已明确这是王和谋士所献的特定财物。
- source_word: מַלְכָּא וְיָעֲטוֹהִי
  choice: 王和他的谋士
  rationale: מַלְכָּא指特定的王；יָעֲטוֹהִי指其王室顾问。“谋士”保留宫廷语境，也符合庄重而通俗的现代汉语。
- source_word: הִתְנַדַּבוּ
  choice: 甘心献给
  rationale: 该动词强调自愿、出于意愿的奉献。“甘心献给”同时表达自愿性和献纳对象，且不将其过度术语化为某一种特定祭物。
- source_word: לֶאֱלָהּ יִשְׂרָאֵל
  choice: 给以色列上帝
  rationale: 直译其奉献对象；“以色列上帝”在现代汉语中自然、明确。
- source_word: דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ
  choice: 这位上帝的居所在耶路撒冷
  rationale: 保留原文以名词“居所”表达的结构，而不简化为“住在”。增加“这位上帝”是为在汉语中清楚连接所指，并避免关系从句层叠造成歧义。
theological_decisions:
- issue: מִשְׁכְּנֵהּ所表达的上帝与耶路撒冷的关系
  choice: 这位上帝的居所在耶路撒冷
  alternative: 这位上帝住在耶路撒冷
  rationale: 原文使用“他的居所”这一名词表达，具有圣殿中心的含义。译文保留这一形式，不把它解释为上帝只受空间限制于耶路撒冷，也不消除原文所保有的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“甘心献给”保留自愿奉献的意味；以分号分开运输金银与说明上帝居所的从句，使长句关系清晰。
