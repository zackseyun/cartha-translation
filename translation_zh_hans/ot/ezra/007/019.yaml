  rationale: 修订使“完整交付／呈交”的命令式与“在耶路撒冷的神面前”的介词短语在汉语中形成自然、完整的搭配；并以“服事之用”更准确呈现圣殿器皿的用途。脚注锚点均紧随其所对应的词组，异译文本也可独立理解。
