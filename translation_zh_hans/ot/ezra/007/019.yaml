  terminology: 保留“器皿”“你神的殿”“耶路撒冷的神”，忠实反映原文的圣殿及行政语境，不加入后世宗派术语。“服事”对应此处宽泛的圣殿服务，脚注保留“敬拜”的较窄解释。
