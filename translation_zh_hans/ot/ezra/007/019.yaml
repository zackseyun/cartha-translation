  text: וּ/מָֽאנַיָּ/א֙ דִּֽי מִתְיַהֲבִ֣ין לָ֔/ךְ לְ/פָלְחָ֖ן בֵּ֣ית אֱלָהָ֑/ךְ הַשְׁלֵ֕ם קֳדָ֖ם אֱלָ֥הּ יְרוּשְׁלֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/019.yaml
  text: And the vessels that are given to you for the service of the house of your God[b][a], deliver in full before the God of Jerusalem.
translation:
  language: zh_hans
  text: 至于交给你的器皿，是供在你神的殿中服事之用的[a]；你要把这些器皿全部呈交在[b]耶路撒冷的神面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“供在你神的殿中敬拜之用”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“如数交付”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָאנַיָּא
  choice: 至于……器皿
  rationale: 该亚兰语词指器具或容器；在圣殿语境中，“器皿”既自然，也能保留其礼仪用途。句首用“至于”承接诏令中的新增事项。
- source_word: דִּי
  choice: ……的
  rationale: 关系词引出修饰“器皿”的从句；汉语以“是……的”结构自然表达。
- source_word: מִתְיַהֲבִין לָךְ
  choice: 交给你的
  rationale: 保留被动含义，同时符合现代汉语诏令语体；不强行限定为正在给予或已经给予。
- source_word: לְפָלְחָן בֵּית אֱלָהָךְ
  choice: 供你神的殿使用
  rationale: פְלָחָן 可指服事、礼仪事奉或敬拜。“供……使用”在器皿语境中自然，并保留其用途的广度；另以脚注注明“供……敬拜之用”的可能。
- source_word: הַשְׁלֵם
  choice: 如数交到
  rationale: 该命令式含使之完整、全部交付之意。“如数”表达完整无缺，“交到”适合器皿的移交语境。
- source_word: קֳדָם
  choice: 在……面前
  rationale: 直接保留“在……面前／在……临在中”的空间和礼仪色彩。
- source_word: אֱלָהּ יְרוּשְׁלֶם
  choice: 耶路撒冷的神
  rationale: 忠实保留波斯时期行政语体中神与耶路撒冷的关联，不改写为更具解释性的称谓。
theological_decisions:
- issue: 圣殿相关用语
  choice: 供你神的殿使用
  alternative: 供你神的殿敬拜之用
  rationale: 原词涵盖服事和礼仪用途，但未必只指狭义的敬拜行为。正文采用较宽泛的“使用”，脚注保留“敬拜之用”的可能，以免过度限定。
- issue: הַשְׁלֵם 的交付含义
  choice: 如数交到
  alternative: 如数呈交在
  rationale: 正文突出完整交付器皿的实际动作；“呈交”也可能更强调正式呈献或移交，故列作脚注异译。
translation_notes:
  register: 采用现代、庄重而清晰的诏令语体。“你神”保留原文对受令者以斯拉的第二人称表达；“耶路撒冷的神”照译原文称谓。脚注标记均紧随其对应词组。
