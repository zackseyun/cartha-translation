base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/022.yaml
  text: up to one hundred talents of silver[a], and up to one hundred cors of wheat, and up to one hundred baths of wine, and up to one hundred baths of oil, and salt without limit.
translation:
  language: zh_hans
  text: 银子不超过一百他连得，小麦不超过一百柯珥，酒不超过一百罢特，油不超过一百罢特，盐不限量。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不限量”直译为“没有写明的”，意思是没有规定盐的数额。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: 最多
  rationale: 在这份行政供应清单中，该词表示各项物资的最高限额；译作“最多”自然、明确，并保留反复列明限额的语气。
- source_word: כְּסַף
  choice: 银子
  rationale: 原词指银；这里又以重量单位“他连得”计量，因此译作“银子”比泛称“钱”更准确。
- source_word: כַּכְּרִין
  choice: 他连得
  rationale: 这是古代按重量计算的单位。采用通行音译，避免以不确定的现代数值替换原文单位。
- source_word: חִנְטִין
  choice: 小麦
  rationale: 原词特指小麦，不宜泛译为“粮食”或“谷物”。
- source_word: כֹּרִין
  choice: 柯珥
  rationale: 这是古代干量单位；采用音译以保留原文所列的具体计量制度。
- source_word: חֲמַר
  choice: 酒
  rationale: 该亚兰语词在这份圣殿供应清单中指酒。
- source_word: בַּתִּין
  choice: 罢特
  rationale: 这是古代液量单位的复数形式；采用通行音译，不作有争议的现代容量换算。
- source_word: מְשַׁח
  choice: 油
  rationale: 原词指油；虽按语境很可能是橄榄油，原文本身没有明说，故不补入“橄榄”。
- source_word: מְלַח
  choice: 盐
  rationale: 直接对应清单末项所列的物资。
- source_word: דִּי לָא כְתָב
  choice: 不限量
  rationale: 字面是“没有写明的”，在行政命令中意指没有规定数额。正文采用自然的功能性表达，字面形式则留在脚注中。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的行政清单语体。各项均以“最多”标明上限；古代计量单位保留音译，以免引入不确定的现代换算。将脚注标记置于其实际说明的“盐不限量”之后，而不是置于“银子”之后。
