  text: מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל מִתְנַדַּ֣ב בְּ/מַלְכוּתִ/י֩ מִן עַמָּ֨/ה יִשְׂרָאֵ֜ל וְ/כָהֲנ֣וֹ/הִי וְ/לֵוָיֵ֗/א לִ/מְהָ֧ךְ לִֽ/ירוּשְׁלֶ֛ם עִמָּ֖/ךְ יְהָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/013.yaml
  text: A decree is issued by me that anyone in my kingdom from the people of Israel[a], and their priests and Levites, who freely offers himself to go to Jerusalem with you[b], may go.
translation:
  language: zh_hans
  text: 我颁布谕旨：我国境内，凡以色列民及其[b]祭司和利未人中自愿[a]与你一同前往耶路撒冷的，都可前去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凡自愿的人”。亚兰文分词强调出于自愿、甘心采取行动。
    reason: lexical_alternative
  - marker: b
    text: “其”或可译作“他的”；按上下文，理解为指以色列民较为自然。
    reason: alternative_reading
lexical_decisions:
- source_word: מִנִּי שִׂים טְעֵם
  choice: 我颁布谕旨
  rationale: 这是王室行政用语，直译为“由我制定命令”；“我颁布谕旨”既保留命令出自君王，也符合现代中文庄重公文语体。
- source_word: כָל מִתְנַדַּב
  choice: 凡……中自愿……的
  rationale: Hitpael 分词突出主动、自愿的行动；“自愿”清楚保留这一意涵，而“凡……的”自然表达泛指个人。
- source_word: בְּמַלְכוּתִי
  choice: 我国境内
  rationale: 这里指君王统治的疆域；“我国境内”比生硬的“在我的国中”更符合中文诏令语体。
- source_word: מִן עַמָּה יִשְׂרָאֵל
  choice: 以色列民……中
  rationale: 介词 מִן 表示志愿者所属的群体；用“……中”准确表达从这一群体中有人自愿前往。
- source_word: וְכָהֲנוֹהִי וְלֵוָיֵא
  choice: 和他们的祭司、利未人
  rationale: 后缀在语境中最自然地回指以色列民，故译作“他们的祭司”；利未人作为并列群体处理。原文后缀形式也容许另一种理解，收入脚注。
- source_word: לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ
  choice: 与你一同前往耶路撒冷
  rationale: 保留前往的目的地以及与以斯拉同行的关系，语序按现代汉语自然调整。
- source_word: יְהָךְ
  choice: 都可以去
  rationale: 在谕旨语境中，该未完成式带有准许意味；“可以去”比单纯未来式“将去”更准确。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，以“我颁布谕旨”体现王室诏令语气；句法作中文化调整，同时保留“自愿”、同行关系、许可语气以及代词后缀的真实歧义。
