base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/001.yaml
  text: After these things[a], in the reign of Artaxerxes king of Persia, Ezra son of Seraiah, son of Azariah, son of Hilkiah—
translation:
  language: zh_hans
  text: 这些事以后，在波斯王亚达薛西在位期间，以斯拉是西莱雅的儿子[a]；西莱雅是亚撒利雅的儿子；亚撒利雅是希勒家的儿子——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 家谱中的希伯来语“儿子”也可以指较远的后裔，不一定表示直接的父子关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר הַ/דְּבָרִים הָ/אֵלֶּה
  choice: 这些事以后
  rationale: וְ连接前文并引出新的叙事段落；中文以“这些事以后”自然承接上下文，无须另加“现在”。דְּבָרִים在此指此前发生的事。
- source_word: בְּ/מַלְכוּת
  choice: 在……统治期间
  rationale: 此处指君王在位掌权的时期，而非疆域意义上的“国”。“统治期间”准确且符合现代汉语。
- source_word: אַרְתַּחְשַׁסְתְּא מֶלֶךְ פָּרָס
  choice: 波斯王亚达薛西
  rationale: 按现代中文圣经人名惯例音译王名，并用自然的汉语称号次序表达“亚达薛西，波斯王”。
- source_word: עֶזְרָא
  choice: 以斯拉
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 保留希伯来家谱公式的字面形式；该词在家谱中也可能泛指较远的男性后裔，此可能性以脚注说明。
- source_word: שְׂרָיָה / עֲזַרְיָה / חִלְקִיָּה
  choice: 西莱雅／亚撒利雅／希勒家
  rationale: 采用现代中文圣经中较通行、可辨识的人名译法。
theological_decisions: []
