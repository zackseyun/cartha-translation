lexical_decisions:
- source_word: בֶּן
  choice: ……的子孙
  rationale: 本节处于家谱链条中，בֶּן可指直系儿子，也可指谱系中的后裔。译作“子孙”既符合现代汉语家谱表达，也避免误断各人必为紧邻的父子关系。
- source_word: אֲמַרְיָה
  choice: 亚玛利雅
  rationale: 按希伯来语人名音译，并采用现代中文圣经语境中清楚、庄重的常见形式。
- source_word: עֲזַרְיָה
  choice: 亚撒利雅
  rationale: 按希伯来语人名音译，采用通行中文形式。
- source_word: מְרָיוֹת
  choice: 米拉约
  rationale: 按希伯来语 מְרָיוֹת 音译，尽量呈现其读音，同时保持现代汉语人名形式自然易读。
theological_decisions:
- issue: 家谱中בֶּן所表示的亲属距离
  choice: 译作“……的子孙”，并加注说明其范围
  alternative: 译作“……的儿子”
  rationale: 希伯来家谱中的בֶּן不一定只表示直接父子关系。正文采用“子孙”以保留谱系关系而不强定亲属距离；注释说明原文用词及其可能范围。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保持本节家谱条目的连续节奏。人名以音译呈现；句末逗号保留其与上下文家谱链条相接的形式。
