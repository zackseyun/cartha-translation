base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/007.yaml
  text: And some of the sons of Israel[a], and some of the priests, and the Levites, and the singers, and the gatekeepers[b], and the temple servants went up to Jerusalem in the seventh year of King Artaxerxes.
translation:
  language: zh_hans
  text: 亚达薛西王在位第七年，以色列人中有一些人，又有一些祭司，以及利未人、歌唱者、守门者和殿役[a]，上耶路撒冷去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿役”也可音译作“尼提宁”，指一类专门在圣殿服役的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 上……去了
  rationale: 保留עלה前往高处的方向意味；用于耶路撒冷也契合其地理及敬拜语境，同时符合现代汉语表达。
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: 以色列人中有一些人
  rationale: 将介词מִן的部分含义明确译出；正文采用自然现代汉语，脚注保留“以色列的子孙”这一较贴近字面的表达。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 这一圣殿职分类别的标准汉语译法。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 准确表达这一支派及圣殿职分类别。
- source_word: הַמְשֹׁרְרִים
  choice: 歌唱者
  rationale: 该词特指承担歌唱职务的人，较“乐师”更精确，也避免使用可能暗示现代职业身份的“歌手”。
- source_word: הַשֹּׁעֲרִים
  choice: 守门者
  rationale: 自然且准确地表达负责看守圣殿各门的人员。
- source_word: הַנְּתִינִים
  choice: 殿役
  rationale: 用简洁的功能性称谓表达这一特定圣殿服役群体；脚注补充其音译及身份说明。
- source_word: אֶל יְרוּשָׁלִָם
  choice: 上耶路撒冷
  rationale: “上”既体现עלה的方向意味，又是汉语圣经语境中前往耶路撒冷的自然表达。
- source_word: בִּשְׁנַת שֶׁבַע לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: 亚达薛西王在位第七年
  rationale: 按现代汉语纪年习惯自然重组，同时完整保留王名、王号和第七年的信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。为避免汉语中过度重复“和”造成生硬，使用“还有”引出职事群体，并以顿号式并列呈现希伯来文连续连接词所表达的名单结构。将时间短语前置，使长串主语后的谓语关系更清楚；未改变原文信息次序所承载的实质意义。
