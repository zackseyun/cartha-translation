  rationale: 补出“又有一些祭司”，以对应祭司前明确出现的部分格介词；保留利未人等后续并列群体的原文句法开放性，避免把部分限定机械地扩展至每一项。删去不必要的“了”，使现代叙事句更简洁。原脚注 a 仅说明正文中已经清楚表达的“以色列人中有一些人”，不再需要；将保留的尼提宁说明改标为 a。
