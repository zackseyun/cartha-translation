  text: וּ/שְׁאָ֗ר חַשְׁחוּת֙ בֵּ֣ית אֱלָהָ֔/ךְ דִּ֥י יִפֶּל לָ֖/ךְ לְ/מִנְתַּ֑ן תִּנְתֵּ֕ן מִן בֵּ֖ית גִּנְזֵ֥י מַלְכָּֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/020.yaml
  text: And whatever other need of the house of your God falls to you to provide[a], you shall provide it from the house of the king’s treasuries.
translation:
  language: zh_hans
  text: 凡是你神的殿另外所需、要由你供应的，你都要从王的库房中供应。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王的库房”，原文较直译为“王的宝库之屋”。
    reason: 说明原文“屋／库房”与“王的宝库”构成的复合表达。
lexical_decisions:
- source_word: וּשְׁאָר חַשְׁחוּת
  choice: 若还有什么需要
  rationale: וּשְׁאָר 表示其余或额外之事，חַשְׁחוּת 表示需要、所需之物；合译为“若还有什么需要”，自然表达前列项目以外未具体说明的需求。
- source_word: בֵּית אֱלָהָךְ
  choice: 你神殿中
  rationale: 原文直译为“你神的殿（家）”。汉语圣经语境中“神殿”既保留“神的殿”这一称谓，也清楚指向圣殿。
- source_word: דִּי יִפֶּל לָךְ לְמִנְתַּן
  choice: 是你有责任供应的
  rationale: יִפֶּל לָךְ 字面有“落到你身上”之意，在此表达归某人负责；לְמִנְתַּן 是“给予、供应”。译文保留责任归属和实际供应两层意思，避免生硬直译。
- source_word: תִּנְתֵּן
  choice: 你要……拨付
  rationale: 该动词再次使用“给予”，在行政财政语境中指从指定来源提供款项或物资；“拨付”自然体现命令语气及国库支出的含义。
- source_word: מִן בֵּית גִּנְזֵי מַלְכָּא
  choice: 从王的府库中
  rationale: 原文较直译为“从王的宝库之屋”，指王室储藏财物的库房或财政库；“王的府库”简洁自然，同时不限定为现代意义上的单一财政机构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的行政语体。“你神殿中”明确圣殿语境；“有责任供应”解释亚兰语习语而不增添神学判断；“拨付”与王室府库的财政场景相称。
