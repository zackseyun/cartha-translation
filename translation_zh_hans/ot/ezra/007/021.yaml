base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/021.yaml
  text: 'And from me, I, King Artaxerxes, issue a decree to all the treasurers in Beyond the River: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, let it be done diligently.'
translation:
  language: zh_hans
  text: “我亚达薛西王亲自颁布谕旨，给河西[a]所有的司库：祭司以斯拉，就是天上之神律法的文士，无论向你们请求什么，都要准确地照办[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河西”是波斯帝国的行政区名称，指幼发拉底河以西的地区。
    reason: cultural_note
  - marker: b
    text: “准确地”也可译作“迅速地”或“周全地”；这个亚兰语副词强调认真、完全地执行命令。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי אֲנָה
  choice: 我……也亲自
  rationale: 保留原文“从我，我”的第一人称强调，同时用自然的现代汉语表达命令由王本人发出。
- source_word: אַרְתַּחְשַׁסְתְּא מַלְכָּא
  choice: 亚达薛西王
  rationale: 采用现代中文圣经中通行的人名和王号次序。
- source_word: שִׂים טְעֵם
  choice: 降旨
  rationale: 该亚兰语行政用语指正式颁布命令；“降旨”简洁传达君王发布法令的语境。
- source_word: לְכֹל גִּזַּבְרַיָּא
  choice: 给……所有的司库
  rationale: גִּזַּבְרַיָּא 指掌管国库或财政的官员；“司库”准确、简明，也保留官职色彩。
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: 河西
  rationale: 这是波斯帝国对幼发拉底河以西地区的行政称谓；“河西”既简练，又能作为地区名称理解。
- source_word: כָל דִּי יִשְׁאֲלֶנְכוֹן
  choice: 无论向你们求什么
  rationale: 忠实保留不定关系结构和“求取、请求”的基本语义，不把动词强化为“索取”或“命令”。
- source_word: עֶזְרָא כָהֲנָה
  choice: 祭司以斯拉
  rationale: 直接保留以斯拉的祭司身份和原文的同位结构。
- source_word: סָפַר דָּתָא דִּי אֱלָהּ שְׁמַיָּא
  choice: 天上之上帝律法的文士
  rationale: “文士”兼具抄写、行政和律法学识方面的含义；不额外加入“通晓”等原文未明说的解释。
- source_word: אָסְפַּרְנָא יִתְעֲבִד
  choice: 都要切实照办
  rationale: אָסְפַּרְנָא 可表示准确、周全、迅速地执行；“切实照办”在行政语境中突出认真而完全地遵行，又不单方面限定为速度。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，并保留王室诏令的正式语气。“亲自”自然呈现原文重复第一人称的强调；“都要切实照办”符合中文行政命令习惯，同时借脚注保留副词在准确、周全和迅速之间的语义幅度。
