revisions:
- from: “我亚达薛西王也亲自降旨给河西[a]所有的司库：祭司以斯拉，就是天上之上帝律法的文士，无论向你们求什么，都要切实照办[b]。”
  to: “我亚达薛西王亲自颁布谕旨，给河西[a]所有的司库：祭司以斯拉，就是天上之神律法的文士，无论向你们请求什么，都要准确地照办[b]。”
  rationale: 修订仅处理汉语表达、行政语体及副词语义的显化。“亲自”保留“从我，我”的强调；“颁布谕旨”对应正式设立命令；“天上之神律法的文士”维持原文层层属格结构；“请求”不把以斯拉的行为强化为索取或命令。脚注锚点分别紧随行政区名称及执行方式，定位明确。
