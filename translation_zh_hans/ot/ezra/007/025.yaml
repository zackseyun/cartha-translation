  text: וְ/אַ֣נְתְּ עֶזְרָ֗א כְּ/חָכְמַ֨ת אֱלָהָ֤/ךְ דִּֽי בִ/ידָ/ךְ֙ מֶ֣נִּי שָׁפְטִ֞ין וְ/דַיָּנִ֗ין דִּי לֶהֱוֺ֤ן דאנין לְ/כָל עַמָּ/ה֙ דִּ֚י בַּ/עֲבַ֣ר נַהֲרָ֔/ה לְ/כָל יָדְעֵ֖י דָּתֵ֣י אֱלָהָ֑/ךְ וְ/דִ֧י לָ֦א יָדַ֖ע תְּהוֹדְעֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/025.yaml
  text: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
translation:
  language: zh_hans
  text: “至于你，以斯拉，要照着你手中所有、从你上帝而来的智慧[a]，委派司法官和审判官，好让他们审判河西[b]所有的百姓，就是一切知道你上帝律法的人；至于那些不懂这些律法的人，你们要教导他们。[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你手中所有”直译为“在你手中的”；这亚兰语习语可指你所拥有的，也可指交托给你的权柄。
    reason: lexical_alternative
  - marker: b
    text: “河西”是波斯帝国的行政地理称谓，指幼发拉底河以西的地区。
    reason: cultural_note
  - marker: c
    text: 原文末句的“你们要教导”是复数，可能包括以斯拉和他所委派的人员；本节前面的称呼和命令则是单数。
    reason: textual_grammar
lexical_decisions:
- source_word: כְּחָכְמַת אֱלָהָךְ דִּי בִידָךְ
  choice: 照着你手中所掌握的、你上帝的智慧
  rationale: כְּ 表示依照或符合；“在你手中”是亚兰语习语，可表示拥有、掌握或受托的权柄。译文保留“手中”的意象，同时使现代汉语自然可懂。
- source_word: מֶנִּי
  choice: 委派
  rationale: 在波斯行政语境中，此词指指定人员担任职务；“委派”既表达任命，也与以斯拉受托执行公务的背景相合。
- source_word: שָׁפְטִין וְדַיָּנִין
  choice: 官长和审判官
  rationale: 原文并列两个司法行政职称；分别翻译可避免把这一对称谓合并为单一类别。
- source_word: דִּי לֶהֱוֺן דאנין
  choice: 让他们审判
  rationale: 该关系从句说明所委派者的职责或目的；“让他们审判”在汉语中清楚表达这一功能。
- source_word: לְכָל עַמָּה
  choice: 所有的百姓
  rationale: 原文是带“所有”的集合单数，汉语以集合性表达最自然。
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: 河西
  rationale: 这是波斯帝国从幼发拉底河以东视角使用的行政地理称谓，指幼发拉底河以西的地区；“河西”简洁保留其方位性。
- source_word: לְכָל יָדְעֵי דָּתֵי אֱלָהָךְ
  choice: 就是一切知道你上帝律法的人
  rationale: דָּתֵי 是复数，指上帝的律法、法令或法规；“律法”在汉语中可作集合名词，并能兼顾宗教和司法语境。
- source_word: וְדִי לָא יָדַע
  choice: 至于不知道的
  rationale: 原文未明说宾语，语境指不知道上帝律法的人；译文保留其简略表达，避免过度补足。
- source_word: תְּהוֹדְעוּן
  choice: 你们要教导他们
  rationale: 这是“知道”的使役词干，意为“使人知道”；在律法语境中译作“教导”自然。原文动词为复数，故译为“你们”，保留从对以斯拉的单数命令转为复数的变化。
theological_decisions:
- issue: “你上帝的智慧”与以斯拉手中之物的关系
  choice: 保留“手中所掌握的”这一习语，不把“智慧”明确等同于某一卷律法书或特定权柄
  alternative: 译作“你所拥有的智慧”或“交托给你的律法权柄”
  rationale: 原文可表达拥有，也可能含受托权柄之意；不宜在正文中把这种开放性限定为单一解释。
- issue: 末句人称数的变化
  choice: 按亚兰语形态译为复数“你们要教导他们”
  alternative: 顺应开头对以斯拉的单数称呼，译为“你要教导他们”
  rationale: 原文先以单数称呼并命令以斯拉，末句却使用复数动词。保留这一变化，避免静默消除文本中的语法张力；复数可能包括以斯拉及其所委派的人员。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“至于你，以斯拉”保留原文直接而郑重的转折称呼；“官长和审判官”维持两个行政司法职称的并列；正文保留末句单复数转换，并以脚注说明。
