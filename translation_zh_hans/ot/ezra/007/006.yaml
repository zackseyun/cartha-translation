  text: ה֤וּא עֶזְרָא֙ עָלָ֣ה מִ/בָּבֶ֔ל וְ/הֽוּא סֹפֵ֤ר מָהִיר֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר נָתַ֥ן יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּתֶּן ל֣/וֹ הַ/מֶּ֗לֶךְ כְּ/יַד יְהוָ֤ה אֱלֹהָי/ו֙ עָלָ֔י/ו כֹּ֖ל בַּקָּשָׁתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/006.yaml
  text: This Ezra went up from Babylon[a], and he was a skilled scribe in the Law of Moses, which Yahweh, the God of Israel, had given. And the king granted him all his request, according to the hand of Yahweh his God upon him.
translation:
  language: zh_hans
  text: 这位以斯拉从巴比伦上来。他是精通摩西律法的文士；这律法是以色列的上帝雅威所赐的。王照着雅威他上帝的手在他身上[a]，准了他一切所求的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“照着雅威他上帝的手在他身上”。这是希伯来语惯用表达，可指雅威的恩宠、能力或护理性的帮助。
    reason: 说明希伯来语惯用语，同时保留其多重可能含义。
lexical_decisions:
- source_word: עָלָה מִבָּבֶל
  choice: 从巴比伦上来
  rationale: 保留“上来”的方向性表达，反映以耶路撒冷为目的地的叙述视角，而不弱化为一般的“离开”或“来到”
- source_word: סֹפֵר מָהִיר
  choice: 精通……的文士
  rationale: סֹפֵר 在此既有处理文本的文士含义，也有律法专家的意味；מָהִיר 表示熟练、精通。此译法兼顾身份与能力，避免仅译作行政书记或泛称学者。
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: 摩西律法
  rationale: 在《以斯拉记》的盟约与法典语境中，תּוֹרָה 译作“律法”最清楚，也适合普通现代读者。
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 这律法是以色列的上帝雅威所赐的
  rationale: 明确关系从句所指的是摩西律法，并以“雅威”音译神名 יהוה；“所赐的”保持庄重自然。
- source_word: וַיִּתֶּן לוֹ הַמֶּלֶךְ כֹּל בַּקָּשָׁתוֹ
  choice: 王便准了他一切所求的
  rationale: נתן 与“所求的”搭配时，汉语用“准了”比直译“给了”自然；“一切所求的”保留请求获全数批准的意思。
- source_word: כְּיַד יְהוָה אֱלֹהָיו עָלָיו
  choice: 雅威他的上帝的手在他身上
  rationale: 保留“手在他身上”的具体意象，不擅自限定为眷顾、能力或帮助；上下句关系仍让读者看出这是王允准其请求的神圣背景。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用现代汉语对 Yahweh 的常见音译“雅威”，保留其专名性质，不以称号代替。
- issue: 是否解释“雅威的手在他身上”这一惯用语
  choice: 正文保留“手在他身上”的意象，并用脚注说明可能含义
  alternative: 译作“雅威眷顾他”或“雅威帮助他”
  rationale: 该表达可包含恩宠、能力和护理帮助等多重意味。正文不把它收窄为单一解释，以保存原文的神学张力。
- issue: 是否在本节补入“良善的手”
  choice: 不补入“良善”
  alternative: 雅威良善的手在他身上
  rationale: 本节希伯来文本没有 טוֹבָה（良善的），虽邻近经节出现类似扩展，本节不应据此增译。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“文士”“律法”保留经文的历史与宗教语域；“精通”“准了他一切所求的”则避免生硬直译。脚注标记置于其实际说明的“手在他身上”之后。
