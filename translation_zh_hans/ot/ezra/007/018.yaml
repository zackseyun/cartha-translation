base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/018.yaml
  text: And whatever seems good to you and your brothers to do with the rest of the silver and the gold[b][a], do according to the will of your God.
translation:
  language: zh_hans
  text: 至于剩下的金银，你和你的弟兄认为怎样处理合宜[a]，就照你们的上帝的旨意[b]去做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你和你的弟兄看怎样好。”亚兰文这一表达既可较直译为“是好的”，也可按习语译为“认为合宜”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“照你们的上帝的意愿。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה דִי
  choice: 至于……怎样
  rationale: 该组合引出不定关系内容；结合后面的“处理”，译为“至于……怎样”符合现代汉语表达，并保留处置方式未限定的开放性。
- source_word: עֲלָיִךְ וְעַל אַחַיִךְ יֵיטַב
  choice: 你和你的弟兄认为……合宜
  rationale: יטב 与 על 构成的表达指某事在某人看来是好的或合意的。“认为……合宜”自然传达共同判断与获准裁量的语气，同时不把它强化为单纯的个人喜好。
- source_word: אַחַיִךְ
  choice: 你的弟兄
  rationale: 原词直译为“弟兄”。上下文中可能指以斯拉的同胞或同伴，但正文保留原有亲属称谓，不擅自缩窄所指。
- source_word: בִּשְׁאָר כַּסְפָּא וְדַהֲבָה
  choice: 剩下的金银
  rationale: שְׁאָר 指余下之物；“剩下的金银”简洁自然，也与前文已经提到的款项相衔接。
- source_word: לְמֶעְבַּד
  choice: 处理
  rationale: עבד 在这里泛指对这些金银采取行动。汉语若直译为“做”不够自然，“处理”既符合资金语境，又不具体限定其用途。
- source_word: כִּרְעוּת
  choice: 照……的旨意
  rationale: רְעוּת 可指意愿、愿望或喜悦。“旨意”符合诏令的庄重语域，也清楚表达行动须依照上帝的意愿；脚注保留“意愿”这一较中性的译法。
- source_word: אֱלָהֲכֹם
  choice: 你们上帝
  rationale: 后缀为复数“你们的”，所指是以斯拉及其同伴所敬拜的上帝；现代汉语用“你们上帝”自然表达这一所属关系。
- source_word: תַּעַבְדוּן
  choice: 去做
  rationale: 该未完成式在诏令中具有授权兼指示的功能。“就……去做”在汉语中既自然，又保留行动指令的力度。
theological_decisions:
- issue: אֱלָהֲכֹם 所指神明的专名化表达
  choice: 你们上帝
  alternative: 你们的神
  rationale: 上下文特指以斯拉及其同伴所敬拜的以色列之上帝。“上帝”表明特定所指，但不额外加入经文没有陈述的教义内容。
- issue: כִּרְעוּת 的神学语气
  choice: 旨意
  alternative: 意愿
  rationale: “旨意”适合上帝作为意愿主体及诏令的正式语境；但原词本身也可较一般地表示“意愿、愿望”，因此以脚注保留这一词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诏令语体。“金银”“弟兄”“旨意”等词保持经文风格；句式调整为自然汉语的话题—判断—指令结构。所有脚注标记均置于对应词语之后。
