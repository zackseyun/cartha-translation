  text: כָּ/ל קֳבֵ֗ל דִּי֩ מִן קֳדָ֨ם מַלְכָּ֜/א וְ/שִׁבְעַ֤ת יָעֲטֹ֨/הִי֙ שְׁלִ֔יחַ לְ/בַקָּרָ֥א עַל יְה֖וּד וְ/לִֽ/ירוּשְׁלֶ֑ם בְּ/דָ֥ת אֱלָהָ֖/ךְ דִּ֥י בִ/ידָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/014.yaml
  text: because you are sent from before the king and his seven counselors to inquire concerning Judah and Jerusalem according to the law of your God that is in your hand[a][b].
translation:
  language: zh_hans
  text: 因为你奉王和他的七位谋士差遣[a]，要照着在你手中的、你上帝的律法[b]，查察犹大和耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从王和他的七位谋士面前受差遣”。这是亚兰语宫廷用语，表示这项委任出自王室。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“由你持有”或“托付给你的”。原文直译“在你手中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: 因为
  rationale: 该亚兰语惯用语引出谕旨所依据的理由；“因为”自然、清楚地保留因果关系。
- source_word: מִן קֳדָם מַלְכָּא וְשִׁבְעַת יָעֲטֹהִי
  choice: 奉王和他的七位谋士差遣
  rationale: “从王面前”是宫廷用语，表示差遣来自君王的权威与临在；正文以现代汉语的“奉……差遣”传达其正式委任含义，并在脚注保留字面表达。
- source_word: שְׁלִיחַ
  choice: 差遣
  rationale: 原词为被动分词，说明以斯拉受正式派遣的身份；结合“奉”组成自然而庄重的汉语表达。
- source_word: לְבַקָּרָא
  choice: 查察
  rationale: 该词有探查、考察、查问之意；“查察”适合行政委任语境，也不把行动限缩为单纯询问。
- source_word: עַל יְהוּד וְלִירוּשְׁלֶם
  choice: 查察犹大和耶路撒冷
  rationale: 介词在此标明查察所涉及的对象；汉语无需另译“关于”，即可自然表达。
- source_word: בְּדָת אֱלָהָךְ
  choice: 照着你上帝的律法
  rationale: 介词可表示准则或依据；“照着”表明查察以该律法为规范。
- source_word: דִּי בִידָךְ
  choice: 你手中
  rationale: 保留原文“在你手中”的形象表达，可涵盖持有、保管或受托掌管等含义，不擅自限定。
theological_decisions: []
