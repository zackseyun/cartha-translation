  text: וּ/לְ/כֹ֣ם מְהוֹדְעִ֗ין דִּ֣י כָל כָּהֲנַיָּ֣/א וְ֠/לֵוָיֵ/א זַמָּ֨רַיָּ֤/א תָרָֽעַיָּ/א֙ נְתִ֣ינַיָּ֔/א וּ/פָ֣לְחֵ֔י בֵּ֖ית אֱלָהָ֣/א דְנָ֑ה מִנְדָּ֤ה בְלוֹ֙ וַ/הֲלָ֔ךְ לָ֥א שַׁלִּ֖יט לְ/מִרְמֵ֥א עֲלֵי/הֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/024.yaml
  text: And we make known to you that it is not permitted to impose tribute[a], tax, or toll on any of the priests, Levites, singers, gatekeepers, temple servants[b], or servants of this house of God.
translation:
  language: zh_hans
  text: 我们也通知你们：祭司、利未人、歌唱者、守门人、殿役[a]，以及在这座上帝的殿中供职的人，一律不得向他们征收贡赋、税款或通行税[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或音译作“尼提宁”，即亚兰文 נְתִינַיָּא 的传统音译。
    reason: lexical_alternative
  - marker: b
    text: 这三个财政术语可能分别指不同种类的帝国征费；“贡赋、税款或通行税”也可译作“贡赋、关税或过境税”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוֹדְעִין
  choice: 我们也通知你们
  rationale: 这是亚兰文公文中的正式告知用语；“通知”自然保留行政语气，וּ־译作“也”以承接上文。
- source_word: כָל
  choice: 一律不得向他们
  rationale: כָל连同列举对象和否定法律措辞，表示所列各类人员无一例外；中文用“一律不得”最自然。
- source_word: כָּהֲנַיָּא וְלֵוָיֵא זַמָּרַיָּא תָרָעַיָּא
  choice: 祭司、利未人、歌唱者、守门人
  rationale: 分别采用清楚、通行的圣殿职分类称谓。
- source_word: נְתִינַיָּא
  choice: 殿役
  rationale: 该词指被指定从事圣殿劳役的一类人员；“殿役”既简洁又能区别于随后较宽泛的供职者。脚注保留音译可能。
- source_word: פָלְחֵי בֵּית אֱלָהָא דְנָה
  choice: 在这上帝殿里供职的人
  rationale: פָלְחֵי可指服事、供职；此处在行政人员清单中译作“供职的人”，不额外加入原文没有的“其他”。
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  choice: 贡赋、税款或通行税
  rationale: 保留三个并列财政术语的区别；末项很可能指道路或过境征费。
- source_word: לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם
  choice: 一律不得向他们征收
  rationale: 原短语表达没有权柄或许可施加这些税项；“不得征收”符合现代中文法律与行政语体。
theological_decisions: []
