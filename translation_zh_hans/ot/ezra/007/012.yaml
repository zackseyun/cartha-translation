base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/012.yaml
  text: 'Artaxerxes[a], king of kings, to Ezra the priest, the scribe of the law of the God of heaven: complete peace[b]. And now—'
translation:
  language: zh_hans
  text: “诸王之王亚达薛西，致祭司以斯拉，就是天上上帝律法的文士[a]：愿你平安圆满[b]。现今——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“法令”；亚兰文 דָּתָא 既可指宗教律法，也可泛指法令或法规。
    reason: lexical_alternative
  - marker: b
    text: 这是亚兰文书信中的固定问安语；“平安圆满”也可译作“完全的平安”，或按中文习惯意译为“谨致问候”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְתַּחְשַׁסְתְּא
  choice: 亚达薛西
  rationale: 采用现代中文圣经中通行的波斯王名译法。
- source_word: מֶלֶךְ מַלְכַיָּא
  choice: 诸王之王
  rationale: 直接传达帝国亚兰文的君王尊号，同时保持庄重自然。
- source_word: לְעֶזְרָא כָהֲנָא
  choice: 致祭司以斯拉
  rationale: 介词 לְ 标明书信的收信人；כָהֲנָא 是对以斯拉身份的同位说明。
- source_word: סָפַר דָּתָא
  choice: 律法的文士
  rationale: סָפַר 指文士或书记；结合以斯拉的祭司身份及下文“天上之上帝”，דָּתָא 在此以“律法”最符合语境，同时以脚注保留“法令”的可能。
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: 天上之上帝
  rationale: 忠实保留“天上的上帝”这一称号，并用凝练庄重的中文表达所属关系。
- source_word: גְּמִיר
  choice: 全备的
  rationale: 该词有完全、完备之意；在书信问安套语中与“平安”连用，译作“全备的”既保留原意，也避免仅译为泛泛的“问安”。
- source_word: וּכְעֶנֶת
  choice: 现在——
  rationale: 这是公文从问安转入正文的过渡语；破折号表明内容在下一节继续。
theological_decisions:
- issue: דָּתָא 在以斯拉职分描述中的含义
  choice: 律法
  alternative: 法令
  rationale: 该词既可指法律、律法，也可指行政法令；此处描述祭司以斯拉与天上之上帝的关系，因此正文采用“律法”，脚注保留较宽泛的行政含义。
- issue: גְּמִיר וּכְעֶנֶת 的书信套语处理
  choice: 愿你得享全备的平安。现在——
  alternative: 谨致问候。现在——
  rationale: 采用较贴近原文的表达，分别呈现问安与转入正文两个成分，不把压缩的套语完全意译掉。
translation_notes:
  register: 采用现代、庄重而易懂的公文书信语体。“致”清楚标示收信人；“现在——”保留原文由称呼问安转入谕令正文的结构，并显示句意延续至下一节。
