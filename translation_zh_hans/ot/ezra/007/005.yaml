  text: בֶּן אֲבִישׁ֗וּעַ בֶּן פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן הָ/רֹֽאשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/005.yaml
  text: son of Abishua[a], son of Phinehas, son of Eleazar[b], son of Aaron the chief priest.
translation:
  language: zh_hans
  text: 亚比书的儿子[a]，非尼哈的儿子，以利亚撒的儿子，祭司之首[b]亚伦的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子”在希伯来家谱中也可泛指“后裔”，家谱有时会省略若干代。
    reason: lexical_alternative
  - marker: b
    text: 传统译作“大祭司”。原文直译为“那祭司，那为首的”，不是通常表示“大祭司”的固定说法。
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן
  choice: ……的儿子
  rationale: 重复保留希伯来家谱的链式表达。בֶּן可指亲生儿子，也可在家谱中泛指后裔；正文采用直接对应的“儿子”，并以脚注说明其较宽泛的用法。
- source_word: אֲבִישׁוּעַ
  choice: 亚比书
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: פִּינְחָס
  choice: 非尼哈
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: 祭司之首
  rationale: רֹאשׁ本义为“头”，在此表示居首或为首者。“祭司之首”既贴近原文“那祭司，那为首的”的结构与含义，也避免直接套用通常译作“大祭司”的另一固定表达。
theological_decisions:
- issue: 如何翻译亚伦的祭司称号
  choice: 祭司之首
  alternative: 大祭司；首席祭司
  rationale: 原文是הַכֹּהֵן הָרֹאשׁ，直指“为首的祭司”，并非较常见的“大祭司”固定称谓הַכֹּהֵן הַגָּדוֹל。正文因此保留“为首”的词义，不把称号技术化；脚注列出传统译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文连续重复“……的儿子”的家谱节奏；用“祭司之首”呈现原文措辞及其与传统“大祭司”译法之间的张力。
