revisions:
- from: 以下是亚达薛西王交给祭司以斯拉的公文副本[a]。以斯拉是一位文士，专研耶和华为以色列所定的诫命之言和律例[b]：
  to: 以下是亚达薛西王交给祭司以斯拉的公文副本[a]；以斯拉是文士，通晓耶和华为以色列所定的诫命之言和律例[b]：
  rationale: 仅作低风险的文体与句法修订：用“通晓”替换“专研”，使以斯拉作为“文士”的专业关系更明确、更自然；以分号取代句号，维持原文对以斯拉的连续同位说明。其余词汇、神名、句末引文冒号及脚注锚点均可保留。
