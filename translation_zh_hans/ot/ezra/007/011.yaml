id: EZR.7.11
reference: Ezra 7:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/זֶ֣ה פַּרְשֶׁ֣גֶן הַֽ/נִּשְׁתְּוָ֗ן אֲשֶׁ֤ר נָתַן֙ הַ/מֶּ֣לֶךְ אַרְתַּחְשַׁ֔סְתְּא לְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סֹּפֵ֑ר סֹפֵ֞ר דִּבְרֵ֧י מִצְוֺת יְהוָ֛ה וְ/חֻקָּ֖י/ו עַל יִשְׂרָאֵֽל׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/011.yaml
  text: 'This is the copy of the document that King Artaxerxes gave to Ezra the priest[a], the scribe[b], a scribe of the words of the commandments of Yahweh and of his statutes for Israel:'
translation:
  language: zh_hans
  text: 以下是亚达薛西王交给祭司以斯拉的公文副本[a]；以斯拉是文士，通晓耶和华为以色列所定的诫命之言和律例[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公文副本”也可译作“书信的抄本”或“文书的文本”。
    reason: 原文两个借词合起来指官方书面文件及其副本，但文件的具体体裁可理解为书信、公文或诏令。
  - marker: b
    text: “为以色列所定的”也可译作“有关以色列的”或“施行于以色列的”。
    reason: 介词 עַל 在这里可表示指向、关涉或管辖，确切关系存在词义上的开放性。
lexical_decisions:
- source_word: וְזֶה
  choice: 以下是
  rationale: 本短语引出随后所录的王室公文；“以下是”自然表达篇章转换，不额外加入时间含义。
- source_word: פַּרְשֶׁגֶן הַנִּשְׁתְּוָן
  choice: 公文副本
  rationale: פַּרְשֶׁגֶן 指正式文书的副本或抄本，הַנִּשְׁתְּוָן 指官方书面文件；“公文副本”既简明，又保留其王室行政性质。
- source_word: נָתַן
  choice: 交给
  rationale: 保留“给”的基本意义；汉语谈及君王把公文给某人时，“交给”比单用“给”更自然。
- source_word: הַמֶּלֶךְ אַרְתַּחְשַׁסְתְּא
  choice: 亚达薛西王
  rationale: 按现代中文圣经人名惯例音译专名，并将王号自然置于姓名之后。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 直接表达以斯拉的祭司职分。
- source_word: הַסֹּפֵר / סֹפֵר
  choice: 文士；专研
  rationale: 首个称谓译为“文士”，保留其书写、律法与行政背景；重复出现的 סֹפֵר 在汉语中按功能译作“专研”，避免生硬重复，同时表达他以耶和华诫命之言为专业对象。
- source_word: דִּבְרֵי מִצְוֺת יְהוָה וְחֻקָּיו
  choice: 耶和华……的诫命之言和律例
  rationale: “诫命之言”保留 דִּבְרֵי 的明示成分以及原文略显庄重的结构；“律例”准确表达 חֻקִּים 的法律和训诲语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，而不以“主”这一称号代替。
- source_word: עַל יִשְׂרָאֵל
  choice: 为以色列所定的
  rationale: עַל 在这里可表示这些诫命和律例对以色列的指向或约束；正文采用自然的“为……所定”，并在脚注保留其他可能关系。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。正文采用现代中文圣经传统中最广为普通读者识别的“耶和华”，而不以称号“主”替换；“雅威”是另一种较贴近学界重构读音的音译。
- issue: עַל יִשְׂרָאֵל 所表达的关系
  choice: 为以色列所定的
  alternative: 有关以色列的／施行于以色列的
  rationale: 介词短语可能表示指向、关涉或约束范围。正文表达诫命和律例以以色列为对象，但不把它扩展成特定的教义判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“公文副本”体现王室行政背景；将原文重复的“文士”结构处理为“是一位文士，专研……”，避免中文累赘，同时保留以斯拉的身份及其对神圣诫命文本的专业关系。句末用冒号，引出下一节公文正文。
