  text: בָּר֥וּךְ יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵ֑י/נוּ אֲשֶׁ֨ר נָתַ֤ן כָּ/זֹאת֙ בְּ/לֵ֣ב הַ/מֶּ֔לֶךְ לְ/פָאֵ֕ר אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/027.yaml
  text: Blessed be Yahweh[a], the God of our fathers, who put this into the king’s heart, to beautify the house of Yahweh that is in Jerusalem,
translation:
  language: zh_hans
  text: 愿雅威——我们祖先的上帝——受称颂！他把这样的意念放在王心里，要使耶路撒冷雅威的殿华美[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“装饰”或“使……增添荣美”。
    reason: לְפָאֵר可表达使圣殿美丽、华贵或荣耀；中文正文无法完全呈现其语义幅度。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 愿……受称颂
  rationale: 这是颂赞公式中的被动分词。用“愿……受称颂”既保留希伯来文的祝颂语气，也符合现代汉语庄重而自然的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接译出四字神名，而不以“主”这一称号代替；“雅威”是现代汉语中通行的音译。
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: 我们祖先的上帝
  rationale: 直译为“我们父辈的上帝”；“我们祖先的上帝”在现代汉语中更自然，并保留其指向以色列历代先祖的盟约性表达。
- source_word: אֲשֶׁר נָתַן כָּזֹאת בְּלֵב הַמֶּלֶךְ
  choice: 他把这样的意念放在王心里
  rationale: 保留נתן“放置、给予”的意象和בְלֵב“在心里”的内在动机含义；“这样的意念”自然表达כָּזֹאת所回指的这项计划。
- source_word: לְפָאֵר
  choice: 要使……更加华美
  rationale: פאר的Piel不定式可指使建筑美丽、华贵或荣耀。上下文涉及圣殿，译作“使……更加华美”兼顾具体修饰与尊荣意味，又不把含义限缩为单纯装饰。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בֵּית字面为“家、房屋”，在此明确指耶路撒冷圣殿；汉语“殿”比“房屋”更自然准确，同时保留这是雅威居所的含义。
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: 耶路撒冷……的殿
  rationale: 将关系从句自然前置为汉语定语，清楚表明这殿位于耶路撒冷。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文两次直接使用四字神名。正文采用“雅威”以保留专名性质，不以称号“主”替换；“耶和华”是另一传统音译。
- issue: לְפָאֵר在圣殿语境中的意义
  choice: 使……更加华美
  alternative: 装饰；使……得荣耀
  rationale: 该动词兼有使之美丽、华贵和荣耀的语义范围。正文保留具体与尊荣两方面，不将它纯粹灵意化为“荣耀”，并在脚注列出可能译法。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“愿……受称颂”保留颂赞语体；破折号标明“我们祖先的上帝”是“雅威”的同位说明。将希伯来语关系从句调整为前置定语，以符合自然汉语语序。
