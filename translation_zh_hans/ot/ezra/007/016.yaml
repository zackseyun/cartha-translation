  text: וְ/כֹל֙ כְּסַ֣ף וּ/דְהַ֔ב דִּ֣י תְהַשְׁכַּ֔ח בְּ/כֹ֖ל מְדִינַ֣ת בָּבֶ֑ל עִם֩ הִתְנַדָּב֨וּת עַמָּ֤/א וְ/כָֽהֲנַיָּ/א֙ מִֽתְנַדְּבִ֔ין לְ/בֵ֥ית אֱלָהֲ/הֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/016.yaml
  text: and all the silver and gold that you find in all the province of Babylon[a], together with the freewill offering of the people and the priests[b], who are freely offering for the house of their God that is in Jerusalem.
translation:
  language: zh_hans
  text: 以及你在巴比伦全省所找到的一切金银，连同百姓和祭司为他们的神在耶路撒冷的殿[b]甘心献上的礼物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自愿奉献”。这个亚兰语词指甘心乐意献出的礼物，尤其可用于敬拜场合。
    reason: lexical_alternative
  - marker: b
    text: “他们神的殿”指耶路撒冷的圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: וְכֹל
  choice: 以及……一切
  rationale: 承接上一节的内容，并保留“全部”的概括意味。
- source_word: כְּסַף וּדְהַב
  choice: 金银
  rationale: 采用现代汉语中自然且固定的并列说法；语境已由“一切”限定其范围。
- source_word: דִּי תְהַשְׁכַּח
  choice: 你……所筹得的
  rationale: 该动词字面可指“找到、得到”；在募集圣殿款项的语境中，“筹得”自然表达取得这些金银的意思，同时没有把来源限定为强制征收。
- source_word: בְּכֹל מְדִינַת בָּבֶל
  choice: 在巴比伦全省
  rationale: מְדִינָה在波斯帝国行政语境中指“省”；“全省”准确而简洁。
- source_word: עִם
  choice: 还有
  rationale: 清楚表示在所筹金银之外另加一项来源，符合现代汉语行文。
- source_word: הִתְנַדָּבוּת
  choice: 自愿献上的礼物
  rationale: 既保留出于自愿的核心语义，也表达其作为奉献礼物、尤其用于圣殿的语境含义。
- source_word: עַמָּא וְכָהֲנַיָּא
  choice: 百姓和祭司
  rationale: 直接保留两个奉献群体，不额外限定其民族身份。
- source_word: מִתְנַדְּבִין
  choice: 自愿献上
  rationale: 保留与同根名词הִתְנַדָּבוּת之间的词义联系，并体现参与者主动、甘愿奉献。
- source_word: לְבֵית אֱלָהֲהֹם
  choice: 为他们神……的殿
  rationale: “殿”自然表达此处“神的家”所指的圣殿；“为”说明奉献的用途或受益对象。
- source_word: דִּי בִירוּשְׁלֶם
  choice: 在耶路撒冷的
  rationale: 按原文关系从句，说明这座殿的位置。
theological_decisions:
- issue: “他们神的殿”中所有关系的保留
  choice: 他们神在耶路撒冷的殿
  alternative: 耶路撒冷的神殿
  rationale: 保留原文“他们的神”，不把它泛化为不带群体关系的“神殿”，也不添加原文没有明说的身份说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“筹得”贴合奉命募集金银的上下文；“自愿献上的礼物”避免较生硬的名词堆叠。脚注标记依其实际说明对象分别置于“礼物”和“殿”之后。
