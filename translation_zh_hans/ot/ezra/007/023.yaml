id: EZR.7.23
reference: Ezra 7:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל דִּ֗י מִן טַ֨עַם֙ אֱלָ֣הּ שְׁמַיָּ֔/א יִתְעֲבֵד֙ אַדְרַזְדָּ֔א לְ/בֵ֖ית אֱלָ֣הּ שְׁמַיָּ֑/א דִּֽי לְ/מָ֤ה לֶֽהֱוֵא֙ קְצַ֔ף עַל מַלְכ֥וּת מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/023.yaml
  text: Whatever is commanded by the God of heaven[a], let it be done diligently for the house of the God of heaven[b], lest wrath come upon the kingdom of the king and his sons.
translation:
  language: zh_hans
  text: 凡天上之神所吩咐的事，都要为天上之神的殿认真办理，免得烈怒临到王的国度和他的儿子们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或较直译：“为什么要有烈怒临到王的国度和他的儿子们呢？”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דִּי
  choice: 凡……的
  rationale: 这是概括一切事项的不定关系结构；“凡……的”在现代汉语中自然，也保留了全面涵盖的语气。
- source_word: מִן טַעַם
  choice: 所吩咐的
  rationale: טְעֵם在行政语境中可指命令、谕令或决定，מִן表示来源；译作“所吩咐的”清楚表达命令来自天上之神。
- source_word: אֱלָהּ שְׁמַיָּא
  choice: 天上之神
  rationale: 这是《以斯拉记》亚兰文部分的固定称号；“天上之神”庄重、自然，并保留原文称谓。
- source_word: יִתְעֲבֵד
  choice: 都要……办妥
  rationale: 被动未完成式在这里带指令语气；汉语以“都要……办妥”表达必须执行并完成的意思，不过度限定其法令情态。
- source_word: אַדְרַזְדָּא
  choice: 认真
  rationale: 该副词包含殷勤、谨慎、准确执行的行政语气；“认真”简明自然，同时不把其较宽的语义范围缩限为速度或精确度。
- source_word: לְבֵית אֱלָהּ שְׁמַיָּא
  choice: 为天上之神的殿宇
  rationale: בַּיִת字面为“房屋、居所”，此处明确指圣殿。“殿宇”既保留“神之居所”的表达，又让现代读者自然理解其所指；脚注说明具体指圣殿。
- source_word: דִּי לְמָה
  choice: 免得
  rationale: 该结构字面可形成“为什么要……？”的反问，在语境中表达避免负面后果的警告；“免得”准确传达其目的和警戒作用，脚注保留反问式可能。
- source_word: לֶהֱוֵא קְצַף
  choice: 烈怒临到
  rationale: 原文表达“有烈怒”或“烈怒发生”；“临到”自然呈现即将落下的惩罚性怒气，而“烈怒”符合קְצַף的强烈程度。
- source_word: עַל מַלְכוּת מַלְכָּא
  choice: 临到王的国
  rationale: מַלְכוּת指王所统治的国度或疆域，不仅是王本人；“王的国”简洁并贴近原文。
- source_word: וּבְנוֹהִי
  choice: 和他的众子
  rationale: 原词直接指“他的儿子们”。“众子”保持复数和王室语境中的庄重感，不擅自扩大为后裔。
theological_decisions:
- issue: בֵית אֱלָהּ שְׁמַיָּא所指的神之殿
  choice: 天上之神的殿宇
  alternative: 天上之神的圣殿
  rationale: 原文使用“房屋、居所”一词，但语境所指为圣殿。“殿宇”兼顾源语意象和现代汉语可懂度，脚注再明确其具体所指，不引入额外教义。
- issue: 警告分句דִּי לְמָה的表达方式
  choice: 免得烈怒临到王的国和他的众子
  alternative: 为什么要让烈怒临到王的国和他的众子呢？
  rationale: 原结构可以按字面译成反问，也可按语用功能理解为避免后果的警告。正文采用自然的警告式表达，脚注保存原文反问的真实可能性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“凡……都要……”保留王令的全面性和命令语气；“殿宇”“烈怒”“众子”维持经文与王室诏令应有的庄重感，同时避免生硬仿古。
