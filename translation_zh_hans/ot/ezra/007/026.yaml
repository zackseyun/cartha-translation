id: EZR.7.26
reference: Ezra 7:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כָל דִּי לָא֩ לֶהֱוֵ֨א עָבֵ֜ד דָּתָ֣/א דִֽי אֱלָהָ֗/ךְ וְ/דָתָ/א֙ דִּ֣י מַלְכָּ֔/א אָסְפַּ֕רְנָא דִּינָ֕/ה לֶהֱוֵ֥א מִתְעֲבֵ֖ד מִנֵּ֑/הּ הֵ֤ן לְ/מוֹת֙ הֵ֣ן ל/שרשו הֵן לַ/עֲנָ֥שׁ נִכְסִ֖ין וְ/לֶ/אֱסוּרִֽין־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/026.yaml
  text: And anyone who will not obey the law of your God and the law of the king[a], let judgment be executed on him promptly, whether for death, or for banishment, or for confiscation of goods, or for imprisonment.
translation:
  language: zh_hans
  text: 凡不遵行你神的律法和王的律法的人，都要迅速对他执行判决：或处死，或放逐[a]，或没收财产，或监禁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“驱逐”，直译近于“连根拔起”。这个亚兰语词十分罕见，在这里可能指把人逐出其原居地或所属群体。
    reason: 保留罕见词 לשרשו 的词义不确定性及其较为字面的形象。
lexical_decisions:
- source_word: וְכָל דִּי
  choice: 凡……的人
  rationale: 引出不定关系从句，表达任何符合条件的人；“凡……的人”符合现代汉语法律语体，也保留逐一适用的意味。
- source_word: לָא לֶהֱוֵא עָבֵד
  choice: 不遵行
  rationale: 字面义为“不做、不实行”；与“律法”搭配时指不按其要求行事。“遵行”兼顾服从与实行，比单说“不做”更清楚。
- source_word: דָּתָא
  choice: 律法
  rationale: 此词可指法律、法令或规章。经文并列“你神的律法”和“王的律法”，统一译作“律法”可保留原文的平行结构；用于王时虽较庄重，但仍能表达具有约束力的法律规范。
- source_word: אֱלָהָךְ
  choice: 你神
  rationale: 保留对以斯拉所用的第二人称单数领属表达；现代汉语中“你神”简洁而庄重。
- source_word: וְדָתָא דִּי מַלְכָּא
  choice: 和王的律法
  rationale: 与“你神的律法”协调并列，不擅自把其中一种律法解释为从属于另一种。
- source_word: אָסְפַּרְנָא
  choice: 迅速
  rationale: 该副词可含迅速、切实或严谨之意；在执行司法判决的语境中，“迅速”自然地表达及时办理，同时不额外加入“从严”的含义。
- source_word: דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ
  choice: 对他执行判决
  rationale: 保留原文“判决被施行于他”的司法含义，并以自然的现代汉语主动式表达。
- source_word: הֵן ... הֵן ... הֵן ... וְ
  choice: 或……或……或……或……
  rationale: 清楚呈现原文所列的几种可选刑罚，而不暗示这些刑罚会同时施加。
- source_word: לְמוֹת
  choice: 处死
  rationale: 准确表达死刑这一司法处罚，比字面的“至于死”更符合现代汉语。
- source_word: לשרשו
  choice: 放逐[a]
  rationale: 该罕见词可能源于“连根拔起”，在刑罚清单中很可能指从原居地或群体中驱逐；正文用“放逐”便于理解，同时以脚注保留词义的不确定性。
- source_word: לַעֲנָשׁ נִכְסִין
  choice: 没收财产
  rationale: 此短语指针对财物施加惩罚；在本司法语境中，“没收财产”最自然，但其表达也可能涵盖财产罚。
- source_word: וְלֶאֱסוּרִין
  choice: 监禁
  rationale: 原词可指捆绑、锁链或囚禁；在刑罚清单中译作“监禁”明确传达司法结果。
theological_decisions:
- issue: 神的律法与王的律法在诏令中的关系
  choice: 将二者平行译为“你神的律法和王的律法”
  alternative: 把王的律法解释为仅仅执行神的律法，或明确置于神的律法之下
  rationale: 原文把两种法律权威并列提出，并未在本句中说明二者的从属关系；译文保留这种张力，不加入经文本身没有明说的神学层级。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留波斯诏令的司法语气。刑罚项目用简洁的双音节或四音节表达，使清单平行易读；脚注标记置于存在词义争议的“放逐”之后。
