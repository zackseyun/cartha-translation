id: EZR.7.17
reference: Ezra 7:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דְּנָה֩ אָסְפַּ֨רְנָא תִקְנֵ֜א בְּ/כַסְפָּ֣/א דְנָ֗ה תּוֹרִ֤ין דִּכְרִין֙ אִמְּרִ֔ין וּ/מִנְחָתְ/ה֖וֹן וְ/נִסְכֵּי/ה֑וֹן וּ/תְקָרֵ֣ב הִמּ֔וֹ עַֽל מַדְבְּחָ֔/ה דִּ֛י בֵּ֥ית אֱלָהֲ/כֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/017.yaml
  text: Therefore you shall diligently buy with this silver bulls[a], rams, lambs, along with their grain offerings and their drink offerings[c][b], and you shall offer them on the altar of the house of your God that is in Jerusalem.
translation:
  language: zh_hans
  text: 所以，你要务必仔细地用这银子[b]购买公牛、公绵羊和羊羔，连同相应的素祭和奠祭，并把这些祭物献在耶路撒冷你们上帝之殿[c]的祭坛上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 这里的“银子”可指钱款；原文直译为“银”。
    reason: lexical_alternative
  - marker: c
    text: “上帝之殿”原文直译为“你们上帝的家（房屋）”，这里指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: 所以
  rationale: 保留亚兰语习语所表达的因果、推论关系，并与上文命令自然衔接。
- source_word: אָסְפַּרְנָא
  choice: 仔细
  rationale: 该副词强调准确、谨慎地执行命令；“仔细”是自然现代汉语，也不把语气夸大为单纯的勤奋。
- source_word: תִקְנֵא
  choice: 要……购买
  rationale: 表达“买、购置”的基本义，同时保留王命所具有的明确指令语气。
- source_word: בְּכַסְפָּא דְנָה
  choice: 用这些银子
  rationale: כַּסְפָּא 字面是“银子”，在此作为购置祭物的款项；保留具体物质用语，不直接泛化为“钱”。
- source_word: תּוֹרִין דִּכְרִין אִמְּרִין
  choice: 公牛、公绵羊和羊羔
  rationale: 依次对应献祭用的牛、成年公羊和羊羔；“公绵羊”比单说“公羊”更明确地区别于公山羊。
- source_word: מִנְחָתְהוֹן
  choice: 相应的素祭
  rationale: מִנְחָה 在献祭语境中指伴随牲祭的谷物祭；“素祭”是简洁而通行的汉语圣经祭祀术语。“相应的”体现复数附属代词所表达的与各牲祭配套关系。
- source_word: נִסְכֵּיהוֹן
  choice: 相应的奠祭
  rationale: 该词指浇奠的液体祭物；“奠祭”准确且比解释性较强的“浇酒祭”更凝练。
- source_word: וּתְקָרֵב הִמּוֹ
  choice: 并把它们献在
  rationale: קרב 在此是把祭物带近并献上的礼仪用语；“献”自然表达祭坛语境中的动作，“它们”涵盖前述整组祭物。
- source_word: עַל מַדְבְּחָה דִּי בֵּית אֱלָהֲכֹם
  choice: 在你们上帝之殿的祭坛上
  rationale: 保留“祭坛上”的处所关系；“上帝之殿”以庄重而自然的汉语指其圣所，并由脚注交代“殿”原文直译为“家／房屋”。
- source_word: אֱלָהֲכֹם
  choice: 你们上帝
  rationale: 后缀是第二人称阳性复数，故译作“你们”；这与本节对以斯拉使用单数动词并不矛盾，表明这里所说的是以斯拉及其群体的上帝。
theological_decisions:
- issue: “你”的单数命令与“你们的上帝”的复数所属并存
  choice: 购买命令译作单数语境下的“你”，所属关系明确译作“你们上帝”
  alternative: 两处都泛译为不显数的“你的上帝”
  rationale: 亚兰语动词 תִקְנֵא 和 וּתְקָרֵב 指向单数受命者，而 אֱלָהֲכֹם 的后缀明确为复数；译文保留这种有意义的数差异，不将个人受命与群体身份合并。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“所以”承接上文；牲祭与配套祭物用“连同”组合，避免误解为素祭和奠祭也属于购买清单之外。“之殿”略具庄重色彩，但仍属现代标准汉语，并避免连续多个“的”造成拗口。所有脚注标记均置于其所解释的词语之后。
