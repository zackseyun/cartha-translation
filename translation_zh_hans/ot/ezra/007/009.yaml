base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/009.yaml
  text: For on the first day of the first month he began the journey up from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.
translation:
  language: zh_hans
  text: 因为正月初一，他开始从巴比伦上行；五月初一，他到了耶路撒冷，照着他上帝施恩的手在他身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְסֻד הַמַּעֲלָה
  choice: 启程上路
  rationale: יְסֻד 字面涉及“奠基、开始”，与“上行/行程”连用时表示开始这次上行旅程；译作“启程上路”自然地传达实际起行，同时避免字面译为“奠定旅程的根基”所造成的误解。
- source_word: הַמַּעֲלָה
  choice: 上路
  rationale: 该名词可指“上行”，这里是从巴比伦前往地势较高且具宗教中心意义的耶路撒冷；在“启程上路”中以自然汉语表达此行程。
- source_word: כְּיַד אֱלֹהָיו הַטּוֹבָה עָלָיו
  choice: 因为他上帝施恩的手扶持他
  rationale: 原文直译近于“照着他上帝在他身上的善手”。“施恩的手”保留神主动赐福、眷顾的意象，“扶持”说明该意象在旅程语境中的作用；כְּ 在此表达事情得以成就的依据或原因。
theological_decisions:
- issue: “上帝的手”这一拟人意象
  choice: 保留“手”，译作“施恩的手扶持他”
  alternative: 蒙他上帝恩待
  rationale: 保留原文重要意象及神主动施恩的含义，又以“扶持”使现代读者清楚理解。
- issue: 旅程顺利与上帝眷顾的关系
  choice: 用“因为”表达因果
  alternative: 照着／由于
  rationale: 上下文将以斯拉按时抵达归因于上帝施恩之手；“因为”清楚表达这一关系，但不额外说明神如何介入。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正月初一／五月初一”简洁对应希伯来历月份与日期；分号呈现启程和抵达的平行结构。
