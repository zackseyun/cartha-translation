  text: וְ/עָלַ֣/י הִטָּה חֶ֗סֶד לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/יֽוֹעֲצָ֔י/ו וּ/לְ/כָל שָׂרֵ֥י הַ/מֶּ֖לֶךְ הַ/גִּבֹּרִ֑ים וַ/אֲנִ֣י הִתְחַזַּ֗קְתִּי כְּ/יַד יְהוָ֤ה אֱלֹהַ/י֙ עָלַ֔/י וָ/אֶקְבְּצָ֧/ה מִ/יִּשְׂרָאֵ֛ל רָאשִׁ֖ים לַ/עֲל֥וֹת עִמִּֽ/י־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/028.yaml
  text: and who extended steadfast love to me before the king and his counselors and all the king’s mighty officials[a]. And I took courage, because the hand of Yahweh my God was upon me[c][b], and I gathered leading men from Israel to go up with me.
translation:
  language: zh_hans
  text: 他又在王、他的谋士和王所有权势显赫的大臣面前向我施恩[a]。我便刚强起来，因为耶和华我上帝的手在我身上[b]；于是我从以色列人中召集首领们，与我一同上去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使我在王、他的谋士和王所有权势显赫的大臣面前蒙恩宠。”
    reason: חֶסֶד 在此也可按实际施恩的语境译为“恩宠”或“恩待”。
  - marker: b
    text: 或译：“我照着耶和华我上帝在我身上的手而刚强起来。”
    reason: 较形式对应地保留 כְּיַד（“照着……的手”）的表达及其关系上的含混。
lexical_decisions:
- source_word: הִטָּה חֶסֶד
  choice: 使我……蒙慈爱
  rationale: 该短语直译有“向我伸展慈爱”之意；中文用“使我蒙慈爱”较自然，同时保留 חֶסֶד 的深厚含义。上下文表明，这慈爱借着王廷众人对以斯拉的恩待显明。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: “慈爱”兼顾恩慈与忠贞关爱的意味，比单用“恩惠”更能保留该词的神学分量。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 直接表达宫廷人物在场并施予认可、恩待的语境。
- source_word: יֹעֲצָיו
  choice: 他的谋士
  rationale: 符合波斯宫廷背景，且为现代中文读者易懂。
- source_word: שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים
  choice: 王所有有权势的大臣
  rationale: שָׂרֵי 指高级官员，הַגִּבֹּרִים 在此强调其权势；“有权势的大臣”比“勇猛的大臣”更符合行政宫廷语境。
- source_word: הִתְחַזַּקְתִּי
  choice: 我就刚强起来
  rationale: 保留“得着力量、变得刚强”的含义，也避免暗示力量完全出于以斯拉自己。
- source_word: כְּיַד ... עָלַי
  choice: 因为……的手在我身上
  rationale: כְּ 的确切关系可理解为“照着”或带有根据、原因意味；正文按上下文自然译为“因为”，并保留“手在我身上”的神圣扶助隐喻，脚注提示较形式对应的译法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经传统中广为人知的专名形式音译四字神名，区别于称号“主”。
- source_word: וָאֶקְבְּצָה
  choice: 召集
  rationale: 准确表达以斯拉主动把人聚集起来同行。
- source_word: רָאשִׁים
  choice: 首领
  rationale: 原文直义为“头”，在此指以色列人中居领导地位的人；“首领”自然且保留社会角色。
- source_word: לַעֲלוֹת
  choice: 上去
  rationale: 保留前往耶路撒冷惯用的方向表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文采用现代中文读者最熟悉、且明确作为专名的“耶和华”；“雅威”是更贴近学界常见重构发音的另一种音译。
- issue: 以斯拉刚强与上帝之手的关系
  choice: 用“因为”表达上帝的手是其刚强的根据
  alternative: 照着耶和华我上帝在我身上的手，我便刚强起来
  rationale: 原文 כְּיַד 保留“照着／按着”的形式可能，也可在语境中表达根据或原因。正文采用自然的因果表达，但以脚注保存较形式对应的读法，避免消除原文张力。
- issue: חֶסֶד 在本节的指向
  choice: 保留“慈爱”，不把它简化为人的好感
  alternative: 恩待／恩惠
  rationale: 虽然慈爱是在王与官员面前显明，但叙述将其归因于上帝；“慈爱”保留忠贞恩慈的神学厚度，同时不额外加入“盟约”一词。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“王—谋士—大臣”保持宫廷语域；“上去”保存前往耶路撒冷的圣经方向用语。正文中的脚注标记依出现次序排列为[a][b][c]。
