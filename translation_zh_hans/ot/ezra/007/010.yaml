id: EZR.7.10
reference: Ezra 7:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י עֶזְרָא֙ הֵכִ֣ין לְבָב֔/וֹ לִ/דְר֛וֹשׁ אֶת תּוֹרַ֥ת יְהוָ֖ה וְ/לַ/עֲשֹׂ֑ת וּ/לְ/לַמֵּ֥ד בְּ/יִשְׂרָאֵ֖ל חֹ֥ק וּ/מִשְׁפָּֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/010.yaml
  text: For Ezra had set his heart to seek the Law of Yahweh[a], and to do it[d][c][b], and to teach statutes and judgments in Israel.
translation:
  language: zh_hans
  text: 因为以斯拉立定心志[a]，要寻求[b]雅威[c]的律法，遵行这律法，并在以色列中教导律例和典章[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语也可译作“预备好自己的心”或“坚定自己的心”，表示有意识地在内心定意。
    reason: lexical_alternative
  - marker: b
    text: “寻求”也可译作“查考”或“考究”；原词可兼指求问、探究和认真研习。
    reason: lexical_alternative
  - marker: c
    text: “雅威”音译希伯来文神名YHWH，传统上也译作“耶和华”，或以“主”代称。
    reason: alternative_reading
  - marker: d
    text: 原文作单数“律例和典章”，这里按集合意义译出；也可译作“定例和法则”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本句解释上文以斯拉蒙恩并顺利成行的原因；“因为”自然保留了希伯来语的因由、解释作用。
- source_word: הֵכִין לְבָבוֹ
  choice: 立定心志
  rationale: 希伯来语习语是“使自己的心坚定/预备好”，表示经过 deliberate 的内在定意；“立定心志”既自然，又保留意志层面的含义。
- source_word: לִדְרוֹשׁ
  choice: 寻求
  rationale: דרש兼有寻求、探究、查考之意。“寻求”保留对律法既认真探究又敬虔追求的双重意味，不把它缩减为纯学术研究。
- source_word: תּוֹרַת יְהוָה
  choice: 雅威的律法
  rationale: 在以斯拉的祭司和经学背景中，תּוֹרָה指向以色列的盟约律法；译作“律法”清楚而符合语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文本直接呈现四字神名YHWH；“雅威”是现代普通话中常见的音译。
- source_word: וְלַעֲשֹׂת
  choice: 遵行这律法
  rationale: 原文直译为“去做”，宾语承接前面的律法。汉语用“遵行这律法”明确补出隐含宾语，也自然表达实际实行，而不增加额外神学含义。
- source_word: וּלְלַמֵּד
  choice: 并……教导
  rationale: Piel词形表示教导、传授；“教导”直接而庄重。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列中
  rationale: 保留介词所表达的范围，可指以色列群体及其社会领域，不强行限定为地理意义。
- source_word: חֹק וּמִשְׁפָּט
  choice: 律例和典章
  rationale: 这两个法律术语在此以单数形式作集合用法。“律例和典章”符合现代中文圣经法律语域，也自然传达其复数集合意义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。正文以“雅威”呈现专名，避免把专名无提示地改为称号；脚注交代传统译法。
- issue: תּוֹרָה在本节中的范围
  choice: 律法
  alternative: 训诲；妥拉
  rationale: 以斯拉的祭司、经学和群体教导语境表明，此处主要指雅威赐给以色列的盟约律法；“律法”既保留其规范性，也不排除教导层面。
- issue: דרש所含的敬虔追求与研读意味
  choice: 寻求
  alternative: 查考；考究
  rationale: “寻求”保留原词较宽的语义张力，包括求问、探究和以行动回应；脚注列出偏重研读的一面，避免单一化解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立定心志—寻求—遵行—教导”保留原文行动次序和递进关系；法律术语采用中文读者熟悉的“律法、律例、典章”。所有歧义均在脚注中保留，不在正文中作超出原文的神学解释。
