  yaml_path: translation/ot/ezra/007/008.yaml
  text: And he came to Jerusalem in the fifth month[a], which was the seventh year of the king.
translation:
  language: zh_hans
  text: 他在五月[a]来到耶路撒冷，那是王在位的第七年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在五月到达耶路撒冷；那是王在位的第七年。”
    reason: 词义及句法替代译法：בוא 可译为“到达”，后半句也可作为独立分句。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 他……来到
  rationale: 该叙事形式承接前文，表示接续发生的事件；“来到”保留 בוא 的基本意义，同时符合现代汉语叙事表达。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代简体中文《圣经》中通行的专名译法。
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: 在五月
  rationale: 介词 ב 在此表示时间；“在五月”简洁自然，并保留按月份纪年的表达。
- source_word: הִיא
  choice: 那是
  rationale: 阴性代词回指前述时间节点，并引出王年说明；“那是”既保留其解释和衔接作用，也不强行限定其具体语法所指。
- source_word: שְׁנַת הַשְּׁבִיעִית
  choice: 在位的第七年
  rationale: 这是王年纪年表达；汉语补出“在位”可清楚传达其纪年功能，而不改变原意。
- source_word: לַמֶּלֶךְ
  choice: 王……的
  rationale: 此处 ל 表示与王年纪年有关的关系。仅译“王”，不按上下文补入“亚达薛西”，以避免超出本节明说的内容。
