base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/001.yaml
  text: While Ezra was praying and making confession[a], weeping and falling down before the house of God, a very large assembly from Israel gathered to him—men, women, and children—for the people wept bitterly.
translation:
  language: zh_hans
  text: 当以斯拉祷告、认罪，哭泣并伏倒在神的殿前时，有一大群以色列人聚集到他那里，其中有男人、女人和孩童，因为众民痛哭不已[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“因为众民大大地哭泣。”
    reason: 原文以“哭泣”一词配合程度成分加强语气；正文采用较自然的现代汉语表达。
lexical_decisions:
- source_word: וּכְהִתְפַּלֵּל עֶזְרָא וּכְהִתְוַדֹּתוֹ
  choice: 以斯拉祷告认罪……的时候
  rationale: 两个带כְ的结构表示与主句同时发生的背景动作；用“……的时候”自然体现这一时间关系。התפלל译为“祷告”，התודה在本段悔罪语境中译为“认罪”。
- source_word: בֹּכֶה וּמִתְנַפֵּל
  choice: 哭泣、伏倒
  rationale: 两个分词描写以斯拉持续的动作。“伏倒”保留反身性动作及恳求姿态，又不强行规定身体姿势的具体细节。
- source_word: לִפְנֵי בֵּית הָאֱלֹהִים
  choice: 在神的殿前
  rationale: בֵּית הָאֱלֹהִים直译为“神的家”，此处所指为圣殿；“神的殿”既保留原有称谓，又符合现代汉语表达。לִפְנֵי译作“在……前”。
- source_word: נִקְבְּצוּ אֵלָיו
  choice: 聚集到他那里
  rationale: 保留קבץ的聚集含义和אֶל所表达的趋向，不增添“围着他”等原文未明说的空间细节。
- source_word: מִיִּשְׂרָאֵל קָהָל רַב מְאֹד
  choice: 有一大群以色列人
  rationale: קהל指聚集起来的群体；现代汉语用“一大群”自然传达רַב מְאֹד所强调的规模，并避免“会众”可能带入的特定宗教组织含义。
- source_word: אֲנָשִׁים וְנָשִׁים וִילָדִים
  choice: 男女和孩童都有
  rationale: 完整保留男人、女人、孩子三类人，同时以自然汉语说明这群人的构成。
- source_word: כִּי בָכוּ הָעָם הַרְבֵּה בֶכֶה
  choice: 因为众民都痛哭不已
  rationale: כִּי在此引出原因。הַרְבֵּה בֶכֶה以名词和程度成分强化哭泣；“痛哭不已”在现代汉语中自然传达强烈、持续的哀哭，脚注另列更贴近形式的译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“神的殿”兼顾原文“神的家”这一称谓与中文读者对圣殿的自然理解；全句保留以斯拉祷告、认罪、哭泣、伏倒与百姓聚集痛哭之间的叙事关系。
