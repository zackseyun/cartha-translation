  text: וַ/יְכַלּ֣וּ בַ/כֹּ֔ל אֲנָשִׁ֕ים הַ/הֹשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת עַ֛ד י֥וֹם אֶחָ֖ד לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/017.yaml
  text: And they finished with all the men who had taken foreign wives by the first day of the first month[a].
translation:
  language: zh_hans
  text: 到正月初一，他们查完了所有娶外族女子为妻的男子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到正月初一才查完。”希伯来文的时间表达标明完成此事的日期界限，可译作“到”或“直到”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  choice: 他们查完了
  rationale: 该动词表示完成；结合上下文所述的逐案查办过程，译作“查完了”既表达完成，也自然衔接本节所处理的男子。
- source_word: בַכֹּל אֲנָשִׁים
  choice: 所有……的男子
  rationale: 介词ב与כֹּל在此表示处理对象的全部范围；אֲנָשִׁים明确指男性，故译为“所有……的男子”。
- source_word: הַהֹשִׁיבוּ
  choice: 娶……为妻
  rationale: 字面有“使居住”之意，但在以斯拉记第10章的语境中，指把女子接入家中为妻；“娶……为妻”是现代汉语中清楚而不过度扩展的表达。
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: 外族女子
  rationale: נָשִׁים可指女子或妻子，נָכְרִיּוֹת指外来的、异族的；因前面的婚姻性表达已用“娶……为妻”呈现，这里译“外族女子”自然且避免重复。
- source_word: עַד יוֹם אֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: 到正月初一
  rationale: עַד标明时间终点，可理解为“到”或“截至”；“正月初一”是现代汉语自然的日期表达，这里的“正月”仅指历法中的第一个月。
theological_decisions: []
