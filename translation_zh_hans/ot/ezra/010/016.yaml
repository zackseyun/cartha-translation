source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֮ בְּנֵ֣י הַ/גּוֹלָה֒ וַ/יִּבָּדְלוּ֩ עֶזְרָ֨א הַ/כֹּהֵ֜ן אֲנָשִׁ֨ים רָאשֵׁ֧י הָ/אָב֛וֹת לְ/בֵ֥ית אֲבֹתָ֖/ם וְ/כֻלָּ֣/ם בְּ/שֵׁמ֑וֹת וַ/יֵּשְׁב֗וּ בְּ/י֤וֹם אֶחָד֙ לַ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י לְ/דַרְי֖וֹשׁ הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/016.yaml
  text: So the sons of the exile did so. And Ezra the priest set apart men, heads of fathers’ houses according to their fathers’ houses, all of them by name; and they sat down on the first day of the tenth month to investigate the matter.
translation:
  language: zh_hans
  text: 被掳归回的人就这样做了。[a]祭司以斯拉和一些父家的首领被分别出来；[b]他们按各自的父家，个个按名列出。[c]他们在十月初一坐下来，查究这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“被掳之子”，是对被掳后归回群体的统称。
    reason: lexical_alternative
  - marker: b
    text: 原文动词为复数的被动／反身式，可译为“被分别出来”或“分别出来”。它与随后“祭司以斯拉和一些父家的首领”的句法关系有张力；这里保留他们一同被分别出来办理调查的理解。
    reason: alternative_reading
  - marker: c
    text: “父家的首领”原文为“父家的首领们”；“父家”指以父系血缘组成的家族或宗族单位。“按名列出”表示逐一按姓名指定或登记。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי הַגּוֹלָה
  choice: 被掳归回的人
  rationale: 原文直译为“被掳之子”，是对归回群体的集体称呼。中文采用自然且能交代历史处境的表达，并以脚注保留原文形式。
- source_word: וַיִּבָּדְלוּ
  choice: 把一些人分别出来
  rationale: בדל 的尼法勒形态表达分开或分别出来；此处句法虽不寻常，语境指以斯拉将有关代表分别出来办理调查，故保留“分别”的基本意象，不径直释作“挑选”。
- source_word: עֶזְרָא הַכֹּהֵן
  choice: 祭司以斯拉
  rationale: 原文只称以斯拉为祭司，不从邻近经文增添“文士”。
- source_word: אֲנָשִׁים רָאשֵׁי הָאָבוֹת
  choice: 一些人；他们都是各宗族的族长
  rationale: אֲנָשִׁים 明说“人/男子”，而 רָאשֵׁי הָאָבוֹת 指父系宗族的首领。中文拆句以避免生硬同位语，同时保留其领导身份。
- source_word: לְבֵית אֲבֹתָם
  choice: 按各自的父家
  rationale: 指依父系家族或宗族单位加以归类。“父家”保留古代社会组织术语，并由脚注说明。
- source_word: וְכֻלָּם בְּשֵׁמוֹת
  choice: 个个都有名
  rationale: 表示每个人均按名字明确登记或指定；此译简洁自然，又不额外断定登记程序。
- source_word: וַיֵּשְׁבוּ
  choice: 坐下来
  rationale: 保留 ישב 的字面动作；在行政调查语境中也自然含有就座议事、开始办理之意。
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הָעֲשִׂירִי
  choice: 在十月初一
  rationale: “第十月的一日”是日期表达，现代汉语自然译为“十月初一”。
- source_word: לְדַרְיוֹשׁ הַדָּבָר
  choice: 查究这事
  rationale: דרש 在此表示寻查、调查；“查究”既能体现认真调查，也符合庄重的叙事语体。
theological_decisions:
- issue: וַיִּבָּדְלוּ 的主语与语态所形成的句法张力
  choice: 祭司以斯拉把一些人分别出来
  alternative: 祭司以斯拉和一些人分别出来／祭司以斯拉挑选了一些人
  rationale: 马所拉文本的复数尼法勒形式与紧随其后的“以斯拉……一些人”可容许不同句法分析。按上下文，较可能是以斯拉将各父家首领分别出来执行调查；正文采用此理解，同时用脚注保留“他们自行分开”的可能，不把动词完全化约为“挑选”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“被掳归回的人”避免生硬直译“被掳之子”；“父家”仅在正文保留一次，并以脚注解释。标点划清同位关系，使长句易读，同时不增添原文没有的职衔或程序细节。
