revisions:
- from: 被掳归回的人就照样做了。[a]祭司以斯拉把一些人分别出来：[b]他们都是各宗族的族长，[c]按各自的父家选出，个个都有名。他们在十月初一坐下来，查究这事。
  to: 被掳归回的人就这样做了。[a]祭司以斯拉和一些父家的首领被分别出来；[b]他们按各自的父家，个个按名列出。[c]他们在十月初一坐下来，查究这事。
  rationale: 修订恢复复数尼法勒动词所容许、且较贴近句法表面的理解：以斯拉和父家首领一同被分别出来。脚注明确保留该难句的替代分析，避免将有争议的语态和主语关系教条化。并将“按父家”与“按名”的两个原文限定语清晰、自然地表达出来。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:00Z'
