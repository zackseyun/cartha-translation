  text: וְ/עַתָּ֗ה תְּנ֥וּ תוֹדָ֛ה לַ/יהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם וַ/עֲשׂ֣וּ רְצוֹנ֑/וֹ וְ/הִבָּֽדְלוּ֙ מֵ/עַמֵּ֣י הָ/אָ֔רֶץ וּ/מִן הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/011.yaml
  text: So now give praise to Yahweh[a], the God of your fathers, and do his will[b]. Separate yourselves from the peoples of the land and from the foreign women.
translation:
  language: zh_hans
  text: 所以现在，你们要向耶和华你们列祖的上帝献上赞美[a]，遵行他的旨意；你们要与这地各族的人分别，也要与外族女子分别[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向耶和华认罪。”这里的希伯来语表达可指献上感谢或赞美，在本段语境中也可指承认罪过。
    reason: alternative_reading
  - marker: b
    text: 按上下文，“外族女子”也可译作“外族妻子”；本节希伯来原文直译为“外族女子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ תוֹדָה
  choice: 献上赞美
  rationale: 该短语可表示感谢、赞美，也可在认罪语境中表示承认或认罪。正文采用自然且贴近字面的“献上赞美”，同时以脚注保留“认罪”的语境可能性。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 以“耶和华”呈现四字神名，既保留其专名性质，也符合现代中文圣经语体。
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: 你们列祖的上帝
  rationale: “列祖”准确保留祖先及圣约历史的意味；“上帝”清楚自然。
- source_word: וַעֲשׂוּ רְצוֹנוֹ
  choice: 遵行他的旨意
  rationale: רצון可指旨意、意愿或喜悦；“遵行他的旨意”在中文中自然，并保留命令的伦理力度。
- source_word: וְהִבָּדְלוּ
  choice: 分别
  rationale: 该尼法勒命令式在此具有主动自我分离的意义；“与……分别”简洁地表达这一反身含义。
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: 与这地各族的人
  rationale: עמי为复数，故译作“各族的人”；“这地”保留הארץ的表达，不进一步限定为周边诸国或某一特定区域。
- source_word: וּמִן הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: 也要与外族女子分别
  rationale: 本节原文明确说“外族女子”，并未使用“妻子”一词；上下文虽涉及婚姻，正文仍保留原文措辞，脚注说明“外族妻子”的语境译法。
theological_decisions:
- issue: תודה在此应译作赞美、感谢，还是认罪
  choice: 献上赞美
  alternative: 向耶和华认罪
  rationale: 该希伯来语表达具有语义张力；紧接着的顺服与分别命令使“认罪”很符合上下文，但词语本身也通常表示感谢或赞美。正文不把语境推论写死，脚注保留另一读法。
- issue: הנשים הנכריות应译作外族女子还是外族妻子
  choice: 外族女子
  alternative: 外族妻子
  rationale: 原文本节使用“女子/妇女”，而非明确的“妻子”；婚姻关系由上下文显明，因此将“妻子”作为脚注中的语境译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“献上赞美”保留敬拜语体；以分号连接两组命令，使句法层次清楚。所有脚注标记均置于正文相应位置。
