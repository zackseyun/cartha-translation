  text: יַֽעֲמְדוּ נָ֣א שָׂ֠רֵי/נוּ לְֽ/כָל הַ/קָּהָ֞ל וְ/כֹ֣ל אֲשֶׁ֣ר בֶּ/עָרֵ֗י/נוּ הַ/הֹשִׁ֞יב נָשִׁ֤ים נָכְרִיּוֹת֙ יָבֹא֙ לְ/עִתִּ֣ים מְזֻמָּנִ֔ים וְ/עִמָּ/הֶ֛ם זִקְנֵי עִ֥יר וָ/עִ֖יר וְ/שֹׁפְטֶ֑י/הָ עַ֠ד לְ/הָשִׁ֞יב חֲר֤וֹן אַף אֱלֹהֵ֨י/נוּ֙ מִמֶּ֔/נּוּ עַ֖ד לַ/דָּבָ֥ר הַ/זֶּֽה־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/014.yaml
  text: Please let our leaders stand for the whole assembly[a], and let everyone in our cities who has taken foreign wives come at appointed times, with them the elders of each city and its judges[b], until the burning anger of our God is turned back from us in this matter.
translation:
  language: zh_hans
  text: “请让我们的首领作全体会众的代表；各城凡娶了外族女子的人[a]，都要按指定的时间前来；各城的长老和审判官也要与他们同来，直到我们上帝因这件事所发的烈怒从我们身上转离[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“使外族女子住下”或“安置外族女子”，在这里指把她们接进家中为妻。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“直到这件事为止”。原文末尾重复“直到”，其与前句的句法关系可有不同理解。
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲמְדוּ נָא
  choice: 请让……出面
  rationale: 未完成式配合语气词 נָא 表达恭敬的提议或请求；“出面”在现代汉语中自然地传达首领承担代表性职责，而不把“站立”机械直译。
- source_word: שָׂרֵינוּ
  choice: 我们的首领
  rationale: שָׂרִים 在本段指群体中的领导者或官长；“首领”庄重、清楚，又不误导为王室贵族。
- source_word: לְכָל הַקָּהָל
  choice: 代表全体会众
  rationale: 介词 לְ 在此表示首领与全会众之间的代表关系；“代表”比生硬的“为全体会众站立”更符合现代汉语。
- source_word: הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: 娶了外族女子
  rationale: 原文使役式字面为“使外族女子居住／安置外族女子”，在上下文中是把她们接入家中为妻；正文采用自然明确的婚姻表达，并以脚注保留原文措辞。
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: 在指定的日期
  rationale: 该短语指为处理案件预先安排的时间；“指定的日期”适合这里分批到场的行政语境。
- source_word: וְעִמָּהֶם זִקְנֵי עִיר וָעִיר וְשֹׁפְטֶיהָ
  choice: 各城的长老和审判官也要与他们同来
  rationale: עִיר וָעִיר 是逐一分配的说法，即“各城”；所属后缀表明审判官属于相应城市。调整汉语语序，使陪同关系清楚。
- source_word: חֲרוֹן אַף אֱלֹהֵינוּ
  choice: 我们上帝的烈怒
  rationale: 该希伯来习语含有怒气燃烧的强烈意象；“烈怒”简洁庄重，保留强度而不另加神学解释。
- source_word: עַד לְהָשִׁיב ... מִמֶּנּוּ
  choice: 直到……从我们转离
  rationale: 保留 שוב 的“转回／转离”意象及 מִמֶּנּוּ 的群体指向，也不明说使怒气转离的行动者。
- source_word: עַד לַדָּבָר הַזֶּה
  choice: 在这件事上
  rationale: 结尾短语把上帝的烈怒与当前处理的事件相连；此译法自然，同时脚注注明另一种可行理解。
theological_decisions:
- issue: 如何表达上帝因群体违约而发怒
  choice: 我们上帝的烈怒
  alternative: 我们上帝如火的怒气
  rationale: 原文明确使用 חֲרוֹן אַף 描写上帝强烈的怒气。“烈怒”不弱化这一表达，也不引入经文以外的系统神学说明。
- issue: 结尾 עַד לַדָּבָר הַזֶּה 与前句的关系
  choice: 在这件事上
  alternative: 直到这件事处理完毕
  rationale: 希伯来语结尾结构紧缩，通常可理解为“关于／在这件事上”，但也可能把第二个 עַד 理解为延续时间界限。正文不补入原文没有明说的“处理完毕”，脚注保留这一可能。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“会众、长老、审判官、烈怒”等词保留历史与宗教语境；以分号梳理提议的行政程序。脚注标记均置于相关正文之后。
