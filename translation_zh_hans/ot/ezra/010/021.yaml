  text: 'And from the sons of Harim: Maaseiah[a], Elijah, Shemaiah, Jehiel, and Uzziah.'
translation:
  language: zh_hans
  text: 哈琳的子孙中有：玛西雅、以利亚、示玛雅、耶歇、乌西雅。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: ……的子孙中有
  rationale: וְ连接前文，מִן带有从一群人中列举成员的部分含义；中文用“……的子孙中有”自然表达名单中的家族分组。因本节承接上一节的名单，中文不必生硬加入“并且”。
- source_word: חָרִם
  choice: 哈琳
  rationale: 按现代中文圣经人名的通行音译处理，作为家族先祖之名。
- source_word: מַעֲשֵׂיָה
  choice: 玛西雅
  rationale: 专名采用现代中文圣经中较通行且便于朗读的译名。
- source_word: וְ/אֵלִיָּה
  choice: 以利亚
  rationale: 采用现代中文圣经通行译名；连接词由中文列举结构表达。
- source_word: וּֽ/שְׁמַֽעְיָה
  choice: 示玛雅
  rationale: 按希伯来语名称音译，并采用中文圣经中常见形式。
- source_word: וִ/יחִיאֵל
  choice: 耶歇
  rationale: 采用中文圣经中常见的简洁音译，保留专名身份。
- source_word: וְ/עֻזִיָּה
  choice: 乌西雅
  rationale: 采用现代中文圣经通行译名；末项前的连接词按自然中文名单格式以顿号承接。
