revisions:
- from: 现在，让我们与我们的神立约，把所有妇女[a]和她们所生的儿女都送走，遵照我主和那些因我们神的诫命而战兢之人的意见；愿这一切都照律法办理。
  to: 现在，让我们与我们的神立约，把所有妻子[a]和她们所生的儿女都送走，遵照我主和那些因我们神的诫命而战兢之人的意见；愿事情照着律法办理。
  rationale: 修订仅处理 נָשִׁים 在本段语境中的指称及末句的汉语贴合度。保留“送走”，不预断其法律性质；保留“我主”，不将其神名化；并保留对“战兢”所表达敬畏与郑重顺服的张力。
