id: EZR.10.3
reference: Ezra 10:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֣ה נִֽכְרָת בְּרִ֣ית לֵ֠/אלֹהֵי/נוּ לְ/הוֹצִ֨יא כָל נָשִׁ֜ים וְ/הַ/נּוֹלָ֤ד מֵ/הֶם֙ בַּ/עֲצַ֣ת אֲדֹנָ֔/י וְ/הַ/חֲרֵדִ֖ים בְּ/מִצְוַ֣ת אֱלֹהֵ֑י/נוּ וְ/כַ/תּוֹרָ֖ה יֵעָשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/003.yaml
  text: So now let us make a covenant with our God to send away all the women and what has been born from them, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law.
translation:
  language: zh_hans
  text: 现在，让我们与我们的神立约，把所有妻子[a]和她们所生的儿女都送走，遵照我主和那些因我们神的诫命而战兢之人的意见；愿事情照着律法办理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妻子”一词原文也可泛指“妇女”；按本段关于婚配的语境，此处译作“妻子”。
    reason: 保留 נָשִׁים 的词义范围，并说明正文采用“妻子”是基于上下文，而非将“外族”加入正文。
lexical_decisions:
- source_word: נִכְרָת בְּרִית
  choice: 立约
  rationale: 希伯来语字面为“切立盟约”，现代汉语惯用“立约”，准确而自然。
- source_word: כָל נָשִׁים
  choice: 所有妇女
  rationale: נָשִׁים 可指“妇女”或“妻子”；正文采用较贴近词面的“妇女”，并以脚注保留语境中的另一可能。
- source_word: וְהַנּוֹלָד מֵהֶם
  choice: 和她们所生的儿女
  rationale: 原文为集合性表达“从她们所生的”；按语境补出“儿女”，使现代汉语清楚自然。
- source_word: אֲדֹנָי
  choice: 我主
  rationale: 此处按带第一人称单数所属含义的称呼理解为“我主”，与英语审校层一致，也不将其误作神名。
- source_word: הַחֲרֵדִים בְּמִצְוַת אֱלֹהֵינוּ
  choice: 那些因我们神的诫命而战兢之人
  rationale: 保留 חרד 的强烈情感意象“战兢”，并维持介词结构可能兼含因诫命而敬畏、对诫命郑重顺服的张力。
- source_word: וְכַתּוֹרָה יֵעָשֶׂה
  choice: 愿这一切都照律法办理
  rationale: 保留被动/非人称式命令意味，以自然庄重的汉语表达“应当照律法施行”。
theological_decisions:
- issue: נָשִׁים 是泛称“妇女”还是特指“妻子”
  choice: 正文译“妇女”，脚注说明也可译“妻子”
  alternative: 直接译“妻子”或“外族妻子”
  rationale: 原词本身没有“外族”一词；上下文虽指婚姻关系，正文不额外加入限定，以免超出本节字面证据。
- issue: אֲדֹנָי 的所指
  choice: 译作人际尊称“我主”
  alternative: 译作神圣称号“主”
  rationale: 本句并列“我主”和敬畏诫命的人，且英语审校层明确保留“my lord”；因此不将该词神名化。
- issue: 送走妇女和儿女的法律性质
  choice: 采用中性的“送走”
  alternative: 译作“休掉”“离弃”或“驱逐”
  rationale: לְהוֹצִיא 基本义是“使出去、带走、送走”；不在译文中预先界定其法律程序或道德评价。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“立约”“战兢”“律法”保留经文语体，“送走”“办理”则避免生硬直译。所有脚注标记均已置于正文相应位置。
