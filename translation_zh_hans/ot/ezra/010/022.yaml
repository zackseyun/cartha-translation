  text: 'And from the sons of Pashhur: Elioenai, Maaseiah, Ishmael, Nethanel, Jozabad, and Elasah.'
translation:
  language: zh_hans
  text: 巴施户珥的子孙中，有以利约乃、玛西雅、以实玛利、拿坦业、约撒拔和以利亚撒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: ……的子孙中，有
  rationale: 该形式由连词、介词和“儿子/子孙”的复数构词形组成，在名单中引出下一个家族内的若干人。“子孙中，有”自然表达其部分含义；上下文中的并列关系无需机械译出“并且”。
- source_word: פַּשְׁחוּר
  choice: 巴施户珥
  rationale: 专名采用现代中文圣经读者较熟悉的传统音译。
- source_word: אֶלְיוֹעֵינַי
  choice: 以利约乃
  rationale: 专名采用通行中文音译。
- source_word: מַעֲשֵׂיָה
  choice: 玛西雅
  rationale: 专名采用通行中文音译。
- source_word: יִשְׁמָעֵאל
  choice: 以实玛利
  rationale: 专名采用中文圣经中的传统音译，以保持辨识度。
- source_word: נְתַנְאֵל
  choice: 拿坦业
  rationale: 专名采用通行中文音译。
- source_word: יוֹזָבָד
  choice: 约撒拔
  rationale: 专名采用通行中文音译。
- source_word: וְאֶלְעָשָׂה
  choice: 和以利亚撒
  rationale: 显明词首连词的并列作用，并采用该专名的通行中文音译。
