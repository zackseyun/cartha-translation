source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר לֹֽא יָב֜וֹא לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים כַּ/עֲצַ֤ת הַ/שָּׂרִים֙ וְ/הַ/זְּקֵנִ֔ים יָחֳרַ֖ם כָּל רְכוּשׁ֑/וֹ וְ/ה֥וּא יִבָּדֵ֖ל מִ/קְּהַ֥ל הַ/גּוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/008.yaml
  text: And everyone who does not come within three days[a], according to the counsel of the officials and the elders, all his property shall be forfeited, and he himself shall be separated from the assembly of the exiles.
translation:
  language: zh_hans
  text: 按照首领和长老的决定，凡在三天之内没有前来的，他的一切财物都要被没收[a]，他本人也要从被掳归回者的会众中被隔离。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都要被置于禁令（禁毁）之下。”希伯来语动词指置于חֵרֶם之下，即不可撤回的禁令或奉献处置；用于财物时可包含毁灭或没收的意思。
    reason: 保留יָחֳרַם的技术性和“禁毁/没收”之间的词义张力，同时正文按本处行政处罚语境采用自然的“没收”。
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר לֹא יָבוֹא
  choice: 凡不……前来的
  rationale: 以现代汉语的一般条件句表达分配性的“任何不来者”；“前来”体现应召到场的语境。
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: 在三天之内
  rationale: 清楚表达规定的期限，同时不额外断定是从哪一具体时点起算。
- source_word: כַּעֲצַת
  choice: 照……的决定
  rationale: עֵצָה可指商议、意见或决定；此处涉及有权威的行政命令，“决定”最符合上下文。
- source_word: הַשָּׂרִים וְהַזְּקֵנִים
  choice: 首领和长老
  rationale: שׂרים在归回时期指领导或行政官员；“首领”自然庄重，并与“长老”构成清楚的领导群体。
- source_word: יָחֳרַם
  choice: 被置于禁毁之下
  rationale: 保留חרם所含归入禁令、不可挽回处置的专门意味；脚注说明本处可能落实为没收，避免把词义缩减为单纯现代法律概念。
- source_word: כָּל רְכוּשׁוֹ
  choice: 他的一切财物
  rationale: רְכוּשׁ指财物或产业；“一切财物”准确保留כָּל的完整范围。
- source_word: וְהוּא יִבָּדֵל
  choice: 他本人也要……被隔离
  rationale: 明确译出独立代词הוּא的强调作用，并保留בדל的“分离”概念，不套用后世教会制度术语。
- source_word: מִקְּהַל הַגּוֹלָה
  choice: 从被掳归回者的会众中
  rationale: הַגּוֹלָה在本书语境中指经历被掳而归回的群体；“会众”表达קהל的集体性，且符合经文庄重语域。
theological_decisions:
- issue: חרם用于财物时的处罚性质
  choice: 正文译为“被置于禁毁之下”，脚注列出“没收”与“归入禁令”的可能理解。
  alternative: 译为“予以没收”。
  rationale: 该动词带有技术性的禁令或奉献处置色彩，而在此行政语境中的实际效果可能是没收。正文保留其较强的原文色彩，脚注呈现语境上的法律含义。
- issue: 从群体中分离的性质
  choice: 译为“从……会众中被隔离”。
  alternative: 译为“被逐出”或“被革除教籍”。
  rationale: 原文只说明与归回群体的会众分离，没有规定后世宗教制度意义上的处分；因此避免引入“革除教籍”等术语。
- issue: הַגּוֹלָה所指群体
  choice: 译为“被掳归回者”。
  alternative: 直译为“被掳者”或译为“归回的流亡群体”。
  rationale: 在《以斯拉记》的历史语境中，这一称谓指被掳后归回并组成当地共同体的人；译文显明语境，但不改变其群体身份。
translation_notes:
  register: 采用现代、庄重而清晰的书面汉语。“禁毁”属较少见的经文术语，因此以脚注解释；句式保留原文先列不服从条件、再列财产与个人两项后果的法律性结构。
