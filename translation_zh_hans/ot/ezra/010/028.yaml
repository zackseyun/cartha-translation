  yaml_path: translation/ot/ezra/010/028.yaml
  text: 'And from the sons of Bebai: Jehohanan[a], Hananiah, Zabbai[b], Athlai.'
translation:
  language: zh_hans
  text: 比拜的子孙[a]中有：耶何哈难[b]、哈拿尼雅、撒拜、亚特莱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“子孙”也可泛指比拜家族的后裔或成员。
    reason: lexical_alternative
  - marker: b
    text: “耶何哈难”也常简译作“约哈难”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: ……的子孙中有
  rationale: 该词由连接词、介词和“儿子”的复数构词形式组成，直译为“并从……的众子中”。在家族名单中，בְּנֵי可泛指某人的后裔或宗族成员；译作“子孙”既保留亲属谱系含义，也符合现代汉语名单体表达。
- source_word: בֵּבָי
  choice: 比拜
  rationale: 按希伯来语音译这一人名或宗族名，并采用中文圣经姓名的常见形式。
- source_word: יְהוֹחָנָן
  choice: 耶何哈难
  rationale: 按较完整的希伯来语形式Yəhôḥānān音译，尽量体现词首的神名成分；较简略的传统译形“约哈难”列入脚注。
- source_word: חֲנַנְיָה
  choice: 哈拿尼雅
  rationale: 按希伯来语音译，并采用自然、通行的中文圣经姓名形式。
- source_word: זַבַּי
  choice: 撒拜
  rationale: 按希伯来语音译；词中的辅音双写不必在现代汉语音译中另作标示。
- source_word: עַתְלָי
  choice: 亚特莱
  rationale: 按希伯来语音译，保留末尾双元音所对应的音节。
theological_decisions: []
