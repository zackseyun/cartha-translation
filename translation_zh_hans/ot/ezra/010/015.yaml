base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/015.yaml
  text: Only Jonathan son of Asahel and Jahzeiah son of Tikvah stood against this[b][a], and Meshullam and Shabbethai the Levite supported them.
translation:
  language: zh_hans
  text: 只有亚撒黑的儿子约拿单和提瓦的儿子雅哈谢[a]反对这事[c]；米书兰和利未人沙比太支持他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅哈谢”也可音译作“雅哈西雅”。
    reason: lexical_alternative
  - marker: b
    text: 或译“帮助他们”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“就这事站出来”。此处句意有争议，也有人理解为他们负责办理这事。
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: אַךְ
  choice: 只有
  rationale: 本词在上文众人一致回应的背景下具有限定、例外之意；“只有”自然地表明以下人物是例外。
- source_word: יוֹנָתָן בֶּן עֲשָׂהאֵל
  choice: 亚撒黑的儿子约拿单
  rationale: 采用现代中文圣经中较通行的人名音译，并按自然汉语次序表达父子关系。
- source_word: יַחְזְיָה בֶן תִּקְוָה
  choice: 特瓦的儿子雅哈谢
  rationale: 按马所拉读音采用通行音译“雅哈谢”；其传统音译异形另收入脚注。
- source_word: עָמְדוּ עַל זֹאת
  choice: 反对这事
  rationale: 直译近于“站在这事之上／就这事站立”。结合אַךְ所标示的例外以及下文有人帮助他们，这里较自然地表示采取反对立场；但原短语也可能表示负责办理此事，故以脚注保留歧义。
- source_word: וּמְשֻׁלָּם וְשַׁבְּתַי הַלֵּוִי
  choice: 米书兰和利未人沙比太
  rationale: 希伯来语的定语“利未人”依词序最自然地只修饰沙比太，不扩及米书兰。
- source_word: עֲזָרֻם
  choice: 支持他们
  rationale: עזר带第三人称阳性复数宾语后缀，基本义为“帮助他们”；在议事和立场语境中，“支持他们”更明确地表达协助、声援之意，同时在脚注保留直接译法。
theological_decisions:
- issue: 约拿单和雅哈谢所持立场或所负职责
  choice: 反对这事
  alternative: 负责办理这事／为这事站出来
  rationale: 希伯来语עָמְדוּ עַל זֹאת可按语境理解为“站出来反对这事”，也可较字面地理解为“站在这事之上”，即负责或参与办理。正文采用与上下文例外语气较吻合的解释，脚注保留另一可能，避免把有争议的句法解释绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“只有”承接上文并突出例外；分号清楚区分反对者与支持者。人名使用简体中文圣经读者较熟悉的音译形式，关键句法歧义以脚注保留。
