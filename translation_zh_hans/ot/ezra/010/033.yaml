  text: 'From the sons of Hashum: Mattenai[a], Mattattah, Zabad, Eliphelet, Jeremai, Manasseh, and Shimei.'
translation:
  language: zh_hans
  text: 哈顺的子孙中有：玛特乃、玛他他、撒拔、以利法列、耶利买、玛拿西和示每。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי חָשֻׁם
  choice: 哈顺的子孙中有
  rationale: 介词 מִן 与 בְּנֵי 连用，在名单语境中表示从哈顺这一宗族中列出若干成员；译为“哈顺的子孙中有”自然地保留这一含义。
- source_word: מַתְּנַי
  choice: 玛特乃
  rationale: 按希伯来语读音音译人名，并采用适合现代汉语的字形。
- source_word: מַתַּתָּה
  choice: 玛他他
  rationale: 按希伯来语音形音译；两个 ת 的发音在汉语音译中无需刻意以叠字表现辅音延长。
- source_word: זָבָד
  choice: 撒拔
  rationale: 按希伯来语读音音译人名。
- source_word: אֱלִיפֶלֶט
  choice: 以利法列
  rationale: 采用中文圣经人名中较熟悉且贴近希伯来语的音译形式。
- source_word: יְרֵמַי
  choice: 耶利买
  rationale: 按希伯来语读音音译，并保留词尾音节。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用中文圣经传统中通行且易于辨认的音译。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 采用中文圣经传统中通行的音译，以便与其他经文中的同名人物保持辨识上的一致。
