  yaml_path: translation/ot/ezra/010/019.yaml
  text: They pledged themselves to send away their wives[a], and being guilty[b], they offered a ram from the flock for their guilt.
translation:
  language: zh_hans
  text: 他们郑重承诺要遣走自己的妻子[a]；他们既有罪，就为自己的罪献上羊群中的一只公羊[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“交出自己的手”，这是希伯来语中表示作出承诺或保证的习语。
    reason: lexical_alternative
  - marker: b
    text: 也可更明确地译作：“他们为自己的罪献上一只羊群中的公羊作赎愆祭。”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנוּ יָדָם
  choice: 他们郑重承诺
  rationale: 原文直译为“他们交出自己的手”，是表示作出承诺或保证的希伯来习语。译作“郑重承诺”既传达习语实际含义，也保留其庄重和约束性。
- source_word: לְהוֹצִיא
  choice: 要遣走
  rationale: יצא的使役式在此表示“使出去”。结合本章处理外族妻子的语境，“遣走”比单纯的“赶出”更准确，也不额外加入原文没有明说的法律术语。
- source_word: נְשֵׁיהֶם
  choice: 自己的妻子
  rationale: 本段明确涉及婚姻关系，因此 נָשִׁים 在这里指“妻子”，而非泛指“妇女”。
- source_word: וַאֲשֵׁמִים
  choice: 他们既有罪
  rationale: 该词描述他们处于负罪、应承担罪责的状态。“既有罪”自然承接随后因罪献上公绵羊的行动。
- source_word: אֵיל צֹאן
  choice: 一只公绵羊
  rationale: 该短语指羊群中的公羊，作为献祭牲畜。现代汉语“一只公绵羊”清楚自然；“出自羊群”在中文正文中属于可省而不损其义的信息。
- source_word: עַל אַשְׁמָתָם
  choice: 为自己的罪
  rationale: 介词 עַל 加名词 אַשְׁמָה 表明献祭是因他们的罪责而行。“为自己的罪”简洁地保留了这一因由关系。
theological_decisions:
- issue: 是否在正文中明确使用礼仪术语“赎愆祭”
  choice: 正文译作“为自己的罪献上一只公绵羊”，不直接加入“赎愆祭”
  alternative: “为自己的罪献上一只公绵羊作赎愆祭”
  rationale: 原文明确提到公绵羊和他们的罪责，献祭含义在省略动词的结构中自然成立，但本分句没有另列“祭”这一名词。正文不增添完整技术名称，可避免超出原文字面；脚注说明更明确的礼仪性理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“郑重承诺”传达希伯来习语的功能；“遣走”保留原文行动的直接性而不擅自加入“离婚”等法律解释。正文中的脚注标记[a]、[b]均已对应列出。
