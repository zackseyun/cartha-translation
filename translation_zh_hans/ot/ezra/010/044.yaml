  text: כָּל אֵ֕לֶּה נשא/י נָשִׁ֣ים נָכְרִיּ֑וֹת וְ/יֵ֣שׁ מֵ/הֶ֣ם נָשִׁ֔ים וַ/יָּשִׂ֖ימוּ בָּנִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/044.yaml
  text: All these had married foreign women, and some of them had wives by whom they had children.
translation:
  language: zh_hans
  text: 这些人全都娶了外族女子；其中有些人的妻子已经生了儿女。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句的希伯来文十分简略，也较难理解。按字面词序约为：“其中有妻子，并且他们置放了儿子。”这里“置放了儿子”的意思不确定；通常按上下文理解为这些婚姻中已有子女。
    reason: lexical_alternative
  - marker: b
    text: “儿女”原文为“儿子们”，这里也可泛指所生的孩子。
    reason: lexical_alternative
lexical_decisions:
- source_word: נשא/י נָשִׁים
  choice: 娶了……女子
  rationale: 这里“举起／带走”与“女子”连用，是娶妻的惯用表达；译为“娶了”符合现代汉语，也清楚表达婚姻关系。
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: 外族女子
  rationale: נָכְרִיּוֹת 指来自本族及圣约群体之外的女子。“外族女子”比“奇异女子”自然，也避免现代“外国人”一词偏重国籍的含义。
- source_word: וְיֵשׁ מֵהֶם נָשִׁים
  choice: 其中有些妻子
  rationale: 按上下文将 נָשִׁים 理解为这些人的妻子；“其中有些妻子”简洁表达希伯来文存在句，同时保留所指范围略显压缩的特点。
- source_word: וַיָּשִׂימוּ בָּנִים
  choice: 还生了儿女
  rationale: 原文直译近似“并且他们放置了儿子”，措辞简略且难解；结合婚姻语境，主句采用自然的“生了儿女”，并以脚注保留原文的困难和较直译形式。
- source_word: בָּנִים
  choice: 儿女
  rationale: 该词字面为“儿子们”，但在此可泛指后代；正文用“儿女”表达婚姻所生的孩子，脚注注明字面形式。
theological_decisions:
- issue: “外族”所表达的界线
  choice: 外族女子
  alternative: 外邦女子／外国女子
  rationale: 译文表达以色列群体之外的身份，不进一步把经文界定为现代国籍、种族概念，也不引入特定宗派对婚姻的解释。
- issue: 末句的难解措辞
  choice: 其中有些妻子还生了儿女
  alternative: 其中有妻子，他们安置了儿子
  rationale: 正文传达语境中最可能的意思，但用脚注明示原文简略难解，避免把解释伪装成毫无歧义的直译。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“娶了外族女子”清楚自然；末句以“还生了儿女”表达上下文中的主要意思，同时用两个脚注保存希伯来文的字面形式及其真实歧义。
