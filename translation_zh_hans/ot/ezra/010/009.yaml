  text: וַ/יִּקָּבְצ֣וּ כָל אַנְשֵֽׁי יְהוּדָה֩ וּ/בִנְיָמִ֨ן יְרוּשָׁלִַ֜ם לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים ה֛וּא חֹ֥דֶשׁ הַ/תְּשִׁיעִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ וַ/יֵּשְׁב֣וּ כָל הָ/עָ֗ם בִּ/רְחוֹב֙ בֵּ֣ית הָ/אֱלֹהִ֔ים מַרְעִידִ֥ים עַל הַ/דָּבָ֖ר וּ/מֵ/הַ/גְּשָׁמִֽים־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/009.yaml
  text: So all the men of Judah and Benjamin gathered in Jerusalem within the three days[a]. It was the ninth month, on the twentieth day of the month. And all the people sat in the open square of the house of God[c][b], trembling because of this matter and because of the heavy rain.
translation:
  language: zh_hans
  text: 于是，犹大和便雅悯所有的男子[b]都在三天之内聚集[a]到耶路撒冷。那时是九月二十日。众人都坐在上帝殿的广场上[c]，因这事，也因雨而发抖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“集合”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“犹大和便雅悯所有的男子”；这里的措辞在语法上为阳性，很可能指奉召参加集会的男性成员或代表。
    reason: lexical_alternative
  - marker: c
    text: 或译“在上帝殿前的广场上”。原文指宽阔的露天空地，不一定是圣殿的内院。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: 聚集
  rationale: 该词为קבץ的尼法勒式，在此表示众人聚拢、集合；“聚集”自然地保留了集体行动的含义。
- source_word: כָל אַנְשֵׁי יְהוּדָה וּבִנְיָמִן
  choice: 犹大和便雅悯所有的男子
  rationale: אַנְשֵׁי在语法和词义上明确为“男子”；上下文所召集的很可能是男性家主或代表，因此不泛化为“所有人”。
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: 在三天之内
  rationale: 此短语承接前文规定的三日期限；“在三天之内”清楚表达按限期到达。
- source_word: הוּא חֹדֶשׁ הַתְּשִׁיעִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: 那时是九月二十日
  rationale: 将希伯来语日期说明合为现代汉语自然、准确的日期表达。
- source_word: וַיֵּשְׁבוּ
  choice: 坐
  rationale: ישׁב在此直接表示坐下或坐着；“坐”简洁对应叙事动作。
- source_word: בִּרְחוֹב בֵּית הָאֱלֹהִים
  choice: 在上帝殿的广场上
  rationale: רְחוֹב指宽阔的露天空地或广场，并不必然是殿的内院；“上帝殿”保留原文“上帝的家”的圣殿所指。
- source_word: מַרְעִידִים
  choice: 发抖
  rationale: 该分词表示身体颤抖；“发抖”既可由所面对的事情引起，也可由雨天寒冷引起，适合原文并列的两个原因。
- source_word: עַל הַדָּבָר
  choice: 因这事
  rationale: הַדָּבָר指上下文正在处理的危机；“这事”在汉语中自然保留其语境指向。
- source_word: וּמֵהַגְּשָׁמִים
  choice: 也因大雨
  rationale: 介词מִן表示发抖的原因；复数גְּשָׁמִים可指一场持续或强烈的雨势，现代汉语以“大雨”自然表达。
