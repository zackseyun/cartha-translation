  text: 'And from the sons of Zattu: Elioenai, Eliashib, Mattaniah, Jeremoth, Zabad, and Aziza.'
translation:
  language: zh_hans
  text: 萨土的子孙中有：以利约乃、以利亚实、玛探雅、耶利末、撒拔和亚西撒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: ……的子孙中有
  rationale: 该短语由连接词、介词和“儿子”的复数附属形组成。在名单和宗族语境中，בנים可泛指后代或族人；译作“子孙”既自然，也避免把所列各人误解为萨土的亲生儿子。连接词的承接作用由本节在名单中的连续位置自然体现。
- source_word: זַתּוּא
  choice: 萨土
  rationale: 专名采用现代中文圣经中较为通行且简明的音译。
- source_word: אֶלְיוֹעֵנַי
  choice: 以利约乃
  rationale: 按希伯来语专名音译，并采用中文圣经中常见的形式。
- source_word: אֶלְיָשִׁיב
  choice: 以利亚实
  rationale: 按希伯来语专名音译，采用通行中文形式。
- source_word: מַתַּנְיָה
  choice: 玛探雅
  rationale: 按希伯来语音译；保留词尾神名成分־יָה所对应的“雅”。
- source_word: וִֽ/ירֵמוֹת
  choice: 耶利末
  rationale: 专名采用通行中文音译；前置连接词在中文列举中不逐项重复。
- source_word: וְ/זָבָד
  choice: 撒拔
  rationale: 按希伯来语专名音译；连接词依中文列举习惯处理。
- source_word: וַ/עֲזִיזָא
  choice: 亚西撒
  rationale: 按希伯来语专名音译；其前连接词在最后一项前译作“和”。
