  text: 'And from the sons of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh.'
translation:
  language: zh_hans
  text: 巴哈摩押的子孙中，有阿底拿、基拉、比拿雅、玛西雅、玛探雅、比撒列、宾内、玛拿西。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: ……的子孙中，有
  rationale: מִן 表示“从……中”，בְּנֵי 在家族名录中指后裔或族人；译作“子孙中，有”既保留谱系结构，也符合现代汉语列名方式。句首连接词 וּ 在连续名录中不必机械译出。
- source_word: פַּחַת מוֹאָב
  choice: 帕哈特·摩押
  rationale: 这是复合家族名，按希伯来语音译；以间隔号标明名称的两个组成部分。
- source_word: עַדְנָא
  choice: 押拿
  rationale: 按希伯来语辅音和读音采用常见中文圣经人名音译。
- source_word: וּ/כְלָל
  choice: 基拉
  rationale: 将专名 כְלָל 音译为“基拉”；前置连接词在中文名单中由顿号关系体现。
- source_word: בְּנָיָה
  choice: 比拿雅
  rationale: 专名按常见中文圣经译名处理，并保留末尾神名成分的传统音译形式。
- source_word: מַעֲשֵׂיָה
  choice: 玛西雅
  rationale: 专名音译，保留末尾 יָה 所对应的传统“雅”形式。
- source_word: מַתַּנְיָה
  choice: 玛探雅
  rationale: 专名音译，并用“雅”呈现末尾神名成分。
- source_word: בְצַלְאֵל
  choice: 比撒列
  rationale: 采用现代中文圣经中通行的专名形式。
- source_word: וּ/בִנּוּי
  choice: 宾内
  rationale: 专名按希伯来语 בִנּוּי 音译；连接词由中文名单标点体现。
- source_word: וּ/מְנַשֶּׁה
  choice: 和玛拿西
  rationale: 采用通行人名“玛拿西”，并将 וּ 译作“和”，明确名单最后一项。
theological_decisions: []
