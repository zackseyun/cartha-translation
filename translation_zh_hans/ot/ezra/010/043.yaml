    reason: 保留希伯来文疑难专名 ידו 的可能异读，并将脚注正确锚定在“雅代”上。
lexical_decisions:
- source_word: מִ/בְּנֵי נְבוֹ
  choice: 尼波的子孙中有
  rationale: 介词מִן与“子孙”连用，在名单中表示从该宗族中列出若干人；译为“……的子孙中有”自然且保留分组功能。
- source_word: נְבוֹ
  choice: 尼波
  rationale: 按现代中文圣经人名、地名音译惯例处理专名。
- source_word: יְעִיאֵל
  choice: 耶利[a]
  rationale: 采用中文圣经中较通行的音译；脚注说明原文名单与所附英文咨询层的脚注标记存在错位。
- source_word: מַתִּתְיָה
  choice: 玛他提雅
  rationale: 按希伯来语音形及中文通行形式音译。
- source_word: זָבָד
  choice: 撒拔
  rationale: 按希伯来语音形及中文通行形式音译。
- source_word: זְבִינָא
  choice: 西比拿
  rationale: 按希伯来语音形音译，保留专名性质。
- source_word: ידו
  choice: 雅代
  rationale: 该辅音形式所代表的专名不确定；正文采用此节常见中文形式“雅代”，并在脚注保留其他可能。
- source_word: וְ/יוֹאֵל
  choice: 约珥和
  rationale: 连词附于“约珥”之前；中文列举习惯将“和”置于末两项之间，不改变名单成员关系。
- source_word: בְּנָיָה
  choice: 比拿雅
  rationale: 采用中文圣经中通行的音译形式。
