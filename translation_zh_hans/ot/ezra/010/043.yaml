  text: 'From the sons of Nebo: Jeiel[a], Mattithiah, Zabad, Zebina, Jaddai, Joel, and Benaiah.'
translation:
  language: zh_hans
  text: 尼波的子孙中有：耶利、玛他提雅、撒拔、西比拿、雅代[a]、约珥和比拿雅。
  philosophy: optimal-equivalence
  footnotes:
