base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/023.yaml
  text: 'And from the Levites: Jozabad[a], Shimei, Keliah (that is, Kelita), Pethahiah, Judah, and Eliezer.'
translation:
  language: zh_hans
  text: 利未人中有：约撒拔、示每、基拉雅（就是基利他）[a]、毗他希雅、犹大和以利以谢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“基拉雅，他就是基利他。”这表明“基利他”是同一人的另一个名字或名字的另一种形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: 利未人中有
  rationale: מִן 表示从这一群体中列举若干人；译为“利未人中有”既保留部分关系，也符合现代汉语名单引介方式。
- source_word: יוֹזָבָד
  choice: 约撒拔
  rationale: 按中文圣经人名的通行音译处理。
- source_word: וְשִׁמְעִי
  choice: 示每
  rationale: 采用中文圣经中该希伯来人名的通行译名。
- source_word: וְקֵלָיָה הוּא קְלִיטָא
  choice: 基拉雅（就是基利他）
  rationale: הוּא 在此作同位解释，将“基利他”认定为同一人的另一名称或名称形式；“就是”保留原文直接的认定语气，不额外推断其具体关系。
- source_word: פְּתַחְיָה
  choice: 毗他希雅
  rationale: 采用中文圣经中该人名的通行音译。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 上下文表明这里指个人；采用通行人名译法。
- source_word: וֶאֱלִיעֶזֶר
  choice: 和以利以谢
  rationale: 该名称为 אֱלִיעֶזֶר，对应“以利以谢”；以“和”自然标示名单末项。
theological_decisions: []
