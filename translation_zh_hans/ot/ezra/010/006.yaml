  source_fidelity: 译文总体准确传达了行动、禁食和哀悼的因由。不过，הַגּוֹלָה是集合性称谓，指流亡／归回的群体，不宜主要译为个体性的“被掳归回之人”。此外，原文仅作“去那里”；“到了那里”是可接受的汉语顺译，未额外断言进入或停留。
  naturalness: “从上帝的殿前起身”“房间”“不吃饼，也不喝水”“正为……哀悼”均属自然、庄重的现代汉语。将集合名词改为“流亡归回的群体”可使指称更准确顺畅。
  terminology: “上帝的殿”恰当；“约哈难”和“以利亚实”为可接受的人名音译。“背信”比日常语中的“不忠”更能体现מַעַל所含的严重失信、违约意味，但不将其限定为某一教派性的术语。
