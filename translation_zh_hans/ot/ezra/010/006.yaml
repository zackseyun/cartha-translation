id: EZR.10.6
reference: Ezra 10:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּ֣קָם עֶזְרָ֗א מִ/לִּ/פְנֵי֙ בֵּ֣ית הָֽ/אֱלֹהִ֔ים וַ/יֵּ֕לֶךְ אֶל לִשְׁכַּ֖ת יְהוֹחָנָ֣ן בֶּן אֶלְיָשִׁ֑יב וַ/יֵּ֣לֶךְ שָׁ֗ם לֶ֤חֶם לֹֽא אָכַל֙ וּ/מַ֣יִם לֹֽא שָׁתָ֔ה כִּ֥י מִתְאַבֵּ֖ל עַל מַ֥עַל הַ/גּוֹלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/006.yaml
  text: Then Ezra rose from before the house of God and went to the chamber of Jehohanan son of Eliashib[a]. He went there and ate no bread and drank no water[c][b], because he was mourning over the unfaithfulness of the exiles.
translation:
  language: zh_hans
  text: 以斯拉从上帝的殿前起身，往以利亚实的儿子约哈难[a]的房间去。他到了那里，不吃饼，也不喝水，因为他正为流亡归回的群体[c]的背信[b]而哀悼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约哈难”也可音译作“耶何哈难”。
    reason: 人名音译存在可接受的不同形式；正文采用较自然简洁的现代汉语形式。
  - marker: b
    text: “背信”也可译作“不忠”或“失信”。
    reason: מַעַל含有严重违背信义、尤其违背圣约的意味。
  - marker: c
    text: 原文称这一群体为“被掳群体”或“流亡群体”；在以斯拉记的语境中，指从被掳之地归回的群体。
    reason: 说明该集合性称谓的历史语境，以及正文“归回”的解释性表达。
lexical_decisions:
- source_word: מִלִּפְנֵי בֵּית הָאֱלֹהִים
  choice: 从上帝的殿前
  rationale: 保留“从……前”的空间表达；בֵּית הָאֱלֹהִים在此明确指圣殿，译作“上帝的殿”既贴近原文“上帝之家”，也符合现代汉语。
- source_word: לִשְׁכַּת
  choice: 房间
  rationale: 该词指圣殿或公共建筑群中的房室；“房间”自然清楚，又不把用途说得过于具体。
- source_word: יְהוֹחָנָן בֶּן אֶלְיָשִׁיב
  choice: 以利亚实的儿子约哈难
  rationale: 按希伯来语形式音译人名，并依汉语习惯表达父子关系。
- source_word: וַיֵּלֶךְ שָׁם
  choice: 他到了那里
  rationale: 原文重复“去”且语气略显突兀；“到了那里”保留地点推进，不擅自解释为进入或住宿。
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: 不吃饼，也不喝水
  rationale: 保留“饼”和“水”两个明确宾语以及禁食公式的具体性。
- source_word: מִתְאַבֵּל
  choice: 哀恸
  rationale: 该分词表示持续处于哀悼、悲痛之中；“正……哀恸”传达持续状态及庄重语气。
- source_word: מַעַל
  choice: 不忠
  rationale: 该词在这里指对上帝及圣约的背信；“不忠”简明而保留关系性和圣约性分量。
- source_word: הַגּוֹלָה
  choice: 被掳归回之人
  rationale: 该词可指被掳者或被掳群体；本书语境是已归回的被掳群体，正文适度明示，以免误解他们仍在异地。
theological_decisions:
- issue: מַעַל在圣约违背语境中的译法
  choice: 不忠
  alternative: 背信；失信；罪责
  rationale: “不忠”保留对上帝和圣约失信的神学重量，同时不把词义缩窄为纯法律上的罪责；脚注列出较强的可选译法。
- issue: בֵּית הָאֱלֹהִים应保留字面“上帝的家”还是按所指译为圣殿
  choice: 上帝的殿
  alternative: 上帝的家；上帝的圣殿
  rationale: 此处所指明确为圣殿建筑。“上帝的殿”既保留“上帝的”这一原文结构，也比现代汉语中的“上帝的家”更准确自然。
- issue: הַגּוֹלָה所指群体是否在正文中明示为归回者
  choice: 被掳归回之人
  alternative: 被掳的人；被掳群体
  rationale: 以斯拉记的历史语境表明这是归回后的群体；明示“归回”帮助普通读者识别所指，但脚注说明原词本身较简略。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不吃饼，也不喝水”保留希伯来语禁食表达的具体形式；“正……哀恸”表现原文分词的持续状态。所有脚注标记均置于相关正文词语之后。
