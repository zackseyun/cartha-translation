  to: 以斯拉从上帝的殿前起身，往以利亚实的儿子约哈难[a]的房间去。他到了那里，不吃饼，也不喝水，因为他正为流亡归回的群体[c]的背信[b]而哀悼。
  rationale: 修订将群体称谓由个体性的“被掳归回之人”改为“流亡归回的群体”，更贴近הַגּוֹלָה的集合意义；以“背信”更充分表达מַעַל的语义力度；并将文化说明脚注[c]移至它实际注释的群体称谓后。其余措辞保持原译的忠实性、庄重语体和现代汉语可读性。
