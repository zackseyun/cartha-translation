  yaml_path: translation/ot/ezra/010/004.yaml
  text: Rise up[a], for this matter is on you, and we are with you. Be strong and do it.
translation:
  language: zh_hans
  text: 起来吧，因为这事由你负责[a]；我们支持你。你要刚强，去做吧！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这事落在你身上”，也就是“这责任在你”。希伯来语习语表明，处理此事的职责由以斯拉承担。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: 起来吧
  rationale: 命令式呼吁以斯拉立即行动；“起来吧”自然、直接，也保留了劝勉的力度。
- source_word: כִּי
  choice: 因为
  rationale: 引出应当起来行动的理由，现代汉语中“因为”清楚自然。
- source_word: עָלֶיךָ הַדָּבָר
  choice: 这事由你负责
  rationale: על加人称代词的表达说明此事的责任或职责落在以斯拉身上；译文传达该希伯来语习语的实际含义。
- source_word: וַאֲנַחְנוּ עִמָּךְ
  choice: 我们也支持你
  rationale: 这里的“与你同在”表达共同承担和支持；“支持你”在现代汉语中较自然，并契合语境。
- source_word: חֲזַק
  choice: 你要刚强
  rationale: 保留חזק关于力量和坚定的直接劝勉，不将其仅限于情绪上的勇气。
- source_word: וַעֲשֵׂה
  choice: 采取行动
  rationale: 命令式要求把所议之事付诸实行；“采取行动”自然表达省略宾语的עשה，同时避免生硬的“做吧”。
theological_decisions: []
