lexical_decisions:
- source_word: מַתַּנְיָה
  choice: 玛他尼雅
  rationale: 这是人名 Mattanyah，按希伯来语音译；保留词尾 -yah，以区别于下一人名。
- source_word: מַתְּנַי
  choice: 玛特乃
  rationale: 这是人名 Mattenai，采用贴近希伯来语读音、又适合现代汉语圣经人名风格的音译。
- source_word: ו/יעשו
  choice: 和雅阿苏
  rationale: ו 表示“和”；在本节人名名单的语境中，יעשו 应作人名理解。按马所拉文本的读音音译为“雅阿苏”，不把它误译成动词“他们要做”。
