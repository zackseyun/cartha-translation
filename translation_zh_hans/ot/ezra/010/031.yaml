  text: 'And from the sons of Harim: Eliezer[a], Isshijah, Malkijah, Shemaiah[c][b], and Shimeon.'
translation:
  language: zh_hans
  text: 哈琳的子孙中有：以利以谢、伊示雅、玛基雅、示玛雅和西缅。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈琳的子孙中有”也可译作“哈琳的子孙是”，将这句话视为单纯的名单标题。末名“西缅”若更贴近希伯来语读音，也可译作“示缅”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: ……的子孙中有
  rationale: 在以斯拉记第10章的名单语境中，这一结构引出某宗族中被点名的人；译作“子孙中有”自然表达名单所隐含的选取关系。希伯来语连接词 וּ 的承接作用由上下文和本句列表格式体现，不生硬另译“又”。
- source_word: חָרִם
  choice: 哈琳
  rationale: 按现代中文圣经人名的通行形式音译该家族名。
- source_word: אֱלִיעֶזֶר
  choice: 以利以谢
  rationale: 采用现代中文圣经中较通行且易辨认的人名译法。
- source_word: יִשִּׁיָּה
  choice: 伊示雅
  rationale: 依马所拉文本的读音音译，尽量反映其辅音和元音形式；不同传统可能采用略有差异的中文音译。
- source_word: מַלְכִּיָּה
  choice: 玛基雅
  rationale: 按希伯来语读音音译，并采用自然的现代中文人名形式。
- source_word: שְׁמַעְיָה
  choice: 示玛雅
  rationale: 采用中文圣经中容易识别的常见音译形式。
- source_word: שִׁמְעוֹן
  choice: 西缅
  rationale: 采用中文圣经传统中广为人知的固定译名；其希伯来语读音也可更直接音译为“示缅”。
