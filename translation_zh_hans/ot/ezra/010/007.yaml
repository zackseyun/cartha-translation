  yaml_path: translation/ot/ezra/010/007.yaml
  text: And they made a proclamation throughout Judah and Jerusalem to all the sons of the exile[a], that they should gather in Jerusalem.
translation:
  language: zh_hans
  text: 他们在犹大和耶路撒冷各处发布通告，召集所有被掳归回的人[a]到耶路撒冷聚集。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有被掳的人”或“所有归回的被掳者”。原文直译为“所有被掳之子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: 发布通告
  rationale: 希伯来语使役式动词 עבר 与 קוֹל 连用，是使消息传遍、公开发布通告的习语；“发布通告”自然体现正式而公开的行政语境。
- source_word: בִּיהוּדָה וִירוּשָׁלַם
  choice: 在犹大和耶路撒冷各处
  rationale: 介词 ב 标示通告传布的地域范围；“各处”表达消息遍及两地的分布意味。
- source_word: לְכֹל בְּנֵי הַגּוֹלָה
  choice: 所有被掳归回的人
  rationale: 字面为“所有被掳之子”，是指曾被掳而现已归回的群体。中文若直译“被掳之子”容易被误解为其后代或仅指男性，因此正文采用符合本书历史语境的群体称谓，并以脚注保留字面形式及语义范围。
- source_word: לְהִקָּבֵץ
  choice: 聚集
  rationale: 尼法勒式不定词在这里表达通告的内容或目的，即召集众人集合。
- source_word: יְרוּשָׁלָם
  choice: 到耶路撒冷
  rationale: 虽无方向词尾，但在“聚集”这一移动、集合语境中，中文自然表达为“到耶路撒冷”。
