base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/005.yaml
  text: So Ezra arose and made the chief priests[a], the Levites, and all Israel swear to do according to this word, and they swore.
translation:
  language: zh_hans
  text: 以斯拉就起来，叫祭司中的首领、利未人和以色列众人起誓，要照这话[a]去做；他们就起了誓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“照这事”或“照这个提议”。希伯来语“话”也可指正在商议的事情。
    reason: 保留דָּבָר在“话语”“事情”和“提议”之间的词义范围。
lexical_decisions:
- source_word: וַיָּקָם
  choice: 就起来
  rationale: קום的叙事性连续形式表示以斯拉随即起身采取行动；“起来”自然、庄重，也保留原文的叙事推进。
- source_word: וַיַּשְׁבַּע
  choice: 叫……起誓
  rationale: שׁבע的使役式表示使人起誓；“叫……起誓”清楚保留使役含义。
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: 祭司中的首领
  rationale: 直译为祭司的首领，指祭司群体中的领导人物；此译避免让现代读者误以为是后期固定称号“祭司长”。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是לְוִיִּם在现代中文圣经语境中的标准译法。
- source_word: וְכָל יִשְׂרָאֵל
  choice: 和以色列众人
  rationale: 保留“以色列”作为整体群体的表达，同时以“众人”使现代中文读者自然理解其集合意义。
- source_word: לַעֲשׂוֹת
  choice: 去做
  rationale: 忠实表达עשה在本句中实行、遵行所议之事的宽泛含义，并符合现代汉语习惯。
- source_word: כַּדָּבָר הַזֶּה
  choice: 照这话
  rationale: דָּבָר既可指说出的话，也可指所谈的事情或提议；“这话”贴近字面，并用脚注保留语义范围。
- source_word: וַיִּשָּׁבֵעוּ
  choice: 他们就起了誓
  rationale: 保留原文对שׁבע的重复，明确交代众人实际起誓，也维持场景的郑重感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“祭司中的首领”比“祭司长”更直接体现原文的复数领袖结构，并避免引入可能属于后期制度化称谓的联想。脚注标记置于“这话”之后，与其所解释的希伯来词对应。
