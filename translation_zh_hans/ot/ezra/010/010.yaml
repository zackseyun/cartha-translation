base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/010.yaml
  text: Then Ezra the priest stood up and said to them[a], “You have acted unfaithfully and have taken foreign women as wives, adding to the guilt of Israel.”
translation:
  language: zh_hans
  text: 于是，祭司以斯拉站起来，对他们说：“你们行事不忠，娶了外族女子[a]为妻，增添了以色列的罪责。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“外族女子”；本章语境表明，这里指娶她们为妻。
    reason: 说明נָשִׁים נָכְרִיּוֹת的字面表达及其婚姻语境，保留词义上的可能范围。
lexical_decisions:
- source_word: וַיָּקָם
  choice: 站起来
  rationale: 此处指以斯拉在会众面前起身发言；“站起来”自然地保留了公开行动的具体含义。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 作为同位称号，直接说明以斯拉的身份。
- source_word: מְעַלְתֶּם
  choice: 行事不忠
  rationale: מעל常指背信或不忠，尤其带有群体与盟约层面的意味；此译既保留其道德分量，也避免加入原文未明说的专门术语。
- source_word: וַתֹּשִׁיבוּ
  choice: 娶了……为妻
  rationale: 该词是ישב的使役形，字面有“使居住”之意；结合本章婚姻语境，指把这些女子接入家中为妻。“娶了……为妻”在现代汉语中清楚自然。
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: 外族女子
  rationale: נָשִׁים可指“女子”或“妻子”，נָכְרִיּוֹת指外来的、异族的。正文以“女子”为词汇主体，并由“娶……为妻”说明婚姻关系，从而保留原文措辞及语境含义。
- source_word: לְהוֹסִיף
  choice: 增添了
  rationale: 不定式表示前述行为带来的结果；“增添了”简洁保留罪责有所增加的含义。
- source_word: אַשְׁמַת
  choice: 罪责
  rationale: 此处指犯罪所招致的责任或罪咎，而非赎愆祭。“罪责”兼顾有罪状态与应负责任。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 指作为整体的以色列群体，保留原文的集体指向。
theological_decisions:
- issue: 以色列群体共同承担的罪责
  choice: 增添了以色列的罪责
  alternative: 使以色列更加有罪
  rationale: 原文把这些人的行为描述为增加整个以色列群体的אַשְׁמָה；所选译法保留这种共同体层面的罪责，同时不扩展原文的神学表述。
- issue: מעל的关系性与盟约性意味
  choice: 行事不忠
  alternative: 犯了罪／背约
  rationale: “行事不忠”保留背信的关系性含义，却不把原文明确限定为某一特定的盟约公式；这样既传达语义力度，也保留原文表达的宽度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行事不忠”传达背信意味；“娶了外族女子为妻”明确本章的婚姻语境，同时用脚注交代希伯来文的字面措辞。
