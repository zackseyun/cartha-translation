base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/012.yaml
  text: Then all the assembly answered and said with a loud voice[a], “Yes, according to your words, so it is upon us to do.”
translation:
  language: zh_hans
  text: 全体会众都大声回答说：“是的，我们有责任照你的话去做。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是的，正如你所说的，我们必须这样做。”
    reason: 提供较为意译的表达，说明כִדְבָרֶיךָ עָלֵינוּ לַעֲשׂוֹת可自然理解为会众承认自己必须按所说的实行。
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: 回答
  rationale: ענה在此引出会众对以斯拉劝告的回应；“回答”准确而自然。
- source_word: כָל הַקָּהָל
  choice: 全体会众
  rationale: קָהָל指聚集起来的群体；“会众”保留共同聚集的含义，“全体”直接体现כָל。
- source_word: וַיֹּאמְרוּ
  choice: 说
  rationale: אמר是普通的言说动词；与“回答”连用，译为“回答说”符合现代汉语叙事习惯。
- source_word: קוֹל גָּדוֹל
  choice: 大声
  rationale: 原文直译为“用很大的声音”；“大声”简洁自然，也传达公开而强烈的共同回应。
- source_word: כֵּן
  choice: 是的
  rationale: 此处表示对前述要求的肯定与赞同；“是的”最自然地表达直接应允。
- source_word: כִדְבָרֶיךָ
  choice: 照你的话
  rationale: 原文为“按照你的话语”；“照你的话”既贴近原文，也符合现代汉语表达。
- source_word: עָלֵינוּ
  choice: 我们有责任
  rationale: 字面为“在我们身上”，在此表示责任或义务落在说话者身上；“我们有责任”清楚传达其语用含义。
- source_word: לַעֲשׂוֹת
  choice: 去做
  rationale: עשה含义宽泛，在这里指实行刚才所要求的事；“去做”保留原文的简洁。
theological_decisions:
- issue: עָלֵינוּ所表达的义务强度
  choice: 我们有责任
  alternative: 这是我们必须做的
  rationale: 原文表达责任落在会众身上，但并未使用独立的“必须”动词；“有责任”既传达义务，也避免无根据地加强语气。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“全体会众”保留集体聚集的语境；“大声回答说”自然整合希伯来语连续的“回答、说”结构。脚注标记置于其所解释的整句回应之后。
