base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/025.yaml
  text: 'And from Israel[a], from the sons of Parosh: Ramiah, Izziah, Malkijah, Mijamin, Eleazar, Malkijah, and Benaiah.'
translation:
  language: zh_hans
  text: 以色列人中，巴录的子孙有：拉米雅、伊西亚、玛基雅、米雅民、以利亚撒、玛基雅[a]和比拿雅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文在这份名单中两次列出“玛基雅”，很可能是两个同名的人。
    reason: 说明原文重复同一名字，避免读者误以为是抄写或排版错误；标记置于第二次“玛基雅”后，以准确对应注释内容。
lexical_decisions:
- source_word: וּמִֽיִּשְׂרָאֵל
  choice: 以色列人中
  rationale: 介词מִן在名单语境中引出群体中的一部分；译作“以色列人中”符合现代汉语，也承接前文所列人员。句首的וּ是连续名单的连接成分，中文分节后无需生硬译出“又”。
- source_word: מִבְּנֵי
  choice: ……的子孙有
  rationale: בְּנֵי字面为“儿子们”，在宗族名单中可指后代或家族成员；“子孙”既保留宗谱色彩，又避免误解为全是某人的亲生儿子。
- source_word: פַרְעֹשׁ
  choice: 巴录
  rationale: 采用现代中文圣经人名的通行译名，以便读者辨认该家族；此名为音译。
- source_word: רַמְיָה
  choice: 拉米雅
  rationale: 按希伯来语形式音译，保留词尾-yah的“雅”。
- source_word: יִזִּיָּה
  choice: 伊西雅
  rationale: 按希伯来语读音作自然的中文音译。
- source_word: מַלְכִּיָּה
  choice: 玛基雅
  rationale: 按希伯来语形式音译；原文在本节出现两次，因此两处均保留。
- source_word: מִיָּמִן
  choice: 米雅民
  rationale: 按希伯来语形式音译，并采用适合现代普通话的音节。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用中文圣经中此人名的通行译法。
- source_word: בְנָיָה
  choice: 比拿雅
  rationale: 采用中文圣经中此人名的通行音译。
