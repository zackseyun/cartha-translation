  naturalness: 用语总体庄重自然；将原文恢复为一个以冒号引出名单的句子后，层级关系更清晰，也避免“查出有……的”单独成句的不完整感。
  terminology: “外族女子”“娶……为妻”“祭司的子孙”适合此处古代谱系和婚姻语境；人名音译与常见中文圣经用法相符。“他的弟兄”保留原文代词的指向及“弟兄”本义，不扩展为“亲族”。
  issues:
