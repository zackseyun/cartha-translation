base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/018.yaml
  text: 'And among the sons of the priests who had taken foreign wives[a], there were found from the sons of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.'
translation:
  language: zh_hans
  text: 在祭司的子孙中，查出娶外族女子为妻的：约萨达的儿子耶书亚的子孙和他的弟兄中有玛西雅、以利以谢、雅立和基大利。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמָּצֵא
  choice: 查出有
  rationale: 希伯来语动词为单数，却引出多人名单，具有集合性。译作“查出有”既保留调查后发现的意味，也自然适用于后面的复数人名。
- source_word: מִבְּנֵי הַכֹּהֲנִים
  choice: 在祭司的子孙中
  rationale: בְּנֵי 字面为“儿子们”，在谱系语境中可指后裔或宗族成员；“子孙”在现代汉语中自然地表达祭司家系。
- source_word: אֲשֶׁר הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  choice: 有娶外族女子为妻的
  rationale: 该表达在本章语境中指与非以色列女子建立婚姻关系。“娶……为妻”清楚传达婚姻含义；“外族”比现代政治意义较强的“外国”更适合古代族群语境。
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: 外族女子
  rationale: 保留名词本身的“女子”含义，并由“娶……为妻”明确其婚姻身份，避免把解释直接取代原词。
- source_word: מִבְּנֵי יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: 在约萨达的儿子耶书亚的子孙中
  rationale: 重复的 מִבְּנֵי 标明祭司群体中的具体家系。“子孙”表达谱系群体，“约萨达的儿子耶书亚”保留原文父子关系。
- source_word: וְאֶחָיו
  choice: 和他的弟兄
  rationale: 直译为“他的弟兄”，代词回指耶书亚；不擅自扩大为泛指亲族。
- source_word: מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה
  choice: 玛西雅、以利以谢、雅立和基大利
  rationale: 按圣经人名的常用简体中文音译处理，并保留名单次序。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。将原文较长的名单句分为两句，以免“祭司的子孙—耶书亚的子孙—具体人名”三层结构产生歧义；不改变各层从属关系。
