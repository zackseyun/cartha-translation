  yaml_path: translation/ot/ezra/010/020.yaml
  text: 'And from the sons of Immer: Hanani and Zebadiah.'
translation:
  language: zh_hans
  text: 以默的子孙中，有哈拿尼和西巴第雅。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: ……的子孙中，有
  rationale: וּמִבְּנֵי在名单中引出另一个家族组别。中文用“……的子孙中，有”既自然地承接上下文，也保留בְּנֵי的宗族、后裔含义；不机械译作“儿子”，以免误示这些人必为以默的亲生儿子。
- source_word: אִמֵּר
  choice: 以默
  rationale: 祭司家族名，采用现代中文圣经人名中常见且简洁的音译。
- source_word: חֲנָנִי
  choice: 哈拿尼
  rationale: 专有名词按希伯来语读音音译，并采用通行中文形式。
- source_word: וּ/זְבַדְיָה
  choice: 和西巴第雅
  rationale: 前缀连词וּ连接名单中的最后一人，译作“和”；人名采用通行中文音译“西巴第雅”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的名单体。以“子孙中，有”表达家族归属，使现代普通读者易懂，同时不把宗族关系缩窄为直接父子关系。
