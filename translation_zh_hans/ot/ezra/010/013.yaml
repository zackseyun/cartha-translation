  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲבָ֞ל הָ/עָ֥ם רָב֙ וְ/הָ/עֵ֣ת גְּשָׁמִ֔ים וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמ֣וֹד בַּ/ח֑וּץ וְ/הַ/מְּלָאכָ֗ה לֹֽא לְ/י֤וֹם אֶחָד֙ וְ/לֹ֣א לִ/שְׁנַ֔יִם כִּֽי הִרְבִּ֥ינוּ לִ/פְשֹׁ֖עַ בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/013.yaml
  text: But the people are many[a], and it is the rainy season, and there is no strength to stand outside. And the work is not for one day or for two[c][b], for we have greatly transgressed in this matter.
translation:
  language: zh_hans
  text: 但百姓人数众多，正值雨季[a]，无法站在外面。这事也不是一两天能办完的[b]，因为我们在这件事上大大干犯了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“这时是降雨之时”。
    reason: lexical_alternative
  - marker: b
    text: 直译“这事不是一天，也不是两天的”。
    reason: lexical_alternative
  - marker: c
    text: 或译“因为我们在这件事上的过犯很多”；也可译“因为我们在这件事上大大犯罪了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: 但
  rationale: 承接上一节的提议并引出实际困难；“但”简洁自然，准确表达转折。
- source_word: הָעָם רָב
  choice: 百姓人数众多
  rationale: 保留עָם的群体含义和רָב的数量意义；比“人群很大”更符合此处会众的语境。
- source_word: וְהָעֵת גְּשָׁמִים
  choice: 现在又是雨季
  rationale: 希伯来文直译为“这时是降雨之时”；“雨季”是现代汉语自然、准确的表达，“又”连接并列困难。
- source_word: וְאֵין כֹּחַ לַעֲמֹד בַּחוּץ
  choice: 没有力气站在外面
  rationale: 保留原文“没有力量”的非人称结构；“站在外面”在上下文中含有冒雨停留之意。
- source_word: וְהַמְּלָאכָה
  choice: 这事
  rationale: 此处指调查并处理问题的事务，而非体力劳动；“这事”在中文中自然地承接上下文。
- source_word: לֹא לְיוֹם אֶחָד וְלֹא לִשְׁנַיִם
  choice: 不是一两天能办完的
  rationale: 以自然汉语表达原文“不是一天，也不是两天”的持续时间含义，即此事无法迅速完成。
- source_word: כִּי הִרְבִּינוּ לִפְשֹׁעַ
  choice: 因为我们……大大干犯了
  rationale: 将הִרְבִּינוּ理解为加强后接不定式的程度，表达严重且反复的过犯；“干犯”保留פָּשַׁע所含的违背、冒犯色彩。
- source_word: בַּדָּבָר הַזֶּה
  choice: 在这件事上
  rationale: 自然表达דָּבָר在本语境中所指的具体事件或问题。
theological_decisions:
- issue: לִפְשֹׁעַ所描述的过犯性质
  choice: 译为“干犯”，不进一步限定其教义类别
  alternative: 犯罪；悖逆
  rationale: פָּשַׁע具有严重违背乃至悖逆的意味，但本节没有完整界定其神学分类；“干犯”既保留严重性，也避免过度解释。
- issue: הִרְבִּינוּ לִפְשֹׁעַ的范围与程度
  choice: 理解为“我们大大干犯了”
  alternative: 我们许多人犯了罪；我们在这事上的过犯很多
  rationale: 使役形态的רבה接不定式可表示行为程度或次数增加；正文采用程度性译法，同时以脚注保留数量性理解的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不是一两天能办完的”避免生硬直译；“大大干犯了”略带经文庄重感，并保留原文对过犯严重程度的强调。
