base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/002.yaml
  text: Then Shecaniah son of Jehiel[a], from the sons of Elam, answered and said to Ezra, “We have acted unfaithfully against our God and have married foreign women from the peoples of the land[c][b]. Yet now there is hope for Israel concerning this.
translation:
  language: zh_hans
  text: 以拦子孙中的耶歇的儿子示迦尼回答以斯拉说：“我们对我们的上帝不忠，娶了这地各族中的外族女子为妻。不过如今，以色列在这事上有盼望。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: 保留希伯来叙事中回应前情的常用表达；中文无需再叠加“说”来表达该动词本身。
- source_word: שְׁכַנְיָה בֶן יְחִיאֵל
  choice: 耶歇的儿子示迦尼
  rationale: 按中文圣经人名音译习惯处理专名，并明确保留父子关系。
- source_word: מִבְּנֵי עולם
  choice: 以拦子孙中
  rationale: 此处 עולם 按马所拉文本语境理解为专名“以拦”，整句表示宗族归属。
- source_word: מָעַלְנוּ בֵאלֹהֵינוּ
  choice: 我们对我们的上帝不忠
  rationale: מעל 表示失信、背信，尤可指对上帝的忠诚遭到破坏；“不忠”比笼统的“犯罪”更能保留其关系性和盟约色彩。
- source_word: וַנֹּשֶׁב נָשִׁים נָכְרִיּוֹת
  choice: 娶了外族女子为妻
  rationale: 该动词在本语境中指娶妻；“外族女子”直接表达 נָשִׁים נָכְרִיּוֹת，同时“为妻”使中文婚姻含义明确。
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: 这地各族中的
  rationale: 保留 עַמֵּי 的复数群体意义，并将定冠词所指的土地自然译为“这地”。
- source_word: וְעַתָּה
  choice: 不过如今
  rationale: 表现从承认不忠转向仍有希望的语意转折，同时保持庄重自然。
- source_word: יֵשׁ מִקְוֶה לְיִשְׂרָאֵל עַל זֹאת
  choice: 就这事而言，以色列仍有希望
  rationale: “有希望”准确表达 מִקְוֶה；עַל זֹאת 可理解为“关于这事”，译作“就这事而言”以保留其所指范围，避免扩展为“尽管如此”。
theological_decisions:
- issue: מָעַלְנוּ 的盟约性含义
  choice: 译为“对我们的上帝不忠”
  alternative: “得罪了我们的上帝”或“向我们的上帝犯了罪”
  rationale: “不忠”保留背信与破坏忠诚关系的分量，又不额外引入特定宗派术语。
- issue: נָשִׁים נָכְרִיּוֹת 的身份表述
  choice: 译为“外族女子”
  alternative: “外邦女子”或“外国女子”
  rationale: 原文强调她们来自当地其他族群；“外族”较能表达族群与共同体界线，也避免把古代身份简单现代化为国籍。
- issue: עַל זֹאת 与希望的关系
  choice: 译为“就这事而言”
  alternative: “尽管如此”或“在这事上”
  rationale: 希伯来语可指“关于此事／在此事上”；正文不将其明确解释成让步关系，以保留原文的开放性。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。保留“回答……说”的希伯来叙事句式但作适度汉语化；专名采用中文圣经传统常见形式。
