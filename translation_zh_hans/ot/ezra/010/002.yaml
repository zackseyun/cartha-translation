  terminology: “不忠”恰当保留 מָעַלְנוּ 的失信／背约意味；“外族女子”及“这地各族”适切反映原文的族群表述，不应现代化为国籍概念。人名“以拦、耶歇、示迦尼、以斯拉”可沿用现有传统译名。
