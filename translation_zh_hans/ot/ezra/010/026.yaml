  text: 'And from the sons of Elam: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah.'
translation:
  language: zh_hans
  text: 以拦的子孙中有玛他尼、撒迦利亚、耶歇、押底、耶利末和以利亚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: ……的子孙中有
  rationale: 该短语由连词、介词和בֵּן的复数构词形式组成。在宗族名单中表示属于某家族的人；现代汉语用“子孙中有”既保留谱系含义，也比直译“儿子们中”自然。
- source_word: עֵילָם
  choice: 以拦
  rationale: 此处是家族先祖或宗族名称，采用中文圣经中通行的音译。
- source_word: מַתַּנְיָה
  choice: 玛他尼
  rationale: 希伯来人名，按现代中文圣经常见形式音译。
- source_word: זְכַרְיָה
  choice: 撒迦利亚
  rationale: 希伯来人名，采用中文圣经中通行且易识别的译名。
- source_word: וִ/יחִיאֵל
  choice: 耶歇
  rationale: 希伯来人名；前置连词在中文列举结构中不逐一译出。采用通行中文音译。
- source_word: וְ/עַבְדִּי
  choice: 押底
  rationale: 名单结构表明这是人名，而不是普通名词“我的仆人”；采用通行中文音译。
- source_word: וִ/ירֵמוֹת
  choice: 耶利末
  rationale: 希伯来人名，采用中文圣经中常见的音译形式。
- source_word: וְ/אֵלִיָּה
  choice: 以利亚
  rationale: 希伯来人名，采用中文圣经中通行且广为人知的译名。
