base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/029.yaml
  text: 'And from the sons of Bani: Meshullam[a], Malluk, Adaiah, Jashub, Sheal[b], and Jeremoth.'
translation:
  language: zh_hans
  text: 巴尼的子孙中有：米书兰、玛鹿、亚大雅、雅述、示押和耶利末。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶利末”所对应的希伯来文在这里没有标注元音，也可按另一种人名形式读作“拉末”。
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי בָּנִי
  choice: 巴尼的子孙中有
  rationale: 介词 מִן 表示从该宗族成员之中列举若干人；在族谱名单语境中，“子孙”比仅指亲生儿子的“儿子”更自然，同时保留宗族用语。
- source_word: מְשֻׁלָּם
  choice: 米书兰
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: מַלּוּךְ
  choice: 玛鹿
  rationale: 按马所拉读音音译为 Malluk；末尾 כ 在此为清擦音，中文以约定俗成的人名形式表达。
- source_word: וַ/עֲדָיָה
  choice: 亚大雅
  rationale: 连词与人名相连；中文名单用顿号处理并列关系，人名按希伯来语音译。
- source_word: יָשׁוּב
  choice: 雅述
  rationale: 按马所拉标音的专名 Yāšûḇ 音译，不按其词源意义翻译。
- source_word: וּ/שְׁאָל
  choice: 示押
  rationale: 按马所拉标音 Šəʾāl 音译；前置连词在中文并列名单中由顿号及末项前的“和”体现。
- source_word: ירמות
  choice: 耶利末
  rationale: 依据本节名单传统将该辅音形式识别为人名 Jeremoth，并采用中文常见译名；其无元音拼写可能容许不同读法，故加注说明。
theological_decisions: []
translation_notes:
  register: 采用庄重而简洁的现代标准汉语名单体。“巴尼的子孙中有”自然呈现希伯来文“从巴尼的众子中”的筛选关系；人名之间用顿号，末项前用“和”。未沿用英文咨询层中把玛鹿异拼信息误系于米书兰的脚注标记，而是按希伯来文本证据仅为末一人名保留确有意义的读法说明。
