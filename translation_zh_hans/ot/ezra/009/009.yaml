source:
  edition: WLC
  text: כִּֽי עֲבָדִ֣ים אֲנַ֔חְנוּ וּ/בְ/עַבְדֻ֔תֵ/נוּ לֹ֥א עֲזָבָ֖/נוּ אֱלֹהֵ֑י/נוּ וַֽ/יַּט עָלֵ֣י/נוּ חֶ֡סֶד לִ/פְנֵי֩ מַלְכֵ֨י פָרַ֜ס לָֽ/תֶת לָ֣/נוּ מִֽחְיָ֗ה לְ/רוֹמֵ֞ם אֶת בֵּ֤ית אֱלֹהֵ֨י/נוּ֙ וּ/לְ/הַעֲמִ֣יד אֶת חָרְבֹתָ֔י/ו וְ/לָֽ/תֶת לָ֣/נוּ גָדֵ֔ר בִּֽ/יהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/009.yaml
  text: For we are slaves[a]; yet in our slavery our God has not forsaken us, but has extended covenant faithfulness to us before the kings of Persia, to give us reviving, to raise up the house of our God, to set up its ruins[b], and to give us a wall in Judah and in Jerusalem.
translation:
  language: zh_hans
  text: 因为我们是奴隶；但在我们受奴役的时候，我们的神没有离弃我们，反而在波斯诸王面前向我们施以忠贞的慈爱[a]，使我们得以复苏，重建我们神的殿，修复它的废墟，并在犹大和耶路撒冷赐给我们一道屏障[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠贞的慈爱”也可译作“坚定的爱”“恩慈”或“恩惠”。希伯来语 חֶסֶד 表达带有忠诚和恩典的持久慈爱。
    reason: lexical_alternative
  - marker: b
    text: “屏障”也可译作“墙”“围护物”或“篱笆”。这里的形象可能泛指犹大和耶路撒冷所得的安全与保护，不一定仅指实体城墙。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים / וּבְעַבְדֻתֵנוּ
  choice: 奴隶／在受奴役之中
  rationale: 保留两个同根词之间的呼应，并体现群体仍处于波斯帝国辖制下的非自由地位；“奴隶”比“仆人”更能传达这种受辖制的力度。
- source_word: עֲזָבָנוּ
  choice: 离弃我们
  rationale: 既符合祷告和圣约语境，也准确表达“离开、抛弃”的含义，且现代汉语读者容易理解。
- source_word: וַיַּט עָלֵינוּ חֶסֶד
  choice: 向我们施以忠贞的慈爱
  rationale: “施以”表达 נטה 在此主动赐予、延展的意味；“忠贞的慈爱”兼顾 חֶסֶד 所含坚定、恩慈与关系忠诚的丰富内涵，而不把它缩减为一般的善意。
- source_word: לִפְנֵי מַלְכֵי פָרַס
  choice: 在波斯诸王面前
  rationale: 贴合 לִפְנֵי 的空间及关系性表达，也保留原文对波斯君王认可与恩准的含蓄指向。
- source_word: מִחְיָה
  choice: 得以复苏
  rationale: 该词可指生命得以保存或重新恢复活力；“复苏”适合被掳归回后的群体处境，并保留生存与复兴两方面的含义。
- source_word: לְרוֹמֵם אֶת־בֵּית אֱלֹהֵינוּ
  choice: 重建我们神的殿
  rationale: רום 字面为“举起”，在圣殿已毁的语境中指使其重新建立；“殿”明确此处“神的家”所指，同时保持庄重自然。
- source_word: וּלְהַעֲמִיד אֶת־חָרְבֹתָיו
  choice: 修复殿的废墟
  rationale: העמיד 有“使站立、建立”之意，与“废墟”连用时表达使毁坏之处重新恢复；汉语用“修复”避免生硬的“立起废墟”，所指仍明确回接神的殿。
- source_word: גָדֵר
  choice: 一道屏障
  rationale: 该词可指墙、篱笆或围护设施；本节并不必然专指耶路撒冷城墙，“屏障”既保留具体遮护意象，也容纳安全与保护的比喻义。
- source_word: בִּיהוּדָה וּבִירוּשָׁלִָם
  choice: 在犹大和耶路撒冷
  rationale: 按介词的处所义直译，不把屏障过度解释为环绕两地的实体城墙。
theological_decisions:
- issue: חֶסֶד 的翻译
  choice: 忠贞的慈爱
  alternative: 坚定的爱／恩慈／恩惠／守约的信实
  rationale: 此词在这里兼有恩慈和持久忠诚的意味。“忠贞的慈爱”以自然汉语保留两者，并避免只用“恩惠”而削弱关系性的忠诚，也避免在词面上加入原文未明说的“约”。
- issue: גָדֵר 是实体墙还是保护的比喻
  choice: 屏障
  alternative: 墙／围墙／篱笆
  rationale: 原词具有具体围护物的形象，但在犹大和耶路撒冷的语境中也可能泛指波斯政权之下所得的安全保障。“屏障”保留这种开放性，脚注列出更具体的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“然而……却……反而……”呈现原文中奴役处境与神未离弃、反施慈爱的强烈转折；全句保留祷告式长句的推进感，同时以分句确保清晰。
