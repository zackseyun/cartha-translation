  text: אֲשֶׁ֣ר צִוִּ֗יתָ בְּ/יַ֨ד עֲבָדֶ֣י/ךָ הַ/נְּבִיאִים֮ לֵ/אמֹר֒ הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֤ם בָּאִים֙ לְ/רִשְׁתָּ֔/הּ אֶ֤רֶץ נִדָּה֙ הִ֔יא בְּ/נִדַּ֖ת עַמֵּ֣י הָ/אֲרָצ֑וֹת בְּ/תוֹעֲבֹֽתֵי/הֶ֗ם אֲשֶׁ֥ר מִלְא֛וּ/הָ מִ/פֶּ֥ה אֶל פֶּ֖ה בְּ/טֻמְאָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/011.yaml
  text: which you commanded by the hand of your servants the prophets[a], saying, ‘The land that you are entering to possess is a land of impurity because of the impurity of the peoples of the lands[b], because of their abominations with which they have filled it from end to end with their uncleanness.’
translation:
  language: zh_hans
  text: 就是你借着你仆人——众先知——所吩咐的，说：“你们进去要得为业的地，是一片因各地之民的污秽和他们可憎的事而污秽的地[b]；他们以自己的不洁把那地从这头到那头都充满了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从口到口”，在这里是指遍及全地，从这头直到那头。
    reason: lexical_alternative
  - marker: b
    text: “污秽之地”也可译作“不洁之地”。原文用语可能同时含有礼仪和道德上的玷污之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד עֲבָדֶיךָ הַנְּבִיאִים
  choice: 借你仆人众先知
  rationale: בְּיַד是表达施事媒介的希伯来语习语。现代汉语用“借……所”自然传达上帝通过先知颁布命令，同时“仆人众先知”保留其尊称和复数范围。
- source_word: לְרִשְׁתָּהּ
  choice: 得为业
  rationale: 既表达取得并占有土地，也保留ירשׁ在应许之地语境中的承受产业色彩；比单说“占领”更能涵盖原词语义。
- source_word: אֶרֶץ נִדָּה
  choice: 污秽之地
  rationale: נִדָּה带有玷污和不洁的语义，可兼具礼仪与道德含义。“污秽之地”保留其强烈评价而不限定为单一类别。
- source_word: בְּנִדַּת עַמֵּי הָאֲרָצוֹת
  choice: 因各地之民的污秽
  rationale: 将בְּ按上下文理解为原因；“各地之民”自然表达复数עַמֵּי הָאֲרָצוֹת，并保留多族群范围。
- source_word: בְּתוֹעֲבֹתֵיהֶם
  choice: 又因他们可憎的事
  rationale: “可憎的事”传达תּוֹעֵבָה所指在宗教和道德上令人憎恶的行为，又避免使用可能过度名词化的生硬措辞。
- source_word: מִלְאוּהָ
  choice: 他们……充满了那地
  rationale: 明确动词的主语和宾语，使汉语句法清楚，并表达已经造成的全面玷污。
- source_word: מִפֶּה אֶל־פֶּה
  choice: 从这头直到那头
  rationale: 该短语字面为“从口到口”，在此是表示全境范围的习语。译作“从这头直到那头”既自然又保留形象性。
- source_word: בְּטֻמְאָתָם
  choice: 用自己的不洁
  rationale: בְּ在此表工具或内容；“不洁”保留טֻמְאָה的礼仪—道德双重可能，也与前面的“污秽”形成语义呼应而非机械重复。
theological_decisions:
- issue: 土地受玷污之性质
  choice: 使用“污秽”“不洁”和“可憎的事”，不把经文限定为纯礼仪不洁或纯道德败坏。
  alternative: 统一译为礼仪性的“不洁”，或全部解释为道德性的“腐败”。
  rationale: נִדָּה、טֻמְאָה和תּוֹעֵבָה在本节共同构成玷污语言，可能同时带有礼仪、道德和圣约层面的含义；译文应保存这种张力。
- issue: “得地”的圣约含义
  choice: 将לְרִשְׁתָּהּ译为“得为业”。
  alternative: 译为“占领”或“取得”。
  rationale: “得为业”既不否认实际取得土地的行动，也保留应许之地作为产业的圣约背景，而不额外引入特定宗派解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“借你仆人众先知所吩咐”保持祷告和先知传令的经文语体；“得为业”保留土地产业的圣经语感。脚注标记均在正文中出现，并将习语说明紧接相关短语，将全节玷污用语的说明置于句末。
