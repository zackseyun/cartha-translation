  - severity: medium
    issue: “给我们的惩罚轻于……”表达生硬且不完整
    rationale: 中文中“惩罚轻于……所当受的”需要明确比较对象。改为“对我们的刑罚轻于我们罪孽所当受的刑罚”可清楚表达该希伯来习语的释义。
  - severity: low
    issue: “劫后余民”带入额外修辞色彩
    rationale: פְּלֵיטָה指脱逃者、幸存者或余民；“余民”已足以表达其在本段的群体意义，“劫后”并非原文直接措辞。
