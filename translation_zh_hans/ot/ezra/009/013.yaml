  text: וְ/אַֽחֲרֵי֙ כָּל הַ/בָּ֣א עָלֵ֔י/נוּ בְּ/מַעֲשֵׂ֨י/נוּ֙ הָ/רָעִ֔ים וּ/בְ/אַשְׁמָתֵ֖/נוּ הַ/גְּדֹלָ֑ה כִּ֣י אַתָּ֣ה אֱלֹהֵ֗י/נוּ חָשַׂ֤כְתָּֽ לְ/מַ֨טָּה֙ מֵֽ/עֲוֺנֵ֔/נוּ וְ/נָתַ֥תָּה לָּ֛/נוּ פְּלֵיטָ֖ה כָּ/זֹֽאת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/013.yaml
  text: And after all that has come upon us because of our evil deeds and our great guilt—though you, our God, have punished us less than our iniquities deserve and have given us such a remnant as this—
translation:
  language: zh_hans
  text: 在这一切因我们的恶行和深重的罪责临到我们之后，虽然你——我们的上帝——对我们的刑罚轻于我们罪孽所当受的刑罚[a]，又赐给我们这样的余民[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为一个习语，含有“保留、克制”及“低于我们的罪孽的程度”之意；即上帝施在他们身上的刑罚，少于他们的罪孽所应得的。也可译作“你没有照我们的罪孽所当受的尽行惩罚”。
    reason: lexical_alternative
  - marker: b
    text: 或译“这样一批逃脱的人”或“这样一批存留的人”。这个词指在审判后得以幸存、被保留下来的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כָּל הַבָּא עָלֵינוּ
  choice: 我们……遭遇了这一切；然而
  rationale: 将希伯来语承接上文的结构译成自然的现代汉语，同时保留本节作为祷告中未完条件句的语流。
- source_word: בְּמַעֲשֵׂינוּ הָרָעִים וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה
  choice: 因自己的恶行和深重的罪责
  rationale: ב在此表示原因；אַשְׁמָה指客观的罪责，而不只是主观的内疚感。
- source_word: כִּי אַתָּה אֱלֹהֵינוּ
  choice: 然而，你—我们的上帝—
  rationale: כִּי在语境中带有转折或让步意味；破折号突出“我们的上帝”这一同位称呼，又不改变句法关系。
- source_word: חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ
  choice: 给我们的惩罚轻于我们的罪孽所当受的
  rationale: 该习语表达上帝没有按罪孽应得的全部分量施行审判。译文清楚传达其意义，并以脚注保留原文“扣留、留下”的表达特点。
- source_word: פְּלֵיטָה כָּזֹאת
  choice: 这些劫后余民
  rationale: פְּלֵיטָה可指逃脱、幸存者或获救后存留的人；“劫后余民”在被掳归回的语境中兼顾幸存群体与灾后存留之意。
theological_decisions:
- issue: 上帝的审判与罪孽应得刑罚之间的关系
  choice: 给我们的惩罚轻于我们的罪孽所当受的
  alternative: 你留下我们，没有照我们的罪孽所当受的尽行惩罚
  rationale: 译文同时保留罪责确实应受审判与上帝施行怜悯这两面，不引入超出本句的教义表述。
- issue: פְּלֵיטָה所指的是逃脱、存留还是余民
  choice: 劫后余民
  alternative: 得以逃脱的人；存留的人
  rationale: 本词既可着重逃脱本身，也可指经历审判后幸存的群体；正文选用符合以斯拉记历史处境的群体称谓，脚注明示词义范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“恶行”“罪责”“罪孽”分别对应行为、客观罪责和应受刑罚的过犯，避免词义扁平化。末尾保留破折号，表示本节句意延续到下一节。
