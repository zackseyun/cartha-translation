  text: וְ/עַתָּ֛ה מַה נֹּאמַ֥ר אֱלֹהֵ֖י/נוּ אַֽחֲרֵי זֹ֑את כִּ֥י עָזַ֖בְנוּ מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/010.yaml
  text: And now[a], what shall we say, our God, after this? For we have forsaken your commandments.
translation:
  language: zh_hans
  text: 如今，我们的上帝啊，在这事之后，我们还能说什么呢？因为我们离弃了你的诫命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 承接前文并引出祷告中的下一层思想；“如今”自然保留时间与话语转折功能，不额外限定为强烈转折或结果关系。
- source_word: מַה נֹּאמַר
  choice: 我们还能说什么呢
  rationale: 未完成式第一人称复数在此具有商议兼反问语气；“还能说什么呢”以现代汉语传达因罪而无言以对的含义，同时不把它改写成单纯求问。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝啊
  rationale: 保留第一人称复数所属关系，并以语气词“啊”清楚表达祷告中的直接呼告。
- source_word: אַחֲרֵי זֹאת
  choice: 事到现在
  rationale: 该短语回指此前所述的罪与危机；“事到现在”符合汉语习惯，并保留在这一切之后面对上帝的语境。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出无言以对的原因，保留原文的解释关系。
- source_word: עָזַבְנוּ
  choice: 我们离弃了
  rationale: עזב在盟约与道德语境中指背弃、抛弃应守的义务；“离弃”保留其庄重和认罪分量。
- source_word: מִצְוֺתֶיךָ
  choice: 你的诫命
  rationale: “诫命”是现代汉语圣经及宗教语境中自然、庄重的对应词，保留上帝命令的权威性。
theological_decisions:
- issue: 以斯拉认罪时问句的性质
  choice: 译作因犯罪而无言以对的反问式认罪
  alternative: 译作询问下一步该说什么的普通商议问句
  rationale: 后接“因为我们离弃了你的诫命”，表明这不是中性的求指引，而是悔罪者在上帝面前无可辩解的表达；译文保留其商议形式与反问力量，没有增添原文没有的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“我们的上帝啊”体现呼告；“事到现在，我们还能说什么呢”按自然汉语调整语序，以传达原文的悔罪与无言，同时保留问句形式。
