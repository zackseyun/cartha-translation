id: EZR.9.15
reference: Ezra 9:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ צַדִּ֣יק אַ֔תָּה כִּֽי נִשְׁאַ֥רְנוּ פְלֵיטָ֖ה כְּ/הַ/יּ֣וֹם הַ/זֶּ֑ה הִנְ/נ֤וּ לְ/פָנֶ֨י/ךָ֙ בְּ/אַשְׁמָתֵ֔י/נוּ כִּ֣י אֵ֥ין לַ/עֲמ֛וֹד לְ/פָנֶ֖י/ךָ עַל זֹֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/015.yaml
  text: O Yahweh[a], God of Israel, you are righteous, for we have been left as a remnant, as it is this day. Here we are before you in our guilt[c][b], for no one can stand before you because of this.
translation:
  language: zh_hans
  text: 耶和华——以色列的上帝啊，你是公义的[a]，因为我们仍被留下作为余民，直到今日。看啊，我们带着罪责站在你面前；因着这事，无人能在你面前站立得住[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义的”也可译作“公正的”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“因为因着这事，在你面前没有站立”；这是指人在罪责之下不能在上帝面前站立或存留。
    reason: idiom_explanation
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的上帝专名译法；不以“主”替代原文的专名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接保留原文的领属结构和立约语境中的称呼。
- source_word: צַדִּיק
  choice: 公义的
  rationale: 既可涵盖道德上的正直，也可涵盖审判上的公正；不把此处限缩为单一司法含义。
- source_word: כִּי
  choice: 因为
  rationale: 保留第一处 כִּי 对前句作解释或说明根据的功能。
- source_word: נִשְׁאַרְנוּ
  choice: 我们得以存留下来
  rationale: 体现尼法勒式所含“被留下、存留下来”的意味，同时符合自然现代汉语。
- source_word: פְלֵיטָה
  choice: 逃脱的余民
  rationale: 同时表达逃过灾祸的人和剩余之民两层含义，避免只保留其中一面。
- source_word: כְּהַיּוֹם הַזֶּה
  choice: 正如今日所见
  rationale: 以自然汉语表达原文指向当前可见处境的时间惯用语。
- source_word: הִנְנוּ לְפָנֶיךָ
  choice: 看哪，我们……站在你面前
  rationale: 保留 הִנְנוּ 的呈现和强调语气，并以“站在你面前”衔接后文的重复意象。
- source_word: בְּאַשְׁמָתֵינוּ
  choice: 带着罪责
  rationale: 表达百姓处在有罪、负有罪责的状态中，而不是仅指主观内疚感。
- source_word: כִּי אֵין לַעֲמוֹד לְפָנֶיךָ עַל זֹאת
  choice: 因这事，没有人能在你面前站立得住
  rationale: 保留 כִּי 的因果关系、原文无人称存在句的普遍表述，以及“站立”在上帝面前不能存留或承受审判的含义。
theological_decisions:
- issue: 上帝之名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。译作“耶和华”可在现代中文中将其作为专名保留，且比以称号“主”替代更贴近源文；“雅威”是可能的现代拟音。
- issue: 此处上帝“公义”的范围
  choice: 你是公义的
  alternative: 你是公正的
  rationale: “公义”保留原文可能同时涉及上帝审判的正当性与让余民存留的恩慈这一张力，不将其缩减为纯司法意义。
- issue: 末句主语的范围
  choice: 没有人能在你面前站立得住
  alternative: 我们不能在你面前站立得住
  rationale: 原文采用无人称存在结构，并未明确写出第一人称主语；正文保留较宽的表达，同时语境自然包括认罪的群体。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。呼语以破折号区分神名与称号；“看哪”保留祷告中突出的呈现语气。正文重复“站在你面前”，以保存希伯来文前后呼应的修辞。
