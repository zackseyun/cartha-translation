    issue: “在我们受奴役时”把 בְּעַבְדֻתֵנוּ 译成时间状语。
    rationale: 介词 בְּ 表示“在我们的奴役／受辖制状态中”，不是“当我们受奴役的时候”。应保留归回群体虽获复兴、仍处受辖制境况的张力。
  - severity: low
    issue: “一群逃脱的人”对 פְּלֵיטָה 的表达不够凝练，也较弱化其幸存群体／余民含义。
    rationale: 该词在此为集体性名词，指蒙保全的逃脱者。译作“逃脱的余民”既自然，又保留幸存和群体性的含义。
  - severity: low
    issue: “暂且”可表达短暂性，但“片刻之间”更直接对应 כִּמְעַט רֶגַע。
    rationale: 原文强调“短暂的一刻”，而非单纯暂时性的安排；改译可更清楚呈现时间短促。
