source:
  edition: WLC
  text: וְ/עַתָּ֡ה כִּ/מְעַט רֶגַע֩ הָיְתָ֨ה תְחִנָּ֜ה מֵ/אֵ֣ת יְהוָ֣ה אֱלֹהֵ֗י/נוּ לְ/הַשְׁאִ֥יר לָ֨/נוּ֙ פְּלֵיטָ֔ה וְ/לָ/תֶת לָ֥/נוּ יָתֵ֖ד בִּ/מְק֣וֹם קָדְשׁ֑/וֹ לְ/הָאִ֤יר עֵינֵ֨י/נוּ֙ אֱלֹהֵ֔י/נוּ וּ/לְ/תִתֵּ֛/נוּ מִֽחְיָ֥ה מְעַ֖ט בְּ/עַבְדֻתֵֽ/נוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
translation:
  language: zh_hans
  text: 但如今，在这片刻之间，我们的神雅威向我们施恩，为我们留下逃脱的余民，又在他的圣所中赐给我们一根橛子[a]，好使我们的眼睛明亮[b]，并在我们受奴役的境况中赐给我们一点生机[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “橛子”也可理解为稳固的立足之处；原文保留了某物被牢牢固定的具体形象。
    reason: lexical_alternative
  - marker: b
    text: “使我们的眼睛明亮”也可译为“给我们的眼睛光明”；这是指恢复活力、希望或精神。
    reason: idiom_explanation
  - marker: c
    text: “在我们受奴役的境况中”也可译作“在我们的受辖制中”或“在我们为奴的处境中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחִנָּה
  choice: 施恩
  rationale: 此词常指求恩或恳求，但在“从雅威我们的神而来”的结构中，语境所指是神所赐的恩惠；“施恩”自然表达已经临到的怜悯，又不额外引入后期神学术语。
- source_word: פְּלֵיטָה
  choice: 一群逃脱的人
  rationale: 该词兼有逃脱、幸存群体之意；此处指被掳之后蒙保存的群体，因此译出具体的人群，并保留“逃脱”的语义。
- source_word: יָתֵד
  choice: 一根橛子
  rationale: 原词的具体形象是固定在地上的橛子或木桩，比直接译作“立足之地”更贴近希伯来文；其比喻意义在脚注说明。
- source_word: בִּמְקוֹם קָדְשׁוֹ
  choice: 在他的圣所中
  rationale: “圣所”既忠实于“他的圣洁之处”，也符合本段以圣殿为中心的语境，而没有扩展为更宽泛的圣地。
- source_word: לְהָאִיר עֵינֵינוּ
  choice: 使我们的眼睛明亮
  rationale: 保留“使眼睛发光”的希伯来语意象；在此表达恢复活力、希望和精神。
- source_word: מִחְיָה
  choice: 一点生机
  rationale: 该名词可指维持生命、复苏或恢复活力；“生机”在现代汉语中自然，也与“眼睛明亮”的生命意象协调。
- source_word: בְּעַבְדֻתֵנוּ
  choice: 在我们受奴役时
  rationale: 原词强调受辖制、为奴的状态；“受奴役”保留其力度，符合归回群体仍受帝国统治的处境。
- source_word: כִּמְעַט רֶגַע
  choice: 暂且
  rationale: 该短语强调这段宽缓时期短暂而有限；“暂且”在中文句中简洁自然地表达这一时间限制。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现神的专名，并采用与 Yahweh 对应的现代汉语音译，而不以称号“主”替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。译作“雅威”直接保留专名，并与较可能的古代读音 Yahweh 对应；不以“主”取代，也不采用源自 Jehovah 形式的传统音译。
- issue: “橛子”意象的解释范围
  choice: 正文保留具体意象，脚注说明可指稳固的立足之处
  alternative: 正文直接译作“立足之地”
  rationale: 原文没有明说橛子具体象征住处、地位还是延续，因此保留形象可避免把比喻过度限定。
- issue: 被掳归回后群体的处境
  choice: 受奴役
  alternative: 服役；臣属
  rationale: עַבְדוּת 表达强烈的受辖制状态。即使群体已经归回，他们仍在外邦帝国权下；译文保留这种获复苏却仍受奴役的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文由“施恩”统领的一连串目的或结果，同时适度调整语序以符合汉语表达。正文保留“橛子”和“眼睛明亮”两个希伯来语具体意象，并用脚注解释，不在正文中消解其开放性。
