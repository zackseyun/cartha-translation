id: EZR.9.14
reference: Ezra 9:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/נָשׁוּב֙ לְ/הָפֵ֣ר מִצְוֺתֶ֔י/ךָ וּ֨/לְ/הִתְחַתֵּ֔ן בְּ/עַמֵּ֥י הַ/תֹּעֵב֖וֹת הָ/אֵ֑לֶּה הֲ/ל֤וֹא תֶֽאֱנַף בָּ֨/נוּ֙ עַד כַּלֵּ֔ה לְ/אֵ֥ין שְׁאֵרִ֖ית וּ/פְלֵיטָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/014.yaml
  text: Shall we again break your commandments and intermarry with the peoples of these abominations? Would you not be angry with us until you had consumed us[b][a], leaving no remnant or survivor?
translation:
  language: zh_hans
  text: 我们岂可再次违背你的诫命，与行这些可憎之事的各族通婚[a]呢？你岂不会向我们发怒，直到把我们灭尽，不留余民，也无一人逃脱[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“与这些可憎之事的各族通婚。”这里可能是指以这些可憎行为为特征的各族。
    reason: lexical_alternative
  - marker: b
    text: “无一人逃脱”也可译作“没有逃脱者”；原文与“余民”并列。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָשׁוּב
  choice: 岂可再次
  rationale: שׁוב本义为“返回、回转”，在此与后面的不定式连用，表示重新犯从前的罪；“再次”自然传达这一语境含义，疑问词则保留反问语气。
- source_word: לְהָפֵר
  choice: 违背
  rationale: הפר在诫命和盟约语境中指破坏、违反；“违背诫命”是现代汉语中自然且庄重的搭配。
- source_word: מִצְוֺתֶיךָ
  choice: 你的诫命
  rationale: 保留第二人称单数后缀所表达的直接称呼，也保留מצוה在圣经法律语境中的用词。
- source_word: וּלְהִתְחַתֵּן
  choice: 通婚
  rationale: חתן的Hitpael形式表示与另一群体建立婚姻关系；“通婚”简洁表达群体之间相互缔结婚姻的含义。
- source_word: בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה
  choice: 与行这些可憎之事的各族
  rationale: 希伯来文直译为“与这些可憎之事的各族”。正文将压缩的属格关系理解为各族以这些行为为特征，避免误解为族群本身在本体上可憎；脚注保留较直译的表达。
- source_word: הֲלוֹא תֶאֱנַף בָּנוּ
  choice: 你岂不会向我们发怒
  rationale: אנף表示发怒、震怒；此译自然地保留针对对象及期待肯定回答的反问。
- source_word: עַד כַּלֵּה
  choice: 直到把我们灭尽
  rationale: כלה表示使之终结、彻底消灭；补出语境中隐含的宾语“我们”，使中文完整清楚。
- source_word: שְׁאֵרִית
  choice: 余民
  rationale: שארית指审判后存留下来的人；“余民”保留其在圣经中的关键词性质和跨文本呼应。
- source_word: וּפְלֵיטָה
  choice: 也无一人逃脱
  rationale: פליטה可指逃脱、获救或逃脱者；与“余民”并列时，具体的人称含义最切合上下文，中文以动词句表达更自然。
theological_decisions:
- issue: “各族”与“可憎之事”的关系
  choice: 正文译作“行这些可憎之事的各族”，把定罪所针对的重点放在其行为上。
  alternative: 较直译为“这些可憎之事的各族”。
  rationale: 原文的构造关系简练，具有一定解释空间。上下文关注的是被禁的宗教和道德行为；正文采用自然中文说明这种关系，脚注同时保留原文较直译的形式，不把族裔本身说成可憎。
- issue: 保留“余民”用语
  choice: 在正文中使用“余民”。
  alternative: 译作“剩下的人”或“幸存者”。
  rationale: “余民”虽带有圣经书面色彩，但现代读者仍可理解，并能保留以斯拉记及更广泛圣经审判与存留主题之间的呼应。
- issue: 神的忿怒与彻底毁灭之间的张力
  choice: 按反问原样译出“发怒，直到把我们灭尽”。
  alternative: 弱化为一般惩罚或灾祸。
  rationale: 原文明确设想持续至彻底灭尽的神圣忿怒；译文不缓和这一审判语言，也不把反事实或条件关系额外写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体；以“岂可”和“岂不会”保留连续反问的力度。正文优先自然汉语，同时用脚注交代压缩的希伯来语构造及פליטה的词义选择。
