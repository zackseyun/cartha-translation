    rationale: “掳掠”在现代汉语常指掠夺行为，且与后面的“抢夺”语义相近；原文在此区分 captivity 与 plunder。
  - severity: medium
    issue: “当面羞辱”偏离בֹשֶׁת פָּנִים的具体含义。
    rationale: 该词组是“脸面的羞耻”，指公开可见的耻辱或蒙羞；“当面”则可能被理解为面对面遭人侮辱。
  - severity: low
    issue: “从我们祖先的日子”略不符合现代标准汉语的通常搭配。
    rationale: “从我们祖先的时代”更自然，同时仍忠实表达“从祖先的日子起”。
