  to: 从我们祖先的时代直到今日，我们一直罪责深重。因我们的罪孽，我们、我们的君王和祭司都被交在各地君王手中，遭受刀剑、被掳、掠夺和满面羞愧[a]，正如今日的情形。
  rationale: 修订仅处理三个安全且必要的问题：以“时代”替代较生硬的“日子”；以“被掳”明确区分人员沦为俘虏的状态和其后的“掠夺”；以“满面羞愧”取代易误解为面对面侮辱的“当面羞辱”，并保留原文“脸面”的形象。其余结构、罪责术语和群体认罪的表达均予保留。
