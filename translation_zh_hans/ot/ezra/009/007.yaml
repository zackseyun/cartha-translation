source:
  edition: WLC
  text: מִ/ימֵ֣י אֲבֹתֵ֗י/נוּ אֲנַ֨חְנוּ֙ בְּ/אַשְׁמָ֣ה גְדֹלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בַ/עֲוֺנֹתֵ֡י/נוּ נִתַּ֡נּוּ אֲנַחְנוּ֩ מְלָכֵ֨י/נוּ כֹהֲנֵ֜י/נוּ בְּ/יַ֣ד מַלְכֵ֣י הָ/אֲרָצ֗וֹת בַּ/חֶ֜רֶב בַּ/שְּׁבִ֧י וּ/בַ/בִּזָּ֛ה וּ/בְ/בֹ֥שֶׁת פָּנִ֖ים כְּ/הַ/יּ֥וֹם הַ/זֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/007.yaml
  text: From the days of our fathers until this day[a], we have been in great guilt. Because of our iniquities, we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plunder, and to shame of face, as it is this day.
translation:
  language: zh_hans
  text: 从我们祖先的时代直到今日，我们一直罪责深重。因我们的罪孽，我们、我们的君王和祭司都被交在各地君王手中，遭受刀剑、被掳、掠夺和满面羞愧[a]，正如今日的情形。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公开蒙羞”或“受凌辱”；原文直译为“脸面的羞耻”。
    reason: 说明בֹשֶׁת פָּנִים的字面意象及合理译法。
lexical_decisions:
- source_word: מִימֵי אֲבֹתֵינוּ
  choice: 从我们祖先的日子
  rationale: מִן与“日子”构成时间起点，指从祖先时代开始；采用自然的现代汉语，同时保留原文的历史延续感。
- source_word: אֲנַחְנוּ בְּאַשְׁמָה גְדֹלָה
  choice: 我们一直罪责深重
  rationale: אַשְׁמָה指客观的罪责，而不只是羞愧感；“一直”结合上下文补出无动词句自祖先时代延续至今的时态含义。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 准确表达状态持续到说话当下，也符合庄重而自然的现代汉语。
- source_word: וּבַעֲוֹנֹתֵינוּ
  choice: 因我们的罪孽
  rationale: 此处בְּ在语境中表原因；עָוֹן兼有悖逆、罪责及其后果的语义，“罪孽”保留其道德分量。
- source_word: נִתַּנּוּ
  choice: 被交在
  rationale: נָתַן的Niphal形式为被动，语境指被交付于敌人的权势之下；“被交在……手中”兼顾被动形式与汉语习惯。
- source_word: בְּיַד
  choice: 在……手中
  rationale: 保留希伯来语表示落入他人权势的“手中”意象，在现代汉语中也清楚自然。
- source_word: מַלְכֵי הָאֲרָצוֹת
  choice: 各地君王
  rationale: אֲרָצוֹת在此指不同的国家或地域，并非全地；“各地”比“列国”略少解释性，也比逐字的“诸地”自然。
- source_word: בַּחֶרֶב
  choice: 遭受刀剑
  rationale: “刀剑”保留原文审判套语及战争杀戮的意象；与后列各项并列时补入“遭受”，使汉语顺畅。
- source_word: בַּשְּׁבִי
  choice: 掳掠
  rationale: שְׁבִי指被掳、受俘的状态；“掳掠”在此取被掳之义，并与“抢夺”区分人员被掳和财物被劫。
- source_word: וּבַבִּזָּה
  choice: 抢夺
  rationale: בִּזָּה指敌人劫取的财物或劫掠行为；“抢夺”清楚表达所受的掠夺。
- source_word: וּבְבֹשֶׁת פָּנִים
  choice: 当面羞辱
  rationale: 该短语直译为“脸面的羞耻”，表示公开可见的蒙羞；正文采用自然汉语，并以脚注保存字面意象和其他可能译法。
- source_word: כְּהַיּוֹם הַזֶּה
  choice: 正如今日的情形
  rationale: 表达前述审判后果在说话当下仍是现实；“正如今日的情形”比逐字结构更符合现代汉语。
theological_decisions:
- issue: 区分אַשְׁמָה与עָוֹן这两个认罪用语
  choice: 分别译作“罪责”和“罪孽”
  alternative: 两者都泛译为“罪”，或把אַשְׁמָה译为“过犯”
  rationale: 原文叠加客观罪责与罪孽的语言；加以区分可保留以斯拉群体认罪的语义层次，又不附加特定宗派解释。
- issue: 认罪中的群体连带性
  choice: 保留“我们和我们的君王、祭司”共同被交付的结构
  alternative: 重组句子，弱化百姓与领袖共同承担审判的表达
  rationale: 希伯来文明确把群体、君王和祭司并列纳入认罪及审判之中；译文保留这种历史和神学上的共同认同。
- issue: 审判清单中介词的功能
  choice: 译为“遭受刀剑、掳掠、抢夺和当面羞辱”
  alternative: 逐项译作“交给刀剑、被掳、掠夺和脸面的羞耻”
  rationale: 各项前的בְּ可描述被交付后所落入或遭受的灾祸。采用“遭受”使汉语自然，同时保留四重审判的并列张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“罪责深重”保留法律与道德意味；“交在……手中”保存希伯来语权势意象。正文避免过度古雅，同时借脚注交代“脸面的羞耻”这一原文具体表达。
