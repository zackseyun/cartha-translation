  text: וּ/בְ/מִנְחַ֣ת הָ/עֶ֗רֶב קַ֚מְתִּי מִ/תַּֽעֲנִיתִ֔/י וּ/בְ/קָרְעִ֥/י בִגְדִ֖/י וּ/מְעִילִ֑/י וָֽ/אֶכְרְעָ/ה֙ עַל בִּרְכַּ֔/י וָ/אֶפְרְשָׂ֥/ה כַפַּ֖/י אֶל יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/005.yaml
  text: At the evening offering I rose from my fasting[a], with my garment and my robe torn, and I fell on my knees and spread out my hands to Yahweh my God.
translation:
  language: zh_hans
  text: 到了晚祭的时候，我从禁食中起来[a]，衣服和外袍都撕裂了；我屈膝，向耶和华我的上帝张开双手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “晚祭”所用的希伯来词常特指素祭；这里也可泛指晚间献祭的时刻。
    reason: 保留 מִנְחָה 在礼仪语境中可具体指“素祭”、也可指晚间献祭时刻的词义范围。
lexical_decisions:
- source_word: וּבְמִנְחַת הָעֶרֶב
  choice: 到了献晚祭的时候
  rationale: מִנְחָה 可指礼物、素祭或供物；与“晚上”连用时，也可泛指献晚祭的时刻。正文采用自然且不过度限定祭物种类的表达，具体可能性留在脚注中。
- source_word: קַמְתִּי מִתַּעֲנִיתִי
  choice: 我从禁食中起来
  rationale: קום 表示起来；תַּעֲנִית 在此最可能指禁食，也保留借禁食自卑、苦己的背景含义。
- source_word: וּבְקָרְעִי בִגְדִי וּמְעִילִי
  choice: 身上的衣服和外袍仍是撕裂的
  rationale: 介词 בְּ 加不定式可表示伴随情形；这里不是再次撕裂衣服，而是说明以斯拉起来时衣服和外袍仍处于撕裂状态。“衣服”和“外袍”保留 בֶּגֶד 与 מְעִיל 的区别。
- source_word: וָאֶכְרְעָה עַל בִּרְכַּי
  choice: 我双膝跪下
  rationale: כרע 指屈膝、跪下；现代汉语用“双膝跪下”自然地呈现祷告姿态，又不额外加入“扑倒”等原文未明说的动作。
- source_word: וָאֶפְרְשָׂה כַפַּי
  choice: 伸开双手
  rationale: פרשׂ 与 כף 描写祷告时张开或伸出双手的动作；“伸开双手”兼顾自然表达与身体意象。
- source_word: אֶל יְהוָה אֱלֹהָי
  choice: 向耶和华我的上帝
  rationale: אֶל 在此表示祷告动作所朝向的对象；יהוה 以通行的中文专名“耶和华”表达，אֱלֹהָי 译为“我的上帝”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文正文采用读者广泛熟悉、具有专名功能的“耶和华”，而不以“主”代替，从而保留原文中圣约之名的出现；“雅威”是较接近学术重构读音的另一译法。
- issue: תַּעֲנִית 的具体含义
  choice: 禁食
  alternative: 苦己／自卑
  rationale: 该词可带有自我苦待、谦卑己身的含义，但在本段哀恸和祷告的具体语境中，最自然地指禁食。正文不将其抽象化，以免淡化实际行为。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“仍是撕裂的”明确这是伴随状态；祷告动作按希伯来语顺序呈现。脚注标记已置于正文相关位置。
