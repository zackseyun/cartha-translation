  naturalness: “身上的衣服和外袍仍是撕裂的”虽可理解，但“仍是”补入了原文未明说的持续强调，且句式略滞。“衣服和外袍都撕裂了”在此伴随情状中更自然。“双膝跪下”语义重复；“屈膝”既现代自然，也贴近 כרע。
