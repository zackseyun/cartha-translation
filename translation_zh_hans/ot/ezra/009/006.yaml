base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/006.yaml
  text: And I said[a], “My God, I am ashamed and humiliated to lift up my face to you, my God, because our iniquities have multiplied above our heads, and our guilt has grown as high as the heavens.”
translation:
  language: zh_hans
  text: 我说：“我的上帝啊，我羞愧又蒙羞，不敢向你仰起脸来；我的上帝啊，因为我们的罪孽多到高过我们的头顶[a]，我们的罪责已经大到直达诸天。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“高过我们的头”；希伯来语以单数“头”配第一人称复数后缀，可按群体性习语理解。
    reason: 说明原文单数“头”的群体性习语用法，以及正文采用复数“头顶”的自然汉语表达。
lexical_decisions:
- source_word: בֹּשְׁתִּי וְנִכְלַמְתִּי
  choice: 我羞愧难当
  rationale: 两个近义动词叠加强烈的羞耻与受辱感；合译为自然庄重的现代汉语，保留强化语气，避免生硬重复。
- source_word: לְהָרִים ... פָּנַי אֵלֶיךָ
  choice: 不敢向你仰起脸来
  rationale: 保留“仰起脸”的希伯来语身体意象；结合羞愧语境，以“不敢”自然表达不愿或无颜如此，并未改成原文没有的“眼睛”。
- source_word: עֲוֺנֹתֵינוּ
  choice: 我们的罪孽
  rationale: 表达道德上的邪恶和过犯，并与后面的 אַשְׁמָה“罪责”区分。
- source_word: רָבוּ
  choice: 累累
  rationale: 该动词表示增多、繁多；“罪孽累累”既自然又体现不断积累的分量。
- source_word: לְמַעְלָה רֹאשׁ
  choice: 高过头顶
  rationale: 保留罪孽向上堆积、漫过头部的空间隐喻；“头顶”在汉语中可自然用于群体中的每个人。
- source_word: אַשְׁמָתֵנוּ
  choice: 我们的罪责
  rationale: 此处指因犯罪而承担的罪责，而非赎愆祭；与“罪孽”形成有意义的词汇区别。
- source_word: גָדְלָה עַד לַשָּׁמָיִם
  choice: 滔天
  rationale: “滔天”是现代汉语可懂而庄重的惯用表达，准确传达罪责增长直达诸天的夸张垂直意象。
- source_word: אֱלֹהַי
  choice: 我的上帝啊
  rationale: 保留两次直接呼告及其强调作用；“啊”自然标明呼格。
- source_word: וָאֹמְרָה
  choice: 我说
  rationale: 承接叙事即可；汉语无需机械译出连接词。
theological_decisions:
- issue: 以斯拉使用“我们的”认同群体的罪
  choice: 保留“我们的罪孽／我们的罪责”
  alternative: 改为“他们的罪孽／罪责”
  rationale: 原文明确使用第一人称复数；译文不替作者划分个人与群体责任，也不消解其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。保留两次“我的上帝啊”和“仰起脸”的原文修辞；以“罪孽／罪责”区分两个相关但不完全相同的希伯来词。
