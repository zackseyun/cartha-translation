source:
  edition: WLC
  text: וְ/אֵלַ֣/י יֵאָסְפ֗וּ כֹּ֤ל חָרֵד֙ בְּ/דִבְרֵ֣י אֱלֹהֵֽי יִשְׂרָאֵ֔ל עַ֖ל מַ֣עַל הַ/גּוֹלָ֑ה וַ/אֲנִי֙ יֹשֵׁ֣ב מְשׁוֹמֵ֔ם עַ֖ד לְ/מִנְחַ֥ת הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/004.yaml
  text: Then everyone who trembled at the words of the God of Israel because of the unfaithfulness of the exiles gathered to me[b][a], while I sat appalled until the evening offering.
translation:
  language: zh_hans
  text: 于是，凡因被掳归回群体的背信[a]，而对以色列的上帝的话心存战兢的人，都聚集到我这里来。我一直惊愕地坐着，直到献晚祭的时候[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被掳归回群体的背信”也可译作“被掳归回群体的失信”或“被掳归回群体的罪过”。
    reason: lexical_alternative
  - marker: b
    text: “晚祭”原文为“傍晚的素祭”；这里用来指每天傍晚献祭的时刻。
    reason: cultural_note
lexical_decisions:
- source_word: יֵאָסְפוּ
  choice: 都聚集到我这里来
  rationale: 该词为אסף的尼法勒式，在此表示众人来到以斯拉身边、聚集在一起；中文用主动式更自然，同时不额外限定为被动召集。
- source_word: כֹּל חָרֵד
  choice: 凡……心存战兢的人
  rationale: 单数形容词在כֹּל之后具有集合意义；“心存战兢”既表达敬畏，也保留因上帝话语而震动惧怕的意味。
- source_word: בְּדִבְרֵי אֱלֹהֵי יִשְׂרָאֵל
  choice: 对以色列上帝的话
  rationale: 介词ב在חרד之后可标示战兢所针对或所由引起的对象；保留דִבְרֵי的形式，但汉语以集合性的“话”自然表达。
- source_word: עַל מַעַל הַגּוֹלָה
  choice: 因被掳归回之人的不忠
  rationale: עַל在此表原因；מַעַל指对上帝失信、违背忠诚，而不只是一般过错。הַגּוֹלָה在本段指被掳后归回的群体，“被掳归回之人”明确其历史身份。
- source_word: יֹשֵׁב מְשׁוֹמֵם
  choice: 一直惊愕地坐着
  rationale: 分词组合描写以斯拉持续坐着并处于震惊、骇然的状态；“惊愕”自然庄重，不将其误解为空间上的荒凉。
- source_word: עַד לְמִנְחַת הָעָרֶב
  choice: 直到献晚祭的时候
  rationale: מִנְחָה可特指素祭，但此处整个短语用作时间标志，指傍晚常献之祭的时刻；正文采用自然的礼仪性表达，并以脚注说明词义范围。
theological_decisions:
- issue: 盟约语境中מַעַל的译法
  choice: 不忠
  alternative: 罪过；背信
  rationale: “不忠”保留对上帝失信、破坏忠诚关系的意味，又不导入后来的特定教义术语。
- issue: הַגּוֹלָה所指的群体
  choice: 被掳归回之人
  alternative: 被掳的人；被掳归回的群体；流亡群体
  rationale: 上下文所说的是曾被掳而现已归回的共同体；译文明确这一点，同时没有把抽象的“被掳”当作行为主体。
- issue: 因果修饰关系
  choice: 众人因归回群体的不忠而对上帝的话心存战兢
  alternative: 众人只因上帝的话而战兢，另就归回群体的不忠聚集
  rationale: עַל短语可与战兢及聚集的整体情境相关。中文保留两者紧密相连的关系，不进一步断定其唯一句法附着点。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“上帝”对应אֱלֹהִים；以“心存战兢”避免仅表达普通害怕。“被掳归回之人”稍作显化，以适合以斯拉记的历史语境。脚注标记均置于正文相应内容之后。
