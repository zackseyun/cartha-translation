reference: Ezra 9:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/עַתָּה בְּֽנוֹתֵי/כֶ֞ם אַל תִּתְּנ֣וּ לִ/בְנֵי/הֶ֗ם וּ/בְנֹֽתֵי/הֶם֙ אַל תִּשְׂא֣וּ לִ/בְנֵי/כֶ֔ם וְ/לֹֽא תִדְרְשׁ֧וּ שְׁלֹמָ֛/ם וְ/טוֹבָתָ֖/ם עַד עוֹלָ֑ם לְמַ֣עַן תֶּחֶזְק֗וּ וַ/אֲכַלְתֶּם֙ אֶת ט֣וּב הָ/אָ֔רֶץ וְ/הוֹרַשְׁתֶּ֥ם לִ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/012.yaml
  text: So now[a], do not give your daughters to their sons, and do not take their daughters for your sons. Never seek their peace or their prosperity[b], so that you may be strong and eat the good of the land and leave it as an inheritance to your sons forever.
translation:
  language: zh_hans
  text: 所以现在，不可把你们的女儿嫁给他们的儿子，也不可为你们的儿子娶他们的女儿。永远不可为他们求平安和福祉[a]，好使你们强盛，享用这地的美物，并使你们的儿子永远承受这地。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“不可寻求他们的平安和他们的好处，直到永远。”
    reason: lexical_alternative
  - marker: b
    text: “这地”是根据上下文补出的所承受对象；也可理解为前面的“这地的美物”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: בְּנוֹתֵיכֶם ... לִבְנֵיהֶם
  choice: 把你们的女儿嫁给他们的儿子
  rationale: 希伯来文直译为“把女儿给他们的儿子”，在此指婚嫁；中文用“嫁给”自然、明确，并保留对应关系。
- source_word: וּבְנֹתֵיהֶם אַל תִּשְׂאוּ לִבְנֵיכֶם
  choice: 不可为你们的儿子娶他们的女儿
  rationale: נשא 在这里是娶妻的惯用表达；“为你们的儿子娶”保留 לִבְנֵיכֶם 的关系及两句的平行结构。
- source_word: תִדְרְשׁוּ
  choice: 求
  rationale: דרש 的基本义为“寻求”；与“平安和福祉”搭配时，“为他们求”表达主动谋求其利益。
- source_word: שְׁלֹמָם וְטוֹבָתָם
  choice: 他们的平安和福祉
  rationale: שָׁלוֹם 保留为“平安”，טוֹבָה 译作涵盖益处、兴盛与安好的“福祉”，既区分二词又不过度限定为物质繁荣。
- source_word: עַד עוֹלָם
  choice: 永远不可
  rationale: 该短语在否定命令中表示持续、绝对的禁止；中文前置为“永远不可”自然地传达此力度。
- source_word: לְמַעַן תֶּחֶזְקוּ
  choice: 好使你们强盛
  rationale: לְמַעַן 表示目的或结果；חזק 的 Qal 形式可指变得强壮、强盛，此处“强盛”适合群体和国土语境。
- source_word: וַאֲכַלְתֶּם אֶת טוּב הָאָרֶץ
  choice: 享用这地的美物
  rationale: 原文直为“吃这地的美好”；“享用”保留获得并食用地上丰产的含义，“美物”保留 טוּב 的宽泛性。
- source_word: וְהוֹרַשְׁתֶּם
  choice: 把这地留给……承受
  rationale: ירש 的 Hiphil 在此有使后代承受产业之意；宾语在原文中未明说，语境最自然指这地，正文明确补出并用脚注提示。
- source_word: לִבְנֵיכֶם
  choice: 你们的子孙
  rationale: בנים 字面可指“儿子”，也常在跨世代承受产业的语境中指后裔；现代中文“子孙”准确表达这里的代际范围，并避免误解为仅限直接男性子女。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 句末修饰后代承受产业的持续性，“永远”简洁保留其长久、世代延续的语气。
theological_decisions:
- issue: 被掳归回后盟约处境中的族群与宗教隔离语言
  choice: 直接呈现禁止与当地族群通婚、也不可为其求平安和福祉的严厉命令，不加弱化。
  alternative: 把经文泛化为避免有害属灵关系的普遍劝告，或扩展成适用于一切外族关系的永恒规则。
  rationale: 本节处于以斯拉记特定的被掳归回及盟约忠诚语境。译文应保留原命令的张力和范围，不把它淡化为抽象原则，也不擅自扩大为经文未明说的普遍教义。
- issue: וְהוֹרַשְׁתֶּם 的隐含宾语
  choice: 正文理解为使“这地”成为子孙承受的产业。
  alternative: 理解为把“这地的美物”留给子孙，或保持完全无宾语的表达。
  rationale: 希伯来文未明示宾语，语法允许承接前文；就土地产业的语境而言，“这地”最自然，但脚注保留“美物”为宾语的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“嫁给／娶”明确婚姻语义；“平安和福祉”保留两个希伯来名词的并列；末句以脚注保存隐含宾语的真实歧义。
