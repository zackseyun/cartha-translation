  to: 因为他们从各地民族的女儿中娶来一些，给自己和儿子为妻[a]；圣洁的后裔[b]也与各地的民族混杂了。在这不忠的事上，首领和官长带头参与[c]。
  rationale: 修订明示“女儿”所属的群体，消除中文指代不明；以“给自己和儿子为妻”自然呈现婚姻关系；并将领袖的“为首”译为“带头参与”，准确表达原文关于主动参与和主要责任的习语含义。保留“圣洁的后裔”“不忠”及全部脚注锚点，未将经文的圣约群体语言扩展为种族理论。
