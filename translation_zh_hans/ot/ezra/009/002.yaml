source:
  edition: WLC
  text: כִּֽי נָשְׂא֣וּ מִ/בְּנֹֽתֵי/הֶ֗ם לָ/הֶם֙ וְ/לִ/בְנֵי/הֶ֔ם וְ/הִתְעָֽרְבוּ֙ זֶ֣רַע הַ/קֹּ֔דֶשׁ בְּ/עַמֵּ֖י הָ/אֲרָצ֑וֹת וְ/יַ֧ד הַ/שָּׂרִ֣ים וְ/הַ/סְּגָנִ֗ים הָֽיְתָ֛ה בַּ/מַּ֥עַל הַ/זֶּ֖ה רִאשׁוֹנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/002.yaml
  text: For they have taken some of their daughters for themselves and for their sons[a], and the holy seed has mixed itself with the peoples of the lands[c][b]. And the hand of the officials and the deputies has been foremost in this unfaithfulness.
translation:
  language: zh_hans
  text: 因为他们从各地民族的女儿中娶来一些，给自己和儿子为妻[a]；圣洁的后裔[b]也与各地的民族混杂了。在这不忠的事上，首领和官长带头参与[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从他们的女儿中取来，给自己和自己的儿子”；这里的“取”按语境指娶妻。
    reason: lexical_alternative
  - marker: b
    text: “后裔”原文直译为“种子”，保留了圣约群体的谱系用语。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“首领和官长的手在这不忠的事上是为首的”，意思是他们带头参与，并负有首要责任。
    reason: idiom_clarification
lexical_decisions:
- source_word: נָשְׂאוּ מִבְּנֹתֵיהֶם
  choice: 从那些人的女儿中娶了妻
  rationale: נָשָׂא 的基本义是“拿、取”，在本句与“女儿”及受益者结构连用，语境明确指娶妻；מִן 在此有部分义，故译作“从……女儿中”。
- source_word: לָהֶם וְלִבְנֵיהֶם
  choice: 给自己和自己的儿子
  rationale: 介词 לְ 表示对象或受益者，说明这些婚姻既涉及他们自己，也涉及他们的儿子。
- source_word: וְהִתְעָרְבוּ
  choice: 也……混杂了
  rationale: Hitpael 词形表达彼此掺杂、混合；“混杂”保留原文较强的群体边界语气，而不另加目的或因果关系。
- source_word: זֶרַע הַקֹּדֶשׁ
  choice: 圣洁的后裔
  rationale: זֶרַע 字面为“种子”，在谱系语境中指后裔。“圣洁的后裔”在现代汉语中自然，并保留原文的圣约与谱系色彩。
- source_word: בְּעַמֵּי הָאֲרָצוֹת
  choice: 与各地的民族
  rationale: 保留 אֲרָצוֹת 的复数含义；“各地的民族”比直译“诸地之民”更符合现代汉语，同时指向周围地区的各族群体。
- source_word: הַשָּׂרִים וְהַסְּגָנִים
  choice: 首领和官长
  rationale: 两个词均指行政领导阶层；此译既区分两类领袖，又避免把 שׂרים 过度限定为王室“王子”。
- source_word: מַּעַל
  choice: 不忠
  rationale: מַעַל 常指背信、失信，尤其带有违背圣约的意味；“不忠”比一般的“过犯”更能体现这一层含义。
- source_word: רִאשׁוֹנָה
  choice: 为首
  rationale: 此处表示带头或负有首要责任，不一定只是时间上最先；“为首”能自然表达领导者的主要罪责。
theological_decisions:
- issue: “圣洁的后裔”在异族通婚语境中的含义
  choice: 保留圣洁与后裔的圣约性表达，不扩展为种族理论
  alternative: 译作“圣洁的种子”或解释为族裔纯洁
  rationale: 原文使用强烈的圣洁与谱系语言，译文应予保留；但经文本身并未建立后世的种族分类，因此不应在翻译中加入种族化解释。
- issue: 领袖在事件中的责任
  choice: 译作“竟是为首的”，表达他们带头并负首要责任
  alternative: 仅译作“最先参与”或逐字保留“手是第一的”
  rationale: “手”与“为首”的组合强调主动参与及领导性的罪责；正文采用自然汉语传达其功能，脚注说明原文意象。
- issue: 两分句之间的逻辑关系
  choice: 用“也”承接并列结果，不译成“以致”或“为了”
  alternative: 译作“以致圣洁的后裔……”
  rationale: 原文使用普通连接词 וְ，并未明确标示目的；译文避免把并列关系解释成目的关系。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“娶了妻”明确语境含义；“圣洁的后裔”避免生硬的“圣洁的种子”，同时以脚注保留原文字面意象；“竟是为首的”自然表达经文对领袖罪责的强调。
