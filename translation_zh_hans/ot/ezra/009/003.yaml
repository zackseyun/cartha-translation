  text: וּ/כְ/שָׁמְעִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה קָרַ֥עְתִּי אֶת בִּגְדִ֖/י וּ/מְעִילִ֑/י וָ/אֶמְרְטָ֞/ה מִ/שְּׂעַ֤ר רֹאשִׁ/י֙ וּ/זְקָנִ֔/י וָ/אֵשְׁבָ֖/ה מְשׁוֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/003.yaml
  text: As soon as I heard this matter[a], I tore my garment and my robe, pulled out some of the hair of my head and my beard[b], and sat appalled.
translation:
  language: zh_hans
  text: 我一听见这事[a]，就撕裂了衣服和外袍，又从头上和胡须上拔下一些毛发[b]，惊骇地坐着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我一听见这报告”。
    reason: lexical_alternative
  - marker: b
    text: 撕裂衣服和拔下毛发，是当时表达悲痛、惊骇或哀悼的举动。
    reason: cultural_note
lexical_decisions:
- source_word: וּכְשָׁמְעִי
  choice: 我一听见
  rationale: 以“一……就……”表达כְּ引出的时间关系及随后行动的紧迫感，同时保留第一人称叙述。
- source_word: הַדָּבָר הַזֶּה
  choice: 这事
  rationale: דָּבָר可指话、事情或报告；上下文所指是刚被禀报的情况，“这事”自然且不过度限定。
- source_word: קָרַעְתִּי
  choice: 撕裂了
  rationale: 准确呈现撕裂衣物这一哀伤、震惊的惯常举动，语体庄重。
- source_word: בִּגְדִי וּמְעִילִי
  choice: 内衣和外袍
  rationale: בֶּגֶד是较泛的衣物名称，מְעִיל通常指披在外面的袍服；用“内衣和外袍”明确两者层次，但“内衣”在此指外袍里面所穿的衣服，并非现代贴身内衣。
- source_word: וָאֶמְרְטָה
  choice: 拔下
  rationale: 该动词表示用力拔除毛发；“拔下”在现代汉语中直接、自然。
- source_word: מִשְּׂעַר רֹאשִׁי וּזְקָנִי
  choice: 从头上和胡须上拔下一些毛发
  rationale: מִן具有部分义，表明是从头发和胡须中拔下一部分，并不暗示全部拔光。
- source_word: וָאֵשְׁבָה
  choice: 坐在那里
  rationale: 将“坐下/坐着”自然融入动作序列；“在那里”是汉语为表达持续状态所作的轻度补足。
- source_word: מְשׁוֹמֵם
  choice: 惊骇地
  rationale: 该分词表达因震惊、恐惧而茫然失措的状态；“惊骇”比“惊讶”更能体现语境的强烈情绪，又不把含义缩窄为单纯悲伤。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言，以“一……就……”保持动作的紧凑感。正文中的“内衣”是相对于外袍而言的里面衣服；若为避免现代读者误解，也可译作“衣服和外袍”。
