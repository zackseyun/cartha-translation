source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת אֵ֗לֶּה נִגְּשׁ֨וּ אֵלַ֤/י הַ/שָּׂרִים֙ לֵ/אמֹ֔ר לֹֽא נִבְדְּל֞וּ הָ/עָ֤ם יִשְׂרָאֵל֙ וְ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת כְּ֠/תוֹעֲבֹֽתֵי/הֶם לַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הַ/פְּרִזִּ֣י הַ/יְבוּסִ֗י הָֽ/עַמֹּנִי֙ הַ/מֹּ֣אָבִ֔י הַ/מִּצְרִ֖י וְ/הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/001.yaml
  text: When these things were finished[a], the officials approached me, saying, “The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations—the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.”
translation:
  language: zh_hans
  text: 这些事办完以后，官长们来到我这里，说：“以色列民、祭司和利未人没有与各地的民族分别开来，照着迦南人、赫人、比利洗人、耶布斯人、亚扪人、摩押人、埃及人和亚摩利人所行的可憎之事行[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“照着他们的可憎之事”。这个希伯来词语气强烈，常用于描述在宗教或伦理上被视为严重可憎的事，也常与偶像崇拜有关。
    reason: 说明“可憎之事”所译希伯来词的强烈宗教—伦理色彩，并保留原文中“他们”与所列各族的关联。
lexical_decisions:
- source_word: וּכְכַלּוֹת אֵלֶּה
  choice: 这些事办完以后
  rationale: 以自然汉语表达介词 כְּ 加不定式构造所形成的时间从句，并保留叙事的先后关系；不另加原文没有的“那时”一类时间词。
- source_word: נִגְּשׁוּ אֵלַי
  choice: 来到我这里
  rationale: נגשׁ 的尼法勒词干表示走近、来到某人面前；此译符合现代汉语叙事习惯，又保留朝向以斯拉而来的动作。
- source_word: הַשָּׂרִים
  choice: 官长们
  rationale: שׂרים 指掌权的领袖或行政官员；“官长”既适合波斯时期的行政背景，也避免“王子”所带来的世袭王族含义。
- source_word: לֹא נִבְדְּלוּ
  choice: 没有……分别开来
  rationale: בדל 的尼法勒形式在此具有自我分离或保持分别的含义；译文不进一步推断其动机。
- source_word: הָעָם יִשְׂרָאֵל וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: 以色列民、祭司和利未人
  rationale: 保留原文并列的三个群体，使同一项指控明确涵盖他们全体。
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: 与各地的民族
  rationale: 介词 מִן 与“分别”连用，在汉语中自然译为“与……分别开来”；“各地的民族”保留 עמים 与 ארצות 的复数和地域—族群含义。
- source_word: כְּתוֹעֲבֹתֵיהֶם
  choice: 照着他们可憎的行为行事
  rationale: כְּ 表示依照或效法；תועבות 是带有强烈道德和宗教意味的用语。“可憎的行为”保留其严厉程度，而补出“行事”使省略式希伯来结构在汉语中完整通顺。
- source_word: לַכְּנַעֲנִי ... וְהָאֱמֹרִי
  choice: 就是迦南人、赫人、比利洗人、耶布斯人、亚扪人、摩押人、埃及人和亚摩利人的行为
  rationale: 希伯来语用带冠词的单数族名指整个族群，汉语按族群名称表达。末尾复现“行为”，使族群名单与前面的“他们”及“可憎的行为”关系清楚，同时不把民族本身等同于“可憎之事”。
theological_decisions:
- issue: תועבות 的盟约伦理与宗教色彩
  choice: 可憎的行为
  alternative: 令人厌恶的习俗；可憎之事
  rationale: “可憎”保留原词对宗教上冒犯及偶像崇拜相关行为的强烈谴责，不将其弱化为一般的不良习惯；“行为”则使现代读者清楚，指控所针对的是所行之事。
- issue: 指控所涵盖的以色列群体
  choice: 以色列民、祭司和利未人都受同一谓语统摄
  alternative: 主要只指普通百姓，祭司和利未人仅为附带提及
  rationale: 希伯来语将三个群体并列置于同一动词之下，因此译文不缩小指控范围。
- issue: “分别”与效法列国行为之间的关系
  choice: 保留“没有分别开来”并明确其表现为照着列国可憎的行为行事
  alternative: 直接解释为与外族通婚
  rationale: 本节本身先作较宽泛的报告，后文才具体说明婚姻问题；译文不提前把本节的措辞限定为单一行为。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“官长”“利未人”等沿用读者熟悉的圣经用语；句法作适度调整，以免希伯来语的省略结构在汉语中产生歧义。脚注标记置于其实际说明的“可憎的行为”之后。
