revisions:
- from: 这些事办完以后，官长们来到我这里，说：“以色列民、祭司和利未人没有与各地的民族分别开来，而是照着他们可憎的行为行事[a]，就是迦南人、赫人、比利洗人、耶布斯人、亚扪人、摩押人、埃及人和亚摩利人的行为。”
  to: 这些事办完以后，官长们来到我这里，说：“以色列民、祭司和利未人没有与各地的民族分别开来，照着迦南人、赫人、比利洗人、耶布斯人、亚扪人、摩押人、埃及人和亚摩利人所行的可憎之事行[a]。”
  rationale: 修订仅调整“可憎之事”与后列族名的表达方式：以“所行的可憎之事”明确指控针对行为和习俗，而不是把各民族本身称为可憎；同时删去原文未显明的“而是”，并避免重复使用“行为”。其余内容保留原稿的时间、群体范围、行政称谓和族名译法。
