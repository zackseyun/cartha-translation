  text: אֱ֠דַיִן תַּתְּנַ֞י פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן לָ/קֳבֵ֗ל דִּֽי שְׁלַ֞ח דָּרְיָ֧וֶשׁ מַלְכָּ֛/א כְּנֵ֖מָא אָסְפַּ֥רְנָא עֲבַֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/013.yaml
  text: Then Tattenai[a], the governor of Beyond the River, Shethar-bozenai, and their associates did exactly so[b], in accordance with what King Darius had sent.
translation:
  language: zh_hans
  text: 于是，河西[a]总督达乃、示他·波斯乃和他们的同僚，就严格按照大流士王所发出的命令办理了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河西”是波斯帝国的行政地理名称，指幼发拉底河以西的地区。
    reason: cultural_note
  - marker: b
    text: 或译：“谨慎地办理了”“切实执行了”。这里的亚兰语表达强调他们周详、确实地遵行王的命令。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 这是承接叙事的亚兰语标记；“于是”自然地表达事情随后发生。
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: 河西总督
  rationale: פַּחַת指行省总督；עֲבַר נַהֲרָה是波斯帝国从两河流域一侧所用的行政地理名称，直译为“河西”，即幼发拉底河以西地区。
- source_word: שְׁתַר בּוֹזְנַי
  choice: 示他·波斯乃
  rationale: 按亚兰语人名音译，并以间隔号清楚标示复合人名的两个部分。
- source_word: וּכְנָוָתְהוֹן
  choice: 和他们的同僚
  rationale: 此词指与二人一同任事、站在同一公务关系中的人；“同僚”符合行政语境。
- source_word: לָקֳבֵל דִּי
  choice: 照着……
  rationale: 该短语表示与某项命令相符、依照其内容行事；现代汉语用“照着”简洁自然。
- source_word: שְׁלַח
  choice: 所传的命令
  rationale: 动词本义是“传送、发出”；上下文所传的是王的谕令。补出“命令”使汉语指代清楚，但不把它限定为新的诏书。
- source_word: כְּנֵמָא אָסְפַּרְנָא עֲבַדוּ
  choice: 就完全……办理了
  rationale: 该表达强调他们确实、周全地执行王命。“完全……办理了”保留精确遵行的重点，同时符合现代公务语境。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“河西总督”保留波斯行政称号的历史视角；“办理”适合本节执行王命的公务语境。脚注标记依其实际说明对象安放：地理说明置于“河西”后，词义说明置于“办理了”后。
