  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֧וּ חַג מַצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֑ה כִּ֣י שִׂמְּחָ֣/ם יְהוָ֗ה וְֽ/הֵסֵ֞ב לֵ֤ב מֶֽלֶךְ אַשּׁוּר֙ עֲלֵי/הֶ֔ם לְ/חַזֵּ֣ק יְדֵי/הֶ֔ם בִּ/מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִ֖ים אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/022.yaml
  text: And they kept the Feast of Unleavened Bread for seven days with joy[a], because Yahweh had made them joyful and had turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God[c][b], the God of Israel.
translation:
  language: zh_hans
  text: 他们欢欢喜喜地守了七天除酵节，因为耶和华使他们喜乐，又使亚述王[a]的心转向他们，好让他们有力量从事以色列的上帝的殿宇工程。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“亚述王”。当时的统治者属于波斯帝国；这里可能沿用了较早的帝国称号，指统辖原亚述疆域的君王。
    reason: 说明正文保留的历史称号，避免读者误以为译文把波斯王误写为亚述王。
lexical_decisions:
- source_word: וַיַּעֲשׂוּ חַג מַצּוֹת
  choice: 守了除酵节
  rationale: עשה与节期连用表示守节、庆祝，不宜直译为“做”；“守……节”是现代汉语中自然且准确的表达。
- source_word: שִׁבְעַת יָמִים בְּשִׂמְחָה
  choice: 欢欢喜喜地……七天
  rationale: 既表达七天的时长，也保留בְשִׂמְחָה所强调的喜乐状态；叠词符合自然、庄重而易懂的现代汉语。
- source_word: שִׂמְּחָם
  choice: 使他们喜乐
  rationale: 保留Piel动词的使役意义，即耶和华使他们进入喜乐的状态，也与前面的“欢欢喜喜”形成呼应。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不是用称号“主”替代。
- source_word: וְהֵסֵב לֵב
  choice: 又使……的心转向
  rationale: 贴近希伯来语“使心转向”的意象，不把其含义进一步解释为“施恩”或“改变心意”。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 原文明确写“亚述王”；尽管历史背景处于波斯时期，正文不作协调性改写。
- source_word: לְחַזֵּק יְדֵיהֶם
  choice: 支持他们
  rationale: “使他们的手坚强”是给予力量或帮助的希伯来语习语；译作“支持他们”在现代汉语中自然，并符合此处王权为工程提供助力的语境。
- source_word: בִּמְלֶאכֶת בֵּית הָאֱלֹהִים
  choice: 从事……上帝之殿的工程
  rationale: מְלָאכָה指工作、工程；结合重建圣殿的上下文，“工程”比泛称“工作”更具体。“上帝之殿”保留原文属格关系。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 保留原文对“上帝”的同位说明，并采用清楚自然的现代汉语所属结构。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 正文保留神的专名，不以称号代替；“耶和华”是现代简体中文中辨识度最高、最适合普通读者的专名形式。
- issue: 波斯时期统治者被称为“亚述王”
  choice: 正文保留“亚述王”
  alternative: 波斯王；统治亚述的王
  rationale: 希伯来文本明确使用מֶלֶךְ אַשּׁוּר。为避免以历史协调取代原文，正文照译，并用脚注说明其时代背景。
- issue: “使他们的手坚强”的处理
  choice: 支持他们
  alternative: 使他们的手坚强；鼓励他们
  rationale: 此习语在语境中表示使其有力量、有条件完成圣殿工程。“支持”保留核心意义，且不限定支持究竟是鼓励、授权还是物质援助。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“欢欢喜喜”传达节庆气氛；“支持他们从事……工程”自然表达希伯来语习语，同时保留上帝使王心转向他们这一因果关系。脚注标记置于整句之后，对“亚述王”作必要的历史说明。
