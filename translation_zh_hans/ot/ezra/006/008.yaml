revisions:
- from: 我又降旨，吩咐你们应当怎样帮助这些犹太人的长老重建这座上帝的殿：要从王的税收，就是“大河以西”[a]所收的贡税中，及时支付他们的费用，不得让工程停顿。
  to: 我也颁布谕旨，关于你们该如何对待这些犹太人的长老、让他们重建这座上帝的殿：要及时从王室财资中，就是从“大河以西”[a]的贡税中，支付这些人的费用，免得工程停顿。
  rationale: 修订保留诏令的行政语气，并将“关于如何对待这些长老”与后文所规定的经费支持相衔接，不把前句限定为直接协助。财政条款改为“王室财资……大河以西的贡税”，以呈现原文的资金来源关系；“这座”保留指示词“这”，“免得工程停顿”则自然表达结尾的不停工目的。
