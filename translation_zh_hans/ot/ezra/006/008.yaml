  - severity: medium
    issue: “从王的税收，就是……所收的贡税中”弱化了“王室财资”与“该地区贡税”之间的说明关系。
    rationale: מִנִּכְסֵי מַלְכָּא 指王的财资、收入或资产；其后以“即／就是”说明资金取自大河以西的贡税。译作“王室财资，即……的贡税”更贴合原文。
  revised_text: 我也颁布谕旨，关于你们该如何对待这些犹太人的长老、让他们重建这座上帝的殿：要及时从王室财资中，就是从“大河以西”[a]的贡税中，支付这些人的费用，免得工程停顿。
  revised_footnotes:
