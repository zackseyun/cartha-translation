  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ לְ/מָ֣א דִֽי תַֽעַבְד֗וּן עִם שָׂבֵ֤י יְהוּדָיֵ/א֙ אִלֵּ֔ךְ לְ/מִבְנֵ֖א בֵּית אֱלָהָ֣/א דֵ֑ךְ וּ/מִ/נִּכְסֵ֣י מַלְכָּ֗/א דִּ֚י מִדַּת֙ עֲבַ֣ר נַהֲרָ֔/ה אָסְפַּ֗רְנָא נִפְקְתָ֛/א תֶּהֱוֵ֧א מִֽתְיַהֲבָ֛א לְ/גֻבְרַיָּ֥/א אִלֵּ֖ךְ דִּי לָ֥א לְ/בַטָּלָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/008.yaml
  text: 'Moreover, I issue a decree concerning what you are to do for these Jewish elders as they rebuild this house of God: Their expenses are to be paid promptly from the royal revenues—the tribute collected in Beyond the River[a]—so that the work is not interrupted.'
translation:
  language: zh_hans
  text: 我也颁布谕旨，关于你们该如何对待这些犹太人的长老、让他们重建这座上帝的殿：要及时从王室财资中，就是从“大河以西”[a]的贡税中，支付这些人的费用，免得工程停顿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大河以西”是波斯帝国对幼发拉底河以西地区的行政称呼。
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: 我又降旨
  rationale: 原文是亚兰语行政用语，指君王颁布正式命令；用主动式保留说话者及诏令的权威语气。
- source_word: לְמָא דִי תַעַבְדוּן עִם שָׂבֵי יְהוּדָיֵא אִלֵּךְ
  choice: 吩咐你们应当怎样帮助这些犹太人的长老
  rationale: עִם 字面为“与”，但在此行政语境中表示应如何对待或协助这些长老；“帮助”自然呈现命令的实际指向。
- source_word: לְמִבְנֵא בֵּית אֱלָהָא דֵךְ
  choice: 重建这座上帝的殿
  rationale: דֵךְ 是指示词“这”，不是“你们的”；“重建”符合上下文，而“殿”准确表达这里作为敬拜建筑的“上帝之家”。
- source_word: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה
  choice: 从王的税收，就是“大河以西”所收的贡税中
  rationale: נִכְסֵי מַלְכָּא 指王室财资或收入；מִדַּת 指贡税，不是行省。此译明确贡税是支付费用的财政来源。
- source_word: אָסְפַּרְנָא
  choice: 及时
  rationale: 这个行政借词强调迅速、审慎地执行；在付款语境中，“及时”最清楚自然。
- source_word: נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ
  choice: 支付他们的费用
  rationale: 原文被动结构要求向这些人供应工程开支；汉语改用自然的主动命令式，同时保留支付对象和内容。
- source_word: דִּי לָא לְבַטָּלָא
  choice: 不得让工程停顿
  rationale: 目的或结果在于防止停工；补出上下文隐含的“工程”，但不把原文含混的语法主语具体化。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留王室诏令的行政语气。“上帝的殿”避免误译为“你们上帝的殿”；“贡税”与“大河以西”的脚注共同交代波斯时期的财政和地理背景。
