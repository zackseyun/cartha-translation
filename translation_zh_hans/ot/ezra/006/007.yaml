base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/007.yaml
  text: Leave the work on this house of God alone[a]; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.
translation:
  language: zh_hans
  text: 不要干涉这座上帝的殿的工程；要让犹大人[a]的省长和犹大人的长老在原址重建这座上帝的殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大人”也可译作“犹太人”。这里的亚兰语称谓既可侧重族群身份，也可侧重来自犹大地区的地域身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻקוּ לַעֲבִידַת
  choice: 不要干涉……的工程
  rationale: 复数命令式在此命令收文者停止阻挠；“不要干涉”自然表达这种禁阻含义。“工程”契合圣殿重建的施工语境。
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: 这座上帝的殿
  rationale: דֵךְ指当前诏令所论的特定圣殿；“这座”保留指示意味，“上帝的殿”在现代汉语中庄重自然。
- source_word: פַּחַת
  choice: 省长
  rationale: 该词指波斯行政体系中的地方长官；“省长”比泛称“长官”更能体现其地域行政职分，又避免用过于专门的称谓。
- source_word: יְהוּדָיֵא
  choice: 犹大人
  rationale: 该亚兰语称谓兼有族群和地域含义；“犹大人”在本段波斯时期的行政语境中保留这层开放性，避免直接限定为较后来的族名用法。
- source_word: וּלְשָׂבֵי יְהוּדָיֵא
  choice: 和犹大人的长老
  rationale: שָׂבֵי指群体中的长老或领袖；“长老”是准确而通行的译法。
- source_word: יִבְנוֹן
  choice: 要让……重建
  rationale: 未完成式在诏令中带有准许兼命令的语气；与前句的停止干涉相接，“要让……重建”清楚传达其权威性。“重建”符合圣殿恢复的上下文。
- source_word: עַל אַתְרֵהּ
  choice: 在原址
  rationale: 字面为“在它的地方／地点上”；就重建建筑而言，“在原址”是简洁自然的汉语表达，并准确体现其位置未变。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诏令语体。“不要干涉”准确传达停止阻挠的命令；后半句用“要让”保留亚兰语诏令中准许与命令并存的语气。
