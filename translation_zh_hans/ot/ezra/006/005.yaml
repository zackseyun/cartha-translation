base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/005.yaml
  text: And also let the gold and silver vessels of the house of God[a], which Nebuchadnezzar took out of the temple that was in Jerusalem and brought to Babylon, be returned and brought to the temple that is in Jerusalem, each to its place; and you shall put them in the house of God.
translation:
  language: zh_hans
  text: 此外，神的殿中的金银器皿，就是尼布甲尼撒从耶路撒冷的圣殿中取出、带到巴比伦的，都要归还，送回耶路撒冷的圣殿，各归原处[a]；你要把它们安放在神的殿中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都要归还，让它们回到耶路撒冷的圣殿，各归原处。”这里译作“送回”的亚兰文形式和句法较难确定；上下文所表达的是把圣殿器皿恢复到它们在耶路撒冷原来的位置。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף
  choice: 此外
  rationale: 引出诏令中的补充事项，简洁自然地保留附加语气。
- source_word: מָאנֵי
  choice: 器皿
  rationale: 泛指圣殿敬拜和陈设所用的器具；“器皿”是庄重而通行的译法。
- source_word: בֵית אֱלָהָא
  choice: 神的殿
  rationale: 按字面译出“神的家／殿”，并与本节译作“圣殿”的 הֵיכְלָא 保持用词区别；“神的殿”在现代中文中自然清楚。
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: 金银器皿
  rationale: 说明器皿的材质；中文以“金银器皿”表达最简洁自然。
- source_word: הַנְפֵּק
  choice: 取出
  rationale: 该使役动词表示使其从圣殿出去，即取出或移走；“取出”贴合叙事动作。
- source_word: הֵיכְלָא
  choice: 圣殿
  rationale: 语境明确指耶路撒冷的圣所建筑；“圣殿”既准确又能与“神的殿”略作词汇区分。
- source_word: וְהֵיבֵל
  choice: 带到
  rationale: 表示将器皿运往巴比伦；“带到”符合中文叙事习惯。
- source_word: יַהֲתִיבוּן
  choice: 都要归还
  rationale: 在王令语境中表达被动或命令性的恢复、归还；“都要”也自然统摄前面的复数器皿。
- source_word: וִיהָךְ
  choice: 送回
  rationale: 该形式及其句法较难确定；结合方向补语和上下文，译为“送回”表达器皿被带回耶路撒冷，同时用脚注保留另一种理解。
- source_word: לְאַתְרֵהּ
  choice: 各归原处
  rationale: 单数代词具有逐一分配的意味，指每件器皿回到相应位置；“各归原处”自然凝练。
- source_word: וְתַחֵת
  choice: 你要把它们安放
  rationale: 保留第二人称单数对官员的直接命令；“安放”比“放”更符合诏令和圣殿器物的庄重语境。
