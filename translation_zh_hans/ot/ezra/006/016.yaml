  text: וַ/עֲבַ֣דוּ בְנֵֽי יִ֠שְׂרָאֵל כָּהֲנַיָּ֨/א וְ/לֵוָיֵ֜/א וּ/שְׁאָ֣ר בְּנֵי גָלוּתָ֗/א חֲנֻכַּ֛ת בֵּית אֱלָהָ֥/א דְנָ֖ה בְּ/חֶדְוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/016.yaml
  text: And the sons of Israel[a], the priests, the Levites, and the rest of the sons of the exile celebrated the dedication of this house of God with joy.
translation:
  language: zh_hans
  text: 以色列人、祭司、利未人和其余被掳归回的人，都欢欢喜喜地为这座上帝的殿举行了奉献礼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדוּ
  choice: 举行了
  rationale: 此处动词以“奉献礼”为宾语，表示举行、操办这一礼仪；现代汉语用“举行了……奉献礼”自然且符合语境。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 闪语“以色列的儿子们”是群体称谓，译作“以色列人”准确、自然，也避免现代汉语中“以色列的儿子们”可能造成的误解。
- source_word: כָּהֲנַיָּא
  choice: 祭司
  rationale: 这是该祭司群体的标准译法。
- source_word: וְלֵוָיֵא
  choice: 利未人
  rationale: 这是指称承担圣殿职分之利未群体的标准译法。
- source_word: וּשְׁאָר בְּנֵי גָלוּתָא
  choice: 和其余被掳归回的人
  rationale: 原文直译为“其余被掳之子”；结合《以斯拉记》的历史语境，所指是祭司和利未人以外的归回流亡群体。“被掳归回的人”既保留被掳背景，也用现代汉语清楚表达其身份。
- source_word: חֲנֻכַּת
  choice: 奉献礼
  rationale: 该名词指房屋或祭坛的奉献、启用礼仪；此处译为“奉献礼”比单独的“奉献”更明确地呈现仪式事件。
- source_word: בֵּית אֱלָהָא דְנָה
  choice: 这座上帝殿
  rationale: 原文为“这座上帝的殿（房屋）”。在圣殿语境中，“上帝殿”既保留“殿/房屋”的表达，又比泛称“房子”清楚。
- source_word: בְחֶדְוָה
  choice: 欢欢喜喜地
  rationale: 以自然的汉语状语表达“带着喜乐、喜乐地”，并传达群体庆典的喜悦气氛。
theological_decisions:
- issue: “以色列人”与随后各群体的句法关系
  choice: 用“就是”将祭司、利未人和其余归回者理解为对“以色列人”的具体说明
  alternative: 将“以色列人、祭司、利未人和其余被掳归回的人”理解为四个并列群体
  rationale: 原文虽可从表面标点式阅读为列表，但祭司、利未人和其余被掳者共同构成这里的以色列群体；用同位说明可避免把祭司和利未人排除在“以色列人”之外，同时保留原文列举结构的意义。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的标准普通话。“奉献礼”“上帝殿”保留经文礼仪与圣殿语域；整体句式简明，不加入宗派性解释。
