id: EZR.6.12
reference: Ezra 6:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וֵֽ/אלָהָ֞/א דִּ֣י שַׁכִּ֧ן שְׁמֵ֣/הּ תַּמָּ֗ה יְמַגַּ֞ר כָּל מֶ֤לֶךְ וְ/עַם֙ דִּ֣י יִשְׁלַ֣ח יְדֵ֗/הּ לְ/הַשְׁנָיָ֛ה לְ/חַבָּלָ֛ה בֵּית אֱלָהָ֥/א דֵ֖ךְ דִּ֣י בִ/ירוּשְׁלֶ֑ם אֲנָ֤ה דָרְיָ֨וֶשׁ֙ שָׂ֣מֶת טְעֵ֔ם אָסְפַּ֖רְנָא יִתְעֲבִֽד־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/012.yaml
  text: And may the God who has caused his name to dwell there overthrow any king or people who stretches out his hand to alter this[a], to destroy this house of God that is in Jerusalem. I, Darius, have issued a decree[b]; let it be done with all diligence.
translation:
  language: zh_hans
  text: 愿那使自己的名住在那里[a]的上帝，使任何伸手企图更改这道谕旨、毁坏耶路撒冷的这座上帝的殿的君王或民族倾覆。我大流士已颁布谕旨；务必迅速而切实地执行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把自己的名安置在那里。”这是指上帝使圣殿成为与他的名相联的地方。
    reason: lexical_alternative
  - marker: b
    text: 或译：“务必立即执行。”原词可侧重迅速办理，也含有认真落实命令的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁכִּן שְׁמֵהּ תַּמָּה
  choice: 使自己的名住在那里
  rationale: 保留亚兰文使役动词和“名住在某处”的圣殿用语，不把它简化为上帝本人受空间限制地居住在那里。
- source_word: יְמַגַּר
  choice: 使……败亡
  rationale: 该动词在此表达审判性的倾覆或毁灭；“使……败亡”既适用于君王，也适用于民族，并符合诅咒式谕旨的庄重语气。
- source_word: כָּל מֶלֶךְ וְעַם
  choice: 任何……君王或民族
  rationale: 上下文泛指一切可能违抗谕旨者；“任何……或……”自然地传达这种周遍、分配性的含义。
- source_word: יִשְׁלַח יְדֵהּ
  choice: 伸手企图
  rationale: 保留闪语“伸手”这一采取敌对行动的形象，同时以“企图”使现代汉语句法顺畅。
- source_word: לְהַשְׁנָיָה
  choice: 更改此令
  rationale: 原文未明说宾语；从帝国谕旨的法律行政语境看，所要更改的是这道谕令。译文补出“此令”，避免汉语语意悬空。
- source_word: לְחַבָּלָה בֵּית אֱלָהָא
  choice: 毁坏……上帝殿
  rationale: 该表达指使殿遭毁坏或败坏；“毁坏”准确传达行动的严重性，又不额外限定毁坏的具体程度。
- source_word: דֵךְ
  choice: 这座
  rationale: 指向本谕旨正在讨论的特定圣殿；汉语在“殿”前用“这座”自然清楚。
- source_word: שָׂמֶת טְעֵם
  choice: 已颁布谕旨
  rationale: 这是王室行政公式；“颁布谕旨”在现代汉语中清楚体现君王命令的正式权威。
- source_word: אָסְפַּרְנָא
  choice: 迅速而切实地
  rationale: 该副词强调及时、认真地落实命令；这一译法兼顾速度与彻底执行的意味。
- source_word: יִתְעֲבִד
  choice: 务必……执行
  rationale: 被动未完成式在结尾公式中具有命令语气；“务必执行”自然传达权威性的强制要求。
theological_decisions:
- issue: 上帝使自己的名住在耶路撒冷圣殿的表述
  choice: 保留“使自己的名住在那里”的原文意象
  alternative: 把它意译为“选择了那里”或直接说“住在那里”
  rationale: “名住在那里”表达上帝与圣殿的立约性关联，同时不暗示上帝受限于圣殿空间；保留“名”的用语可维持原文的神学张力。
- issue: 更改行为的隐含宾语
  choice: 按谕旨语境补译为“更改此令”
  alternative: 仅译“作出更改”，或理解为改动圣殿
  rationale: 亚兰文没有明示宾语，语法上留下省略；但本段是王室谕旨，紧接着又明确说毁坏圣殿，因此补出“此令”最符合行政语境，同时不把“更改”与“毁坏圣殿”混为一谈。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留王室谕旨和咒诅条款的正式语气；避免古奥的文言表达，同时保留“伸手”和“名住在那里”等关键原文意象。
