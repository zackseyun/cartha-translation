revisions:
- from: 因为祭司和利未人都一同洁净了自己；他们全都洁净。于是，他们为所有从流亡之地归来的人、为他们的弟兄众祭司，也为自己宰杀了逾越节的祭牲。
  to: 因为祭司和利未人一同洁净了自己；他们全都洁净。于是，他们为所有被掳归回的子民、为他们作祭司的弟兄，也为自己宰杀了逾越节的祭牲。
  rationale: 仅作低风险的措辞调整：将较展开的“从流亡之地归来的人”收束为《以斯拉记》语境中常见且贴近原文的“被掳归回的子民”，并调整“弟兄众祭司”的语序。其余译文保留，尤其保留“一同”“全都洁净”的重复强调，以及不限定祭牲种类的“逾越节的祭牲”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:20:39Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确呈现了祭司和利未人共同自洁、全体洁净，以及为被掳群体、祭司和他们自己宰杀逾越节祭牲的内容。“逾越节的祭牲”没有把原文未明说的祭牲种类限定为羊羔，处理恰当。惟“从流亡之地归来的人”比“被掳群体的成员／被掳归回者”更具解释性，宜以较贴近《以斯拉记》语境且较简洁的说法替换。
  naturalness: 整体庄重通顺，但“他们的弟兄众祭司”在现代汉语中搭配略显生硬；“他们作祭司的弟兄”更自然，并清楚保留原文“他们的弟兄，即祭司”的关系。
  terminology: “祭司”“利未人”“洁净”“逾越节”“祭牲”均符合经文及现代汉语圣经叙事语体。“一同”可合理表达כְאֶחָד，不必改作带更强修辞色彩的“如同一人”。
  issues:
  - severity: low
    issue: “从流亡之地归来的人”略带扩展性解释。
    rationale: בני הגולה字面是“流亡／被掳群体的成员”。本书语境确实指被掳归回的群体，但“从……之地归来”将原文名词结构展开为具体动作和地点。采用“被掳归回的子民”可保留语境而更简洁贴切。
  - severity: low
    issue: “他们的弟兄众祭司”语序不够自然。
    rationale: 原文的“他们的弟兄，祭司们”是同位说明。译为“他们作祭司的弟兄”既自然，也保持祭司是其弟兄这一层关系。
  revised_text: 因为祭司和利未人一同洁净了自己；他们全都洁净。于是，他们为所有被掳归回的子民、为他们作祭司的弟兄，也为自己宰杀了逾越节的祭牲。
  revised_footnotes: []
  revision_rationale: 仅作低风险的措辞调整：将较展开的“从流亡之地归来的人”收束为《以斯拉记》语境中常见且贴近原文的“被掳归回的子民”，并调整“弟兄众祭司”的语序。其余译文保留，尤其保留“一同”“全都洁净”的重复强调，以及不限定祭牲种类的“逾越节的祭牲”。
