base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/020.yaml
  text: For the priests and the Levites had purified themselves as one; all of them were clean. And they slaughtered the Passover lamb for all the sons of the exile, and for their brothers the priests, and for themselves.
translation:
  language: zh_hans
  text: 因为祭司和利未人一同洁净了自己；他们全都洁净。于是，他们为所有被掳归回的子民、为他们作祭司的弟兄，也为自己宰杀了逾越节的祭牲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְאֶחָד
  choice: 一同
  rationale: 字面有“如同一人、合一地”之意；此处自然表达祭司和利未人共同完成洁净，同时保留群体一致行动的意味。
- source_word: בְּנֵי הַגּוֹלָה
  choice: 从流亡之地归来的人
  rationale: 该词组字面为“流亡者之子／被掳群体的成员”，在《以斯拉记》的语境中指归回的流亡群体；此译比直译“流亡之子”更符合现代汉语。
- source_word: הַפֶּסַח
  choice: 逾越节的祭牲
  rationale: 此处作“宰杀”的宾语，指为逾越节所宰的祭牲，而非节日本身；原文未明确说“羊羔”，故不额外限定动物种类。
- source_word: אֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 保留亲族式群体称谓，并由后面的“众祭司”明确所指。
theological_decisions:
- issue: כְאֶחָד 是否表达礼仪上的同等纯洁或群体合一
  choice: 译作“一同”，并由“他们全都洁净”另行陈述结果
  alternative: “如同一人”或“一致地”
  rationale: 避免把该短语过度神学化，同时保留原文关于共同洁净和全体洁净的两个相邻陈述。
- issue: הַפֶּסַח 的具体祭牲种类
  choice: 逾越节的祭牲
  alternative: 逾越节的羊羔
  rationale: 希伯来文在本节只说“逾越节祭”，不明确限定为羊羔；译文不补入原文未明说的细节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“洁净了自己／全都洁净”保留原文重复，以呈现礼仪洁净的强调；“宰杀”保留祭礼语境中的动作力度。
