  to: 犹太人的长老借着先知哈该和易多的儿子撒迦利亚所传的预言，正在建造并进展顺利[a]。他们遵照以色列的上帝的谕令，也遵照波斯王居鲁士、大流士和亚达薛西的谕令[b]，建造并完工[c]。
