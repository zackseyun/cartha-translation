  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׂבֵ֤י יְהוּדָיֵ/א֙ בָּנַ֣יִן וּ/מַצְלְחִ֔ין בִּ/נְבוּאַת֙ חַגַּ֣י נביא/ה וּ/זְכַרְיָ֖ה בַּר עִדּ֑וֹא וּ/בְנ֣וֹ וְ/שַׁכְלִ֗לוּ מִן טַ֨עַם֙ אֱלָ֣הּ יִשְׂרָאֵ֔ל וּ/מִ/טְּעֵם֙ כּ֣וֹרֶשׁ וְ/דָרְיָ֔וֶשׁ וְ/אַרְתַּחְשַׁ֖שְׂתְּא מֶ֥לֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/014.yaml
  text: And the elders of the Jews were building and prospering through the prophecy of Haggai the prophet and Zechariah son of Iddo[c][b][a]. They finished building by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia.
translation:
  language: zh_hans
  text: 犹太人的长老借着先知哈该和易多的儿子撒迦利亚所传的预言，正在建造并进展顺利[a]。他们遵照以色列的上帝的谕令，也遵照波斯王居鲁士、大流士和亚达薛西的谕令[b]，建造并完工[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “进展顺利”也可译作“兴旺”或“取得成功”。
    reason: lexical_alternative
  - marker: b
    text: “遵照……的谕令”也可译作“奉……的命令”。
    reason: lexical_alternative
  - marker: c
    text: 本节把工程的完成同时归于以色列上帝的谕令和波斯诸王的谕令，并首先提到上帝的谕令。
    reason: theological_tension
lexical_decisions:
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: 犹太人的长老
  rationale: 保留群体领袖的社会身份和“犹太人”的族群称谓，不将其限缩为地理意义上的“犹大”。
- source_word: בָּנַיִן
  choice: 继续建造
  rationale: 分词表示持续进行的动作；“继续”结合上下文自然表达进行状态，而不把动词本身扩译为“重建”。
- source_word: וּמַצְלְחִין
  choice: 进展顺利
  rationale: 该词可表示兴旺、成功或取得进展；这里指建造工程顺利推进，现代汉语用“进展顺利”自然且贴合语境。
- source_word: בִּנְבוּאַת
  choice: 在……所传的预言激励下
  rationale: 介词表达方式或媒介；结合先知宣讲对工程的推动作用，“在……激励下”比生硬的“借着预言”更自然，同时未将其改成单纯因果。
- source_word: חַגַּי נביאה
  choice: 先知哈该
  rationale: 以现代汉语自然的同位结构表达名字与职分。
- source_word: וּזְכַרְיָה בַּר עִדּוֹא
  choice: 易多的儿子撒迦利亚
  rationale: 准确保留亚兰文父子关系标记 בַּר。
- source_word: וּבְנוֹ וְשַׁכְלִלוּ
  choice: 建造完毕
  rationale: 两个并列动词合起来表达建造并完成；汉语合译为“建造完毕”，既交代建造动作，也清楚呈现竣工含义。
- source_word: מִן טַעַם
  choice: 遵照……的谕令
  rationale: 帝国亚兰文中可指命令、诏令或正式授权。“谕令”既适用于上帝，也适用于君王，并保留两处相同措辞。
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: 以色列上帝
  rationale: 直接、自然地表达原文属格称号。
- source_word: כּוֹרֶשׁ וְדָרְיָוֶשׁ וְאַרְתַּחְשַׁשְׂתְּא
  choice: 居鲁士、大流士和亚达薛西
  rationale: 采用中文圣经及历史语境中通行的人名音译，并保留三位君王的次序。
- source_word: מֶלֶךְ פָּרָס
  choice: 波斯王
  rationale: 原文为单数形式，句法上可与末名相连，也可作为名单后的概括性王号；将“波斯王”前置于名单，在汉语中自然，并避免误读为只有最后一位是波斯王。
theological_decisions:
- issue: 圣殿竣工与神圣及帝国权威的关系
  choice: 同时保留以色列上帝的谕令和三位波斯王的谕令，并把上帝的谕令列在前面
  alternative: 把波斯诸王的谕令解释为上帝谕令的从属体现
  rationale: 原文明说两方面的授权，并首先提到上帝；译文保留这种双重归因，不加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“继续建造，进展顺利”保留进行中的动作；“建造完毕”自然合并两个完成相关动词。人名采用简体中文圣经常用译名。所有脚注标记均置于对应正文处。
