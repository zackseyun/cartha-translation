  text: וְ/הַקְרִ֗בוּ לַ/חֲנֻכַּת֮ בֵּית אֱלָהָ֣/א דְנָה֒ תּוֹרִ֣ין מְאָ֔ה דִּכְרִ֣ין מָאתַ֔יִן אִמְּרִ֖ין אַרְבַּ֣ע מְאָ֑ה וּ/צְפִירֵ֨י עִזִּ֜ין ל/חטיא עַל כָּל יִשְׂרָאֵל֙ תְּרֵֽי עֲשַׂ֔ר לְ/מִנְיָ֖ן שִׁבְטֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/017.yaml
  text: And they offered for the dedication of this house of God one hundred bulls[a], two hundred rams, four hundred lambs, and twelve male goats as a sin offering for all Israel[b], according to the number of the tribes of Israel.
translation:
  language: zh_hans
  text: 他们为这座上帝的殿举行奉献礼，献上公牛一百头、公绵羊二百只、羔羊四百只，又为全以色列[a]献上公山羊十二只作赎罪祭，数目与以色列各支派的数目相同。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为全以色列”也可译作“代表全以色列”。十二只公山羊与以色列十二支派相对应。
    reason: 保留介词的词义可能性，并说明祭牲数目所表达的代表范围。
lexical_decisions:
- source_word: וְהַקְרִבוּ
  choice: 献上
  rationale: 使役词干在祭祀语境中指把祭牲献上；“献上”既准确又符合现代汉语宗教礼仪用语。
- source_word: לַחֲנֻכַּת
  choice: 举行奉献礼
  rationale: חנכה 指建筑启用时的奉献或落成仪式；“举行奉献礼”自然表达礼仪事件及介词所含的目的或场合意义。
- source_word: בֵּית אֱלָהָא דְנָה
  choice: 这上帝的殿
  rationale: 保留“这”和“上帝的殿”两项信息；中文以“殿”表达此处作为圣殿的“家／殿宇”，比直译“房屋”更清楚。
- source_word: תּוֹרִין
  choice: 公牛
  rationale: 祭牲清单中的牛类雄性祭牲；“公牛”明确而自然。
- source_word: דִּכְרִין
  choice: 公绵羊
  rationale: 该词指雄性绵羊；“公绵羊”比仅用较书面的“公羊”更明确地区别于山羊。
- source_word: אִמְּרִין
  choice: 羔羊
  rationale: 该词指幼羊；“羔羊”是现代汉语中自然的祭牲名称。
- source_word: וּצְפִירֵי עִזִּין
  choice: 公山羊
  rationale: 原文明确指雄性山羊；“公山羊”清楚保留性别和物种。
- source_word: לחטיא
  choice: 作赎罪祭
  rationale: 这是与罪或洁净有关的祭祀术语；采用通行的“赎罪祭”，同时不在正文中进一步限定其具体功用。
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: 为全以色列
  rationale: עַל 在此可表达受益或代表关系；正文用简洁的“为”，并以脚注保留“代表”的可能含义。
- source_word: לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל
  choice: 数目与以色列各支派的数目相同
  rationale: 明确表达十二只公山羊与以色列支派数目的对应关系，符合现代汉语表达。
theological_decisions:
- issue: 被掳归回时期“全以色列”的整体范围
  choice: 保留“为全以色列”，不把范围缩小为归回者
  alternative: 为所有归回的被掳者
  rationale: 原文明说“全以色列”，并以十二支派的数目说明十二只公山羊；译文保留这一整体性及其神学张力，不把历史解释写入正文。
- issue: עַל 所表达的祭祀关系
  choice: 正文译作“为”，脚注说明也可理解为“代表”
  alternative: 代表全以色列
  rationale: 介词可以表达受益或代表关系；较宽的正文措辞配合脚注，可避免无根据地排除其中一种理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。量词按现代习惯分别使用“头”和“只”；句序略作调整，使祭牲清单易读，同时保留原文的数量、祭类以及十二支派的对应关系。
