  text: 在米底省的亚马他堡垒里，找到了一卷书卷；其中写着如下备忘录：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁתְּכַח
  choice: 找到
  rationale: 此处为被动意义，表示档案搜查中有文书被找到；汉语用“有人……找到”自然表达不定施事的被动情形。
- source_word: אַחְמְתָא
  choice: 亚马他
  rationale: 按亚兰文地名音译，并与中文圣经传统译名相衔接；脚注说明其历史通名。
- source_word: בִּירְתָא
  choice: 王城
  rationale: 该词指设防的王室或行政中心；“王城”在本处兼顾其王室行政属性和现代中文的可读性，脚注保留“堡垒、城堡”的可能译法。
- source_word: דִּי בְּמָדַי מְדִינְתָּה
  choice: 米底省的
  rationale: 简洁保留关系从句的地点与行政区划信息。
- source_word: מְגִלָּה חֲדָה
  choice: 一卷文书
  rationale: חֲדָה可表示“一”；“一卷”保留其数量与卷轴形态，“文书”符合档案语境。
- source_word: וְכֵן כְּתִיב
  choice: 上面写着如下
  rationale: 自然引出后续所录文字，并保留“如此写着”的指示作用。
- source_word: בְּגַוַּהּ
  choice: 上面
  rationale: 指文字写在该卷文书之中；现代汉语对文书通常说“上面写着”。
- source_word: דִּכְרוֹנָה
  choice: 备忘录
  rationale: 行政档案语境中指为存档、记事而写的正式记录；“备忘录”比抽象的“记念”更准确。
