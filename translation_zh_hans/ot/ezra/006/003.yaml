base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/003.yaml
  text: 'In the first year of King Cyrus[a], Cyrus the king issued a decree: Concerning the house of God in Jerusalem, let the house be rebuilt, the place where they offer sacrifices, and let its foundations be laid. Its height shall be sixty cubits, and its width sixty cubits,'
translation:
  language: zh_hans
  text: 居鲁士王元年，居鲁士王颁布谕旨：“论到耶路撒冷上帝的殿，这殿要重建，作为献祭的地方；它的根基要奠立[a]。殿高六十肘，宽六十肘。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句阿拉米语较难确定，也可理解为“根基要保留”或“根基要抬起／建起”。这里按建殿的上下文译作“根基要奠立”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם טְעֵם
  choice: 颁布谕旨
  rationale: 这是阿拉米语行政用语，字面为“设立命令”，指正式发布王令；“颁布谕旨”既自然，也保留王室公文的语体。
- source_word: בֵּית אֱלָהָא
  choice: 上帝的殿
  rationale: 原文直译为“上帝的房屋”，在此明确指耶路撒冷圣殿；现代汉语以“殿”表达更自然，并与后文所指同一建筑保持一致。
- source_word: יִתְבְּנֵא
  choice: 要重建这殿
  rationale: 该被动未完成式在谕旨中带命令意味；动词本身是“建造”，而圣殿被毁后的历史语境支持译为“重建”。
- source_word: אֲתַר דִּי דָבְחִין דִּבְחִין
  choice: 就是献祭的地方
  rationale: 原文使用“献上祭物”一类同源词结构；汉语避免机械重复，同时保留此处对圣殿祭祀功能的说明。
- source_word: וְאֻשּׁוֹהִי מְסוֹבְלִין
  choice: 殿的根基要奠立
  rationale: 此短语语义疑难；结合建筑谕旨及随后尺寸说明，“根基要奠立”最符合上下文，同时以脚注保留其他可能解释。
- source_word: רוּמֵהּ
  choice: 殿高
  rationale: 该词指建筑物的高度；“殿高”是简洁自然的建筑表述。
- source_word: אַמִּין שִׁתִּין
  choice: 六十肘
  rationale: 保留古代长度单位“肘”，不以不确定的现代换算取代原文计量。
- source_word: פְּתָיֵהּ
  choice: 宽
  rationale: 该词表示宽度；“宽”符合现代汉语建筑尺寸的通常表达。
theological_decisions:
- issue: 如何称呼 בֵּית אֱלָהָא
  choice: 上帝的殿
  alternative: 上帝的家／上帝的房屋
  rationale: “殿”在现代汉语中准确指向耶路撒冷圣殿，并未加入原文以外的宗派性含义；同时避免把此处误解为普通住所。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语，并保留王室谕旨的正式语气。“就是献祭的地方”以自然汉语呈现原文同源词结构；疑难的根基短语不作无提示的定论，而在脚注中保留其真实歧义。
