  text: וּ/מָ֣ה חַשְׁחָ֡ן וּ/בְנֵ֣י תוֹרִ֣ין וְ/דִכְרִ֣ין וְ/אִמְּרִ֣ין לַ/עֲלָוָ֣ן לֶ/אֱלָ֪הּ שְׁמַיָּ֟/א חִנְטִ֞ין מְלַ֣ח חֲמַ֣ר וּ/מְשַׁ֗ח כְּ/מֵאמַ֨ר כָּהֲנַיָּ֤/א דִי בִ/ירֽוּשְׁלֶם֙ לֶהֱוֵ֨א מִתְיְהֵ֥ב לְ/הֹ֛ם י֥וֹם בְּ/י֖וֹם דִּי לָ֥א שָׁלֽוּ׀׀׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/009.yaml
  text: And whatever is needed—young bulls[a], rams, and lambs for burnt offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests who are in Jerusalem—let it be given to them day by day without fail[b],
translation:
  language: zh_hans
  text: 凡是所需的：献给天上之神作燔祭用的小公牛、公羊和羊羔，以及小麦、盐、酒和油，都要照在耶路撒冷的祭司的指示[a]，每天供给他们，不得有缺漏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“照在耶路撒冷的祭司的话”；也可译作“照在耶路撒冷的祭司的吩咐”。
    reason: 保留 כְּמֵאמַר 的字面表达及其行政语境中的可能译法。
  - marker: b
    text: 也可译作“不可遗漏”或“不可中断”。原文末句强调每日供应不得有缺失或疏漏。
    reason: 说明 דִּי לָא שָׁלוּ 所表达的每日供应不可缺漏的要求。
lexical_decisions:
- source_word: וּמָה חַשְׁחָן
  choice: 凡所需用的
  rationale: 合并表达“凡……所需要的”，自然呈现亚兰文所引出的开放性供应清单，并保留行政命令的语气。
- source_word: בְנֵי תוֹרִין
  choice: 公牛犊
  rationale: 原文是“牛的幼子”这一习语，指适合献祭的年轻公牛；“公牛犊”兼顾年龄与性别。
- source_word: דִכְרִין
  choice: 公羊
  rationale: 该词指雄性绵羊；在献祭清单中译作“公羊”准确而自然。
- source_word: אִמְּרִין
  choice: 羊羔
  rationale: 该词指幼羊；“羊羔”符合现代汉语的献祭语境。
- source_word: לַעֲלָוָן
  choice: 作燔祭
  rationale: 指整只焚烧、烟气上升的祭物；“燔祭”是准确且通行的圣经用语。
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: 献给天上之神
  rationale: 保留以斯拉记亚兰文中“天上之神”的称号，并按献祭关系补出自然的“献给”。
- source_word: חִנְטִין מְלַח חֲמַר וּמְשַׁח
  choice: 小麦、盐、酒和油
  rationale: 逐项保留原文供应品；חִנְטִין 特指小麦，מְשַׁח 仅明说油，不擅自限定为橄榄油。
- source_word: כְּמֵאמַר
  choice: 照……的指示
  rationale: 字面为“照……的话”，在行政命令语境中表示依照祭司所提出的要求或指示；正文采用自然汉语，脚注保留字面信息。
- source_word: דִּי לָא שָׁלוּ
  choice: 不可间断
  rationale: 末句强调每日供应不得停止或中断；此译法与“天天”衔接自然，也保留持续供应的重点。
theological_decisions: []
