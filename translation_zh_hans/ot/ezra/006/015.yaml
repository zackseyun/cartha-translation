base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/015.yaml
  text: And this house was finished by the third day of the month Adar[b][a], which was the sixth year of the reign of King Darius.
translation:
  language: zh_hans
  text: 这殿到亚达月三日完工；那是大流士王在位第六年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשֵׁיצִיא
  choice: 完工
  rationale: 此处阿拉米语动词表示建筑工程完成。译作“完工”自然简洁，并把焦点保留在殿本身，而不补出未明说的建造者。
- source_word: בַּיְתָה דְנָה
  choice: 这殿
  rationale: 原文直译为“这房子”，但在《以斯拉记》的语境中常指圣殿；现代汉语以“这殿”既保留“殿宇”的意象，也清楚表明所指。
- source_word: עַד יוֹם תְּלָתָה
  choice: 在……第三日
  rationale: 介词 עַד 可表示工程持续至该日期，即到该日完成；中文日期叙述以“在……第三日完工”最自然。由于也可较形式地理解为“到……第三日”，以脚注保留此细微差异。
- source_word: לִירַח אֲדָר
  choice: 亚达月
  rationale: 按阿拉米语月份名称音译，并采用现代中文日期表达。
- source_word: דִּי הִיא
  choice: 那是
  rationale: 该关系结构把前述日期与王在位年数相连；“那是”符合自然的现代汉语叙述。
- source_word: שְׁנַת שֵׁת
  choice: 第六年
  rationale: 采用中文纪年惯用的序数表达。
- source_word: לְמַלְכוּת
  choice: 在位
  rationale: 在纪年公式中指君王统治的年数；“在位第六年”是准确而自然的中文表达。
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: 大流士王
  rationale: 保留原文明确的王号，并采用中文圣经传统中通行的人名译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这殿”比直译“这房子”更能让普通读者立即明白所指，同时仍贴近原文在圣殿语境中的用法。以分号连接完工日期与王年纪年，使句意清晰。
