id: EZR.6.21
reference: Ezra 6:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאכְל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל הַ/שָּׁבִים֙ מֵֽ/הַ/גּוֹלָ֔ה וְ/כֹ֗ל הַ/נִּבְדָּ֛ל מִ/טֻּמְאַ֥ת גּוֹיֵֽ הָ/אָ֖רֶץ אֲלֵ/הֶ֑ם לִ/דְרֹ֕שׁ לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/021.yaml
  text: The sons of Israel who had returned from the exile ate, together with everyone who had separated himself from the uncleanness of the peoples of the land to join them, to seek Yahweh, the God of Israel.
translation:
  language: zh_hans
  text: 从流亡中归回的以色列子民[a]，以及所有脱离当地各族的污秽[b]、归到他们中间[c]，为要寻求耶和华——以色列的神的人，都吃了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: “污秽”也可译作“不洁”或“玷污”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“到他们那里”，指归到从流亡中返回的群体中。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: 都吃了
  rationale: 原文只说“吃了”，宾语由上文的逾越节筵席或祭牲自然补足；正文不擅自添加宾语。句末的“都”涵盖两个参与群体。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列子民
  rationale: 既保留希伯来语“以色列之子”的亲族性表达，又避免现代汉语“以色列的儿子们”可能造成仅指男性的误解。
- source_word: הַשָּׁבִים מֵהַגּוֹלָה
  choice: 从流亡中归回的
  rationale: 分词表达归回者的身份；“流亡”比“被掳”更直接对应此处的 גּוֹלָה，同时使用现代自然汉语。
- source_word: וְכֹל הַנִּבְדָּל
  choice: 以及所有脱离……的人
  rationale: 保留尼法勒分词所表达的自行分别、脱离状态，不把这群人预先界定为归信者、外族人或留在当地的以色列人。
- source_word: מִטֻּמְאַת גּוֹיֵי הָאָרֶץ
  choice: 脱离当地各族的污秽
  rationale: “污秽”兼具礼仪和道德色彩；“当地各族”自然表达“这地的诸民”，避免误读为单一民族。
- source_word: אֲלֵהֶם
  choice: 归到他们中间
  rationale: 字面为“到他们那里/向着他们”；在上下文中表示与归回群体联合。正文以自然汉语表达其关系含义，脚注保留字面形式。
- source_word: לִדְרֹשׁ
  choice: 为要寻求
  rationale: 保留 דָּרַשׁ 面向神时较宽广的委身、求问和敬拜含义，不缩窄为单纯“敬拜”或“求问”。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，明确保留专名性质。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列之神
  rationale: 简洁保留原文属格结构及其盟约身份指向。
theological_decisions:
- issue: 额外参与逾越节者的身份
  choice: 按原文描述为脱离当地各族污秽、归到归回群体中并寻求耶和华的人，不进一步界定其族裔身份。
  alternative: 明确称他们为外族归信者，或明确称为留在当地的以色列人。
  rationale: 希伯来文没有明确说明他们究竟是外族归信者还是当地的以色列人；直译其行为和关系可保留这种开放性。
- issue: אֲלֵהֶם 与句法关系
  choice: 理解为这些人与归回者联合，译作“归到他们中间”。
  alternative: 仅译作字面的“到他们那里”，或略去不译。
  rationale: 代词在原文中明确存在，不能略去；结合“分别离开……到他们那里”的方向结构，表达加入归回群体最符合语境，但脚注仍提供字面形式，避免把解释伪装成唯一可能。
- issue: “寻求耶和华”的含义
  choice: 保留“寻求”，不改写为“敬拜”或“归信”。
  alternative: 译为“敬拜耶和华”或“归信耶和华”。
  rationale: “寻求”可涵盖敬拜、求问和忠诚转向，原文没有把其意义限制为其中一项。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。主句按汉语习惯把两个参与群体并列后统一落在“都吃了”上；不补出原文省略的逾越节祭牲或筵席。用“子民”兼顾源语表达与现代读者理解，并以脚注交代字面形式。
