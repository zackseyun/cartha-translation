  text: with three layers of dressed stone and one layer of new timber[b][a], and let the cost be given from the king’s house.
translation:
  language: zh_hans
  text: 要用三层修整过的石料[a]和一层新木料建造；费用要从王库[b]拨付。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“三层凿好的石料”。“层”也可指建筑中的“砌层”。
    reason: lexical_alternative
  - marker: b
    text: “王库”原文直译为“王的家”；在这里很可能指王家的库房或王室经费。
    reason: cultural_note
lexical_decisions:
- source_word: נִדְבָּכִין / נִדְבָּךְ
  choice: 层
  rationale: 该词指建筑结构中的层或砌层；“层”简明自然，也适用于石料和木料。
- source_word: אֶבֶן גְּלָל
  choice: 加工过的石头
  rationale: 在建筑语境中，这一词组很可能指经过整形或凿制的石料；译文避免采用容易被误解为石头滚动的字面表达，同时以脚注保留“凿好的石头”这一近义译法。
- source_word: תְּלָתָא
  choice: 三
  rationale: 基数词，修饰前面的建筑砌层。
- source_word: אָע חֲדַת
  choice: 新木料
  rationale: אָע 指木材；在建筑语境中，“木料”比“木头”更准确自然，חֲדַת 的“新”也予以保留。
- source_word: נִפְקְתָא
  choice: 费用
  rationale: 该名词指支出或工程开销；“费用”符合行政命令的语体。
- source_word: מִן בֵּית מַלְכָּא
  choice: 由王室
  rationale: 原文直译为“从王的家”；“王室”保留这一表达的宽泛性，不在正文中直接限定为王宫或国库，脚注说明其语境含义。
- source_word: תִּתְיְהִב
  choice: 要……拨付
  rationale: 该被动形式表示费用应当被供给；“要……拨付”既体现诏令语气，也符合现代汉语财政语境。
