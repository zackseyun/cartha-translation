  text: דִּֽי לֶהֱוֺ֧ן מְהַקְרְבִ֛ין נִיחוֹחִ֖ין לֶ/אֱלָ֣הּ שְׁמַיָּ֑/א וּ/מְצַלַּ֕יִן לְ/חַיֵּ֥י מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/010.yaml
  text: so that they may offer pleasing aromas to the God of heaven and pray for the life of the king and his sons[a][b].
translation:
  language: zh_hans
  text: 好让他们向天上的上帝献上馨香的祭物[a]，并为王和他的儿子们的生命祷告[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“悦人的香气”或“馨香”。亚兰文此词指蒙悦纳的祭物所发、令人喜悦的香气。
    reason: lexical_alternative
  - marker: b
    text: 或译“为王和他的儿子们的福祉祷告”。原文直译为“为王和他的儿子们的生命祷告”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי
  choice: 好让
  rationale: 此处引出目的，承接王所供应的一切；“好让”自然表达目的关系。
- source_word: לֶהֱוֺן מְהַקְרְבִין
  choice: 他们……献上
  rationale: 系词与分词连用，在目的从句中表达持续或预期的行动；汉语用“他们……献上”即可自然传达。קרב在祭祀语境中指献祭。
- source_word: נִיחוֹחִין
  choice: 馨香之祭
  rationale: 该词字面涉及蒙悦纳祭物所发的馨香。译作“馨香之祭”既保留祭祀意象，又避免让读者误以为所献的只是香气。
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: 向天上的上帝
  rationale: 介词在献祭语境中表示对象；“天上的上帝”保留《以斯拉记》中这一称号。
- source_word: וּמְצַלַּיִן
  choice: 并……祷告
  rationale: 表示向上帝祈祷；“并”准确连接献祭与祷告两个目的。
- source_word: לְחַיֵּי
  choice: 为……的性命
  rationale: 原文直译为“为……的生命”。在王室语境中也可指平安或福祉，但正文保留较具体的生命含义，并以脚注说明语义范围。
- source_word: מַלְכָּא
  choice: 王
  rationale: 原词是通常意义的“王”；虽指波斯君王，仍不扩译为“皇帝”。
- source_word: וּבְנוֹהִי
  choice: 和他众子
  rationale: 原文明确为阳性复数“他的儿子们”；“众子”简洁、庄重，并保留性别所指。
theological_decisions:
- issue: 波斯王诏令中祭祀用语 נִיחוֹחִין 的表达
  choice: 馨香之祭
  alternative: 悦纳的香气；馨香；蒙悦纳的祭物
  rationale: 保留祭物香气蒙上帝悦纳的礼仪意象，同时不把原文简化成一般性的“祭物”，也不加入后来的神学术语。
- issue: 为王及其儿子祷告的内容
  choice: 为王和他众子的性命祷告
  alternative: 为王和他众子的福祉祷告
  rationale: 正文贴近 חַיֵּי 的字面意义“生命”，不排除在此语境中所包含的平安、长寿与福祉含义；脚注保留这一解释空间。
- issue: 王的后代所用性别词
  choice: 他众子
  alternative: 他的儿女；他的孩子们
  rationale: 原文特指儿子，故不作性别中和处理。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“馨香之祭”保留圣殿献祭意象；“众子”比“儿子们”更凝练，适合诏令语境，但仍为现代读者所理解。所有脚注标记均已置于正文相应位置。
