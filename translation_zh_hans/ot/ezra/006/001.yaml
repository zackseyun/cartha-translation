base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/001.yaml
  text: Then King Darius issued a decree[a], and they searched in the house of the archives, where the treasures were stored[c][b], there in Babylon.
translation:
  language: zh_hans
  text: 于是，大流士王下令[a]；他们便在巴比伦的档案库[b]中查找，宝物[c]存放在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“大流士王颁布谕令，并有人在档案库中查找。”亚兰文较直译为“立下命令”，并使用第三人称复数动词“他们查找”；这个复数形式也可能是不明确指出执行者的用法。
    reason: alternative_reading
  - marker: b
    text: “档案库”直译为“书卷（或文书）之屋”，指存放官方记录的地方。
    reason: lexical_alternative
  - marker: c
    text: “宝物”也可较宽泛地理解为收藏起来的贵重物、储藏物或寄存物。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 这是推进叙事的亚兰语连接词；“于是”自然地表达前后事件的承接。
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: 大流士王
  rationale: 按现代汉语习惯将王号置于人名之后，同时准确音译该王的名字。
- source_word: שָׂם טְעֵם
  choice: 下令
  rationale: 原文直译近于“立下命令／谕令”；“下令”符合君王行政语境，简洁而不增添命令内容。
- source_word: וּבַקַּרוּ
  choice: 他们便……查找
  rationale: 保留原文第三人称复数主动形式；主语在语境中未明说，“他们”不把身份具体化。
- source_word: בְּבֵית סִפְרַיָּא
  choice: 在……档案库中
  rationale: 字面为“书卷／文书之屋”，在行政语境中指保存官方文书的档案处；“档案库”是清楚自然的现代汉语表达。
- source_word: גִנְזַיָּא
  choice: 宝物
  rationale: 该词可指收藏起来的财宝、贵重物或储藏物；正文保留其基本词义，不擅自限定为文书。
- source_word: מְהַחֲתִין
  choice: 存放
  rationale: 原词是表示被放置、被收藏之结果状态的被动分词；“存放”符合档案库或库藏的语境。
- source_word: תַּמָּה בְּבָבֶל
  choice: 在巴比伦……就存放在那里
  rationale: 保留原文明确的地点成分及“那里”的复指，表明查找和存放所涉及的地点在巴比伦。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是……便……”体现叙事承接；分号区分君王下令与随后执行查找两个动作。正文保留第三人称复数“他们”和“宝物”的词义张力，不明确补出执行者身份，也不把宝物解释成特定种类的物品。
