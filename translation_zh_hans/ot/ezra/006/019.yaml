base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/019.yaml
  text: And the sons of the exile kept the Passover on the fourteenth day of the first month[a].
translation:
  language: zh_hans
  text: 被掳之民[a]在第一个月十四日守了逾越节。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“被掳者之子”，也可译作“被掳的人”。这是表示群体归属的说法，并非只指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 守了
  rationale: עָשָׂה本义为“做、举行”；以“逾越节”为宾语时，指按礼仪守节。译作“守了”符合现代汉语宗教礼仪用语，也保留叙事中的完成意味。
- source_word: בְנֵי הַגּוֹלָה
  choice: 被掳之民
  rationale: 希伯来语直译为“被掳者之子”，是表示群体归属的习语，并非只指男性后代。“被掳之民”既保留其共同体身份，也避免擅自补入本节未明说的“归回”。
- source_word: הַפָּסַח
  choice: 逾越节
  rationale: 该词在此概括逾越节的礼仪与庆守；不限定为祭牲、筵席或节期中的某一个层面。
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: 在第一个月十四日
  rationale: 按希伯来日期表达准确译出月份与日子。“第一个月”比现代汉语的“一月”更不易被误解为公历一月，也比“正月”少引入中国历法色彩。
