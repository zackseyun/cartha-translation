  text: וַ/הֲקִ֨ימוּ כָהֲנַיָּ֜/א בִּ/פְלֻגָּתְ/ה֗וֹן וְ/לֵוָיֵ/א֙ בְּ/מַחְלְקָ֣תְ/ה֔וֹן עַל עֲבִידַ֥ת אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם כִּ/כְתָ֖ב סְפַ֥ר מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/018.yaml
  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
translation:
  language: zh_hans
  text: 他们安排祭司按各自的班次、利未人按各自的班组[a]就位，负责在耶路撒冷侍奉上帝的职务，按照《摩西书》所写的规定。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “班次”和“班组”所译的两个亚兰语词都指分组或编制单位，含义十分接近；两处也都可译作“班次”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“照《摩西书》所写的去做”。“《摩西书》”也可译作“摩西的书卷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִימוּ
  choice: 他们使……就位
  rationale: 使役形动词的基本意思是“使站立、使就位”，在这里指把圣职人员按规定编排并安置到职分上；此译法兼顾具体语义与上下文中的任职含义。
- source_word: כָהֲנַיָּא
  choice: 祭司
  rationale: 准确表达亚兰语中指圣殿祭司群体的定指名词。
- source_word: בִּפְלֻגָּתְהוֹן
  choice: 按各自的班次
  rationale: 该词指划分出来的部分或编制单位；“班次”符合祭司轮班供职的语境，也为现代读者所能理解。
- source_word: וְלֵוָיֵא
  choice: 利未人
  rationale: 这是对在圣殿中承担相关职务之利未群体的标准译法。
- source_word: בְּמַחְלְקָתְהוֹן
  choice: 按各自的班组
  rationale: 该词同样表示分组或编制；译作“班组”既保留与前一组织术语的细微形式差别，也避免暗示原文明确规定了两者完全相同的制度。
- source_word: עַל עֲבִידַת אֱלָהָא
  choice: 负责……侍奉上帝
  rationale: 介词 עַל 可表达负责、主管某项工作，עֲבִידָה 在圣殿语境中是供职、服侍；该译文自然地表达他们被安排承担圣殿职务。
- source_word: דִּי בִירוּשְׁלֶם
  choice: 在耶路撒冷
  rationale: 关系结构限定的是上帝的侍奉，即在耶路撒冷进行的圣殿供职；中文不必机械补出关系代词。
- source_word: כִּכְתָב
  choice: 照……所写的去做
  rationale: 该结构表达依照书面规定；补出“去做”使中文句法完整，并明确全句的安排遵照所记载的规范。
- source_word: סְפַר מֹשֶׁה
  choice: 《摩西书》
  rationale: סְפַר 可指书卷或书面文献；“《摩西书》”保留原文称谓，不进一步断定其具体范围或构成。
theological_decisions:
- issue: 祭司和利未人的编排与摩西书面规定之间的关系
  choice: 译为他们的就位和供职是“照《摩西书》所写的”办理
  alternative: 仅把末句理解为一般性提到传统习惯
  rationale: 末尾短语明确诉诸书面记载作为安排的准则；译文保留这一规范性联系，但不扩展为原文没有陈述的正典范围、成书过程或作者理论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“使……就位”保留使役动词的形象与任职语境；“负责……侍奉上帝”避免生硬直译，同时不把圣殿职务扩展成后来的宗派制度术语。
