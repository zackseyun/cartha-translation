base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/006.yaml
  text: Now Tattenai[a], governor of the province Beyond the River, Shethar-bozenai, and your associates, the officials of Persia who are in Beyond the River[c][b], keep far away from there.
translation:
  language: zh_hans
  text: 现在，河西[b]总督达乃、示他·波斯乃，以及你们的同僚——住在河西的亚法萨迦人[a]——都要离那里远远的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚法萨迦人”是音译；原词所指不完全确定，也可能指波斯的官员或行政人员。
    reason: alternative_reading
  - marker: b
    text: “河西”是波斯帝国对幼发拉底河以西辖区的行政称呼；“离那里远远的”直译为“要离那里远远的”。
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: כְּעַן
  choice: 现在
  rationale: 作为亚兰语篇章标记，引出王针对前文奏报所下的命令；“现在”自然保留转折推进，不额外强化因果关系。
- source_word: תַּתְּנַי
  choice: 达乃
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: 河西总督
  rationale: פַּחַת 指帝国行政体系中的总督；עֲבַר נַהֲרָה 是从波斯帝国中心视角所称的幼发拉底河以西地区。“河西总督”简洁表达官职与辖区，相关行政背景置于脚注。
- source_word: שְׁתַר בּוֹזְנַי
  choice: 示他·波斯乃
  rationale: 专名采用音译，并以间隔号呈现复合人名。
- source_word: וּכְנָוָתְהוֹן
  choice: 以及他们的同僚
  rationale: 名词表示同伴、同僚；后缀为第三人称阳性复数，故依原文译为“他们的”，指前述达乃和示他·波斯乃的同僚。
- source_word: אֲפַרְסְכָיֵא
  choice: 亚法萨迦人
  rationale: 该词的确切所指有争议，可能是族群或行政人员称号。正文音译以保留不确定性，脚注说明另一种理解，避免把“波斯官员”作为唯一确定释义。
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: 就是河西的
  rationale: 关系从句说明这些同僚或亚法萨迦人所在的地区；中文用“就是……的”自然表达同位说明。
- source_word: רַחִיקִין הֲוֹו מִן תַּמָּה
  choice: 你们都要远离那里
  rationale: 这是带命令效力的表述，字面为“要离那里远远的”。译文保留“那里”而不擅自明确为圣殿、耶路撒冷或建造工程。
