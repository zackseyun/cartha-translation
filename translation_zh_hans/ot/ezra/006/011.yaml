source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל אֱנָ֗שׁ דִּ֤י יְהַשְׁנֵא֙ פִּתְגָמָ֣/א דְנָ֔ה יִתְנְסַ֥ח אָע֙ מִן בַּיְתֵ֔/הּ וּ/זְקִ֖יף יִתְמְחֵ֣א עֲלֹ֑/הִי וּ/בַיְתֵ֛/הּ נְוָל֥וּ יִתְעֲבֵ֖ד עַל דְּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/011.yaml
  text: 'And from me a decree is issued: if any man alters this edict[a], a beam shall be pulled out from his house, and he shall be impaled on it[c][b]; and his house shall be made a refuse heap because of this.'
translation:
  language: zh_hans
  text: 我又降旨：任何人若更改这道谕令，就要从他的房屋中抽出一根木梁，将他刺在梁上[a]；他的房屋也要因此变成垃圾堆[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将他挂在上面”或“将他固定在上面”。原文所指的刑罚很可能是将人穿刺在木梁上。
    reason: alternative_reading
  - marker: b
    text: 传统译作“粪堆”。这个词可指污秽、可耻的废物堆。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  choice: 降旨
  rationale: 这是王室行政用语，字面为“设立命令”。“降旨”在中文中自然、庄重，也清楚表达君王正式颁布命令。
- source_word: יְהַשְׁנֵא
  choice: 更改
  rationale: 本词在此指改动、篡改诏令的内容，而不只是违抗命令；“更改”保留了这一含义。
- source_word: פִּתְגָמָא
  choice: 谕令
  rationale: 该亚兰语词在帝国行政语境中指正式发布的话语或命令。“谕令”既体现官方性质，也符合现代中文的庄重语体。
- source_word: יִתְנְסַח אָע מִן בַּיְתֵהּ
  choice: 从他的房屋中抽出一根木梁
  rationale: 原文具体描写从犯人的房屋拆出木料。“木梁”符合房屋结构语境，“抽出”表达将其拆除取出的动作。
- source_word: וּזְקִיף יִתְמְחֵא עֲלֹהִי
  choice: 将他刺在梁上
  rationale: 原文描写犯人被举起并置于木梁上受刑，最可能指古代的穿刺刑。“刺在梁上”保留刑罚的残酷性质，同时以脚注注明“挂在上面”等可能译法。
- source_word: נְוָלוּ
  choice: 垃圾堆
  rationale: 本词表示污秽、可耻的废物堆或废墟。“垃圾堆”是清楚自然的现代中文；传统的“粪堆”译法列于脚注。
- source_word: יִתְעֲבֵד
  choice: 变成
  rationale: 原文为被动或非人称表达，表示房屋受惩罚而被弄成污秽废堆；中文用“变成”能自然表达结果。
- source_word: כָל אֱנָשׁ
  choice: 任何人
  rationale: 原文是泛指任何犯令者。现代汉语“任何人”准确表达其普遍范围，不必使用带有不必要性别限定的措辞。
theological_decisions:
- issue: 帝国刑罚用语所指的处刑方式
  choice: 正文译为“将他刺在梁上”
  alternative: “将他挂在上面”或“将他固定在上面”
  rationale: 亚兰语措辞涉及把犯人举起并置于从其房屋抽出的木梁上，最可能指穿刺示刑，但动词本身也容许悬挂或固定的理解。正文采用历史语境中较可能的刑罚方式，脚注保留原文的解释空间，避免把含义限定得过死。
translation_notes:
  register: 采用现代、庄重而易懂的王室诏令语体。“我又降旨”体现第一人称君王命令；后半句保持法律惩罚条款简洁有力。正文不淡化古代刑罚的严酷，也以脚注保留处刑动词及“垃圾堆／粪堆”的词义幅度。
