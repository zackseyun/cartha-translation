  text: the sons of Lebanah[a], the sons of Hagabah, the sons of Akkub.
translation:
  language: zh_hans
  text: 利巴拿的子孙[a]，哈迦巴的子孙，亚谷的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“……的众子”；这里也可指某一家族或宗族的成员，并不只指亲生儿子。
    reason: 说明 בְּנֵי 在名册语境中的语义范围。
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 在这份归回者名册中，该词用于家族或宗族成员，不限于某人的亲生儿子；“子孙”既保留谱系表达，也比“儿子们”更符合现代汉语语境。三次重复，以保留原文名册的平行结构。
- source_word: לְבָנָה
  choice: 利巴拿
  rationale: 按希伯来语音译为人名或家族名；采用现代中文圣经中自然、易读的音译形式。
- source_word: חֲגָבָה
  choice: 哈迦巴
  rationale: 按马所拉文本的读音音译，不翻译其可能关联的普通词词义。
- source_word: עַקּוּב
  choice: 亚谷
  rationale: 按希伯来语人名音译，并采用中文圣经读者较熟悉的形式；原文中的辅音加倍不必在汉字音译中机械体现。
