id: EZR.2.2
reference: Ezra 2:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲשֶׁר בָּ֣אוּ עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְ֠חֶמְיָה שְׂרָיָ֨ה רְֽעֵלָיָ֜ה מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפָּ֥ר בִּגְוַ֖י רְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/002.yaml
  text: 'who came with Zerubbabel: Jeshua[a], Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah[d][c][b]. The number of the men of the people of Israel:'
translation:
  language: zh_hans
  text: 他们与所罗巴伯一同前来；同行的有耶书亚、尼希米、西莱雅、利来雅[a]、末底改、必珊、米斯拔[b]、比革瓦伊、利宏[c]和巴拿。以色列民中男丁的数目如下：[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在平行名单尼希米记7:7中，“利来雅”作“拉米雅”。
    reason: alternative_reading
  - marker: b
    text: 在平行名单尼希米记7:7中，“米斯拔”作“米斯毗列”。
    reason: alternative_reading
  - marker: c
    text: 在平行名单尼希米记7:7中，“利宏”作“尼宏”。
    reason: alternative_reading
  - marker: d
    text: 这句话引出下一节开始列出的各项人数。
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר בָּאוּ עִם
  choice: 他们与……一同前来
  rationale: 按原文表达“前来并同行”，不把 בָּאוּ 解释性地译成“归回”；关系从句承接上一节，在中文中补出“他们”更自然。
- source_word: זְרֻבָּבֶל
  choice: 所罗巴伯
  rationale: 采用现代中文圣经读者熟悉的专名译法。
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 依希伯来文名称形式音译，并与通常译作“约书亚”的形式有所区分。
- source_word: נְחֶמְיָה
  choice: 尼希米
  rationale: 采用通行中文专名译法。
- source_word: שְׂרָיָה
  choice: 西莱雅
  rationale: 按马所拉文本的名字形式翻译，不以平行名单中的异名替换正文。
- source_word: רְעֵלָיָה
  choice: 利来雅
  rationale: 按本节马所拉文本音译；尼希米记7:7的不同形式置于脚注。
- source_word: מָרְדֳּכַי
  choice: 末底改
  rationale: 采用通行中文专名译法。
- source_word: בִּלְשָׁן
  choice: 必珊
  rationale: 采用简明且通行的中文音译。
- source_word: מִסְפָּר
  choice: 米斯拔
  rationale: 此处是人名，不按同形普通名词“数目”翻译；平行名单的不同形式置于脚注。
- source_word: בִּגְוַי
  choice: 比革瓦伊
  rationale: 采用通行中文专名译法。
- source_word: רְחוּם
  choice: 利宏
  rationale: 按本节马所拉文本音译；尼希米记7:7的不同形式置于脚注。
- source_word: בַּעֲנָה
  choice: 巴拿
  rationale: 采用通行中文专名译法。
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: 以色列民中男丁的数目如下
  rationale: 保留 מִסְפַּר 的“数目”及 אַנְשֵׁי 的男性群体含义；补出“如下”以自然引出后续逐项统计。
theological_decisions:
- issue: בָּאוּ 是否译作“归回”
  choice: 前来
  alternative: 归回
  rationale: 流亡归回是上下文背景，但该动词本身只表示“来”；正文不将背景含义直接并入词义。
- issue: אַנְשֵׁי 的群体范围
  choice: 男丁
  alternative: 人／人民
  rationale: 该词是 אִישׁ 的复数构造形式，在人口登记标题中明确指男性成员；“男丁”既体现性别，也符合名单统计语境，但不延伸说明统计制度。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。以分号和“同行的有”理清关系从句与人名长列，同时保留原文“与所罗巴伯一同前来”的结构。专名以简体中文圣经传统中较易辨认的译法为主；所有异名信息均留在脚注，不改动马所拉文本正文。
