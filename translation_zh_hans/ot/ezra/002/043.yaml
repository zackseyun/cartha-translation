base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/043.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[c][b], the sons of Tabbaoth.'
translation:
  language: zh_hans
  text: 殿役：[a]西哈的子孙、哈苏法的子孙、答巴俄的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文音译作“尼提宁”，指一类被指定从事圣所服役的人；传统上也常直接采用这一音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: 殿役人员
  rationale: 该词是被指定从事圣所事务的一类人的专称；译出其职能，比音译更便于现代读者理解，同时保留其群体身份。
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 本节处于宗族名录中，该复数构式可指某人的后裔或宗族成员，并不必限于亲生儿子；译作“子孙”符合此处语境。
- source_word: צִיחָא
  choice: 西哈
  rationale: 按希伯来语读音音译此人名或宗族名。
- source_word: חֲשׂוּפָא
  choice: 哈苏法
  rationale: 按希伯来语读音音译；其中 שׂ 为 /s/ 音，故译作“苏”而非“舒”。
- source_word: טַבָּעוֹת
  choice: 答巴俄
  rationale: 此词在名录中用作人名或宗族名，故按读音音译，不按其普通名词含义翻译。
theological_decisions: []
