  text: וְ/אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָֽ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֥ר הֶגְלָ֛ה נבוכדנצור מֶֽלֶךְ בָּבֶ֖ל לְ/בָבֶ֑ל וַ/יָּשׁ֛וּבוּ לִ/ירוּשָׁלִַ֥ם וִֽ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/001.yaml
  text: These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon, and they returned to Jerusalem and Judah[c][b], each to his own city.
translation:
  language: zh_hans
  text: 以下是本省的人[a]，他们从被掳流亡之中[b]上来；他们曾被巴比伦王尼布甲尼撒掳到巴比伦，并回到耶路撒冷和犹大，各归本城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “本省的人”直译是“这省的儿子们”，是指属于该省的人。
    reason: lexical_alternative
  - marker: b
    text: 原文的表达较为丰满，直译近似“从流亡者的囚禁中”；也可译作“从被掳之中”或“从流亡中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: 本省的子民
  rationale: בְּנֵי 字面为“儿子们”，在此是表示群体成员的希伯来语习语；“子民”既保留原文的亲属性表达色彩，也能让现代汉语读者自然理解为该省的人。מְדִינָה 在波斯时期语境中指行政省份，故译“省”。
- source_word: הָעֹלִים
  choice: 上来
  rationale: 保留原文 עלה 的上行意象，避免提前用“返回”取代它，因为后文 וַיָּשׁוּבוּ 明确表达“返回”。
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: 从被掳流亡的境况中
  rationale: 原文叠用 שְׁבִי（被掳、囚禁）与 גּוֹלָה（流亡、被迁徙者群体）。正文以自然汉语同时呈现两层含义，脚注说明其较直译的结构。
- source_word: הֶגְלָה
  choice: 掳到
  rationale: גלה 的使役式表示强制迁徙、使人流亡；“掳到”自然地表达行动的强制性及其目的地。
- source_word: נבוכדנצור
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经与历史叙述中通行的人名译法。
- source_word: וַיָּשׁוּבוּ
  choice: 后来回到
  rationale: שׁוּב 明确表示返回；“后来”体现叙事顺序，但不赋予额外的神学含义。
- source_word: לִירוּשָׁלַם וִיהוּדָה
  choice: 回到耶路撒冷和犹大
  rationale: 直接保留原文并列的两个目的地，不将耶路撒冷并入“犹大”而省略。
- source_word: אִישׁ לְעִירוֹ
  choice: 各归本城
  rationale: אִישׁ 在此具逐一分配的含义；“各归本城”简洁、庄重，并保留每个人返回所属城邑的意思。
theological_decisions: []
