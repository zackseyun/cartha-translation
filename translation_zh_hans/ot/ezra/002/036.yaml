  yaml_path: translation/ot/ezra/002/036.yaml
  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], 973.'
translation:
  language: zh_hans
  text: 祭司：耶大雅的子孙[a]，属耶书亚家[b]的，共973人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“耶大雅的儿子们”；在族谱和名册中，这种说法通常也可指“耶大雅的后裔”。
    reason: lexical_alternative
  - marker: b
    text: “耶书亚”是被掳归回时期使用的人名，与“约书亚”这一名字相关。
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 定冠词加复数名词，意为“祭司们”；在名单中用“祭司”作为类别标题，简洁自然。
- source_word: בְּנֵי
  choice: 子孙
  rationale: 字面是“儿子们”，但在族谱和名册语境中通常指后裔或宗族成员；“子孙”既保留谱系含义，又避免误解为仅仅亲生儿子。
- source_word: יְדַעְיָה
  choice: 耶大雅
  rationale: 按现代中文圣经人名的通行音译处理该希伯来人名。
- source_word: לְבֵית
  choice: 属……家
  rationale: 介词 לְ 与“家、家族”连用，在此表示家族归属；译作“属……家”符合中文名册语体。
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 按该被掳归回时期名字的希伯来语形式音译，并与相关名字“约书亚”有所区别。
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: 共973人
  rationale: 原文数词合计973；用阿拉伯数字便于阅读，并补出中文名单中自然且由语境明确的量词“人”。
theological_decisions: []
