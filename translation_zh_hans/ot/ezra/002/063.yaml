base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/063.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b][c].
translation:
  language: zh_hans
  text: 省长[a]对他们说，他们不可吃至圣之物[b]，直到有一位能借着乌陵和土明[c]求问的祭司出现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“提尔沙塔”，这是一个波斯行政官衔。
    reason: lexical_alternative
  - marker: b
    text: 指被视为至圣、归祭司食用的祭物份额，不是作为地点的“至圣所”。
    reason: cultural_note
  - marker: c
    text: 乌陵和土明是祭司求问时使用的神圣媒介；其具体形制和使用程序并不确定。
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: 省长
  rationale: 这是源自波斯行政体系的官衔。译作“省长”能向现代读者清楚传达其职务；传统音译“提尔沙塔”则保留在脚注中。
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: 他们不可吃
  rationale: 该结构引出省长所下命令的内容。“不可吃”自然、庄重，并保留禁令语气。
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: 至圣之物
  rationale: 此处所说的是可供祭司食用、被视为至圣的祭物份额，而非称为“至圣所”的空间。“至圣之物”既保留最高级意味，也符合吃食的上下文。
- source_word: עַד עֲמֹד כֹּהֵן
  choice: 直到有一位……祭司出现
  rationale: עַד加不定式表示禁令持续到将来的某一时点。“出现”在现代汉语中自然地表达所期待的祭司来到或任职，避免把“站起来”误解为单纯的身体动作。
- source_word: לְאוּרִים וּלְתֻמִּים
  choice: 带着乌陵和土明
  rationale: “乌陵和土明”是祭司求问所涉及的专门名称，其具体形制并不确定，因此采用传统音译。“带着”自然表达祭司具备这些求问媒介，同时不过度规定其使用方式。
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים在本节所指为何
  choice: 指归祭司食用的至圣祭物份额
  alternative: 指作为地点的至圣所
  rationale: 上下文讨论祭司家谱有疑问者是否可以吃祭司所得的圣物；动词“吃”表明这里不是指进入圣所。
- issue: 如何处理乌陵和土明
  choice: 保留音译，并以脚注简述其求问功能
  alternative: 按词源意译为“光明和完全”，或在正文中具体说明其形制和操作程序
  rationale: 这些名称的具体所指、形制和使用程序并不完全确定。音译可保留礼仪专名及历史上的不确定性，避免加入经文本身未明确说明的解释。
- issue: 祭司“带着”乌陵和土明的含义
  choice: 正文保留较宽泛的关系表达
  alternative: 明确译作“能凭乌陵和土明求问的祭司”
  rationale: 介词לְ可在语境中表达祭司与乌陵、土明相配合的关系。正文用“带着”保留原文的简约与一定歧义，求问功能则由脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和行政语体。“不可吃”体现正式禁令；“至圣之物”保持祭祀术语的庄严感，同时由脚注排除空间意义；“乌陵和土明”沿用简体中文圣经传统中通行的音译。
