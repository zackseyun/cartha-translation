lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: 全会众
  rationale: כָּל与带定冠词的קָהָל合用，表示整个聚集的群体。“全会众”简洁自然，并保留整体性；此处不必译作带有较强宗派色彩的称谓。
- source_word: כְּאֶחָד
  choice: 合在一起
  rationale: 该短语字面是“如同一体／如同一人”，在这里说明全体合计的人数。“合在一起”既自然地表达共同计算，也保留群体合一的措辞；字面译法收入脚注。
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת שִׁשִּׁים
  choice: 四万二千三百六十
  rationale: 按希伯来文数词结构直译：四个万、二千、三百、六十，合计四万二千三百六十。
- source_word: קָהָל
  choice: 会众
  rationale: 该词指聚集起来的共同体。“会众”是现代汉语圣经语境中清楚、庄重而易懂的称呼，在此指归回者的整体。
