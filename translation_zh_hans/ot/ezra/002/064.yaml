  text: The whole assembly together was forty-two thousand three hundred sixty,[a]
translation:
  language: zh_hans
  text: 全会众合在一起，共有四万二千三百六十人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “合在一起”直译为“如同一体”。
