lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在以斯拉记第二章的归回者名册中，这个词指以某位先祖或族长为名的后裔群体；“子孙”比字面上的“儿子们”更自然，也准确表达宗族含义。
- source_word: בִגְוָי
  choice: 比革瓦伊
  rationale: 这是人名或宗族名，按希伯来语音译，并采用中文圣经读者较熟悉的译名形式。
- source_word: אַלְפַּיִם חֲמִשִּׁים וְשִׁשָּׁה
  choice: 二千零五十六
  rationale: 希伯来语以相加结构表达总数；中文名册通常将其自然合写为“二千零五十六”。
- source_word: ס
  choice: 不译
  rationale: 这是马所拉文本的段落标记（闭段记号），属于版面与抄写传统信息，不是经文句法内容。
