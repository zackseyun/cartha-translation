  text: 歌唱者：亚萨的子孙，一百二十八人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: 歌唱的人
  rationale: 该词是动词 שׁיר（歌唱）的分词复数，在这份名册中指承担歌唱职分的人。“歌唱的人”直接、自然；译作“乐师”范围过宽，译作“圣殿歌唱者”则加入了本节未明说的限定。
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在家族及职分群体的名册中，בְּנֵי 可指某人的后裔或所属谱系。“子孙”既保留与亚萨的宗族关系，也避免现代汉语“儿子”容易造成仅指亲生第一代的误解。
- source_word: אָסָף
  choice: 亚萨
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: 一百二十八人
  rationale: 希伯来文数字依次为一百、二十和八；加量词“人”符合现代汉语名册语境，也清楚表明这是人数。
