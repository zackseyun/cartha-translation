  text: 巴可斯的子孙，西西拉的子孙，答玛的子孙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 在归回者的族谱名单中，这是引出家族或宗族的固定结构；译作“子孙”既表达血缘后裔，也比逐字译作“儿子”更符合此处群体名单的语境。
- source_word: בַרְקוֹס
  choice: 巴科斯
  rationale: 这是人名，按希伯来语辅音和元音音译；采用现代汉语中清楚、自然的音译形式。
- source_word: סִיסְרָא
  choice: 西西拉
  rationale: 这是人名，采用汉语圣经传统中通行且易于辨认的音译；此处仅指一个家族的先祖。
- source_word: תָמַח
  choice: 提玛
  rationale: 这是人名；马所拉文本的元音读法近于 Temah，因此译作“提玛”，不因英语音译变体而改变希伯来语依据。
theological_decisions: []
