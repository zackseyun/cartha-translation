  text: the sons of Uzza[a], the sons of Paseah, the sons of Besai.
translation:
  language: zh_hans
  text: 乌撒的子孙[a]、巴西亚的子孙、比赛的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“……的子孙”也可泛指某人的家族或后裔，不一定只是其亲生儿子。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 这是בֵּן（儿子）的复数构造形式；在以斯拉记的归回者名录中，常指以某人为祖先的家族或后裔，而不只指亲生儿子。译作“子孙”既保留谱系关系，也符合现代汉语名录的自然表达。
- source_word: עֻזָּא
  choice: 乌撒
  rationale: 按希伯来语专名音译；“乌撒”是简体中文圣经语境中自然、常见的译名形式。
- source_word: פָסֵחַ
  choice: 巴西亚
  rationale: 按希伯来语专名音译，并采用现代汉语中易读且较为通行的圣经人名形式。
- source_word: בֵסָי
  choice: 比赛
  rationale: 按希伯来语专名音译；末尾י体现为近似-i的音，采用中文圣经传统中较熟悉的“比赛”。
