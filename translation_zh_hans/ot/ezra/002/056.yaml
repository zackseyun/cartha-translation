  text: 雅拉的子孙，达昆的子孙，吉德的子孙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 这是בֵּן的复数附属形式；在归回者和圣殿仆役的名册中，表示以某位祖先为名的家族后裔。译作“……的子孙”既符合现代汉语名册表达，也比逐字译作“……的儿子们”更准确地传达群体世系含义。
- source_word: יַעְלָה
  choice: 雅拉
  rationale: 按希伯来语读音音译人名，并采用简洁、通行的中文圣经人名形式。
- source_word: דַרְקוֹן
  choice: 达昆
  rationale: 按希伯来语读音音译该人名或家族祖名，不按可能的词源含义意译。
- source_word: גִדֵּל
  choice: 吉德
  rationale: 按希伯来语读音音译该人名或家族祖名；上下文表明这里指以此人为祖名的后裔群体。
