  rationale: 这是专名，按现代中文圣经人名的常见音译处理，不按可能的词源含义意译。
- source_word: חֲטִיפָא
  choice: 哈提法
  rationale: 这是专名，采用贴近希伯来语形式且便于现代汉语读者辨认的音译，不强行赋予词义。
