    text: 或译：“以拦的子孙，另一族。”这里的“另一位／另一族”用以区别本章前面列出的以拦一族。
    reason: 原文的“另一”用于区别此处的以拦条目与前文的同名条目；其具体所指可按“另一位名叫以拦者”或“另一族”理解。
lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在家谱和人口名册中，这个构造复数通常指某人的后裔或所属宗族；“子孙”比直译“儿子们”更符合现代汉语，同时保留谱系含义。
- source_word: עֵילָם
  choice: 以拦
  rationale: 按通行的圣经专名译法音译；本节指归回者名册中的人名或宗族名。
- source_word: אַחֵר
  choice: 另一个
  rationale: 该词用于将本组“以拦”与本章先前列出的“以拦”区别开来；“另一个”保留了它可能修饰“以拦”本身的句法。
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254人
  rationale: 希伯来语数词合计为一千二百五十四；人口名册中采用阿拉伯数字便于阅读，并补出量词“人”。
