  text: the sons of Asnah[a], the sons of Meunim[b], the sons of Nephisim.
translation:
  language: zh_hans
  text: 亚斯拿的子孙，米乌宁的子孙[a]，尼非心的子孙[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米乌宁”也可音译为“玛俄宁”。
    reason: lexical_alternative
  - marker: b
    text: “尼非心”也可音译为“尼弗心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙／……人
  rationale: 在以斯拉记的归回者名册中，该词用来引出以祖先、族名或群体名称标识的家族或群体。首项译作“……的子孙”以保留谱系意味；后两项为复数群体名称，译作“……人”更符合现代汉语名册体，同时保留群体性质。
- source_word: אַסְנָה
  choice: 亚斯拿
  rationale: 按马所拉文本音译这一专名；不对名称作意义性翻译。
- source_word: מעינים
  choice: 米乌宁人
  rationale: 将马所拉文本所指的复数群体名音译，并用“人”显明其群体性质。希伯来辅音写法及译名传统存在差异，异译收入脚注。
- source_word: נפיסים
  choice: 尼非心人
  rationale: 按马所拉文本的读音将复数群体名音译，并以“人”表达其群体性质；不同传统中的音译差异收入脚注。
