  yaml_path: translation/ot/ezra/002/033.yaml
  text: 'The sons of Lod[a], Hadid[b], and Ono: seven hundred twenty-five.'
translation:
  language: zh_hans
  text: 罗德[b]、哈迪和阿挪的子孙[a]，共七百二十五人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子孙”也可译作“人”。在这份归回者名录中，原文所说的“儿子们”可以泛指某一家族、宗族或地方群体的成员，并不只指亲生儿子。
    reason: lexical_alternative
  - marker: b
    text: 罗德后来称为“吕大”。
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在这份归回者名录中，该词可指属于某一家族、宗族或地方群体的人，不限于亲生儿子；译作“子孙”既保留亲缘群体的表达，也符合现代汉语习惯。
- source_word: לֹד
  choice: 罗德
  rationale: 按希伯来语地名音译；后来的希腊语名称通常译作“吕大”，另以脚注说明。
- source_word: חָדִיד
  choice: 哈迪
  rationale: 按希伯来语地名音译。
- source_word: וְאוֹנוֹ
  choice: 和阿挪
  rationale: 将连接词译作“和”，地名按希伯来语音译为“阿挪”。
- source_word: שְׁבַע מֵאוֹת עֶשְׂרִים וַחֲמִשָּׁה
  choice: 七百二十五人
  rationale: 准确表达希伯来文数字725；补出量词“人”，使名单中的人数统计在现代汉语中自然明确。
theological_decisions: []
