  text: 'The Levites: the sons of Jeshua and Kadmiel[a], of the sons of Hodaviah, seventy-four.'
translation:
  language: zh_hans
  text: 利未人：耶书亚和甲篾的子孙，就是何达威雅[a]的子孙，共七十四人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“何达威雅”；尼希米记7:43的平行名单作“何达威”。
    reason: textual_variant
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 定冠词加群体称谓，在名单中引出新的统计类别；“利未人”简洁自然，并保留标题作用。
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在家谱和人口登记语境中，该词常指家族成员或后裔；“子孙”比直译“儿子”更符合现代汉语名单体裁。
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 采用中文圣经传统中对这一被掳归回时期人名的通行音译。
- source_word: וְקַדְמִיאֵל
  choice: 和甲篾
  rationale: 连接词译为“和”，人名采用中文圣经传统音译“甲篾”。
- source_word: לִבְנֵי
  choice: 属于……的子孙
  rationale: 前缀 לְ 在此最可能表示家谱或群体归属；此译法既明确其分类关系，也避免把两组名称简单并列。
- source_word: הוֹדַוְיָה
  choice: 何达威雅
  rationale: 正文依照WLC所代表的马所拉文本形式音译；尼希米记7:43的平行名单采用不同形式，另以脚注说明。
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: 七十四人
  rationale: 按现代汉语习惯表达人数，并补出量词“人”。
