lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 本词字面是“儿子们”，但在这份归回者名册中用作宗族称谓，指属于某位祖先家族的后代；译作“子孙”在现代汉语中更自然，也避免让人误以为仅指其亲生儿子。
- source_word: פַרְעֹשׁ
  choice: 帕罗施
  rationale: 这是人名或宗族名，按希伯来语音形作音译，不按其可能的普通名词含义翻译。
- source_word: אַלְפַּיִם מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: 2,172
  rationale: 希伯来语数词合计为二千一百七十二；在名册中使用阿拉伯数字，便于阅读并准确保留人数。
