  text: besides their male and female slaves[a], these were 7,337; and they had 200 male and female singers.
translation:
  language: zh_hans
  text: 此外，他们的男女奴仆共有7,337人；他们还有男女歌唱者200人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: 此外
  rationale: 承接上一节的总数，表明以下人员另行计算；“此外”简洁自然。
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: 他们还有男女奴仆
  rationale: עֶבֶד与אָמָה分别指男性和女性的奴仆；在户籍人口清单中译作“男女奴仆”，既保留性别对应，也反映其从属身份。
- source_word: אֵלֶּה שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: 共7,337人
  rationale: 将希伯来语数量陈述自然地转为现代汉语统计表达，并准确保留人数。
- source_word: וְלָהֶם
  choice: 以及……
  rationale: 原文是所属结构，意为“他们有”；结合前句改用“以及”衔接，可避免重复而仍清楚表达这些歌唱者属于他们的群体。
- source_word: מְשֹׁרְרִים וּמְשֹׁרְרוֹת
  choice: 男女歌唱者
  rationale: 原文分别使用阳性和阴性形式，明确兼指男性与女性；“男女歌唱者”在现代汉语中简明且忠实。
- source_word: מָאתָיִם
  choice: 200人
  rationale: 采用阿拉伯数字适合人口清单，并补出量词“人”使汉语自然。
