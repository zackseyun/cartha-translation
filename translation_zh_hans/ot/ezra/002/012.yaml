lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: בְּנֵי是בֵּן的复数构造形式；在归回者名册中表示隶属某一家族或宗族的人。译作“子孙”比直译“儿子们”更符合现代汉语名册语境，同时保留家族后裔的含义。
- source_word: עַזְגָּד
  choice: 押甲
  rationale: 这是人名或家族名，按现代中文圣经常见音译形式译为“押甲”。
- source_word: אֶלֶף מָאתַיִם עֶשְׂרִים וּשְׁנָיִם
  choice: 1,222人
  rationale: 希伯来语数词合计为1,222；人口名册中使用阿拉伯数字清楚简洁，并补出量词“人”以符合现代汉语表达。
