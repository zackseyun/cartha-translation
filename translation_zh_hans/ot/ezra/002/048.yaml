  yaml_path: translation/ot/ezra/002/048.yaml
  text: the sons of Rezin[a], the sons of Nekoda, the sons of Gazzam;
translation:
  language: zh_hans
  text: 利汛的子孙[a]，尼哥大的子孙，迦散的子孙；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节三处“子孙”原文都是“儿子”；在这类家族名录中，也可指后裔或宗族成员。
    reason: 保留בְּנֵי既可直指儿子、又可表示家系或宗族成员的语义范围。
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 这是בֵּן的复数附属形式。在归回者名录中，它通常表示属于某一家系或宗族的人，不限于某人的亲生儿子；译作“子孙”既自然，也符合名单语境。三次重复均照原文保留。
- source_word: רְצִין
  choice: 利汛
  rationale: 专名按现代中文圣经通行形式音译；对应希伯来语人名רְצִין。
- source_word: נְקוֹדָא
  choice: 尼哥大
  rationale: 专名音译；采用现代中文读者较熟悉的传统形式，对应希伯来语נְקוֹדָא。
- source_word: גַזָּם
  choice: 迦散
  rationale: 专名音译；采用现代中文圣经通行形式。希伯来语中的辅音加倍不宜机械地在普通话音译中重现。
theological_decisions: []
