  text: the sons of Bakbuk[a], the sons of Hakupha, the sons of Harhur.
translation:
  language: zh_hans
  text: 巴卜的子孙[a]，哈古巴的子孙，哈忽的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“儿子”；本节每处的希伯来语族谱用语也可指“后裔”或一个家族的成员。
    reason: 说明בְּנֵי在本节名录语境中的字面意义及较宽泛的家族含义。
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 该词是בֵּן（儿子）的复数构造形式；在以斯拉记的归回者名录中，通常指某人的后裔或所属家族，而非仅指亲生儿子。译作“子孙”既自然，也较准确地传达族谱性群体含义。
- source_word: בַקְבּוּק
  choice: 巴卜
  rationale: 专名按希伯来语音译；采用简洁、适合现代普通话的译名。
- source_word: חֲקוּפָא
  choice: 哈古巴
  rationale: 专名按马所拉文本所标元音音译，以“哈古巴”表现其近似读音。
- source_word: חַרְחוּר
  choice: 哈忽
  rationale: 专名按希伯来语音译；末音节的咽音与重复辅音在普通话中以较自然的“忽”近似表达。
theological_decisions: []
translation_notes:
  register: 采用简洁庄重的名录体。三个并列短语保持相同结构；人名用现代普通话音译。“子孙”避免让读者误以为所列者必定都是这些人的第一代亲生儿子。
