- source_word: אֶלֶף חֲמִשִּׁים וּשְׁנָיִם
  choice: 一千零五十二名
  rationale: 希伯来文直译为“一千、五十和二”；以现代汉语数词表达总数，并加量词“名”以明确这是人数。
