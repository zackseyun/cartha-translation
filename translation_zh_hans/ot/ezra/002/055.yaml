base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/055.yaml
  text: 'the sons of Solomon’s servants: the sons of Sotai[a], the sons of Hassophereth, the sons of Peruda.'
translation:
  language: zh_hans
  text: 所罗门仆人的子孙：索太的子孙、哈索斐列的子孙、比鲁达[a]的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《尼希米记》7:57的平行名录作“比利达”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在家族和归回者名录中，这个构造词组表示某人的后代或宗族成员。“子孙”既保留希伯来文反复出现的谱系表达，也不会局限为亲生儿子。
- source_word: עַבְדֵי
  choice: 仆人
  rationale: עֶבֶד 可指“奴隶”或“仆人”；这里是归回者名录中的固定群体称谓“所罗门的仆人”，上下文并未着重说明其受奴役的法律身份，因此译作“仆人”。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文读者熟悉的圣经人名标准译法。
- source_word: סֹטַי
  choice: 索太
  rationale: 按希伯来语人名音译，并采用简洁、自然的现代中文音节。
- source_word: הַסֹּפֶרֶת
  choice: 哈索斐列
  rationale: 按马所拉文本的整体形式音译；“哈”体现词首的定冠词成分，避免将这个名录中的形式擅自解释为普通名词。
- source_word: פְרוּדָא
  choice: 比鲁达
  rationale: 正文依《以斯拉记》的马所拉文本读法音译为“比鲁达”；《尼希米记》平行名录中的不同读法另以脚注注明。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留希伯来名录中“……的子孙”反复出现的节奏。脚注标记置于其实际涉及的“比鲁达”之后；英文咨询层把标记放在“索太”之后，与脚注内容不符，故按原文证据校正。
