- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 在归回者名录中，这一构造形式通常指某一家系或宗族的成员，不限于某人的亲生儿子。“子孙”既自然简洁，也保留了家系含义和三项重复句式。
- source_word: בַצְלוּת
  choice: 巴洗律
  rationale: 按希伯来语辅音转写为现代中文圣经姓名形式，不对词义不明的专名作意译。
- source_word: מְחִידָא
  choice: 米希大
  rationale: 采用清楚、易读的中文音译，保留该希伯来专名的主要音节。
- source_word: חַרְשָׁא
  choice: 哈沙
  rationale: 采用自然的中文音译；词尾不发音的 א 不另加音节。
