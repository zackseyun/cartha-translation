  text: 'The sons of Azmaveth: forty-two[a].'
translation:
  language: zh_hans
  text: 押斯玛弗的子孙，共四十二人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “押斯玛弗的子孙”也可译作“押斯玛弗人”。这里的希伯来语“子孙”可以泛指一个家族或宗族的成员，不一定只是亲生儿子；“押斯玛弗”在此也可能是地名。
    reason: 保留בְּנֵי的家族含义，以及עַזְמָוֶת可能指祖名或地名的歧义。
lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 该词是בֵּן（儿子）的复数附属形；在家族名册和人口统计语境中，常泛指某一祖先的后裔或宗族成员。译作“子孙”比“儿子”更符合此处群体名册的含义。
- source_word: עַזְמָוֶת
  choice: 押斯玛弗
  rationale: 这是专名，按现代中文圣经人名的惯用音译处理；本节可能指该群体所属的祖族，也可能与地方名称有关。
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: 四十二人
  rationale: 原文直为“四十和二”；现代汉语自然表达为“四十二”。补出量词“人”，使名册条目清楚流畅，并未增加实质信息。
