- source_word: בְּנֵי
  choice: 子孙
  rationale: 在家族名册和人口统计语境中，这一复数构造形式通常指某人的后裔或家族成员；译作“子孙”比字面的“儿子们”更符合现代汉语，同时保留谱系含义。
- source_word: יוֹרָה
  choice: 约拉
  rationale: 按本节希伯来文本 יוֹרָה 音译为“约拉”；尼希米记7:24的对应名字在希伯来文中形式略有不同，置于脚注说明。
- source_word: מֵאָה וּשְׁנֵים עָשָׂר
  choice: 一百一十二人
  rationale: 按希伯来文基数词准确翻译；补出量词“人”，使中文名册表述自然清楚。
