  text: 约拉的子孙[a]，一百一十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“约拉”；尼希米记7:24作“哈里弗”。
    reason: 交代本节与平行名册之间真实存在的异文；WLC所据马所拉文本在尼希米记7:24并非英语审校层所称的同名变体“Jora”，而是 חָרִיף（哈里弗）。
