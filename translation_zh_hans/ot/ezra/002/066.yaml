lexical_decisions:
- source_word: סוּסֵיהֶם
  choice: 他们有……匹马
  rationale: סוּס意为“马”；复数形式带第三人称阳性复数后缀，表示归属。汉语用“他们有……匹马”自然表达这一关系，并配以量词“匹”。
- source_word: שְׁבַע מֵאוֹת שְׁלֹשִׁים וְשִׁשָּׁה
  choice: 七百三十六
  rationale: 希伯来语数词组合明确表示736，按现代汉语习惯译为“七百三十六”。
- source_word: פִּרְדֵיהֶם
  choice: 二百四十五匹骡子
  rationale: פֶּרֶד特指“骡子”；复数形式带第三人称阳性复数后缀，表示这些骡子归他们所有。承接前一分句的“他们有”，可自然省略重复成分。
- source_word: מָאתַיִם אַרְבָּעִים וַחֲמִשָּׁה
  choice: 二百四十五
  rationale: 希伯来语数词组合明确表示245，按现代汉语习惯译为“二百四十五”。
