  text: 基绿斯的子孙[a]，西亚哈的子孙，巴顿的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 族谱名录中的“子孙”也可指某人的后裔或其宗族成员，并非只指直接的儿孙。
