lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 在以斯拉记的归回者名录中，这是表示某一宗族成员或后裔的惯用结构，并不局限于亲生儿子；译作“子孙”既自然，也保留族谱含义。
- source_word: קֵרֹס
  choice: 基罗斯
  rationale: 这是人名，按希伯来语读音音译；“基罗斯”可较清楚地呈现 קֵרֹס 的音节。
- source_word: סִיעֲהָא
  choice: 西亚哈
  rationale: 这是圣殿役仆宗族名，依马所拉文本的形式音译；保留末尾音节，不采用平行传统中的较短形式。
- source_word: פָדוֹן
  choice: 巴顿
  rationale: 这是人名，依希伯来语的元音形式音译为“巴顿”。
