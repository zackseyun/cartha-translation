  text: 殿役[a]和所罗门仆人的子孙，共三百九十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿役”：希伯来语 נְתִינִים（音译“尼提宁”），是指被指派从事圣殿服役的一类人。
    reason: 说明原文的专门术语及其职能，并提供音译形式。
lexical_decisions:
- source_word: כָּל
  choice: 共
  rationale: 此处统合后面两个群体并引出总人数；汉语用“共”自然明确。
- source_word: הַנְּתִינִים
  choice: 殿役
  rationale: 这是被指派从事圣殿服役的一类人的专称；“殿役”简洁传达其职能，脚注保留术语背景。
- source_word: וּבְנֵי
  choice: 和……的后代
  rationale: בְּנֵי 字面为“儿子们”，但在群体名册中表示所属世系；译作“后代”更符合现代汉语，也避免误解为仅指直接儿子。
- source_word: עַבְדֵי
  choice: 仆人
  rationale: עֶבֶד 可指仆人或奴仆；此处是传统群体名称，原文未特别强调其法律身份，故采用较中性的“仆人”。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: 三百九十二人
  rationale: 准确表达基数，并补出汉语计人数所需的量词“人”。
