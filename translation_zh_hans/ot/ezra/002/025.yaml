lexical_decisions:
- source_word: בְּנֵי
  choice: 居民
  rationale: 本节后接三个地名；在归回者名册的语境中，这个词指与这些城镇相关的人。译作“居民”比直译“儿子们”更符合现代汉语，也不把他们误解为同一家族的亲生后代。
- source_word: קִרְיַת עָרִים
  choice: 基列·亚琳
  rationale: 按马所拉文本所载地名音译；用间隔号清楚标示复合地名的两个部分，不将其含义意译。
- source_word: כְּפִירָה
  choice: 基非拉
  rationale: 作为地名音译，力求贴近希伯来语读音，并采用简明易读的现代汉语形式。
- source_word: וּבְאֵרוֹת
  choice: 和比录
  rationale: 显明原文连接词“和”，并将地名 בְאֵרוֹת 音译为“比录”。
- source_word: שְׁבַע מֵאוֹת וְאַרְבָּעִים וּשְׁלֹשָׁה
  choice: 743人
  rationale: 准确保留人数，并按现代名册的表达习惯使用阿拉伯数字；补出量词“人”，使汉语自然清楚。
