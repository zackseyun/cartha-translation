  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pokereth-hazzebaim, the sons of Ami.
translation:
  language: zh_hans
  text: 示法提雅的子孙、哈替的子孙、玻黑列·哈斯巴音的子孙[a]、亚米的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“西巴音的玻黑列”；希伯来语既可能是一个复合族名，也可能是名字后接限定成分。
    reason: 保留פֹּכֶרֶת הַצְּבָיִים在词汇和句法上的歧义。
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 本节是归回者的宗族名录，该词在此引出家族或宗族群体；“子孙”比“儿子”更自然、准确，同时保留重复列举的结构。
- source_word: שְׁפַטְיָה
  choice: 示法提
  rationale: 人名或族名，按现代中文圣经人名的常见音译形式处理。
- source_word: חַטִּיל
  choice: 哈替
  rationale: 人名或族名，采用简明音译，不赋予原文未明示的含义。
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: 玻革列·哈西巴音
  rationale: 原文两个成分联系紧密，可能共同构成复合族名；以间隔号呈现其紧密关系，同时用脚注保留另一种句法理解。
- source_word: אָמִי
  choice: 亚米
  rationale: 人名或族名，采用音译。
