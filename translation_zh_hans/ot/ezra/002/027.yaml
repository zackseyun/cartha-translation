- source_word: מִכְמָס
  choice: 密抹
  rationale: 按希伯来语音译地名；“密抹”是简体中文圣经语境中清楚且惯用的形式。
- source_word: מֵאָה עֶשְׂרִים וּשְׁנָיִם
  choice: 一百二十二名
  rationale: 原文数字依次为一百、二十和二，合计一百二十二；加量词“名”符合现代汉语人口名册的表达。
