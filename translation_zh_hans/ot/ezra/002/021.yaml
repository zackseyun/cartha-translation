- source_word: בֵית לָחֶם
  choice: 伯利恒
  rationale: 采用该地名在现代中文圣经传统中的标准译名，不按字面译为“粮食之家”。
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: 一百二十三名
  rationale: 希伯来语数词合计为123；中文用“一百二十三”自然准确，并加量词“名”明确这是人数。
