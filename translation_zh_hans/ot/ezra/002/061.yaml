revisions:
- from: 祭司的子孙中有：哈巴雅的子孙、哈哥斯的子孙、巴西莱的子孙。这个巴西莱娶了基列人巴西莱的一个女儿为妻，并以他们的名字为名。[a]
  to: 祭司的子孙中有：哈巴雅的子孙、哈哥斯的子孙、巴西莱的子孙；此人娶了基列人巴西莱的一个女儿为妻，并按他们的名字被称呼。[a]
  rationale: 修订仅改善语态、书面语体与脚注的准确性：以“此人”替代口语化的“这个巴西莱”，并以“按他们的名字被称呼”保留希伯来文被动表达及其未明确的命名机制；删除把“名字”确定为“姓氏”的解释。
