  - severity: medium
    issue: “并以他们的名字为名”未充分体现“被称呼”的被动语态，脚注“随了他们的姓氏”也过度具体化。
    rationale: וַיִּקָּרֵא为Niphal形式，意为“被称呼”；“按他们的名字被称呼”较贴合。原文的“他们的名字”所指及其实际命名／归属机制未明，不应落实为现代“姓氏”。
  revised_text: 祭司的子孙中有：哈巴雅的子孙、哈哥斯的子孙、巴西莱的子孙；此人娶了基列人巴西莱的一个女儿为妻，并按他们的名字被称呼。[a]
