  source_fidelity: 译文整体准确呈现了祭司家族名单、巴西莱娶基列人巴西莱之女，以及随后按该家之名被称呼的叙述。惟“以他们的名字为名”在汉语中略显重复，且较弱地呈现了希伯来文נפעל式“被称呼”的语态。
  naturalness: “这个巴西莱”略偏口语，不适合本段族谱式、庄重的书面语体。改为“此人”可保持指代清楚和文体一致。“按他们的名字被称呼”虽保留原文的含混性，汉语亦较通顺。
  terminology: 人名“哈巴雅、哈哥斯、巴西莱”和地域称谓“基列人”可保留。“子孙”在此族谱语境中自然，且不必机械限缩为“儿子”。脚注不宜把“名字”直接解释为现代意义的“姓氏”，因为原文并未明确具体采用何种社会或法律机制。
