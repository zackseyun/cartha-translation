  text: וּ/מִ/בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: zh_hans
  text: 祭司的子孙中有：哈巴雅的子孙、哈哥斯的子孙、巴西莱的子孙；此人娶了基列人巴西莱的一个女儿为妻，并按他们的名字被称呼。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并取了他们的名字。”希伯来文直译为“并按他们的名字被称呼”。
    reason: 说明较合汉语习惯的可能译法，同时保留原文对命名方式及“他们”所指范围的含混性。
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: 祭司的子孙中有
  rationale: מן带有部分义；译作“……中有”符合名单语境。בני在族谱中指后裔，译作“子孙”比逐字的“儿子”更符合现代汉语，同时保留血缘谱系色彩。
- source_word: בְּנֵי חֳבַיָּה ... בְּנֵי הַקּוֹץ ... בְּנֵי בַרְזִלַּי
  choice: 哈巴雅的子孙、哈哥斯的子孙、巴西莱的子孙
  rationale: 重复“……的子孙”以保留希伯来文名单的平行结构；专名按常见中文圣经音译处理。
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: 这个巴西莱娶了……的一个女儿为妻
  rationale: לקח אשה是“娶妻”的惯用表达；מן加复数“女儿”表示其中一人，因此明确译作“一个女儿”。补出“这个巴西莱”以自然地指明关系从句所修饰的人。
- source_word: בַּרְזִלַּי הַגִּלְעָדִי
  choice: 基列人巴西莱
  rationale: הַגִּלְעָדִי是地域称谓，现代汉语自然表达为“基列人”。
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: 并以他们的名字为名
  rationale: 保留尼法勒式所表达的“被称名”含义及复数后缀“他们”，不擅自确定具体的改姓或归族机制。
theological_decisions: []
