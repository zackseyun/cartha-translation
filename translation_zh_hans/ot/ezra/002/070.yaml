  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם וּֽ/מִן הָ/עָ֞ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שּׁוֹעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים בְּ/עָרֵי/הֶ֑ם וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/070.yaml
  text: So the priests[a], the Levites, some of the people, the singers, the gatekeepers, and the temple servants lived in their cities, and all Israel lived in their cities.
translation:
  language: zh_hans
  text: 于是，祭司、利未人、一些百姓、歌唱者、守门人和殿役[a]都住在各自的城里；以色列众人也都住在各自的城里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“尼提宁人”，是对一类被指派承担圣殿服役之人的专称。
    reason: 说明专门群体名称，并保留原文术语信息。
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: 住在
  rationale: ישׁב在这里指居住、定居；“住在”自然简明，也适合后半句省略同一动词的结构。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 这是被掳归回时期圣殿职分的标准现代汉语译法。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 保留该群体的传统专名，并与祭司区别开来。
- source_word: וּמִן הָעָם
  choice: 一些百姓
  rationale: 介词מִן在此具有部分意义，指百姓中的一部分，而非全部百姓。
- source_word: הַמְשֹׁרְרִים
  choice: 歌唱者
  rationale: 该词指负责歌唱之人，尤其是参与圣殿礼仪服事的歌唱人员；“歌唱者”直接且易懂。
- source_word: הַשּׁוֹעֲרִים
  choice: 守门人
  rationale: 指负责看守或照管门户的人；“守门人”是清楚、通行的表达。
- source_word: הַנְּתִינִים
  choice: 殿役
  rationale: 这是指派承担圣殿服役工作的特定群体；“殿役”简洁表达其职能，脚注补充其希伯来语专称。
- source_word: בְּעָרֵיהֶם
  choice: 在各自的城里
  rationale: “各自”传达复数所有格所表示的各群体居于所属城邑之意；“城”在此自然且符合叙事语体。
- source_word: וְכָל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 保留“全以色列”的集体含义，同时采用自然现代汉语表达。
theological_decisions:
- issue: 专门称谓 הַנְּתִינִים 的译法
  choice: 殿役
  alternative: 尼提宁人／圣殿仆役
  rationale: 该词是被掳归回时期一个承担圣殿服役职能群体的专称。正文以“殿役”传达职能，不把音译强加给普通读者；脚注则保留其专门术语性质。
- issue: וְכָל יִשְׂרָאֵל 的范围
  choice: 以色列众人
  alternative: 全以色列
  rationale: 原文使用集体性的“全以色列”。译文保留这一称呼，不进一步限定它究竟指所有归回者还是更广义的以色列共同体，以免消解原文的概括性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“殿役”避免冗长，“各自的城里”使重复句式自然清楚。脚注标记置于“殿役”之后，与其所解释的词准确对应。
