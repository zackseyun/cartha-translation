  yaml_path: translation/ot/ezra/002/042.yaml
  text: 'The sons of the gatekeepers: the sons of Shallum, the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, all together one hundred thirty-nine.'
translation:
  language: zh_hans
  text: 守门人的子孙：沙龙的子孙、亚特的子孙、达们的子孙、亚谷的子孙、哈底大的子孙、朔拜的子孙，共一百三十九人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 本节是归回者名册，בְּנֵי反复引出按祖先或宗族归属划分的群体；译作“子孙”比逐字的“儿子”更符合汉语名册语境，也不把他们泛化为仅仅具有某种成员身份的人。
- source_word: הַשֹּׁעֲרִים
  choice: 守门人
  rationale: 该词指负责看守、管理圣殿门户的职役人员；“守门人”是清楚、自然且沿用已久的现代汉语表达。
- source_word: שַׁלּוּם
  choice: 沙龙
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: אָטֵר
  choice: 亚特
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: טַלְמוֹן
  choice: 达们
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: עַקּוּב
  choice: 亚谷
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: חֲטִיטָא
  choice: 哈底大
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: שֹׁבָי
  choice: 朔拜
  rationale: 按马所拉读音并兼顾现代中文圣经人名的通行形式音译。
- source_word: הַכֹּל
  choice: 共
  rationale: 在名册合计语境中，该词概括前列各族；“共”简洁自然，明确表示总数。
- source_word: מֵאָה שְׁלֹשִׁים וְתִשְׁעָה
  choice: 一百三十九人
  rationale: 按现代汉语基数词表达；补出量词“人”，使人口名册的合计自然清楚。
