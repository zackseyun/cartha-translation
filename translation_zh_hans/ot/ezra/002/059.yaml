base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/059.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addan, and Immer, but they were not able to declare their fathers’ house and their offspring, whether they were from Israel.
translation:
  language: zh_hans
  text: 以下是从特勒·米拉、特勒·哈沙、基绿、亚顿和音麦上来的人；但他们不能说明自己的父家和后裔是否出自以色列。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父家和后裔”也可译为“父系家族和后代”；希伯来语所指的是父系谱系资料。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלִים
  choice: 上来的
  rationale: 保留עלה在归回名单中“上到犹大地”的地理和归回含义，不直接意译为“归回的人”。
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדָּן אִמֵּר
  choice: 从特勒·米拉、特勒·哈沙、基绿、亚顿和音麦
  rationale: 这些词在本节中作为地名或宗族名称使用，按音译处理；专名的具体所指存在一定不确定性。
- source_word: לֹא יָכְלוּ לְהַגִּיד
  choice: 无法说明
  rationale: 在户籍和谱系语境中，נגד指陈明或提供相关资料；“无法说明”自然且保留其行政语气。
- source_word: בֵּית אֲבוֹתָם
  choice: 自己的父家
  rationale: “父家”保留以父系家族为单位的古代社会结构，也符合中文圣经语体。
- source_word: וְזַרְעָם
  choice: 和后裔
  rationale: זרע在这里指血统或后代，“后裔”比字面“种子”更符合现代中文谱系语境。
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: 以证明自己是否出自以色列
  rationale: 该短语关乎以色列血统或归属；“出自以色列”保留来源含义。“以证明”在中文中把前面的谱系资料与后面的疑问自然连接起来。
theological_decisions:
- issue: “出自以色列”指血统还是群体归属
  choice: 出自以色列
  alternative: 属于以色列
  rationale: 上下文聚焦父家和后裔，因此血统来源更突出；但不进一步界定其神学或盟约身份。
translation_notes:
  register: 采用现代、庄重而易懂的名单叙述语体。“父家”作为必要的历史社会术语予以保留，并用脚注解释；专名依希伯来语音译。
