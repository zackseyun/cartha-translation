- source_word: בְּנֵי
  choice: 子孙
  rationale: 在回归者名册和家族统计语境中，复数构造形式通常指某一祖先的后裔或家族成员；“子孙”比字面的“儿子们”更符合现代汉语表达。
- source_word: אָטֵר
