  rationale: 人名或家族名，按现代中文圣经人名的通行形式音译。
- source_word: לִיחִזְקִיָּה
  choice: 就是希西家这一支
  rationale: 前缀 ל־在此表示归属或支系分类；此译法自然地说明这些人属于亚特家族中的希西家支系，同时保留原文的家族层级关系。
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: 九十八人
  rationale: 按现代标准汉语表达人数；补出量词“人”，使名册统计句清楚自然。
