lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在以斯拉记的归回者名录中，这个词用于引出宗族或与某地相关的群体。“子孙”既保留其群体传承含义，也比直译“儿子”更符合现代汉语名册语境。
- source_word: נְבוֹ
  choice: 尼波
  rationale: 这是专名，按现代中文圣经人地名的常见音译处理；在本名录中可能指地方或宗族名称，正文不强行判定。
- source_word: חֲמִשִּׁים וּשְׁנָיִם
  choice: 五十二人
  rationale: 希伯来文数字为“五十和二”，现代汉语自然表达为“五十二”；补出量词“人”，使名册条目清楚流畅。
