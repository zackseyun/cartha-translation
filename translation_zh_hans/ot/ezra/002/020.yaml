lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 该词字面义为“儿子们”，但在以斯拉记的归回者名册中通常指某一宗族或家族的成员；译作“子孙”既保留亲属群体含义，也符合现代汉语名册体表达。
- source_word: גִבָּר
  choice: 基巴
  rationale: 这是专名，按希伯来语读音音译；末尾双写辅音在现代汉语音译中不另作体现。
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: 九十五名
  rationale: 希伯来语直译为“九十和五”；现代汉语自然表达为“九十五”。加量词“名”，使人数名册的句式清楚自然。
