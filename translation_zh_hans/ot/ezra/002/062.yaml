  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑אוּ וַֽ/יְגֹאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/062.yaml
  text: These sought their record among those enrolled by genealogy[a], but they were not found, and they were excluded from the priesthood.
translation:
  language: zh_hans
  text: 这些人在家谱登记册中查找自己的登记记录，却没有找到；于是他们被判为不洁，不能担任祭司[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们被取消祭司资格”，或：“他们被排除在祭司职分之外。”这里的希伯来语动词含有“被视为不洁或不合资格”的意思；在本节中，这表示由于他们的家谱无法核实而被排除于祭司职分之外。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些人
  rationale: 复数指示词承接上文那些自称具有祭司血统的人；中文补出“人”更自然，也不增加超出语境的信息。
- source_word: בִּקְשׁוּ
  choice: 查找
  rationale: בקשׁ在此指搜寻、查验，配合行政性名册语境，“查找”准确自然。
- source_word: כְתָבָם
  choice: 自己的名册
  rationale: כְּתָב本义为书面文件或记录；在家谱登记的语境中译作“名册”能表达用来证明身份的书面记录，同时不过度限定其具体形式。“自己的”也保留第三人称复数后缀。
- source_word: הַמִּתְיַחְשִׂים
  choice: 按家谱登记的人
  rationale: יחשׂ的Hitpael形式涉及核定谱系、按家系登记；此译保留分词所指的人群及行政登记意味。
- source_word: וְלֹא נִמְצָאוּ
  choice: 却找不到
  rationale: 希伯来文为复数“他们没有被找到”，所指是这些人的名字未见于登记记录。中文用省略宾语的“找不到”自然保留原文的简略表达。
- source_word: וַיְגֹאֲלוּ
  choice: 被视为不洁，不得担任
  rationale: 该罕见动词在此表达因谱系无法核实而被当作不洁或不合资格；主文兼顾其词汇意象和实际后果，避免仅以“除名”抹去“不洁”的语义。
- source_word: מִן הַכְּהֻנָּה
  choice: 不得担任祭司
  rationale: כְּהֻנָּה指祭司职分或祭司身份；“不得担任祭司”在现代中文中清楚表达被排除于祭司职分之外。
theological_decisions:
- issue: וַיְגֹאֲלוּ与祭司资格的关系
  choice: 被视为不洁，不得担任祭司
  alternative: 被排除在祭司职分之外；被取消祭司资格
  rationale: 原文动词带有玷污或被判为不洁的色彩，而上下文的实际结果是失去祭司资格。主文并列呈现两层含义，既不把它简化成纯行政决定，也不暗示这些人已被证明在道德或礼仪上实际犯罪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“按家谱登记”“名册”体现行政查验背景；主文保留原文中“不洁”与职分资格之间的张力。脚注标记[a]已置于相关句末。
