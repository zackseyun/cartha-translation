lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在家谱和人口名册语境中，该构造形式指以某人为祖先或代表的家族成员；译作“子孙”比字面的“儿子”更符合现代汉语，同时保留宗族含义。
- source_word: דְלָיָה
  choice: 底莱雅
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: טוֹבִיָּה
  choice: 陀比雅
  rationale: 按现代中文圣经人名的通行形式音译，并反映希伯来语人名。
- source_word: נְקוֹדָא
  choice: 尼哥大
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: שֵׁשׁ מֵאוֹת חֲמִשִּׁים וּשְׁנָיִם
  choice: 六百五十二人
  rationale: 准确表达希伯来文基数；补出量词“人”，使人口名册中的中文表述自然清楚。
