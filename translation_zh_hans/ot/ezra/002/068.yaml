  text: וּ/מֵ/רָאשֵׁי֙ הָֽ/אָב֔וֹת בְּ/בוֹאָ֕/ם לְ/בֵ֥ית יְהוָ֖ה אֲשֶׁ֣ר בִּ/ירוּשָׁלִָ֑ם הִֽתְנַדְּבוּ֙ לְ/בֵ֣ית הָֽ/אֱלֹהִ֔ים לְ/הַעֲמִיד֖/וֹ עַל מְכוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/068.yaml
  text: And some of the heads of the fathers’ houses[a], when they came to the house of Yahweh that is in Jerusalem, gave freewill offerings for the house of God[c][b], to set it up on its foundation.
translation:
  language: zh_hans
  text: 有些父家首领[a]来到耶路撒冷雅伟的殿时，自愿为上帝的殿献上礼物[b]，要把这殿建在原址上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“父家首领”。“父家”指以父系亲属关系组成的家族单位。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“甘心献上”。原文动词强调奉献出于自愿。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“把这殿立在根基上”。原文既可指圣殿原有的地点，也可指它的根基。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: 有些族长
  rationale: 介词 מִן 表示整体中的一部分，故译“有些”；רָאשֵׁי הָאָבוֹת 指以父系家族为单位的首领。“族长”简洁自然，并以脚注说明其社会结构。
- source_word: בְּבוֹאָם
  choice: 来到……时
  rationale: 介词 בְּ 加带后缀的不定词在此表达时间关系。
- source_word: לְבֵית יְהוָה
  choice: 来到……雅伟殿
  rationale: בַּיִת 在此指圣殿；译作“殿”比“家”更符合现代汉语语境，同时保留与后文“上帝的殿”的对应。
- source_word: יְהוָה
  choice: 雅伟
  rationale: 直接音译四字神名，避免以称号代替专名。
- source_word: הִתְנַדְּבוּ
  choice: 自愿……献上礼物
  rationale: Hitpael 词形突出甘心、自愿的奉献；结合语境把所献之物明说为“礼物”，但不限定具体种类。
- source_word: לְבֵית הָאֱלֹהִים
  choice: 为上帝的殿
  rationale: לְ 表明奉献的对象或用途；“上帝的殿”自然且与前句平行。
- source_word: לְהַעֲמִידוֹ
  choice: 要把殿建
  rationale: 使役词形意为使之站立、建立；在圣殿重建语境中，“建”具体自然，又不额外加入“修复”的含义。
- source_word: עַל מְכוֹנוֹ
  choice: 在原址上
  rationale: מָכוֹן 可指固定地点、基址或根基；正文采用符合重建语境的“原址”，脚注保留“根基上”的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅伟
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅伟”作为现代汉语音译，保留其专名性质，不以称号“主”代替。
- issue: הָאָבוֹת 所表达的父系家族结构
  choice: 族长，并加脚注
  alternative: 父家首领；各家族的首领
  rationale: “族长”便于普通读者理解，而脚注说明原文直译及古代以父系家族为单位的社会结构，避免将其意义泛化。
- issue: עַל מְכוֹנוֹ 的地点或根基歧义
  choice: 原址上
  alternative: 根基上
  rationale: 该词既可表示固定地点，也可表示基座或根基。正文依重建语境采用“原址”，脚注明确保留另一种理解，不把歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“雅伟殿”避免重复结构过重；后文“上帝的殿”保留原文神名称谓的变化。句末通过脚注保留 מָכוֹן 的真实词义歧义。
