  text: כְּ/כֹחָ֗/ם נָתְנוּ֮ לְ/אוֹצַ֣ר הַ/מְּלָאכָה֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שֵׁשׁ רִבֹּ֣אות וָ/אֶ֔לֶף וְ/כֶ֕סֶף מָנִ֖ים חֲמֵ֣שֶׁת אֲלָפִ֑ים וְ/כָתְנֹ֥ת כֹּהֲנִ֖ים מֵאָֽה־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/069.yaml
  text: 'According to their ability they gave to the treasury for the work: 61,000 gold darics[a], 5,000 minas of silver[b], and 100 priests’ tunics.'
translation:
  language: zh_hans
  text: 他们按自己的能力，捐入工程的库房：达利克金币61,000枚[a]，银子5,000弥那[b]，以及祭司的袍子100件。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金币”；这里的希伯来语词特指波斯的达利克金币。
    reason: lexical_alternative
  - marker: b
    text: 弥那是古代的重量和货币单位。
    reason: cultural_note
lexical_decisions:
- source_word: כְּכֹחָם
  choice: 按照自己的能力
  rationale: 介词כְ与כֹחַ合用，表示按各自所能或财力而行；此译保留按能力衡量的含义，也符合现代汉语表达。
- source_word: נָתְנוּ
  choice: 捐献了
  rationale: נתן基本义为“给”；在为圣殿工程奉献财物的语境中，“捐献”自然明确，又不超出原文。
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: 为工程的库房
  rationale: אוֹצָר可指库房或 خز treasury，מְלָאכָה在此指重建工程；该译既保留原文的属格关系，也表明财物用于工程。
- source_word: דַּרְכְּמוֹנִים
  choice: 达利克
  rationale: 该波斯借词具体指波斯金币达利克；采用历史名称比泛译“金币”更准确。
- source_word: שֵׁשׁ רִבֹּאות וָאֶלֶף
  choice: 61,000枚
  rationale: 原文直译为“六个万和一千”；用阿拉伯数字便于阅读，并添加量词“枚”以配合钱币。
- source_word: מָנִים
  choice: 弥那
  rationale: מָנֶה是古代重量兼货币单位；音译保留历史单位，避免用不精确的现代重量替代。
- source_word: חֲמֵשֶׁת אֲלָפִים
  choice: 5,000
  rationale: 准确呈现原文数目，并与本节清单中的数字格式保持一致。
- source_word: כָתְנֹת כֹּהֲנִים
  choice: 祭司内袍
  rationale: כֻּתֹּנֶת指贴身穿着的长衣或袍服，并非祭司服饰的泛称；“祭司内袍”简洁地保留衣物类别及其与祭司的关系。
- source_word: מֵאָה
  choice: 100件
  rationale: 准确呈现数目；“件”是现代汉语中衣物的自然量词。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。数目以阿拉伯数字呈现，古代币名和计量单位采用常见音译，并以脚注解释。正文中的“工程”由上下文指圣殿重建工程，但不在本节擅自补出“圣殿”，以免明说原文省略的信息。
