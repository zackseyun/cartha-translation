  language: zh_hans
  text: 拉玛和迦巴的人〔a〕，共六百二十一名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 本节属于归回者名册，所列对象以两个地名指称，因此这里的希伯来语惯用语更自然地表示出自这些地方的群体，而非两地的亲生儿子；译作“子孙”既保留群体传承意味，也避免现代汉语中的误解。
- source_word: הָרָמָה
  choice: 拉玛
  rationale: 专有地名，按希伯来语音译；采用现代中文圣经地名中通行且易辨识的形式。
- source_word: וָגָבַע
  choice: 和迦巴
  rationale: 连接词译为“和”；גָבַע为地名，音译作“迦巴”，并与相近但不同的“基遍”等地名区分。
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: 六百二十一人
  rationale: 准确表达名册人数总计；汉语补出量词“人”，使名单体裁中的数字自然清楚。
theological_decisions: []
