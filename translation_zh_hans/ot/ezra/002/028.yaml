  text: 伯特利和艾城的男子，共二百二十三名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ……的人
  rationale: 这是 אִישׁ 的复数附属形，在本章名册中指与所列城镇相关的男性成员；现代汉语用“……的人”自然简洁，而“名”作为人数单位也与男性人口统计语境相符。
- source_word: בֵית אֵל
  choice: 伯特利
  rationale: 沿用现代中文圣经中广为人知的地名音译，不按字面译为“神的殿”。
- source_word: וְהָעָי
  choice: 和艾城
  rationale: 将连接词译为“和”；עַי 是地名，希伯来文所带冠词不必在汉语中另行体现。加“城”可使单音节音译“艾”清楚地呈现为地名。
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: 共二百二十三名
  rationale: 准确表达基数；“共”符合名册汇总语境，“名”是现代汉语统计人数的自然量词。
