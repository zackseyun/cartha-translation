lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 在以斯拉记归回者名册的语境中，这一复数构造形式指某位祖先名下的家族成员或后裔；译作“子孙”既符合现代汉语族谱和名册用语，也避免把名单成员限定为亲生儿子。
- source_word: חָגָב
  choice: 哈甲
  rationale: 这是人名或宗族名，按希伯来语音译；采用中文圣经人名中通行、简洁的形式“哈甲”。
- source_word: שמלי
  choice: 沙买
  rationale: 这是人名或宗族名。WLC正文的辅音形式为שמלי，音译作“沙买”；有些抄本传统和译本所反映的读法可作“沙母莱”，故以脚注保留这一异读可能。
- source_word: חָנָן
  choice: 哈难
  rationale: 这是人名或宗族名，按希伯来语 חָנָן 音译为“哈难”。
