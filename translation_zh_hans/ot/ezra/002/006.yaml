  text: the sons of Pahath-moab, of the sons of Jeshua and Joab, 2,812.
translation:
  language: zh_hans
  text: 巴哈·摩押的子孙，就是耶书亚和约押的子孙，共2,812人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在以斯拉记的归回者名册中，该词用于家族或宗族群体；译作“子孙”比直译“儿子们”更符合现代汉语，也能涵盖后裔。
- source_word: פַחַת מוֹאָב
  choice: 巴哈·摩押
  rationale: 按专名音译，不按其可能的词源意义翻译；中点清楚标示复合专名。
- source_word: לִבְנֵי
  choice: 就是……的子孙
  rationale: 前缀 לְ 在此把“巴哈·摩押的子孙”进一步关联或具体说明为耶书亚和约押一系；“就是”表达这种同位或归属关系，同时不把谱系层级说得过死。
- source_word: יֵשׁוּעַ
  choice: 耶书亚
  rationale: 采用以斯拉—尼希米记语境中该名字的常见汉语音译，以区别于较长形式通常译作“约书亚”的用法。
- source_word: יוֹאָב
  choice: 约押
  rationale: 采用该希伯来人名的通行汉语译名。
- source_word: אַלְפַּיִם שְׁמֹנֶה מֵאוֹת וּשְׁנֵים עָשָׂר
  choice: 2,812人
  rationale: 原文数字为二千八百一十二；名单体裁中使用阿拉伯数字清晰简洁，补出量词“人”符合现代汉语表达。
