lexical_decisions:
- source_word: בְּנֵי
  choice: ……的子孙
  rationale: 此处为复数构造形式，在归回者名册中引出家族或宗族群体。现代汉语用“子孙”既保留血缘归属，也比直译“儿子们”更符合名单语境。
- source_word: עֵילָם
  choice: 以拦
  rationale: 专名按现代中文圣经常见译名音译；本节语境指以拦这一家族的祖先名或族名。
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254人
  rationale: 希伯来文数词合计为1,254；采用阿拉伯数字便于阅读名册，并补出汉语计人数所需的量词“人”。
theological_decisions: []
