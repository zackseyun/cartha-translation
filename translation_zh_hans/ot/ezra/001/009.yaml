  text: 'And this was their number: 30 gold basins[a], 1,000 silver basins, and 29 knives.'
translation:
  language: zh_hans
  text: 这些器皿的数目如下：金盆30个，银盆1,000个，刀具[a]29件。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刀具”所译的希伯来词含义不确定，也可能指“另一些器皿”、“重复的器皿”或“替换用的器皿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה מִסְפָּרָם
  choice: 这些器皿的数目如下
  rationale: 原文直译为“这些是它们的数目”。结合上下文补出“器皿”，并用现代汉语清楚引出清单。
- source_word: אֲגַרְטְלֵי
  choice: 盆
  rationale: 该词指圣殿所用的容器；“盆”简明自然，也保留其具体形制并不完全确定的空间。
- source_word: זָהָב / כֶסֶף
  choice: 金 / 银
  rationale: 分别表示器皿的材质；与“盆”组合为自然的汉语名物表达。
- source_word: מַחֲלָפִים
  choice: 刀具
  rationale: 这是一个词义不确定的罕见词。“刀具”是传统且有可能的理解，但其他解释亦须在脚注中保留。
- source_word: שְׁלֹשִׁים / אָלֶף / תִּשְׁעָה וְעֶשְׂרִים
  choice: 30 / 1,000 / 29
  rationale: 清单中的基数词采用阿拉伯数字，便于现代读者快速辨识。
