reference: Ezra 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהִ֤י אֱלֹהָי/ו֙ עִמּ֔/וֹ וְ/יַ֕עַל לִ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/יהוּדָ֑ה וְ/יִ֗בֶן אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ה֥וּא הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/003.yaml
  text: Whoever among all his people is among you[a], may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of Yahweh[b], the God of Israel—he is the God who is in Jerusalem.
translation:
  language: zh_hans
  text: 在你们中间，凡属他子民的，愿他的上帝与他同在！就让他上到位于犹大的耶路撒冷去，重建耶和华[a]的殿，即以色列的上帝的殿；他就是在耶路撒冷的那位上帝。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”所译的是上帝的希伯来文名字 יהוה，常转写为 YHWH；也有译本译作“雅威”。
    reason: divine_name
  - marker: b
    text: “他就是在耶路撒冷的那位上帝”也可译作“他就是在耶路撒冷的上帝”。希伯来文“上帝”前有定冠词；正文以“那位上帝”表达其辨认和强调作用。另，“重建”所译的希伯来文动词本义是“建造”；这里按圣殿恢复的语境译出。
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: 在你们中间，凡属他子民的
  rationale: מִי 在诏令语境中引出不定范围的邀请，译作“凡……的”比单纯疑问句自然；同时保留 בָכֶם“在你们中间”和 עַמּוֹ“他的子民”中的第三人称后缀，不擅自明确其所指。
- source_word: יְהִי אֱלֹהָיו עִמּוֹ
  choice: 愿他的上帝与他同在
  rationale: 将祈愿式 יְהִי 译作“愿……”，保留君王诏告中的祝愿语气；“他的上帝”照译后缀关系。
- source_word: וְיַעַל
  choice: 让他上到
  rationale: עלה 是前往耶路撒冷的惯用表达；“上到”保留其地理和敬拜语境中的方向感。
- source_word: לִירוּשָׁלַם אֲשֶׁר בִּיהוּדָה
  choice: 到犹大的耶路撒冷
  rationale: 用自然简洁的现代汉语保留地点限定；“犹大的耶路撒冷”明确所指而不增加原文没有的信息。
- source_word: וְיִבֶן
  choice: 重建
  rationale: בנה 本义为“建造”，但被毁圣殿恢复的历史语境使“重建”能准确传达此处实际含义；直译“建造”列入脚注。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בֵּית 在此指敬拜建筑，现代汉语译作“殿”既自然又保留“上帝之殿”的表达；יהוה 音译为传统且通行的“耶和华”。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列上帝
  rationale: 直接表达希伯来语附属结构，清楚保留这位上帝与以色列的身份关联。
- source_word: הוּא הָאֱלֹהִים
  choice: 他就是……那位上帝
  rationale: הוּא 带有强调辨认作用，定冠词 הָ 支持“那位上帝”；“就是”体现强调，但不把句子扩展成原文未明说的排他性神学命题。
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: 在耶路撒冷的
  rationale: 按马所拉文本最自然地作为修饰“那位上帝”的关系从句，保留古代诏令将以色列上帝与耶路撒冷联系起来的地点表述，不加以弱化或神学调和。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代简体中文圣经传统中最通行、普通读者最易辨认的专名“耶和华”，并以脚注说明“雅威”这一更接近学界常见重构读音的形式，既不以“主”遮蔽专名，也不把重构读音说成完全确定。
- issue: “他就是在耶路撒冷的那位上帝”的地点限定
  choice: 按原文保留地点表述
  alternative: 他就是上帝；他的殿在耶路撒冷
  rationale: 原文关系从句最自然地修饰“上帝”，反映居鲁士诏令的历史措辞。译文不把地点关系转移到圣殿，也不以更宽泛的神学陈述消解其张力。
- issue: הָאֱלֹהִים 中定冠词的表达
  choice: 那位上帝
  alternative: 上帝
  rationale: “那位上帝”较好地呈现定冠词和 הוּא 的辨认、强调作用；脚注保留较简洁的另一译法，避免把希伯来语冠词的语用价值绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在你们中间，凡……”保留诏令公开邀请的结构；“愿……与他同在”体现祝愿语气；“上到耶路撒冷”保留原文惯用方向表达。正文不将“他的子民”擅自改成“耶和华的子民”，也不调和“在耶路撒冷的上帝”所保留的历史性神学张力。所有脚注标记均已置于正文。
