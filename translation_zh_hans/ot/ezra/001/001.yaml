id: EZR.1.1
reference: Ezra 1:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה מִ/פִּ֣י יִרְמְיָ֑ה הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כֹּ֣רֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/001.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh from the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he sent a proclamation throughout all his kingdom, and also in writing[c][b], saying:'
translation:
  language: zh_hans
  text: 波斯王居鲁士元年，为要使耶和华借耶利米之口所说的话得以成就[a]，耶和华激动了波斯王居鲁士的心[b]。居鲁士便在全国发布通告，也以书面形式发布[c]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借耶利米之口”直译为“从耶利米的口中”，表示耶利米是传达耶和华话语的人；“成就”也可较直译为“完成”。
    reason: 说明希伯来语习语及“完成／成就”的词义范围。
  - marker: b
    text: “心”也可译作“灵”或“心灵”，这里指居鲁士内在的意向或动力。
    reason: 保留 רוּחַ 在此处可能涵盖的语义范围。
  - marker: c
    text: “在全国发布通告”直译为“使声音（或公告）传遍他的全王国”；“也以书面形式发布”直译为“也用文字”。
    reason: 说明两处行政发布用语的较字面形式，并避免将书面形式具体化为君王亲自书写某一特定文类。
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: 波斯王居鲁士元年
  rationale: 采用现代汉语常见的纪年表达，准确传达“波斯王居鲁士的第一年”；句首连接词不必机械译出。
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: 为要使耶和华……所说的话得以成就
  rationale: לִכְלוֹת 本义涉及“完成、达到终点”，在预言实现的语境中译作“得以成就”自然且准确，同时保留目的意味。
- source_word: מִפִּי יִרְמְיָה
  choice: 借耶利米之口所说
  rationale: 较贴近“从耶利米口中”的希伯来语表达，又清楚呈现耶利米作为传话者的角色。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代中文圣经读者熟悉的专名形式对应四字神名，而不以“主”这一称号替代。
- source_word: הֵעִיר ... אֶת רוּחַ כֹּרֶשׁ
  choice: 激动了……居鲁士的心灵
  rationale: 保留神主动促使居鲁士行动的意义；“心灵”在现代汉语中可表达 רוּחַ 所指的内在意向，同时避免只限定为理智或情绪。
- source_word: וַיַּעֲבֶר קוֹל בְּכָל מַלְכוּתוֹ
  choice: 便通告全国
  rationale: 该习语指让官方信息传遍王国；“通告全国”简洁自然，并保留公开发布的行政语气。
- source_word: וְגַם בְּמִכְתָּב
  choice: 又把诏令写下来
  rationale: 表明通告也采用书面形式；结合君王语境用“诏令”自然，但脚注保留较字面的可能译法。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引入下文直接引语的标准表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名。正文保留中文传统且广为人知的专名“耶和华”，不以称号“主”替代；“雅威”是另一种按现代学术重构发音的音译。
- issue: לִכְלוֹת דְּבַר יְהוָה 的完成含义
  choice: 使……所说的话得以成就
  alternative: 使……的话完成
  rationale: 上下文把居鲁士的行动描述为先知之言在历史中的实现；“成就”表达这一点，却不额外说明预言的具体内容或实现机制。
- issue: רוּחַ כֹּרֶשׁ 的语义范围
  choice: 居鲁士的心灵
  alternative: 居鲁士的心／居鲁士的灵
  rationale: 原词可指人的灵、内在倾向或意志冲动。“心灵”保留一定宽度，不把神的推动具体化为某一种心理过程。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“元年”“诏令”符合古代王室行政语境，但仍为普通读者熟悉；句式分成两句，以免希伯来语长句在中文中显得拖沓。所有脚注标记均置于所解释的正文内容之后。
