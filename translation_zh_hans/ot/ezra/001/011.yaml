base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/011.yaml
  text: All the articles of gold and silver were five thousand four hundred in all[c][b][a]. Sheshbazzar brought them up with the exiles when they were brought up from Babylon to Jerusalem.
translation:
  language: zh_hans
  text: 金银器皿[a]总共五千四百件。当被掳的人[b]从巴比伦被带到耶路撒冷时，设巴萨把这些器皿和他们一同带了上去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “器皿”也可译作“器物”或“用具”；希伯来语原词可广指各种物件，在这里指圣殿的物品。
    reason: lexical_alternative
  - marker: b
    text: “被掳的人”也可译作“被掳群体”或“流亡群体”。
    reason: lexical_alternative
  - marker: c
    text: 本节原文两次使用“带上去”一词，反映前往耶路撒冷时惯用的“上去”说法。
    reason: cultural_note
lexical_decisions:
- source_word: כָּל כֵּלִים לַזָּהָב וְלַכֶּסֶף
  choice: 金银器皿
  rationale: כֵּלִים是含义宽泛的器物用语；结合圣殿物品的语境，“器皿”庄重自然，又不把范围限定为日常用具。带ל的金银名称在此按材质分类，译作“金银器皿”。
- source_word: חֲמֵשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת הַכֹּל
  choice: 总共五千四百件
  rationale: 按原文保留明确总数，并用量词“件”配合器物；הַכֹּל在此表示合计。
- source_word: שֵׁשְׁבַּצַּר
  choice: 设巴萨
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: הַגּוֹלָה
  choice: 被掳的人
  rationale: 此处指从巴比伦返回的人群，而非抽象的被掳状态；这一表达也保留他们曾被强制迁离的含义。
- source_word: הֶעֱלָה / הֵעָלוֹת
  choice: 带了上去 / 被带上
  rationale: 原文两次使用עלה的使役形态，既表达带领、带去，也保留前往耶路撒冷惯用的“上去”说法。
- source_word: מִבָּבֶל לִירוּשָׁלִָם
  choice: 从巴比伦……耶路撒冷
  rationale: 直接呈现出发地、目的地与移动方向。
theological_decisions:
- issue: 前往耶路撒冷的“上去”用语
  choice: 两处均保留“上”的表达
  alternative: 译作“带到”或“前往”
  rationale: 这样保留原文重复的עלה及其地理、文学色彩，却不额外赋予该说法某种教义解释。
- issue: הַגּוֹלָה所指
  choice: 理解为被掳并返回的人群
  alternative: 译作“被掳之境”或“流亡”这一抽象状态
  rationale: 上下文描写与设巴萨一同从巴比伦前往耶路撒冷的群体，因此人物集合义最合适，同时脚注保留其他可能的表达。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“被带上……带了上去”略有重复，但这是有意保留希伯来原文两次使用עלה的文学特征；“和他们一同”明确器皿与返回群体同行。
