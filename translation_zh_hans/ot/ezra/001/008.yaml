base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/008.yaml
  text: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
translation:
  language: zh_hans
  text: 波斯王居鲁士借司库米特利达之手取出这些器皿[a]，清点后交给犹大的首领设巴萨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“借司库米特利达的手”，指由他经手办理。
    reason: lexical_alternative
  - marker: b
    text: “首领”也可译作“王公”或“领袖”；有人按其职能译作“省长”，但原词的含义较宽。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: 吩咐……把这些器皿取出来
  rationale: 该词是 יצא 的使役形，表示使某物出来；承接上一节，代词所指是圣殿器皿。译文以“吩咐……取出来”自然表达居鲁士借官员执行此事的使役关系。
- source_word: עַל יַד
  choice: 由……办理（在句中表达为“吩咐司库米特利达……”）
  rationale: 这一希伯来语习语字面为“藉着……的手”，在此表示代理或执行者。中文不直译“借……的手”，而以句法重组清楚表达米特利达奉命经办。
- source_word: מִתְרְדָת
  choice: 米特利达
  rationale: 按现代中文圣经人名音译惯例处理该波斯人名。
- source_word: הַגִּזְבָּר
  choice: 司库
  rationale: 指掌管财库或与财库有关的官员；“司库”简洁、庄重，也符合其经手器皿的语境。
- source_word: וַיִּסְפְּרֵם
  choice: 清点后交给
  rationale: ספר 在此表示计数、逐项核点；“清点”比单纯“数点”更贴合器物交接场景。介词 לְ 标示接受者，中文合并表达为“清点后交给”。
- source_word: לְשֵׁשְׁבַּצַּר
  choice: 交给……设巴萨
  rationale: 人名采用通行中文音译；前置的 לְ 在语境中标示接受者。
- source_word: הַנָּשִׂיא
  choice: 首领
  rationale: נָשִׂיא 可泛指首领、领袖或统治者。“首领”保留宽泛含义，不把它限定为王族意义的“王子”，也不径自等同于波斯行政职称“省长”。
- source_word: לִיהוּדָה
  choice: 犹大的
  rationale: 此处说明设巴萨与犹大的关系；配合“首领”，译作“犹大的首领”自然且不额外限定行政身份。
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: 波斯王居鲁士
  rationale: 采用自然的现代汉语王号与人名次序，完整保留其身份。
theological_decisions:
- issue: הַנָּשִׂיא 的具体身份
  choice: 首领
  alternative: 王公；省长
  rationale: 原词本身可指首领或统治者，但本节没有使用更具体的波斯行政头衔。译作“首领”保留其身份的开放性，避免加入王族或省级官职的推断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“这些器皿”明确承接上一节，避免中文代词指向不清；通过句法重组自然呈现居鲁士命令、米特利达经办、设巴萨接收的关系。所有脚注标记均置于相关正文位置。
