base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/006.yaml
  text: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
translation:
  language: zh_hans
  text: 他们周围的人都帮助他们[a]，送给他们银器、金子、财物、牲畜和珍贵物品，另加上一切甘心奉献的礼物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“坚固他们的手”，意思是帮助、支持他们。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“此外还有一切自愿奉献之物”。原文没有说明所献之物是否具有祭物性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתֵיהֶם
  choice: 他们周围的人
  rationale: 按其空间和群体含义译出，不限定为具有特定社会关系的“邻舍”。
- source_word: חִזְּקוּ בִידֵיהֶם
  choice: 帮助他们
  rationale: 这是表示扶助、支持的希伯来语惯用语；现代汉语若直译为“坚固他们的手”较不自然，故在正文中传达其实际含义，并以脚注保留字面表达。
- source_word: בִּכְלֵי כֶסֶף
  choice: 银器
  rationale: כְּלִי 可指器皿、物件或用具；在馈赠贵重物品的语境中，“银器”简洁自然。
- source_word: בַּזָּהָב
  choice: 金子
  rationale: 原文使用单独的“金”，未明确重复“器皿”，故不补作“金器”。
- source_word: בָּרְכוּשׁ
  choice: 财物
  rationale: 指可拥有或携带的产业、物品；“财物”比“地产”宽泛，也适合归回旅程的语境。
- source_word: וּבַבְּהֵמָה
  choice: 牲畜
  rationale: 该词在此为集合意义，指作为财产的家畜。
- source_word: וּבַמִּגְדָּנוֹת
  choice: 珍贵物品
  rationale: מִגְדָּנוֹת 可指贵重或精选之物，有时也指美味；此处保持宽泛，不武断限定为食品。
- source_word: לְבַד עַל כָּל הִתְנַדֵּב
  choice: 此外还有各样甘心献上的礼物
  rationale: 压缩的希伯来语表达附加于前述馈赠之上的自愿奉献；“甘心献上”保留 נדב 的自愿含义，而“礼物”使汉语句意完整。
theological_decisions: []
