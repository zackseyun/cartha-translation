  text: 30 gold bowls[a], 410 silver bowls of a second kind, and 1,000 other vessels.
translation:
  language: zh_hans
  text: 金碗30个，第二类银碗410个[a]，其他器皿1,000件。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“银碗，双份的，共410个。”这里译作“第二类”的希伯来语在这份清单中的含义不确定，也可能指成对、重复的一套或双重样式。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפוֹרֵי
  choice: 碗
  rationale: 该词指一种器皿；在圣殿器物清单中译作“碗”自然明白，又不对具体形状作过度限定。
- source_word: זָהָב
  choice: 金
  rationale: 表示器皿的材质，与“碗”组合为“金碗”。
- source_word: שְׁלֹשִׁים
  choice: '30'
  rationale: 清单中的基数词采用阿拉伯数字，便于阅读。
- source_word: כְּפוֹרֵי כֶסֶף
  choice: 银碗
  rationale: 与前一处器皿名词保持一致，并明确其材质为银。
- source_word: מִשְׁנִים
  choice: 第二类
  rationale: 此词在本清单语境中的含义不确定，可能表示第二类、成对或双份；正文用“第二类”保留分类意味，同时以脚注说明其他可能。
- source_word: אַרְבַּע מֵאוֹת וַעֲשָׂרָה
  choice: '410'
  rationale: 复合数词以阿拉伯数字呈现，符合现代清单表达。
- source_word: כֵּלִים
  choice: 器皿
  rationale: 这是泛指物件的词，在圣殿器物语境中译作“器皿”准确而庄重。
- source_word: אֲחֵרִים
  choice: 其他
  rationale: 直接区别于前面列出的器皿。
- source_word: אָלֶף
  choice: 1,000
  rationale: 以阿拉伯数字呈现，与本节其他数目保持一致。
