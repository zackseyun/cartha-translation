revisions:
- from: 于是，犹大和便雅悯的宗族首领、祭司和利未人，就是凡上帝激动其心灵的人[a]，都起来，要上耶路撒冷去建造耶和华的殿[b]。
  to: 于是，犹大和便雅悯的宗族首领、祭司和利未人，就是一切被上帝激动心灵的人，都起来，要上去建造在耶路撒冷的耶和华的殿[a]。
  rationale: 修订将“在耶路撒冷”直接置于“耶和华的殿”之前，明确保留原文关系从句的修饰对象；同时以更自然的“一切被上帝激动心灵的人”表达原文的分配性结构。脚注删去语义不清的“在灵里推动”，并合并保留必要的词义说明。
