id: EZR.1.5
reference: Ezra 1:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּק֜וּמוּ רָאשֵׁ֣י הָ/אָב֗וֹת לִֽ/יהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/כֹ֨ל הֵעִ֤יר הָ/אֱלֹהִים֙ אֶת רוּח֔/וֹ לַ/עֲל֣וֹת לִ/בְנ֔וֹת אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/005.yaml
  text: Then the heads of the fathers’ houses of Judah and Benjamin[a], and the priests and the Levites[b], arose—everyone whose spirit God had stirred—to go up to build the house of Yahweh that is in Jerusalem.
translation:
  language: zh_hans
  text: 于是，犹大和便雅悯的宗族首领、祭司和利未人，就是一切被上帝激动心灵的人，都起来，要上去建造在耶路撒冷的耶和华的殿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “激动心灵”也可译作“唤醒心灵”或“感动人”。“耶和华的殿”原文直译为“耶和华的家”，即圣殿。
    reason: 说明“激动”及רוּחַ的可行译法，并说明“殿”的原文字面表达；正文已明确保留该殿在耶路撒冷的限定。
lexical_decisions:
- source_word: וַיָּק֜וּמוּ
  choice: 都起来
  rationale: 保留קום表示开始采取响应行动的叙事推进，但不把它过度解释为已经启程。
- source_word: רָאשֵׁ֣י הָאָבוֹת
  choice: 宗族首领
  rationale: 该词组指以父系家族为单位的领袖；“宗族首领”在现代汉语中自然，也保留其亲族社会结构。
- source_word: לִיהוּדָה וּבִנְיָמִן
  choice: 犹大和便雅悯的
  rationale: 此处介词ל表示归属，指属于犹大和便雅悯群体的宗族首领。
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: 祭司和利未人
  rationale: 采用这两个宗教与族群称谓在现代中文圣经语境中的通行译法。
- source_word: לְכֹל הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: 就是凡上帝激动其心灵的人
  rationale: 将分配性结构表达为“凡……的人”，并明确保留上帝是内在激发者；“激动”呼应本章上下文相同动词的用法。
- source_word: רוּחַ
  choice: 心灵
  rationale: 此处指人的内在意向与推动力。“心灵”既能自然传达语境意义，也不把原词缩减为单纯情绪或决定。
- source_word: לַעֲלוֹת
  choice: 上耶路撒冷去
  rationale: עלה是前往耶路撒冷的惯用动词；“上……去”保留地势与朝圣叙事色彩。
- source_word: לִבְנוֹת
  choice: 建造
  rationale: 原文只说“建造”，虽由历史语境可知是重建，正文不擅自加入“重”字。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: “殿”在中文中自然表明这是上帝的圣所；脚注说明希伯来文的字面意象是“家／房屋”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的专名形式来保留四字神名，而不以“主”这一称号取代。
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: 上耶路撒冷去建造
  rationale: 将圣殿所在地自然融入目的结构中；其语义仍是建造位于耶路撒冷的耶和华之殿。
theological_decisions:
- issue: 如何表达上帝激动人的רוּחַ
  choice: 上帝激动其心灵
  alternative: 上帝感动的人／上帝唤醒其心灵的人
  rationale: 原文明确把内在的激发归于上帝，却没有说明具体机制；译文保留神的主动与人的响应之间的张力，不扩写为特定宗教经验。
- issue: 如何译出神名יהוה
  choice: 耶和华
  alternative: 雅威／主
  rationale: 正文保留专名，不以称号“主”替代；“耶和华”是普通现代中文读者最熟悉的神名形式。
- issue: 是否将“建造”解释为“重建”
  choice: 建造
  alternative: 重建
  rationale: 历史背景确实是重建被毁的圣殿，但本节动词本身仅为“建造”，因此不在正文中增加原文未明说的前缀意义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“宗族首领”避免生硬直译“父家之首”；“就是凡……”使后置的希伯来语分配性说明清楚地涵盖前述各群体。保留“起来—上去—建造”的动作层次，并以脚注呈现“激动其心灵”与“耶和华的家”的词义空间。
