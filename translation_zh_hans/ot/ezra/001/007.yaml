  text: וְ/הַ/מֶּ֣לֶךְ כּ֔וֹרֶשׁ הוֹצִ֖יא אֶת כְּלֵ֣י בֵית יְהוָ֑ה אֲשֶׁ֨ר הוֹצִ֤יא נְבֽוּכַדְנֶצַּר֙ מִ/יר֣וּשָׁלִַ֔ם וַֽ/יִּתְּנֵ֖/ם בְּ/בֵ֥ית אֱלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/007.yaml
  text: And King Cyrus brought out the vessels of the house of Yahweh[b][a], which Nebuchadnezzar had brought out from Jerusalem and had put in the house of his god.
translation:
  language: zh_hans
  text: 居鲁士王把雅威[a]殿[b]的器皿取了出来。这些器皿是尼布甲尼撒曾从耶路撒冷取出、放在他神的殿里的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译，传统上也译作“耶和华”。
    reason: divine_name
  - marker: b
    text: “殿”原文直译为“家”或“房屋”；这里指雅威的殿宇。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ
  choice: 居鲁士王
  rationale: 按现代汉语称谓习惯，将王号置于人名之后，同时完整表达定冠词所限定的王号。
- source_word: הוֹצִיא
  choice: 取了出来／取出
  rationale: 使役词干在这里表示“使之出来、取出”。两次出现均以“取出”表达，以保留居鲁士与尼布甲尼撒行动之间的用词呼应；首次加“了”使主句自然。
- source_word: כְּלֵי
  choice: 器皿
  rationale: 在圣殿语境中指供殿内使用的器物；“器皿”庄重而通行，又不擅自限定具体种类。
- source_word: בֵית יְהוָה
  choice: 雅威殿
  rationale: בֵית 字面是“家、房屋”，在此指雅威的殿宇。正文用现代汉语自然的“雅威殿”，并以脚注保留其字面表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名 YHWH，保留其作为专名的性质，而不以称号替代。
- source_word: מִירוּשָׁלִַם
  choice: 从耶路撒冷
  rationale: 直接表达介词 מִן 的起点含义，并采用通行地名译法。
- source_word: וַיִּתְּנֵם
  choice: 放在
  rationale: נתן 基本义可为“给、置放”；与地点短语连用时，语境明确表示把器皿安放或存放在那里。
- source_word: בְּבֵית אֱלֹהָיו
  choice: 在他神的殿里
  rationale: 保留“殿／家”与前文“雅威殿”的对应，也依照原文单数和第三人称男性单数后缀译作“他神的”，不扩展为众神。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用“雅威”这一接近 Yahweh 的现代汉语音译，以保存专名；脚注提示其所对应的希伯来文神名。
- issue: 尼布甲尼撒之神的单复数
  choice: 他神的殿
  alternative: 他众神的庙宇
  rationale: אֱלֹהָיו 在此搭配第三人称男性单数所属后缀，且英语咨询层亦按单数理解。译文保持单数，不根据巴比伦宗教背景将其泛化为众神。
- issue: 两座殿宇之间的措辞对应
  choice: 雅威殿／他神的殿
  alternative: 雅威的圣殿／他的神庙
  rationale: 原文两处都使用 בֵית（家、殿），故在中文中均用“殿”，保留叙事刻意形成的对应与张力，不额外评价两者。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“取了出来”与后文“取出”保留原文重复动词的联系；第二句拆出关系从句，避免汉语主句过长。“他神的殿”虽较书面，却能准确保留原文的单数所属关系及与“雅威殿”的平行。
