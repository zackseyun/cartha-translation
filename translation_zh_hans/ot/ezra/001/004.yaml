  text: וְ/כָל הַ/נִּשְׁאָ֗ר מִֽ/כָּל הַ/מְּקֹמוֹת֮ אֲשֶׁ֣ר ה֣וּא גָֽר שָׁם֒ יְנַשְּׂא֨וּ/הוּ֙ אַנְשֵׁ֣י מְקֹמ֔/וֹ בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב וּ/בִ/רְכ֣וּשׁ וּ/בִ/בְהֵמָ֑ה עִם הַ֨/נְּדָבָ֔ה לְ/בֵ֥ית הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/004.yaml
  text: And everyone who remains[a], in any place where he is living, let the men of his place support him with silver and gold, with goods and with livestock[c][b], together with the freewill offering for the house of God that is in Jerusalem.
translation:
  language: zh_hans
  text: 凡余下的人，无论他寄居[a]在什么地方，当地的男子[b]都要用金银、财物和牲畜资助他[c]，连同为在耶路撒冷的上帝之殿所献的甘心礼物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“居住”。“寄居”也可指作为外来者居住。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“他所在地方的男子”；在此可能泛指当地居民或邻舍。
    reason: lexical_alternative
  - marker: c
    text: 或译“扶助他”。希伯来文动词本义为“举起、承担、携带”，这里指以物资给予实际帮助。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָר
  choice: 余下的人
  rationale: 该词是שׁאר的尼法勒分词，指留下或存留的人。“余下的人”保留了原文的概括性，不把它限定为某一种具体处境。
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר הוּא גָר שָׁם
  choice: 无论寄居在什么地方
  rationale: גָר可表示寄居或居住；“寄居”契合流散处境，同时脚注保留较一般的“居住”这一可能。
- source_word: יְנַשְּׂאֻהוּ
  choice: 资助他
  rationale: נשׂא本义为“举起、承担、携带”，但此处接金银、财物和牲畜，表示以物资扶助。“资助”在现代汉语中自然地传达这种实际供应。
- source_word: אַנְשֵׁי מְקֹמוֹ
  choice: 当地的人
  rationale: 字面是“他所在地方的人们”。汉语“当地的人”既贴近原文，也避免把所指范围过度缩窄为男性或近邻。
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: 用金银
  rationale: 保留两种贵金属的并列表达，不将כֶּסֶף过度具体化为铸币或现代意义上的钱。
- source_word: וּבִרְכוּשׁ
  choice: 财物
  rationale: רְכוּשׁ指财产、物资或可携带的产业；“财物”简洁且适合此处物资清单。
- source_word: וּבִבְהֵמָה
  choice: 牲畜
  rationale: בְּהֵמָה在此作集合名词，指家养动物，可作为财产或运输之用；“牲畜”是自然对应。
- source_word: עִם הַנְּדָבָה
  choice: 并……献上自愿的礼物
  rationale: נְדָבָה指自愿献出的礼物或供物。译文以“并”衔接资助归回者与给上帝之殿的礼物，同时不把礼物规定为强制性捐献。
- source_word: לְבֵית הָאֱלֹהִים
  choice: 为……上帝的殿
  rationale: 原文直译为“上帝的家”；在重建圣所的语境中，“上帝的殿”对现代读者清楚自然，又没有增加宗派性含义。
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: 耶路撒冷……的
  rationale: 将原文定位圣殿的关系从句自然整合进汉语定语结构。
theological_decisions:
- issue: אַנְשֵׁי מְקֹמוֹ所指群体的范围
  choice: 当地的人
  alternative: 当地的男人；他的邻舍
  rationale: 原文以阳性复数表达当地居民，但在希伯来语中可承担一般群体用法。“当地的人”保留地域关系，不额外断定只有男性，也不将范围缩限为邻舍。
- issue: יְנַשְּׂאֻהוּ在物资清单中的含义
  choice: 资助他
  alternative: 扶助他；承担他；把他抬起来
  rationale: 按字面译作“抬起”会误导读者；上下文明列金银、财物和牲畜，显示这里是供应实际所需。“资助”保留扶持含义而不暗示人身搬运。
- issue: עִם הַנְּדָבָה与前述资助的关系
  choice: 并为上帝的殿献上自愿的礼物
  alternative: 连同给上帝之殿的自愿礼物
  rationale: 原文עִם表示伴随，既可视为物资扶助之外的附加礼物，也可将整组给予连在一起。正文采用自然汉语表达两个并列行动，但不进一步说明礼物是否由同一批物资构成。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“余下的人”保留原文的开放性；“寄居”呈现流散语境，并以脚注注明“居住”的可能；“资助”使物资供应的语义清楚。所有脚注标记均置于其所解释的词语之后。
