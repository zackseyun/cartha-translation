id: EZR.1.2
reference: Ezra 1:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֗ר כֹּ֚רֶשׁ מֶ֣לֶךְ פָּרַ֔ס כֹּ֚ל מַמְלְכ֣וֹת הָ/אָ֔רֶץ נָ֣תַן לִ֔/י יְהוָ֖ה אֱלֹהֵ֣י הַ/שָּׁמָ֑יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֥ר בִּֽ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/002.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a house for him in Jerusalem[b], which is in Judah.'
translation:
  language: zh_hans
  text: 波斯王居鲁士如此说：“雅威——天上的上帝——已将地上万国赐给我；他又委派[a]我在耶路撒冷，就是在犹大，为他建造一所房屋[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “委派”也可译作“责成”或“吩咐”。
    reason: lexical_alternative
  - marker: b
    text: “房屋”原文指为神建造的居所；这里指耶路撒冷的圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留诏令式宣告的正式语气，同时符合现代汉语表达。
- source_word: כֹּרֶשׁ מֶלֶךְ פָּרַס
  choice: 波斯王居鲁士
  rationale: 按现代汉语习惯排列国号、王号和人名；“居鲁士”为通行译名。
- source_word: כֹּל מַמְלְכוֹת הָאָרֶץ
  choice: 地上万国
  rationale: 保留“国度”的复数和普世范围；“万国”自然表达全部国度，并符合君王诏令的语体。
- source_word: נָתַן לִי
  choice: 已将……赐给我
  rationale: “已”表达过去行动带来的当前结果；“赐给”适合上帝授予王权的语境。
- source_word: יְהוָה אֱלֹהֵי הַשָּׁמַיִם
  choice: 天上的上帝雅威
  rationale: 将四字神名音译为“雅威”，不以称号替代；“天上的上帝”自然呈现 אֱלֹהֵי הַשָּׁמַיִם 这一称号。
- source_word: וְהוּא
  choice: 他又
  rationale: 明确保留希伯来文中的主语代词；“又”自然连接上帝赐予国权与交付建殿使命两项行动。
- source_word: פָקַד עָלַי
  choice: 委派我
  rationale: 此处表示交付任务、任命承担责任；“委派”既自然，又不把词义过度收窄为单纯命令。
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: 为他建造一座殿宇
  rationale: בַיִת 字面为“房屋”，但指为上帝建造的圣殿；“殿宇”在汉语中既保留建筑物意象，也自然传达此处所指。
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: 在犹大的耶路撒冷
  rationale: 以自然简洁的汉语保留耶路撒冷位于犹大的地理说明。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；以“主”代替神名
  rationale: 原文直接使用四字神名。正文采用接近其学界通行读音的汉语音译“雅威”，以保留专名性质，不用称号替代。
- issue: בַיִת 在本节应译为一般“房屋”还是“殿宇/圣殿”
  choice: 殿宇
  alternative: 房屋；圣殿
  rationale: “房屋”最贴近字面，却容易使现代汉语读者误解为普通住宅；“圣殿”则把语境解释完全明说。“殿宇”兼顾原词的建筑含义及为上帝建造之殿的明确语境，脚注同时交代字面意义。
- issue: פָקַד עָלַי 的使命力度
  choice: 委派我
  alternative: 吩咐我；责成我；命令我
  rationale: 该表达可指派定、责成或命令。正文用“委派”保留受托承担使命的含义，不断言其语气必然是强制命令；脚注列出可行译法。
translation_notes:
  register: 采用现代、庄重而易懂的诏令语体。“如此说”保留正式宣告色彩；整体句序按现代汉语调整，将“在犹大的耶路撒冷”合并表达，同时不遗漏原文的地理限定。所有脚注标记均置于其所说明的词语之后。
