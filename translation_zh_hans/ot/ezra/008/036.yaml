base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/036.yaml
  text: And they delivered the king’s decrees to the king’s satraps and the governors Beyond the River[c][b][a], and they supported the people and the house of God.
translation:
  language: zh_hans
  text: 他们把王的法令交给王的总督和河西[b]的省长；这些官员便扶助[a]百姓和神的殿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“帮助”“支持”。原文动词本义是“举起”或“承担”，这里指给予扶助。
    reason: lexical_alternative
  - marker: b
    text: “河西”是波斯帝国的行政称谓，指幼发拉底河以西的地区。
    reason: cultural_note
  - marker: c
    text: 或译“神的圣殿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 交给
  rationale: 该动词基本义为“给”，这里指把官方文书正式递交给帝国官员；“交给”自然、准确，又不过度发挥。
- source_word: דָּתֵי הַמֶּלֶךְ
  choice: 王的谕旨
  rationale: דָּתֵי 在波斯时期的行政语境中指王所颁布的正式命令。“谕旨”体现王命及公文性质，同时不把它扩大为完整的法律体系。
- source_word: אֲחַשְׁדַּרְפְּנֵי
  choice: 总督
  rationale: 这是波斯帝国辖区高级长官的专称；现代中文以“总督”表达其高于一般省长的行政层级，并与后面的 פַחֲוֹת 区分。
- source_word: פַחֲוֹת
  choice: 省长
  rationale: 该词指地区或行省的行政长官；“省长”清楚自然，并保留与“总督”的职级区别。
- source_word: עֵבֶר הַנָּהָר
  choice: 河西
  rationale: 这是波斯行政用语，从帝国中心的视角指幼发拉底河以西的地区。“河西”简洁保留其专名性质，脚注说明其所指，以免与中国地名混淆。
- source_word: וְנִשְּׂאוּ
  choice: 扶助
  rationale: נשא 本义为“举起、承担”，此处表示给予实际支持或帮助。“扶助”既保留形象色彩，也适合其同时支援百姓与圣殿的语境。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文只说“百姓”，不在正文中补入“以色列”或“犹大”，以免缩窄原文表达。
- source_word: בֵּית הָאֱלֹהִים
  choice: 神的殿
  rationale: 该短语字面为“神的家／殿”，在本段指圣殿；“神的殿”在现代中文中清楚而庄重，也保留原文的表达方式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“总督”和“省长”保留两类波斯官职的区别；“河西”作为历史行政名称使用，并以脚注消除现代中文地理联想。后半句以“这些官员”明确自然承接最近的复数官员，符合希伯来语叙事中的主语延续。
