  text: כִּ֣י בֹ֗שְׁתִּי לִ/שְׁא֤וֹל מִן הַ/מֶּ֨לֶךְ֙ חַ֣יִל וּ/פָרָשִׁ֔ים לְ/עָזְרֵ֥/נוּ מֵ/אוֹיֵ֖ב בַּ/דָּ֑רֶךְ כִּֽי אָמַ֨רְנוּ לַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר יַד אֱלֹהֵ֤י/נוּ עַל כָּל מְבַקְשָׁי/ו֙ לְ/טוֹבָ֔ה וְ/עֻזּ֣/וֹ וְ/אַפּ֔/וֹ עַ֖ל כָּל עֹזְבָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/022.yaml
  text: For I was ashamed to ask the king for troops and horsemen to help us against the enemy on the way[a], because we had said to the king, “The hand of our God is for good on all who seek him[b], but his strength and his anger are against all who forsake him.”
translation:
  language: zh_hans
  text: 因为我羞于向王请求军队和骑兵，在路上帮助我们抵御仇敌[a]；因为我们曾对王说：“我们上帝的手施恩于一切寻求他的人[b]，但他的能力和怒气临到一切离弃他的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“帮助我们脱离旅途中的仇敌”。希伯来文可作较接近这一说法的直译；但鉴于这里请求的是军事护卫，正文译作“在路上帮助我们抵御仇敌”。
    reason: lexical_alternative
  - marker: b
    text: “我们上帝的手”是希伯来语表达，指上帝主动施展的能力或恩惠。
    reason: cultural_note
lexical_decisions:
- source_word: בֹשְׁתִּי
  choice: 我以……为耻
  rationale: 该动词表达羞耻或有失颜面，不只是一般的尴尬；结合“不愿求”，在现代汉语中既自然又保留原文分量。
- source_word: חַיִל וּפָרָשִׁים
  choice: 军队和骑兵
  rationale: חַיִל在此指王所能提供的武装力量，פָרָשִׁים指骑马作战的人；分别译出，保留两项并列。
- source_word: לְעָזְרֵנוּ מֵאוֹיֵב בַּדָּרֶךְ
  choice: 在路上帮助我们抵御仇敌
  rationale: 保留“帮助我们”和“在路上”，并按军事护卫语境将מֵאוֹיֵב自然表达为“抵御仇敌”。
- source_word: יַד אֱלֹהֵינוּ
  choice: 我们上帝的手
  rationale: 保留希伯来文以“手”表示主动能力与眷顾的形象，不将其窄化为单一抽象概念。
- source_word: עַל כָּל מְבַקְשָׁיו לְטוֹבָה
  choice: 施恩于一切寻求他的人
  rationale: לְטוֹבָה表示为善、带来福祉；“施恩于”以自然汉语表达上帝的手向寻求者作有益的行动。
- source_word: וְעֻזּוֹ וְאַפּוֹ
  choice: 他的能力和怒气
  rationale: 将两个并列名词分别译出；“能力”表达עֹז的力量，“怒气”表达אַף在此处的惯用义。
- source_word: עַל כָּל עֹזְבָיו
  choice: 攻击一切离弃他的人
  rationale: עַל在此表达敌对指向；“离弃”保留עזב的关系性与盟约色彩，“攻击”则使前面的“能力和怒气”在汉语中有自然谓语。
theological_decisions:
- issue: 如何处理“我们上帝的手”这一拟人化表达
  choice: 保留“我们上帝的手”，并以“施恩于”说明其有益行动
  alternative: 译作“我们上帝的能力”或“我们上帝的恩惠”
  rationale: 原文有意使用身体意象，既可涵盖能力，也可涵盖眷顾；保留比喻可避免将含义缩减为一个抽象范畴。
- issue: 如何表达上帝对离弃者的反对
  choice: 将“能力”和“怒气”作为两个并列概念分别保留
  alternative: 合并为“猛烈的怒气”或只译作“威力”
  rationale: 原文并列עֹז与אַף，兼有施行行动的力量和愤怒；不宜合并而消除其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我以……为耻，不愿求”避免生硬直译，同时保留以斯拉因先前所作见证而不愿请求护卫的语气。保留“上帝的手”这一原文意象，并用脚注解释。
