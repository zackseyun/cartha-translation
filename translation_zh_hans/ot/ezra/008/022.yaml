revisions:
- from: 因为我以向王请求军队和骑兵为耻，不愿求他们在路上帮助我们抵御仇敌[a]；因为我们曾对王说：“我们上帝的手施恩于一切寻求他的人[b]，但他的能力和怒气却攻击一切离弃他的人。”
  to: 因为我羞于向王请求军队和骑兵，在路上帮助我们抵御仇敌[a]；因为我们曾对王说：“我们上帝的手施恩于一切寻求他的人[b]，但他的能力和怒气临到一切离弃他的人。”
  rationale: 删去原文未直接表达的“不愿”，并重组首句以消除“求他们”的指代歧义。将末句改为“临到”，使两个并列名词“能力和怒气”都能自然作主语，并保留原文对离弃者的强烈敌对指向而不限定为字面军事攻击。保留“施恩于”以自然表达“手……为善地临到寻求者”，并维持“上帝的手”的原文意象及相应脚注。
