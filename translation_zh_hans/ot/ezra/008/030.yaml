base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/030.yaml
  text: So the priests and the Levites received the weighed amount of the silver[a], the gold, and the vessels, to bring them to Jerusalem[b], to the house of our God.
translation:
  language: zh_hans
  text: 于是，祭司和利未人就按重量接收了银子、金子和器皿[a]，要把这些带到耶路撒冷我们上帝的殿里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“银子、金子和器皿的重量。”原文所用的词既可指所量得的重量，也可指按重量计量的数额。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“我们上帝的家。”这里指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבְּלוּ
  choice: 接收了
  rationale: 此处指祭司和利未人从以斯拉等人手中接过贵重物品并负责保管、运送；“接收了”自然地体现责任的移交。
- source_word: מִשְׁקַל
  choice: 按重量交付的
  rationale: 该词可指“重量”，也可指按重量计量所得的数量。结合前文称量并托付财物的语境，此译法既表达计量，也避免误解为只接收了抽象的“重量”。
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: 银子、金子和器皿
  rationale: “银子、金子”直接对应贵金属；“器皿”适合圣殿用品的语境，同时保留 כְּלִי 可泛指器具、物件的范围。
- source_word: לְהָבִיא
  choice: 要把这些带到
  rationale: 带 ל 的不定式在此表示目的；补出“这些”，自然回指银子、金子和器皿。
- source_word: לִירוּשָׁלִַם לְבֵית אֱלֹהֵינוּ
  choice: 带到耶路撒冷，送进我们上帝的殿
  rationale: 保留两个方向短语：先到耶路撒冷，再到“我们上帝的殿”。“殿”在中文圣经语体中自然对应上帝的居所，脚注注明原文直译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”承接上文的托付行动；“接收”体现正式交接。“送进”使耶路撒冷与上帝之殿两个目的短语之间的关系清楚，但不改变最终目的地。
