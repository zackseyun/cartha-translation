source:
  edition: WLC
  text: שִׁקְד֣וּ וְ/שִׁמְר֗וּ עַֽד תִּשְׁקְל֡וּ לִ/פְנֵי֩ שָׂרֵ֨י הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם וְ/שָׂרֵֽי הָ/אָב֥וֹת לְ/יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם הַ/לִּשְׁכ֖וֹת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/029.yaml
  text: Be watchful and guard them until you weigh them out before the chief priests and the Levites and the heads of the fathers’ houses of Israel in Jerusalem[c][b][a], in the chambers of the house of Yahweh.
translation:
  language: zh_hans
  text: 你们要警醒，看守这些物品[a]，直到在耶路撒冷耶和华殿的房间里[c]，当着祭司首领、利未人和以色列各父家首领[b]的面，把它们称量。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “要警醒，看守”也可译作“要留心保管”；两个命令强调谨慎守护受托之物。
    reason: lexical_alternative
  - marker: b
    text: “各父家首领”原文直译为“以色列各父家的首领”，指祖家或宗族的领袖。
    reason: cultural_note
  - marker: c
    text: “房间”也可译作“厢房”；原词指圣殿建筑群中的房室。神名“耶和华”也常音译为“雅威”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁקְדוּ
  choice: 要警醒
  rationale: 该复数命令式表达警觉、专注地履行职责；“要警醒”既保留警觉意味，也适合受托看管贵重物品的语境。
- source_word: וְשִׁמְרוּ
  choice: 妥善看守这些物品
  rationale: שׁמר在这里指保护、看管；“这些物品”按上文补出，所指是受托的金银和器皿。
- source_word: עַד תִּשְׁקְלוּ
  choice: 直到……把它们称量清楚
  rationale: שׁקל指为交接和核验而称量；“称量清楚”自然表达完成清点核验的程序，但不额外加入原文没有的结果。
- source_word: לִפְנֵי
  choice: 当着……的面
  rationale: 准确表达“在……面前、在……见证下”，并符合正式交接场景。
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: 祭司首领
  rationale: 直译为祭司中的领袖，避免将其直接等同于新约时期可能具有专门含义的“祭司长”。
- source_word: וְהַלְוִיִּם
  choice: 利未人
  rationale: 采用现代中文圣经传统中通行的族群及职分名称。
- source_word: וְשָׂרֵי הָאָבוֹת לְיִשְׂרָאֵל
  choice: 以色列各宗族首领
  rationale: 该短语指父系祖家的领袖；“各宗族首领”在现代汉语中清楚自然，同时保留宗族组织的文化含义。
- source_word: בִּירוּשָׁלָם
  choice: 在耶路撒冷
  rationale: 采用通行地名译法，并按汉语语序与圣殿库房连用。
- source_word: הַלִּשְׁכוֹת
  choice: 库房
  rationale: לשכות泛指圣殿建筑群中的房间或厢房；本段涉及贵重物品的交接存放，因此正文采用语境自然的“库房”，并以脚注保留较宽的词义。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: בית יהוה字面为“耶和华的殿（家）”；在此明确指圣殿。“耶和华殿”兼顾原文表达和现代中文可读性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。现代中文读者最熟悉的专名形式是“耶和华”；“雅威”更接近学界常见的拟音，但原始发音不能完全确定，因此以脚注提示。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句子依汉语信息顺序重排地点和见证人结构，以避免歧义；“祭司首领”保留其一般领导职分，“各宗族首领”传达父家制度，“耶和华殿”明确指耶路撒冷圣殿。
