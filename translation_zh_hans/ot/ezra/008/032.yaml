lexical_decisions:
- source_word: וַנָּבוֹא
  choice: 我们来到
  rationale: בוא在此叙事语境中表示旅程抵达下一地点；“来到”贴近基本动作含义，也自然表明说话者一行抵达耶路撒冷。句首וַ作为连续叙事标记，不必机械译出。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经传统中通行且易于识别的地名译法。
- source_word: וַנֵּשֶׁב
  choice: 住了
  rationale: ישב语义范围包括坐、居住、停留；在旅途抵达后的语境中表示暂住或停留。“住了”自然简洁，并由“三天”清楚限定为短暂停留。
- source_word: שָׁם
  choice: 在那里
  rationale: 该处所副词回指耶路撒冷；“在那里”是自然准确的现代汉语表达。
- source_word: יָמִים שְׁלֹשָׁה
  choice: 三天
  rationale: 原文为时长用法；现代汉语在“住了”之后直接说“三天”即可自然表达持续时间。
