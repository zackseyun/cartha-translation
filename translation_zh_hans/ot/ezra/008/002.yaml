lexical_decisions:
- source_word: מִבְּנֵי
  choice: ……的子孙中有
  rationale: 介词 מִן 与 בֵּן 的复数构造形式连用，在名单中引出某一宗族里的代表人物。“子孙中有”既表达血统来源，也保留原文三次重复的谱系结构。
- source_word: פִינְחָס
  choice: 非尼哈
  rationale: 专有名词，采用现代中文圣经读者熟悉的传统译名。
- source_word: גֵּרְשֹׁם
