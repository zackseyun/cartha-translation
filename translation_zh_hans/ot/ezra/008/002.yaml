- source_word: דָוִיד
  choice: 大卫
  rationale: 专有名词，采用现代中文圣经通行译名；此处表示大卫家系。
- source_word: חַטּוּשׁ
  choice: 哈突
  rationale: 专有名词，采用现代中文圣经通行译名。
