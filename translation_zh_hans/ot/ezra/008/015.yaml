  text: וָֽ/אֶקְבְּצֵ֗/ם אֶל הַ/נָּהָר֙ הַ/בָּ֣א אֶֽל אַהֲוָ֔א וַ/נַּחֲנֶ֥ה שָׁ֖ם יָמִ֣ים שְׁלֹשָׁ֑ה וָ/אָבִ֤ינָ/ה בָ/עָם֙ וּ/בַ/כֹּ֣הֲנִ֔ים וּ/מִ/בְּנֵ֥י לֵוִ֖י לֹא מָצָ֥אתִי שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/015.yaml
  text: I gathered them to the river that comes to Ahava[a], and we camped there three days. Then I examined the people and the priests[b], but I found none of the sons of Levi there.
translation:
  language: zh_hans
  text: 我把他们召集到通往亚哈瓦的河[a]，我们在那里扎营三天。我察看了百姓和祭司，却没有在那里找到任何利未子孙[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“通往亚哈瓦的水渠。”这里的希伯来语既可指河流，也可指人工水道。
    reason: lexical_alternative
  - marker: b
    text: “利未子孙”即利未人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְבְּצֵם
  choice: 我把他们召集
  rationale: קבץ意为聚集、召集；此处保留以斯拉主动召集众人的语气，并采用自然的现代汉语表达。
- source_word: הַנָּהָר הַבָּא אֶל אַהֲוָא
  choice: 通往亚哈瓦的河边
  rationale: נָהָר通常指河，也可指人工水道；הַבָּא אֶל表示通向某处。正文用“河”并以脚注保留“水渠”的可能。汉语加“边”，自然表达众人在该水域旁扎营。
- source_word: וַנַּחֲנֶה
  choice: 我们在那里扎营
  rationale: חנה意为安营、扎营；“扎营”清楚而符合现代叙事用语。
- source_word: יָמִים שְׁלֹשָׁה
  choice: 三天
  rationale: 按现代汉语通常的数词顺序直译。
- source_word: וָאָבִינָה
  choice: 我察看了
  rationale: בין在此表达留心辨察、查验之意；上下文是以斯拉核查队伍人员构成，“察看”兼顾实际检视和审慎辨认。
- source_word: בָעָם וּבַכֹּהֲנִים
  choice: 百姓和祭司
  rationale: 分别直译עָם和כֹּהֲנִים，保留经文列举的两个群体。
- source_word: וּמִבְּנֵי לֵוִי
  choice: 一个利未子孙
  rationale: 字面为“来自利未众子中的人”，即利未人。正文保留谱系性表达“利未子孙”，并用“一个……也没有”的自然汉语结构体现完全缺席。
- source_word: לֹא מָצָאתִי שָׁם
  choice: 却没有在那里找到一个
  rationale: 自然表达否定式“我在那里没有找到任何一个”，并以“却”显出察看后所得的反差结果。
theological_decisions: []
