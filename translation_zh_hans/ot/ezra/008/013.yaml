  text: 'And from the sons of Adonikam[a], the last ones, and these were their names: Eliphelet, Jeiel, and Shemaiah, and with them sixty males.'
translation:
  language: zh_hans
  text: 亚多尼干的子孙中，最后的一批人[a]，他们的名字是以利法列、耶利、示玛雅；随同他们的有六十名男子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最后的一批人”也可译作“后来的人”或“末后的人”。这里可能是指亚多尼干家系中最后一组成员，或与先前所列的同一家系成员相区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי אֲדֹנִיקָם
  choice: 亚多尼干的子孙中
  rationale: בְּנֵי 在家族名单中可指儿子、后裔或族人；译作“子孙”既符合谱系语境，也比直译“儿子们”自然。人名按现代中文圣经常见形式音译。
- source_word: אַחֲרֹנִים
  choice: 最后一批人
  rationale: 该词可表示“最后的、后来的”；此处很可能指亚多尼干家系中最后归来的一批人。正文保留“最后”的主要意义，脚注说明另一种理解。
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: 他们的名字是
  rationale: 希伯来语是名单引介公式，中文以简洁自然的表达补出系词。
- source_word: אֱלִיפֶלֶט יְעִיאֵל וּשְׁמַעְיָה
  choice: 以利法列、耶利、示玛雅
  rationale: 三个专名依通行中文形式音译，并用中文顿号排列。
- source_word: וְעִמָּהֶם
  choice: 与他们同来的还有
  rationale: עִם 表示随同；结合迁返名单的语境补出“同来”，使中文关系清楚。“还有”自然承接后面的同行人数。
- source_word: שִׁשִּׁים הַזְּכָרִים
  choice: 六十名男子
  rationale: זְכָרִים 明确指男性；“男子”在中文名单语境中比“雄性”或笼统的“人”准确自然。
