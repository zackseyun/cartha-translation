revisions:
- from: 他们因我们上帝施恩的手扶助我们[a]，就从玛利的子孙中，带来一位有见识的人；玛利是利未的儿子，利未是以色列的儿子。这人就是示利比雅，连同他的儿子和弟兄，共十八人。
  to: 因我们上帝施恩的手在我们身上，他们就从玛利的子孙中给我们带来一位有见识的人；玛利是利未的儿子，利未是以色列的儿子。这人就是示利比雅，连同他的儿子和弟兄，共十八人。
  rationale: 补出“给我们”以对应 לָנוּ，并将“上帝的手”恢复为“在我们身上”的原文意象；其眷顾、扶助的含义仍由“施恩”及脚注清楚表达。其余家系、同位说明和人数结构均予保留。
  reviewer_model: gpt-5.6-terra
