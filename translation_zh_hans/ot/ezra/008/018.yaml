  text: וַ/יָּבִ֨יאּוּ לָ֜/נוּ כְּ/יַד אֱלֹהֵ֨י/נוּ הַ/טּוֹבָ֤ה עָלֵ֨י/נוּ֙ אִ֣ישׁ שֶׂ֔כֶל מִ/בְּנֵ֣י מַחְלִ֔י בֶּן לֵוִ֖י בֶּן יִשְׂרָאֵ֑ל וְ/שֵׁרֵֽבְיָ֛ה וּ/בָנָ֥י/ו וְ/אֶחָ֖י/ו שְׁמֹנָ֥ה עָשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/018.yaml
  text: And by the good hand of our God upon us[a], they brought to us a man of insight from the sons of Mahli son of Levi, son of Israel—namely Sherebiah, and his sons and his brothers, eighteen.
translation:
  language: zh_hans
  text: 因我们上帝施恩的手在我们身上，他们就从玛利的子孙中给我们带来一位有见识的人；玛利是利未的儿子，利未是以色列的儿子。这人就是示利比雅，连同他的儿子和弟兄，共十八人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: 他们……带来
  rationale: 这是 בוא 的使役式，在本叙事语境中自然表示“使来到、带来”；保留复数主语“他们”。
- source_word: כְּיַד אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ
  choice: 因我们上帝施恩的手扶助我们
  rationale: 保留“上帝的手”这一希伯来语意象，同时用“施恩”“扶助”自然表达此处所指的眷顾和有利作为；介词 כְּ 的具体关系有一定弹性，另见脚注。
- source_word: אִישׁ שֶׂכֶל
  choice: 一位有见识的人
  rationale: שֶׂכֶל 在这里侧重理解力、明辨和处事能力；“有见识”比单纯“聪明”更能涵盖其意义。
- source_word: מִבְּנֵי מַחְלִי
  choice: 从玛利的子孙中
  rationale: בְּנֵי 在族谱语境中可指后裔；译作“子孙”既符合实际世代关系，也保留家系含义。
- source_word: בֶּן לֵוִי בֶּן יִשְׂרָאֵל
  choice: 玛利是利未的儿子，利未是以色列的儿子
  rationale: 将连续的族谱短语展开为现代汉语完整句，保留两层“儿子”关系及其强调。
- source_word: וְשֵׁרֵבְיָה
  choice: 这人就是示利比雅
  rationale: 此处的 וְ 可引出前述“有见识的人”的具体身份；“就是”清楚表达同位关系，避免误读为另一个人。
- source_word: וּבָנָיו וְאֶחָיו
  choice: 连同他的儿子和弟兄
  rationale: 忠实保留 בָּנָיו“他的儿子”和 אֶחָיו“他的弟兄”两种亲属称谓；“连同”使汉语名单结构顺畅。
- source_word: שְׁמֹנָה עָשָׂר
  choice: 共十八人
  rationale: 原文只列数字，汉语补出量词“人”属语法所需；“共”表明数字概括示利比雅及随同者这一组人。
theological_decisions:
- issue: 如何表达“上帝施恩之手在我们身上”的护理意象
  choice: 因我们上帝施恩的手扶助我们
  alternative: 照着我们上帝施恩的手在我们身上
  rationale: 正文保留“上帝的手”这一具体意象，不把它抽象化为一般的“祝福”，又以“施恩、扶助”说明这是上帝有利的眷顾和作为。由于 כְּ 可表达“按照、由于、随着”等关系，脚注保留较贴近形式的另一种译法，不把句法关系限定得过死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上帝施恩的手”保留原文意象，“有见识的人”体现 שֶׂכֶל 的判断与明辨含义。族谱关系拆成完整分句，以免现代读者误解；人名按常见中文圣经译名作“玛利、利未、以色列、示利比雅”。
