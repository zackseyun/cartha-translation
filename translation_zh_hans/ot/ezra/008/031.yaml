reference: Ezra 8:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/נִּסְעָ֞/ה מִ/נְּהַ֣ר אַֽהֲוָ֗א בִּ/שְׁנֵ֤ים עָשָׂר֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן לָ/לֶ֖כֶת יְרוּשָׁלִָ֑ם וְ/יַד אֱלֹהֵ֨י/נוּ֙ הָיְתָ֣ה עָלֵ֔י/נוּ וַ/יַּ֨צִּילֵ֔/נוּ מִ/כַּ֥ף אוֹיֵ֛ב וְ/אוֹרֵ֖ב עַל הַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/031.yaml
  text: Then we set out from the river Ahava on the twelfth day of the first month to go to Jerusalem[a], and the hand of our God was upon us, and he delivered us from the hand of the enemy and the ambushes along the way.
translation:
  language: zh_hans
  text: 正月十二日，我们从亚哈瓦河边启程，前往耶路撒冷。我们上帝的手扶助我们，救我们脱离仇敌的手和沿途埋伏的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“沿途的埋伏”。希伯来语在这里也可指埋伏等候袭击的人。
    reason: 保留אוֹרֵב在具体指“埋伏者”与按危险情境表达为“埋伏”之间的词义张力。
lexical_decisions:
- source_word: וַנִּסְעָה
  choice: 我们……启程
  rationale: נסע在行旅语境中指拔营出发；“启程”自然、庄重，并准确表达叙事推进。
- source_word: מִנְּהַר אֲהֲוָא
  choice: 从亚哈瓦河边
  rationale: 原文介词מִן表示出发地点；中文说从一条河“启程”时补出“边”，可避免误解为从水中出发。专名按音译作“亚哈瓦”。
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: 正月十二日
  rationale: “第一个月”按现代中文圣经叙事的自然表达译作“正月”，并补足原文隐含的“日”。
- source_word: לָלֶכֶת יְרוּשָׁלִָם
  choice: 前往耶路撒冷
  rationale: 不定式表达启程的目的；“前往”比“去”略显庄重，且适合行旅叙事。
- source_word: וְיַד אֱלֹהֵינוּ הָיְתָה עָלֵינוּ
  choice: 我们上帝的手扶助我们
  rationale: 保留“上帝的手”这一贯穿以斯拉记的重要形象，同时用“扶助”自然传达הָיְתָה עָלֵינוּ在此处所表示的眷顾和保护。
- source_word: וַיַּצִּילֵנוּ
  choice: 救我们脱离
  rationale: נצל表示从危险或权势下解救；“救……脱离”准确而符合现代庄重中文。
- source_word: מִכַּף אוֹיֵב
  choice: 脱离仇敌的手
  rationale: כַּף字面为手掌，在此表示掌控或势力；保留“手”既体现原文意象，也与前句“上帝的手”形成鲜明对照。
- source_word: וְאוֹרֵב
  choice: 和沿途埋伏的人
  rationale: אוֹרֵב是单数主动分词，字面指埋伏等候袭击者；主文采用人格化的具体所指，避免把它无提示地抽象化为“埋伏”。
- source_word: עַל הַדָּרֶךְ
  choice: 沿途
  rationale: 简洁自然地表达“在路上”，并修饰埋伏者活动的地点。
theological_decisions:
- issue: 上帝保护的拟人化表达
  choice: 保留“我们上帝的手”并译为“扶助我们”
  alternative: 我们的上帝保护我们
  rationale: 原文明确使用“上帝的手”这一神学和文学意象，宜予保留；“扶助”使现代读者清楚其在本节表示眷顾和保护，而不将意象完全释义掉。
- issue: “上帝的手”与“仇敌的手”的平行对照
  choice: 两处均保留“手”
  alternative: 将后者译为“仇敌的势力”或“仇敌的掌控”
  rationale: 原文以יַד和כַּף构成相近的身体意象：上帝施恩保护的手胜过仇敌控制伤害的手。中文保留此对照既可理解，也维护文学张力。
- issue: אוֹרֵב所指是人还是危险
  choice: 主文译为“埋伏的人”，并以脚注保留“埋伏”的可能表达
  alternative: 沿途的埋伏
  rationale: 希伯来语主动分词通常可实体化指“埋伏者”，但在译入语中也可按所造成的危险理解为“埋伏”。主文取较贴近语法形态的人称所指，脚注保留语义和表达上的另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。句首按中文时间表达习惯安排日期；保留“上帝的手”和“仇敌的手”的原文意象及对照。
