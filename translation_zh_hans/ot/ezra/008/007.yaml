  text: וּ/מִ/בְּנֵ֣י עֵילָ֔ם יְשַֽׁעְיָ֖ה בֶּן עֲתַלְיָ֑ה וְ/עִמּ֖/וֹ שִׁבְעִ֥ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/007.yaml
  text: 'And from the sons of Elam: Jeshaiah son of Athaliah[a], and with him seventy males.'
translation:
  language: zh_hans
  text: 以拦的子孙中，有亚他利雅的儿子耶筛亚；同他一起的男丁有七十人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“七十名男子”。希伯来文特指男性。
    reason: 说明原文使用明确指男性的词，并提供较一般的现代汉语表达。
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: 以拦的子孙中
  rationale: בְּנֵי 在这份家族名册中指以拦家系的成员或后裔，不限于以拦的亲生儿子；译作“子孙”既保留谱系关系，也符合现代汉语习惯。连接词 וּ 融入列举句式，不另译“并且”。
- source_word: עֵילָם
  choice: 以拦
  rationale: 采用现代中文圣经中较通行的专名译法。
- source_word: יְשַׁעְיָה
  choice: 耶筛亚
  rationale: 采用现代中文圣经中较通行、与希伯来语音形相称的专名译法。
- source_word: בֶּן
  choice: 儿子
  rationale: 这里是直接的父子名号结构，译作“儿子”自然且准确。
- source_word: עֲתַלְיָה
  choice: 亚他利雅
  rationale: 采用现代中文圣经中较通行的专名译法。
- source_word: וְעִמּוֹ
  choice: 同他一起的
  rationale: 表达这些人随同前述领队而来，并保持名册中“领队加人数”的结构。
- source_word: שִׁבְעִים
  choice: 七十人
  rationale: 准确表达基数，并以量词“人”形成自然的现代汉语。
- source_word: הַזְּכָרִים
  choice: 男丁
  rationale: 原词明确指男性；“男丁”既保留性别限定，也契合登记随行家族成员的名册语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以分号保留名单条目的两段结构。专名使用简体中文圣经读者较熟悉的传统译名；“子孙”避免把家族名册中的“众子”误解为以拦的直系儿子。
