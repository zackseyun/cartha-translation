  yaml_path: translation/ot/ezra/008/019.yaml
  text: and Hashabiah[a], and with him Jeshaiah, from the sons of Merari, his brothers and their sons, twenty[b];
translation:
  language: zh_hans
  text: 又有米拉利子孙中的哈沙比雅，和同他一起的耶筛亚；还有他的弟兄[b]和他们的儿子，共二十人；
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “弟兄”在这种宗族名单中可能指同宗族的男子或近亲，不一定仅指同胞兄弟。“他的”在原文为单数，其具体所指未明。
    reason: cultural_note
lexical_decisions:
- source_word: וְאֶת
  choice: 又有
  rationale: 连接上一节所列带来的人；希伯来语宾语标记不另译，用“又有”自然延续名单。
- source_word: חֲשַׁבְיָה
  choice: 哈沙比雅
  rationale: 按现代中文圣经人名的常见音译处理，保留专名性质。
- source_word: וְאִתּוֹ
  choice: 以及同他一起
  rationale: 保留介词所表达的陪同关系，也保留原文的并列结构。
- source_word: יְשַׁעְיָה
  choice: 耶筛亚
  rationale: 采用此处人物常见的中文音译，以免直接写作“以赛亚”而使读者误以为是同名先知。
- source_word: מִבְּנֵי מְרָרִי
  choice: 出自米拉利子孙
  rationale: 基本保留“从米拉利的众子而来”这一谱系表达；中文“出自……子孙”自然且能表明宗族归属。
- source_word: אֶחָיו
  choice: 他的弟兄
  rationale: 保留普通词义及第三人称阳性单数领属形式，不在正文中将其限定为亲兄弟。
- source_word: וּבְנֵיהֶם
  choice: 和他们的儿子
  rationale: 保留阳性复数和谱系名单中的具体含义；“他们”对应原文复数领属后缀。
- source_word: עֶשְׂרִים
  choice: 共二十人
  rationale: 数字是前述群体的人数总计；补出量词“人”符合现代汉语表达。
theological_decisions:
- issue: “他的弟兄”中单数领属代词的所指
  choice: 正文保留“他的”，按最近的男性单数先行词自然指向耶筛亚
  alternative: 译作“他们的弟兄”，使其泛指哈沙比雅和耶筛亚二人
  rationale: 原文明确使用第三人称阳性单数后缀，不宜在正文中改成复数；同时脚注说明“弟兄”在宗族名单中的宽泛用法，以免误读为仅限同胞兄弟。
- issue: “出自米拉利子孙”所修饰的范围
  choice: 按紧邻关系置于“耶筛亚”之前
  alternative: 理解为同时说明哈沙比雅、耶筛亚及其同行者所属的米拉利宗族
  rationale: 希伯来语短语紧接在“耶筛亚”之后，句法上最直接修饰他；但名单语境可能使其宗族归属涵盖相关群体，因此脚注保留范围上的可能性。
translation_notes:
  register: 采用现代、庄重而自然的名单体表达。“又有”承接上文；分号表明本节仍属于连续列举。脚注标记置于实际需要说明的词组之后，而非机械沿用咨询层中错置的位置。
