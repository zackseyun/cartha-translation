  text: 'From the sons of Joab: Obadiah son of Jehiel[a], and with him 218 males.'
translation:
  language: zh_hans
  text: 约押的子孙中，有耶歇的儿子俄巴底亚；同他一起的男丁有二百一十八人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי יוֹאָב
  choice: 约押的子孙中
  rationale: מִן与בְּנֵי合用，在名单中引出约押家族这一支。“子孙中”既保留谱系结构，也避免误解为约押的亲生儿子。
- source_word: עֹבַדְיָה
  choice: 俄巴底亚
  rationale: 按现代中文圣经中通行的人名译法音译。
- source_word: בֶּן יְחִיאֵל
  choice: 耶歇的儿子
  rationale: בֶּן是标准的父子关系标记；“耶歇”采用通行中文音译。
- source_word: וְעִמּוֹ
  choice: 同他一起的
  rationale: 保留希伯来文的并列关系，说明后列人数是与这位领队者同行的人。
- source_word: מָאתַיִם וּשְׁמֹנָה עָשָׂר
  choice: 二百一十八
  rationale: 按原文复合数词准确译出；正文采用中文数字，符合庄重叙事和名单体例。
- source_word: הַזְּכָרִים
  choice: 男丁
  rationale: 该词明确指男性，但未必全是成年男子。“男丁”在家族人数统计的语境中自然，并保留其性别限定。
