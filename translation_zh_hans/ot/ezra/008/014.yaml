base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/014.yaml
  text: 'And from the sons of Bigvai: Uthai and Zabbud[b][a], and with them seventy males.'
translation:
  language: zh_hans
  text: 比革瓦伊的子孙中，有乌太和撒布[b]；跟他[a]同来的男丁有七十人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文作“跟他”，为单数；因上文提到两个人名，有些译本按语意译作“跟他们”。
    reason: lexical_alternative
  - marker: b
    text: 一些文本传统和古代译本在此反映的是另一个名字；马所拉文本作“撒布”。
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: ……的子孙中
  rationale: מִן＋בְּנֵי在本段名单中引出一个宗族群体。“子孙”既保留族谱色彩，也能自然表达这里不限于亲生儿子的较广含义。
- source_word: בִגְוַי
  choice: 比革瓦伊
  rationale: 专名按希伯来语音译，并与现代中文圣经人名的常见形式协调。
- source_word: עוּתַי
  choice: 乌太
  rationale: 按希伯来语专名音译。
- source_word: ו/זבוד
  choice: 和撒布
  rationale: 马所拉文本作זבוד，译为“撒布”；前置连词ו译作“和”。其他文本传统所反映的异名另见脚注。
- source_word: וְ/עִמּ/וֹ
  choice: 跟他同来
  rationale: עִמּוֹ带第三人称阳性单数后缀，字面为“与他一起”。尽管前面列出两个人名，正文仍保留原文单数，不擅自改为复数。
- source_word: שִׁבְעִים
  choice: 七十
  rationale: 直接表达基数。
- source_word: הַ/זְּכָרִים
  choice: 男丁
  rationale: זְכָרִים明确指男性；在返乡人员名单的语境中，“男丁”比泛称“人”更准确，也比生硬的“雄性”自然庄重。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的名单体表达。“子孙中”符合以斯拉记宗族名册的语境；分号使人名与随行人数的关系清楚。正文保留希伯来语“跟他”的单数形式，并用脚注说明其与前述两个人名之间的张力。
