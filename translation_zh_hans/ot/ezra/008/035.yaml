  text: הַ֠/בָּאִים מֵֽ/הַ/שְּׁבִ֨י בְנֵֽי הַ/גּוֹלָ֜ה הִקְרִ֥יבוּ עֹל֣וֹת לֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל פָּרִ֨ים שְׁנֵים עָשָׂ֤ר עַל כָּל יִשְׂרָאֵל֙ אֵילִ֣ים תִּשְׁעִ֣ים וְ/שִׁשָּׁ֗ה כְּבָשִׂים֙ שִׁבְעִ֣ים וְ/שִׁבְעָ֔ה צְפִירֵ֥י חַטָּ֖את שְׁנֵ֣ים עָשָׂ֑ר הַ/כֹּ֖ל עוֹלָ֥ה לַ/יהוָֽה־׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/035.yaml
  text: 'Those who had come from the captivity[a], the sons of the exile, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering[c][b]. All of it was a burnt offering to Yahweh.'
translation:
  language: zh_hans
  text: 那些从被掳中归来的人，即流亡归来的人[a]，向以色列的上帝献上燔祭：为全以色列献十二头公牛、九十六只公绵羊、七十七只羊羔，又献十二只公山羊作赎罪祭。所有这些都是献给耶和华的燔祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“流亡之子”，是指被掳流亡后归来的人。
    reason: cultural_note
  - marker: b
    text: 原文作“所有这些都是献给耶和华的燔祭”。这里照原文保留，尽管前面也提到公山羊作赎罪祭。
    reason: textual_tension
lexical_decisions:
- source_word: הַבָּאִים מֵהַשְּׁבִי
  choice: 那些从被掳之地归来的人
  rationale: 定冠词加分词指特定群体；结合已经抵达耶路撒冷的叙事语境，用“归来”自然表达其从被掳状态返回，而“被掳之地”保留 שְׁבִי 的被俘、被掳含义。
- source_word: בְנֵי הַגּוֹלָה
  choice: 就是流亡者
  rationale: “……之子”在此是表示群体身份的希伯来语习语；直译为“流亡之子”在现代汉语中生硬，故按实际所指译为“流亡者”，并用脚注说明原文形式。
- source_word: הִקְרִיבוּ עֹלוֹת
  choice: 献上燔祭
  rationale: הקריב 在献祭语境中译为“献上”；עֹלָה 采用汉语圣经传统且明确的祭祀术语“燔祭”。
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: 向以色列的上帝
  rationale: 介词 ל 在此标明祭物所献的对象；“向……献上”符合现代汉语表达。
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: 为全以色列
  rationale: עַל 在献祭语境中可表达代表或为了某群体；“为”简洁保留这种代表性，同时不把语义限定得过窄。
- source_word: אֵילִים
  choice: 公绵羊
  rationale: 明确该词所指为成年雄性绵羊，并避免仅用“公羊”可能产生的物种含混。
- source_word: כְּבָשִׂים
  choice: 羊羔
  rationale: 该词在祭牲清单中通常指幼羊；“羊羔”是自然、通行的对应词。
- source_word: צְפִירֵי חַטָּאת
  choice: 公山羊作赎罪祭
  rationale: צְפִירֵי 指公山羊，חַטָּאת 在这里是祭物类别；“作赎罪祭”清楚表达其献祭功能。
- source_word: הַכֹּל עוֹלָה לַיהוָה
  choice: 所有这些都是献给耶和华的燔祭
  rationale: 忠实保留马所拉文本的总结句，不因前文提到赎罪祭而加以协调或改写。
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式呈现四字神名，使其与一般称号“主”有所区别。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文采用中文读者广泛熟悉的专名“耶和华”，既体现这是名字，也避免以称号代替原文专名。
- issue: 赎罪祭与末句“所有这些都是……燔祭”之间的张力
  choice: 照原文保留总结句，并以脚注提示
  alternative: 把末句限制为仅指公牛、公绵羊和羊羔，或改写为“这些祭物都献给耶和华”
  rationale: 马所拉文本同时提到十二只公山羊作赎罪祭，并以“所有这些都是……燔祭”作结。翻译不应暗中消解这一文本张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被掳之地”“流亡者”分别反映 שְׁבִי 与 גּוֹלָה 的语义差别；数字用汉字书写以符合连续经文体例。脚注标记均置于正文相应位置。
