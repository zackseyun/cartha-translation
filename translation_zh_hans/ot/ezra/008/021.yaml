  naturalness: “宣告禁食”“在我们的上帝面前谦卑自己”庄重自然。将祈求的内容改为“为……求得一条平直的道路”，可消除末句搭配不自然和指向不清的问题。
  terminology: “上帝”“禁食”“谦卑自己”符合现代汉语圣经叙事的庄重语域；“亚哈瓦”音译一致。“平直的道路”保留了דֶּרֶךְ יְשָׁרָה的意象，脚注恰当说明“正路”和旅途平安的可能含义。
