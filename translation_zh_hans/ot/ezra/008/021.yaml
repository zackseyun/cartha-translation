  text: וָ/אֶקְרָ֨א שָׁ֥ם צוֹם֙ עַל הַ/נָּהָ֣ר אַהֲוָ֔א לְ/הִתְעַנּ֖וֹת לִ/פְנֵ֣י אֱלֹהֵ֑י/נוּ לְ/בַקֵּ֤שׁ מִמֶּ֨/נּוּ֙ דֶּ֣רֶךְ יְשָׁרָ֔ה לָ֥/נוּ וּ/לְ/טַפֵּ֖/נוּ וּ/לְ/כָל רְכוּשֵֽׁ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/021.yaml
  text: Then I proclaimed a fast there[a], at the Ahava River, that we might humble ourselves before our God, to seek from him a straight path for us, for our little ones[b], and for all our possessions.
translation:
  language: zh_hans
  text: 于是，我在亚哈瓦河边宣告禁食，以便我们在我们的上帝面前谦卑自己，向他为我们、我们的孩童和我们的一切财物求得一条平直的道路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平直的道路”也可译作“正路”；在本节的旅行语境中，也可指平安顺利的旅程。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: 于是，我……宣告
  rationale: 此处 קרא 指公开宣布；叙事性连接词 וַ־ 依上下文自然译为“于是”。
- source_word: צוֹם
  choice: 禁食
  rationale: 名词 צוֹם 指一次禁食的行动或安排；现代汉语用“宣告禁食”自然且准确。
- source_word: עַל הַנָּהָר אַהֲוָא
  choice: 在亚哈瓦河边
  rationale: 介词 עַל 与河流连用可表示在河边；亚哈瓦按地名音译。
- source_word: לְהִתְעַנּוֹת
  choice: 谦卑自己
  rationale: ענה 的 Hitpael 形式在禁食语境中表示克己、自卑；“谦卑自己”传达其宗教语境中的内在姿态，而不误导为自我伤害。
- source_word: לִפְנֵי אֱלֹהֵינוּ
  choice: 在我们的上帝面前
  rationale: 保留“在……面前”的关系性和敬拜性表达，也忠实呈现第一人称复数所属形式。
- source_word: לְבַקֵּשׁ מִמֶּנּוּ
  choice: 向他祈求
  rationale: בקש 在这里指向上帝寻求、求取；结合禁食祷告的语境，“祈求”是自然的现代汉语表达。
- source_word: דֶּרֶךְ יְשָׁרָה
  choice: 一条平直的道路
  rationale: 直译其“道路平直”的意象，不将意义收窄为单纯的旅途安全，也可涵盖正确引导。
- source_word: לָנוּ וּלְטַפֵּנוּ וּלְכָל רְכוּשֵׁנוּ
  choice: 使我们和我们的孩童，以及我们所有的财物，都有
  rationale: טף 指群体中的幼童或年幼家属，“孩童”比“孩子们”稍显庄重；רכוש 指随行的财物、产业，此处译“财物”简洁自然。
theological_decisions:
- issue: 禁食语境中 לְהִתְעַנּוֹת 的表达
  choice: 谦卑自己
  alternative: 苦待自己；克己
  rationale: 原文可较直译为“苦待自己”，但现代汉语可能使人联想到身体伤害。“谦卑自己”保留禁食所表达的自抑和降卑姿态，不额外引入特定宗派解释。
- issue: דֶּרֶךְ יְשָׁרָה 的意义范围
  choice: 一条平直的道路
  alternative: 正路；平安的旅程
  rationale: 原文既可在具体旅程层面指顺利、安全的道路，也可含正确引导之意。保留“平直的道路”这一意象，避免只取其中一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“宣告禁食”“在我们的上帝面前”保留经文的公共与敬虔语气；句法略作汉语化处理，以“使……都有一条平直的道路”清楚连接祈求的对象和内容。
