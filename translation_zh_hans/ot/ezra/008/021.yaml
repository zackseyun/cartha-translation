- from: 于是，我在亚哈瓦河边宣告禁食，使我们在我们的上帝面前谦卑自己，并向他祈求，使我们和我们的孩童，以及我们所有的财物，都有一条平直的道路。[a]
  to: 于是，我在亚哈瓦河边宣告禁食，以便我们在我们的上帝面前谦卑自己，向他为我们、我们的孩童和我们的一切财物求得一条平直的道路。[a]
