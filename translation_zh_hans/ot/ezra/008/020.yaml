revisions:
- from: 还有殿役，就是大卫和众首领派来协助利未人办理事务的，共有二百二十人；他们全都按名指定。[a]
  to: 又有殿役[a]，就是大卫和众首领为利未人的职务所派定的，共二百二十人；他们全都逐名列出。[b]
  rationale: 修订以“为利未人的职务所派定”保留原文的职务关联及行政派定意义，不具体断定其实际服役的从属方式；以“逐名列出”传达逐一明确记载的行政语气，并在脚注中保留“指定”的可能。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:20:40Z'
review_pass:
  verdict: revise
  source_fidelity: 原文将这二百二十名“殿役”界定为大卫和众首领先前为利未人的职务所派定的人，并说明他们全都逐名明确列出。草稿的“派来”容易增添朝说话者所在地而来的意味；“协助利未人办理事务”则较具体地解释为协助，略窄于原文“为利未人的职务/工作”。
  naturalness: “按名指定”可以理解，但现代中文行政语境中“逐名列出”更自然，也更清楚地表达逐一登记或指名的含义。修订后句子保持庄重、简明的经文体。
  terminology: “殿役”可作为 נְתִינִים 的清晰功能性译名；增设术语脚注以保留其为特定圣殿服役群体的技术性。将“办理事务”改为“为利未人的职务所派定”，避免把 עֲבֹדָה 限缩为一般行政事务。
  issues:
  - severity: medium
    issue: “派来”带有方向性，并弱化先前派定的行政含义。
    rationale: שֶׁנָּתַן 在此是大卫和首领将人员配置、派定给某项服役，并非叙述他们被“派来”某处。
  - severity: medium
    issue: “协助利未人办理事务”对 לַעֲבֹדַת הַלְוִיִּם 作了较具体的解释。
    rationale: 原文只说明他们为利未人的职务/服役而被派定；“协助”和“办理事务”分别增添从属协助及行政事务的色彩。
  - severity: low
    issue: “按名指定”不如“逐名列出”清晰自然。
    rationale: נִקְּבוּ בְשֵׁמוֹת 可指逐名明确记载或指定；正文采用较自然的“逐名列出”，脚注保留“逐名指定”的可能。
  revised_text: 又有殿役[a]，就是大卫和众首领为利未人的职务所派定的，共二百二十人；他们全都逐名列出。[b]
  revised_footnotes:
  - marker: a
    text: “殿役”希伯来文作“尼提宁”（Nethinim），指一类专门从事圣殿服役的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们全都逐名指定”。
    reason: alternative_reading
  revision_rationale: 修订以“为利未人的职务所派定”保留原文的职务关联及行政派定意义，不具体断定其实际服役的从属方式；以“逐名列出”传达逐一明确记载的行政语气，并在脚注中保留“指定”的可能。
