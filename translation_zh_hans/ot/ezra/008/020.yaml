base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/020.yaml
  text: And from the temple servants whom David and the officials had assigned to the service of the Levites[a], there were 220 temple servants[b]; all of them were designated by name.
translation:
  language: zh_hans
  text: 又有殿役[a]，就是大卫和众首领为利未人的职务所派定的，共二百二十人；他们全都逐名列出。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿役”希伯来文作“尼提宁”（Nethinim），指一类专门从事圣殿服役的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们全都逐名指定”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּתִינִים / נְתִינִים
  choice: 殿役
  rationale: 这是一个指特定圣殿服役群体的专门称谓。“殿役”简洁地表明其身份和职能，又不把它泛化为普通仆役。
- source_word: שֶׁנָּתַן
  choice: 派来
  rationale: 字面义为“给”，这里指大卫和首领把这些人配置给利未人的事务，译作“派来”符合行政语境，同时保留人员被交付任用的含义。
- source_word: וְהַשָּׂרִים
  choice: 众首领
  rationale: שׂרים 指具有领导或官长身份的人；“众首领”自然庄重，也避免把他们限定为现代官僚体系中的“官员”。
- source_word: לַעֲבֹדַת הַלְוִיִּם
  choice: 协助利未人办理事务
  rationale: 原文是“为利未人的工作/服役”。此译表达这些人被配置来支持利未人的职务，但不进一步断定具体从属方式。
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: 二百二十人
  rationale: 准确保留人数，并采用中文经文中自然庄重的汉字数字形式。
- source_word: כֻּלָּם
  choice: 他们全都
  rationale: 明确保留原文“他们全部”的总括强调。
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: 按名指定
  rationale: 该被动表达可指逐名明确指定，也可能涉及登记列名；正文采用较贴近词义的“按名指定”，并以脚注保留另一种理解。
