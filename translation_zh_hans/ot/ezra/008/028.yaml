  to: 我对他们说：“你们是归耶和华为圣的，器皿也是圣的；这些银子和金子是献给耶和华、你们列祖的上帝的甘心奉献。”
  rationale: 修订仅处理“甘心祭”可能造成的祭祀类别误读，并微调名词表达和同位结构，使译文更自然清楚。两处“圣”的呼应、耶和华的专名、圣殿器皿、银金，以及“你们列祖的上帝”均予保留。
