base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/028.yaml
  text: And I said to them, “You are holy to Yahweh, and the vessels are holy; and the silver and the gold are a freewill offering to Yahweh, the God of your fathers.”
translation:
  language: zh_hans
  text: 我对他们说：“你们是归耶和华为圣的，器皿也是圣的；这些银子和金子是献给耶和华、你们列祖的上帝的甘心奉献。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: 我对他们说
  rationale: 该叙事动词引出以斯拉的直接话语；现代汉语通常无需把连接词机械译作“于是”或“并且”。
- source_word: קֹדֶשׁ לַיהוָה
  choice: 归耶和华为圣
  rationale: 既保留“圣”的核心用语，也自然表达分别归属耶和华的礼仪性含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，而不以称号代替专名。
- source_word: הַכֵּלִים
  choice: 这些器皿
  rationale: 上下文指圣殿礼仪所用的器物；“器皿”准确、庄重，并符合中文宗教语境。
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: 这些金银
  rationale: 以自然中文合译两个带定冠词的名词，同时用“这些”体现其特指性。
- source_word: נְדָבָה
  choice: 甘心祭
  rationale: 该词指自愿奉献之物；“甘心祭”保留其礼仪术语色彩和自愿性质。
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: 你们列祖之上帝
  rationale: 保留原文男性复数的祖先称谓及其盟约性表达；“列祖”在庄重现代中文中清楚自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名；正文保留专名而非以“主”替代。中文采用广为读者熟悉的“耶和华”，同时不改变其专名性质。
- issue: קֹדֶשׁ לַיהוָה 所表达的圣洁与归属
  choice: 归耶和华为圣
  alternative: 对耶和华是圣的
  rationale: 此处不仅描述道德品质，更指人和器皿已分别出来、归属于耶和华；所选译法保留这层礼仪和盟约张力。
- issue: אֱלֹהֵי אֲבֹתֵיכֶם 的祖先称谓
  choice: 你们列祖之上帝
  alternative: 你们祖先的上帝
  rationale: 原文为阳性复数，并承载以色列盟约传统中的固定表达；“列祖”准确保留这一特点。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“归……为圣”维持原文两次 קֹדֶשׁ 的呼应；第二处简作“也是圣的”，避免中文重复笨重。破折号标明“你们列祖之上帝”是对“耶和华”的同位说明。
