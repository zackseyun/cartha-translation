base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/026.yaml
  text: And I weighed out into their hands six hundred and fifty talents of silver[a], and one hundred talents worth of silver vessels, and one hundred talents of gold.
translation:
  language: zh_hans
  text: 我把六百五十他连得银子、价值一百他连得的银器，以及一百他连得金子称量后交在他们手中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁקֲלָה
  choice: 我称出
  rationale: שׁקל在此指按重量核定贵重物品并将其交付；“称出”既表达称量，也符合清点交接财物的语境。
- source_word: עַל יָדָם
  choice: 交在他们手中
  rationale: 原文直译为“在他们手上”，在此表示把财物交托给他们保管；保留“手中”的具体意象，同时用“交在”使中文自然。
- source_word: כֶּסֶף
  choice: 银子
  rationale: 上下文谈的是按重量计量的贵金属，而非铸币；“银子”准确且适合历史叙事。
- source_word: כִּכָּרִים
  choice: 他连得
  rationale: כִּכָּר是古代的大重量单位；采用中文圣经读者较熟悉的音译“他连得”，避免用现代重量值造成虚假的精确性。
- source_word: שֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 六百五十
  rationale: 按原文基数词直接翻译，修饰银子的重量单位。
- source_word: וּכְלֵי כֶסֶף
  choice: 银器
  rationale: כְּלִי可指器皿、器具或物件；在圣殿财物清单中，“银器”简洁、庄重，并保留其较宽泛的器物含义。
- source_word: מֵאָה לְכִכָּרִים
  choice: 价值一百他连得的
  rationale: 原文此处表达省略，לְ很可能表示总重量或估值；正文以“价值一百他连得”传达银器合计相当于这一重量的银子，并以脚注保留另一种句法理解。
- source_word: זָהָב
  choice: 金子
  rationale: 指按重量清点的黄金；“金子”与前文“银子”对应，通俗而庄重。
- source_word: מֵאָה כִכָּר
  choice: 一百他连得
  rationale: 原文为数词加重量单位，直接译出金子的总重量。
theological_decisions: []
