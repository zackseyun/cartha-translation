  yaml_path: translation/ot/ezra/008/011.yaml
  text: 'And from the sons of Bebai: Zechariah son of Bebai[a], and with him twenty-eight males.'
translation:
  language: zh_hans
  text: 比拜的子孙[a]中，有比拜的儿子撒迦利亚；随同他的男性有二十八人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比拜的子孙”也可译作“比拜的后裔”或“比拜家族的人”。
    reason: 说明 בְּנֵי 在家族名册中可指后裔或宗族成员，不限于亲生儿子。
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: 比拜的子孙中
  rationale: 字面为“从比拜的众子中”；在家族名册语境中，בְּנֵי 可广指后裔或宗族成员。译作“子孙中”既自然，也避免误解为比拜的亲生儿子。
- source_word: בֵבַי
  choice: 比拜
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: זְכַרְיָה
  choice: 撒迦利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בֶּן
  choice: 儿子
  rationale: 此处处于直接父子称谓结构“撒迦利亚，比拜之子”中，译作“儿子”最直接；原文因此形成比拜既为宗族名祖、又为撒迦利亚之父的表述，予以保留。
- source_word: וְעִמּוֹ
  choice: 与他同来的
  rationale: 原义为“与他一起”；结合以斯拉带队归回的名单语境，译成“与他同来的”符合现代汉语，同时保留同行关系。
- source_word: עֶשְׂרִים וּשְׁמֹנָה
  choice: 二十八人
  rationale: 按现代汉语自然表达基数，并以“人”补足量词。
- source_word: הַזְּכָרִים
  choice: 男丁
  rationale: 原词明确指男性而不必限定为成年男子；“男丁”适合宗族点名语境，比“男人”庄重，也比单用“男性”自然。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保持名单体裁。用“子孙”表达宗族范围，用“儿子”表达紧接的人名父子关系；“男丁”保留原文对性别的明确标示。
