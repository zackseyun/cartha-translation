base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/001.yaml
  text: 'These are the heads of their fathers’ houses[a], and their genealogy, of those who went up with me from Babylon in the reign of King Artaxerxes:'
translation:
  language: zh_hans
  text: 以下是在亚达薛西王在位期间，同我从巴比伦上来之人的宗族首领，以及他们按家谱所作的登记记录[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的家谱”或“他们按家谱登记的名单”。希伯来语此词可指按世系所作的登记或其记录，不只是抽象意义上的祖先谱系。
    reason: 保留该词可指家谱、世系登记或登记记录的语义范围。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 用于引出下文名单，既体现连接和指示作用，又符合现代汉语列举体的表达习惯。
- source_word: רָאשֵׁי אֲבֹתֵיהֶם
  choice: 他们的各宗族族长
  rationale: רָאשֵׁי 表示首领；“父家”在此是父系宗族这一社会单位。译作“宗族族长”比直译“父家的头”自然清楚，并保留行政与家族背景。
- source_word: וְהִתְיַחְשָׂם
  choice: 以及他们的家谱登记
  rationale: 该词所指不只是抽象的血统，也可包括按世系进行登记或形成的记录；“家谱登记”保留这种记录性含义。
- source_word: הָעֹלִים
  choice: 上来之人
  rationale: 保留从巴比伦返回犹大和耶路撒冷惯用的“上来”表述；上下文表明这是已经发生的行动。
- source_word: עִמִּי
  choice: 同我
  rationale: 准确保留以斯拉第一人称叙述。
- source_word: בְּמַלְכוּת אַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: 亚达薛西王在位期间
  rationale: מַלְכוּת 在此表示君王统治时期；采用现代汉语自然的年代说明方式。人名依中文圣经通行译法译为“亚达薛西”。
- source_word: מִבָּבֶל
  choice: 从巴比伦
  rationale: 直接表达出发地，并按自然汉语置于“上来”之前。
theological_decisions: []
