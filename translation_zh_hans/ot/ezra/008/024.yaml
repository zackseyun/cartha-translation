base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/024.yaml
  text: 'Then I set apart twelve of the leading priests: Sherebiah[a], Hashabiah[b], and with them ten of their brothers.'
translation:
  language: zh_hans
  text: 我从祭司首领中分别出十二人[a]：示利比、哈沙比雅，以及与他们同在的十位弟兄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从祭司首领中”也可译为“从祭司的首领中”。
    reason: 原文介词 מִן 表示从某一群体中选出；“首领”也可译为“主管”或“官长”。
  - marker: b
    text: “弟兄”在这里也可能泛指他们的同族或同伴；希伯来原文使用的是阳性亲属称谓。
    reason: 保留 אָח 在群体语境中可超出亲兄弟范围的词义弹性。
lexical_decisions:
- source_word: וָאַבְדִּילָה
  choice: 我……分别出
  rationale: בדל 的使役式表示“使分开、分别出来”。这里是为特定职责拣出人员；“分别出”既贴近原文，也保留了可能具有的庄重、专用意味。连接词 וַ־ 融入中文叙事次序，没有机械译作“然后”。
- source_word: מִשָּׂרֵי הַכֹּהֲנִים
  choice: 从祭司中的首领里
  rationale: שַׂר 指首领、主管或官长；מִן 在此表示从某群体中选出。此译保留“祭司”与“首领”的从属关系，同时不把它等同于后世某一特定教阶。
- source_word: שְׁנֵים עָשָׂר
  choice: 十二人
  rationale: 直译数词，并按现代汉语补出量词“人”。
- source_word: לְשֵׁרֵבְיָה חֲשַׁבְיָה
  choice: 示利比、哈沙比雅
  rationale: 按圣经人名的通行汉语音译处理。上下文表明二人与随后十人合为十二人，因此以冒号引出名单；不把 לְ 的句法功能过度解释为额外关系。
- source_word: וְעִמָּהֶם
  choice: 以及和他们一起的
  rationale: 明确保留原文“与他们同在／同行”的附加结构，并用“以及”自然连接名单成分。
- source_word: מֵאֲחֵיהֶם
  choice: 弟兄
  rationale: אָח 的复数带阳性代词后缀，字面为“他们的兄弟”；在群体语境中也可泛指同族或同伴。正文采用直接而庄重的“弟兄”，脚注保留较宽泛的可能。
- source_word: עֲשָׂרָה
  choice: 十位
  rationale: 直译数词，并用敬重而自然的人数量词“位”。
theological_decisions:
- issue: “分别出”是否暗示正式圣职或特殊礼仪
  choice: 保留“分别出”，不添加任命、按立或献圣等说明
  alternative: 选出／任命
  rationale: 原文只陈述把这些人从群体中分开承担随后所述职责；不应据此引入特定宗派的职任或礼仪观念。
- issue: 名单中十二人的构成
  choice: 将示利比、哈沙比雅和十位弟兄理解为合计十二人
  alternative: 把示利比、哈沙比雅视为十二位祭司之外的人
  rationale: 原文的列举结构及数字关系自然指向二加十共十二人；冒号清楚表达此关系，同时不增添原文没有的身份说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“分别出”贴近希伯来文动作含义；人名采用简体中文圣经常见译名。标点用冒号显示后文是十二人的名单，避免读者误以为人数超过十二。
