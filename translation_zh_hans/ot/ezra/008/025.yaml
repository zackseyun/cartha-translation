  text: ו/אשקול/ה לָ/הֶ֔ם אֶת הַ/כֶּ֥סֶף וְ/אֶת הַ/זָּהָ֖ב וְ/אֶת הַ/כֵּלִ֑ים תְּרוּמַ֣ת בֵּית אֱלֹהֵ֗י/נוּ הַ/הֵרִ֨ימוּ֙ הַ/מֶּ֨לֶךְ֙ וְ/יֹעֲצָ֣י/ו וְ/שָׂרָ֔י/ו וְ/כָל יִשְׂרָאֵ֖ל הַ/נִּמְצָאִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/025.yaml
  text: And I weighed out to them the silver[a], the gold, and the vessels—the contribution for the house of our God that the king, his counselors, his officials, and all Israel who were present had offered.
translation:
  language: zh_hans
  text: 我把银子、金子和器皿按重量交给他们；这是王、他的谋士和官员，以及所有在场的以色列人为我们上帝的殿所献的捐献[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“供物”。原文所用的词指分别出来、为神圣用途献上的捐献。
    reason: 保留 תְּרוּמָה 在一般捐献与神圣供物之间的词义幅度。
lexical_decisions:
- source_word: וָאֶשְׁקֳלָה לָהֶם
  choice: 我把……称了，交给他们
  rationale: שקל 的基本义是“称量”；לָהֶם 表明接收者。结合上下文中正式托付财物的场景，用“称了，交给他们”既保留称重动作，也自然表达交付含义。
- source_word: הַכֶּסֶף וְאֶת־הַזָּהָב
  choice: 银子、金子
  rationale: 这里与器皿并列，指贵重材质，而不是泛指钱财。
- source_word: הַכֵּלִים
  choice: 器皿
  rationale: כֵּלִים 可泛指器具；在圣殿语境中，“器皿”准确、自然，并保留礼仪用品的语感。
- source_word: תְּרוּמַת
  choice: 礼物
  rationale: תְּרוּמָה 指分别出来、献作神圣用途的捐献。“礼物”在现代汉语中自然，同时由“献给”明确其奉献性质；脚注补充“供物”这一较具礼仪色彩的译法。
- source_word: בֵּית אֱלֹהֵינוּ
  choice: 我们上帝的殿
  rationale: 希伯来文直译为“我们上帝的家”。此处所指为圣殿，汉语译作“殿”既准确又比“家”自然，同时保留“上帝的殿”这一意象。
- source_word: הֵרִימוּ
  choice: 献上的
  rationale: 该词在此指把财物分别出来并呈献；“献上”兼顾奉献动作及神圣用途，不必采用生硬的字面义“举起”。
- source_word: יֹעֲצָיו וְשָׂרָיו
  choice: 他的谋士、官员
  rationale: יֹעֲצָיו 是向王提供谋略的人；שָׂרָיו 在波斯行政背景下宜译为“官员”，避免“王子”所暗示的王室血统。
- source_word: וְכָל־יִשְׂרָאֵל הַנִּמְצָאִים
  choice: 以及所有在场的以色列人
  rationale: הַנִּמְצָאִים 表示当时在场或当地可找到的人。“所有在场的以色列人”符合现代汉语，也保留范围限定。
theological_decisions:
- issue: 圣殿捐献术语 תְּרוּמָה
  choice: 献给……殿的礼物
  alternative: 献给……殿的供物／捐献
  rationale: 本节所说的是为圣殿分别出来的贵重财物，不一定是某一种特定祭物。“礼物”避免过度限定，脚注则保留“供物”这一可能译法及其神圣用途含义。
- issue: בֵּית אֱלֹהֵינוּ 的表达
  choice: 我们上帝的殿
  alternative: 我们上帝的家
  rationale: 原文用“家／房屋”称圣所，但在此历史语境中明确指圣殿。汉语“殿”自然清楚，又不引入额外教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“称了，交给他们”使原文的称量与接收关系在汉语中清楚；分号划分财物交付和财物来源，避免长句歧义。
