base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/023.yaml
  text: So we fasted and sought our God concerning this[a], and he answered our plea.
translation:
  language: zh_hans
  text: 于是，我们禁食，为这事向我们的上帝祈求；他应允了我们的祈求[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他垂听了我们的祈求”；较直译：“他被我们恳求。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנָּצוּמָה
  choice: 我们禁食
  rationale: צום意为“禁食”；此处第一人称复数直接叙述众人的行动，并没有明说“宣告禁食”。
- source_word: וַנְּבַקְשָׁה מֵאֱלֹהֵינוּ
  choice: 向我们的上帝祈求
  rationale: בקשׁ与מן连用，在此祷告语境中表示向某人寻求、求取。中文若直译为“从我们的上帝寻求”不自然；“向……祈求”既体现请求的方向，也符合上下文。
- source_word: עַל זֹאת
  choice: 为这事
  rationale: עַל זֹאת回指上文所说的事项，意为“为此事、关于这事”。“为这事”在中文中简洁自然。
- source_word: וַיֵּעָתֵר לָנוּ
  choice: 他应允了我们
  rationale: עתר的尼法勒式在祈求语境中表示因恳求而作出有利回应；לָנוּ指“对我们、向我们”。“应允了我们”保留神回应祈求的含义，又不额外说明回应的具体方式。
theological_decisions:
- issue: 如何表达וַיֵּעָתֵר所指的神的回应
  choice: 他应允了我们
  alternative: 他听了我们的祈求／他因我们的恳求而动
  rationale: 原文表达上帝对祈求作出有利回应，但没有进一步说明回应的形式。“应允”自然庄重，也避免把经文强化为所求细节都按人的预期实现。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“于是”承接前文；分号呈现禁食祈求与上帝回应之间紧密的叙事关系。脚注标记置于相关分句之后。
