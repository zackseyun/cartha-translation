  text: וּ/כְפֹרֵ֤י זָהָב֙ עֶשְׂרִ֔ים לַ/אֲדַרְכֹנִ֖ים אָ֑לֶף וּ/כְלֵ֨י נְחֹ֜שֶׁת מֻצְהָ֤ב טוֹבָה֙ שְׁנַ֔יִם חֲמוּדֹ֖ת כַּ/זָּהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/027.yaml
  text: and twenty bowls of gold worth a thousand darics[a], and two vessels of fine gleaming bronze[b], precious as gold.
translation:
  language: zh_hans
  text: 又有二十只金碗，价值一千达利克[a]；还有两件精美光亮的铜器[b]，像金子一样珍贵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“二十只金碗，共值一千达利克。”希伯来文可能是在说明这些碗的总估价。
    reason: lexical_alternative
  - marker: b
    text: 或译：“两件上好的磨光铜器。”希伯来文中形容这些铜器的说法很罕见，可能是指工艺精良、表面光亮。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפֹרֵי זָהָב
  choice: 金碗
  rationale: כְפֹרֵי 指碗状器皿；结合圣殿财物清单的语境，译作“金碗”自然、明确。
- source_word: לַאֲדַרְכֹנִים אָלֶף
  choice: 价值一千达利克
  rationale: אֲדַרְכֹנִים 是波斯时期的金币或重量单位；介词 ל 在此很可能表示估价，因此用“价值”表达，同时保留历史单位“达利克”。
- source_word: כְלֵי נְחֹשֶׁת
  choice: 铜器
  rationale: כְלֵי 是器具或器皿的广义称呼；נְחֹשֶׁת 可指铜或青铜。现代中文“铜器”既自然，也保留材质上的一定开放性。
- source_word: מֻצְהָב טוֹבָה
  choice: 精美光亮的
  rationale: 这一罕见表达的具体含义并不完全确定，很可能形容铜器质地优良、表面闪亮；“精美光亮”避免武断地解释为镀金。
- source_word: חֲמוּדֹת כַּזָּהָב
  choice: 像金子一样珍贵
  rationale: חֲמוּדֹת 表示可珍爱、贵重；כַזָּהָב 明确作比较，故译为“像金子一样珍贵”。
