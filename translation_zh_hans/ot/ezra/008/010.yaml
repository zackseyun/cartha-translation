  text: And from the sons of Shelomith[a], the son of Josiphiah, and with him 160 males.
translation:
  language: zh_hans
  text: 属示罗密（约细斐亚的儿子）的子孙中，随同他来的是一百六十名男性。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: 属……的子孙中
  rationale: 该短语由连词、介词和“儿子们”组成，在以斯拉记的名单语境中表示某一宗族或后裔群体中的人。“子孙”既保留谱系含义，也比字面的“儿子们”更符合现代汉语。
- source_word: שְׁלוֹמִית
  choice: 示罗密
  rationale: 按现代中文圣经人名的通行音译处理此希伯来专名。
- source_word: בֶּן
  choice: 儿子
  rationale: 按马所拉文本，将其理解为单数“儿子”，并使“约细斐亚的儿子”与前面的宗族名称形成同位说明；原文此处未保存该儿子的名字，因此不作补充。
- source_word: יוֹסִפְיָה
  choice: 约细斐亚
  rationale: 采用该希伯来人名在中文圣经传统中较通行且贴近原音的译法。
- source_word: וְ/עִמּוֹ
  choice: 以及同他一起的
  rationale: 保留连接词和“与他同在”的随行含义；“他”按语法最自然地指前述那位未具名的儿子。
- source_word: מֵאָה וְשִׁשִּׁים
  choice: 一百六十
  rationale: 用中文数字完整表达名单中的人数，庄重且易读。
- source_word: הַזְּכָרִים
  choice: 男子
  rationale: 原词明确指男性成员，但不必断定全为成年战士；“男子”在中文名单语境中较自然，并保留性别限定。
