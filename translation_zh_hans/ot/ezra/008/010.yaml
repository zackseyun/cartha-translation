  to: 属示罗密（约细斐亚的儿子）的子孙中，随同他来的是一百六十名男性。
  rationale: 修订按WLC的同位结构及英文POB审校轨迹，将“约细斐亚的儿子”明确连接到示罗密；“子孙”保留“sons of”在名单语境中的宗族含义。“随同他来的是”自然表达“and with him”，同时使代词所指明确。删除无根据地宣称姓名缺失的文本脚注，以免把未在本节马所拉文本中明示的异读当作正文问题。
