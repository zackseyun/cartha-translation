  text: 'And from the sons of Shephatiah: Zebadiah son of Michael[a], and with him eighty males.'
translation:
  language: zh_hans
  text: 示法提雅的子孙中，有米迦勒的儿子西巴第雅；随同他的有八十名男子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: ……的子孙中
  rationale: 该短语由连词、介词和“儿子们”组成；在这份宗族名单中，בְּנֵי 指较广义的宗族后裔，不必限于亲生儿子。译作“子孙”既符合语境，也避免现代汉语将“儿子”误解为直系关系。句首连词融入名单承接结构，不另译“又”。
- source_word: שְׁפַטְיָה
  choice: 示法提
  rationale: 按现代中文圣经人名的惯常音译处理。
- source_word: זְבַדְיָה
  choice: 西巴第雅
  rationale: 按现代中文圣经人名的惯常音译处理。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 此处紧接具体人名米迦勒，通常表示直接父子关系，因此译作“儿子”，不泛化为“后裔”。
- source_word: מִיכָאֵל
  choice: 米迦勒
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וְ/עִמּוֹ
  choice: 同他一起的有
  rationale: 保留“与他同在／随同他”的关系，并用自然汉语引出随行人数。
- source_word: שְׁמֹנִים
  choice: 八十
  rationale: 直接对应原文基数词。
- source_word: הַזְּכָרִים
  choice: 男子
  rationale: 原词明确指男性；在人员名册和随行队伍的语境中，“男子”比“男性”自然，也比不标明性别的“人”更准确。
