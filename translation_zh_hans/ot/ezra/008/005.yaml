  rationale: 将“雅哈悉的儿子”以破折号标作“示迦尼”的同位说明，依照所给原文审校轨迹保留姓名关系；同时以“随同他”承接名单中的领队及其同行者。删除原脚注a，因为它把正文关系改写为未具名人物，反而制造不必要且不适合本审校轨迹的歧义。
