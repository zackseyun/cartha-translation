  naturalness: “示迦尼的子孙中，有雅哈悉的儿子”语法和指称均不自然；“跟他一起的男性共有三百人”中的“他”也因前句未明确领队而缺少稳定指向。改为破折号同位语和“随同他”可保持名单体并使指称清楚。
  terminology: 人名采用“示迦尼、雅哈悉”可接受且前后一致。“男性”准确反映זְכָרִים按生理性别的标记，避免“男人”所可能带出的成年含义。
  issues:
