  text: מִ/בְּנֵ֥י שְׁכַנְיָ֖ה בֶּן יַחֲזִיאֵ֑ל וְ/עִמּ֕/וֹ שְׁלֹ֥שׁ מֵא֖וֹת הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/005.yaml
  text: From the sons of Shecaniah[a], the son of Jahaziel, and with him three hundred males.
translation:
  language: zh_hans
  text: 在示迦尼——雅哈悉的儿子——的子孙中，随同他的男性有三百人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文特指男性，强调性别，而不是年龄或社会身份；也可译作“男丁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: ……的子孙中
  rationale: מן与בני构成名单中的分组表达。译作“……的子孙中”既自然，也保留家族谱系含义；“儿子中”在现代汉语里容易被误解为仅指亲生儿子。
- source_word: שְׁכַנְיָה
  choice: 示迦尼
  rationale: 按现代中文圣经人名的常见音译处理。
- source_word: בֶּן יַחֲזִיאֵל
  choice: 雅哈悉的儿子
  rationale: 依马所拉文本的直接词序翻译。原文没有写出这位“儿子”的名字，因此正文不擅自补名，也不把语法关系无提示地改为“示迦尼是雅哈悉的儿子”。
- source_word: וְעִמּוֹ
  choice: 跟他一起的
  rationale: 指与前述领队同行的人；现代汉语用“跟他一起的”自然表达随行关系。
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: 共有三百人
  rationale: 准确表达数目，并用“共有”使名单式短句在现代汉语中更顺畅。
- source_word: הַזְּכָרִים
  choice: 男性
  rationale: זכרים明确按生理性别指男性，不必然只指成年男子；“男性”比“男丁”或“男人”更少附带年龄及社会身份含义。
theological_decisions:
- issue: “雅哈悉的儿子”与“示迦尼”的句法关系
  choice: 正文保留马所拉文本中一位未具名的“雅哈悉的儿子”
  alternative: “示迦尼——雅哈悉的儿子——和跟他一起的……”
  rationale: 希伯来文本的措辞简略，名单结构似乎没有写出领队姓名；也可把“雅哈悉的儿子”理解为对示迦尼的同位说明。该处不涉及必须统一的教义判断，故以脚注保存另一种句法理解。
translation_notes:
  register: 采用庄重而明白的现代标准汉语，并保留家谱名单的简洁结构。分号划分领队身份与随行人数，使残缺而含混的原文结构仍可读，却不替原文补出未经证实的人名。
