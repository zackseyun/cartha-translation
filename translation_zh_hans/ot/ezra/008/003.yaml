base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/003.yaml
  text: 'From the sons of Shecaniah[a], from the sons of Parosh: Zechariah, and with him were enrolled by genealogy 150 males.'
translation:
  language: zh_hans
  text: 示迦尼的子孙中；巴录的子孙中有撒迦利亚，与他一同按族谱登记[a]的男性有一百五十人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按族谱登记”也可译作“按家谱核入名册”。希伯来文指依据家谱进行正式登记或核定。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי שְׁכַנְיָה
  choice: 示迦尼的子孙中
  rationale: 保留介词短语和名单体裁的简略结构；原文在“示迦尼的子孙中”之后没有明确写出领队姓名，译文不擅自补足。
- source_word: מִבְּנֵי פַרְעֹשׁ
  choice: 巴录的子孙中
  rationale: 按以斯拉记传统人名译法音译家族名，并保留“从……子孙中”的名单结构。
- source_word: זְכַרְיָה
  choice: 撒迦利亚
  rationale: 采用现代中文圣经读者熟悉的传统人名译法。
- source_word: וְעִמּוֹ
  choice: 同他一起
  rationale: 简洁表达与撒迦利亚同行并列入名册的人。
- source_word: הִתְיַחֵשׂ
  choice: 按族谱登记
  rationale: 该词的 Hitpael 形式表示按家谱核验、归属或登记，不仅泛指同行或点数。
- source_word: לִזְכָרִים
  choice: 男性
  rationale: 原文明确说“男性”，并未限定都是成年男子；因此不译作“男丁”或“男人”。
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: 一百五十人
  rationale: 准确保留名册中的人数，并用中文正文常用汉字数字表达。
theological_decisions:
- issue: “示迦尼的子孙中”与下文的句法关系
  choice: 保留为独立而略显中断的名单项目，以分号呈现
  alternative: 将示迦尼解释为巴录的后裔，或把撒迦利亚同时归入示迦尼一支
  rationale: 马所拉文本连续出现两个“……的子孙中”，且第一个短语之后未明说领队姓名。原文关系存在困难，译文不应替原文决定谱系关系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留家谱名单的简洁语气。以分号反映希伯来文本在“示迦尼的子孙中”之后的突兀停顿，不擅自补写原文没有的人名或亲属关系。
