base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/033.yaml
  text: And on the fourth day[a], the silver and the gold and the vessels were weighed out in the house of our God into the hand of Meremoth son of Uriah the priest, and with him was Eleazar son of Phinehas, and with them were Jozabad son of Jeshua and Noadiah son of Binnui[b], the Levites.
translation:
  language: zh_hans
  text: 第四天，在我们神的殿里，银子、金子和器皿都经过称量，交在祭司米利末——乌利亚的儿子——手中；同他一起的有非尼哈的儿子以利亚撒；同他们一起的有利未人耶书亚的儿子约撒拔和宾内的儿子挪亚底。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: 第四天
  rationale: 按叙事顺序表达时间，不增添原文未明说的“到达后”等信息；汉语无需机械译出句首连接词。
- source_word: נִשְׁקַל
  choice: 都……称过
  rationale: 尼法勒完成式表达被动且已完成的行政核验动作；“称过”在现代汉语中自然地体现清点交接时的称量。
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: 银子、金子和器皿
  rationale: “器皿”在圣殿财物语境中既具体又庄重，涵盖器具和容器，不把所指过度限定。
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: 在我们神的殿里
  rationale: “殿”自然传达此处“神的家”即圣殿的所指，同时保留“我们神”的群体性表达。
- source_word: עַל יַד
  choice: 交在……手中
  rationale: 保留希伯来语“手中”的形象，同时清楚表达财物经称量后交由其负责保管的含义。
- source_word: מְרֵמוֹת בֶּן אֽוּרִיָּה הַכֹּהֵן
  choice: 祭司乌利亚的儿子米利末
  rationale: 依语境将“祭司”理解为修饰米利末；调整为自然汉语次序，并采用常见圣经人名译法。
- source_word: וְעִמּוֹ / וְעִמָּהֶם
  choice: 同他一起的有／同他们一起的还有
  rationale: 自然体现两层陪同关系，并忠实区分单数“他”和复数“他们”。
- source_word: יוֹזָבָד בֶּן יֵשׁוּעַ וְנֹעַדְיָה בֶן בִּנּוּי הַלְוִיִּם
  choice: 利未人耶书亚的儿子约撒拔和宾内的儿子挪亚底
  rationale: 句末复数“利未人”共同指最后两位人物；前置共同身份可避免汉语歧义，又不把该身份扩展到前两人。
theological_decisions:
- issue: “祭司”（הַכֹּהֵן）所修饰的人物
  choice: 理解为米利末的身份
  alternative: 理解为其父乌利亚的身份
  rationale: 定冠词身份称谓在这一结构和名单语境中更自然地同当前主要人物米利末同位；但希伯来语词序在形式上可能让读者短暂联想到乌利亚。
- issue: “利未人”（הַלְוִיִּם）的指称范围
  choice: 仅共同指约撒拔和挪亚底
  alternative: 指本句更广范围的人员
  rationale: 复数称谓紧随最后两名人物，且前两人的祭司身份另有说明，因此最自然地限定最后两人。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留“交在……手中”的源语意象，但以“交”明示行政托付关系；避免照搬英文“weighed out”而加入原文没有独立词项支持的分发含义。人名采用简体中文圣经传统中通行的音译形式。
