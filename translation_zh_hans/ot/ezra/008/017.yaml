  text: ו/אוצא/ה אוֹתָ/ם֙ עַל אִדּ֣וֹ הָ/רֹ֔אשׁ בְּ/כָסִפְיָ֖א הַ/מָּק֑וֹם וָ/אָשִׂימָ/ה֩ בְּ/פִי/הֶ֨ם דְּבָרִ֜ים לְ֠/דַבֵּר אֶל אִדּ֨וֹ אָחִ֤י/ו ה/נתונים בְּ/כָסִפְיָ֣א הַ/מָּק֔וֹם לְ/הָֽבִיא לָ֥/נוּ מְשָׁרְתִ֖ים לְ/בֵ֥ית אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/017.yaml
  text: And I sent them to Iddo[a], the chief at the place Casiphia, and I put in their mouths words to speak to Iddo and his brothers, the temple servants at the place Casiphia[b], to bring us ministers for the house of our God.
translation:
  language: zh_hans
  text: 我派他们到迦西斐雅那地方的首领易多那里，并把要说的话交给他们，让他们对易多和他的弟兄——在迦西斐雅那地方的殿役[a]——说，请他们为我们上帝的殿带来服事的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿役”传统上也音译为“尼提宁人”，是与圣殿服务有关的一类人员。
    reason: lexical_alternative
  - marker: b
    text: 这里的“服事的人”指为圣殿供职者，不一定表示后来制度中的正式宗教职分。
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹוצִיאָה
  choice: 我派他们
  rationale: 使役形在这里表示差遣使者前往；译作“派”符合现代汉语，也贴合上下文中的委派行动。
- source_word: אִדּוֹ הָרֹאשׁ
  choice: 首领易多
  rationale: רֹאשׁ本义为“头”，在此是负责人或领袖的称号；“首领”简洁而庄重。
- source_word: בְּכָסִפְיָא הַמָּקוֹם
  choice: 在迦西斐雅那地方
  rationale: 保留מָקוֹם“地方”，同时按现代汉语调整语序。
- source_word: וָאָשִׂימָה בְּפִיהֶם דְּבָרִים
  choice: 把该说的话交代给他们
  rationale: 原文直译为“把话放在他们口中”，是授予口信的希伯来语表达；采用自然汉语传达其实际意义。
- source_word: אֶל אִדּוֹ אָחִיו
  choice: 对易多和他的弟兄
  rationale: 元音标注的אָחִיו通常表示复数“他的弟兄”，且后面的复数称谓与这一理解相合。
- source_word: הַנְּתוּנִים
  choice: 殿役
  rationale: 该词在《以斯拉记—尼希米记》中指派定从事圣殿劳役的一类人；“殿役”简明地区分其历史身份，传统音译在脚注说明。
- source_word: מְשָׁרְתִים
  choice: 服事的人
  rationale: 该分词指实际承担服务的人；此处采用功能性表达，并与专称הַנְּתוּנִים“殿役”有所区分。
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: 为我们上帝的殿
  rationale: 保留“我们上帝的殿”这一原文表达，同时以“为”体现这些人员被带来是供圣殿使用。
theological_decisions:
- issue: 如何表达הַנְּתוּנִים这一圣殿服务群体
  choice: 殿役
  alternative: 尼提宁人／被赐予的人
  rationale: “殿役”直接说明其历史职能，又不引入后世教会职制；传统音译保留在脚注中。
- issue: 如何区分מְשָׁרְתִים与הַנְּתוּנִים
  choice: 服事的人
  alternative: 执事／仆役
  rationale: “服事的人”保留较宽泛的服务含义，不把该词解释为后世正式宗教职分，也避免与作为特定群体的“殿役”混同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“把该说的话交代给他们”自然传达希伯来语“把话放在他们口中”的惯用意义；“殿役”与“服事的人”分别呈现特定群体名称和较宽泛的服务角色。
