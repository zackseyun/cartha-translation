revisions:
- from: 我派他们到迦西斐雅那地方的首领易多那里，并把该说的话交代给他们，叫他们对易多和他的弟兄，就是在迦西斐雅那地方的殿役[a]，说：要为我们上帝的殿带些服事的人[b]来。
  to: 我派他们到迦西斐雅那地方的首领易多那里，并把要说的话交给他们，让他们对易多和他的弟兄——在迦西斐雅那地方的殿役[a]——说，请他们为我们上帝的殿带来服事的人[b]。
  rationale: 修订不改变经文的句法关系或历史指称：易多及其弟兄被说明为在迦西斐雅的殿役，受差遣者奉命请他们带来为上帝之殿服务的人员。删去无依据的数量限定，并缓和脚注中可能过度具体化的“劳役”表述。脚注锚点仍分别附于“殿役”和“服事的人”。
  reviewer_model: gpt-5.6-terra
