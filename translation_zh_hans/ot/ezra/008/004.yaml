  text: 'From the sons of Pahath-moab: Eliehoenai son of Zerahiah[a], and with him two hundred males.'
translation:
  language: zh_hans
  text: 巴哈·摩押的子孙中，有西拉希雅的儿子以利约乃，以及同他一起的二百名男子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי
  choice: ……的子孙中
  rationale: מִן表示“从……中”，בְּנֵי在族谱名单中可指某家族或祖先的后裔；译作“子孙”比字面的“儿子们”更符合现代汉语，同时保留家族称谓。
- source_word: פַּחַת מוֹאָב
  choice: 帕哈·摩押
  rationale: 这是家族名，采用音译；间隔号表明两部分共同构成一个专名。
- source_word: אֶלְיְהוֹעֵינַי
  choice: 以利约乃
  rationale: 按希伯来语辅音与元音音译，并采用自然、常见的中文圣经人名形式。
- source_word: בֶּן זְרַחְיָה
  choice: 西拉希雅的儿子
  rationale: 直接表达明确的父子关系；汉语中将父名置于“的儿子”之前，清楚自然。
- source_word: וְעִמּוֹ
  choice: 以及同他一起的
  rationale: 保留连接词和随同关系，并使其自然衔接后面的数量短语。
- source_word: מָאתַיִם
  choice: 二百
  rationale: 直接对应希伯来语基数词。
- source_word: הַזְּכָרִים
  choice: 男子
  rationale: 该词明确指男性；“男子”在中文名单语境中既准确又自然，比生物学色彩较强的“雄性”或较宽泛的“人”更合适。
