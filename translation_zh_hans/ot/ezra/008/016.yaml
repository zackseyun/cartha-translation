base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/016.yaml
  text: Then I sent for Eliezer[a], Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, heads, and for Joiarib and Elnathan[b], men of understanding.
translation:
  language: zh_hans
  text: 于是，我派遣以利以谢、亚列、示玛雅、以利拿单、雅立、以利拿单、拿单、撒迦利亚和米书兰这些首领[a]，以及约雅立和以利拿单这两位通达的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”原文直译为“头”，也可译作“领袖”。
    reason: lexical_alternative
  - marker: b
    text: “通达的人”也可译作“有见识的人”“有洞察力的人”或“有学识的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: 于是，我派人去召
  rationale: 该叙事形式承接前文，表示下一步行动；结合后续语境，这里不是单纯“差遣”名单中的人，而是派人把他们召来。
- source_word: לֶאֱלִיעֶזֶר ... וּלְאֶלְנָתָן
  choice: 召以利以谢……和以利拿单
  rationale: 重复的介词 ל 标示召请所指向的人；现代汉语无需逐一重复介词。
- source_word: רָאשִׁים
  choice: 首领
  rationale: 字面为“头”，用于人时指居领导地位者；“首领”自然、庄重，也保留其身份含义。
- source_word: מְבִינִים
  choice: 有见识的人
  rationale: 该词源于 בין，含理解、辨明、洞察之意；此处不宜过度具体化为正式职分“教师”或单指学问的“学者”。
- source_word: וּלְיוֹיָרִיב וּלְאֶלְנָתָן מְבִינִים
  choice: 又召约雅立和以利拿单这两位有见识的人
  rationale: 末尾的同位语最自然地修饰紧邻的约雅立和以利拿单，与前一组称为“首领”的人区分开来。
- source_word: יוֹיָרִיב
  choice: 约雅立
  rationale: 采用现代中文圣经人名的常见音译形式。
- source_word: אֶלְנָתָן
  choice: 以利拿单
  rationale: 原文在本节三次出现此名，译文全部保留，不作合并，因为可能是三位同名者。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以“派人去召”明确中文习惯下的差遣与召集关系；保留三个“以利拿单”，并用“这些”“这两位”清楚呈现原文两组同位结构。
