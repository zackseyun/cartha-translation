  text: 'And from the sons of Azgad: Johanan son of Hakkatan[b][a], and with him 110 males.'
translation:
  language: zh_hans
  text: 押斯甲的子孙中，有哈加坦的儿子约哈难[a]；随同他的男丁共一百一十人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈加坦”也可译作“较年轻的那位”；原文可能是人名，也可能是描述语。
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי עַזְגָּד
  choice: 属押斯甲的子孙中
  rationale: “בְּנֵי”在此族谱名单中指押斯甲的家族后裔，不限于亲生儿子；译作“子孙”既符合现代汉语，也保留家族谱系含义。
- source_word: יוֹחָנָן
  choice: 约哈难
  rationale: 按希伯来语人名音译，并采用中文圣经中常见的译名形式。
- source_word: בֶּן הַ/קָּטָן
  choice: 哈加坦的儿子
  rationale: 在名单结构中将הַקָּטָן视为专名较为自然；但原文也可能是描述性的“那较年轻者”，故以脚注保留歧义。
- source_word: וְ/עִמּוֹ
  choice: 与他同来的
  rationale: 该固定名单用语表示随这位领袖同行的人；补出“来的”使现代汉语自然，并符合本段集结返程者的语境。
- source_word: מֵאָה וַ/עֲשָׂרָה
  choice: 一百一十人
  rationale: 准确表达希伯来语数词，并使用适合正文的中文数字写法。
- source_word: הַ/זְּכָרִים
  choice: 男丁
  rationale: 原词明确指男性成员；“男丁”在家族人数名册中自然、简洁，并保留性别限定，不武断限定为成年男子。
