  text: Everything was counted by number and by weight, and the total weight was recorded at that time.
translation:
  language: zh_hans
  text: 一切都按数目和重量核验；当时，总重量被记录下来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译，较直译：“按数目、按重量，适用于一切；当时，所有重量都被写下。”
    reason: 保留原文 בְּמִסְפָּר בְּמִשְׁקָל לַכֹּל 的压缩句法，以及 וַיִּכָּתֵב 和 כָּל הַמִּשְׁקָל 较为字面的表达。
lexical_decisions:
- source_word: בְּמִסְפָּר
  choice: 按数目清点
  rationale: מִסְפָּר表示“数目、数量”。结合圣殿财物交接清查的语境，用“按数目清点”既保留介词短语的方式含义，也符合现代汉语表达。
- source_word: בְּמִשְׁקָל
  choice: 按重量清点
  rationale: מִשְׁקָל意为“重量”。与“按数目”并列，表明财物依数量和重量核验；共用“清点”可自然呈现希伯来语的简略结构。
- source_word: לַכֹּל
  choice: 一切都
  rationale: לַכֹּל强调清点和称量涵盖全部交付之物。“一切都”简洁地表达这种完整范围，同时保留原文略显压缩的结构所具有的可能性。
- source_word: וַיִּכָּתֵב
  choice: 记录在册
  rationale: כתב的尼法勒式为被动，字面是“被写下”。在财物交接的行政语境中，“记录在册”自然地表达正式书面登记。
- source_word: כָּל הַמִּשְׁקָל
  choice: 总重量
  rationale: 字面为“全部重量”。此处指所核验财物重量的完整记录；“总重量”是自然、简明的现代汉语表达，但脚注保留较直译的形式。
- source_word: בָּעֵת הַהִיא
  choice: 当时
  rationale: 该时间短语直指交付和核验发生的那个时候；“当时”保留指示意味，也符合现代汉语叙事习惯。
