  text: 'And from the sons of Adin: Ebed son of Jonathan[a], and with him fifty males.'
translation:
  language: zh_hans
  text: 亚丁的子孙中：约拿单的儿子以别；同他一起的男丁五十人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי עָדִין
  choice: 亚丁的子孙中
  rationale: בני 在宗族名单中可指后裔或宗族成员；译作“子孙”比字面的“儿子们”更符合现代汉语，又保留谱系关系。连接词 וּ 融入名单句式，不另译“和”。
- source_word: עֶבֶד
  choice: 以别
  rationale: 此处是人名而非普通名词“仆人”；采用现代中文圣经中常见且贴近希伯来语读音的译名。
- source_word: בֶּן יוֹנָתָן
  choice: 约拿单的儿子
  rationale: בן 是标准的父子关系标记；按自然汉语调整语序。יוֹנָתָן 音译为通行的“约拿单”。
- source_word: וְ/עִמּוֹ
  choice: 与他同来的
  rationale: 原文直译为“与他一起的”；结合归回人员名单的语境，译作“与他同来的”自然清楚，同时不增添名单之外的身份说明。
- source_word: חֲמִשִּׁים
  choice: 五十人
  rationale: 准确表达基数词，并以“人”作汉语数量短语的量词。
- source_word: הַזְּכָרִים
  choice: 男丁
  rationale: 该词明确指男性；“男丁”适合人口与宗族名单语境，比笼统的“人”更能保留原文的性别限定，也比生物分类色彩较强的“雄性”自然庄重。
