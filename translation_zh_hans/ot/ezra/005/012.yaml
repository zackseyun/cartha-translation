id: EZR.5.12
reference: Ezra 5:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָהֵ֗ן מִן דִּ֨י הַרְגִּ֤זוּ אֲבָהֳתַ֨/נָא֙ לֶ/אֱלָ֣הּ שְׁמַיָּ֔/א יְהַ֣ב הִמּ֔וֹ בְּ/יַ֛ד נְבוּכַדְנֶצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל כסדי/א וּ/בַיְתָ֤/ה דְנָה֙ סַתְרֵ֔/הּ וְ/עַמָּ֖/ה הַגְלִ֥י לְ/בָבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/012.yaml
  text: Therefore[a], because our fathers provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean[c][b], and he destroyed this house and carried the people away to Babylon.
translation:
  language: zh_hans
  text: 因此，因为我们的祖先惹天上的神发怒[a]，他就把他们交在巴比伦王尼布甲尼撒，就是那迦勒底人手中。尼布甲尼撒拆毁了这殿[b]，把百姓掳到巴比伦[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“激怒了天上的神”。
    reason: lexical_alternative
  - marker: b
    text: 亚兰文直译“这房屋”，这里指圣殿。
    reason: cultural_note
  - marker: c
    text: 或译：“把百姓放逐到巴比伦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן מִן דִּי
  choice: 然而，因为
  rationale: לָהֵן在这里承接上文并转入反面的历史原因，宜译为“然而”；מִן דִּי构成原因连接语，译为“因为”。这样既保留转折，也清楚表达因果关系。
- source_word: הַרְגִּזוּ
  choice: 惹……发怒
  rationale: 这是רגז的使役形式，表示使对方动怒。“惹……发怒”自然地保留了使役含义和神震怒的庄重语气。
- source_word: אֲבָהֳתַנָא
  choice: 我们的祖先
  rationale: 字面可作“我们的父辈”，在此泛指先人。“祖先”是现代普通话中准确、自然的群体历史称谓。
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: 天上的神
  rationale: 这是被掳归回时期常见的神圣称号；“天上的神”准确而自然，不增添解释。
- source_word: יְהַב הִמּוֹ בְּיַד
  choice: 把他们交在……手中
  rationale: 保留闪语中“交在某人手中”的惯用表达，既表示主动交付，也表示使其落入对方权下。
- source_word: נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל כסדיא
  choice: 迦勒底人巴比伦王尼布甲尼撒
  rationale: כסדיא是与尼布甲尼撒同位的单数族称。“迦勒底人巴比伦王尼布甲尼撒”保留族属和王号，并符合中文称谓次序。
- source_word: וּבַיְתָה דְנָה
  choice: 这殿
  rationale: בַיְתָה字面为“房屋、家”，本段明确指圣殿。中文“殿”既避免误解为普通住宅，也较为贴近原文简洁的称呼；脚注说明其字面形式。
- source_word: סַתְרֵהּ
  choice: 拆毁了
  rationale: 该动词表示拆除、毁坏建筑物。“拆毁”比泛称“毁灭”更具体地呈现对建筑的破坏。
- source_word: וְעַמָּה הַגְלִי לְבָבֶל
  choice: 把百姓掳到巴比伦
  rationale: 使役形式הַגְלִי表示使人离乡、进入流亡。“掳到”兼顾强制迁移和被掳的历史语境；“使……流亡”也是可能译法。
theological_decisions:
- issue: 是否弱化神施行审判的直接因果关系
  choice: 他就把他们交在……手中
  alternative: 他容许他们落在……手中
  rationale: 原文以神为主动交付者，明确把被征服视为对祖先惹神发怒的审判；译文不将主动行为弱化为仅仅许可。
- issue: 如何称呼圣殿
  choice: 这殿
  alternative: 这座圣殿；这房屋
  rationale: 原词是“房屋、家”，语境所指则是圣殿。“这殿”在现代中文中清楚自然，同时不在正文中加入原文没有的“圣”字；字面信息置于脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。以“祖先”代替较古旧的“列祖”，以“交在……手中”保留原文的圣经惯用语；“掳到”准确表达强制迁徙，又为普通读者所熟悉。所有脚注标记均紧随其所说明的词句。
