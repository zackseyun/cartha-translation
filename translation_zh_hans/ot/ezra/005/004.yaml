  text: 'Then we told them this: “What are the names of the men who are building this building?”[a]'
translation:
  language: zh_hans
  text: 于是，我们这样对他们说：“那些建造这座建筑的男子叫什么名字？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式对应地译作：“于是，我们这样对他们说：‘那些建造这座建筑的男子的名字是什么？’”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 那时
  rationale: 表示叙事中的时间或先后推进；“那时”自然，也保留了原文的时间衔接。
- source_word: כְּנֵמָא
  choice: 这样
  rationale: 意为“如此、这样”；用于引出后面的直接引语，符合现代汉语表达。
- source_word: אֲמַרְנָא לְּהֹם
  choice: 我们对他们说
  rationale: 原文直译为“我们对他们说”。保留“说”而不改作“问”，避免把由引语内容体现的疑问功能写进动词。
- source_word: מַן אִנּוּן שְׁמָהָת
  choice: 叫什么名字
  rationale: 原文形式接近“那些人的名字是什么”；现代汉语用“叫什么名字”询问姓名更自然。
- source_word: גֻּבְרַיָּא
  choice: 那些人
  rationale: 该词为阳性复数，指参与建造的人；汉语“人”在此自然，不额外断定其性别构成，而指示词“那些”承接其定指形式。
- source_word: דִּי
  choice: 的
  rationale: 关系词连接“人”与“建造”这一分句；汉语采用“建造……的那些人”的定语结构。
- source_word: דְנָה
  choice: 这座
  rationale: 保留近指意义；“座”是修饰建筑物的自然量词。
- source_word: בִנְיָנָא
  choice: 建筑
  rationale: 指正在建造之物。“建筑”较“房屋”宽泛，不把具体类型写入译文。
- source_word: בָּנַיִן
  choice: 建造
  rationale: 分词表示正在进行的动作；汉语在此无需明加“正在”，语境已能表达持续施工。
theological_decisions:
- issue: 说话者的人称存在文本差异或理解张力
  choice: 我们
  alternative: 他们
  rationale: 所给WLC正文为第一人称复数 אֲמַרְנָא，故按该源文译作“我们”；不依据上下文或其他文本传统静默改成第三人称。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“叫什么名字”使问句符合普通话习惯；脚注保留较贴近原文词序的表达。
