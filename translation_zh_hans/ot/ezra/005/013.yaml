  text: However[a], in the first year of Cyrus king of Babylon, Cyrus the king issued a decree to rebuild this house of God.
translation:
  language: zh_hans
  text: 然而，在巴比伦王居鲁士元年，居鲁士王颁布诏令，要重建[a]这座上帝的殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“建造”。亚兰语动词本身意为“建造”；“重建”体现这里恢复圣殿的语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: 然而
  rationale: 这是亚兰语转折词，承接上文形成对比；“然而”庄重自然，清楚表达话语转折。
- source_word: בִּשְׁנַת חֲדָה
  choice: 元年
  rationale: 这是君王纪年用语；现代汉语以“元年”最简洁、自然地表达在位第一年。
- source_word: לְכוֹרֶשׁ מַלְכָּא דִּי בָבֶל
  choice: 巴比伦王居鲁士
  rationale: 介词לְ在纪年公式中标明君王执政年份；此处按自然汉语译作“巴比伦王居鲁士元年”。
- source_word: שָׂם טְעֵם
  choice: 下令
  rationale: 字面为“设立命令”，在帝国行政语境中指颁布正式命令；“下令”准确且符合现代汉语表达。
- source_word: בֵּית אֱלָהָא דְנָה
  choice: 这座上帝的殿
  rationale: 原文直译为“这座上帝的房屋”，所指明确是圣殿；“上帝的殿”既自然又保留其宗教建筑含义。
- source_word: לִבְנֵא
  choice: 重建
  rationale: 该动词本义是“建造”；鉴于圣殿曾遭毁坏，此处“重建”表达上下文中的复建含义，同时以脚注保留字面译法。
