  - severity: high
    issue: “他们将就此事收到书面答复”将יְתִיבוּן的动作定为“收到”。
    rationale: 该动词在与“书信”连用的语境中可表达回送、答复；原文及英文审计轨迹均不支持把接收方向定为正文唯一含义。
