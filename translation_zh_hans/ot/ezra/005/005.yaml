  rationale: 修订保留原文“眼目”的拟人化比喻、长老的称谓和官员使工程停止的使役含义；同时删除“取得谕旨”及“收到”的无依据补充。对行政术语和书信动作方向仍存在的词义弹性，以脚注而非正文扩展处理。
