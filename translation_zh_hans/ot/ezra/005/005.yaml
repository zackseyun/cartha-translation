  source_fidelity: 草稿在“眼目”和“长老”上基本忠实，但将“直到一项决定／命令到大流士那里；随后他们就此事回送书信”的未完成行政程序扩展为“等候奏报……取得谕旨”，并把末句译成“收到书面答复”。这些补入或转换了原文未明说的行动方向和结果。
  naturalness: “他们的上帝的眼目在……身上”虽稍具经文风格，仍属可懂的现代汉语；采用“使他们停工”“呈交大流士”“以书信答复”可更准确、通顺，并避免“奏报、谕旨”带来的额外王廷程序。
  terminology: “犹太人的长老”准确。“眼目”保留拟人化意象。“决定”对应טַעְמָא较为中性，脚注注明也可指命令或谕旨；“书信”对应נִשְׁתְּוָנָא，避免无依据地断定是收到的答复。
