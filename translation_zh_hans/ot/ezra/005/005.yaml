  text: וְ/עֵ֣ין אֱלָהֲ/הֹ֗ם הֲוָת֙ עַל שָׂבֵ֣י יְהוּדָיֵ֔/א וְ/לָא בַטִּ֣לוּ הִמּ֔וֹ עַד טַעְמָ֖/א לְ/דָרְיָ֣וֶשׁ יְהָ֑ךְ וֶ/אֱדַ֛יִן יְתִיב֥וּן נִשְׁתְּוָנָ֖/א עַל דְּנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/005.yaml
  text: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
translation:
  language: zh_hans
  text: 但他们的上帝的眼目在犹太人的长老[a]身上，官员们没有使他们停工，直到一项决定呈交大流士[b]；随后，他们会就这事以书信答复[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但他们的上帝看顾着犹太人的长老。”
    reason: 原文直译为“他们的上帝的眼目在……身上”；替代译法表达该拟人化意象所含的看顾之意。
  - marker: b
    text: 或译：“直到一项命令／谕旨呈交大流士。”
    reason: טַעְמָא可指决定、命令或谕旨；原文表述该事项到大流士那里，未明确交代其后是否已获准。
  - marker: c
    text: 或译：“随后，他们会就这事回送一封书信。”
    reason: יְתִיבוּן可指答复、送回或返回；与נִשְׁתְּוָנָא（书信、正式书面文件）连用时，书信的具体发送方向不宜过度确定。
lexical_decisions:
- source_word: וְעֵין אֱלָהֲהֹם הֲוָת עַל
  choice: 但他们上帝的眼目看顾着
  rationale: 保留“眼目”这一具体比喻，也用现代汉语自然表达持续的眷顾和监察；“但”承接上文官员盘问所形成的转折。
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: 犹太人的长老
  rationale: 准确保留שָׂבֵי的“长老”含义及原文的属格关系，不泛化为普通领袖。
- source_word: וְלָא בַטִּלוּ הִמּוֹ
  choice: 官员们没有叫他们停工
  rationale: בַטִּלוּ为使役性用法，表示使工程停止；依上下文补出主语“官员们”，并以“停工”明确其所停止的是建殿工程。
- source_word: עַד טַעְמָא לְדָרְיָוֶשׁ יְהָךְ
  choice: 等候奏报大流士，取得谕旨
  rationale: 该短语在语法和行政语境中存在解释张力；译文按上下文表达先把案件呈交大流士、再取得王命的过程，同时以脚注保存较贴近字面的另一种理解。
- source_word: וֶאֱדַיִן יְתִיבוּן נִשְׁתְּוָנָא עַל דְּנָה
  choice: 然后，他们将就此事收到书面答复
  rationale: יְתִיבוּן可表达返回或答复，נִשְׁתְּוָנָא指正式书面文件；在此理解为从王廷返回的书面答复，并保留替代解释。
theological_decisions:
- issue: 对上帝看顾的拟人化描述
  choice: 保留“他们上帝的眼目”这一比喻
  alternative: “他们的上帝看顾着”
  rationale: 原文以具体的“眼目”描写上帝的监察与保护；保留意象可维持文学力度，同时不加入超出经文的神学阐释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“眼目”保留经文意象；“停工、奏报、谕旨、书面答复”体现波斯行政语境而不过度古雅。正文中的所有脚注标记均已对应列出。
