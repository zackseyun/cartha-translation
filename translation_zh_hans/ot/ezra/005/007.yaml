base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/007.yaml
  text: 'They sent a report to him[b][a], and this was what was written in it: “To Darius the king: all peace.”'
translation:
  language: zh_hans
  text: 他们给他送去一份呈文[a]，文中这样写道：“致大流士王：愿王一切平安[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呈文”也可译作“报告”“文书”或“信函”。亚兰文 פִּתְגָמָא 可指正式的信息、报告或文件。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“全然平安”或“一切平安”，是正式书信中祝愿对方完全安康的问候语。
    reason: cultural_note
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: 呈文
  rationale: 该词在帝国亚兰语中可指正式的信息、报告或文书；这里指呈交君王并载有正文的官方书面文件。“呈文”既符合行政语境，也保留了文书性质。
- source_word: שְׁלַחוּ
  choice: 送去
  rationale: 对应Peal完成式第三人称复数“他们送出”；现代汉语中“送去”自然清楚，不额外强化为“派遣”。
- source_word: עֲלוֹהִי
  choice: 给他
  rationale: 与“送”连用时表示送达的对象；原文使用代词，译文保留“他”，不提前明说大流士。
- source_word: וְכִדְנָה כְּתִיב בְּגַוֵּהּ
  choice: 文中这样写道
  rationale: 简洁表达“其中是这样写的”，既保留引出原文措辞的指示意义，也符合现代汉语介绍公文内容的习惯。
- source_word: לְדָרְיָוֶשׁ מַלְכָּא
  choice: 致大流士王
  rationale: 介词标示书信收件人，“王”作为大流士的称号；“致……”符合中文正式文书的抬头格式。
- source_word: שְׁלָמָא כֹלָּא
  choice: 愿王诸事平安
  rationale: 这是书信中的正式问安语，字面为“完全的／一切平安”。译作“愿王诸事平安”自然传达完整安康的祝愿；“王”由收件人称号承接，使中文问候语顺畅。
theological_decisions: []
