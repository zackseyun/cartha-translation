  text: אֱדַ֨יִן֙ שֵׁשְׁבַּצַּ֣ר דֵּ֔ךְ אֲתָ֗א יְהַ֧ב אֻשַּׁיָּ֛/א דִּי בֵ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וּ/מִן אֱדַ֧יִן וְ/עַד כְּעַ֛ן מִתְבְּנֵ֖א וְ/לָ֥א שְׁלִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/016.yaml
  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
translation:
  language: zh_hans
  text: 于是，这位设巴萨前来，为在耶路撒冷的上帝的殿立下了根基[a]。从那时直到现在，这殿一直在建造[b]，却还没有完工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“给予根基”，是表示立下根基的亚兰语用法。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这殿正在建造。”原文动词可表示持续进行的被动过程。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 表示叙事中的时间承接和先后次序；“于是”自然地衔接上文。
- source_word: שֵׁשְׁבַּצַּר דֵּךְ
  choice: 这位设巴萨
  rationale: 按普通话人名音译处理专名，并用“这位”保留指回上文人物的指示作用。
- source_word: אֲתָא
  choice: 来
  rationale: 直接表达该叙事动词的基本意义。
- source_word: יְהַב אֻשַּׁיָּא
  choice: 立了根基
  rationale: 原文直译近于“给予根基”，是亚兰语建筑用语；“立了根基”在中文中自然并准确表达奠基这一动作。
- source_word: בֵית אֱלָהָא
  choice: 上帝的殿
  rationale: “殿”既保留“上帝之居所”的表达，又在耶路撒冷语境中自然指向圣殿；避免生硬的“上帝的房屋”。
- source_word: דִּי בִירוּשְׁלֶם
  choice: 耶路撒冷上帝的殿
  rationale: 将地点短语自然前置为定语，不增添原文没有的信息。
- source_word: וּמִן אֱדַיִן וְעַד כְּעַן
  choice: 从那时直到现在
  rationale: 准确保留从奠基之时延续到说话当下的时间跨度。
- source_word: מִתְבְּנֵא
  choice: 一直在建造
  rationale: 保留被动或过程性的持续含义；中文无需机械使用被字句，“一直在建造”结合主语“这殿”自然表达持续施工。
- source_word: וְלָא שְׁלִם
  choice: 却还没有完工
  rationale: 说明截至当时工程仍未完成；“却”呈现与长期建造之间的转折，“还”体现当前状态。
theological_decisions:
- issue: בֵית אֱלָהָא 应译作“上帝的殿”还是“上帝的家”
  choice: 上帝的殿
  alternative: 上帝的家（或房屋）
  rationale: 在耶路撒冷重建的建筑语境中，“殿”是现代中文最自然、明确的对应，同时仍保留该词作为上帝居所的意义；这不是加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“设巴萨”依常见圣经中文音译；以“这殿”承接前句，避免中文中指代不清。保留工程从过去持续到当下以及尚未完成的张力。
