- from: 以下是河西总督达特奈、示他波斯奈和他的同僚，就是河西的官员[a]，呈给大流士王的信件副本：
  to: 以下是河西地区总督达特奈、示他·波斯奈和他的同僚，就是河西地区的官员[a]，呈给大流士王的信件副本：
  rationale: 修订仅澄清“河西”作为行政地区的表达，并统一复合人名和脚注中的音译；不改变原文的句法关系、职衔、收件人或对 אֲפַרְסְכָיֵא 的保留性处理。
