base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/006.yaml
  text: This is a copy of the letter that Tattenai[a], the governor of Beyond the River, and Shethar-bozenai and his associates, the officials who were in Beyond the River, sent to King Darius.
translation:
  language: zh_hans
  text: 以下是河西地区总督达特奈、示他·波斯奈和他的同僚，就是河西地区的官员[a]，呈给大流士王的信件副本：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚法萨迦人”；这个词也可能是某个族群或行政群体的名称，而不是职务称谓。
    reason: 原词 אֲפַרְסְכָיֵא 的确切所指不明；正文按其可能的职能含义译为“官员”，脚注保留其作为群体名称的可能。
lexical_decisions:
- source_word: פַּרְשֶׁגֶן
  choice: 副本
  rationale: 指公文的抄本或副本；“副本”符合现代汉语行政文书语境，也保留其并非原件的含义。
- source_word: אִגַּרְתָּא
  choice: 信件
  rationale: 指正式的书面通信；“信件”自然清楚，并适合本段的行政语境。
- source_word: שְׁלַח
  choice: 呈给
  rationale: 原义为“送、寄送”；因收件人是君王，“呈给”在现代汉语中自然体现下级向君王递交公文的语境，但不额外加入奏章体裁。
- source_word: תַּתְּנַי
  choice: 达特奈
  rationale: 按人名音译，并采用易于现代普通话读者辨认的形式。
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: 河西总督
  rationale: פַּחַת 指地方长官；עֲבַר נַהֲרָה 是波斯帝国对幼发拉底河以西地区的行政称谓。“河西总督”简洁保留其职衔和辖区含义。
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: 示他波斯奈
  rationale: 按人名音译。
- source_word: וּכְנָוָתֵהּ
  choice: 和他的同僚
  rationale: 名词表示与某人共事或同属一方的人；“同僚”切合官署语境，并保留原文单数第三人称后缀“他的”。
- source_word: אֲפַרְסְכָיֵא
  choice: 官员
  rationale: 该词含义不确定，可能是职能称谓，也可能是族群或行政群体名称；正文采用符合上下文的职能性译法，同时以脚注保留另一可能。
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: 大流士王
  rationale: 采用现代汉语中通行的人名译法，并保留原文王号。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以下是……副本”保留公文引言的形式；句末用冒号衔接下一节所引信件内容。脚注标记置于存在词义歧义的“官员”之后。
