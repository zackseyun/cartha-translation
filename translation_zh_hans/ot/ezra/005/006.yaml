  - severity: low
    issue: 复合人名及脚注音译的呈现可统一。
    rationale: 以“示他·波斯奈”标示复合人名较符合现代汉语译名排印；“亚法萨迦人”与常见的 Apharsachites 汉译对应较稳定。
