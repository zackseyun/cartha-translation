base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/008.yaml
  text: Let it be known to the king that we went to the province of Judah[a], to the house of the great God. It is being built with great stones, and timber is being laid in the walls[b]. This work is being done diligently and is prospering in their hands.
translation:
  language: zh_hans
  text: 愿王知悉：我们去了犹大省，到了伟大之神的殿。那殿正在用巨石[a]建造，木料也安放在墙中。这项工程正积极进行[b]，在他们手中进展顺利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大块石料”。这句亚兰文可能泛指体量很大的建筑用石。
    reason: lexical_alternative
  - marker: b
    text: 或译“殷勤地”“谨慎地”，也可能是“迅速地”。这个副词的具体侧重有争议，但明确表示工程正在有成效地推进。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא
  choice: 愿王知悉
  rationale: 这是亚兰文公文中向君王呈报的固定措辞；“愿王知悉”既保留正式语气，也符合现代汉语公文式表达。
- source_word: לִיהוּד מְדִינְתָּא
  choice: 犹大省
  rationale: מְדִינְתָּא 指帝国行政区“省”；采用通行地名“犹大”，表达简洁清楚。
- source_word: לְבֵית אֱלָהָא רַבָּא
  choice: 至大之神的殿
  rationale: 原文直译为“至大之神的家”；语境明确指圣殿，译作“殿”自然庄重，并保留“至大之神”的敬称。
- source_word: מִתְבְּנֵא
  choice: 正在……建造
  rationale: 体现原文被动或反身分词所表达的持续施工状态。
- source_word: אֶבֶן גְּלָל
  choice: 巨石
  rationale: 该词组指体量很大的建筑石材；“巨石”在现代汉语中明确自然，同时以脚注保留词义细节的不确定性。
- source_word: וְאָע מִתְּשָׂם בְּכֻתְלַיָּא
  choice: 木料也安放在墙中
  rationale: אָע 泛指木材，建筑语境中译作“木料”；“安放在墙中”保留木材嵌入墙体结构的空间关系和原文被动态。
- source_word: וַעֲבִידְתָּא דָךְ
  choice: 这项工程
  rationale: 此处指正在进行的圣殿建造工作；“这项工程”比笼统的“这工作”更符合现代汉语建筑语境。
- source_word: אָסְפַּרְנָא
  choice: 积极
  rationale: 该副词具体侧重有争议，可能强调殷勤、谨慎或迅速；“积极进行”概括工程有力而有效地推进，又不武断限定为速度。
- source_word: וּמַצְלַח בְּיֶדְהֹם
  choice: 在他们手中进展顺利
  rationale: 既保留“在他们手中”的原文意象，也自然表达工程成功推进之意。
theological_decisions:
- issue: אֱלָהָא רַבָּא 中神的称谓
  choice: 至大之神
  alternative: 伟大的神
  rationale: “至大”更符合向王呈报时庄重的尊称语气，但不把该称谓扩展为原文没有明说的神学断言。
translation_notes:
  register: 采用现代、庄重而易懂的书面语，保留官方呈报的语气。句式避免仿古过度；“殿”“至大之神”维持经文语域，“工程正积极进行”“进展顺利”则确保普通读者容易理解。脚注标记均放在其所说明的词语之后。
