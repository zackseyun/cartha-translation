source:
  edition: WLC
  text: בֵּ/אדַ֡יִן קָ֠מוּ זְרֻבָּבֶ֤ל בַּר שְׁאַלְתִּיאֵל֙ וְ/יֵשׁ֣וּעַ בַּר יֽוֹצָדָ֔ק וְ/שָׁרִ֣יו לְ/מִבְנֵ֔א בֵּ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/עִמְּ/ה֛וֹן נביאי/א דִֽי אֱלָהָ֖/א מְסָעֲדִ֥ין לְ/הֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/002.yaml
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak arose and began to build the house of God that is in Jerusalem[a], and with them were the prophets of God[c][b], supporting them.
translation:
  language: zh_hans
  text: 于是，撒拉铁的儿子所罗巴伯和约萨答的儿子耶书亚起来，开始建造位于耶路撒冷的上帝的殿[a]；上帝的先知们也和他们在一起，扶助他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“上帝的房屋（家）”；这里指上帝的殿，也就是圣殿。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“帮助他们”“支持他们”或“协助他们”；原文分词表达积极、持续的扶助。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: 于是
  rationale: 亚兰文叙事连接语，承接前文并引出随后的行动；“于是”自然地保留事件推进关系。
- source_word: קָמוּ
  choice: 起来
  rationale: 保留“起身、起来”的基本意义，同时在现代汉语中可自然表达采取行动。
- source_word: זְרֻבָּבֶל בַּר שְׁאַלְתִּיאֵל
  choice: 撒拉铁的儿子所罗巴伯
  rationale: 按中文圣经传统音译人名，并直接表达亚兰文父子关系。
- source_word: יֵשׁוּעַ בַּר יוֹצָדָק
  choice: 约萨答的儿子耶书
  rationale: “耶书”反映此处较短的人名形式，区别于相关的完整形式“约书亚”；“约萨答”采用通行中文音译。
- source_word: וְשָׁרִיו לְמִבְנֵא
  choice: 着手建造
  rationale: שׁרי在此表示“开始”，与不定式“建造”连用；“着手建造”简洁自然，并传达行动正式展开。
- source_word: בֵּית אֱלָהָא
  choice: 上帝之殿
  rationale: 原文直译为“上帝的家/殿”。“上帝之殿”既保留“殿、房屋”的意象，也在现代汉语中清楚指向圣殿；脚注交代更直译的表达。
- source_word: דִּי בִירוּשְׁלֶם
  choice: 耶路撒冷的
  rationale: 将原文“在耶路撒冷的”自然压缩为汉语定语结构，不改变地点限定。
- source_word: וְעִמְּהוֹן נביאיא דִי אֱלָהָא
  choice: 上帝的先知们也与他们同在
  rationale: 保留伴随关系；“同在”比单纯“在一起”更庄重，但不额外断定神学意义。
- source_word: מְסָעֲדִין לְהוֹן
  choice: 帮助他们
  rationale: 该分词表达持续、积极的扶助或支持；“帮助”是清楚自然的现代汉语，脚注保留“支持”的可能译法。
theological_decisions:
- issue: “上帝之殿”的指称
  choice: 正文译作“上帝之殿”，并在脚注注明原文直译
  alternative: 上帝的殿；上帝的家；上帝的圣殿
  rationale: 原文是“上帝的房屋/家”，语境明确指耶路撒冷圣殿。“上帝之殿”避免把“圣”这一原文未明说的修饰语直接加入正文，同时保留建筑与敬拜场所的双重含义。
- issue: 先知所提供帮助的性质
  choice: 译作一般性的“帮助他们”
  alternative: 支持他们；协助他们
  rationale: 原文分词表明先知积极扶助建殿者，却未具体说明帮助是劝勉、宣讲、实际劳作或权威支持，因此不在正文中限定其方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。人名依中文圣经中较通行的形式处理；句式避免过度文言化。“于是”“起来”“着手建造”保留原文动作推进，“与他们同在，帮助他们”保存伴随与支持两个层面。
