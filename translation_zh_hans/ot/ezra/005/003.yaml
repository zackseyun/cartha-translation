base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/003.yaml
  text: 'At that time Tattenai[a], the governor of Beyond the River[c][b], and Shethar-bozenai and their associates came to them and spoke thus to them: “Who gave you a decree to build this house and to complete this structure?”'
translation:
  language: zh_hans
  text: 那时，河西[a]总督达乃、示他·波斯乃和他们的同僚来到他们那里，对他们说：“谁下令让你们建造这殿，完成这项工程[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河西”是波斯帝国对幼发拉底河以西地区的行政称谓。
    reason: cultural_note
  - marker: b
    text: 译作“工程”的亚兰语词含义不完全确定，可能较具体地指圣殿的建筑结构、墙体或框架。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: 那时
  rationale: 这是自然简洁的现代汉语叙事表达，准确交代同一时期的背景。
- source_word: אֲתָא עֲלֵיהוֹן
  choice: 来到犹太人那里
  rationale: 动词与介词表示来到或接近他们；依上下文将代词所指明示为犹太人，可避免中文指代含混。
- source_word: תַּתְּנַי
  choice: 达乃
  rationale: 按亚兰语人名音译，并采用中文圣经传统中易识别的形式。
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: 河西总督
  rationale: פַּחַת指省级总督；עֲבַר נַהֲרָה是波斯帝国对幼发拉底河以西地区的行政称谓。“河西”简洁保留其官方地名性质，另以脚注说明。
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: 示他·波斯乃
  rationale: 按亚兰语复合人名音译，用间隔号呈现人名内部结构。
- source_word: וּכְנָוָתְהוֹן
  choice: 和他们的同僚
  rationale: 该词泛指与二人一同任事或归属同一行政群体的人；“同僚”符合官员语境，又不额外限定具体职衔。
- source_word: וְכֵן אָמְרִין לְהֹם
  choice: 对他们说
  rationale: 自然呈现引出直接引语的亚兰语结构，无须机械翻译“如此说”。
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: 谁下令让你们
  rationale: טְעֵם在帝国亚兰语中可指官方命令或谕令；“下令”自然表达שָׂם与טְעֵם合成的意思，同时保留对授权来源的质问。
- source_word: בַּיְתָא דְנָה לִבְנֵא
  choice: 建造这殿
  rationale: בַּיְתָא字面为“房屋”，在本段明确指圣殿；“殿”在中文中自然清楚，且没有把动词扩展为“重建”。
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: 这项工程
  rationale: 该名词含义并不完全确定，可指建筑工程、结构、墙体或框架；“工程”在中文里较宽泛，能避免武断限定为墙。
- source_word: לְשַׁכְלָלָה
  choice: 完成
  rationale: 准确表达使建筑工作达到完工状态的意思，并与“工程”自然搭配。
