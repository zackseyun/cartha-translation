  text: וְ/הִתְנַבִּ֞י חַגַּ֣י נביא/ה וּ/זְכַרְיָ֤ה בַר עִדּוֹא֙ נביאי/א עַל יְה֣וּדָיֵ֔/א דִּ֥י בִ/יה֖וּד וּ/בִ/ירוּשְׁלֶ֑ם בְּ/שֻׁ֛ם אֱלָ֥הּ יִשְׂרָאֵ֖ל עֲלֵי/הֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/001.yaml
  text: Haggai the prophet and Zechariah son of Iddo[a], the prophets, prophesied to the Jews who were in Judah and in Jerusalem[b], in the name of the God of Israel who was over them.
translation:
  language: zh_hans
  text: 哈该先知和易多的儿子撒迦利亚先知，奉以色列的上帝——那在他们之上的一位——的名[b]，向在犹大和耶路撒冷的犹太人[a]说预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”或译“犹大人”。亚兰文一词既可指犹太民族，也可较着重指犹大地区的人。
    reason: lexical_alternative
  - marker: b
    text: “奉……之名”也可理解为“凭以色列上帝的权柄”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַבִּי
  choice: 说预言
  rationale: 以自然现代汉语表达亚兰文 Peal 完成式所叙述的先知性宣告；不加入原文没有的“开始”或“这时”。
- source_word: חַגַּי נביאה
  choice: 哈该先知
  rationale: 保留名字与定指同位语；“先知”置于名字之后，符合庄重而通顺的现代汉语。
- source_word: וּזְכַרְיָה בַר עִדּוֹא נביאיא
  choice: 和易多的儿子撒迦利亚先知
  rationale: בַר 译作“儿子”；复数同位语 נביאיא 概括哈该与撒迦利亚二人，汉语将“先知”分别理解为对二人的身份说明，同时避免生硬重复“这两位先知”。
- source_word: עַל
  choice: 向
  rationale: 与“说预言”连用时标示宣告所面向的对象；上下文不要求译成带敌意的“攻击”。
- source_word: יְהוּדָיֵא
  choice: 犹太人
  rationale: 在《以斯拉记》中通常指归回的犹太群体；“犹大人”这一兼具地域色彩的可能译法收入脚注。
- source_word: דִּי בִיהוּד וּבִירוּשְׁלֶם
  choice: 在犹大和耶路撒冷的
  rationale: דִּי 引出关系限定；בִיהוּד 指波斯时期的犹大地区，译作“犹大”较符合旧约语境。
- source_word: בְּשֻׁם
  choice: 奉……之名
  rationale: 该习语表示以某人的名义和权柄发言；“奉……之名”在现代汉语中兼顾形式与权柄含义。
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: 以色列上帝
  rationale: 自然表达原文属格结构，指以色列的上帝。
- source_word: עֲלֵיהוֹן
  choice: 那在他们之上的
  rationale: 保留介词“在……之上”的空间与权柄意象，并将其作为对“以色列上帝”的修饰，避免只译成较解释性的“掌管他们”。
theological_decisions:
- issue: 末尾 עֲלֵיהוֹן 的所指及含义
  choice: 理解为修饰“以色列上帝”，译作“那在他们之上的”，保留上帝临在、眷顾与权柄的语义张力。
  alternative: 也可较解释性地译为“那掌管他们的”，或将短语与说预言的行动联系起来，理解为预言临到他们。
  rationale: 词序最自然地把该短语连于“以色列上帝”；直译式表达既呈现上帝对群体的权柄，也不把其意义缩限为单一神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“奉……之名”保留圣经语体但仍属当代可理解表达；末句调整为汉语常见语序。所有脚注标记均置于正文相应位置。
