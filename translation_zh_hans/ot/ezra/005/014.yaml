- from: 此外，上帝殿中的金银器皿，就是尼布甲尼撒从耶路撒冷的圣殿里取出、带到巴比伦庙宇里的那些器皿，居鲁士王也从巴比伦的庙宇里取了出来，交给一个名叫设巴萨的人[a]；居鲁士立他作省长。
  to: 此外，上帝的殿中的金银器皿，就是尼布甲尼撒从耶路撒冷的殿宇里取出、带到巴比伦殿宇里的那些器皿，居鲁士王又把这些器皿从巴比伦殿宇里取出来，交给一个名叫设巴萨的人[a]；居鲁士立他作省长。
  rationale: 修订仅作表达和衔接上的安全调整：以“又把这些器皿”明确原文在长关系从句后重提的宾语；以“上帝的殿”改善现代汉语自然度；并将 הֵיכְלָא 两处统一译作“殿宇”，不对巴比伦建筑的具体性质作超出原文的界定。其余人名、官衔、事件顺序及脚注锚点均保留。
