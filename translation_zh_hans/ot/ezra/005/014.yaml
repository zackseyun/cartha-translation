  text: וְ֠/אַף מָאנַיָּ֣/א דִֽי בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבוּכַדְנֶצַּ֗ר הַנְפֵּק֙ מִן הֵֽיכְלָ/א֙ דִּ֣י בִֽ/ירוּשְׁלֶ֔ם וְ/הֵיבֵ֣ל הִמּ֔וֹ לְ/הֵיכְלָ֖/א דִּ֣י בָבֶ֑ל הַנְפֵּ֨ק הִמּ֜וֹ כּ֣וֹרֶשׁ מַלְכָּ֗/א מִן הֵֽיכְלָ/א֙ דִּ֣י בָבֶ֔ל וִ/יהִ֨יבוּ֙ לְ/שֵׁשְׁבַּצַּ֣ר שְׁמֵ֔/הּ דִּ֥י פֶחָ֖ה שָׂמֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/014.yaml
  text: Also[a], the gold and silver vessels of the house of God, which Nebuchadnezzar had taken out from the temple that was in Jerusalem and brought them to the temple of Babylon—Cyrus the king took them out from the temple of Babylon and gave them to one named Sheshbazzar, whom he had appointed governor.
translation:
  language: zh_hans
  text: 此外，上帝的殿中的金银器皿，就是尼布甲尼撒从耶路撒冷的殿宇里取出、带到巴比伦殿宇里的那些器皿，居鲁士王又把这些器皿从巴比伦殿宇里取出来，交给一个名叫设巴萨的人[a]；居鲁士立他作省长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“交给设巴萨——这是他的名字——就是居鲁士所立的省长。”
    reason: 保留原文 שְׁמֵהּ（“他的名字”）较为生硬的点名结构，以及后接任命说明的句法。
lexical_decisions:
- source_word: וְאַף
  choice: 此外
  rationale: 表达亚兰文连接词的附加、递进作用，也自然承接上文的奏报。
- source_word: מָאנַיָּא
  choice: 器皿
  rationale: 所指为圣殿中的器具；“器皿”准确、具体，也符合现代汉语圣经语境。
- source_word: בֵית אֱלָהָא
  choice: 上帝殿
  rationale: 保留“上帝的家／殿”这一表达的宗教建筑含义，同时避免直译成“上帝的家”可能造成的日常家庭联想。
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: 金银器皿
  rationale: 将材质修饰语自然置于“器皿”之前，准确表达金制和银制的器具。
- source_word: הַנְפֵּק
  choice: 取出
  rationale: 直接呈现把器皿从殿中移出的动作；上下文和句法已清楚交代先后关系，无须额外增译。
- source_word: הֵיכְלָא
  choice: 圣殿／庙宇
  rationale: 指耶路撒冷时译作“圣殿”，指巴比伦时译作“庙宇”，既保留同一亚兰词的建筑含义，也符合汉语对不同敬拜场所的自然称呼。
- source_word: וְהֵיבֵל הִמּוֹ
  choice: 带到……里的那些器皿
  rationale: 保留动词及其复数宾语所指，并以汉语关系结构顺畅连接后面的重提宾语。
- source_word: כּוֹרֶשׁ מַלְכָּא
  choice: 居鲁士王
  rationale: 符合现代汉语姓名加王号的自然顺序。
- source_word: וִיהִיבוּ לְשֵׁשְׁבַּצַּר שְׁמֵהּ
  choice: 交给一个名叫设巴萨的人
  rationale: 以自然汉语表达原文“设巴萨——他的名字”这一点名公式，不遗漏姓名说明。
- source_word: פֶחָה
  choice: 省长
  rationale: 准确而通俗地表达波斯行政体系中的地方长官职衔。
- source_word: שָׂמֵהּ
  choice: 立他作
  rationale: 表达任命并使其担任官职的含义；“立……作省长”庄重而清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“上帝殿”与后文“圣殿／庙宇”适度反映 בֵית אֱלָהָא 和 הֵיכְלָא 的用词差别；通过“那些器皿……也……取了出来”再提宾语，以呈现亚兰文长关系从句后的复指结构。
