id: EZR.5.11
reference: Ezra 5:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/כְנֵ֥מָא פִתְגָמָ֖/א הֲתִיב֣וּ/נָא לְ/מֵמַ֑ר אֲנַ֣חְנָא הִמּ֡וֹ עַבְדוֹ/הִי֩ דִֽי אֱלָ֨הּ שְׁמַיָּ֜/א וְ/אַרְעָ֗/א וּ/בָנַ֤יִן בַּיְתָ/א֙ דִּֽי הֲוָ֨א בְנֵ֜ה מִ/קַּדְמַ֤ת דְּנָה֙ שְׁנִ֣ין שַׂגִּיאָ֔ן וּ/מֶ֤לֶךְ לְ/יִשְׂרָאֵל֙ רַ֔ב בְּנָ֖/הִי וְ/שַׁכְלְלֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/011.yaml
  text: 'And this is the answer they returned to us[a], saying: We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago[b], which a great king of Israel built and completed.'
translation:
  language: zh_hans
  text: 他们这样答复我们[a]：“我们是天地之神的仆人，正在重建这座殿[b]。这座殿早在许多年前就由以色列的一位伟大君王建造并完成了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们给我们的答复是这样。”原文相关词语可表示“话、信息、答复”；动词本义为“带回、归还”，此处指传回答复。
    reason: 保留原文“答复／信息”及“传回”的措辞范围。
  - marker: b
    text: 或译：“正在建造这座殿。”亚兰文分词表示持续进行的行动；“重建”则根据下文说明这殿先前已经存在。
    reason: 保留较字面的“建造”译法，并说明正文按上下文采用“重建”。
lexical_decisions:
- source_word: וּכְנֵמָא פִתְגָמָא
  choice: 回答……的话是这样
  rationale: 该短语引出答复的具体内容；“话”保留פִתְגָם的词义范围，“是这样”自然表达וּכְנֵמָא的引述功能。
- source_word: הֲתִיבוּנָא לְמֵמַר
  choice: 他们回答我们……
  rationale: 该动词本有“归还、带回”之意，此处惯用为“作答”；与引述结构合译为自然的现代汉语。
- source_word: עַבְדוֹהִי
  choice: 仆人
  rationale: 此处指对神的服侍与归属，不着重奴隶身份；“仆人”庄重且符合语境。
- source_word: אֱלָהּ שְׁמַיָּא וְאַרְעָא
  choice: 天地之神
  rationale: 简洁保留该称号所表达的普世主权；“天地”是现代汉语中自然的整体表达。
- source_word: וּבָנַיִן בַּיְתָא
  choice: 正在重建这殿
  rationale: 分词表示持续进行的行动；上下文表明原有圣殿遭毁后再次建造，因此“重建”明确传达语境，同时以脚注保留较字面的可能译法。בַּיְתָא直译为“房屋”，但此处明确指圣殿，译作“殿”更自然。
- source_word: דִּי הֲוָא בְנֵה מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן
  choice: 这殿早在许多年前就已建成
  rationale: 自然表达“在此以前许多年”的时间意义，并用“已建成”说明先前建造的事实。
- source_word: וּמֶלֶךְ לְיִשְׂרָאֵל רַב
  choice: 以色列一位伟大的王
  rationale: רַב在此表示伟大、显赫；原文未点名所罗门，译文也不补名。
- source_word: בְּנָהִי וְשַׁכְלְלֵהּ
  choice: 建造并竣工
  rationale: 保留两个动词的层次：开始建造并使建筑完成；“竣工”准确适合建筑语境。
theological_decisions:
- issue: 帝国公文中的神圣称号
  choice: 天地之神
  alternative: 天与地的神
  rationale: 直接保留原文宣称这位神统管天地的普世范围，不将其弱化为地方性或政治性的神明。
- issue: 以色列人自称神的仆人
  choice: 仆人
  alternative: 奴仆
  rationale: 原词可涵盖奴仆含义，但这里主要表达敬拜、服侍与归属；“仆人”避免无根据地强调受奴役状态。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。直接引语清晰流畅；“殿”按明确所指译出圣殿含义，但不额外加入原文没有的专名。“伟大的王”保留原文未点名的表达。
