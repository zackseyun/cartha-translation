source:
  edition: WLC
  text: וּ/כְעַ֞ן הֵ֧ן עַל מַלְכָּ֣/א טָ֗ב יִ֠תְבַּקַּר בְּ/בֵ֨ית גִּנְזַיָּ֜/א דִּי מַלְכָּ֣/א תַמָּה֮ דִּ֣י בְּ/בָבֶל֒ הֵ֣ן אִיתַ֗י דִּֽי מִן כּ֤וֹרֶשׁ מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/מִבְנֵ֛א בֵּית אֱלָהָ֥/א דֵ֖ךְ בִּ/ירוּשְׁלֶ֑ם וּ/רְע֥וּת מַלְכָּ֛/א עַל דְּנָ֖ה יִשְׁלַ֥ח עֲלֶֽי/נָא־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/017.yaml
  text: And now[a], if it seems good to the king, let a search be made in the royal treasury there in Babylon, whether it is so that a decree was issued by King Cyrus to rebuild this house of God in Jerusalem[b]; and let the king send to us his pleasure concerning this matter.
translation:
  language: zh_hans
  text: 现在，王若以为好，请查考巴比伦的王室宝库，看看居鲁士王是否曾下令重建[a]耶路撒冷这座上帝的殿；也请王把对此事的旨意[b]传给我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“建造”。亚兰文动词本身是“建造”；“重建”体现圣殿在被毁之后恢复建造的语境。
    reason: lexical_alternative
  - marker: b
    text: 或译“意愿”或“决定”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעַן
  choice: 现在
  rationale: 作为亚兰文话语标记，引出信函末尾的正式请求；“现在”自然保留了承接和推进语意。
- source_word: הֵן עַל מַלְכָּא טָב
  choice: 王若以为好
  rationale: 保留古代宫廷文书中恭敬、委婉的请求语气，同时符合现代汉语表达。
- source_word: יִתְבַּקַּר
  choice: 请查考
  rationale: 该被动式在此带请求语气，所查的是王室保存的记录；“请查考”既表达请求，也适合档案查验的语境。
- source_word: בְּבֵית גִּנְזַיָּא דִּי מַלְכָּא תַמָּה דִּי בְּבָבֶל
  choice: 巴比伦的王室宝库
  rationale: בֵית גִּנְזַיָּא直指存放珍宝及文书的库房；译作“王室宝库”保留具体制度背景，不径直改成解释性的“档案库”。
- source_word: הֵן אִיתַי דִּי
  choice: 看看……是否曾
  rationale: 自然表达查验某项诏令是否确实存在的确认语气。
- source_word: מִן כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם
  choice: 居鲁士王是否曾下令
  rationale: טְעֵם在帝国亚兰文行政语境中可指正式命令；汉语“下令”简洁呈现שִׂים טְעֵם的官方行动。
- source_word: לְמִבְנֵא
  choice: 重建
  rationale: 该词形式上是“建造”，但本节所指是在圣殿被毁后恢复建造；正文采用符合历史语境的“重建”，并以脚注保留较形式对应的译法。
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: 这座上帝的殿
  rationale: “这座”保留指示词דֵךְ；“殿”在汉语中自然指上帝的圣所，同时没有改变其作为“上帝之屋”的基本所指。
- source_word: וּרְעוּת מַלְכָּא
  choice: 王……的旨意
  rationale: רְעוּת在宫廷文书中可指君王的意愿、决定或旨意；“旨意”维持正式王命语域，又不把它过度限定为已经颁布的诏令。
- source_word: עַל דְּנָה יִשְׁלַח עֲלֵינָא
  choice: 把对此事的旨意传给我们
  rationale: 将原文“关于此事……传给我们”调整为自然汉语语序，并保留正式请求的内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重的中文公文语体，保留臣属向君王提出请求时的恭敬语气。正文中的脚注标记按其实际所注词语放置：重建[a]、旨意[b]。
