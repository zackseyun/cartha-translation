base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/009.yaml
  text: 'Then we asked those elders and said to them as follows: “Who gave you a decree to build this house and to complete this structure?”[a][b]'
translation:
  language: zh_hans
  text: 于是，我们询问那些长老，对他们这样说：“谁给了你们谕令，让你们建造这殿[a]，并完成这项工程[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这殿”直译为“这房屋”，在这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: 译作“工程”的亚兰语词也可能较具体地指建筑实体、框架或相关构造。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: 于是
  rationale: 表示叙事或奏报中的时间推进；“于是”自然地承接上文。
- source_word: שְׁאֵלְנָא לְשָׂבַיָּא אִלֵּךְ
  choice: 我们询问那些长老
  rationale: 保留复数第一人称和指示意味；“询问”符合官员查问的正式语境。
- source_word: כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: 对他们说
  rationale: 该短语引出后面的直接引语；汉语无需另译“如下”，即可自然表达相同功能。
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: 谁下令让你们
  rationale: טְעֵם 在帝国亚兰语中可指正式命令或谕令；“下令”保留行政权威的含义，并符合现代汉语表达。
- source_word: בַּיְתָא דְנָה
  choice: 这殿
  rationale: 字面为“这房屋”，但在本处明确指圣殿；“这殿”既简洁又符合上下文。
- source_word: לְמִבְנְיָה
  choice: 建造
  rationale: 原动词是“建造”，本句本身未明确表达“重建”，因此不增译为“重建”。
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: 这座建筑
  rationale: 该罕见名词可指建筑实体、构造或框架；“建筑”保持概括性，不把语义过窄地限定为墙或框架。
- source_word: לְשַׁכְלָלָה
  choice: 把……完工
  rationale: 表达使工程达到完成状态；“完工”在建筑语境中自然、准确。
