base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/015.yaml
  text: And he said to him[a], ‘Take these vessels, go and put them in the temple that is in Jerusalem, and let the house of God be rebuilt on its site.’
translation:
  language: zh_hans
  text: 他对他说：“拿起这些器皿，去把它们放在耶路撒冷的殿里；上帝的殿要在原址重建[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“建在原处。”亚兰文此处基本可译为“被建造”；“重建”是根据上下文所作的表达。
    reason: 保留יִתְבְּנֵא“被建造”及עַל אַתְרֵהּ“在其处”的较直译表达，并说明正文“重建”的语境依据。
lexical_decisions:
- source_word: וַאֲמַר לֵהּ
  choice: 他对他说
  rationale: 保留第三人称单数主语和间接宾语，符合亚兰文叙事表达，也使上下文中的说话关系清楚。
- source_word: אֵלֶּה מָאנַיָּא
  choice: 这些器皿
  rationale: 此处指从耶路撒冷圣殿取走、如今将归还的礼仪用品；“器皿”准确而庄重。
- source_word: שֵׂא אֵזֶל אֲחֵת הִמּוֹ
  choice: 拿着这些器皿，去放在
  rationale: 自然呈现“拿、去、放置”这一连串命令，同时避免生硬逐词翻译。
- source_word: בְּהֵיכְלָא דִּי בִירוּשְׁלֶם
  choice: 在耶路撒冷的殿里
  rationale: 上下文明确指耶路撒冷的圣殿；简化关系从句，形成自然现代汉语而不损失信息。
- source_word: וּבֵית אֱלָהָא
  choice: 上帝的殿
  rationale: 直译“上帝的家”，在此语境中指圣殿；译作“上帝的殿”既保留称谓，也避免误解为普通住宅。
- source_word: יִתְבְּנֵא
  choice: 重建
  rationale: 词形本身表示“被建造”，而上下文是被毁圣殿的恢复，因此正文采用自然且符合历史语境的“重建”，并以脚注保留较直译的可能。
- source_word: עַל אַתְרֵהּ
  choice: 在原址
  rationale: 表达在其原有地点建造的意思；“原址”在现代汉语中简洁、准确。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“殿”依上下文明确指耶路撒冷圣殿；命令句简洁有力。脚注标记置于“重建”之后，与其所说明的词语对应。
