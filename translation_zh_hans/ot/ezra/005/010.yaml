base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/010.yaml
  text: We also asked them their names[a], to make them known to you[b], that we might write down the names of the men who were at their head.
translation:
  language: zh_hans
  text: 我们也询问了他们的姓名，好把他们的姓名报告给你[a]，以便我们记录那些在他们中为首之人的姓名[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“使你知道”；即把他们的姓名告知你。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在他们的头上”；即他们当中为首的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: 我们也
  rationale: 保留连接词和副词的递加作用，并自然承接前文的报告。
- source_word: שְׁמָהָתְהֹם
  choice: 他们的姓名
  rationale: 准确表达带第三人称阳性复数后缀的复数名词；“姓名”适合正式公文语境。
- source_word: שְׁאֵלְנָא לְּהֹם
  choice: 询问了他们
  rationale: 表达“问、查问”的含义；“询问”既符合现代汉语，也与官员查问的语境相称。
- source_word: לְהוֹדָעוּתָךְ
  choice: 好让你知道
  rationale: 该使役式不定词表达目的，即把所问得的姓名告知收信人；中文无需机械保留“使……被知道”的结构。
- source_word: דִּי נִכְתֻּב
  choice: 以便我们写下
  rationale: דִּי在此引出目的或结果，“以便”自然呈现句间关系；“写下”体现书面记录的语境。
- source_word: שֻׁם גֻּבְרַיָּא
  choice: 那些……之人的姓名
  rationale: שֻׁם虽为单数形式，却可作集合用法；结合复数“人”和前文复数“姓名”，汉语译为复数意义。
- source_word: דִּי בְרָאשֵׁיהֹם
  choice: 那些为首之人
  rationale: 该短语直译为“在他们头上的”，是指群体中的带头者；“为首之人”保留“头”的意象，同时符合现代庄重汉语。
