  text: 'For the Parbar on the west: four at the road[b][a], and two at the Parbar.'
translation:
  language: zh_hans
  text: 西边的帕尔巴[a]：通道[b]处四人，帕尔巴处两人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帕尔巴”是希伯来语罕见词的音译；也可译作“外围区域”、“院落”、“附属建筑”或传统所译的“郊区”。具体指哪一种建筑或区域，不能确定。
    reason: lexical_alternative
  - marker: b
    text: 或译：“道路”或“堤道”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְבָּר
  choice: 帕尔巴
  rationale: 这是一个罕见且所指不确定的建筑或区域名称。采用音译可避免把它武断地解释为游廊、院落、附属建筑或外围区域，并在脚注中保留可能含义。
- source_word: מַעֲרָב
  choice: 西边
  rationale: 指西方或西侧；在方位分配的语境中译作“西边”自然简洁。
- source_word: אַרְבָּעָה
  choice: 四人
  rationale: 原文只有数词“四”，按上下文补出所分派的守门人，汉语用“四人”表达清楚而不增加新的身份信息。
- source_word: מְסִלָּה
  choice: 通道
  rationale: 该词可指道路、铺筑或抬高的道路、堤道。在圣殿入口及守门人岗位的语境中，“通道”较自然，同时以脚注保留“道路、堤道”等可能译法。
- source_word: שְׁנַיִם
  choice: 两人
  rationale: 原文只有数词“二”，依上下文指两名被分派的守门人，译作“两人”符合现代汉语。
- source_word: לְ
  choice: 的／那里
  rationale: 重复出现的介词表示岗位所属或所在地点；按汉语习惯分别译为“西边的”和“那里”，以清楚呈现地点分配。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的岗位分配表述。因“帕尔巴”的确切含义不明，正文音译并以脚注说明；“四人、两人”依据本段守门人分班的上下文补足汉语所需量词。
