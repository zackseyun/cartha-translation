base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/008.yaml
  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
translation:
  language: zh_hans
  text: 这些人都是俄别以东的子孙——他们、他们的儿子和兄弟[a]，都是有能力、有力量胜任服事的人[b]——属俄别以东的共六十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兄弟”也可译作“族中弟兄”，因为这个词在这里可能广指同宗族的男性亲属。
    reason: lexical_alternative
  - marker: b
    text: “有能力、有力量胜任服事的人”所译的希伯来语也可表示“勇士”或“英勇的人”；在这里很可能强调他们具备能力和力量，足以胜任服事。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: 都是……的子孙
  rationale: 介词 מִן 与“众子”连用，表示出身或家族归属；汉语用“都是俄别以东的子孙”自然地保留谱系含义。
- source_word: הֵמָּה וּבְנֵיהֶם וַאֲחֵיהֶם
  choice: 他们和他们的儿子、兄弟
  rationale: 按原文依次列出这些人、他们的下一代和男性亲属；正文保留“兄弟”，不擅自扩大为泛指的“亲属”。
- source_word: אִישׁ חַיִל
  choice: 能干的人
  rationale: חַיִל 可表达能力、实力或勇武；本节语境是职务安排，“能干的人”既体现胜任能力，也避免将其限定为军事勇士。
- source_word: בַּכֹּחַ
  choice: 有力量
  rationale: 保留 כֹּחַ 的具体含义，说明这些人具备履行职务所需的力量。
- source_word: לַעֲבֹדָה
  choice: 担任职务
  rationale: עֲבֹדָה 在此指所分派的服事或工作；“担任职务”符合圣殿职事语境，同时不添加原文未明说的具体职责。
- source_word: שִׁשִּׁים וּשְׁנַיִם
  choice: 六十二人
  rationale: 准确翻译基数，并按汉语表达补出量词“人”。
- source_word: לְעֹבֵד אֱדֹם
  choice: 属俄别以东的
  rationale: 句末的 לְ 表示关联或归属，是对俄别以东家系人数的总结；“属……的”清楚保留这一关系。
