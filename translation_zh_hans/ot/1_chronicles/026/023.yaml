  text: For the Amramites[a], the Izharites, the Hebronites, and the Uzzielites.
translation:
  language: zh_hans
  text: 至于暗兰族[a]、以斯哈族、希伯伦族和乌薛族：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“属于暗兰族的、属于以斯哈族的、属于希伯伦族的和属于乌薛族的。”希伯来文只有四个带介词 ל 的宗族称谓，在这里起名单标题的作用。
    reason: 保留介词 ל 在此可理解为引出主题或表示归属的歧义。
lexical_decisions:
- source_word: לַעַמְרָמִי
  choice: 至于暗兰族
  rationale: ל 前缀与宗族称谓连用，在这里引出行政名单的一个标题。译作“至于”既自然，也保留原文与下文衔接方式未完全明说的特点；“暗兰族”表示暗兰的宗族后裔。
- source_word: לַיִּצְהָרִי
  choice: 以斯哈族
  rationale: 这是由“以斯哈”构成的宗族称谓。用“族”简洁表达该家族群体，并与本节其他名称保持一致。
- source_word: לַחֶבְרוֹנִי
  choice: 希伯伦族
  rationale: 这是由“希伯伦”构成的宗族称谓；译作“希伯伦族”，保留名单式的简洁结构。
- source_word: לָעָזִּיאֵלִי
  choice: 乌薛族
  rationale: 这是由“乌薛”构成的宗族称谓。中文在末项前补“和”，使并列名单自然流畅；冒号表明整节具有标题作用。
theological_decisions: []
