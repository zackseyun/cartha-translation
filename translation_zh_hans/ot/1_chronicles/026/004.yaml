base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/004.yaml
  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
translation:
  language: zh_hans
  text: 俄别以东的儿子是[a]：长子示玛雅，次子约萨拔，三子约亚，四子沙甲[b]，五子拿坦业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“至于俄别以东，儿子……”；这里按汉语家谱的自然表达补出“是”。
    reason: lexical_alternative
  - marker: b
    text: 这里的人名“沙甲”所对应的希伯来文形式，与“以萨迦”不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֹבֵד אֱדֹם בָּנִים
  choice: 俄别以东的儿子是
  rationale: 希伯来文直译近于“至于俄别以东，儿子……”，是省略谓语的家谱表达。汉语补出“是”，既自然，也不增添经文未表达的事件性含义。
- source_word: שְׁמַעְיָה הַבְּכוֹר
  choice: 长子示玛雅
  rationale: הַבְּכוֹר 指家中的“头生子、长子”，不只是排列中的“第一”；采用现代汉语自然的家谱说法。
- source_word: יְהוֹזָבָד הַשֵּׁנִי
  choice: 次子约萨拔
  rationale: 按希伯来文人名音译，并以“次子”自然表达排行第二。
- source_word: יוֹאָח הַשְּׁלִשִׁי
  choice: 三子约亚
  rationale: 按希伯来文人名音译，并直接保留排行。
- source_word: וְ/שָׂכָר הָרְבִיעִי
  choice: 四子沙甲
  rationale: שָׂכָר 在本节是人名 Sakar，音译为“沙甲”，并与“以萨迦”的希伯来文形式区别开来。
- source_word: וּ/נְתַנְאֵל הַחֲמִישִׁי
  choice: 五子拿坦业
  rationale: 按本节希伯来文 נְתַנְאֵל 音译，并保留第五的排行。
