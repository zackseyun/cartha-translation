base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/022.yaml
  text: 'The sons of Jehieli: Zetham and Joel his brother were over the treasuries of the house of Yahweh[a].'
translation:
  language: zh_hans
  text: 耶希伊利的儿子西坦和他的兄弟约珥，掌管雅威殿里的库房[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“雅威的家”；“雅威”传统译作“耶和华”。
    reason: 说明原文“殿”所对应的字面说法，并提供神名的传统译法。
lexical_decisions:
- source_word: בְּנֵי יְחִיאֵלִי
  choice: 耶希伊利的儿子
  rationale: בְּנֵי 是“儿子”的复数构造形；在此家谱及职务名单的语境中，译作“儿子”比泛化为“后裔”更贴切。יְחִיאֵלִי 按专名音译为“耶希伊利”，同时承认其形式也可能被理解为族名形容词。
- source_word: זֵתָם
  choice: 西坦
  rationale: 人名按现代汉语圣经常见音译方式处理。
- source_word: וְיוֹאֵל אָחִיו
  choice: 和他的兄弟约珥
  rationale: אָחִיו 是带第三人称阳性单数后缀的“他的兄弟”，最自然地指约珥是西坦的兄弟；保留单数关系，不改写成“他们的兄弟”。汉语调整词序以表达自然。
- source_word: עַל
  choice: 掌管
  rationale: 在行政职务语境中表示负责、监督；“掌管”简洁自然，也准确表达其职责。
- source_word: אֹצְרוֹת
  choice: 库房
  rationale: 复数名词指圣殿中储存财物的库房或府库；“库房”既可指储存场所，也符合这里的制度性语境。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: בֵּית 字面为“家、房屋”，在此指敬拜场所，即圣殿；译作“殿”符合现代汉语宗教语境。יְהוָה 作为上帝的专名译为“雅威”，并以脚注说明传统译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用较能反映其希伯来语读音的“雅威”，避免以称号“主”取代专名；脚注保留读者熟悉的传统译法。
- issue: בֵּית יְהוָה 的语义
  choice: 雅威殿
  alternative: 雅威的家；雅威的殿宇
  rationale: 这里的“家”在历代志圣殿行政语境中指圣殿。正文用自然明确的“殿”，脚注保留原文字面表达，避免掩盖其措辞。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句法保持名单式经文的简洁；用“掌管”和“库房”自然表达圣殿行政职责。脚注标记[a]已置于正文相应位置。
