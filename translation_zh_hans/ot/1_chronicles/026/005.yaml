base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/005.yaml
  text: Ammiel the sixth[a], Issachar the seventh, Peullethai the eighth; for God had blessed him.
translation:
  language: zh_hans
  text: 第六个是亚米利，第七个是以萨迦，第八个是毗乌利太；因为上帝赐福给他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”按上下文最可能指俄别以东。也可译作“因为上帝已经赐福给他”；希伯来语动词为完成式，但不必在中文中明确表达为过去完成。
    reason: 说明代词所指及希伯来语完成式的可译范围。
lexical_decisions:
- source_word: עַמִּיאֵל
  choice: 亚米利
  rationale: 人名按现代中文圣经常见形式音译；在本节中是俄别以东的第六个儿子。
- source_word: הַשִּׁשִּׁי
  choice: 第六个
  rationale: 带定冠词的序数词，承接上文按次序列举儿子的结构；补出量词“个”使现代汉语自然。
- source_word: יִשָׂשכָר
  choice: 以萨迦
  rationale: 采用中文圣经中通行的人名译法；此处指个人，并非支派。
- source_word: הַשְּׁבִיעִי
  choice: 第七个
  rationale: 与前后序数词保持平行，并以“个”清楚表达所列的是儿子。
- source_word: פְּעֻלְּתַי
  choice: 比乌利太
  rationale: 按希伯来语读音音译该人名，采用适合现代普通话的形式。
- source_word: הַשְּׁמִינִי
  choice: 第八个
  rationale: 完成本段按次序列举儿子的结构。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出上述众子之所以赐下的原因，直接保留希伯来语的因果关系。
- source_word: בֵרֲכוֹ
  choice: 赐福给了他
  rationale: ברך表示“赐福”，第三人称阳性单数后缀译为“他”；“了”自然表达已发生的行动，但不额外规定为过去完成时。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处为单数意义，指以色列的上帝；采用现代标准普通话中庄重而通行的称谓。
theological_decisions:
- issue: “他”（־וֹ）的所指
  choice: 正文保留代词“他”，不以专名替换
  alternative: 译作“俄别以东”，明确指出所指
  rationale: 上下文最自然地指向俄别以东，但希伯来语正文只使用代词；保留“他”既忠于形式，也不把上下文判断写成明示的专名。
- issue: 赐福动作的时态体貌
  choice: 译作“赐福给了他”
  alternative: 译作“已经赐福给他”或“赐福给他”
  rationale: 希伯来语完成式表明赐福是已发生的行动，但本身不要求过去完成时；中文用“了”可自然表达完成性，而不强化时间先后。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。三个名字与序数词保持整齐的名单节奏；分号区分名单和解释原因的从句。
