base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/021.yaml
  text: 'The sons of Ladan[b][a], the sons of the Gershonite belonging to Ladan: the heads of the fathers’ houses belonging to Ladan the Gershonite were Jehieli.'
translation:
  language: zh_hans
  text: 拉但的子孙[a]，就是革顺族中属拉但的子孙；革顺族人拉但的各父家之首[b]是耶希伊利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子孙”直译为“儿子”；在族谱中也可泛指后裔。
    reason: lexical_alternative
  - marker: b
    text: “各父家之首”指各祖传家族单位或宗族的首领。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 在族谱语境中，该词虽可直译为“儿子”，但也常泛指后裔；本节所说的是宗族支系，用“子孙”更符合现代汉语，同时保留血缘谱系含义。
- source_word: לַעְדָּן
  choice: 拉但
  rationale: 按希伯来语人名音译，并采用简洁、易读的现代汉语形式。
- source_word: הַגֵּרְשֻׁנִּי
  choice: 革顺族人／革顺族
  rationale: 该族称形式表示与革顺宗族的归属关系；依句法位置分别译作“革顺族”和“革顺族人”，使压缩的族谱表达在汉语中清楚自然。
- source_word: לְלַעְדָּן
  choice: 属拉但
  rationale: 介词ל在这里表示族谱中的归属或分类，而非方向或目的；“属拉但”准确表达这一支系关系。
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 各父家之首
  rationale: 保留希伯来语传统亲族单位“父家”的表达，并以“之首”指这些宗族单位的领袖；脚注解释其实际所指。
- source_word: יְחִיאֵלִי
  choice: 耶希伊利
  rationale: 按本节马所拉文本所见形式音译。上下文将其作为人名或家系名称；正文不擅自改为更常见的“耶希伊勒”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可读的族谱文体。原文句法高度压缩，译文以分号区分支系说明与首领陈述，同时重复“拉但”和“革顺族”的归属关系，避免在汉语中产生误解。
