base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/001.yaml
  text: 'For the divisions of the gatekeepers: of the Korahites[a], Meshelemiah son of Kore, from the sons of Asaph.'
translation:
  language: zh_hans
  text: 守门人的班次如下[a]：可拉族的米施利米雅，是可利的儿子，出自亚萨的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头也可译作“按守门人的班次”。这句话是引出守门人各班的段落标题。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלְקוֹת לְשֹׁעֲרִים
  choice: 守门人的班次如下
  rationale: 两个带 לְ 的短语构成段落标题，מַחְלְקוֹת 指按职责编排的班次或分组。用“班次如下”自然引出后面的名单，同时保留组织编排之意。
- source_word: לַקָּרְחִים
  choice: 可拉族中
  rationale: 指明守门人所属的可拉宗族；“族中”符合名单式汉语，也表达该人属于这一群体。
- source_word: מְשֶׁלֶמְיָהוּ
  choice: 米施利米雅
  rationale: 依本节马所拉文本的辅音形式音译人名，不简化为“示利米雅”。
- source_word: בֶן קֹרֵא
  choice: 可利的儿子
  rationale: בֶן 在此处自然理解为直接的父子关系；קֹרֵא 按专名音译为“可利”。
- source_word: מִן בְּנֵי אָסָף
  choice: 亚萨子孙
  rationale: מִן 表示出自某一族系，בְּנֵי 在家谱语境中可指后裔，译作“亚萨子孙”简洁自然，且不把此处的亚萨强行认定为其他经文中的同名人物。
