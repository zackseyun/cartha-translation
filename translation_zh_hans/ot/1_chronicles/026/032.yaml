base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/032.yaml
  text: And his brothers[a], valiant men, were two thousand seven hundred heads of fathers’ houses; and King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter of God and of the king.
translation:
  language: zh_hans
  text: 他的弟兄[a]都是勇士，共有二千七百人，是各父家的首领。大卫王委派他们管理吕便人、迦得人和玛拿西半支派，办理一切关于上帝和王的事务。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可指“同族的人”或“亲属”。
    reason: 希伯来语 אָח 在宗族语境中可具有比亲兄弟更宽的亲属含义。
lexical_decisions:
- source_word: וְאֶחָיו
  choice: 他的弟兄
  rationale: 直译为“他的弟兄”，所指承接上一节的哈沙比雅；在宗族语境中也可能泛指同族亲属，故加脚注保留这一可能。
- source_word: בְּנֵי חַיִל
  choice: 勇士
  rationale: 该词组可表示有力量、才干或英勇的人；“勇士”保留其惯用表达的力度，同时符合本段领袖群体的语境。
- source_word: אַלְפַּיִם וּשְׁבַע מֵאוֹת
  choice: 二千七百人
  rationale: 按原文基数词准确译出，并补“人”以合现代汉语。
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 各父家的首领
  rationale: 这是宗族及行政用语；“父家”保留古代父系家族结构，“各……首领”则使汉语清楚自然。
- source_word: וַיַּפְקִידֵם
  choice: 委派他们管理
  rationale: 使役式在此表示任命并交付监管职责；“委派……管理”兼顾正式任命与实际责任。
- source_word: עַל
  choice: 管理
  rationale: 在行政语境中表示对所列群体负有管辖或监督责任，译入动词短语比机械译作“在……之上”自然。
- source_word: הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: 吕便人、迦得人和玛拿西半支派
  rationale: 原文族名虽用单数集合形式，现代汉语分别以“人”和“支派”表达集体含义。
- source_word: לְכָל דְּבַר הָאֱלֹהִים וּדְבַר הַמֶּלֶךְ
  choice: 办理一切关于上帝和王的事务
  rationale: דבר在此指事项、事务或公务。“关于上帝和王的事务”保留两个责任领域及原文的概括性，不将其具体限定为礼仪或政务。
theological_decisions:
- issue: 受委派者在上帝与王之事务上的职责范围
  choice: 办理一切关于上帝和王的事务
  alternative: 办理上帝的一切事务和王的事务
  rationale: 原文并列上帝与王所涉及的事务，却未说明二者的具体内容或层级；所选译法保留这种并列和概括性，避免引入后来的宗教—国家制度分类。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“父家”作为古代以父系为核心的宗族单位予以保留；句子分为两句，以免长串并列影响普通读者理解。
