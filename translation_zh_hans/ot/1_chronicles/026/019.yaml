base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/019.yaml
  text: These were the divisions of the gatekeepers for the sons of the Korahites and for the sons of Merari[a].
translation:
  language: zh_hans
  text: 这些是可拉的子孙和米拉利的子孙中守门人的班次。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以上是
  rationale: 希伯来文是无系词的复数指示结构，用于总结前述名单；“以上是”符合现代汉语的篇章功能，也不必强行补入过去时。
- source_word: מַחְלְקוֹת
  choice: 班次
  rationale: 本词在圣殿职务安排中指按编组轮值或分派的单位；“班次”简洁地体现组织与职务安排，比泛称“分组”更贴合语境。
- source_word: הַשֹּׁעֲרִים
  choice: 守门人
  rationale: 指负责看守圣殿门户的人；“守门人”是自然、明确且庄重的现代汉语表达。
- source_word: לִבְנֵי הַקָּרְחִי
  choice: 分属可拉族人
  rationale: 介词לְ在此表达班次与宗族成员的归属或分配关系；“分属”使汉语顺畅。הַקָּרְחִי是宗族称谓，故译“可拉族人”，而非单指可拉本人。
- source_word: וְלִבְנֵי מְרָרִי
  choice: 和米拉利的子孙
  rationale: 保留原文明确的“米拉利的子孙”，并与前项并列；没有压缩为单纯的族名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事总结语体。“班次”契合历代志中圣殿职务的编组语境；正文保留两个宗族群体之间的并列，同时用“分属”使关系清楚。
