base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/010.yaml
  text: 'And Hosah[a], from the sons of Merari, had sons: Shimri the chief, though he was not the firstborn; his father made him chief.'
translation:
  language: zh_hans
  text: 米拉利子孙中的何萨有儿子：申利是首领；虽然他不是长子[a]，他父亲却立他为首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他不是长子”。希伯来语连词既可表示解释或原因，也可按上下文表示让步。
    reason: 保留 כִּי 在此处可能具有的解释性或因果性读法，避免正文的让步译法掩盖原文歧义。
lexical_decisions:
- source_word: וּלְחֹסָה
  choice: 何萨有
  rationale: 介词 לְ 在族谱名单中引出所属关系，意为“至于何萨，他有……”。汉语用“何萨有”自然补出名词句隐含的关系；וּ 承接上文，在本句中不必生硬译作“并且”。
- source_word: מִן בְּנֵי מְרָרִי
  choice: 米拉利的子孙
  rationale: 保留“出自米拉利众子孙”的宗族归属含义，并按现代汉语调整为“米拉利的子孙何萨”。
- source_word: בָּנִים
  choice: 几个儿子
  rationale: 原文为复数“儿子们”，此处是名单标题式结构；译作“有几个儿子”使汉语完整，又不限定具体数目。
- source_word: שִׁמְרִי
  choice: 申利
  rationale: 按常见中文圣经人名形式音译。
- source_word: הָרֹאשׁ
  choice: 首领
  rationale: רֹאשׁ 在这里指家族中的领袖地位，而非身体的“头”；“首领”庄重且符合名单语境。
- source_word: כִּי לֹא הָיָה בְכוֹר
  choice: 虽然他不是长子
  rationale: כִּי 可作解释或原因，也可由语境体现反差。正文采用让步读法，突出申利虽非长子却被立为首领，同时以脚注保留解释性读法。
- source_word: בְכוֹר
  choice: 长子
  rationale: 在儿子名录和家族继承语境中，בְכוֹר 指头生的儿子；现代汉语以“长子”表达自然准确。
- source_word: וַיְשִׂימֵהוּ אָבִיהוּ לְרֹאשׁ
  choice: 他父亲却立他为首领
  rationale: שׂים 与 לְ 连用表示指定或设立某人担任某地位；“立他为首领”保留任命含义。“却”使正文所采用的让步关系清楚，并与前句衔接自然。
