base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/030.yaml
  text: 'For the Hebronites: Hashabiah and his brothers[a], 1,700 capable men, were in charge of the oversight of Israel west of the Jordan, for all the work of the LORD and for the service of the king.'
translation:
  language: zh_hans
  text: 至于希伯仑族人，哈沙比雅和他的弟兄，共有一千七百名能干的人，负责管理约旦河西岸[a]的以色列人，办理耶和华的一切事务，并负责王的事务。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“在约旦河那边，向西”，即约旦河西岸。
    reason: 保留原文方位表达，同时在正文中使用清楚自然的现代汉语。
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: 至于希伯仑族人
  rationale: 这里指希伯仑人的利未宗族，而非单独一个人；此译法也自然衔接行政名录。
- source_word: חֲשַׁבְיָהוּ
  choice: 哈沙比雅
  rationale: 按现代汉语圣经人名的常见音译处理。
- source_word: וְאֶחָיו
  choice: 和他的弟兄
  rationale: 保留希伯来语的亲属称谓；在宗族语境中也可能泛指同族弟兄。
- source_word: בְּנֵי חַיִל
  choice: 能干的人
  rationale: 该词组可指有力量、有才干或英勇的人；本节是行政职责语境，因此突出胜任能力，不额外引入军事含义。
- source_word: עַל פְּקֻדַּת יִשְׂרָאֵל
  choice: 负责管理……以色列人
  rationale: פְּקֻדָּה在此表示监管、职责或管理；结合עַל，表达受托负责管理之意。
- source_word: מֵעֵבֶר לַיַּרְדֵּן מַעְרָבָה
  choice: 约旦河西岸的
  rationale: 原文较直译为“在约旦河那边，向西”；此处实际指约旦河西侧，正文采用自然明确的现代汉语，并以脚注保留原文表达。
- source_word: לְכֹל מְלֶאכֶת יְהוָה
  choice: 办理耶和华的一切事务
  rationale: מְלָאכָה涵盖工作、事务或职责；在行政和敬拜相关语境中，“事务”能保留其宽泛含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行译法，明确其为专名而非仅用称号代替。
- source_word: וְלַעֲבֹדַת הַמֶּלֶךְ
  choice: 和王的事务
  rationale: עֲבֹדָה在这里指服役、职务或事务；与前半句平行，简洁表达他们对王所承担的职责。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且明确作为专名的“耶和华”，不把神名仅替换为称号；“雅威”则是另一种可能的音译。
- issue: “耶和华的事务”与“王的事务”的关系
  choice: 保留两个并列职责范围
  alternative: 将二者合并解释为宗教和国家行政
  rationale: 原文只并列两类职责，没有详细界定彼此范围；译文保留这种宽泛性，避免加入后世政教分类。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“能干的人”“负责管理”“事务”符合行政语境；数字写成中文全称以适应经文正文风格。脚注标记置于其所解释的方位短语之后。
