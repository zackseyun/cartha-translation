base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/017.yaml
  text: On the east were six Levites; on the north[a], four a day; on the south, four a day; and at the storehouses, two by two.
translation:
  language: zh_hans
  text: 东面有六名利未人；北面每天四人，南面每天四人；库房[a]那里，两人一组。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“亚苏平”（Asuppim）；这词也可能是某个特定地点或一组房室的名称，不一定泛指库房。
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּזְרָח
  choice: 东面
  rationale: 介词与方位名词组成地点表达，指守门人员被安排的方位；“东面”自然且与后文“北面、南面”平行。
- source_word: הַלְוִיִּם שִׁשָּׁה
  choice: 有六名利未人
  rationale: 原文明确说东面是六名利未人；用“名”计人数，符合现代汉语，同时保留群体身份。
- source_word: לַצָּפוֹנָה לַיּוֹם אַרְבָּעָה
  choice: 北面每天四人
  rationale: לַיּוֹם 在值班分派的语境中表示按日计算，译作“每天”简明自然。
- source_word: לַנֶּגְבָּה לַיּוֹם אַרְבָּעָה
  choice: 南面每天四人
  rationale: 保持与北面分派相同的句式和按日值班的含义。
- source_word: וְלָאֲסֻפִּים
  choice: 库房那里
  rationale: אֲסֻפִּים 可能指圣殿建筑群中的储藏室或一个专名；正文采用较可理解的普通名词“库房”，并以脚注保留不确定性。
- source_word: שְׁנַיִם שְׁנָיִם
  choice: 每处两人
  rationale: 数词重复表达分配义；结合复数 אֲסֻפִּים，译作“每处两人”比直译“两人两人”更符合现代汉语，并保留分组配置之意。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留名单式行政分派的节奏。原文只在北面和南面的数目旁明确出现“每天”，因此不把“每天”补入东面的分派。脚注标记置于其实际所说明的“库房”之后。
