base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/029.yaml
  text: For the Izharites[a], Chenaniah and his sons were assigned to the outside work over Israel, as officers and judges.
translation:
  language: zh_hans
  text: 至于以斯哈族，基拿尼雅和他的众子负责以色列的外部事务[a]，担任官长和审判官。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外部事务”或译“外面的工作”；可能指中央圣所事务以外、在以色列民中承担的行政和司法职责。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: 至于以斯哈族
  rationale: 介词 לְ 加族名在名单中引出一个类别；译作“至于……族”符合现代汉语列举语气，也保留其支派家族含义。
- source_word: כְּנַנְיָהוּ
  choice: 基拿尼雅
  rationale: 按希伯来语音译人名，并采用中文圣经读者较熟悉的形式。
- source_word: וּבָנָיו
  choice: 和他的众子
  rationale: בָּנִים 在此为阳性复数，且处于宗族职务名单中，明确指儿子；“众子”简洁庄重。
- source_word: לַמְּלָאכָה הַחִיצוֹנָה
  choice: 负责……外务
  rationale: מְלָאכָה 指工作或职务，הַחִיצוֹנָה 指外部的；“外务”自然表达相对于圣所内部事务的外部职责，但不在正文中过度限定具体范围。
- source_word: עַל יִשְׂרָאֵל
  choice: 以色列的
  rationale: עַל 在行政语境可表达对以色列的管理或管辖；结合“负责”译为“以色列的外务”，以自然汉语传达其职责所及。
- source_word: לְשֹׁטְרִים
  choice: 担任官长
  rationale: שֹׁטְרִים 指承担行政职能的官员，并非现代意义的警察；“官长”兼具准确性和经文体庄重感。
- source_word: וּלְשֹׁפְטִים
  choice: 和审判官
  rationale: 该词指执行审判职能的人；“审判官”比单用“审判者”更自然，也清楚表明职务。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“外务”保留原文“外部的工作”所具有的概括性，并以脚注说明其可能范围，避免把推定的圣所外行政司法职责直接写入正文。
