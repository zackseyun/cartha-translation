base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/024.yaml
  text: And Shebuel son of Gershom[a], son of Moses[b], was chief over the treasuries.
translation:
  language: zh_hans
  text: 革舜的儿子、摩西的孙子示布业，是府库[b]的主管[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“首领”、“监督”或“负责人”。希伯来语指被委以权柄的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“库房”或“财宝”。原词可指储藏贵重物品的地方，也可指所储藏的财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁבֻאֵל
  choice: 细布业
  rationale: 采用现代中文圣经读者熟悉的人名音译。“וּ”在连续的职务名录中主要起衔接作用，中文无需机械译作“并且”。
- source_word: בֶּן גֵּרְשׁוֹם בֶּן מֹשֶׁה
  choice: 革舜的儿子、摩西的孙子
  rationale: 希伯来文逐层说明谱系：细布业是革舜之子，而革舜是摩西之子。中文用“儿子、孙子”清楚自然地表达同一关系。
- source_word: נָגִיד
  choice: 主管
  rationale: 该词表示被置于权柄或领导职位的人；在圣殿财物管理的行政语境中，“主管”既自然，又能表达监督责任，同时避免“王子”等不合语境的联想。
- source_word: עַל
  choice: 管理
  rationale: 此处表示对某项事务负有权责；结合“主管”译为“管理”，符合现代汉语行政表达。
- source_word: הָאֹצָרוֹת
  choice: 府库
  rationale: 该复数名词既可指储藏贵重物品的库房，也可指其中的财宝。上下文涉及圣殿财物的保管与职务分工，“府库”能较简洁地兼顾机构和储藏处的含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将希伯来语谱系链按中文习惯表达为“革舜的儿子、摩西的孙子”，并把职务关系组织为“管理府库的主管”；两个脚注标记均紧随其实际所注释的词语。
