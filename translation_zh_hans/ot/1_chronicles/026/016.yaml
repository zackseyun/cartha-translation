  yaml_path: translation/ot/1_chronicles/026/016.yaml
  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
translation:
  language: zh_hans
  text: 书聘和何萨抽到西边，连同上坡大路上的沙利基门[a]；守卫与守卫相对。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沙利基”可能源自意为“丢弃”或“抛出”的词，但这里很可能是门的专名。
    reason: 保留 שַׁלֶּכֶת 可作门名、且可能有相关词源含义的歧义。
lexical_decisions:
- source_word: לְשֻׁפִּים וּלְחֹסָה
  choice: 书聘和何萨抽到
  rationale: 介词 לְ 在上下文的抽签分派中表示所得的份；汉语补出“抽到”，使本节承接前后文的分配场景，同时不改变受领者关系。
- source_word: לַמַּעֲרָב
  choice: 西边
  rationale: 表示被分派的西面区域；“西边”自然简洁。
- source_word: עִם שַׁעַר שַׁלֶּכֶת
  choice: 连同……沙利基门
  rationale: עִם 表示伴随或一并包括；שַׁלֶּכֶת 按专名音译为“沙利基”，其可能的词义另见脚注。
- source_word: בַּמְסִלָּה הָעוֹלָה
  choice: 上坡大路旁
  rationale: מְסִלָּה 指修筑的大路或高起的道路，הָעוֹלָה 表明道路向上延伸；按地标关系译为“上坡大路旁”，符合现代汉语表达。
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: 岗哨彼此相对
  rationale: מִשְׁמָר 在此指守卫岗位或值守点，לְעֻמַּת 可表示相对、对应；译文保留原文简短且可能带空间意味的表述。
