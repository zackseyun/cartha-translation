base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/031.yaml
  text: For the Hebronites[a], Jeriah was the chief of the Hebronites according to his generations by fathers’ houses. In the fortieth year of David’s reign they were sought out[c][b], and among them mighty men of valor were found at Jazer of Gilead.
translation:
  language: zh_hans
  text: 至于希伯仑人[a]，耶利雅是希伯仑人的首领，按着他的宗系和父家[b]。大卫作王第四十年，有人查考他们，发现在基列的雅谢，他们中间有英勇能干的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“希伯仑人中，耶利雅是首领”。
    reason: 原文句首的 לְ 可理解为引出话题，也可译为群体内部的所属关系。
  - marker: b
    text: “父家”是宗族用语，指以共同父系祖先为基础的家族群体，不只是现代意义上的小家庭。
    reason: 说明古代以色列的亲族组织术语，避免现代读者误解。
  - marker: c
    text: “英勇能干的人”也可译作“勇士”或“有能力的人”；原文可指以力量、勇气或才干见长的人。
    reason: 保留 גִּבּוֹרֵי חַיִל 在军事勇武与广义能力之间的词义幅度。
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: 至于希伯仑人
  rationale: 句首的介词 לְ 在这里引出新的族群主题；“至于”自然地表达这一话题功能。
- source_word: יְרִיָּה
  choice: 耶利雅
  rationale: 采用现代中文圣经中常见、与希伯来语辅音形式相符的人名译法。
- source_word: הָרֹאשׁ
  choice: 是……的首领
  rationale: רֹאשׁ 在宗族和行政语境中指居首位、负领导责任的人；“首领”庄重且易懂。
- source_word: לְתֹלְדֹתָיו לְאָבוֹת
  choice: 按他的世系和父家
  rationale: “世系”表达 תולדות 的谱系含义，“父家”保留以共同父系祖先为基础的宗族单位；“他的”保留原文单数后缀。
- source_word: בִּשְׁנַת הָאַרְבָּעִים לְמַלְכוּת דָּוִיד
  choice: 大卫作王第四十年
  rationale: 自然、简洁地表达王朝纪年公式，不增添原文没有的信息。
- source_word: נִדְרָשׁוּ
  choice: 有人查考他们
  rationale: 原文 Niphal 形式表示他们受到查访、调查或核查；中文采用不定主语“有人”来保留施事者未明，同时避免生硬的被动句。
- source_word: וַיִּמָּצֵא בָהֶם
  choice: 发现……他们中间有
  rationale: 原文动词虽为单数形式，却与后面的复数名词构成存在、发现式表达；中文按其语义自然处理。
- source_word: גִּבּוֹרֵי חַיִל
  choice: 英勇能干的人
  rationale: 该固定词组可兼指勇力、英勇和卓越才干；此处不把含义限缩为纯军事身份。
- source_word: בְּיַעְזֵיר גִּלְעָד
  choice: 在基列的雅谢
  rationale: 按地点关系理解为位于基列地区的雅谢，采用常见中文地名译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于”标示段落话题转换；“有人查考他们”保留原文施事者不明的特点；“英勇能干的人”避免在行政与宗族语境中把词义不必要地限缩为军人。所有脚注标记均置于正文相应位置。
