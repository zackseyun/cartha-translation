base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/014.yaml
  text: The lot for the east fell to Shelemyahu. Then they cast lots for his son Zekaryahu[a], a counselor with insight, and his lot came out for the north.
translation:
  language: zh_hans
  text: 东边的签落给示利米雅。他们又为他的儿子撒迦利亚抽签；撒迦利亚是个有见识的谋士[a]，他抽得北边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“明智的谋士”。希伯来语直译为“具有见识（或审慎）的谋士”。
    reason: 保留 בְּשֶׂכֶל 可表示见识、明智或审慎的词义范围。
lexical_decisions:
- source_word: וַיִּפֹּל הַגּוֹרָל מִזְרָחָה
  choice: 东门的签落在……名下
  rationale: 保留 נפל + גורל“签落下”的具体意象，同时按守门人分派的语境，将方向词自然表达为“东门”。
- source_word: לְשֶׁלֶמְיָהוּ
  choice: 示利米雅
  rationale: 采用现代中文圣经读者较熟悉的希伯来人名译法；介词 לְ 所标示的归属关系以“落在……名下”表达。
- source_word: וּזְכַרְיָהוּ בְנוֹ
  choice: 他的儿子撒迦利亚
  rationale: 清楚表达 בְנוֹ 的父子关系，并保持原文引入第二位抽签者的次序。
- source_word: יוֹעֵץ בְּשֶׂכֶל
  choice: 有见识的谋士
  rationale: 分别保留 יוֹעֵץ“谋士、出谋划策者”和 שֶׂכֶל“见识、明智、审慎”两个语义成分，不将其简化为单一形容词。
- source_word: הִפִּילוּ גּוֹרָלוֹת
  choice: 他们为他抽签
  rationale: 使役形在此构成“抽签”的惯用表达；原文复数主语未明说，中文保留为“他们”，不擅自指定人物。
- source_word: וַיֵּצֵא גוֹרָלוֹ צָפוֹנָה
  choice: 结果他的签是北门
  rationale: יצא 与 גורל 表示抽签结果出来；译作“结果”符合现代汉语叙事，并以“北门”对应本段守门分派的语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“签落在……名下”保留原文抽签意象；“东门、北门”根据上下文明确这些方向指守门岗位，避免生硬的“向东、向北”。
