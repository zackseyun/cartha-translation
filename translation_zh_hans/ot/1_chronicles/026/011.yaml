  text: Hilkiah the second[a], Tebaliah the third, Zechariah the fourth. All the sons and brothers of Hosah were thirteen.
translation:
  language: zh_hans
  text: 11 次子是希勒家，三子是陀巴利雅，四子是撒迦利雅。何萨的儿子和弟兄共十三人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可能泛指何萨宗族中的男性亲属。
    reason: 保留 אָחִים 在宗族名册语境中可能具有较宽泛亲属含义的词义空间。
lexical_decisions:
- source_word: חִלְקִיָּהוּ
  choice: 希勒家
  rationale: 采用现代中文圣经中较通行的人名译法，音译此专名。
- source_word: הַשֵּׁנִי
  choice: 次子
  rationale: 定冠词加序数词在家族名单中表示排行；译为“次子”比“第二”更符合现代中文表达。
- source_word: טְבַלְיָהוּ
  choice: 提巴利雅
  rationale: 按希伯来语人名音译，并采用自然、易辨认的中文形式。
- source_word: הַשְּׁלִשִׁי
  choice: 三子
  rationale: 与上下文的家族排行一致，以简洁的中文排行形式表达。
- source_word: זְכַרְיָהוּ
  choice: 撒迦利雅
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: הָרְבִעִי
  choice: 四子
  rationale: 保留原文序数次序，并与“次子”“三子”形成平行。
- source_word: כָּל
  choice: 共
  rationale: 此处引出总数；中文以“共十三人”自然、准确地表达汇总意义。
- source_word: בָּנִים
  choice: 儿子
  rationale: 原文明确指男性后代，按性别准确翻译。
- source_word: וְאַחִים
  choice: 和弟兄
  rationale: 基本义为男性同胞；在宗族名单中也可能泛指男性亲属，正文保留直接词义，并以脚注说明较宽泛的可能。
- source_word: לְחֹסָה
  choice: 何萨的
  rationale: 介词在此表达归属或亲属关系，用中文领属结构最自然。
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: 十三人
  rationale: 准确表达总数，并补出中文计人数所需的量词“人”。
