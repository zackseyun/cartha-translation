  text: לְ֠/אֵלֶּה מַחְלְק֨וֹת הַ/שֹּֽׁעֲרִ֜ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִשְׁמָר֖וֹת לְ/עֻמַּ֣ת אֲחֵי/הֶ֑ם לְ/שָׁרֵ֖ת בְּ/בֵ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/012.yaml
  text: For these divisions of the gatekeepers[a], the chief men had assigned duties corresponding to those of their brothers, to minister in the house of Yahweh.
translation:
  language: zh_hans
  text: 至于这些守门人的班次，各领头的人都有与他们弟兄相对应的值班职务，要在雅威的殿中供职。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文句法紧凑。“值班职务”（מִשְׁמָרוֹת）也可译为“值班”或“职务安排”；“与他们弟兄相对应”也可理解为“与他们的弟兄一同／相对而立”。
    reason: 保留 מִשְׁמָרוֹת 的词义范围，以及 לְעֻמַּת אֲחֵיהֶם 的关系义和原文省略结构。
lexical_decisions:
- source_word: לְאֵלֶּה מַחְלְקוֹת הַשֹּׁעֲרִים
  choice: 这些守门人的班次中
  rationale: לְאֵלֶּה 与后续名词短语结构紧凑；译作“这些……中”可自然引出关于各班次的概述。מַחְלְקוֹת 指有组织的轮班编组，译为“班次”；הַשֹּׁעֲרִים 译为“守门人”。
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: 各首领
  rationale: רָאשֵׁי 表示负责人或首领；גְּבָרִים 在此限定这些男性圣殿人员，但汉语“各首领”已能在上下文中准确而自然地表达其职分，避免生硬的“众男子的首领”。
- source_word: מִשְׁמָרוֹת
  choice: 有当值的任务
  rationale: 该名词可指值班、守班或职务安排。原文省略系词，汉语补出“有”以成句，同时用“当值的任务”保留守门轮班与职务分派两方面的含义。
- source_word: לְעֻמַּת אֲחֵיהֶם
  choice: 和他们的弟兄一样
  rationale: לְעֻמַּת 表示对应、相称或并列关系；此处译为“和……一样”表达这些首领与弟兄同样承担值班任务。אֲחֵיהֶם 保留为“他们的弟兄”。
- source_word: לְשָׁרֵת
  choice: 为要……供职
  rationale: שׁרת 在圣殿语境中指履行神圣职务；“供职”比一般的“服事”更突出正式职分。
- source_word: בְּבֵית יְהוָה
  choice: 在雅威的殿中
  rationale: בְּבֵית 字面为“在……的家/殿中”，此处明确指圣殿，译作“殿中”自然清楚；专名 יְהוָה 音译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为较贴近学界通行重构读音的现代汉语音译，不以称号替代专名。
- issue: 是否把 גְּבָרִים 明译为男性用语
  choice: 在“各首领”中按历史语境理解为男性圣殿人员
  alternative: 众男子的首领；负责人
  rationale: 这里所指历史人物为男性，但逐字译成“众男子的首领”在汉语中容易误示这些人统领另一群男子。译文以职分为中心，未将所指对象中性化为泛指所有人。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“班次”“当值”“供职”符合圣殿人员轮班履职的行政语境；用脚注保留原文紧凑句法的另一种可能理解。
