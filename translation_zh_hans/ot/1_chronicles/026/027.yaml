  yaml_path: translation/ot/1_chronicles/026/027.yaml
  text: From the wars and from the spoil they had dedicated things to strengthen the house of Yahweh.
translation:
  language: zh_hans
  text: 他们把从历次战争和战利品中得来的财物分别为圣，为要加固耶和华的殿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们从历次争战和掠物中拿出财物，分别为圣，为要使耶和华的殿坚固。”原文没有明说“分别为圣”的宾语；正文的“财物”是为使汉语通顺而补出。“战利品”也可译作“掠物”；“加固”直译为“使坚固”。
    reason: 说明原文宾语省略，并保留“战争／争战”、“战利品／掠物”及“加固／使坚固”的主要译法选择。
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת
  choice: 战争所得
  rationale: מִן表示来源；结合后面的“战利品”和省略的宾语，用“战争所得”自然表达从战争中取得并献出的财物，同时保留“战争”的复数集合意义。
- source_word: וּמִן הַשָּׁלָל
  choice: 和战利品
  rationale: שָׁלָל指战争中夺得的财物；“战利品”是现代汉语中准确、通行且语体庄重的对应词。
- source_word: הִקְדִּישׁוּ
  choice: 分别为圣
  rationale: קדשׁ的使役词干在此指把财物划归神圣用途。“分别为圣”保留宗教含义；汉语句中以“战争所得和战利品”承接希伯来文未明说的宾语。
- source_word: לְחַזֵּק
  choice: 修缮
  rationale: חזק基本义为“使坚固”，用于圣殿建筑和管理语境时可指加固、修理或维护。“修缮”在现代汉语中最自然地表达这里的实际目的，但脚注保留较直译的可能。
- source_word: לְבֵית יְהוָה
  choice: 耶和华的殿
  rationale: בֵּית־יְהוָה在本语境指圣殿；“殿”比字面的“家/房屋”更符合现代汉语。将神名 יְהוָה 音译为传统且通行的“耶和华”，不以称号替代专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代简体中文圣经传统中最广为人知的专名“耶和华”；“雅威”更接近常见学术重构的读音，但该读音并非完全确定。
- issue: הִקְדִּישׁוּ 的神圣含义
  choice: 分别为圣
  alternative: 奉献
  rationale: “分别为圣”明确保留了词根 קדשׁ 的圣别含义；“奉献”更自然简洁，却可能弱化将财物划归神圣用途的语义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“战争所得”避免“从战争中把战争分别为圣”的歧义；“修缮”适合圣殿建筑语境。脚注交代希伯来文省略宾语以及“使坚固”的直译，以免正文过度消除原文张力。
