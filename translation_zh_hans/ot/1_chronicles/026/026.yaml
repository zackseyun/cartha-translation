  text: ה֧וּא שְׁלֹמ֣וֹת וְ/אֶחָ֗י/ו עַ֣ל כָּל אֹצְר֤וֹת הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר הִקְדִּ֜ישׁ דָּוִ֣יד הַ/מֶּ֗לֶךְ וְ/רָאשֵׁ֧י הָ/אָב֛וֹת לְ/שָׂרֵֽי הָ/אֲלָפִ֥ים וְ/הַ/מֵּא֖וֹת וְ/שָׂרֵ֥י הַ/צָּבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/026.yaml
  text: Shelomoth and his brothers were over all the treasuries of the holy things that King David[a], the heads of the fathers’ houses, the commanders of thousands and of hundreds[b], and the commanders of the army had dedicated.
translation:
  language: zh_hans
  text: 示罗密和他的弟兄掌管存放一切圣物[a]的库房；这些圣物是大卫王、各父族的首领[b]、千夫长和百夫长，以及军队的将领所奉献的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”也可译作“分别为圣之物”或“奉献物”。
    reason: lexical_alternative
  - marker: b
    text: “父族的首领”是指以父系宗族为基础的家族行政领袖。
    reason: cultural_note
lexical_decisions:
- source_word: הוּא שְׁלֹמוֹת וְאֶחָיו
  choice: 示罗密和他的弟兄
  rationale: הוּא字面为“他”，但与“示罗密和他的弟兄”共同构成实际主语；汉语无需另译代词。אָח采用直接而符合利未人群体语境的“弟兄”。人名按通行汉译作“示罗密”。
- source_word: עַל
  choice: 掌管
  rationale: 此处表示行政上的管理和监督权责；“掌管”简洁、自然，也符合圣殿职务语境。
- source_word: כָּל אֹצְרוֹת הַקֳּדָשִׁים
  choice: 存放一切圣物的库房
  rationale: אֹצָר可指库房、府库或其中的财物；在圣殿管理语境中，译作实体性的“库房”较明确。הַקֳּדָשִׁים直译为“圣物”，保留其概括性。
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: 所奉献的
  rationale: קדשׁ的使役式在此指把物品分别出来归于神；“奉献”是自然的现代汉语，并与库房中的圣物相称。
- source_word: דָּוִיד הַמֶּלֶךְ
  choice: 大卫王
  rationale: 采用自然的现代汉语称谓次序。
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 各父族的首领
  rationale: 这是《历代志》中以父系宗族为基础的行政称谓；“父族”既保留原文亲族结构，也比逐字译为“父亲们的首领”自然。
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: 千夫长和百夫长
  rationale: 原文指统领千人和百人单位的官长；采用简洁、通行的汉语军事称谓。
- source_word: שָׂרֵי הַצָּבָא
  choice: 军队的将领
  rationale: צָבָא在此指军队，שָׂרִים指领军官员；译文避免误解为天军。
theological_decisions:
- issue: 奉献圣物者的范围
  choice: 将大卫王、父族首领、千夫长和百夫长、军队将领都理解为并列的奉献者。
  alternative: 只把大卫理解为奉献者，其余人物与动词的关系较间接。
  rationale: 原文以连续的וְ连接各组人物，最自然地构成并列主语。尽管הִקְדִּישׁ为单数形式，希伯来语可在动词先于一串并列主语时使用单数；汉语“……所奉献的”自然涵盖全部所列群体。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“存放一切圣物的库房”把原文的所属关系自然展开；分号帮助读者辨明管理者与奉献者两个层次。脚注标记分别紧跟实际需要说明的词语。
