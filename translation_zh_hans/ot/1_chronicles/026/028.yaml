base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/028.yaml
  text: And all that Samuel the seer[a], Saul son of Kish, Abner son of Ner[b], and Joab son of Zeruiah had dedicated—everything that anyone had dedicated—was under the care of Shelomith and his brothers.
translation:
  language: zh_hans
  text: 先见撒母耳[a]、基士的儿子扫罗、尼珥的儿子押尼珥和洗鲁雅的儿子约押所奉献的一切——凡所奉献的——都由示罗密和他的弟兄经管[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先见”是希伯来语称号 רֹאֶה，是对先知性人物的一种较早称呼。
    reason: cultural_note
  - marker: b
    text: “由……经管”也可译作“交由……掌管”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הַהִקְדִּישׁ
  choice: 所奉献的一切
  rationale: קדשׁ的使役式在此指把财物奉献出来作神圣用途；“所奉献的一切”既保留כֹל的总体含义，也符合上下文中的府库管理场景。
- source_word: שְׁמוּאֵל הָרֹאֶה
  choice: 先见撒母耳
  rationale: רֹאֶה是较早期的先知性称号；译作“先见”可保留它与通常译为“先知”的称谓之间的词汇区别。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 这里是直接的父子身份表达，无须扩大为“后裔”。
- source_word: כֹּל הַמַּקְדִּישׁ
  choice: 凡有人奉献的
  rationale: 带冠词的单数分词可作概括性表达，指任何奉献者及其所奉献之物；此译法在中文中自然，也保留原文对奉献来源的广泛概括。
- source_word: עַל יַד
  choice: 由……经管
  rationale: 该短语在行政语境中表示由某人掌管、负责；“经管”简洁地表达财物处于其管理之下。
- source_word: וְאֶחָיו
  choice: 和他的弟兄
  rationale: 直译为“他的弟兄”；语境可能包括同族近亲，但原文没有进一步限定，故不改译为“亲族”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。人名使用中文圣经传统中通行的译名；以破折号呈现原文后半句的概括性复述，同时不把“凡有人奉献的”缩窄为仅指前面列名者所奉献的物品。
