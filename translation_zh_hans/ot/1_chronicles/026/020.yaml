base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/020.yaml
  text: And of the Levites[b][a], Ahijah was over the treasuries of the house of God and the treasuries of the holy things.
translation:
  language: zh_hans
  text: 至于利未人[a]，亚希雅管理上帝的殿的库房和圣物[b]的库房。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文开头较为省略，也可译作“利未人方面：亚希雅管理……”。
    reason: alternative_reading
  - marker: b
    text: “圣物”也可译作“奉献之物”或“分别为圣之物”，指划归神圣用途的物品。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: 至于利未人
  rationale: 将带冠词的名词短语理解为话题转换；后接单数人名，表明这里是在引出利未人中的一项管理职分。译文自然，同时以脚注保留原文开头的省略性。
- source_word: אֲחִיָּה
  choice: 亚希雅
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: עַל
  choice: 管理
  rationale: 在行政语境中表示负责、主管；“管理”准确传达监督权责，又符合现代中文表达。
- source_word: אֹצְרוֹת
  choice: 库房
  rationale: 该词可指储藏贵重物品或物资的场所；在圣殿语境中，“库房”比“仓库”更庄重、贴切。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝殿
  rationale: 原文直译为“上帝的殿/家”。此处指圣所建筑群，“上帝殿”既保留“殿”的意象，也比展开为“上帝的殿宇”简洁自然。
- source_word: וּלְאֹצְרוֹת
  choice: 和……的库房
  rationale: 介词 לְ 与前面的 עַל 构成关联，第二组库房同样受亚希雅管理；中文无需重复“管理”。
- source_word: הַקֳּדָשִׁים
  choice: 圣物
  rationale: 该复数名词指分别为圣、供神圣用途之物；“圣物”简明而直接，脚注说明也可理解为奉献或分别为圣之物。
theological_decisions:
- issue: הַקֳּדָשִׁים 所指范围
  choice: 圣物
  alternative: 奉献之物／分别为圣之物
  rationale: 原文可以泛指被分别为圣的物品，不宜在正文中限定为某一类祭物、礼物或器具；采用较宽泛的“圣物”以保留语义空间。
translation_notes:
  register: 采用现代、庄重而易懂的书面中文。“至于”清楚标示段落中的话题转换；“管理”比直译式的“在……之上”自然。两个脚注标记均置于相关词语之后。
