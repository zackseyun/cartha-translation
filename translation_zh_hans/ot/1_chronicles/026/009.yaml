  text: And Shelemiah had sons and brothers[a], valiant men[b], eighteen.
translation:
  language: zh_hans
  text: 至于米施利米雅，他的儿子和弟兄共十八人，都是有勇力的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有勇力的人”也可译作“勇士”或“有能力的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְשֶֽׁלֶמְיָ֗הוּ
  choice: 属米施利米雅的
  rationale: 介词 לְ 在这里引出所要统计的人家，直译近于“归米施利米雅的”或“至于米施利米雅”。译作“属米施利米雅的”既保留点数结构，也符合现代汉语表达。人名按希伯来文本 מְשֶׁלֶמְיָהוּ 音译为“米施利米雅”。
- source_word: בָּנִים
  choice: 儿子
  rationale: 该词在这里明确指男性后代，因此译为“儿子”，不泛化为“儿女”。
- source_word: וְ/אַחִים
  choice: 和弟兄
  rationale: אַחִים 的通常意义是男性手足“弟兄”；上下文没有充分理由将其扩大解释为一般亲族。
- source_word: בְּנֵי חָיִל
  choice: 能干的人
  rationale: 该习语字面为“能力／勇力之子”，可指有能力、有才干或英勇的人。守门人的点名语境侧重胜任职务，故正文采用自然且涵盖面较广的“能干的人”，并以脚注保留“勇士”的可能译法。
- source_word: שְׁמוֹנָה עָשָׂר
  choice: 共十八人
  rationale: 数字按通常基数译出；加入“共”和量词“人”，清楚表明这是前述儿子和弟兄的总数。
