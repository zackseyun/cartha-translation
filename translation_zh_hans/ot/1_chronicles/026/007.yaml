base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/007.yaml
  text: 'The sons of Shemaiah: Othni[a], Rephael, Obed, Elzabad, whose brothers were capable men, Elihu and Semakiah.'
translation:
  language: zh_hans
  text: 示玛雅的儿子有俄得尼、利法益、俄备得和以利萨巴；以利萨巴的兄弟以利户和西玛迦都是有才干的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有才干的人”也可译作“勇士”或“有能力的人”。希伯来语这个词组可指力量、勇武或才干。
    reason: 保留בְּנֵי חָיִל的词义范围，避免正文选词排除其勇武含义。
lexical_decisions:
- source_word: בְּנֵי שְׁמַעְיָה
  choice: 示玛雅的儿子
  rationale: 按希伯来语属格结构直译，保留家谱名单的庄重简洁风格。
- source_word: עָתְנִי וּרְפָאֵל וְעוֹבֵד אֶלְזָבָד
  choice: 俄得尼、利法益、俄备得和以利萨巴
  rationale: 采用现代中文圣经读者较熟悉的人名音译，并按中文列举习惯连接。
- source_word: אֶחָיו
  choice: 以利萨巴的兄弟
  rationale: 原文为第三人称阳性单数后缀，直译为“他的兄弟”；为避免中文代词所指含混，明确复述最近的先行词“以利萨巴”，同时不改动亲属关系。
- source_word: בְּנֵי חָיִל
  choice: 有才干的人
  rationale: 该词组可表示力量、勇武或办事能力；本段语境是圣殿守门人的编组，“有才干的人”自然传达胜任与能力，又不把含义限定为军事勇武。
- source_word: אֱלִיהוּ וּסְמַכְיָהוּ
  choice: 以利户和西玛迦
  rationale: 依照现代中文圣经中通行的人名音译。
theological_decisions:
- issue: אֶחָיו的指代及后置同位结构
  choice: 将以利户和西玛迦理解为以利萨巴的兄弟，并以“以利萨巴的兄弟……都是……”表达
  alternative: 把“他的兄弟”保留为独立、指代不明的名单成分，或理解为前述众人的兄弟
  rationale: 阳性单数后缀最自然地回指最近的单数男性名字以利萨巴；后面的两个名字可视为“他的兄弟、有才干的人”的同位说明。此处理澄清汉语句法，但不引入神学性解释。
translation_notes:
  register: 采用现代、清楚而庄重的名单体表达。“有……和……”符合现代汉语列举习惯；用分号区分示玛雅众子的名单与对以利萨巴兄弟的补充说明。
