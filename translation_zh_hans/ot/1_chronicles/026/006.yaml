base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/006.yaml
  text: And to Shemaiah his son[a], sons were born who ruled over their fathers’ house[b], for they were mighty men of valor.
translation:
  language: zh_hans
  text: 他的儿子示玛雅也生了儿子；他们在各自的父家中掌权[a]，因为他们都是英勇能干的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们作父家的首领。”
    reason: 希伯来语分词既可表达实际掌权，也可理解为“掌权者、首领”。
  - marker: b
    text: “英勇能干的人”所对应的希伯来语也可指有实力、有才干或有声望的人，不一定专指战士。
    reason: 保留 גִּבּוֹרֵי חַיִל 在非军事语境中较宽的语义范围。
lexical_decisions:
- source_word: וְלִשְׁמַעְיָה בְנוֹ
  choice: 他的儿子示玛雅也
  rationale: 希伯来语直译近于“他的儿子示玛雅也有……为他而生”。结合家谱语境，采用自然的现代汉语表达，同时保留示玛雅是前文人物之子的关系。
- source_word: נוֹלַד בָּנִים
  choice: 生了几个儿子
  rationale: נוֹלַד 在形式上为单数被动式，但家谱出生句式中可与复数 בָּנִים 搭配；汉语以主动句“生了几个儿子”表达最自然。“几个”只标示不定复数，不规定具体数目。
- source_word: הַמִּמְשָׁלִים
  choice: 掌权
  rationale: 该分词源于 משל，表示治理、掌权。译作“掌权”既保留权柄含义，也避免把它过早限定为正式官职。
- source_word: לְבֵית אֲבִיהֶם
  choice: 在父家中
  rationale: בֵּית אָב 是家谱和宗族语境中的“父家”，即父系家庭或宗族单位；这里采用简洁而符合圣经家谱语体的“父家”。
- source_word: גִבּוֹרֵי חַיִל
  choice: 英勇能干的人
  rationale: 这一固定短语可表示勇猛、有实力、有才干或地位卓著的人；本节处于守门人家族名录中，译文兼顾勇力与才干，不将其仅限于战场上的勇士。
- source_word: הֵמָּה
  choice: 他们都是
  rationale: 独立代词带有强调作用；用“都是”自然地传达这群儿子共同具有所述素质。
theological_decisions: []
