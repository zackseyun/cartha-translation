  yaml_path: translation/ot/1_chronicles/026/002.yaml
  text: 'And Shelemiah had sons: Zechariah the firstborn[a], Jediael the second, Zebadiah the third[b], and Jathniel the fourth.'
translation:
  language: zh_hans
  text: 米施利米雅的儿子有：长子撒迦利雅[a]，次子耶叠，三子西巴第雅，四子雅提聂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“归米施利米雅，有儿子”，这是家谱中表示“米施利米雅有以下儿子”的句式。
    reason: cultural_note
  - marker: b
    text: “雅提聂”也可按另一种中文音译习惯译作“耶提聂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמְשֶׁלֶמְיָהוּ בָּנִים
  choice: 米施利米雅的儿子有
  rationale: 希伯来文直译为“归米施利米雅，有儿子”，是无动词的家谱句式；汉语用“……的儿子有”自然表达所属关系，并保留“儿子”的男性指向。句首连接词在名单连续语境中不必机械译出。
- source_word: זְכַרְיָהוּ הַבְּכוֹר
  choice: 长子撒迦利雅
  rationale: בְּכוֹר特指头生的儿子；在汉语家谱语体中，“长子”自然、准确，且与后面的“次子、三子、四子”相称。
- source_word: יְדִיעֲאֵל הַשֵּׁנִי
  choice: 次子耶叠
  rationale: 按现代中文圣经人名惯例音译יְדִיעֲאֵל，并以“次子”简洁表达排行第二。
- source_word: זְבַדְיָהוּ הַשְּׁלִישִׁי
  choice: 三子西巴第雅
  rationale: 按现代中文圣经人名惯例音译זְבַדְיָהוּ，并直接表达第三子的排行。
- source_word: יַתְנִיאֵל הָרְבִיעִי
  choice: 四子雅提聂
  rationale: יַתְנִיאֵל起首为希伯来辅音י；“雅提聂”既贴近原文发音，也符合中文圣经人名音译风格。
