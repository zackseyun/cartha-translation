base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/013.yaml
  text: And they cast lots[a], small and great alike, according to their fathers’ houses, for each gate.
translation:
  language: zh_hans
  text: 他们无论大小，都按父系家族，为各门抽签[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“为门和门”，即逐门分派。希伯来语重复单数名词以表达逐一、分别的意思。
    reason: 说明原文的分配式重复结构。
lexical_decisions:
- source_word: וַיַּפִּילוּ גוֹרָלוֹת
  choice: 抽签
  rationale: 这是希伯来语“使签落下”的固定表达，指用签决定分派；现代汉语用“抽签”自然、准确。
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: 无论大小
  rationale: 保留“小与大”这一身份或地位上的对举，不限定为年龄差异；“无论”表达二者同等参与。
- source_word: לְבֵית אֲבוֹתָם
  choice: 按父系家族
  rationale: בֵּית אָב 指按父系组织的家族单位；此处的介词表示抽签所依据的分组。
- source_word: לְשַׁעַר וָשָׁעַר
  choice: 为各门
  rationale: 希伯来语重复单数名词，具有逐一分配的作用；“各门”在现代汉语中简洁传达这一分配意义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“父系家族”比传统的“父家”更便于普通读者理解，又保留古代以父系家族为组织单位的含义；未将“大小”解释成“老少”，以保存原文在年龄、地位或规模方面的开放性。
