base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/025.yaml
  text: 'And his brothers belonging to Eliezer: Rehabiah his son[a], and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.'
translation:
  language: zh_hans
  text: 他的弟兄中，属以利以谢一系的有：以利以谢的儿子利哈比雅[a]，利哈比雅的儿子耶筛亚，耶筛亚的儿子约兰，约兰的儿子细基利，细基利的儿子示罗密。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“他的弟兄，属于以利以谢的：他的儿子利哈比雅”。这里的希伯来语结构简略，可能是在引出以利以谢这一支的家系。
    reason: 保留原文句法的含混，并说明正文为何采用较自然的谱系表达。
lexical_decisions:
- source_word: וְאֶחָיו לֶאֱלִיעֶזֶר
  choice: 他的弟兄中，属以利以谢一系的有
  rationale: 原文直译近似“他的弟兄，属于以利以谢的”，句法简略而含混；结合族谱语境，用“属……一系”自然地表明这是以利以谢的家系，同时以脚注保留原文结构。
- source_word: רְחַבְיָהוּ בְנוֹ
  choice: 以利以谢的儿子利哈比雅
  rationale: בְנוֹ意为“他的儿子”；在这段谱系开头，其所指按上下文为以利以谢。明说姓名可避免现代汉语中代词指向不清。
- source_word: וִישַׁעְיָהוּ
  choice: 耶筛亚
  rationale: 采用现代中文圣经人名惯用译法，并与先知以赛亚区分。
- source_word: וְיֹרָם
  choice: 约兰
  rationale: 按本节所见短式人名יֹרָם音译，不改作较长形式“约oram/约哈兰”所对应的名称。
- source_word: וְזִכְרִי
  choice: 细基利
  rationale: 采用中文圣经传统中清楚、可辨识的音译。
- source_word: וּשְׁלֹמוֹת
  choice: 示罗密
  rationale: 按《历代志》中此人的中文惯用名处理；该词在此是人名，不按普通词义翻译。
- source_word: בְנוֹ（反复出现）
  choice: ……的儿子
  rationale: 逐项明确父子关系，保留希伯来文连续谱系的结构，并使汉语指代清晰。
theological_decisions: []
