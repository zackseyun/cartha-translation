  yaml_path: translation/ot/1_chronicles/026/015.yaml
  text: To Obed-edom[a], the south; and to his sons, the house of stores.
translation:
  language: zh_hans
  text: 俄别以东抽到南边，他的儿子们抽到库房[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“储藏室”，也可能指存放收集之物的房屋。
    reason: 原词可指储藏处、库房或收集物的存放处，具体设施名称不完全确定。
lexical_decisions:
- source_word: לְעֹבֵד אֱדֹם
  choice: 俄别以东抽到
  rationale: 介词לְ在本段抽签分派的语境中表示归属；补出“抽到”，使汉语句子自然，并承接上下文的抽签安排。
- source_word: נֶגְבָּה
  choice: 南边
  rationale: 该词带方向词尾，指向南方；在门岗分派语境中译为“南边”简洁清楚。
- source_word: וּלְבָנָיו
  choice: 他的儿子们抽到
  rationale: 介词לְ同样表示分派归属；בָנָיו明确指俄别以东的儿子们。为使并列关系在现代汉语中清晰，重复补出“抽到”。
- source_word: בֵּית הָאֲסֻפִּים
  choice: 库房
  rationale: בֵּית指房屋或建筑，הָאֲסֻפִּים源于“聚集、收集”，合起来指存放所收集物品的场所。“库房”符合圣殿设施语境，也避免生硬直译为“收藏之屋”。
