  text: 'The sons of Judah: Perez[a], Hezron, Carmi, Hur, and Shobal.'
translation:
  language: zh_hans
  text: 犹大的子孙是：法勒斯[a]、希斯仑、迦米、户珥和朔巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“儿子”；在家谱中，这个词既可指亲生儿子，也可泛指后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 子孙
  rationale: 这是בֵּן的复数附属形，用于家谱时既可指亲生儿子，也可泛指后裔。鉴于本节所列人物并非全都是犹大的直接儿子，正文译作“子孙”更准确、自然。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: פֶּרֶץ
  choice: 法勒斯
  rationale: 采用现代中文圣经中较通行的传统人名译法，对应希伯来名פֶּרֶץ。
- source_word: חֶצְרוֹן
  choice: 希斯仑
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: כַרְמִי
  choice: 迦米
  rationale: 采用现代中文圣经中通行的人名译法；本节只列其名，不对其家系关系作额外解释。
- source_word: חוּר
  choice: 户珥
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: שׁוֹבָל
  choice: 朔巴
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וְ
  choice: 、……和
  rationale: 希伯来文反复使用连接词排列人名；中文以顿号分隔，并在末项前用“和”，自然地保留并列关系。
theological_decisions:
- issue: בְּנֵי在家谱中的亲属范围
  choice: 正文译作“子孙”，并以脚注说明直译
  alternative: “儿子”
  rationale: 名单包含不同世代的人物；译作“子孙”可反映家谱用语的宽泛范围，同时脚注保留原文“儿子”的形式和可能性，避免把各人的具体世代关系强行定死。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以冒号引出家谱名单，中文标点处理并列连接词；人名沿用中文圣经读者熟悉的通行译名。
