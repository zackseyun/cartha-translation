  text: וְ/כָל חַצְרֵי/הֶ֗ם אֲשֶׁ֧ר סְבִיב֛וֹת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה עַד בָּ֑עַל זֹ֚את מוֹשְׁבֹתָ֔/ם וְ/הִתְיַחְשָׂ֖/ם לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/033.yaml
  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
translation:
  language: zh_hans
  text: 他们所有的村庄都在这些城的周围，直到巴力。这些都是他们的居住地；他们也按家谱登记[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们也被登记在家谱中。”希伯来语指按世系进行登记。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: 属他们的村庄
  rationale: חָצֵר可指院落、围地或附属于城的村庄；本节列举城邑及其周边居住点，因此译作“村庄”最合语境。
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: 这些城周围
  rationale: 简明自然地表达这些村庄相对于前述诸城的位置。
- source_word: עַד בָּעַל
  choice: 直到巴力
  rationale: עַד表示地域延伸的界限；בָּעַל在此为地名，音译作“巴力”。
- source_word: זֹאת
  choice: 这些是
  rationale: זֹאת形式上是阴性单数，但在此概括前述诸地点；汉语采用复数指示语更自然，同时保留其总结作用。
- source_word: מוֹשְׁבֹתָם
  choice: 他们的住处
  rationale: מוֹשָׁב指居住之处或定居点；“住处”贴近原词，也避免与前面的“村庄”重复。
- source_word: וְהִתְיַחְשָׂם לָהֶם
  choice: 他们也按家谱登记
  rationale: התיחש的Hitpael形式表示按世系核定、登记；该希伯来语表达较为压缩，此译保留主体参与登记的可能性。
