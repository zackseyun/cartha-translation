base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
translation:
  language: zh_hans
  text: 他的犹大妇人[a]生了基多之父[b]耶列、梭哥之父希伯和撒挪亚之父耶古铁。这些人是法老的女儿比提雅的儿子[c]；比提雅是米列所娶的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大妇人”也可译作“犹太女子”。
    reason: lexical_alternative
  - marker: b
    text: 历代志中的“……之父”不一定专指亲生父亲，也可指某地或宗族的创建者、祖先或首领。本节另外两处“……之父”同。
    reason: lexical_alternative
  - marker: c
    text: 本节希伯来文的句法较难确定。“他的犹大妇人”与法老的女儿比提雅可能是同一人，也可能是米列不同的妻子。
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִּיָּה
  choice: 犹大女子
  rationale: 这是阴性族称，可指“犹大女子”或“犹太女子”。正文采用较贴近历代志时代及地域—族群背景的“犹大女子”，同时以脚注保留另一种自然译法。
- source_word: יָלְדָה
  choice: 生了
  rationale: 在家谱表述中，ילד的阴性形式自然表示女子“生了”所列后代；现代汉语简洁明了。
- source_word: אֲבִי
  choice: ……之父
  rationale: 保留希伯来文家谱中的“父”这一表达，不在正文中断定其究竟指亲生父亲、祖先、创建者还是与当地宗族相关的首领。
- source_word: שׂוֹכוֹ
  choice: 梭哥
  rationale: 采用现代中文圣经传统中较通行的地名音译。
- source_word: יְקוּתִיאֵל
  choice: 耶古铁
  rationale: 按中文圣经人名惯例音译。
- source_word: זָנוֹחַ
  choice: 撒挪亚
  rationale: 采用现代中文圣经传统中较通行的地名音译。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 希伯来文明确使用阳性复数“儿子”；上下文所列也是男性，因此不泛化为“儿女”或“后代”。
- source_word: בִּתְיָה בַת־פַּרְעֹה
  choice: 法老的女儿比提雅
  rationale: 自然呈现同位关系，并明确保留她与法老的亲属关系。
- source_word: לָקַח
  choice: 娶的妻子
  rationale: לקח字面为“取”，在婚姻语境中常指娶妻；此译法在现代汉语中自然，也明确了末句的婚姻含义。
- source_word: וְאֵלֶּה
  choice: 他们是
  rationale: 根据前面所列三名男性，以代词承接，比直译“这些是”更符合现代汉语，同时保留总结性指认。
theological_decisions:
- issue: “他的犹大女子”与“法老的女儿比提雅”之间的关系
  choice: 依希伯来文次序翻译，并用脚注说明两者可能是同一女子，也可能是米列不同的妻子，不在正文中强行判定。
  alternative: 把“犹大女子”直接认定为比提雅，或通过重断句、校勘明确区分两位妻子。
  rationale: 本节句法和家谱关系存在真实困难。正文保留“犹大女子生了……”以及“他们是……比提雅的儿子”之间的张力，避免借翻译消除原文的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的家谱文体。人名和地名使用简体中文圣经中较通行的译名；正文维持希伯来文的紧凑结构，并通过脚注交代词义范围及句法歧义。
