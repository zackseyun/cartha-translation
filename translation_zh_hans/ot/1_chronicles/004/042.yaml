base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
translation:
  language: zh_hans
  text: 他们中有五百名西缅子孙前往西珥山，由以示的儿子毗拉提雅、尼阿利雅、利法雅和乌薛率领。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “率领”直译为“在他们前头”；这是表示领导的希伯来语惯用表达，指以示的这四个儿子带领这五百人。
    reason: 说明希伯来语惯用表达及其所指，避免将其限定为实际行进的位置。
lexical_decisions:
- source_word: וּמֵהֶם מִן בְּנֵי שִׁמְעוֹן
  choice: 他们中有……西缅子孙
  rationale: 保留介词表达的部分关系，同时按现代汉语语序合并表达，承接上文所说的群体；“子孙”也保留《历代志》的谱系措辞。
- source_word: הָלְכוּ לְהַר שֵׂעִיר
  choice: 前往西珥山
  rationale: הָלְכוּ是普通的行进动词，不额外加入军事意味；“西珥山”是该地名在中文圣经中的通行形式。
- source_word: אֲנָשִׁים חֲמֵשׁ מֵאוֹת
  choice: 五百名
  rationale: 人数与“西缅子孙”自然组合；中文量词“名”清楚表达五百名男子，又不增添“军队”等原文未明说的含义。
- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל
  choice: 毗拉提、尼利雅、利法雅和乌薛
  rationale: 采用中文圣经传统中清晰、易辨认的人名音译，并保留四人并列的结构。
- source_word: בְּנֵי יִשְׁעִי
  choice: 以示的儿子
  rationale: 明确四位具名者同为以示的儿子，符合原文的同位修饰关系。
- source_word: בְּרֹאשָׁם
  choice: 由……率领
  rationale: 这是希伯来语“在他们前头”的惯用含义，在现代汉语中译作“率领”自然明确，同时用脚注保留原文意象。
