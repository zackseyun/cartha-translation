  text: 提哥亚之父[a]亚实户有两个妻子：希拉和拿拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父”也可译作“祖先”或“创建者”。在家谱中，这个词可指宗族或城镇的奠基者，不一定只指直接的生父。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  choice: 亚施户
  rationale: 句首的连词和介词在此承接家谱叙述；现代汉语以姓名作主语即可自然表达，不必生硬译作“而对亚施户来说”。
- source_word: אֲבִי תְקוֹעַ
  choice: 提哥亚之父
  rationale: 直译保留 אָב 的“父”这一基本意象，同时借脚注说明家谱语境中也可能指祖先、宗族奠基者或城镇创建者，以免擅自消除原文的语义幅度。
- source_word: הָיוּ שְׁתֵּי נָשִׁים
  choice: 有两个妻子
  rationale: 希伯来文直译为“有两个女人/妻子在他那里”；在这一家谱记载中表达婚姻关系，现代汉语自然译为“有两个妻子”。
- source_word: חֶלְאָה
  choice: 希拉
  rationale: 采用现代中文圣经语境中清楚、简洁的希伯来人名音译。
- source_word: וְנַעֲרָה
  choice: 和拿拉
  rationale: 保留连接词所表达的并列关系，并采用通行、易读的人名音译。
