  text: וּ/מְעוֹנֹתַ֖י הוֹלִ֣יד אֶת עָפְרָ֑ה וּ/שְׂרָיָ֗ה הוֹלִ֤יד אֶת יוֹאָב֙ אֲבִי֙ גֵּ֣יא חֲרָשִׁ֔ים כִּ֥י חֲרָשִׁ֖ים הָיֽוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
translation:
  language: zh_hans
  text: 米乌挪太生了俄弗拉；西莱雅生了约押。约押是匠人谷之父[a]，因为那里的人都是匠人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “之父”也可指“创建者”或“祖先”。“匠人谷”是地名，希伯来文意为“工匠之谷”。
    reason: alternative_reading
lexical_decisions:
- source_word: מְעוֹנֹתַי
  choice: 米乌诺泰
  rationale: 按希伯来语人名音译，并采用适合现代普通话读者辨读的形式。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 使役形在家谱语境中表示生育或成为某人的父亲；“生了”简洁自然，也保留家谱关系。
- source_word: עָפְרָה
  choice: 俄弗拉
  rationale: 作为专名音译；原文在此未明确说明它是人名还是地名，不在正文中擅自判定。
- source_word: שְׂרָיָה
  choice: 西莱雅
  rationale: 按希伯来语人名音译。
- source_word: יוֹאָב
  choice: 约押
  rationale: 采用中文圣经传统中通行且易于识别的人名译法。
- source_word: אֲבִי
  choice: 之父
  rationale: 保留希伯来语“父”的表达及其可能涵盖父亲、祖先、首领或创建者的语义张力。
- source_word: גֵּיא חֲרָשִׁים
  choice: 匠人谷
  rationale: 该组合是有明确词义的地名，直译为“匠人谷”既体现地名性质，也使后面的命名解释在中文中清楚可见。
- source_word: כִּי
  choice: 因为
  rationale: 引出对地名或相关群体称呼的解释。
- source_word: חֲרָשִׁים
  choice: 匠人
  rationale: 该词泛指有技艺的工匠，不限于铁匠或某一种手艺人。
- source_word: הָיוּ
  choice: 都是
  rationale: 原文直译为“他们是”；中文补出“那里的人”作为其自然所指，同时避免误读为仅指约押一人。
theological_decisions:
- issue: “约押是匠人谷之父”的关系性质
  choice: 正文保留“之父”
  alternative: “匠人谷的创建者”或“匠人谷人的祖先”
  rationale: 家谱中的 אָב 可指生父，也可指祖先、群体首领或地方创建者。原文没有进一步限定，因此正文不把它收窄为某一种关系，并以脚注说明。
translation_notes:
  register: 采用现代、简洁而庄重的家谱文体。以“匠人谷”翻译有透明含义的希伯来地名，使“因为那里的人都是匠人”这一解释自然成立；同时用脚注保留“之父”在家谱和地名语境中的多重可能。
