base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/002.yaml
  text: Reaiah son of Shobal fathered Jahath[a], and Jahath fathered Ahumai and Lahad. These were the clans of the Zorathites.
translation:
  language: zh_hans
  text: 朔巴的儿子利亚雅生了雅哈；雅哈生了亚户买和拉哈。这些是琐拉人的各宗族[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”或译“家族”。这里的希伯来词可指由亲属关系构成的较大群体。
    reason: 保留 מִשְׁפְּחֹות 在族谱语境中的词义范围。
lexical_decisions:
- source_word: וּרְאָיָה
  choice: 利亚雅
  rationale: 人名按现代中文圣经中较通行的形式音译；句首连词 וּ 依中文行文无需另译。
- source_word: בֶן שׁוֹבָל
  choice: 朔巴的儿子
  rationale: בֶן 在族谱中可指儿子或后裔；此处保留原文较直接的亲子表述，不擅自扩大为“后裔”。
- source_word: הוֹלִיד / הֹלִיד
  choice: 生了
  rationale: 使役形 ילד 在族谱中表示生育、成为某人的父亲；“生了”简洁自然，并保留族谱的男性世系语境。
- source_word: יַחַת
  choice: 雅哈
  rationale: 人名音译。
- source_word: אֲחוּמַי
  choice: 亚户买
  rationale: 人名音译。
- source_word: לָהַד
  choice: 拉哈
  rationale: 人名音译。
- source_word: אֵלֶּה
  choice: 这些人
  rationale: 指向前述人物；补出“人”符合现代汉语指代习惯，但不增加更具体的身份。
- source_word: מִשְׁפְּחֹות
  choice: 各宗族
  rationale: 该词在支派族谱中通常指由亲属关系构成的扩展群体；“宗族”比现代汉语中的“家庭”更准确。
- source_word: הַצָּרְעָתִי
  choice: 琐拉人
  rationale: 这是由地名琐拉构成的族称，译作“琐拉人”自然且符合中文专名惯例。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持历代志族谱的紧凑句式。脚注标记置于其实际说明的“宗族”之后；英文咨询层中的标记位置显然与脚注内容不相对应，故依据希伯来原文调整。
