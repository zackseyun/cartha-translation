base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
translation:
  language: zh_hans
  text: 他们在那里找到一片肥美、优良的草场；那片土地宽广、安静而安宁，因为从前住在那里的人是含的后裔。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为出自含的人从前住在那里。”
    reason: 原文可理解为“从前住在那里的人出自含”；正文以“含的后裔”作自然的谱系表达，脚注保留较贴近原文的概括说法。
lexical_decisions:
- source_word: מִרְעֶה
  choice: 草场
  rationale: 指供牲畜放牧之地；“草场”符合本节寻找牧地的语境，也自然易懂。
- source_word: שָׁמֵן וָטוֹב
  choice: 肥美
  rationale: שָׁמֵן 字面为“肥”，用于草场表示丰饶茂盛；与 טוֹב 合译为“肥美”，简洁地传达两词合在一起的正面评价。
- source_word: רַחֲבַת יָדַיִם
  choice: 宽广
  rationale: 这是表示地方开阔、宽敞的习语；“宽广”在现代汉语中自然，并保留其空间含义。
- source_word: שֹׁקֶטֶת
  choice: 安静
  rationale: 表示不受扰动、处于安宁状态；“安静”保留其基本语义。
- source_word: שְׁלֵוָה
  choice: 太平
  rationale: 可指安逸、安稳或平静；与“安静”并列时，“太平”突出没有纷扰、安稳无事的状态，而不额外引入繁荣之意。
- source_word: כִּי מִן חָם הַיֹּשְׁבִים שָׁם לְפָנִים
  choice: 因为从前住在那里的是含的后裔
  rationale: 按希伯来语的名词性结构理解为“从前住在那里的人出自含”；“后裔”补明 מִן חָם 所表达的族源关系，使现代汉语通顺，同时不添加人数限定。
- source_word: חָם
  choice: 含
  rationale: 采用该圣经人名在现代中文中的通行译法。
theological_decisions:
- issue: “出自含”所表示的身份关系
  choice: 含的后裔
  alternative: 含族人
  rationale: 原文 מִן חָם 字面为“出自含”，表明族源，但没有明确使用“后裔”一词；正文采用自然的汉语表达，脚注保留较概括的族群译法，避免赋予更具体的身份信息。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“肥美的草场”符合牧养语境；“宽广、安静而太平”保留原文三个并列描述。脚注标记置于它所说明的末句之后。
