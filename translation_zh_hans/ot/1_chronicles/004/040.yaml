- from: 他们在那里找到了肥美的草场；那片土地宽广、安静而太平，因为从前住在那里的是含的后裔。[a]
  to: 他们在那里找到一片肥美、优良的草场；那片土地宽广、安静而安宁，因为从前住在那里的人是含的后裔。[a]
  rationale: 修订仅提升原文两个并列形容词的对应度，并将土地的安定状态译得更自然、语义更中性；末句的谱系关系与脚注锚点均予保留。
