  text: Chelub[a], the brother of Shuhah, fathered Mehir; he was the father of Eshton.
translation:
  language: zh_hans
  text: 书哈的兄弟基绿生了米黑；米黑是伊施屯的父亲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祖先”或“奠基者”。在家谱中，“父亲”有时并非指直接的生父，也可指某宗族或聚落的祖先、奠基者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְלוּב
  choice: 基绿
  rationale: 专名采用现代中文圣经读者较熟悉的传统音译；词首连接词 וּ 在这则家谱短句中由中文行文自然承接，不必机械译为“又”。
- source_word: אֲחִי שׁוּחָה
  choice: 书哈的兄弟
  rationale: 按构造链直译亲属关系；“兄弟”自然、明确，也不额外判断其为兄或弟。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 使役形在家谱语境中表示生育或产生后裔；“生了”是现代中文简洁自然的家谱表达。
- source_word: מְחִיר
  choice: 米黑
  rationale: 专名按通行中文圣经音译处理。
- source_word: הוּא
  choice: 他
  rationale: 保留原文独立代词及其承接结构，不用重复姓名来过度消除原文形式上可能存在的指代张力；按就近关系通常理解为米黑。
- source_word: אֲבִי
  choice: 父亲
  rationale: 采用该词最直接的亲属义；其在家谱中也可能有“祖先”或群体、聚落奠基者的较宽含义，另以脚注说明。
- source_word: אֶשְׁתּוֹן
  choice: 伊施屯
  rationale: 专名按通行中文圣经音译处理。
theological_decisions:
- issue: “父亲”（אֲבִי）在家谱中的关系范围
  choice: 正文译作“父亲”，脚注保留“祖先／奠基者”的可能性
  alternative: 正文直接译作“祖先”或“奠基者”
  rationale: 原文使用通常表示“父亲”的词，却容许家谱及宗族语境中的扩展义；正文采用基本义，脚注呈现真实的词义宽度，避免武断限定。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语，保留家谱体裁的紧凑结构。人名使用简体中文圣经传统中较通行的形式；分号对应原文两个紧密相连的分句。
