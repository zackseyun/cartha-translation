  source_fidelity: 末句原文为“这些是/为他们的城邑，直到大卫作王”，草稿的“这些城邑一直属于他们”将“是他们的城邑”改成较强的归属/所有权表述，并以“一直”补入连续性语气。地名应按原文较完整地转写；草稿中若干音节被省略或转写不够贴近希伯来文。
  naturalness: “又住在”可自然承接上文的居住语境。将末句改为“这些是他们的城邑，直到大卫作王”虽保留清单体的简洁和原文时间界限，也符合现代中文圣经叙述语体。
  terminology: 地名维持音译及中点形式。玛加博特（מַרְכָּבוֹת）、苏辛（סוּסִים）、比赖（בִּרְאִי）和沙阿拉音（שַׁעֲרַיִם）较完整地反映原文形式；脚注保留其可译词源义或转写变体，且不把词源义置入正文。
