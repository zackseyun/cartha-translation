base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/031.yaml
  text: and in Beth-marcaboth[a], and in Hazar-susim, and in Beth-biri, and in Shaaraim[d][c][b]. These were their cities until David reigned.
translation:
  language: zh_hans
  text: 又住在伯·玛加博特[a]、哈萨·苏辛[b]、伯·比赖[c]和沙阿拉音[d]。这些是他们的城邑，直到大卫作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯·玛加博特”按字面可译为“战车之家”，这里按地名音译。
    reason: lexical_alternative
  - marker: b
    text: “哈萨·苏辛”按字面可译为“马的院落”或“马村”，这里按地名音译。
    reason: lexical_alternative
  - marker: c
    text: “伯·比赖”也可转写为“伯·比利”。
    reason: alternative_reading
  - marker: d
    text: “沙阿拉音”的词形可能含有“双门”的意思，这里按地名音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בֵית מַרְכָּבוֹת
  choice: 又住在伯·玛加博
  rationale: 这是城邑名；按专名音译。“伯”对应地名构词成分 בֵּית，点号使中文复合地名清晰。原文介词承接上文居住语境，译作“住在”比孤立的“在”自然。
- source_word: וּ/בַ/חֲצַר סוּסִים
  choice: 哈萨·苏欣
  rationale: 在城邑清单中作为地名音译，不将其词源义“马的院落／村庄”直接代入正文。
- source_word: וּ/בְ/בֵית בִּרְאִי
  choice: 伯·比利
  rationale: 按马所拉文本元音音译为地名；末一成分的转写存在差异，保留脚注说明。
- source_word: וּֽ/בְ/שַׁעֲרָיִם
  choice: 沙拉音
  rationale: 作为地名音译；虽然词形可能令人联想到“双门”，正文不以词源义取代专名。
- source_word: אֵלֶּה עָרֵי/הֶם
  choice: 这些城邑一直属于他们
  rationale: אֵלֶּה 回指所列地点，עָרֵיהֶם 字面为“他们的城邑”。结合后面的时间界限，以“属于他们”自然表达领属关系。
- source_word: עַד מְלֹךְ דָּוִיד
  choice: 直到大卫作王
  rationale: עַד 加不定式结构标示时间界限；“直到大卫作王”保留简洁的动词表达，不进一步限定为即位之时或整个统治时期。
