  yaml_path: translation/ot/1_chronicles/004/026.yaml
  text: 'The sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.'
translation:
  language: zh_hans
  text: 米施玛的儿子有哈母利；哈母利的儿子是撒刻；撒刻的儿子是示每。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: ……的儿子有
  rationale: בְנֵי是“儿子”的复数构造形式。译作“……的儿子有”既保留家谱标题式结构，也使现代汉语自然；句首连接词וּ在连续家谱名单中不另译。
- source_word: מִשְׁמָע
  choice: 米施玛
  rationale: 按希伯来语专名音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: חַמּוּאֵל
  choice: 哈母利
  rationale: 按马所拉文本中的希伯来语专名音译，采用中文圣经传统中通行且易读的形式。
- source_word: בְּנוֹ
  choice: ……的儿子
  rationale: 该词由“儿子”与第三人称阳性单数后缀构成，直指“他的儿子”。汉语中逐次重述父名，可清楚显示家谱的父子承接关系，避免连续使用“他的”可能造成的指代含混。
- source_word: זַכּוּר
  choice: 撒刻
  rationale: 按希伯来语专名音译，采用中文圣经传统中较通行的形式。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 按希伯来语专名音译，采用中文圣经传统中通行的形式。
