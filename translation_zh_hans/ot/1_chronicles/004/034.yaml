  text: 还有米所巴、雅米勒和亚玛谢的儿子约沙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשׁוֹבָב
  choice: 米朔巴
  rationale: 人名按希伯来语读音音译；保留其专名性质，不按可能的词根意义意译。
- source_word: יַמְלֵךְ
  choice: 雅米勒
  rationale: 人名按希伯来语音译；词末辅音按现代汉语圣经人名常用方式简洁处理。
- source_word: יוֹשָׁה
  choice: 约沙
  rationale: 人名按希伯来语读音及现代汉语圣经常见音译习惯处理。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 这是家谱和名单中表示父子关系的常用词；用现代汉语自然表达其关系。
- source_word: אֲמַצְיָה
  choice: 亚玛谢
  rationale: 采用该希伯来人名在现代汉语圣经中的通行译名。
- source_word: וְ
  choice: 还有／和
  rationale: 原文在各名字前重复连接词。汉语以句首“还有”和末项前“和”自然呈现名单的延续与并列关系，避免机械重复。
