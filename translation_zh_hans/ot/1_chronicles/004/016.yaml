  text: 'And the sons of Jehallelel: Ziph[a], Ziphah, Tiria, and Asarel.'
translation:
  language: zh_hans
  text: 耶哈利勒的儿子有：西弗、西法、提利亚和亚撒列。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: ……的儿子有
  rationale: בְנֵי 是“儿子”的复数附属形式，在家谱中引出后代名单；句首连接词 וּ 承接上文，汉语家谱行文中不必机械译作“并且”，由上下文自然体现衔接。
- source_word: יְהַלֶּלְאֵל
  choice: 耶哈利勒
  rationale: 按希伯来语专名音译，并采用现代中文读者较易辨认的圣经人名形式。
- source_word: זִיף
  choice: 西弗
  rationale: 按马所拉文本中的专名音译。
- source_word: וְזִיפָה
  choice: 西法
  rationale: 按专名 זִיפָה 音译；前置连接词 וְ 在中文名单中以顿号所表达的并列关系体现。
- source_word: תִּירְיָא
  choice: 提利亚
  rationale: 依照希伯来语读音 tiryā 音译，保留词尾音节，比省作“提利”更贴近原文形式。
- source_word: וַאֲשַׂרְאֵל
  choice: 和亚撒列
  rationale: 专名 אֲשַׂרְאֵל 音译为“亚撒列”；连接词 וַ 在名单末项前自然译作“和”。
