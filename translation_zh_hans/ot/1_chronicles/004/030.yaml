lexical_decisions:
- source_word: וּ/בִ/בְתוּאֵל
  choice: 又住在彼土利
  rationale: 本节承接上文“他们住在……”的句法；וּ译为“又”，ב译为“在”。בְתוּאֵל在此是地名，按现代中文圣经常见音译作“彼土利”。
- source_word: וּ/בְ/חָרְמָה
  choice: 何珥玛
  rationale: וּ/בְ继续地点并列结构。中文列举时用顿号和末项前的“和”自然呈现，无须逐项重复“又住在”；חָרְמָה音译为“何珥玛”。
- source_word: וּ/בְ/צִיקְלָג
  choice: 和洗革拉
  rationale: 该词继续城镇名单；וּ在末项自然译作“和”，ב所表达的“在”由前文统摄。צִיקְלָג按通行中文地名译作“洗革拉”。
