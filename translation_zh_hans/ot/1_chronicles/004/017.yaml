base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/017.yaml
  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
translation:
  language: zh_hans
  text: 以斯拉的众子[a]是益帖、米列、以弗和雅伦。她[b]怀了米利暗、沙买和益巴；益巴是以实提摩的父亲[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以斯拉的儿子”。由于后面列出好几个人名，这里通常按集合意义理解为“以斯拉的众子”。
    reason: textual_variant
  - marker: b
    text: 希伯来文只说“她怀了”，本分句没有说明这名女子是谁。
    reason: lexical_alternative
  - marker: c
    text: 如果“以实提摩”指一个宗族或城镇，也可译作“以实提摩的始祖（或创建者）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: 众子
  rationale: 希伯来文形式为单数“儿子”，但后面列出多人，因此正文按家谱标题的集合意义译为“众子”，同时在脚注保留其字面形式。
- source_word: עֶזְרָה
  choice: 以斯拉
  rationale: 人名按现代中文圣经传统音译。
- source_word: יֶתֶר
  choice: 益帖
  rationale: 人名音译。
- source_word: וּמֶרֶד
  choice: 米列
  rationale: 人名音译。
- source_word: וְעֵפֶר
  choice: 以弗
  rationale: 人名音译。
- source_word: וְיָלוֹן
  choice: 雅伦
  rationale: 人名音译。
- source_word: וַתַּהַר
  choice: 她怀了
  rationale: הרה 的直接含义是“怀孕、受孕”。希伯来文动词为阴性单数，但本分句没有说明这名女子是谁，因此不补出姓名。
- source_word: מִרְיָם
  choice: 米利暗
  rationale: 照原文作为家谱中的人名音译，不依据此名在其他经文中的性别用法作改写。
- source_word: שַׁמַּי
  choice: 沙买
  rationale: 人名音译。
- source_word: יִשְׁבָּח
  choice: 益巴
  rationale: 人名音译。
- source_word: אֲבִי אֶשְׁתְּמֹעַ
  choice: 以实提摩的父亲
  rationale: 正文采用 אָב 在家谱中的直接含义“父亲”；若以实提摩指宗族或城镇，也可能表示其始祖或创建者，此可能性收入脚注。
theological_decisions: []
