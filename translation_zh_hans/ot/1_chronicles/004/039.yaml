base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
translation:
  language: zh_hans
  text: 他们前往基多的入口[a]，直到谷的东边[b]，为他们的羊群寻找草场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“通往基多的路”。这里的希伯来语词可指入口、通路或进入之处。
    reason: lexical_alternative
  - marker: b
    text: 或译：“谷以东”或“朝谷的东面”。希伯来语原文是简略的地形表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 他们……去
  rationale: 该叙事性动词承接上文，表示接下来的行动；译为“去”简明自然。
- source_word: לִמְבוֹא
  choice: 往……的入口
  rationale: מָבוֹא可指入口、进路或进入之处；此处与地名连用，译作“入口”保留其空间意义，并在脚注说明其他可能。
- source_word: גְדֹר
  choice: 基多
  rationale: 按希伯来语地名音译，不把地名意译。
- source_word: עַד
  choice: 直到
  rationale: 此处表示空间所及的范围，而非时间终点。
- source_word: לְמִזְרַח הַגָּיְא
  choice: 谷的东边
  rationale: 这是简略的地形表达，可理解为谷的东侧、谷以东或朝谷的东面；正文采用自然且不过度具体化的译法，脚注保留歧义。
- source_word: לְבַקֵּשׁ
  choice: 要……寻找
  rationale: 不定式在此表示目的；“要……寻找”符合现代汉语叙事表达。
- source_word: מִרְעֶה
  choice: 草场
  rationale: 指牲畜放牧、吃草之地；“草场”在现代汉语中自然明确。
- source_word: לְצֹאנָם
  choice: 为他们的羊群
  rationale: צֹאן可泛指绵羊、山羊等小型牲畜组成的群；“羊群”简洁，并避免限定为某一种羊。
