base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/038.yaml
  text: These[a], who were mentioned by name, were leaders in their clans[b], and their ancestral houses increased greatly.
translation:
  language: zh_hans
  text: 这些按名录入的人[a]，都是各宗族的首领；他们的父系家族大大增多[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些按名字前来的人。”希伯来语分词直译为“前来”，但在这里很可能指名字被录入或列在家谱中。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他们父亲的家扩展到众多。”这里可能是说这些父系家族的人数或规模大为增长。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些……的人
  rationale: 复数指示词承接前文家谱中列名的一群人；补出“人”符合现代汉语表达。
- source_word: הַבָּאִים בְּשֵׁמוֹת
  choice: 按名录入的人
  rationale: בוא 的分词本义为“来、进入”，与“按名字”连用并置于家谱语境时，较可能指名字被收入名录；译文既传达语境含义，也以脚注保留直译可能。
- source_word: נְשִׂיאִים
  choice: 首领
  rationale: 指宗族或群体中居领导地位的人；“首领”比“王子”更符合此处非王室语境。
- source_word: בְּמִשְׁפְּחוֹתָם
  choice: 各宗族的
  rationale: מִשְׁפָּחָה 在家谱语境中通常指比现代核心家庭更大的亲族单位；“各宗族的首领”自然表达其所属及领导关系。
- source_word: וּבֵית אֲבוֹתֵיהֶם
  choice: 他们的父系家族
  rationale: 该短语直译为“他们父亲的家”，指按父系构成的家族或祖系单位；“父系家族”在现代汉语中清楚而不显古奥。
- source_word: פָּרְצוּ
  choice: 大大增多
  rationale: 动词本有“冲破、扩展”之意，此处结合 לָרֹב 表示家族人口或规模显著增长。
- source_word: לָרֹב
  choice: 大大
  rationale: 表示达到众多、丰盛的程度；与“增多”结合，保留明显的数量增长意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述语体。“宗族”与“父系家族”分别表达 מִשְׁפָּחָה 和 בֵית אָבוֹת 两个相关但不完全相同的亲族层级；分号使首领身份与家族增长两个陈述清楚分开。
