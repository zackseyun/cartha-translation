lexical_decisions:
- source_word: שַׁלֻּם
  choice: 沙龙
  rationale: 人名按现代中文圣经中常见的音译形式处理，不翻译其可能的词义。
- source_word: בְּנוֹ
  choice: 他的儿子／……的儿子
  rationale: בֵּן 加第三人称阳性单数后缀，直译为“他的儿子”。中文为明确各代关系，后两处将代词所指展开为前一人名。
- source_word: מִבְשָׂם
  choice: 米比衫
  rationale: 人名采用中文音译；“衫”较贴近末尾 שָׂם 的音值。
- source_word: מִשְׁמָע
  choice: 米施玛
  rationale: 人名采用中文音译，不将其可能关联的词义带入正文。
