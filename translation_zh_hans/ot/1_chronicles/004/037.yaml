  yaml_path: translation/ot/1_chronicles/004/037.yaml
  text: and Ziza son of Shiphi[a], son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.
translation:
  language: zh_hans
  text: 还有细撒；他是示非的儿子，示非是亚龙的儿子，亚龙是耶大雅的儿子，耶大雅是申利的儿子，申利是示玛雅的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/זִיזָא
  choice: 还有细撒
  rationale: וְ承接上文的名单，译为“还有”；זִיזָא是人名，按现代中文圣经常见译名音译为“细撒”。
- source_word: בֶן
  choice: 是……的儿子
  rationale: 这是家谱中表示父子关系的固定用语。逐层重复，以清楚保留希伯来文的谱系结构。
- source_word: שִׁפְעִי
  choice: 示非
  rationale: 人名按现代中文圣经中通行且易辨识的形式音译。
- source_word: אַלּוֹן
  choice: 亚龙
  rationale: 此处是人名，不按同形普通名词“橡树”翻译，而采用音译。
- source_word: יְדָיָה
  choice: 耶大雅
  rationale: 采用现代中文圣经中通行且能反映希伯来文读音的音译。
- source_word: שִׁמְרִי
  choice: 申利
  rationale: 人名采用中文圣经中通行的音译形式。
- source_word: שְׁמַעְיָה
  choice: 示玛雅
  rationale: 人名采用现代中文读者较熟悉的圣经音译形式。
