source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
translation:
  language: zh_hans
  text: 雅比斯呼求以色列的神，说：“但愿你实实在在赐福给我[a]，扩张我的疆界，愿你的手与我同在，保守我远离灾祸[b]，使我不受痛苦！[c]”神就成全了他的祈求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“你若实实在在赐福给我……”。这个以“若”开头的句式没有明说结果，表达强烈的愿望或恳求。
    reason: grammatical_ambiguity
  - marker: b
    text: 或译“邪恶”。原文רָעָה既可指道德上的恶，也可指灾难或伤害；这里的上下文较倾向“灾祸”。
    reason: lexical_alternative
  - marker: c
    text: “不受痛苦”与上一节对“雅比斯”这个名字的解释相呼应。原文也有人理解为“不使我痛苦”或“不使我忧伤”。
    reason: cross_reference_and_ambiguity
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼求
  rationale: 这里描述向神祷告、求告，不只是一般意义上的“呼叫”；“呼求”准确而自然。
- source_word: אִם בָּרֵךְ תְּבָרֲכֵנִי
  choice: 但愿你实实在在赐福给我
  rationale: אִם引出的句式在此表达强烈愿望，而不只是普通条件；不定式绝对形与限定动词连用，加强“赐福”的语气。“实实在在”传达这一强调。
- source_word: וְהִרְבִּיתָ אֶת גְּבוּלִי
  choice: 扩张我的疆界
  rationale: גְּבוּל可指边界或边界以内的领土。“疆界”既保留土地边界的具体含义，也避免擅自抽象化为现代所谓“影响力”。
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  choice: 愿你的手与我同在
  rationale: 保留“你的手”这一希伯来语意象，所表达的是神的能力、帮助和同在；用“愿”使祈求语气在中文中清楚自然。
- source_word: וְעָשִׂיתָ מֵּרָעָה
  choice: 保守我远离灾祸
  rationale: 原文表达紧凑，רָעָה既可指道德上的恶，也可指灾难、伤害。下文提到痛苦，因此正文采用语境较适合的“灾祸”，并以脚注保留另一可能。
- source_word: לְבִלְתִּי עָצְבִּי
  choice: 使我不受痛苦
  rationale: עצב涉及疼痛、伤痛或忧苦，并与上一节对雅比斯名字的解释呼应。此译法自然表达祈求免受痛苦的意思，同时在脚注说明语法上的另一理解。
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  choice: 神就成全了他的祈求
  rationale: 这里“使……来到”的表达意为神使所求之事实现。“成全了他的祈求”符合现代中文习惯，并忠实传达神准其所求。
theological_decisions:
- issue: 雅比斯求扩张גְּבוּל的性质
  choice: 按土地疆界的通常含义译为“扩张我的疆界”
  alternative: 扩大我的影响范围
  rationale: 希伯来词首先指边界或领土。正文不把它灵意化为“影响力”，也不由此引申任何现代成功或富足神学。
- issue: 祈求中的רָעָה所指为何
  choice: 正文译作“灾祸”
  alternative: 邪恶
  rationale: 该词本身兼有道德之恶和有害灾难两方面含义；与“不受痛苦”相连时，“灾祸”更切合语境，但脚注保留“邪恶”这一真实可能。
- issue: אִם引导的未完整条件句
  choice: 在正文中以“但愿”表达强烈祈愿
  alternative: 你若实实在在赐福给我……
  rationale: 原文形式上以“若”开头，却没有明说结果句，可能是省略结句的誓愿式或强烈愿望。直译成中文会显得句子残缺，因此正文传达其语用功能，脚注保留其形式上的特点。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“呼求”“疆界”“与我同在”等措辞保留经文语体的尊严，又避免古奥表达；不加入繁荣神学、影响力扩张等原文未明说的解释。
