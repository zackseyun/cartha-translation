  rationale: 修订仅将“众子”调整为较自然的“儿子们”，并将“父祖”改为“父亲”，以保留希伯来文的单数用语和其未解的复数—单数张力。脚注继续说明家谱术语的较宽含义，不将基伊拉、以实提摩或相关族属预先限定为人物、地名或宗族。
