base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
translation:
  language: zh_hans
  text: 荷第雅的妻子，就是拿含的姊妹；她的儿子们[a]是迦米人基伊拉和玛迦人以实提摩的父亲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子们”在家谱中也可以泛指后裔，不一定只指亲生儿子。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译作“父亲”。这里复数的“儿子们”后面却接单数的“父”，可能是压缩的家谱说法；“父”也可指祖先、奠基者或宗族首领。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: 她的众子
  rationale: בנים的基本义是“儿子们”，在家谱中也可泛指后裔。译作“众子”保留复数及家谱用语，并以“她的”自然承接前面的“荷第雅的妻子”。
- source_word: אֵשֶׁת הוֹדִיָּה
  choice: 荷第雅的妻子
  rationale: 按构词关系直译，清楚表达婚姻关系；“荷第雅”采用常见中文圣经人名形式。
- source_word: אֲחוֹת נַחַם
  choice: 就是拿含的姐妹
  rationale: 该同位语进一步说明荷第雅妻子的身份；加入“就是”使现代汉语关系清楚，但不改变所指。
- source_word: אֲבִי
  choice: 父祖
  rationale: אבי字面为“父亲”，但在家谱语境中可指祖先、奠基者或宗族首领。此处复数主语“众子”后接单数形式“父”，关系高度压缩；“父祖”既保留父系源头的含义，又避免限定为直接生父。
- source_word: קְעִילָה הַגַּרְמִי
  choice: 迦米人基伊拉
  rationale: 保留专名与带冠词的宗族或族属称谓，不擅自判定基伊拉究竟是个人、宗族还是与地名有关的代表人物。
- source_word: וְאֶשְׁתְּמֹעַ הַמַּעֲכָתִי
  choice: 和玛迦人以实提摩
  rationale: וְ连接第二个并列名称；“玛迦人”保留其宗族或族属形容词的性质。
theological_decisions:
- issue: “众子”与单数“父”的不一致
  choice: 正文保留“众子”，并用集合性较强的“父祖”表达后面的家谱关系
  alternative: 将句子补写为“她的儿子中有……之父”，或把“众子”改作“后裔”
  rationale: 希伯来文本本身是复数主语后接单数“父”的压缩表达。正文不补出原文没有的具体世代或人数关系，以保留其真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的家谱文体。以分号划开人物身份说明和后续谱系关系；专名采用简体中文圣经中常见的译名。正文不强行消除原文复数“众子”与单数“父”之间的张力，并用脚注说明。
