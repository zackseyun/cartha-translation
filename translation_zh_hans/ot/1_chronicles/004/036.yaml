  text: and Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah.
translation:
  language: zh_hans
  text: 还有以利约乃、雅哥巴、约朔海、亚帅雅、亚底业、耶西篾和比拿雅。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְיוֹעֵינַי
  choice: 以利约乃
  rationale: 人名采用现代中文圣经读者较熟悉的传统音译，不翻译其词源含义。
- source_word: יַעֲקֹבָה
  choice: 雅哥巴
  rationale: 按希伯来语人名音译，并采用中文圣经中的通行形式。
- source_word: יְשׁוֹחָיָה
  choice: 约朔海
  rationale: 按希伯来语人名音译，并沿用较通行的中文形式。
- source_word: עֲשָׂיָה
  choice: 亚帅雅
  rationale: 按希伯来语人名音译，以区别于其他相近人名并保持中文传统辨识度。
- source_word: עֲדִיאֵל
  choice: 亚底业
  rationale: 按希伯来语人名音译；末尾“业”对应含神名成分的音节，不展开翻译其含义。
- source_word: יְשִׂימִיאֵל
  choice: 耶西篾
  rationale: 按希伯来语人名音译，采用中文圣经中较熟悉的形式。
- source_word: בְּנָיָה
  choice: 比拿雅
  rationale: 按希伯来语人名音译，采用中文圣经通行形式。
- source_word: וְ / וַ / וִ / וּ
  choice: 还有……、……和……
  rationale: 各名字前的连接词均为列举性的 waw。中文用“还有”承接上文，以顿号排列项目，并在末项前用“和”，自然表达其连续列举功能，避免机械重复“和”造成生硬。
