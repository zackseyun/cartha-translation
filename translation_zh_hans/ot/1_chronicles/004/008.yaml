base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/008.yaml
  text: Koz fathered Anub[a], Hazzobebah[b], and the families of Aharhel son of Harum.
translation:
  language: zh_hans
  text: 哥斯生了亚努布、哈琐比巴[a]，以及哈仑之子亚哈黑的诸家族[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“琐比巴”；若音译时不体现希伯来文人名前的冠词。
    reason: lexical_alternative
  - marker: b
    text: “诸家族”在这里也可译作“诸宗族”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹץ
  choice: 哥斯
  rationale: 按马所拉文本的辅音形式音译此人名；本节没有冠词，不采用相近的“哈哥斯”形式。
- source_word: הוֹלִ֔יד
  choice: 生了
  rationale: 使役形在家谱语境中表示生育或成为先祖；“生了”简洁自然，并保留原文的家谱关系。
- source_word: עָנ֖וּב
  choice: 亚努布
  rationale: 依希伯来语读音音译人名，并保留词尾辅音。
- source_word: הַ/צֹּבֵבָ֑ה
  choice: 哈琐比巴
  rationale: 音译时体现希伯来文前置冠词所带的 h 音；若不把冠词纳入人名，也可译作“琐比巴”，故列入脚注。
- source_word: וּ/מִשְׁפְּח֥וֹת
  choice: 以及……的各家族
  rationale: 在家谱名单中指由亲属关系构成的群体；“各家族”比“各宗族”更通俗，同时符合上下文。
- source_word: אֲחַרְחֵ֖ל
  choice: 亚哈黑
  rationale: 按希伯来语形式音译人名。
- source_word: בֶּן
  choice: 之子
  rationale: 以简洁庄重的现代汉语表达标准家谱关系。
- source_word: הָרֽוּם
  choice: 哈伦
  rationale: 依马所拉元音所示的人名形式音译；不采用反映另一读法的形式。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而通顺的现代汉语家谱体。人名以希伯来文本为依据音译；“以及”清楚连接最后一个并列成分，避免把“各家族”误解为仅与前一个人名相连。
