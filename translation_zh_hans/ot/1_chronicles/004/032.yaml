base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/032.yaml
  text: And their settlements were Etam[a], Ain, Rimmon, Tochen, and Ashan—five cities.
translation:
  language: zh_hans
  text: 他们的聚居地[a]是以坦、亚因、临门、陀健和亚珊，共五座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“村庄”。这里的希伯来词可指较小的聚落或有围墙的居住处。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: 他们的聚居地
  rationale: חָצֵר可指村庄、较小的聚落或有围墙的居住处。“聚居地”在现代汉语中自然且涵盖面较广，并保留它与本节末尾“城”之间的用词区别。
- source_word: עֵיטָם
  choice: 以坦
  rationale: 此处是地名，采用中文圣经传统中通行的音译。
- source_word: עַיִן
  choice: 亚因
  rationale: 上下文表明这是城邑名，而非“眼睛”或“泉源”的普通名词义，因此音译。
- source_word: רִמּוֹן
  choice: 临门
  rationale: 此处用作地名，按通行中文译名音译，不译作其普通名词义“石榴”。
- source_word: תֹכֶן
  choice: 陀健
  rationale: 此处是地名；采用通行中文圣经译名“陀健”。
- source_word: עָשָׁן
  choice: 亚珊
  rationale: 此处是地名，采用通行中文音译。
- source_word: עָרִים חָמֵשׁ
  choice: 共五座城
  rationale: עִיר通常指城或城镇；“五座城”简洁地保留原文对所列地点的总结和计数。
theological_decisions: []
