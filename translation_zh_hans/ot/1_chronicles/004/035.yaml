  text: and Joel[a], and Jehu son of Joshibiah, son of Seraiah, son of Asiel.
translation:
  language: zh_hans
  text: 还有约珥，以及约示比雅的儿子[a]耶户；约示比雅是西莱雅的儿子，西莱雅是亚薛的儿子。
