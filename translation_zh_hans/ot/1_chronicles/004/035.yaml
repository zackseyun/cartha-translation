  footnotes:
  - marker: a
    text: 希伯来语家谱中的“儿子”有时也可指较远的后裔；这里按家谱公式的字面意思译出。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: 还有／以及
  rationale: 连词承接上一节的人名名单；按现代汉语分别译作“还有”和“以及”，既保留并列关系，又避免连续重复“和”的生硬表达。
- source_word: יוֹאֵל
  choice: 约珥
  rationale: 人名采用现代简体中文圣经中通行且易辨认的音译。
- source_word: יֵהוּא
  choice: 耶户
  rationale: 人名采用现代简体中文圣经通行译名。
- source_word: בֶּן
  choice: 儿子
  rationale: 此处处于家谱公式中，按其直接、通常的亲子含义翻译；同时以脚注说明该词在某些家谱语境中也可泛指后裔。
- source_word: יֹשִׁבְיָה
  choice: 约示比雅
  rationale: 依希伯来语形式音译，并采用中文圣经中较通行的写法。
- source_word: שְׂרָיָה
  choice: 西莱雅
  rationale: 采用现代简体中文圣经中常见的人名音译。
- source_word: עֲשִׂיאֵל
  choice: 亚薛
  rationale: 采用现代简体中文圣经中常见且简洁的人名音译。
