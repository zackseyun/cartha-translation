base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/003.yaml
  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
translation:
  language: zh_hans
  text: 以坦之父[a]的儿子[b]如下：耶斯列、伊施玛和伊得巴；他们的姐妹名叫哈悉勒玻尼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父”在《历代志》的家谱用语中也可泛指祖先、宗族首领或某地的奠基者。
    reason: lexical_alternative
  - marker: b
    text: 原文没有“儿子”一词；此处按家谱语境补出。希伯来文的句法较为省略，直译近于“以下是以坦之父：耶斯列、伊施玛和伊得巴”。
    reason: textual_or_syntactical_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 如下
  rationale: 该短语用于引出家谱名单；译作“如下”自然地表达希伯来文的提示作用。
- source_word: אֲבִי עֵיטָם
  choice: 以坦之父
  rationale: 按构造形式直译，同时借脚注保留 אָב 在《历代志》家谱中也可指祖先、宗族首领或奠基者的可能性。
- source_word: יִזְרְעֶאל
  choice: 耶斯列
  rationale: 采用现代中文圣经语境中较通行的人名音译。
- source_word: יִשְׁמָא
  choice: 伊施玛
  rationale: 依希伯来语音译，并采用清楚、易读的现代中文写法。
- source_word: יִדְבָּשׁ
  choice: 伊得巴
  rationale: 依希伯来语音译。
- source_word: וְשֵׁם אֲחוֹתָם
  choice: 他们的姐妹名叫
  rationale: 准确保留复数领属后缀“他们的”；אחות 本身不说明长幼，因此不用“妹子”。
- source_word: הַצְלֶלְפּוֹנִי
  choice: 哈悉勒玻尼
  rationale: 采用中文圣经传统中可辨识的音译形式；该词是女性专名，不按词源意译。
theological_decisions:
- issue: אֲבִי עֵיטָם 与随后三个人名之间的句法关系
  choice: 正文译作“以坦之父的儿子如下”，把三人理解为“以坦之父”的儿子，并以脚注说明“儿子”是按上下文补出。
  alternative: 直译为“以下是以坦之父：耶斯列、伊施玛和伊得巴”，或将三人称为“以坦之祖”。
  rationale: 马所拉文本表面上以单数“以坦之父”连接三个名字，句法显得省略或不规则。正文需要成为可理解的现代汉语，但不应掩盖原文未明说“儿子”这一事实，故以脚注保留文本张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“姐妹”不擅自判定长幼；专名以中文圣经读者较熟悉的形式音译。正文以最少量的补词使句子通顺，并用脚注明示补词及原文歧义。
