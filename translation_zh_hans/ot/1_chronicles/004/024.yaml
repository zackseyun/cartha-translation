  yaml_path: translation/ot/1_chronicles/004/024.yaml
  text: 'The sons of Simeon: Nemuel[a], Jamin, Jarib, Zerah[c][b], and Shaul.'
translation:
  language: zh_hans
  text: 西缅的儿子是尼母利[a]、雅悯、雅立、谢拉[b]和扫罗[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在《创世记》46:10的平行家谱中，此名作“耶母利”；本节希伯来文本作“尼母利”。
    reason: alternative_reading
  - marker: b
    text: 在《创世记》46:10和《出埃及记》6:15的平行家谱中，此名作“琐辖”。
    reason: textual_variant
  - marker: c
    text: “扫罗”是希伯来名Shaul（שָׁאוּל）的通行中文译名；英语中常作Saul。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是“儿子”的复数附属形式，用来引出家谱中的人名；本节列举的是西缅的几个儿子，因此不泛化为“后代”。
- source_word: שִׁמְעוֹן
  choice: 西缅
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: נְמוּאֵל
  choice: 尼母利
  rationale: 按本节希伯来文本所见形式音译，并与平行家谱中的异名“耶母利”加以区分。
- source_word: וְיָמִין
  choice: 雅悯
  rationale: 人名采用中文通行译法；希伯来语连词在中文列举结构中不逐字置于此名之前，而在末项前用“和”自然表达。
- source_word: יָרִיב
  choice: 雅立
  rationale: 按中文圣经传统音译此人名，不翻译其可能具有的词义。
- source_word: זֶרַח
  choice: 谢拉
  rationale: 依本节希伯来文本 זֶרַח 采用通行音译；平行家谱中的“琐辖”保留在脚注中。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文读者熟悉的传统译名；其更贴近希伯来语读音的形式在脚注中说明。
