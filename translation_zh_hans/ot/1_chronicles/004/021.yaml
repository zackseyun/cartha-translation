base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
translation:
  language: zh_hans
  text: 犹大之子示拉的子孙是：利迦之父珥，玛利沙之父拉大，以及亚实比家的细麻布工匠各宗族。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句的希伯来文十分简略，也可译作：“以及在伯亚实比从事细麻布工作的各宗族。”本节的“父”也可指始祖或创立者。
    reason: 说明压缩句法、专名切分和族谱称谓所保留的多义性。
lexical_decisions:
- source_word: בְּנֵי שֵׁלָה בֶן יְהוּדָה
  choice: 犹大之子示拉的子孙
  rationale: בְּנֵי 字面为“儿子们”，但下文包括宗族和行业群体；中文用“子孙”既符合族谱语境，也避免误解为仅指亲生儿子，同时保留“犹大之子”所明示的父子关系。
- source_word: עֵר אֲבִי לֵכָה
  choice: 利迦之父珥
  rationale: 保留 אֲבִי 的“父”这一形式，不擅自判定利迦是人名、地方名或宗族名；在此类族谱中也可指始祖或奠基者。
- source_word: לַעְדָּה אֲבִי מָרֵשָׁה
  choice: 玛利沙之父拉大
  rationale: 按希伯来语结构直译，并保留“父”可能兼指祖先或创立者的语义张力。
- source_word: מִשְׁפְּחוֹת
  choice: 各宗族
  rationale: 此词在支派谱系中指扩展的亲族群体，“宗族”比现代日常意义的“家庭”更准确。
- source_word: בֵּית עֲבֹדַת הַבֻּץ
  choice: 细麻布工匠
  rationale: 原短语高度压缩，涉及“家/群体”与“细麻布的工作”；结合前面的“各宗族”，译为“细麻布工匠”可自然表达其行业群体性质。בּוּץ 通常指优质或细致的麻布。
- source_word: לְבֵית אַשְׁבֵּעַ
  choice: 亚实比家的
  rationale: לְבֵית 最自然地表达归属某一“家”；不将 אַשְׁבֵּעַ 强行判定为地点，从而保留其可能是家族名或人名的开放性。
theological_decisions: []
