  yaml_path: translation/ot/1_chronicles/004/013.yaml
  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
translation:
  language: zh_hans
  text: 基纳斯的儿子是俄陀聂和西莱雅；俄陀聂的儿子是哈塔。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְנַז
  choice: 基纳斯的儿子
  rationale: בְנֵי 是 בֵּן 的复数构造形式，在家谱中直译为“……的儿子”最清楚；句首的 וּ 在此承接上文，中文另起家谱条目时不必机械译作“和”。人名 קְנַז 采用现代中文圣经中通行的译名“基纳斯”。
- source_word: עָתְנִיאֵל
  choice: 俄陀聂
  rationale: 专名采用现代中文圣经中通行且易辨认的译名。
- source_word: וּשְׂרָיָה
  choice: 和西莱雅
  rationale: 保留前缀 וּ 的并列作用；שְׂרָיָה 按其希伯来文读音并参照中文通行译名译作“西莱雅”。
- source_word: וּבְנֵי עָתְנִיאֵל
  choice: 俄陀聂的儿子
  rationale: 重复的家谱公式仍译作“……的儿子”；中文以分号自然表达两代之间的承接关系，无须另加“和”。
- source_word: חֲתַת
  choice: 哈塔
  rationale: 按希伯来文专名音译，并采用简洁自然的现代汉语形式。
