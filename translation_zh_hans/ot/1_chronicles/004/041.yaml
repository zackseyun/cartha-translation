  text: וַ/יָּבֹ֡אוּ אֵלֶּה֩ הַ/כְּתוּבִ֨ים בְּ/שֵׁמ֜וֹת בִּ/ימֵ֣י יְחִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה וַ/יַּכּ֨וּ אֶת אָהֳלֵי/הֶ֜ם וְ/אֶת ה/מעינים אֲשֶׁ֤ר נִמְצְאוּ שָׁ֨מָּ/ה֙ וַ/יַּחֲרִימֻ/ם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יֵּשְׁב֖וּ תַּחְתֵּי/הֶ֑ם כִּֽי מִרְעֶ֥ה לְ/צֹאנָ֖/ם שָֽׁם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
translation:
  language: zh_hans
  text: 这些名字载在名册上的人，在犹大王希西家在位的时候来到，袭击了他们的帐棚和在那里发现的米乌尼人[a]，把他们尽行毁灭，直到今日。于是他们住在那些人的地方，因为那里有牧场可供他们的羊群放牧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米乌尼人”所对应的希伯来语形式含义不确定。传统上把它理解为一个族名；也有人理解为“住处”或“居所”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  choice: 按名录记的人
  rationale: 该被动分词短语指名字被登记在名册或家谱中的人；此译法自然地保留其登记、造册的含义。
- source_word: וַיָּבֹאוּ
  choice: 来到那里
  rationale: בוא 的基本义为“来、到达”；补出“那里”使现代汉语叙事流畅，同时与后文地点相呼应。
- source_word: וַיַּכּוּ
  choice: 击杀
  rationale: נכה 在军事叙事中表示猛烈攻击、击败或杀死；“击杀”保留原文的暴力强度，但不额外说明具体方式。
- source_word: אָהֳלֵיהֶם
  choice: 他们的帐棚居民
  rationale: 原文直译为“他们的帐棚”，但“击打帐棚”在此借居所指其中的人；译出“帐棚居民”能在现代汉语中清楚表达语境中的攻击对象，同时保留半游牧背景。
- source_word: המעינים
  choice: 米乌尼人
  rationale: 这一疑难形式传统上可视为族名，在“在那里发现的”这一语境中也适合作为人群理解；其他可能解释列入脚注。
- source_word: אֲשֶׁר נִמְצְאוּ שָׁמָּה
  choice: 在那里发现的
  rationale: 与将前词理解为族名相配，关系从句自然地修饰“米乌尼人”。
- source_word: וַיַּחֲרִימֻם
  choice: 把他们尽行毁灭
  rationale: חרם 的使役形在此指将对象置于当毁灭的状态并予以毁灭；此译法兼顾其强烈、近乎术语性的含义与现代汉语可读性。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是该希伯来语时间套语在庄重现代汉语中的自然表达。
- source_word: וַיֵּשְׁבוּ תַּחְתֵּיהֶם
  choice: 他们取代那些人住在那里
  rationale: תַּחְתֵּי 与人连用时可表示“代替、取而代之”；译文明确表达原居民被替代后的定居。
- source_word: מִרְעֶה לְצֹאנָם
  choice: 有草场可供他们的羊群放牧
  rationale: מִרְעֶה 指牧场或可放牧之地，צֹאן 可泛指绵羊和山羊组成的羊群；此译自然且范围恰当。
theological_decisions:
- issue: חרם 所表达的毁灭行为
  choice: 把他们尽行毁灭
  alternative: 把他们置于禁令之下／彻底消灭他们
  rationale: 译文保留原文行为的彻底性及其特殊语义色彩，却不添加原文未明说的神学动机，也不以教派术语解释该行为。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“按名录记的人”保留行政登记意味；“尽行毁灭”维持经文的强烈语气。脚注标记置于真正有文本疑难的“米乌尼人”之后。
