revisions:
- from: 这些按名录记的人，在犹大王希西家的日子来到那里，击杀了他们的帐棚居民和在那里发现的米乌尼人[a]，把他们尽行毁灭，直到今日。随后，他们取代那些人住在那里，因为那里有草场可供他们的羊群放牧。
  to: 这些名字载在名册上的人，在犹大王希西家在位的时候来到，袭击了他们的帐棚和在那里发现的米乌尼人[a]，把他们尽行毁灭，直到今日。于是他们住在那些人的地方，因为那里有牧场可供他们的羊群放牧。
