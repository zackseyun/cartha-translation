base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/006.yaml
  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
translation:
  language: zh_hans
  text: 拿拉给他生了亚户撒、希弗、提幔尼[a]和哈阿哈施他利[b]。这些人是拿拉的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提幔尼”也可能理解为带形容词含义的称呼，如“提幔人”或“南方人”；但在这份家谱中，本译本将其按人名音译。
    reason: lexical_alternative
  - marker: b
    text: “哈阿哈施他利”也可音译为“亚哈施他利”。希伯来文形式带有前置定冠词；这一定冠词可能已经固定成为名字的一部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: 该动词在家谱出生记载中表示“生育”；“生了”简洁自然，并保留女性主语。
- source_word: לוֹ
  choice: 给他
  rationale: 介词ל加第三人称阳性单数后缀在此指出家谱中的男性一方；译作“给他”保留原文关系的简略性，不进一步认定婚姻等关系。
- source_word: נַעֲרָה
  choice: 拿拉
  rationale: 作为女性人名音译；本节首尾采用同一译名。
- source_word: אֲחֻזָּם
  choice: 亚户撒
  rationale: 按希伯来语辅音和元音作适合现代普通话的音译。
- source_word: חֵפֶר
  choice: 希弗
  rationale: 作为人名音译，并与常见圣经中文译名习惯协调。
- source_word: תֵּימְנִי
  choice: 提幔尼
  rationale: 该形式虽可能带有形容词或族属含义，但在本家谱名单中最自然地充当人名，故音译并用脚注保留歧义。
- source_word: הָאֲחַשְׁתָּרִי
  choice: 哈亚哈施他利
  rationale: 音译时保留希伯来语形式开头的定冠词成分הָ，以免无依据地将其从名字中删去；另一种不含该成分的音译见脚注。
- source_word: אֵלֶּה בְּנֵי נַעֲרָה
  choice: 这些人是拿拉的儿子
  rationale: 直译家谱总结句；בְּנֵי明确指男性后代，故译作“儿子”，不泛化为“孩子”或“后裔”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述。“给他生了”紧贴原文，却不补出上文男子的姓名或拿拉与他的具体关系。人名按现代普通话音译；脚注标记均置于相关名字之后。
