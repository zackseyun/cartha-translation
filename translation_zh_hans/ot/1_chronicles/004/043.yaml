source:
  edition: WLC
  text: וַ/יַּכּ֕וּ אֶת שְׁאֵרִ֥ית הַ/פְּלֵטָ֖ה לַ/עֲמָלֵ֑ק וַ/יֵּ֣שְׁבוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/043.yaml
  text: And they struck down the remnant of the survivors of Amalek[b][a], and they lived there to this day.
translation:
  language: zh_hans
  text: 他们击杀了亚玛力人中残存的逃脱者[a]，并在那里居住[b]，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“亚玛力人中逃脱后剩下的人”。希伯来原文连用两个意义相近的词，强调他们是在毁灭后残留下来的。
    reason: lexical_alternative
  - marker: b
    text: “居住”也可译作“定居”。该动词既可泛指住在某处，也可指在当地安顿下来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: 击杀了
  rationale: נכה在此为连续叙事形式，处于军事行动语境；“击杀”自然表达打击并消灭这些余民的含义，同时避免扩写具体方式。
- source_word: שְׁאֵרִית הַפְּלֵטָה
  choice: 残存的逃脱者
  rationale: 原文将“余剩之人”和“逃脱者”两个意义相近的名词结合使用；此译保留“残存”与“逃脱者”两层意思，也符合现代汉语表达。
- source_word: לַעֲמָלֵק
  choice: 亚玛力人中
  rationale: “亚玛力”在这里指该族群；译作“亚玛力人中”清楚表明这些逃脱者的族属，并与前面的“残存”自然衔接。
- source_word: וַיֵּשְׁבוּ
  choice: 居住
  rationale: ישב可表示坐、居住或定居；“居住”保留其基本含义，不强行判定经文着重暂住还是占地定居。
- source_word: שָׁם
  choice: 在那里
  rationale: 忠实表达地点副词，回指上文所述之地。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是希伯来叙事中常见的时间表达，指该状态延续到叙述者所处的时代。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“残存的逃脱者”有意保留原文近义词叠加所形成的强调；“居住”则保留ישב在“居住”与“定居”之间的语义空间。所有脚注标记均置于对应词语之后。
