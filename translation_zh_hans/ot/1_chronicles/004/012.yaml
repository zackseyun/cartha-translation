  text: וְ/אֶשְׁתּ֗וֹן הוֹלִ֞יד אֶת בֵּ֤ית רָפָא֙ וְ/אֶת פָּסֵ֔חַ וְ/אֶת תְּחִנָּ֖ה אֲבִ֣י עִ֣יר נָחָ֑שׁ אֵ֖לֶּה אַנְשֵׁ֥י רֵכָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
translation:
  language: zh_hans
  text: 伊施屯生了伯拉巴、巴西亚和提欣拿；提欣拿是伊珥拿辖之父[a]。这些是利迦人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父”也可指祖先或一地、一族的创立者；“伊珥拿辖”可能意为“拿辖城”，但这里很可能是地名。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: 生了
  rationale: 该词在家谱语境中表示生育或使后裔延续；“生了”是现代汉语家谱表述中自然、简洁的说法。
- source_word: בֵּית רָפָא
  choice: 伯拉巴
  rationale: 上下文将其与其他人名并列，宜视为专名音译，而不按字面译作“拉巴之家”。
- source_word: פָּסֵחַ
  choice: 巴西亚
  rationale: 作为专名音译，并采用中文圣经传统中较易辨认的形式。
- source_word: תְּחִנָּה
  choice: 提欣拿
  rationale: 此处是专名，不按该词在其他语境中可能具有的“恳求”之义翻译。
- source_word: אֲבִי עִיר נָחָשׁ
  choice: 伊珥拿辖之父
  rationale: 保留希伯来文“父”的家谱表达及其可能涵盖生父、祖先或创立者的语义幅度；“伊珥拿辖”按此处专名语境音译。
- source_word: אֵלֶּה אַנְשֵׁי רֵכָה
  choice: 这些是利迦人
  rationale: אַנְשֵׁי 可指属于某家族或地方的人；简洁译法既保留归属关系，也符合现代汉语。
- source_word: רֵכָה
  choice: 利迦
  rationale: 作为家族名或地名音译，不对其含义作无根据的具体化。
