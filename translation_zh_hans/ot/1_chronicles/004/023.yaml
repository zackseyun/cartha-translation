base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/023.yaml
  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
translation:
  language: zh_hans
  text: 这些人是陶匠，也是尼他应和基低拉[a]的居民；他们在那里与王同住，为王做工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可能译作：“这些人是陶匠，是住在栽种之地和围场中的人。”希伯来语中的“尼他应”和“基低拉”既可理解为地名，也可分别理解为“栽种之地”和“围墙、围场”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: 这些人是
  rationale: 指回前文家谱中所列的人；希伯来文为无系词的辨认句，现代汉语自然补出“是”。
- source_word: הַיּוֹצְרִים
  choice: 陶匠
  rationale: 源自动词“塑造”，在此通常指以泥土制器的工匠；“陶匠”既具体，也符合本节的职业语境。
- source_word: וְיֹשְׁבֵי
  choice: 也是……的居民
  rationale: 分词构造表示定居者；用“居民”保留其名词性，并以“也是”自然连接前一身份。
- source_word: נְטָעִים
  choice: 尼他应
  rationale: 在家谱和地理名单的语境中，较可能是地名；但该词也可作普通名词“栽种之地”，故以脚注保留歧义。
- source_word: וּגְדֵרָה
  choice: 和基低拉
  rationale: 与前一词并列，较可能是地名；也可理解为普通名词“围墙、围场”，故不在正文中排除另一读法。
- source_word: עִם הַמֶּלֶךְ
  choice: 为王
  rationale: 原义为“与王同在/和王一起”；结合“他的工作”，这里表达与王关联并为其效力。汉语“为王做工”自然传达这一关系，而不过度具体化为某种官职。
- source_word: בִּמְלַאכְתּוֹ
  choice: 做工
  rationale: מְלָאכָה 可指工作、事务或劳役，第三人称后缀指王；“为王做工”是自然现代汉语，并保留工作性质未明的宽泛含义。
- source_word: יָשְׁבוּ שָׁם
  choice: 他们住在那里
  rationale: ישב 与“那里”合用表示居住或定居；此译简洁、现代，并保留地点回指。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“陶匠”保留职业的具体性；正文按较可能的地名理解翻译，并用脚注完整保留两个希伯来词作为普通名词解读的真实歧义。
