base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/004.yaml
  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
translation:
  language: zh_hans
  text: 毗努伊勒[a]是基多之父[b]，以谢是户沙之父[b]。他们二人都是户珥的儿子；户珥是以法他的长子，也是伯利恒之父[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毗努伊勒”在其他一些经文中写作“毗尼伊勒”；这是同一名字的变体形式。
    reason: lexical_alternative
  - marker: b
    text: 这里的“父”在家谱语境中也可指“始祖”或“创建者”，尤其在与城镇或宗族相连时。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנוּאֵל
  choice: 毗努伊勒
  rationale: 按本节希伯来语辅音形式音译为人名；其他经文所见的变体形式在脚注中说明。
- source_word: אֲבִי
  choice: ……之父
  rationale: 保留希伯来家谱用语及其关系上的开放性；在涉及城镇或宗族时，也可能指始祖、创建者或首领，因此以脚注说明。
- source_word: גְדֹר
  choice: 基多
  rationale: 作为地名或宗族名，采用通行的中文音译。
- source_word: עֵזֶר
  choice: 以谢
  rationale: 人名，采用通行的中文音译。
- source_word: חוּשָׁה
  choice: 户沙
  rationale: 作为地名或宗族名，采用中文音译。
- source_word: אֵלֶּה בְנֵי
  choice: 他们二人都是……的儿子
  rationale: 希伯来语为无系词名词句；中文补出判断表达，并以“二人”明确回指毗努伊勒和以谢。
- source_word: חוּר
  choice: 户珥
  rationale: 人名，采用通行的中文音译。
- source_word: בְּכֹר
  choice: 长子
  rationale: 准确表达户珥相对于以法她的长子身份，不额外扩展其含义。
- source_word: אֶפְרָתָה
  choice: 以法她
  rationale: 专名，采用通行的中文音译，不在正文中判定其为个人、宗族或地域名称。
- source_word: בֵּית לָחֶם
  choice: 伯利恒
  rationale: 采用该地名的通行中文译名，不按字面译作“粮食之家”。
theological_decisions:
- issue: “父”（אֲבִי）与城镇或宗族名称之间的关系
  choice: 正文保留“……之父”
  alternative: 译作“……的始祖”“……的创建者”或“……的首领”
  rationale: 原文用同一词描述毗努伊勒与基多、以谢与户沙、户珥与伯利恒的关系，其具体关系未被限定；保留直译并加脚注可避免把家谱、宗族和聚落之间的关系解释得过窄。
- issue: “以法她”（אֶפְרָתָה）的身份
  choice: 仅作专名处理
  alternative: 明确译成女性个人、宗族或地域
  rationale: 本节语法说明户珥是“以法她的长子”，但专名本身在此未明确标示其类别，故不在译文中补入解释。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述语体。用分号拆分较长的并列结构，使修饰关系清楚；保留“……之父”这一较正式的表达，以对应原文反复出现的家谱术语。
