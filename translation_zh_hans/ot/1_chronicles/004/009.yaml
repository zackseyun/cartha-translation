base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
translation:
  language: zh_hans
  text: 雅比斯比他的弟兄更受尊重。他母亲给他起名叫雅比斯[a]，说：“因为我在痛苦中生了他[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅比斯”这个名字的读音，使人联想到他母亲解释中表示“痛苦”或“忧苦”的希伯来语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为我在忧苦中生了他。”希伯来语 עֹצֶב 可表示疼痛、忧伤或艰苦。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: 雅比斯……
  rationale: 该叙事形式引出关于雅比斯的陈述。现代汉语无需另加“现在”或沿用古雅的“事情是这样”，直接起句更自然。
- source_word: יַעְבֵּץ
  choice: 雅比斯
  rationale: 按常用圣经人名音译处理；名字在本节重复出现，并与母亲所说的“痛苦／忧苦”形成希伯来语语音联系。
- source_word: נִכְבָּד מֵאֶחָיו
  choice: 比他的弟兄更受尊重
  rationale: נכבד 表示有分量、受尊崇；מן 在此表达比较。“更受尊重”保留其比较意义，也避免把原文无根据地限定为内在品格上的“更高尚”。
- source_word: וְאִמּוֹ קָרְאָה שְׁמוֹ
  choice: 他母亲给他起名叫
  rationale: 原文直译为“他母亲叫他的名字”，现代汉语用“给他起名叫”自然地保留命名公式的含义。
- source_word: לֵאמֹר
  choice: 说
  rationale: 用于引出母亲对命名缘由的说明，是现代汉语中简洁自然的表达。
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出起名的原因，因果意义明确。
- source_word: יָלַדְתִּי
  choice: 我……生了他
  rationale: 该动词表示生育；“他”虽未在希伯来文中明说，却由语境清楚蕴含，在汉语中补出可使句意完整自然。
- source_word: בְּעֹצֶב
  choice: 在痛苦中
  rationale: עֹצֶב 可指身体疼痛、忧伤或艰苦；分娩语境支持“痛苦”，同时以脚注保留“忧苦”的可能含义。
theological_decisions: []
