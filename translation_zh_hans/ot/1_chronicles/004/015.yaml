base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/015.yaml
  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
translation:
  language: zh_hans
  text: 耶孚尼的儿子迦勒的儿子[a]是以路、以拉和拿安；以拉的儿子是基纳斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子”在家谱中有时也可泛指“后代”；不过，本节直接列出名字，更适合译作“儿子”。
    reason: 说明בְּנֵי在家谱语境中的词义范围，同时不把较宽泛的含义写入正文。
lexical_decisions:
- source_word: וּבְנֵי כָּלֵב בֶּן יְפֻנֶּה
  choice: 耶孚尼的儿子迦勒所生的儿子
  rationale: בְּנֵי 在此家谱中最直接指“儿子”；用“所生的儿子”使“耶孚尼的儿子”与迦勒之子的层级关系清楚，同时保留原文两次“儿子”的家谱结构。
- source_word: כָּלֵב
  choice: 迦勒
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: יְפֻנֶּה
  choice: 耶孚尼
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: עִירוּ
  choice: 以路
  rationale: 按希伯来语专名 עִירוּ 音译，并采用中文圣经常见形式。
- source_word: אֵלָה
  choice: 以拉
  rationale: 上下文表明这是人名；按希伯来语读音采用通行音译。
- source_word: נָעַם
  choice: 拿安
  rationale: 马所拉元音支持阳性人名 Nāʿam，并非拿玛；据其读音音译。
- source_word: וּבְנֵי אֵלָה
  choice: 以拉的儿子
  rationale: 保留原文引出以拉家族支系的家谱结构。
- source_word: וּקְנַז
  choice: 基纳斯
  rationale: 连接词 וּ 在中文列名结构中无需另译；קְנַז 采用通行人名译法“基纳斯”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免“耶孚尼的儿子迦勒的儿子”连续属格造成歧义，以“所生的儿子”明确家谱层级；分号对应原文从迦勒诸子转入以拉支系的结构。
