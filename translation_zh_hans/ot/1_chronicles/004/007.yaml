base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/007.yaml
  text: 'And the sons of Helah: Zereth[a], Izhar[b], and Ethnan.'
translation:
  language: zh_hans
  text: 赫拉的儿子[a]是策列特、伊茨哈尔和埃特南。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 家谱中的“儿子”既可指亲生儿子，也可泛指后裔或同一宗族支系中的成员。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: 的儿子是
  rationale: בְנֵי是家谱中常见的“……的儿子”结构；句首连接词וּ承接上文，在中文家谱列表中不必机械译作“并且”，以免表达生硬。
- source_word: חֶלְאָה
  choice: 赫拉
  rationale: 这是人名，按希伯来语读音音译；不赋予词义解释。
- source_word: צֶרֶת
  choice: 策列特
  rationale: 这是人名，按马所拉文本的辅音和元音音译。
- source_word: יצחר
  choice: 伊茨哈尔
  rationale: 这是人名；依所给WLC文本的辅音形式音译，不凭其他译本改换为另一个名字。
- source_word: וְאֶתְנָן
  choice: 和埃特南
  rationale: 前缀וְ连接名单中的最后一人，中文自然译作“和”；专名אֶתְנָן按音译为“埃特南”。
theological_decisions:
- issue: 家谱用语“儿子”的范围
  choice: 正文保留“儿子”，脚注说明其范围可能较广
  alternative: 直接译作“后代”
  rationale: 希伯来语בְנֵי字面为“儿子”，但家谱语境中也可能指较广的男性后裔或宗族成员；保留正文形式并加注，既忠实又不把亲属层级说死。
translation_notes:
  register: 采用现代、简洁而庄重的家谱文体。专名依希伯来语形式音译；不沿用英语拼写所特有的转写习惯。
