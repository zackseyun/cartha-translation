  yaml_path: translation/ot/1_chronicles/004/020.yaml
  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
translation:
  language: zh_hans
  text: 示门的儿子有暗嫩、林拿、便哈南[a]和提伦。以施的儿子有琐黑和便琐黑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “便哈南”也可理解为“哈南的儿子”；但在这份家谱名单中，较可能是一个人名。
    reason: lexical_alternative
  - marker: b
    text: “便琐黑”也可理解为“琐黑的儿子”；但在这份家谱名单中，较可能是一个人名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁימוֹן
  choice: 示门的儿子
  rationale: בְנֵי 是 בֵּן 的复数构造形，在家谱中引出后代名单；句首连接词按自然汉语不另译。שִׁימוֹן 按希伯来语读音译作“示门”，与传统译名“西缅”有别。
- source_word: אַמְנוֹן וְרִנָּה
  choice: 暗嫩、林拿
  rationale: 两者均作为人名音译；希伯来语连接词在汉语名单中以顿号体现，末项前再用“和”。
- source_word: בֶּן חָנָן
  choice: 便哈南
  rationale: 在连续的人名名单中，整体较可能是复合人名，而不是另起一个“哈南的儿子”关系说明；仍以脚注保留后一种可能。
- source_word: וְתולון
  choice: 和提伦
  rationale: 作为人名音译；抄本辅音写法与马所拉读音所指的人名在此按“提伦”处理。
- source_word: וּבְנֵי יִשְׁעִי
  choice: 亦示的儿子
  rationale: 重复家谱公式，直译“儿子”；连接词通过另起一句自然体现。יִשְׁעִי 音译为“亦示”。
- source_word: זוֹחֵת
  choice: 琐黑
  rationale: 作为专名音译。
- source_word: וּבֶן זוֹחֵת
  choice: 和便琐黑
  rationale: 因 בֶן 后没有再出现另一个作为儿子名字的专名，在名单结构中整体读作人名较顺；脚注保留“琐黑的儿子”的句法可能。
