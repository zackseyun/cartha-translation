  text: וּ/לְ/שִׁמְעִ֞י בָּנִ֨ים שִׁשָּׁ֤ה עָשָׂר֙ וּ/בָנ֣וֹת שֵׁ֔שׁ וּ/לְ/אֶחָ֕י/ו אֵ֖ין בָּנִ֣ים רַבִּ֑ים וְ/כֹל֙ מִשְׁפַּחְתָּ֔/ם לֹ֥א הִרְבּ֖וּ עַד בְּנֵ֥י יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
translation:
  language: zh_hans
  text: 示每有十六个儿子和六个女儿；他的弟兄却没有许多儿子，他们整个宗族的人数也没有增多到犹大子孙那样多。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们整个宗族也没有像犹大子孙那样人数众多。”
    reason: 原文 לֹא הִרְבּוּ עַד 可表达“没有增多到……的程度”，也可自然理解为“没有像……那样众多”。
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  choice: 示每有
  rationale: 介词 לְ 与人物构成所有关系，意为“示每有……”。“示每”采用该人名通行的中文圣经译名。
- source_word: בָּנִים שִׁשָּׁה עָשָׂר וּבָנוֹת שֵׁשׁ
  choice: 十六个儿子和六个女儿
  rationale: 按现代汉语语序排列数量词和名词，完整保留原文的人数与并列关系。
- source_word: וּלְאֶחָיו אֵין בָּנִים רַבִּים
  choice: 他的弟兄却没有许多儿子
  rationale: אֵין 与介词短语表达缺少或没有；连接词 וּ 在此引出与示每子女众多相对的情况，译作“却”自然呈现语篇对比。
- source_word: וְכֹל מִשְׁפַּחְתָּם
  choice: 他们整个宗族的人数
  rationale: מִשְׁפָּחָה 在族谱语境中指较大的亲族群体，故译“宗族”而非现代意义较窄的“家庭”；“人数”为汉语中承接下文数量增长所补出的语义成分。
- source_word: לֹא הִרְבּוּ
  choice: 没有增多
  rationale: רבה 的使役形在此表示人数增加或变得众多；“没有增多”既贴近词形，又符合族谱人口语境。
- source_word: עַד בְּנֵי יְהוּדָה
  choice: 到犹大子孙那样多
  rationale: עַד 在此表示程度或界限，即没有达到犹大后裔的人数规模；“犹大子孙”保留 בְּנֵי 的族谱含义。
theological_decisions: []
