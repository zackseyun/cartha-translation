base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/022.yaml
  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
translation:
  language: zh_hans
  text: 还有约敬、哥西巴人、约阿施、萨拉弗——他们曾在摩押掌权[a]——以及雅叔比利恒[b]。这些记载源自古时[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他们占有摩押”“他们作摩押的主人”，或可能指“他们与摩押人通婚”。希伯来语这一短语简略，含义不确定。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语含义不确定。也可理解为“又回到利恒”；有些译法将该地与伯利恒联系起来。
    reason: alternative_reading
  - marker: c
    text: 也可译作“这些事情是古时的”或“这些话出自古时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  choice: 约敬
  rationale: 按希伯来语音译为人名，并采用现代中文圣经人名常见的简洁形式。
- source_word: אַנְשֵׁי כֹזֵבָא
  choice: 哥西巴人
  rationale: אַנְשֵׁי 是“……的人／男子”的复数附属形式，כֹזֵבָא 在此为地名；中文用“哥西巴人”自然表达其所属关系，而不额外扩大为不受性别限制的群体称谓。
- source_word: יוֹאָשׁ
  choice: 约阿施
  rationale: 作为家谱中的人名，按通行中文形式音译。
- source_word: שָׂרָף
  choice: 萨拉弗
  rationale: 上下文表明这是人名，因此音译，不按同形普通名词译作“燃烧者”等。
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  choice: 他们曾在摩押掌权
  rationale: בעל 在此可能表示作主、掌权或占有；“在摩押掌权”较自然地传达身份或统治关系，同时以脚注保留原文的简略与不确定性。关系从句在句法上最自然地承接紧邻的约阿施和萨拉弗。
- source_word: יָשֻׁבִי לָחֶם
  choice: 雅叔比利恒
  rationale: 马所拉元音所示的 יָשֻׁבִי 更像专名，而非通常表示“他们返回”的动词形式；因此正文把整个表达按复合人名处理，同时在脚注保留将其理解为返回利恒或伯利恒的可能。
- source_word: הַדְּבָרִים עַתִּיקִים
  choice: 这些记载源自古时
  rationale: דְּבָרִים 可指话语、事情或所记内容；在家谱史料语境中，“记载”贴切。עַתִּיקִים 表示古老或出自久远年代，“源自古时”既自然又不把原文明确限定为某种书面档案。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留家谱式列举，并用破折号界定关系从句，避免误读为所有列名者都在摩押掌权。专名采用简体中文音译；对本节三个著名疑难短语均不强行消除歧义，而在脚注列出主要可能。
