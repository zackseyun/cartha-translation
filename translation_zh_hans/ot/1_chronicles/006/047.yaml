- from: 给革舜的子孙[a]，按他们的宗族，从以萨迦支派、亚设支派、拿弗他利支派，以及巴珊境内的玛拿西支派[b]，共分了十三座城。
  to: 革舜的子孙[a]按他们的宗族，从以萨迦支派、亚设支派、拿弗他利支派，以及巴珊境内的玛拿西支派[b]得了十三座城。
  rationale: 仅将为使汉语句子完整而补出的“共分了”改为“得了”。这明确革舜子孙是城邑的领受者，避免无明确施事的歧义；其余译文及两条脚注均可保留。
