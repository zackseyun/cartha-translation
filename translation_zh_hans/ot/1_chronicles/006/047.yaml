base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
translation:
  language: zh_hans
  text: 革舜的子孙[a]按他们的宗族，从以萨迦支派、亚设支派、拿弗他利支派，以及巴珊境内的玛拿西支派[b]得了十三座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文作“革舜”（Gershom）；许多译本作“革顺”（Gershon）。
    reason: alternative_reading
  - marker: b
    text: 有些译本把“巴珊境内的玛拿西支派”译作“巴珊境内的玛拿西半支派”，以明确其地理所指；本节希伯来文没有“半支派”一词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: 给……的子孙
  rationale: 介词 לְ 在本段分配城邑的语境中表示领受者；“子孙”既符合谱系用语，也比逐字译作“儿子们”更自然准确。
- source_word: גֵרְשׁוֹם
  choice: 革舜
  rationale: 本节马所拉文本写作 גֵרְשׁוֹם（Gershom），因此按该词形译作“革舜”，而不依传统把它改作 Gershon（革顺）。
- source_word: לְמִשְׁפְּחוֹתָם
  choice: 按他们的宗族
  rationale: מִשְׁפָּחָה 在支派与城邑分配的语境中指支派内部的宗族单位；“宗族”比一般的“家庭”更准确。
- source_word: מִמַּטֵּה
  choice: 从……支派
  rationale: מַטֶּה 在此为以色列的“支派”，重复的 מִן 表明这些城分别出自所列各支派。
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  choice: 巴珊境内的玛拿西支派
  rationale: 忠实保留原文“巴珊的/在巴珊的玛拿西”这一地理限定，不增添本节未明说的“半支派”。
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: 十三座城
  rationale: 直接表达原文的基数词短语，并使用现代汉语中城邑的量词“座”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。原文是承接上文的省略句，汉语补出“共分了”以完整表达城邑分配关系；列举各支派时适度省略重复的“从”，避免译文生硬，同时保留来源关系。
