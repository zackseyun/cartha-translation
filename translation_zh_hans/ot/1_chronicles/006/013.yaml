  text: 'And the sons of Samuel: the firstborn[a], Vashni, and Abijah.'
translation:
  language: zh_hans
  text: 撒母耳的儿子：长子瓦施尼[a]和亚比雅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瓦施尼”也可按希伯来文理解为“和次子”。本句也可译作：“撒母耳的儿子：长子，以及次子亚比雅。”按此理解，长子的名字在本节中没有明说；参《撒母耳记上》8:2，那里列撒母耳的两个儿子为约珥和亚比雅。
    reason: 说明 וַשְׁנִי 可作人名或可理解为“和次子”的文本歧义，并保留其与《撒母耳记上》8:2之间的系谱难题，而不在正文中调和。
lexical_decisions:
- source_word: וּבְנֵי
  choice: ……的儿子是
  rationale: 用现代汉语自然表达系谱中的领属关系；希伯来语连词承接上文，在本节独立呈现时不必机械译作“和”。
- source_word: שְׁמוּאֵל
  choice: 撒母耳
  rationale: 采用现代中文圣经读者熟悉的标准人名译法。
- source_word: הַבְּכֹר
  choice: 长子
  rationale: 该词表示家族中的出生次序和身份，“长子”比“第一个”更准确自然。
- source_word: וַשְׁנִי
  choice: 瓦施尼
  rationale: 正文保留马所拉文本所呈现的形式并音译为人名，不依据平行经文擅自补入“约珥”；其也可能表示“次子”，故在脚注说明。
- source_word: וַאֲבִיָּה
  choice: 和亚比雅
  rationale: 按中文惯例翻译连词及人名，并采用通行译名“亚比雅”。
theological_decisions:
- issue: 撒母耳众子的姓名及次序存在文本难题
  choice: 正文保留“长子瓦施尼”，不补入约珥
  alternative: 将相关词理解为“次子”，并据《撒母耳记上》8:2理解长子为约珥
  rationale: 希伯来文本在此措辞异常，且与《撒母耳记上》8:2所列的约珥、亚比雅不易协调。正文不静默修订或强行调和，脚注保留另一种可能理解。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持系谱体裁的凝练表达；人名使用简体中文通行译法。
