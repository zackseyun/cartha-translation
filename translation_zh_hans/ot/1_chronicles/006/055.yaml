base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
translation:
  language: zh_hans
  text: 又从玛拿西半支派中，把亚乃及其周围的牧场，以及比连[a]及其周围的牧场，归给哥辖其余子孙的宗族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文本作“比连”；约书亚记21:25的平行经文作“以伯莲”。
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: 又从玛拿西半支派中
  rationale: מַחֲצִית意为“一半”，מַטֶּה在分地语境中指“支派”；“半支派”是现代汉语圣经地理与支派语境中简洁自然的表达。
- source_word: אֶת עָנֵר
  choice: 亚乃
  rationale: 按现代中文圣经中这一地名的惯用译名音译。
- source_word: מִגְרָשֶׁיהָ
  choice: 其周围的牧场
  rationale: מִגְרָשׁ指城邑附属的开阔地，常供放牧；译作“周围的牧场”兼顾其位置与用途。
- source_word: בִּלְעָם
  choice: 比连
  rationale: 忠实音译本节马所拉文本所读的בִּלְעָם；与约书亚记21:25平行经文的不同读法另以脚注保留。
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  choice: 给了哥辖其余子孙的宗族
  rationale: מִשְׁפַּחַת为单数集合名词，可指家族或宗族；הַנּוֹתָרִים指其余尚未列出的哥辖后裔。中文调整语序，以清楚表达这些城邑的受领者。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“把……给了……”补明希伯来文名录体中省略而由上下文承接的授予关系；地名按中文传统音译，文本异读不在正文中擅自协调。
