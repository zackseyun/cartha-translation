lexical_decisions:
- source_word: בֻּקִּי
  choice: 布基
  rationale: 这是人名，按现代中文圣经中通行且易辨识的形式音译，不翻译其可能的词源含义。
- source_word: בְנ/וֹ
  choice: 是他的儿子
  rationale: בֵּן 加第三人称阳性单数后缀，直译为“他的儿子”。重复这一表达既保留原文家谱的链式结构，也不把“儿子”擅自扩展为“后裔”。
- source_word: עֻזִּי
  choice: 乌西
  rationale: 这是人名，采用现代中文读者熟悉的圣经音译形式。
- source_word: זְרַחְיָה
  choice: 西拉希雅
  rationale: 这是人名，采用中文圣经中通行、可辨识的音译形式，并保留其作为专名的性质。
