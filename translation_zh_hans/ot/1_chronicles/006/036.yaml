    rationale: ‘布基是他的儿子，乌西是他的儿子，西拉希雅是他的儿子’虽可勉强按原文词序理解，却连续使用无明确先行词的‘他的’，中文读者难以辨明乌西和西拉希雅分别是谁的儿子。改为‘他的儿子是布基；布基的儿子是乌西；乌西的儿子是西拉希雅’既保留首项对上文人物的依赖，也明确后续父子关系。
