  source_fidelity: 译文准确保留了“给亚伦的子孙”、逃城希伯仑及随后城邑的列举。两处 מִגְרָשֶׁיהָ 的阴性单数所属代词应分别指立拿和以实提莫；改为“它的郊野”能更直接、准确地表达城邑所属的外围开阔地。
  naturalness: 原文“连同属城的草场”不够自然，且“属城”容易理解为附属城镇，“草场”则将开放土地的用途限定得较窄。“及其郊野”在现代标准汉语圣经叙述中更流畅、清楚。
  terminology: 保留通行的“逃城”、祭司谱系称谓“亚伦的子孙”及既有地名译法。以“郊野”对应 מִגְרָשׁ，并以脚注说明其为归城所有的外围开阔地，避免将其误解为普通城乡边缘或仅为牧场。
