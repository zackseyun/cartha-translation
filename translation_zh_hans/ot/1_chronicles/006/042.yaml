base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
translation:
  language: zh_hans
  text: 他们把逃城希伯仑，以及立拿及其郊野[a]、雅提珥、以实提莫及其郊野，都给了亚伦的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郊野”也可译作“城郊公地”；希伯来语指归属于一座城的外围开阔土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: 给了亚伦的子孙
  rationale: 介词לִ标明接受者；“子孙”在宗族与祭司谱系语境中自然表达后裔群体，同时保留其与亚伦的血缘关系。
- source_word: נָתְנוּ
  choice: 他们把……给了
  rationale: נתן的基本义是“给”；此处虽涉及城邑分配，但直译为“给了”清楚自然，也不额外强化行政意义。
- source_word: עָרֵי הַמִּקְלָט אֶת חֶבְרוֹן
  choice: 逃城希伯仑
  rationale: “逃城”是摩西律法中指定庇护城邑的简明传统称谓。希伯来文形式为复数“逃城”，随后同位列出希伯仑；中文采用单个城名与类别直接组合的自然表达，不将后列普通城邑误作逃城。
- source_word: וְ/אֶת לִבְנָה
  choice: 以及立拿
  rationale: 按现代中文圣经地名惯例音译。
- source_word: מִגְרָשֶׁיהָ
  choice: 连同属城的草场
  rationale: מִגְרָשׁ指归属于城邑的外围开阔土地，常供放牧等公共用途；“属城的草场”既表达所属关系，也避免误解为城内土地。阴性单数后缀分别指前面的立拿和以实提莫。
- source_word: וְ/אֶת יַתִּר
  choice: 雅提珥
  rationale: 按现代中文地名音译，所据希伯来语读音为Yattir。
- source_word: וְ/אֶת אֶשְׁתְּמֹעַ
  choice: 以实提莫
  rationale: 采用通行中文圣经地名形式，对应希伯来语אֶשְׁתְּמֹעַ。
theological_decisions: []
translation_notes:
  register: 采用庄重而顺畅的现代标准汉语。用“以及”“连同”划清城名及其附属土地的列表结构；“都”使前置宾语较长的句子更易理解。
