  to: 他们把逃城希伯仑，以及立拿及其郊野[a]、雅提珥、以实提莫及其郊野，都给了亚伦的子孙。
  rationale: 仅将两处“连同属城的草场”统一修订为“及其郊野”，以更准确、自然地对应城邑所属的开阔土地；其余句法、地名、逃城术语及脚注锚点均予保留。
