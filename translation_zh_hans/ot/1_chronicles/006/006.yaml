  text: Joah his son[a], Iddo his son, Zerah his son, Jeatherai his son.
translation:
  language: zh_hans
  text: 约亚的儿子是易多；易多的儿子是谢拉；谢拉的儿子是耶特赖[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可音译为“耶亚特莱”。
    reason: 人名 יְאָתְרַי 的较展开音译形式；正文采用中文圣经中较通行的“耶特赖”。
lexical_decisions:
- source_word: יוֹאָח
  choice: 约亚
  rationale: 人名按希伯来语 יוֹאָח（Yōʾāḥ）的读音音译，并采用现代中文圣经人名中自然、易辨认的形式。
- source_word: בְּנוֹ
  choice: 他的儿子是
  rationale: בֵּן 加第三人称阳性单数后缀，在此家谱句式中最自然地表示“他的儿子”。为使连续谱系在现代汉语中清楚顺畅，逐项补出前一人的姓名。家谱有时可能省略世代，但此处不把这种可能性写进正文。
- source_word: עִדּוֹ
  choice: 易多
  rationale: 人名按希伯来语 עִדּוֹ（ʿIddō）的读音音译。
- source_word: זֶרַח
  choice: 谢拉
  rationale: 人名按希伯来语 זֶרַח（Zeraḥ）的读音音译，并保留末尾喉音不在汉字中另行标示的惯例。
- source_word: יְאָתְרַי
  choice: 耶亚特莱
  rationale: 人名按马所拉文本 יְאָתְרַי（Yəʾāṯəray）的元音与辅音音译；以“耶亚特莱”体现中间的喉塞音和音节结构。另一个较简化的音译见脚注。
theological_decisions: []
translation_notes:
  register: 采用简洁而庄重的现代汉语家谱句式。原文是省略谓语的链式名单；译文补入“是”并重复姓名，以避免汉语中亲属关系指向含混。脚注标记置于其实际所指的人名之后。
