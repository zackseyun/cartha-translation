  text: Shimea his son[a], Haggiah his son, Asaiah his son.
translation:
  language: zh_hans
  text: 他的儿子是示米亚[a]；示米亚的儿子是哈基雅；哈基雅的儿子是亚帅雅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文逐字重复家谱格式：“他的儿子……他的儿子……他的儿子”，表示族谱中一代接一代的承继。
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעָא
  choice: 示米亚
  rationale: 按希伯来语人名音译，并采用现代中文圣经中较通行的译名形式。
- source_word: בְנוֹ
  choice: 他的儿子／某人的儿子
  rationale: בֵּן附第三人称阳性单数词尾，意为“他的儿子”。正文按汉语家谱表达明确补出每一代的父名，避免连续使用“他的”造成所指不清，同时保留逐代承继的关系。
- source_word: חַגִּיָּה
  choice: 哈基雅
  rationale: 按希伯来语音译；词尾含神名短式，但人名不作释义翻译。
- source_word: עֲשָׂיָה
  choice: 亚帅雅
  rationale: 按希伯来语音译，并采用中文圣经中较通行的译名形式；不将人名所含意义直接译出。
