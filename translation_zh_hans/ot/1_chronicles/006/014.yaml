base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/014.yaml
  text: 'The sons of Merari: Mahli[a], Libni his son, Shimei his son, Uzzah his son.'
translation:
  language: zh_hans
  text: 米拉利的儿子有：抹利[a]；抹利的儿子是立尼，立尼的儿子是示每，示每的儿子是乌撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在家谱用语中，也可泛指“米拉利的后代”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是בֵּן的复数构造式，用来引出家谱。直译为“儿子”最贴近原文；在家谱语境中也可泛指“后代”，故以脚注保留这一可能。
- source_word: מְרָרִי
  choice: 米拉利
  rationale: 人名，采用现代中文圣经读者较熟悉的传统译名。
- source_word: מַחְלִי
  choice: 抹利
  rationale: 人名，采用现代中文圣经常见译名。
- source_word: לִבְנִי
  choice: 立尼
  rationale: 人名，采用现代中文圣经常见译名。
- source_word: בְנוֹ
  choice: ……的儿子是……
  rationale: 该词由“儿子”加第三人称阳性单数词尾构成，表示“他的儿子”。为避免连续使用“他的儿子”时指代不清，中文正文重复前一人名，清楚呈现世系链条。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 人名，采用现代中文圣经常见译名。
- source_word: עֻזָּה
  choice: 乌撒
  rationale: 人名，采用现代中文圣经常见译名。
theological_decisions: []
