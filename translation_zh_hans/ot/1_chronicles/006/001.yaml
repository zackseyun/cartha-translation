  language: zh_hans
  text: 利未的儿子是革顺[a]、哥辖和米拉利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文作“革顺”（גֵּרְשֹׁם，Gershom）；相关家谱经文中也可见“革舜”（גֵּרְשׁוֹן，Gershon）这一异体。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是בֵּן的复数构造形式。希伯来家谱用语有时可泛指后裔，但本节列出的是利未的三个亲生儿子，因此译作“儿子”既准确又自然。
- source_word: לֵוִי
  choice: 利未
  rationale: 专有名词，采用现代中文圣经读者熟悉的通行音译。
- source_word: גֵּרְשֹׁם
  choice: 革顺
  rationale: 专有名词。马所拉文本本节作גֵּרְשֹׁם；中文采用通行译名“革顺”，并以脚注提示原文形式及相关经文中的异体。
- source_word: קְהָת
  choice: 哥辖
  rationale: 专有名词，采用现代中文圣经传统中清楚、通行的音译。
- source_word: וּ/מְרָרִי
  choice: 和米拉利
  rationale: 由连词וּ与专名מְרָרִי组成；按现代汉语并列结构译为“和米拉利”。
