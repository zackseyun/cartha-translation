  yaml_path: translation/ot/1_chronicles/006/002.yaml
  text: 'These are the names of the sons of Gershom: Libni and Shimei[a].'
translation:
  language: zh_hans
  text: 以下是革舜的儿子：立尼和示每。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本此处作“革舜”（Gershom）；在相关家谱经文中，有些英文译本采用“革顺”（Gershon）这一名称形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: 名叫
  rationale: 这一表达引出随后列出的名字。译作“名叫”符合现代汉语家谱叙述习惯，也完整传达“这些是……的名字”的呈现功能；句首连接词不必机械译出。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 该词虽可泛指后代，但本处列出革顺的两个直接儿子，因此译作“儿子”最准确。
- source_word: גֵרְשׁוֹם
  choice: 革顺
  rationale: 原文此处为 גֵרְשׁוֹם（Gershom），采用中文圣经人名的通行音译“革顺”，不按相关家谱语境中的另一拼写处理。
- source_word: לִבְנִי
  choice: 立尼
  rationale: 专有名词，采用现代中文圣经中易于辨识的通行音译。
- source_word: וְשִׁמְעִי
  choice: 和示每
  rationale: 前缀连接词协调名单中的第二个人名，译作“和”；שִׁמְעִי 采用通行音译“示每”。
