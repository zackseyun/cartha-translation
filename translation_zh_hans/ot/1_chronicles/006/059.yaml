  text: 又从亚设支派：玛沙及其郊野[a]，押顿及其郊野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节《历代志上》的地名作“玛沙”；平行经文《约书亚记》21:30作“米沙勒”。
    reason: 保留平行名单中的名称差异，避免把两处文本静默统一。
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה אָשֵׁר
  choice: 又从亚设支派得了
  rationale: מַטֶּה在分配城邑的语境中指“支派”；前缀וּמִ־表达“又从”。为使本节作为承接上文的名单片段在现代汉语中自然完整，按上下文补出“得了”。
- source_word: מָשָׁל
  choice: 玛沙
  rationale: 按《历代志上》此处马所拉文本的读音转写地名，不以《约书亚记》21:30的平行形式静默替代；异文信息置于脚注。
- source_word: מִגְרָשֶׁיהָ
  choice: 其草场
  rationale: מִגְרָשׁ指归属城邑、位于其周围的开放用地，尤其供牲畜牧放；“草场”简洁自然，也符合利未城邑名单的语境。阴性单数后缀译作“其”，回指相应城邑。
- source_word: עַבְדּוֹן
  choice: 押顿
  rationale: 按希伯来地名עַבְדּוֹן音译，并采用现代中文圣经读者较熟悉的形式。
