  text: Elkanah his son[a], Elkanah his son, Zophai his son, and Nahath his son.
translation:
  language: zh_hans
  text: 以利加拿是他的儿子，以利加拿是他的儿子，琐斐[a]是他的儿子，和拿哈是他的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“苏斐”；这是对人名 צוֹפַי 采用不同元音读法或音译传统的结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: 以利加拿
  rationale: 人名按现代中文圣经中通行的音译处理；原文重复出现，译文也保留重复。
- source_word: בְּנוֹ / בנו
  choice: 是他的儿子
  rationale: 该词为“儿子”加第三人称阳性单数后缀；在族谱语境中译为“是他的儿子”自然清楚，并逐次保留原文的族谱节奏。
- source_word: צוֹפַי
  choice: 琐斐
  rationale: 按马所拉文本的读音音译为人名“琐斐”；不同元音或转写传统见脚注。
- source_word: וְ
  choice: 和（在中文句式中不另译）
  rationale: 这是连接末项的普通连词；中文连续族谱列举中用逗号衔接更自然，不影响其连接功能。
- source_word: נַחַת
  choice: 拿哈
  rationale: 人名采用现代中文圣经中通行的音译。
