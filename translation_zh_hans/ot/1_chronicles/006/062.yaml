  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
translation:
  language: zh_hans
  text: 给米拉利其余的子孙，从西布伦支派分给他们的是：临摩挪[a]和它城外的牧场，他泊和它城外的牧场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“临摩挪”；《约书亚记》21:35的平行记载作“丁拿”。
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי הַנּוֹתָרִים
  choice: 给其余的米拉利子孙
  rationale: לְ在城邑分配清单中表示领受者；הַנּוֹתָרִים指此前分配之后余下的米拉利宗族成员。译为“给其余的……子孙”既承接分配语境，也保留顺序含义。
- source_word: מִמַּטֵּה זְבוּלֻן
  choice: 从西布伦支派分出的
  rationale: מַטֶּה在此指以色列支派；补出“分出的”使省略谓语的希伯来清单句式在现代汉语中自然清楚。
- source_word: רִמּוֹנוֹ
  choice: 临摩挪
  rationale: 按马所拉文本的地名音译，并采用中文圣经中较熟悉的译名；不以平行经文的“亭拿”取代正文读法。
- source_word: מִגְרָשֶׁיהָ
  choice: 城外的牧场
  rationale: מִגְרָשׁ在利未城邑清单中指城周围供放牧等用途的公用空地；“城外的牧场”比单说“郊野”更明确。
- source_word: תָּבוֹר
  choice: 他泊
  rationale: 作为城邑名称音译；此处不将其解释性地译成“他泊山”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的分配清单句式。原文没有明说“城”或“所得”，译文仅以“分出的有”补足汉语句法。脚注标记置于实际存在文本异读的“临摩挪”之后，而不是置于“其余的”之后。
