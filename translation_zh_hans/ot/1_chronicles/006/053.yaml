  text: and Jokmeam with its pasturelands[b][a], and Beth-horon with its pasturelands.
translation:
  language: zh_hans
  text: 约缅及其周围的牧场，伯和仑及其周围的牧场。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָקְמְעָם
  choice: 约缅
  rationale: 按《历代志上》此处马所拉文本的辅音形式音译地名；不据平行地名传统改作“约念”。
- source_word: מִגְרָשֶׁיהָ
  choice: 属城的牧场
  rationale: 在利未人城邑清单中，מִגְרָשׁ 指划归城邑、位于其周围的开放地带，常供放牧；“属城的牧场”既交代归属关系，也符合现代汉语表达。
- source_word: בֵּית חוֹרוֹן
  choice: 伯和仑
  rationale: 采用该圣经地名在现代中文中的惯用音译。
- source_word: וְאֶת
  choice: 还有／以及
  rationale: וְ 与宾格标记 אֶת 在清单中连接各项；汉语以“还有”和“以及”自然呈现并列关系，不机械翻出宾格标记。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留城邑清单的并列结构。为避免“它的牧场”指代生硬，将阴性单数后缀自然译为“属城的”。
