id: 1CH.6.17
reference: 1 Chronicles 6:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּהְי֨וּ מְשָׁרְתִ֜ים לִ/פְנֵ֨י מִשְׁכַּ֤ן אֹֽהֶל מוֹעֵד֙ בַּ/שִּׁ֔יר עַד בְּנ֧וֹת שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם וַ/יַּעַמְד֥וּ כְ/מִשְׁפָּטָ֖/ם עַל עֲבוֹדָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
translation:
  language: zh_hans
  text: 他们在会幕的帐幕前，以歌唱供职[a]，直到所罗门在耶路撒冷建造雅威的殿[b]。他们按着自己的定例站立，负责自己的职务[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以诗歌供职”或“借着歌唱供职”。
    reason: 介词短语 בַּשִּׁיר 可表示伴随的歌唱，也可强调以歌唱作为供职方式。
  - marker: b
    text: 希伯来语直译“雅威的房屋”，指圣殿。
    reason: 正文按汉语习惯译为“殿”；脚注保留原文“房屋”的措辞。
  - marker: c
    text: “定例”也可译作“规程”或“惯例”；“站立”在此语境中可指按规定就位履职。
    reason: כְמִשְׁפָּטָם 指既定的规定、程序或惯例；וַיַּעַמְדוּ 保留“站立”的字面表达，同时在上下文中带有就位承担职务的意味。
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: 供职
  rationale: 该分词指履行圣所中的礼仪职务。“供职”既保留职事含义，也符合现代汉语表达。
- source_word: לִפְנֵי
  choice: 在……前
  rationale: 保留其空间和关系意义，表示他们在圣所前履行职务。
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: 帐幕，就是会幕
  rationale: 保留两个并列解释的希伯来语名词，不把它们合并为一个名称；“就是”体现同位关系。
- source_word: בַּשִּׁיר
  choice: 以歌唱
  rationale: 表达他们供职的方式；既可涵盖以诗歌服事，也可指实际歌唱。
- source_word: עַד בְּנוֹת שְׁלֹמֹה
  choice: 直到所罗门……建造
  rationale: 将带 עַד 的不定式结构自然地译为时间终点。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: 此处“房屋”明确指耶路撒冷圣殿；用“殿”在汉语中自然明确，同时保留其宗教建筑所指。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代专名。
- source_word: וַיַּעַמְדוּ
  choice: 站立
  rationale: 保留动词“站立”的本义；在上下文中也含按指定位置就位履职之意。
- source_word: כְמִשְׁפָּטָם
  choice: 按着各自的定例
  rationale: מִשְׁפָּט 在此指既定规程或惯例；“各自”对应复数附属形式所涉及的群体安排。
- source_word: עַל עֲבוֹדָתָם
  choice: 执行自己的职务
  rationale: עַל 在这里表示与所分派职务的关系。直译“在职务之上”不合现代汉语，故按功能译出履职之意。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用以色列上帝的专名。音译“雅威”保留专名性质，避免以“主”这一称号取代；本节的神学意义不取决于具体音译形式。
- issue: בֵּית יְהוָה 是否直接解释为圣殿
  choice: 雅威的殿
  alternative: 雅威的房屋
  rationale: 上下文明确指所罗门在耶路撒冷建造的圣殿。“殿”是现代汉语中自然且准确的对应，但脚注说明希伯来语的字面形式，以免掩盖原文措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“供职、定例、职务”保留礼仪与制度语境，又避免过度古雅。两个圣所名称均予保留，神名以“雅威”音译。
