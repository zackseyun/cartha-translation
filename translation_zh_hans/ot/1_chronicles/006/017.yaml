  source_fidelity: 正文基本忠实呈现了在会幕前以歌唱供职、直到所罗门建殿，以及随后按既定规程履职的内容。惟“帐幕，就是会幕前”的断句使“前”的辖域不够清楚；“执行自己的职务”较明显地补入了原文未明说的动作，且弱化了“站立／就位”的表达。
  naturalness: “供职”“定例”适合庄重的现代汉语。改为“会幕的帐幕前”可清楚表达原文的构词关系；末句改为“按着……站立，负责……”既较通顺，也保留原文动词。
  terminology: “雅威”与项目对四字神名的处理一致。“殿”可作为此处所罗门所建建筑的自然译法，脚注保留“房屋”的字面措辞。“会幕的帐幕”保留 מִשְׁכַּן 与 אֹהֶל־מוֹעֵד 两个名词及其连接关系。
