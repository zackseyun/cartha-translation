  - severity: medium
    issue: “执行自己的职务”未充分保留 וַיַּעַמְדוּ。
    rationale: 原文明确使用“站立”，在语境中可含按规定就位承担职责之意；单说“执行”加入动作性含义，并将该动词淡化。
