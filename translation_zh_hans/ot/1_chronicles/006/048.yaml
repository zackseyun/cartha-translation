translation_notes:
  register: 采用庄重而自然的现代标准汉语。为使希伯来语省略谓语的名词性句子在中文中完整通顺，补出“分给”和“所得的”，不增加原文之外的分配对象或神学解释。保留“按着宗族”与“抽签”两个分配层面的信息。
