  text: To the sons of Merari, according to their clans, from the tribe of Reuben, from the tribe of Gad, and from the tribe of Zebulun, twelve cities by lot.
translation:
  language: zh_hans
  text: 米拉利的子孙按着他们的宗族，从吕便支派、迦得支派和西布伦支派抽签分得十二座城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: 分给米拉利的子孙
  rationale: לְ在这里标明分配的领受者；“子孙”在现代汉语中自然地表达宗族后裔，也保留与利未谱系的联系。
- source_word: לְמִשְׁפְּחוֹתָם
  choice: 按着宗族
  rationale: מִשְׁפָּחָה在支派土地与城邑分配的语境中指支派内部的宗族单位；“宗族”比一般的“家庭”更准确。
- source_word: מִמַּטֵּה
  choice: 从……支派中
  rationale: מַטֶּה在此处是以色列的“支派”，重复的介词短语说明这些城邑来自哪些支派。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: גָד
  choice: 迦得
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: זְבוּלֻן
  choice: 西布伦
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בַּגּוֹרָל
  choice: 抽签所得
  rationale: 该短语说明分配城邑的方式；“抽签”是现代汉语对这种分配程序的自然表达。
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: 十二座城
  rationale: עִיר在此类分配清单中指有人居住的城邑；量词“座”符合现代汉语习惯。
