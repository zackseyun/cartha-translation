revisions:
- from: 按着宗族，分给米拉利的子孙十二座城，是从吕便支派、迦得支派和西布伦支派中抽签所得的。
  to: 米拉利的子孙按着他们的宗族，从吕便支派、迦得支派和西布伦支派抽签分得十二座城。
  rationale: 修订将“从三个支派”与“抽签”分别清楚地关联于城邑的来源和分配方式，并保留原文简洁的分配陈述。“分得”在此自然表达受领者获得按阄分配的城邑，未添加原文未明示的分配者。
