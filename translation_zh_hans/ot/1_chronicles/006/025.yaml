lexical_decisions:
- source_word: בֶּן
  choice: ……的儿子
  rationale: 在这段家谱中，该词连接连续的父子世系。译为“……的儿子”既保留原文关系，也比范围较广的“后裔”更准确。为使独立成节的中文清楚，按连续家谱的句法补出各分句的主语。
- source_word: מִיכָאֵל
  choice: 米迦勒
  rationale: 采用现代中文圣经读者熟悉的希伯来人名译法。
- source_word: בַּעֲשֵׂיָה
  choice: 巴西雅
  rationale: 依所给马所拉文本的辅音与元音转写，并采用简洁自然的中文音译；不把本节名字改作其他家谱中较常见的“玛西雅”。
- source_word: מַלְכִּיָּה
  choice: 玛基雅
  rationale: 按希伯来语人名的读音和中文圣经通行音译处理；名字末尾的 יָה 体现神名成分，但人名正文不作释义翻译。
