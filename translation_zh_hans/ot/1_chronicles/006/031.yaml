  rationale: 按希伯来语读音音译；采用现代中文圣经人名的常见形式。
- source_word: שָׁמֶר
  choice: 沙默
  rationale: 按马所拉文本的辅音与元音音译，保留该人名与“示米珥”等不同拼写形式的区别。
