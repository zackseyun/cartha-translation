  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: zh_hans
  text: 以下是亚伦的儿子：以利亚撒；以利亚撒的儿子是非尼哈；非尼哈的儿子是亚比书。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: 如下
  rationale: 连词加指示词用于引出家谱名单；现代汉语用“如下”自然、简洁，也保留其引介功能。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 后文列出父子直接承继的次序，因此译作“儿子”，不泛化为“后裔”。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בְּנ/וֹ
  choice: 他的儿子／……的儿子
  rationale: 该词是“儿子”加第三人称阳性单数所属后缀，表示直接父子关系；首处译“他的儿子”，后两处明确重复各自父名，以免汉语连续使用“他的”造成指代含混。
- source_word: פִּינְחָס
  choice: 非尼哈
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֲבִישׁוּעַ
  choice: 亚比书
  rationale: 采用现代中文圣经中通行的人名译法。
