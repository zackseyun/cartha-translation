  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
translation:
  language: zh_hans
  text: 以下是亚伦的子孙，就是哥辖族的一家，按着他们境内的聚落[a]所得的住处；因为阄归了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚落”或译“营地”或“村庄”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  choice: 他们的住处
  rationale: 该词指居住或定居之处；“住处”简明自然，并保留具体地点的含义。
- source_word: לְטִירוֹתָם
  choice: 按着他们的聚落
  rationale: טִירָה可指聚落、营地或有围墙的村庄；本节处于分配居住地的语境，“聚落”较为中性，同时以脚注保留其他可能。
- source_word: בִּגְבוּלָם
  choice: 他们境内
  rationale: גְּבוּל既可指边界，也可指边界以内的地域；这里描述所分得地域中的住处，译作“境内”符合语境且自然。
- source_word: לִבְנֵי אַהֲרֹן
  choice: 亚伦的子孙
  rationale: 在家谱和支派语境中，בָּנִים包括后裔；“子孙”比仅指亲生儿子的“儿子”更准确自然。
- source_word: לְמִשְׁפַּחַת הַקְּהָתִי
  choice: 属哥辖族各家
  rationale: מִשְׁפָּחָה在此表示宗族或家族单位，הַקְּהָתִי为集体称谓；此译清楚表达亚伦后裔在哥辖宗族中的归属。
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  choice: 因为阄归了他们
  rationale: 保留גּוֹרָל“阄”的分配意象，并较直接地表达原文“这阄是他们的”这一所属关系。
