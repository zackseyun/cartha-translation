  naturalness: “属哥辖族各家”在现代汉语中关系略显含混，容易被理解为“哥辖族的每一家”，而非亚伦子孙所属的哥辖宗族。调整语序后更清楚自然。
  terminology: 保留“亚伦”“哥辖”“阄”等传统且可理解的经文用语。“聚落”中性恰当；脚注保留“营地／村庄”的词义可能。
