  text: 雅哈的儿子，革舜[a]的儿子，利未的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“革舜”；别处的家谱中常见相近但有区别的名字“革顺”。
