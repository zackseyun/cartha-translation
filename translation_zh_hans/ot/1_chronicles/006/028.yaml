lexical_decisions:
- source_word: בֶּן
  choice: ……的儿子
  rationale: 在家谱中，בֶּן最自然的意思是“儿子”。虽然家谱有时会略去若干代，此处却没有充分理由在正文中改译为较宽泛的“后代”。
- source_word: יַחַת
  choice: 雅哈
  rationale: 按现代中文圣经人名的常见音译处理该专名。
- source_word: גֵּרְשֹׁם
  choice: 革舜
  rationale: 原文此处明确为גֵּרְשֹׁם（Gershom），中文以常见译名“革舜”呈现，不将其改同为别处相关但有区别的“革顺”（Gershon）。
- source_word: לֵוִי
  choice: 利未
  rationale: 采用现代中文读者熟悉的传统圣经人名译法。
