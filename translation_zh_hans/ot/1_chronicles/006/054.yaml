  text: and Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands.
translation:
  language: zh_hans
  text: 还有亚雅仑及其城郊的牧地[a]，迦特临门及其城郊的牧地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城郊的牧地”也可译作“公用地”或“城周围的空旷地”。希伯来语原词指归属于一座城的城外开阔土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: 亚雅仑
  rationale: 专有地名按现代中文圣经常见译名音译，既便于辨识，也不把地名按词源意译。
- source_word: מִגְרָשֶׁיהָ
  choice: 其城郊牧地
  rationale: 该词指归属城邑、位于城周围的开阔公用土地，常供放牧；“城郊牧地”兼顾其位置与主要用途，并适合利未城邑清单的语境。
- source_word: גַּת רִמּוֹן
  choice: 迦特临门
  rationale: 复合地名采用中文圣经中通行的音译形式，不按构词含义翻译。
- source_word: וְאֶת
  choice: 还有／及
  rationale: 希伯来语连接词与直接宾语标记反复构成清单；中文以“还有”承接上文，并用“及”连接城名和附属土地，避免机械重复。
theological_decisions: []
translation_notes:
