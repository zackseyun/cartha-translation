  yaml_path: translation/ot/1_chronicles/006/049.yaml
  text: And the sons of Israel gave to the Levites the cities and their pasturelands[a][b].
translation:
  language: zh_hans
  text: 以色列人把城邑和城周围的草场[a]给了利未人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“城周围的公用地”或“城周围的空地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 给了
  rationale: נתן的Qal叙事形式，表示“给予”；“给了”在此最自然直接。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在这里是对以色列民的集体称呼；现代汉语用“以色列人”自然清楚，也不把原文的阳性复数机械化为仅指男性。
- source_word: לַלְוִיִּם
  choice: 利未人
  rationale: 标准族群名称；介词ל表示接受者，借助汉语“给了……利未人”的语序表达。
- source_word: הֶעָרִים
  choice: 这些城
  rationale: עָרִים指城邑；定冠词在上下文中具有回指作用，译作“这些城”比孤立的“城”更自然。
- source_word: מִגְרְשֵׁיהֶם
  choice: 城周围的草场
  rationale: מִגְרָשׁ指属于城邑、位于其周围的开放用地，常供放牧；此译兼顾位置和主要用途，同时以脚注保留更宽泛的词义。
theological_decisions: []
