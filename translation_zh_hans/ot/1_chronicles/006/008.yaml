  yaml_path: translation/ot/1_chronicles/006/008.yaml
  text: Elkanah his son[a], and Ebiasaph his son, and Assir his son.
translation:
  language: zh_hans
  text: 他的儿子是以利加拿；以利加拿的儿子是以比雅撒[a]；以比雅撒的儿子是亚西珥。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚比亚撒”；这是一些传统译本及平行家谱中较常见的音译形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: 以利加拿
  rationale: 人名按希伯来语音译，并采用现代中文读者较熟悉的形式。
- source_word: בְנוֹ
  choice: 他的儿子／某人的儿子
  rationale: בֵּן 加第三人称阳性单数后缀，最直接表示“他的儿子”。为避免连续使用“他的”造成指代不清，正文按家谱链条明确重复前一人的名字；不扩大译为“后裔”。
- source_word: וְ
  choice: 分号连接
  rationale: 希伯来语连接词在连续家谱中标示并列推进；中文以分号自然呈现同样的链式关系，无须逐一译成“和”。
- source_word: אֶבְיָסָף
  choice: 以比雅撒
  rationale: 按本节马所拉文本的起首元音和辅音音译；另有较传统的“亚比亚撒”译名，列入脚注。
- source_word: אַסִּיר
  choice: 亚西珥
  rationale: 作为专名按希伯来语音译，并保留末尾 ר 的音译痕迹，不按其普通词义翻译。
