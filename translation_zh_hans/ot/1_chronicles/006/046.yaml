base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/046.yaml
  text: And to the sons of Kohath[a] who remained, from the families of the tribe, from the half-tribe, the half of Manasseh, ten cities were given by lot.
translation:
  language: zh_hans
  text: 至于其余的哥辖子孙，从玛拿西半支派的宗族中，按阄分得十座城。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于：“从这支派的宗族，从半支派——玛拿西之半——中。”原文以略显重复的公式化说法指玛拿西半支派。
    reason: 说明希伯来文支派称谓的重复和不寻常结构，同时使正文采用自然、明确的现代汉语表达。
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: 至于哥辖子孙
  rationale: 介词 לְ 延续上文分配城邑的名单；“子孙”在现代汉语中自然表达这里作为宗族群体的“众子”，并保留谱系意味。
- source_word: הַנּוֹתָרִים
  choice: 其余的
  rationale: 该分词指先前分配之后剩下的哥辖族成员；“其余的”简洁自然，也保留余下之人的含义。
- source_word: מִמִּשְׁפַּחַת הַמַּטֶּה
  choice: 从该支派的宗族中
  rationale: מִשְׁפָּחָה 在此为宗族单位，מַטֶּה 在分地语境中指支派；“该”承接后面的玛拿西半支派。
- source_word: מִֽמַּחֲצִית מַטֵּה חֲצִי מְנַשֶּׁה
  choice: 就是从玛拿西半支派中
  rationale: 原文有公式化且略显重复的“半……半玛拿西”表达；正文用“就是”表明后语解释前语，使现代中文可读，脚注交代字面重复。
- source_word: בַּגּוֹרָל
  choice: 按阄
  rationale: 表示借抽签决定分配；“按阄”是简洁、庄重且适合圣经分地语境的表达。
- source_word: עָרִים עָשֶׂר
  choice: 分得了十座城
  rationale: 希伯来文在这项分配公式中没有明写动词，依上下文补出“分得了”；עָרִים 译作“城”。
