  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
translation:
  language: zh_hans
  text: 又从以萨迦支派：基低斯和其城郊的牧场，大比拉[a]和其城郊的牧场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大比拉”也可音译为“达比拉”；参看约书亚记21:28的平行城邑名单。
    reason: 保留该地名音译形式的差异，并提示平行经文。
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: 又从……支派
  rationale: מַטֶּה在分配城邑的语境中指以色列的“支派”；前缀וּ和מִן承接上文，译作“又从”。
- source_word: יִשָּׂשכָר
  choice: 以萨迦
  rationale: 采用现代中文圣经中通行的支派名称。
- source_word: קֶדֶשׁ
  choice: 基低斯
  rationale: 按通行中文圣经地名音译，不添加原文没有的限定语。
- source_word: מִגְרָשֶׁיהָ
  choice: 城郊的牧场
  rationale: מִגְרָשׁ指利未城周围供放牧等用途的公共空地；“城郊的牧场”既交代位置，也比单译“郊野”更明确。阴性单数后缀所指为各自的城，中文依语境表达。
- source_word: דָּבְרַת
  choice: 大比拉
  rationale: 采用中文圣经传统中较为通行的地名译法。
