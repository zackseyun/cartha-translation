  to: 从玛拿西半支派的宗族中，分给革顺的子孙的是：巴珊的哥兰及其城郊[a]，以及亚斯他录及其城郊。
  rationale: 修订以“城郊”替换较易引起方位联想的“四郊”，并保留脚注说明该词所指的城邑附属开放土地。重组语序，使原文依上下文所隐含的分配关系在现代汉语中表达得更清楚；地名、宗族层级、半支派及两城各自附属土地的并列关系均未改变。
