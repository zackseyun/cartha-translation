base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
translation:
  language: zh_hans
  text: 从玛拿西半支派的宗族中，分给革顺的子孙的是：巴珊的哥兰及其城郊[a]，以及亚斯他录及其城郊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城郊”指归属城邑的周边开放土地，常用于放牧；也可译作“草场”或“公共用地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  choice: 给革顺的子孙
  rationale: לְ表示分配对象；בְּנֵי在族谱和支派语境中指后裔群体，译作“子孙”既自然又保留其谱系含义。
- source_word: מִמִּשְׁפַּחַת חֲצִי מַטֵּה מְנַשֶּׁה
  choice: 从玛拿西半支派的宗族中
  rationale: מִשְׁפָּחָה在支派土地分配语境中指支派内部的宗族；חֲצִי מַטֵּה是“半支派”。补出“中”以自然表达来源。
- source_word: אֶת גּוֹלָן בַּבָּשָׁן
  choice: 巴珊的哥兰
  rationale: בַּבָּשָׁן标明哥兰位于巴珊地区；汉语用“巴珊的哥兰”简洁自然。
- source_word: מִגְרָשֶׁיהָ
  choice: 其四郊
  rationale: מִגְרָשׁ指城周围归城所有的开放土地，可供放牧等公共用途。“四郊”符合城邑分地语境，同时脚注说明其具体含义。
- source_word: עַשְׁתָּרוֹת
  choice: 亚斯他录
  rationale: 采用该地名的常见中文音译，所指为城邑名称。
- source_word: וְאֶת ... וְאֶת
  choice: 及……还有……及
  rationale: 保留城市与所属郊地的并列关系，同时调整为自然的现代汉语列举句式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙述语言。“分给他们”为根据上下文补出的省略成分，使本节作为分地名单在汉语中成为完整句；以“宗族”区别于一般家庭，以“四郊”表达利未城周边的附属开放土地。
