  text: 他哈的儿子；他哈是亚惜的儿子；亚惜是以比雅撒的儿子；以比雅撒是可拉的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: ……的儿子
  rationale: 本节是家谱链，בֶּן在各人名之间表示父子关系。译作“……的儿子”最直接清楚；尽管圣经家谱有时会省略若干代，本节本身没有理由改译为较宽泛的“后代”。
- source_word: תַּחַת
  choice: 他哈
  rationale: 人名，按现代中文圣经中较常见的音译形式处理。
- source_word: אַסִּיר
  choice: 亚惜
  rationale: 人名，采用现代中文圣经中较常见、且与希伯来语读音相近的音译。
- source_word: אֶבְיָסָף
  choice: 以比雅撒
  rationale: 人名，依据马所拉文本的读音音译；不借由英语拼写变体另造中文异名。
- source_word: קֹרַח
  choice: 可拉
  rationale: 人名，采用现代中文圣经中通行的音译。
