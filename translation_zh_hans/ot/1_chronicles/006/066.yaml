  text: 还有希实本及其郊野[a]，雅谢及其郊野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公用地”或“附属的开阔地”；此希伯来语词指归属城邑的周边土地，在此语境中可供牧放。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: 希实本
  rationale: 按希伯来语地名音译，并采用现代中文圣经读者较熟悉的译名。
- source_word: מִגְרָשֶׁיהָ
  choice: 其城郊的牧场
  rationale: 在利未人城邑的语境中，מִגְרָשׁ 指归属城邑、位于城周围的开阔地，主要供放牧使用；译作“城郊的牧场”兼顾位置与用途。阴性单数后缀分别指各城。
- source_word: יַעְזֵיר
  choice: 雅谢
  rationale: 按希伯来语地名音译，并采用现代中文圣经中常见的形式。
- source_word: וְאֶת
  choice: 还有／及
  rationale: וְ 是并列连词，אֶת 是宾语标记；中文不另译宾语标记，用“还有”和“及”自然保留清单式并列结构。
