  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
translation:
  language: zh_hans
  text: 又从拿弗他利支派：加利利的基低斯及其草场[a]、哈们及其草场、基列亭及其草场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “草场”或译“公用地”；希伯来语指属于各城的城外开放用地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: 又从拿弗他利支派分出了
  rationale: מַטֶּה在土地分配的语境中指“支派”；介词מִן表示这些城邑出自该支派的产业。依照本节作为前文未完句子的承接关系，补出“分出了”，使中文句意完整自然。
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: 加利利的基低斯
  rationale: בַּגָּלִיל是地域限定，用来区别同名城邑；“加利利的基低斯”既准确又符合现代中文地名表达。
- source_word: מִגְרָשֶׁיהָ
  choice: 其草场
  rationale: מִגְרָשׁ指归属城邑、位于城外周围的开放用地，常用于放牧；“草场”简洁体现本段利未城邑分配的语境，并以脚注保留“公用地”的词义可能。
- source_word: חַמּוֹן
  choice: 哈们
  rationale: 按希伯来语专名音译，并采用简洁、常见的现代中文圣经地名形式。
- source_word: קִרְיָתַיִם
  choice: 基列亭
  rationale: 按希伯来语专名音译；双数词尾已包含在专名形式中，不另作释义。
