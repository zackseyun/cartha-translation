  text: וְ/אֶת שְׂדֵ֥ה הָ/עִ֖יר וְ/אֶת חֲצֵרֶ֑י/הָ נָתְנ֖וּ לְ/כָלֵ֥ב בֶּן יְפֻנֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/041.yaml
  text: But the fields of the city and its pasturelands they gave to Caleb son of Jephunneh[a].
translation:
  language: zh_hans
  text: 不过，城的田野和属城的村庄[a]，他们给了耶孚尼的儿子迦勒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“属城的郊地”或“属城的牧场”。希伯来语也可指附属于城的聚落或土地。
    reason: 保留חֲצֵרֶיהָ在村庄、附属聚落及城外用地之间的词义可能性。
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: 城的田野
  rationale: שָׂדֶה在这里指城外归属于该城的田地或开阔土地；“田野”既保留集合性的单数表达，也自然涵盖耕地和野地。
- source_word: חֲצֵרֶיהָ
  choice: 属城的村庄
  rationale: חָצֵר可指没有城墙的村落或附属于一座城的聚落。这里采用“属城的村庄”，直接表达其依附关系，同时以脚注保留“郊地、牧场”的语境性解释。
- source_word: נָתְנוּ
  choice: 他们给了
  rationale: נתן的Qal完成式直译为“给了”；保留原文未明说主语名称的第三人称复数形式，不解释为更具体的“划给”或“分配”。
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: 给了耶孚尼的儿子迦勒
  rationale: 介词לְ标示接受者；人名采用现代中文圣经中通行且易辨认的译名“迦勒”和“耶孚尼”。
- source_word: וְאֶת ... וְאֶת
  choice: 不过……和……
  rationale: 句首וְ承接上文，并与祭司所得的城形成对照，因此译作“不过”；第二个וְ自然译作“和”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“城的田野和属城的村庄”保留原文并列结构；倒装式“……他们给了……”也保留原句对受词的强调。
