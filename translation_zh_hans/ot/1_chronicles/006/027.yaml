lexical_decisions:
- source_word: בֶּן
  choice: ……的儿子
  rationale: 在家谱中，这一构词形式通常表示“某人的儿子”。希伯来家谱有时会省略中间世代，但正文保留其表层的父子表达，较为忠实。
- source_word: אֵיתָן
  choice: 以探
  rationale: 这是人名，采用现代中文圣经读者较熟悉的传统音译。
- source_word: זִמָּה
  choice: 薪玛
  rationale: 此处是人名而非普通词，采用中文传统音译，不按其词根含义意译。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 这是人名，采用中文圣经中通行且容易辨认的音译。
