  text: 又从迦得支派：基列的拉末及其牧场，玛哈念及其牧场。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: 又从……支派
  rationale: מַטֶּה在分配城邑的语境中指“支派”；前缀וּ与מִ合译为“又从”，自然承接上文。
- source_word: גָד
  choice: 迦得
  rationale: 采用现代中文圣经中通行的支派名称译法。
- source_word: רָאמוֹת בַּגִּלְעָד
  choice: 基列的拉末
  rationale: בְּ在地名组合中可表达地域关系；“基列的拉末”是自然且通行的中文地名形式，同时保留其位于或隶属基列的含义。
- source_word: מִגְרָשֶׁיהָ
  choice: 其牧场
  rationale: מִגְרָשׁ指划给利未城邑、位于城周围的开放用地，常供放牧；“牧场”简洁符合本段土地分配语境。
- source_word: מַחֲנַיִם
  choice: 玛哈念
  rationale: 采用该希伯来地名的通行中文音译。
- source_word: וְאֶת
  choice: 以及
  rationale: 带连词的直接宾语标记用于连接清单中的项目；译作“以及”使中文列举清晰自然。
