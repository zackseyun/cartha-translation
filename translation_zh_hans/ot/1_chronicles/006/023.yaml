  text: son of Izhar[a], son of Kohath, son of Levi, son of Israel.
translation:
  language: zh_hans
  text: 他是以斯哈的儿子；以斯哈是哥辖的儿子，哥辖是利未的儿子，利未是以色列[a]的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列”就是雅各的盟约之名。
    reason: 说明原文人名所指，同时不以解释性的“雅各”取代正文中的“以色列”。
lexical_decisions:
- source_word: בֶּן
  choice: ……的儿子
  rationale: 重复出现的 בֶּן 构成家谱链，直译为“……的儿子”既忠于原文，也符合现代汉语表达。虽然希伯来家谱有时会省略若干代，但本节本身没有理由改译为“后裔”。为避免汉语中连续所属关系产生歧义，后几代补明姓名作主语。
- source_word: יִצְהָר
  choice: 以斯哈
  rationale: 采用现代中文圣经传统中通行且易于辨认的人名译法。
- source_word: קְהָת
  choice: 哥辖
  rationale: 采用现代中文圣经传统中通行且易于辨认的人名译法。
- source_word: לֵוִי
  choice: 利未
  rationale: 采用现代中文圣经传统中的通行译名。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文明确使用“以色列”而非“雅各”，因此正文保留原名；其所指可在脚注中说明。
