  text: בְּנֵ֥י מְרָרִ֖י מַחְלִ֣י וּ/מֻשִׁ֑י וְ/אֵ֛לֶּה מִשְׁפְּח֥וֹת הַ/לֵּוִ֖י לַ/אֲבוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/004.yaml
  text: 'The sons of Merari: Mahli and Mushi[b][a]. These were the clans of the Levites according to their fathers’ houses.'
translation:
  language: zh_hans
  text: 米拉利的儿子是抹利和母示。这些是利未人的各宗族[a]，按着他们的父系家族[b]划分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”也可译作“家族”。这里指按血缘组成的群体，不只是核心家庭。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“按着他们的父亲”；在家谱语境中，意思是按父系的祖家归类。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是“儿子”的复数构造形式，用来引出家谱中的直系后代；此处随后只列两个人名，译作“儿子”比范围更广的“后代”更准确。
- source_word: מְרָרִי
  choice: 米拉利
  rationale: 人名，采用现代中文圣经中通行的音译。
- source_word: מַחְלִי
  choice: 抹利
  rationale: 人名，采用现代中文圣经中通行的音译。
- source_word: וּמֻשִׁי
  choice: 和母示
  rationale: 保留连接词，并采用现代中文圣经中通行的人名音译。
- source_word: וְאֵלֶּה
  choice: 这些是
  rationale: 指示代词引出对前述谱系的总结；省去希伯来语句首连接词的机械对应，使中文自然，同时不损失语义。
- source_word: מִשְׁפְּחוֹת
  choice: 各宗族
  rationale: 在支派和家谱语境中，该词指由亲属关系构成、通常大于核心家庭的群体；“宗族”比“家庭”更能表达这种社会单位。
- source_word: הַלֵּוִי
  choice: 利未人的
  rationale: 带冠词的单数族属形式在这里具有集合意义，所指是属于利未支派的人；中文用复数意义的“利未人”最自然。
- source_word: לַאֲבוֹתֵיהֶם
  choice: 按着他们的父系家族划分
  rationale: 字面为“按着他们的父亲”；在家谱分类语境中，是按父系祖家或父家归类。译文适度明示其分类含义，并用脚注交代字面形式。
