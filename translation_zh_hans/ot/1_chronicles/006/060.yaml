lexical_decisions:
- source_word: חוּקֹק
  choice: 户割
  rationale: 马所拉文本此处作地名“户割”；按现代中文圣经地名的常见音译处理，不以平行经文的“黑甲”替换正文。
- source_word: מִגְרָשֶׁיהָ
  choice: 其草场
  rationale: 指归属城邑、位于城周围的开放用地，常供放牧等共同用途；“草场”在利未城邑清单中简明且具体。
- source_word: רְחֹב
  choice: 利合
  rationale: 专有地名，采用现代中文圣经中通行的音译形式。
- source_word: וְאֶת
  choice: 还有／及
  rationale: וְ附于宾格标记אֶת；在连续列举中用“还有”承接上文，以“及”自然表达城邑与所属草场的关系。
