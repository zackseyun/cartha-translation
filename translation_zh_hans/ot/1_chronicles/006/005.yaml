lexical_decisions:
- source_word: לְגֵרְשׁוֹם
  choice: 革顺的后代
  rationale: 介词 לְ 在这里引出革顺的谱系。译作“革顺的后代”符合现代汉语家谱表达，也保留这是谱系标题而非父子关系链中又一环的功能。
- source_word: לִבְנִי
  choice: 立尼
  rationale: 人名按现代中文圣经常见译名音译。
- source_word: בְנוֹ
  choice: 他的儿子／……的儿子
  rationale: 原文三次使用带第三人称阳性单数后缀的“儿子”。汉语首处译作“他的儿子”，后两处明确重复父名，以免连续使用“他的”造成指代含混。
- source_word: יַחַת
  choice: 雅哈
  rationale: 人名采用现代中文圣经常见音译。
- source_word: זִמָּה
  choice: 薪玛
  rationale: 此处是人名，采用音译，不按同形词在其他语境中的普通名词意义翻译。
