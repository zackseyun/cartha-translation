base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
translation:
  language: zh_hans
  text: 以下是大卫在约柜安放妥当以后，派定负责雅威的殿中歌唱事奉[a]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “负责……歌唱事奉”也可译作“主管歌唱”或“为歌唱而设立”。希伯来语短语表示承担圣所歌唱职务的责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה אֲשֶׁר
  choice: 以下这些人
  rationale: 引出下文名单；“人”虽为汉语中按语境补出，但指向随后列出的男性利未人，使表达自然清楚。
- source_word: הֶעֱמִיד דָּוִיד
  choice: 大卫派来
  rationale: 使役形式在此表示使人担任特定职务；“派来”既表达任命，也适合其事奉场景。
- source_word: עַל יְדֵי שִׁיר
  choice: 负责……歌唱事奉
  rationale: 该短语兼有职责和歌唱职分之意；此译法自然地保留行政责任与敬拜服事两层含义。
- source_word: בֵּית יְהוָה
  choice: 雅威殿中
  rationale: “殿”在现代汉语中自然指敬拜场所；“雅威”直接音译经文中的神名。
- source_word: מִמְּנוֹחַ הָאָרוֹן
  choice: 约柜安放以后
  rationale: מְנוֹחַ 表示约柜获得安歇、固定安置；介词 מִן 在此具有时间起点含义，汉语译作“以后”自然明确。
- source_word: הָאָרוֹן
  choice: 约柜
  rationale: 原文仅作“柜”，但上下文明确指神圣的约柜；“约柜”是现代汉语读者易懂且准确的通用称呼。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”保留其专名性质，不以称号替代。
- issue: “殿”是否暗示所罗门圣殿已经建成
  choice: 按敬拜居所理解为“雅威殿”
  alternative: 雅威的家；雅威的居所
  rationale: בֵּית יְהוָה 是固定表达，可指雅威的敬拜居所，不必限定为后来建成的所罗门圣殿；中文“殿”在此简洁庄重，但不应据此推出建筑年代。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“歌唱事奉”保留礼仪敬拜语境；“约柜安放以后”用自然汉语表达原文直译“从约柜得安歇时起”的时间含义。
