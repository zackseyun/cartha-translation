  text: and Kedemoth with its pasturelands[a], and Mephaath with its pasturelands.
translation:
  language: zh_hans
  text: 还有基底莫及其郊野[a]，米法押及其郊野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郊野”或译“草场”“公用地”；希伯来语指属于城邑的城外开放土地。
    reason: 说明מִגְרָשׁ的词义范围，避免将其限定为仅供放牧的草地。
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: 基底莫
  rationale: 地名按现代中文圣经常见译名音译，不按词源意译。
- source_word: מִגְרָשֶׁיהָ
  choice: 其草场
  rationale: 该词指归属城邑的城外空地，常供放牧使用；“草场”简明自然，也符合利未城邑分配的语境。阴性单数后缀分别指前述各城。
- source_word: מֵיפַעַת
  choice: 米法押
  rationale: 地名按现代中文圣经常见译名音译。
- source_word: וְאֶת ... וְאֶת
  choice: 还有……及……，……及……
  rationale: 带连词的直接宾语标记承接上文的城邑清单；中文用“还有”显明续列关系，并以“及”连接城与附属草场，避免生硬直译。
