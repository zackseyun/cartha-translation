base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/051.yaml
  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
translation:
  language: zh_hans
  text: 哥辖子孙的各宗族[a]所分得的城邑[b]，是从以法莲支派分得的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各宗族”也可译作“各家族”；原文有“从……中”的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文直译作“他们疆域的城邑”；“疆域”也可指边界或地域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  choice: 各宗族中
  rationale: מִשְׁפָּחוֹת指较大的亲族群体，可译为“宗族”或“家族”；“中”保留介词מִן的部分或来源含义，连词则按中文列举语流不另译。
- source_word: בְּנֵי קְהָת
  choice: 哥辖子孙
  rationale: 字面为“哥辖的儿子们”，在谱系和支派语境中包括后裔；“哥辖子孙”既自然，也保留其谱系表达。
- source_word: וַיְהִי
  choice: 有
  rationale: 此处היה起存在或系词作用；译作“有”符合现代汉语，并避免生硬直译为“就成了”。
- source_word: עָרֵי גְבוּלָם
  choice: 他们辖境内的城邑
  rationale: עָרֵי意为“城邑”，גְבוּל可指边界、疆界或地域；上下文谈利未城邑的分配，采用“辖境内”表达地域含义，同时以脚注保留“边界上的城邑”的可能。
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: 来自以法莲支派
  rationale: מַטֶּה在土地和支派分配语境中指“支派”；“来自”准确表达介词מִן的来源含义。
