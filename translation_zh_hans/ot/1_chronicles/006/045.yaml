base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/045.yaml
  text: 'and from the tribe of Benjamin: Geba with its pasturelands[a], Alemeth with its pasturelands, and Anathoth with its pasturelands—all their cities were thirteen cities according to their families.'
translation:
  language: zh_hans
  text: 又从便雅悯支派分得迦巴和城外的牧场、亚勒篾[a]和城外的牧场、亚拿突和城外的牧场；他们所有的城，共十三座，按他们的宗族计算。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“亚勒篾”；《约书亚记》21:18的平行名单作“亚勒们”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  choice: 又从便雅悯支派得了
  rationale: מַטֶּה在分配土地的语境中指“支派”。“又从”承接上文的清单；“得了”按汉语句法补出，以表达上下文中分给利未人的城邑。
- source_word: גֶּבַע
  choice: 迦巴
  rationale: 按现代中文圣经人名地名的通行音译处理此地名。
- source_word: מִגְרָשֶׁיהָ
  choice: 城外的牧场
  rationale: מִגְרָשׁ指城周围供放牧等用途的公用空地；“城外的牧场”比单说“郊野”更清楚地表达其土地用途。
- source_word: עָלֶמֶת
  choice: 阿勒篾
  rationale: 依本节马所拉文本עָלֶמֶת音译，不以平行经文《约书亚记》21:18的“亚勒们”替换。
- source_word: עֲנָתוֹת
  choice: 亚拿突
  rationale: 采用该地名的通行中文音译。
- source_word: כָּל עָרֵיהֶם שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: 所得的城，共十三座
  rationale: 保留总结清单的功能；希伯来语数字后用单数עִיר，现代汉语自然表达为“十三座”。
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  choice: 他们各宗族
  rationale: מִשְׁפָּחוֹת在此指支派内部的家族或宗族群体；“各宗族”简明表达按宗族分配的含义。
