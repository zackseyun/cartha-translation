lexical_decisions:
- source_word: עָשָׁן
  choice: 亚珊
  rationale: 按马所拉文本音译此地名；虽然平行名单中的部分文本见证作“亚因”，本节正文仍忠实保留《历代志》的读法。
- source_word: מִגְרָשֶׁיהָ
  choice: 及其牧场
  rationale: מִגְרָשׁ指归属城邑、位于城外的公共空地或放牧用地；在利未人城邑的语境中译作“牧场”简洁自然，并以“其”表达阴性单数后缀。
- source_word: בֵּית שֶׁמֶשׁ
  choice: 伯示麦
  rationale: 采用现代中文圣经传统中通行的地名音译，不按字面译为“太阳之家”。
- source_word: וְאֶת
  choice: 及
  rationale: 希伯来文连词与直接宾语标记反复组织名单；中文不另译宾语标记，以“及”自然连接城邑和所属牧场。
