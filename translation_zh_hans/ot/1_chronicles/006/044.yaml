  text: 亚珊[a]及其牧场，伯示麦及其牧场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 平行经文的一些抄本和译本在这里作“亚因”，而不是“亚珊”；《历代志》的马所拉文本作“亚珊”。
