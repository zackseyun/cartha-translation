  text: וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּ֑ם נְתוּנִ֕ים לְ/כָ֨ל עֲבוֹדַ֔ת מִשְׁכַּ֖ן בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/033.yaml
  text: And their brothers the Levites were appointed for all the service of the tabernacle of the house of God[a].
translation:
  language: zh_hans
  text: 他们的弟兄，就是利未人，被指派负责上帝之家的帐幕的一切事务。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被指派”直译“被给予”，这里指被分派或委任承担职务。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 保留希伯来语的亲属称谓；在这里可广指同族弟兄。连接词 וַ 在中文名单语境中不必机械译作“并且”。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是对利未支派成员的标准、准确称呼。
- source_word: נְתוּנִים
  choice: 被派
  rationale: 该词是 נתן 的被动分词，字面为“被给予”，在此礼仪职务语境中表示被指派承担工作；正文采用自然的功能性表达，脚注保留字面意义。
- source_word: לְכָל עֲבוֹדַת
  choice: 办理……一切的事务
  rationale: לְ 表示所受指派的目的或范围；עֲבוֹדָה 在敬拜制度语境中指服役、工作或事务。“办理……事务”既自然，也避免引入后期教会色彩浓厚的术语。
- source_word: מִשְׁכַּן
  choice: 帐幕
  rationale: 这是 מִשְׁכָּן 在以色列敬拜场所语境中的通行译法，同时保留其与“上帝之家”并列所形成的措辞张力。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝之家
  rationale: 按原文译出“上帝的家”，不将其直接同化为“圣殿”，从而保留原文的具体措辞。
theological_decisions:
- issue: “帐幕”与“上帝之家”的关系
  choice: 将两者都明确译出为“上帝之家的帐幕”
  alternative: 合并译为“上帝的圣殿”或只译“上帝之家”
  rationale: 原文同时包含 מִשְׁכַּן 和 בֵּית הָאֱלֹהִים；保留两者可避免消解《历代志》在帐幕与上帝之家用语之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“事务”体现礼仪场所中的实际服役范围；保留“帐幕”和“上帝之家”两个称谓，不把它们简化为单一的“圣殿”概念。
