lexical_decisions:
- source_word: בְּנֵי קְהָת
  choice: 哥辖的儿子是
  rationale: 保留希伯来语家谱引介语的父子措辞；“哥辖”采用现代中文圣经中通行的人名音译。
- source_word: עַמִּינָדָב
  choice: 亚米拿达
  rationale: 按希伯来文本音译该专名，不因平行家谱作无明文支持的改写。
- source_word: בְּנוֹ
  choice: 的儿子
  rationale: 逐次明确前后人物的父子关系，既对应希伯来语单数名词及第三人称阳性单数后缀，也避免中文连续使用“他的儿子”可能产生的指代歧义。
- source_word: קֹרַח
  choice: 可拉
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אַסִּיר
  choice: 亚惜
  rationale: 作为专名音译，采用现代中文圣经中较通行的形式，不按其可能的普通词词义翻译。
