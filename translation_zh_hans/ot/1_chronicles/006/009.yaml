  text: Tahath his son[a], Uriel his son, Uzziah his son, and Shaul his son.
translation:
  language: zh_hans
  text: 他的儿子是他哈；他哈的儿子是乌列；乌列的儿子是乌西雅；乌西雅的儿子是沙乌勒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沙乌勒”这个希伯来名字通常译作“扫罗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: 他哈
  rationale: 族谱中的人名，按希伯来语音译，并采用现代中文圣经中易于辨认的写法。
- source_word: בְּנוֹ
  choice: 他的儿子／某人的儿子
  rationale: בֵּן在族谱中通常指“儿子”，虽有时可泛指后裔；正文保留标准的父子表述，并依希伯来语连续结构补明各代关系，使中文自然清楚。
- source_word: אוּרִיאֵל
  choice: 乌列
  rationale: 按希伯来语音译的人名，采用现代中文中通行且易辨认的形式。
- source_word: עֻזִּיָּה
  choice: 乌西雅
  rationale: 按希伯来语音译的人名；“乌西雅”是中文圣经中通行的形式。
- source_word: וְשָׁאוּל
  choice: 沙乌勒
  rationale: 连词וְ在中文列举的末项中由句式表达；人名采用较直接反映希伯来语שָׁאוּל读音的“沙乌勒”，并以脚注说明常见译名。
