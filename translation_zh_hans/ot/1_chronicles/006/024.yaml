base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
translation:
  language: zh_hans
  text: 他的弟兄亚萨站在他右边[a]。亚萨是比利家的儿子，比利家是示米亚的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在他的右手旁”；这是希伯来语表示位于某人右侧的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָחִיו
  choice: 他的弟兄
  rationale: וְ为连接词；אָח带第三人称阳性单数后缀，直译为“他的弟兄”。“弟兄”既保留原文亲属称谓，也较适合此处利未人谱系与职分安排的语境。
- source_word: אָסָף
  choice: 亚萨
  rationale: 按现代中文圣经通行译名音译；原文两次出现，译文也重复其名，以保留原文先指出位置、再交代谱系的结构。
- source_word: הָעֹמֵד
  choice: 站在
  rationale: 这是עמד的Qal主动分词，描述亚萨所处的位置；中文用“站在”自然地保留持续性的位置含义，不必强行改成带完成意味的过去时。
- source_word: עַל יְמִינוֹ
  choice: 在他右边
  rationale: 该介词短语表示位于某人的右侧。“在他右边”是自然、准确的现代汉语表达；“他”依上下文指前述人物。
- source_word: בֶּן
  choice: 是……的儿子
  rationale: 原文两次使用标准谱系用语בֶּן。译文展开为两个并列分句，使父子关系清楚，同时保留“亚萨—比利家—示米亚”的连续谱系。
- source_word: בֶּרֶכְיָהוּ
  choice: 比利家
  rationale: 采用现代中文圣经中常见的人名译法。
- source_word: שִׁמְעָא
  choice: 示米亚
  rationale: 采用现代中文圣经中常见的人名译法，以区别并准确呈现此希伯来专名。
theological_decisions: []
