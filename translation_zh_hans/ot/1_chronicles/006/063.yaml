base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
translation:
  language: zh_hans
  text: 在耶利哥对面的约旦河东岸，从流便支派所得的是：旷野中的比悉和它的牧场，以及雅杂[a]和它的牧场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅杂”也译作“雅哈斯”。
    reason: 保留该地名的常见异译，帮助读者辨认相关经文中的同一地点。
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ
  choice: 在耶利哥附近的约旦河对岸
  rationale: 该地理短语指约旦河以东、与耶利哥相对一带；译文用自然的现代汉语表达其方位关系，不把“耶利哥”误作所得之城。
- source_word: לְמִזְרַח הַיַּרְדֵּן
  choice: 也就是约旦河东边
  rationale: מִזְרָח表示“东边、东方”；“也就是”表明此语进一步说明前面的“约旦河对岸”。
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: 从流便支派所得的有
  rationale: מַטֶּה在土地分配语境中指“支派”；补出“所得的有”，使本节作为城邑分配清单在汉语中句意完整。
- source_word: בֶּצֶר בַּמִּדְבָּר
  choice: 旷野中的比悉
  rationale: בֶּצֶר是地名，按中文圣经惯用形式译作“比悉”；מִדְבָּר在此为辨明该城位置的“旷野”。
- source_word: מִגְרָשֶׁיהָ
  choice: 附属的牧场
  rationale: 在利未人城邑清单中，מִגְרָשׁ指城周围供放牧等用途的公共空地；“附属的牧场”既说明归属，也符合本段语境。
- source_word: יַהְצָה
  choice: 雅杂
  rationale: 地名按希伯来语形式及中文传统译名处理；另一个常见名称形式在脚注说明。
