revisions:
- from: 在耶利哥附近的约旦河对岸，也就是约旦河东边，从流便支派所得的有：旷野中的比悉和附属的牧场，以及雅杂[a]和附属的牧场。
  to: 在耶利哥对面的约旦河东岸，从流便支派所得的是：旷野中的比悉和它的牧场，以及雅杂[a]和它的牧场。
  rationale: 修订将地理定位改为“在耶利哥对面的约旦河东岸”，完整反映原文的相对位置及东岸说明；删去“也就是”的解释性连接。其余维持城邑分配清单的简洁庄重语体，并以“它的牧场”对应各城邑后重复出现的所有格。
