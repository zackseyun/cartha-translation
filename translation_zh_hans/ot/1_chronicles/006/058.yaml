  text: 拉末及其城外的牧场，亚念[a]及其城外的牧场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“亚念”；平行名单在约书亚记21:25作“亚乃”。
    reason: alternative_reading
lexical_decisions:
- source_word: רָאמוֹת
  choice: 拉末
  rationale: 按希伯来语地名音译；采用中文圣经地名中自然、通行的译写形式。
- source_word: מִגְרָשֶׁיהָ
  choice: 其城外的牧场
  rationale: מִגְרָשׁ指划给城邑、位于城外的公共空地，在利未人城邑的语境中主要供放牧使用；“城外的牧场”兼顾其位置与用途。阴性单数后缀译作“其”，分别回指每座城。
- source_word: עָנֵם
  choice: 亚念
  rationale: 按马所拉文本的地名עָנֵם音译，不以平行经文的不同名称改正文；差异保留在脚注中。
- source_word: וְאֶת
  choice: 及
  rationale: וְ连接清单项目，אֶת是宾语标记，现代汉语无需另译；用“及”自然呈现各城与所属牧场的并列关系。
