  text: 希列斯[a]及其草场，底璧及其草场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希列斯”依照《历代志》此处的希伯来文本转写；《约书亚记》21:15的平行名单作“何仑”。
    reason: alternative_reading
lexical_decisions:
- source_word: חִילֵז
  choice: 希连
  rationale: 按《历代志》此处马所拉文本的读音转写地名；末字母虽写作 ז，但元音标注呈现接近“希连”的读法。
- source_word: מִגְרָשֶׁיהָ
  choice: 城的草场
  rationale: 指分给利未人城邑周围用于放牧等用途的附属空地；结合汉语清单语境译作“城的草场”，明确阴性代词所指为该城。
- source_word: דְּבִיר
  choice: 底璧
  rationale: 采用该圣经地名在现代中文中的通行译名。
- source_word: וְ/אֶת
  choice: 和
  rationale: 连接清单中的项目；宾格标记本身不另译，以自然汉语的并列结构体现。
- source_word: אֶת
  choice: 不译
  rationale: 希伯来语确定宾语标记在汉语中没有对应词，其句法作用由清单结构表达。
