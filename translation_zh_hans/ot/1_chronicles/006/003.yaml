lexical_decisions:
- source_word: וּבְנֵי
  choice: 的儿子是
  rationale: בְנֵי 是“儿子”的复数构造形式；本节所列为哥辖的亲生儿子，故不用范围较宽的“后代”。句首 וּ 承接家谱上文，中文家谱列表中不必机械译作“和”，以自然句式体现连续关系。
- source_word: קְהָת
  choice: 哥辖
  rationale: 采用现代中文圣经读者熟悉的希伯来人名传统译法。
- source_word: עַמְרָם
  choice: 暗兰
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וְיִצְהָר
  choice: 以斯哈
  rationale: 采用通行的人名译法；前缀 וְ 在中文列举结构中由顿号体现，不逐项译出。
- source_word: וְחֶבְרוֹן
  choice: 希伯伦
  rationale: 此处是人名而非地名；采用通行音译，并由家谱语境明确其身份。
- source_word: וְעֻזִּיאֵל
  choice: 乌薛
  rationale: 采用现代中文圣经中通行的人名译法；末项前的 וְ 译为“和”。
