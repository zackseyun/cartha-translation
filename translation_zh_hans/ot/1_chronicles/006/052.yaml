base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/052.yaml
  text: 'They gave them the cities of refuge: Shechem with its pasturelands in the hill country of Ephraim[a], and Gezer with its pasturelands.'
translation:
  language: zh_hans
  text: 他们把逃城给了他们，就是以法莲山区的示剑及其城郊的牧场，还有基色及其城郊的牧场[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式对应地译：“他们把逃城给了他们：以法莲山区的示剑及其城郊的牧场，以及基色及其城郊的牧场。”
    reason: 保留原文中“逃城”后接两座城及其所属牧地的列举句法；不预先判定该句法所引出的历史或文本问题。
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 他们把……给了
  rationale: 该叙事形式表示接续发生的行动；现代汉语无需另译句首连接词，也能自然承接上下文。
- source_word: לָהֶם
  choice: 给了他们
  rationale: 代词所指由上文确定，保留原文第三人称复数形式，不在本节补明身份。
- source_word: עָרֵי הַמִּקְלָט
  choice: 逃城
  rationale: 这是以色列律法中指定庇护城邑的固定术语；“逃城”简洁、通行，也保留其制度性含义。
- source_word: שְׁכֶם
  choice: 示剑
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: מִגְרָשֶׁיהָ
  choice: 城郊的牧场
  rationale: 该词指归属城邑、位于城周围的开放地带，尤其供放牧使用；此译法兼顾空间位置与利未城语境中的用途。
- source_word: בְּהַר אֶפְרָיִם
  choice: 以法莲山区
  rationale: 此短语指与以法莲相关的山地地区，并非单独一座山；“山区”自然准确。
- source_word: גֶּזֶר
  choice: 基色
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: וְאֶת ... וְאֶת
  choice: 就是……以及……
  rationale: 用现代汉语列举结构表达希伯来语重复的连词与宾语标记，同时清楚呈现两座城及各自所属牧场。
theological_decisions:
- issue: “逃城”与后列城名之间的句法关系
  choice: 将“示剑”和“基色”都列为所给的“逃城”
  alternative: 仅把示剑明确视为逃城，把基色视为另加的一座城
  rationale: 马所拉文本的自然表层句法可把后列两城都置于“逃城”之下；但平行经文和制度背景使这一表达存在张力，因此正文不擅自改写，脚注提示更形式对应的结构。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“城郊的牧场”比单用“郊野”更具体，也避免古奥；地名采用中文圣经传统的通行译名。
