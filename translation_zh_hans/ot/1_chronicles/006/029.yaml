base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/029.yaml
  text: 'And the sons of Merari[a], their brothers, were on the left: Ethan son of Kishi, son of Abdi, son of Malluch.'
translation:
  language: zh_hans
  text: 米拉利的子孙，就是他们的弟兄[a]；在左边的是以探，基示的儿子；基示是亚伯底的儿子；亚伯底是玛鹿的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亲族”。希伯来文“弟兄”在宗族谱系中可泛指同族或同支派的亲属。
    reason: 说明 אֲחֵיהֶם 在此宗族语境中的较广义用法，同时保留正文的字面亲属称呼。
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: 米拉利的子孙
  rationale: בְּנֵי 字面可译“儿子们”，但在支派谱系中常指后裔或宗族成员；此处用“子孙”更符合现代汉语谱系表达，也避免让读者误以为仅指米拉利的亲生儿子。
- source_word: אֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 保留希伯来文“弟兄”的亲属性称呼；在此宗族语境中也可能泛指同族的人，因此加脚注说明。
- source_word: עַל הַשְּׂמֹאול
  choice: 在左边
  rationale: 按原文保留空间方位；本节承接上文的排列语境，汉语无需额外补出具体参照物。
- source_word: אֵיתָן
  choice: 以探
  rationale: 按现代中文圣经人名惯用音译处理。
- source_word: בֶּן
  choice: 是……的儿子
  rationale: 谱系链中的 בֶּן 通常表示“儿子”；用重复的汉语句式明确各代关系，避免连续“某某的儿子某某的儿子”产生歧义。
- source_word: קִישִׁי
  choice: 基示
  rationale: 按现代中文圣经人名惯用音译处理。
- source_word: עַבְדִּי
  choice: 亚伯底
  rationale: 按现代中文圣经人名惯用音译处理。
- source_word: מַלּוּךְ
  choice: 玛鹿
  rationale: 按现代中文圣经人名惯用音译处理。
