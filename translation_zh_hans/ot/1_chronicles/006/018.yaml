base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
translation:
  language: zh_hans
  text: 以下是任职[a]的人和他们的儿子：哥辖族人中[b]有歌唱者希幔，他是约珥的儿子，约珥是撒母耳的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “任职”原文直译为“站立”；这里可能指站在指定岗位上供职。
    reason: lexical_alternative
  - marker: b
    text: “哥辖族人中”原文直译为“哥辖族人的众子中”，即哥辖的后裔中。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 用于引出名单，符合现代汉语表达；上下文已自然体现希伯来语连接词 וְ 的承接作用，无须机械译作“并且”。
- source_word: הָעֹמְדִים
  choice: 任职的人
  rationale: עמד 字面为“站立”，在此圣殿歌唱人员的组织语境中指站在岗位上履职的人；“任职”自然传达其语境含义，脚注保留字面意象。
- source_word: וּבְנֵיהֶם
  choice: 和他们的儿子
  rationale: 保留简单连接词及 בנים 的直接亲属意义，不擅自改作“与他们一同”或泛化为“后裔”。
- source_word: מִבְּנֵי הַקְּהָתִי
  choice: 哥辖族人中
  rationale: 该短语字面涉及“哥辖族人的众子”，实际标明宗族归属；此译简洁自然，也避免生硬的“哥辖人的儿子中”。
- source_word: הֵימָן הַמְשׁוֹרֵר
  choice: 歌唱者希幔
  rationale: מְשׁוֹרֵר 特指歌唱的人；“歌唱者”比范围更广的“乐师”贴近原词。希幔采用中文圣经通行音译。
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  choice: 希幔是约珥的儿子，约珥是撒母耳的儿子
  rationale: 将连续两个“之子”关系明确展开，消除现代汉语可能误读，同时完整保留谱系次序。
