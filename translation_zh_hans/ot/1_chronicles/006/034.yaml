  text: וְֽ/אַהֲרֹ֨ן וּ/בָנָ֜י/ו מַקְטִירִ֨ים עַל מִזְבַּ֤ח הָֽ/עוֹלָה֙ וְ/עַל מִזְבַּ֣ח הַ/קְּטֹ֔רֶת לְ/כֹ֕ל מְלֶ֖אכֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים וּ/לְ/כַפֵּר֙ עַל יִשְׂרָאֵ֔ל כְּ/כֹל֙ אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד הָ/אֱלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
translation:
  language: zh_hans
  text: 亚伦和他的儿子们在燔祭坛和香坛上焚烧供物，办理至圣所的一切事务[a]，并为以色列赎罪，照着神的仆人摩西一切所吩咐的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为一切至圣之物办理事务。”希伯来语短语既可指“至圣所”，也可指“至圣之物”。
    reason: 保留קֹדֶשׁ הַקֳּדָשִׁים在地点与至圣之物之间的词义歧义，并使替代译文符合现代汉语语序。
lexical_decisions:
- source_word: מַקְטִירִים
  choice: 焚献
  rationale: 该词是קטר的使役分词，表示使祭物或香焚烧上升。上下文同时提到燔祭坛和香坛，因此用“焚献”概括两种坛上的焚烧献奉，不额外加入原文未明说的“祭牲”。
- source_word: מִזְבַּח הָעוֹלָה
  choice: 燔祭坛
  rationale: 采用现代中文圣经语境中清楚而简洁的固定表达，指献燔祭的坛。
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: 香坛
  rationale: 简明对应献香所用的坛，符合现代中文宗教语境的常用说法。
- source_word: לְכֹל מְלֶאכֶת
  choice: 办理……的一切事务
  rationale: מְלָאכָה在圣所语境中指受托的工作或职务；“办理……的一切事务”既自然，也不把范围过度限定为礼仪或行政工作。
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: 至圣所
  rationale: 该短语可指最里面的圣所，也可指“至圣之物”。这里处于祭司供职、祭坛和赎罪的语境中，地点理解通顺，但以脚注保留另一种真实可能。
- source_word: וּלְכַפֵּר עַל יִשְׂרָאֵל
  choice: 并为以色列赎罪
  rationale: “赎罪”保留כפר在祭司礼仪中的宽泛含义，不将其收窄为某一种特定的赎罪理论。
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: 完全照着……所吩咐的
  rationale: “完全照着”表达כְּכֹל אֲשֶׁר所强调的全面遵行。
- source_word: עֶבֶד הָאֱלֹהִים
  choice: 神的仆人
  rationale: 保留摩西的正式称号，表达庄重而符合现代标准汉语。
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים的所指
  choice: 正文译为地点“至圣所”
  alternative: “至圣之物”
  rationale: 祭坛事奉及赎罪的上下文支持地点理解，但希伯来语也可表示具有最高圣洁程度的事物，因此用脚注保留歧义。
- issue: כפר的含义
  choice: 赎罪
  alternative: 施行遮罪／洁除罪污
  rationale: “赎罪”在中文中能够承载祭司礼仪的广义含义，同时避免替原文指定某一种神学机制。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“焚献”兼顾燔祭坛与香坛，不把原文宽泛的礼仪动作拆解或增补为两种明说的行为；句式保持经文叙述的正式感。
