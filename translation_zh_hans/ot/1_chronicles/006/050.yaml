base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/050.yaml
  text: They assigned by lot from the tribe of the sons of Judah[a], and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities, which they called by name.
translation:
  language: zh_hans
  text: 他们拈阄，从犹大子孙的支派、西缅子孙的支派和便雅悯子孙的支派中，分配了以下这些按名列出的城[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按名列出”直译为“按名字称呼它们”；这是引出下文城名清单的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 分配了
  rationale: 该词基本义为“给”，但这里指借拈阄划分利未人的城邑；“分配”既符合行政分地的语境，也比单用“给”更清楚。
- source_word: בַגּוֹרָל
  choice: 拈阄
  rationale: 保留借抽签决定分配结果的具体方式；“拈阄”是现代中文圣经语体中清楚而庄重的表达。
- source_word: מִמַּטֵּה
  choice: 从……的支派中
  rationale: מַטֶּה在此是以色列部族意义的“支派”，介词מִן表示这些城邑所属地域的来源。
- source_word: בְנֵי יְהוּדָה / בְנֵי שִׁמְעוֹן / בְּנֵי בִנְיָמִן
  choice: 犹大子孙／西缅子孙／便雅悯子孙
  rationale: 保留历代志中反复出现的族谱和部族性表达“某人的子孙”，同时符合自然中文。
- source_word: הֶעָרִים הָאֵלֶּה
  choice: 以下这些……城
  rationale: “以下”明确指向随后列出的城名，仍保留指示词“这些”的功能；עָרִים译作“城”。
- source_word: אֲשֶׁר יִקְרְאוּ אֶתְהֶם בְּשֵׁמוֹת
  choice: 按名列出的
  rationale: 希伯来文直译近似“按名字称呼它们”，在这里是引出下文逐一列名的公式化说法。“按名列出”传达其篇章功能，直译形式则收入脚注。
