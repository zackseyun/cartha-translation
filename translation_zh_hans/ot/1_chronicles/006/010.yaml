  choice: ……的儿子是
  rationale: בְנֵי是“儿子们”的构造形，连接后面的专名；句首ו承接家谱脉络，在中文中可由上下文和句式自然体现，不必机械译作“并且”。
- source_word: אֶלְקָנָה
  choice: 以利加拿
  rationale: 按现代中文圣经人名的通行音译处理此专名。
- source_word: עֲמָשַׂי
  choice: 亚玛赛
  rationale: 按希伯来语读音音译该人名；英语拼写Amasai与Amassai的差别不构成中文异译依据。
- source_word: וַ/אֲחִימוֹת
  choice: 和亚希摩
  rationale: 前缀ו译作“和”，专名אֲחִימוֹת按希伯来语读音音译为“亚希摩”。
