  text: They gave them Hebron in the land of Judah[a], with its pasturelands around it.
translation:
  language: zh_hans
  text: 他们把位于犹大地的希伯仑及其四围的牧场[a]给了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公用地”。希伯来语所指的是附属于城邑的空地，常用于放牧。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 他们……给了
  rationale: 这是נתן的Qal连续式叙事形式，表示“于是／然后他们给了”。现代汉语可不另译句首连接词，以自然的叙事语序表达。
- source_word: לָהֶם
  choice: 给了他们
  rationale: 介词ל标示间接宾语；译作“给了他们”符合现代汉语习惯。
- source_word: חֶבְרוֹן
  choice: 希伯仑
  rationale: 采用该地名在现代中文圣经传统中的通行音译。
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: 犹大地的
  rationale: אֶרֶץ可指“地”或“境内”；这里修饰希伯仑，译为“犹大地的希伯仑”既保留地理归属，也自然简明。
- source_word: מִגְרָשֶׁיהָ
  choice: 城……的牧场
  rationale: מִגְרָשׁ指附属于城邑的城外空地，常供放牧使用。正文用易懂的“牧场”，并以脚注保留“公用地／空地”的词义范围。
- source_word: סְבִיבֹתֶיהָ
  choice: 城四围的
  rationale: 阴性单数后缀回指希伯仑，表示其周围区域；汉语补出“城”可明确所指，且“四围”保持庄重而易懂的经文语体。
