base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/033.yaml
  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
translation:
  language: zh_hans
  text: 那时，林中的树木要在雅威面前欢呼[a]，因为他来[b]审判大地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“欢唱”。希伯来语动词可指因喜乐而高声歌唱或呼喊。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他正来临”。这里的希伯来语形式在诗歌中可鲜明地表达确定将要发生的行动。
    reason: lexical_alternative
  - marker: c
    text: 或译：“那地”。希伯来语词既可指特定的土地，也可指大地；这里较广的受造界语境支持译作“大地”。
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 这是引出随后景象的时间副词；“那时”自然、庄重，也保留诗歌中的推进感。
- source_word: יְרַנְּנוּ
  choice: 都要……欢呼
  rationale: רנן 的 Piel 形表达喜乐地高声发出声音，可指欢唱或欢呼；“欢呼”适合树木拟人化的诗意描写，并以“要”体现未完成式在本处的将来意味。
- source_word: עֲצֵי הַיָּעַר
  choice: 林中的树木
  rationale: 直接表达“森林的树木”这一属格结构，在现代汉语中简洁自然，同时保留受造界拟人化。
- source_word: מִלִּפְנֵי
  choice: 在……面前
  rationale: 该表达在此指身处神的临在之中；“在……面前”准确且符合现代汉语习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文使用的专名，不以称号代替。
- source_word: כִּי
  choice: 因为
  rationale: 引出树木欢呼的原因，现代汉语中“因为”清楚自然。
- source_word: בָא
  choice: 他来
  rationale: 完成式在诗歌语境中可把将临且确定的行动鲜明地呈现出来；“他来”保留这种简洁、临场的张力，不限定为过去或进行时。
- source_word: לִשְׁפּוֹט
  choice: 审判
  rationale: 该不定式表达来临的目的；“审判”直接保留司法裁断及施行公义治理的含义。
- source_word: הָאָרֶץ
  choice: 全地
  rationale: אֶרֶץ 可指地、土地或大地；本节的受造界颂赞语境支持普世范围。“全地”在中文圣经诗歌语体中自然，同时脚注保留“那地”的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名，正文采用较贴近常见学术重构读音的“雅威”，从而把专名与“主”等称号区分开；脚注并非必要，因为这里不存在文本异读。
- issue: הָאָרֶץ 的范围
  choice: 全地
  alternative: 那地
  rationale: 上下文描写林木等受造界在雅威面前欢呼，较广的宇宙性语境支持“全地”；但希伯来词本身也可指特定土地，因此以脚注保留较局部的理解。
- issue: בָא 的时间与体貌
  choice: 他来
  alternative: 他正来临
  rationale: 诗歌中的完成式可将即将发生或确定发生之事呈现得如同眼前事实；正文不把它明确收窄为过去、将来或进行体，脚注说明另一种自然表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。语序保持简洁，以“林中的树木”保留拟人化；“欢呼”兼顾歌唱与呼喊的语义范围；“他来”刻意保留希伯来诗歌完成式所具有的鲜明确定感。所有脚注标记均置于相关词语之后。
