source:
  edition: WLC
  text: יִשְׂמְח֤וּ הַ/שָּׁמַ֨יִם֙ וְ/תָגֵ֣ל הָ/אָ֔רֶץ וְ/יֹאמְר֥וּ בַ/גּוֹיִ֖ם יְהוָ֥ה מָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/031.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; and let them say among the nations, “Yahweh reigns!”
translation:
  language: zh_hans
  text: '愿诸天欢喜，愿大地快乐；

    愿人们在列国中宣告：

    “雅威[a]作王！”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יְהוָה的音译，传统上也译作“耶和华”。
    reason: 说明神名的译法及常见传统译名。
  - marker: b
    text: “作王”也可译作“已经作王”或“是王”。
    reason: 原文完成式在王权宣告中兼有已经确立和当前统治的可能意味。
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: 愿……欢喜
  rationale: 该词为שׂמח的Qal未完成式第三人称阳性复数；在本诗歌的平行祈愿句式中带有意愿、召唤意味，故译为“愿……欢喜”。
- source_word: הַשָּׁמַיִם
  choice: 诸天
  rationale: שׁמים在形态上为复数，在天地并列的宇宙性赞美语境中指诸天；“诸天”既保留复数意味，也符合庄重的诗歌语体。
- source_word: וְתָגֵל
  choice: 愿……快乐
  rationale: גיל表示喜乐、欢跃。译作“快乐”既传达其含义，也避免与上一分句的“欢喜”完全重复。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 该词与“诸天”平行，所指是整个大地而非某一特定地域；“大地”在现代汉语中自然且具有诗意。
- source_word: וְיֹאמְרוּ
  choice: 愿人们……宣告
  rationale: אמר的Qal未完成式第三人称复数延续前文的祈愿语气。希伯来文未明说主语所指，汉语补出泛指的“人们”；“宣告”体现这句话要在列国中公开传扬的语境。
- source_word: בַגּוֹיִם
  choice: 在列国中
  rationale: גוים在此泛指世上各国、各族，而非后期宗教对比意义上的“外邦人”；“列国”符合诗歌和公共宣告的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，不以称号替代。
- source_word: מָלָךְ
  choice: 作王
  rationale: מלך的完成式在颂赞和王权宣告中可表达君王统治的现实。“作王”简洁庄重，并保留它在“已经登基作王”与“正掌权为王”之间的语义张力。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名。正文采用较能反映学界通常重构读音的“雅威”，脚注说明传统译名，避免把专名改为“主”这一称号。
- issue: מָלָךְ所表达的王权时态
  choice: 作王
  alternative: 已经作王／是王
  rationale: 希伯来语完成式既可能突出作王事实已经确立，也可在礼仪性宣告中陈述当前的统治现实。正文不加入“了”或“已经”，以免强行限定为某一时间转折；脚注保留其他可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以“愿……愿……愿……”再现三重祈愿和平行结构，并分行保留诗歌节奏。“诸天—大地—列国”维持原文由宇宙到万民的展开。
