  text: זֶ֚רַע יִשְׂרָאֵ֣ל עַבְדּ֔/וֹ בְּנֵ֥י יַעֲקֹ֖ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/013.yaml
  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
translation:
  language: zh_hans
  text: 以色列——他的仆人——的后裔[a]，雅各的众子[b]，他所拣选的人[c]啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文直译为“种子”，是表示众多子孙的集合单数。
    reason: lexical_alternative
  - marker: b
    text: “众子”也可译作“子孙”；原文直译为“雅各的儿子们”。
    reason: lexical_alternative
  - marker: c
    text: “他所拣选的人”也可译作“他的选民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: 后裔
  rationale: 这里是集合意义的单数名词，指以色列的子孙。“后裔”在现代汉语中自然、庄重，也能表达群体含义；直译“种子”容易造成误解。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: עַבְדּוֹ
  choice: 他的仆人
  rationale: עבד可指仆人或奴仆；这里是以色列与神之间的身份称谓，“仆人”既准确又不过分突出社会奴役含义。破折号标明该词与“以色列”同位，避免误读为“以色列之仆人的后裔”。
- source_word: בְּנֵי
  choice: 众子
  rationale: 保留希伯来语阳性复数“儿子们”的形式及其宗族表达，同时用“众”体现复数；脚注列出自然的群体译法“子孙”。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בְּחִירָיו
  choice: 他所拣选的人
  rationale: 明确表达复数的被拣选者，语义自然，并避免把名词化术语处理得过于教义化。
theological_decisions:
- issue: “他的仆人”和“他所拣选的人”中第三人称阳性单数后缀的所指
  choice: 保留“他”，按上下文自然理解为神；以色列是他的仆人，雅各的众子是他所拣选的人。
  alternative: 直接译成“神的仆人”和“神所拣选的人”。
  rationale: 原文只用代词后缀，没有重复神名。保留“他”忠实呈现原文指称方式，也不消除诗句中由上下文确定所指的特点。
translation_notes:
  register: 采用现代、庄重而易懂的呼语体。破折号凸显“他的仆人”是“以色列”的同位说明；末尾“啊”承载希伯来诗歌中对群体的直接呼唤。所有脚注标记均置于对应词语之后。
