    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: 他又将这事……确立为
  rationale: עמד的使役形表示使某事站立、稳固或生效；在盟约语境中译作“确立”自然且保留使之有效、坚定的含义。以“这事”承接阴性单数后缀，避免把所指过早限定为“约”或“誓言”；“又”体现句首连接词。
- source_word: לְיַעֲקֹב
  choice: 向雅各
  rationale: 介词ל在此标示接受者或受益者；“向雅各”既贴近原文，也与下句“向以色列”形成平行。
- source_word: לְחֹק
  choice: 为律例
  rationale: חֹק指固定的法规、定例或法令；“律例”保留正式、约法性的语气。
- source_word: לְיִשְׂרָאֵל
  choice: 向以色列
  rationale: 保留原文与“向雅各”对应的重复，不把雅各和以色列的称谓合并或改写。
- source_word: בְּרִית עוֹלָם
  choice: 为永远的约
  rationale: “约”准确保留בְּרִית的核心盟约含义；“永远的”表达עוֹלָם在此语境中的持久、恒常，同时不额外界定哲学意义上的无限时间。
theological_decisions:
- issue: וַיַּעֲמִידֶהָ中阴性单数后缀的所指
  choice: 用“这事”含蓄回指上文的盟约性承诺或誓言
  alternative: 明确译作“这约”或“这誓言”
  rationale: 上文将约、所说的话和誓言紧密并列；原文代词本身没有在本节重新指明所指。译作“这事”保留回指空间，避免把它单一限定为约或誓言。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留“雅各／以色列”和“律例／约”的诗歌平行结构。所有脚注标记均置于正文相应词语之后。
