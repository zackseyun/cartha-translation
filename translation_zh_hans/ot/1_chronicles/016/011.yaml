  text: דִּרְשׁ֤וּ יְהוָה֙ וְ/עֻזּ֔/וֹ בַּקְּשׁ֥וּ פָנָ֖י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/011.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: zh_hans
  text: 要寻求耶和华和他的力量；要不断寻求他的面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的同在”；直译：“他的面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: 寻求
  rationale: 此处命令人主动转向并追求神，不只是向他询问；“寻求”自然保留了这种劝勉力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字译法“耶和华”，将专名与“主”这一称号区分开来。
- source_word: וְעֻזּוֹ
  choice: 和他的力量
  rationale: עֹז在这里直接表示力量、能力；与“寻求他的面”并列，指向神所具有并赐下的能力，而非地点意义的堡垒。
- source_word: בַּקְּשׁוּ
  choice: 寻求
  rationale: בקש表达恳切追求，与前句דרש构成平行；同译为“寻求”可保留诗句的呼应，不强行扩大两词差异。
- source_word: פָנָיו
  choice: 他的面
  rationale: 直译为“他的面”，保留希伯来文具体而富有神学意蕴的表达；其习语义“他的同在”在脚注说明。
- source_word: תָּמִיד
  choice: 不断
  rationale: תמיד表示持续、经常而不止息；“不断”在现代汉语中简洁自然，并保留持续性的劝勉。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用历史悠久、普通读者熟悉的专名“耶和华”，而不以称号“主”替代；“雅威”则是另一种更接近学术重构读音的音译。
- issue: “寻求他的面”的理解
  choice: 正文保留“他的面”
  alternative: 他的同在
  rationale: 原文明确使用“面”，同时这一希伯来习语可指亲近神、来到他面前并寻求他的同在。正文保留意象，脚注呈现习语含义，避免只保留其中一种解释。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。两个命令句均用“要寻求”，保留原文平行结构；用分号呈现两分句的紧密关系。
