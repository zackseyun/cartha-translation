  yaml_path: translation/ot/1_chronicles/016/016.yaml
  text: which he made with Abraham[a], and his oath to Isaac—
translation:
  language: zh_hans
  text: 就是他与亚伯拉罕所立的约[a]，向以撒所起的誓—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立”原文直译为“切”；“切约”是希伯来语惯用说法，意思是“立约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 就是……所……的
  rationale: 关系词承接上一节的“约”；用“就是”自然衔接，同时表明本节仍是未完的诗句。
- source_word: כָּרַת אֶת־אַבְרָהָם
  choice: 与亚伯拉罕所立的约
  rationale: כרת字面为“切”，但与上一节的“约”构成希伯来语固定表达，意思是“立约”。中文以“与……立约”准确而自然；将省略的“约”按前文补出。
- source_word: וּשְׁבוּעָתוֹ
  choice: 所起的誓
  rationale: 保留“誓”的名词意义及与前半句的平行关系；施事者“他”由前半句延续，在中文中无需重复。
- source_word: לְיִצְחָק
  choice: 向以撒
  rationale: לְ表示誓言所指向的对象；“向……起誓”是现代中文自然搭配，也保留方向或对象关系。
theological_decisions:
- issue: כרת与前一节“约”构成的立约惯用语
  choice: 与亚伯拉罕所立的约
  alternative: 与亚伯拉罕所切的
  rationale: 译出惯用语的实际含义，并通过脚注保留其字面意象；不将“约”的性质作超出上下文的神学限定。
- issue: 誓言与以撒的关系
  choice: 向以撒所起的誓
  alternative: 为以撒所起的誓
  rationale: לְ既可涉及对象也可能表达关联；此处“向以撒”最贴合起誓语境，同时不扩展誓言的具体内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。经文是承接上一节、延续至下一节的诗句，因此末尾用破折号表示语意未完。脚注标记紧随“约”，对应其所解释的希伯来语立约惯用语。
