  yaml_path: translation/ot/1_chronicles/016/012.yaml
  text: Remember his wondrous deeds that he has done[a], his signs[c][b], and the judgments of his mouth.
translation:
  language: zh_hans
  text: 你们要记念他所行的奇事[a]，他的神迹[b]，以及他口中的判语[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奇事”也可译作“奇妙的作为”。
    reason: lexical_alternative
  - marker: b
    text: “神迹”也可译作“征兆”或“奇兆”。
    reason: lexical_alternative
  - marker: c
    text: “判语”也可译作“判断”、“典章”或“诏令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: 你们要记念
  rationale: 复数祈使式，要求听众主动回想；“你们要记念”既保留劝勉语气，也符合庄重而自然的现代汉语。
- source_word: נִפְלְאֹתָיו אֲשֶׁר עָשָׂה
  choice: 他所行的奇事
  rationale: 将名词与关系从句合译，清楚表达这些令人惊奇之事是上帝施行的作为；同时避免生硬重复“他所行的……他所行”。
- source_word: מֹפְתָיו
  choice: 他的神迹
  rationale: מופת指彰显或证实神圣能力的奇异征兆。“神迹”在现代中文中简洁易懂，并与前面的“奇事”保持相关而不完全重合的诗歌平行。
- source_word: וּמִשְׁפְּטֵי פִיהוּ
  choice: 以及他口中的判语
  rationale: 保留“他的口”这一鲜明的希伯来表达；“判语”涵盖所宣告的判断或裁定，同时不将其过早限定为一般律例。
theological_decisions:
- issue: 平行结构中两类神圣作为的译法
  choice: 分别译作“奇事”和“神迹”
  alternative: “奇妙作为”和“征兆”；或把两者都译为“奇迹”
  rationale: 原文 נִפְלְאוֹת 与 מֹפְתִים 含义相关但并非同词。采用两个相近而有区别的中文词，保留诗句的平行层次，避免抹平原文差异。
- issue: מִשְׁפְּטֵי 的语义范围
  choice: 判语
  alternative: 判断；典章；诏令
  rationale: 该词可指判断、裁决、典章或法令；与“他的口”连用时侧重他所宣告的权威裁断。“判语”保留司法及宣告色彩，而脚注列出其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“记念”延续经文语体并表达主动牢记；全句保留三项并列和“他口中”的具体意象。
