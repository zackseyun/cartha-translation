  text: לֹא הִנִּ֤יחַ לְ/אִישׁ֙ לְ/עָשְׁקָ֔/ם וַ/יּ֥וֹכַח עֲלֵי/הֶ֖ם מְלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/021.yaml
  text: He allowed no man to oppress them[a], and he rebuked kings on their account,
translation:
  language: zh_hans
  text: 他不容任何人欺压他们；又因他们的缘故[a]责备君王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为了他们”或“由于他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנִּיחַ
  choice: 容
  rationale: 该词在使役词干中与否定词及不定式连用，表示“容许、准许”。“不容”简洁自然，也保留了上帝不准这种事发生的意思。
- source_word: אִישׁ
  choice: 任何人
  rationale: 希伯来文为阳性单数“人”，在这里具有泛指作用；“任何人”最自然地表达否定句中的普遍含义。
- source_word: לְעָשְׁקָם
  choice: 欺压他们
  rationale: עשׁק可指压迫、侵害或剥削；“欺压”既符合历史语境，也保留其较宽泛的伤害性含义。
- source_word: וַיּוֹכַח
  choice: 责备
  rationale: יכח在此表示斥责或申斥。“责备”庄重清楚，并适合以“君王”为受词。
- source_word: עֲלֵיהֶם
  choice: 因他们的缘故
  rationale: 介词עַל带代词后缀，在此可表示上帝采取行动所针对的缘由，也可能含有维护他们的意思；正文采用较能兼顾因由关系的表达，并以脚注保留受益性译法。
- source_word: מְלָכִים
  choice: 君王
  rationale: 该名词明确指“王”；“君王”符合经文语体，无须泛化为“统治者”。
theological_decisions:
- issue: 两个动词的隐含主语
  choice: 以“他”补出主语，所指为上下文中的上帝
  alternative: 保留为未明说的主语
  rationale: 希伯来文动词本身含第三人称阳性单数主语，而上下文表明行动者是上帝。现代汉语需要明确主语，故译作“他”，不额外加入神学解释。
- issue: עֲלֵיהֶם所表达的关系
  choice: 因他们的缘故
  alternative: 为了他们；由于他们
  rationale: 该介词短语可强调这些人是责备君王的缘由，也可含上帝为保护他们而行动的意味。正文不把保护目的说得过满，并用脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不容任何人欺压他们”自然表达希伯来文的否定许可结构；分号呈现两个并列行动。
