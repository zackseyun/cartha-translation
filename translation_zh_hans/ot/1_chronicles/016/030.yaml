  text: חִ֤ילוּ מִ/לְּ/פָנָי/ו֙ כָּל הָ/אָ֔רֶץ אַף תִּכּ֥וֹן תֵּבֵ֖ל בַּל תִּמּֽוֹט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/030.yaml
  text: Tremble before him[a], all the earth; indeed, the world is established; it shall not be moved.
translation:
  language: zh_hans
  text: 全地啊，要在他面前战兢！世界确实坚立，绝不动摇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“绝不摇晃”或“绝不震动”。希伯来文的意象是稳固、不致失稳。
    reason: lexical_alternative
lexical_decisions:
- source_word: חִילוּ
  choice: 战兢
  rationale: 该词是חול的命令式，在神显现与敬拜语境中表达因上帝临在而颤抖。“战兢”既保留身体震颤的意象，也自然传达敬畏之意。
- source_word: מִלְּפָנָיו
  choice: 在他面前
  rationale: 原文直指“从他面前／在他临在之处”；“在他面前”符合现代汉语表达，也保留面对上帝临在的意味。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: 本段是宇宙性的赞美语境，אֶרֶץ指整个大地，而非某一特定地域。
- source_word: אַף
  choice: 确实
  rationale: 此处אַף加强下句的断言，并非仅表示并列添加；“确实”简洁传达强调语气。
- source_word: תִּכּוֹן
  choice: 坚立
  rationale: כון的尼法勒式表示被确立、稳固存在；“坚立”兼顾确立与牢固的语义，并与诗歌体裁相称。
- source_word: תֵּבֵל
  choice: 世界
  rationale: תֵּבֵל常指有秩序、有人居住的世界；“世界”是现代汉语中简明自然的对应表达。
- source_word: בַּל
  choice: 绝不
  rationale: 诗歌否定词בַּל在此作有力否定；结合稳定意象，“绝不”自然体现其语势。
- source_word: תִּמּוֹט
  choice: 动摇
  rationale: מוט的尼法勒式可指摇晃、失稳或被撼动。“动摇”保留不稳的形象，同时避免把诗歌误解为关于物理运动的科学陈述。
theological_decisions:
- issue: 宇宙稳定性的语言
  choice: 将经文译为世界在上帝治理下“坚立，绝不动摇”，表达受造秩序的稳固。
  alternative: 可更具象地译为“绝不摇晃”或“绝不震动”。
  rationale: 希伯来诗歌强调世界因上帝的统治而稳固，并未具体提出关于宇宙绝对静止的科学主张；“动摇”保留诗意与神学张力，不引入后世宇宙论争议。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“全地啊”保留呼语和普世范围；两个短句以感叹号和逗号呈现诗歌的呼召与宣告。“战兢”“坚立”略具经文诗体色彩，但普通读者容易理解。
