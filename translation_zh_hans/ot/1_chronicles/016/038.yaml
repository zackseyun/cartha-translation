  yaml_path: translation/ot/1_chronicles/016/038.yaml
  text: And Obed-edom and their brothers[a], sixty-eight; and Obed-edom son of Jeduthun and Hosah were gatekeepers.
translation:
  language: zh_hans
  text: 还有俄别以东和他们的弟兄[a]，共六十八人；又有耶杜顿的儿子俄别以东和何萨作守门人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“他们的弟兄”。有些译本为明确关系而译作“他的弟兄”，但正文保留马所拉文本的复数后缀。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עֹבֵד אֱדֹם
  choice: 还有俄别以东
  rationale: 连接词承接上一节的名单；用“还有”自然表达名单的延续，并按通行圣经译名音译人名。
- source_word: וַ/אֲחֵי/הֶם
  choice: 和他们的弟兄
  rationale: 保留马所拉文本第三人称阳性复数后缀的字面意义“他们的”，不擅自改成单数“他的”；“弟兄”在名单语境中可指同族或同职的成员。
- source_word: שִׁשִּׁים וּ/שְׁמוֹנָה
  choice: 共六十八人
  rationale: 按现代汉语表达基数，并补出量词“人”；“共”明确这是前述群体的总数。
- source_word: וְ/עֹבֵד אֱדֹם
  choice: 又有……俄别以东
  rationale: 保留原文第二次出现的人名及并列结构，不把两个分句合并，以免消除名单本身可能存在的身份张力。
- source_word: בֶּן יְדִיתוּן
  choice: 耶杜顿的儿子
  rationale: 直接表达父子身份，保留《历代志》中具有识别作用的谱系信息。
- source_word: וְ/חֹסָה
  choice: 和何萨
  rationale: 连接何萨与俄别以东，使二人共同承接后面的职分说明。
- source_word: לְ/שֹׁעֲרִים
  choice: 作守门人
  rationale: 介词לְ在此表示职分或任命；“作守门人”是自然、清楚的现代汉语表达。
theological_decisions: []
