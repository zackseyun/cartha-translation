  text: ה֤וֹד וְ/הָדָר֙ לְ/פָנָ֔י/ו עֹ֥ז וְ/חֶדְוָ֖ה בִּ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/027.yaml
  text: Splendor and majesty are before him[a]; strength and joy are in his place.
translation:
  language: zh_hans
  text: 荣美和威严在他面前；能力和喜乐在他所在之处[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“在他的地方”。也可译为“在他的居所”；按敬拜语境，也可理解为“在他的圣所”。此处希伯来语的表达比诗篇96:6平行经文所用“圣所”一词更宽泛。
    reason: 说明原文字面意义、语境中可有的较具体理解，并保留与诗篇96:6措辞不同的事实。
lexical_decisions:
- source_word: הוֹד
  choice: 尊荣
  rationale: 此词表示显赫、庄严的荣美；译作“尊荣”能保留其崇高色彩，并与后面的“威严”形成自然的诗歌搭配。
- source_word: הָדָר
  choice: 威严
  rationale: 此词常表达庄严、华美与君王般的尊贵；“威严”在现代汉语中自然庄重，也不与 הוֹד 合并为同一概念。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 原文直指“在他面前”；此译保留空间与临在的意象，同时符合现代汉语表达。
- source_word: עֹז
  choice: 力量
  rationale: 此词通常表示力量、能力或强盛；“力量”直接清楚，并与“喜乐”保持诗句的平衡。
- source_word: חֶדְוָה
  choice: 喜乐
  rationale: 此词表示喜悦、欢乐；“喜乐”具有庄重的诗歌语体，又容易为现代读者理解。
- source_word: בִּמְקֹמוֹ
  choice: 在他的居所
  rationale: 字面为“在他的地方”。现代汉语中的“他的地方”容易被理解成普通地点，因此正文采用较自然、仍保持宽泛含义的“居所”，并用脚注说明原文字面及“圣所”的语境可能。
theological_decisions:
- issue: מְקוֹמוֹ 是否应具体解释为圣所或圣殿
  choice: 正文译作“他的居所”，不明确限定为圣所
  alternative: 可译作“他的地方”或按敬拜语境译作“他的圣所”
  rationale: 上下文具有礼仪和敬拜背景，诗篇96:6的平行经文也用“圣所”，但历代志此处实际使用的是较宽泛的 מָקוֹם（地方、所在之处）。正文以自然汉语保留其居住或临在之处的宽度，脚注同时呈现字面表达和较具体的语境理解，避免直接与诗篇措辞合并。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。两个并列分句保留原文的对称结构；“尊荣和威严”“力量和喜乐”分别对应希伯来语的成对名词。
