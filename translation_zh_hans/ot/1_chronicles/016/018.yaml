  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: zh_hans
  text: 说：“我必把迦南地赐给你，作为你们[a]所承受产业的份额[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先用单数“你”，随后转为复数“你们”；这可能是从受领应许的族长转向作为盟约承受者的后裔群体。
    reason: lexical_alternative
  - marker: b
    text: “份额”也可译作“所分得之地”。原词本指绳索或量地的线，进而指量定、分配所得的一份土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式承接上一节并引出盟约话语的内容；现代汉语用“说”简洁自然。
- source_word: לְךָ
  choice: 赐给你
  rationale: 保留第二人称阳性单数，与后文复数“你们”形成原文中的数变化。
- source_word: אֶתֵּן
  choice: 我必……赐给
  rationale: 未完成式在应许语境中表达将来且带有确定性；“必”体现庄重、确定的应许语气。
- source_word: אֶרֶץ כְּנָעַן
  choice: 迦南地
  rationale: 准确保留具体地域名称及 אֶרֶץ 的土地含义，也是现代汉语中自然、通行的表达。
- source_word: חֶבֶל
  choice: 份额
  rationale: 该词本指量地的绳索，在分地语境中转指划定或分配所得的一份土地；“份额”既自然又保留分配意象。
- source_word: נַחֲלַתְכֶם
  choice: 你们所得的产业
  rationale: נחלה 指承受所得的产业，尤其常指盟约所赐之地；“产业”保留土地、法律及盟约层面的含义，并以“你们”明确呈现复数后缀。
theological_decisions:
- issue: 受话者由单数转为复数
  choice: 译作“赐给你，作你们所得的产业份额”，保留单数“你”和复数“你们”
  alternative: 统一译为单数，或解释性地改写为“赐给你和你的后裔”
  rationale: 希伯来文明确并置单数 לְךָ 与复数 נַחֲלַתְכֶם。保留这一变化，使应许对象从受话的族长延伸至承受盟约的群体这一张力仍由经文本身表达，而不在正文中加以解释或调和。
- issue: חֶבֶל 与 נַחֲלָה 的关系
  choice: 译作“产业份额”
  alternative: 只译作“产业”，或译成“量地的绳索”
  rationale: “产业份额”同时表达分配所得的一份土地与承受产业的含义；只译“产业”会淡化 חֶבֶל，直译“绳索”则会遮蔽此处约定俗成的土地分配义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我必……赐给”适合神圣应许的语境；“产业份额”略带法律和土地分配色彩，与本节的盟约土地用语相称。脚注标记置于其所解释的“你们”和“份额”之后。
