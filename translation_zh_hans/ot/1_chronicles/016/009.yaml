  yaml_path: translation/ot/1_chronicles/016/009.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous deeds.
translation:
  language: zh_hans
  text: 你们要向他歌唱，歌颂他；要述说[a]他一切奇妙的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“谈论”或“默想”。这个希伯来语动词既可表示说出、叙述，也可表示沉思；本节公开呼吁众人的语境较支持外在述说的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: 歌唱
  rationale: 这是שׁיר的复数命令式，直接表达向上帝歌唱，并保留诗歌的呼吁语气。
- source_word: לֹו
  choice: 向他
  rationale: 介词ל加第三人称阳性单数后缀，在这里最自然地表示歌唱和颂扬所指向的对象。
- source_word: זַמְּרוּ
  choice: 歌颂
  rationale: זמר的加强词干在敬拜语境中可指奏乐或唱诗赞美；“歌颂”既体现赞美含义，也与前面的“歌唱”略作区分。
- source_word: שִׂיחוּ
  choice: 述说
  rationale: שׂיח可表示说话、讲述或沉思。这里是面向群体的公开劝勉，“述说”较符合语境，同时用脚注保留其反思性含义。
- source_word: בְּכָל
  choice: 他一切……
  rationale: 介词ב与שׂיח连用时，按现代汉语习惯无需逐字译出；כָל的全面含义由“一切”保留。
- source_word: נִפְלְאֹתָיו
  choice: 他一切奇妙的作为
  rationale: נִפְלָאוֹת常指上帝令人惊叹的非凡作为；“奇妙的作为”兼顾其惊奇性质和具体行动。
