base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/041.yaml
  text: And with them were Heman and Jeduthun and the rest of those chosen, who were designated by name to give thanks to Yahweh, for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 与他们一起的，还有希幔、耶杜顿和其余蒙拣选、按名指定的人[a]，为要称谢雅威，因为他的慈爱永远长存[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按名字点出的人”或“逐一指名的人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“因为他的慈爱直到永远。”这是反复用于敬拜礼仪的句子。
    reason: cultural_note
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: 与他们一起的，还有
  rationale: 介词短语引出与上文所述人员同在的另一组人；补出“还有”，使现代汉语自然，并符合后接复数人名和群体。
- source_word: הֵימָן
  choice: 希幔
  rationale: 采用该希伯来人名通行的中文音译。
- source_word: וִידוּתוּן
  choice: 耶杜顿
  rationale: 采用该希伯来人名通行的中文音译。
- source_word: וּשְׁאָר הַבְּרוּרִים
  choice: 和其余蒙拣选……的人
  rationale: שְׁאָר表示“其余、剩下的”，被动分词 הַבְּרוּרִים 表示被挑选出来的人；“蒙拣选”保留其被动含义，又不额外限定性别。
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: 按名指定的人
  rationale: נקב 的尼法勒式与“名字”连用，表示明确按名字点出或指定；“按名指定”简洁而正式。
- source_word: לְהֹדוֹת
  choice: 为要称谢
  rationale: ידה 的使役式在礼仪语境中常指向上帝献上感谢或赞美；“称谢”兼具感谢和敬拜色彩。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名 יהוה；以“雅威”音译，保留其作为专名的性质。
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: 因为他的慈爱永远长存
  rationale: כִּי在此引出称谢的理由或内容；חֶסֶד含忠贞、恩慈及关系信实等意涵，“慈爱”符合中文礼仪表达，“永远长存”则自然表达 לְעוֹלָם。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用上帝的专名，而非称号；音译“雅威”直接反映该名，同时不以“主”替代。
- issue: חֶסֶד 的表达
  choice: 慈爱
  alternative: 忠贞的爱
  rationale: “慈爱”在此反复出现的礼仪句式中简洁庄重，也涵盖恩慈之爱；不在正文中把其丰富意义缩限为单一的盟约术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为要称谢”保留礼仪语气；人名使用简体中文圣经传统中通行的译名。
