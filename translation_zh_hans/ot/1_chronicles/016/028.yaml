  text: הָב֤וּ לַֽ/יהוָה֙ מִשְׁפְּח֣וֹת עַמִּ֔ים הָב֥וּ לַ/יהוָ֖ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/028.yaml
  text: Ascribe to Yahweh[a], families of the peoples, ascribe to Yahweh glory and strength.
translation:
  language: zh_hans
  text: 万民的各族啊[a]，要尊崇雅威；要将荣耀和能力归给雅威！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“万民的众家族”或“列国的各族”。
    reason: מִשְׁפְּחוֹת 可指家族、宗族或族群，עַמִּים 可译为众民、各民族或列国；这些译法分别突出其亲族结构或民族范围。
lexical_decisions:
- source_word: הָבוּ
  choice: 要归……给
  rationale: 这是复数祈使式；在敬拜语境中并非把某物实际转交给神，而是公开承认荣耀和能力本来属于他。“归……给”自然表达这种宣认之意，并保留命令语气。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 介词 ל 标明动作所指向的对象；神名 יהוה 采用音译“雅威”，以呈现经文中的专名。
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: 万民的各族
  rationale: מִשְׁפָּחוֹת 指家族、宗族或族群；עַמִּים 是“众民、各民族”的复数。“万民的各族”既保留希伯来语的所属结构和普世范围，也符合现代汉语诗体表达。
- source_word: כָּבוֹד
  choice: 荣耀
  rationale: 在颂赞语境中指应当承认属于神的尊荣与威荣；“荣耀”是准确且庄重的常用译法。
- source_word: וָעֹז
  choice: 和能力
  rationale: עֹז 可指力量、能力或威力；“能力”与“荣耀”搭配自然，并表达神所具有的大能。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名 יהוה；译作“雅威”旨在呈现其作为神之圣约专名的性质，而不以“主”这一称号代替。
- issue: הָבוּ 的两次重复
  choice: 在句末保留第二次“要归给雅威”
  alternative: 合并为一次“要把荣耀和能力归给雅威”
  rationale: 原文重复祈使语，形成礼仪性的呼召与强调；中文保留重复，同时调整语序，使句子自然有力。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜诗体。“万民的各族啊”保留直接呼告；后半句保留原文重复，以体现颂赞呼召的节奏。
