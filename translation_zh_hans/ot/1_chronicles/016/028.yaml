revisions:
- from: 万民的各族啊[a]，要归荣耀和能力给雅威，要归给雅威！
  to: 万民的各族啊[a]，要尊崇雅威；要将荣耀和能力归给雅威！
  rationale: 修订解决了句末无宾语的结构问题。首次 הָבוּ 译为“要尊崇”，在中文礼仪语境中自然表达向雅威归与应得尊荣的概括性呼召；第二次则明确译出“将荣耀和能力归给雅威”，对应原文所明示的宾语。保留呼告、神名、荣耀、能力和两次命令的强调。
