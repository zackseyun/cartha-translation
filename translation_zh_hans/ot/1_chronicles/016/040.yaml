source:
  edition: WLC
  text: לְֽ/הַעֲלוֹת֩ עֹל֨וֹת לַ/יהוָ֜ה עַל מִזְבַּ֧ח הָ/עֹלָ֛ה תָּמִ֖יד לַ/בֹּ֣קֶר וְ/לָ/עָ֑רֶב וּ/לְ/כָל הַ/כָּתוּב֙ בְּ/תוֹרַ֣ת יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/040.yaml
  text: to offer burnt offerings to Yahweh on the altar of burnt offering continually[a], morning and evening, and according to all that is written in the law of Yahweh, which he commanded for Israel.
translation:
  language: zh_hans
  text: 为要在燔祭坛上不断向雅威献燔祭，每天早晚都献，并照雅威律法[a]上所写的一切，就是他吩咐以色列遵行的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“训诲”；希伯来语“妥拉”（torah）可兼有这两种含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: 献燔祭
  rationale: עלה的使役式在献祭语境中表示献上祭物；עֹלָה是整只焚烧献上的祭，采用现代中文圣经语汇“燔祭”，简洁而准确。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל表示献祭的对象；将神名יהוה音译为“雅威”，保留其专名性质。
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: 在燔祭坛上
  rationale: 该组合词指专用于燔祭的祭坛；“燔祭坛”自然简洁，也保留特定礼仪设施的含义。
- source_word: תָּמִיד לַבֹּקֶר וְלָעָרֶב
  choice: 不断……每天早晚都献
  rationale: תמיד表达持续而有规律的献祭，后面的“早晚”说明其每日节奏；此译法兼顾持续性和定时性。
- source_word: וּלְכָל הַכָּתוּב בְּתוֹרַת יְהוָה
  choice: 并照雅威律法上所写的一切
  rationale: 此处的ל表示依照书面规定而行；תורה在礼仪法规语境中译为“律法”，同时用脚注保留“训诲”的词义可能。
- source_word: אֲשֶׁר צִוָּה עַל יִשְׂרָאֵל
  choice: 就是他吩咐以色列遵行的
  rationale: צוה搭配על表示把命令加在某人身上；补出“遵行”使现代中文自然，并表达这些规定对以色列具有约束力。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留这是神的立约专名，而不以称号代替。
- issue: תורה的语义范围
  choice: 正文译“律法”，脚注注明“训诲”
  alternative: 雅威的训诲
  rationale: 本节涉及写下来的献祭规定，“律法”最贴合直接语境；但תורה也可泛指教导或训诲，因此在脚注中保留这一真实的词义空间。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“为要”保留本节承接上文的目的性不定式结构；“不断”与“每天早晚”并列，既不削弱持续性，也不误解为不间断焚烧。脚注标记紧接其实际解释的“律法”。
