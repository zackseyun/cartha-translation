  text: זִכְר֤וּ לְ/עוֹלָם֙ בְּרִית֔/וֹ דָּבָ֥ר צִוָּ֖ה לְ/אֶ֥לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/015.yaml
  text: Remember his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: zh_hans
  text: '你们要永远记念他的约，

    就是他所吩咐、直到千代的话[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”或译作“应许”。
    reason: 保留דָּבָר在立约语境中可能具有的“应许”含义，同时不以较窄的解释取代正文较宽泛的词义。
lexical_decisions:
- source_word: זִכְרוּ
  choice: 你们要记念
  rationale: 这是阳性复数祈使式，直接劝告群体。“记念”既表达铭记在心，也符合庄重的经文语体；加上“你们”显明原文复数对象。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 表达持续、永久之意；“永远”是现代汉语中自然、清楚的对应。
- source_word: בְּרִיתוֹ
  choice: 他的约
  rationale: בְּרִית在此指具有约束力的盟约或圣约；“约”准确而简洁，也保留其神学含义。
- source_word: דָּבָר
  choice: 话
  rationale: 该词可指“话、事情”，在立约语境中也可含“应许”之意。正文采用较宽泛的“话”，避免把语义提前限定为“应许”，并在脚注保留该可能。
- source_word: צִוָּה
  choice: 所吩咐的
  rationale: 该动词通常表示“吩咐、命令”。“所吩咐的”保留其基本语义，并可表达这话具有权威和约束力。
- source_word: לְאֶלֶף דּוֹר
  choice: 为千代
  rationale: 介词לְ可在这里表示所及对象或持续范围。“为千代”在中文中简洁表达这话面向并延续至千代，同时不武断判定“一千”是严格数值还是表示极其长久。
theological_decisions:
- issue: דָּבָר在立约平行结构中应译为“话”还是“应许”
  choice: 话
  alternative: 应许
  rationale: “话”更直接保留希伯来词的宽广语义；上下文确实容许将它理解为神的“应许”，但正文不应替读者消除这一语义张力，因此把“应许”列入脚注。
- issue: “千代”应否解释为非字面的永恒
  choice: 保留“千代”
  alternative: 世世代代
  rationale: 原文明确使用数词“一千”和“代”。直译为“千代”既保留诗性夸张或具体数值的开放性，也避免在正文中预先裁定其修辞性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“记念”较“记住”更具经文与礼仪语感，但仍为当代读者所熟悉；句式保持诗歌式的两行结构。
