  source_fidelity: 正文准确传达了复数祈使语气、“永远”、“他的约”及“话／应许”的语义开放性。原译“为千代所吩咐”虽可理解，却可能使“为”被读作“为了／替千代”，未能自然表达לְאֶלֶף דּוֹר所指向的延续范围。改为“直到千代”更清楚，同时不把“一千”解释为纯粹的非字面说法。
  naturalness: “为千代所吩咐的话”在现代普通话中搭配生硬且范围关系不够明确；“他所吩咐、直到千代的话”较自然，并保留经文的庄重平行句式。
  terminology: “约”“记念”“话”均合适。“话”保留דָּבָר的宽泛意义；脚注列出“应许”这一契约语境中的可行译法，避免在正文中作过度解释。
