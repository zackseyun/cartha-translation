base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/007.yaml
  text: On that day then David first appointed Asaph and his brothers to give thanks to Yahweh[a].
translation:
  language: zh_hans
  text: 那一天，大卫就首次指派亚萨和他的弟兄，向雅威献上感谢。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫指派亚萨和他的弟兄为首，向雅威献上感谢”；也可理解为“大卫第一次指派亚萨和他的弟兄向雅威献上感谢”。这里的希伯来语表达可能强调先后次序、领导地位，或这项职分的初次设立。
    reason: 保留בָּרֹאשׁ在本句中的真实歧义。
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא אָז
  choice: 那一天
  rationale: בַּיּוֹם הַהוּא明确标示时间；אָז承接叙事，在现代汉语中不必另译“那时”，以免重复。
- source_word: נָתַן
  choice: 指派
  rationale: 字面义为“给”，但在此行政和礼仪语境中表示把职责交给某人；“指派”自然地传达这一含义。
- source_word: בָּרֹאשׁ
  choice: 首次
  rationale: 该短语有“在首位、为首、起初”等可能含义；结合本节语境，正文采用表示初次设立的“首次”，并以脚注保留其他可能。
- source_word: לְהֹדוֹת
  choice: 献上感谢
  rationale: ידה的使役式不定词在礼仪语境中可指感谢、称颂；“献上感谢”既自然，也保留其敬拜色彩。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 直接音译四字神名，保留经文所用的圣约之名。
- source_word: בְּיַד אָסָף וְאֶחָיו
  choice: 指派亚萨和他的弟兄
  rationale: בְּיַד字面为“借着……的手”，在此表示执行者或受托者；汉语将其自然融入“指派”结构。“弟兄”保留亲属或同属利未群体的表达。
theological_decisions:
- issue: 四字神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神名；“雅威”较贴近学界通常重构的读音，同时不以“主”替代该专名。
- issue: בָּרֹאשׁ所表达的优先性
  choice: 首次
  alternative: 让亚萨和他的弟兄为首／居首
  rationale: 原文可能强调初次设立，也可能强调领导地位。正文按上下文采用“首次”，但不把另一种解释排除，故收入脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“指派”体现职责委托；“献上感谢”符合礼仪语境。脚注标记置于相关整句之后。
