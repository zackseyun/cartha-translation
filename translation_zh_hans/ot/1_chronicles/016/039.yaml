base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/039.yaml
  text: And Zadok the priest and his fellow priests were before the tabernacle of Yahweh at the high place that was in Gibeon,[a]
translation:
  language: zh_hans
  text: 又把祭司撒督和他的弟兄们，就是众祭司，留在雅威的帐幕前，就是在基遍的丘坛那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留在”承接上一节；希伯来原文在本节没有重复这个动词。
    reason: 说明原文的省略结构及译文为汉语通顺而补出的成分。
lexical_decisions:
- source_word: וְאֵת
  choice: 又把
  rationale: וְ表示与上文衔接，אֵת是直接宾语标记。汉语用“又把”承接上一节的句法，并把本节的人物标为所留下的对象。
- source_word: צָדוֹק הַכֹּהֵן
  choice: 祭司撒督
  rationale: 按现代汉语通常的名号次序表达其职分和姓名。
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: 和他的弟兄众祭司
  rationale: 较贴近原文“他的弟兄们，那些祭司”，保留“弟兄”既可表示亲族、也可表示同一祭司群体成员的语义张力，避免直接断定为亲生兄弟或仅为同僚。
- source_word: לִפְנֵי
  choice: 在……前
  rationale: 保留其空间方位和在圣所前供职的含义。
- source_word: מִשְׁכַּן יְהוָה
  choice: 雅威的帐幕
  rationale: מִשְׁכָּן在此指敬拜用的帐幕圣所；“帐幕”是现代中文圣经语境中准确而易懂的表达。神名יהוה音译为“雅威”。
- source_word: בַּבָּמָה
  choice: 在……丘坛那里
  rationale: בָּמָה指设于高处或称为高处的祭祀场所。“丘坛”保留其礼仪场所含义，且不把后世经常出现的负面评价强加于本处。
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: 就是在基遍的
  rationale: 作为关系从句限定“丘坛”的所在地；汉语以“就是”清楚连接说明。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较接近其通行学术重构读音的“雅威”，明确保留专名性质。
- issue: אֶחָיו在祭司群体中的关系含义
  choice: 他的弟兄众祭司
  alternative: 和他一同作祭司的人
  rationale: 原词可指亲族弟兄，也可泛指同一群体的成员。正文保留“弟兄”，不在文本中排除任何一层可能含义。
- issue: 基遍的בָּמָה是否带有贬义
  choice: 丘坛
  alternative: 异教祭坛
  rationale: 本节没有把该场所定性为异教敬拜之地，且雅威的帐幕正在那里；因此只译出场所名称，不加入负面神学判断。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“又把……留在”使本节作为承接上文的句子能够独立朗读；“弟兄众祭司”有意保留原文关系词的宽度；地名采用通行译名“基遍”。
