base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/005.yaml
  text: Asaph was the chief[a], and second to him was Zechariah; then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel, with instruments of harps and lyres[b]; and Asaph sounded the cymbals.
translation:
  language: zh_hans
  text: 亚萨为首[a]，撒迦利雅居次；其余的耶利、示米拉末、耶希伊、玛他提雅、以利押、比拿雅、俄别·以东和耶利，使用瑟和琴[b]；亚萨敲响钹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚萨为首，撒迦利雅为他的副手。”希伯来语表示撒迦利雅的位次仅次于亚萨。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文使用两个不同的词，指两种弦乐器，此处分别译作“瑟”和“琴”。其具体形制难以确定。
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: 为首
  rationale: 此处指亚萨在圣乐人员中的首要地位；“为首”既贴近原文名词性表达，也符合现代汉语名单语境。
- source_word: וּמִשְׁנֵהוּ
  choice: 居次
  rationale: מִשְׁנֶה加第三人称阳性单数后缀，表示撒迦利雅相对于亚萨居第二位；正文保留简洁表达，脚注说明关系。
- source_word: יְעִיאֵל / וִיעִיאֵל
  choice: 耶利
  rationale: 两处希伯来文拼写相同，均采用同一中文音译，以反映名单中该名字出现两次。
- source_word: בִּכְלֵי נְבָלִים וּבְכִנֹּרוֹת
  choice: 使用瑟和琴
  rationale: נֵבֶל与כִּנּוֹר是两种不同的弦乐器；采用传统且易懂的“瑟”和“琴”，并在脚注说明其类别与区别。כְּלֵי在汉语中以“使用”自然体现，无须生硬译作“……的器具”。
- source_word: בַּמְצִלְתַּיִם
  choice: 钹
  rationale: 指成对击奏的金属打击乐器，现代汉语以“钹”准确简洁表达。
- source_word: מַשְׁמִיעַ
  choice: 敲响
  rationale: שמע的使役分词在此意为使钹发声；“敲响”既体现使役含义，也符合钹的实际演奏方式。
theological_decisions: []
