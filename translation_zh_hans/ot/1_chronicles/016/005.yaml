  register: 采用现代、庄重而易懂的名单体表达。人名依常见中文圣经音译处理；“俄别·以东”加间隔号以避免误读为地名组合。正文保留原文的位次关系和两类弦乐器之别，并用脚注交代可译方式及器物辨识的不确定性。
