  yaml_path: translation/ot/1_chronicles/016/019.yaml
  text: when you were few in number[a], very few, and sojourners in it,
translation:
  language: zh_hans
  text: 当你们人数稀少、少之又少[a]，并在那地寄居的时候，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“实在很少”或“几乎没有”；希伯来文在这里强调人数极少。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתְכֶם
  choice: 那时你们
  rationale: 介词 בְּ 加动词 היה 的不定式构造及第二人称复数后缀，引出时间从句；译为“那时你们”自然地表达“当你们……时”。
- source_word: מְתֵי מִסְפָּר
  choice: 人数稀少
  rationale: 这是表示人数少、屈指可数的习语；“人数稀少”既准确又符合现代汉语表达。
- source_word: כִּמְעַט
  choice: 少之又少
  rationale: 在此承接并强化前面的“人数稀少”；“少之又少”保留强调语气，同时自然易懂。
- source_word: וְגָרִים
  choice: 并且……寄居
  rationale: גור 的分词指作为外来者或没有永久产业的人暂住；“寄居”保留其社会处境与暂居意味。
- source_word: בָּהּ
  choice: 在那地
  rationale: 阴性单数代词后缀按上下文指所说之地；汉语明示为“那地”，比直译“在其中”更清楚。
theological_decisions: []
translation_notes:
