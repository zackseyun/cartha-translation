  text: וַ/יִּתֵּ֞ן לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה מִן הַ/לְוִיִּ֖ם מְשָׁרְתִ֑ים וּ/לְ/הַזְכִּיר֙ וּ/לְ/הוֹד֣וֹת וּ/לְ/הַלֵּ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/004.yaml
  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
translation:
  language: zh_hans
  text: 他派了一些利未人在雅威的约柜前供职，负责记念[a]、称谢并赞美雅威—以色列的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使人记念”或“提说”。这个希伯来语动词在礼仪语境中可指使某事被记起或宣告记念。
    reason: 保留 וּלְהַזְכִּיר 的使役语态及其未明确限定的礼仪含义。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 他派了
  rationale: 该动词本义为“给、安置”，这里指把人员安排到特定职分，因此译作“派了”自然且符合行政语境；保留原文代词“他”，不从上文补出姓名。
- source_word: מִן הַלְוִיִּם
  choice: 一些利未人
  rationale: 介词 מִן 在此表示整体中的一部分，译作“一些利未人”准确而自然。
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: 在雅威的约柜前
  rationale: 既保留空间和礼仪性的“在……前”，也直接表达约柜与雅威的所属关系。
- source_word: מְשָׁרְתִים
  choice: 供职
  rationale: 分词指他们在敬拜礼仪中的事奉职责；“供职”比泛泛的“服侍”更能体现正式受派的职分。
- source_word: וּלְהַזְכִּיר
  choice: 负责记念
  rationale: זכר 的使役式在此可能指礼仪中使人记起、宣告记念或举行纪念。正文用简洁的“记念”，并以脚注保留其语义范围。
- source_word: וּלְהוֹדוֹת
  choice: 称谢
  rationale: 在敬拜语境中，该词表示向神感谢；“称谢”庄重、简明，也与礼仪语体相称。
- source_word: וּלְהַלֵּל
  choice: 赞美
  rationale: 准确表达 הלל 强意形的常见意义，不额外加入原文未明确表达的“歌唱”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中可辨识的音译呈现四字神名，将其作为专名而不是用“主”这一称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接保留原文的组合关系和盟约性称谓。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；译作“雅威”保留专名性质，也避免以称号“主”取代。
- issue: וּלְהַזְכִּיר 所指的礼仪行为
  choice: 记念，并加脚注说明
  alternative: 使人记念；提说；举行纪念
  rationale: 原文没有明说记念的宾语或具体礼仪方式，因此正文不补定对象，脚注则保留使役和礼仪层面的可能含义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“负责”统摄后三项并列职责，使句法清楚；破折号突出“以色列的神”是对“雅威”的同位说明。
