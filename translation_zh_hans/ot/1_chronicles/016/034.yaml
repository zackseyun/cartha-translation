  text: הוֹד֤וּ לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/034.yaml
  text: Give thanks to Yahweh[a], for he is good[b]; for his steadfast love endures forever.
translation:
  language: zh_hans
  text: 你们要称谢雅威[a]，因为他是良善的；因为他的慈爱[b]永远长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的常见拟音；有些译本作“耶和华”或“上主”。
    reason: alternative_reading
  - marker: b
    text: “慈爱”所译的希伯来词 חֶסֶד 也含有忠贞、信实的意味，也可译作“忠贞之爱”或“盟约信实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: 你们要称谢
  rationale: 这是 ידה 的使役式复数命令式。在礼仪颂赞语境中译作“称谢”既表达感谢，也保留公开颂赞的意味；“你们”体现原文复数受命者。
- source_word: לַ/יהוָה֙
  choice: 雅威
  rationale: 原文直接使用神的专名 יהוה。采用现代汉语中较能反映其可能读音的“雅威”，并以脚注说明其他常见译法。
- source_word: כִּ֣י … כִּ֥י
  choice: 因为……因为……
  rationale: 两处 כִּי 都为称谢提供理由。重复译出“因为”，保留原文的平行结构和礼仪节奏。
- source_word: ט֔וֹב
  choice: 良善的
  rationale: טוֹב 在此陈述雅威本质及作为的善。“良善”在现代汉语中庄重清楚，也避免只被理解为一般的“好”。
- source_word: לְ/עוֹלָ֖ם
  choice: 永远长存
  rationale: לְעוֹלָם 表示不止息、恒久持续。结合无明示动词的名词句，补出“长存”，使汉语自然，同时不增加新的实质含义。
- source_word: חַסְדּֽ/וֹ
  choice: 他的慈爱
  rationale: חֶסֶד 同时包含恩慈、忠贞和关系中的信实。“慈爱”简洁自然，适合颂赞复句；脚注保留“忠贞之爱／盟约信实”等词义层面。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名，而非称号。正文音译为“雅威”以保留专名性质；脚注承认汉语传统中的其他通行译法，不把某一传统读法说成毫无争议。
- issue: חֶסֶד 在盟约颂赞套语中的含义
  choice: 慈爱
  alternative: 忠贞之爱；盟约信实；怜悯
  rationale: “慈爱”在现代汉语中自然且适合礼仪颂赞，但不能穷尽 חֶסֶד 所含的忠诚与信实，因此以脚注保留其丰富含义，避免把它缩减为纯粹情感或单一法律概念。
- issue: 无动词分句 לְעוֹלָם חַסְדּוֹ 的表达
  choice: 他的慈爱永远长存
  alternative: 他的慈爱直到永远；他的慈爱是永远的
  rationale: 希伯来文没有明示动词。汉语虽可用判断句，但“永远长存”更自然地表达持续性；此处所补动词仅使隐含关系显明，不改变命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪颂赞语体。保留两次“因为”的平行结构，以贴近希伯来文节奏；不用过度古雅的“本为善”或“直到永远”，同时保留经文的简洁与庄严。
