  text: הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָ/עַמִּ֖ים עֲלִילֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/008.yaml
  text: Give thanks to Yahweh[a]; call on his name[b]; make his deeds known among the peoples.
translation:
  language: zh_hans
  text: 你们要称谢雅威[a]，求告他的名；要在万民[b]中传扬他的作为[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文יהוה这一上帝专名的音译；传统汉译作“耶和华”。
    reason: divine_name
  - marker: b
    text: “万民”也可译作“列国”或“各族人民”。
    reason: lexical_alternative
  - marker: c
    text: “作为”也可译作“所行的事”或“事迹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: 称谢
  rationale: ידה的使役式复数命令语气在赞美语境中表示向上帝献上感谢和赞美；“称谢”既准确又符合庄重的敬拜用语。
- source_word: לַֽיהוָה
  choice: 雅威
  rationale: 原文直接使用上帝的专名יהוה；“雅威”以现代汉语常见音译保留其盟约之名，而不以称号代替。
- source_word: קִרְא֣וּ בִשְׁמוֹ
  choice: 求告他的名
  rationale: קרא与בְּשֵׁם连用，在此表示呼求、求告上帝；这一译法自然，也保留“名”所承载的身份与声誉含义。
- source_word: הוֹדִ֥יעוּ
  choice: 传扬
  rationale: ידע的使役式命令语气本义是“使人知道”。“传扬”在本诗歌语境中自然表达向各族群宣告，使他们知晓。
- source_word: בָעַמִּים
  choice: 在万民中
  rationale: עַמִּים是复数，指不同的人民或族群；“万民”以自然简洁的汉语保留其广泛而复数的意义，并不局限于现代政治国家。
- source_word: עֲלִילֹתָיו
  choice: 他的作为
  rationale: עֲלִילוֹת指所做的事、行动或事迹；“作为”范围适当，没有额外加入“伟大”或“大能”等原文未明说的修饰。
theological_decisions:
- issue: 上帝专名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名יהוה。音译“雅威”保留专名性质，并避免以“主”这一称号取代原文；“耶和华”是传统汉译音，但较不贴近学界通常重建的发音。
- issue: קִרְאוּ בִשְׁמוֹ所表达的行动
  choice: 求告他的名
  alternative: 奉他的名宣告；呼唤他的名
  rationale: 此搭配可涉及呼求或宣告，但在一连串敬拜命令中，“求告他的名”最自然地体现向上帝发出的呼求，同时不把它扩展为特定礼仪或教义公式。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌敬拜语体。三个并列命令句保持原文的推进节奏；用“称谢—求告—传扬”形成简洁有力的结构。
