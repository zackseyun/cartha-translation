base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/036.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Then all the people said[b], “Amen!” and praised Yahweh.
translation:
  language: zh_hans
  text: 雅威——以色列的上帝，愿从永远到永远受称颂！[a]全体百姓都说：“阿们！”并赞美雅威。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从亘古到永远”或“直到永永远远”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文表达很紧凑，也可理解为全体百姓说：“阿们！要赞美雅威！”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 是当受称颂的
  rationale: 这是颂赞公式中的被动分词；译作“是当受称颂的”既保留庄重的礼仪语气，也比单纯的“有福的”更符合现代汉语对上帝的颂赞表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质，不以“主”这一称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达希伯来语的属格结构，并在汉语中自然地与“雅威”构成同位关系。
- source_word: מִן הָעוֹלָם וְעַד הָעֹלָם
  choice: 从永远到永远
  rationale: 保留原文首尾延展、没有界限的时间意象，也符合现代汉语庄重颂赞语体。
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: 全体百姓都说
  rationale: וַיֹּאמְרוּ推进叙事，כָל הָעָם指聚集的全体百姓；汉语语序自然清楚，无须机械补出“然后”。
- source_word: אָמֵן
  choice: 阿们！
  rationale: 保留广为人知的礼仪音译，并用感叹号体现会众回应的力度。
- source_word: וְהַלֵּל לַיהוָה
  choice: 并赞美雅威
  rationale: 原文表达极为紧凑，可理解为百姓在说“阿们”之外又向雅威发出赞美；正文采用自然的叙事表达，脚注保留其可能呈现为劝赞话语的形式。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文以音译保留其作为以色列上帝之专名的功能，而不以称号替代。
- issue: עוֹלָם 在颂赞公式中的时间范围
  choice: 从永远到永远
  alternative: 从亘古到永远；直到永永远远
  rationale: 此处强调无界限的时间延续；所选译法保留原文重复结构及颂赞张力，同时避免赋予该词超出希伯来习语的哲学定义。
- issue: וְהַלֵּל לַיהוָה 的句法与话语功能
  choice: 作为百姓行动的叙述：“并赞美雅威”
  alternative: 作为劝赞或引语：“要赞美雅威！”
  rationale: 希伯来语措辞紧凑，正文依上下文将其理解为百姓回应中的赞美行动；脚注明确保留命令式或直接呼喊式理解的可能，不把歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语体。“上帝”用于 אֱלֹהִים，“雅威”用于神名 יהוה；标点突出颂赞与会众回应。脚注标记均置于正文相应位置，并保留末句的句法歧义。
