  text: הָב֥וּ לַ/יהוָ֖ה כְּב֣וֹד שְׁמ֑/וֹ שְׂא֤וּ מִנְחָה֙ וּ/בֹ֣אוּ לְ/פָנָ֔י/ו הִשְׁתַּחֲו֥וּ לַ/יהוָ֖ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/029.yaml
  text: Ascribe to Yahweh the glory due his name; bring an offering and come before him[a]. Bow down to Yahweh in holy splendor.
translation:
  language: zh_hans
  text: 要将他名所当得的荣耀归给耶和华；带上供物，来到他面前。要在圣洁的华美中[a]向耶和华俯伏敬拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在圣洁的华美中”；也可能指：“穿着圣洁的礼服”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: 归给
  rationale: 在礼仪性的祈使句中，此词不是指实际转交某物，而是呼吁人承认并归给耶和华当得的荣耀；“归给”自然保留了这一惯用含义。
- source_word: לַיהוָה
  choice: 给耶和华／向耶和华
  rationale: 将四字神名 יְהוָה 音义惯例化地译作现代中文圣经读者熟悉的“耶和华”，并按句法分别搭配“归给”和“向”。
- source_word: כְּבוֹד שְׁמוֹ
  choice: 耶和华之名当得的荣耀
  rationale: 该结构可指与其名相称、应归于其名的荣耀；加入“当得的”表达敬拜公式的惯用含义。为避免代词指向含混，中文正文复现“耶和华”。
- source_word: שְׂאוּ מִנְחָה
  choice: 带着供物
  rationale: שְׂאוּ 本义为拿起、携带，与 מִנְחָה 连用时表示带来或呈上供物；“带着供物”兼顾动作及后接“来到”的句法。
- source_word: וּבֹאוּ לְפָנָיו
  choice: 来到他面前
  rationale: 保留希伯来文接近神、进入其临在的空间性和敬虔意味，不作不必要的扩展。
- source_word: הִשְׁתַּחֲווּ
  choice: 俯伏敬拜
  rationale: 该词既表示身体俯伏，也在此语境中表达敬拜；“俯伏敬拜”兼顾具体动作与礼仪功能。
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: 在圣洁的荣美中
  rationale: 该短语可理解为圣洁所具有的荣美，也可能指敬拜者的圣洁装束；正文采用较宽泛且富诗意的译法，并以脚注保留另一可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用普通读者最熟悉且具有专名功能的“耶和华”，不以“主”替代神名。
- issue: בְּהַדְרַת קֹדֶשׁ 的解释
  choice: 在圣洁的荣美中
  alternative: 穿着圣洁的礼服
  rationale: 希伯来短语诗意凝练，既可能描写圣洁的荣美，也可能涉及敬拜时的圣洁装束。正文不将其限缩为服饰含义，脚注保留该可能性。
- issue: הִשְׁתַּחֲווּ 的动作与敬拜含义
  choice: 俯伏敬拜
  alternative: 下拜／俯伏
  rationale: 只译“敬拜”会淡化身体动作，只译“俯伏”又可能弱化礼仪语境；合译兼顾两者。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留希伯来诗歌的祈使节奏。正文中的脚注标记[a]与脚注对应；标点将连续敬拜命令分为两句，以利朗读。
