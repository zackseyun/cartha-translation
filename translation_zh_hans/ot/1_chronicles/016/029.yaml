- from: 要将耶和华之名当得的荣耀归给他；带着供物来到他面前。要在圣洁的荣美中[a]向耶和华俯伏敬拜。
  to: 要将他名所当得的荣耀归给耶和华；带上供物，来到他面前。要在圣洁的华美中[a]向耶和华俯伏敬拜。
  rationale: 修订澄清“荣耀”归给耶和华而与“他名所当得的”相连，保留“带供物”与“来到他面前”的并列动作，并将脚注改为忠实反映בְּהַדְרַת קֹדֶשׁ的两种主要理解，避免无根据的因果译法。
