  text: הִֽתְהַֽלְלוּ֙ בְּ/שֵׁ֣ם קָדְשׁ֔/וֹ יִשְׂמַ֕ח לֵ֖ב מְבַקְשֵׁ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/010.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: zh_hans
  text: 你们要以雅威的圣名为荣；愿寻求雅威[a]的人心中欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为 יהוה（YHWH），以色列上帝的名；中文传统译作“耶和华”，也常音译作“雅威”。
    reason: 说明神名的原文形式及中文常见音译选择。
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: 要……为荣
  rationale: 该词是הלל的Hitpael命令式复数，在这里表示因某人或某事而夸耀、欢欣。中文“以……为荣”既保留命令语气和בְּ所引出的对象，又避免“夸口”在现代汉语中常有的负面色彩。
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: 以他的圣名
  rationale: 介词בְּ可表示夸耀所凭借或所关乎的对象；“以……为荣”是自然的现代汉语表达。“圣名”准确保留“名”与“圣”的修饰关系。
- source_word: יִשְׂמַח
  choice: 愿……欢喜
  rationale: 该形式在诗歌性的劝勉语境中可作祈愿或命令意味理解。“愿……欢喜”保留其祈愿语气，而不把它处理成单纯的事实陈述。
- source_word: לֵב
  choice: 心里
  rationale: 原文为单数“心”，在这里集合性地指寻求耶和华之人的内在生命。中文“人心里欢喜”自然表达这一含义，不必机械保留单数形式。
- source_word: מְבַקְשֵׁי
  choice: 寻求……的人
  rationale: 分词结构表示持续或具有特征性的行动；“寻求……的人”清楚、自然，并保留其名词化功能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文直接使用四字神名יהוה。正文采用现代中文读者最熟悉的传统音译“耶和华”，并以脚注说明原文形式及“雅威”这一常见替代译法。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: יהוה是专名而非“主”这一称号，因此正文保留为音译。中文传统广泛使用“耶和华”；“雅威”通常被视为更接近学界推定的古代读音，但原始读音不能完全确定，故在脚注中保留这一差异。
- issue: יִשְׂמַח的语气
  choice: 愿……欢喜
  alternative: ……必欢喜／……欢喜
  rationale: 紧接复数命令式之后，该未完成式很可能带祈愿语气。译作“愿”保存劝勉与祈愿之间的诗性张力，不将其确定为预言或一般事实。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以他的圣名为荣”比“夸耀他的圣名”更自然，也较少产生负面联想；分号保留原文两个平行劝勉分句的节奏。
