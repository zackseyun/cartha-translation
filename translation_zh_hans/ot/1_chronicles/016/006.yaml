base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/006.yaml
  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
translation:
  language: zh_hans
  text: 祭司比拿雅和雅哈悉常带着号筒，侍立在上帝的约柜前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“祭司比拿雅和雅哈悉常在上帝的约柜前吹号。”希伯来文没有明说“吹”这个动词，但这很可能是原意。
    reason: 说明原文的谓语省略，并保留较可能的动作性译法。
lexical_decisions:
- source_word: וּ/בְנָיָהוּ
  choice: 比拿雅
  rationale: 按现代中文圣经中通行的希伯来人名译法音译；句首连接词在单节中文中无需机械译出，以免行文生硬。
- source_word: וְ/יַחֲזִיאֵל
  choice: 和雅哈悉
  rationale: 人名按希伯来语形式音译，并用“和”连接并列人物。
- source_word: הַ/כֹּהֲנִים
  choice: 祭司
  rationale: 定冠词加复数名词，说明比拿雅和雅哈悉的职分；中文“祭司”可由上下文自然表达复数。
- source_word: בַּ/חֲצֹצְרוֹת
  choice: 带着号筒
  rationale: חֲצֹצְרוֹת特指号筒，不是泛指各种角号；介词ב在此表达伴随或工具关系。译作“带着号筒”既通顺，也不在正文中补入原文未明说的“吹”。
- source_word: תָּמִיד
  choice: 常
  rationale: 表达持续或经常性的履职状态；“常”在现代中文中简洁自然，并保留具体频率未明的空间。
- source_word: לִ/פְנֵי
  choice: 在……前
  rationale: 保留空间及礼仪场景中“在……面前”的含义，中文采用自然处所结构。
- source_word: אֲרוֹן בְּרִית
  choice: 约柜
  rationale: 该结构直指“约的柜”，中文圣经传统以“约柜”简洁而准确地表达。
- source_word: הָ/אֱלֹהִים
  choice: 上帝的
  rationale: 此处带定冠词的אֱלֹהִים指以色列的上帝；“上帝的约柜”自然表达所属关系。
theological_decisions:
- issue: 是否在正文明确说两位祭司吹号
  choice: 正文不补“吹”，译作“带着号筒，侍立”
  alternative: 祭司比拿雅和雅哈悉常在上帝的约柜前吹号
  rationale: 希伯来文没有明写谓语“吹”；上下文很可能指吹号，但正文保留这一省略，以免把推断写成明说。为使现代中文成为完整自然的句子，补入与礼仪站位相符、但不规定号筒具体动作的“侍立”，并在脚注交代较可能的理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“侍立”体现祭司在约柜前履行礼仪职分的场景，又避免正文直接断定他们正在吹号。脚注标记已在正文对应位置标出。
