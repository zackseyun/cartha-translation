  to: 于是，大卫把亚萨和他的弟兄留在那里，在雅威的约柜前，让他们持续地在约柜前服侍，照每日当办的事而行。
  rationale: 仅将“常常在约柜前供职”调整为“持续地在约柜前服侍”，以更准确反映תמיד与לשרת；其余措辞保留原有对地点、神名、群体称谓和每日职责的忠实表达。无需脚注：末句虽是希伯来习语，中文译文已保留其“每日相应职责”的含义，未消除需要以脚注保留的文本歧义。
