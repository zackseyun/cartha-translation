  naturalness: 整体通顺庄重。“持续地……服侍”比“常常……供职”更自然地表达持续履行礼仪职责；“照每日当办的事”简洁且符合现代书面语。
  terminology: “雅威”“约柜”“亚萨”均可接受并且前后一致。“服侍”在约柜前的礼仪语境中准确传达שרת，较“供职”更直接地表达实际执行的圣职服务。
