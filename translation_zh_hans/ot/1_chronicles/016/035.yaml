base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/035.yaml
  text: And say[a], “Save us, O God of our salvation; gather us and deliver us from the nations[b], that we may give thanks to your holy name and glory in your praise.”
translation:
  language: zh_hans
  text: 要说：“赐我们救恩的上帝啊，求你拯救我们！求你聚集我们，救我们脱离列国[a]，好让我们称谢你的圣名，并以赞美你为荣[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国”也可译作“万邦”或“外邦人”；这里主要指百姓散居其中的众国、众族。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“因赞美你而欢欣”或“在对你的赞美中夸耀”。“你的赞美”主要指对上帝的赞美；按语境也可能含有上帝所受赞美或可赞美性的意味。
    reason: lexical_and_semantic_ambiguity
lexical_decisions:
- source_word: וְאִמְרוּ
  choice: 又要说
  rationale: 保留连接词 וְ，并以复数命令语气承接礼仪中的共同宣告；“又要说”符合现代汉语的经文语体。
- source_word: הוֹשִׁיעֵנוּ
  choice: 求你拯救我们
  rationale: 这是 ישׁע 的使役式命令形，带第一人称复数后缀；“拯救”自然准确，也与后面的 נצל 所译“救……脱离”略作区分。
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: 赐我们救恩的上帝
  rationale: 原文直译为“我们救恩的上帝”。汉语用“赐我们救恩的上帝”较自然，并保留上帝是救恩源头的含义，不改写为后来固定化的称号。
- source_word: וְקַבְּצֵנוּ
  choice: 求你聚集我们
  rationale: קבץ 表示聚集、招聚；本处也可能含有从分散之地重新聚集的意味。“聚集我们”简洁并保留这一背景。
- source_word: וְהַצִּילֵנוּ
  choice: 救我们脱离
  rationale: נצל 的使役式在此表示从危险或外在权势下解救出来；与介词短语连译为“救我们脱离列国”最符合汉语表达。
- source_word: מִן־הַגּוֹיִם
  choice: 脱离列国
  rationale: גּוֹיִם 在此主要指以色列人散居其中的各国或各族，并不必然承载后来“外邦人”一词的神学分类；“列国”贴合历史与诗歌语境。
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  choice: 使我们称谢你的圣名
  rationale: לְ 加不定词在此表达目的；ידה 的使役式常指称谢。译文保留“圣名”这一敬虔表达。
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: 以赞美你为荣
  rationale: שׁבח 的反身式可指夸耀、欢欣或以某事为荣；תהלה 可指给予上帝的赞美，也可指上帝可赞美的荣美。正文采用自然且正面的“以赞美你为荣”，脚注保留其他可能。
theological_decisions:
- issue: הַגּוֹיִם 应译作“列国”还是“外邦人”
  choice: 列国
  alternative: 外邦人／各族
  rationale: 上下文关注百姓从散居的众国中被聚集、解救，不宜把新约时代较固定的犹太人—外邦人分类直接带入本节。
- issue: 末句自反式“夸耀”语言如何表达
  choice: 以赞美你为荣
  alternative: 因你当受的赞美而欢欣／以你的美誉夸耀
  rationale: 原文含有夸耀、欢欣的积极意味，其对象完全指向上帝；正文避免现代汉语中“自夸”的负面含义，同时用脚注保留希伯来语可能涵盖的语义幅度。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。以“上帝”译 אֱלֹהִים；两个“求你”使连续命令在汉语祷告语境中自然清楚。正文保持诗歌式并列结构，不过度古雅；脚注说明“列国”和末句赞美语言的真实语义幅度。
