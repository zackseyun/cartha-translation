  text: כִּ֠י כָּל אֱלֹהֵ֤י הָ/עַמִּים֙ אֱלִילִ֔ים וַ/יהוָ֖ה שָׁמַ֥יִם עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/026.yaml
  text: For all the gods of the peoples are idols[b][a], but Yahweh made the heavens.
translation:
  language: zh_hans
  text: 因为万民[a]的神全是偶像，但[b]耶和华造了诸天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万民”或译“列国”。
    reason: lexical_alternative
  - marker: b
    text: “但”原文直译为“而”，在这里表达转折对比。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为呼召敬拜耶和华说明理由；“因为”自然保留解释性的语气。
- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: 万民的神全是
  rationale: “万民”表达 הָעַמִּים 所指的各族人民，“全是”保留 כָּל 的周遍范围；“神”在此指万民所敬奉的神祇。
- source_word: אֱלִילִים
  choice: 偶像
  rationale: 该词指偶像，并含贬抑、虚无或无价值之意；正文用现代读者清楚易懂的“偶像”，不额外强化为“虚无之物”。
- source_word: וַיהוָה
  choice: 但耶和华
  rationale: וְ 字面可作“而、和”，但此处两句形成鲜明对比，故译作“但”；יהוה 按其专名译作“耶和华”。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 保留希伯来语复数形式及创造语境中的庄重感；“诸天”在现代中文圣经文体中清楚自然。
- source_word: עָשָׂה
  choice: 造了
  rationale: 直接表达“制作、造成”的含义，不用解释性更强的“创造”，并以“了”自然呈现已经完成的行动。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文以现代中文读者最熟悉的专名“耶和华”呈现四字神名，而不以“主”代替，从而保留原文中的圣约专名。
- issue: יהוה 前连接词 וְ 的语义力度
  choice: 转折性的“但”
  alternative: 并列性的“而”或“和”
  rationale: 连接词形式上是一般连接词，但上下句把万民的偶像与造诸天的耶和华相对照；正文呈现其语境中的转折功能，同时以脚注保留字面并列译法。
- issue: אֱלִילִים 的贬抑意味
  choice: 偶像
  alternative: 虚无之物／毫无价值的偶像
  rationale: “偶像”准确指出所指对象，也让与造物主的对比自行显明；不把词中可能含有的“无价值”意味扩写进正文，以免过度释义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“万民的神全是偶像”简洁呈现全面判断，“但耶和华造了诸天”保留原文鲜明的创造主对比。所有脚注标记均置于其所说明的词语之后。
