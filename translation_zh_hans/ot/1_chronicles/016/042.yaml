base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/042.yaml
  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
translation:
  language: zh_hans
  text: 与他们一起的有希幔和耶杜顿，还有号筒和钹，用来发出响声，以及上帝之歌所用的乐器；耶杜顿的儿子们在门口[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“负责守门”；希伯来语直译为“在／为门口”，可能表示他们奉派承担守门职务。
    reason: 保留介词短语的字面歧义，并说明其在职务语境中的可能含义。
lexical_decisions:
- source_word: וְעִמָּהֶם הֵימָן וִידוּתוּן
  choice: 与他们同在的还有希幔和耶杜顿
  rationale: 补出汉语所需的存在表达“还有”，自然呈现希伯来语介词短语所引出的随同人员；人名采用通行音译。
- source_word: חֲצֹצְרוֹת
  choice: 号筒
  rationale: 指礼仪中使用的金属吹奏号；“号筒”既明确是乐器，也符合现代汉语经文语体。
- source_word: וּמְצִלְתַּיִם
  choice: 钹
  rationale: 采用该打击乐器在现代汉语中的通行名称。
- source_word: לְמַשְׁמִיעִים
  choice: 使声音响起
  rationale: 保留使役词义“使人听见、使发出声音”，并按语境表达号筒和钹被奏响，而不额外限定为旋律或歌唱。
- source_word: וּכְלֵי שִׁיר הָאֱלֹהִים
  choice: 也用奏上帝之歌的乐器
  rationale: 将结构链直译意义自然化，保留“歌—上帝”的关系，同时用“奏……的乐器”形成现代汉语可读表达，避免笼统弱化为一般“乐器”。
- source_word: וּבְנֵי יְדוּתוּן
  choice: 耶杜顿的儿子们
  rationale: 按该家族及利未人职分语境保留明确的亲属称谓“儿子们”。
- source_word: לַשָּׁעַר
  choice: 在门口
  rationale: 希伯来语字面为“向着／为着门”；正文采用不缩窄含义的地点表达，把可能指派守门职务的理解留在脚注。
theological_decisions:
- issue: “上帝之歌”所表达的所属或用途关系
  choice: 奏上帝之歌的乐器
  alternative: 敬拜上帝所用的乐器
  rationale: 原文的属格结构可指属于上帝、献给上帝或用于敬拜上帝的歌；正文保留较开放的表达，不将其单一定义为敬拜用途。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。用分号理清人员与器乐安排，再以独立句呈现耶杜顿众子的门口职责；避免古奥倒装和宗派化术语。
