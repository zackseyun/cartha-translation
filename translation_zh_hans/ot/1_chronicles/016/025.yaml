  text: כִּי֩ גָד֨וֹל יְהוָ֤ה וּ/מְהֻלָּל֙ מְאֹ֔ד וְ/נוֹרָ֥א ה֖וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/025.yaml
  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
translation:
  language: zh_hans
  text: 因为耶和华伟大，当受极大的赞美；他在万神之上，当受敬畏。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的敬拜呼召，说明其理由；“因为”自然保留解释和因果作用。
- source_word: גָדוֹל
  choice: 伟大
  rationale: 表达地位与威严上的崇高；“伟大”在现代汉语中庄重、直接。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 保留四字神名作为专名；“耶和华”是现代中文读者最熟悉且可辨识的音译形式。
- source_word: מְהֻלָּל מְאֹד
  choice: 极配受赞美
  rationale: 被动分词带有应当受赞美、配得赞美的含义，מְאֹד 强烈加深程度；此译法兼顾形式与自然汉语。
- source_word: נוֹרָא
  choice: 当受敬畏
  rationale: 该词源于 ירא，表示使人产生敬畏；避免“可怕”偏向恐怖，也避免“令人惊叹”削弱敬虔畏惧的意味。
- source_word: עַל כָּל אֱלֹהִים
  choice: 在万神之上
  rationale: עַל 在此表达超越和居于其上；אֱלֹהִים 按复数直译为“神”，整体译为“万神”简洁自然，并保留经文的比较张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非称号，因此采用中文传统且广为人知的专名音译，不以“主”替代。
- issue: נוֹרָא 所表达的回应
  choice: 当受敬畏
  alternative: 令人畏惧／令人敬畏
  rationale: “当受敬畏”同时保留该词使人生畏的语义及敬拜语境中的应然意味，不将其弱化为一般的惊叹，也不限定为单纯恐惧。
- issue: “万神”所指的本体地位
  choice: 保留“万神”这一原文表述
  alternative: 一切假神／一切神明
  rationale: 原文使用 אֱלֹהִים 的复数形式；不在正文中判定这些对象是假神、偶像还是属灵存在，从而保留原文的修辞和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的礼拜性语言。“极配受赞美”体现 מְהֻלָּל מְאֹד 的强烈程度；分号呈现两个并列的神学宣告。
