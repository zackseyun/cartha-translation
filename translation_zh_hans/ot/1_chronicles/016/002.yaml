base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/002.yaml
  text: When David finished offering up the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh.
translation:
  language: zh_hans
  text: 大卫献完燔祭和平安祭[a]，就奉雅威的名为百姓祝福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: 献完……就
  rationale: 该叙事形式既表明献祭完成，也衔接随后为百姓祝福的动作；“……完，就……”符合现代汉语叙事表达。
- source_word: מֵהַעֲלוֹת
  choice: 献完
  rationale: 介词 מִן 与 עלה 的不定式结构跟在 כלה 之后，表达“完成献上”；中文以“献完”自然、简洁地传达这一意思。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: עֹלָה 是指祭物焚烧献上的标准祭祀术语；“燔祭”是中文圣经语境中准确而通行的名称。
- source_word: וְהַשְּׁלָמִים
  choice: 和平安祭
  rationale: שְׁלָמִים 可涉及平安、福祉及团契；正文采用通行的祭祀术语“平安祭”，并用脚注保留其他合理译法。
- source_word: וַיְבָרֶךְ
  choice: 为……祝福
  rationale: ברך 在此指向百姓施予或宣告祝福；“为百姓祝福”在现代汉语中自然明确。
- source_word: אֶת־הָעָם
  choice: 百姓
  rationale: 原文仅为“那百姓/人民”，并未明说“所有”；因此不增添“全体”等量词。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉雅威的名
  rationale: בְּשֵׁם 表示“以……的名义/奉……的名”；“奉……的名”符合庄重而自然的现代汉语宗教表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
theological_decisions:
- issue: 祭名 שְׁלָמִים 的译法
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 该词的语义可涵盖平安、福祉和共享团契。正文采用中文读者较熟悉且不把含义限于某一层面的“平安祭”，脚注列出其他可能译法。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近学界通常重构读音的“雅威”，保留专名性质；“耶和华”是中文传统形式，但较不贴近该名称的通常重构发音。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“燔祭”“平安祭”保留必要的古代祭祀术语；句式以“……完，就……”清楚呈现两个动作的先后关系。
