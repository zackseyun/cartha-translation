base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/020.yaml
  text: And they wandered from nation to nation[a], and from one kingdom to another people.
translation:
  language: zh_hans
  text: 他们从一国辗转到另一国[a]，从一个王国到另一个民族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辗转”也可译作“往来”或“迁移”。
    reason: 原文动词表示从一处到另一处活动，可侧重反复往来或迁移；上下文没有明确说明这种移动是否漫无目的。
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: 辗转
  rationale: 该词是הלך的Hitpael形式，在这里表达反复迁移、从一处到另一处的动态。“辗转”既保留这种连续移动的意味，也比带有漫无目的色彩的“游荡”更符合上下文。
- source_word: מִגּוֹי אֶל גּוֹי
  choice: 从一国到另一国
  rationale: גּוֹי在此译作“国”，保留政治群体的含义；“从一国到另一国”自然表达希伯来文的分布式结构。
- source_word: וּמִמַּמְלָכָה
  choice: 从一个王国
  rationale: מַמְלָכָה意为“王国”。中文补出“一个”，以清楚呈现与后文“另一个”相配的转换关系。
- source_word: אֶל עַם אַחֵר
  choice: 到另一个民族
  rationale: עַם译作“民族”，以保留它与前面的גּוֹי（国）之间的用词区别；אַחֵר译作“另一个”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代书面语。保留原文“国—王国—民族”的词汇变化及第二分句中“王国”与“民族”的不对称表达，不将其统一改写。
