  yaml_path: translation/ot/1_chronicles/016/043.yaml
  text: Then all the people went[a], each man to his house, and David turned to bless his household.
translation:
  language: zh_hans
  text: 众人各自回家去了；大卫转身去为自己的家人[a]祝福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家人”原文直译为“家”；这个词既可指房屋或住处，也可指家人或家室。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 去了
  rationale: 该叙事性动词表示接续发生的行动；结合“回家”，译为“去了”自然简洁。
- source_word: כָל הָעָם
  choice: 众人都
  rationale: עָם在此指聚集的民众；“众人都”符合现代汉语叙事表达，也保留全体之意。
- source_word: אִישׁ לְבֵיתוֹ
  choice: 各自回家
  rationale: אִישׁ在这里具有逐一分配的作用，即每个人都回到自己的住处；“各自回家”准确而自然。
- source_word: וַיִּסֹּב
  choice: 转身
  rationale: סבב在此表示大卫从公共聚会转向自己的家；“转身”保留动词的基本意象，避免把它明确解释成“返回”。
- source_word: לְבָרֵךְ
  choice: 去……祝福
  rationale: 不定式表示目的；“去……祝福”自然表达大卫转身的目的，并保留“祝福”的宗教及关系含义。
- source_word: בֵּיתוֹ
  choice: 自己的家人
  rationale: 此处בַּיִת很可能指大卫家中的人，而不只是建筑物；“家人”在中文中最自然，脚注保留“家／家室”的词义幅度。
