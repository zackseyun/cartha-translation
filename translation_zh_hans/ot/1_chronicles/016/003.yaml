  text: וַ/יְחַלֵּק֙ לְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל מֵ/אִ֖ישׁ וְ/עַד אִשָּׁ֑ה לְ/אִישׁ֙ כִּכַּר לֶ֔חֶם וְ/אֶשְׁפָּ֖ר וַ/אֲשִׁישָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/003.yaml
  text: He distributed to every person of Israel[a], from man to woman, to each one a loaf of bread, a portion of meat, and a raisin cake.
translation:
  language: zh_hans
  text: 他把食物分给以色列众人，无论男女，每人一个饼、一份肉[a]和一个葡萄干饼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一份”，也可能指另一种食物。希伯来语 אֶשְׁפָּר 很少见，确切含义不明；许多人在这里将其理解为一份肉。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: 他把食物分给
  rationale: 该词是חלק的Piel叙事形式，在这里表示把各份物品分发给众人。结合后列食物，用“把食物分给”符合现代汉语表达。
- source_word: לְכָל אִישׁ יִשְׂרָאֵל
  choice: 以色列众人
  rationale: אִישׁ在此具有逐一分配的意味，而下句明确包括男人和女人；“以色列众人”既涵盖所有领受者，也避免在汉语中误解为只有男性。
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: 无论男女
  rationale: 希伯来语直译为“从男人到女人”，是涵盖所有人的两极表达；“无论男女”自然清楚，并保留男女都包括在内的明确意思。
- source_word: לְאִישׁ
  choice: 每人
  rationale: 这里的אִישׁ承接前句，表示每一位领受者，不限男女；“每人”准确表达逐一分配。
- source_word: כִּכַּר לֶחֶם
  choice: 一个饼
  rationale: כִּכָּר在此指一整个圆形或饼状的面包；“一个饼”简洁自然，也适合古代食物语境。
- source_word: אֶשְׁפָּר
  choice: 一份肉
  rationale: 此词罕见，确切含义不明。在节庆分发食物的语境中，常理解为一份肉；正文采用这一较通行的解释，并以脚注保留不确定性。
- source_word: אֲשִׁישָׁה
  choice: 一个葡萄干饼
  rationale: 该词通常指压制成形的果饼，多理解为葡萄干制成；“葡萄干饼”简明易懂。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“无论男女”自然传达希伯来语“从男人到女人”的涵盖性表达；对罕见词אֶשְׁפָּר的歧义不在正文中强行消解，而通过脚注说明。
