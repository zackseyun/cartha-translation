base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/014.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: zh_hans
  text: 他是雅威，是我们的上帝[b]；他的审判遍及全地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“全境”；希伯来语 אֶרֶץ 既可指全世界，也可指某一片土地。这里的颂赞语境较支持普世性的理解。
    reason: lexical_alternative
  - marker: b
    text: “雅威”音译希伯来文神名 YHWH；传统译本常译作“耶和华”或以“主”代称。
    reason: alternative_reading
lexical_decisions:
- source_word: הוּא
  choice: 他是
  rationale: 独立代词带有强调作用；希伯来语名词句在中文中自然补出“是”，既清楚又保留强调。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按通常重构的读音音译神名 YHWH，保留其作为专名的性质，不以“主”这一称号替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 虽然 אֱלֹהִים 形式上是复数形态，但此处所指明确是以色列独一的上帝；第一人称复数词尾译为“我们的”。
- source_word: בְּכָל הָאָרֶץ
  choice: 遍及全地
  rationale: בְּכָל 表示涵盖整个范围；“遍及”比静态的“在”更符合现代汉语。此处“全地”保留 אֶרֶץ 可指普世或全境的语义空间，并由脚注说明。
- source_word: מִשְׁפָּטָיו
  choice: 他的审判
  rationale: מִשְׁפָּט 可指判决、审判、公义施行或典章；“审判”保留司法和治理含义，不将其窄化为法规或抽象的公义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 YHWH。正文采用较贴近通常重构读音的“雅威”，以专名呈现；脚注交代传统译法，避免读者误以为原文只是称号。
- issue: הָאָרֶץ 的范围
  choice: 全地（正文语境可理解为全世界）
  alternative: 全境；遍地
  rationale: 上下文是普世性的颂赞，因此正文自然呈现广阔范围；但 אֶרֶץ 本身也可指一片土地或疆域，脚注保留这一真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他是”保留原文句首代词的强调；“遍及全地”比逐字译作“在全地”更符合中文表达。脚注标记均置于相应词语之后。
