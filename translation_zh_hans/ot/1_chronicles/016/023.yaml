base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/023.yaml
  text: Sing to Yahweh[a], all the earth[b]; proclaim his salvation from day to day.
translation:
  language: zh_hans
  text: 全地[b]都要向雅威[a]歌唱；要天天传扬他的拯救[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神圣名字 יהוה 的音译，传统上也译作“耶和华”。
    reason: divine_name
  - marker: b
    text: “全地”也可译作“全境”；这里的诗歌语境表明，号召面向普天下。
    reason: lexical_ambiguity
  - marker: c
    text: “传扬”所译的原文动词带有传报好消息的意思；本句也可译作“要日复一日传报他拯救的佳音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: 歌唱
  rationale: 该词是复数命令式，直接发出歌唱的号召；“歌唱”自然、准确，不额外加入“赞美”等原文未明说的成分。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 לְ 在这里表示歌唱的对象，以“向”符合现代汉语表达；专名 יהוה 音译为“雅威”，保留原文所用的神圣名字。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: אֶרֶץ 可指“地、土地、国土”；在这首向普世发出的诗歌号召中，“全地”既保留希伯来语意象，也表达普遍范围。
- source_word: בַּשְּׂרוּ
  choice: 传扬……好消息
  rationale: 该词的 Piel 命令式不只是一般性的宣告，还带有报好消息的意味；用“传扬……好消息”把这一语义明确而自然地表达出来。
- source_word: מִיּוֹם אֶל יוֹם
  choice: 天天
  rationale: 这一表达表示日复一日、持续不断；“天天”是简洁自然的现代汉语说法。
- source_word: יְשׁוּעָתוֹ
  choice: 他拯救的好消息
  rationale: יְשׁוּעָה 可指拯救、解救或胜利。结合 בַּשְּׂרוּ，将其置于“好消息”结构中，表达“关于他的拯救的好消息”，同时不把具体拯救方式限定得过窄。
theological_decisions:
- issue: 神圣名字 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名 יהוה；“雅威”较贴近通常重构的读音，也让读者看出这里是专名，而不是称号。脚注同时说明传统译名，便于不同背景的读者理解。
- issue: יְשׁוּעָתוֹ 中所属关系的理解
  choice: 保留为“他拯救的好消息”
  alternative: 他赐下的救恩
  rationale: 希伯来语字面是“他的拯救”，既可侧重雅威施行的拯救，也可指源于或属于他的救恩；正文避免加入“赐下”等原文未明确表达的关系。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“全地都要”把希伯来语复数命令式与呼语自然地转化为汉语号召；分号保留两项平行命令。正文中的脚注标记按所注词语就近放置，因此出现顺序为 [b]、[a]、[c]。
