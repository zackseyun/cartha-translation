  yaml_path: translation/ot/1_chronicles/016/032.yaml
  text: Let the sea thunder[a], and all that fills it; let the field exult[b], and all that is in it.
translation:
  language: zh_hans
  text: 愿海和充满其中的一切[b]都轰鸣[a]；愿田野和其中的一切都欢腾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“发出雷鸣”或“咆哮”。希伯来语动词可指发出响亮的隆隆声或吼声。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“它的充满”，指充满海的一切。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  choice: 轰鸣
  rationale: רעם表示发出雷鸣般响亮、低沉而震撼的声音。“轰鸣”既保留强烈的声音意象，也能自然地以“海”为主语。
- source_word: הַיָּם
  choice: 海
  rationale: יָם的常用对应词；简洁自然，并符合诗歌语体。
- source_word: וּמְלוֹאוֹ
  choice: 其中所充满的一切
  rationale: מְלוֹא字面指“它的充满/丰满”，在此表示充满海的一切。“其中所充满的一切”保留原文意象，同时让现代读者容易理解。
- source_word: יַעֲלֹץ
  choice: 欢腾
  rationale: עלץ表达强烈、欣喜的欢乐。“欢腾”比一般的“喜乐”更能体现诗句中洋溢而外显的欢欣。
- source_word: הַשָּׂדֶה
  choice: 田野
  rationale: שׂדה可指田地或开阔原野。“田野”自然、形象，也与“海”构成诗意对应。
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: 和其中的一切
  rationale: 该关系从句回指“田野”，表达其中所有事物；此译法简洁保留了כָל的总括性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。将两个并列结构整合为“海和……都轰鸣”与“田野和……都欢腾”，使原文省略谓语的并列成分在汉语中表达清楚，同时保留海与田野彼此呼应的拟人化意象。
