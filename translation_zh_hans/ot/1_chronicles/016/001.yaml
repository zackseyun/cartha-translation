  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יַּצִּ֣יגוּ אֹת֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָֽטָה ל֖/וֹ דָּוִ֑יד וַ/יַּקְרִ֛יבוּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/001.yaml
  text: So they brought in the ark of God and set it in the midst of the tent that David had pitched for it[b][a], and they offered burnt offerings and peace offerings before God.
translation:
  language: zh_hans
  text: 他们把上帝的约柜带来，安放在大卫为约柜搭设的帐棚中央[a]，又在上帝面前献上燔祭和平安祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐棚中央”也可译作“帐棚里面”；原文短语既可指某物的中央，也可泛指其内部。
    reason: lexical_alternative
  - marker: b
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: 抬来
  rationale: 该词在使役词干中意为“带来、运来”。约柜按礼仪由人抬运，因此“抬来”既符合语境，也自然具体。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: 原文直译为“上帝的柜”，在此指约柜；不扩写为“上帝的约柜之柜”等更完整的盟约称谓，以免加入本节没有的字词。
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: 安放
  rationale: 使役形式表示把物件置于指定位置。“安放”适合约柜的庄重语境，又不增添固定或供奉等含义。
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: 帐棚中央
  rationale: בְּתוֹךְ既可具体指“中央”，也可泛指“里面”。正文保留较具体的空间意义，并以脚注说明另一种可能。
- source_word: הָאֹהֶל
  choice: 帐棚
  rationale: 原文使用普通名词“帐棚”，且说明是大卫所搭设的；不用“会幕”，以免把它直接等同于摩西会幕。
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִיד
  choice: 大卫为约柜搭设的
  rationale: נטה用于帐棚时指支搭、搭设；לוֹ理解为“为它”，其指代对象在中文中明说为“约柜”，避免代词含混。
- source_word: וַיַּקְרִיבוּ
  choice: 献上
  rationale: 在献祭语境中，该使役形式表示呈献祭物；“献上”是自然且准确的礼仪用语。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 这是以祭物在坛上焚烧为特征的特定祭类。“燔祭”是简体中文圣经语境中准确而简洁的固定术语。
- source_word: שְׁלָמִים
  choice: 平安祭
  rationale: 该词属于שׁלם语义场，可表达平安、福祉及共享相交。“平安祭”保留传统祭名，脚注列出可反映其他语义侧面的译法。
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: 在上帝面前
  rationale: 原文意为“在上帝面前／临在中”；此译简洁、自然，并保留礼仪行动是在上帝面前进行的含义。
theological_decisions:
- issue: 献祭术语的具体性
  choice: 保留“燔祭”和“平安祭”两个不同祭类
  alternative: 笼统译作“祭物”或将שְׁלָמִים译作“团契祭／福祉祭”
  rationale: 原文明确区分两种祭，不应将其泛化；正文采用通行术语，同时以脚注保留שְׁלָמִים的词义幅度。
- issue: 帐棚的身份
  choice: 译作“帐棚”
  alternative: 译作“会幕”
  rationale: 本节只使用普通名词אֹהֶל，并说明它由大卫为约柜搭设；译作“会幕”可能把本节未明确表达的身份认定带入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“抬来”贴合约柜的实际运送方式；“安放”比一般的“放”更合乎礼仪语境。脚注标记按其对应词语分别置于正文中。
