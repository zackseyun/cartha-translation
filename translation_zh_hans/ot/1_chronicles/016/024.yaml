  text: סַפְּר֤וּ בַ/גּוֹיִם֙ אֶת כְּבוֹד֔/וֹ בְּ/כָל הָ/עַמִּ֖ים נִפְלְאֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/024.yaml
  text: Declare his glory among the nations, his wondrous deeds among all the peoples.
translation:
  language: zh_hans
  text: 要在列国中传扬他的荣耀，在万民中传扬他的奇妙作为。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  choice: 传扬
  rationale: 这是ספר的复数祈使式，要求公开述说、宣告；“传扬”既保留向众人宣告的意味，也符合现代中文赞美诗体的庄重语感。
- source_word: בַגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם在此泛指各国；介词ב按语境译为“在……中”。“列国”也与下句“万民”形成对应而不混同。
- source_word: כְּבוֹדוֹ
  choice: 他的荣耀
  rationale: כָּבוֹד在此涵盖上帝所显出的尊荣、威严与光辉；“荣耀”是自然且准确的中文圣经用语。
- source_word: בְּכָל־הָעַמִּים
  choice: 在万民中
  rationale: עַמִּים指众多族群或人民；“万民”自然表达“所有的人民”，并保留与前句“列国”的诗歌平行。
- source_word: נִפְלְאֹתָיו
  choice: 他的奇妙作为
  rationale: 该词指令人惊叹的非凡行动；“奇妙作为”同时传达其奇妙性质和具体作为。
theological_decisions:
- issue: 两个第三人称单数阳性后缀所指对象
  choice: 保留“他的”，按上下文指以色列的上帝
  alternative: 直接译成“耶和华的”
  rationale: 历代志上16章的上下文明确以耶和华为赞美对象，但希伯来文本本节使用代词后缀。保留代词既忠实于原文，也不增添本节未明说的称谓。
translation_notes:
  register: 采用庄重、清晰的现代标准普通话。“列国／万民”和“荣耀／奇妙作为”保留原文两行的诗体平行；第二行补出“传扬”，使中文句法完整，并明确呈现原文省略谓语的平行结构。
