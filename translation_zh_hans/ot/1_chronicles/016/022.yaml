base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/022.yaml
  text: Do not touch my anointed ones[a], and do not harm my prophets.
translation:
  language: zh_hans
  text: “不可触碰我的受膏者[a]，不可伤害我的先知。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是复数，直译“我的受膏者们”。这里的希伯来词与“弥赛亚”一词同源，但在本节泛指上帝所膏立的人，并非专指弥赛亚。
    reason: 说明原文的复数形式及其非专指弥赛亚的词义，防止读者误解。
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: 碰
  rationale: נגע的基本义是“触碰”。在禁令及其与“伤害”的平行关系中，这里含有敌意接触或侵犯之意；译作“碰”既直接，也保留原文措辞的广度。
- source_word: בִּמְשִׁיחָי
  choice: 我的受膏者
  rationale: מָשִׁיחַ意为“受膏者”；此处希伯来语为复数并带第一人称单数后缀。现代汉语“受膏者”本身不标示单复数，结合后半句“我的先知”和上下文可作群体理解，同时避免误译成专指性的“弥赛亚”。
- source_word: וּבִנְבִיאַי
  choice: 我的先知
  rationale: נָבִיא意为“先知”；原文是复数并带第一人称单数后缀。汉语“我的先知”自然地保留这一群体表达。
- source_word: תָּרֵעוּ
  choice: 伤害
  rationale: רעע在此使役词干的禁令中表示加害、作恶于某人。“伤害”简洁自然，并且不限定伤害的具体方式。
- source_word: אַל
  choice: 不可
  rationale: אַל与未完成式动词连用构成禁令。“不可”符合诗歌和礼仪语境，庄重而易懂。
theological_decisions:
- issue: 非专指弥赛亚语境中的מְשִׁיחָי
  choice: 我的受膏者
  alternative: 我的弥赛亚们
  rationale: 该词虽与“弥赛亚”同源，但这里是复数普通名词，广泛指上帝所膏立的人，并非专指那位弥赛亚。译作“受膏者”可避免加入原文没有明确表达的基督论专指。
- issue: 是否在正文中显明מְשִׁיחָי的复数
  choice: 正文采用自然的汉语集合表达“受膏者”，脚注说明原文为复数
  alternative: 我的众受膏者
  rationale: “众受膏者”虽明确标出复数，却较不自然，也略显人为强调。汉语名词通常不强制标数；脚注可准确交代原文形态。
translation_notes:
  register: 采用现代、庄重而简洁的禁令句式。“不可……不可……”保留希伯来诗句的平行结构；“碰”保留原词的直接性，“伤害”则自然表达后一动词的广义加害含义。
