  text: וְ/הָ/אֱלֹהִים֙ אָ֣מַר לִ֔/י לֹא תִבְנֶ֥ה בַ֖יִת לִ/שְׁמִ֑/י כִּ֣י אִ֧ישׁ מִלְחָמ֛וֹת אַ֖תָּה וְ/דָמִ֥ים שָׁפָֽכְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/003.yaml
  text: But God said to me[a], ‘You shall not build a house for my name[b], because you are a man of wars and have shed blood.’
translation:
  language: zh_hans
  text: 但神对我说：“你不可为我的名建造殿宇[a]，因为你是个征战之人[b]，并且流了人的血。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为我的名建造殿宇”指建造圣殿，就是与神的名和同在相联系的敬拜之所。
    reason: cultural_note
  - marker: b
    text: 希伯来文直译为“战争之人”；这里的“战争”是复数，可表示屡次征战。也可译作“战士”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֱלֹהִים
  choice: 但神
  rationale: וְ在上下文中承接大卫想建殿却受禁止的转折，译作“但”能自然表达这一语篇关系；אֱלֹהִים在此指以色列的神。
- source_word: אָמַר לִי
  choice: 对我说
  rationale: 直接对应“说”及其间接受词，保留神亲自向大卫发言的叙述形式。
- source_word: לֹא תִבְנֶה
  choice: 你不可……建造
  rationale: לֹא加未完成式在神的直接话语中表达禁止，也带有郑重宣告大卫不得承担此事的意味；“不可”兼顾这两层语气。
- source_word: בַיִת לִשְׁמִי
  choice: 为我的名建造殿宇
  rationale: בַיִת本义为“房屋”，此处明确指敬拜场所。中文“殿宇”既让普通读者明白所指，又保留“为我的名建造”的希伯来表达；脚注说明其文化和神学含义。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达后文是神所给出的理由。
- source_word: אִישׁ מִלְחָמוֹת
  choice: 征战之人
  rationale: 希伯来文直译为“战争之人”，其中“战争”是复数，着重大卫屡次参与战争；“征战之人”在现代中文中庄重而自然，且不把原文缩减为单纯的职业称号“战士”。
- source_word: וְדָמִים שָׁפָכְתָּ
  choice: 并且流过血
  rationale: 对应“流血”的希伯来惯用语。原文דָמִים为复数，但中文通常用单数“血”；不添加“无辜”或“人的”，以免超出本节明说的范围。
theological_decisions:
- issue: 大卫不得建造圣殿的原因及其道德性质
  choice: 按原文陈述：大卫是征战之人，并且流过血，因此不得为神的名建造殿宇。
  alternative: 把这些流血事件明确解释为有罪的暴力，或明确解释为虽正当却造成礼仪上的不适任。
  rationale: 本节给出征战和流血这两个理由，却没有明言这些行为本身是否有罪，也没有解释这是礼仪性限制还是角色上的不相称。译文保留这种神学张力，不替原文作进一步裁定。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“殿宇”比“房屋”更清楚地传达上下文中的圣殿所指，同时以脚注保留“为我的名建造”的文化内涵；“征战之人”保留原文的反复战争色彩，不额外判断流血的道德性质。
