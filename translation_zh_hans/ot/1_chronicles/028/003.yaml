  to: 但神对我说：“你不可为我的名建造殿宇[a]，因为你是个征战之人[b]，并且流了人的血。”
  rationale: 仅将可能误解为本人出血的“流过血”改为“流了人的血”，以准确表达原文“shed blood”的施事意义。其余措辞和脚注可保留；译文不就流血是否有罪、是否仅属礼仪不适任作超出原文的判断。
