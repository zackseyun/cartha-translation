base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/021.yaml
  text: And behold[a], the divisions of the priests and the Levites are for all the service of the house of God, and with you in all the work will be every willing man skilled in wisdom for every kind of service; the officials also, and all the people[b], will be wholly at your command.
translation:
  language: zh_hans
  text: 看哪，祭司和利未人的各班次，都是为上帝殿里的一切事奉而设的；在各项工作中，凡甘心而有技能[a]、能承担各样事务的人，都必与你同在。众官长和全体百姓，也都必听从你的一切吩咐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“凡在智慧上甘心的人”；“智慧”在此类工艺和实际服务的语境中，也可指技能或才干。
    reason: 说明נָדִיב与בַּחָכְמָה的表达，并保留“智慧”与实际技能的语义关联。
  - marker: b
    text: 原文直译为“为着你的一切话”，意思是预备照你的各项指示行事，或处理你交代的各样事情。
    reason: 交代לְכָל דְּבָרֶיךָ的字面形式和语境含义。
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、加强语气的指示性话语标记，同时符合庄重的现代汉语表达。
- source_word: מַחְלְקוֹת
  choice: 各班次
  rationale: 这里指祭司和利未人按组织划分的班组或轮值单位；“班次”比泛称“分组”更贴合圣殿职事语境。
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: 祭司和利未人
  rationale: 直接保留两类承担圣殿职事者的制度性区别。
- source_word: לְכָל עֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: 办理上帝殿里的一切事奉
  rationale: “上帝的殿”保留原文具体表述；עֲבוֹדָה在此指圣殿职事，译作“事奉”可与一般工程工作区分。
- source_word: וְעִמְּךָ בְכָל מְלָאכָה
  choice: 在各项工作上……也都与你同在
  rationale: 保留“与你同在”的支持性含义，并将מְלָאכָה按工程和实际任务的广义译为“工作”。
- source_word: לְכָל נָדִיב בַּחָכְמָה
  choice: 各种自愿而有智慧的人
  rationale: נָדִיב表达甘心自愿，חָכְמָה在工艺语境兼含智慧与技能；正文保留“智慧”，脚注说明也可理解为有技能。
- source_word: לְכָל עֲבוֹדָה
  choice: 能承担各样事务
  rationale: 表达这些甘心而有智慧的人可参与各种具体职事或任务，也避免与前面的圣殿“事奉”完全重复。
- source_word: וְהַשָּׂרִים וְכָל הָעָם
  choice: 众官长和全体百姓
  rationale: שָׂרִים在王国行政语境指官员或首领，“官长”庄重而准确；“全体百姓”保留范围的完整性。
- source_word: לְכָל דְּבָרֶיךָ
  choice: 听从你的一切吩咐
  rationale: 原文直译为“为着你的一切话”，语境中指随时照所罗门的指示行事；正文采用自然汉语，脚注保留字面可能性。
theological_decisions:
- issue: בֵּית הָאֱלֹהִים的表达
  choice: 上帝的殿
  alternative: 圣殿
  rationale: 保留原文“上帝之家/殿”的具体宗教表达，不以语境性简称“圣殿”取代。
- issue: נָדִיב的性别与范围
  choice: 自愿……的人
  alternative: 甘心的男子
  rationale: 希伯来语为阳性单数，但在此概括参与工程的人员类别；现代汉语“人”并未主动扩大或限定性别，且自然传达该泛指结构。
- issue: חָכְמָה的智慧与技能含义
  choice: 有智慧
  alternative: 有技能
  rationale: 保留该词的基本词义及其神学—实践张力，不在正文中完全收窄为技术能力；脚注交代工艺语境中的技能含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“班次”“事奉”“官长”保留圣殿与王国行政语境；句子适度拆分，以免希伯来语长并列结构在中文中过于滞重。所有脚注标记均已置于正文相应位置。
