source:
  edition: WLC
  text: וְ/אַתָּ֣ה שְׁלֹמֹֽה בְנִ֡/י דַּע֩ אֶת אֱלֹהֵ֨י אָבִ֜י/ךָ וְ/עָבְדֵ֗/הוּ בְּ/לֵ֤ב שָׁלֵם֙ וּ/בְ/נֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְ/כָל יֵ֥צֶר מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם תִּדְרְשֶׁ֨/נּוּ֙ יִמָּ֣צֵא לָ֔/ךְ וְ/אִם תַּֽעַזְבֶ֖/נּוּ יַזְנִיחֲ/ךָ֥ לָ/עַֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/009.yaml
  text: And you[a], Solomon my son, know the God of your father and serve him with a whole heart and a willing soul, for Yahweh searches all hearts and understands every intention of the thoughts. If you seek him, he will let himself be found by you; but if you forsake him[b], he will cast you off forever.
translation:
  language: zh_hans
  text: “至于你，我儿所罗门，你要认识你父亲的上帝，以完全的心、乐意的心灵事奉他；因为耶和华鉴察所有人的心，洞悉一切心思意念。你若寻求他，他必让你寻见他[a]；你若离弃他，他必永远弃绝你[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必被你寻见。”希伯来语动词属被动式，也可带反身意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他必永远拒绝你。”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּע
  choice: 认识
  rationale: 该命令不只是要求在知识上知道上帝，也包含亲身承认并与他建立忠诚关系；“认识”简洁保留这种关系性含义。
- source_word: אֱלֹהֵי אָבִיךָ
  choice: 你父亲的上帝
  rationale: 忠实表达原文的组合关系，也保留大卫对所罗门嘱咐中家族与圣约的延续性。
- source_word: וְעָבְדֵהוּ
  choice: 事奉他
  rationale: 这里的 עבד 包括敬拜、服侍与顺服；“事奉”比单说“敬拜”涵盖面更广，并符合庄重语体。
- source_word: בְּלֵב שָׁלֵם
  choice: 以完全的心
  rationale: שָׁלֵם 表示完整、全心和正直。“完全的心”保留原文意象；此处并非宣称毫无罪错，而是强调内心完整、不分裂。
- source_word: וּבְנֶפֶשׁ חֲפֵצָה
  choice: 甘愿的性命
  rationale: נֶפֶשׁ 指人的生命、自我或性命，不宜直接缩减为“心思”；חֲפֵצָה 表示甘愿、乐意。此译保留它与“心”的区别，虽略带希伯来式表达。
- source_word: כִּי כָל לְבָבוֹת דּוֹרֵשׁ יְהוָה
  choice: 因为耶和华鉴察所有人的心
  rationale: דרשׁ 在此是查究、察看之意，不是因不知道而寻找；“鉴察”自然地表达上帝洞察人心。补出“人的”使汉语清楚，不改变范围。
- source_word: וְכָל יֵצֶר מַחֲשָׁבוֹת מֵבִין
  choice: 洞悉心思的一切意念
  rationale: יֵצֶר 可指形成、倾向或意图，与 מַחֲשָׁבוֹת 连用时聚焦思想内部所形成的意向；译文保留其内在动机层面，同时避免生硬直译。
- source_word: אִם תִּדְרְשֶׁנּוּ
  choice: 你若寻求他
  rationale: 这里指以忠诚和倚靠寻求上帝；“寻求”是清楚且符合圣约语境的表达。
- source_word: יִמָּצֵא לָךְ
  choice: 他必让你寻见
  rationale: מצa 的尼法勒式可作被动或带反身意味；正文体现上帝使自己可被寻见的语气，脚注保留较直接的被动译法。
- source_word: תַּעַזְבֶנּוּ
  choice: 你若离弃他
  rationale: עזב 在此带有背弃忠诚、抛弃关系的严肃含义；“离弃”准确而庄重。
- source_word: יַזְנִיחֲךָ לָעַד
  choice: 他必永远弃绝你
  rationale: זנח 的使役形表达拒绝、丢弃；“弃绝”保留警告的强度，לָעַד 直译为“永远”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的音译呈现四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: “心”与“性命”的人论用语
  choice: 保留两个不同的词，译作“完全的心、甘愿的性命”。
  alternative: 译作“全心全意，甘心乐意”，或将 נֶפֶשׁ 译为“心灵”。
  rationale: 原文有意并列 לֵב 与 נֶפֶשׁ，表达整个人的忠诚与意愿。保留区分可避免把两者都化约为现代心理范畴，也不额外建立僵硬的人性分部理论。
- issue: יִמָּצֵא לָךְ 中上帝可被寻见的方式
  choice: 正文译作“他必让你寻见”，并以脚注注明“他必被你寻见”。
  alternative: “你必寻见他。”
  rationale: 尼法勒式保有被动或反身张力。正文表达寻见并非单纯由人的能力促成，脚注则保留其更形式对应的译法，不以某一后期教义体系消解含混。
- issue: 圣约警告的严厉程度
  choice: 译作“他必永远弃绝你”。
  alternative: “他必永远拒绝你”或“他必永远丢弃你”。
  rationale: 原文明确提出严厉而持久的警告。译文不弱化“永远”，也不借本节解决它与其他神学命题之间的关系。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话书面语。保留“心”“性命”“事奉”“离弃”“弃绝”等具有原文意象和圣约分量的词；句法略作汉语化，以分号呈现理由与两项条件之间的层次。所有脚注标记均置于正文对应处。
