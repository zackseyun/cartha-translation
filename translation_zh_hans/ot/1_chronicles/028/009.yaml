  to: “至于你，我儿所罗门，你要认识你父亲的上帝，以完全的心、乐意的心灵事奉他；因为耶和华鉴察所有人的心，洞悉一切心思意念。你若寻求他，他必让你寻见他[a]；你若离弃他，他必永远弃绝你[b]。”
  rationale: 修订仅处理现代普通话的自然度、指代清晰度和词组搭配。“乐意的心灵”避免将“性命”误读为舍命，同时保留原文“心”与נֶפֶשׁ的并列；“一切心思意念”自然表达思想中形成的意向。条件句、神名及严厉警告均保持原意，脚注标记仍紧邻对应的正文短语。
