base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/017.yaml
  text: and the forks, the basins, and the pitchers of pure gold; and for the golden bowls, by weight for each bowl and bowl; and for the silver bowls, by weight for each bowl and bowl.
translation:
  language: zh_hans
  text: 以及纯金的叉子、盆和壶[a]；金碗按每个碗配定重量，银碗也按每个碗配定重量[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“注液壶”。希伯来语所指器皿可能用于倾倒液体。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“给一个碗和一个碗”，以重复表达每个器皿逐一配定重量。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּזְלָגוֹת
  choice: 叉子
  rationale: 指圣殿礼仪中叉状的器具；“叉子”是现代汉语中清楚、具体的表达，也避免使用生僻古称。
- source_word: מִּזְרָקוֹת
  choice: 盆
  rationale: 该词常指献祭礼仪所用的盆；译作“盆”可与后文的 כְפוֹרֵי（碗）区分。
- source_word: קְּשָׂוֹת
  choice: 壶
  rationale: 该器皿可能用于盛装或倾倒液体；“壶”在现代汉语中自然，并保留器物具体而用途未完全确定的特点。
- source_word: זָהָב טָהוֹר
  choice: 纯金的
  rationale: 该短语修饰前列器具，说明其材质；“纯金的”准确而自然。
- source_word: כְפוֹרֵי
  choice: 碗
  rationale: 在器具清单中指碗状容器；译作“碗”既自然，也与前面的“盆”保持词项区别。
- source_word: בְּמִשְׁקָל
  choice: 有规定的重量
  rationale: 上下文涉及为各器具指定贵金属的重量；此译法比生硬的“按重量”更清楚地表达逐件配定重量的意思。
- source_word: לִכְפוֹר וּכְפוֹר
  choice: 各
  rationale: 希伯来文以“一个碗和一个碗”的重复结构表达逐一分配；现代汉语用“各”自然传达其分配意义，并以脚注说明原文形式。
- source_word: כֶּסֶף
  choice: 银
  rationale: 该词在此指银这种金属，与前文的金相对。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的器具清单语体。以分号区分三组器具；将希伯来语的逐项重复自然译为“各”，同时用脚注保留原文的分配式表达。
