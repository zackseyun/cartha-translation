  to: 以及他心中所存的一切样式[a]，就是耶和华殿的院落、四围所有的房间、神殿的库房和圣物的库房。
  rationale: 修订以“他心中所存的”自然呈现原文可作人内在心灵／心意理解的措辞，并借脚注保留上下文所支持的神的灵之理解，避免在正文中预先裁定歧义。“样式”较贴近 תַבְנִית 在圣殿建筑语境中的图样、规划含义；“院落”更适合指圣殿的庭院区域。
