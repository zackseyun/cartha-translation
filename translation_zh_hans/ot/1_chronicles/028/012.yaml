  text: וְ/תַבְנִ֗ית כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה בָ/ר֨וּחַ֙ עִמּ֔/וֹ לְ/חַצְר֧וֹת בֵּית יְהוָ֛ה וּ/לְ/כָל הַ/לְּשָׁכ֖וֹת סָבִ֑יב לְ/אֹֽצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹצְר֖וֹת הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/012.yaml
  text: 'and the plan of all that was in the Spirit with him: for the courts of the house of Yahweh[a], for all the surrounding chambers, for the treasuries of the house of God, and for the treasuries of the holy things.'
translation:
  language: zh_hans
  text: 以及他心中所存的一切样式[a]，就是耶和华殿的院落、四围所有的房间、神殿的库房和圣物的库房。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他借着（神的）灵所领受的一切样式。”希伯来语也可指大卫自己心中所存的构想。
    reason: 希伯来语“在灵里与他同在”的所指存在歧义；脚注保留可能指神的灵的理解，而正文不排除指大卫内心的理解。
lexical_decisions:
- source_word: תַבְנִית
  choice: 设计
  rationale: 在圣殿建筑语境中指整体的式样或规划；“设计”既涵盖图样，也自然引出后列各处设施。
- source_word: כֹּל אֲשֶׁר
  choice: 一切
  rationale: 表达设计内容的完整范围，简洁而符合现代汉语。
- source_word: הָיָה בָרוּחַ עִמּוֹ
  choice: 他借着灵所得的
  rationale: 结合本章19节，较可能指大卫从神的灵所得的圣殿设计；措辞仍保留“灵”，并用脚注说明也可理解为大卫自己心中所有的。
- source_word: לְחַצְרוֹת
  choice: 院子
  rationale: 指圣殿建筑群的院落；“院子”准确且易懂。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: 保留神名“耶和华”，并按汉语习惯将“耶和华的殿”凝练为“耶和华殿”。
- source_word: לְּשָׁכוֹת סָבִיב
  choice: 四围所有的房间
  rationale: לְשָׁכוֹת 指附属房室，סָבִיב 表示环绕四周；此译清楚自然。
- source_word: אֹצְרוֹת
  choice: 库房
  rationale: 指储存财物或圣物的房室；“库房”比“宝库”更能涵盖实际储藏功能。
- source_word: בֵּית הָאֱלֹהִים
  choice: 神殿
  rationale: 对应“神的殿”，并与前文“耶和华殿”形成自然的同义指称。
- source_word: הַקֳּדָשִׁים
  choice: 圣物
  rationale: 这里指分别为圣、存放在库房中的物件；“圣物”直接而不额外限定其种类。
theological_decisions:
- issue: בָרוּחַ עִמּוֹ 所指的是神的灵还是大卫自己的心灵
  choice: 正文译作“他借着灵所得的”，倾向指神的灵
  alternative: “他心中所有的”，即大卫自己心里的构想
  rationale: 本章19节说明耶和华使大卫明白整个设计，支持神圣启示的理解；但希伯来语短语本身也可指大卫自己的内心，因此以脚注保留另一种读法。
translation_notes:
  register: 采用现代、庄重而易懂的建筑用语；用“就是”自然引出设计所涵盖的各部分，并将歧义脚注标在相关短语之后。
