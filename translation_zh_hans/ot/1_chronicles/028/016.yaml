  text: and the weight of the gold for the tables of the arrangement[a], for each table and table, and silver for the silver tables.
translation:
  language: zh_hans
  text: 又规定陈设饼的桌子所用金子的重量；每张桌子所用的金子各有定量；又规定银桌子所用银子的重量。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陈设饼的桌子”直译为“排列（或陈列）之物的桌子”；这里通常指摆放按次序陈列之饼的桌子。传统译作“陈设饼的桌子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: 重量
  rationale: 这里指为制作圣殿器物所规定的贵金属重量；结合后面的分配表达，在中文中译为“所用金子的重量”自然且准确。
- source_word: שֻׁלְחֲנוֹת הַמַּעֲרֶכֶת
  choice: 陈设饼桌子
  rationale: מַעֲרֶכֶת 字面指按次序摆列之物，此处语境所指很可能是陈设在耶和华面前的饼。正文采用现代中文较易理解的“陈设饼桌子”，脚注保留较字面的另一译法。
- source_word: לְשֻׁלְחָן וְשֻׁלְחָן
  choice: 每张桌子各有定量
  rationale: 希伯来语重复“桌子和桌子”，表达逐一分配。中文用“每张桌子各有定量”传达其分配义，同时避免生硬照搬重复结构。
- source_word: כֶּסֶף
  choice: 银子
  rationale: 此处是与金子相对的材料名称；“银子”在现代中文圣经语体中清楚自然。
- source_word: שֻׁלְחֲנוֹת הַכָּסֶף
  choice: 银桌子
  rationale: 该结构最自然地指以银制成或归为银器的一类桌子；“银桌子”简洁，并保留原文没有进一步说明制作方式的特点。
