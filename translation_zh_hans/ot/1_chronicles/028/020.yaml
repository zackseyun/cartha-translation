source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לִ/שְׁלֹמֹ֣ה בְנ֗/וֹ חֲזַ֤ק וֶ/אֱמַץ֙ וַ/עֲשֵׂ֔ה אַל תִּירָ֖א וְ/אַל תֵּחָ֑ת כִּי֩ יְהוָ֨ה אֱלֹהִ֤ים אֱלֹהַ/י֙ עִמָּ֔/ךְ לֹ֤א יַרְפְּ/ךָ֙ וְ/לֹ֣א יַֽעַזְבֶ֔/ךָּ עַד לִ/כְל֕וֹת כָּל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/020.yaml
  text: And David said to Solomon his son[a], “Be strong and courageous, and do it. Do not fear or be dismayed, for Yahweh God, my God, is with you. He will not fail you or forsake you until all the work for the service of the house of Yahweh is finished.”
translation:
  language: zh_hans
  text: 大卫对他儿子所罗门说：“你要刚强勇敢，去做吧！不要害怕，也不要惊慌，因为耶和华神——我的神——与你同在。他必不放松对你的扶持[a]，也不离弃你，直到耶和华殿中一切服事的工作都完成。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必不松开你。”这里的希伯来语动词可表示不松手、不放松，或不中止扶持。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמַץ
  choice: 你要刚强勇敢
  rationale: 这两个命令式动词构成常见的劝勉组合；“刚强勇敢”在现代汉语中自然、庄重，也保留了力量与坚定胆量两方面的含义。
- source_word: וַעֲשֵׂה
  choice: 着手去做
  rationale: 单独的“做”在汉语中显得突兀；结合上下文所指的圣殿工程，“着手去做”保留直接命令的行动意味，却不额外补入具体宾语。
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: 不要害怕，也不要惊慌
  rationale: 分别表达恐惧与因威胁而丧失镇定或勇气；此译简明自然，并保留两个并列禁令。
- source_word: יְהוָה אֱלֹהִים אֱלֹהַי
  choice: 耶和华神——我的神——
  rationale: 保留神名以及“神，我的神”的同位强调；破折号清楚呈现大卫所强调的个人关系，同时不把重复抹平。
- source_word: עִמָּךְ
  choice: 与你同在
  rationale: 希伯来文为无明示动词的名词句；汉语无需补出将来时，“与你同在”忠实表达当前并持续有效的保证。
- source_word: לֹא יַרְפְּךָ
  choice: 必不松手不管你
  rationale: 使役形动词在此可表达不放松支持、不撒手的意思。“松手不管”既保留具体意象，也以自然汉语说明不会停止扶持。
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: 也不离弃你
  rationale: “离弃”准确保留 עזב 在郑重保证中的弃置、抛下之意，并与前句构成有区别的平行表达。
- source_word: עַד לִכְלוֹת
  choice: 直到……都完成
  rationale: 忠实标出工作完成这一时间终点；这里说明保证持续到任务完成，并不必然断言此后神便不再同在。
- source_word: כָּל מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: 耶和华殿中一切服事的工作
  rationale: 将密集的属格结构译为自然汉语，同时保留“工作”和“服事”两层含义；“耶和华殿”明确是圣殿称谓。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉、且明确作为专名使用的“耶和华”，不以“主”这一称号替代原文神名；“雅威”是另一种较接近学术重构发音的音译。
- issue: “直到……完成”是否暗示神的同在随后终止
  choice: 保留原文的时间终点表达，不作延伸解释
  alternative: 改写为“必一直与你同在”
  rationale: עַד 明确把保证与任务完成相连，但原句并未说明完成以后神会怎样；直译保留这种范围与张力，避免加入系统神学推论。
- issue: רפה 与 עזב 的关系
  choice: 分别译为“不松手不管”和“不离弃”
  alternative: 合并为“绝不撇下你，也不离弃你”
  rationale: 区分停止扶持与弃置离开两个近义但不完全相同的概念，保留希伯来文平行句中的语义层次。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。命令句保持有力；神名按中文传统音译为“耶和华”。脚注用于保留 רפה 的具体意象和词义幅度。
