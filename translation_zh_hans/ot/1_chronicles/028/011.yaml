base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/011.yaml
  text: Then David gave to Solomon his son the plan of the portico[a], its houses, its treasuries, its upper rooms, its inner chambers, and the house of the mercy seat.
translation:
  language: zh_hans
  text: 大卫把门廊、各建筑、库房、上层房间、内室和施恩座所在的殿室[a]的设计交给他儿子所罗门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施恩座”也可译作“遮罪盖”，指约柜的盖。原文直译为“施恩座之殿室”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: 设计图
  rationale: 本词可指样式、模型或设计；在交付建殿资料的语境中，“设计图”自然明确，也保留具体规划的含义。
- source_word: הָאוּלָם
  choice: 圣殿门廊
  rationale: אוּלָם指宏伟建筑入口处的廊厅；补出“圣殿”可明确后续第三人称所属对象，中文读来更清楚。
- source_word: בָּתָּיו
  choice: 殿内各房
  rationale: בַּיִת复数直译可作“各房屋”，但在圣殿建筑语境中指殿宇中的房间或建筑单元；“殿内各房”既自然，也避免误解为住宅。
- source_word: גַנְזַכָּיו
  choice: 库房
  rationale: 指存放财物或奉献物的地方；“库房”在中文圣殿语境中简明自然，且不限定其中只存财宝。
- source_word: עֲלִיֹּתָיו
  choice: 楼房
  rationale: 指位于上层的房间；“楼房”是庄重而通行的圣经建筑用语，也清楚表达其上层位置。
- source_word: חֲדָרָיו הַפְּנִימִים
  choice: 内室
  rationale: חֶדֶר为房间，הַפְּנִימִים限定为内部的；“内室”准确简洁，不擅自加强为“最里面的房间”。
- source_word: בֵית הַכַּפֹּרֶת
  choice: 安放施恩座的至圣所
  rationale: 字面为“施恩座之室/殿”，实际指容纳约柜及其כַּפֹּרֶת的内殿。中文以“安放施恩座的至圣所”说明建筑所指，同时避免生硬的“施恩座之殿”。
- source_word: וַיִּתֵּן
  choice: 大卫……交给
  rationale: 叙事形式推进事件；现代中文以“交给”最自然地表达把设计资料交付所罗门。
theological_decisions:
- issue: כַּפֹּרֶת的圣所术语译法
  choice: 施恩座
  alternative: 遮罪盖
  rationale: כַּפֹּרֶת指至圣所中约柜的盖，与赎罪礼仪密切相关。“施恩座”是中文读者较熟悉的传统圣所术语；“遮罪盖”更直接表达其器物形态和礼仪关联，因此列于脚注，保留词义张力。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面中文。将希伯来文连续的所属结构整合为自然的中文列举；用“至圣所”明确בֵית הַכַּפֹּרֶת在圣殿布局中的实际所指，并用脚注保留其字面结构及כַּפֹּרֶת的另一译法。
