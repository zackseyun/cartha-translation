revisions:
- from: 大卫把圣殿门廊、殿内各房、库房、楼房、内室，以及安放施恩座的至圣所[a]的设计图交给他儿子所罗门。
  to: 大卫把门廊、各建筑、库房、上层房间、内室和施恩座所在的殿室[a]的设计交给他儿子所罗门。
  rationale: 修订以“设计”对应建筑规划的概念，并保留原文各项建筑构成。将“楼房”改为“上层房间”，消除现代汉语中指整座楼宇的歧义。末项译为“施恩座所在的殿室”，配合脚注说明字面结构及“遮罪盖”的替代译法，从而不把虽有语境根据但未由原文直接明说的“至圣所”写入正文。
