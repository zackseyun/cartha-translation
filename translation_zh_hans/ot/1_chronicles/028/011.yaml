  source_fidelity: 译文准确传达大卫将建筑规划交给所罗门的核心意思，也正确保留了库房、内室和施恩座等要素。但“安放施恩座的至圣所”把原文“施恩座之室（殿）”直接确定为“至圣所”，且加入“安放”的解释；这在语境中很可能，但原文措辞本身并未明说。“楼房”在现代汉语中通常指整座楼宇，不能准确表达上层的房间。
  naturalness: 原句总体通顺，倒装处理也自然。改为“上层房间”更符合现代汉语的具体所指；以“施恩座所在的殿室”表达末项，既自然又避免不必要地将其术语化为“至圣所”。
  terminology: “施恩座”可保留为通行的圣所术语，并以“遮罪盖”作脚注替代译法。“门廊”“库房”“内室”合宜。“各建筑”比“殿内各房”更能保留בָּתָּיו所指建筑单元／房舍的范围，而不预设其全都在主殿内部。
