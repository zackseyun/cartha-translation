  text: וּ/מִ/כָּ֨ל בָּנַ֔/י כִּ֚י רַבִּ֣ים בָּנִ֔ים נָ֥תַן לִ֖/י יְהוָ֑ה וַ/יִּבְחַר֙ בִּ/שְׁלֹמֹ֣ה בְנִ֔/י לָ/שֶׁ֗בֶת עַל כִּסֵּ֛א מַלְכ֥וּת יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/005.yaml
  text: And from among all my sons—for Yahweh has given me many sons—he chose Solomon my son to sit on the throne of the kingdom of Yahweh over Israel[a][b].
translation:
  language: zh_hans
  text: 在我所有的儿子中——因为耶和华赐给我许多儿子——他拣选我儿子所罗门坐在耶和华国度的宝座上，治理以色列。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赐给我”也可译作“曾赐给我”；希伯来文在这里陈述耶和华赐下许多儿子这一事实，未明确标示汉语所需的时体差别。
    reason: lexical_alternative
  - marker: b
    text: “耶和华国度的宝座”强调以色列的王权最终属于耶和华；所罗门虽是地上的君王，却是在耶和华的国度中执掌王权。
    reason: cross_reference
lexical_decisions:
- source_word: וּמִכָּל בָּנַי
  choice: 在我所有的儿子中
  rationale: מן与כּל合用，表达从一个群体中作出选择；“在……中”符合现代汉语习惯，并保留“儿子”的阳性复数含义和王位继承语境。
- source_word: כִּי רַבִּים בָּנִים נָתַן לִי יְהוָה
  choice: 因为耶和华赐给我许多儿子
  rationale: כִּי在此引出解释性的插入语；“因为”自然传达其说明作用。“赐给”体现儿子被视为上帝所赐，却不增添原文没有的内容。
- source_word: וַיִּבְחַר
  choice: 他拣选了
  rationale: 主语承接前句的耶和华。“拣选”准确表达בחר在选定君王语境中的含义。
- source_word: בִּשְׁלֹמֹה בְנִי
  choice: 我儿子所罗门
  rationale: בחר后的ב标示被选者，汉语无需另译介词；此语序自然并保留亲属关系。
- source_word: לָשֶׁבֶת עַל כִּסֵּא
  choice: 让他坐在……宝座上
  rationale: ישב与“宝座”连用，指登基并执掌王权；正文保留“坐在宝座上”的具体意象。
- source_word: מַלְכוּת יְהוָה
  choice: 耶和华国度的
  rationale: 保留完整的属格结构，不将其弱化为以色列的国或一般王位，凸显国度最终属于耶和华。
- source_word: עַל יִשְׂרָאֵל
  choice: 治理以色列
  rationale: עַל在王权语境中表示对以色列的统治。汉语若直译为“在以色列之上”生硬，“治理以色列”清楚传达其功能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉且庄重的专名“耶和华”，明确保留盟约神名，不以泛称“主”替代。
- issue: “耶和华国度的宝座”的归属含义
  choice: 保留完整表述“耶和华国度的宝座”
  alternative: 以色列国的宝座
  rationale: 原文明确把国度归于耶和华；不将其改写为以色列的国度，从而保留以色列君权从属于耶和华王权的神学张力。
- issue: לָשֶׁבֶת的王权含义
  choice: 正文译作“坐在……宝座上”，并以“治理以色列”显明语境
  alternative: 登上……宝座作王
  rationale: 保留原文“坐”的意象，同时避免只按字面理解为静坐；后句自然表明这是施行统治。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。解释性分句用破折号保留原文插入语结构；“拣选”“宝座”“国度”延续中文圣经中清晰且通行的王权用语。
