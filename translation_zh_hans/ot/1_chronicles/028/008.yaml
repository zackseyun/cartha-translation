source:
  edition: WLC
  text: וְ֠/עַתָּה לְ/עֵינֵ֨י כָל יִשְׂרָאֵ֤ל קְהַל יְהוָה֙ וּ/בְ/אָזְנֵ֣י אֱלֹהֵ֔י/נוּ שִׁמְר֣וּ וְ/דִרְשׁ֔וּ כָּל מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם לְמַ֤עַן תִּֽירְשׁוּ֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה וְ/הִנְחַלְתֶּ֛ם לִ/בְנֵי/כֶ֥ם אַחֲרֵי/כֶ֖ם עַד עוֹלָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/008.yaml
  text: And now[a], in the sight of all Israel, the assembly of Yahweh, and in the hearing of our God, keep and seek all the commandments of Yahweh your God[b], so that you may possess the good land and leave it as an inheritance to your sons after you forever.
translation:
  language: zh_hans
  text: 现在，在以色列全体——耶和华的会众——眼前，也在我们神垂听之下，你们要谨守并寻求耶和华你们神的一切诫命，好使你们承受[a]这美地，并把它留给你们的儿子[b]，使他们在你们之后永远承受为业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承受”也可译作“占有”。希伯来语动词可按语境表示继承或取得并持有。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“儿子”，是阳性复数，并非更宽泛的“儿女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接前文并转入直接劝告；现代汉语用“现在”即可自然表达这一话语转折。
- source_word: לְעֵינֵי כָל־יִשְׂרָאֵל
  choice: 在以色列全体……眼前
  rationale: 保留“在眼前”的公开见证意象，同时用“全体”自然表达集合意义。
- source_word: קְהַל יְהוָה
  choice: 耶和华的会众
  rationale: קהל指聚集起来的群体；“会众”在中文圣经语境中清楚而庄重。
- source_word: וּבְאָזְנֵי אֱלֹהֵינוּ
  choice: 也在我们的神听来
  rationale: 尽量保留原文与“眼前”平行的听觉意象，又避免生硬直译为“在耳中”；表达这些话也在神的听闻之下。
- source_word: שִׁמְרוּ
  choice: 谨守
  rationale: 用于诫命时，“谨守”自然表达认真遵行和持守的含义。
- source_word: וְדִרְשׁוּ
  choice: 并寻求
  rationale: 保留דרש主动追求、专心求取的意涵，不将其缩减为纯粹的智识研究。
- source_word: כָּל־מִצְוֺת
  choice: 一切诫命
  rationale: 直接表达复数名词与כָּל的整体范围。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，不以称号取代。
- source_word: לְמַעַן
  choice: 好使
  rationale: 清楚表达目的或预期结果。
- source_word: תִּירְשׁוּ
  choice: 承受
  rationale: ירשׁ在此可指继承或占有土地；“承受”适合应许之地的语境，并保留两者之间的语义张力。
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: 这美地
  rationale: “美地”简洁、庄重，保留土地蒙福、宜人的评价；指示词“这”符合上下文所指的土地。
- source_word: וְהִנְחַלְתֶּם
  choice: 并把它留给……使他们……承受为业
  rationale: 该使役形式表示使后代承受产业；此译法在中文中自然呈现使役及产业传承。
- source_word: לִבְנֵיכֶם
  choice: 给你们的儿子
  rationale: 保留原文阳性复数“儿子”，不擅自泛化为“儿女”或“后代”。
- source_word: עַד־עוֹלָם
  choice: 永远
  rationale: 直接保留持续无尽或永久性的表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为普通读者识别的专名“耶和华”，而非以“主”替代，仍保留其作为立约之神专名的功能。
- issue: “谨守并寻求”两项命令之间的关系
  choice: 保留两个并列动词
  alternative: 合并为“竭力遵守”
  rationale: 原文分别使用שמר与דרש；保留二者可呈现既持守遵行、又主动寻求的张力，避免把“寻求”完全吸收到“遵守”之中。
- issue: 土地动词ירשׁ的语义
  choice: 承受
  alternative: 占有
  rationale: 该词兼有继承、取得并持有之意。“承受”不把经文限定为首次征服，也保留土地作为所赐产业的神学语境。
- issue: בנים的性别表达
  choice: 儿子
  alternative: 儿女
  rationale: 原文明确使用阳性复数。正文保留这一形式，并用脚注说明其字面意义，避免在没有文本依据时泛化。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。以破折号标明“耶和华的会众”是对“以色列全体”的同位说明；保留“眼前／听来”的感官平行和“谨守／寻求”的双重命令。所有脚注标记均置于其实际所说明的词语之后。
