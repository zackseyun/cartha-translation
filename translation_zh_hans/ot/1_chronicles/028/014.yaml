  text: the weight of the gold for all the articles of every kind of service[a], and the weight of the silver for all the articles of every kind of service.
translation:
  language: zh_hans
  text: 又按重量交付金子，作为各类事奉所用一切金器的材料；也按重量交付各类事奉所用的一切银器[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“事奉和事奉”，这是表示逐项分配的说法，意思类似“各类事奉”或“各种用途”。
    reason: 说明希伯来语重复结构及其分配性含义。
lexical_decisions:
- source_word: זָהָב
  choice: 金子
  rationale: 指用于制造圣殿器具的材料；“金子”在现代汉语中自然清楚，并与下文“银子”平行。
- source_word: בַּמִּשְׁקָל
  choice: 按重量分配
  rationale: 介词 בְּ 加 מִשְׁקָל 表示按所定重量计量。经文处于大卫交付圣殿建造安排的清单语境中，“分配”自然表达省略的动作，但不改变材料按重量指定的意思。
- source_word: כְּלֵי
  choice: 器具
  rationale: כְּלִי 泛指供事奉使用的各种物件；“器具”比“器皿”范围更广，也不局限于工具。
- source_word: עֲבוֹדָה
  choice: 事奉
  rationale: 此处为圣殿礼仪语境，表示在圣所中的服事或用途；“事奉”兼顾宗教语境和现代可读性。
- source_word: עֲבוֹדָה וַעֲבוֹדָה
  choice: 各类事奉
  rationale: 希伯来语重复形成分配性表达，指不同类别或用途的事奉；中文用“各类”保留其分配含义，避免生硬直译为“事奉和事奉”。
- source_word: כֶּסֶף
  choice: 银子
  rationale: 与金子平行，指按重量指定、用于器具的银质材料。
- source_word: לְכָל / לְכֹל
  choice: 一切
  rationale: 保留 כֹּל 所表达的整体范围；与“各类事奉”搭配，可清楚呈现器具与不同用途之间的分配关系。
