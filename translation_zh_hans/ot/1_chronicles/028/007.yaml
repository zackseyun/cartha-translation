  text: וַ/הֲכִינוֹתִ֥י אֶת מַלְכוּת֖/וֹ עַד לְ/עוֹלָ֑ם אִם יֶחֱזַ֗ק לַ/עֲשׂ֛וֹת מִצְוֺתַ֥/י וּ/מִשְׁפָּטַ֖/י כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/007.yaml
  text: And I will establish his kingdom forever[a], if he is strong to do my commandments and my judgments[c][b], as at this day.
translation:
  language: zh_hans
  text: 我必使他的国永远坚立[a]；如果他坚定地遵行我的诫命和典章[b]，像今日一样[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坚立”也可译作“确立”或“使稳固”。
    reason: lexical_alternative
  - marker: b
    text: “坚定地遵行”也可译作“刚强地实行”或“坚决遵行”。
    reason: lexical_alternative
  - marker: c
    text: “像今日一样”，即像他现在所做的那样。
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲכִינוֹתִי
  choice: 我必使……坚立
  rationale: 使役形表达“使之稳固、确立”；“使……坚立”既贴近词义，也适合王国的语境。
- source_word: מַלְכוּתוֹ
  choice: 他的国
  rationale: מַלְכוּת可指王权、统治或国度；此处论及王朝长久稳固，“他的国”自然且保留较宽的语义。
- source_word: עַד לְעוֹלָם
  choice: 永远
  rationale: 准确表达持续无尽的时间意义，语言简明庄重。
- source_word: אִם
  choice: 如果
  rationale: 明确保留原文所引出的条件关系，不将其弱化。
- source_word: יֶחֱזַק
  choice: 坚定地
  rationale: חזק在此强调刚强、持守和坚决；与“遵行”连用时，“坚定地”是自然的现代汉语表达。
- source_word: לַעֲשׂוֹת
  choice: 遵行
  rationale: 字面为“去做”；在诫命与典章的语境中，“遵行”符合现代汉语习惯，同时保留实际实行之意。
- source_word: מִצְוֺתַי
  choice: 我的诫命
  rationale: 保留盟约和律法语境中的正式色彩。
- source_word: וּמִשְׁפָּטַי
  choice: 和典章
  rationale: מִשְׁפָּטִים在律法语境中可指判例、法令或规章；“典章”庄重自然，并与“诫命”形成常见搭配。
- source_word: כַּיּוֹם הַזֶּה
  choice: 像今日一样
  rationale: 贴近希伯来语习语，指他当前所表现出的遵行状态；正文保留其简洁和一定的指涉开放性。
theological_decisions:
- issue: 关于所罗门国度应许的条件性
  choice: 用“如果”明确表达国度永远坚立与持续遵行之间的条件关系。
  alternative: 把后半句译成对所罗门品格的一般描述，从而弱化条件性。
  rationale: אִם清楚引入条件。译文应保留这一神学张力，而不以其他经文中的无条件应许来消解它。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使他的国永远坚立”保留王国与王朝语境；分号和条件句清楚呈现句法关系。脚注标记按其所解释的词句就近安放。
