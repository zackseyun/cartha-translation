  text: רְאֵ֣ה עַתָּ֗ה כִּֽי יְהוָ֛ה בָּ֧חַר בְּ/ךָ֛ לִ/בְנֽוֹת בַּ֥יִת לַ/מִּקְדָּ֖שׁ חֲזַ֥ק וַ/עֲשֵֽׂה׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/010.yaml
  text: See now[a], for Yahweh has chosen you to build a house for the sanctuary. Be strong[b], and do it.
translation:
  language: zh_hans
  text: 你现在要留心[a]，因为雅威已经拣选你建造一座殿宇，作圣所[b]。你要刚强，去做！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留心”或译“看”“要思想”。这里不只是叫人用眼观看，而是叫人认真注意并思量。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“一座房屋，供作圣所”；也可理解为“为圣所建造一座殿宇”。这里指将要建造的圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה עַתָּה
  choice: 现在你要留心
  rationale: רְאֵה在这里是引起注意、促人审慎思想的命令，并非单指肉眼观看；与עַתָּה合译为“现在你要留心”，既自然又保留劝诫的即时性。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出劝诫的理由；现代汉语用“因为”清楚表达其理据关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名音译，保留其作为以色列之上帝专名的性质，而不以头衔替代。
- source_word: בָּחַר בְּךָ
  choice: 已经拣选你
  rationale: 完成式表示拣选已经作出，并对当前使命持续有效；“拣选”也保留为特定任务而选立的含义。
- source_word: לִבְנוֹת בַּיִת לַמִּקְדָּשׁ
  choice: 建造一座殿宇，作为圣所
  rationale: בַּיִת本义为“房屋”，在此指献给上帝的殿宇；לַמִּקְדָּשׁ可表达用途或身份。此译避免简单压缩为“建圣殿”，并以脚注保留结构上的解释空间。
- source_word: חֲזַק
  choice: 你要刚强
  rationale: 命令式劝勉所罗门坚毅、有力量地承担使命；“刚强”庄重且符合现代汉语圣经语域。
- source_word: וַעֲשֵׂה
  choice: 动手去做
  rationale: עָשָׂה是宽泛的行动动词，语境所指是落实建造使命；“动手去做”在汉语中有明确付诸行动的号召力，而不把宾语过度具体化。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”较能保留其专名性质，避免用称号取代；同时不把较晚形成的混合读音作为正文。
- issue: “房屋”与“圣所”的关系
  choice: 一座殿宇，作为圣所
  alternative: 为圣所建造一座殿宇；建造圣殿
  rationale: 原文保留בַּיִת与מִקְדָּשׁ两个名词。介词ל可表示用途或身份，因此正文采用自然的“作为圣所”，脚注说明较贴近字面的另一理解，不将两者无提示地合并成单一术语。
- issue: 使命的执行语气
  choice: 动手去做
  alternative: 去行；建造吧
  rationale: 原文וַעֲשֵׂה本身是泛指“做、行”，具体对象由上下文补足。译文传达执行建殿使命的要求，但不把原文动词改写成更窄的“建造”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“留心”传达开头命令的劝诫意味；以“殿宇”兼顾בַּיִת的“房屋”意象及圣殿语境；末句用短促有力的命令句再现委任与催促的语气。所有脚注标记均已置入正文。
