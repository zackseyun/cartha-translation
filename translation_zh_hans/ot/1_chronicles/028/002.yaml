source:
  edition: WLC
  text: וַ/יָּ֨קָם דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ עַל רַגְלָ֔י/ו וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי אַחַ֣/י וְ/עַמִּ֑/י אֲנִ֣י עִם לְבָבִ֡/י לִ/בְנוֹת֩ בֵּ֨ית מְנוּחָ֜ה לַ/אֲר֣וֹן בְּרִית יְהוָ֗ה וְ/לַ/הֲדֹם֙ רַגְלֵ֣י אֱלֹהֵ֔י/נוּ וַ/הֲכִינ֖וֹתִי לִ/בְנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/002.yaml
  text: Then King David rose to his feet and said[a], “Hear me, my brothers and my people. It was in my heart to build a house of rest for the ark of the covenant of Yahweh, and for the footstool of our God[c][b], and I made preparations to build it.”
translation:
  language: zh_hans
  text: 大卫王站起身来，说：“我的弟兄、我的百姓，请听我说！我心里想要为耶和华的约柜、为我们上帝的脚凳[a]建造一座安息之所；我也为建造它预备好了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “脚凳”是形象说法。这句话通常理解为把约柜与我们上帝的脚凳相联系；参诗篇132:7。
    reason: 说明隐喻及约柜与“脚凳”之间常见的关联性理解，同时不把原文形式上并列的两个短语限定为唯一的句法关系。
lexical_decisions:
- source_word: וַיָּקָם דָּוִיד הַמֶּלֶךְ עַל רַגְלָיו
  choice: 大卫王站起身来
  rationale: קום与“在双脚上”的表达合用，指起身站立；译为现代汉语自然的“站起身来”。
- source_word: שְׁמָעוּנִי
  choice: 请听我说
  rationale: 这是שמע的复数命令式，带第一人称单数宾语后缀；“请听我说”适合庄重的公开讲话。
- source_word: אַחַי וְעַמִּי
  choice: 我的弟兄、我的百姓
  rationale: 保留“弟兄”的阳性复数亲属称谓，也保留其与“我的百姓”并列的结构。
- source_word: אֲנִי עִם לְבָבִי
  choice: 我心里本想
  rationale: 这是表达内心意愿或打算的希伯来语习语；“本想”也自然衔接下文中这一计划未能由大卫完成的语境。
- source_word: בֵּית מְנוּחָה
  choice: 一座安息之所
  rationale: 保留מְנוּחָה“安息、安歇”的意象，同时比直译“安息之家”更符合现代汉语。
- source_word: לַאֲרוֹן בְּרִית יְהוָה
  choice: 安放耶和华的约柜
  rationale: 介词ל表示这建筑是为约柜而设；“安放”在汉语中清楚表达其用途。“耶和华”直接呈现神名。
- source_word: וְלַהֲדֹם רַגְלֵי אֱלֹהֵינוּ
  choice: 就是我们上帝的脚凳
  rationale: 将וְ理解为解释性连接，指出约柜被描绘为上帝的脚凳；“就是”使汉语中的同位关系清楚，又不消解该隐喻。
- source_word: וַהֲכִינוֹתִי לִבְנוֹת
  choice: 我也已经为建造这殿做好了准备
  rationale: הכין的使役形式表达预备；末尾“建造”在原文没有明说宾语，汉语按上文补出“这殿”，明确所指而不增加新的对象。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；采用现代中文圣经读者最熟悉的专名“耶和华”，不以“主”替代。
- issue: 约柜与“我们上帝的脚凳”的关系
  choice: 以“就是”表达同位或解释关系
  alternative: 译作并列的“以及我们上帝的脚凳”
  rationale: 句法可形式上保留并列，但上下文最自然地把约柜描写为与上帝临在相关的脚凳。正文采用解释性连接，同时脚注说明这是比喻性描述，避免理解成上帝受限于物质器物。
- issue: אַחַי的性别与范围
  choice: 我的弟兄
  alternative: 我的同胞
  rationale: 原文为阳性复数“我的弟兄”，在公共讲话中也可泛指同族或同胞；正文保留具体亲属称谓，不擅自改成性别中性的表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“安息之所”保留敬拜语境中的诗性意象；“上帝”用于אֱלֹהִים，“耶和华”用于神名יהוה。正文只设一个脚注，标记[a]已置于相应词组之后。
