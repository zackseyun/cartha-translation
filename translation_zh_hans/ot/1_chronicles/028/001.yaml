source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל דָּוִ֣יד אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֡ל שָׂרֵ֣י הַ/שְּׁבָטִ֣ים וְ/שָׂרֵ֣י הַ/מַּחְלְק֣וֹת הַ/מְשָׁרְתִ֪ים אֶת הַ/מֶּ֟לֶךְ וְ/שָׂרֵ֣י הָ/אֲלָפִ֣ים וְ/שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/שָׂרֵ֣י כָל רְכוּשׁ וּ/מִקְנֶה֩ לַ/מֶּ֨לֶךְ וּ/לְ/בָנָ֜י/ו עִם הַ/סָּרִיסִ֧ים וְ/הַ/גִּבּוֹרִ֛ים וּֽ/לְ/כָל גִּבּ֥וֹר חָ֖יִל אֶל יְרוּשָׁלִָֽם־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/001.yaml
  text: 'Then David assembled at Jerusalem all the leaders of Israel: the leaders of the tribes[a], the leaders of the divisions that served the king, the commanders of thousands and of hundreds, and the leaders over all the property and livestock belonging to the king and to his sons, together with the officials, the mighty men, and every mighty man of valor.'
translation:
  language: zh_hans
  text: 大卫把以色列所有的首领召集到耶路撒冷：各支派的首领、服侍王的各班次的首领、千夫长和百夫长、管理王和他众子一切财产和牲畜的首领，以及宫廷官员[a]、勇士和所有英勇善战的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“太监”。希伯来语这个词既可指实际被阉割的人，也可泛指王室宫廷官员。
    reason: 保留 הַסָּרִיסִים 的词义歧义，避免正文武断确定其生理身份。
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: 召集
  rationale: 该使役形动词表示使众人正式聚集；“召集”符合这次官方集会的语境。
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: 以色列所有的首领
  rationale: שַׂר 可指首领、官员或统帅；此处统摄后列的行政与军事人物，“首领”最为宽泛自然。
- source_word: שָׂרֵי הַשְּׁבָטִים
  choice: 各支派的首领
  rationale: 忠实表达其领袖身份，并与全句反复出现的 שַׂר 保持一致。
- source_word: שָׂרֵי הַמַּחְלְקוֹת הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: 服侍王的各班次首领
  rationale: מַחְלְקוֹת 指按编制轮值的班次；此译既保留组织结构，也用现代汉语清楚表达其服侍王的职能。
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  choice: 千夫长和百夫长
  rationale: 这是现代中文圣经语体中清楚而简洁的军事编制称谓，同时保留希伯来文“千”与“百”的单位表达。
- source_word: רְכוּשׁ
  choice: 产业
  rationale: 该词指财物、资产或所有物；与“牲畜”并列时，“产业”自然涵盖王室的其他财物。
- source_word: מִקְנֶה
  choice: 牲畜
  rationale: 该词泛指家畜，并不限于牛；“牲畜”准确保留其广义。
- source_word: לַמֶּלֶךְ וּלְבָנָיו
  choice: 王和他众子
  rationale: 介词 ל 在此表示归属；置于“产业及牲畜”之前，中文自然表达为属于王及其众子的财产。
- source_word: הַסָּרִיסִים
  choice: 宫廷官员
  rationale: סָרִיס 可指受阉的宫廷人员，也可泛指王室官员；在这份行政和军事人物名单中，正文采用功能性的“宫廷官员”，并以脚注保留“太监”的可能。
- source_word: הַגִּבּוֹרִים
  choice: 勇士
  rationale: 该复数词在《历代志》的相关语境中常指大卫手下著名的战士；“勇士”简洁、自然且符合语境。
- source_word: כָּל גִּבּוֹר חָיִל
  choice: 所有英勇善战的人
  rationale: 该短语兼有勇力、英勇和作战能力之意；此译用自然现代汉语传达其整体含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。长串名单以冒号和顿号分层，保留原文的行政与军事序列；避免使用较生硬的“班队”和略显古奥的“有力有能者”。
