base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/006.yaml
  text: And he said to me[a], ‘Solomon your son—he will build my house and my courts, for I have chosen him for myself as a son, and I will be to him as a father.’
translation:
  language: zh_hans
  text: 他对我说：“你儿子所罗门，他必建造我的殿和我的院子，因为我拣选了他作我的儿子[a]；我也要作他的父亲。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我拣选了他归我作儿子”；此处的表达意为“我拣选他作我的儿子”。
    reason: 说明原文双重ל构式，并交代正文采用自然汉语表达，而不改变父子关系的含义。
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: 他对我说
  rationale: 按叙事语境将连续式动词译为过去发生的动作；לִי明确表示说话的对象。
- source_word: שְׁלֹמֹה בִנְךָ הוּא
  choice: 你儿子所罗门，他
  rationale: 保留希伯来文先提出“你儿子所罗门”、再用独立代词הוּא加以强调的结构，同时符合现代汉语表达。
- source_word: יִבְנֶה בֵיתִי
  choice: 必建造我的殿
  rationale: בֵּיתִי直译为“我的房屋”，但本节明确指上帝的圣所；“我的殿”在汉语中自然清楚，也保留其作为上帝居所的含义。
- source_word: וַחֲצֵרוֹתָי
  choice: 和我的院宇
  rationale: חֲצֵרוֹת指圣殿建筑群中有围界的院落；“院宇”简洁、庄重，并适合圣殿语境。
- source_word: בָחַרְתִּי בוֹ
  choice: 我拣选了他
  rationale: 完成式表达已经作出的选择；“拣选”保留该词在立约和君王语境中的分量。
- source_word: לִי לְבֵן
  choice: 归我作儿子
  rationale: 用“归我”体现לִי，用“作儿子”体现לְבֵן，尽量保留双重ל结构，又避免生硬直译。
- source_word: וַאֲנִי אֶהְיֶה לוֹ לְאָב
  choice: 我也要作他的父亲
  rationale: 这是לוֹ לְאָב在现代汉语中的自然表达，保留父子关系和将来指向，而不把这种关系弱化为仅仅“像父亲一样”。
theological_decisions:
- issue: 上帝与所罗门之间的父子称谓
  choice: 我拣选了他，归我作儿子；我也要作他的父亲
  alternative: 我拣选他作我的儿子，我也要作他的父亲
  rationale: 正文直接保留王室之约中的父子语言，并以“归我”反映原文לִי；既不将其淡化为纯粹职能关系，也不把后来的基督论结论直接加入本节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“你儿子所罗门，他”有意保留原文独立代词所带的强调；“殿”和“院宇”明确圣殿语境。
