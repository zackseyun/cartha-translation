  source_fidelity: 译文基本保留了香坛、精炼金、按重量、战车、基路伯及遮盖约柜等要素。但“战车的样式，就是……”把原文中句法困难、关系未完全确定的短语明确等同化；“遮蔽耶和华的约柜”也没有明示介词 עַל 所表达的“在……上方”。此外，“耶和华的约柜”未清楚呈现“耶和华之约的约柜”的完整构造关系。
  naturalness: 原译整体庄重通顺，但“按重量列明”略显行政化；在本节持续列举材料重量的语境中，“按重量配备”较自然。修订以破折号保留原文的同位/说明式结构，避免过度判定其确切关系。
  terminology: “香坛”“精炼金子”“基路伯”“约柜”和“耶和华”均合乎现代中文圣经语境。保留“战车”，不将其正文解释成宝座或宝座车；脚注仅说明这一困难表达的可能理解。
