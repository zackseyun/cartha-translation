  - severity: medium
    issue: “遮蔽耶和华的约柜”未译出 עַל 的空间关系，且约的构造关系不够清楚。
    rationale: 原文明确说基路伯遮盖在约柜之上；“在……上方”应予表达。“耶和华之约的约柜”虽稍正式，却完整保留 אֲרוֹן בְּרִית יְהוָה。
  - severity: low
    issue: “列明”带有原文未明说的文书登记含义。
    rationale: בַּמִּשְׁקָל 表示按重量；在此材料分配语境中，译为“按重量配备”更直接而自然。
  revised_text: 香坛用精炼金子，按重量配备；又为战车的样式[a]——那展开翅膀、遮盖在耶和华之约的约柜上方的金基路伯——按重量配备金子。
