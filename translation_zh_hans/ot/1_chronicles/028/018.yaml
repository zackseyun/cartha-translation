base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/018.yaml
  text: and for the altar of incense[a], refined gold by weight; and for the pattern of the chariot[b], the cherubim of gold spreading out their wings and overshadowing the ark of the covenant of Yahweh.
translation:
  language: zh_hans
  text: 香坛用精炼金子，按重量配备；又为战车的样式[a]——那展开翅膀、遮盖在耶和华之约的约柜上方的金基路伯——按重量配备金子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战车的样式”也可译作“战车的图样”或“战车的模型”。这句希伯来文较难理解，可能指与约柜有关、由基路伯构成的宝座结构。
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: 香坛
  rationale: 这是圣殿器具的惯用名称，简洁自然，清楚表达“焚香用的坛”。
- source_word: זָהָב מְזֻקָּק
  choice: 精炼金子
  rationale: מְזֻקָּק强调经过熬炼、提纯，译作“精炼”保留冶金含义。
- source_word: בַּמִּשְׁקָל
  choice: 按重量列明
  rationale: 原文表示按称量所得的重量加以规定；结合本章交付圣殿设计和材料规格的语境，以“列明”补足汉语表达。
- source_word: תַבְנִית
  choice: 样式
  rationale: 该词可指形制、图样或模型；“样式”适合圣殿设计语境，同时保留一定的语义宽度。
- source_word: הַמֶּרְכָּבָה
  choice: 战车
  rationale: 该名词通常意为“战车”。此处含义虽难确定，正文保留字面表达，不径自解释为“宝座”。
- source_word: הַכְּרֻבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，保留其专门术语性质。
- source_word: זָהָב
  choice: 用金子做成的
  rationale: 这里的“金”说明基路伯的材质，展开译出可避免汉语结构含混。
- source_word: לְפֹרְשִׂים
  choice: 展开翅膀
  rationale: 动词表示展开；对象“翅膀”由基路伯与约柜的固定图像清楚暗示，补出后更符合汉语。
- source_word: וְסֹכְכִים
  choice: 遮蔽
  rationale: 该分词有遮盖、覆盖之意；“遮蔽”既保留动作，也呈现翅膀伸展在约柜上方的形象。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 耶和华的约柜
  rationale: 以自然的汉语领属结构表达“耶和华之约的柜”，并用“耶和华”呈现神名יהוה。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文直接使用四字神名；“耶和华”是现代简体中文读者最熟悉且庄重的专名形式，不以“主”替代源文中的名字。
- issue: “战车”与基路伯结构的关系
  choice: 正文保留“战车的样式”，脚注说明其可能所指
  alternative: 基路伯宝座的设计
  rationale: 原文 הַמֶּרְכָּבָה 通常指战车，但在此圣殿语境中的确切所指存在争议；不在正文中直接化解为“宝座”，以保存文本的含混和神学意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“基路伯”“约柜”等保留通行的圣经专门用语。分号维持原文两项材料规格之间的并列关系；脚注标记置于实际存在翻译难点的“战车的样式”和“遮蔽”之后。
