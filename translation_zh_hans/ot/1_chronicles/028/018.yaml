revisions:
- from: 香坛所用的精炼金子，也按重量列明；战车的样式[a]，就是用金子做成的基路伯，它们展开翅膀，遮蔽[b]耶和华的约柜。
  to: 香坛用精炼金子，按重量配备；又为战车的样式[a]——那展开翅膀、遮盖在耶和华之约的约柜上方的金基路伯——按重量配备金子。
  rationale: 修订删除了将“战车的样式”与基路伯结构完全等同的“就是”，改用破折号保留原文困难的说明性并列关系；补出“在……上方”以对应 עַל；并完整呈现“约柜—耶和华之约”的构造关系。为使脚注 b 的锚点与释义对应，标记置于“遮盖在……上方”之后。
