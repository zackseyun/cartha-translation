  text: הַ/כֹּ֥ל בִּ/כְתָ֛ב מִ/יַּ֥ד יְהוָ֖ה עָלַ֣/י הִשְׂכִּ֑יל כֹּ֖ל מַלְאֲכ֥וֹת הַ/תַּבְנִֽית׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/019.yaml
  text: All this he made clear to me in writing from the hand of Yahweh[b][a], all the works of the pattern.
translation:
  language: zh_hans
  text: 这一切——这设计的一切工作——都是耶和华借着从他手中而来的文字，使我明白的[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华的手临到我，使我明白这设计的一切工作；这一切都记在文字中。”
    reason: 原文“从耶和华的手”“在我身上”与“使明白”的连接紧凑，句法上可将“在我身上”连于“耶和华的手”，而“以文字”仍保留为书面传达的要素。
  - marker: b
    text: “设计”也可译作“式样”“蓝图”或“规划”。
    reason: 希伯来词 תַּבְנִית 可指样式、模型或建筑设计；本节不能完全限定其具体侧重。
lexical_decisions:
- source_word: הַכֹּל
  choice: 这一切
  rationale: 承接上文所述圣殿及其器具的整体规划，既保留“全部”的涵盖性，也符合现代汉语指代习惯。
- source_word: בִּכְתָב
  choice: 写下
  rationale: 表达内容以书面形式传达；在句中用动词化表达，比“以文字”更自然，同时保留书面启示之意。
- source_word: מִיַּד יְהוָה
  choice: 耶和华亲手
  rationale: 保留“从耶和华之手”的直接神圣来源与施行意味；“亲手”是自然而庄重的汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣四字名最通行、易识别的译法。
- source_word: הִשְׂכִּיל
  choice: 使我明白
  rationale: 准确表达使役词形所含“使人领会、赐予悟性”的意思，并明确大卫是领受者。
- source_word: כֹּל מַלְאֲכוֹת
  choice: 各项工程
  rationale: 此处指按圣殿设计需要完成的全部工作；“各项工程”兼顾施工任务与制作项目。
- source_word: הַתַּבְנִית
  choice: 设计
  rationale: 在建筑语境中自然表达式样、规划或蓝图，且不把它限定为实体模型。
theological_decisions:
- issue: 如何理解简略结构 עָלַי הִשְׂכִּיל
  choice: 以耶和华为隐含主语，译作“使我明白”
  alternative: “耶和华的手临到我，使我明白”
  rationale: 希伯来文结构紧凑，可理解为耶和华使大卫明白，也可把“在我身上”与“耶和华的手”连接。正文采用较顺畅的使役结构，脚注保留另一种句法分析，避免抹平原文歧义。
- issue: 圣殿设计的来源
  choice: “耶和华亲手写下”
  alternative: “从耶和华手中而来的文字”
  rationale: 保留原文将书面规划直接归于耶和华之手的强烈表达，不改写为仅由大卫自行构思或记录。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“亲手写下”保留希伯来文的形象表达；用“各项工程”贴合圣殿建造语境。脚注分别保存句法歧义和 תַּבְנִית 的词义范围。
