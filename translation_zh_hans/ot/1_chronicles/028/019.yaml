revisions:
- from: 这一切都是耶和华亲手写下、使我明白的，就是这设计中的各项工程[a][b]。
  to: 这一切——这设计的一切工作——都是耶和华借着从他手中而来的文字，使我明白的[a][b]。
  rationale: 修订撤除“亲手写下”这一未经原文明确要求的具体化，保留“书面传达”“出于耶和华之手”“使大卫明白”以及“设计的一切工作”四项信息。脚注a保存原文压缩结构所容许的“耶和华的手临到我”读法，且不以任何教派性解释消除歧义。
