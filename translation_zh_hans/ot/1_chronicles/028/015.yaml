revisions:
- from: 金灯台和灯盏所用的金子，也按重量分配，每一座灯台及其灯盏各有一定的重量[a]；银灯台也按重量分配，每一座灯台及其灯盏所用银子的重量，要按照各座灯台的用途[b]来定。
  to: 又定了金灯台和其灯盏所用金子的重量：每一座灯台和其灯盏各按重量配给[a]；又定了银灯台和其灯盏所用银子的重量：每一座灯台和其灯盏也各按重量配给，照各座灯台的职用[b]。
  rationale: 修订保留原文的器物、材料和逐项分配结构：先列金灯台及其灯盏的金子重量，再列银灯台及其灯盏的银子重量；两处均明示每座灯台及其灯盏分别按重量配给。末语以“照各座灯台的职用”保留 כַּעֲבוֹדַת 的功能／服事含义，而不把它扩展为原文未明说的因果说明。
