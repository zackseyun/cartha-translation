base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/015.yaml
  text: and the weight for the lampstands of gold and their lamps of gold[a], by the weight of each lampstand and its lamps; and for the lampstands of silver, by weight for each lampstand and its lamps, according to the service of each lampstand.
translation:
  language: zh_hans
  text: 又定了金灯台和其灯盏所用金子的重量：每一座灯台和其灯盏各按重量配给[a]；又定了银灯台和其灯盏所用银子的重量：每一座灯台和其灯盏也各按重量配给，照各座灯台的职用[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在此及下文直译为“按灯台和灯台的重量”，以重复名词表示逐项分配；意思是每一座灯台和其灯盏分别按重量配给。
    reason: 说明希伯来语重复结构的分配意义，并适用于金、银两组灯台。
  - marker: b
    text: “职用”也可译作“用途”或“服事”；这里指各座灯台所承担的功用，可能带有圣殿礼仪的含义。
    reason: 保留 עֲבוֹדָה 在圣殿语境中的词义幅度。
lexical_decisions:
- source_word: מִשְׁקָל
  choice: 重量／按重量分配
  rationale: 该词在圣殿器物清单的语境中指称量所得的重量或按重量确定的用料；译作“重量”，并在句法中表达为“按重量分配”，自然传达逐件配给材料的意思。
- source_word: מְנֹרוֹת
  choice: 灯台
  rationale: מְנוֹרָה 指承放灯盏的灯台，而不是灯本身；“灯台”是现代汉语中清楚、庄重且符合圣殿器物语境的称呼。
- source_word: נֵרֹתֵיהֶם / נֵרֹתֶיהָ
  choice: 灯盏
  rationale: נֵר 指灯台上各个盛油点火的灯具；译作“灯盏”可与“灯台”明确区分，也比泛称“灯”更具体。
- source_word: זָהָב
  choice: 金子
  rationale: 原文在金灯台及其灯盏之后再次出现“金”；译文用“所用的金子”保留材料及按重量配给的含义。
- source_word: בְּמִשְׁקַל מְנוֹרָה וּמְנוֹרָה
  choice: 每一座灯台及其灯盏各有一定的重量
  rationale: “灯台和灯台”的重复是希伯来语逐项分配式表达，现代汉语以“每一座……各……”准确而自然地传达。
- source_word: וְלִמְנֹרוֹת הַכֶּסֶף
  choice: 银灯台
  rationale: 简洁表达由银制成的灯台，并与前文“金灯台”形成清楚的平行。
- source_word: כַּעֲבוֹדַת מְנוֹרָה וּמְנוֹרָה
  choice: 按照各座灯台的用途
  rationale: עֲבוֹדָה 在这里可指器物所承担的功用或礼仪职用；“用途”最符合器物按不同需要配置重量的语境，而“各座”保留重复结构的逐项含义。
theological_decisions:
- issue: עֲבוֹדָה 在圣殿语境中是普通“用途”还是礼仪性的“服事／职用”
  choice: 用途
  alternative: 礼仪职用／服事
  rationale: 语境关注不同银灯台所需材料的重量，故“用途”在现代汉语中最自然；脚注保留该词可能带有圣殿礼仪职用色彩的余地，不将其限定为某种特定礼制。
translation_notes:
  register: 采用现代、庄重而易懂的清单式表达。“按重量分配”和“各有一定的重量”使希伯来文省略较多的名词短语在汉语中成为完整句子；以“灯台／灯盏”稳定区分器架与其上的灯具。
