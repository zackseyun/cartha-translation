base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/013.yaml
  text: for the divisions of the priests and the Levites[a], and for all the work of the service of the house of Yahweh[b], and for all the vessels of service of the house of Yahweh.
translation:
  language: zh_hans
  text: 以及祭司和利未人的班次[a]，雅威殿中各项服事的工作，以及雅威殿中服事所用的一切器具[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“分组”。这里指按职责编排的群组或轮班班次。
    reason: lexical_alternative
  - marker: b
    text: “器具”也可译作“器皿”或“用具”；原词泛指圣殿服事所用的各种物件。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְלְקוֹת
  choice: 班次
  rationale: 该词在《历代志》中常指祭司和利未人按职责编排的轮班群组；“班次”既保留组织与轮值含义，也符合现代中文宗教语境。
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: 祭司和利未人
  rationale: 采用这两个身份称谓的标准中文译法，并保留原文并列结构。
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: 服事的工作
  rationale: 分别体现 מְלֶאכֶת 的“工作”和 עֲבוֹדַת 在圣殿语境中的“服事”，避免将两词压缩为一个概念。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: “殿”在此自然表达作为敬拜场所的“房屋”，同时以“雅威”直接呈现神名 יְהוָה。
- source_word: כְּלֵי עֲבוֹדַת
  choice: 服事所用的器具
  rationale: כְּלֵי 是涵盖各种用品、器皿和用具的广义词；“器具”不把范围误限于容器，“所用的”则自然表达其与圣殿服事的关系。
- source_word: לְכָל
  choice: 各项／一切
  rationale: 依中文搭配分别译为“各项服事的工作”和“一切器具”，保留原文两次“所有”的总括作用。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的拟音，同时不以称号替代专名。
- issue: עֲבוֹדָה 在圣殿语境中的含义
  choice: 服事
  alternative: 事奉／劳作
  rationale: “服事”保留该词兼具职责与礼仪服务的含义，不引入后世教会职分概念，也不将它弱化为普通体力劳动。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。经文是承接上文计划清单的句子片段，因此以“以及”起首；保留原文并列、列举的结构，同时避免生硬重复。
