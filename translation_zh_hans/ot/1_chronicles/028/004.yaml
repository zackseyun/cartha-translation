  to: 然而，雅威——以色列的上帝——从我父亲的全家中拣选了我，立我永远[b]作以色列的王；因为他拣选犹大作领袖[a]，又在犹大支派中、在我父亲的家中、在我父亲的众子中喜悦我，立我作全以色列的王。
