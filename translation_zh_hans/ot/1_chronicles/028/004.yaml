  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּבְחַ֡ר יְהוָ֣ה אֱלֹהֵי֩ יִשְׂרָאֵ֨ל בִּ֜/י מִ/כֹּ֣ל בֵּית אָבִ֗/י לִ/הְי֨וֹת לְ/מֶ֤לֶךְ עַל יִשְׂרָאֵל֙ לְ/עוֹלָ֔ם כִּ֤י בִֽ/יהוּדָה֙ בָּחַ֣ר לְ/נָגִ֔יד וּ/בְ/בֵ֥ית יְהוּדָ֖ה בֵּ֣ית אָבִ֑/י וּ/בִ/בְנֵ֣י אָבִ֔/י בִּ֣/י רָצָ֔ה לְ/הַמְלִ֖יךְ עַל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/004.yaml
  text: Yet Yahweh[a], the God of Israel, chose me from all my father's house to be king over Israel forever; for he chose Judah as leader, and in the house of Judah, my father's house, and among my father's sons[b], he took pleasure in me to make me king over all Israel.
translation:
  language: zh_hans
  text: 然而，雅威——以色列的上帝——从我父亲的全家中拣选了我，立我永远[b]作以色列的王；因为他拣选犹大作领袖[a]，又在犹大支派中、在我父亲的家中、在我父亲的众子中喜悦我，立我作全以色列的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领袖”也可译作“统治者”或“首领”。希伯来语 nagid 指受任命的领导者。
    reason: lexical_alternative
  - marker: b
    text: “永远”所译的希伯来语常表示恒久或持续不绝；这里处于大卫家王权的语境中。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现上帝的专名，不以称号替代。
- source_word: וַיִּבְחַר / בָּחַר
  choice: 拣选
  rationale: 保留原文两次重复的神主动选择之意，也符合庄重而易懂的经文语体。
- source_word: בִּי מִכֹּל בֵּית אָבִי
  choice: 从我父亲全家中拣选了我
  rationale: 清楚表达从父系家族范围之内选出大卫；补出第二个“拣选”使汉语自然。
- source_word: לִהְיוֹת לְמֶלֶךְ
  choice: 使我……作……王
  rationale: 该不定式结构表示蒙选的目的或结果，汉语用“使我作王”准确自然。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 保留原词所承载的恒久、延续含义及大卫王权语境中的神学张力，不把它缩减为大卫个人的一生。
- source_word: לְנָגִיד
  choice: 作领袖
  rationale: נָגִיד表示受立的领导者或统治者；“领袖”在此自然，并避免“王子”在现代汉语中的狭窄含义。
- source_word: וּבְבֵית יְהוּדָה בֵּית אָבִי
  choice: 又从犹大家中拣选了我父亲的家
  rationale: 原文介词为“在……中”，但语义结构逐层缩小拣选范围；汉语用“从……中拣选”明确呈现犹大支派到父家的递进。
- source_word: וּבִבְנֵי אָבִי
  choice: 并在我父亲的众子中
  rationale: 依原文保留“我父亲的众子”，而不简化为“我的兄弟”，以维持家谱表达。
- source_word: בִּי רָצָה
  choice: 喜悦我
  rationale: רצה在此表达悦纳、属意或喜爱；“喜悦我”保留其个人性的恩宠意味，并与前面的“拣选”有所区别。
- source_word: לְהַמְלִיךְ
  choice: 使我作……王
  rationale: 准确反映מלך使役式“使某人成王”的含义。
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: 作全以色列的王
  rationale: 自然表达其统治范围，保留“全以色列”的完整范围。
theological_decisions:
- issue: לְעוֹלָם所指王权的期限
  choice: 译作“永远”
  alternative: 长久；世世代代
  rationale: 原文使用可表示恒久或持续期限的עוֹלָם；在大卫家王权的语境中应保留其王朝性和盟约性的开放张力，不在正文中限定为大卫个人寿命，也不直接解释为后来的弥赛亚应验。
- issue: נָגִיד的身份含义
  choice: 译作“领袖”
  alternative: 统治者；君王；王子
  rationale: 该词可指受任命的领导者，而本节并未要求把它技术性地等同于“王”或降格为“王子”；“领袖”既表达权柄，也保留词义空间。
- issue: בִּי רָצָה中的神圣属意
  choice: 译作“喜悦我”
  alternative: 悦纳我；属意于我
  rationale: 保留神对大卫的恩宠和悦意，同时不将原因解释为大卫自身功德。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的简体中文。句式呈现原文从犹大支派、父家到大卫本人的逐层拣选，并用必要的补词避免汉语歧义。所有脚注标记均置于正文中。
