  naturalness: “以色列的上帝雅威”语序略显生硬；“雅威——以色列的上帝”较符合现代汉语庄重语体。修订后通过分号和重复必要的方位短语，使长句清楚自然。
  terminology: “雅威”“拣选”“喜悦我”“立我作……的王”均合适。“领袖”可保留为נָגִיד的非技术性宽译；脚注不宜把该词直接列为“君王”这一较强的等同说法。表示“永远”的脚注应紧随“永远”而非置于句末。
