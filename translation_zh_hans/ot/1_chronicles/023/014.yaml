  yaml_path: translation/ot/1_chronicles/023/014.yaml
  text: And as for Moses, the man of God, his sons were counted among the tribe of Levi.
translation:
  language: zh_hans
  text: 至于神人摩西，他的儿子们都归入利未支派。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来圣经中指受神差遣之人的固定称谓；“神人”简洁、庄重，也保留原文称号的形式。
- source_word: יִקָּרְאוּ עַל שֵׁבֶט הַלֵּוִי
  choice: 都归入利未支派
  rationale: 字面近于“被称在利未支派之上/之中”，在本章宗族编制的语境下表示被列入或归属于该支派；此译自然表达身份归属，同时避免把它误解为单纯的命名行为。
theological_decisions:
- issue: 摩西儿子在以色列支派体系中的归属
  choice: 归入利未支派
  alternative: 算在利未支派中
  rationale: 原文说明摩西虽有独特的“神人”身份，他的儿子仍按利未支派登记。选择“归入”不暗示他们另成祭司或独立支派，也不额外界定其具体职任。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“至于”体现原文以摩西为话题的转换；“都”自然承接复数主语，未增添超出原文的神学含义。
