lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是“儿子”的复数构造式，用来引出家谱名单；本节随即列出四个名字，因此直译为“儿子”比泛化为“后代”更准确。
- source_word: קְהָת
  choice: 哥辖
  rationale: 采用现代中文圣经读者较熟悉的传统人名译法。
- source_word: עַמְרָם
  choice: 暗兰
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: יִצְהָר
  choice: 以斯哈
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: חֶבְרוֹן
  choice: 希伯伦
  rationale: 采用通行译名；虽然此名在别处也可指地名，但本节的家谱语境明确指人名。
- source_word: וְעֻזִּיאֵל
  choice: 和乌薛
  rationale: 将连接词 וְ 译为“和”，人名采用中文圣经通行译法“乌薛”。
- source_word: אַרְבָּעָה
  choice: 共四人
  rationale: 该阳性基数词概括前面所列哥辖儿子的总数；中文以“共四人”自然、清楚地表达总结作用。
