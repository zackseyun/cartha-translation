lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是“儿子”的复数构造式，用来引出家谱名单；本节直接列出两人，译作“儿子”比泛指“后代”更贴切。
- source_word: עֻזִּיאֵל
  choice: 乌薛
  rationale: 按现代中文圣经中较通行的形式音译此人名。
- source_word: מִיכָה
  choice: 米迦
  rationale: 采用现代中文圣经中通行且易于辨认的人名音译。
- source_word: הָרֹאשׁ
  choice: 为首
  rationale: רֹאשׁ本义为“头”，在名单中可表示居首、首位或首领身份；“为首”既自然，又保留次序与地位两种可能，不强行限定为出生顺序。
- source_word: וְיִשִּׁיָּה
  choice: 耶西雅
  rationale: 连词译为上下文自然的并列停顿，人名采用中文圣经传统中较熟悉的音译。
- source_word: הַשֵּׁנִי
  choice: 第二
  rationale: 忠实表达定冠词加序数词“第二”，并与前面的“为首”形成对应。
