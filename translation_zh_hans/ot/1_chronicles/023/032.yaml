base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/032.yaml
  text: And they were to keep charge of the tent of meeting[a], the charge of the holy place, and the charge of the sons of Aaron their brothers, for the service of the house of Yahweh.
translation:
  language: zh_hans
  text: 他们要守会幕的职守、圣所[a]的职守，以及他们的弟兄——亚伦的子孙——的职守，为服事耶和华的殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”也可译作“圣处”或“圣域”；这里的希伯来语可指圣洁之处，并可较广义地指神圣的区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: 他们要守
  rationale: שׁמר表示守护、遵守或履行；结合本章对利未人职责的安排，用“要守”表达所承担的责任，而不是单纯叙述过去发生的事。
- source_word: מִשְׁמֶרֶת
  choice: 职守
  rationale: 该词可指受托的守卫任务、责任或职分。经文连续三次使用此词，译文也重复“职守”，以保留原文正式而平行的结构。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文圣经语境中清楚而通行的表达，含有神与人相会之帐幕的意义。
- source_word: הַקֹּדֶשׁ
  choice: 圣所
  rationale: 在敬拜礼仪的语境中，此词可指神圣的地方，也可能涵盖圣物；正文采用自然、概括性较强的“圣所”，并以脚注保留另一种可能。
- source_word: בְּנֵי אַהֲרֹן אֲחֵיהֶם
  choice: 他们弟兄亚伦子孙
  rationale: 保留“弟兄”和“亚伦子孙”两层亲属表述，表明亚伦系祭司与其余利未人同属弟兄，同时不将“子孙”窄化为当代亲生儿子。
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: 办理耶和华殿里的事务
  rationale: עֲבֹדָה在圣殿语境中指服事、工作或事务；此处用“办理……事务”自然表达利未人承担的圣殿服务。בֵּית按其所指译作“殿”，避免生硬的“房屋”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文直接使用四字神名。采用现代中文读者熟悉的专名“耶和华”，而不以“主”替代，从而保留其作为立约之神名字的性质。
theological_decisions:
- issue: “亚伦子孙的职守”与利未人职责之间的关系
  choice: 保留“他们弟兄亚伦子孙的职守”这一简洁结构
  alternative: 译作“协助他们的弟兄亚伦子孙履行职守”或“听从亚伦子孙的吩咐”
  rationale: 原文只说“守……亚伦子孙的职守”，没有明说是协助、代办还是听命。直译保留利未人与亚伦系祭司职责关系上的概括性，避免加入经文未明说的制度解释。
- issue: 神名 יְהוָה 的表达
  choice: 耶和华
  alternative: 雅威；主
  rationale: 译作专名可反映原文直接出现神名；“耶和华”是普通中文读者最熟悉的形式。“雅威”较接近常见学术拟音，而“主”则会隐去专名性质。
translation_notes:
  register: 采用庄重、明白的现代标准汉语。重复三次“职守”以呈现希伯来文的排比，并用“办理……事务”使句末目的表达自然。
