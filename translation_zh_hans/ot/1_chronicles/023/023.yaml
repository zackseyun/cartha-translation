  yaml_path: translation/ot/1_chronicles/023/023.yaml
  text: 'The sons of Mushi: Mahli[a], Eder, and Jeremoth—three.'
translation:
  language: zh_hans
  text: 穆示的儿子是玛利[a]、以得和耶利摩，共三人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛利”也可音译作“抹利”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是“儿子”的复数附属形式，用来引出家谱名单；本节随即列出三名具体人物，因此直译为“儿子”最准确自然。
- source_word: מוּשִׁי
  choice: 穆示
  rationale: 人名，采用现代中文圣经传统中通行且易辨识的音译。
- source_word: מַחְלִי
  choice: 玛利
  rationale: 人名，按希伯来语形式音译，并采用中文圣经中常见的译名。
- source_word: וְעֵדֶר
  choice: 以得
  rationale: 连词加人名；中文名单中用顿号及末项前的“和”表达并列关系，人名按通行形式音译。
- source_word: וִירֵמוֹת
  choice: 耶利摩
  rationale: 人名，按本节希伯来语形式音译；英语译本中的 Jeremoth/Jerimoth 拼写差异不构成中文正文需要标注的实质异文。
- source_word: שְׁלֹשָׁה
  choice: 共三人
  rationale: 这是对前列三名儿子的总数总结；加“共”和量词“人”，自然保留希伯来文“名单加总数”的结构。
theological_decisions: []
