base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
translation:
  language: zh_hans
  text: 以利亚撒死了，没有儿子，只有女儿；基士的儿子们，就是她们的弟兄[b]，娶了她们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“把她们娶为妻。”
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”很可能是指相关家系中的近亲或同族男子，不一定指同胞兄弟。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: מות在这里直接表示死亡；“死了”朴实明确，不采用委婉说法。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用现代中文圣经中通行的希伯来人名音译。
- source_word: וְלֹא הָיוּ לוֹ בָּנִים
  choice: 没有儿子
  rationale: בָּנִים有时可泛指儿女，但下句明确与“女儿”对照，因此这里特指儿子；中文用“没有儿子”自然准确。
- source_word: כִּי אִם בָּנוֹת
  choice: 只有女儿
  rationale: כִּי אִם在此表达排除和转折，即“只有”；保留儿子与女儿之间的鲜明对照。
- source_word: וַיִּשָּׂאוּם
  choice: 娶了她们
  rationale: נשׂא以女子为宾语时可指娶妻。“娶了她们”符合现代汉语，也明确表达婚姻关系；脚注补充较为展开的直译。
- source_word: בְּנֵי קִישׁ
  choice: 基士的儿子们
  rationale: 按原文构造直译，保留《历代志》家谱叙述的表达方式。
- source_word: אֲחֵיהֶם
  choice: 她们的弟兄
  rationale: 原词通常意为“他们的弟兄”。此处语境表明是与这些女子同族系的男性亲属；正文保留原文的亲属称谓，不直接改成解释性的“亲族”。
