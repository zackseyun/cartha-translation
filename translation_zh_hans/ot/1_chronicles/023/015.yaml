- source_word: וֶ/אֱלִיעֶזֶר
  choice: 和以利以谢
  rationale: 连接词ו译为“和”；אֱלִיעֶזֶר采用通行译名“以利以谢”，不与另一个不同的名字“以利亚撒”混同。
