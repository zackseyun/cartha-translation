lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子中
  rationale: 这是בֵּן的复数附属形式，在家谱及职务名单中引出革舜的后代。译作“儿子中”既保留直译色彩，也使下文只列一人的表达在现代汉语中自然。
- source_word: גֵרְשׁוֹם
  choice: 革舜
  rationale: 按现代中文圣经常用的人名译法音译；原文此处为“Gershom”，不是“Gershon”。
- source_word: שְׁבוּאֵל
  choice: 示布业
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: הָרֹאשׁ
  choice: 为首领
  rationale: רֹאשׁ带定冠词，在本段组织与家谱名单的语境中表示居首或领导地位；“为首领”比字面的“为头”自然，也比“第一”更能表达身份地位。
