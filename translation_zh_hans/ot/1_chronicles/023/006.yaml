  text: 'David divided them into divisions for the sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: zh_hans
  text: 大卫把利未的子孙分成班次：革顺[a]、哥辖和米拉利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫把他们分成班次，归革顺、哥辖和米拉利。”这样译法把原文“革顺”前的介词直接用于这三个人名。
    reason: 保留希伯来文介词לְ在“利未的子孙”和三个人名之间的句法关联所容许的另一种表达。
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: 把他们分成
  rationale: 该词为חלק的皮勒式，并带第三人称阳性复数宾语后缀；“把他们分成”既明确保留“他们”，也自然表达划分、编组之意。
- source_word: מַחְלְקוֹת
  choice: 班次
  rationale: 此名词可指划分出来的组别、班次或队班；在利未人职务编排的语境中，“班次”简洁自然，也保留其制度化分组的含义。
- source_word: לִבְנֵי לֵוִי
  choice: 利未的子孙
  rationale: 贴近希伯来文“利未之子”的谱系表达，并与随后列出的三大宗族祖名衔接；“子孙”在现代汉语中比直译“儿子”更能涵盖这里的后裔群体。
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  choice: 革顺、哥辖和米拉利
  rationale: 采用通行中文圣经人名译法。首个人名前的介词לְ既可理解为受前面“利未的子孙”统摄，也可直接支配这组三个名字；正文以同位列表呈现，并用脚注保留另一种句法理解。
