  text: 'And the sons of Shimei: Jahath[a], Zina, Jeush, and Beriah. These were the sons of Shimei—four.'
translation:
  language: zh_hans
  text: 示每的儿子是雅哈、细拿[a]、耶乌施和比利亚。这四人是示每的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译本作“细撒”（参23:11）；本节的希伯来文作“细拿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעִי
  choice: 示每的儿子是
  rationale: וּ作名单中的承接词；现代汉语在本节独立成句时无需机械译出“和”。בְנֵי在族谱语境中译为“儿子”，同时不排除其可指家族后裔。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: יַחַת
  choice: 雅哈
  rationale: 希伯来人名音译；采用现代中文中较自然、通行的形式。
- source_word: זִינָא
  choice: 细拿
  rationale: 依本节马所拉文本的字形זִינָא音译，不以第11节相关名字的形式代替；异读信息置于脚注。
- source_word: וִיעוּשׁ
  choice: 耶乌施
  rationale: 人名音译；前缀连词在汉语列举结构中由末项前的“和”体现。
- source_word: וּבְרִיעָה
  choice: 和比利亚
  rationale: 人名音译，并明确译出连接名单末项的连词。
- source_word: אֵלֶּה בְנֵי שִׁמְעִי אַרְבָּעָה
  choice: 这四人是示每的儿子
  rationale: 保留原文重复“示每的儿子”的总结结构，并按自然汉语将数词“四”前置，以清楚表达名单总数。
