- from: 以及陈设饼[a]、作素祭用的细面、无酵薄饼、在煎盘上烤制的，以及调和的，并各样容量和尺寸的量度。
  to: 以及陈设饼[a]、作素祭用的细面、无酵薄饼、在煎盘上烹制的祭物和调和制成的祭物，并各样容量和尺寸的量度。
  rationale: 修订仅解决中文句法中悬空定语的问题，并以较宽泛的“烹制”对应煎盘制作的项目。“祭物”由本节祭祀清单及“素祭”语境隐含，不限定其具体材料、配方或制作程序。其余术语和脚注均可保留。
