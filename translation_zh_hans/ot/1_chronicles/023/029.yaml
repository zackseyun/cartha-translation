base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/029.yaml
  text: and for the bread of the arrangement[a], and for the fine flour for the grain offering, and for the wafers of unleavened bread, and for what is cooked on the griddle, and for what is well-mixed, and for every measure and size,
translation:
  language: zh_hans
  text: 以及陈设饼[a]、作素祭用的细面、无酵薄饼、在煎盘上烹制的祭物和调和制成的祭物，并各样容量和尺寸的量度。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“摆列的饼”；也可译“供饼”或“同在之饼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: 陈设饼
  rationale: 希伯来语直指按次序摆列的饼；“陈设饼”是现代中文圣经语境中简洁而可理解的礼仪用语，脚注保留其字面意义及相关传统译法。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指献祭所用的精细面粉；“细面”符合中文圣经礼仪语境，也自然简洁。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在此祭礼语境中指以谷物制品为主的祭物，并非泛指礼物；“素祭”是清楚且通行的中文术语。
- source_word: רְקִיקֵי הַמַּצּוֹת
  choice: 无酵薄饼
  rationale: רְקִיקִים 指薄饼，מַצּוֹת 说明其未经发酵；该译法完整保留两项信息。
- source_word: מַּחֲבַת
  choice: 在煎盘上烤制的
  rationale: 该词指制作祭物所用的平底煎盘；在本串列中用转喻表达由此器具制成的食品，比单译器具更合句法。
- source_word: מֻּרְבָּכֶת
  choice: 调和的
  rationale: 被动形式指经过混合调制的祭物；不进一步限定所混合的材料或具体工序，以保留原文宽度。
- source_word: מְשׂוּרָה
  choice: 容量
  rationale: 指标准量器或所量的容量；与后面的 מִדָּה 并列时，以“容量”显示其偏重量值的一面。
- source_word: מִדָּה
  choice: 尺寸的量度
  rationale: 可指尺度、尺寸或计量标准；与“容量”并列，表达祭礼事务中各类规范化量度。
