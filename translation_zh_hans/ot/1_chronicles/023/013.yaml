base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/013.yaml
  text: 'The sons of Amram: Aaron and Moses. And Aaron was set apart[a], he and his sons forever, to sanctify him as most holy, to burn incense before Yahweh, to minister to him, and to bless in his name forever.'
translation:
  language: zh_hans
  text: 暗兰的儿子：亚伦和摩西。亚伦被分别出来，使他成为至圣；他和他的儿子直到永远，都要在耶和华面前烧香，事奉他，并奉他的名祝福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי עַמְרָם
  choice: 暗兰的儿子
  rationale: 这里随即列出亚伦和摩西，指暗兰亲生的儿子；直译也符合家谱语境。
- source_word: וַיִּבָּדֵל
  choice: 被分别出来
  rationale: בדל 的尼法勒式表示为特定用途而被分开；“分别出来”既保留被动语态，也契合祭司职分的语境。
- source_word: לְהַקְדִּישׁוֹ קֹדֶשׁ קָדָשִׁים
  choice: 使他……成为至圣
  rationale: הקדיש 的使役式表达使之成圣或归为圣；קֹדֶשׁ קָדָשִׁים 是希伯来语最高级结构，在此描述亚伦及其祭司家系的神圣身份。
- source_word: הוּא וּבָנָיו עַד עוֹלָם
  choice: 他和他的子孙永远
  rationale: בנים 可指儿子，也可在延续世代的语境中指后裔；与“永远”连用时，“子孙”自然表达亚伦祭司家系的世代延续。
- source_word: לְהַקְטִיר לִפְנֵי יְהוָה
  choice: 在耶和华面前烧香
  rationale: קטר 在祭司职责中常指焚烧香料；“在耶和华面前”忠实表达 לִפְנֵי יְהוָה。
- source_word: לְשָׁרְתוֹ
  choice: 事奉他
  rationale: שרת 在礼仪语境中指祭司性的服事；代词所指按近处语境理解为耶和华，同时保留原文代词形式。
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: 并奉他的名祝福
  rationale: “奉……的名”可表达凭其名与权柄施行祭司祝福，同时不把介词 ב 的含义收窄为单一方式。
- source_word: עַד עוֹלָם
  choice: 直到永远
  rationale: 保留原文末尾对祭司职分持久性的强调，并采用庄重自然的现代汉语表达。
theological_decisions:
- issue: “使他成圣”中的单数宾语与随后“他和他的子孙”的关系
  choice: 译为“使他和他的子孙永远成为至圣”
  alternative: “使他成为至圣；他和他的子孙永远……”
  rationale: 原文先用单数后缀指亚伦，随后以“他和他的儿子们”扩展说明祭司家系。合并表达能使中文通顺，又不把成圣只局限于亚伦个人。
- issue: לְשָׁרְתוֹ 中代词的所指
  choice: “事奉他”，按上下文自然指耶和华
  alternative: “事奉耶和华”或理解为事奉亚伦
  rationale: 紧邻的“在耶和华面前”使耶和华成为最自然的所指；保留“他”则忠实呈现原文代词，不作不必要的明说。
- issue: “至圣”用于人及其后裔
  choice: 保留“至圣”这一最高级圣洁表达
  alternative: “归为极圣”或“成为圣中之圣”
  rationale: 原文确实把 קֹדֶשׁ קָדָשִׁים 用于亚伦及祭司家系；不因该词也常用于圣物或圣所而弱化这里的神学张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“分别出来”“至圣”“事奉”“奉他的名祝福”保留祭司礼仪语域；句法经适度调整，使单数的亚伦与延续的祭司家系在中文中关系清楚。
