revisions:
- from: 暗兰的儿子是亚伦和摩西。亚伦被分别出来，使他和他的子孙永远成为至圣[a]，在耶和华面前烧香，事奉他，并奉他的名祝福，直到永远。
  to: 暗兰的儿子：亚伦和摩西。亚伦被分别出来，使他成为至圣；他和他的儿子直到永远，都要在耶和华面前烧香，事奉他，并奉他的名祝福。
  rationale: 修订保留原文先以单数指亚伦、随后以“他和他的儿子”说明持续祭司职分的句法推进，不将单数宾语扩展为整个家系。以分号和“都要”使中文自然地表达“直到永远”对后续祭司职责的持续性。脚注保留“至圣”的主译并以较准确的方式说明希伯来语最高级结构。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:31Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确译出暗兰、亚伦、摩西、烧香、在耶和华面前、事奉和奉名祝福等主要成分。然而，它把原文在“使他成为至圣”中的单数宾语（指亚伦）与其后的“他和他的儿子”合并为“使他和他的子孙……成为至圣”，扩大了该单数表达的所指；又将明确的“儿子”改为“子孙”。
  naturalness: “被分别出来”及祭司礼仪用语自然、庄重。但“使他和他的子孙永远成为至圣”既改变句法关系，也使“永远”修饰“成为至圣”，不如将亚伦的受圣别和其子孙持续履行的职分分开表达清楚。
  terminology: “耶和华”“至圣”“烧香”“事奉”“奉他的名祝福”均适合本段的庄重礼仪语域。应保留“儿子”以对应 בָנָיו，不宜在此改作“子孙”。脚注的“圣中之圣／圣洁中的圣洁”不够规范；可说明其为希伯来语重复名词构成的最高级表达。
  issues:
  - severity: medium
    issue: 单数“他”被扩展为“他和他的子孙”
    rationale: לְהַקְדִּישׁוֹ 的后缀为单数，按本句语法最自然指亚伦；其后 הוּא וּבָנָיו 才提及亚伦和他的儿子。草稿的合并处理改变了原文的指称范围。
  - severity: medium
    issue: “儿子”被译作“子孙”
    rationale: 原文明确使用“他的儿子们”；虽可在某些家谱上下文延及后裔，本节紧接亚伦和摩西的直接家系陈述，宜保留“儿子”。
  - severity: low
    issue: 脚注的直译说明不够准确、自然
    rationale: קֹדֶשׁ קָדָשִׁים 是重复名词构成的最高级表达；“圣中之圣”及“圣洁中的圣洁”在现代汉语中不够规范，且容易误解为固定空间名称。
  revised_text: 暗兰的儿子：亚伦和摩西。亚伦被分别出来，使他成为至圣；他和他的儿子直到永远，都要在耶和华面前烧香，事奉他，并奉他的名祝福。
  revised_footnotes:
