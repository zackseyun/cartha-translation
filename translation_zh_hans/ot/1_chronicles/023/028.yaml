  text: כִּ֣י מַעֲמָדָ֞/ם לְ/יַד בְּנֵ֣י אַהֲרֹ֗ן לַ/עֲבֹדַת֙ בֵּ֣ית יְהוָ֔ה עַל הַ/חֲצֵרוֹת֙ וְ/עַל הַ/לְּשָׁכ֔וֹת וְ/עַֽל טָהֳרַ֖ת לְ/כָל קֹ֑דֶשׁ וּ/מַֽעֲשֵׂ֔ה עֲבֹדַ֖ת בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/028.yaml
  text: For their duty was to assist the sons of Aaron in the service of the house of Yahweh, concerning the courts and the chambers, and the purification of all that is holy, and the work of the service of the house of God.
translation:
  language: zh_hans
  text: 因为他们的职分[a]是在亚伦子孙身旁协助他们[b]，办理耶和华殿里的事务，负责各院子、各房间、洁净一切圣物[c]，以及神殿中各项服侍的工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “职分”也可译作“岗位”或“职务”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“在亚伦子孙手边”，即在他们身旁协助他们。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“洁净每一件圣物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为利未人所受任命作出说明；“因为”自然保留解释性的因果关系。
- source_word: מַעֲמָדָם
  choice: 他们的职分
  rationale: 该词指受委派的岗位或职责；“职分”兼顾其职位与实际责任，并符合圣殿事务的语境。
- source_word: לְיַד בְּנֵי אַהֲרֹן
  choice: 在亚伦子孙身旁协助他们
  rationale: 原义为“在亚伦子孙手边”；此处表示配合、辅助性的服侍。“身旁协助”既保留空间意象，也不把经文未明说的权力层级强加进去。
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: 办理耶和华殿里的事务
  rationale: עֲבֹדָה 在此指圣殿中的服侍和事务；此译法在现代汉语中自然，并能统领后列各项职责。
- source_word: עַל הַחֲצֵרוֹת וְעַל הַלְּשָׁכוֹת
  choice: 负责各院子、各房间
  rationale: עַל 在职责清单中表示负责的范围；“负责”比单纯表示位置的“在”更合语境。חֲצֵרוֹת 与 לְשָׁכוֹת 分别译作圣殿的“院子”和“房间”。
- source_word: וְעַל טָהֳרַת לְכָל קֹדֶשׁ
  choice: 洁净一切圣物
  rationale: קֹדֶשׁ 是集合性单数，可泛指一切神圣之物；“洁净一切圣物”简明表达礼仪洁净的职责，同时保留所指范围的宽泛性。
- source_word: וּמַעֲשֵׂה עֲבֹדַת בֵּית הָאֱלֹהִים
  choice: 以及神殿中各项服侍的工作
  rationale: 译文保留 מַעֲשֵׂה（工作）与 עֲבֹדַת（服侍）两个相关名词，反映原文周全而正式的行政性表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；采用现代中文圣经读者最熟悉的专名“耶和华”，不以“主”替代该名。
- issue: 利未人与亚伦祭司的关系
  choice: 在亚伦子孙身旁协助他们
  alternative: 在亚伦子孙手下服侍
  rationale: 原文习语 לְיַד 明确表达相对于亚伦子孙的辅助关系，但并不足以单凭此处断定更强的制度性从属含义；所选译法保留这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华殿”与“神殿”对应原文先后使用的不同神称；职责清单以“负责”串联，避免生硬逐词翻译，同时在末句保留“服侍的工作”的名词叠用。
