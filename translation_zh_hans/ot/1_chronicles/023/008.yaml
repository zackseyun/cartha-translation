  yaml_path: translation/ot/1_chronicles/023/008.yaml
  text: 'The sons of Ladan: Jehiel the head[a], and Zetham and Joel—three.'
translation:
  language: zh_hans
  text: 拉但的儿子有：为首的耶希伊利[a]、细坦和约珥，共三人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作首领的”或“居首的”；希伯来语可能表示耶希伊利是其中为首者，也可能表示他列在首位。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是“儿子”的复数附属形式。此处紧接三个人名，译作“儿子”比泛指“后代”更直接。
- source_word: לַעְדָּן
  choice: 拉但
  rationale: 按希伯来语专名音译，并采用现代中文圣经中自然、简洁的形式。
- source_word: הָרֹאשׁ
  choice: 为首的
  rationale: 原词本义为“头、首领、为首者”。此处可能指居首或负领导地位的人；“为首的”保留这种范围，不径自确定为“长子”。
- source_word: יְחִיאֵל
  choice: 耶希伊利
  rationale: 按希伯来语专名音译。
- source_word: וְזֵתָם
  choice: 细坦
  rationale: 连接词加专名；中文列举中以顿号和“和”自然表达其并列关系。
- source_word: וְיוֹאֵל
  choice: 约珥
  rationale: 按希伯来语专名音译。
- source_word: שְׁלֹשָׁה
  choice: 共三人
  rationale: 保留原文明确的总数，并补出量词“人”，使现代汉语自然清楚。
theological_decisions: []
