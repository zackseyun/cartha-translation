base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/019.yaml
  text: 'The sons of Hebron: Jeriah the first[a], Amariah the second, Jahaziel the third, and Jekameam the fourth.'
translation:
  language: zh_hans
  text: 希伯仑的儿子是：耶利雅第一[a]，亚玛利雅第二，雅哈悉第三，耶加面第四。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“头”或“首”，也可译为“首领”；但这里与“第二、第三、第四”并列，表示次序中的第一位。
    reason: 说明 הָרֹאשׁ 的字面词义及其在本节并列序列中的实际功能，避免正文产生职分含义。
lexical_decisions:
- source_word: בְּנֵי חֶבְרוֹן
  choice: 希伯仑的儿子
  rationale: בְּנֵי 是“儿子”的复数构造形式，在此引出希伯仑诸子的名单；按直接亲属关系译为“儿子”，不扩大为“后代”。
- source_word: יְרִיָּהוּ
  choice: 耶利雅
  rationale: 按现代中文圣经人名的常见音译形式处理该专名。
- source_word: הָרֹאשׁ
  choice: 为首
  rationale: רֹאשׁ 的字面意义是“头、首领”，此处与“第二、第三、第四”平行，具有序列中的首位含义；译作“为首”既保留原词措辞，也自然表达排行。
- source_word: אֲמַרְיָה
  choice: 亚玛利亚
  rationale: 采用现代中文圣经中易辨识的惯用音译。
- source_word: הַשֵּׁנִי / הַשְּׁלִישִׁי / הָרְבִיעִי
  choice: 第二／第三／第四
  rationale: 这些词是明确的序数词，直接呈现名单中的次序。
- source_word: יַחֲזִיאֵל
  choice: 雅哈悉
  rationale: 采用现代中文圣经中易辨识的惯用音译。
- source_word: וִיקַמְעָם
  choice: 耶加面
  rationale: וְ 是连接词“和”；专名 יְקַמְעָם 采用中文传统中较易辨识的音译。中文列举中末项无需另加“和”，语意仍然清楚。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。名单结构紧凑，使用“是：”引出各人，并以序数标明次序；“为首”保留原文与普通序数词略有不同的表达。
