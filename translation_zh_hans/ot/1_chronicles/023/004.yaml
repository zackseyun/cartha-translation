  text: מֵ/אֵ֗לֶּה לְ/נַצֵּ֨חַ֙ עַל מְלֶ֣אכֶת בֵּית יְהוָ֔ה עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָ֑לֶף וְ/שֹׁטְרִ֥ים וְ/שֹׁפְטִ֖ים שֵׁ֥שֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/004.yaml
  text: Of these, twenty-four thousand were to oversee the work of the house of Yahweh, and six thousand were officers and judges.
translation:
  language: zh_hans
  text: 其中二万四千人负责监督雅威的殿的工作，六千人担任官员和审判官。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: 其中
  rationale: מִן与指示代词连用，表示从前文所述利未人中划出的部分；“其中”自然保留其部分义。
- source_word: לְנַצֵּחַ
  choice: 负责督管
  rationale: 此处נצל的皮勒式不定词表示受委派监督、管理，而非音乐方面的指挥；“负责督管”兼顾任命意味与行政语境。
- source_word: עַל מְלֶאכֶת
  choice: ……的事务
  rationale: מְלָאכָה可指工作、劳务或职责；在圣殿行政语境中，“事务”涵盖各项工作，又不把范围收窄为礼仪服事。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: בַּיִת在此指归于雅威的圣所；汉语用“殿”比直译“家”自然，并保留与现代读者所理解的圣殿场景。神名יְהוָה音译为“雅威”。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 直接表达人数，并补出汉语量词“人”。
- source_word: וְשֹׁטְרִים
  choice: 官员
  rationale: שֹׁטֵר指承担行政职能的官吏或办事人员；“官员”在此较自然且保持宽泛。
- source_word: וְשֹׁפְטִים
  choice: 审判官
  rationale: שֹׁפֵט指执行司法审断职责的人；“审判官”明确表达其职能，也与前面的“官员”区分。
- source_word: שֵׁשֶׁת אֲלָפִים
  choice: 六千人
  rationale: 直接表达人数，并按现代汉语补出量词。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以通行的学术音译方式保留专名性质，不以称号替代，也不采用形成较晚的“耶和华”读音。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“负责督管”体现受命监督的行政职责；“雅威殿”简洁自然。原文第二分句只列“官员和审判官”，中文补出“另有……人作”以明确人数分配，不增加实质信息。
