  text: 'The sons of Merari: Mahli and Mushi. The sons of Mahli: Eleazar and Kish.'
translation:
  language: zh_hans
  text: 米拉利的儿子是抹利和母示。抹利的儿子是以利亚撒和基士。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的儿子
  rationale: 这是בֵּן的复数附属形式，在本节引出直系父子谱系；译作“儿子”直接、自然，也保留原文的家谱结构。
- source_word: מְרָרִי
  choice: 米拉利
  rationale: 人名按现代中文圣经中通行且易于辨认的形式音译。
- source_word: מַחְלִי
  choice: 抹利
  rationale: 人名采用中文圣经通行译名；本节两次出现，前一次列为米拉利之子，后一次构成“抹利的儿子”。
- source_word: וּמוּשִׁי
  choice: 和母示
  rationale: 连词וְ与人名相连，译作“和母示”，清楚列出米拉利的第二个儿子。
- source_word: בְּנֵי מַחְלִי
  choice: 抹利的儿子
  rationale: 保留原文第二个家谱标题，与前句形成清晰、平行的结构。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用中文圣经通行人名译法。
- source_word: וְקִישׁ
  choice: 和基士
  rationale: 连词加人名，译作“和基士”，列出抹利的第二个儿子。
