  text: כִּ֣י בְ/דִבְרֵ֤י דָוִיד֙ הָ/אַ֣חֲרֹנִ֔ים הֵ֖מָּה מִסְפַּ֣ר בְּנֵי לֵוִ֑י מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/027.yaml
  text: For by the last words of David[a], the sons of Levi were numbered from twenty years old and upward.
translation:
  language: zh_hans
  text: 因为照着大卫最后的吩咐[a]，利未子孙中二十岁及以上的都被数点。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照着大卫最后的话。”希伯来文可能表示，这次数点是依据大卫最后的指示进行的。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明缘由；现代汉语中“因为”能自然表达这里的解释关系。
- source_word: בְּדִבְרֵי דָוִיד הָאַחֲרֹנִים
  choice: 照着大卫最后的吩咐
  rationale: 介词 בְּ 可表示依据；דִּבְרֵי 字面为“话”，但本语境指大卫最后所作的指示。“吩咐”传达其指令性质，脚注保留“最后的话”这一较形式对应的译法。
- source_word: הֵמָּה מִסְפַּר
  choice: 都被数点
  rationale: 原文表达较为省略，语境所指是利未人被列入统计；“被数点”保留经文体庄重感，同时清楚表达被计数。
- source_word: בְּנֵי לֵוִי
  choice: 利未子孙
  rationale: 保留原文“利未之子”的族谱性表达，又比直译“利未的儿子”更符合其群体所指。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: 中二十岁及以上的
  rationale: 自然准确地表达从二十岁起并包括所有更高年龄的人；“中”与前面的群体名词衔接，避免误解。
