  text: And he gathered all the leaders of Israel[a], and the priests and the Levites.
translation:
  language: zh_hans
  text: 他召集了以色列的所有首领[a]、祭司和利未人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“官长”“领袖”或“官员”。
    reason: 原文 שָׂרִים 的含义范围较广，可指具有统领或行政地位的人；正文采用较宽泛而自然的“首领”保留语境弹性。
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: 他召集了
  rationale: 该叙事形式推动事件发展；“召集”自然表达把各群体集合起来的动作，也符合本节正式集会的语境。主语沿用上文，以“他”承接。
- source_word: כָּל
  choice: 所有
  rationale: 表示整体范围；置于复数群体“首领”之前，现代汉语用“所有”清楚自然。
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: 以色列的所有首领
  rationale: שָׂרִים 可指首领、官长、领袖或主管者；此处“首领”庄重而通俗，又不把他们限定为王子或某一特定行政官职。
- source_word: וְהַכֹּהֲנִים
  choice: 祭司
  rationale: 直接译出带定冠词的复数群体名称；汉语并列结构中无需重复“和”。
- source_word: וְהַלְוִיִּם
  choice: 利未人
  rationale: 采用现代中文圣经语境中通行的族群与职分称谓，准确对应原文复数名称。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“召集”比“聚集”更明确地体现主语主动召来各领导及宗教群体；并列项依照现代汉语习惯用顿号连接，仅在末项前用“和”。
