  naturalness: “以利以谢的儿子中，利哈比雅为首”虽可理解，但在紧接着说明他没有别的儿子的语境中，“儿子中”略显不自然。改为列举式“以利以谢的儿子是利哈比雅，他为首”更符合现代汉语，也更贴近原文家谱句式。
  terminology: 人名“以利以谢”“利哈比雅”采用通行中文圣经译名，适当。脚注不宜以“长子”作为主要替代，因为本节随即表明利哈比雅是以利以谢唯一的儿子；“居首／首领”更能准确说明原词的可译范围。
