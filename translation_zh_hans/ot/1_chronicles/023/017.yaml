  yaml_path: translation/ot/1_chronicles/023/017.yaml
  text: 'The sons of Eliezer: Rehabiah was the chief[a], and Eliezer had no other sons; but the sons of Rehabiah became very many.'
translation:
  language: zh_hans
  text: 以利以谢的儿子是利哈比雅，他为首[a]；以利以谢没有别的儿子。利哈比雅的儿子却极其增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为首”也可译作“居首”或“首领”。原文的具体含义在此未完全限定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אֱלִיעֶזֶר
  choice: 以利以谢的儿子中
  rationale: 按家谱列举公式处理，采用自然的现代汉语引介后文，同时保留“以利以谢的儿子”这一结构。
- source_word: רְחַבְיָה
  choice: 利哈比雅
  rationale: 按现代中文圣经人名的通行音译形式处理。
- source_word: הָרֹאשׁ
  choice: 为首
  rationale: רֹאשׁ本义为“头”，在家谱或组织语境中可指居首、为首者；“为首”既简洁，又避免过度确定其具体职衔。
- source_word: וְלֹא הָיָה לֶאֱלִיעֶזֶר בָּנִים אֲחֵרִים
  choice: 以利以谢没有别的儿子
  rationale: 将希伯来语领有存在句自然地译为汉语领有句；“别的”明确利哈比雅是其唯一的儿子。
- source_word: וּבְנֵי רְחַבְיָה
  choice: 利哈比雅的儿子却
  rationale: בָּנִים直译为“儿子”；连接词在此表达与以利以谢没有其他儿子的对比，因此译作“却”。
- source_word: רָבוּ לְמָעְלָה
  choice: 极其增多
  rationale: רָבוּ表达数量增长，לְמָעְלָה在此加强程度；“极其增多”保留动态的“繁增”含义及强烈程度。
