base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/031.yaml
  text: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
translation:
  language: zh_hans
  text: 又要负责一切在安息日、朔日和指定的节期，按所规定的数目和适用于这些祭的条例，常常在雅威面前献上燔祭的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְכֹל הַעֲלוֹת עֹלוֹת
  choice: 又要……献上所有……燔祭
  rationale: 此处承接上文列举利未人的职责。הַעֲלוֹת 是 עלה 的不定式，后接同根的 עֹלוֹת，表达献燔祭这一行动；中文用“献上……燔祭”自然呈现，不机械重复同根词。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词 ל 在祭祀语境中表示祭物献给谁；יהוה 按其专名译作“雅威”。
- source_word: לַשַּׁבָּתוֹת
  choice: 在安息日
  rationale: 这里指献祭的时日；希伯来文为复数，中文类别性时间表达通常无需加“各个”。
- source_word: לֶחֳדָשִׁים
  choice: 朔日
  rationale: חֳדָשִׁים 在礼仪历法语境中指每月月初的新月祭日，而非泛指月份；“朔日”简洁且是现代中文圣经语境中可理解的历法词。
- source_word: וְלַמּוֹעֲדִים
  choice: 和各指定的节期
  rationale: מוֹעֲדִים 指按时设立的神圣节期；“指定的节期”同时保留预定时间与节庆含义。
- source_word: בְּמִסְפָּר
  choice: 按规定的数目
  rationale: 该词说明祭物数量有明确要求；结合下文 כְּמִשְׁפָּט，以“按规定的数目”传达数额并非任意。
- source_word: כְּמִשְׁפָּט עֲלֵיהֶם
  choice: 照有关这些祭的条例
  rationale: מִשְׁפָּט 在此指礼仪法规，עֲלֵיהֶם 指适用于它们的规定；“这些祭”依据近处的燔祭补足中文所需指代，但不进一步限定为具体某一节期。
- source_word: תָּמִיד לִפְנֵי יְהוָה
  choice: 常常献在雅威面前
  rationale: תָּמִיד 在礼仪语境中强调持续而有规律地履行；לִפְנֵי 表示在神面前、神的临在中。补出“献”使中文句法完整。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”使读者看见这是以色列之神的专名，而不是普通称号。
- issue: תָּמִיד 所表达的持续性
  choice: 常常
  alternative: 不断地；定期
  rationale: 此词在祭祀制度中可同时带有持续与例行的意味。“常常”保留这种宽度，避免误解为每时每刻不间断，也不把意义缩窄为仅仅按期举行。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“燔祭”“安息日”“朔日”是必要且成熟的圣经术语；句子分为两个分句，以清楚呈现献祭场合与数量、条例、持续性等要求。
