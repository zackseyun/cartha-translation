  text: וְ/אַרְבַּ֥עַת אֲלָפִ֖ים שֹׁעֲרִ֑ים וְ/אַרְבַּ֤עַת אֲלָפִים֙ מְהַֽלְלִ֣ים לַ/יהוָ֔ה בַּ/כֵּלִ֕ים אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/הַלֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/005.yaml
  text: and four thousand gatekeepers[a], and four thousand praising Yahweh with the instruments that I made to praise him.
translation:
  language: zh_hans
  text: 又有四千名守门人；另有四千人用我所造、用来赞美的乐器[a]赞美雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用来赞美”也可译作“供赞美用”；原文在这里没有明说赞美的对象。
    reason: 说明末尾目的不定式的译法及原文省略的宾语。
lexical_decisions:
- source_word: שֹׁעֲרִים
  choice: 守门人
  rationale: 该词指受派看守各门的人；“守门人”符合圣殿职务的语境，也是现代汉语中自然、准确的表达。
- source_word: מְהַלְלִים
  choice: 赞美
  rationale: 希伯来语分词表示这群人持续承担的职分；汉语以谓语“赞美”自然表达其功能。
- source_word: לַיהוָה
  choice: 赞美雅威
  rationale: 介词 לְ 标明赞美的对象；专名“雅威”直接呈现四字神名 יהוה。
- source_word: בַּכֵּלִים
  choice: 用……乐器
  rationale: כֵּלִים 本义范围较广，可指器具；在赞美的语境中指乐器，以“用”表达工具意义。
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: 我所造
  rationale: 直译第一人称关系从句，并保留说话者大卫的第一人称，不在正文中另行补名。
- source_word: לְהַלֵּל
  choice: 供赞美用
  rationale: 该不定式表示目的；译法保留原文未明确指出赞美对象的特点，也自然修饰前面的乐器。
- source_word: וְאַרְבַּעַת אֲלָפִים ... וְאַרְבַּעַת אֲלָפִים
  choice: 又有四千人……四千人……
  rationale: 保留两个各为四千人的群体及原文重复的数字结构。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”作为音译，保留其专名性质，不将其改译为称号。
- issue: 末尾 לְהַלֵּל 是否补出赞美的对象
  choice: 不补宾语，译作“供赞美用”
  alternative: 用来赞美他／用来赞美雅威
  rationale: 希伯来原文在该不定式后没有明说宾语；前文虽使对象容易推知，正文仍保留其语法上的省略，避免替原文消除含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作守门人”突出职务身份；“用我所造、供赞美用的乐器”兼顾原文关系从句和目的不定式，并避免重复生硬。
