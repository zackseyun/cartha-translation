reference: 1 Chronicles 23:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֵ֣לֶּה בְנֵֽי לֵוִי֩ לְ/בֵ֨ית אֲבֹתֵי/הֶ֜ם רָאשֵׁ֧י הָ/אָב֣וֹת לִ/פְקוּדֵי/הֶ֗ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם עֹשֵׂה֙ הַ/מְּלָאכָ֔ה לַ/עֲבֹדַ֖ת בֵּ֣ית יְהוָ֑ה מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/024.yaml
  text: These were the sons of Levi by their fathers’ houses[a], the heads of the fathers’ houses, according to those counted of them, by the number of names, head by head, doing the work for the service of the house of Yahweh, from twenty years old and upward.
translation:
  language: zh_hans
  text: 这些是利未子孙中按父系家族划分的父系家族首领；他们按所登记的人数，按名逐一按人头[a]计算，都是二十岁及以上、办理雅威殿中事奉工作的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按人头”：希伯来文直译为“按他们的头颅”，是逐人分别数点的惯用说法。
    reason: 说明原文“头颅／头”的具体意象及其表示逐人计数的惯用含义。
lexical_decisions:
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: 按他们的父系家族
  rationale: 指以父系血缘划分的以色列宗族单位；“父系家族”比直译“父家”更易为现代读者理解，同时保留其社会结构含义。
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 各宗族的首领
  rationale: 原文直译近于“父祖的首领”，在本处指父系宗族的领袖；采用自然的现代汉语表达，不使用含混的“众父之首”。
- source_word: לִפְקוּדֵיהֶם
  choice: 照着数点的记录
  rationale: פקד在此涉及人口清点或登记；上下文接着提到名字和逐人计算，因此译为“数点的记录”能表达名册背景，但不把它限定为军事征召。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 按名字的数目
  rationale: 保留原文具体的“名字”和“数目”，表明被数点者是列名登记的个人。
- source_word: לְגֻלְגְּלֹתָם
  choice: 逐一按人头
  rationale: גֻּלְגֹּלֶת字面指“头颅”，此处是逐人计算的惯用语；正文采用通顺而仍保留“头”意象的表达，并以脚注说明。
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: 他们办理……工作
  rationale: 单数分词在此具有集合意义，描述被登记的利未人所从事的工作；汉语用复数主语自然呈现这一功能。
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: 耶和华殿中事奉的工作
  rationale: עֲבֹדָה涵盖与圣殿有关的礼仪及实际劳务；“事奉的工作”兼顾宗教服事和具体职责，不缩窄为单纯礼仪。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者熟悉的神名音译“耶和华”，明确呈现专名，而不以“主”这一称号替代。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: 二十岁以上
  rationale: 这是规定最低年龄的希伯来语惯用表达；“二十岁以上”在现代汉语中简洁明确，并包含二十岁。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文保留为专名；“耶和华”是普通现代中文读者最熟悉且庄重的音译，“雅威”则更接近常见学术拟音。两者涉及音译传统，不改变本节的神学陈述。
- issue: עֲבֹדָה所指的圣殿职责范围
  choice: 事奉的工作
  alternative: 劳役／服役
  rationale: 该词在本节既有为圣殿服务的宗教语境，也可包含实际劳务；“事奉的工作”保留两方面，不把利未人的职责仅解释为礼仪职分或体力劳动。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。原文带有名册式的层叠结构，译文以同位说明和分句处理，使家族分类、数点方式、职责及年龄门槛层次清晰；不补入原文没有明确说明的礼仪细节。
