revisions:
- from: 以下是利未的子孙，按他们的父系家族，即各宗族的首领，照着数点的记录，按名字的数目，逐一按人头[a]登记。他们办理耶和华殿中事奉的工作，都是二十岁以上的。
  to: 这些是利未子孙中按父系家族划分的父系家族首领；他们按所登记的人数，按名逐一按人头[a]计算，都是二十岁及以上、办理雅威殿中事奉工作的人。
  rationale: 修订明确“父系家族首领”是利未子孙中的受登记者，并将“登记的人数”“按名”“按人头”依原文层次相连。将神名改为“雅威”，以对应项目对YHWH采用Yahweh的审计决定；其余措辞保留原译对圣殿服务及年龄资格的准确表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:39Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本传达了按父系家族分类、登记数点、圣殿职责及二十岁起的年龄门槛。但“以下是利未的子孙，按他们的父系家族，即各宗族的首领”容易把“利未的子孙”与“父系家族的首领”作不严谨的同位，且未清楚表达首领是按登记人数、逐名计算的。
  naturalness: 原译整体通顺，但“逐一按人头登记”与前面的“照着数点的记录，按名字的数目”略显重复，也使“登记”仿佛只是最后一个短语的动作。重组后可更符合现代汉语，同时保留原文名册式层叠结构。
  terminology: “父系家族”“事奉的工作”均恰当。就项目审计轨迹对YHWH采用 Yahweh 的规定而言，中文宜采用对应音译“雅威”，而非传统音译“耶和华”。“按人头”保留在正文并以脚注说明，忠实反映原文的具体意象和惯用意义。
  issues:
  - severity: medium
    issue: 家族首领与利未子孙的句法关系不够清楚
    rationale: רָאשֵׁי הָאָבוֹת指父系家族的首领；原译用“即各宗族的首领”可能被读作所有利未子孙都等同于首领。应明确为“利未子孙中……的父系家族首领”。
  - severity: medium
    issue: 神名译法未与项目Yahweh审计决定一致
    rationale: 原文为四字神名יהוה，英文POB审计记录明确采用Yahweh。中文使用“雅威”可作为该专名的对应音译，避免改用另一传统音译。
  - severity: low
    issue: 数点短语的层次和动词归属略重复
    rationale: “照着数点的记录，按名字的数目，逐一按人头登记”堆叠且“登记”位置不够明确。改为“按所登记的人数，按名逐一计算”更清晰，脚注保留“头颅”的字面意象。
  revised_text: 这些是利未子孙中按父系家族划分的父系家族首领；他们按所登记的人数，按名逐一按人头[a]计算，都是二十岁及以上、办理雅威殿中事奉工作的人。
  revised_footnotes:
