    text: “按人头”：希伯来文直译为“按他们的头颅”，是逐人分别数点的惯用说法。
    reason: 说明原文“头颅／头”的具体意象及其表示逐人计数的惯用含义。
  revision_rationale: 修订明确“父系家族首领”是利未子孙中的受登记者，并将“登记的人数”“按名”“按人头”依原文层次相连。将神名改为“雅威”，以对应项目对YHWH采用Yahweh的审计决定；其余措辞保留原译对圣殿服务及年龄资格的准确表达。
