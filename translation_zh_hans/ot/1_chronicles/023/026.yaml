  text: וְ/גַ֖ם לַ/לְוִיִּ֑ם אֵין לָ/שֵׂ֧את אֶת הַ/מִּשְׁכָּ֛ן וְ/אֶת כָּל כֵּלָ֖י/ו לַ/עֲבֹדָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/026.yaml
  text: And also[a], the Levites no longer need to carry the tabernacle and all its utensils for its service.
translation:
  language: zh_hans
  text: 利未人也不再需要[a]搬运帐幕和一切供帐幕事奉使用的器具。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“利未人也无需搬运帐幕和一切供帐幕事奉使用的器具。”
    reason: 原文אֵין לָשֵׂאת字面表达“无需搬运”；正文的“不再”根据帐幕不再迁移及利未人职责调整的上下文译出。
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 承接上文并表达添加之意；现代汉语用“也”可自然体现连接词与添加语气。
- source_word: לַלְוִיִּם
  choice: 利未人
  rationale: 介词לְ标明所涉及的一方；在汉语中宜将“利未人”直接置于主语位置。
- source_word: אֵין לָשֵׂאת
  choice: 不再需要抬
  rationale: 字面结构是“没有可抬／无需抬”。结合上文耶和华使百姓安居、帐幕不再迁移的语境，此处说的是抬运不再成为利未人的职责，而非禁止他们抬运。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 这是以色列敬拜语境中מִשְׁכָּן的通行、准确译法。
- source_word: וְאֶת כָּל כֵּלָיו
  choice: 和一切……器具
  rationale: 保留וְ及כָּל的并列和全称含义；כֵּלִים在此泛指帐幕所用的各种器皿、用具和装备，以“器具”概括最为自然。
- source_word: לַעֲבֹדָתוֹ
  choice: 用于帐幕事奉
  rationale: “事奉”保留עֲבֹדָה在圣所礼仪语境中的含义；“帐幕”明确表达阳性单数后缀最自然的先行词。
theological_decisions:
- issue: אֵין לָשֵׂאת表达无需履行职责还是禁止行为
  choice: 译作“不再需要抬”
  alternative: “不可抬”
  rationale: 上下文讨论利未人职责因帐幕固定而调整，重点是不再需要迁运，并非颁布禁令。
- issue: “不再”的时间含义是否由原文直接表达
  choice: 正文按上下文译出“不再需要”
  alternative: 较直译为“无需抬”
  rationale: 原文אֵין本身没有独立的“从此以后”一词，但前后文清楚涉及职责变化；脚注保留较贴近字面结构的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“抬帐幕”延续经文中利未人搬运圣物的具体动作；“用于帐幕事奉的器具”既说明器具用途，也避免把עֲבֹדָה弱化为一般工作。
