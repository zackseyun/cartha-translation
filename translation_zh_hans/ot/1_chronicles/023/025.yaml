  text: כִּ֚י אָמַ֣ר דָּוִ֔יד הֵנִ֛יחַ יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל לְ/עַמּ֑/וֹ וַ/יִּשְׁכֹּ֥ן בִּ/ירוּשָׁלִַ֖ם עַד לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/025.yaml
  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
translation:
  language: zh_hans
  text: 因为大卫说：“雅威，就是以色列的上帝，已经使他的子民得享安宁，并永远住在耶路撒冷。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：“并且他将永远住在耶路撒冷。”这里的希伯来动词也可强调雅威已在耶路撒冷定居，并持续住在那里。
    reason: 原文动词可从前瞻或既成而持续的角度理解，正文采用不强制标明时态的汉语表达以保留歧义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的安排说明理由；“因为”自然保留了解释性的逻辑关系。
- source_word: אָמַר דָּוִיד
  choice: 大卫说
  rationale: 按希伯来文叙事时态直译，现代汉语无需另加“曾经”。
- source_word: הֵנִיחַ
  choice: 已经使……得享安宁
  rationale: נוח的使役式表示使人安歇、赐下安定；此译保留使役意义和已经实现、仍具现实意义的结果。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现四字神名，不以称号替代专名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 按附属结构翻译，并以“就是”明确其与“雅威”的同位关系。
- source_word: לְעַמּוֹ
  choice: 他的子民
  rationale: 在“使……得享安宁”的汉语结构中作受益者兼宾语，自然表达原文的ל介词关系。
- source_word: וַיִּשְׁכֹּן
  choice: 并……住
  rationale: 现代汉语动词本身不强制标明过去、现在或将来，因而可自然保留此处动词在既成、持续和前瞻意义之间的张力。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 直接表达地点。
- source_word: עַד לְעוֹלָם
  choice: 永远
  rationale: 简洁自然地表达持续无尽的意义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，不以称号替换。
- issue: 雅威住在耶路撒冷的时态与体貌
  choice: 并永远住在耶路撒冷
  alternative: 并且他将永远住在耶路撒冷；并且他已经永远住在耶路撒冷
  rationale: 希伯来文וַיִּשְׁכֹּן在此可指已经确立而持续的居住，也可带前瞻意味。汉语不标时的“住”最能保留原文的开放性，脚注列出较明确的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“得享安宁”既适合礼仪性历史叙述，又不显古奥；“就是”自然标明“雅威”与“以色列的上帝”的同位关系。
