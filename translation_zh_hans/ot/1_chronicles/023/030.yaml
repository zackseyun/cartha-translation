  text: וְ/לַ/עֲמֹד֙ בַּ/בֹּ֣קֶר בַּ/בֹּ֔קֶר לְ/הֹד֥וֹת וּ/לְ/הַלֵּ֖ל לַ/יהוָ֑ה וְ/כֵ֖ן לָ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/030.yaml
  text: and to stand every morning to give thanks and to praise Yahweh[a], and likewise at evening,
translation:
  language: zh_hans
  text: 又要每天早晨[a]站立，感谢、赞美雅威；晚上也要这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“早晨复早晨”，表示每天固定履行的职责。
    reason: 说明原文重复结构及其逐日、惯常的含义。
lexical_decisions:
- source_word: וְ/לַ/עֲמֹד
  choice: 又要……站立
  rationale: 不定式承接上文所述的职分与职责；保留“站立”这一具体动作，也符合正式敬拜的场景。
- source_word: בַּ/בֹּקֶר בַּ/בֹּקֶר
  choice: 每天早晨
  rationale: 原文重复“早晨”，具有逐日、惯常的分配意义；“每天早晨”是自然清楚的现代汉语表达。
- source_word: לְ/הֹדֹות
  choice: 感谢
  rationale: ידה 的使役形在敬拜语境中通常指向神献上感谢，与下文“赞美”并列。
- source_word: וּ/לְ/הַלֵּל
  choice: 赞美
  rationale: הלל 的加强形直接表示赞美；不额外加入原文未明说的歌唱含义。
- source_word: לַ/יהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名 יהוה，保留经文直接使用神圣名号这一特点。
- source_word: וְ/כֵן
  choice: 也要这样
  rationale: 表明晚上同样履行早晨所述的感谢与赞美职责。
- source_word: לָ/עָרֶב
  choice: 晚上
  rationale: 自然表达与早晨相对应的时间，且不增添“临近傍晚”等原文没有明确要求的时间色彩。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”可让读者看出这是神的专名，而不是普通称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“又要”承接上文的职责清单；分号清楚呈现早晚对应关系。
