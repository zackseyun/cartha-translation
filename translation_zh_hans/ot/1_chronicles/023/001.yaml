base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/001.yaml
  text: David was old and full of days[a], and he made his son Solomon king over Israel.
translation:
  language: zh_hans
  text: 大卫年老，寿数满足[a]，就立他儿子所罗门作以色列的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“年事已高”；直译“日子满足”。
    reason: 说明וְשָׂבַע יָמִים可按高龄习语理解，并保留其字面表达；不把“寿终”或死亡等原文此处未明说的含义加进正文。
lexical_decisions:
- source_word: זָקֵן
  choice: 年老
  rationale: 直接表达大卫已经衰老的状态，简洁自然，符合叙事语体。
- source_word: וְשָׂבַע יָמִים
  choice: 年事已高
  rationale: 希伯来语字面为“日子满足/饱足”，是表示活到高龄的习语。正文采用现代汉语的自然表达，脚注保留字面意象。
- source_word: וַיַּמְלֵךְ
  choice: 立……作王
  rationale: 使役形表示大卫使所罗门登上王位；“立……作王”保留使役意义，又不额外加入加冕仪式等细节。
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: 他儿子所罗门
  rationale: 保留原文明确的父子关系，并采用自然的现代汉语语序。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列的王
  rationale: עַל在君王统治语境中表示治理的对象；汉语以“作以色列的王”自然表达“统治以色列”，且不添加原文没有的“全”。
- source_word: וְ / וַ
  choice: ，……就
  rationale: 首个连接词不机械译为“现在”或“于是”；后续叙事推进用“就”自然呈现事件承接。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“年老，年事已高”有意保留原文两个并列年龄表述所形成的强调；“立……作王”符合历史叙事语域。
