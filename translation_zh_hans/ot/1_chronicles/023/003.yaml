  yaml_path: translation/ot/1_chronicles/023/003.yaml
  text: The Levites were counted from thirty years old and upward[a], and their number by heads, man by man, was thirty-eight thousand.
translation:
  language: zh_hans
  text: 利未人中，三十岁及以上的男丁被数点；按人头计算，共三万八千人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“按他们的头颅，按男子”；这个说法表示逐一清点成年男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּפְרוּ
  choice: 被数点
  rationale: 该动词为尼法勒式，利未人是接受清点者；“数点”自然地保留了人口登记与清点的语义。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 采用现代中文圣经语境中通行的族群名称。
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמָעְלָה
  choice: 凡三十岁以上的
  rationale: 准确表达从三十岁起算的年龄下限，也符合现代汉语习惯。
- source_word: לְגֻלְגְּלֹתָם
  choice: 按人头逐一统计
  rationale: 原词字面指“按他们的头颅”，在此是逐人清点的惯用表达；译文保留“人头”的具体意象，并说明逐一统计之意。
- source_word: לִגְבָרִים
  choice: 男丁
  rationale: 该词明确指成年男性；“男丁”简洁保留性别与人口统计语境。
- source_word: שְׁלֹשִׁים וּשְׁמוֹנָה אָלֶף
  choice: 三万八千人
  rationale: 直接、清楚地呈现原文总数，并补出中文计数所需的量词。
