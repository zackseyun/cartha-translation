base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/011.yaml
  text: Jahath was the first and Zizah the second[a]; Jeush and Beriah did not have many sons[b], so they became one father’s house for one reckoning.
translation:
  language: zh_hans
  text: 雅哈居第一，细撒居第二[a]；耶乌施和比利亚的儿子不多，因此他们合为一个父家，算作一组[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细撒”按希伯来语人名音译；也有译作“西撒”。
    reason: lexical_alternative
  - marker: b
    text: “合为一个父家，算作一组”也可译作“归为一个父家，作为一次核计”。原文指他们作为一个父系家族单位一同核计或编组。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יַחַת הָרֹאשׁ
  choice: 雅哈居第一
  rationale: הָרֹאשׁ字面可指“为首的”或“首领”，但此处与“第二”对应，最自然地表示次序；用“居第一”既保留排序含义，也避免误断为年龄上的长子。
- source_word: וְזִיזָה הַשֵּׁנִי
  choice: 西撒居第二
  rationale: זִיזָה按希伯来语读音译作“西撒”；הַשֵּׁנִי是明确的序数词，译为“居第二”。
- source_word: וִיעוּשׁ וּבְרִיעָה
  choice: 耶乌施和比利亚
  rationale: 两个人名按常见现代中文圣经音译处理。
- source_word: לֹא הִרְבּוּ בָנִים
  choice: 儿子不多
  rationale: 原文直译为“没有增多儿子”，是指他们所生或所有的儿子人数不多；保留בָנִים明确的男性所指，不泛化为“儿女”或“子孙”。
- source_word: וַיִּהְיוּ לְבֵית אָב
  choice: 他们合成一个父家
  rationale: וַיִּהְיוּ在此表达由儿子不多而形成的结果；בֵּית אָב是以父系亲属关系构成的家族组织单位，译作“父家”以保留其制度性用语。
- source_word: לִפְקֻדָּה אֶחָת
  choice: 登记为一个单位
  rationale: פְּקֻדָּה在本段利未人编组的语境中涉及点名、核计或编制。译文用“登记为一个单位”表达两支被合并核算的行政结果，同时以脚注保留“编为一班”等可能理解。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“父家”是本段家族编制中的必要术语，虽略具书面色彩，但比“家庭”更准确；后接“登记为一个单位”，帮助普通读者理解其行政含义。
