  yaml_path: translation/ot/1_chronicles/023/009.yaml
  text: 'The sons of Shimei: Shelomoth[a], Haziel, and Haran—three. These were the heads of the fathers’ houses of Ladan.'
translation:
  language: zh_hans
  text: 示每的儿子：示罗末[a]、哈薛和哈兰，共三人。这些人是拉但的父家首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“示罗密”，这是这个名字常见的另一种音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעִי
  choice: 示每的儿子
  rationale: 在这份家谱中，בְּנֵי 后面紧接三个具体人名，译作“儿子”比泛指“后裔”更贴切；שִׁמְעִי 按希伯来语人名音译为“示每”。
- source_word: שלמות
  choice: 示罗末
  rationale: 按本节所保存的辅音形式及其在此家谱语境中的读法音译，保留其与另一常见读法之间的区别；另一音译“示罗密”列入脚注。
- source_word: וַחֲזִיאֵל
  choice: 哈薛
  rationale: 直接按 חֲזִיאֵל 音译，不混同于别处形式不同的相关人名。
- source_word: וְהָרָן
  choice: 和哈兰
  rationale: 忠实表达连接词，并采用现代中文圣经中清楚易认的人名音译。
- source_word: שְׁלֹשָׁה
  choice: 共三人
  rationale: 原文明确总结人数；“共三人”既保留这一信息，也符合现代汉语列举后的表达习惯。
- source_word: אֵלֶּה רָאשֵׁי הָאָבוֹת
  choice: 他们是……各父家的首领
  rationale: רָאשֵׁי 在家谱和宗族组织语境中指居首或代表性人物；“父家”保留父系家族单位的含义，避免笼统译成“家庭”。
- source_word: לְלַעְדָּן
  choice: 拉但宗族
  rationale: 介词 לְ 在此表示归属或谱系关系；译作“拉但宗族”自然呈现这些首领属于拉但一系。
