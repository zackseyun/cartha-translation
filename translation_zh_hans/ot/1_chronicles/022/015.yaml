base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/015.yaml
  text: 'And with you in abundance are workers for the task: stonecutters[a], and craftsmen of stone and wood, and every skilled man for every kind of work.'
translation:
  language: zh_hans
  text: 你那里有许多做工的人：凿石工、石匠、木匠，以及每一个精通各样工作的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精通……的人”原文为阳性单数，直译可作“每一个熟练的人”；此处是概括性说法，指熟练的工人。
    reason: 说明原文阳性单数的语法形式及其在本节工匠语境中的代表性用法。
lexical_decisions:
- source_word: וְעִמְּךָ לָרֹב
  choice: 你那里有许多
  rationale: 保留“与你同在／在你那里”的直接指向，并以自然汉语表达数量众多。
- source_word: עֹשֵׂי מְלָאכָה
  choice: 做工的人
  rationale: 该短语指承担建造工程的劳动者；译法简明，并与后文具体工种衔接。
- source_word: חֹצְבִים
  choice: 凿石工
  rationale: 原词本义为凿削者；在圣殿建造语境中，所凿的是石料，因此补明为“凿石工”。
- source_word: וְחָרָשֵׁי אֶבֶן וָעֵץ
  choice: 石匠、木匠
  rationale: חָרָשׁ 指熟练工匠；按所加工的石材和木材分别译为现代汉语常用的职业名称。
- source_word: וְכָל חָכָם בְּכָל מְלָאכָה
  choice: 以及精通各样工艺的人
  rationale: חָכָם 在此表示实际技艺上的熟练，而非抽象智慧；“各样工艺”体现 בְּכָל מְלָאכָה 所涵盖的各种工作。
theological_decisions:
- issue: חָכָם 的阳性单数形式与代表性用法
  choice: 精通各样工艺的人
  alternative: 精通各样工艺的男子
  rationale: 希伯来语采用阳性单数的实体化形容词，但在工匠名单中可作代表性、集合性表达。现代汉语“人”既保留所指，又不把语法性别擅自解释为仅限男性；脚注说明原文形式。
translation_notes:
  register: 采用现代、庄重而通顺的叙述语体。“你那里有许多”自然表达原文的临在与数量；以冒号引出工种清单。“石匠、木匠”比“加工石木的工匠”更符合普通读者的用语习惯。
