revisions:
- from: 大卫说：“我儿所罗门还年轻，经验不足；要为雅威建造的殿宇必须宏伟无比，在万国中享有盛名，尽显荣美。[a]所以，我要为它预备材料。”于是，大卫在去世以前预备了大量材料。
  to: 大卫说：“我儿所罗门还年轻，经验不足；要为雅威建造的殿宇必须建得极其宏伟，好在万国中得名声和荣美。现在我要为此预备。”于是，大卫在去世以前作了大量预备。
  rationale: 删除原文未明示的“材料”，以“为此预备”和“作了大量预备”忠实保留预备对象的概括性。将关于名声和荣美的表达调整为“好在万国中得名声和荣美”，使范围修饰更清晰，并以“好”自然承载原文介词短语可有的目的/结果语义；不把其神学或逻辑关系过度定式化。
