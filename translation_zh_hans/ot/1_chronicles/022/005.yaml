  text: וַ/יֹּ֣אמֶר דָּוִ֗יד שְׁלֹמֹ֣ה בְנִ/י֮ נַ֣עַר וָ/רָךְ֒ וְ/הַ/בַּ֜יִת לִ/בְנ֣וֹת לַ/יהוָ֗ה לְ/הַגְדִּ֨יל לְ/מַ֜עְלָ/ה לְ/שֵׁ֤ם וּ/לְ/תִפְאֶ֨רֶת֙ לְ/כָל הָ֣/אֲרָצ֔וֹת אָכִ֥ינָה נָּ֖א ל֑/וֹ וַ/יָּ֧כֶן דָּוִ֛יד לָ/רֹ֖ב לִ/פְנֵ֥י מוֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
translation:
  language: zh_hans
  text: 大卫说：“我儿所罗门还年轻，经验不足；要为雅威建造的殿宇必须建得极其宏伟，好在万国中得名声和荣美。现在我要为此预备。”于是，大卫在去世以前作了大量预备。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעַר וָרָךְ
  choice: 还年轻，经验不足
  rationale: נַעַר表示相对年轻；רַךְ本义为柔嫩、稚嫩，在此与“年轻”并列，并解释大卫为何预先筹备，语境上指尚不成熟、缺乏经验。
- source_word: הַבַּיִת
  choice: 殿宇
  rationale: 原文直译为“房屋”，但此处明确指为雅威建造的圣所。“殿宇”既自然庄重，也保留“建筑/居所”的意象；脚注注明直译。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 以“雅威”音译四字神名יהוה，保留其作为专名的性质。
- source_word: לְהַגְדִּיל לְמַעְלָה
  choice: 必须宏伟无比
  rationale: 该组合表达极强的程度，形容所建殿宇规模、地位或气象非凡；“宏伟无比”符合汉语建筑语境。
- source_word: לְשֵׁם וּלְתִפְאֶרֶת לְכָל הָאֲרָצוֹת
  choice: 在万国中享有盛名，尽显荣美
  rationale: 保留“名声”与“荣美”两方面，并把לְכָל הָאֲרָצוֹת自然理解为声名和荣美所及的各地；目的、结果之间的语义张力不宜过度限定。
- source_word: אָכִינָה נָּא לוֹ
  choice: 所以，我要为它预备材料
  rationale: 意愿式表达大卫的决心；לוֹ可指殿宇或建殿工程。结合下文所列建材，汉语补出“材料”，使所预备之物明确自然。
- source_word: וַיָּכֶן דָּוִיד לָרֹב
  choice: 于是，大卫……预备了大量材料
  rationale: לָרֹב表示数量丰厚；结合上下文，以“大量材料”表达大卫为建殿所作的物质准备。
- source_word: לִפְנֵי מוֹתוֹ
  choice: 在去世以前
  rationale: 直接保留时间关系，叙事表达自然庄重。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名，音译“雅威”最直接地保留专名性质，不以称号替代。
- issue: הַבַּיִת应直译还是按所指翻译
  choice: 正文作“殿宇”，脚注注明直译“房屋”
  alternative: 房屋／圣殿
  rationale: 上下文清楚指向献给雅威的圣所；“殿宇”在现代汉语中庄重清楚，同时脚注保留原词的居所意象。
- issue: לְשֵׁם וּלְתִפְאֶרֶת的目的或结果关系
  choice: 在万国中享有盛名，尽显荣美
  alternative: 为要在万国中得名声和荣耀
  rationale: 介词לְ可表达目的、结果或所达到的状态；正文采用不僵硬限定逻辑关系的汉语表述，脚注保留较形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“殿宇”“宏伟无比”“尽显荣美”适合建殿语境，又避免过度古雅；句法按汉语重组，但保留原文因果推进和末句总结。
