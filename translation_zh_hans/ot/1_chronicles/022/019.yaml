  to: 现在，你们要全心全意地寻求耶和华你们的神[a]。起来，建造耶和华神的圣所，以便把耶和华的约柜和神的圣器皿带进那将为耶和华的名建造的殿中[b]。
  rationale: 修订脚注a中不够准确的“交出来”，并以自然正文配合脚注保留“心和性命”的原文形式及נפשׁ的歧义。末句改用“带进”，且明确殿宇尚待为耶和华的名建造；其余关键术语与句法关系维持不变。
