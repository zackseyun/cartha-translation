source:
  edition: WLC
  text: עַתָּ֗ה תְּנ֤וּ לְבַבְ/כֶם֙ וְ/נַפְשְׁ/כֶ֔ם לִ/דְר֖וֹשׁ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/ק֗וּמוּ וּ/בְנוּ֙ אֶת מִקְדַּשׁ֙ יְהוָ֣ה הָֽ/אֱלֹהִ֔ים לְ/הָבִ֞יא אֶת אֲר֣וֹן בְּרִית יְהוָ֗ה וּ/כְלֵי֙ קֹ֣דֶשׁ הָֽ/אֱלֹהִ֔ים לַ/בַּ֖יִת הַ/נִּבְנֶ֥ה לְ/שֵׁם יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/019.yaml
  text: Now set your heart and your soul to seek Yahweh your God[a]. Rise up and build the sanctuary of Yahweh God[b], to bring the ark of the covenant of Yahweh and the holy vessels of God into the house that is to be built for the name of Yahweh.
translation:
  language: zh_hans
  text: 现在，你们要全心全意地寻求耶和华你们的神[a]。起来，建造耶和华神的圣所，以便把耶和华的约柜和神的圣器皿带进那将为耶和华的名建造的殿中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“把你们的心和性命献于寻求耶和华你们的神。”这里“性命”也可指“自己”或整个人。
    reason: 说明原文“心”和נפשׁ的并列措辞，并保留נפשׁ在此处“性命／自己”的语义弹性。
  - marker: b
    text: 原文“殿”直译为“房屋”；在此指将为耶和华的名建造的圣殿建筑。
    reason: 说明בַּיִת的字面义及其在本节语境中所指，同时保留“为耶和华的名”的表达。
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 既是时间副词，也是引出迫切劝勉的话语标记；“现在”直接自然。
- source_word: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם
  choice: 立定心志，一心一意
  rationale: 原文直译为“把你们的心和生命（自己）交出来”。此处指全心投入并坚定决意；正文采用现代汉语惯用表达，脚注保留原文双重措辞。
- source_word: לִדְרוֹשׁ
  choice: 寻求
  rationale: דרשׁ以神为宾语时，常指带着敬虔、倚靠而寻求他；“寻求”保留其宽广含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式来表达四字神名，不以“主”替代。
- source_word: וְקוּמוּ וּבְנוּ
  choice: 起来，建造
  rationale: 保留两个连续的命令及其激励性的庄重语气。
- source_word: מִקְדַּשׁ
  choice: 圣所
  rationale: 该词指分别为圣的神圣居所；“圣所”比单译“圣殿”更贴近词义，也与后文的“殿”形成原文所有的用词区别。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 耶和华的约柜
  rationale: 自然表达原文属格链，指承载耶和华之约相关法版的柜。
- source_word: כְלֵי קֹדֶשׁ הָאֱלֹהִים
  choice: 神的圣器皿
  rationale: כְּלִי可泛指器具、用具；在圣殿语境中，“圣器皿”简洁庄重，并表达这些器物的圣用性质。
- source_word: לַבַּיִת הַנִּבְנֶה לְשֵׁם יְהוָה
  choice: 搬进那座为耶和华的名而建的殿里
  rationale: “殿”按上下文表达בַּיִת所指的圣殿建筑；“为……的名”保留希伯来语的神学表达，不改写为单纯“献给”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名。中文正文用“耶和华”保留专名性质，也符合普通现代中文圣经读者的识别习惯；不用“主”取代原名。
- issue: “心”和“生命／自己”的双重表达
  choice: 正文译为“立定心志，一心一意”，脚注给出较直译形式
  alternative: 把你们的心和生命都交出来；全人投入
  rationale: 该并列表达强调全心寻求神，而非建立严格的二分人论。正文使用自然汉语表达其整体力度，脚注让读者看见原文形式，避免将其教义化。
- issue: “为耶和华的名而建”
  choice: 保留“名”的表达
  alternative: 为耶和华而建；献给耶和华
  rationale: “名”在此具有代表神临在、权柄与声誉的丰富含义；保留原文可避免把这种神学张力缩减为普通的奉献关系。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“立定心志，一心一意”自然传达全然投入；“圣所”“约柜”“圣器皿”“为……的名而建”保留经文核心宗教用语。两个脚注标记均已置于正文对应位置。
