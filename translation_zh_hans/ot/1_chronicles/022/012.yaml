  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֣ךְ יִֽתֶּן לְּ/ךָ֤ יְהוָה֙ שֵׂ֣כֶל וּ/בִינָ֔ה וִֽ/יצַוְּ/ךָ֖ עַל יִשְׂרָאֵ֑ל וְ/לִ/שְׁמ֕וֹר אֶת תּוֹרַ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/012.yaml
  text: Only[a], may Yahweh give you insight and understanding, and command you concerning Israel[b], that you may keep the law of Yahweh your God.
translation:
  language: zh_hans
  text: 惟愿雅威赐你明智和悟性，委派你治理以色列[a]，使你谨守雅威你上帝的律法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“吩咐你有关以色列的事”，也可理解为“使你负责以色列”。
    reason: lexical_alternative
  - marker: b
    text: “律法”也可译作“训诲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 惟愿
  rationale: 此处是聚焦语气，并与后面的祝愿式未完成体相连；“惟愿”自然表达“大卫最要紧的愿望”，而不把它误作单纯转折。
- source_word: יִתֶּן
  choice: 愿……赐
  rationale: 该未完成体在语境中带有祝愿、祈求意味；现代汉语用“愿……赐”最为自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留原文所用的立约之名。
- source_word: שֵׂכֶל וּבִינָה
  choice: 明智和悟性
  rationale: שֵׂכֶל偏重处事所需的明智、见识，בִינָה偏重理解与辨别能力；用两个相近但不相同的词保留原文并列。
- source_word: וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: 委派你治理以色列
  rationale: צוה通常表示“吩咐”，但与עַל及百姓连用，并置于所罗门将要作王的语境中，可表示授予管理职责。“委派你治理”符合该语境，同时以脚注保留更直接的词义可能。
- source_word: וְלִשְׁמוֹר
  choice: 使你谨守
  rationale: 连接词加不定式在这里表达目的或结果；“使你谨守”清楚连接上文所赐的明智、悟性和治理职责。
- source_word: תּוֹרַת
  choice: 律法
  rationale: תורה既可指教导，也可指上帝赐下的律法；本节的立约语境适合译作“律法”，并在脚注保留“训诲”这一语义。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 保留第二人称单数所属关系，直接对应对所罗门的称呼。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代常见音译保留专名性质，不以称号替代。
- issue: וִיצַוְּךָ עַל יִשְׂרָאֵל在君王语境中的含义
  choice: 委派你治理以色列
  alternative: 吩咐你有关以色列的事；使你负责以色列
  rationale: 治理或委派的理解切合大卫嘱咐所罗门的君王语境，但动词本身通常有“吩咐”义，因此不将另一理解从译文资料中删除，而以脚注注明。
- issue: תורה的语义范围
  choice: 律法
  alternative: 训诲
  rationale: “律法”符合本节谨守上帝所赐规范的语境；“训诲”仍是该词真实可能的含义，故列入脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“惟愿”保留祝愿与聚焦语气；“明智和悟性”避免两个智慧词完全合并；句式简洁，适合普通读者朗读和理解。
