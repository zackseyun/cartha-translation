base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/006.yaml
  text: Then he called for Solomon his son and commanded him to build a house for Yahweh[a], the God of Israel.
translation:
  language: zh_hans
  text: 于是，他召来儿子所罗门，命令他为雅威——以色列的上帝——建造一所房屋[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“房屋”；按本处语境，也可译为“圣殿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לִשְׁלֹמֹה
  choice: 于是，他召来……所罗门
  rationale: 叙事性连接词推动事件向前发展，译作“于是”符合现代汉语叙事习惯；קרא 与介词 ל 连用，在这里表示召唤某人前来，“召来”简洁自然。
- source_word: בְנוֹ
  choice: 自己的儿子
  rationale: 该词说明所罗门是前文人物的儿子；“自己的儿子”既明确所属关系，也避免误读。
- source_word: וַיְצַוֵּהוּ
  choice: 吩咐他
  rationale: צוה 表示带权威地命令或嘱咐。“吩咐”在现代汉语中自然、庄重，并保留其权威意味。
- source_word: לִבְנוֹת
  choice: 建造
  rationale: 不定式说明吩咐的内容，即进行建造。
- source_word: בַּיִת
  choice: 一座殿宇
  rationale: בַּיִת 字面为“房屋”，在本处特指献给上帝的圣殿建筑。“殿宇”能让现代读者自然理解其语境所指，同时脚注保留字面信息。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词 ל 在此表示建筑是为雅威而建、归于雅威；“为”最符合现代汉语表达。神名 יהוה 采用“雅威”，以音译保留专名性质。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 准确表达构造关系，并明确雅威就是以色列的上帝。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，正文采用较贴近 Yahweh 读音的“雅威”，保留其作为专名的性质；“耶和华”是传统音译，“上主”则是尊称替代译法。
- issue: בַּיִת 在圣殿语境中的表达
  choice: 殿宇
  alternative: 房屋；圣殿
  rationale: “房屋”最贴近字面，却容易使现代读者误以为普通住宅；“圣殿”意义明确但解释性更强。“殿宇”兼顾原词的一般建筑含义及本段的敬拜语境，脚注则说明字面译法。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。保留原文第三人称“他”，不在本节擅自补出“大卫”；以破折号标明“以色列的上帝”是对“雅威”的同位说明。
