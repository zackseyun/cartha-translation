base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/007.yaml
  text: And David said to Solomon his son[a], “As for me[b], it was in my heart to build a house for the name of Yahweh my God.”
translation:
  language: zh_hans
  text: 大卫对儿子所罗门说：“我呢，心里本来有意[a]为雅威——我的上帝——的名建造一座殿宇[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我心里有这个心意”或“我本有意”。原文是“在我心里”的习语，表示内在的意愿或决心。
    reason: lexical_alternative
  - marker: b
    text: “殿宇”原文直译为“房屋”；这里指为雅威的名所建的圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出连接词וַ，因现代汉语叙事中直接用“说”即可自然承接上文，又不额外限定为“于是”或“所以”所表达的关系。
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: 对儿子所罗门
  rationale: 准确表达所罗门是大卫的儿子，也符合现代汉语自然语序。
- source_word: אֲנִי
  choice: 我呢
  rationale: 独立人称代词带有一定强调；“我呢”自然体现这种话题突出，而不作过度强化。
- source_word: הָיָה עִם לְבָבִי
  choice: 心里本来有意
  rationale: 该希伯来语习语表示内在的意愿或打算。“心里”保留原文意象，“有意”传达意图，“本来”结合未完成之计划的语境自然表达其先前存在。
- source_word: לִבְנוֹת בַּיִת
  choice: 建造一座殿宇
  rationale: בַּיִת字面为“房屋”，在本节明确指献给上帝的圣殿。正文用“殿宇”避免现代读者误解为普通住宅，并以脚注保留字面表达。
- source_word: לְשֵׁם
  choice: 为……的名
  rationale: 保留原文“为其名”的圣约与敬拜用语，不将其简化为单纯的“为……建造”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不是以“主”这一称号替代。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 保留第一人称单数所属后缀，表达大卫所说的“我的上帝”。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”较贴近YHWH的通行学术重构，并明确将其作为专名呈现；不以称号“主”取代。
- issue: בַּיִת应译作“房屋”还是“殿宇”
  choice: 殿宇
  alternative: 房屋；圣殿
  rationale: 原词字面义是“房屋”，但本处所指是为雅威之名建造的圣所。“殿宇”在现代汉语中清楚自然，同时不如“圣殿”那样完全以解释性专称替换原词；字面义在脚注中注明。
- issue: 是否保留“为雅威的名”这一表达
  choice: 保留“为雅威……的名”
  alternative: 为雅威建造
  rationale: “名”在本句中具有重要的神学与敬拜含义。保留原文措辞，避免把“名”所承载的临在、归属与奉献意味压平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我呢”体现原文显式人称代词的强调；破折号将“我的上帝”标示为对“雅威”的说明，也避免“雅威我的上帝”在汉语中的生硬感。脚注标记均置于正文相应词语之后。
