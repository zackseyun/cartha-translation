source:
  edition: WLC
  text: וְ/הִנֵּ֨ה בְ/עָנְיִ֜/י הֲכִינ֣וֹתִי לְ/בֵית יְהוָ֗ה זָהָ֞ב כִּכָּרִ֤ים מֵֽאָה אֶ֨לֶף֙ וְ/כֶ֗סֶף אֶ֤לֶף אֲלָפִים֙ כִּכָּרִ֔ים וְ/לַ/נְּחֹ֤שֶׁת וְ/לַ/בַּרְזֶל֙ אֵ֣ין מִשְׁקָ֔ל כִּ֥י לָ/רֹ֖ב הָיָ֑ה וְ/עֵצִ֤ים וַ/אֲבָנִים֙ הֲכִינ֔וֹתִי וַ/עֲלֵי/הֶ֖ם תּוֹסִֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/014.yaml
  text: Behold[a], in my affliction I have prepared for the house of Yahweh one hundred thousand talents of gold, and one million talents of silver; and for the bronze and the iron there is no weighing, for it was in abundance. I have prepared timber and stones[c][b], and you may add to them.
translation:
  language: zh_hans
  text: 看哪，我在困苦[a]中为耶和华的殿预备了十万他连得金子、一百万他连得银子[b]；至于铜和铁，多得无法称量。我也预备了木料和石料；你还可以增添[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦”也可译作“贫困”。希伯来语可指苦难、艰难或贫穷。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文直译为“一千个一千”。
    reason: lexical_alternative
  - marker: c
    text: “可以增添”也可译作“要增添”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注意、强调下文的语用功能；不添加原文没有明确表达的时间副词“现在”。
- source_word: בְעָנְיִי
  choice: 我在困苦中
  rationale: עֳנִי 可指苦难、艰难或贫困；此处选择较宽泛的“困苦”，既可涵盖艰难处境，也不把含义限定为经济贫穷。
- source_word: הֲכִינוֹתִי
  choice: 我……预备了
  rationale: כון 的使役式在此表示预备、备妥；完成体表达大卫已完成且可供所罗门使用的准备。
- source_word: לְבֵית יְהוָה
  choice: 为耶和华的殿
  rationale: בַּיִת 字面为“房屋”，在此明确指将建造的圣殿；现代中文用“耶和华的殿”自然、庄重，并保留神名。
- source_word: כִּכָּרִים
  choice: 他连得
  rationale: כִּכָּר 是古代大重量单位，采用中文圣经语境中通行的音译“他连得”，避免以不确定的现代重量换算替代原文。
- source_word: מֵאָה אֶלֶף
  choice: 十万
  rationale: 直接表达原文数值。
- source_word: אֶלֶף אֲלָפִים
  choice: 一百万
  rationale: 原文直译为“一千个一千”，现代中文以“一百万”清楚表达同一数值；字面形式在脚注说明。
- source_word: וְלַנְּחֹשֶׁת וְלַבַּרְזֶל אֵין מִשְׁקָל כִּי לָרֹב הָיָה
  choice: 至于铜和铁，多得无法称量
  rationale: אֵין מִשְׁקָל 字面是“没有称量/重量”，后句说明原因在于数量极多；译文合并为自然中文，同时避免使人误解为铜铁没有重量。
- source_word: וְעֵצִים וַאֲבָנִים הֲכִינוֹתִי
  choice: 我也预备了木料和石料
  rationale: עֵצִים 在建筑语境中译作“木料”；重复的 הֲכִינוֹתִי 予以明译，“也”自然承接前述材料。
- source_word: וַעֲלֵיהֶם תּוֹסִיף
  choice: 你还可以增添
  rationale: 未完成式可理解为将来陈述、许可或带命令色彩的嘱咐；正文用较温和且符合语境的“可以”，另在脚注保留命令式理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用读者熟悉且庄重的传统专名“耶和华”，而不以“主”替代神名；“雅威”是另一种可能的音译。
- issue: וַעֲלֵיהֶם תּוֹסִיף 的语气
  choice: 你还可以增添
  alternative: 你还要增添
  rationale: 希伯来语未完成式在这一嘱咐语境中可带许可或命令意味；正文不把语气强化为绝对命令，脚注保留较强读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。数量用现代中文数词表达，古代重量单位保留传统音译。正文脚注标记依相关词句顺序排列，并保留 בְעָנְיִי 的词义幅度及 תּוֹסִיף 的语气张力。
