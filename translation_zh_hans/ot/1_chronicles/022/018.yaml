base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/018.yaml
  text: Is not Yahweh your God with you? And has he not given you rest on every side? For he has given the inhabitants of the land into my hand[a], and the land has been subdued before Yahweh and before his people.
translation:
  language: zh_hans
  text: 耶和华你们的上帝岂不是与你们同在吗？他岂不是使你们四境安宁吗？因为他已把这地的居民交在我手中，这地也已在耶和华面前、在他的百姓[a]面前被制伏了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”较可能指耶和华；也有人理解为指大卫。
    reason: 说明原文第三人称单数代词的指代存在可能的歧义。
lexical_decisions:
- source_word: הֲלֹא
  choice: 不是……吗
  rationale: 保留期待肯定回答的反问语气，并使整句符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名在现代汉语中的通行形式，不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 在“耶和华”的限定和以色列信仰语境中，该形式指独一的上帝。
- source_word: עִמָּכֶם
  choice: 与你们同在
  rationale: 既表达临在，也含有支持、帮助之意；这是汉语圣经语体中自然清楚的说法。
- source_word: וְהֵנִיחַ לָכֶם מִסָּבִיב
  choice: 使你们四境安宁
  rationale: הניח在此指使人脱离周围仇敌而得安歇；“四境安宁”简洁地传达四面都得安息的含义。
- source_word: כִּי
  choice: 因为
  rationale: 引出前面反问所作断言的根据。
- source_word: נָתַן בְּיָדִי
  choice: 交在我手中
  rationale: 保留希伯来语“交在手中”的权势意象，同时符合自然汉语。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: 这地的居民
  rationale: 准确表达居住在该地的人；“这地”符合当前所指土地的语境。
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: 这地也……被制伏了
  rationale: 被动式对应נפעל词干，表达土地已被置于控制之下的完成结果。
- source_word: לִפְנֵי יְהוָה וְלִפְנֵי עַמּוֹ
  choice: 在耶和华和他百姓面前
  rationale: 保留两个לִפְנֵי形成的平行结构，并不将其解释性改写为“借着”或“归服于”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文读者最熟悉且可辨识为专名的通行译法，并保留原文的神名而非以“主”替代。
- issue: עַמּוֹ中第三人称单数代词的所指
  choice: 译作“他百姓”，正文不明说所指，并以脚注说明
  alternative: 明确译作“耶和华的百姓”或“大卫的百姓”
  rationale: 语境较自然地指向耶和华，但形式上也可能被理解为大卫；保留代词并加注可保存原文可能存在的指代张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“四境安宁”凝练地传达从四周仇敌中得安息；整体保留反问、因果关系及末句的平行结构。
