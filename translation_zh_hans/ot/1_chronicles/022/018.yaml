revisions:
- from: 你们的上帝耶和华不是与你们同在，使你们四境安宁吗？因为他已把这地的居民交在我手中，这地也在耶和华和他百姓[a]面前被制伏了。
  to: 耶和华你们的上帝岂不是与你们同在吗？他岂不是使你们四境安宁吗？因为他已把这地的居民交在我手中，这地也已在耶和华面前、在他的百姓[a]面前被制伏了。
  rationale: 修订使两个由原文反问引出的并列分句在现代汉语中清楚自然，并补足“他的百姓”的必要结构助词。末句重复“在”以反映原文两个平行的介词短语；脚注继续保留“他”的指代歧义，未作教义性裁定。
