base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/002.yaml
  text: And David ordered the foreigners who were in the land of Israel to be gathered[c][b][a], and he appointed stonecutters to cut dressed stones for building the house of God.
translation:
  language: zh_hans
  text: 大卫下令召集住在以色列地的外来居民[a]，又指派凿石工人凿制修整过的石料[b]，用来建造上帝的殿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“寄居者”或“外族居民”。希伯来文指住在当地的非以色列人。
    reason: lexical_alternative
  - marker: b
    text: 或译“凿好的石料”或“切割好的石头”。
    reason: lexical_alternative
  - marker: c
    text: 即将要建造的圣殿。
    reason: referent_clarification
lexical_decisions:
- source_word: וַיֹּאמֶר ... לִכְנוֹס
  choice: 下令召集
  rationale: וַיֹּאמֶר字面为“说”，但与表示行动内容的不定式连用，在这里具有发出指令的语用力量。“下令召集”既自然，也避免让人误以为大卫亲自召集众人。
- source_word: הַגֵּרִים
  choice: 外族居民
  rationale: גֵּרִים指居住在以色列境内、却不属于本地以色列群体的人。“外族居民”比“寄居者”更容易让现代读者明白其常住而非仅仅短暂停留的身份，同时保留其外来者性质。
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: 住在以色列地
  rationale: 明确译出אֶרֶץ“地”，并以现代汉语自然表达其居住地点。
- source_word: וַיַּעֲמֵד
  choice: 指派
  rationale: 该动词在此表示设立或安排工人承担任务；“指派”准确体现行政安排。
- source_word: חֹצְבִים
  choice: 石匠
  rationale: 该分词指从事凿石工作的人。“石匠”简明自然，符合建筑语境。
- source_word: לַחְצוֹב
  choice: 凿制
  rationale: 保留凿石动作，并用“制”体现石料经过加工以供建筑使用。
- source_word: אַבְנֵי גָזִית
  choice: 方石
  rationale: גָזִית指经过凿削、修整的建筑石材。“方石”是简洁而有尊严的中文表达；脚注补充其他可行译法。
- source_word: לִבְנוֹת
  choice: 用来建造
  rationale: 清楚表达希伯来文不定式所表示的目的。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  rationale: בֵּית字面为“房屋、家”，但在此建筑及敬拜语境中指献给上帝的殿宇。“上帝的殿”在现代中文中自然清楚，脚注说明具体所指。
theological_decisions:
- issue: בֵּית הָאֱלֹהִים的译法
  choice: 上帝的殿
  alternative: 上帝的家；上帝的殿宇；上帝的圣殿
  rationale: 希伯来文直译为“上帝的房屋／家”，实际所指是即将建造的圣殿。主文采用中文宗教建筑语境中自然的“殿”，但不直接加入原文没有的“圣”字；脚注交代其具体所指，以兼顾源文措辞与读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“外族居民”避免“外侨”等行政色彩过强的用语；“方石”保持建筑语境的凝练。“上帝”作为אֱלֹהִים的通行中文称谓，句式按希伯来文两项连续行动展开。
