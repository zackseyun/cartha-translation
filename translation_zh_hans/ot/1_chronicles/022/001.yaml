  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד זֶ֣ה ה֔וּא בֵּ֖ית יְהוָ֣ה הָ/אֱלֹהִ֑ים וְ/זֶה מִּזְבֵּ֥חַ לְ/עֹלָ֖ה לְ/יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/001.yaml
  text: Then David said[a], “This is the house of Yahweh God[b], and this is the altar for burnt offering for Israel.”
translation:
  language: zh_hans
  text: 大卫说：“这就是雅威上帝的殿[a]，这就是为以色列献燔祭用的祭坛[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“雅威上帝的房屋（或家）”；这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: “燔祭”在希伯来文中为单数，也可泛指这一类祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来语叙事中的连续式承接上文、推进事件；现代汉语在此不必机械译出“于是”或“然后”，用“说”即可自然表达叙事承接。
- source_word: דָּוִיד
  choice: 大卫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: זֶה הוּא
  choice: 这就是
  rationale: 指示词加独立代词构成强调性的确认。“这就是”既保留现场指示，也体现强调语气，不增添“地方”等原文没有的名词。
- source_word: בֵּית
  choice: 殿
  rationale: 该词字面义为“房屋、家”，此处指将要建造、归雅威上帝所有的圣殿。中文若直译“家”容易被理解为家庭或家族，因此正文用自然明确的“殿”，并在脚注注明原文字面表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其专名性质，不以“主”这一称号替代。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此词与神名并置，构成“雅威上帝”；“上帝”是现代标准汉语中庄重且通行的表达。
- source_word: מִזְבֵּחַ
  choice: 祭坛
  rationale: 准确表达献祭所用的坛，是现代中文通行译法。
- source_word: לְעֹלָה
  choice: 献燔祭的
  rationale: עֹלָה 指整只焚烧献上的祭物或这种祭；结合祭坛，用“献燔祭的”自然表达祭坛的用途，同时保留单数可作类别总称的开放性。
- source_word: לְיִשְׂרָאֵל
  choice: 以色列
  rationale: 介词表示该祭坛与以色列的关系或为其用途；在“以色列献燔祭的祭坛”中自然理解为供以色列献祭之用，无须扩写为“以色列人”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”以保留其专名性质；不以称号“主”替代，也不采用来源较晚的传统形式“耶和华”。
- issue: בֵּית יְהוָה הָאֱלֹהִים 译作“殿”还是字面的“家／房屋”
  choice: 雅威上帝的殿
  alternative: 雅威上帝的家；雅威上帝的房屋
  rationale: 原词确为“房屋、家”，但在本节语境中指敬拜上帝的圣所。现代汉语“上帝的家”可能误指家庭或信徒群体，“房屋”则显得仅指一般建筑；“殿”准确传达所指，同时以脚注保存原文意象。
- issue: עֹלָה 的单复数含义
  choice: 燔祭，作为祭类总称
  alternative: 燔祭祭物；多次的燔祭
  rationale: 希伯来文为单数，但可作泛指或集合性用法。中文“献燔祭”同样可以泛指这一类祭，不强行限定为一次或多次。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。重复“这就是”以保留原文两个 זֶה 的平行和强调，不为追求汉语简省而合并。正文使用“殿”确保所指清楚，脚注则保存 בֵּית 的字面意象；“燔祭”作为必要的礼仪术语予以保留。
