base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/016.yaml
  text: For the gold[a], the silver, the bronze, and the iron, there is no number. Rise up and work[c][b], and may Yahweh be with you.
translation:
  language: zh_hans
  text: 至于金、银、铜[a]、铁，多得无法计数[b]。起来动工吧！愿雅威与你同在[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜”也可译作“青铜”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“没有数目”，意思是多得数不清。
    reason: lexical_alternative
  - marker: c
    text: 也可译作：“雅威必与你同在”或“让雅威与你同在。”这里的希伯来语形式可以表达愿望或祝福。
    reason: alternative_reading
lexical_decisions:
- source_word: לַזָּהָב לַכֶּסֶף וְלַנְּחֹשֶׁת וְלַבַּרְזֶל
  choice: 至于金、银、铜、铁
  rationale: 各名词前的 ל 在这里适合视为提出话题，承接上文所说的建殿材料；“至于”自然保留了这种列举和承接作用。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜，也常泛指古代所用的铜或青铜材料。现代中文材料清单中“铜”较自然，同时以脚注保留“青铜”的可能。
- source_word: אֵין מִסְפָּר
  choice: 多得无法计数
  rationale: 这是表示数量不可胜数的习语；此译法既准确传达含义，也比逐字译作“没有数目”更符合现代汉语。
- source_word: קוּם וַעֲשֵׂה
  choice: 起来动工吧
  rationale: קום 是催促行动的命令，עשה 在建殿语境中具体指着手做工；合译为“起来动工吧”简洁有力。
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: 愿雅威与你同在
  rationale: יהי 在此最自然地表达愿望或祝福，而非确定的简单将来；“与你同在”保留 עִם 的惯用表达。神名 יהוה 音译为“雅威”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”较直接地保留专名性质，不以称号替代，也不加入特定宗派解释。
- issue: וִיהִי 所表达的语气
  choice: 愿雅威与你同在
  alternative: 雅威必与你同在；让雅威与你同在
  rationale: 该形式在此可表达愿望或祝福。正文采用祝愿语气，同时用脚注保留将来陈述或许可式理解的语法可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“起来动工吧”保留劝勉的力度；标点将材料陈述、行动命令和祝福分开。所有脚注标记均置于相应正文位置。
