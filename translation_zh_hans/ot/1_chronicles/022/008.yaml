  text: וַ/יְהִ֨י עָלַ֤/י דְּבַר יְהוָה֙ לֵ/אמֹ֔ר דָּ֤ם לָ/רֹב֙ שָׁפַ֔כְתָּ וּ/מִלְחָמ֥וֹת גְּדֹל֖וֹת עָשִׂ֑יתָ לֹֽא תִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י כִּ֚י דָּמִ֣ים רַבִּ֔ים שָׁפַ֥כְתָּ אַ֖רְצָ/ה לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/008.yaml
  text: But the word of Yahweh came to me[a], saying, ‘You have shed much blood and fought great wars. You shall not build a house for my name[d][c][b], because you have shed much blood on the earth before me.’
translation:
  language: zh_hans
  text: 但雅威的话临到我，说：‘你流了许多血，又进行了重大的战争。你不可为我的名建造房屋[a]，因为你在我面前把许多血流在地上[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”在这里指圣殿。
    reason: cultural_note
  - marker: b
    text: “流在地上”也可译作“倾流到地面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עָלַי דְּבַר יְהוָה
  choice: 耶和华的话临到我
  rationale: 采用现代中文圣经语体中自然且庄重的表达，保留“话”及神主动向大卫说话的含义；将יהוה音译为“耶和华”，这是普通话读者熟悉的专名。
- source_word: דָּם לָרֹב שָׁפַכְתָּ
  choice: 你流了许多人的血
  rationale: 保留“流血”的具体意象；补出“人的”使现代汉语意思清楚，避免被误解为大卫自己的身体大量出血。
- source_word: וּמִלְחָמוֹת גְּדֹלוֹת עָשִׂיתָ
  choice: 又打了大仗
  rationale: 希伯来文直译为“行了/作了大争战”；“打了大仗”在现代汉语中简明自然，并保留大规模战争的意思。
- source_word: לֹא תִבְנֶה בַיִת לִשְׁמִי
  choice: 你不可为我的名建造殿宇
  rationale: “不可”表达语境中的禁止；“为我的名”保留盟约性措辞。בַיִת字面是“房屋”，但此处明确指敬拜用的圣殿，译作“殿宇”既自然又保留“神之居所”的意象。
- source_word: דָּמִים רַבִּים שָׁפַכְתָּ אַרְצָה לְפָנָי
  choice: 你在我面前使许多人的血流在地上
  rationale: 保留复数“血”、方向性אַרְצָה和“在我面前”的神学力度；采用使动式中文，清楚表达这些血因大卫的行动而被倾流。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用华语圣经传统中最普遍、普通读者最易识别的专名“耶和华”，而不以“主”替代专名；“雅威”是较接近学术重构读音的可行选择。
- issue: בַיִת应译为“房屋”还是“圣殿”类用语
  choice: 殿宇
  alternative: 房屋；圣殿
  rationale: 语境明确指将要建造的圣殿。“殿宇”比“房屋”更自然地指向该建筑，同时不像直接译作“圣殿”那样完全消除原文“家/房屋”的意象；脚注交代字面措辞。
- issue: 大卫被禁止建殿的原因
  choice: 按原文直接保留流血与战争的理由
  alternative: 解释为血债、道德定罪或礼仪不洁
  rationale: 本节说明大卫流了许多血并经历大战，但没有在此明确界定所有战争的道德性质，因此不把原因扩展为经文未明说的血债或礼仪教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“耶和华的话临到我”“为我的名”“在我面前”等关键圣经表达；避免过度古雅。引号内按神对大卫的直接话语处理。
