  naturalness: “雅威的话临到我说”及“你不可为我的名建造房屋”庄重、通顺，适合现代中文圣经语体。“打了大仗”可理解，但“进行了重大的战争”较完整地对应“进行了/作了重大的战争”。末句改为“你在我面前把许多血流在地上”比“使许多人的血流在地上”更直接自然。
  terminology: 采用“雅威”对应YHWH并与英文审校轨迹一致；保留“房屋”和“为我的名”，不将圣殿解释写入正文。保留“在我面前”，不扩展为血债或礼仪意义。
