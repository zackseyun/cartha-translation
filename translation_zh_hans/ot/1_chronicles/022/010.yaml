base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/010.yaml
  text: He will build a house for my name[a], and he will be a son to me, and I will be a father to him, and I will establish the throne of his kingdom over Israel forever.
translation:
  language: zh_hans
  text: 他必为我的名建造房屋[a]；他必作我的儿子，我必作他的父亲。我必使他国度的王位在以色列之上永远坚立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为我的名建造圣殿”。原文直译为“为我的名建造房屋”。
    reason: 保留希伯来语“房屋”的字面表达，同时说明该词在此语境中指圣殿。
lexical_decisions:
- source_word: בַיִת
  choice: 殿宇
  rationale: 基本义为“房屋”，但本节语境明确指为耶和华之名建造的圣殿。“殿宇”在现代汉语中自然、庄重；脚注保留原文直译“房屋”。
- source_word: לִשְׁמִי
  choice: 为我的名
  rationale: 直接保留希伯来语的立约和神学表达，不释作“为尊崇我”或“为我的临在”，以免缩窄其含义。
- source_word: לְבֵן…לְאָב
  choice: 作我的儿子……作他的父亲
  rationale: 保留原文直接陈述的父子关系及其平行结构，不弱化为“像儿子一样”。
- source_word: וַהֲכִינוֹתִי
  choice: 使……永远稳固
  rationale: כון的使役式表示使之坚定、确立；与“王位”搭配时，“使……稳固”既贴近词义，也符合自然汉语。
- source_word: כִּסֵּא מַלְכוּתוֹ
  choice: 他统治以色列的王位
  rationale: 原文直译为“他国度的宝座”。译文以“王位”表达宝座所指的王权，并将עַל יִשְׂרָאֵל所表示的管辖对象自然地纳入句中；相关直译在脚注说明。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 准确表达持续无尽的应许力度，并保持原文关于王朝应许的开放性。
theological_decisions:
- issue: 父子立约公式既直接用于所罗门，又具有更广的戴维王朝应许意义
  choice: 他要作我的儿子，我要作他的父亲
  alternative: 我要待他如同儿子，他也要待我如同父亲
  rationale: 原文直接确立关系，而非仅作类比。保留该公式，可同时维持其当下历史指向及更广的正典意义，不在译文中预先限定其神学实现。
- issue: “永远”的王位应许
  choice: 我必使他统治以色列的王位永远稳固
  alternative: 我必使他的王朝长久统治以色列
  rationale: 保留“永远”的充分力度，不将其弱化为“长久”，也不在本节中解释应许如何实现。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿宇”比单用“殿”更明确，也避免把普通“房屋”误解为私人住宅；父子公式保持简洁对称。主文需补入脚注标记[b]以对应第二条脚注。
