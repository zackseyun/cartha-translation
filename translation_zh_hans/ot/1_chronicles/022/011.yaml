base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/011.yaml
  text: Now[a], my son, may Yahweh be with you, and may you prosper and build the house of Yahweh your God[c][b], as he has spoken concerning you.
translation:
  language: zh_hans
  text: 现在，我儿，愿雅威与你同在；愿你顺利，并建造雅威你上帝的殿[a]，正如他所说关于你的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“房屋”，即雅威你上帝的殿宇。
    reason: lexical_alternative
  - marker: b
    text: 或译：“正如他关于你所应许的。”原文更直译为“正如他论到你所说的”。
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 作为话语衔接词，引出大卫对儿子的祝愿和嘱咐；“现在”自然且忠实。
- source_word: בְנִי
  choice: 我儿
  rationale: 保留第一人称单数所属关系和父亲直接称呼儿子的庄重亲切语气。
- source_word: יְהִי יְהוָה עִמָּךְ
  choice: 愿雅威与你同在
  rationale: יְהִי 是祈愿式，表达祝福而非单纯预告；以“愿”准确传达其语气。
- source_word: וְהִצְלַחְתָּ
  choice: 愿你顺利
  rationale: צלח 的使役词干在此可表示顺利、成功；结合前面的祈愿式，以“愿你顺利”延续祝愿语气，又不局限于物质兴旺。
- source_word: וּבָנִיתָ
  choice: 建造
  rationale: 该动词与前面的祝愿序列相连；中文用“愿你顺利，建造……”自然涵盖所期待的行动，同时不强行解释为目的或结果。
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: 雅威你上帝的殿
  rationale: בַּיִת 字面为“房屋、家”，在此指为雅威建造的圣殿；正文用现代中文更清楚的“殿”，脚注保留字面表达。
- source_word: כַּאֲשֶׁר דִּבֶּר עָלֶיךָ
  choice: 正如他论到你所说的
  rationale: 保留 דבר + על 的“论到、关于……说”这一宽泛含义，不将其收窄为明确的“应许”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”按其较普遍接受的读音音译，避免以称号代替专名。
- issue: 大卫对所罗门所说动词序列的语气
  choice: 祝愿：“愿……愿……”
  alternative: 预告：“雅威必……你必……”
  rationale: 开头 יְהִי 明确具有祈愿色彩，后续动词可自然承接这一祝福；译文保留这种祝愿与预期之间的张力，不改成确定预言。
- issue: דִּבֶּר עָלֶיךָ 是否译为“应许你”
  choice: 论到你所说的
  alternative: 关于你所应许的
  rationale: 上下文中的话具有应许意味，但原文本身使用普通的“说”而非专指应许的词；采用较宽泛的表达以免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“我儿”保留父亲训诲中的亲切庄重；分号呈现祝福的两个相连层次。正文中的脚注标记均按首次相关位置排列。
