lexical_decisions:
- source_word: וַיְצַו
  choice: 于是……吩咐
  rationale: 该叙事性动词形式推进事件；“于是”自然表达承接关系，“吩咐”保留大卫所发指令的权威性。
- source_word: שָׂרֵי
  choice: 首领
  rationale: 此词指掌权者或领袖；“首领”在现代汉语中简明、庄重，也不把具体官职说得过细。
- source_word: לְכָל שָׂרֵי יִשְׂרָאֵל
  choice: 以色列的所有首领
  rationale: 保留“所有”的全称范围及这些首领与以色列之间的所属关系。
- source_word: לַעְזֹר
  choice: 帮助
  rationale: 准确而自然地表达该不定式“帮助、协助”的基本含义。
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: 他的儿子所罗门
  rationale: “他的儿子所罗门”符合现代汉语语序，清楚保留所罗门与大卫的父子关系。
