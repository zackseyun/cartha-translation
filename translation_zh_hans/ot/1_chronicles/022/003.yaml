base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/003.yaml
  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
translation:
  language: zh_hans
  text: 大卫为城门门扇的钉子和连接件[a]预备了大量的铁；又预备了多得无法称量的铜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“铰链”；原文所用的词含义较宽，泛指连接或接合用的构件。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“没有重量”，意思是多得无法称量。
    reason: idiom_clarification
lexical_decisions:
- source_word: בַרְזֶל
  choice: 铁
  rationale: 该词在此直接指建筑材料“铁”，现代汉语自然明确。
- source_word: לָרֹב
  choice: 大量／多得
  rationale: 该短语表示数量极多；依句中搭配分别译为“大量”和“多得”，使汉语流畅并保留重复强调。
- source_word: מִּסְמְרִים
  choice: 钉子
  rationale: 在城门施工语境中指用于固定的钉状金属件；“钉子”既自然，也不窄化为特定规格的铆钉或大钉。
- source_word: דַלְתוֹת הַשְּׁעָרִים
  choice: 城门门扇
  rationale: 原文指城门所属的门板；“城门门扇”准确区别于整个门口或门楼。
- source_word: מְחַבְּרוֹת
  choice: 连接件
  rationale: 该词泛指连接、接合用的构件；“连接件”保留其宽泛含义，不武断限定为“铰链”。
- source_word: הֵכִין
  choice: 预备了
  rationale: 该动词表示预备、备妥；本节语境是大卫为建殿储备材料。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该希伯来词可指铜或铜合金；中文圣经材料清单中译作“铜”较自然，也保留材质范围，避免过度确定为青铜。
- source_word: אֵין מִשְׁקָל
  choice: 多得无法称量
  rationale: 字面为“没有重量／称量”，语境所表达的是数量极大，以致无法称量；此译法自然呈现其夸张义。
theological_decisions: []
