base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/009.yaml
  text: Behold[a], a son will be born to you. He will be a man of rest, and I will give him rest from all his enemies all around; for Solomon will be his name[b], and I will give peace and quiet to Israel in his days.
translation:
  language: zh_hans
  text: 看哪，必有一个儿子为你而生。他必是一个得享安息的人；我必使他得享安息，脱离四围所有的仇敌。因为他的名要叫所罗门[a]；在他的日子，我必赐平安与安宁给以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所罗门”这个名字在希伯来语中与“平安”一词相近；本节也称他为“得享安息的人”。
    reason: 说明原文中名称、平安和安息之间的文字与主题联系。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示听者注意的功能和庄重的宣告语气。
- source_word: בֵן נוֹלָד לָךְ
  choice: 必有一个儿子为你而生
  rationale: 分词在神应许的语境中具有将来意义；“为你而生”自然表达儿子将归于大卫。
- source_word: אִישׁ מְנוּחָה
  choice: 一个得享安息的人
  rationale: 既表达安稳、不受争战搅扰的处境，又保留与下句同词根动词的重复联系；不提前将其等同于后文的“平安”。
- source_word: וַהֲנִחוֹתִי לוֹ
  choice: 我必使他得享安息
  rationale: 反映使役意义，并与“得享安息的人”形成有意的词语呼应。
- source_word: מִכָּל־אוֹיְבָיו מִסָּבִיב
  choice: 脱离四围所有的仇敌
  rationale: 保留“所有”和“四围”两层含义，同时符合现代汉语表达。
- source_word: שְׁלֹמֹה יִהְיֶה שְׁמוֹ
  choice: 他的名要叫所罗门
  rationale: 以自然汉语表达命名宣告，并通过脚注说明原文中名字与“平安”的语音和词源联系。
- source_word: שָׁלוֹם וָשֶׁקֶט
  choice: 平安与安宁
  rationale: 分别表达完整安好与安静稳妥，避免把两个不同的希伯来词合并为同一概念。
theological_decisions:
- issue: “安息”、所罗门之名与“平安”之间的主题联系
  choice: 正文分别译作“安息”“所罗门”和“平安”，并以脚注指出名称联系。
  alternative: 把 אִישׁ מְנוּחָה 译作“太平的人”，使主题联系更显明。
  rationale: 原文既将安息与平安相连，又使用了不同词语；分别翻译可保存这种联系中的差异，不把所罗门的角色或其时代的性质解释得过窄。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留宣告语气；“得享安息”连续出现两次，以重现原文的词根呼应；末句用“平安与安宁”区分两个并列词。
