  text: אָ֣ז תַּצְלִ֔יחַ אִם תִּשְׁמ֗וֹר לַ/עֲשׂוֹת֙ אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה עַל יִשְׂרָאֵ֑ל חֲזַ֣ק וֶ/אֱמָ֔ץ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/013.yaml
  text: Then you will prosper[a], if you are careful to do the statutes and the judgments that Yahweh commanded Moses for Israel. Be strong and courageous. Do not fear[b], and do not be dismayed.
translation:
  language: zh_hans
  text: 这样，你若谨慎遵行雅威吩咐摩西、有关以色列的律例和典章，就必亨通[a]。你要刚强勇敢，不要惧怕，也不要惊惶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成功”。希伯来语动词既可指亨通，也可指顺利成功。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 在上下文中引出遵行诫命所带来的结果；“那时”自然保留希伯来文的承接关系。
- source_word: תַּצְלִיחַ
  choice: 就必亨通
  rationale: 希伯来语使役词形在此可表示亨通或成功；“亨通”适合盟约顺服的语境，同时以脚注保留“成功”的可能译法。
- source_word: אִם תִּשְׁמוֹר לַעֲשׂוֹת
  choice: 你若谨慎遵行
  rationale: “谨慎遵行”凝练表达“守护／留心去做”的惯用结构，兼顾审慎与实际服从。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: 这是摩西律法语境中常用且庄重的译法，并与מִשְׁפָּטִים区分。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: 保留该词的法律、司法规范色彩，并与“律例”形成两个不同的法律术语。
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה עַל יִשְׂרָאֵל
  choice: 耶和华吩咐摩西为以色列所定的
  rationale: 直宾结构表明摩西是受吩咐者；עַל在此表达这些规定关乎并适用于以色列。“所定的”使中文修饰结构顺畅，但不把摩西改作中介主体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名专名形式，对应四字神名，而非以“主”替代。
- source_word: חֲזַק וֶאֱמָץ
  choice: 你要刚强勇敢
  rationale: 自然、庄重地再现希伯来叙事中常见的勉励公式。
- source_word: אַל תִּירָא
  choice: 不要惧怕
  rationale: 直接保留否定命令及其严肃的劝勉语气。
- source_word: וְאַל תֵּחָת
  choice: 也不要惊惶
  rationale: 表达因威胁而丧胆、崩溃的含义，与前句“不要惧怕”并列而不完全重复。
theological_decisions:
- issue: 神圣名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文正文采用广为人知且具专名功能的“耶和华”，不以称号“主”代替，也不额外加入宗派性解释。
- issue: 亨通与顺服之间的关系
  choice: 保留原文的条件句：“你若……就必亨通”
  alternative: 将其解释为普遍性的物质富足保证
  rationale: 原文在大卫对所罗门建殿使命的劝勉中，把成功与谨守律法相连；译文不将特定语境扩展为无条件或纯物质性的应许。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“律例和典章”保留两个不同的希伯来法律术语；“刚强勇敢”保留传统劝勉公式的力度。正文中的脚注标记[a]与脚注完全对应。
