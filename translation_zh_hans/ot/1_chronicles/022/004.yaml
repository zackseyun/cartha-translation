  yaml_path: translation/ot/1_chronicles/022/004.yaml
  text: and cedar timbers without number[a], for the Sidonians and Tyrians had brought cedar timbers in abundance to David.
translation:
  language: zh_hans
  text: 又预备了多得数不清的香柏木料[a]，因为西顿人和推罗人给大卫运来了大量香柏木料。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“香柏木”。希伯来语可泛指香柏木材；在预备圣殿建材的语境中，这里很可能指建筑用木料。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲצֵי אֲרָזִים
  choice: 又预备了……香柏木料
  rationale: עֲצֵי אֲרָזִים可指香柏树、香柏木或香柏木材；本节处于圣殿建材预备的语境，用“香柏木料”最自然。原文在此承接前文省略了谓语，中文补出“预备了”以保持句意完整，并用“又”表达וַ的并列承接。
- source_word: לְ/אֵין מִסְפָּר
  choice: 多得数不清
  rationale: 该习语表示数量多到无法计数；“多得数不清”是现代汉语中自然清楚的对应表达。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出香柏木料数量众多的原因，“因为”准确表达解释关系。
- source_word: הֵבִיאוּ
  choice: 运来了
  rationale: Hiphil完成式意为“带来、运来”；建材语境下“运来了”比泛泛的“带来了”更具体自然。希伯来语完成式本身不要求译成汉语过去完成体。
- source_word: הַ/צִּידֹנִים
  choice: 西顿人
  rationale: 族称复数，指西顿居民；“西顿人”是简洁标准的现代汉语表达。
- source_word: וְ/הַ/צֹּרִים
  choice: 和推罗人
  rationale: 族称复数，指推罗居民；“推罗人”与“西顿人”结构对应。
- source_word: לָ/רֹב
  choice: 大量
  rationale: 该短语表示数量丰多；“大量”简明自然，适合修饰运来的建材。
- source_word: לְ/דָוִד
  choice: 给大卫
  rationale: 介词לְ标示接受者；“给大卫运来”直接保留大卫作为收受者的关系。
