  text: 'The sons of Beriah: Heber and Malchiel[b][a]; he was the father of Birzaith.'
translation:
  language: zh_hans
  text: 比利亚的儿子是希别和玛结；玛结是比撒威[b]的父亲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父亲”也可理解为“祖先”，或某一宗族、聚落的“创立者”。家谱中的“父亲”不一定专指直接的生父。
    reason: lexical_alternative
  - marker: b
    text: 此专名的转写并不完全确定；也可见作 Birzoth 或 Berazoth。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: ……的儿子是
  rationale: 该词为“儿子”的复数构造形式，前接连词，引出家谱中的下一层分支。汉语用“……的儿子是”自然清楚；篇首连词在这一独立经节中不必机械译作“又”。
- source_word: בְרִיעָה
  choice: 比利亚
  rationale: 人名按现代中文圣经中通行且易辨识的形式音译。
- source_word: חֶבֶר
  choice: 希别
  rationale: 人名采用现代中文圣经中较通行的音译形式。
- source_word: וּמַלְכִּיאֵל
  choice: 和玛结
  rationale: 保留连接两个名字的连词；人名采用现代中文圣经中较通行的音译形式。
- source_word: הוּא
  choice: 他
  rationale: 独立代词承接前文的阳性单数人物。直译为“他”既贴近希伯来语句法，也不把所指对象在正文中解释得过死；按就近关系通常指玛结。
- source_word: אֲבִי
  choice: ……的父亲
  rationale: 保留家谱用语的字面表达。此词在家谱中也可能表示祖先，或某宗族、聚落的奠基者，相关可能性收入脚注。
- source_word: ברזות
  choice: 比撒威
  rationale: 这是罕见且读法不完全确定的专名，可能指人物、宗族或地方；正文采用中文传统中较熟悉的保守音译，不加解释性意译。
