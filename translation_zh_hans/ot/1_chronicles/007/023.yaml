  text: וַ/יָּבֹא֙ אֶל אִשְׁתּ֔/וֹ וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יִּקְרָ֤א אֶת שְׁמ/וֹ֙ בְּרִיעָ֔ה כִּ֥י בְ/רָעָ֖ה הָיְתָ֥ה בְּ/בֵיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
translation:
  language: zh_hans
  text: 后来，以法莲与妻子同房；她就怀孕，生了一个儿子。他给儿子取名叫比利亚[a]，因为他家中遭遇了灾祸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比利亚”一名与希伯来语“在灾祸中”（berā‘āh）发音相近。
    reason: 解释原文中的命名双关；这个联系在音译的人名中无法直接显出。
  - marker: b
    text: “灾祸”指临到他家庭的灾难或不幸，并非指道德上的邪恶。原文直译为“因为灾祸在他家中”。
    reason: 说明רָעָה在本语境中的词义，并保留原文末句较为静态的另一种表达。
lexical_decisions:
- source_word: וַיָּבֹא אֶל אִשְׁתּוֹ
  choice: 以法莲与妻子同房
  rationale: בוא אל אשה是表示夫妻发生性关系的委婉惯用语。“与妻子同房”在现代汉语中自然、庄重，也清楚传达原意。希伯来文主语为“他”，根据上文明确为以法莲，译文补出姓名以免中文指代不清。
- source_word: וַתַּהַר וַתֵּלֶד בֵּן
  choice: 她就怀孕，生了一个儿子
  rationale: 依次保留“怀孕”和“生子”两个叙事动作，措辞简明自然。
- source_word: וַיִּקְרָא אֶת שְׁמוֹ בְּרִיעָה
  choice: 他给儿子取名叫比利亚
  rationale: 这是常见的希伯来语命名公式。“取名叫”比直译“称他的名为”更符合现代汉语；בְּרִיעָה按圣经人名惯例音译为“比利亚”。
- source_word: כִּי בְרָעָה הָיְתָה בְּבֵיתוֹ
  choice: 因为他家中遭遇了灾祸
  rationale: רָעָה在本语境指临到家庭的灾难、不幸，并非道德意义上的“邪恶”。“家中”保留בַּיִת可兼指住家与家人的含义；“遭遇了灾祸”以自然汉语表达字面“灾祸在他家中”。
theological_decisions:
- issue: רָעָה的性质
  choice: 灾祸
  alternative: 邪恶
  rationale: 上下文叙述以法莲家中丧子，因此这里是灾难或不幸，而不是对家人道德状况的评断。
- issue: “家”所指范围
  choice: 保留“家中”
  alternative: 家人中间／家庭中
  rationale: בֵּיתוֹ既可指房屋，也可指家庭或家族。译作“家中”保留这种语义幅度，不把所指过早限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“同房”保留原文的委婉表达；叙事句式简洁。补出“以法莲”以解决脱离上文单独阅读时的指代问题，同时不改变原文所指。
