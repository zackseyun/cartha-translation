  yaml_path: translation/ot/1_chronicles/007/019.yaml
  text: The sons of Shemida were Ahian[a], Shechem, Likhi, and Aniam.
translation:
  language: zh_hans
  text: 示米大的儿子[a]是亚希安、示剑、利克希和亚尼安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“后裔”。在家谱中，“儿子”有时可泛指男性后裔，不过本节的直接语境较支持“儿子”。
    reason: 保留 בְּנֵי 在家谱语境中可能具有的较宽泛含义，而不在正文中消除这一词义弹性。
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 是
  rationale: 在家谱名单中，היה 的叙事形式用于引出所列人物；现代汉语用“是”自然表达这种系词关系，不另加“成为”的意味。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 该词在家谱中有时可泛指男性后裔，但本节直接列出男性名字，译作“儿子”最贴近原文的阳性亲属称谓；较宽泛的可能性保留在脚注中。
- source_word: שְׁמִידָע
  choice: 示米大
  rationale: 按希伯来语读音音译，并采用简洁、易读的现代汉语人名形式。
- source_word: אַחְיָן
  choice: 亚希安
  rationale: 依希伯来语辅音和元音音译，保留词中的喉音成分，同时使普通话读者易于辨读。
- source_word: שֶׁכֶם
  choice: 示剑
  rationale: 这里由家谱句法可知是人名；采用汉语圣经传统中熟悉的音译“示剑”，不按其可能的普通词义翻译。
- source_word: לִקְחִי
  choice: 利克希
  rationale: 按希伯来语音形音译；用“克希”较清楚地反映末尾的辅音组合。
- source_word: אֲנִיעָם
  choice: 亚尼安
  rationale: 按希伯来语读音音译为自然、易读的普通话人名，不解释或翻译名字的词源含义。
