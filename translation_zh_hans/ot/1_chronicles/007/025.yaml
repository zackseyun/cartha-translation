    rationale: 脚注应说明希伯来文无显式动词、部分父子关系依族谱次序推知，而不应保留可能误解为并列名单的措辞。
  revised_text: 他的儿子是利法；利法的儿子是利悉；利悉的儿子是他拉；他拉的儿子是他罕。
  revised_footnotes:
