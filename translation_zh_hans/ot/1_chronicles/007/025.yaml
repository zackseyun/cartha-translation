revisions:
- from: 他的儿子利法[a]，还有利悉；利悉的儿子是他拉，他拉的儿子是他罕。
  to: 他的儿子是利法；利法的儿子是利悉；利悉的儿子是他拉；他拉的儿子是他罕。
