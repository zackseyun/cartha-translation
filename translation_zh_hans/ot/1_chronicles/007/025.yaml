  yaml_path: translation/ot/1_chronicles/007/025.yaml
  text: Rephah his son[a], Resheph, Telah his son, Tahan his son.
translation:
  language: zh_hans
  text: 他的儿子是利法；利法的儿子是利悉；利悉的儿子是他拉；他拉的儿子是他罕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֶפַח
  choice: 利法
  rationale: 此处是族谱中的人名，采用适合现代汉语读者的音译。
- source_word: בְּנוֹ
  choice: 他的儿子／……的儿子
  rationale: 该词是“儿子”带第三人称阳性单数后缀。首次直译为“他的儿子”；后两处根据族谱链条补明所指对象，以免汉语中的连续“他的”产生歧义。
- source_word: רֶשֶׁף
  choice: 利悉
  rationale: 在本节族谱语境中作人名，不按该词在其他语境中可能具有的“火焰”或“瘟疫”等普通名词义翻译。
- source_word: תֶלַח
  choice: 他拉
  rationale: 族谱人名，采用通顺且可辨识的汉语音译。
- source_word: תַחַן
  choice: 他罕
  rationale: 族谱人名，采用通顺且可辨识的汉语音译。
- source_word: וְ
  choice: ，还有；
  rationale: 希伯来语连接词串联族谱成员；按现代汉语的层次关系分别用逗号、“还有”和分号表达，同时保留名单结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的族谱表述。原文逐项为“利法—他的儿子、利悉、他拉—他的儿子、他罕—他的儿子”，其中“他的”所指依靠族谱排列推知；正文适度补明关系，避免现代汉语读者误读，同时用脚注说明希伯来文省略动词的特点。
