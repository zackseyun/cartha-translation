lexical_decisions:
- source_word: לַעְדָּן
  choice: 拉但
  rationale: 按希伯来文人名音译；采用现代中文圣经读者较易辨认的传统译名。“拉但”与“拉伊但”等形式之间的差异属于音译惯例，并非原文异读。
- source_word: בְּנוֹ
  choice: 的儿子是
  rationale: 该词由“儿子”加第三人称阳性单数词尾构成，直译为“他的儿子”。中文谱系叙述中补出前一人名，并译作“某人的儿子是某”，既明确承接关系，也保留直接父子关系的通常含义。
- source_word: עַמִּיהוּד
  choice: 亚米忽
  rationale: 按希伯来文人名音译，并采用现代中文圣经中通行、易辨认的形式。
- source_word: אֱלִישָׁמָע
  choice: 以利沙玛
  rationale: 按希伯来文人名音译，并采用现代中文圣经中通行、易辨认的形式。
