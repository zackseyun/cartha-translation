  register: 采用简洁、庄重而自然的现代汉语谱系句式。原文是三个名字与两次“他的儿子”连续排列；中文重复前一人名以消除代词承接歧义，并用分号呈现世代递进。英文脚注所述 Ladan/Laadan 是英语音译差异，在中文“拉但”的选择中不构成有实质意义的文本或词义异读，故不设脚注。
