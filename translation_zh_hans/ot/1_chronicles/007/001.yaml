  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
translation:
  language: zh_hans
  text: 以萨迦的儿子是陀拉、普瓦[a]、雅述[b]和伸仑，共四人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文名字形式为“Puah”；其他家谱中的平行形式为“Puvah”。
    reason: alternative_reading
  - marker: b
    text: 创世记46:13的平行家谱作“约伯”。
    reason: cross_reference
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: 的儿子是
  rationale: 此处引出以萨迦支派的家谱名单。希伯来语开头的连词和介词在现代汉语中不必逐字译出，用“的儿子是”自然、清楚。
- source_word: יִשָׂשכָר
  choice: 以萨迦
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: תּוֹלָע
  choice: 陀拉
  rationale: 这是家谱中的人名，采用通行音译。
- source_word: וּ/פוּאָה
  choice: 普瓦
  rationale: 按本节马所拉文本的读音音译；其他家谱平行经文所见的相关形式不取代本节正文。
- source_word: ישיב
  choice: 雅述
  rationale: 按本节希伯来文本所呈现的名字形式音译，不以平行家谱中的不同名字形式替换。
- source_word: וְ/שִׁמְרוֹן
  choice: 和伸仑
  rationale: 采用通行音译，并在名单最后一项前自然译出连词。
- source_word: אַרְבָּעָה
  choice: 共四人
  rationale: 这是对前述名单人数的总结；补出量词“人”符合现代汉语表达，未增加实质信息。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。人名沿用简体中文圣经读者较熟悉的译法；名单末尾以“共四人”表达希伯来文的总结语。英文咨询层将注[a]置于“陀拉”后，但其注释内容实际讨论“普瓦”，故按注释所指移至“普瓦”后；其注[b]称创世记46:13作“Ishvi”，与该处希伯来文本不符，故据原文校正为“约伯”。
