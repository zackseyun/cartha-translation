  text: Bezer[a], Hod, Shamma, Shilshah, Ithran[c][b], and Beera.
translation:
  language: zh_hans
  text: 贝策尔、霍德、沙玛、希勒沙、伊特兰和贝埃拉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּצֶר
  choice: 贝策尔
  rationale: 这是家谱中的人名，按希伯来语读音音译；用“策”体现 צ 的音值，并保留末尾辅音。
- source_word: הוֹד
  choice: 霍德
  rationale: 此处是人名，不按普通名词“尊荣、威荣”的意义翻译；依希伯来语音译。
- source_word: שַׁמָּא
  choice: 沙玛
  rationale: 按本节马所拉文本的元音形式音译；不额外添加原文没有的词尾辅音。
- source_word: שִׁלְשָׁה
  choice: 希勒沙
  rationale: 作为人名音译，尽量体现中间的流音和末尾音节，同时采用普通中文读者容易朗读的形式。
- source_word: יִתְרָן
  choice: 伊特兰
  rationale: 按希伯来语起首的 י 和中间的 ת 直接音译，避免沿用经由英语形成的“th”读法。
- source_word: בְאֵרָא
  choice: 贝埃拉
  rationale: 用分开的“贝埃”体现 א 所形成的音节分界，比简化为“贝拉”更贴近希伯来语形式。
