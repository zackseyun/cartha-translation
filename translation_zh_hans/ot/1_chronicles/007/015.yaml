base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
translation:
  language: zh_hans
  text: 玛吉为户品和书品娶了妻。他的姐妹名叫玛迦；第二个名叫西罗非哈[a]。西罗非哈有女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第二个儿子名叫西罗非哈。”希伯来文只说“第二个”，所指并未明说。
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  choice: 娶了妻
  rationale: 这是希伯来语表示娶妻或成婚的常用表达；本句带有“为户品和书品”的不寻常结构，因此保留“娶妻”的意象和句法关系，不笼统改写为“安排婚事”。
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  choice: 为户品和书品
  rationale: 两个名字前均有介词 לְ，表示玛吉是“为”他们娶妻。中文不机械重复“为”，但保留这一不寻常的关系，也不擅自说明具体婚姻安排。
- source_word: וְשֵׁם אֲחֹתוֹ מַעֲכָה
  choice: 他的姐妹名叫玛迦
  rationale: 直译命名句式，并用“他的”保留代词所指；“姐妹”准确表达 אֲחוֹת，而不擅自判定是姐姐还是妹妹。
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  choice: 第二个名叫西罗非哈
  rationale: 原文只说“第二个”，没有明说是“儿子”或其他身份。正文保留其简略和歧义，脚注列出常见的补足译法。
- source_word: וַתִּהְיֶנָה לִצְלָפְחָד בָּנוֹת
  choice: 西罗非哈有女儿
  rationale: 这是存在句表达领属关系的自然中文译法。原文只说明他有女儿，并未在本句明说“只有女儿”或女儿的数目，故不作增补。
theological_decisions:
- issue: “第二个”在族谱中的所指
  choice: 正文保留“第二个”，不补出身份
  alternative: 第二个儿子名叫西罗非哈
  rationale: 希伯来文 הַשֵּׁנִי 只有“第二个”这一表达，所指被省略。补入“儿子”虽可使族谱关系更顺畅，却超出本句明说的内容，因此只在脚注中提供。
translation_notes:
  register: 采用现代、庄重而易懂的族谱叙述语体。人名依照现代中文圣经中常见的译名。正文特意保留“为户品和书品娶了妻”及“第二个”两处原文的不寻常表达，不以解释性改写消除歧义。
