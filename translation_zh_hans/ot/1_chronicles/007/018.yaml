  yaml_path: translation/ot/1_chronicles/007/018.yaml
  text: His sister Hammoleketh bore Ishhod[a], Abiezer, and Mahlah.
translation:
  language: zh_hans
  text: 他的姊妹哈摩利吉[a]生了伊施荷、亚比以谢和玛拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“哈摩利吉”；也可音译为“摩利吉”。这个名字的形式与意为“王后”或“掌权者”的词有关，但此处最好视为人名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֹתוֹ
  choice: 他的姊妹
  rationale: אֲחוֹת带第三人称阳性单数后缀，直译为“他的姊妹”；句首连接词וַ承接上文家谱，在中文独立经节中可不显译，以免生硬。
- source_word: הַמֹּלֶכֶת
  choice: 哈摩利吉
  rationale: 虽在形式上与“王后、掌权者”有关，但家谱语境和形态分析支持将其视为人名；采用音译，并保留词首冠词已融入名字的传统理解。
- source_word: יָלְדָה
  choice: 生了
  rationale: 该动词为阴性单数形式，明确以这位姊妹为生育主体；“生了”简洁自然，适合家谱体裁。
- source_word: אֵת
  choice: 不译
  rationale: 这是直接宾语标记，现代汉语无需另行表达。
- source_word: אִישְׁהוֹד
  choice: 伊施荷
  rationale: 按希伯来语人名音译。
- source_word: אֲבִיעֶזֶר
  choice: 亚比以谢
  rationale: 按希伯来语人名音译，并采用中文圣经读者较熟悉的形式。
- source_word: מַחְלָה
  choice: 玛拉
  rationale: 按希伯来语人名音译；此处是人名，不按可能的词源含义翻译。
theological_decisions: []
