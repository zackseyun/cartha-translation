  yaml_path: translation/ot/1_chronicles/007/033.yaml
  text: 'The sons of Japhlet: Pasach[a], Bimhal, and Ashvath[b]. These were the sons of Japhlet.'
translation:
  language: zh_hans
  text: 雅弗勒的儿子是帕萨赫[a]、比姆哈尔和亚实瓦特。这些是雅弗勒的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帕萨赫”或译“帕萨”；希伯来人名的音译方式不尽相同。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: 儿子
  rationale: 这是בֵּן的复数附属形式；在此直接列举家谱成员的语境中，译作“儿子”比宽泛的“子孙”更准确。
- source_word: יַפְלֵט
  choice: 雅弗勒
  rationale: 人名按希伯来语音译；采用自然且便于现代普通话读者辨读的形式。
- source_word: פָּסַךְ
  choice: 帕萨
  rationale: 人名音译。词末כְ在该名字中的具体读法与音译传统并不完全一致，正文采用较顺口的“帕萨”，并以脚注保留“帕萨赫”这一更显式反映末辅音的译法。
- source_word: וּבִמְהָל
  choice: 和比姆哈尔
  rationale: 前缀וּ独立译为“和”，专名בִמְהָל音译为“比姆哈尔”。
- source_word: וְעַשְׁוָת
  choice: 和亚实瓦
  rationale: 前缀וְ译为“和”；专名עַשְׁוָת按希伯来语音译为“亚实瓦”。
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 保留希伯来文指示词和系词省略所形成的家谱总结句，不将其无依据地改为过去时。
- source_word: בְּנֵי יַפְלֵט
  choice: 雅弗勒的儿子
  rationale: 完整重现末尾重复的家谱公式，以保存原文结构。
theological_decisions: []
