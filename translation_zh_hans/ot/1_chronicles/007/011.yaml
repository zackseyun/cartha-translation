  text: כָּל אֵ֜לֶּה בְּנֵ֤י יְדִֽיעֲאֵל֙ לְ/רָאשֵׁ֣י הָ/אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים שִׁבְעָֽה עָשָׂ֥ר אֶ֨לֶף֙ וּ/מָאתַ֔יִם יֹצְאֵ֥י צָבָ֖א לַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
translation:
  language: zh_hans
  text: 以上这些都是耶叠的子孙[a]。按父系家族的首领[b]统计，他们都是英勇善战的勇士[c]，共一万七千二百名，能出征打仗[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子孙”原文直译为“儿子们”；在家谱中也可泛指后裔。
    reason: lexical_alternative
  - marker: b
    text: “父系家族”指以共同男性祖先为纽带的宗族或家族单位。
    reason: cultural_note
  - marker: c
    text: 或译“有勇力的人”或“勇士”。此处语境指具有作战能力的人员。
    reason: lexical_alternative
  - marker: d
    text: 原文直译为“出去从军打仗的人”，指能够或符合条件出征服役的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: 以上这些
  rationale: 这是对前文所列人员的总结，保留希伯来文简洁的指代方式，不另加原文没有的名词。
- source_word: בְּנֵי יְדִיעֲאֵל
  choice: 耶叠的子孙
  rationale: בְּנֵי 字面为“儿子们”，但在家谱中常广指后裔；本节人数众多，译作“子孙”更符合现代汉语和家谱语境，并以脚注保留字面意义。
- source_word: לְרָאשֵׁי הָאָבוֹת
  choice: 按父系家族的首领统计
  rationale: 该短语指以父系宗族或家族首领为单位的编列。加入“统计”承接后面的总数，使汉语关系清楚，同时不把首领误算为一万七千二百人。
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: 英勇善战的人
  rationale: 该复数称谓强调勇力、才干，语境明确指作战人员；此译自然庄重，并保留其军事含义。
- source_word: שִׁבְעָה עָשָׂר אֶלֶף וּמָאתַיִם
  choice: 一万七千二百名
  rationale: 准确呈现希伯来文的明确统计数字，并以“名”配合人员计数。
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  choice: 都能随军出征作战
  rationale: 字面是“出去从军打仗的人”，为可出征服役者的军事表达；此译既传达资格或能力，也保留“出去”所含的出征意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。译文保留家谱和军籍统计的正式语气，以“父系家族”说明古代社会结构，以“随军出征作战”自然表达希伯来文军事惯用语。所有脚注标记均置于相应正文之后。
