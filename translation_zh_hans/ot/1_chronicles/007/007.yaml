base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
translation:
  language: zh_hans
  text: 比拉的儿子是以斯本、乌西、乌薛、耶利摩和以利，共五人；他们是父家的族长，都是英勇的战士。按家谱登记的人数[a]是二万二千零三十四人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的家谱”，或“他们按家谱登记的数目”。希伯来语所用的词指人被记入家谱记录。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶלַע
  choice: 比拉的儿子
  rationale: בְּנֵי直译为“儿子”，此处紧接五个人名；用“儿子”既符合家谱语境，也不排除该词在谱系中可泛指后代。
- source_word: אֶצְבּוֹן וְעֻזִּי וְעֻזִּיאֵל וִירִימוֹת וְעִירִי
  choice: 以斯本、乌西、乌薛、耶利摩和伊利
  rationale: 均为人名，按希伯来语形式音译，并采用现代中文圣经人名中清楚、易读的常见形式。
- source_word: חֲמִשָּׁה
  choice: 共五人
  rationale: 明确说明所列名字的总数；补出量词“人”，符合自然汉语。
- source_word: רָאשֵׁי בֵּית אָבוֹת
  choice: 父家首领
  rationale: 保留历代志中表示父系宗族单位及其领袖的社会、家谱术语，同时避免较生硬的“父亲之家”。
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: 英勇的战士
  rationale: 该短语可指勇猛、有作战能力的人；“英勇的战士”自然传达其军事意味和褒义色彩。
- source_word: וְהִתְיַחְשָׂם
  choice: 按家谱登记的人数
  rationale: 历代志中的יחש Hitpael词形指按谱系被登记或编入家谱记录；结合后面的总数，汉语中以“按家谱登记的人数”表达最清楚。
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וּשְׁלֹשִׁים וְאַרְבָּעָה
  choice: 二万二千零三十四人
  rationale: 准确表达希伯来文的22,000加34，并加量词“人”以与登记对象相配。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将较技术性的家谱与宗族表达译为“父家首领”和“按家谱登记的人数”，兼顾原文结构与普通读者的理解；分为两句，以避免中文长句累赘。
