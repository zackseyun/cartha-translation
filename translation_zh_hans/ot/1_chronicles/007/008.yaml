base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
translation:
  language: zh_hans
  text: 比结的儿子是细米拉、约阿施、以利以谢、以利约乃、暗利、耶利摩[a]、亚比雅、亚拿突和亚拉篾。这些都是比结的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶利摩”也可音译为“耶利末”。
    reason: 人名音译存在传统异体；脚注保留这一词汇选择差异，并正确锚定于相关人名。
lexical_decisions:
- source_word: וּבְנֵי בֶכֶר
  choice: 比结的儿子是
  rationale: 按家谱语境将 בְנֵי 译为“儿子”，保留明确的父系谱系用语；句首连接词 וּ 在中文连续家谱中无需机械译出，以自然句式承接上文。
- source_word: זְמִירָה
  choice: 西米拉
  rationale: 按希伯来语读音音译人名，末尾 ה 在此反映为 a 音。
- source_word: יוֹעָשׁ
  choice: 约阿施
  rationale: 采用现代中文圣经人名中通行且贴近希伯来语的译写。
- source_word: אֱלִיעֶזֶר
  choice: 以利以谢
  rationale: 采用通行中文圣经音译。
- source_word: אֶלְיוֹעֵינַי
  choice: 以利约乃
  rationale: 按希伯来语音节音译，并采用较易辨认的中文圣经人名形式。
- source_word: עָמְרִי
  choice: 暗利
  rationale: 采用通行中文圣经人名译写。
- source_word: יְרֵמוֹת
  choice: 耶利摩
  rationale: 按马所拉文本此处的发音音译；该名在中文传统中另有译写，置于脚注说明。
- source_word: אֲבִיָּה
  choice: 亚比雅
  rationale: 采用通行中文圣经音译，保留末尾神名成分所对应的传统译写。
- source_word: עֲנָתוֹת
  choice: 亚拿突
  rationale: 此处由家谱句法可知是人名，而非地名；采用通行音译。
- source_word: עָלָמֶת
  choice: 亚拉篾
  rationale: 依希伯来语音译，采用中文圣经传统中较常见的形式。
- source_word: כָּל אֵלֶּה בְּנֵי בָכֶר
  choice: 这些全都是比结的儿子
  rationale: 直接表达总结语，保留“全都”的强调，并使现代汉语流畅自然。
theological_decisions: []
translation_notes:
  register: 采用简体中文、现代而庄重的家谱文体。人名以希伯来文本为依据，并兼顾中文圣经读者熟悉的传统译名；不额外解释名字含义，也不将亚拿突误作地名。
