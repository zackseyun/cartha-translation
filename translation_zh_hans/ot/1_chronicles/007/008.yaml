revisions:
- from: 比结的儿子是西米拉、约阿施、以利以谢、以利约乃、暗利、耶利摩[a]、亚比雅、亚拿突和亚拉篾。这些全都是比结的儿子。
  to: 比结的儿子是细米拉、约阿施、以利以谢、以利约乃、暗利、耶利摩[a]、亚比雅、亚拿突和亚拉篾。这些都是比结的儿子。
  rationale: 修正细米拉的起首辅音译写，以贴合希伯来文并采用中文圣经常用形式；将总结句调整得更自然；脚注改用“音译”以准确说明异体性质。其余人名和家谱表达均可保留。
