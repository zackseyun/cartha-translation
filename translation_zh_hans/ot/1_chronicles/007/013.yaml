base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/013.yaml
  text: 'The sons of Naphtali: Jahziel[a], Guni, Jezer, and Shallum—the sons of Bilhah.'
translation:
  language: zh_hans
  text: 拿弗他利的儿子是雅薛、沽尼、耶色和沙龙[a]；这些人是辟拉的后代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《创世记》46:24中这个名字作“示冷”；《历代志》此处作“沙龙”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: 拿弗他利的儿子
  rationale: בְּנֵי 是“儿子”的复数构造式；此处列出四名男子，直译为“儿子”最为准确。拿弗他利按现代中文圣经常用形式音译。
- source_word: יַחֲצִיאֵל
  choice: 雅薛
  rationale: 按希伯来语专名音译，并采用现代中文读者较熟悉的圣经人名形式。
- source_word: גוּנִי
  choice: 沽尼
  rationale: 按希伯来语 גוּנִי 音译。
- source_word: יֵצֶר
  choice: 耶色
  rationale: 按希伯来语 יֵצֶר 音译，作为人名处理。
- source_word: שַׁלּוּם
  choice: 沙龙
  rationale: 忠实反映《历代志》马所拉文本的 שַׁלּוּם；与《创世记》46:24的异文差异留在脚注说明。
- source_word: בְּנֵי בִלְהָה
  choice: 他们都是辟拉的子孙
  rationale: 原文末尾是系谱性的同位说明。若直译“辟拉的儿子”，容易使现代读者误以为上述四人均由辟拉亲生；用“子孙”自然表达他们属于辟拉一系，同时保留系谱关系。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。分号将名单与末尾的系谱说明分开。脚注标记置于相关人名之后。
