base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/005.yaml
  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
translation:
  language: zh_hans
  text: 他们的族人遍及以萨迦所有家族，都是英勇的战士；按家谱登记的，总数为八万七千人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“他们全都按家谱登记。”原文的这个词说明这些人被列入家谱名册。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: 他们的族人
  rationale: אָח 字面为“兄弟”，但在本节支派谱系的语境中可泛指同族亲属；“族人”自然地表达这一范围，避免让现代读者误以为仅指亲兄弟。
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָׂשכָר
  choice: 按以萨迦各家族
  rationale: 介词 לְ 在此表示关联或划分范围；结合后面的谱系登记，“按……各家族”既符合名册语境，也保留原文按家族统计的含义。
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: 英勇善战的人
  rationale: 这一固定短语指有力量、勇武并具作战能力的人；“英勇善战”在现代汉语中庄重自然，也保留其军事意味。
- source_word: שְׁמוֹנִים וְשִׁבְעָה אֶלֶף
  choice: 八万七千名
  rationale: 按原文基数准确译出，并以“名”衔接被统计的人员。
- source_word: הִתְיַחְשָׂם
  choice: 登记
  rationale: יחשׂ 的 Hitpael 形式表示按家谱核定身份、列入谱系名册；正文结合“按以萨迦各家族”译作“登记”，简洁且符合行政谱系语境。
- source_word: לַכֹּל
  choice: 总共有
  rationale: 该短语总结全体数目；“总共有”清楚表达合计意义。
