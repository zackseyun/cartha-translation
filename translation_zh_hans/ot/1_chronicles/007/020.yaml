base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/020.yaml
  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
translation:
  language: zh_hans
  text: 以法莲的儿子是书提拉[a]；书提拉的儿子是比列，比列的儿子是他哈，他哈的儿子是以拉大，以拉大的儿子是他哈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“儿子”在族谱中有时也可指较远的后裔；本节各代原文均直译为“他的儿子”。
    reason: 说明族谱用语 בֵּן 可能具有较宽的世系含义，同时不改动正文的字面父子表达。
lexical_decisions:
- source_word: וּבְנֵי אֶפְרַיִם
  choice: 以法莲的儿子
  rationale: בְּנֵי 是 בֵּן 的复数构造形式，直译为“……的儿子”。句首的连接词 וּ 在族谱体裁中主要承接上文，中文不必机械译作“并且”。
- source_word: שׁוּתָלַח
  choice: 书提拉
  rationale: 采用现代中文圣经读者较熟悉的人名音译。
- source_word: וּבֶרֶד
  choice: 比列
  rationale: 按专名音译；前缀连接词在中文连续族谱句式中由标点和分句关系自然体现。
- source_word: בְּנוֹ
  choice: ……的儿子
  rationale: 该词由“儿子”与第三人称阳性单数后缀构成，字面义为“他的儿子”。中文逐次明确重复父名，比连续使用“他的儿子”更清楚，同时保留每一代的父子链条。
- source_word: וְתַחַת
  choice: 他哈
  rationale: 这里的 תַחַת 是人名，不取其普通词“在……下面”的意义；采用惯用中文音译。
- source_word: וְאֶלְעָדָה
  choice: 以拉大
  rationale: 作为族谱中的专名处理，采用中文圣经传统中较熟悉的音译。
- source_word: וְתַחַת בְּנוֹ
  choice: 以拉大的儿子是他哈
  rationale: 保留原文再次出现“他哈”以及“他的儿子”这一族谱公式，不因名字重复而省略。
theological_decisions: []
translation_notes:
  register: 采用清楚、庄重的现代汉语族谱句式。以分号区分标题式的首项与后续世系，再逐次重复父名，避免代词指向含混；保留原文连续的父子链和末尾人名重复。
