base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
translation:
  language: zh_hans
  text: 乌西的儿子：伊斯拉希雅。伊斯拉希雅的儿子是米迦勒、俄巴底亚、约珥和伊示雅；共五人[a]，都是首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马所拉文本在这里列出四个名字后，随即说“五人，都是首领”。“五人”所指及其计数存在疑问；一种理解是将伊斯拉希雅与这四个儿子合计为五人。“首领”也可理解为“家族首领”。
    reason: 说明原文列名与人数之间的计数疑问，并保留“首领”的家谱语境义。
lexical_decisions:
- source_word: וּבְנֵי עֻזִּי
  choice: 乌西的儿子
  rationale: בְּנֵי是“儿子们/后裔”的复数属格结构；在本节直接列出一名儿子，按现代汉语家谱体例译作“儿子”。句首连接词וּ不必机械译出，以保持中文自然。
- source_word: יִזְרַחְיָה
  choice: 伊斯拉希雅
  rationale: 按现代中文圣经人名的通行音译处理，并在本节两次出现时保持一致。
- source_word: מִיכָאֵל
  choice: 米迦勒
  rationale: 采用通行中文音译。
- source_word: וְעֹבַדְיָה
  choice: 俄巴底亚
  rationale: 采用通行中文音译；前缀连接词在中文人名并列中以顿号和“和”表达。
- source_word: וְיוֹאֵל
  choice: 约珥
  rationale: 采用通行中文音译。
- source_word: יִשִּׁיָּה
  choice: 伊示雅
  rationale: 采用通行中文音译；原名的具体汉字音译存在传统差异。
- source_word: חֲמִשָּׁה
  choice: 共五人
  rationale: 数字直译为“五”；加“共”和量词“人”，使中文家谱叙述自然，同时保留原文在只列四个儿子姓名后却说“五”的张力。
- source_word: רָאשִׁים
  choice: 首领
  rationale: רֹאשׁ的复数在家谱语境中指居首位、担任领导的人，可理解为宗族或家族首领；正文用较宽泛的“首领”，避免加入原文未明说的“族长”。
- source_word: כֻּלָּם
  choice: 都是
  rationale: 表达“他们全都”的总括和强调；与“首领”连用符合现代汉语习惯。
theological_decisions:
- issue: “五人”所包括的人物范围
  choice: 以“以上共五人”提示可将伊斯拉希雅与其四个具名儿子合计为五人，同时用脚注说明原文结构
  alternative: 把“五人”仅解释为伊斯拉希雅的儿子，假定另有一名儿子漏名
  rationale: 马所拉文本列出四个儿子的名字，却紧接着说“五”；最自然的计数可能包括伊斯拉希雅本人，但原文并未明确解释，故不应把这一理解绝对化。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语家谱文体。人名使用中文圣经中较通行的音译；不机械保留每个希伯来语连接词。正文保留“五人”与四个具名儿子之间的张力，并以脚注呈现可能解释。
