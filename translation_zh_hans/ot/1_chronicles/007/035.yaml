  text: 'The son of Helem his brother: Zophah[a], Imna, Shelesh, and Amal.'
translation:
  language: zh_hans
  text: 他兄弟希连的儿子是：琐法[a]、音那、示利斯和亚抹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琐法”也可音译为“琐法赫”。
    reason: 希伯来名 צוֹפַח 末尾字母 ח 的音译方式不同。
lexical_decisions:
- source_word: וּבֶן
  choice: 儿子有
  rationale: בֶן是单数形式，但后接四个人名；汉语“儿子”本身不标明单复数，以“有”引出名单，既自然，也不擅自改写原文的数。句首连接词וּ在延续家谱时不必机械译出。
- source_word: הֵלֶם
  choice: 希连
  rationale: 人名按现代中文圣经中通行而易读的形式音译。
- source_word: אָחִיו
  choice: 他兄弟
  rationale: 保留第三人称单数所属关系，不在正文中擅自指定“他”所指的前文人物，从而保存原文的指代张力。
- source_word: צוֹפַח
  choice: 琐法
  rationale: 人名音译为“琐法”；末尾ח也可在较严格的音译中体现为“赫”，故以脚注说明。
- source_word: וְיִמְנָע
  choice: 音那
  rationale: 人名音译；前缀连接词在中文名单中由顿号及末项前的“和”统一表达。
- source_word: וְשֵׁלֶשׁ
  choice: 示利斯
  rationale: 人名依希伯来语辅音形式作清楚、通行的中文音译。
- source_word: וְעָמָל
  choice: 和亚抹
  rationale: 末项人名音译，并用“和”表达希伯来语连接词及名单的收束。
theological_decisions: []
