  yaml_path: translation/ot/1_chronicles/007/036.yaml
  text: 'The sons of Zophah: Suah[a], Harnepher, Shual, Beri, and Imrah.'
translation:
  language: zh_hans
  text: 琐法的儿子[a]是书亚、哈尼弗、书阿勒、比利和音拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“后裔”。在家谱中，希伯来语“儿子”有时可泛指同一谱系中的后代；这里译作“儿子”更直接。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是“儿子”的复数附属形。在本节家谱中，直译为“儿子”最自然；该词也可能泛指同一谱系中的后裔，因此保留脚注说明。
- source_word: צוֹפָח
  choice: 琐法
  rationale: 按希伯来语马所拉文本音译此人名，并采用现代中文圣经读者较熟悉的形式。
- source_word: סוּחַ
  choice: 书亚
  rationale: 作为家谱中的人名音译，不按普通词义翻译。
- source_word: חַרְנֶפֶר
  choice: 哈尼弗
  rationale: 按希伯来语人名音译，并采用自然、易读的现代中文形式。
- source_word: שׁוּעָל
  choice: 书阿勒
  rationale: 该词在别处可作普通名词，但本节的句法和家谱语境表明它是人名，因此音译。
- source_word: בֵרִי
  choice: 比利
  rationale: 按本节马所拉文本的读音音译此人名，不与其他拼写较长的相近名字混同。
- source_word: יִמְרָה
  choice: 音拉
  rationale: 按希伯来语形式音译此人名，采用中文圣经中较熟悉且顺口的写法。
