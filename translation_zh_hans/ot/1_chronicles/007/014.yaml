base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
translation:
  language: zh_hans
  text: 玛拿西的儿子：亚斯列[a]，是玛拿西的妾——那位亚兰女子[b]——所生的；她生了玛吉，就是基列的父亲[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子”在家谱中有时也可泛指“后代”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“那亚兰女子”；传统译法有“叙利亚女子”。
    reason: lexical_alternative
  - marker: c
    text: “父亲”在家谱用语中也可能有“祖先”或“奠基者”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: 玛拿西的儿子
  rationale: בְּנֵי 是“儿子”的复数构造形式。家谱中可泛指后代，但正文保留其直接含义和家谱表达方式。
- source_word: אַשְׂרִיאֵל
  choice: 亚斯列
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: אֲשֶׁר יָלָדָה
  choice: 是……所生的
  rationale: 该关系从句中的动词为阴性单数，意为“她所生的”；中文用“是……所生的”自然表达，并让后置的女性主语成为施事者。
- source_word: פִּילַגְשׁוֹ
  choice: 他的妾
  rationale: פִּילֶגֶשׁ 指妾或地位次于正妻的女性伴侣；“妾”直接、简洁，也避免把其关系解释为正式妻子。
- source_word: הָאֲרַמִּיָּה
  choice: 那位亚兰女子
  rationale: 原文是带定冠词的阴性族称，直指一名亚兰女子；采用同位语表达，较“叙利亚女子”更符合古代族群和地域语境。
- source_word: יָלְדָה אֶת מָכִיר
  choice: 她又生了玛吉
  rationale: 重复“生”以体现原文第二个限定动词及其阴性主语；加“又”使中文中的连续生育记载清楚自然。
- source_word: אֲבִי גִלְעָד
  choice: 基列的父亲
  rationale: אָב 的直接含义是“父亲”；虽在家谱语境中也可能表示祖先或奠基者，正文保留最贴近原文的表达。
theological_decisions:
- issue: 亚斯列与玛拿西之妾的家谱关系
  choice: 依现存希伯来文本，把“所生的”理解为修饰亚斯列，并以“他的妾——那位亚兰女子”为女性主语。
  alternative: 依据其他家谱资料重构关系，或改写为只说玛吉由该女子所生。
  rationale: 本节现存语法虽造成家谱上的张力，但关系代词和阴性动词最自然地把亚斯列也纳入生育陈述；翻译不借其他经文静默校正本节。
translation_notes:
  register: 采用现代、庄重而易懂的家谱文体。“妾——那位亚兰女子——”以同位语保留原文信息次序和女性主语；分号呈现两次“生”的并列推进。所有脚注标记均紧随其所解释的词语或短语。
