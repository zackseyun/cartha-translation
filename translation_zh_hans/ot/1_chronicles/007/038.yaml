  text: 'And the sons of Jether: Jephunneh[a], Pispa, and Ara.'
translation:
  language: zh_hans
  text: 益帖的儿子是：耶孚尼、毗斯巴[a]和亚拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毗斯巴”也可音译作“皮斯帕”，反映较逐字母的转写传统。
    reason: 保留该希伯来人名另一种对应词尾字母的转写形式。
lexical_decisions:
- source_word: וּבְנֵי
  choice: 儿子是
  rationale: בְנֵי是“儿子”的复数构造形式，用于家谱名单；中文以“某人的儿子是”自然呈现这一固定表达。句首וּ承接上文，在连续家谱中不必机械译作“并且”。
- source_word: יֶתֶר
  choice: 益帖
  rationale: 按中文圣经人名的通行译法音译，且与上下文中的家谱人物名称保持一致。
- source_word: יְפֻנֶּה
  choice: 耶孚尼
  rationale: 作为人名音译；采用中文圣经传统中清楚、通行的形式。
- source_word: וּפִסְפָּה
  choice: 毗斯巴
  rationale: וּ表示名单中的连接关系；人名פִסְפָּה采用通行中文音译“毗斯巴”。另一个较贴近现代语音转写的形式列于脚注。
- source_word: וַאְרָא
  choice: 和亚拉
  rationale: 这是带连接词וַ的专名；在中文名单最后一项前译作“和”，人名译作“亚拉”。
