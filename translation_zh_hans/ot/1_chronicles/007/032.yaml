base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/032.yaml
  text: Heber fathered Japhlet[a], Shomer, Hotham[b], and Shua their sister.
translation:
  language: zh_hans
  text: 希别生了雅弗勒、朔默、何坦，以及他们的妹妹书雅。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶבֶר
  choice: 希别
  rationale: 人名按现代中文圣经常用音译处理。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 使役形在家谱语境中表示生育、成为父亲；“生了”简洁自然，符合中文家谱表达。
- source_word: יַפְלֵט
  choice: 雅弗勒
  rationale: 按希伯来语形式音译的人名。
- source_word: שׁוֹמֵר
  choice: 朔默
  rationale: 按马所拉文本的辅音与元音音译；英语层所列 Shemer 是英语拼写变体，并非此处希伯来文本的独立异文。
- source_word: חוֹתָם
  choice: 何坦
  rationale: 按希伯来语形式音译的人名。
- source_word: שׁוּעָא
  choice: 书雅
  rationale: 按希伯来语形式音译的人名；Shua/Shuah 的差别主要属于英语拼写惯例，无须在中文另设脚注。
- source_word: אֲחוֹתָם
  choice: 他们的妹妹
  rationale: 该词是“姐妹”加第三人称阳性复数后缀，直译为“他们的姐妹”；在家谱列名语境中，现代中文用“妹妹”更自然，并保留其指向此前几位男性的复数关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的家谱体表达。以原文为准，不机械移植仅与英语音译拼写有关的备选脚注；用“以及”清楚标示书雅与前三人不同，她是他们的妹妹。
