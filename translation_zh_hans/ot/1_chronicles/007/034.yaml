base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/034.yaml
  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
translation:
  language: zh_hans
  text: 朔默的儿子[a]有亚希、罗迦、耶户巴[b]和亚兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来家谱中的“儿子”有时也可指男性后裔或宗族成员，不一定仅指亲生儿子。
    reason: cultural_note
  - marker: b
    text: 这个名字也可音译为“户巴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: 儿子
  rationale: 这是בֵּן的构造式复数并带连接词；在家谱中用“儿子”自然且贴近原文，但此类表达也可泛指男性后裔或宗族成员。句首的连接词不必机械译作“和”，中文以承接上下文的家谱句式自然表达。
- source_word: שָׁמֶר
  choice: 朔默
  rationale: 按中文圣经人名的通行音译处理此专名，并与历代志上同一人物的译名保持一致。
- source_word: אֲחִי
  choice: 亚希
  rationale: 虽然该词形在别的语境中可能与“兄弟”一词有关，但在此家谱名单中是人名，故音译。
- source_word: וְרוֹהְגָה
  choice: 罗迦
  rationale: 作为人名音译；前置连接词由中文列举结构统一表达。
- source_word: יְחֻבָּה
  choice: 耶户巴
  rationale: 按马所拉读音及中文惯用音译处理；开头的י可音译为“耶”，但不同传统也可能简译为“户巴”。
- source_word: וַאֲרָם
  choice: 和亚兰
  rationale: אֲרָם直接音译为“亚兰”；连接词在名单末项自然译作“和”。
theological_decisions: []
translation_notes:
  register: 采用简洁庄重的现代汉语家谱句式。“有”使中文列名自然，同时不增加亲属关系之外的信息；所有人名采用简体中文圣经读者较熟悉的音译形式。
