  yaml_path: translation/ot/1_chronicles/007/022.yaml
  text: And Ephraim their father mourned for many days[a], and his brothers came to comfort him.
translation:
  language: zh_hans
  text: 他们的父亲以法莲哀伤了许多天；他的弟兄来安慰[a]他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安慰”或译“劝慰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַבֵּל
  choice: 悲哀
  rationale: אבל 的 Hitpael 形式在此指因丧亲而哀伤、服丧；结合上一节死亡的语境，“悲哀”自然且准确。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֲבִיהֶם
  choice: 为他们的父亲
  rationale: 保留原文“他们的父亲”这一明确关系；用“以法莲为他们的父亲”使现代中文表达通顺，也避免误读为“以法莲的父亲”。
- source_word: יָמִים רַבִּים
  choice: 许多天
  rationale: 这是表示持续时间的常见希伯来语表达，直译为“许多天”即可自然传达时长。
- source_word: וַיָּבֹאוּ
  choice: 都来
  rationale: בוא 在叙事中表示来到；“来”符合他们前往以法莲身边的语境。“都”顺应复数主语，使中文自然，但不额外改变命题内容。
- source_word: אֶחָיו
  choice: 他的弟兄们
  rationale: אָח 加第三人称阳性单数后缀通常指“他的兄弟”；保留较正式、适合经文体的“弟兄”，不无根据地扩大为“亲族”。
- source_word: לְנַחֲמוֹ
  choice: 安慰他
  rationale: נחם 的 Piel 不定式在丧亲语境中指安慰、劝慰哀伤者；“安慰他”是现代中文最通行自然的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。为清楚表达 אֲבִיהֶם 的指向，译作“以法莲为他们的父亲”，而非可能产生歧义的“他们的父亲以法莲”。脚注标记依其实际对应词置于“安慰他”之后；英文咨询层所给标记位置与脚注内容不一致，未予照搬。
