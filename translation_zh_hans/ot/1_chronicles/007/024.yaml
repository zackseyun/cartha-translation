base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/024.yaml
  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
translation:
  language: zh_hans
  text: 他的女儿舍伊拉建造了下伯和仑和上伯和仑[a]，又建造了乌羡－舍伊拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“和上面的”，其中“伯和仑”承接上文。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ שֶׁאֱרָה
  choice: 他的女儿舍伊拉
  rationale: 希伯来文直译为“而他的女儿舍伊拉”。中文无需补出系词即可自然表达亲属关系和名字，也不必在本节开头生硬保留连接词。
- source_word: וַתִּבֶן
  choice: 建造了
  rationale: בנה 的通常含义是“建造”。经文没有明确说明是创建、重建还是加固，因此不作进一步限定。
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: 下伯和仑
  rationale: 采用现代中文圣经读者熟悉的地名音译，并把“下”置于地名前，符合中文地名表达习惯。
- source_word: הָעֶלְיוֹן
  choice: 上伯和仑
  rationale: 希伯来文只写“上面的”，承接前面的“伯和仑”；中文补出地名，以清楚呈现两个地点的对应关系。
- source_word: אֻזֵּן שֶׁאֱרָה
  choice: 乌羡－舍伊拉
  rationale: 按专名音译，并用连接号显示这是一个复合地名，避免读者误以为是两个并列地点或人名。
theological_decisions: []
