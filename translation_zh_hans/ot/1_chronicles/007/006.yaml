- source_word: בִּנְיָמִן
  choice: 便雅悯
  rationale: 采用现代中文圣经中通行的人名译法；结合家谱语境，将省略的亲属关系明确为“便雅悯的儿子”。
- source_word: בֶּלַע
  choice: 比拉
  rationale: 采用该希伯来人名通行的中文音译。
- source_word: בֶּכֶר
  choice: 比结
  rationale: 采用中文圣经传统中较为人熟知的译名；希伯来语形式更直接的现代音译可作“贝克尔”，故以脚注说明。
- source_word: יְדִיעֲאֵל
  choice: 耶叠
  rationale: 采用该人名通行的中文译法，简洁且便于现代读者辨认。
- source_word: שְׁלֹשָׁה
  choice: 共三人
  rationale: 这是对前述三个名字的总数说明；加入“共”和量词“人”，使中文自然清楚。
- source_word: '[家谱体例中隐含的关系]'
  choice: 便雅悯的儿子是：
  rationale: 原文为无动词的省略式家谱标题；根据上下文补出“儿子是”，既符合原意，也使现代中文完整自然。
