base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
translation:
  language: zh_hans
  text: 沿着玛拿西子孙的边界，有伯善及其附属城镇[a]、他纳及其附属城镇、米吉多及其附属城镇、多珥及其附属城镇[b]。以色列的儿子约瑟的子孙住在这些地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “附属城镇”也可译为“村庄”。希伯来文直译为“女儿们”，是指附属于主要城邑的周边聚落。
    reason: lexical_alternative
  - marker: b
    text: “沿着玛拿西子孙的边界”也可译为“在玛拿西子孙旁边”。这里的希伯来语表达方位关系，所指可能是地域毗邻或边界相接。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יְדֵי
  choice: 在……的边界旁
  rationale: 这是地域列表中的方位用语，表示毗邻或沿界，不按字面译作“在手旁”；此译既自然，也保留与玛拿西领地相邻的含义。
- source_word: בְנֵי מְנַשֶּׁה
  choice: 玛拿西子孙
  rationale: בְנֵי 在支派和地域语境中指玛拿西的后裔；“子孙”比字面的“儿子们”更符合现代汉语，同时保留谱系关系。
- source_word: בֵּית שְׁאָן
  choice: 伯善
  rationale: 采用现代中文圣经地名中通行且简洁的音译。
- source_word: וּבְנֹתֶיהָ / וּבְנוֹתֶיהָ
  choice: 和属它的乡镇
  rationale: 希伯来文直译为“它的女儿们”，在城市列表中指隶属于中心城的周边聚落；“属它的乡镇”清楚表达依附关系，并以脚注保留原有隐喻。
- source_word: תַּעְנַךְ
  choice: 他纳
  rationale: 采用通行的现代中文圣经地名音译。
- source_word: מְגִדּוֹ
  choice: 米吉多
  rationale: 采用通行的现代中文圣经地名音译。
- source_word: דּוֹר
  choice: 多珥
  rationale: 采用通行的现代中文圣经地名音译。
- source_word: בְאֵלֶּה
  choice: 在这些地方
  rationale: 所指的是前面列出的城邑及其附属聚落；补出“地方”使现代汉语指代清楚。
- source_word: יָשְׁבוּ
  choice: 住
  rationale: 此处表示居住、定居；“住”自然简明，且不额外强调最初占领的动作。
- source_word: בְנֵי יוֹסֵף
  choice: 约瑟的子孙
  rationale: 在支派语境中指约瑟的后裔；使用“子孙”符合现代汉语的群体称谓。
- source_word: בֶּן יִשְׂרָאֵל
  choice: 以色列的儿子约瑟
  rationale: 保留约瑟与以色列之间直接的父子身份说明，并调整语序以符合自然汉语。
