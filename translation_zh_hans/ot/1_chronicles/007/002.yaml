base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
translation:
  language: zh_hans
  text: 陀拉的儿子是乌西、利法雅、耶利、雅买、易伯散和示母利；他们按着自己的世系[c]，是陀拉宗族父系家族的首领，也是英勇善战的人[b]。大卫的时代，他们共有二万二千六百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “英勇善战的人”也可译作“勇士”或“英勇的人”。
    reason: lexical_alternative
  - marker: c
    text: “按着自己的世系”也可译作“按着各自的世代”或“按家谱登记”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  choice: 陀拉的儿子
  rationale: 在家谱名单中，בנים首先指“儿子”；省略句首连接词，使现代汉语表达自然。
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: 各父系家族的首领
  rationale: רָאשִׁים在这里指家族领袖；בֵית אָבוֹת是以父系祖先为单位的宗族组织，译作“父系家族”比直译“父家”更易懂。
- source_word: לְתוֹלָע
  choice: 陀拉宗族
  rationale: 介词短语表明这些家族首领隶属陀拉这一支系；“陀拉宗族”以自然汉语表达这种归属关系。
- source_word: גִּבּוֹרֵי חַיִל
  choice: 英勇善战的人
  rationale: 该固定短语兼有勇武、能力和战士身份的意味；本节带有人数统计的军事语境，因此保留其武勇色彩。
- source_word: לְתֹלְדוֹתָם
  choice: 按着各自的世系
  rationale: תולדות在家谱语境中指世代、谱系或家谱登记；“世系”既简明，也不把含义限定为某种具体登记形式。
- source_word: בִּימֵי דָוִיד
  choice: 大卫的时代
  rationale: 原文直义是“大卫的日子”；译作“大卫的时代”自然且不额外补入“在位”这一原文未明说的信息。
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 二万二千六百人
  rationale: 准确转换希伯来文数字，并按现代汉语人口统计习惯补出量词“人”。
