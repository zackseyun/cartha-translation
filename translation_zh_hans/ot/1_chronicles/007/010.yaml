  text: 'And the sons of Jediael: Bilhan. And the sons of Bilhan: Jeush[a], Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar.'
translation:
  language: zh_hans
  text: 耶叠的儿子是比勒罕。比勒罕的儿子是耶乌施[a]、便雅悯、以笏、基拿拿、细坦、他施和亚希沙哈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来文名字形式（יעיש）较不寻常。正文按这份家谱可能所指的人名译作“耶乌施”；也可音译作“雅伊施”或“雅施”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְדִיעֲאֵל
  choice: 耶叠的儿子
  rationale: בֵּן 在家谱中可泛指后裔，但这里是紧接的父子谱系，译作“儿子”最自然；句首连接词在中文连续家谱中不必机械译出。耶叠采用现代中文圣经中较通行的人名音译。
- source_word: בִּלְהָן
  choice: 比勒罕
  rationale: 按希伯来语人名音译，并采用中文读者较熟悉的传统形式。
- source_word: יעיש
  choice: 耶乌施
  rationale: 经文中的辅音形式较不寻常，可能指家谱中通常写作 יְעוּשׁ 的名字；正文采用较通行的“耶乌施”，并以脚注保留其他音译可能。
- source_word: וּבִנְיָמִן
  choice: 便雅悯
  rationale: 采用该希伯来人名在中文圣经中的标准传统译名。
- source_word: וְאֵהוּד
  choice: 以笏
  rationale: 采用该希伯来人名在中文圣经中的通行译名。
- source_word: וּכְנַעֲנָה
  choice: 基拿拿
  rationale: 这里是人名 כְּנַעֲנָה，不是地名或族名“迦南”，故按人名音译。
- source_word: וְזֵיתָן
  choice: 细坦
  rationale: 按希伯来语人名音译，并沿用较通行的中文形式。
- source_word: וְתַרְשִׁישׁ
  choice: 他施
  rationale: 该词在别处也可指地名，但本节家谱语境明确将其用作人名；采用通行音译“他施”。
- source_word: וַאֲחִישָׁחַר
  choice: 亚希沙哈
  rationale: 按希伯来语形式音译，不将其词素含义意译为名字的解释。
