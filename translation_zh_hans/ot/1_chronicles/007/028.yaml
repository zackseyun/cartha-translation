base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/028.yaml
  text: Their holdings and settlements were Bethel and its daughter towns[a], and to the east Naaran, and to the west Gezer and its daughter towns, and Shechem and its daughter towns[c][b], as far as Ayyah and its daughter towns.
translation:
  language: zh_hans
  text: 他们的产业和居住地包括伯特利及其属镇[b]；向东是拿兰[a]，向西是基色及其属镇、示剑及其属镇，直到亚雅[c]及其属镇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译本根据别处相关的地名传统，将“拿兰”译作“拿拉”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“女儿们”，这里是指隶属于主要城邑的附属小城或村镇。
    reason: cultural_note
  - marker: c
    text: 希伯来文本作“亚雅”；有些古代文本见证和译本所反映的地名则是“迦萨”。
    reason: textual_variant
lexical_decisions:
- source_word: אֲחֻזָּתָם
  choice: 他们的产业
  rationale: 该词在这里指土地或领地性的产业；“产业”既保留所有权含义，也适合随后列举地域与城镇的语境。
- source_word: מֹשְׁבוֹתָם
  choice: 居住地
  rationale: 指族人在领地内定居、居住的地方；“居住地”自然清楚，又不把它限定为某一种聚落规模。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: בְנֹתֶיהָ
  choice: 属镇
  rationale: 原文直译为“她的女儿们”，是指隶属于主要城邑的附属小城或村镇。“属镇”用简洁的现代汉语传达这种从属关系，原有比喻则在脚注中说明。
- source_word: לַמִּזְרָח
  choice: 东边
  rationale: 表达领地或地点在东方的方位，与下文“西边”形成自然对应。
- source_word: נַעֲרָן
  choice: 拿兰
  rationale: 按马所拉文本的读音转写，并采用符合现代汉语音译习惯的形式；相关地名传统中的另一形式在脚注保留。
- source_word: לַמַּעֲרָב
  choice: 西边
  rationale: 清楚表达西方的方位，并与“东边”对称。
- source_word: גֶּזֶר
  choice: 基色
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: שְׁכֶם
  choice: 示剑
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: עַד
  choice: 直到
  rationale: 在此标明地域延伸所达到的界限；“直到”简明自然。
- source_word: עַיָּה
  choice: 亚雅
  rationale: 依马所拉文本 עַיָּה 音译，不在正文中以古代见证所反映的另一地名取代它；异文另列脚注。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。正文保留原文的地域列举结构，以分号和顿号帮助阅读；地名采用中文圣经中通行的译名，马所拉文本中的“亚雅”则按原文音译。脚注标记放在各自所说明的词语之后。
