revisions:
- from: 与他们一同的，按他们的世系和父家计算，共有三万六千名编入军队的作战兵员[a]，因为他们有许多妻子[b]和儿子。
  to: 此外，按他们的世系和父家计算，他们有三万六千名作战部队[a]，因为他们有许多妻子[b]和儿子。
  rationale: 修订消除了中文悬空结构，以“此外”在不武断限定前文关系的情况下表达וַעֲלֵיהֶם的列表性关联；将军事人员改为“作战部队”，避免添加“编入”的动作含义，并保留原文所指军事编制的集体性质。脚注锚点仍分别紧随军事短语与“妻子”，完整保留。
