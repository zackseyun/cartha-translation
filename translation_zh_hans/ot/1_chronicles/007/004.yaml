  naturalness: 建议以“此外，按他们的世系和父家计算”自然表达列表语境中的关联/附加意思，并将军事短语译为“作战部队”，使句子在现代标准汉语中通顺、庄重且不冗赘。
  terminology: “父家”适合保留古代父系宗族单位；“妻子”和“儿子”符合此处族谱语境。军事短语宜用“作战部队”，并在脚注说明其压缩而叠加的军事用语及可行替代译法。
