base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
translation:
  language: zh_hans
  text: 此外，按他们的世系和父家计算，他们有三万六千名作战部队[a]，因为他们有许多妻子[b]和儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是一个紧凑的军事短语，字面上叠用“队伍、军队、战争”等词；也可译作“为作战而设的军事分队”或“战争军队的队伍”。
    reason: lexical_alternative
  - marker: b
    text: “妻子”所译的希伯来词也可意为“女人”；这里处于族谱和家族繁衍的语境，译作“妻子”较合适。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלֵיהֶם
  choice: 与他们一同的
  rationale: 这里的 עַל 带代词后缀，用于名册语境，指与前述人物相关或同列的人；译作“与他们一同的”比空间意义的“在他们之上”更符合上下文。
- source_word: לְתֹלְדוֹתָם
  choice: 按他们的世系
  rationale: תּוֹלְדוֹת 在此指按血统排列的世代或谱系；“世系”简洁保留族谱含义。
- source_word: לְבֵית אֲבוֹתָם
  choice: 按……父家
  rationale: 这是以父系家族为单位的固定表达；“父家”保留古代以父系家室为社会组织单位的含义，同时在现代中文中尚可理解。
- source_word: גְּדוּדֵי צְבָא מִלְחָמָה
  choice: 编入军队的作战兵员
  rationale: 原文连续叠用“队伍／军队／战争”三个军事词。“编入军队的作战兵员”以自然中文表达其军事编组及作战用途，又不把它泛化为普通人口。
- source_word: שְׁלֹשִׁים וְשִׁשָּׁה אָלֶף
  choice: 三万六千名
  rationale: 准确表达数目；量词“名”表明这里统计的是军中人员。
- source_word: כִּי
  choice: 因为
  rationale: 引出人数众多的原因。
- source_word: הִרְבּוּ
  choice: 有许多
  rationale: רבה 的使役式本有“使增多”之意；以妻子和儿子为宾语时，中文“有许多”最自然。
- source_word: נָשִׁים
  choice: 妻子
  rationale: נָשִׁים 可指“女人”或“妻子”；在家族繁衍和族谱统计的语境中，与“儿子”并列时，“妻子”更贴切。
- source_word: וּבָנִים
  choice: 和儿子
  rationale: בָּנִים 直指“儿子”；族谱语境下不扩译为较宽泛的“儿女”或“孩子”。
