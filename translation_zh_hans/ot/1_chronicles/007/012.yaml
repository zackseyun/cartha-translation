  text: וְ/שֻׁפִּ֤ם וְ/חֻפִּם֙ בְּנֵ֣י עִ֔יר חֻשִׁ֖ם בְּנֵ֥י אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/012.yaml
  text: And Shuppim and Huppim were the sons of Ir[b][a]; Hushim was the son of Aher.
translation:
  language: zh_hans
  text: 书品和户品[b]是以珥的儿子；户伸是亚合的儿子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“亚合的众子”。这里的句法较难：复数“众子”与单数名字“户伸”连用。有人把“亚合”看作人名，也有人把这个词理解为“另一个”。
    reason: lexical_alternative
  - marker: b
    text: 参照相关族谱中的对应名字，有些译本将“书品、户品”译作“书反、户反”等形式。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/שֻׁפִּם
  choice: 书品
  rationale: 按马所拉文本将专名音译为“书品”；词首连词与下一人名合并处理为自然的中文并列结构“书品和户品”。
- source_word: וְ/חֻפִּם
  choice: 户品
  rationale: 按马所拉文本音译该专名；相关族谱中的对应形式可能产生不同译名，故以脚注说明。
- source_word: בְּנֵי
  choice: 是……的儿子
  rationale: 族谱语境中通常指儿子；希伯来语为无动词句，中文补出“是”以形成自然判断句。
- source_word: עִיר
  choice: 以珥
  rationale: 将马所拉文本的专名 עִיר 音译为中文圣经人名形式“以珥”，不按相关族谱中的近似形式改写。
- source_word: חֻשִׁם
  choice: 户伸
  rationale: 将该专名按希伯来语音译，并采用简明、可辨识的中文人名形式。
- source_word: בְּנֵי אַחֵר
  choice: 是亚合的儿子[a]
  rationale: 正文依族谱语境把 אַחֵר 视为专名“亚合”，并将形态上为复数的 בְּנֵי 用自然中文表达为单数“儿子”；原文的数不一致及“另一个”的词义可能性保留在脚注中。
theological_decisions:
- issue: בְּנֵי אַחֵר 的句法与 אַחֵר 的身份
  choice: 正文译作“户伸是亚合的儿子”，把 אַחֵר 作为人名
  alternative: “户伸是另一个人的众子”或保留“亚合的众子”
  rationale: 该短语在数上不协调：单数专名“户伸”后接复数“众子”。族谱语境及马所拉读音支持把 אַחֵר 看作人名，但原文也可按普通词义理解为“另一个”；正文采用最可读的族谱表达，脚注明确保留歧义与文本难点。
translation_notes:
  register: 采用现代、庄重而简洁的族谱文体。专名使用易读的中文音译；正文不刻意复制希伯来语的数不一致，以免造成“一个人是众子”的误解，但用脚注完整呈现原文形式及其歧义。
