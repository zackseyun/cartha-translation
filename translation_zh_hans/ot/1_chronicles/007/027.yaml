  yaml_path: translation/ot/1_chronicles/007/027.yaml
  text: Nun his son[a], Joshua his son.
translation:
  language: zh_hans
  text: 嫩是他的儿子[a]，约书亚是他的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在每个人名后都重复“他的儿子”这一表达，是家谱中表示逐代相承的常见写法：“嫩是他的儿子，约书亚是他的儿子。”
    reason: cultural_note
lexical_decisions:
- source_word: נ֥וֹן
  choice: 嫩
  rationale: 希伯来人名 Nûn；采用现代中文圣经中通行的人名译法“嫩”，与“约书亚”及相关家谱名称保持一致。
- source_word: בְּנ֖/וֹ
  choice: 是他的儿子
  rationale: בֵּן 加第三人称阳性单数词尾，直译为“他的儿子”；在中文家谱语境中补出“是”，使句子自然清楚，同时保留亲子关系。
- source_word: יְהוֹשֻׁ֥עַ
  choice: 约书亚
  rationale: 希伯来人名 Yəhôšuaʿ；采用现代中文圣经通行译名“约书亚”。
- source_word: בְּנֽ/וֹ
  choice: 是他的儿子
  rationale: 保留原文重复的家谱套语，表明人物依次为父子关系，而不把两组关系压缩合并。
