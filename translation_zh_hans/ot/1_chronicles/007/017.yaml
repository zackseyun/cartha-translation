  yaml_path: translation/ot/1_chronicles/007/017.yaml
  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
translation:
  language: zh_hans
  text: 乌兰的儿子们：比但。这些人是基列的儿子[a]；基列是玛吉的儿子，玛吉是玛拿西的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“这些是基列的儿子……”这句话可能是谱系总结，把乌兰这一支经由基列、玛吉追溯到玛拿西；“这些人”具体指代的范围未明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אוּלָם
  choice: 乌兰的儿子是
  rationale: 保留谱系用语“儿子”，并省略汉语中不自然的句首“和”；原文复数“儿子们”后仅列比但一人，译文不擅自修正这一张力。
- source_word: בְּדָן
  choice: 比但
  rationale: 按现代中文圣经常见音译处理人名。
- source_word: אֵלֶּה
  choice: 这些人是
  rationale: 原文只有指示词“这些”，系词需按汉语补出；采用“是”而非“曾是”，因为希伯来语本身未标明时态。
- source_word: בְּנֵי גִלְעָד
  choice: 基列的子孙
  rationale: בנים 在谱系总结中可指后裔；译作“子孙”比字面的“儿子们”更自然，也能表达本句向上追溯谱系的作用。
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: 基列是玛吉的儿子，玛吉是玛拿西的儿子
  rationale: 将连续的希伯来语谱系结构在汉语中展开，明确每个“儿子”所指的关系，避免误读为基列同时是玛吉和玛拿西之子。
theological_decisions:
- issue: “这些人”所概括的范围
  choice: 保留“这些人是基列的子孙”的概括表达
  alternative: 明确解释为只指乌兰和比但，或泛指前文全部名单
  rationale: 原文没有明确限定指示词 אֵלֶּה 的指代范围；不在正文中替读者消除这项谱系歧义。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语谱系体。正文保留原文由复数“儿子”引出单一姓名的现象，并以脚注说明总结句可能承担的谱系衔接功能。
