base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
translation:
  language: zh_hans
  text: 玛吉的妻子玛迦生了一个儿子，给他取名叫毗勒施[a]。他的兄弟名叫示利施；示利施的儿子[b]是乌兰和利金。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“称他的名为毗勒施。”
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来语特指男性后代，因此译作“儿子”，而不是泛指的“儿女”。
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: 在家谱语境中，ילד表示生育；“生了”简洁自然，并保留叙事动作。
- source_word: מַעֲכָה אֵשֶׁת מָכִיר
  choice: 玛吉的妻子玛迦
  rationale: 准确表达同位关系，同时按现代汉语习惯先交代关系，再说姓名。
- source_word: בֵּן
  choice: 一个儿子
  rationale: 单数בֵּן在此指男性子嗣；加“一个”符合现代汉语引入新人物的表达。
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: 给他取名叫
  rationale: 希伯来语字面为“称他的名”；“给他取名叫”是现代汉语自然且准确的对应表达。
- source_word: פֶּרֶשׁ
  choice: 毗勒施
  rationale: 采用中文圣经传统中较通行的音译。
- source_word: וְשֵׁם אָחִיו
  choice: 他的兄弟名叫
  rationale: 保留אָחִיו只表“兄弟”而未说明长幼的含混性，避免擅自译成“哥哥”或“弟弟”。
- source_word: שָׁרֶשׁ
  choice: 示利施
  rationale: 采用中文圣经传统中较通行的音译。
- source_word: וּבָנָיו
  choice: 示利施的儿子
  rationale: בָּנִים在此为男性复数“儿子”；明确重复“示利施”，使紧邻先行词所指在中文里清楚，避免代词误指毗勒施。
- source_word: אוּלָם וָרָקֶם
  choice: 乌兰和利金
  rationale: 采用中文圣经传统中较通行的姓名音译，并用“和”表达并列。
