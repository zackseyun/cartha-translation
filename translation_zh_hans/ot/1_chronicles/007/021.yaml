base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
translation:
  language: zh_hans
  text: 他的儿子撒拔，撒拔的儿子书提拉，以及以谢和以列；生在这地的迦特人[a]杀了他们，因为他们[b]曾下去取走那些迦特人的牲畜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“本地的迦特人”。希伯来语直译为“迦特人，即那些生在这地的人”。
    reason: lexical_alternative
  - marker: b
    text: 按上下文，“他们”指最接近的复数先行对象以谢和以列。
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹ
  choice: 他的儿子／撒拔的儿子
  rationale: בֵּן带第三人称阳性单数后缀，直译为“他的儿子”。第二处在中文中明确为“撒拔的儿子”，使连续家谱关系自然清楚，同时保留原文的世系结构。
- source_word: וְעֵזֶר וְאֶלְעָד
  choice: 以及以谢和以列
  rationale: 按希伯来语人名音译；用“以及……和……”自然衔接名单中的最后两人。
- source_word: וַהֲרָגוּם
  choice: 杀了他们
  rationale: הרג的Qal连续式，带第三人称阳性复数宾语后缀；“杀了他们”直接、清楚地表达其通常意义。
- source_word: אַנְשֵׁי גַת
  choice: 迦特人
  rationale: 该结构指迦特的男子或居民；现代汉语以“迦特人”表达最自然，不必生硬译成“迦特的男人们”。
- source_word: הַנּוֹלָדִים בָּאָרֶץ
  choice: 生在当地的
  rationale: 紧贴被动分词“在那地出生的”，并以“当地”自然表达语境中的那片土地；“本地的”是可能的概括性译法，列入脚注。
- source_word: כִּי
  choice: 因为
  rationale: 引出被杀的原因，现代汉语用“因为”清楚自然。
- source_word: יָרְדוּ
  choice: 曾下去
  rationale: 保留“下去”的地势表达；“曾”表明此行动先于被杀事件，但不额外解释其具体方向。
- source_word: לָקַחַת
  choice: 夺取
  rationale: לקח本义范围较广，可译“拿取”；本处涉及进入他人地区取走牲畜，“夺取”较符合语境，但未强化为更具体的军事劫掠。
- source_word: מִקְנֵיהֶם
  choice: 那些迦特人的牲畜
  rationale: מִקְנֶה通常指牲畜、畜群。原文第三人称复数后缀按语境回指杀人的迦特人；中文若连续使用“他们……他们的牲畜”容易误解为行动者夺取自己的牲畜，因此适度明示回指对象。
theological_decisions:
- issue: יָרְדוּ“下去”的复数主语
  choice: 正文保留“他们”，脚注说明按上下文通常指以谢和以列
  alternative: 在正文直接译作“以谢和以列曾下去”
  rationale: 希伯来语动词只标明复数主语，没有重复人名。保留代词可维持原文的指称形式与一定程度的歧义；脚注提供最自然的上下文理解，而不把解释写死在正文中。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述语体。以分号区分家谱名单与随后发生的事件；人名采用简体中文圣经传统中常见的译名。
