  text: כָּל אֵ֣לֶּה בְנֵי אָ֠שֵׁר רָאשֵׁ֨י בֵית הָ/אָב֤וֹת בְּרוּרִים֙ גִּבּוֹרֵ֣י חֲיָלִ֔ים רָאשֵׁ֖י הַ/נְּשִׂיאִ֑ים וְ/הִתְיַחְשָׂ֤/ם בַּ/צָּבָא֙ בַּ/מִּלְחָמָ֔ה מִסְפָּרָ֣/ם אֲנָשִׁ֔ים עֶשְׂרִ֥ים וְ/שִׁשָּׁ֖ה אָֽלֶף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
translation:
  language: zh_hans
  text: 这些人全都是亚设的子孙，是父系家族的首领、精选的人、英勇的战士和众首领中的领袖。他们按家谱登记在册[a]，编入军队参战；他们的人数共有二万六千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他们被列入家谱”或“他们按谱系注册”。《历代志》中这个希伯来语动词常指按家谱登记。
    reason: 保留该动词在行政登记与家谱编录之间的词义范围。
lexical_decisions:
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  choice: 父系家族的首领
  rationale: 保留“父家”这一父系宗族结构的含义，同时采用现代汉语中较易理解的表达。
- source_word: בְּרוּרִים
  choice: 精选的人
  rationale: 该被动分词表示经过挑选、出众的人；“精选的人”既传达被选出的意味，也符合军事名册的语境。
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: 英勇的战士
  rationale: 这是常见的军事称谓，兼顾勇力与作战身份，避免古奥措辞。
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  choice: 众首领中的领袖
  rationale: 原文是压缩式的高阶领袖称谓；此译法保留其在众首领中居首的含义，不把 נְשִׂיאִים 误解为君王之子。
- source_word: וְהִתְיַחְשָׂם
  choice: 他们按家谱登记
  rationale: יחש 的 Hitpael 形式在《历代志》中通常指按谱系核查并登记；此处与军事编制相连，故明确译出家谱登记。
- source_word: בַּצָּבָא בַּמִּלְחָמָה
  choice: 编入军队参战
  rationale: 用自然、简洁的现代汉语表达进入军队、用于战争的目的关系。
- source_word: מִסְפָּרָם אֲנָשִׁים
  choice: 登记的男丁共有
  rationale: אֲנָשִׁים 在军事人口统计中指男性人员；结合上文名册语境译为“登记的男丁”，使计数对象清楚。
- source_word: עֶשְׂרִים וְשִׁשָּׁה אָלֶף
  choice: 二万六千人
  rationale: 按现代汉语数字习惯准确表达原文数目。
theological_decisions: []
