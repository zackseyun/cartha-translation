base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/009.yaml
  text: 'They were enrolled by genealogy[a], according to their generations, as heads of their fathers’ houses[b], mighty men of valor: twenty thousand two hundred.'
translation:
  language: zh_hans
  text: 他们按各自的世代被编入家谱[a]；他们是父家的首领，都是英勇的勇士，共二万零二百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按家谱登记。”希伯来文动词指被列入家谱记录。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְיַחְשָׂם
  choice: 他们按世系登记
  rationale: 该词是יחשׂ的Hitpael形式，在《历代志》中指被列入或记载于家谱名册；“按世系登记”既表达登记行为，也保留家谱行政语境。
- source_word: לְתֹלְדוֹתָם
  choice: 按着各自的世代
  rationale: תולדות可指世代、后代或家族谱系；这里采用较贴近原文的“世代”，避免直接解释为“支系”。
- source_word: רָאשֵׁי בֵּית אֲבוֹתָם
  choice: 父系家族的首领
  rationale: 这是《历代志》中表示以共同祖先为基础之宗族单位的固定表达；“父系家族”比直译“父家”更易为现代读者理解，又没有缩小为核心家庭。
- source_word: גִּבּוֹרֵי חָיִל
  choice: 英勇善战的人
  rationale: 该短语兼有勇力、才干和军事能力之意；本段统计适役人员的语境支持军事色彩，但“人”仍保留其作为人物类别的表达。
- source_word: עֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: 二万零二百人
  rationale: 准确表达希伯来文数目20,200，并补出中文计数所需的量词“人”。
