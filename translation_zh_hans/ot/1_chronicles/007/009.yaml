revisions:
- from: 他们按世系登记[a]，按着各自的世代，都是父系家族的首领[b]、英勇善战的人，共二万零二百人。
  to: 他们按各自的世代被编入家谱[a]；他们是父家的首领，都是英勇的勇士，共二万零二百人。
  rationale: 修订以“按各自的世代被编入家谱”对应希伯来文的家谱登记动词及其分类短语，消除原译中主动语态和重复措辞的疑义。将“父系家族”调整为“父家”，并以脚注保留其宗族含义；将“英勇善战的人”调整为“英勇的勇士”，以免把原文较宽的勇力概念限定为专门的作战能力。脚注b随术语保留，锚点置于“父家”后。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:55:56Z'
review_pass:
  verdict: revise
  source_fidelity: 草案准确传达了家谱登记、按世代、父家首领、勇士及二万零二百人的基本内容。但“英勇善战”将גִּבּוֹרֵי חָיִל较宽的勇力／能力含义限定为作战技能；“按世系登记，按着各自的世代”也使两个相近的家谱概念在中文中显得重复且关系不清。
  naturalness: “按着各自的世代”不够自然，“他们按世系登记”也较易理解为他们主动依据世系办理登记。改为“按各自的世代被编入家谱”可清楚表达原文的被动式家谱记录含义，并使行文更顺畅。
  terminology: “父系家族”可理解，但“父家的首领”更贴近《历代志》常用的宗族组织术语，且可由脚注说明其并非现代核心家庭。“英勇的勇士”保留גִּבּוֹרֵי חָיִל的勇力含义，避免不必要地强化为“善战”。
  issues:
  - severity: medium
    issue: “英勇善战的人”将“勇士／有勇力的人”的含义具体化为善于作战。
    rationale: גִּבּוֹרֵי חָיִל可以具有军事语境，但其词义并不必然仅指作战技巧；宜保留较宽的“勇士”表达。
  - severity: low
    issue: “他们按世系登记，按着各自的世代”中文关系不够清楚且措辞重复。
    rationale: 原文动词指被记入家谱，后面的短语说明按其世代／家系归类；改为被动表达可更准确自然。
  revised_text: 他们按各自的世代被编入家谱[a]；他们是父家的首领，都是英勇的勇士，共二万零二百人。
  revised_footnotes:
