  yaml_path: translation/ot/1_chronicles/007/030.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
translation:
  language: zh_hans
  text: 亚设的儿子是音拿[a]、亦施瓦、亦施韦和比利亚；他们的姐妹是西拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些人名在其他转写传统中拼写可能不同：音拿也可写作“音纳”或“亦米拿”；亦施瓦也可写作“亦书亚”；亦施韦也可写作“亦书伊”。
    reason: 说明人名音译的可接受差异，同时保留正文按本节希伯来语马所拉读音所作的转写。
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是“儿子”的复数构造形式；本节紧接着列出亚设的子女，因此按直义译为“儿子”，不泛化为“后裔”。
- source_word: אָשֵׁר
  choice: 亚设
  rationale: 按现代中文圣经中通行且易辨认的译名音译该人名。
- source_word: יִמְנָה
  choice: 音拿
  rationale: 依马所拉文本的辅音和元音音译，并采用现代中文中简洁自然的人名形式。
- source_word: יִשְׁוָה
  choice: 亦施瓦
  rationale: 按本节马所拉文本的读音音译，以区别于拼写相近的谱系人名。
- source_word: יִשְׁוִי
  choice: 亦施韦
  rationale: 按马所拉文本的读音音译，保留它与“亦施瓦”的区别。
- source_word: בְרִיעָה
  choice: 比利亚
  rationale: 采用现代中文圣经传统中常见、易辨认的音译。
- source_word: שֶׂרַח
  choice: 西拉
  rationale: 按该希伯来人名音译，并与另一个不同的希伯来名字“撒拉”区分。
- source_word: אֲחוֹתָם
  choice: 他们的妹妹
  rationale: 原文为“姐妹”加第三人称阳性复数后缀，明确表示西拉是前列众人的姐妹；中文谱系语境中译作“妹妹”自然且清楚。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代书面汉语。以分号把四位儿子与妹妹西拉区分开，使谱系关系清楚；所有人名依据希伯来文本音译，同时兼顾中文读者的辨识度。
