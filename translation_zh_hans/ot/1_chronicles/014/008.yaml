base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/008.yaml
  text: When the Philistines heard that David had been anointed king over all Israel[a], all the Philistines went up to seek David. And David heard, and went out before them.
translation:
  language: zh_hans
  text: 非利士人听说大卫已经受膏作全以色列的王，就全都上来寻找大卫。大卫听见了，便出去迎着他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“出去迎战他们”。希伯来文直译是“出去到他们面前”，在这里可能暗示军事对抗，但没有明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: 听说
  rationale: שׁמע在叙事中表示听到消息；现代汉语以“听说”自然表达获悉某事，也适合后接内容从句。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经传统中通行且易识别的族名译法。
- source_word: כִּי נִמְשַׁח דָּוִיד לְמֶלֶךְ
  choice: 大卫已经受膏作……的王
  rationale: נִמְשַׁח是被动式，译为“受膏”；“已经”体现此事先于他们听见消息，“作……的王”自然表达לְ所标示的职分或结果。
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: 全以色列的王
  rationale: עַל在君王职分语境中表示治理范围；汉语用所属结构自然表达“统治全以色列之王”，并保留“全”的政治范围。
- source_word: וַיַּעֲלוּ כָל פְּלִשְׁתִּים
  choice: 就全都上来
  rationale: עלה保留为“上来”，不额外加入“进军”等军事含义；“全都”对应כָל פְּלִשְׁתִּים的整体性表述。
- source_word: לְבַקֵּשׁ אֶת דָּוִיד
  choice: 寻找大卫
  rationale: בקשׁ基本义为寻找、寻求；上下文虽带敌对意味，正文不把目的明确化为追杀或攻击。
- source_word: וַיִּשְׁמַע דָּוִיד
  choice: 大卫听见了
  rationale: 保留与前句“听说”的词语呼应，同时“听见了”在汉语叙事中可自然表示获悉这一动向。
- source_word: וַיֵּצֵא לִפְנֵיהֶם
  choice: 便出去迎着他们
  rationale: לִפְנֵיהֶם直译是“到他们面前／在他们前面”；“迎着他们”保留向对方而出的空间形象，也不在正文中完全锁定为会面或交战。
