  text: 以利沙玛、比利雅大[a]和以利法列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在平行名单《撒母耳记下》5:16中，这名字作“以利雅大”；本节希伯来文本作“比利雅大”。
