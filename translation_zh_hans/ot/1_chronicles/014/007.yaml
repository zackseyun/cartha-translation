lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: 以利沙玛
  rationale: 按希伯来语专名音译；连接词 ו 在中文列举中不逐一译出，以符合自然表达。
- source_word: וּ/בְעֶלְיָדָע
  choice: 比利雅大
  rationale: 依本节马所拉文本 בְעֶלְיָדָע 音译，不以平行经文中的异名替代；异名情况收入脚注。
- source_word: וֶ/אֱלִיפָלֶט
  choice: 以利法列
  rationale: 按希伯来语 אֱלִיפָלֶט 音译，并采用现代中文圣经人名中清楚、易读的形式；末一项前的连接词 ו 译作“和”。
