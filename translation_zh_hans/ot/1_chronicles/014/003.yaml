  yaml_path: translation/ot/1_chronicles/014/003.yaml
  text: And David took more wives in Jerusalem[a], and David fathered more sons and daughters.
translation:
  language: zh_hans
  text: 大卫在耶路撒冷又娶了更多妻子[a]，并且又生了更多儿子和女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又娶了更多女人”；希伯来文直译为“又取了更多妻子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 娶了
  rationale: לקח的基本义是“取、拿”，但以“妻子”为宾语时，现代汉语用“娶”能自然准确地表达其语境意义；脚注保留希伯来文较为直译的措辞。
- source_word: עוֹד
  choice: 又；更多
  rationale: 本节两次出现עוֹד。修饰娶妻这一行动时译作“又”，修饰所生儿女的数量时译作“更多”，符合各自语境及现代汉语习惯。
- source_word: נָשִׁים
  choice: 妻子
  rationale: 该词可指“女人”或“妻子”；在大卫“娶/取”她们的语境中，关系义“妻子”最为贴切。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词ב在此表地点，直接译为“在耶路撒冷”。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: ילד以男性为主语时表示“成为……的父亲、生育”。汉语叙事中“大卫生了儿女”自然简洁，并能表达父系主语的生育关系；“使……出生”过于生硬。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿女
  rationale: “儿女”是现代汉语中自然的集合表达，同时涵盖原文明确列出的“儿子和女儿”；若译“孩子”会弱化性别成分。
- source_word: דָּוִיד
  choice: 大卫
  rationale: 采用中文圣经传统且通行的人名译法。
theological_decisions:
- issue: 叙事对大卫多妻行为的态度
  choice: 仅作描述，不增添道德评价
  alternative: 在译文中加入赞同或谴责的意味
  rationale: 本节只记述大卫又娶妻并生儿育女，本身没有明确作出道德评判；译文应保留叙事的中性表述，不引入经文未表达的立场。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“又娶了妻子”避免擅自补出原文未明说的具体人数；后半句以“更多儿女”体现第二个עוֹד的数量意义。
