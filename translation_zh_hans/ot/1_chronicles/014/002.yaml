  text: וַ/יֵּ֣דַע דָּוִ֔יד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל כִּֽי נִשֵּׂ֤את לְ/מַ֨עְלָ/ה֙ מַלְכוּת֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/002.yaml
  text: And David knew that Yahweh had established him as king over Israel[b][a], for his kingdom had been greatly exalted for the sake of his people Israel.
translation:
  language: zh_hans
  text: 大卫知道，耶和华已立他为以色列的王，因为他的国度[a]被大大高举，是为了他子民以色列[b]的缘故。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的国度”也可译作“他的王权”或“他的统治”；“被大大高举”直译为“被举到高处”。
    reason: lexical_alternative
  - marker: b
    text: 原文“他子民”中的“他”可指耶和华，也可指大卫。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: 知道
  rationale: 直接保留ידע的常用叙事含义；上下文也可含“认识到”之意，但不必在正文中强化这一认知过程。
- source_word: הֱכִינוֹ
  choice: 已经立他
  rationale: כון的使役形在此表示确立、使稳固；结合君王职分，汉语“立他作……王”自然且准确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，不以称号代替专名。
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: 作以色列的王
  rationale: 自然表达被确立为治理以色列的君王，避免生硬直译“在以色列之上作王”。
- source_word: נִשֵּׂאת לְמַעְלָה
  choice: 大大提升了
  rationale: 保留“被举高、提升”的意象及程度；汉语被动不必明示，施事者可由语境理解。
- source_word: מַלְכוּתוֹ
  choice: 他的王权
  rationale: מַלְכוּת既可指国度、王位、王权或统治；此处“王权”与大卫被立为王的语境衔接较自然，同时在脚注保留“国度”的可能。
- source_word: בַּעֲבוּר
  choice: 为了
  rationale: 表达目的或受益关系，说明提升大卫王权是为以色列的益处。
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: 自己的子民以色列
  rationale: 正文依上下文将代词理解为指耶和华，并用“上帝”明确回指，以免现代汉语产生指代混淆；脚注保留指大卫的可能。
theological_decisions:
- issue: “他的子民以色列”中代词的所指
  choice: 正文理解为耶和华的子民，并译作“上帝……自己的子民以色列”
  alternative: 也可理解为大卫的子民
  rationale: 希伯来语阳性单数后缀本身可回指耶和华或大卫；较宽的历代志神学语境支持以色列是耶和华的子民，但正文同时以脚注保留真实的句法歧义。
- issue: 第二个כִּי的逻辑功能
  choice: 因为
  alternative: 也可理解为解释性的“就是/表明”
  rationale: 后半句最自然地说明大卫为何知道耶和华确立了他，因此采用因果连接，同时不扩展为更强的神学推论。
- issue: 王权提升的施事者
  choice: 在中文正文中补明为上帝
  alternative: 保持未明说的被动：“他的王权大大提升了”
  rationale: 希伯来语使用被动式且未明说施事者；语境强烈暗示耶和华。为使中文顺畅并澄清后续代词，正文补出“上帝”，但脚注说明原文并未明说。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“立他作……王”符合中文叙事习惯；以“王权”呈现מַלְכוּת在此处偏向君王地位与统治的语义，并用脚注保留“国度”。所有脚注标记均置于正文相关句末。
