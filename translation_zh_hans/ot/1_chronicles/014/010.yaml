base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/010.yaml
  text: And David inquired of God[a], saying, “Shall I go up against the Philistines, and will you give them into my hand?” And Yahweh said to him, “Go up, and I will give them into your hand.”
translation:
  language: zh_hans
  text: 大卫求问神，说：“我该上去攻打非利士人吗？你会把他们交在我手里吗？”雅威对他说：“上去吧！我必把他们交在你手里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: 求问神
  rationale: 这里不是一般性的发问，而是向神寻求指引；“求问神”既自然，也保留了正式咨询神意的含义。
- source_word: הַאֶעֱלֶה
  choice: 我可以上去……吗
  rationale: עלה在军事语境中表示出兵进攻；保留“上去”可与神回答中的命令形成对应，而“可以……吗”自然表达大卫是在寻求许可和指引。
- source_word: עַל פלשתיים
  choice: 攻打非利士人
  rationale: 介词עַל在军事语境中表示敌对行动；“攻打”清楚表达其语境意义。
- source_word: וּנְתַתָּם בְּיָדִי / וּנְתַתִּים בְּיָדֶךָ
  choice: 把他们交在我手里／把他们交在你手里
  rationale: 保留נתן ביד“交在某人手里”的希伯来语意象，并维持大卫的问题与神的回答之间的措辞呼应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，将其作为专名而非以头衔替代。
- source_word: עֲלֵה
  choice: 上去吧
  rationale: 重复大卫问题中的עלה，保留问答之间的词语对应；“吧”使汉语命令自然且庄重。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较贴近学界通常采用的拟定读音，同时避免用“主”这一头衔取代专名。“耶和华”是汉语传统译名，但反映的是后期形成的混合读法。
- issue: “交在手里”的含义
  choice: 保留“交在……手里”的意象
  alternative: 使……落在……手中／把……交给……处置
  rationale: 该习语表示使敌人受某人掌控。直译在现代汉语中仍然可懂，也保留问题与应答的文学对称，不把神使大卫得胜的含义解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“求问神”体现向神寻求指引；问句与回答都保留“上去”和“交在……手里”，以呈现原文的平行结构。
