  yaml_path: translation/ot/1_chronicles/014/009.yaml
  text: The Philistines came and raided the Valley of Rephaim[a].
translation:
  language: zh_hans
  text: 非利士人来了，侵入利乏音谷[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在利乏音谷展开阵势。”希伯来语动词既可表示展开、散开，也可表示袭击或侵掠；这里的上下文是敌对的军事行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: 非利士人
  rationale: פְלִשְׁתִּים是族名，按现代中文圣经通行译名译作“非利士人”。句首וּ表示叙事承接；中文无需机械译作“于是”或“现在”。
- source_word: בָּאוּ
  choice: 来了
  rationale: בוא的Qal完成式第三人称复数，意为“来、来到”；在叙事中自然译作“来了”。
- source_word: וַֽ/יִּפְשְׁטוּ
  choice: 侵入
  rationale: פשט在军事语境中可指展开、散开，也可指袭击或侵掠。这里译作“侵入”，表达敌对的军事进入，同时避免把原文具体化为必然抢掠；另一个空间性译法列入脚注。
- source_word: בְּ/עֵמֶק
  choice: 利乏音谷
  rationale: עֵמֶק意为“谷、山谷”；介词בְ与军事动词连用，在中文中可由“侵入”自然承载。
- source_word: רְפָאִים
  choice: 利乏音
  rationale: 此处רְפָאִים用于固定地名“利乏音谷”，采用现代中文圣经中较为通行的音译。
theological_decisions: []
