  yaml_path: translation/ot/1_chronicles/014/013.yaml
  text: And the Philistines again spread out in the valley[a].
translation:
  language: zh_hans
  text: 非利士人又一次在山谷中展开阵势。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“非利士人又一次在山谷中散布开来。”
    reason: 词义可选译法：וַיִּפְשְׁטוּ可指铺展开来；正文按军事语境译为“展开阵势”。
lexical_decisions:
- source_word: וַיֹּסִיפוּ עוֹד
  choice: 又
  rationale: 两个词合用，强调同一行动再次发生；现代汉语用“又”自然表达重复之意，避免生硬地逐词译作“再加上一次”。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经及历史语境中通行的族名译法。
- source_word: וַיִּפְשְׁטוּ
  choice: 展开阵势
  rationale: פשט 在军事语境中可指铺展开来或部署；“展开阵势”既保留其空间展开的含义，也自然呈现军队在谷中部署的场景，而不限定为劫掠。
- source_word: בָּעֵמֶק
  choice: 来到谷中
  rationale: 介词 ב 基本表示位置“在……中”；为使汉语叙事自然，与前面的动词合译为“来到谷中，展开阵势”，地点仍明确落在谷中。
theological_decisions: []
