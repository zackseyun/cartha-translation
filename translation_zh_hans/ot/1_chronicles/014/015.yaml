base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/015.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
translation:
  language: zh_hans
  text: 当你听见巴卡树梢有行军的脚步声[a]，就要出战，因为上帝已经在你前面出战，要击败非利士人的军队。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴卡树”也可译作“香脂树”；传统译作“桑树”。希伯来词所指的确切树种不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי כְּשָׁמְעֲךָ
  choice: 你一听见
  rationale: וִיהִי在此引出时间情境，כְּ加不定式构造表达“当……时”。现代汉语用“一……就……”与后面的אָז相呼应，清楚表达听见征兆后便行动，又不额外强化为原文未必明说的急迫命令。
- source_word: קוֹל הַצְּעָדָה
  choice: 行军的脚步声
  rationale: קוֹל指可听见的声响；הַצְּעָדָה源于“迈步”，在军事语境中有行进、行军之意。“行军的脚步声”兼顾声音、步伐和军事背景。
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: 乳香树梢
  rationale: רָאשִׁים指树的上部或梢头。בְּכָאִים所指树种不能确定；正文采用学界常见且适合普通读者的“乳香树”，并以脚注保留其他可能。
- source_word: אָז תֵּצֵא בַמִּלְחָמָה
  choice: 就要出战
  rationale: אָז标明随后的行动，תֵּצֵא本义为“出去”，בַּמִּלְחָמָה赋予军事语境。“出战”在现代汉语中自然凝练，并保留出兵迎战的含义。
- source_word: כִּי יָצָא הָאֱלֹהִים לְפָנֶיךָ
  choice: 因为上帝已经走在你前面
  rationale: כִּי引出行动的理由；完成式יָצָא把神的行动呈现为已经开始。“已经走在你前面”保留“出去/走出”及在前引领作战的图景。
- source_word: לְהַכּוֹת אֶת מַחֲנֵה פְלִשְׁתִּים
  choice: 去击杀非利士人的军营
  rationale: נכה使役式在战争语境中可指击打、杀败或击溃。这里保留较直接的“击杀”；מַחֲנֶה既可指营地，也可转指驻营的军队，“军营”保留原文具体意象。
theological_decisions:
- issue: הָאֱלֹהִים的单复数表达
  choice: 上帝
  alternative: 诸神
  rationale: אֱלֹהִים形态上为复数，但这里搭配单数动词יָצָא，并在上下文中指以色列的神，因此按单数译为“上帝”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一……就……”使时间关系自然清楚；“走在你前面”保留神亲自先行作战的军事图景。树种的不确定性不在正文中生硬音译，而在脚注中明确说明。
