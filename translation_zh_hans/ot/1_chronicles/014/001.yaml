base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/001.yaml
  text: Then Hiram king of Tyre sent messengers to David[a], and cedar timber, masons, and carpenters[b], to build a house for him.
translation:
  language: zh_hans
  text: 推罗王希兰派使者[a]到大卫那里，并送去香柏木料、筑墙的工匠和木匠，为他建造一所房屋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“使节”；在王室交往的语境中，这个希伯来词可以指正式代表。
    reason: lexical_alternative
  - marker: b
    text: “房屋”也可译作“宫殿”。希伯来语“房屋”可以指君王的住所；正文保留较为直译的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派……又送去
  rationale: 该叙事动词支配使者和随后列出的建材、工匠；中文分别用“派”和“送去”，自然表达同一次王室差遣。
- source_word: חירם
  choice: 希兰
  rationale: 按现代中文圣经人名的通行音译处理；本节马所拉文本的辅音形式对应 Hiram。
- source_word: מֶלֶךְ צֹר
  choice: 推罗王
  rationale: 简洁自然地表达希伯来语的属格结构和王的辖地。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 保留该词“受差遣者、传信者”的基本意义；在王室语境中也可能指正式使节。
- source_word: וַעֲצֵי אֲרָזִים
  choice: 香柏木料
  rationale: 语境所指是用于建筑的香柏木，而不是仍在生长的树；“木料”准确体现其用途。
- source_word: חָרָשֵׁי קִיר
  choice: 石匠
  rationale: 直译是从事墙体工作的工匠；在建筑语境中“石匠”简洁自然，但原词本身侧重筑墙工匠。
- source_word: חָרָשֵׁי עֵצִים
  choice: 木匠
  rationale: 准确表达从事木材加工的工匠，并符合建筑语境。
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: 为他建造一座房屋
  rationale: 保留目的结构和 בַּיִת 的基本义“房屋”；王室语境可能具体指宫殿，但正文不将该含义说死。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又送去”使中文明确显示香柏木料和工匠也是希兰所差送的，同时不改变希伯来语各成分并列的关系。脚注标记分别紧跟“使者”和“房屋”，与注释对象对应。
