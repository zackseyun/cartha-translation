base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/011.yaml
  text: So they went up to Baal-perazim[a], and David struck them down there. And David said, “God has broken through my enemies by my hand, like a bursting flood of waters.” Therefore they called the name of that place Baal-perazim.
translation:
  language: zh_hans
  text: 他们上到巴力·毗拉心[a]，大卫就在那里击败了他们。大卫说：“上帝借我的手冲破了我的仇敌，如洪水决堤一般。”因此，人们给那地方起名叫巴力·毗拉心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴力·毗拉心”这一名称可理解为“冲破之主”或“冲破之地”，与下文大卫所说上帝“冲破”仇敌相呼应。
    reason: 说明地名含义及原文中围绕פרץ形成的文字呼应。
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 他们上到
  rationale: עלה用于军事行动时可表示“上去、上到”。此处保留方向性，不额外推断具体战术。
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: 巴力·毗拉心
  rationale: 作为地名采用音译；其含义及与פרץ的文字呼应在脚注中说明。
- source_word: וַיַּכֵּם
  choice: 大卫就在那里击败了他们
  rationale: נכה在战争语境中可指击打或击败。译作“击败”既表达战斗结果，也避免无根据地限定为全部杀死。
- source_word: פָּרַץ
  choice: 冲破了
  rationale: פרץ表示冲破、突破或迸发；“冲破”可与下文水冲破缺口的比喻及地名毗拉心形成呼应。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 虽带冠词，此处仍是指独一的上帝；单数动词也表明主语为单数。
- source_word: אֶת אֹיְבַי
  choice: 我的仇敌
  rationale: 直接、庄重地表达原文宾语。
- source_word: בְּיָדִי
  choice: 借我的手
  rationale: 保留希伯来文“手”的意象，同时自然表达大卫是上帝施行胜利的媒介。
- source_word: כְּפֶרֶץ מָיִם
  choice: 像水冲破缺口一样
  rationale: 呈现水从裂口冲出的图景，并以“冲破”延续פרץ的词语呼应。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 准确表达命名与前述宣告之间的因果关系。
- source_word: קָרְאוּ שֵׁם הַמָּקוֹם הַהוּא
  choice: 人们给那地方起名叫
  rationale: 原文动词为第三人称复数，但未明确指出主语；用泛指的“人们”保留这一点，并符合现代汉语命名表达。
theological_decisions:
- issue: 大卫宣告中上帝与人的施事关系
  choice: 上帝是胜利的最终施事者，大卫是其所使用的人间媒介
  alternative: 只强调大卫取得胜利，或把“借我的手”弱化为不具工具意义的表达
  rationale: 单数动词פָּרַץ以上帝为主语，而בְּיָדִי明确保留大卫作为行动媒介；译文同时呈现神的作为与人的参与。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“借我的手”保留原文意象；“像水冲破缺口一样”力求兼顾自然表达、洪水般的力度和原文双关。地名以间隔号标示音节组合，并在脚注解释其意义。
