  yaml_path: translation/ot/1_chronicles/014/012.yaml
  text: And they left their gods there[a], and David gave the order[b], and they were burned with fire.
translation:
  language: zh_hans
  text: 他们把自己的神[a]留在那里。大卫下令[b]，那些神就被火焚烧了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他们的神”。这里所指很可能是代表诸神的敬拜图像，即神像或偶像。
    reason: lexical_alternative
  - marker: b
    text: 《撒母耳记下》5:21的平行记载说，大卫和他的部下把那些偶像拿走了；本节则记载大卫下令后，它们被火焚烧。
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: 留
  rationale: עזב在这里描述非利士人逃离时把敬拜物留在原处；“留”自然准确，不额外强化为主动弃绝。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达地点副词שָׁם，简洁自然。
- source_word: אֶת אֱלֹהֵיהֶם
  choice: 自己的神像
  rationale: 原文直译为“他们的神”；但实体能够被留下并焚烧，语境所指应是代表诸神的敬拜图像。“神像”在现代汉语中清楚表达这一具体所指，同时以脚注保留直译。
- source_word: וַיֹּאמֶר דָּוִיד
  choice: 大卫一声令下
  rationale: 字面为“大卫说”，但未记载话语内容，紧接的结果表明这是命令；该译法自然传达叙事功能。
- source_word: וַיִּשָּׂרְפוּ
  choice: 就被……烧了
  rationale: 按被动意义理解，承接前面的神像为主语，不擅自补出执行焚烧者。
- source_word: בָּאֵשׁ
  choice: 被火烧
  rationale: בָּאֵשׁ表示焚烧的手段；现代汉语用“被火烧”表达自然。
theological_decisions:
- issue: 异教敬拜对象אֱלֹהֵיהֶם应译为“神”还是“神像”
  choice: 正文译“神像”，脚注注明直译“他们的神”
  alternative: 正文译“他们的神”
  rationale: 原词确为“神”，须保留这一词义事实；然而本节所述对象可被遗留并焚烧，显然是具体的敬拜图像。正文“神像”使现代读者不致误以为经文声称神祇本身被烧，脚注则保存原文措辞及其张力。
- issue: 焚烧行动的施事者
  choice: 使用被动表达，不指明是谁执行
  alternative: 译作“他们就用火把神像烧了”
  rationale: 原文形式和句法可作被动理解，且没有明确指出执行者；避免把大卫、他的部下或其他人擅自补为主语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大卫一声令下”比字面译作“大卫说”更符合汉语语境；“这些神像”明确承接前项，并维持后半句的被动结构。
