  text: וַ/יֵּצֵ֥א שֵׁם דָּוִ֖יד בְּ/כָל הָֽ/אֲרָצ֑וֹת וַֽ/יהוָ֛ה נָתַ֥ן אֶת פַּחְדּ֖/וֹ עַל כָּל הַ/גּוֹיִֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/017.yaml
  text: And David’s name went out into all the lands[b][a], and Yahweh put the fear of him on all the nations.
translation:
  language: zh_hans
  text: 大卫的名声传遍了各地；耶和华使万国都惧怕他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא שֵׁם דָּוִיד
  choice: 大卫的名声传遍了
  rationale: 直译为“大卫的名出去”，但这是“名声传播”的希伯来语表达。现代汉语用“名声传遍”自然清楚，同时保留“名”所表达的声望含义。
- source_word: בְּכָל הָאֲרָצוֹת
  choice: 各地
  rationale: 复数“诸地”在此指周围各地或各国疆域；“各地”符合现代汉语习惯，也不把范围过度限定为现代民族国家。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法“耶和华”，明确其为专名而非称号。
- source_word: נָתַן אֶת פַּחְדּוֹ עַל
  choice: 使……都惧怕他
  rationale: 原文直译近于“把对他的惧怕放在……之上”。汉语以使动结构表达该惯用语，更自然，并准确传达耶和华使列国产生惧怕。
- source_word: כָּל הַגּוֹיִם
  choice: 万国
  rationale: “万国”是自然而庄重的圣经汉语表达，表示所有周围民族或列国，并非数学意义上的一万国。
theological_decisions:
- issue: פַּחְדּוֹ 中第三人称阳性单数后缀的所指
  choice: 理解为大卫，即“惧怕他（大卫）”
  alternative: 理解为耶和华，即“敬畏他（耶和华）”
  rationale: 紧接的语境以大卫的名声传到各地为中心，因此后缀最自然地回指大卫：耶和华使万国惧怕大卫。译文保留代词“他”，没有在正文中额外加入“大卫”作解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“名声传遍”比生硬的“名字出去”更易懂；“使万国都惧怕他”清楚表达原文使动关系，并保留代词所带的轻微指代张力。
