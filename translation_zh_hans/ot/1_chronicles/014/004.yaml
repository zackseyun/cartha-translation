  yaml_path: translation/ot/1_chronicles/014/004.yaml
  text: 'And these are the names of the children born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: zh_hans
  text: 以下是大卫在耶路撒冷所生的孩子的名字：沙母亚、朔巴、拿单和所罗门。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: וְ连接上下文，אֵלֶּה引出名单；现代汉语用“以下是”自然地承接并介绍后文。
- source_word: שְׁמוֹת
  choice: 名字
  rationale: 该词是“名”的复数，并以附属形式引出随后列出的人名。
- source_word: הַיְלוּדִים אֲשֶׁר הָיוּ לוֹ
  choice: 大卫所生的孩子
  rationale: הַיְלוּדִים是ילד的被动分词，意为“所生的”；אֲשֶׁר הָיוּ לוֹ表达归属。中文补出语境中的“大卫”，使“所生”结构明确自然，同时用“孩子”而非原文未使用的普通“儿子”一词。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词短语直接表示出生地点。
- source_word: שַׁמּוּעַ
  choice: 沙母亚
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: שׁוֹבָב
  choice: 朔巴
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: נָתָן
  choice: 拿单
  rationale: 采用现代中文圣经中通行的人名形式。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经中已经确立的标准人名形式。
