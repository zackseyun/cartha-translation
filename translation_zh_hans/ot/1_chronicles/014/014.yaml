base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/014.yaml
  text: So David inquired of God again[a], and God said to him, “You shall not go up after them. Circle around from behind them, and come against them opposite the balsam trees.”
translation:
  language: zh_hans
  text: 大卫又求问上帝，上帝对他说：“不要跟着他们上去；要绕开他们，从香脂树[a]对面向他们进攻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“巴迦树”；确切树种不详。传统译本常译作“桑树”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: 求问上帝
  rationale: 这里的“求问”不是一般询问，而是向上帝寻求指引；现代中文也常用此词表达这一含义。
- source_word: עוֹד
  choice: 又
  rationale: 表示大卫继前一次之后再次求问，叙事中用“又”简洁自然。
- source_word: לֹא תַעֲלֶה אַחֲרֵיהֶם
  choice: 不要跟在他们后面上去
  rationale: 保留עָלָה“上去”和אַחֲרֵיהֶם“在他们后面”的基本措辞，不把它完全释义为“不要进攻”。
- source_word: הָסֵב מֵעֲלֵיהֶם
  choice: 要绕开他们
  rationale: הָסֵב表示转向或绕行；מֵעֲלֵיהֶם在此指避开原来的直接进路。“绕开他们”自然地表达战术改道，同时不过度指定为绕到后方。
- source_word: וּבָאתָ לָהֶם
  choice: 向他们进攻
  rationale: בוא加ל在军事语境中指向敌军逼近或发起攻击；译作“进攻”使上下文中的敌对行动清楚。
- source_word: מִמּוּל
  choice: 从……对面
  rationale: 表示与某处相对或面对的位置；“从……对面”符合随后发动进攻的方位语境。
- source_word: הַבְּכָאִים
  choice: 香脂树
  rationale: 所指树种不能确定。“香脂树”反映一种常见词义判断，又以脚注保留植物鉴定上的不确定性。
