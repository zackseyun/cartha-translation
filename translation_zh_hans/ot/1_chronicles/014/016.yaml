  yaml_path: translation/ot/1_chronicles/014/016.yaml
  text: So David did as God had commanded him, and they struck down the Philistine army from Gibeon as far as Gezer.
translation:
  language: zh_hans
  text: 大卫就照上帝所吩咐他的去做；他们从基遍直到基色，击败了非利士人的军队[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军队”原文直译为“非利士人的营”；这里的“营”可能借指驻营的军队。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ דָּוִיד כַּאֲשֶׁר צִוָּהוּ הָאֱלֹהִים
  choice: 大卫就照上帝所吩咐他的去做
  rationale: 忠实表达大卫依照上帝命令而行；“照……去做”符合现代汉语叙事习惯，也保留原文的顺从关系。
- source_word: וַיַּכּוּ
  choice: 他们……击败了
  rationale: 希伯来语动词为复数，所指自然是大卫和随从他的军兵；“击败”符合军事语境，并避免误译为大卫一人行动。
- source_word: מַחֲנֵה פְלִשְׁתִּים
  choice: 非利士人的军队
  rationale: מַחֲנֶה 字面为“营、营地”，在此军事语境中借指驻营的作战部队；正文译为“军队”使“击败”的对象在现代汉语中自然明确，同时用脚注保留字面信息。
- source_word: מִגִּבְעוֹן וְעַד גָּזְרָה
  choice: 从基遍直到基色
  rationale: “从……直到……”准确传达 מִן…וְעַד 所表示的范围或终点；地名依通行中文圣经译名处理。
theological_decisions:
- issue: וַיַּכּוּ 的主语
  choice: 采用复数主语“他们”，指大卫及其军兵
  alternative: 按叙事核心人物意译成“大卫击败了”
  rationale: 原文动词明确为复数；保留“他们”既符合语法，也不把集体军事行动简化为大卫个人的行动。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就”承接上文命令与本节执行之间的关系；分号区分遵命与战果两个相连的叙事动作。
