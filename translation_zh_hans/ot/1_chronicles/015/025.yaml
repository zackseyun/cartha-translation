base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/025.yaml
  text: So David, and the elders of Israel, and the commanders of the thousands went to bring up the ark of the covenant of Yahweh from the house of Obed-edom with joy.
translation:
  language: zh_hans
  text: 于是，大卫、以色列的长老和千夫长都去欢喜地把耶和华的约柜从俄别以东家里抬上去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 于是……都去
  rationale: 这里的叙事形式用于承接上下文；以“于是”自然引出行动，并把主要动作落实在“都去”上，避免生硬译成“事情发生了”。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的长老
  rationale: 准确表达以色列中受公认的领袖群体，也是现代中文常用的圣经称谓。
- source_word: שָׂרֵי הָאֲלָפִים
  choice: 千夫长
  rationale: 该短语指统领“千人”单位的首领；“千夫长”简洁自然，同时保留其军事或行政职分。
- source_word: הַהֹלְכִים
  choice: 都去
  rationale: 希伯来语分词修饰前述众人，表示他们前去执行后面的行动；中文以限定副词“都”明确三组人共同前往。
- source_word: לְהַעֲלוֹת
  choice: 把……抬上来
  rationale: 在搬运约柜的语境中，动词表示使之上行；约柜需由人抬运，因此“抬上来”兼顾动作方式和方向。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 耶和华的约柜
  rationale: “约柜”在中文中已经凝练表达“约的柜”；所属结构明确指出这是耶和华之约的柜，且行文自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的神圣名字音译，明确其为专名而非仅是称号。
- source_word: מִן בֵּית עֹבֵד אֱדֹם
  choice: 从俄别以东家里
  rationale: 忠实表达起点及所属关系，并采用该人名通行的中文音译。
- source_word: בְּשִׂמְחָה
  choice: 欢欢喜喜地
  rationale: 介词短语在此作方式状语，表达众人喜乐地进行这项行动；叠词符合现代中文叙事习惯并保留庆贺色彩。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留为神的专名；“耶和华”是现代普通中文读者最易识别且长期通行的形式，不以“主”代替，也不据此加入额外教义解释。
- issue: אֲרוֹן בְּרִית יְהוָה 的关系
  choice: 耶和华的约柜
  alternative: 耶和华之约的柜
  rationale: 希伯来语连续属格可按字面分析为“耶和华之约的柜”。“耶和华的约柜”是中文自然且意义明确的凝练表达，不对约的神学性质作额外限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接叙事，“都去”涵盖大卫、长老和千夫长三组主体；“欢欢喜喜地”使原文的喜乐方式自然修饰抬约柜的整体行动。
