base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/001.yaml
  text: And he made houses for himself in the city of David[a], and he prepared a place for the ark of God and pitched a tent for it.
translation:
  language: zh_hans
  text: 他在大卫城为自己建造了房屋，又为上帝的约柜预备了地方，并为它支搭了一顶帐幕[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为它”或译“为自己”。希伯来语代词后缀既可指约柜，也可指大卫；就紧接的上下文而言，指约柜较为自然。
    reason: 保留希伯来语代词所指的真实歧义。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 建造了
  rationale: עָשָׂה的基本义较宽泛，可指“做、制造”；与“房屋”连用时，现代汉语用“建造”最自然，也准确表达具体语境。
- source_word: בָתִּים
  choice: 房屋
  rationale: בַּיִת的复数通常指多所房屋；原文没有明确说是宫殿，因此不作具体化处理。汉语“房屋”可自然表达集合性的复数。
- source_word: בְּעִיר דָּוִיד
  choice: 在大卫城
  rationale: 这是直接的地点短语；“大卫城”是该地名在现代汉语中的自然表达。
- source_word: וַיָּכֶן
  choice: 预备了
  rationale: כּוּן的使役词形在这里表示预备、使就绪；宾语是安放约柜的地方，译作“预备”贴合语境。
- source_word: מָקוֹם
  choice: 地方
  rationale: מָקוֹם是普通的“地方、处所”，原文没有进一步限定，故采用不加发挥的“地方”。
- source_word: לַאֲרוֹן הָאֱלֹהִים
  choice: 为上帝的约柜
  rationale: אֲרוֹן在本段明确指神圣的约柜；“上帝的约柜”准确保留所属关系，不增添原文没有的限定。
- source_word: וַיֶּט
  choice: 支搭了
  rationale: נָטָה本义可指伸展、铺开；以帐幕为宾语时，“支搭”是现代汉语中自然且准确的搭配。
- source_word: אֹהֶל
  choice: 一座帐幕
  rationale: 该词在原文没有定冠词，译作“一座帐幕”保留其非特指形式；量词“座”符合汉语习惯。
- source_word: לּוֹ
  choice: 为它
  rationale: 阳性单数代词后缀最近且最合适的先行词是“上帝的约柜”，上下文也集中于为约柜作准备；但语法上也可能回指大卫，因此用脚注保留另一读法。
theological_decisions:
- issue: וַיֶּט לוֹ אֹהֶל中代词后缀的所指
  choice: 理解为指约柜，译作“为它支搭了一座帐幕”
  alternative: 理解为指大卫，译作“为自己支搭了一座帐幕”
  rationale: 前一分句刚说为上帝的约柜预备地方，接着说为它支搭帐幕，语意连贯；不过希伯来语的阳性单数后缀也能回指大卫，故不排除该读法，并在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“建造房屋”“预备地方”“支搭帐幕”保持叙事简洁，并延续经文语体；不把“房屋”具体化为宫殿，也不消除末句代词所指的歧义。
