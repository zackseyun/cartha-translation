base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/003.yaml
  text: And David assembled all Israel at Jerusalem to bring up the ark of Yahweh to its place[b][a], which he had prepared for it.
translation:
  language: zh_hans
  text: 大卫召集全以色列人到耶路撒冷，为要把耶和华的约柜运上去，送到他为它预备的地方。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为它”或译“为他”。希伯来语此处为阳性单数代词；在上下文中最自然是指约柜，也可能被理解为指耶和华。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: 召集
  rationale: 该词是קהל的使役形，表示使众人聚集；“召集”自然体现大卫主动召聚会众。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全以色列
  rationale: 保留希伯来语对以色列整体或其代表的集体称呼，不擅自扩展为“所有以色列人”。
- source_word: אֶל יְרוּשָׁלִָם
  choice: 到耶路撒冷
  rationale: אֶל通常表示趋向或目的地；现代汉语“召集到耶路撒冷”既忠实又自然。
- source_word: לְהַעֲלוֹת
  choice: 把……抬上去
  rationale: עלה的使役式在运送约柜的语境中表示带上去；“抬”符合约柜由人扛抬的背景，“上去”保留方向意味。
- source_word: אֲרוֹן יְהוָה
  choice: 耶和华的约柜
  rationale: “约柜”是该圣物在现代汉语圣经语境中的通行名称；属格结构自然译为“耶和华的约柜”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，而不以称号“主”代替。
- source_word: אֶל מְקוֹמוֹ
  choice: 安放在……地方
  rationale: 原文直译为“到它的地方”；结合把约柜运至预定地点的语境，用“安放在”自然表达目的，同时不加入“合适”等原文没有的评价。
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: 他为约柜预备的
  rationale: לוֹ的阳性单数后缀在语法上可指约柜，也可能指耶和华；上下文最自然地指为约柜预备地方，但以脚注保留另一可能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；中文正文采用普通现代读者最熟悉的专名“耶和华”，既不以“主”替代，也不把元音重构的争议带入正文。
- issue: לוֹ所指对象
  choice: 为约柜
  alternative: 为他（即耶和华）
  rationale: 紧邻语境谈的是约柜的安放地点，因此正文明确为“约柜”以保持汉语清楚；但希伯来语代词为阳性单数，语法上也可理解为指耶和华，故在脚注中保留歧义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“召集到”保留原文趋向介词；“抬上去”兼顾约柜的运输方式与עלה的上行意味。正文避免古奥表达，并用脚注保留代词指向的真实歧义。
