base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/014.yaml
  text: So the priests and the Levites consecrated themselves to bring up the ark of Yahweh[a], the God of Israel.
translation:
  language: zh_hans
  text: 于是，祭司和利未人使自己分别为圣[a]，好把雅威——以色列的上帝——的约柜运上去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使自己成为圣洁”。
    reason: 保留קדשׁ的另一种自然译法及其圣洁语义。
lexical_decisions:
- source_word: וַיִּתְקַדְּשׁוּ
  choice: 使自己分别为圣
  rationale: 该词是קדשׁ的Hitpael形式，表示为神圣职事洁净、预备自己；“使自己分别为圣”既保留反身意义，也传达礼仪上的圣洁含义。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 这是该词在以色列礼仪语境中的标准译法。
- source_word: וְהַלְוִיִּם
  choice: 和利未人
  rationale: 准确保留并列关系及群体名称。
- source_word: לְהַעֲלוֹת
  choice: 好把……抬上来
  rationale: עלה的Hiphil形式表示“使上去、带上去”；结合运送约柜的叙事，“抬上来”自然，并符合约柜由人抬运的近处语境。
- source_word: אֶת אֲרוֹן
  choice: 约柜
  rationale: ארון在此特指以色列敬拜中的神圣柜；现代中文圣经语境通常称为“约柜”，比单说“柜”更清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留四字神名，而不以称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达希伯来语的属格结构，并作为“雅威”的同位说明。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神名יהוה；“雅威”以现代汉语常见音译保留专名性质，避免将其改为称号。
- issue: וַיִּתְקַדְּשׁוּ所表达的圣洁行动
  choice: 使自己分别为圣
  alternative: 使自己成为圣洁；洁净自己
  rationale: 原文兼有反身行动和为神圣职事作预备的含义；正文不把它缩减为一般道德改善，也不限定为某一种具体洁净仪式。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“于是”承接上文；“好”清楚表达目的。将“以色列的上帝”置于“雅威”之前，使同位关系在中文中自然，同时保留原文对神身份的完整表述。
