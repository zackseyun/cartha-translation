translation:
  language: zh_hans
  text: 希伯仑的子孙中，有首领以利业，以及他的弟兄八十人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可理解为“同族男性”；希伯来文直译为“他的弟兄”，这里可能指以利业所代表宗族中的男性成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי חֶבְרוֹן
  choice: 希伯仑的子孙中
  rationale: לְ在本段名单中引出一个宗族群体；בְּנֵי直译为“儿子们”，但此处指希伯仑宗族的男性后裔，用“子孙中”既自然，也准确体现宗族语境。
- source_word: אֱלִיאֵל
  choice: 以利业
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: הַשָּׂר
  choice: 首领
  rationale: שַׂר可指首领、官长或主管者；此处是宗族代表名单，“首领”自然贴切，又不带“王子”或军事长官的特定含义。
- source_word: וְאֶחָיו
  choice: 和他的弟兄
  rationale: 希伯来文直译是“和他的弟兄”；在宗族名单中可能泛指同族男性，但正文保留原文亲属称谓，并以脚注说明语境上的可能含义。
- source_word: שְׁמוֹנִים
  choice: 八十人
  rationale: 该基数词说明与以利业一同被数点的人数；中文补出量词“人”以使表达完整自然。
