  yaml_path: translation/ot/1_chronicles/015/021.yaml
  text: and Mattithiah[a], Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead with lyres according to the Sheminith.
translation:
  language: zh_hans
  text: 玛他提雅、以利斐利户、米克尼雅、俄别以东、耶利和亚撒西雅用琴，按舍米尼[a]领奏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按第八”；也可能指“按较低的八度”。“舍米尼”是希伯来语音乐术语，确切含义不明。
    reason: 保留原文音乐术语的不确定性，并列出主要理解。
lexical_decisions:
- source_word: מַתִּתְיָהוּ
  choice: 玛他提雅
  rationale: 专有名词，按希伯来语形式音译，并采用现代中文圣经读者较熟悉的译名形式。
- source_word: אֱלִיפְלֵהוּ
  choice: 以利斐利户
  rationale: 专有名词，音译时保留原文末尾的 -hu 成分。
- source_word: מִקְנֵיָהוּ
  choice: 米克尼雅
  rationale: 专有名词，按希伯来语辅音结构音译；末尾神名成分采用中文人名中常见的“雅”。
- source_word: עֹבֵד אֱדֹם
  choice: 俄别以东
  rationale: 复合人名，采用中文圣经传统中通行且易辨认的音译。
- source_word: יעִיאֵל
  choice: 耶利
  rationale: 专有名词，采用简洁、通行的中文音译形式。
- source_word: עֲזַזְיָהוּ
  choice: 亚撒西雅
  rationale: 专有名词，按原文音译，并以“雅”体现末尾的神名成分。
- source_word: בְּכִנֹּרוֹת
  choice: 用琴
  rationale: כִּנּוֹר 指古代拨弦乐器，较接近里拉琴；正文用现代中文易懂的“琴”，并以“用”表达介词 בְּ 的工具意义。
- source_word: עַל הַשְּׁמִינִית
  choice: 按舍米尼调
  rationale: 这是含义不确切的音乐术语；正文保留音译“舍米尼”，用“调”提示其音乐功能，但不武断认定为八度或低音域。
- source_word: לְנַצֵּחַ
  choice: 领奏
  rationale: 在音乐语境中，此词可指督导、指挥或带领演奏；“领奏”自然简洁，也符合本节所列乐手使用弦乐器的情境。
