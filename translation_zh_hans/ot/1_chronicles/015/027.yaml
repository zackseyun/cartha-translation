  text: וְ/דָוִ֞יד מְכֻרְבָּ֣ל בִּ/מְעִ֣יל בּ֗וּץ וְ/כָל הַ/לְוִיִּם֙ הַ/נֹּשְׂאִ֣ים אֶת הָ/אָר֔וֹן וְ/הַ/מְשֹׁ֣רְרִ֔ים וּ/כְנַנְיָ֛ה הַ/שַּׂ֥ר הַ/מַּשָּׂ֖א הַ/מְשֹֽׁרְרִ֑ים וְ/עַל דָּוִ֖יד אֵפ֥וֹד בָּֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/027.yaml
  text: David was clothed with a robe of fine linen[a], as were all the Levites who were carrying the ark, and the singers, and Chenaniah, the leader of the singing of the singers; and on David was a linen ephod.
translation:
  language: zh_hans
  text: 大卫身穿细麻布外袍；所有抬约柜的利未人、歌唱的人，以及基拿尼雅——歌唱者中负责搬运的领袖[a]——也都这样穿着。大卫还穿着一件细麻布以弗得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话的希伯来文结构难解。直译可作“歌唱者中负责搬运的领袖”；其中“搬运”也可能指歌唱或音乐的事务，因此也可译作“负责歌唱的领袖”或“音乐领袖”。
    reason: 保留 הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים 的多种句法和词义可能，避免把有争议的职掌解释为唯一含义。
lexical_decisions:
- source_word: מְכֻרְבָּל בִּמְעִיל בּוּץ
  choice: 身穿细麻布外袍
  rationale: 被动分词表示穿着或裹着衣物；“身穿”在现代汉语中自然。מְעִיל 是外层袍服，בּוּץ 指优质细麻布。
- source_word: הַלְוִיִּם הַנֹּשְׂאִים אֶת־הָאָרוֹן
  choice: 抬约柜的利未人
  rationale: 分词表示行列中正在进行的动作；“抬”符合多人搬运约柜的语境。
- source_word: הַמְשֹׁרְרִים
  choice: 歌唱的人／歌唱者
  rationale: 该词词根明确涉及歌唱；按句法需要分别采用较自然的名词表达。
- source_word: כְנַנְיָה
  choice: 基拿尼雅
  rationale: 采用现代中文圣经传统中易辨识的人名音译。
- source_word: הַשַּׂר
  choice: 领袖
  rationale: 表示负责、主管之人；“领袖”简洁而不额外规定其职衔性质。
- source_word: אֵפוֹד בָּד
  choice: 细麻布以弗得
  rationale: 保留特定礼仪服饰“以弗得”的名称，不作带有祭司职分结论的意译；בָּד 在此指细麻布。
- source_word: וְעַל דָּוִיד
  choice: 大卫还穿着
  rationale: 希伯来文直译为“大卫身上还有”；中文以“还穿着”自然表达外袍之外另有以弗得。
theological_decisions:
- issue: 大卫在礼仪场合所穿以弗得的含义
  choice: 保留“以弗得”这一服饰名称，不据此说明大卫具有祭司职分
  alternative: 译作“祭司礼服”，或明说大卫在执行祭司职务
  rationale: 经文只陈述大卫的穿着，并未在本节明确授予或断言其祭司身份。
- issue: 短语 הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים 的句法困难
  choice: 正文采用“歌唱者的领袖”，并以脚注保留其他可能理解
  alternative: “负责搬运的领袖”或“负责歌唱／音乐的领袖”
  rationale: 马所拉文本的结构不寻常，הַמַּשָּׂא 通常涉及负担、搬运，也可能在此被理解为歌唱或音乐职务。正文需可读，脚注则明确保存原文歧义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“外袍”说明 מְעִיל 是外层衣服；“以弗得”保留专门服饰名称。将脚注标记放在相关困难短语之后，避免误以为脚注只解释“细麻布外袍”。
