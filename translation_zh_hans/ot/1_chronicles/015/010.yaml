  yaml_path: translation/ot/1_chronicles/015/010.yaml
  text: 'For the sons of Uzziel: Amminadab the chief[a], and his brothers, one hundred and twelve.'
translation:
  language: zh_hans
  text: 乌薛的子孙中，首领是亚米拿达；他的弟兄有一百一十二人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי
  choice: ……的子孙中
  rationale: 介词ל在本段名单中引出下一宗族；结合中文列举语序，译作“……的子孙中”自然清楚。בְּנֵי保留宗族、后裔含义，不限定为直系儿子。
- source_word: עֻזִּיאֵל
  choice: 乌薛
  rationale: 按现代中文圣经常见音译处理专名。
- source_word: עַמִּינָדָב
  choice: 亚米拿达
  rationale: 按现代中文圣经常见音译处理专名。
- source_word: הַשָּׂר
  choice: 首领
  rationale: שַׂר可指首领、领袖、长官或贵族；在利未宗族名单的语境中，“首领”最为自然，同时不赋予王族身份。
- source_word: וְאֶחָיו
  choice: 和他的弟兄
  rationale: אָח既可指亲兄弟，也可泛指同族男性成员；“弟兄”保留希伯来文的亲属称谓及其可能的较广范围。
- source_word: מֵאָה וּשְׁנֵים עָשָׂר
  choice: 一百一十二人
  rationale: 直译数目，并补出中文计人数所需的量词“人”。
