id: 1CH.15.13
reference: 1 Chronicles 15:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֛י לְ/מַ בָּ/רִ֥אשׁוֹנָ֖ה לֹ֣א אַתֶּ֑ם פָּרַ֨ץ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ בָּ֔/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/013.yaml
  text: Because you were not there the first time[a], Yahweh our God broke out against us[b], because we did not seek him according to the ordinance.
translation:
  language: zh_hans
  text: 因为头一次你们没有参与[a]，雅威我们的神就向我们发作；这是因为我们没有按定例寻求他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“因为头一次，不是你们”，句式十分压缩；也可译作“因为起初不是你们”。上下文表明，第一次搬运约柜时，利未人没有按规定承担这项工作。
    reason: alternative_reading
  - marker: b
    text: “寻求他”也可译作“求问他”；整句也可译作“我们没有照规定求问他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַבָּרִאשׁוֹנָה לֹא אַתֶּם
  choice: 头一次你们没有参与
  rationale: 原文表达高度压缩，直译近似“因为在头一次，不是你们”。结合上下文（代上15:2、12–15），所指是利未人未按规定参与第一次搬运约柜；译文补出“参与”，但不在正文中过度限定为“抬约柜”。
- source_word: פָּרַץ ... בָּנוּ
  choice: 向我们发作
  rationale: פָּרַץ在此描写神突然施行审判，并与前文“毗列斯·乌撒”的命名相呼应。“向我们发作”在现代汉语中自然，也保留猛烈爆发及敌对指向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的神
  rationale: 忠实表达第一人称复数所属关系，并保留盟约语境中的群体认同。
- source_word: דְרַשְׁנֻהוּ
  choice: 寻求他
  rationale: דרשׁ可指寻求、求问或查考；此处既关乎亲近神，也关乎遵从神所规定的礼仪程序。“寻求他”保留较宽的语义范围。
- source_word: כַּמִּשְׁפָּט
  choice: 按定例
  rationale: מִשְׁפָּט在此指搬运约柜所应遵守的规定或法定程序。“按定例”简洁而庄重，兼具规范性与程序性。
theological_decisions:
- issue: 开头省略成分及“不是你们”的所指
  choice: 理解为利未人在第一次搬运约柜时没有参与
  alternative: “因为起初不是你们”；或“因为头一次你们没有抬约柜”
  rationale: 上下文明示利未人应当抬约柜，并将第一次失败归因于没有按规定行事。正文适度补出“参与”以便读者理解，同时用脚注保留原文的压缩性和其他表达可能。
- issue: פָּרַץ所描述的神圣行动
  choice: 雅威突然向群体施行严厉审判
  alternative: “雅威在我们中间冲破缺口”或“雅威击打了我们”
  rationale: “向我们发作”保留神因圣洁要求遭违背而施行审判的力度，也避免把原文具体化为并未明说的行动方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“参与”是为补足希伯来语省略信息所作的最小限度显明化；“定例”保留礼仪规定的规范意味，但避免过度法律化。神名统一译作“雅威”。
