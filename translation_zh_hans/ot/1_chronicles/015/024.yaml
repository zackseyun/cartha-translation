base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/024.yaml
  text: And Shebaniah[a], Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests were blowing the trumpets before the ark of God[c][b], and Obed-edom and Jehiah were gatekeepers for the ark.
translation:
  language: zh_hans
  text: 祭司示巴尼雅、约沙法、拿坦业、亚玛赛、撒迦利雅、比拿雅和以利以谢在上帝的约柜前吹响[a]号筒[b]；俄别以东和耶希亚担任约柜的守门人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吹奏”。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来语通常指祭司在敬拜礼仪中使用的直形号筒。
    reason: cultural_note
  - marker: c
    text: 或译“为约柜守门”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 定冠词表明前面所列诸人属于祭司群体；把“祭司”置于名单之前，符合现代汉语表达，也清楚保留其同位关系。
- source_word: מחצצרים
  choice: 吹响
  rationale: 该分词表示行列中正在持续进行的动作；“吹响”自然表达吹奏号筒，同时不把动作过度具体化。
- source_word: בַּחֲצֹצְרוֹת
  choice: 号筒
  rationale: חֲצֹצְרוֹת 指号筒，常特指祭司在礼仪中使用的直形号筒；“号筒”比泛称“号”更清楚，又不擅自加入本节未明说的“银制”。
- source_word: לִפְנֵי
  choice: 在……前
  rationale: 保留行列场景中的空间关系，表示祭司位于约柜前方。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: 直接表达希伯来语属格结构，并采用现代标准汉语中自然、庄重的圣经用语。
- source_word: שֹׁעֲרִים
  choice: 守门
  rationale: 该词指负责门户看守的人；在谓语位置译作“守门”符合汉语习惯，并保留其职分含义。
- source_word: לָאָרוֹן
  choice: 为约柜
  rationale: 此处介词表示与约柜有关的职责或任务；“为约柜守门”简洁保留这种责任关系。
- source_word: וְעֹבֵד אֱדֹם
  choice: 俄别以东
  rationale: 按普通话圣经人名的通行形式音译该专名。
- source_word: וִיחִיָּה
  choice: 耶希亚
  rationale: 按希伯来语人名音译，并采用清楚、易辨认的现代汉语形式。
