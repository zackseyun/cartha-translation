  text: And David gathered the sons of Aaron and the Levites.
translation:
  language: zh_hans
  text: 大卫召集了亚伦的子孙和利未人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: 召集了
  rationale: 动词 אסף 在叙事语境中表示把人聚集起来；“召集”自然、庄重，并适合大卫主动集合有关人员的语境。
- source_word: דָּוִיד
  choice: 大卫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בְּנֵי אַהֲרֹן
  choice: 亚伦的子孙
  rationale: 字面结构为“亚伦的众子”，但此处所指是亚伦谱系中的成员，而非仅指亚伦亲生的儿子；“子孙”既保留宗族关系，也避免现代读者误解为同一代亲子。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 该词指利未群体；“利未人”是准确、自然且通行的中文对应语。
- source_word: אֵת ... וְאֵת
  choice: 不单独译出，以“……和……”连接两个宾语
  rationale: אֵת 是确定直接宾语标记，中文没有对应词；重复结构通过正常的并列宾语表达。
theological_decisions: []
