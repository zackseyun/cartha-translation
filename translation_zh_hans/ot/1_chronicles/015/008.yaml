  yaml_path: translation/ot/1_chronicles/015/008.yaml
  text: 'For the sons of Elizaphan: Shemaiah the chief[a], and two hundred of his brothers.'
translation:
  language: zh_hans
  text: 以利撒反的子孙中，有首领示玛雅和他的弟兄二百人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“族人”；这里的希伯来词在家谱或点名册中可以泛指同族成员，不一定只是亲兄弟。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: ……的子孙中
  rationale: לְ在这份名单中引出所属宗族；בְּנֵי字面为“儿子们”，此处指以男性世系命名的宗族成员。译作“子孙中”既符合现代汉语列举方式，也保留宗族含义。
- source_word: אֱלִיצָפָן
  choice: 以利撒反
  rationale: 按中文圣经人名的通行音译处理。
- source_word: שְׁמַעְיָה
  choice: 示玛雅
  rationale: 按中文圣经人名的通行音译处理。
- source_word: הַשָּׂר
  choice: 首领
  rationale: שַׂר可指首领、官长或统领；在宗族名单中，“首领”自然表达此人带领该组的身份，又不暗示王室或特定军职。
- source_word: וְאֶחָיו
  choice: 和他的弟兄
  rationale: אָח既可指亲兄弟，也可泛指同族男子；正文采用较贴近原文的“弟兄”，并以脚注说明在本语境中的较广含义。
- source_word: מָאתָיִם
  choice: 二百人
  rationale: 直译数词，并补出汉语计数所需的量词“人”。
theological_decisions: []
