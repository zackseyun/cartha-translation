  text: וַ/יִּשְׂא֣וּ בְנֵֽי הַ/לְוִיִּ֗ם אֵ֚ת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה מֹשֶׁ֖ה כִּ/דְבַ֣ר יְהוָ֑ה בִּ/כְתֵפָ֥/ם בַּ/מֹּט֖וֹת עֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/015.yaml
  text: And the sons of the Levites carried the ark of God on their shoulders with the poles upon them[a], just as Moses had commanded according to the word of Yahweh.
translation:
  language: zh_hans
  text: 利未人的子孙照着雅威的话，正如摩西所吩咐的，用杠把上帝的柜扛在肩上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“肩上有杠”。希伯来语此处描写他们以搁在肩上的杠承载上帝的柜。
    reason: 保留 בִּכְתֵפָם בַּמֹּטוֹת עֲלֵיהֶם 中杠与肩膀的空间关系，并说明较直译的表达。
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: 抬
  rationale: 此处 נשׂא 指承载并运送约柜；“抬”自然体现多人用杠搬运，而不只是短暂举起。
- source_word: בְנֵי הַלְוִיִּם
  choice: 利未人的子孙
  rationale: 保留原文明确的亲属、支派表达“利未人的众子”，又以现代汉语较自然的“子孙”指其男性后裔。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: “约柜”是 אֲרוֹן 在此礼仪语境中的通行名称；“上帝的”准确保留所属关系，但不增添本节未出现的“约”。
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: 正如摩西……所吩咐的
  rationale: “正如”表达 כַּאֲשֶׁר 所表示的完全遵照和对应关系。
- source_word: כִּדְבַר יְהוָה
  choice: 照着雅威的话
  rationale: 保留 דָּבָר 的“话”及介词所表达的依据关系，并将四字神名音译为“雅威”。
- source_word: בִּכְתֵפָם
  choice: 在肩上
  rationale: 准确表达承载位置；结合复数主体，汉语无需重复所有格也清楚指他们的肩膀。
- source_word: בַּמֹּטוֹת עֲלֵיהֶם
  choice: 用杠……抬在肩上
  rationale: 将工具和位置合并为自然汉语，说明他们借杠承载约柜；脚注保留原文“杠在他们上面”的具体表述及可能译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较普遍认可的发音音译，保留其专名性质。
- issue: בְנֵי הַלְוִיִּם 的性别及支派表达
  choice: 利未人的子孙
  alternative: 利未人
  rationale: 原文明确采用阳性复数的亲属称谓，不将其概括为不带亲属关系的支派名称。
- issue: כִּדְבַר יְהוָה 与摩西命令的关系
  choice: 摩西照着雅威的话所吩咐的
  alternative: 照雅威的话，正如摩西所吩咐的
  rationale: 就近理解为摩西的吩咐以雅威的话为依据，同时承认另一种断句在语义上接近；不把“话”窄化为“律法”或其他教义术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“用杠……抬在肩上”符合汉语搬运场景；句末保留“正如……所吩咐的”，凸显行动与神圣指示相符。
