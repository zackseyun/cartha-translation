source:
  edition: WLC
  text: אָ֚ז אָמַ֣ר דָּוִ֔יד לֹ֤א לָ/שֵׂאת֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כִּ֖י אִם הַ/לְוִיִּ֑ם כִּי בָ֣/ם בָּחַ֣ר יְהוָ֗ה לָ/שֵׂ֞את אֶת אֲר֧וֹן יְהוָ֛ה וּֽ/לְ/שָׁרְת֖/וֹ עַד עוֹלָֽם־־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/002.yaml
  text: Then David said[a], “No one is to carry the ark of God except the Levites[b], for Yahweh has chosen them to carry the ark of Yahweh and to minister to him forever.”
translation:
  language: zh_hans
  text: 那时，大卫说：“除了利未人以外，谁也不可抬上帝的约柜[a]，因为耶和华拣选了他们抬耶和华的约柜，并永远侍奉他[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用省略句式，前半句没有明说主语；也可译作“上帝的约柜不可由利未人以外的人抬”。
    reason: lexical_alternative
  - marker: b
    text: “侍奉”也可译作“服事”。“他”最自然是指耶和华；也有人把这句话理解为在约柜前供职，或为约柜执行礼仪职务。
    reason: textual_ambiguity
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为叙事中的时间标记，承接前文事件；“那时”自然、庄重，也保留了事件的先后关系。
- source_word: אָמַר דָּוִיד
  choice: 大卫说
  rationale: 采用现代汉语中无标记的叙事引语表达，准确对应原文。
- source_word: לֹא לָשֵׂאת אֶת אֲרוֹן הָאֱלֹהִים כִּי אִם הַלְוִיִּם
  choice: 除了利未人以外，谁也不可抬上帝的约柜
  rationale: 希伯来文是省略结构，字面没有明说前半句的主语；汉语补出“谁也”，既通顺，又保留排他和禁止的语气。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: 在以色列敬拜语境中，אֲרוֹן指神圣的柜；“约柜”是现代汉语圣经语体中明确而通行的称呼。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是该族群名称在现代汉语中的标准译法。
- source_word: כִּי בָם בָּחַר יְהוָה
  choice: 因为耶和华拣选了他们
  rationale: כִּי说明前述规定的理由；“拣选了”表达已经发生且其效力持续的选择。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语中对四字神名通行且可识别的音译，以保留原文使用的专名。
- source_word: לָשֵׂאת
  choice: 抬
  rationale: 此处指多人肩负并搬运约柜；“抬”比一般性的“携带”更具体，也符合上下文。
- source_word: אֲרוֹן יְהוָה
  choice: 耶和华的约柜
  rationale: 直接呈现原文的所属关系，并保留本节重复“约柜”的措辞。
- source_word: וּלְשָׁרְתוֹ
  choice: 并……侍奉他
  rationale: שרת在利未人的职分语境中常指礼仪或圣所中的事奉；“侍奉”兼顾神圣职分的意味和现代可懂度。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 自然表达这项任命持续长久、没有预定终点的含义。
theological_decisions:
- issue: וּלְשָׁרְתוֹ中第三人称阳性单数后缀的所指
  choice: 译作“侍奉他”，主要理解为侍奉耶和华
  alternative: 理解为在约柜前供职，或为约柜执行礼仪职务
  rationale: 利未人的神圣职分通常被描述为侍奉耶和华，因此以耶和华为所指最自然；但原文代词本身没有重述先行词，语法上与上下文仍容许联系约柜来理解，故在注释中保留这一可能。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“抬”具体呈现搬运约柜的动作；“侍奉”保留利未人圣所职分的礼仪色彩。所有注脚标记均置于正文相关短语之后。
