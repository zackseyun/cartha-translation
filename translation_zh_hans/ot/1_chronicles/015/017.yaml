base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/017.yaml
  text: So the Levites appointed Heman son of Joel[a], and from his brothers Asaph son of Berechiah, and from the sons of Merari, their brothers[b], Ethan son of Kushaiah.
translation:
  language: zh_hans
  text: 于是，利未人派定[a]约珥的儿子希幔，又从他的弟兄中派定比利家的儿子亚萨，又从他们的弟兄、米拉利的子孙[b]中派定古沙雅的儿子以探。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使……就位”或“安置在岗位上”；希伯来文动词可指使人站在指定的位置或职分上。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“米拉利的众子”，即米拉利宗族的后裔。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲמִידוּ
  choice: 派定
  rationale: 该动词为עמד的使役形，在此表示使人站在指定岗位上；“派定”既体现正式指派，也适合组织利未歌唱者的语境。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 采用现代中文圣经语境中通行的族群称谓，并保留定指含义。
- source_word: וּמִן אֶחָיו
  choice: 又从他的弟兄中
  rationale: מן表示从一群人中选出；保留单数代词“他的”和亲属称谓“弟兄”，不把关系进一步解释化。
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: 又从……米拉利的子孙中
  rationale: 保留希伯来文“米拉利的众子”这一宗族表达，同时用现代中文更自然的“子孙”表达氏族后裔。
- source_word: אֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 保留原文复数代词及亲属用语；在上下文中指同属利未支派的弟兄，不改写为较具解释性的“族人”。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 原文明确表达父子谱系关系，中文逐一保留。
- source_word: הֵימָן / יוֹאֵל / אָסָף / בֶּרֶכְיָהוּ / מְרָרִי / אֵיתָן / קוּשָׁיָהוּ
  choice: 希幔／约珥／亚萨／比利家／米拉利／以探／古沙雅
  rationale: 采用简体中文圣经传统中通行且易辨认的人名译写。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。以重复“派定”澄清同一谓语统摄三位受任者，同时保留“他的弟兄”“他们的弟兄”在原文中的代词形式与亲属表达，避免过度解释其具体所指。
