lexical_decisions:
- source_word: בֶּרֶכְיָה
  choice: 比利迦
  rationale: 按现代中文圣经人名的通行音译处理，保留其作为专名的功能，不翻译名字的词源含义。
- source_word: אֶלְקָנָה
  choice: 以利加拿
  rationale: 按现代中文圣经人名的通行音译处理，保留其作为专名的功能，不翻译名字的词源含义。
- source_word: שֹׁעֲרִים
  choice: 守门
  rationale: 该复数名词指负责看守门口或入口的人；中文用“守门”作谓语自然简洁，并准确表达其职分。
- source_word: לָאָרוֹן
  choice: 为约柜
  rationale: 介词ל可表示职务所关联或服务的对象，也可能表示所在位置；正文采用“为约柜”表达受派负责与约柜有关的守门工作，同时以脚注保留地点性的理解。
- source_word: וְ
  choice: 和
  rationale: 自然连接两个人名。
