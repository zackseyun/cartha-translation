source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַתֶּ֛ם רָאשֵׁ֥י הָ/אָב֖וֹת לַ/לְוִיִּ֑ם הִֽתְקַדְּשׁוּ֙ אַתֶּ֣ם וַ/אֲחֵי/כֶ֔ם וְ/הַֽעֲלִיתֶ֗ם אֵ֣ת אֲר֤וֹן יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֶל הֲכִינ֖וֹתִי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/012.yaml
  text: And he said to them[a], “You are the heads of the fathers’ houses of the Levites. Sanctify yourselves, you and your brothers, and bring up the ark of Yahweh, the God of Israel, to the place I have prepared for it.”
translation:
  language: zh_hans
  text: 他对他们说：“你们是利未人各宗族的首领。你们和你们的弟兄都要使自己分别为圣[a]，把以色列的上帝耶和华的约柜抬上来，送到我为它预备的地方。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使自己成圣”。希伯来语动词指礼仪上的自我圣化，包含洁净并分别为圣的意思。
    reason: 保留הִתְקַדְּשׁוּ的礼仪性自我圣化含义，并避免将其限缩为一般洁净或增添未明说的职务目的。
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת לַלְוִיִּם
  choice: 利未人各宗族的首领
  rationale: 该短语指利未人中按父系宗族划分的领袖。“各宗族的首领”既保留其社会结构，也比直译“父家”更符合现代汉语习惯。
- source_word: הִתְקַדְּשׁוּ
  choice: 洁净自己
  rationale: 此处是קדשׁ的Hitpael形式，指为承担圣职而进行礼仪性的自我洁净和分别为圣；正文采用自然的现代汉语表达，并以脚注保留“分别为圣”的译法。
- source_word: וַאֲחֵיכֶם
  choice: 你们的弟兄
  rationale: 保留原文“弟兄”的亲属称谓；在语境中指同属利未支派的族人。
- source_word: וְהַעֲלִיתֶם
  choice: 抬上来
  rationale: עלה的使役形式有“使上去、带上来”之意；约柜须由利未人抬运，因此“抬上来”兼顾方向和运输方式。
- source_word: אֲרוֹן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 耶和华—以色列的上帝—的约柜
  rationale: 保留神名及同位说明“以色列的上帝”；破折号使现代汉语中的修饰关系清晰，避免误读。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行的专名音译，明确呈现原文的四字神名，而不以“主”替代。
- source_word: אֶל הֲכִינוֹתִי לוֹ
  choice: 送到我为它预备的地方
  rationale: 原文在介词“到”后省略目的地名词；根据上下文补出“地方”，使汉语完整自然，同时不额外限定所预备地点的性质。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知的“耶和华”，既作为专名呈现，又不以称号“主”取代；“雅威”是较接近学术重构读音的另一可行音译。
- issue: הִתְקַדְּשׁוּ所表达的圣化行动
  choice: 正文译“洁净自己”，脚注说明“使自己分别为圣”
  alternative: 使自己分别为圣
  rationale: 该动词兼具礼仪洁净和为神圣用途分别出来的含义。正文选用自然易懂的表达，脚注保留其圣化含义，避免将其缩减为一般卫生清洁或抽象道德改善。
- issue: 预备之对象或地点的省略
  choice: 补出“地方”
  alternative: 到我为它所预备的那里
  rationale: 介词אֶל表明方向，而“我预备”之后的地点在希伯来文中省略。上下文明确涉及安放约柜之处，补出“地方”是语法性明示，并未进一步断定其具体形态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宗族”呈现父系家族单位而避免生硬的“父家”；“弟兄”保留古代亲族语境；以插入式破折号清楚标示“以色列的上帝”是对“耶和华”的同位说明。
