base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/029.yaml
  text: And as the ark of the covenant of Yahweh came to the city of David[a], Michal the daughter of Saul looked out through the window and saw King David dancing and playing, and she despised him in her heart.
translation:
  language: zh_hans
  text: 耶和华的约柜来到大卫城时，扫罗的女儿米甲从窗户往外看，看见大卫王又跳舞又欢庆[a]，心里就轻视他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢庆”也可译为“嬉乐”或“玩乐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 耶和华的约柜
  rationale: “约柜”是现代汉语圣经语境中对“约之柜”的自然固定表达；属格“耶和华的”保留其与圣约之神的关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文最通行的音译呈现四字神名，保留其专名性质，不以“主”这一称号替代。
- source_word: בָּא עַד עִיר דָּוִיד
  choice: 来到大卫城
  rationale: בוא与עַד在此表示到达目的地；“来到”忠实自然，又不额外断定已经进入城内。
- source_word: מִיכַל בַּת שָׁאוּל
  choice: 扫罗的女儿米甲
  rationale: 保留叙事对米甲“扫罗之女”身份的强调，同时符合现代汉语称谓顺序。
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: 从窗户向外观看
  rationale: 表达从窗内向外观看的动作，不强行加入原文在此并未明确要求的“向下”。
- source_word: וַתֵּרֶא אֶת הַמֶּלֶךְ דָּוִיד
  choice: 看见大卫王
  rationale: “大卫王”是汉语中自然的称号与人名组合。
- source_word: מְרַקֵּד
  choice: 跳舞
  rationale: 该分词描写充满活力的舞动；“跳舞”清楚、自然，并适合庆典场景。
- source_word: וּמְשַׂחֵק
  choice: 欢庆
  rationale: שׂחק在此礼仪 procession 语境中表示欢快、嬉乐的举动；“欢庆”保留喜乐庆贺之意，又避免现代汉语“玩耍”可能带来的幼稚或轻浮含义。
- source_word: וַתִּבֶז לוֹ
  choice: 就轻视他
  rationale: בזה表达鄙视或看不起；“轻视”力度适切且符合现代书面汉语。
- source_word: בְּלִבָּהּ
  choice: 心里
  rationale: 直接保留这种内在态度的表达，简洁而自然。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均用于音译该神名；采用“耶和华”是因其在现代中文读者中最广为识别，同时仍将其作为专名而非称号呈现。
- issue: 米甲对大卫的内在态度
  choice: 心里就轻视他
  alternative: 心里就藐视他
  rationale: 原文明确表达内心的鄙视，却没有说明其判断是否正确；译文保留这一叙事陈述，不作神学上的褒贬补充。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“又跳舞又欢庆”保留两个并列分词所描绘的公开庆贺动作；全节按希伯来叙事推进，以“时、看见、就”使句法清楚流畅。
