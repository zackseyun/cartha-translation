  yaml_path: translation/ot/1_chronicles/015/019.yaml
  text: The singers were Heman[a], Asaph, and Ethan, with bronze cymbals to sound aloud.
translation:
  language: zh_hans
  text: 歌唱者是希幔、亚萨和以探；他们用青铜钹使声音响起[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使人听见”。希伯来原文直译为“使（声音）被听见”。
    reason: 保留使役式不定词 לְהַשְׁמִיעַ 的字面含义及其在音乐语境中的可译空间。
lexical_decisions:
- source_word: וְהַמְשֹׁרְרִים
  choice: 歌唱的人
  rationale: 该词是带定冠词的主动分词，特指承担歌唱职分的人；译为“歌唱的人”比范围较广的“乐师”更准确。句首连接词按现代汉语行文自然省略。
- source_word: הֵימָן אָסָף וְאֵיתָן
  choice: 希幔、亚萨和以探
  rationale: 三个专名按现代中文圣经常用译名音译，并自然保留末项前的连接关系。
- source_word: בִּמְצִלְתַּיִם
  choice: 用……钹
  rationale: 介词 בְּ 在此表示工具或手段；“用……钹”清楚表达他们借此奏乐。
- source_word: נְחֹשֶׁת
  choice: 青铜
  rationale: 此词在古代器物语境中通常指铜或铜合金；“青铜”比可能造成时代错置的“黄铜”更合适，也明确交代乐器材质。
- source_word: לְהַשְׁמִיעַ
  choice: 发出响声
  rationale: 这是 שׁמע 的使役式不定词，字面为“使被听见”。在击钹的音乐语境中，“发出响声”自然表达其使声音可闻的作用，同时以脚注保留字面含义。
