base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/022.yaml
  text: And Chenaniah[a], chief of the Levites, directed the carrying[b], because he was skillful at it.
translation:
  language: zh_hans
  text: 利未人的首领基拿尼雅在搬运的事上负责指挥[a]；他在搬运的事上受过训练，因为他精通此事。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“利未人的首领基拿尼雅在歌唱的事上负责指导；他在歌唱的事上受过训练，因为他精通此事。”希伯来语 מַשָּׂא 通常意为“重担”或“搬运”，但因上下文提到歌唱者和乐师，有人认为本节是指歌唱或音乐。
    reason: alternative_reading
  - marker: b
    text: 希伯来原文两次使用同一个名词，直译为“在搬运的事上……在搬运的事上”。“受过训练”译自意为“教导／训练”的动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַנְיָהוּ
  choice: 基拿尼雅
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: שַׂר הַלְוִיִּם
  choice: 利未人的首领
  rationale: שַׂר 在此礼仪和管理语境中指居领导、监督地位的人；“首领”简洁庄重。
- source_word: בְּמַשָּׂא
  choice: 抬运
  rationale: מַשָּׂא 通常指重担、搬运或运送；本章叙述约柜的搬运，因此正文采用其直接含义，同时以脚注保留音乐性理解。
- source_word: יָסֹר
  choice: 负责指导
  rationale: 该动词在此表达教导、指挥或监督；“负责指导”既体现职责，也不过度限定具体行政形式。
- source_word: כִּי מֵבִין הוּא
  choice: 因为他精通此事
  rationale: מֵבִין 在此更可能表示具备理解力、经验或专长；“精通”自然地表达实际能力。
theological_decisions:
- issue: מַשָּׂא 在本节是指搬运还是歌唱
  choice: 正文译作“抬运”
  alternative: “歌唱”或“音乐”
  rationale: 该词通常指重担或搬运，且上下文涉及抬约柜；但本章也提到歌唱和乐师，因此脚注保留音乐性解释，不消除原文的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“负责指导”表达监督职责；脚注完整保留“搬运／歌唱”的真实歧义，并说明原文的词语重复。
