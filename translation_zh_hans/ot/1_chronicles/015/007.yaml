  text: 'For the sons of Gershom: Joel the chief[b][a], and 130 of his brothers.'
translation:
  language: zh_hans
  text: 革舜[a]的子孙中，有首领约珥和他的一百三十名弟兄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文作“革舜”；这个利未宗族的名称也常按另一形式译作“革顺”。
    reason: alternative_reading
  - marker: b
    text: 这里的“弟兄”指同一利未家族群体中的男性成员，不一定都是约珥的亲兄弟。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: ……的子孙中
  rationale: 前缀 ל־在本段名单中引出下一宗族；בְּנֵי在族谱语境中指某祖先所属的后代群体，译作“子孙”比字面的“儿子”更符合现代汉语，同时保留宗族含义。
- source_word: גֵּרְשׁוֹם
  choice: 革舜
  rationale: 按本节马所拉文本的 Gershom 音译，并用脚注说明它与较常见的宗族名称“革顺”（Gershon）的关系，不将文本形式默改为另一名称。
- source_word: יוֹאֵל
  choice: 约珥
  rationale: 采用该希伯来人名在中文圣经传统中的通行译名。
- source_word: הַשָּׂר
  choice: 首领
  rationale: שַׂר可指首领、长官或领袖；此处是利未宗族编组名单，“首领”准确表达其领导身份，又不带王族含义。
- source_word: וְאֶחָיו
  choice: 以及他的弟兄
  rationale: 保留אָח的基本亲属称谓；在这里按宗族名单语境理解为同一利未家族群体中的男性成员，不必都是约珥的亲兄弟，并以脚注说明。
- source_word: מֵאָה וּשְׁלֹשִׁים
  choice: 一百三十人
  rationale: 准确表达基数130；加量词“人”使现代汉语自然，并明确数字修饰约珥的弟兄。
