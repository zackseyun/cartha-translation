  text: 'For the sons of Kohath: Uriel the chief[a], and 120 of his brothers.'
translation:
  language: zh_hans
  text: 哥辖的子孙中，有首领乌列和他的弟兄一百二十人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可指“同族的人”；这里很可能指哥辖宗族的其他成员，不一定只是乌列的亲兄弟。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קְהָת
  choice: 哥辖的子孙中
  rationale: לִבְנֵי在此引出利未支派名单中的哥辖宗族。译作“哥辖的子孙中”既符合现代汉语的列举方式，也保留其宗族后裔的含义。
- source_word: אוּרִיאֵל
  choice: 乌列
  rationale: 按中文圣经人名的通行译法音译。
- source_word: הַשָּׂר
  choice: 首领
  rationale: שַׂר在此指负责带领该宗族队伍的人；“首领”自然准确，又不带“王子”可能产生的王室含义。
- source_word: וְאֶחָיו
  choice: 和他的弟兄
  rationale: 直译为“他的弟兄”，同时保留该词在宗族名单中可泛指同族男子的可能性。
- source_word: מֵאָה וְעֶשְׂרִים
  choice: 一百二十人
  rationale: 按现代汉语自然表达数字，并补出量词“人”；人数的语义由上下文明确。
