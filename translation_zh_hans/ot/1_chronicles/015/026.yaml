  text: וַֽ/יְהִי֙ בֶּ/עְזֹ֣ר הָֽ/אֱלֹהִ֔ים אֶ֨ת הַ/לְוִיִּ֔ם נֹשְׂאֵ֖י אֲר֣וֹן בְּרִית יְהוָ֑ה וַ/יִּזְבְּח֥וּ שִׁבְעָֽה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/026.yaml
  text: And when God helped the Levites who were carrying the ark of the covenant of Yahweh[a], they sacrificed seven bulls and seven rams.
translation:
  language: zh_hans
  text: 上帝帮助那些抬着雅威的约柜[a]的利未人时，他们献上了七头公牛和七只公羊为祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威之约柜。”
    reason: 原文 אֲרוֹן בְּרִית יְהוָה 为连续属格结构；“雅威的约柜”是自然的现代汉语表达，“雅威之约柜”则较贴近原文构式。
lexical_decisions:
- source_word: בֶּעְזֹר
  choice: 帮助……时
  rationale: 介词 בְּ 加不定词与 וַיְהִי 连用，构成时间从句；这样译既反映“当……时”的关系，也符合现代汉语表达。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此处虽带定冠词，但指以色列的上帝；“上帝”是自然、庄重且通行的现代汉语称谓。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是该族群名称的标准汉译。
- source_word: נֹשְׂאֵי
  choice: 那些抬……的
  rationale: 分词修饰“利未人”，表示他们当时持续承担抬柜的职责；“抬”也准确体现多人搬运礼仪器物的场景。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 雅威之约柜
  rationale: 保留希伯来语连续属格结构及“约柜”这一通行称呼，同时不把它过度解释为某一种单一的汉语句法关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列上帝专名的性质，而不以称号替代。
- source_word: וַיִּזְבְּחוּ
  choice: 他们就献了……为祭
  rationale: 动词为第三人称阳性复数；“献……为祭”自然表达祭祀语境，也明确保留复数主语。
- source_word: שִׁבְעָה פָרִים
  choice: 七头公牛
  rationale: פָרִים 在献祭语境中指公牛；量词“头”符合现代汉语习惯。
- source_word: וְשִׁבְעָה אֵילִים
  choice: 和七只公羊
  rationale: אֵילִים 明确指公羊；重复数字“七”以保留原文的对称和节奏。
theological_decisions:
- issue: 献祭动作的主语
  choice: 他们就献了
  alternative: 他就献了
  rationale: 希伯来语 וַיִּזְבְּחוּ 是第三人称阳性复数，因此译文保留复数，却不超出原文去限定究竟是利未人还是队伍中更广泛的参与者。
- issue: 神名的表达
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用专名 יְהוָה；音译可保留其专名性质，避免将其无提示地转化为称号。
- issue: אֲרוֹן בְּרִית יְהוָה 的属格关系
  choice: 雅威之约柜
  alternative: 雅威的约柜
  rationale: 原文连续属格可按“雅威之约的柜”理解，也可在汉语传统表达中理解为“雅威的约柜”；正文采用凝练而仍保留结构张力的说法，并以脚注列出自然的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抬”贴合多人搬运约柜的场景；“献……为祭”兼顾礼仪含义与普通读者的可读性。脚注标记置于整句末尾，但所注释的是正文中的“雅威之约柜”。
