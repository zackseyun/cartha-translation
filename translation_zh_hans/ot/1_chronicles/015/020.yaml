  text: and Zechariah[a], Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah, with harps according to Alamoth.
translation:
  language: zh_hans
  text: 还有撒迦利雅、雅薛、示米拉末、耶歇、乌尼、以利押、玛西雅和比拿雅，用竖琴按“阿拉摩特”[a]演奏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿拉摩特”是希伯来语音乐术语，确切含义不明；可能与少女有关，或指较高的音域。
    reason: 保留原文音乐术语的语义不确定性，避免在正文中武断地定为某种调式或音域。
lexical_decisions:
- source_word: בִּנְבָלִים
  choice: 用竖琴
  rationale: נֶבֶל指一种弦乐器，具体构造不能完全确定；“竖琴”在现代汉语中自然易懂，也能与本节的器乐语境相合。前缀בִּ־按工具用法译为“用”。
- source_word: עַל
  choice: 按
  rationale: 在音乐语境中，עַל可能表示所依据的曲调、调式或音域；“按”保留这种关系，同时避免把它误解为纯粹的空间意义。
- source_word: עֲלָמוֹת
  choice: “阿拉摩特”[a]
  rationale: 该词在这里很可能是音乐术语，但确切含义不明，可能与少女或较高音域有关。正文音译以保留不确定性，可能含义在脚注说明。
- source_word: וּ/זְכַרְיָה וַ/עֲזִיאֵל וּ/שְׁמִירָמוֹת וִֽ/יחִיאֵל וְ/עֻנִּי וֶֽ/אֱלִיאָב וּ/מַעֲשֵׂיָהוּ וּ/בְנָיָהוּ
  choice: 还有撒迦利雅、雅薛、示米拉末、耶歇、乌尼、以利押、玛西雅和比拿雅
  rationale: 人名采用中文圣经传统中通行且易于辨认的音译。句首连接词וּ־译为“还有”，承接上文的人员名单。
