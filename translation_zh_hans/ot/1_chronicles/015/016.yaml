base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/016.yaml
  text: Then David told the leaders of the Levites to appoint their brothers, the singers, with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy.
translation:
  language: zh_hans
  text: 大卫吩咐利未人的首领，指派他们的弟兄[a]，就是歌唱的人，用瑟、琴[b]和钹等乐器，使声音响亮，高声欢庆。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的弟兄”指与这些首领同属利未支派的人。
    reason: cultural_note
  - marker: b
    text: “瑟”和“琴”译自两种古代弦乐器的名称；它们的具体形制如今不能完全确定。
    reason: historical_note
  - marker: c
    text: “高声欢庆”也可理解为“扬起声音而欢喜”；希伯来原文近于“用声音扬起，为着欢喜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִיד
  choice: 大卫吩咐
  rationale: וַיֹּאמֶר本义为“说”，但后接表示命令内容的不定式；“吩咐”在现代汉语中自然地表达大卫向首领下达安排。叙事先后关系可由上下文体现，无须机械加入“于是”。
- source_word: לְשָׂרֵי הַלְוִיִּם
  choice: 利未人的首领
  rationale: שָׂרֵי可指首领、长官或负责人；此处涉及组织歌唱人员，“首领”准确而庄重。
- source_word: לְהַעֲמִיד
  choice: 指派
  rationale: עמד的使役式可表示使其站立、安置或任命。这里是为礼仪职务安排人员，因此译作“指派”，同时避免误解为只让他们站在某处。
- source_word: אֶת אֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 保留原文的亲属称谓；语境中所指的是这些首领的利未同族，另以脚注说明。
- source_word: הַמְשֹׁרְרִים
  choice: 歌唱的人
  rationale: 该分词特指歌唱者，不宜泛化为所有乐师；“歌唱的人”比文言色彩较重的“歌者”更易懂。
- source_word: בִּכְלֵי שִׁיר
  choice: 拿着乐器
  rationale: 原文直译为“用音乐的器具”。结合“指派……歌唱的人”的句法，以“拿着乐器”自然表达他们执行职务时配用这些乐器。
- source_word: נְבָלִים וְכִנֹּרוֹת וּמְצִלְתָּיִם
  choice: 瑟、琴和钹
  rationale: 以中文圣经语境中简明且可区分的传统名称表达三类乐器；前两种古代弦乐器的精确构造仍有争议，故加脚注保留不确定性。
- source_word: מַשְׁמִיעִים
  choice: 奏出响亮的声音
  rationale: שׁמע的使役分词意为“使人听见、发出声响”。“奏出响亮的声音”符合乐器语境，也体现公开可闻的效果，但不额外指定具体演奏方式。
- source_word: לְהָרִים בְּקוֹל לְשִׂמְחָה
  choice: 扬声欢庆
  rationale: 原文近于“用声音扬起，为了欢喜”。“扬声欢庆”保留声音被高扬和喜乐庆贺两层含义，又避免擅自补入原文没有明说的“歌曲”。
theological_decisions:
- issue: 末句是否明确补出“赞美”或敬拜对象
  choice: 扬声欢庆
  alternative: 高声赞美耶和华
  rationale: 本节原文只明确说扬起声音以表达欢喜，没有在该短语中明说“赞美”或对象。译文不从邻近礼仪语境补入神学上虽合理、但本句未明载的内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“吩咐”“指派”体现组织礼仪人员的行政语境；保留“弟兄”这一原文亲属称谓并用脚注消除歧义。乐器名称沿用简洁的中文传统称法，同时注明考古辨识上的不确定性。末句不补入“歌曲”“赞美”或敬拜对象，以保存希伯来语表达的开放性。
