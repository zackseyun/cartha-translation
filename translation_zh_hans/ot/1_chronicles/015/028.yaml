  text: וְ/כָל יִשְׂרָאֵ֗ל מַעֲלִים֙ אֶת אֲר֣וֹן בְּרִית יְהוָ֔ה בִּ/תְרוּעָה֙ וּ/בְ/ק֣וֹל שׁוֹפָ֔ר וּ/בַ/חֲצֹצְר֖וֹת וּ/בִ/מְצִלְתָּ֑יִם מַשְׁמִעִ֕ים בִּ/נְבָלִ֖ים וְ/כִנֹּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/028.yaml
  text: And all Israel was bringing up the ark of the covenant of Yahweh with shouting[a], with the sound of a horn, with trumpets, and with cymbals[b], making music with harps and lyres.
translation:
  language: zh_hans
  text: 全以色列都把耶和华的约柜抬上去，伴着欢呼[a]、号角声[b]、喇叭和钹的声音，又用竖琴和里拉琴奏乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“呼喊”；原词可指庆祝或喝彩时发出的高声呼喊。
    reason: lexical_alternative
  - marker: b
    text: 原文为“shofar”，通常指号角，与随后提到的“喇叭”不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: 都把……抬上来
  rationale: 使役分词复数描写进行中的队列行动；约柜由人抬运，而עלה也保留“上到”耶路撒冷的方向感。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 耶和华的约柜
  rationale: 中文圣经传统中“约柜”已自然表达“约之柜”的专名含义，并以所有关系连接神名。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉的神名音译，明确呈现专名而不以“主”这一称号替代。
- source_word: תְרוּעָה
  choice: 欢呼
  rationale: 指高声呼喊或喝彩；结合庆典迎运约柜的语境，“欢呼”自然，但脚注保留较宽泛的“呼喊”可能。
- source_word: קוֹל שׁוֹפָר
  choice: 吹响号角
  rationale: קוֹל明确涉及声音；用动词化表达形成自然中文，并将שׁוֹפָר与随后直管式的חֲצֹצְרוֹת区分。
- source_word: חֲצֹצְרוֹת
  choice: 喇叭
  rationale: 指礼仪中使用的金属管号；不补入原文未明说的“银”。
- source_word: מְצִלְתַּיִם
  choice: 钹
  rationale: 该打击乐器的标准现代中文名称。
- source_word: מַשְׁמִעִים
  choice: 使乐声响起
  rationale: 使役分词直指“使之被听见、发出声响”；此译法保留听觉重点，并自然统摄后面的弦乐器。
- source_word: נְבָלִים וְכִנֹּרוֹת
  choice: 琴瑟
  rationale: 两词都是古代弦乐器，现代乐器无法精确对应；“琴瑟”简洁、庄重，并保留两类乐器并列的感觉。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。中文采用广为人知的专名“耶和华”，既不把它改成称号，也避免正文中使用读者较不熟悉的学术重构形式。
- issue: אֲרוֹן בְּרִית יְהוָה 的关系
  choice: 耶和华的约柜
  alternative: 耶和华之约的柜
  rationale: 希伯来语组合可形式化展开为“耶和华之约的柜”，但“约柜”在中文中已固定表达其立约身份；当前译法不削弱其神学特指。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以分号组织庆典队列与乐声的连续动作；正文中的“琴瑟”属于读者熟悉的概括性古乐器用语，不主张与两种希伯来乐器逐一精确对应。
