  yaml_path: translation/ot/1_chronicles/015/011.yaml
  text: 'Then David called for Zadok and Abiathar the priests, and for the Levites: Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab.'
translation:
  language: zh_hans
  text: 于是，大卫召来祭司撒督和亚比亚他，又召来利未人乌列、亚帅雅、约珥、示玛雅、以利业和亚米拿达。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召来
  rationale: 此处 קרא 的连续叙事形式表示大卫召集指定的人到他面前；“召来”在现代汉语中自然、简洁，也保留了召唤其前来的含义。
- source_word: לְצָדוֹק וּלְאֶבְיָתָר הַכֹּהֲנִים
  choice: 祭司撒督和亚比亚他
  rationale: 希伯来语定冠词表明“祭司”具体说明撒督和亚比亚他的身份。汉语把身份称谓置于人名前更自然，并不需要另行表达定冠词。
- source_word: וְלַלְוִיִּם
  choice: 又召来利未人
  rationale: 原文重复介词 ל，与前面的受召者构成平行；汉语重复“召来”可清楚体现同一动作支配另一组对象，同时避免生硬照搬介词结构。
- source_word: לְאוּרִיאֵל עֲשָׂיָה וְיוֹאֵל שְׁמַעְיָה וֶאֱלִיאֵל וְעַמִּינָדָב
  choice: 乌列、亚帅、约珥、示玛雅、以利业和亚米拿达
  rationale: 六个专名按中文圣经传统中通行且易辨认的形式音译；它们与前面的“利未人”构成同位关系。
- source_word: דָוִיד
  choice: 大卫
  rationale: 采用现代中文中通行的圣经人名译法。
theological_decisions: []
translation_notes:
