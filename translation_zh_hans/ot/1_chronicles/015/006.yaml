  language: zh_hans
  text: 米拉利的子孙：首领亚撒雅和他的二百二十名弟兄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“同族的人”；希伯来语这个词可广指同一家族或宗族中的男性成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: 米拉利的子孙中
  rationale: לְ在名单中引出下一支族；“……的子孙中”符合现代汉语列举方式，也保留בְּנֵי作为宗族称谓的含义。
- source_word: עֲשָׂיָה
  choice: 亚撒雅
  rationale: 按中文圣经人名的通行音译处理该专名。
- source_word: הַשָּׂר
  choice: 首领
  rationale: שַׂר在此指该宗族中居领导地位的人；“首领”自然准确，又不引入“王子”等王室含义。
- source_word: וְאֶחָיו
  choice: 和他的弟兄
  rationale: אָח的复数带第三人称单数所属后缀，直译为“他的弟兄”；在本宗族名单的语境中也可能泛指同族男性，故以脚注保留这一语义范围。
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: 二百二十人
  rationale: 准确表达希伯来文基数词，并补出汉语计人数所需的量词“人”。
