base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/009.yaml
  text: Then the people rejoiced because they had offered willingly[a], for with a whole heart they had offered willingly to Yahweh[b]; and David the king also rejoiced with great joy.
translation:
  language: zh_hans
  text: 众民因他们甘心奉献而欢喜[a]，因为他们全心全意地向耶和华甘心奉献[b]；大卫王也大大欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因他们的甘心献礼而欢喜。”希伯来语词根强调自愿、乐意地献上。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“以完整的心”，表达内心专一、真诚或正直。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ הָעָם
  choice: 众民……欢喜
  rationale: 以自然的汉语叙事表达连续动作；“众民”对应在场的会众整体。
- source_word: עַל הִתְנַדְּבָם
  choice: 因自己甘心奉献
  rationale: עַל在此表达欢喜的原因；נדב的Hitpael词形强调出于自愿，结合上下文具体指为圣殿工程献上财物。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出众民欢喜的解释性根据。
- source_word: בְּלֵב שָׁלֵם
  choice: 以完全的心
  rationale: 保留希伯来语具体的“心”意象及“完整、无二”的含义，不简化为单纯的程度副词。
- source_word: הִתְנַדְּבוּ
  choice: 甘心奉献
  rationale: 与本节前一次同根动词保持一致，体现自愿献上的重复强调。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 直接音译四字神名的传统汉语形式，并用“给”表达奉献的对象。
- source_word: וְגַם דָּוִיד הַמֶּלֶךְ
  choice: 大卫王也
  rationale: 采用自然现代汉语称谓次序，同时保留“也”的附加强调。
- source_word: שָׂמַח שִׂמְחָה גְדוֹלָה
  choice: 大大欢喜
  rationale: 以汉语叠加强调表达希伯来语同根宾语结构及“大喜乐”的强度，避免生硬直译。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用现代中文圣经读者最熟悉的专名“耶和华”，而不以“主”替代，从而保留其作为立约之神名字的性质。
- issue: בְּלֵב שָׁלֵם的属灵含义
  choice: 以完全的心
  alternative: 一心一意地／诚心诚意地
  rationale: 保留原文可同时涵盖完整、专一、真诚的语义张力，不把它限定为某一种内在品格解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“甘心奉献”重复两次，以保留原文同一词根的反复；“完全的心”刻意保留希伯来语意象，并借脚注说明其语义范围。
