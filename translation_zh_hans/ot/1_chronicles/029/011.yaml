id: 1CH.29.11
reference: 1 Chronicles 29:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְ/ךָ֣ יְ֠הוָה הַ/גְּדֻלָּ֨ה וְ/הַ/גְּבוּרָ֤ה וְ/הַ/תִּפְאֶ֨רֶת֙ וְ/הַ/נֵּ֣צַח וְ/הַ/ה֔וֹד כִּי כֹ֖ל בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֑רֶץ לְ/ךָ֤ יְהוָה֙ הַ/מַּמְלָכָ֔ה וְ/הַ/מִּתְנַשֵּׂ֖א לְ/כֹ֥ל לְ/רֹֽאשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/011.yaml
  text: Yours[a], O Yahweh, are the greatness and the power and the splendor and the victory and the majesty, for everything in the heavens and on the earth is yours. Yours, O Yahweh, is the kingdom, and you are exalted as head over all.
translation:
  language: zh_hans
  text: 耶和华啊，伟大、能力、荣美、胜利[a]和威严都属于你，因为天上地上的一切都是你的。耶和华啊，国度属于你；你高居万有之首。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胜利”也可译作“恒久”或“卓越（至高）”；此处希伯来词 נֵצַח 可指胜利，也可能含有持久性或至高卓越的意思。
    reason: 保留该词在此颂赞语列中的词义歧义，避免正文以“永胜”合并并固定其不同可能含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，而不以称号替代。
- source_word: לְךָ
  choice: 都属于你／属于你
  rationale: 表达归属关系，并保留原文句首及后半节重复所形成的强调。
- source_word: הַגְּדֻלָּה
  choice: 伟大
  rationale: 直接表达抽象名词“伟大”，与整组颂赞用语协调。
- source_word: הַגְּבוּרָה
  choice: 能力
  rationale: 表示大能、力量；“能力”自然庄重，也适合此处对上帝王权属性的颂赞。
- source_word: הַתִּפְאֶרֶת
  choice: 荣美
  rationale: 兼顾该词所含的荣耀、美丽与华美之意，又避免与后面的威严混同。
- source_word: הַנֵּצַח
  choice: 永胜
  rationale: 该词在此颂赞语列中的含义有争议；“永胜”保留胜利之义，同时体现持久、卓越的意味。其他可能含义收入脚注。
- source_word: הַהוֹד
  choice: 威严
  rationale: 表达尊荣、庄严和王者气象，与“荣美”有所区分。
- source_word: כִּי כֹל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: 因为天上地上的一切都是你的
  rationale: 将כִּי理解为因果连词，将כֹל作涵盖万物的“一切”，用自然中文说明前述颂赞的根据。
- source_word: הַמַּמְלָכָה
  choice: 国度
  rationale: 保留王国、王权和统治范围的意象；“国度”是庄重而通行的现代中文表达。
- source_word: וְהַמִּתְנַשֵּׂא
  choice: 你被尊为
  rationale: 该分词可表达被高举、居于崇高地位；结合后接的“为万有之首”，译成自然的中文谓语。
- source_word: לְכֹל לְרֹאשׁ
  choice: 万有之首
  rationale: 保留“头、首领”的比喻，表达对一切的至高地位。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，正文以中文圣经传统中最为人熟知的专名“耶和华”呈现，不用“主”遮代神名。
- issue: נֵצַח在颂赞语列中的含义
  choice: 永胜
  alternative: 永恒／尊荣／卓越
  rationale: 此词既可涉及胜利，也可能指持久性或卓越地位。“永胜”在上下文中兼顾凯旋与恒久的色彩，而脚注保留其真实的词义歧义。
- issue: וְהַמִּתְנַשֵּׂא לְכֹל לְרֹאשׁ的句法
  choice: 你被尊为万有之首
  alternative: 你超越万有，作万有之首
  rationale: 原文分词与介词结构可侧重被高举或自身居高；正文用“被尊为”表达崇高首领地位，同时不增添原文没有明说的施动者。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞体中文。前后两次“属于你”保留原文的强调与节奏；并列名词简洁排列，不额外加入解释性神学术语。
