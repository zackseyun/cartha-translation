  text: וְ/הַ/נִּמְצָ֤א אִתּ/וֹ֙ אֲבָנִ֔ים נָתְנ֖וּ לְ/אוֹצַ֣ר בֵּית יְהוָ֑ה עַ֥ל יַד יְחִיאֵ֖ל הַ/גֵּרְשֻׁנִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/008.yaml
  text: Whoever had precious stones gave them to the treasury of the house of Yahweh, into the care of Jehiel the Gershonite.
translation:
  language: zh_hans
  text: 凡有宝石的，都把宝石交到雅威殿的库房，交由革顺人耶歇看管[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“借着革顺人耶歇的手”；此处指由他经手保管或管理。
    reason: 说明希伯来语习语עַל יַד的字面形式及此处功能。
lexical_decisions:
- source_word: וְהַנִּמְצָא אִתּוֹ
  choice: 凡有……的
  rationale: 希伯来语直译近于“凡在他那里找到……的”；此处指各人所拥有之物，用现代汉语作分配性表达“凡有……的”最自然。
- source_word: אֲבָנִים
  choice: 宝石
  rationale: 该词本义为“石头”，但在为圣殿献上贵重材料的上下文中指有价值的石材或宝石；“宝石”简洁传达语境所指，同时不限定具体种类。
- source_word: נָתְנוּ
  choice: 交到
  rationale: נתן的基本义是“给、交出”；结合库房这一目标地点，译作“交到”既保留奉献行为，也符合现代汉语搭配。
- source_word: לְאוֹצַר בֵּית יְהוָה
  choice: 交到雅威殿的库房
  rationale: אוֹצָר在此是存放贵重奉献物的库房；בֵּית יְהוָה直译“雅威的殿/家”，中文以“雅威殿”自然清楚地指圣殿。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名YHWH作音译，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: עַל יַד
  choice: 交由……看管
  rationale: 该短语字面为“在……手下/手中”，此处表达受托管理或监管，译作“交由……看管”符合上下文。
- source_word: יְחִיאֵל הַגֵּרְשֻׁנִּי
  choice: 革顺人耶歇
  rationale: 采用通行中文圣经人名形式；הַגֵּרְשֻׁנִּי说明耶歇属于革顺宗族。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，不将其改为称号，也不采用较晚形成的混合读音。
- issue: אֲבָנִים是否明确为宝石
  choice: 宝石
  alternative: 石头；贵重石料
  rationale: 原词单独看仅意为“石头”，但本章列举为圣殿奉献的贵重材料，且这些石头被收入库房，因此正文按语境译作“宝石”；不进一步指定宝石种类。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡有……的，都……”重现原文的分配性结构；“雅威殿的库房”既保留“雅威之殿”的概念，又避免生硬直译。脚注标记置于“看管”之后，对应其所解释的监管习语。
