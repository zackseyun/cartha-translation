source:
  edition: WLC
  text: וַ/יְבָ֤רֶךְ דָּוִיד֙ אֶת יְהוָ֔ה לְ/עֵינֵ֖י כָּל הַ/קָּהָ֑ל וַ/יֹּ֣אמֶר דָּוִ֗יד בָּר֨וּךְ אַתָּ֤ה יְהוָה֙ אֱלֹהֵי֙ יִשְׂרָאֵ֣ל אָבִ֔י/נוּ מֵ/עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/010.yaml
  text: Then David blessed Yahweh in the sight of all the assembly[a], and David said, “Blessed are you, Yahweh, the God of Israel our father, from everlasting to everlasting.”
translation:
  language: zh_hans
  text: 大卫就在全会众眼前称颂雅威。大卫说：“雅威，以色列——我们祖先——的上帝[a]啊，从亘古直到永远，你是当受称颂的！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威，以色列的上帝、我们的父啊。”此译法把“我们的父”理解为对上帝的直接称呼，而不是指以色列（雅各）是我们的祖先。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: 称颂
  rationale: ברך 的皮勒式以神为宾语时，表示向神献上祝颂和赞美。“称颂”符合现代汉语的敬拜语体，也与后面的 בָּרוּךְ 保持词义呼应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为专名的性质，而不以“主”这一称号代替。
- source_word: לְעֵינֵי
  choice: 在……眼前
  rationale: 保留希伯来语“在……眼中／眼前”的公开、可见意味，同时在汉语中自然通顺。
- source_word: כָּל הַקָּהָל
  choice: 全会众
  rationale: קָהָל 指聚集起来的共同体；“全会众”简明、庄重，并符合公开集会的场景。
- source_word: בָּרוּךְ אַתָּה
  choice: 你是当受称颂的
  rationale: 自然表达希伯来语的述谓式祝颂公式，保留直接称呼和颂赞力量，也与前面的“称颂”形成呼应。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列……的上帝
  rationale: 按希伯来语属格结构译出；破折号标明“我们祖先”与“以色列”的同位关系。
- source_word: אָבִינוּ
  choice: 我们祖先
  rationale: 正文依较自然的句法，将其视为对“以色列”（即雅各）的同位说明。“祖先”在现代汉语中比“我们的父”更清楚地表达民族先祖之义，同时脚注保留另一种句法理解。
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: 从亘古直到永远
  rationale: 表达无始无终的延续，既准确又保有颂赞文体的庄重感。
theological_decisions:
- issue: “我们祖先／我们的父”（אָבִינוּ）的所指
  choice: 理解为“以色列”的同位语，即以色列（雅各）是“我们的祖先”
  alternative: 理解为对上帝的直接称呼：“以色列的上帝、我们的父”
  rationale: 希伯来语可将 אָבִינוּ 与“以色列”连读，正文据此译出；但标点并非原文固有，另一种将其直接用于称呼上帝的理解在句法上仍有可能，故以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语体。“雅威”保留神名；“称颂／当受称颂”再现原文 ברך 与 בָּרוּךְ 的词义呼应。以破折号清楚呈现正文所取的同位关系，并用脚注保存原文真实的句法与神学歧义。
