base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/021.yaml
  text: 'They sacrificed sacrifices to Yahweh and offered up burnt offerings to Yahweh on the next day after that day: one thousand bulls[a], one thousand rams, one thousand lambs, and their drink offerings[c][b], and sacrifices in abundance for all Israel.'
translation:
  language: zh_hans
  text: 第二天，他们向雅威献上祭牲，又向雅威献上燔祭：一千头公牛、一千只公羊、一千只羊羔，以及相应的奠祭；他们还为全以色列献了许多祭牲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים
  choice: 献上祭牲
  rationale: 动词与同根名词构成强调性的祭祀表达。汉语若直译为“宰献祭牲”略显生硬；“献上祭牲”自然庄重，也保留其与后文“燔祭”的区别。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词表示祭物奉献的对象；按项目原则将四字神名 יהוה 音译为“雅威”。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 这是整只焚烧献上的祭，采用现代中文圣经语境中准确而简洁的固定术语。
- source_word: לְמָחֳרַת הַיּוֹם הַהוּא
  choice: 第二天
  rationale: 希伯来语直意为“那日的次日”。中文“第二天”准确表达时间承接，避免不自然的重复。
- source_word: פָּרִים אֶלֶף
  choice: 公牛一千头
  rationale: פָּרִים 指适合献祭的雄性牛；量词“头”符合现代汉语习惯。
- source_word: אֵילִים אֶלֶף
  choice: 公绵羊一千只
  rationale: אֵילִים 特指成年雄羊；译作“公绵羊”比泛称“羊”更准确，也可避免与后面的羊羔混淆。
- source_word: כְּבָשִׂים אֶלֶף
  choice: 羊羔一千只
  rationale: כְּבָשִׂים 在献祭语境中通常指幼羊，“羊羔”自然准确。
- source_word: וְנִסְכֵּיהֶם
  choice: 并献上相配的奠祭
  rationale: נְסָכִים 是随动物祭物浇献的液体祭。“奠祭”为准确的祭祀术语；代词后缀表示这些奠祭与前述燔祭相配。
- source_word: וּזְבָחִים לָרֹב
  choice: 还……献了许多祭牲
  rationale: לָרֹב 表示数量众多。另起分句可清楚表明这是列举的燔祭之外的大量祭牲。
- source_word: לְכָל יִשְׂרָאֵל
  choice: 为全以色列
  rationale: 保留介词 ל 的宽泛受益或关联意义，不把它强化为特定的代赎解释。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，并符合项目给定原则。
- issue: לְכָל יִשְׂרָאֵל 是否应明确译为代表性献祭
  choice: 为全以色列
  alternative: 代表全以色列；替全以色列
  rationale: 介词 ל 可表达目的、受益者或关联范围。“为”保留原文弹性，不额外引入更强的代赎或代表性含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“祭牲”与“燔祭”分别对应 זְבָחִים 和 עֹלוֹת，以保留祭物类别的区分；用分号划分列举与补充献祭，使长句清晰。
