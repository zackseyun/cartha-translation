  text: וַ/יֵּ֣שֶׁב שְׁ֠לֹמֹה עַל כִּסֵּ֨א יְהוָ֧ה לְ/מֶ֛לֶךְ תַּֽחַת דָּוִ֥יד אָבִ֖י/ו וַ/יַּצְלַ֑ח וַ/יִּשְׁמְע֥וּ אֵלָ֖י/ו כָּל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/023.yaml
  text: Then Solomon sat on the throne of Yahweh as king in place of David his father[a], and he prospered, and all Israel listened to him.
translation:
  language: zh_hans
  text: 所罗门接替父亲大卫，坐在雅威的宝座上作王；他亨通，以色列众人都听从他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“听他的话”或“服从他”。希伯来语可指留心听取；在臣民面对君王的语境中，也含有顺服之意。
    reason: 词义存在语境性幅度，正文采用“听从”以兼顾听取与服从。
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 坐在
  rationale: 保留“坐”的具体意象；与“宝座”连用时，自然表达登位掌权。
- source_word: כִּסֵּא יְהוָה
  choice: 雅威的宝座
  rationale: 按原文保留所属结构，不将其弱化为普通王位；这表明大卫王朝的王权是在雅威的统治之下施行的。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名四字母的常见现代汉语音译，保留其专名性质，不以称号代替。
- source_word: לְמֶלֶךְ
  choice: 作王
  rationale: 这里的介词标明身份或职分；“作王”是自然、简洁的汉语表达。
- source_word: תַּחַת דָּוִיד אָבִיו
  choice: 接替父亲大卫
  rationale: תַּחַת 在王位承继语境中表示取代、接任，而不只是时间上的“在……之后”。
- source_word: וַיַּצְלַח
  choice: 亨通顺利
  rationale: 表达 צלח 所指的成功、进展顺遂；不额外明说原因，以免加入原文未明言的解释。
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: 听从他
  rationale: שׁמע אל 可指听取，也可在权威语境中指顺服。“听从”兼顾听与服从两层含义，适合臣民对君王的语境。
- source_word: כָּל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 自然表达作为整体的以色列民，避免让现代读者误解为地理范围。
theological_decisions:
- issue: “雅威的宝座”与所罗门王权的关系
  choice: 直译为“雅威的宝座”，保留所罗门坐在其上作王的表述
  alternative: 意译为“雅威所赐的王位”或仅称“以色列的王位”
  rationale: 历代志作者有意把大卫王朝的王权置于雅威的统治之下，并视君王为代表性执政者。译文保留这一神学张力，但不进一步界定其制度或教义含义。
- issue: 以色列对所罗门的回应
  choice: 译为“听从他”
  alternative: 译为“听他的话”或“服从他”
  rationale: 原文兼有听取与顺服的语义可能。“听从”保留两者，不把含义收窄为单纯听见或绝对服从。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亨通顺利”略带经文语体但仍属现代通用表达；句子分为两句，避免机械复制希伯来语连续连接结构。
