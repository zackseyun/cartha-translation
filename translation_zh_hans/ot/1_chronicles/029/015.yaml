base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/015.yaml
  text: For we are sojourners before you[a], and temporary residents, as all our fathers were. Our days on the earth are like a shadow[c][b], and there is no hope.
translation:
  language: zh_hans
  text: 我们在你面前是寄居者[a]，是暂居者[b]，和我们所有的祖先一样。我们在地上的日子如影子一般，毫无指望[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”也可译作“异乡人”或“外来人”。
    reason: lexical_alternative
  - marker: b
    text: “暂居者”也可译作“寄居的居民”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“毫无指望”是就人在地上的日子短暂无常而言，并非否认对上帝的盼望。
    reason: cross_reference
lexical_decisions:
- source_word: גֵרִים
  choice: 寄居者
  rationale: 该词指居住在异地、没有本地人永久身份的人；“寄居者”既保留其社会身份含义，也适合祷告语境。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 贴近“在你面前”的字面意象，自然表达人在上帝面前的处境。
- source_word: תוֹשָׁבִים
  choice: 暂住的人
  rationale: 该词指住在某地却不具永久或本土身份的人；此译法与“寄居者”平行，并突出人生的暂时性。
- source_word: כְּכָל אֲבֹתֵינוּ
  choice: 和我们所有的祖先一样
  rationale: “祖先”在现代汉语中自然涵盖以色列历代先辈，又准确表达本代人与前代相同的处境。
- source_word: כַּצֵּל
  choice: 如影子一般
  rationale: 保留希伯来文以影子喻人生短暂、易逝的意象。
- source_word: יָמֵינוּ עַל הָאָרֶץ
  choice: 我们在地上的日子
  rationale: 忠实表达时间与空间关系，现代汉语清楚自然。
- source_word: וְאֵין מִקְוֶה
  choice: 毫无指望
  rationale: מִקְוֶה可指希望或期待；“毫无指望”保留原文强烈而未加限定的措辞，让上下文说明其与人生易逝有关。
theological_decisions:
- issue: וְאֵין מִקְוֶה在死亡与人生短暂语境中的含义
  choice: 译为“毫无指望”，并用脚注说明其语境
  alternative: 没有期待；没有长存的盼望
  rationale: 正文保留原文的神学张力，不在翻译中擅自加入“属世的”或“长存的”等限定；脚注只提示本节重点是地上人生易逝，并不把这句话扩展为对上帝之盼望的全面否定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“寄居者／暂住的人”保留原文近义平行；“如影子一般”保留诗性意象；结句不在正文中加入解释性限定，以保存原文力度与神学张力。
