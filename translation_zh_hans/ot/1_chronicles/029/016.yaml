base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/016.yaml
  text: O Yahweh our God[a], all this abundance that we have prepared to build you a house for your holy name is from your hand[c][b], and all things are yours.
translation:
  language: zh_hans
  text: 耶和华我们的上帝啊，我们为你建造一座归于你圣名的殿宇而预备的这一大批物资[a]，都是从你手里来的[b]；这一切全都属于你[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一大批物资”也可译作“这一切财富”或“这一切积存”；原文所用的词强调数量众多，在这里指为建殿聚集的材料和财物。
    reason: lexical_alternative
  - marker: b
    text: 直译：“它是从你手中来的。”
    reason: literal_rendering
  - marker: c
    text: “这一切全都属于你”也可译作“万有都属于你”或“一切都是你的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: 耶和华我们的上帝啊
  rationale: 以现代汉语中通行的专名“耶和华”对应四字神名，并用呼语助词“啊”自然表达祷告中的直接称呼；אֱלֹהֵינוּ 在此指独一的“我们的上帝”。
- source_word: כֹל הֶהָמוֹן הַזֶּה
  choice: 这一大批物资
  rationale: הָמוֹן 可指众多、丰富或财富；本节语境是为建殿积聚的材料和财物，因此译作“一大批物资”，既说明所指，又保留数量庞大的含义。
- source_word: אֲשֶׁר הֲכִינֹנוּ
  choice: 我们……预备的
  rationale: הכין 表示预备、备妥；汉语定语结构能自然连接其先行词“一大批物资”。
- source_word: לִבְנוֹת לְךָ בַיִת לְשֵׁם קָדְשֶׁךָ
  choice: 为给你的圣名建造殿宇
  rationale: בַּיִת 字面为“房屋”，此处明确指为上帝建造的圣殿；“殿宇”在汉语中自然庄重。“给你的圣名”保留建造与上帝之名之间的奉献关系，而不将其改写成仅供人使用的建筑。
- source_word: מִיָּדְךָ הִיא
  choice: 都是从你手里来的
  rationale: 保留“手”的源文意象，同时用“从……来的”表达来源；“都”与集合性的物资相呼应。
- source_word: וּלְךָ הַכֹּל
  choice: 这一切全都属于你
  rationale: 清楚表达 לְךָ 的归属含义；“这一切”也可承接当前所说的全部物资，同时不排除更广的“一切”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经语境中最广为人知且可辨识的专名形式，直接作为神名呈现，不以“主”替代；“雅威”则是另一种较贴近学界重构读音的音译。
- issue: וּלְךָ הַכֹּל 的范围
  choice: 这一切全都属于你
  alternative: 万有都属于你
  rationale: הַכֹּל 可指前文提到的一切，也可作更普遍的“万有”。译文以“这一切”保持与建殿物资的直接衔接，同时用脚注保留较宽泛的理解。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。句首用“啊”标明呼语；“殿宇”比单纯的“房屋”更符合上下文，却仍保留 בַּיִת 的建筑意象。全句避免古奥文言，并借脚注交代 הָמוֹן 与 הַכֹּל 的词义及范围弹性。
