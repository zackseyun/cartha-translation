  rationale: 仅调整末句的汉语句法，以明确“在你手中”修饰神使一切尊大、强盛的能力，且保留原文两次“在你手中”的意象和“一切”的开放范围。脚注b保留为对“尊荣”的词汇备选说明；其锚点置于“尊荣”之后。
