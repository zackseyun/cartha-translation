base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/012.yaml
  text: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
translation:
  language: zh_hans
  text: 财富和尊荣都从你面前而来[a]；你统管万有。能力和威力都在你手中；你手中有使一切尊大、强盛的能力[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都从你而来”或“都从你的临在而来”；希伯来语直译为“都从你面前而来”。
    reason: lexical_alternative
  - marker: c
    text: “使……尊大”也可译为“高举”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹשֶׁר
  choice: 财富
  rationale: 该词指物质上的丰裕；“财富”是现代汉语中自然、庄重且范围合宜的表达。
- source_word: הַכָּבוֹד
  choice: 尊荣
  rationale: 这里与“财富”并列，侧重地位、荣耀和受尊崇的状态；“尊荣”兼顾“尊贵”与“荣耀”的含义。
- source_word: מִלְּפָנֶיךָ
  choice: 从你面前而来
  rationale: 保留希伯来语“从你面前／临在中”的具体意象，同时以“而来”清楚表达来源。
- source_word: מוֹשֵׁל בַּכֹּל
  choice: 你统管万有
  rationale: 分词表示持续的掌权；“统管万有”自然地表达对一切的治理。
- source_word: בְיָדְךָ
  choice: 在你手中
  rationale: 保留原文两次出现的具体隐喻，表达拥有能力和决定权。
- source_word: כֹּחַ וּגְבוּרָה
  choice: 能力和威力
  rationale: 用两个相近但不完全相同的词，保留原文并列词语所表达的力量与大能。
- source_word: לְגַדֵּל
  choice: 使……尊大
  rationale: 该使役形式表示使之成为伟大或提升其地位；“使……尊大”符合祷告语境，也保留“高举”的可能意味。
- source_word: לְחַזֵּק
  choice: 使……强盛
  rationale: 表达使之刚强、有力量；与“尊大”并列时，“强盛”在现代汉语中简洁自然。
- source_word: לַכֹּל
  choice: 一切
  rationale: 原词可泛指所有人或一切事物；译作“一切”保留其概括性，不把所指限缩为人或物。
theological_decisions:
- issue: מִלְּפָנֶיךָ如何表达财富与尊荣的来源
  choice: 从你面前而来
  alternative: 从你而来／从你的临在而来
  rationale: 原文明确使用“面前”这一空间性、临在性的表达；直译其意象，既表明来源于上帝，也不额外规定“临在”的神学含义。
- issue: לַכֹּל所指的是众人还是万物
  choice: 一切
  alternative: 众人／万有
  rationale: 希伯来语本身具有宽泛性；“一切”避免在缺乏限定时将对象收窄为人或事物。
translation_notes:
  register: 采用现代、庄重而易懂的祷告体语言；保留“在你手中”的原文意象及其重复结构，并以“一切”维持末句对象的宽泛性。
