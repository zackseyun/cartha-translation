  naturalness: 整体为庄重、现代的祷告体。“从你面前而来”“统管万有”均自然。末句须改为“你手中有使一切尊大、强盛的能力”，以恢复自然句法和原文的施事关系。
  terminology: “财富”“尊荣”“万有”“能力和威力”适合本节的庄重语域，并分别保留原文并列的财富／尊荣、能力／威力。“尊大”虽较书面，但在此与“高举”的语义可能性相合；用“使一切尊大、强盛”可保留原文对“all”的宽泛指向，避免限缩为人。
