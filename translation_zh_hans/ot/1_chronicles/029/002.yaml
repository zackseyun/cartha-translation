base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/002.yaml
  text: 'And with all my strength I have prepared for the house of my God: the gold for the things of gold[a], and the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and the wood for the things of wood; onyx stones, settings, stones of antimony, variegated stones, every precious stone[d][c][b], and marble stones in abundance.'
translation:
  language: zh_hans
  text: 我竭尽全力，为我上帝的殿预备了金子，供金器之用；银子，供银器之用；铜，供铜器之用；铁，供铁器之用；木材，供木制器物之用；还有缟玛瑙[a]、镶嵌用的材料[b]、锑石[c]、彩纹石[d]、各样宝石，以及大量大理石[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节若干石材的确切种类不能确定。“缟玛瑙”译自שֹׁהַם，“大理石”译自שַׁיִשׁ，均采用常见的传统理解；也有人提出其他鉴定。
    reason: lexical_alternative
  - marker: b
    text: “镶嵌用的材料”（מִלּוּאִים）也可能指镶座、嵌件或填嵌物。
    reason: lexical_alternative
  - marker: c
    text: “锑石”（אַבְנֵי פוּךְ）所指不明，可能是与黑色颜料有关的石料、装饰性嵌料，或另一种装饰材料。
    reason: lexical_alternative
  - marker: d
    text: “彩纹石”按上下文将רִקְמָה理解为有彩色纹理的石料或石制装饰；该词在别处也可指刺绣或彩饰工艺。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכָל־כֹּחִי
  choice: 我已尽我一切力量
  rationale: כֹּחַ可指力量或能力；此处表达大卫竭尽自己的力量与资源。“尽我一切力量”既自然，也保留原文的个人投入感。
- source_word: הֲכִינוֹתִי
  choice: 预备了
  rationale: 完成式表示预备工作已经完成，并与当前讲话相关；现代汉语用“预备了”即可自然表达。
- source_word: לְבֵית אֱלֹהַי
  choice: 为我上帝的殿
  rationale: בַּיִת在此指敬拜用的圣殿建筑。“殿”符合上下文，同时保留“我上帝”所表达的个人敬虔。
- source_word: הַזָּהָב לַזָּהָב ... וְהָעֵצִים לָעֵצִים
  choice: 金子，供金器之用……木材，供木器之用
  rationale: 重复的“材料＋לְ＋同一材料”结构表示各种材料各自指定用于相应制品。译出“供……器之用”可清楚表达含义，并保留排比。
- source_word: הַנְּחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜或青铜。原文并未明确合金成分，汉语“铜”较宽泛，也符合圣殿器物语境。
- source_word: אַבְנֵי שֹׁהַם
  choice: 缟玛瑙
  rationale: שֹׁהַם所指宝石不能确定；“缟玛瑙”是onyx的现代常用名称，但以脚注说明不确定性。
- source_word: וּמִלּוּאִים
  choice: 镶嵌用的材料
  rationale: 该词可能指镶座、嵌件或用于镶嵌的材料。此译避免把具体工艺或物件定得过死，并适合材料清单。
- source_word: אַבְנֵי פוּךְ
  choice: 锑石
  rationale: פּוּךְ通常与锑或黑色眼妆颜料有关，但此处组合的确切所指困难。“锑石”贴近词面，疑义留在脚注中。
- source_word: וְרִקְמָה
  choice: 彩纹石
  rationale: רִקְמָה通常含彩色纹样、刺绣或繁复装饰之意；在石料清单中，“彩纹石”是合乎语境但仍属推定的译法。
- source_word: וְאַבְנֵי שַׁיִשׁ לָרֹב
  choice: 以及大量大理石
  rationale: שַׁיִשׁ传统上常译为大理石，לָרֹב表示数量很多。具体石材鉴定仍不确定，故加脚注。
