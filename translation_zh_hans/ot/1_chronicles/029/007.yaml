base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/007.yaml
  text: And they gave for the service of the house of God five thousand talents of gold and ten thousand darics[a], and ten thousand talents of silver, and eighteen thousand talents of bronze[c][b], and one hundred thousand talents of iron.
translation:
  language: zh_hans
  text: 他们为上帝的殿所作的工献上了五千他连得金子、一万枚达利克金币[a]、一万他连得银子、一万八千他连得铜[b]，以及十万他连得铁[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “达利克”是古代波斯的一种金币。
    reason: cultural_note
  - marker: b
    text: 原文作“一万和八千他连得铜”，即一万八千他连得。
    reason: lexical_alternative
  - marker: c
    text: “他连得”是古代的大型重量单位，并非现代所说的才干。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 他们……献上了
  rationale: 该动词叙述已经完成的奉献行动；结合上下文，用“献上”比普通的“给”更自然，同时不额外限定具体奉献形式。
- source_word: לַעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: 为上帝殿的事工
  rationale: עֲבוֹדָה兼有工作、服事之意；“事工”在此可涵盖圣殿相关的工程与用途。“上帝殿”保留原文“上帝的殿/房屋”的表达，不直接改作更具体的“圣殿”。
- source_word: כִּכָּרִים
  choice: 他连得
  rationale: 此处是古代的大重量单位。采用中文圣经读者较熟悉的音译，并以脚注说明其性质，避免误解为现代意义的才能。
- source_word: אֲדַרְכֹנִים
  choice: 大流克
  rationale: 该波斯借词指波斯金币 daric；采用历史币名的音译，以保留具体性，并用脚注解释。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜或青铜；“铜”可保留材料名称的一定宽度，避免在成分不确定时过度具体化。
- source_word: רִבּוֹ וּשְׁמוֹנַת אֲלָפִים
  choice: 一万八千
  rationale: 原文按“一万和八千”列数，合计一万八千；正文直接表达总数，脚注保留原文形式。
theological_decisions: []
