reference: 1 Chronicles 29:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יָדַ֣עְתִּי אֱלֹהַ֔/י כִּ֤י אַתָּה֙ בֹּחֵ֣ן לֵבָ֔ב וּ/מֵישָׁרִ֖ים תִּרְצֶ֑ה אֲנִ֗י בְּ/יֹ֤שֶׁר לְבָבִ/י֙ הִתְנַדַּ֣בְתִּי כָל אֵ֔לֶּה וְ/עַתָּ֗ה עַמְּ/ךָ֙ הַ/נִּמְצְאוּ פֹ֔ה רָאִ֥יתִי בְ/שִׂמְחָ֖ה לְ/הִֽתְנַדֶּב לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/017.yaml
  text: And I know[a], my God, that you test the heart and take pleasure in uprightness. I, in the uprightness of my heart, have willingly offered all these things[b], and now I have seen your people who are present here willingly offer to you with joy.
translation:
  language: zh_hans
  text: 我的神啊，我知道，你鉴察人心，喜爱正直[a]。我以正直的心甘愿献上这一切；现在，我欢喜地看见你在这里的子民[b]甘愿献给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喜爱”也可译作“悦纳”；“正直”也有“为人正直、行事端正”的意思。
    reason: 保留רצה与מֵישָׁרִים在此处的词义幅度。
  - marker: b
    text: 希伯来文直译为“在这里被找到的子民”，意思是“在这里的”或“在场的子民”。
    reason: 说明נמצא的字面形式及其在本句中的惯用意义。
lexical_decisions:
- source_word: בֹּחֵן לֵבָב
  choice: 鉴察人心
  rationale: בֹּחֵן表示察验、检验；“鉴察”既保留审察意味，也符合现代庄重汉语。לֵבָב虽为单数，但在此泛指人的内心、意念和意志，译作“人心”自然清楚。
- source_word: וּמֵישָׁרִים תִּרְצֶה
  choice: 喜爱正直
  rationale: מֵישָׁרִים指正直、端正；רצה在此表示喜悦、悦纳。“喜爱正直”保留上帝对正直的积极态度，又不把含义限定为仅仅认可行为。
- source_word: בְּיֹשֶׁר לְבָבִי
  choice: 以正直的心
  rationale: 该短语说明大卫献礼时内心的品格和态度。“以正直的心”贴近希伯来语结构，同时比“在我心的正直中”更符合现代汉语。
- source_word: הִתְנַדַּבְתִּי
  choice: 甘愿献上
  rationale: נדב的Hitpael词形表达自愿、乐意奉献；结合献礼语境，“甘愿献上”兼顾自愿性和奉献对象。
- source_word: כָל אֵלֶּה
  choice: 这一切
  rationale: 指前文所列的各样礼物。“这一切”自然简洁，并未加入原文没有的具体项目。
- source_word: עַמְּךָ הַנִּמְצְאוּ פֹה
  choice: 你在这里的子民
  rationale: נמצא的Nifal形式字面为“被找到”，此处惯用义是“在场”。译文用“在这里”清楚表达其语境意义，脚注保留字面形式。
- source_word: רָאִיתִי בְשִׂמְחָה
  choice: 我也欢喜地看见
  rationale: בְשִׂמְחָה最自然地修饰大卫的观看，表示他看见百姓奉献时的喜悦；“欢喜地看见”保留这一句法关系。
- source_word: לְהִתְנַדֶּב לָךְ
  choice: 甘愿献给你
  rationale: 再次以“甘愿”对应נדב，保持同节用词一致；“献给你”符合向上帝奉献的语境。
- source_word: אֱלֹהַי
  choice: 我的神啊
  rationale: 这是带第一人称所有格的直接称呼；加语气词“啊”自然体现中文呼语。
theological_decisions:
- issue: לֵבָב所表达的人论含义
  choice: 保留“心”的意象，并在鉴察对象处译作“人心”
  alternative: 译作“思想”“内在的人”或“心思意念”
  rationale: 希伯来语的“心”涵盖思想、动机和意志。保留“心”可避免把含义缩减为单纯情感或理智，并延续本节“正直的心”的关键词联系。
- issue: תִּרְצֶה所表达的上帝态度
  choice: 喜爱正直
  alternative: 悦纳正直；认可正直之事
  rationale: 该动词既可表达喜悦，也可表达悦纳。正文选用自然而宽广的“喜爱”，脚注说明“悦纳”这一可能语气，避免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“鉴察”“正直”“甘愿献上”保留经文的礼仪与道德语感；句式按中文习惯调整，同时保持“大卫自愿奉献—百姓自愿奉献”的平行结构。
