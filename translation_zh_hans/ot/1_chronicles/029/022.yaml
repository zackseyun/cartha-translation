  text: וַ/יֹּאכְל֨וּ וַ/יִּשְׁתּ֜וּ לִ/פְנֵ֧י יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וַ/יַּמְלִ֤יכוּ שֵׁנִית֙ לִ/שְׁלֹמֹ֣ה בֶן דָּוִ֔יד וַ/יִּמְשְׁח֧וּ לַ/יהוָ֛ה לְ/נָגִ֥יד וּ/לְ/צָד֖וֹק לְ/כֹהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/022.yaml
  text: And they ate and drank before Yahweh on that day with great joy[a], and they made Solomon son of David king a second time, and they anointed him for Yahweh as ruler[d][c][b], and Zadok as priest.
translation:
  language: zh_hans
  text: 那一天，他们在耶和华面前吃喝，十分欢喜。随后，他们第二次立大卫的儿子所罗门为王，又膏立他为耶和华作领袖[a]，也膏立撒督作祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领袖”所译的希伯来语也可译作“统领”或“君王”。“为耶和华”也可理解为“在耶和华面前”；原文可能表示为耶和华而作的任命，或在他面前施行的膏立。
    reason: 保留 נָגִיד 的词义范围，并保留 לַיהוָה 与受膏行动关系的歧义。
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 直译为“在耶和华面前”，既可表示处于他的临在之中，也符合敬拜筵席的语境，不将含义缩窄为地点。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式“耶和华”，保留原文专名而不以称号替代。
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: 十分欢喜
  rationale: 自然表达方式或状态，保留“极大的喜乐”的强度，适合现代中文叙事。
- source_word: וַיַּמְלִיכוּ
  choice: 立……为王
  rationale: 该使役形表示使某人作王；“立……为王”准确而不额外加入加冕礼仪。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 明确保留原文所指的重复次数，比“再次”更具体。
- source_word: וַיִּמְשְׁחוּ
  choice: 膏立
  rationale: 在君王和祭司就职语境中，“膏立”准确传达礼仪性受膏及任职含义。
- source_word: לַיהוָה
  choice: 归于耶和华
  rationale: 介词 ל 可表达归属、奉献或与耶和华相关；“归于耶和华”保留这种关系性和奉献意味，而不限定为仅在他面前举行。
- source_word: לְנָגִיד
  choice: 作领袖
  rationale: נָגִיד 指受委任、居于众人之上的领导者；“领袖”清楚自然，并避免“王子”在中文中造成血统爵位的误解。
- source_word: לְכֹהֵן
  choice: 作祭司
  rationale: 直接表达撒督被膏立进入祭司职分，并与前句的任职结构平行。
- source_word: בֶן דָּוִיד
  choice: 大卫的儿子
  rationale: 保留原文的父子及王朝身份说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为读者熟悉的专名“耶和华”，既区别于“主”这一称号，也保持庄重与可读性。
- issue: 膏立句中 לַיהוָה 的含义
  choice: 膏立他归于耶和华
  alternative: 在耶和华面前膏立他
  rationale: 希伯来语可指归属或奉献给耶和华，也可能指在耶和华面前施行。正文保留归属、委任的关系性含义，脚注列出临在性的另一理解，不强行消除歧义。
- issue: 末句是否省略重复的“膏立”
  choice: 也膏立撒督作祭司
  alternative: 并立撒督作祭司
  rationale: 原文同一复数动词同时支配所罗门和撒督。中文补出“膏立”可避免误读，并清楚保留两人都接受膏立的语义。
translation_notes:
  register: 采用庄重、自然的现代标准普通话。叙事次序清楚，以“随后”“又”“也”呈现连续动作；避免过度古雅的“甚是欢喜”等措辞。神名用“耶和华”，职分术语用普通读者易懂的“王、领袖、祭司”。
