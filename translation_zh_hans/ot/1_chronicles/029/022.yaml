revisions:
- from: 那一天，他们在耶和华面前吃喝，十分欢喜。随后，他们第二次立大卫的儿子所罗门为王，又膏立他归于耶和华，作领袖[a]；也膏立撒督作祭司。[b]
  to: 那一天，他们在耶和华面前吃喝，十分欢喜。随后，他们第二次立大卫的儿子所罗门为王，又膏立他为耶和华作领袖[a]，也膏立撒督作祭司。
  rationale: 将“归于耶和华”调整为“为耶和华作领袖”，使中文搭配更自然，并更准确地将介词短语关联于所罗门受膏担任职分这一行动。脚注相应改为说明原文允许的两种主要理解，且删除不够确切的“君王般的领袖”。原脚注b仅说明中文重复动词的译法，并非原文歧义或必要注释，删去后不影响经文意义。
