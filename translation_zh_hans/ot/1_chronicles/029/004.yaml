  text: three thousand talents of gold[a], from the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings[b],
translation:
  language: zh_hans
  text: 三千他连得[a]出自俄斐的黄金[b]，和七千他连得精炼的银子，用来包覆建筑物的墙壁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他连得”是古代的重量单位，并不是指才干或能力；其实际重量在不同时期可能有所差异。
    reason: cultural_note
  - marker: b
    text: 或译“俄斐金”。原文既可强调黄金来自俄斐，也可将“俄斐”理解为对这种黄金的限定。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשֶׁת אֲלָפִים / וְשִׁבְעַת אֲלָפִים
  choice: 三千 / 还有七千
  rationale: 忠实表达两个基数词结构；在第二项加“还有”，使并列关系符合现代汉语习惯。
- source_word: כִּכְּרֵי / כִּכַּר
  choice: 他连得
  rationale: 这是古代的大重量单位。采用圣经汉语中通行的音译，避免换算成并不确定的现代重量，并以脚注说明。
- source_word: זָהָב
  choice: 黄金
  rationale: 直接表达贵金属“金”；“黄金”在现代汉语中自然、明确。
- source_word: מִזְּהַב אוֹפִיר
  choice: 是出自俄斐的金子
  rationale: 保留介词 מִן 所表达的来源意味，同时不把“俄斐金”所可能含有的类别或品质意味绝对化。
- source_word: כֶּסֶף
  choice: 银子
  rationale: 上下文明确指贵金属银，而非货币；“银子”自然且不会误解为现代币制。
- source_word: מְזֻקָּק
  choice: 精炼的
  rationale: 该被动分词指经过熔炼、除去杂质的金属，“精炼的”准确体现冶金过程。
- source_word: לָטוּחַ
  choice: 包覆
  rationale: 该词有涂抹、覆盖表面的意思；在以银装饰墙面的语境中，“包覆”比“粉刷”或“抹灰”更能体现覆盖金属层。
- source_word: קִירוֹת הַבָּתִּים
  choice: 各座建筑物的墙壁
  rationale: קִירוֹת 指墙壁；הַבָּתִּים 字面为“房屋”，在圣殿工程语境中泛指相关建筑。“建筑物”避免让现代读者误以为是民居。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留古代重量单位并用脚注解释；对俄斐金的来源或类别之歧义不作过度判定。经文在原语中承接上节列举所献材料，本节按其片段式列举结构翻译，不补入原文没有重复出现的主语或谓语。
