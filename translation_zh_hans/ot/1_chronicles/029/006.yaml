base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/006.yaml
  text: Then the leaders of the fathers’ houses[a], and the leaders of the tribes of Israel, and the commanders of the thousands and of the hundreds, and the overseers of the king’s work[c][b], gave willingly.
translation:
  language: zh_hans
  text: 于是，各父系家族的首领[a]、以色列各支派的首领、千人队和百人队的长官[b]，以及主管王的事务的官员，都甘心奉献[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父系家族”指按共同祖先或宗族划分的家族单位。
    reason: cultural_note
  - marker: b
    text: “千人队”和“百人队”指军事或行政编制，这里说的是这些单位的长官。
    reason: cultural_note
  - marker: c
    text: 或译“自愿献上”。原文强调这是出于自愿的回应；按上下文，是指自愿献上财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַדְּבוּ
  choice: 甘心奉献
  rationale: 该词是נדב的Hitpael形式，强调出于自愿；上下文谈的是为圣殿工程献上财物，因此译作“甘心奉献”既表达自愿，也明确其奉献语境。
- source_word: שָׂרֵי הָאָבוֹת
  choice: 各父系家族的首领
  rationale: “父系家族”表达历代志中按父系宗族划分的家族单位；“首领”保留שָׂרֵי所指的权威职位。
- source_word: שָׂרֵי שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列各支派的首领
  rationale: 直接、自然地表达以色列支派体系中的领导者。
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: 千人队和百人队的长官
  rationale: “千”和“百”在此指军事或行政编制；שָׂרֵי统领两者，故以“长官”明确所列的是这些单位的负责人。
- source_word: וּלְשָׂרֵי מְלֶאכֶת הַמֶּלֶךְ
  choice: 以及主管王室事务的官员
  rationale: 介词ל在此可标示与王的事务相关、负责其工作的官员。“王室事务”比字面的“王的工作”更符合现代汉语，同时保留事务范围的宽泛性。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以并列结构呈现各级领袖和官员，并用“都”收束较长的主语名单。将古代父系宗族及千人、百人编制保留在正文中，以脚注简要解释。
