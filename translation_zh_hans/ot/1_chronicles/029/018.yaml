source:
  edition: WLC
  text: יְהוָ֗ה אֱ֠לֹהֵי אַבְרָהָ֞ם יִצְחָ֤ק וְ/יִשְׂרָאֵל֙ אֲבֹתֵ֔י/נוּ שֳׁמְרָ/ה זֹּ֣את לְ/עוֹלָ֔ם לְ/יֵ֥צֶר מַחְשְׁב֖וֹת לְבַ֣ב עַמֶּ֑/ךָ וְ/הָכֵ֥ן לְבָבָ֖/ם אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/018.yaml
  text: O Yahweh[a], God of Abraham, Isaac, and Israel, our fathers, keep this forever in the intentions of the thoughts of the heart of your people[d][c][b], and direct their heart toward you.
translation:
  language: zh_hans
  text: 雅威——我们祖先亚伯拉罕、以撒和以色列[a]的上帝啊，求你使这心意永远存留在你子民心中所怀的意念里[b]，使他们的心坚定地归向你。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文是“以色列”；这里没有采用族长公式中读者可能更熟悉的“雅各”。
    reason: lexical_alternative
  - marker: b
    text: 较贴近原文可译：“求你使这一切永远存留在你子民内心思想的倾向中。”原文“倾向／构想、思想、心”三个词的组合，以及其与“永远存留”的关系，可有不同理解。
    reason: alternative_reading
  - marker: c
    text: “使……坚定”也可译作“引导”或“预备”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现上帝的圣名，以现代汉语常见音译“雅威”表达，而不以称号替代。
- source_word: אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל אֲבֹתֵינוּ
  choice: 我们祖先亚伯拉罕、以撒和以色列
  rationale: 原文明确作“以色列”，不改成熟悉公式中的“雅各”；“祖先”在现代汉语中自然，并准确涵盖这里所指的三位族长。
- source_word: שָׁמְרָה זֹּאת לְעוֹלָם
  choice: 求你使……这种意念永远存留
  rationale: שׁמר在此是祈求上帝保存、维持前述甘心奉献的内在意愿；汉语用“使……存留”比直译“保守这个”更清楚。
- source_word: לְיֵצֶר מַחְשְׁבוֹת לְבַב עַמֶּךָ
  choice: 你子民心中所怀的这种意念
  rationale: 原文层叠使用“倾向／构想、思想、心”等内在意志词语。正文以自然汉语概括其整体意义，同时借脚注保留较贴近形式的读法和介词关系的歧义。
- source_word: וְהָכֵן לְבָבָם אֵלֶיךָ
  choice: 使他们的心坚定地归向你
  rationale: כון的使役式可表示使坚定、确立、预备或导向；结合אֵלֶיךָ“向着你”，此译兼顾坚定和方向两层含义，并保留原文集合单数“心”。
theological_decisions:
- issue: 圣名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字圣名；音译保留其作为立约圣名的性质，不以称号“主”取代。
- issue: וְיִשְׂרָאֵל 的族长名称
  choice: 以色列
  alternative: 雅各
  rationale: 本节希伯来文本作“以色列”；即使族长公式常出现“雅各”，也不据此协调改写。
- issue: כון 与人心归向上帝的关系
  choice: 使他们的心坚定地归向你
  alternative: 引导他们的心归向你；预备他们的心归向你
  rationale: 原词既可强调确立、坚定，也可在此语境中表达定向；正文保留两者之间的张力，不将其限定为单纯的人为决定或外在引导。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。称呼结构以破折号帮助读者辨明“雅威”与后接同位语；祈求句避免生硬复制希伯来文的层叠名词，同时通过脚注保存其词汇密度与解释空间。
