base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/005.yaml
  text: gold for the things of gold[a], and silver for the things of silver, and for every kind of work by the hands of craftsmen. And who is willing to fill his hand today for Yahweh?
translation:
  language: zh_hans
  text: 金子用于金器，银子用于银器，又供工匠做各样工用。今天有谁甘愿为雅威奉献[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“为雅威使自己的手充满”。这是一个希伯来礼仪习语，可指为圣工献上礼物，也可指献身或分别出来从事圣工。
    reason: 说明正文“奉献”所译的希伯来习语，保留其字面形式及献礼、献身/分别为圣等语义可能。
lexical_decisions:
- source_word: לַזָּהָב לַזָּהָב
  choice: 金子用于金器
  rationale: 原文重复“金子”，是省略式表达，指金子用于以金制作的物件；补出“器”使现代汉语清楚自然。
- source_word: וְלַכֶּסֶף לַכֶּסֶף
  choice: 银子用于银器
  rationale: 与前面的金子构成平行，同样补出省略的器物概念。
- source_word: וּלְכָל מְלָאכָה בְּיַד חָרָשִׁים
  choice: 也用于工匠手中所做的各样工作
  rationale: 保留“手”的希伯来意象，同时表达这些材料用于工匠实施的各类制作工作。
- source_word: וּמִי מִתְנַדֵּב
  choice: 有谁甘愿
  rationale: התפעל词形表达自愿、主动献上的意思；“甘愿”适合大卫在此发出的呼召。
- source_word: לְמַלֹּאות יָדוֹ
  choice: 把自己的手充满
  rationale: 按字面保留具有礼仪色彩的希伯来习语，不在正文中单方面限定为献礼、献身或承接圣职，并用脚注说明其意义范围。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 直接音译神名יהוה；介词在此表示行动归向或奉献给雅威，“为雅威”符合本句呼召的语境。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其专名性质，不以称号替代。
- issue: 礼仪习语לְמַלֹּאות יָדוֹ的解释
  choice: 正文直译“把自己的手充满”，脚注保留多种可能含义
  alternative: 献上自己；奉献礼物；承接圣职
  rationale: 该习语可涉及分别为圣、任职或为圣工献上礼物；本段重点是自愿奉献，但直译可避免把其礼仪张力缩减为单纯捐款。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“金器、银器”补足原文省略成分；末句保留反问语气。
