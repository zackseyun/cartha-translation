base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/020.yaml
  text: Then David said to all the assembly, “Now bless Yahweh your God.” And all the assembly blessed Yahweh, the God of their fathers, and bowed their heads and prostrated themselves before Yahweh and before the king.
translation:
  language: zh_hans
  text: 大卫对全体会众说：“请称颂耶和华——你们的上帝。”[a]全体会众就称颂耶和华——他们祖先的上帝，并且俯身下拜，向耶和华和君王俯伏。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “请称颂”也可译作“现在称颂”。希伯来语语气词 נָא 可以表达恳请或催促。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文说，会众向“耶和华和君王”俯伏，描写的是身体上的致敬动作；对君王的这一动作也可表达为“致敬”。
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: 现在要称颂
  rationale: בָּרְכוּ是复数命令式，要求会众向上帝发出称颂；נָא可表达催促或恳请。“现在要称颂”自然地保留命令与即时催促的语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列上帝之名的性质，而不以称号替代。
- source_word: הַקָּהָל
  choice: 全体会众
  rationale: קָהָל指聚集起来的群体；本节两处均带有整体性的כָּל，译为“全体会众”符合公开集会的语境。
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: 他们祖先的上帝
  rationale: אֲבוֹת字面为“父辈”，在此指以色列历代先祖；“祖先”是现代汉语中自然且准确的表达，并保留圣约历史含义。
- source_word: וַיִּקְּדוּ
  choice: 俯身下拜
  rationale: קדד表示俯身、低头下拜。原文未明说“头”，故不增添身体部位；同时与随后表示俯伏的动词有所区分。
- source_word: וַיִּשְׁתַּחֲווּ
  choice: 俯伏
  rationale: 该词在此首先描写身体伏地致敬的动作。“俯伏”比单译“敬拜”更能保留具体姿态，也避免预先判定对耶和华与君王所表达的敬意性质完全相同。
- source_word: לַיהוָה וְלַמֶּלֶךְ
  choice: 向耶和华和君王
  rationale: 介词ל与俯伏动作连用，可自然译为“向”。原文用同一结构连接两个对象，因此中文保留并列，不擅自拆分成两种不同的动作。
theological_decisions:
- issue: 会众同时向耶和华和君王俯伏
  choice: 保留身体动作及两个并列对象：“向耶和华和君王俯伏”
  alternative: “敬拜耶和华，向君王致敬”
  rationale: 原文把同一个俯伏动作与耶和华、君王并列相连。译文不把两者都抽象化为同等意义的“敬拜”，也不在正文中自行拆分动作的神学性质，从而保留原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“称颂”适合公开敬拜语境；“俯身下拜……俯伏”保留两个相邻身体动作的递进与区别。所有脚注标记均已置入正文。
