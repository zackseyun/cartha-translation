  text: וְ/עַתָּ֣ה אֱלֹהֵ֔י/נוּ מוֹדִ֥ים אֲנַ֖חְנוּ לָ֑/ךְ וּֽ/מְהַֽלְלִ֖ים לְ/שֵׁ֥ם תִּפְאַרְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/013.yaml
  text: And now[a], our God, we give thanks to you and praise the name of your glory.
translation:
  language: zh_hans
  text: 现在，我们的上帝啊，我们感谢你，赞美你荣耀的名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 兼具时间推进和话语承接作用；中文以“现在”自然引出祷告在此刻的回应，无须机械译出连接词。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝啊
  rationale: 这是带第一人称复数后缀的直接称呼；“啊”自然标明中文呼语，且保持现代、庄重的祷告语体。
- source_word: מוֹדִים אֲנַחְנוּ לָךְ
  choice: 我们感谢你
  rationale: ידה的使役词干在敬拜语境中表示感谢或称谢；与后面的“赞美”并列时，“感谢你”准确而自然。
- source_word: וּמְהַלְלִים
  choice: 赞美
  rationale: הלל的加强词干分词表达赞美；中文并列谓语不必显明分词形态。
- source_word: לְשֵׁם תִּפְאַרְתֶּךָ
  choice: 你荣耀的名
  rationale: 保留希伯来文“名”与“荣耀”的名词构造，既反映上帝之名在敬拜中的重要性，也避免把它解释性地改写成单纯“荣耀的名”。
theological_decisions:
- issue: 如何处理对上帝的直接称呼
  choice: 我们的上帝啊
  alternative: 我们的上帝
  rationale: 希伯来文虽无独立呼格词，但语境明确是祷告中的直接称呼；现代汉语用“啊”可自然标示呼语，不增加宗派性含义。
- issue: 如何翻译“你荣耀的名”这一表达
  choice: 赞美你荣耀的名
  alternative: 赞美你荣耀之名／赞美你荣美的名
  rationale: 选择保留“名”和“荣耀”之间的属格张力，不把“荣耀”仅处理为普通形容词，也不将“名”泛化为名声或声誉。
translation_notes:
  register: 采用现代标准普通话的简体中文，语气庄重而易懂。句式贴近祷告语言；避免古雅的“称谢”“荣美之名”，同时保留原文中“名—荣耀”的神学表达。
