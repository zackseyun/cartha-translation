base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/025.yaml
  text: And Yahweh made Solomon exceedingly great in the sight of all Israel[a], and gave him royal majesty such as had not been on any king before him over Israel.
translation:
  language: zh_hans
  text: 雅威使所罗门在全以色列人眼前极其显赫，又赐给他王者的威荣[a]；这样的威荣，是任何在他以前统治以色列的君王都未曾有过的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王者的威荣”或译“王权的尊荣”，也可译“君王的荣光”。
    reason: הוֹד מַלְכוּת 的中心词兼有威严、尊荣和荣光等语义，属可保留的词义幅度。
lexical_decisions:
- source_word: וַיְגַדֵּל ... לְמַעְלָה
  choice: 使……极其尊大
  rationale: 使役形动词 וַיְגַדֵּל 表示“使……为大”，לְמַעְלָה 在此作程度强化语；“使……极其尊大”兼顾使役意义、强化语气和庄重文体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留经文中的专名，而不以称号代替。
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: 在以色列众人眼前
  rationale: 保留“在……眼前”的希伯来语意象，表达所罗门所得尊荣是公开显明、为全民所见的。
- source_word: וַיִּתֵּן עָלָיו
  choice: 赐给他
  rationale: 原文直译近于“加在他身上”，在此表示授予或赋予；“赐给他”自然地表达雅威的主动赏赐。
- source_word: הוֹד מַלְכוּת
  choice: 君王的威荣
  rationale: הוֹד 可指威严、尊荣或荣光，מַלְכוּת 限定其王权领域；“君王的威荣”既传达王者身份，也保留庄严光彩的含义。
- source_word: אֲשֶׁר לֹא הָיָה עַל כָּל מֶלֶךְ לְפָנָיו עַל יִשְׂרָאֵל
  choice: 这样的威荣，是在他以前统治以色列的任何君王都未曾有过的
  rationale: 关系从句指向前述“威荣”；לְפָנָיו 是时间性的“在他以前”，עַל יִשְׂרָאֵל 表示对以色列的统治。中文重述中心词可使指代清楚而不改变原义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；采用较贴近学界通行重构读音的“雅威”，避免以“主”等称号替代专名。
- issue: “在他以前……任何君王”的范围
  choice: 在所罗门以前统治以色列的任何君王
  alternative: 所有君王，无论是否统治以色列
  rationale: 句末 עַל יִשְׂרָאֵל 自然限定 מֶלֶךְ，故比较对象是所罗门以前统治以色列的君王；不将断言扩大到天下所有君王。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“极其尊大”保留经文的强化表达；分号和“这样的威荣”使较长的希伯来语关系从句在中文中清晰顺畅。脚注标记紧随其所解释的“君王的威荣”。
