revisions:
- from: 雅威使所罗门在以色列众人眼前极其尊大，又赐给他君王的威荣[a]；这样的威荣，是在他以前统治以色列的任何君王都未曾有过的。
  to: 雅威使所罗门在全以色列人眼前极其显赫，又赐给他王者的威荣[a]；这样的威荣，是任何在他以前统治以色列的君王都未曾有过的。
  rationale: 修订仅消除“尊大”在现代汉语中的潜在负面联想，并优化末句语序。“极其显赫”保留使役动词与程度强化，且明确表示公开显明的崇高地位；其余内容、神名、比较范围及脚注锚点均予保留。
