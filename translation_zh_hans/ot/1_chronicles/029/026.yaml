  text: 耶西的儿子大卫作全以色列的王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִיד
  choice: 大卫
  rationale: וְ在这里承接上文，汉语不必机械译作“于是”或“并且”；直接以“大卫”起句更自然。人名按现代中文通行译法译为“大卫”。
- source_word: בֶּן יִשָׁי
  choice: 耶西的儿子
  rationale: 忠实保留希伯来语的父子身份说明，并采用自然的现代汉语所属结构。
- source_word: מָלַךְ
  choice: 作……的王
  rationale: 该词在此指实际执掌王权、统治，而非单指登基；“作……的王”既准确又符合现代中文叙事表达。
- source_word: עַל
  choice: 作……的王
  rationale: עַל与מָלַךְ连用，标明受其统治的人民；其关系自然融入汉语“作……的王”结构。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全以色列
  rationale: 保留כָּל所表达的整体范围，表明大卫统治整个以色列。
