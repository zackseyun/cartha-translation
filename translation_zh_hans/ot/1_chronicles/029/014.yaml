  text: וְ/כִ֨י מִ֤י אֲנִי֙ וּ/מִ֣י עַמִּ֔/י כִּֽי נַעְצֹ֣ר כֹּ֔חַ לְ/הִתְנַדֵּ֖ב כָּ/זֹ֑את כִּֽי מִמְּ/ךָ֣ הַ/כֹּ֔ל וּ/מִ/יָּדְ/ךָ֖ נָתַ֥נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/014.yaml
  text: But who am I[a], and who are my people, that we should be able to offer willingly like this? For everything comes from you, and from your hand we have given to you.
translation:
  language: zh_hans
  text: 然而，我算什么，我的百姓又算什么，竟有能力[a]这样甘心献上呢？因为万物都从你而来；我们从你手中所得的，又献给了你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有能力”较直译可作“能保有力量”；这里指有能力或有资源如此甘心献上。
    reason: 说明 נַעְצֹר כֹּחַ 的字面表达及其语境含义。
lexical_decisions:
- source_word: וְכִי
  choice: 然而
  rationale: 该连接语在祷告中引出谦卑的反问和转折；“然而”既自然，也保留与上文的对照。
- source_word: מִי אֲנִי וּמִי עַמִּי
  choice: 我算什么，我的百姓又算什么
  rationale: מִי 字面问“谁”，此处实际表达身份卑微、不配蒙恩；现代汉语用“算什么”能自然传达这一修辞含义，而不是询问姓名或身份。
- source_word: נַעְצֹר כֹּחַ
  choice: 有能力
  rationale: 该短语字面涉及“保有、控制力量”，在此指具备如此奉献的能力或资源；“有能力”清楚而不作过度解释。
- source_word: לְהִתְנַדֵּב
  choice: 甘心献上
  rationale: התנדב 表示自愿、乐意地献出；“甘心献上”兼顾自愿性和奉献语境，又不把它限定为某一种礼仪性祭物。
- source_word: כָּזֹאת
  choice: 这样
  rationale: 指上文所述的大量而慷慨的奉献；“这样”是简洁自然的对应表达。
- source_word: מִמְּךָ הַכֹּל
  choice: 万物都从你而来
  rationale: 保留“全部源于你”的明确信息；“万物”在庄重现代汉语中自然，也能表达 הַכֹּל 的总体范围。
- source_word: וּמִיָּדְךָ נָתַנּוּ לָךְ
  choice: 我们从你手中所得的，又献给了你
  rationale: 保留“手”所表达的供应来源意象，并用“所得的”补足汉语所需的宾语关系；“又”自然呈现先从神领受、再献给神的关系。
theological_decisions:
- issue: 神的所有权、供应与人的奉献
  choice: 明确表达万物源于神，人献上的也是先从神手中所得
  alternative: 意译为“我们不过是把本来属于你的归还给你”
  rationale: 原文直接陈述一切出于神，并说所献的是从神手中而来；正文保留这一宣告，却不增添“不过”“归还”“本来属于”等解释性措辞。
- issue: 人的能力与甘心奉献
  choice: 保留反问，强调人连甘心奉献的能力和资源也不足以自夸
  alternative: 将 נַעְצֹר כֹּחַ 具体解释为“筹集这么多财力”
  rationale: 原文的 כֹּחַ 可涵盖力量、能力或资源；采用较宽泛的“能力”，避免把含义收窄为财力，同时保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“我算什么”与“甘心献上”符合自然汉语修辞；分号连接神的普遍供应与本次奉献，保留原文的因果和对应关系。
