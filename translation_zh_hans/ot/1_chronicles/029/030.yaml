base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/030.yaml
  text: along with all his reign and his might[b][a], and the times that passed over him and over Israel and over all the kingdoms of the lands.
translation:
  language: zh_hans
  text: 连同他整个统治时期和他的勇力，以及他、以色列和诸地一切王国[b]所经历的那些时期[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些经过他、以色列和诸地一切王国的时期。”希伯来语直译为“经过……之上”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“诸地的一切王国。”原文“地”为复数，可指各地或周围的国家、地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִם
  choice: 连同
  rationale: 承接上节所列先见记载的内容，表达这些记载也包括大卫的统治、勇力和时代经历。
- source_word: כָּל מַלְכוּתוֹ
  choice: 他整个统治时期
  rationale: מַלְכוּת 在此是对大卫一生事迹的总结，宜取“统治、在位”的时段意义，而不是疆域意义的“王国”；כָּל 表示其全部历程。
- source_word: וּגְבוּרָתוֹ
  choice: 他的勇力
  rationale: גְבוּרָה 可指力量、英勇或伟业；“勇力”保留词义宽度，也符合对君王生平的庄重概述。
- source_word: וְהָעִתִּים
  choice: 以及……一切时势
  rationale: עִתִּים 直指各个时期，也可涵盖当时的境遇和事件；“时势”在现代汉语中兼顾时代与情势。
- source_word: אֲשֶׁר עָבְרוּ עָלָיו
  choice: 临到他
  rationale: 希伯来语直译为“经过他／越过他”，在此为某些时期或境遇临到某人的习语；“临到”自然且不把内容具体化为某类事件。
- source_word: וְעַל יִשְׂרָאֵל
  choice: 和以色列
  rationale: 与前面的“临到”连读，保留同一动词对大卫和以色列的统摄关系。
- source_word: וְעַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: 并列国
  rationale: 字面是“诸地的一切王国”，语境指各地或周围各国；正文用简洁自然的“列国”，脚注保留原文复数结构。
theological_decisions: []
