revisions:
- from: 连同他整个统治时期、他的勇力，以及临到他和以色列并列国的一切时势。[a][b]
  to: 连同他整个统治时期和他的勇力，以及他、以色列和诸地一切王国[b]所经历的那些时期[a]。
  rationale: 修订将“时势”改为较中性、贴近原文的“那些时期”，用“所经历的”呈现原文习语在汉语中的自然含义，并在脚注保留“经过”的字面表达。将“列国”改为“诸地一切王国”，以更完整反映原文的构词与量词范围；脚注标记移至相应词语之后。
