  source_fidelity: 原文的“所有/整个统治”“勇力”及“经过/临到”的时日均应保留。草稿以“时势”译 הָעִתִּים，容易限缩为政治局势，且“临到……时势”搭配不够自然。将其译为“那些时期”，并以“所经历的”使汉语通顺，同时在脚注保留原文“经过”的意象，较能兼顾原文与现代汉语。
  naturalness: “连同他整个统治时期、他的勇力”可理解，但并列结构略显断裂；“临到他和以色列并列国的一切时势”中“时势”及“并列国”均不够清楚自然。修订后明确三个并列对象，也将脚注分别紧邻对应词语。
  terminology: “勇力”适合庄重叙事语体，并保留力量、英勇及勇武作为的语义空间。“诸地一切王国”对应 כָּל מַמְלְכוֹת הָאֲרָצוֹת，避免“列国”将“王国”和复数“诸地”的表达完全抹平。
