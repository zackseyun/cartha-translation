base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/028.yaml
  text: And he died in a good old age[a], full of days, riches, and honor; and Solomon his son reigned in his place.
translation:
  language: zh_hans
  text: 他在美好的晚年去世，年日满足，享有财富和尊荣；他儿子所罗门接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: 而死
  rationale: 该叙事性动词承接前文，表示随后发生的死亡；结合汉语句法，与前面的状况描写连为“安享高寿而死”，自然且不增加解释。
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: 安享高寿
  rationale: 原文直指“美好的老年／白发之年”，正面评价其寿命与晚年。“安享高寿”以自然现代汉语保留高龄善终的意味，同时不与后面的“年日满足”完全合并。
- source_word: שְׂבַע יָמִים
  choice: 年日满足[a]
  rationale: 较贴近希伯来语“日子饱足”的意象，也保留长寿且一生圆满的习语含义；脚注列出更具动态色彩的译法。
- source_word: עֹשֶׁר וְכָבוֹד
  choice: 富足尊荣
  rationale: עֹשֶׁר表示财富、富裕，כָבוֹד在君王的人生总结中表示尊荣或显赫地位；“富足尊荣”简洁庄重。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך的Qal形式表示执掌王权或为王；“作王”是现代汉语圣经叙事中清楚自然的表达。
- source_word: שְׁלֹמֹה בְנוֹ
  choice: 他儿子所罗门
  rationale: 按照自然汉语语序表达亲属关系，并清楚指明继位者。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 该词在王位继承公式中表示“代替他／在他的位置上”；“接替他作王”准确表达继位关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“安享高寿”与“年日满足”并列，保留原文两个相近却不完全相同的长寿表述；分号呈现死亡总结与所罗门继位之间的叙事转折。
