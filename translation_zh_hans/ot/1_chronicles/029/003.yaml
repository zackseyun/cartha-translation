revisions:
- from: 此外，因我喜爱我上帝的殿[a]，我还有个人珍藏的金银[b]，并已献给我上帝的殿；这是在我为圣殿[c]所预备的一切之外。
  to: 此外，因我喜爱我上帝的殿，我有个人珍藏的金银；我把这些献给我上帝的殿，是在我为圣殿所预备的一切之外。
  rationale: 修订仅澄清中文句法：将“在……之外”明确连于献上的个人珍藏，并删去脚注a中不够可靠且不自然的替代分析。为使脚注锚点与所注词语对应，a置于“喜爱我上帝的殿”后，b置于“个人珍藏的金银”后，c置于“圣殿”后。
