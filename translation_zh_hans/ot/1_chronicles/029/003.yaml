  text: וְ/ע֗וֹד בִּ/רְצוֹתִ/י֙ בְּ/בֵ֣ית אֱלֹהַ֔/י יֶשׁ לִ֥/י סְגֻלָּ֖ה זָהָ֣ב וָ/כָ֑סֶף נָתַ֤תִּי לְ/בֵית אֱלֹהַ/י֙ לְ/מַ֔עְלָ/ה מִ/כָּל הֲכִינ֖וֹתִי לְ/בֵ֥ית הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/003.yaml
  text: Moreover[a], because of my delight in the house of my God, I have a personal treasure of gold and silver, and I have given it to the house of my God[c][b], over and above all that I have prepared for the holy house.
translation:
  language: zh_hans
  text: 此外，因我喜爱我上帝的殿，我有个人珍藏的金银；我把这些献给我上帝的殿，是在我为圣殿所预备的一切之外。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעוֹד
  choice: 此外
  rationale: 承接上文，引出大卫在先前预备之外追加的奉献；“此外”自然表达附加和强调的语篇功能。
- source_word: בִּרְצוֹתִי בְּבֵית אֱלֹהַי
  choice: 因我喜爱我上帝的殿
  rationale: רצון 在这里表示喜爱、悦纳或乐意，前置介词 ב 表明动机；第二个 ב 最自然地表示喜爱的对象或范围。
- source_word: יֶשׁ לִי
  choice: 我还有
  rationale: 希伯来语存在句在此表达所有关系；“还有”同时衔接前文，并带出额外的个人财产。
- source_word: סְגֻלָּה זָהָב וָכָסֶף
  choice: 个人珍藏的金银
  rationale: סְגֻלָּה 指珍贵的个人财产或珍藏之物。此处强调这些金银属于大卫个人，有别于他此前为建殿所作的预备；“个人珍藏”既清楚又避免“私藏”可能带来的负面含义。
- source_word: נָתַתִּי לְבֵית אֱלֹהַי
  choice: 并已献给我上帝的殿
  rationale: 完成式表示已经作出的行动，并与当前宣告相关；在奉献语境中，“献给”比一般的“给”更自然，同时保留 לְ 所表达的目标。
- source_word: לְמַעְלָה מִכָּל הֲכִינוֹתִי
  choice: 这是在我……所预备的一切之外
  rationale: 表达超过并附加于原有预备之上的意思；中文以“在……之外”准确呈现比较和追加关系。
- source_word: לְבֵית הַקֹּדֶשׁ
  choice: 为圣殿
  rationale: 字面为“为圣洁的殿（房屋）”。现代中文“圣殿”自然、庄重，并准确指向分别为圣的敬拜建筑。
theological_decisions:
- issue: 如何翻译大卫话语中的 בית 与 בֵית הַקֹּדֶשׁ
  choice: 我上帝的殿／圣殿
  alternative: 我上帝的家／圣洁的殿；圣所
  rationale: בית 的基本义是“房屋、殿”，在此指为上帝建造的敬拜场所。“殿”既保留其住所意象，也符合现代中文圣经语体；末句的“圣殿”自然表达“圣洁的殿”，但脚注保留更形式对应的译法及“圣所”这一可能译法。
- issue: 大卫喜爱之对象与动机的关系
  choice: 因我喜爱我上帝的殿
  alternative: 因我以我上帝的殿为乐；为了我上帝的殿，因我乐意
  rationale: 句法最自然地把 בְּבֵית אֱלֹהַי 理解为喜爱的对象或范围，并把 בִּרְצוֹתִי 理解为奉献的动机；但介词结构存在一定弹性，因此在脚注中保留另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿／圣殿”延续本节反复出现的建筑意象；“个人珍藏”避免“私藏”的贬义。“并已献给”体现希伯来语完成式，同时符合奉献语境。
