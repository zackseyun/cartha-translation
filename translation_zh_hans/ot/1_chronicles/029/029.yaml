base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/029.yaml
  text: The acts of David the king[a], the former and the latter, are written in the records of Samuel the seer, and in the records of Nathan the prophet[c][b], and in the records of Gad the seer.
translation:
  language: zh_hans
  text: 大卫王前后的事迹[a]，都记在先见撒母耳的记录、先知拿单的记录和先见迦得[c]的记录中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大卫王前后的事情（或言语）”。希伯来文直译为“大卫王先前的和后来的事”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“写在撒母耳……拿单……迦得的事（或话）上”；这里译作“记录”，表示书面资料，但原文没有进一步说明其文献体裁。
    reason: lexical_alternative
  - marker: c
    text: 这里译作“先见”的两个希伯来称号并非同一个词：撒母耳的称号是רֹאֶה，迦得的称号是חֹזֶה；后者也可译作“异象者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי דָוִיד הַמֶּלֶךְ
  choice: 大卫王……的事迹
  rationale: דְּבָרִים本义范围包括“话、事情、事件”；在概述君王生平并与“前期和后期”连用时，指其经历与作为，译为“事迹”自然且不把它误解为单纯言论。
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: 前期和后期
  rationale: 保留希伯来文“先前的和后来的”这一对称表达，同时在现代汉语中自然地指大卫生平或统治的整个跨度。
- source_word: הִנָּם כְּתוּבִים
  choice: 都记在
  rationale: “都”承接复数事迹，也传达הִנָּם的指示、强调语气；“记在”准确表达这些内容见于书面资料。
- source_word: עַל דִּבְרֵי
  choice: 记在……的记录中
  rationale: 逐字可作“写在……的话／事情之上”，但此处指所依据或收录这些事迹的书面资料；“记录中”符合现代汉语习惯，又不武断指定具体文献体裁。
- source_word: הָרֹאֶה
  choice: 先见
  rationale: 这是撒母耳的先知性称号；“先见”是简洁而通行的汉语圣经用语，并与“先知”有所区别。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: נָבִיא的标准译法，保留拿单所得称号与另两人的称号差异。
- source_word: הַחֹזֶה
  choice: 先见
  rationale: חֹזֶה也是先知性称号，汉语通常可译“先见”；与רֹאֶה的希伯来词汇差别另以脚注说明。
theological_decisions:
- issue: רֹאֶה与חֹזֶה两个先知性称号的译法
  choice: 正文均译为“先见”
  alternative: 将חֹזֶה译为“异象者”或“见异象者”，以显示两词不同
  rationale: 两词在希伯来文中不同，但本节没有清楚界定二者职分上的神学差别。正文统一译为自然、传统的“先见”，同时用脚注保留词汇差异，避免过度解释。
- issue: דִּבְרֵי作为大卫生平概述的含义
  choice: 译为“事迹”
  alternative: 译为“言语”“事情”或“史事”
  rationale: 上下文谈大卫前后各时期并指向书面资料，故这里主要是他的经历和作为，而非仅指他说过的话；“事迹”最能传达这一语境含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“前期和后期”的对称结构及“先见／先知”的称号差异；通过重复“记录”呈现原文三个并列书面来源，不添加原文没有的篇名或文献类型。
