  text: וְ/לִ/שְׁלֹמֹ֣ה בְנִ֗/י תֵּ֚ן לֵבָ֣ב שָׁלֵ֔ם לִ/שְׁמוֹר֙ מִצְוֺתֶ֔י/ךָ עֵדְוֺתֶ֖י/ךָ וְ/חֻקֶּ֑י/ךָ וְ/לַ/עֲשׂ֣וֹת הַ/כֹּ֔ל וְ/לִ/בְנ֖וֹת הַ/בִּירָ֥ה אֲשֶׁר הֲכִינֽוֹתִי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/019.yaml
  text: And give to Solomon my son a whole heart to keep your commandments[a], your testimonies, and your statutes, and to do all of them, and to build the fortress that I have prepared.
translation:
  language: zh_hans
  text: 求你赐给我儿所罗门一颗完整的心，使他遵守你的诫命、法度和律例，实行这一切，并建造我所预备的这座殿宇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿宇”所译的希伯来词也可指“堡垒”或“宫殿”；在这里，它指大卫所预备、由所罗门建造的圣所。
    reason: 说明罕见建筑术语בִּירָה的词义范围及其在本段中的具体所指。
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה בְנִי תֵּן
  choice: 求你赐给我儿所罗门
  rationale: 希伯来文以祈求语气直接请求上帝“赐给”所罗门；中文补出“求你”，自然表达祷告语境，而不改变命令式祈求的力量。
- source_word: לֵבָב שָׁלֵם
  choice: 一颗纯全的心
  rationale: לֵבָב指人的内心、意志和思想，שָׁלֵם强调完整、诚实和不分裂。“纯全”保留心之完整与正直的意象，又不把它收窄为单纯的情感热忱。
- source_word: לִשְׁמוֹר
  choice: 遵守
  rationale: שׁמר与诫命等律法用语连用时，指谨守、遵行；“遵守”是现代中文最自然准确的表达。
- source_word: מִצְוֺתֶיךָ עֵדְוֺתֶיךָ וְחֻקֶּיךָ
  choice: 你的诫命、法度和律例
  rationale: 分别保留三组相关而不完全相同的盟约与律法术语；“诫命、法度、律例”庄重清楚，也符合中文圣经语域。
- source_word: וְלַעֲשׂוֹת הַכֹּל
  choice: 实行这一切
  rationale: 字面为“行这一切”；“这一切”自然回指前述诫命、法度和律例，并突出实际履行。
- source_word: וְלִבְנוֹת הַבִּירָה
  choice: 并建造……宏伟殿宇
  rationale: בִּירָה可指堡垒、宫堡或宏伟宫殿式建筑；本处明确指大卫为所罗门筹备建造的圣所。“宏伟殿宇”既交代具体所指，又尽量保留该词不同于普通“殿”的特殊建筑色彩；词义张力在脚注中说明。
- source_word: אֲשֶׁר הֲכִינוֹתִי
  choice: 我所筹备的
  rationale: כון的使役形表示预备、使之就绪。此处大卫筹备的是建殿工程及其所需，并非声称建筑已经完工；“所筹备的”在中文中自然保留这种含义。
theological_decisions:
- issue: בִּירָה与耶路撒冷圣所的关系
  choice: 宏伟殿宇
  alternative: 堡垒；宫殿；圣殿
  rationale: 该词本身可带堡垒或宫殿式宏伟建筑的意味，而上下文所指是献给上帝的圣所。单译“堡垒”容易使现代读者误以为是军事设施，单译“宫殿”又可能被理解为王宫，单译“圣殿”则会抹去原文罕见用词的色彩。因此正文采用“宏伟殿宇”，并以脚注保存其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“纯全的心”保留希伯来文“完整的心”的具体意象；律法术语使用“诫命、法度、律例”以维持三者的形式区分。脚注标记置于其实际解释的“宏伟殿宇”之后。
