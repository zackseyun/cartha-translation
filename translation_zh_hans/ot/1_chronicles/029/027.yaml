base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/027.yaml
  text: The days that he reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: zh_hans
  text: 他统治以色列共四十年：在希伯仑统治了七年，在耶路撒冷统治了三十三年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: 他统治……共……年
  rationale: 希伯来语直译为“他作王的日子”，是说明在位年数的惯用表达；现代汉语以“统治……共……年”自然传达其含义，同时保留君王治理的语义。
- source_word: עַל יִשְׂרָאֵל
  choice: 以色列
  rationale: 介词עַל与מָלַךְ连用，表示统治的对象。汉语“统治以色列”已自然表达“在以色列之上作王”，不增添原文没有的“全”。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 按现代汉语规范表达数词与年数。
- source_word: בְּחֶבְרוֹן מָלַךְ שֶׁבַע שָׁנִים
  choice: 在希伯仑统治了七年
  rationale: בְּ表示地点；重复“统治”以保存原文的平行结构。
- source_word: וּבִירוּשָׁלִַם מָלַךְ שְׁלֹשִׁים וְשָׁלוֹשׁ
  choice: 在耶路撒冷统治了三十三年
  rationale: 直接表达地点、重复的动词及合成数词，并与前一分句形成整齐的平行。
