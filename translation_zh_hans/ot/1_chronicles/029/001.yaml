base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/001.yaml
  text: Then King David said to all the assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great; for the palace is not for man, but for the LORD God.”
translation:
  language: zh_hans
  text: 大卫王对全会众说：“我儿所罗门，就是上帝所拣选的那一位，还年轻稚嫩；这工程浩大，因为这宫殿不是为人建造的，而是为耶和华上帝建造的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקָּהָל
  choice: 全会众
  rationale: 指聚集在场的以色列群体；“会众”既贴近原文，也符合庄重的现代汉语表达。
- source_word: אֶחָד בָּחַר בּוֹ אֱלֹהִים
  choice: 就是上帝所拣选的那一位
  rationale: 保留 אֶחָד 的限定意味，将其理解为“那一位”，而不强化为排他的“唯一”。
- source_word: נַעַר וָרָךְ
  choice: 还年轻稚嫩
  rationale: נַעַר 表示年轻，רָךְ 在此表示稚嫩、尚不成熟；合译自然地传达年龄与阅历不足。
- source_word: הַמְּלָאכָה
  choice: 这工程
  rationale: 本段语境是建造圣殿，故译为“工程”，比泛指的“工作”更明确。
- source_word: הַבִּירָה
  choice: 这宫殿
  rationale: 该词可指堡垒或宏伟建筑，在此指将为耶和华建造的圣殿性建筑；“宫殿”保留其宏伟、尊贵的语感，也避免直接以“圣殿”消除词汇特色。
- source_word: לַיהוָה אֱלֹהִים
  choice: 为耶和华上帝
  rationale: 以“耶和华”呈现神圣名 יהוה，并保留 אֱלֹהִים 为“上帝”。
theological_decisions:
- issue: אֶחָד 是否表示“唯一被拣选者”
  choice: 那一位
  alternative: 唯一被拣选的
  rationale: 原文的 אֶחָד 可突出所罗门是那一位被拣选者，但未必明确强调绝对排他性；因此不额外加入“唯一”。
- issue: הַבִּירָה 是否直接译为“圣殿”
  choice: 宫殿
  alternative: 圣殿
  rationale: 原文没有使用通常表示圣殿的 הֵיכָל 或 בַּיִת；保留“宫殿”能呈现该处将耶和华视为真正君王的修辞张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“年轻稚嫩”准确传达年龄与经验不足；“这工程浩大”简洁有力。神名译作“耶和华”，整体避免古奥文言和宗派化措辞。
