base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/024.yaml
  text: And all the officials[a], the mighty men, and also all the sons of King David pledged allegiance to King Solomon.
translation:
  language: zh_hans
  text: 所有官员、勇士，以及大卫王所有的儿子，都向所罗门王表示效忠[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“把手交在所罗门王之下”，这是表示臣服或效忠的希伯来语习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָּׂרִים
  choice: 官员
  rationale: 该词泛指掌权者或高级官员；“官员”符合宫廷和政务语境，也不把所指范围限定为军事将领。
- source_word: גִּבֹּרִים
  choice: 勇士
  rationale: 该词可指英勇、有能力或有权势的人，常带军事色彩；“勇士”自然保留其主要语义。
- source_word: בְּנֵי הַמֶּלֶךְ דָּוִיד
  choice: 大卫王的儿子们
  rationale: 直接表达与大卫的父子关系，并保留其王室身份；复数形式对应原文。
- source_word: נָתְנוּ יָד תַּחַת
  choice: 向……表示效忠
  rationale: 原文直译为“把手交在……之下”，是表示归顺、服从或效忠的希伯来语习语；此译法清楚自然，又不额外断定存在正式宣誓仪式。
- source_word: שְׁלֹמֹה הַמֶּלֶךְ
  choice: 所罗门王
  rationale: 以现代汉语自然的称谓次序表达原文“所罗门—王”的同位结构，并突出所罗门已被承认为王。
theological_decisions:
- issue: “把手交在……之下”所表达的关系
  choice: 表示效忠
  alternative: 顺服／归顺
  rationale: 此处关乎大卫众子及领袖对所罗门王权的承认。“表示效忠”兼顾忠诚与臣服之意，却不把该动作解释为具有特定宗教或制度形式的誓约。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“官员”比“王子”或“将领”更能涵盖 שָּׂרִים 的广泛所指；“表示效忠”传达习语含义，并以脚注保留原文形象。脚注标记置于其实际解释的短语之后。
