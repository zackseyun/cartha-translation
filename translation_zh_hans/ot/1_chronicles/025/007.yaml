base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/007.yaml
  text: Their number[a], together with their brothers who were trained in singing to Yahweh, all who were skillful[b], was two hundred eighty-eight.
translation:
  language: zh_hans
  text: 他们连同弟兄们，就是那些受过训练、向雅威[a]歌唱、都很娴熟[b]的人，共有二百八十八人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为雅威歌唱”。这里的希伯来语介词可表示歌唱的对象，也可表示歌唱的目的。
    reason: lexical_alternative
  - marker: b
    text: 或译“全都是有悟性的人”。在此处受训歌唱者的语境中，这也可指在音乐事奉上有理解力和胜任能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפָּרָם
  choice: 共计
  rationale: 该词表示被数点后的总数；结合句末数词译作“共计”，符合现代汉语表达，同时保留统计总数之意。
- source_word: עִם אֲחֵיהֶם
  choice: 连同弟兄们
  rationale: עִם表示伴随、合在一起；אֲחֵיהֶם直译为“他们的弟兄们”。本段所述为男性利未人的圣殿职分，故不作中性化处理。
- source_word: מְלֻמְּדֵי שִׁיר
  choice: 受过训练……歌唱的人
  rationale: מְלֻמְּדֵי是למד的被动分词，强调经过教导或训练；שִׁיר在此指歌唱或诗歌，译文保留训练的被动含义。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל在歌唱语境中可表示对象或目的；“向雅威歌唱”自然地表达歌唱所朝向的对象。יהוה按专名译作“雅威”。
- source_word: כָּל הַמֵּבִין
  choice: 个个精通此道
  rationale: בין的分词在此语境中不只表示一般性的“明白”，也指在音乐职事上有理解力和能力；“精通此道”传达其胜任、娴熟之意。
- source_word: מָאתַיִם שְׁמוֹנִים וּשְׁמוֹנָה
  choice: 二百八十八人
  rationale: 希伯来文数词明确表示288；正文以汉字写出，符合庄重而易读的经文体例。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה。译作“雅威”以专名形式保留其圣约之名，不以称号“主”代替；“耶和华”是汉语传统中广为人知的另一种音译。
- issue: כָּל הַמֵּבִין所指的能力
  choice: 精通此道
  alternative: 有悟性／明白的人
  rationale: 在受训歌唱者的上下文中，该表达很可能指音乐职事上的理解力和胜任能力；脚注保留较为字面的“有悟性”读法，避免排除原文的认知含义。
translation_notes:
  register: 采用现代、庄重而口语可懂的书面汉语。“连同”“受过训练”“共计”紧贴原文结构；以破折号式解释改为顺畅的关系分句，避免汉语句子生硬。所有脚注标记均置于所解释的词语之后。
