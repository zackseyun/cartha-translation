  text: For the seventeenth[a], Joshbekashah, his sons and his brothers, twelve.
translation:
  language: zh_hans
  text: 第十七签[a]归雅什别卡沙；他的儿子和弟兄共十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“第十七，归雅什别卡沙”；“签”由上下文补出。
    reason: 说明原文省略了由上下文可知的“签”（或班次）这一名词，保留其简略名册句式的信息。
lexical_decisions:
- source_word: לְשִׁבְעָה עָשָׂר
  choice: 第十七签
  rationale: 在本章按签分班的名册语境中，这一序数表示第十七次抽出的签；原文省略了“签”，中文正文补出可使意思自然明确，并以脚注说明。
- source_word: לְיָשְׁבְּקָשָׁה
  choice: 归约施比加沙
  rationale: 前缀 לְ 表明这一签所归属的人；“归”符合中文名册语体。人名依希伯来语音译。
- source_word: בָּנָיו
  choice: 他的众子
  rationale: בנים 在此指儿子；“众子”准确保留复数和性别所指。
- source_word: וְאֶחָיו
  choice: 弟兄
  rationale: אחים 直译为兄弟；中文以“弟兄”涵盖兄与弟，同时不扩大解释为一般亲族。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 这是该班成员的总数；补出量词“人”和“共”符合现代汉语表达。
