  rationale: 作出小幅安全修订：统一重复习语的译法，改善“归……指挥”的现代汉语自然度，并校正脚注对字面翻译的表述。其余内容保留，包括原文的重复、亚萨作为“说预言”者，以及不被弱化的先知性措辞。
