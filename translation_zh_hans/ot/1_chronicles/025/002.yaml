base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/002.yaml
  text: 'Of the sons of Asaph: Zaccur[a], Joseph, Nethaniah, and Asharelah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.'
translation:
  language: zh_hans
  text: 亚萨的子孙有撒刻、约瑟、尼探雅和亚萨利拉；他们是亚萨的子孙，在亚萨的指挥下[a]；亚萨在王的指挥下说预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在……的指挥下”所译的希伯来语习语，字面意象为“借着……的手”。它可表示经手、监管、指挥或权柄之下；后文“在王的指挥下”使用同一习语。
    reason: 说明该习语的字面意象和语义范围，并标明两处相同措辞的平行关系。
lexical_decisions:
- source_word: לִבְנֵי אָסָף
  choice: 亚萨的子孙中
  rationale: 名单语境中的介词 לְ 引出所属组别；译为“……的子孙中”既体现分类标题，也符合现代汉语表达。
- source_word: זַכּוּר
  choice: 撒刻
  rationale: 希伯来人名，采用简体中文圣经中清楚、可辨识的音译。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用通行的中文圣经人名译法。
- source_word: נְתַנְיָה
  choice: 尼探雅
  rationale: 按希伯来语人名音译，并与现代中文圣经常见形式相协调。
- source_word: אֲשַׂרְאֵלָה
  choice: 亚萨利拉
  rationale: 按 WLC 所载人名形式音译；不据本章第14节的另一形式擅自统一。
- source_word: בְּנֵי אָסָף
  choice: 他们都是亚萨的子孙
  rationale: 保留原文重复，以明确所列诸人属于亚萨的宗族或班组；补出“他们都是”使汉语句法自然。
- source_word: עַל יַד אָסָף
  choice: 归亚萨指挥
  rationale: עַל יַד 是表示经手、监管或指挥的习语；此处名单与职务语境适合译为“归……指挥”。
- source_word: הַנִּבָּא
  choice: 说预言
  rationale: 保留 נבא 的先知性用语，不将其弱化为单纯演奏或歌唱；上下文则表明该活动属于圣殿音乐事奉。
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: 遵王的指挥
  rationale: 同一习语在此表达王的权柄或授命；“遵王的指挥”自然呈现亚萨在王权之下履职的关系。
theological_decisions:
- issue: 圣殿音乐语境中“说预言”的含义
  choice: 在正文保留“说预言”
  alternative: 受感而奏乐／以歌唱传达预言
  rationale: נבא 明确使用先知性动词。虽然上下文把这活动置于礼仪音乐事奉中，译文仍不应把它化约为一般音乐表演，也不应擅自限定为歌唱。
- issue: הַנִּבָּא 的句法所指
  choice: 理解为修饰最近的单数人名“亚萨”
  alternative: 理解为概括亚萨及其子孙的活动
  rationale: 阳性单数分词在句法上最自然地对应紧邻的亚萨；译为独立句“亚萨……说预言”可消除汉语中错误回指列名众人的风险，同时不改变原文命题。
translation_notes:
  register: 采用现代、庄重而易懂的名单体表达。保留“亚萨的子孙”的重复和“说预言”的神学张力；以分句和独立句处理原文密集结构。人名采用简体中文常见圣经音译风格。
