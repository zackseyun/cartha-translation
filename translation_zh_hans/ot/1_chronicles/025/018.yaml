  text: the twelfth[a], Azarel; his sons and his brothers, twelve.
translation:
  language: zh_hans
  text: 第十二签归亚萨列[a]；他的儿子和弟兄，共十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚萨列”也可音译为“亚撒烈”。
    reason: 保留该希伯来人名可采用的另一种中文音译形式。
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר
  choice: 第十一签
  rationale: 该希伯来数词是“十一”；在本段按抽签次序列举班次的语境中，应译为序数“第十一”。“签”由上下文补出，使现代汉语表达完整。英文咨询文本作“第十二”与原文数词及名单次序不符，故不沿用。
- source_word: עֲזַרְאֵל
  choice: 亚萨列
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 原词明确指男性后代，直译为“儿子”，不泛化为“儿女”。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: 保留原词“弟兄”的直接含义；在此编组名单中也可能泛指同族男性或同工，但正文不替原文消除这一语义范围。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 这是亚萨列所属一组的总人数；补出“共”和量词“人”，符合自然汉语，也清楚表达原文省略式结构。
theological_decisions: []
