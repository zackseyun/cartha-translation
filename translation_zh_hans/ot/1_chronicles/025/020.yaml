- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: 原词字面义为“兄弟”；在此组织名册语境中也可能涵盖同族男性或同组成员，但正文保留直接词义。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 数字说明书巴业的儿子和弟兄合计十二人；补出“共”和量词“人”，使中文清楚自然，并不改变名册式的简洁表达。
