  text: the twelfth to Hashabiah[a], his sons and his brothers, twelve.
translation:
  language: zh_hans
  text: 第十二签归哈沙比雅；连同他的儿子和弟兄，共十二人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: 第十二签
  rationale: 该短语形式上是基数“十二”，但本章按次序逐一列出抽中的签，因此在此作序数使用；补出“签”可自然表达上下文隐含的信息。
- source_word: לַחֲשַׁבְיָה
  choice: 归哈沙比雅
  rationale: 前缀 ל 表示签所分派的对象；“归”简洁地体现分派关系，也符合中文名册体例。
- source_word: חֲשַׁבְיָה
  choice: 哈沙比雅
  rationale: 按希伯来语人名音译，并采用现代中文圣经中自然、易辨识的形式。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: בנים 在此指男性后裔，“儿子”准确保留其性别和亲属含义。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: אחים 的基本义为兄弟；“弟兄”在此可作为同一宗族或班组中男性成员的自然称呼，同时保留原文关系用语可能具有的范围。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 末尾数字说明该组总人数；补出量词“人”符合现代汉语表达，“共”清楚标明合计。
theological_decisions: []
translation_notes:
  register: 采用简洁庄重的名册语体。“第十二签归……”既保留本章抽签分班的结构，也避免把希伯来语形式机械译成“十二”。分号划分签的归属与组员总数，使短句清楚易读。
