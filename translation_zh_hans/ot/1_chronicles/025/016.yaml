  yaml_path: translation/ot/1_chronicles/025/016.yaml
  text: The ninth was Mattanyahu[a], his sons and his brothers, twelve.
translation:
  language: zh_hans
  text: 第九签归玛坦雅胡[a]；他和他的儿子及弟兄共十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文名为“玛坦雅胡”；传统译名常作“玛探雅”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשִׁיעִי
  choice: 第九签
  rationale: 带定冠词的序数词在本章抽签分班的名册中作省略式表达；补出上下文隐含的“签”，使现代汉语清楚自然。
- source_word: מַתַּנְיָהוּ
  choice: 玛坦雅胡
  rationale: 按希伯来语形式音译，保留词尾־יָהוּ（-yahu）；传统译名另见脚注。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 原词明确指“儿子”，符合本段家族及班次名册的语境。
- source_word: וְאֶחָיו
  choice: 及弟兄
  rationale: 保留原词“弟兄”的基本意义；虽然在此也可能泛指同族成员，但上下文不足以要求扩大译义。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 数字是这一组人员的总数；加“共”和量词“人”符合现代汉语表达，同时保留原文简洁的名册体。
theological_decisions: []
translation_notes:
