  text: וַ/יַּפִּ֜ילוּ גּוֹרָל֣וֹת מִשְׁמֶ֗רֶת לְ/עֻמַּת֙ כַּ/קָּטֹ֣ן כַּ/גָּד֔וֹל מֵבִ֖ין עִם תַּלְמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/008.yaml
  text: And they cast lots for duties[a], the small as well as the great[b], the teacher with the student.
translation:
  language: zh_hans
  text: 他们为各班次抽签；无论地位高低[a]，还是精通者[b]和学生，都一视同仁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“小的和大的”，是涵盖不同地位、身份或资历之人的表达。
    reason: cultural_note
  - marker: b
    text: “精通者”所译的希伯来词也可译作“明白的人”；在此语境中也可能指具有教导能力的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ גּוֹרָלוֹת
  choice: 抽签
  rationale: 这是希伯来语中以签决定分派的惯用表达；“抽签”自然、准确，也保留了具体行动。
- source_word: מִשְׁמֶרֶת
  choice: 分派班次
  rationale: 本节处于圣殿乐班编组的语境中，该词指轮值的职守或班次；结合“抽签”，译作“分派班次”清楚表达其功能。
- source_word: לְעֻמַּת
  choice: 一视同仁……也一样
  rationale: 此处表达不同群体在抽签安排上受到同等对待，并非空间上的“相对”。
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: 地位低的和地位高的
  rationale: “小与大”在这里较可能是身份、地位或资历方面的概括，而非单指年龄；正文传达其语境含义，脚注保留原文措辞。
- source_word: מֵבִין
  choice: 老师
  rationale: 该分词本义是“明白的人、精通者”；与“学生”并列时，“老师”能自然表达具有知识并可指导他人的一方，同时以脚注保留词义上的开放性。
- source_word: תַּלְמִיד
  choice: 学生
  rationale: 该词指学习者；在音乐职事的训练语境中，“学生”比带有特定宗教联想的“门徒”更合适。
theological_decisions:
- issue: 抽签时不同身份者是否平等
  choice: 译明“地位低的和地位高的，一视同仁；老师和学生也一样”
  alternative: 较形式地译为“小的如同大的，明白者与学生一起”
  rationale: 经文强调抽签分班不因地位或熟练程度而区别对待；这一处理说明句法关系，但不为抽签赋予原文未明说的神学机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“分派班次”贴合圣殿乐班的上下文；以分号呈现抽签分班与各类人员同等参与之间的关系。所有解释性扩展均限于原文句法和语境所支持的范围。
