  text: The fourth[a], to Izri, his sons and his brothers, twelve.
translation:
  language: zh_hans
  text: 第四签[a]归伊斯利；他的儿子和弟兄，共十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“第四”；根据上下文，指“第四签归伊斯利”。本节原文没有明说“签”。
    reason: 说明正文为使中文表意完整而补出的上下文信息，同时保留原文的省略式表达。
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: 第四签
  rationale: 序数词在本段名单中作省略表达，按上下文指第四次所抽的签。中文若只译“第四”容易意思悬空，因此在正文补出“签”，并以脚注说明原文未明说。
- source_word: לַיִּצְרִי
  choice: 归伊斯利
  rationale: 前缀ל在此表示抽签所得的归属；“归伊斯利”符合中文名单体，也保留分派之意。人名按希伯来语音译为“伊斯利”。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 原词明确指男性后代，直译为“儿子”，不泛化为“儿女”。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: אָח通常指兄弟，也可在群体名单中泛指男性亲属或同族成员；正文采用直接而传统的“弟兄”，不擅自缩窄或扩大其范围。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 数字说明该组总人数。补出中文量词“人”和“共”，使名单语句自然清楚，并未增添实质信息。
theological_decisions: []
