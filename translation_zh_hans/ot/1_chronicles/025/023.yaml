  text: 第十六份归给哈拿尼雅；他的儿子和弟兄共十二人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְשִׁשָּׁה עָשָׂר
  choice: 第十六签归
  rationale: לְ加序数在本段表示抽签次序及归属。希伯来文本本节未明说“签”，但上下文反复以抽签分班，因此在正文中补出“签”，使现代汉语自然清楚，并以脚注说明。
- source_word: לַחֲנַנְיָהוּ
  choice: 哈拿尼雅
  rationale: 按现代中文圣经人名的通行形式音译 חֲנַנְיָהוּ，既便于读者辨认，也对应其希伯来语人名。
- source_word: בָּנָיו
  choice: 他的众子
  rationale: בָּנִים 在此名单语境中指儿子；“众子”准确保留复数，也符合庄重而简洁的名录体。
- source_word: וְאֶחָיו
  choice: 弟兄
  rationale: אָח 的直接意义是兄弟，但在此类编组名单中也可能泛指同族男子或同工；正文保留较直接且简洁的“弟兄”，脚注提示语义范围。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 末尾数词说明哈拿尼雅及其众子、弟兄这一组的总人数。汉语补出“共”和量词“人”，自然表达原文的合计功能。
