base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/003.yaml
  text: 'Of Jeduthun: the sons of Jeduthun—Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah, six—under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praise to Yahweh.'
translation:
  language: zh_hans
  text: 属耶杜顿的：耶杜顿的儿子基大利、西利、耶筛亚、哈沙比雅和玛他提雅，共六人[a]，都在他们父亲耶杜顿的指挥下；耶杜顿用琴说预言，称谢、赞美耶和华[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本在这里列出五个名字，却接着说“六人”。有人认为名单漏了一个儿子的名字，也有人认为这里把耶杜顿本人计算在内。
    reason: textual_variant
  - marker: b
    text: 或译：“耶杜顿用琴说预言，为要称谢、赞美耶和华。”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִידוּתוּן
  choice: 属耶杜顿的
  rationale: 前缀 לְ 在这里引出名单中的下一个班组；“属耶杜顿的”既保留归属关系，也符合中文名录体裁。
- source_word: בְּנֵי יְדוּת֡וּן
  choice: 耶杜顿的儿子
  rationale: 保留原文的亲属称谓；在本章语境中，也可涵盖其家族中参与圣殿音乐职分的人。
- source_word: גְּדַלְיָהוּ וּצְרִי וִישַׁעְיָהוּ חֲשַׁבְיָהוּ וּמַתִּתְיָהוּ
  choice: 基大利、洗利、以赛亚、哈沙比雅和玛他提雅
  rationale: 按现代中文圣经人名的通行译法音译，同时保留原名单次序。
- source_word: שִׁשָּׁה
  choice: 共六人
  rationale: 马所拉文本明确写作“六”，虽前面只列出五个名字，正文不作调和，并以脚注说明。
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: 由他们的父亲……指挥
  rationale: 该惯用语字面为“在他们父亲手下”，在音乐与行政语境中表示受监督或指挥；此译自然传达其功能。
- source_word: בַּכִּנּוֹר
  choice: 弹琴
  rationale: כִּנּוֹר 指古代弦乐器，通常可译为“里拉琴”；正文用普通读者熟悉的“琴”，并以“弹”表达其工具用法。
- source_word: הַנִּבָּא
  choice: 说预言
  rationale: 保留 נבא 的先知性用语，不将圣殿音乐中的这种活动弱化为一般演奏或歌唱。
- source_word: עַל הֹדוֹת וְהַלֵּל
  choice: 称谢、赞美
  rationale: 保留两个并列的敬拜行为；介词 עַל 在此可表示内容或目的，主要译文采用自然的并列表达，脚注提示目的性译法。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中对神圣四字名 יהוה 的通行专名译法。
theological_decisions:
- issue: 圣殿音乐语境中“说预言”的含义
  choice: 正文保留“说预言”
  alternative: 受感动演奏；用歌声传达预言
  rationale: 历代志作者明确用先知性动词描述圣殿乐师的活动。保留“说预言”可维持原文的神学张力，不把它化约为普通音乐表演。
- issue: 称谢和赞美与说预言之间的关系
  choice: 译作“说预言，称谢、赞美耶和华”
  alternative: 说预言，为要称谢、赞美耶和华
  rationale: 原文介词短语既可理解为预言性音乐的内容，也可理解为其目的；正文不强加明确的目的关系，并在脚注中保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的名录体中文。保留原文“五名而称六人”的不协调，也保留音乐、预言与称谢赞美之间的语义张力。
