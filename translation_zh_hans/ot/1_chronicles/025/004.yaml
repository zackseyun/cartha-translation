base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/004.yaml
  text: 'To Heman: the sons of Heman: Bukkiah[a], Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir[c][b], Mahazioth.'
translation:
  language: zh_hans
  text: 属希幔的：希幔的儿子有布基雅、玛探雅、乌薛、细布业[a]、耶利摩[b]、哈拿尼雅、哈拿尼、以利亚他、基大利提、罗幔提·以谢[c]、约施比加沙、玛罗提、何提、玛哈秀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细布业”也可译作“书巴业”。
    reason: lexical_alternative
  - marker: b
    text: “耶利摩”也可按异体音译作“耶利末”。
    reason: lexical_alternative
  - marker: c
    text: “基大利提”和“罗幔提·以谢”等名称的希伯来语形式也可使人联想到一句话，意思近似“我使……为大，又高举帮助”；但在这里按名录的上下文译作人名。
    reason: alternative_reading
lexical_decisions:
- source_word: לְהֵימָן
  choice: 属希幔的
  rationale: 介词 לְ 在本章的班次名录中表示归属或分配；“属希幔的”既符合上下文，也比单纯译作“给希幔”更自然。
- source_word: בְּנֵי הֵימָן
  choice: 希幔的儿子
  rationale: בְּנֵי 的基本义是“儿子们”，在家谱和名录中也可包含后裔；这里直接列出希幔的子嗣，故保留“儿子”。
- source_word: שְׁבוּאֵל
  choice: 细布业
  rationale: 按现代中文圣经人名的通行形式音译；希伯来语辅音也容许与“书巴业”相联系的异体形式，另在脚注说明。
- source_word: וִירִימוֹת
  choice: 耶利摩
  rationale: 按希伯来语 יְרִימוֹת 音译，并在中文中采用简洁、通行的人名形式；词首的 וְ 是连接词，已由名单中的顿号关系表达。
- source_word: גִדַּלְתִּי
  choice: 基大利提
  rationale: 该形式在别处可被理解为动词“我使……为大”，但本节处于儿子名录中，最自然地作为专名音译。
- source_word: וְרֹמַמְתִּי עֶזֶר
  choice: 罗幔提·以谢
  rationale: 在名录语境中将两个成分作为复合人名处理；间隔号清楚显示这是一个复合名字，同时不抹去其词形可能产生的短语联想。
theological_decisions:
- issue: 本节若干具有动词或普通名词外形的词应视为人名，还是连读为一句有意义的话
  choice: 将“希幔的儿子”之后的整串词都译作人名
  alternative: 把“基大利提、罗幔提·以谢”等部分连读成类似“我使……为大，又高举帮助”的短语
  rationale: 紧邻上下文是圣殿乐班人员及其子孙的名录，而且本节句法是在“希幔的儿子”之后列名。译作人名最符合篇章功能；脚注仍保留另一种可能，避免把真实的词形张力完全消除。
translation_notes:
  register: 采用现代、庄重而易读的名录体。开头用“属希幔的”体现本章分班归属；各专名采用中文圣经读者较熟悉的音译形式，复合名以间隔号标示。
