  yaml_path: translation/ot/1_chronicles/025/014.yaml
  text: The seventh fell to Jesharelah[a]; his sons and his brothers were twelve.
translation:
  language: zh_hans
  text: 第七签归耶萨利拉[a]；他的儿子和弟兄共十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“第七，耶萨利拉，他的儿子和弟兄，十二。”正文的“签归”是根据上下文反复出现的抽签分班格式补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁבִעִי
  choice: 第七签
  rationale: 序数词在抽签分班的名单中作名词用；结合上下文，明确译出所指的“签”，使现代汉语自然清楚。
- source_word: יְשַׂרְאֵלָה
  choice: 耶萨利拉
  rationale: 这是人名，按希伯来语音译；采用较贴近原文读音且适合现代汉语的形式。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 原词明确指男性后代，保留其性别特指。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: 原词通常意为“兄弟”；在此名单语境中也可能泛指同族或同组的男性成员，但正文保留较直接的含义。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 这是该组人数的总数；补出量词“人”并用“共”表达合计关系，符合现代汉语。
- source_word: '[上下文隐含的抽签分配公式]'
  choice: 归
  rationale: 本节希伯来文本没有动词，但上下各节的抽签分配格式表明此处省略了“抽中/归给”的意思；“归”简洁地补足这一关系。
