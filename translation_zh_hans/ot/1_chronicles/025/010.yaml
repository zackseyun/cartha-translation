lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: 第三签
  rationale: 带定冠词的序数词在本段抽签分组的连续名单中表示“第三（签）”。虽然“签”在本节希伯来文中省略，但上下文明示，补出后中文更自然清楚。
- source_word: זַכּוּר
  choice: 撒刻
  rationale: 人名按现代中文圣经常见译名音译，指第三班的领班。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: בנים带第三人称阳性单数后缀，明确指“他的儿子”，不泛化为“儿女”。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: אחים带第三人称阳性单数后缀，直译为“他的弟兄”；中文并列结构中承接前面的“他的”，无需重复领属语。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 原文为无系词的数目陈述，表示这一组总计十二人；补“共”和量词“人”符合自然中文，同时保留名册式的简洁。
