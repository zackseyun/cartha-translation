base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
translation:
  language: zh_hans
  text: 大卫和军队的众首领把亚萨、希幔和耶杜顿的子孙[a]分别出来，叫他们担任服事；他们用琴、瑟和钹说预言[b]。从事这项服事的人员数目如下：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“儿子们”；这里也可指后代或所属班次的成员。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为：“那些作先知的，用琴、瑟和钹。”原文可将这里看作对亚萨、希幔和耶杜顿等人的说明。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּבְדֵּל
  choice: 分别出来
  rationale: 使役式在这里表示为特定职责选出、分别；这一译法保留其组织与奉献语境，又不额外引入正式任命的含义。
- source_word: שָׂרֵי הַצָּבָא
  choice: 军队的众首领
  rationale: צָבָא通常指军队，שָׂרֵי指首领或长官；直译在本段由军事领袖参与圣殿事务安排的语境中仍然通顺。
- source_word: לַעֲבֹדָה
  choice: 担任服事
  rationale: עֲבֹדָה在礼仪语境中指有组织的服事或职务；采用现代中文自然表达，不擅自把原文未明说的“圣殿”加入正文。
- source_word: לִבְנֵי אָסָף וְהֵימָן וִידוּתוּן
  choice: 亚萨、希幔和耶杜顿的子孙
  rationale: בְּנֵי字面为“儿子们”，但在家族与班次语境中可涵盖后代或所属成员；正文用“子孙”，脚注保留较形式对应的译法及其范围。
- source_word: הנביאים
  choice: 说预言
  rationale: 按本节常见的马所拉读音，该词是表示持续或职责性活动的分词，与三类乐器相连；用动词短语准确传达其先知性活动，同时不解释这种活动的具体内容。
- source_word: בְּכִנֹּרוֹת בִּנְבָלִים וּבִמְצִלְתָּיִם
  choice: 用琴、瑟和钹
  rationale: 保留两类弦乐器与钹的区分；“琴、瑟、钹”是简洁、庄重且易识别的现代中文乐器名称。
- source_word: וַיְהִי מִסְפָּרָם
  choice: 人员数目如下：
  rationale: 该句引出后续名单，中文以“如下”加冒号清楚保留其向后承接的结构。
- source_word: אַנְשֵׁי מְלָאכָה לַעֲבֹדָתָם
  choice: 从事这项服事的人员
  rationale: 表达这些人承担指定工作的意思，不把מְלָאכָה过度解释为特殊技艺，也保留עֲבֹדָה的礼仪服事色彩。
theological_decisions:
- issue: הנביאים所指的是“先知”这一称谓，还是借音乐进行的先知性活动
  choice: 正文译为“他们用琴、瑟和钹说预言”
  alternative: “那些作先知的，用琴、瑟和钹”
  rationale: 原文把该分词与乐器紧密相连，动词式中文最自然，也明确保留音乐与先知性活动之间的联系；脚注提示名词性理解，但不进一步界定这种“说预言”的内容或方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“服事”保留礼仪职责的含义；乐器沿用清楚简洁的“琴、瑟、钹”。句末冒号表明本节语法上引出下文名单。
