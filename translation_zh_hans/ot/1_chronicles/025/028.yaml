lexical_decisions:
- source_word: לְ/אֶחָד וְ/עֶשְׂרִים
  choice: 第二十一签
  rationale: 本章逐一列出抽签次序。介词לְ表示该次序所归属的对象；原文直译为“一个和二十”，现代汉语按序数表达为“第二十一”。“签”虽未在本节重述，却由本段明确的抽签语境补出，使名单句式自然清楚。
- source_word: לְ/הוֹתִיר
  choice: 归何提
  rationale: הוֹתִיר是人名，按普通话音译为“何提”。前缀לְ与前面的次序结构合并译为“归”，表明第二十一签分给何提。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: בָּנִים在此特指儿子，而非泛指儿女；保留名单和家族语境中的性别信息。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: אָח通常指兄弟；在此类名册中也可能涵盖同族或同组成员，但原文仍采用亲属称谓，因此译作“弟兄”，不将范围暗自扩大。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 数字表示何提的儿子和弟兄这一组的总人数。补入“共”和量词“人”，符合现代汉语表达，并避免误解为儿子十二人、弟兄另计。
