lexical_decisions:
- source_word: לִשְׁלֹשָׁה וְעֶשְׂרִים
  choice: 第二十三签归
  rationale: 本章按抽签次序列出各班；前缀 לְ 表示分派归属。原文虽未在本节重复“签”，但上下文明确，补出“签”可使现代汉语自然并准确表达其功能。
- source_word: לְמַחֲזִיאוֹת
  choice: 玛哈秀
  rationale: 这是人名，按希伯来语读音音译；采用简洁、适合现代普通话的译名。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 原词特指男性后代，名单语境中直译为“儿子”。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: 原词在此指他的兄弟；“弟兄”是庄重且适合圣经名单语体的概括表达，并不限定年龄长幼。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 这是玛哈秀本人之外所列儿子与弟兄的合计人数；加“共”和量词“人”符合现代汉语表达。
