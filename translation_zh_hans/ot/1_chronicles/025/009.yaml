base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
translation:
  language: zh_hans
  text: 第一签抽出，分给亚萨的约瑟[a]；第二签分给基大利[b]；他和他的弟兄、儿子，共十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“归亚萨，归约瑟。”结合上下文，约瑟应是亚萨一系的成员。
    reason: 保留两个连续介词短语的形式，并说明正文所采用的上下文关联。
  - marker: b
    text: “基大利”所译的希伯来文名字是“基大利雅胡”（Gedalyahu）的完整形式。
    reason: 说明原文人名带有 -yahu 结尾，而正文采用现代中文圣经中较熟悉的名称。
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: 签抽出来
  rationale: 直译为“签出来了”；在抽签语境中，“签抽出来”既保留原文的具体意象，也符合现代汉语表达。
- source_word: הָרִאשׁוֹן
  choice: 第一签
  rationale: 原文以序数词标明抽签次序；汉语将“第一”与“签”合说更自然。
- source_word: לְאָסָף לְיוֹסֵף
  choice: 归亚萨一系的约瑟
  rationale: 两个连续的介词短语字面为“归亚萨，归约瑟”。结合本章按亚萨家族成员分班的名册语境，译文表明约瑟属于亚萨一系，同时以脚注保留原文较为突兀的结构。
- source_word: גְּדַלְיָהוּ הַשֵּׁנִי
  choice: 第二签归基大利
  rationale: 原文是省略动词的名册式表达；补出“签归”使汉语清楚，并保留第二次分配的次序。
- source_word: וְאֶחָיו וּבָנָיו
  choice: 他的弟兄、儿子
  rationale: 分别保留“弟兄”和“儿子”的具体含义，不泛化为亲属或儿女。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 该数目说明以基大利为首的整组人数；补出“共”和量词“人”符合汉语，但不改变计数范围。
theological_decisions:
- issue: לְאָסָף לְיוֹסֵף 两个介词短语之间的关系
  choice: 正文译作“归亚萨一系的约瑟”
  alternative: “归亚萨，归约瑟”
  rationale: 上下文显示约瑟是亚萨家族中抽得第一签的人；正文采用自然且合乎名册语境的表达，脚注同时交代原文可直译的形式，避免掩盖其句法张力。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留名册体的紧凑节奏；在必要处补出“签归”“共”“人”，使省略动词的希伯来语结构在中文中清楚可读。
