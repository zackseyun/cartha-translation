lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: 第六签
  rationale: 定冠词加序数词在本段按抽签编班的名单中是省略表达。中文若只说“第六”略显悬空，因此补出上下文明确的“签”，同时用脚注说明希伯来文的简略形式。
- source_word: בֻקִּיָּהוּ
  choice: 布基雅
  rationale: 按现代中文圣经人名的通行音译处理，不翻译名字含义。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 原词明确指男性后代“儿子”，符合本段家族编班的语境。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: 直译为“弟兄”，保留该词可指亲兄弟或同族男性成员的语义范围，不擅自缩窄为“兄弟”或扩展为“亲属”。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 数字表示这一组的总人数；补出“共”和量词“人”使现代汉语自然清楚，而不改变原文简洁的名单体裁。
