  text: 第十签[a]归示每；他的儿子和弟兄共十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“第十，示每”；按上下文，指“第十签归示每”。
    reason: 说明“签归”是依据本章抽签分派的上下文补足，原文此处采用简略的名单式表达。
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: 第十签
  rationale: 这是带定冠词的序数词，承接上下文按抽签排列的次序。中文若只译“第十”略显残缺，因此补出语境已明确的“签”。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: בנים在此指男性后代，直译为“儿子”，不泛化为“儿女”。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: אחים的通常含义是“弟兄”；在本名单中也可能泛指同族男性或同组成员，但正文保留最直接的称谓。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 该数词表示示每的儿子和弟兄合计十二名；补“共”和量词“人”使现代汉语自然清楚。
