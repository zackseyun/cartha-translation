lexical_decisions:
- source_word: לְ/עֶשְׂרִים
  choice: 第二十签
  rationale: 介词לְ在本章抽签分组的名单格式中表示归属，עֶשְׂרִים在序列中表示“第二十”。正文补出上下文所隐含的“签”，使现代汉语自然清楚。
- source_word: לֶ/אֱלִיָּתָה
  choice: 以利亚他
  rationale: 按希伯来语专名音译；其前的介词לֶ所表达的分配关系已由“第二十签”这一名单格式体现。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: בֵּן的复数加第三人称阳性单数后缀，在此指他的男性后代，译作“他的儿子”准确且符合名册语境。
- source_word: וְ/אֶחָיו
  choice: 和弟兄
  rationale: אָח的复数在此最自然地指同族或实际的兄弟；“弟兄”保留希伯来语的亲属称谓，不无故扩大为“亲族”。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 该基数词给出本组总人数。汉语补入“共”和量词“人”，清楚表达无动词的希伯来语名单句式。
