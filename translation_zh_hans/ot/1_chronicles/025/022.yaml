- source_word: לִירֵמוֹת
  choice: 归耶利摩
  rationale: 前缀 ל 在这份名单中表示分配或归属；“归”自然传达这一关系。人名采用现代中文圣经中清楚、通行的音译“耶利摩”。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 希伯来文明确指男性后代，直译为“儿子”。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: 该词的直接含义是“他的弟兄”；在谱系或组织语境中也可能泛指男性亲属或同族成员，但正文保留最直接的表达。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 这是与耶利摩的儿子和弟兄相关的总人数；补出“共”和量词“人”，使现代汉语自然清楚。
