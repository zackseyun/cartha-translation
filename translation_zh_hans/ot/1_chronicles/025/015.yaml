  text: the eighth to Jeshaiah[a], his sons and his brothers, twelve.
translation:
  language: zh_hans
  text: 第八[a]归耶筛亚；他和他的儿子、弟兄共十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译为“第八归耶筛亚”。本章上下文表明这是抽签分配的名单；“签”是由上下文隐含的，本节原文没有这个词。
    reason: 说明“第八”在本章抽签名单中的语境，并保留未补入“签”的直译表达。
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: 第八签
  rationale: 这是本章按抽签次序排列班次的名单。原文只明说“第八”，但汉语若仅译“第八归……”略显残缺；据上下文补出“签”，使意思自然清楚，并以脚注说明该词为上下文所隐含。
- source_word: יְשַׁעְיָהוּ
  choice: 耶筛亚
  rationale: 按现代中文圣经人名音译惯例处理该专名；保留其作为个人名字的功能，不翻译名字含义。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: בנים在此具体指男性后代，译作“儿子”比泛称“儿女”更准确。
- source_word: וְאֶחָיו
  choice: 弟兄
  rationale: אחים的直接意义是“兄弟”；名单语境可能涵盖同族或同班成员，但没有充分理由在正文中扩大解释，故采用自然而略具礼仪色彩的“弟兄”。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 该数词说明这一组的总人数。原文省略系词；中文补“共”和量词“人”，清楚表达合计而不改变内容。
theological_decisions: []
