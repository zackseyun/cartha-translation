base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/005.yaml
  text: All these were sons of Heman[a], the king’s seer in the words of God, to exalt the horn[b]. And God gave Heman fourteen sons and three daughters.
translation:
  language: zh_hans
  text: 这些人都是希幔的儿子。希幔是王的先见；他的职分关乎上帝的话语[a]，为要高举角[b]。上帝赐给希幔十四个儿子和三个女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文结构紧凑，也可理解为“在上帝的事上”或“借着上帝的话语”。它描述希幔的先见职分与上帝的启示有关。
    reason: alternative_reading
  - marker: b
    text: 也可译作“举起角”。“角”在这里是比喻，可表示力量、尊荣或崇高的地位；原文没有明说是谁的角。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: 这些人全是
  rationale: 自然地概括上文所列的人，同时保留“全都”的强调。
- source_word: חֹזֵה
  choice: 先见
  rationale: 该词指领受启示性洞见的人；“先见”保留了历代志中王室与启示职分的色彩，也避免以较宽泛的“先知”取代原词。
- source_word: בְּדִבְרֵי הָאֱלֹהִים
  choice: 关乎上帝的话语
  rationale: 原文结构紧凑，可能表示希幔的先见职分涉及上帝的话语，也可能表示他借着上帝的话语履行职分。“关乎”在现代汉语中较自然，同时借脚注保留其他可能。
- source_word: לְהָרִים קָרֶן
  choice: 为要高举角
  rationale: 保留原文目的表达和“角”的圣经意象，不擅自确定是谁的角，也不把它缩减为单一的抽象含义。
- source_word: קָרֶן
  choice: 角
  rationale: “角”在原文中可象征力量、尊荣或崇高地位；正文保留比喻，脚注予以说明。
- source_word: וַיִּתֵּן הָאֱלֹהִים לְהֵימָן
  choice: 上帝赐给希幔
  rationale: 准确表达上帝把儿女赐给希幔，且符合自然、庄重的现代汉语。
- source_word: בָנִים ... וּבָנוֹת
  choice: 儿子……女儿
  rationale: 直接保留原文对男女后代的明确区分。
- source_word: אַרְבָּעָה עָשָׂר וּבָנוֹת שָׁלֹשׁ
  choice: 十四个儿子和三个女儿
  rationale: 按原文准确呈现人数，并采用自然的汉语数量表达。
theological_decisions:
- issue: “王的先见”与“上帝的话语”之间的关系
  choice: 译作“王的先见，关乎上帝的话语”，理解为希幔的先见职分与上帝的启示有关。
  alternative: “在上帝的事上作王的先见”或“借着上帝的话语作王的先见”。
  rationale: 希伯来语介词短语含义紧凑，不能确定只表达范围、内容还是凭借。正文采用可读而不过度限定的表达，并在脚注保留歧义。
- issue: “高举角”的含义及所指
  choice: 保留“高举角”的比喻，也不补明角属于谁。
  alternative: 意译为“增添力量”“使他得尊荣”或“提升地位”。
  rationale: 原文没有明说角的所属，而“角”可同时承载力量、尊荣和崇高地位等意象；保留比喻可避免加入过窄的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“先见”和“高举角”保留历代志的启示职分用语与圣经比喻；两处较难的希伯来语表达均以脚注说明，没有在正文中消除原文的歧义。
