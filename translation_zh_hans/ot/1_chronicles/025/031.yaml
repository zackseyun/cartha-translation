  text: for the twenty-fourth[a], Romamti-ezer, his sons and his brothers, twelve.
translation:
  language: zh_hans
  text: 第二十四[a]，是罗幔提以谢；他的儿子和弟兄共十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“给第二十四”；本段中指抽出的第二十四签或第二十四班。
    reason: 说明原文省略了由上下文可知的“签”或“班”，并保留介词所表达的分派关系。
lexical_decisions:
- source_word: לְאַרְבָּעָה וְעֶשְׂרִים
  choice: 第二十四
  rationale: 介词לְ表示抽签分派的归属，复合数词在本段连续编号的语境中具有序数意义。原文此处未明说“签”或“班”，因此正文不补出，脚注说明。
- source_word: לְרוֹמַמְתִּי עָזֶר
  choice: 是罗幔提以谢
  rationale: 这是人名，按希伯来语音译；补入“是”使中文名单体例自然，并体现该签所归属的对象。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: בֵּן的复数附属形式明确指“他的儿子”，不泛化为“儿女”。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: אָח的复数附属形式基本义为“他的兄弟”；此处采用较庄重且可涵盖同族男性成员语感的“弟兄”，不武断改释为“亲族”或“同工”。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 这是全组人数的基数；加入“共”和量词“人”，清楚表达罗幔提以谢的儿子与弟兄合计十二人，符合本章名册语境。
