  text: The fifth was Nethaniah[a]; his sons and his brothers were twelve.
translation:
  language: zh_hans
  text: 第五签归尼探雅[a]；尼探雅和他的儿子、弟兄共十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第五是尼探雅；尼探雅和他的儿子、弟兄共十二人。”原文未明说“签”或“归”，这些词是根据上下文补出的。
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: 第五签归给了
  rationale: 该带定冠词的序数词在本章抽签分班的名录中作省略表达。希伯来文本本节未明说“签”或“归给”，但中文若只说“第五是尼探雅”较不自然，故按上下文补出，并以脚注说明。
- source_word: נְתַנְיָהוּ
  choice: 尼探雅
  rationale: 按现代中文圣经人名的常见音译处理；这是专名，不翻译其词源含义。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: בֵּן 的阳性复数并带第三人称阳性单数后缀，此处明确指“他的儿子”。
- source_word: וְאֶחָיו
  choice: 弟兄
  rationale: אָח 的复数带后缀通常指兄弟；此名录语境没有必要扩大解释为一般亲属。中文在与“他和他的儿子”并列时省去重复的“他的”，仍清楚表达所属关系。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 该数词概括尼探雅及其儿子、弟兄组成的一班总人数；补“共”和量词“人”使现代中文清楚自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。主句按本章抽签分班的上下文补足省略成分；分号保留名单条目的结构层次。“他和他的儿子、弟兄共十二人”明确将尼探雅本人计入十二人的总数，符合本章重复格式。
