  text: 'For the twenty-second[a], to Giddalti: his sons and his brothers, twelve.'
translation:
  language: zh_hans
  text: 第二十二签[a]归基大利；他的儿子和弟兄，共十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“第二十二归基大利；他的儿子和弟兄，共十二人。”希伯来文的名单体例十分简略，“签”是根据上下文补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנַיִם וְעֶשְׂרִים
  choice: 第二十二签
  rationale: 本章反复列出抽签所得的班次；希伯来文直译为“给第二十二”，但“签”由上下文补足。正文补出“签”，使现代汉语清楚自然，同时以脚注说明原文的省略式表达。
- source_word: לְגִדַּלְתִּי
  choice: 归基大利
  rationale: 前缀 ל 在此表示该签或班次分配给此人；“归基大利”符合中文分配名单的表达，也保留归属含义。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: בֵּן 的复数在此明确指男性后代，译作“儿子”比泛称“儿女”准确。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: אָח 的通常含义是兄弟；中文“弟兄”可自然统称兄与弟，也适合庄重的名单语体，无需扩大为“亲族”。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 句末数字说明这一组的总人数。“共……人”补出汉语所需的量词及合计关系，但不改变原文数字。
