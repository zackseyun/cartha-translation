  text: כָּל אֵ֣לֶּה עַל יְדֵי֩ אֲבִי/הֶ֨ם בַּ/שִּׁ֜יר בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ נְבָלִ֣ים וְ/כִנֹּר֔וֹת לַ/עֲבֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים עַ֚ל יְדֵ֣י הַ/מֶּ֔לֶךְ אָסָ֥ף וִ/ידוּת֖וּן וְ/הֵימָֽן־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/006.yaml
  text: 'All these were under the direction of their father in the music of the house of Yahweh[a], with cymbals, harps, and lyres, for the service of the house of God, under the direction of the king: Asaph, Jeduthun[c][b], and Heman.'
translation:
  language: zh_hans
  text: 这些人都在他们父亲的指导下，在耶和华的殿中从事音乐[a]，使用钹、瑟和琴[b]，为上帝的殿供职；他们都在王的指导下——亚萨、耶杜顿和希幔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从事音乐”也可译作“歌唱”或“奏乐”。
    reason: lexical_alternative
  - marker: b
    text: “瑟”和“琴”所指的两种古代弦乐器，其具体形制及与现代乐器的对应并不确定。
    reason: cultural_note
lexical_decisions:
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: 在他们父亲的指导下
  rationale: 该习语字面涉及“手”，在此音乐职任的语境中表示指导或监督；此译法自然地表达父亲对各组人员的带领。
- source_word: בַּשִּׁיר
  choice: 歌唱
  rationale: שִׁיר 可指歌、歌唱或音乐；本节与圣殿乐器和职事相连，译作动词性“歌唱”符合中文表达，同时以脚注保留“奏乐”的可能。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בַּיִת 字面为“房屋、家”，在此明确指敬拜场所；中文“殿”自然简洁。将四字神名译作“耶和华”，采用现代中文圣经读者熟悉的专名形式。
- source_word: בִּמְצִלְתַּיִם נְבָלִים וְכִנֹּרוֹת
  choice: 用钹、瑟和琴
  rationale: 介词表示使用乐器。מְצִלְתַּיִם 可确定为钹；נֵבֶל 与 כִּנּוֹר 是两种古代弦乐器，具体形制及现代对应不确定，故采用中文圣经传统中可区分且简洁的“瑟、琴”，并加脚注说明。
- source_word: לַעֲבֹדַת בֵּית הָאֱלֹהִים
  choice: 为上帝的殿供职
  rationale: עֲבֹדָה 在礼仪语境中指服务、职务；“供职”既表达承担圣殿职事，又不引入后世教会制度术语。
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: 在王的指导下
  rationale: 重复使用的习语表示王的指导、监管或授权；与前文“在他们父亲的指导下”对应。
- source_word: אָסָף וִידוּתוּן וְהֵימָן
  choice: 亚萨、耶杜顿和希幔
  rationale: 按现代简体中文圣经中通行的人名音译处理。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文明确使用专名 יְהוָה。译作“耶和华”保留其专名性质，也最便于普通现代中文读者识别；不以“上主”替代，以免掩盖原文在本节中与 אֱלֹהִים 的用词区别。
- issue: 末句 עַל יְדֵי הַמֶּלֶךְ 与三个人名的句法关系
  choice: 将亚萨、耶杜顿和希幔视为在王指导下的人
  alternative: 将三个人名解释为与王共同实施指导者
  rationale: 希伯来语词序较紧缩，可能产生句法张力。结合上文各人受其父亲管理以及全章的组织结构，此处较自然地表示三位父亲受王指导；通过“则”使层级关系清楚，但不扩充为“奉王命”等更强的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿”“供职”保留圣殿礼仪语境但避免生硬直译。正文需补入脚注标记[b]：应排为“用钹、瑟和琴[b]”。
