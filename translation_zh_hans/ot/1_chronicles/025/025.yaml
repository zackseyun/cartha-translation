  text: 第十八归哈拿尼；他的儿子和弟兄共十二人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁמוֹנָה עָשָׂר
  choice: 第十八签归
  rationale: 介词 לְ 在本章抽签分班的重复结构中表示归属。原文此处未明说“签”，但上下文清楚地省略了该词；正文补出可使现代汉语自然明了，并以脚注注明。
- source_word: לַחֲנָנִי
  choice: 哈拿尼
  rationale: 按希伯来语专名音译，指该班的领班者。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 原词明确指“儿子”，保留名册中的亲属称谓，不泛化为“子女”。
- source_word: וְאֶחָיו
  choice: 和弟兄
  rationale: 直译亲属词“弟兄”；此处没有充分理由扩展为“亲属”或“同伴”。
- source_word: שְׁנֵים עָשָׂר
  choice: 共十二人
  rationale: 数字表示哈拿尼的儿子和弟兄合计的人数；补出“共”和量词“人”符合现代汉语名册表达。
