lexical_decisions:
- source_word: פִּלֶגֶשׁ
  choice: 妾
  rationale: 指处于从属地位、但获承认的婚姻或性结合中的女子；“妾”是简洁、自然且符合家谱语境的现代汉语对应词。
- source_word: כָּלֵב
  choice: 迦勒
  rationale: 人名，采用现代中文圣经读者熟悉的通行译名。
- source_word: מַעֲכָה
  choice: 玛迦
  rationale: 人名，按希伯来语形式并参照中文传统译名音译。
- source_word: יָלַד
  choice: 生了
  rationale: 该动词在家谱中可泛指生育或产生后代；本句明确以女性玛迦为主语，因此译作“生了”最自然，也保留了直接生育的通常含义。
- source_word: שֶׁבֶר
  choice: 示别
  rationale: 人名，按希伯来语音译，并采用中文传统常见形式。
- source_word: וְאֶת
  choice: 和
  rationale: וְ连接第二个直接宾语，אֶת为宾语标记，现代汉语无需另译宾语标记。
- source_word: תִּרְחֲנָה
  choice: 特哈拿
  rationale: 人名，按希伯来语辅音与元音形式音译，并采用中文传统常见形式。
