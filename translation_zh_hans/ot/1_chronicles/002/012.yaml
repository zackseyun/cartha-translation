  text: 波阿斯生俄备，俄备生耶西。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בֹעַז
  choice: 波阿斯
  rationale: 专名按现代中文圣经通行译名音译；前置连词在本节作为独立引文时不译，以免出现突兀的句首“又”。
- source_word: הוֹלִיד
  choice: 生
  rationale: 在父系家谱语境中，希伯来语使役形表示生育、成为某人的父亲；中文家谱惯用“生”，简洁自然，并保留谱系关系。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，现代汉语没有对应词，其句法功能由语序体现。
- source_word: עוֹבֵד
  choice: 俄备
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וְ/עוֹבֵד
  choice: 俄备
  rationale: 专名采用通行译法；连接词的关系由中文逗号与并列句式自然表达，无须机械译为“又”或“和”。
- source_word: הוֹלִיד
  choice: 生
  rationale: 与前一处保持一致，清楚呈现连续的父系家谱关系。
- source_word: יִשָׁי
  choice: 耶西
  rationale: 采用现代中文圣经中通行的人名译法。
