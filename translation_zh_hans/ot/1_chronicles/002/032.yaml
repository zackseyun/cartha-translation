  text: וּ/בְנֵ֤י יָדָע֙ אֲחִ֣י שַׁמַּ֔י יֶ֖תֶר וְ/יוֹנָתָ֑ן וַ/יָּ֥מָת יֶ֖תֶר לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
translation:
  language: zh_hans
  text: 沙买的兄弟雅大的儿子是益帖和约拿单。益帖死了，没有儿子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“益帖死了，没有儿子”，即他死时没有留下儿子。
    reason: 说明希伯来文省略式表达，并避免把“没有儿子”误解为必然“没有任何子女”。
lexical_decisions:
- source_word: וּבְנֵי
  choice: 儿子是
  rationale: בְנֵי 是“儿子”的复数构造形式，用来引出家谱中的下一支；句首连词 וּ 在中文家谱叙述中不必机械译作“又”。
- source_word: יָדָע
  choice: 雅大
  rationale: 按希伯来语专名 יָדָע 音译，并采用现代中文圣经人名的常见形式。
- source_word: אֲחִי שַׁמַּי
  choice: 沙买的兄弟
  rationale: אֲחִי 是“……的兄弟”，在这里明确说明雅大与沙买的兄弟关系；按中文语序置于“雅大”之前。
- source_word: יֶתֶר
  choice: 益帖
  rationale: 按该希伯来专名的常见中文形式音译，两处保持一致。
- source_word: וְיוֹנָתָן
  choice: 和约拿单
  rationale: 保留连接词“和”，专名按现代中文圣经传统译作“约拿单”。
- source_word: וַיָּמָת
  choice: 死了
  rationale: 该叙事形式陈述家谱中的后续事件；“死了”自然、直接，也符合原文简洁语气。
- source_word: לֹא בָנִים
  choice: 没有儿子
  rationale: 原文是省略式短语，直译为“没有儿子”；此处关注男性后裔，不宜扩大为“没有孩子”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语家谱体。调整修饰语次序为“沙买的兄弟雅大”，以清楚表达亲属关系；保留“没有儿子”而不译成“无后”，因为后者可能过度推断他没有女儿或任何后代。
