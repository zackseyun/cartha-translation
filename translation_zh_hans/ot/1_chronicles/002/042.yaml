  text: וּ/בְנֵ֤י כָלֵב֙ אֲחִ֣י יְרַחְמְאֵ֔ל מֵישָׁ֥ע בְּכֹר֖/וֹ ה֣וּא אֲבִי זִ֑יף וּ/בְנֵ֥י מָרֵשָׁ֖ה אֲבִ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
translation:
  language: zh_hans
  text: 耶拉篾的兄弟迦勒的儿子如下：长子米沙，他是西弗之父[a]；还有希伯仑之父玛利沙的众子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 历代志中的“……之父”不一定只指生父，也可以指祖先、宗族首领，或与某地有关的创建者。
    reason: cultural_note
  - marker: b
    text: 本句末尾的希伯来语句法较难确定。马所拉文本直译为“还有玛利沙的众子，希伯仑之父”。有些人把“希伯仑之父”理解为修饰玛利沙，如正文所译；也有人保留原文较为突兀的措辞。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: 儿子如下
  rationale: 保留历代志家谱中“某人的儿子”这一固定表达；上下文中可能涵盖后裔，但正文不将其泛化为“后代”。词首连接词融入汉语的承接语气，不机械译作“并且”。
- source_word: כָלֵב
  choice: 迦勒
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֲחִי יְרַחְמְאֵל
  choice: 耶拉篾的兄弟
  rationale: 按原文同位关系说明迦勒与耶拉篾的关系。
- source_word: מֵישָׁע
  choice: 米沙
  rationale: 按希伯来语人名音译，并采用通行中文形式。
- source_word: בְּכֹרוֹ
  choice: 长子
  rationale: בכור指头生的儿子；“长子”在现代汉语家谱语境中自然，也保留排行与身份意味。
- source_word: הוּא
  choice: 他是
  rationale: 保留独立代词对米沙的复指，并自然引出后面的身份说明。
- source_word: אֲבִי זִיף
  choice: 西弗之父
  rationale: 直译“父”以保留其可能指生父、祖先、宗族首领或地方创建者的宽泛含义；“之父”适合简洁的家谱文体。
- source_word: וּבְנֵי מָרֵשָׁה
  choice: 还有……玛利沙的众子
  rationale: 保留“玛利沙的儿子们”这一复数家谱公式，并用“还有”衔接前项。
- source_word: אֲבִי חֶבְרוֹן
  choice: 希伯仑之父
  rationale: 正文将该短语修饰玛利沙，与马所拉文本一种自然理解及咨询层译文一致；脚注保留末句句法上的真实困难。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而现代的家谱文体。“如下”帮助普通读者识别后面是名单内容；“之父”比口语化的“父亲”更适合家谱，同时借脚注说明其语义范围。末句不作文本校勘，正文选择较自然的修饰关系，并在脚注中明确保留原文歧义。
