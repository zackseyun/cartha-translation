base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
translation:
  language: zh_hans
  text: 后来，希斯仑与基列的父亲[c]玛吉的女儿同房[a]，并娶了她[b]；当时他六十岁。她为他生了西割。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“来到……那里”。希伯来语这一表达用于男女关系时，常含蓄地指婚姻或性结合。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“取了她”，这里通常指娶她为妻。
    reason: lexical_alternative
  - marker: c
    text: 家谱中的“父亲”也可指祖先或奠基者，不一定专指直接生父。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: 后来
  rationale: 表示家谱叙事中随后发生的事；“后来”自然、简洁，并保留时间上的先后关系。
- source_word: בָּא אֶל
  choice: 与……同房
  rationale: 该希伯来语表达用于男子与女子时，常含婚姻或性结合之意。“同房”是现代中文中庄重而含蓄的说法；另以脚注保留“来到……那里”这一较字面的可能译法。
- source_word: בַּת מָכִיר
  choice: 玛吉的女儿
  rationale: 准确表达所属关系，也符合现代中文家谱叙述的自然语序。
- source_word: אֲבִי גִלְעָד
  choice: 基列的父亲
  rationale: 直译 אָב 的基本含义，同时用脚注说明家谱语境中也可能指祖先或奠基者，避免擅自限定。
- source_word: לְקָחָהּ
  choice: 娶了她
  rationale: לקח 以女子为宾语时通常表示娶妻；中文若直译为“取了她”不够自然，也容易误解。“娶了她”清楚表达此处的婚姻含义。
- source_word: וְהוּא בֶּן שִׁשִּׁים שָׁנָה
  choice: 当时他六十岁
  rationale: 将希伯来语字面为“六十岁之子”的年龄惯用语译成自然现代汉语，并以“当时”承接上下文。
- source_word: וַתֵּלֶד לוֹ
  choice: 她为他生了
  rationale: “为他”保留 לּוֹ 的与格意味，同时符合中文家谱叙事习惯。
- source_word: שְׂגוּב
  choice: 西割
  rationale: 采用该希伯来人名在中文圣经传统中的通行音译。
theological_decisions:
- issue: “基列的父亲”在家谱中的范围
  choice: 正文保留“父亲”
  alternative: 祖先；奠基者
  rationale: אָב 在家谱语境中可能指直接生父、祖先或族群／地域的奠基者；正文采用最直接的译法，脚注保留其语义范围。
- issue: בָּא אֶל 所指的关系
  choice: 正文译为“与……同房”
  alternative: 来到……那里；亲近
  rationale: 该表达常委婉指性结合，但字面上也可表示来到某人那里；正文按此语境中的常见用法翻译，脚注保留字面可能，避免完全消除原文的含蓄性。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，并保留家谱叙事的简洁节奏。“同房”含蓄而明确；“娶了她”则避免生硬直译。所有可能影响理解的原文语义范围均通过脚注呈现。
