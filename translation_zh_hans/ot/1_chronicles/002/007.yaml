base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
translation:
  language: zh_hans
  text: 迦米的儿子是亚割[a]，就是使以色列遭祸的人；他在当毁之物的事上犯了不忠之罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即《约书亚记》第7章的亚干。本节希伯来文作“亚割”，可能是为了呼应下文“使……遭祸”。
    reason: alternative_reading
  - marker: b
    text: “当毁之物”指被置于禁令之下、归神处置的东西；在当时的情境中，不可擅自取用，并与毁灭有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כַּרְמִי
  choice: 迦米的儿子是
  rationale: בְנֵי虽为复数形式，但本节只列一人；用汉语家谱常用表达“儿子是”，既自然，也不额外补入原文没有的信息。
- source_word: עָכָר
  choice: 亚割
  rationale: 保留《历代志》本节的名字形式עָכָר，不与《约书亚记》中的עָכָן（亚干）静默调和；“亚割”也便于体现与下文“使……遭祸”的文字联系。
- source_word: עוֹכֵר יִשְׂרָאֵל
  choice: 使以色列遭祸的人
  rationale: 分词עוֹכֵר作同位语，指给以色列带来祸患者。此译自然清楚，并尽量保留它与“亚割”之间的双关。
- source_word: מָעַל
  choice: 犯了不忠之罪
  rationale: מעל表示对神或圣物失信、干犯；“犯了不忠之罪”兼顾其道德与亵圣意味，比泛称“犯罪”更具体。
- source_word: בַּחֵרֶם
  choice: 在当毁之物的事上
  rationale: חֵרֶם在本语境指奉献给神而被禁取、须予毁灭之物；“当毁之物”承接现代中文圣经中较为熟悉的表达，并由脚注说明其完整含义。
theological_decisions:
- issue: חֵרֶם在亵圣与审判叙事中的译法
  choice: 当毁之物
  alternative: 奉献归神、不可私取而须毁灭之物；禁物
  rationale: 该词同时涉及归神、禁取和毁灭，不宜只译作一般的“东西”或单纯的“禁令”。正文采用凝练译语，脚注保留其多重语义。
- issue: 是否将עָכָר与《约书亚记》的亚干同名化
  choice: 正文译作“亚割”，脚注说明即亚干
  alternative: 直接译作“亚干”
  rationale: 原文在此有意使用עָכָר，并紧接同根/近音的עוֹכֵר，可能形成名字与“使人遭祸”之间的呼应；保留本节形式可避免抹去文学效果，同时脚注帮助读者辨认人物。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的家谱体中文。“使以色列遭祸的人”保留原文的同位说明；分号划分人物身份与罪行。所有脚注标记均已置入正文。
