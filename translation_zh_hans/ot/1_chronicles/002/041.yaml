  text: Shallum fathered Jekamiah, and Jekamiah fathered Elishama.
translation:
  language: zh_hans
  text: 沙龙生耶加米雅；耶加米雅生以利沙玛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלּוּם
  choice: 沙龙
  rationale: 人名按现代中文圣经中通行的译名音译；此处指犹大支系中的沙龙。
- source_word: הוֹלִיד / הֹלִיד
  choice: 生
  rationale: 使役形态的 ילד 在家谱中表示“生、成为……的父亲”。“生”简洁自然，符合中文家谱文体，并保留父系谱系关系。
- source_word: יְקַמְיָה / וִיקַמְיָה
  choice: 耶加米雅／耶加米雅
  rationale: 人名采用通行音译；希伯来文第二次重复此名，中文也予以保留，以清楚衔接家谱链条。前缀 ו 的承接关系借分号表达，无须另译“并且”。
- source_word: אֱלִישָׁמָע
  choice: 以利沙玛
  rationale: 人名采用现代中文圣经中通行的音译。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在中文中没有对应的独立词，其句法功能由语序体现。
