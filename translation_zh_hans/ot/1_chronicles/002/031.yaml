  yaml_path: translation/ot/1_chronicles/002/031.yaml
  text: 'The sons of Appaim: Ishi[a]; and the sons of Ishi: Sheshan; and the sons of Sheshan: Ahlai.'
translation:
  language: zh_hans
  text: 亚遍的儿子[a]是以示；以示的儿子是示珊；示珊的儿子是亚来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节各处的“儿子”也可译作“后代”；希伯来语בני在族谱中可以表示家系中的后裔，不过这里直译为“儿子”更为贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: ……的儿子
  rationale: בני是族谱中常见的承接语，可指亲生儿子，也可泛指后代。本节每次只列一个名字，正文译作“儿子”最直接自然，并以脚注保留较宽泛的可能。
- source_word: אַפַּיִם
  choice: 亚遍
  rationale: 这是人名，采用现代中文圣经读者较熟悉的传统音译“亚遍”。
- source_word: יִשְׁעִי
  choice: 以示
  rationale: 这是人名，按通行中文圣经音译作“以示”。
- source_word: שֵׁשָׁן
  choice: 示珊
  rationale: 这是人名，按通行中文圣经音译作“示珊”。
- source_word: אַחְלָי
  choice: 亚来
  rationale: 这是人名，按通行中文圣经音译作“亚来”；本节不对其身份作超出原文的说明。
