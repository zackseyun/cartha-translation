  yaml_path: translation/ot/1_chronicles/002/013.yaml
  text: And Jesse fathered his firstborn Eliab[a], Abinadab the second, and Shimea the third.
translation:
  language: zh_hans
  text: 耶西生了长子以利押、次子亚比拿达和三子示米亚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文作“示米亚”；平行经文《撒母耳记上》16:9作“沙玛”。
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישַׁי
  choice: 耶西
  rationale: וְ在家谱中起承接作用，中文逐节表达无需机械译作“和”；אִישַׁי按通行圣经译名译为“耶西”。
- source_word: הוֹלִיד
  choice: 生了
  rationale: ילד的使役式在家谱语境中表示“生、成为……的父亲”；“生了”是现代中文家谱叙述中自然、简洁的说法。
- source_word: אֶת בְּכֹרוֹ אֶת אֱלִיאָב
  choice: 长子以利押
  rationale: בְּכֹרוֹ意为“他的长子”，אֱלִיאָב按通行译名译为“以利押”；中文可自然合并为“长子以利押”。
- source_word: וַאֲבִינָדָב הַשֵּׁנִי
  choice: 次子亚比拿达
  rationale: הַשֵּׁנִי是“第二”；在列举儿子次序的语境中译作“次子”最自然，אֲבִינָדָב按通行译名译为“亚比拿达”。
- source_word: וְשִׁמְעָא הַשְּׁלִישִׁי
  choice: 和三子示米亚[a]
  rationale: הַשְּׁלִישִׁי意为“第三”，在此译作“三子”；שִׁמְעָא依本节《历代志》的希伯来文本音译为“示米亚”，并以脚注说明平行经文中的异名。
theological_decisions: []
translation_notes:
  register: 采用简洁庄重的现代中文家谱体，以“长子、次子、三子”清楚呈现原文的排行。脚注标记置于实际涉及文本差异的“示米亚”之后，而非置于“以利押”之后。
