base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/010.yaml
  text: Ram fathered Amminadab[a], and Amminadab fathered Nahshon, leader of the sons of Judah.
translation:
  language: zh_hans
  text: 兰生亚米拿达；亚米拿达生拿顺。拿顺是犹大子孙的领袖[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领袖”也可译作“首领”或“长官”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: 生
  rationale: 在家谱语境中，该词指男性生育后代。汉语“生”简洁自然，也准确保留了谱系承接关系。
- source_word: נְשִׂיא
  choice: 领袖
  rationale: 该词指群体中地位受尊崇的领导者，可表示领袖、首领或长官；“领袖”符合此处拿顺在犹大支派中的身份，又避免“王子”可能造成的君王血统含义。
- source_word: בְּנֵי יְהוּדָה
  choice: 犹大子孙
  rationale: 原文直译为“犹大的儿子们”，在家谱和支派语境中泛指犹大的男性后裔。“犹大子孙”既自然，又保留了血缘与支派意味。
- source_word: רָם / עַמִּינָדָב / נַחְשׁוֹן
  choice: 兰／亚米拿达／拿顺
  rationale: 采用现代中文圣经传统中较为通行的人名译法，便于读者辨认，并与相关经文中的姓名保持一致。
