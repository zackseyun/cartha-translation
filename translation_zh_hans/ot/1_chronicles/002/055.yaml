base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/055.yaml
  text: 'and the families of the scribes who lived at Jabez: the Tirathites[a], the Shimeathites, and the Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.'
translation:
  language: zh_hans
  text: 还有住在雅比斯的文士家族：提拉人、示米亚人和苏甲人。这些是从哈末而来的基尼人；哈末是利甲家族之父[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父”也可译作“祖先”或“创始人”。在希伯来语族谱语境中，“父”常可指一个家族的先祖或开创者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת סֹפְרִים
  choice: 还有……文士各族
  rationale: וּ承接前面的族谱名单，译作“还有”；מִשְׁפְּחוֹת指家族或宗族，סֹפְרִים指从事书写、抄录或文书工作的人，故译“文士各族”，不进一步限定其具体职分。
- source_word: ישבו יַעְבֵּץ
  choice: 住在雅比斯的
  rationale: ישבו为复数形式，表示这些家族居住在雅比斯；用定语结构符合现代汉语表达。
- source_word: תִּרְעָתִים שִׁמְעָתִים שׂוּכָתִים
  choice: 特拉人、示米押人和苏甲人
  rationale: 三词均为族群或宗族称号，采用音译并加“人”，清楚表明群体含义。
- source_word: הֵמָּה הַקִּינִים
  choice: 他们是……基尼人
  rationale: 保留原文明确的身份认定；הֵמָּה为强调性的独立代词，汉语以“他们是”自然表达。
- source_word: הַבָּאִים מֵחַמַּת
  choice: 从哈末而来的
  rationale: 分词הַבָּאִים与介词מִן可表示来源或来处。“从……而来”保留其可能兼有迁来或源出的含义，不强行译成纯粹血缘关系。
- source_word: אֲבִי בֵית רֵכָב
  choice: 利甲家族之父
  rationale: 直译“父”以保留希伯来语族谱用语；בֵית在此指家系、宗族，译作“家族”比现代汉语中的单独“家”更清楚。脚注说明“父”也可指祖先或家族创始人。
