lexical_decisions:
- source_word: וְ/עַתַּי
  choice: 亚太
  rationale: 人名按现代中文圣经常用译名音译；句首的连接词在谱系连续叙述中不必机械译出。
- source_word: הֹלִיד / הוֹלִיד
  choice: 生了
  rationale: 使役形态的 ילד 在家谱中表示生育、成为父亲；“生了”简洁自然，也符合中文家谱表达。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，现代汉语没有对应词，由正常语序体现其句法功能。
- source_word: נָתָן
  choice: 拿单
  rationale: 采用该希伯来人名的现代中文圣经常用音译。
- source_word: וְ/נָתָן
  choice: 拿单
  rationale: 人名译作“拿单”；连接词在两个并列的家谱分句之间用逗号自然体现，不另译“又”或“而”。
- source_word: זָבָד
  choice: 撒拔
  rationale: 采用该希伯来人名的现代中文圣经常用音译。
