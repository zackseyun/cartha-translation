  text: Azariah fathered Helez[a], and Helez fathered Eleasah.
translation:
  language: zh_hans
  text: 亚撒利雅生了希利斯，希利斯生了以利亚萨。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: 亚撒利雅
  rationale: 人名按现代中文圣经常用音译处理；词首连接词由上下文和中文句流承载，不机械译出“而”。
- source_word: הֹלִיד
  choice: 生了
  rationale: 使役形在家谱语境中指男子生育、成为某人的父亲；“生了”简洁自然，符合中文家谱表达。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，中文没有对应的独立词，其功能由语序体现。
- source_word: חָלֶץ / וְחֶלֶץ
  choice: 希利斯／希利斯
  rationale: 同一人名在两分句中重复出现，统一音译；第二处的连接词自然译入逗号衔接。
- source_word: אֶלְעָשָׂה
  choice: 以利亚萨
  rationale: 依照本节马所拉文本的读音直接音译，保留其中较完整的元音结构。
