  text: Jerahmeel also had another wife, and her name was Atarah; she was the mother of Onam.
translation:
  language: zh_hans
  text: 耶拉篾另有一个妻子，名叫亚她拉；她是阿南的母亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: 另有
  rationale: היה 与介词 ל 连用，在这里表达领有关系；结合家谱语境，译作“另有”自然地传达“耶拉篾还有”的意思，并承接上文。
- source_word: אִשָּׁה אַחֶרֶת
  choice: 另有一个妻子
  rationale: אִשָּׁה 在家谱婚姻语境中指“妻子”；אַחֶרֶת 表示另一位或额外的一位，译文不进一步推断婚姻的时间或性质。
- source_word: לִירַחְמְאֵל
  choice: 耶拉篾
  rationale: 按现代中文圣经常用音译处理人名；前缀 ל 所表达的领有关系纳入“耶拉篾另有”的句式。
- source_word: וּשְׁמָהּ
  choice: 名叫
  rationale: 以自然简洁的现代汉语表达希伯来语“她的名字是”这一命名公式。
- source_word: עֲטָרָה
  choice: 亚她拉
  rationale: 人名按通行中文圣经音译处理，不按普通名词“冠冕”意译。
- source_word: הִיא אֵם
  choice: 她是……的母亲
  rationale: 保留独立代词 הִיא 的明确指代，并如实表达家谱中的母子关系。
- source_word: אוֹנָם
  choice: 阿南
  rationale: 采用现代中文圣经中常见的人名音译。
theological_decisions: []
