base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
translation:
  language: zh_hans
  text: 基列耶琳之父[a]朔巴有儿子：哈罗以[c]，一半的米努哈人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基列耶琳的创建者”。家谱中的“父”也可指某城的祖先、创建者或主要首领。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“一半的米努哈”；也可能指“米努哈的一半”或“米努哈（玛拿哈）的半数居民或半个宗族”。
    reason: lexical_alternative
  - marker: c
    text: “哈罗以”可能是人名；有些传统将其作“利亚雅”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  choice: 朔巴有儿子
  rationale: 希伯来语直译为“有儿子归于朔巴”，现代汉语自然表达为“朔巴有儿子”，保留家谱语境。
- source_word: אֲבִי קִרְיַת יְעָרִים
  choice: 基列耶琳之父
  rationale: 保留 אָב 的直称“父”；在家谱和聚落语境中，该词也可能指祖先、创建者或与城邑相关的首领，因此另加脚注说明。
- source_word: קִרְיַת יְעָרִים
  choice: 基列耶琳
  rationale: 作为地名采用通行的中文音译，不将其意译为“森林之城”。
- source_word: הָרֹאֶה
  choice: 哈罗以
  rationale: 此词在家谱名单中最自然地视为专名；音译可保留马所拉文本的形式，避免直接解释成“先见”或未经说明地改作“利亚雅”。
- source_word: חֲצִי הַמְּנֻחוֹת
  choice: 一半的米努哈人
  rationale: 原文直译为“米努哈的一半”。家谱—地域语境可能指米努哈的宗族或居民；正文用“一半的米努哈人”表达这种可能性，同时以脚注保留地名或群体两种理解。
theological_decisions: []
