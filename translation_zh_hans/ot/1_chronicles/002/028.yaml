  text: The sons of Onam were Shammai and Jada[a]. The sons of Shammai were Nadab and Abishur.
translation:
  language: zh_hans
  text: 阿南的儿子是沙买和雅大。沙买的儿子[a]是拿答和亚比述。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这句话开头有连接词，也可译作“沙买的儿子则是拿答和亚比述”。
    reason: 保留原文重复家谱句式时所用连接词的可能表达。
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 是
  rationale: 在家谱句式中，היה 在这里用作系词，说明阿南的儿子是谁；译作“是”自然准确。
- source_word: בְנֵי
  choice: 儿子
  rationale: 本节列举的是直接的男性后代，译作“儿子”比“儿女”或“后代”更具体。
- source_word: אוֹנָם
  choice: 阿南
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: שַׁמַּי
  choice: 沙买
  rationale: 人名采用通行音译，两处保持一致。
- source_word: יָדָע
  choice: 雅大
  rationale: 人名按希伯来语辅音形式并参照中文圣经通行译名音译。
- source_word: וּבְנֵי
  choice: 沙买的儿子
  rationale: 前缀连词承接下一支家谱；正文采用自然的现代汉语另起一句，连词信息以脚注说明。
- source_word: נָדָב
  choice: 拿答
  rationale: 采用中文圣经通行人名音译。
- source_word: אֲבִישׁוּר
  choice: 亚比述
  rationale: 采用中文圣经通行人名音译。
