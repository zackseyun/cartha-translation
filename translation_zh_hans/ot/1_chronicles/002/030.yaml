  yaml_path: translation/ot/1_chronicles/002/030.yaml
  text: 'The sons of Nadab: Seled and Appaim[a]. Seled died without sons.'
translation:
  language: zh_hans
  text: 拿答的儿子是西列和亚遍。西列死了，没有儿子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“西列死了，并没有儿子。”
    reason: 原文 וַיָּמָת סֶלֶד לֹא בָנִים 结构简略；“没有儿子”可表达西列死时无子的状态，也可译作与“死了”并列的陈述。
lexical_decisions:
- source_word: וּבְנֵי
  choice: ……的儿子是
  rationale: בְנֵי 是“儿子”的复数构造形，前接连词 וּ；在中文家谱体例中，用“……的儿子是”自然而庄重，句首连词不必机械译出。
- source_word: נָדָב
  choice: 拿答
  rationale: 人名按现代中文圣经中较通行的译名处理。
- source_word: סֶלֶד
  choice: 西列
  rationale: 人名音译，两处保持一致。
- source_word: וְאַפָּיִם
  choice: 和亚遍
  rationale: 此形式虽与普通名词“鼻孔、脸”相似，但家谱语境明确表明是人名；连词 וְ 译为“和”。
- source_word: וַיָּמָת
  choice: 死了
  rationale: מוּת 的连续叙事形式表示随后发生的死亡；“死了”符合现代汉语叙事表达，无须额外译出“于是”。
- source_word: לֹא בָנִים
  choice: 没有儿子
  rationale: 原文简略，直译近于“没有儿子”；בָנִים 在此明确指儿子，不扩大为“没有儿女”或“没有孩子”。
