base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
translation:
  language: zh_hans
  text: 他的儿媳他玛给他生了法勒斯[a]和谢拉。犹大的儿子共有五个[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “法勒斯”也可按希伯来语音译为“佩雷茨”。
    reason: lexical_alternative
  - marker: b
    text: 这里总结犹大众子的总数：加上法勒斯和谢拉，连同前文的珥、俄南和示拉，共有五个。
    reason: cross_reference
lexical_decisions:
- source_word: תָמָר
  choice: 他玛
  rationale: 人名采用现代中文圣经读者熟悉的传统译名，指犹大的儿媳他玛。
- source_word: כַּלָּתוֹ
  choice: 他的儿媳
  rationale: כַּלָּה带第三人称阳性单数后缀，在此明确指“他的儿媳”，即儿子的妻子。
- source_word: יָלְדָה לּוֹ
  choice: 给他生了
  rationale: יָלְדָה是“生育”的阴性单数完成式，לּוֹ表明孩子与犹大的父子关系；“给他生了”既自然又保留原文关系。
- source_word: פֶּרֶץ
  choice: 法勒斯
  rationale: 采用中文圣经传统中通行的人名译法；其希伯来语发音也常转写为“佩雷茨”。
- source_word: זָרַח
  choice: 谢拉
  rationale: 采用现代中文圣经读者熟悉的传统译名。
- source_word: כָּל בְּנֵי יְהוּדָה חֲמִשָּׁה
  choice: 犹大的儿子共有五个
  rationale: 直陈总结犹大儿子的总数；“共有”自然表达כָּל与结尾数词所构成的合计语气，同时保留“儿子”的性别信息。
theological_decisions:
- issue: 在法勒斯和谢拉之后对犹大众子的总结
  choice: 译作“犹大的儿子共有五个”
  alternative: “这些就是犹大的五个儿子”
  rationale: 原文是简明的家谱合计句，说明连同前文所列的珥、俄南和示拉在内，犹大共有五个儿子；不把指示成分加入正文。
- issue: 亲属关系及后裔的性别用语
  choice: 保留“儿媳”和“儿子”
  alternative: 使用“姻亲”和“孩子”等中性称呼
  rationale: 原文分别使用明确的姻亲称谓כַּלָּה和阳性后裔称谓בֵּן，故不将其泛化。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语，保持家谱叙述的凝练语体。将同位语调整为符合汉语习惯的“他的儿媳他玛”，并以“共有五个”清楚表达原文的合计句。人名采用中文圣经传统通行译名，必要的音译差异置于脚注。
