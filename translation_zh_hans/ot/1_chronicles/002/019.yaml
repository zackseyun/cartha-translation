  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
translation:
  language: zh_hans
  text: 阿苏巴死了；迦勒娶了[a]以法特[b]为妻；她给他生了户珥。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“迦勒为自己取了以法特”，这是表示娶妻的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 此处希伯来文是较短形式“以法特”（Ephrath）；别处相关形式也常译作“以法他”（Ephrathah）。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: 死了
  rationale: מות的Qal叙事形式，直接表示死亡；“死了”准确、自然，不使用委婉语。
- source_word: עֲזוּבָה
  choice: 阿苏巴
  rationale: 人名按现代中文圣经常见形式音译。
- source_word: וַיִּקַּח לוֹ
  choice: 就娶了
  rationale: לקח以女子为宾语时是婚娶惯用语；“娶了”清楚表达婚姻含义，“就”体现叙事中的先后承接。
- source_word: כָלֵב
  choice: 迦勒
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֶפְרָת
  choice: 以法特
  rationale: 按本节希伯来文较短形式אֶפְרָת音译，并与别处可能出现的扩展形式相区别。
- source_word: וַתֵּלֶד לוֹ
  choice: 她给迦勒生了
  rationale: 准确表达Qal形式的“生育”以及间接宾语לוֹ；将代词明确为“迦勒”，使中文家谱叙述更清楚。
- source_word: חוּר
  choice: 户珥
  rationale: 采用现代中文圣经中通行的人名译法。
