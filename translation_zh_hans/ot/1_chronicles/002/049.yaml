revisions:
- from: 她[a]又生了麦玛拿之父沙押，以及抹比拿和基比亚之父示法[b]。迦勒的女儿是押撒。
  to: 她[a]又生了麦玛拿之父沙亚弗，以及抹比拿和基比亚之父示法[b]。迦勒的女儿是押撒。
  rationale: 保留草案依据马所拉文本所作的正确句法处理：玛迦是“生了”的主语，沙亚弗是麦玛拿之父，示法是抹比拿和基比亚之父。仅将“沙押”修订为“沙亚弗”，使专名音译更忠实于 שַׁעַף；并微调脚注指向。
