base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/049.yaml
  text: Shepha fathered Sheva, the father of Machbenah and the father of Gibea; and Caleb’s daughter was Acsah.
translation:
  language: zh_hans
  text: 她[a]又生了麦玛拿之父沙亚弗，以及抹比拿和基比亚之父示法[b]。迦勒的女儿是押撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她”指上节所说的玛迦。
    reason: 原文以阴性单数动词承接上节的玛迦；中文须补出主语。
  - marker: b
    text: 本节各处的“父”也可能指祖先、创建者或首领；麦玛拿、抹比拿和基比亚可能是地名。
    reason: 希伯来语 אָב 在家谱与城邑名称并列的语境中具有真实的语义歧义。
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 她又生了
  rationale: 希伯来语动词是阴性单数，主语承接上节的玛迦；“又”体现叙事连接。
- source_word: שַׁעַף
  choice: 沙押
  rationale: 按希伯来语人名 Shaaph 音译，避免沿用英文修订层的异形 Shepha。
- source_word: מַדְמַנָּה
  choice: 麦玛拿
  rationale: 按希伯来语地名 Madmannah 音译。
- source_word: שְׁוָא
  choice: 示法
  rationale: 按此处希伯来语人名 Sheva 音译，并采用中文圣经中较熟悉的形式。
- source_word: אֲבִי
  choice: 之父
  rationale: 保留原文“父亲”的亲属称谓；在家谱和地名语境中也可能指祖先或城邑的创建者，另以脚注说明。
- source_word: עַכְסָה
  choice: 押撒
  rationale: 采用该人名在现代中文圣经中的通行译名。
theological_decisions:
- issue: 本节首句的主语及人物关系
  choice: 把阴性动词的主语理解为上节的玛迦，并把沙押与示法列为她所生的人
  alternative: 依英文 POB，把沙押理解为“生了示法”的主语
  rationale: 马所拉文本 וַתֵּלֶד 是阴性单数，并由上节“迦勒的妾玛迦”自然承接；其后宾语标记 אֶת 位于“示法”之前，支持“她生了……示法”，而不是“沙押生了示法”。这样也保留了原文中的“麦玛拿之父沙押”，该成分在英文咨询层中缺失。
- issue: “父”是否表示生父
  choice: 正文直译为“之父”
  alternative: 译作“祖先”或“创建者”
  rationale: אָב 在此类家谱中可能描述血缘祖先，也可能指某聚落的创建者或首领；正文不武断消解，脚注呈现语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述。专名以通行中文形式为主；严格依照 WLC 的句法恢复“麦玛拿之父沙押”，不跟随英文咨询层对该成分的遗漏及其对主语关系的重组。
