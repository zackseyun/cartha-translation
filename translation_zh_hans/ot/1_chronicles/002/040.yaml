  text: 以利亚撒生西斯买；西斯买生沙龙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָשָׂה
  choice: 以利亚萨
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较易辨认的通行形式。
- source_word: הֹלִיד
  choice: 生
  rationale: 使役形在家谱中表示“生下、成为……的父亲”。中文家谱用“生”最简洁自然，也不额外限定更宽泛的谱系关系。
- source_word: אֵת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在中文中无需对应词，其语法功能由语序体现。
- source_word: סִסְמָי
  choice: 西斯买
  rationale: 按希伯来语人名音译；结尾 -ai 以“买”体现。
- source_word: וְ
  choice: 分号衔接
  rationale: 原文连词连接两个连续的家谱分句；中文以分号自然表达同等并列和世代递进，无须机械译作“并且”。
- source_word: שַׁלּוּם
  choice: 沙龙
  rationale: 采用该希伯来人名在中文圣经传统中的通行译名，以便读者辨认；这里是人名，并非普通名词“平安”。
