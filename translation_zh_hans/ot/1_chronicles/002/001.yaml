base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/001.yaml
  text: 'These are the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: zh_hans
  text: 以色列的儿子是：流便、西缅、利未、犹大、以萨迦和西布伦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: 是
  rationale: 该复数指示词用于引出名单；现代汉语以“……是”自然表达此处的系词性介绍，无须生硬译出“这些”。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这里所列的是雅各（以色列）的男性子嗣本人，而非泛指后代或男女皆包括的儿女，因此译作“儿子”最准确。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留希伯来文所用的立约名字“以色列”，不以其另一名字“雅各”代换。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: שִׁמְעוֹן
  choice: 西缅
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: לֵוִי
  choice: 利未
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: וִיהוּדָה
  choice: 犹大
  rationale: 采用通行人名译法；希伯来文此处的连接词在中文并列名单中不必逐项机械译出。
- source_word: יִשָׂשכָר
  choice: 以萨迦
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: וּזְבֻלוּן
  choice: 和西布伦
  rationale: 采用通行人名译法，并把末项前的连接词自然译为“和”，符合现代汉语列举习惯。
theological_decisions: []
translation_notes:
  register: 采用庄重、简洁而自然的现代标准汉语。以“以色列的儿子是”直接引出名单，既忠于家谱标题的功能，也避免“这些是……”在中文中的翻译腔。人名采用简体中文圣经读者熟悉的传统译名。
