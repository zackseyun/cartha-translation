lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 是
  rationale: 此处该动词用于引出家谱名单。汉语以“儿子是：”自然表达其列举作用，无须生硬译作“他们有”。
- source_word: בְנֵי
  choice: 儿子
  rationale: 在此家谱语境中指所列男性后代，译作“儿子”直接准确。
- source_word: רָם
  choice: 兰
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: בְּכוֹר
  choice: 长子
  rationale: 该词与耶拉篾构成同位关系，说明他是兰的长子；“长子”简洁自然。
- source_word: יְרַחְמְאֵל
  choice: 耶拉篾
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: מַעַץ
  choice: 玛押
  rationale: 按希伯来语人名音译，并采用中文圣经的通行形式。
- source_word: יָמִין
  choice: 雅悯
  rationale: 此处明确为人名，不按其可能具有的普通词义翻译；采用通行音译。
- source_word: עֵקֶר
  choice: 以基
  rationale: 按希伯来语人名采用中文圣经的通行音译。
