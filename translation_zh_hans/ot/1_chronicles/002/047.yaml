  text: 'The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.'
translation:
  language: zh_hans
  text: 雅代的儿子是利健、约坦、基珊、毗力、以法和沙亚弗。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: 的儿子是
  rationale: בְנֵי是“儿子”的复数构造形式，用来引出家谱名单；中文以“某人的儿子是……”自然呈现这一结构。句首连接词וּ在连续家谱中可不单独译出，以免中文生硬。
- source_word: יָהְדָּי
  choice: 雅代
  rationale: 人名按现代中文圣经常用音译处理。
- source_word: רֶגֶם
  choice: 利健
  rationale: 人名音译；采用中文圣经传统中较易辨认的形式。
- source_word: יוֹתָם
  choice: 约坦
  rationale: 人名音译，并与该希伯来名字在中文圣经中的常见形式保持一致。
- source_word: גֵישָׁן
  choice: 基珊
  rationale: 人名音译，尽量对应希伯来语辅音与元音轮廓。
- source_word: פֶלֶט
  choice: 毗勒
  rationale: 人名音译；末尾希伯来辅音不另加汉字音节，以符合惯用形式。
- source_word: עֵיפָה
  choice: 以法
  rationale: 此处是人名而非干量单位；沿用中文圣经中该名字的常见音译。
- source_word: שָׁעַף
  choice: 沙亚弗
  rationale: 人名音译，保留希伯来语中间的喉音分界及末辅音轮廓。
