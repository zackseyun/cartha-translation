  yaml_path: translation/ot/1_chronicles/002/016.yaml
  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: zh_hans
  text: 他们的姐妹是洗鲁雅和亚比该。洗鲁雅的儿子是亚比筛、约押和亚撒黑，共三人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתֵיהֶם
  choice: 他们的姐妹是
  rationale: 保留第三人称阳性复数后缀“他们的”和复数名词“姐妹”；句首连接词在现代汉语中不必机械译出。
- source_word: צְרוּיָה
  choice: 洗鲁雅
  rationale: 采用现代中文圣经读者较熟悉的人名音译。
- source_word: וַאֲבִיגָיִל
  choice: 和亚比该
  rationale: 人名按通行形式音译，并明确表达连接词。
- source_word: וּבְנֵי צְרוּיָה
  choice: 洗鲁雅的儿子是
  rationale: 准确表达属格结构“洗鲁雅的儿子”，并以“是”自然引出名单。
- source_word: אַבְשַׁי
  choice: 亚比筛
  rationale: 采用通行中文音译。
- source_word: וְיוֹאָב
  choice: 约押
  rationale: 采用通行中文音译；连接关系通过汉语列举格式表达。
- source_word: וַעֲשָׂהאֵל
  choice: 和亚撒黑
  rationale: 采用通行中文音译，并在名单末项保留连接关系。
- source_word: שְׁלֹשָׁה
  choice: 共三人
  rationale: 保留原文对儿子总数的明确总结；加“共”和量词“人”使现代汉语自然清楚。
