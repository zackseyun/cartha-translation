base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/050.yaml
  text: 'These were the sons of Caleb son of Hur[a], the firstborn of Ephrathah: Shobal, father of Kiriath-jearim.'
translation:
  language: zh_hans
  text: 以下是迦勒的儿子；迦勒是户珥的儿子，户珥是以法她的长子：朔巴，基列·耶琳之父[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “之父”也可理解为“创建者”或“先祖”；在家谱语境中，希伯来语“父”可指宗族或城邑的创建者、始祖。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הָיוּ
  choice: 以下是
  rationale: 这是引出家谱名录的固定表达；现代汉语用“以下是”自然清楚，无须机械体现希伯来语完成时。
- source_word: בְּנֵי כָלֵב
  choice: 迦勒的子孙
  rationale: בְּנֵי 字面为“众子”，但本段涉及延续的宗族和后代；“子孙”比“儿子们”更符合家谱语境，也能容纳后文所列人物与族群。
- source_word: בֶּן חוּר בְּכוֹר אֶפְרָתָה שׁוֹבָל
  choice: 朔巴是以法她的长子户珥之子
  rationale: 按马所拉重音和上下文，可将朔巴理解为户珥之子，并将“以法她的长子”理解为修饰户珥；调整汉语词序以明确这一较合语境的关系，同时以脚注保留原文句法的另一种切分。
- source_word: אֲבִי
  choice: 之父
  rationale: 保留希伯来语家谱中的“父”这一表达；在城邑和宗族语境中也可能指创建者或先祖，故加脚注说明。
- source_word: קִרְיַת יְעָרִים
  choice: 基列·耶琳
  rationale: 作为地名采用音译，并用间隔号清楚标示复合名称。
theological_decisions:
- issue: 户珥、迦勒、朔巴之间关系的句法归属
  choice: 将朔巴译为户珥之子，并将户珥称为以法她的长子
  alternative: “迦勒是户珥之子，户珥是以法她的长子；朔巴……”
  rationale: 希伯来语词序容许不止一种切分，但马所拉重音在“迦勒”后形成停顿，且本章前文把户珥列为迦勒的后代，因此正文采用更符合篇章家谱关系的理解，同时在脚注中保留另一读法。
translation_notes:
  register: 采用现代、庄重而通顺的家谱叙述。“子孙”避免把 בְּנֵי 过度限定为亲生儿子；“也是”使只有一个明确列名者的长句在汉语中更易读。人名、地名采用常见圣经汉语译名。
