base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
translation:
  language: zh_hans
  text: 犹大的儿子是珥、俄南和示拉；这三人都是迦南人书亚的女儿给他生的[a]。犹大的长子珥在耶和华眼中是邪恶的，耶和华就使他丧命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书亚的女儿”也可按专名译作“拔书亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: 犹大的儿子
  rationale: 保留族谱体裁中的领属关系，并以现代汉语自然表达。
- source_word: עֵר וְאוֹנָן וְשֵׁלָה
  choice: 珥、俄南和示拉
  rationale: 采用现代中文圣经中较为通行的人名音译。
- source_word: שְׁלוֹשָׁה נוֹלַד לוֹ
  choice: 这三人……为他所生的
  rationale: 明确保留原文的数词“三”和被动出生表达，同时使中文顺畅。
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  choice: 迦南女子书亚的女儿
  rationale: 按马所拉文本的自然句法理解为“迦南女子、书亚的女儿”；阴性定冠词形容词 הַכְּנַעֲנִית 修饰“女儿”，而“书亚”为其父名。
- source_word: בְּכוֹר יְהוּדָה
  choice: 犹大的长子
  rationale: 准确表达长子身份及领属关系。
- source_word: רַע בְּעֵינֵי יְהוָה
  choice: 在耶和华眼中是恶的
  rationale: 保留希伯来语固定评价句式的“眼中”意象及道德判断。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉的神名传统译法，作为专名而非一般称号。
- source_word: וַיְמִיתֵהוּ
  choice: 耶和华就使他死了
  rationale: 使役式动词直译为“使他死了”；中文补明承接上句的隐含主语，以免代词指向含混。
theological_decisions:
- issue: וַיְמִיתֵהוּ 的隐含主语
  choice: 在正文中补明为“耶和华”
  alternative: “他就使他死了”
  rationale: 希伯来语动词虽未重述主语，但叙事自然承接前一分句中的耶和华。中文若连续使用两个“他”容易产生歧义，补明神名不改变原意。
- issue: רַע 的道德评价力度
  choice: 是恶的
  alternative: 行恶／邪恶
  rationale: 原文描述珥在耶和华眼中的性质或状态，并未在本节列举具体行为；“是恶的”保留这种简洁而严肃的神学判断。
- issue: 神名 יְהוָה 的翻译
  choice: 耶和华
  alternative: 雅威／上主
  rationale: “耶和华”是现代普通话简体中文圣经语境中最广为识别的专名形式，避免把专名仅译成称号。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，保持族谱叙述的简洁。原文可直接理解为“书亚的女儿”，故不将“拔书亚／巴特书亚”作为正文专名，也无需脚注。
