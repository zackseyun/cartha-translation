    rationale: 该希伯来语串可被一些译者视为女性专名。正文采用较直接的“书亚的女儿”是稳妥的，但应以脚注保留替代读法，避免排除仍有依据的歧义。
  - severity: low
    issue: “是恶的”“使他死了”略显直译和不够自然。
    rationale: “是邪恶的”较符合现代书面语；“使他丧命”自然地传达使役式动词所述的死亡结果，且不额外限定死亡方式。
