base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/017.yaml
  text: Abigail bore Amasa[a], and the father of Amasa was Jether the Ishmaelite.
translation:
  language: zh_hans
  text: 亚比该生了亚玛撒[a]；亚玛撒的父亲是以实玛利人益帖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本以及《撒母耳记下》17:25的平行经文作“以色列人以特拉”，而不是“以实玛利人益帖”。此处马所拉文本作“以实玛利人益帖”。
    reason: textual_variant
lexical_decisions:
- source_word: יָלְדָה
  choice: 生了
  rationale: qal形态以女性为主语，在家谱语境中意为“生了”；简洁自然，并保留母系生育关系。
- source_word: עֲמָשָׂא
  choice: 亚玛撒
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: וַאֲבִי עֲמָשָׂא
  choice: 亚玛撒的父亲
  rationale: 直接表达希伯来语附属结构“亚玛撒之父”，符合现代汉语语序。
- source_word: יֶתֶר
  choice: 益帖
  rationale: 采用现代中文圣经中较通行的人名译法，以区别于异文所见的“以特拉”。
- source_word: הַיִּשְׁמְעֵאלִי
  choice: 以实玛利人
  rationale: 民族称谓带定冠词，在汉语中自然译为“以实玛利人”；其功能是标明益帖的族属或身份。
theological_decisions: []
