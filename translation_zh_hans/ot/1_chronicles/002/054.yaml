base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
translation:
  language: zh_hans
  text: 撒玛的后裔有：伯利恒、尼陀法人、亚他录·伯·约押人、玛拿哈人[a]的一半，以及琐拉人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“米努哈人”。这个希伯来族称究竟与哪个地名相关，并不确定。
    reason: lexical_alternative
  - marker: b
    text: 或音译“琐利人”，指与琐拉有关的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 后裔
  rationale: 在家谱和宗族名单中，该词常泛指后代或所属宗族，不一定只是亲生儿子；“后裔”在现代汉语中更自然，也符合本节列举地点与族群的语境。
- source_word: שַׂלְמָא
  choice: 撒玛
  rationale: 按常用中文圣经人名译法音译此专名。
- source_word: בֵּית לֶחֶם
  choice: 伯利恒
  rationale: 原文是地名形式，并非明确的族称；保留“伯利恒”，不擅自改成“伯利恒人”，让地点与宗族之间的关系保持原文的简略性。
- source_word: וּנְטוֹפָתִי
  choice: 尼陀法人
  rationale: 这是带族称意义的形式，在名单中宜理解为与尼陀法有关的居民或宗族，汉语用复数集合意义的“人”表达。
- source_word: עַטְרוֹת בֵּית יוֹאָב
  choice: 亚他录·伯·约押人
  rationale: 将这一组合视为复合地名或宗族名称，而不按字面译为“约押家的冠冕”；加“人”使其在后裔名单中的族群功能清楚。
- source_word: וַחֲצִי
  choice: 的一半
  rationale: 准确保留“半数、半支”的含义，并按现代汉语语序置于族称之后。
- source_word: הַמָּנַחְתִּי
  choice: 玛拿哈人
  rationale: 按族称形式译为与玛拿哈有关的人群；其所关联的准确地名存在文本与词源上的不确定性，另以脚注说明。
- source_word: הַצָּרְעִי
  choice: 琐拉人
  rationale: 该族称通常指与琐拉有关的人；用“琐拉人”直接呈现地点关联，同时以脚注保留音译式译名的可能性。
theological_decisions: []
