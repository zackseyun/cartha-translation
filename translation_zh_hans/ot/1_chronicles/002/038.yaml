  rationale: 此处连接两个连续的家谱分句；中文用分号既体现并列承接，也避免重复添加连接词。
- source_word: עֲזַרְיָה
  choice: 亚撒利雅
  rationale: 采用现代中文圣经中通行的人名音译。
