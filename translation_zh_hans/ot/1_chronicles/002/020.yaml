- source_word: אוּרִי
  choice: 乌利
  rationale: 人名采用现代中文圣经中通行且易辨识的译法。
- source_word: וְ
  choice: ；
  rationale: 原文连接两个连续的家谱陈述；中文以分号自然呈现紧密并列关系，无须机械译成“并且”。
- source_word: בְּצַלְאֵל
  choice: 比撒列
  rationale: 采用现代中文圣经中通行的人名译法。
