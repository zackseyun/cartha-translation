  yaml_path: translation/ot/1_chronicles/002/037.yaml
  text: Zabad fathered Ephlal, and Ephlal fathered Obed.
translation:
  language: zh_hans
  text: 撒拔生以弗拉；以弗拉生俄备得。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָבָד
  choice: 撒拔
  rationale: 希伯来人名按现代中文圣经中常见的音译形式处理，不翻译其可能的词源含义。
- source_word: הוֹלִיד
  choice: 生
  rationale: 使役形在家谱语境中表示男子生育、成为某人的父亲；中文家谱用“生”最简洁自然，并保留父系谱系的表达。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在中文中没有对应的独立词义，由语序自然体现。
- source_word: אֶפְלָל
  choice: 以弗拉
  rationale: 专有人名采用符合现代中文圣经传统的音译，不按词源意译。
- source_word: וְ
  choice: ；
  rationale: 原文连词连接两个连续的家谱分句；中文用分号衔接更自然清楚，关系仍由并列结构表达。
- source_word: עוֹבֵד
  choice: 俄备得
  rationale: 专有人名采用中文圣经传统音译；虽与“服事”的希伯来词根有关，此处不意译。
theological_decisions: []
