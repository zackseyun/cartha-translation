  language: zh_hans
  text: 希伯仑的儿子是：可拉、他普亚、利肯和示玛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示玛”也有译作“沙玛”的。
    reason: 音译形式存在差异；正文“示玛”较贴近马所拉文本שָׁמַע的读音。
lexical_decisions:
- source_word: וּבְנֵי
  choice: 的儿子是
  rationale: בְנֵי是“儿子”的复数附属形式，在此引出家谱名单。译作“的儿子是”既直接又符合现代汉语家谱叙述；句首的连接词וּ不单独译出，以免中文生硬。
- source_word: חֶבְרוֹן
  choice: 希伯仑
  rationale: 人名，采用现代中文圣经中通行的音译。
- source_word: קֹרַח
  choice: 可拉
  rationale: 人名，采用通行音译。
- source_word: תַפֻּחַ
  choice: 他普亚
  rationale: 此处是人名，按音译处理，不按同形普通名词“苹果”翻译。
- source_word: רֶקֶם
  choice: 利肯
  rationale: 人名，采用通行的中文音译形式。
- source_word: שָׁמַע
  choice: 示玛
  rationale: 人名，按马所拉文本的读音音译为“示玛”；另有音译形式在脚注中说明。
