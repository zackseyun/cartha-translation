  text: Salma[a], the father of Bethlehem; Hareph[b], the father of Beth-gader.
translation:
  language: zh_hans
  text: 撒玛[a]，伯利恒之父；哈列[b]，伯迦得之父。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父”也可理解为“创立者”或“祖先”。在家谱名单中，这个词不一定只指直接的生父，也可指宗族或城邑的始祖、创立者。
    reason: lexical_alternative
  - marker: b
    text: “哈列”在某些人名传统中也译作“哈立”。
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂלְמָא
  choice: 撒玛
  rationale: 按希伯来文专名音译；采用简洁、适合现代汉语圣经人名传统的形式。
- source_word: אֲבִי
  choice: ……之父
  rationale: 保留原文“父”的表达及其歧义；在《历代志》的家谱和聚落名单中，此词既可能指生父，也可能指祖先、宗族始祖或城邑创立者。
- source_word: בֵית לָחֶם
  choice: 伯利恒
  rationale: 采用该地名在现代汉语圣经中的通行译名。
- source_word: חָרֵף
  choice: 哈勒
  rationale: 依据本节马所拉文本的辅音和元音音译；不与其他名字传统中的形式强行统一。
- source_word: בֵית גָּדֵר
  choice: 伯迦得
  rationale: 视为地名，并按“בית + 名称”的专名结构音译，避免直译为“迦得之家”而误导读者。
theological_decisions:
- issue: “父”与城邑之间的关系
  choice: 正文直译为“……之父”，脚注说明可指创立者或祖先
  alternative: 正文译为“……的创立者”
  rationale: 原文 אָב 的指向并不唯一；直译并辅以脚注，可保留家谱用语中的真实歧义，避免断定为生物学父子关系或单一的建城关系。
translation_notes:
  register: 采用现代、庄重而简洁的家谱体。两个分句保持希伯来文的平行结构；以“之父”而非较口语的“父亲”保留名单式表达，同时用脚注解释其较宽泛的谱系和聚落含义。
