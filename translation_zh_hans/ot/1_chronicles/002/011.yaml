  text: Nahshon fathered Salma[a], and Salma fathered Boaz.
translation:
  language: zh_hans
  text: 拿顺生了撒玛[a]，撒玛生了波阿斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“撒玛”；有些译本作“撒门”，以与相关族谱一致（例如得4:20–21；太1:4–5）。
    reason: 说明本节马所拉文本的人名形式，并保留相关族谱中的另一传统译法。
lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  choice: 拿顺
  rationale: 专名按现代中文圣经中通行且易于辨认的形式音译；句首的连接词 וְ 在此承接族谱，中文无需机械译出。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 使役词形在父系族谱中表示“生、成为……的父亲”；“生了”简洁自然，符合现代中文族谱表达。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在中文中没有对应的独立词，由语序自然体现。
- source_word: שַׂלְמָא
  choice: 撒玛
  rationale: 直接依照本节马所拉文本 שַׂלְמָא 音译，不为配合相关族谱而改作“撒门”。
- source_word: וְ/שַׂלְמָא
  choice: 撒玛
  rationale: 连接词 וְ 在中文并列分句中可由逗号自然表达；人名仍按本节希伯来文译作“撒玛”。
- source_word: בֹּעַז
  choice: 波阿斯
  rationale: 采用现代中文圣经读者熟悉的标准人名音译。
