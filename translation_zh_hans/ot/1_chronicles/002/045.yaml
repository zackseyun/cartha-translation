  text: וּ/בֶן שַׁמַּ֖י מָע֑וֹן וּ/מָע֖וֹן אֲבִ֥י בֵֽית צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/045.yaml
  text: And the son of Shammai was Maon[a], and Maon was the father of Beth-zur.
translation:
  language: zh_hans
  text: 沙买的儿子是玛云；玛云是伯夙之父[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父”也可理解为“祖先”或“创建者”。在家谱中，“……之父”有时指某宗族或城镇的始祖、创建者或首领。
    reason: 保留אֲבִי在家谱及地名语境中可能具有的宽泛含义，因为伯夙是城镇或相关宗族的名称。
lexical_decisions:
- source_word: וּ/בֶן
  choice: ……的儿子是
  rationale: בֶן在家谱中通常指“儿子”；连接词ו承接上文，在中文中以分句顺接自然体现，不另译“并且”。
- source_word: שַׁמַּי
  choice: 沙买
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: מָעוֹן
  choice: 玛云
  rationale: 此处在家谱句式中作人名，而非同形地名，采用通行音译“玛云”。
- source_word: וּ/מָעוֹן
  choice: 玛云
  rationale: 保留原文对名字的重复；连接词ו以分号后的顺接关系体现，使中文简洁自然。
- source_word: אֲבִי
  choice: 是……的父
  rationale: 保留אָב在家谱表达中的基本意象及其可能涵盖的宽泛关系，不在正文中擅自限定为生父、祖先或创建者；相关语义范围以脚注说明。
- source_word: בֵית צוּר
  choice: 伯夙
  rationale: 这是地名或相关宗族名称，采用现代中文圣经中通行的专名音译，不按字面译为“磐石之家”。
theological_decisions: []
