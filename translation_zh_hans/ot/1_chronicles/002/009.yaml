base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/009.yaml
  text: 'The sons of Hezron who were born to him: Jerahmeel[a], Ram, and Chelubai.'
translation:
  language: zh_hans
  text: 希斯仑所生的儿子是耶拉篾、兰和基路拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 基路拜很可能就是本家谱其他地方称为迦勒的那个人。
    reason: 保留马所拉文本本节的人名形式，同时提示其可能与“迦勒”为同一人，而不在正文中直接合并两种名称。
lexical_decisions:
- source_word: וּבְנֵי חֶצְרוֹן
  choice: 希斯仑的儿子
  rationale: בְנֵי是בֵּן的复数附属形，表示“……的儿子”；句首连接词וּ在连续家谱中不必机械译作“和”。人名חֶצְרוֹן按现代中文圣经通行译名译作“希斯仑”。
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: 所生的
  rationale: 原文使用ילד的被动式并带לוֹ，字面义为“为他所生的”。中文用“所生的”自然简洁，也保留家谱中的生育关系，不改写成更主动的“他生了”。
- source_word: יְרַחְמְאֵל
  choice: 耶拉篾
  rationale: 按现代中文圣经通行形式音译此人名。
- source_word: רָם
  choice: 兰
  rationale: 按现代中文圣经通行形式音译此人名。
- source_word: כְּלוּבָי
  choice: 基路拜
  rationale: 马所拉文本在本节明确作כְּלוּבָי，因此正文直接音译为“基路拜”，不与本家谱其他地方的“迦勒”静默协调；可能的同一人物关系留在脚注说明。
- source_word: אֶת
  choice: 不另译
  rationale: אֶת是希伯来语直接宾语标记，现代汉语没有对应词，无须显明译出。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代普通话家谱句式。以“是”引出名单，避免古雅的“乃”或过度直译。脚注标记置于其实际说明的“基路拜”之后。
