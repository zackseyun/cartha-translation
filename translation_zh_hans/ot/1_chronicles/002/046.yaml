base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/046.yaml
  text: And Ephah[a], Caleb’s concubine, bore Haran, Moza, and Gazez; and Haran fathered Gazez.
translation:
  language: zh_hans
  text: 迦勒的妾以法生了哈兰、摩撒和迦谢；哈兰生了迦谢。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּילֶגֶשׁ
  choice: 妾
  rationale: 该词指具有受承认但地位次于正妻的婚姻身份之女子；“妾”是简洁、自然且符合家谱语境的现代汉语表达。
- source_word: יָלְדָה
  choice: 生了
  rationale: 女性作主语时，该动词表示生育；“生了”符合现代汉语家谱叙述。
- source_word: הֹלִיד
  choice: 生了
  rationale: 该词的使役式在家谱中表示男性生育后代；汉语家谱惯用“生了”，由男性主语自然表明父系关系，无须增添原文没有的解释。
- source_word: עֵיפָה
  choice: 以法
  rationale: 人名采用现代中文圣经中通行的音译。
- source_word: כָּלֵב
  choice: 迦勒
  rationale: 人名采用现代中文圣经中通行的音译。
- source_word: חָרָן
  choice: 哈兰
  rationale: 人名采用通行音译，并在本节两处保持一致。
- source_word: מוֹצָא
  choice: 摩撒
  rationale: 人名采用现代中文圣经中通行的音译。
- source_word: גָּזֵז
  choice: 迦谢
  rationale: 人名采用通行音译，并在本节两处保持一致，以保留原文所列的同名关系。
- source_word: וְ
  choice: 和／；
  rationale: 列举人名时译作“和”；连接两个家谱分句时用分号体现其并列关系，符合自然汉语表达。
- source_word: אֶת
  choice: 不单独译出
  rationale: 希伯来语直接宾语标记在汉语中没有对应词，其功能由语序表达。
