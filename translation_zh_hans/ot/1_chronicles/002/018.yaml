base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
translation:
  language: zh_hans
  text: 希斯仑的儿子迦勒与妻子阿苏巴生了孩子[a]，也与耶略生了孩子；她的儿子[b]是耶设、朔罢和押墩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来文的句法较难。“耶略”可理解为另一位与迦勒有关的女子；也有解释认为，这个名字与“阿苏巴”构成同位关系。
    reason: alternative_reading
  - marker: b
    text: 希伯来文是“她的儿子”，所用词尾为阴性单数。有人以不同方式重构这段家谱，但马所拉文本确实使用阴性单数词尾。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: 生了孩子
  rationale: 使役形在家谱中通常表示“生、作父亲”。鉴于后文列出与迦勒相关的女子，译作“与……生了孩子”既符合现代汉语，又不过度限定孩子的数目或性别。
- source_word: אֶת עֲזוּבָה אִשָּׁה וְאֶת יְרִיעוֹת
  choice: 与妻子阿苏巴……也与耶略
  rationale: 原文结构压缩且语法困难。正文把“妻子”视为“阿苏巴”的同位说明，并将“耶略”理解为另一位与迦勒生育有关的女子；脚注保留耶略也可能与阿苏巴构成同位关系的解释。
- source_word: אִשָּׁה
  choice: 妻子
  rationale: 该词可指“女人”或“妻子”；在此家谱语境中，“妻子”较自然。希伯来文没有明示所属关系，因此中文不另加“他的”。
- source_word: יְרִיעוֹת
  choice: 耶略
  rationale: 按常用中文圣经人名形式音译。
- source_word: וְאֵלֶּה בָנֶיהָ
  choice: 她的儿子是
  rationale: בָנֶיהָ 的词尾是阴性单数，直译为“她的儿子”。保留该形式，不为理顺家谱而改成“他的儿子”。
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  choice: 耶设、朔罢和押墩
  rationale: 采用现代中文圣经中较通行的人名译法。
theological_decisions:
- issue: 本节所列女子及儿子归属的家谱歧义
  choice: 正文按马所拉文本的阴性单数词尾译作“她的儿子”，并把阿苏巴与耶略呈现为分别与迦勒生育有关的女子。
  alternative: 耶略可能是阿苏巴的同位称谓，而非另一位女子；也有人据不同的家谱重构方式理解这些儿子的归属。
  rationale: 这是句法和家谱结构上的歧义，并非教义判断。正文保留马所拉文本明确的语法信息，脚注说明难点，避免暗中消除原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。家谱表达力求简洁；以“与……生了孩子”传达 הוֹלִיד 的家谱含义，同时用脚注保留原文难解的句法与人物关系。
