  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: zh_hans
  text: 西割生了睚珥；睚珥在基列地有二十三座城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂגוּב
  choice: 西割
  rationale: 采用现代中文圣经中较通行的人名译法；前缀连词在中文句法中不必机械译出。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 使役形在家谱语境中表示生育、成为父亲；“生了”简洁自然，并保留家谱关系。
- source_word: יָאִיר
  choice: 睚珥
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: וַיְהִי לוֹ
  choice: 睚珥……有
  rationale: היה与ל构成领有表达；译为“有”符合现代汉语。为避免代词指向不明，按希伯来语中最近的阳性单数先行词重述“睚珥”。
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  choice: 二十三
  rationale: 按现代汉语的自然数词顺序翻译。
- source_word: עָרִים
  choice: 座城
  rationale: עִיר可指城或城镇；此处采用简明的“城”，并加量词“座”，使中文自然。
- source_word: בְּאֶרֶץ הַגִּלְעָד
  choice: 在基列地
  rationale: 保留אֶרֶץ的地域含义，同时采用简洁自然的中文地名表达。
