base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
translation:
  language: zh_hans
  text: 基列耶琳的宗族有：以帖族[a]、普特族、舒玛族和密斯拉族。从这些宗族中出了[b]琐拉族和以实陶族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”也可译作“家族”；这里的希伯来语通常指支派或谱系中的较大亲属群体。
    reason: lexical_alternative
  - marker: b
    text: “出了”直译为“出去”或“出来”；这里表示琐拉族和以实陶族源自前述宗族。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: 宗族
  rationale: 在家谱语境中，מִשְׁפָּחוֹת 指较大的亲属群体或氏族，而非仅指核心家庭；“宗族”在现代汉语中较准确且自然。
- source_word: קִרְיַת יְעָרִים
  choice: 基列·耶琳
  rationale: 作为地名，采用音译，并以间隔号清楚呈现复合名称。
- source_word: הַיִּתְרִי
  choice: 以帖族
  rationale: 这是族名或居民称谓；以音译词干加“族”表达其群体性质。
- source_word: וְהַפּוּתִי
  choice: 布特族
  rationale: 按希伯来语形式音译，并加“族”标明族群称谓。
- source_word: וְהַשֻּׁמָתִי
  choice: 书玛族
  rationale: 保留专名的音译形式，并用“族”体现家谱中的宗族身份。
- source_word: וְהַמִּשְׁרָעִי
  choice: 密施拉族
  rationale: 按源语音译族名，并加“族”，避免将不确定的专名含义翻译出来。
- source_word: מֵאֵלֶּה
  choice: 从这些宗族中
  rationale: 明确回指前述各宗族；补出“宗族”使现代汉语指代清楚。
- source_word: יָצְאוּ
  choice: 出了
  rationale: 保留“出来、出自”的源语意象及其谱系起源含义，不直接收窄为“后裔”。
- source_word: הַצָּרְעָתִי
  choice: 琐拉族
  rationale: 这是与琐拉相关的族群或居民称谓，采用惯常音译词干加“族”。
- source_word: וְהָאֶשְׁתָּאֻלִי
  choice: 以实陶族
  rationale: 这是与以实陶相关的族群或居民称谓，采用音译并加“族”。
