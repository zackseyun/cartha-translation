  text: וַ/יִּהְי֧וּ בְנֵי יְרַחְמְאֵ֛ל בְּכ֥וֹר חֶצְר֖וֹן הַ/בְּכ֣וֹר רָ֑ם וּ/בוּנָ֥ה וָ/אֹ֛רֶן וָ/אֹ֖צֶם אֲחִיָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
translation:
  language: zh_hans
  text: 希斯仑的长子耶拉篾[a]的儿子有：长子兰、布拿、阿连、阿鲜和亚希雅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的句法可理解为：这里列出耶拉篾的五个儿子，其中兰被称为“长子”。有些解释者认为“亚希雅”与这份名单的关系应作不同理解，但最直接的读法是把“亚希雅”看作名单中的另一个人名。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 有
  rationale: 在家谱列举中，该动词用于引出家族成员；汉语以“儿子有”表达最自然。
- source_word: בְנֵי
  choice: 儿子
  rationale: 此处列举具名男性后代，译作“儿子”保留原文的性别和家谱含义。
- source_word: יְרַחְמְאֵל
  choice: 耶拉篾
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: בְּכוֹר חֶצְרוֹן
  choice: 希斯仑的长子
  rationale: 该短语说明耶拉篾在希斯仑众子中的身份；汉语属格结构清楚保留同位关系。
- source_word: הַבְּכוֹר
  choice: 长子
  rationale: 重复的称谓最自然地指兰，说明他是耶拉篾的长子；不省略，以保留希伯来文的重复。
- source_word: רָם
  choice: 兰
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וּבוּנָה
  choice: 布拿
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וָאֹרֶן
  choice: 阿连
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וָאֹצֶם
  choice: 阿鲜
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֲחִיָּה
  choice: 亚希雅
  rationale: 按专名理解并采用通行中文音译；其在句中与前面诸名并列。
theological_decisions:
- issue: אֲחִיָּה在名单中的句法身份
  choice: 将“亚希雅”列作耶拉篾的第五个儿子
  alternative: 将该词以不同方式联系于名单，如按亲属称谓或其他句法关系理解
  rationale: 马所拉文本最直观的句法是把它视为继阿鲜之后的另一个人名，但注释保留学界提出的其他理解。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语家谱体。“希斯仑的长子”紧接“耶拉篾”，明确其所修饰的对象；冒号帮助读者辨明随后列出的诸子，同时不改动原文关系。
