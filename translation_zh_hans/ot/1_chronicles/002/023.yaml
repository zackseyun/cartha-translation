base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
translation:
  language: zh_hans
  text: 但基述和亚兰从他们手中夺取了睚珥的村庄[a]，连同基纳及其附属城镇[b]，共六十座城。这些全都归玛吉的子孙[c]所有；玛吉是基列的父亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可音译为“哈沃特·睚珥”；这个地名的意思是“睚珥的帐篷村落”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“它的女儿们”，指基纳周围隶属于它的聚落。
    reason: cultural_note
  - marker: c
    text: “玛吉的子孙”也可理解为玛吉的后裔或宗族成员，不一定仅指他的亲生儿子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 夺取了
  rationale: 此处涉及城邑从一方控制转入另一方，译作“夺取”比单纯“拿走”自然，同时不额外限定具体军事过程。
- source_word: גְּשׁוּר וַאֲרָם
  choice: 基述和亚兰
  rationale: 按希伯来文保留两个专名；“亚兰”比“叙利亚”更直接对应原名。
- source_word: חַוֺּת יָאִיר
  choice: 睚珥的村庄
  rationale: 该表达既可视为地名，也有“睚珥的村庄”这一透明词义；正文采用易懂的意译，脚注保留音译可能。
- source_word: מֵאִתָּם
  choice: 从他们手中
  rationale: 表达这些城邑脱离前述群体的占有或控制，比机械译作“从他们那里”更符合现代汉语。
- source_word: קְנָת
  choice: 基纳
  rationale: 采用常见的中文圣经地名音译。
- source_word: בְּנֹתֶיהָ
  choice: 其附属城镇
  rationale: 原文直译为“它的女儿们”，是指中心城周围受其管辖或依附于它的聚落；正文按实际所指翻译，脚注说明原喻。
- source_word: שִׁשִּׁים עִיר
  choice: 共六十座城
  rationale: “共”清楚表明这是前述城邑的总数；“座城”自然对应 עִיר。
- source_word: כָּל אֵלֶּה
  choice: 这些全都
  rationale: 保留指代上的简洁性，不擅自补出“地方”或“人”；后接“玛吉的子孙”仍保留原文在句法和所指上的张力。
- source_word: בְּנֵי מָכִיר
  choice: 玛吉的子孙
  rationale: בנים 可指儿子，也可广指后裔或宗族成员；在此家谱与地域语境中，“子孙”自然且不过分限定为亲生儿子。
- source_word: אֲבִי גִלְעָד
  choice: 玛吉是基列的父亲
  rationale: 保留希伯来文“父亲”的亲属称谓，不将其解释性改写为“祖先”或“创立者”。
