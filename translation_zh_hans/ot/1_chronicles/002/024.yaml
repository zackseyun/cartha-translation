  text: וְ/אַחַ֥ר מוֹת חֶצְר֖וֹן בְּ/כָלֵ֣ב אֶפְרָ֑תָה וְ/אֵ֤שֶׁת חֶצְרוֹן֙ אֲבִיָּ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶת אַשְׁח֖וּר אֲבִ֥י תְקֽוֹעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
translation:
  language: zh_hans
  text: 希斯仑死后，在迦勒—以法他[a]，希斯仑的妻子亚比雅给他生了亚施户；亚施户是提哥亚之父[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在迦勒—以法他”这句希伯来文较难理解，可能是地名，也可能是宗族称号；传统上也写作“迦勒以法他”。
    reason: alternative_reading
  - marker: b
    text: 或译“提哥亚的创建者”。家谱中的“父”不一定只指亲生父亲，也可指某聚落或宗族的创建者、重要先祖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר מוֹת חֶצְרוֹן
  choice: 希斯仑死后
  rationale: 将介词 אַחַר 与不定式 מוֹת 构成的时间表达自然译为“死后”，准确而符合现代汉语。
- source_word: בְּכָלֵב אֶפְרָתָה
  choice: 在迦勒—以法他
  rationale: 保留介词 בְּ 的处所义，并把难解的两个名称成分作为一个复合称谓处理；不在正文中武断判定它究竟是地名还是宗族称号。
- source_word: וְאֵשֶׁת חֶצְרוֹן אֲבִיָּה
  choice: 希斯仑的妻子亚比雅
  rationale: 按希伯来语同位结构理解，亚比雅是希斯仑妻子的名字；采用现代汉语自然语序。
- source_word: וַתֵּלֶד לוֹ
  choice: 给他生了
  rationale: 既表达 יָלַד 的生育含义，也保留 לוֹ 所指明的与希斯仑的关系。
- source_word: אַשְׁחוּר
  choice: 亚施户
  rationale: 按希伯来语辅音与马所拉读音音译该人名，并采用适合中文圣经人名的音译形式。
- source_word: אֲבִי תְקוֹעַ
  choice: 提哥亚之父
  rationale: 正文直译 אָב 为“父”，保留家谱用语可能涵盖父祖、宗族首领或聚落创立者的语义范围，并以脚注说明。
theological_decisions: []
