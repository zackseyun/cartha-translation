  yaml_path: translation/ot/1_chronicles/002/006.yaml
  text: 'And the sons of Zerah: Zimri[a], Ethan, Heman, Kalkol[b], and Dara—five in all.'
translation:
  language: zh_hans
  text: 谢拉的儿子是心利、以探、希幔、甲各和大拉[a]，共五人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文本作“大拉”；《列王纪上》4:31 的平行记载作“达大”。
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי זֶרַח
  choice: 谢拉的儿子
  rationale: בְנֵי 是“儿子”的复数构造式；在家谱中按通常用法译为“儿子”。句首 וּ 承接前文，中文家谱列表中可不另译“和”。
- source_word: זִמְרִי
  choice: 心利
  rationale: 人名按现代中文圣经通行译名音译。
- source_word: וְאֵיתָן
  choice: 以探
  rationale: 人名按现代中文圣经通行译名音译；前缀 וְ 的并列关系由中文顿号及末项前的“和”表达。
- source_word: וְהֵימָן
  choice: 希幔
  rationale: 人名按现代中文圣经通行译名音译。
- source_word: וְכַלְכֹּל
  choice: 甲各
  rationale: 人名 כַלְכֹּל 采用中文圣经中较为通行的译名“甲各”。
- source_word: וָדָרַע
  choice: 大拉
  rationale: 严格依据本节马所拉文本 דָרַע 音译，不与《列王纪上》4:31 的 דַּרְדַּע（达大）协调。
- source_word: כֻּלָּם חֲמִשָּׁה
  choice: 共五人
  rationale: 直义为“他们全体五个”；“共五人”自然、简洁地保留总数含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简明的家谱体。人名尽量沿用现代中文圣经的熟悉形式；不把平行经文的异文带入正文。英文资料所列脚注标记与脚注内容似有错位：关于 כַלְכֹּל 的传统英文拼法并不构成中文翻译所需的实质异文，因此不设中文脚注；大拉与达大的文本差异则保留脚注说明。
