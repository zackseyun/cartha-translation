  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian slave whose name was Jarha.
translation:
  language: zh_hans
  text: 示珊没有儿子，只有女儿。示珊有一个埃及奴隶[a]，名叫耶拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希伯来语 עֶבֶד 可指仆人或奴隶；这里译作“奴隶”，以保留其受支配身份的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה לְשֵׁשָׁן
  choice: 示珊有
  rationale: 希伯来语“为某人而有”的结构表示领有关系；现代汉语自然表达为“某人有”。
- source_word: בָּנִים
  choice: 儿子
  rationale: 此词与下文“女儿”形成明确对照，因此应译为“儿子”，而非泛指“孩子”。
- source_word: כִּי אִם
  choice: 只有
  rationale: 用于否定结构之后，表示“除……以外／唯有”；“没有儿子，只有女儿”准确而自然。
- source_word: בָּנוֹת
  choice: 女儿
  rationale: 直接保留家谱语境中与“儿子”相对的女性后代称谓。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 该词可指仆人或奴隶；此处译作“奴隶”，以免淡化其受支配、受役使的身份，同时用脚注保留另一种可能译法。
- source_word: מִצְרִי
  choice: 埃及
  rationale: 表明此人的族属或来源；置于“奴隶”前译作“埃及奴隶”简洁自然。
- source_word: וּשְׁמוֹ
  choice: 名叫
  rationale: 原文直译为“他的名字是”；现代汉语用“名叫”更流畅，信息不变。
- source_word: יַרְחָע
  choice: 耶哈
  rationale: 按中文圣经人名的通行音译处理。
