base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/033.yaml
  text: 'And the sons of Jonathan: Peleth and Zaza. These were the sons of Jerahmeel.'
translation:
  language: zh_hans
  text: 约拿单的儿子是毗勒和撒萨。这些人都是耶拉篾的子孙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יוֹנָתָן
  choice: 约拿单的儿子是
  rationale: וּ承接前文的家谱次序，中文分节后不必机械译作“和”；בְנֵי在此指约拿单的亲生儿子，采用自然的领属结构，并补出判断词“是”。
- source_word: פֶּלֶת
  choice: 毗勒
  rationale: 按现代中文圣经人名的通行形式音译该希伯来专名。
- source_word: וְזָזָא
  choice: 和撒萨
  rationale: 保留连接两个名字的并列关系，并按音值译写专名。
- source_word: אֵלֶּה הָיוּ
  choice: 这些人都是
  rationale: אֵלֶּה回指刚列出的约拿单诸子；הָיוּ在家谱总结句中起系词作用。加入“人”使现代汉语指代清楚，“都”自然表达复数归属。
- source_word: בְּנֵי יְרַחְמְאֵל
  choice: 耶拉篾的子孙
  rationale: 此处回顾整段耶拉篾家系，所指不只是他的直接儿子，因此将范围较宽的家谱用法בְּנֵי译为“子孙”，避免与上一分句中约拿单的直接“儿子”混淆。
