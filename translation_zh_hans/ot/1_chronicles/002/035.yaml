  text: Sheshan gave his daughter to Jarha his slave as a wife[a], and she bore Attai to him.
translation:
  language: zh_hans
  text: 示珊把女儿嫁给他的奴隶[a]耶拉；她给他生了亚太。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”或译“仆人”。希伯来语 עֶבֶד 可指仆人，也可指奴隶；这里译为“奴隶”，因为耶拉在示珊家中的依附身份似乎是这段家谱叙述中特意说明的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן ... אֶת־בִּתּוֹ ... לְאִשָּׁה
  choice: 把女儿嫁给
  rationale: 希伯来文直译为“把他的女儿给……为妻”；现代汉语用“把女儿嫁给”自然清楚，也准确表达婚姻语境。
- source_word: שֵׁשָׁן
  choice: 示珊
  rationale: 按现代中文圣经人名惯例音译。
- source_word: יַרְחָע
  choice: 雅哈
  rationale: 按现代中文圣经人名惯例音译。
- source_word: עַבְדּוֹ
  choice: 他的奴仆
  rationale: עֶבֶד可指仆人或奴隶；此处身份依附于示珊家中，译作“奴仆”既体现从属身份，也符合庄重的现代汉语表达。
- source_word: וַתֵּלֶד לוֹ
  choice: 她给他生了
  rationale: 保留希伯来文生育公式中“给他生”的关系表达，中文自然且简洁。
- source_word: עַתָּי
  choice: 亚太
  rationale: 按现代中文圣经人名惯例音译。
