base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/031.yaml
  text: These also cast lots alongside their brothers[a], the sons of Aaron, before King David, Zadok, Ahimelech[b], and the heads of the fathers’ houses of the priests and of the Levites—the chief fathers’ houses as well as those of their younger brothers.
translation:
  language: zh_hans
  text: 这些人也在大卫王、撒督、亚希米勒，以及祭司和利未人各父家的首领面前，与他们的弟兄——亚伦的子孙——一同[a]抽签；首要的父家和较小弟兄的父家同等对待。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一同”也可译作“与他们的弟兄，即亚伦的子孙，相对应”。原文用语可表示在对面、相对应或并列。
    reason: lexical_alternative
  - marker: b
    text: 原文末尾直译近似“首要者的父家，与其较小的弟兄相对应”。这些单数形式可能有分配意义，表示首要或较大的家支与较小弟兄的家支在抽签时同等对待；原文的具体句法关系并不完全确定。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיַּפִּילוּ ... גּוֹרָלוֹת
  choice: 抽签
  rationale: 这是希伯来语表示以签决定次序或职分的惯用语；“抽签”符合现代汉语表达，也保留正式分派的含义。
- source_word: גַם הֵם
  choice: 这些人也
  rationale: 承接上文所述的利未人群体，并表明他们和亚伦的子孙一样参与抽签。
- source_word: לְעֻמַּת אֲחֵיהֶם בְּנֵי אַהֲרֹן
  choice: 和他们的弟兄亚伦的子孙一同
  rationale: לְעֻמַּת 可表示“在……对面、与……相对应、和……并列”。正文采用自然且不过度限定具体安排的“一同”，脚注保留“相对应”的可能。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 表达抽签是在这些见证人或负责人在场的正式场合进行。
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 各父家的首领
  rationale: “父家”指以父系为基础的宗族单位；加“各”使中文自然，并明确“首领”指这些父家的负责人。
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: 祭司和利未人各父家的
  rationale: 按语境将介词理解为界定这些父家首领所属的两类群体。
- source_word: אָבוֹת הָרֹאשׁ לְעֻמַּת אָחִיו הַקָּטָן
  choice: 为首的父家和兄弟中较小的，都同样抽签
  rationale: 原文末句高度浓缩，且使用单数形式。译文将其理解为分配性表达：居首或较大的家支与较小的弟兄或家支受到同等对待；脚注保留较直译的形式与歧义。
