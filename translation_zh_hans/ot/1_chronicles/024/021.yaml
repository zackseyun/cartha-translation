  text: For Rehabiah[a], from the sons of Rehabiah, the chief was Isshiah.
translation:
  language: zh_hans
  text: 至于利哈比雅[a]；在利哈比雅的子孙中，首领是耶希雅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“论到利哈比雅，在利哈比雅的子孙中，耶希雅为首。”
    reason: 原文两个前置词 לְ 都用于引出名录中的家族／支系项目；“为首”较贴近 הָרֹאשׁ 的字面表达。
lexical_decisions:
- source_word: לִ/רְחַבְיָהוּ
  choice: 至于利哈比雅
  rationale: 前置词 לְ 在此引出名单中的下一个家族项目；译作“至于”自然地保留了转入该支系的列举功能。
- source_word: לִ/בְנֵי רְחַבְיָהוּ
  choice: 利哈比雅的子孙中
  rationale: בְּנֵי 可指儿子，也可在家谱中泛指男性后裔或所属支系；此处列举家族负责人，译作“子孙中”既符合语境，也表达伊示雅出自该支系。前置词 לְ 的具体关系略有压缩，另以脚注保留较直译的句法可能。
- source_word: הָ/רֹאשׁ
  choice: 族长
  rationale: רֹאשׁ 字面为“头”，在此祭司班次与家族名录的行政语境中指该家族支系的首领；“族长”比“头”自然，也比泛称“首领”更贴合家族语境。
- source_word: יִשִּׁיָּה
  choice: 伊示雅
  rationale: 按希伯来人名音译，并采用现代中文圣经人名中清楚、庄重的形式。
- source_word: רְחַבְיָהוּ
  choice: 利哈比雅
  rationale: 该人名在本节重复出现，统一音译为“利哈比雅”。
