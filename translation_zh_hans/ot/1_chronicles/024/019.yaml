base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/019.yaml
  text: These were their appointed duties for their service[a], to enter the house of Yahweh according to their ordinance, under the hand of Aaron their father, as Yahweh, the God of Israel[b], had commanded him.
translation:
  language: zh_hans
  text: 这些是他们受派承担的事奉职责：他们照着为他们所定的规例[a]进入耶和华的殿，遵从他们祖先亚伦的指示[b]，正如以色列的神耶和华所吩咐亚伦的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按照为他们所定的次序。”这里的希伯来词可指规例、规则或规定的程序。
    reason: lexical_alternative
  - marker: b
    text: 直译“借着他们祖先亚伦的手”。这是可表示经由、管理或权柄的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם לַעֲבֹדָתָם
  choice: 他们受派承担的事奉职责
  rationale: פְקֻדָּה在此指正式指派的职分或任务，עֲבֹדָה则指祭司在圣殿中的礼仪性事奉；合译既表达委派，也表达实际职责。
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: 进入耶和华的殿
  rationale: בוא基本义为“来、进入”；在此语境中指祭司进入圣殿履行职务。“耶和华的殿”保留בית יהוה的希伯来表达。
- source_word: כְּמִשְׁפָּטָם
  choice: 按照为他们所定的规例
  rationale: מִשְׁפָּט在此不是司法判决，而是规范祭司事奉的既定规章或程序；措辞保留其可兼指“规定次序”的语义。
- source_word: בְּיַד אַהֲרֹן
  choice: 在……亚伦的手下
  rationale: 保留希伯来语“在……手下”的形象，同时自然传达由亚伦管理或在其权柄之下的意思。
- source_word: אֲבִיהֶם
  choice: 他们祖先
  rationale: 字面为“他们的父亲”，但这里亚伦是后世祭司群体的先祖；译作“祖先”可避免现代读者误以为是直接父子关系。
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: 正如……吩咐亚伦的
  rationale: 动词后的阳性单数宾语代词指亚伦；明确重复其姓名，可避免中文代词指向不清。
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 耶和华—以色列的神—
  rationale: “耶和华”音译神名；破折号体现“以色列的神”是对该名的同位说明。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名形式“耶和华”，并保留原文所用的盟约神名，而不以“主”替代。
- issue: בְּיַד אַהֲרֹן所表达的祭司管理关系
  choice: 在他们祖先亚伦的手下
  alternative: 由他们祖先亚伦经手／在他们祖先亚伦的权下
  rationale: 原短语既可涉及执行媒介，也可表示管理权柄；保留“手下”这一形象，不把语义过度限定为单纯代理或抽象权威。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“事奉”契合祭司礼仪语境；“供职”使动作关系清楚。以冒号呈现总述与具体说明，以破折号标明神名后的同位语。
