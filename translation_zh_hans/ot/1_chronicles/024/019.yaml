revisions:
- from: 这些是他们受派承担的事奉职责：他们要按照为他们所定的规例[a]，进入耶和华的殿，在他们祖先亚伦的手下[b]供职，正如耶和华—以色列的神—吩咐亚伦的。
  to: 这些是他们受派承担的事奉职责：他们照着为他们所定的规例[a]进入耶和华的殿，遵从他们祖先亚伦的指示[b]，正如以色列的神耶和华所吩咐亚伦的那样。
  rationale: 修订使比较句完整，并将“借亚伦之手”处理为遵从其指示，避免将祖先亚伦不必要地描写为后世祭司的直接在任上司。脚注保留原文“手”的意象和该惯用语的开放语义。
