lexical_decisions:
- source_word: לְהַקּוֹץ
  choice: 归哈歌斯
  rationale: 前缀 ל 在祭司班次抽签分派的名单中表示归属或分配；“归”符合现代汉语名单体例，哈歌斯按圣经常用译名处理。
- source_word: הַשְּׁבִעִי
  choice: 第七签
  rationale: 带定冠词的序数词指抽签所得的第七顺位；补出“签”承接本段抽签语境，使汉语表意完整而不改变所指。
- source_word: לַאֲבִיָּה
  choice: 归亚比雅
  rationale: 前缀 ל 与前句平行，标示第八顺位所归属的祭司家族；亚比雅采用通行中文音译。
- source_word: הַשְּׁמִינִי
  choice: 第八签
  rationale: 带定冠词的序数词与“第七签”平行，表示抽签次序中的第八位。
