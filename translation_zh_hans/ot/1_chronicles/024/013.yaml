lexical_decisions:
- source_word: לְ/חֻפָּה
  choice: 归胡巴
  rationale: 前缀 לְ 在祭司班次抽签分派的清单中表示归属或分配；“归胡巴”符合现代汉语列举签次的表达，也保留了指派关系。专名按希伯来语音译为“胡巴”。
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: 第十三签
  rationale: 原文虽采用基数词形式，但在上下文中表示抽签所得的次序；汉语用“第十三签”可自然、明确地传达其序数功能，并补出语境中省略的“签”。
- source_word: לְ/יֶשֶׁבְאָב
  choice: 归耶是比押
  rationale: 此处 לְ 同样表示该签所归属的祭司家族或班次；“归”简洁地表达分派关系。专名按希伯来语音译为“耶是比押”。
- source_word: אַרְבָּעָה עָשָׂר
  choice: 第十四签
  rationale: 该基数词在抽签次序中作序数使用；译作“第十四签”符合现代汉语，也承接本章上下文。
