lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: 亚伦子孙的……如下
  rationale: 原文直译近于“至于亚伦的子孙”，在此作为新段落的标题式引介；用“……如下”自然表达其篇章功能，不另加原文没有的时间词。
- source_word: מַחְלְקוֹתָם
  choice: 班次
  rationale: 该词指按安排组成的分组；本段语境涉及祭司职务的编组，“班次”既准确又符合现代中文表达，同时保留“分组、编班”的含义。
- source_word: בְּנֵי אַהֲרֹן
  choice: 亚伦的儿子
  rationale: 直接保留亲属关系和原文阳性所指；此处随后列出亚伦四个儿子的名字。
- source_word: נָדָב
  choice: 拿答
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וַאֲבִיהוּא
  choice: 亚比户
  rationale: 采用现代中文圣经中通行的人名译法；并列关系由中文顿号和末项前的“和”自然表达。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וְאִיתָמָר
  choice: 和以他玛
  rationale: 采用现代中文圣经中通行的人名译法，并保留末项前的连接关系。
