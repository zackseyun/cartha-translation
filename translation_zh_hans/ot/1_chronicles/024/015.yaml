- source_word: לְחֵזִיר
  choice: 归希悉
  rationale: 介词לְ在抽签分班的名单中表示签次所归属的对象；译作“归”自然地表达分配关系。“希悉”按希伯来人名חֵזִיר音译，并采用通行的中文圣经人名形式。
- source_word: שִׁבְעָה עָשָׂר
  choice: 第十七签
  rationale: 基数形式在此按名单语境表达次序，即第十七个签次；补出语境中省略的“签”，使现代中文清楚自然。
- source_word: לְהַפִּצֵּץ
  choice: 归哈辟悉
  rationale: 介词לְ同样表示签次归属；“哈辟悉”按希伯来人名הַפִּצֵּץ音译，并采用通行的中文圣经人名形式。
- source_word: שְׁמוֹנָה עָשָׂר
  choice: 第十八签
  rationale: 在连续列举祭司班次抽签结果的语境中作序数理解；译出“签”以明确其所指。
