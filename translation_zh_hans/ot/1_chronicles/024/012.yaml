- source_word: עַשְׁתֵּי עָשָׂר
  choice: 第十一签
  rationale: 原文形式上是基数词“十一”，但在连续列举签次的语境中具有序数功能。补出“签”承接本段掣签的明确语境，使汉语表达完整自然。
- source_word: לְ/יָקִים
  choice: 归雅金
  rationale: 前缀 לְ 同样表示分配归属；译作“归”。יָקִים 按其读音音译为“雅金”。
- source_word: שְׁנֵים עָשָׂר
  choice: 第十二签
  rationale: 原文形式上是基数词“十二”，在本名单中表示顺序；译为“第十二签”，与前半句平行并符合现代汉语习惯。
