base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/004.yaml
  text: 'The sons of Eleazar were found to be more numerous[a], as heads of the men, than the sons of Ithamar, and they divided them thus: for the sons of Eleazar, sixteen heads of fathers’ houses, and for the sons of Ithamar, according to their fathers’ houses[b], eight.'
translation:
  language: zh_hans
  text: 以利亚撒的子孙中，被查出作首领的人比以他玛的子孙中更多[a]；他们便这样分配：以利亚撒的子孙有十六位父系家族首领[b]，以他玛的子孙有八位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作首领的人”所对应的希伯来语也可较直译为“作众男子首领的”。其中“男子”一词有时也可指强健或勇武的人；这里的语境是祭司家族的首领。
    reason: lexical_alternative
  - marker: b
    text: “父系家族”指由共同父系祖先延续下来的宗族或家户，是古代以色列常用的亲族和行政单位。本句中的十六位和八位，都是按各自父系家族计算的首领数。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמָּצְאוּ רַבִּים
  choice: 更多
  rationale: נמצא的被动式在此表示经查明所得的结果；רבים在与以他玛子孙的对比中具有比较义。中文用“比……更多”自然表达这一结果，无须机械译出“被发现”。
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: 作首领的人
  rationale: רֹאשׁ表示首领；גְּבָרִים可指男子、强健者或勇士，但本节处理祭司家族的负责人，并无明确军事语境。“作首领的人”符合上下文，同时以脚注保留原词可能具有的较强语气。
- source_word: וַיַּחְלְקוּם
  choice: 他们把这些人分组
  rationale: 动词表示划分、编组，宾语指前述人员。此处是在设立祭司班次的语境中，“分组”比单纯“分开”更清楚。
- source_word: רָאשִׁים
  choice: 首领
  rationale: 与前面的רָאשֵׁי保持术语一致，指各父系家族的负责人。
- source_word: לְבֵית אָבוֹת / לְבֵית אֲבוֹתָם
  choice: 按父系家族
  rationale: בֵּית אָבוֹת是以色列家谱和行政结构中的亲族单位。“按父系家族”既表达לְ在此的分类关系，也让现代读者容易理解。
- source_word: שִׁשָּׁה עָשָׂר / שְׁמוֹנָה
  choice: 十六位／八位
  rationale: 两项数字在句法上承接“首领”，中文补出量词“位”，并在后一分句补出“首领”，避免歧义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“作首领的人”避免生硬的“众男子的头”，又不把本节无明确依据地军事化；“父系家族”比传统的“父家”更便于普通现代读者理解。
