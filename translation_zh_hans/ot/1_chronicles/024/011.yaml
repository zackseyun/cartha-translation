  text: 第九是耶书亚，第十是示迦尼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיֵשׁוּעַ
  choice: 是耶书亚
  rationale: 介词לְ在本段按抽签排列祭司班次的语境中表示归属或分配；汉语列表用“是”简洁自然地表达第九班所归的人名。人名按通行形式音译为“耶书亚”。
- source_word: הַתְּשִׁעִי
  choice: 第九
  rationale: 带定冠词的序数词在此独立使用，指排列中的第九个班次；译作“第九”保留原文简洁的列举形式。
- source_word: לִשְׁכַנְיָהוּ
  choice: 是示迦尼
  rationale: 介词לְ同样表示该班次的归属；汉语以“是”承接列举结构。人名שְׁכַנְיָהוּ采用通行音译“示迦尼”。
- source_word: הָעֲשִׂרִי
  choice: 第十
  rationale: 带定冠词的序数词指排列中的第十个班次；译作“第十”准确且符合现代汉语表达。
