  text: וַֽ/יִּכְתְּבֵ֡/ם שְֽׁמַֽעְיָה֩ בֶן נְתַנְאֵ֨ל הַ/סּוֹפֵ֜ר מִן הַ/לֵּוִ֗י לִ/פְנֵ֨י הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ וְ/צָד֣וֹק הַ/כֹּהֵ֗ן וַ/אֲחִימֶ֨לֶךְ֙ בֶּן אֶבְיָתָ֔ר וְ/רָאשֵׁי֙ הָֽ/אָב֔וֹת לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם בֵּֽית אָ֣ב אֶחָ֗ד אָחֻז֙ לְ/אֶלְעָזָ֔ר וְ/אָחֻ֥ז אָחֻ֖ז לְ/אִיתָמָֽר־־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/006.yaml
  text: Shemaiah son of Nethanel[a], the scribe from among the Levites, recorded them in the presence of the king, the officials, Zadok the priest, Ahimelech son of Abiathar, and the heads of the fathers’ houses of the priests and of the Levites—one father’s house being taken for Eleazar, and one being taken for Ithamar.
translation:
  language: zh_hans
  text: 利未人中的书记、拿坦业的儿子示玛雅，在王、众官长、祭司撒督、亚比亚他的儿子亚希米勒，以及祭司和利未人各父家的首领面前，把他们登记下来：以利亚撒一系有一个父家被选出，以他玛一系也有一个父家被选出。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里十分简略，直译近似：“一个父家被取给以利亚撒，又被取、被取给以他玛。”这种重复可能表示从以利亚撒和以他玛两系轮流或逐一选取父家。
    reason: 说明原文压缩且重复的被动句法，并保留其可能具有的轮流、逐一选取之意。
lexical_decisions:
- source_word: וַיִּכְתְּבֵם
  choice: 把他们登记下来
  rationale: כתב在此指把上文所分的班次或相关人员写入记录；“登记下来”既保留书面记录的含义，也符合行政编排的语境。宾语后缀直译为“他们”，不擅自限定为名字、班次或抽签结果。
- source_word: הַסּוֹפֵר
  choice: 书记
  rationale: סֹפֵר可指负责书写和记录的官员；“书记”自然、庄重，并适合本节公开登记的场景。
- source_word: מִן הַלֵּוִי
  choice: 利未人中的
  rationale: 保留介词מן的部分性含义，表明示玛雅属于利未群体。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 既贴近原文空间性表达，也自然传达在这些见证人在场时公开办理的意思。
- source_word: הַשָּׂרִים
  choice: 众官长
  rationale: שָׂרִים在王室和行政语境中指有权位的官员或首领；“官长”避免误解为王子。
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 各父家的首领
  rationale: “父家”保留历代志中的宗族行政术语，并用“各……首领”使现代汉语清楚可读。
- source_word: בֵּית אָב אֶחָד
  choice: 一个父家
  rationale: בֵּית אָב指以父系组织的家族或宗族单位；采用“父家”以保持术语透明度。
- source_word: אָחֻז
  choice: 取
  rationale: 该被动分词字面有“被取、被选取”之意；汉语以“取”简洁对应抽签编排时取出一个父家的动作，同时不过度指定具体程序。
- source_word: לְאֶלְעָזָר ... לְאִיתָמָר
  choice: 以利亚撒一系……以他玛一系
  rationale: 介词ל在此表明与两条祭司家系的归属或对应关系；补出“一系”可让普通读者明白所指是两支后裔，又不改变分配关系。
- source_word: וְאָחֻז אָחֻז לְאִיתָמָר
  choice: 以他玛一系也取一个父家
  rationale: 原文重复אָחֻז，句法高度压缩，并可能带有逐一、轮流取选的意味。正文以对称结构传达基本意思，脚注保留原文的不寻常形式及其可能含义。
