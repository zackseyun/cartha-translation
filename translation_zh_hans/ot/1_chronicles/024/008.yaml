  text: 第三签归哈琳，第四签归西伊琳。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְחָרִם
  choice: 归哈琳
  rationale: 前缀 לְ 在这份抽签班次名单中表示签次的归属；现代汉语用“归”能自然表达“分配给”。专名 חָרִם 按希伯来语音译为“哈琳”。
- source_word: הַשְּׁלִישִׁי
  choice: 第三签
  rationale: 带定冠词的序数词在上下文中指第三个签次。汉语补出“签”，使省略结构清楚，同时保留名单的简洁形式。
- source_word: לִשְׂעֹרִים
  choice: 归西俄琳
  rationale: 前缀 לִ 同样表示抽签分配的归属。专名 שְׂעֹרִים 按希伯来语形式音译为“西俄琳”。
- source_word: הָרְבִעִי
  choice: 第四签
  rationale: 带定冠词的序数词与“第三”平行，指第四个签次；补出“签”以符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的名单体表达。“归”比直译为“给”更自然地体现抽签所得的班次归属；补出上下文隐含的“签”，避免中文读者误把序数词理解为人物排行。
