base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/030.yaml
  text: 'And the sons of Mushi: Mahli[a], Eder, and Jeremoth. These were the sons of the Levites according to their fathers'' houses.'
translation:
  language: zh_hans
  text: 母示的儿子是抹利、以得和耶利摩[a]。这些是利未人的子孙，按着他们的父家划分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶利摩”也可音译作“耶利末”。
    reason: 专名 וִירִימוֹת 存在不同的合理音译形式；脚注保留这一异译可能。
lexical_decisions:
- source_word: וּבְנֵי מוּשִׁי
  choice: 母示的儿子是
  rationale: 保留谱系用语“……的儿子”，并以现代汉语自然的判断句引出名单；וּ 表示承接上文，无须机械译出“和”。
- source_word: מַחְלִי וְעֵדֶר וִירִימוֹת
  choice: 抹利、以得和耶利摩[a]
  rationale: 三个专名按希伯来文音译，并用现代汉语列举格式表达连接词。异译说明应标在“耶利摩”之后，因为所涉及的源词是 וִירִימוֹת。
- source_word: בְּנֵי הַלְוִיִּם
  choice: 利未人的子孙
  rationale: 这里的“儿子们”是谱系和支派意义上的后裔；译作“子孙”比逐字译作“儿子”更符合现代汉语，同时保留其族属含义。
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: 按着他们的父家划分
  rationale: 这是谱系及行政编组用语，指依父系家族单位归类；补出“划分”承接本章编班的语境，使汉语完整自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“父家”这一常见的圣经谱系术语；人名使用简体中文圣经传统中易辨认的译法。英文咨询文本将脚注标在“抹利”之后，但脚注内容实际对应 וִירִימוֹת（耶利摩），故依据原文将标记移至正确的人名之后。
