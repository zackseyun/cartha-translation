  text: 第二十一签是雅斤，第二十二签是迦末。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָכִין
  choice: 是雅斤
  rationale: 介词 לְ 在祭司班次的抽签名录中表示归属或分配；结合上文省略而可理解的“签”，译作“签是雅斤”自然地表达该班次归于雅斤。人名按中文圣经通行形式音译。
- source_word: אֶחָד וְ/עֶשְׂרִים
  choice: 第二十一签
  rationale: 希伯来文形式上是基数词“二十一”，但在连续排列的祭司班次清单中具有序数功能；现代汉语用“第二十一”最清楚，“签”承接上文抽签语境。
- source_word: לְ/גָמוּל
  choice: 是迦末
  rationale: 与前半句相同，לְ 表示该签所归属的家族或班次；“迦末”采用中文圣经通行音译。
- source_word: שְׁנַיִם וְ/עֶשְׂרִים
  choice: 第二十二签
  rationale: 原文形式上为“二十二”，在编号名录中按序数理解；译成“第二十二签”符合现代汉语清单表达。
