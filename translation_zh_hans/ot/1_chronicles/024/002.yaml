base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/002.yaml
  text: But Nadab and Abihu died before their father[a], and they had no sons; so Eleazar and Ithamar served as priests.
translation:
  language: zh_hans
  text: 但拿答和亚比户死在他们父亲之前[a]，没有儿子；因此，以利亚撒和以他玛担任祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“死在他们父亲面前”。希伯来语这一短语既可按空间理解为“在……面前”，也可按时间理解为“在……之前”，即他们去世时父亲仍在世。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死
  rationale: 该叙事性动词表示过去发生的死亡事件；现代汉语用“死”简洁自然。
- source_word: לִפְנֵי
  choice: 在……之前
  rationale: 该介词短语既可按时间理解为“先于父亲去世”，也可按空间理解为“在父亲面前”；正文保留简洁而有歧义的“在……之前”，脚注说明另一种理解。
- source_word: אֲבִיהֶם
  choice: 他们父亲
  rationale: 准确表达第三人称阳性复数后缀，所指为拿答和亚比户的父亲亚伦。
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: 没有儿子
  rationale: בָנִים在此明确指男性后代，故译为“儿子”，不泛化为“孩子”。
- source_word: וַיְכַהֲנוּ
  choice: 担任祭司
  rationale: 该动词表示履行祭司职分；“担任祭司”在现代汉语中自然，并保留其动态语义。
- source_word: אֶלְעָזָר וְאִיתָמָר
  choice: 以利亚撒和以他玛
  rationale: 采用中文圣经传统中通行且易识别的人名译法。
