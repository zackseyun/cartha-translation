base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/005.yaml
  text: So they divided them by lots[a], these with those[b], because there were officers of the sanctuary and officers of God from the sons of Eleazar and from the sons of Ithamar.
translation:
  language: zh_hans
  text: 他们用抽签把这些人和那些人[a]分班；因为在以利亚撒的子孙中和以他玛的子孙中，都有圣所的首领和上帝的首领[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“这些与那些”；也可译作“这组和那组”。
    reason: lexical_alternative
  - marker: b
    text: “首领”也可译作“主管”或“官长”。“上帝的首领”按原文直译；原文没有“殿”字。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְלְקוּם
  choice: 把这些人分班
  rationale: חלק的加强词干在此表示划分、分派；结合祭司班次的上下文译为“分班”，既自然又保留具体的分配动作。宾语后缀以“这些人”表达。
- source_word: בְּגוֹרָלוֹת
  choice: 用抽签的方式
  rationale: גּוֹרָל指用于分派的签；介词בְּ表示手段。中文以“用抽签的方式”清楚表达按签分派。
- source_word: אֵלֶּה עִם אֵלֶּה
  choice: 这一方和那一方一同抽签
  rationale: 直译结构是“这些与那些”，所指为以利亚撒和以他玛两方。译文保留双方并列、共同参与的意味，而不进一步限定具体程序。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出采用抽签分班的理由，译作“因为”保留明确的因果关系。
- source_word: שָׂרֵי קֹדֶשׁ
  choice: 圣所的首领
  rationale: שַׂר可指首领、主管或官长；קֹדֶשׁ在祭司职务语境中最自然地指圣所。译文保留其尊贵职分及圣所范围。
- source_word: וְשָׂרֵי הָאֱלֹהִים
  choice: 和上帝的首领
  rationale: 原文直称“上帝的首领”，没有“殿”一词。译文不擅自补出“上帝殿中的”，从而保存与前一短语并列而又不完全明朗的表达。
- source_word: מִבְּנֵי אֶלְעָזָר וּבִבְנֵי אִיתָמָר
  choice: 以利亚撒的子孙中和以他玛的子孙中
  rationale: בְּנֵי在家系语境中包括后代，译作“子孙”比仅指亲生儿子的“儿子”更合适；两个“中”呈现两支家系中都有相关人员。
theological_decisions:
- issue: שָׂרֵי קֹדֶשׁ וְשָׂרֵי הָאֱלֹהִים的关系和所指
  choice: 保留“圣所的首领”和“上帝的首领”两个平行称谓
  alternative: 译作“圣所的主管和上帝殿中的主管”，或把两者合并理解为同一种圣职人员
  rationale: 希伯来文给出两个平行短语，却未说明二者是不同职务、同义称谓，还是分别涉及圣所和圣物的职责。译文不补入原文没有的“殿”或“事务”，以保存这种张力。
- issue: 两支祭司家系与首领的分布
  choice: 译为两支子孙中“都有”这些首领
  alternative: 仅笼统译作“这些首领出自以利亚撒和以他玛的子孙”
  rationale: 上下文以抽签公平安排两支家系；原文两个介词短语并列，支持两方之中均有这些首领。“都有”使中文因果关系通顺，但不规定两类首领在两支家系中的具体人数或比例。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“分班”符合本章祭司班次的语境；“这一方和那一方”保留原文简短的指示结构。两个“首领”称谓刻意保持平行，相关歧义在脚注中说明。
