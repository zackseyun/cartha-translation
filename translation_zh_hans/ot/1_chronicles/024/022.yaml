lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: 至于以斯哈族
  rationale: 介词 ל 在这份利未人班次名单中标示归属或分项；用“至于”自然地呈现名录结构。“以斯哈族”将族称 יִצְהָרִי 译为由以斯哈而出的宗族。
- source_word: שְׁלֹמוֹת
  choice: 示罗摩
  rationale: 这是人名，按现代中文圣经人名的常见音译方式处理，并在本节两处保持一致。
- source_word: לִבְנֵי
  choice: 至于……的子孙
  rationale: 介词 ל 延续分项列举的作用；בְנֵי 在家谱和宗族名单中既可指亲生儿子，也可广指后裔，因此译作“子孙”以保留群体性含义。
- source_word: יָחַת
  choice: 雅哈
  rationale: 这是人名，采用简洁且符合希伯来语音形的中文音译。
