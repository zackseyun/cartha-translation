base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/003.yaml
  text: David[a], with Zadok from the sons of Eleazar and Ahimelech from the sons of Ithamar, divided them according to their appointment in their service.
translation:
  language: zh_hans
  text: 大卫同以利亚撒子孙中的撒督和以他玛子孙中的亚希米勒，按他们供职的安排[a]，把他们分成班次。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安排”也可译作“职任”或“所受的委派”。这里的希伯来语可含职任、委派、监管或有序安排等意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: 把他们分成班次
  rationale: 动词基本义是“把他们分开”；鉴于上下文论及祭司班次，译作“分成班次”既交代语境，又保留分派、划分的核心意思。
- source_word: וְצָדוֹק
  choice: 同……撒督
  rationale: 连接词本义为“和”；汉语用“同”自然表明撒督与大卫一同参与分班。
- source_word: מִן בְּנֵי אֶלְעָזָר
  choice: 以利亚撒子孙中的
  rationale: 介词 מִן 在此说明撒督所属的宗族支系；“子孙中的”比单说“来自子孙”更合乎现代汉语。
- source_word: וַאֲחִימֶלֶךְ
  choice: 和……亚希米勒
  rationale: 按通行中文圣经人名音译处理，并保留其与撒督平行的句法地位。
- source_word: מִן בְּנֵי אִיתָמָר
  choice: 以他玛子孙中的
  rationale: 与“以利亚撒子孙中的”平行，说明亚希米勒所属的祭司宗族支系。
- source_word: לִפְקֻדָּתָם
  choice: 按……职任
  rationale: פְּקֻדָּה 可指委派、职分、监管或有序安排；在祭司行政语境中，“职任”简洁表达受委派的职责，同时不把具体制度含义说得过满。
- source_word: בַּעֲבֹדָתָם
  choice: 他们供职的
  rationale: עֲבֹדָה 基本义为工作或服事，此处特指祭司职责；“供职”自然体现履行宗教职务的语境。
