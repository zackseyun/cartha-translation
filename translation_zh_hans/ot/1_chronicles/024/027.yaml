translation:
  language: zh_hans
  text: 米拉利的子孙：雅西雅；他的儿子[a]朔含、撒刻和伊比利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“他的儿子”。这里的句法较难理解；有人把这个词看作人名“比挪”，也有人认为应按复数理解为“他的儿子们”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: 米拉利的子孙
  rationale: בְּנֵי 是“儿子”的构造复数，在族谱名录中也可泛指后裔；译作“子孙”更符合现代汉语族谱语境，同时不限定所列人物必为亲生儿子。מְרָרִי 按专名音译为“米拉利”。
- source_word: לְיַעֲזִיָּהוּ
  choice: 雅西雅这一支
  rationale: 前缀 לְ 在此标示归属雅西雅的宗族分支；译作“雅西雅这一支”自然呈现名录关系，避免生硬的“属于雅西雅”。
- source_word: בְנוֹ
  choice: 他的儿子
  rationale: 马所拉元音文本直读为单数“他的儿子”。尽管句法困难，正文保留这一直接读法，并以脚注说明也可视作专名或复数意义。
- source_word: וְשֹׁהַם
  choice: 朔含
  rationale: 人名音译；前接并列连词，在中文列举中通过标点和末项前的“和”表达。
- source_word: וְזַכּוּר
  choice: 撒刻
  rationale: 人名音译。
- source_word: וְעִבְרִי
  choice: 伊比利
  rationale: 人名音译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的族谱名录语体。“这一支，有……”使希伯来文归属结构在汉语中较为清楚；脚注保留 בְנוֹ 的真实歧义，不在正文中武断消解。
