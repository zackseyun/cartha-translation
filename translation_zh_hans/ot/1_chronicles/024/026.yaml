  text: 米拉利的儿子是抹利和母示。雅西雅的儿子：他的儿子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的儿子”：希伯来语为 bənô，通常可理解为“他的儿子”。由于此处家谱句法困难，也有人将其视为专名“便诺”。
    reason: 保留בְנוֹ作为普通名词短语或专名的文本与句法歧义；正文遵循马所拉标音的通常含义及英文 POB 审校文本。
lexical_decisions:
- source_word: בְנֵי
  choice: 儿子
  rationale: 按家谱语境直译；这里列举男性后裔。
- source_word: מְרָרִי
  choice: 米拉利
  rationale: 采用通行的圣经人名音译。
- source_word: מַחְלִי וּמוּשִׁי
  choice: 抹利和母示
  rationale: 采用通行的圣经人名音译，并保留并列结构。
- source_word: יַעֲזִיָּהוּ
  choice: 雅西雅
  rationale: 采用通行的圣经人名音译。
- source_word: בְנוֹ
  choice: 便诺
  rationale: 辅音文本可被理解为普通短语“他的儿子”，但在本节残缺而困难的名单句法中，也可能是专名“便诺”；结合下一节将便诺列在雅西雅后裔中，正文采用专名，并以脚注保留另一读法。
theological_decisions:
- issue: בְנוֹ是普通短语还是专名
  choice: 正文译作专名“便诺”
  alternative: “他的儿子”
  rationale: 这属于文本与句法歧义，并非神学定论。下一节的名单结构支持将其视为人名，但马所拉标音本身通常表示“他的儿子”，故以脚注明确保留该可能。
