base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/020.yaml
  text: 'And for the remaining sons of Levi: for the sons of Amram[a], Shubael; for the sons of Shubael[b], Jehdeiah.'
translation:
  language: zh_hans
  text: 至于利未其余的子孙[a]：暗兰的子孙中有书巴业[b]；书巴业的子孙中有耶希底亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其余的子孙”也可译作“剩下的利未子孙”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在这份名册中使用省略表达；所列人名可能代表各支系的家族首领或代表人物。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי הַנּוֹתָרִים
  choice: 至于利未其余的子孙
  rationale: וְ与לִ在名册中共同引出下一组，译作“至于”自然地承接上文；הַנּוֹתָרִים意为“其余的、剩下的”，修饰利未的子孙。
- source_word: לִ/בְנֵי עַמְרָם
  choice: 暗兰的子孙中
  rationale: 重复的לִ/בְנֵי是名册分类公式；用“……的子孙中”既保留支系关系，也能自然衔接随后省略谓语的人名。
- source_word: שׁוּבָאֵל
  choice: 书巴业
  rationale: 采用现代中文圣经中通行且易辨认的专名译法。此名在简略名册中可能指该支系的首领或代表。
- source_word: לִ/בְנֵי שׁוּבָאֵל
  choice: 书巴业的子孙中
  rationale: 保留原文重复的名册结构，并以“中”补足现代汉语所需的关系表达，不额外断定其具体职分。
- source_word: יֶחְדְּיָהוּ
  choice: 耶希底亚
  rationale: 采用现代中文圣经中通行的音译，指书巴业支系名下所列的人。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以冒号和分号呈现希伯来文名册的层级与重复结构；用“中有”补足汉语句法，但不把原文未明说的“首领”写入正文，以保留其省略性与解释空间。
