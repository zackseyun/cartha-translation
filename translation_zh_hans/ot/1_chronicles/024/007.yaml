  text: The first lot came out for Jehoiarib[a], the second for Jedaiah.
translation:
  language: zh_hans
  text: 第一签归给耶何雅立，第二签归给耶大雅。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 抽中
  rationale: יצא本义为“出去、出来”；在抽签语境中，汉语用“抽中”可自然表达某签所归属的对象，同时保留抽签结果产生之意。
- source_word: הַגּוֹרָל
  choice: 签
  rationale: גּוֹרָל可指抽签所用的签或抽签所得的份额；本节按次序列出祭司班次，译作“签”简洁自然。
- source_word: הָרִאשׁוֹן
  choice: 第一
  rationale: 该序数词标明抽签结果的先后次序；“第一签”符合现代汉语表达。
- source_word: לִיהוֹיָרִיב
  choice: 耶何雅立
  rationale: 前缀ל表示签所归给的对象；在“抽中”结构中无需另译“给”。人名依常见中文圣经音译。
- source_word: לִידַעְיָה
  choice: 耶大雅
  rationale: 前缀ל同样表示第二签所归给的对象；配合“抽中”自然表达。人名依常见中文圣经音译。
- source_word: הַשֵּׁנִי
  choice: 第二
  rationale: 该序数词与“第一”对应，清楚标明次序；原文省略第二处“签”和动词，中文为清晰起见补出。
