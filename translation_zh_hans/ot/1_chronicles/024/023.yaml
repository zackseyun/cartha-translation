base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/023.yaml
  text: 'And the sons of Jeriah: Amariah the second[a], Jahaziel the third, Jekameam the fourth.'
translation:
  language: zh_hans
  text: 至于儿子们：耶利雅；亚玛利雅第二[a]，雅哈悉第三，耶加面第四。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处的句法和指代有困难。按马所拉元音，“儿子们”可作“我的儿子们”，但经文没有明确其所指；耶利雅后有主要停顿，因此可把耶利雅理解为名单的第一人，后列亚玛利雅第二、雅哈悉第三、耶加面第四。参照《历代志上》23:19及另一种句法理解，传统译法也作“耶利雅的儿子有：亚玛利雅第二……”；正文保留原文未解决的省略。
    reason: 说明马所拉文本的指代与分句困难，并保留“耶利雅的儿子”这一传统理解而不将其写入正文。
lexical_decisions:
- source_word: וּבְנָי
  choice: 至于众子
  rationale: וּ连接前文名单，בְנָי是“……的众子”的构造形式，但经文没有明说所属者。译文保留名单承接关系和原文的省略，不擅自补入父名。
- source_word: יְרִיָּהוּ
  choice: 耶利雅
  rationale: 按现代中文圣经人名的通行形式音译；马所拉重音把此名与后面的“亚玛利雅是第二个”分开，适合作为名单中的第一项。
- source_word: אֲמַרְיָהוּ הַשֵּׁנִי
  choice: 亚玛利雅是第二个
  rationale: 序数词直译为名单中的次序；中文补出系词“是”，使省略式希伯来名单句法自然可懂。
- source_word: יַחֲזִיאֵל הַשְּׁלִישִׁי
  choice: 雅哈悉是第三个
  rationale: 人名依通行中文形式音译，并保留原文的第三顺位。
- source_word: יְקַמְעָם הָרְבִיעִי
  choice: 耶加面是第四个
  rationale: 人名依通行中文形式音译，并保留原文的第四顺位。
theological_decisions:
- issue: 名单所属者及耶利雅在句中的身份
  choice: 译作“至于众子：耶利雅；亚玛利雅是第二个……”，不补出所属者
  alternative: “耶利雅的儿子有：亚玛利雅是第二个……”或“希伯仑的儿子有：耶利雅……”
  rationale: 马所拉文本的 בְנָי 是构造形式，却没有明示其所属者；其重音又在“耶利雅”后形成主要停顿，使“耶利雅”较自然地成为名单首项。历代译法会根据句法或平行经文补足不同关系，但正文宜保存原文真实的省略与歧义。
translation_notes:
  register: 采用简洁、庄重的家谱名单语体。“至于”承接上文，“众子”保留复数和未明示所属者的结构；在各序数前补“是”，以符合现代普通话，同时用分号标明耶利雅与其后序数名单之间的结构停顿。
