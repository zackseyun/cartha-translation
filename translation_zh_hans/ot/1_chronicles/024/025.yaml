- source_word: אֲחִי מִיכָה
  choice: 米迦的兄弟
  rationale: אֲחִי 是“兄弟”的构造形，与 מִיכָה 构成所属关系；按家谱名单的汉语表达译作“米迦的兄弟”。
- source_word: יִשִּׁיָּה
  choice: 伊示雅
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较熟悉的译名；两处保持一致。
- source_word: לִבְנֵי יִשִּׁיָּה
  choice: 伊示雅的子孙中
  rationale: בְּנֵי 在家谱语境中可指儿子或较广义的后裔；介词 לְ 在此标示所属群体。译作“子孙中”符合名单体裁，也避免武断限定为亲生儿子。
- source_word: זְכַרְיָהוּ
  choice: 撒迦利亚
  rationale: 采用该希伯来人名在现代中文圣经中的通行译名。
