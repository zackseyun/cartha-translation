lexical_decisions:
- source_word: לִפְתַחְיָה
  choice: 归给毗他希雅
  rationale: 前缀 ל 在祭司班次的抽签名录中表示分配或归属；人名 פְתַחְיָה 按希伯来语形式音译。
- source_word: תִּשְׁעָה עָשָׂר
  choice: 第十九签
  rationale: 原文基数词在本名录中具有序数作用；结合上下文补出“签”，使中文清楚自然。
- source_word: לִיחֶזְקֵאל
  choice: 归给耶赫斯克勒
  rationale: 前缀 ל 同样表示抽签所得班次的归属；按本处 יְחֶזְקֵאל／יֶחֶזְקֵאל 的名称形式音译，不直接与较常见的“以西结”同化。
- source_word: הָעֶשְׂרִים
  choice: 第二十签
  rationale: 带冠词的数词在连续名录中表示序数；补出上下文所含的“签”，与前半句保持平行。
