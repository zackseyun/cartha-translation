  text: 'The sons of Uzziel: Micah[a]; of the sons of Micah: Shamir.'
translation:
  language: zh_hans
  text: 乌薛的子孙里有米迦；米迦的子孙里有沙密[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沙密”也可音译为“示摩”；这个希伯来专名也有不同的读音和转写处理。
    reason: 保留希伯来专名 שמור 的替代读法／转写可能性，避免错误宣称马所拉文本未标注元音。
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是בֵּן的复数构造形式，用于家谱名单。此处各引出一个人名，译为“儿子”既贴近原文，也符合现代汉语名单体表达。
- source_word: עֻזִּיאֵל
  choice: 乌薛
  rationale: 按现代中文圣经人名的通行形式音译此专名。
- source_word: מִיכָה
  choice: 米迦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: לִבְנֵי
  choice: 米迦的儿子
  rationale: 前缀לְ在此为名单中的衔接标记；不生硬译成“给”，而按其家谱关系自然表达为“……的儿子”。
- source_word: שמור
  choice: 沙密
  rationale: 将未标元音的希伯来专名按通行识别音译为“沙密”；由于辅音拼写也容许另一种读法，另加脚注说明。
