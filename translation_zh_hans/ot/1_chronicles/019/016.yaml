base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/016.yaml
  text: When Aram saw that they had been defeated before Israel[a], they sent messengers and brought out the Arameans who were from beyond the River[b], with Shophach the commander of Hadadezer’s army before them.
translation:
  language: zh_hans
  text: 亚兰见己方在以色列人面前被击败，就派使者去，把大河那边的亚兰人调来[a]；哈达底谢军队的统帅朔法走在他们前面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大河”在这里很可能指幼发拉底河；希伯来原文只说“大河那边”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: 亚兰人
  rationale: 此处先指参战的亚兰一方，后指从大河那边调来的亚兰人或军队；译作“亚兰人”既保留希伯来专名，也符合汉语叙事。
- source_word: נִגְּפוּ
  choice: 被击败
  rationale: 该词的尼法勒形在军事语境中表示遭受失败；“被击败”清楚自然，又不夸大为全军覆灭。
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: 在以色列人面前
  rationale: 保留原文“在……面前”的表达；上下文自然传达败在以色列人手下之意，而不把隐含关系改成明说。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 政治军事语境中指奉命传话或联络的人，并非天使。
- source_word: וַיּוֹצִיאוּ אֶת אֲרָם
  choice: 把……亚兰人调来
  rationale: 字面为“使亚兰出来”；在征调援军的语境中，“调来”准确传达使其出动、前来的含义。
- source_word: מֵעֵבֶר הַנָּהָר
  choice: 大河那边
  rationale: 原文只称“那河”，历史语境中通常指幼发拉底河；正文不直接补出河名，以保留原文措辞。
- source_word: שַׂר צְבָא הֲדַדְעֶזֶר
  choice: 哈大底谢的军队统帅
  rationale: שַׂר צְבָא是正式军事职衔；“军队统帅”在现代汉语中庄重明确。
- source_word: לִפְנֵיהֶם
  choice: 走在他们前面
  rationale: 贴近字面“在他们前面”，同时在军队行进语境中自然暗示朔法居前率领，避免将其职能解释得过满。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“在以色列人面前”和“走在他们前面”两处希伯来空间表达；将军事语境中的使役动词译为“调来”，以保证汉语自然。专名采用常见中文圣经音译“亚兰、哈大底谢、朔法”。
