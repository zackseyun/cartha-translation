  to: 大卫说：“我要恩待拿辖的儿子哈嫩，因为他父亲曾恩待我。”于是，大卫派使者去安慰他，因为他父亲去世了[a]。大卫的臣仆来到亚扪人的地，去见哈嫩，安慰他。
