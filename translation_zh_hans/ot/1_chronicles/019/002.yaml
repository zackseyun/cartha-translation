  source_fidelity: 译文准确传达了大卫要向哈嫩施以善意、因拿辖曾善待自己而作出这一决定，以及派人前往亚扪地安慰哈嫩的叙事次序。原稿中“为他父亲的事安慰他”虽试图保留עַל אָבִיו的含蓄结构，但在现代汉语中不够自然，也未清楚呈现该慰问所对应的丧父语境。
  naturalness: “于是”及“使者”“臣仆”等用语符合庄重的现代汉语圣经语体。“来到亚扪人的地，到哈嫩那里”连续使用两个地点补语，略显滞涩；改为“来到亚扪人的地，去见哈嫩”更顺畅。将丧父缘由直接表述为“因他父亲去世”，也更合乎现代汉语表达。
  terminology: “恩待”适切地对应חֶסֶד在此人际、政治背景下的善意；“使者”正确排除了天使义；“亚扪人”“拿辖”“哈嫩”和“臣仆”均一致且合宜。
