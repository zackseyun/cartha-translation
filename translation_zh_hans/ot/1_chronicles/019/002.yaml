  text: וַ/יֹּ֨אמֶר דָּוִ֜יד אֶֽעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כִּֽי עָשָׂ֨ה אָבִ֤י/ו עִמִּ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֥ח דָּוִ֛יד מַלְאָכִ֖ים לְ/נַחֲמ֣/וֹ עַל אָבִ֑י/ו וַ/יָּבֹאוּ֩ עַבְדֵ֨י דָוִ֜יד אֶל אֶ֧רֶץ בְּנֵי עַמּ֛וֹן אֶל חָנ֖וּן לְ/נַחֲמֽ/וֹ־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him concerning his father. And David’s servants came to the land of the Ammonites, to Hanun, to comfort him.
translation:
  language: zh_hans
  text: 大卫说：“我要恩待拿辖的儿子哈嫩，因为他父亲曾恩待我。”于是，大卫派使者去安慰他，因为他父亲去世了[a]。大卫的臣仆来到亚扪人的地，去见哈嫩，安慰他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为他父亲的事安慰他”。希伯来语的表达表明，他父亲的死是此次慰问的缘由。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: 恩待
  rationale: 本节两次出现该词，指双方在人际和政治关系中所施的善意与厚待；“恩待”自然地表达“以恩慈相待”，又不把此处限定为盟约语境中的“慈爱”或“忠贞之爱”。
- source_word: עָשָׂה חֶסֶד עִם
  choice: 恩待
  rationale: 希伯来语字面结构近于“与……行恩慈”，现代汉语以“恩待某人”表达更自然，也保留了主动施惠的含义。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 这里指大卫派出的人员，而非天使；“使者”既贴近词义，也适合外交吊唁的场景。
- source_word: לְנַחֲמוֹ
  choice: 安慰他
  rationale: 该词在丧亲语境中表示前去慰问、安慰；“安慰他”清楚而庄重，并适用于本节两处。
- source_word: עַל אָבִיו
  choice: 为他父亲的事
  rationale: 介词短语说明安慰的缘由，即哈嫩父亲去世；正文保留原文较含蓄的说法，以脚注交代丧父语境。
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: 亚扪人的地
  rationale: “亚扪人”是该族群的通行译名；“亚扪人的地”保留原文的地理表达。
- source_word: בֶּן נָחָשׁ
  choice: 拿辖的儿子
  rationale: 按现代中文圣经人名惯例音译，并直接保留父子关系。
- source_word: וַיֹּאמֶר ... וַיִּשְׁלַח ... וַיָּבֹאוּ
  choice: 大卫说……于是，大卫派……大卫的臣仆来到
  rationale: 连续叙事形式表示事件依次展开；“于是”自然体现大卫的决定与派遣行动之间的承接关系。
- source_word: עַבְדֵי דָוִיד
  choice: 大卫的臣仆
  rationale: 这些人是在君王大卫手下奉命办事的人；“臣仆”兼顾其隶属关系和王室语境，又不武断地限定为高级官员。
