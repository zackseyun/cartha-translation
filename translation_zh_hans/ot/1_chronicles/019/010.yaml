revisions:
- from: 约押看见前后都有敌军列阵攻击他，就从以色列所有精选的勇士中挑出一部分，使他们列阵迎战亚兰人[a]。
  to: 约押看见战阵在他前后向着他，就从全以色列的精锐中挑选一部分，使他们列阵迎战亚兰[a]。
  rationale: 修订删除“攻击”这一超出原文明确表述的动作，同时保留前后两面的战术压力，避免将其说成完全包围。将“亚兰人”改为“亚兰”，以保存原文专名及其可作地域/军队转指的含混性；脚注说明本处语境所指。其余用语维持现代、庄重且自然的军事叙事风格。
