  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֧ה פְנֵי הַ/מִּלְחָמָ֛ה אֵלָ֖י/ו פָּנִ֣ים וְ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כָּל בָּחוּר֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/010.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose some of the best men from all Israel and arranged them to meet Aram.
translation:
  language: zh_hans
  text: 约押看见战阵在他前后向着他，就从全以色列的精锐中挑选一部分，使他们列阵迎战亚兰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“亚兰”；这里指亚兰军队。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见
  rationale: 采用叙事中 ראה 的基本义，同时在上下文中自然包含察觉战局之意，不额外解释为“意识到”。
- source_word: פְנֵי הַמִּלְחָמָה אֵלָיו פָּנִים וְאָחוֹר
  choice: 前后都有敌军列阵攻击他
  rationale: 原文直译近于“战阵的正面在他前面和后面”；此译自然表达约押腹背受敌的态势，又保留前后两个方向，未进一步推断为完全包围。
- source_word: מִכָּל בָּחוּר בְּיִשְׂרָאֵל
  choice: 从以色列所有精选的勇士中挑出一部分
  rationale: בָּחוּר 在军事语境中指经过挑选的精锐战士；介词 מִן 在此具有部分义，因此明示“中挑出一部分”。
- source_word: וַיַּעֲרֹךְ
  choice: 使他们列阵
  rationale: ערך 在战争语境中表示将军队排列成战阵；补出隐含的受事“他们”，使现代汉语完整自然。
- source_word: לִקְרַאת אֲרָם
  choice: 迎战亚兰人
  rationale: לִקְרַאת 在此表示迎向、对阵；אֲרָם 字面为“亚兰”，但语境所指是亚兰军队，故正文用自然的“亚兰人”，并以脚注交代原文形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的军事叙事用语。“列阵”“迎战”准确传达战场语境；避免较古雅的“在前在后”以及可能过度解释的“包围”。
