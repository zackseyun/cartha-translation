    rationale: 希伯来文描述战阵在约押前后与他相对、形成夹击态势，并未以独立动词明确说敌军当时正在攻击。应保留这种简洁的军事部署描述。
  - severity: low
    issue: 正文使用“亚兰人”，脚注却说明原文作“亚兰”。
    rationale: אֲרָם在原文是“亚兰”这一名称，此处可按语境指亚兰军队。正文保留“亚兰”更贴合源语形式，脚注交代其转指意义即可。
