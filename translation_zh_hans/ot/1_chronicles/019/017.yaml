  terminology: “约旦河”“以色列”“大卫”“亚兰”均采用稳定且合宜的圣经名称。“以色列全军”在本节军事语境中可接受；“亚兰”则应保留为原文所用的集体性专名，避免不必要地转为“亚兰人”。
