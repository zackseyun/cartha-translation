  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗יד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֣א אֲלֵ/הֶ֔ם וַֽ/יַּעֲרֹ֖ךְ אֲלֵ/הֶ֑ם וַ/יַּעֲרֹ֨ךְ דָּוִ֜יד לִ/קְרַ֤את אֲרָם֙ מִלְחָמָ֔ה וַ/יִּֽלָּחֲמ֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, came against them, and drew up in battle formation against them. Then David drew up for battle to meet Aram, and they fought with him.
translation:
  language: zh_hans
  text: 有人把这事报告给大卫，他就召集以色列全军，渡过约旦河，来到他们那里，列阵迎着他们。大卫摆开阵势，迎战亚兰；他们便同他交战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”指亚兰；“同他交战”也可译作“攻击他”。希伯来文直译为“与他作战”。
    reason: 说明代词所指及介词עם在交战语境中的敌对含义，同时保留原文表达方式。
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִיד
  choice: 有人把这事报告给大卫
  rationale: 希伯来文为无人称被动叙事句；中文用“有人把这事报告给”自然表达消息传到大卫那里，又不具体指明报告者。
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: 他就召集以色列全军
  rationale: אָסַף表示聚集、召集；军事语境表明这里是召集以色列军队。“全军”自然传达集合全民兵力的意思，并避免理解成每一个居民。
- source_word: וַיַּעֲבֹר הַיַּרְדֵּן
  choice: 渡过约旦河
  rationale: עבר在此指越过河流；“渡过约旦河”是准确自然的现代中文。
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: 来到他们那里
  rationale: 保留בוא אל较中性的空间意义“来到……那里”；敌对含义由上下文和随后列阵交战的表述显明，不在此处额外强化。
- source_word: וַיַּעֲרֹךְ אֲלֵיהֶם
  choice: 列阵与他们对峙
  rationale: ערך在军事语境中表示部署、排列军队；“列阵”保留其具体军事含义，“与他们对峙”表达אֲלֵיהֶם在此处的敌对指向。
- source_word: וַיַּעֲרֹךְ דָּוִיד לִקְרַאת אֲרָם מִלְחָמָה
  choice: 大卫摆开阵势，迎战亚兰人
  rationale: 重复的ערך仍以部署军队来表达，但为中文自然性采用“摆开阵势”；לִקְרַאת意为迎向，结合מִלְחָמָה译作“迎战”。אֲרָם是集体性国族名称，在此作参战主体，中文译作“亚兰人”较清楚。
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: 他们就与他交战
  rationale: לחם与介词עם连用，在这里指同大卫交战。“与他交战”既贴近字面结构，也在现代中文中明确表示敌对作战。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文连续推进的叙事节奏及“列阵／摆开阵势”的重复军事意象；对“以色列全体”按军事语境译为“以色列全军”，对集体名词“亚兰”按中文语境译为“亚兰人”。
