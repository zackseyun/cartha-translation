base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/003.yaml
  text: But the princes of the Ammonites said to Hanun[a], “Is David honoring your father in your sight because he has sent comforters to you? Have not his servants come to you in order to search out, to overthrow[b], and to spy out the land?”
translation:
  language: zh_hans
  text: 亚扪人的首领对哈嫩说：“大卫派人来安慰你，难道在你看来[a]，他真是在尊重你父亲吗？他的臣仆到你这里来，难道不是为了探查、颠覆[b]并窥察这地吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在你眼中”，即“照你的看法或判断”。
    reason: lexical_alternative
  - marker: b
    text: 或译“翻覆”。这个希伯来语动词可指翻转或倾覆；在这里可能含有敌意破坏或颠覆的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: 首领
  rationale: 该词指统治者或高级官员；“首领”既体现其政治地位，也不把具体官职说得过于确定。
- source_word: הַמְכַבֵּד
  choice: 尊重
  rationale: כבד在此表示尊敬、以礼相待；“尊重”符合现代汉语，也保留了首领们质疑大卫动机的语气。
- source_word: בְּעֵינֶיךָ
  choice: 在你看来
  rationale: 希伯来语直译为“在你眼中”，实际指哈嫩的看法或判断；正文采用自然的现代汉语表达，并以脚注保留原文意象。
- source_word: מְנַחֲמִים
  choice: 派人来安慰你
  rationale: 该分词指在丧亲后前来慰问的人；结合 שָׁלַח 译为“派人来安慰你”，比名词化的“安慰者”更符合现代汉语。
- source_word: לַחְקֹר
  choice: 探查
  rationale: חקר可指深入查明或探察；“探查”适合此处怀疑对方进行侦察的语境。
- source_word: וְלַהֲפֹךְ
  choice: 颠覆
  rationale: הפך基本义为翻转、翻覆；在政治军事语境中，“颠覆”能表达首领们所指控的敌对意图，同时通过脚注保留字面可能性。
- source_word: וּלְרַגֵּל
  choice: 窥察
  rationale: רגל的加强词干常指暗中侦察；“窥察”清楚表达间谍式侦察，并与前面的“探查”保持细微区别。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 此处指亚扪的领土；“这地”自然体现说话者所指的本国土地。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 王室语境中的 עֶבֶד 可指君王的仆从或属员；“臣仆”保留其从属于大卫的身份，而不武断限定其官职。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个反问句保留原文中亚扪首领对大卫动机的猜疑和煽动语气；“真”用于使第一问的质疑语气在汉语中清楚显出，但不把猜疑当作事实陈述。
