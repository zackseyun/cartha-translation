base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/009.yaml
  text: And the sons of Ammon came out and drew up for battle at the entrance of the city[d][c][b][a], while the kings who had come were by themselves in the field.
translation:
  language: zh_hans
  text: 亚扪人[a]出来，在城的入口处[c]列阵迎战[b]；那些前来的众王则单独在田野中[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“亚扪之子”，即亚扪人。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“摆开阵势，准备交战”。这里的希伯来语军事用语指把军队排列成战斗阵形。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“城门口”；但原文所用的词泛指“入口、开口”，不是通常表示“城门”的词。
    reason: lexical_alternative
  - marker: d
    text: 意思是，这些前来的众王及其所率军队与亚扪军分开，部署在田野中。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: 出来
  rationale: יצא在叙事中表示“出去、出来”；此处从城中出兵的场景看，译作“出来”自然贴切。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 希伯来语字面为“亚扪之子”，是民族称谓；现代汉语用“亚扪人”清楚自然，字面形式收入脚注。
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: 摆开阵势，准备交战
  rationale: ערך与מִלְחָמָה构成军事用语，指把军队排列成战斗阵形；这一译法既保留列阵含义，也让现代读者易懂。
- source_word: פֶּתַח הָעִיר
  choice: 在城的入口处
  rationale: פֶּתַח通常指“开口、入口”，并非通常表示城门的שַׁעַר，因此避免直接译作“城门口”。
- source_word: וְהַמְּלָכִים אֲשֶׁר בָּאוּ
  choice: 前来助战的众王则
  rationale: 关系从句字面为“那些前来的王”；上下文表明他们是受邀参战的盟军首领。“则”体现其部署与亚扪人的对比。
- source_word: לְבַדָּם
  choice: 另在
  rationale: לְבַדָּם表示他们与亚扪军分开部署，而不是每位王都孤身一人；“另在”简洁传达这种分离。
- source_word: בַּשָּׂדֶה
  choice: 田野中
  rationale: שָׂדֶה可指田野或城外旷地；译作“田野中”贴近词义，不额外加入原文没有明说的“开阔”。
