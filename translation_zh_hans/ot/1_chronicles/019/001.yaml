base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/001.yaml
  text: After this, Nahash king of the Ammonites died, and his son reigned in his place.
translation:
  language: zh_hans
  text: 此后，亚扪人的王拿辖死了，他的儿子接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: 此后
  rationale: 希伯来语叙事衔接语直译为“这事以后发生了”。“此后”自然简洁，同时保留时间上的过渡。
- source_word: וַיָּמָת
  choice: 死了
  rationale: מות在这里直接表示死亡；“死了”准确明白，不作委婉化处理。
- source_word: נָחָשׁ
  choice: 拿辖
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: 亚扪人的王
  rationale: 原文直译为“亚扪子孙的王”；“亚扪人的王”在现代中文中自然，也准确表达族群所指。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך在此表示行使或承接王权。“作王”符合中文历史叙事语体，并与继位语境相合。
- source_word: בְּנוֹ
  choice: 他的儿子
  rationale: 第三人称单数阳性后缀指向拿辖；译为“他的儿子”直接清楚。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 该词表示取代某人的位置或职位。与“作王”连用时，“接替他作王”自然地表达王位继承，也保留了原文“在他的位置上”的含义。
