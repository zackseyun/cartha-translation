base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/005.yaml
  text: They went and told David about the men[a], and he sent to meet them, because the men were greatly humiliated. And the king said, “Stay in Jericho until your beards have grown back[b], then return.”
translation:
  language: zh_hans
  text: 他们去把这些人的事告诉大卫[a]；大卫就派人去迎接他们[b]，因为这些人极其蒙羞。王说：“你们留在耶利哥，等你们的胡须长出来，再回来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“他们去把这些人的事告诉大卫”；“他们”所指何人并未说明。
    reason: 保留原文复数主语及其未明确的指代。
  - marker: b
    text: 原文只说“大卫差遣去迎接他们”，没有明说所差遣的是谁；译文按汉语表达补作“派人”。
    reason: 说明原文省略的受词，避免将隐含的执行者当作明说内容。
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיַּגִּידוּ לְדָוִיד עַל הָאֲנָשִׁים
  choice: 有人去把这些人的事告诉大卫
  rationale: 希伯来文动词均为复数，但没有明说主语是谁；用“有人”避免误把使者本人当作报告者，同时自然表达有人前去向大卫报告这些人的遭遇。
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: 大卫就派人迎接他们
  rationale: שׁלח 的受词在原文中省略，但执行迎接行动的人自然是受差派者；汉语须补出“人”才通顺，并以脚注说明原文的省略。
- source_word: נִכְלָמִים מְאֹד
  choice: 深感羞辱
  rationale: כלם 的被动形在此兼有受辱、蒙羞之意；上下文涉及公开羞辱，“深感羞辱”既表达社会性的受辱，也保留当事人的羞耻感。
- source_word: שְׁבוּ בִירֵחוֹ
  choice: 你们留在耶利哥
  rationale: ישׁב 在此是“停留、住下”，不是字面的“坐”；“留在”符合现代汉语叙事。
- source_word: עַד אֲשֶׁר יְצַמַּח זְקַנְכֶם
  choice: 等胡须重新长出来
  rationale: צמח 是生长；结合上一节胡须被剃去的背景，汉语用“重新长出来”自然准确。集合式单数“胡须”可对应众人的胡须。
- source_word: וְשַׁבְתֶּם
  choice: 再回来
  rationale: 连词连接前面的时间条件，表示此后采取的行动；“再回来”清楚呈现先等候、后返回的次序。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 保留原文对大卫的王室称谓，而不再次改用专名。
