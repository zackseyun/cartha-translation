base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/013.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: zh_hans
  text: 你要刚强[a]！让我们为我们的人民和我们上帝的城邑奋勇自强。愿耶和华照他眼中看为好的去做[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刚强”也可译作“勇敢”或“坚定”。下句“奋勇自强”所用的希伯来语动词形式带有主动振作、奋力自强的意味。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译作：“耶和华必照他眼中看为好的去做。”原文动词在这里既可理解为祈愿，也可理解为对将来的陈述。
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: 你要刚强
  rationale: 这是חזק的第二人称阳性单数祈使式，直接劝勉约押刚强勇敢；“你要刚强”准确、庄重，也能与下句共同勉励的语气衔接。
- source_word: וְנִתְחַזְּקָה
  choice: 让我们……奋勇刚强
  rationale: 这是חזק的Hitpael第一人称复数鼓励式，含主动振作、奋力显出刚强的意味。“奋勇刚强”在战事语境中自然，并保留了比单纯“刚强”更强的自我投入色彩。
- source_word: בְּעַד
  choice: 为
  rationale: 此处表示为了某人的益处并保卫对方而行动；简洁的“为”在上下文中足以表达“为……而战、护卫……”的含义。
- source_word: עַמֵּנוּ
  choice: 我们的人民
  rationale: עַם通常指“人民、百姓”，范围不限于军队；“我们的人民”保留其整体共同体含义。
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: 我们上帝的城邑
  rationale: 直译这一构造短语，保留这些城邑归属于上帝的表达；“城邑”庄重而清楚，适合古代军事叙事。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以称号“主”替代。
- source_word: הַטּוֹב בְּעֵינָיו
  choice: 他眼中看为好的
  rationale: 保留希伯来语“在他眼中为好”的意象，同时采用现代中文中自然可懂的表达。
- source_word: יַעֲשֶׂה
  choice: 愿……去做
  rationale: 未完成式位于一连串劝勉之后，可有祈愿式力量，表达将战果交托给上帝，而不是断言结果；“愿”清楚传达这一语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名，因此正文使用专名而非称号；“耶和华”是现代标准汉语圣经传统中最广为人知且庄重的形式。
- issue: 末句יַעֲשֶׂה的语气
  choice: 愿耶和华照他眼中看为好的去做
  alternative: 耶和华必照他眼中看为好的去做
  rationale: 此处既可理解为祈愿，也可理解为对将来的陈述。正文依其紧接劝勉语的上下文采用祈愿式，表现人的奋勇与对上帝旨意的顺服；脚注保留预测式读法。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“奋勇刚强”贴合战场劝勉语境；“人民”避免把原文范围缩窄为军队；末句保留希伯来语“眼中看为好”的意象及祈愿/预测之间的真实歧义。
