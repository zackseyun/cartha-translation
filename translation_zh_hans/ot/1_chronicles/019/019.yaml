base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/019.yaml
  text: When the servants of Hadadezer saw that they had been defeated before Israel[a], they made peace with David and served him. And Aram was no longer willing to help the sons of Ammon.
translation:
  language: zh_hans
  text: 哈达底谢的臣仆见自己败在以色列人面前，就与大卫讲和，臣服于他。此后，亚兰人不肯再援助亚扪人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“亚扪之子”，这是对亚扪人的族群称谓。
    reason: 说明希伯来语族群称谓的字面形式与正文的自然译法。
lexical_decisions:
- source_word: עַבְדֵי
  choice: 臣仆
  rationale: 在君王与战争的政治语境中，此词指哈达底谢辖下的臣属或侍从；“臣仆”既保留从属关系，也不误导为专指奴隶。
- source_word: נִגְּפוּ
  choice: 败
  rationale: 此处为军事语境，尼法勒式表示遭受失败；译作“败”自然简洁，不额外断定伤亡程度。
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: 在以色列人面前
  rationale: 保留希伯来语“在……面前”的表达，同时在汉语中可自然表示在以色列人面前战败。
- source_word: וַיַּשְׁלִימוּ עִם דָּוִיד
  choice: 与大卫讲和
  rationale: 使役式 שלם 与 עִם 连用表示缔结和平；“讲和”符合战后政治语境。
- source_word: וַיַּעַבְדֻהוּ
  choice: 臣服于他
  rationale: 这里描述讲和之后对大卫的政治性服从；“臣服”比一般的“服事”更准确地表达此语境。
- source_word: אָבָה
  choice: 肯
  rationale: 该动词表示愿意、同意；与否定词和 עוֹד 连用，译为“不肯再”自然表达不再愿意。
- source_word: אֲרָם
  choice: 亚兰人
  rationale: 原文以单数集合名词“亚兰”指其人民或势力；汉语用“亚兰人”可清楚表达采取行动的集体主体。
- source_word: לְהוֹשִׁיעַ
  choice: 援助
  rationale: 该词常有拯救、解救之义，但在军事联盟语境中指前来相助；“援助”准确体现军事支援而不引入额外神学含义。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 原文字面为“亚扪之子”，但这是标准族群称谓；正文采用现代汉语自然的“亚扪人”，字面形式在脚注说明。
- source_word: עוֹד
  choice: 再
  rationale: 与否定表达连用，表示“不再、再也不”；置于动词前符合现代汉语习惯。
theological_decisions: []
