  yaml_path: translation/ot/1_chronicles/019/014.yaml
  text: So Joab and the people who were with him advanced before Aram for battle[a], and they fled before him.
translation:
  language: zh_hans
  text: 于是，约押和跟随他的人上前迎战亚兰人[a]；亚兰人从他面前逃跑了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“亚兰”，并用“在（或到）亚兰面前”的空间表达，意指上前与亚兰一方交战；这里的“亚兰人”指亚兰一方的军兵。
    reason: 说明原文专名“亚兰”及לִפְנֵי在战事语境中的空间表达，同时保留正文的自然汉语。
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 上前
  rationale: נגשׁ的基本义是“走近、上前”；在交战语境中，“上前”既保留移动意味，也自然表达趋近敌军的行动。
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: 和跟随他的人
  rationale: 直译为“和与他同在的百姓/众人”。此处指约押所率领的作战人员；“跟随他的人”自然清楚，又未将其具体化为原文未明说的“军队”。
- source_word: לִפְנֵי אֲרָם לַמִּלְחָמָה
  choice: 迎战亚兰人
  rationale: 原文直译为“到亚兰面前，为要交战”。“迎战亚兰人”在现代汉语中简洁自然地表达进入敌军面前作战的意思；脚注保留其空间结构及专名用法。
- source_word: אֲרָם
  choice: 亚兰人
  rationale: אֲרָם本是专名“亚兰”，但此处与复数动词“逃跑”连用，语境所指是亚兰一方的军兵。正文用“亚兰人”符合汉语表达，脚注说明原文形式。
- source_word: וַיָּנוּסוּ
  choice: 逃跑了
  rationale: נוס意为“逃跑、逃走”；“逃跑了”直接传达败退逃离，而不弱化为较中性的“撤退”。
- source_word: מִפָּנָיו
  choice: 就在他面前
  rationale: 字面为“从他面前”。在战事叙述中，表示敌军当着他或因面对他而逃跑；“在他面前逃跑”保留了原文意象，单数“他”指约押。
