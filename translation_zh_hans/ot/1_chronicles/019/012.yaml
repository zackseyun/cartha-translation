  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק מִמֶּ֨/נִּי֙ אֲרָ֔ם וְ/הָיִ֥יתָ לִּ֖/י לִ/תְשׁוּעָ֑ה וְ/אִם בְּנֵ֥י עַמּ֛וֹן יֶֽחֶזְק֥וּ מִמְּ/ךָ֖ וְ/הוֹשַׁעְתִּֽי/ךָ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/012.yaml
  text: And he said[a], “If Aram is too strong for me, then you shall be my salvation; but if the Ammonites are too strong for you[b], then I will save you.”
translation:
  language: zh_hans
  text: 他便说：“如果亚兰人比我强，你就来援救我[a]；如果亚扪人比你强，我就援救你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“你就成为我的拯救。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他便说
  rationale: 以“便”自然承接希伯来叙事中的 wayyiqtol，同时不额外强化时间先后。
- source_word: אֲרָם
  choice: 亚兰人
  rationale: 原文以“亚兰”这一名称集合性地指亚兰一方；汉语用“亚兰人”可清楚表达交战群体，也避免使用后世地缘名称“叙利亚”。
- source_word: תֶּחֱזַק מִמֶּנִּי / יֶחֶזְקוּ מִמְּךָ
  choice: 比我强／比你强
  rationale: חזק 与 מן 连用表示战场上的比较优势。“比……强”既贴近原文比较结构，也保留可能指兵力更强或占据上风的语义宽度。
- source_word: וְהָיִיתָ לִּי לִתְשׁוּעָה
  choice: 你就来援救我
  rationale: 原文直译为“你就成为我的拯救”。在具体战事中，这是前来救援、解围之意；“来援救我”自然清楚，并保留相互支援的承诺。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: “亚扪之子”是族群称谓，现代汉语自然译作“亚扪人”。
- source_word: וְהוֹשַׁעְתִּיךָ
  choice: 我就援救你
  rationale: ישע 的使役式表示救助、解救；战场语境下“援救”准确而具体，并与前半句形成清晰对应。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“援救”贴合军事互助语境，又不把本节具体的战场解救过度神学化；两组条件句保持原文对称结构。
