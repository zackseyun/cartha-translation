base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/011.yaml
  text: He put the rest of the troops under the command of Abishai his brother[a], and they drew up in battle formation to meet the Ammonites.
translation:
  language: zh_hans
  text: 他把其余的军兵交给他的兄弟亚比筛指挥[a]；他们便列阵迎战亚扪人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“交在他的兄弟亚比筛手中”，这是委托他掌权或指挥的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: 其余的军兵
  rationale: יֶתֶר意为“其余、剩下的”；הָעָם字面为“百姓、众人”，但在此军事语境中指约押统率的作战人员，因此译作“军兵”既自然又保留群体含义。
- source_word: נָתַן בְּיַד
  choice: 交给……指挥
  rationale: 该短语字面意为“交在……手中”，在此是委托权柄、交由统领的惯用表达；“交给……指挥”准确传达军事语境中的含义。
- source_word: אַבְשַׁי אָחִיו
  choice: 他兄弟亚比筛
  rationale: 采用现代中文圣经人名的通行音译“亚比筛”，并保留אָחִיו“他的兄弟”这一亲属说明。
- source_word: וַיַּעַרְכוּ
  choice: 他们就列阵
  rationale: ערך在军事语境中指排布军队、摆开阵势；“列阵”简洁、庄重，并明确表达备战含义。
- source_word: לִקְרַאת
  choice: 迎战
  rationale: לִקְרַאת基本义为“迎向、面对、会合”；结合列阵和敌军的语境，“迎战”自然表达这里带有敌对性质的相向行动。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 字面为“亚扪之子”，是民族称谓；现代汉语自然译为“亚扪人”。
