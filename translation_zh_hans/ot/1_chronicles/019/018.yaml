base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/018.yaml
  text: And Aram fled before Israel[a], and David killed seven thousand chariot warriors from Aram and forty thousand foot soldiers[b], and he put Shophach the commander of the army to death.
translation:
  language: zh_hans
  text: 亚兰人从以色列人面前逃走[a]。大卫杀了亚兰的七千名战车兵和四万名步兵，并杀死了军队统帅朔法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《撒母耳记下》10:18的平行记载为“七百辆战车和四万名骑兵”；本节《历代志》的希伯来文本则为“七千名战车兵和四万名步兵”。
    reason: textual_variant
  - marker: b
    text: 在《撒母耳记下》10:16、18的平行记载中，朔法称为“朔巴”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָם
  choice: 亚兰人／亚兰
  rationale: 首次按上下文译为“亚兰人”，指参战的亚兰军队；第二处“从亚兰”自然处理为“亚兰七千名……”，既保留名称，也避免使用后世地缘名称“叙利亚”。
- source_word: וַיָּנָס
  choice: 逃跑
  rationale: נוּס的常用义是“逃跑、逃走”，这里描述战场溃逃。
- source_word: מִלִּפְנֵי יִשְׂרָאֵל
  choice: 在以色列人面前
  rationale: 贴近希伯来语“从以色列面前”的表达，同时在汉语中清楚传达因以色列军队而溃逃的情景。
- source_word: וַיַּהֲרֹג דָּוִיד
  choice: 大卫杀了
  rationale: הרג直指杀死；采用简明、现代的叙事用语。
- source_word: שִׁבְעַת אֲלָפִים רֶכֶב
  choice: 七千名战车兵
  rationale: רֶכֶב字面可指战车或战车部队，此处数量结构可按转喻理解为战车军兵；“战车兵”不把含义限缩为驾车者，也避免生硬地说杀死战车。
- source_word: וְאַרְבָּעִים אֶלֶף אִישׁ רַגְלִי
  choice: 四万名步兵
  rationale: אִישׁ רַגְלִי字面为“步行的人”，是步兵的军事称谓；“步兵”简洁自然。
- source_word: שׁוֹפַךְ
  choice: 朔法
  rationale: 按《历代志》中的辅音与马所拉读音音译；《撒母耳记》平行记载的不同名称形式另见脚注。
- source_word: שַׂר הַצָּבָא
  choice: 军队统帅
  rationale: 准确表达军队最高指挥官的职衔，语言简洁而庄重。
- source_word: הֵמִית
  choice: 处死
  rationale: מות的使役式表示“使……死”；“处死”与前面的“杀了”有所区分，并保留其使役色彩。
theological_decisions: []
translation_notes:
  register: 采用现代标准普通话和简体中文，叙事简洁庄重。“战车兵”保留רֶכֶב可能指战车军力而不专指驾车者的宽度；正文及脚注标记均完整对应。
