    issue: “从臀部以下割掉一半”错误或含混地重构了衣服被割的界限。
    rationale: 希伯来文的“以一半，直到臀部”描述割去衣服一半、割至臀部一带。现译的“从……以下”把臀部设为起点，并可能表示仅从该处以下割掉一半，未妥善保留原句含义。
  - severity: low
    issue: “放他们走了”略带释放拘押者的意味。
    rationale: וַיְשַׁלְּחֵם意为差遣、遣走；“打发他们走了”更贴合此处羞辱后将使者遣离的语境。
  - severity: low
    issue: 脚注b对暴露的说明可更精确地区分原文措辞与语境含义。
    rationale: 原文以“到臀部”为衣物被割的界限；下身暴露和公开羞辱是该动作的语境含义，不宜说成原文直接陈述。
