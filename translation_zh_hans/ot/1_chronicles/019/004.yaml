- from: 哈嫩就拿住大卫的臣仆[a]，把他们剃了，又把他们的衣服从臀部以下割掉一半[b]，然后放他们走了。
  to: 哈嫩就拿住大卫的臣仆[a]，剃了他们，又把他们的衣服割去一半，直割到臀部[b]，然后打发他们走了。
  rationale: 修订将衣物的割裁准确表述为“割去一半，直割到臀部”，不把“到臀部”的终点改写为“从臀部以下”的起点；同时将“放他们走了”改为更符合遣走含义的“打发他们走了”。保留“剃了他们”的省略，以免从《撒母耳记下》的平行记载补入“胡须”。
