base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/004.yaml
  text: So Hanun took David’s servants[a], shaved them, cut their garments in half up to the hips[b], and sent them away.
translation:
  language: zh_hans
  text: 哈嫩就拿住大卫的臣仆[a]，剃了他们，又把他们的衣服割去一半，直割到臀部[b]，然后打发他们走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 平行经文《撒母耳记下》10:4明确说，哈嫩剃去他们一半的胡须；本节原文只说“剃了他们”。
    reason: cross_reference
  - marker: b
    text: 原文的界限词指臀部（后部）一带：衣服被割去一半，直割到该处；这会使下身暴露，以此公开羞辱他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: 臣仆
  rationale: 该词可指仆人或臣属；这里是奉大卫差遣的王室人员。“臣仆”既体现他们服事君王的身份，也不暗示其必为奴隶。
- source_word: וַיְגַלְּחֵם
  choice: 把他们剃了
  rationale: 原文只说“剃他们”，没有明说所剃部位；此译保留《历代志》的省略，不把《撒母耳记下》10:4“剃去一半胡须”的细节直接写入正文。
- source_word: מַדְוֵיהֶם
  choice: 他们的衣服
  rationale: 该词指衣服、服装；“衣服”自然清楚，也足以表达对使臣服饰的毁损。
- source_word: בַּחֵצִי
  choice: 割掉一半
  rationale: 表示将衣服截去一半；结合界限短语，译为“从臀部以下割掉一半”，清楚呈现下半截被割去。
- source_word: עַד הַמִּפְשָׂעָה
  choice: 从臀部以下
  rationale: מִפְשָׂעָה 指后臀部位，短语标明衣服被割到臀部，从而使下体暴露受辱；用“臀部”比“胯部”更贴近词义。
- source_word: וַיְשַׁלְּחֵם
  choice: 放他们走了
  rationale: 该动词意为差走、送走；在强行羞辱之后，“放他们走了”自然传达将他们遣走的语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“拿住”体现 וַיִּקַּח 在此并非普通的“带领”，而是控制使臣后加以羞辱；“把他们剃了”刻意保留原文未说明剃何处的含混。正文以“臀部”准确传达 מִפְשָׂעָה，并由脚注说明暴露和公开羞辱的含义。
