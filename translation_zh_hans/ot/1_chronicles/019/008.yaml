  yaml_path: translation/ot/1_chronicles/019/008.yaml
  text: When David heard, he sent Joab and all the army of the mighty men.
translation:
  language: zh_hans
  text: 大卫听见了[a]，就派约押和所有勇士组成的军队[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“获悉此事”或“得到了消息”。
    reason: lexical_alternative
  - marker: b
    text: “勇士”可指大卫手下英勇善战的战士，也可能特指他的精锐部队。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见了
  rationale: 直接对应“听见”，在叙事语境中自然包含听到消息、获悉此事之意，同时保留原文简洁表达。
- source_word: וַיִּשְׁלַח
  choice: 派……出战
  rationale: שלח的基本意义是“派出”；军事语境和上文情势使出战之意明确。中文补出“出战”，使句子自然完整而不改变行动性质。
- source_word: יוֹאָב
  choice: 约押
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: כָּל
  choice: 所有
  rationale: 直接表达整体范围。
- source_word: צָבָא
  choice: 军队
  rationale: 在军事叙事中指有组织的作战力量，“军队”是清楚、现代的对应词。
- source_word: הַגִּבּוֹרִים
  choice: 勇士
  rationale: גִּבּוֹרִים在此指英勇善战之人，也可能特指大卫麾下的精锐战士；“勇士”既保留词义，也不把所指范围解释得过窄。
- source_word: וְאֵת כָּל צְבָא הַגִּבּוֹרִים
  choice: 和所有勇士组成的军队
  rationale: 按马所拉文本的连属结构表达“勇士的全军”。中文用“勇士组成的军队”避免生硬的“勇士之军”，并保留这支军队与勇士之间的关系。
