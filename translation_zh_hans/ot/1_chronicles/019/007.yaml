base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/007.yaml
  text: So they hired for themselves thirty-two thousand chariots[a], and the king of Maacah with his people. They came and camped before Medeba[b], and the sons of Ammon gathered from their cities and came to battle.
translation:
  language: zh_hans
  text: 于是，他们为自己雇了三万二千辆战车[a]，还雇了玛迦王和他的百姓。他们前来，在米底巴对面安营；亚扪人[b]也从各城聚集起来，前来交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战车”也可集合性地指战车部队，不一定只是在逐辆计算车辆。
    reason: lexical_alternative
  - marker: b
    text: “亚扪人”原文直译为“亚扪之子”，是希伯来语常用的族群称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכְּרוּ לָהֶם
  choice: 他们为自己雇了
  rationale: שׂכר表示付酬雇用，לָהֶם表示受益关系；译文保留“雇”的直白含义，不擅自明确为“雇佣兵”。
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: 三万二千辆战车
  rationale: 数字按现代汉语语序表达；רֶכֶב可指战车本身，也可集合性地指战车部队，正文采用传统而直接的“战车”，并以脚注保留歧义。
- source_word: מֶלֶךְ מַעֲכָה וְאֶת עַמּוֹ
  choice: 玛迦王和他的百姓
  rationale: מַעֲכָה在此为地名；עַמּוֹ字面是“他的百姓”，军事语境中可能指其军队，但不在正文中过度限定。
- source_word: לִפְנֵי מֵידְבָא
  choice: 在米底巴对面
  rationale: לִפְנֵי在地理和军事语境中可表示“在……前面、对面”；“对面”自然表达其空间关系，又不进一步推定具体方位。
- source_word: בְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 该短语字面为“亚扪之子”，是常见族群称谓；现代汉语以“亚扪人”表达更自然准确，脚注说明其字面形式。
- source_word: נֶאֶסְפוּ מֵעָרֵיהֶם וַיָּבֹאוּ לַמִּלְחָמָה
  choice: 也从各城聚集起来，前来交战
  rationale: 保留聚集和前来两个连续动作；לַמִּלְחָמָה在此表示投入战斗，译作“交战”符合现代汉语叙事。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“玛迦”“米底巴”“亚扪”沿用简体中文圣经传统音译。按原文句法，“玛迦王和他的百姓”也是受雇对象，故在汉语中补出第二个“雇了”，使关系清楚；不将“百姓”窄化为“军队”。
