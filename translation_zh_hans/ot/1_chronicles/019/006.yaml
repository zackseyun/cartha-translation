base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/006.yaml
  text: When the Ammonites saw that they had become odious to David[a], Hanun and the Ammonites sent a thousand talents of silver to hire for themselves chariots and horsemen from Aram-naharaim, from Aram-maacah[b], and from Zobah.
translation:
  language: zh_hans
  text: 亚扪人发现自己已令大卫厌恶[a]，哈嫩和亚扪人就送出一千他连得银子，为自己从亚兰·拿哈莱[b]、亚兰·玛迦和琐巴雇用战车和骑兵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “令大卫厌恶”按希伯来文直译是“使自己在大卫那里发臭”，是指变得令大卫反感或憎恶。
    reason: lexical_alternative
  - marker: b
    text: “亚兰·拿哈莱”传统上理解为“两河的亚兰”，即美索不达米亚。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 见
  rationale: 保留ראה的基本义，同时在本语境中自然表达亚扪人察觉到自身处境。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 这是民族称谓；译作“亚扪人”比形式直译“亚扪之子”更符合现代汉语。
- source_word: הִתְבָּאֲשׁוּ עִם דָּוִיד
  choice: 自己已经招大卫厌恶
  rationale: 该短语字面涉及“发臭”，在此是指因自己的行为而变得令大卫憎恶；“招……厌恶”既表达结果，也保留反身形式所暗示的自招后果。
- source_word: וַיִּשְׁלַח
  choice: 送出
  rationale: 这里所送的是银子；“送出”清楚表达将款项付出以招募军力。
- source_word: חָנוּן וּבְנֵי עַמּוֹן
  choice: 哈嫩和亚扪人
  rationale: 按照希伯来文并列结构，保留哈嫩与亚扪人共同作主语。
- source_word: אֶלֶף כִּכַּר כֶּסֶף
  choice: 一千他连得银子
  rationale: 保留古代重量单位כִּכָּר的传统音译，不擅自换算成不确定的现代重量或币值。
- source_word: לִשְׂכֹּר לָהֶם
  choice: 为自己……雇用
  rationale: “雇用”表达שׂכר，“为自己”保留לָהֶם所表达的受益或自用含义。
- source_word: אֲרַם נַהֲרַיִם
  choice: 亚兰·拿哈莱
  rationale: 将复合地名作为专名音译；其传统地理解释置于脚注，避免正文过度释义。
- source_word: אֲרַם מַעֲכָה
  choice: 亚兰·玛迦
  rationale: 按复合地区名称音译，保留其专名性质。
- source_word: מִצּוֹבָה
  choice: 琐巴
  rationale: 采用该地名通行的中文圣经译名。
- source_word: רֶכֶב
  choice: 战车
  rationale: 该单数在这里具有集合意义；汉语“战车”可自然统称所雇用的战车军力。
- source_word: וּפָרָשִׁים
  choice: 骑兵
  rationale: 指骑马作战的部队；“骑兵”在现代汉语中简洁自然，并与“战车”构成军事力量的并列。
