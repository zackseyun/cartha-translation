base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/015.yaml
  text: When the Ammonites saw that Aram had fled[a], they also fled before Abishai his brother and entered the city[b]. Then Joab came to Jerusalem.
translation:
  language: zh_hans
  text: 亚扪人看见亚兰[a]逃跑了，就也从约押的兄弟亚比筛[b]面前逃跑，进了城。随后，约押来到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰”在这里集合性地指亚兰军队；传统译法有“叙利亚人”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“亚比筛，他的兄弟”；按上下文，“他的”指约押。
    reason: referent_clarification
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: “亚扪之子”是指亚扪民族的希伯来语习语；译作“亚扪人”自然、准确，并不限定为男性后裔。
- source_word: רָאוּ כִּי נָס
  choice: 看见……逃跑了
  rationale: רָאוּ是普通的“看见”，כִּי引出所看见的内容；“逃跑了”表达其逃跑先于亚扪人的反应。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 保留希伯来专名；此处以地域或民族名称集合性地指亚兰军队。
- source_word: וַיָּנוּסוּ גַם הֵם
  choice: 就也……逃跑
  rationale: “也”保留גַם הֵם所表达的对应关系，“就”自然衔接他们看见亚兰败退后的行动。
- source_word: מִפְּנֵי
  choice: 从……面前
  rationale: 在军事叙事中表示面对敌军而退逃；该译法既贴近原文，又符合中文表达。
- source_word: אַבְשַׁי אָחִיו
  choice: 约押的兄弟亚比筛
  rationale: אָחִיו直译为“他的兄弟”；按叙事语境，代词最自然地回指约押。正文明确所指，以免现代中文产生错误指代，脚注保留原文形式。
- source_word: וַיָּבֹאוּ הָעִירָה
  choice: 进了城
  rationale: הָעִירָה的方向词尾表示进入城中；“进了城”简洁自然，也体现退入城内寻求防护的动作，但不补出原文未明说的城名。
- source_word: וַיָּבֹא יוֹאָב יְרוּשָׁלִָם
  choice: 随后，约押来到耶路撒冷
  rationale: 连续叙事形式推动事件发展；“来到”忠实于בוא，不采用虽合语境却增添返程含义的“回到”。
