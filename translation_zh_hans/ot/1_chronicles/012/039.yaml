base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/039.yaml
  text: All these were men of war[a], arrayed for battle, who came to Hebron with a whole heart to make David king over all Israel; and also all the rest of Israel were of one heart to make David king.
translation:
  language: zh_hans
  text: 所有这些人都是战士，列阵备战；他们全心全意来到希伯仑，要立大卫作全以色列的王。以色列其余所有的人[a]也都一心要立大卫作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列所有的余民”。这里按上下文更可能是指“以色列其余的人”，而不是先知书中常带特定神学含义的“余民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: 战士
  rationale: 原文直译为“战争之人”，指参与作战的男子；“战士”在现代汉语中简洁自然，并保留军事身份。
- source_word: עֹדְרֵי מַעֲרָכָה
  choice: 列阵备战
  rationale: 该分词短语含有编排、组成战阵的意味；“列阵备战”既保留战斗队形的意象，也符合现代汉语表达。
- source_word: בְּלֵבָב שָׁלֵם
  choice: 全心全意
  rationale: 原文表达内心完整、意向不分裂；“全心全意”自然传达毫无保留的忠诚和意愿。
- source_word: בָּאוּ חֶבְרוֹנָה
  choice: 来到希伯仑
  rationale: 地名后的方向词尾表示朝希伯仑而去；叙事中译作“来到希伯仑”自然准确。
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: 立大卫作王
  rationale: 使役形表示使大卫作王、拥立他掌权；“立……作王”不额外引入加冕仪式。
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: 作全以色列的王
  rationale: 介词表达大卫对全以色列的统治；按汉语王权表达重组为“作全以色列的王”。
- source_word: כָּל שֵׁרִית יִשְׂרָאֵל
  choice: 以色列其余的人
  rationale: שֵׁרִית 可指“余民”或一般意义上的“其余部分”；本节叙事语境指前述名单之外的以色列人，故正文采用“其余的人”。
- source_word: לֵב אֶחָד
  choice: 一心
  rationale: 原文直译为“一颗心”，表示共同一致的意愿；“一心”保留心的意象，又符合现代汉语习惯。
theological_decisions:
- issue: שֵׁרִית 是否应采用带有先知文学神学色彩的“余民”
  choice: 以色列其余的人
  alternative: 以色列所有的余民
  rationale: 这里是历史叙事对全国拥护大卫的概括，重点在名单所列人员之外的其余以色列人；译作“其余的人”避免把本节未凸显的“余民”神学概念带入正文，同时以脚注保留词义可能性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“列阵备战”保留军事队形意味；“全心全意”与“一心”分别对应原文“完整的心”和“一颗心”，在自然汉语中保留二者的呼应。
