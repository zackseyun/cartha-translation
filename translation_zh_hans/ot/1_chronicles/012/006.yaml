  text: Eluzai[a], Jerimoth, Bealiah, Shemariahu, and Shephatiah the Haruphite.
translation:
  language: zh_hans
  text: 以利乌赛、耶利摩、比亚利雅、示玛利雅和哈利弗族的示法提雅。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“哈鲁弗族的”。这个希伯来语族属称谓可能指向别处也写作“哈利弗”的宗族名称。
    reason: 保留族名在传抄、元音传统及对应音译上的可能异读；正文依WLC所标元音采用“哈利弗”。
lexical_decisions:
- source_word: אֶלְעוּזַי
  choice: 以利乌赛
  rationale: 人名按希伯来语音译，并采用现代中文圣经读者较易辨认的形式。
- source_word: וִירִימוֹת
  choice: 耶利摩
  rationale: 人名音译；词首连接词不逐一译出，而用中文列举标点表达。
- source_word: וּבְעַלְיָה
  choice: 比亚利雅
  rationale: 人名音译，保留末尾表示神名成分的“-雅”。
- source_word: וּשְׁמַרְיָהוּ
  choice: 示玛利雅
  rationale: 人名音译；以中文常见的“-雅”形式表达希伯来语神名结尾，而不勉强复制完整音节。
- source_word: וּשְׁפַטְיָהוּ
  choice: 示法提雅
  rationale: 人名音译，采用中文圣经传统中清楚、易认的形式。
- source_word: הַחֲרִיפִי
  choice: 哈利弗族的
  rationale: 这是带定冠词的族属称谓，单数形式在句法上修饰紧邻的“示法提雅”。WLC的元音标注支持将族名理解为“哈利弗”，故译作“哈利弗族的”。
theological_decisions: []
translation_notes:
  register: 采用简洁庄重的现代汉语名单体例；连接词由顿号和“和”自然表达。将族属称谓置于其所修饰的人名前，避免中文读者误以为它修饰整份名单；脚注标记放在相关称谓所在分句之后。
