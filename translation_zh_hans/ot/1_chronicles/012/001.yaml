base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/001.yaml
  text: These are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
translation:
  language: zh_hans
  text: 以下是那些在大卫仍因基士的儿子扫罗而受限制时，来到洗革拉见大卫的人[a]；他们也在勇士之列[b]，是协助作战的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受限制”也可译作“受阻”“被约束”或“被困”；原文没有明确说明大卫是否遭到监禁。
    reason: lexical_alternative
  - marker: b
    text: “勇士”原文指英勇善战的人，也可译作“英勇的战士”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 用于引出下文名单，保留指示作用，并以自然的现代汉语承接上下文，不额外加入时间性的“现在”。
- source_word: הַבָּאִים אֶל דָּוִיד לְצִיקְלַג
  choice: 到洗革拉投奔大卫的人
  rationale: 直译结构是“来到洗革拉、到大卫那里的人”；结合名单所述归附情境，“投奔”自然表达其来到大卫身边的目的，而“洗革拉”标明地点。
- source_word: עוֹד עָצוּר
  choice: 仍……行动受限
  rationale: עוֹד表示持续状态；עָצוּר表示受阻、受约束，但不必然指被监禁。“行动受限”保留其宽泛含义。
- source_word: מִפְּנֵי שָׁאוּל בֶּן קִישׁ
  choice: 因基士的儿子扫罗
  rationale: מִפְּנֵי在此表示扫罗造成这一处境的原因；按希伯来语亲属称谓完整译出。
- source_word: בַּגִּבּוֹרִים
  choice: 勇士中的一员
  rationale: גִּבּוֹרִים在军事语境中指英勇善战的战士；“勇士”简洁而保留传统和军事色彩。原文复数主语配合群体表述，汉语可自然说“他们是勇士中的一员”。
- source_word: עֹזְרֵי הַמִּלְחָמָה
  choice: 在争战中帮助大卫
  rationale: 该短语字面为“战争的帮助者”；补出语境中明确的受助者“大卫”，使汉语完整易懂，同时不改变其军事支援含义。
theological_decisions: []
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“以下是”自然引出名单；句中保留“仍”和因果关系。避免用“被囚禁”过度限定עָצוּר，也避免把גִּבּוֹרִים弱化为泛指的“有能力的人”。
