lexical_decisions:
- source_word: יִרְמְיָה
  choice: 耶利米
  rationale: 采用现代中文圣经读者熟悉的希伯来人名译法；原文为专名，不翻译其词源含义。
- source_word: יַחֲזִיאֵל
