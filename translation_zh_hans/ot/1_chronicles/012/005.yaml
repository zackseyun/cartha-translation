  rationale: 采用通行的中文音译，保留其作为人名的功能，不展开词源意义。
- source_word: יוֹחָנָן
  choice: 约哈难
  rationale: 采用通行且易辨识的中文音译，与希伯来人名的形式相符。
- source_word: יוֹזָבָד
  choice: 约撒拔
  rationale: 采用中文圣经传统中较通行的音译，不把人名的词源意义译入正文。
- source_word: הַגְּדֵרָתִי
  choice: 基低拉人
  rationale: 将带定冠词的族属形容词自然译为“基低拉人”，表明约撒拔与基低拉的地域或宗族关联，同时在脚注中保留具体关系的不确定性。
