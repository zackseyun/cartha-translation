  text: They were there with David for three days[a], eating and drinking, because their brothers had prepared for them.
translation:
  language: zh_hans
  text: 他们与大卫在那里待了三天，吃喝，因为他们的弟兄[a]已为他们作了预备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的同族人”或“他们的亲属”。希伯来文直译为“他们的弟兄”；在这里也可能泛指同宗族或同支派的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 住了
  rationale: 该叙事形式在这里表示一段时间内身处某地；结合“三天”译作“住了”，比直译“是”更符合现代汉语，同时不增加长期居住之意。
- source_word: שָׁם
  choice: 在那里
  rationale: 简洁表达地点副词所指的聚集之处。
- source_word: עִם דָּוִיד
  choice: 与大卫一同
  rationale: 准确表达陪同、相伴或共同在场的关系。
- source_word: יָמִים שְׁלוֹשָׁה
  choice: 三天
  rationale: 在“住了”之后，现代汉语可直接用数量短语表示持续时间。
- source_word: אֹכְלִים וְשׁוֹתִים
  choice: 吃喝
  rationale: 保留两个分词所描述的持续活动，不将其解释性地概括为“宴饮”。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达后句给出的原因。
- source_word: הֵכִינוּ
  choice: 预备好了
  rationale: 希菲尔词形表示预备、使之就绪；“好了”体现这些供应事先已经备妥，但不擅自补出具体宾语。
- source_word: לָהֶם
  choice: 为他们
  rationale: 按原文表达受益对象。
- source_word: אֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 保留原文阳性亲属称谓的直接含义；上下文中也可能泛指同族或有亲属关系的人，因此另加脚注说明。
theological_decisions:
- issue: אֲחֵיהֶם 是否按较宽泛的群体亲属意义翻译
  choice: 他们的弟兄
  alternative: 他们的同族人；他们的亲属
  rationale: 正文保留希伯来文“弟兄”的具体称谓，不把可能的宽泛语义直接确定下来；脚注呈现上下文容许的其他理解，以保留原文的语义幅度。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“吃喝”保持原文简洁直白的叙述；“预备好了”保留宾语未明说的特点，由上下文推知所预备的是饮食供应。脚注标记置于实际涉及歧义的“弟兄”之后。
