  text: אֵ֣לֶּה הֵ֗ם אֲשֶׁ֨ר עָבְר֤וּ אֶת הַ/יַּרְדֵּן֙ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן וְ/ה֥וּא מְמַלֵּ֖א עַל כָּל גדיתי/ו וַ/יַּבְרִ֨יחוּ֙ אֶת כָּל הָ֣/עֲמָקִ֔ים לַ/מִּזְרָ֖ח וְ/לַֽ/מַּעֲרָֽב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/016.yaml
  text: These are the men who crossed the Jordan in the first month[a], when it was overflowing all its banks, and they put to flight all those in the valleys, to the east and to the west.
translation:
  language: zh_hans
  text: 这些人是在正月过约旦河的；当时河水漫过两岸。他们又使各谷地里的人[a]向东向西逃散。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“所有谷地”；这里按上下文指谷地里的人，因为动词的意思是“使……逃走”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: 这些人
  rationale: 这是强调性的指认表达；上下文所指的是勇士，因此用现代汉语自然地译作“这些人”，不额外添加身份称谓。
- source_word: אֲשֶׁר עָבְרוּ אֶת הַיַּרְדֵּן
  choice: 是在……过约旦河的
  rationale: עָבַר在此指渡过、横过河流；“过约旦河”简洁自然，并保留原文的具体行动。
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: 在正月
  rationale: 直译为“第一个月”；“正月”是现代汉语对历法首月的自然表达，未擅自将其换算为某个现代月份。
- source_word: וְהוּא מְמַלֵּא עַל כָּל גְּדִיתָיו
  choice: 当时河水漫过两岸
  rationale: 代词所指为约旦河；מְמַלֵּא עַל描写涨水漫过河岸。“两岸”符合汉语对河岸的通常表达，也传达全线水满过岸的景象。
- source_word: וַיַּבְרִיחוּ
  choice: 使……逃散
  rationale: 这是ברח的使役形，表示使人逃走；“使……逃散”保留使役意义，同时符合军事叙事语境。
- source_word: אֶת כָּל הָעֲמָקִים
  choice: 各谷地里的人
  rationale: 字面是“所有谷地”，但“使逃散”要求有生命的受事；这里以地点代指其中的居民。“各谷地里的人”使隐含意义清楚，又不把他们具体定为某一族群。
- source_word: לַמִּזְרָח וְלַמַּעֲרָב
  choice: 向东向西
  rationale: 介词ל带有方向意味；将其紧接“逃散”处理，保留原文中被驱散到东西两方的自然读法。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正月”保留古代历法首月的概念；句式按汉语叙事习惯分为两句。脚注标记置于其实际解释的“各谷地里的人”之后，而非置于“正月”之后。
