  yaml_path: translation/ot/1_chronicles/012/002.yaml
  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
translation:
  language: zh_hans
  text: 他们都是弓箭手，左右手都能投石、开弓射箭；他们是扫罗的弟兄[a]，属于便雅悯支派。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“亲族”或“族人”。希伯来语“弟兄”可泛指较广范围的家族成员或同支派的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשְׁקֵי קֶשֶׁת
  choice: 装备弓箭
  rationale: 该短语字面指持有、使用弓的人。“装备弓箭”既贴近原文的军事装备含义，也符合现代汉语表达；此处“弓箭”作为常用合称，不表示原文另有“箭”字。
- source_word: מַיְמִינִים וּמַשְׂמִאלִים
  choice: 左右手都能
  rationale: 两个使役分词在这里强调左右手均能熟练运用武器，而不只是说明惯用哪只手。
- source_word: בָּאֲבָנִים
  choice: 投石
  rationale: 原文只说“用石头”，在军事语境中表示投掷石块；译作“投石”自然清楚，同时不擅自加入原文没有明说的“机弦”。
- source_word: וּבַחִצִּים בַּקָּשֶׁת
  choice: 开弓射箭
  rationale: 将“用弓、用箭”的工具关系译成自然的现代汉语，准确表达射箭的动作。
- source_word: מֵאֲחֵי שָׁאוּל
  choice: 扫罗的弟兄
  rationale: 保留 אָח 的直接亲属用语“弟兄”，不在正文中预先限定为同胞兄弟或较广义的亲族；其可能的广义用法在脚注说明。
- source_word: מִבִּנְיָמִן
  choice: 属于便雅悯支派
  rationale: 原文直译为“来自便雅悯”，这里指支派归属；明确译出“支派”更符合现代读者的理解。
