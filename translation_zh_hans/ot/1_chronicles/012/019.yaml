  text: וְ/ר֣וּחַ לָבְשָׁ֗ה אֶת עֲמָשַׂי֮ רֹ֣אשׁ ה/שלושים לְ/ךָ֤ דָוִיד֙ וְ/עִמְּ/ךָ֣ בֶן יִשַׁ֔י שָׁל֨וֹם שָׁל֜וֹם לְ/ךָ֗ וְ/שָׁלוֹם֙ לְ/עֹ֣זְרֶ֔/ךָ כִּ֥י עֲזָרְ/ךָ֖ אֱלֹהֶ֑י/ךָ וַ/יְקַבְּלֵ֣/ם דָּוִ֔יד וַֽ/יִּתְּנֵ֖/ם בְּ/רָאשֵׁ֥י הַ/גְּדֽוּד־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/019.yaml
  text: And the Spirit clothed Amasai, chief of the Thirty, and he said, “Yours are we, David, and with you, son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” Then David received them and made them chiefs of the troops.
translation:
  language: zh_hans
  text: '灵[a]披覆了三十勇士的首领亚玛撒。他说：


    “ 大卫啊，我们是你的人！

    耶西的儿子啊，我们与你同在！

    愿你平安，愿你平安！

    愿帮助你的人也平安[b]，

    因为你的神帮助你[c]。”


    大卫就接纳他们，立他们作军队的首领。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“灵披覆了亚玛撒”。也可理解为“神的灵临到亚玛撒”或“有一个灵披覆了亚玛撒”。
    reason: 保留רוּחַ指称上的歧义，并说明לָבַשׁ在此“披覆”的希伯来文隐喻。
  - marker: b
    text: 或译：“愿帮助你的那一位也平安。”原文“帮助者”是单数形式，也可能具有集合意义。
    reason: 说明单数形式与集合性理解之间的词汇选择。
  - marker: c
    text: 或译：“因为你的神已经帮助了你。”
    reason: 保留希伯来文完成式可能表达既成帮助的语感。
lexical_decisions:
- source_word: וְרוּחַ לָבְשָׁה אֶת־עֲמָשַׂי
  choice: 灵披覆了亚玛撒
  rationale: 保留希伯来文“灵给某人穿上／披覆某人”的鲜明隐喻，同时不在正文中加入原文没有的“神的”或以“圣灵”消除“灵”的指称张力。
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  choice: 三十勇士的首领
  rationale: רֹאשׁ 表示“首领”；“三十”在此指一个为读者所知的军事勇士群体。补出“勇士”使现代汉语含义清楚，而不把它误读为单纯的数字。
- source_word: לְךָ דָוִיד
  choice: 大卫啊，我们是你的人
  rationale: 这是简短的归属、效忠表达。译作“我们是你的人”既体现前置的“归你”，也符合自然现代汉语。
- source_word: וְעִמְּךָ בֶן־יִשַׁי
  choice: 耶西的儿子啊，我们与你同在
  rationale: 原文是无动词的介词短语；汉语补出“我们”，保留与上一句平行的效忠宣告。
- source_word: שָׁלוֹם שָׁלוֹם לְךָ
  choice: 愿你平安，愿你平安
  rationale: 保留 שָׁלוֹם 的重复及其强调作用，并用“愿”表达此处祝愿语气。
- source_word: וְשָׁלוֹם לְעֹזְרֶךָ
  choice: 愿帮助你的人也平安
  rationale: 原文“帮助者”形式上是单数，但可作集合意义；汉语“帮助你的人”同样可以保持单复数未明的特点。
- source_word: כִּי עֲזָרְךָ אֱלֹהֶיךָ
  choice: 因为你的神帮助你
  rationale: 完成式在语境中可陈述神已经显明且持续有效的帮助；正文采用简洁的现在陈述，并以脚注保留完成时译法。
- source_word: וַיְקַבְּלֵם
  choice: 大卫就接纳他们
  rationale: קבל 可表示“接收、接纳”；此处涉及大卫接受这群人的归附，“接纳”较符合上下文。
- source_word: וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  choice: 立他们作军队的首领
  rationale: 直译近于“把他们置于队伍的首领中”，实际表达任命领导职分；“立……作”自然地传达这一意思。גְּדוּד 可指军队、队伍或战团，此处取较宽泛的“军队”。
theological_decisions:
- issue: רוּחַ 是特指神的灵，还是泛指某种灵或感发
  choice: 正文译作“灵”，不加“圣”或“神的”
  alternative: 圣灵；神的灵；有一个灵
  rationale: 上下文很可能指神的灵赋能亚玛撒发言，但希伯来文没有冠词，也未明说“神的”。中文正文保留“灵”的指称张力，脚注说明可能理解。
- issue: עֲזָרְךָ 所表达帮助的时态
  choice: 帮助你
  alternative: 已经帮助了你
  rationale: 希伯来文完成式既可着眼于已经发生的帮助，也可在此陈述神已证实的持续扶助；不宜凭神学预设排除任一语感。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。诗性宣告分行排列，以保留原文的平行、重复和节奏；避免使用过度教会化的固定术语，也不把“灵”的身份在正文中解释得比原文更明确。
