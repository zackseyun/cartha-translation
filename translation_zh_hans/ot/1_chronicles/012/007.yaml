  text: Elkanah[a], Isshiah, Azarel, Joezer, and Jashobeam, the Korahites.
translation:
  language: zh_hans
  text: 以利加拿、耶西亚、亚萨列、约以谢和雅朔班，都是可拉族人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“可拉的后裔”。
    reason: 原文是宗族称谓，可直译为“可拉族人”，也可把其中的血缘含义明确表达为“可拉的后裔”。
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: 以利加拿
  rationale: 专有名词，采用现代中文圣经中较通行且易于辨识的音译。
- source_word: יִשִּׁיָּהוּ
  choice: 耶西亚
  rationale: 专有名词，依希伯来语形式音译，并采用中文圣经传统中较通行的写法。
- source_word: עֲזַרְאֵל
  choice: 亚萨列
  rationale: 专有名词，采用中文圣经中通行的音译形式。
- source_word: יוֹעֶזֶר
  choice: 约以谢
  rationale: 专有名词，按希伯来语音译，并沿用中文读者较熟悉的圣经人名形式。
- source_word: יָשָׁבְעָם
  choice: 雅朔班
  rationale: 按本节马所拉文本所载的人名形式音译，不以其他经文中的相关异名替代。
- source_word: הַקָּרְחִים
  choice: 可拉族人
  rationale: 带定冠词的复数宗族称谓；“可拉族人”简洁自然，并保留其族属含义。
