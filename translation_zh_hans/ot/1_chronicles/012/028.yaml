  yaml_path: translation/ot/1_chronicles/012/028.yaml
  text: and Jehoiada[a], the leader of Aaron, and with him three thousand seven hundred.
translation:
  language: zh_hans
  text: 还有亚伦家的领袖[a]耶何耶大；随同他的有三千七百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚伦家的领袖”也可理解为“为亚伦（家）作领袖的”，即与亚伦祭司家系相关的首领。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹיָדָע
  choice: 还有……耶何耶大
  rationale: 前缀 ו 延续上文列举人员的结构；在现代汉语中用“还有”自然承接名单。专名按常见圣经译名音译为“耶何耶大”。
- source_word: הַנָּגִיד
  choice: 领袖
  rationale: נָגִיד 可指领袖、首领或统领；“领袖”清楚自然，也避免“王子”等可能引出的君王身份含义。
- source_word: לְאַהֲרֹן
  choice: 亚伦家的
  rationale: 介词 לְ 在此表示归属或关联；结合祭司家系的语境，“亚伦家的”自然表达耶何耶大与亚伦家族的关系，同时以脚注保留“代表亚伦家”的可能理解。
- source_word: וְעִמּוֹ
  choice: 跟随他的有
  rationale: 原文直译为“与他同在的”；在点数随员的名单语境中，“跟随他的有”符合现代汉语表达，并保留这些人与耶何耶大同属一队的意思。
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁבַע מֵאוֹת
  choice: 三千七百人
  rationale: 准确保留原文人数；补出汉语量词“人”，使句意完整自然。
theological_decisions:
- issue: לְאַהֲרֹן 所表达的关系
  choice: 译作“亚伦家的领袖”
  alternative: “代表亚伦家的领袖”或“亚伦的领袖”
  rationale: 上下文列举前来拥护大卫的人，亚伦在此很可能指亚伦祭司家系，而非已经去世多时的亚伦本人。正文以简洁的家族归属表达，脚注保留代表该祭司家系的解释，避免把原文含蓄的关系过度确定化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“还有”承接上下文名单；“跟随他的有”将希伯来语并列结构转换为符合汉语习惯的人数陈述。脚注标记置于整节末尾，所释对象在正文中明确可辨。
