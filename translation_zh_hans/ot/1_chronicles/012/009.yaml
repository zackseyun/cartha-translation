base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/009.yaml
  text: Some of the Gadites separated themselves to David at the stronghold in the wilderness[a], mighty warriors, men of the army for battle, able to handle shield and spear, whose faces were like the faces of lions[c][b], and who were as swift as gazelles on the mountains.
translation:
  language: zh_hans
  text: 迦得人中有一些人离开本族，来到旷野的堡垒投奔大卫[a]。他们是英勇的战士，是能上阵作战的军人，善于使用盾牌和长矛[b]；他们面容如狮，敏捷如山上的羚羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“迦得人中有一些人离开本族，投奔在旷野堡垒中的大卫。”原文的介词结构可理解为这些人来到堡垒，也可理解为大卫当时在堡垒中。
    reason: alternative_reading
  - marker: b
    text: 直译：“摆开盾牌和长矛。”这里指他们善于操持兵器，并已准备好作战。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַגָּדִי
  choice: 迦得人中有一些
  rationale: מן加族名表示来自迦得支派；本节所指是其中一部分人，译为“中有一些”符合现代汉语，也不暗示全支派都来了。
- source_word: נִבְדְּלוּ
  choice: 离开本族
  rationale: בדל的尼法勒式表示分离、离开；结合“从迦得人中”补出“本族”，保留其主动脱离原群体的语意而不推断动机。
- source_word: אֶל דָּוִיד
  choice: 投奔……大卫
  rationale: 字面为“到大卫那里”；语境表明他们前去归附大卫。“投奔”是自然汉语，但不额外规定政治或神学性质。
- source_word: לַמְצַד מִדְבָּרָה
  choice: 在旷野堡垒里的
  rationale: מְצַד指堡垒或据点，מִדְבָּרָה带有朝旷野方向的色彩。正文按大卫身处旷野堡垒理解，脚注保留“前往堡垒”的句法可能。
- source_word: גִּבֹּרֵי הַחַיִל
  choice: 英勇的战士
  rationale: 这是常见的军事称谓，指勇猛有力的作战者；译文自然、庄重，又保留军事语气。
- source_word: אַנְשֵׁי צָבָא לַמִּלְחָמָה
  choice: 能上阵作战的军人
  rationale: 原文强调他们是为战争而备的军中之人。“能上阵作战”以现代汉语表达其作战资格和军人身份。
- source_word: עֹרְכֵי צִנָּה וָרֹמַח
  choice: 善于使用盾牌和长矛
  rationale: ערך字面有排列、摆开之意，在军事语境中表示能摆开或操持兵器迎战；正文传达熟练备战之意，脚注保留字面形象。
- source_word: וּפְנֵי אַרְיֵה פְּנֵיהֶם
  choice: 他们面貌如狮
  rationale: 保留原文明确的明喻及威武凶猛的形象，不把比喻进一步解释为某一种性格。
- source_word: וְכִצְבָאִים עַל הֶהָרִים לְמַהֵר
  choice: 行动敏捷，如山上的羚羊
  rationale: צְבָאִים指羚羊一类以迅捷著称的动物，לְמַהֵר明确突出快速；调整语序后符合现代汉语，同时保留山地羚羊的意象。
