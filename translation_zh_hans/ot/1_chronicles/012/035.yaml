  yaml_path: translation/ot/1_chronicles/012/035.yaml
  text: 'From Naphtali: 1,000 commanders[b][a], and with them 37,000 with shield and spear.'
translation:
  language: zh_hans
  text: 来自拿弗他利支派的，有1,000名将领[a]；随同他们的，有37,000人，配有盾牌[b]和矛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “将领”也可译作“首领”或“统领”。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“盾牌”的希伯来语也可特指可遮护身体的大型盾牌。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנַּפְתָּלִי
  choice: 来自拿弗他利支派的
  rationale: 前缀连词与介词直译为“并且来自拿弗他利”；在名单语境中用“来自拿弗他利支派的”自然承接上下文，并明确这是支派名称。
- source_word: שָׂרִים
  choice: 将领
  rationale: 该词可指首领、官长或军事统领；本节处于军事人员名录中，“将领”既体现其领导身份，也不限定具体军阶。
- source_word: אָלֶף
  choice: 1,000名
  rationale: 此处是通常的基数词“千”；军事名录采用阿拉伯数字便于阅读，并以量词“名”配合将领。
- source_word: וְעִמָּהֶם
  choice: 随同他们的
  rationale: 保留“与他们同在、随同他们”的关系，表明后述37,000人与前述将领同行。
- source_word: בְּצִנָּה
  choice: 手持大盾
  rationale: 介词短语表达配备或持有武器；צִנָּה通常指可遮护身体的大盾，译为“手持大盾”符合汉语军事名录的自然表达。
- source_word: וַחֲנִית
  choice: 和矛
  rationale: חֲנִית是常见的长柄刺击武器，现代汉语以“矛”简明准确。
- source_word: שְׁלֹשִׁים וְשִׁבְעָה אָלֶף
  choice: 37,000人
  rationale: 原文为“三十七千”；用阿拉伯数字呈现名单中的人数，并补出汉语所需量词“人”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的名单体表达。分号区分1,000名将领与随行的37,000人，避免误读为总数或同位说明；“手持”将希伯来语表示装备的介词短语自然转化为汉语。所有脚注标记均紧随相关词语。
