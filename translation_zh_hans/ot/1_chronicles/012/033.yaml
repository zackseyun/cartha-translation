  text: וּ/מִ/בְּנֵ֣י יִשָּׂשכָ֗ר יוֹדְעֵ֤י בִינָה֙ לַֽ/עִתִּ֔ים לָ/דַ֖עַת מַה יַּעֲשֶׂ֣ה יִשְׂרָאֵ֑ל רָאשֵׁי/הֶ֣ם מָאתַ֔יִם וְ/כָל אֲחֵי/הֶ֖ם עַל פִּי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/033.yaml
  text: 'From the sons of Issachar[a], men who understood the times, to know what Israel should do: their chiefs were two hundred[b], and all their brothers were under their command.'
translation:
  language: zh_hans
  text: 以萨迦的子孙中，有能洞察时势、知道以色列当怎样行的人；他们的首领有二百人，所有同族弟兄都听从他们的号令。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从他们的号令”直译为“按着他们的口”，意思是依从他们的指示或命令。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשָּׂשכָר
  choice: 以萨迦的子孙中
  rationale: מִן与בני表示从该支派成员中列举一群人；“子孙”保留希伯来文的宗族表达，同时符合现代中文圣经叙事语体。句首连接词按中文名单体例自然省略。
- source_word: יוֹדְעֵי בִינָה לָעִתִּים
  choice: 有能洞察时势的人
  rationale: יוֹדְעֵי בִינָה表示具有理解力、辨识力；לָעִתִּים指对当时局势或时代处境的把握。“洞察时势”既体现辨识，也避免仅理解为知道日期或季节。
- source_word: לָדַעַת מַה יַעֲשֶׂה יִשְׂרָאֵל
  choice: 知道以色列当怎样行
  rationale: לָדַעַת承接前句，说明这种辨识所产生的实际认识；未完成式יַעֲשֶׂה在语境中指适宜采取的行动。“当怎样行”保留应然意味，却不把它强化为道德律令。
- source_word: רָאשֵׁיהֶם מָאתַיִם
  choice: 他们的首领有二百人
  rationale: רָאשֵׁיהֶם在此指领袖或首领；中文用“有二百人”自然表达希伯来文无系词的数量句。
- source_word: וְכָל אֲחֵיהֶם
  choice: 所有同族弟兄
  rationale: אֲחֵיהֶם字面为“他们的弟兄”，此处可指同支派的人；“同族弟兄”兼顾字面亲属称谓及支派语境。
- source_word: עַל־פִּיהֶם
  choice: 都听从他们的号令
  rationale: 该短语字面为“按着他们的口”，是服从其话语、指示或权柄的习语；“听从他们的号令”自然呈现领导关系，并保留军事集结语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“洞察时势”传达对历史处境的辨识力；“当怎样行”保留原文关于适当行动的语气。经文只陈述其余同族人服从这些首领，没有进一步赋予特殊宗教职分。
