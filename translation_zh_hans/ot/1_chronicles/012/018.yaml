revisions:
- from: 大卫出去，来到他们面前，回应他们说：“如果你们是为和平而来，要帮助我，我的心就必与你们同心；但如果你们是要把我出卖给我的敌人，而我手中并无暴行[a]，愿我们祖先的上帝察看并审断[b]。”
  to: 大卫出去，到他们面前，回应他们说：“如果你们是平安而来，要帮助我，我的心就必与你们同心；但如果你们是要把我出卖给我的敌人，尽管我手中并无暴行[a]，愿我们祖先的上帝察看并审断[b]。”
  rationale: 修订仅澄清两处语义：以“平安而来”表达来者是否怀着和平善意，并以“尽管”明示大卫对自身无辜的让步性申明。其余译文及脚注均可保留。
