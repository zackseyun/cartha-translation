  text: וַ/יֵּצֵ֣א דָוִיד֮ לִ/פְנֵי/הֶם֒ וַ/יַּ֨עַן֙ וַ/יֹּ֣אמֶר לָ/הֶ֔ם אִם לְ/שָׁל֞וֹם בָּאתֶ֤ם אֵלַ/י֙ לְ/עָזְרֵ֔/נִי יִֽהְיֶה לִּ֧/י עֲלֵי/כֶ֛ם לֵבָ֖ב לְ/יָ֑חַד וְ/אִֽם לְ/רַמּוֹתַ֣/נִי לְ/צָרַ֗/י בְּ/לֹ֤א חָמָס֙ בְּ/כַפַּ֔/י יֵ֛רֶא אֱלֹהֵ֥י אֲבוֹתֵ֖י/נוּ וְ/יוֹכַֽח־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/018.yaml
  text: David went out before them and answered and said to them[a], “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies, though there is no violence in my hands[b], may the God of our fathers see and judge.”
translation:
  language: zh_hans
  text: 大卫出去，到他们面前，回应他们说：“如果你们是平安而来，要帮助我，我的心就必与你们同心；但如果你们是要把我出卖给我的敌人，尽管我手中并无暴行[a]，愿我们祖先的上帝察看并审断[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴行”也可译作“不义”或“强暴”。这里“手中”表示人所实施并应负责的行为。
    reason: lexical_alternative
  - marker: b
    text: “审断”也可译作“责备”或“判明是非”。希伯来语动词可表示责斥、仲裁或作出裁决。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא ... לִפְנֵיהֶם
  choice: 出去，来到他们面前
  rationale: 保留“出去”和“在他们面前”的空间动作，不把后者完全解释为“迎接他们”，同时使现代汉语自然。
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: 回应他们说
  rationale: 保留两个叙事动词的痕迹；“回应……说”比逐字译作“回答并说”更符合现代汉语。
- source_word: לְשָׁלוֹם
  choice: 为和平而来
  rationale: 表达其和平、真诚的来意，同时贴近介词短语的形式。
- source_word: יִהְיֶה לִּי עֲלֵיכֶם לֵבָב לְיָחַד
  choice: 我的心就必与你们同心
  rationale: 希伯来语表达较为特殊，意指心志联合、彼此一致；“同心”自然简洁，又不额外加入盟约等解释。
- source_word: לְרַמּוֹתַנִי לְצָרַי
  choice: 把我出卖给我的敌人
  rationale: רמה可指欺骗或背信；与“给我的敌人”连用时，“出卖”准确传达把大卫交给敌方的背叛含义。
- source_word: בְּלֹא חָמָס בְּכַפַּי
  choice: 而我手中并无暴行
  rationale: 保留“手中”的责任隐喻及חמס的暴力、不义含义；“而”体现语境中的让步或对照，但不将逻辑关系说得过死。
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: 我们祖先的上帝
  rationale: 现代汉语中“祖先”自然地涵盖历代先辈，也保留共同群体身份；不必拘泥于可能误解为仅指直系父亲的“父辈”。
- source_word: יֵרֶא ... וְיוֹכַח
  choice: 愿……察看并审断
  rationale: 在条件性指控之后，两个未完成式自然构成向上帝发出的庄严申诉；“审断”保留יכח可指裁断、判明是非的法庭性意味。
theological_decisions:
- issue: 结尾对上帝行动的语气
  choice: 愿我们祖先的上帝察看并审断
  alternative: 我们祖先的上帝必察看并审断
  rationale: 此处更自然地表达祈愿和诉诸神圣裁决，而非直接预言，因此用“愿”保留语气上的张力。
- issue: 上帝所作裁决的性质
  choice: 审断
  alternative: 责备；判明
  rationale: יכח语义可涵盖责备、裁断和判明。上下文关乎大卫是否无辜以及来者是否背叛，采用较宽的“审断”，不预先指定上帝责备哪一方。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“同心”“手中并无暴行”“愿……察看并审断”保留经文的凝练与法庭性申诉色彩；所有脚注标记均已置于正文对应位置。
