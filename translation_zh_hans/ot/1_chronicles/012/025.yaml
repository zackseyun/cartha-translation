  text: From the sons of Judah[a], carrying shield and spear, there were 6,800 equipped for battle.
translation:
  language: zh_hans
  text: 犹大支派中，带着盾牌和长矛、装备好准备作战的，有六千八百人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“武装起来预备作战的。”希伯来语 חֲלוּצֵי צָבָא 指已经装备好或预备投入战斗的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: 犹大支派中
  rationale: 该短语字面为“犹大的众子”，在这里指犹大支派的成员。按本段逐支派列举兵员的语境译为“犹大支派中”，既自然，也保留其支派含义。
- source_word: נֹשְׂאֵי
  choice: 手持
  rationale: 此处该分词描述携带军用装备的人。“手持”与后面的盾牌、长矛搭配自然，表达其携带兵器的状态。
- source_word: צִנָּה
  choice: 盾牌
  rationale: צִנָּה指盾牌，有时特指较大的盾牌；本节无需把可能的尺寸差异写入正文，译作普通读者熟悉的“盾牌”即可。
- source_word: וָרֹמַח
  choice: 和长矛
  rationale: רֹמַח指矛或长枪。“长矛”是现代汉语中清楚、常用的对应词，并与“盾牌”构成自然的军械组合。
- source_word: שֵׁשֶׁת אֲלָפִים וּשְׁמוֹנֶה מֵאוֹת
  choice: 六千八百人
  rationale: 原文数字明确；中文正文用汉字数字符合庄重、连贯的经文文体，并补出量词“人”以使表达完整自然。
- source_word: חֲלוּצֵי צָבָא
  choice: 装备齐全可以作战的
  rationale: 该军事用语指已经配备武装、预备投入战斗的人。“装备齐全可以作战的”兼顾装备与备战状态，又能与前文所列盾牌和长矛自然衔接。
