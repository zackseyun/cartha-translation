  language: zh_hans
  text: 还有基遍人以实买雅；他是三十勇士中的勇士[a]，并在三十勇士之上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “三十勇士中的勇士”也可译作“属于三十勇士的一名勇士”或“在三十勇士中的勇士”；这里的“三十勇士”指称一个精锐群体。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在三十勇士之上”。这可能表示他对该群体有领导权，或地位高于他们；原文未明确说明具体职分。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/יִֽשְׁמַֽעְיָ֧ה
  choice: 还有……以实买雅
  rationale: 前缀连词 וְ 延续名单，汉语用“还有”自然承接；专名采用现代中文圣经中较常见的译名“以实买雅”。
- source_word: הַ/גִּבְעוֹנִ֛י
  choice: 基遍人
  rationale: 带冠词的族称说明其籍贯或群体归属；“基遍人”简洁保留名词性表达。
- source_word: גִּבּ֥וֹר
  choice: 勇士
  rationale: גִּבּוֹר 在这份军事人员名单中指英勇善战之人；“勇士”自然、庄重，也与后文精锐群体的语境相称。
- source_word: בַּ/שְּׁלֹשִׁ֖ים
  choice: 三十勇士中的
  rationale: 介词 בְּ 最自然地表达他属于名为“三十勇士”的精锐群体；同时以脚注保留“在三十勇士中出众”的可能理解。
- source_word: וְ/עַל הַ/שְּׁלֹשִֽׁים
  choice: 并且统领三十勇士
  rationale: עַל 在此可表达对该群体的权柄或较高地位；“统领”比逐字的“在……之上”更符合现代汉语，同时脚注说明原文措辞及其含义。
