  yaml_path: translation/ot/1_chronicles/012/017.yaml
  text: And some of the sons of Benjamin and Judah came to the stronghold[b][a], to David.
translation:
  language: zh_hans
  text: 有些便雅悯人和犹大人来到大卫所在的堡垒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒”或译“坚固据点”。原文指设防的避难或防御之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: 这是叙事中的连续动作，表示这些人朝大卫所在之处移动；“来到”自然地体现这一方向。
- source_word: מִן
  choice: 有些
  rationale: 此处介词带有部分义，表示来的是便雅悯和犹大支派中的一部分人，并非全体。
- source_word: בְּנֵי בִנְיָמִן וִיהוּדָה
  choice: 便雅悯人和犹大人
  rationale: 希伯来文直译近于“便雅悯的子孙和犹大”，后半为省略表达；现代汉语用两个支派名称指其成员，清楚而自然。
- source_word: עַד לַמְצָד
  choice: 来到山寨
  rationale: עַד在移动语境中标明终点；מְצָד指可供防守和避难的坚固据点。“山寨”符合大卫叙事的环境，也保留其作为防御据点的含义。
- source_word: לְדָוִיד
  choice: 到大卫那里
  rationale: 介词לְ表示这些人来到大卫那里。采用独立短语，避免擅自把关系具体化为“投奔”或“归顺”。
theological_decisions:
- issue: 来见大卫是否表示归顺或投奔
  choice: 仅译为“到大卫那里”
  alternative: “投奔大卫”
  rationale: 上下文或可暗示归附，但本节希伯来文本身只明确表达朝大卫而来；译文不提前落实其动机或效忠关系。
translation_notes:
  register: 采用简洁庄重的现代汉语。“有些”明示原文的部分义；末尾保留“到大卫那里”，虽略带希伯来语式的重复，却避免把לְדָוִיד过度解释为投奔、归顺或特指大卫拥有该山寨。
