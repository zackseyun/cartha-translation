  text: And from Asher[a], forty thousand who went out for military service, to array themselves for battle.
translation:
  language: zh_hans
  text: 亚设支派中，出征服役、列阵作战的有四万人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚设支派中，出征参加军役、为争战列阵的有四万人。”希伯来文将“出征服役”和“为争战列阵”两个军事表达连在一起。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/אָשֵׁר
  choice: 亚设支派中
  rationale: 介词表示“从亚设而来”；本节处于按支派列举兵员的语境，补出“支派”可使现代汉语自然清楚。句首连接词在中文连续清单中无须机械译为“并且”。
- source_word: יוֹצְאֵי צָבָא
  choice: 能出征
  rationale: 该组合指参加军队行动或服兵役的人。结合人数统计和下文作战语境，译作“能出征”简洁自然，也表达其具备军事服役能力；其较直译的结构见脚注。
- source_word: לַ/עֲרֹךְ מִלְחָמָה
  choice: 列阵作战
  rationale: ערך在军事语境中指排列、布置战阵；与מִלְחָמָה连用，译作“列阵作战”既保留战斗队形的含义，也符合现代汉语表达。
- source_word: אַרְבָּעִים אָלֶף
  choice: 四万人
  rationale: 直接表达原文基数“四万”，并按汉语习惯补出人数单位“人”。
