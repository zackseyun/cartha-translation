base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/031.yaml
  text: And from the sons of Ephraim[a], twenty thousand eight hundred mighty men of valor, men of renown according to their fathers’ houses.
translation:
  language: zh_hans
  text: 以法莲的子孙中，有二万零八百名英勇的战士，都是按各自的父家有名望的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“有名字的人”，指知名或杰出的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: ……中，有
  rationale: 承接上下文按支派列举的结构；中文以“……中，有”自然表达希伯来语连词与介词的组合。
- source_word: בְּנֵי אֶפְרַיִם
  choice: 以法莲的子孙
  rationale: 保留“儿子、子孙”的宗族含义，同时明确这里指以法莲支派的后裔或成员。
- source_word: עֶשְׂרִים אֶלֶף וּשְׁמוֹנֶה מֵאוֹת
  choice: 二万零八百名
  rationale: 准确保留人数，并按现代汉语习惯加量词“名”。
- source_word: גִּבּוֹרֵי חַיִל
  choice: 英勇的战士
  rationale: 该固定表达兼有勇力、英勇和军事能力之意；“英勇的战士”在征召军兵的语境中自然清楚。
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: 有名望的人
  rationale: 字面为“有名字的人”，是指知名、杰出或受尊重的人；正文采用自然的汉语习语，并以脚注保留字面表达及其可能范围。
- source_word: לְבֵית אֲבוֹתָם
  choice: 在各自父家中
  rationale: “父家”是以父系为基础的宗族单位；此处表达这些人在其所属父家中有名望。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“父家”保留古代以父系宗族为单位的社会结构；“英勇的战士”避免过度古雅，同时体现军事语境。
