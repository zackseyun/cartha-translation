  text: וְ/גַ֣ם הַ/קְּרֽוֹבִים אֲ֠לֵי/הֶם עַד יִשָׂשכָ֨ר וּ/זְבֻל֜וּן וְ/נַפְתָּלִ֗י מְבִיאִ֣ים לֶ֡חֶם בַּ/חֲמוֹרִ֣ים וּ/בַ/גְּמַלִּ֣ים וּ/בַ/פְּרָדִ֣ים וּֽ/בַ/בָּקָ֡ר מַאֲכָ֡ל קֶ֠מַח דְּבֵלִ֨ים וְ/צִמּוּקִ֧ים וְ/יַֽיִן וְ/שֶׁ֛מֶן וּ/בָקָ֥ר וְ/צֹ֖אן לָ/רֹ֑ב כִּ֥י שִׂמְחָ֖ה בְּ/יִשְׂרָאֵֽל־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/041.yaml
  text: 'Also those near them[a], as far as Issachar and Zebulun and Naphtali, were bringing food on donkeys, camels, mules, and cattle: provisions of flour, fig cakes, raisin cakes, wine, oil, cattle, and sheep in abundance[c][b], for there was joy in Israel.'
translation:
  language: zh_hans
  text: 住在他们附近的人，远至以萨迦、西布伦和拿弗他利[b]，也用驴、骆驼、骡子和牛运来食物[a]：面粉、无花果饼、葡萄干[c]、酒、油，以及大量的牛羊；因为以色列中有喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”原文基本义为“饼”或“面包”；但这里引出多种供应品的清单，故正文按语境译为“食物”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“甚至包括以萨迦、西布伦和拿弗他利。”原文这个短语表示前来运送物资之人的地域范围。
    reason: alternative_reading
  - marker: c
    text: “葡萄干”也可理解为压制成块的葡萄干制品，即“葡萄干饼”；原文没有明确说明其形状。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 承接上文并保留附加、强调的语气；放在谓语前符合现代汉语表达。
- source_word: הַקְּרוֹבִים אֲלֵיהֶם
  choice: 住在他们附近的人
  rationale: 原文直译为“靠近他们的人”；补出“住在”使中文自然，同时不把他们限定为某种正式的邻舍关系。
- source_word: עַד יִשָׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  choice: 远至以萨迦、西布伦和拿弗他利
  rationale: עַד表示范围所达到的界限；“远至”清楚传达地理延伸。
- source_word: מְבִיאִים
  choice: 不断……驮来
  rationale: 分词在叙事中可表达持续或反复进行的行动；“不断”使这一体貌在汉语中明确而自然。
- source_word: לֶחֶם
  choice: 食物
  rationale: 本义为“饼、食物”，但下文列出面粉、果品、酒、油和牲畜等多种供应品，因此此处采用概括性的“食物”。
- source_word: בַּחֲמוֹרִים וּבַגְּמַלִּים וּבַפְּרָדִים וּבַבָּקָר
  choice: 用驴、骆驼、骡子和牛驮来
  rationale: 介词בּ表示运输的工具或方式；原文说的是牲畜，并未提到车辆。“驮来”符合供应物资的语境。
- source_word: מַאֲכָל
  choice: 包括
  rationale: 该词意为“食物”，在句中引出食物的具体内容；中文用“包括”避免紧邻重复“食物”，并清楚呈现列举关系。
- source_word: קֶמַח
  choice: 面粉
  rationale: 这是该词在食物清单中的常用义。
- source_word: דְּבֵלִים
  choice: 无花果饼
  rationale: 指压制成块、便于储运的无花果制品；“无花果饼”简洁准确。
- source_word: צִמּוּקִים
  choice: 葡萄干
  rationale: 该词通常指晒干的葡萄；原文没有明确说明压制成饼，因此正文保留较少推断的译法。
- source_word: יַיִן וְשֶׁמֶן
  choice: 酒、油
  rationale: 按原文采用宽泛词义；不擅自把“油”具体限定为橄榄油。
- source_word: וּבָקָר וְצֹאן לָרֹב
  choice: 以及大量的牛羊
  rationale: לָרֹב表示数量丰富；“大量的牛羊”自然传达原文。
- source_word: כִּי שִׂמְחָה בְּיִשְׂרָאֵל
  choice: 因为以色列中充满了喜乐
  rationale: 原文是名词句，直陈喜乐存在于以色列中；“充满了喜乐”在现代汉语中庄重自然。
