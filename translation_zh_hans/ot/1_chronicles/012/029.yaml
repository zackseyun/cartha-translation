base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/029.yaml
  text: And Zadok[a], a young man mighty in valor[b], and from his father’s house twenty-two commanders.
translation:
  language: zh_hans
  text: 还有撒督，一个年轻、英勇的战士；他父家有二十二位统领。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדוֹק
  choice: 撒督
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: נַעַר
  choice: 青年
  rationale: 在军事名录的语境中，主要指年轻男子；“青年”保留年龄含义，又不擅自解释为仆人或特定军职。
- source_word: גִּבּוֹר חָיִל
  choice: 英勇善战
  rationale: 该固定搭配在军事语境中表示勇力、才干和作战英勇；此译自然凝练，同时保留其尚武色彩。
- source_word: בֵית אָבִיו
  choice: 他父家
  rationale: 保留希伯来语父系家族单位的表达；其所指不限于核心家庭，也可涵盖宗族或父系家族。
- source_word: שָׂרִים
  choice: 统领
  rationale: 本段为军事人员名录，所指是居领导或指挥地位的人；“统领”比“王子”准确，也比泛称“领袖”更贴合语境。
- source_word: עֶשְׂרִים וּשְׁנָיִם
  choice: 二十二位
  rationale: 按现代汉语习惯直译基数，并以“位”搭配人员。
- source_word: וְ
  choice: 还有
  rationale: 该连接词承接前文名录；“还有”自然呈现列表中继续增列人员的功能。
theological_decisions: []
