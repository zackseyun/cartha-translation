  text: וְ֠/אֵלֶּה מִסְפְּרֵ֞י רָאשֵׁ֤י הֶֽ/חָלוּץ֙ לַ/צָּבָ֔א בָּ֥אוּ עַל דָּוִ֖יד חֶבְר֑וֹנָ/ה לְ/הָסֵ֞ב מַלְכ֥וּת שָׁא֛וּל אֵלָ֖י/ו כְּ/פִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/024.yaml
  text: And these are the numbers of the heads of the armed troops for war[a], who came to David at Hebron to turn Saul’s kingdom over to him, according to the word of Yahweh.
translation:
  language: zh_hans
  text: 以下是为作战而整装备的队伍首领的数目。他们来到希伯仑投奔大卫，要把扫罗的王权转给他，正如雅威所说的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“照雅威的口”，是“照雅威的话”或“正如雅威所说的”这一惯用表达。
    reason: 保留希伯来语惯用语的字面形象及其自然含义。
lexical_decisions:
- source_word: מִסְפְּרֵי רָאשֵׁי
  choice: 各首领人数
  rationale: מִסְפְּרֵי为复数构造形式，引出随后按群体列出的数目；רָאשֵׁי直译为“头”，在此指军事群体中的首领。“各首领人数”既保留构造关系，也符合现代汉语。
- source_word: הֶחָלוּץ לַצָּבָא
  choice: 武装起来服军役的
  rationale: הֶחָלוּץ指已经装备、预备出战的人；לַצָּבָא说明其军事用途或服役性质。译文兼顾“武装”和“服军役”两层含义。
- source_word: בָּאוּ עַל דָּוִיד
  choice: 归向大卫
  rationale: 本处עַל与בוא连用，按上下文表示来到大卫那里并加入、支持他，而非攻击他。“归向”比单纯“来到”更能表达效忠的语境，又不把动作过度解释为正式投诚。
- source_word: חֶבְרוֹנָה
  choice: 来到希伯仑
  rationale: 词尾方向词素־ָה表示朝向希伯仑；汉语将地点与“来到”连用，自然而准确地表达这一方向。
- source_word: לְהָסֵב
  choice: 转给
  rationale: סבב的使役式在此表示使某物转移、归到另一人手中。“转给”简明地表达王权由扫罗转归大卫。
- source_word: מַלְכוּת שָׁאוּל
  choice: 扫罗的王权
  rationale: מַלְכוּת既可指王国，也可指君王的统治权；本句强调统治权转归大卫，因此“王权”最切合上下文，同时避免把领土实体化。
- source_word: כְּפִי יְהוָה
  choice: 正如雅威所说的
  rationale: 该短语字面为“照雅威的口”，是指雅威所说之话的惯用表达。正文采用自然汉语，脚注保留其字面形象；神名יְהוָה音译为“雅威”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”以保留专名性质，不以称号“主”替代。
- issue: מַלְכוּת所指的是王国还是王权
  choice: 王权
  alternative: 王国
  rationale: 两种含义在词义范围内都成立；但此处所转移的是扫罗的统治地位，译作“王权”在汉语中更准确。译文不进一步界定这种转移的政治或神学机制。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“武装起来服军役”保留军事用语的具体性；“归向大卫”表达来到并支持大卫的语境；句式分为两句，以免首句多层修饰造成阅读困难。
