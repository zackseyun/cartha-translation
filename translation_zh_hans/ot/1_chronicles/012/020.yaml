id: 1CH.12.20
reference: 1 Chronicles 12:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מִֽ/מְּנַשֶּׁ֞ה נָפְל֣וּ עַל דָּוִ֗יד בְּ/בֹא֨/וֹ עִם פְּלִשְׁתִּ֧ים עַל שָׁא֛וּל לַ/מִּלְחָמָ֖ה וְ/לֹ֣א עֲזָרֻ֑/ם כִּ֣י בְ/עֵצָ֗ה שִׁלְּחֻ֜/הוּ סַרְנֵ֤י פְלִשְׁתִּים֙ לֵ/אמֹ֔ר בְּ/רָאשֵׁ֕י/נוּ יִפּ֖וֹל אֶל אֲדֹנָ֥י/ו שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/020.yaml
  text: Some from Manasseh also defected to David when he came with the Philistines against Saul for battle[a], though they did not help them, because the lords of the Philistines, after taking counsel, sent him away, saying[b], “He may defect to his master Saul at the cost of our heads.”
translation:
  language: zh_hans
  text: 还有一些玛拿西人投奔了大卫[a]。那时，大卫正与非利士人一同前去攻打扫罗；但他们并没有帮助非利士人，因为非利士人的首领商议后把大卫遣走，说：“他恐怕会以我们的人头为代价[b]，投奔他的主人扫罗。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“倒向大卫”或“落到大卫一边”；这是指转到某人阵营、归附某人的希伯来语惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“以我们的人头”，意思是以他们的性命为代价，或使他们自己遭受毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמְּנַשֶּׁה
  choice: 还有一些玛拿西人
  rationale: 前缀连接词和介词表达追加及来源；结合下节列出的具体人物，用“一些”自然呈现原文隐含的部分关系。
- source_word: נָפְלוּ עַל דָּוִיד
  choice: 投奔了大卫
  rationale: נפל על在这里是军事、政治语境中的惯用语，指转到某人一方，并非实际跌倒；“投奔”既自然，也保留阵营转换的意味。
- source_word: בְּבֹאוֹ עִם פְּלִשְׁתִּים עַל שָׁאוּל לַמִּלְחָמָה
  choice: 那时，大卫正与非利士人一同前去攻打扫罗
  rationale: ב加不定词表示时间背景；עִם表示同行，עַל表示敌对方向，לַמִּלְחָמָה表示作战目的。中文以“那时……正……”清楚呈现时间关系。
- source_word: וְלֹא עֲזָרֻם
  choice: 但他们并没有帮助非利士人
  rationale: 宾语后缀最自然地指近处的复数先行词“非利士人”。主语仍用“他们”，不强行判定究竟专指玛拿西人还是较广义的大卫一行人，以保留原文的指代张力。
- source_word: כִּי בְעֵצָה
  choice: 因为……商议后
  rationale: בְעֵצָה表示经过谋议或磋商；“商议后”以自然中文表达其情境作用。
- source_word: שִׁלְּחֻהוּ
  choice: 把大卫遣走
  rationale: שלח的加强词干在此表示打发、遣离；补出“大卫”可避免中文代词含混，同时不增加原文之外的信息。
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: 非利士人的首领
  rationale: סֶרֶן是非利士统治者的特定称号；“首领”既保留其统治身份，又避免把职能过度限定为军事将领。
- source_word: בְרָאשֵׁינוּ
  choice: 以我们的人头为代价
  rationale: 保留希伯来文“人头”的鲜明意象，同时用“为代价”传达危及性命、招致毁灭的惯用含义。
- source_word: יִפּוֹל אֶל אֲדֹנָיו שָׁאוּל
  choice: 他恐怕会……投奔他的主人扫罗
  rationale: נפל אל在此同样指转投另一方；未完成式在担忧性的引语中可表达可能或恐怕发生之事。“主人”体现政治与臣属关系，避免不必要的神学色彩。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“投奔”“遣走”“首领”适合历史军事场景。经文保留“他们”这一主语的潜在指代范围，同时为中文清晰度明确其宾语是非利士人；脚注说明两个关键希伯来语惯用表达。
