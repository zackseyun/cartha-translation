  text: 西缅的子孙中，有能征善战、从军的勇士七千一百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן בְּנֵי שִׁמְעוֹן
  choice: 西缅的子孙中
  rationale: מִן 表示从某一群体中而出；“西缅的子孙中”既保留希伯来语的亲属表达，也自然地表明这支队伍所属的支派。
- source_word: גִּבּוֹרֵי חַיִל
  choice: 能征善战的勇士
  rationale: 该固定搭配在军事语境中指有能力、勇猛善战的人；此译兼顾作战能力与勇武含义，且符合现代汉语表达。
- source_word: לַצָּבָא
  choice: 能征善战
  rationale: לַצָּבָא 指向军队或军事服役的用途。汉语将其与前面的勇士称谓整合为“能征善战的勇士”，自然传达这些人适合从军作战的功能，而不把它误解为另一支独立的“军队”。
- source_word: שִׁבְעַת אֲלָפִים וּמֵאָה
  choice: 七千一百人
  rationale: 准确表达原文人数，并补出汉语计数所需的量词“人”。
