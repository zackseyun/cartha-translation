  text: 还有耶罗罕的儿子约伊拉和西巴第雅，来自基多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יוֹעֵאלָה
  choice: 还有……约以拉
  rationale: 前缀 וְ 承接上文名单，译为“还有”；人名 יוֹעֵאלָה 按希伯来语音译为“约以拉”。
- source_word: וּ/זְבַדְיָה
  choice: 和西巴第雅
  rationale: 前缀 וּ 连接名单中的另一人，译为“和”；זְבַדְיָה 采用现代中文圣经人名中易于辨识的音译“西巴第雅”。
- source_word: בְּנֵי יְרֹחָם
  choice: 耶罗罕的儿子
  rationale: בְּנֵי 是 בֵּן 的复数构造形式，此处最自然地指二人都是耶罗罕的儿子；未扩大解释为泛指“后裔”。
- source_word: מִן הַ/גְּדוֹר
  choice: 来自基多
  rationale: מִן 表示来源；הַגְּדוֹר 在此按地名处理，译作“基多”。将短语置于句末，也保留它可能关联二人或其家族来源的句法宽度。
