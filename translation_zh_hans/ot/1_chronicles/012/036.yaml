  text: From Dan[a], twenty-eight thousand six hundred prepared for battle.
translation:
  language: zh_hans
  text: 但支派中，有二万八千六百人整装备战[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“摆开战阵”或“列阵准备作战”。希伯来语分词短语指为战事整队、列阵或作好战斗准备。
    reason: 原文军事分词短语可强调战斗准备，也可强调布置战阵；脚注保留这两方面的语义幅度。
lexical_decisions:
- source_word: וּמִן
  choice: ……中
  rationale: 前缀连词与介词合起来直译为“并从……”。本节属于按支派列举人数的名单，译作“……中”更符合现代汉语表达，同时保留来源或归属关系；句首的“并”可由上下文自然承接，无须机械译出。
- source_word: הַדָּנִי
  choice: 但支派
  rationale: 这里带定冠词的族名指但支派的人，而非某一个“但人”。译作“但支派”清楚、自然，也符合名单语境。
- source_word: עֹרְכֵי מִלְחָמָה
  choice: 能列阵作战
  rationale: 该分词短语源自动词“排列、整队”，在军事语境中可指摆开战阵或作好战斗准备。“能列阵作战”既保留战阵含义，也以现代汉语表达这些人的军事能力与战备状态。
- source_word: עֶשְׂרִים וּשְׁמוֹנָה אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 二万八千六百人
  rationale: 按希伯来语基数词直接译出；补出量词“人”，使中文人数表达完整自然。
