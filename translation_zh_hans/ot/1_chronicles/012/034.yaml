  text: מִ/זְּבֻל֞וּן יוֹצְאֵ֣י צָבָ֗א עֹרְכֵ֧י מִלְחָמָ֛ה בְּ/כָל כְּלֵ֥י מִלְחָמָ֖ה חֲמִשִּׁ֣ים אָ֑לֶף וְ/לַ/עֲדֹ֖ר בְּ/לֹא לֵ֥ב וָ/לֵֽב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/034.yaml
  text: From Zebulun[a], fifty thousand men fit for military service, prepared for battle with every kind of weapon of war[b], to help without a divided heart.
translation:
  language: zh_hans
  text: 西布伦支派中，能出征、用各样兵器列阵作战的有五万人；他们同来相助[a]，毫无二心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“同来列队”或“同来支援”。这里的希伯来动词较少见，确切含义不完全确定。
    reason: alternative_reading
  - marker: b
    text: 直译“没有一颗心和另一颗心”，意思是忠心一致，不三心二意。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְּבֻלוּן
  choice: 西布伦支派中
  rationale: 前缀 מִן 表示来源；按本段统计各支派兵员的语境，译为“西布伦支派中”比单纯“从西布伦”更自然。
- source_word: יוֹצְאֵי צָבָא
  choice: 能出征
  rationale: 这是指具备从军出战资格或能力的人；“能出征”简洁传达该军事习语。
- source_word: עֹרְכֵי מִלְחָמָה
  choice: 列阵作战
  rationale: ערך 在军事语境中指排列、部署战阵；此译保留列阵含义，也符合现代汉语表达。
- source_word: בְּכָל כְּלֵי מִלְחָמָה
  choice: 用各样兵器
  rationale: כְּלֵי מִלְחָמָה 可泛指作战器具或兵器；“各样兵器”准确而通顺。
- source_word: חֲמִשִּׁים אָלֶף
  choice: 五万人
  rationale: 按上下文补出量词“人”，清楚表达兵员数目。
- source_word: וְלַעֲדֹר
  choice: 同来相助
  rationale: 此处 עדר 的用法罕见，可能指相助、聚集加入或列队协同；正文采用语境上稳妥的“同来相助”，脚注保留其他可能。
- source_word: בְּלֹא לֵב וָלֵב
  choice: 毫无二心
  rationale: 直译为“没有一颗心和另一颗心”，是指忠诚不分裂、不三心二意；“毫无二心”保留“心”的意象并符合现代汉语。
theological_decisions:
- issue: 是否明说相助的对象是大卫
  choice: 不在正文补出“大卫”
  alternative: 前来支援大卫
  rationale: 上下文表明他们归向大卫，但本节希伯来文没有明说宾语；不补出名字可避免把语境推断写成明文。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“能出征”“列阵作战”保留军事语域；“毫无二心”自然表达希伯来习语，同时借脚注交代其字面形式。
