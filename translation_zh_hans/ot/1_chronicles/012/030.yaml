base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/030.yaml
  text: And from the sons of Benjamin[a], Saul’s brothers, three thousand[b]; until then most of them had been keeping watch over the house of Saul.
translation:
  language: zh_hans
  text: 便雅悯子孙中，扫罗的弟兄[a]有三千人；直到那时，其中大多数仍在守护扫罗家[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里也可泛指扫罗的亲族或同族人，并不一定只指亲兄弟。
    reason: lexical_alternative
  - marker: b
    text: “扫罗家”可指扫罗的家室或家族，也可广指扫罗王室及其利益。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי בִנְיָמִן
  choice: 便雅悯的子孙
  rationale: 保留希伯来文支派谱系式表达，并承接上文逐项列举人数的结构；中文无需硬译句首连接词“又从”，即可自然延续名单。
- source_word: אֲחֵי שָׁאוּל
  choice: 扫罗的弟兄
  rationale: 直译“弟兄”，保留其既可指亲兄弟、也可泛指亲族或同族人的语义范围，并以脚注说明。
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: 三千人
  rationale: 按现代汉语列举人数的习惯补出量词“人”。
- source_word: וְעַד הֵנָּה
  choice: 直到那时
  rationale: 这里指叙事所述的历史时点，而非读者当前的“现在”。
- source_word: מַרְבִּיתָם
  choice: 他们大多数
  rationale: 准确表达“其中较大的部分、绝大多数”，用语自然清楚。
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: 仍在守护
  rationale: 该同根词组表示持续履行看守、护卫的职责；“仍在”结合时间短语，传达此前一直持续的状态，同时避免中文重复译作“看守看守之职”。
- source_word: בֵּית שָׁאוּל
  choice: 扫罗家
  rationale: “家”保留希伯来文 בַּיִת 的宽泛含义，可指扫罗的家室、家族，或其王室与王朝利益；不在正文中窄化为“王朝”。
theological_decisions:
- issue: 便雅悯人与扫罗关系的范围
  choice: 正文保留“扫罗的弟兄”，脚注指出其可泛指亲族或同族人
  alternative: 直接译作“扫罗的亲族”或“扫罗的同族人”
  rationale: 原文的亲属称谓具有伸缩性；直译并加注可避免武断认定这些人都是扫罗的亲兄弟，也不抹去原文“弟兄”的表达。
- issue: “扫罗家”的所指
  choice: 保留宽泛的“扫罗家”
  alternative: 明确译作“扫罗王室”“扫罗王朝”或“扫罗家眷”
  rationale: 上下文可能涉及对扫罗家室、家族或王室事业的守护与效忠；原文没有明确限定，故不替作者消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“便雅悯的子孙”保留名单中的谱系色彩；“仍在守护”表达持续状态，但不进一步解释为政治上的“效忠”，以保留原文含义的开放性。
