  text: כִּ֚י לְ/עֶת י֣וֹם בְּ/י֔וֹם יָבֹ֥אוּ עַל דָּוִ֖יד לְ/עָזְר֑/וֹ עַד לְ/מַחֲנֶ֥ה גָד֖וֹל כְּ/מַחֲנֵ֥ה אֱלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/023.yaml
  text: For day by day they came to David to help him[a], until there was a great camp, like the camp of God.
translation:
  language: zh_hans
  text: 因为他们天天来到大卫那里帮助他，直到有了一大营，如同神的营[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同神圣的营”或“如同天上的营”。希伯来语表达简洁而富有联想。
    reason: 保留 אֱלֹהִים 可作“神”、也可能带有“神圣的／天上的”含义之词义范围，以及原文比喻的开放性。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并引出解释性陈述；译作“因为”保留其因果或说明功能。
- source_word: לְעֶת יוֹם בְּיוֹם
  choice: 天天
  rationale: 该表达强调接连多日、反复发生；“天天”自然简洁，并保留持续递增的意味。
- source_word: יָבֹאוּ
  choice: 到……那里
  rationale: 未完成式在叙事语境中表示过去反复发生的行动；其反复性已由“天天”体现。
- source_word: עַל דָּוִיד
  choice: 到大卫那里
  rationale: 结合移动动词及随后的目的短语，应理解为朝向大卫，而非敌对地攻击大卫。
- source_word: לְעָזְרוֹ
  choice: 帮助他
  rationale: 带代词后缀的不定式表示来投奔大卫的目的，直译即可自然表达。
- source_word: עַד לְמַחֲנֶה גָדוֹל
  choice: 直到汇成一支大军
  rationale: עַד 表示不断有人前来所达到的结果；מַחֲנֶה 在军事语境中可指扎营的军队。“汇成”清楚呈现人数逐渐聚集而形成大军的过程。
- source_word: כְּמַחֲנֵה אֱלֹהִים
  choice: 如同神的军队
  rationale: 保留明喻及“神”的属格表达；“军队”符合本节军事语境，同时不把该短语仅仅解释为“极其庞大”。
theological_decisions:
- issue: כְּמַחֲנֵה אֱלֹהִים 中 אֱלֹהִים 的含义
  choice: 神
  alternative: 神圣的；天上的
  rationale: “神的军队”最直接保留希伯来语的紧凑表达及其神学联想，也不武断限定它究竟强调规模宏大、令人敬畏，还是天上的军旅。
translation_notes:
  register: 采用自然、庄重的现代汉语。“天天……直到汇成”呈现持续有人来投的动态；“大军／军队”适合上下文的军事场景，脚注则保留“营伍”等较贴近形式的可能译法。
