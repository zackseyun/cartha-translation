  yaml_path: translation/ot/1_chronicles/012/038.yaml
  text: And from beyond the Jordan[a], from the Reubenites, the Gadites, and the half-tribe of Manasseh, with every kind of military equipment for war, there were one hundred twenty thousand.
translation:
  language: zh_hans
  text: 从约旦河对岸[a]来的流便人、迦得人和玛拿西半支派的人，共有十二万，都带着各样作战用的军械。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从约旦河那边”。这个希伯来语表达可按不同的地理视角译为“从约旦河另一边”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לַיַּרְדֵּן
  choice: 从约旦河对岸来的
  rationale: מֵעֵבֶר表示隔着约旦河的另一边；“对岸”自然简洁，同时保留原文随地理视角而异的空间表达。
- source_word: מִן הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: 有吕便人、迦得人和玛拿西半支派的人
  rationale: 希伯来文族称虽为单数形式，却具有集合意义；中文用“吕便人、迦得人”自然地指这些族群。“玛拿西半支派”准确对应原文。
- source_word: בְּכֹל כְּלֵי צְבָא מִלְחָמָה
  choice: 带着各样作战的军械
  rationale: כְּלֵי泛指器具、装备，在军事语境中可包括兵器和其他军用装备；“军械”保留其范围，而“各样”体现בְּכֹל。
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: 十二万
  rationale: 按现代汉语习惯直接表达该基数，清楚简洁。
