  text: And from the half-tribe of Manasseh[a], eighteen thousand, who were designated by name, came to make David king.
translation:
  language: zh_hans
  text: 玛拿西半支派中有一万八千人，是按名指定的[a]；他们来拥立大卫为王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按名被点出的”，即逐一指定或明确列名的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: 从玛拿西半个支派中
  rationale: 保留介词“从”和“半个支派”的群体含义；מַטֶּה在支派及军事名单语境中指“支派”，而非字面的“杖”。
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: 一万八千人
  rationale: 准确表达基数，并补出量词“人”，使现代汉语自然清楚。
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: 都是按名指定的
  rationale: 保留נקב的被动含义及בְּשֵׁמוֹת“按名”的表达，不把它过度限定为某一种行政登记程序。
- source_word: לָבוֹא
  choice: 他们来
  rationale: 原文是不定式“来”，在名单语境中以有限动词表达，符合现代汉语叙述习惯，同时保持其与后续目的短语的关系。
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: 拥立大卫为王
  rationale: המליך是使役形式，意为使某人作王或立某人为王；“拥立……为王”兼顾群体行动和立王含义，又不局限于加冕仪式。
