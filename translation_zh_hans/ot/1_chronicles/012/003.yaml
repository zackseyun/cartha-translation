revisions:
- from: 为首的是亚希以谢，另有约阿施；二人都是基比亚人示玛的儿子。还有亚斯玛威的儿子耶薛[a]和毗力，以及比拉迦和亚拿突人耶户。
  to: 为首的是亚希以谢，另有约阿施；二人都是基比亚人哈施玛的儿子。还有亚斯玛威的儿子耶薛[a]和毗力，以及比拉迦和亚拿突人耶户。
  rationale: 仅修正哈施玛的人名译写，以对应原文的专名形式；保留原有名单分组、单数“为首的”所指、并列关系和脚注锚点。
