review_pass:
  verdict: revise
  source_fidelity: 原文将“为首的”单数地归于亚希以谢，约阿施与他同为哈施玛（基比亚人）的儿子；草稿在句法上正确保留了这一点，也正确分组了亚斯玛威的两个儿子，以及亚拿突人耶户。惟הַשְּׁמָעָה所指的人名不宜简化为“示玛”；这会与不同的希伯来人名混同。应译写为“哈施玛”。
  naturalness: 草稿的名册体自然清楚。“二人都是……”适当地消除了中文读者对两个“儿子”短语所辖人名的歧义。将籍贯前置为“基比亚人哈施玛”更顺畅明确。
  terminology: 亚希以谢、约阿施、亚斯玛威、耶薛、毗力、比拉迦、耶户、亚拿突均可接受。将Hashemaah统一为“哈施玛”可与其词形及常用中文圣经译写相符。脚注正确锚定在“耶薛”，并保留转写异体，不必保留英语审校记录中错误关联于亚希以谢的脚注。
  issues:
