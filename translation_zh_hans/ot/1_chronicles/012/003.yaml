    issue: “示玛”未充分反映הַשְּׁמָעָה（Hashemaah）的人名形式。
    rationale: 原文此处的专名带有起首的ha音节；译作“示玛”容易与Shemaah/Shema等不同专名混淆，削弱人名辨识和源文对应。
