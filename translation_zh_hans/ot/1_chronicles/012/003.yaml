base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/003.yaml
  text: The chief was Ahiezer[a], then Joash, the sons of Shemaah the Gibeathite; and Jeziel and Pelet, the sons of Azmaveth[b]; and Beracah and Jehu the Anathothite.
translation:
  language: zh_hans
  text: 为首的是亚希以谢，另有约阿施；二人都是基比亚人哈施玛的儿子。还有亚斯玛威的儿子耶薛[a]和毗力，以及比拉迦和亚拿突人耶户。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶薛”也可按另一种转写方式译作“伊薛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: 为首的是
  rationale: 在这份名册中，רֹאשׁ指居首或领头的人，并非字面意义的“头”；补出“是”使无动词句符合现代汉语表达。
- source_word: אֲחִיעֶזֶר
  choice: 亚希以谢
  rationale: 按希伯来语人名的常见中文译写处理。
- source_word: וְיוֹאָשׁ
  choice: 另有约阿施
  rationale: וְ本义为“和”；译作“另有”既保持并列关系，也避免把它强化为原文没有明说的时间次序。
- source_word: בְּנֵי הַשְּׁמָעָה הַגִּבְעָתִי
  choice: 二人都是基比亚人示玛的儿子
  rationale: 明确复数“儿子”同时指亚希以谢和约阿施；הַגִּבְעָתִי作为族属或籍贯称谓，译为“基比亚人”。
- source_word: ויזואל
  choice: 耶薛
  rationale: 采用该人名在中文圣经传统中通行且简洁的译写；其起首音的转写另见脚注。
- source_word: וָפֶלֶט
  choice: 和毗力
  rationale: 按希伯来语人名音译，不加入名字含义等解释。
- source_word: בְּנֵי עַזְמָוֶת
  choice: 亚斯玛威的儿子
  rationale: בְּנֵי为常见的家谱关系用语；此处复数表明耶薛和毗力二人都是亚斯玛威的儿子。
- source_word: וּבְרָכָה
  choice: 以及比拉迦
  rationale: 按希伯来语人名音译；英语转写中Beracah与Berakah的差别在中文“比拉迦”中无需另设脚注。
- source_word: וְיֵהוּא הָעֲנְּתֹתִי
  choice: 和亚拿突人耶户
  rationale: הָעֲנְּתֹתִי是源自亚拿突的籍贯称谓，用现代汉语自然表达为“亚拿突人”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的名册体表达。用分号和“二人”显明希伯来语中复数“儿子”的所指，同时保留各组人名的并列结构。未照搬英语咨询文本中“then”所暗示的次序，也纠正了其脚注标记与所注人名位置不一致的问题。
