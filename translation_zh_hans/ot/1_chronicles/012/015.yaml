base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/015.yaml
  text: These were from the sons of Gad[a], heads of the army; the least was for a hundred, and the greatest for a thousand.
translation:
  language: zh_hans
  text: 这些人都是迦得子孙中的军队首领；最小的能抵一百人，最大的能抵一千人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为：“小者一对百，大者一对千。”这是省略式说法，可能表示他们的战斗能力或军事效能。
    reason: 说明原文的省略结构，并保留该比例性表达在具体含义上的不确定性。
lexical_decisions:
- source_word: אֵלֶּה מִבְּנֵי גָד
  choice: 这些人都是迦得子孙中的
  rationale: 希伯来文是无系词句，直译为“这些（人）来自迦得的众子”。补出“人”和“都是”，使现代汉语自然，同时保留家族—支派式称谓“迦得子孙”。
- source_word: רָאשֵׁי הַצָּבָא
  choice: 军队首领
  rationale: רָאשֵׁי 字面为“头、首领”，此处指军事领袖；“军队首领”既贴近原文，也比生硬的“军队之头”自然。
- source_word: הַקָּטָן
  choice: 最小的
  rationale: 保留 קָטָן 与后文 גָּדוֹל 的大小对照，不擅自限定为体格、军阶或战力；上下文表明所说的是这些勇士中相对较弱或较低的一位。
- source_word: אֶחָד לְמֵאָה ... וְהַגָּדוֹל לְאָלֶף
  choice: 最小的能抵一百人，最大的能抵一千人
  rationale: 原文是省略式比例表达，字面近于“小者一对百，大者一对千”。“能抵”以简洁、自然的汉语传达军事效能，同时用脚注保留原文结构及解释上的余地。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的叙事语体。“迦得子孙”保留历代志的宗族表达；“最小的……最大的……”刻意维持原文对照，不将其过度解释为军阶、身材或特定等级。
