base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/021.yaml
  text: 'As he went to Ziklag[a], some from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai[c][b], chiefs of the thousands that belonged to Manasseh.'
translation:
  language: zh_hans
  text: 他往洗革拉去的时候，玛拿西支派中有人投奔他：亚得拿、约撒拔、耶叠、米迦勒、另一个约撒拔[b]、以利户和洗利太。他们都是玛拿西各千人队的首领。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “千人队”也可能指按宗族划分的编制；这些人可能是军事统领，也可能是宗族领袖。
    reason: lexical_alternative
  - marker: b
    text: 原文两次列出“约撒拔”，指两位同名的人。
    reason: cultural_note
lexical_decisions:
- source_word: בְּלֶכְתּוֹ אֶל צִיקְלַג
  choice: 他往洗革拉去的时候
  rationale: 介词 בְּ 加不定词附属形构成时间从句；译为“……的时候”自然地表达其时间关系。אֶל 在行程语境中表示朝向目的地。
- source_word: נָפְלוּ עָלָיו
  choice: 有人投奔他
  rationale: 这是军事和政治语境中的惯用语，指转而归附某一方。“投奔”既表达加入，也保留改变效忠对象的意味。
- source_word: מִמְּנַשֶּׁה
  choice: 玛拿西支派中
  rationale: 此处的“玛拿西”指支派来源；补出“支派”可使普通读者立即明白，同时不增加超出语境的信息。
- source_word: עַדְנַח וְיוֹזָבָד וִידִיעֲאֵל וּמִיכָאֵל וְיוֹזָבָד וֶאֱלִיהוּא וְצִלְּתָי
  choice: 押拿、约撒拔、耶叠、米迦勒、另一个约撒拔、以利户和洗勒太
  rationale: 按现代中文圣经人名惯例音译。原文两次列出约撒拔；用“另一个”说明是两位同名者，而不改动名单。
- source_word: רָאשֵׁי הָאֲלָפִים
  choice: 各千人队的首领
  rationale: רָאשֵׁי 表示首领；אֲלָפִים 可指千人军事单位，也可能兼有宗族编制含义。正文采用自然的军事表达，并以脚注保留制度层面的歧义。
- source_word: אֲשֶׁר לִמְנַשֶּׁה
  choice: 玛拿西各千人队的
  rationale: 关系从句表明这些首领所辖编制属于玛拿西；中文将归属关系前置，行文更自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。人名使用简体中文圣经中常见的译名形式；“投奔”传达政治军事上的归附。“千人队”保留原文制度称谓，并用脚注提示其也可能涉及宗族单位。所有脚注标记均置于正文相关位置。
