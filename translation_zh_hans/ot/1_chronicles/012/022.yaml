source:
  edition: WLC
  text: וְ/הֵ֗מָּה עָזְר֤וּ עִם דָּוִיד֙ עַֽל הַ/גְּד֔וּד כִּֽי גִבּ֥וֹרֵי חַ֖יִל כֻּלָּ֑/ם וַ/יִּהְי֥וּ שָׂרִ֖ים בַּ/צָּבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/022.yaml
  text: And they helped David against the raiding band[a], for all of them were mighty men of valor[c][b], and they became commanders in the army.
translation:
  language: zh_hans
  text: 他们帮助大卫抵挡那支袭击队[a]，因为他们个个都是英勇善战的勇士[b]，后来都成为军中的统领[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “袭击队”或译“队伍”或“军队”；希伯来语 גְּדוּד 可指军事队伍，也可特指进行袭击的武装队伍。
    reason: lexical_alternative
  - marker: b
    text: “英勇善战的勇士”或译“勇猛的战士”；希伯来语 גִבּוֹרֵי חַיִל 是常见称谓，指勇武而有作战能力的人。
    reason: lexical_alternative
  - marker: c
    text: “统领”或译“首领”或“指挥官”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: 他们
  rationale: 独立代词使主语带有强调意味；现代汉语用明确的“他们”自然承接上文，无须生硬加入“而这些人”。
- source_word: עָזְרוּ עִם דָּוִיד
  choice: 帮助大卫
  rationale: עזר 表示帮助、支援；עִם 通常表示“与……一起”，但这一搭配在此自然表达对大卫的支援，译作“帮助大卫”简洁清楚。
- source_word: עַל הַגְּדוּד
  choice: 抵挡那支袭击队
  rationale: עַל 在军事语境中表示敌对方向；גְּדוּד 可指武装队伍或袭击队。结合上下文，译作“抵挡那支袭击队”既传达敌对关系，也保留该词的军事性质。
- source_word: כִּי
  choice: 因为
  rationale: כִּי 在这里引出原因；“因为”清楚保留原文的解释关系。
- source_word: גִבּוֹרֵי חַיִל
  choice: 英勇善战的勇士
  rationale: 这是常见的军事称谓，指勇猛、有实力且能征战的人。“英勇善战的勇士”以自然现代汉语表达其勇武与作战能力。
- source_word: כֻּלָּם
  choice: 个个都
  rationale: 该形式强调全体成员无一例外；“个个都”在汉语中准确体现这种周遍强调。
- source_word: וַיִּהְיוּ
  choice: 后来都成为
  rationale: 该叙事动词表示进入一种新的身份或地位。“后来成为”体现事件推进和结果状态；“都”与前文全体范围相呼应。
- source_word: שָׂרִים
  choice: 统领
  rationale: שָׂרִים 可指首领、官长或军事指挥者；在军队语境中，“统领”是庄重且易懂的军事称谓。
- source_word: בַּצָּבָא
  choice: 军中
  rationale: צָבָא 在此指有组织的军队；“军中”是简练自然的现代汉语表达。
theological_decisions: []
