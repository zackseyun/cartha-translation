base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
translation:
  language: zh_hans
  text: 巴力哈南死了，哈达接替他作王。他的城名叫巴伊[a]；他的妻子名叫米希她别，是玛特列的女儿、米萨合的女儿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《创世记》36:39的城名作“巴乌”，《历代志上》这里则作“巴伊”。
    reason: textual_variant
  - marker: b
    text: 在家谱用语中，第二个“女儿”可能表示孙女或其他女性后代；但希伯来文原句仍重复使用“女儿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת בַּעַל חָנָן
  choice: 巴力·哈南死了
  rationale: 按希伯来文叙事次序直译；וַיָּמָת 表示“死了”，专名按音译处理。
- source_word: וַיִּמְלֹךְ תַּחְתָּיו הֲדַד
  choice: 哈达接替他作王
  rationale: מלך 在君王名录中指登基作王，תחתיו 表示接替前任；此译自然地保留王位承继关系。
- source_word: וְשֵׁם עִירוֹ פָּעִי
  choice: 他的城名叫巴伊
  rationale: 希伯来文为无动词的命名句，汉语以“名叫”自然表达；פָּעִי 依《历代志上》的读法音译为“巴伊”，不以平行经文的形式替换正文。
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: 他的妻子名叫米希他别
  rationale: 保留原文的命名格式，同时采用自然、清楚的现代汉语。
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: 是玛特列的女儿、米·萨合的女儿
  rationale: 原文两次使用 בַּת（“女儿”）；正文保留这一重复，不擅自将第二处解释为“外孙女”或“孙女”。
- source_word: מֵי זָהָב
  choice: 米·萨合
  rationale: 本处处于家谱式专名结构中，按人名音译，不按字面译作“金水”等。
