  register: 采用现代、庄重而易懂的简体中文。王位承继公式译为“接替他作王”；专名以音译为主，并用间隔号帮助辨识复合名称。正文保留原文两次“女儿”所产生的亲属关系张力，另以脚注说明可能的家谱用法。
