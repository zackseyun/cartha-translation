base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/011.yaml
  text: Mizraim fathered the Ludites[a], the Anamites, the Lehabites, and the Naphtuhites.
translation:
  language: zh_hans
  text: 麦西生了路低人[a]、亚拿米人、利哈比人和拿弗土希人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些族名也可更直接地音译为“路低、亚拿米、利哈比、拿弗土希”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: 麦西
  rationale: 此处位于家谱中，指作为祖先的人名，而不是地名“埃及”，因此采用中文圣经中较自然的人名音译。
- source_word: יָלַד
  choice: 生了
  rationale: 在家谱语境中表示生育或成为后代的祖先；“生了”简洁自然，并保留原文所表达的谱系关系。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，在中文中没有对应的独立词，其语法功能由句法体现。
- source_word: לודיים
  choice: 路低人
  rationale: 该复数形式表示族群；译为带“人”的族名，既符合现代中文习惯，也体现其后裔群体含义。
- source_word: עֲנָמִים
  choice: 亚拿米人
  rationale: 按族群名音译并加“人”，与同列名称保持一致，也便于普通读者理解。
- source_word: לְהָבִים
  choice: 利哈比人
  rationale: 按族群名音译并加“人”，自然呈现原文的复数族群名称。
- source_word: נַפְתֻּחִים
  choice: 拿弗土希人
  rationale: 按族群名音译并加“人”，与本节其他族名保持平行。
