base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/013.yaml
  text: And Canaan fathered Sidon his firstborn[b][a], and Heth.
translation:
  language: zh_hans
  text: 迦南生了长子西顿，又生了赫。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赫”是与赫人相关的祖先之名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְנַעַן
  choice: 迦南
  rationale: 按现代中文圣经人名惯例音译。句首连接词在连续家谱中不必机械译作“又”，中文仍能自然体现承接关系。
- source_word: יָלַד
  choice: 生了
  rationale: 在男性为主语的家谱语境中表示生育、成为父亲；“生了”简洁自然，并保留原文的亲生谱系表达。
- source_word: צִידוֹן
  choice: 西顿
  rationale: 采用现代中文通行的地名兼人名译法。此处是迦南之子的名字。
- source_word: בְּכֹרוֹ
  choice: 长子
  rationale: 准确表达“他的头生者”，并以现代中文家谱中自然的说法标明出生次序。
- source_word: חֵת
  choice: 赫
  rationale: 此处是单数专名，指家谱中的祖先，不直接意译为其后裔族群“赫人”。
theological_decisions:
- issue: “赫”是个人还是族群
  choice: 按个人名译作“赫”
  alternative: 译作“赫人”
  rationale: 原文为单数专名חֵת，并与“西顿”并列，语法和家谱语境均指一位祖先；译作族群会加入原文在本节没有明说的解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留家谱体裁的紧凑结构。将“长子”置于“西顿”之前，以符合中文语序，同时准确表达西顿是迦南的长子。
