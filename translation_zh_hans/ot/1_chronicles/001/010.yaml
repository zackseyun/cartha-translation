revisions:
- from: 古实生了宁录；他开始在那地成为强人[a]。
  to: 古实生宁录；他开始成为地上的强者[a]。
  rationale: 修订仅处理现代汉语词义和指代自然度：“强者”比“强人”更贴近原文的宽泛描述，避免现代政治含义；“地上”不预设一个本节未明示的特定地点。脚注保留“某一地域”的可行理解。其余句法和家谱体表达维持简明庄重。
