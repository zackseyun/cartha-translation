  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְר֑וֹד ה֣וּא הֵחֵ֔ל לִ/הְי֥וֹת גִּבּ֖וֹר בָּ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/010.yaml
  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
translation:
  language: zh_hans
  text: 古实生宁录；他开始成为地上的强者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他开始成为那地的强者。”希伯来语“地”既可指某一地域，也可指大地或全地。
    reason: 保留 בָּאָרֶץ 在地域范围上的词义歧义。
lexical_decisions:
- source_word: וְ/כ֖וּשׁ
  choice: 古实
  rationale: וְ承接家谱条目，汉语中无需机械译出“和”；כּוּשׁ采用通行的圣经人名译法“古实”。
- source_word: יָלַ֣ד
  choice: 生了
  rationale: 在家谱语境中表示生育、成为父亲；“生了”简洁自然，也符合现代汉语家谱叙述。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是特指直接宾语标记，汉语无须用独立词语对应。
- source_word: נִמְר֑וֹד
  choice: 宁录
  rationale: 采用通行的圣经人名译法。
- source_word: ה֣וּא
  choice: 他
  rationale: 独立代词重新指向并略带强调；汉语以“他”自然表达，不额外强化为“就是他”。
- source_word: הֵחֵ֔ל לִ/הְי֥וֹת
  choice: 开始成为
  rationale: 直译其“开始＋成为”的结构，同时比“开始是”更符合现代汉语。原文没有明确说“第一个成为”，因此不加入“首先”。
- source_word: גִּבּ֖וֹר
  choice: 强人
  rationale: 该词可指强有力的人、勇士或英雄；此处未明确描述战争，“强人”保留较宽泛的含义，避免缩窄为“战士”。
- source_word: בָּ/אָֽרֶץ
  choice: 在那地
  rationale: אֶרֶץ既可指某一地域，也可指大地或全地；正文采用范围较窄而仍然自然的“那地”，较广的理解留在脚注中。
theological_decisions:
- issue: 宁录强盛范围中 בָּאָרֶץ 的所指
  choice: 在那地
  alternative: 在地上／在全地
  rationale: 原词可指特定地域，也可泛指大地，单凭本节无法确定其范围。正文不将宁录的地位明确普世化，并用脚注保留较广的解释。
- issue: הֵחֵל 是否表示“第一个”
  choice: 开始成为
  alternative: 首先成为
  rationale: 该动词结构通常表示“开始成为”；译作“第一个”虽属可能的语境性理解，却会增添原文未明确表达的先后断言。
translation_notes:
  register: 采用自然、庄重而简明的现代汉语家谱体。“生了”承接家谱语境；“强人”避免把 גִּבּוֹר 过早限定为军事意义上的“战士”或带褒义色彩的“英雄”。脚注标记置于相关短语所在句末。
