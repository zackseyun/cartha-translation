    rationale: גִּבּוֹר 指强有力者、勇士或有能者，本节未提及统治或政治权势。“强人”会引入不必要的现代政治语义。
  - severity: low
    issue: “在那地”无明确先行所指。
    rationale: 希伯来语定冠词不能机械对应为汉语指示词“那”。用“地上”作正文并以脚注保留“某一地域／那地”的可能性，能更自然地呈现 אֶרֶץ 的歧义。
  revised_text: 古实生宁录；他开始成为地上的强者[a]。
