  text: Samlah died[a], and Shaul from Rehoboth by the River reigned in his place.
translation:
  language: zh_hans
  text: 桑拉死了，来自大河边的利河伯的扫罗接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: מות的Qal连续式在此直接表示死亡；“死了”朴实、清楚，不采用委婉说法。
- source_word: שַׂמְלָה
  choice: 桑拉
  rationale: 按现代中文圣经人名的通行音译处理此专名。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך用于王位承继的叙事公式，表示登位并执掌王权；与“接替他”连用时，“作王”自然准确。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: תחת加第三人称单数阳性后缀在王位承继语境中意为“代替他、居其位”；“接替他”清楚表达继位关系。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经传统中该希伯来人名的通行音译；上下文已表明这是以东王，不会与后来的以色列王混淆。
- source_word: מֵרְחֹבוֹת
  choice: 来自……利河伯
  rationale: 前缀מ־表示来源；利河伯在此是地名，因此译为“来自……利河伯”。
- source_word: הַנָּהָר
  choice: 大河
  rationale: 原文直译为“那河／河”；在古代近东地理用语中常作为特指的大河名称，但原文没有明说“幼发拉底河”。正文用“大河”保留其特指意味，脚注说明其他理解。
theological_decisions: []
translation_notes:
  register: 采用简洁庄重的现代叙事体。“来自大河旁利河伯的扫罗”保留原文的来源信息及“利河伯—大河”的地理关联；不擅自把“大河”明确改成“幼发拉底河”。
