  text: 以扫的儿子：以利法、流珥、耶乌施、雅兰和可拉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的儿子
  rationale: 这是בֵּן的复数构造形式，用来引出直接的家谱名单；译作“儿子”比“后代”更准确，也符合现代汉语的家谱表达。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经读者熟悉的希伯来人名通行译法。
- source_word: אֱלִיפַז
  choice: 以利法
  rationale: 采用该希伯来人名在中文圣经中的通行音译。
- source_word: רְעוּאֵל
  choice: 流珥
  rationale: 采用该希伯来人名在中文圣经中的通行音译；英文传统中 Reuel 与 Raguel 的差别不构成希伯来原文异文，也无需移植为中文脚注。
- source_word: וִיעוּשׁ
  choice: 耶乌施
  rationale: 去除前置连词后，人名为יְעוּשׁ；采用中文圣经中的通行音译。
- source_word: וְיַעְלָם
  choice: 雅兰
  rationale: 去除前置连词后，人名为יַעְלָם；采用中文圣经中的通行音译。
- source_word: וְקֹרַח
  choice: 和可拉
  rationale: 将前置连词וְ译为名单末项前的“和”，人名采用中文圣经通行音译“可拉”。
