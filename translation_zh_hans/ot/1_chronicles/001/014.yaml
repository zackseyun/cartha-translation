  text: the Jebusites[a], the Amorites, and the Girgashites.
translation:
  language: zh_hans
  text: 还有耶布斯人[a]、亚摩利人和革迦撒人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来语族称在形式上是单数，却用来统称各族，即耶布斯人、亚摩利人和革迦撒人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: 耶布斯人
  rationale: 该词在形态上是单数族称，但在这份民族谱系中集合性地指整个族群；现代汉语以“耶布斯人”自然涵盖这一群体。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 与上下文其他族称一样，形态上的单数在此作集合用法，指亚摩利族。
- source_word: הַגִּרְגָּשִׁי
  choice: 革迦撒人
  rationale: 按谱系名单中的集合性族称处理，译为现代中文圣经读者熟悉的“革迦撒人”。
- source_word: וְאֶת / וְאֵת
  choice: 还有……、……和……
  rationale: אֵת是直接宾语标记，中文不另译；重复的连接词וְ依照中文列举习惯，用“还有”承接上文，并以顿号及末项前的“和”表达并列关系。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“还有”保留本节开头与上一节名单相连的并列关系；族名沿用简体中文圣经中通行且易识别的译法。
