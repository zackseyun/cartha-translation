  yaml_path: translation/ot/1_chronicles/001/037.yaml
  text: 'The sons of Reuel: Nahath, Zerah, Shammah, and Mizzah.'
translation:
  language: zh_hans
  text: 流珥的儿子是拿哈、谢拉、沙玛和米撒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是“儿子”的复数构造形式，在此引出流珥的直接后代；译作“儿子”最直接，也符合家谱语境。
- source_word: רְעוּאֵל
  choice: 流珥
  rationale: 人名按现代中文圣经中较通行的形式音译，不按其可能的词源含义意译。
- source_word: נַחַת
  choice: 拿哈
  rationale: 作为人名音译；采用现代中文圣经中通行且易读的写法。
- source_word: זֶרַח
  choice: 谢拉
  rationale: 此处是人名，采用通行音译，不按该词可能含有的“升起、发光”等词源意义翻译。
- source_word: שַׁמָּה
  choice: 沙玛
  rationale: 作为人名音译，保留与希伯来语读音相近且通行的中文形式。
- source_word: וּ/מִזָּה
  choice: 和米撒
  rationale: 将连接词וּ译为“和”，人名מִזָּה音译为“米撒”；希伯来语中的辅音加倍不在中文音译中另作标示。
