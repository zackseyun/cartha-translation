lexical_decisions:
- source_word: אַבְרָם
  choice: 亚伯兰
  rationale: 人名采用现代中文圣经读者熟悉的标准译名；此处保留改名前的名字。
- source_word: הוּא
  choice: 就是
  rationale: 该独立代词在两个名字之间构成无动词的同一认定句。译作“就是”既符合现代汉语，也清楚表达亚伯兰即亚伯拉罕，同时以脚注保留较形式对应的表达。
- source_word: אַבְרָהָם
  choice: 亚伯拉罕
  rationale: 人名采用现代中文通行译名；经文用此名说明亚伯兰后来所用的名字。
theological_decisions:
- issue: 家谱语境中无动词同一认定结构的译法
  choice: 亚伯兰，就是亚伯拉罕。
  alternative: 亚伯兰，他就是亚伯拉罕；亚伯兰是亚伯拉罕。
  rationale: 希伯来文以独立代词 הוּא 连接两个专名，重点是认定二名所指为同一人。“就是”自然传达这一功能，不额外解释改名的时间或原因，也不引入神学推论。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。正文保留家谱条目的凝练风格，并以脚注呈现希伯来文名词句较形式对应的译法。
