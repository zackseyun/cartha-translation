  text: בְּֽנֵי אֵ֔צֶר בִּלְהָ֥ן וְ/זַעֲוָ֖ן יַעֲקָ֑ן בְּנֵ֥י דִישׁ֖וֹן ע֥וּץ וַ/אֲרָֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/042.yaml
  text: 'The sons of Ezer: Bilhan[a], Zaavan, and Jaakan[b]. The sons of Dishon: Uz and Aran.'
translation:
  language: zh_hans
  text: 以察的儿子是辟罕、撒番和雅干[a]。底顺的儿子是乌斯和亚兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 历代志此处的希伯来文作“雅干”；平行家谱创世记36:27作“亚干”。
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的儿子
  rationale: 这是בֵּן的复数构造形式，在家谱中引出儿子名单；直译为“儿子”既准确，也符合现代中文家谱表达。
- source_word: אֵצֶר
  choice: 以察
  rationale: 人名按中文圣经中通行且易辨认的形式音译。
- source_word: בִּלְהָן
  choice: 辟罕
  rationale: 人名音译，并采用中文读者较熟悉的传统形式。
- source_word: זַעֲוָן
  choice: 撒番
  rationale: 人名音译；其希伯来文读音近似Za‘avan。创世记36:27的马所拉文本也是同一拼写和元音，因此不把英语拼写Zaavan/Zavan的差异作为中文异文脚注。
- source_word: יַעֲקָן
  choice: 雅干
  rationale: 按历代志此处的希伯来文形式音译；与创世记36:27的עֲקָן并不完全相同，异体见脚注。
- source_word: דִישׁוֹן
  choice: 底顺
  rationale: 人名音译，并与本章其他相近人名保持区分。
- source_word: עוּץ
  choice: 乌斯
  rationale: 采用中文圣经中通行的人名音译。
- source_word: אֲרָן
  choice: 亚兰
  rationale: 人名音译；此处指个人，不在正文中另作解释。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，并保留家谱条目的平行结构。连接多人名单时使用“和”，使行文自然。英语咨询文本把脚注[a]标在“Bilhan”之后，但脚注内容讨论的是Zaavan；经核对马所拉文本，历代志与创世记的זַעֲוָן并无实质文本差异，仅英语转写形式不同，故中文稿不设该脚注。关于יַעֲקָן与创世记平行处עֲקָן的实际名称差异，则保留脚注。
