base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/045.yaml
  text: And Yobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: zh_hans
  text: 约巴死了，来自提幔人之地[a]的户珊接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“提幔地”；也可理解为“提幔人的地方”。
    reason: 希伯来语“提幔人之地”中的族属词为单数形式，在此结构中可能指提幔地区、某位提幔人的地域，或泛指提幔人的地方。
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 该叙事性动词表示事件依次发生；把主语“约巴”明说出来，符合现代汉语叙事习惯。
- source_word: יוֹבָב
  choice: 约巴
  rationale: 采用现代中文圣经读者较熟悉的人名形式，同时对应希伯来语人名 Yovav。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך 在王位承继公式中表示登上王位并统治；“作王”简洁自然，也保留其王权含义。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: תחתיו 在承继语境中表示取代前任、继其位；“接替他”清楚表达直接继位关系。
- source_word: חוּשָׁם
  choice: 户珊
  rationale: 采用该希伯来人名 Husham 的通行中文译名。
- source_word: מֵאֶרֶץ
  choice: 来自……之地
  rationale: מן 加 אֶרֶץ 表明地域来源；此译法保留“地、地方”的明确成分。
- source_word: הַתֵּימָנִי
  choice: 提幔人
  rationale: 该词是带定冠词的单数族属词，可指“提幔人”，但与“地”连用时也可能泛指提幔地区或提幔人的地域；正文采取较贴近词形的译法，并以脚注保留其他理解。
