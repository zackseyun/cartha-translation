  yaml_path: translation/ot/1_chronicles/001/015.yaml
  text: and the Hivites[a], and the Arkites, and the Sinites.
translation:
  language: zh_hans
  text: 还有希未人[a]、亚基人和西尼人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文三个族称均采用带定冠词的单数形式，直译可作“那希未人、那亚基人、那西尼人”；但在这段家谱中，它们指各个民族或宗族。汉语的“希未人、亚基人、西尼人”既可指个人，也可统称族群。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: 还有／和
  rationale: וְ连接族名清单，אֵת是直接宾语标记，现代汉语无需另译。句首按承接上文的列举关系译作“还有”，后续并列项用顿号和“和”自然衔接。
- source_word: הַ/חִוִּי
  choice: 希未人
  rationale: 带定冠词的单数族称；在这段家谱中指一个族群。汉语族名加“人”本身可作集合称谓，无需显式标出单复数。
- source_word: הַֽ/עַרְקִי
  choice: 亚基人
  rationale: 这是带定冠词的单数族称，在本处按群体理解。“亚基人”采用现代中文圣经中较通行的专名形式。
- source_word: הַ/סִּינִי
  choice: 西尼人
  rationale: 这是带定冠词的单数族称，在家谱清单中表示族群；译作“西尼人”，保留专名及集合意义。
