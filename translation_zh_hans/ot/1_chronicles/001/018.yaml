  text: Arpachshad fathered Shelah[b][a], and Shelah fathered Eber.
translation:
  language: zh_hans
  text: 亚帕克沙德[b]生了舍拉[a]，舍拉生了埃伯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“舍拉”；有些传统译本及相关家谱经文译作“沙拉”。
    reason: lexical_alternative
  - marker: b
    text: “亚帕克沙德”按希伯来文音译；传统汉语译名常作“亚法撒”，与受希腊文影响的旧译名传统有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְפַּכְשַׁד
  choice: 亚帕革沙德
  rationale: 按希伯来语名称的辅音和读音转写，同时采用适合现代汉语的简洁音译；传统译名“亚法撒”受较早译名传统影响，未能同样直接体现本节的希伯来语形式。
- source_word: יָלַד
  choice: 生了
  rationale: 在父系家谱中表示生育或成为某人的父系先祖；“生了”简洁自然，符合汉语家谱表达，又不额外断定这里所列是否每一代都没有省略。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在汉语中由语序体现，无须另译。
- source_word: שָׁלַח / שֶׁלַח
  choice: 舍拉
  rationale: 两处马所拉元音略有差异，但指同一人，故统一音译为“舍拉”；该译名较直接反映希伯来语形式。
- source_word: עֵבֶר
  choice: 埃贝尔
  rationale: 按本节希伯来语形式音译，避免采用可能使读者误以为词首有对应辅音的传统形式“希伯”。
theological_decisions:
- issue: 家谱动词 יָלַד 是否必然表示直接父子关系
  choice: 译作“生了”，保留家谱惯用表达的范围
  alternative: 译作“是……的父亲”
  rationale: 希伯来家谱中的 יָלַד 可用于父系承继关系；汉语“生了”既忠实于句式，也不必替原文解决家谱是否省略世代的问题。
translation_notes:
  register: 采用简洁、庄重的现代汉语家谱句式。人名以希伯来文为主要依据音译，并用脚注保留读者熟悉的传统译名。两个并列分句用逗号连接，以呈现原文连续家谱的节奏。
