  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
translation:
  language: zh_hans
  text: 哈达死了。以东的族长[b]有：亭纳族长、亚利亚族长[a]、耶帖族长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《创世记》36:40的平行名单作“亚勒瓦”；《历代志》此处的希伯来文本作“亚利亚”。
    reason: textual_variant
  - marker: b
    text: “族长”所译的希伯来语词在这里指以东的氏族或部族首领；较早的一些译本曾按爵位译作“公爵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 该叙事形式表示接续发生的事件；“死了”是自然、准确的现代汉语表达。
- source_word: הֲדָד
  choice: 哈达
  rationale: 按希伯来语人名音译，并沿用中文圣经中常见的译名。
- source_word: וַיִּהְיוּ
  choice: 有
  rationale: 这里用于引出哈达死后以东族长的名单；“有”符合现代汉语列举人物时的表达习惯。
- source_word: אַלּוּפֵי / אַלּוּף
  choice: 族长
  rationale: 在以东的谱系和政治名单中，此词指氏族或部族首领；“族长”既贴合语境，也避免使用容易误导的封建爵位称号。
- source_word: אֱדוֹם
  choice: 以东
  rationale: 采用现代中文圣经中通行的地名和民族名译法。
- source_word: תִּמְנָע
  choice: 亭纳
  rationale: 按希伯来语音译，并采用中文圣经人名的惯常形式。
- source_word: עליה
  choice: 亚利亚
  rationale: 忠实反映《历代志》此处的辅音文本，而不以《创世记》36:40平行名单中的另一形式取代。
- source_word: יְתֵת
  choice: 耶帖
  rationale: 按希伯来语人名音译，并采用中文圣经中较为通行的形式。
