  yaml_path: translation/ot/1_chronicles/001/007.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Rodanim.'
translation:
  language: zh_hans
  text: 雅完的儿子是：以利沙、他施、基提人和罗单人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《创世记》10:4作“多单人”，而不是“罗单人”；这是该名称的文本异文。
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: 的儿子是
  rationale: בְּנֵי是“儿子”的复数构造形式；在家谱中也可泛指后裔。此处保留家谱的亲属表达，并补“是”使现代汉语自然。
- source_word: יָוָן
  choice: 雅完
  rationale: 作为家谱中的专名，采用现代中文圣经中易辨认的传统音译，不改译为“希腊”或“希腊人”。
- source_word: אֱלִישָׁה
  choice: 以利沙
  rationale: 专名按通行中文形式音译。
- source_word: תַרְשִׁישָׁה
  choice: 他施
  rationale: 专名采用通行中文音译；词尾ה在此名称形式中不另行译出。
- source_word: כִּתִּים
  choice: 基提人
  rationale: 该词为复数族名，译作“基提人”既体现其复数民族含义，也符合自然汉语。
- source_word: וְרוֹדָנִים
  choice: 和罗单人
  rationale: 依《历代志上》的马所拉文本רֹדָנִים译作“罗单人”；其复数形式按族名处理。与创世记10:4的“多单人”之异文另加脚注说明。
