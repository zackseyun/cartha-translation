  text: 'And the sons of Gomer: Ashkenaz[a], Diphath, and Togarmah.'
translation:
  language: zh_hans
  text: 歌篾的儿子是亚实基拿、低法[a]和陀迦玛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《创世记》10:3的平行家谱作“利法”；本节《历代志》的希伯来文本作“低法”。
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: ……的儿子是
  rationale: בְנֵי是“儿子”的复数附属形式；在家谱中直译为“……的儿子”，既保留谱系用语，也符合现代汉语表达。句首连接词וּ承接上下文的名单结构，汉语中不必机械译出“和”。
- source_word: גֹּמֶר
  choice: 歌篾
  rationale: 专名按现代中文圣经通行译名音译。
- source_word: אַשְׁכֲּנַז
  choice: 亚实基拿
  rationale: 专名按现代中文圣经通行译名音译。
- source_word: דִיפַת
  choice: 低法
  rationale: 本节《马所拉文本》作דִיפַת，故正文译作“低法”；《创世记》10:3的平行家谱作רִיפַת（“利法”），在脚注中说明异文。
- source_word: תוֹגַרְמָה
  choice: 陀迦玛
  rationale: 专名按现代中文圣经通行译名音译。
