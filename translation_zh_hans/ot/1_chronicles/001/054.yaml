lexical_decisions:
- source_word: אַלּוּף
  choice: 族长
  rationale: 该词在以东的家族和政治首领名单中指部族或宗族的首领；“族长”简洁自然，也避免采用带有后世欧洲爵位色彩的译法。
- source_word: מַגְדִּיאֵל
  choice: 抹大叠
  rationale: 专名采用现代中文圣经中较为通行的音译，以便读者辨认并与相关经文互参。
- source_word: עִירָם
  choice: 以兰
  rationale: 专名按中文圣经惯用形式音译。
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 希伯来文无系词；在本节总结名单的语境中补出“是”，使现代汉语自然，同时保留其指总结性质。
- source_word: אַלּוּפֵי אֱדֹם
  choice: 以东的族长
  rationale: 这是对前列诸名的总结；与本节前两次 אַלּוּף 统一译作“族长”。
