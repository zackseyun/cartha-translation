  yaml_path: translation/ot/1_chronicles/001/047.yaml
  text: Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: zh_hans
  text: 哈达死了，来自玛士利加的桑拉接替他作王[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他之后作王。”希伯来语原意为“在他的位置上”，这里表示王位承继。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: מּוּת在此直接表示死亡；“死了”自然、明确，也不作委婉处理。
- source_word: הֲדָד
  choice: 哈达
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מָלַךְ用于王位承继句式，指登上王位并为王；“作王”简洁保留家谱王表的文体。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: תַּחַת加第三人称后缀在此表示取代前任、承继王位；“接替他”自然传达这一关系，同时以脚注保留较贴近字面的另一种表达。
- source_word: שַׂמְלָה
  choice: 桑拉
  rationale: 作为人名，采用通行中文音译。
- source_word: מִמַּשְׂרֵקָה
  choice: 来自玛士利加
  rationale: 前缀מִן表示来源或地域关联；“来自”清楚表达桑拉与该地的关系，不把它过度限定为出生地。
