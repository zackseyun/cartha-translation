  text: וּ/בְנֵ֣י מִדְיָ֗ן עֵיפָ֤ה וָ/עֵ֨פֶר֙ וַ/חֲנ֔וֹךְ וַ/אֲבִידָ֖ע וְ/אֶלְדָּעָ֑ה כָּל אֵ֖לֶּה בְּנֵ֥י קְטוּרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/033.yaml
  text: 'The sons of Midian: Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.'
translation:
  language: zh_hans
  text: 米甸的儿子是：以法、以弗、哈诺[a]、亚比大和以勒大。这些人都是基土拉的后代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈诺”也常译作“以诺”。
    reason: 提示同一希伯来名字在中文传统中的另一常见译法；脚注标在“哈诺”之后，以对应实际说明对象。
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: 米甸的儿子是
  rationale: בְּנֵי 是“儿子”的复数附属形式；在家谱名单开头补出“是”，使现代汉语句法完整。句首连接词 וּ 不另译，以免在独立经节中显得生硬。
- source_word: עֵיפָה
  choice: 以法
  rationale: 按现代中文圣经中较通行的专名形式音译。
- source_word: וָעֵפֶר
  choice: 以弗
  rationale: 专名音译；前缀连接词通过中文列举标点体现。
- source_word: וַחֲנוֹךְ
  choice: 哈诺
  rationale: 按此处希伯来文 חֲנוֹךְ 音译为“哈诺”，并用脚注提示传统译名差异。
- source_word: וַאֲבִידָע
  choice: 亚比大
  rationale: 按通行中文专名形式音译。
- source_word: וְאֶלְדָּעָה
  choice: 和以勒大
  rationale: 末项保留连接词的列举功能，译作“和”；专名按通行形式音译。
- source_word: כָּל אֵלֶּה
  choice: 这些人都
  rationale: 该短语概括前述名单；补出“人”符合自然现代汉语，且不增加名单以外的信息。
- source_word: בְּנֵי קְטוּרָה
  choice: 基土拉的后代
  rationale: בְּנֵי 在家谱语境中可泛指后裔；前述诸人是米甸的儿子、基土拉的孙辈，因此译作“后代”既忠于亲属语义范围，也避免现代汉语“儿子”只指直接子嗣所造成的误解。
- source_word: קְטוּרָה
  choice: 基土拉
  rationale: 采用现代中文圣经中通行的专名音译。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语家谱体。人名沿用普通中文读者较熟悉的圣经音译；列表使用冒号和顿号增强可读性。末句将亲属称谓按家谱语境译为“后代”，保留希伯来文 בֵּן 可指后裔的语义范围。
