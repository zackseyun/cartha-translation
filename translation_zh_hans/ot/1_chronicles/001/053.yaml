- source_word: קְנַז
  choice: 基纳斯
  rationale: 专名，按现代中文圣经人名的通行音译处理。
- source_word: תֵּימָן
  choice: 提幔
  rationale: 此处在以东族长名单中作为专名使用；虽也可关联地区或宗族，这里保留名称形式。
- source_word: מִבְצָר
  choice: 米比萨
  rationale: 专名，采用现代中文圣经中通行的音译形式。
