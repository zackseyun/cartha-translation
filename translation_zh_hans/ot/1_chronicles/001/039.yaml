  text: 'The sons of Lotan: Hori and Homam[a]; and Lotan’s sister was Timna.'
translation:
  language: zh_hans
  text: 罗坦的儿子是何利和何曼[a]；罗坦有一位姐妹，名叫亭纳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在创世记36:22的平行家谱中，这个名字写作“希曼”，而不是“何曼”。
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי לוֹטָן
  choice: 罗坦的儿子
  rationale: בְנֵי是“儿子”的复数构造形式；家谱语境中用“……的儿子”最准确自然。句首连接词וּ不必机械译作“又”。
- source_word: חֹרִי
  choice: 何利
  rationale: 此处是人名，按希伯来语音译；虽然其形式与“何利人”这一族名相近，但家谱结构表明这里指个人。
- source_word: וְהוֹמָם
  choice: 和何曼
  rationale: 按本节马所拉文本הוֹמָם音译为“何曼”，并译出连接词。创世记36:22的平行家谱采用不同的名字形式，另以脚注说明，不据此改动本节正文。
- source_word: וַאֲחוֹת לוֹטָן
  choice: 罗坦的姐妹
  rationale: אֲחוֹת意为“姐姐或妹妹”。现代汉语用关系称谓“姐妹”可避免无根据地判定长幼；名词句所省略的系词在译文中补作“是”。
- source_word: תִּמְנָע
  choice: 亭纳
  rationale: 人名音译；本节希伯来语形式为תִּמְנָע，译作“亭纳”。
theological_decisions: []
translation_notes:
  register: 采用简洁庄重的现代汉语家谱体。“儿子是”使省略系词的希伯来语名词句在中文中清楚自然；“姐妹”保留原文未说明长幼的含义。所有人名依希伯来语形式音译，正文保留历代志本身的名字形式。
