base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/040.yaml
  text: 'The sons of Shobal: Alian[a], Manahath, Ebal, Shephi, and Onam[b]. And the sons of Zibeon: Aiah and Anah.'
translation:
  language: zh_hans
  text: 朔巴的儿子是：亚连[a]、玛拿辖、以巴、示非[b]和阿南。祭便的儿子是亚雅和亚拿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“亚连”；平行家谱《创世记》36:23作“亚勒文”。
    reason: alternative_reading
  - marker: b
    text: 《历代志》此处作“示非”；平行经文《创世记》36:23作“示玻”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 在家谱中直译为“儿子”；这里列举的是具名子嗣，没有必要泛化为“后代”。
- source_word: שׁוֹבָל
  choice: 朔巴
  rationale: 按希伯来语人名音译，并采用简洁自然的现代中文形式。
- source_word: עַלְיָן
  choice: 亚连
  rationale: 依本节《历代志》的希伯来文本 עַלְיָן 音译；与创世记36:23平行经文中的异文另以脚注说明。
- source_word: מָנַחַת
  choice: 玛拿哈
  rationale: 按希伯来语 מָנַחַת 音译。
- source_word: עֵיבָל
  choice: 以巴
  rationale: 按本节希伯来语 עֵיבָל 音译，不以其他经文或传统形式替换。
- source_word: שְׁפִי
  choice: 示非
  rationale: 依《历代志》本节的 שְׁפִי 音译；平行经文的不同形式在脚注中保留。
- source_word: אוֹנָם
  choice: 阿南
  rationale: 按希伯来语 אוֹנָם 音译。
- source_word: צִבְעוֹן
  choice: 祭便
  rationale: 按希伯来语 צִבְעוֹן 音译，采用便于普通中文读者辨读的形式。
- source_word: אַיָּה
  choice: 亚雅
  rationale: 按希伯来语 אַיָּה 音译。
- source_word: עֲנָה
  choice: 亚拿
  rationale: 按希伯来语 עֲנָה 音译。
- source_word: וְ / וּ / וַ
  choice: 、／和；第二句不另译
  rationale: 希伯来语连接词用于串联名单和分句；中文名单以顿号及末项前的“和”自然表达，第二分句则以另起一句呈现，无须机械重复“和”。
