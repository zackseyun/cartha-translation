revisions:
- from: 以下是曾在以东地作王的君王；那时以色列人还没有君王统治[a]：比珥的儿子比拉作王，他的城名叫亭哈巴。
  to: 以下是在以东地作王的君王，是在有君王统治以色列人以前：比珥的儿子比拉；他的城名叫亭哈巴。
  rationale: 修订使“在……以前”直接修饰所列以东君王，恢复原文的核心句法关系；删除姓名后非原文重复的“作王”。脚注以完整现代汉语保留单数与介词关系的译法可能性。
