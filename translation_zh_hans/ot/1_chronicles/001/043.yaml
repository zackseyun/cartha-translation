base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
translation:
  language: zh_hans
  text: 以下是在以东地作王的君王，是在有君王统治以色列人以前：比珥的儿子比拉；他的城名叫亭哈巴。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה הַמְּלָכִים
  choice: 以下是……君王
  rationale: 这是承接上文并引出名单的公式化表达。“以下是”在现代汉语中自然，也保留了历代志名单连续展开的语气。
- source_word: אֲשֶׁר מָלְכוּ בְּאֶרֶץ אֱדוֹם
  choice: 曾在以东地作王
  rationale: מלך在此指行使王权；“作王”简洁、庄重。“以东地”保留原文明确出现的“地”。
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ לִבְנֵי יִשְׂרָאֵל
  choice: 那时以色列人还没有君王统治
  rationale: 将希伯来语“在君王为／在以色列人中作王以前”转换为自然汉语，同时不把“君王”认定为某位特定人物。原文介词关系及单数表达的歧义在脚注中保留。
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: 比珥的儿子比拉
  rationale: 按现代中文圣经人名惯例音译，并以自然的亲子关系表达重现 בן。
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: 他的城名叫亭哈巴
  rationale: 忠实保留“他的城”的普通含义，不擅自将其明确为“京城”或“首都”；亭哈巴采用通行中文音译。
theological_decisions:
- issue: 以色列王权开始之前的表述
  choice: 以色列人还没有君王统治
  alternative: 在一位君王统治以色列人以前
  rationale: 原文使用单数“君王”，但没有指明具体人物；正文采用自然汉语概括当时尚未进入君王统治的状态，脚注则呈现更贴近形式的译法，避免把经文限定为某一位王。
translation_notes:
  register: 采用现代、庄重而易懂的名单叙述体。“作王”用于以东历任君王，“君王统治”用于以色列的王权状态，以避免汉语重复拗口；人名、地名采用简体中文圣经传统通行译名。
