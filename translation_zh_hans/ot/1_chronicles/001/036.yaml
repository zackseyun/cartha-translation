base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/036.yaml
  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
translation:
  language: zh_hans
  text: 以利法的儿子是提幔、阿抹、洗非[a]、迦坦、基纳斯、亭纳[b]和亚玛力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“洗非”；《创世记》36:11所记的名字形式略有不同，作“洗玻”。
    reason: textual_variant
  - marker: b
    text: 《创世记》36:12说，亭纳是以利法的妾，亚玛力是她所生的儿子；本节则把这两个名字都列在“以利法的儿子”这一名单中。
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的儿子
  rationale: 这是בֵּן的复数附属形，用来引出家谱名单；译作“儿子”最直接，也不把关系泛化为“后代”。
- source_word: אֱלִיפָז
  choice: 以利法
  rationale: 人名采用现代中文圣经读者熟悉的通行音译。
- source_word: תֵּימָן
  choice: 提幔
  rationale: 人名采用通行中文音译。
- source_word: אוֹמָר
  choice: 阿抹
  rationale: 人名采用通行中文音译。
- source_word: צְפִי
  choice: 洗斐
  rationale: 按本节马所拉文本צְפִי音译，并与《创世记》36:11的异体צְפוֹ加以区别。
- source_word: גַעְתָּם
  choice: 迦坦
  rationale: 人名采用通行中文音译。
- source_word: קְנַז
  choice: 基纳斯
  rationale: 人名采用通行中文音译。
- source_word: תִמְנָע
  choice: 亭纳
  rationale: 按本节所标元音的人名形式音译，并沿用中文圣经中的常见写法。
- source_word: עֲמָלֵק
  choice: 亚玛力
  rationale: 人名兼族祖名，采用通行中文音译。
- source_word: וְ / וַ
  choice: 顿号列举，末项前用“和”
  rationale: 希伯来文在名单中反复使用连接词；现代汉语用顿号并在末项前加“和”，既保留并列关系，也避免生硬重复。
theological_decisions:
- issue: 本节中亭纳和亚玛力与以利法的家谱关系，和《创世记》36章的记载有所不同
  choice: 正文依《历代志上》的表层句法，把亭纳和亚玛力都列在“以利法的儿子”这一名单中
  alternative: 依据《创世记》36:12，把亭纳理解为以利法的妾，把亚玛力理解为她所生的儿子
  rationale: 本节原文以“以利法的儿子”统领整个名单，没有在亭纳之前另加关系说明。翻译应按本节原貌呈现，不在正文中用平行经文消解差异；相关张力留在脚注说明。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语家谱句式。人名尽量沿用简体中文圣经的通行译名；脚注标记按实际说明对象分别置于“洗斐”和“亭纳”之后。
