  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: zh_hans
  text: 还有帕特鲁西人、迦斯路希人（非利士人从那里出来）[a]和迦斐托人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“非利士人从那里出来。”按本节希伯来语的词序，这句话最自然地与前面的迦斯路希人相连；不过，《创世记》10:14有相同措辞，而更广泛的经文传统也把非利士人与迦斐托联系起来（参《阿摩司书》9:7；《耶利米书》47:4）。
    reason: 说明原文关系从句可能涉及的归属问题，并提供相关经文参照。
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: 帕特鲁西人
  rationale: 按希伯来语族名音译，并以“人”表明这是一个族群；“帕特鲁西”也保留其与“帕特罗斯”地名的语音联系。
- source_word: כַּסְלֻחִים
  choice: 迦斯路希人
  rationale: 该族群的确切所指不明，因此采用音译，不作推测性解释。
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: 非利士人从那里出来
  rationale: 较直接地保留原文“从那里出来”的空间表达和指代张力，不擅自将其明确改写成“从他们繁衍而来”。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经传统中通行的族名。
- source_word: כַּפְתֹּרִים
  choice: 迦斐托人
  rationale: 采用通行音译，并以“人”表达希伯来语复数族名。
- source_word: וְאֶת
  choice: 还有／和
  rationale: 希伯来语反复使用连词和宾格标记来串联家谱名单；中文按名单结构自然译为“还有……和……”，不逐一硬译宾格标记。
theological_decisions:
- issue: “非利士人从那里出来”这一关系从句的归属
  choice: 按现存希伯来语词序将该句紧接在“迦斯路希人”之后，同时保留“那里”的含混性
  alternative: 把该句明确归于后面的“迦斐托人”，或译为“非利士人从他们而出”
  rationale: 《历代志上》此处的希伯来语最自然地把关系从句与紧邻的“迦斯路希人”相连，但其他经文传统也把非利士人与迦斐托联系起来；正文不应暗中消除这一文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的家谱名单文体。族名以音译为主；用括号标示原文中的关系从句，使名单层次清楚，同时以脚注保留其解释上的张力。
