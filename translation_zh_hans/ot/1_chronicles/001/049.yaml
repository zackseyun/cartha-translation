  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: zh_hans
  text: 扫罗死了，亚革波的儿子巴力·哈南接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 这是מות的Qal叙事式，直述“死了”；采用朴素、不委婉的现代汉语，保留希伯来叙事的推进。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经传统中已广为人知的人名译法，既便于普通读者识别，也对应希伯来名שָׁאוּל。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 这是מלך的Qal叙事式，在王位承继公式中表示登位并掌权；“作王”简洁自然，并与“接替他”共同表达继位。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: תַּחַת加第三人称后缀表达取代、承继其位置；结合作王语境译为“接替他”，准确传达王位承继。
- source_word: בַּעַל חָנָן
  choice: 巴力·哈南
  rationale: 按希伯来语复合人名音译，并用间隔号标明两个构成部分；“巴力”沿用中文中对בעל的通行音译。
- source_word: בֶּן
  choice: 儿子
  rationale: 本处位于明确的父子身份公式中，直接表示亲生或直接父系关系，译作“儿子”最透明。
- source_word: עַכְבּוֹר
  choice: 押波
  rationale: 采用中文圣经人名的通行译法，指明巴力·哈南之父；不按字面义翻译专名。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持历代志王表的公式化节奏。中文传统音译已能稳定识别这些人物，因此不另设异译脚注；“接替他作王”自然整合了תַּחְתָּיו与וַיִּמְלֹךְ的继位含义。
