  source_fidelity: 原文为连续的王位承继公式：扫罗死亡，亚革波的儿子巴力·哈南继位。草稿准确表达了死亡、父子关系和继位，但“押波”未充分对应עַכְבּוֹר（Akbor/ʿAkbor）的辅音构成，且不是现代中文圣经中稳定通行的人名形式。
