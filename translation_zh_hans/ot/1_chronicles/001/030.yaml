  yaml_path: translation/ot/1_chronicles/001/030.yaml
  text: Mishma[a], Dumah, Massa, Hadad, and Tema.
translation:
  language: zh_hans
  text: 米施玛[a]、度玛、玛撒、哈达和提玛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《创世记》25:15的平行名单作“哈大”；《历代志上》此处作“哈达”。
    reason: textual_variant
lexical_decisions:
- source_word: מִשְׁמָע
  choice: 米施玛
  rationale: 族谱中的专名，按希伯来语读音音译；采用现代中文圣经人名中清楚、自然的音节形式。
- source_word: וְ/דוּמָה
  choice: 度玛
  rationale: דוּמָה为专名，音译为“度玛”；连接词וְ在中文并列名单中不必逐项译出，以符合自然表达。
- source_word: מַשָּׂא
  choice: 玛撒
  rationale: 此处在后裔名单中明确是专名，故音译，不按其在其他语境中可能具有的“重担”或“默示”等普通名词意义翻译。
- source_word: חֲדַד
  choice: 哈达
  rationale: 忠实保留《历代志上》马所拉文本所读的Hadad，并以“哈达”音译；不以平行经文中的Hadar替换。
- source_word: וְ/תֵימָא
  choice: 和提玛
  rationale: תֵימָא为专名，音译为“提玛”；末项前的וְ译作“和”，自然呈现希伯来语名单的收束结构。
theological_decisions: []
