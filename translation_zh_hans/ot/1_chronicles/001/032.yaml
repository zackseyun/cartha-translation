base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
translation:
  language: zh_hans
  text: 亚伯拉罕的妾基土拉[a]所生的儿子是心兰、约珊、米但、米甸、伊施巴和书亚。约珊的儿子是示巴和底但。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 创世记25:1称基土拉为亚伯拉罕的“妻”；本节则明确称她为他的“妾”。
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי קְטוּרָה
  choice: 基土拉所生的儿子
  rationale: בְנֵי直译为“……的儿子”；结合下文阴性动词יָלְדָה，在现代汉语中译为“所生的儿子”既明确亲子关系，也避免“基土拉的儿子……她生了……”的重复。句首连接词ו在连续家谱中可不另译，以保持汉语自然。
- source_word: פִּילֶגֶשׁ אַבְרָהָם
  choice: 亚伯拉罕的妾
  rationale: פִּילֶגֶשׁ指具有婚姻关系、但地位有别于正妻的女性；“妾”是简洁且符合古代家族语境的现代汉语对应词。保留本节自身的称谓，不与创世记25:1的“妻”强行协调。
- source_word: יָלְדָה
  choice: 所生
  rationale: 阴性单数动词的主语是基土拉。将其整合为汉语定中结构“基土拉所生的儿子”，准确保留生育关系并使家谱句式流畅。
- source_word: זִמְרָן וְיָקְשָׁן וּמְדָן וּמִדְיָן וְיִשְׁבָּק וְשׁוּחַ
  choice: 心兰、约珊、米但、米甸、伊施巴和书亚
  rationale: 各专名按中文圣经中通行且彼此可辨的形式音译；希伯来语反复使用的连接词ו按现代汉语列举习惯处理为顿号，并在末项前用“和”。
- source_word: וּבְנֵי יָקְשָׁן שְׁבָא וּדְדָן
  choice: 约珊的儿子是示巴和底但
  rationale: 保留家谱中的第二层父子关系；希伯来语名词句在汉语中补出判断词“是”，表达自然且不增加实质信息。
theological_decisions:
- issue: 基土拉与亚伯拉罕关系的身份称谓
  choice: 妾
  alternative: 妻；次妻
  rationale: 本节明确使用פִּילֶגֶשׁ，而非通常表示“妻”的אִשָּׁה。因此正文按本节词义译作“妾”，不因创世记25:1称她为“妻”而在正文中调和两处称谓；脚注提示经文间真实存在的用词差异。
translation_notes:
  register: 采用现代、庄重而简明的家谱体。姓名使用简体中文圣经传统中常见的译名；列举时按现代汉语标点处理。脚注标记[a]紧接“基土拉”，对应她身份称谓的经文差异。
