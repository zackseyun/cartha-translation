lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 该词是“儿子”的复数构造式，在此引出家谱名单；直译为“儿子”既忠实于原文，也符合中文家谱体裁。
- source_word: שֵׁם
  choice: 闪
  rationale: 采用现代中文圣经读者熟悉的传统人名译法。
- source_word: עֵילָם
  choice: 以拦
  rationale: 采用通行的中文专名译法；此处作为闪之子的名字。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 在家谱中按人名处理，不译作带有明确地理含义的“亚述国”。
- source_word: אַרְפַּכְשַׁד
  choice: 亚法撒
  rationale: 采用通行中文人名译法，指家谱中的人物。
- source_word: לוּד
  choice: 路德
  rationale: 原文是单数专名，不按复数族名处理。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 在家谱语境中保留祖先人名，不改译为后来的地域名称。
- source_word: ע֥וּץ
  choice: 乌斯
  rationale: 采用通行中文音译。
- source_word: ח֖וּל
  choice: 户勒
  rationale: 采用与希伯来语名称相应且便于现代读者辨认的中文音译。
- source_word: גֶ֥תֶר
  choice: 基帖
  rationale: 采用通行中文人名译法。
- source_word: מֶֽשֶׁךְ
  choice: 米设
  rationale: 按本节马所拉文本的读法翻译；平行家谱中的不同名称另以脚注说明。
