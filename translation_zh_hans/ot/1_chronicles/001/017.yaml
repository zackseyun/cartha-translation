  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud, and Aram; Uz, Hul, Gether, and Meshech.'
translation:
  language: zh_hans
  text: 闪的儿子是：以拦、亚述、亚法撒、路德和亚兰；乌斯、户勒、基帖和米设[a]。
  philosophy: optimal-equivalence
  footnotes:
