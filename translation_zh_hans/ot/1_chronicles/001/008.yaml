  text: 含的儿子[a]是古实、麦西[b]、弗和迦南。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“后裔”。希伯来语家谱中的“儿子”既可指直接的儿子，也可泛指较广义的后裔。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“麦西”，传统上与埃及相关。这里它与古实、弗和迦南并列，作为家谱中的专名，因此保留音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是בֵּן的复数构造形式，用于家谱套语。译作“儿子”自然、简洁，同时可按家谱语境涵盖较广的后裔关系；相关歧义以脚注保留。
- source_word: חָם
  choice: 含
  rationale: 专有名词，采用现代中文圣经中通行且简明的音译。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 专有名词，在此家谱中指同名祖先，也可能关联其后族群或地域；采用中文圣经通行译名，不将其改译为现代地名。
- source_word: מִצְרַיִם
  choice: 麦西
  rationale: 该词在这里与其他同名祖先并列，具有家谱中的专名功能，因此保留音译“麦西”，而不直接译作地名“埃及”。
- source_word: פּוּט
  choice: 弗
  rationale: 专有名词，采用中文圣经中通行的音译形式。
- source_word: כְנָעַן
  choice: 迦南
  rationale: 专有名词，采用中文通行译名；在本节家谱语境中作为同名祖先之名。
theological_decisions:
- issue: 家谱中“儿子”的关系范围
  choice: 正文译作“儿子”，脚注说明也可泛指“后裔”
  alternative: 正文直接译作“后裔”
  rationale: 希伯来语家谱套语בְּנֵי既可指亲生儿子，也可能指更广的直系后裔。正文保留形式上的亲属称谓，脚注保存其语义范围，不武断限定世代关系。
translation_notes:
