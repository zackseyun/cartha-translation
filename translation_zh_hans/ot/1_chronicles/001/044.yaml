lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 该词是מות的叙事性连续式，表示接续发生的事件；现代汉语用“死了”自然表达。
- source_word: בָּלַע
  choice: 比拉
  rationale: 人名按现代中文圣经中常见的音译形式处理。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך的Qal叙事性连续式在王位承继语境中表示登基执政；“作王”简洁且符合中文家谱与王表的文体。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: תחת加第三人称单数阳性词尾表示取代前任的位置；“接替他”自然呈现王位承继关系。
- source_word: יוֹבָב
  choice: 约巴
  rationale: 人名采用现代中文圣经中常见的音译。
- source_word: בֶּן זֶרַח
  choice: 谢拉的儿子
  rationale: 忠实表达希伯来语父系称谓结构，并按自然汉语调整语序。
- source_word: מִבָּצְרָה
  choice: 波斯拉人
  rationale: 前缀מִן可表示来自某地或与该城有关；“波斯拉人”在中文中自然表达籍贯或地域归属，同时不过度限定为出生地。
