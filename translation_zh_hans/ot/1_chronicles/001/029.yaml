  text: 'These are their generations: the firstborn of Ishmael[a], Nebaioth, Kedar, Adbeel, and Mibsam.'
translation:
  language: zh_hans
  text: 他们的后代如下：以实玛利的长子尼拜约、基达、亚德别和米比衫。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה תֹּלְדוֹתָם
  choice: 他们的后代如下
  rationale: תּוֹלְדוֹת在族谱语境中可指后代、世系或家谱记录；这里随后列举人名，译作“后代如下”自然清楚，同时保留族谱引介语的功能。
- source_word: בְּכוֹר יִשְׁמָעֵאל
  choice: 以实玛利的长子
  rationale: בְּכוֹר表示“长子”或“头生的”；所属关系由后接的“以实玛利”表达，故译为“以实玛利的长子”。
- source_word: יִשְׁמָעֵאל
  choice: 以实玛利
  rationale: 采用现代中文圣经中通行且易于辨认的人名译法。
- source_word: נְבָיוֹת
  choice: 尼拜约
  rationale: 按希伯来语人名并参照中文圣经通行译名音译。
- source_word: קֵדָר
  choice: 基达
  rationale: 按希伯来语人名并参照中文圣经通行译名音译。
- source_word: אַדְבְּאֵל
  choice: 亚德别
  rationale: 按希伯来语人名并参照中文圣经通行译名音译。
- source_word: מִבְשָׂם
  choice: 米比衫
  rationale: 按希伯来语人名并参照中文圣经通行译名音译。
