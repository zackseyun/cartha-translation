  text: and the Arvadites[a], and the Zemarites, and the Hamathites.
translation:
  language: zh_hans
  text: 还有亚瓦底人[a]、洗玛利人和哈马人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里几个希伯来语族称在语法形式上都是单数，但均作集合用法，指整个民族或宗族，即亚瓦底人、洗玛利人和哈马人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: 还有／和
  rationale: 在家谱民族名单中，וְ 连接并列项目，אֵת 是宾语标记，不需另译。句首译作“还有”，末项前译作“和”，符合现代汉语列举习惯。
- source_word: הָאַרְוָדִי
  choice: 亚瓦底人
  rationale: 该词在形态上是单数族称，在此类民族谱系中却具有集合意义，指与亚瓦底相关的族群；用“亚瓦底人”自然表达这一含义。
- source_word: הַצְּמָרִי
  choice: 洗玛利人
  rationale: 这是与洗玛利相关的族称，虽为单数形式，却集合性地指该族群；“洗玛利人”保留专名并清楚表达人群意义。
- source_word: הַחֲמָתִי
  choice: 哈马人
  rationale: 该族称指与哈马相关的居民或宗族，在名单中具有集合意义；译作“哈马人”简洁自然。
