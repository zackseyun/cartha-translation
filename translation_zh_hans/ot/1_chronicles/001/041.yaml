base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/041.yaml
  text: 'The sons of Anah: Dishon. And the sons of Dishon: Hamran[a], Eshban, Ithran, and Keran.'
translation:
  language: zh_hans
  text: 亚拿的儿子是底顺。底顺的儿子是哈姆兰[a]、以实班、益兰和基兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《创世记》36:26的平行家谱作“赫姆但”，而不是“哈姆兰”。正文在此依从《历代志上》的马所拉文本。
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: ……的儿子
  rationale: 这是 בֵּן（儿子）的复数附属形式；在家谱中直译为“……的儿子”既准确，也符合现代汉语表达。
- source_word: עֲנָה
  choice: 亚拿
  rationale: 人名按希伯来语音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: דִּישׁוֹן
  choice: 底顺
  rationale: 人名按希伯来语音译；本节中此名先指亚拿之子，随后又作为四人的父亲，前后采用同一译名。
- source_word: וּבְנֵי
  choice: 底顺的儿子是
  rationale: 前缀 וְ 承接上一家谱条目；汉语另起一句便已自然表达承接关系，无须机械译出“和”。
- source_word: חַמְרָן
  choice: 哈姆兰
  rationale: 依《历代志上》马所拉文本 חַמְרָן 音译；《创世记》36:26平行家谱的不同读法另以脚注说明。
- source_word: אֶשְׁבָּן
  choice: 以实班
  rationale: 按希伯来语辅音和读音作自然的中文音译。
- source_word: יִתְרָן
  choice: 益兰
  rationale: 按希伯来语读音音译为简洁且易读的中文人名形式。
- source_word: כְרָן
  choice: 基兰
  rationale: 按希伯来语读音音译；其前的连接词 וְ 在汉语列举末项前译作“和”。
