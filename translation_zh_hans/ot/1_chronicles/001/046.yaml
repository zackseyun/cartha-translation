base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
translation:
  language: zh_hans
  text: 户珊死后，比达的儿子哈达接替他作王；他曾在摩押地攻打米甸人。他的城名叫亚未得[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或音译“艾约特”。
    reason: 原文地名的拼读与音译存在差异；正文采用通行名称“亚未得”。
lexical_decisions:
- source_word: וַיָּמָת חוּשָׁם
  choice: 户珊死后
  rationale: מות在叙事中直指死亡；译作“死后”既保持原义，也自然衔接后继者登位。人名按通行汉语圣经音译作“户珊”。
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: 接替他作王
  rationale: 准确表达מלך与תחתיו所指的继位关系，比逐字译作“在他以下作王”更符合现代汉语。
- source_word: הֲדַד בֶּן בְּדַד
  choice: 比达的儿子哈达
  rationale: 保留בן所表达的父子关系，并采用通行人名音译。
- source_word: הַמַּכֶּה אֶת־מִדְיָן
  choice: 曾……攻打米甸人
  rationale: 分词指出哈达的一项著名行动。“攻打”自然表达נכה的军事语境，又不像“击败”那样明确加入原词未必单独断定的战果。
- source_word: בִּשְׂדֵה מוֹאָב
  choice: 在摩押境内
  rationale: שדה可指田野、乡野或一地的地域；此处军事地理语境译作“境内”清楚自然，同时保留事件发生于摩押地域的含义。
- source_word: וְשֵׁם עִירוֹ
  choice: 他的城名叫
  rationale: 以自然现代汉语再现希伯来文常见的命名句式；“他的城”不额外判定是首都还是出生地。
- source_word: עיות
  choice: 亚未得
  rationale: 采用该地名在汉语圣经传统中的通行音译，并以脚注提示辅音文本可能产生的另一种音译。
