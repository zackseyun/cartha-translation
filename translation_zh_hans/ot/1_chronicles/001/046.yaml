- from: 户珊死后，比达的儿子哈达接替他作王；哈达曾在摩押境内攻打米甸人。他的城名叫亚未得[a]。
  to: 户珊死后，比达的儿子哈达接替他作王；他曾在摩押地攻打米甸人。他的城名叫亚未得[a]。
  rationale: 以“摩押地”避免把原文可指田野或乡野地区的词限定为行政“境内”。保留“攻打”以免“击败／杀败”额外断定战果。更正脚注中替代拼写Aioth的中文音译；其余句意、继位关系和通行译名维持不变。
