  source_fidelity: 正文基本忠实。惟“摩押境内”将שָׂדֶה（田野、乡野、地域）较明确地行政化为“境内”；改为“摩押地”可保留其地域含义而避免过度限定。
  naturalness: 行文庄重通顺。“户珊死后……接替他作王”自然；将哈达的事迹保留为关系性说明，能更贴近原文分词的修饰功能。
  terminology: 人名“户珊、比达、哈达、米甸、亚未得”均符合通行汉语圣经译名。脚注所列英语替代拼写Aioth不宜音译为“亚约特”；改作“艾约特”较能反映该拼写。
