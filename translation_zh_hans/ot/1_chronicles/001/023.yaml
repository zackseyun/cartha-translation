  yaml_path: translation/ot/1_chronicles/001/023.yaml
  text: and Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: zh_hans
  text: 还有俄斐、哈腓拉和约巴。这些都是约坍的儿子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“约坍的后裔”。希伯来文直译为“约坍的儿子”，但在家谱语境中，“儿子”有时可泛指后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: 还有／和
  rationale: אֵת是宾语标记，在中文中无需另译；前缀וְ承接上文的家谱名单，句首译作“还有”，末项前译作“和”，符合现代中文列举习惯。
- source_word: אוֹפִיר
  choice: 俄斐
  rationale: 专名采用现代中文圣经中较通行的音译；本节将其作为家谱中的人名，不额外引入该名可能关联的地域或黄金意象。
- source_word: חֲוִילָה
  choice: 哈腓拉
  rationale: 专名采用较通行的中文圣经音译。
- source_word: יוֹבָב
  choice: 约巴
  rationale: 专名采用较通行的中文圣经音译。
- source_word: כָּל אֵלֶּה
  choice: 这些都是
  rationale: 这是对前述名单的总括；“这些都是”自然清楚，也保留了指示和全称意味。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 希伯来文是阳性复数构造形式，直译为“儿子”；家谱语境中也可能泛指后裔，因此在脚注保留这一词义范围。
- source_word: יָקְטָן
  choice: 约坍
  rationale: 采用现代中文圣经中较通行的专名音译。
theological_decisions:
- issue: בְּנֵי在家谱中的范围
  choice: 正文译作“儿子”
  alternative: “后裔”
  rationale: 正文保留希伯来文明确的亲属称谓及其男性复数形式，同时用脚注说明家谱公式可能具有更宽泛的世系含义，避免替原文消解歧义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以“还有”承接上一节未完的名单，并保留家谱总结句的简明结构。脚注标记置于其实际说明的“儿子”之后。
