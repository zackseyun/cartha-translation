base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/009.yaml
  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
translation:
  language: zh_hans
  text: 古实的儿子是西巴、哈腓拉、撒弗他、拉玛[a]和撒弗提迦。拉玛的儿子是示巴和底但。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“拉玛”（רַעְמָא）与圣经中另一个也常译作“拉玛”的名称（רָמָה）在希伯来文中并不相同。
    reason: 避免中文音译相同造成专名混淆。
lexical_decisions:
- source_word: וּבְנֵי כוּשׁ
  choice: 古实的儿子
  rationale: בְנֵי 是“儿子”的复数构造形式；本节列出直接的家谱分支，译作“儿子”比泛化为“后代”更贴近原文。句首连接词 וּ 在中文中不必机械译出。
- source_word: סְבָא
  choice: 西巴
  rationale: 按现代中文圣经中较通行的专名音译处理，并与本节后面的 שְׁבָא（示巴）加以区分。
- source_word: חֲוִילָה
  choice: 哈腓拉
  rationale: 采用中文圣经中通行的专名音译。
- source_word: סַבְתָּא
  choice: 撒弗他
  rationale: 采用中文圣经中较熟悉的音译，保留其专名性质，不另作含义解释。
- source_word: רַעְמָא
  choice: 拉玛
  rationale: 采用中文圣经传统音译；此名在本节出现两次，前后一致。
- source_word: סַבְתְּכָא
  choice: 撒弗提迦
  rationale: 采用中文圣经中通行的音译，尽量对应希伯来语名称的音节结构。
- source_word: וּבְנֵי רַעְמָא
  choice: 拉玛的儿子
  rationale: 这是家谱中的下一层分支。中文另起一句即可自然表达希伯来语连接词 וּ 的推进作用，无须加“而”。
- source_word: שְׁבָא
  choice: 示巴
  rationale: 采用通行音译，并与本节的 סְבָא（西巴）保持区分。
- source_word: דְדָן
  choice: 底但
  rationale: 采用中文圣经中通行的专名音译，不扩展为族群或后裔。
