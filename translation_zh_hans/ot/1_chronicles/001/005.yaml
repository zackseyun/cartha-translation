  yaml_path: translation/ot/1_chronicles/001/005.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: zh_hans
  text: 雅弗的儿子是：歌篾[a]、玛各、玛代、雅完、土巴、米设和提拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“儿子”在家谱中既可指亲生儿子，也可泛指后裔；这里用来引出雅弗这一系的名单。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 该词是בֵּן的复数附属形，在此引出家谱名单。译作“儿子”既贴近原文，也符合现代中文家谱叙述；此词在家谱语境中有时也可泛指后裔，故以脚注说明。
- source_word: יֶפֶת
  choice: 雅弗
  rationale: 专有名词，采用现代中文圣经中通行且易辨识的音译。
- source_word: גֹּמֶר
  choice: 歌篾
  rationale: 家谱中的专有名词，采用通行中文音译，不按可能关联的族群或地名意译。
- source_word: מָגוֹג
  choice: 玛各
  rationale: 专有名词，采用通行中文音译。
- source_word: מָדַי
  choice: 玛代
  rationale: 此处作为家谱人名，保留音译，不在正文中解释为相关民族。
- source_word: יָוָן
  choice: 雅完
  rationale: 此处作为家谱人名，采用通行中文音译；不因其与爱奥尼亚或希腊的关联而在正文中作民族化翻译。
- source_word: תֻבָל
  choice: 土巴
  rationale: 专有名词，采用通行中文音译。
- source_word: מֶשֶׁךְ
  choice: 米设
  rationale: 专有名词，采用通行中文音译。
- source_word: תִירָס
  choice: 提拉
  rationale: 专有名词，采用通行中文音译。
- source_word: וְ / וּ
  choice: 顿号列举，末项前用“和”
  rationale: 希伯来文在多数名单项目之前使用连接词；现代中文以顿号分隔，并在末项前用“和”，自然地保留列举关系，避免生硬重复。
