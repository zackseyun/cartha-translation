base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/019.yaml
  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
translation:
  language: zh_hans
  text: 希伯生了两个儿子：一个名叫法勒[a]，因为在他那个时代，地被分开了；他的兄弟名叫约坍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地”也可译作“大地”或“土地”。希伯来文没有说明这次分开的性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר יֻלַּד שְׁנֵי בָנִים
  choice: 希伯生了两个儿子
  rationale: 希伯来文采用被动式，较直译为“有两个儿子为希伯所生”；现代汉语以“希伯生了两个儿子”表达同一亲子关系和生育事件，更自然，也不改变家谱信息。句首连接词在汉语单节经文中可不另译，以免生硬。
- source_word: שֵׁם הָאֶחָד
  choice: 一个名叫
  rationale: 原文是“一个的名字”，用于区分两子，并未明确说“第一个”；译作“一个名叫”既自然，也避免添加次序。
- source_word: פֶּלֶג
  choice: 法勒
  rationale: 采用现代中文圣经读者熟悉的人名音译。此名与同根动词“分开”形成语源关联，正文随后的解释予以保留。
- source_word: כִּי בְיָמָיו
  choice: 因为在他的日子
  rationale: כִּי在此引出起名的缘由；“在他的日子”保留原文所指的时代范围，没有具体化为出生时或一生中的某一事件。
- source_word: נִפְלְגָה הָאָרֶץ
  choice: 地被分开了
  rationale: נִפְלְגָה是“分开、被划分”的被动式；הָאָרֶץ既可指大地，也可指土地、地域。“地”保留其语义宽度，脚注说明可能的理解。
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: 他的兄弟名叫约坍
  rationale: 用自然现代汉语表达原文“他兄弟的名字是约坍”，并明确“他的”指法勒的兄弟。
theological_decisions:
- issue: “地被分开”所指为何
  choice: 保留宽泛表述“地被分开了”，不说明分开的性质
  alternative: 明确译作“全地被分开”“土地被划分”，或直接解释为巴别事件、族群语言分散或地理分裂
  rationale: 原文本身没有界定这次“分开”的对象范围、方式或事件背景。正文不加入特定解释，以保留经文的歧义和诠释张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。人名使用中文圣经传统常见译名“希伯、法勒、约坍”；句式简洁，适合家谱叙述，同时借脚注保留הָאָרֶץ的词义范围。
