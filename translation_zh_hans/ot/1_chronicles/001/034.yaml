  text: וַ/יּ֥וֹלֶד אַבְרָהָ֖ם אֶת יִצְחָ֑ק בְּנֵ֣י יִצְחָ֔ק עֵשָׂ֖ו וְ/יִשְׂרָאֵֽל־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/034.yaml
  text: 'Abraham fathered Isaac[a]. The sons of Isaac: Esau and Israel.'
translation:
  language: zh_hans
  text: 亚伯拉罕生以撒。以撒的儿子是以扫和以色列[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列”就是雅各。
    reason: 说明原文所用名字与人物身份的关系，避免读者误以为这里另指一人。
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 使役形在家谱语境中表示生育后代；现代汉语用“生了”简洁自然，也清楚表达亚伯拉罕是以撒之父。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在汉语中无须另译，其语法功能已由“生了以撒”的语序体现。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 该词是“儿子”的复数构造形式，引出以撒的后代名单；译为“以撒的儿子是……”符合现代汉语家谱表述。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用该人名通行的中文译名。
- source_word: וְיִשְׂרָאֵל
  choice: 和以色列
  rationale: 原文明确使用“以色列”这一名字，所指虽是雅各，正文仍保留原文形式，不改作“雅各”。
theological_decisions:
- issue: 家谱中所指为雅各时，יִשְׂרָאֵל应如何译出
  choice: 以色列
  alternative: 雅各
  rationale: 希伯来文本明确写“以扫和以色列”。保留“以色列”忠实呈现原文所用的名字，并用脚注说明其所指，避免在正文中作协调性替换。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语家谱文体。以“生了”对应家谱中的生育表达；保留“以色列”而不在正文中改为“雅各”。
