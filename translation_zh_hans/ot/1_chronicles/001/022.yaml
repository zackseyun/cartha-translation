lexical_decisions:
- source_word: וְ/אֶת
  choice: 以列举标点及“和”表达
  rationale: וְ与直接宾语标记אֶת在谱系中逐项引出名字；现代汉语不逐一译出宾语标记，而以顿号和末项前的“和”自然表达并列关系。
- source_word: עֵיבָל
  choice: 以巴
  rationale: 按本节希伯来文形式音译，并采用现代中文圣经人名中通行的译法；创世记10:28的平行谱系作“俄巴”，故以脚注保留差异。
- source_word: אֲבִימָאֵל
  choice: 亚比玛利
  rationale: 按希伯来文专名音译，并采用现代中文圣经中较通行且易辨认的形式。
- source_word: שְׁבָא
  choice: 示巴
  rationale: 按希伯来文שְׁבָא音译，并采用现代中文圣经的通行译名；不与另一个拼写相近的名字“西巴”混同。
