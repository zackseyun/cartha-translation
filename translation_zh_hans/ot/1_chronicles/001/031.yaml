  yaml_path: translation/ot/1_chronicles/001/031.yaml
  text: Jetur[a], Naphish, and Kedemah. These were the sons of Ishmael.
translation:
  language: zh_hans
  text: 伊突、拿非施和基底玛。这些人是以实玛利的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְטוּר
  choice: 伊突
  rationale: 专名按现代中文圣经中较通行的形式音译；不赋予词义解释。
- source_word: נָפִישׁ
  choice: 拿非施
  rationale: 专名按希伯来语辅音与传统中文译名音译。
- source_word: וָ/קֵדְמָה
  choice: 和基底玛
  rationale: 连接词 ו 译为“和”；专名 קֵדְמָה 采用现代中文圣经中通行的音译“基底玛”。
- source_word: אֵלֶּה הֵם
  choice: 这些人是
  rationale: 这是指认性名词句；补出“人”使现代汉语自然清楚，而“是”保留希伯来语的概括指认功能。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 本节承接以实玛利众子的男性名单，故采用具体的“儿子”，不泛化为“子孙”或“儿女”。
- source_word: יִשְׁמָעֵאל
  choice: 以实玛利
  rationale: 采用现代中文圣经中通行的专名音译。
