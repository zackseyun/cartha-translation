  yaml_path: translation/ot/1_chronicles/027/010.yaml
  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
translation:
  language: zh_hans
  text: 第七位负责第七月的军队统领是以法莲子孙中的比伦人[a]希利斯；他所统领的队伍有二万四千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“法勒人”；反映对希利斯所属氏族的另一传统认定。
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׁבִיעִי
  choice: 第七队
  rationale: 原文仅作“第七”，在本章军队按月轮值的名册语境中省略了所指对象。译作“第七队”以自然中文补足语意，同时保留名册结构。
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: 负责第七月的
  rationale: 介词ל在本章表示按月份分派值勤；此译明确其月度职责，又不增添具体服役方式。
- source_word: חֶלֶץ
  choice: 希利斯
  rationale: 人名按现代中文圣经常用音译处理。
- source_word: הַפְּלוֹנִי
  choice: 比伦人
  rationale: 按本节马所拉文本的辅音与读音所示，将该族属称谓译为“比伦人”；另有传统认定为“法勒人”，故以脚注保留。
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: 以法莲子孙中的
  rationale: 贴近希伯来语“从以法莲的众子中”，保留支派谱系表达，同时使现代中文通顺。
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: 他所统领的班有
  rationale: מַחֲלֻקָה在本章指军队轮值编制，עַל表示统领关系；“所统领的班”自然传达其权责。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 按原文数值译出，并补“人”以符合中文计数习惯；此处名册语境明确所数的是人员。
