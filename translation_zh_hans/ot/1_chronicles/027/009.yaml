  text: 'The sixth, for the sixth month: Ira son of Ikkesh the Tekoite; and over his division were twenty-four thousand.'
translation:
  language: zh_hans
  text: 第六位、负责第六个月的是提哥亚人益吉的儿子以拉；他所统领的班次有二万四千人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: 第六位
  rationale: 序数词在名册公式中省略了所指的职分；译作“第六位”保留原文的简略表达，也不擅自补出“统领”或“班次”。
- source_word: לַחֹדֶשׁ הַשִּׁשִּׁי
  choice: 负责六月的
  rationale: 介词ל在本章轮值编制的语境中表示当月的任职安排；“负责六月的”比直译“给第六月”更符合现代汉语。
- source_word: עִירָא
  choice: 以拉
  rationale: 按中文圣经人名的通行音译处理该专名。
- source_word: בֶן עִקֵּשׁ
  choice: 益吉的儿子
  rationale: 直接表达希伯来语父子关系结构。
- source_word: הַתְּקוֹעִי
  choice: 提哥亚人
  rationale: 该族称形容词表示来自提哥亚的人；译作“提哥亚人”简洁自然。
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: 他所统领的班次有
  rationale: מַחֲלֻקָה在本章指按月轮值的军事编制；עַל表示管理或统领关系。译文以自然汉语表达其麾下编制的人数。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 按现代汉语数词习惯表达，并根据名册语境补出量词“人”。
