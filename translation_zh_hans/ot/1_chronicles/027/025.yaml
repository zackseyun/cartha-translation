base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/025.yaml
  text: Over the king’s treasuries was Azmaveth son of Adiel[a], and over the treasuries in the countryside, in the cities, in the villages, and in the towers[b], was Jehonathan son of Uzziah.
translation:
  language: zh_hans
  text: 掌管王的各库房的是亚叠的儿子押斯玛威；掌管乡野[a]、城邑、村庄和塔楼中的各库房的是乌西雅的儿子耶何拿单[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“田野”。希伯来文在这里是单数，但很可能具有集合意义，泛指与城邑、村庄和塔楼相区别的乡间地区。
    reason: lexical_alternative
  - marker: b
    text: 原文在这里使用这个名字较完整的希伯来形式；有些译本按其较短形式译作“约拿单”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 掌管……的是
  rationale: עַל在这份行政职务名单中表示负责、监管；译为“掌管……的是”既清楚自然，也保留原文列举官员职责的句式。
- source_word: אֹצְרוֹת / הָאֹצָרוֹת
  choice: 库房 / 各处库房
  rationale: אֹצָר可指财库、仓库或其中的储藏物。此处谈王室及各地储藏设施的管理，译作“库房”较为宽泛，也适合两处语境；第二处加“各处”体现复数及分布性。
- source_word: הַמֶּלֶךְ
  choice: 王的
  rationale: 直译所属关系，现代汉语自然明白，不额外限定为某一特定类型的“王室”机构。
- source_word: עַזְמָוֶת
  choice: 押斯玛威
  rationale: 采用中文圣经传统中较为通行的音译形式。
- source_word: בֶּן עֲדִיאֵל
  choice: 亚叠的儿子
  rationale: 按希伯来文亲子身份说明直接翻译，并采用通行中文音译。
- source_word: בַּשָּׂדֶה
  choice: 乡野
  rationale: 原文为单数“田地／田野”，但在与城邑、村庄、塔楼并列时很可能具有集合意义，泛指城外乡间；“乡野”在现代汉语中简洁地表达这一地域范围。
- source_word: בֶּעָרִים
  choice: 城邑
  rationale: 表示库房所在的城市或城镇；“城邑”适合历代志行政名单的庄重文体，又仍为现代读者所理解。
- source_word: וּבַכְּפָרִים
  choice: 村庄
  rationale: כְּפָרִים指乡村聚落，“村庄”准确、自然。
- source_word: וּבַמִּגְדָּלוֹת
  choice: 塔楼
  rationale: 原词只明确表示“塔”，没有说明是瞭望塔或防御塔，因此不在正文中增加其具体用途。
- source_word: יְהוֹנָתָן
  choice: 耶何拿单
  rationale: 这里是较完整的希伯来名字形式יְהוֹנָתָן；以“耶何拿单”音译，以区别通常译作“约拿单”的较短形式יוֹנָתָן。
- source_word: בֶּן עֻזִּיָּהוּ
  choice: 乌西雅的儿子
  rationale: 直接表达谱系关系，并采用“乌西雅”这一通行中文译名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的行政名单语体，以“掌管……的是”呈现原文的职责分配结构。人名尽量兼顾中文传统与希伯来文形式差异；地名类别保持并列，未把“塔楼”解释成原文未明说的特定军事设施。
