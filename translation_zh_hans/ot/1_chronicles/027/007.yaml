base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/007.yaml
  text: The fourth[a], for the fourth month, was Asahel the brother of Joab, and Zebadiah his son after him; and over his division were twenty-four thousand.
translation:
  language: zh_hans
  text: 第四位[a]，负责第四月轮值的是约押的兄弟亚撒黑；他的儿子西巴第雅接替了他。他的队共有二万四千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第四队”。希伯来语只说“第四”，可指第四位负责人或第四队。
    reason: 保留原文序数词作名词时所含指代对象的歧义。
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: 第四队
  rationale: 序数词在本章轮班名册中作名词使用；结合后文的“队”，明确补出“队”比单说“第四”更符合现代汉语，同时保留其序列含义。
- source_word: לַחֹדֶשׁ הָרְבִיעִי
  choice: 值第四月
  rationale: 介词 לְ 表示该队被安排在第四个月轮值；“值第四月”简洁呈现行政轮班的语境。
- source_word: עֲשָׂהאֵל
  choice: 亚撒黑
  rationale: 采用现代中文圣经中常见的人名译法。
- source_word: אֲחִי יוֹאָב
  choice: 约押的兄弟
  rationale: 直接对应希伯来语的属格结构，清楚说明亚撒黑与约押的关系。
- source_word: וּזְבַדְיָה בְנוֹ אַחֲרָיו
  choice: 他的儿子西巴第雅接替了他
  rationale: אַחֲרָיו 字面为“在他之后”，在名册语境中表示继任；正文采用自然的现代汉语表达，并以脚注保留字面形式。
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: 亚撒黑的队共有
  rationale: מַחֲלֻקָה 在本章指军队编制或轮值队伍。希伯来语“在他的队之上”按汉语习惯转为“他的队共有”，避免生硬表达；为免“他的”因紧邻西巴第雅而产生指代歧义，明确写作“亚撒黑的队”。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 按现代汉语数词习惯表达，并依据军队名册语境补出量词“人”。
