base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/024.yaml
  text: Joab son of Zeruiah began to count[a], but he did not finish; and because of this wrath came upon Israel[b]. And the number was not entered in the account of the chronicles of King David.
translation:
  language: zh_hans
  text: 洗鲁雅的儿子约押开始数点人数，却没有数完；因这事，烈怒临到以色列。这数目没有记入[a]大卫王的编年史[b]中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列入”“登记”或“记载”。希伯来文直译为“上去”，在这里指记入官方记录。
    reason: lexical_alternative
  - marker: b
    text: “编年史”指与大卫王有关的王室年鉴或官方记录。
    reason: cultural_note
lexical_decisions:
- source_word: הֵחֵל לִמְנוֹת
  choice: 开始数点人数
  rationale: החל与מנה构成“开始计数”的表达；“数点人数”既贴近原文，也自然体现本节人口清点的语境，而不额外加入原文没有明说的制度性术语。
- source_word: וְלֹא כִלָּה
  choice: 却没有数完
  rationale: כלה在此意为“完成、结束”；补出“数”使汉语指向清楚，并以“却”自然表达转折。
- source_word: וַיְהִי בָזֹאת קֶצֶף עַל יִשְׂרָאֵל
  choice: 因这事，有烈怒临到以色列
  rationale: בזאת按语境译为“因这事”；קצף译作“烈怒”，并保留原文未明说发怒者的句法特点。
- source_word: הַמִּסְפָּר
  choice: 这个数目
  rationale: 指前述数点所得的数目；“这个”承接上文，避免误解为再次进行数点。
- source_word: וְלֹא עָלָה
  choice: 也没有列入
  rationale: עלה字面为“上去”，在官方名册或记录的语境中可指“列入、登记”；“列入”与后面的编年史搭配自然。
- source_word: בְּמִסְפַּר דִּבְרֵי הַיָּמִים
  choice: 编年史中
  rationale: דברי הימים是“编年记录、史册”的固定表达；前面的מספר在此涉及记录或账目，汉语以“列入……中”整体传达，避免生硬重复“数目”。
- source_word: לַמֶּלֶךְ דָּוִיד
  choice: 大卫王的
  rationale: 此处ל表示归属或关联；译作“大卫王的”最符合汉语中修饰“编年史”的习惯。
theological_decisions:
- issue: 是否明确指出烈怒来自上帝
  choice: 保留施怒者未明说的表达：“有烈怒临到以色列”
  alternative: “耶和华向以色列发怒”或“上帝的烈怒临到以色列”
  rationale: 上下文强烈暗示这是上帝的烈怒，但本节希伯来文本没有明说施怒者；不补出主语可保存原文的含蓄与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“数点人数”保留原文的计数动作；“有烈怒临到”刻意不补出施怒者。脚注标记分别紧跟其实际解释的词语，纠正咨询层中标记位置与脚注内容错配的问题。
