- from: 第十队，在第十月值班：尼陀法人玛哈莱，属谢拉宗族；他所统领的班次有二万四千人。
  to: 第十位负责第十月的是尼陀法人玛哈莱，是谢拉人[a]；他所统领的班次有二万四千人。
  rationale: 将首句改为按月轮值名册中“第十位负责第十月的是”的结构，避免把统领的序位译成部队编号。保留“班次”对应其所辖分队，并将谢拉族称的氏族性解释置于脚注，不强加单一理解。
