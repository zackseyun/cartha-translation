    issue: “第十队”误译原文的序数词。
    rationale: הָעֲשִׂירִי在此承接上下文的轮值统领名册，意为“第十位〔统领〕”，不是其所率领的“第十队”。后半节的מַחֲלֻקָה才是该统领所辖的班次/分队。
  - severity: low
    issue: 未保留“谢拉人／属谢拉宗族”的可选表达。
    rationale: לַזַּרְחִי为单数族称，可自然译为“谢拉人”，也可按氏族关系理解为“属谢拉宗族”。英文审校记录已有相应替代译法，宜以脚注保留。
  revised_text: 第十位负责第十月的是尼陀法人玛哈莱，是谢拉人[a]；他所统领的班次有二万四千人。
