base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/013.yaml
  text: 'The tenth[a], for the tenth month: Mahrai the Netophathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: zh_hans
  text: 第十位负责第十月的是尼陀法人玛哈莱，是谢拉人[a]；他所统领的班次有二万四千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“属谢拉宗族”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: 第十队
  rationale: 序数词在名册中作名词使用；结合本章按月轮值的军队编制，补出“队”可使现代汉语清楚自然。
- source_word: לַחֹדֶשׁ הָעֲשִׂירִי
  choice: 在第十月值班
  rationale: 介词ל在本章表示按月轮值的安排；补出“值班”传达语境中隐含的服役含义。
- source_word: מַהְרַי
  choice: 玛哈莱
  rationale: 按希伯来语人名音译，兼顾普通话读音与常见圣经译名形式。
- source_word: הַנְּטוֹפָתִי
  choice: 尼陀法人
  rationale: 该族称形容词表示来自尼陀法，译作“尼陀法人”简洁明确。
- source_word: לַזַּרְחִי
  choice: 属谢拉宗族
  rationale: 该形式可表示谢拉后裔或谢拉宗族的归属；“属谢拉宗族”自然地表达其氏族关系。
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: 他所统领的班次有
  rationale: מַחֲלֻקָה在本章指轮值的军队班次；על表明玛哈莱在其上统领，译文将这一关系明说。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 按现代汉语数字表达，并补出名册语境中计数的人员单位“人”。
