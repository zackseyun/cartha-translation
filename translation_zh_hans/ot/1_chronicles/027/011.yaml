base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/011.yaml
  text: 'The eighth[a], for the eighth month: Sibbecai the Hushathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: zh_hans
  text: 负责第八月的第八位统领是户沙人西比该，属谢拉族[a]；他所统领的班有二万四千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“属谢拉人”。希伯来语此处为带介词的单数族称形式；按语境，很可能指谢拉宗族的归属。
    reason: 保留לַזַּרְחִי在形式上可理解为单数“谢拉人”、在语境中又可指谢拉宗族归属的歧义。
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: 第八班
  rationale: 序数词在军队班次名册中作省略表达。中文补出“班”，使所指清楚，同时不增添“统领”等原文此处未明说的职衔。
- source_word: לַחֹדֶשׁ הַשְּׁמִינִי
  choice: 负责第八月
  rationale: 介词ל在本章的行政编制语境中表示该班被安排在某月当值；“负责第八月”简洁自然，并与名册格式相称。
- source_word: סִבְּכַי
  choice: 西比该
  rationale: 采用现代中文圣经中较通行的希伯来人名音译。
- source_word: הַחֻשָׁתִי
  choice: 户沙人
  rationale: 该族称或地域称表明西比该与户沙的关联；译作“户沙人”符合现代汉语族地称谓习惯。
- source_word: לַזַּרְחִי
  choice: 属谢拉族
  rationale: 此处带ל的单数族称在名册语境中很可能表示宗族归属；“属谢拉族”清楚表达这种关联，同时用脚注保留较贴近形式的另一理解。
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: 他所统领的班有
  rationale: 原文直译近于“在他的班之上”，随后列出人数。中文以“他所统领的班有”自然表达其管辖关系和该班人数。
- source_word: מַחֲלֻקְתּוֹ
  choice: 班
  rationale: מַחֲלֻקָה在本章指按月轮值的军事编制。“班”既能呼应轮值制度，也避免“连、营”等过度具体的现代军制含义。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 按现代汉语数字习惯表达人数；“人”由上下文自然补出。
