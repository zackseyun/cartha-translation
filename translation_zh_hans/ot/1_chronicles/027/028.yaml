base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/028.yaml
  text: Over the olive trees and the sycamore trees in the Shephelah was Baal-hanan the Gederite[b][a]; and over the stores of oil was Joash.
translation:
  language: zh_hans
  text: 管理示非拉地区[a]的橄榄树和桑叶无花果树[b]的是基第利人巴力·哈南；管理油库的是约阿施。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示非拉”也可译作“低地”，指犹大山区与沿海平原之间的丘陵地带。
    reason: cultural_note
  - marker: b
    text: “桑叶无花果树”也常译作“桑树”或“埃及无花果树”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 管理……的是
  rationale: 本节属于官员职掌名录，עַל表示对某项产业或储备负有管理职责；采用现代汉语的职掌句式，比直译“在……之上”自然准确。
- source_word: הַזֵּיתִים
  choice: 橄榄树
  rationale: 在土地和农产管理的语境中，复数名词指橄榄树木，而非单指橄榄果实。
- source_word: וְהַשִּׁקְמִים
  choice: 桑叶无花果树
  rationale: שִׁקְמִים指Ficus sycomorus，即结无花果状果实的树种，并非现代汉语通常所说的悬铃木；“桑叶无花果树”较准确地标明树种，同时在脚注保留常见译名。
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: 示非拉地区
  rationale: שְׁפֵלָה在此很可能是犹大丘陵与沿海平原之间特定区域的名称，因此音译作“示非拉”，并以“地区”帮助现代读者理解；“低地”的字面译法列入脚注。
- source_word: בַּעַל חָנָן
  choice: 巴力·哈南
  rationale: 按希伯来语人名音译，并用间隔号清楚呈现复合人名。
- source_word: הַגְּדֵרִי
  choice: 基第利人
  rationale: 该词是表示地域归属的称谓，译为“基第利人”既保留专名，也符合现代汉语表达。
- source_word: אֹצְרוֹת הַשֶּׁמֶן
  choice: 油库
  rationale: 该组合可指存放油的库房或储存设施；“油库”简洁地表达行政管理对象，而不武断限定为油本身的储量。
- source_word: יוֹעָשׁ
  choice: 约阿施
  rationale: 采用现代中文圣经语境中通行的人名译法。
theological_decisions: []
