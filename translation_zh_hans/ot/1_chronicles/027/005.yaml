base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/005.yaml
  text: The commander of the third division for the third month was Benaiah son of Jehoiada the chief[a], and in his division were twenty-four thousand.
translation:
  language: zh_hans
  text: 第三月的第三个军班的军长，是祭司耶何耶大的儿子比拿雅；比拿雅是首领[a]。他的军班有二万四千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文中“祭司”和“首领”的修饰关系不完全明确。也可理解为：比拿雅是祭司兼首领；或耶何耶大是祭司兼首领。
    reason: 保留 הַכֹּהֵן רֹאשׁ 在紧凑人名结构中的句法歧义。
lexical_decisions:
- source_word: שַׂר הַצָּבָא
  choice: 军长
  rationale: שַׂר 表示主管或统帅，与“军队”连用时指军事长官；“军长”在此简洁地表达每月轮值军班的统领。
- source_word: הַשְּׁלִישִׁי לַחֹדֶשׁ הַשְּׁלִישִׁי
  choice: 第三月第三班
  rationale: 第一个“第三”在本章的重复结构中指第三个轮值军班，第二个“第三”修饰月份；中文补出“班”以显明希伯来文省略的所指。
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 依通行圣经专名译法音译，并保留希伯来文的父子关系。
- source_word: הַכֹּהֵן רֹאשׁ
  choice: 祭司耶何耶大……他是首领
  rationale: 主译文将“祭司”与耶何耶大相连，将“首领”述说比拿雅，符合上下文中耶何耶大的祭司身份，也使句法自然；原文的紧凑结构仍有其他断句可能，故以脚注保留。
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: 他的班有
  rationale: מַחֲלֻקָה 在本章指按月轮值的军班；本句套语旨在说明该班人数，译为“他的班有”自然清楚。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 准确表达基数，并补出中文计数军士所需的“人”。
theological_decisions:
- issue: “祭司”和“首领”分别指谁
  choice: 主译文把“祭司”理解为耶何耶大的身份，把“首领”理解为比拿雅的职分。
  alternative: 也可断作“耶何耶大的儿子比拿雅祭司，他是首领”，使“祭司”和“首领”都指比拿雅；或把“首领”也与耶何耶大相连。
  rationale: 希伯来文没有现代标点，הַכֹּהֵן רֹאשׁ 紧接在人名父名之后，句法关系并非全然明确。主译依据历代志上12:27所呈现的耶何耶大与亚伦家之关系作出较可能的理解，但不应消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“军长”“军班”符合本章按月轮值的军事编制语境；主句以分号拆开身份说明，避免中文修饰链过长。
