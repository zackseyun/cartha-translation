  text: for Zebulun, Ishmaiah son of Obadiah; for Naphtali, Jerimoth son of Azriel.
translation:
  language: zh_hans
  text: 西布伦支派的首领是俄巴底雅的儿子伊施玛雅；拿弗他利支派的首领是亚斯列的儿子耶利摩。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִזְבוּלֻן
  choice: 西布伦支派的首领是
  rationale: 前缀 ל 在本段行政名册中标明所负责或代表的支派；结合27:16的句首“管理以色列各支派的如下”，补出“支派的首领是”，使独立成节的中文清楚自然。
- source_word: יִשְׁמַעְיָהוּ
  choice: 伊施玛雅
  rationale: 按现代中文圣经人名的常见译写音译该希伯来人名。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 准确表达希伯来语亲子身份公式，同时符合现代汉语人名结构。
- source_word: עֹבַדְיָהוּ
  choice: 俄巴底雅
  rationale: 采用现代中文圣经中通行的人名译写。
- source_word: לְנַפְתָּלִי
  choice: 拿弗他利支派的首领是
  rationale: 与本节前半平行；ל 标明该官员所属或负责的支派，补出语境中省略的“首领”。
- source_word: יְרִימוֹת
  choice: 耶利摩
  rationale: 采用现代中文圣经中常见的音译形式。
- source_word: עַזְרִיאֵל
  choice: 亚斯列
  rationale: 采用现代中文圣经中常见的音译形式。
