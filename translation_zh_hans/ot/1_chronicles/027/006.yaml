base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/006.yaml
  text: This was Benaiah[a], a mighty man of the Thirty and over the Thirty; and his division was under Ammizabad his son.
translation:
  language: zh_hans
  text: 他就是比拿雅，是“三十勇士”中的一位猛将，又统领这三十人；他的部队由他儿子亚米萨拔负责。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא
  choice: 他就是
  rationale: 该代词带有重提和强调作用，承接上一节所提到的比拿雅；“他就是”在现代汉语中自然地保留了这种指认语气。
- source_word: גִּבּוֹר
  choice: 猛将
  rationale: 此词在本段军事语境中指英勇善战的人；“猛将”比泛指能力强的“勇士”更明确地传达军事含义，同时保持简洁庄重。
- source_word: הַשְּׁלֹשִׁים
  choice: “三十勇士”
  rationale: 这里并非单纯的数字，而是指大卫麾下一个为人熟知的精锐勇士群体；加引号可帮助现代读者识别其为特定称号，又不在正文中加入原文没有的解释。
- source_word: וְעַל הַשְּׁלֹשִׁים
  choice: 又统领这三十人
  rationale: 介词 עַל 在这里表达对该群体的权柄或领导地位；汉语需补出“统领”才能自然清楚地传达原意。
- source_word: מַחֲלֻקְתּוֹ
  choice: 他的班
  rationale: 本章所述为按月轮值的军事编制。“班”能自然表达轮班服役的队伍，并与本章行政军事背景相符。
- source_word: עַמִּיזָבָד בְּנוֹ
  choice: 由他儿子亚米萨拔负责
  rationale: 希伯来文末句省略了谓语，按上下文表示其儿子亚米萨拔负责该班；汉语补出“由……负责”可使句意完整而不过度限定其正式官衔。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“三十勇士”作为特定精锐群体名称加引号；末句按希伯来文省略结构，以最少量的汉语补足表达其子负责该班。
