  yaml_path: translation/ot/1_chronicles/027/008.yaml
  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
translation:
  language: zh_hans
  text: 第五班负责五月的值勤，统领是伊斯拉人[a]沙母户；他所辖的班共有二万四千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊斯拉人”或译“谢拉人”；有些译本按传统如此翻译这里的希伯来族称。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: 第五班
  rationale: 序数词在本章军队轮班名册中作名词使用，所指是按月值勤的第五班；补出“班”符合汉语表达，也由上下文明确支持。
- source_word: לַחֹדֶשׁ הַחֲמִישִׁי
  choice: 负责第五月
  rationale: 介词ל在本章语境中表示该班被安排在相应月份值勤；“负责第五月”简洁地传达这种行政安排。
- source_word: הַשַּׂר
  choice: 统领
  rationale: שַׂר指领袖或官长；在军队名册中译作“统领”，既体现军事领导职分，又庄重自然。
- source_word: שַׁמְהוּת
  choice: 沙母户
  rationale: 按马所拉文本的读音音译这一人名，并采用便于现代普通话读者辨认的汉字。
- source_word: הַיִּזְרָח
  choice: 伊斯拉人
  rationale: 按本节马所拉文本的辅音和元音读作族称“伊斯拉人”；另有按传统译作“谢拉人”的处理，列入脚注而不在正文中强行协调。
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: 他所辖的班共有
  rationale: מַחֲלֻקָה在本章指军队的轮值班次或编制；עַל带有管辖关系。“他所辖的班共有”以自然汉语表达原文的行政结构。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 按现代汉语数字习惯表达原文“二十又四千”，并依军队语境补出量词“人”。
theological_decisions: []
