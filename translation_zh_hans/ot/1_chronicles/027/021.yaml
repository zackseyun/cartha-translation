  yaml_path: translation/ot/1_chronicles/027/021.yaml
  text: 'for the half-tribe of Manasseh in Gilead: Iddo son of Zechariah[a]; for Benjamin: Jaasiel son of Abner.'
translation:
  language: zh_hans
  text: 基列境内的玛拿西半支派：撒迦利亚的儿子易多；便雅悯支派：押尼珥的儿子雅西业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有译本将“雅西业”译作“雅施业”。
    reason: 保留该专名在译本传统中的另一种音译；马所拉文本本身在此没有相应的人名异文。
lexical_decisions:
- source_word: לַ/חֲצִי הַֽ/מְנַשֶּׁה
  choice: 玛拿西半支派
  rationale: 此处是行政首领名单，指玛拿西支派的一半；汉语补出“支派”，可避免误解为抽象的“一半”。
- source_word: גִּלְעָדָ/ה
  choice: 基列境内的
  rationale: 结合名单语境，此形式标明该半支派所在的约旦河东基列地区；译为“基列境内的”自然且明确。
- source_word: יִדּוֹ
  choice: 易多
  rationale: 按希伯来语专名音译，并采用中文圣经人名的常见译法。
- source_word: בֶּן זְכַרְיָהוּ
  choice: 撒迦利亚的儿子
  rationale: בֶּן 是标准父子谱系表达；父名采用中文传统通行译名。
- source_word: לְ/בִנְיָמִן
  choice: 便雅悯支派
  rationale: 介词 לְ 在此标明该首领所代表的群体；补出“支派”符合汉语列表表达，并与前半句协调。
- source_word: יַעֲשִׂיאֵל
  choice: 雅西业
  rationale: 依据马所拉文本的辅音和元音音译；英文传统中的拼写差异不构成希伯来文本异文。
- source_word: בֶּן אַבְנֵר
  choice: 押尼珥的儿子
  rationale: 采用标准谱系表达和中文传统通行人名译法。
