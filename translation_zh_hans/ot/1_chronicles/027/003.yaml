  text: From the sons of Perez[b][a], the chief over all the commanders of the divisions for the first month.
translation:
  language: zh_hans
  text: 他出自法勒斯的子孙[a]，是正月轮值的全体军队将领的首领[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“法勒斯的儿子们”。这是宗谱用语，也可指法勒斯更广泛的后裔。
    reason: lexical_alternative
  - marker: b
    text: 或译“正月各军队的将领之首”。希伯来语可指“军队”或“军旅”；在本章中，这些军事人员按月轮值、编组。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: 出自
  rationale: 此介词在这里表示宗族来源；“出自”自然地表达他属于法勒斯的后裔。
- source_word: בְּנֵי פֶרֶץ
  choice: 法勒斯的子孙
  rationale: 希伯来语直译为“法勒斯的儿子们”，但在宗谱和宗族语境中通常泛指后裔；“子孙”既保留宗族表达，也避免误解为法勒斯的亲生儿子。
- source_word: הָרֹאשׁ
  choice: 首领
  rationale: רֹאשׁ 在此指居首并掌权的人；“首领”符合军事行政语境，且是自然庄重的现代汉语。
- source_word: לְכָל
  choice: 所有……的
  rationale: 此处介词短语说明其统辖范围；汉语以“所有军队长官的首领”自然表达他在众长官之上。
- source_word: שָׂרֵי הַצְּבָאוֹת
  choice: 军队长官
  rationale: צְבָאוֹת 可指军队或军旅；结合本章按月轮值的编制，也可理解为各队。“军队长官”保留词语本身较宽的军事含义，不在正文中过度限定。
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: 正月
  rationale: 该短语指一年中的第一个月，并与本章按月轮值的制度相连；“正月”是简洁自然的汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“他”承接上一节所述人物，使原文依赖上文的名词短语在中文中成为完整句子；正文保留“军队”的较宽含义，并以脚注说明本章中“各队”的语境性理解。
