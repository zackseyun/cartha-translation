  text: And Ahithophel was counselor to the king[a], and Hushai the Archite was the king’s friend.
translation:
  language: zh_hans
  text: 亚希多弗作王的谋士；亚基人户筛作王的朋友。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“同伴”或“亲信”；这个希伯来词可指一般的朋友，在王室语境中也可能指受王信任的宫廷同伴。
    reason: 保留רֵעַ的一般人际含义与可能的宫廷职衔色彩，避免正文把其含义限定得过窄。
lexical_decisions:
- source_word: אֲחִיתֹפֶל
  choice: 亚希多弗
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: יוֹעֵץ לַמֶּלֶךְ
  choice: 作王的谋士
  rationale: יוֹעֵץ指提供谋略或意见的人；结合王室语境，“谋士”自然、庄重，也保留其职务色彩。介词ל所表达的服务或隶属关系以“作王的”自然呈现。
- source_word: חוּשַׁי
  choice: 户筛
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: הָאַרְכִּי
  choice: 亚基人
  rationale: 这是表明族属或地域关联的称谓；译作“亚基人”既符合希伯来语形式，也沿用中文传统译名。
- source_word: רֵעַ הַמֶּלֶךְ
  choice: 王的朋友
  rationale: רֵעַ的基本义为朋友、同伴或伙伴；此处虽处于宫廷职官名单中，可能带有受信任的王室亲信之意，但正文采用不作过度限定的“朋友”，并以脚注保留其他可能。
- source_word: וַ / וְ
  choice: ；
  rationale: 两个并列分句在中文中用分号连接，清楚呈现名单式并列关系，无须机械重复“和”。
