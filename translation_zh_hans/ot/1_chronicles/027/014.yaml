  yaml_path: translation/ot/1_chronicles/027/014.yaml
  text: For the twelfth month[a], Benaiah the Pirathonite, from the sons of Ephraim; and over his division were twenty-four thousand.
translation:
  language: zh_hans
  text: 第十一月[a]，由比拉顿人比拿雅负责；他出自以法莲支派。他的队伍有二万四千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在此重复“十一”的序数结构，意为第十一班负责第十一月；不是“第十二月”。
    reason: 说明原文重复的序数结构，并澄清英文审校记录与希伯来文本不符的“第十二月”误读。
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  choice: 第十一月
  rationale: 希伯来语עַשְׁתֵּי עָשָׂר是“十一”，并以重复结构标明第十一班及其负责的第十一月；正文按本章轮班名册的语境自然表达。
- source_word: בְּנָיָה
  choice: 比拿雅
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הַפִּרְעָתוֹנִי
  choice: 比拉顿人
  rationale: 该词是表示籍贯或地域归属的称谓，译为“比拉顿人”自然且准确。
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: 他是以法莲子孙
  rationale: 保留“以法莲子孙”的族裔和支派归属含义；这里不是指以法莲的直接儿子。
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: 他班里有
  rationale: מַחֲלֻקָה在本章指按月轮值的军队班次或队伍；结合人数，以“他班里有”符合现代汉语表达。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 准确表达基数，并按上下文补出量词“人”。
