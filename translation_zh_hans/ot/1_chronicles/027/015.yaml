base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/015.yaml
  text: The twelfth[a], for the twelfth month, was Heldai the Netophathite, of Othniel[b]; and over his division were twenty-four thousand.
translation:
  language: zh_hans
  text: 第十二班，负责第十二个月；首领是尼陀法人希勒代[a]，俄陀聂的[b]；他的班有二万四千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些平行传统将这个名字记作“希勒得”，而不是“希勒代”。
    reason: cross_reference
  - marker: b
    text: 也可译作“属于俄陀聂”或“与俄陀聂有关”。原文的结构很可能表示家族或宗族关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: 第十二班
  rationale: 原文只说“第十二”，但本章语境是按月轮值的军队班次；补出“班”可使现代汉语完整清楚。
- source_word: לִשְׁנֵים עָשָׂר הַחֹדֶשׁ
  choice: 负责第十二个月
  rationale: 介词 לְ 表示该班被指派在第十二个月当值；“负责”自然表达这种轮值安排。
- source_word: חֶלְדַּי
  choice: 希勒代
  rationale: 按本节马所拉文本所载人名音译，不以平行传统中的异名取代正文。
- source_word: הַנְּטוֹפָתִי
  choice: 尼陀法人
  rationale: 族称形容词表示来自尼陀法的人；采用简洁、自然的汉语籍贯称谓。
- source_word: לְעָתְנִיאֵל
  choice: 属俄陀聂一系
  rationale: 此处 לְ 最可能表示家族或宗族归属，而不是在早已去世的俄陀聂手下任职；“一系”保留其可能指家系或宗族关联的宽度。
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: 他班里有
  rationale: מַחֲלֻקָה 在本章指军队班次；结合后面的数目，译为“他班里有”符合现代汉语表达。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 数词表示该班人数；补出量词“人”使汉语自然。
theological_decisions:
- issue: לְעָתְנִיאֵל 所表达的关系
  choice: 属俄陀聂一系
  alternative: 俄陀聂的；与俄陀聂有关
  rationale: 家族或宗族归属最符合历史与句法语境，但原文没有进一步说明是直系后裔、宗族成员还是其他归属，因此正文与脚注均不作更窄的断定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“第十二班”和“领队”补明行政军事语境；人名、地名按希伯来语形式音译。脚注标记均置于所说明的词语之后，并纠正咨询层中脚注标记与内容错位的问题。
