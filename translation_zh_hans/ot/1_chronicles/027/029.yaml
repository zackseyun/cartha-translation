base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/029.yaml
  text: Over the herds grazing in Sharon was Shitrai the Sharonite[b][a], and over the herds in the valleys was Shaphat son of Adlai.
translation:
  language: zh_hans
  text: 在沙仑吃草的牛群[b]，由沙仑人[a]施特莱管理；在山谷中的牛群，由押莱的儿子沙法管理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 沙仑是以色列沿海的平原地区；“沙仑人”指来自沙仑的人。
    reason: cultural_note
  - marker: b
    text: “牛群”也可译作“牛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 由……管理
  rationale: 本节属于行政职务名录，עַל表示对某项产业负有监管责任；译为“由……管理”比直译“在……之上”更符合现代汉语。
- source_word: הַבָּקָר
  choice: 牛群
  rationale: בקר指牛类牲畜，也可集合性地表示群牛；“牛群”既切合畜牧语境，又自然易懂。
- source_word: הָרֹעִים
  choice: 牧放的
  rationale: רעה的分词在此修饰牛群，表示正在放牧或吃草；“牧放的”保留有人照料放牧的语义。
- source_word: בַּשָּׁרוֹן
  choice: 在沙仑
  rationale: 沙仑是地名，介词ב表示地点；采用中文圣经传统中通行的音译“沙仑”。
- source_word: שטרי
  choice: 施特莱
  rationale: 人名按希伯来语辅音与读音音译，并采用便于现代普通话读者辨读的形式。
- source_word: הַשָּׁרוֹנִי
  choice: 沙仑人
  rationale: 该族称形容词表示来自沙仑的人；“沙仑人”比生硬的音译式族称更清楚自然。
- source_word: בָּעֲמָקִים
  choice: 在山谷里
  rationale: עֲמָקִים是“谷地、山谷”的复数；“在山谷里”直接保留复数地域概念在汉语中的集合表达。
- source_word: שָׁפָט
  choice: 沙法
  rationale: 人名依希伯来语音译，并采用中文圣经中常见的译名形式。
- source_word: בֶּן עַדְלָי
  choice: 押莱的儿子
  rationale: 明确呈现希伯来语父子关系结构；“押莱”采用通行音译。
theological_decisions: []
