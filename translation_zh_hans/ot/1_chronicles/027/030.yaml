  yaml_path: translation/ot/1_chronicles/027/030.yaml
  text: Over the camels was Obil the Ishmaelite[a], and over the female donkeys was Jehdeiah the Meronothite.
translation:
  language: zh_hans
  text: 管理骆驼的是以实玛利人俄比勒；管理母驴的是米仑人耶希底亚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: 管理……的是
  rationale: 本节属于职务名录，עַל 表示对王室牲畜的监管责任；用“管理……的是”自然地表达这一行政关系，同时保留原文简洁的平行结构。
- source_word: הַגְּמַלִּים
  choice: 骆驼
  rationale: 定冠词复数名词，指这批由王室官员管理的骆驼；现代汉语在此不必另译定冠词。
- source_word: אוֹבִיל
  choice: 阿比勒
  rationale: 人名按希伯来语音译。
- source_word: הַיִּשְׁמְעֵלִי
  choice: 以实玛利人
  rationale: 族属或宗族称谓，表明阿比勒与以实玛利群体的关联；“以实玛利人”是自然且明确的汉语表达。
- source_word: הָאֲתֹנוֹת
  choice: 母驴
  rationale: אָתוֹן 专指雌性的驴；“母驴”简明、自然，并保留原词的性别信息。
- source_word: יֶחְדְּיָהוּ
  choice: 耶叠
  rationale: 人名按常见中文圣经译名处理。
- source_word: הַמֵּרֹנֹתִי
  choice: 米仑人
  rationale: 很可能是由地名形成的居民称谓，用“米仑人”保留其身份标识，而不武断补成“来自米仑”。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁、庄重的名录体表达；两句使用严格平行结构，清楚呈现两位负责人及其所管理的牲畜。英文咨询层所附脚注与其正文不一致：脚注所说的“母驴”实际对应后半句，而英文正文已明确译出，因此中文无需脚注。
