base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/031.yaml
  text: Over the flocks was Jaziz the Hagrite[a]. All these were officers over the property that belonged to King David.
translation:
  language: zh_hans
  text: 管理羊群的是夏甲族人雅悉[a]。这些人都是管理大卫王的财产的官员。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夏甲族人”也可按族名音译为“哈革利人”。
    reason: 保留希伯来语族称在汉语中采用关联人名意译或直接音译的可能。
lexical_decisions:
- source_word: וְעַל
  choice: 管理……的是
  rationale: 在这份行政人员名单中，עַל 表示负责、监管；用“管理……的是”符合现代汉语名单体表达。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: צֹאן 可指绵羊，也可泛指以绵羊和山羊为主的小型牲畜；“羊群”自然且不过度限定。
- source_word: יָזִיז
  choice: 雅悉
  rationale: 按希伯来语人名 יָזִיז 音译。
- source_word: הַהַגְרִי
  choice: 夏甲族人
  rationale: 该族称与夏甲之名相关；汉语采用意义清楚、容易辨识的“夏甲族人”，避免生硬的纯音译。
- source_word: כָּל אֵלֶּה
  choice: 这些人都是
  rationale: 这是总结前述管理人员的短语；补出“人”使现代汉语指代清楚。
- source_word: שָׂרֵי
  choice: 管理……的官员
  rationale: 此处 שָׂרֵי 指负责王室资产的行政人员，并非特指军事将领或贵族。
- source_word: הָרְכוּשׁ
  choice: 产业
  rationale: רְכוּשׁ 指财物、资产或所有物；在王室资源清单中，“产业”简洁地涵盖各类财产。
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: 大卫王产业
  rationale: 希伯来语关系结构表示这些产业归大卫王所有；汉语以定中结构自然表达所属关系。
theological_decisions: []
