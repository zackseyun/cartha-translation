lexical_decisions:
- source_word: לִבְנֵי
  choice: 以法莲子孙的负责人
  rationale: לְ在这份行政名册中表示所负责的对象；בְנֵי直译为“众子”，用于支派称谓时自然译为“子孙”。原文省略了职务语，依据本章名册语境补出“负责人”，使现代汉语完整清楚。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 采用现代中文圣经中通行的支派名称。
- source_word: הוֹשֵׁעַ
  choice: 何细亚
  rationale: 按中文圣经中此人物的惯用译名处理；脚注保留其也可译作“何西阿”的形式。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 准确表达希伯来文名单中的父子关系。
- source_word: עֲזַזְיָהוּ
  choice: 阿撒细雅
  rationale: 采用中文圣经传统中较通行、且与希伯来文名称相应的音译。
- source_word: לַחֲצִי שֵׁבֶט
  choice: 半支派的负责人
  rationale: חֲצִי שֵׁבֶט意为“半个支派”；לְ表示负责对象，并依行政名册语境补出“负责人”。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经中通行的支派名称。
- source_word: יוֹאֵל
  choice: 约珥
  rationale: 采用中文圣经中通行的人名音译。
- source_word: פְּדָיָהוּ
  choice: 毗大雅
  rationale: 采用中文圣经中通行的人名音译。
