base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/004.yaml
  text: Over the division for the second month was Dodai the Ahohite[a], and Mikloth was the leader over his division; and in his division were twenty-four thousand.
translation:
  language: zh_hans
  text: 第二月班次的统领是亚合人朵代；米克罗是这班次的领袖[a]。这班次有二万四千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第二月班次的统领是亚合人朵代；他的班次，和米克罗这位领袖。”希伯来文语序紧缩；米克罗可理解为朵代班次中的领袖，也可能只是与朵代及其班次一同列出，其具体职分关系不甚明确。
    reason: alternative_reading
lexical_decisions:
- source_word: מַחֲלֹקֶת / מַחֲלֻקְתּוֹ
  choice: 班次／他的班次
  rationale: 本章描述按月轮值的军事编制；“班次”既体现编组，也体现轮值安排，并在重复处保持一致。
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: 第二月
  rationale: 按原文直译为月份序数，不另行推定具体月名。
- source_word: דּוֹדַי
  choice: 朵代
  rationale: 依本节马所拉文本的专名形式音译，不改作其他经文所见的相关名字形式。
- source_word: הָאֲחוֹחִי
  choice: 亚合人
  rationale: 将带冠词的宗族或籍贯称谓译成自然的现代汉语族属表达。
- source_word: וּמִקְלוֹת
  choice: 米克罗
  rationale: 按希伯来语专名音译。
- source_word: הַנָּגִיד
  choice: 领袖
  rationale: 该词可指领袖、首领或统领；此处选用涵盖面较宽的“领袖”，避免把具体军阶说得过死。
- source_word: וְעַל־מַחֲלֻקְתּוֹ
  choice: 作他班次的领袖
  rationale: 结合压缩的希伯来语句法，表达米克罗与该班次的领导关系，同时以脚注保留另一种切分可能。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 用现代汉语常规数字表达；按军事编制语境补出量词“人”。
theological_decisions:
- issue: 米克罗在班次中的身份及句法归属
  choice: 正文理解为米克罗在朵代的班次中担任领袖
  alternative: 可断作“朵代和他的班次；米克罗为统领”，使米克罗的具体隶属或职分关系较不明确
  rationale: 原文词序紧缩，וּמַחֲלֻקְתּוֹ וּמִקְלוֹת הַנָּגִיד 可有不同切分；正文采用通顺且符合上下文的理解，脚注明确保留歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“统领”用于表达 עַל 所示的主管关系，“领袖”对应 הַנָּגִיד，以免重复且不过度限定军阶；人名按希伯来语形式音译。
