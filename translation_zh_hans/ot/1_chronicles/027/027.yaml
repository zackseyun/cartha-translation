base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/027.yaml
  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
translation:
  language: zh_hans
  text: 管理葡萄园的是拉玛人示每；管理葡萄园的出产[a]、供储酒库[b]储藏的，是实弗米人撒巴底。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“葡萄园里的东西”；按上下文，很可能指葡萄园的出产。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“酒的库房”或“酒库”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 管理……的是
  rationale: 本章是王室职务名录，עַל表示负责监管；译为“管理……的是”既准确又符合现代汉语表达。
- source_word: הַכְּרָמִים
  choice: 葡萄园
  rationale: כֶּרֶם通常指葡萄园；此处复数并带定冠词，指归王室管理的各葡萄园。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: הָרָמָתִי
  choice: 拉玛人
  rationale: 这是由地名形成的居民称谓，译作“拉玛人”比音译整个称谓更自然，并保留其地域含义。
- source_word: שֶׁבַּכְּרָמִים
  choice: 葡萄园的出产
  rationale: 原文直译为“葡萄园里的东西”。结合前句已提葡萄园本身，且下文谈到储酒设施，此处很可能指葡萄园的产物；正文采用自然明确的表达，并以脚注保留原文字面范围。
- source_word: לְאֹצְרוֹת הַיַּיִן
  choice: 供酒库储藏
  rationale: אֹצָר可指库房或宝库，与“酒”连用时指储酒设施；介词לְ表示这些出产与酒库的用途或归属关系。
- source_word: זַבְדִּי
  choice: 撒巴底
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: הַשִּׁפְמִי
  choice: 实弗米人
  rationale: 这是由地名形成的称谓，但具体地点未能确定；采用通行音译“实弗米人”，避免作推测性的地名展开。
theological_decisions: []
