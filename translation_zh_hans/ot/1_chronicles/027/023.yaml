source:
  edition: WLC
  text: וְ/לֹא נָשָׂ֤א דָוִיד֙ מִסְפָּרָ֔/ם לְ/מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑טָּה כִּ֚י אָמַ֣ר יְהוָ֔ה לְ/הַרְבּ֥וֹת אֶת יִשְׂרָאֵ֖ל כְּ/כוֹכְבֵ֥י הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/023.yaml
  text: But David did not count them from twenty years old and under[b][a], because Yahweh had said he would multiply Israel like the stars of the heavens.
translation:
  language: zh_hans
  text: 但大卫没有数点二十岁及以下的人[a]，因为雅威曾说，他要使以色列人增多，如天上的星那样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有统计他们的人数。”希伯来语习语直译是“没有举起他们的数目”，意思是没有清点或统计他们。
    reason: lexical_alternative
  - marker: b
    text: 或译：“如天上的众星。”这句话呼应雅威要使以色列人数极其众多的应许。
    reason: cross_reference
lexical_decisions:
- source_word: וְלֹא
  choice: 但……没有
  rationale: 连词在上下文中带有转折意味，承接前文的统计背景；“但”能自然表达这种对比。
- source_word: נָשָׂא ... מִסְפָּרָם
  choice: 数点……的人
  rationale: 这个希伯来语习语直译为“举起他们的数目”，实际指清点人数或进行人口统计。“数点”简洁地保留了统计人口的含义。
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וּלְמָטָּה
  choice: 二十岁及以下的人
  rationale: 该年龄表达包括二十岁，并涵盖年龄更小的人；此译法符合现代汉语习惯。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出大卫不统计这一年龄群体的原因。
- source_word: אָמַר יְהוָה
  choice: 雅威曾说
  rationale: “雅威”直接呈现神名；“曾说”表明这话先于大卫当时的决定。
- source_word: לְהַרְבּוֹת אֶת יִשְׂרָאֵל
  choice: 他要使以色列人增多
  rationale: 不定式说明雅威所说之事的内容。“使……增多”准确表达使役意义；“以色列人”在现代汉语中比单说“以色列”更清楚地指人民。
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: 如天上的星那样
  rationale: 保留原文的明喻及其应许性措辞，同时使用自然、庄重的现代汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较通行的学术拟音呈现这一盟约之名，而不以称号“主”代替。
- issue: לְהַרְבּוֹת 中隐含的施事者
  choice: 他要使以色列人增多
  alternative: 要使以色列人增多
  rationale: 上下文最自然地以雅威为“使……增多”的施事者。补出“他”使中文关系清楚，但不增加施事方式或时间等原文未说明的内容。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“数点”略带经文语体，但普通读者仍容易理解，也能保留人口统计的语境。脚注标记均置于正文相应语句之后。
