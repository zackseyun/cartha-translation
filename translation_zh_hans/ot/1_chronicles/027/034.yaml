base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/034.yaml
  text: After Ahithophel came Jehoiada son of Benaiah and Abiathar[a]; and Joab was commander of the army for the king.
translation:
  language: zh_hans
  text: 亚希多弗之后，有比拿雅的儿子耶何耶大和亚比亚他[a]；约押是王的军队统帅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“亚希多弗之后，比拿雅的儿子耶何耶大和亚比亚他。”希伯来文省略了动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי
  choice: 亚希多弗之后，是……
  rationale: אַחֲרֵי意为“在……之后”。希伯来文此处没有明说动词；正文用“之后，是”构成自然的现代汉语，同时不明确添加“继任”等原文未明说的关系。
- source_word: אֲחִיתֹפֶל
  choice: 亚希多弗
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: יְהוֹיָדָע
  choice: 耶何耶大
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: בֶּן בְּנָיָהוּ
  choice: 比拿雅的儿子
  rationale: 忠实表达希伯来语父子关系结构，并符合自然汉语语序。
- source_word: וְ/אֶבְיָתָר
  choice: 和亚比亚他
  rationale: 保留连接词，并按句法将亚比亚他与耶何耶大并列。
- source_word: וְ/שַׂר צָבָא
  choice: 约押是……军队统帅
  rationale: שַׂר צָבָא指军队的最高长官；汉语补出系词“是”，使无动词的希伯来语分句成为完整自然的句子。
- source_word: לַ/מֶּלֶךְ
  choice: 王的
  rationale: 此处ל表示约押与王之间的归属或服事关系；“王的军队统帅”在汉语中简洁自然。
- source_word: יוֹאָב
  choice: 约押
  rationale: 按现代中文圣经人名的通行形式音译。
theological_decisions:
- issue: 亚希多弗之后两人的具体职分或承接关系
  choice: 不补出“继任”“作谋士”等明确职分，只译作“之后，是……”
  alternative: “亚希多弗之后，继任的是……”或“亚希多弗之后作谋士的是……”
  rationale: 原文省略动词，仅以“在亚希多弗之后”连接耶何耶大和亚比亚他；明确写成“继任”或“作谋士”会消除原文保留的句法与职分歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；人名使用简体中文圣经传统中通行的译名。正文适度补出“是”以便阅读，脚注说明原文的无动词结构及其歧义。
