base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/026.yaml
  text: And over those who did the work of the field for the cultivation of the ground was Ezri son of Chelub[a][b].
translation:
  language: zh_hans
  text: 负责那些在田间劳作、耕种土地之人的是基绿的儿子以斯利。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“负责田间工人的是……”。希伯来语的分词短语也可较简洁地译为“田间工人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为耕作土地”。这短语指农业耕种。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 管理……的是
  rationale: 本节属于官员职责清单；עַל在此表示某人负责管理一个工作领域。中文用“管理……的是”自然呈现这种监督关系，并承接上下文的列举。
- source_word: עֹשֵׂי מְלֶאכֶת הַשָּׂדֶה
  choice: 在田间劳作的人
  rationale: 该分词结构指从事田间工作的人。“在田间劳作的人”既保留农业劳动的含义，也符合现代汉语表达。
- source_word: לַעֲבֹדַת הָאֲדָמָה
  choice: 耕种土地
  rationale: עֲבֹדָה与אֲדָמָה连用，指对土壤或土地的农业耕作；“耕种土地”清楚而自然。
- source_word: עֶזְרִי בֶּן כְּלוּב
  choice: 基绿的儿子以斯利
  rationale: 按常用中文圣经人名音译处理专名，并以“……的儿子……”表达בן所标明的父子关系。
