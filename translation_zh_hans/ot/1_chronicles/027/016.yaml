  text: 'And over the tribes of Israel: for the Reubenites[a], Eliezer son of Zichri was leader; for the Simeonites, Shephatiah son of Maacah.'
translation:
  language: zh_hans
  text: 至于以色列各支派：流便人的领袖[a]是细基利的儿子以利以谢；西缅人的领袖是玛迦的儿子示法提雅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领袖”或译“首领”“君长”或“统治者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 至于
  rationale: 此处转入行政名单的新段落，介绍各支派的负责人。“至于”自然承接上文，也符合中文列举体例；相关管辖含义由下文“领袖”表达。
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列各支派
  rationale: 准确表达希伯来语属格结构，并以“各”显明下文逐支派列举的语境。
- source_word: לָרְאוּבֵנִי
  choice: 吕便人
  rationale: 该族称形式指吕便支派的人，而非族长吕便本人；“吕便人”简洁自然。
- source_word: נָגִיד
  choice: 领袖
  rationale: 该词指被置于权位、负责领导的人。在支派行政语境中，“领袖”庄重清楚，且不加入“王子”等可能产生的王室含义。
- source_word: אֱלִיעֶזֶר בֶּן זִכְרִי
  choice: 细基利的儿子以利以谢
  rationale: 采用现代中文圣经人名的通行译写，并按自然汉语次序表达父子关系。
- source_word: לַשִּׁמְעוֹנִי
  choice: 西缅人
  rationale: 族称指西缅支派的人，与“吕便人”保持平行。
- source_word: שְׁפַטְיָהוּ בֶּן מַעֲכָה
  choice: 玛迦的儿子示法提雅
  rationale: 按通行中文圣经译名处理，并保留原文仅说明亲子关系、不说明玛迦性别的开放性。
