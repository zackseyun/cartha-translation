  text: 'The ninth, for the ninth month: Abiezer the Anathothite, from Benjamin; and over his division were twenty-four thousand.'
translation:
  language: zh_hans
  text: 第九位、在第九个月值班的是来自便雅悯的亚拿突人亚比以谢；他所率领的班有二万四千人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַתְּשִׁיעִי לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: 第九班，在九月值班
  rationale: 原文两次“第九”分别指序列中的第九班和第九月；结合本段轮班名册的语境，补出“班”和“值班”，使汉语自然清楚。
- source_word: אֲבִיעֶזֶר הָעַנְּתֹתִי
  choice: 亚拿突人亚比以谢
  rationale: 按常见圣经人名、地名音译处理；“亚拿突人”表达其地域身份。
- source_word: ל/בנימיני
  choice: 来自便雅悯的
  rationale: 马所拉文本辅音写作לבנימיני，语境指与便雅悯的归属关系；采用较宽泛的“来自便雅悯”，不强行限定为纯粹的支派血统称谓。
- source_word: וְעַל מַחֲלֻקְתּוֹ עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 他班里有二万四千人
  rationale: 字面结构为“在他的班次之上有二万四千”，即他统管的班共有二万四千人；用自然现代汉语表达统辖与人数关系。
theological_decisions:
- issue: “便雅悯”所表达的身份性质
  choice: 来自便雅悯的
  alternative: 便雅悯人
  rationale: 原文形式及文本传统存在细微不规则，且亚比以谢首先被称为“亚拿突人”；译作“来自便雅悯的”保留较宽的地域或支派归属空间，避免过度确定。
translation_notes:
  register: 采用现代、庄重而易懂的名册体表达；在不改变信息的前提下补出上下文隐含的“班长”“值班”和“人”，避免生硬照搬希伯来语句法。
