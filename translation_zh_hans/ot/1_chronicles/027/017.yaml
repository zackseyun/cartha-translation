base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/017.yaml
  text: for Levi[a], Hashabiah son of Kemuel; for Aaron, Zadok.
translation:
  language: zh_hans
  text: 利未支派：基母利的儿子哈沙比雅；亚伦[a]：撒督。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“亚伦”，这里很可能指亚伦的祭司家族或亚伦的后裔。
    reason: cultural_note
lexical_decisions:
- source_word: לְ/לֵוִי
  choice: 利未支派
  rationale: 介词 לְ 在这份行政名册中标明所管辖或代表的群体。希伯来文以祖先“利未”代指其支派；译作“利未支派”能使现代汉语读者清楚理解，同时不将其窄化为别的群体称谓。
- source_word: חֲשַׁבְיָה
  choice: 哈沙比雅
  rationale: 按现代中文圣经人名的音译习惯处理此专名。
- source_word: בֶן
  choice: ……的儿子
  rationale: 这是希伯来文表示父子关系的标准结构，现代汉语自然对应为“……的儿子”。
- source_word: קְמוּאֵל
  choice: 基母利
  rationale: 按现代中文圣经人名的通行音译处理此专名。
- source_word: לְ/אַהֲרֹן
  choice: 亚伦
  rationale: 保留希伯来文直接使用祖先名“亚伦”的表达，并借上下文中的名册结构呈现其所代表的群体；其转喻意义在脚注中说明。
- source_word: צָדוֹק
  choice: 撒督
  rationale: 采用现代中文圣经中广为人知的人名译法。
theological_decisions:
- issue: 是否在正文中明确把“亚伦”解释为亚伦祭司家族
  choice: 正文保留祖先名“亚伦”，以脚注说明其群体含义
  alternative: 译作“亚伦家”或“亚伦的后裔”
  rationale: 希伯来文只写“亚伦”，在行政名册中很可能以祖先名代指亚伦祭司家族。正文保留原文简洁且带转喻的措辞，避免把合理解释写成原文明说的内容。
translation_notes:
  register: 采用简洁的名册体，以冒号和分号呈现希伯来文省略谓语的并列结构。“利未支派”适度明示第一项的群体意义；第二项保留“亚伦”的原文形式，并用脚注解释。英文咨询层的脚注标在“Levi”之后，但内容实际解释“for Aaron”；本稿依据希伯来文及脚注内容，将标记置于“亚伦”之后。
