  text: 'For Dan: Azarel son of Jeroham[a]. These were the leaders of the tribes of Israel.'
translation:
  language: zh_hans
  text: 但支派：耶罗罕的儿子亚萨列。这些人是以色列各支派的首领[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”也可译为“领袖”或“官长”。
    reason: 保留 שָׂרֵי 在本段支派行政语境中所表达的领导身份，不将其限缩为宗族父长或特定官职。
lexical_decisions:
- source_word: לְ/דָן
  choice: 但支派
  rationale: 介词 לְ 在这份行政名录中引出所对应的支派；用“但支派”作为简洁标题，符合现代汉语列表体，也避免补入原文没有的动词。
- source_word: עֲזַרְאֵל
  choice: 亚萨列
  rationale: 按现代中文圣经人名的通行音译处理，指负责但支派事务的人。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 直接表达父子关系，清楚保留希伯来语构造。
- source_word: יְרֹחָם
  choice: 耶罗罕
  rationale: 采用现代中文圣经中通行且贴近希伯来语读音的人名译法。
- source_word: אֵלֶּה
  choice: 这些人
  rationale: 希伯来语为复数指示词；汉语补出“人”，自然承接上文所列各支派负责人。
- source_word: שָׂרֵי
  choice: 首领
  rationale: 该词表示居领导、治理地位的人；“首领”既能涵盖其身份，又不过度限定为世袭族长或官僚职务。
- source_word: שִׁבְטֵי
  choice: 各支派
  rationale: 复数构造形式在此指以色列的众支派；“各支派”比生硬的“支派们”自然。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用该民族及国家名称的标准中文译名。
