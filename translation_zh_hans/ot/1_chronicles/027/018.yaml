  text: For Judah[a], Elihu, one of David’s brothers; for Issachar, Omri son of Michael.
translation:
  language: zh_hans
  text: 犹大支派由大卫的兄弟之一以利户[a]负责；以萨迦支派由米迦勒的儿子暗利负责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“以利户”。一些古译本和解释者作“以利押”，可能是为了与别处所记大卫兄弟的名字一致。
    reason: alternative_reading
lexical_decisions:
- source_word: לִיהוּדָה
  choice: 犹大支派
  rationale: 前缀 לְ 在这份行政名录中引出所对应的支派；译出“支派”使现代汉语读者清楚，同时保留名单结构。
- source_word: אֱלִיהוּ
  choice: 以利户
  rationale: 马所拉文本明确作 אֱלִיהוּ，应按此音译为“以利户”；“以利押”属于部分古译本的异文，可能是向别处所记大卫兄长之名协调。
- source_word: מֵאֲחֵי דָוִיד
  choice: 大卫的一个兄弟
  rationale: 介词 מִן 与复数“兄弟”连用，表达从其中选取一人，即“大卫的兄弟之一”。
- source_word: לְיִשָּׂשכָר
  choice: 以萨迦支派
  rationale: 与“犹大”前的 לְ 相同，引出该支派所对应的负责人。
- source_word: עָמְרִי
  choice: 暗利
  rationale: 依现代中文圣经常用专名译法音译。
- source_word: בֶּן מִיכָאֵל
  choice: 米迦勒的儿子
  rationale: 标准希伯来语父称结构，直译为“米迦勒的儿子”。
