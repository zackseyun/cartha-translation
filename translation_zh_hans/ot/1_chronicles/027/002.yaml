base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/002.yaml
  text: Over the first division for the first month was Jashobeam son of Zabdiel[a], and in his division were twenty-four thousand.
translation:
  language: zh_hans
  text: 第一月第一班的统领是撒拔第业的儿子雅朔班；他班内有二万四千人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“而在他所辖的班之上，二万四千人”；希伯来文省略了谓语，译文补出“有”，以表达该班的人数。
    reason: 说明原文在“他的班”与人数之间省略谓语的结构，以及译文补出“有”的原因。
lexical_decisions:
- source_word: עַל הַמַּחֲלֹקֶת
  choice: 班的主管
  rationale: עַל在本行政名录中表示负责、统管；מַחֲלֹקֶת指按月轮值的编制单位。译作“班的主管”自然表达管理关系，也符合下文“他班里”的说法。
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: 一月
  rationale: 原文直译为“第一个月”，在全年按月轮值的上下文中即第一月；“一月”简洁自然，不将其误解为任职首月。
- source_word: הָרִאשׁוֹנָה
  choice: 第一班
  rationale: 该形容词标明按月编排的班次顺序，故译为“第一班”。
- source_word: יָשָׁבְעָם
  choice: 雅朔班
  rationale: 按希伯来语人名音译，并采用现代中文圣经人名的庄重、简明形式。
- source_word: בֶּן זַבְדִּיאֵל
  choice: 撒伯迭的儿子
  rationale: בֶּן在人物身份说明中通常表示直接的父子关系，依字面译出。
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: 他班里有
  rationale: 希伯来文原为“而在／统管他的班……”，谓语省略，随后数字说明该班人数；中文补出“有”可清楚表达而不过度解释。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 准确表达二十四千；补出量词“人”符合军事人员名册的语境和现代汉语习惯。
