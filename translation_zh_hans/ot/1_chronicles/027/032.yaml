base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/032.yaml
  text: Jonathan[a], David’s uncle, was a counselor, a man of understanding, and a scribe[b]; and Jehiel son of Hachmoni was with the king’s sons.
translation:
  language: zh_hans
  text: 大卫的叔父[a]约拿单作谋士；他是个明达的人，又是书记。哈革摩尼的儿子耶歇与王的众子同在[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “叔父”所译的希伯来词也可泛指其他亲属或亲近之人；此处通常理解为叔父。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“与王的众子同在”。按语境也可能含有陪侍或照管他们的意思，但原文没有明确说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד
  choice: 叔父
  rationale: 该词可表示叔父，也可泛指亲属或亲近之人；在此处与“大卫”连用，通常按亲属称谓译为“叔父”，并以脚注保留词义上的不确定性。
- source_word: יוֹעֵץ
  choice: 谋士
  rationale: 指在王室环境中出谋献策的人；“谋士”自然、庄重，也保留其职分色彩。
- source_word: אִישׁ מֵבִין
  choice: 明达的人
  rationale: 表达有理解力、辨识力的人；“明达”兼顾智慧与洞察，符合本节简洁的称誉语气。
- source_word: סוֹפֵר
  choice: 书记
  rationale: 该词可指负责书写、记录或行政事务的文职人员；“书记”保留其较宽泛的宫廷职务含义，避免具体化为现代意义上的秘书。
- source_word: עִם
  choice: 与……同在
  rationale: 直译介词“与、同”；上下文可能暗示陪侍或照管，但原文没有明说职责，因此正文不作补充推断。
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: 王的众子
  rationale: 原文明确为“王的儿子们”；此译保留亲属关系和复数含义，而非直接意译为“王子们”。
- source_word: חַכְמוֹנִי
  choice: 哈革摩尼
  rationale: 按现代中文圣经人名的常见音译处理该专名。
