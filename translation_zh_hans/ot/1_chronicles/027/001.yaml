source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֣ל לְֽ/מִסְפָּרָ֡/ם רָאשֵׁ֣י הָ/אָב֣וֹת וְ/שָׂרֵ֣י הָֽ/אֲלָפִ֣ים וְ/הַ/מֵּא֡וֹת וְ/שֹׁטְרֵי/הֶם֩ הַ/מְשָׁרְתִ֨ים אֶת הַ/מֶּ֜לֶךְ לְ/כֹ֣ל דְּבַ֣ר הַֽ/מַּחְלְק֗וֹת הַ/בָּאָ֤ה וְ/הַ/יֹּצֵאת֙ חֹ֣דֶשׁ בְּ/חֹ֔דֶשׁ לְ/כֹ֖ל חָדְשֵׁ֣י הַ/שָּׁנָ֑ה הַֽ/מַּחֲלֹ֨קֶת֙ הָֽ/אַחַ֔ת עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׀־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/001.yaml
  text: The sons of Israel according to their number—the heads of fathers’ houses[a], and the commanders of thousands and of hundreds[c][b], and their officers who served the king in every matter of the divisions that came in and went out month by month throughout all the months of the year—each division was twenty-four thousand.
translation:
  language: zh_hans
  text: 以色列人[a]按数目编列：各父家的首领[b]、千夫长和百夫长，以及他们的官员，都在各班次的一切事务上服侍王。各班每月轮流进入和退出服役，贯穿全年的每一个月；每班有二万四千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，在这里统指以色列人。
    reason: lexical_alternative
  - marker: b
    text: “父家”是以父系亲属关系为基础的家族及行政单位。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，这里统指以色列民；现代汉语用“以色列人”自然、准确，不把范围限定为直接儿子。
- source_word: לְמִסְפָּרָם
  choice: 按数目编组
  rationale: 介词短语表达按人数统计、编排之意；结合后文轮值班次，补出“编组”可使行政语境清楚，同时不改变基本意义。
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 各父家的首领
  rationale: “父家”是古代以色列以父系亲属关系为基础的社会和行政单位；保留这一术语，并用脚注说明。
- source_word: וְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: 千夫长和百夫长
  rationale: שׂרים在此指军事或行政统领；“千夫长、百夫长”是简洁、通行且符合层级语境的汉语表达。
- source_word: וְשֹׁטְרֵיהֶם
  choice: 以及他们的官员
  rationale: שֹׁטְרִים可指行政官员，某些语境也带文书职能；此处“官员”保留其宽泛的军政性质。
- source_word: הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: 服侍王
  rationale: 分词表示持续承担王室职务；“服侍王”既保留原文措辞，也可涵盖行政及军事服务。
- source_word: לְכֹל דְּבַר הַמַּחְלְקוֹת
  choice: 办理各班次的一切事务
  rationale: דבר在此是“事务、事项”，מחלקות是轮值编制的“班次”；此译自然呈现全面负责相关事务的含义。
- source_word: הַבָּאָה וְהַיֹּצֵאת
  choice: 轮流入值、退值
  rationale: 原文直译为“进来的和出去的”，在轮班语境中指进入和退出王室当值；译文保留双向动作并明确其功能。
- source_word: חֹדֶשׁ בְּחֹדֶשׁ לְכֹל חָדְשֵׁי הַשָּׁנָה
  choice: 每月轮流……周而复始，贯穿一年
  rationale: 两个短语分别表达逐月轮换及涵盖全年；汉语如此组合可清楚传达全年每月轮值。
- source_word: הַמַּחֲלֹקֶת הָאַחַת
  choice: 每班
  rationale: 字面为“那一个班次”，上下文具有逐一分配的意义，故译为分配性的“每班”。
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 二万四千人
  rationale: 直接译出人数；补“人”符合汉语计数习惯及上下文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“父家”这一历史性术语并加注说明；用“入值、退值”表达班次轮换。“以色列人”按集体意义处理，避免生硬的“以色列的众子”。
