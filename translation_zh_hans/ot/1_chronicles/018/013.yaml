    rationale: עֲבָדִים的通常意义是“奴仆／奴隶”，虽可用于政治附属关系，但“臣仆”偏向官僚性的臣属或谦称，较少体现原文所说的被支配、服役状态。英文审校文本也明确采用“slaves”。
  revised_text: 他在以东设立了驻军；以东人全都成了大卫的奴仆。大卫无论往哪里去，耶和华都使他得胜。
