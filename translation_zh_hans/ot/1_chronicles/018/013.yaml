  text: He placed garrisons in Edom, and all Edom became slaves to David. And the LORD gave David victory wherever he went.
translation:
  language: zh_hans
  text: 他在以东设立了驻军；以东人全都成了大卫的奴仆。大卫无论往哪里去，耶和华都使他得胜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצִיבִים
  choice: 驻军
  rationale: 该词可指派驻的官员或驻防单位；结合征服以东的军事语境，译作“驻军”最自然，同时不额外具体化其组织形式。
- source_word: עֲבָדִים
  choice: 臣仆
  rationale: 该词基本义为“仆人、奴仆”，在国家臣服于君王的政治语境中指受其辖制并服役；“臣仆”既保留从属意味，也避免让“以东人全都”被误解为人人成为私人奴隶。
- source_word: וַיּוֹשַׁע
  choice: 使……得胜
  rationale: 使役性的“拯救、解救”在军事语境中自然表达为“使……得胜”，突出胜利来自耶和华。
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: 无论往哪里去
  rationale: 按希伯来语习惯表达大卫每次出征或行动所到之处，现代汉语以此译法简洁自然。
theological_decisions:
- issue: 胜利的施予者
  choice: 耶和华都使他得胜
  alternative: 大卫无论往哪里去都得胜
  rationale: 保留原文明确的神圣主语与使役含义，不把胜利仅归于大卫自身。
- issue: 以东的臣服性质
  choice: 以东人全都成了大卫的臣仆
  alternative: 以东人全都成了大卫的奴隶
  rationale: 原文存在政治臣属与奴仆身份的语义张力；正文采用适合国族关系的“臣仆”，不将其过度限定为个人财产式奴役。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；句式简洁，保持叙事节奏。“耶和华”按中文圣经传统音译神名。
