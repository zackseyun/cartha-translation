  text: וְ/צָד֧וֹק בֶּן אֲחִיט֛וּב וַ/אֲבִימֶ֥לֶךְ בֶּן אֶבְיָתָ֖ר כֹּהֲנִ֑ים וְ/שַׁוְשָׁ֖א סוֹפֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/016.yaml
  text: Zadok son of Ahitub and Abimelech son of Abiathar were priests[a], and Shavsha was secretary.
translation:
  language: zh_hans
  text: 撒督的儿子亚希突和亚比亚他的儿子亚比米勒都作祭司[a]；沙威沙作书记。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 平行经文《撒母耳记下》8:17作“亚比亚他的儿子亚希米勒”，而不是“亚比亚他的儿子亚比米勒”。本译文此处依照《历代志上》的希伯来文本。
    reason: textual_variant
lexical_decisions:
- source_word: צָדוֹק
  choice: 撒督
  rationale: 按现代中文圣经常用译名音译人名。
- source_word: בֶּן
  choice: 的儿子
  rationale: 本节是官员名录，最自然地表示直接父子关系，而非泛指后裔。
- source_word: אֲחִיטוּב
  choice: 亚希突
  rationale: 按现代中文圣经常用译名音译人名。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 忠实音译《历代志上》马所拉文本所读的名字；与平行经文的差异留在脚注说明。
- source_word: אֶבְיָתָר
  choice: 亚比亚他
  rationale: 按现代中文圣经常用译名音译人名。
- source_word: כֹּהֲנִים
  choice: 祭司
  rationale: 该词通常指祭司；结合撒督及亚比亚他家系，此处明显是宗教职分，而不是泛指王室官员。
- source_word: שַׁוְשָׁא
  choice: 沙威沙
  rationale: 依《历代志》希伯来文本音译该人名，并以自然的现代汉语音节呈现。
- source_word: סוֹפֵר
  choice: 书记
  rationale: 在王室行政语境中指负责文书事务的官员；“书记”既保留官职意味，也比单纯译作“文士”更贴合此处。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语；用“都作祭司……作书记”自然呈现官员名录的并列结构，并保留原文所见的人名异文。
