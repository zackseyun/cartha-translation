base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/001.yaml
  text: After this[a], David struck the Philistines and subdued them, and he took Gath and its surrounding towns from the hand of the Philistines.
translation:
  language: zh_hans
  text: 此后，大卫打击非利士人，将他们制伏，又从非利士人手中夺取了迦特及其属城[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它的女儿们”，指隶属于迦特的较小城镇或村庄。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: 此后
  rationale: 这是叙事中的时间转换语。省去希伯来语中程式化的“事情发生了”，以自然简洁的现代汉语表达时间顺序。
- source_word: וַיַּךְ
  choice: 打击
  rationale: נכה在军事语境中有“击打、攻击”之意；译作“打击”保留具体动作，也避免提前把下一动词所表达的制伏结果并入本词。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用该族群通行的中文名称。
- source_word: וַיַּכְנִיעֵם
  choice: 将他们制伏
  rationale: כנע的使役形表达使对方屈服、归顺；“制伏”简明地保留军事和政治上的降服含义。
- source_word: וַיִּקַּח
  choice: 夺取了
  rationale: לקח本义为“取、拿”，在取得敌方城市控制权的语境中译作“夺取”更清楚自然。
- source_word: גַּת
  choice: 迦特
  rationale: 采用该非利士城市通行的中文译名。
- source_word: וּבְנֹתֶיהָ
  choice: 属它的城镇
  rationale: 字面为“它的女儿们”，是指隶属于中心城市的附属聚落。“属它的城镇”准确表达依附关系，并以脚注保留原文意象。
- source_word: מִיַּד
  choice: 从……手中
  rationale: 保留希伯来语“从……手中”的形象说法，表达从非利士人的控制或占有之下夺取。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文两个连续军事动词“打击”和“制伏”的动作与结果关系，并将脚注标记放在其实际解释的“属它的城镇”之后。
