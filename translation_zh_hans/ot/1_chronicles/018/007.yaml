base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/007.yaml
  text: And David took the shields of gold that were on the servants of Hadadezer and brought them to Jerusalem[a][b][c].
translation:
  language: zh_hans
  text: 大卫取了哈大底谢的臣仆身上所带的金盾牌[a][b]，把它们带到耶路撒冷[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金盾牌”也可理解为“包金的盾牌”；希伯来语本身没有明确说明盾牌是纯金制成还是以金包覆。
    reason: lexical_alternative
  - marker: b
    text: 这里的“臣仆”在王室和军事语境中，很可能指哈大底谢的臣属、侍从或军中随员，不一定是现代狭义所说的家奴。
    reason: cultural_note
  - marker: c
    text: 有些文本传统以及《撒母耳记下》的平行记载把此名写作“哈大利谢”。
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 夺取了
  rationale: לקח通常意为“拿、取”；本节处于战争语境，所取之物属于战败一方，因此译作“夺取”自然传达语境，同时不额外说明具体缴获方式。
- source_word: שִׁלְטֵי הַזָּהָב
  choice: 金盾牌
  rationale: שִׁלְטֵי指盾牌，也可能特指较小的盾；הַזָּהָב构成“金的盾牌”。“金盾牌”在现代汉语中简洁自然，但材质究竟为纯金还是包金并不确定，故以脚注保留。
- source_word: אֲשֶׁר הָיוּ עַל
  choice: 身上所带的
  rationale: 字面为“在……之上”。结合盾牌与人员的关系，现代汉语用“身上所带的”较自然，也保留这些盾牌由臣仆佩带或携带的图景。
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: 哈达底谢臣仆
  rationale: עֲבָדִים基本义为仆人、臣仆；在王室和军事语境中可指王的随从、臣属或军中侍从。“臣仆”既保留从属关系，也避免现代“奴隶”的狭义联想。
- source_word: הֲדַדְעָזֶר
  choice: 哈达底谢
  rationale: 按本节马所拉文本所见Hadadezer音译；其他文本传统及平行经文有Hadarezer的拼写，另以脚注说明。
- source_word: וַיְבִיאֵם יְרוּשָׁלִָם
  choice: 把它们带到耶路撒冷
  rationale: בוא的使役式意为“带来、带到”；宾语后缀指前述盾牌。该译法准确且符合现代汉语叙事习惯。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“夺取”体现战争语境；“臣仆”保留王权从属色彩而避免过度限定身份；“身上所带”将希伯来语“在……之上”的表达自然化。所有真实的词义和文本差异均以脚注保留。
