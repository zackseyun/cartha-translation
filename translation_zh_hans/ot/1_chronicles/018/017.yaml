base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/017.yaml
  text: And Benaiah son of Jehoiada was over the Kerethites and the Pelethites[c][b][a], and David’s sons were the chief officials at the king’s side.
translation:
  language: zh_hans
  text: 耶何耶大的儿子比拿雅统管基利提人和比利提人；大卫的众子在王身边担任首要官员。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首要官员”原文直译为“居首的”或“首要的”，这里可能是王室高级人员的称谓。
    reason: lexical_alternative
  - marker: b
    text: “在王身边”原文直译为“在王的手边”，可指近身随侍或为王效力。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: 统管
  rationale: 在行政或军事语境中表示管辖、统领；“统管”简洁自然，又不额外限定具体军职。
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: 基利提人和比利提人
  rationale: 两者是群体名称，采用中文圣经传统音译，不对其身份或职能作原文没有明说的解释。
- source_word: הָרִאשֹׁנִים
  choice: 首要官员
  rationale: 字面为“居首的／首要的”。在王室语境中应指地位居前的人；译作“首要官员”使现代读者易懂，同时以脚注保留字面含义及其解释空间。
- source_word: לְיַד הַמֶּלֶךְ
  choice: 在王身边
  rationale: 字面是“在王的手边”，可指近身随侍或服务；“在王身边”既自然，也保留空间关系与职务关系之间的含混。
- source_word: וּבְנֵי דָוִיד
  choice: 大卫的众子
  rationale: 直接表达所属关系；“众子”表明复数，并保持庄重简洁。
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 采用通行中文圣经人名音译，并按现代汉语习惯排列父子关系。
theological_decisions:
- issue: 大卫众子的宫廷身份
  choice: 首要官员
  alternative: 居首的人／首领／祭司
  rationale: 原文 הָרִאשֹׁנִים 表示“居首者、首要者”，并未称他们为祭司。历代志平行语境与撒母耳记对应经文的措辞存在张力，因此不引入“祭司”等神学或制度性称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“统管”体现权责但避免过度具体化；群体名沿用通行音译。脚注标记均置于相关分句之后，并保留 הָרִאשֹׁנִים 与 לְיַד 的语义张力。
