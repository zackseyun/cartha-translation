  text: וַ/יָּ֤שֶׂם דָּוִיד֙ בַּ/אֲרַ֣ם דַּרְמֶ֔שֶׂק וַ/יְהִ֤י אֲרָם֙ לְ/דָוִ֔יד עֲבָדִ֖ים נֹשְׂאֵ֣י מִנְחָ֑ה וַ/יּ֤וֹשַׁע יְהוָה֙ לְ/דָוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and the Arameans became David’s servants, bringing tribute[c][b]. And Yahweh gave victory to David wherever he went.
translation:
  language: zh_hans
  text: 大卫在大马士革的亚兰地区设立驻军[a]；亚兰人[b]就成了大卫的臣仆，向他进贡。雅威使大卫无论往哪里去都得胜[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“安置”或“放置”，没有明说所安置的对象；按军事语境可理解为“设立驻军”或“驻扎军队”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“亚兰”；传统上也译作“叙利亚”或“叙利亚人”。此处所指的是亚兰人。
    reason: alternative_reading
  - marker: c
    text: “使……得胜”也可译为“拯救大卫”或“解救大卫”；在这里的战争语境中，意思是雅威使他获得胜利。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 设立驻军
  rationale: 该动词本义是“放置、安置”，原文没有明说宾语；军事语境及平行记载表明所安置的是驻军。正文补出“驻军”以自然传达语境，脚注保留原文简略表达。
- source_word: בַּאֲרָם דַּרְמֶשֶׂק
  choice: 在大马士革的亚兰境内
  rationale: 保留“亚兰”和“大马士革”两个地名，并用现代汉语清楚表达二者的地域关系，避免仅译作“大马士革”而遗漏“亚兰”。
- source_word: אֲרָם
  choice: 亚兰人
  rationale: 此处“亚兰”转指成为大卫臣仆并进贡的群体，因此按所指译为“亚兰人”；脚注说明原文形式及传统译名。
- source_word: עֲבָדִים
  choice: 臣仆
  rationale: עֶבֶד可指奴仆、仆人或臣属；在被征服民族进贡的政治语境中，“臣仆”既保留服事、隶属之意，也不武断限定为私人奴隶。
- source_word: נֹשְׂאֵי מִנְחָה
  choice: 向他进贡
  rationale: 分词结构字面指“带来贡物的人”；在臣属关系中表达持续进献贡物，用“向他进贡”简洁自然。
- source_word: וַיּוֹשַׁע
  choice: 使……得胜
  rationale: ישׁע的使役式基本义为“拯救、解救”；在军事叙事中结果是获得胜利，故正文译为“使……得胜”，并在脚注保留“拯救、解救”的词义可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留其作为上帝专名的性质，而不以称号替代。
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: 无论往哪里去
  rationale: 这是概括大卫一切行动范围的表达；译文保持其宽泛性，不把意思收窄为“出征”或“行军”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。正文用“雅威”音译，以保留专名性质；不以“主”这一称号代替，也不采用较传统但较不贴近该名称古代读音的“耶和华”。
- issue: וַיּוֹשַׁע 在战争语境中的含义
  choice: 使大卫……得胜
  alternative: 拯救大卫；解救大卫
  rationale: 该词本身属于“拯救、解救”的语义范围，但上下文叙述军事征服，故“得胜”自然表达这里的具体效果；脚注明示其较直译的可能，避免抹去救助语义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“臣仆”表达政治臣属关系，避免“奴隶”可能造成的过度限定；“向他进贡”符合现代叙事习惯。“大马士革的亚兰境内”略带历史地理色彩，但能保留原文两个地名及其关系。
