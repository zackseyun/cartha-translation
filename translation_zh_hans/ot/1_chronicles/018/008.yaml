base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/008.yaml
  text: And from Tibhath and from Cun, cities of Hadadezer, David took a very great amount of bronze; with it Solomon made the bronze sea, the pillars, and the bronze articles.
translation:
  language: zh_hans
  text: 大卫从哈达底谢的提巴和均两座城取得了极多的铜；所罗门用这些铜制作了铜海、柱子和铜器。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词在此指用于铸造圣殿器物的铜质材料；现代汉语通常简洁译作“铜”。
- source_word: יָם הַנְּחֹשֶׁת
  choice: 铜海
  rationale: “海”是圣殿大型盛水器的专名性称呼，保留原文意象，并以“铜”说明材质。
- source_word: כְּלֵי הַנְּחֹשֶׁת
  choice: 各样铜器
  rationale: כְּלֵי 可泛指器具；加入“各样”自然表达集合意义而不限定具体种类。
- source_word: בָּהּ
  choice: 用这些铜
  rationale: 阴性单数代词回指集合意义的“铜”；按现代汉语明确回指，表达材料或手段，不改变语义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“夺取”体现战争语境中的 לָקַח；分号保留取得铜材与后来用于圣殿器物之间的紧密关系。专名译作“哈达底谢、提巴、均”。
