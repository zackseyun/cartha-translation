revisions:
- from: 大卫从哈达底谢的城邑提巴和均夺取了极多的铜；所罗门用这些铜铸造铜海、铜柱和各样铜器。
  to: 大卫从哈达底谢的提巴和均两座城取得了极多的铜；所罗门用这些铜制作了铜海、柱子和铜器。
  rationale: 修订以更严格对应本节希伯来文：保留城市名称、所属关系、大量铜材及“用这些铜”的回指；将未受“铜”修饰的“柱子”按原文直译，并以“制作”避免限定工艺。
