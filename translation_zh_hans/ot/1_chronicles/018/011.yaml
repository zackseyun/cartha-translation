base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
translation:
  language: zh_hans
  text: 大卫王也把这些[a]和他从各国取得的[b]金银一同分别为圣，献给雅威；这些金银来自以东、摩押、亚扪人[c]、非利士人和亚玛力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些”指上一节所说的铜器。
    reason: cross_reference
  - marker: b
    text: “取得”的希伯来语也可译作“带走”或“夺取”；这里可指从被征服的各国取得的战利品或贡物。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“亚扪的子孙”，即亚扪人。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֹתָם
  choice: 也把这些
  rationale: “也”承接上一节；“这些”自然地回指上一节的铜器，比单说“它们”更清楚，同时以脚注交代所指。
- source_word: הִקְדִּישׁ
  choice: 分别出来，献给
  rationale: 该词表示将财物分别为圣、归给神；这一表达在现代汉语中清楚自然，并保留奉献和归属的含义。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 直接音译四字神名יהוה，保留经文中的专名性质；介词ל在此表示奉献的对象。
- source_word: עִם הַכֶּסֶף וְהַזָּהָב
  choice: 此外，还有……金银
  rationale: 表达这些铜器与金银一同被献上的并列关系；为使较长的汉语句子流畅，采用自然的续接结构。
- source_word: אֲשֶׁר נָשָׂא
  choice: 他……夺来的
  rationale: נשא本义可指举起、带走；在征战所得的语境中指取走战利品或贡物。“夺来”简洁呈现这种语境，同时用脚注保留较宽的词义。
- source_word: מִכָּל הַגּוֹיִם
  choice: 从各国
  rationale: גוים在这里指周边政治族群或国家；“各国”符合军事与贡物语境。
- source_word: מֵאֱדוֹם וּמִמּוֹאָב וּמִבְּנֵי עַמּוֹן וּמִפְּלִשְׁתִּים וּמֵעֲמָלֵק
  choice: 从以东、摩押、亚扪人、非利士人和亚玛力
  rationale: 采用现代中文圣经中通行的专名形式；对בני עמון用自然的族称“亚扪人”，并以脚注注明其字面形式。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用神的专名יהוה；“雅威”按通常学术重构音译，保留其专名性质，不以称号代替。
- issue: הקדיש所表达的奉献性质
  choice: 分别出来，献给
  alternative: 使之成圣／奉献
  rationale: 原文既有分别为圣、又有归给雅威的含义；译文不进一步规定这些物品后来具体作何礼仪用途。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留历代志叙事的清单式节奏，但以分号和“此外，还有”避免生硬欧化；族名按简体中文通行形式处理。
