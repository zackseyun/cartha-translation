revisions:
- from: 大卫又击败了摩押；摩押人就臣服于大卫，向他进贡。
  to: 大卫攻打摩押；摩押人就成为大卫的臣仆，向他进贡。
  rationale: 修订使军事动词不超出原文的“攻打／击打”范围，并以“成为大卫的臣仆”保留战败者的从属身份；“向他进贡”自然表达携带贡物献上的政治行为。
  reviewer_model: gpt-5.6-terra
