review_pass:
  verdict: revise
  source_fidelity: “击败”比וַיַּךְ（击打、攻打）更明确地断言战果；虽然后文确实说明摩押受制，但宜避免把动词本身译得过强。“臣服于”表达政治结果，却省去了עֲבָדִים“成为……的仆从／臣仆”这一表语。
  naturalness: 原译流畅，但“又”在本节希伯来文本中没有对应词。改为“攻打摩押；摩押人就成为大卫的臣仆，向他进贡”仍属简洁、庄重的现代汉语。
  terminology: “臣仆”在君王与被征服民族的语境中可自然表达עֲבָדִים的从属关系，既不把全体民族不必要地具体化为私人“奴隶”，也不弱化其对大卫的隶属。“进贡”恰当传达נֹשְׂאֵי מִנְחָה。
  issues:
  - severity: medium
    issue: “击败”将“击打／攻打”具体化为“战胜”。
    rationale: נכה的基本叙事动作是击打；上下文可推知胜利，但译文宜保留动词本身的较宽表达。
  - severity: medium
    issue: “臣服于大卫”遗漏“成为大卫的臣仆”的名词性从属表述。
    rationale: עֲבָדִים לְדָוִיד不仅陈述屈服，也描述其成为对大卫负从属义务者；“臣仆”可较完整保留此义。
  - severity: low
    issue: “又”无对应原文。
    rationale: 本节开头只有叙事连接词，汉语可直接起句，无须增添“又”。
  revised_text: 大卫攻打摩押；摩押人就成为大卫的臣仆，向他进贡。
