  text: And he struck Moab[a], and the Moabites became slaves to David, bringing tribute.
translation:
  language: zh_hans
  text: 大卫攻打摩押；摩押人就成为大卫的臣仆，向他进贡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: 击败
  rationale: נכה的基本义是“击打”，但在君王征战的叙事中，以国家为宾语时表示军事打击并战胜；现代汉语用“击败”既自然，也符合上下文。
- source_word: מוֹאָב
  choice: 摩押／摩押人
  rationale: 第一次指作为军事对象的国家“摩押”；第二次虽仍为同一专名，谓语所指则是其人民，译作“摩押人”更合乎汉语。
- source_word: וַיִּהְיוּ
  choice: 就……
  rationale: היה加表语在叙事中可表达进入一种新状态；汉语以“就”衔接征服后的结果，状态变化由整句自然体现。
- source_word: עֲבָדִים לְדָוִיד
  choice: 臣服于大卫
  rationale: עֲבָדִים可指奴仆、臣仆或处于从属地位者。此处是战败民族与君王之间的政治从属关系；“臣服于”既保留受制于人的力度，也避免误解为摩押全体成为私人奴隶。
- source_word: נֹשְׂאֵי מִנְחָה
  choice: 向他进贡
  rationale: נשׂא字面为“带来、携带”，מִנְחָה可指礼物、礼品或贡物；在战败归属的政治军事语境中，合译为“进贡”最为准确自然。
theological_decisions: []
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“臣服”与“进贡”清楚呈现战败后的政治隶属关系，并保留希伯来语叙事的紧凑推进。
