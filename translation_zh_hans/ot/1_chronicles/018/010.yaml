  text: וַ/יִּשְׁלַ֣ח אֶת הֲדֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִיד ל/שאול ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עוּ הָיָ֣ה הֲדַדְעָ֑זֶר וְ/כֹ֗ל כְּלֵ֛י זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/010.yaml
  text: So he sent Hadoram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Tou[d][c][b]; and he sent all kinds of articles of gold and silver and bronze.
translation:
  language: zh_hans
  text: 陀乌就派他的儿子哈多兰去见大卫王，问候他的安好，并为他祝福[a]，因为大卫曾与哈达德以谢交战，击败了他；原来哈达德以谢常与陀乌交战[b]。陀乌又送上各样金、银、铜器[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为他祝福”在这里也可理解为“向他祝贺”。
    reason: 说明ברך在战后外交语境中的语义范围。
  - marker: b
    text: 希伯来文直译近于“哈达德以谢是与陀乌征战的人”；这是习语，意思是哈达德以谢曾与陀乌交战。
    reason: 解释איש מלחמות的习语性表达，避免将其误解为身份称号。
  - marker: c
    text: 希伯来文本此处仅接着说“各样金、银、铜器”，未重复“送上”这个动词；译文根据上下文补出“陀乌又送上”。
    reason: 交代原文省略的动词及中文译文的上下文补足。
lexical_decisions:
- source_word: וַיִּשְׁלַח אֶת הֲדוֹרָם בְּנוֹ
  choice: 陀乌便派他的儿子哈多兰
  rationale: 叙事连续式译为“便派”，自然承接上文；明确保留“他的儿子”这一同位说明。
- source_word: לִשְׁאוֹל לוֹ לְשָׁלוֹם
  choice: 问他是否安好
  rationale: 这是以“平安”表达健康、福祉的希伯来语问候用语；译文既自然，也保留询问对方安好的含义。
- source_word: וּלְבָרֲכוֹ
  choice: 并向他祝福
  rationale: 保留ברך“祝福”的基本意义，同时脚注说明在战后外交语境中也可理解为祝贺。
- source_word: נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: 与哈达德以谢交战，击败了他
  rationale: נכה在军事语境中表示击打并战胜；“击败”避免误示此人已被杀死。
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעוּ הָיָה הֲדַדְעָזֶר
  choice: 原来哈达德以谢一向与陀乌交战
  rationale: “是陀乌的战争之人”是希伯来语习语，表示双方处于战争或敌对关系；“一向”传达היה所描述的持续既往状态。
- source_word: וְכֹל כְּלֵי זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: 还有各种金、银、铜器
  rationale: 原文此处没有明说动词，故正文不补入“送上”或“带着”，以保留句法上的开放性；כְּלֵי按语境译为“器”。
