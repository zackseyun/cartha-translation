translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“问他是否安好”自然表达古代问安用语；人名按希伯来语音译为“陀乌、哈多兰、哈达德以谢”。末句刻意保留原文无动词的简略结构，并以脚注交代上下文所暗示的礼物含义。
