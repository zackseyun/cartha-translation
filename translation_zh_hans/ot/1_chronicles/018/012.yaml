  text: וְ/אַבְשַׁ֣י בֶּן צְרוּיָ֗ה הִכָּ֤ה אֶת אֱדוֹם֙ בְּ/גֵ֣יא הַמֶּ֔לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/012.yaml
  text: And Abishai son of Zeruiah struck down eighteen thousand Edomites in the Valley of Salt[a].
translation:
  language: zh_hans
  text: 洗鲁雅的儿子亚比筛在盐谷击杀了以东人一万八千名。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以东”；这里按战斗语境译为“以东人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשַׁי
  choice: 亚比筛
  rationale: 人名按现代中文圣经惯用形式音译。句首 וְ 表示叙事承接；中文在单节呈现中省略“又”，语意仍自然连贯，避免生硬。
- source_word: בֶּן צְרוּיָה
  choice: 洗鲁雅的儿子
  rationale: 直接保留亲属身份说明，并采用现代中文自然语序。
- source_word: הִכָּה
  choice: 击杀
  rationale: 希伯来语 נכה 在战争语境中表示击打、杀伤；其后有明确人数，“击杀”既保留动作力度，也符合中文军事叙事。
- source_word: אֶת אֱדוֹם
  choice: 以东人
  rationale: 原文直称“以东”，但战斗动词和人数表明所指是以东的人员，而非领土；正文明确译出隐含的人群意义。
- source_word: בְּ/גֵיא הַמֶּלַח
  choice: 在盐谷
  rationale: 按构词直译为“盐谷”，作为地名简洁自然，也保留原文的地点表达。
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: 一万八千名
  rationale: 准确表达十八千；用中文数字书写，并以“名”承接所击杀的人。
theological_decisions:
- issue: 宾语“以东”指人民还是领土
  choice: 以东人
  alternative: 以东（可形式上保留为国名或地域名）
  rationale: 战争动作后紧接一万八千这一人数，语境强烈指向以东人。此处理明示原文隐含意义，同时用脚注说明字面形式，避免掩盖原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。保留人物亲属身份、地点和伤亡数字；人名及地名使用简体中文圣经中通行的形式。
