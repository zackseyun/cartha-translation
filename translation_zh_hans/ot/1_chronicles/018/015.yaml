  text: וְ/יוֹאָ֥ב בֶּן צְרוּיָ֖ה עַל הַ/צָּבָ֑א וִ/יהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד מַזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/015.yaml
  text: And Joab son of Zeruiah was over the army[a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: zh_hans
  text: 洗鲁雅的儿子约押统领军队；亚希律的儿子约沙法任史官[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“书记官”或“记事官”；希伯来语所指的是一名王室官员，负责保存记录，并将有关事务呈报君王。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: 约押
  rationale: 人名按普通话圣经通行形式音译；句首连接词在中文官员名录中不必机械译作“并且”，省略后更自然，名录的承接关系仍由上下文体现。
- source_word: בֶּן צְרוּיָה
  choice: 洗鲁雅的儿子
  rationale: 忠实保留希伯来语的父母系身份说明；这里依原文称约押为洗鲁雅的儿子。
- source_word: עַל הַ/צָּבָא
  choice: 统领军队
  rationale: עַל表示对某领域具有管辖权；“统领军队”以自然现代汉语表达其职权，同时避免生硬直译为“在军队之上”。
- source_word: וִ/יהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用普通话圣经中通行的人名音译；分号已清楚表达名录中并列、承接的关系，故不另译连接词。
- source_word: בֶּן אֲחִיל֖וּד
  choice: 亚希律的儿子
  rationale: 直接保留标准的亲子身份结构，并采用通行音译。
- source_word: מַזְכִּיר
  choice: 史官
  rationale: 该词源自“记念、使人想起”的词根，在王室行政语境中指负责保存记录并将事务呈报君王的官员。“史官”简洁庄重且有传统基础，但不能完全涵盖其职务范围，因此以脚注列出其他可能译法并加以说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简明的官员名录体。以分号呈现两个并列任职陈述；人名使用简体中文圣经常见译名。脚注标记置于其实际说明的“史官”之后，以免误指“军队”。
