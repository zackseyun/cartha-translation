  yaml_path: translation/ot/1_chronicles/018/014.yaml
  text: So David reigned over all Israel[a], and he administered justice and righteousness to all his people.
translation:
  language: zh_hans
  text: 大卫统治全以色列，并且为他的全体百姓秉公行义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “秉公行义”也可译作“施行公平和公义”。这对希伯来词语结合了司法上的公正与道德上的正直，用来描述大卫的治理。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: 统治
  rationale: 该词是 מלך 的 Qal 叙事形式，表示君王执掌王权；“统治”在此自然地表达大卫持续治理国家。
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: 全以色列
  rationale: עַל 与 מלך 连用，标明所统治的范围；“全以色列”简洁保留原文的完整范围。
- source_word: וַיְהִי עֹשֶׂה
  choice: 并且……秉……行……
  rationale: היה 加分词表达持续或惯常的行动；中文以并列谓语自然呈现大卫一贯施政的特点，无需直译为“正在做”。
- source_word: מִשְׁפָּט
  choice: 公
  rationale: 在君王治理的语境中，该词指公正的审断和司法秩序；与“秉”搭配为“秉公”，符合现代汉语表达。
- source_word: וּצְדָקָה
  choice: 义
  rationale: 该词表示正直、公义或合乎正道；与 מִשְׁפָּט 配对译为“秉公行义”，既区分两者，也保留希伯来语对君王正当治理的双重描述。
- source_word: לְכָל עַמּוֹ
  choice: 为他的全体百姓
  rationale: לְ 在此标明施政的受益对象；“他的”保留第三人称单数词尾，“全体百姓”保留 כָּל 与 עַם 的范围和政治共同体含义。
theological_decisions:
- issue: 君王伦理用语 מִשְׁפָּט וּצְדָקָה 的译法
  choice: 秉公行义
  alternative: 施行审判和公义
  rationale: “秉公行义”以自然、庄重的现代汉语同时呈现司法公正与道德正直，又不把两个相近但有别的概念合并成一个；脚注保留更形式对应的译法。
translation_notes:
  register: 采用简洁庄重的现代标准汉语。“秉公行义”是常见且易懂的四字结构，适合概括君王持续、公正的治理；在正文中将脚注标记置于其所说明的词组之后。
