lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听说
  rationale: 未完成式配叙事性 waw 推进情节；本分句为下一节行动提供背景。汉语用“听说”自然表达其后 כִּי 所引出的消息内容。
- source_word: תֹּעוּ
  choice: 陀乌
  rationale: 按《历代志》马所拉文本中的人名形式音译，不以平行经文的异形取代正文。
- source_word: מֶלֶךְ חֲמָת
  choice: 哈马王
  rationale: 以现代汉语简洁表达领属结构，说明陀乌的王位和辖地。
- source_word: כִּי
  choice: （由“听说”引出宾语从句）
  rationale: 此处引出所听见的消息内容；现代汉语无须另译“即”或“因为”。
- source_word: הִכָּה
  choice: 击败了
  rationale: נכה 在军事语境中可指击打、杀伤或打败；因宾语为“全军”，译作“击败”既自然，也避免把经文明确程度扩展为全数杀死。
- source_word: כָּל
  choice: 全
  rationale: 保留原文明确的总括量词。
- source_word: חֵיל
  choice: 军
  rationale: חֵיל 在此军事语境指武装部队；“全军”是自然、清楚的现代汉语。
- source_word: הֲדַדְעֶזֶר
  choice: 哈达底谢
  rationale: 按本节希伯来文 הֲדַדְעֶזֶר 音译该人名，不采用其他文本传统或段落中可能出现的异形。
- source_word: מֶלֶךְ צוֹבָה
  choice: 琐巴王
  rationale: 以汉语常用的“地名＋王”结构表达其称号。
