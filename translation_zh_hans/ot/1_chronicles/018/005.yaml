base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: zh_hans
  text: 大马士革的亚兰人[a]来帮助琐巴王哈达底谢[b]，大卫就击倒了亚兰人两万二千名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大马士革的亚兰地区”。传统译法作“大马士革的叙利亚人”。
    reason: lexical_alternative
  - marker: b
    text: 本节此名作“哈达底谢”；有些平行经文作“哈大利谢”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרַם דַּרְמֶשֶׂק
  choice: 大马士革的亚兰人
  rationale: אֲרַם既可指亚兰地区，也可指亚兰人；在“来帮助”这一动作中，以复数群体“亚兰人”为主语最符合现代汉语，同时避免使用可能让人联想到后世国家的“叙利亚”一词。
- source_word: לַעְזוֹר
  choice: 来帮助
  rationale: עזר意为“帮助、援助”；结合军事语境，“来帮助”自然、准确，也保留原文目的结构。
- source_word: הֲדַדְעֶזֶר
  choice: 哈达底谢
  rationale: 按本节马所拉文本的拼写音译；平行经文中的不同形式另以脚注说明。
- source_word: מֶלֶךְ צוֹבָה
  choice: 琐巴王
  rationale: 以自然简洁的现代汉语表达“琐巴的王”，保留王号与地名。
- source_word: וַיַּךְ
  choice: 击杀
  rationale: נכה在战争语境中可表示击打、击败或杀死；本节紧接具体人数，“击杀”既体现伤亡含义，又符合中文叙事表达。
- source_word: בַּאֲרָם
  choice: 亚兰人
  rationale: 介词ב与群体名称连用，在本句中指大卫所击杀的是亚兰一方的人；译作“亚兰人”最自然。
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: 两万二千名
  rationale: 准确表达原文数字及人数单位；“名”与后接的“亚兰人”搭配自然，不额外加入“士兵”等原文未明说的身份。
