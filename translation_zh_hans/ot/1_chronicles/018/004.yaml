base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
translation:
  language: zh_hans
  text: 大卫从他那里夺取了一千辆战车、七千名骑兵[b]和两万名步兵。大卫砍断了所有战车所用的马的腿筋[a]，只留下可供一百辆战车使用的马。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文作“所有的战车／战车部队”；由于动词意为“砍断腿筋”，这里按转喻理解为战车部队所用的马。
    reason: lexical_alternative
  - marker: b
    text: 撒母耳记下8:4作“一千七百名骑兵”，而本节作“七千名骑兵”；这是平行经文在文本传承中的数字差异。
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: 夺取
  rationale: לכד在军事语境中指攻取或俘获；“夺取”自然涵盖从敌方缴获军力与装备的意思。
- source_word: מִמֶּנּוּ
  choice: 从他那里
  rationale: 希伯来语后缀为阳性单数，承接上文的哈大利谢，保留单数所指。
- source_word: אֶלֶף רֶכֶב
  choice: 一千辆战车
  rationale: רכב可统指战车部队，但与数字连用时译为可数的“战车”最为自然。
- source_word: פָּרָשִׁים
  choice: 骑兵
  rationale: 该词指骑马作战的人；“骑兵”是现代汉语中准确、简明的军事称谓。
- source_word: אִישׁ רַגְלִי
  choice: 步兵
  rationale: 字面为“步行的人”，在军事语境中自然译作“步兵”。
- source_word: וַיְעַקֵּר
  choice: 砍断……腿筋
  rationale: עקר在此指割断马的腿筋，使其不能用于作战；此译具体而清楚。
- source_word: אֶת כָּל הָרֶכֶב
  choice: 所有战车马
  rationale: 原文直译近于“所有战车（部队）”，但“砍断腿筋”的对象只能是马；这里按转喻明示战车部队所属的马，同时用脚注保留原文表达。
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: 只留下可供一百辆战车使用的马
  rationale: 本句承接砍断马腿筋的动作，表示大卫从中保留足供一百辆战车使用的马；汉语补出“马”以避免误解为保留车辆。
