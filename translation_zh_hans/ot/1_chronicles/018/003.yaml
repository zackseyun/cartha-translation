review_pass:
  verdict: revise
  source_fidelity: 需修订。希伯来文包含 חֲמָתָה（“朝/向哈马”），草稿虽保留了该地名，却将其直接处理为“大卫向哈马进军”，从而把原文中方向语与后续“他前去”的指代关系过早落实为大卫的行动。应保留哈马的方向信息，同时避免以中文句法强行判定“他”是谁。
  naturalness: “大卫向哈马进军，攻打……”在现代汉语中通顺，但会使“向哈马”明确修饰大卫。改为在主要动词后以“往哈马方向”补出方向信息，并以独立时间分句保留代词，较自然且更审慎。
  terminology: 人名“哈达德以谢”、地名“琐巴”“哈马”“幼发拉底河”及“确立自己的权势”均可接受。脚注a对《撒母耳记下》平行文本异写的说明恰当；脚注b能交代“立起自己的手”及“恢复控制”的可能含义。
  issues:
  - severity: medium
    issue: “向哈马进军”把方向短语明确归给大卫。
    rationale: 原文在“琐巴王哈达德以谢”后置入 חֲמָתָה，随后才有带第三人称单数后缀的“他前去”。该结构容许不同的句法关联；译文不宜将“向哈马”的行动无歧义地指定为大卫。
  - severity: low
    issue: “当时，他正前往”与“要在那里”可更紧凑。
    rationale: 保留代词不点名是合宜的；将时间从句改为“当他前往……时”，可更贴近不定词构成的时间背景，并保持庄重流畅。
  revised_text: 大卫攻打琐巴王哈达德以谢[a]，往哈马方向；当他前往幼发拉底河、要在那里确立自己的权势[b]时。
  revised_footnotes:
  - marker: a
    text: 本节按《历代志上》的希伯来文本作“哈达德以谢”；平行经文《撒母耳记下》8:3的名字写法略有不同，常译作“哈达以谢”。
    reason: textual_variant
  - marker: b
    text: “确立自己的权势”直译为“立起自己的手”，也可理解为“恢复自己的控制”。
    reason: lexical_alternative
  revision_rationale: 修订保留原文的“往哈马方向”而不把该方向语直接断定为大卫“进军”的路线；同时保留“他”的未点名指代及“确立”而非“恢复”的语义开放性。
