base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/003.yaml
  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
translation:
  language: zh_hans
  text: 大卫攻打琐巴王哈达德以谢[a]，往哈马方向；当他前往幼发拉底河、要在那里确立自己的权势[b]时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节按《历代志上》的希伯来文本作“哈达德以谢”；平行经文《撒母耳记下》8:3的名字写法略有不同，常译作“哈达以谢”。
    reason: textual_variant
  - marker: b
    text: “确立自己的权势”直译为“立起自己的手”，也可理解为“恢复自己的控制”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: 攻打
  rationale: נכה在军事语境中表示击打、攻击。“攻打”既自然地表达军事行动，也不必像“击败”那样断定战果。
- source_word: הֲדַדְעֶזֶר
  choice: 哈达德以谢
  rationale: 按《历代志上》马所拉文本的辅音形式音译，并保留其中的d音；与《撒母耳记下》8:3的异名形式另以脚注说明。
- source_word: מֶלֶךְ צוֹבָה
  choice: 琐巴王
  rationale: 自然、简洁地表达希伯来语的属格结构，即哈达德以谢是琐巴的君王。
- source_word: חֲמָתָה
  choice: 向哈马进军
  rationale: 地名后的方向词尾־ָה通常表示朝向某地。将其与大卫的军事行动连用，可自然表达“往哈马方向”的意思，同时不把哈马说成已经抵达的战场。
- source_word: בְּלֶכְתּוֹ
  choice: 当时，他正前往
  rationale: 介词ב加不定词结构表达同时发生的时间背景。中文保留“他”的指代开放性，不擅自解决原句可能存在的主语歧义。
- source_word: לְהַצִּיב יָדוֹ
  choice: 要在那里确立自己的权势
  rationale: “立起他的手”在军事政治语境中是确立权力或控制的习语；译为“确立自己的权势”比逐字翻译自然，又不强行判定是初次建立还是恢复旧有控制。
- source_word: בִּנְהַר פְּרָת
  choice: 在幼发拉底河
  rationale: נהר פרת明确指幼发拉底河；“在那里”补足自然中文所需的地点关联，不增加新的地理信息。
theological_decisions:
- issue: “他正前往”所指的人物
  choice: 保留代词“他”，不明确点名
  alternative: 明确译为“哈达德以谢正前往”或“大卫正前往”
  rationale: 希伯来语第三人称单数后缀本身不点名，邻近人物和叙事主语可能引发不同理解；正文保留这一真实歧义。
- issue: “确立”还是“恢复”控制
  choice: 正文译“确立自己的权势”
  alternative: “恢复自己的控制”
  rationale: להציב ידו这一习语可指确立或重新确立统治，但本节本身没有明说先前的控制状态，因此不在正文中加入“恢复”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“向哈马进军”表达地名所带的方向词尾；分号划分主要军事行动与其时间背景。代词“他”刻意保留原文可能的指代歧义。
