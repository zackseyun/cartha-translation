  naturalness: 整体庄重自然。“大卫向哈马进军，攻打……”略易使读者将“向哈马”理解为对“进军”的独立补足，而未清楚呈现其与后续行进背景的关系；改为“在向哈马进军时”更顺畅。
  terminology: “哈达德以谢”“琐巴”“哈马”“幼发拉底河”均合适；“确立自己的权势”可保留，并以脚注说明字面表达及“恢复控制”的可能解释。
  issues:
  - severity: medium
    issue: “当时，他正前往”加入了原文未明示的“正”这一进行体意味，且“当时”较松散。
    rationale: בְּלֶכְתּוֹ是“在他去/前往时”的时间性不定式结构；中文宜直接表达其时间关系。代词仍不点明所指，以尽量保留原文在语境中可能产生的指代讨论。
  - severity: low
    issue: “向哈马进军，攻打”中地点短语与动作的关联略显松散。
    rationale: 将其调整为“在向哈马进军时，攻打”可自然表达地名方向词尾所示的行进背景，且不把“哈马”误译为琐巴的同位语。
