base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/043.yaml
  text: And Moza fathered Binea[a], and his son was Rephaiah, his son Eleasah, his son Azel.
translation:
  language: zh_hans
  text: 摩撒生比尼亚；比尼亚的儿子是利法雅[a]，利法雅的儿子是以利亚撒，以利亚撒的儿子是亚悉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“利法雅，他的儿子；以利亚撒，他的儿子；亚悉，他的儿子。”译文补出“是”，并明确各处“他的”所指，以便清楚表达家谱的世代次序。
    reason: 原文采用无系词、重复“他的儿子”的简略家谱句式，中文需要适度补足才能自然清楚。
lexical_decisions:
- source_word: מוֹצָא
  choice: 摩撒
  rationale: 人名按希伯来语马所拉读音音译，并采用现代中文圣经中常见的译名形式。
- source_word: הוֹלִיד
  choice: 生
  rationale: 该词是 ילד 的使役式，在家谱中表示生育或成为某人的父亲；中文家谱惯用“生”，简洁自然。
- source_word: בִּנְעָא
  choice: 比尼亚
  rationale: 按希伯来语马所拉读音音译人名。
- source_word: וּרְפָיָה בְנוֹ
  choice: 比尼亚的儿子是利法雅
  rationale: 原文是无系词的家谱短语，直译近似“利法雅，他的儿子”。中文补出“是”，并明确“他的”所指为比尼亚，使世系清楚而不改变关系。
- source_word: אֶלְעָשָׂה בְנוֹ
  choice: 利法雅的儿子是以利亚萨
  rationale: 延续原文逐代重复“他的儿子”的家谱结构；中文明确前一代人名，以免代词指向含混。
- source_word: אָצֵל בְנוֹ
  choice: 以利亚萨的儿子是亚悉
  rationale: 保留最后一代的父子关系，并按马所拉读音音译人名。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号区分“摩撒生比尼亚”与随后简略的世系链；后半句逐代明说父名，避免连续使用“他的儿子”造成指代不清。
