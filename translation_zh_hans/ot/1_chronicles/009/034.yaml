base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/034.yaml
  text: These were the heads of the fathers’ houses of the Levites[a], according to their generations, heads[b]. These lived in Jerusalem.
translation:
  language: zh_hans
  text: 这些人是利未人各父系家族的族长，按他们的世系，他们都是首领[a]。这些人住在耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”原文与本节前面的“族长”词根相同；原文重复这一词根以加强语气。也可译作“族长”或“首要人物”。“父系家族”指以共同祖先为基础的宗族或家族单位，不只是一个个独立的小家庭。
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: רָאשֵׁי
  choice: 族长
  rationale: 该词在此指位居家族单位之首的人；“族长”既保留其领导身份，也符合《历代志》的谱系和组织语境。
- source_word: הָאָבוֹת
  choice: 父系家族
  rationale: 这里指以祖先血缘为基础的宗族或家族单位，并非单个父亲或普通家庭；“父系家族”在现代汉语中较为清楚。
- source_word: לַלְוִיִּם
  choice: 利未人的
  rationale: 介词在此表达归属关系，说明这些父系家族属于利未人。
- source_word: לְתֹלְדוֹתָם
  choice: 按他们的世系
  rationale: תֹּלְדוֹת在谱系语境中指世代、后裔谱系；“按他们的世系”保留了谱系分类的含义，又不额外断定这是书面名册。
- source_word: רָאשִׁים
  choice: 首领
  rationale: 这是与前面的רָאשֵׁי同根的复现，用同义而自然的“首领”表达其强调作用，避免汉语中生硬重复“头”。
- source_word: יָשְׁבוּ
  choice: 住
  rationale: 此处表示居住状态；“住”是清楚自然的现代汉语，不额外引入迁居或定居过程。
- source_word: בִירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 按标准地名及处所关系翻译。
