  text: וּ/פִֽינְחָ֣ס בֶּן אֶלְעָזָ֗ר נָגִ֨יד הָיָ֧ה עֲלֵי/הֶ֛ם לְ/פָנִ֖ים יְהוָ֥ה עִמּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/020.yaml
  text: And Phinehas son of Eleazar had formerly been chief over them[a]; Yahweh was with him.
translation:
  language: zh_hans
  text: 从前，以利亚撒的儿子非尼哈曾作他们的首领[a]；耶和华与他同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以利亚撒的儿子非尼哈曾作他们的首领；这事是在从前。”希伯来语中“从前”可紧密修饰“曾作首领”，也可理解为修饰整个分句。
    reason: 保留 לְפָנִים 在句中修饰范围的歧义，并以自然现代汉语表达脚注中的替代理解。
lexical_decisions:
- source_word: וּפִינְחָס
  choice: 非尼哈
  rationale: 按现代中文圣经常用形式音译人名；句首连接词在中文中省略，使行文自然，同时不损害上下文的衔接。
- source_word: בֶּן אֶלְעָזָר
  choice: 以利亚撒的儿子
  rationale: 直接表达希伯来语的父子关系，并采用中文常用人名形式。
- source_word: נָגִיד
  choice: 领袖
  rationale: 该词指居于领导、主管地位的人；“领袖”适合此处圣殿职事的语境，也避免“统治者”可能带来的王权意味。
- source_word: הָיָה עֲלֵיהֶם
  choice: 作他们的领袖
  rationale: 以自然中文表达其曾处于领导、管理他们的地位；“他们”承接上文所说的守门人或利未人。
- source_word: לְפָנִים
  choice: 从前
  rationale: 该副词指较早的时期；“从前”简明自然，同时保留其与谓语或整个分句之间可能存在的修饰范围差异。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，不以“主”这一称号替代原文的专名。
- source_word: עִמּוֹ
  choice: 与他同在
  rationale: 忠实保留神同在的表述，不额外解释为帮助、支持或赐福。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，而非“主”的称号；“耶和华”是简体中文读者最熟悉且通行的专名形式，同时保留其作为神名的功能。
- issue: “耶和华与他同在”的含义
  choice: 保持原文简洁陈述
  alternative: 扩译为“耶和华帮助他”或“耶和华赐福给他”
  rationale: “同在”可能蕴含认可、眷顾和支持，但原文没有明确限定这些含义，因此不作解释性扩充。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“作他们的领袖”比“管辖他们”更贴近 נָגִיד 的名词性质，也符合圣殿职事语境；分号呈现两个紧密相关但各自完整的陈述。
