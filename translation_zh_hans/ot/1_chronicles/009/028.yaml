base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/028.yaml
  text: Some of them were in charge of the vessels of service[a], for they brought them in by count and took them out by count.
translation:
  language: zh_hans
  text: 他们中有些人负责管理礼仪所用的器具[a]，因为他们按数目把这些器具领入，也按数目领出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“礼仪用品”或“礼仪中使用的用具”。希伯来语这个词可泛指器皿、用具或器具。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: 他们中有些人
  rationale: 介词 מִן 加代词后缀表示从前述群体中取出一部分；此译法自然表达部分关系。
- source_word: עַל
  choice: 负责管理
  rationale: 此处表示对物品负有监管责任；“负责管理”符合现代汉语行政语境。
- source_word: כְּלֵי הָעֲבוֹדָה
  choice: 礼仪所用的器具
  rationale: כְּלִי 可泛指器皿、用具或器具；הָעֲבוֹדָה 在圣殿语境中指礼仪服事。此译法既保留宽泛含义，也交代用途而不过度技术化。
- source_word: כִּי
  choice: 因为
  rationale: 引出他们负责监管这些器具的理由。
- source_word: בְמִסְפָּר
  choice: 按数目清点
  rationale: 原短语强调按确定数目进行核算和交接；“清点”自然传达库存管理和责任核查之意。
- source_word: יְבִיאוּם
  choice: 领进
  rationale: בוא 的使役形带宾语后缀，意为把它们带进来；此处未完成式描述惯常做法。
- source_word: יוֹצִיאוּם
  choice: 领出
  rationale: יצא 的使役形意为把它们带出去；“领出”与“领进”形成对应，也切合受控交接器具的语境。
