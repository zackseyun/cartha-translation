  text: וַ/אֲחֵי/הֶ֗ם רָאשִׁים֙ לְ/בֵ֣ית אֲבוֹתָ֔/ם אֶ֕לֶף וּ/שְׁבַ֥ע מֵא֖וֹת וְ/שִׁשִּׁ֑ים גִּבּ֣וֹרֵי חֵ֔יל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
translation:
  language: zh_hans
  text: 他们的弟兄[a]，即各父系家族的首领，共有一千七百六十人，都是有勇力的人[b]，承担上帝的殿[c]中的事奉工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“同族人”。希伯来语这个词可指较广的宗族亲属，不一定只是亲兄弟。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“英勇的人”或“能干的人”。这个称号可指勇力或经过证实的能力；本节并不一定表示他们是作战的军人。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“上帝的家”，这里指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 保留希伯来语的亲属称谓及其男性复数形式；在本段族谱和祭司职务的语境中，可指同族的男性亲属，不必限定为亲兄弟。
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: 各父系家族的首领
  rationale: רָאשִׁים表示首领；בֵית אָבוֹת是按父系组织的宗族或家族单位。此译既呈现其行政和族谱意义，也比直译“父家”更易为现代读者理解。
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 一千七百六十人
  rationale: 按希伯来语数词顺序准确合计为1760；补出量词“人”符合现代汉语表达。
- source_word: גִּבּוֹרֵי חֵיל
  choice: 英勇能干的人
  rationale: 该荣誉性短语可表达勇力、才干和可靠的能力；本节语境是圣殿事奉，并非明确描写作战，因此避免译成限定于军事身份的“勇士”，同时保留其褒扬意味。
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: 承担……事奉工作
  rationale: מְלָאכָה表示工作或任务，עֲבוֹדָה表示服事或职务。“事奉工作”保留两个名词的语义，并以“承担”自然表达这些人负责相关职责。
- source_word: בֵית הָאֱלֹהִים
  choice: 上帝殿
  rationale: 原文直义为“上帝的家”，在此明确指圣殿。“上帝殿”保留“殿/家”的意象，也让现代读者清楚所指。
theological_decisions:
- issue: 男性亲属称谓的范围
  choice: 弟兄
  alternative: 同族人
  rationale: 原文使用阳性亲属词，且上下文所述为男性家族首领和祭司人员，因此保留“弟兄”；脚注说明该词也可涵盖较广的同族关系，以免误解为仅指亲兄弟。
- issue: גִּבּוֹרֵי חֵיל是否具有军事含义
  choice: 英勇能干的人
  alternative: 大能的勇士
  rationale: 原短语确有勇武色彩，也可称赞卓越能力；由于此处职责是上帝殿中的事奉，正文不把他们明确限定为战士，同时借“英勇”保留原语的力量感和荣誉性。
- issue: 圣所称谓
  choice: 上帝殿
  alternative: 上帝的家
  rationale: “上帝的家”最贴近字面，但在现代汉语中“上帝殿”更自然，并清楚指向圣殿；脚注保留原文字面意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“父系家族”解释古代以父系为单位的组织方式；“事奉”保留宗教职务语域。“英勇能干”兼顾原文的荣誉性力量表达与非军事的圣殿语境。
