  yaml_path: translation/ot/1_chronicles/009/005.yaml
  text: 'And from the Shilonites: Asaiah the firstborn and his sons[a].'
translation:
  language: zh_hans
  text: 示罗人中有长子亚帅雅和他的众子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示罗人”也可能指“示拉族人”；这是对此宗族名称的另一种传统辨识。
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִן
  choice: ……中有
  rationale: 前缀连词与介词承接上文的名册；汉语用“……中有”自然表达“又从……而来的有”，既保留追加关系，也避免生硬直译。
- source_word: הַ/שִּׁילוֹנִי
  choice: 示罗人
  rationale: 该形式虽为单数族称，但在本名册中具有集合意义，指示罗人这一群体；“示罗”也符合现代中文圣经人名、地名的通行译法。原词也可能被理解为示拉宗族，故以脚注保留这一辨识上的歧义。
- source_word: עֲשָׂיָה
  choice: 亚帅雅
  rationale: 这是人名，采用现代中文圣经中较通行的音译，不翻译其可能的词源含义。
- source_word: הַ/בְּכֹר
  choice: 长子
  rationale: בכור专指首生的儿子；现代汉语“长子”简洁自然，并保留家族次序的含义。
- source_word: וּ/בָנָיו
  choice: 和他的众子
  rationale: בנים在此明确指儿子，而非泛指儿女；“众子”适合家谱名册的庄重语体，并表达未列明人数的复数。
