base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/018.yaml
  text: Until then they were at the king’s gate on the east[b][a]; they were the gatekeepers for the camps of the sons of Levi.
translation:
  language: zh_hans
  text: 直到如今[a]，他们仍在东面的王门；他们是利未子孙的各营[b]的守门人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“直到那时”或“到此时为止”。希伯来语这个说法表示某种情形一直延续到所指的时间点。
    reason: lexical_alternative
  - marker: b
    text: “各营”也可译作“各队”或“各班”。这里的希伯来语既可指营地，也可指有组织的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד הֵנָּה
  choice: 直到那时
  rationale: 这个时间短语表示某种状态持续到一个时间点；结合本段的回顾性叙述，译作“直到那时”自然，同时用脚注保留“直到如今／到此时为止”的可能理解。
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: 在……王门
  rationale: 介词 בְ 在此表地点；“王门”贴近“王的门”这一属格结构，也比“皇家之门”更符合现代汉语圣经叙事的庄重语体。
- source_word: מִזְרָחָה
  choice: 东面的
  rationale: 该词指向东方或位于东方；在这里修饰门的位置，译作“东面的”简明自然。
- source_word: הֵמָּה
  choice: 他们都
  rationale: 独立人称代词带有强调、指认作用；“他们都”在汉语中体现这一强调，而不额外引入新的身份信息。
- source_word: הַשֹּׁעֲרִים
  choice: 守门人
  rationale: 该名词指负责看守门户的人；“守门人”准确、通顺，也符合圣殿职务语境。
- source_word: לְמַחֲנוֹת
  choice: 各营
  rationale: מַחֲנֶה 的基本义是“营”；复数在此也可能指有组织的队伍或班组，因此正文保留具体的“各营”，并在脚注说明组织性译法。
- source_word: בְּנֵי לֵוִי
  choice: 利未子孙
  rationale: 直译为“利未的众子”；“利未子孙”既保留谱系表达，也符合现代汉语习惯，避免直接简化为“利未人”。
