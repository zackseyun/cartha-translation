base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
translation:
  language: zh_hans
  text: 利未人中有示玛雅；他是哈述的儿子，哈述是押利甘的儿子，押利甘是哈沙比雅的儿子。示玛雅是米拉利的子孙。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“从米拉利的众子中”，也可译为“出自米拉利的子孙”。这里的“众子”在宗族谱系中可泛指米拉利的后裔或宗族。
    reason: 更准确反映介词“从／出自”及“众子”在家谱语境中的较宽泛用法。
lexical_decisions:
- source_word: וּמִן
  choice: 中有
  rationale: 前缀连词和介词承接上文名单，表示从利未人这一群体中列出一人；汉语用“利未人中有”自然呈现其增列和归属关系。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是该支派及承担相关职分者的标准现代汉语称呼；定指意义可由语境自然表达。
- source_word: שְׁמַעְיָה
  choice: 示玛雅
  rationale: 按现代中文圣经人名惯例音译。
- source_word: בֶן
  choice: 儿子
  rationale: 在这条家谱链中首先按通常意义译为直接父子关系；通过重复先行词，使现代汉语中的世系关系清楚。
- source_word: חַשּׁוּב
  choice: 哈述
  rationale: 采用通行的现代中文圣经人名译法。
- source_word: עַזְרִיקָם
  choice: 押利甘
  rationale: 采用通行的现代中文圣经人名译法。
- source_word: חֲשַׁבְיָה
  choice: 哈沙比雅
  rationale: 采用通行的现代中文圣经人名译法。
- source_word: מִן בְּנֵי מְרָרִי
  choice: 是米拉利的子孙
  rationale: 该短语说明示玛雅在利未支派内所属的宗族世系。“子孙”既符合现代汉语家谱表达，也保留希伯来语“众子”可指较广后裔群体的用法。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。为避免连续使用“某某之子”造成关系含混，将家谱链展开为重复主语的句式；末句单独说明宗族归属。
