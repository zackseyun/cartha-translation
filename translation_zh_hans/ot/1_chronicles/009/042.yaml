  yaml_path: translation/ot/1_chronicles/009/042.yaml
  text: Ahaz fathered Jarah[a], and Jarah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: zh_hans
  text: 亚哈斯生雅拉[a]；雅拉生亚拉篾、押斯玛威和心利；心利生摩撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《历代志上》8:36的平行家谱作“耶何阿达”，而本节的希伯来文抄本作“雅拉”；正文保留本节的读法。
    reason: textual_variant
lexical_decisions:
- source_word: הוֹלִיד
  choice: 生
  rationale: 在家谱语境中，希伯来语使役式表示男子生育后代。现代汉语家谱通常简洁地用“生”，自然、庄重，也保留父系家谱的表达。
- source_word: יַעְרָה
  choice: 雅拉
  rationale: 按本节马所拉文本所载人名音译，不以平行经文中的异名替换。
- source_word: עָלֶמֶת
  choice: 亚勒篾
  rationale: 希伯来人名音译，采用现代中文圣经人名中清楚而较熟悉的形式。
- source_word: עַזְמָוֶת
  choice: 押玛威
  rationale: 希伯来人名音译；采用中文读者较熟悉的传统形式。
- source_word: זִמְרִי
  choice: 心利
  rationale: 希伯来人名音译；采用中文圣经通行形式。
- source_word: מוֹצָא
  choice: 摩撒
  rationale: 希伯来人名音译；采用自然且易辨认的中文形式。
- source_word: וְ
  choice: 和／；
  rationale: 按汉语表达习惯，在并列人名之间译为“和”，在连续家谱分句间用分号体现其连接作用，避免重复“又”造成生硬。
- source_word: אֶת
  choice: 不另译
  rationale: 这是直接宾语标记，现代汉语没有对应词，其句法作用由语序体现。
