revisions:
- from: 沙龙是可利的儿子、以比雅撒的孙子、可拉的后代；他和同属父家的弟兄，就是可拉族人，负责供职的事务，看守帐幕的门槛[a]。他们的先祖曾负责看守耶和华[b]的营地，把守入口。
  to: 可利的儿子、以比雅撒的孙子、可拉的曾孙沙龙，和他父家中的弟兄，就是可拉族人，负责职役的工作，看守帐幕的门槛[a]。他们的先祖曾监管雅威[b]的营地，把守入口。
  rationale: 修订恢复原文“沙龙和弟兄”共同承担职务的句法关系，准确区分监管营地与把守入口两项职责，并使神名译法与英文POB审校轨迹一致。其余圣所及宗族术语保留草稿的字面取向和庄重语域。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:15Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的主语是“沙龙……和他的弟兄”，两者共同承担职务；草稿先以“沙龙是……”构成完整判断句，随后再接“他和……弟兄，负责”，使句法及共同主语不够清楚。末句的“负责看守……营地”则把“监管营地”和“把守入口”合并为看守营地，宜保留原文两个并列职责。谱系中可拉与沙龙相隔三代，称“曾孙”准确。
  naturalness: 修订后以汉语常见的前置谱系定语表达，并使“沙龙和……弟兄”直接作为全句主语。“负责职役的工作”在庄重现代汉语中自然，也保留“工作／职役”的双重表达。
  terminology: “可拉族人”“帐幕”“门槛”“入口”均可保留。“雅威”与英文审校轨迹中对YHWH的专名音译一致；脚注说明其与传统译名“耶和华”的关系，避免把神名改译为称号。
  issues:
  - severity: medium
    issue: 首句主语及谓语连接不清
    rationale: “沙龙是……；他和……弟兄，负责……”使沙龙的谱系判断与其和弟兄共同任职的原文结构脱节。
  - severity: medium
    issue: “负责看守耶和华的营地”将两项职责混合
    rationale: עַל מַחֲנֵה יְהוָה 表示对营地的监管，而“把守入口”另由重复的“看守者”分词说明；不应将“看守”直接附加于营地。
  - severity: low
    issue: 神名正文译法与英文审校轨迹不一致
    rationale: 英文POB及其神学决定采用“Yahweh”；中文宜以“雅威”对应，并在脚注交代传统“耶和华”译名。
  revised_text: 可利的儿子、以比雅撒的孙子、可拉的曾孙沙龙，和他父家中的弟兄，就是可拉族人，负责职役的工作，看守帐幕的门槛[a]。他们的先祖曾监管雅威[b]的营地，把守入口。
