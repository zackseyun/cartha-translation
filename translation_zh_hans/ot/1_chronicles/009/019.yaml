source:
  edition: WLC
  text: וְ/שַׁלּ֣וּם בֶּן ק֠וֹרֵא בֶּן אֶבְיָסָ֨ף בֶּן קֹ֜רַח וְֽ/אֶחָ֧י/ו לְ/בֵית אָבִ֣י/ו הַ/קָּרְחִ֗ים עַ֚ל מְלֶ֣אכֶת הָ/עֲבוֹדָ֔ה שֹׁמְרֵ֥י הַ/סִּפִּ֖ים לָ/אֹ֑הֶל וַ/אֲבֹֽתֵי/הֶם֙ עַל מַחֲנֵ֣ה יְהוָ֔ה שֹׁמְרֵ֖י הַ/מָּבֽוֹא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/019.yaml
  text: And Shallum son of Kore[a], son of Ebiasaph, son of Korah, and his brothers from his father’s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent; and their fathers had been over the camp of Yahweh[b], keepers of the entrance.
translation:
  language: zh_hans
  text: 可利的儿子、以比雅撒的孙子、可拉的曾孙沙龙，和他父家中的弟兄，就是可拉族人，负责职役的工作，看守帐幕的门槛[a]。他们的先祖曾监管雅威[b]的营地，把守入口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“看守帐幕的门”。希伯来文直译为“看守帐幕的门槛”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”音译希伯来文神名YHWH；传统中文译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁלּוּם
  choice: 沙龙
  rationale: 承接上文的名单；汉语经文中无需机械译出句首连接词，仍保留自然的连续关系。
- source_word: בֶּן קוֹרֵא בֶּן אֶבְיָסָף בֶּן קֹרַח
  choice: 是可利的儿子、以比雅撒的孙子、可拉的后代
  rationale: 希伯来语连续使用“儿子”表达谱系。汉语按世代关系译为“儿子、孙子、后代”，既准确呈现谱系层级，也避免生硬重复；末一项在多代谱系中取“后代”。
- source_word: וְאֶחָיו לְבֵית אָבִיו
  choice: 他和同属父家的弟兄
  rationale: “弟兄”保留男性亲属用语，“同属父家”表达宗族或父系家族归属。
- source_word: הַקָּרְחִים
  choice: 可拉族人
  rationale: 该复数族称指可拉一系的成员；“可拉族人”是清楚自然的现代汉语。
- source_word: עַל מְלֶאכֶת הָעֲבוֹדָה
  choice: 负责供职的事务
  rationale: עַל 表示负责或监管；עֲבוֹדָה 在圣所语境指职役，译作“供职”而不引入后期教会性的“事工”。
- source_word: שֹׁמְרֵי הַסִּפִּים לָאֹהֶל
  choice: 看守帐幕的门槛
  rationale: סִפִּים 直指门槛；אֹהֶל 是帐幕或帐棚。正文保留具体意象，并以脚注说明按职责可理解为守门。
- source_word: וַאֲבֹתֵיהֶם
  choice: 他们的先祖曾
  rationale: 这里回顾早先世代的相同职责；“先祖”比现代汉语中的“父亲们”更准确地传达复数祖辈含义。
- source_word: עַל מַחֲנֵה יְהוָה
  choice: 负责看守耶和华的营地
  rationale: עַל 表示监管责任，מַחֲנֶה 指营地；补出“看守”使汉语与随后分词结构衔接自然。
- source_word: שֹׁמְרֵי הַמָּבוֹא
  choice: 把守入口
  rationale: 重复的分词 שֹׁמְרֵי 表示持续承担守卫职责；“把守入口”符合现代汉语习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式“耶和华”，并用脚注说明其对应希伯来文神名 YHWH。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名 YHWH。正文采用中文传统且广为人知的专名“耶和华”，不以“主”这一称号替代；脚注交代原文形式，以保持透明。
- issue: אֹהֶל 是否译为更具解释性的圣所术语
  choice: 帐幕
  alternative: 会幕
  rationale: 原词本义是帐幕；上下文虽涉及圣所职役，仍不宜直接换成更专门的“会幕”，以免消除原文较宽泛的措辞。
- issue: הַסִּפִּים 是按字面还是按职能翻译
  choice: 门槛
  alternative: 门口／门
  rationale: 正文保留“门槛”的具体词义和原文意象，不把守门职责直接代入名词；脚注提供按语境理解的功能性译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“供职的事务”“把守入口”保留历代志的职务语域，同时避免过度古雅。谱系按汉语亲属层级展开；关键圣所词汇保留原文的具体性，并通过脚注呈现可行的语境译法。
