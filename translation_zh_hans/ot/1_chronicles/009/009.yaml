base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
translation:
  language: zh_hans
  text: 他们的族人[a]，按各自的家谱[b]，共九百五十六人。这些人都是各自父系家族的首领。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“弟兄”；在支派和家谱语境中，这个词也可指同族的人。
    reason: lexical_alternative
  - marker: b
    text: “家谱”也可译作“世系”或“家族记录”。
    reason: lexical_alternative
  - marker: c
    text: 原文的称谓直译近于“父家之首”，指父系家族或宗族的首领。
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: 他们的族人
  rationale: אָח的基本义是“兄弟”，但在支派和家谱语境中可泛指同族男性成员；“族人”在现代汉语中自然，也避免误解为九百多人都是亲兄弟。
- source_word: לְתֹלְדוֹתָם
  choice: 按各自的家谱计算
  rationale: תּוֹלְדוֹת在此指世系、家谱记录；结合后面的总数，用“按各自的家谱计算”清楚表达统计依据。
- source_word: תְּשַׁע מֵאוֹת וַחֲמִשִּׁים וְשִׁשָּׁה
  choice: 九百五十六人
  rationale: 按希伯来文基数词直译，并补出汉语计数所需的“人”。
- source_word: כָּל אֵלֶּה אֲנָשִׁים
  choice: 这些人
  rationale: 上下文所列的是男性家族成员；“这些人”在汉语中已自然承接这一指向，无须生硬译作“这些男人”。
- source_word: רָאשֵׁי אָבוֹת
  choice: 族长
  rationale: 这是《历代志》中父系宗族组织的称谓，指各父系家族的首领；“族长”简洁、自然，并由后文“父系家族”限定其制度含义。
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: 各自父系家族的
  rationale: בֵּית אָבוֹת是以父系血缘组织的家族或宗族单位；此处用所属结构表达这些人担任本族首领。
theological_decisions:
- issue: “兄弟”在家谱语境中的范围
  choice: 正文译作“族人”，脚注保留“弟兄”的直译可能
  alternative: 他们的弟兄
  rationale: 此处很可能指同族男性成员，而非同胞兄弟；保留脚注可呈现希伯来词的基本义与语境延伸义。
- issue: 父系家族称谓的表达
  choice: 父系家族的族长
  alternative: 父家之首
  rationale: 不把古代父系宗族制度神学化，也不将其淡化为泛称“家庭负责人”；以现代可懂的语言保留其社会和家谱性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“按各自的家谱计算”明确总数来自家谱登记；“父系家族的族长”保留古代宗族结构，同时避免“父亲的家”等可能引起的现代家庭含义误读。
