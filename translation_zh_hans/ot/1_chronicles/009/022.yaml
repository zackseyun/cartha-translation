base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/022.yaml
  text: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve[a]. They were enrolled by genealogy in their villages. David and Samuel the seer established them in their office of trust.
translation:
  language: zh_hans
  text: 所有蒙选在各门槛处作守门人的，共有二百一十二人。他们在自己的村庄里按家谱登记。大卫和先见撒母耳设立他们，委以所托付的职务。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫和先见撒母耳因他们的忠信而设立他们”；或：“大卫和先见撒母耳在他们的忠信中设立他们。”
    reason: 原文句末 בֶּאֱמוּנָתָם 可指所托付的职务，也可描述这些守门人的忠信或可靠；该短语的具体关系不完全明确。
lexical_decisions:
- source_word: הַבְּרוּרִים
  choice: 被选
  rationale: 该被动分词表示为某项职责而被挑选的人；“被选”自然、简洁，又不额外限定选任方式。
- source_word: לְשֹׁעֲרִים
  choice: 作守门人
  rationale: שֹׁעֵר 指看守门口或出入口的人；在圣殿职事的语境中，“守门人”准确而通俗。
- source_word: בַּסִּפִּים
  choice: 在各门槛处
  rationale: סַף 的基本含义是门槛或门限，此处指守门人看守的各入口；保留“门槛”比泛译为“门”更贴近原文。
- source_word: מָאתַיִם וּשְׁנֵים עָשָׂר
  choice: 二百一十二人
  rationale: 按原文直译数目，并补出量词“人”，符合现代汉语表达。
- source_word: בְחַצְרֵיהֶם
  choice: 在自己的村庄里
  rationale: חָצֵר 虽可指院落，但在居民登记和聚居地的语境中可指村庄或村落；此处指他们各自居住的地方。
- source_word: הִתְיַחְשָׂם
  choice: 按家谱登记
  rationale: 该词在此表示按照宗族谱系列入记录；“按家谱登记”清楚传达正式的谱系登记。
- source_word: יִסַּד
  choice: 设立
  rationale: יסד 的基本义是奠定、建立；在此行政安排中，“设立”既自然，又避免引入后世宗教任职术语。
- source_word: הָרֹאֶה
  choice: 先见
  rationale: רֹאֶה 是特定的旧称，字面与“看见”有关；采用传统而准确的“先见”，不将其笼统化为“先知”。
- source_word: בֶּאֱמוּנָתָם
  choice: 委以受托的职分
  rationale: אֱמוּנָה 可表示忠信、可靠，也可在本语境中指受信任的职责。正文结合守门职事的行政语境，译出受托职分，同时以脚注保留“因他们忠信”等可能读法。
theological_decisions:
- issue: 句末 בֶּאֱמוּנָתָם 的含义
  choice: 大卫和撒母耳设立他们，委以受托的职分
  alternative: 大卫和撒母耳因他们忠信而设立他们；或：使他们持守忠信
  rationale: 该短语句法紧缩，语义可涵盖受托的职责、忠信或可靠。上下文聚焦守门人的编制和登记，因此正文采用职分性的理解，同时在脚注中保留品格性的理解，不消除原文的歧义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“先见”保留希伯来文对撒母耳所用的特定称号；“按家谱登记”和“受托的职分”则使古代行政与圣殿职事语境易于普通读者理解。
