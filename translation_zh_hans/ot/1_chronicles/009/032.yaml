base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/032.yaml
  text: And some of the sons of the Kohathites[a], from among their brothers, were in charge of the bread of the arrangement, to prepare it Sabbath by Sabbath.
translation:
  language: zh_hans
  text: 他们的弟兄中，有些哥辖子孙负责摆列的饼[a]，每逢安息日预备这些饼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“陈设饼”或“神面前的饼”。希伯来文直指按次序摆放出来的饼。
    reason: 说明传统译名，并保留该希伯来短语中“摆列、安排”的字面含义。
lexical_decisions:
- source_word: וּמִן בְּנֵי הַקְּהָתִי מִן אֲחֵיהֶם
  choice: 哥辖人的子孙中，有些弟兄
  rationale: 两个介词短语带有从群体中选出一部分人的含义。“哥辖人的子孙”保留宗族表达；“有些弟兄”以自然中文表达部分性，并保留“弟兄”这一亲族称谓。
- source_word: עַל
  choice: 负责
  rationale: 此处表示受托管理或承担职责；“负责”符合现代中文行政语境，也不额外强调权力。
- source_word: לֶחֶם הַמַּעֲרָכֶת
  choice: 摆列的饼
  rationale: מַעֲרֶכֶת 指安排、次序或摆列。“摆列的饼”既贴近希伯来文构词，也比单用传统术语“陈设饼”更便于普通读者直接理解。
- source_word: לְהָכִין
  choice: 都要预备
  rationale: 不定式说明其职责的目的或内容。中文根据上下文省略重复宾语“饼”，并用“要”表达所负职责。
- source_word: שַׁבַּת שַׁבָּת
  choice: 每逢安息日
  rationale: 名词重复具有逐次、分配的含义；“每逢安息日”自然表达每一个安息日都如此，而不把它泛化为不明确的“每周”。
