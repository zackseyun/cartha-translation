id: 1CH.9.11
reference: 1 Chronicles 9:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/עֲזַרְיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖יד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
translation:
  language: zh_hans
  text: 还有亚撒利雅，他是希勒家的儿子，希勒家是米书兰的儿子，米书兰是撒督的儿子，撒督是米拉约的儿子，米拉约是亚希突的儿子；亚撒利雅是神殿的主管。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主管”也可译作“领袖”、“首领”或“统管者”。
    reason: 保留 נְגִיד 在领导地位与管理职责之间的词义幅度。
lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: 还有亚撒利雅
  rationale: 前缀 וַ־承接上一节的名单；用“还有”比机械直译为“和”更符合现代汉语列举方式。人名按常见中文圣经译名音译。
- source_word: בֶן
  choice: 是……的儿子
  rationale: 逐层保留家谱中的父子关系。希伯来家谱有时会省略若干代，但本句形式本身是“儿子”，不在正文中改译为“后代”。
- source_word: חִלְקִיָּה / מְשֻׁלָּם / צָדוֹק / מְרָיוֹת / אֲחִיטוּב
  choice: 希勒家／米书兰／撒督／米拉约／亚希突
  rationale: 采用现代简体中文圣经读者熟悉的人名音译。
- source_word: נְגִיד
  choice: 主管
  rationale: 该词指受委任掌权或负责的人。在圣殿行政语境中，“主管”自然表达其管理职责，同时以脚注保留“领袖、首领、统管者”等词义可能。
- source_word: בֵּית הָאֱלֹהִים
  choice: 神殿
  rationale: 原文直译为“神的殿（家）”；“神殿”在现代汉语中简洁自然，也明确指以色列敬拜神的圣所。
theological_decisions:
- issue: 圣所称谓中 אֱלֹהִים 的所指
  choice: 神
  alternative: 诸神
  rationale: 这里所说的是以色列的圣所，אֱלֹהִים 明确指以色列的神；译为单数“神”符合语境。
- issue: נְגִיד 的职分性质
  choice: 主管
  alternative: 领袖、首领或统管者
  rationale: 原词既可突出领导地位，也可突出受命管理的职责。正文采用适合圣殿行政语境的“主管”，但不把它限定为后世某一特定宗教职衔。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。为避免连续五次“……的儿子”造成指代不清，逐代重述父名；分号后重新点明“亚撒利雅”，使其职分归属清楚。
