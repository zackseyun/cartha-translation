  text: וַ/עֲדָיָה֙ בֶּן יְרֹחָ֔ם בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה וּ/מַעְשַׂ֨י בֶּן עֲדִיאֵ֧ל בֶּן יַחְזֵ֛רָה בֶּן מְשֻׁלָּ֥ם בֶּן מְשִׁלֵּמִ֖ית בֶּן אִמֵּֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/012.yaml
  text: and Adaiah son of Jeroham[a], son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.
translation:
  language: zh_hans
  text: 还有耶罗罕的儿子亚大雅；耶罗罕是巴施户珥的儿子，巴施户珥是玛基雅的儿子。又有亚第业的儿子玛赛；亚第业是雅谢拉的儿子，雅谢拉是米书兰的儿子，米书兰是米实利密[a]的儿子，米实利密是音麦的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处作“米实利密”；别处有一个相关的名字形式，通常音译为“米实利末”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲדָיָה
  choice: 还有……亚大雅
  rationale: 前缀ו连接上文名单，译为“还有”；人名按现代中文圣经常用音译处理。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 本节家谱链中直译为“儿子”，既保留希伯来文结构，也不将可能的广义后裔关系擅自具体化为其他称谓。
- source_word: יְרֹחָם
  choice: 耶罗罕
  rationale: 依希伯来语读音并参照现代中文圣经人名惯例音译。
- source_word: פַּשְׁחוּר
  choice: 巴施户珥
  rationale: 依希伯来语读音并参照现代中文圣经人名惯例音译。
- source_word: מַלְכִּיָּה
  choice: 玛基雅
  rationale: 按该希伯来人名的读音音译，保留末尾神名成分所形成的音节。
- source_word: וּ/מַעְשַׂי
  choice: 又有……玛赛
  rationale: 连接词ו译为“又有”，延续名单；מַעְשַׂי按本节较短的名字形式音译为“玛赛”，不与较长的“玛西雅”混同。
- source_word: עֲדִיאֵל
  choice: 亚第业
  rationale: 依希伯来语读音音译。
- source_word: יַחְזֵרָה
  choice: 雅谢拉
  rationale: 依本节马所拉读音音译，不以英语传统中首字母J的拼法为依据。
- source_word: מְשֻׁלָּם
  choice: 米书兰
  rationale: 采用现代中文圣经中较为熟悉的音译形式。
- source_word: מְשִׁלֵּמִית
  choice: 米实利密
  rationale: 按WLC本节所载מְשִׁלֵּמִית的元音形式音译，与别处相关的מְשִׁלֵּמוֹת形式区别开来。
- source_word: אִמֵּר
  choice: 音麦
  rationale: 依希伯来语读音并参照中文圣经传统音译。
theological_decisions: []
