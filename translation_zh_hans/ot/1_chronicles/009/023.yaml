base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/023.yaml
  text: They and their sons were over the gates of the house of Yahweh[a], that is, the house of the tent, as guards.
translation:
  language: zh_hans
  text: 他们和他们的儿子负责看守耶和华的殿，就是帐幕之屋的各门，担任守卫。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐幕之屋”原文直译为“帐棚之屋”；也可译作“会幕”。
    reason: 说明原文不寻常的“屋／帐棚”表达，并保留较通行的替代译法。
lexical_decisions:
- source_word: וְהֵם וּבְנֵיהֶם
  choice: 他们和他们的儿子
  rationale: 保留复指主语及世袭职分中的男性后代之意；“儿子”比泛称“儿女”更符合此处语境。
- source_word: עַל הַשְּׁעָרִים
  choice: 负责守卫……各门
  rationale: עַל在此表示对各门负有管理、看守责任，而不只是身处门旁；译文兼顾职责与实际守卫工作。
- source_word: לְבֵית יְהוָה
  choice: 耶和华殿
  rationale: “殿”自然表达作为圣所建筑的“耶和华的家”；神名按希伯来文专名译作“耶和华”。
- source_word: לְבֵית הָאֹהֶל
  choice: 帐幕之殿
  rationale: 尽量保留原文不寻常的“帐幕之屋／殿”表达，不直接化约为“会幕”，以呈现圣殿与早期帐幕圣所之间的连续性。
- source_word: לְמִשְׁמָרוֹת
  choice: 按班次值守
  rationale: 复数名词可指轮值的守卫班次或值守任务；此译法在现代汉语中清楚自然，并保留复数所暗示的轮班安排。
theological_decisions:
- issue: “耶和华殿”与“帐幕之殿”的关系
  choice: 以“也就是”表达同位解释，同时保留两个称谓
  alternative: 将“帐幕之殿”直接译为“会幕”，或把两者理解为两个不同地点
  rationale: 上下文很可能借帐幕圣所的称谓说明圣殿守门职分的延续性；同位译法符合句法可能性，却不抹去原文刻意并置“殿”与“帐幕”所形成的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“负责守卫”体现监管职责，“按班次值守”交代守卫安排；脚注保留原文措辞的不寻常之处。
