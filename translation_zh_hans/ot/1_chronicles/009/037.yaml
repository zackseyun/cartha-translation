  text: 还有基多、亚希约、撒迦利雅和米基罗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些希伯来人名也可按读音略作不同音译，如“基多”或“革多”，“米基罗”或“米克洛”。正文采用较常见的中文圣经译名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְד֣וֹר
  choice: 还有基多
  rationale: 这是带连接词 וּ 的人名。依照现代中文圣经常用音译译作“基多”；句首结合上下文列名结构，用“还有”自然承接。
- source_word: וְ/אַחְי֔וֹ
  choice: 亚希约
  rationale: 这是带连接词 וְ 的人名，按希伯来语读音音译为“亚希约”。中文并列名单无需在每个人名前重复“和”。
- source_word: וּ/זְכַרְיָ֖ה
  choice: 撒迦利雅
  rationale: 这是带连接词 וּ 的人名；采用现代中文圣经中 זְכַרְיָה 的通行译名“撒迦利雅”，兼顾辨识度与一致性。
- source_word: וּ/מִקְלֽוֹת
  choice: 和米基罗
  rationale: 这是带连接词 וּ 的人名，音译为“米基罗”；末名前用“和”清楚表达希伯来文的并列关系。
