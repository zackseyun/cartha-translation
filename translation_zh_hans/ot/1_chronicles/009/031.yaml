base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/031.yaml
  text: And Mattithiah[a], from the Levites, the firstborn of Shallum the Korahite[b], was entrusted with the work of the flat cakes.
translation:
  language: zh_hans
  text: 利未人中，可拉人沙龙的长子玛他提雅受托[a]负责制作薄饼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忠信地”。希伯来语既可指玛他提雅以忠信可靠的态度履职，也可指他受信任而获委派负责此事。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语指一种饼，可能是在烤盘或鏊上做成的薄饼。
    reason: cultural_note
lexical_decisions:
- source_word: וּמַתִּתְיָה
  choice: 玛他提雅
  rationale: 按现代中文圣经人名的通行音译处理；句首连接词在人员名录的连续语境中不必机械译出。
- source_word: מִן הַלְוִיִּם
  choice: 利未人中
  rationale: מִן在此表示群体归属；“利未人中”简洁自然，也保留“属于利未人群体”的意思。
- source_word: הוּא הַבְּכוֹר לְשַׁלֻּם
  choice: 沙龙的长子
  rationale: הַבְּכוֹר指“头生的、长子”；此处用来说明玛他提雅与沙龙的家族关系。
- source_word: הַקָּרְחִי
  choice: 可拉族
  rationale: 这是表示宗族归属的称谓，译作“可拉族”比逐字译作“可拉人”更清楚地表达家系身份。
- source_word: בֶּאֱמוּנָה עַל
  choice: 受托负责
  rationale: 在职务分配的语境中，בֶּאֱמוּנָה可指可信赖地履职，也可指被交付一项可信任的职责；“受托负责”自然表达后一层意思，同时以脚注保留前一种理解。
- source_word: מַעֲשֵׂה
  choice: 制作
  rationale: מַעֲשֵׂה本义宽泛，可指工作或制作；与食物名称连用时，“制作”最符合现代汉语表达。
- source_word: הַחֲבִתִּים
  choice: 烤饼
  rationale: 该词指一种烘烤或用烤盘制作的饼；“烤饼”保留具体的食物类别，同时避免武断限定其确切炊具或形状。
theological_decisions:
- issue: בֶּאֱמוּנָה所表达的是忠信的履职方式，还是受信任而获委派的职分
  choice: 正文采用“受托”，表达被交付职责
  alternative: “忠信地”或“尽忠地”负责
  rationale: 行政与圣殿职务语境支持“受托掌管”的理解，但希伯来语也确实可以描述玛他提雅忠信可靠的履职方式，因此不在正文中排除另一解释，而以脚注保留。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“受托负责制作”清楚呈现圣殿职务分工；人名与宗族名称采用简体中文圣经读者熟悉的形式。两个脚注标记均紧随所说明的词语，以免产生错指。
