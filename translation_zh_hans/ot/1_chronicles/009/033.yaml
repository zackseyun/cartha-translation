  text: וְ/אֵ֣לֶּה הַ֠/מְשֹׁרְרִים רָאשֵׁ֨י אָב֧וֹת לַ/לְוִיִּ֛ם בַּ/לְּשָׁכֹ֖ת פטירים כִּֽי יוֹמָ֥ם וָ/לַ֛יְלָה עֲלֵי/הֶ֖ם בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/033.yaml
  text: These were the singers[a], heads of fathers’ houses of the Levites, in the chambers, free from other duties, for they were occupied in the work day and night.
translation:
  language: zh_hans
  text: 这些歌唱者是利未人各宗族的族长；他们在各房间里，免除其他职务[a]，因为他们昼夜都担负着这项工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“得以空闲”或“获准免职”。这个希伯来词十分罕见，很可能是说，他们因持续负责歌唱事奉而免除其他职务。
    reason: 说明罕见词 פטירים 的词义不确定性及主要释义。
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: 歌唱者
  rationale: 该词是动词“歌唱”的分词，直接指负责歌唱的人；“乐师”范围较宽。
- source_word: רָאשֵׁי אָבוֹת
  choice: 各宗族的族长
  rationale: 这是《历代志》中常见的宗族组织用语；此译既保留家族群体与首领的含义，也符合现代汉语表达。
- source_word: לַלְוִיִּם
  choice: 利未人的
  rationale: 表明这些宗族首领属于利未人群体。
- source_word: בַּלְּשָׁכֹת
  choice: 在各房间里
  rationale: לשכה 指建筑群中的房间或厢房；原词本身未明说“圣殿”，因此不在正文中补入。
- source_word: פטירים
  choice: 免除其他职务
  rationale: 这是罕见词形，通常理解为“获准免职、被豁免”；上下文表明他们因昼夜承担歌唱工作而不负其他职务。“其他”为语境所隐含，并以脚注标明词义的不确定性。
- source_word: כִּי
  choice: 因为
  rationale: 引出他们获免其他职务的原因。
- source_word: יוֹמָם וָלַיְלָה
  choice: 昼夜
  rationale: 简洁保留原文“白昼和夜晚”的连续时间表达。
- source_word: עֲלֵיהֶם
  choice: 他们……担负着
  rationale: 原义为“在他们身上”，在此表达职责落在他们身上，译作“担负着”自然且保留责任意味。
- source_word: בַּמְּלָאכָה
  choice: 这项工作
  rationale: מלאכה 是一般性的“工作、任务”；用“这项工作”承接上下文，而不把它具体化为原文未明说的某种礼仪职务。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“各宗族的族长”保留历代志的社会组织背景；分号呈现人物身份与其职务安排之间的结构关系。脚注标记紧随其实际对应的罕见词译文，而非置于“歌唱者”之后。
