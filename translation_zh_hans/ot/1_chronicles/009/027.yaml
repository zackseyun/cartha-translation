  text: וּ/סְבִיב֥וֹת בֵּית הָ/אֱלֹהִ֖ים יָלִ֑ינוּ כִּֽי עֲלֵי/הֶ֣ם מִשְׁמֶ֔רֶת וְ/הֵ֥ם עַל הַ/מַּפְתֵּ֖חַ וְ/לַ/בֹּ֥קֶר לַ/בֹּֽקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
translation:
  language: zh_hans
  text: 他们夜宿在神的殿四周，因为守卫的职责在他们身上；他们掌管钥匙[a]，每天早晨开门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们在钥匙之上”，可能指他们保管钥匙，也可能指他们负责开殿门。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְבִיבוֹת
  choice: 在……四周
  rationale: 该词表示周围的区域；“在……四周”自然保留其空间含义。
- source_word: בֵּית הָאֱלֹהִים
  choice: 神的殿
  rationale: 原文直译为“神的家/房屋”，在此指圣殿建筑群；“神的殿”既符合现代汉语宗教语境，也没有超出上下文作更具体的限定。
- source_word: יָלִינוּ
  choice: 夜宿
  rationale: 该动词指留宿或过夜；“夜宿”简洁表达他们在殿周围过夜值守的情境，并不武断译成“睡觉”。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出他们夜宿于此的原因，译作“因为”清楚保留因果关系。
- source_word: עֲלֵיהֶם מִשְׁמֶרֶת
  choice: 守卫的职责在他们身上
  rationale: 尽量保留“守卫之责在他们身上”的希伯来语表达，同时自然传达所受托付和责任。
- source_word: וְהֵם עַל הַמַּפְתֵּחַ
  choice: 他们掌管钥匙
  rationale: 较贴近原文“他们在钥匙之上”，表达钥匙由他们保管或开门事务由他们负责，并保留两种理解的空间。
- source_word: וְלַבֹּקֶר לַבֹּקֶר
  choice: 每天早晨
  rationale: 重复“早晨”表示规律性的每日行动；现代汉语用“每天早晨”自然传达这种反复性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“守卫的职责在他们身上”略带原文句式色彩，以保留受托责任的分量；“掌管钥匙”避免直接消除原文在保管钥匙与负责开门之间的含义张力。末尾“开门”是依据上下文补出的省略动作。
