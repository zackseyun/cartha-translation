  verdict: revise
  source_fidelity: 译文总体准确反映了按谱系登记、文献记载、犹大遭强制迁徙至巴比伦，以及因其背信而受此结果。惟“他们都记载在……”在中文中缺少被动或存录表达，容易被理解为“他们记载了……”，未充分呈现כְּתוּבִים的被动、存录状态。
  naturalness: “以色列众人”“看哪”“被掳”均属庄重而可理解的现代中文圣经叙事语体；但“他们都记载在《……》上”不够自然。改为“他们都记在《……》上”既自然，也保留原文的存录状态。将末句以分号相连，更贴合希伯来文连续句法。
  terminology: “按家谱登记”准确；“不忠”可传达מַעַל所含背信、失信之意，且不在正文过度释义。“犹大”作为集体名称比“犹大人”更直接保留原文对犹大实体的指称，并仍可在中文中自然表达其人民被掳。
