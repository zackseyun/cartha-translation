revisions:
- from: 以色列众人都按家谱登记[a]；看哪，他们都记载在《以色列诸王记》上。犹大人因自己的不忠[b]被掳到巴比伦。
  to: 全以色列人都按家谱登记[a]；看哪，他们都记在《以色列诸王记》上；犹大因自己的不忠[b]被掳到巴比伦。
  rationale: 修订“记载在”为“记在”，使中文准确而自然地表达被动分词所示的文献存录状态；将“犹大人”改为“犹大”，保留原文的集体指称。其余关键用语及脚注均维持原译对原文的忠实表达。
