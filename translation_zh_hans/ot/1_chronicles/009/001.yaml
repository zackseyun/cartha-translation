    issue: “他们都记载在《以色列诸王记》上”缺少自然的被动／存录表达。
    rationale: כְּתוּבִים是被动分词，意为“被写下、记载着”。中文以人作主语时，“记载在”通常需要“被”或改作“记在”；“他们都记在……上”最简洁自然。
  - severity: low
    issue: “犹大人”较原文的集体名词“犹大”略窄。
