  text: וְ/כָל יִשְׂרָאֵל֙ הִתְיַחְשׂ֔וּ וְ/הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֖פֶר מַלְכֵ֣י יִשְׂרָאֵ֑ל וִ/יהוּדָ֛ה הָגְל֥וּ לְ/בָבֶ֖ל בְּ/מַעֲלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
translation:
  language: zh_hans
  text: 全以色列人都按家谱登记[a]；看哪，他们都记在《以色列诸王记》上；犹大因自己的不忠[b]被掳到巴比伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按宗族世系登记”，或“列入家谱”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“背信”或“失信”。希伯来语原词常指破坏忠诚关系，尤其可指对上帝不忠。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  choice: 按家谱登记
  rationale: 该词的 Hitpael 形式指确认并记录宗族世系，不只是点算人数；“按家谱登记”兼顾谱系与登记的含义。
- source_word: וְהִנָּם
  choice: 看哪，他们
  rationale: 保留希伯来文引人注意、郑重指出下文的呈现功能；“看哪”虽略显庄重，却仍是现代中文可理解的圣经叙事用语。
- source_word: כְּתוּבִים עַל סֵפֶר
  choice: 记载在……记上
  rationale: 被动分词表达已载于文献中的状态；中文以“记载在”自然传达这一含义，而不拘泥于介词的字面形式。
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王记》
  rationale: 上下文将其作为一部可辨识的文献或档案名称，故采用书名号；“诸王”准确表达复数。
- source_word: הָגְלוּ
  choice: 被掳
  rationale: Hofal 形式具有使役被动含义，表明犹大遭到强制迁移；“被掳”简洁保留被动和审判语境。
- source_word: לְבָבֶל
  choice: 到巴比伦
  rationale: 自然表达被掳所至的目的地。
- source_word: בְּמַעֲלָם
  choice: 因自己的不忠
  rationale: מַעַל 表示失信、背信或严重违背忠诚，常含对上帝盟约不忠的意味；“不忠”保留这一关系性含义，又不过度解释。
theological_decisions:
- issue: בְּמַעֲלָם 所指罪行的性质
  choice: 不忠
  alternative: 过犯；背信；失信
  rationale: 原词不只是泛指违法，也常指对上帝的背信。译作“不忠”保留盟约关系层面的张力，却不在正文中增添“盟约”一词。
- issue: הָגְלוּ 的语态
  choice: 被掳到巴比伦
  alternative: 流亡到巴比伦；去了巴比伦
  rationale: Hofal 形态表明犹大承受了被迁徙的行动；被动译法避免把这次放逐说成主动离去。
- issue: וִיהוּדָה 的集体所指
  choice: 犹大人
  alternative: 犹大
  rationale: “犹大”在此集体指犹大国及其人民；中文译作“犹大人”使被掳的主体自然清楚，同时不改变其集体含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“看哪”保留原文的强调标记；“被掳”沿用普通读者熟悉的圣经历史用语。标点将登记与文献记载紧密相连，并另起一句呈现犹大被掳的结果。
