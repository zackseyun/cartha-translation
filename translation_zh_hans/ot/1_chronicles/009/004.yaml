base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/004.yaml
  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
translation:
  language: zh_hans
  text: 乌太是亚米忽的儿子，亚米忽是暗利的儿子，暗利是音利的儿子，音利是巴尼[a]的儿子；乌太是犹大之子法勒斯的后裔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来文本较难确定。译作“巴尼”的词也可能读作“从”；若采用这一读法，本句便是：“乌太是亚米忽的儿子，亚米忽是暗利的儿子，暗利是音利的儿子；乌太是犹大之子法勒斯的后裔。”正文采用人名“巴尼”，因为这更符合上下文连续列举家谱名字的结构。
    reason: textual_variant
lexical_decisions:
- source_word: עוּתַי
  choice: 乌太
  rationale: 按现代中文圣经人名的通行音译处理，保留其专名性质。
- source_word: בֶּן
  choice: 是……的儿子
  rationale: 在家谱中直译为“儿子”，既保留原文反复串联的结构，也不排除希伯来家谱可能省略若干代的用法。
- source_word: עַמִּיהוּד
  choice: 亚米忽
  rationale: 采用现代中文圣经传统中易辨认的音译。
- source_word: עָמְרִי
  choice: 暗利
  rationale: 采用现代中文圣经传统中的通行音译。
- source_word: אִמְרִי
  choice: 音利
  rationale: 采用现代中文圣经传统中的通行音译，并与“暗利”区分。
- source_word: בני/מן
  choice: 巴尼
  rationale: 正文按家谱人名理解，使连续的“某某的儿子”结构完整；鉴于所据希伯来文本的读法存在困难，另在脚注保留“从”的可能。
- source_word: בְּנֵי
  choice: 子孙
  rationale: 此处指法勒斯的宗族或后裔群体，译作“子孙”比字面上的“众子”更符合现代汉语家谱表达。
- source_word: פֶרֶץ
  choice: 法勒斯
  rationale: 采用现代中文圣经传统中的通行音译。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中的通行音译；此处指法勒斯的父系来源。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免一长串“……之子”造成歧义，将希伯来文的家谱链逐层展开；分号区分直系名字链与宗族归属。脚注标记紧随实际涉及异文的“巴尼”，而不是置于其他人名之后。
