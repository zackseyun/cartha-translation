lexical_decisions:
- source_word: וּבְנֵי
  choice: 的儿子是
  rationale: 该词由连接词ו和“儿子”的复数构造形式组成，用来引出下一支家谱。中文以“米迦的儿子是”自然表达这一家谱公式；本节单独成句时不必机械译出句首连接词。
- source_word: מִיכָה
  choice: 米迦
  rationale: 人名，采用现代中文圣经中通行且易于辨识的音译。
- source_word: פִּיתוֹן
  choice: 比敦
  rationale: 人名，按希伯来语读音音译，并采用中文圣经传统中常见的形式。
- source_word: וָמֶלֶךְ
  choice: 米勒
  rationale: 人名מֶלֶךְ在此不是普通名词“王”，而是家谱中的专名；采用通行音译。其前的连接词在中文列举结构中不逐项重复。
- source_word: וְתַחְרֵעַ
  choice: 和他利亚
  rationale: 人名，采用通行中文音译；前置连接词ו译为“和”，自然标示名单最后一项。
