base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/003.yaml
  text: And in Jerusalem some from the sons of Judah, and some from the sons of Benjamin, and some from the sons of Ephraim and Manasseh, lived there.
translation:
  language: zh_hans
  text: 住在耶路撒冷的，有一些犹大子孙、便雅悯子孙，以及以法莲和玛拿西的子孙。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“从犹大子孙中……从便雅悯子孙中……从以法莲子孙和玛拿西中。”末一项的“子孙”承接自“以法莲子孙”，也适用于玛拿西。
    reason: 说明原文反复使用“从”来表达各支派中的部分成员，并准确交代末项省略“子孙”的结构。
lexical_decisions:
- source_word: וּ/בִ/ירוּשָׁלִַם
  choice: 住在耶路撒冷的
  rationale: 将地点短语与动词合并为现代汉语自然的主题结构；上下文承接关系不必机械译出前缀连词“并且”。
- source_word: יָשְׁבוּ
  choice: 住
  rationale: ישב在此指居住；“住”简洁自然，比“居住”稍口语而仍庄重，也不额外强调初次定居。
- source_word: מִן
  choice: 有一些
  rationale: 反复出现的מִן表示居民来自各支派，并非全体支派成员；“有一些”补足汉语句法，同时保留部分成员之意。
- source_word: בְּנֵי יְהוּדָה
  choice: 犹大子孙
  rationale: 保留历代志中בני加祖名的宗族、支派表达，又符合现代中文圣经语体。
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯子孙
  rationale: 与“犹大子孙”保持平行，保存原文的族谱性表达。
- source_word: בְּנֵי אֶפְרַיִם
  choice: 以法莲……的子孙
  rationale: 按原文的בני保留“子孙”概念，并使各支派名称的列举清楚。
- source_word: וּ/מְנַשֶּׁה
  choice: 和玛拿西的子孙
  rationale: 原文在“玛拿西”前没有重复בני，但该词的语义由前面的“以法莲子孙”自然延及玛拿西；中文补出“的子孙”可避免误读为玛拿西本人。
