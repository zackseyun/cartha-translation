  yaml_path: translation/ot/1_chronicles/009/024.yaml
  text: 'The gatekeepers were at the four directions: east[a], west, north, and south.'
translation:
  language: zh_hans
  text: 守门人分布在四方[a]：东、西、北、南。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“四风”；这里的“风”指四个方向。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: 分布在四方
  rationale: 介词לְ在此结合数词表达分配或方位；רוּחוֹת字面为“风”，但随后列出四个方位，因此整体自然译为“分布在四方”，既交代守门人的位置，也不过度强化“驻守”的含义。
- source_word: יִהְיוּ
  choice: 分布在
  rationale: 该动词基本义为“是、在”；结合守门人的语境，用“分布在”自然表达其处于各方，但不额外加入原文未明说的任命或驻扎概念。
- source_word: הַשֹּׁעֲרִים
  choice: 守门人
  rationale: 指负责看守门户的人；“守门人”是现代汉语中简洁、清楚且符合圣殿语境的译法。
- source_word: מִזְרָח
  choice: 东
  rationale: 在四个基本方位的列举中，直接译为“东”。
- source_word: יָמָּה
  choice: 西
  rationale: 该词从“海”衍生，字面可指“向海”；在以色列地理及四方并列语境中通常表示西方。
- source_word: צָפוֹנָה
  choice: 北
  rationale: 方向形式，在方位列表中自然译为“北”。
- source_word: וָנֶגְבָּה
  choice: 南
  rationale: נֶגֶב可指南地，也可表示南方；因本节依次列举基本方位，此处译为“南”，而非特定地区“南地”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简明的叙事语言。“东、西、北、南”符合现代汉语列举方位的习惯；用“分布在”避免生硬的“在四个方向”，同时保持原文只陈述位置的克制。
