base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/002.yaml
  text: The first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
translation:
  language: zh_hans
  text: 最先住在自己的产业和城邑中的，是以色列人、祭司、利未人和殿役[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿役”或音译为“尼提宁人”，指被指派承担圣殿服役的一类人。
    reason: 提供传统音译，并说明该群体的职能。
lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים הָרִאשֹׁנִים
  choice: 最先住在……中的
  rationale: יֹשְׁבִים是表示居住者的分词，רִאשֹׁנִים意为“最先的／第一批的”。合译为“最先住在……中的”，在现代汉语中自然，并保留原文所指最早一批居民的意味。句首וְ按汉语叙事习惯不另译为“现在”。
- source_word: אֲשֶׁר
  choice: ……中的
  rationale: 希伯来语关系词引出修饰“居民”的从句；汉语采用“住在……中的”来表达同一关系。
- source_word: בַּאֲחֻזָּתָם
  choice: 在自己产业上
  rationale: אֲחֻזָּה指所持有的土地或世袭产业。“产业”保留其土地权属含义，“自己”自然表达第三人称复数所属关系。
- source_word: בְּעָרֵיהֶם
  choice: 自己城邑中
  rationale: עָרִים指有人定居的城镇。“城邑”适合历史叙事语体，也保留“他们的”这一所属关系。
- source_word: יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处יִשְׂרָאֵל与祭司、利未人和殿役并列，指以色列民这一群体；汉语译为“以色列人”可清楚表达群体所指。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 这是כֹּהֵן复数定冠词形式的标准译法。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 标准译名，并保留其与祭司有别的群体身份。
- source_word: וְהַנְּתִינִים
  choice: 和殿役[a]
  rationale: נְתִינִים是承担圣殿服役工作的特定群体。“殿役”简洁说明其职分；传统音译另列脚注。
theological_decisions:
- issue: יִשְׂרָאֵל与其后三类人的句法关系
  choice: 按四个并列群体表达：“以色列人、祭司、利未人和殿役”
  alternative: 把“以色列”理解为统摄其后三类人的总称
  rationale: 原文以并列名词列举这些群体，未明说后三类与“以色列”之间是包含关系还是附加关系；正文保持并列结构，不替原文消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。“城邑”与“产业”保留经文的土地和定居语境；句式尽量贴近希伯来语列举结构，同时符合现代汉语表达。脚注标记置于其实际所释的“殿役”之后。
