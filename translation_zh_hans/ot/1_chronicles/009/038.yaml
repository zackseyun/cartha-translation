base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/038.yaml
  text: Mikloth fathered Shimeam[a]. They also lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: zh_hans
  text: 米基罗生了示米暗[a]。他们也住在耶路撒冷，在弟兄们对面[b]，与弟兄们同住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“示米暗”；有些译本作“示米亚”，可能是为与平行家谱中的名字形式一致。
    reason: alternative_reading
  - marker: b
    text: “在弟兄们对面”也可译作“在弟兄们前面”或“在弟兄们附近”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: 米基罗
  rationale: 专名按现代中文圣经中较熟悉的音译形式处理；词首连接词由上下文承接，不另译为“而”。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 在家谱语境中，Hifil词形表示生育、成为父亲；“生了”简洁自然，并保留父系家谱关系。
- source_word: אֶת שִׁמְאָם
  choice: 示米暗
  rationale: 直接宾语标记不译；人名依本节马所拉文本的辅音形式音译，不与平行家谱形式强行协调。
- source_word: וְאַף הֵם
  choice: 他们也
  rationale: “也”保留וְאַף的附加、强调意味，中文无需在新句句首机械加“并且”。
- source_word: נֶגֶד
  choice: 在……对面
  rationale: 保留该词主要的空间对应含义，同时以脚注说明“在……前面／附近”等可能理解。
- source_word: אֲחֵיהֶם
  choice: 弟兄们
  rationale: 直译亲属称谓；家谱语境中也可能泛指同族男性亲属，但正文不扩大其含义。
- source_word: יָשְׁבוּ
  choice: 住
  rationale: 此处指居住状态；“住”是自然、现代的中文表达。
- source_word: בִירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 保留地点介词，并采用通行地名译法。
- source_word: עִם אֲחֵיהֶם
  choice: 与弟兄们同住
  rationale: 表达עִם的共同、相伴关系；保留原文再次出现“弟兄们”的重复，以呈现其强调效果。
theological_decisions: []
