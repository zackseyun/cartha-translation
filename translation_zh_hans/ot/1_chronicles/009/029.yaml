  text: וּ/מֵ/הֶ֗ם מְמֻנִּים֙ עַל הַ/כֵּלִ֔ים וְ/עַ֖ל כָּל כְּלֵ֣י הַ/קֹּ֑דֶשׁ וְ/עַל הַ/סֹּ֨לֶת֙ וְ/הַ/יַּ֣יִן וְ/הַ/שֶּׁ֔מֶן וְ/הַ/לְּבוֹנָ֖ה וְ/הַ/בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/029.yaml
  text: And some of them were appointed over the vessels[a], over all the holy vessels, and over the fine flour, the wine, the oil, the frankincense, and the spices.
translation:
  language: zh_hans
  text: 他们中有些人受委派管理器具和一切圣所器具，以及细面、酒、油、乳香和香料。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵהֶם
  choice: 他们中有些人
  rationale: 保留介词 מן 的部分含义，表明这些人是从前述群体中选出的；现代汉语自然明晰。
- source_word: מְמֻנִּים עַל
  choice: 受委派管理
  rationale: 被动分词表示被指派承担职责，עַל 则标明其负责管理的对象；合译可自然保留委任与责任两层意思。
- source_word: הַכֵּלִים
  choice: 器具
  rationale: כְּלִי 是涵盖器皿、用具或物件的广义词；“器具”适合圣所语境，又不把范围缩窄为容器。
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: 所有圣所的器具
  rationale: הַקֹּדֶשׁ 可指神圣领域或圣所；结合圣殿职务语境译作“圣所”，同时以脚注保留“圣器具”这一结构上的可能译法。
- source_word: הַסֹּלֶת
  choice: 细面
  rationale: סֹלֶת 特指献祭所用的精细面粉；“细面”是简洁且为普通读者可懂的礼仪语境用语。
- source_word: הַיַּיִן
  choice: 酒
  rationale: 直接对应原词，不额外限定其用途或种类。
- source_word: הַשֶּׁמֶן
  choice: 油
  rationale: 原文未明确说橄榄油，因此不作超出文本的具体化。
- source_word: הַלְּבוֹנָה
  choice: 乳香
  rationale: לְבוֹנָה 特指乳香，不宜泛化为一般的香。
- source_word: הַבְּשָׂמִים
  choice: 香料
  rationale: 该词泛指芳香物质；“香料”自然并适合圣所制备用品的语境。
theological_decisions:
- issue: כְּלֵי הַקֹּדֶשׁ 中 הַקֹּדֶשׁ 的所指
  choice: 圣所的器具
  alternative: 圣器具
  rationale: 构造短语既可理解为所属关系“圣所的器具”，也可理解为性质关系“神圣的器具”。正文采用符合历代志圣殿语境的前者，脚注保留后者，避免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“受委派管理”清楚表达职责关系；物资清单保持原文简洁的并列结构。
