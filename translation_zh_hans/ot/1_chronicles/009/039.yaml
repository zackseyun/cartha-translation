  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/039.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: zh_hans
  text: 尼珥生基士，基士生扫罗，扫罗生约拿单、麦基舒亚、亚比拿达和伊施巴力[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊施巴力”在《撒母耳记下》2:8及相关经文中称为“伊施波设”。
    reason: 说明同一人物在另一组经文中的异名，避免读者误认为是两个人；正文仍忠实保留《历代志》的名称。
lexical_decisions:
- source_word: הוֹלִיד
  choice: 生
  rationale: 在家谱语境中，希伯来语使役形表示“生了、成为……的父亲”。现代汉语家谱常用简洁的“生”，既自然又准确。
- source_word: נֵר
  choice: 尼珥
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: קִישׁ
  choice: 基士
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用中文读者熟悉的传统译名。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用中文读者熟悉的传统译名。
- source_word: מַלְכִּי שׁוּעַ
  choice: 麦基舒亚
  rationale: 这是一个复合人名；采用中文圣经中通行的连写形式。
- source_word: אֲבִינָדָב
  choice: 亚比拿达
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֶשְׁבָּעַל
  choice: 伊施巴力
  rationale: 严格依照《历代志》希伯来文本的人名 אֶשְׁבָּעַל 翻译，不以《撒母耳记》的异名代替；相关异名在脚注说明。
- source_word: וְ
  choice: 并列与顺承关系
  rationale: 前两处通过逗号呈现家谱的连续推进，末项用“和”连接，使中文自然，同时保留原文的并列关系。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，现代汉语没有对应词，其语法功能已由句法体现。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留家谱句式的节奏。脚注标记置于其实际说明的“伊施巴力”之后；英文咨询稿中标记虽出现在“基士”后，但脚注内容明确涉及伊施巴力。
