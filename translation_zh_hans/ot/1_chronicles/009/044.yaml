base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/044.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
translation:
  language: zh_hans
  text: 亚悉有六个儿子，名字是：亚斯利干，他的长子；以实玛利、示亚利雅、俄巴底雅和哈难[a]。这些都是亚悉的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语按马所拉元音标注为“他的长子”，指亚斯利干。其辅音也可读作人名“波基路”；历代志上8:38的平行名单在此位置有该人名。若作人名，本节便列出六个名字，与“六个儿子”相符。
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: וּלְאָצֵל שִׁשָּׁה בָנִים
  choice: 亚悉有六个儿子
  rationale: 介词 לְ 用于家谱句式时表示归属或亲子关系；译为“有”符合现代汉语习惯，同时保留“儿子”的性别所指。
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: 他们的名字是
  rationale: 复数代词后缀指前述六个儿子；这一表达自然引出名单。
- source_word: עַזְרִיקָם
  choice: 亚斯利干
  rationale: 采用现代中文圣经读者较熟悉的音译形式。
- source_word: בֹּכְרוּ
  choice: 波基路
  rationale: 按专名处理。该词位于姓名名单中，且历代志上8:38的平行家谱在相同位置列出同名者；如此也与正文所说的“六个儿子”相符。
- source_word: יִשְׁמָעֵאל
  choice: 以实玛利
  rationale: 采用通行中文圣经人名译法。
- source_word: שְׁעַרְיָה
  choice: 示亚利雅
  rationale: 采用较熟悉且能反映希伯来语读音的中文音译。
- source_word: עֹבַדְיָה
  choice: 俄巴底雅
  rationale: 采用通行中文圣经人名译法。
- source_word: חָנָן
  choice: 哈难
  rationale: 采用通行中文圣经人名译法。
- source_word: אֵלֶּה בְּנֵי אָצַל
  choice: 这些都是亚悉的儿子
  rationale: 保留原文总结性的家谱句式，并重复“亚悉”以维持清晰度。
