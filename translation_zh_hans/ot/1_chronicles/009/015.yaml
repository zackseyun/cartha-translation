  text: and Bakbakkar[a], Heresh, and Galal, and Mattaniah son of Mica, son of Zichri[b], son of Asaph.
translation:
  language: zh_hans
  text: 还有拔巴甲、黑勒施、迦拉，以及亚萨的儿子细基利的儿子米迦[b]的儿子玛探雅[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子”所对应的希伯来语有时也可指较远的后代；本节按家谱链的字面形式翻译。
    reason: lexical_alternative
  - marker: b
    text: 本处“米迦”的希伯来文拼写与更常见的先知米迦之名略有不同，中文音译则相同。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַקְבַּקַּר
  choice: 还有拔巴甲
  rationale: 前缀ו承接上文的利未人名单；译作“还有”比逐项重复“和”更符合现代汉语列举习惯。人名按传统中文圣经音译作“拔巴甲”。
- source_word: חֶרֶשׁ
  choice: 黑勒施
  rationale: 按希伯来语辅音形式音译，并采用中文圣经中较为通行的人名形式。
- source_word: וְגָלָל
  choice: 迦拉
  rationale: 人名采用通行音译；其连接词在汉语并列结构中由顿号自然表达，不另行重复译出。
- source_word: וּמַתַּנְיָה
  choice: 以及玛探雅
  rationale: 译出连接词以标明名单最后一项，并采用通行的中文人名音译。
- source_word: בֶּן
  choice: ……的儿子
  rationale: בן在家谱中也可能泛指后代，但本节连续三次构成直列家谱，正文按通常直接意义译为“儿子”，同时以脚注保留较广的语义可能。
- source_word: מִיכָא
  choice: 米迦
  rationale: 按本处人名音译。其希伯来文形式מיכא与更常见的先知名מיכה拼写不同，但现代中文通常都译作“米迦”，故用脚注提示。
- source_word: זִכְרִי
  choice: 细基利
  rationale: 采用中文圣经传统中易于辨认的音译形式。
- source_word: אָסָף
  choice: 亚萨
  rationale: 采用现代中文圣经中通行的人名形式。
