base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/017.yaml
  text: And the gatekeepers were Shallum[a], Akkub, Talmon, Ahiman, and their brothers; Shallum was the chief.
translation:
  language: zh_hans
  text: 守门人有沙龙、亚谷、达们、亚希幔和他们的弟兄们[a]；沙龙是首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的族人”；希伯来语直译为“他们的弟兄们”，在这类名单中既可指亲兄弟，也可指同族成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: 守门人
  rationale: 指负责看守城门或圣殿门户的人；“守门人”是现代汉语中清楚、自然且符合上下文的称呼。
- source_word: שַׁלּוּם
  choice: 沙龙
  rationale: 人名，采用现代中文圣经中通行的音译。
- source_word: עַקּוּב
  choice: 亚谷
  rationale: 人名，采用现代中文圣经中通行的音译。
- source_word: טַלְמֹן
  choice: 达们
  rationale: 人名，采用现代中文圣经中通行的音译。
- source_word: אֲחִימָן
  choice: 亚希幔
  rationale: 人名，采用现代中文圣经中通行的音译。
- source_word: אֲחִיהֶם
  choice: 他们的弟兄们
  rationale: 保留希伯来语“弟兄”的亲属称谓及其可能扩展至同族成员的语义范围，不在正文中限定为亲兄弟或族人。
- source_word: הָרֹאשׁ
  choice: 首领
  rationale: 此处表示在所列守门人中的领导地位；“首领”比字面的“头”更符合现代汉语表达。
- source_word: וְ...וְ...וַ...וַ
  choice: 有……、……、……和……
  rationale: 将希伯来语反复出现的连接词转化为自然的中文列举结构，同时保留各成员并列相加的关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“有”引出名单，使句子流畅；分号保留后半句对沙龙职分的独立说明。脚注标记置于实际存在词义歧义的“弟兄们”之后。
