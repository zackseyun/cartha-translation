  text: 'And from the sons of Zerah: Jeuel and their brothers[a], six hundred and ninety.'
translation:
  language: zh_hans
  text: 谢拉的子孙中有耶乌利和他们的弟兄[a]，共六百九十人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶乌利和他的弟兄，共六百九十人。”若把耶乌利看作宗族的代表，可按这种方式理解；但希伯来原文“他们的弟兄”所带的后缀是复数。
    reason: 保留复数代词的原文形式，同时说明按名册语境作单数顺译的可能。
lexical_decisions:
- source_word: וּ/מִן בְּנֵי זֶרַח
  choice: 谢拉的子孙中
  rationale: מִן表示“从……中”，בְּנֵי在族谱和名册语境中可指后裔或宗族成员；译作“子孙”比字面的“儿子”更自然，也保留谱系含义。句首连接词וּ承接前文，在中文连续名册中无需机械译作“又”。
- source_word: יְעוּאֵל
  choice: 耶乌利
  rationale: 按现代中文圣经人名的常见音译方式处理此专名。
- source_word: וַ/אֲחֵי/הֶם
  choice: 和他们的弟兄
  rationale: 后缀为第三人称阳性复数，直译为“他们的弟兄”；不擅自改成以耶乌利为单数先行词的“他的弟兄”。“弟兄”在此可涵盖宗族中的男性亲属。
- source_word: שֵׁשׁ מֵאוֹת וְ/תִשְׁעִים
  choice: 共六百九十人
  rationale: 数字按中文圣经正文惯例写成汉字，并补出量词“人”；“共”清楚表明这是前述人员的总数。
