  text: In Gibeon lived Jeiel the father of Gibeon[b][a], and his wife's name was Maacah.
translation:
  language: zh_hans
  text: 住在基遍的是基遍之父[a]耶利[b]；他妻子名叫玛迦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基遍的创建者”或“基遍的首领”；希伯来文直译“基遍之父”。
    reason: lexical_alternative
  - marker: b
    text: 本节希伯来文写作可音译为“耶乌利”；马所拉旁注的读法为“耶利”。参《历代志上》8:29的平行经文。
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְ/גִבְע֛וֹן
  choice: 在基遍
  rationale: 前缀连词与介词合起来直译为“而在基遍”。本节承接上文，但现代汉语句首省略“而”更自然；地点义明确保留。
- source_word: יָשְׁב֥וּ
  choice: 居住的有
  rationale: ישב在此表示居住。希伯来语动词为复数，可能是沿用名单引介句式；译作“居住的有”既符合现代汉语，也避免擅自把复数改释为单数。
- source_word: אֲבִֽי גִבְע֖וֹן
  choice: 基遍之父
  rationale: 原文直译为“基遍之父”。在城邑或宗族谱系语境中，也可能指基遍的创建者、祖先或首领；正文保留原文措辞，并以脚注说明可能含义。
- source_word: יעואל
  choice: 耶利
  rationale: 按马所拉传统及《历代志上》8:29的平行经文采用通常辨读的名字“耶利”；本节辅音写法也可对应另一名称形式，故列入脚注。
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ
  choice: 他妻子名叫
  rationale: 自然表达“他妻子的名字是”，并完整保留所属关系。
- source_word: מַעֲכָֽה
  choice: 玛迦
  rationale: 采用该希伯来人名在现代中文圣经中的通行译名。
