base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/036.yaml
  text: And his firstborn son was Abdon[a], then Zur, Kish, Baal, Ner, and Nadab.
translation:
  language: zh_hans
  text: 他的儿子中，长子是押顿[a]，其余是苏珥、基士、巴力、尼珥和拿答。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“他的儿子，长子押顿，还有苏珥、基士、巴力、尼珥和拿答。”原文在每个名字前都使用连接词；正文按现代汉语的名单形式表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ
  choice: 他的儿子中
  rationale: וּ承接上文，בְנוֹ意为“他的儿子”。结合后续名单，译为“他的儿子中”可自然引出长子及其他儿子，又不改变亲属关系。
- source_word: הַבְּכוֹר
  choice: 长子
  rationale: 该词指头生的儿子；“长子”符合现代汉语家谱语体，也保留其正式含义。
- source_word: עַבְדּוֹן
  choice: 押顿
  rationale: 按中文圣经人名的通行音译处理该专名。
- source_word: וְצוּר
  choice: 苏珥
  rationale: 专名按通行中文音译；前置连词并入汉语列举结构。
- source_word: וְקִישׁ
  choice: 基士
  rationale: 专名按通行中文音译；连词由汉语顿号体现。
- source_word: וּבַעַל
  choice: 巴力
  rationale: 在此家谱中是人名，直接按希伯来语形式音译，不因其亦可指迦南神祇而改写。
- source_word: וְנֵר
  choice: 尼珥
  rationale: 专名按通行中文音译；连词并入名单结构。
- source_word: וְנָדָב
  choice: 拿答
  rationale: 专名按通行中文音译；末项前的连词译作“和”。
theological_decisions:
- issue: 以色列家谱中人名בַּעַל的译法
  choice: 保留为人名“巴力”
  alternative: 为回避与迦南神祇同形而采用替代名称或委婉改写
  rationale: 希伯来文本在此明确使用בַּעַל作为个人名字。忠实翻译应保留这一文本事实；如此译法并不表示赞同偶像崇拜。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语家谱语体。以“他的儿子中”消除逐字翻译造成的断裂感，并用顿号和“和”表达希伯来文反复出现的连接词。
