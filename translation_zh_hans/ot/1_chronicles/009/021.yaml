  text: Zechariah son of Meshelemiah was gatekeeper at the entrance to the tent of meeting[a].
translation:
  language: zh_hans
  text: 米施利米雅的儿子撒迦利雅，是会幕入口的守门人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“会幕门口的守门人。”
    reason: 保留 פֶּתַח 可译为“入口”或“门口”的词汇选择差异。
lexical_decisions:
- source_word: זְכַרְיָה
  choice: 撒迦利雅
  rationale: 按现代中文圣经常用译名音译此人名。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 本节的家谱语境支持直接的父子关系，而非较宽泛的“后裔”。
- source_word: מְשֶׁלֶמְיָה
  choice: 米施利米雅
  rationale: 依希伯来语形式音译人名，并采用现代中文圣经中易于辨识的写法。
- source_word: שֹׁעֵר
  choice: 守门人
  rationale: 该词指负责看守出入口的人；“守门人”自然、清楚，也符合圣所职务语境。
- source_word: פֶּתַח
  choice: 入口
  rationale: 该词指进入之处或开口；“入口”与“守门人”搭配自然。
- source_word: לְאֹהֶל
  choice: 会幕入口
  rationale: 介词 לְ 在这里与 פֶּתַח 构成关系表达，即“通往／属于帐幕的入口”；中文以定中结构自然表达。
- source_word: מוֹעֵד
  choice: 会
  rationale: 在固定词组 אֹהֶל מוֹעֵד 中，表示约定相会；与 אֹהֶל 合译为传统且简洁的“会幕”。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文中的通行译法，简洁且易懂；脚注保留更贴近词面结构的译法。
