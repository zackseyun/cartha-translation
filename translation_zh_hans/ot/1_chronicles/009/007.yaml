revisions:
- from: 便雅悯的子孙中有：撒路，是米书兰的儿子[a]，何达威雅的孙子，哈西努亚的曾孙[b]。
  to: 便雅悯的子孙中有撒路；撒路是米书兰的儿子[a]，米书兰是何达威雅[b]的儿子，何达威雅是哈西努亚的儿子。
  rationale: 修订保留“便雅悯的子孙中”的支派名册语境，并逐一译出希伯来文重复的“儿子”。通过清楚的连环句式消除中文修饰歧义，同时不把族谱关系强定为孙辈或曾孙辈。脚注锚点改置于相应术语和人名之后。
