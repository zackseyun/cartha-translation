base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/007.yaml
  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
translation:
  language: zh_hans
  text: 便雅悯的子孙中有撒路；撒路是米书兰的儿子[a]，米书兰是何达威雅[b]的儿子，何达威雅是哈西努亚的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这段族谱中反复使用“儿子”；这一说法既可指亲生儿子，也可泛指后裔。
    reason: cultural_note
  - marker: b
    text: “何达威雅”这个名字在一些相关族谱传统中的拼写有所不同。
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִן
  choice: ……中有
  rationale: וְ连接上文名单，מִן表示从某群体之中；汉语以“……中有”自然承接并引出成员。
- source_word: בְּנֵי בִּנְיָמִן
  choice: 便雅悯的子孙
  rationale: 字面为“便雅悯之子”，在族谱名册中指便雅悯支派的成员或后裔；“子孙”兼顾族谱语体和实际所指。
- source_word: סַלּוּא
  choice: 撒路
  rationale: 按现代中文圣经人名的通行音译处理该希伯来专名。
- source_word: בֶּן
  choice: 儿子／孙子／曾孙
  rationale: 希伯来文在族谱链中逐层重复“儿子”；中文若完全重复会产生所指歧义，因此按链条关系展开，同时脚注说明族谱用语也可能泛指后裔。
- source_word: מְשֻׁלָּם
  choice: 米书兰
  rationale: 采用现代中文圣经中常见的音译形式。
- source_word: הוֹדַוְיָה
  choice: 何达威雅
  rationale: 依马所拉文本的读音音译；相关族谱传统中可见不同拼写，但本节正文遵循WLC。
- source_word: הַ/סְּנֻאָה
  choice: 哈西努亚
  rationale: 在族谱语境中视为专名；定冠词与后续辅音的同化反映在读音中，不按普通名词翻译。
