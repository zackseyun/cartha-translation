  yaml_path: translation/ot/1_chronicles/009/025.yaml
  text: And their brothers in their villages were to come in every seven days[a], from time to time[b], with these.
translation:
  language: zh_hans
  text: 他们住在各村庄的弟兄，也要每隔七天[a]按期前来，同这些人一起[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“连续七天”。希伯来语短语很可能指七天一轮的当值安排。
    reason: lexical_alternative
  - marker: b
    text: “这些人”指上文所说当时正在当值的人。
    reason: referent_clarification
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: 他们的弟兄
  rationale: אֲחֵיהֶם直译为“他们的弟兄”；在本段行政安排的语境中，也可泛指同族或同属利未支派的人，但正文保留原文的亲属称谓。
- source_word: בְּחַצְרֵיהֶם
  choice: 住在各村庄
  rationale: חָצֵר可指院落、围地或村庄；此处说的是圣殿范围以外的居住地，因此译作“村庄”，并补出“住在”以符合现代汉语表达。
- source_word: לָבוֹא
  choice: 要……前来
  rationale: 带ל的动词不定式在此语境中表达安排或职责；“要……前来”体现轮班规定，而不把它处理为单纯的过去时叙事。
- source_word: לְשִׁבְעַת הַיָּמִים
  choice: 每隔七天
  rationale: 结合守门人轮班的上下文，主文采用周期性的理解；原短语也可能指“每次七天”，故以脚注保留歧义。
- source_word: מֵעֵת אֶל עֵת
  choice: 按期
  rationale: 该短语表示在相继或规定的时段；“按期”简洁自然，也与本节轮值安排相符。
- source_word: עִם אֵלֶּה
  choice: 同这些人一起
  rationale: 直译原文“与这些人”；保留指示代词，不在正文中擅自把所指替换为具体职衔。
