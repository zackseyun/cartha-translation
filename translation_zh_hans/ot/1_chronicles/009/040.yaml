  yaml_path: translation/ot/1_chronicles/009/040.yaml
  text: And the son of Jehonathan was Merib-baal[b][a], and Merib-baal fathered Micah.
translation:
  language: zh_hans
  text: 约拿单[b]的儿子是米力巴力[a]；米力巴力生了米迦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文同一人名出现两种略有不同的拼写：第一次为“米力巴力”（Merib-baal），第二次为较短形式“米里巴力”（Meri-baal）。正文为清楚起见统一作“米力巴力”。
    reason: textual_variant
  - marker: b
    text: 《撒母耳记上》14:49称扫罗的儿子为“约拿单”；本节《历代志》的希伯来文采用较完整的名字形式“Jehonathan”。
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: ……的儿子是
  rationale: בֶן意为“儿子”；前缀ו承接上文的家谱。在中文家谱语体中不必机械译出“并且”，以自然的句式表达其连续关系。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 按现代中文圣经人名的通行形式音译；希伯来文此处采用较完整的יְהוֹנָתָן形式，其与平行经文中的名称形式差异另以脚注说明。
- source_word: מְרִיב בָּעַל
  choice: 米利巴力
  rationale: 这是由两个成分构成的专名，采用现代中文圣经传统中可辨识且顺畅的音译，不翻译其词义。
- source_word: וּ/מְרִי בַעַל
  choice: 米利巴力
  rationale: 本节第二次出现的名字写作略短的מְרִי בַעַל，所指仍是同一人；正文统一作“米利巴力”以免误认为两人，并在脚注保留原文拼写差异。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 使役形在家谱语境中表示“生、成为……的父亲”。“生了”是中文家谱惯用而简洁的表达。
- source_word: אֶת מִיכָה
  choice: 米迦
  rationale: אֶת是直接宾语标记，不另译；מִיכָה按中文通行形式音译为“米迦”。
