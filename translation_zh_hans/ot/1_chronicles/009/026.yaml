base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/026.yaml
  text: For these four mighty gatekeepers[a], who were Levites[b], were entrusted with the chambers and with the storehouses of the house of God.
translation:
  language: zh_hans
  text: 因为这四位强壮的守门人都是利未人；他们忠信可靠[a]，负责管理神殿的房室和库房[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信可靠”或译“忠心地”或“受信任”。希伯来文强调这四位守门人履行职务时的忠诚和可靠。
    reason: lexical_alternative
  - marker: b
    text: “库房”或译“宝库”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明这些人承担相关职务的缘由；保留原文的解释性连接。
- source_word: בֶאֱמוּנָה
  choice: 忠信可靠
  rationale: אֱמוּנָה在此强调履职时的忠诚与可信。直接译出这一品格，比把它完全融入“受托”更能保留原文独立成分。
- source_word: אַרְבַּעַת גִּבֹּרֵי הַשֹּׁעֲרִים
  choice: 这四位英勇的守门人
  rationale: “守门人”准确表达圣殿门禁职务；גִּבֹּרֵי保留为“英勇的”，避免无根据地限定为“首领”，同时脚注提示语境中的其他可能理解。
- source_word: הֵם הַלְוִיִּם
  choice: 他们都是利未人
  rationale: 以自然中文保留强调性代词和身份说明；“都是”仅指这四人，不表示所有守门人均为利未人。
- source_word: וְהָיוּ עַל
  choice: 负责看管
  rationale: 该结构表示对某事物负有监管责任；“负责看管”自然地传达职务与监督含义。
- source_word: הַלְּשָׁכוֹת
  choice: 房间
  rationale: 指神殿附属的房室；现代中文“房间”清楚易懂，又不额外限定具体用途。
- source_word: הָאֹצְרוֹת
  choice: 库房
  rationale: 可指储存物品或财宝之处；“库房”保持宽泛，脚注保留“宝库”的可能译法。
- source_word: בֵּית הָאֱלֹהִים
  choice: 神殿
  rationale: 在本段圣殿行政语境中，“神殿”自然表达“神的殿宇”，避免现代读者把“神的家”误解为普通住宅。
theological_decisions: []
