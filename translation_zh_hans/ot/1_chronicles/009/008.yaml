  to: 还有耶罗罕的儿子伊比内雅[a]，米基利的儿子乌西的儿子以拉，以及伊比尼雅的儿子流珥的儿子示法提雅的儿子米书兰。
  rationale: 修订区分了原文首尾两个近似但不同的姓名形式，并将三条父子关系改为紧凑、自然的汉语家谱结构。人名次序、所有父子关系和连接关系均与希伯来文本一致。
