base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/008.yaml
  text: and Ibneiah son of Jeroham[a], and Elah son of Uzzi, son of Michri, and Meshullam son of Shephatiah, son of Reuel, son of Ibnijah.
translation:
  language: zh_hans
  text: 还有耶罗罕的儿子伊比内雅[a]，米基利的儿子乌西的儿子以拉，以及伊比尼雅的儿子流珥的儿子示法提雅的儿子米书兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节人名均按希伯来语音译。首处“伊比内雅”和末处“伊比尼雅”在原文中拼写及发音形式略有不同（יִבְנְיָה／יִבְנִיָּה）；本译据此分别音译，不判断二者是否指同一人物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: 还有／以及
  rationale: 希伯来语连接词反复串联名单；汉语采用“还有”和“以及”，既保留承接与并列关系，又避免机械重复。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 此处处于家谱名单中，通常表示父子关系；原文没有明确要求理解为较宽泛的“后裔”。
- source_word: יִבְנְיָה / יִבְנִיָּה
  choice: 伊比尼雅
  rationale: 两处希伯来人名的拼写和发音标注略有差异，但在现代汉语中用同一自然音译即可表达，细微差别另见脚注。
- source_word: יְרֹחָם
  choice: 耶罗罕
  rationale: 按现代汉语圣经人名的通行形式音译。
- source_word: אֵלָה
  choice: 以拉
  rationale: 按现代汉语圣经人名的通行形式音译。
- source_word: עֻזִּי
  choice: 乌西
  rationale: 按希伯来语音形并参考现代汉语通行形式音译。
- source_word: מִכְרִי
  choice: 米基利
  rationale: 采用现代汉语中清楚、易读的人名音译。
- source_word: מְשֻׁלָּם
  choice: 米书兰
  rationale: 按现代汉语圣经人名的通行形式音译。
- source_word: שְׁפַטְיָה
  choice: 示法提雅
  rationale: 按现代汉语圣经人名的通行形式音译。
- source_word: רְעוּאֵל
  choice: 流珥
  rationale: 采用现代汉语圣经中相应希伯来人名的通行译名，不依从受其他传承形式影响的英语异拼。
