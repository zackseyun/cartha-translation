base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/030.yaml
  text: And some of the sons of the priests were compounders of the ointment of spices[a].
translation:
  language: zh_hans
  text: 祭司的子孙中，有人负责调制香料制剂[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用香料调制的膏剂”。原文所指为调配而成的芳香制剂；其与“香料”之间的确切关系可理解为材料或关联。
    reason: 保留 הַמִּרְקַחַת 的“调配制剂”含义，避免将其限定为膏状物，并以自然中文保留 לַבְּשָׂמִים 与前词关系的歧义。
lexical_decisions:
- source_word: וּמִן
  choice: ……中，有人
  rationale: 介词 מִן 表示整体中的一部分；结合 וּ，中文用“……中，有人”自然地表达“其中有些人”，不必生硬译出连接词。
- source_word: בְּנֵי הַכֹּהֲנִים
  choice: 祭司的子孙
  rationale: בְּנֵי 字面为“儿子们”，在此名单和家族语境中指祭司家族的后代或成员；“子孙”既保留家族意味，也符合现代中文表达。
- source_word: רֹקְחֵי
  choice: 负责调制
  rationale: 该分词指配制复合香料或膏剂的人；“调制”准确体现按配方混合制作，“负责”则自然表达其固定职分。
- source_word: הַמִּרְקַחַת
  choice: 膏
  rationale: 此词指调制而成的混合物，可指香膏或香料制剂。正文选“膏”以贴合圣所中芳香制剂的语境，同时在脚注保留较宽泛的“混合物”。
- source_word: לַבְּשָׂמִים
  choice: 香料
  rationale: בְּשָׂמִים 指芳香材料或香料。前缀 לַ־ 与前词的关系可理解为构成、用途或关联；正文合译为“香料膏”，使中文简洁自然，脚注保留“供香料使用”的结构性读法。
