  text: וְ/עֹבַדְיָה֙ בֶּֽן שְׁמַֽעְיָ֔ה בֶּן גָּלָ֖ל בֶּן יְדוּת֑וּן וּ/בֶרֶכְיָ֤ה בֶן אָסָא֙ בֶּן אֶלְקָנָ֔ה הַ/יּוֹשֵׁ֖ב בְּ/חַצְרֵ֥י נְטוֹפָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/016.yaml
  text: and Obadiah son of Shemaiah[a], son of Galal, son of Jeduthun, and Berechiah son of Asa, son of Elkanah, who lived in the villages of the Netophathites.
translation:
  language: zh_hans
  text: 还有耶杜顿的儿子迦拉的儿子示玛雅的儿子俄巴底亚，以及以利加拿的儿子亚撒的儿子比利家；比利家住在尼陀法人的村庄里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“住在尼陀法的村落里。”希伯来语的族属词既可译作居民称谓“尼陀法人”，也可按相关地名“尼陀法”来表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹבַדְיָה
  choice: 还有……俄巴底亚
  rationale: 保留词首连接词，表明本节延续前文名单；人名按现代中文圣经常用音译处理。
- source_word: בֶּן
  choice: 的儿子
  rationale: 家谱语境中直译为“儿子”，既保留原文反复出现的父子链条，也不擅自把关系泛化为“后裔”。
- source_word: שְׁמַעְיָה
  choice: 示玛雅
  rationale: 采用通行的现代中文圣经人名音译。
- source_word: גָּלָל
  choice: 迦拉
  rationale: 采用通行的中文音译。
- source_word: יְדוּתוּן
  choice: 耶杜顿
  rationale: 采用通行的现代中文圣经人名音译。
- source_word: וּ/בֶרֶכְיָה
  choice: 以及……比利家
  rationale: 连接词引出名单中的另一人；“以及”自然体现并列关系。
- source_word: אָסָא
  choice: 亚撒
  rationale: 采用通行的中文音译；此处仅作父名，不另行认定其身份。
- source_word: אֶלְקָנָה
  choice: 以利加拿
  rationale: 采用通行的现代中文圣经人名音译。
- source_word: הַ/יּוֹשֵׁב
  choice: 比利家住在
  rationale: 带冠词的分词在句法上紧接并修饰比利家，表达居住状态；中文明确重复人名，以避免关系从句指代含混。
- source_word: בְּ/חַצְרֵי
  choice: 在……的村庄里
  rationale: חָצֵר在这一地理语境指乡村聚落，而非字面的院落；“村庄”自然且准确。
- source_word: נְטוֹפָתִי
  choice: 尼陀法人
  rationale: 该词为族属形容词，指与尼陀法有关的居民；正文以居民称谓表达，并在脚注保留按地名翻译的可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的名单体表达。保留原文逐层重复“儿子”的家谱结构，不倒置成“曾孙、孙子、儿子”，以免加入原文未明说的代际标签。分号使第二个人名与其居住说明之间的关系清楚；脚注标记置于实际涉及词语的句末。
