base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/004.yaml
  text: Then David and all Israel went to Jerusalem—that is[a], Jebus—where the Jebusites, the inhabitants of the land, were.
translation:
  language: zh_hans
  text: 于是，大卫和全以色列人前往耶路撒冷，就是耶布斯；耶布斯人，即那地的居民，住在那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 于是……前往
  rationale: 未完成式加连续式 waw 推进叙事；“于是”自然表达事件的承接，“前往”准确传达 הלך 在此处的移动含义。
- source_word: וְכָל יִשְׂרָאֵל
  choice: 和全以色列人
  rationale: “以色列”在这里是集合性的国民称谓；补出“人”符合现代汉语习惯，同时保留“全”的范围。
- source_word: יְרוּשָׁלִַם הִיא יְבוּס
  choice: 耶路撒冷，就是耶布斯
  rationale: הִיא 在此将耶路撒冷与旧名耶布斯等同；“就是”简洁清楚地表达同位说明。
- source_word: וְשָׁם
  choice: 当时……住在那里
  rationale: 原文直译为“并且在那里”；结合上下文用“当时……住在那里”形成自然的汉语存在陈述，同时保留地点指向。
- source_word: הַיְבוּסִי
  choice: 耶布斯人
  rationale: 该词形态上是单数，但在此作集合名词，且后接复数分词；汉语“耶布斯人”本身可作群体称谓，无须显式复数标志。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: 当地的居民
  rationale: 字面为“那地的居民”。此处指住在耶布斯一地的人，用“当地的居民”在现代汉语中自然，并避免误解为全地或全世界。
