  text: גַּם תְּמ֣וֹל גַּם שִׁלְשׁ֗וֹם גַּ֚ם בִּ/הְי֣וֹת שָׁא֣וּל מֶ֔לֶךְ אַתָּ֛ה הַ/מּוֹצִ֥יא וְ/הַ/מֵּבִ֖יא אֶת יִשְׂרָאֵ֑ל וַ/יֹּאמֶר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּה֙ תִּהְיֶ֣ה נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/002.yaml
  text: Even in times past[a], even before, when Saul was king, you were the one who led Israel out and brought them in; and Yahweh your God said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over my people Israel.’
translation:
  language: zh_hans
  text: 从前，早在扫罗作王的时候，你就是带领以色列出去、带回来的人[a]。耶和华你的上帝曾对你说：‘你要牧养我的子民以色列；你要作我子民以色列的领袖[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“把以色列领出去、带回来”，是描述带领百姓行动的说法。
    reason: lexical_alternative
  - marker: b
    text: “领袖”也可译作“统治者”或“首领”；原文用词不是通常译作“王”的那个词。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם תְּמוֹל גַּם שִׁלְשׁוֹם
  choice: 从前，早在
  rationale: 这是字面为“昨天和前天”的希伯来语时间习语，在此指过去、从前；译文用自然汉语表达其含义，并以“从前，早在”保留原文的强调语气。
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ
  choice: 扫罗作王的时候
  rationale: 介词 בְּ 加不定词结构构成时间从句；此译准确而符合现代汉语表达。
- source_word: אַתָּה הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: 你就是带领以色列出征、归来的人
  rationale: 原文保留“领出去、带回来”的动态意象，语境指大卫率领以色列行动；“出征、归来”在此自然传达军事及公共领袖的职能。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 以汉语中广为通行的专名“耶和华”呈现四字神名，并保留第二人称单数所属关系“你的上帝”。
- source_word: תִרְעֶה
  choice: 牧养
  rationale: 保留原文明确的牧人隐喻及其王权意象，而不简化为“统治”或“管理”。
- source_word: נָגִיד
  choice: 领袖
  rationale: 该词指受立的领导者或统治者，却不是本节前半所用的“王”（מֶלֶךְ）；“领袖”既自然，也保留两词的区别。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文采用现代中文圣经读者最熟悉且具有专名功能的“耶和华”；“雅威”是较接近学界重构读音的另一译法，但原始发音并非完全确定。
- issue: 王权牧人隐喻 תִרְעֶה
  choice: 你要牧养我的子民以色列
  alternative: 你要治理我的子民以色列
  rationale: “牧养”直接保留希伯来文的隐喻及其神学张力，不把照管与治理的复合含义压平为单纯的政治统治。
- issue: נָגִיד 与 מֶלֶךְ 的区分
  choice: 领袖
  alternative: 统治者／君王
  rationale: 原文没有在神谕中再次使用“王”，而选用 נָגִיד；译作“领袖”避免把这一区别消除，也不额外引入特定政体含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“子民”体现 עַמִּי 所含的归属关系；引语和标点依现代简体中文规范处理。
