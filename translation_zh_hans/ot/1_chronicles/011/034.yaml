  text: the sons of Hashem the Gizonite[a], Jonathan son of Shagee the Hararite;
translation:
  language: zh_hans
  text: 基孙人哈深的众子[a]，哈拉人沙基的儿子约拿单；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“基孙人哈深的众子”。平行名单《撒母耳记下》23:32的人名次序不同，一些译本或校勘重构因而采用不同译法。
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: 众子
  rationale: 这是בֵּן的复数附属形式，直译为“……的众子”。尽管平行经文的名单次序不同，此处保留马所拉文本的复数，不作协调。
- source_word: הָשֵׁם
  choice: 哈深
  rationale: 按专名音译；“哈深”符合现代中文圣经人名的简明音译习惯，也避免与普通词语“名字”混淆。
- source_word: הַגִּזוֹנִי
  choice: 基琐人
  rationale: 带冠词的族属或籍贯称谓；中文以“基琐人”自然表达其所属或来源。
- source_word: יוֹנָתָן
  choice: 约拿单
  rationale: 采用该希伯来人名在现代中文圣经中的通行译名。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 单数附属形式，表示父子关系；中文姓名列表中译作“某人的儿子”清楚自然。
- source_word: שָׁגֵה
  choice: 沙基
  rationale: 按希伯来语专名音译，采用简洁、易读的现代中文形式。
- source_word: הַהֲרָרִי
  choice: 哈拉人
  rationale: 带冠词的族属或籍贯称谓；译作“哈拉人”，不把它误当作第二个人名。
