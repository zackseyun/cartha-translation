lexical_decisions:
- source_word: יוֹאֵל
  choice: 约珥
  rationale: 人名，采用现代中文圣经中通行的音译。
- source_word: אֲחִי
  choice: 兄弟
  rationale: 这是“兄弟”的单数附属形式；本名录没有足够语境支持扩大为较宽泛的“亲属”。
- source_word: נָתָן
  choice: 拿单
  rationale: 人名，采用现代中文圣经中通行的音译。
- source_word: מִבְחָר
  choice: 米比哈尔
  rationale: 按希伯来语辅音与读音音译为人名，避免将其按普通词义意译。
- source_word: בֶּן
  choice: 儿子
  rationale: 在勇士名录的身份说明中保留通常的父子关系含义；上下文没有理由泛化为“后裔”。
- source_word: הַגְרִי
  choice: 哈基利
  rationale: 正文按专名理解并音译；其形态也可理解为族称“夏甲族人”，故在脚注中保留这一真实歧义。
