- source_word: חֶצְרוֹ
  choice: 希斯罗
  rationale: 按《历代志上》此处的希伯来语形式音译人名；平行经文所见形式不同，不据此改写本节。
- source_word: הַכַּרְמְלִי
  choice: 迦密人
  rationale: 带冠词的地名派生称谓，表示来自或属于迦密的人；译作“迦密人”简洁自然，也避免使现代读者误解为后世修会名称。
- source_word: נַעֲרַי
  choice: 拿莱
  rationale: 依希伯来语音形音译为人名，并采用适合现代普通话阅读的简明形式。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 在勇士名录及父子标识中，最自然的含义是“儿子”；上下文没有要求扩大为“后裔”。
- source_word: אֶזְבָּי
  choice: 以实拜
  rationale: 按本节希伯来语形式音译该专名。
