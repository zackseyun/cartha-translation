  text: Jediael son of Shimri[a], and Joha his brother, the Tizite;
translation:
  language: zh_hans
  text: 示默利的儿子耶叠，和他的兄弟提洗人约哈[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提洗人”或作“洗洗人”；此族属称谓的读法及其所指的地点或宗族并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעֲאֵל
  choice: 耶叠
  rationale: 人名按现代中文圣经常用音译处理；此处对应希伯来语人名，不按词源意译。
- source_word: בֶּן שִׁמְרִי
  choice: 示默利的儿子
  rationale: בֶּן 在这份勇士名录中最自然地表示直接的父子关系；将父名置前符合自然现代汉语表达。
- source_word: וְיֹחָא
  choice: 以及……约哈
  rationale: 保留连接词和人名；用“以及”使名单条目之间的关系清楚自然。
- source_word: אָחִיו
  choice: 他的兄弟
  rationale: אָחִיו 的通常含义是“他的兄弟”；上下文没有充分理由将其泛化为“亲属”。
- source_word: הַתִּיצִי
  choice: 提洗人
  rationale: 带定冠词的族属或地域称谓；以“提洗人”音译，保留其所属地或宗族未明的性质，不作推测性解释。
