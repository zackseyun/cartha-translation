  yaml_path: translation/ot/1_chronicles/011/007.yaml
  text: David lived in the stronghold[a]; therefore they called it the City of David.
translation:
  language: zh_hans
  text: 大卫住在堡垒里[a]；因此，人们称它为“大卫城”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坚固据点”。希伯来语 מְצָד 指设防的坚固之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישׁב 在叙事中与地点连用时表示居住、定居；“住在”是现代汉语中自然且准确的表达。
- source_word: בַּמְצָד
  choice: 在堡垒里
  rationale: מְצָד 指设防的坚固据点；“堡垒”保留其军事防御含义，介词 ב 译作“在……里”。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 该短语表示由前述情况产生的结果；“因此”简洁地保留因果关系。
- source_word: קָרְאוּ לוֹ
  choice: 人们称它为
  rationale: 原文使用复数主动形式，但未说明具体主语；汉语用泛指的“人们”既保留主动语态，也避免凭空指定人物。“称它为”自然表达命名之意。
- source_word: עִיר דָּוִיד
  choice: 大卫城
  rationale: 这是圣经中的固定地名；“大卫城”是简洁、通行的现代汉语形式。
