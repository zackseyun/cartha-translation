source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ דָּוִ֖יד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֥ה צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/009.yaml
  text: And David became greater and greater[a], and Yahweh of hosts was with him.
translation:
  language: zh_hans
  text: 大卫日渐强盛[a]，万军之雅威与他同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“大卫走着，越发强大”，这是表示持续进展的惯用说法。
    reason: 说明原文独特的进行性结构及其非字面的含义。
lexical_decisions:
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדוֹל
  choice: 日渐强盛
  rationale: 这是表达持续进展的希伯来语结构，并非描述大卫实际行走；“日渐强盛”自然地传达不断壮大的含义，同时保留过程性。
- source_word: דָּוִיד
  choice: 大卫
  rationale: 采用现代汉语《圣经》中通行的人名译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其作为以色列上帝专名的性质音译，而不以“主”等称号替代。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 该词与神名连用构成固定称号；“万军之雅威”保留军旅、众军的意象，也符合庄重的现代汉语表达。
- source_word: עִמּוֹ
  choice: 与他同在
  rationale: 直接表达陪伴和临在，不额外解释为支持、帮助或站在他一边。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，故以较贴近 Yahweh 的“雅威”音译，保留其专名性质。
- issue: 两分句之间 וַ 的关系
  choice: 用“，”并列，理解为“而且/并且”
  alternative: 译作“因为”以表达因果
  rationale: 原文只用普通连接词，并未明确标示因果关系；不补入“因为”，以免消除经文原有的关系张力。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“日渐强盛”比逐字翻译更自然；“与他同在”保留传统而清楚的圣经用语。
