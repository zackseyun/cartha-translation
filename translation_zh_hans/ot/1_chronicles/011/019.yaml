  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י מֵ/אֱלֹהַ֜/י מֵ/עֲשׂ֣וֹת זֹ֗את הֲ/דַ֣ם הָ/אֲנָשִׁים֩ הָ/אֵ֨לֶּה אֶשְׁתֶּ֤ה בְ/נַפְשׁוֹתָ/ם֙ כִּ֣י בְ/נַפְשׁוֹתָ֣/ם הֱבִיא֔וּ/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/019.yaml
  text: And he said[a], “Far be it from me, by my God, to do this! Shall I drink the blood of these men at the cost of their lives? For they brought it at the cost of their lives.” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: zh_hans
  text: 他说：“愿我的神不许我这样做！难道我要喝这些人的血，就是他们冒着性命危险带来的水吗？[a] 因为他们是冒着性命危险把这水带来的。”因此他不肯喝这水。[b] 这些事是那三个勇士所做的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冒着性命危险”直译可作“用他们的性命”。希伯来文在这里及下一句重复这一说法，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: 这里照原文保留“血”。大卫把这水说成这些人的血，因为他们是冒着丧命的危险取来的。
    reason: cultural_note
lexical_decisions:
- source_word: חָלִילָה לִּי מֵאֱלֹהַי
  choice: 在我的神面前，我绝不可
  rationale: חָלִילָה表达强烈拒绝；“在我的神面前”保留神圣见证或诉诸神的意味，同时避免把表达完全改写成现代汉语的“上帝禁止”。
- source_word: הֲדַם הָאֲנָשִׁים הָאֵלֶּה אֶשְׁתֶּה
  choice: 难道我要喝这些人的血
  rationale: הֲ引出反问；保留“血”的鲜明原文意象，不在正文中把它消解为单纯的“水”。
- source_word: בְנַפְשׁוֹתָם
  choice: 拿他们的性命作代价／拿性命
  rationale: נֶפֶשׁ在此指人的性命，而非非物质意义的“灵魂”。译文保留原文两次提及性命的强调；这里所说的代价是他们把性命置于危险中，并不表示他们实际死亡。
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: 所以他不肯喝
  rationale: אָבָה表示愿意或同意；“不肯”自然、简洁，并保留有意不喝的语气。
- source_word: שְׁלֹשֶׁת הַגִּבּוֹרִים
  choice: 那三个勇士
  rationale: גִּבּוֹרִים在本段指大卫手下以英勇著称的战士；“勇士”符合现代汉语的军事英雄语境。
theological_decisions:
- issue: 大卫所说“血”的含义
  choice: 正文照原文保留“血”，让上下文说明他把冒死取来的水视同这些人的血。
  alternative: 直接释为“难道我要喝他们冒死取来的水吗？”
  rationale: 原文明确使用“血”，这一意象承载大卫对生命之贵重的伦理判断，不宜在正文中提前化解。
- issue: נֶפֶשׁ所指
  choice: 译作“性命”。
  alternative: 译作“灵魂”。
  rationale: 此处讨论的是人在致命危险中的生命，而非对灵魂性质作神学陈述。
- issue: מֵאֱלֹהַי的关系
  choice: 译作“在我的神面前”，保留大卫在神面前强烈拒绝的表达。
  alternative: 译作“凭我的神”或“我的神绝不容我”。
  rationale: 希伯来语短语带有诉诸神、在神面前自我禁止的力量；正文不把它限定为一种严格的誓言公式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“绝不可”表达强烈拒绝；“不肯喝”和“勇士”自然简洁。正文保留“血”与两次“性命”的原文张力，脚注只说明其语境，不替正文作过度解释。
