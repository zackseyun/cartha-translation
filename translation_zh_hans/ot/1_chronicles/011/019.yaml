revisions:
- from: 他说：“在我的神面前，我绝不可做这事！难道我要喝这些人的血，拿他们的性命作代价吗？[a] 因为他们是拿性命把水带来的。”所以他不肯喝。[b] 这就是那三个勇士所做的事。
  to: 他说：“愿我的神不许我这样做！难道我要喝这些人的血，就是他们冒着性命危险带来的水吗？[a] 因为他们是冒着性命危险把这水带来的。”因此他不肯喝这水。[b] 这些事是那三个勇士所做的。
  rationale: 修订以“愿我的神不许我”传达强烈的神前拒绝，保留“血”的原文意象，并以现代汉语自然地表达该水是三人冒着生命危险取得的。问句中的“就是……带来的水”明确了“血”与水之间的评价性关联，而非把“血”替换为“水”。
