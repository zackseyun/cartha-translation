base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/046.yaml
  text: Eliel the Mahavite[a], and Jeribai and Joshaviah, the sons of Elnaam[b], and Ithmah the Moabite.
translation:
  language: zh_hans
  text: 玛哈未人[a]以利业，以利拿安的儿子耶利拜和约沙未雅，以及摩押人伊特玛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛哈未人”音译自希伯来文；其所指的确切地点或宗族尚不确定。
    reason: cultural_note
  - marker: b
    text: “耶利拜”也可音译作“雅利拜”；“伊特玛”也可音译作“吉特玛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: 以利业
  rationale: 人名采用现代中文圣经读者较熟悉的音译形式。
- source_word: הַמַּחֲוִים
  choice: 玛哈未人
  rationale: 这是来源不确定的地域或宗族称谓；采用音译，不武断认定具体地点，并以“人”表达其族称性质。
- source_word: וִירִיבַי
  choice: 耶利拜
  rationale: 人名按马所拉读音音译；连接词在中文并列结构中自然处理。
- source_word: וְיוֹשַׁוְיָה
  choice: 约沙未雅
  rationale: 人名音译，并保留希伯来语名称各主要音节。
- source_word: בְּנֵי
  choice: ……的儿子
  rationale: 这是“儿子”的复数构造式；上下文表明耶利拜和约沙未雅二人同为以利拿安的儿子。中文以单数集合表达“某人的儿子”自然且准确。
- source_word: אֶלְנָעַם
  choice: 以利拿安
  rationale: 专名按希伯来语音译。
- source_word: וְיִתְמָה
  choice: 伊特玛
  rationale: 专名按希伯来语音译；词首希伯来字母י在此以“伊”表达。
- source_word: הַמּוֹאָבִי
  choice: 摩押人
  rationale: 保留带定冠词的族属称谓功能，用作伊特玛的识别性附加说明。
