base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/021.yaml
  text: He was more honored than the two among the three[a], and he became their commander; but he did not attain to the three.
translation:
  language: zh_hans
  text: 在那三人中，他比两人更受尊崇[a]，并作了他们的统领；但他未能达到那三人的地位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按另一种句法理解：“他因两人而比三人更受尊崇。”希伯来文此短语十分简略，比较对象及“三人”与“两人”的关系难以确定。正文按通常理解译出：他在一个有等级之分的群体中比两人更受尊崇，却仍未能与“那三人”并列。
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשָׁה בַשְּׁנַיִם
  choice: 在这三人中，他比另外两人
  rationale: 原文是高度压缩且含义困难的比较结构。正文采用较自然的理解，将人物置于一个三人组中，并表示他高过其余两人；脚注保留另一种可能的句法关系，不把不确定性隐藏起来。
- source_word: נִכְבָּד
  choice: 更受尊崇
  rationale: כבד 的尼法勒形在此表示受到尊重、被看重；结合比较结构译为“更受尊崇”，既体现被动意义，也符合勇士等级的语境。
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: 并作了他们的统领
  rationale: שַׂר 可指首领、长官或统帅；“统领”自然地表达军事群体中的领导职分，同时避免加入原文没有明说的具体军阶。
- source_word: וְעַד הַשְּׁלוֹשָׁה לֹא בָא
  choice: 不过，他没有达到那三人的地位
  rationale: בוא 与 עַד 连用在此表示达到某种等级或声望，而非空间上的抵达；补出“地位”使现代汉语意义清楚。“那三人”仍保留原文组别指称上的张力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“受尊崇”“统领”“达到……的地位”适合勇士名录及等级比较的语境；正文与脚注共同保留希伯来语压缩句法造成的真实歧义。
