reference: 1 Chronicles 11:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה רָאשֵׁ֤י הַ/גִּבּוֹרִים֙ אֲשֶׁ֣ר לְ/דָוִ֔יד הַ/מִּתְחַזְּקִ֨ים עִמּ֧/וֹ בְ/מַלְכוּת֛/וֹ עִם כָּל יִשְׂרָאֵ֖ל לְ/הַמְלִיכ֑/וֹ כִּ/דְבַ֥ר יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/010.yaml
  text: These were the chiefs of the mighty men who belonged to David[a], who strengthened themselves with him in his kingdom, together with all Israel, to make him king[b], according to the word of Yahweh concerning Israel.
translation:
  language: zh_hans
  text: 这些是大卫麾下勇士的首领；他们为巩固他的王权而与他一同奋力[a]，并同全以色列一起拥立他为王，正如耶和华论到以色列[b]所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他一同奋力”也可译作“与他一同刚强起来”或“大力支持他”。希伯来语在这里既可保留共同奋力的字面色彩，也可按上下文理解为支持大卫确立王权。
    reason: lexical_alternative
  - marker: b
    text: “论到以色列”较直译为“在以色列之上”。这里很可能是指耶和华关于以色列所说的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַגִּבּוֹרִים
  choice: 勇士首领
  rationale: רָאשֵׁי 指居首位、担任领导的人；הַגִּבּוֹרִים 在本段语境中指大卫手下英勇善战的精锐人物。“勇士首领”简洁自然，也保留其军事和英雄色彩。
- source_word: אֲשֶׁר לְדָוִיד
  choice: 属大卫的
  rationale: 介词 לְ 在此表示归属或关联。“属大卫的”既体现这些人隶属大卫，也不把关系过度限定为所有权。
- source_word: הַמִּתְחַזְּקִים עִמּוֹ
  choice: 与他一同奋力
  rationale: חזק 的 Hitpael 形式与 עִם 连用，字面有“与他一同刚强起来”的意味；在拥立大卫的政治军事语境中，表示与他并肩出力、坚定支持他。“一同奋力”保留共同参与和主动用力的色彩，脚注同时说明其他可能表达。
- source_word: בְמַלְכוּתוֹ
  choice: 在他作王的事上
  rationale: מַלְכוּת 可指王权、统治、王位或国度。此处紧接“拥立他为王”，重点是大卫王权的确立；该译法在现代汉语中自然，同时不把含义收窄为疆域意义的“国度”。
- source_word: עִם כָּל יִשְׂרָאֵל
  choice: 又与全以色列一起
  rationale: עִם 表示共同参与。“与全以色列一起”清楚表达这些勇士首领和全体以色列共同采取行动。
- source_word: לְהַמְלִיכוֹ
  choice: 拥立他为王
  rationale: מלך 的 Hiphil 形式意为使某人作王。“拥立”符合众人支持并确立君王的语境，比单纯的“使他作王”更自然，但没有加入加冕仪式等原文未明说的细节。
- source_word: כִּדְבַר יְהוָה
  choice: 正如耶和华……所说的话
  rationale: כִּדְבַר 表示依照、符合耶和华所说的话。此译保留“话”这一神圣言语概念，并以“耶和华”呈现四字神名。
- source_word: עַל יִשְׂרָאֵל
  choice: 论到以色列
  rationale: עַל 与“话”搭配时可表示“关于、论到”。“论到以色列”符合本句最可能的句法关系；脚注保留较直译的“在以色列之上”。
theological_decisions:
- issue: הַמִּתְחַזְּקִים עִמּוֹ 所描述的行动
  choice: 大卫的勇士首领与他共同奋力，支持其王权的确立
  alternative: 他们与大卫一同刚强起来；他们大力支持大卫
  rationale: 上下文明确涉及拥立大卫为王，因此支持王权的意思十分突出；不过正文采用“一同奋力”，而非完全释义为“支持”，以保留反身词形所含的共同刚强、共同出力之意。
- issue: בְמַלְכוּתוֹ 的范围
  choice: 与大卫作王及王权确立有关
  alternative: 在他的国度中；在他统治期间；在他的王权上
  rationale: מַלְכוּת 的语义范围包括王权、统治和国度。上下文重在拥立大卫，故译作“在他作王的事上”，但不据此建立更狭窄的政治或神学解释。
- issue: עַל יִשְׂרָאֵל 修饰的关系
  choice: 耶和华所说的话是论到以色列的
  alternative: 耶和华的话临到或施行在以色列之上；大卫作王治理以色列
  rationale: 该短语在位置和常见搭配上最自然地关联 דְבַר יְהוָה，表示“关于以色列的话”；脚注保留介词更形式对应的读法，避免掩盖希伯来文的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“勇士首领”“拥立他为王”符合历史叙事语体；“在他作王的事上与他一同奋力”避免生硬照搬希伯来语，同时借脚注保留其较字面的反身含义和 מַלְכוּת 的语义张力。
