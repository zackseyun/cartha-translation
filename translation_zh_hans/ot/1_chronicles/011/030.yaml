lexical_decisions:
- source_word: מַהְרַי
  choice: 玛哈莱
  rationale: 人名按希伯来语音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: הַנְּטֹפָתִי / הַנְּטוֹפָתִי
  choice: 尼陀法人
  rationale: 带定冠词的地域居民称谓，表示尼陀法地方的人；译作“尼陀法人”既简洁，也保留希伯来语两次重复这一称谓的结构。
- source_word: חֵלֶד
  choice: 希列
  rationale: 人名按希伯来语音译。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 按名单语境自然表达希伯来语的父子关系结构。
- source_word: בַּעֲנָה
  choice: 巴拿
  rationale: 人名按希伯来语音译，采用中文圣经中通行的形式。
