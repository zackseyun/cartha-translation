  yaml_path: translation/ot/1_chronicles/011/015.yaml
  text: Then three of the thirty chiefs went down to the rock[a], to David, at the cave of Adullam, while the camp of the Philistines was encamped in the Valley of Rephaim.
translation:
  language: zh_hans
  text: 那时，三十位勇士中的三位首领下到磐石那里，去见在亚杜兰洞的大卫；非利士人的军营正驻扎在利乏音谷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: 下到
  rationale: 保留ירד所表达的向下移动，同时符合现代汉语叙事表达。
- source_word: שְׁלוֹשָׁה מִן־הַשְּׁלוֹשִׁים רֹאשׁ
  choice: 三十位勇士中的三位首领
  rationale: “三十位”指大卫勇士的已知群体；רֹאשׁ在此作同位性修饰，表明这三人是其中的首领。补出“勇士”使中文指称清楚，但不把其职位具体化为“将领”等。
- source_word: עַל־הַצּוּר
  choice: 到磐石那里
  rationale: על在此可表达朝向或到达磐石；译文保留具体地貌，也避免武断地将其解释为某座特定堡垒。
- source_word: אֶל־דָּוִיד אֶל־מְעָרַת עֲדֻלָּם
  choice: 到亚杜兰洞见大卫
  rationale: 两个אֶל短语结构紧凑。中文将地点与人物自然组合，表达他们前往亚杜兰洞到大卫那里，同时脚注保留更形式对应的句法。
- source_word: וּמַחֲנֵה פְלִשְׁתִּים חֹנָה
  choice: 当时非利士人的军营驻扎
  rationale: 连接词引入背景情形；分词חֹנָה表示持续驻营状态，“当时……驻扎”自然呈现其环境功能。
- source_word: בְּעֵמֶק רְפָאִים
  choice: 在利乏音谷
  rationale: 按传统且通行的中文圣经地名译作“利乏音谷”。
