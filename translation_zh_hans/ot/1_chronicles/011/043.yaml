lexical_decisions:
- source_word: חָנָן
  choice: 哈难
  rationale: 人名按现代中文圣经中较通行的音译处理。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 直接表达谱系或父子关系，符合本节名单体裁。
- source_word: מַעֲכָה
  choice: 玛迦
  rationale: 专名采用现代中文圣经中较通行的音译；在“……的儿子”结构中自然理解为父名。
- source_word: וְיוֹשָׁפָט
  choice: 以及……约沙法
  rationale: וְ译为连接名单成员的“以及”；יוֹשָׁפָט是较短的人名形式，中文仍按惯用译名作“约沙法”。
- source_word: הַמִּתְנִי
  choice: 米特尼人
  rationale: 带冠词的归属称谓，可能表示地域或宗族身份；译作“米特尼人”保留这种未完全确定的归属关系。
