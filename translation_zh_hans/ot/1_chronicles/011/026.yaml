  yaml_path: translation/ot/1_chronicles/011/026.yaml
  text: 'And the mighty warriors were: Asahel the brother of Joab[a], Elhanan son of Dodo, from Bethlehem.'
translation:
  language: zh_hans
  text: 勇士有：约押的兄弟亚撒黑，朵多的儿子伊勒哈难，来自伯利恒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“伯利恒人伊勒哈难”。希伯来文直译“来自伯利恒”。
    reason: 保留地点短语可译为籍贯称谓的词汇替代，同时不引入原文和英文审校记录未要求保留的附着关系歧义。
lexical_decisions:
- source_word: וְגִבּוֹרֵי הַחֲיָלִים
  choice: 勇士有
  rationale: 该词组指英勇善战的战士或精锐勇士；译作“勇士”简洁自然，并以“有”引出名单。句首的 וְ 承接上文，中文无需机械译作“和”。
- source_word: עֲשָׂה אֵל
  choice: 亚撒黑
  rationale: 这是人名 עֲשָׂהאֵל，采用现代中文圣经中通行的译名。
- source_word: אֲחִי יוֹאָב
  choice: 约押的兄弟
  rationale: 忠实表达亲属关系，同时符合现代汉语习惯。
- source_word: אֶלְחָנָן
  choice: 伊勒哈难
  rationale: 采用该希伯来人名的通行中文译名。
- source_word: בֶּן דּוֹדוֹ
  choice: 朵多的儿子
  rationale: 这是常见的谱系表达；此处 דּוֹדוֹ 是人名“朵多”，不是普通名词。
- source_word: מִבֵּית לָחֶם
  choice: 来自伯利恒
  rationale: 介词 מִן 与地名连用，字面表示来源地。译作“来自伯利恒”既直接又自然，也避免在正文中把它改写为族称。
