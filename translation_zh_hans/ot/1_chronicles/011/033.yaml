lexical_decisions:
- source_word: עַזְמָוֶת
  choice: 阿兹玛韦特
  rationale: 按希伯来语音译人名，并用现代普通话较易辨读的音节呈现。
- source_word: הַבַּחֲרוּמִי
  choice: 巴哈鲁米人
  rationale: 这是带定冠词的族属或地域称谓。正文依马所拉文本的元音形式音译为“巴哈鲁米人”，同时以脚注保留它可能与地名“巴户琳”有关的解释。
- source_word: אֶלְיַחְבָּא
  choice: 埃利雅赫巴
  rationale: 按希伯来语音译人名；“雅赫”较清楚地反映词中可见的辅音 ח。
- source_word: הַשַּׁעַלְבֹנִי
  choice: 沙阿勒本人
  rationale: 将带定冠词的地域称谓译为“沙阿勒本人”，既保留地名“沙阿勒本”的语音，也自然表达此人来自该地或与该地相关。
