lexical_decisions:
- source_word: אֲחִיאָם
  choice: 亚希暗
  rationale: 人名按希伯来语音译，并采用现代中文圣经读者较易辨认的形式。
- source_word: בֶּן
  choice: 的儿子
  rationale: 在勇士名录的家系表达中，最自然地指亲生儿子；广义上也可能表示后裔，因此保留脚注说明。
- source_word: שָׂכָר
  choice: 沙甲
  rationale: 人名依希伯来语 שָׂכָר 音译；首辅音按 שׂ 的音值处理。
- source_word: הֲרָרִי
  choice: 哈拉人
  rationale: 该词是地域或族属形容词；译作“哈拉人”既符合中文名录表达，也避免武断解释为“山地人”。
- source_word: אֱלִיפַל
  choice: 以利法
  rationale: 人名按希伯来语音译。
- source_word: אֽוּר
  choice: 吾珥
  rationale: 此处是人名而非美索不达米亚城市名；采用音译“吾珥”。
