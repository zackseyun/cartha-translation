  text: 哈拉人沙甲的儿子亚希暗[a]，吾珥的儿子以利法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节两处“儿子”也可能泛指“后裔”，不过在这份勇士名录中，直系父子关系更为自然。
