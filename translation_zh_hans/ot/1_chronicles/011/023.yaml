  to: 他击倒了那个埃及人；那人身高五肘[a][b]。那埃及人手里拿着一支矛，矛杆像织布机的横梁。他手拿一根杖[c]下到那埃及人那里，从埃及人手中夺过那支矛，用那埃及人的矛杀了他。
