base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/023.yaml
  text: And he struck down the Egyptian[a], a man five cubits tall. In the Egyptian’s hand was a spear like a weaver’s beam, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[c][b], and killed him with his own spear.
translation:
  language: zh_hans
  text: 他击倒了那个埃及人；那人身高五肘[a][b]。那埃及人手里拿着一支矛，矛杆像织布机的横梁。他手拿一根杖[c]下到那埃及人那里，从埃及人手中夺过那支矛，用那埃及人的矛杀了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那人身高”所对应的希伯来语直译为“一个有尺寸的人”，也可译作“一个身材高大的人”。
    reason: lexical_alternative
  - marker: b
    text: “肘”是古代长度单位，大致相当于从肘部到指尖的距离。
    reason: cultural_note
  - marker: c
    text: “杖”也可译作“棍”或“棒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: 击倒
  rationale: נכה在这里表示暴力击打并制伏对手；译作“击倒”保留动作性，也不提前取代后文明确表示“杀死”的 הרג。
- source_word: הָאִישׁ הַמִּצְרִי
  choice: 那个埃及人
  rationale: 现代汉语用“埃及人”即可自然指称这名男子，无须重复“人”。
- source_word: אִישׁ מִדָּה חָמֵשׁ בָּאַמָּה
  choice: 那人身高五肘
  rationale: 结合后面的具体度量，将“有尺寸的人”按身材高大来理解；正文自然表达身高，同时以脚注保留原文短语的字面形式。
- source_word: חֲנִית
  choice: 枪
  rationale: 此处是长柄刺击兵器，且枪杆被比作织布机横梁；“枪”符合古代叙事语境，也比“标枪”更切合其粗大形象。
- source_word: כִּמְנוֹר אֹרְגִים
  choice: 枪杆粗如织布机的横梁
  rationale: 原文直译为“像织工的梁木”。补出“枪杆粗”明确比喻所指，使现代读者自然理解其异常粗大。
- source_word: וַיֵּרֶד אֵלָיו
  choice: 下去迎战埃及人
  rationale: 保留 ירד 的“下去”，并用“迎战”表达在战斗场景中趋近对手的含义。
- source_word: בַּשָּׁבֶט
  choice: 拿着一根杖
  rationale: שבט可指杖、棍或棒；正文采用范围较宽且不过度解释武器形态的“杖”，其他可能性收入脚注。
- source_word: וַיִּגְזֹל
  choice: 从他手中夺过
  rationale: 该动词表示强行夺取；“夺过”简洁地传达近身搏斗中的强制动作。
- source_word: וַיַּהַרְגֵהוּ
  choice: 杀了他
  rationale: הרג明确表示杀死，采用自然、直接的现代汉语。
- source_word: בַּחֲנִיתוֹ
  choice: 用他的枪
  rationale: 忠实保留第三人称所属形式；上下文自然表明这是刚从埃及人手中夺来的枪，同时避免在正文中加入原文没有的“自己的”。
