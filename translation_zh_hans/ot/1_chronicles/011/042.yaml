  text: Adina son of Shiza the Reubenite[a], a chief of the Reubenites, and with him were thirty.
translation:
  language: zh_hans
  text: 流便人示撒的儿子亚底拿，是流便人的一个首领；有三十人随同他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“在他上面有三十人”。这里的希伯来语介词也可表示隶属或随同；在这份勇士名录中，很可能是说有三十人归他带领或随同他。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדִינָא
  choice: 亚底拿
  rationale: 专有名词按希伯来语音译，并采用现代中文圣经姓名的常见形式。
- source_word: בֶן־שִׁיזָא
  choice: 示撒的儿子
  rationale: בֶן在勇士名录中通常表示直接父子关系；用自然的中文领属结构表达。
- source_word: הָרְאוּבֵנִי
  choice: 吕便人
  rationale: 带冠词的族属形容词表明亚底拿属于吕便支派；译作“吕便人”简洁自然。
- source_word: רֹאשׁ לָרְאוּבֵנִי
  choice: 吕便人的一个首领
  rationale: רֹאשׁ在此表示领导地位而非身体部位；ל表示所领导或所属的群体。“一个首领”避免把具体职衔或唯一最高地位强加于原文。
- source_word: וְעָלָיו שְׁלוֹשִׁים
  choice: 有三十人跟随他
  rationale: עַל的字面义为“在……上/之上”，但在这份军事名录中更可能指三十人归他带领或随同他；正文采用自然且符合语境的表达，并以脚注保留字面可能性。
