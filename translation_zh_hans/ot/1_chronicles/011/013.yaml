base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/013.yaml
  text: He was with David at Pas-dammim[a], where the Philistines had gathered for battle. Now the plot of the field was full of barley[b], and the people fled from before the Philistines.
translation:
  language: zh_hans
  text: 他曾与大卫一起在巴斯·达悯[a]；非利士人聚集在那里，准备作战。那块田地长满了大麦，众人从非利士人面前逃跑了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴斯·达悯”是地名。另参《撒母耳记上》17:1的平行记载，那里称该地为“以弗斯·达悯”。
    reason: cross_reference
  - marker: b
    text: 也可译作“在非利士人面前逃跑了”。希伯来语直译为“从非利士人面前逃跑了”，表示因敌军逼近而败退。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּפַּס דַּמִּים
  choice: 在巴斯·达悯
  rationale: 按地名处理并音译，符合本节形态与平行战事叙述；不按词源直译为“流血之界”，以免掩盖其地点名称的功能。
- source_word: נֶאֱסְפוּ
  choice: 聚集
  rationale: אסף的尼法勒形在此表示聚集、集结；中文用主动式“聚集”自然准确，无需机械保留被动形式。
- source_word: לַמִּלְחָמָה
  choice: 作战
  rationale: 这里指一场具体战事，“作战”比泛指长期冲突的“战争”更贴合上下文。
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: 一块田
  rationale: חלקה指划分出来的一块地；“一块田”简洁自然，并保留具体耕地的含义。
- source_word: מְלֵאָה שְׂעוֹרִים
  choice: 长满了大麦
  rationale: 原文明确指大麦；用于田地时，“长满了大麦”比静态的“充满大麦”更符合现代汉语。
- source_word: וְהָעָם
  choice: 众人
  rationale: עם本身较宽泛，不宜无据限定为“士兵”或“战士”；“众人”既保留宽度，也适合战场语境。
- source_word: נָסוּ מִפְּנֵי פְלִשְׁתִּים
  choice: 从非利士人面前逃跑了
  rationale: 较贴近保留מִפְּנֵי“从……面前”的希伯来语表达，同时清楚传达面对敌军败退、逃离之意。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以分号连接人物所在地点与随后发生的战事，保留叙事连续性；地名使用中点分隔音译成分。脚注[b]置于其实际说明的逃跑短语之后，而非大麦之后。
