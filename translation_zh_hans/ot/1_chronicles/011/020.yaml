base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/020.yaml
  text: And Abishai[a], the brother of Joab, was chief of the Three. He brandished his spear against three hundred slain[c][b], and had a name among the Three.
translation:
  language: zh_hans
  text: 约押的兄弟亚比筛是三勇士的首领[a]。他挥枪击杀了三百人[b]，并在三勇士中享有声名[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本直译作“那三位”；“勇士”是按本段上下文补足。平行经文《撒母耳记下》23:18及相关抄本传统在“三”与“三十”之间存在文本和语境上的疑难。
    reason: textual_variant
  - marker: b
    text: “挥枪”也可译作“举起他的枪”或“舞动他的枪”。本句后半按字面近于“向着三百名被杀的人”；其句法和含义有难处，通常理解为他杀了三百人。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“有名”，意思是享有名望。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: 首领
  rationale: 这里表示军事群体中的领导地位，并非字面意义上的“头”；“首领”准确而自然。
- source_word: הַשְּׁלוֹשָׁה / בַּשְּׁלוֹשָׁה
  choice: 三勇士／三勇士中
  rationale: 马所拉文本两处均为“三”；加上“勇士”说明这是人物群体，同时不把正文协调为平行经文中可能涉及的“三十”。
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: 挥枪
  rationale: 该表达字面上有“举起、挥动或激起他的枪”之意；在战斗语境中，“挥枪”简洁地传达实际的武力行动。
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: 击杀了三百人
  rationale: חָלָל 指被杀或被刺死的人；这里概述亚比筛持枪作战的战果。中文以“击杀了三百人”自然表达其结果。
- source_word: שֵׁם
  choice: 享有声名
  rationale: 原文直译为“有名”；此处指在该群体中获得名望。“享有声名”既保留“名”的意象，也符合现代汉语。
- source_word: אַבְשַׁי
  choice: 亚比筛
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: אֲחִי יוֹאָב
  choice: 约押的兄弟
  rationale: 贴近希伯来语附属结构，也符合自然中文表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“三勇士”保留马所拉文本的数字，并补出语境中隐含的群体类别；不依据平行经文擅自改作“三十勇士”。战斗描述用简洁有力的“挥枪击杀”，而以脚注保留原文较生硬的结果性表达。
