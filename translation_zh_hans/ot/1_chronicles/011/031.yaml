  text: Ittai son of Ribai[a], from Gibeah of the sons of Benjamin; Benaiah the Pirathonite;
translation:
  language: zh_hans
  text: 利拜的儿子以太，来自便雅悯人[a]的基比亚；比拉顿人比拿雅；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“便雅悯的子孙”，即便雅悯支派的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיתַי
  choice: 以太
  rationale: 按现代中文圣经人名惯例音译该专名。
- source_word: בֶּן רִיבַי
  choice: 利拜的儿子
  rationale: בֶּן接人名表示父子关系；采用自然、明确的中文表达，并按中文语序置于“以太”之前。
- source_word: מִגִּבְעַת
  choice: 来自……的基比亚
  rationale: 介词מִן表示来源；גִּבְעַת在此是地名，因此音译为“基比亚”，不按普通名词译作“山丘”。
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯人
  rationale: 字面为“便雅悯的子孙”，在此指便雅悯支派成员；“便雅悯人”在现代中文中更自然，同时以脚注保留字面措辞。
- source_word: בְּנָיָה
  choice: 比拿雅
  rationale: 按现代中文圣经人名惯例音译该专名。
- source_word: הַפִּרְעָתֹנִי
  choice: 比拉顿人
  rationale: 带定冠词的族属或地名派生词，表示与比拉顿的地域或宗族关联；中文用“比拉顿人”简洁表达。
