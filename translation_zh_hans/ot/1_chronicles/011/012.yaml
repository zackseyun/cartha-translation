base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/012.yaml
  text: After him was Eleazar son of Dodo the Ahohite[a]; he was among the three mighty men.
translation:
  language: zh_hans
  text: 在他之后，是亚合人多多的儿子以利亚撒；他是三勇士之一。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在三勇士中”。希伯来语这一表达可表示他属于这个由三人组成的精英群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: 在他之后
  rationale: 表示勇士名单中的次序。中文省去句首连接词“和”更自然，也不误解为空间上的“在他旁边”。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 按现代中文圣经中通行的希伯来人名音译处理。
- source_word: בֶּן דּוֹדוֹ
  choice: 多多的儿子
  rationale: בֶּן在此最自然地表示直接父子关系；דּוֹדוֹ按本节马所拉文本音译为“多多”，不采用别处所见的异体名“多代”。
- source_word: הָאֲחוֹחִי
  choice: 亚合人
  rationale: 这是宗族或地域称谓，采用音译加“人”，既保留专名性质，也符合自然中文表达。
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: 三勇士之一
  rationale: 该介词结构表示属于一个已知的三人精英群体；“三勇士之一”在中文中清楚自然，同时以脚注交代希伯来语较贴字面的另一种表达。
- source_word: הַגִּבֹּרִים
  choice: 勇士
  rationale: 该词在历代志的语境中指大卫麾下杰出的战士；“勇士”简洁地保留其军事与荣誉色彩。
