  text: Uzzia the Ashterathite[a], Shama and Jeiel[b], the sons of Hotham the Aroerite.
translation:
  language: zh_hans
  text: 亚施他拉人乌西亚；亚罗珥人何坦的儿子沙玛和耶乌利[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “耶乌利”也常按另一种音译传统作“耶利”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזִּיָא
  choice: 乌西亚
  rationale: 按本节希伯来文人名音译；采用现代中文圣经人名中较自然、易辨认的形式。
- source_word: הָעֲשְׁתְּרָתִי
  choice: 亚施他拉人
  rationale: 这是由地名亚施他拉／亚斯他录一类形式构成的居民称谓；正文采用贴近本节希伯来文形态的“亚施他拉人”，并以脚注保留另一种可能。
- source_word: שָׁמָע
  choice: 沙玛
  rationale: 依马所拉文本本节的人名形式音译，不改用其他经文中较熟悉但辅音或元音略异的名字形式。
- source_word: ויעואל
  choice: 和耶乌利
  rationale: 前缀 ו 译作“和”；人名按所给辅音形式音译为“耶乌利”。抄传和音译传统中也常见与“耶利”相应的读法，故列入脚注。
- source_word: בְּנֵי חוֹתָם
  choice: 何坦的儿子
  rationale: בְּנֵי 是“儿子”的复数构造形式；中文结合并列的两个人名，用单数类称“儿子”即可自然表达二人同为何坦之子。
- source_word: הָעֲרֹעֵרִי
  choice: 亚罗珥人
  rationale: 这是由地名亚罗珥构成的居民称谓，译作“亚罗珥人”。
