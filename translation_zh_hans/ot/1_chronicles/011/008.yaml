base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/008.yaml
  text: He built the city all around[a], from the Millo even to the surrounding area[b], and Joab restored the rest of the city.
translation:
  language: zh_hans
  text: 大卫围绕着这城修建，从米罗[a]直到周边；约押修复了城中其余的部分。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米罗”是耶路撒冷的一处地名或地形建筑名称，确切所指不明，可能是台地式建筑或填土工程。
    reason: cultural_note
  - marker: b
    text: “修复”原文直译为“使活”或“使复苏”，这里可能指修复这城，使它恢复生机。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 大卫修建
  rationale: 这是בנה的Qal叙事过去式，意为“建造、修建”。主语承接上一节，是大卫；汉语为避免指代不清，明示其名。“重建”会加入原文没有明确表达的含义。
- source_word: הָעִיר מִסָּבִיב
  choice: 城的四周
  rationale: עִיר指“城”，מִסָּבִיב表达环绕的范围；译作“城的四周”自然且保留空间含义。
- source_word: מִן הַמִּלּוֹא
  choice: 从米罗
  rationale: מִלּוֹא是耶路撒冷的一处地名或地形建筑术语，具体所指不确定，因此在正文音译为“米罗”，不把有争议的解释写入正文。
- source_word: וְעַד הַסָּבִיב
  choice: 直到周边
  rationale: 原文表达建设范围的终点，但措辞简略，所指并不完全明确；“直到周边”保留其空间范围和原有含混性。
- source_word: וְיוֹאָב
  choice: 约押
  rationale: 按现代中文圣经人名惯例音译该专名。
- source_word: יְחַיֶּה
  choice: 修复
  rationale: חיה的Piel形式字面为“使活、使复苏”；用于城时很可能指使其恢复可用或重新兴盛。“修复”符合建筑语境，同时以脚注保留其字面意象及“复兴”的可能性。
- source_word: אֶת שְׁאָר הָעִיר
  choice: 城的其余部分
  rationale: שְׁאָר表示剩余部分；“城的其余部分”是清楚自然的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。为承接上节并避免中文代词含混，明确补出主语“大卫”。保留“米罗”这一不确定的地形专名，并用脚注说明；对יְחַיֶּה采用语境化译法“修复”，同时保留其“使活”的字面张力。所有脚注标记均置于相关正文之后。
