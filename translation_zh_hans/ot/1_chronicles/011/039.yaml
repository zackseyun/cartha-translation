lexical_decisions:
- source_word: צֶלֶק
  choice: 洗勒
  rationale: 人名采用现代中文圣经中较通行的音译形式。
- source_word: הָעַמּוֹנִי
  choice: 亚扪人
  rationale: 带冠词的族称，用来说明洗勒的族属；中文名单中译作“亚扪人”自然简明。
- source_word: נַחְרַי
  choice: 拿哈莱
  rationale: 按希伯来语辅音和马所拉元音音译，并采用中文圣经中常见的姓名形式。
- source_word: הַבֵּרֹתִי
  choice: 比录人
  rationale: 表示来自比录的居民称谓；“比录人”既保留地名联系，也符合现代中文表达。
- source_word: נֹשֵׂא כְּלֵי
  choice: 兵器侍从
  rationale: 该分词短语字面指“拿兵器的人”，在此是固定职责称谓；“兵器侍从”比生硬的逐字翻译更自然，同时保留其服侍性质。
- source_word: יוֹאָב
  choice: 约押
  rationale: 采用通行中文音译。
- source_word: בֶּן צְרוּיָה
  choice: 洗鲁雅的儿子
  rationale: 如实保留原文以母系亲属关系识别约押的表达。
