- from: 大卫勇士的数目如下：哈革摩尼的儿子雅朔班，是三十勇士的首领。他曾挥动长矛，一次击杀三百人。[a]
  to: 大卫勇士的名录如下：哈革摩尼的儿子雅朔班，是三十人之首；他曾挥动长矛，在一次交战中击杀三百人。[a]
  rationale: 修订仅改善中文自然度并纠正脚注对紧凑希伯来语军事表达的误导性说明。正文保留单次战事、三百人的数目、长矛动作和“三十人”群体称号；未加入任何教义性或历史性推断。
