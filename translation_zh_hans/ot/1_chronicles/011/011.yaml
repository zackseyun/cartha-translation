review_pass:
  verdict: revise
  source_fidelity: 正文准确传达了勇士名录、雅朔班的父名、其在“三十人”中的首领地位，以及在同一次战事中对三百人的战果。原草稿把原文的分词“被杀者”按战斗结果自然译为“击杀三百人”，可以成立；但脚注将其表述为“攻击三百名被杀的人”，会在中文中造成这些人已被杀后仍遭攻击的误解，且不宜称为直译。
  naturalness: “大卫勇士的数目如下”后面直接列出人名，在现代汉语中略显生硬；“大卫勇士的名录如下”更符合该词在此引出人员名单的语篇功能。“在一次交战中击杀三百人”庄重、清楚，也避免“一次”修饰“挥动”而可能引起的歧义。
  terminology: “勇士”“首领”“长矛”均合适。将“the Thirty”译作“三十人”较忠实地保留其作为特定群体称号的简约形式，不额外把该称号释作“三十勇士”。人名“雅朔班”“哈革摩尼”可保留。
