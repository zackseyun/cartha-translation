base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/011.yaml
  text: 'And these are the number of David’s mighty men: Jashobeam son of Hachmoni[a], the chief of the Thirty; he wielded his spear against three hundred slain in one encounter.'
translation:
  language: zh_hans
  text: 大卫勇士的名录如下：哈革摩尼的儿子雅朔班，是三十人之首；他曾挥动长矛，在一次交战中击杀三百人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“他举起（或挥舞）他的长矛，向着三百名被杀者，在一次中。”这是紧凑的军事表达；“被杀者”在此描述战果，故正文按上下文译为“击杀三百人”。“举起／挥舞”以及“在一次中”也可分别译作“扬起／挥动”和“在同一次场合”。
    reason: 说明“挥动长矛”的词义选择，并澄清原文以“被杀者”描述战果的紧凑表达，避免将其误解为攻击已死之人。
lexical_decisions:
- source_word: מִסְפַּר
  choice: 数目如下
  rationale: מִסְפַּר的基本义是“数目、计数”；这里用“数目如下”保留原文措辞，并自然引出勇士名录。
- source_word: הַגִּבֹּרִים אֲשֶׁר לְדָוִיד
  choice: 大卫勇士
  rationale: גִּבּוֹר在军事语境中指勇士或英勇战士；לְדָוִיד表示与大卫的归属或关联，简洁译作“大卫勇士”。
- source_word: יָשָׁבְעָם בֶּן חַכְמוֹנִי
  choice: 哈革摩尼的儿子雅朔班
  rationale: 按现代中文圣经人名音译惯例处理专名，并明确保留原文的父子关系。
- source_word: רֹאשׁ הַשלושים
  choice: 三十勇士的首领
  rationale: רֹאשׁ在身份等级语境中意为“首领”；השלושים直译为“三十”，在这里是一个勇士群体的称号，故补出“勇士”以便理解。
- source_word: עוֹרֵר אֶת חֲנִיתוֹ
  choice: 挥动长矛
  rationale: עוֹרֵר本义涉及唤起、激起；与“长矛”连用时是紧凑的军事习语。“挥动”表达实际作战动作，同时不过度限定为举起或炫示。
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: 击杀三百人
  rationale: עַל表示行动所针对的对象，חָלָל指被刺杀或战死者。中文以“击杀三百人”自然表达战果。
- source_word: בְּפַעַם אֶחָת
  choice: 一次
  rationale: 原文指同一次时机或场合；“一次”保留单一事件之意，不误译成一个动作或一击。
theological_decisions: []
