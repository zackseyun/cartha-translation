  text: 来自迦实溪谷[a]的户莱，亚巴特人[b]亚比业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪谷”也可译作“谷地”“河谷”或“干河床”。希伯来语这个词可指溪谷、峡谷、急流河床或谷地。
    reason: lexical_alternative
  - marker: b
    text: “亚巴特人”是表示籍贯的称谓，意为来自亚巴特的人；这个地名可能与亚拉巴有关。
    reason: cultural_note
lexical_decisions:
- source_word: חוּרַי
  choice: 户莱
  rationale: 人名按现代中文圣经译名习惯音译；希伯来语形式作 Hurai。
- source_word: מִנַּחֲלֵי
  choice: 来自……谷地的
  rationale: נַחַל 可指溪谷、河谷、季节性水道或干河床；复数构造形式在此译作“谷地”，既自然又保留地貌含义，并以脚注说明其他可能译法。
- source_word: גָעַשׁ
  choice: 迦实
  rationale: 地名按希伯来语音译，不对名称本身作意译。
- source_word: אֲבִיאֵל
  choice: 亚比业
  rationale: 人名按现代中文圣经译名习惯音译。
- source_word: הָעַרְבָתִי
  choice: 亚巴特人
  rationale: 这是表示籍贯或地域归属的称谓；译为“亚巴特人”，保留其地名派生性质，不武断确定具体地点。
