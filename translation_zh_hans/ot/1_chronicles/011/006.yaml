  text: וַ/יֹּ֣אמֶר דָּוִ֔יד כָּל מַכֵּ֤ה יְבוּסִי֙ בָּ/רִ֣אשׁוֹנָ֔ה יִהְיֶ֥ה לְ/רֹ֖אשׁ וּ/לְ/שָׂ֑ר וַ/יַּ֧עַל בָּ/רִאשׁוֹנָ֛ה יוֹאָ֥ב בֶּן צְרוּיָ֖ה וַ/יְהִ֥י לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/006.yaml
  text: And David said[a], “Whoever strikes down a Jebusite first shall become chief and commander.” So Joab son of Zeruiah went up first[b], and he became chief.
translation:
  language: zh_hans
  text: 大卫说：“谁先击杀耶布斯人，谁就必作首领和统帅[a]。”洗鲁雅的儿子约押首先上去[b]，于是作了首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为首，作统帅。”
    reason: lexical_alternative
  - marker: b
    text: “上去”在这里可能暗示登高攻打堡垒，但希伯来原文只说“上去”。
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַכֵּה יְבוּסִי
  choice: 谁……击杀耶布斯人
  rationale: כָּל与分词מַכֵּה在这里构成泛指关系表达，意为“谁／无论谁”。נכה用于军事语境时可指击杀或击败；“击杀”自然传达此处的战斗含义。单数יְבוּסִי按类属理解，汉语用不带数量词的“耶布斯人”即可。
- source_word: בָּרִאשׁוֹנָה
  choice: 先／首先
  rationale: 该词作副词，表示行动上的优先。前句用“先”配合“谁……谁……”句式，后句用“首先”，既自然，也保留两处用词的呼应。
- source_word: יִהְיֶה לְרֹאשׁ וּלְשָׂר
  choice: 必作首领和统帅
  rationale: לְרֹאשׁ表示居首或领导地位，שָׂר在此军事语境中表示统帅。“首领和统帅”保留两个并列称谓；“作”自然表达היה + ל所表示的身份转变。
- source_word: וַיַּעַל
  choice: 上去
  rationale: עלה的直接含义是“上去”。上下文可能暗示向高处的堡垒进攻，但原文没有明说“进攻”，因此正文保留较为直译且具有开放性的“上去”。
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: 洗鲁雅的儿子约押
  rationale: 按现代汉语常用圣经人名音译处理，并以自然的汉语亲属结构表达父母子嗣关系。
- source_word: וַיְהִי לְרֹאשׁ
  choice: 于是作了首领
  rationale: 与前文לְרֹאשׁ相呼应，继续译作“首领”。本句只重复רֹאשׁ，没有重复שָׂר，因此不增译“统帅”。“于是”体现叙事结果，但不额外说明是谁任命了他。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“谁……谁就……”准确表达原文泛指条件结构；保留“上去”的字面措辞，避免把上下文暗示直接写成原文明说的“攻打”。
