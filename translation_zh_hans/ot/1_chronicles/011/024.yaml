base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/024.yaml
  text: These things Benaiah son of Jehoiada did[a], and he had a name among the three mighty men.
translation:
  language: zh_hans
  text: 耶何耶大的儿子比拿雅做了这些事；他在那三个勇士中享有名望[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他在那三个勇士中有名。”
    reason: 保留希伯来语“有名字”表示享有名声的习语形式。
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: 做了这些事
  rationale: אֵלֶּה回指前文所述的功绩，עָשָׂה作概括；译为“做了这些事”既保留回指作用，也符合现代汉语表达。
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 按现代汉语亲属结构表达希伯来语的属格关系，并采用通行的圣经人名译法。
- source_word: וְלוֹ שֵׁם
  choice: 他……享有名望
  rationale: 原文直译为“他有名”，其中שֵׁם在此指名声、声望；“享有名望”自然传达该习语的语境含义。
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: 在那三个勇士中
  rationale: 介词בְּ表示在该群体中的地位或声誉；定冠词以“那”体现，גִּבֹּרִים在此指大卫麾下以勇武著称的精锐人物。
