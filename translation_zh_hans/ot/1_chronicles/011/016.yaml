  text: 那时，大卫在堡垒[a]里；非利士人的驻军那时[b]在伯利恒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒”或译“坚固的据点”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在两个分句中都用了“那时”，以强调这两个情势同时存在。
    reason: source_repetition
lexical_decisions:
- source_word: מְּצוּדָה
  choice: 堡垒
  rationale: 该词指设防之地或可据守的避难处。“堡垒”在现代汉语中具体、自然，也符合本节的军事场景；脚注保留“坚固据点”这一较宽泛的可能表达。
- source_word: נְצִיב
  choice: 驻军
  rationale: 该词可指驻守者、官长或驻防单位；在非利士人占据伯利恒的军事语境中，“驻军”最为贴切，同时避免误解为单一的行政长官。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经及历史叙述中通行的人名译法。
- source_word: בְּבֵית לָחֶם
  choice: 在伯利恒
  rationale: 介词 בְּ 表示地点，“在伯利恒”是现代汉语中自然准确的城镇方位表达。
- source_word: אָז ... אָז
  choice: 那时……那时
  rationale: 希伯来文在两个分句中重复 אָז。译文保留重复，以呈现原文的时间框架和两地情势的对照。
- source_word: וְדָוִיד
  choice: 大卫
  rationale: 句首 וְ 在此承接叙事；汉语借“那时”即可自然衔接，无须机械添加“并且”或原文没有的“现在”。
