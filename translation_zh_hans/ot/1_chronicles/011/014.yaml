base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/014.yaml
  text: And they took their stand in the middle of the plot and delivered it[a], and they struck down the Philistines, and Yahweh saved by a great victory.
translation:
  language: zh_hans
  text: 他们在那块田地中央站定，保住了那块田地，击杀非利士人；耶和华施行了大拯救。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华成就了大胜利。”
    reason: תְּשׁוּעָה 在战争语境中可指“胜利”，但也可指“拯救、解救”；正文保留较宽的含义，脚注提供其具体军事语境的译法。
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: 他们站在
  rationale: 该词的反身词干在战斗语境中表示主动站定、据守阵地；“站在”配合下文，简洁保留这一行动含义。
- source_word: בְתוֹךְ הַחֶלְקָה
  choice: 那块田地当中
  rationale: בְתוֹךְ 表示“在……当中”，חֶלְקָה 指划分出来的一块土地；结合上文的农田语境，译作“那块田地”自然准确。
- source_word: וַיַּצִּילוּהָ
  choice: 保住了它
  rationale: נצל 表示救出、解救；受词阴性单数代词指向田地。中文用“保住”能自然表达使土地免遭敌人夺取，并以“它”明确保留原文受词。
- source_word: וַיַּכּוּ אֶת־פְּלִשְׁתִּים
  choice: 击杀非利士人
  rationale: נכה 在战争叙事中常指击打并杀伤敌人；“击杀”保留原文强烈的军事含义，而不只笼统译为“打败”。
- source_word: וַיּוֹשַׁע יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: 耶和华施行了大拯救
  rationale: 原文以同源的动词与名词构成强调表达，直指耶和华是拯救的施行者。“施行了大拯救”在中文中庄重自然，也不擅自补出希伯来文未明说的受词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，以神的专名呈现，而不替换为称号。
theological_decisions:
- issue: 末句 תְּשׁוּעָה גְדוֹלָה 的军事与救赎含义
  choice: 耶和华施行了大拯救
  alternative: 耶和华使他们大获全胜
  rationale: תְּשׁוּעָה 在此可按战场语境理解为胜利，也保有较宽的“拯救、解救”含义。正文采用“施行了大拯救”以保留同源词强调及神学张力，脚注提供自然的军事语境译法。
- issue: 拯救对象是否明说
  choice: 不补出“他们”
  alternative: 耶和华拯救了他们，使他们大获全胜
  rationale: 希伯来文没有明示动词受词；不补出对象可避免将上下文推定写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；以“田地”交代农业场景，以“保住”表达守住土地的军事行动。分号凸显人的作战行动与耶和华所施拯救之间的关系。
