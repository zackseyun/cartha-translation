source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם דָּוִ֥יד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֨וּ אֶת דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל כִּ/דְבַ֥ר יְהוָ֖ה בְּ/יַד שְׁמוּאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and David made a covenant with them at Hebron before Yahweh. Then they anointed David king over Israel, according to the word of Yahweh by Samuel.
translation:
  language: zh_hans
  text: 于是，以色列的众长老都来到希伯仑见王；大卫在希伯仑、在雅威面前与他们立约。他们就膏立大卫作以色列的王，照着雅威借撒母耳[a]所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“借撒母耳之手”，意为“借着撒母耳”或“由撒母耳传达”。
    reason: 说明希伯来语中表示中介或代理的习语。
lexical_decisions:
- source_word: זִקְנֵי
  choice: 长老
  rationale: 指以色列各支派中公认的代表和领袖；“长老”既保留其社会政治身份，也符合现代中文圣经语体。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的称号而非人名；译作“王”保留叙事表达，后文再明确此人是大卫。
- source_word: חֶבְרוֹנָה / בְּחֶבְרוֹן
  choice: 到希伯仑／在希伯仑
  rationale: 首处的方向词尾表示前往希伯仑，次处的介词明确表示地点；中文分别译出这一区别。
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: 立约
  rationale: 希伯来语直译为“切约”，但“立约”是自然、准确且庄重的现代中文惯用表达。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留原文“在……面前”的表达，传达雅威亲临鉴察并作见证的庄严意味，而不额外扩释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: וַיִּמְשְׁחוּ
  choice: 膏立
  rationale: 此处是以膏抹确立君王；“膏立”兼顾具体动作及王权授任语境，比泛化的“任命”更贴近原文。
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: 作以色列的王
  rationale: 自然表达大卫受立为治理以色列的君王，准确反映任职和统治对象。
- source_word: כִּדְבַר יְהוָה
  choice: 正如雅威……所说的话
  rationale: 保留דָבָר的“话、言语”意义以及事件应验神言的关系，不将其限定为“应许”。
- source_word: בְּיַד שְׁמוּאֵל
  choice: 借撒母耳
  rationale: “借”自然表达希伯来习语“借……之手”所表示的中介或传达作用，同时不误解为撒母耳自己的话。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；译作“雅威”保留其作为以色列之神专名的性质，不以传统音译或称号替代。
- issue: 撒母耳在神言中的角色
  choice: 雅威借撒母耳所说的话
  alternative: 雅威由撒母耳之手所说的话
  rationale: 原文בְּיַד是“借……之手”的中介习语；“借撒母耳”明确话语源于雅威、由撒母耳传达，又避免生硬直译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“众长老”“立约”“膏立”等词保留古代以色列政治与盟约语境；句式适度简洁，并将脚注标记置于其实际说明的“借撒母耳”之后。
