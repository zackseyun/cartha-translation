revisions:
- from: 于是，以色列的众长老都到希伯仑来见王。大卫在希伯仑、雅威面前与他们立约；他们就膏立大卫作以色列的王，正如雅威借撒母耳[a]所说的话。
  to: 于是，以色列的众长老都来到希伯仑见王；大卫在希伯仑、在雅威面前与他们立约。他们就膏立大卫作以色列的王，照着雅威借撒母耳[a]所说的话。
  rationale: 修订仅澄清“在希伯仑、在雅威面前”的句法关系，并以“照着”更准确、自然地表达“按雅威借撒母耳所说的话”。其余译语保留原稿对原文人称、地点、盟约、膏立和神名的忠实呈现。
