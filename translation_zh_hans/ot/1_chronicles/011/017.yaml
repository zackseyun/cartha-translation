base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/017.yaml
  text: And David longed and said[b][a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: zh_hans
  text: 大卫十分渴望，就说：“谁能给我伯利恒城门旁那口井[b]里的水喝呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按汉语习惯译作：“但愿有人给我喝伯利恒城门旁那口井里的水！”
    reason: lexical_alternative
  - marker: b
    text: 希伯来语中译作“井”的词也可指“水窖”或“坑”；这里所指的是一处饮用水源。
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתאו
  choice: 十分渴望
  rationale: 该词形表达强烈的愿望。“十分渴望”保留其强度，又符合现代汉语表达；具体渴望的内容由随后引语说明。
- source_word: מי
  choice: 谁能
  rationale: 保留希伯来文以疑问形式表达愿望的方式；“谁能”在现代汉语中也能自然传达盼望有人前去取水的语气。
- source_word: ישקני
  choice: 给我喝
  rationale: 该使役词形意为“给……喝”或“使……喝”。“给我喝”简洁地保留使役含义，并与后面的“水”自然搭配。
- source_word: מים
  choice: 水
  rationale: 按该常用名词的基本意义直译。
- source_word: מבּור
  choice: 井里的
  rationale: בּוֹר 可指井、水窖或坑；此处是伯利恒一处可供饮用水的水源，因此正文采用最符合语境的“井”，并以脚注保留词义范围。
- source_word: בית לחם
  choice: 伯利恒
  rationale: 采用该地名通行的现代中文译名。
- source_word: אשר בשער
  choice: 城门旁
  rationale: 该关系从句说明水井相对于城门的位置。“城门旁”自然、清楚，也保留原文的空间关系。
