base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/025.yaml
  text: Among the Thirty[a], he was indeed honored, but he did not attain to the Three[b]; and David appointed him over his bodyguard.
translation:
  language: zh_hans
  text: 他比那三十人更受尊崇，却没有达到那三人的地位[a]。大卫任命他统领大卫的卫队[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却没有达到那三人的等级。”希伯来文直译为“却没有来到那三人那里”；这里的“来到”是惯用说法，表示达到他们的地位或等级。
    reason: lexical_alternative
  - marker: b
    text: 或译：“大卫的警卫队”或“受大卫指挥的人”。这里的希伯来词可指警卫队，也可较广泛地指在大卫权下受命的一队人员或职掌。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשִׁים
  choice: 在“三十勇士”中
  rationale: מִן与群体称谓连用，在本语境中表示他在“三十勇士”这一群体中的身份或地位；译作“在……中”自然，也与下文未能跻身“三勇士”相呼应。原文只有“三十”，补出“勇士”以明确这是特定的勇士群体。
- source_word: הִנּוֹ
  choice: 确实
  rationale: 此处该强调语气词并非要求人观看，而是加强断言；“确实”在现代汉语中自然地保留了这种强调。
- source_word: נִכְבָּד
  choice: 备受尊重
  rationale: כבד的尼法勒形在此表示有分量、受尊崇；结合勇士地位的语境，“备受尊重”比“荣耀”更自然。
- source_word: וְאֶל הַשְּׁלוֹשָׁה לֹא בָא
  choice: 却未能跻身“三勇士”之列
  rationale: בוא与אֶל在这里惯用地表示达到某种地位，而非实际走到某处；“跻身……之列”清楚表达未达到这一精英群体的等级。
- source_word: הַשְּׁלוֹשָׁה
  choice: “三勇士”
  rationale: 指大卫勇士中由三人组成的杰出群体。原文直称“三个/三人”，汉语补出“勇士”以便读者辨明所指，不添加“首领”等原文未明说的身份。
- source_word: וַיְשִׂימֵהוּ
  choice: 大卫派他统领
  rationale: שׂים本义为安置、设立，在军政职务语境中表示任命或指派；“派他统领”兼顾任命和管理职责。
- source_word: עַל מִשְׁמַעְתּוֹ
  choice: 自己的卫队
  rationale: מִשְׁמַעַת可指听命于某人的队伍、所辖人员或警卫部队；在大卫军事组织的语境中，“卫队”最为通顺，但其范围并非完全确定，故加脚注保留其他可能。
