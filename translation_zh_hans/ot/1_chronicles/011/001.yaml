  text: 以色列众人都来到希伯仑，聚集在大卫那里，说：“看哪，我们是你的骨肉。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ כָל־יִשְׂרָאֵל
  choice: 以色列众人都聚集
  rationale: “众人”自然表达集合名词“全以色列”，同时保留全体性的强调；动词译为“聚集”。
- source_word: אֶל־דָּוִיד חֶבְרוֹנָה
  choice: 到希伯仑，来见大卫
  rationale: 希伯来语表达朝向大卫并前往希伯仑；汉语调整语序，使地点和会见对象都清楚，不增添原文没有的关系。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示语的郑重和强调作用，语体庄重而仍可理解。
- source_word: עַצְמְךָ וּבְשָׂרְךָ אֲנָחְנוּ
  choice: 我们是你的骨肉
  rationale: 汉语“骨肉”自然传达“你的骨和你的肉”这一亲族、同胞关系的成语性表达，避免生硬直译。
theological_decisions:
- issue: “骨和肉”的关系含义
  choice: 译作“你的骨肉”，不进一步解释
  alternative: 译作“与你骨肉相连的亲族”或“你的同胞”
  rationale: 原文用亲属关系惯用语表达团结与归属；保留其形象和张力，不把具体所指限定为血缘、民族或政治盟约。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“看哪”略带经典语体，用以保留 הִנֵּה 的强调；“骨肉”是现代汉语仍通行的亲属关系表达。
