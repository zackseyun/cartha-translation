id: 1CH.11.18
reference: 1 Chronicles 11:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּבְקְע֨וּ הַ/שְּׁלֹשָׁ֜ה בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בּ֤וֹר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑יד וְ/לֹֽא אָבָ֤ה דָוִיד֙ לִ/שְׁתּוֹתָ֔/ם וַ/יְנַסֵּ֥ךְ אֹתָ֖/ם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/018.yaml
  text: So the three broke through into the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But David was not willing to drink it; instead, he poured it out to Yahweh.
translation:
  language: zh_hans
  text: 于是，那三个人闯进非利士人的营地，从伯利恒城门旁的井里打了水，带到大卫那里。大卫却不肯喝，反而把水浇奠给耶和华。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “浇奠”指把液体倾倒出来献给耶和华；原文动词带有献奠祭的意味。
    reason: 说明希伯来动词 נסך 的祭仪含义，避免读者把这一动作理解为单纯倒掉水。
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: 闯进
  rationale: 在军事语境中表示突破敌方防线；“闯进”自然地传达强行突破并进入营地的动作。
- source_word: הַשְּׁלֹשָׁה
  choice: 那三个人
  rationale: 原文仅作“那三个”；根据汉语表达补出量词和泛称“人”，但不把上下文中的“勇士”明加进本节。
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: 非利士人的营地
  rationale: 配合“闯进”表达进入敌营；保留原文所属结构。
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: 打了水
  rationale: “打水”是现代汉语中从井中汲水的自然说法。
- source_word: מִבּוֹר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: 从伯利恒城门旁的井里
  rationale: בּוֹר 可指坑、蓄水池或井；此处是取饮用水，译作“井”最合语境。“城门旁”清楚表达其位置。
- source_word: וַיִּשְׂאוּ וַיָּבִיאוּ אֶל דָּוִיד
  choice: 带到大卫那里
  rationale: 两个连续动词直译为“拿起并带来”在汉语中略显累赘；“带到”自然概括搬运并送达的过程。
- source_word: וְלֹא אָבָה דָוִיד לִשְׁתּוֹתָם
  choice: 大卫却不肯喝
  rationale: אָבָה 表示愿意或同意；否定形式译作“不肯”既保留意愿层面，又比“拒绝”稍少强化。原文复数代词所指为水，汉语无需明说宾语。
- source_word: וַיְנַסֵּךְ אֹתָם לַיהוָה
  choice: 反而把水浇奠给耶和华
  rationale: נסך 在此具有礼仪性的浇奠含义。“浇奠”既呈现实际倾倒动作，也保留献给上帝的祭仪意味；“反而”明确与不喝形成转折。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: 大卫倒水行为的祭仪含义
  choice: 正文译作“把水浇奠给耶和华”
  alternative: 译作“把水倒在耶和华面前”，并在脚注说明可指奠祭
  rationale: 希伯来动词 נסך 不只是一般的倾倒，也常有浇奠、献奠祭的祭仪含义。正文采用“浇奠”，同时用脚注说明其具体含义，既不淡化神学意味，也不把水径直称作律法规定的某一种正式祭物。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“那三个人”紧贴原文，不增译“勇士”；“打了水”“不肯喝”保持自然口语可懂度，“浇奠”则保留必要的礼仪色彩。脚注标记已在正文中出现。
