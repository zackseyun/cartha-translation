revisions:
- from: 耶何耶大的儿子比拿雅，是一位来自甲薛、英勇而功绩卓著之人的儿子。他击倒了摩押的两个勇士[a]；又在一个下雪的日子下到坑里，击倒了一头狮子。
  to: 耶何耶大的儿子比拿雅；耶何耶大是一位来自甲薛、英勇而功绩卓著之人的儿子。他击倒了摩押的两个勇士[a]；又在一个下雪的日子下到坑里，击倒了一头狮子。
  rationale: 修订仅澄清原文连续“儿子”结构在汉语中的表达，不改变其所保留的表层父系关系；“摩押的两个勇士”仍作为在勇士名录语境下可行但非确定的正文译法，脚注保留主要替代理解。其余措辞准确、自然，予以保留。
