base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/022.yaml
  text: Benaiah son of Jehoiada[a], son of a mighty man, a man of many deeds, from Kabzeel—he struck down the two heroes of Moab. He also went down and struck down the lion in the midst of a pit on a snowy day.
translation:
  language: zh_hans
  text: 耶何耶大的儿子比拿雅；耶何耶大是一位来自甲薛、英勇而功绩卓著之人的儿子。他击倒了摩押的两个勇士[a]；又在一个下雪的日子下到坑里，击倒了一头狮子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摩押的两个勇士”：原文含义不确定，也可能译作“摩押的亚利伊勒的两个儿子”或“摩押的两个亚利伊勒”。“亚利伊勒”与“狮子”一词有关，因而也可能指像狮子般勇猛的人。
    reason: 保留שְׁנֵי אֲרִיאֵל מוֹאָב在专名、亲属表达和描述性称号之间的真实歧义。
lexical_decisions:
- source_word: אִישׁ חַיִל רַב פְּעָלִים
  choice: 英勇而功绩卓著之人
  rationale: אִישׁ חַיִל在战士名录的语境中表示勇武、有能力的人；רַב פְּעָלִים直指事迹或功业众多。合译为“英勇而功绩卓著之人”，既保留两层意思，也符合现代汉语。
- source_word: מִן קַבְצְאֵל
  choice: 来自甲薛
  rationale: 介词מִן表示来源，故译为“来自”；קַבְצְאֵל采用常见中文音译“甲薛”。
- source_word: הִכָּה
  choice: 击倒
  rationale: נכה的语义范围包括击打、击败、击倒；这里很可能暗示杀死，但原词本身不必强行窄化为“杀死”，故两处统一译为“击倒”。
- source_word: שְׁנֵי אֲרִיאֵל מוֹאָב
  choice: 摩押的两个勇士
  rationale: אֲרִיאֵל在此词义不确定，可能是专名，也可能指如狮般勇猛的人。正文采用符合勇士名录语境的“两个勇士”，并以脚注保留其他可能。
- source_word: יָרַד
  choice: 下到
  rationale: 保留“下去”的空间动作，并与坑的场景自然衔接。
- source_word: בְּתוֹךְ הַבּוֹר
  choice: 坑里
  rationale: 直译其位于坑内部的意思；现代汉语无需生硬译作“坑的中央”。
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: 在一个下雪的日子
  rationale: 以自然现代汉语表达字面上的“在雪之日”，保留当时的特殊环境。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“英勇而功绩卓著”避免文言化，同时保留勇武与事功两方面。第二个“儿子”按马所拉文本的表层句法处理为比拿雅之父系说明，不把“功绩卓著”无依据地直接改作比拿雅的修饰语。
