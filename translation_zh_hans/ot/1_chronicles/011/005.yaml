  text: וַ/יֹּ֨אמְר֜וּ יֹשְׁבֵ֤י יְבוּס֙ לְ/דָוִ֔יד לֹ֥א תָב֖וֹא הֵ֑נָּה וַ/יִּלְכֹּ֤ד דָּוִיד֙ אֶת מְצֻדַ֣ת צִיּ֔וֹן הִ֖יא עִ֥יר דָּוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/005.yaml
  text: The inhabitants of Jebus said to David[a], “You will not come in here.” But David captured the stronghold of Zion, that is, the City of David.
translation:
  language: zh_hans
  text: 耶布斯的居民对大卫说[a]：“你进不了这里。”可是大卫攻取了锡安的堡垒，就是大卫城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你不可到这里来”或“你进不来这里。”希伯来文直译为“你不会来到这里”，在本句中表示拒绝让大卫进入。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי יְבוּס
  choice: 耶布斯的居民
  rationale: 该结构直指住在耶布斯的人；“居民”自然、清楚，并保留其集合意义。
- source_word: לֹא תָבוֹא הֵנָּה
  choice: 你进不了这里
  rationale: 希伯来文直译为“你不会来到这里”，在语境中是拒绝进入并带有断言意味；“进不了这里”自然地表达这种阻拦和挑衅语气。
- source_word: וַיִּלְכֹּד
  choice: 攻取了
  rationale: לכד在军事语境中指夺取或占领地点；“攻取”既体现军事行动，也符合叙事文体。
- source_word: מְצֻדַת צִיּוֹן
  choice: 锡安的堡垒
  rationale: מְצוּדָה指设防的据点或堡垒；“堡垒”是现代中文中准确而易懂的对应词。
- source_word: הִיא עִיר דָּוִיד
  choice: 就是大卫城
  rationale: 这一名词句说明前述锡安堡垒的名称或身份；“就是”简洁地呈现其解释、同位关系。
- source_word: עִיר דָּוִיד
  choice: 大卫城
  rationale: 这是固定的地名性称呼，译作“大卫城”符合中文圣经地名表达习惯。
theological_decisions: []
