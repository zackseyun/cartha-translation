lexical_decisions:
- source_word: סִבְּכַי
  choice: 西比该
  rationale: 人名按希伯来语音译；采用现代中文圣经读者较易辨认的译名形式。
- source_word: הַחֻשָׁתִי
  choice: 户沙人
  rationale: 带定冠词的族属或地名派生称谓；译作“户沙人”，自然表达其出身或所属，同时保留专名。
- source_word: עִילַי
  choice: 以来
  rationale: 按本节希伯来辅音文本音译为“以来”，不受撒母耳记下23:26平行名单中另一名称形式影响。
- source_word: הָאֲחוֹחִי
  choice: 亚合人
  rationale: 带定冠词的宗族称谓，源于专名 אֲחוֹחַ；译作“亚合人”以表达宗族归属。
