  yaml_path: translation/ot/1_chronicles/010/003.yaml
  text: The battle grew heavy against Saul, and the archers found him, and he was badly wounded by the archers.
translation:
  language: zh_hans
  text: 战事对扫罗越发猛烈；弓箭手找到了他，他因弓箭手受了伤[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他因弓箭手而极其痛苦。”这里的希伯来语动词也可表示极度痛苦，而不一定指身体受伤。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד
  choice: 越来越猛烈
  rationale: כבד本义为“变重”，用于战事时表示战斗加剧、压力加重；译作“越来越猛烈”既传达动态发展，也符合现代汉语叙事习惯。
- source_word: הַמִּלְחָמָה עַל שָׁאוּל
  choice: 战事对扫罗
  rationale: מִלְחָמָה译为“战事”；עַל在敌对语境中表示战斗针对或压向扫罗，译作“对扫罗”保留原句关系。
- source_word: וַיִּמְצָאֻהוּ
  choice: 发现了他
  rationale: מצא的基本义是“找到、发现”；此处可能含有追上或寻获之意，但“发现了他”最直接，也不额外限定具体过程。
- source_word: הַמּוֹרִים בַּקָּשֶׁת
  choice: 弓箭手
  rationale: 该短语直译为“用弓射箭的人”，现代汉语自然简洁地称为“弓箭手”。
- source_word: וַיָּחֶל
  choice: 射成重伤
  rationale: 此词在本节语境中可理解为身体受重伤，也可能表示剧烈痛苦或恐惧。正文采用符合战场上下文的受伤义，并以脚注保留另一种重要理解。
- source_word: מִן הַיּוֹרִים
  choice: 被弓箭手
  rationale: מִן可表示原因、来源或施事；配合受伤义，用“被弓箭手”自然表达伤害的来源。动词“射成”则由弓箭手这一语境明确而来。
theological_decisions:
- issue: וַיָּחֶל所指是身体受伤还是内心极度痛苦
  choice: 正文译作“被弓箭手射成重伤”
  alternative: “他因弓箭手而极其痛苦”
  rationale: 战场上下文和古代译本传统支持身体受伤的理解，但希伯来语动词也容许“痛苦、战栗”的解释，因此不在正文中消除歧义，而以脚注明示另一译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“战事对扫罗越来越猛烈”保留希伯来语“变重”的压力意象，同时避免生硬直译；分号使连续的战场动作层次清楚。
