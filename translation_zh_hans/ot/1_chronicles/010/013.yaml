  text: וַ/יָּ֣מָת שָׁא֗וּל בְּ/מַֽעֲל/וֹ֙ אֲשֶׁ֣ר מָעַ֣ל בַּֽ/יהוָ֔ה עַל דְּבַ֥ר יְהוָ֖ה אֲשֶׁ֣ר לֹא שָׁמָ֑ר וְ/גַם לִ/שְׁא֥וֹל בָּ/א֖וֹב לִ/דְרֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/013.yaml
  text: So Saul died for his unfaithfulness by which he was unfaithful to Yahweh[a], because of the word of Yahweh, which he did not keep, and also because he asked counsel of a medium[b], to inquire.
translation:
  language: zh_hans
  text: 扫罗死了，是因为他的不忠，就是他对雅威[a]背信：他没有遵守雅威的话，又求问灵媒[b]，要寻求指引。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因他背信，得罪雅威。”
    reason: lexical_alternative
  - marker: b
    text: “灵媒”指从死者或灵界获取信息的人；参见《撒母耳记上》28:7。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 叙事中的连续式推进事件；结合本句因果说明，用“死了，是因为”自然表达其后果意味。
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: 因为他的不忠，就是他……背信
  rationale: 以“不忠／背信”重现同根名词与动词的强调，同时保留其对神失信的关系性和盟约性含义。
- source_word: בַּיהוָה
  choice: 对雅威
  rationale: 介词标明背信所针对的对象；“对……背信”是自然的现代汉语表达，并保留神名。
- source_word: עַל דְּבַר יְהוָה אֲשֶׁר לֹא שָׁמָר
  choice: 他没有遵守雅威的话
  rationale: שָׁמַר 在此指听从、遵行神的话；“遵守”既自然又保留其约的语境。希伯来语的因由关系已由全句“是因为”统摄。
- source_word: וְגַם לִשְׁאוֹל בָּאוֹב
  choice: 又求问灵媒
  rationale: “又”引入导致扫罗死亡的另一项罪行；“求问灵媒”准确而简洁地表达借相关人物寻求超自然信息。
- source_word: לִדְרֹשׁ
  choice: 要寻求指引
  rationale: 此不定式说明求问灵媒的目的；“寻求指引”在现代汉语中清楚表达寻求信息或指导之意，同时不擅自补出所求问的具体对象。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专名的性质，不以称号代替。
- issue: 扫罗罪行的性质
  choice: 不忠／背信
  alternative: 犯罪；干犯
  rationale: מעל 的名词和同根动词不只泛指过错，也强调对神失信；采用两个相近词既传达这一含义，也尽量反映原文的同根重复。
- issue: עַל דְּבַר יְהוָה 的因果与所涉范围
  choice: 以全句“是因为”统摄，并译作“他没有遵守雅威的话”
  alternative: 因为雅威的话；在雅威的话这件事上
  rationale: 该短语可表示罪责所关涉的内容或原因。中文若逐字重复“因为”较生硬，现译保留因果联系，同时不把“话”缩窄为某一条特定命令。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不忠／背信”保留原文同根词的修辞与神学分量；“灵媒”较“交鬼者”更易为当代普通读者理解，并用脚注说明其古代语境。
