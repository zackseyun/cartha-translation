  text: וְ/לֹֽא דָרַ֥שׁ בַּֽ/יהוָ֖ה וַ/יְמִיתֵ֑/הוּ וַ/יַּסֵּב֙ אֶת הַ/מְּלוּכָ֔ה לְ/דָוִ֖יד בֶּן יִשָֽׁי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/014.yaml
  text: He did not seek Yahweh[b][a], so he put him to death and turned the kingdom over to David son of Jesse.
translation:
  language: zh_hans
  text: 他没有寻求耶和华[a]，所以耶和华使他死去，并把王权[b]转给耶西的儿子大卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寻求”也可译作“求问”或“请示”。
    reason: lexical_alternative
  - marker: b
    text: “王权”也可译作“王国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דָרַשׁ בַּיהוָה
  choice: 寻求耶和华
  rationale: דרשׁ 与介词 ב 连用并以神为对象时，可表示寻求、求问或请示。译作“寻求”既涵盖求问指引的语境，也保留其较广的关系与信仰含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号代替。
- source_word: וַיְמִיתֵהוּ
  choice: 耶和华使他死了
  rationale: מות 的使役式明确表达致死的使役意义；补出承接上文的主语“耶和华”，避免中文中误把扫罗理解为施事者，同时不将神的作为弱化为单纯容许。
- source_word: וַיַּסֵּב
  choice: 转给
  rationale: סבב 的使役式在此表示使王权转归另一人；“转给”自然地表达转移和归属变化。
- source_word: הַמְּלוּכָה
  choice: 王权
  rationale: מְלוּכָה 可指王国、王位、君王职分或统治权；此处所说的是统治权从扫罗转给大卫，故“王权”比地域性的“王国”更贴切，同时保留可译为“国权”的可能。
- source_word: לְדָוִיד בֶּן־יִשַׁי
  choice: 给耶西的儿子大卫
  rationale: 按自然现代汉语表达希伯来文父名结构，并清楚标明大卫是转授对象。
theological_decisions:
- issue: 扫罗之死的施事者
  choice: 经文明确将扫罗的死归于耶和华的行动，因此译为“耶和华使他死了”。
  alternative: 译成“耶和华任凭他死去”，将其理解为许可而非直接施事。
  rationale: 连续叙事动词的主语承接语境中的耶和华，而 וַיְמִיתֵהוּ 是 מות 的使役式。译文保留这种明确的神圣施事，不进一步解释次级原因。
- issue: מְלוּכָה 的所指
  choice: 译作“王权”，侧重被转移的君王统治权。
  alternative: 译作“王国”或“国权”。
  rationale: 本句描述从扫罗到大卫的王权转移；“王权”符合语境，但脚注保留该词可指“国权”的词义幅度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所以”明确表达相邻分句的结果关系；第二分句补出“耶和华”以消除中文代词主语歧义。所有脚注标记均置于对应词语之后。
