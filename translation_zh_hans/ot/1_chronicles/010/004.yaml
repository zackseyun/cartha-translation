  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ אֶל נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָבֹ֜אוּ הָ/עֲרֵלִ֤ים הָ/אֵ֨לֶּה֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ־׀־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and mistreat me.” But his armor-bearer was not willing, because he was very afraid[c][b]. So Saul took the sword and fell on it.
translation:
  language: zh_hans
  text: 扫罗对给他拿兵器的人说：“拔出你的刀来，把我刺透，免得这些未受割礼的人来凌辱我[a]。”但给他拿兵器的人不肯，因为他非常害怕。扫罗就拿起那把刀，倒在刀上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凌辱我”也可译作“虐待我”“拿我取乐”或“羞辱我”。原文没有说明具体方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: 给他拿兵器的人
  rationale: 原文指“携带他装备或兵器的人”。这一表达比带有固定古代军职色彩的“拿兵器的”更符合现代汉语，也准确保留其职能。
- source_word: שְׁלֹף חַרְבְּךָ
  choice: 拔出你的刀来
  rationale: שלף在刀剑语境中指从鞘中拔出；“拔出……来”自然、明确。
- source_word: וְדָקְרֵנִי בָהּ
  choice: 把我刺透
  rationale: דקר表示以尖锐武器刺入或刺穿；上下文明确含致命意图，“刺透”保留了动作力度而不过度扩写。
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: 这些未受割礼的人
  rationale: 保留原文带有族群和宗教身份意味的称呼，不以语境中的“非利士人”替代原文措辞。
- source_word: וְהִתְעַלְּלוּ בִי
  choice: 凌辱我
  rationale: 此处התעלל表达羞辱性、虐待性的处置。“凌辱”兼具侮辱和伤害的含义，同时不武断限定具体方式。
- source_word: וְלֹא אָבָה
  choice: 不肯
  rationale: אָבָה表示愿意或同意，否定式在此自然译为“不肯”，保留其拒绝执行命令之意。
- source_word: כִּי יָרֵא מְאֹד
  choice: 因为他非常害怕
  rationale: 直接保留因果关系及מְאֹד所表达的强烈程度。
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: 伏在刀上
  rationale: 原文直译为“倒在它上面”。汉语圣经叙事中“伏在刀上”自然地表达主动倒向刀刃，又不增加原文没有明说的动作细节。
theological_decisions:
- issue: 扫罗所惧怕的敌方处置
  choice: 来凌辱我
  alternative: 来虐待我；拿我取乐；羞辱我
  rationale: 原词涵盖带有羞辱意味的恶待，具体形式并未说明。“凌辱”保留暴力与羞耻的张力，而不把含义局限于身体虐待或戏弄。
- issue: “未受割礼的人”的身份称呼
  choice: 这些未受割礼的人
  alternative: 这些非利士人
  rationale: 保留原文的族群—宗教性称呼及其修辞锋芒，不以语境推定的族名取代原话。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“给他拿兵器的人”避免生硬术语；“未受割礼的人”保留原文文化称谓；全节仅在确有词义幅度之处加注。
