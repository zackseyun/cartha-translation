    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵי
  choice: 紧追
  rationale: דבק本有“黏住、紧贴”之意，与אַחֲרֵי连用并出现在战事叙事中，表示紧紧追赶；“紧追”自然地保留了追击的迫近感。
- source_word: בָנָיו
  choice: 他的儿子们
  rationale: 该词明确指扫罗的男性后代，且下文列出三人的名字。
- source_word: וַיַּכּוּ
  choice: 击杀了
  rationale: נכה可指击打、击倒；本处列出扫罗战死的儿子，语境明确表明致死，因此译作“击杀了”准确而自然。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经与历史叙事中通行的族名译法，并依原文在两句中重复。
- source_word: יוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֲבִינָדָב
  choice: 亚比拿达
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: מַלְכִּי שׁוּעַ
  choice: 玛基书亚
  rationale: 采用现代中文圣经中通行的人名译法，呈现该希伯来复合人名。
- source_word: בְּנֵי שָׁאוּל
  choice: 扫罗的儿子
  rationale: 保留原文用于说明三位具名人物身份的同位语功能；中文中置于名字之前更自然。
