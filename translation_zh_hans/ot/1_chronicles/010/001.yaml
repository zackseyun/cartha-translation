  text: The Philistines fought against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: zh_hans
  text: 非利士人与以色列交战；以色列人[a]从非利士人面前逃跑，在基利波山上倒毙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个以色列人逃跑”；这里单数的“人”具有集合意义，指以色列人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用这一族名在现代中文圣经中的通行译法。句首 וּ 表示叙事承接；中文以直接起句配合分号推进，避免添加原文没有的明确时间副词。
- source_word: נִלְחֲמוּ בְיִשְׂרָאֵל
  choice: 与以色列交战
  rationale: לחם 的尼法勒式与介词 ב 连用，在此军事语境中指敌对交战；“与……交战”自然准确。
- source_word: וַיָּנָס אִישׁ יִשְׂרָאֵל
  choice: 以色列人逃跑
  rationale: אִישׁ 虽为单数形式，在这里具有集合或逐一分配的意义；正文采用自然的集合称谓“以色列人”，并以脚注说明原文形式。
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: 从非利士人面前
  rationale: 保留 מִפְּנֵי“从……面前”的空间意象和面对敌军败退的意味，同时符合庄重的现代中文表达。
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: 倒下被杀
  rationale: נפל 与 חֲלָלִים 构成战场惯用表达，指作为被杀者倒下；“倒下被杀”既保留“倒下”的图像，也明确死亡源于杀戮。
- source_word: בְּהַר גִּלְבֹּעַ
  choice: 在基利波山上
  rationale: “基利波山”采用通行地名译法；介词 ב 在此地形语境中自然译为“在……山上”。
