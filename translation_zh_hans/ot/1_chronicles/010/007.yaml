  to: 在谷地里的以色列所有男子[b]看见他们已经逃走，又看见扫罗和他的儿子们都死了，就离弃他们的城邑，逃走了；非利士人随后来到，住在[c]那些城邑里。
  rationale: 修订避免把“在谷地里”解释为“居住在谷地”，避免为“来到”添加“进来”的方向性；并以“离弃他们的城邑”改善现代汉语表达，同时将脚注c移至其所说明的“住在”之后。隐含的“他们”仍未被擅自指定，保留原文的指称含混性。
