base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
translation:
  language: zh_hans
  text: 在谷地里的以色列所有男子[b]看见他们已经逃走，又看见扫罗和他的儿子们都死了，就离弃他们的城邑，逃走了；非利士人随后来到，住在[c]那些城邑里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 原文直译为“以色列的所有男子”，明确使用阳性称谓，而不是不标明性别的统称。
    reason: lexical_alternative
  - marker: c
    text: “住在”也可译为“定居在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 看见
  rationale: 采用ראה的基本义，保留叙事中的亲眼观察，而不解释性地译为“意识到”。
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: 所有以色列男子
  rationale: כָּל之后的单数אִישׁ具有周遍或分配意义，且原文明确使用阳性称谓；“男子”在现代汉语中自然并保留这一点。
- source_word: אֲשֶׁר בָּעֵמֶק
  choice: 住在谷地的
  rationale: עֵמֶק通常指谷地；关系从句在汉语中前置，使句子自然流畅。“平原”是可能的地形理解，列入脚注。
- source_word: כִּי נָסוּ
  choice: 他们已经逃跑
  rationale: 原文省略主语，译作“他们”保留所指的含混性；“已经”体现逃跑先于看见其结果。
- source_word: וְכִי מֵתוּ שָׁאוּל וּבָנָיו
  choice: 又看见扫罗和他的儿子们都死了
  rationale: “死了”自然表达מות在此处的完成及结果状态；重复“看见”使两个כִּי分句在汉语中关系清楚。
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  choice: 就弃掉自己的城
  rationale: עזב表示离弃、留下；“弃掉”体现因战败而撤离，עָרֵיהֶם的所有关系译作“自己的城”。
- source_word: וַיָּנֻסוּ
  choice: 逃走了
  rationale: 直接表达נוס的常用义，并与前面的弃城形成连续动作。
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: 非利士人随后进来
  rationale: “随后”表达叙事次序；结合下文处所，汉语“进来”自然表达他们进入这些城。
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: 住在那些城里
  rationale: ישב可指居住或定居；正文采用通俗自然的“住”，并明确复数代词所指的是前述各城。
theological_decisions: []
