  naturalness: 修订后仍为庄重、清楚的现代标准汉语。“取走他的头”在此战争叙事语境中虽较直译，但自然可懂，且避免添加原文此处未表达的动作。“把消息传遍……，向……报信”略有语义递进，但有效呈现原文“差遣／传送……为要报信”的结构。
  terminology: “非利士”“偶像”“百姓”均恰当。“偶像”适合עֲצַבֵּיהֶם的崇拜及贬义语境；脚注列出“神像”这一较中性的替代译法，可保留词义幅度而不削弱正文的语境判断。
