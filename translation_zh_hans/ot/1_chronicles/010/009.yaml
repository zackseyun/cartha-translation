base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/009.yaml
  text: They stripped him[a], took his head and his weapons, and sent word throughout the land of the Philistines to proclaim the news to their idols and to the people.
translation:
  language: zh_hans
  text: 他们剥去扫罗的衣服，取走他的头和兵器，又把消息传遍非利士全地，向他们的偶像[a]和百姓报信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”或译“神像”。希伯来语这个词可指用作崇拜对象的塑像。
    reason: 保留עֲצַבֵּיהֶם在“偶像”与“神像”之间的词义幅度。
lexical_decisions:
- source_word: וַיַּפְשִׁיטֻהוּ
  choice: 剥去扫罗身上的衣甲
  rationale: פשט在此语态中表示剥去衣物或甲胄。直译“剥了他”在现代汉语中含混且不自然；“衣甲”保留衣物与甲胄两种可能，并以“扫罗”明确代词所指。
- source_word: וַיִּשְׂאוּ אֶת־רֹאשׁוֹ
  choice: 割下他的头
  rationale: נשא本义为拿起、带走；但此处所拿的是扫罗的头，语境必然涉及斩首。汉语“割下他的头”自然表达这一动作，不过比单纯的“拿走”略为明确。
- source_word: כֵּלָיו
  choice: 他的兵器
  rationale: כְּלִי可泛指器具、装备或武器；战场语境中译作“兵器”最为贴切，也避免与前面的衣甲完全重叠。
- source_word: וַיְשַׁלְּחוּ בְאֶרֶץ־פְלִשְׁתִּים סָבִיב
  choice: 把消息传遍非利士全地
  rationale: 原文只说“他们差遣/发送”，没有明说所差遣的人或所发送的事物；结合后面的“报信”，汉语用“把消息传遍”自然表达隐含内容，同时不擅自加入“使者”。
- source_word: לְבַשֵּׂר
  choice: 报信
  rationale: בשר表示宣告消息，在这里是宣扬战胜扫罗的喜讯；“报信”保留消息对非利士人而言具有喜讯性质的语境，又不引入后世专门术语。
- source_word: עֲצַבֵּיהֶם
  choice: 他们的偶像
  rationale: עֶצֶב可指塑像或偶像；此处是非利士宗教崇拜的对象，译作“偶像”符合该词在希伯来圣经中的贬义色彩。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文是带定冠词的集合名词“那民/百姓”，在上下文中指非利士民众；不添加原文没有的物主词。
theological_decisions:
- issue: 宗教语境中עֲצַבֵּיהֶם的译法
  choice: 他们的偶像
  alternative: 他们的神像
  rationale: “偶像”体现该词常有的贬义评价，并准确指向受崇拜的塑像；“神像”也是可能的较中性译法，故列入脚注以保留词义幅度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“扫罗”补明代词指向，便于单节阅读；整体保持叙事简洁。脚注标记置于“偶像”之后，与其实际说明对象一致。
