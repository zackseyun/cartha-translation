  yaml_path: translation/ot/1_chronicles/010/011.yaml
  text: When all Jabesh-gilead heard all that the Philistines had done to Saul[b][a],
translation:
  language: zh_hans
  text: 基列雅比全城的人[a]听见非利士人对扫罗所做的一切[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“全基列雅比”，这里指城中的全体居民。
    reason: lexical_alternative
  - marker: b
    text: 或译：“加在扫罗身上的一切事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: 听见
  rationale: 叙事中的连续式推进情节；本句与下一节连成“听见……就行动”的结构，现代汉语无需另译句首连接词也能清楚表达先后关系。
- source_word: כֹּל יָבֵישׁ גִּלְעָד
  choice: 基列雅比全城的人
  rationale: 原文直译为“全基列雅比”，以城名代指其中居民。译作“全城的人”既保留整体范围，也符合现代汉语表达。
- source_word: אֵת כָּל אֲשֶׁר
  choice: 所做的一切
  rationale: 表达原文所指行为的全部内容，简洁自然，并保留其概括性。
- source_word: עָשׂוּ
  choice: 所做
  rationale: 上下文已表明非利士人的行动发生在听闻之前；汉语通常不需另加完成标记。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经传统中通行的族名译法。
- source_word: לְשָׁאוּל
  choice: 对扫罗
  rationale: 介词 לְ 在这里标明行为所涉及或指向的人；“对扫罗”保留中性关系，不把语义强化为“加害于扫罗”。
