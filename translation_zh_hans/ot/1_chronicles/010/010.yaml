base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/010.yaml
  text: They put his armor in the house of their gods[b][a], and they fastened his skull in the house of Dagon.
translation:
  language: zh_hans
  text: 他们把扫罗的兵器放在他们众神的殿里[a]，又把他的头骨[b]钉在大衮的殿里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“房屋”或“家”；这里指神明的庙宇。本节两处相同。
    reason: lexical_alternative
  - marker: b
    text: 或译“头”。这里的希伯来词既可指头骨，也可转指整个头。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: 放在
  rationale: שׂים表示“放、安置”；“放在”是自然、准确的现代汉语表达。
- source_word: כֵּלָיו
  choice: 扫罗的兵器
  rationale: כְּלִי可指器具、装备或兵器；在战死并被剥取战具的语境中，“兵器”能表达最可能的所指，又不把它限定为铠甲。原文代词直译为“他的”，此处补出“扫罗”以消除汉语中可能的指代不清。
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: 他们众神的殿里
  rationale: בַּיִת字面为“房屋、家”，用于神明时通常指神殿；“殿”符合中文宗教语境，并保留复数“众神”。
- source_word: גֻּלְגָּלְתּוֹ
  choice: 他的头骨
  rationale: גֻּלְגֹּלֶת可指头骨，也可转指头；“头骨”更直接反映该名词的具体含义及战利品展示的语境。
- source_word: תָקְעוּ
  choice: 钉在
  rationale: תקע可表示刺入、打入或牢牢固定；“钉在”传达将头骨固定展示的动作，同时不明确增添“用长矛刺穿”等原文未说明的细节。
- source_word: בֵּית דָּגוֹן
  choice: 大衮的殿里
  rationale: בֵּית在敬拜场所语境中指神殿；דָּגוֹן按传统音译为“大衮”。
