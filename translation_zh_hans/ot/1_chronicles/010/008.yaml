base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/008.yaml
  text: It happened on the next day that the Philistines came to strip the slain[b][a], and they found Saul and his sons fallen on Mount Gilboa.
translation:
  language: zh_hans
  text: 第二天，非利士人前来搜掠阵亡者[a]，发现扫罗和他的儿子们倒在基利波山上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“搜掠”是指从阵亡者身上取走衣服、盔甲等战利品。
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: 第二天
  rationale: 指前述战事之后的一天；“第二天”自然、简明，并保留叙事的时间顺序。
- source_word: לְפַשֵּׁט
  choice: 剥取……身上的财物
  rationale: 此动词在战场语境中指从死者身上取走衣服、兵器等战利品；补出“身上的财物”可避免现代汉语将“剥”误解为剥皮。
- source_word: הַחֲלָלִים
  choice: 阵亡者
  rationale: 专指战斗中被杀的人，比泛称“死者”更能保留军事语境。
- source_word: נֹפְלִים
  choice: 倒毙
  rationale: 保留“倒下”的意象，同时在本段上下文中明确他们已经死亡。
- source_word: בְּהַר גִּלְבֹּעַ
  choice: 在基利波山上
  rationale: 按专名和地点介词直译，符合现代汉语地名表达。
- source_word: וַיְהִי
  choice: 第二天，
  rationale: 该叙事承接公式在现代汉语中不必机械译作“事情是这样”；以时间短语起句即可自然体现叙事推进。
