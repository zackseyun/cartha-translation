base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/006.yaml
  text: So Saul died[a], and his three sons, and all his house died together.
translation:
  language: zh_hans
  text: 于是，扫罗死了；他的三个儿子和他全家[a]也都一同死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全家”直译为“他的家”；可指他的家属、家室或家族（家系），不一定指一座实际的房屋。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 这样，……死了
  rationale: 该叙事性动词形式推进情节，并承接上文所述结果；“这样”在现代汉语中自然体现这种承接关系，动词本义为“死”。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: 他的三个儿子
  rationale: 数词、名词及第三人称阳性单数词尾组成的结构，指上下文已经提到的扫罗三个儿子，并非“三个儿子中的一些”。
- source_word: וְכָל בֵּיתוֹ
  choice: 他全家
  rationale: בַּיִת在此并非指建筑物，而可指家属、家室或家族。正文用自然的“全家”保留其集体含义，脚注说明其语义范围，避免过度限定。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 准确表达该副词“共同、一起”的意义，修饰这群人的死亡。
- source_word: מֵתוּ
  choice: 都……死了
  rationale: 该词是מוּת的第三人称复数完成式；“都”体现复数整体，“死了”自然表达已发生的事件。正文保留前后两次“死了”，对应希伯来文的重复和强调。
theological_decisions:
- issue: “他全家”的范围
  choice: 正文译作“他全家”，但不将其解释为扫罗所有亲属无一例外全部死亡。
  alternative: 他所有的家属；他的整个家族
  rationale: 希伯来语“他的全家”可指家属、家室或家族谱系；上下文聚焦于与扫罗一同在战事中覆亡的人。保留较宽泛的表达，可避免加入原文没有明确作出的绝对历史断言。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这样”承接上文并表示叙事结果；分号区分单数动词“扫罗死了”和随后复数概括“都一同死了”，既保持可读性，也尽量呈现希伯来文结构。
