  text: When his armor-bearer saw that Saul was dead[b][a], he too fell on the sword and died.
translation:
  language: zh_hans
  text: 扫罗拿兵器的人[a]见扫罗已经死了，也伏在刀上[b]，死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为他拿兵器的人”；原文直译是“拿他器械的人”。
    reason: lexical_alternative
  - marker: b
    text: “伏在刀上”在这里是指用刀自尽。
    reason: cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: 扫罗的拿兵器者
  rationale: 该短语直译为“拿他器械（或兵器）的人”，在军事语境中指随从并为主人携带兵器的人。“拿兵器者”简洁地保留了这一职分；补出“扫罗的”使中文所指清楚。
- source_word: כִּי מֵת שָׁאוּל
  choice: 见扫罗已经死了
  rationale: כִּי在这里引出“见”的内容；מֵת描述扫罗当时已处于死亡状态。“已经死了”符合现代汉语叙事，同时不改变原文所陈述的状态。
- source_word: גַּם הוּא
  choice: 也
  rationale: 保留附加和强调的意思，表明拿兵器者继扫罗之后采取同样的行动。中文主语可由上文自然承接，无须机械译出“他自己”。
- source_word: וַיִּפֹּל עַל הַחֶרֶב
  choice: 倒在刀上
  rationale: 保留נפל“倒下”和עַל“在……上”的具体意象，也不把原文的“那刀”擅自改为“自己的刀”。上下文表明这是以刀自尽，脚注予以说明。
- source_word: וַיָּמֹת
  choice: 死了
  rationale: 直接呈现连续叙事的结果，保持原文简短有力的节奏。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“拿兵器者”比“护卫”更贴近原文职分；“倒在刀上”保留希伯来语的具体表达，并用脚注帮助普通读者理解其含义。
