base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/012.yaml
  text: Then all the valiant men arose and carried away the body of Saul and the bodies of his sons[a], and brought them to Jabesh[b]. They buried their bones under the oak in Jabesh and fasted seven days.
translation:
  language: zh_hans
  text: 所有的勇士都起来了，抬走扫罗的尸体和他儿子们的尸体，把他们带到雅比[a]。他们把他们的骸骨葬在雅比的橡树[b]下，又禁食七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较完整的地名是“基列的雅比”；本节希伯来文简称“雅比”。
    reason: cross_reference
  - marker: b
    text: 或译“笃耨香树”。希伯来语 אֵלָה 可指笃耨香树或橡树一类的大树。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: 所有勇士
  rationale: 这是表示勇武、胆识或军事能力的惯用语。译作“所有勇士”自然简洁，也保留其军事和荣誉色彩。
- source_word: וַיִּשְׂאוּ
  choice: 抬走
  rationale: 此处指把尸体从原处抬起并运走；“抬走”同时表达了承载和移离。
- source_word: גּוּפַת ... גּוּפֹת
  choice: 扫罗的尸体和他众子的尸体
  rationale: גּוּפָה在这里明确指死者的身体。“尸体”准确而清楚；重复“尸体”保留原文单复数相应的表达。
- source_word: וַיְבִיאוּם יָבֵישָׁה
  choice: 把他们运到雅比
  rationale: 原文在本节只写“雅比”，方向词尾表明“到雅比”。不在正文补入“基列”，以忠实保留本节的简称。
- source_word: עַצְמוֹתֵיהֶם
  choice: 这些人的骸骨
  rationale: עֶצֶם字面指骨头。“骸骨”既保留具体意象，也符合安葬死者遗骨的庄重语境；“这些人”清楚回指扫罗和他的众子。
- source_word: תַּחַת הָאֵלָה
  choice: 橡树下
  rationale: אֵלָה可指橡树类或笃耨香树类的大树。“橡树”通俗自然，但树种并不完全确定，因此以脚注保留另一可能。
- source_word: וַיָּצֻמוּ שִׁבְעַת יָמִים
  choice: 禁食了七天
  rationale: 直接表达持续七天的禁食，并以现代汉语的“了”自然呈现已完成的叙事动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文“尸体”与“骸骨”的转换，不把它们笼统改成“遗体”或“遗骸”；地名按本节原文用简称“雅比”，树种的不确定性则放入脚注。
