base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'These were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
translation:
  language: zh_hans
  text: 以下是大卫在希伯仑所生的儿子：长子暗嫩，是耶斯列人亚希暖所生；次子但以理[a]，是迦密人亚比该所生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在《撒母耳记下》3:3的平行名单中，这个儿子名叫“基利押”，而不是“但以理”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ
  choice: 以下是
  rationale: 用现代汉语自然引出家谱名单；不另加原文没有的时间副词，同时保留承接上下文并指示下文的作用。
- source_word: בְּנֵי דָוִיד
  choice: 大卫……的儿子
  rationale: 保留“儿子”的男性限定和家谱性质，并按汉语句法与后面的出生地点连成一句。
- source_word: אֲשֶׁר נוֹלַד לוֹ בְּחֶבְרוֹן
  choice: 大卫在希伯仑所生的
  rationale: “所生的”是汉语家谱常用表达，传达这些儿子归于大卫、出生于希伯仑；不改写成强调主动生育的措辞。
- source_word: הַבְּכוֹר
  choice: 长子
  rationale: 在汉语家谱语境中，“长子”自然地表达首生者及其排行身份。
- source_word: לַאֲחִינֹעַם הַיִּזְרְעֵאלִית
  choice: 是耶斯列人亚希暖所生
  rationale: 此处介词引出母亲；汉语用“某人所生”清楚表达母子关系。“耶斯列人”保留其地域身份。
- source_word: שֵׁנִי
  choice: 次子
  rationale: 自然表达名单中的第二位，并与“长子”形成整齐对应。
- source_word: דָּנִיֵּאל
  choice: 但以理
  rationale: 采用该希伯来人名在简体中文圣经传统中的通行译名，并保留本节本身的读法。
- source_word: לַאֲבִיגַיִל הַכַּרְמְלִית
  choice: 是迦密人亚比该所生
  rationale: 以自然汉语表达母亲身份，并保留亚比该来自迦密的地域称谓。
