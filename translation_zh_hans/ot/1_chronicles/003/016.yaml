  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
translation:
  language: zh_hans
  text: 约雅敬的儿子们：耶哥尼雅，他的儿子；西底家，他的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: 的儿子们
  rationale: בְּנֵי是“儿子”的复数构造形式，引出家谱名单；前缀ו承接上文。中文以连续的家谱语气自然表达，不机械译出“和”。
- source_word: יְהוֹיָקִים
  choice: 约雅敬
  rationale: 采用现代中文圣经中通行且易识别的人名译法。
- source_word: יְכָנְיָה
  choice: 耶哥尼雅
  rationale: 按本节希伯来文形式יְכָנְיָה采用通行中文音译，以区别于其他拼写形式。
- source_word: בְנ֖/וֹ
  choice: 他的儿子
  rationale: 保留名词בֵּן及第三人称阳性单数后缀的明确表达，也保留原文简短而可能有歧义的指代。
- source_word: צִדְקִיָּה
  choice: 西底家
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בְנֽ/וֹ
  choice: 他的儿子
  rationale: 原文再次使用同一亲属短语，译文照样重复，不擅自确定代词究竟回指约雅敬还是耶哥尼雅。
theological_decisions:
- issue: 简略家谱句式中的亲属关系
  choice: 正文按希伯来文次序直译为“他的儿子耶哥尼雅，他的儿子西底家”，保留“他的”所指的含混性。
  alternative: 可理解为耶哥尼雅和西底家都是约雅敬的儿子；也可把第二个“他的儿子”理解为承接耶哥尼雅，形成连续世系。
  rationale: 希伯来文两次重复בְנוֹ，却没有进一步说明代词所指。译文不借其他历史经文来协调或重构本节家谱，而以脚注说明两种可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文保留家谱式的简洁和重复；“儿子们”对应复数标题，“他的儿子”则保留原文的指代张力。
