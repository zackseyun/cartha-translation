  yaml_path: translation/ot/1_chronicles/003/012.yaml
  text: Amaziah his son[a], Azariah his son, Jotham his son.
translation:
  language: zh_hans
  text: 亚玛谢是他的儿子；亚撒利雅[a]是他的儿子；约坦是他的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此王在别处也称为乌西雅。
    reason: 说明同一位君王的另一名字，同时保留本节希伯来原文“亚撒利雅”的读法。
lexical_decisions:
- source_word: אֲמַצְיָהוּ
  choice: 亚玛谢
  rationale: 按现代中文圣经常用译名音译此人名。
- source_word: בְנוֹ
  choice: 他的儿子／……的儿子是
  rationale: 希伯来语为带第三人称阳性单数后缀的“儿子”；在中文谱系句式中转换为“某人的儿子是某某”，既自然又保留直接的父子关系。
- source_word: עֲזַרְיָה
  choice: 亚撒利雅
  rationale: 忠实采用本节希伯来文本的人名形式 עֲזַרְיָה，不以此王在别处使用的名字“乌西雅”取代。
- source_word: יוֹתָם
  choice: 约坦
  rationale: 按现代中文圣经常用译名音译此人名。
theological_decisions:
- issue: 王室家谱中的父子关系用语
  choice: 三处均保留“儿子”的明确关系，以自然中文谱系句式表达。
  alternative: 译作“后代”，以反映圣经家谱有时可能省略世代。
  rationale: 原文三次明确使用 בְנוֹ（“他的儿子”）。本节没有必要将其泛化为“后代”；保留“儿子”更透明，也不对家谱是否存在世代压缩作额外判断。
- issue: 亚撒利雅与乌西雅的异名
  choice: 正文译“亚撒利雅”，脚注说明此王也称乌西雅。
  alternative: 正文直接译“乌西雅”，以便与其他经文中的常见称呼统一。
  rationale: 本节原文明确写作 עֲזַרְיָה，因此正文应反映该形式；脚注提供异名信息，避免用协调性译法覆盖原文措辞。
translation_notes:
  register: 采用简洁、庄重而自然的现代普通话。将原文连续的“某某，他的儿子……”调整为中文清楚的谱系句式；不增添“作王”等原文没有的内容。
