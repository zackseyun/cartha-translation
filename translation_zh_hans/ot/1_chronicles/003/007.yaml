- source_word: יָפִיעַ
  choice: 雅非亚
  rationale: 这是家谱中的人名，依据希伯来语读音音译；末尾咽音不在汉字中另作生硬标示。
- source_word: וְ
  choice: 、
  rationale: 希伯来语连词逐项连接名字；现代汉语列举人名时用顿号表达最自然，无须在末项前另加“和”。
