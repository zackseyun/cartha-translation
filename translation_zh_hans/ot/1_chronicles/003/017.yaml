  yaml_path: translation/ot/1_chronicles/003/017.yaml
  text: 'And the sons of Jeconiah: Assir[a], Shealtiel his son.'
translation:
  language: zh_hans
  text: 耶哥尼雅的儿子们：亚惜[a]；撒拉铁——他的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被掳的耶哥尼雅的儿子们：撒拉铁——他的儿子。”希伯来语“亚惜”既可读作人名，也可作普通名词，意为“被掳者”或“囚犯”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: ……的儿子们
  rationale: בְנֵי是复数，按家谱用语译为“儿子们”；连接词ו在中文中可由上下文自然承接，不必机械译出“和”。
- source_word: יְכָנְיָה
  choice: 耶哥尼雅
  rationale: 按现代中文圣经人名的通行音译处理此希伯来名字。
- source_word: אַסִּר
  choice: 亚惜
  rationale: 正文依马所拉元音及家谱列名结构将其视为人名；但该词也可作普通名词“被掳者”，故以脚注保留歧义。
- source_word: שְׁאַלְתִּיאֵל
  choice: 撒拉铁
  rationale: 采用现代中文圣经中较为通行的人名译法。
- source_word: בְּנוֹ
  choice: 他的儿子
  rationale: 忠实表达第三人称单数所属后缀。其所指在紧凑的家谱句法中存在一定理解空间，因此不在译文中增补姓名来消除张力。
theological_decisions:
- issue: אַסִּר应理解为人名，还是意为“被掳者”的称号
  choice: 正文作人名“亚惜”
  alternative: “被掳的耶哥尼雅的儿子：他的儿子撒拉铁”
  rationale: 马所拉读法及家谱列名形式支持将其视为人名，但同一希伯来词也确可表示“囚犯、被掳者”。这一差异关系到本节列出的人物及语法结构，故以脚注保存另一种读法，不静默裁定。
- issue: בְּנוֹ“他的儿子”的先行词
  choice: 保持代词形式“他的儿子”
  alternative: 明确译作“耶哥尼雅的儿子”或“亚惜的儿子”
  rationale: 原文只用所属后缀，没有重复姓名。中文保留代词，可避免加入原文未明说的指代判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留家谱的简洁列举风格。人名使用简体中文圣经语境中较通行的形式；脚注直接说明希伯来语的词汇歧义。
