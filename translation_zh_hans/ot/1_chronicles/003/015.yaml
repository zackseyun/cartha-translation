base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
translation:
  language: zh_hans
  text: 约西亚的儿子是：长子约哈难，次子约雅敬，三子西底家，四子沙龙[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的沙龙通常被认为就是《列王纪下》23:30—34和《耶利米书》22:11中的约哈斯；但历代志作者在约西亚的家谱中保留了“沙龙”这个名字。
    reason: 交叉经文说明，并保留本节人名与《列王纪下》、 《耶利米书》记载之间的文本张力。
lexical_decisions:
- source_word: וּבְנֵי
  choice: 的儿子是
  rationale: 承接上文的系谱叙述；中文以“约西亚的儿子是”自然引出名单，不机械译出句首连接词ו，同时保留בְנֵי所指的亲生儿子含义。
- source_word: יֹאשִׁיָּהוּ
  choice: 约西亚
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: הַבְּכוֹר
  choice: 长子
  rationale: 准确表达בכור的出生次序及长子身份，也符合中文系谱用语。
- source_word: יוֹחָנָן
  choice: 约哈难
  rationale: 采用该希伯来名字在中文圣经中的通行音译。
- source_word: הַשֵּׁנִי
  choice: 次子
  rationale: 在儿子名单中以自然、简洁的中文表达第二位的出生次序。
- source_word: יְהוֹיָקִים
  choice: 约雅敬
  rationale: 按本节所载名字音译，不改用其旧名以利亚敬。
- source_word: הַשְּׁלִשִׁי
  choice: 三子
  rationale: 与“长子、次子、四子”构成一致而自然的中文次序表达。
- source_word: צִדְקִיָּהוּ
  choice: 西底家
  rationale: 采用现代中文圣经中通行的王名译法。
- source_word: הָרְבִיעִי
  choice: 四子
  rationale: 直接保留原文所标明的第四位出生次序。
- source_word: שַׁלּוּם
  choice: 沙龙
  rationale: 忠实音译本节马所拉文本中的人名，不在正文中改作约哈斯。
theological_decisions:
- issue: 家谱出生次序与诸王继位次序之间的张力
  choice: 照原文将四人列为约西亚的儿子，并保留长子、次子、三子、四子的次序标签。
  alternative: 按列王纪所载的登基次序重排，或在正文中把沙龙直接写成约哈斯。
  rationale: 本节明确以序数呈现家谱次序，译文不应拿后来诸王的继位次序来改写原文；沙龙与约哈斯的常见认同留在脚注说明。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；以“长子、次子、三子、四子”呈现系谱节奏。脚注标记放在“约哈难”之后，对应英文咨询层的位置；脚注内容实际说明名单末尾的沙龙。
