base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/010.yaml
  text: And the son of Solomon was Rehoboam; Abijah his son[a], Asa his son, Jehoshaphat his son.
translation:
  language: zh_hans
  text: 所罗门的儿子是罗波安；罗波安的儿子是亚比雅[a]，亚比雅的儿子是亚撒，亚撒的儿子是约沙法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“亚比雅”。在《列王纪上》中，这位王也以另一名字形式“亚比央”出现。
    reason: 说明同一人物在相关经文中的名字变体，同时准确限定异名出现的书卷。
lexical_decisions:
- source_word: וּ/בֶן
  choice: 的儿子是
  rationale: 这里的连接词与“儿子”共同承接家谱的下一环。中文用“的儿子是”自然表达父子承继关系；分号已承担上下文的连接作用。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: רְחַבְעָם
  choice: 罗波安
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: אֲבִיָּה
  choice: 亚比雅
  rationale: 忠实反映本节《历代志》希伯来文本中的名字形式אֲבִיָּה；《列王纪》部分经文所见“亚比央”属于另一名字形式。
- source_word: בְנ/וֹ
  choice: 他的儿子／某人的儿子是
  rationale: 该词由“儿子”加第三人称阳性单数后缀组成，表示家谱中的父子承继。为避免连续多个“他的”所造成的中文指代含混，正文逐次复述父名。
- source_word: אָסָא
  choice: 亚撒
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
