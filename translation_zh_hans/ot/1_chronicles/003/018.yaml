  yaml_path: translation/ot/1_chronicles/003/018.yaml
  text: Malchiram[a], Pedaiah, Shenazzar, Jekamiah, Hoshama, and Nedabiah.
translation:
  language: zh_hans
  text: 玛基兰、毗大雅、示拿萨、耶加米雅、何沙玛和尼大比雅。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּירָם
  choice: 玛基兰
  rationale: 家谱中的人名，按希伯来语读音音译；采用适合现代中文圣经人名风格的形式。
- source_word: פְדָיָה
  choice: 毗大雅
  rationale: 专名音译；沿用中文读者较熟悉的圣经人名形式，并以“雅”体现名称末尾的神名成分。
- source_word: שֶׁנְאַצַּר
  choice: 示拿萨
  rationale: 专名音译；以自然、易读的中文形式近似希伯来语读音，不强行解释其可能的词源。
- source_word: יְקַמְיָה
  choice: 耶加米雅
  rationale: 专名音译；保留起首的 y 音及末尾的神名成分，采用现代中文可读的音节组合。
- source_word: הוֹשָׁמָע
  choice: 何沙玛
  rationale: 专名音译；尽量对应希伯来语的辅音和元音轮廓。
- source_word: נְדַבְיָה
  choice: 尼大比雅
  rationale: 专名音译；末尾用“雅”体现名称中的神名成分。
- source_word: וּ / וְ
  choice: 、；末项前用“和”
  rationale: 这些前缀连词连接人名。中文列举采用顿号，并在最后一项前用“和”，既自然又保留名单结构。
