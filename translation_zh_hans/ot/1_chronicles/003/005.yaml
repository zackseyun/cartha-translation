base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/005.yaml
  text: 'These were born to him in Jerusalem: Shimea[a], Shobab, Nathan[b], and Solomon—four by Bath-shua daughter of Ammiel.'
translation:
  language: zh_hans
  text: 在耶路撒冷为他所生的有：示米亚[b]、朔罢、拿单和所罗门，共四人，都是亚米利的女儿拔书亚[a]所生的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在《撒母耳记下》11:3，她称为拔示巴，是以连的女儿；《撒母耳记下》5:14记载了这份儿子名单的平行经文。
    reason: alternative_reading
  - marker: b
    text: 本节希伯来文作“示米亚”；《撒母耳记下》5:14的平行经文作“沙母亚”。
    reason: textual_variant
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 有
  rationale: 在承接上文家谱的句式中，用“有”自然引出下一组儿子；其指示作用由整句结构体现。
- source_word: נוּלְּדוּ לוֹ
  choice: 为他所生的
  rationale: 保留 ילד 的尼法勒式被动意义；“他”按上文指大卫，不在本节擅自补名。
- source_word: בִּירוּשָׁלָיִם
  choice: 在耶路撒冷
  rationale: 直接表达出生地点。
- source_word: שִׁמְעָא
  choice: 示米亚
  rationale: 按本节马所拉文本的名字形式音译，不与《撒母耳记下》平行经文的“沙母亚”协调统一。
- source_word: שׁוֹבָב
  choice: 朔罢
  rationale: 采用现代中文圣经读者较熟悉的专名译法。
- source_word: נָתָן
  choice: 拿单
  rationale: 采用通行中文圣经人名。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用该君王通行且易识别的中文名字。
- source_word: אַרְבָּעָה
  choice: 共四人
  rationale: 明确这是对前列四个名字的总数概括。
- source_word: לְבַת שׁוּעַ
  choice: 都是……拔书亚所生的
  rationale: 在中文家谱语境中自然表达母系关系，同时保留介词在此所表示的生育来源。
- source_word: בַּת עַמִּיאֵל
  choice: 亚米利的女儿
  rationale: 按希伯来文直译其父女关系，并采用通行音译。
theological_decisions:
- issue: 《历代志》与《撒母耳记》平行经文中大卫妻子的姓名及父名不同
  choice: 拔书亚，亚米利的女儿
  alternative: 拔示巴，以连的女儿
  rationale: 正文忠实采用《历代志上》本节的马所拉文本，不以平行经文协调替换；差异留在脚注中说明。
- issue: 示米亚的名字形式与平行经文不同
  choice: 示米亚
  alternative: 沙母亚
  rationale: 保留本节 שִׁמְעָא 的实际形式，不静默改成《撒母耳记下》5:14的 שַׁמּוּעַ。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句首以地点短语引出名单，并用“共四人”保留原文的总结数词。脚注标记依其内容分别置于“拔书亚”和“示米亚”之后，以免错配。
