  text: 亚们是他的儿子；约西亚是亚们的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמ֥וֹן
  choice: 亚们
  rationale: 犹大王的专名，采用现代中文圣经中通行的音译。
- source_word: בְּנ֖וֹ
  choice: 他的儿子是
  rationale: בֵּן带第三人称阳性单数词尾，直义为“他的儿子”；按中文家谱表达调整为“他的儿子是”，清楚呈现父子承接关系。
- source_word: יֹאשִׁיָּ֥הוּ
  choice: 约西亚
  rationale: 专名采用现代中文圣经中通行的译名，所指与希伯来名字יֹאשִׁיָּהוּ相同。
- source_word: בְנֽוֹ
  choice: （由句式表达）
  rationale: 希伯来文在“约西亚”之后再次使用“他的儿子”，承接上一节及下一节的链式家谱结构；中文若孤立逐字重复会形成不完整表达，因此以“亚们的儿子是约西亚”自然呈现本节明确陈述的关系。
