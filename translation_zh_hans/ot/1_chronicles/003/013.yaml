  yaml_path: translation/ot/1_chronicles/003/013.yaml
  text: Ahaz his son[a], Hezekiah his son, Manasseh his son.
translation:
  language: zh_hans
  text: 他的儿子[a]亚哈斯，亚哈斯的儿子希西家，希西家的儿子玛拿西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“儿子”在家谱中有时也可泛指后代，但本节采用的是通常表示“他的儿子”的固定格式。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחָז
  choice: 亚哈斯
  rationale: 采用现代中文圣经中通行的人名译法，使读者易于辨认；此名按音译处理。
- source_word: בְּנוֹ
  choice: 他的儿子
  rationale: בֵּן带第三人称阳性单数词尾，最直接的意思是“他的儿子”。此处保留家谱承接关系，并以脚注说明该词在家谱中可能有较宽泛的用法。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经中通行且易于辨认的人名译法。
- source_word: בְנוֹ
  choice: 亚哈斯的儿子
  rationale: 原文仍是“他的儿子”；中文为避免代词指向含混，明确重复前一人的名字，同时保留父子承接结构。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经中通行且易于辨认的人名译法。
- source_word: בְנוֹ
  choice: 希西家的儿子
  rationale: 原文重复同一家谱公式；中文明确其所指，以自然方式保持连续的父子关系。
