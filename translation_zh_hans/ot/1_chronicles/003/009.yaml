base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/009.yaml
  text: All these were David’s sons[a], besides the sons of the concubines; and Tamar was their sister.
translation:
  language: zh_hans
  text: 以上都是大卫的儿子，妃嫔所生的儿子除外[a]；他玛是他们的姐妹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“此外还有妃嫔所生的儿子。”希伯来语在此既可理解为这些儿子不包括在前述名单内，也可理解为在主要名单之外另有这些儿子。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: 以上都是
  rationale: כֹּל 表示整体、总括；结合上文家谱名单，译为“以上都是”自然地指向前面列出的众人。
- source_word: בְּנֵי דָוִיד
  choice: 大卫的儿子
  rationale: בְּנֵי 是阳性复数，明确指儿子，不宜泛译为“儿女”。
- source_word: מִלְּבַד
  choice: 除外
  rationale: 该词可表示排除在所述范围之外，也可能表示在主要名单以外另有其人；正文采用符合家谱总结语气的“除外”，并以脚注保留另一种理解。
- source_word: בְּנֵי פִילַגְשִׁים
  choice: 妃嫔所生的儿子
  rationale: 直译为“妃嫔的儿子”；“所生的”在现代汉语中更清楚地表达亲子关系，且上下文已表明这些妃嫔属于大卫的王室家庭。
- source_word: פִילַגְשִׁים
  choice: 妃嫔
  rationale: 在王室家庭语境中，“妃嫔”能自然、准确地表达 פילגשׁ 的次等配偶或妾室身份。
- source_word: וְתָמָר
  choice: 他玛
  rationale: 按通行中文圣经人名译法音译；连接词的并列关系由分号后的新分句自然体现。
- source_word: אֲחוֹתָם
  choice: 是他们的姐妹
  rationale: 希伯来语原文是无系词名词句，汉语补出“是”较自然；“姐妹”不擅自判定他玛相对于众人的长幼次序。
theological_decisions:
- issue: 妃嫔所生之子与前述名单的关系
  choice: 正文译作“除外”，表示他们不包括在前述名单内
  alternative: “此外还有妃嫔所生的儿子”，表示在前述众子之外另作补充
  rationale: מִלְּבַד 可承载排除或附加的语义。正文按家谱总结句的常见结构采用排除式表达，但脚注明确保留附加式理解，避免消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述语体。“姐妹”避免把 אֲחוֹתָם 具体化为“姐姐”或“妹妹”；分号清楚区分总括众子与补述他玛两个分句。
