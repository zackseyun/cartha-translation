  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
translation:
  language: zh_hans
  text: 还有哈舒巴、阿黑、比利家、哈撒底雅和于沙希悉[a]，共五人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文把这个名字分写为两个词：“于沙 希悉”；这里按一个复合人名译出。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在此只说“五”，简略地总括刚才列出的五个人名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲשֻׁבָה
  choice: 还有哈舒巴
  rationale: 这是带有连词 ו 的人名。用“还有”承接上文的家谱名单；人名按希伯来语音译。
- source_word: וָ/אֹהֶל
  choice: 阿黑
  rationale: 此处是人名，不按普通名词“帐棚”翻译；采用现代中文圣经读者较熟悉的译名。
- source_word: וּ/בֶרֶכְיָה
  choice: 比利家
  rationale: 这是带有连词的人名；采用中文圣经中通行且易辨认的音译。
- source_word: וַֽ/חֲסַדְיָה
  choice: 哈撒底雅
  rationale: 按希伯来语人名音译，并以“雅”体现结尾的 יה 成分，避免把该成分无声省略。
- source_word: י֥וּשַׁב חֶ֖סֶד
  choice: 于沙·希悉
  rationale: 希伯来文本分写为两个成分，但在这里最适合作一个复合人名理解；中文用间隔号表明两部分共同构成一个名字。
- source_word: חָמֵשׁ
  choice: 共五人
  rationale: 原文只用数词“五”总结刚列出的五个名字。中文补出“共”和量词“人”，使表达自然，同时保留家谱的简洁。
