  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
translation:
  language: zh_hans
  text: 示迦尼的儿子是示玛雅。示玛雅的儿子是哈突、以甲、巴利亚、尼利雅和沙法，共六人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本说“六人”，但现存马所拉文本在这里仅列出五个名字。这可能反映文本传抄问题，或有一个名字在流传过程中遗漏。
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי שְׁכַנְיָה
  choice: 示迦尼的儿子
  rationale: בְנֵי 是“儿子”的复数附属形式。此处是紧接姓名的家谱句式，译作“儿子”最直接；人名 שְׁכַנְיָה 按现代中文圣经常见形式音译为“示迦尼”。
- source_word: שְׁמַעְיָה
  choice: 示玛雅
  rationale: 人名按现代中文圣经常见形式音译，并在本节两处保持一致。
- source_word: חַטּוּשׁ
  choice: 哈突
  rationale: 按希伯来语人名音译，并采用现代中文圣经中通行的形式。
- source_word: יִגְאָל
  choice: 伊甲
  rationale: 按希伯来语人名音译；采用中文圣经中较为通行、易辨认的形式。
- source_word: בָרִיחַ
  choice: 巴利亚
  rationale: 依马所拉文本 בָרִיחַ 音译，不以较熟悉但反映不同拼写的“比利亚”替代。
- source_word: נְעַרְיָה
  choice: 尼利雅
  rationale: 按希伯来语人名音译，并采用中文圣经中通行的形式。
- source_word: שָׁפָט
  choice: 沙法
  rationale: 按希伯来语人名音译，并采用中文圣经中通行的形式。
- source_word: שִׁשָּׁה
  choice: 共六人
  rationale: 原文明确是基数词“六”。虽然现存马所拉文本只列出五个名字，正文仍如实保留“六”，不作静默协调。
