  yaml_path: translation/ot/1_chronicles/003/011.yaml
  text: Joram his son[a], Ahaziah his son[c][b], Joash his son.
translation:
  language: zh_hans
  text: 他的儿子[c]约兰[a]，约兰的儿子亚哈谢，亚哈谢的儿子约阿施[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约兰”是希伯来名字“耶何兰”的简称。
    reason: alternative_reading
  - marker: b
    text: “约阿施”在希伯来文中也有较完整的名字形式“耶何阿施”。
    reason: alternative_reading
  - marker: c
    text: 希伯来语“儿子”在家谱中有时也可指后代；这里按简明的王位承继名单译作“儿子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרָם
  choice: 约兰
  rationale: 采用现代中文圣经中通行的人名译法；此名是较完整形式“耶何兰”（יְהוֹרָם）的简称，但中文传统通常仍译作“约兰”。
- source_word: בְּנוֹ
  choice: 他的儿子／某人的儿子
  rationale: בֵּן加第三人称阳性单数后缀，直接含义是“他的儿子”。为使中文谱系关系清楚，首处译作“他的儿子”，后两处明确重复前一位王的名字。
- source_word: אֲחַזְיָהוּ
  choice: 亚哈谢
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: יוֹאָשׁ
  choice: 约阿施
  rationale: 采用现代中文圣经中通行的人名译法；此名也有较完整的希伯来语形式יְהוֹאָשׁ。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。原文是省略性很强的王室承继名单；中文通过重复前一位王的名字来明确关系，不补入原文没有的解释。首句的“他”承接上一节的人物。
