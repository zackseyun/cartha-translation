lexical_decisions:
- source_word: יִבְחָר
  choice: 伊卜哈尔
  rationale: 人名按希伯来语读音音译；用“伊卜哈尔”体现词中的辅音 בְח，并保留与常见汉译“伊施巴”相区别的形式。
- source_word: אֱלִישָׁמָע
  choice: 以利沙玛
  rationale: 按希伯来语音译，并采用现代中文圣经人名中自然、易辨识的形式；词末 ע 不另加生硬音节。
- source_word: אֱלִיפָלֶט
  choice: 以利法列
  rationale: 按希伯来语音译；“以利法列”兼顾原文辅音结构和中文人名惯例。
- source_word: וְ / וֶ
  choice: 还有；和
  rationale: 三个名字均带连接词。经文是承接上文的名单，首个连接词译为“还有”，末项前以“和”连接，中间不机械重复，以符合现代汉语列举习惯。
