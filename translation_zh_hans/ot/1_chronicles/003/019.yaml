base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
translation:
  language: zh_hans
  text: 毗大雅的儿子是所罗巴伯和示每。所罗巴伯的儿子[a]是米书兰和哈拿尼雅；示罗密是他们的姐妹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作单数“所罗巴伯的儿子”，但下文列出米书兰和哈拿尼雅两人。有些人认为这是文本上的不规则现象，或认为这里的家谱用语具有集合意义。
    reason: textual_irregularity
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  choice: 毗大雅的儿子是
  rationale: בְנֵי在家谱中通常指亲生儿子；省略句首连接词的明译，使中文家谱句式自然清楚。
- source_word: זְרֻבָּבֶל וְשִׁמְעִי
  choice: 所罗巴伯和示每
  rationale: 按现代中文圣经人名的通行译法音译，并保留两个人名之间的并列关系。
- source_word: וּבֶן זְרֻבָּבֶל
  choice: 所罗巴伯的儿子[a]
  rationale: 马所拉文本明确使用单数בֶן，正文依原文保留单数，以免无提示地修正文本；下文列出两名男子所形成的不协调在脚注中说明。中文“儿子”本身不标示单复数，因此脚注明确交代希伯来文为单数。
- source_word: מְשֻׁלָּם וַחֲנַנְיָה
  choice: 米书兰和哈拿尼雅
  rationale: 按现代中文圣经人名的通行译法音译，并保留并列结构。
- source_word: וּשְׁלֹמִית אֲחוֹתָם
  choice: 示罗密是他们的姐妹
  rationale: 代词后缀为复数“他们的”，最自然地回指米书兰和哈拿尼雅；希伯来文无系词，中文补出“是”以构成自然句子。
theological_decisions: []
