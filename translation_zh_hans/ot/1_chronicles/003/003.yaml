base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/003.yaml
  text: the fifth[a], Shephatiah, by Abital; the sixth, Ithream[b], by Eglah his wife.
translation:
  language: zh_hans
  text: 第五个是示法提雅，亚比她所生[a]；第六个是以特念，他的妻子以格拉所生[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“给亚比她”；这里是家谱用语，意思是“亚比她所生”。同样的用法也见于以格拉。
    reason: lexical_alternative
  - marker: b
    text: 有些解释者认为以格拉就是米甲，但本节经文本身没有这样说。
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: 第五个
  rationale: 带定冠词的序数词，承接上文对大卫众子的编号；“第五个”符合现代汉语列举方式。
- source_word: שְׁפַטְיָה
  choice: 示法提
  rationale: 按中文圣经人名的通行译法音译。
- source_word: לַאֲבִיטָל
  choice: 是亚比她所生的
  rationale: 介词 לְ 在此家谱格式中标示母系关系；用“所生的”自然表达该子由亚比她所生，同时避免汉语中“归给”的歧义。
- source_word: הַשִּׁשִּׁי
  choice: 第六个
  rationale: 与“第五个”平行，保留原文名单的编号结构。
- source_word: יִתְרְעָם
  choice: 以特念
  rationale: 采用中文圣经人名的通行译法。
- source_word: לְעֶגְלָה
  choice: 是他妻子以格拉所生的
  rationale: 介词 לְ 同样标示母系关系；将“他妻子”置于“以格拉”之前，使其在现代汉语中明确修饰以格拉。
- source_word: אִשְׁתּוֹ
  choice: 他妻子
  rationale: אִשָּׁה 带第三人称阳性单数后缀，在婚姻语境中自然指“他的妻子”；此处“他”指大卫。
theological_decisions:
- issue: “他妻子”所指及以格拉的身份
  choice: 按原文直译为“他妻子以格拉”，即大卫的妻子以格拉，不赋予她特殊地位，也不认定她就是米甲。
  alternative: 有些解释者认为以格拉就是米甲，或认为“他妻子”暗示以格拉在众妻中具有特殊身份。
  rationale: 希伯来文仅称“以格拉，他的妻子”，没有说明为何特别加上这一称谓，也没有将她等同于米甲；译文保留原文信息，不补入后来的身份推断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“第五个是……；第六个是……”保留名单结构，并用“所生的”清楚表达希伯来语介词在家谱中的母系关系。两个脚注标记均置于正文相应内容之后。
