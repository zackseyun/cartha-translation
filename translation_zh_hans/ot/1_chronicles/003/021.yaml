base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/021.yaml
  text: 'And the sons of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah[a], the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'
translation:
  language: zh_hans
  text: 哈拿尼雅的儿子：毗拉提雅和耶筛亚；利法雅的众子[a]、亚珥难的众子、俄巴底雅的众子、示迦尼雅的众子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来文结构紧凑，理解上有些困难。直译是：“哈拿尼雅的儿子：毗拉提雅和耶筛亚；利法雅的众子、亚珥难的众子、俄巴底雅的众子、示迦尼雅的众子。”有些解释认为，这一连串称谓中的一部分泛指后裔，并不一定都是直接的儿子。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן
  choice: 哈拿尼雅的儿子
  rationale: 原文用单数“儿子”，但后接两个人名。中文“儿子是……和……”可以自然地列出两子，同时不必把原文直接改写为“众子”；脚注说明其数的不协调。
- source_word: חֲנַנְיָה
  choice: 哈拿尼雅
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: פְּלַטְיָה
  choice: 毗拉提雅
  rationale: 音译专名，并保留词尾־יָה所对应的“雅”，以区别于其他近似人名。
- source_word: וִישַׁעְיָה
  choice: 和耶筛亚
  rationale: 保留连接词，并按此处专名的希伯来语形式音译，避免径直等同于更熟悉的“以赛亚”。
- source_word: בְּנֵי
  choice: 众子
  rationale: 族谱语境中首先按“众子”翻译；该词也可能泛指后代，相关歧义在脚注中保留。
- source_word: רְפָיָה
  choice: 利法雅
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: אַרְנָן
  choice: 亚珥难
  rationale: 音译专名，并适当反映中间的喉音及末尾辅音。
- source_word: עֹבַדְיָה
  choice: 俄巴底雅
  rationale: 采用现代中文圣经中常见的音译形式。
- source_word: שְׁכַנְיָה
  choice: 示迦尼雅
  rationale: 按希伯来语专名音译，并保留词尾־יָה所对应的“雅”。
theological_decisions:
- issue: 重复的“众子”究竟表示各人的直系儿子，还是较宽泛的后裔谱系
  choice: 正文保留“众子”的重复结构，不判定确切代距
  alternative: 将整段明确译成连续的“后代”或父子世系
  rationale: 希伯来文结构高度压缩，无法仅凭本节确定各组之间的确切关系；保留形式并用脚注说明，可避免替原文消除真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号区分前两个人名与后续重复的族谱称谓，并用“还有”使中文衔接清楚；不扩写原文未说明的世代关系。
