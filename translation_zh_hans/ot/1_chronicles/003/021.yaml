revisions:
- from: 哈拿尼雅的儿子是毗拉提雅和耶筛亚；还有利法雅的众子[a]、亚珥难的众子、俄巴底雅的众子、示迦尼雅的众子。
  to: 哈拿尼雅的儿子：毗拉提雅和耶筛亚；利法雅的众子[a]、亚珥难的众子、俄巴底雅的众子、示迦尼雅的众子。
  rationale: 删除无原文依据且可能消除句法歧义的“还有”，以分号和原有的重复属格短语忠实呈现希伯来文的压缩结构。同步校正脚注中“直系儿子”的表述，使其准确说明“直接的儿子”与较宽泛“后裔”之间的区别；其余人名和“众子”的处理可保留。
