  naturalness: 人名音译和分号组织自然、庄重。“哈拿尼雅的儿子：毗拉提雅和耶筛亚”比“儿子是……和……”更适合在中文中呈现原文单复数不协调，且不强行处理为复数。“众子”在族谱体中可接受。
