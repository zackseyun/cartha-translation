  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: zh_hans
  text: 大卫的这六个儿子都在希伯仑出生。他在那里作王七年零六个月；又在耶路撒冷作王三十三年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה נוֹלַד לוֹ
  choice: 这六个儿子都是大卫……所生的
  rationale: שִׁשָּׁה概括上文列出的六个儿子；汉语补出“儿子”和“大卫”，使指代清楚。“所生的”保留נוֹלַד的被动表达，不改译为较主动的“生了”。
- source_word: בְחֶבְרוֹן
  choice: 在希伯仑
  rationale: 按地点介词בְ及标准地名译法直译。
- source_word: וַיִּמְלָךְ שָׁם
  choice: 他在那里作王
  rationale: מלך在此表示执掌王权；“作王”自然、庄重，也不局限于即位这一时刻。
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: 七年零六个月
  rationale: 以现代汉语自然表达该段统治时长。
- source_word: וּשְׁלֹשִׁים וְשָׁלוֹשׁ שָׁנָה
  choice: 三十三年
  rationale: 希伯来语复合数词按现代汉语习惯表达。
- source_word: מָלַךְ בִּירוּשָׁלִָם
  choice: 在耶路撒冷作王
  rationale: 保留地点转换及同一动词的重复，与前半句形成清楚对照。
