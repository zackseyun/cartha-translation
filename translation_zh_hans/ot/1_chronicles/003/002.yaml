  yaml_path: translation/ot/1_chronicles/003/002.yaml
  text: the third[a], Absalom son of Maacah, daughter of Talmai king of Geshur; the fourth, Adonijah son of Haggith.
translation:
  language: zh_hans
  text: 第三个是押沙龙，是玛迦的儿子；玛迦是基述王达买的女儿[a]。第四个是亚多尼雅，是哈及的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可译作“孙女”。在家谱语境中，“女儿”有时也可指较远的女性后裔；但这里的希伯来文最直接的意思是“基述王达买的女儿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: 第三个
  rationale: 带定冠词的序数词，承接上一节对大卫众子的列举；汉语用“第三个”自然表达排行。
- source_word: לְאַבְשָׁלוֹם
  choice: 是押沙龙
  rationale: 介词 לְ 在列举结构中标示该排行对应的人；译文补出“是”，使现代汉语完整自然。
- source_word: בֶּן מַעֲכָה
  choice: 玛迦的儿子
  rationale: בֶּן 表示亲子关系；采用现代汉语家谱叙述中自然的领属结构。
- source_word: בַּת תַּלְמַי
  choice: 达买的女儿
  rationale: בַּת 最直接的词义是“女儿”；虽在家谱语境中偶可泛指较远的女性后裔，但本节没有充分理由偏离直接含义。
- source_word: מֶלֶךְ גְּשׁוּר
  choice: 基述王
  rationale: 该构词链说明达买是基述的王；“基述王达买”符合简洁自然的汉语称谓顺序。
- source_word: הָרְבִיעִי
  choice: 第四个
  rationale: 带定冠词的序数词，继续排行列表。
- source_word: אֲדֹנִיָּה בֶן חַגִּית
  choice: 哈及的儿子亚多尼雅
  rationale: 保留母子关系，并按自然汉语将亲属说明置于人名前。
