base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/024.yaml
  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
translation:
  language: zh_hans
  text: 以利约乃的儿子是：何大雅[a]、以利亚实、毗莱雅、亚谷、约哈难、第莱雅和亚拿尼，共七人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里第一个人名的希伯来文拼写不寻常。“何大雅”采用最可能的传统认定；也可能读作“何底雅”，或更贴近字面音译为“何德瓦胡”。
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: 的儿子是
  rationale: בְּנֵי是“儿子”的复数附属形式；在家谱中译作“儿子”最准确。前缀连词承接上文，但现代汉语按经节独立表达时不必生硬译出“并且”。补入“是”使名单引出自然。
- source_word: אֶלְיוֹעֵינַי
  choice: 以利约乃
  rationale: 人名按希伯来语读音音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: הדיוהו
  choice: 何大雅[a]
  rationale: 原文拼写异常；正文采用较可能的传统人名对应“何大雅”，并用脚注保留拼写和读法上的不确定性。
- source_word: וְאֶלְיָשִׁיב
  choice: 以利亚实
  rationale: 按希伯来语人名音译，兼顾中文既有译名传统。
- source_word: וּפְלָיָה
  choice: 毗莱雅
  rationale: 按希伯来语人名音译；末尾保留-yāh所对应的“雅”。
- source_word: וְעַקּוּב
  choice: 亚谷
  rationale: 按希伯来语人名音译；双写辅音在普通中文音译中不另作标记。
- source_word: וְיוֹחָנָן
  choice: 约哈难
  rationale: 采用能反映יוֹחָנָן读音、并与较长的神名复合形式相区分的中文音译。
- source_word: וּדְלָיָה
  choice: 第莱雅
  rationale: 按希伯来语人名音译，末尾保留-yāh的传统中文对应。
- source_word: וַעֲנָנִי
  choice: 和亚拿尼
  rationale: 人名音译为“亚拿尼”；前缀连词在名单末项自然译作“和”。
- source_word: שִׁבְעָה
  choice: 共七人
  rationale: 保留希伯来文对名单人数的明确总计；加“共”和量词“人”符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留家谱名单的结构和末尾人数总计。人名优先兼顾希伯来语读音与中文圣经中较熟悉的音译形式；不以解释性措辞消除原文首个人名的文本不确定性。
