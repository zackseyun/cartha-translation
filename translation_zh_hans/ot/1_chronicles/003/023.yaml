  yaml_path: translation/ot/1_chronicles/003/023.yaml
  text: 'The sons of Neariah: Elioenai[a], Hezekiah, and Azrikam—three.'
translation:
  language: zh_hans
  text: 尼利雅的儿子是以利约乃[a]、希西家和亚斯利干，共三人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“尼利雅的儿子”，使用单数；但这里列出三个人名，并以“三人”作总结，因此正文按家谱语境译为“尼利雅的儿子是……”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: 儿子是
  rationale: 希伯来语形式为单数“儿子”，但后面列出三个人名，并以“三人”作总结；在此家谱语境中，该词用作引出尼利雅众子的标题。中文正文按实际功能自然地表达为“儿子是”，同时用脚注保留原文的单数形式。
- source_word: נְעַרְיָה
  choice: 尼利雅
  rationale: 人名按现代中文圣经中常见的音译形式处理。
- source_word: אֶלְיוֹעֵינַי
  choice: 以利约乃
  rationale: 希伯来人名的音译，采用现代中文圣经读者较熟悉的形式。
- source_word: וְחִזְקִיָּה
  choice: 希西家
  rationale: 采用该希伯来人名通行且易于辨认的中文译名。
- source_word: וְעַזְרִיקָם
  choice: 和亚斯利干
  rationale: 人名采用通行中文音译，并将前置连词自然译为“和”。
- source_word: שְׁלֹשָׁה
  choice: 共三人
  rationale: 明确保留原文总结人数的数词；加“共”和量词“人”，符合现代汉语家谱列名后的表达习惯。
