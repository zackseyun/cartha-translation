  yaml_path: translation/ot/1_chronicles/021/019.yaml
  text: So David went up at the word of Gad[b][a], which he had spoken in the name of Yahweh.
translation:
  language: zh_hans
  text: 于是，大卫照着迦得奉雅威之名所说的话上去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去了
  rationale: עלה表示“上去、登上”；此处指大卫前往较高处的禾场，译作“上去了”保留方向含义，也符合现代汉语。
- source_word: בִּדְבַר גָּד
  choice: 照着迦得……所说的话
  rationale: 介词ב与דבר连用，在这里表示行动所依据或遵从的吩咐；“照着……所说的话”自然地表达大卫依言而行。
- source_word: אֲשֶׁר דִּבֶּר
  choice: 所说的
  rationale: 关系从句修饰迦得的话；上下文已经清楚表明这话先于大卫的行动，汉语无需另加过去完成时标记。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉雅威之名
  rationale: “奉……之名”既保留希伯来语表达，也自然传达迦得以雅威权柄发言的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的常见现代汉语音译，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神圣四字名；译作“雅威”保留专名，并较贴近通常重构的读音，不把它改成称号。
- issue: “奉雅威之名”所表达的关系
  choice: 保留原文惯用语，不扩译
  alternative: 凭雅威的权柄
  rationale: “奉……之名”可包含受差遣和凭权柄发言之意；正文保留原有表达，避免把多层含义缩减为单一解释。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“于是”承接叙事，“照着……所说的话”明确表达遵从关系；语序经过汉语化处理，同时保留原文的信息结构和神学张力。
