  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל גָּ֔ד חֹזֵ֥ה דָוִ֖יד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/009.yaml
  text: And Yahweh spoke to Gad[a], David’s seer, saying,
translation:
  language: zh_hans
  text: 雅威[a]对大卫的先见迦得说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH（四字神名）；传统译作“耶和华”。其古代确切读音不能完全确定。
    reason: 说明神名的原文形式、传统译法及读音上的不确定性。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词在叙事中引出雅威向迦得所说的话；现代汉语用“对……说”自然、准确，也与后面的 לֵאמֹר 公式共同构成引语结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名 YHWH 的常见现代汉语音译处理，保留其作为专名的性质，而不以“主”这一称号替代。
- source_word: אֶל
  choice: 对
  rationale: 这里标明说话的对象；“对……说”是现代汉语最自然的表达。
- source_word: גָּד
  choice: 迦得
  rationale: 采用该人名在中文圣经传统中的通行译名。
- source_word: חֹזֵה
  choice: 先见
  rationale: 该词指领受启示性异象的人；“先见”既是准确而通行的译法，也保留了它与一般“先知”用词之间的区别。
- source_word: דָוִיד
  choice: 大卫的
  rationale: 以汉语所属结构自然表达原文的构词关系。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出直接话语的希伯来语叙事公式；汉语以“说：”并用冒号自然呈现，无须机械重复“说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名 YHWH。“雅威”较贴近学界通常重构的读音，并保留专名性质；脚注同时说明中文传统译名“耶和华”，避免将有争议的古代读音说成完全确定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“先见”保留原文 חֹזֵה 的专门含义；以冒号承接下一节的直接引语。脚注标记紧随其所解释的神名。
