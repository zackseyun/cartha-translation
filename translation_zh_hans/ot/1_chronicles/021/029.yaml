  text: וּ/מִשְׁכַּ֣ן יְ֠הוָה אֲשֶׁר עָשָׂ֨ה מֹשֶׁ֧ה בַ/מִּדְבָּ֛ר וּ/מִזְבַּ֥ח הָ/עוֹלָ֖ה בָּ/עֵ֣ת הַ/הִ֑יא בַּ/בָּמָ֖ה בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/029.yaml
  text: The tabernacle of Yahweh, which Moses had made in the wilderness, and the altar of burnt offering were at that time on the high place at Gibeon.
translation:
  language: zh_hans
  text: 雅威[a]的帐幕，就是摩西在旷野所造的帐幕，和燔祭坛，当时都在基遍的丘坛上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝之名יהוה（YHWH）的拟音。
    reason: 帮助普通读者识别较不熟悉的神名译法，并说明它是专名而非称号。
lexical_decisions:
- source_word: מִשְׁכַּן
  choice: 帐幕
  rationale: 此处指摩西在旷野建造的敬拜圣所；“帐幕”是现代中文圣经语境中准确、通行而又易懂的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行拟音译出上帝的专名，而不以称号替代。
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה
  choice: 就是摩西……所造的帐幕
  rationale: 将关系从句自然地转为中文同位说明，并补出“帐幕”，避免“所造的”所指含混。
- source_word: בַמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”符合出埃及传统的语境，也比“沙漠”更能涵盖该词所指的荒僻地域。
- source_word: מִזְבַּח הָעוֹלָה
  choice: 燔祭坛
  rationale: 这是指献全牲焚烧之祭的祭坛；“燔祭坛”是简洁、准确且已有广泛认知的礼仪术语。
- source_word: בָּעֵת הַהִיא
  choice: 当时
  rationale: 简明表达叙事所交代的时间背景，不把它强化为某个瞬间。
- source_word: בַּבָּמָה
  choice: 在……丘坛上
  rationale: בָּמָה在此指设于高处的敬拜场所；“丘坛”保留其礼仪场所含义，“上”也反映介词的空间意象。
- source_word: בְּגִבְעוֹן
  choice: 基遍的
  rationale: 以地名修饰“丘坛”，自然表达该敬拜场所位于基遍。
- source_word: וּ
  choice: 和
  rationale: 首个וּ主要承接上下文，在现代中文中无需机械译作“并且”或“如今”；连接两个主语的第二个וּ明确译作“和”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”以保留其专名性质；不以“主”这一称号替代，也不采用较晚形成的混合读音“耶和华”。
- issue: בָּמָה在本节中的性质
  choice: 丘坛
  alternative: 高处
  rationale: 上下文明确涉及帐幕和燔祭坛，因此该词不仅是地势上的高处，也是敬拜场所；“丘坛”保留这层礼仪含义，但不额外判断其敬拜是否合法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句子保留原文以“帐幕”和“燔祭坛”为并列主语的结构，并用“就是……”清楚呈现关系从句；不增添原文没有的时间副词。
