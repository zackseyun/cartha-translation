base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/030.yaml
  text: But David could not go before it to seek God[a], because he was terrified by the sword of the angel of Yahweh.
translation:
  language: zh_hans
  text: 可是，大卫不能到那里去寻求上帝[a]，因为他因耶和华的天使所持的剑而惊恐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那里”指基遍的帐幕；或译：“到他面前去寻求上帝”，若这里的代词指上帝。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֹא
  choice: 可是……不能
  rationale: 承接上文并带有轻微转折；现代汉语用“可是”自然表现叙事关系。
- source_word: יָכֹל דָּוִיד לָלֶכֶת
  choice: 大卫不能……去
  rationale: יכל 表示能力；与否定词连用，译作“不能”简洁自然。
- source_word: לְ/פָנָי/ו
  choice: 到它面前
  rationale: 阳性单数后缀最可能回指上文基遍的帐幕；“它”保留代词形式，也不把解释直接扩写进正文。
- source_word: לִ/דְרֹשׁ אֱלֹהִים
  choice: 寻求上帝
  rationale: דרשׁ 与“上帝”连用，可涵盖敬拜、祷告及求问；“寻求”保留这一较宽广的含义。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出大卫不能前往的原因。
- source_word: נִבְעַת
  choice: 惊恐
  rationale: 该词的尼法勒形表达强烈惧怕；“惊恐”庄重而符合现代汉语。
- source_word: מִ/פְּנֵי חֶרֶב
  choice: 因……的剑
  rationale: 介词在惧怕语境中表示造成恐惧的原因；保留“剑”这一叙事中的具体形象。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华使者
  rationale: מלאך 可指使者或天使；本段显然是天上的使者，但“使者”仍保留词义本身，并与叙事语体协调。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式呈现神圣之名。
theological_decisions:
- issue: “到它面前”中代词的所指
  choice: 理解为上文所说在基遍的帐幕
  alternative: 理解为上帝，即“到他面前”；也可泛指敬拜之处
  rationale: 第29节刚提到耶和华的帐幕和祭坛，第30节是在解释大卫为何不能到那里去；不过，希伯来文阳性单数后缀也容许回指上帝，因此用脚注保留此歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“到它面前”在汉语中略显直译，但为保留原文代词及其真实歧义而采用，并以脚注说明另一种可能。
