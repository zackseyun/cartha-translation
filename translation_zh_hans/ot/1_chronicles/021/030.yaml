revisions:
- from: 可是，大卫不能到它面前去寻求上帝[a]，因为他因耶和华使者的剑而惊恐。
  to: 可是，大卫不能到那里去寻求上帝[a]，因为他因耶和华的天使所持的剑而惊恐。
  rationale: 修订以“到那里去”自然表达最可能的上下文所指，即基遍的帐幕／敬拜之处；脚注明确保留 לְפָנָיו 可指上帝的替代读法。将“耶和华使者”改为“耶和华的天使”，并将恐惧原因改为更流畅的现代汉语表达，未改变经文意义。
