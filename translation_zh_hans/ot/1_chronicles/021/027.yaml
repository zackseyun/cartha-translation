base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/027.yaml
  text: And Yahweh spoke to the angel[b][a], and he returned his sword to its sheath.
translation:
  language: zh_hans
  text: 耶和华对天使说[a]，天使就把自己的剑收回剑鞘中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华对天使说话。”
    reason: 词义替代；אמר的基本义为“说”，原文没有记下所说的内容。
  - marker: b
    text: 或译：“天使使自己的剑归回剑鞘。”
    reason: 词汇替代；שׁוב的使役式可较形式地表达为“使……归回”。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行的专名“耶和华”译出四字神名，不以“主”这一称号替代。
- source_word: וַיֹּאמֶר
  choice: 说话
  rationale: אמר的基本义是“说”。“对天使说话”自然表达原文未载明具体话语内容的情形，也不擅自强化为“命令”。
- source_word: לַמַּלְאָךְ
  choice: 对天使
  rationale: מַלְאָךְ可指“使者”或“天使”；本段所述持剑的天上存在使“天使”成为明确的语境义。
- source_word: וַיָּשֶׁב
  choice: 收回
  rationale: שׁוב的使役式在这里表示使剑回到原处。中文“把剑收回鞘中”自然、准确地传达这一动作。
- source_word: חַרְבּוֹ
  choice: 剑
  rationale: 原文为“他的剑”；中文由“天使就把剑……”已可清楚表达剑属于天使，避免重复代词造成生硬。
- source_word: אֶל נְדָנָהּ
  choice: 回鞘中
  rationale: נְדָן指刀剑的鞘；介词אֶל与返回动作结合，中文自然表达为“回鞘中”。
theological_decisions:
- issue: וַיָּשֶׁב（“收回”）的主语
  choice: 在正文中明说“天使”，视天使为收剑者
  alternative: 以耶和华为延续的语法主语，即耶和华使剑归回鞘中
  rationale: 紧接着的“对天使”以及“他的剑”在叙事语境中强烈指向天使响应耶和华的话而收剑。中文若仅写“他”容易产生非原文所需的指代含混，因此采用“天使”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“说话”避免补入原文未明说的命令内容；后半句用“把”字结构，使中文动作关系清晰自然。
