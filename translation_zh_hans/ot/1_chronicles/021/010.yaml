base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/010.yaml
  text: 'Go and speak to David[a], saying, ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: zh_hans
  text: 你去对大卫说：‘雅威如此说：我把三样摆在你面前[a]。你要为自己选择其中一样，我就把你所选的施行在你身上。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“三样，我正向你伸出／摆在你身上”。原文没有说明这“三样”是什么；此处的表达在上下文中指摆给大卫选择、并将施行于他的三件事。
    reason: 说明原文未明说“三样”的所指，并交代“摆在你面前”是按上下文作出的自然表达；不将其预先具体化为刑罚或灾祸。
lexical_decisions:
- source_word: לֵךְ וְדִבַּרְתָּ אֶל־דָּוִיד
  choice: 你去对大卫说
  rationale: לֵךְ是直接命令“去”；דבר אל指“对……说话”。合译为现代汉语自然的“你去对大卫说”，保留命令和传话关系。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的惯用形式；汉语用冒号和“说”自然表达，不必机械重复。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知性使者公式的庄重语序，并将四字神名直接音译为“雅威”。
- source_word: שָׁלוֹשׁ אֲנִי נֹטֶה עָלֶיךָ
  choice: 我有三样要加在你身上
  rationale: 原文只说阴性数词“三”，没有明说所指为何，因此以中性的“三样”补足汉语表达；נֹטֶה עָלֶיךָ直译有“伸展到／加在你身上”之意，此处用“加在你身上”保留其带有临到、施加意味的张力，而不预先定为“灾祸”或“刑罚”。
- source_word: בְּחַר־לְךָ אַחַת מֵהֵנָּה
  choice: 你要为自己选择其中一样
  rationale: בחר为命令式“选择”；לְךָ保留为“为自己”，אַחַת מֵהֵנָּה译作“其中一样”。
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: 我就把那一样施行在你身上
  rationale: עשה ל在本段惩罚语境中不是“为你做”善事，而是把所选之事施于大卫；“施行在你身上”既符合语境，也避免具体化为原文未明说的某种灾祸。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名；音译“雅威”保留其作为专名的性质，不以称号替代。
- issue: “三样”具体指什么
  choice: 不补作“刑罚”“灾祸”或“选择”
  alternative: 三种刑罚；三场灾祸；三个选择
  rationale: 本节的希伯来文没有明说名词，具体内容到下一节才列出；采用中性的“三样”可保留原文的省略和悬念。
- issue: נֹטֶה עָלֶיךָ的方向与语气
  choice: 加在你身上
  alternative: 摆在你面前；向你提出
  rationale: “摆在你面前”能突出供选择的选项，但会削弱עַל所含的临到、施加意味；“加在你身上”保留惩罚语境中的压力，同时由后句说明这些事可供选择。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“雅威如此说”保留使者公式；“施行在你身上”略具经文语体色彩，但在现代汉语中仍清楚自然，并与本节严肃的审判语境相称。
