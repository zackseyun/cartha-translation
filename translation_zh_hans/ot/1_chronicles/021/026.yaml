base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/026.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings. He called on Yahweh[a], and he answered him with fire from heaven on the altar of burnt offering.
translation:
  language: zh_hans
  text: 大卫就在那里为雅威筑了一座坛，献上燔祭和平安祭。他呼求雅威，雅威就以从天而降的火，在燔祭坛上回应了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִיד מִזְבֵּחַ
  choice: 大卫就在那里筑了一座坛
  rationale: 按希伯来语叙事次序表达具体的建造行动；“就”自然承接上文，“在那里”指向前述地点。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词 ל 在此表示祭坛的归属或奉献对象；“为”符合现代汉语。“雅威”直接呈现专名 יהוה。
- source_word: וַיַּעַל עֹלוֹת
  choice: 献上燔祭
  rationale: עלה 在祭祀语境中指献祭；“燔祭”是 עֹלָה 这一全烧祭类的标准汉语名称。
- source_word: וּשְׁלָמִים
  choice: 和平安祭
  rationale: שְׁלָמִים 是特定祭类；“平安祭”兼顾传统辨识度与词根所含的完整、安好意味。
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: 他呼求雅威
  rationale: 该短语在祷告语境中表示向神呼求；“呼求”比一般的“呼叫”更准确自然。
- source_word: וַיַּעֲנֵהוּ בָאֵשׁ מִן הַשָּׁמַיִם
  choice: 雅威便从天上降火……回应了他
  rationale: 希伯来文直陈神以从天而来的火回应大卫。汉语将隐含主语明示为“雅威”，并用“降火”自然表达火从天而来的动态；“回应”保留 ענה 的应答意义。
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: 在燔祭坛上
  rationale: עַל 表示火落到坛上；“燔祭坛”是简洁、通行的祭祀用语。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号替代。
- issue: 神以火回应的叙述方式
  choice: 雅威从天上降火在坛上，以此回应大卫
  alternative: 他用从天而来的火回答大卫
  rationale: 原文把“回应”“火从天而来”“火在坛上”紧密相连。译文仅自然重组语序，不添加火的象征意义或其他神学解释。
- issue: וַיַּעֲנֵהוּ 的主语
  choice: 明示为雅威
  alternative: 译作“他便回应了他”
  rationale: 希伯来文主语由上文自然确定为雅威；现代汉语若连续使用两个“他”会造成指代不清，因此明示主语而不改变命题内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“坛、燔祭、平安祭”等必要的祭祀术语，同时避免文言化句式。原文无须以脚注说明的文本异读或关键歧义，因此不设脚注。
