base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
translation:
  language: zh_hans
  text: 阿珥楠转过身，看见了那天使；他的四个儿子和他在一起，正躲藏着，而阿珥楠正在打麦子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 转过身
  rationale: שׁוב的基本义是“转回、返回”。在此叙事场景中，动作随即引出“看见”，译作“转过身”最自然，也不额外加入原文没有的时间标记。
- source_word: וַיַּרְא אֶת הַמַּלְאָךְ
  choice: 看见了那天使
  rationale: מַלְאָךְ既可指一般的“使者”，也可指超自然的“天使”；本段叙述的是施行上帝审判的天使，因此译作“天使”。定冠词译为“那”，指向上下文中已经出现的特定天使。
- source_word: וְאַרְבַּעַת בָּנָיו עִמּוֹ
  choice: 跟他在一起的四个儿子
  rationale: 这样自然地表达四个儿子当时与阿珥楠同在，同时保留“四个儿子”这一直接的所属表达，不扩展为“四个儿子中的四个”。
- source_word: מִתְחַבְּאִים
  choice: 都躲藏起来
  rationale: 该词为Hitpael分词，带有中间态或反身意味，并表示当时持续的状态。“躲藏起来”在现代汉语中自然传达他们使自己隐蔽的意思；“都”使复数主语与谓语的关系清楚。
- source_word: וְאָרְנָן דָּשׁ חִטִּים
  choice: 当时，阿珥楠正在打麦子
  rationale: 该分句交代背景中的持续动作。“正在”体现未完成的进行状态；דּוּשׁ在此指脱粒，现代普通读者通常更自然地说“打麦子”。חִטִּים特指小麦，故不泛化为“粮食”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用分号区分阿珥楠看见天使与儿子们躲藏这两个紧密相连的动作，再以“当时”引出背景动作，避免把希伯来语连续的ו误译成机械重复的“并且”。原英文脚注所说明的反身意味已由“躲藏起来”自然体现，因此无需另设中文脚注。
