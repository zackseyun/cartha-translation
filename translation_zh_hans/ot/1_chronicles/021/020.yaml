revisions:
- from: 阿珥楠转过身，看见了那天使；跟他在一起的四个儿子都躲藏起来。当时，阿珥楠正在打麦子。
  to: 阿珥楠转过身，看见了那天使；他的四个儿子和他在一起，正躲藏着，而阿珥楠正在打麦子。
  rationale: 修订以“正躲藏着”保留希伯来语分词的持续状态，并以“而”表达末句的背景/并列关系，不添加“当时”这一原文未明示的时间标记。其余关键人名、天使和打麦子的译法维持不变。英文审校轨迹中的反身提示已由“躲藏着”的汉语中间性自然涵盖，毋须另设脚注。
