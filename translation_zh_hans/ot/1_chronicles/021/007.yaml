  text: וַ/יֵּ֨רַע֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יַּ֖ךְ אֶת יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/007.yaml
  text: But this matter was evil in the sight of God[a], so he struck Israel.
translation:
  language: zh_hans
  text: 但这事在上帝眼中看为恶[a]，因此他击打以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这事令上帝不悦。”希伯来文直译是“这事在上帝眼中是恶的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: 是恶的
  rationale: 该动词在这里表达负面的道德评价或冒犯性；译作“是恶的”保留了原文较强的判断力度，避免用较柔和的“不喜悦”淡化语气。
- source_word: בְּעֵינֵי הָאֱלֹהִים
  choice: 在上帝眼中
  rationale: 直接保留希伯来语“在……眼中”的评价性习语；现代汉语清楚自然，也忠实呈现上帝的判断视角。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 原文使用אֱלֹהִים，而不是神名יהוה，因此译作“上帝”，不译作“耶和华”。
- source_word: עַל הַדָּבָר הַזֶּה
  choice: 这事
  rationale: דָּבָר语义宽泛，可指事情、事件或行为；上下文指大卫数点百姓之事。“这事”简洁自然，又不作超出原文的限定。
- source_word: וַיַּךְ
  choice: 击打了
  rationale: נכה的基本义是“击打”。该译法保留审判行动的力度，同时不像“击杀”那样预先限定其结果必然致死。
- source_word: אֶת־יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文直接以“以色列”为受词，指整个民族；无需扩写为“以色列人”。
- source_word: וַ … וַ
  choice: 但……因此
  rationale: 首个连接词在叙事中引出与前述行动相对的神圣评价，用“但”体现轻微转折；第二个连接词引出随后的结果，用“因此”自然表达因果关联。
theological_decisions:
- issue: 上帝对大卫数点百姓之事的评价及随后对以色列的审判
  choice: 直陈这事在上帝眼中是恶的，因此上帝击打以色列。
  alternative: 将评价弱化为“令上帝不悦”，或将“击打”弱化为非审判性的回应。
  rationale: 原文既有强烈的负面评价，也有直接的击打行动。译文保留大卫所行受审判、而以色列承受击打这一神学张力，不在本节中替经文解释或消解群体受审判的问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝眼中”“是恶的”“击打”既保留希伯来文表达的力度与意象，又避免古奥措辞。
