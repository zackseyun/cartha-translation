source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא בִּ/רְא֤וֹת דָּוִיד֙ כִּי עָנָ֣/הוּ יְהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֣ן הַ/יְבוּסִ֑י וַ/יִּזְבַּ֖ח שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/028.yaml
  text: At that time[a], when David saw that Yahweh had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there.
translation:
  language: zh_hans
  text: 那时，大卫见雅威在耶布斯人阿珥楠的禾场应允了他[a]，就在那里献祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“回应了他”。这里的希伯来语动词可指回答或回应，在本段中尤指对祷告或献祭作出回应。
    reason: 保留 ענה 的较宽泛词义，避免正文“应允”成为唯一可能的理解。
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 这是常见的时间短语；“那时”自然简洁，保留与上文的叙事衔接，也不把时间关系限定为某一瞬间。
- source_word: בִּרְאוֹת דָּוִיד
  choice: 大卫见
  rationale: 带介词 בְּ 的不定式结构表示时间背景；汉语用“大卫见”即可自然表达“当大卫看见”。
- source_word: כִּי
  choice: （由“见……应允了他”的结构体现）
  rationale: 此处 כִּי 引出大卫所见的内容。汉语无需另译“就是”或“因为”，用兼语式内容结构更自然，也避免误加明确因果。
- source_word: עָנָהוּ
  choice: 应允了他
  rationale: ענה 基本义为“回答、回应”；在本段祷告和献祭的语境中，“应允”能表达雅威以行动回应大卫，同时以脚注保留较宽泛的“回应”译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名按专名音译为“雅威”，不以称号替代。
- source_word: בְּגֹרֶן
  choice: 在……的禾场
  rationale: גֹּרֶן 指打谷、簸谷的场地；“禾场”是简明且符合圣经叙事语域的现代汉语表达。
- source_word: אָרְנָן הַיְבוּסִי
  choice: 耶布斯人阿珥楠
  rationale: 保留人名“阿珥楠”，并把族属形容词自然前置为“耶布斯人”。
- source_word: וַיִּזְבַּח
  choice: 就……献祭
  rationale: זבח 表示宰献祭牲或献祭；“献祭”准确简洁，“就”体现连续叙事中的结果或随即行动，但不把因果说得过强。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接保留地点副词的指示作用，回指阿珥楠的禾场。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”以现代常见形式音译该专名，避免用“主”等称号取代。
- issue: ענה 在献祭语境中的含义
  choice: 应允了他
  alternative: 回应了他
  rationale: 上下文表明大卫从天降火的记号看出神已答复他的献祭与呼求，因此正文用“应允”自然贴切；但原动词本身也可较宽泛地表示“回应”，故用脚注保留这一词义幅度。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。句法顺应汉语叙事习惯，以“见……，就……”呈现原文的时间背景和连续动作；人名、族名及礼仪用语保持圣经文本所需的历史语域，同时避免生硬直译。
