  text: וַ/יִּשָּׂ֨א דָוִ֜יד אֶת עֵינָ֗י/ו וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֗ד בֵּ֤ין הָ/אָ֨רֶץ֙ וּ/בֵ֣ין הַ/שָּׁמַ֔יִם וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ נְטוּיָ֖ה עַל יְרוּשָׁלִָ֑ם וַ/יִּפֹּ֨ל דָּוִ֧יד וְ/הַ/זְּקֵנִ֛ים מְכֻסִּ֥ים בַּ/שַּׂקִּ֖ים עַל פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/016.yaml
  text: David lifted up his eyes and saw the angel of Yahweh standing between the earth and the heavens[a], with his sword drawn in his hand, stretched out over Jerusalem. Then David and the elders, covered in sackcloth, fell on their faces.
translation:
  language: zh_hans
  text: 大卫举目，看见耶和华的使者站在地和天之间[a]；他手中的刀已经出鞘，向耶路撒冷伸出。大卫和众长老都披着麻衣，便俯伏在地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“在这地与诸天之间”；也可译作“在大地与诸天之间”。
    reason: 原文“地”和“诸天”均带定冠词；中文正文按自然表达译为“地和天之间”，脚注保留其形式及可选的较直译说法。
lexical_decisions:
- source_word: וַיִּשָּׂא דָוִיד אֶת־עֵינָיו
  choice: 大卫举目
  rationale: 保留希伯来语“举起眼睛”的具体意象，同时“举目”在现代中文中自然、庄重。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ 可指奉差遣的使者；此处采用圣经中文中清楚自然的“使者”，并将神名 יְהוָה 音译为“耶和华”。
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: 在地与天之间
  rationale: 表达天地之间的空间对照；中文通常以单数集合概念“天”自然对应希伯来语形式 שָּׁמַיִם。
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: 手中拔出的刀
  rationale: 准确表达刀已出鞘并握在手中的结果状态，中文简洁流畅。
- source_word: נְטוּיָה עַל־יְרוּשָׁלִָם
  choice: 伸向耶路撒冷
  rationale: 修饰“刀”，传达刀朝着城市伸展所构成的威胁；避免误解为使者的手臂伸向城市。
- source_word: מְכֻסִּים בַּשַּׂקִּים
  choice: 都披着麻衣
  rationale: 麻衣是哀恸、悔罪与谦卑的服饰；“披着”自然传达被麻布覆盖的状态。
- source_word: וַיִּפֹּל ... עַל־פְּנֵיהֶם
  choice: 便俯伏在地
  rationale: 自然表达面伏于地的动作及其谦卑、敬畏含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；采用现代中文圣经读者最熟悉的专名“耶和华”，不以“主”这一称号替代，也不在正文中加入解释性称谓。
- issue: מַלְאַךְ יְהוָה 是否作特定神学身份解释
  choice: 耶和华的使者
  alternative: 耶和华的天使
  rationale: 按原文关系结构直译，不进一步判定该使者的本体身份，从而保留叙事本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“举目”“披着麻衣”“俯伏在地”保留经文的肃穆感，又不显艰涩；句法按中文信息顺序调整，并明确以“刀”为“伸向耶路撒冷”的主体。
