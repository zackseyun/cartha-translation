  text: And David gave Ornan six hundred shekels of gold by weight for the place[a].
translation:
  language: zh_hans
  text: 大卫为那地方给了阿珥楠重六百舍客勒的金子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 平行记载《撒母耳记下》24:24说的是五十舍客勒银子；《历代志》这里则记为六百舍客勒金子。这可能反映所购范围不同，也可能源于不同的文本传统。
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 给了
  rationale: 保留 נתן“给”的基本含义；上下文和所给金额自然表明这是付款，无须译文另加解释。
- source_word: לְאָרְנָן
  choice: 给了阿珥楠
  rationale: 按《历代志》本文的名字 אָרְנָן 音译为“阿珥楠”，不以《撒母耳记》平行记载中的名称替代。
- source_word: בַּמָּקוֹם
  choice: 为那地方
  rationale: 介词 ב 在交易语境中可表达价款所对应的对象；“为那地方”既贴近原文，也自然表明购买的是该处。
- source_word: שִׁקְלֵי זָהָב
  choice: 舍客勒重的金子
  rationale: 这里的舍客勒是重量单位；此表达清楚呈现所称量之物为金子，并避免让现代读者误以为“舍客勒”必然是铸币。
- source_word: מִשְׁקָל
  choice: 重的
  rationale: 将“按重量”的含义自然融入数量短语，明确六百舍客勒是重量。
- source_word: שֵׁשׁ מֵאוֹת
  choice: 六百
  rationale: 如实保留马所拉文本的数目，不因平行经文的不同数字而调整。
theological_decisions:
- issue: 与《撒母耳记下》24:24平行记载的金额不同
  choice: 正文保留“六百舍客勒重的金子”，不作协调。
  alternative: 按照《撒母耳记下》的“五十舍客勒银子”改译，或在正文中把两者合并解释。
  rationale: 《历代志上》的希伯来文本明确记载六百舍客勒金子。翻译应呈现本节自身的文本，并在注脚中指出而非消除两处记载之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“阿珥楠”依本节希伯来名字音译；“舍客勒重的金子”兼顾古代重量单位的准确性与中文可读性。
