revisions:
- from: 大卫对阿珥楠说：“请把这禾场的地方给我，我好在上面为耶和华筑一座坛。请按足价给我，好使百姓所遭的瘟疫止住。”
  to: 大卫对阿珥楠说：“请把这禾场的场地给我，我好在上面为耶和华筑一座坛。请按足价把它给我，好使百姓所遭的瘟疫止住。”
  rationale: 仅作轻微的现代汉语润饰：以“场地”替换重复的“地方”，并在第二句补足代词所指。原文的定指、建坛目的、足额银价、以及瘟疫被止息而未明说施事者，均予保留。
  reviewer_model: gpt-5.6-terra
