base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/022.yaml
  text: Then David said to Ornan, “Give me the place of the threshing floor, so that I may build on it an altar to the LORD. Give it to me for the full price, so that the plague may be stopped from upon the people.”
translation:
  language: zh_hans
  text: 大卫对阿珥楠说：“请把这禾场的场地给我，我好在上面为耶和华筑一座坛。请按足价把它给我，好使百姓所遭的瘟疫止住。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְקוֹם הַגֹּרֶן
  choice: 这禾场的地方
  rationale: מָקוֹם 是“地方、地点”，与定指的“禾场”连用；译文保留原文较具体的“地方”，同时用“这”自然体现定指及现场语境。
- source_word: בְּכֶסֶף מָלֵא
  choice: 按足价
  rationale: 字面意为“以足额的银钱”，在交易语境中自然表达为“按足价”，强调大卫并非索要无偿赠与。
- source_word: וְתֵעָצַר
  choice: 好使……止住
  rationale: 该动词为被动式，意为“被制止、止息”；中文以不标明施事者的“止住”保留其表达重心。
- source_word: מֵעַל הָעָם
  choice: 百姓所遭的
  rationale: 字面为“从百姓之上”；现代汉语若直译为“从百姓之上”生硬，转译为“百姓所遭的”准确表达瘟疫临到并压在百姓身上的语义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代简体中文圣经读者最熟悉的专名“耶和华”，明确对应原文四字神名，不以泛称替代。
- issue: 瘟疫止息的施事者
  choice: 不明说施事者
  alternative: “好使耶和华止住瘟疫”
  rationale: 原文使用被动式“瘟疫被止住”，未在本句明确指出施事者；译文不补入主语，以保留原文的语法含蓄。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“我好……”与“好使……”清楚呈现两个目的关系；避免仿古句式，也不削弱献坛、足价与瘟疫止息等关键内容。
