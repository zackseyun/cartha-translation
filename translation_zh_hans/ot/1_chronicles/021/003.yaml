base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/003.yaml
  text: But Joab said[a], “May Yahweh add to his people a hundred times as many as they are! Are they not all, my lord the king[c][b], servants of my lord? Why does my lord seek this? Why should it become guilt for Israel?”
translation:
  language: zh_hans
  text: 约押说：“愿耶和华使他的子民比现今增多百倍！我主我王啊，他们不都是我主的仆人吗？我主为什么还要寻求这事呢？这事为什么会成为以色列的罪责[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这事为什么会成为以色列犯罪的缘由呢？”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹסֵף יְהוָה עַל עַמּוֹ כָּהֵם מֵאָה פְעָמִים
  choice: 愿耶和华使他的子民比现在增加百倍
  rationale: 将未完成式在此处的祈愿语气译为“愿”，并按希伯来语比较性习语表达人数增至远超现有规模；“增加百倍”自然、清楚，同时保留原文的夸张力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的上帝专名音译“耶和华”，明确区别于“主”这一称号。
- source_word: הֲלֹא אֲדֹנִי הַמֶּלֶךְ כֻּלָּם לַאדֹנִי לַעֲבָדִים
  choice: 我主我王啊，他们不都是我主的仆人吗
  rationale: 保留反问句及宫廷敬语；עֲבָדִים在此强调百姓对君王的臣属关系，因此译为“仆人”，不突出奴隶制度含义。
- source_word: יְבַקֵּשׁ זֹאת
  choice: 要做这事
  rationale: בקש本可译为“寻求、要求”，但此处所指是推动人口统计；“要做这事”在汉语中自然，也保留了指代的概括性。
- source_word: יִהְיֶה לְאַשְׁמָה לְיִשְׂרָאֵל
  choice: 要使以色列担当罪责
  rationale: אַשְׁמָה在这里指因该行动而产生的罪咎或责任，并非赎愆祭；“担当罪责”表达罪责临到以色列的结果。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文圣经传统中最通行、普通读者最易识别的专名“耶和华”，而不以“主”替代；“雅威”则是另一种较贴近学术重构发音的音译。
- issue: אַשְׁמָה所表达的罪责性质
  choice: 担当罪责
  alternative: 成为以色列犯罪的缘由
  rationale: 该结构既可着重以色列因此负罪，也可理解为这事成为招致罪责的原因。正文选择自然的结果性表达，脚注保留因果层面的可能理解，不将其误解为祭物。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“我主我王啊”保留约押对君王的恭敬称呼，以连续反问呈现他劝阻大卫的迫切语气；避免生硬直译“寻求这事”和“成为罪”。
