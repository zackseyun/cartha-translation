  yaml_path: translation/ot/1_chronicles/021/006.yaml
  text: But he did not count Levi and Benjamin among them[a], because the king’s command was detestable to Joab.
translation:
  language: zh_hans
  text: 不过，利未和便雅悯没有被数在其中[a]，因为约押厌恶王的命令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为王的话在约押看来是可憎的。”
    reason: 保留 דְּבַר 可译为“话”，并清楚表达 נִתְעַב אֶת־יוֹאָב 的评价关系。
lexical_decisions:
- source_word: וְ/לֵוִי֙ וּ/בִנְיָמִ֔ן
  choice: 不过，利未和便雅悯
  rationale: 两个支派名按现代中文圣经通行形式译出；句首 וְ 结合上下文表达转折，译为“不过”。
- source_word: לֹ֥א פָקַ֖ד בְּ/תוֹכָ֑/ם
  choice: 没有被数在其中
  rationale: פקד 在人口统计语境中表示“数点、计算人数”；中文用被动表达可自然保留原文中约押虽未明说却可由上下文确定的施事者，并准确表达这两个支派未列入统计。
- source_word: כִּֽי
  choice: 因为
  rationale: 此处引出未将两个支派列入统计的原因，译作明确的因果连词“因为”。
- source_word: נִתְעַ֥ב
  choice: 厌恶
  rationale: 该尼法勒形态表达某事在某人看来可憎、令人反感；“厌恶”在现代中文中自然且保留强烈否定意味。
- source_word: דְּבַר הַ/מֶּ֖לֶךְ
  choice: 王的命令
  rationale: דבר 可指“话、事情、命令”；本段语境是王下令数点百姓，因此正文译为“命令”，脚注保留较贴近字面的“话”。
- source_word: אֶת יוֹאָֽב
  choice: 约押厌恶
  rationale: אֶת 在此标示受到情感或评价影响的人，即此事令约押厌恶。中文改用主动感受结构，较“对约押是可憎的”自然，同时不改变意义。
