  text: וַ/יֹּ֧אמֶר דָּוִ֛יד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד אֶפְּלָה נָּ֣א בְ/יַד יְהוָ֗ה כִּֽי רַבִּ֤ים רַחֲמָי/ו֙ מְאֹ֔ד וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/013.yaml
  text: Then David said to Gad[a], “I am in great distress. Please let me fall into the hand of Yahweh, for his mercies are very great; but do not let me fall into the hand of man.”
translation:
  language: zh_hans
  text: 大卫对迦得说：“我极其苦恼。求你让我落在雅威手中，因为他的怜悯极其丰盛；但不要让我落在人的手中[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“一个人的手中”或“人的手中”，使用单数形式，与前面的“雅威手中”形成对照；也可译作“人手中”。
    reason: 说明 אָדָם 的单数形式及其泛指人类权势的含义。
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: 我实在非常苦恼
  rationale: 这个希伯来语习语表达身处极大困境所产生的痛苦与焦灼；译文采用现代汉语的自然说法，同时保留原文的强烈程度。
- source_word: אֶפְּלָה נָּא
  choice: 求你让我落在
  rationale: 第一人称意愿式配合 נָא，带有恳切请求的语气；“求你让我”既传达请求，也保留“落在……手中”的原文意象。
- source_word: בְיַד יְהוָה
  choice: 落在雅威手中
  rationale: “在某人手中”表示处于其权柄或审判之下；保留“手中”的意象，以便与后文“人的手中”构成平行对照。神名 יְהוָה 音译为“雅威”。
- source_word: כִּי רַבִּים רַחֲמָיו מְאֹד
  choice: 因为他的怜悯极其丰盛
  rationale: רַחֲמִים 表示深切的怜悯或慈悲；“极其丰盛”共同体现 רַבִּים 与 מְאֹד 所表达的丰富和强烈程度。
- source_word: וּבְיַד אָדָם אַל אֶפֹּל
  choice: 但不要让我落在人的手中
  rationale: 否定请求与前句形成鲜明对照。אָדָם 在此泛指人，与雅威相对；“人的手中”保留原文单数形式和文学平行。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近其通常重构发音的现代汉语音译，而不以称号替代专名。
- issue: 雅威的手与人的手之间的对照
  choice: 保留“手中”的共同意象
  alternative: 分别意译为“受雅威处置”和“受人摆布”
  rationale: 原文有意重复 בְיַד，表达大卫宁愿处在神的权柄和审判之下，也不愿落入人的权势之下。保留意象可避免削弱这种神学与文学张力。
- issue: רַחֲמָיו 的数与含义
  choice: 他的怜悯
  alternative: 他的慈悲
  rationale: 希伯来语使用复数形式，但汉语通常以不可数的“怜悯”自然表达其丰富与多重施予；后面的“极其丰盛”保留其充盈之意。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“实在非常苦恼”传达强烈处境压力；分号保留因果说明与末尾转折之间的节奏。脚注标记置于所解释的“人的手中”之后。
