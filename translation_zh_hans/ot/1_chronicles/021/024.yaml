base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/024.yaml
  text: But King David said to Ornan[a], “No, for I will surely buy it for the full price in silver, because I will not take for Yahweh what is yours[b], nor offer up a burnt offering for nothing.”
translation:
  language: zh_hans
  text: 大卫王对阿珥楠说：“不！我一定要用足额的银子买下它；我绝不把属于你的东西拿来献给雅威，也不花代价地献上燔祭。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כִּי
  choice: 不！
  rationale: לֹא表达坚决拒绝；后面的כִּי引出说明。中文用断句自然呈现拒绝及其理由，不强行加入可能过度限定关系的连接词。
- source_word: קָנֹה אֶקְנֶה
  choice: 我一定要……买下
  rationale: 动词不定式绝对形与限定动词连用，强调购买行动；“一定要”自然传达这种强意。
- source_word: בְּכֶסֶף מָלֵא
  choice: 付足银子
  rationale: 指以足额银子支付，而非象征性付款；此译既保留支付媒介“银子”，也符合现代汉语表达。
- source_word: אֶשָּׂא אֲשֶׁר לְךָ
  choice: 把属于你的东西拿来
  rationale: נשׂא在此语境中指取用或拿走，אֲשֶׁר לְךָ明确表示所有权；译文保留“你的东西”这一重点。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词ל在献祭语境中表示对象或归属；“献给”与下句献燔祭相衔接。神名יהוה音译为“雅威”。
- source_word: וְהַעֲלוֹת עוֹלָה
  choice: 也不……献上燔祭
  rationale: עלה与עולה构成常见献祭表达；“献上燔祭”准确而自然。
- source_word: חִנָּם
  choice: 白白
  rationale: 表示无偿、不付代价；“白白”保留原文简洁有力的伦理与敬拜张力。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”以常见现代汉语音译呈现专名，避免把专名改写为称号。
- issue: “白白献上燔祭”的含义
  choice: 保留“白白”，不解释为宽泛的“敬拜必须付代价”原则
  alternative: 献上不花自己代价的燔祭
  rationale: חִנָּם直接指无偿取得或不付代价。译文保留其在本段交易与献祭情境中的张力，不扩展成原文未明说的普遍教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“付足银子买下”兼顾原文形式与中文习惯；两个“绝不／也不”清楚呈现大卫拒绝取用他人财物并无偿献祭的并列思想。
