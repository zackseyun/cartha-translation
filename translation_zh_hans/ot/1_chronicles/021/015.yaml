  text: וַ/יִּשְׁלַח֩ הָ/אֱלֹהִ֨ים מַלְאָ֥ךְ לִֽ/ירוּשָׁלִַם֮ לְ/הַשְׁחִיתָ/הּ֒ וּ/כְ/הַשְׁחִ֗ית רָאָ֤ה יְהוָה֙ וַ/יִּנָּ֣חֶם עַל הָֽ/רָעָ֔ה וַ/יֹּ֨אמֶר לַ/מַּלְאָ֤ךְ הַ/מַּשְׁחִית֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֔ד עִם גֹּ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/015.yaml
  text: And God sent an angel to Jerusalem to destroy it[a], but as he was destroying it, Yahweh saw and relented concerning the calamity, and he said to the destroying angel, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was standing by the threshing floor of Ornan the Jebusite.
translation:
  language: zh_hans
  text: 神差遣一位天使到耶路撒冷，要毁灭这城。当天使正要毁灭这城时，雅威看见了，就改变了心意，不再降下这灾祸[a]；他对那施行毁灭的天使说：“够了！现在收回你的手[b]。”雅威的天使正站在耶布斯人阿珥楠的禾场旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”指毁灭性的审判，并非道德上的邪恶。原文直译可作“雅威就对这灾祸转意（或：后悔）”。
    reason: 说明 רָעָה 在此处的语境含义，并保留 נחם 的叙事性、拟人化表达及其可译范围。
  - marker: b
    text: “收回你的手”意为停止正在施行的毁灭。
    reason: 解释希伯来语身体意象在本句中的惯用含义。
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 定冠词和单数语境表明所指是以色列的神；“神”是现代汉语中自然、庄重的译法。
- source_word: מַלְאָךְ
  choice: 天使
  rationale: 这里是神差去执行审判的天上使者，译作“天使”比泛称“使者”更符合语境。
- source_word: לִירוּשָׁלִַם לְהַשְׁחִיתָהּ
  choice: 到耶路撒冷，要毁灭这城
  rationale: 保留介词所表达的趋向，并用目的分句清楚表达毁灭的行动；“这城”明确阴性代词所指。
- source_word: וּכְהַשְׁחִית
  choice: 正毁灭的时候
  rationale: 表达该动作正在进行而随后受到制止，同时不额外断定毁灭到了何种程度。
- source_word: וַיִּנָּחֶם עַל הָרָעָה
  choice: 就为这灾祸回心转意
  rationale: 保留叙事中神对灾祸作出回应的拟人化张力；“灾祸”在此指审判所带来的灾难，不指道德上的邪恶。
- source_word: הַמַּלְאָךְ הַמַּשְׁחִית
  choice: 那施行毁灭的天使
  rationale: 以关系性表达保留分词的主动含义，在现代汉语中比“毁灭天使”更清楚自然。
- source_word: רַב
  choice: 够了
  rationale: 这是表示“足够了”的简短感叹，直译简洁有力。
- source_word: הֶרֶף יָדֶךָ
  choice: 收回你的手
  rationale: 保留希伯来语的“手”这一形象，同时自然表达停止正在执行的行动。
- source_word: גֹּרֶן
  choice: 禾场
  rationale: 指打谷、扬谷的场地；“禾场”符合圣经叙事的庄重语体，且普通读者可以理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 正文直接出现四字神名，以“雅威”保留其专名性质，不用称号取代。
- issue: וַיִּנָּחֶם 的拟人化表述
  choice: 回心转意
  alternative: 后悔；不再降下；改变心意
  rationale: 该词在叙事中表示神因所见而转离继续施行灾祸。“回心转意”保留文本所呈现的回应性，不将其化解为抽象的哲学说明，也不暗示神犯了道德错误。
- issue: מַלְאַךְ יְהוָה 的身份
  choice: 雅威的天使
  alternative: 雅威亲自以天使显现；一位受造的天使
  rationale: 按原文结构直译，不替文本裁定这一角色的本体身份。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“正毁灭的时候”保留行动进行中被制止的叙事动态；“雅威的天使”不预设其神学身份；人名采用“阿珥楠”，族名采用通行的“耶布斯人”。
