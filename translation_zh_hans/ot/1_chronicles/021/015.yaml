revisions:
- from: 神差遣一位天使到耶路撒冷，要毁灭这城。正毁灭的时候，雅威看见了，就为这灾祸回心转意[a]，对那施行毁灭的天使说：“够了！现在收回你的手[b]。”当时，雅威的天使正站在耶布斯人阿珥楠的禾场旁。
  to: 神差遣一位天使到耶路撒冷，要毁灭这城。当天使正要毁灭这城时，雅威看见了，就改变了心意，不再降下这灾祸[a]；他对那施行毁灭的天使说：“够了！现在收回你的手[b]。”雅威的天使正站在耶布斯人阿珥楠的禾场旁。
  rationale: 修订仅改善两处中文表达：“改变了心意，不再降下这灾祸”更自然而准确地传达雅威对灾祸的转意，不带“回心转意”可能引起的道德性暗示；补明“天使”作为“正要毁灭”的施事者，以提高叙事清晰度。其余术语、专名、神名译法和脚注锚点均予保留。
