  yaml_path: translation/ot/1_chronicles/021/014.yaml
  text: So Yahweh sent a plague on Israel[a], and seventy thousand men of Israel fell.
translation:
  language: zh_hans
  text: 于是，雅威使瘟疫临到以色列[a]，以色列人中倒下了七万人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瘟疫”也可译作“疫病”。希伯来语这个词指致命的疾病暴发，常用于神施行审判的语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: וַיִּתֵּן
  choice: 使……临到
  rationale: 该动词字面为“给”，但与“瘟疫”连用时，汉语译为“使瘟疫临到”更自然，同时保留雅威直接施行审判的语义。
- source_word: דֶּבֶר
  choice: 瘟疫
  rationale: 该词指致命的传染病暴发，常见于神施行审判的语境；“瘟疫”准确、自然，也保留其严重性。
- source_word: בְּיִשְׂרָאֵל
  choice: 临到以色列
  rationale: 介词在此表示瘟疫加在以色列之上；结合汉语搭配，译为“临到以色列”比直译“在以色列中”更能表达事件的指向。
- source_word: וַיִּפֹּל
  choice: 倒下了
  rationale: 保留希伯来文“倒下”的死亡委婉语及审判意象，不直接释义为“死了”。
- source_word: מִיִּשְׂרָאֵל
  choice: 以色列人中
  rationale: 此处表示死者出自以色列群体；“以色列人中”是自然且准确的现代汉语表达。
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: 七万人
  rationale: אִישׁ在数词后作集合性用法。现代汉语“七万人”自然地表达人数；在本句中不必机械译作“七万男人”，以免产生不必要的性别强调。
theological_decisions:
- issue: 神在审判中的直接作用
  choice: 雅威使瘟疫临到以色列
  alternative: 雅威容许瘟疫临到以色列
  rationale: 希伯来文直接以雅威为动作主体，没有“容许”之类的缓和表达；译文保留这一直接归因及其神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接上文结果；“使……临到”避免生硬直译“给了瘟疫”；“倒下了”保留原文意象。脚注标记已置于正文相应词句之后。
