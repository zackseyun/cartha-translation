    text: “俯伏”或译“下拜”。希伯来文描写的是全身俯伏、脸伏于地的姿势。
    reason: 说明该词可指向人俯伏致敬的具体动作，避免将其弱化为普通鞠躬，或必然理解为宗教敬拜。
  revision_rationale: 作轻微语序与措辞修订，使“俯伏”的对象和“脸伏于地”的姿态在中文中衔接更自然；其余内容保留原译的源文忠实度、叙事顺序和庄重现代文体。
