    issue: “向大卫俯伏”在后接“脸伏于地”时句法关系略松。
    rationale: 原文 לְדָוִיד 表示俯伏所面对的人；“在大卫面前俯伏”在现代汉语中更自然，也更清楚地维持动作的空间和对象关系。
  - severity: low
    issue: 脚注对“完全俯伏姿势”的表述不够简洁。
    rationale: 可直接说明为“全身俯伏、脸伏于地的姿势”，既说明动作强度，也避免不必要的抽象措辞。
  revised_text: 大卫来到阿珥楠那里时，阿珥楠望去，看见了大卫，就从禾场出来，在大卫面前俯伏，脸伏于地。[a]
  revised_footnotes:
