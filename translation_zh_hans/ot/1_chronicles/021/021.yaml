revisions:
- from: 大卫来到阿珥楠那里时，阿珥楠望去，看见了大卫，就从禾场出来，向大卫俯伏，脸伏于地。[a]
  to: 大卫来到阿珥楠那里时，阿珥楠望去，看见了大卫，就从禾场出来，在大卫面前俯伏，脸伏于地。[a]
  rationale: 作轻微语序与措辞修订，使“俯伏”的对象和“脸伏于地”的姿态在中文中衔接更自然；其余内容保留原译的源文忠实度、叙事顺序和庄重现代文体。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:22Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实保留了希伯来文的动作次序：大卫到阿珥楠那里，阿珥楠观看并看见大卫，从禾场出来，继而在大卫面前俯伏。人名“阿珥楠”、地点“禾场”及俯伏而非宗教敬拜的处理均恰当。惟“向大卫俯伏，脸伏于地”虽可理解，但“向”与末尾姿势之间的句法连接略松；改为“在大卫面前俯伏，脸伏于地”更直接对应 לְדָוִיד 和完整俯伏的姿态。
  naturalness: “望去，看见了大卫”准确保留两个动词，但现代汉语叙事中“望去”稍显悬空；“举目观看，看见大卫”会加入“举目”，不宜。保留“望去”是安全的。将“向大卫俯伏”微调为“在大卫面前俯伏”，表达更自然庄重，且明确其为在君王面前的身体动作。
  terminology: “禾场”是 גֹּרֶן 的规范译法；“俯伏”“脸伏于地”准确传达 השתחוה 与 אַפַּיִם אָרְצָה，且不把对人的臣服预断为敬拜。脚注可说明“下拜”为可选表达，但原脚注“完全俯伏姿势”略显累赘，宜简化为“全身俯伏、脸伏于地的姿势”。
  issues:
