  text: וַ/יָּבֹ֥א דָוִ֖יד עַד אָרְנָ֑ן וַ/יַּבֵּ֤ט אָרְנָן֙ וַ/יַּ֣רְא אֶת דָּוִ֔יד וַ/יֵּצֵא֙ מִן הַ/גֹּ֔רֶן וַ/יִּשְׁתַּ֧חוּ לְ/דָוִ֛יד אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/021.yaml
  text: When David came to Ornan[a], Ornan looked and saw David, and he went out from the threshing floor and bowed down before David with his face to the ground.
translation:
  language: zh_hans
  text: 大卫来到阿珥楠那里时，阿珥楠望去，看见了大卫，就从禾场出来，在大卫面前俯伏，脸伏于地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俯伏”或译“下拜”。希伯来文描写的是全身俯伏、脸伏于地的姿势。
    reason: 说明该词可指向人俯伏致敬的具体动作，避免将其弱化为普通鞠躬，或必然理解为宗教敬拜。
lexical_decisions:
- source_word: וַיָּבֹא דָוִיד עַד אָרְנָן
  choice: 大卫来到阿珥楠那里
  rationale: בוא可依叙事视角译为“来”或“去”，עַד在此表示来到某人跟前；“来到……那里”自然地表达了大卫接近阿珥楠。
- source_word: וַיַּבֵּט אָרְנָן
  choice: 阿珥楠望去
  rationale: נבט表示把目光投向某处。“望去”保留主动观看的动作，又不擅自加入原文没有明说的“抬头”。
- source_word: וַיַּרְא אֶת־דָּוִיד
  choice: 看见了大卫
  rationale: 保留“望去—看见”两个相继动作，不将希伯来文的叙述层次合并。
- source_word: וַיֵּצֵא מִן־הַגֹּרֶן
  choice: 就从禾场出来
  rationale: יצא与מן共同表达从某处出来；“禾场”是גורן在这一农业场景中的通行而简洁的译法。
- source_word: וַיִּשְׁתַּחוּ לְדָוִיד
  choice: 向大卫俯伏
  rationale: השתחוה可指向人俯伏致敬，也可在其他语境中指敬拜；这里用“俯伏”忠实呈现身体动作，不额外断定是宗教敬拜。
- source_word: אַפַּיִם אָרְצָה
  choice: 脸伏于地
  rationale: 该习语字面涉及脸面朝地，描述完全俯伏的姿势；“脸伏于地”准确、自然且庄重。
theological_decisions:
- issue: 阿珥楠的动作是否应译成对大卫的宗教性敬拜
  choice: 向大卫俯伏
  alternative: 敬拜大卫；向大卫致敬
  rationale: השתחוה的具体含义取决于语境。此处对象是君王大卫，文本明确描述脸伏于地的动作，却没有明说宗教敬拜；因此保留具体姿势，也不以抽象的“致敬”取代原文形象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“阿珥楠”沿用中文圣经中该人名的常见译法；“禾场”简洁保留古代农业背景。脚注标记置于所解释的俯伏动作之后。
