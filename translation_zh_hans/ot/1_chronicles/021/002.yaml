  text: וַ/יֹּ֨אמֶר דָּוִ֤יד אֶל יוֹאָב֙ וְ/אֶל שָׂרֵ֣י הָ/עָ֔ם לְכ֗וּ סִפְרוּ֙ אֶת יִשְׂרָאֵ֔ל מִ/בְּאֵ֥ר שֶׁ֖בַע וְ/עַד דָּ֑ן וְ/הָבִ֣יאוּ אֵלַ֔/י וְ/אֵדְעָ֖ה אֶת מִסְפָּרָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/002.yaml
  text: Then David said to Joab and to the commanders of the people[a], “Go, count Israel from Beersheba to Dan, and bring it to me, so that I may know their number.”
translation:
  language: zh_hans
  text: 于是，大卫对约押和百姓的首领说：“你们去数点以色列人，从别是巴直到但[a]，再把结果带来给我，好让我知道他们的数目。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从别是巴直到但”是希伯来语的惯用说法，意思是从以色列的一端到另一端，也就是遍及全境。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 叙事性的连续式推动情节；“于是”自然表达前后相承的语气。
- source_word: שָׂרֵי הָעָם
  choice: 百姓的首领
  rationale: שָׂרִים 可指首领、官长或军队统领。上下文虽可能带有行政或军事意味，但原词本身较宽泛，因此用“首领”保留其涵盖范围。
- source_word: לְכוּ סִפְרוּ
  choice: 你们去数点
  rationale: 两个复数命令式分别表达“去”和“数算”；“数点”符合人口统计语境，又不扩展为原文未明说的正式“人口普查”。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列人
  rationale: “以色列”在此是被数点的群体。汉语用“以色列人”可清楚表达其集合性指称。
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: 从别是巴直到但
  rationale: 保留原文由南至北的两个地名及“从……直到……”结构；该说法代指以色列全境，另以脚注说明。
- source_word: וְהָבִיאוּ אֵלַי
  choice: 再把结果带来给我
  rationale: 原文直译为“把〔它〕带来给我”，宾语省略；上下文所指是数点所得的结果。“结果”使现代汉语完整自然，同时不把它过度限定为某种具体文书或报告。
- source_word: וְאֵדְעָה אֶת מִסְפָּרָם
  choice: 好让我知道他们的数目
  rationale: 意愿式在命令之后表达目的；“好让我……”传达目的意味，“他们的数目”贴近原文名词短语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“数点”保留经文语体但仍为普通读者所理解；脚注标记紧随其所解释的地理惯用语，而非置于“百姓的首领”之后。
