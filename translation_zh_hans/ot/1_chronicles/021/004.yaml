base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/004.yaml
  text: But the king’s word prevailed against Joab[a]. So Joab went out and went throughout all Israel[b], and he came to Jerusalem.
translation:
  language: zh_hans
  text: 可是，王的命令压过了约押[a]。于是约押出去，走遍以色列全地[b]，然后来到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王的话胜过了约押。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“在以色列全地各处行走。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבַר הַמֶּלֶךְ
  choice: 可是，王的话
  rationale: דָּבָר直译为“话”，在这里指王所发的命令；保留“话”可传达希伯来文的表达方式。“可是”承接上文约押的异议，体现转折。
- source_word: חָזַק עַל
  choice: 胜过了约押
  rationale: 这个短语字面表示“强过、占上风”，此处说明王的话压倒了约押的抵抗。“胜过”既保留原文意象，也不额外说明约押如何服从。
- source_word: וַיֵּצֵא יוֹאָב
  choice: 于是约押出去
  rationale: יָצָא是普通的“出去”；“于是”表达叙事上的结果关系。
- source_word: וַיִּתְהַלֵּךְ בְּכָל יִשְׂרָאֵל
  choice: 走遍了全以色列
  rationale: הָלַךְ的Hitpael形式在此表示四处行走或巡行；“走遍”自然简洁，并体现行动范围广泛。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全以色列
  rationale: 直接表达约押行程涵盖整个以色列的范围。
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: 然后来到耶路撒冷
  rationale: בּוֹא意为“来、进入”。虽然上下文可能暗示“回到”，原文并未使用“返回”，因此译作“来到”。
