source:
  edition: WLC
  text: אִם שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְ/אִם שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה מִ/פְּנֵי צָרֶי/ךָ֮ וְ/חֶ֣רֶב אוֹיְבֶ֣/ךָ לְ/מַשֶּׂגֶת֒ וְ/אִם שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב יְהוָ֤ה וְ/דֶ֨בֶר֙ בָּ/אָ֔רֶץ וּ/מַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה רְאֵ֔ה מָֽה אָשִׁ֥יב אֶת שֹׁלְחִ֖/י דָּבָֽר־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/012.yaml
  text: either three years of famine[a], or three months of being swept away before your foes while the sword of your enemies overtakes you, or three days of the sword of Yahweh, even pestilence in the land, with the angel of Yahweh destroying throughout all the territory of Israel[b]. Now consider what answer I should return to the one who sent me.
translation:
  language: zh_hans
  text: 或是三年饥荒；或是三个月在仇敌面前败逃，仇敌的刀剑追上你[a]；或是三天耶和华的刀剑，就是这地有瘟疫，耶和华的使者在以色列全境施行毁灭。现在你要考虑，我该怎样回复那差遣我来传话的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被扫去”“败亡”或“被毁灭”。希伯来语分词在此可指在敌军面前遭败亡或覆灭；其确切程度未明。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: 饥荒
  rationale: 在全国性审判的语境中，指严重而广泛的粮食短缺；“饥荒”是现代汉语中准确自然的对应词。
- source_word: נִסְפֶּה
  choice: 被扫灭
  rationale: 该词为尼法勒分词，表示遭毁灭、被除灭；“被扫灭”保留其被动意义与战争语境中的强烈意象，又不把含义限缩为单指死亡。
- source_word: מִפְּנֵי צָרֶיךָ
  choice: 在你的敌人面前
  rationale: 保留希伯来语的空间与军事表达，语境上指在敌军面前败退或遭毁灭。
- source_word: חֶרֶב אוֹיְבֶיךָ
  choice: 你仇敌的刀剑
  rationale: 保留结构短语及“刀剑”的战争意象，并以“仇敌”避免与前句“敌人”机械重复。
- source_word: לְמַשֶּׂגֶת
  choice: 追上你
  rationale: 该词表达追赶后赶上、及于；“追上你”在军事追击语境中直白自然。
- source_word: חֶרֶב יְהוָה
  choice: 耶和华的刀剑
  rationale: 保留原文与“你仇敌的刀剑”之间有意形成的对照。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 现代简体中文圣经语域中对四字神名最广为理解的音译，作为专名保留。
- source_word: דֶבֶר
  choice: 瘟疫
  rationale: 在审判语境中指流行性的致命疫病；“瘟疫”准确、庄重且为现代读者所理解。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ 的基本义为“使者”；此处是执行毁灭的超自然使者。译为“使者”保留词义，也不进一步断定其身份。
- source_word: מַשְׁחִית
  choice: 施行毁灭
  rationale: 该使役分词描述使者持续执行毁灭的行动；“施行毁灭”庄重而自然。
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: 在以色列全境
  rationale: 此处 גְּבוּל 指领土范围而非仅指边界线；“全境”简洁传达遍及整片土地。
- source_word: רְאֵה
  choice: 考虑
  rationale: 命令式在此要求大卫权衡并作决定，不是要求视觉上的观看；“考虑”准确表达语用功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知的专名“耶和华”，不以“主”替代，从而保留神名在本节中的出现及其与“刀剑”“使者”的结构联系。
- issue: מַלְאַךְ יְהוָה 的身份
  choice: 耶和华的使者
  alternative: 耶和华的天使
  rationale: 采用词语的基本意义，不将这位使者进一步认定为受造天使或特殊的神显，以保留经文本身未在本节解决的神学张力。
- issue: דֶבֶר 与“耶和华的刀剑”的关系
  choice: 用“就是”表达同位说明
  alternative: 将两者并列为彼此独立的灾祸
  rationale: 原文在“三天耶和华的刀剑”之后接“国中的瘟疫”，最自然地可理解为后者说明前者的具体表现；“就是”保留这种同位关系，而不添加原文没有的另一选项。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留三项选择的平行结构，以及“仇敌的刀剑”与“耶和华的刀剑”的对照。原文 נִסְפֶּה 含义较强，正文用“被扫灭”保留毁灭性，同时避免擅自限定为“被杀”。
