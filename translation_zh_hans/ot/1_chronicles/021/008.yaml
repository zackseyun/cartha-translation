  text: וַ/יֹּ֤אמֶר דָּוִיד֙ אֶל הָ֣/אֱלֹהִ֔ים חָטָ֣אתִֽי מְאֹ֔ד אֲשֶׁ֥ר עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/עַתָּ֗ה הַֽעֲבֶר נָא֙ אֶת עֲו֣וֹן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/008.yaml
  text: Then David said to God[a], “I have sinned greatly in doing this thing. But now, please take away the guilt of your servant, for I have acted very foolishly.”
translation:
  language: zh_hans
  text: 大卫对神说：“我做了这事，实在犯了大罪。现在求你除掉你仆人的罪责[a]，因为我所行的实在愚昧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪责”或译“罪孽”，也可指因犯罪而负的责任。
    reason: 保留 עָוֹן 在罪行、罪责和罪责后果之间的词义幅度。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译连接词；中文叙事承接自然，语序本身足以推进情节。
- source_word: אֶל הָאֱלֹהִים
  choice: 对神
  rationale: 这里指以色列的神；“对神说”是现代汉语中自然、准确的表达。
- source_word: חָטָאתִי מְאֹד
  choice: 实在犯了大罪
  rationale: “犯了大罪”表达犯罪的严重性，“实在”传达 מְאֹד 的强调语气。
- source_word: אֲשֶׁר עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  choice: 我做了这事
  rationale: 明确指出大卫所承认的具体行为，同时用自然的中文调整分句次序。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 标明由认罪转入恳求；中文无须强加明显的转折关系。
- source_word: הַעֲבֶר נָא
  choice: 求你除掉
  rationale: “除掉”传达使之离去的使役含义，“求你”体现 נָא 的恳求语气。
- source_word: עֲוֹן
  choice: 罪责
  rationale: 该词可指罪孽、罪责或因罪而负的责任；在求神除去的语境中，“罪责”既自然，也保留道德过犯与责任之间的关联。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 这是大卫在神面前谦卑的自称，“仆人”比“奴隶”更符合此处语用。
- source_word: כִּי
  choice: 因为
  rationale: 自然地引出大卫恳求的理由。
- source_word: נִסְכַּלְתִּי מְאֹד
  choice: 我所行的实在愚昧
  rationale: 保留动词所表达的愚昧行为，而不只描述性格；“实在”传达 מְאֹד 的强调。
theological_decisions:
- issue: 大卫请求神除去的 עָוֹן 应如何理解
  choice: 正文译作“罪责”
  alternative: “罪孽”或“因罪所负的责任”
  rationale: 原词兼有罪行、罪责及罪所带来之责任等意义。正文采用“罪责”，不把含义限缩为单纯的行为或刑罚，并以脚注保留词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的认罪祈求语体；避免古奥措辞，也不将原文对“罪责”的多义性收窄为特定神学解释。
