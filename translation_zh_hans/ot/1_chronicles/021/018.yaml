  text: וּ/מַלְאַ֧ךְ יְהוָ֛ה אָמַ֥ר אֶל גָּ֖ד לֵ/אמֹ֣ר לְ/דָוִ֑יד כִּ֣י יַעֲלֶ֣ה דָוִ֗יד לְ/הָקִ֤ים מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבֻסִֽי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/018.yaml
  text: And the angel of Yahweh said to Gad to tell David that David should go up to set up an altar to Yahweh on the threshing floor of Ornan the Jebusite[a][b].
translation:
  language: zh_hans
  text: 雅威的天使[a]对迦得说，要他告诉大卫：大卫应当上去[b]，在耶布斯人阿珥楠的禾场上为雅威设立一座祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使”也可译作“使者”。
    reason: lexical_alternative
  - marker: b
    text: “应当上去”也可译作“必须上去”或“要上去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: 雅威的使者
  rationale: מַלְאַךְ既可指一般“使者”，也可指天上的“天使”；正文采用较能保留原词语义范围的“使者”，并以脚注说明“天使”这一合乎语境的译法。יְהוָה按其专名译作“雅威”。
- source_word: אָמַר אֶל־גָּד
  choice: 对迦得说
  rationale: 直接对应常用动词אָמַר及其受词结构，中文自然清楚。
- source_word: לֵאמֹר לְדָוִיד
  choice: 要他告诉大卫
  rationale: 把希伯来语引介话语内容的结构自然地转成中文，并明确“他”指迦得；不把后面的指令误作使者直接对大卫说。
- source_word: כִּי יַעֲלֶה דָוִיד
  choice: 大卫应当上去
  rationale: “应当”表达此处指令性的语气，同时不把力度限定为唯一可能的“必须”；“上去”保留עלה的方向含义。
- source_word: לְהָקִים מִזְבֵּחַ
  choice: 筑一座坛
  rationale: הקים本义为立起、设立；中文在祭坛语境中以“筑坛”最自然，也准确表达把坛建起、设立起来。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词ל在此表示祭坛归属、奉献的对象，中文“为雅威”自然表达这一关系。
- source_word: בְּגֹרֶן
  choice: 在……禾场上
  rationale: גֹרֶן指打谷、簸扬谷物的场地；“禾场”是简洁而庄重的中文对应，“上”体现地点表面。
- source_word: אָרְנָן הַיְבֻסִי
  choice: 耶布斯人阿珥楠
  rationale: 按中文习惯先说明族属，再列人名；专名采用常见圣经音译。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地音译其通常重构的读音，并避免以称号替代专名。
- issue: מַלְאַךְ在本叙事中是“使者”还是“天使”
  choice: 正文作“使者”，脚注列“天使”
  alternative: 天使
  rationale: 本段语境指向天上的存在，但原词本身同时具有“使者”和“天使”的词义；正文与脚注共同保存这层词汇张力。
- issue: יַעֲלֶה的指令力度
  choice: 应当上去
  alternative: 必须上去；要上去
  rationale: 该从句传达命令内容，但未用一个在中文中只能理解为最强义务的专门形式；“应当”保留指令性而不过度判定强度。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。语序按中文叙事习惯调整，以冒号引出传达给大卫的指令；保留“上去”的空间意味，并用“禾场”“筑坛”等简洁、熟悉的宗教叙事用语。
