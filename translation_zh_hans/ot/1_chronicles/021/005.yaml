base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/005.yaml
  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
translation:
  language: zh_hans
  text: 约押把百姓登记所得的数目交给大卫。全以色列能拔剑作战的共有一百一十万人[a]；犹大能拔剑作战的共有四十七万人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一千个千和一百个千”。
    reason: 保留希伯来文数字表达的特殊形式，同时正文采用自然清楚的现代中文数值。
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: 百姓登记所得的数目
  rationale: מִסְפַּר表示“数目、总数”，מִפְקַד在本语境中指为军事目的进行的登记或点数。译文保留“数目”与“登记”两层含义，同时符合现代汉语表达。
- source_word: וַיְהִי כָל יִשְׂרָאֵל
  choice: 全以色列……共有
  rationale: 该结构引出统计结果；“全以色列……共有”自然表达希伯来文的总数陈述，并保留整体概念。
- source_word: אֶלֶף אֲלָפִים וּמֵאָה אֶלֶף
  choice: 一百一十万
  rationale: 按希伯来文通常数值理解为1,100,000；采用现代中文数字表达以便阅读，并用脚注保留原文特殊的字面构造。
- source_word: אִישׁ
  choice: 人
  rationale: 这里指军事登记中的男性人口；“能拔刀作战的人”已明确其军事与男性语境，中文无需重复译作“男人”。
- source_word: שֹׁלֵף חֶרֶב
  choice: 能拔刀作战的
  rationale: שֹׁלֵף字面为“拔出（刀剑）”。在军事人口统计中，这一习语指具备作战能力的人；译文保留“拔刀”的形象，并补出语境隐含的“作战”。
- source_word: וִיהוּדָה
  choice: 犹大……共有
  rationale: 承接上一分句省略的陈述结构，以“共有”补足现代汉语句法，并保持两个统计数字的平行。
- source_word: אַרְבַּע מֵאוֹת וְשִׁבְעִים אֶלֶף
  choice: 四十七万
  rationale: 准确表达470,000，并采用现代中文常用的大数记法。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“登记”比现代行政色彩较强的“人口普查”更贴近军事点数语境；“能拔刀作战”既保留原文意象，也使其功能含义清楚。脚注标记[a]已置于正文对应数字之后。
