revisions:
- from: 大卫对上帝说：“吩咐数点百姓的，不正是我吗？犯罪的是我，行大恶的也是我。可是这些羊做了什么呢？耶和华我的上帝啊，求你伸手攻击我和我父家[a]，却不要降瘟疫攻击你的百姓。”
  to: 大卫对上帝说：“吩咐数点百姓的，不正是我吗？犯罪的是我，行大恶的也是我。可是这些羊做了什么呢？耶和华——我的上帝啊，求你伸手攻击我和我父家[a]，却不要使你的百姓遭受瘟疫。”
  rationale: 修订仅调整末句，使其更准确地表达原文中审判之“手”临到大卫及其父家、而非使百姓遭受瘟疫的对照；并以标点改善神名后呼语的汉语自然度。其余措辞保留原译的词义、修辞和庄重语体。
