source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֣יד אֶֽל הָ/אֱלֹהִ֡ים הֲ/לֹא֩ אֲנִ֨י אָמַ֜רְתִּי לִ/מְנ֣וֹת בָּ/עָ֗ם וַ/אֲנִי ה֤וּא אֲשֶׁר חָטָ֨אתִי֙ וְ/הָרֵ֣עַ הֲרֵע֔וֹתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ יְהוָ֣ה אֱלֹהַ֗/י תְּהִ֨י נָ֤א יָֽדְ/ךָ֙ בִּ֚/י וּ/בְ/בֵ֣ית אָבִ֔/י וּֽ/בְ/עַמְּ/ךָ֖ לֹ֥א לְ/מַגֵּפָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/017.yaml
  text: Then David said to God[a], “Was it not I who ordered the people to be counted? I am the one who has sinned and done great evil. But these sheep—what have they done? O Yahweh my God, please let your hand be against me and against my father’s house[d][c][b], but not against your people for a plague.”
translation:
  language: zh_hans
  text: 大卫对上帝说：“吩咐数点百姓的，不正是我吗？犯罪的是我，行大恶的也是我。可是这些羊做了什么呢？耶和华——我的上帝啊，求你伸手攻击我和我父家[a]，却不要使你的百姓遭受瘟疫。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我父家”指大卫的家族，也可能包括他的王朝家系。原文也可译作“愿你的手临到我和我父家”。
    reason: 说明“父家”的范围，并保留介词 בְּ 与“手临到”这一表达的译法可能性。
lexical_decisions:
- source_word: הֲלֹא אֲנִי אָמַרְתִּי לִמְנוֹת בָּעָם
  choice: 吩咐数点百姓的，不正是我吗
  rationale: הֲלֹא引出期待肯定回答的反问；אָמַרְתִּי לִמְנוֹת字面为“我说要数点”，语境中是大卫下令进行人口统计，译作“吩咐数点”兼顾原文和自然汉语。
- source_word: וַאֲנִי הוּא אֲשֶׁר חָטָאתִי
  choice: 犯罪的是我
  rationale: “我就是那……的人”这一强调结构突出大卫亲自承担罪责；汉语分裂句自然保留其强调。
- source_word: וְהָרֵעַ הֲרֵעוֹתִי
  choice: 行大恶的也是我
  rationale: 不定式绝对式与限定动词连用加强语气；“行大恶”既体现强化，也保留“作恶”的道德含义。
- source_word: וְאֵלֶּה הַצֹּאן
  choice: 可是这些羊
  rationale: 保留原文将百姓称作“羊”的牧养隐喻，不直接解释为“百姓”。
- source_word: יְהוָה אֱלֹהַי
  choice: 耶和华我的上帝
  rationale: 将四字神名音译为现代中文通行的“耶和华”，并保留 אֱלֹהַי 的第一人称所属关系。
- source_word: תְּהִי נָא יָדְךָ בִּי וּבְבֵית אָבִי
  choice: 求你伸手攻击我和我父家
  rationale: “手”在此表示上帝施行审判的力量；“伸手攻击”保留身体隐喻，同时由上下文明确其惩罚意义。“父家”保留家族或宗族范围。
- source_word: וּבְעַמְּךָ לֹא לְמַגֵּפָה
  choice: 却不要降瘟疫攻击你的百姓
  rationale: 原文末句凝练，直译近似“而不要在你的百姓中成为瘟疫”；此译补足汉语必要的谓语关系，并保留瘟疫是审判手段的含义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非称号；“耶和华”是现代简体中文圣经语境中最通行且普通读者易于识别的音译，未以“主”替代专名。
- issue: “这些羊”的所指
  choice: 正文保留隐喻“这些羊”
  alternative: 直接译作“这些百姓”
  rationale: 大卫以羊群比喻百姓，既表达他们的无辜，也隐含君王作为牧者的责任；直译可保留其神学和修辞张力。
- issue: 上帝之“手”的含义
  choice: 保留“伸手”意象，并以“攻击”表明审判语境
  alternative: 完全意译为“惩罚”
  rationale: 原文“手”既可指能力、行动，也在本段指审判。保留意象可避免抹平希伯来表达，而“攻击”使现代读者不会误解为一般的临在或扶助。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。反问句和两个“是我”突出大卫承担责任；保留“羊”“手”“父家”等原文意象，对会造成理解困难之处仅作有限显化。
