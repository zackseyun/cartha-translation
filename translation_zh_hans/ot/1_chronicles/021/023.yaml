base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/023.yaml
  text: And Ornan said to David, “Take it for yourself, and let my lord the king do what is good in his eyes. See, I have given the cattle for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I have given it all.”
translation:
  language: zh_hans
  text: 阿珥楠对大卫说：“你拿去吧！我主我王看怎样好，就怎样做。[a]看，牛给作燔祭，[b]打谷橇给作木柴，[c]麦子给作素祭；[d]这一切我都给了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我主我王认为怎样好，就怎样做。”原文直译是“做他眼中看为好的事”。
    reason: lexical_alternative
  - marker: b
    text: “牛”也可译作“公牛”；原词可泛指牛类，在本处指用作燔祭的牲畜。
    reason: lexical_alternative
  - marker: c
    text: 打谷橇是打谷用的器具；这里要把它拆作献祭所需的燃料。
    reason: cultural_note
  - marker: d
    text: “素祭”即以谷物为主要祭物的祭；原词也可泛译作“供物”或“礼物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לָךְ
  choice: 你拿去吧
  rationale: 命令式加利益与格 לָךְ 表示让大卫自行取用；“你拿去吧”自然地传达许可和归其使用的语气。
- source_word: וְיַעַשׂ אֲדֹנִי הַמֶּלֶךְ הַטּוֹב בְּעֵינָיו
  choice: 我主我王看怎样好，就怎样做
  rationale: 保留“在他眼中为好”的希伯来习语，同时用现代汉语可理解的句式表达按其判断行事。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 这里是对大卫的宫廷敬称，并非神的称号；此译法庄重且符合叙事语境。
- source_word: רְאֵה
  choice: 看
  rationale: 作为引出强调说明的命令式，“看”简洁自然，并保留原文的话语功能。
- source_word: הַבָּקָר לָעֹלוֹת
  choice: 把牛献作燔祭
  rationale: בקר 是牛类的集合名词；在献祭场景中“牛”既不无端限定性别，也符合现代汉语。עֹלוֹת 译作传统且准确的“燔祭”。
- source_word: הַמּוֹרִגִּים לָעֵצִים
  choice: 把打谷橇当柴烧
  rationale: מוֹרִגִּים 指打谷用的橇或器具；“当柴烧”明示其在献祭中作为燃料的实际用途。
- source_word: הַחִטִּים לַמִּנְחָה
  choice: 把麦子作素祭
  rationale: חִטִּים 是麦子；מִנְחָה 在祭祀语境中通常指谷物祭，采用中文圣经传统且简明的“素祭”。
- source_word: הַכֹּל נָתָתִּי
  choice: 这一切我都献上
  rationale: 完成式概括阿珥楠所作的全部奉献；“献上”结合语境表达交付作祭物，而不改变“给出”的基本含义。
theological_decisions: []
