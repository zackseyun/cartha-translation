- from: 阿珥楠对大卫说：“你拿去吧！我主我王看怎样好，就怎样做。[a]看，我把牛献作燔祭，[b]把打谷橇当柴烧，[c]把麦子作素祭；[d]这一切我都献上。”
  to: 阿珥楠对大卫说：“你拿去吧！我主我王看怎样好，就怎样做。[a]看，牛给作燔祭，[b]打谷橇给作木柴，[c]麦子给作素祭；[d]这一切我都给了。”
  rationale: 修订仅将“献上”改为较忠实且不预设具体宗教动作的“给了”，并相应调整列举结构，使“牛、打谷橇、麦子”清楚地是阿珥楠交给大卫作祭物、燃料和素祭用的材料。保留既有名称、宫廷敬称、祭祀术语及全部脚注锚点。
