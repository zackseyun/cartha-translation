base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/011.yaml
  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
translation:
  language: zh_hans
  text: 于是，迦得来到大卫那里，对他说：“雅威这样说：‘你自己选择吧[a]——’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“你自己接受吧”；根据上下文，这里是吩咐大卫从下一节所列的选项中作出选择。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא是常见的叙事移动动词；这里以大卫为叙述落点，译作“来到”自然准确。
- source_word: גָד
  choice: 迦得
  rationale: 人名按现代中文圣经中通行的音译处理。
- source_word: אֶל דָּוִיד
  choice: 大卫那里
  rationale: אֶל表示朝向某人；与“来到”搭配译为“来到大卫那里”，符合现代汉语表达。
- source_word: וַיֹּאמֶר לוֹ
  choice: 对他说
  rationale: 保留אמר及其间接宾语的直接结构，不强化为更具解释性的“告诉他”。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 这是先知传达神谕的固定使者公式；“耶和华这样说”庄重、清楚，也贴近希伯来语形式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉且可识别为神专名的传统译名呈现四字神名。
- source_word: קַבֶּל
  choice: 选择
  rationale: 该命令本义可指“接受、领受”，但下文列出审判选项，语境中的实际要求是作出选择；正文采用自然的语境义，并以脚注保存较直译的可能。
- source_word: לָךְ
  choice: 为自己
  rationale: 反映带命令式的与格代词，突出大卫需亲自从随后列出的选项中作出选择。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用通行且能明确作为专名识别的“耶和华”，不以“主”这一称号替代；“雅威”是较贴近学术重构发音的另一译法。
- issue: קַבֶּל在审判选项语境中的含义
  choice: 选择
  alternative: 接受；领受
  rationale: 词形本身容许“接受、领受”，而下一节的三个选项使这里具有“选择”的语境功能。正文传达其语用意义，脚注保留词汇层面的歧义，避免把较直译的读法完全隐去。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文；神谕引语以破折号收束，表明话语在下一节继续。所有脚注标记均置于正文相应位置。
