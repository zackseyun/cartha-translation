base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/001.yaml
  text: Then Satan stood up against Israel and incited David to count Israel[a][b].
translation:
  language: zh_hans
  text: 于是，撒但[a]起来与以色列为敌，并煽动大卫数点以色列人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个敌对者”。希伯来语“撒但”可泛指“敌对者”，也可用作“撒但”的名称或称号。
    reason: lexical_alternative
  - marker: b
    text: 撒母耳记下24:1把这次煽动归因于耶和华向以色列发怒；历代志则把撒但写成直接行动者。两处记载形成的神学张力在此予以保留，不加消解。
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 起来
  rationale: עמד本义为“站立、起来”；此处“起来”既保留具体动作意象，也自然表达采取敌对行动。
- source_word: שָׂטָן
  choice: 撒但
  rationale: 该词虽无冠词，并可泛指“敌对者”，但此处很可能作为具有位格的称号或名称使用；正文译作“撒但”，并以脚注保留真实的词义歧义。
- source_word: עַל יִשְׂרָאֵל
  choice: 攻击以色列
  rationale: 介词עַל与带敌意的语境结合，表示“敌对、攻击”；此译比直译“站在以色列之上”更符合现代汉语，同时保留敌对方向。
- source_word: וַיָּסֶת
  choice: 煽动
  rationale: סות的使役式表示怂恿、挑动某人采取行动；“煽动”清楚表达诱使和推动，但不暗示大卫受到无法抗拒的强迫。
- source_word: לִמְנוֹת
  choice: 数点
  rationale: מנה意为“数、计算”。“数点”在现代中文圣经叙事中清楚而庄重，也不把原文扩展为较具解释性的“进行人口普查”。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直称“以色列”，在这里以整个民族为被数点的对象；汉语译作“以色列人”可避免误解为土地，并自然表达原文所指。
theological_decisions:
- issue: שָׂטָן的身份与含义
  choice: 正文译作具有位格意味的“撒但”
  alternative: “一个敌对者”或“敌人”
  rationale: 该希伯来词既可作普通名词，指敌对者，也可作名称或称号。上下文较可能指撒但这一有位格的敌对者，但词汇歧义确实存在，因此不在正文中强行展开，而在脚注中保留另一译法。
- issue: 本节与撒母耳记下24:1所述煽动者之间的关系
  choice: 按历代志原文直陈撒但是直接行动者
  alternative: 以耶和华的怒气取代撒但，或将两处经文合并解释
  rationale: 撒母耳记下24:1把煽动与耶和华向以色列发怒联系起来，本节则指出撒但是直接行动者。译文不替作者消解两处经文之间的神学张力，只用脚注提示平行记载。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接叙事；“起来攻击”兼顾原文“站起来”与敌对含义；“数点”保持经文用语的简洁，不扩写为“人口普查”。所有脚注标记均置于正文相应词句之后。
