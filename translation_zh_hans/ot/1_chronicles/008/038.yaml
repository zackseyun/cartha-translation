base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
translation:
  language: zh_hans
  text: 亚悉有六个儿子[a]，他们的名字是：长子亚斯利干、以实玛利、示亚利雅、俄巴底雅和哈难。这些都是亚悉的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“归亚悉的有六个儿子。”希伯来文采用家谱中表示领属的句式。
    reason: 说明希伯来文领属存在句的较直译形式。
lexical_decisions:
- source_word: וּלְאָצֵל
  choice: 亚悉有
  rationale: 希伯来文用介词לְ构成家谱中的领属存在句；现代汉语自然表达为“亚悉有”，其较直译的形式见脚注。
- source_word: שִׁשָּׁה בָנִים
  choice: 六个儿子
  rationale: בָנִים在此家谱语境中指男性后代，译作“儿子”比泛称“孩子”准确。
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: 他们的名字是
  rationale: 保留原文第三人称复数领属后缀所表达的“他们的”，并采用自然的现代汉语列名句式。
- source_word: עַזְרִיקָם בֹּכְרוּ
  choice: 长子亚斯利干
  rationale: בֹּכְרוּ意为“他的长子”，所指为亚悉；汉语以“长子＋姓名”的次序清楚自然。
- source_word: יִשְׁמָעֵאל
  choice: 以实玛利
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: שְׁעַרְיָה
  choice: 示亚利雅
  rationale: 按希伯来文人名音译，并采用中文圣经中可辨识的形式。
- source_word: עֹבַדְיָה
  choice: 俄巴底雅
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: חָנָן
  choice: 哈难
  rationale: 按希伯来文人名音译。
- source_word: כָּל אֵלֶּה בְּנֵי אָצַל
  choice: 这些都是亚悉的儿子
  rationale: 自然地保留总结句，且将同一人名אָצֵל/אָצַל前后一致译为“亚悉”。
