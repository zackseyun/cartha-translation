- source_word: וּ/מִיכָאֵל
  choice: 还有米迦勒
  rationale: 专名按现代中文圣经中通行且易辨认的形式音译为“米迦勒”；前缀连词 וּ־ 结合本节承接上文名单的语境译为“还有”。
- source_word: וְ/יִשְׁפָּה
  choice: 伊施巴
  rationale: 按希伯来语辅音与元音形式音译，并采用自然的现代汉语专名形式；系列中的连词无需逐一重复。
- source_word: וְ/יוֹחָא
  choice: 约哈
  rationale: 按希伯来语 יוֹחָא 音译为“约哈”，既简洁又与常见中文音译习惯协调。
- source_word: בְּנֵי
  choice: 都是……的儿子
  rationale: 在家谱名单中，该词明确指男性子嗣；加入“都是”自然地表明前三人共同受此关系短语限定。
- source_word: בְרִיעָה
  choice: 比利亚
  rationale: 采用现代中文圣经中较通行、易辨认的专名音译。
