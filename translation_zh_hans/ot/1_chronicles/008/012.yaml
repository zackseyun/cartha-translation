base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
translation:
  language: zh_hans
  text: 以利巴力的儿子有希伯、米珊和示默。他[a]建造了阿挪、罗德，以及罗德所属的村庄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”最自然地指前面最后提到的示默；也有人认为这里较宽泛地指这个家系。
    reason: alternative_reading
  - marker: b
    text: “所属的村庄”直译为“她的女儿们”，是希伯来语表达，指一座城所辖或周围的村镇。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  choice: 以利巴力的儿子有
  rationale: בְנֵי 是“儿子”的复数构造形式，用来引出家谱名单；句首连接词在中文中不必机械译出。“有”使名单引介自然清楚。
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  choice: 希伯、米珊和示默
  rationale: 三个男性人名按希伯来语形式音译，并保留末项前连接词的列举关系。
- source_word: הוּא
  choice: 他[a]
  rationale: 这是第三人称阳性单数独立代词。最自然的先行词是名单末尾的示默，但原文只写“他”，因此正文保留代词，不把所指明确化。
- source_word: בָּנָה
  choice: 建造了
  rationale: בנה 的 Qal 完成式通常表示“建造”；原文没有足够依据将其具体化为“创建”或“重建”。
- source_word: אוֹנוֹ וְאֶת לֹד
  choice: 阿挪、罗德
  rationale: 两个地名依希伯来语音译；宾格标记 אֶת 不另行译出。
- source_word: וּבְנֹתֶיהָ
  choice: 以及罗德所属的村庄[b]
  rationale: 字面为“和她的女儿们”，是城镇及其附属聚落的希伯来语表达。阴性单数后缀最自然地回指罗德；中文补出“罗德”以避免“其”误指并列的两个城市。
theological_decisions:
- issue: הוּא（“他”）的所指
  choice: 正文保留“他”，脚注说明最自然地指示默
  alternative: 正文直接译作“示默”或理解为较宽泛地指这一家系
  rationale: 保留原文代词及其轻微歧义，不在正文中替作者明确所指。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述语体。人名和地名使用简明音译；正文保留代词歧义，并用脚注解释希伯来语城镇意象。
