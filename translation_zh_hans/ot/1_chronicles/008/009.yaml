  text: 他的妻子贺得为他生了约巴、洗比雅、米沙和玛拉干。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 此处为 ילד 的使役形叙事式，在家谱语境中指男子成为这些儿子的父亲；“生了”符合现代汉语家谱叙述习惯。
- source_word: מִן
  choice: 由
  rationale: 该介词在这里表示这些儿子出自其妻贺得，兼顾母系来源与自然的汉语表达；其具体关系仍有“由/从”的翻译余地，故加注说明。
- source_word: חֹדֶשׁ אִשְׁתּוֹ
  choice: 妻子贺得
  rationale: חֹדֶשׁ 在此为人名，按专名音译；אִשְׁתּוֹ 明确指“他的妻子”。汉语调整语序为“妻子贺得”。
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: 列出各人名，末项前用“和”连接
  rationale: 重复的直接宾语标记在汉语中无须逐一对应，以自然的并列名单表达其句法功能。
- source_word: יוֹבָב
  choice: 约巴
  rationale: 采用通行的中文圣经人名译法。
- source_word: צִבְיָא
  choice: 洗比雅
  rationale: 采用通行的中文圣经人名译法。
- source_word: מֵישָׁא
  choice: 米沙
  rationale: 采用通行的中文圣经人名译法。
- source_word: מַלְכָּם
  choice: 玛拉干
  rationale: 此词在家谱中用作人名，采用通行的中文圣经人名译法。
