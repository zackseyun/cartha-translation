lexical_decisions:
- source_word: נוֹחָה
  choice: 挪哈
  rationale: 专有男性人名，按希伯来语读音音译；采用简洁、自然的现代汉语译名形式。
- source_word: הָרְבִיעִי
  choice: 第四
  rationale: 带定冠词的序数词，在家谱名单中表示排行；现代汉语直接译作“第四”即可自然表达其功能。
- source_word: וְ
  choice: ，
  rationale: 希伯来语连词连接名单中的末一项；汉语列举人名与排行时以逗号衔接更自然，无须机械译出“和”。
- source_word: רָפָא
  choice: 拉法
  rationale: 专有人名，依希伯来语 רָפָא 音译；“拉法”准确反映其读音，也符合现代汉语圣经人名的表达习惯。
- source_word: הַחֲמִישִׁי
  choice: 第五
  rationale: 与前面的“第四”平行，表示家谱中的排行；译作“第五”简明且忠实。
