  yaml_path: translation/ot/1_chronicles/008/021.yaml
  text: Adaiah[a], Beraiah, and Shimrath, the sons of Shimei.
translation:
  language: zh_hans
  text: 亚大雅、比拉雅[a]和申拉，都是示每的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“比拉雅”；有些译本将这个名字简写为“比利亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדָיָה
  choice: 亚大雅
  rationale: 按希伯来语人名音译；采用现代中文圣经语境中自然、易辨认的形式。
- source_word: בְרָאיָה
  choice: 比拉雅
  rationale: 按辅音结构音译，并保留词中间的 א 所反映的音节，因此不简化为“比利亚”。
- source_word: שִׁמְרָת
  choice: 申拉
  rationale: 按希伯来语人名音译；末尾 ת 在此人名中以“拉”构成简洁自然的中文形式。
- source_word: בְּנֵי
  choice: 都是……的儿子
  rationale: 该词是“儿子”的复数附属形式，用于家谱关系；在列名之后译作“都是……的儿子”符合现代汉语表达。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 采用该希伯来人名在中文圣经传统中通行且易于识别的译名。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的家谱体表达。把共同的亲属关系置于三个人名之后，并用“都是”明确三人同为示每之子。英文咨询文本的脚注标记似乎误置于第一个名字之后；依据脚注内容及希伯来文，标记放在“比拉雅”之后。
