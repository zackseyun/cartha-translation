  text: 'And the sons of Micah: Pithon[a], Melech, Tarea, and Ahaz.'
translation:
  language: zh_hans
  text: 米迦的儿子是毗敦、米勒、他利亚[a]和亚哈斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个名字在9:41的希伯来文本中拼写略有不同。
    reason: 保留同一人名在希伯来文本中的拼写异文，避免在正文中将差异悄然抹平。
lexical_decisions:
- source_word: וּבְנֵי
  choice: 的儿子是
  rationale: 按家谱语境译为直接的父子关系；希伯来语连词承接上文，但现代汉语在独立节句中无需生硬译出“并且”。
- source_word: מִיכָה
  choice: 米迦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: פִּיתוֹן
  choice: 毗敦
  rationale: 按希伯来语人名音译，并采用中文圣经中的通行形式。
- source_word: וָמֶלֶךְ
  choice: 米勒
  rationale: 在家谱名单中 מֶלֶךְ 是人名，不译作普通名词“王”；连词按自然汉语名单格式处理。
- source_word: וְתַאְרֵעַ
  choice: 他利亚
  rationale: 按本节希伯来文本音译；其拼写与9:41所见形式略有差异，故以脚注说明。
- source_word: וְאָחָז
  choice: 亚哈斯
  rationale: 作为人名音译，采用中文圣经中的通行形式。
