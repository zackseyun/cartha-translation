  text: And the son of Jehonathan was Merib-baal[a], and Merib-baal fathered Micah.
translation:
  language: zh_hans
  text: 约拿单的儿子是米力巴力；米力巴力生了米迦[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 撒母耳记下9:12将此人的名字拼作 Mica（希伯来文：מִיכָא）；本节则拼作 Micah（希伯来文：מִיכָה）。两处中文均译作“米迦”。
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: ……的儿子是
  rationale: וְ承接前面的家谱，中文不必机械译作“和”；用分句自然延续谱系。בֵּן按亲子关系译为“儿子”。
- source_word: יְהוֹנָתָן
  choice: 耶何拿单
  rationale: 按本节较完整的希伯来名字形式音译，不将其默认为较短形式所常译的“约拿单”，以保留原文用名的特点。
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  choice: 米利巴力
  rationale: 这是同一个人的复合专名，虽在希伯来文中分写，中文合写为一个人名；两次出现均照译，以保留家谱的承接结构。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 使役词形在家谱语境中表示男子生育后代，即“作了……的父亲”；中文家谱惯用“生了”，简洁自然，并不表示由男性亲自分娩。
- source_word: אֶת מִיכָה
  choice: 米迦
  rationale: אֵת是直接宾语标记，不另译；מִיכָה按通行中文圣经人名译作“米迦”。
theological_decisions: []
