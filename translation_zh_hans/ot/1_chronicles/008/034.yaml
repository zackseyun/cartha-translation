  register: 采用简洁、庄重而自然的现代汉语家谱体。“生了”符合中文谱系表达。人名尽量反映本节希伯来文形式；脚注以拉丁字母补明两个近似名字在原文拼写上的差别，避免中文音译掩盖该差异。
