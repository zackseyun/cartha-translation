  text: וַֽ/יִּהְי֣וּ בְנֵי א֠וּלָם אֲנָשִׁ֨ים גִּבֹּרֵי חַ֜יִל דֹּ֣רְכֵי קֶ֗שֶׁת וּ/מַרְבִּ֤ים בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים מֵאָ֖ה וַ/חֲמִשִּׁ֑ים כָּל אֵ֖לֶּה מִ/בְּנֵ֥י בִנְיָמִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/040.yaml
  text: The sons of Ulam were mighty men of valor[a], drawers of the bow, and had many sons and grandsons, one hundred and fifty[c][b]. All these were from the sons of Benjamin.
translation:
  language: zh_hans
  text: 乌兰的儿子都是英勇善战的人，也都是弓箭手；他们有许多儿子和孙子，共一百五十人。[a]这些人全都是便雅悯的子孙。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“许多儿子和孙子，一百五十人”；这一百五十人看来是儿子和孙子的总数。
    reason: clarification
  - marker: b
    text: 或译：“这些人全都属于便雅悯的众子”，即便雅悯支派的后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אוּלָם
  choice: 乌兰的儿子都是
  rationale: 将系词与家谱构式自然译出；“都是”统摄后面的身份与特征描述，符合现代汉语。
- source_word: אֲנָשִׁים גִּבֹּרֵי חַיִל
  choice: 英勇善战的人
  rationale: 该惯用语强调勇力与作战能力；此译自然庄重，同时保留军事语境。
- source_word: דֹּרְכֵי קֶשֶׁת
  choice: 弓箭手
  rationale: 字面为“踩弓／张弓的人”，是指使用弓的战士；译作“弓箭手”准确而通顺。
- source_word: וּמַרְבִּים בָּנִים וּבְנֵי בָנִים
  choice: 他们有许多儿子和孙子
  rationale: 使役式分词在此表达子孙繁多；“儿子和孙子”清楚呈现 בנים 与 בני בנים 的家谱含义。
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: 共一百五十人
  rationale: “共”表明数字最自然地概括前述儿子和孙子的总数，并避免误解为只修饰孙子。
- source_word: כָּל אֵלֶּה מִבְּנֵי בִנְיָמִן
  choice: 这些人全都是便雅悯的子孙
  rationale: מן 加 בני 在此表示族系来源；用“便雅悯的子孙”保留家谱措辞并符合现代汉语。
theological_decisions:
- issue: 一百五十人的所指范围
  choice: 理解为儿子和孙子的合计人数
  alternative: 仅指孙子的人数
  rationale: 数字紧接“儿子和孙子”这一并列整体，最自然地作为两者的总数；正文以“共”表达，并以脚注保留原文简略并置的形式。
- issue: מִבְּנֵי בִנְיָמִן 的关系
  choice: 译作“便雅悯的子孙”，表示支派血统
  alternative: 译作“在便雅悯众子之中”
  rationale: 本节处于家谱总结语境，מן + בני 最自然地表明出自便雅悯的后裔，但原构式也可较形式化地理解为“属于便雅悯众子之列”。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述。“英勇善战的人”传达固定军事称谓的力度；“弓箭手”以自然汉语表达希伯来语“张弓的人”。所有脚注标记均置于相关正文之后。
