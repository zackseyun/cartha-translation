- source_word: וְ/חִזְקִי
  choice: 希西
  rationale: 这是带连接词的专名חִזְקִי；依其实际语音形式音译，并避免擅自等同于较熟悉但形式不同的“希西家”。
- source_word: וָ/חָבֶר
  choice: 希伯
  rationale: 这是带连接词的专名חָבֶר；采用中文圣经传统中简洁、可辨认的音译。
