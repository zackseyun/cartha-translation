  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
translation:
  language: zh_hans
  text: 比利亚和示玛是住在亚雅仑之人中的宗族首领[a]；正是他们赶走了[b]迦特的居民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“父家（或父系家族）的首领”，指以宗族、家族为基础的领袖。
    reason: cultural_note
  - marker: b
    text: 或译“使迦特的居民逃走”或“使迦特的居民逃离”。希伯来语动词着重表示使他们逃离；“赶走”则表达此处语境中可能产生的结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרִעָה וָשֶׁמַע
  choice: 比利亚和示玛
  rationale: 按希伯来语音译两个人名；句首连接词融入汉语并列结构，不另译“并且”，以保持自然的家谱叙述。
- source_word: הֵמָּה
  choice: 是；正是他们
  rationale: 希伯来语独立代词带强调意味。第一次依汉语句法自然表达，第二次译作“正是他们”，体现原文重复代词所加强的强调。
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 父系家族首领
  rationale: 该词组指以父系宗族为基础的家族领袖；这一译法兼顾古代社会结构与现代中文的可理解性。
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  choice: 亚雅仑居民中的
  rationale: 此处 לְ 表明他们与亚雅仑居民群体的归属或领导关系；“居民中的”较自然地表达他们是该群体内的首领，同时避免误解为仅仅替居民办事。
- source_word: הִבְרִיחוּ
  choice: 赶走
  rationale: ברח 的使役形表示使人逃离；“赶走”在语境中自然表达这一使役动作及其结果，同时以脚注保留更贴近动词形式的译法。
- source_word: אֶת יֹשְׁבֵי גַת
  choice: 迦特的居民
  rationale: 直译宾语词组，并与前文“居民”保持词汇对应。
