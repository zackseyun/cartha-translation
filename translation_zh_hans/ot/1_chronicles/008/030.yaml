  language: zh_hans
  text: 他的长子是亚伯顿[a]；还有苏珥、基士、巴力和拿答。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更形式对应地译作：“他的儿子：长子亚伯顿，以及苏珥、基士、巴力和拿答。”
    reason: 原文是名词短语式的家谱名单，未明说“是”；正文为符合现代汉语习惯而补出判断和衔接成分。
lexical_decisions:
- source_word: וּבְנוֹ
  choice: 他的……子
  rationale: וְ承接上文家谱，在现代汉语中无需生硬译作“并且”；בְנוֹ的第三人称单数后缀译为“他的”。
- source_word: הַבְּכוֹר
  choice: 长子
  rationale: 指按出生次序居首的儿子；“长子”是现代汉语家谱语境中自然、准确的表达。
- source_word: עַבְדּוֹן
  choice: 押顿
  rationale: 人名，采用中文圣经中通行的音译。
- source_word: וְצוּר
  choice: 其次是苏珥
  rationale: צוּר为人名，按通行译名译作“苏珥”；“其次是”自然衔接首名与其余名单，但不改变家谱次序。
- source_word: וְקִישׁ
  choice: 基士
  rationale: 人名，采用中文圣经中通行的音译。
- source_word: וּבַעַל
  choice: 巴力
  rationale: 此处在家谱名单中是人名，采用音译，不将其解释为神祇称号。
- source_word: וְנָדָב
  choice: 拿答
  rationale: 人名，采用中文圣经中通行的音译。
