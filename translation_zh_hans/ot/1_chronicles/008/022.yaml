lexical_decisions:
- source_word: יִשְׁפָּן
  choice: 伊施班
  rationale: 这是人名，按希伯来语形式音译；用“伊施班”既贴近原文读音，也符合现代中文圣经人名的表达习惯。
- source_word: עֵבֶר
  choice: 希伯
  rationale: 这是人名。原词起首为咽音字母ע；中文采用较为熟悉的传统音译“希伯”，脚注另列更贴近不带起首辅音读法的“以伯”。
- source_word: אֱלִיאֵל
  choice: 以利业
  rationale: 这是含神名成分的人名，依中文圣经通行形式音译，不在正文中翻译其词源意义。
- source_word: וְ / וָ / וֶ
  choice: 、；和
  rationale: 这些前缀均为连接名单各项的简单连词。中文列举时以前两项间用顿号、末项前用“和”，自然清楚。
