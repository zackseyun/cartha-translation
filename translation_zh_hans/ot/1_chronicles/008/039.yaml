    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: 儿子是
  rationale: בְנֵי是“儿子们”的构造形式；结合家谱体裁，用“……的儿子是”自然引出名单。词首连接词וּ־在中文家谱句式中不必机械译出，但以脚注保留其存在。
- source_word: עֵשֶׁק
  choice: 以设
  rationale: 作为人名音译；“以设”贴近希伯来语发音，并采用中文圣经人名的传统音译风格。
- source_word: אָחִיו
  choice: 他兄弟
  rationale: אָח通常指“兄弟”；后缀表示“他的”。保留原文代词所指的语境依赖性，不擅自补明其姓名。
- source_word: אוּלָם
  choice: 乌兰
  rationale: 按希伯来语人名音译，并采用自然、简洁的中文形式。
- source_word: בְּכֹרוֹ
  choice: 长子
  rationale: בְּכוֹר指头生的儿子；在列举儿子排行的家谱语境中，“长子”比“头生的”更自然，同时准确表达其排行。
- source_word: יְעוּשׁ
  choice: 耶乌施
  rationale: 依希伯来语辅音与元音音译，保留末尾š音。
- source_word: הַשֵּׁנִי
  choice: 次子
  rationale: 原文意为“第二个”；与前面的“长子”和后面的“三子”对应，中文家谱中用“次子”自然明确。
- source_word: וֶאֱלִיפֶלֶט
  choice: 以利法列
  rationale: 连接词引入名单末项；中文用逗号和并列结构表达。人名按希伯来语音译。
- source_word: הַשְּׁלִשִׁי
  choice: 三子
  rationale: 原文意为“第三个”；在儿子名单中译作“三子”，符合现代中文家谱表达。
