  text: 'The sons of Eshek his brother: Ulam his firstborn[a], Jeush the second, and Eliphelet the third.'
translation:
  language: zh_hans
  text: 他兄弟以实克的儿子是：长子乌兰，次子耶乌施，三子以利法列。[a]
  philosophy: optimal-equivalence
  footnotes:
