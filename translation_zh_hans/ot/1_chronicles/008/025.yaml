lexical_decisions:
- source_word: יִפְדְיָה
  choice: 伊弗底雅
  rationale: 希伯来人名按现代中文圣经常用音译原则处理，不翻译其词义。
- source_word: פניאל
  choice: 毗努伊勒
  rationale: 希伯来人名音译；本节马所拉文本的读音支持“Penuel”，中文采用与该读音相应且较为熟悉的形式“毗努伊勒”。
- source_word: בְּנֵי
  choice: 都是……的儿子
  rationale: 这是“儿子”的复数附属形式。原文为无动词的家谱短语，中文补出“都是”以清楚表达两人同为沙煞之子。
- source_word: שָׁשָׁק
  choice: 沙煞
  rationale: 专有名词按希伯来语辅音与读音音译，并采用简洁、适合中文人名的形式。
- source_word: וְ
  choice: 还有……、……
  rationale: 节首连接词承接上文家谱名单，译作“还有”比孤立的“和”更符合现代中文行文；第二个连接词以顿号体现并列。
