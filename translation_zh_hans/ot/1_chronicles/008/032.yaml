  yaml_path: translation/ot/1_chronicles/008/032.yaml
  text: Mikloth fathered Shimeah[a]. They too lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: zh_hans
  text: 米基录生了示米暗。他们也住在耶路撒冷，在弟兄们的对面[a]，与弟兄们[b]在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他们弟兄前面”或“靠近他们的弟兄”；这个希伯来语介词可以表示在某人前面、对面或附近。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”很可能指便雅悯族谱中的同族人或亲属，不一定仅指亲生兄弟。
    reason: cultural_note
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: 米基罗
  rationale: 按希伯来语人名音译；句首连接词 וּ 依中文族谱叙述习惯不单独译出，以免表达生硬。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 使役词形在族谱中表示生育、成为某人的父亲；“生了”简洁自然，并保留父系族谱的表达。
- source_word: אֶת שִׁמְאָה
  choice: 示米亚
  rationale: 不翻译直接宾语标记 אֶת；人名 שִׁמְאָה 按读音音译为“示米亚”。
- source_word: וְאַף הֵמָּה
  choice: 他们也
  rationale: 同时表达连接和增补强调之意，符合现代汉语习惯。
- source_word: נֶגֶד
  choice: 在……的对面
  rationale: 保留该介词主要的空间关系，可指在前面、相对或相近；正文采用具体而不过度解释的“对面”。
- source_word: אֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 直译亲属称谓；在本族谱语境中可广指同族或亲属，但不在正文中收窄或改写其含义。
- source_word: יָשְׁבוּ
  choice: 住
  rationale: 该动词在这里表示居住；采用清楚、现代的常用词。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 采用该地名的现代中文通行译法。
- source_word: עִם אֲחֵיהֶם
  choice: 与他们的弟兄同住
  rationale: 明确表达 עִם“与……一起”的意思，并保留希伯来文对“他们的弟兄”的重复，以呈现原文“在对面”与“同住”并置的张力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的族谱叙述。保留“在……对面”与“与……同住”的重复和并置，不替原文消除可能的空间含义张力；脚注标记放在各自所说明的词语之后。
