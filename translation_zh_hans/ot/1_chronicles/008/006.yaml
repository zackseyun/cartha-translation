base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
translation:
  language: zh_hans
  text: 以笏的儿子如下。这些人是住在迦巴之人的宗族首领[a]；他们把他们掳迁到玛拿辖[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族首领”直译为“父家之首”，指以共同祖先为纽带的宗族或祖家领袖。
    reason: cultural_note
  - marker: b
    text: “掳迁”指强制使人离开原居地、迁往别处。原文只用“他们”指称主语和宾语，未明确说明其具体所指。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 如下
  rationale: 在族谱段落中自然引出名单；希伯来语开头的连接词在中文不必机械译为“和”。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 保留族谱用语；在此类上下文中也可能广义包括后裔。
- source_word: אֵחוּד
  choice: 以笏
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: אֵלֶּה הֵם
  choice: 这些人是
  rationale: 保留原文带强调和复指色彩的表达，同时符合现代汉语习惯。
- source_word: רָאשֵׁי אָבוֹת
  choice: 宗族首领
  rationale: 该短语指父系祖家或宗族单位的领袖；“宗族首领”比直译“父家之首”更清楚自然。
- source_word: לְיֹשְׁבֵי גֶבַע
  choice: 迦巴居民的
  rationale: 将介词 לְ 理解为所属或关联，表示这些首领属于迦巴居民群体。
- source_word: גֶבַע
  choice: 迦巴
  rationale: 采用现代中文圣经地名的通行音译，并与“基遍”等近似地名区分。
- source_word: וַיַּגְלוּם
  choice: 他们把那些居民迁徙
  rationale: 使役形态表示使人离开原居地、被迁走；“迁徙”保留被迫离乡的含义，而脚注说明也可更强地译为“掳迁”。宾语代词的具体所指由上下文推定为迦巴居民。
- source_word: אֶל מָנָחַת
  choice: 到玛拿辖
  rationale: 按方向介词翻译，并采用该地名的通行中文音译。
