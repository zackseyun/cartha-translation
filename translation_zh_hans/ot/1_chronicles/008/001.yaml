  text: וּ/בִ֨נְיָמִ֔ן הוֹלִ֖יד אֶת בֶּ֣לַע בְּכֹר֑/וֹ אַשְׁבֵּל֙ הַ/שֵּׁנִ֔י וְ/אַחְרַ֖ח הַ/שְּׁלִישִֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/001.yaml
  text: Benjamin fathered Bela his firstborn[a], Ashbel the second, and Aharah the third.
translation:
  language: zh_hans
  text: 便雅悯生了长子比拉、次子亚实别和三子亚哈拉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚哈拉”按本节希伯来文本音译；有些译本作“亚赫拉”。
    reason: 说明人名音译差异，同时正文遵从马所拉文本本节的读法。
lexical_decisions:
- source_word: וּבִנְיָמִן
  choice: 便雅悯
  rationale: 采用现代中文圣经传统中通行的人名译法；句首连接词וּ在连续家谱叙述中由上下文自然体现，不另译“又”。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 该词在父系家谱中表示生育、成为父亲；“生了”是现代中文家谱表达中自然简明的译法。
- source_word: אֶת
  choice: 不单独译出
  rationale: 希伯来语直接宾语标记在中文中没有对应的独立词，由语序表达。
- source_word: בֶּלַע
  choice: 比拉
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: בְּכֹרוֹ
  choice: 长子
  rationale: 直接表达“他的头生者”及出生次序；与下文“次子、三子”形成自然、清楚的中文列举结构。
- source_word: אַשְׁבֵּל
  choice: 亚实别
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: הַשֵּׁנִי
  choice: 次子
  rationale: 结合家谱语境，将“第二”自然译为“次子”，保留出生次序。
- source_word: וְאַחְרַח
  choice: 和三子亚哈拉
  rationale: 连接词译为“和”；人名按马所拉文本的辅音与元音音译为“亚哈拉”。
- source_word: הַשְּׁלִישִׁי
  choice: 三子
  rationale: 结合家谱语境，将“第三”自然译为“三子”，与“长子、次子”平行。
theological_decisions: []
