  text: 还有沙姆示莱、示哈利雅和亚他利雅。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁמְשְׁרַי
  choice: 珊示莱
  rationale: 这是家谱中的男性人名，按希伯来语读音音译；采用易于现代普通话读者辨认和朗读的形式。
- source_word: שְׁחַרְיָה
  choice: 示哈利雅
  rationale: 这是专名，按希伯来语音译，并以“雅”反映词尾的神名成分־יָה；不在正文中解释其可能含义。
- source_word: עֲתַלְיָה
  choice: 亚他利雅
  rationale: 这是专名，采用现代中文圣经语境中自然、稳定的音译形式，并保留词尾“雅”。
- source_word: וְ / וּ / וַ
  choice: 还有……、……和……
  rationale: 这些前缀连词均为连接名单成员的 waw。中文不必在每个人名前机械重复“和”；用“还有”承接上文，并以顿号及末项前的“和”自然保留并列关系。
theological_decisions: []
translation_notes:
  register: 采用简洁庄重的现代标准汉语家谱体。经文是上一节名单的延续，因此以“还有”起句；人名间使用中文列举标点，使表达自然清楚。
