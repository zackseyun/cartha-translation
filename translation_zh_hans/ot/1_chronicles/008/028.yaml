  yaml_path: translation/ot/1_chronicles/008/028.yaml
  text: These were heads of fathers’ houses according to their generations[a], chief men. These lived in Jerusalem.
translation:
  language: zh_hans
  text: 这些人按世系，是各父系家族的首领，都是首领。这些人住在耶路撒冷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי אָבוֹת
  choice: 各父系家族的首领
  rationale: 该结构直译为“父辈的首领”，在历代志的家谱语境中指父系宗族或家族单位的负责人；此译既保留父系家族的社会结构，也符合现代汉语。
- source_word: לְתֹלְדוֹתָם
  choice: 按着世系
  rationale: תולדות在此表示世代、谱系或血统排列。“按着世系”保留家谱含义，却不额外断定所依据的是书面家谱记录。
- source_word: רָאשִׁים
  choice: 族长
  rationale: 原文再次使用与“首领”同根的词，强调这些人的领导地位。正文用“族长”自然表达其身份，脚注说明原文的重复。
- source_word: יָשְׁבוּ
  choice: 住
  rationale: 该动词在此表示居住，而不是坐下；“住”简洁、自然，并符合家谱记述的语体。
- source_word: בִירוּשָׁלָם
  choice: 在耶路撒冷
  rationale: 按标准地名译法保留介词所表达的位置关系。
- source_word: אֵלֶּה ... אֵלֶּה
  choice: 这些人……这些人
  rationale: 保留原文两次指示代词所形成的结构性强调，虽略显重复，却适合庄重的家谱文体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的家谱记述语体。“父系家族”比字面的“父家”更容易为普通读者理解；保留两次“这些人”，以反映希伯来文的篇章结构。
