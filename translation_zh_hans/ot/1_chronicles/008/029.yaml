  yaml_path: translation/ot/1_chronicles/008/029.yaml
  text: In Gibeon lived the father of Gibeon[a], and his wife’s name was Maacah.
translation:
  language: zh_hans
  text: 在基遍居住的有基遍之父[a]，他的妻子名叫玛迦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基遍的奠基者”或“基遍的首领”；希伯来文直译为“基遍之父”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/גִבְעוֹן
  choice: 在基遍
  rationale: 前缀包含连词和介词，直译为“并且在基遍”。本节承接上下文时，现代汉语可省略“并且”，保留地点含义即可。
- source_word: יָשְׁבוּ
  choice: 居住的有
  rationale: ישׁב在此表示居住。原文动词为复数，虽然后接单数称谓，可能是沿用平行段落的措辞；译文用“居住的有”自然表达存在和居住，而不强行修正这一数的不协调。
- source_word: אֲבִי גִבְעוֹן
  choice: 基遍之父
  rationale: 构词短语直译为“基遍之父”。在族谱和地名语境中，“父”也可能指奠基者或首领；正文保留原文表达，脚注列出可能含义。
- source_word: וְ/שֵׁם אִשְׁתּוֹ
  choice: 他的妻子名叫
  rationale: 原文直译为“他妻子的名字”，汉语用“他的妻子名叫”更自然，并完整保留所属关系。
- source_word: מַעֲכָה
  choice: 玛迦
  rationale: 按中文圣经人名的通行音译处理。
