base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/007.yaml
  text: and Naaman[a], Ahijah[b], and Gera—he carried them into exile and fathered Uzza and Ahihud.
translation:
  language: zh_hans
  text: 乃缦、亚希雅和基拉；他[a]将他们放逐[b]，又生了乌撒和亚希忽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”在语法上是单数，最自然地指基拉；不过，这一段家谱的文本和句法较难确定。
    reason: 代词所指存在真实的句法歧义。
  - marker: b
    text: 也可译作“使他们流亡”或“把他们迁走”。原文动词是使役形式，意思是“使他们进入流亡”。
    reason: 说明使役动词的词义范围及可行译法。
lexical_decisions:
- source_word: נַעֲמָן
  choice: 乃缦
  rationale: 人名采用现代中文圣经读者较熟悉的传统音译。
- source_word: אֲחִיָּה
  choice: 亚希雅
  rationale: 按希伯来语人名音译，并采用自然、通行的简体中文形式。
- source_word: גֵרָא
  choice: 基拉
  rationale: 人名音译，不赋予词义解释。
- source_word: הוּא
  choice: 他
  rationale: 保留希伯来语独立单数代词，不在正文中强行确定所指。
- source_word: הֶגְלָם
  choice: 使他们被迁徙流亡
  rationale: 该词为גלה的使役式，并带第三人称复数宾语后缀；此译法同时保留使役意义、复数宾语和流亡含义。
- source_word: וְהוֹלִיד
  choice: 又生了
  rationale: 在家谱语境中，ילד的使役式表示男性生育后代；“生了”简洁自然，也符合现代中文家谱表达。
- source_word: עֻזָּא
  choice: 乌撒
  rationale: 采用通行的中文人名音译。
- source_word: אֲחִיחֻד
  choice: 亚希忽
  rationale: 采用通行的中文人名音译。
theological_decisions:
- issue: “他”所指的人物
  choice: 正文保留代词“他”，脚注说明最自然地指基拉
  alternative: 直接译为“基拉使他们被迁徙流亡”
  rationale: 希伯来语使用单数代词而未重复姓名；基拉是最近且最自然的先行词，但本段家谱在文本和句法上存在困难，因此不宜在正文中完全消除歧义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“迁徙流亡”避免古雅的“被掳去”，并明确表达原文使役式；分号保留名单与后续叙述之间突兀但真实的句法转折。
