  text: and Jeuz[a], and Sachia, and Mirmah. These were his sons, heads of fathers’ houses.
translation:
  language: zh_hans
  text: 又有耶乌斯、撒迦雅和米玛；这些人都是他的儿子，是父系家族的首领[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宗族首领”。希伯来文直译为“父亲们的首领”，是指祖传家族或家族群体的领袖。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְעוּץ
  choice: 耶乌斯
  rationale: 人名按希伯来语音译；采用简明、常见的现代汉语译名形式。
- source_word: שָׂכְיָה
  choice: 撒迦雅
  rationale: 人名按马所拉文本的辅音和元音音译，不将其作普通词解释。
- source_word: מִרְמָה
  choice: 米玛
  rationale: 此处在家谱中明确是人名，因此按音译处理，不按同形普通名词“诡诈”等词义意译。
- source_word: בָנָיו
  choice: 他的儿子
  rationale: בנים在此为阳性复数，且用于家谱语境，译作“儿子”比泛称“儿女”更准确。
- source_word: רָאשֵׁי אָבוֹת
  choice: 各父系家族的首领
  rationale: 该短语直译近似“父亲们的首领”，在家谱和支派语境中指以父系祖先为纽带的家族单位之首领；此译既表达其惯用含义，也保留父系家族的色彩。
