  footnotes:
  - marker: a
    text: 希伯来原文没有“都是”这个词，直译为“伊施米莱、伊斯利亚和约巴，以利巴力的儿子”；正文补出“都是”，使中文家谱句式自然清楚。
    reason: lexical_alternative
