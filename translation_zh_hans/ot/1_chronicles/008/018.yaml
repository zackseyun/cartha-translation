  rationale: 采用中文圣经传统中通行且简明的音译形式。
- source_word: בְּנֵי
  choice: 都是……的儿子
  rationale: 原词是“儿子”的复数附属形式。中文补出判断成分“都是”，清楚表达三人与以利巴力的父子关系。
- source_word: אֶלְפָּעַל
  choice: 以利巴力
  rationale: 采用中文圣经传统中易于识别的音译，表达该专有名词而不解释其可能的词源含义。
