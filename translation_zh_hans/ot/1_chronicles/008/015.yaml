- source_word: וּ/זְבַדְיָה
  choice: 还有西巴第雅
  rationale: 前缀 וּ 表示连接；结合本节承接上文名单的语境，译作“还有”。人名 זְבַדְיָה 按现代中文圣经中通行的音译形式译为“西巴第雅”。
- source_word: וַ/עֲרָד
  choice: 亚拉得
  rationale: וַ 是名单中的连接词，中文以顿号式列举结构表达，不逐一机械重复“和”；עֲרָד 音译为“亚拉得”。
- source_word: וָ/עָדֶר
  choice: 和亚得
  rationale: וָ 连接名单最后一项，译作“和”；עָדֶר 依希伯来语辅音及元音音译为“亚得”，并以脚注保留另一种较贴近字母对应的音译。
