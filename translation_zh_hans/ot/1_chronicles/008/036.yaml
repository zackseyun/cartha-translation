base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/036.yaml
  text: Ahaz fathered Jehoaddah[a], and Jehoaddah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: zh_hans
  text: 亚哈斯生耶何阿达[a]；耶何阿达生亚拉篾、押斯玛弗和心利；心利生摩撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“耶何阿达”；有些英文译本作“耶何阿大”。
    reason: 说明马所拉文本中人名的形式，并忠实反映英文审校记录所列的替代译名；不对该替代形式的文本来源作未经证实的说明。
lexical_decisions:
- source_word: הוֹלִיד
  choice: 生
  rationale: 在家谱语境中，此词表示成为某人的父亲或使家系延续。中文家谱惯用“生”，简洁自然，并保留直接父系关系的表达。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，现代汉语中没有对应的独立词，其句法功能由语序体现。
- source_word: יְהוֹעַדָּה
  choice: 耶何阿达
  rationale: 按所提供的马所拉文本音译，保留词尾的辅音特征；脚注说明其他传统中的异读。
- source_word: עָלֶמֶת
  choice: 亚勒篾
  rationale: 依希伯来语人名音译，并采用现代中文圣经人名常见的庄重音译风格。
- source_word: עַזְמָוֶת
  choice: 押玛非
  rationale: 依希伯来语辅音和传统中文圣经人名形式音译。
- source_word: זִמְרִי
  choice: 心利
  rationale: 采用中文圣经中该希伯来人名的通行译名，两处保持一致。
- source_word: מוֹצָא
  choice: 摩撒
  rationale: 依希伯来语人名音译，采用中文圣经中常见的形式。
- source_word: וְ
  choice: 并列衔接，以顿号、分号或省略连接词体现
  rationale: 希伯来语连词连接家谱中的人物及世代；现代汉语以顿号列举，以分号划分世代，比逐一译作“和”更自然，同时不额外解释时间或逻辑关系。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的中文家谱体。“生”延续汉语家谱的自然表达；人名以常见中文圣经音译为主。分号清楚区分各代，顿号用于同代子嗣的列举。
