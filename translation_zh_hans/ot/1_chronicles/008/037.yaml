  source_fidelity: 原文在“比尼亚”之后以连续的“他的儿子”标示逐代世系：拉法为比尼亚之子，以利亚撒为拉法之子，亚悉为以利亚撒之子。草稿逐次使用“他的儿子”在理论上可按最近先行词理解，但现代汉语中代词指向不够稳固，未能清楚呈现这条逐代链条。
  naturalness: “拉法是他的儿子，以利亚萨是他的儿子，亚悉是他的儿子”重复而生硬，且“他的”连续出现会造成指代负担。改为明确的属格家谱句式，简洁、庄重且符合现代中文圣经家谱表达。
  terminology: “摩撒、比尼亚、拉法、亚悉”可保留。אֶלְעָשָׂה宜作中文圣经中更通行、也更贴近末尾ע的“以利亚撒”，不宜作“以利亚萨”。“生”在父系家谱语境中自然准确。
