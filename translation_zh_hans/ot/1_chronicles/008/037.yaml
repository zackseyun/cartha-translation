  yaml_path: translation/ot/1_chronicles/008/037.yaml
  text: And Moza fathered Binea; Rephah was his son, Eleasah his son, Azel his son.
translation:
  language: zh_hans
  text: 摩撒生比尼亚；比尼亚的儿子是拉法；拉法的儿子是以利亚撒；以利亚撒的儿子是亚悉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מוֹצָא
  choice: 摩撒
  rationale: 连词 וּ 在连续家谱中主要起承接作用，中文无需机械译出“并且”；人名 מוֹצָא 按现代中文圣经常用形式音译为“摩撒”。
- source_word: הוֹלִיד
  choice: 生
  rationale: 使役词形在家谱语境中表示“生下、成为……的父亲”。“生”简洁自然，也符合中文家谱的惯用表达。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，现代汉语没有对应的独立词，由语序体现其句法功能。
- source_word: בִּנְעָא
  choice: 比尼亚
  rationale: 按希伯来语读音音译人名，并采用现代中文圣经中易辨认的形式。
- source_word: רָפָה
  choice: 拉法
  rationale: 按希伯来语读音音译，并采用中文读者熟悉的人名形式。
- source_word: בְנ/וֹ
  choice: 是他的儿子
  rationale: 原文反复使用“他的儿子”串联世系。中文补出“是”可清楚表明父子关系；重复“他的”则保留原文逐代承接的结构。
- source_word: אֶלְעָשָׂה
  choice: 以利亚萨
  rationale: 按希伯来语音节音译，兼顾原名结构与中文既有译名传统。
- source_word: אָצֵל
  choice: 亚悉
  rationale: 采用中文圣经传统中通行且易辨认的音译形式。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代家谱体。首句用“生”，随后三次以“是他的儿子”明确逐代父子关系，既贴近希伯来原文的重复结构，也避免中文读者误解各名字之间的关系。
