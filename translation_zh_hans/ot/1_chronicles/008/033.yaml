base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: zh_hans
  text: 尼珥生基士，基士生扫罗，扫罗生约拿单、麦基舒亚、亚比拿达和伊施巴力[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伊施巴力在《撒母耳记下》中称为“伊施波设”。
    reason: 说明同一人物在另一卷书中的不同姓名形式。
lexical_decisions:
- source_word: הוֹלִיד
  choice: 生
  rationale: 在家谱语境中，这个使役形动词表示男性亲系中的生育关系。“生”是现代中文家谱常用且简洁庄重的表达，保留了原文反复出现的家谱句式。
- source_word: נֵר
  choice: 尼珥
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: קִישׁ
  choice: 基士
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用现代中文读者熟悉的通行译名。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 原文此处是较完整的名字形式，但指扫罗之子；采用中文圣经中通行且明确的译名“约拿单”。
- source_word: מַלְכִּי שׁוּעַ
  choice: 麦基舒亚
  rationale: 采用中文圣经传统中通行的复合人名音译，直接反映原文所载姓名。
- source_word: אֲבִינָדָב
  choice: 亚比拿达
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: אֶשְׁבָּעַל
  choice: 伊施巴力
  rationale: 直接音译《历代志》希伯来文本中的姓名，不在正文中与《撒母耳记》的另一名称形式协调；“巴力”也保留了名字末尾 בַּעַל 的可辨识形式。
theological_decisions:
- issue: 扫罗最后一位儿子的姓名形式
  choice: 正文采用“伊施巴力”
  alternative: 伊施波设
  rationale: 这属于姓名文本形式而非教义分歧。《历代志》的希伯来文本明确作 אֶשְׁבָּעַל，因此正文按原文译作“伊施巴力”；《撒母耳记》中的“伊施波设”留在脚注中，帮助读者辨认同一人物，同时不混同两种名称形式。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留希伯来家谱连续重复“生”的节奏。人名依中文圣经的通行形式音译；脚注标记紧随其所说明的“伊施巴力”之后。
