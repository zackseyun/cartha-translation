  text: And by Hushim he fathered Abitub and Elpaal[a].
translation:
  language: zh_hans
  text: 他又由户伸生了亚比突和以利巴力。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他又从户伸生了亚比突和以利巴力。”希伯来语介词可直译为“从”；在家谱语境中，“由户伸”表示这些儿子是他经由户伸所生。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֻשִׁים
  choice: 又从户伸
  rationale: וּ承接上文，以“又”保持家谱叙述的连贯；מִן本义为“从”，此处表示后代由户伸所生。中文“从户伸生了”既自然，也保留了介词的来源含义。
- source_word: הוֹלִיד
  choice: 生了
  rationale: ילד的使役式在家谱中表示“生、成为……的父亲”。现代中文家谱语境用“生了”简洁自然；主语的父系身份由上下文确定。
- source_word: אֶת
  choice: 不单独译出
  rationale: 希伯来语直接宾语标记，在中文中没有对应的独立词。
- source_word: אֲבִיטוּב
  choice: 亚比突
  rationale: 按希伯来语人名音译，并采用现代中文圣经中易于辨识的常见形式。
- source_word: וְ/אֶת
  choice: 和
  rationale: וְ译为“和”，连接两个直接宾语；אֶת不单独译出。
- source_word: אֶלְפָּעַל
  choice: 以利巴力
  rationale: 按希伯来语人名音译，并采用现代中文圣经中易于辨识的常见形式。
