base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
translation:
  language: zh_hans
  text: 沙哈连遣走他的妻子户伸和巴拉[b]以后，在摩押地[a]得了儿女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在摩押的乡野”，或“在摩押境内”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“从他遣走她们时起”；这里很可能是“在他遣走她们以后”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׁחֲרַיִם
  choice: 沙哈连
  rationale: וְ承接家谱脉络，中文无需机械译出“和”；人名采用现代中文圣经中较熟悉的音译“沙哈连”。
- source_word: הוֹלִיד
  choice: 生了儿子
  rationale: 希伯来语使役形在家谱中表示“生育、成为父亲”；下一节列出其众子，因此译作“生了儿子”自然且符合上下文。
- source_word: בִּ/שְׂדֵה מוֹאָב
  choice: 在摩押地
  rationale: שָׂדֶה本义为“田野”，在地理表达中可指一地的乡野或境域；正文采用自然的“摩押地”，脚注保留较直译的可能。
- source_word: מִן שִׁלְח/וֹ אֹתָם
  choice: 把……遣走以后
  rationale: מִן接不定式结构在此最可能表达时间先后，即“遣走以后”；“遣走”保留שלח的动作含义，不进一步断定其法律意义必为离婚。
- source_word: חוּשִׁים
  choice: 户伸
  rationale: 按专名音译，并采用较熟悉的中文圣经译名。
- source_word: וְ/אֶת בַּעֲרָא
  choice: 和巴拉
  rationale: אֵת是直接宾语标记，不单独译出；וְ连接第二个人名，译为“和”。
- source_word: נָשָׁיו
  choice: 他的妻子
  rationale: נָשָׁיו在此明确指沙哈连的妻子们；中文以“他的妻子户伸和巴拉”自然表达希伯来语后置同位关系。
theological_decisions:
- issue: “遣走”是否明确指离婚
  choice: 保留为“遣走”
  alternative: 译作“休了”或“离弃”
  rationale: 原文使用שלח，虽可能指休妻，却未明确采用法律术语；正文不把可能的婚姻解除状态说得过死。
translation_notes:
  register: 采用简洁、庄重而自然的现代普通话。调整希伯来语语序，把妻子的身份放在人名前，并将时间从句置于地点和生育动作之前，以避免中文歧义；同时用脚注保存原文地理词和时间结构的译法空间。
