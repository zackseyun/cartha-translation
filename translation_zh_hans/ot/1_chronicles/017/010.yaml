  text: וּ/לְ/מִ/יָּמִ֗ים אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הִכְנַ֖עְתִּי אֶת כָּל אוֹיְבֶ֑י/ךָ וָ/אַגִּ֣ד לָ֔/ךְ וּ/בַ֖יִת יִֽבְנֶה לְּ/ךָ֥ יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/010.yaml
  text: from the days when I appointed judges over my people Israel. And I will subdue all your enemies. Moreover[a], I tell you that Yahweh will build you a house.
translation:
  language: zh_hans
  text: 自从我为我子民以色列设立士师的日子以来——我要制伏你所有的仇敌。我又向你宣告：耶和华必为你建造一个家[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”原文可指“家”或“房屋”；在这里指耶和华要为大卫建立延续的王室，即王朝。
    reason: 保留 בַּיִת 与“建造”的文字呼应，同时说明其在此语境中的王朝含义。
lexical_decisions:
- source_word: וּלְמִיָּמִים
  choice: 自从……的日子以来
  rationale: 保留其时间起点的表达，并用现代汉语自然呈现；原文在此承接上节，因此独立成节时仍略带续接意味。
- source_word: אֲשֶׁר צִוִּיתִי שֹׁפְטִים
  choice: 我……设立士师
  rationale: צוה 在这里指上帝委任士师治理以色列，而不只是向士师发出命令；“设立”符合历史语境。
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: 为我的子民以色列
  rationale: עַל 在此涉及士师与以色列的治理关系；汉语“为……设立士师”自然，同时保留“我的子民以色列”这一重要称谓。
- source_word: וְהִכְנַעְתִּי
  choice: 我要制伏
  rationale: 该形式在应许的语境中具有将来指向；“制伏”适合以仇敌为宾语。
- source_word: אֶת כָּל אוֹיְבֶיךָ
  choice: 你所有的仇敌
  rationale: 准确保留 כָּל 所表达的全称范围。
- source_word: וָאַגִּד לָךְ
  choice: 我又向你宣告
  rationale: נגד 在这里引出郑重的神圣宣告；“又”体现话语推进，“宣告”保留其庄重语气。
- source_word: וּבַיִת יִבְנֶה לְּךָ יְהוָה
  choice: 耶和华必为你建造家室
  rationale: 保留 בַּיִת 与“建造”的搭配及其家族、王室含义，尽可能传达圣殿与大卫王朝之间的文字呼应，而不直接改译为“建立王朝”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的专名形式，区别于一般称号“主”。
theological_decisions:
- issue: 末句“家”的含义
  choice: 正文译作“家室”，不直接解释为“王朝”
  alternative: 耶和华必为你建立王朝
  rationale: בַּיִת 在大卫之约的语境中兼有房屋、家族和王室延续的意蕴。正文保留形象，脚注说明其王朝所指，避免在翻译中消除原文的文字呼应。
- issue: 制伏仇敌的时态
  choice: 译为将来的应许“我要制伏”
  alternative: 我已经制伏
  rationale: 该动词形式处于连续的应许话语中，理解为将来行动最符合上下文，但其完成式形态带有应许确定性的色彩。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“我的子民以色列”“制伏”“宣告”等表达保留盟约话语的郑重感；首句承接上一节，故保留原文略显续接的句法。
