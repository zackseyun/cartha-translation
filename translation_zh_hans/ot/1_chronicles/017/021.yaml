  to: 地上有哪一国像你的子民以色列呢？神曾前去救赎他们，归给自己作子民；又为你自己立名，行大而可畏的事，从你从埃及救赎出来的子民面前赶逐列国[a]。[b]
  rationale: 修订去除对“一国”的“独一”解释及对神行动的“亲自”增补；调整开头为自然的比较反问。将“为自己建立名声”改为“为你自己立名”，较贴近原文第二人称的祷告体，同时保留其建立声名的含义。末段保留“从……子民面前赶逐列国”的原有歧义，并以脚注说明。
