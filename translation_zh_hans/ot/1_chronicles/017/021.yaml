  text: וּ/מִי֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁר֩ הָלַ֨ךְ הָ/אֱלֹהִ֜ים לִ/פְדּ֧וֹת ל֣/וֹ עָ֗ם לָ/שׂ֤וּם לְ/ךָ֙ שֵׁ֚ם גְּדֻלּ֣וֹת וְ/נֹרָא֔וֹת לְ/גָרֵ֗שׁ מִ/פְּנֵ֧י עַמְּ/ךָ֛ אֲשֶׁר פָּדִ֥יתָ מִ/מִּצְרַ֖יִם גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/021.yaml
  text: And who is like your people Israel[a], one nation on the earth, whom God went to redeem for himself as a people, to make for yourself a name by great and fearsome deeds, driving out nations from before your people[b], whom you redeemed from Egypt?
translation:
  language: zh_hans
  text: 地上有哪一国像你的子民以色列呢？神曾前去救赎他们，归给自己作子民；又为你自己立名，行大而可畏的事，从你从埃及救赎出来的子民面前赶逐列国[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“行伟大而令人敬畏的事”。“可畏”包含令人敬畏和震惧的意味。
    reason: 说明גְּדֻלּוֹת וְנוֹרָאוֹת的可行替代译法及语义范围。
  - marker: b
    text: 希伯来原文直译为：“从你从埃及救赎出来的子民面前赶逐列国。”本句末尾的词序和句法关系较难；由于《撒母耳记下》7:23的平行经文在文本上也有困难，有人作不同理解。
    reason: 保留原文末段的句法和与平行经文相关的文本不确定性。
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ יִשְׂרָאֵל
  choice: 有谁像你的子民以色列
  rationale: 保留מִי的‘谁’以及比较结构，突出以色列是神的子民；用反问句呈现原文语气。
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: 地上……独一的国
  rationale: אֶחָד基本义为‘一’，在比较语境中表达无可相比、独一无二；不将בָּאָרֶץ窄化为某一片‘土地’。
- source_word: אֲשֶׁר הָלַךְ הָאֱלֹהִים
  choice: 神曾亲自去
  rationale: 保留הלך所表达的主动、决然行动及其拟人化色彩；‘亲自’使现代汉语自然，但不另加行动内容。
- source_word: לִפְדּוֹת לוֹ עָם
  choice: 救赎他们，使他们归给自己作子民
  rationale: פדה译为‘救赎’；将目的和结果明确表达为归神作子民，同时不改变其圣约关系。
- source_word: לָשׂוּם לְךָ שֵׁם
  choice: 为自己建立名声
  rationale: 这是希伯来语表示建立声名、彰显威名的惯用表达；‘建立名声’在现代汉语中庄重自然。
- source_word: גְּדֻלּוֹת וְנוֹרָאוֹת
  choice: 伟大可畏的事
  rationale: 保留两个形容词的力度；‘可畏’兼具令人敬畏与惧怕的含义，避免将נוֹרָאוֹת弱化为一般的‘奇妙’。
- source_word: לְגָרֵשׁ מִפְּנֵי עַמְּךָ
  choice: 从你……的子民面前赶走
  rationale: 保留לְגָרֵשׁ的驱逐含义及מִפְּנֵי的空间性希伯来表达。
- source_word: אֲשֶׁר פָּדִיתָ מִמִּצְרַיִם
  choice: 蒙你从埃及救赎出来的
  rationale: 保持对神的第二人称直接称呼，并明确救赎的出发地是埃及。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 准确体现无冠词复数，并以圣经汉语中自然而庄重的‘列国’表达被赶逐的多个民族或国家。
theological_decisions:
- issue: 神借救赎行动为自己建立名声
  choice: 你又借着……为自己建立名声
  alternative: 使你得着名声
  rationale: 原文明说这些行动建立神自己的名声；译文保留神主动彰显其声名的表述，不加以淡化或套入后来的神学体系。
- issue: נוֹרָאוֹת所表达的敬畏与惧怕
  choice: 可畏
  alternative: 令人敬畏；可怕
  rationale: ‘可畏’同时保留神圣行动令人敬畏和震惧的张力；‘可怕’容易只传达负面恐惧，‘令人敬畏’则可能削弱其强烈程度。
- issue: 第三人称‘神’转为第二人称‘你’
  choice: 保留人称转换
  alternative: 全句统一译为第二人称
  rationale: 希伯来原文先说‘神曾去’，随后在祷告中直接称‘你’；保留转换可忠实呈现原文修辞，而不擅自整齐化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。反问句保留祷告中的赞叹语气；‘救赎、子民、列国、可畏’具有经文语域，但仍为普通读者所能理解。脚注标记均置于对应正文位置。
