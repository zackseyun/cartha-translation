  text: What more can David add before you for honoring your servant? You know your servant.
translation:
  language: zh_hans
  text: 因你尊荣你的仆人[b]，大卫还能向你再说什么呢[a]？你认识你的仆人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说”是按语意补出的。希伯来文直译近于“大卫还能向你再加添什么呢？”
    reason: lexical_alternative
  - marker: b
    text: “因你尊荣你的仆人”所译的希伯来文短语含义较难确定，也可理解为“为了你仆人的尊荣”或“要尊荣你的仆人”。
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: 什么
  rationale: 引出反问句；“还能……什么呢”自然传达希伯来语的修辞语气。
- source_word: יוֹסִיף עוֹד
  choice: 还能……再说
  rationale: 字面义为“还要再加添”。本节语境涉及大卫向上帝陈言，汉语用“再说”才自然；“说”属于为明确省略成分而作的最小补充，并以脚注说明。
- source_word: דָּוִיד
  choice: 大卫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词 אֶל 的基本方向义是“向、到”；在祷告语境中，“向你说”自然表达大卫对上帝陈言。
- source_word: לְכָבוֹד אֶת־עַבְדֶּךָ
  choice: 为了尊荣你的仆人
  rationale: 该短语句法紧缩且含义困难；此译法按上下文理解为上帝尊荣大卫，同时用脚注保留其他可能解释。
- source_word: עַבְדֶּךָ
  choice: 你的仆人
  rationale: 大卫以第三人称谦称自己；“仆人”保留君王祷告中的臣属与事奉意味。
- source_word: וְאַתָּה ... יָדָעְתָּ
  choice: 你认识
  rationale: ידע 的完成式在此表达上帝对大卫既定而真实的认识；现代汉语用现在时“认识”简洁自然。连接词不必机械译出，其承接意味由句序表达。
theological_decisions:
- issue: לְכָבוֹד אֶת־עַבְדֶּךָ 所表达的尊荣关系
  choice: 理解为上帝尊荣大卫：“为了尊荣你的仆人”
  alternative: “为了你仆人的尊荣”或“要尊荣你的仆人”
  rationale: 上下文是大卫因上帝赐给他的恩荣而惊叹；主译文表达这一语境意义，但原文结构确有歧义，因此不将其他读法静默排除，而在脚注中列明。
- issue: ידע 在本节中的神学语气
  choice: 译作中性的“认识”
  alternative: “深知”或“完全知道”
  rationale: 原文确实可在关系性语境中表示深入认识，但“深知”“完全知道”会把程度明说出来；“认识”更贴近原词，并避免额外强化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留大卫以姓名自称、称自己为“你的仆人”的祷告语体；通过“还能……呢”呈现反问，不使用古奥措辞。脚注标记均紧接其所说明的正文成分。
