base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/019.yaml
  text: O Yahweh[a], for the sake of your servant and according to your heart, you have done all this greatness[b], to make known all these great things.
translation:
  language: zh_hans
  text: 耶和华啊，你为了你仆人的缘故，又照着你的心意，成就了这一切伟大的作为，为要使人知道这一切伟大的作为。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先用单数“这一切伟大”，后转为复数“这一切伟大的作为”；前者可能是对上帝伟大作为的集合性概括，后者则指其各种具体表现。
    reason: 说明原文由单数集合概念转为复数的变化；中文“作为”可按上下文作集合性或复数理解。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中通行的专名译法，明确呈现以色列上帝的圣名。
- source_word: בַּעֲבוּר עַבְדְּךָ
  choice: 为了你仆人的缘故
  rationale: 表达行动所顾念的对象或缘由；“仆人”符合大卫祷告中谦卑自称的语境。
- source_word: וּכְלִבְּךָ
  choice: 也照着你的心意
  rationale: 希伯来文直译为“照着你的心”；现代汉语以“心意”自然表达内在意愿，同时保留“心”的意象。
- source_word: עָשִׂיתָ
  choice: 成就了
  rationale: 此处指上帝施行并完成所应许的大事；“成就”比笼统的“做了”更符合祷告语境。
- source_word: כָּל הַגְּדוּלָּה הַזֹּאת
  choice: 这一切伟大的事
  rationale: 原文为单数抽象名词“这一切伟大”；中文若直译为“这一切伟大”不够自然，因此以集合性的“伟大的事”表达。
- source_word: לְהוֹדִיעַ
  choice: 要使人知道
  rationale: 保留使役含义；原文未明说获知者，中文以泛指“人”补足自然句法而不限定具体对象。
- source_word: כָּל הַגְּדֻלּוֹת
  choice: 这一切大事
  rationale: 原文使用复数，指伟大的诸般表现；译为“大事”简洁自然，并与前面的单数集合表达形成呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”在现代中文普通读者中最通行、辨识度最高；此处不以“主”替代，以保留专名性质。
- issue: “照着你的心”的拟人表达
  choice: 照着你的心意
  alternative: 照着你的心；照着你的旨意
  rationale: “心意”既保留原文“心”的语义痕迹，又能自然表示上帝内在的意愿；避免直接译作“旨意”而把表达过度神学化。
- issue: 单数“伟大”与复数“大事”的转换
  choice: 正文自然表达，并以脚注说明原文数的变化
  alternative: 这一切伟大……这一切伟大之事
  rationale: 保留原文从单数集合概念转到复数具体表现的张力，同时避免生硬中文。
translation_notes:
  register: 采用庄重而现代的祷告语体。“耶和华啊”保留呼语；句式尽量贴近希伯来文推进顺序，同时避免“这一切伟大”等不自然的现代汉语表达。
