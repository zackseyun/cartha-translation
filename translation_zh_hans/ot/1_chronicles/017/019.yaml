  rationale: 将末句“大事”统一调整为“伟大的作为”，以避免其在现代汉语中的泛化或事务性理解，并更准确传达原文所说神的伟大行动。以“又”替代“也”仅为更自然地表达原文的并列连接。脚注保留并澄清原文单数与复数之间的张力。
