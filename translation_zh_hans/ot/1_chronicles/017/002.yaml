  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל דָּוִ֔יד כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ עֲשֵׂ֑ה כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/002.yaml
  text: And Nathan said to David, “Do all that is in your heart, for God is with you.”
translation:
  language: zh_hans
  text: 拿单对大卫说：“你心里所想的一切，都去做，因为上帝与你同在。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动情节；现代汉语通常无需另译连接词，直接用“说”自然承接上文。
- source_word: נָתָן
  choice: 拿单
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: אֶל דָּוִיד
  choice: 对大卫
  rationale: 介词 אֶל 在说话结构中自然译为“对”；大卫采用通行音译。
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: 你心里所想的一切
  rationale: לֵבָב 指人的内在思想、意愿或意图。“心里所想”在现代汉语中既保留“心”的意象，也清楚表达此处所指的打算；“一切”对应 כֹּל 的总体范围。
- source_word: עֲשֵׂה
  choice: 只管去做
  rationale: 命令式 עשה 意为“做、实行”。“只管去做”自然表达拿单对大卫付诸实行的鼓励，并与前面的内心意向衔接。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出支持前述劝告的理由，现代汉语用“因为”明确自然。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 原文使用 אֱלֹהִים 而非神名 YHWH；“上帝”是现代标准汉语中对以色列之神自然且尊严的称呼，不把它误译为“耶和华”。
- source_word: עִמָּךְ
  choice: 与你同在
  rationale: 直接表达神的临在与支持；“与你同在”是自然、庄重且为普通读者易懂的现代汉语。
theological_decisions:
- issue: הָאֱלֹהִים 的神称谓
  choice: 上帝
  alternative: 耶和华；那位上帝
  rationale: 原文是带定冠词的 אֱלֹהִים，不是 YHWH。“上帝”自然表达确定所指，又避免加入原文没有的神名；汉语无须机械表达希伯来语定冠词。
- issue: “上帝与你同在”的语义范围
  choice: 保留为“与你同在”
  alternative: 上帝必帮助你；上帝赞同你的计划
  rationale: 原文表达神的临在，也可能语用上暗含支持，但并未明确断言神赞同这一具体计划；鉴于下文神将纠正拿单的判断，不把含义扩写为明确认可，以保留叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“只管去做”比生硬的“做你心里的一切”更符合汉语习惯；同时保留“心”和“同在”等重要源语意象。
