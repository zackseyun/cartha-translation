base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/003.yaml
  text: But that night the word of God came to Nathan[a], saying,
translation:
  language: zh_hans
  text: 可是，就在那天夜里，神的话临到拿单[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有从神而来的话临到拿单。”
    reason: 保留 דְּבַר אֱלֹהִים 可按构造关系译作“神的话”，也可按来源关系理解为“从神而来的话”的词汇可能性。
lexical_decisions:
- source_word: וַיְהִי
  choice: 可是，……临到
  rationale: 首个叙事连接词承接上文，并在语境中带出轻微转折，因此译作“可是”；第二个 וַיְהִי 融入汉语惯用表达“临到”，避免机械重复“发生了”。
- source_word: בַּלַּיְלָה הַהוּא
  choice: 就在那天夜里
  rationale: “那天夜里”自然保留指示词 הַהוּא；“就在”突出事情紧接前文发生，但不增添新的时间信息。
- source_word: דְּבַר אֱלֹהִים
  choice: 神的话
  rationale: דָּבָר 可指“话、事情、信息”；在先知领受启示的公式中，“神的话”既保留原文结构和庄重语体，也不把它收窄为一般信息。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处为单数意义，指以色列的神；“神”是现代汉语中直接、通行的对应词。
- source_word: אֶל נָתָן
  choice: 临到拿单
  rationale: 介词 אֶל 标示信息所到达的领受者；汉语圣经叙事中“临到某人”自然表达启示传达的方向。人名 נָתָן 译作通行形式“拿单”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接引语；汉语以“说”简洁自然地保留其引语功能。
theological_decisions:
- issue: 启示公式 דְּבַר אֱלֹהִים 的表达
  choice: 神的话临到拿单
  alternative: 有从神而来的话临到拿单
  rationale: 主译保留原文的构造关系和先知启示公式的庄重分量；脚注列出来源式理解，以保存该短语在汉语中可表达的另一种关系，不额外加入教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“可是”体现与上文拿单先前答复之间的轻微转折；“就在那天夜里”保持叙事紧凑。“神的话临到”保留先知启示公式，不作教义性扩展。
