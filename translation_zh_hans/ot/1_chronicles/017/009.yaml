reference: 1 Chronicles 17:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י יִשְׂרָאֵ֤ל וּ/נְטַעְתִּ֨י/הוּ֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹא יוֹסִ֤יפוּ בְנֵי עַוְלָה֙ לְ/בַלֹּת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/009.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], and they will dwell in their own place and be disturbed no more. And the sons of wickedness will no longer wear them down, as at the first[b],
translation:
  language: zh_hans
  text: 我要为我的子民以色列指定一个地方，把他们栽植在那里[a]；他们必安居在自己的地方，不再受搅扰。不义之徒[b]也不再摧残他们，像从前那样[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“栽植”的宾语是单数形式，指作为一个整体的以色列；也有人理解为“把它栽植”，即指前述地方。
    reason: collective_singular_ambiguity
  - marker: b
    text: 原文直译为“不义之子”，是指作恶或行不义的人。
    reason: hebrew_idiom
  - marker: c
    text: 或译：“像起初那样。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: 指定一个地方
  rationale: שׂים的基本义是“放置、设立”；与מָקוֹם连用时，表达为某人划定、安排地方。“指定一个地方”既保留上帝主动安排的意思，也符合现代汉语。
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: 为我的子民以色列
  rationale: 保留“我的子民”这一圣约性的所属表达，并使“以色列”作为同位语自然呈现。
- source_word: וּנְטַעְתִּיהוּ
  choice: 把他们栽植在那里
  rationale: 保留נטע“栽植”的形象，表达使以色列稳固扎根。原文后缀为单数，但“以色列”是集合性群体；汉语用“他们”指其百姓较清楚。“在那里”承接前面的“一个地方”，使句意自然。
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: 他们必安居在自己的地方
  rationale: שׁכן表示居住、定居；תחתיו直译近于“在它／他的下面”，在此语境中表达安处于所定的位置。“安居在自己的地方”传达稳固定居之意，避免生硬和误解。
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: 不再受搅扰
  rationale: רגז可指震动、战栗或动荡；在民族安居的语境中，“受搅扰”保留外来侵扰导致不安的含义。
- source_word: בְנֵי עַוְלָה
  choice: 不义之徒
  rationale: 字面是“不义之子”，属于希伯来语表示某类人的惯用结构。译作“不义之徒”保留其道德性质，也符合庄重而易懂的现代汉语。
- source_word: לְבַלֹּתוֹ
  choice: 摧残他们
  rationale: בלה在此可表达使之耗损、磨灭。“摧残”体现持续压迫所造成的损害，同时比直译“磨损”更适用于人群。
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: 像从前那样
  rationale: 该短语回指以色列先前遭受侵扰的时期。“从前”自然简洁；“起初”也是可能的较字面译法。
theological_decisions:
- issue: 对以色列的应许中集合性单数的处理
  choice: 在汉语正文中用复数“他们”指以色列百姓
  alternative: 依照语法形式译作单数“它／他”
  rationale: 原文以单数形式指称作为整体的以色列，但上下文明确关乎上帝的百姓。汉语用“他们”可清楚表达群体所领受的应许，不改变其整体性。
- issue: תַּחְתָּיו的语境含义
  choice: 译作“在自己的地方”
  alternative: 直译为“在它／他的下面”
  rationale: 直译在汉语中含义不明，甚至可能误导。上下文强调上帝使以色列在所赐之地稳固安居，因此采用语境化表达。
- issue: “栽植”的对象
  choice: 理解为作为集合性群体的以色列百姓
  alternative: 理解为前述“地方”
  rationale: 动词后缀为阳性单数，形式上可与集合性“以色列／子民”相应；“栽植百姓”也是表达稳固建立的自然比喻。因语法形式容许读者注意到歧义，脚注予以说明。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“栽植”保留原文比喻，“安居”“不义之徒”“摧残”兼顾经文语体与普通读者的可理解性；分号呈现应许中安置与安居之间的紧密联系。
