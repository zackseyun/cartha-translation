base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/013.yaml
  text: I will be a father to him[a], and he will be a son to me. And I will not remove my steadfast love from him[b], as I removed it from the one who was before you.
translation:
  language: zh_hans
  text: 我要作他的父亲[a]，他要作我的儿子。我的慈爱，我必不从他身上收回，不像我从你以前那一位[b]身上收回一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要对他作父亲，他要对我作儿子。”
    reason: lexical_alternative
  - marker: b
    text: “你以前那一位”指大卫之前作王的扫罗。
    reason: cross_reference
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: 我要作他的父
  rationale: 希伯来文直译近似“我要对他成为父”。中文用“作他的父”自然、庄重，并保留直接的父子关系表达。
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: 他要作我的子
  rationale: 与前句形成对称，保留圣约中明确的父子关系；“子”也比日常口语“儿子”更符合此处庄重的王室语境。
- source_word: חַסְדִּי
  choice: 我的慈爱
  rationale: חֶסֶד在此兼有眷爱、忠贞和持久恩惠之意。“慈爱”是现代中文圣经语体中自然且涵义较宽的译法，不将其收窄为单纯怜悯或法律性的盟约忠诚。
- source_word: לֹא אָסִיר מֵעִמּוֹ
  choice: 我必不从他身上收回
  rationale: 使役形态表达移去、撤回。中文“从他身上收回”清楚自然，也可与下句同一动词的重复对应。
- source_word: כַּאֲשֶׁר הֲסִירוֹתִי
  choice: 不像……收回一样
  rationale: 希伯来文形式为“正如我曾除去”，但与前面的否定连用时，现代中文以“不像……一样”最自然，并保留比较关系及动词呼应。
- source_word: מֵאֲשֶׁר הָיָה לְפָנֶיךָ
  choice: 从你前面那一位身上
  rationale: 保留原文没有直呼其名的表达。“你前面”在此表示王位上先于大卫，并通过脚注说明所指。
theological_decisions:
- issue: 大卫之约中的父子语言
  choice: 保留“我要作他的父，他要作我的子”的直接关系语言
  alternative: 我要像父亲一样照顾他，他也要像儿子一样属于我
  rationale: 原文明确建立王室圣约中的父子关系；不应将其弱化为仅仅类似父子关系的照顾或归属。
- issue: 圣约语境中חֶסֶד的译法
  choice: 慈爱
  alternative: 信实的爱；盟约之爱；怜悯
  rationale: “慈爱”能够同时容纳眷爱、恩惠与持久忠贞，不把词义限定为情感、法律义务或对困苦者的怜悯。
- issue: 前任君王的身份
  choice: 正文保留“你前面那一位”，脚注指出是扫罗
  alternative: 在正文直接译作“扫罗”
  rationale: 原文含蓄指称前任者，并未出现扫罗之名；正文保留该含蓄性，脚注提供历史所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话圣经语体。以“作他的父／作我的子”保持平行和王室圣约语言；“收回”重复对应同一希伯来动词。所有脚注标记均置于正文相应位置。
