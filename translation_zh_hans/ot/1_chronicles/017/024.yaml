id: 1CH.17.24
reference: 1 Chronicles 17:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/יֵֽאָמֵן וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֱלֹהִ֖ים לְ/יִשְׂרָאֵ֑ל וּ/בֵית דָּוִ֥יד עַבְדְּ/ךָ֖ נָכ֥וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/024.yaml
  text: May it be established[a], and may your name be magnified forever, saying, ‘Yahweh of hosts, the God of Israel[b], is God to Israel,’ and may the house of David your servant be established before you.
translation:
  language: zh_hans
  text: 愿这话得以坚立，愿你的名永远被尊为大，使人说：‘万军之雅威，以色列的上帝，是以色列的上帝[a]。’愿你仆人大卫的家[b]在你面前得以坚立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给以色列作上帝。”希伯来文较直译如此。
    reason: lexical_alternative
  - marker: b
    text: 这里的“家”指大卫的王室或王朝。
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵאָמֵן
  choice: 愿这话得以坚立
  rationale: 该词为 אמן 的尼法勒未完成式，在祷告语境中有祈愿意味，指上文所说的应许得以确立。“这话”承接17:23的“你所说的话”，使中文主语清楚。
- source_word: וְיִגְדַּל שִׁמְךָ
  choice: 愿你的名永远被尊为大
  rationale: גדל 在此表达上帝的名受尊崇、被显为伟大；保留“名”，也用自然中文传达其尊荣含义。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 以“雅威”音译四字神名，以“万军之”保留 צְבָאוֹת 所表达的统帅众军之称号。
- source_word: אֱלֹהִים לְיִשְׂרָאֵל
  choice: 是以色列的上帝
  rationale: לְיִשְׂרָאֵל 表明上帝与以色列的关系；中文若直译为“给以色列作上帝”较生硬，因此正文采用自然的所属表达，并以脚注保留较贴近字面的译法。
- source_word: בֵית דָּוִיד עַבְדְּךָ
  choice: 你仆人大卫的家
  rationale: 保留“家”的意象；在本段王朝应许的语境中，它指大卫的王室或王朝。
- source_word: נָכוֹן לְפָנֶיךָ
  choice: 在你面前得以坚立
  rationale: נָכוֹן 表示稳固、确立；“在你面前”保留其在上帝临在和眷顾中长久存立的关系性表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名，故正文采用现代汉语音译“雅威”，而不以称号取代专名。
- issue: 本节未完成式动词的语气
  choice: 祈愿式“愿……得以……”
  alternative: 陈述将来事实“必……”
  rationale: 大卫正在回应上帝的应许而祷告，语境支持把这些动词理解为祈求和愿望，同时不否认应许的确定性。
- issue: אֱלֹהִים לְיִשְׂרָאֵל 中介词 לְ 的关系
  choice: 正文译“是以色列的上帝”
  alternative: 给以色列作上帝
  rationale: 希伯来文可较直译为“给以色列作上帝”，也可自然理解为“以色列的上帝”。正文选用通顺现代中文，脚注呈现较贴近形式的译法，以保留原文关系和受益色彩。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被尊为大”避免机械直译“变大”，同时保留对上帝之名受尊崇的祈愿；两处“坚立”呼应原文中确立、稳固的主题。
