  text: וְ/עַתָּ֗ה הוֹאַ֨לְתָּ֙ לְ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֤ה יְהוָה֙ בֵּרַ֔כְתָּ וּ/מְבֹרָ֖ךְ לְ/עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/027.yaml
  text: And now[a], you have been pleased to bless the house of your servant, that it may be before you forever; for you, O Yahweh, have blessed it[c][b], and it is blessed forever.
translation:
  language: zh_hans
  text: 如今，你既已乐意[a]赐福你仆人的家[b]，好使这家永远在你面前；因为你——雅威——已经赐福，所以这家永远蒙福[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乐意”也可译作“应允”或“着手”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“家”很可能不只是指住所或同住的一家人，也包括仆人的家系，即大卫的王朝。
    reason: cultural_note
  - marker: c
    text: 也可译作：“愿这家永远蒙福。”不过，原文的形式更自然地表示因雅威已经赐福，这家便持续处于蒙福的状态。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 保留连接语和时间推进的作用；“如今”适合庄重的祷告语体，又不显陈旧。
- source_word: הוֹאַלְתָּ
  choice: 你乐意
  rationale: 该动词在此表示甘愿、欣然同意或决定采取行动；“乐意”贴合大卫述说上帝恩惠的语境，同时用脚注保留“应允、定意”的可能表达。
- source_word: לְבָרֵךְ
  choice: 赐福
  rationale: 直接表达不定式“祝福”；对上帝施予福分，现代汉语通常说“赐福”。
- source_word: בֵּית עַבְדְּךָ
  choice: 你仆人的家
  rationale: “家”既可指家庭，也可在上下文中指大卫的家系或王朝，保留了希伯来语 בַּיִת 的语义宽度。
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: 使这家永远在你面前
  rationale: “使”自然表达此处目的或结果关系；“在你面前”保留原文空间性兼关系性的说法，不将其窄化为单纯的存续或蒙悦纳。
- source_word: כִּי
  choice: 因为
  rationale: 引出前句所述确信的根据，清楚保留因果关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代；“雅威”也比源自另一种传统读法的“耶和华”更接近通常重建的发音。
- source_word: בֵּרַכְתָּ
  choice: 已经赐福
  rationale: 完成式表示赐福已经发生，并对当前结论持续有效；“已经”使汉语时体关系清楚。
- source_word: וּמְבֹרָךְ לְעוֹלָם
  choice: 这家就永远蒙福了
  rationale: 被动分词最自然地表达因上帝赐福而处于持续蒙福的状态；“就……了”在汉语中呈现结果关系，同时脚注保留祈愿式理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。正文以音译“雅威”保留专名性质，避免用称号替代，也避免采用与通常重建发音距离较大的传统形式。
- issue: 末句 וּמְבֹרָךְ לְעוֹלָם 的语气
  choice: 陈述结果：“这家就永远蒙福了”
  alternative: 祈愿：“愿这家永远蒙福”
  rationale: 原文是被动分词，不是明确的祈使式或祈愿式；在“你已经赐福”之后，较自然地陈述由此形成并持续的蒙福状态，但其祷告语境容许祈愿式理解，故在脚注说明。
- issue: “家”在大卫之约语境中的范围
  choice: 正文保留“家”，兼容家庭、家系和王朝含义
  alternative: 家族；王朝
  rationale: 直接译成“王朝”会过早限定 בַּיִת 的多义性；“家”可让本节与上下文共同显明其家系和王朝意涵。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“你——雅威——”以同位结构保留原文对神的直接称呼和专名。“家”“在你面前”等关键表达不作过度释义，以保存大卫之约语境中的语义张力。
