base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/016.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, O Yahweh God, and what is my house, that you have brought me this far?”
translation:
  language: zh_hans
  text: 大卫王进去，坐在耶和华面前，说：“耶和华上帝啊，我是谁？我的家[a]算什么，你竟把我带到如今这一步？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”也可理解为“家庭”“家族”或“王朝”。这里的希伯来词涵盖大卫的家室，并在上下文中指向他的王室后裔。
    reason: 说明 בֵיתִי 在大卫之约语境中的词义范围，避免正文只限定为现代意义上的住所或核心家庭。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 进去
  rationale: בוא 可指来、去或进入；结合大卫来到上帝面前的叙事动作，“进去”自然保留了进入某处的含义，又不额外指明地点。
- source_word: וַיֵּשֶׁב
  choice: 坐在
  rationale: ישׁב 虽也可表示居住或停留，但这里紧接“进去”，具体动作“坐在”最符合语境。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 直译并自然表达处于耶和华临在之处；以“耶和华”呈现四字神名。
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝啊
  rationale: 这是直接呼语；“啊”清楚表达呼格语气，“耶和华上帝”分别对应神名与称号。
- source_word: מִי אֲנִי
  choice: 我是谁
  rationale: 自然保留希伯来语疑问形式，并表达大卫的谦卑与惊叹。
- source_word: וּמִי בֵיתִי
  choice: 我的家算什么
  rationale: 原文以“谁”同时询问大卫和他的“家”；汉语对非人格整体用“算什么”更自然，也保留其自觉微不足道的语气。
- source_word: בֵיתִי
  choice: 我的家
  rationale: “家”保留 בַּיִת 的宽广语义，在本章中既可涉及家庭、家族，也可延伸至王朝和后裔；具体范围不在正文中收窄。
- source_word: הֲבִיאֹתַנִי עַד הֲלֹם
  choice: 你竟带我走到今天这一步
  rationale: 使役式 הֲבִיאֹתַנִי 表示“使我来到／带我到”，עַד הֲלֹם 表示达到目前的地步；此译自然传达上帝一路提升大卫以及大卫的惊叹。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文直接呈现专名而非以“主”替代；“耶和华”是现代中文读者最熟悉且可明确识别的传统音译。
- issue: “家”在应许语境中的范围
  choice: 正文保留“家”，脚注说明家庭、家族或王朝等可能含义
  alternative: 正文直接译作“王朝”或“家族”
  rationale: 本章上下文确实涉及大卫的后裔和王朝，但 בֵיתִי 本身具有家庭、家族与王室谱系等重叠含义；保留“家”可避免过早消除这种神学与文学上的多义性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你竟……”体现大卫因上帝恩待而发出的惊叹，并未加入责问意味；“走到今天这一步”是 עַד הֲלֹם 的自然汉语表达。
