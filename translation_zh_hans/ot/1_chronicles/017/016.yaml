  terminology: “耶和华”一致呈现 יהוה；“上帝”对应此处作为神圣称号的 אֱלֹהִים，处理恰当。“家”保留 בֵיתִי 可兼指家庭、家族及王室谱系的开放性，脚注也适当地说明该词范围，未将正文限定为“王朝”。
