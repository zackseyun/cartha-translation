  yaml_path: translation/ot/1_chronicles/017/015.yaml
  text: According to all these words and according to all this vision[b][a], so Nathan spoke to David.
translation:
  language: zh_hans
  text: 拿单照着这一切话[a]，也照着这整个异象[b]，对大卫说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译作“事情”或“这些事”；希伯来语 דְּבָרִים 依上下文可指言语，也可指事情。
    reason: lexical_alternative
  - marker: b
    text: “异象”也可译作“启示”；希伯来语 חָזוֹן 指先知性的异象或启示。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: 照这一切
  rationale: 介词כ与כֹל合用，表达依照、符合；译作“照这一切”自然简洁，并与后面的重复结构相呼应。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דְּבָרִים可指“话”或“事情”；本节承接上文上帝所传的信息，译作“话”更贴合言语内容，同时以脚注保留另一可能。
- source_word: וּכְכֹל
  choice: 和这一切
  rationale: 保留原文重复的“照/依照……一切”结构所形成的对应关系；中文为避免累赘，在“和”之后承接前面的“照”。
- source_word: הֶחָזוֹן הַזֶּה
  choice: 这一切异象
  rationale: חָזוֹן指先知所得的异象或启示性显现；“异象”是直接且通行的译法。这里的כֹל修饰异象整体，可理解为异象的全部内容，故译作“这一切异象”。
- source_word: כֵּן
  choice: 就照……
  rationale: כֵּן表示拿单所说与所领受的内容相符。中文将其与句首的“照”及“就”结合表达，以免生硬直译为“如此”。
- source_word: דִּבֶּר
  choice: 述说
  rationale: דבר意为“说、讲述”；结合整段信息传达的语境，“述说”比单纯“说”更清楚地表示完整转告。
- source_word: נָתָן
  choice: 拿单
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: אֶל דָּוִיד
  choice: 向大卫
  rationale: 介词אֶל在说话语境中表示言语所指向的对象，译作“向大卫”自然准确。
