  text: וְ/הַֽעֲמַדְתִּ֛י/הוּ בְּ/בֵיתִ֥/י וּ/בְ/מַלְכוּתִ֖/י עַד הָ/עוֹלָ֑ם וְ/כִסְא֕/וֹ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/014.yaml
  text: But I will establish him in my house and in my kingdom forever[c][b][a], and his throne will be established forever.
translation:
  language: zh_hans
  text: 但我要在我的家和我的国中永远坚立他[a][b][c]；他的王位也必永远稳固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要立他管理我的家和我的国，直到永远。”原文介词的基本意思是“在……中”；正文保留两个短语的平行和较宽的含义。
    reason: lexical_alternative
  - marker: b
    text: “他”在直接语境中可指大卫的王室后裔，尤其是所罗门；这应许也构成更广泛的大卫王朝应许，后来被赋予弥赛亚意义。
    reason: alternative_reading
  - marker: c
    text: “我的家”可有较宽的含义；有人理解为神的家室或居所，也有人具体理解为圣殿。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַעֲמַדְתִּיהוּ
  choice: 但我要使他……坚立
  rationale: 使役式表达使某人站稳、得以确立。译作“使他……坚立”既保留使役含义，也符合王权与圣约语境；连接词按上下文的转折意味译作“但”。
- source_word: בְּבֵיתִי
  choice: 在我的家中
  rationale: בֵּית可指房屋、家室、殿宇或所属领域。“我的家”保留原文意象及其可能涵盖的圣殿、家室和圣约群体等层次，不在正文中缩窄解释。
- source_word: וּבְמַלְכוּתִי
  choice: 和我的国中
  rationale: 顺着介词ב的基本意义译作“在……中”，并与“在我的家中”保持平行；“国”自然表达מַלְכוּת的王国、王权领域之义。
- source_word: עַד הָעוֹלָם
  choice: 永远
  rationale: עַד与עוֹלָם构成惯用表达，在本圣约语境中表示持续长久、没有终止；“永远”简明自然。
- source_word: וְכִסְאוֹ
  choice: 他的王位
  rationale: כִּסֵּא本义为“宝座”，在此指君王的王位与统治。现代汉语中“王位”更自然，同时保留明确的王权含义。
- source_word: יִהְיֶה נָכוֹן
  choice: 必……稳固
  rationale: נָכוֹן在此表示坚定、稳妥、牢固成立。“必稳固”自然传达其状态，也避免与前句使役动词机械重复。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 再次表达持续不止的永久性；与前句一致译为“永远”。
theological_decisions:
- issue: “他”的所指
  choice: 正文保留第三人称单数“他”，不明确指定具体人物。
  alternative: 所罗门；大卫王系；最终的弥赛亚。
  rationale: 原文本节只用阳性单数代词。上下文具有直接的大卫王朝意义，并可承载后来弥赛亚式的理解；译文不应替原文消除这种张力。
- issue: “我的家”的范围
  choice: 保留“我的家”这一宽广表达。
  alternative: 我的殿；我的家室或王朝；属于上帝的圣约群体或领域。
  rationale: 原词在语境中可能引发多层联想。直译可保留其丰富性，避免正文武断限定为圣殿或家室。
- issue: 两处“永远”的圣约含义
  choice: 两处均译作“永远”，保留应许所宣告的永久性。
  alternative: 长久；直到遥远的世代。
  rationale: עַד עוֹלָם在此强调大卫之约中王位的持久稳固。译作“永远”最直接，但不在译文中另行规定其实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使他……坚立”保留原文使役语气；“王位……稳固”比逐字重复“被坚立”更自然。脚注标记依次置于相关应许之后，正文中的[a][b][c]与脚注完全对应。
