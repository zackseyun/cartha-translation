  text: וַ֠/תִּתֵּן אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/022.yaml
  text: And you made your people Israel your people forever[a], and you, O Yahweh, became their God.
translation:
  language: zh_hans
  text: 你使你的子民——以色列——永远作你的子民；你，耶和华，也作了他们的神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你是他们的神。”希伯来语也可作较静态的表达；正文按上下文译出圣约关系得以确立的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: 使……作
  rationale: נתן本义为“给”，但这里与两个ל介词结构连用，表示使以色列取得并确立某种身份；“使……作”既保留构成关系的语力，也符合现代汉语。
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: 你的子民以色列
  rationale: 保留“你的子民”与“以色列”的同位关系；“子民”在庄重现代汉语中适合表达属于神的群体。
- source_word: לְךָ לְעָם
  choice: 作你的子民
  rationale: 两个ל介词共同表达归属与身份：“归你、作子民”。译为“作你的子民”自然地呈现圣约身份。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 清楚表达持续不止的时间范围，并自然修饰以色列作神子民的身份。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的四字神名音译，以专名呈现四字神名，而不以“主”等称号替代。
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: 你也作了他们的神
  rationale: היה的完成式在上下文中可表达圣约关系的确立。“作了”保留叙事性的关系建立，同时不暗示神的本体发生变化。
theological_decisions:
- issue: 如何翻译圣约公式中的 היה + ל + אֱלֹהִים
  choice: 你也作了他们的神
  alternative: 你是他们的神
  rationale: 上下文回顾神确立以色列为自己子民的行动，因此正文保留关系得以建立的叙事语力；同时希伯来语也容许较静态的理解，故以脚注保留该可能。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。正文保留原文“你的子民……作你的子民”的重复，以呈现既有称谓与永久圣约身份之间的呼应；分号用于清楚展现两个对应分句。
