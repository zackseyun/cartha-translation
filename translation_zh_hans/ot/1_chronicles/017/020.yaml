  text: יְהוָה֙ אֵ֣ין כָּמ֔וֹ/ךָ וְ/אֵ֥ין אֱלֹהִ֖ים זוּלָתֶ֑/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/020.yaml
  text: O Yahweh[a], there is none like you, and there is no God besides you, in all that we have heard with our own ears.
translation:
  language: zh_hans
  text: 耶和华啊，照我们亲耳所听见的一切，没有谁能与你相比；除你以外，也没有神[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除你以外，没有别的神。”
    reason: “也没有神”与“没有别的神”都可自然表达 אֵין אֱלֹהִים זוּלָתֶךָ 的排他含义；前者较贴近原句的存在句结构。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，保留其作为立约之神名字的性质，而不改译为称号“主”。
- source_word: אֵין כָּמוֹךָ
  choice: 没有谁能与你相比
  rationale: אֵין 表示不存在，כָמוֹךָ 表示“像你、可与你相比”；此译自然地表达无人可比的意思。
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: 除你以外，再没有神
  rationale: זוּלָתֶךָ 表示“除你以外”；“再没有神”保留原文直接而绝对的排他性宣告。
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ
  choice: 照我们……听见的一切
  rationale: 介词 בְ 在这里可表达依据或相符关系；“照……一切”使整句认信与所听见的全部见证相符，同时不把该短语误解成仅修饰其中一个分句。
- source_word: בְּאָזְנֵינוּ
  choice: 亲耳
  rationale: 原文直译为“用我们的耳朵”；中文“亲耳”简洁自然，并保留亲自听闻的强调。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非普通称号。中文采用广为人知的“耶和华”，既明确其专名性质，也符合庄重而易懂的现代中文语体。
- issue: וְאֵין אֱלֹהִים זוּלָתֶךָ 的排他力度
  choice: 除你以外，再没有神
  alternative: 没有神能与你相比
  rationale: 原文不只是说耶和华优于其他神明，而是直接否认在他以外另有神；正文保留这一绝对宣告。
translation_notes:
  register: 采用现代、庄重、适合公开诵读的普通话书面语。“耶和华啊”保留祷告中的直接呼告；以分号呈现两个彼此相关的否定宣告。
