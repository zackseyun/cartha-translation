- from: 耶和华啊，照我们亲耳听见的一切，没有谁能与你相比；除你以外，再没有神[a]。
  to: 耶和华啊，照我们亲耳所听见的一切，没有谁能与你相比；除你以外，也没有神[a]。
  rationale: 修订仅将“再没有”改为“也没有”，以消除原文没有的时间性暗示；并把“亲耳听见”调整为更自然庄重的“亲耳所听见”。神名、句法关系、排他性的神论宣告及脚注替代译法均予保留。
