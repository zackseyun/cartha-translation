  to: 因为你，我的上帝啊，已经向你的仆人显明：你要为他建立家[a]；所以你的仆人才有勇气在你面前祷告。
  rationale: 将“家室”改为“家”，以更贴近希伯来语 בָּיִת，并在汉语中保留家庭／家族与王朝之间的语义开放性；脚注交代上下文中突出的王朝含义。调整呼告位置并以冒号引出启示的内容，使句法更自然清晰。其余表达保留草稿对原文习语、谦卑自称和因果关系的准确处理。
