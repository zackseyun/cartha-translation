base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/025.yaml
  text: For you[a], my God, have revealed to your servant that you will build him a house[b]; therefore your servant has found courage to pray before you.
translation:
  language: zh_hans
  text: 因为你，我的上帝啊，已经向你的仆人显明：你要为他建立家[a]；所以你的仆人才有勇气在你面前祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”在这里也可指“王朝”，即延续的王室家系。
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלִיתָ אֶת אֹזֶן עַבְדְּךָ
  choice: 向你仆人揭示
  rationale: 原文直译为“揭开你仆人的耳朵”，是表示透露、启示的希伯来语习语。正文按其意义自然表达，避免生硬直译。
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: 你要为他建立家室
  rationale: 不定式说明所揭示的内容。“建立”适合家系语境，而“家室”保留 בַּיִת 可兼指家庭、家族和王朝的含义，不把它缩减为物质房屋。
- source_word: בָּיִת
  choice: 家室
  rationale: 本节承接大卫之约，所指并非主要是建筑物，而是为大卫建立的家系；“家室”在现代汉语中仍保留家庭与家族的意象。脚注说明其王朝含义。
- source_word: מָצָא ... לְהִתְפַּלֵּל
  choice: 才有勇气……祷告
  rationale: 原文“找到……祷告”在此表示因上帝的启示而敢于或有胆量祈求；译作“有勇气”清楚传达习语意义。“才”体现 עַל־כֵּן 的因果承接。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 保留祷告发生在上帝面前的关系性和敬拜语境，表达自然而庄重。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 在君王向上帝祷告的语境中，这是谦卑自称；“仆人”既符合现代宗教语体，也保留顺服意味。
theological_decisions:
- issue: 大卫之约中“家”（בָּיִת）的含义
  choice: 正文译为“家室”，保留家族意象，并以脚注说明王朝含义
  alternative: 直接译为“王朝”或“家族”
  rationale: 上下文中的应许指向大卫持久的王室家系，但原文仍使用“房屋／家”这一多义意象。译成“家室”可避免误解为给上帝建殿，同时不完全抹去原文的家之隐喻。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“我的上帝啊”保留呼告语气；“你仆人”依照原文第三人称谦称。正文仅设置一个脚注，标记[a]已置于相关词语之后。
