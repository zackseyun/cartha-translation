  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שֹׁפְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר צִוִּ֛יתִי לִ/רְע֥וֹת אֶת עַמִּ֖/י לֵ/אמֹ֑ר לָ֛/מָּה לֹא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/006.yaml
  text: In all the places where I have walked among all Israel[a], did I ever speak a word to one of the judges of Israel, whom I commanded to shepherd my people, saying, ‘Why have you not built for me a house of cedar?’
translation:
  language: zh_hans
  text: 我在全以色列中间往来的各处[a]，何曾对我吩咐牧养我子民的以色列士师中任何一位说过这样的话：‘你们为什么没有为我建造一所香柏木的房屋？’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 平行经文《撒母耳记下》7:7作“以色列的支派”，而非“以色列的士师”；一些文本见证则反映“领袖”或“权杖”的读法。本节《历代志上》的希伯来文本作“以色列的士师”。
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: 往来
  rationale: 该词的Hitpael词形在此表达持续或反复地行走、活动；“往来”自然地保留了上帝在百姓中行动的意象。
- source_word: בְּכָל יִשְׂרָאֵל
  choice: 在全以色列中间
  rationale: 介词短语与“往来”连用，表示上帝在整个以色列民中间活动，而不只是走遍某片地域。
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: 何曾……说过这样的话
  rationale: 疑问词与同根宾语构成强调性的反问；此译法传达“从未说过”的强烈语气，同时保持反问形式。
- source_word: אֶת אַחַד שֹׁפְטֵי יִשְׂרָאֵל
  choice: 对以色列的一位士师
  rationale: אֶת在דבר之后可引出说话的对象；“对……说”符合现代汉语，也准确表达其受话者身份。
- source_word: שֹׁפְטֵי יִשְׂרָאֵל
  choice: 以色列的……士师
  rationale: 忠实翻译《历代志》马所拉文本的“士师”，不按《撒母耳记下》7:7的平行经文改为“支派”或“领袖”。
- source_word: צִוִּיתִי לִרְעוֹת
  choice: 我吩咐牧养
  rationale: 保留רעה的牧羊隐喻，兼具治理、照料和引导百姓的含义。
- source_word: עַמִּי
  choice: 我的子民
  rationale: “子民”自然、庄重地表达上帝与其百姓之间的归属关系。
- source_word: לָמָּה לֹא בְנִיתֶם לִי
  choice: 你们为什么没有为我建造
  rationale: 复数动词בְנִיתֶם按原文译为“你们”；“没有……建造”表达截至当时并未发生的行动。
- source_word: בֵּית אֲרָזִים
  choice: 一座香柏木的殿宇
  rationale: 该短语指用香柏木建成的建筑；在此语境中所指是供上帝居住的圣殿，“殿宇”兼顾语境与庄重语体，而“香柏木”保留材料信息。
theological_decisions:
- issue: 《历代志上》的“士师”与《撒母耳记下》平行经文的“支派”存在差异
  choice: 正文依《历代志上》马所拉文本译作“士师”
  alternative: 按《撒母耳记下》7:7译作“以色列的支派”，或据部分见证理解为“领袖／权杖”
  rationale: 应优先翻译本节现存希伯来文本，不以平行经文消除其文学和文本差异；脚注说明异文即可。
- issue: רעה的治理隐喻
  choice: 译作“牧养”
  alternative: 译作“照管”或“治理”
  rationale: “牧养”保留圣经原有的牧者隐喻，不把照料与治理之间的丰富张力缩减为单一行政概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“何曾”保留反问力度；“士师”“牧养”“香柏木”沿用清晰且已有广泛认知的圣经用语。正文中的[a]与脚注严格对应。
