revisions:
- from: 我在全以色列中间往来时[a]，何曾对以色列的一位士师，就是我吩咐牧养我子民的，说过这样的话：‘你们为什么没有为我建造一座香柏木的殿宇？’
  to: 我在全以色列中间往来的各处[a]，何曾对我吩咐牧养我子民的以色列士师中任何一位说过这样的话：‘你们为什么没有为我建造一所香柏木的房屋？’
  rationale: 修订补足“在……各处”的范围，澄清“士师”作为受命牧养百姓的群体，并以“房屋”贴近希伯来文בֵּית。脚注继续明确正文按《历代志上》希伯来文本译“士师”，同时如实提示平行经文及相关文本见证的差异。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:22Z'
review_pass:
  verdict: revise
  source_fidelity: 正文基本忠实于马所拉文本，并正确保留“士师”而未按《撒母耳记下》的平行经文协调。需要补出בכל אשר所表达的“各处／无论何处”；现译“在全以色列中间往来时”弱化了这一范围。另将“殿宇”收束为“房屋”，避免把בַּיִת在本节直接解释性地限定为“殿”。
  naturalness: 原文中文庄重自然。“我在全以色列中间往来的各处”比“我在全以色列中间往来时”更完整，也更符合现代汉语表达。将关系从句前置后，句法指向更清晰。
  terminology: “士师”“牧养”“我的子民”“香柏木”均合宜。“房屋”对应בַּיִת，同时在本段语境中仍可指上帝的居所，不额外预设后来的圣殿建成形态。脚注保留“士师／支派”的关键异文，并以较清楚的措辞说明其他见证。
  issues:
  - severity: medium
    issue: “在全以色列中间往来时”没有明确表达בְּכֹל אֲשֶׁר的“在……各处／无论何处”。
    rationale: 希伯来文首先强调上帝在以色列中行走、往来的所有地点；仅译为一个时间性“……时”会压低这一范围。
  - severity: low
    issue: “殿宇”比בֵּית更具体。
    rationale: 上下文确实涉及上帝的居所，但本节的词本身是“房屋”；译为“房屋”可保留原文用词及其在叙事中的开放性。
  - severity: low
    issue: “一位士师，就是我吩咐牧养我子民的”在汉语中容易使“我吩咐”的对象仅指该单数士师。
    rationale: 原文的“士师”是复数集合中的“一位”，而“我吩咐……牧养我子民的”自然修饰该群体；前置为“我吩咐牧养我子民的以色列士师中任何一位”可更清楚地表达这一关系及反问的否定范围。
  revised_text: 我在全以色列中间往来的各处[a]，何曾对我吩咐牧养我子民的以色列士师中任何一位说过这样的话：‘你们为什么没有为我建造一所香柏木的房屋？’
