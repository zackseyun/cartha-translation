base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/017.yaml
  text: And this was a small thing in your eyes[a], O God; yet you have spoken concerning your servant’s house for a long time to come, and you have regarded me according to the rank of man on high, O Yahweh God.
translation:
  language: zh_hans
  text: 神啊，这在你眼中算是小事；你又论到你仆人的家，直到遥远的将来；耶和华神啊，你竟以居高位之人的等次看待我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文含义不明确，也可译作“你使我看见后世的人”，或“你看待我如同尊贵的人”。
    reason: 保留希伯来文末句真实存在的多种可能解释，避免在正文中无声地消除歧义。
lexical_decisions:
- source_word: וַתִּקְטַן זֹאת בְּעֵינֶיךָ
  choice: 这在你眼中还算小事
  rationale: 保留希伯来语“在你眼中”的评价习语；“还算小事”自然表达此事在神看来尚不足为大。
- source_word: וַתְּדַבֵּר עַל בֵּית עַבְדְּךָ
  choice: 你又论到你仆人的家
  rationale: דבר על 基本义为“论到、谈及”；不直接译成“应许”，以免把语境所含的应许意味写进词义本身。
- source_word: לְמֵרָחוֹק
  choice: 直到久远的将来
  rationale: 此处“远方”按上下文具有时间意义，指大卫家久远的未来。
- source_word: וּרְאִיתַנִי
  choice: 你竟……看待我
  rationale: ראה 在此不只表示视觉上的“看见”，而是神如何看待或对待大卫；“竟”传达祷告中的惊叹，并未增加新的命题内容。
- source_word: כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: 按高位之人的等次
  rationale: 该短语语义晦涩。תור 可涉及次序、等次或身份安排；הַמַּעֲלָה 与升高或高位有关。正文采用较贴近马所拉文本、又可读的译法，同时用脚注保留其他主要解释。
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华神啊
  rationale: 保留四字神名的通行中文音译“耶和华”，并以“啊”明确直接呼告的语气。
theological_decisions:
- issue: 末句 וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה 的解释
  choice: 你竟按高位之人的等次看待我
  alternative: 你使我看见人的后代；你看待我如同尊贵的人
  rationale: 希伯来文本本身稳定，但该短语的句法和词义组合十分晦涩，历来有多种解释。正文不把它明确改写为后代应许或抽象的人类训诲，而保留神以超常、尊荣的方式看待大卫这一可能含义；其他合理读法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“在你眼中”“你仆人的家”等希伯来语意象；对末句维持适度形式对应，并以脚注说明其难解之处。
