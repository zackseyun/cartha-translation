  text: ה֥וּא יִבְנֶה לִּ֖/י בָּ֑יִת וְ/כֹנַנְתִּ֥י אֶת כִּסְא֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/012.yaml
  text: He will build a house for me[a], and I will establish his throne forever.
translation:
  language: zh_hans
  text: 他必为我建造一座房屋[a]；我必使他的王位直到永远坚立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”原文也可按上下文译作“圣殿”；这里指为上帝建造的圣所。
    reason: 保留希伯来文“房屋”的基本措辞，同时说明其在上下文中的所指及可行的语境译法。
lexical_decisions:
- source_word: הוּא
  choice: 他
  rationale: 第三人称阳性单数独立代词，在此明确并强调应许中的行动者；现代汉语自然译作“他”。
- source_word: יִבְנֶה
  choice: 必……建造
  rationale: בנה 的 Qal 未完成式第三人称阳性单数，在应许语境中指将来的行动；“必”体现应许的确定性，“建造”准确传达其基本意义。
- source_word: לִּי
  choice: 为我
  rationale: 介词 ל 加第一人称单数后缀在此表示受益或归属关系，即为说话者建造。
- source_word: בָּיִת
  choice: 一座殿宇
  rationale: בַּיִת 的基本义是“房屋、居所”；在此特指为上帝建造的圣所。汉语“殿宇”既自然体现该语境，又较“圣殿”少一层专名化解释。脚注保留其字面义“房屋”。
- source_word: וְכֹנַנְתִּי
  choice: 我必使……稳固
  rationale: כון 在此具有使之坚立、牢固的意义；“使……稳固”比单纯“设立”更充分传达王位被坚定保障的含义。连接词 ו 依汉语分句关系以分号体现。
- source_word: אֶת כִּסְאוֹ
  choice: 他的王位
  rationale: כִּסֵּא 带第三人称阳性单数后缀；在王权应许中，“王位”比实体性的“宝座”更自然地表达统治权与王朝地位，同时不排除宝座意象。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 该固定表达指无尽、恒久的延续；“永远”是现代汉语最直接自然的对应，不对大卫之约的最终实现另作解释。
theological_decisions:
- issue: בָּיִת 应按字面译作“房屋”，还是按语境译作“殿宇／圣殿”
  choice: 正文采用“殿宇”，脚注说明字面为“房屋”
  alternative: 正文译作“房屋”或“圣殿”
  rationale: 本节所说的是为上帝建造的圣所，汉语若直译“房屋”容易使普通读者误解为一般住宅；“殿宇”准确体现语境，同时脚注保存希伯来词较宽的字面意义及其文学联系。“圣殿”虽明确，却比原文进一步专门化。
- issue: עַד עוֹלָם 在大卫之约中的效力
  choice: 永远
  alternative: 永世长存、直到永远
  rationale: 直接保留经文所宣告的恒久性，不加入限定语，也不预先裁定这一应许如何或在谁身上获得最终实现。
- issue: כִּסְאוֹ 是实体“宝座”还是转喻性的“王位”
  choice: 王位
  alternative: 宝座
  rationale: 上下文是王朝与统治权的应许，“王位”在现代汉语中更直接传达转喻意义；该选择不削弱原文的王权意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”体现应许语气；以“殿宇”避免“房屋”在汉语中的住宅误读，又用脚注保存原文措辞。分号呈现两个彼此关联的应许分句。
