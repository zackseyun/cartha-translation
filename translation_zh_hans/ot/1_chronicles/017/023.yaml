  text: וְ/עַתָּ֣ה יְהוָ֔ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ יֵאָמֵ֖ן עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/023.yaml
  text: And now[a], Yahweh, let the word that you have spoken concerning your servant and concerning his house be established forever, and do as you have spoken.
translation:
  language: zh_hans
  text: 现在，耶和华啊，愿你论到你仆人和他家[a]所说的话永远坚立；求你照你所说的去行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他家”也可理解为“他的王朝”或“他的家族世系”。在这里，希伯来语“家”可指家室、后裔或王室谱系。
    reason: 说明בֵּיתוֹ在大卫之约语境中的词义范围，避免正文过早限定为单一解释。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 保留从前文转入当前祈求的承接与时间意味；现代汉语中简洁自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，表明原文是以色列之神的名字，而非一般性的称号“主”。
- source_word: הַדָּבָר אֲשֶׁר דִּבַּרְתָּ
  choice: 你……所说的话
  rationale: 直译“话”，并与句末“你所说的”形成呼应；不直接译作“应许”，以免把原文的表达解释得过窄。
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  choice: 论到你仆人和他家
  rationale: עַל在此表示话语所涉及的对象；“他家”保留בַּיִת在大卫之约语境中的多重含义，可兼指家室、后裔和王朝。
- source_word: יֵאָמֵן
  choice: 愿……坚立
  rationale: 该词为אמן的尼法勒式，在此表达被确立、得坚固之意；配合祈愿语气译为“愿……坚立”。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 自然表达原文所指的长久持续、永久不变。
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: 求你照你所说的去行
  rationale: 明确呈现对上帝的直接祈求，并保留“说”与前半句的词语呼应。
theological_decisions:
- issue: “他家”在大卫之约中的范围
  choice: 正文保留“他家”
  alternative: 他的王朝／他的后裔／他的家族世系
  rationale: 本章语境显示这“家”包含大卫的后裔和王权延续，但原词仍保有家室、家系与王朝之间的丰富关联；正文不把含义限定为其中一种，脚注说明其可能范围。
- issue: 祈求上帝之话“坚立”的含义
  choice: 译为“愿……永远坚立”
  alternative: 愿……永远应验／愿……永远确定
  rationale: “坚立”既保留原文“使之稳固、确立”的被动意味，也避免只把这句话处理为一次性的应验，从而保留大卫之约持续有效的语义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“耶和华啊”保留呼语形式；前半句用“愿”，后半句用“求”，呈现希伯来文祈愿与命令式请求的语用力量。脚注标记紧随实际需要解释的“他家”，而非置于句首。
