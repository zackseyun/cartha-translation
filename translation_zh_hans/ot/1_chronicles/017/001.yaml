  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר יָשַׁ֥ב דָּוִ֖יד בְּ/בֵית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל נָתָ֣ן הַ/נָּבִ֗יא הִנֵּ֨ה אָנֹכִ֤י יוֹשֵׁב֙ בְּ/בֵ֣ית הָֽ/אֲרָזִ֔ים וַ/אֲר֥וֹן בְּרִית יְהוָ֖ה תַּ֥חַת יְרִיעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/001.yaml
  text: It happened[a], when David was living in his house, that David said to Nathan the prophet, “Look, I am living in a house of cedar, but the ark of the covenant of Yahweh is under curtains.”
translation:
  language: zh_hans
  text: 大卫住在自己的房屋里时，对先知拿单说：“你看，我住在香柏木的房屋里，耶和华的约柜却在帷幔下[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帷幔下”也可译作“幔子下”。希伯来语此词指织物的帘幕，尤其可指帐篷或会幕所用的帘幕。
    reason: 保留יְרִיעוֹת可泛指织物帘幕、并常用于帐篷或会幕帘幕的词义范围；不把“帐幕”作为正文所明说的内容。
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……以后，就……
  rationale: 这一叙事结构交代大卫安居之后发生的事；现代汉语用“以后，就”自然地连接背景与主句，无须机械译出“事情发生了”。
- source_word: יָשַׁב ... יוֹשֵׁב
  choice: 住进……住在
  rationale: ישׁב在房屋语境中指居住。叙述中的完成式可译“住进”，话语中的分词译“住在”，既符合汉语时体，也保留词语呼应。
- source_word: בְּבֵיתוֹ ... בְּבֵית הָאֲרָזִים
  choice: 自己的宫中……香柏木造的宫中
  rationale: 原文均为“房屋”，但所指是大卫的王宫；汉语称“宫”较自然，并保留两处同词形成的对照。“香柏木造的”明确表达材料关系。
- source_word: נָתָן הַנָּבִיא
  choice: 先知拿单
  rationale: 按现代汉语的常用称谓顺序呈现其职分与姓名。
- source_word: הִנֵּה
  choice: 你看
  rationale: 用于唤起拿单注意大卫所指出的反差，口吻自然且不过分古雅。
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: 耶和华的约柜却
  rationale: 将属格关系理解为属于耶和华的约柜；连接词在语境中表达强烈对比，故译为“却”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而不是以称号“主”替代专名。
- source_word: תַּחַת יְרִיעוֹת
  choice: 安放在帐幕的幔子下
  rationale: תַּחַת意为“在……下面”，יְרִיעוֹת是织物幔子，常特指帐幕的覆盖物；补出“安放”使无动词的希伯来语分句在汉语中完整自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，应保留为专名。中文正文采用广为人知、具历史延续性的“耶和华”；“雅威”是更接近现代学界重构发音的另一种音译，但原始发音并无绝对定论。
- issue: בְּרִית与“约柜”的关系
  choice: 耶和华的约柜
  alternative: 耶和华之约的柜
  rationale: 希伯来语连锁结构在形式上可作多层属格理解，但“约柜”是该圣物在上下文中的固定称呼；此译法不额外界定约的内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“宫”表达王的住所，避免把“房子”误解为普通民居；用“你看”“却”清楚呈现大卫话中的关注点与反差。
