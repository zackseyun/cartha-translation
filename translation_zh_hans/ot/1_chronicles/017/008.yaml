base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/008.yaml
  text: And I have been with you wherever you have gone[a], and I have cut off all your enemies from before you[b], and I will make for you a name like the name of the great ones who are on the earth.
translation:
  language: zh_hans
  text: 你无论往哪里去过，我都一直与你同在；我从你面前剪除了你所有的仇敌。我要使你享有如世上[a]伟人一般的盛名[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世上”也可译为“地上”；“地”也可能指某一地区或国土。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我要为你造一个名”，意思是使你享有盛名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: 都与你同在
  rationale: וָאֶהְיֶה 是叙事序列中的过去行动，回顾耶和华先前始终与大卫同在；汉语借“都”与下文“无论……哪里”自然表达持续相伴，不把它误作单纯的将来应许。
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: 无论你往哪里去
  rationale: 这是表示大卫所到各处的希伯来语习语；译法自然，同时保留范围无所不包的意思。
- source_word: וָאַכְרִית
  choice: 剪除了
  rationale: כרת 的使役式表示使仇敌被剪除、除掉；“剪除”保留原文意象，也符合庄重的现代汉语。
- source_word: אֶת כָּל אוֹיְבֶיךָ
  choice: 你所有的仇敌
  rationale: 明确保留原文 כָּל“所有”的全面范围。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 贴近原文“从你的面前”，保留仇敌从大卫前方被移除的空间意象。
- source_word: וְעָשִׂיתִי לְךָ שֵׁם
  choice: 我要使你声名显赫
  rationale: 此处在应许序列中具有将来指向。希伯来语直译为“为你造一个名”，实际指获得显赫名声；用现代汉语习语清楚传达这一含义，并以脚注保留原文表达。
- source_word: כְּשֵׁם הַגְּדוֹלִים
  choice: 像……的伟人一样
  rationale: 比较的是显要人物所享有的名声；“伟人”在汉语中简洁自然，不额外限定其身份或类别。
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: 世上
  rationale: אֶרֶץ 可指“大地、世界”或“土地、国土”；正文按广泛声名的语境译为“世上”，脚注保留另一可能。
theological_decisions:
- issue: 本节神圣行动的时间次序
  choice: 前两项译作对以往作为的回顾，最后一项译作将来的应许
  alternative: 把全部分句都译为过去，或全部译为将来
  rationale: 前两个 wayyiqtol 回顾耶和华过去与大卫同在并剪除其仇敌，末句的连接完成式则在本段应许语境中指向将来。此译法保留经文从既往信实转向未来应许的张力。
- issue: “名”的表达方式
  choice: 正文译为“声名显赫”，脚注注明原文直译
  alternative: 正文直译为“为你造一个名”
  rationale: “名”在此指名望、声誉，而不是称谓。正文采用普通读者易懂的现代汉语，脚注同时保存重要的希伯来语意象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“仇敌”“剪除”保留经文语体；句式避免生硬逐字翻译。脚注标记[a]、[b]均置于正文相应词语之后。
