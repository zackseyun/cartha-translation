base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/004.yaml
  text: 'Go and say to David my servant[b][a], ‘Thus says Yahweh: You shall not build for me the house to dwell in.’'
translation:
  language: zh_hans
  text: “你去对我的仆人大卫说：‘耶和华如此说：不是你为我建造那供我居住的房屋。[a]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“不是你为我建造那房屋以居住”。也可按一般禁令译作：“你不可为我建造那供我居住的房屋。”这里的“房屋”在语境中指耶和华的殿。
    reason: 保留否定加显式“你”所带来的强调，同时说明“房屋”及“居住”的原文结构和语境所指。
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: 你去告诉
  rationale: 两个连续动作构成命令序列；“你去告诉”在现代汉语中自然、直接。
- source_word: דָּוִיד עַבְדִּי
  choice: 我的仆人大卫
  rationale: 保留所属关系与王权—盟约语境中的受托事奉含义；“仆人”比“奴隶”更符合此处。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知性使者公式的庄重语气，并以现代中文通行形式译出神名。
- source_word: לֹא אַתָּה תִּבְנֶה
  choice: 建造……的，不是你
  rationale: 独立人称代词 אַתָּה 带有焦点；此译法保留“不是你来建造”的强调，同时不把句子仅仅化为普通禁令。
- source_word: לִּי הַבַּיִת לָשָׁבֶת
  choice: 为我建造居所
  rationale: הַבַּיִת 字面为“房屋”，语境中指供耶和华居住的殿；“居所”自然表达目的关系，又未直接改译成“圣殿”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文圣经传统与普通读者中“耶和华”最通行，同时明确作为专名呈现；原文直接使用四字神名。
- issue: 否定所强调的是建造行为还是建造者
  choice: 建造……的，不是你
  alternative: 你不可为我建造
  rationale: 原文 לֹא אַתָּה 将显式代词置于否定之后，突出“不是你”；所罗门将承担建殿任务的上下文也支持保留这一焦点，但不进一步说明大卫为何不能建造。
- issue: הַבַּיִת 是否直译为“房屋”或明确译为“圣殿”
  choice: 居所
  alternative: 房屋；圣殿
  rationale: “圣殿”虽符合所指，却比原词更明确；“房屋”在现代中文中易被误解为普通住宅。“居所”结合 לָשָׁבֶת 表达神所居之处，并在脚注保留字面信息。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“耶和华如此说”保留使者公式；主句用汉语焦点结构呈现原文对“你”的强调。脚注标记已在正文中出现。
