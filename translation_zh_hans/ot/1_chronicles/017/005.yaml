source:
  edition: WLC
  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת מִן הַ/יּ֗וֹם אֲשֶׁ֤ר הֶעֱלֵ֨יתִי֙ אֶת יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָֽ/אֶהְיֶ֛ה מֵ/אֹ֥הֶל אֶל אֹ֖הֶל וּ/מִ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/005.yaml
  text: For I have not lived in a house from the day that I brought up Israel to this day[a], but I have gone from tent to tent and from dwelling place to dwelling place.
translation:
  language: zh_hans
  text: 因为自从我带领以色列人上来的那日，直到今日，我没有住在房屋里；我一直从这帐棚到那帐棚，从这居所到那居所。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句按现存希伯来文本直译为“我一直从帐棚到帐棚，并从居所（或‘会幕’）……”。最后一短语未明说相应的目的语；正文按前一短语的平行结构补足为“从这居所到那居所”。也可按这一补足译为“从会幕到会幕”。
    reason: 保留וּמִמִּשְׁכָּן在现存文本中的省略式结构，并说明“会幕”是מִשְׁכָּן的可行传统译法，而非将补足后的平行说法误作原文逐字明载。
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: 住过
  rationale: ישׁב与地点连用时通常表示居住；“住过”自然表达希伯来语完成式在“从……直到今日”结构中的延续意义。
- source_word: בְּבַיִת
  choice: 殿宇
  rationale: בַּיִת本义为房屋，此处指与帐棚相对的永久性神圣建筑；“殿宇”既符合上帝居所的语境，又避免直接使用“圣殿”而过度引入后来建成的圣殿概念。
- source_word: הֶעֱלֵיתִי אֶת יִשְׂרָאֵל
  choice: 我领以色列上来
  rationale: עלה的使役式表示使上去、领上来；此译保留“上来”的方向意象和上帝的主动作为，不擅自补出“埃及”。
- source_word: וָאֶהְיֶה
  choice: 我一直……
  rationale: 该词直译为“我曾是／我一直在”；结合后面的“从……到……”表达，中文用“我一直”既保留存在状态，也自然呈现持续辗转的含义。
- source_word: מֵאֹהֶל אֶל אֹהֶל
  choice: 从这帐棚到那帐棚
  rationale: 明确保留מִן…אֶל…的起点与终点结构，并以现代汉语自然表达帐棚之间的迁移。
- source_word: וּמִמִּשְׁכָּן
  choice: 从这居所到那居所
  rationale: מִשְׁכָּן可泛指居所，也可特指会幕。现存马所拉文本只明说“从居所”，句法可能承接前面的“到”；正文补足汉语平行结构，脚注说明原文形式与另一种理解。
theological_decisions:
- issue: 如何翻译永久建筑与可移动圣所的对比
  choice: 正文采用“殿宇”“帐棚”“居所”
  alternative: 将בַּיִת译作“圣殿”，将מִשְׁכָּן译作技术性称谓“会幕”
  rationale: 经文重点是上帝未住在永久建筑中，而随以色列住在可移动的帐棚式居所中。“殿宇”适合神圣语境但不预设后来圣殿已经存在；“居所”保留מִשְׁכָּן的词义宽度。
- issue: 末句残缺式平行结构的处理
  choice: 正文按前一短语承接为“从这居所到那居所”
  alternative: 较贴近现存字面的“并从居所……”或将其理解为“在会幕中”
  rationale: 希伯来语末尾仅有וּמִמִּשְׁכָּן，未重复目的成分，可能是省略，也存在文本或句法难点。正文采用最自然的平行理解，同时用脚注保留不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿宇”用于上帝永久居所的语境，比泛称“房屋”庄重，又不像“圣殿”那样过度具体化；末句用整齐的平行结构保证可读性，并以脚注保存原文的不完整形式与歧义。
