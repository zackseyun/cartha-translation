revisions:
- from: 你在世的日子满了，到你列祖那里去的时候[a]，我必兴起你的后裔接续你；他将是你众子中的一个。我必坚立他的国。
  to: 你在世的日子满了、要到你列祖那里去的时候[a]，我必在你之后兴起你的后裔，就是你众子中的一个；我必坚立他的国。
  rationale: 修订仅调整“在你之后”及后裔身份说明的句法连接，使其更直接对应原文“我必兴起……在你之后……，他将出自你的众子”的结构；不改变其直接历史性的王朝应许，也不添加弥赛亚性解释。脚注标记位置及内容均保留并继续对应死亡委婉语。
