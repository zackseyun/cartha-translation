base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/011.yaml
  text: And it shall be[a], when your days are fulfilled to go to be with your fathers, that I will raise up your offspring after you, who shall be one of your sons, and I will establish his kingdom.
translation:
  language: zh_hans
  text: 你在世的日子满了、要到你列祖那里去的时候[a]，我必在你之后兴起你的后裔，就是你众子中的一个；我必坚立他的国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“与你的列祖同去”，是指死亡并归到祖先那里的一种希伯来委婉说法。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: ……的时候
  rationale: 这一组合引出将来的时间从句。汉语以“……的时候”自然表达，无须机械译出句首连接语。
- source_word: מָלְאוּ יָמֶיךָ
  choice: 你在世的日子满了
  rationale: 保留“日子满了”这一庄重的希伯来表达，并以“在世”帮助现代读者理解这是指寿数终结。
- source_word: לָלֶכֶת עִם אֲבֹתֶיךָ
  choice: 到你列祖那里去
  rationale: 原文直译为“与你的列祖同去”，是死亡并归到祖先那里的委婉说法；正文采用自然的现代汉语，脚注说明原文措辞。
- source_word: וַהֲקִימוֹתִי
  choice: 我必兴起
  rationale: 此处使役形式表示使继承者兴起；译作“兴起”也与后文的“坚立”区分开来。
- source_word: זַרְעֲךָ
  choice: 你的后裔
  rationale: “后裔”既可表达 זרע 的集合含义，也可由下文限定为大卫众子中的一人，不使用现代汉语中容易误解的字面译法“种子”。
- source_word: אַחֲרֶיךָ
  choice: 接续你
  rationale: 在王朝继承语境中自然表达“在你之后”，明确指出后裔将成为继承者。
- source_word: אֲשֶׁר יִהְיֶה מִבָּנֶיךָ
  choice: 他将是你众子中的一个
  rationale: 明确保留介词 מן 的部分意义，表明应许所指的是大卫众子中的一人。
- source_word: וַהֲכִינוֹתִי
  choice: 我必坚立
  rationale: 表达使王国稳固、确立之意，并保持盟约语境中的庄重语气。
- source_word: מַלְכוּתוֹ
  choice: 他的国
  rationale: “国”涵盖王朝统治及其领域，比仅指职位的“王权”更符合此处语境。
theological_decisions:
- issue: 大卫王朝应许及其可能具有的弥赛亚意义
  choice: 正文按直接历史语境译为大卫众子中一位继承者及其国被坚立
  alternative: 在正文中加入明确的弥赛亚称谓或解释
  rationale: 原文首先指向大卫亲生众子中的继承者。更广泛的弥赛亚意义应由正典语境展开，不宜由译文预先加入。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“日子满了”“兴起”“坚立”等表达保留王朝应许的肃穆语气；分号将后裔应许与其身份说明清楚连接。
