  naturalness: 原文庄重、通顺。“到你列祖那里去”适合正文的委婉语体，脚注足以说明其含义。修订后以“在你之后”表达时间及王朝承继，较“接续你”更贴近原文的 אַחֲרֶיךָ，并使句法连接更自然。
  terminology: “后裔”“兴起”“坚立”“他的国”均恰当保留王朝应许的用语及语域。“列祖”是此类经文中自然且庄重的对应语。“众子”可保留，准确表达复数的“儿子们”。
