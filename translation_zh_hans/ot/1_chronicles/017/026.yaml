  text: וְ/עַתָּ֣ה יְהוָ֔ה אַתָּה ה֖וּא הָ/אֱלֹהִ֑ים וַ/תְּדַבֵּר֙ עַֽל עַבְדְּ/ךָ֔ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/026.yaml
  text: And now[a], Yahweh, you are God, and you have spoken this good thing concerning your servant.
translation:
  language: zh_hans
  text: 如今，雅威啊，你就是上帝；你已经论到你的仆人，说了这件美好的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你已经论到你的仆人，说了这个美好的应许。”希伯来文直译为：“你已经论到你的仆人，说了这件美好的事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 在祷告话语中承接前文并转入当前的确认；现代汉语用“现在”即可自然表达这一推进，句位也保留了承接作用。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文所用的立约之名，而不以称号代替。
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: 你就是上帝
  rationale: “就是”自然体现 אַתָּה הוּא 的强调和身份确认；“上帝”在现代汉语中庄重清楚。
- source_word: וַתְּדַבֵּר
  choice: 你已经……说了
  rationale: 指上帝先前所说、如今仍与祷告内容相关的话；“已经……说了”保留说话行为，不直接释作“应许”。
- source_word: עַל עַבְדְּךָ
  choice: 向你的仆人
  rationale: עַל 在此标示话语涉及的对象；结合上下文，上帝所说的好事关乎并面向大卫。“仆人”准确表达祷告中的谦卑自称。
- source_word: הַטּוֹבָה הַזֹּאת
  choice: 这件美好的事
  rationale: 希伯来文直译为“这美好的〔事〕”；补出量词和中心词，使汉语自然，同时避免在正文中将其明确解释为“应许”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以较直接地呈现该专名，不以“主”等称号取代。
- issue: הַטּוֹבָה הַזֹּאת 是否明确译作“应许”
  choice: 这件美好的事
  alternative: 这个美好的应许
  rationale: 上下文确实指向上帝对大卫所作的美好应许，但“应许”并非该短语明说的词义。正文保留原文较宽的表达，并以脚注说明语境性译法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“雅威啊”保留直接呼告；分号呈现神的身份确认与其先前发言之间的紧密关系。
