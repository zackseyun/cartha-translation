base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
translation:
  language: zh_hans
  text: 现在，你要对我的仆人大卫这样说：‘万军之雅威如此说：我把你从牧场[a]、从跟随羊群的事上带来，使你作我民以色列的领袖[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牧场”或译“羊圈”。
    reason: lexical_alternative
  - marker: b
    text: “领袖”或译“统治者”或“首领”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以，现在
  rationale: 既保留连接词所表达的承接意味，也保留“现在”的时间与话语转换功能。
- source_word: כֹּה תֹאמַר
  choice: 你要……这样说
  rationale: 用自然的现代汉语表达先知传话公式，同时保留命令语气。
- source_word: לְעַבְדִּי
  choice: 对我的仆人
  rationale: 此处是上帝对大卫的尊荣性、关系性称谓；“仆人”比“奴隶”更符合上下文。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”直接呈现神圣四字名；“万军之”保留צְבָאוֹת可涵盖天上众军与军旅力量的宽广含义。
- source_word: לְקַחְתִּיךָ
  choice: 我把你……带出来
  rationale: 表达לקח所强调的上帝主动选取并带走大卫，且与后文身份提升自然衔接。
- source_word: מִן הַנָּוֶה
  choice: 从牧场
  rationale: 在牧羊语境中，נָוֶה最自然地指牧放之地；“牧场”简明且保留田野意象。
- source_word: מִן אַחֲרֵי הַצֹּאן
  choice: 从跟随羊群的生活中
  rationale: 保留“跟在羊群后面”的原文图像，同时以“生活中”使汉语句意完整自然，指大卫原先的牧羊身份。
- source_word: לִהְיוֹת נָגִיד
  choice: 使你作……领袖
  rationale: נָגִיד指受任命而带领、治理的人；“领袖”保留其领导权威，又不将其过早限定为技术性的王号。
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: 我民以色列的
  rationale: 自然呈现以色列既是雅威的子民，也是大卫受命领导的对象。
theological_decisions:
- issue: 神圣四字名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较直接地音译学界通常重构的读音，并避免以称号代替专名。
- issue: 大卫的称谓עַבְדִּי
  choice: 我的仆人大卫
  alternative: 我的奴仆大卫
  rationale: 这里强调大卫蒙召服事上帝的关系和身份，而不是突出被奴役的社会地位。
- issue: נָגִיד所表达的大卫身份
  choice: 领袖
  alternative: 统治者；首领
  rationale: 原词兼有领导和治理权威，却不必在本句中等同于完整的王号；“领袖”保留这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留先知传话公式和牧羊图像；引语层次以中文引号清楚标示。
