id: 1CH.13.6
reference: 1 Chronicles 13:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֨עַל דָּוִ֤יד וְ/כָל יִשְׂרָאֵל֙ בַּעֲלָ֔תָ/ה אֶל קִרְיַ֥ת יְעָרִ֖ים אֲשֶׁ֣ר לִ/יהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵת֩ אֲר֨וֹן הָ/אֱלֹהִ֧ים יְהוָ֛ה יוֹשֵׁ֥ב הַ/כְּרוּבִ֖ים אֲשֶׁר נִקְרָ֥א שֵֽׁם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/006.yaml
  text: So David and all Israel went up to Baalah[a], that is, to Kiriath-jearim, which belongs to Judah, to bring up from there the ark of God, Yahweh who is enthroned above the cherubim, whose name is called upon it.
translation:
  language: zh_hans
  text: 于是，大卫和全体以色列人上到巴拉，就是属犹大的基列·耶琳，要从那里把上帝的约柜运上来；这约柜是以坐在基路伯之上的耶和华的名被称呼的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句希伯来文十分简略，直译近于“以名被称呼的”。“名”与“坐在基路伯之上的耶和华”的关系，以及约柜是否明确是被称作带有该名的对象，均有不同理解。也可译作：“耶和华的名在这约柜上被称呼”，或“这约柜是以那名命名的”。参看《撒母耳记下》6:2。
    reason: 保留אֲשֶׁר נִקְרָא שֵׁם在先行词、省略成分、被动结构及神名与约柜关系上的真实歧义，同时避免正文将其改释为“相称”。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上到
  rationale: 保留עלה的上行方向感，也符合前往高地城镇的叙事语境。
- source_word: בַּעֲלָתָה אֶל קִרְיַת יְעָרִים
  choice: 上到巴拉，也就是……基列·耶琳
  rationale: 将两个地名理解为同一地点的同位说明；巴拉是基列·耶琳的别名。
- source_word: אֲשֶׁר לִיהוּדָה
  choice: 属犹大的
  rationale: 介词ל表示与犹大支派或其地域的归属关系；此译法保留归属意味。
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: 要从那里把……运上来
  rationale: 使役式不定词表示把约柜带上去；“运上来”在现代汉语中自然，并与前面的“上到”形成词义呼应。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: “约柜”是现代中文圣经语境中对圣柜的通行称呼；“上帝”直接对应אֱלֹהִים。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，而不以头衔代替。
- source_word: יוֹשֵׁב הַכְּרוּבִים
  choice: 坐在基路伯之上的
  rationale: 保留ישׁב“坐着”的王权意象；希伯来文未明说“之间”，故不补入该方位。
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: 这约柜与……之名相称
  rationale: 原文省略而含混，可能指约柜以耶和华之名被称呼或归于其名；正文采用可读但不过度限定具体仪式动作的表达，并以脚注保留其他理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用普通简体中文读者最熟悉且具有专名性质的“耶和华”；“雅威”是更接近学术重构发音的可选形式。
- issue: יוֹשֵׁב הַכְּרוּבִים中基路伯与耶和华宝座的空间关系
  choice: 坐在基路伯之上
  alternative: 坐在基路伯之间／临在于基路伯中间
  rationale: 无介词结构只表达耶和华与基路伯的紧密关系；“之上”符合约柜宝座意象，但不把传统的“之间”写入原文。
- issue: 末句אֲשֶׁר נִקְרָא שֵׁם的所指和句法
  choice: 这约柜与……之名相称
  alternative: 耶和华的名在这约柜上被称呼／这约柜是以那名命名的
  rationale: 希伯来文高度省略，关系代词的先行词及“名被称呼”的具体含义并不完全明确。正文力求通顺且保留约柜与神名的关联，脚注列出更直译的可能读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“基列·耶琳”以间隔号呈现复合音译地名；“基路伯”和“约柜”沿用中文圣经读者熟悉的术语。正文避免古奥的“其名被称于其上”，并用脚注交代原文的省略和多种可能理解。
