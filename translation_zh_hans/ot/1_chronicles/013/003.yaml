base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/003.yaml
  text: And let us bring the ark of our God back to us[a], for we did not seek it in the days of Shaul.
translation:
  language: zh_hans
  text: 我们把我们上帝的约柜运回到我们这里来吧[a]，因为在扫罗的日子，我们没有寻求它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向它求问”。也可理解为“寻求他”或“向他求问”，即指上帝。希伯来语动词既可表示“寻求”，也可表示“求问”；宾语后缀可自然回指“约柜”，但经文也可能意指借着约柜寻求上帝。
    reason: 保留דרש的词义范围，以及宾语具体回指约柜或隐含指向上帝的解释张力。
lexical_decisions:
- source_word: וְנָסֵבָּה
  choice: 也要……运回
  rationale: 该词为第一人称复数劝愿式；结合宾语“约柜”和方向语“到我们这里”，表达共同提议把约柜运回来。中文用“也要……运回”自然地保留劝议和承接语气。
- source_word: אֶת אֲרוֹן אֱלֹהֵינוּ
  choice: 我们上帝的约柜
  rationale: 按构造链及第一人称复数后缀直译；“约柜”是现代中文圣经语境中清楚而通行的名称。
- source_word: אֵלֵינוּ
  choice: 到我们这里
  rationale: 介词及第一人称复数后缀表示朝向说话群体；“到我们这里”比单说“归我们”更明确保留空间方向。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述提议的理由，现代中文以“因为”表达最清楚。
- source_word: לֹא דְרַשְׁנֻהוּ
  choice: 我们没有寻求它
  rationale: דרש可指寻求、求问或查问；宾语后缀在语法上最自然地回指阳性单数名词“约柜”。“寻求它”保留原文具体所指，也不抹去借约柜寻求上帝的潜在含义。
- source_word: בִּימֵי שָׁאוּל
  choice: 在扫罗的日子
  rationale: 保留希伯来语“在某人的日子”的时代性表达；人名שָׁאוּל采用现代中文通行译名“扫罗”。
theological_decisions:
- issue: “没有寻求”的宾语
  choice: 在正文中译为“它”，回指约柜
  alternative: 译为“他”，明确指上帝；或译为“向它／他求问”
  rationale: 阳性单数后缀最自然地与前面的“约柜”一致，而希伯来语语法性别不能单凭形式证明其所指是上帝。正文保留“它”可避免把神学推论直接写进译文；脚注说明“求问它／他”的可能性。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“也要”承接上文的共同商议；“运回到我们这里”明确约柜的移动方向。正文不将语法宾语神学化为“他”，并用脚注保存原文的词义和指称歧义。
