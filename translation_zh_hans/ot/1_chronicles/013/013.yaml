base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/013.yaml
  text: So David did not bring the ark to himself[a], into the City of David; instead[b], he turned it aside to the house of Obed-edom the Gittite.
translation:
  language: zh_hans
  text: 于是，大卫没有把约柜运到自己那里[a]，也就是大卫城；反而把约柜转到[b]迦特人俄别以东的家中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有把约柜移走到自己那里。”原文动词可指“移走”或“挪移”，按本节语境也可理解为“运到”或“带到”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把约柜转向”或“把约柜改送到”俄别以东的家中。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: 运到
  rationale: 该动词使役式可表示“移走、使离开、转移”。本节以约柜为宾语，随后说明目的地，语境所指是大卫没有把约柜继续运往自己所在的大卫城；“运到”在现代汉语中自然，同时以脚注保留较字面的可能译法。
- source_word: אֵלָיו
  choice: 自己那里
  rationale: 介词加第三人称阳性单数后缀直译为“他那里”；因主语是大卫，此处具有反身意义。“自己那里”清楚表达约柜原本要运往大卫所在之处。
- source_word: עִיר דָּוִיד
  choice: 大卫城
  rationale: 这是该地名在现代中文圣经语境中的通行、简洁译法。
- source_word: וַיַּטֵּהוּ
  choice: 把约柜转送
  rationale: נָטָה可指“伸展、倾斜、转向”。这里是使约柜偏离原定路线，改送到另一地点；“转送”既自然，又保留改变行进方向的具体含义。
- source_word: בֵּית
  choice: 家中
  rationale: בַּיִת既可指房屋，也可指家庭或家户。约柜被安置在某人的住所，译作“家中”在现代汉语中最自然，同时不排除房屋与家户两层含义。
- source_word: עֹבֵד אֱדֹם
  choice: 俄别以东
  rationale: 采用中文圣经传统中辨识度较高的人名音译。
- source_word: הַגִּתִּי
  choice: 迦特人
  rationale: 该族属形容词指与迦特有关的人；“迦特人”直接、简洁，并保留原文未进一步说明其关系性质的表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就是大卫城”保留“自己那里”与“大卫城”之间的解释关系；分号和“反而”清楚呈现大卫改变原定路线的叙事转折。
