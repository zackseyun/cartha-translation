  yaml_path: translation/ot/1_chronicles/013/004.yaml
  text: And all the assembly said to do so[a], for the matter was right in the eyes of all the people.
translation:
  language: zh_hans
  text: 全体会众都说要这样做[a]，因为这事在全体百姓看来是对的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“全体会众都说：‘应当这样做。’”希伯来语的措辞表达会众赞同这项提议。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 说
  rationale: 采用אמר的基本义“说”，保留会众以言语作出回应的动作；上下文同时表明这是对提议的赞同。
- source_word: כָל הַקָּהָל
  choice: 全体会众
  rationale: קָהָל指聚集起来的群体；“会众”在现代中文中自然且庄重，“全体”对应כָל。
- source_word: לַעֲשׂוֹת כֵּן
  choice: 要这样做
  rationale: 自然表达“去如此行”的意思，并与“说”连用，传达会众表示应当照提议办理。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出会众作出回应的理由。
- source_word: יָשַׁר
  choice: 看为正
  rationale: 表达יָשַׁר在此处“正确、妥当”的评价意义，并与后面的“在……眼中”构成自然的圣经汉语表达。
- source_word: הַדָּבָר
  choice: 这事
  rationale: דָּבָר在此指正在商议的事项或提议；“这事”简明自然，又不把含义限定为正式提案。
- source_word: בְּעֵינֵי
  choice: 在……眼中看为
  rationale: 保留希伯来语以“眼中”表示判断或评价的习语，同时使中文句法通顺。
- source_word: כָל הָעָם
  choice: 全体百姓
  rationale: עָם指整体民众；“百姓”符合本段以色列全民的语境，“全体”对应כָל。
