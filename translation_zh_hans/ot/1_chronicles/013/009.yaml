  text: When they came to the threshing floor of Kidon[a], Uzza reached out his hand to take hold of the ark, because the oxen stumbled.
translation:
  language: zh_hans
  text: 他们来到基顿的禾场时，乌撒伸手要抓住约柜，因为牛失了蹄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “失了蹄”也可译作“滑了脚”。希伯来语动词可表示滑脱或使东西掉落；这里描写牛突然失稳的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן כִּידֹן
  choice: 基顿的禾场
  rationale: גֹּרֶן 指打谷、扬场用的禾场；כִּידֹן 是地名，按名称音译为“基顿”。属格结构自然译作“基顿的禾场”。
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: 伸手
  rationale: שׁלח 与“手”连用表示把手伸出去；“伸手”简洁自然，并保留具体动作。
- source_word: לֶאֱחֹז
  choice: 要抓住
  rationale: אחז 表示抓住、握住；此处是不让约柜失稳，并无敌意。“抓住”准确而自然。
- source_word: הָאָרוֹן
  choice: 约柜
  rationale: 原文此处只有“柜”，但在现代中文圣经语境中，“约柜”是该圣物的常用名称，且没有补入本节未见的“上帝的”等修饰语。
- source_word: כִּי
  choice: 因为
  rationale: כִּי 在这里引出乌撒伸手的原因，译作“因为”关系清楚。
- source_word: שָׁמְטוּ
  choice: 失了蹄
  rationale: שׁמט 可涉及滑脱、失稳或使某物掉落；以牛为主语时，“失了蹄”自然描写牲畜脚下打滑、步态失稳，同时不把动作过度限定为完全跌倒。脚注保留“滑了脚”的可能表达。
- source_word: הַבָּקָר
  choice: 牛
  rationale: בָּקָר 可泛指牛群；本处指拉车的牛。现代汉语用“牛”已足够明确，无须添加原文没有的数量信息。
