  yaml_path: translation/ot/1_chronicles/013/001.yaml
  text: And David consulted with the commanders of the thousands and the hundreds[a], with every leader.
translation:
  language: zh_hans
  text: 大卫与千夫长、百夫长，以及各位领袖商议。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: 商议
  rationale: 该词的尼法勒式在此表示共同磋商、谋议；“商议”自然简洁，也保留了彼此参与讨论的意味。
- source_word: עִם
  choice: 同
  rationale: 该介词表示大卫与这些人一同参与商议；“同”符合庄重而现代的叙事语体。
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: 千夫长、百夫长
  rationale: 原文直指统管“千”和“百”之单位的长官；汉语“千夫长、百夫长”清楚表达其军事—行政职分，比直译“千的首领、百的首领”更自然。
- source_word: לְכָל נָגִיד
  choice: 就是所有的领袖
  rationale: נָגִיד泛指居领导地位的人。“所有的领袖”保留其广泛含义；将לְ理解为说明或概括前述参与者，“就是”使汉语关系清楚，同时不把它另译为一个语义突兀的间接宾语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“千夫长、百夫长”沿用读者熟悉的组织职衔；“就是所有的领袖”按原文末语概括前述人员，不额外引入神学解释。
