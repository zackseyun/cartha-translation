id: 1CH.13.8
reference: 1 Chronicles 13:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/דָוִ֣יד וְ/כָל יִשְׂרָאֵ֗ל מְשַׂחֲקִ֛ים לִ/פְנֵ֥י הָ/אֱלֹהִ֖ים בְּ/כָל עֹ֑ז וּ/בְ/שִׁירִ֤ים וּ/בְ/כִנֹּרוֹת֙ וּ/בִ/נְבָלִ֣ים וּ/בְ/תֻפִּ֔ים וּ/בִ/מְצִלְתַּ֖יִם וּ/בַ/חֲצֹצְרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/008.yaml
  text: And David and all Israel were celebrating before God with all their might[a], with songs, lyres, harps, tambourines, cymbals, and trumpets.
translation:
  language: zh_hans
  text: '大卫和全体以色列人在神面前竭尽全力欢庆[a]，唱着歌，弹琴鼓瑟，击鼓敲钹，吹响号筒。


    [a] “欢庆”也可译作“欢喜嬉戏”；希伯来语动词可指节庆中欢乐活跃的举动。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢庆”也可译作“欢喜嬉戏”；希伯来语动词可指节庆中欢乐活跃的举动。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: 欢庆
  rationale: 该分词可表示嬉戏、欢喜或节庆中的欢乐活动；本节描写伴随歌唱和乐器的宗教庆典，“欢庆”自然地表达公开、热烈的庆祝，又不把动作局限为演奏乐器。脚注保留其“嬉戏／欢喜”的语义幅度。
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: 在神面前
  rationale: 直接保留空间兼敬拜性的表达，表明众人在神的临在中欢庆。
- source_word: בְּכָל עֹז
  choice: 竭尽全力
  rationale: עֹז表示力量、能力；“竭尽全力”符合现代汉语习惯，并传达庆典活动的热烈程度。
- source_word: שִׁירִים
  choice: 唱着歌
  rationale: 原文为复数名词“诗歌／歌曲”；汉语在一系列音乐活动中用“唱着歌”较自然，同时保留其歌曲含义。
- source_word: כִנֹּרוֹת
  choice: 琴
  rationale: כִּנּוֹר是里拉琴一类的弦乐器；“琴”简洁易懂，并与下文的“瑟”区分。
- source_word: נְבָלִים
  choice: 瑟
  rationale: נֵבֶל是与כִּנּוֹר有别的弦乐器，具体构造不完全确定；“瑟”是庄重而通行的汉语对应词，可维持两种弦乐器的区别。
- source_word: תֻפִּים
  choice: 鼓
  rationale: תֹּף指框鼓或类似手鼓的打击乐器；“鼓”清楚易懂，且不武断限定其精确形制。
- source_word: מְצִלְתַּיִם
  choice: 钹
  rationale: 这是该金属打击乐器的标准、明确对应词。
- source_word: חֲצֹצְרוֹת
  choice: 号筒
  rationale: 该词指礼仪中使用的直管号类乐器；“号筒”既通俗又保留古代礼仪乐器的色彩，不添加本节未明说的“银”。
- source_word: וְדָוִיד וְכָל יִשְׂרָאֵל
  choice: 大卫和全体以色列人
  rationale: 将“全以色列”按集体所指自然表达为“全体以色列人”，并保留大卫与全体民众共同参与的意思。
theological_decisions:
- issue: הָאֱלֹהִים的表达
  choice: 神
  alternative: 这位神
  rationale: 虽然希伯来语带冠词，但这里是对以色列之神的常规称呼；现代汉语用“神”最自然，不需生硬地译出冠词，也不改变所指。
- issue: מְשַׂחֲקִים在敬拜场景中的语义
  choice: 欢庆，并以脚注保留“欢喜嬉戏”的可能
  alternative: 嬉戏
  rationale: 上下文明确有诗歌和多种乐器，说明这是迎接约柜时热烈的公共庆典；“欢庆”最贴合语境，但原词较宽，不应把其欢乐、嬉戏的动态意味完全抹去，故在脚注中保留。
translation_notes:
  register: 采用现代、庄重且适合朗读的叙事语体。主句以“竭尽全力欢庆”清楚呈现强烈程度；后半句用“唱、弹、鼓、击、敲、吹”等自然汉语动词展开乐器清单，避免生硬的连续介词结构，同时不增添原文没有的乐器材质或具体形制。
