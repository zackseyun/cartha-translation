  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן הָ/אֱלֹהִ֜ים עִם בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם בְּ/בֵית֖/וֹ שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית עֹבֵֽד אֱדֹ֖ם וְ/אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/014.yaml
  text: And the ark of God remained with the household of Obed-edom[a], in his house, for three months. And Yahweh blessed the household of Obed-edom and all that belonged to him.
translation:
  language: zh_hans
  text: 神的柜留在俄别以东一家那里，在他家中停留了三个月。雅威赐福给俄别以东一家和他所有的一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 留在
  rationale: ישׁב可表示坐、居住或停留；这里描述约柜暂时安放三个月，用“留在”自然地表达持续处于某地，又不暗示永久居住。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 神的约柜
  rationale: 原文直译为“神的柜”；“约柜”是现代汉语读者熟悉且准确指称该圣物的用语，同时不擅自补入本节没有出现的“神的约”。
- source_word: עִם בֵּית עֹבֵד אֱדֹם
  choice: 在俄别以东一家那里
  rationale: בֵּית既可指房屋，也可指家属或家族。正文采用“一家”表达较可能的家庭、家眷含义，并以脚注保留“家宅”的可能。
- source_word: בְּבֵיתוֹ
  choice: 放在他家中
  rationale: 此处明确说明约柜所在的实际地点；“家中”保留具体空间含义。“放在”是汉语为衔接约柜与地点所需的自然表达。
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: 三个月
  rationale: 直接、自然地表达原文的时间长度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 用“雅威”音译四字神名，区别于普通称号，并保存原文直接使用专名的特点。
- source_word: אֶת בֵּית עֹבֵד אֱדֹם
  choice: 俄别以东一家
  rationale: 此处受赐福的对象较自然地理解为俄别以东的全家；脚注同时保留בֵּית可指房屋或家业的词义范围。
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: 也赐福给他所有的一切
  rationale: 原文范围宽泛，涵盖一切属于他的人或物；“他所有的一切”不把范围缩限为财物。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非称号；“雅威”较直接地音译该名，避免以称号代替，也不把传统形式的特定发音判断带入正文。
- issue: “神的约柜”是否补入“约”字
  choice: 神的约柜
  alternative: 神的柜
  rationale: 本节希伯来文是אֲרוֹן הָאֱלֹהִים，字面为“神的柜”。现代汉语中“约柜”已是该圣物的固定名称；此译法用于清楚指称，并不把较长的“神的约柜”希伯来语称号声称为本节原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。人名译作通行的“俄别以东”；句子保留原文先叙约柜停留、后叙雅威赐福的结构。
