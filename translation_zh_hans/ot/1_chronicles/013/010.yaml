base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/010.yaml
  text: Then Yahweh’s anger burned against Uzza[a], and he struck him down because he had put out his hand to the ark; and he died there before God.
translation:
  language: zh_hans
  text: 雅威向乌撒发怒，击杀他，因为他向约柜伸手[a]；他就死在那里，在上帝面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向约柜伸出手。”
    reason: 希伯来语短语 שָׁלַח יָדוֹ עַל 直指向约柜伸出手的动作；其是否实际触及约柜可由上下文推断，但本短语本身未直接说“触摸”。
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה בְּעֻזָּא
  choice: 雅威向乌撒发怒
  rationale: 希伯来语惯用语字面含有怒气“燃烧”之意，表示强烈发怒；现代汉语用“向……发怒”自然、庄重，也清楚保留怒气所针对的对象。专名 יְהוָה 音译为“雅威”。
- source_word: וַיַּכֵּהוּ
  choice: 击杀了他
  rationale: נכה 可指击打、击倒或击杀；紧接着经文明确说乌撒死亡，因此“击杀”准确传达此处动作的致命结果。
- source_word: עַל אֲשֶׁר
  choice: 因为
  rationale: 该短语在此引出施行审判的原因；“因为”简洁自然。
- source_word: שָׁלַח יָדוֹ עַל הָאָרוֹן
  choice: 他向约柜伸了手
  rationale: 直译其伸手朝向约柜的动作，不擅自补入动机，也不把原文未明说的“触摸”写入正文。
- source_word: הָאָרוֹן
  choice: 约柜
  rationale: 虽然原词本身是“柜”，上下文明确指神的约柜；“约柜”是现代汉语中清楚而通行的称呼。
- source_word: וַיָּמָת שָׁם
  choice: 他就死在那里
  rationale: 保留叙事结果和地点副词 שָׁם，不作额外渲染。
- source_word: לִפְנֵי אֱלֹהִים
  choice: 在上帝面前
  rationale: לִפְנֵי 表示“在……面前／临在中”；此译简洁庄重，并保留 אֱלֹהִים 与前文 יְהוָה 的用词差异。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”这一较贴近 Yahweh 的现代汉语音译，以专名呈现，不改译为称号“主”。
- issue: 同一节中 יְהוָה 与 אֱלֹהִים 的区别
  choice: 分别译为“雅威”和“上帝”
  alternative: 统一译作“雅威”或用代词替代后者
  rationale: 原文有意保留两个不同称谓；译文不将其调和，从而忠实呈现原文变化。
- issue: 乌撒伸手与约柜的关系
  choice: 正文译作“向约柜伸了手”
  alternative: 译作“伸手触摸约柜”
  rationale: 原文明确表达伸手所朝向或涉及的对象，但未在本句使用“触摸”一词；正文保留这一措辞张力，较具体的理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“击杀……他就死了”的原文推进，也保留“雅威”与“上帝”的称谓变化；脚注标记紧随其所解释的短语。
