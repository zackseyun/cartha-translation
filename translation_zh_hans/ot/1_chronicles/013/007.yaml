base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/007.yaml
  text: So they set the ark of God on a new cart from the house of Abinadab[a], and Uzza and Ahio were guiding the cart.
translation:
  language: zh_hans
  text: 他们从亚比拿达家把上帝的约柜安放在一辆新车上；乌撒和亚希约赶着这车[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赶着这车”也可译作“驾着这车”。希伯来语分词可表示引领或驾驶车辆。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּיבוּ
  choice: 抬出来，安放在
  rationale: 使役形在这里表示使约柜乘载于车辆上。结合来源短语“从亚比拿达家里”，译为“抬出来，安放在”既自然，也清楚呈现搬出并置于车上的动作。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: 按原文附属结构直译；“约柜”是该礼仪器物在现代汉语圣经语境中的通行名称。
- source_word: עַל עֲגָלָה חֲדָשָׁה
  choice: 在一辆新车上
  rationale: עֲגָלָה 指载货的车或车子；量词“一辆”符合现代汉语表达，并明确保留“新”的含义。
- source_word: מִבֵּית אֲבִינָדָב
  choice: 从亚比拿达家里
  rationale: מִן 表示来源；“家里”在此既可指住宅，也不排除家宅范围，比生硬的“房屋”更符合现代汉语。
- source_word: עֻזָּא
  choice: 乌撒
  rationale: 采用该希伯来人名通行的中文音译。
- source_word: אַחְיוֹ
  choice: 亚希约
  rationale: 采用该希伯来人名通行的中文音译，并与“亚希”一类近似名字作出区分。
- source_word: נֹהֲגִים בָּעֲגָלָה
  choice: 赶着这车
  rationale: נֹהֲגִים 是复数分词，可表示引领或驾驶；与车辆连用时，“赶着这车”是自然、具体的现代汉语表达，同时以脚注保留词义上的另一可能。
theological_decisions: []
