    issue: 未呈现“仍留下的”
    rationale: הַנִּשְׁאָרִים是“留下、仍存”的分词；仅作“住在”将原文关于这些同胞尚留在各地、未在当前集会中的限定信息省略。
  - severity: medium
    issue: 祭司和利未人所在城邑的中文表述含混且不自然
    rationale: “住在各自有郊野之城里的”容易让“各自”附着不明，也把“郊野”误作城邑的内部属性。应明确为住在“有郊野的城邑中”。
