  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לְ/כֹ֣ל קְהַ֣ל יִשְׂרָאֵ֗ל אִם עֲלֵי/כֶ֨ם ט֜וֹב וּ/מִן יְהוָ֣ה אֱלֹהֵ֗י/נוּ נִפְרְצָה֙ נִשְׁלְחָ֞ה עַל אַחֵ֣י/נוּ הַ/נִּשְׁאָרִ֗ים בְּ/כֹל֙ אַרְצ֣וֹת יִשְׂרָאֵ֔ל וְ/עִמָּ/הֶ֛ם הַ/כֹּהֲנִ֥ים וְ/הַ/לְוִיִּ֖ם בְּ/עָרֵ֣י מִגְרְשֵׁי/הֶ֑ם וְ/יִקָּבְצ֖וּ אֵלֵֽי/נוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/002.yaml
  text: And David said to all the assembly of Israel[a], “If it seems good to you, and if it is from Yahweh our God, let us send word to our brothers who remain in all the lands of Israel, and also to the priests and Levites with them in the cities of their pasturelands[d][c][b], that they may gather to us.”
translation:
  language: zh_hans
  text: 大卫对以色列全体会众说：“你们若认为这样好，并且这事若出于耶和华我们的神，我们就广泛派人去通知[a]仍留在以色列各地[c]的弟兄[b]，也通知住在有郊野的城邑中的祭司和利未人[d]，让他们聚集到我们这里来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“让我们突破出去；让我们派遣”，在这里可能表示广泛派人传达消息。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”是代表性称谓，泛指以色列同胞。
    reason: lexical_alternative
  - marker: c
    text: 原文作复数“以色列的各片土地”，可理解为“以色列各地区”。
    reason: lexical_alternative
  - marker: d
    text: “郊野”指划给这些城邑的城外开放土地，常可用作牧场。
    reason: cultural_note
lexical_decisions:
- source_word: קְהַל
  choice: 全体会众
  rationale: 指聚集或作为整体被召集的以色列群体；“全体会众”自然表达全国性共同体，又避免带入后世教会制度色彩。
- source_word: אִם עֲלֵיכֶם טוֹב
  choice: 你们若认为这样好
  rationale: 这是征求认可的惯用表达；译文保留条件语气，并采用现代汉语自然说法。
- source_word: וּמִן יְהוָה אֱלֹהֵינוּ
  choice: 并且这事若出于耶和华我们的神
  rationale: 原文省略与前一条件相应的谓语；补出“这事若出于”可清楚表达百姓认可与神许可并列的结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的专名形式来呈现四字神名，而不以“主”代替。
- source_word: נִפְרְצָה נִשְׁלְחָה
  choice: 我们就广泛派人去通知
  rationale: 两个劝勉式动词连用，字面近于“让我们突破出去；让我们派遣”；结合下文召集众人的目的，译作广泛派人通知，既表达行动范围，也不把隐含的受派对象写死。
- source_word: עַל אַחֵינוּ
  choice: 通知……弟兄
  rationale: 在“派遣”的语境中，介词短语指向受通知者；“弟兄”保留原文亲属称谓，泛指同胞以色列人。
- source_word: הַנִּשְׁאָרִים
  choice: 住在
  rationale: 该分词本义为“留下、仍在”；在此指散居于以色列各地、尚未来到聚集处的人。正文按语境自然表达为“住在”，脚注对代表性称谓另作说明。
- source_word: בְּכֹל אַרְצוֹת יִשְׂרָאֵל
  choice: 以色列各地
  rationale: 用“各地”体现原文“土地、地区”的复数及分布范围，比直译“各片土地”更合现代汉语。
- source_word: מִגְרְשֵׁיהֶם
  choice: 郊野
  rationale: 指划给相关城邑、位于城外的开放土地，常用于放牧；“郊野”不把用途过度限定为牧场。
- source_word: וְיִקָּבְצוּ אֵלֵינוּ
  choice: 让他们聚集到我们这里来
  rationale: 未完成式在召集语境中表达目的或预期结果；译文保留朝向说话者一方的方向含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文采用中文圣经传统中最广为普通读者识别的专名“耶和华”，而不以称号“主”替代；“雅威”虽更接近常见学术拟音，但在普通现代中文中识别度较低。
- issue: 百姓赞同与神许可之间的关系
  choice: “你们若认为这样好，并且这事若出于……”保留两个并列条件
  alternative: 把后半句译成确定陈述“这事出于耶和华”
  rationale: 希伯来语第二分句承接前面的条件结构，不能把神的认可改写成大卫已确定的宣告；译文保留原文的审慎与张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留大卫向全体会众征求认可、并寻求神许可的条件句式；对希伯来语较突兀的动词连用作适度意译，同时以脚注保存字面形态和可能含义。
