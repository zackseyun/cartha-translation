revisions:
- from: 大卫对以色列全体会众说：“你们若认为这样好，并且这事若出于耶和华我们的神，我们就广泛派人去通知[a]住在以色列各地[c]的弟兄[b]，也通知在他们中间、住在各自有郊野之城里的祭司和利未人[d]，让他们聚集到我们这里来。”
  to: 大卫对以色列全体会众说：“你们若认为这样好，并且这事若出于耶和华我们的神，我们就广泛派人去通知[a]仍留在以色列各地[c]的弟兄[b]，也通知住在有郊野的城邑中的祭司和利未人[d]，让他们聚集到我们这里来。”
  rationale: 修订恢复了“仍留下的”这一原文分词信息，并重组祭司、利未人及其城邑的短语，使其符合原文句法且更自然清楚。保留“广泛派人去通知”及其脚注，以呈现נִפְרְצָה נִשְׁלְחָה这一较难确定的动词连用，而不将其解释过度固定。
