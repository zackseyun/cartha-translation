base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/012.yaml
  text: And David feared God that day[a], saying, “How can I bring the ark of God to me?”
translation:
  language: zh_hans
  text: 那一天，大卫惧怕上帝[a]，说：“我怎能把上帝的约柜带到我这里来呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“害怕上帝”；希伯来语动词按上下文可表示害怕、畏惧或敬畏。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: 惧怕
  rationale: 该动词源自 ירא。鉴于上下文紧接乌撒死亡所显明的神圣审判，这里主要表达大卫因上帝而生的畏惧，同时“惧怕”也没有完全排除敬畏的意味。
- source_word: אֶת הָאֱלֹהִים
  choice: 上帝
  rationale: אֵת 是直接宾语标记，הָאֱלֹהִים 在此指上帝；现代汉语以“惧怕上帝”自然表达其宾语关系。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 准确保留标准时间短语，并以前置时间状语形成自然、庄重的现代汉语叙事。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出直接引语；译作“说”简洁自然，不额外增添话语关系。
- source_word: הֵיךְ
  choice: 怎能
  rationale: 该疑问词在这里询问实现此事的方式或可能性；“怎能”既自然，也可保留实际困难与不敢贸然行事的语气。
- source_word: אָבִיא
  choice: 接……来
  rationale: בוא 的使役式意为“使……来到、带来”。约柜正在被运往大卫所在之处，汉语“接……来”自然表达这一移动，同时不把具体运输方式写入正文。
- source_word: אֵלַי
  choice: 到我这里来
  rationale: 直译为“到我这里”；此表达保留目的地究竟偏重大卫本人、住处还是其城邑的含混性。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: 以现代汉语自然的领属结构翻译该构词链；“约柜”是清楚而通行的圣经用语。
theological_decisions:
- issue: 大卫面对上帝审判时反应的性质
  choice: 译作“惧怕上帝”
  alternative: “敬畏上帝”或“害怕上帝”
  rationale: 上下文是乌撒之死，因此不可将其弱化为单纯敬 reverence；但“惧怕”又比“害怕”更能保留 ירא 可能含有的敬畏色彩，从而维持神圣恐惧中的神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“那一天”前置符合汉语叙事习惯；直接引语以“呢”呈现真实疑问语气，但不添加解释。
