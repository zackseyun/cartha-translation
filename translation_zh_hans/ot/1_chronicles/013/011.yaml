base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/011.yaml
  text: And David was angry because Yahweh had broken out against Uzza[a]; so he called that place Perez-uzza to this day.
translation:
  language: zh_hans
  text: 大卫就发怒，因为雅威向乌撒造成了一次破口；于是他给那地方起名叫“毗列斯乌撒”[a]，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毗列斯乌撒”可理解为“向乌撒的破口”或“在乌撒身上的爆发”。这个地名呼应前半句中“造成破口”的希伯来语同源措辞，含有突然冲破、爆发之意。
    reason: 说明正文中难以完全再现的希伯来语同源文字游戏，以及地名与前句行动描述之间的词源关联。
lexical_decisions:
- source_word: וַיִּחַר לְדָוִיד
  choice: 大卫很恼怒
  rationale: 希伯来语习语 חרה ל 表示怒气被激起。“很恼怒”以自然的现代汉语保留其情绪力度；“心里不悦”则可能过弱。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出大卫恼怒的原因，“因为”清楚保留因果关系。
- source_word: פָרַץ יְהוָה פֶּרֶץ בְּעֻזָּא
  choice: 雅威向乌撒猛然冲击
  rationale: 动词 פָרַץ 与同源名词 פֶּרֶץ 构成“冲破／破口／爆发”的文字呼应，强调突然而猛烈的行动。正文采用自然且保留动态意象的“猛然冲击”，不擅自加入原文没有明说的“发怒”或“击杀”；同源文字游戏在脚注中说明。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见汉语音译处理，保留其作为专名的性质，而不以称号替代。
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: 于是他给那地方起名叫
  rationale: 这是常见的命名公式；“给那地方起名叫”符合现代汉语习惯，“于是”也自然承接前句。
- source_word: פֶּרֶץ עֻזָּא
  choice: 毗列斯·乌撒
  rationale: 正文音译地名，以保留其专名性质；名称的含义及其与前句的同源文字游戏在脚注中交代。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留标准的时间表达，表示该地名到作者所处时代仍在使用。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”可将其作为以色列之神的专名呈现，避免用称号取代，也不把传统音译“耶和华”当作原始读音。
- issue: 雅威对乌撒之行动的具体性质
  choice: 向乌撒猛然冲击
  alternative: 击杀乌撒；向乌撒爆发烈怒；在乌撒身上造成破口
  rationale: 本节用 פָרַץ／פֶּרֶץ 描写突然冲破或爆发的行动，却未在本句直接使用“杀”或“怒”一词。译文保留动作的猛烈性和一定的语义张力，不依据上下文把隐含结果或动机直接写入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“很恼怒”直接表达情绪；“猛然冲击”保留原文突然、猛烈的动态意象，同时避免生硬照搬同源词。人名和地名采用常见圣经汉语形式，神名译作“雅威”。
