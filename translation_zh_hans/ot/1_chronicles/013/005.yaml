  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接上文叙事；正文保留两个古代边界地名，并用脚注说明其可能含义。脚注标记按正文出现顺序排列，以纠正咨询层中标记与脚注内容错位的问题。
