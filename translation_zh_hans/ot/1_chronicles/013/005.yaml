base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/005.yaml
  text: So David assembled all Israel[a], from the Shihor of Egypt to Lebo-hamath[b], to bring the ark of God from Kiriath-jearim.
translation:
  language: zh_hans
  text: 于是，大卫召集全以色列人，从埃及的西曷[a]直到哈马口[b]，要把上帝的约柜从基列·耶琳运来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “埃及的西曷”是南部边界的名称；有人认为它指“埃及河”。
    reason: cultural_note
  - marker: b
    text: “哈马口”也可较直译为“进入哈马之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: 召集
  rationale: 该动词的使役形式表示使众人聚集；“召集”自然地表达大卫发起全国性聚集的行动。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全以色列人
  rationale: 保留希伯来文的全国性集合表达，同时用现代汉语中自然的形式指以色列全体，未必强调每一个个体都亲自到场。
- source_word: מִן שִׁיחוֹר מִצְרַיִם
  choice: 从埃及的西曷
  rationale: 将“西曷”按专名音译，保留原文对南部边界名称的表达，避免在正文中预先断定它具体是哪一条水道。
- source_word: וְעַד לְבוֹא חֲמָת
  choice: 直到哈马口
  rationale: 该短语字面涉及“进入哈马之处”，又用作固定的北部边界地名；“哈马口”兼顾地名功能和原文意象。
- source_word: לְהָבִיא
  choice: 要……运来
  rationale: 不定式表达目的；约柜是从别处迁移而来，因此“运来”在现代汉语中比泛指的“带来”更贴切。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: “约柜”是该宗教器物在中文中的通行名称；属格关系直译为“上帝的约柜”，不作额外神学扩展。
- source_word: מִקִּרְיַת יְעָרִים
  choice: 从基列·耶琳
  rationale: 按希伯来地名音译，并以间隔号清楚显示复合地名的两个成分。
theological_decisions: []
