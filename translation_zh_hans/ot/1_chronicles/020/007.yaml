  text: And when he taunted Israel[a], Jonathan son of Shimea, David’s brother, struck him down.
translation:
  language: zh_hans
  text: 他辱骂以色列[a]，示米亚（大卫的兄弟）的儿子约拿单就把他击杀了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“公然挑衅以色列”。这个希伯来语动词既可指以轻蔑的话辱骂，也可指公开蔑视、挑战。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: 辱骂
  rationale: חרף在这里指以轻蔑、挑衅的话攻击对方。“辱骂”自然地表达言语侮辱的核心含义，同时以脚注保留“公然挑衅”的可能语气。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文以国家名称作直接宾语，指以色列全体；直译为“以色列”既忠实又符合现代汉语表达。
- source_word: וַיַּכֵּהוּ
  choice: 把他击杀了
  rationale: נכה的使役式在此叙事语境中指致命击打。“击杀”兼顾击打动作及死亡结果，比单说“击打”更完整，又不像“杀死”那样完全抹去原词的动作色彩。
- source_word: יְהוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: בֶּן שִׁמְעָא
  choice: 示米亚的儿子
  rationale: 按希伯来文亲属结构翻译，并采用该人物通行的中文音译“示米亚”。
- source_word: אֲחִי דָוִיד
  choice: 大卫的哥哥
  rationale: אח本身通常可泛指兄弟；但历代志上2:13列出的次序显示示米亚年长于大卫，因此在本书语境中译作“哥哥”自然且具体。
