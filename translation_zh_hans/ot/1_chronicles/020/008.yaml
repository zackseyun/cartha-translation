base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/008.yaml
  text: These were born to Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: zh_hans
  text: 这些人是在迦特为拉法所生的[a]；他们倒在大卫和他臣仆手下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为拉法所生的”也可理解为“拉法的后裔”。“拉法”可能指一位祖先，也可能是一个宗族称号；它或许与利乏音人的传统有关。
    reason: 保留 לְהָרָפָא 所表达的谱系关系及“拉法”身份的歧义，不将其确定译为“巨人”或“利乏音人”。
lexical_decisions:
- source_word: אֵל
  choice: 这些人
  rationale: 这是回指前文所述战士的指示代词。汉语补出“人”，使指代自然清楚，并未增加新的身份信息。
- source_word: נוּלְּדוּ
  choice: 所生的
  rationale: 该词是 ילד 的尼法勒式，基本义为“出生”。此处也可表达宗族血统；译作“所生的”保留原文措辞，不直接把它解释成较宽泛的“后裔”。
- source_word: לְהָרָפָא
  choice: 拉法所生的
  rationale: 该短语可能指名为拉法的祖先，也可能指以“拉法”为称号的宗族。音译“拉法”并结合出生用语，可保留这种不确定性，避免直接译成“巨人”或复数的“利乏音人”。
- source_word: בְּגַת
  choice: 迦特的
  rationale: 原文介词 בְּ 表示地点。汉语将地点置于“拉法”之前，表达这些人与迦特相关，语序自然。
- source_word: וַיִּפְּלוּ
  choice: 他们都倒在
  rationale: נפל 的基本义是“倒下”。在战争语境中表示被杀或战败；“倒在……手下”既保留意象，也能自然传达战死之意。
- source_word: בְיַד
  choice: 在……手下
  rationale: 这是表示施事者的希伯来语惯用语。汉语“倒在某人手下”与战斗语境吻合，也保留“手”的意象。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עבד 基本义为“仆人、臣仆”。在王室和军事语境中可指为大卫效力的人；“臣仆”比“手下”更明确保留其服事君王的关系。
theological_decisions:
- issue: הָרָפָא 的身份
  choice: 保留为音译“拉法”，不将其明确等同于巨人或利乏音人
  alternative: 译作“巨人”“利乏音人”，或明确解释为名叫拉法的祖先
  rationale: 希伯来语采用带冠词的单数形式，所指可能是同名祖先，也可能是宗族称号；经文本身没有使用常见的复数“利乏音人”。音译可保留其与迦特巨人传统的可能联系，同时不消除原文的含混。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“倒在……手下”适合叙述战事；分号清楚连接出身说明与最终结局。脚注标记紧随存在解释歧义的“拉法所生的”。
