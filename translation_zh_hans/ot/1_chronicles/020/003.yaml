base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/003.yaml
  text: He brought out the people who were in it and put them to work with saws[a], iron tools, and axes. Thus David did to all the cities of the Ammonites[b]. Then David and all the people returned to Jerusalem.
translation:
  language: zh_hans
  text: 他把城里的人带出来，派他们用锯、铁制工具和斧头做工[a][b]。大卫这样处置了亚扪人的所有城。随后，大卫和众人都返回耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可理解为：“把他们置于锯、铁制的脱粒橇和切割工具之下。”有些人受《撒母耳记下》12:31的影响，认为这里是说大卫用这些器具处死了他们。
    reason: alternative_reading
  - marker: b
    text: 原文所列几种工具的确切含义不完全确定；“铁制工具和斧头”也可能泛指铁制的锐利器具或切割工具。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: 带出来
  rationale: 使役形通常表示“使出来、带出来”；这里指把城中的居民带出城，译法具体而自然。
- source_word: וַיָּשַׂר
  choice: 派他们……做工
  rationale: 此动词的含义有争议。《历代志上》的措辞可以理解为使俘虏使用所列工具劳作；正文采用这一可行读法，同时在脚注保留处死他们的另一种解释。
- source_word: בַּמְּגֵרָה
  choice: 用锯
  rationale: מְגֵרָה通常指锯；汉语以单数类称表达工具类别，简洁自然。
- source_word: בַּחֲרִיצֵי הַבַּרְזֶל
  choice: 铁制工具
  rationale: 该短语指铁制的锐利器具，但具体是哪一种工具并不确定；采用概括性译法，以免过度具体化。
- source_word: וּבַמְּגֵרוֹת
  choice: 和斧头
  rationale: 该词形及所指工具存在词义困难；上下文似乎列举另一类切割工具，“斧头”是合乎语境的译法，但不确定性在脚注中说明。
- source_word: וְכֵן יַעֲשֶׂה
  choice: 这样处置了
  rationale: 这一结构概括大卫对各城所采取的同样做法。“这样处置了”既符合叙事语境，也不额外规定其具体性质。
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: 亚扪人的所有城
  rationale: בְנֵי עַמּוֹן在此是民族称谓，现代汉语自然译为“亚扪人”。
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: 返回耶路撒冷
  rationale: שוב后接目的地，表示返回某处；这是现代汉语叙事中的标准表达。
theological_decisions:
- issue: 本节描述的是强迫劳动，还是用工具处死亚扪人
  choice: 正文译为大卫派被俘居民使用所列工具做工。
  alternative: 尤其参照《撒母耳记下》12:31时，也可理解为大卫把他们置于锯和铁器之下，用这些器具处死他们。
  rationale: 《历代志上》此处的希伯来文与平行经文并不完全相同，可以作较少暴力意味的理解。为尊重本节自身的措辞，正文不把《撒母耳记下》的读法直接移入；但鉴于另一读法在文本、伦理及神学层面都很重要，故以脚注明确保留。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“众人”承接原文“所有百姓”，在军事叙事中自然指随大卫同行的全体人员。正文保持简洁，不将有争议的暴力含义确定化，并用脚注呈现重要异读。
