base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/001.yaml
  text: And it happened at the time of the turning of the year[a], at the time when kings go out, that Joab led out the army and devastated the land of the Ammonites, and he came and besieged Rabbah. But David stayed in Jerusalem. And Joab struck Rabbah and tore it down.
translation:
  language: zh_hans
  text: 到了年岁轮回之际[a]，正是诸王出征的时候，约押率领军队，蹂躏亚扪人的土地；他来到拉巴，围困那城。大卫却留在耶路撒冷。约押攻击拉巴，把它拆毁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较意译为“到了春天”。希伯来文较直译为“到了年岁回转的时候”；结合下句，这通常被理解为诸王出征的季节。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשׁוּבַת הַשָּׁנָה
  choice: 年终回转之时
  rationale: 原文直指一年回转、循环到某一时点；译文保留希伯来语意象，不直接将其解释为“春天”。
- source_word: לְעֵת צֵאת הַמְּלָכִים
  choice: 正是诸王出征的时候
  rationale: צאת本义为“出去”；在军旅语境中译为“出征”自然清楚，也不额外补出原文未明说的具体作战对象。
- source_word: וַיִּנְהַג
  choice: 率领……出战
  rationale: 该动词有带领、领出去之意；结合军队语境，用“率领……出战”符合现代汉语表达。
- source_word: חֵיל הַצָּבָא
  choice: 军队
  rationale: 两个相关军事名词合用，整体指作战部队；简译为“军队”避免汉语中的累赘。
- source_word: וַיַּשְׁחֵת אֶת אֶרֶץ בְּנֵי עַמּוֹן
  choice: 蹂躏亚扪人的土地
  rationale: 动词表示毁坏、摧残；“蹂躏”适合描述军队对一片国土的破坏，并与后文拆毁城池的动词相区别。
- source_word: וַיָּצַר
  choice: 围困
  rationale: 这是围城用语，表示包围并围攻一座城；“围困”简洁准确。
- source_word: וְדָוִיד יֹשֵׁב בִּירוּשָׁלִָם
  choice: 大卫却留在耶路撒冷
  rationale: 分词表达持续状态，即大卫留守当地；“却”自然呈现他与出征的约押之间的对比。
- source_word: וַיַּךְ
  choice: 攻下
  rationale: 该动词可指击打、攻击或击败；这里紧接拆毁城市，语境表明攻城取得成功，汉语以“攻下”最自然。
- source_word: וַיֶּהֶרְסֶהָ
  choice: 将城拆毁
  rationale: 动词指拆除、摧毁建筑或城邑；补出“城”承接拉巴，使汉语指代清楚。
- source_word: רַבָּה
  choice: 拉巴
  rationale: 按地名音译，采用现代中文圣经中通行的形式。
