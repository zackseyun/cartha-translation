base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/006.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six each, twenty-four in all; he also was born to Rapha.
translation:
  language: zh_hans
  text: 在迦特又发生了战争。那里有一个身材高大的人，每只手和每只脚各有六个指头，共二十四个；他也是拉法的后裔。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉法的后裔”直译为“为那拉法所生”，也可理解为“那巨人的后裔”或“利乏音人的一员”。
    reason: 保留 הָרָפָא 可能指祖先、巨人或族群称谓的歧义。
lexical_decisions:
- source_word: עוֹד
  choice: 又
  rationale: 在叙事进程中表示同类事件再次发生；“又”自然简洁。
- source_word: מִלְחָמָה
  choice: 战争
  rationale: 该词泛指战争或武装冲突；此处是叙事概述，用“战争”比“战役”更稳妥。
- source_word: בְּגַת
  choice: 在迦特
  rationale: 介词 ב 表示冲突发生的地点；现代汉语用“在迦特”自然准确。
- source_word: אִישׁ מִדָּה
  choice: 一个身材高大的人
  rationale: 字面为“有尺寸／身量的人”，上下文指其体格异常高大；此译既传达含义，又避免直接增译为“巨人”。
- source_word: אֶצְבְּעֹתָיו
  choice: 手指和脚趾
  rationale: 该词通常指“指头”；结合“各有六个、共二十四个”及平行经文可知包括双手和双脚的指头，汉语需明确表达。
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: 各有六个
  rationale: 表达分配意义，即每只手和每只脚各六指；符合后文总数二十四。
- source_word: עֶשְׂרִים וְאַרְבַּע
  choice: 共二十四个
  rationale: 原文给出总数；“共”清楚呈现其汇总关系。
- source_word: וְגַם הוּא
  choice: 他也是
  rationale: 表明此人与上下文所述其他人物同属相关血统或群体。
- source_word: נוֹלַד לְהָרָפָא
  choice: 拉法的后裔
  rationale: 字面为“为／向那拉法所生”；在本段谱系语境中，“后裔”是自然汉语，同时以“拉法”音译保留其可能是祖先或族群称谓的歧义。
theological_decisions:
- issue: הָרָפָא 的身份
  choice: 正文音译为“拉法”，并将关系译为“拉法的后裔”
  alternative: “那巨人的后裔”或“利乏音人的一员”
  rationale: 希伯来语形式为带冠词的单数，可能指一位祖先，也可能是与利乏音人有关的宗族称谓。音译可避免武断确定其身份，脚注保留其他可能解释。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“后来”衔接上下文，“又”准确表达事件重现；正文避免使用带有过强解释性的“巨人”，并以脚注交代原文歧义。
