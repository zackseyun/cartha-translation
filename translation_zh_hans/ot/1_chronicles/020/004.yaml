base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
translation:
  language: zh_hans
  text: '此后，在基色与非利士人发生了战争。那时，户沙人西比该击杀了细派[a]，他是利乏音[b]的后裔之一；他们就被制伏了。


    [a] “细派”这个名字也可译作“撒斐”。


    [b] 希伯来语为“利乏音”；传统上也译作“巨人”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细派”这个名字也可译作“撒斐”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语为“利乏音”；传统上也译作“巨人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: 此后
  rationale: 以自然简洁的现代汉语表达希伯来叙事中的时间转接，同时保留事件先后关系。
- source_word: וַתַּעֲמֹד מִלְחָמָה
  choice: 发生了战争
  rationale: עמד与“战争”连用表示战事发生；此译准确且符合现代汉语习惯，避免直译成“战争站立”。
- source_word: בְּגֶזֶר
  choice: 在基色
  rationale: 按战事发生地点理解介词בְּ，并采用该地名的通行汉语音译。
- source_word: עִם פְּלִשְׁתִּים
  choice: 与非利士人
  rationale: 保留介词עִם“与”的形式；战争语境已清楚表明双方敌对，无须强化为“攻打”。
- source_word: אָז
  choice: 那时
  rationale: 自然表达叙事中的时间与次序标记。
- source_word: הִכָּה
  choice: 击杀了
  rationale: נכה在战争语境中可指击倒并杀死；“击杀”兼具动作力度与致命结果。
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: 户沙人西比该
  rationale: 人名与族属称谓采用通行音译，并按自然汉语语序排列。
- source_word: סִפַּי
  choice: 细派
  rationale: 按马所拉文本的读音音译；其他传统译法以脚注保留。
- source_word: מִילִדֵי הָרְפָאִים
  choice: 利乏音人的一个后裔
  rationale: ילידי表示出生于或出自某一族群的人；用“一个后裔”清楚说明此处的单数对象，同时将רְפָאִים保留为族群名称。
- source_word: וַיִּכָּנֵעוּ
  choice: 他们便被制伏了
  rationale: כּנע的尼פעל形表示被压服、被制伏；“他们”保留希伯来语复数主语未明说所指的特点，不在正文中擅自补成“非利士人”。
theological_decisions:
- issue: הָרְפָאִים的译法
  choice: 利乏音人
  alternative: 巨人
  rationale: 该词可作族群或宗族名称，并不必然只是身材描述。音译可避免把“巨人”这一较强的解释直接写入正文，传统译法则收入脚注。
- issue: וַיִּכָּנֵעוּ复数主语的指代
  choice: 他们便被制伏了
  alternative: 非利士人便被制伏了
  rationale: 原文只用复数动词，没有明说主语。虽然语境很可能指非利士人，正文仍用代词保留原文的指代开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。专名沿用现代中文圣经读者较熟悉的音译。避免生硬复制希伯来语叙事公式，并保留末句复数主语的含混性。
