  text: וַ/יִּקַּ֣ח דָּוִ֣יד אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וַֽ/יִּמְצָאָ֣/הּ מִשְׁקַ֣ל כִּכַּר זָהָ֗ב וּ/בָ/הּ֙ אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑יד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/002.yaml
  text: And David took the crown of their king from his head and found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David’s head. And he carried off very much plunder from the city.
translation:
  language: zh_hans
  text: 大卫从他们的王[a]头上取下王冠，发现它重一他连得黄金[b]，冠上有一块宝石；王冠就在大卫头上。大卫又从城里带走了极多的战利品。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“米勒公的王冠”（也可音译作“玛勒堪”）。这里的希伯来语既可理解为“他们的王”，也可能是亚扪人的神名。
    reason: alternative_reading
  - marker: b
    text: “他连得”是古代很大的重量单位；具体数值因时代和地区而异，通常估计约为三十四公斤。
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: 王冠
  rationale: 在君王语境中，这是现代汉语对王室头冠自然、清楚的表达。
- source_word: מַלְכָּם
  choice: 他们王
  rationale: 按马所拉文本的形态，最自然地理解为“他们的王”；后面的“他的头上”也支持这里指一位君王。神名“米勒公／玛勒堪”的可能读法保留在脚注中。
- source_word: מֵעַל רֹאשׁוֹ
  choice: 从……的头上取下
  rationale: 准确表达从头上拿走王冠这一具体动作，也符合现代汉语习惯。
- source_word: וַיִּמְצָאָהּ מִשְׁקַל כִּכַּר זָהָב
  choice: 发现它重一他连得金子
  rationale: 保留“发现”以及古代重量单位，不将其换算值写入正文，以免造成不必要的精确化。
- source_word: אֶבֶן יְקָרָה
  choice: 一块宝石
  rationale: 自然表达单数的贵重石头，不擅自指定宝石种类。
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִיד
  choice: 这王冠就戴在大卫头上
  rationale: 贴近希伯来文“它就在大卫头上”，同时以自然汉语表明王冠处于佩戴状态，不额外指定是谁把它戴上去的。
- source_word: וּשְׁלַל הָעִיר הוֹצִיא הַרְבֵּה מְאֹד
  choice: 又从城里带走了极多的战利品
  rationale: “战利品”明确军事语境；“带走”对应运出或取走，“极多”保留原文的强烈数量强调。
theological_decisions:
- issue: מַלְכָּם 是“他们的王”还是亚扪神祇之名
  choice: 正文译作“他们王”
  alternative: 译作“米勒公的王冠”或“玛勒堪的王冠”
  rationale: 带第三人称复数后缀的普通名词分析在形态和当前句法中较自然，尤其“他的头上”容易指向君王；但辅音形式也容许神名读法，因此以脚注保存真实歧义，不在正文中彻底排除。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“王冠”“战利品”等词为普通读者易懂的当代用语；保留古代单位“他连得”，并用脚注提供约略说明。正文不消解“他们王／神名”的原文歧义。
