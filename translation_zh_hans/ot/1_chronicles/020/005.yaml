base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/005.yaml
  text: And there was war with the Philistines again[a], and Elhanan son of Jair struck down Lahmi, the brother of Goliath the Gittite, whose spear shaft was like a weaver’s beam.
translation:
  language: zh_hans
  text: 又有一场与非利士人的战争。[a]睚珥的儿子伊勒哈难击杀了迦特人歌利亚的兄弟拉哈米；拉哈米的矛杆像织布机的横梁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 平行记载《撒母耳记下》21:19的希伯来文本较难理解，常被拿来与本节比较；《历代志》在这里明确说，伊勒哈难杀的是歌利亚的兄弟拉哈米。
    reason: textual_variant
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: 后来又有一场……战争
  rationale: עוֹד在连续叙事中表示又一次事件；“后来又有一场”自然地引出另一场战争，同时保留事件次序。
- source_word: אֶת פְּלִשְׁתִּים
  choice: 与非利士人的
  rationale: 在战争语境中，אֶת标明交战的另一方；现代汉语以“与非利士人的战争”表达自然。
- source_word: וַיַּךְ
  choice: 击杀了
  rationale: נכה本义涉及击打，在战斗语境中指击倒并杀死。“击杀”既保留动作意象，也明确其致命结果。
- source_word: אֶלְחָנָן בֶּן יעור
  choice: 睚珥的儿子伊勒哈难
  rationale: 采用中文圣经传统中较为熟悉的人名音译，并按自然汉语次序表达父子关系。
- source_word: אֶת לַחְמִי
  choice: 拉哈米
  rationale: 按马所拉标音将לַחְמִי理解为专名，不把它拆分为与“伯利恒人”相关的词组。
- source_word: אֲחִי גָּלְיָת
  choice: 歌利亚的兄弟
  rationale: 原文明确表达亲属关系，直译可避免与平行经文的问题相混。
- source_word: הַגִּתִּי
  choice: 迦特人
  rationale: 该族称表示来自迦特；“迦特人”比音译式族称更易为现代普通读者理解。
- source_word: וְעֵץ חֲנִיתוֹ
  choice: 拉哈米的矛杆
  rationale: 字面为“他长矛的木杆”。重复姓名可避免中文分号后代词指向歌利亚或拉哈米的歧义。
- source_word: כִּמְנוֹר אֹרְגִים
  choice: 粗如织布机的轴
  rationale: מְנוֹר אֹרְגִים指织布设备上的粗大横木或轴；此译保留尺寸对比的形象，也符合现代汉语习惯。
theological_decisions:
- issue: 本节与撒母耳记下21:19平行记载之间的文本关系
  choice: 依《历代志》希伯来文本的明确措辞，译为伊勒哈难击杀歌利亚的兄弟拉哈米。
  alternative: 依据或校订《撒母耳记下》的疑难文本，使本节读成伊勒哈难击杀歌利亚本人，或把“拉哈米”拆解为与“伯利恒人”有关的表述。
  rationale: 翻译本节应首先忠实呈现《历代志》的现存希伯来文本，不把平行经文的文本难题带入正文；相关问题以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“击杀”适合战争语境；用“迦特人”解释族称。为避免“他的矛杆”在中文中指代不明，第二句重复“拉哈米”。脚注标记紧接“战争”句后。
