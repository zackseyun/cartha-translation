id: 1CH.5.2
reference: 1 Chronicles 5:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י יְהוּדָה֙ גָּבַ֣ר בְּ/אֶחָ֔י/ו וּ/לְ/נָגִ֖יד מִמֶּ֑/נּוּ וְ/הַ/בְּכֹרָ֖ה לְ/יוֹסֵֽף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/002.yaml
  text: For Judah prevailed over his brothers[a], and from him came the ruler, though the birthright belonged to Joseph.
translation:
  language: zh_hans
  text: 因为犹大胜过他的弟兄，领袖[a]也出自他；不过，长子的名分归约瑟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领袖”或译“统治者”或“君王”。
    reason: נָגִיד的语义范围包括领袖、统治者和君王；正文采用不作过度限定的“领袖”。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明吕便虽是长子却失去相应地位的缘由；“因为”自然表达此处的解释关系。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: גָּבַר
  choice: 胜过
  rationale: 该动词表示强盛、占优势；与介词短语“在他的弟兄之上”连用时，“胜过”准确表达犹大的优越地位。
- source_word: בְּאֶחָיו
  choice: 他的弟兄
  rationale: 这里既指犹大的弟兄，也延伸涉及由他们而出的各支派；直译“弟兄”可保留家族谱系语境。
- source_word: וּלְנָגִיד
  choice: 领袖
  rationale: נָגִיד可指领袖、统治者或君王。此处强调治理者从犹大而出，“领袖”含义宽广，不把所指过早限定为某一特定王。
- source_word: מִמֶּנּוּ
  choice: 出自他
  rationale: 单数代词最自然地回指犹大；“出自他”简洁保留人物或王朝从犹大而出的含义。
- source_word: וְהַבְּכֹרָה
  choice: 不过，长子的名分
  rationale: בְּכֹרָה指长子所享的身份和权利。“长子的名分”是自然且较为完整的中文表达；连接词按上下文译为“不过”，体现犹大居首与约瑟得长子权之间的对照。
- source_word: לְיוֹסֵף
  choice: 归约瑟
  rationale: 介词ל在此表达归属；“归约瑟”准确传达长子名分属于约瑟。
theological_decisions:
- issue: 犹大的领袖地位与约瑟的长子名分之间的关系
  choice: 将两种权益并列而区别：犹大胜过弟兄，并有领袖从他而出；长子的名分则归约瑟。
  alternative: 可较宽泛地理解为犹大最强盛，而约瑟保有双份产业等长子权益。
  rationale: 希伯来文把犹大的强盛和领袖出自他，与长子名分归约瑟并置。译文保留这种张力，不把治理权与长子权合并为同一概念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“胜过他的弟兄”保留家族语境，“领袖也出自他”自然补足希伯来语省略的谓语。分号与“不过”清楚呈现两项地位的对照。脚注标记置于其实际说明的“领袖”之后。
