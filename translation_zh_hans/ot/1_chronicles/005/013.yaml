base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/013.yaml
  text: 'And their brothers[a], according to their fathers’ houses: Michael, Meshullam, Sheba, Jorai, Jachan, Zia[d][c][b], and Eber—seven.'
translation:
  language: zh_hans
  text: 他们按父系家族划分的弟兄[a]是米迦勒、米书兰、示巴、约赖、雅干、细亚[c]和希伯，共七人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里也可指同族的亲属。
    reason: lexical_alternative
  - marker: c
    text: “细亚”有些译本作“细撒”，源于文本或音译上的差异。
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 直译为“弟兄”，保留希伯来文的亲属称谓；在族谱语境中也可能泛指同族亲属，故加注说明。
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: 按父系家族
  rationale: 该族谱用语指以父系家庭或宗族为单位；此译既传达社会结构，又比逐字译作“父亲的家”更符合现代汉语。
- source_word: מִיכָאֵל
  choice: 米迦勒
  rationale: 依普通话圣经人名的通行译法音译。
- source_word: וּמְשֻׁלָּם
  choice: 米书兰
  rationale: 依普通话圣经人名的通行译法音译。
- source_word: וְשֶׁבַע
  choice: 示巴
  rationale: 按马所拉元音视为人名并音译；保留与希伯来语 Šebaʿ 相近的传统汉语形式。
- source_word: וְיוֹרַי
  choice: 约赖
  rationale: 按马所拉文本的人名音译，兼顾希伯来语读音与现代汉语可读性。
- source_word: וְיַעְכָּן
  choice: 雅干
  rationale: 按马所拉文本的人名音译；不以英语 Jachan 为直接底本。
- source_word: וְזִיעַ
  choice: 齐亚
  rationale: 按马所拉元音 זִיעַ 音译为“齐亚”；另有“齐撒”等异译可能来自文本或转写差异，故加注。
- source_word: וָעֵבֶר
  choice: 和希伯
  rationale: 希伯来名 עֵבֶר 音译为“希伯”，采用现代中文圣经中较易辨认的传统形式。
- source_word: שִׁבְעָה
  choice: 共七人
  rationale: 该数词总结前列七个名字；补出“共……人”以自然表达其同位总结功能。
