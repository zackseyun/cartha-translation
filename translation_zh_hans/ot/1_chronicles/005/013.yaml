  to: 他们按父系家族划分的弟兄[a]是米迦勒、米书兰、示巴、约赖、雅干、细亚[c]和希伯，共七人。
  rationale: 修订使“按他们父系家族划分的”明确修饰“弟兄”，保留原文的所属限定和族谱分类用语；同时统一两个人名的中文圣经常见音译。脚注b虽保留以说明该文化性族谱术语，但无需在正文另设锚点，因为正文的“按父系家族划分”已直接表达该术语。
