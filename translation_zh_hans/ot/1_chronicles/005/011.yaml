  yaml_path: translation/ot/1_chronicles/005/011.yaml
  text: And the sons of Gad lived opposite them in the land of Bashan[b][a], as far as Salecah.
translation:
  language: zh_hans
  text: 迦得的子孙住在他们对面[a]的巴珊地，远至撒迦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他们旁边”或“面向他们”；希伯来语所表达的是相对于前文所述群体的位置。
    reason: lexical_alternative
  - marker: b
    text: “撒迦”也可音译为“萨勒迦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי גָד
  choice: 迦得的子孙
  rationale: בני字面可指“儿子们”，但在此支派与地域的语境中指迦得的后裔；“子孙”既自然，也准确表达群体含义。连接词וּ在中文中无需机械译出“并且”，以免句式生硬。
- source_word: לְ/נֶגְדָּ/ם
  choice: 在他们对面
  rationale: נגד带第三人称复数后缀，表示相对于前文所述群体的位置；“在他们对面”保留空间关系，同时不武断确定具体地理方位。
- source_word: יָשְׁבוּ
  choice: 住
  rationale: ישב在地域记述中表示居住、定居；“住”是简洁自然的现代汉语表达，不额外强调迁入或定居的过程。
- source_word: בְּ/אֶרֶץ הַ/בָּשָׁן
  choice: 在……的巴珊地
  rationale: אֶרֶץ在这里指名为巴珊的地域；译作“巴珊地”符合现代中文圣经地名表达。
- source_word: עַד
  choice: 远至
  rationale: עַד在地理范围语境中标示延伸的界限；“远至”清楚表达空间范围，并避免“直到”可能产生的时间含义。
- source_word: סַלְכָה
  choice: 撒迦
  rationale: 地名采用中文圣经传统中较通行的译名“撒迦”；另以脚注列出更贴近辅音形式的译名。
