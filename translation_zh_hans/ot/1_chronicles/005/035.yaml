lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  choice: 亚希玛斯
  rationale: 这是人名אֲחִימַעַץ的音译，采用现代中文圣经语境中易于辨认的常见形式；句首的连接词不另译，以符合汉语家谱行文。
- source_word: הוֹלִיד
  choice: 生
  rationale: 使役形在家谱中表示生育、成为某人的父亲；“生”简洁自然，符合中文家谱的固定表达，并不额外断定两代之间是否毫无省略。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，在中文中由语序体现，无须另译。
- source_word: עֲזַרְיָה
  choice: 亚撒利雅
  rationale: 按常见中文圣经人名形式音译。
- source_word: וַ/עֲזַרְיָה
  choice: 亚撒利雅
  rationale: 人名按常见形式音译；前缀连接词所表达的承接关系改用分号体现，比重复“又”更自然。
- source_word: יוֹחָנָן
  choice: 约哈难
  rationale: 按该希伯来人名的常见中文圣经形式音译，并与“约哈南”等其他可行音译保持区别性选择。
