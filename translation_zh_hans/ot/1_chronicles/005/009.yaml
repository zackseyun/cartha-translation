  text: To the east he settled as far as the entrance to the wilderness from the river Euphrates[a], because their livestock had multiplied in the land of Gilead.
translation:
  language: zh_hans
  text: 他们向东居住，直至从幼发拉底河一带到旷野的入口[a]，因为他们的牲畜在基列地增多了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直至旷野的入口，从幼发拉底河一带起。”原文的边界描述很紧凑；“从幼发拉底河”与前面短语的具体连接方式可以有不止一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וְלַמִּזְרָח
  choice: 向东
  rationale: 表示空间方向；中文无需硬译句首连接词，也能自然承接上下文。
- source_word: יָשַׁב
  choice: 居住
  rationale: 单数动词以祖先或支派代表指代其群体；“居住”既保留原词常义，也适合领地分布的语境。
- source_word: עַד לְבוֹא מִדְבָּרָה
  choice: 直到……通往旷野的入口
  rationale: 保留“到达／进入之处”的具体边界意象，避免简化成仅仅“直到旷野”。
- source_word: לְמִן הַנָּהָר פְּרָת
  choice: 从幼发拉底河那边
  rationale: 原文介词组合及其与“旷野”的句法关系较压缩；加入“那边”使中文可读，同时保留从幼发拉底河一侧界定方向或区域的意思。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出向东扩展居住范围的原因。
- source_word: מִקְנֵיהֶם
  choice: 他们的牲畜
  rationale: 指各种作为财产饲养的牲畜，并非仅指牛群。
- source_word: רָבוּ
  choice: 增多了
  rationale: 准确表达数量增加；中文完成体自然呈现这一增长作为扩展领地的原因。
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: 在基列地
  rationale: “地”保留 אֶרֶץ 的地域含义，又符合现代中文地名表达。
