  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
translation:
  language: zh_hans
  text: 他的儿子比拉[a]，被亚述王提革拉·毗列尼色掳去流放；他是流便人的首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节亚述王名字的希伯来文形式是“提革拉·毗列尼色”；其他经文或译本常见较熟悉的形式“提革拉·毗列色”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  choice: 比拉
  rationale: 按希伯来文人名音译；采用中文圣经读者较熟悉、简洁自然的译名形式。
- source_word: בְנוֹ
  choice: 他的儿子
  rationale: 名词附第三人称阳性单数后缀，回指上文家谱中的先祖；译作“他的儿子”符合现代汉语。
- source_word: אֲשֶׁר הֶגְלָה
  choice: 被……掳去
  rationale: 关系从句中，比拉是使役式动词 הֶגְלָה 的受事；被动表达自然，并保留被强制迁离、流放的历史含义。
- source_word: תִּלְגַת פִּלְנְאֶסֶר
  choice: 提革拉·毗列尼色
  rationale: 依本节希伯来文本的姓名形式音译，不默默统一为其他经文或历史资料中更常见的异体。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 准确表达“亚述的王”，并采用自然凝练的现代汉语称谓。
- source_word: הוּא
  choice: 他
  rationale: 保留独立代词的复指和强调作用，使读者在插入的关系从句之后明确主语仍是比拉。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 在支派家谱语境中指公认的领袖；“首领”比“王子”更能避免不当的王室含义。
- source_word: לָרְאוּבֵנִי
  choice: 吕便人的
  rationale: 介词 לְ 在此表示首领与所属群体的关系；译作“吕便人的首领”自然准确。
