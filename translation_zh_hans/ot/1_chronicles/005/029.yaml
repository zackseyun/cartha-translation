base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/029.yaml
  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
translation:
  language: zh_hans
  text: 暗兰的儿女[a]是亚伦、摩西和米利暗；亚伦的儿子是拿答、亚比户、以利亚撒和以他玛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“儿子们”。在这里的族谱名单中，这个词指所列的儿女；名单除亚伦和摩西外，也包括米利暗。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמְרָם
  choice: 暗兰的子女
  rationale: בְּנֵי 通常意为“儿子们”，但本句所列三人包括女性米利暗；译作“子女”能在现代汉语中准确涵盖名单中的成员，同时以脚注保留希伯来语的字面形式及族谱用法。句首连接词不机械译作“和”，以符合汉语族谱列举的自然表达。
- source_word: אַהֲרֹן וּמֹשֶׁה וּמִרְיָם
  choice: 亚伦、摩西和米利暗
  rationale: 人名采用现代中文圣经中通行的音译；希伯来语逐项连接的结构按自然汉语列举方式处理。
- source_word: וּבְנֵי אַהֲרֹן
  choice: 亚伦的儿子
  rationale: 此处名单全为亚伦的男性子嗣，故将 בְּנֵי 译作“儿子”；省去机械的句首“和”，以分号自然连接两个平行的族谱分句。
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: 拿答、亚比户、以利亚撒和以他玛
  rationale: 人名采用通行音译，并以现代汉语自然的并列格式呈现原文名单。
theological_decisions:
- issue: בְּנֵי 在暗兰名单中的性别范围
  choice: 正文译“子女”，脚注说明字面为“儿子们”
  alternative: 正文直译“儿子”，尽管名单包括米利暗
  rationale: 这样既不把女性米利暗误称为儿子，又保留原文男性复数名词在族谱语境中的真实措辞和张力，不据此引入额外的神学解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；两个族谱分项以分号衔接，人名使用简体中文圣经读者熟悉的通行译名。
