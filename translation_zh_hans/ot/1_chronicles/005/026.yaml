  text: וַ/יָּעַר֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל אֶת ר֣וּחַ פּ֣וּל מֶֽלֶךְ אַשּׁ֗וּר וְ/אֶת ר֨וּחַ֙ תִּלְּגַ֤ת פִּלְנֶ֨סֶר֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּגְלֵ/ם֙ לָ/ראוּבֵנִ֣י וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ֠/יְבִיאֵ/ם לַ/חְלַ֨ח וְ/חָב֤וֹר וְ/הָרָא֙ וּ/נְהַ֣ר גּוֹזָ֔ן עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/026.yaml
  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
translation:
  language: zh_hans
  text: 于是，以色列的神激动了亚述王普勒的心，也激动了亚述王提勒革·毗勒尼色的心[a][b]；他把流便人、迦得人和玛拿西半个支派的人掳去，带到哈腊、哈博、哈拉和歌散河，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “普勒”和“提勒革·毗勒尼色”可能是同一位亚述王的两个名字；希伯来文也可按字面理解为两位君王。
    reason: 保留原文句法对两个人名关系的歧义，同时交代常见的历史认定。
  - marker: b
    text: “提勒革·毗勒尼色”依照本节希伯来文的名字形式音译；较通行的译名是“提革拉·毗列色”。
    reason: 说明本节特殊的希伯来文人名形式及读者更熟悉的名称。
lexical_decisions:
- source_word: וַיָּעַר
  choice: 激动了
  rationale: 该动词表示唤起、推动某人采取行动。“激动了……的心”保留神主动推动君王内在意志的含义，又不加入“煽动”等可能带有负面评价的色彩。
- source_word: ר֣וּחַ ... ר֨וּחַ
  choice: ……的心……的心
  rationale: 此处 רוּחַ 指君王内在的意念、意志或动力。现代汉语用“心”比直译“灵”更自然，同时保留原文对内在人格层面的强调。
- source_word: פּוּל
  choice: 普勒
  rationale: 按希伯来文人名音译，并沿用中文圣经读者较熟悉的形式。
- source_word: תִּלְּגַת פִּלְנֶסֶר
  choice: 提勒革·毗勒尼色
  rationale: 按《历代志》本节希伯来文的特殊拼写音译，避免在正文中直接改成更常见、但不完全反映此处字形的“提革拉·毗列色”；通行形式列于脚注。
- source_word: וַיַּגְלֵם
  choice: 把……掳走
  rationale: 该使役形动词表示使人离开故土、被迁往异地。“掳走”简洁地表达强制流放，也符合叙事语体。
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: 流便人、迦得人
  rationale: 以现代汉语中自然的族群称呼表达两个支派的成员。
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: 玛拿西半个支派的人
  rationale: 清楚表明这里所指的是玛拿西支派的一半人口群体，并与前面的“流便人、迦得人”保持句法协调。
- source_word: וַיְבִיאֵם
  choice: 带到
  rationale: 直接表达使他们到达所列地点的动作，与前面的“掳走”形成自然连续的叙述。
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  choice: 到哈腊、哈博、哈拉和歌散河一带
  rationale: 地名采用音译；“歌散河一带”以自然汉语表达 נְהַר גּוֹזָן，同时不武断判定“歌散”究竟是河名还是河流所在地区的名称。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 他们至今仍在那里
  rationale: 原文直译为“直到今日”。结合前文安置地点，汉语补出隐含的“他们仍在那里”，使句意完整自然而不改变其时间含义。
theological_decisions:
- issue: 普勒与提勒革·毗勒尼色是同一位君王的两个名字，还是两位君王
  choice: 正文依照希伯来文并列结构，重复“激动了……的心”，不以“就是”明确等同两名；脚注说明可能是同一君王。
  alternative: 把两名处理为同位关系，译作“亚述王普勒，也就是亚述王提勒革·毗勒尼色”。
  rationale: 希伯来文在两个人名前都出现 רוּחַ，并以连接词相连，句法上容许理解为两位君王；历史上又常把普勒与提革拉·毗列色三世视为同一人。正文保留原文张力，脚注呈现历史上常见的等同理解。
- issue: וַיַּגְלֵם 的单数主语所指
  choice: 译作“他就把……掳走”，保留代词所指的含混性。
  alternative: 明确译成“这位亚述王就……”或“神就借他把……掳走”。
  rationale: 希伯来文只有阳性单数动词，最近的可能先行语是“亚述王”，但若前句按两位君王理解，单数主语会形成张力；明确添加身份会替原文解决这一问题，因此保留“他”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。正文保留重复的“激动了……的心”，以反映希伯来文结构；人名、族名和地名采用中文音译，避免生硬的逐词直译。
