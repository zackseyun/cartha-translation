base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
translation:
  language: zh_hans
  text: 这些人是他们各宗族的首领[a]：以弗、伊示、以利业、亚斯列、耶利米、何达威雅和雅叠；他们都是英勇的勇士、声名显赫的人，是他们各宗族的首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”原文直译为“父家”，指同出于一位祖先的家族群体。
    reason: cultural_note
lexical_decisions:
- source_word: רָאשֵׁי בֵית אֲבוֹתָם / רָאשִׁים לְבֵית אֲבוֹתָם
  choice: 他们各宗族的首领 / 各自宗族的首领
  rationale: “父家”是以共同祖先为纽带的宗族单位；正文用现代读者自然易懂的“宗族”，并保留原文首尾重复的结构。
- source_word: עֵפֶר וְיִשְׁעִי וֶאֱלִיאֵל וְעַזְרִיאֵל וְיִרְמְיָה וְהוֹדַוְיָה וְיַחְדִּיאֵל
  choice: 以弗、伊示、以利业、亚斯列、耶利米、何达威雅和雅叠
  rationale: 按本节希伯来语姓名形式音译，并采用简体中文圣经语境中清晰、通行的译名形式。
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  choice: 他们英勇善战
  rationale: 该固定表达兼有勇力、胆识和作战能力之意；“英勇善战”自然凝练地传达这些含义。
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: 声名显赫
  rationale: 原文直译为“有名字的人”，是指有名望、地位卓著的人；“声名显赫”保留其褒扬意味。
