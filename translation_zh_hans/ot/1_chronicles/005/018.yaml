  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
translation:
  language: zh_hans
  text: 吕便的子孙、迦得人和玛拿西半支派的人，都是英勇的战士；他们携带盾牌和刀剑，拉弓[a]，受过战争训练。能出征作战[b]的共有四万四千七百六十名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉弓”原文直译可作“踏弓”或“弯弓”，是指张弓射箭的希伯来语表达。
    reason: cultural_note
  - marker: b
    text: “能出征作战”也可译作“适合服兵役”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  choice: 吕便的子孙
  rationale: 保留希伯来文“吕便之子”的亲属表达，同时用现代汉语“子孙”清楚表示其后裔和支派成员。
- source_word: וְגָדִי
  choice: 迦得人
  rationale: 该词为族称，指迦得支派成员，而非先祖迦得本人。
- source_word: וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: 玛拿西半个支派
  rationale: 直接保留原文的支派划分称谓，表达自然明确。
- source_word: מִן בְּנֵי חַיִל
  choice: 中，有勇士
  rationale: 将介词 מִן 按部分意义处理；בְּנֵי חַיִל 在军事语境中指英勇、有战斗能力的人。“勇士”简洁而不额外引入特定军阶。
- source_word: אֲנָשִׁים נֹשְׂאֵי מָגֵן וְחֶרֶב
  choice: 就是拿盾牌和刀……的人
  rationale: 保留 אֲנָשִׁים 的“人”及分词所表达的装备状态；“拿”自然传达携带、装备之意。
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: 能拉弓
  rationale: 该希伯来习语字面涉及踩弓或弯弓，实际指张弓射箭；“拉弓”保留动作形象，并以脚注说明字面背景。
- source_word: וּלְמוּדֵי מִלְחָמָה
  choice: 受过战斗训练
  rationale: 体现 לְמוּדֵי 的被动、结果性含义，并以现代汉语自然表达军事训练。
- source_word: אַרְבָּעִים וְאַרְבָּעָה אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 四万四千七百六十名
  rationale: 准确呈现人数，并加量词“名”使中文行文自然。
- source_word: יֹצְאֵי צָבָא
  choice: 能出征作战
  rationale: 保留“出去从军/出征”的军事意象，同时表达这些人具备服役和参战资格。
