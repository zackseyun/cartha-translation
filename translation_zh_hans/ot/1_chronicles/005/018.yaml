  to: 吕便的子孙、迦得人和玛拿西半支派的人，都是英勇的战士；他们携带盾牌和刀剑，拉弓[a]，受过战争训练。能出征作战[b]的共有四万四千七百六十名。
  rationale: 修正“刀”与“剑”的词义差异，并调整群体指称和人数句的语序，使译文更准确、自然，同时保留原文对军事能力与服役资格的描述及脚注锚点。
