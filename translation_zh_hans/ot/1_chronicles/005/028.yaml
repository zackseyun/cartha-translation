lexical_decisions:
- source_word: וּ/בְנֵי קְהָת
  choice: 哥辖的儿子是
  rationale: בְנֵי在家谱语境中指亲生或谱系所列的“儿子”；ו承接上文，但现代汉语在独立节句中不必机械译作“并且”。补出判断词“是”，使名单表达自然清楚。
- source_word: קְהָת
  choice: 哥辖
  rationale: 依照现代中文圣经人名的通行译法音译。
- source_word: עַמְרָם
  choice: 暗兰
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: יִצְהָר
  choice: 以斯哈
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וְ/חֶבְרוֹן
  choice: 希伯伦
  rationale: 此处在家谱名单中是人名，并非同名地名；前缀ו由汉语列举结构表达。
- source_word: וְ/עֻזִּיאֵל
  choice: 和乌薛
  rationale: 采用通行人名译法，并用“和”明确标示名单最后一项。
