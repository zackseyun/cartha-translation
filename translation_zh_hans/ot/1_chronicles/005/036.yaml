  text: וְ/יוֹחָנָ֖ן הוֹלִ֣יד אֶת עֲזַרְיָ֑ה ה֚וּא אֲשֶׁ֣ר כִּהֵ֔ן בַּ/בַּ֕יִת אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
translation:
  language: zh_hans
  text: 约哈难生亚撒利雅；亚撒利雅就是在所罗门于耶路撒冷建造的殿[a]中供职的祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“房屋”；这里指圣殿。
    reason: 说明希伯来词的字面意义及其在本句中的具体所指。
lexical_decisions:
- source_word: וְ/יוֹחָנָן
  choice: 约哈难
  rationale: 专名按希伯来语音译；本节承接家谱，汉语无需机械译出句首连接词“和”。
- source_word: הוֹלִיד
  choice: 生
  rationale: 在家谱语境中表示生育、成为父亲；“生”简洁自然，并保留父系谱系的表达。
- source_word: אֶת עֲזַרְיָה
  choice: 亚撒利雅
  rationale: 直接宾语标记不另译；专名按希伯来语音译。
- source_word: הוּא אֲשֶׁר
  choice: 亚撒利雅就是……的那一位
  rationale: 重复名字以消除汉语代词可能造成的指代含混，并用“就是……的那一位”体现原文强调性的识别结构。
- source_word: כִּהֵן
  choice: 任祭司
  rationale: 该动词表示履行祭司职分；“任祭司”保留其动态职事含义，且符合现代汉语。
- source_word: בַּ/בַּיִת
  choice: 在……殿中
  rationale: בַּיִת 字面为“房屋、殿宇”；此处由所罗门在耶路撒冷建造这一限定明确指向圣殿。“殿”既保留原词的建筑称谓，又让现代读者自然理解其所指。
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: 所罗门……建造的
  rationale: 以自然的汉语定语结构表达原文关系从句，不增添原文没有的信息。
- source_word: בִּ/ירוּשָׁלִָם
  choice: 于耶路撒冷
  rationale: 保留地点介词与标准地名译法；“于”与全句庄重的家谱体裁相称。
theological_decisions:
- issue: “殿”是否明确译作“圣殿”
  choice: 正文译“殿”，脚注说明所指为圣殿
  alternative: 正文直接译“圣殿”
  rationale: 原文使用普通名词 בַּיִת（房屋、殿宇），但上下文明确指所罗门所建的圣殿。正文保留较贴近原词的“殿”，避免把解释完全代入正文，同时借脚注确保读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述。以分号连接父子谱系与对亚撒利雅的补充说明；重复“亚撒利雅”以清楚呈现原文强调，并避免“他”误指约哈难。
