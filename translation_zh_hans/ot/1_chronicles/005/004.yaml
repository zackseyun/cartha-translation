  text: בְּנֵ֖י יוֹאֵ֑ל שְׁמַֽעְיָ֥ה בְנ֛/וֹ גּ֥וֹג בְּנ֖/וֹ שִׁמְעִ֥י בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/004.yaml
  text: 'The sons of Joel: Shemaiah his son[a], Gog his son, Shimei his son.'
translation:
  language: zh_hans
  text: 约珥的儿子是示玛雅；示玛雅的儿子是歌革；歌革的儿子是示每。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子”也可泛指“后代”。希伯来文的家谱用语有时表示较广的世系关系，但本节一再说“他的儿子”，较支持这里列出的是直接相承的父子世系。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是בֵּן的复数附属形式，用来引出家谱。虽然在家谱中有时可泛指后代，但本节连续三次使用“他的儿子”这一直接父子关系公式，因此正文译作“儿子”。
- source_word: יוֹאֵל
  choice: 约珥
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: שְׁמַעְיָה
  choice: 示玛雅
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: בְנוֹ
  choice: ……的儿子
  rationale: 该词由“儿子”加第三人称阳性单数所属后缀构成，即“他的儿子”。中文逐次明确前一人的姓名，比连续使用“他的儿子”更自然，也避免指代含混。
- source_word: גּוֹג
  choice: 歌革
  rationale: 按现代中文圣经人名的通行译法音译；此处仅作家谱中的人名，不附加其他经文中的象征意义。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 按现代中文圣经人名的通行译法音译。
theological_decisions: []
