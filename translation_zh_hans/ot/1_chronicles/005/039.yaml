- source_word: וְ
  choice: ；
  rationale: 第二个连接词协调下一代谱系；中文用分号自然呈现并列递进关系，不增添时间含义。
- source_word: עֲזַרְיָה
  choice: 亚撒利雅
  rationale: 采用现代中文圣经中通行且易辨识的人名音译。
