  yaml_path: translation/ot/1_chronicles/005/021.yaml
  text: 'They captured their livestock: 50,000 camels[a], 250,000 sheep, 2,000 donkeys, and 100,000 people.'
translation:
  language: zh_hans
  text: 他们掳走了敌人的牲畜：骆驼五万只、羊二十五万只、驴两千头；又掳走十万人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文字面为“人的生命／人”（נֶפֶשׁ אָדָם）；在这里的计数语境中指人，即被掳走的人。
    reason: 说明נֶפֶשׁ אָדָם的字面语义范围及其在本句中的语境含义。
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: 掳获了
  rationale: שׁבה常指掳走人或夺取战利品；本句宾语包括牲畜和人，“掳获”既保留战争语境，也能自然涵盖两类对象。
- source_word: מִקְנֵיהֶם
  choice: 那些人的牲畜
  rationale: מִקְנֶה在此由后列各类动物具体说明，因此译作“牲畜”；第三人称复数后缀指敌方，译作“那些人的”可避免现代汉语中“他们”所指含混。
- source_word: גְּמַלֵּיהֶם
  choice: 骆驼
  rationale: 该词是“骆驼”的复数形式，带第三人称复数所属后缀；所属关系已由前面的“那些人的牲畜”统摄，无须重复。
- source_word: וְצֹאן
  choice: 羊
  rationale: צֹאן是集合名词，可泛指绵羊和山羊等小型牲畜；“羊”在汉语中保留这种概括性，不限定为绵羊。
- source_word: וַחֲמוֹרִים
  choice: 驴
  rationale: 按现代标准汉语直接译为“驴”。
- source_word: וְנֶפֶשׁ אָדָם
  choice: 另有十万人
  rationale: 该短语直译近于“人的性命／人”，在计数语境中指人。加“另有”自然标明清单由牲畜转到人，同时不掩盖这些人是被掳获者。
- source_word: מֵאָה אָלֶף
  choice: 十万
  rationale: 按现代汉语常用数字单位表达一百个一千，即“十万”。
