lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: 亚撒利雅
  rationale: 按现代中文圣经人名的通行音译处理，并译出前缀连词在叙事承接中的作用；本节中文句首无需另加“并且”。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 使役形在家谱中表示某人成为下一代的父亲；“生了”是中文家谱体简洁、自然的惯用表达，也不额外断定是否为直接父子关系。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，其语法功能由中文语序体现。
- source_word: שְׂרָיָה
  choice: 西莱雅
  rationale: 采用现代中文圣经传统中常见的人名音译。
- source_word: וּ/שְׂרָיָה
  choice: 西莱雅
  rationale: 前缀连词连接两个并列的家谱分句；中文以逗号自然衔接，无须机械译出“并且”。
- source_word: יְהוֹצָדָק
  choice: 约萨答
  rationale: 采用现代中文圣经传统中常见的人名音译，对应希伯来文专名 יְהוֹצָדָק。
