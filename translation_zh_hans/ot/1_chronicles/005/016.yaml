base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/016.yaml
  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
translation:
  language: zh_hans
  text: 他们住在基列、巴珊和巴珊所属的城镇[a]，也住在沙仑所有的牧场[b]，直到这些地方的边界[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所属的城镇”原文直译为“她的女儿们”，是指附属城镇或村庄的希伯来语习语。
    reason: lexical_alternative
  - marker: b
    text: “牧场”也可译作“空地”或“公地”。
    reason: lexical_alternative
  - marker: c
    text: “直到这些地方的边界”原文直译为“在它们出去之处”，意思是直到外缘或界限。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: 他们住在
  rationale: ישׁב在这里表示居住、定居；“住在”自然明确，也不额外强调初次迁居。
- source_word: בַּגִּלְעָד
  choice: 在基列
  rationale: 按现代中文圣经地名惯例音译该专名。
- source_word: בַּבָּשָׁן
  choice: 在巴珊
  rationale: 按现代中文圣经地名惯例音译该专名。
- source_word: וּבִבְנֹתֶיהָ
  choice: 和巴珊所属的城镇
  rationale: 字面为“和她的女儿们”，是指附属城镇或村庄的希伯来语习语；阴性单数后缀最自然地回指最近的先行词“巴珊”。
- source_word: מִגְרְשֵׁי
  choice: 牧场
  rationale: מִגְרָשׁ可指城镇周围的空地、公地或牧放牲畜之地；在此支派领地的语境中，“牧场”简明自然。
- source_word: שָׁרוֹן
  choice: 沙仑
  rationale: 采用现代中文圣经中通行的地名音译。
- source_word: עַל תּוֹצְאוֹתָם
  choice: 直到这些地方的边界
  rationale: 该空间性短语字面涉及“出去之处”，在领土描述中指外缘或界限；复数后缀的具体所指并非绝对明确，因此用“这些地方”保留一定的指涉宽度。
theological_decisions: []
