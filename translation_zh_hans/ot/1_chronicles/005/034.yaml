  text: 亚希突生撒督；撒督生亚希玛斯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִיטוּב
  choice: 亚希突
  rationale: 按现代中文圣经人名的通行音译处理，作为专名不翻译其词源含义。
- source_word: הוֹלִיד
  choice: 生
  rationale: 使役形在家谱中表示生育、成为某人的父亲；中文家谱用“生”简洁自然，也能保留父系谱系的表达。
- source_word: אֶת
  choice: 不另译
  rationale: 希伯来语直接宾语标记，在中文中由语序体现，无须另译。
- source_word: צָדוֹק
  choice: 撒督
  rationale: 采用现代中文圣经传统中广为通行的专名译法。
- source_word: וְ
  choice: ；
  rationale: 原文连词连接两个连续的家谱分句；中文以分号自然呈现其并列和承接关系，无须机械译作“并且”。
- source_word: הוֹלִיד
  choice: 生
  rationale: 与前一处相同的家谱动词保持一致，以清楚呈现连续世系。
- source_word: אֲחִימָעַץ
  choice: 亚希玛斯
  rationale: 采用现代中文圣经传统中广为通行的专名译法。
