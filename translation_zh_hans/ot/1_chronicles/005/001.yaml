  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: The sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
translation:
  language: zh_hans
  text: 以色列的长子吕便的儿子们——吕便原是长子；但因他玷污了父亲的床榻[a]，长子的名分就被赐给以色列之子约瑟的众子；却不按长子的名分列入家谱[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“父亲的床榻（复数）”；这是指父亲婚床的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 或译：“却不按长子的名分登记在家谱中。”原文没有明说这一分句的主语；这句话可说明吕便未按长子名分登记，也可说明长子名分转给约瑟的众子并不等同于按长子身份列入家谱。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי רְאוּבֵן
  choice: 吕便的儿子们
  rationale: 直译该家谱标题式短语；开头的连接词在中文中不必机械译作“和”，上下文的衔接仍然自然。
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: 以色列的长子
  rationale: 保留吕便与以色列之间的从属关系，并明确其出生次序和身份。
- source_word: כִּי הוּא הַבְּכוֹר
  choice: 吕便原是长子
  rationale: כִּי在此引出解释；“原是”既说明其生来为长子，也为随后长子名分被转移作铺垫。
- source_word: וּבְחַלְּלוֹ
  choice: 但因他玷污了
  rationale: 介词ב与不定式结构在此表达原因；“玷污”保留חלל所含的亵渎、污损意味，又不过度解释具体行为。
- source_word: יְצוּעֵי אָבִיו
  choice: 父亲的床榻
  rationale: 希伯来文形式为复数，但在此是指父亲婚床的惯用表达；中文用单数“床榻”较自然，并以脚注交代原文形式。
- source_word: נִתְּנָה בְּכֹרָתוֹ
  choice: 他的长子名分就给了
  rationale: בְּכֹרָה在这里指长子的权利和地位，不只是出生次序；“长子名分”是准确且通行的中文表达。
- source_word: לִבְנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: 以色列之子约瑟的众子
  rationale: 保留原文完整的谱系关系，同时以自然中文清楚表明约瑟是以色列之子。
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  choice: 不过，他并没有按长子名分列入家谱
  rationale: התיחשׂ是登记谱系、列入家谱的专门用语。原句省略主语且语义略显压缩；正文保留“长子名分转移”与“家谱登记”之间的张力，脚注说明另一种理解。
theological_decisions:
- issue: 吕便的生身长子身份与长子名分的转移
  choice: 吕便仍被称为以色列的长子，但其长子名分给予约瑟的众子；末句另行限制或说明家谱上的登记。
  alternative: 约瑟一系在一切意义上完全取代吕便，成为家谱中的长子。
  rationale: 经文先明确吕便“原是长子”，又说其长子名分被转移，最后补充家谱登记方面的限定。译文不把出生次序、权利和谱系地位合并为同一概念。
- issue: 末句隐含主语及所指
  choice: 正文按吕便并未凭长子名分列入家谱来表达，同时用脚注保留较宽泛的句法理解。
  alternative: 约瑟的众子虽得长子名分，却不因此按长子身份列入家谱。
  rationale: 希伯来文末句是不定式结构，未明说主语，既可承接吕便，也可说明长子名分的转移并不等于谱系中的长子登记；不应把这一歧义完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述语体。“床榻”较“床”略显庄重，适合经文语域；破折号保留本节作为后续家谱标题兼插入说明的未完句结构。
