  text: Micah his son[a], Reaiah his son, Baal his son.
translation:
  language: zh_hans
  text: 他的儿子是米迦；米迦的儿子是利亚雅；利亚雅的儿子是巴力[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴力”在这里是家谱中的人名，不应译作“主”这一称号。
    reason: 说明该词在本节家谱语境中的人名功能，避免将其按称号翻译。
lexical_decisions:
- source_word: מִיכָה
  choice: 米迦
  rationale: 这是人名，采用现代中文圣经读者熟悉且符合希伯来语音译传统的译名“米迦”。
- source_word: בְנֹו
  choice: 他的儿子／某人的儿子
  rationale: 该词由“儿子”加第三人称阳性单数附属代词构成，直译为“他的儿子”。为使中文家谱关系清楚，后两处将代词所指明说为“米迦的儿子”和“利亚雅的儿子”，不改变原文的父子链条。
- source_word: רְאָיָה
  choice: 利亚雅
  rationale: 这是家谱中的人名，采用音译“利亚雅”，不赋予词义性解释。
- source_word: בַּעַל
  choice: 巴力
  rationale: 此处位于连续家谱公式中，句法上是人名，因此音译为“巴力”，不译成称号“主”。
theological_decisions:
- issue: בַּעַל 在本节应视为称号、神名，还是家谱中的个人名字
  choice: 保留为个人名字“巴力”
  alternative: 译作称号“主”，或明确解释为某位神祇之名
  rationale: 该词与“米迦”“利亚雅”平行，处在“他的儿子”这一连续家谱结构中，最自然的理解是个人名字。音译既符合句法和文体，也避免加入原文没有明说的神学判断。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。原文重复使用“他的儿子”，中文则适度补明代词所指，以清楚呈现米迦—利亚雅—巴力的父子承接关系；分号保留家谱条目的节奏。
