revisions:
- from: 可是，他们背叛了他们列祖的神，追随当地各族的神明行淫[a]；这些族群正是神从他们面前除灭的。
  to: 可是，他们背叛了他们列祖的神，像妓女一样随从当地各族的神明[a]；这些族群是神曾从他们面前除灭的。
  rationale: 修改仅处理汉语中“追随……行淫”的搭配歧义：以“像妓女一样随从”明确呈现原文将偶像崇拜比作娼妓式不忠的修辞，并保留 אַחֲרֵי 所表示的随从对象。末句作轻微语序调整，使现代汉语更自然，同时保持关系从句回指当地族群及“从他们面前”除灭的意思。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:11Z'
review_pass:
  verdict: revise
  source_fidelity: 译文正确表达了他们对列祖之神失信、转而随从当地各族之神，以及神先前除灭那些族群的基本意思。关系从句明确回指“族群”，符合希伯来文语境。惟“追随……行淫”在现代汉语中搭配不够清晰，容易被理解为一边追随一边发生字面性行为，未能自然呈现原文“随从别神而行淫”的偶像崇拜隐喻。
  naturalness: “追随当地各族的神明行淫”语序和动宾关系略显拗口。“像妓女一样随从当地各族的神明”既保留强烈的性隐喻，也在现代庄重汉语中更清楚自然。末句调整为“是神曾从他们面前除灭的”，使关系从句更顺畅，并以“曾”体现所述除灭行动在此背信行为之前。
  terminology: “列祖的神”“当地各族的神明”“除灭”均合乎经文语域和原文含义。保留“神明”以区别独一的“神”与复数的异教神祇是恰当的。
