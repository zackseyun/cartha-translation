  text: וַ/יִּֽמְעֲל֔וּ בֵּ/אלֹהֵ֖י אֲבוֹתֵי/הֶ֑ם וַ/יִּזְנ֗וּ אַחֲרֵי֙ אֱלֹהֵ֣י עַמֵּי הָ/אָ֔רֶץ אֲשֶׁר הִשְׁמִ֥יד אֱלֹהִ֖ים מִ/פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
translation:
  language: zh_hans
  text: 可是，他们背叛了他们列祖的神，像妓女一样随从当地各族的神明[a]；这些族群是神曾从他们面前除灭的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像妓女一样随从”直译原文的性隐喻，用来描写拜偶像以及对神不忠；也可译作“随从……行淫”。
    reason: 保留并解释原文 זנה 对偶像崇拜和盟约不忠所用的性隐喻，同时说明另一种较贴近字面语序的译法。
lexical_decisions:
- source_word: וַיִּמְעֲלוּ
  choice: 背叛了
  rationale: מעל在这里指对神失信、破坏与神的关系；“背叛”自然凝练，并保留其严重的盟约性意味。
- source_word: בֵּאלֹהֵי אֲבוֹתֵיהֶם
  choice: 他们列祖的神
  rationale: 介词ב与מעל连用，标明遭受背信的一方；汉语用“背叛……神”即可自然表达，不必另译介词。“列祖”符合庄重的圣经叙事语域。
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: 追随……行淫
  rationale: זנה以性不忠比喻拜偶像，אַחֲרֵי含追随之意。“追随……行淫”既保留原文隐喻，也清楚表现他们转向别神。
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: 当地各族的神明
  rationale: עַמֵּי הָאָרֶץ指那地的各族。“当地各族”比生硬的“那地诸民”更符合现代汉语；以“神明”表示复数异教神祇，并与前面的独一之“神”形成清楚区别。
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  choice: 这些族群正是神从他们面前除灭的
  rationale: 关系代词最自然地回指“各族”，而非“神明”；הִשְׁמִיד为使役性毁灭动词，“除灭”符合上下文，也保留מִפְּנֵיהֶם的“从他们面前”意象。
theological_decisions:
- issue: 是否保留以性不忠描写拜偶像的隐喻
  choice: 追随……行淫
  alternative: 转而敬奉／不忠于
  rationale: 原文זנה刻意以行淫比喻对神的盟约不忠。直译其隐喻，可保留经文的谴责力度和神学张力，而不将其弱化为一般性的错误敬拜。
- issue: 关系从句所指对象
  choice: 这些族群正是神从他们面前除灭的
  alternative: 这些神明正是神从他们面前除灭的
  rationale: 原文关系代词可因邻近结构产生表面歧义，但“神除灭”的对象按语法语境最合理地是当地各族。显明“这些族群”可避免汉语误读，同时不改变原句命题。
- issue: 关系从句中אֱלֹהִים的数
  choice: 神
  alternative: 众神
  rationale: 动词הִשְׁמִיד为单数，表明此处אֱלֹהִים指独一的神，而不是复数神祇。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“列祖”“除灭”保留经文语域，“当地各族”则避免过度古雅。“行淫”较为强烈，但这是原文有意使用的隐喻，故在正文保留并以脚注说明。
