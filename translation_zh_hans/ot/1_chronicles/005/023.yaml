  text: וּ/בְנֵ֗י חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יָשְׁב֖וּ בָּ/אָ֑רֶץ מִ/בָּשָׁ֞ן עַד בַּ֧עַל חֶרְמ֛וֹן וּ/שְׂנִ֥יר וְ/הַר חֶרְמ֖וֹן הֵ֥מָּה רָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
translation:
  language: zh_hans
  text: 玛拿西半支派的人住在那地，从巴珊直到巴力·黑门、示尼珥和黑门山[a]；他们人数增多[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 巴力·黑门、示尼珥和黑门山都是地名，用来标示这片地域向北延伸的范围。
    reason: cultural_note
  - marker: b
    text: 或译：“他们变得众多”或“他们繁衍众多”。希伯来语动词着重表示数量增多。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: 玛拿西半支派的人
  rationale: בְּנֵי 字面为“儿子们”，但在支派语境中指该群体的成员或后裔。译作“……的人”符合现代汉语习惯，同时保留“半支派”这一明确的支派单位。
- source_word: יָשְׁבוּ בָאָרֶץ
  choice: 住在那地
  rationale: יָשַׁב 在此表示居住；בָאָרֶץ 指上下文所说的地域。用“住在那地”自然简明，不额外强调最初定居的动作。
- source_word: מִבָּשָׁן עַד
  choice: 从巴珊直到
  rationale: מִן…עַד…标示地域范围，译为“从……直到……”贴近原文结构。
- source_word: בַּעַל חֶרְמוֹן וּשְׂנִיר וְהַר חֶרְמוֹן
  choice: 巴力·黑门、示尼珥和黑门山
  rationale: 按地名音译并保留原文并列结构；הַר 明确译为“山”。中点号使复合地名“巴力·黑门”易于辨认。
- source_word: הֵמָּה רָבוּ
  choice: 他们人数众多
  rationale: רבה 的 Qal 形式可表示“变多、增多”或处于“众多”的状态；结合强调代词 הֵמָּה，正文采用自然的“他们人数众多”，脚注保留动态理解。
theological_decisions: []
