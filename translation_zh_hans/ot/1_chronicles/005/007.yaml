base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
translation:
  language: zh_hans
  text: 他的弟兄按宗族，照着他们的世系登记在族谱上[a]：为首的是耶利，另有撒迦利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的弟兄按宗族，载于他们历代的家谱中。”
    reason: 原文的介词结构可表达按世系进行登记，也可较名词化地表达为载于家谱之中。
lexical_decisions:
- source_word: וְאֶחָיו
  choice: 他的弟兄
  rationale: אָח在族谱语境中可指亲兄弟或同族男性亲属；译作“弟兄”既贴近原词，也保留其可能较宽的亲族含义。
- source_word: לְמִשְׁפְּחֹתָיו
  choice: 按宗族
  rationale: מִשְׁפָּחָה在支派名录中指宗族，而不只是现代意义上的小家庭。原文为第三人称阳性单数后缀，中文结合复数“弟兄”自然表达其按宗族归类的集体含义。
- source_word: בְּהִתְיַחֵשׂ
  choice: 登记
  rationale: יחס的Hitpael形式在《历代志》中指按谱系登记或核入家谱；“登记”简洁自然，相关族谱含义由上下文和“世系”明确。
- source_word: לְתֹלְדוֹתָם
  choice: 照他们的世系
  rationale: תּוֹלְדוֹת在这里指历代传承或谱系记录；“世系”比单纯的“世代”更清楚地表达族谱语境。
- source_word: הָרֹאשׁ
  choice: 为首的是
  rationale: רֹאשׁ可指首领、为首者或主要人物；“为首的是”保留其地位含义，同时避免过度确定为正式官职。
- source_word: יְעִיאֵל
  choice: 耶利
  rationale: 按常见中文圣经人名形式音译。
- source_word: וּזְכַרְיָהוּ
  choice: 还有撒迦利亚
  rationale: 按常见中文圣经人名形式音译；“还有”使句法清楚，并避免误读为耶利与撒迦利亚二人都受单数“为首的”直接修饰。
theological_decisions:
- issue: 单数“为首的”与两个人名之间的关系
  choice: “为首的是耶利，还有撒迦利亚”
  alternative: “首领是耶利和撒迦利亚”
  rationale: 原文הָרֹאשׁ为单数，最自然地与紧随其后的耶利相连，而撒迦利亚由连接词另行列出；译文不把二人都明确称为首领，也不排除经文简略列名所留下的句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的族谱用语。“宗族”“世系”“为首”保持《历代志》名录体裁的正式感；标点将登记说明与人物列名分开，使中文清晰而不补入原文没有的身份信息。
