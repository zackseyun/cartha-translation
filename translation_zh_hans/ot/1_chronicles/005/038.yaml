  rationale: 这是直接宾语标记，中文没有对应词，其语法功能由语序体现。
- source_word: צָדוֹק
  choice: 撒督
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וְ/צָדוֹק
  choice: 撒督
  rationale: 连接词所表达的递接关系由中文逗号和重复句式自然体现，无须另加“又”或“并且”。
- source_word: שַׁלּוּם
  choice: 沙龙
  rationale: 采用现代中文圣经中通行的人名音译；此处为人名，不按普通名词含义翻译。
