- source_word: וַ/אֲחִיטוּב
  choice: 亚希突
  rationale: 专有名词按现代中文圣经常用音译处理；句首连接词不另译，以符合中文家谱叙述的自然表达。
- source_word: הוֹלִיד
  choice: 生
  rationale: 使役形在家谱语境中表示“生、成为……的父亲”；中文用“生”简洁自然，并保留父系家谱的递承意义。
- source_word: אֶת
