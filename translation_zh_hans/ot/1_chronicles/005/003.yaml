base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/003.yaml
  text: 'The sons of Reuben, the firstborn of Israel: Hanoch, Pallu, Hezron, and Carmi.'
translation:
  language: zh_hans
  text: 以色列的长子吕便的儿子是：哈诺、法路、希斯仑和迦米。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是בֵּן的复数构造形式；在紧接四个男性名字的族谱中，译作“儿子”最准确自然。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: 以色列的长子
  rationale: 保留希伯来语构造短语，并作为同位语说明吕便的身份；“长子”准确表达בְּכוֹר。
- source_word: חֲנוֹךְ
  choice: 哈诺
  rationale: 采用现代中文圣经传统中通行的音译，以区别同形或近似名字的既有译名。
- source_word: פַלּוּא
  choice: 法路
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: חֶצְרוֹן
  choice: 希斯仑
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: כַרְמִי
  choice: 迦米
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions:
- issue: “长子”的身份说明
  choice: 将“以色列的长子”直接置于“吕便”之前作同位性修饰
  alternative: 吕便是以色列的长子；他的儿子是……
  rationale: 原文是简洁的族谱标题，没有明示系词；当前译法既保留其同位关系，也避免添加原文没有的独立判断句。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“是：”引出名单，使希伯来语省略谓语的族谱句式在中文中清楚流畅；人名遵循通行中文圣经译名。
