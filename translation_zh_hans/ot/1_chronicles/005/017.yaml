  yaml_path: translation/ot/1_chronicles/005/017.yaml
  text: All of them were enrolled by genealogy in the days of Jotham king of Judah[a], and in the days of Jeroboam king of Israel.
translation:
  language: zh_hans
  text: 他们全都在犹大王约坦年间，以及在以色列王耶罗波安年间被记入家谱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按家谱登记”、“按家谱核定”。希伯来语动词指被列入家谱记录。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: 他们全都
  rationale: 该词带第三人称阳性复数后缀，表示前文所述众人的全体；“他们全都”自然保留了明确的代词含义。
- source_word: הִתְיַחְשׂוּ
  choice: 按家谱登记
  rationale: 该动词在《历代志》中指被列入或核算在宗谱记录中；“按家谱登记”兼顾登记行为及家谱依据，符合现代汉语表达。
- source_word: בִּימֵי
  choice: 在……年间
  rationale: 希伯来语直译为“在……的日子里”，此处表示君王在位时期；译作“年间”自然简洁，又不超出原文的时间含义。
- source_word: יוֹתָם
  choice: 约坦
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 直接表达“犹大的王”，符合现代汉语对君王称号的自然语序。
- source_word: וּבִימֵי
  choice: 和……年间
  rationale: 保留连接词及重复的时间框架，使两个君王时期并列清楚。
- source_word: יָרָבְעָם
  choice: 耶罗波安
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 直接表达“以色列的王”，符合现代汉语对君王称号的自然语序。
