id: 1CH.5.20
reference: 1 Chronicles 5:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֵּעָזְר֣וּ עֲלֵי/הֶ֔ם וַ/יִּנָּתְנ֤וּ בְ/יָדָ/ם֙ הַֽ/הַגְרִיאִ֔ים וְ/כֹ֖ל שֶׁ֣/עִמָּ/הֶ֑ם כִּ֠י לֵ/אלֹהִ֤ים זָעֲקוּ֙ בַּ/מִּלְחָמָ֔ה וְ/נַעְתּ֥וֹר לָ/הֶ֖ם כִּי בָ֥טְחוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
translation:
  language: zh_hans
  text: 他们在与夏甲人交战时得到援助；夏甲人[a]和所有与他们在一起的人都被交在他们手中[b]。这是因为他们在战斗中向神呼求，神就应允了他们[c]，因为他们信靠他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夏甲人”也可音译作“夏甲利人”。
    reason: alternative_reading
  - marker: b
    text: “被交在他们手中”是希伯来语惯用语，意思是被交给他们处置，在战斗中遭到击败。
    reason: lexical_alternative
  - marker: c
    text: “应允了他们”也可译作“接受了他们的恳求”，指神对他们的呼求作出有利回应。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  choice: 他们得到援助，战胜了敌人
  rationale: עזר的尼法勒形态表示“得到帮助”，施助者在本分句中没有明说；עֲלֵיהֶם表示这帮助是用来对付敌人的。译文保留施助者未明说的特点，同时自然表达战斗结果。
- source_word: וַיִּנָּתְנוּ בְיָדָם
  choice: 都被交在他们手中
  rationale: נתן的被动式与ביד构成常见军事用语，表示敌方被交付、遭到击败；正文保留希伯来文“手中”的意象，并以脚注说明。
- source_word: הַהַגְרִיאִים
  choice: 夏甲人
  rationale: 这是该族名在现代中文圣经传统中通行且易于识别的译名，对应Hagrites/Hagarites。
- source_word: וְכֹל שֶׁעִמָּהֶם
  choice: 和所有与他们同伙的人
  rationale: 所指是与夏甲人一同作战的盟友或随从势力；“同伙”在军事语境中比单纯的“同在一起”更清楚。
- source_word: כִּי לֵאלֹהִים זָעֲקוּ בַּמִּלְחָמָה
  choice: 这是因为他们在战斗中向神呼求
  rationale: זעק表达在危急中求助的呼喊；במלחמה指眼前这场战斗。
- source_word: וְנַעְתּוֹר לָהֶם
  choice: 神就应允了他们
  rationale: עתר的尼法勒形态表示接受恳求、作出有利回应。“应允了他们”既符合现代汉语，也不在正文中添入原文未明说的“祷告”或“请求”等宾语。
- source_word: כִּי בָטְחוּ בוֹ
  choice: 因为他们信靠他
  rationale: בטח ב表示倚赖、信任；“信靠”保留了这种关系性与因果联系。
theological_decisions:
- issue: 战斗中援助者的身份
  choice: 以“他们得到援助”保留被动表达，不在首句直接补出“神”。
  alternative: 神帮助他们战胜了敌人。
  rationale: 希伯来文动词为被动式，直接施助者在该分句中隐含；下文关于向神呼求、蒙神应允的话已清楚表明神是最终的帮助者，无须改写原句的句法重点。
- issue: 神对呼求的回应
  choice: 神就应允了他们
  alternative: 神接受了他们的恳求／神垂听了他们。
  rationale: 原文强调神对恳求作出有利回应。“应允”保留这一含义，同时避免把原文未明说的宾语具体化。
- issue: 得胜、呼求与信靠之间的因果关系
  choice: 保留两次“因为”，分别连接得胜与呼求、神的应允与信靠。
  alternative: 将第二个“因为”弱化为并列或结果关系。
  rationale: 两个כִּי都自然表达原因；保留它们可呈现经文本身将呼求、信靠和神的回应相联的神学结构，而不进一步解释这种关系的机制。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“夏甲人”为通行族名；“被交在他们手中”保留原文意象，并用脚注消除可能的理解障碍。全节保持叙事语体，避免加入宗派性解释。
