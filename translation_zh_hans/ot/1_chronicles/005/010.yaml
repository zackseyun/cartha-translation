base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/010.yaml
  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
translation:
  language: zh_hans
  text: 扫罗在世时，他们与夏甲人[a]交战；夏甲人落在他们手中[b]，他们就住在夏甲人的帐篷里，居住遍及基列以东全境。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“哈革人”。希伯来文这一族名很可能指与夏甲有关的族群。
    reason: lexical_alternative
  - marker: b
    text: 直译“他们落在他们手中”，意思是夏甲人落入他们的权势之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי שָׁאוּל
  choice: 扫罗在位的时候
  rationale: בִּימֵי是表示某人所处时代的惯用语；结合扫罗的身份，译为“在位的时候”自然清楚，也符合上下文的历史时期。
- source_word: עָשׂוּ מִלְחָמָה עִם
  choice: 与……交战
  rationale: 这是进行战争的惯用表达；希伯来文介词עִם本义为“与”，汉语“与……交战”既保留其形式，也明确敌对关系。
- source_word: הַהַגְרִאִים
  choice: 夏甲人
  rationale: 该族名很可能与夏甲有关；“夏甲人”能在现代汉语中清楚呈现这一词源联系。
- source_word: וַיִּפְּלוּ בְּיָדָם
  choice: 夏甲人落在他们手中
  rationale: 原文直译为“他们落在他们手中”，是落入某人权势或控制之下的习语。为消除汉语中两个“他们”所造成的不必要指代混乱，将语境隐含的主语明确为“夏甲人”，同时保留“落在……手中”的原文意象。
- source_word: וַיֵּשְׁבוּ
  choice: 住进
  rationale: יָשַׁב可指居住、定居；这里描述战胜后占用对方帐篷，“住进”自然表达进入并居住其中，又不额外断定永久定居。
- source_word: בְּאָהֳלֵיהֶם
  choice: 夏甲人的帐篷
  rationale: 代词所指最自然是被击败的夏甲人。汉语若直译“他们的帐篷”容易误指胜方，因此明确所指。
- source_word: עַל כָּל פְּנֵי מִזְרָח לַגִּלְעָד
  choice: 遍布基列以东全境
  rationale: עַל כָּל־פְּנֵי表示横跨、遍及某一片区域；此译自然呈现其空间广度，并保留相对于基列的方位。
