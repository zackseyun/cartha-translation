- source_word: אֶת
  choice: 不单独译出
  rationale: 希伯来语直接宾语标记在中文中没有对应的独立词，其语法功能由语序体现。
- source_word: פִּינְחָס
  choice: 非尼哈
  rationale: 采用现代中文圣经中通行的专名译法；原文两次出现，译文也两次保留，以清楚呈现家谱链条。
- source_word: אֲבִישׁוּעַ
  choice: 亚比书
  rationale: 采用现代中文圣经中通行的专名译法，并与祭司家谱中的同名人物保持一致。
