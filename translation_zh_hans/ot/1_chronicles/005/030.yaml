lexical_decisions:
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 按现代中文圣经中通行的专名译法音译，并与相关祭司家谱保持一致。
- source_word: הוֹלִיד / הֹלִיד
  choice: 生
