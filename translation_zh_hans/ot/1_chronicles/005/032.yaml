  text: 乌西生西拉希雅；西拉希雅生米拉约。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עֻזִּי
  choice: 乌西
  rationale: 人名按现代中文圣经常见形式音译；句首连接词在本节独立呈现时不译，以免中文突兀。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 使役形在家谱语境中表示生育、成为父亲；“生了”简洁自然，并保留家谱链条的表达。
- source_word: אֶת
  choice: 不另译
  rationale: 直接宾语标记在现代汉语中没有对应词，由语序体现。
- source_word: זְרַחְיָה
  choice: 西拉希雅
  rationale: 按希伯来语人名音译，并以“雅”体现名字末尾的神名成分。
- source_word: וּֽ/זְרַֽחְיָה
  choice: 西拉希雅
  rationale: 重复人名以维持家谱链条；连接词依自然汉语用逗号体现，不机械译作“并且”。
- source_word: מְרָיֽוֹת
  choice: 米拉约
  rationale: 按希伯来语 מְרָיוֹת 音译；抄本传统及部分译本另有读法，故加注说明。
