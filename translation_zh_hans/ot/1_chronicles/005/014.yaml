  text: אֵ֣לֶּה בְּנֵ֣י אֲבִיחַ֗יִל בֶּן חוּרִ֡י בֶּן יָ֠רוֹחַ בֶּן גִּלְעָ֧ד בֶּן מִיכָאֵ֛ל בֶּן יְשִׁישַׁ֥י בֶּן יַחְדּ֖וֹ בֶּן בּֽוּז׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/014.yaml
  text: These were the sons of Abihail son of Huri[a], son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.
translation:
  language: zh_hans
  text: 这些人是亚比亥的子孙[a]：亚比亥是户利的儿子，户利是雅罗亚的儿子，雅罗亚是基列的儿子，基列是米迦勒的儿子，米迦勒是耶示筛的儿子，耶示筛是雅多的儿子，雅多是布斯的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文这里用“儿子们”，后面反复用“儿子”。在族谱中，这类用语可以指家族谱系，不一定列出每一代人。
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些人是
  rationale: 复数指示词引出前文所列的人；中文无须用时态标记，可自然译作“这些人是”。
- source_word: בְּנֵי
  choice: 子孙
  rationale: 该词字面为“儿子们”，但在族谱语境中可指一个家族谱系中的后代；“子孙”既符合上下文，也避免误示这些人都是亚比亥的亲生儿子。
- source_word: בֶּן
  choice: 是……的儿子
  rationale: 保留希伯来文反复使用的父子谱系格式；脚注说明族谱可能省略世代。
- source_word: אֲבִיחַיִל
  choice: 亚比亥
  rationale: 按现代中文圣经人名的常见形式音译。
- source_word: חוּרִי
  choice: 户利
  rationale: 按希伯来语辅音和元音音译，并采用简明易读的中文形式。
- source_word: יָרוֹחַ
  choice: 雅罗亚
  rationale: 音译该专名，兼顾词首 y、长元音及词尾喉音的传统中文表达。
- source_word: גִּלְעָד
  choice: 基列
  rationale: 采用该圣经专名通行的中文译法。
- source_word: מִיכָאֵל
  choice: 米迦勒
  rationale: 采用该圣经人名通行的中文译法。
- source_word: יְשִׁישַׁי
  choice: 耶示筛
  rationale: 依希伯来语形式音译，并采用中文圣经中较通行的写法。
- source_word: יַחְדּוֹ
  choice: 雅多
  rationale: 依希伯来语读音音译为自然、简洁的中文人名。
- source_word: בּוּז
  choice: 布斯
  rationale: 采用该圣经专名通行的中文音译。
theological_decisions:
- issue: 族谱中的亲子关系是否均为直接父子关系
  choice: 正文保留“儿子”的逐级表达，并以脚注说明族谱用语可能涵盖省略的世代
  alternative: 全部译作“后代”或“子孙”
  rationale: 原文连续使用单数 בֶּן，形式上是“某人的儿子”；但古代族谱可能跳代。正文保留形式，脚注保留其实际范围的开放性，避免过度判定。
translation_notes:
  register: 采用现代、庄重而易懂的族谱叙述。将原文紧密串联的人名谱系展开为重复的“某人是某人的儿子”，以减少中文阅读歧义；分号保留首句总述与后续谱系之间的联系。
