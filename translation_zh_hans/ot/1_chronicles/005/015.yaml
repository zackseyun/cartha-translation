  yaml_path: translation/ot/1_chronicles/005/015.yaml
  text: Ahi son of Abdiel[a], son of Guni, was head of their fathers’ houses.
translation:
  language: zh_hans
  text: 亚希是亚比叠的儿子，亚比叠是古尼的儿子，作他们父家的首领。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们父家的首领”也可译为“他们祖先家族的首领”或“他们宗族的首领”。
    reason: 说明“父家”所指的祖源家族单位，并反映“首领”与“父家”在中文表达上的可行替代译法。
lexical_decisions:
- source_word: אֲחִי
  choice: 亚希
  rationale: 人名按现代中文圣经常用音译处理。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 此处为家谱公式，直系父子关系是最自然的理解；同时不排除该词在其他语境中可指后裔。
- source_word: עַבְדִּיאֵל
  choice: 亚伯底业
  rationale: 采用符合现代中文圣经人名习惯的音译；名字末尾的神名成分保留为“业”。
- source_word: גּוּנִי
  choice: 古尼
  rationale: 采用现代中文圣经常见音译。
- source_word: רֹאשׁ
  choice: 首领
  rationale: 该词在此指家族群体的领导者；“首领”自然表达其职分，也保留“居首”的语义。
- source_word: לְבֵית אֲבוֹתָם
  choice: 他们父家的
  rationale: “父家”保留希伯来语家族组织术语及父系祖先的意象；介词 לְ 在此结合上下文表达亚希对于该父家的领导关系。
