base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/022.yaml
  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
translation:
  language: zh_hans
  text: 因为有许多人被杀而倒下；这场争战是出于上帝[a]。他们就住在那些人的地方，直到被掳之时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这场争战属于上帝。”希伯来文强调这场争战的结果出于上帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 第一个כִּי承接并解释上文得胜的情形；中文用“因为”自然保留因果关系。
- source_word: חֲלָלִים רַבִּים
  choice: 许多被杀的人
  rationale: חֲלָלִים指战斗中被刺杀或被杀的人，而非泛指死者；此译保留其战争语境。
- source_word: נָפָלוּ
  choice: 倒下了
  rationale: נפל在战争语境中常指倒地身亡；“被杀的人”已经表明死亡，“倒下了”可保留原文意象而不重复增译。
- source_word: כִּי
  choice: 因为
  rationale: 第二个כִּי说明大量敌军倒下的原因，译作“因为”清楚表达因果关系。
- source_word: מֵהָאֱלֹהִים
  choice: 出于上帝
  rationale: 介词מִן表示来源；“出于上帝”保留争战及其结果源自上帝的表达，又不把原文扩展为更强的直接施为陈述。
- source_word: הַמִּלְחָמָה
  choice: 这场争战
  rationale: מִלְחָמָה指上文所述的具体军事冲突；“这场争战”在中文中指向清楚，也具有庄重的经文语体。
- source_word: וַיֵּשְׁבוּ
  choice: 他们就住
  rationale: ישב可指居住或定居；结合占据敌方土地的语境，“住”自然易懂，后面的地点短语体现接替定居之意。
- source_word: תַחְתֵּיהֶם
  choice: 在那些人的地方
  rationale: 此处是接替被击败者而居的惯用表达，并非空间意义的“在他们下面”；“那些人”也避免中文代词指代含混。
- source_word: עַד הַגֹּלָה
  choice: 直到被掳的时候
  rationale: גּוֹלָה可指流亡或被迁徙；在这里指各支派后来被掳的历史事件，“被掳的时候”比抽象的“流亡”更自然明确。
theological_decisions:
- issue: 上帝在争战中的参与
  choice: 这场争战是出于上帝
  alternative: 这场争战属于上帝
  rationale: 希伯来文以来源介词מִן把争战及其结果归源于上帝。正文保留这一宣称，却不扩展成原文没有明说的完整战争神学；脚注列出可表达归属意味的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“争战”保留军事语境和经文语体；“那些人的地方”明确指出得胜者接替被击败者居住。脚注标记[a]已置于正文相应位置。
