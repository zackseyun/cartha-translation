lexical_decisions:
- source_word: וַיַּעֲשׂוּ מִלְחָמָה
  choice: 交战
  rationale: 这是“进行战争、交战”的希伯来语惯用表达。现代汉语用“交战”简洁自然，并保留军事冲突的含义。
- source_word: עִם
  choice: 与
  rationale: 在战争语境中表示敌对关系；汉语“与……交战”已自然表达“对抗”之意。
- source_word: הַהַגְרִיאִים
  choice: 夏甲人
  rationale: 这是族名。采用中文圣经传统中通行的“夏甲人”，既便于识别，也不在正文中额外断定其族源。
- source_word: וִיטוּר
  choice: 伊突
  rationale: 按现代中文圣经中通行形式音译专名。
- source_word: וְנָפִישׁ
  choice: 拿非施
  rationale: 按现代中文圣经中通行形式音译专名。
- source_word: וְנוֹדָב
  choice: 和挪答
  rationale: 按现代中文圣经中通行形式音译专名，并以“和”保留名单末项的连接结构。
