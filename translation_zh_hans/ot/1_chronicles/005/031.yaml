  text: 亚比书生布基，布基又生乌西。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: 亚比书
  rationale: 专名按现代中文圣经通行译名音译；词首连接词在汉语中无需单独译出，以免句式生硬。
- source_word: הוֹלִיד
  choice: 生
  rationale: 使役形在家谱语境中表示生育、成为父亲；中文家谱惯用“生”，简洁自然，也准确保留父系谱系关系。
- source_word: אֶת
  choice: 不译
  rationale: 这是希伯来语特指直接宾语标记，现代汉语没有对应成分。
- source_word: בֻּקִּי
  choice: 布基
  rationale: 专名采用现代中文圣经中通行的音译形式。
- source_word: וּ/בֻקִּי
  choice: 布基又
  rationale: 连接词 ו 表示家谱链条的延续；用“又”自然呈现前后相承的关系，避免机械重复“和”。
- source_word: הוֹלִיד
  choice: 生
  rationale: 与前一处相同，在家谱语境中一致译为“生”。
- source_word: עֻזִּי
  choice: 乌西
  rationale: 专名采用现代中文圣经中通行的音译形式。
