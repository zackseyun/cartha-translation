base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/041.yaml
  text: And Jehozadak went away when Yahweh sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar[a].
translation:
  language: zh_hans
  text: 耶和华借尼布甲尼撒之手使犹大和耶路撒冷被掳时，约萨答离去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式化地译作：“约萨答去了；当耶和华借尼布甲尼撒之手放逐犹大和耶路撒冷时。”
    reason: 说明הָלַךְ可直译为“去了”，并展示בְּהַגְלוֹת较贴近原文结构的译法。
lexical_decisions:
- source_word: וִיהוֹצָדָק
  choice: 约萨答也
  rationale: 采用该名字在中文圣经传统中的通行译名“约萨答”；前缀连接词在语境中译作“也”，自然承接前文名单。
- source_word: הָלַךְ
  choice: 离去了
  rationale: 基本义为“去、行走”；在被掳离境的语境中，“离去了”既表达离开本地，又不额外断定他是自愿出走或被直接押走。
- source_word: בְּהַגְלוֹת
  choice: 使……被掳时
  rationale: 介词加使役形不定词在此表示时间背景；“使……被掳”保留耶和华作为使役主体，并以自然汉语表达放逐事件。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号代替。
- source_word: אֶת־יְהוּדָה וִירוּשָׁלִָם
  choice: 犹大和耶路撒冷
  rationale: 原文直接以犹大和耶路撒冷为宾语；不擅自增添“居民”或“百姓”，保留地名可兼指其政治共同体的表达。
- source_word: בְּיַד
  choice: 借……之手
  rationale: 保留希伯来语表示工具或代理者的“借某人之手”习语，同时清楚区分神圣主导与人的执行。
- source_word: נְבֻכַדְנֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用该巴比伦王名字在现代中文圣经中的通行译法。
theological_decisions:
- issue: 被掳事件中的神圣主权与人的行动
  choice: 耶和华是使犹大和耶路撒冷被掳的主体，尼布甲尼撒是执行此事的人间代理者。
  alternative: 只把尼布甲尼撒表达为被掳事件的实际主体。
  rationale: 原文以耶和华为使役形不定词的逻辑主语，并用“借尼布甲尼撒之手”标明工具或代理关系；译文保留两层行动者之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被掳”是普通中文读者能够理解的圣经历史用语；“借……之手”略带经文色彩，但意义清楚，并保留原文的代理结构。
