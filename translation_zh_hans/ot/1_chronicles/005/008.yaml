  yaml_path: translation/ot/1_chronicles/005/008.yaml
  text: and Bela son of Azaz[a], son of Shema, son of Joel; he lived in Aroer, as far as Nebo and Baal-meon.
translation:
  language: zh_hans
  text: 比拉是亚撒的儿子；亚撒是示玛的儿子；示玛是约珥的儿子。比拉住在亚罗珥，直到尼波和巴力免。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבֶלַע
  choice: 比拉
  rationale: 连词承接上文的家谱名单；中文在本节开头不必机械译出“和”。人名按现代中文圣经惯用音译作“比拉”。
- source_word: בֶּן עָזָז בֶּן שֶׁמַע בֶּן יוֹאֵל
  choice: 亚撒兹的儿子比拉，是示玛的儿子、约珥的孙子
  rationale: 希伯来文连续三次使用“儿子”，表达家系链条。中文通过“儿子……儿子、孙子”清楚呈现代际关系，同时避免生硬重复；原文未要求将其宽泛化为“后裔”。
- source_word: הוּא יוֹשֵׁב
  choice: 他住在
  rationale: 独立代词使家谱之后的主语重新突出；ישׁב的主动分词表示居住、定居，用现代自然的“住在”表达。
- source_word: בַּעֲרֹעֵר
  choice: 在亚罗珥
  rationale: 介词ב表示地点；地名按中文惯用译名处理。
- source_word: וְעַד נְבוֹ וּבַעַל מְעוֹן
  choice: 直到尼波和巴力·免
  rationale: עַד标示地域延伸的界限；两个地名由连词并列，故译为“直到尼波和巴力·免”，保留其地理范围表达。
