  source_fidelity: 需修订。现译将连续的家谱关系错误地归于比拉本人：原文是“比拉—亚撒兹之子—示玛之子—约珥之子”，即亚撒兹是示玛之子、示玛是约珥之子；草稿“比拉……是示玛的儿子、约珥的孙子”则使比拉成为示玛之子，改变了家系。居住范围“在亚罗珥，直到尼波和巴力免”可保留原文的简略地理表述。
