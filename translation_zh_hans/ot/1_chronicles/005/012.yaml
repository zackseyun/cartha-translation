  text: Joel the chief[a], Shapham the second, and Jaanai and Shaphat in Bashan.
translation:
  language: zh_hans
  text: 约珥为首，沙番居次[a]；雅乃和沙法在巴珊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“沙番为副手”，或“沙番位居第二”。
    reason: הַמִּשְׁנֶה既可泛指居第二位，也可能表示副职；正文保留位次表达，脚注列出可能的职务性理解。
lexical_decisions:
- source_word: יוֹאֵל
  choice: 约珥
  rationale: 专有名词，采用现代中文圣经中通行的音译。
- source_word: הָרֹאשׁ
  choice: 为首
  rationale: רֹאשׁ本义为“头”，在此表示首位或领导地位；“为首”自然、简洁，也符合名单语境。
- source_word: וְשָׁפָם
  choice: 沙番
  rationale: 专有名词，按希伯来语形式并参照中文传统译名音译。
- source_word: הַמִּשְׁנֶה
  choice: 居次
  rationale: מִשְׁנֶה表示第二位或次等职位；“居次”保留位次含义，同时不强行确定为正式的副职。
- source_word: וְיַעְנַי
  choice: 雅乃
  rationale: 专有名词，采用简洁且符合现代普通话读法的音译。
- source_word: וְשָׁפָט
  choice: 沙法
  rationale: 专有名词，采用中文圣经传统中常见的音译形式。
- source_word: בַּבָּשָׁן
  choice: 住在巴珊
  rationale: 原文介词短语直译为“在巴珊”；结合前文族谱和居住地语境，补出“住”使现代汉语完整自然，但不改变其地点功能。
