source:
  edition: WLC
  text: הִנְ/נִ֣י מְעִירָ֔/ם מִן הַ֨/מָּק֔וֹם אֲשֶׁר מְכַרְתֶּ֥ם אֹתָ֖/ם שָׁ֑מָּ/ה וַ/הֲשִׁבֹתִ֥י גְמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/007.yaml
  text: Look[a], I am stirring them up from the place where you sold them[b], and I will return your recompense on your own head.
translation:
  language: zh_hans
  text: 看哪，我要把他们从你们卖他们去的地方唤起[a]；我要使你们的报应归到你们自己头上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “唤起”也可译作“叫醒”或“激起”。希伯来语动词可指使人醒来、奋起或开始行动。
    reason: lexical_alternative
  - marker: b
    text: 也可意译为“我要报应你们”；原文直译为“我要使你们的报应归到你们头上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: הִנְנִי引出庄严的神谕并有唤起注意的作用。“看哪”在现代汉语中仍属庄重而可懂的经文用语；结合后续未完成式所表达的行动，译作“我要”。
- source_word: מְעִירָם
  choice: 把他们……唤起
  rationale: עור的使役分词可指使人醒来、奋起或行动。“唤起”保留其宽泛性，并借“从……地方”表明神使被卖之人从当地起来、离开，而不限定为情绪激发或军事动员。
- source_word: מִן הַמָּקוֹם
  choice: 从……地方
  rationale: 忠实表达介词מִן的空间起点含义，汉语自然清楚。
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתָם שָׁמָּה
  choice: 你们卖他们去的地方
  rationale: שָׁמָּה带有“到那里”的方向意味；“卖他们去的地方”既符合现代汉语，也比单说“卖他们的地方”更准确地保留目的地含义。
- source_word: וַהֲשִׁבֹתִי
  choice: 我要使……归到
  rationale: שוב的使役式有“使返回”之意。与“报应”搭配时，“使……归到”保留报偿反归行为者的具体意象，避免直接简化为“惩罚”或“报复”。
- source_word: גְמֻלְכֶם
  choice: 你们的报应
  rationale: גמול在本语境中指行为所得的回报，带有司法与道德上的报偿意味。“报应”是自然、庄重的现代汉语，并体现负面的报偿语境。
- source_word: בְּרֹאשְׁכֶם
  choice: 你们自己头上
  rationale: 直译并保留希伯来语中恶果反落在责任人身上的惯用意象；“自己”清楚表达反身和对称的报偿关系。
theological_decisions:
- issue: מְעִירָם所表达的神圣行动性质
  choice: 神主动使被卖、分散的人从所在之地起来并行动
  alternative: 仅指内心觉醒，或特指军事动员
  rationale: 动词语义范围包括唤醒、激起和使行动；紧接的“从……地方”指向神使他们从被卖去之处起来，但原文没有把行动限定为心理或军事层面。
- issue: גְמֻלְכֶם בְּרֹאשְׁכֶם的报偿含义
  choice: 使作恶者应得的报偿反归其自身
  alternative: 概括译成“我要惩罚你们”
  rationale: 原文不只使用一般的惩罚词，而以“报偿归到头上”的具体意象强调行为与后果之间的对应关系；译文予以保留，不另加教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”保留神谕开头的郑重提示功能；全句保留“报应归到头上”的希伯来意象，同时以脚注说明其自然意译。所有脚注标记均已置于正文相应位置。
