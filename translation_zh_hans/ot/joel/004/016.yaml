source:
  edition: WLC
  text: וַ/יהוָ֞ה מִ/צִּיּ֣וֹן יִשְׁאָ֗ג וּ/מִ/ירוּשָׁלִַ֨ם֙ יִתֵּ֣ן קוֹל֔/וֹ וְ/רָעֲשׁ֖וּ שָׁמַ֣יִם וָ/אָ֑רֶץ וַֽ/יהוָה֙ מַֽחֲסֶ֣ה לְ/עַמּ֔/וֹ וּ/מָע֖וֹז לִ/בְנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/016.yaml
  text: And Yahweh roars from Zion and gives his voice from Jerusalem[a], and the heavens and the earth quake; but Yahweh is a refuge for his people[b], and a stronghold for the sons of Israel.
translation:
  language: zh_hans
  text: 耶和华从锡安吼叫，从耶路撒冷发声[a]；天地都震动。然而，耶和华是他百姓的避难所，是以色列人[b]的坚固堡垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“发出他的声音”，指大声或如雷鸣般发声。
    reason: lexical_alternative
  - marker: b
    text: “以色列人”希伯来文直译为“以色列的众子”，在这里是指以色列民族。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中对四字神名的通行译法，保留专名性质，不以“主”替代。
- source_word: מִצִּיּוֹן
  choice: 从锡安
  rationale: 介词表示起点；“锡安”采用通行地名译法。
- source_word: יִשְׁאָג
  choice: 吼叫
  rationale: שׁאג常指狮子吼叫；“吼叫”保留原文鲜明而有威势的意象。
- source_word: וּמִירוּשָׁלִַם
  choice: 从耶路撒冷
  rationale: 保留与“从锡安”平行的句法结构，并采用通行地名译法。
- source_word: יִתֵּן קוֹלוֹ
  choice: 发声
  rationale: 希伯来文直译为“发出他的声音”；“发声”在现代汉语中简洁自然，也保留大声宣告或雷鸣般出声的含义。
- source_word: וְרָעֲשׁוּ
  choice: 震动
  rationale: רעשׁ表示摇撼、震颤；用于“天地”时，“震动”既自然，也符合神显场景。
- source_word: שָׁמַיִם וָאָרֶץ
  choice: 天地
  rationale: “天地”是现代汉语表达宇宙整体的自然对举，准确涵盖希伯来文“诸天与地”。
- source_word: מַחֲסֶה
  choice: 避难所
  rationale: 保留可供躲避、庇护之处的空间隐喻。
- source_word: לְעַמּוֹ
  choice: 他百姓的
  rationale: 将关系与受益含义自然表达为所属结构：“他百姓的避难所”。
- source_word: וּמָעוֹז
  choice: 坚固堡垒
  rationale: מָעוֹז可指坚固之地或力量来源；“坚固堡垒”保留保护性与防御性的具体意象。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列人的
  rationale: בני ישראל是民族称谓；“以色列人”是现代汉语最自然准确的表达，脚注同时说明其字面形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文明确使用四字神名。正文采用汉语读者熟悉的专名“耶和华”，避免以称号“主”遮盖原文专名。
- issue: בְּנֵי יִשְׂרָאֵל 的民族与性别表达
  choice: 以色列人
  alternative: 以色列的众子；以色列子民
  rationale: 该固定表达在此指以色列民族整体，并非特意排除女性。正文用自然的民族称谓，不把希伯来语语法阳性误解为仅指男性；字面形式收入脚注。
- issue: 预言语境中未完成式的时态
  choice: 使用无显式时态标记的“吼叫、发声、震动”
  alternative: 必吼叫、必发声、必要震动
  rationale: 希伯来语未完成式可在预言语境中指将来，也可形成生动的预言性描写。汉语不加“必”可保留这种时间与修辞上的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用“吼叫”保留狮吼般的神显意象，用“避难所”和“坚固堡垒”维持原文两个保护性隐喻的平行；以“然而”清楚表现审判震动与保护百姓之间的转折。
