  text: שִׁלְח֣וּ מַגָּ֔ל כִּ֥י בָשַׁ֖ל קָצִ֑יר בֹּ֤אֽוּ רְדוּ֙ כִּֽי מָ֣לְאָה גַּ֔ת הֵשִׁ֨יקוּ֙ הַ/יְקָבִ֔ים כִּ֥י רַבָּ֖ה רָעָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/013.yaml
  text: Send in the sickle, for the harvest is ripe. Come, go down, for the winepress is full; the vats overflow, for their evil is great.
translation:
  language: zh_hans
  text: 挥动镰刀吧，因为庄稼熟了！来吧，下去吧，因为榨酒池满了；酒槽都满溢了，因为他们的恶极大。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁלְחוּ מַגָּל
  choice: 挥动镰刀吧
  rationale: 字面为“伸出/派出镰刀”；汉语以“挥动镰刀”自然表达开始收割的命令，同时保留审判收割的意象。
- source_word: בָשַׁל קָצִיר
  choice: 庄稼熟了
  rationale: בשל表示成熟，קציר在此借指待收的庄稼或收成；此译简洁自然。
- source_word: רְדוּ
  choice: 下去吧
  rationale: 按马所拉文本保留其通常义“下去”，不依语境改译为“践踏”；这也保存原文略显突兀的空间动作。
- source_word: גַּת
  choice: 榨酒池
  rationale: 指踩压葡萄的榨酒设施，译为“榨酒池”比泛称“酒榨”更具象。
- source_word: הַיְקָבִים
  choice: 酒槽
  rationale: 指承接榨出汁液的槽池；与前面的榨酒池相区别。
- source_word: הֵשִׁיקוּ
  choice: 都满溢了
  rationale: 该动词在此表示液体充盈、涌流或溢出；结合酒槽意象译作“满溢”。
- source_word: רַבָּה רָעָתָם
  choice: 他们的恶极大
  rationale: 保留רעה的道德含义“恶”，并以“极大”传达רבה所表示的程度。
theological_decisions:
- issue: 收割与榨酒意象的审判含义
  choice: 不在正文中明说“审判”，保留意象本身
  alternative: 译成“施行审判吧”之类的解释性表达
  rationale: 上下文显明这是对列国罪恶的审判，但本节借收割和榨酒表达；正文应保存先知诗歌的意象与张力。
- issue: רְדוּ的语义
  choice: 下去吧
  alternative: 践踏吧／踩踏吧
  rationale: 马所拉文本的直接读法是“下去”；虽有译本按榨酒语境理解为踩踏，仍不宜无文本标记地替换该读法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；三个命令句保持急促、有力的先知诗歌节奏。原文有两个“因为”，均予保留；分号呈现榨酒池与酒槽两个并列而递进的画面。
