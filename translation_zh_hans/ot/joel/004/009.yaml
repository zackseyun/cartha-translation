  yaml_path: translation/ot/joel/004/009.yaml
  text: 'Proclaim this among the nations: Consecrate war; stir up the warriors[a]. Let all the men of war draw near; let them come up.'
translation:
  language: zh_hans
  text: 你们要在列国中宣告这事：要将战争分别为圣[a]；唤醒勇士！所有战士都要近前来，都要上来！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “将战争分别为圣”也可理解为“准备作战”。希伯来原文使用礼仪性的“分别为圣”一语，表示将战争分别出来，并为作战作准备。
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְאוּ זֹאת בַּגּוֹיִם
  choice: 你们要在列国中宣告此事
  rationale: קרא在此为复数命令式，表示公开宣告；“此事”自然承接后面的宣告内容。גוים译作“列国”，保留先知文学中对各民族的集体称呼。
- source_word: קַדְּשׁוּ מִלְחָמָה
  choice: 把战争分别为圣
  rationale: קדשׁ的基本含义是分别、使之成为圣；此处虽可按战争语境理解为备战或召集作战，正文仍保留其礼仪性和神圣化色彩，避免消除原文张力。
- source_word: הָעִירוּ הַגִּבּוֹרִים
  choice: 唤起勇士
  rationale: העירו是使役命令式，意为使之醒起、激发；“唤起”兼具召集和激励意味。גברים在军事语境中指英勇善战者，译作“勇士”。
- source_word: יִגְּשׁוּ
  choice: 都要近前来
  rationale: 未完成式在连续号召中具有祈使或命令语气；“近前来”保留接近、集结的正式意味。
- source_word: יַעֲלוּ
  choice: 都要上来
  rationale: עלה的方向意象是上去或上来；译作“上来”保留原文空间表达，不将其过度解释为“进军”。
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: 所有战士
  rationale: 该短语直指参与战争的人；现代汉语“战士”比直译“战争之人”自然，也准确保留军事所指。
theological_decisions:
- issue: 是否保留קדשׁ在战争号召中的礼仪及神圣含义
  choice: 把战争分别为圣
  alternative: 准备作战
  rationale: 该表达在先知性的战争号召中可以具有“备战”的惯用功能，但קדשׁ明确带有分别为圣的词义。正文保留这一不寻常而重要的神学张力，脚注说明语境中的惯用理解，不把它简化为一般军事准备。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“列国”“分别为圣”“勇士”保留先知宣告的正式语体；两个“都要”呈现原文连续号召的力度。脚注标记[a]置于相关战争号召之后，以涵盖“分别为圣”在语境中的另一种理解。
