source:
  edition: WLC
  text: וְ/קִבַּצְתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וְ/ה֣וֹרַדְתִּ֔י/ם אֶל עֵ֖מֶק יְהֽוֹשָׁפָ֑ט וְ/נִשְׁפַּטְתִּ֨י עִמָּ֜/ם שָׁ֗ם עַל עַמִּ֨/י וְ/נַחֲלָתִ֤/י יִשְׂרָאֵל֙ אֲשֶׁ֣ר פִּזְּר֣וּ בַ/גּוֹיִ֔ם וְ/אֶת אַרְצִ֖/י חִלֵּֽקוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/002.yaml
  text: I will gather all the nations and bring them down to the Valley of Jehoshaphat[a], and there I will enter into judgment with them on behalf of my people and my inheritance, Israel[b], whom they scattered among the nations and divided up my land.
translation:
  language: zh_hans
  text: 我必聚集万国，领他们下到约沙法谷[a]；我必在那里与他们争讼，为我的子民、我的产业，就是以色列[b]，因为他们把以色列分散在列国中，又瓜分了我的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约沙法谷”是地名；“约沙法”这个名字本身可能使人联想到“耶和华施行审判”。
    reason: cultural_note
  - marker: b
    text: “为我的子民”也可译作“因我的子民”或“就我的子民而言”。这里的希伯来语介词在司法语境中可表达几个彼此相关的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: קִבַּצְתִּי אֶת כָּל הַגּוֹיִם
  choice: 我必聚集万国
  rationale: קבץ表示聚集、召集；“聚集”自然保留先知语境中召集万国受审的意味。גּוֹיִם在此指各外邦国家或民族，译作“万国”简洁庄重。
- source_word: וְהוֹרַדְתִּים
  choice: 领他们下到
  rationale: ירד的使役形表示使之下去；“领他们下到”既保留使役和方向，也符合现代汉语表达。
- source_word: עֵמֶק יְהוֹשָׁפָט
  choice: 约沙法谷
  rationale: 经文将其作为地名使用，因此音译“约沙法”，不在正文中直接意译其名称含义。
- source_word: וְנִשְׁפַּטְתִּי עִמָּם
  choice: 与他们争讼
  rationale: שפט的Nifal形与עִם连用，可表达进入司法争辩或审判；“争讼”比单纯“审判他们”更能保留双方进入诉讼的法律意象。
- source_word: עַל עַמִּי וְנַחֲלָתִי יִשְׂרָאֵל
  choice: 为我的子民——我的产业以色列——
  rationale: 正文采用“为”表达耶和华因自己的子民所受之事而采取司法行动；“产业”保留נַחֲלָה所含的归属和盟约色彩，“以色列”作为同位语说明“我的子民／产业”所指。עַל的相关歧义则以脚注保留。
- source_word: אֲשֶׁר פִּזְּרוּ בַגּוֹיִם
  choice: 因为他们曾把以色列分散在列国中
  rationale: פזר译作“分散”，贴合流散语境；明确重复“以色列”，避免现代汉语中连续代词造成施事与受事混淆。连接词“因为”把后文呈现为争讼的事实根据。
- source_word: וְאֶת אַרְצִי חִלֵּקוּ
  choice: 又瓜分了我的土地
  rationale: חלק的加强形表示分割、分配；“瓜分”简洁呈现多人切分占有土地的具体行动。“我的土地”保留原文第一人称所属关系。
theological_decisions:
- issue: עַל在司法语境中的含义
  choice: 为我的子民……与他们争讼
  alternative: 因我的子民……与他们争讼；就我的子民……与他们争讼
  rationale: עַל可表示为了、因为或关于。正文选择“为”，体现耶和华为其子民采取司法行动，但脚注同时保留原因和论题两种相近理解，不把原文的语义范围收窄为单一解释。
- issue: נַחֲלָתִי的盟约性归属含义
  choice: 我的产业
  alternative: 我的基业；我的所有
  rationale: “产业”在现代中文中仍可理解为归属之物，并能承载以色列属于耶和华的经文意象；不进一步解释为某一特定神学体系。
- issue: 约沙法地名的潜在文字意义
  choice: 正文音译为“约沙法谷”
  alternative: 耶和华审判谷
  rationale: 原文语法上将其作为地名；名称可能呼应“耶和华施行审判”，但这种呼应适合放入脚注，不宜用意译取代专名。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“争讼”保留原文的司法意象；破折号标明“我的产业以色列”与“我的子民”之间的同位关系。脚注标记均置于正文相应位置，并按内容重新对应：地名说明紧随“约沙法谷”，介词歧义紧随争讼分句。
