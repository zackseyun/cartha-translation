  yaml_path: translation/ot/joel/004/020.yaml
  text: But Judah will be inhabited forever[a], and Jerusalem from generation to generation.
translation:
  language: zh_hans
  text: 但犹大必永远有人居住[a]，耶路撒冷必世世代代有人居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“但犹大必永远居住。”希伯来语动词也可较直译为“居住”或“坐”；在以地域或城市为主语的语境中，很可能表示“有人居住”或“持续有人居住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוּדָה
  choice: 但犹大
  rationale: 句首的 waw 承接上文，并与敌对列国所受的审判形成对照；译作“但”可在现代汉语中自然表达这一转折，同时保留连接作用。
- source_word: לְ/עוֹלָם
  choice: 永远
  rationale: עוֹלָם 在此表示延续至无定限的将来；“永远”简明自然，符合先知性应许的语境。
- source_word: תֵּשֵׁב
  choice: 必有人居住
  rationale: ישׁב 的阴性单数形式与“犹大”一致；以地域为主语时，可表示“有人居住、保持有人居住”。此译法比将地域直接拟人化为“居住”更符合现代汉语，同时保留其持续有人居住的含义。
- source_word: וִ/ירוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 此处 waw 在并列结构中起添加作用；汉语可借平行句式自然体现，无须机械译出“和”。
- source_word: לְ/ד֥וֹר וָ/דֽוֹר
  choice: 世世代代
  rationale: דּוֹר וָדוֹר 是表示一代接一代、持续不断的惯用语；“世世代代”既保留重复延续的意味，也符合庄重自然的现代汉语。
theological_decisions:
- issue: 犹大和耶路撒冷长久未来之应许的性质
  choice: 将本节译为关于犹大和耶路撒冷持续有人居住的直接先知性应许，不限定其实现方式或最终范围。
  alternative: 将其明确解释为纯粹按字面的地缘政治永久性，或主要解释为象征性、教会论性或特定末世论的实现。
  rationale: 希伯来文本宣告犹大和耶路撒冷长久有人居住，却没有在本节界定应许实现的完整方式和时间视野；译文应保留这一神学张力，不加入特定解释体系。
translation_notes:
  register: 采用现代、庄重而通俗的简体中文。两个分句使用平行结构，以呈现希伯来诗句的对应关系；“必”表达未完成式在预言语境中的将来指向。脚注保留 תֵּשֵׁב 的词义幅度。
