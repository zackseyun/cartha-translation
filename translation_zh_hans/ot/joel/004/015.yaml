  text: שֶׁ֥מֶשׁ וְ/יָרֵ֖חַ קָדָ֑רוּ וְ/כוֹכָבִ֖ים אָסְפ֥וּ נָגְהָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/015.yaml
  text: The sun and the moon grow dark[a], and the stars withdraw their brightness.
translation:
  language: zh_hans
  text: 太阳和月亮都昏暗了，星辰也收起光辉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“星辰收聚自己的光芒”，即不再发光。
    reason: אָסְפוּ 的基本意思是“收聚、收集”，在这里与“光辉”连用，可理解为把光芒收回或抑制住。
lexical_decisions:
- source_word: שֶׁמֶשׁ
  choice: 太阳
  rationale: 这是现代汉语对该天体的标准称呼，也自然适合本节的宇宙性意象。
- source_word: וְיָרֵחַ
  choice: 和月亮
  rationale: 准确表达并列关系；“月亮”是现代汉语中自然、通俗而庄重的说法。
- source_word: קָדָרוּ
  choice: 都昏暗了
  rationale: 该词表达变暗、失去明亮的状态；“昏暗了”保留其动态意味，“都”则自然标明复数主语共同发生变化。
- source_word: וְכוֹכָבִים
  choice: 星辰也
  rationale: “星辰”适合先知诗歌的庄重语体而不显陈旧；“也”清楚连接第二个平行分句。
- source_word: אָסְפוּ
  choice: 收起
  rationale: 保留 אָסַף“收聚、收回”的具体意象；与“光辉”搭配，可自然表达星辰不再放光，同时避免把原文直接解释成单纯的“消失”或“熄灭”。
- source_word: נָגְהָם
  choice: 光辉
  rationale: 该词指明亮、光芒或光辉；“光辉”既准确又符合星辰意象，并以“收起光辉”体现希伯来文的领属后缀“它们的”。
theological_decisions:
- issue: 先知审判图景中的宇宙昏暗
  choice: 按原文直接呈现太阳、月亮昏暗和星辰收起光辉的宇宙性图景，不说明其为字面事件、比喻或启示文学象征。
  alternative: 将其明确解释为实际天象、神审判的象征，或兼具字面与象征意义的末世图景。
  rationale: 希伯来文以简练的诗句陈述这些现象，并未界定其解释方式；译文应保留这种神学与文学张力。
translation_notes:
  register: 采用现代标准普通话和简体中文。句式简洁庄重，保留希伯来诗歌的平行结构与宇宙性意象；“星辰”略具诗意，但仍为普通现代读者熟悉。“收起光辉”兼顾字面意象和自然表达，脚注交代词义上的另一种直译可能。
