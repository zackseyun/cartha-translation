  text: וּ/בְנֵ֤י יְהוּדָה֙ וּ/בְנֵ֣י יְרוּשָׁלִַ֔ם מְכַרְתֶּ֖ם לִ/בְנֵ֣י הַ/יְּוָנִ֑ים לְמַ֥עַן הַרְחִיקָ֖/ם מֵ/עַ֥ל גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/006.yaml
  text: And the sons of Judah and the sons of Jerusalem you sold to the sons of the Greeks[b][a], in order to remove them far from their border.
translation:
  language: zh_hans
  text: 你们又把犹大人和耶路撒冷人卖给希腊人[a]，为要使他们远离自己的边界[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“希腊人的众子”；也可译作“爱奥尼亚人”。
    reason: 说明希伯来语族群习语及名称的词义范围。
  - marker: b
    text: “边界”也可译作“疆域”。
    reason: 保留גְּבוּל在具体界线与所属地域之间的词义可能。
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה וּבְנֵי יְרוּשָׁלִַם
  choice: 又把犹大人和耶路撒冷人
  rationale: בְּנֵי字面为“众子”，在这里是表示归属某地或群体成员的希伯来语习语；译作“犹大人和耶路撒冷人”符合现代汉语，也准确表达所指人群。句首וּ结合上文有递进、追加作用，译作“又”。
- source_word: מְכַרְתֶּם
  choice: 你们……卖给
  rationale: 这是מכר的Qal完成式第二人称阳性复数，表示对复数对象“你们”的直接指控；汉语用“卖给”自然明确。
- source_word: לִבְנֵי הַיְּוָנִים
  choice: 给希腊人
  rationale: הַיְּוָנִים可指希腊人或爱奥尼亚人；此处采用现代读者最易理解且历史含义较宽的“希腊人”。בְּנֵי在此同样是族群称谓，不必机械译成“众子”。
- source_word: לְמַעַן
  choice: 为要
  rationale: 明确保留目的含义，同时保持庄重简洁的经文语体。
- source_word: הַרְחִיקָם
  choice: 使他们远离
  rationale: רחק的Hiphil形式表达“使……远离”的使役意义；该译法不额外限定是驱逐、运送还是其他方式。
- source_word: מֵעַל גְּבוּלָם
  choice: 远离自己的边界
  rationale: גְּבוּל可指边界，也可转指疆域；正文采用较具体的“边界”。“自己的”在汉语中清楚指向被卖的人，同时反映第三人称复数词尾。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为要”保留先知指控中的目的关系；避免把“使他们远离”具体化为某一种贩运或驱逐方式。
