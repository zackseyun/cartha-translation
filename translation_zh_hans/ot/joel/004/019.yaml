  text: מִצְרַ֨יִם֙ לִ/שְׁמָמָ֣ה תִֽהְיֶ֔ה וֶ/אֱד֕וֹם לְ/מִדְבַּ֥ר שְׁמָמָ֖ה תִּֽהְיֶ֑ה מֵֽ/חֲמַס֙ בְּנֵ֣י יְהוּדָ֔ה אֲשֶׁר שָׁפְכ֥וּ דָם נָקִ֖יא בְּ/אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/019.yaml
  text: Egypt will become a desolation[a], and Edom a desolate wilderness, because of the violence done to the sons of Judah[c][b], whose innocent blood they shed in their land.
translation:
  language: zh_hans
  text: 埃及必成为荒场；以东必成为荒凉的旷野，因为他们对犹大子民[a]施暴，并在他们的土地上[b]流了无辜者的血[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“犹大之子”，这里可泛指犹大人民。
    reason: lexical_alternative
  - marker: b
    text: “他们”最可能指犹大子民，即“在犹大人的土地上”；也可能被理解为指埃及和以东。
    reason: referential_ambiguity
  - marker: c
    text: 原文直译为“无辜的血”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם לִשְׁמָמָה תִהְיֶה
  choice: 埃及必成为荒场
  rationale: לְ与היה表达成为某种状态；“成为荒场”既保留名词שְׁמָמָה的力度，也符合现代汉语表达。
- source_word: וֶאֱדוֹם לְמִדְבַּר שְׁמָמָה תִּהְיֶה
  choice: 以东必成为荒凉的旷野
  rationale: 保留מִדְבָּר“旷野”和שְׁמָמָה“荒凉、荒废”两个语义成分，并使句式与前半句平行。
- source_word: מֵחֲמַס
  choice: 因为他们残害
  rationale: מִן在此表示原因；חָמָס涵盖暴力、残害和强暴不义。“因为他们残害”以自然汉语明确其因果和施害含义。
- source_word: בְּנֵי יְהוּדָה
  choice: 犹大子民
  rationale: 原文直译为“犹大之子”，在此集体指犹大人民；“犹大子民”既保留其群体归属，又比直译更自然。
- source_word: דָם נָקִיא
  choice: 无辜的血
  rationale: 保留原文“血”与“无辜”的紧密搭配，不在正文中完全释义为“无辜之人的血”。
- source_word: בְּאַרְצָם
  choice: 在他们的土地上
  rationale: 保留第三人称复数后缀。就上下文而言，“他们”最自然地指犹大子民，但代词形式仍允许读者看见原文的指代张力。
theological_decisions:
- issue: בְּאַרְצָם中复数代词后缀的所指
  choice: 正文保留“他们的土地上”，并在注释中说明最可能指犹大子民的土地
  alternative: 明确译为“在犹大人的土地上”，或理解为埃及和以东的土地
  rationale: 最近的复数先行词是“犹大子民”，上下文也支持暴行发生在犹大人的土地上；不过原文只使用代词，因此正文不把所指完全明说。
- issue: דָם נָקִיא的语义关系
  choice: 无辜的血
  alternative: 无辜之人的血
  rationale: 原文形式上是“血”加形容词“无辜的”；正文保留这一表达，同时用脚注交代常见的语义展开，避免过度限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“荒场／荒凉的旷野”保留原文平行结构与意象；避免古奥的“荒芜之地”等表达。代词和“无辜的血”的注释用于保留原文可能的指代与语义张力。
