base_translation:
  language: en
  yaml_path: translation/ot/joel/004/001.yaml
  text: For behold[a], in those days and at that time, when I restore the fortunes of Judah and Jerusalem,
translation:
  language: zh_hans
  text: 因为，看哪，在那些日子、那时候，当我恢复犹大和耶路撒冷的景况[a]时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使犹大和耶路撒冷被掳的人归回”；也可理解为“扭转犹大和耶路撒冷被掳的处境”。这个希伯来语惯用语表示使一个民族脱离困境、恢复原有景况，往往以被掳为背景。
    reason: 词义存在可合理保留的不同理解，涉及“恢复景况”与“从被掳中归回”之间的表达差异。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 保留此词承接上文、为下文提供说明或根据的连接作用。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是唤起注意的指示语，突出即将宣告的重大事件；“看哪”保留先知话语的庄重和迫切感。
- source_word: בַּיָּמִים הָהֵמָּה
  choice: 在那些日子
  rationale: 自然对应希伯来语中指向先知话语所述未来时期的固定时间表达。
- source_word: וּבָעֵת הַהִיא
  choice: 那时候
  rationale: 与前一时间短语平行；中文省去机械的“并在”，以顿号连接，既保留强调，也使表达自然。
- source_word: אֲשֶׁר
  choice: 当……时
  rationale: 此处引出与复兴事件相关的时间从句，用“当……时”最自然地表达其句法作用。
- source_word: אשוב אֶת שְׁבוּת
  choice: 使……恢复景况
  rationale: שׁוּב אֶת־שְׁבוּת 是惯用语，可指扭转困境、恢复境况，且常以被掳与归回为背景。主文采用自然而不失宽度的表达，相关歧义保留在脚注中。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: וִירוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经传统中通行的城市名译法。
theological_decisions:
- issue: שׁוּב אֶת־שְׁבוּת 的惯用意义
  choice: 主文译为“使犹大和耶路撒冷恢复景况”
  alternative: “使犹大和耶路撒冷被掳的人归回”或“扭转犹大和耶路撒冷被掳的处境”
  rationale: 该短语既可泛指扭转苦境、恢复福祉，也常带有被掳后归回的历史背景。主文不把意义局限于某一种具体实现方式，脚注则保留被掳与归回的可能含义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留先知宣告的语体；“在那些日子、那时候”维持原文平行的时间强调；末尾保留逗号，因为本节句法延续到下一节。
