    rationale: גּוֹי可指国家或民族；在“示巴人”之后，以“民族”说明其为遥远的族群更自然。
  - severity: low
    issue: “卖到犹大人手中”表达略显生硬。
    rationale: “卖给犹大人”在现代汉语中更自然，且不改变原文的交易和控制权意象。
