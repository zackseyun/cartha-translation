base_translation:
  language: en
  yaml_path: translation/ot/joel/004/008.yaml
  text: And I will sell your sons and your daughters into the hand of the sons of Judah[a], and they will sell them to the Sabeans, to a distant nation[b]; for Yahweh has spoken.
translation:
  language: zh_hans
  text: 我必把你们的儿子和女儿卖给犹大人；犹大人必把他们卖给示巴人[a]，卖到一个遥远的民族那里[b]，因为雅威已经说了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示巴人”指示巴的居民；示巴通常被认为位于阿拉伯半岛南部。
    reason: cultural_note
  - marker: b
    text: 或译：“到一个遥远的国家。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָכַרְתִּי
  choice: 我必……卖
  rationale: Qal形态在此通常意为“卖”；保留审判中以其人之道还治其人之身的商业意象，不弱化为“交出”。
- source_word: בְּנֵיכֶם וְאֶת־בְּנוֹתֵיכֶם
  choice: 你们的儿子和女儿
  rationale: 原文分别明说男性和女性后代，故不概括为“儿女”或“孩子”。
- source_word: בְּיַד
  choice: 到……手中
  rationale: 保留希伯来语“在手中”的控制权意象，同时符合现代汉语表达。
- source_word: בְּנֵי יְהוּדָה
  choice: 犹大人
  rationale: 字面是“犹大的众子”，在此指犹大族群；“犹大人”比“犹大的儿子们”更自然，也不损失所指。
- source_word: וּמְכָרוּם
  choice: 他们又必把这些人卖
  rationale: 与前一处מכר一致译作“卖”；“这些人”清楚回指前述儿子和女儿，并避免汉语中连续代词造成含混。
- source_word: לִשְׁבָאִים
  choice: 给示巴人
  rationale: 该词指示巴的居民或族人；“示巴人”准确而自然。
- source_word: אֶל גּוֹי רָחוֹק
  choice: 送到遥远的国度
  rationale: 原文是“到一个遥远的国家/民族”；结合“卖给示巴人”，补出汉语所需的移动关系“送到”，而“国度”保留גוי的政治族群意味。
- source_word: כִּי יְהוָה דִּבֵּר
  choice: 因为雅威已经说了
  rationale: כִּי说明判决必然实现的根据；דִּבֵּר用完成式，译为“已经说了”。神名按其专名音译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以称号代替，也不引入特定宗派表达。
- issue: 审判中“卖”的报应性意象
  choice: 两处均直译为“卖”
  alternative: 交出；交在……手中
  rationale: 上下文呈现对应性的司法报应；保留同一动词可显明这种反转，又不对其神学意义作超出原文的解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“卖到……手中”保留原文意象；分号呈现两个连续行动。正文中的[a]、[b]均与脚注对应。
