revisions:
- from: 我必把你们的儿子和女儿卖到犹大人手中；他们又必把这些人卖给示巴人[a]，送到遥远的国度[b]，因为雅威已经说了。
  to: 我必把你们的儿子和女儿卖给犹大人；犹大人必把他们卖给示巴人[a]，卖到一个遥远的民族那里[b]，因为雅威已经说了。
  rationale: 修订以“卖给犹大人”使汉语更自然，并明确第二个主语为“犹大人”。将“送到遥远的国度”改为“卖到一个遥远的民族那里”，避免添加原文没有的运送动作，保留“卖”的重复和示巴人所属／所在的遥远民族这一表达。脚注b改为真正的词汇替代译法，并与其锚点相符。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:15:51Z'
