  naturalness: “卖到犹大人手中”虽可理解，但现代汉语以“卖给犹大人”更自然，也足以表达交归其控制之下。“一个遥远的民族”比“遥远的国度”更贴近גּוֹי在此指人民／民族的用法。
  terminology: “雅威”恰当保留神名；“犹大人”和“示巴人”自然、准确。两处מכר均译为“卖”，应保留。
  issues:
