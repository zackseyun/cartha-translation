    issue: “送到遥远的国度”增添了原文未明说的后续运送动作，并弱化“遥远的民族”与示巴人的紧密关系。
    rationale: וּמְכָרוּם לִשְׁבָאִים אֶל־גּוֹי רָחוֹק直述把前述者卖给示巴人，至于一个遥远的民族；宜不用“送到”另起一项行动。
  - severity: low
