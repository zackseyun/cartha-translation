reference: Joel 4:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/גַם מָה אַתֶּ֥ם לִ/י֙ צֹ֣ר וְ/צִיד֔וֹן וְ/כֹ֖ל גְּלִיל֣וֹת פְּלָ֑שֶׁת הַ/גְּמ֗וּל אַתֶּם֙ מְשַׁלְּמִ֣ים עָלָ֔/י וְ/אִם גֹּמְלִ֤ים אַתֶּם֙ עָלַ֔/י קַ֣ל מְהֵרָ֔ה אָשִׁ֥יב גְּמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/004.yaml
  text: And also[a], what are you to me, Tyre and Sidon, and all the regions of Philistia? Are you repaying me with recompense? If you are dealing out repayment against me[b], swiftly and quickly I will return your repayment on your own head.
translation:
  language: zh_hans
  text: 还有，推罗、西顿，以及非利士的各个地区[b]，你们与我有什么相干[a]？你们是在向我报复吗？如果你们要向我报复，我也必迅速、立刻把你们的报复归到你们自己头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你们对我意欲何为？”原文是带有对抗意味的希伯来语诘问。
    reason: lexical_alternative
  - marker: b
    text: “地区”也可译作“辖区”或“地域”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם מָה אַתֶּם לִי
  choice: 还有……你们与我有什么相干
  rationale: וְגַם承接上文并带强调意味，译作“还有”；מָה אַתֶּם לִי是带有对抗意味的希伯来语诘问，译作现代汉语自然的“你们与我有什么相干”，同时保留其斥责语气。
- source_word: צֹר וְצִידוֹן
  choice: 推罗、西顿
  rationale: 采用现代中文圣经传统中通行且易于识别的地名译法。
- source_word: וְכֹל גְּלִילוֹת פְּלָשֶׁת
  choice: 以及非利士的各个地区
  rationale: גְּלִילוֹת指地区、辖区或地域；פְּלָשֶׁת在此为地名“非利士”，不直接改译为族群“非利士人”。
- source_word: הַגְּמוּל אַתֶּם מְשַׁלְּמִים עָלָי
  choice: 你们是在向我报复吗
  rationale: 该问句使用偿还、回报范畴的词语，在敌对语境中指报复。中文以“向我报复”清楚传达其反诘和敌意，避免生硬重复“偿还报偿”。
- source_word: וְאִם גֹּמְלִים אַתֶּם עָלַי
  choice: 即使你们要向我报复
  rationale: וְאִם在威胁性反问之后可表达假设或让步；“即使”贴合语境，又不把行动弱化为一般后果。重复“报复”也保留גמל／גמול词群的呼应。
- source_word: קַל מְהֵרָה
  choice: 迅速、立刻
  rationale: 两个并列词共同加强行动的急速性；分别译出，保留原文的强调叠加。
- source_word: אָשִׁיב גְּמֻלְכֶם בְּרֹאשְׁכֶם
  choice: 我也必……把你们的报复归到你们自己头上
  rationale: אָשִׁיב保留“使之返回”的意象；“归到自己头上”保存希伯来语中恶行后果回到行为者身上的惯用表达，也明确呈现神直接施行报应的宣告。
theological_decisions:
- issue: 神回应列国敌对行动的性质
  choice: 保留直接、司法性报应的威胁：神要使他们的报复回到自己头上
  alternative: 淡化为非人格化的自然后果，或泛指他们将遭遇不幸
  rationale: 原文反复使用גמל／גמול词群，并以“归到你们头上”的惯用语宣告回报；译文不把神主动施行的报应软化为抽象因果。
- issue: וְאִם的语气
  choice: 译作让步性的“即使”
  alternative: 条件性的“如果”或并列性的“而且”
  rationale: 在前一反问之后，“即使”自然表达：若他们自认在向神还击，神仍会立即把其行为归回他们头上；脚注不强行排除条件性理解。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“有什么相干”保留诘问锋芒；“迅速、立刻”保留原文双重强调；末句保存“归到自己头上”的具象惯用语。脚注标记均置于其实际说明的词句之后。
