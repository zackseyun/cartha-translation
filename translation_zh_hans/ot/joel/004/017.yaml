source:
  edition: WLC
  text: וִֽ/ידַעְתֶּ֗ם כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם שֹׁכֵ֖ן בְּ/צִיּ֣וֹן הַר קָדְשִׁ֑/י וְ/הָיְתָ֤ה יְרוּשָׁלִַ֨ם֙ קֹ֔דֶשׁ וְ/זָרִ֥ים לֹא יַֽעַבְרוּ בָ֖/הּ עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/017.yaml
  text: Then you will know that I am Yahweh your God[a], dwelling in Zion, my holy mountain. And Jerusalem will be holy, and strangers will pass through her no more.
translation:
  language: zh_hans
  text: 那时，你们就会知道，我是雅威，是你们的上帝；我住在锡安——我的圣山上。耶路撒冷必为圣洁，外人[a]必不再从其中经过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外族人”。希伯来语指外来者或不属于此处的人；在本段圣城的语境中，主要指不应侵入或亵渎耶路撒冷的人，并不一定泛指所有非以色列人。
    reason: 说明זָרִים的词义范围，避免把“外人”单纯理解为陌生人，也避免把它绝对限定为族裔类别。
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: 那时，你们就会知道
  rationale: 在先知话语的上下文中，句首的连接词带有承接和结果意味；“那时……就”自然表达这一点，同时保留ידע所指的认识与亲身确认。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列上帝之立约名的性质，而不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 准确表达带第二人称复数后缀的形式及其立约关系。
- source_word: שֹׁכֵן בְּצִיּוֹן
  choice: 我住在锡安
  rationale: 分词שֹׁכֵן描述雅威持续居住于锡安；用现代汉语独立分句表达，比悬垂的分词结构更自然。
- source_word: הַר קָדְשִׁי
  choice: 我的圣山
  rationale: 保留“山”、第一人称所属关系和“圣”的含义，并以破折号表明其与锡安的同位关系。
- source_word: וְהָיְתָה יְרוּשָׁלִַם קֹדֶשׁ
  choice: 耶路撒冷必成为圣地
  rationale: קֹדֶשׁ在此作表语，表达耶路撒冷归为神圣；“圣地”是自然汉语，也没有将原文具体化为原文未明说的某种建筑。
- source_word: וְזָרִים
  choice: 外人
  rationale: זָרִים指不属于该处的外来者或局外人；“外人”保留其宽泛性，避免径直限定为族裔意义上的“外国人”。
- source_word: לֹא יַעַבְרוּ בָהּ עוֹד
  choice: 必不再从其中经过
  rationale: 保留עבר的穿行意象、ב的处所含义以及עוֹד所表达的“不再”。“其中”自然回指耶路撒冷。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名；“雅威”按较通行的学术重构音译，既保留专名，也不以“主”等称号取代。
- issue: 圣城语境中זָרִים所指的人
  choice: 外人
  alternative: 外族人
  rationale: 本节着重于耶路撒冷不再遭外来者侵入或亵渎。“外人”保留局外者含义，不把原文可能涉及的圣洁界限完全化约为族裔身份。
- issue: 耶路撒冷“成为圣”的表达
  choice: 必成为圣地
  alternative: 必为圣
  rationale: 原文以קֹדֶשׁ作表语，既可直译为“为圣”，也可自然表达为“成为圣地”。所选译文保持将来的状态变化或确立，同时不增添特定宗派性的圣城观。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那时……就”呈现上下文的结果关系；用分号和独立的“我住在”化解希伯来语分词结构在汉语中的生硬感。破折号标明“我的圣山”是对“锡安”的补充说明。脚注标记紧随“外人”，与注释对象对应。
