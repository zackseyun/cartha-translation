  text: וְ/אֶל עַמִּ֖/י יַדּ֣וּ גוֹרָ֑ל וַ/יִּתְּנ֤וּ הַ/יֶּ֨לֶד֙ בַּ/זּוֹנָ֔ה וְ/הַ/יַּלְדָּ֛ה מָכְר֥וּ בַ/יַּ֖יִן וַ/יִּשְׁתּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/003.yaml
  text: And they cast lots for my people[a]; they gave a boy for a prostitute, and sold a girl for wine[b], and drank it.
translation:
  language: zh_hans
  text: 他们抽签来分配我的子民[a]；拿男孩换妓女[b]，又卖掉女孩换酒，然后把酒喝了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较直译为“他们为我的子民抽签”或“他们在我的子民身上抽签”。这里的习语指以抽签的方式分配、处置这些人，并非替他们谋利。
    reason: 说明介词 אֶל 在“掣签”习语中标示被抽签处置的对象，并保留字面表达的范围。
  - marker: b
    text: 也可较直译为“把男孩给了妓女”。“给”在这里与下句“卖女孩换酒”并列，语境显示这是把男孩作为交换代价的剥削性交易。
    reason: 保留 נתן 的字面义，并说明介词 ב 在此交易性上下文中的表达张力。
lexical_decisions:
- source_word: וְאֶל עַמִּי יַדּוּ גוֹרָל
  choice: 他们拿我的子民抽签分配
  rationale: “抽签”自然表达 ידה גורל 的固定说法；“拿……分配”说明百姓是抽签处置的对象，避免“为我的子民抽签”被误解为替他们谋利，同时没有明说原文未出现的“战利品”。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 既保留第一人称所属关系，也自然传达这里的群体及立约色彩；“百姓”亦可，但“子民”在庄重现代汉语中更能体现说话者与该群体的特殊关系。
- source_word: וַיִּתְּנוּ הַיֶּלֶד בַּזּוֹנָה
  choice: 拿男孩换妓女
  rationale: נתן 字面为“给”，但介词 ב 在并列的“卖女孩换酒”中显示交易或代价关系；译作“拿……换……”以简洁自然的汉语呈现这种剥削性交易，同时用脚注保留较字面的另一种理解。
- source_word: הַיֶּלֶד
  choice: 男孩
  rationale: 定冠词在此可作类指，并非必指某个已知的男孩；“男孩”与下句“女孩”形成准确对应。
- source_word: וְהַיַּלְדָּה מָכְרוּ בַיַּיִן
  choice: 又卖掉女孩换酒
  rationale: מכר 明确意为“卖”；בַיַּיִן 在语境中表示换取的代价。“换酒”比“为酒”更符合现代汉语，同时保留原文冷酷直接的交易画面。
- source_word: וַיִּשְׁתּוּ
  choice: 然后把酒喝了
  rationale: 动词本身没有明说宾语，但上文的“酒”显然是所喝之物；在汉语中补出宾语，使句意自然清楚，并保留事件的先后发展。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而直接的叙述语体。“抽签分配”“拿……换……”让普通读者容易理解，同时不弱化原文把儿童当作交易物的震撼。“然后把酒喝了”明确承接上文，但不添加新的事件或动机。
