language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא יִטְּפ֧וּ הֶ/הָרִ֣ים עָסִ֗יס וְ/הַ/גְּבָעוֹת֙ תֵּלַ֣כְנָה חָלָ֔ב וְ/כָל אֲפִיקֵ֥י יְהוּדָ֖ה יֵ֣לְכוּ מָ֑יִם וּ/מַעְיָ֗ן מִ/בֵּ֤ית יְהוָה֙ יֵצֵ֔א וְ/הִשְׁקָ֖ה אֶת נַ֥חַל הַ/שִּׁטִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/018.yaml
  text: And in that day the mountains will drip sweet wine[a], and the hills will flow with milk, and all the streambeds of Judah will flow with water; and a spring will come out from the house of Yahweh and will water the Valley of Shittim.
translation:
  language: zh_hans
  text: 到那日，群山必滴下甜酒，丘陵必流出奶来；犹大的所有河道都必流淌着水。有一处泉源必从雅威的殿中涌出，浇灌什亭谷[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金合欢树谷”或“金合欢树干河谷”。
    reason: 原文הַשִּׁטִּים既可能是地名“什亭”，也可理解为“金合欢树”；נַחַל则可指谷地或干河谷。
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是引入未来景象的希伯来语时间公式；“到那日”简洁庄重，也符合现代汉语表达。
- source_word: יִטְּפוּ
  choice: 必滴下
  rationale: 保留原文“滴落”的鲜明图景，并以“必”表达未完成式在预言语境中的将来意义。
- source_word: עָסִיס
  choice: 甜酒
  rationale: 指新近压榨、带有甘甜和丰盛意味的葡萄汁或酒；“甜酒”既保留酒的含义，也传达其甘美意象。
- source_word: תֵּלַכְנָה חָלָב
  choice: 必流出奶来
  rationale: 原文动词字面为“行走”，在液体语境中表示流动；译作“流出”符合现代汉语，并保留丰盛的画面。
- source_word: אֲפִיקֵי יְהוּדָה
  choice: 犹大的所有河道
  rationale: אֲפִיקִים可指水道、溪谷或河床；“河道”能涵盖通常可能干涸、届时却充满流水的地貌，也较易懂。
- source_word: יֵלְכוּ מָיִם
  choice: 都必有水流淌
  rationale: 将希伯来语中水“行走”的习语自然表达为水流淌，同时保留遍地得水的丰盛意象。
- source_word: מַעְיָן
  choice: 一道泉水
  rationale: 该词指泉源或泉水；“一道泉水”在此既自然，又与后面的涌出和浇灌衔接。
- source_word: מִבֵּית יְהוָה
  choice: 从雅威的殿中
  rationale: בַּיִת字面为“房屋”，此处所指是雅威的圣所；汉语以“殿”表达既准确自然，也保留敬拜场所的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留原文使用上帝专名而非称号的特点。
- source_word: וְהִשְׁקָה
  choice: 浇灌
  rationale: 该使役形式表示使之得水；“浇灌”简练地表达泉水滋润土地的景象。
- source_word: נַחַל הַשִּׁטִּים
  choice: 什亭谷
  rationale: נַחַל可指谷地、干河谷或溪谷，הַשִּׁטִּים可能是地名“什亭”，也可能指皂荚树；正文保留可能的地名，词义上的另一种理解列入脚注。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译为“雅威”可表明这是以色列上帝的专名，而不以称号代替；同时不把后世读法写入正文。
- issue: הַשִּׁטִּים应理解为地名还是普通名词
  choice: 什亭谷
  alternative: 皂荚树谷；皂荚树干河谷
  rationale: 该表达可以指一处名为“什亭”的地方，也可按其词源理解为有皂荚树的谷地。正文采用地名音译，脚注保留普通名词的可能性，避免消除原文的歧义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“必”统一呈现预言语境中的将来动作；用“滴下、流出、流淌、涌出、浇灌”串联原文不断增强的水流与丰盛意象。脚注标记紧随“什亭谷”，对应实际存在词义歧义的位置。
