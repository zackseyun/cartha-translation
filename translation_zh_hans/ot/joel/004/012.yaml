base_translation:
  language: en
  yaml_path: translation/ot/joel/004/012.yaml
  text: Let the nations awaken and come up to the Valley of Jehoshaphat[a], for there I will sit to judge all the surrounding nations.
translation:
  language: zh_hans
  text: 列国要奋起，上到约沙法谷[a]；因为我要在那里坐下，审判四围所有的列国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约沙法”这个名称可能含有“耶和华施行审判”的意思，与本节上帝审判列国的场景相呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעֹרוּ
  choice: 要奋起
  rationale: 该未完成式在语境中带有号召意味；“奋起”既保留被唤醒、受激而行动的意象，也符合列国受召聚集的场景。
- source_word: וְיַעֲלוּ
  choice: 上到
  rationale: עלה的基本方向义是“上去、上升”；“上到”自然表达前往指定地点，同时保留原文的上行意味。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 此处指聚集受审判的各外邦国家；“列国”庄重、简洁，也避免引入后期宗教群体对比。
- source_word: עֵמֶק יְהוֹשָׁפָט
  choice: 约沙法谷
  rationale: 按现代中文圣经人名惯例音译专名；名称所含“耶和华施行审判”的语义与本节主题呼应，另以脚注说明。
- source_word: כִּי שָׁם
  choice: 因为我要在那里
  rationale: כִּי在此说明列国为何被召到该处，“因为……在那里”清楚保留因果关系。
- source_word: אֵשֵׁב
  choice: 坐下
  rationale: ישׁב虽也可指居住，但与“审判”连用时呈现审判者就座的法庭意象；“坐下”不额外扩充为“登上审判座”。
- source_word: לִשְׁפֹּט
  choice: 审判
  rationale: שׁפט在此指上帝对列国施行司法性的裁断；“审判”准确且保有神学分量。
- source_word: כָּל הַגּוֹיִם מִסָּבִיב
  choice: 四围所有的列国
  rationale: מִסָּבִיב保留空间上的环绕之意；“四围所有的列国”比单纯“周边国家”更贴近原文，也适合先知文学语体。
theological_decisions:
- issue: 神圣含义地名יְהוֹשָׁפָט的译法
  choice: 正文音译为“约沙法”，脚注说明其名称可能表达“耶和华施行审判”。
  alternative: 在正文直译为“耶和华审判谷”或“耶和华施行审判之谷”。
  rationale: 正文保留专名，避免把可能的地名直接解释成普通名词；脚注则呈现该名称与全节审判主题之间很可能存在的语义呼应。
- issue: אֵשֵׁב的司法意象
  choice: 译作“坐下”，保留上帝就座审判的画面。
  alternative: 译作“登座”或“坐在审判席上”。
  rationale: 原文仅说“坐”，司法功能由随后“审判”明确；不宜在正文中加入原文没有明说的“审判席”，但应保留其法庭意象。
translation_notes:
  register: 采用现代、庄重而易懂的先知文学语体。“奋起”传达受召行动的力度；“上到”“坐下”尽量保留原文具体意象；正文中的[a]与脚注对应。
