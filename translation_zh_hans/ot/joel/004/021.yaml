  text: וְ/נִקֵּ֖יתִי דָּמָ֣/ם לֹֽא נִקֵּ֑יתִי וַֽ/יהוָ֖ה שֹׁכֵ֥ן בְּ/צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/021.yaml
  text: I will avenge their blood that I have not avenged[a], and Yahweh dwells in Zion.
translation:
  language: zh_hans
  text: 我必为他们的血申冤，就是我先前未曾申过的冤[a]；耶和华住在锡安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必不让他们的血不受追讨。”希伯来文以否定形式重复同一个动词，既可理解为为先前尚未伸张的血申冤，也可理解为不让流血之罪免受惩罚。
    reason: 保留希伯来文重复动词与否定结构所容许的另一种解释。
lexical_decisions:
- source_word: וְנִקֵּיתִי
  choice: 我必……申冤
  rationale: נקה 的强意词干在这里与“他们的血”连用，并处于审判列国、为受害者伸张正义的语境中，因此按司法性的含义译为“申冤”，比直译“洁净”或“判为无罪”更符合上下文，同时避免把经文误解为礼仪洁净。
- source_word: דָּמָם
  choice: 他们……的血
  rationale: 保留“他们的血”这一具体意象；在“申冤”的搭配中，自然表达流血受害者之血有待追偿，而不直接改写成较抽象的“血债”。
- source_word: לֹא נִקֵּיתִי
  choice: 尚未得偿的
  rationale: 希伯来文以否定形式重复同一动词，结构简短且含义有张力。“尚未得偿”表达此前尚未伸张、如今将获申雪的理解；脚注保留“不让……免受惩罚”的另一种可能。
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”来对应四字神名，并保留连接关系，以分号自然承接前句。
- source_word: שֹׁכֵן
  choice: 住
  rationale: 分词表示持续、稳定的居住状态；“住”简洁自然，并保留现在性和持续性，不擅自译成将来时。
- source_word: בְּצִיּוֹן
  choice: 在锡安
  rationale: בְּ 表示所在之处，“在锡安”是准确、自然的现代汉语表达。
theological_decisions:
- issue: 审判语境中 נקה 与“血”连用的含义
  choice: 上帝为受害者的血申冤，使尚未得偿的流血得到追偿
  alternative: 洁净其血债，或宣告无罪
  rationale: 上下文强调对敌对列国的审判以及犹大和耶路撒冷所得的伸冤。译作“申冤”既呈现司法与报偿含义，也不把此处限定为礼仪洁净或无罪宣告。
- issue: לֹא נִקֵּיתִי 的句法和时间关系
  choice: 理解为此前尚未申冤、如今将要申冤
  alternative: 理解为强调绝不免罚，即“我绝不让他们的血不受追讨”
  rationale: 原文否定地重复 נקה，极其凝练，容许不同分析。正文采用与上下文连贯的先前未偿、如今申冤之意，脚注则明确保留“不留为无罪／不让免罚”的惯用解释。
- issue: 耶和华住在锡安的时态
  choice: 持续的现时居住
  alternative: 将来必住在锡安
  rationale: שֹׁכֵן 是分词，直接表达持续状态；不因末世审判语境而擅自加入将来时。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“为……的血申冤”保留原文的血之意象和司法语境；分号呈现两小句的紧密连接，而不强行说明其逻辑关系。
