  text: אֲשֶׁר כַּסְפִּ֥/י וּ/זְהָבִ֖/י לְקַחְתֶּ֑ם וּ/מַֽחֲמַדַּ/י֙ הַ/טֹּבִ֔ים הֲבֵאתֶ֖ם לְ/הֵיכְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/005.yaml
  text: because you took my silver and my gold[a], and brought my precious things into your temples.
translation:
  language: zh_hans
  text: 因为你们拿走了我的金银，又把我珍贵的物品带进你们的庙宇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的宫殿。”希伯来语这个词既可指庙宇，也可指宫殿；这里译作“庙宇”，因为语境显示他们把属于上帝的物品带进自己的宗教建筑。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 此处承接上文，说明审判临到的缘由；译作“因为”比直译为关系词更符合现代汉语语境。
- source_word: כַּסְפִּי וּזְהָבִי
  choice: 我的金银
  rationale: 保留第一人称所属关系，并用现代汉语常见的并列合称“金银”，自然简洁。
- source_word: לְקַחְתֶּם
  choice: 你们拿走了
  rationale: לקח的基本义是“拿、取”；“拿走”既表达从原主那里取走，也避免加入“抢夺”所带来的额外强度。
- source_word: וּמַחֲמַדַּי הַטֹּבִים
  choice: 我珍贵的物品
  rationale: מַחֲמַדִּים指可喜爱、贵重之物，הַטֹּבִים进一步表明其上好、贵重；“珍贵的物品”贴近原文而不额外限定为财宝。
- source_word: הֲבֵאתֶם
  choice: 带进
  rationale: בוא的使役式在这里表示把物品带到某处；与后面的建筑物搭配时，“带进”自然地表达进入其内。
- source_word: לְהֵיכְלֵיכֶם
  choice: 你们的庙宇
  rationale: הֵיכָל可指庙宇或宫殿。此处涉及列国把属于上帝的贵重物品据为己有，放入自己的宗教建筑，“庙宇”较符合语境；另一义项以脚注保留。
theological_decisions:
- issue: הֵיכְלֵיכֶם所指的是宗教建筑还是王宫
  choice: 你们的庙宇
  alternative: 你们的宫殿
  rationale: “庙宇”保留了将属于上帝之物移入异族圣所的亵渎意味，但希伯来词本身也确实可指宫殿，因此不排除另一理解，并在脚注中注明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“拿走”避免过度强化动词语气；“珍贵的物品”忠实保留原文较宽泛的指称；正文与脚注共同保存“庙宇／宫殿”的词义歧义。
