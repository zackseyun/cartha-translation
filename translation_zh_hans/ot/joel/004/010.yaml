base_translation:
  language: en
  yaml_path: translation/ot/joel/004/010.yaml
  text: Beat your plowshares into swords[a], and your pruning hooks into spears; let the weak say[b], “I am a warrior.”
translation:
  language: zh_hans
  text: 要把你们的犁头锤打成刀剑[a]，把你们的修枝刀锤打成长矛；软弱的人要说：“我是勇士。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里反转了以赛亚书2:4和弥迦书4:3的意象；在那两处，人把武器锤打成农具。
    reason: cross_reference
  - marker: b
    text: 或译：“我是强者。”希伯来语 גִּבּוֹר 可指强者、勇士或善战之人；这里的军事语境较支持“勇士”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּתּוּ
  choice: 锤打成
  rationale: 这是 כתת 的复数命令式，表示敲打、捶打；“锤打成”既保留具体的锻打画面，也自然表达器具被改造成武器的结果。
- source_word: אִתֵּיכֶם
  choice: 你们的犁头
  rationale: 该名词指耕地用具；“犁头”清楚易懂，并能保留本句与以赛亚书2:4、弥迦书4:3之间用语和意象的呼应。
- source_word: לַחֲרָבוֹת
  choice: 成刀剑
  rationale: 介词 ל 在这里表示改造后的结果；חרבות 是“剑、刀剑”的复数，“刀剑”在现代汉语中自然，也明确属于战争武器。
- source_word: וּמַזְמְרֹתֵיכֶם
  choice: 把你们的修枝刀
  rationale: 该词指修剪葡萄树等植物所用的刀具；“修枝刀”准确而通俗，并保留农业背景。
- source_word: לִרְמָחִים
  choice: 成长矛
  rationale: רמח 指矛或长枪；“长矛”是现代汉语中清楚、常用的对应词，也与战争语境吻合。
- source_word: הַחַלָּשׁ
  choice: 软弱的人
  rationale: 形容词在此作名词使用，泛指软弱者；译成“软弱的人”自然，并保留希伯来文单数的代表性表达。
- source_word: יֹאמַר
  choice: 要说
  rationale: 未完成式在前述命令之后带有劝令或号召意味；“要说”既能表达这种语气，也不把它过度解释为单纯预言。
- source_word: גִּבּוֹר
  choice: 勇士
  rationale: 该词可指强壮者、大能者或善战的勇士；本节号召备战的语境使“勇士”最为贴切，同时以脚注保留其词义幅度。
- source_word: אָנִי
  choice: 我是
  rationale: 独立人称代词具有强调作用；“我是”自然地保留自我宣告的语气。
theological_decisions:
- issue: 和平预言意象的反转
  choice: 保留“犁头—刀剑、修枝刀—长矛”的对应结构，呈现为为审判备战的号召。
  alternative: 不刻意保留与以赛亚书2:4、弥迦书4:3相呼应的农业器具和武器用语。
  rationale: 希伯来文本明显反转了那两处将武器改成农具的著名意象。直译这些成对词语能够显出先知话语中的张力，而不额外判定这号召在神学上的含义。
- issue: גִּבּוֹר 的身份或能力含义
  choice: 正文译作“勇士”，突出当前军事语境。
  alternative: 译作“强壮的人”或“大能者”，侧重力量而不明确指向战士身份。
  rationale: 该词本身具有词义幅度；军事语境支持“勇士”，但脚注保留“强壮”或“大能”的可能含义，避免消除原文的歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“锤打成”保留原文具体动作，并使两组平行短语结构清楚；“软弱的人要说”维持劝令语气，不将其改写成确定的未来预言。所有脚注标记均置于正文相应词句之后。
