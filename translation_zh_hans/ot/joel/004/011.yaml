  text: ע֣וּשׁוּ וָ/בֹ֧אוּ כָֽל הַ/גּוֹיִ֛ם מִ/סָּבִ֖יב וְ/נִקְבָּ֑צוּ שָׁ֕מָּ/ה הַֽנְחַ֥ת יְהוָ֖ה גִּבּוֹרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/011.yaml
  text: Hasten and come[a], all you nations from every side, and gather yourselves there. Bring down your mighty ones[b], O Yahweh.
translation:
  language: zh_hans
  text: 四面八方的列国啊，你们都要赶快前来[a]，在那里聚集。耶和华啊，求你使你的大能者降临[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要赶快前来……并在那里聚集。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“耶和华啊，求你差遣你的大能者下来！”原文“你的大能者”可泛指属于耶和华的强有力者，并未说明他们是人还是天上的使者。
    reason: alternative_reading
lexical_decisions:
- source_word: ע֣וּשׁוּ
  choice: 要赶快
  rationale: 这个罕见的命令式在上下文中表达催促之意；“要赶快”自然地传达紧迫感。
- source_word: וָבֹ֧אוּ
  choice: 前来
  rationale: 保留“来”的命令语气，并与“四围”而来的方向相配。
- source_word: כָּל־הַגּוֹיִם מִסָּבִיב
  choice: 你们四围的列国啊
  rationale: 命令语境显示这是直接呼唤列国；“四围的”表达从周边各方而来。
- source_word: וְנִקְבָּצוּ שָׁמָּה
  choice: 在那里聚集
  rationale: 该尼法勒形式在此具有命令功能；汉语“聚集”自然，也不必强加严格的被动或反身含义。
- source_word: הַנְחַת
  choice: 求你使……降临
  rationale: 使役命令式表达使某些强有力者下到现场；对耶和华的呼求用“求你”符合现代汉语语用，并保留下降的空间意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译“耶和华”，而不以称号替代专名。
- source_word: גִּבּוֹרֶיךָ
  choice: 你的勇士
  rationale: “勇士”可指强有力的战士或大能者；正文不进一步认定其为人类还是天上众军。
theological_decisions:
- issue: “你的勇士”的身份
  choice: 你的勇士
  alternative: 你的大能者／你的天军
  rationale: 原文只说明这些强者属于耶和华，并未明说他们是人还是天上的使者，因此译文保留身份上的开放性。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 译作中文传统且广为人知的专名“耶和华”，保留原文对神的直接称呼，不用称号取代。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。首句保留对列国的直接呼唤与紧迫命令；末句按希伯来语语义保留“降临”的方向意象，并以脚注说明“勇士”身份未定。
