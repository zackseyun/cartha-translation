  text: הֲמוֹנִ֣ים הֲמוֹנִ֔ים בְּ/עֵ֖מֶק הֶֽ/חָר֑וּץ כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה בְּ/עֵ֖מֶק הֶ/חָרֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/014.yaml
  text: Multitudes[a], multitudes in the Valley of Decision! For the day of Yahweh is near in the Valley of Decision.
translation:
  language: zh_hans
  text: 人群，人群，都在裁决谷[a]！因为雅威的日子在裁决谷中近了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “裁决谷”也可译作“决断谷”“审判谷”或“打谷的山谷”。希伯来语原词含有作出决定性判定的意思，也可能让人联想到用锐利器具打谷的景象。
    reason: 保留הֶחָרוּץ在决定、判决和打谷意象之间的语义张力。
lexical_decisions:
- source_word: הֲמוֹנִים הֲמוֹנִים
  choice: 人群，人群
  rationale: הָמוֹן的复数指众多聚集的人；保留原文的直接重复，以传达规模和紧迫感，不另加“聚集”等原文未明说的动作。
- source_word: בְּעֵמֶק
  choice: 在……谷
  rationale: עֵמֶק通常指山谷；此处两次出现，译文也两次保留，以维持本节的结构和地理意象。
- source_word: הֶחָרוּץ
  choice: 裁决
  rationale: חָרוּץ可指已经决定、断定之事，并可能使人联想到锐器或打谷。主文用“裁决”表达决定性判定，相关语义余韵在脚注中说明。
- source_word: קָרוֹב
  choice: 已经临近
  rationale: 该形容词表示近在眼前；“已经临近”符合现代汉语的先知性警告语气，也没有把它改写为具体日期。
- source_word: יוֹם יְהוָה
  choice: 雅威的日子
  rationale: 保留先知书中“雅威的日子”这一固定表达，指雅威施行干预和审判的时刻；不把“日子”解释性改写为“审判日”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现希伯来文的神名，区别于“主”这一称号。
theological_decisions:
- issue: עֵמֶק הֶחָרוּץ的含义
  choice: 裁决谷
  alternative: 决断谷；审判谷；打谷之谷
  rationale: 此语首先可表达已经定下的裁决，也可能带有审判以及用锐利器具打谷的意象。主文采用自然且能体现决定性判定的“裁决谷”，脚注保留其他可能，避免把丰富意象限定为单一解释。
- issue: “雅威的日子”在谷中临近的句法关系
  choice: 雅威的日子在裁决谷已经临近
  alternative: 雅威的日子临近裁决谷
  rationale: 希伯来文的בְּעֵמֶק表示“在谷中”，不是说这日子作为移动主体正在接近山谷；译文明确地点关系，同时保留原文简洁的末世警告。
translation_notes:
  register: 采用简洁、庄重而现代的普通话。保留“人群，人群”的重复和“裁决谷”的两次出现，以再现希伯来诗句的呼喊感与首尾呼应；主文中的[a]与脚注标记一致。
