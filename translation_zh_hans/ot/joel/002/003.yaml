id: JOL.2.3
reference: Joel 2:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְ/פָנָי/ו֙ אָ֣כְלָה אֵ֔שׁ וְ/אַחֲרָ֖י/ו תְּלַהֵ֣ט לֶֽהָבָ֑ה כְּ/גַן עֵ֨דֶן הָ/אָ֜רֶץ לְ/פָנָ֗י/ו וְ/אַֽחֲרָי/ו֙ מִדְבַּ֣ר שְׁמָמָ֔ה וְ/גַם פְּלֵיטָ֖ה לֹא הָ֥יְתָה לּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/003.yaml
  text: Before it[a], fire devours; behind it, a flame blazes. The land before it is like the garden of Eden, but behind it is a desolate wilderness; indeed, nothing escapes it.
translation:
  language: zh_hans
  text: 在它前面，火在吞噬；在它后面，烈焰熊熊燃烧。它前面的土地如同伊甸园；它后面却是一片荒凉的旷野。确实，没有什么能逃脱它[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有幸存者留下”或“无人能逃脱它”。希伯来文这个名词既可侧重“逃脱”，也可指“逃脱者、幸存者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: 在它前面
  rationale: 该短语由表示“面前、前方”的名词与第三人称阳性单数后缀构成。上下文所指是被视为一个整体的入侵军队或蝗群，因此用“它”既保留单数形式，也避免误解为某个男性个体。
- source_word: אָכְלָה אֵשׁ
  choice: 火焰吞噬
  rationale: 动词字面义为“吃、吞吃”，用于火时表达毁灭性的烧尽；“吞噬”保留了希伯来文鲜明而强烈的意象。完成式在此用于生动的先知性描写，汉语采用现在时态式表达最自然。
- source_word: וְאַחֲרָיו
  choice: 在它后面
  rationale: 与“在它前面”形成空间上的平行，描绘这支入侵力量经过前后的景象。
- source_word: תְּלַהֵט לֶהָבָה
  choice: 烈焰熊熊燃烧
  rationale: Piel词干表达猛烈燃烧或灼烧；“烈焰熊熊燃烧”以自然现代汉语传达其强烈程度。
- source_word: כְּגַן עֵדֶן
  choice: 好像伊甸园
  rationale: 保留与《创世记》中伊甸园的明确呼应；“好像”自然表达比较前缀 כְּ。
- source_word: הָאָרֶץ
  choice: 土地
  rationale: 本节描写农业地区遭受毁坏，“土地”比范围更广的“大地”更贴合局部地貌与耕地语境。
- source_word: מִדְבַּר שְׁמָמָה
  choice: 荒凉的旷野
  rationale: 两个名词结合强调彻底荒芜；译为“荒凉的旷野”自然、清楚，并保留毁灭后的强烈反差。
- source_word: וְגַם
  choice: 甚至
  rationale: 该组合在末句增添递进和强调；“甚至”能自然呈现全然无一幸免的高潮。
- source_word: פְּלֵיטָה
  choice: 没有什么能逃脱
  rationale: 该名词可指“逃脱、获救”，也可指“逃脱者、幸存者”。正文采用动词化表达，适合现代汉语，并避免只限定为人类幸存者；词义两可之处在脚注中说明。
- source_word: לֹא הָיְתָה לוֹ
  choice: 没有什么能逃脱它
  rationale: 字面结构近于“对它而言，没有逃脱／逃脱者”。按本节彻底毁坏的语境，正文用自然汉语表达为“没有什么能逃脱它”，同时以脚注保留另一种理解。
theological_decisions:
- issue: 本节各第三人称阳性单数后缀所指为何
  choice: 用“它”指作为一个整体的入侵力量
  alternative: 用“他”加强对军队或蝗群的拟人化
  rationale: 希伯来文采用单数后缀，很可能把上下文中的入侵军队或蝗群视为一个集体。汉语“它”保留集体单数的效果，又不暗示这里特指某个男性人物。
- issue: 末句 פְּלֵיטָה 指逃脱本身还是幸存者
  choice: 正文译作“没有什么能逃脱它”
  alternative: 译作“没有幸存者留下”或“无人能够逃脱”
  rationale: 原词容许“逃脱”和“逃脱者／幸存者”两方面含义。正文选择涵盖面较广的表达，不把对象仅限于人，同时借脚注保留真实的词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前后两个分句保持整齐的空间对照，“伊甸园”与“荒凉的旷野”形成鲜明反差；避免古奥措辞，也不额外引入特定宗派对入侵者身份的解释。
