  text: וּ/בְנֵ֣י צִיּ֗וֹן גִּ֤ילוּ וְ/שִׂמְחוּ֙ בַּ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם כִּֽי נָתַ֥ן לָ/כֶ֛ם אֶת הַ/מּוֹרֶ֖ה לִ/צְדָקָ֑ה וַ/יּ֣וֹרֶד לָ/כֶ֗ם גֶּ֛שֶׁם מוֹרֶ֥ה וּ/מַלְק֖וֹשׁ בָּ/רִאשֽׁוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/023.yaml
  text: And you[a], children of Zion, rejoice and be glad in Yahweh your God, for he has given you the early rain for righteousness[c][b]; and he causes the rain to come down for you—the early rain and the latter rain as before.
translation:
  language: zh_hans
  text: 锡安的儿女啊，你们要在耶和华——你们的上帝里面欢喜快乐，因为他按公义赐给你们初雨[a][b]；他为你们降下雨水，就是初雨和晚雨，像从前一样[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “初雨”也可译作“教师”；本短语也可理解为“为公义的教师”或“公义的教师”。希伯来语 מוֹרֶה 可指“教师”或“初雨”；但上下文接着提到雨水、初雨和晚雨，因此此处主文采用“初雨”。
    reason: alternative_reading
  - marker: b
    text: “按公义”也可理解为“按公正的分量”或“为你们伸冤”。希伯来语直译近于“为公义”。
    reason: lexical_alternative
  - marker: c
    text: “像从前一样”也可译作“在第一个月”。希伯来语也可作历法说明；不过恢复的上下文较支持“像从前一样”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי צִיּוֹן
  choice: 锡安的儿女啊
  rationale: בְּנֵי 字面为“儿子们”，但此处是对锡安全体百姓的称呼；“儿女”既保留亲属和群体意象，也不限定为男性。语气词“啊”自然表达直接呼告。
- source_word: גִּילוּ וְשִׂמְחוּ
  choice: 欢喜快乐
  rationale: 两个并列命令共同加强喜乐的劝勉；汉语以“欢喜快乐”简洁自然地保留双重表达。
- source_word: בַּיהוָה אֱלֹהֵיכֶם
  choice: 因耶和华你们的上帝
  rationale: 介词 בּ 可表示喜乐所依归的对象或缘由；“因……欢喜快乐”是自然现代汉语，并保留喜乐以耶和华为中心的含义。神名 יהוה 音译为“耶和华”。
- source_word: כִּי נָתַן לָכֶם
  choice: 因为他……赐给你们
  rationale: כִּי 引出欢喜的理由；完成式 נָתַן 表达已经施行、现今仍具意义的赐予。
- source_word: אֶת הַמּוֹרֶה לִצְדָקָה
  choice: 为公义赐给你们初雨
  rationale: מוֹרֶה 在此可指“教师”，也可指“初雨”；紧接的农业雨水语境明显支持“初雨”。לִצְדָקָה 直译近于“为公义”，主文保留 צדקה 的公义语义及其目的、准则或伸冤等潜在张力，不武断限定为“按适当分量”。
- source_word: וַיּוֹרֶד לָכֶם גֶּשֶׁם
  choice: 他为你们降下雨水
  rationale: 使役式 וַיּוֹרֶד 表示“使之降下”；汉语“降下雨水”自然表达其使役和赐予含义。
- source_word: מוֹרֶה וּמַלְקוֹשׁ
  choice: 初雨和晚雨
  rationale: 两词指当地农业周期中的早季雨和晚季雨；“初雨和晚雨”保留原文配对，并为普通读者所能理解。
- source_word: בָּרִאשׁוֹן
  choice: 一如从前
  rationale: 该词可指“起初、从前”，也可能有“在第一个月”的历法含义；恢复语境支持“一如从前”，同时在脚注保留历法读法。
theological_decisions:
- issue: הַמּוֹרֶה 是否应理解为“教师”，并由此赋予教师或弥赛亚含义
  choice: 主文译作“初雨”
  alternative: “公义的教师”或“教导人行义的教师”
  rationale: 本句后半明确提到雨水、初雨和晚雨，农业语境强烈支持气象含义。脚注保留“教师”读法，以免消除希伯来词本身的真实歧义，但主文不引入经文本身未明确要求的弥赛亚解释。
- issue: לִצְדָקָה 的语义
  choice: 译作“为公义”
  alternative: “按公正的分量”、“为给你们伸冤”或“作为你们得昭雪的明证”
  rationale: צדקה 可表示公义、公正，也可能在具体语境中涉及伸冤或合宜的施予。“为公义”保留其道德和盟约性分量，也保留介词 ל 所容许的目的或结果张力；其他具体化理解列入脚注。
- issue: בָּרִאשׁוֹן 是恢复性的比较还是历法说明
  choice: 译作“一如从前”
  alternative: “在第一个月”
  rationale: 上下文讲述土地与雨水的恢复，因此“一如从前”较为顺畅；但词形容许历法读法，故以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“锡安的儿女啊”保留先知呼告的诗性；“欢喜快乐”与“初雨和晚雨”保留原文的并列节奏。主文刻意保留“为公义”的一定开放性，并通过脚注解释其可能含义。
