  text: The threshing floors will be filled with grain[a], and the vats will overflow with new wine and oil.
translation:
  language: zh_hans
  text: 禾场必堆满谷物，榨池里必满溢着新酒和油。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: 必堆满
  rationale: 该完成式在预言语境中表达将来的结果状态；“堆满”自然呈现禾场上谷物充盈的景象。
- source_word: הַגֳּרָנוֹת
  choice: 禾场
  rationale: גֹּרֶן 指打谷、处理谷物的场地；汉语“禾场”准确而简洁，集合用法无需强加复数形式。
- source_word: בָּר
  choice: 谷物
  rationale: 此处泛指已经脱粒的粮谷，并不限定为小麦。
- source_word: וְהֵשִׁיקוּ
  choice: 必……满溢
  rationale: 该动词在此描写液体充盈而溢出的丰盛景象；“满溢”兼顾状态和动态。
- source_word: הַיְקָבִים
  choice: 榨池
  rationale: יֶקֶב 指压榨葡萄或橄榄并承接汁液的池槽；因下文同时提到酒和油，“榨池”比单指酒的译法更合适。
- source_word: תִּירוֹשׁ
  choice: 新酒
  rationale: 该词通常指当季新产的酒，保留农业收成的语境。
- source_word: וְיִצְהָר
  choice: 油
  rationale: יִצְהָר 指农产之油，通常是橄榄油；正文译作“油”较直接，也不添加原文未明说的限定。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话；两个分句保持平行，以“堆满／满溢”再现丰收与充盈的意象。“必”体现预言语境中的将来结果，不额外解释其神学因果。
