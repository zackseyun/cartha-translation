id: JOL.2.13
reference: Joel 2:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/קִרְע֤וּ לְבַבְ/כֶם֙ וְ/אַל בִּגְדֵי/כֶ֔ם וְ/שׁ֖וּבוּ אֶל יְהוָ֣ה אֱלֹֽהֵי/כֶ֑ם כִּֽי חַנּ֤וּן וְ/רַחוּם֙ ה֔וּא אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/013.yaml
  text: Tear your hearts and not your garments[a], and return to Yahweh your God, for he is gracious and compassionate, slow to anger and abundant in steadfast love[b], and relenting concerning the disaster.
translation:
  language: zh_hans
  text: 你们要撕裂自己的心，不要撕裂衣服[a]；要回转归向雅威——你们的上帝。因为他有恩典，有怜悯，不轻易发怒，有丰盛的慈爱，并且会改变降灾的心意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“撕裂衣服”是哀悼时的外在举动；先知要求他们撕裂自己的心，也就是从内心真实回转。
    reason: cultural_context
  - marker: b
    text: 直译可作“对灾祸转意”；这里指收回所警告的审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ
  choice: 撕裂
  rationale: 该词是复数命令式，基本义为“撕裂、扯破”。“撕裂”既保留强烈的身体动作意象，也能自然地用于“心”的比喻。
- source_word: לְבַבְכֶם
  choice: 自己的心
  rationale: 原文为“你们的心”。汉语用“自己的心”与后面的“衣服”形成自然对照，并保留内在悔改的比喻。
- source_word: וְאַל בִּגְדֵיכֶם
  choice: 不要撕裂衣服
  rationale: 否定词承接前面的“撕裂”，原文省略的动作在汉语中补出，使对比清楚；“衣服”指哀悼时撕衣的外在举动。
- source_word: וְשׁוּבוּ
  choice: 要回转归向
  rationale: שׁוב的核心义是“转回、返回”。“回转归向”保留朝向上帝的关系性和方向性，而不把它仅仅窄化为内心懊悔。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留原文使用上帝圣名的特点。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 直接体现第二人称复数所属关系，并保留圣约性的称呼。
- source_word: חַנּוּן
  choice: 有恩典
  rationale: 与后面的“有怜悯”并列，表达上帝乐意施恩的属性，同时保持二词之间的区别。
- source_word: רַחוּם
  choice: 有怜悯
  rationale: 突出深切的怜恤，与חַנּוּן所表达的施恩相互补充，而不将二者合并。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒
  rationale: 这是希伯来语惯用语的自然汉语对应，传达耐心、缓于动怒之意，而不生硬保留身体意象。
- source_word: רַב חֶסֶד
  choice: 满有忠贞的慈爱
  rationale: “满有”对应רַב的丰盛之意；“忠贞的慈爱”兼顾חֶסֶד所含的慈爱、忠诚和持久委身，避免只表达一般情感。
- source_word: וְנִחָם
  choice: 并且会……转意
  rationale: 此处尼法勒分词描述上帝面对灾祸时愿意转意的性情。“转意”保留原文张力，不进一步断言上帝犯错、获得新知识或取消了一切审判。
- source_word: עַל הָרָעָה
  choice: 对灾祸
  rationale: 在审判语境中רָעָה指灾难、灾祸，而非道德上的邪恶；“对”较为直接地对应介词עַל，不把所指灾祸的具体实施方式写入正文。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”，以现代汉语音译保留这一专名，而不以称号替代。
- issue: וְנִחָם עַל הָרָעָה所描述的上帝与灾祸的关系
  choice: 并且会对灾祸转意
  alternative: 并且不降所说的灾祸
  rationale: “转意”保留原文关于上帝回应悔改的拟人性和神学张力；替代译法更明确地解释为撤回预告的审判，却加入了原文没有明说的“所说的”和“不降”，因此只置于注释说明中。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留先知呼吁的力度，并以分号和句号呈现命令与理由之间的结构。避免古雅的“衣裳”“长久忍耐”等表达；“忠贞的慈爱”则保留חֶסֶד的关系性和神学分量。
