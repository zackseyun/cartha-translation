source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אָכוֹל֙ וְ/שָׂב֔וֹעַ וְ/הִלַּלְתֶּ֗ם אֶת שֵׁ֤ם יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר עָשָׂ֥ה עִמָּ/כֶ֖ם לְ/הַפְלִ֑יא וְ/לֹא יֵבֹ֥שׁוּ עַמִּ֖/י לְ/עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/026.yaml
  text: You will surely eat and be satisfied[a], and you will praise the name of Yahweh your God, who has dealt wondrously with you[c][b]; and my people will never again be put to shame.
translation:
  language: zh_hans
  text: 你们必定吃得饱足[a]，并要赞美你们的上帝耶和华的名；他为你们行了奇妙的事[b]。我的子民必永远不致蒙羞[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用“吃”的强调结构，直译近于“吃，你们必吃”；也可译作“你们必尽情吃，并且饱足”。
    reason: 说明希伯来文强调结构及其译法。
  - marker: b
    text: 也可译作“他奇妙地对待你们”。
    reason: 保留 עשה עם 与 לְהַפְלִיא 这一组合的另一种理解。
  - marker: c
    text: “蒙羞”也可理解为“羞愧”或“因盼望落空而失望”。
    reason: 保留 בושׁ 的语义幅度。
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אָכוֹל וְשָׂבוֹעַ
  choice: 你们必定吃得饱足
  rationale: “吃”的限定动词与同词根不定式绝对形连用，强调动作的确定或充分程度；随后“饱足”说明结果。译文以“必定……吃得饱足”自然表达这两层意思，而不把强调结构机械重复为“吃了又吃”。
- source_word: וְהִלַּלְתֶּם
  choice: 并要赞美
  rationale: הלל 的 Piel 词形在此指公开称颂、赞美；“赞美”是现代汉语中直接而庄重的表达。
- source_word: שֵׁם יְהוָה אֱלֹהֵיכֶם
  choice: 耶和华你们上帝的名
  rationale: 保留“名”，因为原文所指不只是称号，也涉及上帝所显明的身份和声誉；专名 יהוה 译作“耶和华”，在现代中文圣经语境中清楚可辨。
- source_word: אֲשֶׁר עָשָׂה עִמָּכֶם לְהַפְלִיא
  choice: 他为你们行了奇妙的事
  rationale: 原句可理解为“他奇妙地待你们”或“他为你们行奇事”。正文采用自然汉语“为你们行了奇妙的事”，同时用脚注保留较贴近介词 עִם 的另一种表达。
- source_word: וְלֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  choice: 我的子民必永远不致蒙羞
  rationale: בושׁ 可指因落空、失败而受羞辱；“蒙羞”保留其公开受辱的色彩。לְעוֹלָם 直译为“永远”，正文不添加原文没有明说的“再”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉且仍作为专名使用的“耶和华”；“雅威”是较接近学术重构读音的另一选择，但原始元音并不能完全确定。
- issue: “永远不致蒙羞”所表达的应许
  choice: 保留原文的永久否定
  alternative: 永远不再蒙羞
  rationale: 原文明确说“不会蒙羞，直到永远”，强调应许的恒久性；语境虽包含从先前困境中复兴的意味，但正文不加入“再”，以免把语境推论写进原文本身。
- issue: בושׁ 是内在羞愧还是公开受辱
  choice: 蒙羞
  alternative: 失望／羞愧
  rationale: 该词兼有羞愧、因盼望落空而失望以及公开受辱等语义色彩。此处采用“蒙羞”以契合群体复兴和尊荣恢复的语境，同时在脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留先知应许的节奏，以分号和句号区分饱足、赞美与永不蒙羞三层内容；避免生硬复制希伯来语强调结构，也不额外加入原文未明说的“再”。
