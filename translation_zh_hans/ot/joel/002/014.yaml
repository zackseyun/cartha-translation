base_translation:
  language: en
  yaml_path: translation/ot/joel/002/014.yaml
  text: Who knows? He may turn and relent[a], and leave behind him a blessing—an offering and a drink offering for Yahweh your God.
translation:
  language: zh_hans
  text: 谁知道呢？他也许会转意并收回惩罚，在他身后留下福分——献给耶和华你们上帝的素祭和奠祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: 谁知道呢？
  rationale: 保留希伯来语表示不确定可能性的反问形式；加“呢”使现代汉语自然，但不把可能性改写成确定应许。
- source_word: יָשׁוּב וְנִחָם
  choice: 回心转意，不再降灾
  rationale: שׁוב表达转回，נחם在宣告审判的语境中指不再施行原定灾祸。此译保留上帝转意的张力，又以“不再降灾”明确其语境含义。
- source_word: וְהִשְׁאִיר אַחֲרָיו
  choice: 并在身后留下
  rationale: 保留“在他身后”的具体意象，而不将其解释性地弱化为单纯的“赐下”。
- source_word: בְּרָכָה
  choice: 福分
  rationale: 这里所指的福分具有具体结果，即仍有出产可供献祭；“福分”兼顾抽象祝福和实际恩惠。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 与奠祭并列的祭祀语境表明此词在这里是技术性用语，特指以谷物制品为主的素祭；中文圣经语域中“素祭”准确而简洁。
- source_word: וָנֶסֶךְ
  choice: 奠祭
  rationale: 指倾倒酒等液体而献的祭。“奠祭”是准确、通行且简洁的现代中文祭祀术语。
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: 献给耶和华你们上帝的
  rationale: ל在此表示祭物的归属和对象；“献给”符合上下文。יהוה按其专名译作“耶和华”，אֱלֹהֵיכֶם译作“你们的上帝”，并按汉语定语结构自然排列。
theological_decisions:
- issue: 上帝“转意”的表述
  choice: 他也许会回心转意，不再降灾
  alternative: 他也许会转回、后悔
  rationale: 经文从人的视角明确保留“谁知道”的不确定性，并用先知性语言描述上帝撤回所宣告的审判。译文不把它消解为必然的怜悯，也避免“后悔”在现代汉语中容易暗示先前犯错的含义。
- issue: מִנְחָה在祭祀语境中的具体含义
  choice: 素祭
  alternative: 供物
  rationale: 该词本可泛指礼物或供物，但与“奠祭”并列时技术性祭名的可能性很强。直接译为“素祭”比宽泛译法更忠实于本节的祭祀语境。
- issue: 福分与祭物之间的关系
  choice: 福分，就是……素祭和奠祭
  alternative: 福分——可作……的供物和奠祭
  rationale: 希伯来语中“福分”后直接接“素祭和奠祭”，可理解为同位说明，即留下的福分具体包括可献的祭物。译文用“就是”呈现这一关系，同时不扩写其物质来源。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“谁知道呢？”保留简短反问；“也许”显明可能性。“回心转意，不再降灾”在可理解性与原文神学张力之间求取平衡。“素祭、奠祭”沿用准确且广为人知的中文圣经祭祀术语。
