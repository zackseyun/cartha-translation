  text: וִ/ידַעְתֶּ֗ם כִּ֣י בְ/קֶ֤רֶב יִשְׂרָאֵל֙ אָ֔נִי וַ/אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם וְ/אֵ֣ין ע֑וֹד וְ/לֹא יֵבֹ֥שׁוּ עַמִּ֖/י לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/027.yaml
  text: Then you will know that I am in the midst of Israel[a], and that I am Yahweh your God, and there is no other; and my people will never again be put to shame.
translation:
  language: zh_hans
  text: 你们就会知道：我在以色列中间；我，雅威，是你们的上帝，此外再没有别的。我的子民必永远不再蒙羞。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的子民必不蒙羞，直到永远。”
    reason: 保留 לְעוֹלָם 较为字面的表达，并呈现“不再”是由复兴语境体现出来的译法。
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: 你们就会知道
  rationale: 该形式在这段先知性应许中表示复兴所带来的将来结果；“就会”自然传达承接上文的结果关系，同时保留“知道”的基本意义。
- source_word: בְקֶרֶב יִשְׂרָאֵל
  choice: 在以色列中间
  rationale: בְּקֶרֶב 表示处在一个群体内部或中央；“在……中间”比单纯的“在……当中”更贴近原文，并保留上帝临在于其民中间的意味。
- source_word: וַאֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: 我就是雅威你们的上帝
  rationale: 重复的第一人称代词带有强调作用，故用“我就是”；יְהוָה 作为专名音译为“雅威”，אֱלֹהֵיכֶם 译作“你们的上帝”。
- source_word: וְאֵין עוֹד
  choice: 此外再没有别的
  rationale: 该惯用语宣告雅威的独一性。“别的”保留原文未明说所省略对象的简洁表达，不擅自补入“神”或“上帝”。
- source_word: וְלֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  choice: 我的子民必永远不再蒙羞
  rationale: בוש 在此可指受辱、陷入羞耻或因落空而羞愧；“蒙羞”较能体现公开受辱的层面。לְעוֹלָם 与否定词连用表示这种羞辱不会再发生，故译作“永远不再”，较符合现代汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”这一常见学术音译，保留其作为以色列之上帝的专名，而不以称号代替。
- issue: וְאֵין עוֹד 的独一性宣告
  choice: 此外再没有别的
  alternative: 再没有别的上帝；再没有谁
  rationale: 所选译法明确保留排他性，却不补明希伯来文省略的名词，从而避免把经文本身的简练表述扩展为更具体的教义公式。
- issue: 羞耻应许中 לְעוֹלָם 的范围
  choice: 必永远不再蒙羞
  alternative: 必不蒙羞，直到永远
  rationale: 原文字面结构是“不蒙羞……直到永远”，上下文则是从既有羞辱中得到永久翻转。“永远不再”自然表达这一结果，但在脚注中保留较字面的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“子民”保留盟约群体的语感；“我就是”体现原文重复代词的强调；句间使用分号，使“临在”和“身份”两项认知内容层次清楚。
