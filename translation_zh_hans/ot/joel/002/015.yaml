base_translation:
  language: en
  yaml_path: translation/ot/joel/002/015.yaml
  text: Blow a trumpet in Zion[a]; consecrate a fast[c][b]; call a solemn assembly.
translation:
  language: zh_hans
  text: 你们要在锡安吹响号角[a]；要使禁食分别为圣[b]；要召集严肃会[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “号角”原文指一种角制吹奏器，常用于发出警报或神圣召集的信号；也可译作“羊角号”。
    reason: lexical_alternative
  - marker: b
    text: 直译“使禁食分别为圣”，即把这次禁食指定为神圣用途；也可译作“宣布神圣的禁食”。
    reason: lexical_alternative
  - marker: c
    text: “严肃会”指正式而庄严的宗教集会；也可译作“圣会”或“神圣集会”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: 吹响
  rationale: 该词是复数命令式，与号角连用时指吹奏使其发声。“吹响”既自然，也保留公开发出警报或召集信号的意味。
- source_word: שׁוֹפָר
  choice: 号角
  rationale: 指用于警报或神圣召集的角制吹奏器。“号角”比“喇叭”更能体现古代器物和庄重语境，又不武断限定其一定由公羊角制成。
- source_word: בְּצִיּוֹן
  choice: 在锡安
  rationale: 介词在此自然表达地点；“在锡安”兼顾锡安作为城和圣山中心的含义。
- source_word: קַדְּשׁוּ
  choice: 使……分别为圣
  rationale: Piel复数命令式，表示为神圣用途加以分别、指定。译文明确保留“圣”的语义，而非仅译作一般性的“宣布”。
- source_word: צוֹם
  choice: 禁食之日
  rationale: 名词指一次具体的群体禁食礼仪。补出“之日”使现代汉语更自然，并表明所指定的是一次公共禁食，而非抽象行为。
- source_word: קִרְאוּ
  choice: 召集
  rationale: 在聚会语境中表示发出号召并使人聚集。“召集”简洁地体现命令和公开召唤的语气。
- source_word: עֲצָרָה
  choice: 严肃会
  rationale: 指正式、庄严的宗教集会。“严肃会”是简洁而庄重的汉语表达，并由脚注说明其神圣集会性质。
theological_decisions:
- issue: קַדְּשׁוּ צוֹם所表达的神圣性质
  choice: 使禁食之日分别为圣
  alternative: 宣布禁食
  rationale: 原文不只要求公布禁食，也用קדשׁ明确表达将其指定为神圣用途；译文保留这一宗教含义，不将其弱化为行政性公告。
- issue: עֲצָרָה的集会性质
  choice: 严肃会
  alternative: 圣会
  rationale: 该词指正式宗教聚会，其庄严性和神圣性都在语境中存在；正文采用自然庄重的“严肃会”，脚注保留“神圣集会”的可能表达，避免过度限定。
translation_notes:
  register: 采用现代、庄重、适合公众诵读的标准普通话。三个复数命令式均用“要”串联，保留原文紧凑而有力的召唤节奏；“分别为圣”保留关键神圣语义，同时以“禁食之日”提高现代汉语可懂度。
