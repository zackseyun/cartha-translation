base_translation:
  language: en
  yaml_path: translation/ot/joel/002/005.yaml
  text: Like the sound of chariots[a], they leap on the tops of the mountains; like the sound of a flame of fire consuming stubble[c][b]; like a mighty people arrayed for battle.
translation:
  language: zh_hans
  text: 如战车的轰响，他们在群山之巅跳跃；如火焰吞噬秸秆的响声；又如强大的军队，为争战列阵。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为争战列阵”也可译作“摆好阵势作战”“列阵备战”或“为战争整队”；原文着重有秩序地排成战斗阵形。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקוֹל מַרְכָּבוֹת
  choice: 如战车的轰响
  rationale: כְּקוֹל 表示声音上的比拟；“轰响”自然传达战车行进的巨大声势，又未增添原文没有明说的“战车声”以外细节。
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: 在群山之巅
  rationale: 原文直译为“在山的头顶上”；“群山之巅”保留高处的鲜明意象，也符合现代汉语表达。
- source_word: יְרַקֵּדוּן
  choice: 跳跃
  rationale: רקד 可指跳、跃或舞动；此处军事推进的语境宜译作“跳跃”，避免“跳舞”所带来的欢庆意味。
- source_word: כְּקוֹל לַהַב אֵשׁ אֹכְלָה קָשׁ
  choice: 如火焰吞噬碎秸的响声
  rationale: 保留第二个 כְּקוֹל 的听觉比喻；“吞噬”呈现火焰吃尽干燥植物的动态，“碎秸”指收割后或干枯的秸秆，较贴近 קָשׁ。
- source_word: כְּעַם עָצוּם
  choice: 又如强大的军队
  rationale: עַם 基本义为“民、民族、众民”，但在列阵迎战的上下文中指一支有组织的战斗群体，译为“军队”使现代读者自然理解；עָצוּם 在此突出强盛有力。
- source_word: עֱרוּךְ מִלְחָמָה
  choice: 列阵迎战
  rationale: עֱרוּךְ 强调按次序排布、摆开阵势；“列阵迎战”简洁传达已经排成战斗阵形的状态。
