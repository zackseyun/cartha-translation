  rationale: 修订重排中文句法，使“被……吃掉的年日”直接修饰“年日”，并以“这些是我所差遣到你们中间的大军”清楚呈现四组名称与“大军”的同位关系。将不通行的拟制昆虫名称改为反映词义但不声称确定分类的“毁灭者、啃食者”，并保留脚注中的分类不确定性及介词的另一可能理解。
