  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שִׁלַּמְתִּ֤י לָ/כֶם֙ אֶת הַ/שָּׁנִ֔ים אֲשֶׁר֙ אָכַ֣ל הָֽ/אַרְבֶּ֔ה הַ/יֶּ֖לֶק וְ/הֶ/חָסִ֣יל וְ/הַ/גָּזָ֑ם חֵילִ/י֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר שִׁלַּ֖חְתִּי בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/025.yaml
  text: I will restore to you the years that the swarming locust has eaten—the hopper[a], the destroyer[b], and the cutter—my great army that I sent among you.
translation:
  language: zh_hans
  text: 我必补偿你们那些被蝗虫、跳蝗、毁灭者和啃食者[a]吃掉的年日；这些是我所差遣到你们中间[b]的大军。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里四个希伯来词很可能指蝗虫的不同种类或生长阶段，但其确切的动物学区别无法确定；也可理解为“爬行蝗虫”“吞噬者”“啃咬者”等。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我所差遣来攻击你们的大军”。这里的希伯来介词可理解为“在你们中间”，也可能表示“针对你们”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: 我要……补还给你们
  rationale: שׁלם 的加强词干在这里有偿还、补足、使损失得到弥补之意。“补还”既保留补偿意味，也比单说“恢复”更贴近动词所表达的偿补行动。
- source_word: הַשָּׁנִים
  choice: 那些年
  rationale: 原文直译为“那些年”，以年份代指多年间失去的收成和生活成果。保留这一转喻，延续原文鲜明而含蓄的表达。
- source_word: אֲשֶׁר אָכַל
  choice: 所吃掉的
  rationale: 直译其吞吃动作；“吃掉”自然清楚，也表现蝗灾造成的彻底损失。
- source_word: הָאַרְבֶּה
  choice: 成群的蝗虫
  rationale: אַרבה 是蝗虫的常用词；加“成群的”体现其群聚侵袭的特征，并与后面几个名称有所区分，但不把它限定为某一现代物种。
- source_word: הַיֶּלֶק
  choice: 跳蝗
  rationale: 该词可能指蝗虫的一类或某一生长阶段，确切所指不明。“跳蝗”简洁地保留独立名称，并以脚注说明其不确定性。
- source_word: וְהֶחָסִיל
  choice: 毁蝗
  rationale: 该名词与吞噬、毁坏的意义相关。“毁蝗”保留其破坏性的词义色彩，同时不声称这是确定的动物学分类。
- source_word: וְהַגָּזָם
  choice: 剪蝗
  rationale: 该词通常与剪切、啃咬相关。“剪蝗”使四个希伯来名称在中文中保持区别，并保留其词根意象。
- source_word: חֵילִי הַגָּדוֹל
  choice: 我的大军
  rationale: חיל 可指军队或强大的队伍。此处把蝗群描绘成受上帝差遣的军队，“我的大军”保留军事比喻及其神学力度。
- source_word: אֲשֶׁר שִׁלַּחְתִּי בָּכֶם
  choice: 是我派到你们中间的
  rationale: 直译第一人称的神圣行动，不弱化“我派”的明确施事关系。介词 בּ 可表示在……中间，也可能带有针对之意；正文采用自然且不过度解释的“到你们中间”。
theological_decisions:
- issue: 四个蝗虫名称是实际昆虫，还是纯粹象征人类军队
  choice: 按实际蝗灾翻译，同时保留“大军”的军事比喻
  alternative: 把全部名称理解为对人类入侵军队的纯粹象征
  rationale: 本节列出四个与蝗虫有关的名称，随后同位地称其为“我的大军”。译文同时保留昆虫名称和军事形象，不把二者之一消解掉。
- issue: 灾害中的神圣施事关系
  choice: 明确译为上帝亲自说“是我派”
  alternative: 弱化为上帝只是容许灾害发生
  rationale: 希伯来文使用第一人称主动动词“我派了”。译文照实保留这一归因，不额外改写为许可性的行动。
- issue: “派到你们中间”是否也可理解为“派来攻击你们”
  choice: 正文采用“派到你们中间”，脚注保留敌对方向的可能性
  alternative: 译为“派来攻击你们”或“派来对付你们”
  rationale: 介词 בּ 的语义容许地点性和针对性理解。正文避免把敌对意味说得比原文更明确，脚注则保存另一合理读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把那些年补还给你们”保留原文以“年”代指多年损失的诗性表达。四个蝗虫名称使用简短并列形式，正文保持节奏，脚注交代其词义和分类的不确定性。
