base_translation:
  language: en
  yaml_path: translation/ot/joel/002/019.yaml
  text: Then the LORD answered and said to his people, “Look, I am sending you the grain, the new wine, and the fresh oil, and you will be satisfied with it; and I will no longer make you a reproach among the nations.”
translation:
  language: zh_hans
  text: 耶和华就回答他的子民说：“看哪，我要把五谷、新酒和新榨的油赐给你们；你们必因此得饱足[a]。我不再使你们在列国中受羞辱。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因此”所对应的原文受词为单数“它”，可能把前述五谷、新酒和新榨的油合看为整体供应。
    reason: 保留并澄清原文单数代词与三个并列农产之间的语法现象；正文以自然的“因此”表达该集合性指代。
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回应
  rationale: 该动词在此表示耶和华对先前呼求的回应；“回应”比单纯“回答”更适合没有直接问句的语境。
- source_word: הִנְנִי שֹׁלֵחַ
  choice: 看哪，我正要……送来
  rationale: 保留 הִנְנִי 的提示和强调作用，并以“正要”表达分词结构所传达的临近、确定行动。
- source_word: הַדָּגָן וְהַתִּירוֹשׁ וְהַיִּצְהָר
  choice: 五谷、新酒和新油
  rationale: 这三个词构成常见的农产组合，分别指粮食、当季酿成的酒和新产的油；采用简洁、传统而现代读者易懂的对应语。
- source_word: וּשְׂבַעְתֶּם
  choice: 使你们得以饱足
  rationale: 表达吃喝充足、需要得到满足之意，同时自然承接前述三种供应。
- source_word: חֶרְפָּה בַּגּוֹיִם
  choice: 在列国中受羞辱
  rationale: חֶרְפָּה 指被人羞辱、讥诮的处境；“列国”保留先知书中的群体与国际语境。
theological_decisions:
- issue: 耶和华与羞辱处境之间的主动关系
  choice: 我不再使你们在列国中受羞辱
  alternative: 我不再让你们在列国中受羞辱
  rationale: 原文 וְלֹא אֶתֵּן אֶתְכֶם עוֹד חֶרְפָּה 较直接地说“不再把你们置为羞辱”，因此保留较强的主动表达，不以“容许”弱化其神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留先知话语的强调色彩；“列国”与经文体裁相称。句式尽量清楚流畅，同时保留耶和华主动供应并终止羞辱的力度。
