base_translation:
  language: en
  yaml_path: translation/ot/joel/002/007.yaml
  text: Like warriors they run[a]; like men of war they climb the wall. Each goes in his own way[b], and they do not swerve from their paths.
translation:
  language: zh_hans
  text: 它们如勇士奔跑，像战士攀上城墙；各人沿自己的道路前进，不偏离自己的路径。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偏离”所译的希伯来语动词十分罕见；也可译作“打乱队形”或“转离”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגִבּוֹרִים
  choice: 如勇士
  rationale: גִּבּוֹר 在这一军事语境中指勇猛的战士；“勇士”既保留力量与战斗色彩，也符合现代汉语表达。
- source_word: יְרֻצוּן
  choice: 奔跑
  rationale: רוץ 的基本义是“跑”；“奔跑”传达这幅场景中迅疾、有力的推进。
- source_word: כְּאַנְשֵׁי מִלְחָמָה
  choice: 像战士
  rationale: 原文直译为“像战争之人”；“战士”在现代汉语中自然、简洁，并准确表达参战者之意。
- source_word: יַעֲלוּ חוֹמָה
  choice: 攀上城墙
  rationale: עלה 是“上去、登上”，与“城墙”连用时表示攀登城墙；“攀上”比单纯“上”更清楚地呈现动作。
- source_word: וְאִישׁ בִּדְרָכָיו יֵלֵכוּן
  choice: 各人沿自己的道路前进
  rationale: אִישׁ 在此作逐一分配用法，意为“各人”；“沿自己的道路前进”保留每一个体按既定路线行动的图景。
- source_word: וְלֹא יְעַבְּטוּן
  choice: 绝不偏离
  rationale: 该动词罕见，语境显示不改变或不扰乱行进路线；“偏离”保留路线层面的含义，而不把它过度限定为军事队列。
- source_word: אֹרְחוֹתָם
  choice: 自己的路径
  rationale: אֹרַח 指路径、轨迹；译作“路径”与前面的“道路”形成近义平行，同时保留两个不同的希伯来词。
theological_decisions:
- issue: 军事用语中的男性表达
  choice: 译作“战士”和“各人”
  alternative: 译作“战争之人”和“各个男人”
  rationale: 原文采用阳性军事称谓及分配性的 אִישׁ。现代汉语“战士”在此自然地指原文所描写的男性作战者，而“各人”准确表达逐一个体的句法功能；若机械加入“男人”，会使汉语生硬，并增加原文未强调的性别对比。
- issue: 行军秩序的具体程度
  choice: 译作“不偏离自己的路径”
  alternative: 译作“不打乱队形”
  rationale: 上下文确有整齐推进的军事图景，但罕见动词的确切含义不明。“不偏离路径”与平行分句相合，也避免把可能的路线偏离明确解释为队列术语。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以分号保留诗句两组平行推进的节奏；“勇士／战士”和“道路／路径”的近义变化对应希伯来原文的词汇变化。
