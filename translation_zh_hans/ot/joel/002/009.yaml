base_translation:
  language: en
  yaml_path: translation/ot/joel/002/009.yaml
  text: They rush through the city[a]; they run on the wall; they climb into the houses; they enter through the windows like a thief.
translation:
  language: zh_hans
  text: 他们在城中疾驰[a]，在城墙上奔跑；他们爬上房屋，从窗户进入，如同盗贼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们冲遍全城”。希伯来语介词直译为“在……中”，这里与移动动词连用，表示在城内迅速推进。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁקּוּ
  choice: 疾驰
  rationale: 该动词在此描写迅速而有力的移动；“疾驰”简洁地传达侵袭者在城中快速推进的动态。
- source_word: בָּעִיר
  choice: 在城中
  rationale: 介词 בְּ 的基本含义是“在……中”；结合移动动词，“在城中”既保留原文形式，也自然表达其在城内四处推进。
- source_word: יְרֻצוּן
  choice: 奔跑
  rationale: רוץ 是常用的“跑”之意；“奔跑”保留动作的迅疾，并与上下文的快速移动相呼应。
- source_word: בַּחוֹמָה
  choice: 在城墙上
  rationale: 直译介词结构，呈现侵袭者登上或沿着城墙快速移动的围城图景。
- source_word: יַעֲלוּ
  choice: 爬进
  rationale: עלה 基本义为“上去、攀上”；房屋语境中“爬进”自然呈现翻越进入的动作，而未过度说明具体路径。
- source_word: בַּבָּתִּים
  choice: 房屋
  rationale: 复数定指形式指场景中的各家房屋；现代汉语无需逐字添加定冠词。
- source_word: בְּעַד הַחַלּוֹנִים
  choice: 从窗户
  rationale: בְּעַד 表示穿过开口；与“闯入”搭配时，“从窗户”自然表达经由窗户进入。
- source_word: יָבֹאוּ
  choice: 闯入
  rationale: בוא 基本义为“来、进入”；此处与盗贼的比喻及侵入住宅的场景结合，“闯入”准确传达未经许可的侵入，但不添加新的对象。
- source_word: כַּגַּנָּב
  choice: 像盗贼一样
  rationale: 保留原文明确的比喻，突出其侵入方式；“盗贼”庄重、自然，并避免引入后来的神学联想。
theological_decisions:
- issue: 侵袭者的所指
  choice: 以复数“他们”承接上文，不明说是蝗虫还是军队
  alternative: 明确译作蝗虫，或明确译作人类军队
  rationale: 本节只有第三人称复数动词，没有明说主语；约珥书此段有意让蝗灾与军事入侵的意象交叠，因此译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；以短促并列句保留希伯来诗句连续推进的节奏。主语统一用“他们”，不擅自判定侵袭者身份。
