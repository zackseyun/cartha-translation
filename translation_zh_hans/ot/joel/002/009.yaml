- from: 他们在城中疾驰[a]，在城墙上奔跑；他们爬进房屋，像盗贼一样从窗户闯入。
  to: 他们在城中疾驰[a]，在城墙上奔跑；他们爬上房屋，从窗户进入，如同盗贼。
  rationale: 修订恢复希伯来文四个连续动作的顺序和空间关系：城中疾驰、城墙上奔跑、爬上房屋、由窗户进入。主语仍为“他们”，不判定其究竟指蝗虫、军队，或两者交织的意象；盗贼的比较也保留在句末。脚注锚点及内容均无结构问题，予以保留。
