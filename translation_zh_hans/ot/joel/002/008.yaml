  yaml_path: translation/ot/joel/002/008.yaml
  text: No man crowds his brother; each goes on his own path. Though they fall through the weapon[a], they do not break ranks.
translation:
  language: zh_hans
  text: 他们彼此不推挤；各人沿自己的道路前进。即使穿过兵器而倒下，也不脱离队列[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句原文含义不确定，也可译作“他们不被截断”或“他们不受阻挡”。这里按上下文译为他们不脱离队列。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אָחִיו לֹא יִדְחָקוּן
  choice: 他们彼此不推挤
  rationale: אִישׁ אָחִיו是分配性惯用语，表示群体中的人互不挤压；“彼此”自然传达这种相互关系，“不推挤”保留דחק的挤压、逼迫之意。
- source_word: גֶּבֶר בִּמְסִלָּתוֹ יֵלֵכוּן
  choice: 各人沿自己的道路前进
  rationale: גֶּבֶר在此承接分配意义；מְסִלָּה可指大道或行进路线。“各人沿自己的道路”保留每个个体按既定路线行动的画面，而“前进”符合上下文，却不把הלך过度限定为军事术语。
- source_word: וּבְעַד הַשֶּׁלַח יִפֹּלוּ
  choice: 虽在兵器之下倒下
  rationale: שֶׁלַח泛指兵器，也可能特指投射武器；不具体译作“箭”或“刀剑”。בעד与נפל的组合含义不易确定，“在兵器之下倒下”保留受兵器攻击而倒下的基本图景；加“虽”显明它与下一分句之间的让步关系。
- source_word: לֹא יִבְצָעוּ
  choice: 仍不乱队形
  rationale: בצע在此语义困难。按整段描写队伍整齐而不可阻挡的语境，“不乱队形”表达其行列没有被截断或冲散；其他可能词义在脚注中保留。
