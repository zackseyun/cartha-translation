  text: מִ/פָּנָ֖י/ו יָחִ֣ילוּ עַמִּ֑ים כָּל פָּנִ֖ים קִבְּצ֥וּ פָארֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/006.yaml
  text: Before him peoples writhe[b][a]; all faces grow pale.
translation:
  language: zh_hans
  text: 在他面前，万民痛苦战栗[a]；人人都面色苍白[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因他临近，万民陷入痛苦。”原词也可表示扭动或战栗。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近似“所有的脸都聚集פָארוּר”。这是一个含义不甚确定的短语，通常理解为脸色因惊恐而变得苍白；罕见词פָארוּר也有人解释为红色或光彩。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפָּנָיו
  choice: 在他面前
  rationale: מִן与פָּנִים连用可表示面对某者或因其临近而产生的反应；“在他面前”自然保留第三人称阳性单数后缀，也不明确其所指。
- source_word: יָחִילוּ
  choice: 痛苦战栗
  rationale: חול的Qal形式可指扭动、战栗或如产痛般受苦；“痛苦战栗”兼顾强烈的身体痛楚与恐惧反应，比单用“害怕”更具画面感。
- source_word: עַמִּים
  choice: 万民
  rationale: 复数עַמִּים泛指多个族群或众民；“万民”符合庄重的现代汉语经文语体，又不局限于现代政治意义上的国家。
- source_word: כָּל־פָּנִים
  choice: 人人都面色
  rationale: 希伯来文直译为“所有的脸”；汉语用“人人都面色……”自然表达同一集合范围。
- source_word: קִבְּצוּ פָארוּר
  choice: 面色苍白
  rationale: 这是含有罕见词פָארוּר的困难短语，通常按惊恐使脸失去血色的习语理解；正文采用自然汉语表达其语境意义，脚注保留原文形式及词义争议。
theological_decisions:
- issue: מִפָּנָיו中第三人称阳性单数后缀的所指
  choice: 译作“他”，不明说是耶和华、耶和华的日子，还是拟人化的进军者。
  alternative: 可按上下文解释为“在耶和华面前”或“在它面前”。
  rationale: 希伯来文只用阳性单数代词后缀；上下文把进军者与耶和华的日子紧密相连。保留“他”可避免消除原文的指称张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万民”保持诗歌性的集体范围；分号对应原文两个平行分句。脚注标记均置于正文相关短语之后。
