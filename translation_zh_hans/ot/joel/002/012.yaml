  text: וְ/גַם עַתָּה֙ נְאֻם יְהוָ֔ה שֻׁ֥בוּ עָדַ֖/י בְּ/כָל לְבַבְ/כֶ֑ם וּ/בְ/צ֥וֹם וּ/בְ/בְכִ֖י וּ/בְ/מִסְפֵּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/012.yaml
  text: “Yet even now,” declares Yahweh[a], “return to me with all your heart, and with fasting, and with weeping, and with mourning.”
translation:
  language: zh_hans
  text: “然而，即使到了现在，”雅威[a]宣告：“你们要全心归向我；要禁食、哭泣、哀恸。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译；传统上也译作“耶和华”，有些译本以“主”代替。
    reason: 说明神名的原文形式与主要中文译法。
lexical_decisions:
- source_word: וְגַם עַתָּה
  choice: 然而，就是现在
  rationale: וְגַם带有承接、强调并在审判语境中形成转折的作用；“然而，就是现在”既保留转折，也突出当下仍可归回的时机。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: 这是庄严的先知宣告公式；“宣告说”符合现代汉语表达，并保留其权威语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按辅音四字神名直接音译为“雅威”，保留其作为以色列之神圣约名字的性质，而不以称号替代。
- source_word: שֻׁבוּ עָדַי
  choice: 你们要……归向我
  rationale: שוב的基本意象是转回、归回；与עָדַי“向我”连用时，“归向我”自然地保留关系性和方向性，也蕴含悔改而不将其缩减为抽象术语。
- source_word: בְּכָל לְבַבְכֶם
  choice: 全心
  rationale: לֵבָב指人的内在，包括意志、思想和情感；“全心”简洁自然，并传达毫无保留的归向。
- source_word: וּבְצוֹם וּבְבְכִי וּבְמִסְפֵּד
  choice: 并且禁食、哭泣、哀恸
  rationale: 保留三个并列的悔罪表现；“禁食、哭泣、哀恸”庄重而易懂，其中“哀恸”不把מִסְפֵּד过度限定为某一种礼仪性哀歌。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，避免用称号“主”取代；“耶和华”则反映另一传统音译。
- issue: שׁוּב应译为“归向”还是“悔改”
  choice: 归向
  alternative: 悔改；转回
  rationale: 原文动词本义为转回、归回，且明确带有“向我”这一方向。“归向我”保留圣约关系的空间隐喻，同时让悔改含义由语境自然显出。
- issue: 禁食、哭泣、哀恸与“全心”的关系
  choice: 按原文并列保留，不解释为单纯外在仪式或归回的充分条件
  alternative: 把三者解释性地从属于内心悔改；或视为独立的礼仪要求
  rationale: 原文重复介词并列“全心”与三种表现，既强调内在归向，也列出具身的哀悔行动；译文不替经文消除二者之间的张力。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“然而，就是现在”传达审判背景中的转折与紧迫性；引语中的复数“你们”对应希伯来文复数命令式。“全心”避免冗长解释，同时保留圣约语境中整个人归向神的含义。
