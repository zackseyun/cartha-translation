id: JOL.2.16
reference: Joel 2:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִסְפוּ עָ֞ם קַדְּשׁ֤וּ קָהָל֙ קִבְצ֣וּ זְקֵנִ֔ים אִסְפוּ֙ עֽוֹלָלִ֔ים וְ/יֹנְקֵ֖י שָׁדָ֑יִם יֵצֵ֤א חָתָן֙ מֵֽ/חֶדְר֔/וֹ וְ/כַלָּ֖ה מֵ/חֻפָּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/016.yaml
  text: Gather the people[a]; consecrate the assembly; gather the elders; gather the children, even the nursing infants. Let the bridegroom come out from his room[c][b], and the bride from her chamber.
translation:
  language: zh_hans
  text: 聚集百姓，使会众分别为圣；召集长老[a]，聚集孩童和吃奶的婴儿[b]。新郎要从自己的内室出来，新娘也要从自己的婚房[c]出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“老人”。希伯来词既可指年老的人，也常指共同体中的长老。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“吸吮乳房的婴儿”。
    reason: lexical_alternative
  - marker: c
    text: 或译“婚礼华盖”。这个希伯来词可指婚礼华盖，也可指新娘的内室。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפוּ עָם
  choice: 聚集百姓
  rationale: 复数命令式 אִסְפוּ 是召集众人的直接命令；“聚集百姓”自然、庄重，也保留了原文的命令语气。
- source_word: קַדְּשׁוּ קָהָל
  choice: 把会众分别为圣
  rationale: קדשׁ 的 Piel 命令式在此具有敬拜礼仪语境中的分别、奉献之意；“分别为圣”保留神圣召集的意味，而不额外说明具体礼仪。קָהָל 译作“会众”，体现共同体聚集敬拜的含义。
- source_word: קִבְצוּ זְקֵנִים
  choice: 召集长老
  rationale: קבץ 与前面的 אסף 意义相近，译作“召集”既自然又略微保留词语变化。זְקֵנִים 在共同体语境中通常指“长老”，但也可能泛指年老的人，故加脚注保留歧义。
- source_word: עוֹלָלִים
  choice: 孩童
  rationale: 该词指年幼的孩子；下文另提吃奶者，因此译作“孩童”可保留两组年龄层次的区别。
- source_word: יֹנְקֵי שָׁדָיִם
  choice: 吃奶的婴儿
  rationale: 原文直指“吸吮乳房的人”；“吃奶的婴儿”准确而自然，也突出了连最幼小者都要参加。
- source_word: יֵצֵא
  choice: 要……出来
  rationale: 未完成式在连续的召集命令中带有祈使或敦促意味；汉语用“要……出来”清楚表达这种要求。
- source_word: חָתָן
  choice: 新郎
  rationale: 这是婚礼语境中的标准现代汉语称谓，与“新娘”自然对应。
- source_word: מֵחֶדְרוֹ
  choice: 从自己的内室出来
  rationale: חֶדֶר 指房屋内部的房间；“内室”保留其较私密、位于内部的含义，又符合庄重经文语体。
- source_word: כַלָּה
  choice: 新娘
  rationale: 婚姻语境中的明确、标准译法。
- source_word: מֵחֻפָּתָהּ
  choice: 从自己的婚房出来
  rationale: חֻפָּה 可指婚礼华盖、婚棚，也可指新娘所在的婚室。正文采用语境中自然的“婚房”，并以脚注保留词义范围。
theological_decisions:
- issue: 神圣召集用语的表达
  choice: 把会众分别为圣
  alternative: 使会众自洁；使集会成为圣洁
  rationale: 上下文是全体共同体为悔改和敬拜而受召。“分别为圣”保留原文的礼仪与神圣含义，同时不擅自规定洁净方式或具体仪式。
- issue: זְקֵנִים 的社会身份或年龄含义
  choice: 长老
  alternative: 老人；年老的人
  rationale: 在共同体召集的语境中，该词很可能指具有身份或代表作用的长老；但希伯来词也可单纯按年龄理解，因此正文采用较可能的译法，并在脚注中保留另一读法。
- issue: חֻפָּה 所指的婚礼空间
  choice: 婚房
  alternative: 婚棚；婚礼华盖
  rationale: 该词在此与新郎的“内室”平行，正文用现代读者容易理解的“婚房”；脚注说明它也可指婚礼华盖或婚棚，以免消除原文的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“聚集—召集—聚集”保留原文连续命令的节奏，并以轻微词语变化避免汉语生硬重复；“分别为圣”维持敬拜语境，“内室”“婚房”则兼顾可读性与婚礼场景。
