  to: '事奉雅威的祭司要在圣殿门廊[a]和祭坛之间哀哭，说：


    “雅威啊，求你怜惜你的子民！


    不要使你的基业受辱，


    成为列国中的笑柄。[b]


    为什么要让众民说：


    ‘他们的上帝在哪里？’”'
  rationale: 修订以原文语境为先：保留礼仪地点、劝令语气、神名和盟约性称谓；对“למשל בם גוים”采用与“受辱”和讥问平行的“笑柄”读法，并在脚注中不偏不倚地保留“辖制”的替代解释。措辞调整为现代标准汉语中庄重、简明的经文语体。
