source:
  edition: WLC
  text: בֵּ֤ין הָ/אוּלָם֙ וְ/לַ/מִּזְבֵּ֔חַ יִבְכּוּ֙ הַ/כֹּ֣הֲנִ֔ים מְשָׁרְתֵ֖י יְהוָ֑ה וְֽ/יֹאמְר֞וּ ח֧וּסָ/ה יְהוָ֣ה עַל עַמֶּ֗/ךָ וְ/אַל תִּתֵּ֨ן נַחֲלָתְ/ךָ֤ לְ/חֶרְפָּה֙ לִ/מְשָׁל בָּ֣/ם גּוֹיִ֔ם לָ֚/מָּה יֹאמְר֣וּ בָֽ/עַמִּ֔ים אַיֵּ֖ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/017.yaml
  text: Let the priests[a], the ministers of Yahweh, weep between the portico and the altar, and let them say, “Spare your people, Yahweh, and do not make your inheritance a reproach, a byword among the nations. Why should they say among the peoples[b], ‘Where is their God?’”
translation:
  language: zh_hans
  text: '事奉雅威的祭司要在圣殿门廊[a]和祭坛之间哀哭，说：


    “雅威啊，求你怜惜你的子民！


    不要使你的基业受辱，


    成为列国中的笑柄。[b]


    为什么要让众民说：


    ‘他们的上帝在哪里？’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门廊”指圣殿入口处的厅廊；也可译作“前厅”或“廊厅”。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为：“不要使你的基业受辱，让列国辖制他们。”此短语的词义和句法有争议；“笑柄（或话柄）”与下文列邦讥问“他们的上帝在哪里？”更相称。
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין הָאוּלָם וְלַמִּזְבֵּחַ
  choice: 在圣殿门廊和祭坛之间
  rationale: אוּלָם指圣殿入口处的厅廊；“圣殿门廊”以自然的现代汉语明确交代礼仪场景。
- source_word: יִבְכּוּ
  choice: 要……哭泣
  rationale: 此处未完成式在召集会众的语境中带有劝令意味；“要……哭泣”保留这一指示语气。
- source_word: הַכֹּהֲנִים מְשָׁרְתֵי יְהוָה
  choice: 祭司，就是事奉雅威的人
  rationale: מְשָׁרְתֵי是描述祭司礼仪职分的分词称谓；同位表达既保留原文结构，也使现代读者容易理解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: חוּסָה עַל עַמֶּךָ
  choice: 求你怜惜你的子民
  rationale: חוּס兼含怜悯并不施毁灭之意；“怜惜”在祈求语境中自然，并保留慈悲与宽免的双重色彩。
- source_word: נַחֲלָתְךָ
  choice: 你的产业
  rationale: “产业”保留 נַחֲלָה 所承载的归属、承受与盟约关系，不将其泛化为普通财产。
- source_word: וְאַל תִּתֵּן נַחֲלָתְךָ לְחֶרְפָּה
  choice: 不要使你的产业蒙受羞辱
  rationale: חֶרְפָּה指公开的耻辱、辱骂或讥诮；“蒙受羞辱”符合汉语习惯，也保留群体受辱的意味。
- source_word: לִמְשָׁל בָּם גּוֹיִם
  choice: 任列国辖制他们
  rationale: 按马所拉文本的元音标注，לִמְשָׁל最直接是动词 משל“统治、辖制”的不定式；因此正文遵从 WLC 的读法，同时用脚注保留将辅音理解为“笑柄、话柄”的传统可能。
- source_word: גּוֹיִם / בָעַמִּים
  choice: 列国 / 万民
  rationale: 分别译出两个相近而不同的复数名词，并以自然汉语保持从外国列国到众民舆论的语义推进。
- source_word: לָמָּה יֹאמְרוּ
  choice: 为什么要让……说
  rationale: 此处未完成式表达祷告者希望避免的后果；这一译法传达反问和恳求的语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留盟约之神的专名性质，避免以称号代替。
- issue: לִמְשָׁל בָּם גּוֹיִם 的含义
  choice: 任列国辖制他们
  alternative: 成为列国中的笑柄（或话柄）
  rationale: WLC 的元音标注支持“辖制”；但辅音文本可与 מָשָׁל“箴言、话柄”相联系，而且上下文紧接列国的讥问，支持“笑柄”之义。正文依照指定的马所拉文本，脚注保留真实的文本与词义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“祭司，就是事奉雅威的人”保留原文同位结构；诗行分行呈现祷告的节奏。正文优先依据 WLC 的元音文本，不以英语咨询层所偏好的“笑柄”读法覆盖马所拉读法，并在脚注中完整保留另一解释。
