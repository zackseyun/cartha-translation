base_translation:
  language: en
  yaml_path: translation/ot/joel/002/022.yaml
  text: Do not fear[a], beasts of the field, for the pastures of the wilderness have become green; for the tree bears its fruit, the fig tree and the vine have given their wealth.
translation:
  language: zh_hans
  text: 田野的走兽啊，不要害怕！因为旷野的草场已经返青，树木也结出果实；无花果树和葡萄树都丰产了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“给出了它们的力量”；也可译为“结出了丰盛的果实”或“产出了丰富的出产”。这里的希伯来语“力量”可能指它们的生产力或丰盛的产量。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאוּ
  choice: 不要害怕
  rationale: 这是以 ירא 构成的否定命令；“不要害怕”自然、直接，并保留对田野走兽的拟人化呼告。
- source_word: בַּהֲמוֹת שָׂדַי
  choice: 田野的走兽
  rationale: בְּהֵמָה 可泛指兽类；“走兽”既符合先知文学的庄重语体，也比“牲畜”更避免把范围限于家畜。
- source_word: דָשְׁאוּ
  choice: 已经返青
  rationale: 该动词表示长出青草、变得青绿；“返青”简洁地传达灾后草场恢复生机的完成状态。
- source_word: נְאֹות מִדְבָּר
  choice: 旷野的草场
  rationale: נְאוֹת 指牧场或可放牧之地；מִדְבָּר 在此是未耕作的旷野，并非必然指沙漠。
- source_word: עֵץ נָשָׂא פִרְיוֹ
  choice: 树木也结出果实
  rationale: 希伯来文单数 עֵץ 可作集合性用法；汉语用“树木”自然表达泛指，נָשָׂא פִרְיוֹ 则直陈树木恢复结果。
- source_word: תְּאֵנָה וָגֶפֶן
  choice: 无花果树和葡萄树
  rationale: 保留两种具体作物，呈现土地恢复丰饶的农业图景。
- source_word: נָתְנוּ חֵילָם
  choice: 都丰产了
  rationale: חַיִל 的基本意象涉及力量、能力或财富；在果树与葡萄树的语境中，所指是生产力及丰盛出产。“丰产了”以自然现代汉语表达其语境意义，脚注保留原文隐喻及其他译法。
theological_decisions: []
