base_translation:
  language: en
  yaml_path: translation/ot/joel/002/004.yaml
  text: Their appearance is like the appearance of horses[a], and like horsemen[b], so they run.
translation:
  language: zh_hans
  text: 它们的样子如同马匹[a]；又像骑兵[b]一样奔跑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它的样子如同马匹。”原文用单数后缀（“它的”），但所指的是一个集体，因此正文按复数译为“它们的样子”。
    reason: lexical_alternative
  - marker: b
    text: “骑兵”也可译作“骑马的人”或“骑乘者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַרְאֵה
  choice: 如同……的样子
  rationale: מַרְאֶה指可见的外貌、形态；כְּ引入比喻。汉语采用“样子如同……”自然传达这一比较。
- source_word: סוּסִים
  choice: 马匹
  rationale: 该复数名词直指马；“马匹”在现代汉语中自然、庄重。
- source_word: מַרְאֵהוּ
  choice: 它们的样子
  rationale: 原文为单数名词并带第三人称阳性单数后缀，但所指对象是上下文中的集体。汉语以复数“它们”表达集体所指，同时用脚注保留原文的单数形式。
- source_word: וּכְפָרָשִׁים
  choice: 又像骑兵
  rationale: פָּרָשִׁים指骑马作战的人或骑乘者；“骑兵”贴合这里的军事意象，并与前面的“马匹”形成平行。
- source_word: כֵּן
  choice: 一样
  rationale: כֵּן承接前面的比较，表达“照样、如此”；置于“像骑兵一样奔跑”中符合现代汉语习惯。
- source_word: יְרוּצוּן
  choice: 奔跑
  rationale: 源自动词רוץ，基本义为“跑”。“奔跑”既自然，也不额外强化为“猛冲”或“飞驰”。
