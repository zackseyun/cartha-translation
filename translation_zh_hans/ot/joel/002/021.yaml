source:
  edition: WLC
  text: אַל תִּֽירְאִ֖י אֲדָמָ֑ה גִּ֣ילִי וּ/שְׂמָ֔חִי כִּֽי הִגְדִּ֥יל יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/021.yaml
  text: Do not fear[a], O land; rejoice and be glad, for Yahweh has done great things.
translation:
  language: zh_hans
  text: 土地啊，不要害怕；要欢喜快乐，因为雅威行了大事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来语表达也可译作“大大行事”。
    reason: 保留הִגְדִּיל לַעֲשׂוֹת既可指“行大事”、也可指“以非凡方式行事”的词义幅度。
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: 不要害怕
  rationale: אַל加未完成式构成禁止语气；“不要害怕”是现代汉语中自然、明确的表达。阴性单数形式与拟人化的“土地”呼应。
- source_word: אֲדָמָה
  choice: 土地
  rationale: 此处指犹大地，并以拟人手法受到呼唤；“土地”兼顾农业语境与地域含义，比“大地”范围更准确，也比“土壤”更宽。
- source_word: גִּילִי וּשְׂמָחִי
  choice: 要欢喜快乐
  rationale: 两个并列命令都表达喜乐，形成诗意加强；“欢喜快乐”自然地保留了这种双重表达。
- source_word: כִּי
  choice: 因为
  rationale: 引出土地不必害怕、反当喜乐的原因，现代汉语用“因为”清楚自然。
- source_word: הִגְדִּיל לַעֲשׂוֹת
  choice: 行了大事
  rationale: 该结构字面涉及“使所行的为大”，在此惯用地表示作出非凡、重大的作为；“行了大事”简洁庄重，并保留其行动意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以汉语常见音译呈现四字神名，而不以称号替代，使原文中的专名得到保留。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用以色列上帝的专名，而非“主”这一称号；“雅威”较贴近学界通常重构的读音，同时“耶和华”是中文传统中的常见形式。正文采用“雅威”，不把专名改译为称号。
- issue: הִגְדִּיל לַעֲשׂוֹת所指行动的性质
  choice: 行了大事
  alternative: 大大行事
  rationale: 原文既可强调所行之事重大，也可强调行动方式非凡。“行了大事”在本节中自然地表达雅威伟大的作为，而脚注保留另一种理解，避免把希伯来语惯用结构解释得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“土地啊”保留先知诗歌中对土地的拟人呼告；分号呈现从禁止害怕转向欢喜快乐的平行节奏。
