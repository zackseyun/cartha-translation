  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תִּקְע֨וּ שׁוֹפָ֜ר בְּ/צִיּ֗וֹן וְ/הָרִ֨יעוּ֙ בְּ/הַ֣ר קָדְשִׁ֔/י יִרְגְּז֕וּ כֹּ֖ל יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּֽי בָ֥א יוֹם יְהוָ֖ה כִּ֥י קָרֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/001.yaml
  text: Blow a horn in Zion[a], and sound an alarm on my holy mountain; let all the inhabitants of the land tremble, for the day of Yahweh is coming—indeed, it is near.
translation:
  language: zh_hans
  text: 你们要在锡安吹响号角，在我的圣山发出警报！愿这地[a]所有的居民都战抖，因为雅威的日子将到，确实已经临近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这地”也可译作“全地”或“全世界”；希伯来语 אֶרֶץ 可依上下文指一片土地、国土或整个大地。
    reason: 保留 הָאָרֶץ 在本地范围与普世范围之间的真实歧义。
lexical_decisions:
- source_word: תִּקְעוּ שׁוֹפָר
  choice: 吹响号角
  rationale: תקע与שׁוֹפָר连用，指吹奏号角；“吹响号角”既自然，也保留用于召集或警报的具体形象，不把乐器过度限定为金属号或羊角。
- source_word: בְּצִיּוֹן
  choice: 在锡安
  rationale: בְ在此为地点用法；“在锡安”符合现代汉语地名表达。
- source_word: וְהָרִיעוּ
  choice: 发出警报
  rationale: רוע的使役式在此表示发出响亮的警报信号，与前句吹号平行；译作“发出警报”较“呐喊”更贴合迫近灾祸的语境，同时不限定为战斗口号。
- source_word: בְּהַר קָדְשִׁי
  choice: 在我的圣山
  rationale: 指雅威分别为圣的山，即锡安；汉语以“在……山”表达发声地点最自然。
- source_word: יִרְגְּזוּ
  choice: 愿……都战抖
  rationale: 此未完成式承接命令语气，可作意愿或呼吁理解；“愿”保留其非单纯陈述的语气，“战抖”兼有身体震颤与恐惧不安。
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: 这地所有的居民
  rationale: 在锡安和圣山的直接语境中，הָאָרֶץ较可能指当地或国土；“这地”自然传达这一范围，同时以脚注保留“全地”的可能。
- source_word: כִּי בָא יוֹם יְהוָה
  choice: 因为雅威的日子将到
  rationale: בָא描绘正在来到、迫近的事件，汉语“将到”表达其临近性；יוֹם יְהוָה译为“雅威的日子”，保留神名与该先知性短语。
- source_word: כִּי קָרוֹב
  choice: 确实已经临近
  rationale: 第二个כִּי可具解释或强调作用；“确实”保留强调，“已经临近”自然表达קָרוֹב所指的迫切状态。
theological_decisions:
- issue: הָאָרֶץ所指的范围
  choice: 这地
  alternative: 全地／全世界
  rationale: 锡安与圣山的近距离语境支持当地国土之意，但“雅威的日子”的广阔末世性背景也容许更普遍的理解，因此正文取较近的语境义，脚注保留歧义。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其专名性质，不以称号替代。
- issue: יִרְגְּזוּ的语气
  choice: 愿……都战抖
  alternative: ……都要战抖
  rationale: 该未完成式位于两个命令式之后，可以理解为带祈使色彩的呼吁，也可理解为结果或预告。正文用“愿”保留其意愿语气，不将其完全化为未来陈述。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“吹响号角—发出警报”形成紧凑平行句；感叹号传达连续命令的紧迫感。脚注标记置于全节末尾，明确对应“这地”的译法。
