  text: וַ/יְקַנֵּ֥א יְהוָ֖ה לְ/אַרְצ֑/וֹ וַ/יַּחְמֹ֖ל עַל עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/018.yaml
  text: Then Yahweh became jealous for his land and had compassion on his people[a].
translation:
  language: zh_hans
  text: 雅威就为自己的地发热心[a]，怜悯自己的子民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“为自己的地嫉妒”。希伯来语动词可表示“嫉妒”或“热心”；此处指雅威对属于自己的地所怀的炽烈、护卫性的关切。
    reason: 词义有真实的双重可能；脚注保留“嫉妒／热心”的语义张力。
lexical_decisions:
- source_word: וַיְקַנֵּא
  choice: 大发热心
  rationale: קנא可表示“嫉妒”或“热心”。这里与לְאַרְצוֹ连用，表达雅威对属于自己的土地怀有炽烈、护卫性的关切。“大发热心”在现代汉语中较自然，也避免让“嫉妒土地”产生错误联想；其“嫉妒、妒爱”的语义张力保留在脚注中。叙事形式译作过去语境中的承接动作。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译“雅威”呈现神的专名，区别于“主”这一称号。
- source_word: לְאַרְצוֹ
  choice: 为自己的土地
  rationale: אֶרֶץ在此指圣约之地，而非全世界；介词לְ标明雅威热心所关切的对象，译作“为”。“自己的”明确反身领属关系，符合汉语习惯。
- source_word: וַיַּחְמֹל
  choice: 怜悯
  rationale: חמל可表示怜惜、同情或饶恕。此处“怜悯”保留情感与恢复性的意味，又不把含义收窄为仅仅免除惩罚。
- source_word: עַל
  choice: （融入“怜悯他的子民”句式）
  rationale: עַל在חמל之后标明怜悯的对象；现代汉语及物结构无需另译介词。
- source_word: עַמּוֹ
  choice: 他的子民
  rationale: עַם在此指与神有圣约关系的群体。“子民”比“国民”更能表达这种共同体与归属关系，同时保持庄重。
theological_decisions:
- issue: 神的嫉妒与热心如何表达
  choice: 雅威为自己的土地大发热心
  alternative: 雅威为自己的土地起了妒爱之心／起了嫉妒之心
  rationale: 希伯来语קנא同时包含热忱、护卫性的嫉妒和专一归属的意味。正文采用自然且不易误解的“大发热心”，脚注说明“嫉妒／妒爱”这一可能译法，以保留圣约排他性和强烈情感，不将其淡化为一般 enthusiasm。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“于是”承接前文悔改与恳求的语境；句式简洁，对应希伯来文两个并列动作。正文脚注标记[a]与脚注完全对应。
