id: JOL.2.20
reference: Joel 2:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְֽ/אֶת הַ/צְּפוֹנִ֞י אַרְחִ֣יק מֵ/עֲלֵי/כֶ֗ם וְ/הִדַּחְתִּי/ו֮ אֶל אֶ֣רֶץ צִיָּ֣ה וּ/שְׁמָמָה֒ אֶת פָּנָ֗י/ו אֶל הַ/יָּם֙ הַ/קַּדְמֹנִ֔י וְ/סֹפ֖/וֹ אֶל הַ/יָּ֣ם הָ/אַֽחֲר֑וֹן וְ/עָלָ֣ה בָאְשׁ֗/וֹ וְ/תַ֨עַל֙ צַחֲנָת֔/וֹ כִּ֥י הִגְדִּ֖יל לַ/עֲשֽׂוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/020.yaml
  text: And I will remove the northerner far from you[a], and I will drive him into a dry and desolate land, his front into the eastern sea and his rear into the western sea; his stench will rise, and his foul smell will rise[c][b], because he has done great things.
translation:
  language: zh_hans
  text: 我要使北方来的那一位远离你们[a]，把他赶到干旱荒凉之地；使他的前端进入东海，后端进入西海[b]。他的臭气必上升；他的恶臭必腾起，因为他做了大事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“北方的军队”。原文作单数、人格化的“北方者”。
    reason: lexical_alternative
  - marker: b
    text: “东海”很可能指死海，“西海”很可能指地中海。
    reason: cultural_note
  - marker: c
    text: 或译“因为他行事狂妄”。原文直译是“因为他做了大事”；在这里按上下文可能含有狂妄、过分行事的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: הַצְּפוֹנִי
  choice: 那从北方来的
  rationale: 原文是单数、人格化的“北方者”。译文保留其单数指称及来源方向，不在正文中限定为军队、特定国家或蝗群。
- source_word: אַרְחִיק מֵעֲלֵיכֶם
  choice: 使……远离你们
  rationale: 准确表达רחק使役式“使远离”的因果及空间含义。
- source_word: וְהִדַּחְתִּיו
  choice: 把他赶到
  rationale: נדח使役式含驱赶、逐离之意；“赶到”自然衔接目的地。
- source_word: אֶרֶץ צִיָּה וּשְׁמָמָה
  choice: 干旱荒凉之地
  rationale: 分别保留צִיָּה的干旱与שְׁמָמָה的荒凉含义，语言简洁庄重。
- source_word: פָּנָיו
  choice: 他的前锋
  rationale: 字面为“他的脸/前面”；与后文“他的末端”对举，并处于人格化入侵者的图景中，“前锋”清楚表达前部，同时不过度指定其身份。
- source_word: הַיָּם הַקַּדְמֹנִי
  choice: 东海
  rationale: 保留原文的方向称谓，不在正文直接认定为死海。
- source_word: סֹפוֹ
  choice: 他的后队
  rationale: 该词本义为“末端”；与“前锋”对应时指后部或尾端。“后队”在侵入力量的整体图景中自然。
- source_word: הַיָּם הָאַחֲרוֹן
  choice: 西海
  rationale: 原文为“后面的海”，按古代以东方为前方的方位表达即西海；不在正文直接认定为地中海。
- source_word: בָאְשׁוֹ
  choice: 他的恶臭
  rationale: 表达该词明确的难闻气味，并保留与下一分句的平行。
- source_word: צַחֲנָתוֹ
  choice: 他的腥臭
  rationale: 该词指令人厌恶的臭气；“腥臭”与“恶臭”形成近义平行，又避免机械重复。
- source_word: כִּי הִגְדִּיל לַעֲשׂוֹת
  choice: 因为他做了大事
  rationale: 直译原文惯用语，保留其可能指重大作为、也可能在本语境中含狂妄或过分作为的张力。
theological_decisions:
- issue: “从北方来的”所指为何
  choice: 保留单数、人格化的敌对来者
  alternative: 北方军队、蝗灾的拟人化、特定历史国家或北风
  rationale: 原文用阳性单数，并以“前面—末端”的整体形象描述；本节本身没有充分依据把它明确限定为某一国家、自然现象或单纯的蝗群。
- issue: “做了大事”的语义倾向
  choice: 正文保留原文惯用语
  alternative: “因为他行事狂妄”或“因为他做得太过分”
  rationale: 该短语既可正面指伟大作为，也可在敌人受审判的语境中带负面意味。保留直译可避免提前消解这种有意的语义张力，并以脚注交代负面读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来诗句的平行结构；“东海—西海”“恶臭—腥臭”呈现原文对举。所有代词保持单数人格化表达，不在正文中锁定历史身份。
