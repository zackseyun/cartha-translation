source:
  edition: WLC
  text: לְ/פָנָי/ו֙ רָ֣גְזָה אֶ֔רֶץ רָעֲשׁ֖וּ שָׁמָ֑יִם שֶׁ֤מֶשׁ וְ/יָרֵ֨חַ֙ קָדָ֔רוּ וְ/כוֹכָבִ֖ים אָסְפ֥וּ נָגְהָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/010.yaml
  text: Before him the earth quakes[a]; the heavens tremble. The sun and the moon grow dark[b], and the stars withdraw their brightness.
translation:
  language: zh_hans
  text: 在他面前，大地震动[a]，诸天震颤；日月昏暗，众星收回光辉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他面前，大地战栗。”
    reason: לְפָנָיו也可表达“在他临在中”；רָגְזָה可译作“战栗”。
  - marker: b
    text: 直译：“众星收聚自己的光辉”，意思是众星不再发光。
    reason: 保留אָסף“收聚”的字面意象，并说明该短语在上下文中的含义。
lexical_decisions:
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 保留“在他面前／在他临在中”的空间与关系含义；现代汉语自然庄重，且不把“脸”生硬直译出来。
- source_word: רָגְזָה אֶרֶץ
  choice: 大地震动
  rationale: רגז可指战栗、震动；以大地为主语时，“震动”准确呈现地震般的动荡。上下文遍及诸天和天体，因此将אֶרֶץ译为“大地”，而非局部的“土地”。
- source_word: רָעֲשׁוּ שָׁמָיִם
  choice: 诸天摇撼
  rationale: רעשׁ表达震荡、摇动；“摇撼”与前句“震动”形成有变化的平行。“诸天”保留שָׁמַיִם的形式及先知诗歌的庄严语体。
- source_word: שֶׁמֶשׁ וְיָרֵחַ קָדָרוּ
  choice: 日月昏暗
  rationale: קדר表示变暗、阴沉；“昏暗”简洁自然，并保留日月失去明亮的意象。
- source_word: וְכוֹכָבִים אָסְפוּ נָגְהָם
  choice: 众星收回光辉
  rationale: אָסף本义为收聚、收回，与“光辉”连用时描写星辰不再发光。“收回光辉”既保留原文具体而略带诗意的表达，也让汉语读者能够理解其含义。
theological_decisions:
- issue: 宇宙震荡意象的范围与性质
  choice: 按原文直接呈现大地、诸天、日月和众星的宇宙性震荡，不说明它仅是比喻，也不限定为某一种末世时间表。
  alternative: 将其解释为军队来袭所造成恐惧的纯比喻，或明确译成某套特定的末世预言。
  rationale: 原文以先知诗歌描绘宇宙异象，但本节本身没有消除其历史性、比喻性或末世性之间的张力；译文应保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的先知诗歌语体。以“大地—诸天—日月—众星”的递进保持原文的宇宙规模，并用“震动／摇撼”和“昏暗／收回光辉”保存平行结构及措辞变化。所有脚注标记均已置于正文。
