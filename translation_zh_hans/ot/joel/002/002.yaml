  text: י֧וֹם חֹ֣שֶׁךְ וַ/אֲפֵלָ֗ה י֤וֹם עָנָן֙ וַ/עֲרָפֶ֔ל כְּ/שַׁ֖חַר פָּרֻ֣שׂ עַל הֶֽ/הָרִ֑ים עַ֚ם רַ֣ב וְ/עָצ֔וּם כָּמֹ֗/הוּ לֹ֤א נִֽהְיָה֙ מִן הָ֣/עוֹלָ֔ם וְ/אַֽחֲרָי/ו֙ לֹ֣א יוֹסֵ֔ף עַד שְׁנֵ֖י דּ֥וֹר וָ/דֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/002.yaml
  text: A day of darkness and gloom[a], a day of clouds and thick darkness; like dawn spread over the mountains, a great and mighty people comes. Nothing like it has ever been from of old, and after it there will not again be any[c][b], through the years of generation after generation.
translation:
  language: zh_hans
  text: 这是黑暗、幽暗的日子，是乌云、浓重黑暗的日子；一大而强盛的民众，如晨光般铺展在群山之上，来到。[a]自古以来，从未有过这样的；此后直到世世代代，也不会再有。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如晨光”也有译作“如黑暗”的；后者把 שַׁחַר 取作较罕见的“黑色”之义。这里采用其通常的“晨光”之义，描绘来势迅速铺满山岭。“浓重黑暗”所译 עֲרָפֶל 也可指浓密、遮蔽的暗云。这里的“民众”可能指以军事语言描写的蝗群、人类军队，或两种意象有意交融。
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: “直到世世代代”直译为“直到一代又一代的年岁”，表示在绵延的后世中都不会再有。
    reason: idiom
lexical_decisions:
- source_word: י֧וֹם
  choice: 日子
  rationale: 保留原文两次重复的基本时间名词和先知宣告的节奏。
- source_word: חֹ֣שֶׁךְ וַאֲפֵלָ֗ה
  choice: 黑暗、幽冥
  rationale: 前者是一般的黑暗，后者语气更强；“幽冥”在庄重语体中传达深沉阴暗，并保留递进。
- source_word: י֤וֹם עָנָן֙ וַעֲרָפֶ֔ל
  choice: 密云、浓雾的日子
  rationale: עָנָן 指云，עֲרָפֶל 指遮蔽视线的浓密云雾或幽暗；译文以自然汉语呈现阴沉、遮蔽的景象。
- source_word: כְּשַׁ֖חַר
  choice: 如晨光
  rationale: שַׁחַר 的通常意义是黎明或晨光，与“铺展在群山之上”的意象自然衔接；较罕见的“黑色”义留在脚注。
- source_word: פָּרֻ֣שׂ עַל הֶהָרִ֑ים
  choice: 铺展在群山之上
  rationale: 被动分词表示延展开来；“铺展”保留覆盖山岭的视觉意象。
- source_word: עַ֚ם רַ֣ב וְעָצ֔וּם
  choice: 一支庞大而强盛的民众
  rationale: עַם 直译为民或民众，不径自限定为军队；רַב 在这里兼有数量众多和规模庞大之意，עָצוּם 表示强盛有力。量词“一支”提示其作为整体推进，同时不消除其究竟是蝗群、军队或复合意象的含混。
- source_word: כָּמֹ֗הוּ לֹ֤א נִֽהְיָה֙ מִן הָ֣עוֹלָ֔ם
  choice: 自古以来，从未有过这样的
  rationale: מִן־הָעוֹלָם 在此表示自远古以来；代词整体回指前述民众或灾难景象，故用中性的“这样的”。
- source_word: עַד שְׁנֵ֖י דּ֥וֹר וָדֽוֹר
  choice: 直到世世代代
  rationale: 字面为“直到一代又一代的年岁”，是表示延续到无数后代的习语；采用自然且庄重的汉语表达。
theological_decisions:
- issue: “庞大而强盛的民众”的身份
  choice: 按原文泛称“民众”，不明确指定其为蝗群或人类军队。
  alternative: 可理解为以军事语言描写的蝗群、人类入侵军队，或两者有意交融的先知性意象。
  rationale: 本节使用 עַם“民众”，而上下文具有蝗灾与军事推进相互交织的特征；译文保留这种解释张力，不以特定神学框架消解它。
- issue: “如晨光”与全节黑暗意象的张力
  choice: 采用 שַׁחַר 的常用义“晨光”。
  alternative: 按较罕见的词义理解为“黑色／黑暗”，译作“如黑暗铺展在群山之上”。
  rationale: 常用词义及“铺展在群山之上”的搭配支持“晨光”；即使与黑暗背景形成反差，也不应仅为协调意象而改取罕见义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留希伯来诗句中“日子”的复沓和成对黑暗意象。正文避免把 עַם 直接解释成“军队”或“蝗群”；脚注交代主要词义与意象歧义。所有脚注标记均已在正文出现。
