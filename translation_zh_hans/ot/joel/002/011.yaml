  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה נָתַ֤ן קוֹל/וֹ֙ לִ/פְנֵ֣י חֵיל֔/וֹ כִּ֣י רַ֤ב מְאֹד֙ מַחֲנֵ֔/הוּ כִּ֥י עָצ֖וּם עֹשֵׂ֣ה דְבָר֑/וֹ כִּֽי גָד֧וֹל יוֹם יְהוָ֛ה וְ/נוֹרָ֥א מְאֹ֖ד וּ/מִ֥י יְכִילֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/011.yaml
  text: And Yahweh gives his voice before his army[a], for his camp is exceedingly great; for mighty is the one who does his word[c][b]. For the day of Yahweh is great and exceedingly dreadful—who can endure it?
translation:
  language: zh_hans
  text: 耶和华在他的军队前发声[a]，因为他的军营极其庞大；那执行他话语的极其强大[b]。耶和华的日子伟大而极其可畏，谁能承受得住呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“给出他的声音”，也可译作“发出声音”或“扬声”。
    reason: 说明希伯来语表达的字面形式及自然中文替代译法。
  - marker: b
    text: “他话语”在这里也可理解为“他的命令”。
    reason: דָּבָר基本义为“话、事情”，在此语境中可含命令之意，但正文保留较宽的词义。
lexical_decisions:
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名的通行音译，并保留其专名性质。句首连接词在中文中不硬译，以免行文生硬。
- source_word: נָתַן קוֹלוֹ
  choice: 发声
  rationale: 原文直译为“给出他的声音”；“发声”既自然，又保留耶和华在军队前发出号令般声音的图景。
- source_word: לִפְנֵי חֵילוֹ
  choice: 在他的军队前
  rationale: חַיִל在上下文中指有组织的军事力量；“军队”清楚而不预断它究竟是蝗群、人类军队，还是兼有二者的意象。
- source_word: כִּי רַב מְאֹד מַחֲנֵהוּ
  choice: 因为他的营阵极其庞大
  rationale: מַחֲנֶה可指营地，也可转指驻营的军旅。“营阵”兼顾驻营和军势意象；“极其庞大”保留רַב מְאֹד在规模或数量上的开放性。
- source_word: כִּי עָצוּם עֹשֵׂה דְבָרוֹ
  choice: 执行他话语的，大有能力
  rationale: 保留单数分词“执行……的”及דָּבָר的基本义“话语”；“执行”表达此处按所说之话采取行动的含义，而不把דָּבָר直接窄化为“命令”。
- source_word: כִּי גָדוֹל יוֹם יְהוָה
  choice: 耶和华的日子伟大
  rationale: 保留先知文学中的固定表达“耶和华的日子”；“伟大”对应גָּדוֹל，并未先行解释为单纯的规模、重要性或灾难性。
- source_word: וְנוֹרָא מְאֹד
  choice: 而极其可畏
  rationale: נוֹרָא表示令人敬畏或恐惧；在审判语境中“可畏”兼有威严与可怕之意，不将其简化为单一情绪。
- source_word: וּמִי יְכִילֶנּוּ
  choice: 谁能承受得住呢？
  rationale: 该动词在此表示有能力忍受或抵挡，宾语后缀指前述“耶和华的日子”；“承受得住”是自然且有力度的现代中文。
theological_decisions:
- issue: “他的军队”和“他的营阵”所指为何
  choice: 译文只表明这支力量属于耶和华并在他号令之下，不进一步界定其性质。
  alternative: 明确解释为蝗群，或明确解释为人类军队。
  rationale: 所有格后缀及“执行他话语的”都表明这支力量受耶和华支配，但本节本身没有要求译者排除蝗灾、人类军队或双重意象中的任何一种。
- issue: עֹשֵׂה דְבָרוֹ的主体
  choice: 保留“执行他话语的”这一形式，使其既可指一个执行者，也可具有集合意义。
  alternative: 明确译为复数“执行他命令的人们”，或直接认定为整支军队。
  rationale: 希伯来文使用单数分词，但上下文涉及庞大的营阵；不在翻译中消除这种语法形式与集体语境之间的张力。
- issue: “耶和华的日子”的性质
  choice: 保留“伟大而极其可畏”的并列描述。
  alternative: 将其解释性地译成“伟大而可怕的审判日”。
  rationale: 上下文显然具有审判和威吓色彩，但原文没有在该短语中加入“审判”一词；直保其表述可避免加入超出本节的限定。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“营阵”“可畏”保留先知诗歌的凝练与威严；整体句式尽量贴近希伯来文的因果推进，同时通过中文标点避免生硬堆叠。
