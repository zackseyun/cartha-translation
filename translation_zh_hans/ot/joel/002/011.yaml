  to: 耶和华在他的军队前发声[a]，因为他的军营极其庞大；那执行他话语的极其强大[b]。耶和华的日子伟大而极其可畏，谁能承受得住呢？
  rationale: 仅作安全的中文表达修订：“营阵”改为常用且语义清楚的“军营”；调整“执行他话语的”所在分句，使中文句法自然，同时保留原文单数执行者、军营与军队的区分，以及“话语”可能含命令的语义空间。
