source:
  edition: WLC
  text: אֵלֶ֥י/ךָ יְהוָ֖ה אֶקְרָ֑א כִּ֣י אֵ֗שׁ אָֽכְלָה֙ נְא֣וֹת מִדְבָּ֔ר וְ/לֶ֣הָבָ֔ה לִהֲטָ֖ה כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/019.yaml
  text: To you[a], O Yahweh, I call, for fire has devoured the pastures of the wilderness[c][b], and flame has scorched all the trees of the field.
translation:
  language: zh_hans
  text: '耶和华啊，我向你呼求，

    因为火吞噬了旷野的草场，

    烈焰烧焦了田野所有的树木。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词 אֶל 加第二人称单数阳性后缀表示呼求所朝向的对象；“向你”符合现代汉语祷告语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，避免用头衔替代原文中的专名。
- source_word: אֶקְרָא
  choice: 我呼求
  rationale: קרא 的 Qal 未完成式第一人称单数在哀诉和祷告语境中表示呼喊求告；“呼求”兼顾其强烈语气和自然中文表达。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出先知呼求的原因；“因为”在现代汉语中关系明确而自然。
- source_word: אֵשׁ אָכְלָה
  choice: 火吞噬了
  rationale: אכל 字面为“吃”，用于火时构成强烈的毁灭性隐喻；“吞噬”保留原文形象。
- source_word: נְאוֹת מִדְבָּר
  choice: 旷野的草场
  rationale: נְאוֹת 在农业语境中指牧场或放牧之地，מִדְבָּר 指旷野、开阔荒地；“旷野的草场”准确且易懂。
- source_word: וְלֶהָבָה
  choice: 烈焰
  rationale: לֶהָבָה 指火焰；“烈焰”自然体现下句 לִהֲטָה 所含的炽烈灼烧意味，并与上句“火”形成诗歌平行。
- source_word: לִהֲטָה
  choice: 烧焦了
  rationale: להט 表示猛烈燃烧或灼烧；“烧焦”保留毁坏的结果，也避免与前句“吞噬”重复。
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: 田野所有的树木
  rationale: כָּל 加复数名词表示全部，הַשָּׂדֶה 指田野或野外土地；该译法贴近原文并符合中文语序。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用上帝的专名而非头衔。正文采用中文圣经传统中最通行、普通读者最易识别的专名“耶和华”，既保留其专名性质，也不以“主”替代。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，并按希伯来诗歌的两个因果分句分行。保留“火吞噬”这一拟人化隐喻，以及“火／烈焰”“草场／树木”的平行结构。
