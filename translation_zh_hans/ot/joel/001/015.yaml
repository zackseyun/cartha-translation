  text: אֲהָ֖הּ לַ/יּ֑וֹם כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה וּ/כְ/שֹׁ֖ד מִ/שַׁדַּ֥י יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/015.yaml
  text: Alas for the day! For the day of Yahweh is near[a], and it comes like destruction from the Almighty.
translation:
  language: zh_hans
  text: 哀哉，这日子！因为雅威的日子临近了；它来到，如同从全能者而来的毁灭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文“毁灭”（shod）与“全能者”（Shaddai）音近，构成双关。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ לַיּוֹם
  choice: 哀哉，这日子！
  rationale: אֲהָהּ 是表达悲痛与惊惧的哀叹词，לַיּוֹם 在此说明所哀叹的对象；译文力求保留先知呼喊的力度，同时使用庄重而自然的现代汉语。
- source_word: כִּי קָרוֹב יוֹם יְהוָה
  choice: 因为耶和华的日子临近了
  rationale: כִּי 引出哀叹的原因；קָרוֹב 是表语形容词，指日子已经迫近；יוֹם יְהוָה 保留为先知书中的固定表达“耶和华的日子”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，区别于称号“主”。
- source_word: וּכְשֹׁד
  choice: 它必如毁灭
  rationale: כְּ 表示比拟，שֹׁד 指猛烈的毁坏或灾祸；补出“它”承接“耶和华的日子”，使中文句法清楚。“必”表达未完成式在此所含的将来性与确定性。
- source_word: מִשַׁדַּי יָבוֹא
  choice: 从全能者那里来到
  rationale: מִן 表示来源，שַׁדַּי 采用传统且语义清楚的“全能者”；יָבוֹא 表示这日子将要来到。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文圣经传统中通行且普通读者易识别的“耶和华”，而不以“主”这一称号替代专名。
- issue: מִשַׁדַּי 与 שֹׁד 的关系
  choice: 正文译作“毁灭……全能者”，脚注说明谐音
  alternative: 将 שַׁדַּי 音译为“沙代”，以较明显地呈现原文声音联系
  rationale: 原文很可能借 שֹׁד 与 שַׁדַּי 的近似音构成双关。正文优先准确传达两词的通常意义，脚注保留无法自然移植到中文的文字效果。
- issue: יָבוֹא 的时间与语气
  choice: 它必……来到
  alternative: 它正……来到
  rationale: 未完成式在“临近了”的语境中既可凸显即将发生，也带有先知宣告的确定性；“必……来到”保留将来指向而不把它改写成已经进行中的事件。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“哀哉”保留先知哀歌式的呼喊；后半句略作显性衔接，以免中文误将“毁灭”理解为句子的主语来源。脚注标记置于相关整句之后。
