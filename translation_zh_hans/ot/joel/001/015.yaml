    rationale: “它必如毁灭，从全能者那里来到”将比拟结构和来源短语拆开，读者可能误解“从全能者那里”直接修饰“来到”。改作“它来到，如同从全能者而来的毁灭”更清楚地表达“像来自全能者的毁灭一样来到”。
  revised_text: 哀哉，这日子！因为雅威的日子临近了；它来到，如同从全能者而来的毁灭。[a]
