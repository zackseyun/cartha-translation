  yaml_path: translation/ot/joel/001/017.yaml
  text: The seeds have shriveled beneath their clods[a]; the storehouses are desolate, the granaries are torn down[b], because the grain has dried up.
translation:
  language: zh_hans
  text: 种子[a]在土块[b]底下干瘪了；仓房荒凉，粮仓被拆毁，因为谷物枯干了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “种子”所译的希伯来词很罕见，含义不确定；也可能指“谷粒”或“种粒”。
    reason: lexical_alternative
  - marker: b
    text: “土块”所译的希伯来词也不确定。这里依照农业语境译作“土块”；也有人译作“犁沟”，甚至“锄头”或“铲子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְשׁוּ
  choice: 干瘪了
  rationale: 该动词表示干枯、萎缩；用于埋在土中的种子，“干瘪了”自然且形象。
- source_word: פְרֻדוֹת
  choice: 种子
  rationale: 这是罕见且含义不确定的词；按农业语境，最可能指种粒或谷粒。“种子”清楚易懂，又不过度限定。
- source_word: תַּחַת
  choice: 在……底下
  rationale: 表达标准的空间关系，符合种子埋在土块之下的图景。
- source_word: מֶגְרְפֹתֵיהֶם
  choice: 土块
  rationale: 此词罕见且释义有争议；结合“在……底下”及播种语境，理解为覆盖种子的土块较为连贯，但以脚注保留其他可能。
- source_word: נָשַׁמּוּ
  choice: 荒废
  rationale: 描述仓房因无收成而空置败落的状态；“荒废”简洁自然。
- source_word: אֹצָרוֹת
  choice: 仓房
  rationale: 在农业语境中指储藏农产品的房舍，而非财宝库。
- source_word: נֶהֶרְסוּ
  choice: 拆毁
  rationale: 该动词表示被拉倒、毁坏；“拆毁”保留被动结果的建筑性意象。
- source_word: מַמְּגֻרוֹת
  choice: 粮仓
  rationale: 指储存谷物的设施；“粮仓”在现代汉语中准确而通俗。
- source_word: כִּי
  choice: 因为
  rationale: 这里取因果义，说明仓储设施荒废毁坏的原因。
- source_word: הֹבִישׁ
  choice: 枯干了
  rationale: 在此农业语境中表示庄稼因干枯而败坏；“枯干了”既传达作物失败，也呼应灾情。
- source_word: דָּגָן
  choice: 五谷
  rationale: 泛指田间谷物或谷物收成；“五谷”是自然庄重的汉语统称，并非限定为五种具体作物。
