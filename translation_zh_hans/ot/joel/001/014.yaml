  text: קַדְּשׁוּ צוֹם֙ קִרְא֣וּ עֲצָרָ֔ה אִסְפ֣וּ זְקֵנִ֗ים כֹּ֚ל יֹשְׁבֵ֣י הָ/אָ֔רֶץ בֵּ֖ית יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/זַעֲק֖וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/014.yaml
  text: Consecrate a fast; call a solemn assembly. Gather the elders[a], all the inhabitants of the land, to the house of Yahweh your God, and cry out to Yahweh.
translation:
  language: zh_hans
  text: 要将禁食分别为圣；要宣告举行严肃会。召集长老和这地所有的居民，到雅威你们上帝的殿里，向雅威呼求！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדְּשׁוּ צוֹם
  choice: 把禁食分别为圣
  rationale: 保留קדשׁ所表达的神圣、分别出来的礼仪含义，同时避免把原文没有明说的“日子”加入正文。
- source_word: קִרְאוּ עֲצָרָה
  choice: 宣告召开严肃会
  rationale: קרא在这里有宣告、召集之意；עֲצָרָה指为敬拜而举行的庄严集会。“严肃会”保留其礼仪性和郑重语气。
- source_word: אִסְפוּ זְקֵנִים
  choice: 招聚众长老
  rationale: אסף是聚集、招聚；זקנים在此更可能指群体中的长老，而不只是年老的男子。
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: 这地所有的居民
  rationale: הָאָרֶץ既可指当地之地，也可指全地或大地；本段以圣殿为中心召集犹大居民，因此正文采用较符合语境的地方性含义，并以脚注保留另一可能。
- source_word: בֵּית יְהוָה אֱלֹהֵיכֶם
  choice: 到雅威你们上帝的殿里
  rationale: 原文虽未在“殿”前明列介词，但“招聚”自然包含目的地；中文补出“到……里”以清楚表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之上帝专名的性质。
- source_word: וְזַעֲקוּ אֶל יְהוָה
  choice: 向雅威呼求
  rationale: זעק表示在危急中发出的强烈呼喊；“呼求”兼顾其情感力度和向上帝求告的方向。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”，既保留专名性质，也避免以称号“主”代替；“耶和华”是传统汉译音写，但与通常重建的读音距离较大。
- issue: הָאָרֶץ的范围
  choice: 这地
  alternative: 全地；大地
  rationale: 上下文是以雅威之殿为中心的地方性、群体性召集，故“这地”更合适；但希伯来词本身可有更广范围，因此不排除另一理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；平行使用“要把……、宣告……、招聚……、呼求”，保留原文连续命令的急迫感。
