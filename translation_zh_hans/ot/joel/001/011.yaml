  text: הֹבִ֣ישׁוּ אִכָּרִ֗ים הֵילִ֨ילוּ֙ כֹּֽרְמִ֔ים עַל חִטָּ֖ה וְ/עַל שְׂעֹרָ֑ה כִּ֥י אָבַ֖ד קְצִ֥יר שָׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/011.yaml
  text: Be ashamed[a], farmers; wail, vinedressers, over the wheat and over the barley[b], because the harvest of the field has perished.
translation:
  language: zh_hans
  text: 农夫们哪，羞愧吧[a]；葡萄园工人哪，要为小麦和大麦哀号[b]，因为田野的收成已经毁了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要惊惶”或“要蒙羞”。希伯来语动词可指内心的羞愧或惊惶，也可指公开蒙羞；正文保留直接命令的语气。
    reason: lexical_alternative
  - marker: b
    text: 或译“号哭”。希伯来语动词指因悲痛而发出大声哭号。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: 要羞愧
  rationale: 该词是בוש的使役主动命令式复数，可表达蒙羞、羞愧，也可能侧重惊惶失措。译作“要羞愧”保留直接命令语气及与“哀号”并列的强烈情感，同时用脚注保留歧义。
- source_word: אִכָּרִים
  choice: 农夫
  rationale: 指耕作土地的农业劳动者；“农夫”简洁、自然，也符合下文小麦和大麦的语境。
- source_word: הֵילִילוּ
  choice: 要哀号
  rationale: ילל的命令式复数，指因悲痛而大声哭号；“哀号”既保留声音强度，也适合庄重的先知话语。
- source_word: כֹּרְמִים
  choice: 葡萄园工人
  rationale: 字面指照料葡萄园的人。“葡萄园工人”比“修理葡萄园的人”简洁，也较普通读者易懂。
- source_word: עַל
  choice: 为……悲哀
  rationale: 此处引出哀恸的对象或缘由。汉语若直译为“在……之上”不自然，结合前面的哀号补出“悲哀”，清楚表达其功能。
- source_word: חִטָּה וְעַל שְׂעֹרָה
  choice: 小麦和大麦
  rationale: 分别采用这两个谷物名称的标准现代汉语译法；重复的介词在汉语并列结构中无需机械重现。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出前述命令的原因，符合现代汉语因果表达。
- source_word: אָבַד
  choice: 已经毁了
  rationale: אבד的完成式表示收成已丧失、毁坏的结果状态。“已经毁了”自然地传达损失的严重性，又不额外指定毁坏者。
- source_word: קְצִיר שָׂדֶה
  choice: 田间的收成
  rationale: 该组合表示田地所出的收获。“田间的收成”比“田地的收割”更符合这里已经丧失的农作物成果之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用两次呼语和两个命令句保留原文的先知性召唤与平行结构；“悲哀”是根据介词עַל在哀恸语境中的功能补出，使汉语通顺。
