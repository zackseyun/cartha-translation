  text: כִּֽי גוֹי֙ עָלָ֣ה עַל אַרְצִ֔/י עָצ֖וּם וְ/אֵ֣ין מִסְפָּ֑ר שִׁנָּי/ו֙ שִׁנֵּ֣י אַרְיֵ֔ה וּֽ/מְתַלְּע֥וֹת לָבִ֖יא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/006.yaml
  text: For a nation has come up against my land[a], mighty and without number; its teeth are the teeth of a lion[b], and it has the fangs of a lioness.
translation:
  language: zh_hans
  text: 因为有一国[a]上来攻击我的土地；它强大，数不胜数。它的牙齿像狮子的牙齿；它的利齿像猛狮[b]的利齿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一族人”。希伯来语 גוי 通常意为“国、民族、民众”；这里作为入侵者的比喻性称呼，在上下文中描绘灾害如同来犯者。
    reason: lexical_alternative
  - marker: b
    text: 或译“母狮”，也可只译“狮子”。希伯来语 לָבִיא 可指强壮、成熟的狮子，性别未必确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的呼吁，为哀哭和警告说明缘由；保留希伯来语的解释或因果作用。
- source_word: גוֹי
  choice: 一国
  rationale: 原词通常指“国、民族、民众”，这里把灾害描绘成入侵的国家；保留军事化隐喻，不直接改译为“蝗群”。
- source_word: עָלָה עַל
  choice: 上来侵袭
  rationale: 兼顾“上来/上到”的原有动向和敌对进犯的语境，较单译“入侵”更能保留希伯来语意象。
- source_word: אַרְצִי
  choice: 我的土地
  rationale: 明确保留第一人称单数所属后缀；“土地”自然且保有领土意味。
- source_word: עָצוּם
  choice: 强盛无比
  rationale: 表达来犯者强大可畏；在现代汉语中庄重有力。
- source_word: וְאֵין מִסְפָּר
  choice: 数不胜数
  rationale: 自然表达其数量无法计算、不可胜数。
- source_word: שִׁנָּיו
  choice: 它的牙齿
  rationale: 希伯来语以阳性单数回指集合性的“国”；汉语用“它”适合此非人化、比喻性的来犯者。
- source_word: שִׁנֵּי אַרְיֵה
  choice: 如狮子的牙齿
  rationale: 清楚保留狮子牙齿的比拟和诗性平行。
- source_word: מְתַלְּעוֹת
  choice: 獠牙
  rationale: 该词指用于撕咬吞食的颌齿；“獠牙”在现代汉语中最能传达凶猛的捕食意象。
- source_word: לָבִיא
  choice: 猛狮
  rationale: 该词可泛指强壮、成熟的狮子，性别并不确定；“猛狮”保留力量意味，也避免把有争议的“母狮”义写死。
- source_word: לוֹ
  choice: 它的
  rationale: 介词加代词后缀表达领有关系；结合汉语平行句式译作“它的……如……的……”。
theological_decisions:
- issue: 来犯之“国”的隐喻所指
  choice: 正文保留“一国”，让蝗灾如敌军入侵的先知性隐喻自行成立。
  alternative: 明译为“蝗群”或“蝗虫大军”。
  rationale: 原文明确使用 גוי“国、民族”；将其直接解释为蝗群会削弱原文刻意保留的隐喻张力。
- issue: לָבִיא 的狮类性别或类别
  choice: 译为“猛狮”，强调成熟强健而不指定性别。
  alternative: 译为“母狮”或一般的“狮子”。
  rationale: 该词的确切动物学侧重存在词义空间；正文不应无根据地限定为雌性，脚注保留常见替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“一国上来侵袭”保留原文的上行动向和军事隐喻；后半节用对称句式再现牙齿与獠牙的诗性平行。所有脚注标记均已置于正文相应位置。
