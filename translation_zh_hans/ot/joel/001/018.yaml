  text: מַה נֶּאֶנְחָ֣ה בְהֵמָ֗ה נָבֹ֨כוּ֙ עֶדְרֵ֣י בָקָ֔ר כִּ֛י אֵ֥ין מִרְעֶ֖ה לָ/הֶ֑ם גַּם עֶדְרֵ֥י הַ/צֹּ֖אן נֶאְשָֽׁמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/018.yaml
  text: How the animals groan! The herds of cattle wander in confusion[a], because there is no pasture for them[b]; even the flocks of sheep suffer.
translation:
  language: zh_hans
  text: 牲畜何等哀鸣！牛群茫然失措[a]，因为没有草场可供它们吃草；连羊群也受苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“困惑”“陷入混乱”。
    reason: lexical_alternative
  - marker: b
    text: “受苦”所译的希伯来语动词也可有“担当罪责”“被定为有罪”或“受罚”的意味；这里可能指羊群承受灾害的后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נֶּאֶנְחָה
  choice: 何等哀鸣
  rationale: מַה在此为感叹用法，不是疑问词；“哀鸣”表达牲畜因灾害而发出的痛苦声音。
- source_word: בְהֵמָה
  choice: 牲畜
  rationale: 这是集合名词，泛指家畜；下文另明确提到牛群和羊群，因此不宜窄化为“牛”。
- source_word: נָבֹכוּ
  choice: 困惑乱走
  rationale: 兼顾该词“迷乱、困惑”的核心含义和缺少草场时四处乱走的具体情景，同时以脚注保留较静态的译法。
- source_word: עֶדְרֵי בָקָר
  choice: 牛群
  rationale: 自然简洁地表达该名词组合，所指明确。
- source_word: כִּי אֵין מִרְעֶה לָהֶם
  choice: 因为没有草场可供它们吃草
  rationale: 保留כִּי的因果关系，并将מִרְעֶה所指的放牧地用现代汉语自然表达。
- source_word: גַּם
  choice: 连……也
  rationale: 体现递进和加强哀叹的语气。
- source_word: עֶדְרֵי הַצֹּאן
  choice: 羊群
  rationale: 在中文中“羊群”已自然表达群体意义，无须重复译作“成群的羊”。
- source_word: נֶאְשָׁמוּ
  choice: 受苦
  rationale: 此处语境是牲畜承受灾害；主文采用中性而自然的“受苦”，脚注保留该希伯来动词可能具有的罪责、担责或受罚色彩，避免直接断定羊具有道德罪责。
theological_decisions:
- issue: נֶאְשָׁמוּ用于羊群时是否表示道德罪责或司法性惩罚
  choice: 主文译作“受苦”，表示羊群承受灾害后果
  alternative: “担当罪责”“被定为有罪”或“受惩罚”
  rationale: 该动词可带罪责或司法意味，但这里的主语是羊群，直接译为有罪会作出经文未明确作出的道德判断；脚注保留原词张力，而不在主文中将其完全司法化。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“何等哀鸣”保留先知哀歌的感叹力度；“困惑乱走”使牛群无草可吃的景象具体可感。主文与两个脚注标记[a]、[b]完全对应。
