id: JOL.1.16
reference: Joel 1:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/ל֛וֹא נֶ֥גֶד עֵינֵ֖י/נוּ אֹ֣כֶל נִכְרָ֑ת מִ/בֵּ֥ית אֱלֹהֵ֖י/נוּ שִׂמְחָ֥ה וָ/גִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/016.yaml
  text: Is not food cut off before our eyes[b][a], joy and gladness from the house of our God?
translation:
  language: zh_hans
  text: 食物不是在我们眼前被断绝了吗？喜乐和欢腾不是也从我们上帝的殿中消失了吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 引出期待肯定回答的反问；现代汉语用“不是……吗”自然保留其反问语气。
- source_word: נֶגֶד עֵינֵינוּ
  choice: 在我们眼前
  rationale: 保留事情公开发生、众人亲眼目睹的鲜明意象。
- source_word: אֹכֶל
  choice: 食物
  rationale: 该词泛指食物，并非专指饼；这里与农业灾荒的语境相符。
- source_word: נִכְרָת
  choice: 被断绝
  rationale: 保留 כרת 被动式“被切断、被断绝”的具体力度，也避免弱化审判语汇可能具有的回响。
- source_word: מִבֵּית אֱלֹהֵינוּ
  choice: 从我们上帝的殿中
  rationale: 原文直译为“从我们上帝的家中”，在此明确指圣殿；汉语以“殿”表达该所指较自然，同时不加入额外的宗派含义。
- source_word: שִׂמְחָה
  choice: 喜乐
  rationale: 常用且庄重，适合表达敬拜群体中的欢乐。
- source_word: וָגִיל
  choice: 欢腾
  rationale: 比一般的“快乐”更能体现该词所含的踊跃、欢欣之意，并保留与“喜乐”构成的诗歌性近义并列。
theological_decisions:
- issue: 反问句是否统摄两个并列的损失
  choice: 将两小句都译作反问，并在第二句补出“不是也……消失了吗”
  alternative: 只在第一小句保留反问，第二小句作为省略谓语的并列短语：“喜乐和欢腾也从我们上帝的殿中被断绝。”
  rationale: 希伯来诗歌第二小句省略已出现的谓语很常见。汉语补出反问结构，清楚表达食物以及圣殿中的喜乐、欢腾都已止息，同时不把两者解释成因果或同位关系。
- issue: “上帝的家”是保留字面表达还是明示圣殿所指
  choice: 正文译为“我们上帝的殿”
  alternative: “我们上帝的家”
  rationale: 此处语境涉及供物和敬拜，所指是圣殿。现代汉语的“上帝的家”也可能被理解为家庭或信徒群体，因此“殿”更准确自然；原文的字面形式可由翻译说明交代，但本节无需脚注即可清楚传意。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用两个相互呼应的反问句呈现希伯来诗歌中的省略和平行结构；“喜乐和欢腾”保留近义词叠用及第二词较强烈的欢欣色彩。
