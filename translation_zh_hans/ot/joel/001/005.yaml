base_translation:
  language: en
  yaml_path: translation/ot/joel/001/005.yaml
  text: Wake up[a], you drunkards, and weep; wail, all you drinkers of wine, over the sweet wine, because it has been cut off from your mouth.
translation:
  language: zh_hans
  text: 醉酒的人哪，醒来吧，哭泣吧！所有喝酒的人哪，要为甜酒[a]哀号，因为它已经从你们口中断绝了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“新酒”或“鲜酒”。希伯来语 עָסִיס 可指鲜榨、甘甜的葡萄酒。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָקִיצוּ
  choice: 要醒来
  rationale: 该复数命令式表示从睡眠或昏沉中醒来；“醒来”保留先知直接唤醒听众的语气，也与醉酒者的状态形成呼应。
- source_word: שִׁכּוֹרִים
  choice: 你们醉酒的人
  rationale: 复数形容词在此作呼语，可指醉酒者或惯常沉醉的人；此译法直接自然，同时避免把习惯性含义说得过死。
- source_word: וּבְכוּ
  choice: 哭泣
  rationale: בכה是哀伤哭泣的常用动词；“哭泣”符合本段哀悼语境。
- source_word: וְהֵילִלוּ
  choice: 哀号
  rationale: ילל表示强烈、出声的哀哭；“哀号”比“哭泣”更强，保留原文两个哀悼动词的递进和区别。
- source_word: כָּל שֹׁתֵי יָיִן
  choice: 所有喝酒的人哪
  rationale: 分词结构描述以饮酒为特征的人，且在句中具有呼语作用；句末“哪”自然传达直接呼告。
- source_word: עַל
  choice: 要为
  rationale: 此处引出哀号的对象或缘由；“为”在中文中能自然表达“因……而哀号”。
- source_word: עָסִיס
  choice: 甜酒
  rationale: 该词指鲜榨、甘甜的葡萄酒或新酒；“甜酒”清楚传达其可饮用且甘美的特征，而脚注保留“新酒、鲜酒”的可能译法。
- source_word: נִכְרַת
  choice: 已经……断绝了
  rationale: כרת的尼法勒完成式表示被剪除、断绝，并带有现今仍持续的结果；“已经……断绝了”保留这种完成及结果状态。
- source_word: מִפִּיכֶם
  choice: 从你们口中
  rationale: 按原文直译为“从你们的口中”，保留酒被夺去、无法入口的鲜明图像。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可朗读的中文。以两个感叹句呈现连续命令和先知式呼告；“哭泣”与“哀号”分别对应两个强度不同的希伯来语哀悼动词。脚注标记置于其实际说明的“甜酒”之后。
