language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּם בַּהֲמ֥וֹת שָׂדֶ֖ה תַּעֲר֣וֹג אֵלֶ֑י/ךָ כִּ֤י יָֽבְשׁוּ֙ אֲפִ֣יקֵי מָ֔יִם וְ/אֵ֕שׁ אָכְלָ֖ה נְא֥וֹת הַ/מִּדְבָּֽר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/020.yaml
  text: Even the beasts of the field pant for you[a], because the channels of water have dried up[c][b], and fire has consumed the pastures of the wilderness.
translation:
  language: zh_hans
  text: 连田野的走兽也向你喘息[a]，因为水道[b]都干涸了，火也吞噬了旷野的草场[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喘息”也含有因干渴而切望的意思；原文直译为“向你喘息”。
    reason: lexical_alternative
  - marker: b
    text: “水道”或译“溪流”“河床”。
    reason: lexical_alternative
  - marker: c
    text: “草场”或译“牧放之地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 连……也
  rationale: 置于句首表示递进和强调：受灾的不只是人，连田野的动物也陷入绝境。
- source_word: בַּהֲמוֹת שָׂדֶה
  choice: 田野的走兽
  rationale: 该词组泛指野外或田间的动物，并非仅指家畜；“走兽”简洁、自然，也保留经文意象。
- source_word: תַּעֲרוֹג אֵלֶיךָ
  choice: 向你喘息
  rationale: ערג兼有因干渴而喘息和渴慕之意，אֵלֶיךָ明确表示朝向第二人称单数对象；此译保留动物生理上的干渴及其转向上帝的双重意象。
- source_word: יָבְשׁוּ אֲפִיקֵי מָיִם
  choice: 水道都干涸了
  rationale: אֲפִיקֵי מָיִם可指水道、河床或溪流；“水道”贴近原文且适合干旱语境，“干涸了”表达完成动作所造成的当前结果。
- source_word: וְאֵשׁ אָכְלָה
  choice: 火也吞噬了
  rationale: 原文以“吃”描写烈火毁灭；“吞噬”在现代汉语中自然地保留这一强烈拟人意象。
- source_word: נְאוֹת הַמִּדְבָּר
  choice: 旷野的草场
  rationale: נְאוֹת在此指供牲畜吃草之地，הַמִּדְבָּר指未耕种的旷野或草原地带；该译准确呈现被火烧毁的牧草地。
theological_decisions:
- issue: אֵלֶיךָ中第二人称单数所指
  choice: 译作“向你”，按上下文理解为向上帝
  alternative: 弱化为动物因干渴而哀鸣，不明确其朝向上帝
  rationale: 希伯来文明确使用带方向意义的第二人称阳性单数形式，且本节延续前文对上帝的呼求。因此保留直接称呼，同时不进一步解释动物如何有意识地向上帝呼求。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“向你喘息”略带诗性，但忠实保留原文中身体干渴与朝向上帝的张力；“水道”“旷野的草场”则兼顾希伯来地貌意象与中文可读性。
