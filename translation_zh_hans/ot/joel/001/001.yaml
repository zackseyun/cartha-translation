  text: The word of Yahweh that came to Joel son of Pethuel[a][b].
translation:
  language: zh_hans
  text: 耶和华的话临到毗土珥的儿子约珥[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华的话”也可译作“耶和华的信息”。
    reason: lexical_alternative
  - marker: b
    text: 原文为YHWH（四字神名）；也常音译作“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר
  choice: 话
  rationale: 该词为构造形式，与神名连用，构成先知书常见的启示公式。“话”既保留原文的形式联系，也符合现代汉语圣经语体；“信息”虽可表达含义，却更具解释性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文直接使用四字神名YHWH。中文采用通行已久的音译“耶和华”，保留其作为专名的性质，而不以“主”这一称号替代。
- source_word: אֲשֶׁר הָיָה אֶל
  choice: 临到
  rationale: 这是引介先知领受启示的固定表达。“临到”在庄重而自然的现代中文圣经语体中准确传达神的话向先知而来。
- source_word: יוֹאֵל
  choice: 约珥
  rationale: 按现代中文圣经传统音译该人名。
- source_word: בֶּן
  choice: 儿子
  rationale: 直接表达父子谱系关系，符合原文，也自然连接两个专名。
- source_word: פְּתוּאֵל
  choice: 毗土珥
  rationale: 按现代中文圣经传统音译该人名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名而非称号。正文采用中文读者最熟悉的专名音译“耶和华”，脚注同时说明其希伯来文字母形式及另译，以避免把传统读音视为无争议的原始发音。
translation_notes:
  register: 采用庄重、简洁、现代且易懂的先知书引言语体。“耶和华的话临到……”保留希伯来文启示公式；人名沿用现代简体中文圣经中的通行译名。
