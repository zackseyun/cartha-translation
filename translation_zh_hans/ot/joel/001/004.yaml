  register: 采用庄重而自然的现代标准汉语，保留原文三段平行、逐层吞尽的句式。“剪虫”“群蝗”“蝻虫”“吞噬之蝗”用于区分四个希伯来语名称；脚注明确这些名称的精确所指仍有不确定性。
