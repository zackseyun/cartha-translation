base_translation:
  language: en
  yaml_path: translation/ot/joel/001/004.yaml
  text: What the cutting locust left[a], the swarming locust ate; and what the swarming locust left, the hopping locust ate; and what the hopping locust left, the devouring locust ate.
translation:
  language: zh_hans
  text: 啃食蝗虫留下的，群蝗吃了；群蝗留下的，跳蝗吃了；跳蝗留下的，吞食蝗虫吃了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里四个希伯来语名称可能指不同种类或不同生长阶段的蝗虫，但其确切的动物学区别无法确定；也可按其动作或特征译为“啃食蝗虫”“群蝗”“跳蝗”和“吞食蝗虫”等。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר
  choice: ……剩下的
  rationale: 该词意为“余下之物”。在反复句式中译作“……剩下的”，既符合现代汉语，也保留一批接一批将余物吃尽的递进效果。
- source_word: גָּזָם
  choice: 剪虫
  rationale: 指一种啃食或剪断植物的蝗类害虫，确切种类不明。“剪虫”保留其截断、啃切的形象，同时不声称精确的动物学鉴定。
- source_word: אָכַל
  choice: 吃了
  rationale: 此处完成式叙述已发生的连续行动；“吃了”自然直接，并保留原文三次重复的节奏。
- source_word: אַרְבֶּה
  choice: 群蝗
  rationale: 这是希伯来语中常见的“蝗虫”用词，常与成群活动有关；“群蝗”既与本节其他名称相区别，也保持通俗易懂。
- source_word: יָּלֶק / יֶּלֶק
  choice: 蝻虫
  rationale: 指另一类或另一生长阶段的蝗虫，确切区别不明。“蝻虫”在现代汉语中可指未长翅的幼蝗，能简洁呈现可能的阶段差异；本节中的拼写变化不影响含义。
- source_word: חָסִיל
  choice: 吞噬之蝗
  rationale: 该词指吞吃、毁坏作物的虫类。“吞噬之蝗”突出其破坏性，又明确它属于本节的蝗灾序列。
- source_word: וְ
  choice: ；
  rationale: 希伯来语连接词在此累加三个平行分句。汉语以分号衔接，清楚呈现递进层次，并保留原文不断叠加的节奏。
theological_decisions: []
