base_translation:
  language: en
  yaml_path: translation/ot/joel/001/010.yaml
  text: The field is devastated; the ground mourns[a], for the grain is devastated, the new wine has dried up, the oil has failed.
translation:
  language: zh_hans
  text: 田野遭毁坏，土地哀伤；因为五谷遭毁坏，新酒干涸，油也枯竭了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “油”指新产的油，通常为橄榄油。原文此处的动词有衰残、枯竭之意，也可理解为油的产出断绝。原文常把五谷、新酒和油并列为主要农产。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁדַּד שָׂדֶה
  choice: 田地荒废
  rationale: שׁדד 的被动式表示遭到严重毁坏；“荒废”自然地呈现农田被摧毁后的状态，也避免把语义限于军事劫掠。שָׂדֶה 用集合意义的单数“田地”表达。
- source_word: אָבְלָה אֲדָמָה
  choice: 土地悲哀
  rationale: 保留 אָבַל“哀悼、悲哀”的拟人意象，并以“土地”区别于前面的“田地”。
- source_word: כִּי
  choice: 因为
  rationale: 在这里引出土地悲哀的原因；“因为”在现代汉语中清楚自然。
- source_word: שֻׁדַּד דָּגָן
  choice: 五谷被毁
  rationale: דָּגָן 泛指谷类出产；“五谷”是现代汉语中自然、庄重的集合称谓。“被毁”保留与前句同一动词 שׁדד 的重复和强烈程度。
- source_word: הוֹבִישׁ תִּירוֹשׁ
  choice: 新酒干涸
  rationale: תִּירוֹשׁ 指当季新产的酒或葡萄汁；农业语境中的 יבש 表示干枯、干涸。“新酒干涸”保留原文诗性表达。
- source_word: אֻמְלַל יִצְהָר
  choice: 油也枯竭了
  rationale: יִצְהָר 指新产的油，通常为橄榄油；אמל 表示衰残、枯萎或耗尽。“枯竭”适合油的产出断绝之意，同时不把名词过度限定为橄榄油。
