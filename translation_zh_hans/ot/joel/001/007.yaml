base_translation:
  language: en
  yaml_path: translation/ot/joel/001/007.yaml
  text: It has made my vine a desolation and my fig tree splinters[a]; it has stripped it bare and thrown it down[b]; its branches have turned white.
translation:
  language: zh_hans
  text: 它使我的葡萄树荒凉，使我的无花果树化为碎片[a]；它把树皮剥得精光，又把它抛下；它的枝条都变白了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “化为碎片”所译的希伯来词十分罕见，也可能指树桩或破碎后留下的残余。
    reason: lexical_alternative
  - marker: b
    text: “枝条”也可译作“嫩枝”或“卷须”。“变白”大概是指树皮被剥去后，里面的木质裸露出来。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם
  choice: 使……荒废
  rationale: שׂים 与 לְשַׁמָּה 连用，表示使某物成为荒凉、毁坏的状态；中文用“使……荒废”自然表达结果义。
- source_word: גַּפְנִי
  choice: 我的葡萄树
  rationale: גֶּפֶן 指葡萄树，而非整个葡萄园；保留第一人称单数领属后缀。
- source_word: לְשַׁמָּה
  choice: 荒废
  rationale: שַׁמָּה 表示荒凉、毁坏；“荒废”既保留灾变结果，也符合现代汉语表达。
- source_word: וּתְאֵנָתִי
  choice: 我的无花果树
  rationale: תְּאֵנָה 在此指无花果树；保留第一人称单数领属关系。
- source_word: לִקְצָפָה
  choice: 碎裂
  rationale: 该罕见名词含义不完全确定，可能指碎片、断裂残余或树桩；结合下文剥皮与抛弃的破坏图景，正文译作“碎裂”，脚注保留其他可能。
- source_word: חָשֹׂף חֲשָׂפָהּ
  choice: 把树皮剥得精光
  rationale: 同根不定式绝对式加完成式加强动作；“剥得精光”体现彻底剥除。宾语为阴性单数，语境指无花果树；补出“树皮”说明随后枝条露白的原因。
- source_word: וְהִשְׁלִיךְ
  choice: 又将它丢弃
  rationale: Hiphil 形式表示扔、抛；原文没有明确表示向下的成分，因此译作“丢弃”较为稳妥，同时保留毁坏后抛开的图景。
- source_word: הִלְבִּינוּ
  choice: 都露白了
  rationale: 该复数动词表示变白或显白；结合树皮被完全剥除，“露白了”自然传达木质裸露的结果。
- source_word: שָׂרִיגֶיהָ
  choice: 树枝
  rationale: שָׂרִיג 可指枝条、嫩枝或卷须；此处阴性单数后缀最自然回指无花果树，故用普通读者易懂的“树枝”。
