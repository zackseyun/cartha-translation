source:
  edition: WLC
  text: חִגְר֨וּ וְ/סִפְד֜וּ הַ/כֹּהֲנִ֗ים הֵילִ֨ילוּ֙ מְשָׁרְתֵ֣י מִזְבֵּ֔חַ בֹּ֚אוּ לִ֣ינוּ בַ/שַּׂקִּ֔ים מְשָׁרְתֵ֖י אֱלֹהָ֑/י כִּ֥י נִמְנַ֛ע מִ/בֵּ֥ית אֱלֹהֵי/כֶ֖ם מִנְחָ֥ה וָ/נָֽסֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/013.yaml
  text: Gird yourselves and mourn[a], O priests; wail, you ministers of the altar. Come, spend the night in sackcloth, you ministers of my God[b], because grain offering and drink offering are withheld from the house of your God.
translation:
  language: zh_hans
  text: 祭司啊，你们要束腰哀哭；在祭坛前供职的人哪，你们要哀号。侍奉我上帝的人哪，你们要来，披着麻衣过夜，因为素祭和奠祭已从你们上帝的殿[a]中断绝了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“家”，这里指上帝的圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ
  choice: 束上衣带
  rationale: 保留动词“束上、束腰”的字面意象，不提前补入后文才明确出现的“麻衣”；在哀悼语境中，其具体含义由后文“披着麻衣”加以说明。
- source_word: וְסִפְדוּ
  choice: 哀哭
  rationale: 表达正式哀悼及哭丧之意，并与语气更强的“哀号”有所区分。
- source_word: הֵילִילוּ
  choice: 哀号
  rationale: 该词表示强烈而出声的悲恸呼喊；“哀号”既保留力度，也符合现代庄重汉语。
- source_word: מְשָׁרְתֵי מִזְבֵּחַ
  choice: 在祭坛前供职的人
  rationale: 呈现祭司在祭坛处履行礼仪职分的含义；“供职”比一般的“服侍”更能体现此处的圣职语境。
- source_word: לִינוּ בַשַּׂקִּים
  choice: 披着麻衣过夜
  rationale: לִינוּ 指留宿、过夜，בַשַּׂקִּים 指身着哀悼用的粗麻衣；译文自然明确地保留持续整夜哀悼的呼召。
- source_word: מְשָׁרְתֵי אֱלֹהָי
  choice: 侍奉我上帝的人
  rationale: 保留先知所说“我的上帝”这一第一人称领属，并以“侍奉”表达对上帝的礼仪性服事。
- source_word: נִמְנַע
  choice: 断绝了
  rationale: 此处被动式表示供物不再进入或不再用于圣殿礼仪；“断绝了”准确传达祭献停止的结果，也符合先知文学语体。
- source_word: מִבֵּית אֱלֹהֵיכֶם
  choice: 从你们上帝的殿中
  rationale: בֵּית 字面为“家、殿”，在此指上帝的圣所；现代汉语用“殿”比“家”更清楚，同时保留“你们的上帝”的第二人称转换。
- source_word: מִנְחָה וָנָסֶךְ
  choice: 素祭和奠祭
  rationale: 采用现代中文圣经语境中通行且准确的祭祀术语：מִנְחָה 为谷物供物，נֶסֶךְ 为浇奠的酒祭。
theological_decisions:
- issue: אֱלֹהָי 与 אֱלֹהֵיכֶם 的人称转换
  choice: 分别译作“我上帝”和“你们上帝”
  alternative: 统一译作“我们的上帝”或省略领属代词
  rationale: 原文有意从先知的第一人称转向对祭司的第二人称；保留这一转换可维持其修辞张力，避免神学性或文体性的平滑处理。
- issue: “上帝的家”是直译还是按圣所语境表达
  choice: 译作“上帝的殿”
  alternative: 译作“上帝的家”
  rationale: 语境明确涉及祭坛、素祭和奠祭，因此“殿”自然指向圣所；这不改变所指对象，也不引入特定宗派解释。
translation_notes:
  register: 采用现代、庄重且可朗读的先知谕令语体。以两组呼语和命令保留原文的排比与递进；“哀哭／哀号”体现强度差异；不将首句解释性地改成“披上麻衣”，以免抹去它与后文明确提及麻衣之间的结构关系。
