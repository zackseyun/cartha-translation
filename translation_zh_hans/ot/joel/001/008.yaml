base_translation:
  language: en
  yaml_path: translation/ot/joel/001/008.yaml
  text: Wail like a virgin clothed in sackcloth for the husband of her youth[a][b].
translation:
  language: zh_hans
  text: 你要哀号，像一位腰束麻布、为她年轻时的丈夫哀悼的少女[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丈夫”也可理解为“未婚夫”；这里的诗意表达浓缩了古代婚约与婚姻用语。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִי
  choice: 你要哀号
  rationale: 阴性单数命令式，呼吁发出哀哭；“哀号”保留先知性哀歌中强烈而可听见的悲恸。
- source_word: כִּבְתוּלָה
  choice: 像少女
  rationale: כְּ明确表示比拟；בְּתוּלָה通常指处女或未婚少女。正文采用自然的“少女”，而不消除她与“丈夫”并置所形成的诗意张力。
- source_word: חֲגֻרַת שַׂק
  choice: 腰束麻布
  rationale: 较贴近“以麻布束腰”的字面结构，也自然呈现持续处于哀悼装束中的状态。
- source_word: שַׂק
  choice: 麻布
  rationale: 指哀悼时所穿或所束的粗布；“麻布”是现代中文圣经语体中清楚、凝练的对应词。
- source_word: עַל
  choice: 为
  rationale: 在哀悼语境中引出哀哭的对象或缘由；中文“为……哀号”自然准确。
- source_word: בַּעַל
  choice: 丈夫
  rationale: 该词可指主人、拥有者或丈夫；与“她年轻时”连用时，以婚姻伴侣之义最合适。是否特指未婚夫并非词本身明确表达，故保留“丈夫”。
- source_word: נְעוּרֶיהָ
  choice: 她年轻时的
  rationale: 属格结构修饰“丈夫”，表示她早年或青春时期的伴侣；“年轻时的丈夫”是自然且不作过度解释的中文表达。
theological_decisions:
- issue: “少女”与“她年轻时的丈夫”并置所产生的身份张力
  choice: 正文保留希伯来诗句的压缩意象，不将人物明确改写为已订婚女子或新娘。
  alternative: 将 בַּעַל 译作“未婚夫”，或意译为“年轻新娘为新郎哀哭”。
  rationale: 原文既使用通常指处女或未婚少女的 בְּתוּלָה，又使用可指丈夫的 בַּעַל。诗歌和古代婚约文化可能容纳这种表达，但原文没有明说具体身份；译文应保存张力，并以脚注提示可能的理解。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“腰束麻布”较“身披麻布”更贴近 חֲגֻרַת 的束腰意象；全句以第二人称命令表达原文阴性单数呼告。
