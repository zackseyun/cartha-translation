id: JOL.1.2
reference: Joel 1:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְעוּ זֹאת֙ הַ/זְּקֵנִ֔ים וְ/הַֽאֲזִ֔ינוּ כֹּ֖ל יוֹשְׁבֵ֣י הָ/אָ֑רֶץ הֶ/הָ֤יְתָה זֹּאת֙ בִּֽ/ימֵי/כֶ֔ם וְ/אִ֖ם בִּ/ימֵ֥י אֲבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/002.yaml
  text: 'Hear this[a], you elders, and give ear, all inhabitants of the land: Has this happened in your days[b], or in the days of your fathers?'
translation:
  language: zh_hans
  text: 老年人哪，你们要听这话[a]；这地[b]所有的居民啊，你们都要侧耳听！这样的事曾在你们的日子发生过吗？或在你们列祖[c]的日子发生过吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “老年人”也可译作“长老”。原词既可指年长者，也可指群体中的长老。
    reason: lexical_alternative
  - marker: b
    text: “这地”也可译作“全地”或“大地”。原文此词可指“土地、国土”或“大地”；此处按上下文译为“这地”。
    reason: lexical_alternative
  - marker: c
    text: “列祖”原文直译为“你们的父辈”；也可译作“你们的祖先”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: 要听这话
  rationale: 复数祈使式加直接宾语；“听这话”自然、简洁，并保留先知直接呼告的力度。
- source_word: הַזְּקֵנִים
  choice: 老年人哪
  rationale: זְקֵנִים 可指年长者，也可能指群体中的长老；本节与跨世代记忆相连，正文采用不预设正式职分的“老年人”，另以脚注保留“长老”这一可能。
- source_word: וְהַאֲזִינוּ
  choice: 都要侧耳听
  rationale: האזין 比一般的“听”更强调留心聆听；“侧耳听”保留与 שׁמע 的修辞平行及语义递进。
- source_word: כֹּל יוֹשְׁבֵי הָאָרֶץ
  choice: 这地所有的居民
  rationale: 在约珥书开篇的直接语境中，הָאָרֶץ 较可能指先知所面对的本地或国土；“这地”自然表达该范围，同时保留“全地”的词义可能于脚注。
- source_word: הֶהָיְתָה זֹּאת
  choice: 这样的事曾发生
  rationale: 希伯来语字面近于“这事曾有过吗”；现代汉语以“曾发生”清楚表达对该事件是否出现过的询问。
- source_word: בִּימֵיכֶם
  choice: 在你们的日子
  rationale: 保留希伯来语的时间表达和代际对照；虽略带经文语体，现代读者仍易理解。
- source_word: וְאִם
  choice: 或
  rationale: 在并列疑问中引出第二种可能，功能相当于“或”，不按条件句译为“如果”。
- source_word: בִּימֵי אֲבֹתֵיכֶם
  choice: 你们祖先的日子
  rationale: אֲבוֹת 字面为“父辈／列祖”，此处泛指先前世代；“祖先”在现代汉语中自然准确，脚注保留更贴近形式的“父辈”。
theological_decisions:
- issue: הָאָרֶץ 的范围
  choice: 这地
  alternative: 全地／全世界
  rationale: אֶרֶץ 可指土地、国土或大地。这里呼告老年人和当地居民，并即将描述本地灾情，因此正文取地域性含义，但不排除先知语言可能具有更广回响。
- issue: הַזְּקֵנִים 指年龄还是职分
  choice: 老年人
  alternative: 长老
  rationale: 该词既可表示年长者，也可表示担任群体领导职分的长老。本节强调世代经验，年龄义较为切合；原文并未明确排除职分义，因此以脚注保存歧义。
- issue: אֲבֹתֵיכֶם 的代际称谓
  choice: 你们祖先
  alternative: 你们的父辈／列祖
  rationale: 原词为阳性复数，常用于泛指前代先祖。“祖先”在现代普通话中可自然涵盖这一集体历史指称，又不额外限定只到上一代。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话，以“哪／啊”呈现双重呼告，以“听／侧耳听”保留希伯来诗性平行。问句保留“你们的日子／祖先的日子”的代际对照。所有脚注标记均置于正文中；合并置于句末，以免打断呼告和疑问的节奏。
