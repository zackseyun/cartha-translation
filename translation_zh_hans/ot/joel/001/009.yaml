  text: הָכְרַ֥ת מִנְחָ֛ה וָ/נֶ֖סֶךְ מִ/בֵּ֣ית יְהוָ֑ה אָֽבְלוּ֙ הַ/כֹּ֣הֲנִ֔ים מְשָׁרְתֵ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/009.yaml
  text: The grain offering and the drink offering are cut off from the house of Yahweh[a]; the priests mourn[c][b], the ministers of Yahweh.
translation:
  language: zh_hans
  text: 素祭和奠祭已从雅威[a]的殿[b]中断绝；祭司们，就是侍奉雅威的人[c]，都在哀恸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文יהוה（YHWH）这一神名的音译，传统上也译作“耶和华”或以“主”代称。
    reason: 说明神名的原文形式及常见译法。
  - marker: b
    text: “殿”原文直译为“家”，这里指雅威的圣所或圣殿。
    reason: 保留原文字面意象，同时说明语境所指。
  - marker: c
    text: 也可译作“服事雅威的人”；原文是对“祭司们”的同位说明。
    reason: 说明分词短语的译法和句法关系。
lexical_decisions:
- source_word: הָכְרַת
  choice: 已……断绝
  rationale: 这是כרת的使役被动完成式，表示祭物供应被截断、已经停止；“已……断绝”保留其被动结果意味，也符合灾情哀歌的语境。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在圣所礼仪语境中，此词特指以谷物为主的祭物；“素祭”是现代中文圣经语境中准确而简洁的惯用名称。
- source_word: נֶסֶךְ
  choice: 奠祭
  rationale: 指浇奠的祭物；“奠祭”比泛称“浇奠”更明确地表达其礼仪性质。
- source_word: מִבֵּית יְהוָה
  choice: 从雅威的殿中
  rationale: בַּיִת字面是“家、房屋”，此处明确指圣所；正文用自然清楚的“殿”，脚注保留“雅威的家”这一字面表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，区别于“主”这一称号，并保留原文使用上帝专名的特点。
- source_word: אָבְלוּ
  choice: 都在哀恸
  rationale: 此动词表示因灾祸或丧失而悲哀、哀悼；“哀恸”庄重而自然，“都在”在中文中清楚连接复数主语和当前哀痛状态。
- source_word: הַכֹּהֲנִים
  choice: 祭司们
  rationale: 直接表达圣所中履行祭祀职分的人；复数后缀使中文读者容易识别其群体含义。
- source_word: מְשָׁרְתֵי יְהוָה
  choice: 侍奉雅威的人
  rationale: 分词结构说明这些祭司是履行圣所职事的人；译作“侍奉雅威的人”比“仆役”更能体现礼仪职分，同时保留它与“祭司们”的同位关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文音译为“雅威”，既保留专名性质，也不以称号“主”取代；脚注说明其传统译法。
- issue: “祭司”与“侍奉雅威的人”的句法关系
  choice: 按同位关系理解：“祭司们，就是侍奉雅威的人”
  alternative: 理解为两个并列群体：“祭司和侍奉雅威的人”
  rationale: 希伯来语两组名词之间没有连接词，后一短语最自然地作为前一名词的同位说明；译文不把它扩展成两个不同群体。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“素祭”“奠祭”“祭司”保留必要的礼仪术语；“已……断绝”与“都在哀恸”形成清楚有力的灾祸哀歌语气。
