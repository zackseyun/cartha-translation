  text: עָלֶ֖/יהָ לִ/בְנֵי/כֶ֣ם סַפֵּ֑רוּ וּ/בְנֵי/כֶם֙ לִ/בְנֵי/הֶ֔ם וּ/בְנֵי/הֶ֖ם לְ/ד֥וֹר אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/003.yaml
  text: Tell your children about it[a], and let your children tell their children, and their children tell another generation.
translation:
  language: zh_hans
  text: 要把这事讲给你们的儿女听[a]；你们的儿女要讲给他们的儿女听，他们的儿女又要讲给后来的世代听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你们的儿子……他们的儿子……他们的儿子”；这里译作“儿女”，因为上下文所说的是记忆在历代后人中的传承，并非只限于男性后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיהָ
  choice: 这事
  rationale: 介词 עַל 加阴性单数后缀回指上文所述的灾祸；中文用“这事”自然承接该事件，也不把语法阴性误解为女性所指。
- source_word: לִבְנֵיכֶם
  choice: 你们的儿女
  rationale: בנים 可专指儿子，也可泛指儿女；本节强调世代相传，译作“儿女”更符合语境，同时保留家庭传承的表达。
- source_word: סַפֵּרוּ
  choice: 要把……讲给……听
  rationale: Piel 复数祈使式表示有意地讲述、传讲；“讲给……听”在现代汉语中清楚自然，并能贯穿后续省略谓语的分句。
- source_word: וּבְנֵיכֶם לִבְנֵיהֶם
  choice: 你们的儿女要讲给他们的儿女听
  rationale: 希伯来文在后续分句省略动词；中文补出“要讲给……听”，承接前句的命令语气并使传承链条明确。
- source_word: וּבְנֵיהֶם לְדוֹר אַחֵר
  choice: 他们的儿女又要讲给后来的世代听
  rationale: 补出省略的“讲”，并以“又”表现递进的代际传递；דּוֹר אַחֵר 指另一个、后来的世代，不局限于紧接着的下一代。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“讲给……听”比“述说”更自然，并通过重复谓语清楚呈现原文逐代传递的结构；分号划分最初命令与后续传承链。
