id: JOL.1.12
reference: Joel 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/גֶּ֣פֶן הוֹבִ֔ישָׁה וְ/הַ/תְּאֵנָ֖ה אֻמְלָ֑לָה רִמּ֞וֹן גַּם תָּמָ֣ר וְ/תַפּ֗וּחַ כָּל עֲצֵ֤י הַ/שָּׂדֶה֙ יָבֵ֔שׁוּ כִּֽי הֹבִ֥ישׁ שָׂשׂ֖וֹן מִן בְּנֵ֥י אָדָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/012.yaml
  text: The vine has dried up[a], and the fig tree has withered; the pomegranate, also the palm and the apple tree—all the trees of the field have dried up. Indeed[b], joy has dried up from the sons of man.
translation:
  language: zh_hans
  text: 葡萄树枯干了；无花果树也凋萎了。石榴树、棕榈树和苹果树[a]，田野的一切树木，全都枯干了。人的喜乐也确实枯干了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苹果树”所译的希伯来词具体指哪一种树，不能确定；也可能指杏树。
    reason: lexical_alternative
  - marker: b
    text: “人的”直译为“人的子孙”，这里泛指人类。
    reason: alternative_reading
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: 葡萄树
  rationale: 定冠词单数名词，指作为代表性农作物的栽培葡萄藤；现代汉语用“葡萄树”自然明白。
- source_word: הוֹבִישָׁה
  choice: 枯干了
  rationale: 在农业灾荒语境中表示植物干枯，而非羞愧；并与后文同源意象相呼应。
- source_word: הַתְּאֵנָה אֻמְלָלָה
  choice: 无花果树也凋萎了
  rationale: אֻמְלָלָה描写植物衰败、萎蔫的状态；“凋萎”既自然，又与“枯干”略作区分，保留平行变化。
- source_word: רִמּוֹן
  choice: 石榴树
  rationale: 在树木清单中明确译出所指植物，避免现代汉语将“石榴”只理解为果实。
- source_word: גַּם
  choice: 也
  rationale: 保留其增补、强调作用，并自然承接前两种作物。
- source_word: תָּמָר
  choice: 棕榈树
  rationale: 所指很可能是海枣树，但“棕榈树”是稳妥而通行的上位表达，不把物种判定说得过满。
- source_word: תַפּוּחַ
  choice: 苹果树
  rationale: 采用传统且最易识别的译法；原词所指的确切树种有争议，故用脚注保留不确定性。
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: 田野的一切树木
  rationale: 贴近希伯来语的总体性表达，并保留“田野”的农业与诗歌意象。
- source_word: יָבֵשׁוּ
  choice: 全都枯干了
  rationale: 复数完成式概括所有树木的状态；“全都”清楚传达כָּל的周遍意义，并重复“枯干”以加强灾情的累积效果。
- source_word: כִּי
  choice: 确实
  rationale: 此处可带解释或强调语气；译作“确实”使末句在现代汉语中自然，同时不强行限定为单纯因果关系。
- source_word: הֹבִישׁ שָׂשׂוֹן
  choice: 喜乐也确实枯干了
  rationale: 把植物枯干的意象延伸到人的喜乐，重复“枯干”以保留原文诗性联结。
- source_word: מִן בְּנֵי אָדָם
  choice: 人的
  rationale: 该惯用语泛指人类；在汉语中“人的喜乐”既简洁自然，也不把范围误限于男性。
theological_decisions:
- issue: בְּנֵי אָדָם所指的人群范围
  choice: 人的喜乐
  alternative: 世人的喜乐／人类的喜乐／人的子孙的喜乐
  rationale: 该希伯来惯用语泛指人类。现代汉语“人的喜乐”保留אָדָם的“人”这一词面联系，又自然涵盖所有人；脚注补明其直译形式，以保留原文表达。
- issue: כִּי与末句的逻辑关系
  choice: 确实
  alternative: 因为／原来
  rationale: כִּי在此既可视为解释前述灾情，也可带强调语气。主文采用“确实”以避免把诗句关系过度限定为严格因果。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用重复的“枯干”维持全节由植物灾害转入人类喜乐消逝的核心意象；标点按诗性列举和结句强调安排。
