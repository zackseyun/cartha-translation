    issue: “做异梦”添加了原文没有的限定。
    rationale: חֲלֹמוֹת יַחֲלֹמוּן直译为“要做梦／要梦见梦”，同源宾语用于强调，并无“异、奇异”的词。异象固然具有启示性质，但不能据此将“梦”在译文中限定为“异梦”。
  - severity: low
    issue: “老年人”“年轻人”未明确保留男性指称。
    rationale: זקניכם与בחוריכם在此按年龄相对，并分别为“你们的老年男子”和“你们的年轻男子”；前句的“儿子和女儿”则明确包括两性。使用“男子”可避免扩大原文所明示的指称。
