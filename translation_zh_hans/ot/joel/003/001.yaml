id: JOL.3.1
reference: Joel 3:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֣ה אַֽחֲרֵי כֵ֗ן אֶשְׁפּ֤וֹךְ אֶת רוּחִ/י֙ עַל כָּל בָּשָׂ֔ר וְ/נִבְּא֖וּ בְּנֵי/כֶ֣ם וּ/בְנֽוֹתֵי/כֶ֑ם זִקְנֵי/כֶם֙ חֲלֹמ֣וֹת יַחֲלֹמ֔וּ/ן בַּח֣וּרֵי/כֶ֔ם חֶזְיֹנ֖וֹת יִרְאֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/001.yaml
  text: And it will happen afterward that I will pour out my Spirit on all flesh[a]; and your sons and your daughters will prophesy, your old men will dream dreams[b], your young men will see visions.
translation:
  language: zh_hans
  text: 此后，我要将我的灵浇灌在凡有血肉的身上[a]；你们的儿子和女儿要说预言；你们的老年男子要做梦；你们的年轻男子要见异象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有人”或“全人类”；希伯来文直译为“所有血肉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 此后（与后句合并表达）
  rationale: 该结构引出将来发生的事。汉语无需机械译出“事情将会发生”，以“此后，我要……”自然传达未来事件及其时间推进。
- source_word: אַחֲרֵי כֵן
  choice: 此后
  rationale: 简洁保留相对于前文的时间顺序，又不把所指过度限定为某一具体事件。
- source_word: אֶשְׁפּוֹךְ
  choice: 我要……浇灌
  rationale: 保留שפך“倾倒、浇出”的具体比喻；“浇灌”在现代中文中庄重自然，也适合灵的赐下语境。
- source_word: רוּחִי
  choice: 我的灵
  rationale: 说话者是上帝，且结果是预言、梦和异象，语境指向上帝的灵；中文不以大小写区分普通名词与专名，因此译作“我的灵”并保留其语义形式。
- source_word: עַל כָּל בָּשָׂר
  choice: 在所有血肉之躯上
  rationale: 保留בשר“肉身、血肉”的具象表达及עַל“在……上”的空间隐喻，不提前把范围解释成“全人类”或“所有人”。
- source_word: וְנִבְּאוּ
  choice: 都要说预言
  rationale: 该动词在这里表示受感而发出预言；“说预言”比现代汉语中可能被理解为职业身份的“作先知”更直接。加入“都”自然承接儿子和女儿两个并列群体。
- source_word: בְּנֵיכֶם וּבְנוֹתֵיכֶם
  choice: 你们的儿子和女儿
  rationale: 明确保留原文同时列出的男性与女性后代，不概括为“儿女”或“孩子”。
- source_word: זִקְנֵיכֶם
  choice: 你们的老年人
  rationale: 与下句“年轻人”形成年龄对照，重点不是担任职分的“长老”。“老年人”比“老人”更中性庄重，并可自然涵盖原词在集合语境中的年龄群体。
- source_word: חֲלֹמוֹת יַחֲלֹמוּן
  choice: 要做异梦
  rationale: 原文同源宾语结构强调“做梦”。中文圣经语域中的“做异梦”既保留启示性梦境，也比“梦见梦”自然。
- source_word: בַּחוּרֵיכֶם
  choice: 你们的年轻人
  rationale: 与“老年人”构成清晰年龄对照；“年轻人”是现代汉语自然表达，原词在此主要指年轻男性，但汉语该词形式上可泛指，语境中的平行结构仍得到保留。
- source_word: חֶזְיֹנוֹת יִרְאוּ
  choice: 要见异象
  rationale: 这是先知性启示的常用表达；“见异象”既贴近“看见”的字面义，也符合庄重自然的中文。
theological_decisions:
- issue: 预言性浇灌语境中的רוּחִי所指
  choice: 我的灵
  alternative: 我的气息／我的心灵
  rationale: 上帝亲自浇灌，而其结果是预言、异梦和异象，因此最可能指上帝赐下、使人受感的灵。中文没有英文大小写问题，译文不额外加入“圣”字，以免超过本节原文。
- issue: כָּל בָּשָׂר的范围
  choice: 所有血肉之躯
  alternative: 所有人／全人类
  rationale: 直译保留原文宽广而具身的措辞，也不预先裁定它在本段中究竟强调全体人类，还是所述群体中各类人。脚注提供自然中文释义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“浇灌”“异梦”“异象”保留先知文学的形象与语域；句式按汉语习惯整理，同时维持原文由儿女、老年人、年轻人组成的平行结构。
