source:
  edition: WLC
  text: וְ/הָיָ֗ה כֹּ֧ל אֲשֶׁר יִקְרָ֛א בְּ/שֵׁ֥ם יְהוָ֖ה יִמָּלֵ֑ט כִּ֠י בְּ/הַר צִיּ֨וֹן וּ/בִ/ירוּשָׁלִַ֜ם תִּֽהְיֶ֣ה פְלֵיטָ֗ה כַּֽ/אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה וּ/בַ֨/שְּׂרִידִ֔ים אֲשֶׁ֥ר יְהוָ֖ה קֹרֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/005.yaml
  text: And it will happen that everyone who calls on the name of Yahweh will be delivered[a]; for on Mount Zion and in Jerusalem there will be escape, as Yahweh has said[c][b], among the survivors whom Yahweh calls.
translation:
  language: zh_hans
  text: 到那时，凡求告雅威之名的，都必得解救[a]；因为在锡安山和耶路撒冷必有逃脱[b]，正如雅威所说的；也在雅威所召的幸存者中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡求告雅威之名的，都必逃脱。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来语 פְלֵיטָה 可指“逃脱”“解救”，也可指“逃脱者”或“余民”。
    reason: lexical_alternative
  - marker: c
    text: 本节同时说人求告雅威，也说幸存者是雅威所召的；原文没有消解这两方面之间的张力。
    reason: theological_tension
lexical_decisions:
- source_word: וְהָיָה
  choice: 到那时
  rationale: 承接前文的末后事件，并自然引出将来的结果；比直译“事情将会发生”更符合现代汉语叙事。
- source_word: כֹּל אֲשֶׁר
  choice: 凡……的，都
  rationale: 准确表达希伯来语逐一涵盖的普遍范围，也符合庄重而自然的现代汉语。
- source_word: יִקְרָא בְּשֵׁם יְהוָה
  choice: 求告雅威之名
  rationale: “求告”保留宗教语境中的呼求、倚靠和敬拜含义；“雅威”音译神的专名。
- source_word: יִמָּלֵט
  choice: 必得解救
  rationale: 该动词可指逃脱或获救；“得解救”既呈现被救离审判的含义，又不把它限定为纯粹身体逃生或系统化的救恩术语。
- source_word: תִּהְיֶה פְלֵיטָה
  choice: 必有逃脱之路
  rationale: פְלֵיטָה 可指逃脱、解救或逃脱者；此处用“逃脱之路”保留抽象名词的表达，并与下文“幸存者”区分。
- source_word: וּבַשְּׂרִידִים אֲשֶׁר יְהוָה קֹרֵא
  choice: 在幸存者中，必有雅威所召的人
  rationale: 按希伯来语介词关系表达“在幸存者中”，并保留雅威主动呼召这一层面；补出“人”使中文句法清楚。
theological_decisions:
- issue: 人的求告与雅威的呼召之间的关系
  choice: 正文同时保留“凡求告……的”与“雅威所召的人”
  alternative: 把末句解释为对前一普遍应许的严格限定，或解释为不具限定作用的同位说明
  rationale: 希伯来文本并列呈现人的求告和雅威的呼召，却没有进一步说明二者的逻辑关系；译文不替文本化解这种神学张力。
- issue: פְלֵיטָה 是逃脱、解救还是余民
  choice: 正文译作“逃脱之路”
  alternative: “解救”或“逃脱者／余民”
  rationale: 该词语义范围较宽。正文避免与后面的“幸存者”重复，也不预先将其收窄为抽象救恩或特定的余民神学。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。“求告”保留经文传统中的宗教含义而不过分古雅；神名 יְהוָה 译为“雅威”。将原文较长的句子分成两句，以避免“在幸存者中”错误附着于“雅威所说的”，同时保持各分句关系。
