  text: וְ/גַ֥ם עַל הָֽ/עֲבָדִ֖ים וְ/עַל הַ/שְּׁפָח֑וֹת בַּ/יָּמִ֣ים הָ/הֵ֔מָּה אֶשְׁפּ֖וֹךְ אֶת רוּחִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/002.yaml
  text: And even on the male servants and on the female servants[a], in those days I will pour out my Spirit.
translation:
  language: zh_hans
  text: 并且，在那些日子，连男奴隶和女奴隶，我也要把我的灵浇灌在他们身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: 并且……甚至
  rationale: “并且”承接上文，“甚至”表达 גַם 在此处加强语气的作用，突出被社会忽视的人也包括在应许之内。
- source_word: עַל הָעֲבָדִים וְעַל הַשְּׁפָחוֹת
  choice: 在男奴隶和女奴隶身上
  rationale: 两个名词分别指处于役属身份的男性和女性；“男奴隶和女奴隶”既保留性别对举，也明确呈现其受奴役的社会现实。介词 עַל 结合“浇灌”译为“在……身上”。
- source_word: בַּיָּמִים הָהֵמָּה
  choice: 在那些日子
  rationale: 这是自然、准确的现代汉语时间表达，并保留先知话语所指的时期。
- source_word: אֶשְׁפּוֹךְ
  choice: 我要浇灌
  rationale: 保留 שפך 的液体倾倒意象；“浇灌”在汉语中自然表达丰厚赐下之意。
- source_word: אֶת רוּחִי
  choice: 我的灵
  rationale: 说话者是上帝，语境指上帝所赐下的灵；汉语不借助大小写区分，因此直接译为“我的灵”，不额外限定其性质。
theological_decisions:
- issue: עֲבָדִים / שְׁפָחוֹת 的社会身份
  choice: 男奴隶和女奴隶
  alternative: 男仆和女仆；仆人和婢女
  rationale: 本句借社会身份和性别的对举强调浇灌之广；“奴隶”较完整地保留原词所可能包含且在这里突出的役属现实，避免以较温和的“仆人”淡化这一层含义。
- issue: רוּחִי 的所指
  choice: 我的灵
  alternative: 我的气息；我的心意
  rationale: 在本段上帝把自己的灵浇灌在人身上的语境中，“灵”最贴切；同时不添加“圣”等原文未明说的修饰语。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“并且”保持与上文的衔接，“甚至”突出包容范围的扩展；保留“浇灌”的先知性意象。
