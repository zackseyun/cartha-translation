  text: הַ/שֶּׁ֨מֶשׁ֙ יֵהָפֵ֣ךְ לְ/חֹ֔שֶׁךְ וְ/הַ/יָּרֵ֖חַ לְ/דָ֑ם לִ/פְנֵ֗י בּ֚וֹא י֣וֹם יְהוָ֔ה הַ/גָּד֖וֹל וְ/הַ/נּוֹרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/004.yaml
  text: The sun will be turned to darkness[a], and the moon to blood[c][b], before the coming of the great and fearful day of Yahweh.
translation:
  language: zh_hans
  text: 太阳要变为黑暗，月亮要变为血[a]；在耶和华[b]那伟大而可畏的日子来到以前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “变为血”是原文的直译；也可理解为“变成血红色”。
    reason: lexical_alternative
  - marker: b
    text: “耶和华”译自神名 יהוה（YHWH）；也可音译为“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: 太阳
  rationale: 定冠词所限定的天体名称，现代汉语自然译为“太阳”。
- source_word: יֵהָפֵךְ
  choice: 要变为
  rationale: הפך 的尼法勒未完成式表示进入改变后的状态；“要变为”既体现将来指向，也自然表达结果性变化。
- source_word: לְחֹשֶׁךְ
  choice: 黑暗
  rationale: 介词 לְ 标示变化的结果；与“变为”搭配时无需另译介词。
- source_word: וְהַיָּרֵחַ
  choice: 月亮
  rationale: 明确指月球这一可见天体，与前句“太阳”构成平行。
- source_word: לְדָם
  choice: 变为血
  rationale: 原文直译为“成为血”；正文保留强烈的先知性意象，不擅自解释为仅仅“血红色”。
- source_word: לִפְנֵי בּוֹא
  choice: 在……来临以前
  rationale: לִפְנֵי 在此为时间意义，בּוֹא 是“来到”的不定式构造；合译符合现代汉语语序。
- source_word: יוֹם יְהוָה
  choice: 耶和华……的日子
  rationale: 保留先知书中“耶和华的日子”这一固定神学表达，并用中文传统且可辨识的专名“耶和华”呈现四字神名。
- source_word: הַגָּדוֹל
  choice: 伟大
  rationale: 修饰“日子”，表达其重大的规模与意义；“伟大”庄重而不额外解释。
- source_word: וְהַנּוֹרָא
  choice: 可畏
  rationale: 该词表达令人敬畏、惧怕；“可畏”兼顾威严与恐惧，避免“可怕”可能带来的贬义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文不以一般称号“主”取代专名；“耶和华”是现代中文圣经传统中最广为人知的专名形式，脚注说明另一种较贴近学术重构的音译。
- issue: 宇宙异象的性质
  choice: 正文保留“月亮要变为血”
  alternative: 月亮要变成血红色
  rationale: 原文只说 לְדָם（“成为血”），没有明确说明这是颜色现象还是其他性质的预兆，因此不在正文中消解其先知性张力。
- issue: הַנּוֹרָא 所包含的敬畏与恐惧
  choice: 可畏
  alternative: 可怕；令人敬畏
  rationale: “可畏”保留审判语境中的震慑，也容纳神圣威严所引发的敬畏，不把词义缩减为单纯恐怖或单纯赞叹。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。以两个平行分句保留希伯来诗性结构；后半句稍作汉语语序调整，并用“这一切都发生在”明确前述征兆与主日来临之间的时间关系。所有解释性限定均置于脚注，不在正文中判定异象究竟是字面天象还是象征语言。
