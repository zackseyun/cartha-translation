  text: וְ/נָֽתַתִּי֙ מֽוֹפְתִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ דָּ֣ם וָ/אֵ֔שׁ וְ/תִֽימֲר֖וֹת עָשָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/003.yaml
  text: 'And I will give wonders in the heavens and on the earth: blood and fire and columns of smoke[a].'
translation:
  language: zh_hans
  text: 我必在天上和地上显出奇事：血、火和烟柱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“烟雾”；原词着重描绘烟向上升腾的形态。
    reason: 罕见词语的词义范围包括柱状烟气，也可较宽泛地表达为升腾的烟雾。
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我必……显出
  rationale: 该动词基本义为“给、置放”。与“奇事”连用时，现代汉语用“显出”较自然，也清楚表达上帝使这些现象出现；不额外解释其具体实现方式。
- source_word: מוֹפְתִים
  choice: 奇事
  rationale: 此词可指令人惊异、具有预兆或标记作用的非凡现象。“奇事”既保留其震撼性，也不把含义限定为纯粹象征或某一种神迹类别。
- source_word: בַּשָּׁמַיִם
  choice: 在天上
  rationale: 希伯来语形式为复数，但现代汉语通常以“天上”自然表达天空或诸天领域，无须生硬标出复数。
- source_word: וּבָאָרֶץ
  choice: 和地上
  rationale: 与“天上”构成宇宙范围的对应；“地上”比“地里”更符合此处现象出现的领域。
- source_word: דָּם
  choice: 血
  rationale: 按其直接词义翻译，不预先判定为字面现象或象征。
- source_word: וָאֵשׁ
  choice: 火
  rationale: 按其直接词义翻译，并以汉语顿号式列举自然呈现原文并列结构。
- source_word: וְתִימֲרוֹת עָשָׁן
  choice: 和烟柱
  rationale: 该短语描绘柱状向上升腾的烟。“烟柱”简洁、形象，并保留原文的复数集合意义；脚注列出较宽泛的译法。
theological_decisions:
- issue: 这些现象的性质
  choice: 保留为上帝所显出的天地异象，不限定其为纯字面、纯象征或某一特定末世体系
  alternative: 明确解释为实际宇宙事件，或明确解释为社会动荡的象征
  rationale: 原文只陈列血、火和烟柱等震撼性景象，并未在本节说明其全部实现方式；直译意象可保留其审判与神圣介入的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“显出奇事”自然表达希伯来语“赐下／设置奇事”的结构；冒号后的简洁列举保留先知话语的力度。
