  text: וָ/אֹמַ֣ר אֵלֶ֗י/הָ יָמִ֤ים רַבִּים֙ תֵּ֣שְׁבִי לִ֔/י לֹ֣א תִזְנִ֔י וְ/לֹ֥א תִֽהְיִ֖י לְ/אִ֑ישׁ וְ/גַם אֲנִ֖י אֵלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/003.yaml
  text: And I said to her, “You must remain for me many days; you must not prostitute yourself, and you must not belong to a man; and I also will be toward you.”
translation:
  language: zh_hans
  text: 我对她说：“你要为我而住许多日子；不可卖淫，也不可归属任何男人；我也会向着你。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我也会向着你”：希伯来文直译为“而且我，向着你”，省略了谓语。此句可能表示说话者会以相应方式对待她、专属于她、等候她或克制自己；原文没有明确说明。
    reason: 说明末句省略谓语及其真实歧义，避免正文预先确定具体的互惠方式。
lexical_decisions:
- source_word: תֵּשְׁבִי לִי
  choice: 为我安居
  rationale: תשבי 的基本义为“坐、居住、停留”，לִי 表示关系上的“为我／归我”；“为我安居”既保留关系意味，也符合这段婚姻语境。
- source_word: לֹא תִזְנִי
  choice: 不可卖淫
  rationale: זנה 在此指从事淫乱或卖淫；结合何西阿与妇人的叙事，“卖淫”比泛化的“不忠”更贴近词义。
- source_word: וְלֹא תִהְיִי לְאִישׁ
  choice: 也不可归别的男人
  rationale: 直译近于“也不可属于一个男人／与男人相属”。中文补出“别的”以表达相对于说话者的关系，但不把含义收窄为某一种具体性行为。
- source_word: וְגַם אֲנִי אֵלָיִךְ
  choice: 我也会同样待你
  rationale: 原句省略谓语，字面近于“我也向着你／对你”。译文保留互惠关系，却不武断补成“与你同房”或“忠于你”等特定含义。
theological_decisions:
- issue: 末句省略谓语所产生的关系含义
  choice: 我也会同样待你
  alternative: 我也归你／我也不亲近你
  rationale: 希伯来文只说“我也向着你”，语义故意简约，可能表达相应的专属、节制或关系承诺；正文不将其限定为单一解释。
- issue: 妇人与其他男人的关系
  choice: 不可归别的男人
  alternative: 不可与男人同房
  rationale: לְאִישׁ 表达“属于／归于男人”的关系，原文没有明说同房；因此避免把较宽的措辞窄化为纯粹性行为。
translation_notes:
  register: 采用现代、庄重且易懂的叙事口吻。“安居”比“留下”更能承载 ישב 的居住意味；末句用“同样待你”自然呈现互惠性，并以脚注保存希伯来文的省略和开放性。
