  naturalness: “必有许多日子处于没有……的境况，也没有……”句式略显拖沓，且“也没有”在并列否定链中造成结构不齐。改为“必有很长一段日子处于……的境况”，并将三组缺失项目平行排列，更符合现代标准汉语，也保留原文持续受剥夺的状态。
