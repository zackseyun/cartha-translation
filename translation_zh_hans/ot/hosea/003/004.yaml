  rationale: 修订使持续状态的表达更自然、并列否定结构更整齐，并将“祭祀”改为更贴近 זֶבַח 的“祭物”。“家神像”配合脚注更明确地表达 תְרָפִים 的家庭崇拜物性质。译文仍不判定清单中的宗教项目全属正当或不正当敬拜，也不将以弗得的形态定为单一解释。
