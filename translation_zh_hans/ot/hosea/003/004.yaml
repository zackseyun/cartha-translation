id: HOS.3.4
reference: Hosea 3:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י יָמִ֣ים רַבִּ֗ים יֵֽשְׁבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֥ין מֶ֨לֶךְ֙ וְ/אֵ֣ין שָׂ֔ר וְ/אֵ֥ין זֶ֖בַח וְ/אֵ֣ין מַצֵּבָ֑ה וְ/אֵ֥ין אֵפ֖וֹד וּ/תְרָפִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/004.yaml
  text: For many days the sons of Israel will dwell without king or prince[a], without sacrifice or pillar[c][b], and without ephod or household idols.
translation:
  language: zh_hans
  text: 因为以色列人必有很长一段日子处于没有君王和首领、没有祭物和柱像[a]、没有以弗得[b]和家神像[c]的境况。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柱像”指为宗教用途竖立的石柱或石碑；也可译作“石柱”。
    reason: lexical_alternative
  - marker: b
    text: “以弗得”是希伯来宗教用语，常指祭司礼服，也可能指与礼仪有关的器物。
    reason: cultural_note
  - marker: c
    text: “家神像”原文作“特拉芬”，指家庭崇拜所用的神像或偶像。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，对先知行动所象征的事作出解释；译作“因为”自然保留其因果兼解释作用。
- source_word: יָמִים רַבִּים
  choice: 许多日子
  rationale: 贴近希伯来语习语，表示一段漫长但未明确限定的时期；不擅自具体化为“多年”。
- source_word: יֵשְׁבוּ
  choice: 处于……境况
  rationale: ישׁב在这里表示持续处在某种状态，并非字面的“坐着”；此译能与后续一连串“没有”自然衔接。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 现代汉语中自然、准确的群体称谓，涵盖以色列全体，不必机械译为“以色列的儿子们”。
- source_word: אֵין מֶלֶךְ
  choice: 没有君王
  rationale: 直接表达政治统治者的缺失，并保留原文反复出现的否定结构。
- source_word: שָׂר
  choice: 首领
  rationale: שׂר可指统治者、高官或领袖；“首领”较“王子”更符合此处与君王并列的政治语境，又不把身份限定为王室子弟。
- source_word: זֶבַח
  choice: 祭祀
  rationale: 该词指宰牲献祭；此处清单着眼于制度与礼仪的缺失，“祭祀”在汉语中比单项祭物更合适。
- source_word: מַצֵּבָה
  choice: 柱像
  rationale: 指竖立作宗教用途的石柱或石碑；“柱像”简洁保留其祭仪性质，脚注补明具体含义。
- source_word: אֵפוֹד
  choice: 以弗得
  rationale: 采用汉语圣经传统中已通行的音译，因为该词可指祭司礼服，也可能指相关礼仪器物，无法用一个普通名词完全涵盖。
- source_word: תְרָפִים
  choice: 家神
  rationale: 指家庭祭祀所用的神像或偶像；“家神”简明且符合现代汉语表达，脚注说明其为家庭崇拜物。
theological_decisions:
- issue: 清单是否同时包括正当与不正当的宗教事物
  choice: 逐项直译，不把整份清单统一解释为正当敬拜或偶像崇拜。
  alternative: 将所有项目都解释为非法崇拜，或都解释为正统敬拜。
  rationale: 祭祀和以弗得可与正当敬拜相关，柱像和家神则常与受谴责的崇拜相关。原文有意并列这些事物，译文应保留这种张力。
- issue: “以弗得”具体指礼服还是礼仪器物
  choice: 保留音译“以弗得”，在脚注中说明其语义范围。
  alternative: 明确译成“祭司礼服”或“神谕器物”。
  rationale: 本节并未确定其具体形态；作单一解释会消除原文的真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“处于……境况”使延续性状态与六次缺失项目清楚衔接；主句以“没有”反复推进，重现原文的剥夺感。技术词“以弗得”保留传统音译并以脚注解释；不在正文中替读者裁定各祭仪项目的合法性。
