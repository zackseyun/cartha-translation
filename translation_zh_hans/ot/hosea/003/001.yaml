  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ע֚וֹד לֵ֣ךְ אֱֽהַב אִשָּׁ֔ה אֲהֻ֥בַת רֵ֖עַ וּ/מְנָאָ֑פֶת כְּ/אַהֲבַ֤ת יְהוָה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הֵ֗ם פֹּנִים֙ אֶל אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/אֹהֲבֵ֖י אֲשִׁישֵׁ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/001.yaml
  text: And Yahweh said to me again[a], “Go, love a woman loved by another and committing adultery, just as Yahweh loves the children of Israel[b], though they turn to other gods and love raisin cakes.”
translation:
  language: zh_hans
  text: 耶和华又对我说：“你去爱一个为别人所爱、又犯奸淫的女人[a]，正如耶和华爱以色列人，尽管他们转向别神，喜爱葡萄干饼[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女人”也可译作“妻子”；“别人”所译的词也可指同伴、友人，按语境或可理解为丈夫。原文没有明确说明这女人是谁，也没有明确此人的身份。
    reason: lexical_alternative
  - marker: b
    text: “葡萄干饼”是压制成饼状的葡萄干食品，可能用于欢庆，也可能与当时的偶像崇拜活动有关。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的上帝圣名译法，同时与一般称谓“主”有所区别。
- source_word: עוֹד
  choice: 又
  rationale: 在叙事语境中表示耶和华再次向何西阿发出命令。
- source_word: לֵךְ אֱהַב
  choice: 去爱
  rationale: 保留两个直接命令，并使“爱”与后文耶和华的爱形成明确的词语呼应。
- source_word: אִשָּׁה
  choice: 一个女人
  rationale: 原词可指“女人”或“妻子”；正文采用较不限定的“女人”，不预先判定她是否就是何西阿的妻子。
- source_word: אֲהֻבַת רֵעַ
  choice: 为伴侣所爱
  rationale: רֵעַ 可指同伴、伴侣或友人；此译保留关系上的含混，不擅自明确为“丈夫”或“另一个男人”。
- source_word: וּמְנָאָפֶת
  choice: 却在行淫
  rationale: 分词表达持续或特征性的淫乱行为；“却”自然呈现被爱与不忠之间的反差。
- source_word: כְּאַהֲבַת יְהוָה אֶת בְּנֵי יִשְׂרָאֵל
  choice: 正如耶和华爱以色列人
  rationale: 清楚表达比较关系，并保留 אהב“爱”在本节中的重复。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 在现代汉语中自然准确地指以色列民族整体，避免生硬直译为“以色列的儿女”。
- source_word: וְהֵם פֹּנִים אֶל אֱלֹהִים אֲחֵרִים
  choice: 他们却转向别神
  rationale: “却”体现耶和华的爱与以色列背离之间隐含的让步和对比关系。
- source_word: וְאֹהֲבֵי אֲשִׁישֵׁי עֲנָבִים
  choice: 喜爱葡萄干饼
  rationale: 采用自然的现代中文，并保留本节“爱／喜爱”的词汇重复；该食物的可能礼仪背景置于脚注。
theological_decisions:
- issue: 何西阿受命去爱的女人是谁
  choice: 正文仅译作“一个女人”，不明确认定为歌篾或何西阿的妻子。
  alternative: 译作“你的妻子”，或直接暗示何西阿回到歌篾身边。
  rationale: 本节希伯来文本没有提名歌篾，也没有使用“你的妻子”；保留原文的开放性，避免替读者解决有争议的身份问题。
- issue: אֲהֻבַת רֵעַ 中 רֵעַ 的关系所指
  choice: 译作“为伴侣所爱”。
  alternative: 译作“为丈夫所爱”“为另一个男人所爱”或“有情人爱她”。
  rationale: 原词本身可指同伴、友人或关系密切者，语境可能涉及丈夫或情人，却不足以唯一确定；正文保留这种张力。
- issue: 耶和华的爱与以色列背道之间的语篇关系
  choice: 以“却”呈现对比和让步意味。
  alternative: 简单并列为“他们转向别神”。
  rationale: 原文以并列形式陈述，但上下文强烈形成耶和华仍然爱他们、而他们却转向别神的反差；中文用“却”可自然传达该语篇关系而不增加教义判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文以分号和短句理清复杂句法，同时保留“爱”的反复、婚姻不忠与以色列背道之间的比拟，以及关键关系词的原文含混。
