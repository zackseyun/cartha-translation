  text: וָ/אֶכְּרֶ֣/הָ לִּ֔/י בַּ/חֲמִשָּׁ֥ה עָשָׂ֖ר כָּ֑סֶף וְ/חֹ֥מֶר שְׂעֹרִ֖ים וְ/לֵ֥תֶךְ שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/002.yaml
  text: So I bought her for myself for fifteen shekels of silver and a homer and a lethech of barley[a][b].
translation:
  language: zh_hans
  text: 于是，我用十五舍客勒银子、一贺梅珥大麦和一勒特克大麦，为自己买下了她[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “勒特克”可能是古代的一种干量单位，大概相当于半贺梅珥。
    reason: cultural_note
  - marker: b
    text: 或译：“十五块银子。”希伯来文直译为“十五银子”，计价单位由上下文补足。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶכְּרֶהָ
  choice: 把她买来
  rationale: 此处 כרה 结合后面的价款，指以代价取得；“买来”自然、明确，同时避免“购得”过于书面。
- source_word: לִּי
  choice: 归自己
  rationale: 表达受益与归属意义，保留“为我自己”的反身意味，并使现代汉语行文自然。
- source_word: בַּחֲמִשָּׁה עָשָׂר כָּסֶף
  choice: 用十五舍客勒银子
  rationale: 原文直译为“十五银子”，货币单位须由语境补足；正文补出古代常用的“舍客勒”，并以脚注说明原文的省略。
- source_word: חֹמֶר
  choice: 一贺梅珥
  rationale: 这是古代干量单位；采用音译可保留原有计量名称，避免换算造成虚假的精确性。
- source_word: שְׂעֹרִים
  choice: 大麦
  rationale: 按该谷物名称直接翻译；原文在两个量词之后均出现此词，正文也相应保留。
- source_word: לֵתֶךְ
  choice: 一勒特克
  rationale: 这是特定的古代干量单位，可能等于半贺梅珥；正文音译，可能的等值关系放入脚注。
