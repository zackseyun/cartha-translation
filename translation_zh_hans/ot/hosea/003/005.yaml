  to: 后来，以色列人必回转，寻求耶和华他们的上帝和他们的王大卫[a]；在末后的日子[b]，他们必战兢地归向耶和华和他的恩惠[c]。
  rationale: 修订仅移除原文未明说的“领受”，恢复“耶和华”和“他的恩惠”作为同一动词所支配的并列趋向对象；并将“美善”调整为在此结构中更自然、同时仍涵盖טוּב语义范围的“恩惠”。其余措辞及脚注锚点均予保留。
