id: HOS.3.5
reference: Hosea 3:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַחַ֗ר יָשֻׁ֨בוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בִקְשׁוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וְ/אֵ֖ת דָּוִ֣ד מַלְכָּ֑/ם וּ/פָחֲד֧וּ אֶל יְהוָ֛ה וְ/אֶל טוּב֖/וֹ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/005.yaml
  text: Afterward the children of Israel will return and seek Yahweh their God and David their king[c][b][a], and they will come in fear to Yahweh and to his goodness in the latter days.
translation:
  language: zh_hans
  text: 后来，以色列人必回转，寻求耶和华他们的上帝和他们的王大卫[a]；在末后的日子[b]，他们必战兢地归向耶和华和他的恩惠[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的王大卫”可以指作为代表性君王的大卫，也可以指未来的大卫王系君王；希伯来原文没有进一步说明。
    reason: alternative_reading
  - marker: b
    text: “末后的日子”也可译作“最后的日子”或“将来的日子”。这是先知书中的一种表达。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“他们必敬畏耶和华和他的恩惠”或“他们必战兢着来到耶和华和他的恩惠面前”。希伯来语动词可表示惧怕、敬畏或战兢；在这里与表示方向的介词连用，可含有战兢着趋近之意。“他的恩惠”也可译作“他的美善”或“他的福惠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר
  choice: 后来
  rationale: 表示前三至四节所述缺乏时期之后发生的事，简洁自然地保留时间次序。
- source_word: יָשֻׁבוּ
  choice: 必回转
  rationale: שׁוב可指返回或转回；“回转”既保留行动方向，也容纳归回上帝的盟约意味，而不直接限定为“悔改”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语中自然且准确的民族称谓，避免“以色列的儿女”可能造成的生硬或性别误读。
- source_word: וּבִקְשׁוּ
  choice: 寻求
  rationale: 保留בקש所表达的主动、恳切寻求，也适合以耶和华和王大卫为双重宾语的句法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神名译法，明确其为专名而非“主”这一称号。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 准确表达带第三人称复数后缀的盟约关系。
- source_word: וְאֵת דָּוִד מַלְכָּם
  choice: 和他们的王大卫
  rationale: 直接保留“大卫”及其君王身份，不在正文中判定是历史上的大卫还是未来的大卫王系君王。
- source_word: וּפָחֲדוּ אֶל יְהוָה
  choice: 必敬畏战兢地归向耶和华
  rationale: פחד与方向介词אֶל连用，兼有惧怕、战兢和趋向之意；此译同时保留敬畏情感及归向的动态。
- source_word: וְאֶל טוּבוֹ
  choice: 领受他的美善
  rationale: טוּב可兼指上帝的良善和所赐福惠；结合方向结构，以“领受”使中文自然，但脚注保留较形式对应的另一译法。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 在末后的日子
  rationale: 保留先知性固定表达及其末世张力，不将其限定为某一具体末世体系。
theological_decisions:
- issue: “他们的王大卫”的所指
  choice: 正文直译为“他们的王大卫”
  alternative: 历史上的大卫复归；未来的大卫王系君王或弥赛亚君王
  rationale: 希伯来文本直接使用“大卫”之名，却未进一步解释其身份；保留原文措辞，避免替文本消除其预言性的张力。
- issue: וּפָחֲדוּ אֶל יְהוָה וְאֶל טוּבוֹ的语力
  choice: 译为敬畏战兢地归向耶和华，领受他的美善
  alternative: 惧怕耶和华和他的美善；战兢着来到耶和华和他的美善那里
  rationale: פחד与אֶל的组合可表达带着战兢趋向；主译文避免让现代读者误以为上帝的美善本身只是可怕的对象，同时以脚注保留更贴近形式的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”体现预言性未来；语序按中文习惯将时间短语前置。正文力求让普通读者易懂，同时用脚注保存“大卫”身份、末后日子和פחד加אֶל结构的真实歧义。
