source:
  edition: WLC
  text: גַּ֛ם כִּֽי יִתְנ֥וּ בַ/גּוֹיִ֖ם עַתָּ֣ה אֲקַבְּצֵ֑/ם וַ/יָּחֵ֣לּוּ מְּעָ֔ט מִ/מַּשָּׂ֖א מֶ֥לֶךְ שָׂרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/010.yaml
  text: Even though they hire among the nations[a], now I will gather them[c][b]; and they will begin to diminish under the burden of the king of princes.
translation:
  language: zh_hans
  text: 即使他们在列国中付出代价求援[a]，现在我必聚集他们；他们必因众首领之王的重担[b]而开始衰微[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “付出代价求援”也可译作“在列国中给与”或“在列国中送礼”。原文动词通常意为“给”，但本节语境很可能指以支付代价的方式寻求外邦援助。
    reason: lexical_alternative
  - marker: b
    text: “众首领之王”可能指统辖下属统治者的帝国君王；“重担”也可能具体指贡赋或强制征敛。
    reason: cultural_note
  - marker: c
    text: “开始衰微”所依据的希伯来文词形和句法都不确定。也可理解为“开始变少”，或按不同词根分析理解为“稍受痛苦”或“稍微战栗”。
    reason: alternative_reading
lexical_decisions:
- source_word: יִתְנוּ בַגּוֹיִם
  choice: 在列国中雇求援助
  rationale: נתן通常意为“给”，但承接8:9以法莲向外邦求取政治关系的语境，这里很可能指付出代价雇求外援。“在列国中”保留介词ב的表达；补出“援助”使现代汉语自然，但不把对象限定为某一具体盟国。
- source_word: עַתָּה
  choice: 现在
  rationale: 直接保留时间副词所表达的迫近性。
- source_word: אֲקַבְּצֵם
  choice: 我要聚集他们
  rationale: קבץ的基本义是“聚集”。本节语境倾向于为审判而聚集，但正文不补入“施行审判”，以保留动词本身可用于审判或复兴的张力。
- source_word: וַיָּחֵלּוּ מְּעָט
  choice: 他们将……开始衰微
  rationale: 该短语在词形和句法上均有困难。正文采用由“开始”与“变少、衰减”构成的通顺理解，同时以脚注保留“稍微痛苦／战栗”等可能解释。
- source_word: מִמַּשָּׂא
  choice: 因……的重担
  rationale: מַשָּׂא在此可指沉重负担，并可能具体指贡赋或征敛。“重担”保留较宽的语义范围，“因”自然表达介词מִן在此可能具有的原因含义。
- source_word: מֶלֶךְ שָׂרִים
  choice: “众首领之王”
  rationale: 按马所拉文本最自然地保留名词连属结构，即高踞众首领之上的王；引号提示这是一个不寻常且可能带有称号性质的短语，而不擅自改作“王和首领”。
theological_decisions:
- issue: אֲקַבְּצֵם是复兴性的招聚，还是为审判而聚集
  choice: 正文仅译“聚集他们”，由上下文暗示审判
  alternative: 明确译成“聚集他们来受审判”，或理解为复兴性的重新招聚
  rationale: 何西阿书第8章的近邻语境是责罚、外邦联盟和帝国压迫，因此审判含义较强；但希伯来动词本身并未明说目的，正文不应消除其表层歧义。
- issue: מֶלֶךְ שָׂרִים所指的统治者
  choice: 保留“众首领之王”这一连属表达
  alternative: 译作“王和首领”，或明确解释为亚述帝王
  rationale: 原文短语简短且含混。它很可能指辖制次级统治者的帝国君王，但正文不点名具体帝国，也不把连属结构改成并列结构。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雇求援助”照顾政治结盟语境；“众首领之王”有意保留原文生硬、凝缩的称号式结构。脚注标记均紧随相关语句，避免把词义和历史身份上的不确定性写死在正文中。
