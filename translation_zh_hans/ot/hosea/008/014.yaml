id: HOS.8.14
reference: Hosea 8:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ח יִשְׂרָאֵ֜ל אֶת עֹשֵׂ֗/הוּ וַ/יִּ֨בֶן֙ הֵֽיכָל֔וֹת וִֽ/יהוּדָ֕ה הִרְבָּ֖ה עָרִ֣ים בְּצֻר֑וֹת וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/עָרָ֔י/ו וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/014.yaml
  text: For Israel has forgotten his Maker and built palaces[a], and Judah has multiplied fortified cities; so I will send fire into his cities, and it will consume her citadels.
translation:
  language: zh_hans
  text: 因为以色列忘记了他的创造者，建造了宫殿[a]；犹大又增建许多坚固城。因此，我必向他的城邑降火，烧毁其中的堡垒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“殿宇”。希伯来语这个词既可指宫殿，也可指圣殿一类的建筑。
    reason: lexical_alternative
  - marker: b
    text: “堡垒”也可译作“宫殿”。这里的希伯来语可指宏伟的宫殿或设防的坚固建筑。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂהוּ
  choice: 造他的主
  rationale: 分词 עֹשֵׂהוּ 带第三人称阳性单数后缀，指造以色列的那一位。“造他的主”既保留“造他”的具体关系，也自然表达此处的神学和盟约意味。
- source_word: הֵיכָלוֹת
  choice: 宫殿
  rationale: הֵיכָלוֹת 可指宫殿，也可指殿宇或圣殿。上下文并列犹大的坚固城，并紧接对堡垒的审判，因此正文采用“宫殿”，另以脚注保留“殿宇”的可能。
- source_word: הִרְבָּה
  choice: 增建许多
  rationale: רבה 的使役形在这里表示使数量增多。结合宾语“坚固城”，“增建许多”比直译“增多”更符合现代汉语，同时保留刻意扩张防御设施的含义。
- source_word: עָרִים בְּצֻרוֹת
  choice: 坚固城
  rationale: 该组合指设防、加固的城邑。“坚固城”是简洁自然且具有经文庄重感的汉语表达。
- source_word: וְשִׁלַּחְתִּי אֵשׁ
  choice: 因此，我必降火
  rationale: 连接词在此承接前面的罪状并引出审判。“因此”体现语义关系；“降火”是自然庄重的汉语，也表达火临到城中的行动。
- source_word: בְּעָרָיו
  choice: 在他的城中
  rationale: 介词 ב 与“遣火”连用，表示火进入并作用于城邑。阳性单数后缀最自然地回指最近的阳性单数先行词“犹大”，故保留为“他的”。
- source_word: אַרְמְנֹתֶיהָ
  choice: 其中的堡垒
  rationale: אַרְמוֹן 可指宫殿或坚固建筑；军事防御语境支持“堡垒”。希伯来文阴性单数后缀可能把城邑作为集合或地域来指称；汉语用“其中的”既自然，也避免把原文代词转换误解为另一个审判对象。
theological_decisions:
- issue: 以色列与犹大之间的指称转换
  choice: 保留审判句中阳性单数后缀对犹大的回指，并将末句阴性后缀自然译为“其中的”。
  alternative: 把末句整体理解为重新指向以色列，或在汉语中完全抹平后缀差异。
  rationale: 本节先指控以色列，继而提到犹大；בְּעָרָיו 的最近阳性单数先行词是犹大。אַרְמְנֹתֶיהָ 的阴性后缀则可能以城邑或其集合为指称。译文不武断地把末句转回以色列，也不制造不自然的汉语性别转换。
- issue: הֵיכָלוֹת 的含义
  choice: 正文译为“宫殿”，脚注保留“殿宇”。
  alternative: 正文译为“殿宇”或“圣殿”。
  rationale: 该词兼有王宫和圣殿建筑的词义。政治、军事倚靠的上下文使“宫殿”较合适，但敬拜建筑的可能性确实存在，故用脚注保存歧义。
- issue: 审判中的火
  choice: 按原文直接译为上帝所降的火，不解释为某一种具体历史事件。
  alternative: 明确解释为敌军焚城或特定帝国的入侵。
  rationale: 原文宣告神主动施行审判，却未在本句指明历史执行者；译文应保留这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为……因此……”清楚呈现罪状与审判的关系；“造他的主”“坚固城”“我必降火”保持经文语体。用“其中的堡垒”处理希伯来文末尾阴性后缀，既保存指称张力，又避免现代汉语中突兀且可能误导的“她的”。
