  yaml_path: translation/ot/hosea/008/011.yaml
  text: Because Ephraim has multiplied altars for sinning[a], they have become altars for sinning to him.
translation:
  language: zh_hans
  text: 因为以法莲增设祭坛来犯罪[a]，这些祭坛就成了他用来犯罪的祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 两处“犯罪”也可译作“为献赎罪祭”；这个希伯来语形式可以按祭祀用语理解，但上下文更支持这些祭坛成了犯罪的场合。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出当前审判话语的缘由；现代汉语中“因为”清楚自然。
- source_word: הִרְבָּה
  choice: 增设
  rationale: 该词为 רבה 的使役式，表达使数量增多。与“祭坛”搭配时，“增设”既保留增加的含义，也比“使……增多”更自然。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 按专名音译保留。虽然在何西阿书中常代指北国以色列，本节仍直接译出原文名称。
- source_word: מִזְבְּחֹת
  choice: 祭坛
  rationale: מזבח 的常规对应词；中文名词通常不以词形标示复数，而“增设”已明确表明祭坛不止一座。
- source_word: לַחֲטֹא
  choice: 来犯罪／犯罪的
  rationale: 保留 חטא 不定式的动词意义，并在中文重复结构中分别采用自然表达；语境侧重这些祭坛成为犯罪的场合。
- source_word: הָיוּ לוֹ
  choice: 就成了他的
  rationale: היו 在此表达结果状态，用“成了”呈现；לוֹ 的关系以“他的”自然表达，同时避免生硬直译为“对他”。
- source_word: מִזְבְּחוֹת לַחֲטֹא
  choice: 犯罪的祭坛
  rationale: 保留原文后半句对“祭坛”和“犯罪”的重复及讽刺效果，同时符合现代汉语表达。
theological_decisions:
- issue: 两处 לַחֲטֹא 的含义
  choice: 按动词义理解为“来犯罪／犯罪的”
  alternative: 按祭祀术语理解为“献赎罪祭”
  rationale: חטא 的形式容许与赎罪祭相关的理解，但上下文谴责以法莲增设祭坛，较支持“犯罪”的动词义。正文采用此义，脚注保留祭祀义的真实可能性。
- issue: 祭坛增多与犯罪之间的关系
  choice: 保留目的与结果之间的张力
  alternative: 明确解释为祭坛原为敬拜而设、后来沦为犯罪工具
  rationale: 前一个 לַחֲטֹא 可表达目的或结果，原文没有展开动机；译文不加入“原为敬拜”等解释，只借重复呈现先增设、后成为犯罪祭坛的讽刺。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“增设祭坛”清楚体现复数和数量增加；后半句保留原文重复形成的先知性讽刺。
