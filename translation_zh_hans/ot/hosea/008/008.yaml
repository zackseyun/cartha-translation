source:
  edition: WLC
  text: נִבְלַ֖ע יִשְׂרָאֵ֑ל עַתָּה֙ הָי֣וּ בַ/גּוֹיִ֔ם כִּ/כְלִ֖י אֵֽין חֵ֥פֶץ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/008.yaml
  text: Israel is swallowed up[a]; now they are among the nations like a vessel in which there is no delight.
translation:
  language: zh_hans
  text: 以色列被吞灭了；如今，他们在列国中，如同一件无人喜爱的器皿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同一件无人想要的器皿。”
    reason: חֵפֶץ 可侧重喜爱、看重，也可表达想要或中意；正文与脚注分别保留这两种相近语气。
lexical_decisions:
- source_word: נִבְלַע
  choice: 被吞灭了
  rationale: 该词是 בלע 的尼法勒式，表达“被吞下、被吞没”。“被吞灭了”保留具体而强烈的被动意象，并以完成体呈现先知所宣告的既成审判。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 专名在此指北国，也将全国人格化；采用现代汉语通行译名。
- source_word: עַתָּה
  choice: 如今
  rationale: 表示当前处境是此前审判的结果；“如今”自然且具有合宜的先知书语体。
- source_word: הָיוּ
  choice: 他们在
  rationale: 该动词为复数，照应构成“以色列”的百姓；与 עַתָּה 连用时表达现今所处的结果状态。汉语以“如今，他们在……”自然呈现，不机械补出“成为”。
- source_word: בַגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם 在此指外国民族或国家；“列国”简洁庄重，也避免“外邦人”可能带入的后期术语色彩。
- source_word: כִּכְלִי
  choice: 如同一件……器皿
  rationale: כְּלִי 可指器皿、器具或物件；“器皿”保留原文比喻及圣经语体，“一件”则符合现代汉语量词习惯。
- source_word: אֵין חֵפֶץ בּוֹ
  choice: 无人喜爱的
  rationale: 该短语字面表示“其中没有喜悦/对它没有喜爱”。译作“无人喜爱的”自然地传达器皿不受看重、无人想要的含义，同时避免生硬的“其中没有喜悦”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。分号保留前后两幅审判图景的紧密联系；复数“他们”体现原文 הָיוּ 对作为集体之以色列百姓的复数照应。脚注标记置于相关比喻之后。
