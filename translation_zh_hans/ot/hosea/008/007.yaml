source:
  edition: WLC
  text: כִּ֛י ר֥וּחַ יִזְרָ֖עוּ וְ/סוּפָ֣תָ/ה יִקְצֹ֑רוּ קָמָ֣ה אֵֽין ל֗/וֹ צֶ֚מַח בְּלִ֣י יַֽעֲשֶׂה קֶּ֔מַח אוּלַ֣י יַֽעֲשֶׂ֔ה זָרִ֖ים יִבְלָעֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/007.yaml
  text: For they sow the wind[a], and they will reap the whirlwind. The standing grain has no head; it will yield no flour. Even if it should yield[c][b], strangers will swallow it up.
translation:
  language: zh_hans
  text: 因为他们播种的是风，所收割的将是暴风[a]。田间的禾稼没有穗子[b]，产不出面粉；即使有所产出[c]，外族人也会把它吞吃净尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴风”或译“旋风”或“狂风”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“田间的禾稼没有צֶמַח”；该词可指“嫩芽”“生长之物”，这里很可能指谷物结出的穗子。
    reason: lexical_alternative
  - marker: c
    text: 或译：“或许会产出，但外族人会把它吞吃净尽。”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明审判临到的缘由；现代汉语用“因为”自然清楚。
- source_word: רוּחַ
  choice: 风
  rationale: 农业性的播种、收割比喻要求具体义“风”；译作“灵”会引入上下文未提示的含义。
- source_word: סוּפָתָה
  choice: 暴风
  rationale: 该词指猛烈的风暴；“暴风”保留了从“风”到毁灭性风暴的递进，也符合现代汉语表达。
- source_word: יִקְצֹרוּ
  choice: 收割的将是
  rationale: 未完成式在这句审判格言中表达将来的结果；此句式也与前半句“播种的是”形成对称。
- source_word: קָמָה
  choice: 田间的禾稼
  rationale: 该词指田里尚未收割、直立生长的谷物；“田间的禾稼”既准确又便于普通读者理解。
- source_word: צֶמַח
  choice: 穗子
  rationale: 该名词通常可指萌芽或生长之物，但在谷物不能产面粉的语境中，所指很可能是能够结籽的穗子；脚注保留较宽泛的词义。
- source_word: בְּלִי יַעֲשֶׂה קֶּמַח
  choice: 产不出面粉
  rationale: 直截了当地表达庄稼不能产生可磨成面粉的收成，保留失败农作物的意象。
- source_word: אוּלַי
  choice: 即使
  rationale: 该词通常表示“或许”，在此引出一种让步性的可能：纵然有所产出，也会被外族人夺去；脚注保留直译可能。
- source_word: זָרִים
  choice: 外族人
  rationale: 指本群体之外的人，语境中尤其是外国人；“外族人”比“陌生人”更符合国家遭掠夺的背景。
- source_word: יִבְלָעֻהוּ
  choice: 会把它吞吃净尽
  rationale: 保留“吞下”的鲜明比喻，并以“净尽”传达彻底消耗、毫无剩余的意味。
theological_decisions:
- issue: 农业比喻的解释
  choice: 直接保留播种、收割、禾稼、面粉和吞吃的审判图景，不在正文中将各意象抽象化解释。
  alternative: 把“风”和“暴风”释译为虚空的行为与灾祸，或把外族人的吞吃明确解释为军事侵略。
  rationale: 经文本身借具体的农业格言呈现行为与后果之间的审判关系；保留意象可让其神学张力从原文自然显明，而不加入经文没有明说的寓意对应。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。前两分句保持格言式对称；后半句用自然农业用语呈现歉收与被掠夺的递进。正文中的[a]、[b]、[c]均与脚注对应。
