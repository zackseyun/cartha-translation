  text: זִבְחֵ֣י הַבְהָבַ֗/י יִזְבְּח֤וּ בָשָׂר֙ וַ/יֹּאכֵ֔לוּ יְהוָ֖ה לֹ֣א רָצָ֑/ם עַתָּ֞ה יִזְכֹּ֤ר עֲוֺנָ/ם֙ וְ/יִפְקֹ֣ד חַטֹּאותָ֔/ם הֵ֖מָּה מִצְרַ֥יִם יָשֽׁוּבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/013.yaml
  text: As for the sacrifices of my offerings[a], they sacrifice flesh and eat it, but Yahweh does not accept them. Now he will remember their iniquity and punish their sins[c][b]; they will return to Egypt.
translation:
  language: zh_hans
  text: 至于献给我的祭物[a]，他们献上肉，又吃肉；耶和华却不悦纳他们。如今，他要记起他们的罪孽，追讨他们的罪；他们必返回埃及。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用语罕见，直译近似“我供物的祭牲”；也可理解为“献给我的供物”，较不可能译作“我所爱的祭物”。
    reason: lexical_alternative
  - marker: b
    text: “返回埃及”可能指实际回到埃及，也可能借“埃及”表示再次落入奴役和流亡。
    reason: alternative_reading
lexical_decisions:
- source_word: זִבְחֵי הַבְהָבַי
  choice: 献给我的祭物
  rationale: 原文是一个罕见且较难解释的组合，直译近似“我供物的祭牲”。正文用自然中文表达其献给上帝的祭物之意，同时以脚注保留原文异常及其他可能理解。
- source_word: יִזְבְּחוּ בָשָׂר וַיֹּאכֵלוּ
  choice: 他们只管献上肉，又吃掉
  rationale: זבח表示献祭，בשר指祭牲的肉。“只管”传达该句对仅有献肉、吃肉之行为的贬抑语气，但不额外断定其内心动机。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中对四字神名最通行、最易识别的专名译法，不以“主”这一称号替代。
- source_word: לֹא רָצָם
  choice: 不悦纳他们
  rationale: רצה在献祭语境中指带着喜悦或认可而接纳；“悦纳”既符合祭祀语境，也保留“喜悦”与“接纳”两层含义。宾语后缀指向献祭者，故译作“他们”。
- source_word: יִזְכֹּר עֲוֺנָם
  choice: 要记起他们的罪孽
  rationale: 保留זכר“记起”的原文意象；在审判语境中，它含有不再放过、使人承担罪责之意。עון译作“罪孽”，兼顾罪行与罪责。
- source_word: וְיִפְקֹד חַטֹּאותָם
  choice: 追讨他们的罪
  rationale: פקד在此是司法性的临到、查究并惩处。“追讨”自然地表达问责和惩罚，也保留与前句“记起”的平行结构。
- source_word: הֵמָּה מִצְרַיִם יָשׁוּבוּ
  choice: 他们必返回埃及
  rationale: 保留明确地名“埃及”和שוב“返回”的措辞，不在正文中判定这是实际归回、象征再受奴役，还是二者兼有。המה的强调由独立主语“他们”体现。
theological_decisions:
- issue: “返回埃及”的含义
  choice: 他们必返回埃及
  alternative: 他们将再陷入如埃及般的奴役与流亡
  rationale: 希伯来文直接称“埃及”。正文保留地理名称和“返回”的出埃及逆转意象，不排除实际返回、象征性受奴役或两者兼有的可能。
- issue: 耶和华所不悦纳的对象
  choice: 不悦纳他们
  alternative: 不悦纳这些祭物
  rationale: רָצָם的阳性复数后缀在形式上更自然地指献祭的人；上下文虽涉及祭物，但译作“他们”可保留先知对敬拜者本身的审判。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“悦纳”“罪孽”“追讨”属于普通读者可理解的圣经语域。脚注标记均置于正文相应位置；将关于“返回埃及”的注脚放在该短语之后，避免英文资料中脚注标记错位。
