source:
  edition: WLC
  text: כִּ֤י מִ/יִּשְׂרָאֵל֙ וְ/ה֔וּא חָרָ֣שׁ עָשָׂ֔/הוּ וְ/לֹ֥א אֱלֹהִ֖ים ה֑וּא כִּֽי שְׁבָבִ֣ים יִֽהְיֶ֔ה עֵ֖גֶל שֹׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/006.yaml
  text: For it is from Israel[a]; a craftsman made it, and it is not God. Indeed[b], the calf of Samaria will become splinters.
translation:
  language: zh_hans
  text: 因为它出自以色列，是工匠造的，并不是神[a]。撒马利亚的牛犊必定成为碎片[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“根本算不得神。”希伯来文直译为“它不是神”，直接否定这偶像是真神。
    reason: lexical_alternative
  - marker: b
    text: 或译：“必被打得粉碎”或“必成为残片”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי（句首）
  choice: 因为
  rationale: 引出对上文斥责的解释或理由，保留其因果作用。
- source_word: מִיִּשְׂרָאֵל
  choice: 出自以色列
  rationale: מִן 表明来源；这里强调偶像源于以色列人自己。
- source_word: חָרָשׁ
  choice: 工匠
  rationale: 泛指有技艺的制造者，不限定为铁匠或其他特定工种。
- source_word: עָשָׂהוּ
  choice: 造的
  rationale: 自然表达 עשה 加第三人称阳性单数宾语后缀的意思。
- source_word: וְלֹא אֱלֹהִים הוּא
  choice: 并不是神
  rationale: 直接保留希伯来文对这偶像之神性的否定，同时避免加入后来的形而上术语。
- source_word: כִּי（后半句）
  choice: 实在
  rationale: 在此承接并加强对偶像结局的断言，适合表达强调语气。
- source_word: שְׁבָבִים
  choice: 碎片
  rationale: 表示破碎后的小块；中文“碎片”自然，并不武断限定偶像的材质。
- source_word: יִהְיֶה
  choice: 必化为
  rationale: 与结果性表语“碎片”连用，表达将要变成破碎残片的结局。
- source_word: עֵגֶל שֹׁמְרוֹן
  choice: 撒马利亚的牛犊
  rationale: 清楚表达附属关系，指与北国首都撒马利亚相关的牛犊偶像。
theological_decisions:
- issue: “并不是神”所否定的内容
  choice: 直接否定牛犊偶像是真神
  alternative: 译作“根本算不得神”或“并非神明”
  rationale: 原文直陈“它不是神”，重点是人手所造之物并无真实神性；直译可保留其先知性的论战力度，而不引入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“工匠”避免过度限定制作工艺；“碎片”既传达彻底毁坏，也不预设牛犊由木头制成。调整了脚注标记位置，使[a]紧随其实际说明的“并不是神”。
