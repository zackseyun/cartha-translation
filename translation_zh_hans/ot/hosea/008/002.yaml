base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/002.yaml
  text: To me they cry[a], ‘My God[b], we—Israel—know you!’
translation:
  language: zh_hans
  text: 他们向我呼求[a]：“我的上帝，我们——以色列——认识你[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“呼喊”。原文动词常带有在困境中急切求助的意味。
    reason: lexical_alternative
  - marker: b
    text: “认识你”在这里可能含有承认与上帝之关系的盟约意味，并不只是头脑上的知道。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: 向我
  rationale: 介词 ל 加第一人称单数后缀在这里表示呼求所指向的对象；“向我”自然地表明他们是在向上帝发声。
- source_word: יִזְעָקוּ
  choice: 呼求
  rationale: זעק 常指人在困境中急切呼喊、求助；“呼求”兼顾呼喊和求援的语气。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 该词带第一人称单数后缀，构成直接称呼；保留单数“我的”，不把以色列集体发言的张力改写为“我们的”。
- source_word: יְדַעֲנוּךָ
  choice: 我们认识你
  rationale: ידע 的基本义为“认识、知道”，在本书语境中也可涉及关系与盟约忠诚；正文保留简明直接的“认识”，不扩展为解释性的“承认”或“忠于”。
- source_word: יִשְׂרָאֵל
  choice: 我们——以色列——
  rationale: “以色列”置于第一人称复数动词之后，最适合作为说话者强调性的同位自称；破折号保留原文突兀而有力的自我标明。
theological_decisions:
- issue: “认识”在盟约语境中的含义
  choice: 正文译作“我们认识你”，并以脚注提示关系性和盟约意味。
  alternative: “我们承认你”或“我们与你立有约”
  rationale: 何西阿书中的“认识”常超出知识层面，但直接扩写会替读者判定以色列此话的全部含义，并削弱上下文揭露其宣称虚妄的张力。
- issue: “以色列”在引语中的句法角色
  choice: 视为说话群体的强调性同位语：“我们——以色列——”。
  alternative: 把“以色列”理解为被呼唤的对象，或另立为独立分句。
  rationale: 它紧随第一人称复数“我们认识你”，最自然地标明说话者身份，而不是另一个受话者。
- issue: 集体发言中的单数“我的上帝”
  choice: 保留“我的上帝”。
  alternative: 顺应集体说话者改为“我们的上帝”
  rationale: 希伯来文明确使用第一人称单数后缀；保留这一形式可呈现原文的修辞张力，避免无文本依据的协调。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“呼求”保留急切求助色彩；引语中的破折号呈现“以色列”作为强调性自称的突兀语序。脚注标记均置于正文相应词语之后。
