source:
  edition: WLC
  text: הֵ֤ם הִמְלִיכוּ֙ וְ/לֹ֣א מִמֶּ֔/נִּי הֵשִׂ֖ירוּ וְ/לֹ֣א יָדָ֑עְתִּי כַּסְפָּ֣/ם וּ/זְהָבָ֗/ם עָשׂ֤וּ לָ/הֶם֙ עֲצַבִּ֔ים לְמַ֖עַן יִכָּרֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/004.yaml
  text: They made kings, but not from me; they appointed princes, but I did not know it. With their silver and their gold they made idols for themselves, so that they might be cut off.
translation:
  language: zh_hans
  text: 他们立王，却不是出于我；他们设立首领，我却不知道。他们用自己的金银为自己制造偶像，以致被剪除。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִמְלִיכוּ
  choice: 立王
  rationale: 使役形表达“使某人成为王、拥立为王”；“立王”简洁自然，并保留政治行动的含义。
- source_word: וְלֹא מִמֶּנִּי
  choice: 却不是出于我
  rationale: מִמֶּנִּי字面为“从我”；这里指其王权安排并非出于上帝的授意或认可，保留原文“来源”措辞，不扩写为单一解释。
- source_word: הֵשִׂירוּ
  choice: 设立首领
  rationale: 该动词在此处与“立王”平行，表示任命官长；“首领”可涵盖官长、领袖或执政者，避免过度限定具体职位。
- source_word: וְלֹא יָדָעְתִּי
  choice: 我却不知情
  rationale: 直译“我不知道”；在上帝发言的语境中，“不知情”自然表达未参与、未认可，同时保留原文具有张力的认识性说法。
- source_word: עֲצַבִּים
  choice: 偶像
  rationale: 该词常指人手制造、用于敬拜的神像；现代汉语用“偶像”准确且易懂。
- source_word: לְמַעַן יִכָּרֵת
  choice: 以致被剪除
  rationale: לְמַעַן可表达目的或结果；“以致”保留结果性并避免断定他们主观制造偶像的目的就是自取灭亡。יִכָּרֵת为被动式，“被剪除”保留审判意象及主语未明的特点。
theological_decisions:
- issue: “不是出于我”是否应明确译成“未经我许可”或“不是我所立”
  choice: 不是出于我
  alternative: 不是我所立／没有经过我的许可
  rationale: 原文使用介词מִן（从、出于），没有明确说明仅指许可、命令或直接任命；较开放的表达保留其神学张力。
- issue: “我却不知情”是否暗示上帝缺乏知识
  choice: 保留认识性措辞“我却不知情”
  alternative: 我却不承认／我并未认可
  rationale: ידע可在盟约语境中含承认或认可之意，但原文直接使用“知道”；译文不把隐含含义完全替代字面表达，以免消解张力。
- issue: 末句表示目的还是结果
  choice: 以致被剪除
  alternative: 为要使他们被剪除
  rationale: לְמַעַן通常可引出目的，也能在此类审判语境中呈现结果。若直译成“为要”，容易误解为百姓制造偶像时主观意在灭亡；“以致”更符合上下文，同时不否认神圣审判的结果。
- issue: “被剪除”的主语
  choice: 不明说主语
  alternative: 使他们被剪除／使这些偶像被除灭
  rationale: יִכָּרֵת为阳性单数，形式上可能关联集合性的以色列，也有解释认为涉及金银或偶像；汉语省略主语可保留原文歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“立王／设立首领”保持平行结构；“出于我”“不知情”“被剪除”分别保留来源、认识和审判意象，避免加入原文没有明说的教义解释。
