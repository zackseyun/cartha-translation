  source_fidelity: 需修订。草稿将 כַּנֶּשֶׁר（“如鹰／像鹰一样”）译为“有鹰”，把明喻改成了一只实际的鹰，遗漏比较词。עַל בֵּית יְהוָה 的“上空／临到／攻击”歧义应继续保留；“仿佛有鹰飞临……上空”在现代汉语中可自然表达这一威胁性的鹰之意象，而不把“家”限定为圣殿或子民。
  naturalness: “把号角放到嘴边”自然且保有警报的急促感。“仿佛有鹰飞临雅威的家上空”比“有鹰临到雅威的家”更符合汉语，也恢复了原文的比较结构。将“背叛了我的训诲”改为“悖逆了我的律法”，与“悖逆／反叛”及本句的盟约—律法语境更贴切、搭配更自然。
