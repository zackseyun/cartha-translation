  text: אֶל חִכְּ/ךָ֣ שֹׁפָ֔ר כַּ/נֶּ֖שֶׁר עַל בֵּ֣ית יְהוָ֑ה יַ֚עַן עָבְר֣וּ בְרִיתִ֔/י וְ/עַל תּוֹרָתִ֖/י פָּשָֽׁעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/001.yaml
  text: Put the trumpet to your mouth! Like an eagle over the house of Yahweh[c][b][a], because they have transgressed my covenant and rebelled against my law.
translation:
  language: zh_hans
  text: 把号角放到嘴边！仿佛有鹰飞临雅威的家上空[a]，因为他们违背了我的约，又悖逆了我的律法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹰”也可译作“秃鹫”；希伯来语这个词可泛指大型猛禽。“飞临……上空”也可理解为“临到”或“攻击”。
    reason: lexical_alternative
  - marker: b
    text: “律法”也可译作“训诲”或“教导”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל חִכְּךָ שֹׁפָר
  choice: 把号角放到嘴边
  rationale: 原文是突兀的无动词短句，直译近于“号角到你的上腭”。汉语以命令句补出动作，保留具体意象和警报的紧迫感。
- source_word: כַּנֶּשֶׁר
  choice: 有鹰临到
  rationale: נֶשֶׁר泛指大型猛禽，可译“鹰”或“秃鹫”；正文采用较通行的“鹰”，脚注保留物种上的不确定性。介词短语在本句中可构成突兀的警报宣告；“临到”既容纳飞临其上的空间图景，也保留敌对来袭的意味。
- source_word: עַל בֵּית יְהוָה
  choice: 临到雅威的家
  rationale: עַל可表示在……之上、临到或攻击。译作“临到”避免把空间与敌对意味限定得过死；“雅威的家”保留其可能指圣所、土地或圣约群体的歧义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，不用称号替代专名。
- source_word: עָבְרוּ בְרִיתִי
  choice: 违背了我的约
  rationale: עָבְרוּ字面有“越过”之意，但与“约”搭配时表示越界、违反；“违背了我的约”在现代汉语中自然准确，并保留有意破坏圣约义务的力度。
- source_word: תּוֹרָתִי
  choice: 我的训诲
  rationale: תּוֹרָה可指律法、教导或训诲。此处虽有圣约诉讼色彩，但“训诲”较能保留其宽泛语义，避免仅理解为成文法规。
- source_word: פָּשָׁעוּ
  choice: 背叛了
  rationale: פָּשַׁע表示蓄意反叛，不只是无意犯错。“背叛”在汉语中能表达对雅威权威及其训诲的关系性抗拒。
theological_decisions:
- issue: “雅威的家”的所指
  choice: 保留“雅威的家”这一字面表达
  alternative: 明确译为“雅威的圣殿”或“雅威的子民”
  rationale: 上下文不足以排除圣所、土地或圣约群体等指向，故不在正文中替读者作神学限定。
- issue: 猛禽与“雅威的家”的关系
  choice: 译为“有鹰临到雅威的家”
  alternative: “如鹰飞在雅威的家上空”或“如鹰攻击雅威的家”
  rationale: 希伯来文极为简练，עַל兼有空间及敌对可能。“临到”保留审判迫近的威胁，同时不强行确定具体动作。
- issue: תּוֹרָה的语义范围
  choice: 训诲
  alternative: 律法
  rationale: “训诲”保留神所赐教导的宽广含义；本句与“约”平行，仍可自然承载规范和审判层面的力度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。首句保持先知警报式的短促语气；次句保留原文的突兀和威胁感，不把“雅威的家”具体化。
