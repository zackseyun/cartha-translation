base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/005.yaml
  text: He has rejected your calf[a], O Samaria; my anger burns against them[b]. How long will they be incapable of innocence?
translation:
  language: zh_hans
  text: 他已经弃绝了你的牛犊[a]，撒马利亚；我的怒气向他们发作。他们到几时才能清白无罪[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的牛犊已经抛弃你了，撒马利亚。”希伯来语句法容许把“牛犊”理解为开头动词的主语；正文则把隐含的主语理解为上帝。
    reason: alternative_reading
  - marker: b
    text: “清白无罪”也可译为“纯洁”或“洁净”。原词既可涉及道德上的无罪，也可带有礼仪洁净的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
  choice: 弃绝
  rationale: 该动词表示拒绝、抛弃或厌弃。“弃绝”既保留先知宣告的力度，也适合上帝拒绝偶像的语境。
- source_word: עֶגְלֵךְ
  choice: 你的牛犊
  rationale: 原文直译为“你的牛犊”，在上下文中指撒马利亚的牛犊偶像；正文保留原有形象，不直接扩写为“牛犊偶像”。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚啊
  rationale: 此处撒马利亚受到直接呼告；语气词“啊”自然表达呼格。
- source_word: חָרָה אַפִּי
  choice: 我的怒火……燃烧
  rationale: 希伯来语习语以“鼻子／怒气发热”表达烈怒。译文保留“燃烧”的比喻，同时避免生硬直译身体意象。
- source_word: בָּם
  choice: 向他们
  rationale: 与发怒的习语连用时表示怒气所针对的对象。复数“他们”大概指参与偶像崇拜的人，而不只指单数的城。
- source_word: עַד מָתַי
  choice: 到几时
  rationale: 这是希伯来语常见的持续时间问句；“到几时”简洁而庄重。
- source_word: לֹא יוּכְלוּ
  choice: 还不能
  rationale: 未完成式处在反问句中，表达持续至今的无能或不肯达到；“还不能”自然体现这种延续性。
- source_word: נִקָּיוֹן
  choice: 清白无罪
  rationale: 此名词兼有洁净、纯洁和无罪的含义。“清白无罪”在现代汉语中通顺，并主要呈现此处的道德含义；脚注保留礼仪洁净层面的可能性。
theological_decisions:
- issue: 开头动词 זָנַח 的主语
  choice: 以上帝为省略的主语：“我已经弃绝你的牛犊”
  alternative: 以“你的牛犊”为主语：“你的牛犊已经抛弃你了，撒马利亚啊”
  rationale: 希伯来语句法容许两种分析。后句转为上帝第一人称说“我的怒火”，因此正文将上帝理解为前句省略的主语，并在中文中用“我”明确表达；不过原文的句法歧义值得在脚注中保留。
- issue: נִקָּיוֹן 的道德与礼仪含义
  choice: 正文译为“清白无罪”
  alternative: 可译为“纯洁”或“洁净”
  rationale: 本节谴责偶像崇拜，既涉及罪责，也可能带有礼仪污秽的意味。正文采用自然的道德表述，脚注说明较宽的语义范围，不排除礼仪层面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“撒马利亚啊”保留先知直接呼告的语气；“怒火……燃烧”保存希伯来语的火焰意象。问句不补入“做到”或“学会”等原文没有明说的内容，以保留末句略显压缩的表达和神学张力。
