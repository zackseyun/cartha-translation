  text: כִּֽי הֵ֨מָּה֙ עָל֣וּ אַשּׁ֔וּר פֶּ֖רֶא בּוֹדֵ֣ד ל֑/וֹ אֶפְרַ֖יִם הִתְנ֥וּ אֲהָבִֽים־
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/009.yaml
  text: For they have gone up to Assyria[a], like a wild donkey wandering alone[b]; Ephraim has hired lovers.
translation:
  language: zh_hans
  text: 因为他们上到亚述，如同一头独自离群的野驴[a]；以法莲雇了情人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“如同”。“野驴，独自离群”也可按与以法莲有关的压缩同位性描述来理解。
    reason: 句法关系与比喻标记在原文中含有歧义。
  - marker: b
    text: “情人”保留何西阿所用的盟约不忠隐喻；在这里具体指以法莲寻求并付代价取得的外国盟友。
    reason: 说明隐喻的政治所指，同时避免在正文中将隐喻解释掉。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明前述指控的缘由；“因为”在现代汉语中自然地保留因果关系。
- source_word: הֵמָּה
  choice: 他们
  rationale: 明示复数主语。希伯来语代词略带强调，但中文无需另加“他们自己”，以免强调过度。
- source_word: עָלוּ
  choice: 上到
  rationale: 保留动词“上去、上行”的基本意象，也符合前往亚述的叙述表达。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 采用该古代国家的现代汉语标准译名。
- source_word: פֶּרֶא
  choice: 野驴
  rationale: 指不受驯服的野驴；译法简明、现代，并保留先知鲜明的动物意象。
- source_word: בּוֹדֵד לוֹ
  choice: 独来独往
  rationale: 该短语强调独处、离群的状态。“独来独往”是自然的现代汉语，既表现孤立，也与野驴的动态形象相称；脚注交代更贴字面的译法。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 采用该支派及北国代称的通行汉语译名。
- source_word: הִתְנוּ
  choice: 雇用了
  rationale: 该动词表示以代价雇取或获取。“雇用了”保留付费取得关系的含义，并与下文“情人”形成先知刻意使用的反常表达。
- source_word: אֲהָבִים
  choice: 情人
  rationale: 直译为“情人、爱人”。保留何西阿书婚姻与性关系的隐喻，不直接改译成“盟友”，以免削弱对盟约不忠的谴责。
theological_decisions:
- issue: 以婚姻或性关系隐喻对外结盟
  choice: 译作“雇用了情人”，明确保留原文隐喻。
  alternative: 译作“花钱雇了盟友”或“收买盟国”。
  rationale: 何西阿反复以不忠的婚姻和卖淫意象描写以色列背弃盟约。上下文中的亚述表明其政治所指，但正文不应以解释取代先知的隐喻。
- issue: 野驴意象与句法关系
  choice: 用“像”将“独来独往的野驴”理解为对他们前往亚述之举的比喻。
  alternative: 按并列或断裂句法译为“他们上到亚述；一头独自离群的野驴；以法莲雇用了情人”。
  rationale: 原文没有显式的比较词，句法较为压缩；补出“像”使汉语可读，并表达最可能的比喻关系，同时用脚注保留原文可按同位或断裂结构理解的余地。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“独来独往”使野驴意象自然鲜明；“雇用了情人”刻意保留原文突兀而有谴责力的措辞。标点将前后两个意象性分句分开，又维持整节紧凑的先知语气。
