  text: אכתוב ל֔/וֹ רבו תּֽוֹרָתִ֑/י כְּמוֹ זָ֖ר נֶחְשָֽׁבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/012.yaml
  text: Though I wrote for him the many things of my law[a], they were regarded as something foreign.
translation:
  language: zh_hans
  text: 我虽为他写下我律法的万千教导[a]，它们却被视为外来的事物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“即使我为他写下我训诲的万千条目，它们也会被视为外来的。”希伯来语开头的动词可理解为未完成、将来或假设语气；“律法”也可译作“训诲”或“妥拉”。
    reason: 保留אכתוב的时态／语气歧义，以及תורה和רבו的词义替代方案。
lexical_decisions:
- source_word: אכתוב
  choice: 我虽……写下
  rationale: 该词是כתב的Qal未完成式第一人称单数；结合上下文，可作指向既有赐教行动的修辞性未完成式。用“虽……写下”自然呈现前后分句的让步对比，同时不把它硬性处理为简单将来时。
- source_word: לוֹ
  choice: 为他
  rationale: 介词ל加第三人称阳性单数词尾可表示“给他”或“为他”。“为他”保留受益含义和原文的单数形式；上下文中的“他”是对以色列／以法莲的集体单数称呼。
- source_word: רבו
  choice: 万般
  rationale: 此处表达数量繁多。与“教导”搭配译为“万般”，既传达丰富众多，也避免把可能表示“万千／无数”的形式机械地限定为具体数目。
- source_word: תּוֹרָתִי
  choice: 我律法的……教导
  rationale: תורה兼有“律法”“训诲／教导”的含义。正文采用复合表达，既保留圣约语境中的“律法”，又让现代读者听出其教导性质。
- source_word: כְּמוֹ זָר
  choice: 看作外来的东西
  rationale: כמו引出比较，זר可指外来的、陌生的。此译表达他们把上帝的教导当成与自己无关、仿佛属于外人的东西。
- source_word: נֶחְשָׁבוּ
  choice: 被看作
  rationale: 这是חשב的Niphal完成式第三人称复数，表示被动的判断或评价；“被看作”自然保留其被动意义。
theological_decisions:
- issue: לוֹ的单数所指
  choice: 保留“他”，按上下文理解为以色列／以法莲这一群体的单数称呼
  alternative: 直接明说“以色列”或改用复数“他们”
  rationale: 何西阿书常以阳性单数称呼整个民族。保留单数较忠实，也不在正文中加入原文没有明说的名称。
- issue: אכתוב的时态和语气
  choice: 译作让步性的既往行动：“我虽……写下”
  alternative: “即使我为他写下万千教导，也会被看作外来的”或“我为他写”
  rationale: 希伯来语未完成式容许未完成、反复、将来或修辞性理解；上下文强调上帝已经丰富赐下教导而以色列仍予以疏远。脚注保留条件／将来式的真实可能。
- issue: תורה的表达
  choice: “我律法的万般教导”
  alternative: “我的训诲”“我的妥拉”
  rationale: 该词既有规范性的圣约律法内涵，也有教导含义。复合表达尽量保存二者张力，而不把它缩窄为现代法典概念或未经解释的音译术语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“万般教导”避免生硬的“万条律法”，并与“律法”组成兼顾规范和训诲含义的表达；“外来的东西”清楚表现以色列把本属其圣约生活的教导视为陌生之物。
