  text: זָנַ֥ח יִשְׂרָאֵ֖ל ט֑וֹב אוֹיֵ֖ב יִרְדְּֽפ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/003.yaml
  text: Israel has rejected the good[a]; an enemy will pursue him.
translation:
  language: zh_hans
  text: 以色列弃绝了良善[a]；仇敌必追赶他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“美善之事”。希伯来文也可较直译为“善”。
    reason: 词汇替代译法：טוֹב为名词化形容词，可表达抽象的“善”，也可按语境译为“美善之事”。
lexical_decisions:
- source_word: זָנַח
  choice: 弃绝了
  rationale: 该动词表示拒绝、抛弃；“弃绝”简洁有力，保留主动决绝的意味，并符合庄重的先知文体。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 标准专名译法；此处指被拟人化为单数的民族。
- source_word: טוֹב
  choice: 良善
  rationale: 此处形容词作名词使用。“良善”自然地保留其宽泛的道德与宗教含义，也没有擅自限定为某一件具体的好事。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 希伯来文单数无冠词，可作泛指；汉语“仇敌”无需冠词，既保留单数形式，也不擅自确定其身份。
- source_word: יִרְדְּפוֹ
  choice: 必追赶他
  rationale: 未完成式在本先知语境中表示即将发生的后果；“必”体现预告的确定性，阳性单数宾语后缀译为“他”，保留以色列作为单数人格化民族的语法形象。
theological_decisions:
- issue: יִרְדְּפוֹ中宾语后缀的所指与数
  choice: 译作单数“必追赶他”，将以色列视为人格化的单数民族。
  alternative: 译作“必追赶他们”，按集合意义处理以色列。
  rationale: 希伯来文后缀是第三人称阳性单数。保留“他”忠实呈现原文语法和先知性的拟人表达，而不按汉语集合意义将其平滑为复数。
- issue: טוֹב的名词化表达
  choice: 译作“良善”，保留抽象而宽泛的含义。
  alternative: 译作“美善之事”或“那美善者”。
  rationale: 原文可以理解为名词化的“善/良善”，其具体所指并未明说；译文不把它缩窄为特定事物，也不引入未经原文明确支持的神学指称。
translation_notes:
  register: 采用现代、庄重而简洁的标准普通话。“弃绝”保留先知责备的力度；分号呈现拒绝良善与遭敌追赶之间紧密的后果关系。正文中的[a]与脚注标记一致。
