  yaml_path: translation/ot/hosea/013/005.yaml
  text: I knew you in the wilderness[b][a], in a land of severe drought.
translation:
  language: zh_hans
  text: 我曾在旷野认识你[a]，在极其干旱之地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“眷顾你”或“承认你”。希伯来语“认识”在这里可能不只表示知道，也带有关系性或圣约性的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“在焦灼之地”、“在干渴之地”或“在枯旱之地”。原文此词罕见，可指酷热、干渴或极度干燥。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַעְתִּיךָ
  choice: 认识你
  rationale: ידע的基本义是“知道、认识”；在此也可能含有关系性或圣约性的承认与眷顾。“认识你”保留词义核心，不在正文中把隐含意味解释得过满。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר可指旷野或荒漠；“旷野”自然承接何西阿书中的出埃及背景，也保留常见的圣经语汇。
- source_word: בְּאֶרֶץ
  choice: 在……之地
  rationale: 该介词短语直译为“在一片……之地”；汉语采用“在……之地”更自然庄重，无须补出定冠意义。
- source_word: תַּלְאֻבוֹת
  choice: 极其干旱
  rationale: 这是罕见词，可能表示焦灼、干渴或枯旱的状态；“极其干旱”以现代汉语清楚表达其强烈的干燥与缺水意味，同时在脚注保留其他可能。
theological_decisions:
- issue: 上帝“认识”以色列的关系性含义
  choice: 正文采用“认识你”，让关系性、圣约性的意味由上下文显明
  alternative: “眷顾你”或“承认你”
  rationale: 经文很可能唤起上帝在旷野中对以色列的拣选、承认和照顾，但希伯来动词的明示词义仍是“认识”。正文不把这种神学含义单一化，脚注列出合理译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“旷野”保留出埃及传统的经文呼应；“极其干旱”清楚传达罕见名词的强烈程度。脚注标记均紧随其所解释的词语。
