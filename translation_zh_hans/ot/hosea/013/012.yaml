  yaml_path: translation/ot/hosea/013/012.yaml
  text: Ephraim’s iniquity is bound up[a]; his sin is stored up.
translation:
  language: zh_hans
  text: 以法莲的罪孽被捆束；他的罪被藏起来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被藏起来”也可译为“被存留”或“被储藏”。希伯来语可指隐藏，也可指留存、储藏；在这里的审判语境中，可能表示以法莲的罪被保留下来，等候日后的追讨。
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוּר
  choice: 被捆扎起来
  rationale: 该词是צרר的被动分词，描绘被扎紧、包束并保存的事物。“被捆扎起来”保留具体比喻，也与下句“被收藏起来”形成平行。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: עָוֹן可指罪孽、罪责，有时也可指罪所招致的刑罚；本节与“罪”平行，较自然地指道德过犯，同时仍带有罪责的分量。
- source_word: אֶפְרָיִם
  choice: 以法莲的
  rationale: 按现代汉语通行译名音译该专名，并用“的”自然表达其与“罪孽”的所属关系。
- source_word: צְפוּנָה
  choice: 被收藏起来
  rationale: צפן的被动分词可表示被隐藏、珍藏或留存；在审判语境中，“被收藏起来”既保留储存留置的意象，也不在正文中明说其将如何被追讨。
- source_word: חַטָּאתוֹ
  choice: 他的罪
  rationale: חַטָּאת在此指“罪”，而非“赎罪祭”；第三人称阳性单数后缀译作“他的”，回指作为集体单数的以法莲。
theological_decisions:
- issue: 罪孽被保存这一比喻的审判含义
  choice: 保留“捆扎起来／收藏起来”的双重意象，暗示罪没有被除去，而是被留存。
  alternative: 可将第二分句理解为罪被隐藏，不一定强调留待日后追讨。
  rationale: 两个被动分词在何西阿书的审判语境中共同指向罪责被保存，但原文没有在本节明说未来追讨的具体方式，因此正文不把这一推论解释得过满。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“罪孽／罪”保留希伯来诗句的近义平行；“捆扎起来／收藏起来”保持两个被动分词的对应及其具体意象。脚注标记置于整节末尾，说明第二个比喻的词义幅度。
