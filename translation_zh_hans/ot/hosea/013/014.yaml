language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ/יַּ֤ד שְׁאוֹל֙ אֶפְדֵּ֔/ם מִ/מָּ֖וֶת אֶגְאָלֵ֑/ם אֱהִ֨י דְבָרֶי/ךָ֜ מָ֗וֶת אֱהִ֤י קָֽטָבְ/ךָ֙ שְׁא֔וֹל נֹ֖חַם יִסָּתֵ֥ר מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/014.yaml
  text: From the hand of Sheol I will ransom them[a]; from death I will redeem them. O Death, where are your plagues? O Sheol[c][b], where is your destruction? Compassion will be hidden from my eyes.
translation:
  language: zh_hans
  text: 我必从阴间的手中赎回他们[a]，从死亡中救赎他们。死亡啊，你的瘟疫在哪里？阴间啊[c][b]，你的毁灭在哪里？怜悯必从我眼前隐藏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要从阴间的手中赎回他们吗？我要从死亡中救赎他们吗？”即把开头两句理解为表示审判、拒绝施救的反问。
    reason: alternative_reading
  - marker: b
    text: 希伯来语 אֱהִי 也可理解为“我要成为”或“愿我成为”，因而可译：“死亡啊，我要成为你的瘟疫；阴间啊，我要成为你的毁灭。”
    reason: alternative_reading
  - marker: c
    text: 受希腊文传统影响的传统译法是：“死亡啊，你的毒钩在哪里？阴间啊，你的得胜（或毒钩）在哪里？”参哥林多前书15:55。
    reason: cross_reference
lexical_decisions:
- source_word: מִיַּד
  choice: 从……的手中
  rationale: 保留希伯来文具体的“手”这一意象；在此也自然表达权势或掌控。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 指死者所在之境，不只是坟墓；“阴间”是现代中文圣经语境中较自然且范围相称的表达。
- source_word: אֶפְדֵּם
  choice: 我要……赎回他们
  rationale: פדה含从危险或辖制中付代价赎出的意味；译作“赎回”并与下句גאל的“救赎”略作区分。
- source_word: מִמָּוֶת
  choice: 从死亡中
  rationale: 直接表达介词短语，并与“从阴间的手中”构成平行。
- source_word: אֶגְאָלֵם
  choice: 救赎他们
  rationale: גאל常带有亲属或盟约背景下施行救赎的意味；“救赎”简洁自然，并保留与前句近义而不完全相同的用词。
- source_word: אֱהִי
  choice: 在哪里
  rationale: 此形式存在著名歧义；按呼唤死亡与阴间的嘲讽式平行句，疑问义通顺，但“我要成为／愿我成为”的读法保留在脚注中。
- source_word: דְבָרֶיךָ
  choice: 你的瘟疫
  rationale: 此处宜理解为致命的疫病或灾害；“瘟疫”与死亡的拟人化及下句“毁灭”相配。
- source_word: קָטָבְךָ
  choice: 你的毁灭
  rationale: קטב表示毁坏、灭绝或致命灾害；“毁灭”直接而庄重，避免把后期传统中的“毒钩”倒置进希伯来文本。
- source_word: נֹחַם
  choice: 怜悯
  rationale: 该词可指怜惜、回心或撤回行动；此处译作“怜悯”，表达不因怜惜而中止所宣告之事，同时不排除“改变心意”的语义背景。
- source_word: יִסָּתֵר מֵעֵינָי
  choice: 必从我眼前隐藏
  rationale: 保留尼法勒未完成式的将来指向及原文“从我眼前隐藏”的意象。
theological_decisions:
- issue: 开头两个分句是拯救的应许，还是表示拒绝施救的反问
  choice: 正文译作拯救的陈述，随后是对死亡和阴间的嘲问
  alternative: 译作审判性的反问：“我要从阴间的手中赎回他们吗？我要从死亡中救赎他们吗？”
  rationale: 两个第一人称未完成式可自然读作陈述，后文也可理解为向死亡与阴间发出的得胜嘲问；但上下文审判语气使反问读法确有分量，因此以脚注保存，不消除原文张力。
- issue: אֱהִי在向死亡和阴间说话时的语法意义
  choice: 理解为疑问：“在哪里？”
  alternative: 理解为将来或意愿：“我要成为／愿我成为”
  rationale: 疑问读法形成整齐的嘲问平行句，并与本节后来的希腊文接受史相合；然而希伯来文形式也可支持将来或意愿读法，故列入脚注。
- issue: 是否按哥林多前书15:55的传统措辞翻译
  choice: 正文优先直译马所拉希伯来文本的“瘟疫／毁灭”
  alternative: 按希腊传统译作“死亡啊，你的毒钩在哪里？阴间啊，你的得胜（或毒钩）在哪里？”
  rationale: 新约引用对本节的接受史十分重要，却不应取代何西阿书现存希伯来文本的直接词义；传统读法以交叉引用脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“阴间”表达שְׁאוֹל，以保持其作为死者之境的概念范围；正文保留诗歌的平行、拟人呼语和“手／眼前”等具体意象。所有真实语法歧义及与新约接受史有关的传统译法均用脚注呈现。
