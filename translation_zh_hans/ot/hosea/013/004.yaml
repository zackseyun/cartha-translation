  text: וְ/אָנֹכִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וֵ/אלֹהִ֤ים זֽוּלָתִ/י֙ לֹ֣א תֵדָ֔ע וּ/מוֹשִׁ֥יעַ אַ֖יִן בִּלְתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/004.yaml
  text: But I am Yahweh your God from the land of Egypt[a]; you know no God besides me[b], and there is no savior except me.
translation:
  language: zh_hans
  text: 然而，从埃及地以来[a]，我是雅威——你的神；除我以外，你不认识别的神[b]；除我以外，并没有拯救者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从埃及地出来”。这句希伯来语既可强调雅威自出埃及以来一直与以色列有关系，也可强调他把以色列从埃及领出来的拯救行动。
    reason: lexical_alternative
  - marker: b
    text: 或译“除我以外，你不可承认别的神”。这里的希伯来语动词既可作陈述，也可带有盟约性的命令或禁止意味。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: 然而，……我
  rationale: 连词与强调性第一人称代词在上下文中带有对比意味；“然而”自然表达这种转折，并保留“我”的强调。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，以保留以色列之神的专名，而不以称号代替。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 此处与雅威之名连用，并带第二人称阳性单数后缀，语义为单数，表达盟约关系。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地以来
  rationale: מִן 可带起点、来源或离开的意味。正文采用时间起点的自然汉语表达，同时以脚注保留“从埃及地出来”所强调的拯救行动。
- source_word: וֵאלֹהִים זוּלָתִי
  choice: 除我以外……别的神
  rationale: זוּלָתִי 表示排除；אֱלֹהִים 虽具复数词形，此处在排他性否定句中宜按不定单数理解。
- source_word: לֹא תֵדָע
  choice: 你不认识
  rationale: 保留 ידע 的“认识”语义及未完成式可能具有的陈述力；脚注说明它也可带盟约性的命令或禁止意味。
- source_word: וּמוֹשִׁיעַ אַיִן בִּלְתִּי
  choice: 除我以外，并没有拯救者
  rationale: 分词 מוֹשִׁיעַ 指施行拯救者；אַיִן 与 בִּלְתִּי 共同构成强烈的存在否定和排他陈述。
theological_decisions:
- issue: 雅威独一的神性与拯救
  choice: 将本节译为雅威基于出埃及历史所作的排他性宣告：以色列在他以外没有别的神，也没有别的拯救者。
  alternative: 中间一句也可理解为盟约命令：“除我以外，你不可承认别的神。”
  rationale: 希伯来文同时具有事实宣告与盟约要求的张力。正文保留“认识”的直译，脚注交代命令性读法，不把经文扩展为本节未明说的后期教义公式。
- issue: “从埃及地”所指的关系
  choice: 正文理解为从埃及经历以来，雅威一直是以色列的神。
  alternative: 也可着重于雅威把以色列从埃及地领出来的拯救行动。
  rationale: 介词短语本身容许时间起点和来源／离开两方面的联想；脚注保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威”保留神名；“拯救者”既贴近原文分词，也比“救主”较少预先带入后期术语色彩。平行的“除我以外”凸显原文两重排他宣告。
