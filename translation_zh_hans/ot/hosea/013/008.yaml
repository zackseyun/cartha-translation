base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/008.yaml
  text: I will attack them like a bear robbed of her cubs[a], and I will tear open the enclosure of their heart; there I will devour them like a lioness[b]; a wild beast of the field will rip them apart.
translation:
  language: zh_hans
  text: 我要像失去幼崽的母熊一样袭击他们，撕开他们心脏的外层[a]；我要在那里像母狮[b]吞吃他们；田野的野兽要把他们撕裂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们心脏的遮盖”，可能指“胸膛”或“胸部”。这里的希伯来语短语罕见，含义难定。
    reason: lexical_alternative
  - marker: b
    text: 或译“狮子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְגְּשֵׁם
  choice: 我要……袭击他们
  rationale: פגשׁ本义可指“遇见、迎上”，但这里处于猛兽施行审判的语境，“袭击”能在现代汉语中自然传达其敌对意味。
- source_word: כְּדֹב שַׁכּוּל
  choice: 像丧子的母熊一样
  rationale: שַׁכּוּל指失去儿女或幼崽；“丧子的母熊”简洁保留母兽失去幼崽后的凶猛形象。
- source_word: וְאֶקְרַע
  choice: 撕开
  rationale: קרע意为撕裂；“撕开”既贴近原义，也与后面的身体意象相称。
- source_word: סְגוֹר לִבָּם
  choice: 他们心脏的包层
  rationale: סְגוֹר表示封闭、围住之物；该罕见短语含义不确定。“包层”保留围住心脏之物的意象，避免在正文中直接释为“胸膛”。
- source_word: וְאֹכְלֵם שָׁם
  choice: 我要在那里……吞吃他们
  rationale: אכל在猛兽语境中译作“吞吃”自然有力；同时明确保留שָׁם“在那里”。
- source_word: כְּלָבִיא
  choice: 像母狮
  rationale: לָבִיא可指成年狮子，也可理解为母狮；结合前面的母熊意象，正文采用“母狮”，并以脚注保留“狮子”这一可能。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野的野兽
  rationale: 保留单数结构及原文“田野”的表达，并清楚传达未经驯服的猛兽形象。
- source_word: תְּבַקְּעֵם
  choice: 必将他们撕裂
  rationale: בקע意为劈开、裂开；在野兽攻击的语境中，“撕裂”既有分裂开的力度，也符合现代汉语表达。
theological_decisions:
- issue: 上帝以捕食猛兽自述审判行动
  choice: 保留第一人称的直接行动和猛烈的动物比喻，不加弱化。
  alternative: 将这些意象概括为较温和的“惩罚”或“审判”。
  rationale: 希伯来文明确把圣约审判描述为上帝亲自发出的猛兽式攻击；译文应保留这种严厉而令人不安的神学张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。以“袭击、撕开、吞吃、撕裂”保留原文连续而强烈的猛兽意象；对罕见短语סְגוֹר לִבָּם不作过度解释，并用脚注说明主要可能。
