  to: 我要像失去幼崽的母熊一样袭击他们，撕开他们心脏的外层[a]；我要在那里像母狮[b]吞吃他们；田野的野兽要把他们撕裂。
  rationale: 修订仅处理现代汉语的自然性和动物意象的明确性：“包层”改为“外层”，并由脚注继续说明该罕见短语可能指胸膛；“丧子的母熊”改为“失去幼崽的母熊”；末句改为自然的“把”字结构。保留“母狮”及其替代译法脚注，未消除原文词义争议。
