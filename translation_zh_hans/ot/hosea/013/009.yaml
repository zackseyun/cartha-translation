  yaml_path: translation/ot/hosea/013/009.yaml
  text: You have destroyed yourself[a], Israel, because your help is in me.
translation:
  language: zh_hans
  text: 以色列啊，他毁灭了你[a]，因为你的帮助在于我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文十分难解。开头按马所拉文本的标音可理解为“他毁灭了你”，但主语未明说。也可译作：“以色列啊，你自取灭亡，因为你的帮助在于我。”也有人按名词性理解为：“以色列啊，你的毁灭……”
    reason: 保留שִׁחֶתְךָ可能的反身理解和名词性理解，并说明正文所采用动词性理解中隐含主语的不确定性。
lexical_decisions:
- source_word: שִׁחֶתְךָ
  choice: 他毁灭了你
  rationale: 按马所拉文本的元音标注，此形式最自然地理解为שׁחת的皮埃勒完成式第三人称阳性单数，带第二人称阳性单数宾语后缀。希伯来文未明说主语，中文以“他”补出隐含主语，同时在脚注保留反身及名词性理解。
- source_word: יִשְׂרָאֵל
  choice: 以色列啊
  rationale: 保留专名，并用“啊”自然表达呼语。
- source_word: כִּי
  choice: 因为
  rationale: 按因果用法处理，引出前句的理由或解释；虽然整句关系难解，但不擅自改成转折。
- source_word: בִי
  choice: 在于我
  rationale: 保留介词“在……里面／在……那里”的基本意义，并以现代中文“在于我”表达帮助的来源在上帝。
- source_word: בְעֶזְרֶךָ
  choice: 你的帮助
  rationale: עֵזֶר是“帮助、援助”，保留名词表达，不扩写为“我必帮助你”或“你的帮助者”。
theological_decisions:
- issue: 本节开头及两分句关系的解释
  choice: 正文依照马所拉文本的元音标注，译作“他毁灭了你”，并将כִּי译为因果性的“因为”。
  alternative: “你自取灭亡，以色列啊，因为你的帮助在于我”；或“以色列啊，你的毁灭在于你敌对我、敌对你的帮助者”。
  rationale: 希伯来文句法高度压缩，开头既可按现有标音理解为带第二人称宾语的动词，也常被理解为反身句或名词性短语。正文不补入原文没有明说的反身意义；脚注则保留主要异读，以免消除经文本身的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“他毁灭了你”刻意保留原文隐含主语所造成的突兀感；“你的帮助在于我”保留原文名词结构及神学张力。脚注标记[a]已置于正文对应位置。
