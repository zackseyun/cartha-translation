  text: כְּ/דַבֵּ֤ר אֶפְרַ֨יִם֙ רְתֵ֔ת נָשָׂ֥א ה֖וּא בְּ/יִשְׂרָאֵ֑ל וַ/יֶּאְשַׁ֥ם בַּ/בַּ֖עַל וַ/יָּמֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/001.yaml
  text: When Ephraim spoke[a], there was trembling; he was exalted in Israel[b]. But he became guilty through Baal and died.
translation:
  language: zh_hans
  text: 以法莲一开口，人就战战兢兢；他在以色列中被尊为大[a]。可是，他因巴力[b]而获罪，就死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被尊为大”也可译作“自高”或“抬高自己”。希伯来语此句十分简略，既可理解为被动或结果，也可能带主动反身的意思。
    reason: alternative_reading
  - marker: b
    text: “因巴力”也可理解为“因敬拜巴力”或“在与巴力的关系上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר
  choice: 一开口
  rationale: כְּ 加不定词构成时间从句；“一开口”自然凝练，表达“当……说话时”的时间关系。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 保留专名；在何西阿书中可代表北国，但正文不将其解释性扩写。
- source_word: רְתֵת
  choice: 人就战战兢兢
  rationale: 该名词表示颤抖、战栗；补出泛指的“人”使中文句法完整，同时不限定这是恐惧、敬畏还是政治上的震慑。
- source_word: נָשָׂא הוּא בְּיִשְׂרָאֵל
  choice: 他在以色列中被尊为大
  rationale: 希伯来语短句高度压缩；此译采用被动／结果义，表达以法莲在以色列中地位尊崇，同时以脚注保留主动反身的可能。
- source_word: וַיֶּאְשַׁם
  choice: 获罪
  rationale: אשם 表示成为有罪或招致罪责；“获罪”简洁而保留道德与盟约审判的力度。
- source_word: בַּבַּעַל
  choice: 因巴力
  rationale: 介词 בְּ 可表原因、凭借或关联；“因巴力”保留与巴力相关而获罪的简练表达，不在正文添加原文没有的“崇拜”一词。
- source_word: וַיָּמֹת
  choice: 就死了
  rationale: 直译其鲜明后果；不预先判定这里的死是个人肉身之死、属灵之死，还是北国政治性的灭亡。
theological_decisions:
- issue: 以法莲在以色列中兴起的语态
  choice: 被尊为大
  alternative: 自高／抬高自己
  rationale: נָשָׂא הוּא 的句法简约，容许被动结果义或主动反身义。正文采用较合乎此处传统句法理解的被动表达，脚注明确保存另一可能，不借先知的谴责语气强行消除歧义。
- issue: “死了”的所指
  choice: 不加限定地译作“死了”
  alternative: 明确解释为北国政治灭亡、属灵死亡或个人肉身死亡
  rationale: 上下文指向以法莲／北国因巴力获罪而受审判，但本节本身没有说明“死”的具体层面，因此保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“战战兢兢”保留 רְתֵת 的鲜明感；“被尊为大”避免生硬直译。所有脚注标记均置于相关正文之后。
