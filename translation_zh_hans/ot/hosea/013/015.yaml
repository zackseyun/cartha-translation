language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י ה֔וּא בֵּ֥ן אַחִ֖ים יַפְרִ֑יא יָב֣וֹא קָדִים֩ ר֨וּחַ יְהוָ֜ה מִ/מִּדְבָּ֣ר עֹלֶ֗ה וְ/יֵב֤וֹשׁ מְקוֹר/וֹ֙ וְ/יֶחֱרַ֣ב מַעְיָנ֔/וֹ ה֣וּא יִשְׁסֶ֔ה אוֹצַ֖ר כָּל כְּלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/015.yaml
  text: Though he may flourish among his brothers[a], an east wind will come—the wind of Yahweh, rising from the wilderness—and his spring will dry up, and his fountain will be dried out[c][b]; it will plunder the storehouse of every precious vessel.
translation:
  language: zh_hans
  text: 他虽在弟兄中结实繁盛[a]，东风却必来到——那是雅威的风[b]，从旷野升起。他的泉源必干涸，水泉必枯竭；它必掠夺储藏一切珍贵器物的宝库[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他在弟兄中结实繁盛。”希伯来语 כִּי 可表原因；正文按上下文译为让步语气，表示以法莲虽兴盛，审判仍将来到。
    reason: lexical_alternative
  - marker: b
    text: “雅威的风”也可译作“雅威的气息”；但这里与“东风”和“从旷野升起”相连，译作“风”更合语境。
    reason: alternative_reading
  - marker: c
    text: “它”可理解为东风所代表的毁灭力量；原文也可能指人格化的以法莲或入侵者。末句也可译为：“他必掠夺储藏一切珍贵器物的宝库。”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 虽
  rationale: כִּי可表原因，也可在语境中带让步意味。下文骤然宣告审判，因此正文采用“虽……却……”，同时在脚注保留较形式对应的因果读法。
- source_word: בֵּן אַחִים
  choice: 在弟兄中
  rationale: 字面近于“弟兄中的儿子”，在这里指以法莲置身于同族弟兄之中。汉语采用自然表达，并保留“弟兄”的亲属意象。
- source_word: יַפְרִיא
  choice: 结实繁盛
  rationale: 该词源于פרה，表达结果子、兴旺之意，并可能与“以法莲”之名形成文字呼应。“结实繁盛”兼顾植物意象和兴旺含义。
- source_word: קָדִים
  choice: 东风
  rationale: 指从旷野吹来的炎热、毁坏性的东风，是先知文学中的常见审判意象。
- source_word: רוּחַ יְהוָה
  choice: 雅威的风
  rationale: רוּחַ可指风、气息或灵；这里与“东风”和“从旷野升起”并列，气象意义最合语境，同时“雅威的”明确其审判出于上帝。
- source_word: מִמִּדְבָּר עֹלֶה
  choice: 从旷野升起
  rationale: 保留分词所呈现的动态画面，也准确表达东风来自旷野。
- source_word: מְקוֹרוֹ / מַעְיָנוֹ
  choice: 他的泉源 / 水泉
  rationale: 两个词都指水源。译文用近义而不完全相同的词，保留希伯来诗句的平行结构。
- source_word: וְיֵבֹשׁ / וְיֶחֱרַב
  choice: 必干涸 / 必枯竭
  rationale: 两者在此都描写水源耗尽；采用对应的近义动词，既自然又保留递进式平行。
- source_word: יִשְׁסֶה
  choice: 必掠夺
  rationale: 该动词指抢夺、劫掠。正文以“它”承接东风所代表的毁灭力量，但在脚注说明原文所容许的主语理解。
- source_word: אוֹצַר כָּל־כְּלִי חֶמְדָּה
  choice: 宝库中一切珍贵的器物
  rationale: אוֹצַר可指宝库或储藏，כְּלִי חֶמְדָּה指可喜爱、贵重的器物。此译符合自然汉语，并保留具体的财物意象。
theological_decisions:
- issue: 毁灭之风的施行者与神圣来源
  choice: 译作“雅威的风”，将东风呈现为雅威施行审判的工具
  alternative: 译作“雅威的气息”或“雅威的灵”
  rationale: 上下文明确提到东风及其从旷野而来，因此“风”是首要语义；这既保留雅威的审判主权，也避免把本节强行解释为专门的圣灵论陈述。
- issue: 末句“它”的指代
  choice: 正文让“它”承接东风及其毁灭力量
  alternative: 理解为人格化的入侵者，或理解为前文的以法莲
  rationale: קָדִים“东风”为阳性，可与末句阳性代词הוּא呼应；但句法并非毫无歧义，因此以脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“虽……却……”凸显兴盛与审判的张力；“结实繁盛”保留פרה的结果意象及其与以法莲之名可能形成的文字呼应。全节保持先知诗歌的紧凑节奏，并以破折号标出“雅威的风”对“东风”的解释。
