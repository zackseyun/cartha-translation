  text: אֱהִ֤י מַלְכְּ/ךָ֙ אֵפ֔וֹא וְ/יוֹשִֽׁיעֲ/ךָ֖ בְּ/כָל עָרֶ֑י/ךָ וְ/שֹׁ֣פְטֶ֔י/ךָ אֲשֶׁ֣ר אָמַ֔רְתָּ תְּנָ/ה לִּ֖/י מֶ֥לֶךְ וְ/שָׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/010.yaml
  text: Where now is your king[a], that he may save you in all your cities, and your judges, of whom you said[b], “Give me a king and princes”?
translation:
  language: zh_hans
  text: 如今你的王在哪里呢[a]？让他在你所有的城中拯救你吧！你的审判官又在哪里呢？你曾说：“给我一个王和众首领[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我愿作你的王；那么，在哪里有能在你所有的城中拯救你的人呢？”希伯来文的开头艰深，解释不一。
    reason: alternative_reading
  - marker: b
    text: “首领”也可译作“官长”或“统治者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱהִי ... אֵפוֹא
  choice: 如今……在哪里呢
  rationale: 开头的希伯来文形式艰深，可被理解为第一人称动词，也可按上下文及古译本证据理解为诘问。此处采用诘问，并以“如今”表达 אֵפוֹא 所加强的反问语气。
- source_word: מַלְכְּךָ
  choice: 你的王
  rationale: 保留单数及第二人称所属关系，与以色列求立王的背景相符。
- source_word: וְיוֹשִׁיעֲךָ
  choice: 让他……拯救你吧
  rationale: ישׁע 的使役式表示拯救、解救；在反问之后译作带讥讽意味的挑战，贴合上下文，又不将其误作单纯的目的陈述。
- source_word: בְּכָל עָרֶיךָ
  choice: 在你所有的城中
  rationale: 按介词的处所含义直译，并保留“所有”的范围。
- source_word: וְשֹׁפְטֶיךָ
  choice: 你的审判官
  rationale: שֹׁפְטִים 的基本义为施行审判并治理的人；“审判官”既保留词义，也能体现其政治治理角色。
- source_word: אֲשֶׁר אָמַרְתָּ
  choice: 你曾论到他们说
  rationale: 关系从句回指前述的王和审判官；“论到他们”比“对他们”更符合此处所述是以色列求取统治者的话。
- source_word: תְּנָה לִּי
  choice: 请给我
  rationale: 忠实表达 נתן 的祈使式和 לִי；加入“请”使现代汉语中的请求自然，但不减弱原文命令式语气。
- source_word: מֶלֶךְ וְשָׂרִים
  choice: 一个王和一些首领
  rationale: מֶלֶךְ 为王；שָׂרִים 可指贵族、官长或统治者。“首领”在现代汉语中自然且涵盖较广，同时避免把其身份过度限定为世袭王子。
theological_decisions:
- issue: 艰深开头 אֱהִי 的解释
  choice: 采用诘问：“如今你的王在哪里呢？”
  alternative: “我本可作你的王；那么，能拯救你的在哪里呢？”或“我要作你的王……”
  rationale: 上下文针对以色列倚靠人间君王发出审判，并提到神在怒中赐王、又在烈怒中废王。诘问读法更顺应这一责问脉络；但原文确有歧义，因此以脚注保留第一人称动词的可能。
- issue: 君王与治理者不能施救的讽刺语气
  choice: 译作“让他……拯救你吧！”并另起“审判官又在哪里呢？”
  alternative: “使他可以……拯救你，以及你的审判官……”
  rationale: 希伯来文句法紧凑，所表达的是对以色列所倚靠之政治权力的反问挑战。中文分句可清楚传达王与审判官均告缺席或无力施救，同时不额外断言其具体结局。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以两个相连的反问呈现希伯来文的责问和讽刺力度；正文保留所有脚注标记，并在脚注中如实呈现开头的文本歧义。
