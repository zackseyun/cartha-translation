  yaml_path: translation/ot/hosea/013/007.yaml
  text: So I became to them like a lion[a]; like a leopard I lurked by the way.
translation:
  language: zh_hans
  text: 于是，我就对他们像狮子一样；我像豹子，在路旁窥伺。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末尾的希伯来词意思较难确定，也可译作“我在路旁守候”或“我在路旁伺伏”。其书写形式与“亚述”相同；但在此处，它很可能是第一人称动词，指察看、窥伺或伺机伏击。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: 因此，我……如同
  rationale: 这是 היה 的 Qal 连续式未完成时第一人称单数；在审判语境中带有结果和转变意味。中文用“因此”承接上下文，“如同”自然表达“成为……一般”的含义。
- source_word: לָהֶם
  choice: 向他们
  rationale: 介词 ל 加第三人称复数后缀表示上帝对以色列所采取的关系或姿态；“向他们”比“对他们成为”更符合现代汉语。
- source_word: כְּמוֹ שָׁחַל
  choice: 如同狮子
  rationale: כְּמוֹ 引出比喻；שָׁחַל 指凶猛的狮子，未必必须细化为“少壮狮子”。
- source_word: כְּנָמֵר
  choice: 像豹子
  rationale: נָמֵר 指有斑点的猛兽，通常对应“豹子”；此译法清楚、通行，并保留捕食者意象。
- source_word: עַל דֶּרֶךְ
  choice: 在路旁
  rationale: 该短语描绘猛兽守候或伏击行人的位置；“在路旁”比直译“在路上”更自然地传达伏击场景。
- source_word: אָשׁוּר
  choice: 埋伏
  rationale: 此形式也可被看作专名“亚述”，但上下文和并列的猛兽比喻支持将其理解为第一人称动词，意为察看、窥伺或伺机伏击。“埋伏”最能体现捕食者守候袭击的画面，同时将文本疑难保留在脚注中。
theological_decisions:
- issue: 用捕食猛兽描绘上帝施行审判
  choice: 直接保留“如同狮子”“像豹子，埋伏在路旁”的强烈比喻
  alternative: 弱化为“像豹子在路旁察看”或保护性的“看顾”
  rationale: 希伯来文本刻意以凶猛的捕食者表现耶和华的审判；不应为了缓和神学张力而削弱这一意象。
- issue: אָשׁוּר 的动词或专名歧义
  choice: 正文按第一人称动词译为“埋伏”
  alternative: 按地名译作“亚述”，或按动词译作“察看／窥伺”
  rationale: 猛兽比喻和句法平行更支持动词理解，但抄本文字形式确与“亚述”相同，因此通过脚注明确说明真实的词义与文本歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因此”体现本节与前文罪行及审判宣告的结果关系；分号保留两个猛兽比喻的平行结构。脚注标记[a]置于相关分句之后。
