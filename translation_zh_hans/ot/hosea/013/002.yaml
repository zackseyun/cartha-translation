reference: Hosea 13:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יוֹסִ֣פוּ לַ/חֲטֹ֗א וַ/יַּעְשׂ֣וּ לָ/הֶם֩ מַסֵּכָ֨ה מִ/כַּסְפָּ֤/ם כִּ/תְבוּנָ/ם֙ עֲצַבִּ֔ים מַעֲשֵׂ֥ה חָרָשִׁ֖ים כֻּלֹּ֑/ה לָ/הֶם֙ הֵ֣ם אֹמְרִ֔ים זֹבְחֵ֣י אָדָ֔ם עֲגָלִ֖ים יִשָּׁקֽוּ/ן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/002.yaml
  text: 'And now they keep on sinning: they make cast images for themselves from their silver, idols made according to their own skill—all of it the work of craftsmen. Of them they say[a], “Those who sacrifice human beings kiss calves[b][c].”'
translation:
  language: zh_hans
  text: 如今，他们还在不断犯罪：他们用自己的银子为自己铸造神像，凭自己的技艺制作偶像——全都是匠人的作品。人们论到这些偶像说[a]：“献人为祭的，亲吻牛犊[b][c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他们对它们说”；“对它们”与下文的句法关系难以确定。
    reason: alternative_reading
  - marker: b
    text: 或译：“愿献祭的人亲吻牛犊。”这种译法把“人”理解为泛指，并把末尾动词读成带祈愿或命令意味；马所拉文本的形式更自然地表示直陈：“亲吻”。
    reason: alternative_reading
  - marker: c
    text: 即牛犊偶像。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 既承接上文，又标明当前情形；现代汉语中自然凝练。
- source_word: יוֹסִפוּ לַחֲטֹא
  choice: 还在不断犯罪
  rationale: 表达该结构所含持续、反复犯罪之意。
- source_word: וַיַּעְשׂוּ לָהֶם מַסֵּכָה
  choice: 他们为自己铸造神像
  rationale: מַסֵּכָה 指铸造的宗教形像；单数在此可作集合意义，汉语用泛称“神像”自然承接后面的复数“偶像”。
- source_word: מִכַּסְפָּם
  choice: 用自己的银子
  rationale: מן 表示制作材料或来源；汉语以“用”清楚表达银子是铸像材料。
- source_word: כִּתְבוּנָם
  choice: 凭自己的技艺
  rationale: 在制作偶像及匠人作品的语境中，תְּבוּנָה 侧重制作本领或技艺，同时保留倚靠人自身能力的讽刺意味。
- source_word: עֲצַבִּים
  choice: 偶像
  rationale: 采用现代汉语中清楚而庄重的宗教用语。
- source_word: מַעֲשֵׂה חָרָשִׁים כֻּלֹּה
  choice: 全都是匠人的作品
  rationale: 突出这些偶像完全出于人的制作，并保留“匠人”的复数概念。
- source_word: לָהֶם הֵם אֹמְרִים
  choice: 人们论到这些偶像说
  rationale: 按上下文将 לָהֶם 与偶像相连，并以汉语非特指的“人们”表达未明确指出的说话者；原文句法困难在脚注说明。
- source_word: זֹבְחֵי אָדָם
  choice: 献人为祭的
  rationale: 按马所拉文本最自然的句法，把 אָדָם 视为分词“献祭”的宾语；不把它限缩为男性。
- source_word: עֲגָלִים יִשָּׁקוּן
  choice: 亲吻牛犊
  rationale: 将马所拉形式按直陈语气处理；“牛犊”保留何西阿尖锐的具体意象，其偶像所指在脚注说明。
theological_decisions:
- issue: זֹבְחֵי אָדָם עֲגָלִים יִשָּׁקוּן 的压缩句法
  choice: “献人为祭的，亲吻牛犊。”
  alternative: “愿献祭的人亲吻牛犊。”
  rationale: 马所拉文本最自然地容许把 אָדָם 理解为“献祭”的宾语，并把末尾动词理解为直陈式；但把 אָדָם 泛指“人”、将动词理解为带祈愿或命令意味的说法，也是历史悠久且可能的读法，因此保留在脚注中，不消除原文的神学张力。
- issue: לָהֶם הֵם אֹמְרִים 的指向
  choice: “人们论到这些偶像说”
  alternative: “他们对这些偶像说”
  rationale: 介词短语与后文关系不明确。正文采用较合上下文的论及偶像之读法，脚注保留较形式对应的另一可能。
translation_notes:
  register: 采用现代标准普通话，措辞庄重而易懂。以冒号和破折号呈现原文的推进与强调；“神像／偶像”“匠人的作品”“献人为祭”兼顾经文语体与普通读者的可理解性。
