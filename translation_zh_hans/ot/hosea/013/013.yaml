base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/013.yaml
  text: The labor pains of a woman giving birth come upon him[a]; he is an unwise son[b], for at the proper time he does not present himself at the opening of the womb.
translation:
  language: zh_hans
  text: 产妇的阵痛临到他[a]；他是个没有智慧的儿子，因为到了时候，他却不在生产的关头出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“生产的疼痛”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“站在儿女破出之处”；这罕见的说法可指分娩的出口，也可指生产的关头。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי יֹלֵדָה
  choice: 产妇的阵痛
  rationale: 该组合在分娩语境中指生产时的疼痛；“产妇的阵痛”自然、明确，并保留持续的生产意象。
- source_word: יָבֹאוּ לוֹ
  choice: 临到他
  rationale: 直译为“来到他那里”；“临到他”符合庄重的现代汉语，又不把语气强化为惩罚性的“追上”。
- source_word: בֵן לֹא חָכָם
  choice: 没有智慧的儿子
  rationale: 贴近希伯来语否定式表达，保留其相对克制的判断，避免用“愚昧”加重道德意味。
- source_word: כִּי עֵת
  choice: 因为到了时候
  rationale: 在生产比喻中指关键时刻已经来到；原文未明说“适当”，因此不额外加入“合宜/应当”。
- source_word: לֹא יַעֲמֹד
  choice: 却不出现在
  rationale: 动词字面为“站立”，此处结合难产意象，表示孩子未在关键位置出现；“却”传达预期与实际之间的反差。
- source_word: בְּמִשְׁבַּר בָּנִים
  choice: 在产门口
  rationale: 这是罕见且有歧义的产育用语，可能指儿女破胎而出的地方或时刻；正文用简洁的“产门口”保留具体意象，脚注说明字面与其他理解。
theological_decisions:
- issue: 生产意象所指对象
  choice: 保留第三人称“他”，不在正文补入“以法莲”或“以色列”
  alternative: 译作“以法莲像个没有智慧的儿子”
  rationale: 本节希伯来文本只使用阳性第三人称和“儿子”的比喻；虽可由上下文辨明所指，正文仍应保留本节本身的表达方式。
- issue: בְּמִשְׁבַּר בָּנִים 的具体含义
  choice: 正文译为“在产门口”，并用脚注保留“儿女破胎而出之处/生产关头”的歧义
  alternative: 直接意译为“在生产的关头”
  rationale: 该短语罕见，兼有地点和关键时刻两种可能；具体意象不宜在正文中被完全抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“产门口”略带形象性，以对应原文罕见而具体的生产用语；借脚注避免正文过度解释。
