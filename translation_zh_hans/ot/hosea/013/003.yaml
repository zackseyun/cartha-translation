  text: לָ/כֵ֗ן יִֽהְיוּ֙ כַּ/עֲנַן בֹּ֔קֶר וְ/כַ/טַּ֖ל מַשְׁכִּ֣ים הֹלֵ֑ךְ כְּ/מֹץ֙ יְסֹעֵ֣ר מִ/גֹּ֔רֶן וּ/כְ/עָשָׁ֖ן מֵ/אֲרֻבָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/003.yaml
  text: Therefore they will be like the morning cloud[a], and like the dew that goes away early, like chaff whirled from the threshing floor, and like smoke from a window.
translation:
  language: zh_hans
  text: 所以，他们必像清晨的云，像一早就消逝的露水，像从打谷场上被风卷走的糠秕，又像从窗口[a]飘出的烟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“窗格”。希伯来语所用的词可指窗洞，也可指带格栅的开口。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的指控与审判，表达由此而来的结果；“所以”在现代汉语中自然保留推论关系。
- source_word: יִהְיוּ
  choice: 他们必像
  rationale: 该词是复数未完成式，在预言性后果陈述中用“必”表达将来及确定意味；与后续比喻连译，避免生硬的“他们必成为”。
- source_word: כַּעֲנַן בֹּקֶר
  choice: 像清晨的云雾
  rationale: עָנָן可指云；结合转瞬消散的语境译作“云雾”，自然传达清晨云气短暂无常的意象，同时未把它具体化为某一种气象现象。
- source_word: וְכַטַּל מַשְׁכִּים הֹלֵךְ
  choice: 像一早就消逝的露水
  rationale: מַשְׁכִּים突出清早或很早，הֹלֵךְ在此表示离去、消失；译文保留露水迅速消逝的图景。
- source_word: כְּמֹץ
  choice: 像……糠秕
  rationale: מֹץ指扬场时被风吹走的谷壳、糠秕；“糠秕”准确保留古代打谷扬场的农业意象。
- source_word: יְסֹעֵר מִגֹּרֶן
  choice: 从打谷场上被风卷走
  rationale: 动词描写猛烈、旋卷般被带走的动作；补出语境中隐含的“风”，使现代汉语清楚自然，并以被动结构表现糠秕遭驱散。
- source_word: וּכְעָשָׁן מֵאֲרֻבָּה
  choice: 又像从窗格飘散的烟
  rationale: אֲרֻבָּה可指窗洞、窗格或格栅；主文采用“窗格”，既符合古代建筑开口的可能形态，也能自然呈现烟逸出消散的画面，另一种宽泛译法列于脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以四个平行的“像……”保留原文层递比喻，突出迅速消散、毫无存留的共同意象。脚注标记置于实际存在词义差异的“窗格”之后。
