base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/006.yaml
  text: As their pasture[a], they were satisfied; they were satisfied, and their heart was lifted up[b]; therefore they forgot me.
translation:
  language: zh_hans
  text: 他们在自己的草场上得喂养时[a]，就饱足了；他们既饱足，心就高举[b]；因此，他们忘记了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按他们的草场”；也可译：“当他们得喂养时。”希伯来语表达简练，可指他们在草场丰足、得以饱食的处境。
    reason: lexical_alternative
  - marker: b
    text: 直译为“他们的心高举”，是表示自高、骄傲的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַרְעִיתָם
  choice: 他们有草可吃时
  rationale: כְּ 与 מַרְעִיתָם 构成简练而略有歧义的表达，可指他们处于有草场、得喂养的境况。译文采用合乎现代汉语的时间—处境表达，同时以脚注保留“按着他们的草场”等可能理解。
- source_word: וַיִּשְׂבָּעוּ / שָׂבְעוּ
  choice: 就饱足了；他们饱足了
  rationale: 两次使用“饱足”，保留 שבע 词根的刻意重复及由丰足到自高的推进关系。
- source_word: וַיָּרָם לִבָּם
  choice: 心也高举起来
  rationale: 保留希伯来语“心被高举”的比喻，不直接释为“变得骄傲”；脚注说明其惯用含义。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 清楚表达前后之间的结果关系，语气简洁而庄重。
- source_word: שְׁכֵחוּנִי
  choice: 他们忘记了我
  rationale: 直译 שכח 与第一人称宾语，保留其直接而带有盟约意味的责备，不弱化为“忽略我”。
theological_decisions:
- issue: “心被高举”所表达的骄傲
  choice: 正文保留“心也高举起来”的希伯来语比喻
  alternative: 他们的心就骄傲起来
  rationale: 原文以“心被高举”描写人在饱足后自高，并继而忘记上帝。保留比喻可维持经文的神学张力，同时由脚注帮助普通读者理解。
- issue: 丰足与忘记上帝之间的关系
  choice: 用“因此”明确呈现原文的结果关系
  alternative: 于是
  rationale: עַל כֵּן 明示推论或后果；译作“因此”既不削弱责备，也不额外说明他们忘记上帝的心理机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有草可吃”保留牧场意象并使句意自然；分号呈现原文由饱足到自高、再到忘记上帝的递进。所有脚注标记均已置于正文相应位置。
