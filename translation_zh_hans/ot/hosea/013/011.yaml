  text: I gave you a king in my anger[b][a], and I took him away in my wrath.
translation:
  language: zh_hans
  text: 我在怒气中赐给你一位王，又在烈怒中把他取走。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文两个动词都是未完成式，按形式也可理解为现在或将来：“我在怒气中赐给你一位王，又在烈怒中把他取走。”汉语动词本身不标示时态；这里的上下文较适合按对往事的回顾来理解。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“又取”；没有明说宾语。“他”是根据前文的“一位王”补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתֶּן
  choice: 赐给
  rationale: 该词为第一人称单数未完成式，形态上可表达现在或将来；结合上下文可按回顾性的过去事件理解。汉语动词本身不强制标明时态，既自然表达回顾，也保留希伯来语形式的开放性。
- source_word: לְךָ
  choice: 给你
  rationale: 保留第二人称阳性单数，将以色列作为一个整体来称呼。
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 指治理以色列的王；现代汉语中“君王”庄重而易懂。希伯来语无冠词，汉语无需添加不自然的数量词。
- source_word: בְּאַפִּי
  choice: 在怒中
  rationale: אַפִּי在此表示上帝的愤怒；“在怒中”保留介词结构及其情境、原因意味。
- source_word: וְאֶקַּח
  choice: 又……将他废去
  rationale: לקח基本义为“拿走、取走”，此处承接“君王”，语境所指是撤去王位或除掉君王。“废去”符合君王语境；“他”是由上文补出的隐含宾语，并在脚注说明。
- source_word: בְּעֶבְרָתִי
  choice: 在盛怒中
  rationale: עֶבְרָה比一般的怒气更强烈；“盛怒”既与前句“怒”有所区分，也保持先知话语的力度。
theological_decisions:
- issue: 两个第一人称未完成式的时态与体貌
  choice: 正文采用可作回顾理解、但不显式标注过去时的汉语表达：“我在怒中赐给……又……废去”
  alternative: 明确译作现在或将来：“我在怒中赐给你君王，又在盛怒中将他废去／必将他废去”
  rationale: 上下文适合回顾上帝赐下并撤去以色列诸王；但希伯来语两个动词均为未完成式。汉语无形态时态，正文可自然承载回顾义，同时脚注保留现在／将来理解的可能。
- issue: וְאֶקַּח的隐含宾语
  choice: 补出“他”，指前句的君王
  alternative: 不补宾语，直译为“又取去”
  rationale: 希伯来文没有明说宾语，但前句“君王”是自然的指代对象。现代汉语补出“他”更清楚，不引入新的所指。
- issue: לקח在王权语境中的表达
  choice: 译为“废去”
  alternative: 译为“取去”或“拿走”
  rationale: “废去”传达撤除君王或王权的语境意义，但仍以脚注提示原词直译为“取去”，避免过度限定其具体方式。
translation_notes:
  register: 采用现代、庄重而简明的普通话。“君王”保持先知文体的尊严；“盛怒”体现עֶבְרָה较强的语义。脚注标记均置于正文相关句末，并保留动词时态与隐含宾语方面的真实歧义。
