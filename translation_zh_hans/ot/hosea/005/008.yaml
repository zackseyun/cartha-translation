base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/008.yaml
  text: 'Blow the horn in Gibeah[a], the trumpet in Ramah; raise the battle cry at Beth-aven: “Behind you[b], Benjamin!”'
translation:
  language: zh_hans
  text: 你们要在基比亚吹角，在拉玛吹号；要在伯·亚文[a]发出警报：“便雅悯啊，敌人在你身后！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯·亚文”很可能是对伯特利的讽刺性称呼；这个名字可让人联想到“罪恶之家”或“虚妄之家”。
    reason: cultural_note
  - marker: b
    text: 原文直译：“在你身后，便雅悯！”原文没有明说“敌人”；此处很可能是在发出敌军从后方逼近的警报。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: 吹
  rationale: 这是复数命令式，与角类乐器搭配；现代汉语以“吹角”最自然。
- source_word: שׁוֹפָר
  choice: 角
  rationale: 指角制的吹奏乐器，与下一分句的金属号（חֲצֹצְרָה）有别；译作“角”可保留这一区分。
- source_word: בַּגִּבְעָה
  choice: 在基比亚
  rationale: 介词加地名，表示发出警报的地点。
- source_word: חֲצֹצְרָה
  choice: 号
  rationale: 指与角不同的号类乐器；译作“号”既自然，也保留平行句中的词汇差异。
- source_word: בָּרָמָה
  choice: 在拉玛
  rationale: 介词加地名，与“在基比亚”构成平行。
- source_word: הָרִיעוּ
  choice: 发出警报
  rationale: 使役词形的复数命令式；在军事威胁的语境中，重点是高声示警，而非泛指呼喊。
- source_word: בֵּית אָוֶן
  choice: 伯·亚文
  rationale: 保留原文地名形式，不直接改作“伯特利”或意译；其可能的讽刺含义另见脚注。
- source_word: אַחֲרֶיךָ
  choice: 敌人在你身后
  rationale: 原文直译为“在你身后”，表达突兀而简略。根据警报语境补出“敌人在”，使中文警告清楚，同时以脚注保留更贴近字面的读法。
- source_word: בִּנְיָמִין
  choice: 便雅悯
  rationale: 这里是对便雅悯支派或其地域的直接呼告，采用通行中文译名。
theological_decisions:
- issue: בֵּית אָוֶן 是否是对伯特利的讽刺性称呼
  choice: 正文保留“伯·亚文”，脚注说明它很可能影射伯特利，并带有“罪恶之家”或“虚妄之家”的讽刺意味。
  alternative: 正文直接译作“伯特利”或“罪恶之家”。
  rationale: 原文实际写的是专名 בֵּית אָוֶן。保留该形式可避免把很可能但并非明说的指涉直接写入正文，同时不丢失何西阿的讽刺意味。
- issue: אַחֲרֶיךָ 的省略式警告如何理解
  choice: 正文按军事警报语境译为“敌人在你身后”，并在脚注保留直译“在你身后”。
  alternative: 只译作“在你身后，便雅悯！”或理解为“跟在你后面”。
  rationale: 上下文连续命令吹角、吹号、示警，因此“在你身后”很可能表示敌军从后方逼近；但原文没有明说“敌人”，故以脚注标明补足成分，保存其简略和歧义。
translation_notes:
  register: 采用现代、庄重而清楚的警报语体。以“角／号”保留两种乐器的词汇差异；地名使用通行译名，“伯·亚文”用间隔号显示复合专名。正文补出“敌人在”以符合汉语表达，并用脚注明确原文的省略性。
