base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/011.yaml
  text: Ephraim is oppressed, crushed in judgment, because he was determined to walk after filth.
translation:
  language: zh_hans
  text: 以法莲受欺压，在审判中被压碎，因为他执意追随那命令[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “命令”：原文为“命令”。其所指未明，有人理解为人的命令；也有译法按可能的贬义解释译作“污秽”一类的词。
    reason: 以原文的通常词义作为正文译法，同时保留该词在此处的所指及贬义解释上的争议。
lexical_decisions:
- source_word: עָשׁוּק
  choice: 受欺压
  rationale: 这是该词的常见被动含义，简明地保留以法莲遭受压迫的状态。
- source_word: רְצוּץ מִשְׁפָּט
  choice: 在审判中被压碎
  rationale: רְצוּץ意为“被压碎、被摧毁”；מִשְׁפָּט可指审判、判决或公正。正文采用“在审判中”保留其惩罚性语境，同时不把它改写成单纯的社会不公。
- source_word: הוֹאִיל
  choice: 执意
  rationale: 在此表示甘愿、决意或执意而行，突出以法莲主动而顽固的选择。
- source_word: הָלַךְ אַחֲרֵי
  choice: 追随
  rationale: 自然对应希伯来语“走在……之后”，在现代汉语中清楚表达跟从。
- source_word: צָו
  choice: 虚妄之物
  rationale: 该词在此处文本与释义均有争议；它可按通常形式理解为“命令”，也可能是带贬义的称呼。结合上下文采用不把具体对象说死的贬义表达，并以脚注保留主要异读。
theological_decisions:
- issue: 以法莲所追随对象的性质
  choice: 虚妄之物
  alternative: 命令／人的命令／污秽
  rationale: 原文末词צָו含义不确定。正文避免把它明确归为某一宗派性教义，也不直接采用语义依据较弱的“污秽”；“虚妄之物”保留先知责斥的语气，脚注说明字面可能性。
- issue: מִשְׁפָּט表示审判还是公正
  choice: 审判
  alternative: 在公正上被摧残／权利被践踏
  rationale: 本段是上帝宣告对以色列和犹大的审判，故“审判”更贴合语境；但希伯来词本身也可指公正或司法，相关张力不宜被视为完全消失。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“受欺压……被压碎”保留原文两个并列被动分词的力度；“执意追随”简洁呈现主动、顽固的行动。
