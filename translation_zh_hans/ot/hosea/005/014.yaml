  to: 因为我对以法莲要像狮子[a]，对犹大家要像年轻的狮子；我，我要撕裂，然后离去；我要带走，无人能救。
  rationale: 修订将前一个狮子词保留为不加限定的“狮子”，并以脚注呈现“猛狮”的可行译法；将“少壮狮子”调整为更自然的“年轻的狮子”；将“叼走”改为语义范围较准确的“带走”。其余结构保留原文的平行、强调重复及严峻的捕食者审判比喻。
