base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/014.yaml
  text: For I am like a lion to Ephraim[a], and like a young lion to the house of Judah; I, I myself, will tear and go away; I will carry off[b], and there is no one to rescue.
translation:
  language: zh_hans
  text: 因为我对以法莲要像狮子[a]，对犹大家要像年轻的狮子；我，我要撕裂，然后离去；我要带走，无人能救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狮子”也可译作“猛狮”；希伯来语这个词可含强壮或凶猛之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַּׁחַל
  choice: 猛狮
  rationale: 该词指狮子，并可带有强悍、凶猛的意味；译作“猛狮”既区别于下句的“少壮狮子”，也符合审判语境。
- source_word: כְּפִיר
  choice: 少壮狮子
  rationale: 该词通常指年轻而已有捕猎能力的狮子；“少壮狮子”比“幼狮”更能保留其威猛形象。
- source_word: לְאֶפְרַיִם
  choice: 对以法莲
  rationale: 介词在比喻中表明审判所针对的对象；“对以法莲”自然且贴近原文关系。
- source_word: לְבֵית יְהוּדָה
  choice: 对犹大家
  rationale: 保留“家”这一群体性称谓，指犹大国及其人民，并与“以法莲”形成平行。
- source_word: אֲנִי אֲנִי
  choice: 我，我
  rationale: 保留人称代词的重复，以传达原文强烈的自我强调，不将其平滑为单一的“我自己”。
- source_word: אֶטְרֹף
  choice: 必撕裂
  rationale: 该动词在猛兽意象中表示撕咬猎物；“撕裂”简洁有力，并像原文一样不补出宾语。
- source_word: וְאֵלֵךְ
  choice: 然后离去
  rationale: 描写猛兽撕裂猎物后离开的动作；“然后”清楚呈现动作承接，“离去”保持庄重自然。
- source_word: אֶשָּׂא
  choice: 必叼走
  rationale: 该词基本义为举起、带走；在狮子捕猎的语境中，“叼走”自然呈现将猎物带走的画面，同时避免抽象化。
- source_word: וְאֵין מַצִּיל
  choice: 无人能救
  rationale: 简明表达没有任何施救者能够夺回猎物；“救”兼顾眼前的猛兽意象与审判语境。
theological_decisions:
- issue: 上帝以捕食者形象描述审判
  choice: 直接保留猛狮撕裂并叼走猎物的比喻
  alternative: 弱化为一般性的惩罚或灾祸
  rationale: 原文明确使用两种狮子称谓及撕裂、带走等捕猎动词；弱化意象会削减审判宣告的力度。
- issue: אֲנִי אֲנִי 的强调作用
  choice: 译作“我，我”，保留重复
  alternative: 译作“正是我”或“我自己”
  rationale: 重复既突出施行审判者就是说话者本人，也保留希伯来诗句突兀而强烈的语气；不进一步解释其神学含义。
translation_notes:
  register: 采用现代、庄重而清晰的普通话，保留希伯来诗歌的平行结构、猛兽意象和重复强调。“叼走”较具画面感，但仍属普通现代汉语；全句避免使用过度宗教化或古雅的措辞。
