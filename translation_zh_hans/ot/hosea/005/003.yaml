  text: אֲנִי֙ יָדַ֣עְתִּי אֶפְרַ֔יִם וְ/יִשְׂרָאֵ֖ל לֹֽא נִכְחַ֣ד מִמֶּ֑/נִּי כִּ֤י עַתָּה֙ הִזְנֵ֣יתָ אֶפְרַ֔יִם נִטְמָ֖א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/003.yaml
  text: I know Ephraim[a], and Israel is not hidden from me; for now, Ephraim, you have played the prostitute[b]; Israel is defiled.
translation:
  language: zh_hans
  text: “我认识以法莲；以色列不能向我隐藏。因为如今，以法莲啊，你行了淫[a]；以色列已被玷污[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行了淫”也可译作“使自己沦为娼妓”。希伯来文以淫乱的意象表达对盟约的不忠。
    reason: lexical_alternative
  - marker: b
    text: 或译：“以色列已经不洁。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: 我认识
  rationale: 希伯来语虽为完成式，但此处表达上帝对以法莲确切而持续的认识；现代汉语用“我认识”自然传达当前有效的事实。
- source_word: נִכְחַד מִמֶּנִּי
  choice: 不能向我隐藏
  rationale: 保留“隐藏、隐瞒”的核心含义；汉语以“不能向我隐藏”自然表达以色列在上帝面前无法被遮蔽的意思。
- source_word: כִּי עַתָּה
  choice: 因为如今
  rationale: “因为”保留כִּי与上句的解释关系，“如今”体现עַתָּה的时间强调。
- source_word: הִזְנֵיתָ
  choice: 你行了淫
  rationale: 保留何西阿书刻意使用的卖淫／淫乱意象及其所指向的盟约不忠，不弱化为泛泛的“不忠”；“行了淫”在现代中文中庄重、清楚。
- source_word: נִטְמָא
  choice: 已被玷污
  rationale: 该词表示进入污秽、不洁的状态；“已被玷污”兼顾动作结果与道德—礼仪层面的不洁含义。
- source_word: אֶפְרַיִם / יִשְׂרָאֵל
  choice: 以法莲／以色列
  rationale: 保留两个专名及其平行关系；在何西阿书中，以法莲常代表北国，但正文不直接将其解释性替换为“北国”。
theological_decisions:
- issue: 淫乱意象与盟约不忠
  choice: 正文保留明确的“行淫”意象
  alternative: 译为“背信”或“不忠”
  rationale: 原文以性方面的淫乱具体描绘对上帝的盟约不忠；若只译作“不忠”，会削弱先知话语有意保留的冲击力。
- issue: 上帝认识以法莲的时态与性质
  choice: 译作现在时意义的“我认识”
  alternative: 译作“我曾认识”或“我已经认识”
  rationale: 上下文强调上帝此刻确知以法莲，以色列无法在他面前隐藏；“我认识”既符合现代汉语，也不把希伯来完成式误解为仅限过去。
- issue: נִטְמָא的语态与结果状态
  choice: 译作“已被玷污”
  alternative: 译作“已经不洁”或“沾染了污秽”
  rationale: 保留原文被动／状态变化的张力，并同时表达以色列如今处于污秽状态；不进一步断定具体的施事者。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以分号保留原文两组紧密相连的平行陈述，并用“以法莲啊”呈现直接呼语。所有脚注标记均置于相关正文词句之后。
