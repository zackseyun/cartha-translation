  yaml_path: translation/ot/hosea/005/012.yaml
  text: So I am like a moth to Ephraim[a], and like rot to the house of Judah.
translation:
  language: zh_hans
  text: 所以，我对以法莲如同蛀衣蛾，对犹大家如同腐朽[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“腐烂”或“朽烂”。希伯来语所描绘的是从内部败坏、逐渐耗损的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 所以，我
  rationale: 连词与独立代词共同引出上帝亲自作出的宣告，并承接上文审判的缘由；“所以”自然表达语境中的结果关系，“我”则保留原文的强调。
- source_word: כָעָשׁ
  choice: 如同蛀虫
  rationale: עָשׁ通常指能蛀蚀织物的蛾虫。现代汉语用“蛀虫”既保留虫类比喻，也传达缓慢侵蚀、逐渐耗损的意象；若译作“飞蛾”，破坏性的含义不够明显。
- source_word: לְאֶפְרָיִם
  choice: 对以法莲
  rationale: 介词לְ标明这一比喻所针对的对象。“以法莲”按原文保留，具体指向北国，不笼统改作“以色列”。
- source_word: וְכָרָקָב
  choice: 如同朽烂
  rationale: רָקָב表示腐烂、腐朽或由内而外的败坏。“朽烂”简洁地保留了名词性比喻及逐渐瓦解的意象，没有把它扩写成明确的动作。
- source_word: לְבֵית יְהוּדָה
  choice: 对犹大家
  rationale: “犹大家”保留בֵית יְהוּדָה的整体性表达，所指包括犹大的王国与民众；“对”自然表达比喻所针对的对象。
theological_decisions:
- issue: 上帝以造成毁坏之物自比
  choice: 保留“蛀虫”和“朽烂”两个名词性比喻，表达上帝对以法莲和犹大施行渐进而消耗性的审判。
  alternative: 意译为“我要像蛀虫一样侵蚀以法莲，使犹大逐渐腐烂”。
  rationale: 原文没有使用“侵蚀”或“使……腐烂”等解释性动词，而是直接使用两个比喻。保留这种表达可维持先知话语的张力，避免替文本说明审判发生的具体方式。
translation_notes:
  register: 采用庄重而简明的现代标准汉语。“蛀虫”较“飞蛾”更能让普通读者理解原文所含的缓慢蛀蚀意象；“朽烂”保留比喻的凝练与含混，不擅自补出动作或结果。脚注标记置于其实际说明的“朽烂”之后。
