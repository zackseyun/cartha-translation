  text: וְ/עָנָ֥ה גְאֽוֹן יִשְׂרָאֵ֖ל בְּ/פָנָ֑י/ו וְ/יִשְׂרָאֵ֣ל וְ/אֶפְרַ֗יִם יִכָּֽשְׁלוּ֙ בַּ/עֲוֺנָ֔/ם כָּשַׁ֥ל גַּם יְהוּדָ֖ה עִמָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/005.yaml
  text: The pride of Israel testifies against him[a], and Israel and Ephraim will stumble in their guilt[c][b]; Judah also will stumble with them.
translation:
  language: zh_hans
  text: 以色列的骄傲指证他[a]；以色列和以法莲必在自己的罪孽中跌倒[b]，犹大也已经同他们一起跌倒[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以色列的骄傲当面指证他”，或“以色列的威荣在他面前作证”。希伯来语的字面意思是“在他面前／当着他的面”；主文按较可能的司法语气翻译。
    reason: lexical_alternative
  - marker: b
    text: “在自己的罪孽中”也可译作“因自己的罪责”或“在自己的罪责中”。原词可指罪孽、罪责及其后果。
    reason: lexical_alternative
  - marker: c
    text: 或译“犹大也必同他们一起跌倒”，也可译“犹大也同他们一起跌倒”。这里的希伯来语动词形式与前句不同，其时间和体貌可有不同理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנָה
  choice: 作证
  rationale: 此处取法庭语境中的“作证、见证”义；以色列的骄傲成为指控他的证据。相较于“回答”或“被降卑”，这更符合本段责罪的语气。
- source_word: גְאוֹן
  choice: 骄傲
  rationale: 该词可指“威荣、尊荣”或“骄傲”。上下文论及罪责与跌倒，故取负面的道德含义，同时在脚注保留“威荣”的可能。
- source_word: בְפָנָיו
  choice: 指控他
  rationale: 字面为“在他面前／当着他的面”。与“作证”连用时，以司法性的“指控他”自然传达其语用含义；单数阳性代词把以色列视为一个整体。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留专名。这里既可整体指以色列，也与“以法莲”并列，用于先知对北国的称呼。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 按现代中文圣经通行形式音译；在何西阿书中常借指北国，但保留专名可保存先知原有措辞。
- source_word: יִכָּשְׁלוּ
  choice: 必……跌倒
  rationale: 保存“绊跌、倒下”的隐喻；未具体解释其为政治覆亡、道德失败或审判结果。
- source_word: בַּעֲוֹנָם
  choice: 在自己的罪孽中
  rationale: 以紧凑表达保留介词的空间性以及 עון 可兼含罪行、罪责的语义，不径直限定为单一因果关系。
- source_word: כָּשַׁל
  choice: 已经……跌倒
  rationale: 该动词为完成式，与前句未完成式不同；译作“已经跌倒”保留形式上的体貌差异，但其具体时间指向仍有歧义，故另加脚注。
- source_word: גַּם
  choice: 也
  rationale: 表达犹大同样被纳入跌倒和审判之中。
- source_word: עִמָּם
  choice: 同他们一起
  rationale: 指犹大与前述以色列、以法莲共同陷入跌倒的处境。
theological_decisions:
- issue: 开头“以色列的 גְאוֹן”所指为何
  choice: 以色列道德意义上的骄傲，成为指控他的见证
  alternative: 以色列的威荣或尊贵当面为证
  rationale: 责罪、罪孽和跌倒的上下文支持负面的“骄傲”，但该词本身确有“威荣”义，因此不把另一可能从脚注中抹去。
- issue: 犹大之动词的时间与体貌
  choice: 译作“已经……跌倒”，体现完成式与前句未完成式的差别
  alternative: “也必同他们一起跌倒”或“也同他们一起跌倒”
  rationale: 希伯来文从复数未完成式转为单数完成式。主文保留这一形式差别，但不据此建立僵硬的时间次序；脚注说明其他可成立的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“作证指控”保留司法意象，“跌倒”保留先知话语中的隐喻。句中以分号区分指证与审判结果，并以“已经”呈现犹大动词与前句的体貌差异；所有实质性歧义均在脚注中保留。
