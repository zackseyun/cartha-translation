  text: וְ/שַׁחֲטָ֥ה שֵׂטִ֖ים הֶעְמִ֑יקוּ וַ/אֲנִ֖י מוּסָ֥ר לְ/כֻלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/002.yaml
  text: The rebels have gone deep into slaughter[b][a], but I am a rebuke to all of them.
translation:
  language: zh_hans
  text: 悖逆的人在杀戮中越陷越深[a]；但我必管教他们所有人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“背离正道的人深陷杀戮。”
    reason: lexical_alternative
  - marker: b
    text: “管教”也可译作“惩戒”“纠正”或“训诲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטָה
  choice: 在杀戮中
  rationale: שַׁחֲטָה意为“屠杀、杀戮”。与后面的הֶעְמִיקוּ合起来译为“在杀戮中越陷越深”，既保留“深”的意象，也自然表达他们深陷流血罪恶。
- source_word: שֵׂטִים
  choice: 悖逆的人
  rationale: 该词指偏离正道、背离的人。“悖逆的人”保留其道德与盟约层面的反叛意味，又比“叛教者”更通俗，且不引入后来的教会术语。
- source_word: הֶעְמִיקוּ
  choice: 越陷越深
  rationale: 这是עמק的使役式完成体，字面可理解为“使之深”或“深入”。此处用汉语习语“越陷越深”，保留深化罪恶的隐喻，不补出原文没有明说的宾语。
- source_word: וַאֲנִי
  choice: 但我
  rationale: 连接词在上下文中具有转折作用：先控诉百姓深陷杀戮，随后转向耶和华的回应，因此译作“但我”。
- source_word: מוּסָר
  choice: 管教
  rationale: מוּסָר可指管教、惩戒、纠正或训诲。在审判语境中，“管教”兼具纠正与惩罚意味；将名词性分句自然转化为汉语动词句。
- source_word: לְכֻלָּם
  choice: 他们所有人
  rationale: לְ与כֻלָּם表明管教所及的对象与完整范围。“他们所有人”清楚保留“全体”的强调。
theological_decisions:
- issue: 说话者身份及神圣回应的性质
  choice: 由耶和华宣告，他必管教他们所有人
  alternative: “我对他们所有人都是训诲”或“我是他们所有人的惩戒”
  rationale: 何西阿书当前的盟约控诉和审判语境支持纠正性的惩戒，而不只是教学；同时“管教”仍保留其可含训诲和纠正的语义张力，避免把它收窄为纯粹报复性的刑罚。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“越陷越深”保存原文的深度隐喻；分号呈现控诉与神回应之间的转折。所有脚注标记均置于相关正文之后。
