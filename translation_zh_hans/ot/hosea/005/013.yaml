  source_fidelity: 正文的句法、医疗比喻、第二人称复数及“但他”的指代都基本忠实于希伯来文。可是“雅列”未反映 יָרֵב 末尾的 ב（b）音，专名音译不完整；应改为“雅列布”（或采用通行旧译“耶雷布”）。此外，“派人去见”虽可表达隐含的外交使节，却比原文“差遣到”多作了明确补足；在中文中仍属可接受的语境性表达。
  naturalness: 行文现代、通顺，且“病—伤／医治—治好”保留了原文的平行医疗意象。“于是”适当地表达叙事推进。将专名改为“雅列布王”后，句子仍自然。
  terminology: “以法莲、犹大、亚述”均为通行的现代中文圣经及历史名称。“雅列王”应修正为“雅列布王”，以完整对应 יָרֵב。脚注中的“争战的王”不够贴合该词可能的描述性理解；以“争讼（或好争）的王”“报复的王”及“大王”等保留为不确定的可能解释较稳妥。
