  text: וַ/יַּ֨רְא אֶפְרַ֜יִם אֶת חָלְי֗/וֹ וִֽ/יהוּדָה֙ אֶת מְזֹר֔/וֹ וַ/יֵּ֤לֶךְ אֶפְרַ֨יִם֙ אֶל אַשּׁ֔וּר וַ/יִּשְׁלַ֖ח אֶל מֶ֣לֶךְ יָרֵ֑ב וְ/ה֗וּא לֹ֤א יוּכַל֙ לִ/רְפֹּ֣א לָ/כֶ֔ם וְ/לֹֽא יִגְהֶ֥ה מִ/כֶּ֖ם מָזֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/013.yaml
  text: When Ephraim saw his sickness[a], and Judah his wound, then Ephraim went to Assyria and sent to King Jareb; but he cannot heal you, nor can he cure your wound.
translation:
  language: zh_hans
  text: 以法莲看见自己的病，犹大看见自己的伤，于是以法莲到亚述去，又派人去见雅列布王[a]；但他不能医治你们，也不能治好你们的伤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅列布”也可能不是人名，而是称号，可理解为“争讼（或好争）的王”“报复的王”，或“大王”。希伯来文的含义不确定。
    reason: 保留 מֶלֶךְ יָרֵב 究竟是专名还是描述性称号的原文歧义，并修正专名音译，使其反映 יָרֵב 末尾的 ב 音。
lexical_decisions:
- source_word: חָלְיוֹ
  choice: 自己的病
  rationale: 该词通常指疾病，此处比喻以法莲的国家处境；“病”自然简明，并保留医疗意象。
- source_word: מְזֹרוֹ / מָזוֹר
  choice: 自己的伤 / 你们的伤
  rationale: 该词可指伤口、疮伤；“伤”既保留身体受创的比喻，也避免过度限定具体病症。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 按现代中文圣经与历史称谓的通行译名处理这一国家名称。
- source_word: מֶלֶךְ יָרֵב
  choice: 雅列王
  rationale: 正文将疑难词 יָרֵב 音译为名称或称号，不武断消除其可能的描述性含义；其他理解收入脚注。
- source_word: וַיִּשְׁלַח אֶל
  choice: 派人去见
  rationale: 原文直译为“差遣到”；宾语虽省略，但中文需补出隐含的受派者，“派人去见”自然表达向君王求助的行动。
- source_word: לָכֶם
  choice: 医治你们
  rationale: 介词 ל 在 רפא 之后表示受益者或对象，现代中文用“医治你们”最自然。
- source_word: יִגְהֶה מִכֶּם מָזוֹר
  choice: 治好你们的伤
  rationale: יִגְהֶה 是罕见动词，在与“医治”平行的语境中表示使伤患得到痊愈；此译保留平行医疗意象，且符合自然中文。
- source_word: וְהוּא
  choice: 但他
  rationale: 连接词形式上可作“而他”，语境却明显转折：以法莲向亚述求助，但对方无力施救。
theological_decisions:
- issue: “但他不能医治你们”中单数代词的指代
  choice: 正文以“他”承接最近的先行词“雅列王”
  alternative: 也可泛指亚述这一政治力量
  rationale: 最近的单数先行词是“雅列王”；保留男性单数代词既贴近原文，也不妨碍读者理解先知所针对的是倚赖亚述的政治策略。
- issue: 结尾“你们”的涵盖范围
  choice: 用复数“你们”，让责备涵盖以法莲与犹大
  alternative: 可按紧邻主体将其主要理解为以法莲
  rationale: 原文明确使用第二人称复数；不将其收窄为单一对象，从而保留先知话语的范围与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以法莲”“犹大”“亚述”使用通行译名；两个医疗用语“病—伤”和“医治—治好”形成自然平行。正文不解释国家之病的具体神学性质，也不把雅列王的身份确定到原文证据之外。
