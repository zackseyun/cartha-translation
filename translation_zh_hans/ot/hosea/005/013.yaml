  - severity: low
    issue: 脚注把可能的描述性解释写为“争战的王”
    rationale: 该词的词源及语义存在争议；“争战”并非最稳妥的中文表达。应以“争讼（或好争）的王”之类较贴近“contending”可能性的说法，并明确其不确定性。
