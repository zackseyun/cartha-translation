id: HOS.5.4
reference: Hosea 5:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹ֤א יִתְּנוּ֙ מַ֣עַלְלֵי/הֶ֔ם לָ/שׁ֖וּב אֶל אֱלֹֽהֵי/הֶ֑ם כִּ֣י ר֤וּחַ זְנוּנִים֙ בְּ/קִרְבָּ֔/ם וְ/אֶת יְהוָ֖ה לֹ֥א יָדָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/004.yaml
  text: Their deeds do not allow them to return to their God[a], for a spirit of whoredom is within them, and they do not know Yahweh.
translation:
  language: zh_hans
  text: 他们的行为不容他们归向自己的上帝，因为淫乱的灵[a]在他们里面；他们也不认识耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “淫乱的灵”也可译作“卖淫的灵”。希伯来语以性方面的不忠比喻对盟约不忠和拜偶像。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּנוּ
  choice: 容
  rationale: נתן本义为“给”，但“不让其行为去归回”这一结构表达准许或使之成为可能；“不容”自然地传达其行为阻碍归回的意思。
- source_word: מַעַלְלֵיהֶם
  choice: 他们的行为
  rationale: מַעֲלָלִים指人的所作所为；“行为”在现代汉语中自然，并保留先知责备的道德分量。
- source_word: לָשׁוּב
  choice: 归向
  rationale: שׁוב兼有转回、归回和悔改的含义；“归向”既保留方向性，也适合盟约关系语境，不把含义收窄为单纯的“悔改”。
- source_word: אֶל אֱלֹהֵיהֶם
  choice: 自己的上帝
  rationale: אֱלֹהִים形式上可作单数或复数，但本节盟约控诉的语境指以色列本应归向的上帝；“自己的”清楚表达后缀所含的归属关系。
- source_word: רוּחַ זְנוּנִים
  choice: 淫乱的灵
  rationale: זְנוּנִים以性方面的不忠比喻偶像崇拜和背约；“淫乱”保留原文尖锐的冲击力，同时是现代读者能够理解的庄重表达。
- source_word: בְּקִרְבָּם
  choice: 在他们里面
  rationale: בְּקֶרֶב可指“在中间”或“在里面”；此处强调这种背约倾向存在于百姓内部，“在他们里面”较贴合语境，同时不限定为纯心理状态。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语域中通行的专名“耶和华”呈现四字神名，与普通中文读者的识别习惯相符，并区别于称号“主”。
- source_word: לֹא יָדָעוּ
  choice: 不认识
  rationale: ידע在盟约语境中不只指认知，也包含关系性的认识；“不认识”直译而不擅自展开为“不承认”或“不顺服”，保留其神学张力。
theological_decisions:
- issue: 性不忠的先知性隐喻
  choice: 淫乱的灵
  alternative: 卖淫的灵；不忠的灵
  rationale: 何西阿以婚姻和性不忠描绘拜偶像与背约。“淫乱”既保留原文的冒犯性力量，也不把隐喻改写为抽象的“不忠”。
- issue: “认识”的盟约含义
  choice: 不认识耶和华
  alternative: 不承认耶和华；与耶和华没有关系
  rationale: 原文ידע可同时涉及认知、承认和关系；直译为“认识”可保留多层含义，避免将其化约为顺服或关系中的某一方面。
- issue: אֱלֹהֵיהֶם的单复数指向
  choice: 自己的上帝
  alternative: 自己的众神
  rationale: 虽然אֱלֹהִים的形态可能容许复数理解，但何西阿的盟约诉讼语境表明，以色列的行为使他们不能归向与他们立约的上帝；故采用单数。
- issue: 人的行为与归回之间的关系
  choice: 他们的行为不容他们归向
  alternative: 他们不肯因自己的行为归向；他们的行为不让他们归向
  rationale: 原文句法略显压缩，可理解为他们的行为或惯常行径使归回无法发生。“不容”保留行为构成阻碍的表述，而不进一步断言是外在强制、心理无能或神圣弃绝。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不容……归向”保留希伯来语的压缩结构与盟约意味；“淫乱的灵”保留先知话语的尖锐性；神名采用中文通行形式“耶和华”。
