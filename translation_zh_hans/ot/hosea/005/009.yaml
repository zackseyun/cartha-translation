  text: אֶפְרַ֨יִם֙ לְ/שַׁמָּ֣ה תִֽהְיֶ֔ה בְּ/י֖וֹם תּֽוֹכֵחָ֑ה בְּ/שִׁבְטֵי֙ יִשְׂרָאֵ֔ל הוֹדַ֖עְתִּי נֶאֱמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/009.yaml
  text: Ephraim will become a desolation in the day of rebuke[c][b][a]; among the tribes of Israel I have made known what is sure.
translation:
  language: zh_hans
  text: 以法莲在责备之日[b]必成为荒场[a]；我已在以色列众支派中宣告确实的事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荒场”或译“令人惊骇之地”；原词既可指荒废毁坏，也可含其景象令人震惊之意。
    reason: lexical_alternative
  - marker: b
    text: “责备之日”或译“责罚之日”、“惩罚之日”或“审判之日”。
    reason: lexical_alternative
  - marker: c
    text: “确实的事”也可译作“可靠的事”或“必然之事”；原文着重表明这项宣告确实可信。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 保留希伯来专名；在何西阿书中可借指北国，但正文不将这一转喻解释性展开。
- source_word: לְשַׁמָּה
  choice: 成为荒场
  rationale: שַׁמָּה表示荒废、毁坏，也可含令人惊骇之意；“荒场”自然凝练，并保留先知审判的语气。
- source_word: תִהְיֶה
  choice: 必成为
  rationale: היה与לְ连用可表示进入某种状态；“成为”比单纯的“是”更准确，“必”体现预告的确定性。
- source_word: בְּיוֹם תּוֹכֵחָה
  choice: 在责罚之日
  rationale: תּוֹכֵחָה本义涉及责备、指正，在此审判语境中带有惩治力量；“责罚”兼顾申斥与处罚的含义。
- source_word: בְּשִׁבְטֵי יִשְׂרָאֵל
  choice: 在以色列众支派中
  rationale: 介词בְּ在此宜理解为范围或处所，译作“在……中”而非解释为“攻击”。
- source_word: הוֹדַעְתִּי
  choice: 我已……宣告
  rationale: ידע的使役式表示使人知道、公布；完成式译作“已宣告”，体现宣告已经发出且仍然有效。
- source_word: נֶאֱמָנָה
  choice: 确定无疑的事
  rationale: 该词源于אמן，表示稳固、可靠、确实；在此实词化，指上帝所宣告之事的确定性。
theological_decisions:
- issue: 是否明说“以法莲”代表北国以色列
  choice: 正文保留“以法莲”
  alternative: 北国以色列
  rationale: 原文直接使用专名；借代关系可由上下文辨明，不宜在正文中替原文作解释性展开。
- issue: 如何表达תּוֹכֵחָה在审判语境中的力度
  choice: 责罚
  alternative: 责备；惩罚；审判
  rationale: “责罚”既保留责备、申斥的词义，又不削弱本节明显的惩治语境，避免只取其中一面。
- issue: 末句是否将נֶאֱמָנָה具体化为所宣告的审判
  choice: 确定无疑的事
  alternative: 确定无疑的审判；可信的话
  rationale: 原文没有明确补出“审判”或“话”；采用较开放的实词化表达，既传达确定可靠，也不缩窄所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“荒场”“责罚之日”保留先知文学的凝练力度；分号对应原文两个紧密相连的分句。所有释义性扩展均置于脚注，正文不明说以法莲即北国，也不把末句限定为某一种解释。
