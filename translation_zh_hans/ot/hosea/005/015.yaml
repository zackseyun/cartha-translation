source:
  edition: WLC
  text: אֵלֵ֤ךְ אָשׁ֨וּבָה֙ אֶל מְקוֹמִ֔/י עַ֥ד אֲשֶֽׁר יֶאְשְׁמ֖וּ וּ/בִקְשׁ֣וּ פָנָ֑/י בַּ/צַּ֥ר לָ/הֶ֖ם יְשַׁחֲרֻֽ/נְנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/015.yaml
  text: I will go[a], I will return to my place until they acknowledge their guilt and seek my face[b]; in their distress they will seek me earnestly.
translation:
  language: zh_hans
  text: 我要离去，回到我的地方，直到他们承认自己的罪[a]，寻求我的面；他们在患难中必恳切地寻求我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“担当自己的罪责”，又或“被定为有罪”。希伯来语动词既可指负有或担当罪责，也可指认识并承认罪责；下文说他们寻求耶和华，因此正文译作“承认自己的罪”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“清早寻求我”。这个希伯来语表达可能带有清早起来寻找的意思，但在这里更可能强调殷勤、恳切地寻求。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֵךְ
  choice: 我要离去
  rationale: הלך的第一人称单数形式本义为“去、行走”。结合下文“回到我的地方”，“离去”在现代汉语中更清楚地表达此处撤离的动作，又不额外说明离开何处。
- source_word: אָשׁוּבָה
  choice: 回到
  rationale: שׁוב意为“返回、转回”；与“我的地方”连用时译作“回到”自然，并保留原文的空间意象。
- source_word: מְקוֹמִי
  choice: 我的地方
  rationale: מקום直译为“地方”。保留这一宽泛措辞，不具体化为“住处”或“家”，以免超出原文。
- source_word: עַד אֲשֶׁר
  choice: 直到
  rationale: 该组合引出神撤离状态持续的时间界限；“直到”准确而自然。
- source_word: יֶאְשְׁמוּ
  choice: 他们承认自己的罪
  rationale: אשם可指负有或担当罪责，也可在语境中指认识、承认罪责。后接“寻求我的面”和“恳切地寻求我”，因此正文采用“承认自己的罪”，同时以脚注保留其他真实可能。
- source_word: וּבִקְשׁוּ פָנַי
  choice: 寻求我的面
  rationale: בקשׁ与“面”连用可表达寻求某人的临在或恩宠。直译“寻求我的面”在汉语圣经语体中可以理解，也保留原文意象及其神学张力。
- source_word: בַּצַּר לָהֶם
  choice: 他们在患难中
  rationale: 该短语表示患难临到他们时的处境；这一译法符合现代汉语习惯。
- source_word: יְשַׁחֲרֻנְנִי
  choice: 必恳切地寻求我
  rationale: שׁחר的强化词干可带有“清早寻求”的字面色彩，但常用来表达殷勤、迫切的寻求。“恳切地寻求”传达其语用力度，脚注则保留时间性理解。
theological_decisions:
- issue: 神的撤离具有何种性质
  choice: 保留“离去、回到我的地方”的关系性和审判性空间意象，不解释为形而上的完全缺席。
  alternative: 译成更强的“彻底离弃”，或将其化解为纯粹的人类主观感受。
  rationale: 原文以两个移动动词描绘神在审判中撤回，直到百姓认罪并寻求他。译文保留这一张力，不加入经文未明说的系统神学说明。
- issue: יֶאְשְׁמוּ所表达的悔罪程度
  choice: 正文译为“承认自己的罪”。
  alternative: “担当自己的罪责”或“被定为有罪”。
  rationale: 后续寻求神的行动支持认罪的语境义，但该动词也可能强调客观罪责，因此在脚注中明确保留其他解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我的地方”和“寻求我的面”刻意保留原文的空间及身体意象；其余句法适度汉语化，使全句朗读自然。脚注标记均置于对应词语之后。
