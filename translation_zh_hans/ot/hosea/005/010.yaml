  text: הָיוּ֙ שָׂרֵ֣י יְהוּדָ֔ה כְּ/מַסִּיגֵ֖י גְּב֑וּל עֲלֵי/הֶ֕ם אֶשְׁפּ֥וֹךְ כַּ/מַּ֖יִם עֶבְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/010.yaml
  text: The princes of Judah have become like those who move a boundary marker[a]; on them I will pour out my wrath like water.
translation:
  language: zh_hans
  text: 犹大的首领已经成了挪移地界的人[a]；我要把我的烈怒像水一样倾倒在他们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同挪移界标的人。”这幅图景可能指实际挪动土地界标，也可能比喻侵犯上帝所设的界限。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיוּ
  choice: 如同
  rationale: 该完成式表示已经形成的状态。汉语在“首领如同……”中可自然表达这一既成状况，无须生硬补出“已经成为”。
- source_word: שָׂרֵי יְהוּדָה
  choice: 犹大的首领
  rationale: שָׂרִים指统治者、权贵或官长；“首领”既保留政治领导者的含义，也比“王子”更符合此处语境。
- source_word: כְּמַסִּיגֵי גְּבוּל
  choice: 如同挪移地界的人
  rationale: 该短语描绘非法挪动土地界标或改变边界的人。“挪移地界”保留具体的土地法律意象，同时不排除其比喻含义。
- source_word: גְּבוּל
  choice: 地界
  rationale: 此词可指疆界、边界，也可在相关法律习语中指由界标划定的产业边界。“地界”简洁地保留两者之间的联系。
- source_word: עֲלֵיהֶם
  choice: 在他们身上
  rationale: 直接表达审判所临到的对象，并与“倾倒”这一动词自然搭配。
- source_word: אֶשְׁפּוֹךְ
  choice: 我要……倾倒
  rationale: שׁפך意为倾倒；用于审判语境时，形象地表现上帝烈怒毫无保留地临到。
- source_word: כַּמַּיִם
  choice: 如水一般
  rationale: 严格保留原文“像水”的明喻，不增添原文没有明说的“洪水”意象。
- source_word: עֶבְרָתִי
  choice: 我的烈怒
  rationale: עֶבְרָה表示强烈的忿怒；“烈怒”符合先知审判语言的力度，并保持庄重自然。
theological_decisions:
- issue: 对犹大首领的指控性质
  choice: 正文保留“挪移地界”的具体意象，不限定它仅指土地侵占或仅指属灵越界。
  alternative: 可理解为实际挪动产业界标、政治上的边界侵夺，或比喻违犯上帝所设的界限。
  rationale: 希伯来语使人联想到挪移界标这一明确罪行，但何西阿可能借此指向更广泛的圣约和社会违犯。译文保留这种解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“首领”准确传达政治统治者；“挪移地界”保留先知话语中的法律与土地意象；分号呈现指控与审判宣告之间的推进。
