  text: בְּ/צֹאנָ֣/ם וּ/בִ/בְקָרָ֗/ם יֵֽלְכ֛וּ לְ/בַקֵּ֥שׁ אֶת יְהוָ֖ה וְ/לֹ֣א יִמְצָ֑אוּ חָלַ֖ץ מֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/006.yaml
  text: With their flocks and with their herds they will go to seek Yahweh[a], but they will not find him[b]; he has withdrawn from them.
translation:
  language: zh_hans
  text: 他们将带着羊群和牛群[b]去寻求雅威，却寻不见他；他已经离开他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离开”也可译作“从他们那里抽身”或“离他们而去”。
    reason: lexical_alternative
  - marker: b
    text: 这里提到羊群和牛群，可能暗示他们带着祭牲来寻求雅威。
    reason: cultural_note
lexical_decisions:
- source_word: בְּצֹאנָם וּבִבְקָרָם
  choice: 带着羊群和牛群
  rationale: 介词 בְּ 在此表示伴随；צֹאן 指羊、山羊等小型牲畜，בָּקָר 指牛等大型牲畜。“带着羊群和牛群”自然保留两类牲畜的区别。
- source_word: יֵלְכוּ לְבַקֵּשׁ
  choice: 去寻求
  rationale: 未完成式在先知性语境中表示将要发生的行动；בקש 用于寻求上帝时译作“寻求”，保留其宗教与关系层面的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名 YHWH，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: וְלֹא יִמְצָאוּ
  choice: 却寻不见他
  rationale: 连接词在这里带转折意味；希伯来文虽未重复宾语，汉语补出“他”更自然，也明确所寻而不得的是雅威。
- source_word: חָלַץ מֵהֶם
  choice: 他已经离开他们了
  rationale: חלץ 在此表示抽身、离开或撤回；完成式表达已经完成并持续产生后果的行动。“已经离开”自然传达雅威不再让他们借礼仪寻见他的审判性疏离，同时不把词义强化为永久弃绝。
theological_decisions:
- issue: 神名的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 יהוה。“雅威”较直接地音译该专名；不用“主”替换，以免把专名变成称号。
- issue: 以色列人寻求雅威的方式
  choice: 正文保留“带着羊群和牛群”的含蓄表达，以脚注说明可能涉及献祭
  alternative: 在正文中明说“带着献祭用的羊群和牛群”
  rationale: 牲畜很可能是祭牲，但原文没有直接使用“献祭”一词，因此不在正文中把这一推断确定化。
- issue: 雅威离开的性质
  choice: 译作“已经离开他们了”
  alternative: 已经从他们那里抽身；已经离弃他们
  rationale: 译文保留司法性与关系性的疏离，却不采用语义更强、可能暗示最终弃绝的“离弃”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“却寻不见他”形成清楚的转折；分号保留前后因果关联而不把因果关系明说。脚注标记均放在所说明的词句之后。
