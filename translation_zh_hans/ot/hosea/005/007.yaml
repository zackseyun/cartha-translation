  text: בַּ/יהוָ֣ה בָּגָ֔דוּ כִּֽי בָנִ֥ים זָרִ֖ים יָלָ֑דוּ עַתָּ֛ה יֹאכְלֵ֥/ם חֹ֖דֶשׁ אֶת חֶלְקֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/007.yaml
  text: They have dealt faithlessly with Yahweh[a], for they have borne foreign children[b]. Now the new moon will devour them with their portions.
translation:
  language: zh_hans
  text: 他们背叛了耶和华，因为他们生了外来的儿女[b]。如今，月朔[a]必吞灭他们和他们的份业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个月必吞灭他们和他们的份业。”希伯来语“חֹדֶשׁ”既可指“月朔”，也可指“一个月”。
    reason: alternative_reading
  - marker: b
    text: “外来的儿女”可能指违反盟约的结合所生的儿女，也可能更广泛地指与耶和华疏远的一代。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה בָּגָדוּ
  choice: 他们背叛了耶和华
  rationale: בגד 表示背信、背约或行诡诈；介词 ב 标明背叛所针对的对象。“背叛”在现代汉语中自然有力，也保留了盟约关系遭破坏的含义。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前一指控的根据，译作“因为”清楚自然。
- source_word: בָנִים זָרִים
  choice: 外来的儿女
  rationale: זרים 可指外来的、陌生的或异己的。“外来的儿女”保留原文意象及其含混性，避免直接限定为私生子、外族后代或纯属属灵意义上的悖逆世代。
- source_word: יָלָדוּ
  choice: 生了
  rationale: 该动词可概括生育后代，不必在汉语中额外指定父亲或母亲的视角。
- source_word: עַתָּה
  choice: 如今
  rationale: 表达审判迫近的先知性紧迫感，同时保持庄重自然。
- source_word: יֹאכְלֵם
  choice: 必吞灭他们
  rationale: אכל 字面为“吃”，在审判语境中“吞灭”更自然地表达毁灭性的消耗。
- source_word: חֹדֶשׁ
  choice: 月朔
  rationale: חֹדֶשׁ 既可指“月朔”，也可指“一个月”。正文采用“月朔”，保留何西阿书祭期意象；时间长度的可能读法列入脚注。
- source_word: חֶלְקֵיהֶם
  choice: 他们的份业
  rationale: חלק 可指所得之份、产业或分配的土地。“份业”保留其宽泛范围，不武断限定为田地或其他财物。
theological_decisions:
- issue: “外来的儿女”的含义
  choice: 保留可指盟约上异己或疏远之儿女的开放表达
  alternative: 专指与外族人所生的儿女；或纯粹比喻远离耶和华的一代
  rationale: 上下文具有盟约与偶像崇拜的意味，但原文并未明确限定其为族裔、婚姻身份或纯属灵比喻，因此正文不替原文消除张力。
- issue: חֹדֶשׁ 在审判句中的含义
  choice: 正文译作“月朔”，指向节期或月朔周期成为审判的场合或媒介
  alternative: 译作“一个月”，表示他们及其产业将在短期内被吞灭
  rationale: 两种意义在词汇和语境上都成立；正文保留祭祀历法的呼应，脚注则明确交代时间性的读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“背叛”凸显盟约性的背信；“份业”稍具经文语体，但仍为现代读者可理解，并能涵盖产业、土地和所得之份。所有具有实质意义的歧义均以正文措辞和脚注保存。
