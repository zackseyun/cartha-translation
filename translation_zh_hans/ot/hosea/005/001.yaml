id: HOS.5.1
reference: Hosea 5:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְעוּ זֹ֨את הַ/כֹּהֲנִ֜ים וְ/הַקְשִׁ֣יבוּ בֵּ֣ית יִשְׂרָאֵ֗ל וּ/בֵ֤ית הַ/מֶּ֨לֶךְ֙ הַאֲזִ֔ינוּ כִּ֥י לָ/כֶ֖ם הַ/מִּשְׁפָּ֑ט כִּֽי פַח֙ הֱיִיתֶ֣ם לְ/מִצְפָּ֔ה וְ/רֶ֖שֶׁת פְּרוּשָׂ֥ה עַל תָּבֽוֹר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/001.yaml
  text: Hear this[a], O priests; pay attention, house of Israel; and give ear, house of the king. For the judgment is for you[b], because you have been a trap at Mizpah and a net spread out upon Tabor.
translation:
  language: zh_hans
  text: 祭司们啊，要听这话！以色列家啊，要留心！王室啊，要侧耳听！因为这审判与你们有关[a]；你们在米斯巴成了圈套，在他泊山上成了张设的网罗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为审判是针对你们的。”希伯来语表达简练，既可指这审判关乎他们，也可指审判直接临到他们。
    reason: alternative_reading
  - marker: b
    text: 米斯巴和他泊都是地名；这里借这些地点描绘设下圈套、张开网罗捕捉猎物的景象。
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: 要听这话
  rationale: 保留先知宣告开头的命令语气；“这话”自然承接所要宣告的内容。
- source_word: הַקְשִׁיבוּ
  choice: 要留心
  rationale: 表达专注聆听，并与前后的听觉命令形成有变化的排比。
- source_word: הַאֲזִינוּ
  choice: 要侧耳听
  rationale: 保留第三个听觉动词及其加强语气，使希伯来文的修辞递进在中文中可感。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留盟约群体和整体性称谓，不简化为“以色列”。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王室
  rationale: 现代中文中自然地指王家、王朝或王廷，同时保持与祭司和以色列全家的群体并列。
- source_word: כִּי לָכֶם הַמִּשְׁפָּט
  choice: 因为这审判与你们有关
  rationale: לָכֶם 结构简练，可表示审判关乎他们，也可由语境理解为针对他们；此译法保留这种张力，由脚注说明较强的定罪读法。
- source_word: פַח
  choice: 圈套
  rationale: 清楚表达捕捉猎物的陷阱意象，符合现代汉语。
- source_word: לְמִצְפָּה
  choice: 在米斯巴
  rationale: 按与地名连用时的处所意义翻译，同时保留音译专名。
- source_word: רֶשֶׁת פְּרוּשָׂה
  choice: 张设的网罗
  rationale: 保留网已被铺开、布设以捕捉猎物的鲜明意象。
- source_word: עַל תָּבוֹר
  choice: 在他泊山上
  rationale: עַל 表示其上的位置；“他泊山”采用中文中易懂的传统地名形式。
theological_decisions:
- issue: 受话群体与“审判”的指向
  choice: 把祭司、以色列家和王室呈现为这场审判所关乎的对象，并让后面的圈套和网罗意象显出他们的罪责。
  alternative: 把该短语明确译为“审判是针对你们的”，直接表明定罪；或理解为他们负有施行审判的职责。
  rationale: 上下文的控告语气支持审判临到他们的理解，但希伯来文 לָכֶם 本身较紧凑，也可能仅说案件或审判关乎他们。因此正文不把潜在歧义完全消除，脚注交代较强的定罪读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。三个听觉命令分别译作“听”“留心”“侧耳听”，重现排比与递进；称呼各加“啊”，使先知当众宣告的语势清楚。地名使用通行的简体中文圣经音译。
