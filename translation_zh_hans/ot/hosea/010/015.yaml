base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/015.yaml
  text: Thus Bethel has done to you because of your great evil[b][a]. At dawn the king of Israel will be utterly cut off.
translation:
  language: zh_hans
  text: 伯特利因你们极大的恶，这样对待了你们。[a]黎明时，以色列王必被彻底剪除。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文重复“恶”字以加强语气，直译近似“你们之恶的恶”。
    reason: lexical_alternative
  - marker: b
    text: 或译“必被毁灭”或“必完全沉寂”。原文以不定式绝对形加同一动词的限定形式加强语气，表示结果确定而彻底。
    reason: alternative_reading
lexical_decisions:
- source_word: כָּכָה
  choice: 这样
  rationale: 指示方式或结果，简洁承接上文所述的审判。
- source_word: עָשָׂה לָכֶם
  choice: 必这样待你们
  rationale: 希伯来语完成式在先知宣告中可表达确定将发生之事；结合上下文，以中文的确定性未来表达自然。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 此处是地名，按常用中文圣经人名地名形式音译，不直译为“神的殿”。
- source_word: מִפְּנֵי
  choice: 因
  rationale: 此介词在句中表示审判的原因。
- source_word: רָעַת רָעַתְכֶם
  choice: 你们所行的大恶
  rationale: 原文重复“恶”以加强语气；译作“大恶”既保留强调，也符合现代汉语表达。补出“所行”使修饰关系清楚，但不增加新的罪名。
- source_word: בַּשַּׁחַר
  choice: 黎明时
  rationale: 保留明确的时间意象，也可能含有审判迅速临到的意味。
- source_word: נִדְמֹה נִדְמָה
  choice: 必彻底被剪除
  rationale: 不定式绝对形与限定动词并用，加强确定和彻底的语气；“剪除”保留被毁灭、被除去的审判含义。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 直接对应原文的属格结构，中文无需添加定冠词。
theological_decisions:
- issue: “伯特利”的所指
  choice: 保留地名“伯特利”，让它在语境中代表当地敬拜中心及其相关制度。
  alternative: 将其具体解释为伯特利的牛犊偶像，或将地名作讽刺性意译。
  rationale: 原文直接使用地名；不在正文中把其转化为某个特定对象，可避免过度解释。
- issue: 重复的 רָעַת
  choice: 译为“你们所行的大恶”。
  alternative: 较直译为“你们恶中之恶”，或强化为“你们极其邪恶”。
  rationale: 重复主要发挥加强作用；“大恶”自然传达严重程度，同时脚注说明原文形式。
- issue: נִדְמֹה נִדְמָה 的含义
  choice: 译为“必彻底被剪除”。
  alternative: “必被毁灭”或“必完全沉寂”。
  rationale: 该词在此可指毁灭、剪除，也可能带有止息或沉寂的色彩；正文选择符合君王倾覆语境的“剪除”，脚注保留词义歧义。
translation_notes:
  register: 采用现代、庄重而简明的普通话。“必这样待你们”保留先知宣告的确定语气；两处脚注分别说明原文的强调结构和动词本身的词义范围。
