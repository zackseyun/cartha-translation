  to: 撒马利亚的居民为伯亚文[a]的牛犊惊惶；那里的百姓为它哀悼，偶像祭司也为它、为它的荣耀欢喜，因为它的荣耀已经离它而去。[b]
  rationale: 修订删除未明示的“却”，将重复的两个“欢喜”合并为更贴合原文并列宾语的表达，并改写脚注b，使其既忠于WLC的“欢喜”，又透明说明英文审校译作“哀号”的语境性分歧。
