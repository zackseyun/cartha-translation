base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/005.yaml
  text: The inhabitants of Samaria tremble for the calves of Beth-aven, because its people mourn over it, and its idolatrous priests wail over it, over its glory, because it has departed from it.
translation:
  language: zh_hans
  text: 撒马利亚的居民为伯亚文[a]的牛犊惊惶；那里的百姓为它哀悼，偶像祭司也为它、为它的荣耀欢喜，因为它的荣耀已经离它而去。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯亚文”意为“邪恶之家”或“罪孽之家”，是先知对伯特利的贬称。
    reason: 说明这一地名的讽刺意味。
  - marker: b
    text: 希伯来文本在此通常读作“欢喜”。由于上下文是哀悼和失去荣耀，一些译法按语境译为“哀号”或“悲痛”。
    reason: 保留马所拉文本的通常词义，并简要提示由上下文引起的译法分歧。
lexical_decisions:
- source_word: עֶגְלוֹת
  choice: 牛犊
  rationale: 保留希伯来语复数形式；这里指伯亚文的敬拜偶像。
- source_word: יָג֖וּרוּ
  choice: 惊惶
  rationale: 该动词在此表达因所倚赖的神像遭祸而恐惧、战兢。
- source_word: כְמָרָיו
  choice: 偶像祭司
  rationale: כמרים通常指异教或偶像崇拜体系中的祭司；如此译可与一般的祭司用语区分。
- source_word: יָגִילוּ
  choice: 欢喜
  rationale: 按马所拉文本的通常词义译为“欢喜、欣喜”，不因上下文中的哀悼而改译成“哀号”；用“却”显明原文刻意保留的张力。
- source_word: גָלָה מִמֶּנּוּ
  choice: 已经离它而去
  rationale: גלה可表示离去或被掳迁；此处主语自然承接“荣耀”，译文保留荣耀从神像离去的意思，而不强行补出未明说的执行者。
theological_decisions:
- issue: 偶像祭司为何在百姓哀悼时“欢喜”
  choice: 保留马所拉文本“欢喜”的正面词义，并以脚注说明可能的时序理解
  alternative: 依上下文改译为“哀号”或“悲痛”
  rationale: 原文确用通常表示欢喜的 יגילו。将其直接改成哀号会消除文本本身的语义张力；可理解为祭司曾因偶像的荣耀而欢喜，如今那荣耀已经离去。
- issue: “荣耀”所指
  choice: 让“荣耀”在语法上指牛犊偶像所具有或所得的荣耀
  alternative: 解释为耶和华的荣耀或祭司自身的荣耀
  rationale: 最近的先行语是牛犊偶像，且原文反复使用指向它的代词；不宜引入原文未明确说明的神学对象。
translation_notes:
  register: 采用庄重而现代的书面普通话。“惊惶”“哀悼”“离它而去”自然清楚；“偶像祭司”准确标示宗教背景。“却”只用于呈现原文中哀悼与欢喜的对照，不把该张力改写掉。
