  text: דִּבְּר֣וּ דְבָרִ֔ים אָל֥וֹת שָׁ֖וְא כָּרֹ֣ת בְּרִ֑ית וּ/פָרַ֤ח כָּ/רֹאשׁ֙ מִשְׁפָּ֔ט עַ֖ל תַּלְמֵ֥י שָׂדָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/004.yaml
  text: They speak mere words[a], swearing false oaths, making covenants[d][c][b]; so judgment springs up like poison weed on the furrows of the field.
translation:
  language: zh_hans
  text: 他们只说空话[a]，起假誓，订立盟约[b]；于是，审判如毒草[c]，在田间的犁沟上长出[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们说了许多话”。这里的希伯来语以同源的“说”和“话”相连，强调言辞；结合上下文，也可理解为空洞的话。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语字面意思是“切立盟约”。
    reason: lexical_alternative
  - marker: c
    text: 这里的希伯来词指一种有毒或苦涩的植物，确切种类不详；有的译作“毒芹”或“苦胆”。
    reason: lexical_alternative
  - marker: d
    text: 或译：“公正如毒草，在田间的犁沟上长出。”若如此理解，“公正”带有尖锐的反讽意味。
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְּרוּ דְבָרִים
  choice: 他们只说空话
  rationale: 同源动词与名词连用，形成强调言说的表达；结合下文虚假起誓，译作“只说空话”自然地传达言辞空洞、不可信的责备语气。
- source_word: אָלות שׁוא
  choice: 起虚假的誓
  rationale: אָלָה可指带有咒诅意味的誓言，שָׁוְא表示虚妄、虚假；此处重点是誓言不实，故译作“起虚假的誓”。
- source_word: כרת ברית
  choice: 订立盟约
  rationale: 希伯来语字面为“切立盟约”，是订约的固定表达；“订立盟约”既符合现代汉语，也保留盟约含义。
- source_word: ופרַח
  choice: 滋生
  rationale: 该动词意为萌芽、长出；与有毒植物的比喻相配时，“滋生”兼具生长和有害蔓延的语感。
- source_word: כראשׁ
  choice: 如毒草一般
  rationale: רֹאשׁ在此指有毒或苦涩的植物，具体种类无法确定；“毒草”保留毒性意象而不武断指定植物。
- source_word: משׁפט
  choice: 判决
  rationale: 该词可指公正、审判或司法裁决；在虚假言辞和订约的控诉语境中，“判决”能保留司法层面的含义，并让毒草比喻显出其败坏性质。
- source_word: על תלמי שׂדי
  choice: 在田间的犁沟里
  rationale: תֶּלֶם指耕作形成的犁沟或垄；“田间的犁沟里”是自然、清楚的农业图景。
theological_decisions:
- issue: מִשְׁפָּט在谴责语境中的含义
  choice: 判决
  alternative: 公正
  rationale: 原词本身可表示“公正”，但上下文把它比作田间滋生的毒草，可能指败坏的司法裁决，也可能是对所谓“公正”的反讽。正文采用“判决”以契合负面语境，脚注保留“公正”的可能。
- issue: 毒草比喻与因果关系
  choice: 因此，判决如毒草一般……滋生
  alternative: 公正如毒草一般……长出
  rationale: ו可在此承接前述罪行并引出结果；译作“因此”清楚呈现逻辑，同时不把毒草的具体所指扩展为超出原文的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“空话—虚假的誓—盟约”保持先知控诉的递进；分号呈现前因后果。脚注分别说明同源表达、盟约习语、植物辨识的不确定性，以及מִשְׁפָּט可译“公正”的反讽读法。
