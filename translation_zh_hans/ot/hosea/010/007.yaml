base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/007.yaml
  text: Samaria is cut off[b][a], her king like foam on the surface of the waters.
translation:
  language: zh_hans
  text: 撒马利亚被毁灭[a]；她的王如水面上的浮沫[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被剪除了”“归于沉寂了”。原文动词可表示被终结、毁灭或止息。
    reason: lexical_alternative
  - marker: b
    text: 或译：“如水面上的碎木片”。有些人认为这里描写的是一小片木屑或杂物，无助地漂在水上。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמֶה
  choice: 灭亡了
  rationale: 此处דמה的Nifal形态表示被除灭、归于无有；结合上下文，指撒马利亚遭受覆亡。“灭亡了”自然明确，同时以脚注保留“被剪除”等可能译法。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用该地名在现代中文圣经语境中的通行译名；此处既指首都，也可借指北国。
- source_word: מַלְכָּהּ
  choice: 她的王
  rationale: 希伯来语后缀为阴性单数，与被拟人化为阴性的城撒马利亚呼应；中文用“她”保留这种拟人表达。
- source_word: כְּקֶצֶף
  choice: 如……浮沫
  rationale: קֶצֶף通常可指水上的泡沫或浮沫，突出短暂、无力、易被冲走的形象；“浮沫”比单说“泡沫”更贴合水面漂流的语境。
- source_word: עַל פְּנֵי מָיִם
  choice: 水面上的
  rationale: 原义为“在水的表面上”；“水面上的”是自然、简洁的现代中文，并保留原有图景。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。分号保留前后两个紧密相连的判断；“她的王”延续原文对撒马利亚的阴性拟人化。“灭亡了”表达完成性的覆亡，“浮沫”则保留王权短暂、脆弱并随水消逝的意象。
