id: HOS.10.2
reference: Hosea 10:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חָלַ֥ק לִבָּ֖/ם עַתָּ֣ה יֶאְשָׁ֑מוּ ה֚וּא יַעֲרֹ֣ף מִזְבְּחוֹתָ֔/ם יְשֹׁדֵ֖ד מַצֵּבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/002.yaml
  text: Their heart is divided[a]; now they will bear guilt. He himself will tear down their altars[c][b]; he will devastate their sacred pillars.
translation:
  language: zh_hans
  text: 他们的心不专一[a]；如今他们要担当罪责[b]。他必亲自拆毁他们的祭坛，摧毁他们的神柱[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的心诡诈”，也可直译为“他们的心分裂”。原文用词可指光滑、诡诈，也可指分开。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“他们必被判为有罪”或“他们必因罪受罚”。
    reason: lexical_alternative
  - marker: c
    text: “神柱”指用于宗教崇拜的竖立石柱。
    reason: cultural_note
lexical_decisions:
- source_word: חָלַק לִבָּם
  choice: 他们的心不专一
  rationale: חלק 在此可表示“分裂”，也可能有“光滑、诡诈”的含义。与“心”连用并结合何西阿书对混杂敬拜的指责，“心不专一”自然表达忠诚分裂，同时避免生硬的“心被分开”。
- source_word: יֶאְשָׁמוּ
  choice: 他们要担当罪责
  rationale: אשׁם 可指有罪、被定罪或承受罪责的后果。“担当罪责”保留其罪咎与相应责任之间的张力，不直接缩减为“受惩罚”。
- source_word: הוּא
  choice: 他必亲自
  rationale: 原文独立人称代词带有强调意味。译作“亲自”保留强调，但不在正文中补出原文未明说的主语名称。
- source_word: יַעֲרֹף
  choice: 拆毁
  rationale: 该词本义涉及折断颈项或砍断；用于祭坛时，“拆毁”既自然，又传达强力毁坏之意。
- source_word: מִזְבְּחוֹתָם
  choice: 他们的祭坛
  rationale: מזבח 的常规对应词，保留这些祭祀设施属于他们的表达。
- source_word: יְשֹׁדֵד
  choice: 摧毁
  rationale: 该动词表达劫掠、毁坏或使荒废；与神柱搭配时，“摧毁”符合上下句平行结构及现代汉语习惯。
- source_word: מַצֵּבוֹתָם
  choice: 他们的神柱
  rationale: מצבה 在此指用于宗教崇拜的立石。“神柱”简洁表达其祭祀性质，并以脚注说明文化背景。
theological_decisions:
- issue: 强调代词 הוּא 所指为何
  choice: 正文保留为“他必亲自”，不补称“耶和华”
  alternative: 明确译作“耶和华必亲自”，或理解为未具名的敌方审判工具
  rationale: 上下文很可能以神为施行审判者，但本节希伯来文只写“他”。保留代词及其强调，可呈现最可能的神学理解，同时不消除原文在直接指称上的余地。
- issue: חָלַק לִבָּם 的道德含义
  choice: 译作“他们的心不专一”
  alternative: “他们的心诡诈”或“他们的心分裂”
  rationale: “不专一”突出对神忠诚不完整的指控，却仍以脚注保留“诡诈”这一真实词义可能，避免把多义性完全抹平。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“心不专一”便于普通读者理解，又保留先知对分裂忠诚的责备；分号呈现从控诉转入审判宣告的结构。所有词义与文化说明均以正文脚注标记对应。
