id: HOS.10.11
reference: Hosea 10:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶפְרַ֜יִם עֶגְלָ֤ה מְלֻמָּדָה֙ אֹהַ֣בְתִּי לָ/ד֔וּשׁ וַ/אֲנִ֣י עָבַ֔רְתִּי עַל ט֖וּב צַוָּארָ֑/הּ אַרְכִּ֤יב אֶפְרַ֨יִם֙ יַחֲר֣וֹשׁ יְהוּדָ֔ה יְשַׂדֶּד ל֖/וֹ יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/011.yaml
  text: Ephraim was a trained heifer that loved to thresh[a], but I spared her fair neck. I will put Ephraim to the yoke; Judah will plow[c][b]; Jacob will harrow for him.
translation:
  language: zh_hans
  text: 以法莲是一头驯熟的小母牛，喜爱踹谷；我却顾惜它秀美的颈项。[a] 我要使以法莲负轭；[b] 犹大必耕田，雅各必为他耙地。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文含义较难。也可较直译为：“我经过它秀美的颈项。”正文按上下文理解为以法莲先前未被加上更沉重的劳役。
    reason: alternative_reading
  - marker: b
    text: 或译：“我要驾驭以法莲。”原文直译近于“我要使以法莲骑乘”，在这里很可能是给牲畜套上挽具或轭、使它劳作的习语。
    reason: lexical_alternative
  - marker: c
    text: “耙地”指在犁田之后打碎土块、整平土地。“为他”通常可理解为“为犹大”，也有人理解为“为自己”。
    reason: cultural_note_and_ambiguity
lexical_decisions:
- source_word: עֶגְלָה מְלֻמָּדָה
  choice: 一头驯熟的小母牛
  rationale: עֶגְלָה 指尚年轻的母牛，מְלֻמָּדָה 表示受过训练、惯于劳作；译文保留畜牧意象，并采用现代汉语自然说法。
- source_word: אֹהַבְתִּי לָדוּשׁ
  choice: 喜爱踹谷
  rationale: 原文表达惯常的喜爱；“踹谷”指牲畜踩踏谷物使籽粒脱落，保留农业图景以及这种工作相对轻省的含意。
- source_word: וַאֲנִי עָבַרְתִּי עַל טוּב צַוָּארָהּ
  choice: 我却顾惜它秀美的颈项
  rationale: 此句希伯来文含义困难。结合上下文，译作上帝先前不让它的颈项承受更重劳役；“却”呈现踹谷与随后负重之间的语意转折，但以脚注保留较贴字面的可能译法。
- source_word: אַרְכִּיב אֶפְרַיִם
  choice: 我要使以法莲负轭
  rationale: רכב 的使役形字面与“使骑乘”有关，但在耕作比喻中很可能指使牲畜受驾驭、承担劳作；“负轭”自然地明示该语境中的含意。
- source_word: יַחֲרֹשׁ
  choice: 必耕田
  rationale: 采用该动词通常的农业含义；“必”表达此处宣告将要发生之事的语气。
- source_word: יְשַׂדֶּד
  choice: 必……耙地
  rationale: 该词指犁田后碎土、整平田地的工序；“耙地”准确而简洁，脚注补充说明。
- source_word: לּוֹ יַעֲקֹב
  choice: 雅各必为他耙地
  rationale: 保留希伯来文第三人称单数代词，不将其关系改写为无代词结构；“他”在当前句法中通常理解为犹大，但脚注承认所指存在解释空间。
theological_decisions:
- issue: 以法莲、犹大和雅各承担农事劳作的比喻
  choice: 保留从较轻省的踹谷转向负轭、耕田和耙地的劳役图景，使其在审判语境中的管教意味可被感知。
  alternative: 可将全节较中性地理解为分派不同农事，而不强调惩罚；中间一句也可理解为上帝经过或临到以法莲的颈项。
  rationale: 何西阿书第十章的上下文涉及审判与悔改的呼召，但本节只以农业比喻表达，因此译文不加入比原文更明确的神学判断。
- issue: “雅各必为他耙地”中代词的所指
  choice: 正文保留“为他”，不直接点明所指。
  alternative: 可译为“雅各必为犹大耙地”或“雅各必为自己耙地”。
  rationale: 希伯来文保留第三人称代词；虽通常可回指犹大，但不宜在正文中消除原文存在的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“小母牛”“负轭”“耕田”“耙地”维持全节一致的农业比喻；“踹谷”虽带传统农事色彩，但简洁准确，并可由上下文理解。代词统一按动物比喻用“它”，涉及族群名称时不额外拟人化或加入解释。
