  text: וְ/קָ֣אם שָׁאוֹן֮ בְּ/עַמֶּ/ךָ֒ וְ/כָל מִבְצָרֶ֣י/ךָ יוּשַּׁ֔ד כְּ/שֹׁ֧ד שַֽׁלְמַ֛ן בֵּ֥ית אַֽרְבֵ֖אל בְּ/י֣וֹם מִלְחָמָ֑ה אֵ֥ם עַל בָּנִ֖ים רֻטָּֽשָׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/014.yaml
  text: The tumult will arise among your people[a], and all your fortresses will be devastated, as Shalman devastated Beth-arbel on the day of battle[b]; mothers were dashed to pieces with their children.
translation:
  language: zh_hans
  text: 喧嚣必在你的民中兴起；你所有的堡垒都必被摧毁，正如沙勒曼在争战之日摧毁伯·亚比勒一样[a]；母亲和儿女一同被摔碎了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沙勒曼”可能指某位名叫撒缦以色的亚述王，但确切的历史身份无法确定。
    reason: alternative_reading
  - marker: b
    text: 更直译为：“母亲被摔在儿女之上。”希伯来语的表达简短而强烈。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָאם
  choice: 必……响起
  rationale: 该完成式在先知性话语中指向将来的事件；结合“喧嚣”，译为“必响起”自然地表达突然爆发之意。
- source_word: שָׁאוֹן
  choice: 喧嚣
  rationale: 此词表示巨大的嘈杂、骚动，常见于战争与毁灭语境；“喧嚣”保留声音和动乱两方面的含义。
- source_word: בְּעַמֶּךָ
  choice: 在你的民中
  rationale: 介词בְּ在此表示事件发生的范围；“在……中”既贴近原文，也符合现代汉语。
- source_word: מִבְצָרֶיךָ
  choice: 你所有的堡垒
  rationale: 指用于防御的坚固地点；“堡垒”简洁保留军事含义，כָל译作“所有的”。
- source_word: יוּשַּׁד
  choice: 都必被摧毁
  rationale: שׁדד的被动形式包含遭劫掠并毁坏之意；上下文强调防御工事的覆灭，“被摧毁”最为自然。
- source_word: כְּשֹׁד
  choice: 正如……摧毁……一样
  rationale: 原文以名词性比较结构引出历史类比；汉语改用动词结构，使关系清楚而不增添新的逻辑连接。
- source_word: שַׁלְמַן
  choice: 沙勒曼
  rationale: 按希伯来语形式音译人名，不在正文中将其解释为某位撒缦以色，以保留历史身份的不确定性。
- source_word: בֵּית אַרְבֵאל
  choice: 伯亚比勒
  rationale: 按希伯来语音译地名，采用连写形式，适合中文专名习惯。
- source_word: בְּיוֹם מִלְחָמָה
  choice: 在争战之日
  rationale: 直译其特定战事发生的时间；“争战之日”庄重、清楚，也保留原文措辞。
- source_word: אֵם
  choice: 母亲
  rationale: 形态上为单数，在此可作类别性、集合性表达；中文“母亲”无需强行标明单复数，因而保留原文形式上的含混。
- source_word: עַל בָּנִים
  choice: 和儿女一同
  rationale: עַל字面为“在……之上”，但此处暴行描写中的具体空间关系简略而不确定；“和……一同”传达母亲与孩子共同遭难，同时不虚构具体动作方式。
- source_word: רֻטָּשָׁה
  choice: 被摔碎了
  rationale: 该被动式描写战争中猛烈摔击、击碎的暴行；“被摔碎”保留原文的强烈和骇人程度。
theological_decisions:
- issue: שַׁלְמַן的历史身份
  choice: 正文仅按原文音译为“沙勒曼”。
  alternative: 明确认定为撒缦以色三世、撒缦以色五世，或某位身份不详的统治者。
  rationale: 原文只提供שַׁלְמַן这一名字，无法确定具体历史人物；正文不应替原文解决这一历史疑问。
- issue: 末句暴行描写的表达
  choice: 译为“母亲和儿女一同被摔碎了”。
  alternative: 更逐字地译为“母亲被摔在儿女之上”，或解释为母亲抱着儿女时被摔碎。
  rationale: 希伯来语表达简短而强烈，动作的具体关系并不完全清楚；所选译法保留母子共同受害的恐怖场景，却不武断规定其动作细节。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“喧嚣必……响起”重现突发的听觉意象；分号对应原文并列推进的灾难图景，避免加入原文没有明说的时间或因果连接。人名、地名采用音译；末句保留希伯来语的简峻与暴烈，并以脚注呈现其字面结构。
