base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/003.yaml
  text: For now they will say[a], “We have no king, because we did not fear Yahweh[b]; and the king—what can he do for us?”
translation:
  language: zh_hans
  text: 如今他们必说：“我们没有王，因为我们没有敬畏雅威[a]；至于王，他能为我们做什么呢？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我们不敬畏雅威。”希伯来语完成式既可描述他们已形成的状态，也可指出他们过去有罪的失职。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他会为我们做什么呢？”希伯来语形式上指向将来；正文按反问语气译出王无力相助的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַתָּה
  choice: 因为如今
  rationale: 句首的כִּי承接上文并说明将临到的情形，译作“因为”；עַתָּה直译为“如今”，保留其当前或迫近的时间意味。
- source_word: יֹאמְרוּ
  choice: 他们要说
  rationale: 未完成式在这里适合作预告性表达；“要说”自然地传达先知话语中的将来指向。
- source_word: אֵין מֶלֶךְ לָנוּ
  choice: 我们没有王
  rationale: 按现代汉语习惯表达存在句，同时保留原文“没有王归于我们”的核心意思。
- source_word: לֹא יָרֵאנוּ אֶת יְהוָה
  choice: 我们没有敬畏雅威
  rationale: 保留完成式所表达的有罪过往或既成状态，也保留ירא兼具畏惧、敬重和顺服的分量；不用较弱的“尊敬”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以称号“主”代替专名。
- source_word: וְהַמֶּלֶךְ
  choice: 至于王
  rationale: 原文连词加定冠词形成突转；“至于王”在汉语中清楚凸显接下来的话题。
- source_word: מַה יַּעֲשֶׂה לָּנוּ
  choice: 他能为我们做什么呢？
  rationale: 形式上是未完成式，可指将来；上下文中的反问强调王无力提供实际帮助，因此正文用“能”，并在脚注保留形式更直接的译法。
theological_decisions:
- issue: “敬畏雅威”的含义
  choice: 正文保留“敬畏雅威”
  alternative: “尊崇雅威”或“尊敬雅威”
  rationale: ירא在盟约语境中包含畏惧、敬重与顺服；“敬畏”既贴近原文，也不削弱何西阿责备的力度。
- issue: 人的王所能发挥的作用
  choice: 将末句译为强调能力的反问
  alternative: “他会为我们做什么呢？”
  rationale: 原文形式可表达将来，但语境中的反问也可指向王的无能。正文呈现修辞意义，脚注保留将来式读法，不把两者强行合并。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。引语简洁有力；“至于王”传达原文突然转折的话题结构。神名译作“雅威”，并保留“敬畏”的盟约性和神学张力。
