  text: בְּ/אַוָּתִ֖/י וְ/אֶסֳּרֵ֑/ם וְ/אֻסְּפ֤וּ עֲלֵי/הֶם֙ עַמִּ֔ים בְּ/אָסְרָ֖/ם לִ/שְׁתֵּ֥י עינת/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/010.yaml
  text: When I desire[a], I will discipline them[b], and peoples will be gathered against them when they are bound for their two transgressions.
translation:
  language: zh_hans
  text: 我随己意时，必管教他们[a]；列邦必聚集攻击他们，当他们因两样罪孽[b]被捆绑时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管教”也可译作“惩戒”；这个动词可指带有纠正意味的惩罚。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文末句也可译作“因他们的两项罪孽”或“因他们的双重罪责”。其辅音形式还可令人想到“他们的两眼”，但这与上下文较不相合。“被捆绑”的施事者在此紧凑结构中未明确说出。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאַוָּתִי
  choice: 我随己意的时候
  rationale: 介词ב与带第一人称单数词尾的意愿词连用，表示上帝按自己的意愿采取行动的时机或情形；此译保留时间与意志两层含义。
- source_word: וְאֶסֳּרֵם
  choice: 必管教他们
  rationale: 该词源于יסר，通常表示管教、惩戒或训诲；这里处于审判语境，“管教”既自然，也不误解为源于אסר的“捆绑”。
- source_word: וְאֻסְּפוּ עֲלֵיהֶם עַמִּים
  choice: 万民必聚集攻击他们
  rationale: 被动式表达众民被召集而来；עֲלֵיהֶם在敌对语境中译作“攻击他们”。“万民”自然表达复数集合名词עַמִּים，并不要求指世上每一个民族。
- source_word: בְּאָסְרָם
  choice: 把他们捆绑起来
  rationale: 源于אסר“捆绑”。希伯来语结构紧凑，施事者未明说；汉语采用承接前句的处置表达，使万民成为语法上的施事者，同时保留捆绑意象。
- source_word: לִשְׁתֵּי עינתם
  choice: 因他们有两重罪孽
  rationale: 辅音形式存在文本与释义难点；按审判语境理解为与罪孽、罪责有关，并保留שְׁתֵּי的双重数值意味。“两重罪孽”比生硬的“两项罪孽”更自然，又不具体断定所指是哪两项罪。
theological_decisions:
- issue: 末句לִשְׁתֵּי עינתם的含义
  choice: 因他们有两重罪孽
  alternative: 因他们的两项罪孽；因他们的双重罪责；按辅音形式直读为“因他们的两眼”
  rationale: 上下文和传统释读支持罪孽或罪责之义，但辅音文本确有疑难。正文保留“两重”而不指定具体是哪两种罪，以免消除原文的张力；脚注交代直读“眼睛”的可能。
- issue: בְּאָסְרָם中捆绑行为的施事者
  choice: 以“万民”为汉语句法上的施事者
  alternative: 他们被捆绑时；我捆绑他们时
  rationale: 原文没有明确说出施事者。正文按最邻近的“万民”自然衔接，但不把“我”补进经文；此选择主要出于汉语表达需要，并不排除对原文结构的其他分析。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我随己意的时候”保留神主动决定行动时机的语气；分号呈现审判行动的推进。正文中的[a]、[b]均与脚注对应。
