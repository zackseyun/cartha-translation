  to: 我随己意时，必管教他们[a]；列邦必聚集攻击他们，当他们因两样罪孽[b]被捆绑时。
  rationale: 修订消除了草稿把捆绑行动明确归给“万民”的不必要补足，并将脚注a移至其实际说明的“管教”之后。末句用“当他们因两样罪孽被捆绑时”对应英语审计文本的被动处理，保留原文在施事者方面的紧凑与不确定性；“两样”保留双数／数值修辞，而不指定两罪为何。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:55:45Z'
