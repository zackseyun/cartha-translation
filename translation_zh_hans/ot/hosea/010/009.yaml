  text: מִ/ימֵי֙ הַ/גִּבְעָ֔ה חָטָ֖אתָ יִשְׂרָאֵ֑ל שָׁ֣ם עָמָ֔דוּ לֹֽא תַשִּׂיגֵ֧/ם בַּ/גִּבְעָ֛ה מִלְחָמָ֖ה עַל בְּנֵ֥י עַֽלְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/009.yaml
  text: From the days of Gibeah you have sinned[a], O Israel; there they have remained[b]. Will not war against the children of iniquity overtake them in Gibeah?
translation:
  language: zh_hans
  text: 以色列啊，你从基比亚的日子起[a]就犯罪了；他们仍站在那里。攻打不义之徒的战争，岂不会在基比亚追上他们吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 基比亚使人想起《士师记》19—21章所记的暴行和内战；何西阿以此作为以色列根深蒂固之败坏的典型。
    reason: cross_reference
  - marker: b
    text: 或译：“在基比亚，攻打不义之徒的战争没有追上他们”，又或：“在基比亚，攻打不义之徒的战争不会追上他们。”希伯来文此句难解。
    reason: alternative_reading
lexical_decisions:
- source_word: מִימֵי הַגִּבְעָה
  choice: 从基比亚的日子起
  rationale: מִן与“日子”连用，表示时间起点；保留“基比亚的日子”这一历史性表达及其回溯意味。
- source_word: חָטָאתָ יִשְׂרָאֵל
  choice: 以色列啊……你就犯了罪
  rationale: 动词为第二人称阳性单数，把以色列作为一个整体直接责问；“啊”自然体现呼格语气。
- source_word: שָׁם עָמָדוּ
  choice: 他们仍停留在那里
  rationale: עָמַד本义为“站立”，此处可表达持续处于原有状态；“仍停留”在现代汉语中自然，并保留其延续意味。原文由单数“你”转为复数“他们”，译文予以保留。
- source_word: לֹא תַשִּׂיגֵם
  choice: 岂不会……追上他们吗
  rationale: נשׂג的使役式常指“追上、赶上”；按先知性反问理解，以“岂不会……吗”表达预期的肯定答案，同时在脚注中保留其他时态和句法理解。
- source_word: מִלְחָמָה עַל בְּנֵי עַלְוָה
  choice: 攻打不义之徒的战争
  rationale: עַל在“战争”语境中标示敌对行动的对象；בְּנֵי עַלְוָה直译为“不义之子”，现代汉语用“不义之徒”较自然，也保留群体性和先知宣告的庄重语气。
- source_word: בַּגִּבְעָה
  choice: 在基比亚
  rationale: 介词בְּ在此最自然地表示地点，不预先将其解释为攻击对象。
theological_decisions:
- issue: 末句 לֹא תַשִּׂיגֵם בַּגִּבְעָה מִלְחָמָה עַל בְּנֵי עַלְוָה 的句法和时态
  choice: 译作反问：“攻打不义之徒的战争，岂不会在基比亚追上他们吗？”
  alternative: 也可能译作陈述句：“在基比亚攻打不义之徒的战争并没有追上他们”，或“不会追上他们”。
  rationale: 希伯来文末句结构艰深。反问读法符合上下文中的审判警告，但其他读法在语法上仍有可能，因此不在正文中武断消除歧义，而以脚注保留。
- issue: 基比亚历史事件的指涉
  choice: 正文只保留地名，脚注指出《士师记》19—21章的背景
  alternative: 在正文中直接解释为基比亚暴行及内战
  rationale: 原文借地名唤起共同历史记忆，却未明说事件细节；将背景置于脚注，既帮助读者理解，也避免把解释增添进正文。
translation_notes:
  register: 采用现代、庄重而可读的先知性语言。“以色列啊”保留直接呼告；“不义之徒”避免生硬直译“不义之子”，但仍保持原文的道德定性。正文保留原文从第二人称单数转为第三人称复数的转换，并用脚注呈现末句真实存在的语法歧义。
