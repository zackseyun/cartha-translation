  text: וְ/נִשְׁמְד֞וּ בָּמ֣וֹת אָ֗וֶן חַטַּאת֙ יִשְׂרָאֵ֔ל ק֣וֹץ וְ/דַרְדַּ֔ר יַעֲלֶ֖ה עַל מִזְבְּחוֹתָ֑/ם וְ/אָמְר֤וּ לֶֽ/הָרִים֙ כַּסּ֔וּ/נוּ וְ/לַ/גְּבָע֖וֹת נִפְל֥וּ עָלֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/008.yaml
  text: The high places of Aven[a], the sin of Israel, will be destroyed. Thorn and thistle will grow up on their altars, and they will say to the mountains, “Cover us!” and to the hills, “Fall on us!”
translation:
  language: zh_hans
  text: 以色列的罪——亚文的丘坛[a]——必被毁灭。荆棘和蒺藜必长满他们的祭坛。他们必对群山说：“遮盖我们！”对丘陵说：“倒在我们身上！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚文”也可译作“邪恶”或“罪孽”。希伯来语“亚文”既可用作地名，也有“邪恶、罪孽”的意思；这里可能有意兼具两义。
    reason: 保留地名读法与普通名词读法之间的歧义及双关。
lexical_decisions:
- source_word: בָּמוֹת
  choice: 丘坛
  rationale: 指设在高处的祭祀场所；“丘坛”简洁保留了地势与敬拜地点两层含义，也符合先知书语境。
- source_word: אָוֶן
  choice: 亚文
  rationale: 按地名音译，保留其可能指向伯特利祭祀中心的地名功能；同时用脚注说明该词也可意为“邪恶、罪孽”，保存何西阿可能有意使用的双关。
- source_word: חַטַּאת יִשְׂרָאֵל
  choice: 以色列的罪
  rationale: חַטַּאת在此最自然指“罪”，并与“亚文的丘坛”构成同位说明，而非指赎罪祭。
- source_word: נִשְׁמְדוּ
  choice: 必被毁灭
  rationale: 准确表达שׁמד的尼法勒形所含被毁掉、被除灭之意，并保留先知宣告的确定语气。
- source_word: קוֹץ וְדַרְדַּר
  choice: 荆棘和蒺藜
  rationale: 保留两种荒芜植物并列的意象，传达祭坛被废弃后遭野草覆盖的荒凉景象。
- source_word: יַעֲלֶה עַל מִזְבְּחוֹתָם
  choice: 必长满他们的祭坛
  rationale: עלה用于植物时可指长出；“长满”自然表达植物蔓生在祭坛之上的结果。
- source_word: כַּסּוּנוּ
  choice: 遮盖我们
  rationale: 直译命令式，保留人在审判面前渴望被山体遮蔽的强烈画面。
- source_word: נִפְלוּ עָלֵינוּ
  choice: 倒在我们身上
  rationale: 直接保留命令式及其绝望语气，不把“掩埋、藏匿”等隐含结果写进正文。
theological_decisions:
- issue: אָוֶן应作地名还是普通名词
  choice: 正文音译为“亚文”
  alternative: 译作“邪恶”或“罪孽”，即“邪恶的丘坛”
  rationale: 句法容许地名与贬义描述两种理解；何西阿也可能借该词与伯特利相关名称构成双关。正文保留较可能的地点指向，脚注保存“邪恶、罪孽”的语义张力。
- issue: חַטַּאת יִשְׂרָאֵל与前句的关系
  choice: 以破折号标示同位说明：“以色列的罪——亚文的丘坛——”
  alternative: 顺译为“亚文的丘坛，就是以色列的罪”
  rationale: 希伯来文把“以色列的罪”置于“亚文的丘坛”之后，最自然是同位语。破折号既明确关系，又保留原文凝练而有力的判断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“丘坛”表达古代高处祭祀场所；使用“必”保持先知审判宣告的力度。引语简短直接，保留原文的绝望呼喊。
