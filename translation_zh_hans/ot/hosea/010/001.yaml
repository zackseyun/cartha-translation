source:
  edition: WLC
  text: גֶּ֤פֶן בּוֹקֵק֙ יִשְׂרָאֵ֔ל פְּרִ֖י יְשַׁוֶּה לּ֑/וֹ כְּ/רֹ֣ב לְ/פִרְי֗/וֹ הִרְבָּה֙ לַֽ/מִּזְבְּח֔וֹת כְּ/ט֣וֹב לְ/אַרְצ֔/וֹ הֵיטִ֖יבוּ מַצֵּבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/001.yaml
  text: Israel is a luxuriant vine that yields fruit for himself[a]. The more his fruit increased, the more he multiplied altars; the better his land became[c][b], the better they made the sacred pillars.
translation:
  language: zh_hans
  text: 以色列是枝叶繁茂的葡萄树[a]，为自己结出果实[b]。他的果实越多，他增设的祭坛也越多；他的土地越肥沃，他们就把祭祀石柱装饰得越精美[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “枝叶繁茂”所译的希伯来词含义较难确定，也可译作“流空的”或“蔓延的”。正文根据本节果实增多、土地肥沃的语境译出繁盛之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“给自己结出果实。”原文可能含反身或自利的意味。
    reason: lexical_alternative
  - marker: c
    text: “祭祀石柱”也可译作“立石”或“祭祀柱”，指用于宗教崇拜的石制柱碑；这里处于先知所谴责的偶像崇拜语境中。
    reason: cultural_note
lexical_decisions:
- source_word: גֶּפֶן בּוֹקֵק
  choice: 枝叶繁茂的葡萄树
  rationale: גֶּפֶן是“葡萄树”。בּוֹקֵק含义较难确定；结合本节果实增多、土地肥沃的语境，译作“枝叶繁茂”最能表达旺盛生长的图景，同时在脚注保留“流空、蔓延”等可能。
- source_word: פְּרִי יְשַׁוֶּה לּוֹ
  choice: 为自己结出果实
  rationale: שׁוה在这里表示产生或结出果实；לּוֹ直译为“给自己、为自己”，可能带反身或自利意味，正文予以保留。
- source_word: כְּרֹב לְפִרְיוֹ
  choice: 他的果实越多
  rationale: 用“越……越……”表达希伯来文的比例关系，使果实增长与祭坛增多之间的讽刺性联系清楚自然。
- source_word: הִרְבָּה לַמִּזְבְּחוֹת
  choice: 增设的祭坛也越多
  rationale: רבה的使役式表示使之增多；“增设祭坛”准确而符合现代汉语表达。
- source_word: כְּטוֹב לְאַרְצוֹ
  choice: 他的土地越肥沃
  rationale: טוב在此指土地状况良好、出产兴旺，而非道德上的善；“肥沃”切合农业语境。
- source_word: הֵיטִיבוּ מַצֵּבוֹת
  choice: 他们就把神柱修造得越精美
  rationale: יטב的使役式在此表示使之更好或加以美化；复数主语“他们”保留原文由单数集体“以色列”转为复数的变化。מַצֵּבוֹת指用于祭祀崇拜的立石。
theological_decisions:
- issue: 繁荣意象与偶像崇拜的关系
  choice: 将以色列描写为繁茂多果，却把土地的丰饶用于增设祭坛、美化神柱。
  alternative: 开头可理解为“流空的葡萄树”或“空虚的葡萄树”。
  rationale: 本节随后的果实增多、土地肥沃、祭坛增加和神柱美化，更支持带讽刺意味的繁荣图景：以色列把昌盛用于受谴责的崇拜。此译法不额外引入特定宗派解释。
- issue: לּוֹ是否含自利意味
  choice: 译为“为自己”，保留其可能的反身或自利意味。
  alternative: 仅译作“结出果实”，把לּוֹ理解为较弱的反身成分。
  rationale: 原文明确有לּוֹ；正文保留“为自己”，既贴近形式，也不强行断定其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“越……越……”呈现原文两组比例结构；先以“他”指作为集体的以色列，后用“他们”保留希伯来文由单数转为复数的表达。
