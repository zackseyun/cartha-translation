  text: גַּם אוֹת/וֹ֙ לְ/אַשּׁ֣וּר יוּבָ֔ל מִנְחָ֖ה לְ/מֶ֣לֶךְ יָרֵ֑ב בָּשְׁנָה֙ אֶפְרַ֣יִם יִקָּ֔ח וְ/יֵב֥וֹשׁ יִשְׂרָאֵ֖ל מֵ/עֲצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/006.yaml
  text: Even it will be carried to Assyria as tribute for King Yareb[a]; Ephraim will receive shame[b], and Israel will be ashamed of its counsel.
translation:
  language: zh_hans
  text: 连它也必被运到亚述，作为贡物献给雅列王[a]。以法莲必蒙受羞辱；以色列必因自己的谋略而惭愧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“雅列王”。“雅列”也可能不是专名，而是“争讼的王”或“施报复的王”一类称号。
    reason: alternative_reading
  - marker: b
    text: “自己的谋略”也可理解为“它的谋略”；希伯来文中的代词所指并不完全确定，可能指以色列自己的政策或计谋。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אוֹתוֹ
  choice: 连它也
  rationale: גַּם置于句首，强调连上文所说的牛犊偶像也不能幸免；“连它也”自然传达这一强调，并以“它”照应无生命的偶像。
- source_word: לְאַשּׁוּר יוּבָל
  choice: 必被运到亚述
  rationale: יוּבָל是יבל的使役被动式，表示“被带去、被运去”；偶像是物件，因此“被运到”既保留被动语态，也符合现代汉语。
- source_word: מִנְחָה
  choice: 贡物
  rationale: 本节是亚述君王与政治臣服的语境，מִנְחָה在此更可能指献给宗主的贡物，而非礼拜中的祭物。
- source_word: לְמֶלֶךְ יָרֵב
  choice: 献给雅列王
  rationale: 保留יָרֵב作为名称或王号的形式，音译为“雅列”，不在正文中强行判定其词义；לְ在此表示贡物的接受者。
- source_word: בָּשְׁנָה אֶפְרַיִם יִקָּח
  choice: 以法莲必蒙受羞辱
  rationale: 直译结构为“以法莲必取得羞耻”；“蒙受羞辱”是自然而庄重的汉语，也保留遭遇耻辱的含义。
- source_word: וְיֵבוֹשׁ יִשְׂרָאֵל מֵעֲצָתוֹ
  choice: 以色列必因自己的谋略而惭愧
  rationale: בוש可表示羞愧或受辱；מן在此自然表达原因。第三人称单数后缀可回指作为集体单数的以色列，因此译作“自己的”，避免在中文中制造不必要的性别或指称歧义。
theological_decisions:
- issue: יָרֵב的身份和含义
  choice: 正文音译作“雅列王”
  alternative: “争战之王”“报复之王”等描述性称号
  rationale: 该词既可作为名称或王号理解，也可能具有描述性词义。正文保留其名称形式，脚注说明其他可能，避免把有争议的解释写死。
- issue: מֵעֲצָתוֹ所指的谋略
  choice: 译作“因自己的谋略”，指以色列自身的政策或计谋
  alternative: “因它的谋略”，将后缀理解为回指牛犊偶像，或较形式地译作“为他的谋略羞愧”
  rationale: 句法上最近的明确主语是作为集体单数的“以色列”，而何西阿书的语境也涉及以色列倚靠偶像及外交政策；“自己的”保留集体单数回指，又不额外引入男性人物。脚注承认后缀所指仍有解释空间。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“连它也”保留句首强调；分作两句以清楚呈现偶像被掳与以色列蒙羞之间的结果关系。所有脚注标记均置于正文相关处。
