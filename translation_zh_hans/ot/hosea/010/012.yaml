  text: זִרְע֨וּ לָ/כֶ֤ם לִ/צְדָקָה֙ קִצְר֣וּ לְ/פִי חֶ֔סֶד נִ֥ירוּ לָ/כֶ֖ם נִ֑יר וְ/עֵת֙ לִ/דְר֣וֹשׁ אֶת יְהוָ֔ה עַד יָב֕וֹא וְ/יֹרֶ֥ה צֶ֖דֶק לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/012.yaml
  text: Sow for yourselves for righteousness[a]; reap according to steadfast love. Break up for yourselves unplowed ground, for it is time to seek Yahweh[b], until he comes and rains righteousness on you.
translation:
  language: zh_hans
  text: '你们要为自己播种公义，

    按慈爱收割；

    要为自己开垦休耕地[a]。

    现在正是寻求耶和华的时候，

    直到他来到，

    向你们降下公义[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“未耕之地。”
    reason: נִיר 可指休耕、未耕或有待重新开垦的土地。
  - marker: b
    text: 或译：“教导你们公义。”希伯来语动词也可表示“教导”，但本节的农业意象较支持“降下”。
    reason: 保存 וְיוֹרֶה צֶדֶק 的词义歧义及其另一种传统读法。
lexical_decisions:
- source_word: זִרְעוּ לָכֶם לִצְדָקָה
  choice: 你们要为自己播种公义
  rationale: 保留“播种”的农业隐喻；“为自己”体现 לָכֶם 的受益兼反身意味。“播种公义”在现代汉语中自然凝练，也保留 לִצְדָקָה 所表达的目标或结果意味。
- source_word: קִצְרוּ לְפִי חֶסֶד
  choice: 照着忠贞的爱收割
  rationale: “收割”与“播种”形成紧密对应。לְפִי 表示依照或相称于；“忠贞的爱”兼顾 חֶסֶד 的慈爱、信实和关系忠诚，避免将其缩减为单纯情感。
- source_word: נִירוּ לָכֶם נִיר
  choice: 要为自己开垦荒地
  rationale: 以“开垦”表达翻耕、破土的命令，用“荒地”清楚传达尚未耕作或休耕之地的含义；“为自己”再次保留原文的受益兼反身语气。
- source_word: וְעֵת לִדְרוֹשׁ אֶת־יְהוָה
  choice: 现在正是寻求耶和华的时候
  rationale: 把原文简洁的名词结构译成自然的现代汉语，并以“正是”传达行动的紧迫性；יהוה 译为“耶和华”。
- source_word: עַד־יָבוֹא
  choice: 直到他来到
  rationale: 保留“寻求”持续到耶和华临到为止的时间关系；“他”的所指由上一句的“耶和华”自然确定。
- source_word: וְיֹרֶה צֶדֶק לָכֶם
  choice: 把公义如雨降给你们
  rationale: 在播种、收割、开垦的连续农业意象中，将 יֹרֶה 理解为降雨最为连贯；加入“如雨”使汉语明确表达其比喻性质，同时保留“教导”的可能读法于脚注。
theological_decisions:
- issue: וְיֹרֶה צֶדֶק 的含义
  choice: 耶和华“把公义如雨降给”百姓
  alternative: 耶和华“教导你们公义”
  rationale: 上下文贯穿播种、收割和开垦的农业意象，因此降雨读法更符合整体修辞；但 ירה 的使役形也可表示“教导”，故不将该歧义静默消除，而在脚注中保存另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文由“播种—收割—开垦—降雨”构成的农业隐喻链，并用分行呈现诗歌平行结构。脚注标记均置于对应正文之后；将英文咨询层中误置于“righteousness”之后的荒地脚注改置于“荒地”之后。
