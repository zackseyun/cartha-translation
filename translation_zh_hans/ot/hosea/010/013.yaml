base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/013.yaml
  text: You have plowed wickedness[a]; you have reaped injustice; you have eaten the fruit of deceit, because you trusted in your way[c][b], in the multitude of your warriors.
translation:
  language: zh_hans
  text: 你们耕种邪恶，收割不义，吃虚谎之果[a]；因为你倚靠自己的道路[b]，倚仗众多的勇士[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚谎”也可译作“谎言”或“欺骗”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语在这里从复数的“你们耕种、收割、吃”转为单数的“你倚靠……你的道路……你的勇士”，可能是把以色列作为一个整体来称呼。
    reason: cultural_note
  - marker: c
    text: “勇士”也可译作“大能者”或“战士”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרַשְׁתֶּם
  choice: 你们耕种
  rationale: 保留“耕种—收割—吃果子”的农业意象链；复数“你们”反映希伯来语第二人称复数。
- source_word: רֶשַׁע
  choice: 邪恶
  rationale: 表达明确的道德败坏，并适合作为比喻中“耕种”的对象。
- source_word: עַוְלָתָה
  choice: 不义
  rationale: 兼顾错误、不公与罪恶的含义，也与前面的“邪恶”有所区别。
- source_word: קְצַרְתֶּם
  choice: 收割
  rationale: 直译农业用语，与前面的“耕种”和后面的“吃”相连。
- source_word: אֲכַלְתֶּם
  choice: 吃
  rationale: 保留从耕种、收割到食用结果的比喻进程。
- source_word: פְּרִי כָחַשׁ
  choice: 虚假的果子
  rationale: 将结构自然译为“虚假的果子”，既保留“果子”意象，也表达 כָחַשׁ 所含的虚假、欺骗之意。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出前述指控的原因。
- source_word: בָטַחְתָּ
  choice: 你倚靠
  rationale: 表达信赖、依靠；使用单数“你”保留原文由复数转为单数的变化。
- source_word: בְדַרְכְּךָ
  choice: 自己的道路
  rationale: 保留“道路”的原有隐喻及其对路线、行事方式或策略的开放含义。
- source_word: בְּרֹב גִּבּוֹרֶיךָ
  choice: 倚仗众多的勇士
  rationale: 语境涉及军事力量，“勇士”清楚表达 גִּבּוֹרִים；“众多”体现 רֹב 所强调的数量。
theological_decisions:
- issue: 称呼由第二人称复数转为第二人称单数
  choice: 前半句译作“你们”，后半句译作“你”，并以脚注说明
  alternative: 全节统一译作“你们”，将以色列整体视为复数群体
  rationale: 原文先用复数动词，随后改用单数动词和后缀，可能把以色列作为一个整体来称呼。中文能够清楚呈现这一转换，不宜无声抹平。
- issue: “道路”的具体所指
  choice: 保留“自己的道路”
  alternative: 释义为“自己的策略”或“自己的行径”
  rationale: 原文可指道路、行事方式、政策或所选择的路线；直译能保留其隐喻与解释空间。
translation_notes:
  register: 采用庄重而自然的现代汉语，保留原文农业比喻的递进，并明确呈现复数到单数的称呼转换。标点用分号区分指控及其原因。
