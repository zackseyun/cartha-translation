  yaml_path: translation/ot/hosea/001/008.yaml
  text: After she had weaned Lo-ruhamah[a], she conceived and gave birth to a son.
translation:
  language: zh_hans
  text: 她给罗·路哈玛[a]断了奶以后，随后怀孕，生了一个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罗·路哈玛”意为“不蒙怜悯”或“未受怜悯”。这个名字的含义在上下文中很重要，正文保留音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְמֹל
  choice: 断奶以后
  rationale: גמל在此处指给孩子断奶；结合连续叙事，用“……以后”自然表达这一动作先于随后怀孕和生产。
- source_word: אֶת
  choice: 不另译
  rationale: 这是希伯来语的确定直接宾语标记，现代汉语无需对应词。
- source_word: לֹא רֻחָמָה
  choice: 罗·路哈玛
  rationale: 作为人名采用音译，并用间隔号呈现复合名称；名称含义另在脚注说明，以保留上下文中的象征意义。
- source_word: וַתַּהַר
  choice: 又怀孕
  rationale: הרה表示怀孕；“又”承接叙事中接连发生的事件，也符合现代汉语表达。
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: ילד在此为生产、生育；“生了”简洁自然，适合现代叙事语体。
- source_word: בֵּן
  choice: 一个儿子
  rationale: בֵּן意为“儿子”；“一个”符合汉语中首次引入该孩子时的自然表达。
