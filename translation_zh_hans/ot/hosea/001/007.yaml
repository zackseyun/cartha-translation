source:
  edition: WLC
  text: וְ/אֶת בֵּ֤ית יְהוּדָה֙ אֲרַחֵ֔ם וְ/הֽוֹשַׁעְתִּ֖י/ם בַּ/יהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וְ/לֹ֣א אֽוֹשִׁיעֵ֗/ם בְּ/קֶ֤שֶׁת וּ/בְ/חֶ֨רֶב֙ וּ/בְ/מִלְחָמָ֔ה בְּ/סוּסִ֖ים וּ/בְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/007.yaml
  text: But I will have compassion on the house of Judah[a], and I will save them by Yahweh their God; I will not save them by bow, or by sword, or by war, by horses, or by horsemen.
translation:
  language: zh_hans
  text: 但我要怜悯犹大家，并要靠着耶和华他们的上帝拯救他们[a]；我不借弓、刀、战争、战马和骑兵拯救他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必由耶和华他们的上帝施行拯救。”这里的希伯来语介词可表示媒介或施事；下文把耶和华与各种军事手段相对照。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶת
  choice: 但
  rationale: 连接词在此承接上一节对以色列家的审判，并转入对犹大家的怜悯，语境具有明显转折意味。
- source_word: בֵּית יְהוּדָה
  choice: 犹大家
  rationale: 保留希伯来语“家”的民族—盟约性表达，同时符合现代中文圣经语体。
- source_word: אֲרַחֵם
  choice: 我要怜悯
  rationale: רחם表达怜恤、慈悲；“怜悯”简洁庄重，也与本章儿女名字所形成的文字关联相呼应。
- source_word: וְהוֹשַׁעְתִּים
  choice: 拯救他们
  rationale: 使役词形表达使之得救或施行解救；“拯救”既适合当下军事政治语境，也保留其神学广度。
- source_word: בַּיהוָה אֱלֹהֵיהֶם
  choice: 借着耶和华他们的上帝
  rationale: 介词ב可表示工具、媒介或施事；下文与军事手段对比，故译为“借着”，同时以脚注保留另一种可表达直接施事的译法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式翻译四字神名，不以头衔替代。
- source_word: וְלֹא אוֹשִׁיעֵם
  choice: 我却不……拯救他们
  rationale: 重复前面的“拯救”以保留原文修辞对应；“却”突出神自己与军事力量之间的对照。
- source_word: בְּקֶשֶׁת וּבְחֶרֶב וּבְמִלְחָמָה
  choice: 借弓、刀、战争
  rationale: 依次保留原文的武器和战争意象；共享“借”使中文自然而不削弱原文累积列举的力量。
- source_word: בְּסוּסִים וּבְפָרָשִׁים
  choice: 战马或骑兵
  rationale: 语境明确是军事资源；“战马”使马匹用途清楚，“骑兵”自然表达骑马作战者。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名；正文保留专名而非译作“主”。“耶和华”在现代简体中文圣经语境中辨识度高，且不改变此处神亲自施救的重点。
- issue: בַּיהוָה אֱלֹהֵיהֶם的语法功能
  choice: 借着耶和华他们的上帝
  alternative: 由耶和华他们的上帝
  rationale: ב可指媒介、工具或施事。后文否定弓、刀等军事手段，支持“借着”的对比性表达；脚注保留“由”所体现的直接施事理解，不把语法张力单一化。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。“犹大家”保留先知书中的民族—盟约表达；军事项目以紧凑并列呈现。正文中的[a]与脚注相对应。
