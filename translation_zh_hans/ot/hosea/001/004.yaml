  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו קְרָ֥א שְׁמ֖/וֹ יִזְרְעֶ֑אל כִּי ע֣וֹד מְעַ֗ט וּ/פָ֨קַדְתִּ֜י אֶת דְּמֵ֤י יִזְרְעֶאל֙ עַל בֵּ֣ית יֵה֔וּא וְ/הִ֨שְׁבַּתִּ֔י מַמְלְכ֖וּת בֵּ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/004.yaml
  text: Then Yahweh said to him[a], “Call his name Jezreel, for in a little while I will punish the house of Jehu for the bloodshed of Jezreel[b], and I will put an end to the kingdom of the house of Israel.”
translation:
  language: zh_hans
  text: 耶和华对他说：“给他起名叫耶斯列[b]，因为再过不久，我要因耶斯列的流血之罪[a]惩罚耶户家，并终止以色列家的国度。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流血之罪”也可译作“血债”或“所流的血”。希伯来文直译为“耶斯列的诸血”，可指在耶斯列发生的流血事件，也可指与耶斯列有关的血债。
    reason: lexical_alternative
  - marker: b
    text: “耶斯列”既是这个孩子具有象征意义的名字，也是与耶户暴力行动有关的地名。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，指向希伯来文四字神名，而不以“主”这一称号替代。
- source_word: קְרָא שְׁמוֹ
  choice: 给他起名叫
  rationale: 自然表达希伯来语“称他的名”的命名句式。
- source_word: יִזְרְעֶאל
  choice: 耶斯列
  rationale: 按通行中文形式音译专名，并保留孩子名字与地名之间的刻意呼应。
- source_word: כִּי עוֹד מְעַט
  choice: 因为再过不久
  rationale: 兼顾כִּי的解释作用和עוֹד מְעַט所表达的时间临近。
- source_word: וּפָקַדְתִּי
  choice: 我要……惩罚
  rationale: פקד在审判语境中具有追讨、问罪和施罚的含义；“惩罚”在现代中文中清楚自然。
- source_word: דְּמֵי יִזְרְעֶאל
  choice: 耶斯列的流血之罪
  rationale: 复数דְּמֵי直译为“诸血”，是涉及流血或血债的惯用语；“流血之罪”保留罪责含义，同时不完全限定是地点关系还是关联关系。
- source_word: עַל בֵּית יֵהוּא
  choice: 惩罚耶户家
  rationale: 结合פקד与עַל的结构，以自然中文表达受追讨和惩罚的对象；“家”保留王朝家族的含义。
- source_word: וְהִשְׁבַּתִּי
  choice: 终止
  rationale: 准确表达使役式“使……止息、结束”的意思，并符合审判宣告的庄重语体。
- source_word: מַמְלְכוּת בֵּית יִשְׂרָאֵל
  choice: 以色列家的国权
  rationale: “国权”在此涵盖王权、统治和王国体制，并保留“以色列家”这一原文结构。
theological_decisions:
- issue: 对耶户家的审判性质
  choice: 译为上帝因耶斯列相关的流血之罪惩罚耶户家，不解释这项宣告与《列王纪下》9—10章之间的关系。
  alternative: 可理解为谴责耶户当时的杀戮本身，或理解为追讨耶户王朝后来延续暴行与偶像崇拜的罪。
  rationale: 本节明确宣告审判，却没有说明它如何对应耶户先前所领受的使命；译文应保留这一神学张力，不替文本作调和或定论。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“耶户家”和“以色列家”保留原文的家族、王朝及国族色彩；两处脚注标记均置于正文，分别说明希伯来语血债惯用语和“耶斯列”的双关关联。
