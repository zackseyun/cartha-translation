source:
  edition: WLC
  text: תְּחִלַּ֥ת דִּבֶּר יְהוָ֖ה בְּ/הוֹשֵׁ֑עַ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הוֹשֵׁ֗עַ לֵ֣ךְ קַח לְ/ךָ֞ אֵ֤שֶׁת זְנוּנִים֙ וְ/יַלְדֵ֣י זְנוּנִ֔ים כִּֽי זָנֹ֤ה תִזְנֶה֙ הָ/אָ֔רֶץ מֵֽ/אַחֲרֵ֖י יְהוָֽה־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/002.yaml
  text: The beginning of the word of Yahweh through Hosea[a]. And Yahweh said to Hosea, “Go, take for yourself a wife of whoredom and children of whoredom[c][b], for the land utterly commits whoredom by turning away from Yahweh.”
translation:
  language: zh_hans
  text: 耶和华借何西阿所说之话的开端。[a]耶和华对何西阿说：“去，为自己娶一个淫乱的妻子，并收纳淫乱的儿女；[b]因为这地大行淫乱，背离耶和华。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华起初借何西阿说话时。”希伯来文开头既可理解为篇首语，也可理解为时间从句。
    reason: alternative_reading
  - marker: b
    text: “淫乱的妻子”和“淫乱的儿女”也可译作“卖淫的妻子”和“卖淫的儿女”。原文可广指性方面的不忠，也可特指卖淫；“淫乱的儿女”这一表达可指与淫乱有关的儿女，并未明确说明其具体父系或出生情形。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近于：“因为这地淫乱再淫乱，离开跟随耶和华。”这是希伯来文的强调结构，描写这地极其严重地背弃与耶和华的关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִלַּת דִּבֶּר יְהוָה בְּהוֹשֵׁעַ
  choice: 耶和华借何西阿说话的开端
  rationale: 保留原文可作篇首语理解的名词性结构；בְּ按工具、媒介义译为“借何西阿”，并以脚注保留其也可构成时间从句的可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字译法，以专名而非称号呈现四字神名。
- source_word: לֵךְ קַח לְךָ
  choice: 去，为自己娶
  rationale: “去”保留第一个命令式；在婚姻语境中以“娶”自然表达קח，并用“为自己”对应לְךָ。
- source_word: אֵשֶׁת זְנוּנִים
  choice: 一个淫乱的妻子
  rationale: “淫乱”保留先知话语尖锐的性意象及其后续的盟约隐喻，同时不把词义缩限为商业性卖淫。
- source_word: יַלְדֵי זְנוּנִים
  choice: 淫乱所生的儿女
  rationale: 以自然中文表达原文“淫乱之子女”的浓缩结构；脚注保留其可能指“淫乱的儿女”的歧义。
- source_word: כִּי זָנֹה תִזְנֶה
  choice: 因为这地大行淫乱
  rationale: “大行”传达不定式绝对式与限定动词连用所产生的强调，并维持全节的性与盟约双重意象。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 保留“地”的地域与盟约共鸣；指称语境中的以色列地及其居民，而不缩窄为现代政治意义的“国家”。
- source_word: מֵאַחֲרֵי יְהוָה
  choice: 背离耶和华
  rationale: 自然表达字面“离开跟随耶和华之后”的希伯来语习语，清楚传达停止跟随和盟约背叛。
theological_decisions:
- issue: 是否弱化本节尖锐的性意象
  choice: 在“妻子”“儿女”和“这地”三处统一保留“淫乱”措辞
  alternative: 放荡、卖淫、奸淫
  rationale: זְנוּנִים及同根动词刻意以令人不安的性语言描绘以色列对耶和华的不忠；“淫乱”既有足够力度，又不像“卖淫”那样把含义限定为商业性行为。
- issue: בְהוֹשֵׁעַ表示对何西阿说，还是借何西阿说
  choice: 借何西阿说
  alternative: 对何西阿说；与何西阿说
  rationale: 下一分句另用אֶל הוֹשֵׁעַ明确表示“对何西阿”；因此本句的בְּ较宜理解为何西阿作为先知传言的媒介，但脚注仍保留开头句法的另一种整体分析。
- issue: “淫乱所生的儿女”是否断定儿女的生理父系身份
  choice: 按原文浓缩表达译出，但用脚注说明其语义范围
  alternative: 淫乱的儿女
  rationale: 原文属格结构可能关乎出生背景，也可能以家庭整体延续淫乱的标记；译文不进一步断定具体父系，脚注保存歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“淫乱”有意保留先知言辞的冲击力；“大行淫乱”兼顾希伯来文的强调形式和自然中文表达。开头保留篇首语式结构，并借脚注呈现时间从句的可能。
