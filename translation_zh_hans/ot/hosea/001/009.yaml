  text: וַ/יֹּ֕אמֶר קְרָ֥א שְׁמ֖/וֹ לֹ֣א עַמִּ֑י כִּ֤י אַתֶּם֙ לֹ֣א עַמִּ֔/י וְ/אָנֹכִ֖י לֹֽא אֶהְיֶ֥ה לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/009.yaml
  text: And he said[a], “Call his name Not-My-People, for you are not my people, and I am not yours.”
translation:
  language: zh_hans
  text: 他说：“给他起名叫‘非我民’，因为你们不是我的子民，我将不属于你们[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我将不作你们的（上帝）。”原文末句为省略表达，许多人按盟约用语理解为：“我将不作你们的上帝。”
    reason: 说明原文末句的将来式和省略结构，并保留常见的盟约性理解而不在正文补入“上帝”。
lexical_decisions:
- source_word: קְרָא שְׁמוֹ
  choice: 给他起名叫
  rationale: 这是希伯来语常见的命名公式。译为现代汉语自然的“给他起名叫”，既清楚表达命名动作，也保留先知性出生记号的语境。
- source_word: לֹא עַמִּי
  choice: 非我民
  rationale: 这里是孩子具有象征意义的名字。译出名字的含义，比单纯音译“罗阿米”更能传达本段的修辞力量；“非我民”简洁、庄重，也明显具有专名色彩。
- source_word: כִּי
  choice: 因为
  rationale: 该词引出给孩子取此象征性名字的原因；“因为”直接保留因果关系，符合现代汉语。
- source_word: אַתֶּם לֹא עַמִּי
  choice: 你们不是我的子民
  rationale: “我的子民”在汉语圣经语境中能自然表达带有盟约意味的“我的百姓”，同时“子民”与象征名“非我民”形成清楚呼应。
- source_word: וְאָנֹכִי לֹא אֶהְיֶה לָכֶם
  choice: 我也不再是你们的
  rationale: 原文末句简略，直译近于“而我不会成为你们的／为你们而存在”，没有明说“上帝”。“不再是你们的”在现代汉语中自然，并以名词性省略保留原文未明说宾语的张力；“不再”传达盟约关系遭到撤回的语境，脚注说明其时态及盟约性理解。
theological_decisions:
- issue: 末句对盟约公式的反转
  choice: 正文不补出“上帝”，译作“我也不再是你们的”
  alternative: “我将不属于你们”或“我不作你们的上帝”
  rationale: 希伯来文暗示“我要作你们的上帝、你们要作我的子民”这一盟约公式，却没有明说“上帝”。正文以汉语省略结构保留这种含蓄和神学张力，脚注再交代较完整的常见理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“非我民”作为象征性人名保持凝练；正文避免音译造成意义遮蔽。末句使用自然的汉语名词性省略，不把原文未明说的“上帝”直接补入正文。
