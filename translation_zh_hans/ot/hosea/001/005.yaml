  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/שָֽׁבַרְתִּי֙ אֶת קֶ֣שֶׁת יִשְׂרָאֵ֔ל בְּ/עֵ֖מֶק יִזְרְעֶֽאל־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/005.yaml
  text: And on that day I will break the bow of Israel in the Valley of Jezreel[a].
translation:
  language: zh_hans
  text: 到那日，我必在耶斯列谷折断以色列的弓[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “折断”也可译作“粉碎”；“弓”在这里代表以色列的军事力量。
    reason: 说明动词的词义选择及“弓”的借代含义，同时保留正文的原文意象。
lexical_decisions:
- source_word: וְהָיָה
  choice: 到……，我必……
  rationale: 这是引出未来事件的预言性表达；与后面的时间短语合译为“到那日”，既自然，也保留未来审判的语气。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的时间表达。“到那日”符合现代汉语习惯，也保留其指向特定未来时刻的意味。
- source_word: וְשָׁבַרְתִּי
  choice: 我必……折断
  rationale: שׁבר意为“打破、折断、粉碎”。弓是可被折断的具体器物，因此“折断”准确而形象；“必”体现希伯来语完成式在预言语境中的确定未来意义。
- source_word: קֶשֶׁת יִשְׂרָאֵל
  choice: 以色列的弓
  rationale: 保留原文具体的军事意象，不在正文中直接释为“军力”；这里的“弓”可借指以色列的军事力量。
- source_word: בְּעֵמֶק
  choice: 在……谷
  rationale: עֵמֶק指山谷或谷地；与地名组合译作“耶斯列谷”，简洁自然。
- source_word: יִזְרְעֶאל
  choice: 耶斯列
  rationale: 采用该地名在现代中文圣经传统中通行且易识别的音译，并与本章人名/地名的双关关联保持一致。
theological_decisions:
- issue: “以色列的弓”应按字面保留，还是解释为军事力量
  choice: 正文保留“以色列的弓”
  alternative: 以色列的军力／以色列的力量
  rationale: 原文使用具体而富象征性的军事意象。保留“弓”可维持先知话语的修辞力度，同时通过脚注说明其借代意义，避免把解释直接写入正文。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“到那日……我必……”保留先知宣告的确定性和审判语气；“耶斯列谷”用通行地名形式。
