base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/006.yaml
  text: Then she conceived again and gave birth to a daughter[a]. And he said to him, “Call her name Lo-ruhamah, for I will no longer again show compassion to the house of Israel[b], that I should surely forgive them.”
translation:
  language: zh_hans
  text: 她又怀孕，生了一个女儿。他对他说：“给她起名叫罗路哈玛[a]，因为我不再怜悯以色列家，决不赦免他们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罗路哈玛”这个名字的意思是“不蒙怜悯”或“得不到怜悯”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为我必定把他们除去。”希伯来文末句含义难以确定。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: 她又怀孕
  rationale: 以“又”表达 עוֹד，保留叙事的连续性与再次怀孕之意，措辞自然简明。
- source_word: וַתֵּלֶד בַּת
  choice: 生了一个女儿
  rationale: 准确表达 ילד 与 בַּת，在现代汉语中自然清楚。
- source_word: וַיֹּאמֶר לוֹ
  choice: 他对他说
  rationale: 原文明确保留两个第三人称阳性单数代词；不擅自把说话者或受话者明说为耶和华或何西阿。
- source_word: קְרָא שְׁמָהּ
  choice: 给她起名叫
  rationale: 采用现代汉语常用的命名表达，同时保留命令语气。
- source_word: לֹא רֻחָמָה
  choice: 罗路哈玛
  rationale: 在正文中按人名音译，并以脚注说明其象征意义；后文用“怜悯”重现 רחם 的词根呼应。
- source_word: לֹא אוֹסִיף עוֹד אֲרַחֵם
  choice: 我不再怜悯
  rationale: יסף 与 עוֹד 合用表示动作停止；中文“不再”已自然涵盖该语义，避免机械重复，同时以“怜悯”呼应女儿名字的含义。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留原文“家”的盟约群体和民族性表达，不简化为“以色列”。
- source_word: כִּי נָשֹׂא אֶשָּׂא לָהֶם
  choice: 决不赦免他们
  rationale: 将 נשׂא 理解为担当、除去罪责，即“赦免”；不定式绝对形与限定动词的组合带有强调作用，在前面否定范围之下译为“决不”。原句困难，另一种理解收入脚注。
theological_decisions:
- issue: 象征性女儿名字 לֹא רֻחָמָה 的处理
  choice: 正文音译为“罗路哈玛”，并以“怜悯”在解释性分句中重现名字的语义联系。
  alternative: 直接意译为“不蒙怜悯”或“无怜悯”。
  rationale: 音译保留其作为专名的身份，脚注和正文的词根呼应则让普通读者看见先知性命名的神学意义。
- issue: 困难末句 כִּי נָשֹׂא אֶשָּׂא לָהֶם 的解释
  choice: 理解为在否定范围内强调不予赦免：“决不赦免他们”。
  alternative: 理解为审判行动：“我必将他们掳去。”
  rationale: נשׂא 可用于担当或除去罪责，因而“赦免”符合怜悯被撤回的上下文；但希伯来文的句法和词义均有困难，故不隐藏“掳去”的可能读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“他对他说”的原文代词歧义，不擅自补明人物；以“怜悯”贯穿名字与审判宣告之间的词义联系，并用脚注保存末句的真实歧义。
