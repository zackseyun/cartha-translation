source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל הוֹשֵׁ֨עַ֙ בֶּן בְּאֵרִ֔י בִּ/ימֵ֨י עֻזִּיָּ֥ה יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה וּ/בִ/ימֵ֛י יָרָבְעָ֥ם בֶּן יוֹאָ֖שׁ מֶ֥לֶךְ יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/001.yaml
  text: The word of Yahweh that came to Hosea son of Beeri in the days of Uzziah[a], Jotham, Ahaz, and Hezekiah, kings of Judah, and in the days of Jeroboam son of Joash, king of Israel.
translation:
  language: zh_hans
  text: 雅威[a]的话临到备利的儿子何西阿，是在犹大诸王乌西雅、约坦、亚哈斯和希西家年间，也是在以色列王约阿施的儿子耶罗波安年间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；传统中文译作“耶和华”，也常拟音作“雅威”。
    reason: 说明四字神名的原文形式及传统中文译法。
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知书卷首语的固定表达；“话”比“信息”更贴近 דָּבָר，并维持庄重的启示语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中广为人知的专名形式，并以脚注说明其对应希伯来文四字神名。
- source_word: אֲשֶׁר הָיָה אֶל
  choice: 临到
  rationale: 这是希伯来先知书启示公式的自然汉语表达，既传达神的话传给先知，也保留原文庄重简练的语气。
- source_word: הוֹשֵׁעַ בֶּן־בְּאֵרִי
  choice: 备利的儿子何西阿
  rationale: 按现代汉语习惯表达父子关系，同时保留原文对先知身份的说明。
- source_word: בִּימֵי
  choice: 在……年间
  rationale: 此处按列举君王的历史纪年语境译为“年间”，比逐字译作“在……的日子”更自然，同时保留时期范围的含义。
- source_word: עֻזִּיָּה יוֹתָם אָחָז יְחִזְקִיָּה מַלְכֵי יְהוּדָה
  choice: 犹大王乌西雅、约坦、亚哈斯、希西家
  rationale: 将复数同位语“犹大诸王”按汉语习惯前置为共同称谓，不增添各王统治次序以外的信息。
- source_word: וּבִימֵי יָרָבְעָם בֶּן־יוֹאָשׁ מֶלֶךְ יִשְׂרָאֵל
  choice: 也是在以色列王约阿施的儿子耶罗波安年间
  rationale: 保留原文重复的时间框架，并清楚呈现耶罗波安的父名及其以色列王身份。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文读者最熟悉且具专名功能的“耶和华”；脚注同时交代原文为 YHWH，并列出另一常见拟音“雅威”，避免将专名无说明地改作称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号连接启示公式与历史纪年，使长句清楚易读；重复“年间”以反映原文两组纪年框架。
