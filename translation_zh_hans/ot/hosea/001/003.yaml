  text: וַ/יֵּ֨לֶךְ֙ וַ/יִּקַּ֔ח אֶת גֹּ֖מֶר בַּת דִּבְלָ֑יִם וַ/תַּ֥הַר וַ/תֵּֽלֶד ל֖/וֹ בֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/003.yaml
  text: So he went and took Gomer daughter of Diblaim[a], and she conceived and bore him a son.
translation:
  language: zh_hans
  text: 于是何西阿就娶了滴拉音的女儿歌篾[a]。她怀了孕，给他生了一个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“取了歌篾”；结合上节的命令，意思是娶歌篾为妻。
    reason: 说明希伯来文动词的字面意义及其在本段中的婚姻含义。
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 于是，何西阿去
  rationale: 该叙事性动词形式推进事件发展；补出上文已明确的主语“何西阿”，符合现代汉语表达，也不增加新的指称。
- source_word: וַיִּקַּח
  choice: 娶了
  rationale: לקח本义为“取、带走”，在婚姻语境中可指娶妻。现代汉语若直译为“取了”既不自然，也容易误解；结合上一节的命令，译作“娶了”准确传达此处的婚姻含义，字面形式则在脚注说明。
- source_word: אֶת גֹּמֶר
  choice: 歌篾
  rationale: אֶת是直接宾语标记，汉语不另译；人名按通行的中文圣经音译处理。
- source_word: בַּת דִּבְלָיִם
  choice: 滴拉音的女儿
  rationale: בַּת加专名表示父女关系；译法直接、自然，并保留人物的家族身份信息。
- source_word: וַתַּהַר
  choice: 她怀了孕
  rationale: הרה表示怀孕或受孕；“怀了孕”是清楚自然的现代汉语，并与下文生产相衔接。
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: ילד在此指妇人生育；“生了”简洁自然，准确表达事件。
- source_word: לוֹ
  choice: 给他
  rationale: 介词ל加第三人称阳性单数后缀，在生育公式中表达孩子与父亲的关系；“给他生了”保留这一关系含义。
- source_word: בֵּן
  choice: 一个儿子
  rationale: בֵּן指男性子嗣；“一个儿子”符合现代汉语首次引入该人物时的表达习惯。
theological_decisions:
- issue: 是否在译文中明确וַיִּקַּח的婚姻含义
  choice: 译作“娶了”，在正文中明确婚姻语境
  alternative: 较字面地译作“取了”或“把……接来”
  rationale: 希伯来文动词本身较宽泛，但上一节明确命令何西阿娶妻，此处显然叙述命令的执行。中文“娶了”自然且准确；脚注保留原文较字面的表达，避免掩盖其词汇形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”体现连续叙事关系；使用“娶了”避免生硬的字面翻译，同时以脚注保存原文措辞的信息。
