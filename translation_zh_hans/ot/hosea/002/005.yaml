base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/005.yaml
  text: or else I will strip her naked and expose her as on the day she was born[a], and make her like the wilderness, and make her like a parched land[b], and let her die of thirst.
translation:
  language: zh_hans
  text: 不然，我就要剥去她的衣服，使她赤身露体，使她显露出来，像她出生的那一天一样；我还要使她如同旷野，使她如同干旱之地，并使她渴死。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使她渴死”也可译作“以干渴使她死亡”；原文动词是使役形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: 不然
  rationale: 承接上文的命令，引出若不听从便会临到的后果；“不然”在现代汉语中自然保留警告语气。
- source_word: אַפְשִׁיטֶנָּה עֲרֻמָּה
  choice: 我就剥光她的衣服，使她赤身露体
  rationale: 保留使役动作及其结果，直接呈现剥去衣物、公开蒙羞的强烈意象。
- source_word: וְהִצַּגְתִּיהָ
  choice: 使她……一样
  rationale: הציג有使之处于、呈现于某种状态的含义；结合“赤身露体”和出生之日，译文以结果性表达自然传达其被置于显露状态的意思，避免生硬直译。
- source_word: כְּיוֹם הִוָּלְדָהּ
  choice: 像她出生的那一天一样
  rationale: 忠实保留明喻，以及出生时赤裸、无助的具体形象。
- source_word: וְשַׂמְתִּיהָ כַמִּדְבָּר
  choice: 使她如同旷野
  rationale: מִדְבָּר可指旷野或荒漠；“旷野”既符合汉语圣经语域，也保留荒凉而非仅指沙漠的含义。
- source_word: וְשַׁתִּהָ כְּאֶרֶץ צִיָּה
  choice: 使她如同干旱之地
  rationale: צִיָּה强调缺水、干旱；“干旱之地”清楚自然，并强化前句旷野的荒凉意象。
- source_word: וַהֲמִתִּיהָ בַּצָּמָא
  choice: 并使她渴死
  rationale: 采用“使……死”的结构保留使役词形及死亡结果，同时比“让她渴死”更准确体现主动施行审判的语气。
theological_decisions:
- issue: 对不忠妇人／以色列施行审判的隐喻
  choice: 保留赤身、旷野、干旱和渴死的具体意象
  alternative: 概括为羞辱、剥夺和惩罚
  rationale: 原文的神学张力来自婚姻隐喻中的公开羞辱与土地荒凉、死亡意象；直保这些形象，不将其抽象化或缓和。
- issue: 末句使役语气
  choice: 使她渴死
  alternative: 让她渴死／以干渴杀死她
  rationale: “使她渴死”兼顾原文使役力度与现代汉语自然度，不弱化为单纯放任，也不增添原文没有的施害方式细节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文连续的“使她”结构，以呈现审判行动的递进；“剥光她的衣服，使她赤身露体”清楚区分动作与结果。
