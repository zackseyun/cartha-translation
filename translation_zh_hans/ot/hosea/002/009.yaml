  text: וְ/רִדְּפָ֤ה אֶת מְאַהֲבֶ֨י/הָ֙ וְ/לֹֽא תַשִּׂ֣יג אֹתָ֔/ם וּ/בִקְשָׁ֖תַ/ם וְ/לֹ֣א תִמְצָ֑א וְ/אָמְרָ֗ה אֵלְכָ֤ה וְ/אָשׁ֨וּבָה֙ אֶל אִישִׁ֣/י הָֽ/רִאשׁ֔וֹן כִּ֣י ט֥וֹב לִ֛/י אָ֖ז מֵ/עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/009.yaml
  text: She will pursue her lovers[a], but she will not overtake them; she will seek them, but she will not find them. Then she will say, ‘I will go and return to my first husband, for it was better for me then than now.’
translation:
  language: zh_hans
  text: 她必追赶她的情人，却追不上他们；她必寻找他们，却找不到。于是她必说：“我要去，回到我第一个丈夫[a]那里，因为那时我比现在过得好。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从前的丈夫”。希伯来文直译为“我第一个丈夫”。
    reason: 说明 הָרִאשׁוֹן 可按字面理解为“第一个”，也可在此婚姻语境中理解为“从前的”。
lexical_decisions:
- source_word: וְרִדְּפָה
  choice: 她必追赶
  rationale: 该形式在此预言语境中自然指向将来；“追赶”保留主动追逐的意象，并与下文“追不上”相呼应。
- source_word: מְאַהֲבֶיהָ
  choice: 她的情人
  rationale: 何西阿书持续使用婚姻与不贞的比喻；“情人”直接保留这里越出婚姻关系的含义，不将其解释性改写为偶像或盟友。
- source_word: תַשִּׂיג אֹתָם
  choice: 追不上他们
  rationale: 使役词干的 נשׂג 接在“追赶”之后，表示赶上或追及；中文用“追不上”自然保留追逐意象。
- source_word: וּבִקְשָׁתַם
  choice: 她必寻找他们
  rationale: בקש 加宾语后缀表示有意寻找；“寻找”与下文“找不到”构成清晰的诗性平行。
- source_word: וְלֹא תִמְצָא
  choice: 却找不到
  rationale: מצא 在此指未能找到所寻求的人；“找不到”是简明自然的对应表达。
- source_word: וְאָמְרָה
  choice: 于是她会说
  rationale: 连接词在连续事件中带出追寻失败后的反应；“于是”表达顺承结果，又不把因果关系说得过强。
- source_word: אֵלְכָה וְאָשׁוּבָה
  choice: 我要去，回到
  rationale: 两个第一人称形式表达决意；译文保留“去”和“回到”两个动作，避免缩减为单一的“回去”。
- source_word: אֶל אִישִׁי הָרִאשׁוֹן
  choice: 到我起初的丈夫那里
  rationale: אישׁ 在婚姻语境中指“丈夫”；הראשון 直指较早、起初的丈夫。“起初的丈夫”保留字面表达，脚注说明也可理解为“从前的丈夫”。
- source_word: כִּי טוֹב לִי אָז מֵעָתָּה
  choice: 因为那时我比现在过得好
  rationale: 该句对比过去与现在的处境；此译法符合现代汉语，同时保留“那时／现在”的时间对照。
theological_decisions:
- issue: 以婚姻比喻以色列的不忠
  choice: 正文直接保留“情人”和“丈夫”的婚姻关系用语
  alternative: 将其解释性译为“盟友”“供养者”或“神明”
  rationale: 本节属于何西阿书持续展开的婚约比喻。情人可能象征外邦神明或政治盟友，但原文本身采用婚姻与不贞的意象，翻译不应把这一张力化约为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“追赶／追不上”和“寻找／找不到”保留原文的平行结构；引语使用自然口吻，同时避免弱化婚姻比喻。脚注标记置于其实际说明的“起初的丈夫”之后。
