id: HOS.2.2
reference: Hosea 2:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/נִקְבְּצוּ בְּנֵֽי יְהוּדָ֤ה וּ/בְנֵֽי יִשְׂרָאֵל֙ יַחְדָּ֔ו וְ/שָׂמ֥וּ לָ/הֶ֛ם רֹ֥אשׁ אֶחָ֖ד וְ/עָל֣וּ מִן הָ/אָ֑רֶץ כִּ֥י גָד֖וֹל י֥וֹם יִזְרְעֶֽאל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/002.yaml
  text: Then the sons of Judah and the sons of Israel will be gathered together[a], and they will appoint for themselves one head, and they will go up from the land[c][b], for great will be the day of Jezreel.
translation:
  language: zh_hans
  text: 犹大人和以色列人必聚集在一起，为自己立一个首领[a]，从那地上来[b]；因为耶斯列[c]的日子必是大日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”原文直译为“头”，强调两个群体同归一个领导之下；经文没有在这里说明这位首领的身份。
    reason: lexical_alternative
  - marker: b
    text: “从那地上来”可能指从被掳之地出来，也可能描绘复兴后的归回或上行；原文没有明确限定。
    reason: alternative_reading
  - marker: c
    text: “耶斯列”既是地名和人名，也是何西阿书中含有神学意味的名字，可令人联想到“撒种”，并在书中与分散和重新栽种的主题相呼应。
    reason: cultural_note
lexical_decisions:
- source_word: וְנִקְבְּצוּ
  choice: 必聚集在一起
  rationale: 该词为קבץ的尼法勒式，既可表达“被聚集”，也可表达共同聚集；汉语用“聚集在一起”自然地保留这种语义范围。
- source_word: בְּנֵי יְהוּדָה וּבְנֵי יִשְׂרָאֵל
  choice: 犹大人和以色列人
  rationale: 原文直译为“犹大的众子和以色列的众子”，在此指两个群体；译作“……人”符合现代汉语群体称谓，也保留二者平行关系。
- source_word: יַחְדָּו
  choice: 在一起
  rationale: 表示联合一致地行动，与“聚集”连用简明自然。
- source_word: וְשָׂמוּ לָהֶם רֹאשׁ אֶחָד
  choice: 为自己立一个首领
  rationale: שׂים在此有设立、委任之意；רֹאשׁ字面为“头”，可转指领袖。正文采用现代汉语清楚的“首领”，脚注保留原文比喻。
- source_word: וְעָלוּ מִן הָאָרֶץ
  choice: 从那地上来
  rationale: עלה表示上行、上来，מן־הארץ表示从那地出来或离开；此译保留空间意象，不限定为归回、出征或其他具体行动。
- source_word: כִּי גָדוֹל יֹום יִזְרְעֶאל
  choice: 因为耶斯列的日子必是大日子
  rationale: כִּי引出理由；前置的形容词גָדוֹל带有强调意味，“必是大日子”以自然而庄重的汉语重现其强调。
- source_word: יִזְרְעֶאל
  choice: 耶斯列
  rationale: 按专名音译；何西阿书同时借此名触发“撒播”和“分散”等联想，相关信息置于脚注。
theological_decisions:
- issue: 犹大与以色列合一后“一个头”的身份
  choice: 译为“一个首领”，不指明其具体身份，并以脚注注明原文比喻。
  alternative: 一位君王；一位弥赛亚式领袖；一个政治统治者
  rationale: 本节只陈述统一领导，并未直接确认这人的身份或职分；不作进一步限定，可保留经文的神学张力。
- issue: “从那地上来”的具体所指
  choice: 保留空间性表达，不在正文中说明是哪一片地或哪一种行动。
  alternative: 从被掳之地出来归回；以新出埃及的方式上来；进入应许之地；集结出征
  rationale: 原文容许多种与复兴相关的图景，正文若指定其中一种便会过早消除歧义。
- issue: “耶斯列的日子”所带的评价与双关
  choice: 保留专名和“大日子”的表述，不将其明确解释为审判或复兴。
  alternative: 耶斯列得复兴的日子；耶斯列受审判的日子；上帝重新栽种百姓的日子
  rationale: 上下文使此名具有丰富的神学回声，但本节本身没有把这些回声明说为单一含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“犹大人和以色列人”避免生硬直译“众子”；“首领”保证正文清楚，原文“头”的形象由脚注保存。句末“大日子”略带先知宣告的庄重语气，同时不擅自把它解释为单纯的审判或福分。
