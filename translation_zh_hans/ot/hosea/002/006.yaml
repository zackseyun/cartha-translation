  text: וְ/אֶת בָּנֶ֖י/הָ לֹ֣א אֲרַחֵ֑ם כִּֽי בְנֵ֥י זְנוּנִ֖ים הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/006.yaml
  text: And I will not show compassion to her children[a], for they are children of whoredom.
translation:
  language: zh_hans
  text: 至于她的儿女，我必不怜悯，因为他们是淫乱所生的儿女。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“淫乱的儿女”。希伯来语保留了性不忠的尖锐意象，在本书中象征对圣约的不忠。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: 至于
  rationale: 连词与宾格标记共同引出下一个直接宾语。译作“至于”既自然承接上文，也明确转换到“她的儿女”这一对象。
- source_word: בָּנֶיהָ
  choice: 她的儿女
  rationale: בנים虽可专指“儿子”，也常泛指后代；“儿女”在现代汉语中自然地涵盖所有子女，避免无根据地限定为男性。
- source_word: לֹא אֲרַחֵם
  choice: 我必不怜悯
  rationale: רחם的强化词干表示施怜悯、显慈悲；“不怜悯”简洁庄重，并保留本句强烈的情感与圣约审判意味。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出不施怜悯的理由，现代汉语用“因为”表达清楚自然。
- source_word: בְנֵי זְנוּנִים
  choice: 淫乱所生的儿女
  rationale: 该结构直译近于“淫乱的儿女”。“淫乱所生的儿女”在汉语中较易理解，同时保留何西阿书刻意尖锐的性不忠意象，不将其弱化为抽象的“不忠”。
- source_word: הֵמָּה
  choice: 他们是
  rationale: 独立代词带有一定强调作用；汉语以明确的“他们是”保留判断句和主语指向，无须另加强调词。
theological_decisions:
- issue: 何西阿婚姻隐喻中בְנֵי זְנוּנִים这一指控的表达
  choice: 淫乱所生的儿女
  alternative: 淫乱的儿女；不忠的儿女
  rationale: 译文保留先知话语中尖锐的性不忠意象，因为它承载着以色列背弃圣约的象征意义；同时不进一步断言这些儿女的具体生父身份，以免超出经文本身所保留的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“怜悯”保留经文语体但不显古奥；“淫乱所生的儿女”保持原文的严厉措辞与隐喻张力。
