  text: וְ/הָ/אָ֣רֶץ תַּעֲנֶ֔ה אֶת הַ/דָּגָ֖ן וְ/אֶת הַ/תִּיר֣וֹשׁ וְ/אֶת הַ/יִּצְהָ֑ר וְ/הֵ֖ם יַעֲנ֥וּ אֶֽת יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/024.yaml
  text: and the earth will answer the grain[a], the new wine, and the oil, and they will answer Jezreel.
translation:
  language: zh_hans
  text: 地必回应谷物、新酒和油；它们也必回应耶斯列[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶斯列”意为“上帝播种”。在《何西阿书》中，这既是地名，也是人名，并具有象征意义。
    reason: 说明专名的词义双关及其在《何西阿书》中的象征作用。
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: 地
  rationale: אֶרֶץ既可指“地/大地”，也可指“土地”。上下文构成天—地—出产依次回应的诗性链条；“地”既自然，又保留两者之间的含混。
- source_word: תַּעֲנֶה / יַעֲנוּ
  choice: 必回应
  rationale: ענה在本段反复出现，描绘彼此应答的链条。“回应”在现代汉语中自然，并能在两处保留同一动词及拟人意象。
- source_word: הַדָּגָן
  choice: 五谷
  rationale: דָּגָן泛指谷物出产；“五谷”是自然、庄重的集合性表达，并不限定某一种谷物。
- source_word: הַתִּירוֹשׁ
  choice: 新酒
  rationale: תִּירוֹשׁ通常指新酿或新出的酒；“新酒”准确保留其农业语境。
- source_word: הַיִּצְהָר
  choice: 油
  rationale: יִצְהָר指作为农产的油，通常为橄榄油；正文译作“油”不超出原文所明说的范围，也与五谷、新酒并列自然。
- source_word: וְהֵם
  choice: 它们
  rationale: 代词复指五谷、新酒和油三项，并延续这些农产被拟人化为回应者的意象。
- source_word: יִזְרְעֶאל
  choice: 耶斯列
  rationale: 保留专名的音译；其“上帝播种”的双关意义另以脚注说明，不在正文中消解。
theological_decisions:
- issue: 是否保留两次“回应”的拟人化链条
  choice: 两处均译作“回应”
  alternative: 将意思顺译为“地必出产……供给耶斯列”
  rationale: 原文刻意重复ענה，承接上下文从天到地、从地到农产、再到耶斯列的应答链条。保留重复可呈现受造秩序在复兴中彼此响应的诗性与神学张力。
- issue: 如何处理“耶斯列”的象征意义
  choice: 正文保留专名“耶斯列”，脚注说明其双关
  alternative: 正文直接译作“上帝播种”
  rationale: 此处既是名字，也带有“上帝播种”的象征作用。只取其一会缩减原文的多重意义，因此正文保留名字，脚注补明双关。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号呈现两个紧密相连的分句，并重复“回应”，保留原文的平行结构与拟人化诗意。脚注标记置于“耶斯列”之后，因为脚注解释的是该专名，而非“五谷”。
