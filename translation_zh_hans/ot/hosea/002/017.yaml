base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/017.yaml
  text: And from there I will give her her vineyards[a], and the Valley of Achor as a door of hope. There she will answer as in the days of her youth[b], as on the day when she came up from the land of Egypt.
translation:
  language: zh_hans
  text: 我必从那里把她的葡萄园赐给她，又使亚割谷成为希望之门[b]。她必在那里回应[a]，如同她年轻的日子，又如同她从埃及地上来的那日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她必在那里歌唱。”这个希伯来语动词可指回答、回应；在本节语境中也可能含有以歌声应和的意思。
    reason: lexical_alternative
  - marker: b
    text: 亚割谷使人想起亚干在那里受审判的事件（书7:24-26）；原本与灾祸相关之地，如今成为通向希望的门。
    reason: cross_reference
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我必……赐给
  rationale: 连词加完成式处于先知性应许语境中，表达将来的行动；“赐给”既保留 נתן 的基本义，也符合赐福语境。
- source_word: כְּרָמֶיהָ
  choice: 她的葡萄园
  rationale: כֶּרֶם 通常指葡萄园而非单株葡萄藤；阴性单数后缀指拟人化的以色列。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 明确保留与上文旷野场景的空间联系。
- source_word: עֵמֶק עָכוֹר
  choice: 亚割谷
  rationale: 采用中文圣经传统中通行的地名音译，并保留其与约书亚记第7章的互文联系。
- source_word: לְפֶתַח תִּקְוָה
  choice: 成为希望之门
  rationale: פֶּתַח 是门口、入口；介词 לְ 在此表达用途或结果。“成为希望之门”自然地保留原文隐喻。
- source_word: וְעָנְתָה
  choice: 她必……回应
  rationale: ענה 的基本义是回答、回应；上下文也可能含有以歌声应和的意味，因此正文保留较宽的“回应”。
- source_word: שָׁמָּה
  choice: 在那里
  rationale: 保留地点副词，指出复兴后的回应发生之处。
- source_word: כִּימֵי נְעוּרֶיהָ
  choice: 像她年轻时的日子一样
  rationale: 贴近希伯来文比较结构，并自然表达以色列早年的时期。
- source_word: וּכְיוֹם עֲלֹתָהּ מֵאֶרֶץ מִצְרָיִם
  choice: 又像她从埃及地上来的日子一样
  rationale: 保留 עלה מן 的“从……上来”意象及出埃及的救赎历史回响；יוֹם 可按所指事件时期译为“日子”，与前句形成流畅平行。
theological_decisions:
- issue: 复兴语境中 וְעָנְתָה 的含义
  choice: 正文译为“她必……回应”
  alternative: “她必歌唱”或“她必以歌声应和”
  rationale: 动词的核心意义是回答、回应，但此处可能唤起出埃及时歌唱应和的图景。使用“回应”可保留这种开放性，不把可能的歌唱含义定为唯一解释。
- issue: 亚割谷意象的翻转
  choice: 正文保留地名，并译为“希望之门”
  alternative: 意译为“患难谷”或在正文中直接解释其含义
  rationale: 保留专名可维持与亚干受审事件的历史联系，而“希望之门”呈现从审判之地转为复兴入口的张力，不在正文中过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“她”延续本段把以色列拟人化为女子的表达；保留“从那里”“上来”等原文空间意象。脚注标记紧随其所解释的词句。
