  text: וּ/זְרַעְתִּ֤י/הָ לִּ/י֙ בָּ/אָ֔רֶץ וְ/רִֽחַמְתִּ֖י אֶת לֹ֣א רֻחָ֑מָה וְ/אָמַרְתִּ֤י לְ/לֹֽא עַמִּי֙ עַמִּ/י אַ֔תָּה וְ/ה֖וּא יֹאמַ֥ר אֱלֹהָֽ/י־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/025.yaml
  text: And I will sow her for myself in the land[a], and I will have mercy on No Mercy, and I will say to Not My People, ‘You are my people,’ and he will say[c][b], ‘My God.’
translation:
  language: zh_hans
  text: 我要为自己把她撒播在这地上[a]；我要怜悯“未蒙怜悯”，对“非我子民”说：“你是我的子民。”他就会说[b]：“我的上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在大地上”。希伯来语可指特定的土地，也可指大地；此处语境较适合理解为土地。“她”在原文为阴性单数；“撒播”也呼应“耶斯列”这个名字所含的意思。
    reason: 保留词义范围、代词形式及先知性双关。
  - marker: b
    text: 希伯来文直译“他就会说”。阳性单数的“他”很可能把恢复后的子民作为一个整体来人格化。
    reason: 说明原文的单数阳性形式，避免误解为单一个人。
lexical_decisions:
- source_word: וּזְרַעְתִּיהָ
  choice: 我要……把她播种
  rationale: 保留זרע的农业意象、阴性单数宾语以及与“耶斯列”相关的播种双关；“播种”比泛化的“栽种”更贴近原文。
- source_word: לִּי
  choice: 为自己
  rationale: 表达受益或归属关系，凸显上帝重新收纳她归于自己的行动。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: אֶרֶץ既可指“地/大地”，也可指特定的“土地”；何西阿书的复兴语境较支持后者，同时脚注保留另一可能。
- source_word: וְרִחַמְתִּי
  choice: 我要怜悯
  rationale: “怜悯”自然、庄重，并与象征名“未蒙怜悯”形成清楚的逆转。
- source_word: לֹא רֻחָמָה
  choice: 未蒙怜悯
  rationale: 将象征名的含义译出，使审判转为复兴的文字呼应可见；比“无怜悯”更准确表达被动意义。
- source_word: לְלֹא עַמִּי
  choice: 对“非我子民”
  rationale: 译出象征名的含义，保留其与“你是我的子民”的直接反转。
- source_word: עַמִּי אַתָּה
  choice: 你是我的子民
  rationale: 保留第二人称阳性单数形式和立约公式；汉语“你”自然体现单数称呼。
- source_word: וְהוּא יֹאמַר
  choice: 他就会说
  rationale: 原文代词和动词均为阳性单数；保留“他”，不把被人格化的群体擅自改成复数。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 简洁保留立约回应与认信形式。
theological_decisions:
- issue: 象征性名字应音译还是意译
  choice: 正文意译为“未蒙怜悯”和“非我子民”
  alternative: 音译为“罗路哈玛”和“罗阿米”
  rationale: 本节的神学与修辞力量在于两个审判之名被明确逆转；意译能让现代中文读者直接看见这一呼应，脚注则保留传统音译。
- issue: 复兴群体回应时的数与性
  choice: 保留阳性单数“他就会说”
  alternative: 译为“他们就会说”或省去主语
  rationale: 原文明确采用第三人称阳性单数，把恢复后的子民人格化为一个回应者；不宜为求顺滑而改为复数。
- issue: בָּאָרֶץ的范围
  choice: 正文译为“在这地”
  alternative: 译为“在大地上”
  rationale: 上下文中的立约与土地复兴意象支持特定土地的理解，但原词本身仍可有更广范围，因此以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式尽量贴近希伯来文的平行结构；象征名加引号以提示其专名性质。所有正文脚注标记均按出现处设置。
