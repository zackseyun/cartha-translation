base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/008.yaml
  text: Therefore[a], behold, I am hedging up your way with thorns[c][b], and I will wall in her wall so that she will not find her paths.
translation:
  language: zh_hans
  text: 因此，看哪，我要用荆棘[a]堵住你的路，又要筑墙围住她[b]，使她找不到她的路径[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荆棘”也可译作“蒺藜”或“带刺的灌木”。
    reason: lexical_alternative
  - marker: b
    text: “筑墙围住她”原文措辞简短，直译近似“筑起她的墙”；意思可能是为她筑起一道屏障。
    reason: lexical_alternative
  - marker: c
    text: 原文先说“你的路”，随后转为“她的路径”；这里保留这一人称变化。
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的指责与审判，表达由此而来的结果。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: 保留强调和唤起注意的语气；与后面的行动表述结合，在现代汉语中自然地表达即将实施的行动。
- source_word: שָׂךְ
  choice: 堵住
  rationale: 该词表示用障碍封堵或围拦；与“荆棘”和“路”搭配，既清楚又保留道路受阻的意象。
- source_word: דַּרְכֵּךְ
  choice: 你的路
  rationale: 保留单数和第二人称阴性单数的直接称呼；“路”也可兼具生活道路或行为方向的比喻含义。
- source_word: בַּסִּירִים
  choice: 用荆棘
  rationale: 指可形成阻碍的带刺植物；“荆棘”在现代汉语中形象、自然。
- source_word: וְגָדַרְתִּי אֶת־גְּדֵרָהּ
  choice: 又要筑墙围住她
  rationale: 原文采用同根的动词和名词，措辞简短而不寻常；正文译出建立屏障、把她围住的基本意思，并以脚注保留结构上的歧义。
- source_word: וּנְתִיבוֹתֶיהָ
  choice: 她的路径
  rationale: 保留复数及第三人称阴性单数所属关系，也保留原文由“你的路”转为“她的路径”的人称变化。
- source_word: לֹא תִמְצָא
  choice: 使她找不到
  rationale: 在上下文中自然表达前述封堵行动所造成或意在造成的结果。
theological_decisions:
- issue: 本节由第二人称转为第三人称
  choice: 保留“你的路”与“她的路径”的转换
  alternative: 统一译成“你的路／你的路径”或“她的路／她的路径”
  rationale: 希伯来文本先直接对女子说话，随后转为第三人称描述她；保留这一变化可呈现先知话语的修辞张力，避免擅自整齐化。
- issue: 筑墙短语的所指
  choice: 正文译为“筑墙围住她”
  alternative: 较字面地译为“筑起她的墙”或“堵住她的围墙”
  rationale: 原文的同根词结构简短且可有不同分析。正文传达设置屏障的核心图像，脚注说明更贴近形式的可能译法，不将歧义变成教义判断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”保留先知宣告的强调语气；“堵住你的路”和“筑墙围住她”维持由荆棘阻路到围墙封锁的意象递进。
