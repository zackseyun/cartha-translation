id: HOS.2.1
reference: Hosea 2:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְֽ֠/הָיָה מִסְפַּ֤ר בְּנֵֽי יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹֽא יִמַּ֖ד וְ/לֹ֣א יִסָּפֵ֑ר וְֽ֠/הָיָה בִּ/מְק֞וֹם אֲשֶׁר יֵאָמֵ֤ר לָ/הֶם֙ לֹֽא עַמִּ֣/י אַתֶּ֔ם יֵאָמֵ֥ר לָ/הֶ֖ם בְּנֵ֥י אֵֽל חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/001.yaml
  text: Yet the number of the sons of Israel will be like the sand of the sea[a], which cannot be measured or counted; and in the place where it is said to them, “You are not my people,” it will be said to them, “Sons of the living God.”
translation:
  language: zh_hans
  text: 然而，以色列子孙[a]的数目必如海沙，无法量度，也无法数算。在那对他们说：“你们不是我的子民”的地方，必有人对他们说：“你们是永生上帝的儿子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”和“永生上帝的儿子”中的希伯来文均为“儿子”；前者也可译作“以色列人”。
    reason: 说明同一希伯来词在族群称谓和亲子身份宣告中的不同自然译法，并保留原文的平行关系。
lexical_decisions:
- source_word: וְהָיָה
  choice: 然而……必
  rationale: 句首连接词与完成式在此承接前文审判并转入复兴应许；“然而”自然表达转折，“必”体现其指向将来的确定性。
- source_word: מִסְפַּר
  choice: 数目
  rationale: 保留名词的直接含义，并与后文“量度”“数算”形成清楚呼应。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: בני 字面为“儿子”，在族群称谓中也指后裔；“以色列子孙”既自然表达整体族群，又保留亲缘和后裔意味。
- source_word: כְּחוֹל הַיָּם
  choice: 如海沙
  rationale: 这是表示不可胜数的传统比喻；简洁保留“海”与“沙”的意象，也呼应先祖应许的措辞。
- source_word: אֲשֶׁר לֹא יִמַּד וְלֹא יִסָּפֵר
  choice: 无法量度，也无法数算
  rationale: 两个未完成式在语境中表达实际上的不可能；分别译出“量度”和“数算”，不将二者合并。
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: 在那……的地方
  rationale: 保留原文具体的地点表达，不简化成单纯的“当……时”或抽象处境。
- source_word: יֵאָמֵר ... יֵאָמֵר
  choice: 对他们说……也必对他们说
  rationale: 中文无主句可自然对应希伯来文被动式，避免擅自指定说话者；后一个“必”保留应许的将来指向。
- source_word: לֹא עַמִּי אַתֶּם
  choice: 你们不是我的子民
  rationale: 自然呈现否定的盟约关系宣告；“子民”准确表达 עַם 在上帝与其民关系中的含义。
- source_word: בְּנֵי אֵל חָי
  choice: 你们是永生上帝的儿子
  rationale: “儿子”保留 בני 的阳性复数亲子称谓；补出中文判断句所需的“你们是”，不改变原文命题。“永生上帝”是 אֵל חָי 自然且通行的译法。
theological_decisions:
- issue: 盟约复兴宣告中的性别化亲子用语
  choice: 前句译“以色列子孙”，后句译“永生上帝的儿子”，并以脚注说明两处原文相同
  alternative: 两处均译“儿女”或分别译“以色列人”和“永生上帝的儿女”
  rationale: 希伯来文两处均用阳性复数 בני。前一处是惯用族群称谓，译作“子孙”较符合现代汉语；后一处是身份宣告，保留“儿子”可显出亲子称谓。脚注说明原文对应关系，避免掩盖文学平行。
- issue: 句首连接词所表达的审判—复兴转折
  choice: 译作“然而”
  alternative: 译作“并且”或“后来”
  rationale: 句法上的 waw 本可作一般连接，但上下文从“不是我的子民”的审判骤然转向增多和重新接纳的应许；“然而”呈现这一修辞转折而不额外规定时间顺序。
- issue: 复兴宣告的说话者是否明确
  choice: 采用无主句“对他们说”，不点明说话者
  alternative: 译作“上帝必对他们说”或“人必对他们说”
  rationale: 两个 יֵאָמֵר 都是被动式，原文没有明确施事者；保留不明说的形式，避免替文本解决这一开放之处。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“如海沙”“我的子民”“永生上帝”等表达保留经文的盟约语感；句式避免古奥，同时维持原文从审判转向复兴的力度。
