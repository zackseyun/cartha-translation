  text: אִמְר֥וּ לַ/אֲחֵי/כֶ֖ם עַמִּ֑/י וְ/לַ/אֲחֽוֹתֵי/כֶ֖ם רֻחָֽמָה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/003.yaml
  text: Say to your brothers[a], “My people,” and to your sisters[b], “Shown mercy.”
translation:
  language: zh_hans
  text: 你们要对你们的弟兄说：“我的子民[a]”；对你们的姊妹说：“蒙了怜悯[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“阿米”，是一个象征性的名字，意思是“我的子民”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“路哈玛”，是一个象征性的名字，意思是“蒙了怜悯”或“蒙了怜恤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: 你们要……说
  rationale: 这是אמר的阳性复数祈使式；用“你们要……说”自然表达复数命令的语气。
- source_word: לַאֲחֵיכֶם
  choice: 对你们的弟兄
  rationale: 原文是明确的阳性复数“弟兄”，并与下半句的阴性复数“姊妹”平行，因此不泛化为“同胞”。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 该词直译为“我的民／我的子民”，同时构成象征性名字“阿米”。正文译出含义，以保留何西阿书中名字所传达的先知性信息。
- source_word: וְלַאֲחוֹתֵיכֶם
  choice: 对你们的姊妹
  rationale: 原文明确使用阴性复数“姊妹”；中文保留与“弟兄”的对应。连接词在中文并列结构中可由分号自然承接。
- source_word: רֻחָמָה
  choice: 蒙了怜悯
  rationale: 该词源于רחם，是被动形式，表示“已蒙怜悯／蒙受怜恤”，也呼应象征性名字“路哈玛”。“蒙了怜悯”既自然，也保留被动和已经领受怜悯的意味。
theological_decisions:
- issue: 象征性儿女名字应在正文音译，还是译出其含义
  choice: 正文译为“我的子民”和“蒙了怜悯”，脚注保留“阿米”和“路哈玛”的音译
  alternative: 正文直接使用“阿米”和“路哈玛”
  rationale: 这些名字的语义是本节宣告逆转与复兴的核心。正文译出含义可使普通读者直接理解，脚注则保留名字形式及其与上下文的联系。
- issue: רֻחָמָה的状态意味
  choice: 译作“蒙了怜悯”
  alternative: 译作“蒙怜悯的”或“蒙怜恤”
  rationale: 原文可作为名字，也带有被动分词／形容词意味。所选译法不把它仅处理为抽象名称，并保留已经受到怜悯的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄／姊妹”保留原文明确的性别平行；“子民”较“人民”更适合表达与上帝立约归属的语境，又不额外加入宗派性解释。
