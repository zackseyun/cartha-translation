  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא אֶֽעֱנֶה֙ נְאֻם יְהוָ֔ה אֶעֱנֶ֖ה אֶת הַ/שָּׁמָ֑יִם וְ/הֵ֖ם יַעֲנ֥וּ אֶת הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/023.yaml
  text: And it shall happen in that day[a], declares Yahweh, that I will answer the heavens, and they shall answer the earth.
translation:
  language: zh_hans
  text: 到那日，雅威宣告：我必回应诸天，诸天也必回应大地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“土地”。希伯来语 אֶרֶץ 可指“大地”，也可指“土地、国土”；正文采用“大地”，以保留它与“诸天”的诗性对应。
    reason: 词义存在真实的语境歧义。
lexical_decisions:
- source_word: וְהָיָה
  choice: 必有这样的事
  rationale: 该形式引入将来的先知性场景；此译法保留确定的未来语气，又比“事情将成就”更自然。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是常见的先知性时间用语；“到那日”在现代汉语中自然、庄重，也保留其预告意味。
- source_word: אֶעֱנֶה / יַעֲנוּ
  choice: 应允
  rationale: 原文反复使用同一动词，构成雅威、诸天与大地之间彼此应答的诗性链条；统一译为“应允”可保留重复、拟人和供应所需的含义，而不直接解释成降雨或使土地丰产。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留先知宣告公式的庄重语气，并将四字神名按专名音译为“雅威”。
- source_word: הַשָּׁמַיִם
  choice: 诸天
  rationale: “诸天”既保留复数形式和诗歌格调，也与“大地”形成鲜明的天地对应。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 此处与“诸天”配对，并处在天地供应农产的诗性链条中；“大地”最能保留这一宇宙性意象，但“那地”仍是可能的语境译法。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用的是神的专名；“雅威”较直接地反映现代学界通常采用的发音，同时避免用称号取代专名。
- issue: 重复出现的 ענה 所表达的意象
  choice: 三处概念均保留为“应允”的应答链条
  alternative: 解释性地译为“使天降雨”或“使大地出产”
  rationale: 原文借重复和拟人制造诗性张力，并未在本节中直接说出降雨或丰产；保留“应允”可让下文自行展开其农业含义。
- issue: הָאָרֶץ 的范围
  choice: 大地
  alternative: 那地
  rationale: “诸天—大地”的对应支持较广的译法，但该词也可指以色列之地；正文保留诗歌配对，脚注注明另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。以破折号标出插入式的“雅威宣告”，保留原文语序和宣告力度；重复“应允”以呈现原文刻意的回环，不把诗性意象提前解释为具体的气象或农业过程。
