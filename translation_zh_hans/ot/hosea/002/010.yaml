source:
  edition: WLC
  text: וְ/הִיא֙ לֹ֣א יָֽדְעָ֔ה כִּ֤י אָֽנֹכִי֙ נָתַ֣תִּי לָ֔/הּ הַ/דָּגָ֖ן וְ/הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֑ר וְ/כֶ֨סֶף הִרְבֵּ֥יתִי לָ֛/הּ וְ/זָהָ֖ב עָשׂ֥וּ לַ/בָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/010.yaml
  text: But she did not know that it was I who gave her the grain[a], the new wine, and the oil, and who multiplied silver for her and gold[b], which they made into Baal.
translation:
  language: zh_hans
  text: 她却不知道，是我赐给她五谷、新酒和油，使她的银子增多，又赐给她金子；他们却用这些为巴力制作偶像。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文十分简略，直译可作“他们为巴力制作（它们）”。这可指用银和金制作巴力像，也可泛指用这些财富制作供巴力崇拜使用的物件。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִיא
  choice: 她却
  rationale: 保留阴性单数主语，并按上下文把连接词译出转折意味。
- source_word: לֹא יָדְעָה
  choice: 不知道
  rationale: 直接对应ידע的基本义；在语境中也自然包含“不承认、不晓得来源”的意味，而不替正文预先限定。
- source_word: כִּי אָנֹכִי
  choice: 是我
  rationale: 用判断式结构体现独立代词אָנֹכִי的强调：供应者正是说话者。
- source_word: נָתַתִּי לָהּ
  choice: 赐给她
  rationale: “赐给”适合神作为供应者的语境，同时清楚表达间接宾语。
- source_word: הַדָּגָן
  choice: 五谷
  rationale: 指各类谷物出产，并非现代意义上的玉米；“五谷”在现代中文中自然且有农业语感。
- source_word: הַתִּירוֹשׁ
  choice: 新酒
  rationale: 保留תירוש作为新酿酒或葡萄酒产物的常见含义，也维持先知书常见的农产组合。
- source_word: הַיִּצְהָר
  choice: 油
  rationale: 此词通常指作为农产品的橄榄油；中文正文用“油”自然简洁，在这一农产清单中不易误解。
- source_word: וְכֶסֶף הִרְבֵּיתִי לָהּ
  choice: 又使她的银子增多
  rationale: 既保留רבה使役形“使增多”的语义，也用现代中文清楚表达这些财富来自说话者。
- source_word: וְזָהָב עָשׂוּ לַבָּעַל
  choice: 他们却把金子用在巴力身上
  rationale: 保留复数动词“他们”和לַבָּעַל的指向关系；措辞不在正文中强行判定是铸造巴力像、制作敬拜用品，还是更广义地用于巴力崇拜。
- source_word: הַבָּעַל
  choice: 巴力
  rationale: 此处指迦南神祇的专名，不宜译作泛称“主”或“主人”。
theological_decisions:
- issue: לַבָּעַל在偶像崇拜语境中的所指
  choice: 巴力
  alternative: 那位主／主人
  rationale: 上下文谴责对特定迦南神祇的崇拜，因此采用专名“巴力”，避免把它误读为一般称谓。
- issue: עָשׂוּ לַבָּעַל所描述的具体行为
  choice: 把金子用在巴力身上
  alternative: 用金子铸造巴力像／把金子献给巴力
  rationale: 希伯来语表达简略，可指制作巴力像或敬拜用品，也可泛指把财富用于巴力崇拜。正文保留范围，脚注说明较具体的可能解释。
- issue: 复数动词עָשׂוּ造成的主语转换
  choice: 他们
  alternative: 她
  rationale: 马所拉文本明确使用第三人称复数，故不依上下文擅自改成单数阴性；保留突出的复数主语。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“五谷、新酒和油”保持农业出产的并列节奏；分号凸显神所赐的财富与人把财富用于巴力之间的反差。脚注标记[a]已置于相关分句之后。
