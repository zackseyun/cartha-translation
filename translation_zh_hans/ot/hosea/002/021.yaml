  text: וְ/אֵרַשְׂתִּ֥י/ךְ לִ֖/י לְ/עוֹלָ֑ם וְ/אֵרַשְׂתִּ֥י/ךְ לִ/י֙ בְּ/צֶ֣דֶק וּ/בְ/מִשְׁפָּ֔ט וּ/בְ/חֶ֖סֶד וּֽ/בְ/רַחֲמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/021.yaml
  text: And I will betroth you to myself forever; yes[a], I will betroth you to myself in righteousness and in justice, and in steadfast love and in compassion.
translation:
  language: zh_hans
  text: 我必聘你归我，直到永远；我必以公义、公正、忠贞的慈爱[a]和怜悯，聘你归我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠贞的慈爱”也可译作“慈爱”或“忠诚之爱”。希伯来语 חֶסֶד 包含坚定、忠诚的爱，也常带有怜悯之意。
    reason: 说明 חֶסֶד 的宽广语义，并保存可行译法。
lexical_decisions:
- source_word: אֵרַשְׂתִּיךְ
  choice: 我必聘你归我
  rationale: 动词 ארשׂ 特指订婚、聘定，而不是笼统的结婚。“聘你归我”保留婚约意象、第二人称单数和 לִי 所表达的归属关系。
- source_word: לְעוֹלָם
  choice: 直到永远
  rationale: 表达这婚约关系持久、永不终止；中文自然庄重，又不把经文扩写为后续婚礼或婚姻生活。
- source_word: בְּצֶדֶק
  choice: 以公义
  rationale: צדק 在此表示合乎正道的品格或秩序；“公义”保留其道德与关系层面的丰富含义。
- source_word: וּבְמִשְׁפָּט
  choice: 公正
  rationale: משפט 在这一连串关系品格中主要指公平、公正，而非宣判行为；与“公义”并列也保留两个近义概念的张力。
- source_word: וּבְחֶסֶד
  choice: 忠贞的慈爱
  rationale: חֶסֶד 兼有慈爱、忠诚和坚定不移之意。“忠贞的慈爱”在婚约语境中自然表达关系忠诚，同时不把“盟约”这一解释性概念直接增入正文。
- source_word: וּבְרַחֲמִים
  choice: 怜悯
  rationale: רַחֲמִים 形态上为复数，但常作抽象名词；“怜悯”是现代中文自然对应，也保留其深切体恤之意。
theological_decisions:
- issue: 婚约比喻的表达
  choice: 保留“聘你归我”的订婚语言
  alternative: “娶你为妻”或“使你属我”
  rationale: 何西阿书的婚约比喻是本句核心。原文动词特指聘定；不将其泛化为一般婚姻，也不削弱为抽象归属关系。
- issue: חֶסֶד 的译法
  choice: 忠贞的慈爱
  alternative: 慈爱；忠诚之爱；盟约之爱
  rationale: 该词在此同时涉及深情、怜爱与持久忠诚。正文保留这些语义的重叠，不把它限定为某一套后来的神学术语；脚注提示可行的简译及词义范围。
- issue: 介词 בְּ 的功能
  choice: 统一译为“以”，表达伴随的品格与方式
  alternative: “凭”公义、公正等
  rationale: 原文可表达凭借、方式或伴随领域。“以”保留一定开放性，避免明确断定这些品格是婚约成立的功绩性依据。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“聘你归我”略带婚约文体色彩，但准确保留原文的聘定动作和归属关系；分号与重复句式对应希伯来文的平行结构。
