  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֣ן אָשׁ֔וּב וְ/לָקַחְתִּ֤י דְגָנִ/י֙ בְּ/עִתּ֔/וֹ וְ/תִירוֹשִׁ֖/י בְּ/מֽוֹעֲד֑/וֹ וְ/הִצַּלְתִּי֙ צַמְרִ֣/י וּ/פִשְׁתִּ֔/י לְ/כַסּ֖וֹת אֶת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/011.yaml
  text: Therefore I will return and take back my grain in its time[a], and my new wine in its season; and I will take away my wool and my flax[b], which were to cover her nakedness.
translation:
  language: zh_hans
  text: 因此，我必回转，在五谷成熟的时候收回我的五谷，在新酒的时节收回我的新酒；我还要夺走[a]我的羊毛和亚麻，这些原是用来遮盖她的裸露[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夺走”也可译作“猛然夺走”；原词可强调突然、强力地取走，在其他语境也可指“救出”或“解救”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“她的裸露”；这个词也可含有因身体暴露而蒙羞的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 明确承接上文的指控与审判，保留因果推进。
- source_word: אָשׁוּב וְלָקַחְתִּי
  choice: 我要……收回
  rationale: שוב与לקח连用在此表示行动的逆转；“收回”自然表达把先前赐下之物取回，也避免生硬直译为“我要返回并拿取”。
- source_word: דְגָנִי בְּעִתּוֹ
  choice: 在五谷成熟时收回我的五谷
  rationale: דגן泛指谷物出产；עתו指其适当的时节，按农作语境译作“五谷成熟时”清楚自然。
- source_word: וְתִירוֹשִׁי בְּמוֹעֲדוֹ
  choice: 在新酒当季时收回我的新酒
  rationale: תירוש指新酒或鲜酒；מועד表示规定或合宜的时节。“当季时”保留与前句的时间平行。
- source_word: וְהִצַּלְתִּי
  choice: 我还要夺回
  rationale: נצל的使役式在此不是“拯救”，而是从她那里夺走、取回；“夺回”兼顾动作力度与物品原属耶和华的语境。
- source_word: צַמְרִי וּפִשְׁתִּי
  choice: 我的羊毛和麻
  rationale: צמר是羊毛，פשתה是亚麻原料；译作“麻”而非成品“细麻布”，较贴近原文。
- source_word: לְכַסּוֹת אֶת עֶרְוָתָהּ
  choice: 这些原是用来遮盖她赤身的
  rationale: 保留不定式所表达的用途，并以自然的汉语分句明确其所指；“赤身”维持原文具体的裸露意象。
theological_decisions:
- issue: 是否明说耶和华正在取回先前赐下的物产
  choice: 用“收回／夺回”表达语境中的归属逆转
  alternative: 只译作“拿走／夺走”，把先前赐予的含义完全留给上下文
  rationale: 本节反复称“我的五谷、我的新酒、我的羊毛和麻”，而上文说她把这些归功于别神；“收回”忠实呈现这一逆转，但不额外引入特定教义体系。
- issue: 是否淡化עֶרְוָתָהּ的裸露与羞耻意象
  choice: 正文译作“她赤身的”
  alternative: 译作“她的羞耻”
  rationale: 原文直接描绘身体裸露，并隐含受辱；保留具体意象，避免把有意的先知性张力抽象化。
- issue: 如何理解לְכַסּוֹת所表达的关系
  choice: 说明羊毛和麻原是用来遮盖她赤身的
  alternative: 理解为夺走羊毛和麻，目的在于使她裸露
  rationale: 希伯来语不定式可表达用途或目的；所选译法紧贴其与羊毛、麻的自然关联，同时不否认夺走以后导致裸露的审判效果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“五谷／新酒”保留农业语境和诗句的平行结构；用“赤身”而不用较委婉的“羞耻”，保留先知话语中刻意强烈的暴露意象。所有脚注标记均置于其所解释的正文词语之后。
