source:
  edition: WLC
  text: לָ/כֵ֗ן הִנֵּ֤ה אָֽנֹכִי֙ מְפַתֶּ֔י/הָ וְ/הֹֽלַכְתִּ֖י/הָ הַ/מִּדְבָּ֑ר וְ/דִבַּרְתִּ֖י עַל לִבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/016.yaml
  text: Therefore[a], behold, I am going to allure her, and I will lead her into the wilderness and speak to her heart.
translation:
  language: zh_hans
  text: 因此，看哪，我要吸引她，领她进入旷野，向她的心说话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“温柔地对她说话”。原文直译为“向她的心说话”。
    reason: 说明希伯来语惯用表达的自然译法，同时保留正文中的原文隐喻。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 保留承接前文审判语境、又出人意料地转向复和的推论和转折力度。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知话语中唤起注意、强调即将发生之事的指示作用，同时符合庄重的现代汉语表达。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词带有强调意味；汉语结合“看哪”和“我要”即可自然体现，不必增译为“我亲自”。
- source_word: מְפַתֶּיהָ
  choice: 我要吸引她
  rationale: פתה在此处的婚姻复和比喻中兼有吸引、劝服之意。“吸引”避免“诱惑”的负面道德色彩，也不像“追求”那样过度限定为浪漫行动；“要”自然传达分词所表示的即将行动。
- source_word: וְהֹלַכְתִּיהָ
  choice: 领她进入
  rationale: 该使役形式表示使她前往。“领她进入”既体现主动引领，也比单纯“带到”更贴近旷野旅程的意象。
- source_word: הַמִּדְבָּר
  choice: 旷野
  rationale: “旷野”是现代中文圣经语境中自然且准确的对应，既可指荒凉之地，也保留以色列早期与上帝相遇的背景联想。
- source_word: וְדִבַּרְתִּי עַל לִבָּהּ
  choice: 向她的心说话
  rationale: 保留希伯来语“对着／向着她的心说话”的身体隐喻及其亲密、劝慰含义，不在正文中将其单一化为“温柔地说”或“安慰”。
theological_decisions:
- issue: 婚姻复和比喻中פתה所表达的关系性质
  choice: 吸引她
  alternative: 劝服她／诱惑她／追求她
  rationale: 上下文描述的是审判之后由上帝主动发起的关系恢复。“吸引”保留感情和劝服两个维度，不暗示邪恶诱惑，也不把意象过度浪漫化，从而维持审判与恩慈复和之间的张力。
- issue: עַל לִבָּהּ的亲密和安慰意味
  choice: 正文保留“向她的心说话”，脚注说明惯用含义
  alternative: 温柔地对她说话／说安慰她的话
  rationale: 直译保留“心”的隐喻及原文开放性；脚注提供自然的惯用理解，但不把其意义限制为语气温柔或单纯安慰。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留先知文体；全句以连续动词呈现上帝主动吸引、引领并亲密说话的行动。脚注标记置于其实际所说明的短语之后。
