source:
  edition: WLC
  text: כִּ֤י זָֽנְתָה֙ אִמָּ֔/ם הֹבִ֖ישָׁה הֽוֹרָתָ֑/ם כִּ֣י אָמְרָ֗ה אֵלְכָ֞ה אַחֲרֵ֤י מְאַהֲבַ/י֙ נֹתְנֵ֤י לַחְמִ/י֙ וּ/מֵימַ֔/י צַמְרִ֣/י וּ/פִשְׁתִּ֔/י שַׁמְנִ֖/י וְ/שִׁקּוּיָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/007.yaml
  text: For their mother has prostituted herself[a]; she who conceived them has acted shamefully. For she said, ‘I will go after my lovers, those who give me my bread and my water, my wool and my flax[d][c][b], my oil and my drink.’
translation:
  language: zh_hans
  text: 因为他们的母亲行淫了[a]；怀了他们的母亲[c]做了可耻的事[b]。她说：“我要追随我的情人，就是那些给我饼和水、羊毛和麻、油和饮品[d]的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作了娼妓”；希伯来文以明确的性意象描写对圣约的不忠。
    reason: lexical_alternative
  - marker: b
    text: 或译“使他们蒙羞”。这里的希伯来语形式既可描述她做了可耻的事，也可表示她使别人蒙羞。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译“怀了他们的（母亲）”，与“他们的母亲”构成诗歌平行。
    reason: source_form
  - marker: d
    text: 或译“各样饮品”或“饮品供应”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנְתָה
  choice: 卖淫了
  rationale: 该动词本指不正当的性行为；在何西阿书的先知性比喻中，也表达对圣约的不忠。“卖淫”保留了原文刻意使用的露骨婚姻与性意象，没有淡化为笼统的“不忠”。
- source_word: אִמָּם
  choice: 他们的母亲
  rationale: 忠实呈现带第三人称阳性复数词尾的构词形式，并保留本节家庭比喻中的指称。
- source_word: הֹבִישָׁה
  choice: 行了可耻的事
  rationale: 使役词干在这里可表示“做出可耻之事”，也可能表示“使人蒙羞”。上下文的一连串阴性单数动词都以母亲为主语，因此正文采用描述她行为的理解，同时以脚注保留歧义。
- source_word: הוֹרָתָם
  choice: 怀他们的那人
  rationale: 保留源自“怀孕、受孕”之动词的分词意味，也维持它与“他们的母亲”之间的诗歌平行，不直接重复译作“母亲”。
- source_word: אֵלְכָה אַחֲרֵי
  choice: 我要追随
  rationale: 自然表达主动跟随、投奔情人的行动，并保留原文的方向性意象。
- source_word: מְאַהֲבַי
  choice: 我的情人
  rationale: 在婚姻不忠的比喻中，此词指婚外的爱侣；“情人”比“我所爱的人”更清楚地保留这一含义。
- source_word: נֹתְנֵי
  choice: 就是那些给我……的人
  rationale: 将作名词用的分词明确译出，使现代汉语句法自然，同时不改变其修饰“情人”的功能。
- source_word: לַחְמִי וּמֵימַי
  choice: 给我饼和水
  rationale: 保留生活必需品的具体意象；汉语的“给我”已自然表达希伯来文所有格所体现的供给关系。
- source_word: צַמְרִי וּפִשְׁתִּי
  choice: 羊毛和麻
  rationale: פִשְׁתִּים 指制作布料的亚麻原料；译作“麻”与“羊毛”并列自然，也避免提前解释成成品“细麻布”。
- source_word: שַׁמְנִי
  choice: 油
  rationale: 原文仅说“油”，不额外限定为橄榄油。
- source_word: שִׁקּוּיָי
  choice: 饮料
  rationale: 该名词可指饮品或饮料供应；“饮料”在此物资清单中自然，并以脚注保留集合或复数理解。
theological_decisions:
- issue: 先知婚姻比喻与圣约不忠
  choice: 正文明确保留“卖淫”和“情人”的性与婚姻意象。
  alternative: 弱化为“她不忠”及“她所爱的人”。
  rationale: 何西阿刻意借婚姻和性方面的不忠描绘以色列背弃圣约。直译其核心意象能保存原文的神学力度，同时不在正文中直接加入“拜偶像”等解释。
- issue: הֹבִישָׁה 的主语行为或致使结果
  choice: 理解为母亲“行了可耻的事”。
  alternative: 理解为她“使他们蒙羞”。
  rationale: 前后阴性单数形式均聚焦母亲的行为，前一种理解较符合平行结构；但使役意义所容许的另一读法仍在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“卖淫”虽直接，却是保存先知比喻力度所必需；其余措辞避免古奥。“怀他们的那人”略带诗性，用来保留希伯来文与“他们的母亲”的平行关系。
