language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/הֲשִׁמֹּתִ֗י גַּפְנָ/הּ֙ וּ/תְאֵ֣נָתָ֔/הּ אֲשֶׁ֣ר אָמְרָ֗ה אֶתְנָ֥ה הֵ֨מָּה֙ לִ֔/י אֲשֶׁ֥ר נָֽתְנוּ לִ֖/י מְאַֽהֲבָ֑/י וְ/שַׂמְתִּ֣י/ם לְ/יַ֔עַר וַ/אֲכָלָ֖תַ/ם חַיַּ֥ת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/014.yaml
  text: And I will lay waste her vine and her fig tree[a], of which she said, ‘These are my wages that my lovers gave me.’ I will make them a forest, and the wild animals of the field will devour them.
translation:
  language: zh_hans
  text: 我要使她的葡萄树和无花果树荒废；她曾说：‘这些是我的情人给我的报酬[a]。’我要使它们变成丛林，田野的野兽必吞吃它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“酬金”；这里的希伯来词可特指卖淫所得的酬金，与本段婚姻不忠的隐喻相呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: 我要使……荒废
  rationale: 使役形表达造成荒凉、毁坏；“使……荒废”既保留审判力度，也贴合农作物被弃置毁坏的语境。
- source_word: גַּפְנָהּ וּתְאֵנָתָהּ
  choice: 她的葡萄树和无花果树
  rationale: 保留两个单数农业意象，不扩译为“葡萄园”或泛称果实。
- source_word: אֶתְנָה
  choice: 报酬
  rationale: 保留交易所得之意，同时不在正文中直接增添“卖淫”这一解释性成分；该词在本段不忠隐喻中的特殊色彩由脚注说明。
- source_word: מְאַהֲבָי
  choice: 我的情人
  rationale: 直接呈现婚姻不忠隐喻中的非法爱侣含义，又不在译文中限定他们具体指假神还是政治盟友。
- source_word: וְשַׂמְתִּים לְיַעַר
  choice: 我要使它们变成丛林
  rationale: 表达原本受栽培之地沦为野生林地的图景；“丛林”在现代汉语中自然，并保留其荒芜失管之感。
- source_word: וַאֲכָלָתַם
  choice: 必吞吃它们
  rationale: 动物作主语时，“吞吃”比一般的“吃”更能体现彻底破坏的力度。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野的野兽
  rationale: 保留常见的圣经意象及“野生动物”之义，语言简洁庄重。
theological_decisions:
- issue: 是否在正文中明说 אֶתְנָה 是卖淫所得
  choice: 正文译作“报酬”，以脚注交代其可能含有卖淫酬金的意味。
  alternative: 正文译作“卖淫的酬金”或“嫖资”。
  rationale: 希伯来词在何西阿的不忠隐喻中确有性交易色彩，但本句没有另加“卖淫”一词。正文采用较宽的对应词，可保留原文的含蓄和隐喻张力；脚注则避免这一重要语义被忽略。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式尽量贴近希伯来文的推进：先宣告使农作物荒废，再引述她的说法，最后描写土地变为丛林并被野兽吞吃。
