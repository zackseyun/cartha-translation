  text: וְ/עַתָּ֛ה אֲגַלֶּ֥ה אֶת נַבְלֻתָ֖/הּ לְ/עֵינֵ֣י מְאַהֲבֶ֑י/הָ וְ/אִ֖ישׁ לֹֽא יַצִּילֶ֥/נָּה מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/012.yaml
  text: And now I will uncover her nakedness before the eyes of her lovers, and no man will rescue her from my hand.
translation:
  language: zh_hans
  text: 现在，我要在她情人的眼前揭露她的赤身；谁也不能把她从我手中救出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并引出即将施行的审判；现代汉语无需机械保留句首“而”。
- source_word: אֲגַלֶּה אֶת נַבְלֻתָהּ
  choice: 我要……揭露她的下体
  rationale: נַבְלֻתָהּ在此指可耻地暴露的私处或下体，不只是抽象的“羞耻”；此译保留原文具体、严厉且带羞辱性的意象。
- source_word: לְעֵינֵי מְאַהֲבֶיהָ
  choice: 在她情人眼前
  rationale: 直译其公开可见之意；מְאַהֲבִים在何西阿婚姻隐喻中为“情人”，并可能影射以色列所追随的诸巴力或盟友，不在正文中消解其多重指向。
- source_word: וְאִישׁ לֹא
  choice: 谁也不能
  rationale: אִישׁ在否定结构中惯用于表达“无人”；现代汉语“谁也不能”自然地保留全称否定，无须限定为男性。
- source_word: יַצִּילֶנָּה מִיָּדִי
  choice: 把她从我手中救出来
  rationale: 保留“从我手中”这一权柄与控制的惯用表达，并准确表达使她脱离审判的动作。
theological_decisions:
- issue: “情人”的隐喻对象
  choice: 正文保留“情人”
  alternative: 明确译作“她所拜的诸神”或“她的外国盟友”
  rationale: 原文延续妻子与情人的婚姻隐喻，可能同时具有宗教和政治含义；明确化会不当地排除原文的张力。
- issue: 无人能从神手中搭救
  choice: 译作“谁也不能把她从我手中救出来”
  alternative: 译作“没有男人能救她”
  rationale: 此处重点是无人有能力阻止说话者施行审判，而非强调搭救者的性别；采用现代汉语全称否定，同时不削弱神审判权柄的含义。
translation_notes:
  register: 采用现代、庄重而直接的叙述语体。保留原文令人不适的公开羞辱意象，不以委婉的“羞耻”淡化；句式简洁，适合普通读者理解。
