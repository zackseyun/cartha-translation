id: HOS.2.15
reference: Hosea 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/פָקַדְתִּ֣י עָלֶ֗י/הָ אֶת יְמֵ֤י הַ/בְּעָלִים֙ אֲשֶׁ֣ר תַּקְטִ֣יר לָ/הֶ֔ם וַ/תַּ֤עַד נִזְמָ/הּ֙ וְ/חֶלְיָתָ֔/הּ וַ/תֵּ֖לֶךְ אַחֲרֵ֣י מְאַהֲבֶ֑י/הָ וְ/אֹתִ֥/י שָׁכְחָ֖ה נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/015.yaml
  text: And I will punish her for the days of the Baals[a], when she burned incense to them and adorned herself with her ring and her jewelry, and went after her lovers, but forgot me, declares Yahweh.
translation:
  language: zh_hans
  text: 我要惩罚她，因她曾在敬奉众巴力的日子向它们烧香；她用环饰[a]和首饰装扮自己，追随她的情人，却忘了我。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “环饰”也可译作“鼻环”或“耳环”。希伯来词 נֶזֶם 指环形饰物，常可特指鼻环，也可指耳环。
    reason: 保留原词所指具体饰物的不确定性。
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלֶיהָ
  choice: 我必追讨她
  rationale: פָקַד与עַל连用，在审判语境中表示追究责任、施行惩罚。“追讨”既保留司法性的力度，也较贴近先知文体。
- source_word: יְמֵי הַבְּעָלִים
  choice: 她敬拜众巴力的那些日子
  rationale: 复数הַבְּעָלִים指不同地方或形态的巴力；“那些日子”保留原文时间表达，补出“敬拜”以自然呈现这些日子归于巴力崇拜的语境。
- source_word: אֲשֶׁר תַּקְטִיר לָהֶם
  choice: 那时，她向它们烧香
  rationale: Hiphil形式הקטיר常指使祭物冒烟，语境中可自然译为“烧香”；“它们”对应复数的众巴力。
- source_word: וַתַּעַד
  choice: 妆扮自己
  rationale: עדה在此表示以饰物装扮自己；“妆扮自己”清楚保留反身含义。
- source_word: נִזְמָהּ
  choice: 她的鼻环
  rationale: נֶזֶם指环饰，常具体指鼻环，也可指耳环；结合何西阿书2:13的女性装饰场景，正文采用较常见的“鼻环”，脚注保留词义的不确定性。
- source_word: וְחֶלְיָתָהּ
  choice: 她的首饰
  rationale: חֶלְיָה表示装饰品、珠宝；“首饰”是自然且不把它限定为某一种饰物的中文表达。
- source_word: מְאַהֲבֶיהָ
  choice: 她的情人
  rationale: 保留婚姻隐喻中的不贞关系，不在正文中直接解释为偶像或政治盟友。
- source_word: וְאֹתִי שָׁכְחָה
  choice: 却忘了我
  rationale: וְ本可直译为“并且”，但此处与追随情人形成明显对照；“却”自然表达其转折力度。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是先知性的神谕公式；采用“宣告”体现其庄重和权威。יהוה按其专名译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并清楚保留其专名性质。
- issue: “情人”的隐喻所指
  choice: 保留“她的情人”
  alternative: 解释为她所追随的诸神或政治盟友
  rationale: 何西阿的婚姻隐喻刻意使偶像崇拜与不贞彼此映照；正文不将可能包含的宗教及政治所指缩减为单一解释。
- issue: “众巴力”的含义
  choice: 众巴力
  alternative: 巴力神像；巴力的各种地方形态
  rationale: 原文使用复数，可能涉及不同地方性表现、称号或偶像；直译复数能保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“追讨”“宣告”保留先知审判话语的力度；句中使用分号和转折，使敬拜众巴力、装扮追随情人、忘记雅威之间的结构清晰。
