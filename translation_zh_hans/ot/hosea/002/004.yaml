base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/004.yaml
  text: Contend with your mother[a], contend, for she is not my wife, and I am not her husband[b]; let her remove her prostitutions from her face and her adulteries from between her breasts.
translation:
  language: zh_hans
  text: 你们要与母亲争辩[a]，要争辩！因为她不是我的妻子，我也不是她的丈夫。让她除去脸上的淫行[b]，除去两乳之间的奸淫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“控告你们的母亲”或“与你们的母亲争讼”。希伯来语动词ריב可带有法律争讼的意味。
    reason: lexical_alternative
  - marker: b
    text: “淫行”所译的希伯来语词在《何西阿书》中既可指实际的淫乱或卖淫行为，也可比喻借偶像崇拜而背弃圣约。
    reason: cultural_note
lexical_decisions:
- source_word: רִיבוּ בְאִמְּכֶם
  choice: 要与母亲争辩
  rationale: ריב的复数命令式在这里兼有争辩、指控和诉讼式申诉的意味；“与……争辩”保留其宽泛语义和重复所产生的急迫感，脚注补充法律性较强的译法。
- source_word: כִּי הִיא לֹא אִשְׁתִּי וְאָנֹכִי לֹא אִישָׁהּ
  choice: 因为她不是我的妻子，我也不是她的丈夫
  rationale: אשה和איש在所属关系中是通常的婚姻称谓；直译为“妻子”“丈夫”，保留婚姻关系破裂的先知性比喻。
- source_word: וְתָסֵר
  choice: 让她除去
  rationale: 该形式在此带有劝令意味；“让她除去”既表达要求，也不把语气强化成直接命令。
- source_word: זְנוּנֶיהָ מִפָּנֶיהָ
  choice: 脸上的淫行
  rationale: “淫行”保留זנונים所指的性不忠及其在何西阿书中可能具有的偶像崇拜隐喻；“脸上”保留原文具体、公开可见的身体意象。
- source_word: וְנַאֲפוּפֶיהָ מִבֵּין שָׁדֶיהָ
  choice: 两乳之间的奸淫
  rationale: “奸淫”表达נאף词族的婚姻不忠含义；“两乳之间”直接保留原文鲜明的身体意象，不将其解释性改写为装饰物或诱惑的标记。
theological_decisions:
- issue: 以婚姻比喻圣约关系的破裂
  choice: 正文保留妻子与丈夫的婚姻语言，不直接改写为以色列背弃上帝。
  alternative: 将本节释义为百姓在圣约中对上帝不忠。
  rationale: 希伯来文本借婚姻关系说话；保留比喻本身可避免把解释写入正文，并维持先知话语中的张力。
- issue: 性不忠与属灵不忠的双重指向
  choice: 采用“淫行”和“奸淫”等强烈而具体的词语，并以脚注指出“淫行”在本书中的隐喻用法。
  alternative: 弱化为“不忠”或“不道德的行为”。
  rationale: 何西阿刻意使用带有性意味的措辞来揭露背约；泛化处理会削弱原文力度，但正文也不应断言每个词在此仅有单一的属灵含义。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。“要争辩”的重复保留希伯来文的强调和急迫感；“脸上”“两乳之间”保留原文刻意使用的具体身体意象，不作委婉化处理。
