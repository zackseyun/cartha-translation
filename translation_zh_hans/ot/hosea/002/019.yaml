source:
  edition: WLC
  text: וַ/הֲסִרֹתִ֛י אֶת שְׁמ֥וֹת הַ/בְּעָלִ֖ים מִ/פִּ֑י/הָ וְ/לֹֽא יִזָּכְר֥וּ ע֖וֹד בִּ/שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/019.yaml
  text: And I will remove the names of the Baals from her mouth[a], and they will no longer be remembered by name.
translation:
  language: zh_hans
  text: “我必从她口中除去巴力诸神的名；人必不再提起它们的名[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们必不再被人记念。”希伯来语动词可表示“被记念”，也可表示“被提起”；在本节语境中，两种理解都表明对巴力诸神的称名或呼求将终止。
    reason: 词义存在真实的语境歧义；脚注保留“记念”这一可行译法，并说明其与“提起”的语境关联。
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: 我必……除去
  rationale: סור 的使役式在此表示使某物离开，即“除去”；“必”自然表达先知话语中的将来行动。
- source_word: שְׁמוֹת הַבְּעָלִים
  choice: 众巴力的名号
  rationale: הַבְּעָלִים 指迦南宗教中的诸巴力，而非一般意义的“主人”；“名号”既保留“名字”的含义，也适合受敬拜、被呼求的神祇称号。
- source_word: מִפִּיהָ
  choice: 从她口中
  rationale: 直译其身体意象，指拟人化的以色列不再说出或呼求巴力的名号。
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  choice: 它们也必不再被人……记念
  rationale: זכר 的被动式可表示“被记念”，也可表示“被提起”；正文保留较直接的“记念”，并以脚注说明另一可能。
- source_word: בִּשְׁמָם
  choice: 按名
  rationale: 以自然的现代汉语表达希伯来语“以它们的名／按名”的习语，同时保留逐一指名称说的意味。
theological_decisions:
- issue: “众巴力”的所指
  choice: 指与以色列背约和偶像崇拜有关的巴力神祇
  alternative: 将 בְּעָלִים 泛译为“众主人”或“众主”
  rationale: 何西阿书的反偶像语境表明，此处所指是受人称名、呼求的巴力神祇；音译“巴力”可避免把经文误解为一般的人间主人。
- issue: זכר 所含的记忆与言说双重意味
  choice: 正文译为“被人按名记念”，脚注保留“被提起”
  alternative: 正文直接译为“它们的名也不再被人提起”
  rationale: 该动词在此既可指记得，也可指说起或呼求；不在正文中排除其中一义，可保留巴力崇拜从记忆与言说中消失的语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“她”延续上下文将以色列拟人化为女子的比喻；“众巴力”清楚指向多种地方性巴力崇拜。“按名记念”略带经文语体，但仍易于普通读者理解，并保留原文 בִּשְׁמָם 的表达。
