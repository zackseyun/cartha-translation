base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/022.yaml
  text: And I will betroth you to myself in faithfulness[a], and you shall know Yahweh.
translation:
  language: zh_hans
  text: 我要以信实[a]聘你归我；你就必认识雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以忠贞”；较形式地也可译“以信”。希伯来语此词含有可靠、忠贞和守约的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרַשְׂתִּיךְ
  choice: 我要……把你许配
  rationale: 动词 אָרַשׂ 专指订立婚约、许配；此译保留婚约意象，不泛化为一般的“娶”或“结婚”.
- source_word: לִי
  choice: 给自己
  rationale: 直译为“给我”；结合汉语反身表达译作“给自己”，清楚表明说话者亲自与对方订立婚约。
- source_word: בֶּאֱמוּנָה
  choice: 凭信实
  rationale: אֱמוּנָה 在此婚约和圣约语境中侧重可靠、忠贞、守信；“信实”比容易被理解为主观相信的“信心”更贴切。“凭”保留介词 בְּ 所表达的方式或基础。
- source_word: וְיָדַעַתְּ
  choice: 你就必认识
  rationale: 保留 ידע 的基本义“认识”，同时让上下文承载其关系性和圣约性的深意，不擅自扩译为“亲密认识”或“承认”。“必”体现完成式在这一应许语境中的确定将来意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语近似音译呈现四字神名，而不以“主”这一称号代替。
theological_decisions:
- issue: “认识”在婚约—圣约语境中的关系性含义
  choice: 正文保留“认识”，不加“亲密地”或“承认”
  alternative: “亲密地认识雅威”或“承认雅威”
  rationale: 原文既可表达认知，也在何西阿书语境中具有关系和圣约层面的深度；保留简洁的“认识”可维持原文丰富而未被限定的含义。
- issue: אֱמוּנָה 所指的信实由谁体现
  choice: 译作“凭信实”，不在正文补出主体
  alternative: “凭我的信实”或“使你忠贞”
  rationale: 希伯来文没有明说“信实”专属于哪一方；语境可能突出雅威的信实，也不宜排除婚约关系本身的忠贞性质，因此不补入所有格。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“把你许配给自己”保留原文独特的婚约表达；分号呈现应许的两部分。正文中的脚注标记与脚注一致。
