- from: 我要凭信实[a]把你许配给自己；你就必认识雅威。
  to: 我要以信实[a]聘你归我；你就必认识雅威。
  rationale: 将“把你许配给自己”改为“聘你归我”，以自然的汉语表达原文婚约动词的第一人称关系与专门含义；将介词译为“以”，保留方式／基础的开放性。调整脚注，避免“信心”造成不必要的主观化理解，同时保留原词可作较形式译法的可能性。其余内容维持原译的准确性、庄重语体及神名处理。
