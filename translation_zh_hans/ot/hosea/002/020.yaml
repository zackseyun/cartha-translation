id: HOS.2.20
reference: Hosea 2:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כָרַתִּ֨י לָ/הֶ֤ם בְּרִית֙ בַּ/יּ֣וֹם הַ/ה֔וּא עִם חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/עִם ע֣וֹף הַ/שָּׁמַ֔יִם וְ/רֶ֖מֶשׂ הָֽ/אֲדָמָ֑ה וְ/קֶ֨שֶׁת וְ/חֶ֤רֶב וּ/מִלְחָמָה֙ אֶשְׁבּ֣וֹר מִן הָ/אָ֔רֶץ וְ/הִשְׁכַּבְתִּ֖י/ם לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/020.yaml
  text: And on that day I will make for them a covenant with the wild animals of the field[a], with the birds of the heavens, and with the creeping things of the ground; and I will break bow and sword and war from the land[c][b], and I will make them lie down in safety.
translation:
  language: zh_hans
  text: 在那日，我必为他们与田野的野兽、天空的飞鸟和地上爬行的动物立约[a]；我必从这地消除弓、刀剑和战争[b][c]，使他们安然躺卧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立约”原文直译为“切约”，是希伯来语表示缔结盟约的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “消除”原文为“折断”；原文以这个动词同时支配“弓、刀剑和战争”。
    reason: source_idiom
  - marker: c
    text: “这地”也可译作“大地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָרַתִּי ... בְּרִית
  choice: 立约
  rationale: 希伯来语直译为“切约”，是缔结盟约的固定习语；现代汉语用“立约”自然、庄重，也保留“约”的核心含义。
- source_word: לָהֶם ... עִם
  choice: 为他们与……立约
  rationale: לָהֶם表示“为他们”，后面反复出现的עִם才表示“与”；译文保留受益者与约中所列动物之间的句法区别。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野的野兽
  rationale: 指野外未驯养的陆生动物；“野兽”简明，并与后面的飞鸟和爬行动物构成自然并列。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 天空的飞鸟
  rationale: עוֹף泛指飞禽，הַשָּׁמַיִם在此自然指天空；“天空的飞鸟”既贴近原文，又符合现代汉语。
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: 地上爬行的动物
  rationale: רֶמֶשׂ指爬行或贴地活动的生物，אֲדָמָה指土地、地面；此译清楚易懂。
- source_word: וְקֶשֶׁת וְחֶרֶב וּמִלְחָמָה ... אֶשְׁבּוֹר
  choice: 消除弓、刀剑和战争
  rationale: 原文以“折断”同时支配弓、刀剑和战争。汉语不能自然地说“折断战争”，因此用“消除”统摄三项，同时在脚注保留原文的“折断”意象。
- source_word: מִן הָאָרֶץ
  choice: 从这地
  rationale: אֶרֶץ可指土地、国土或全地；上下文首先关乎百姓在其地得享平安，因此正文采用“这地”，并以脚注保留“全地”的可能。
- source_word: וְהִשְׁכַּבְתִּים לָבֶטַח
  choice: 使他们安然躺卧
  rationale: 使役形态表达上帝使他们躺卧；לָבֶטַח表示安全无惧。“安然躺卧”保留牧养与安息的画面。
theological_decisions:
- issue: 立约的受益者与约中对象之间的关系
  choice: 译作“为他们与……立约”
  alternative: 译作“与他们和动物立约”
  rationale: 希伯来文用לָהֶם标明“为他们”，却用עִם引出各类动物。保留这一区别，表明百姓是这项安排的受益者，同时不把他们和动物合并为同一种约的对象。
- issue: אֶרֶץ的范围
  choice: 正文译作“这地”
  alternative: 译作“全地”或“大地”
  rationale: 何西阿书此处首先描绘百姓在其土地上恢复和平与安全；不过该词也可有更广范围，故不在正文中把宇宙性含义完全排除，并用脚注说明。
- issue: “折断”与战争终止的意象
  choice: 正文用“消除”，脚注注明原文直译
  alternative: 直译为“折断弓、刀剑和战争”
  rationale: 原文将具体武器与战争本身并列，形成从武器到战争的递进。正文以自然汉语表达结果，脚注则保存其突出的破除意象，避免把它缩减为仅仅解除武装。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为他们与……立约”略带书面色彩，是为了准确保留לָהֶם与עִם的区别；“安然躺卧”保留原文具象的平安图景。
