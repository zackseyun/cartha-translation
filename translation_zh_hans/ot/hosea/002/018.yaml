base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/018.yaml
  text: And in that day[a], declares Yahweh, you will call me ‘My husband,’ and you will no longer call me ‘My Baal.’
translation:
  language: zh_hans
  text: 到那日，雅威宣告：你必称呼我为“我的丈夫”，不再称呼我为“我的巴力”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 baʿli 既可意为“我的主人”“我的主”，也可意为“我的丈夫”；这里译作“我的巴力”，以保留双关及其对巴力崇拜可能的暗指。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书中常见的未来时间公式。现代汉语用“到那日”即可自然表达事件将在那一特定时刻发生，无须生硬译出系词。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: “宣告”保留先知神谕公式的庄重语气；“雅威”音译上帝的专名יהוה，而不以头衔代替。
- source_word: תִּקְרְאִי
  choice: 你要称我为
  rationale: קרא在此指以某一称谓称呼对方；两处采用同一表达，以保留鲜明对比。阴性单数形式依上下文指向被拟人化为妻子的以色列，汉语第二人称本身不标明语法性别。
- source_word: אִישִׁי
  choice: 我的丈夫
  rationale: איש虽可泛指“男人”，带第一人称单数后缀并处于婚姻隐喻中，明确表示“我的丈夫”。
- source_word: וְלֹא תִקְרְאִי לִי עוֹד
  choice: 不再称我为
  rationale: “不再”自然准确地表达否定词与עוד结合所表示的终止与改变。
- source_word: בַּעְלִי
  choice: 我的巴力
  rationale: בעל可表示“主人”“主”或“丈夫”，也与迦南神祇巴力之名相同。正文保留“巴力”，使婚姻称谓与偶像崇拜之间的双关和张力在汉语中仍然可见；词义范围以脚注说明。
theological_decisions:
- issue: בַּעְלִי应按普通称谓翻译，还是保留对巴力崇拜的暗指
  choice: 我的巴力
  alternative: 我的主人／我的主／我的丈夫
  rationale: 上下文把恢复后的婚约亲密称谓אִישִׁי与受巴力崇拜污染的称谓בַּעְלִי相对照。译作“我的巴力”保留反偶像崇拜的锋芒，同时借脚注呈现该词本有的多重词义，不把原文的双关单一化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式简洁，保留先知宣告的郑重感；引号突出两个相互对照的称谓。
