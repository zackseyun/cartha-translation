  text: וְ/הִשְׁבַּתִּי֙ כָּל מְשׂוֹשָׂ֔/הּ חַגָּ֖/הּ חָדְשָׁ֣/הּ וְ/שַׁבַּתָּ֑/הּ וְ/כֹ֖ל מוֹעֲדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/013.yaml
  text: And I will put an end to all her rejoicing—her feasts[a], her new moons, her Sabbaths[b], and all her appointed times.
translation:
  language: zh_hans
  text: 我要使她所有的欢乐都止息——她的节期、朔日、安息日，以及她一切定期的节会[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定期的节会”也可译作“指定的日期”；原词既可指指定的时间，也可指在该时间举行的宗教节会。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: 我要使……止息
  rationale: שׁבת 的使役式表达“使停止、使止息”；此译保留上帝主动终止这些庆典的使役含义，同时符合庄重的现代汉语。
- source_word: כָּל מְשׂוֹשָׂהּ
  choice: 她所有的欢乐
  rationale: מָשׂוֹשׂ 指欢乐、欢喜或欢庆。译作“欢乐”既涵盖内在喜悦，也能统领下文列举的节庆活动；“所有”保留 כָּל 的全面范围。
- source_word: חַגָּהּ
  choice: 她的节期
  rationale: חַג 指节庆，常特指宗教节期；“节期”自然地保留其礼仪历法含义，也适合希伯来语单数形式在此所具有的集合用法。
- source_word: חָדְשָׁהּ
  choice: 她的朔日
  rationale: חֹדֶשׁ 在此宗教历法语境中指新月之日及其礼仪，而非泛指月份。“朔日”是准确、简洁且为现代读者可理解的表达。
- source_word: וְשַׁבַּתָּהּ
  choice: 安息日
  rationale: שַׁבָּת 指安息日；汉语名词无需借复数形式表达此处集合性的历法观念。
- source_word: וְכֹל מוֹעֲדָהּ
  choice: 以及她一切指定的日期
  rationale: מוֹעֵד 可指指定的时间，也可指在指定时间举行的节会。正文采用较贴近其基本意义的“指定的日期”，避免与前面的“节期”完全重复，并用脚注保留宗教节会的可能含义。
theological_decisions:
- issue: 所列欢乐活动的性质
  choice: 把这些项目理解为以色列宗教历法中的庆典和礼仪日期，同时以“所有的欢乐”保留更广的审判范围。
  alternative: 将整句宽泛地理解为一切社交娱乐和喜庆场合。
  rationale: “节期、朔日、安息日、指定的日期”构成明显的宗教历法用语；但上位词 מְשׂוֹשָׂהּ 本身意为“欢乐”，因此不把经文缩窄为仅仅取消正式礼仪。
- issue: מוֹעֵד 的语义张力
  choice: 正文译作“指定的日期”，脚注说明也可指“定期的节会”。
  alternative: 直接译作“一切定期的节会”。
  rationale: 该词兼具指定时间与指定聚会的意义。上下文偏向宗教节会，但其时间性不应被悄然消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“使……止息”保留希伯来语使役结构；破折号清楚表明后面的历法项目具体说明“她所有的欢乐”。“朔日”虽略具礼仪色彩，但比“新月”更准确地指新月之日的宗教守节。
