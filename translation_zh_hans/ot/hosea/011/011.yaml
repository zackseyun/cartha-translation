  text: יֶחֶרְד֤וּ כְ/צִפּוֹר֙ מִ/מִּצְרַ֔יִם וּ/כְ/יוֹנָ֖ה מֵ/אֶ֣רֶץ אַשּׁ֑וּר וְ/הוֹשַׁבְתִּ֥י/ם עַל בָּתֵּי/הֶ֖ם נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/011.yaml
  text: They will come trembling like a bird from Egypt[a], and like a dove from the land of Assyria; and I will settle them in their homes, declares Yahweh.
translation:
  language: zh_hans
  text: 他们必战战兢兢地前来[a]，像从埃及来的鸟，又像从亚述之地来的鸽子；我要使他们安居在自己的家中。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们必战战兢兢，像从埃及来的鸟……又像从亚述之地来的鸽子。”希伯来语动词本身着重表示“战栗”；但在本处语境中，也可能包含战兢着前来的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֶרְדוּ
  choice: 必战战兢兢地归来
  rationale: 该动词本义是“战栗、惊惧”，结合上节从埃及和亚述而来的语境，也包含趋近、归来的动作。“战战兢兢地归来”兼顾明说的恐惧与语境隐含的移动。
- source_word: כְצִפּוֹר
  choice: 如同……飞来的鸟
  rationale: צִפּוֹר泛指鸟或小鸟，不限定为麻雀；中文用“鸟”避免过度具体化。“飞来”顺应比喻中的移动语境。
- source_word: מִמִּצְרַיִם
  choice: 从埃及
  rationale: 准确表达地理来源。
- source_word: וּכְיוֹנָה
  choice: 又如同……飞来的鸽子
  rationale: יוֹנָה通常指鸽子；“又”自然连接两个平行比喻。
- source_word: מֵאֶרֶץ אַשּׁוּר
  choice: 从亚述之地
  rationale: 保留原文“亚述之地”的完整结构和庄重语感。
- source_word: וְהוֹשַׁבְתִּים
  choice: 我要使他们安居
  rationale: 使役形式表示“使之居住、安置”；“使他们安居”既保留使役意义，也贴合复归后稳定居住的语境，而不擅自加入原文未明说的“带回”。
- source_word: עַל בָּתֵּיהֶם
  choice: 在自己的家中
  rationale: 介词עַל在与居住相关的表达中可按习惯译为“在”；“家中”比字面的“房屋之上”自然，并传达恢复家园生活之意。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄重的先知宣告公式；按专名处理四字神名，以“雅威”表达יְהוָה。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式呈现盟约之名，同时避免用称号取代原文专名。
- issue: 末句的复归含义
  choice: 我要使他们安居在自己的家中
  alternative: 我要使他们住在自己的房屋里；我要让他们回到自己的家中
  rationale: 使役动词明确表达安置居住；上下文虽有归回主题，但动词本身并非“带回”，因此不把“回到”直接加入末句。
- issue: יֶחֶרְדוּ是否明说归来动作
  choice: 战战兢兢地归来
  alternative: 战战兢兢；颤抖着来
  rationale: 该词明确表达战栗，来向动作主要由上下文及两个来源短语显出。正文采用符合中文的语境性表达，同时以脚注保留较严格的词汇译法，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“战战兢兢”保留先知文本的肃穆感；“安居在自己的家中”自然表达恢复定居。正文中的脚注标记[a]紧随相关鸟喻，以对应词义歧义。
