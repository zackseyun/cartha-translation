base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/004.yaml
  text: I drew them with cords of a man[a], with ropes of love; and I was to them like those who lift a yoke from their jaws[b], and I bent down to him and fed him.
translation:
  language: zh_hans
  text: 我用人的绳索[a]，用慈爱的绳带牵引他们；我待他们，如同那些把轭从他们腮颊上提起的人。我俯下身到他那里，喂养他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用合乎人情的绳索”。希伯来语这个说法可能强调以温和、人道的方式牵引，而不是指绳索属于某个人。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语这里是单数“到他那里……喂养他”；因上文使用复数，不少译本将其顺译为“到他们那里……喂养他们”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַבְלֵי אָדָם
  choice: 用人的绳索
  rationale: 保留“绳索”这一具体意象以及אָדָם的形式表达，不在正文中直接解释为“温柔”或“人道”；脚注说明该短语也可能强调合乎人情、温和的引导。
- source_word: אֶמְשְׁכֵם
  choice: 牵引他们
  rationale: משך有拉、牵引之意；“牵引”既与绳索意象相合，也能表达引导，避免译成较抽象的“带领”。
- source_word: בַּעֲבֹתוֹת אַהֲבָה
  choice: 用慈爱的绳带
  rationale: עֲבֹתוֹת指较粗的绳索或绳带；用“绳带”与前面的“绳索”略作区分，同时保留平行诗句和“慈爱”的关系性内涵。
- source_word: וָאֶהְיֶה לָהֶם
  choice: 我待他们
  rationale: 按希伯来语“我对他们如同……”的功能译成自然现代汉语，引出后面的比喻。
- source_word: כִּמְרִימֵי עֹל
  choice: 就像把轭……提起的人
  rationale: 保留עֹל通常所指的“轭”以及מרים的“提起”动作；汉语以泛指“人”自然涵盖原文分词复数，不强行判定究竟是一人还是多人。
- source_word: עַל לְחֵיהֶם
  choice: 从他们腮上
  rationale: לְחִי可指腮或颌；在轭的畜牧意象中，“腮”既具体又自然。“从……上提起”表达原文介词与动作的关系。
- source_word: וְאַט
  choice: 我俯身
  rationale: 依上下文采用弯腰、俯身照料的理解，使动作意象清楚；该词组语义和句法较难，正文不作抽象扩写。
- source_word: אֵלָיו אוֹכִיל
  choice: 到他跟前，喂养他
  rationale: 保留马所拉文本中的阳性单数代词，并以“喂养”表达אכל使役式“使吃、给食物”的意义。
theological_decisions:
- issue: 上帝慈爱而有权柄的拟人化及畜牧意象
  choice: 保留牵引、提轭、俯身和喂养等具体动作
  alternative: 抽象译为上帝温柔地引导并供应以色列
  rationale: 原文借鲜明意象同时呈现上帝的权柄与温柔照料；保留这些意象，不作寓意化扩展，也不把其中的张力化约为抽象教义。
- issue: 复数所指之后出现单数אֵלָיו
  choice: 正文保留“他”
  alternative: 依上下文整齐化为“他们”
  rationale: 马所拉文本明确转用单数，可能把以色列整体视作一位受照料者；正文不擅自统一数，复数译法列入脚注。
- issue: עֹל与末句的困难意象
  choice: 按常见词义译为从腮上提起“轭”，继而俯身喂养
  alternative: 将该画面理解为把幼儿抱到脸颊旁，或对末句作其他句法处理
  rationale: 正文遵循未改动的马所拉辅音文本及本节畜牧语境，同时避免借推测性校勘消除文本本身的困难。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留诗歌中的绳索、轭、腮、俯身和喂养等具体形象；“人的绳索”刻意保留希伯来语的陌生感，并用脚注提供较解释性的读法。标点将前两组平行意象与后面的照料动作清楚分开。
