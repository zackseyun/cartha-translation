source:
  edition: WLC
  text: לֹ֤א יָשׁוּב֙ אֶל אֶ֣רֶץ מִצְרַ֔יִם וְ/אַשּׁ֖וּר ה֣וּא מַלְכּ֑/וֹ כִּ֥י מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/005.yaml
  text: He will not return to the land of Egypt[a], but Assyria will be his king[b], because they have refused to return.
translation:
  language: zh_hans
  text: 他必不返回埃及地[a]，亚述却要作他的王，因为他们不肯回转[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语句式紧凑，也可较形式化地译为：“他必不返回埃及地；至于亚述，它要作他的王。”
    reason: lexical_alternative
  - marker: b
    text: “回转”也可理解为“返回”“转回”或“悔改”；原文兼有实际行动和属灵归回的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָשׁוּב
  choice: 他必不返回
  rationale: 否定词加Qal未完成式第三人称阳性单数，在预言审判的语境中以将来语气表达。“返回”也保留了与句末לָשׁוּב的词语呼应。
- source_word: אֶל אֶרֶץ מִצְרַיִם
  choice: 埃及地
  rationale: 保留原文“地”一词，既忠于形式，也可能唤起以色列昔日在埃及受奴役及出埃及的历史背景。
- source_word: וְאַשּׁוּר
  choice: 亚述却
  rationale: 连接词在“不返回埃及地”与“亚述作王”的对照中具有转折意味；“却”自然地表达这种对照，同时没有把关系解释得过强。
- source_word: הוּא מַלְכּוֹ
  choice: 要作他的王
  rationale: 原文是代词加名词谓语的名词句；按预言语境补出“要作”。保留“他的王”的比喻，不改写成“统治他”，也保留以单数指称集体以色列的形式。
- source_word: כִּי
  choice: 因为
  rationale: 引出上述审判的缘由。
- source_word: מֵאֲנוּ
  choice: 他们不肯
  rationale: 该动词为第三人称复数，表示群体坚决拒绝；“不肯”在现代汉语中准确而自然。
- source_word: לָשׁוּב
  choice: 回转
  rationale: שוב在这里既可表示返回、转回，也可带有悔改归向的属灵含义。“回转”保留这层双重意味，并与前面的“返回”形成词根呼应。
theological_decisions:
- issue: שוב在本节中的双重含义
  choice: 首句译“返回”，末句译“回转”，并以脚注说明末句兼有“返回、转回或悔改”的意味。
  alternative: 首句译“回去”，末句直接译“悔改”。
  rationale: 原文重复同一词根，兼具地理上的返回和盟约意义上的转回。中文若两处都译成同一个词会显得生硬，但直接译“悔改”又会过早消除原文的张力，因此正文采用近义呼应并用脚注保留歧义。
- issue: 单数与复数人称的转换
  choice: 照原文译作“他／他的”与“他们”，不明说其先行词。
  alternative: 统一改为“他们／他们的”，或补成“我的子民”。
  rationale: 原文先以阳性单数指称集体，末句则改用复数。保留这一转换，避免将上下文中的明确称谓添入本节，也不抹平希伯来语的集体指称方式。
- issue: 亚述作王的表述
  choice: 保留“亚述……作他的王”的拟人化说法。
  alternative: 意译为“亚述要统治他”。
  rationale: 原文以“王”呈现外国势力取代自主权的审判图景；保留比喻可避免削弱其神学与修辞力度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“埃及地”保留原文形式及历史回响；“亚述却要作他的王”保留拟人化和外族掌权的比喻；“不肯回转”通俗可懂，同时没有把שוב的含义限定为单纯的地理返回或专门的宗教术语。
