review_pass:
  verdict: revise
  source_fidelity: “发尽”把原文“施行／实行我的烈怒”加强为把怒气完全发尽，加入了“尽”的范围。末句马所拉文本的通常读法是“我必不进城”；正文“我必不带着敌意而来”属于解释性较强且有争议的处理，应以较直译的读法置于正文，并以脚注保留语境化解释。
  naturalness: 修订后的中文保持现代、庄重的经文语体。“我是你中间的圣者”虽保留了对以法莲的单数称呼，但在现代汉语中仍可理解；不改作“你们”可避免无必要地改变原文数。
  terminology: “施行烈怒”“毁灭以法莲”“神，不是人”“圣者”准确且用语一致。末句脚注明确区分马所拉文本的字面读法与“非毁灭性临到”的解释，不把有争议的解释当作确定词义。
  issues:
  - severity: medium
    issue: “发尽我的烈怒”增添“尽”的语义。
    rationale: עָשָׂה חֲרוֹן אַפִּי 表示施行／实行自己的烈怒，并未明说把怒气完全发尽；“发尽”可能暗示怒气耗尽或全数倾泻。
  - severity: high
    issue: 末句正文未优先反映希伯来文的通常读法。
    rationale: וְלֹא אָבוֹא בְּעִיר 按马所拉元音通常为“我必不进城”。其含义确有困难，也可按语境理解为不以毁灭者身份临到，但“带着敌意而来”不应在无提示下取代较直接的文本读法。
  - severity: low
    issue: “你们中间”将原文对以法莲的阳性单数称呼改为复数。
    rationale: 以法莲可代表群体，复数并非不可理解；但此处采用“你中间”可更直接保留原文的称呼方式。
  revised_text: 我必不施行我的烈怒[a]，也不再毁灭以法莲。因为我是神，不是人；我是你中间的圣者；我必不进城[b]。
  revised_footnotes:
  - marker: a
    text: 或译：“我不施行我燃烧的怒气。”
    reason: 保留 חֲרוֹן אַפִּי 所含“燃烧／炽烈的怒气”的较字面意象。
  - marker: b
    text: 本句希伯来文的含义有争议。按通常读法，直译为“我必不进城”；也有人按上下文理解为神不以毁灭者的身份、带着震怒临到。
    reason: וְלֹא אָבוֹא בְּעִיר 的字面读法与其在审判语境中的具体含义之间存在真实解释争议。
  revision_rationale: 修订删除“发尽”所加入的完成／穷尽含义，改用与 עָשָׂה 相称的“施行”。末句以马所拉文本的通常字面读法“我必不进城”为正文，同时在脚注中保留与上下文相合、但不能当作无争议词义的非毁灭性临到解释。其余句子保留原文的神人对比、以法莲名称和“圣者”这一神圣称谓。
