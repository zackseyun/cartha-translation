source:
  edition: WLC
  text: לֹ֤א אֶֽעֱשֶׂה֙ חֲר֣וֹן אַפִּ֔/י לֹ֥א אָשׁ֖וּב לְ/שַׁחֵ֣ת אֶפְרָ֑יִם כִּ֣י אֵ֤ל אָֽנֹכִי֙ וְ/לֹא אִ֔ישׁ בְּ/קִרְבְּ/ךָ֣ קָד֔וֹשׁ וְ/לֹ֥א אָב֖וֹא בְּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/009.yaml
  text: I will not carry out the fierceness of my anger[a]; I will not again destroy Ephraim. For I am God and not a man, the Holy One in your midst[c][b], and I will not come into the city.
translation:
  language: zh_hans
  text: 我不施行我的烈怒[a]，也不再毁灭以法莲。因为我是神，并非人；我是在你中间的圣者；我必不进城[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我不施行我燃烧的怒气。”
    reason: 保留 חֲרוֹן אַפִּי 所含“燃烧／炽烈的怒气”这一较字面的意象。
  - marker: b
    text: 本句希伯来文含义不确定。或按上下文译为：“我必不带着敌意而来”或“我必不以毁灭者的身份临到。”
    reason: וְלֹא אָבוֹא בְּעִיר 可较字面译作“我必不进城”，但其词义和句法在此处存在真实争议；脚注保留语境性的替代理解。
lexical_decisions:
- source_word: אֶעֱשֶׂה חֲרוֹן אַפִּי
  choice: 发尽我的烈怒
  rationale: עָשָׂה 与“烈怒”连用，表示将怒气付诸行动；“发尽”既自然，又表达施行全部烈怒之意。
- source_word: חֲרוֹן אַפִּי
  choice: 我的烈怒
  rationale: 该短语本义涉及怒气的燃烧、炽烈；“烈怒”简洁保留其强度。
- source_word: אָשׁוּב לְשַׁחֵת
  choice: 再毁灭
  rationale: שׁוּב 加不定式可表示再次做某事，也可较字面地理解为返回去做；正文采用符合语境的“再”，并在脚注保留另一可能。
- source_word: אֵל אָנֹכִי וְלֹא אִישׁ
  choice: 我是神，不是人
  rationale: 直接保留神与人的对比，不增加有关神性不变或情感的哲学阐释。
- source_word: בְּקִרְבְּךָ קָדוֹשׁ
  choice: 我是你们中间的圣者
  rationale: קָדוֹשׁ 在此作名词性用法；“圣者”保留其自称性质。בְּקִרְבְּךָ 为阳性单数，但所指可为以法莲这一群体，汉语用“你们中间”自然表达群体中的临在。
- source_word: וְלֹא אָבוֹא בְּעִיר
  choice: 我必不带着敌意而来
  rationale: 末句希伯来文含义困难。בְּעִיר 可按常见形式理解为“进城”，也有人将其联系于敌对、攻击性的来到。正文按上下文表达不以毁灭性敌意临到，同时以脚注保留较直译读法。
theological_decisions:
- issue: 神收回审判与其圣洁之间的张力
  choice: 保留神不施尽烈怒的宣告，并将其根据直接置于“我是神，不是人”和“圣者”之中
  alternative: 用系统神学术语解释神是否改变心意
  rationale: 原文把怜悯、审判与神的圣洁并置，却没有作哲学化说明；译文不替经文消解这一张力。
- issue: 末句 וְלֹא אָבוֹא בְּעִיר 的解释
  choice: 正文译为“我必不带着敌意而来”
  alternative: “我必不进城”
  rationale: 上下文是拒绝施行毁灭性烈怒，敌对临到的理解与语境衔接较好；但字面“进城”的分析真实存在，故列入脚注。
- issue: “不再毁灭以法莲”的范围
  choice: 按原文直译为“不再毁灭”，不增添“彻底”等限定
  alternative: “不彻底毁灭以法莲”
  rationale: 上下文或可使人理解为不实施全面毁灭，但原句没有明说“彻底”，正文不补入该限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“发尽我的烈怒”保持诗性与审判语气；分号呈现因果说明中的平行自称。所有脚注标记均置于正文相应位置。
