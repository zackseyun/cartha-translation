base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/003.yaml
  text: Yet it was I who taught Ephraim to walk[a], taking them in my arms, but they did not know that I healed them.
translation:
  language: zh_hans
  text: 但我教以法莲学走路[a]，把他们抱在我怀里；他们却不知道，是我医治了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处可直译为“把他们抱在他的双臂上”；“他的双臂”带有难解的第三人称后缀。许多解释者根据本节持续的第一人称话语，理解其意思为“把他们抱在我怀里”。
    reason: textual_variant
lexical_decisions:
- source_word: תִרְגַּלְתִּי
  choice: 教……学走路
  rationale: 该动词在此描写训练幼儿行走；这一译法自然保留了具体而亲密的养育图景。
- source_word: לְאֶפְרַיִם
  choice: 以法莲
  rationale: 介词 לְ 按汉语习惯融入“教以法莲学走路”的句法，不另译为“给”。
- source_word: קָחָם
  choice: 把他们抱在怀里
  rationale: 马所拉文本的形式按现有元音为第三人称“他抱起他们”，但上下文是耶和华持续以第一人称说话；正文按语境表达连续动作，异常的人称形式在脚注说明。
- source_word: עַל זְרוֹעֹתָיו
  choice: 抱在怀里
  rationale: 字面近于“在他的双臂上”，现代汉语以“抱在怀里”自然传达抱持幼儿的动作；第三人称后缀的文本难点收入脚注。
- source_word: וְלֹא יָדְעוּ
  choice: 他们却不知道
  rationale: וְ 在这里具有转折意味，突出以法莲虽蒙照料却没有认出医治者。
- source_word: רְפָאתִים
  choice: 我医治了他们
  rationale: רפא 的基本义为“医治”；保留其具体隐喻，也容纳恢复、复原的含义。
theological_decisions:
- issue: 上帝的拟人化养育图景
  choice: 保留教孩子走路并抱在怀里的亲密形象
  alternative: 概括为上帝照顾或引导以法莲
  rationale: 希伯来文刻意采用养育幼儿的具体动作，不宜抽象化，以免削弱其神学张力与温情。
- issue: 中间分句由第一人称转为第三人称的马所拉文本难点
  choice: 正文依上下文连贯译作第一人称含义，脚注保存第三人称形式
  alternative: 正文直译为“他把他们抱在他的双臂上”
  rationale: 整节前后均为上帝第一人称发言，而 קָחָם 与 זְרוֹעֹתָיו 呈第三人称形式。自然正文配合文本脚注，既不让中文产生未经解释的说话者转换，也不掩盖原文困难。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“教……学走路”和“抱在怀里”保留育儿场景；“其实，是我……”突出希伯来文 אָנֹכִי 所强调的施事者。“他们”沿用集体名词“以法莲”在后文的复数指代。
