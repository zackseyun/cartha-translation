  text: כִּ֛י נַ֥עַר יִשְׂרָאֵ֖ל וָ/אֹהֲבֵ֑/הוּ וּ/מִ/מִּצְרַ֖יִם קָרָ֥אתִי לִ/בְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/001.yaml
  text: When Israel was a child[a], I loved him, and out of Egypt I called my son.
translation:
  language: zh_hans
  text: 以色列年幼的时候[a]，我爱他；我从埃及召出我的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为以色列还是个孩子，我爱他。”希伯来文开头的 כִּי 既可表示原因（“因为”），也可按这里的回顾语境表示时间（“……的时候”）。本节后半句在《马太福音》2:15中被引用。
    reason: 保留连接词的真实歧义，并提示后来的经文引用。
lexical_decisions:
- source_word: כִּי
  choice: ……的时候
  rationale: 此处可引出时间性或原因性从句；结合本节对以色列早期历史的回顾，正文采用自然的时间表达，同时以脚注保留“因为”的可能。
- source_word: נַעַר
  choice: 年幼
  rationale: 该词可指孩童、少年或青年。这里以以色列的幼年比喻其民族早期，“年幼”既体现未成熟和亲子关系，也避免把年龄界定得过窄。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代汉语中通行的专名译法；上下文将以色列民族人格化。
- source_word: וָאֹהֲבֵהוּ
  choice: 我爱他
  rationale: 保留第一人称神圣说话者及指向人格化以色列的阳性单数宾语；汉语简洁自然。
- source_word: וּמִמִּצְרַיִם
  choice: 我从埃及
  rationale: מִן表示来源或起点，“从埃及”是现代汉语的自然表达，并保留出埃及事件的历史回响。
- source_word: קָרָאתִי
  choice: 召出了
  rationale: קרא可表示呼叫或召唤。结合מִן所标示的起点，“召出了”自然表达神从埃及召出以色列，也保留“召”的核心语义。
- source_word: לִבְנִי
  choice: 我的儿子
  rationale: 在קרא的结构中表示被召者；保留以色列作为上帝儿子的亲属隐喻及单数形式。
theological_decisions:
- issue: “我的儿子”首先指群体以色列，又在《马太福音》2:15中被引用
  choice: 正文按《何西阿书》的直接历史语境，将“我的儿子”保留为人格化的群体以色列，同时采用可与后来的经文引用相衔接的措辞。
  alternative: 把本节直译或改写成专指弥赛亚的预言。
  rationale: 本节直接回顾出埃及传统中的以色列；翻译不应把后来的基督论应用预先塞入正文，也不应以措辞阻断正典内部的后续引用。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“年幼的时候”比“还是孩子时”略为正式；分号呈现两个紧密相连但各自完整的回顾性陈述。脚注标记已置于相关短语之后。
