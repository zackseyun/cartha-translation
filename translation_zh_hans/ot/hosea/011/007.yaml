id: HOS.11.7
reference: Hosea 11:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַמִּ֥/י תְלוּאִ֖ים לִ/מְשֽׁוּבָתִ֑/י וְ/אֶל עַל֙ יִקְרָאֻ֔/הוּ יַ֖חַד לֹ֥א יְרוֹמֵם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/007.yaml
  text: My people are bent on turning away from me[a]; though they call to the Most High[b], together he does not lift them up.
translation:
  language: zh_hans
  text: 我的子民执意背离我[a]；他们虽然向至高者呼求，他却不将他们一同扶起[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背离”所译的希伯来词也常译作“背道”或“叛离”。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来文含义不易确定。也可译作：“他们一同不尊崇他”，或“没有一个人尊崇他。”
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: 我的子民
  rationale: עַם在本节带有上帝与以色列立约关系的意味；“子民”比政治性的“国民”更贴合语境，第一人称单数词尾译为“我的”。
- source_word: תְלוּאִים
  choice: 执意
  rationale: 该分词本有悬挂、系住之意，与后面的לִמְשׁוּבָתִי连用，表达顽固而固定的倾向；“执意”既自然，也保留上下文中的固执意味。
- source_word: לִמְשׁוּבָתִי
  choice: 背离我
  rationale: מְשׁוּבָה常指背道、叛离；本处带第一人称单数词尾，句法较难。“背离我”按语境表达百姓离弃上帝的关系性含义，避免生硬或误解为上帝自己的转离。
- source_word: וְאֶל־עַל
  choice: 虽然向至高者
  rationale: אֶל־עַל通常理解为“向至高者”；连接词按前后反差译作让步性的“虽然”，使现代汉语流畅，同时不改变呼求与未获扶起之间的张力。
- source_word: יִקְרָאֻהוּ
  choice: 呼求
  rationale: 该动词为第三人称复数并带第三人称阳性单数词尾，可表达“呼唤他、向他呼求”；结合前置介词短语，译作“向至高者呼求”最合汉语习惯。
- source_word: יַחַד
  choice: 一同
  rationale: יַחַד表示共同、全体性的行动；“一同”保留其集合性副词意味，但其与末句其他成分的确切句法关系仍有歧义。
- source_word: לֹא יְרוֹמֵם
  choice: 他却不将他们……扶起
  rationale: רוּם可指举起、升高或尊崇。正文依语境把“至高者”理解为主语，并补出百姓为隐含受事，表达上帝没有施行拯救；原文压缩且疑难，其他读法在脚注保留。
theological_decisions:
- issue: 末句יַחַד לֹא יְרוֹמֵם的主语和含义
  choice: 以“至高者”为主语：他不将百姓一同扶起。
  alternative: “他们一同不尊崇他”，或“没有一个人尊崇他”。
  rationale: 希伯来文末句高度压缩，既可理解为上帝没有回应并救拔，也可理解为百姓不尊崇上帝。上下文中“呼求”与未蒙救拔的对照较支持前者，但正文不应掩盖真实歧义，因此在脚注列明其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我的子民”体现立约语境；“执意背离”传达持续而顽固的倾向；末句正文选用“不将他们一同扶起”，以“扶起”兼顾救助和رفع高的语义，并以脚注保留另一种重要读法。所有脚注标记均置于所说明的正文位置。
