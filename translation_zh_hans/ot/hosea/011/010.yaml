base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/010.yaml
  text: They will walk after Yahweh[a]; he will roar like a lion. For he himself will roar[b], and sons will come trembling from the west.
translation:
  language: zh_hans
  text: 他们必跟随耶和华而行；他必如狮子吼叫。因为他必吼叫，众子[b]必战战兢兢地从西方[a]而来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从海而来”；这里的“海”很可能是表示“西方”的地理说法。
    reason: lexical_alternative
  - marker: b
    text: 或译“儿女”；希伯来语原文是阳性复数，直译为“众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה יֵלְכוּ
  choice: 他们必跟随耶和华而行
  rationale: אַחֲרֵי与הלך连用，表达跟随某人而行；此译既保留“行”的具体意象，也自然传达跟随之意。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语中对四字神名最通行且可辨识的音译，不以称号代替专名。
- source_word: כְּאַרְיֵה יִשְׁאָג
  choice: 他必如狮子吼叫
  rationale: 按原文直译明喻；“吼叫”准确对应狮子的吼声。
- source_word: כִּי הוּא יִשְׁאַג
  choice: 他一吼叫
  rationale: כִּי在语境中引出随之发生的反应；汉语“一……就……”自然呈现吼叫与众子战兢而来的紧密关系。主语“他”保留原文显式代词，但不额外加入“亲自”。
- source_word: וְיֶחֶרְדוּ
  choice: 就必战战兢兢地……而来
  rationale: חרד表示因惧怕或敬畏而战兢；上下文涉及归回，因此以“而来”表达语境所含的移动，但不补出原文没有明说的目的地。
- source_word: בָנִים
  choice: 众子
  rationale: 保留希伯来语阳性复数“儿子们”的形式，不在正文中直接泛化为“儿女”或解释为“子民”。
- source_word: מִיָּם
  choice: 从西方
  rationale: 字面为“从海那边／从海”，在以色列地理表达中“海”通常指西方；正文采用自然的方位表达，字面形式收入脚注。
theological_decisions:
- issue: 狮吼与百姓归回之间的关系
  choice: 译作“他一吼叫，众子就必战战兢兢地……而来”，表现他们回应神的呼召而来
  alternative: 仅译为“他们必从西方战兢”，不明确呈现移动或回应关系
  rationale: 何西阿书11:8—11的复兴语境支持归回图景；但译文不补上“到他那里”等原文未明说的成分，以保留其张力。
- issue: הוּא是否译出加强语气
  choice: 保留独立主语“他”，不译为“他亲自”
  alternative: 译作“因为他自己必吼叫”或“他亲自必吼叫”
  rationale: 显式代词可能带强调，但现代汉语加入“自己／亲自”容易产生行动代理方面的额外对比；重复主语已足以呈现原句结构。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“跟随……而行”保留原文行走意象；“战战兢兢”准确传达惧怕或敬畏中的颤抖。脚注标记均置于其实际说明的词语之后，并按正文出现顺序可辨识。
