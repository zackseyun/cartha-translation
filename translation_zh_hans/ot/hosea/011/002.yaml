source:
  edition: WLC
  text: קָרְא֖וּ לָ/הֶ֑ם כֵּ֚ן הָלְכ֣וּ מִ/פְּנֵי/הֶ֔ם לַ/בְּעָלִ֣ים יְזַבֵּ֔חוּ וְ/לַ/פְּסִלִ֖ים יְקַטֵּרֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/002.yaml
  text: The more they called to them[a], the more they went away from them[b]; they kept sacrificing to the Baals and burning incense to idols.
translation:
  language: zh_hans
  text: 人们越呼唤他们[a]，他们就越离开那些呼唤他们的人；他们不断向巴力诸神献祭，又向偶像[b]烧香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正如有人呼唤他们，他们也照样离开他们。”希伯来文没有说明“呼唤”的主语是谁。
    reason: alternative_reading
  - marker: b
    text: 或译：“雕刻的神像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ לָהֶם
  choice: 人们呼唤他们
  rationale: קָרְאוּ是主动形态，主语在希伯来文中没有明说；用“人们”保留未特指的复数呼唤者，不擅自认定是上帝或先知。לָהֶם译为“他们”，保留原文紧缩的指代。
- source_word: כֵּן
  choice: 越……就越……
  rationale: 这里与前句构成比例关联，现代汉语用“越……就越……”自然地表达“怎样……也照样……”的递进关系。
- source_word: הָלְכוּ מִפְּנֵיהֶם
  choice: 他们就越离开那些呼唤他们的人
  rationale: הלך加מן和פנים表示从某人面前离去、远离某人。为避免汉语连续多个“他们”造成无法辨认的歧义，补出“那些呼唤他们的人”，但不进一步确定呼唤者的身份。
- source_word: לַבְּעָלִים
  choice: 向众巴力
  rationale: בְּעָלִים为复数，指各地或各种巴力神祇及其崇拜；“众巴力”既保留复数，也符合庄重的现代汉语表达。
- source_word: יְזַבֵּחוּ
  choice: 不断……献祭
  rationale: 未完成式在这里表达反复、惯常的行为，“不断”明确传达其持续反复性。
- source_word: לַפְּסִלִים
  choice: 向偶像
  rationale: פְּסִילִים指用于祭祀的雕刻神像；正文用通顺常见的“偶像”，脚注保留“雕刻的神像”这一具体词义。
- source_word: יְקַטֵּרוּן
  choice: 烧香
  rationale: קטר的Piel形在祭祀语境中通常指焚香或使祭物冒烟；此处以偶像为对象，译作“烧香”最清楚自然。
theological_decisions:
- issue: “呼唤他们”的主语未明
  choice: 以“人们”保留未特指的复数主动主语
  alternative: 上帝呼唤他们；先知呼唤他们；他们被呼唤
  rationale: 希伯来文没有明确说明呼唤者是谁，上下文容许不止一种理解。译文不把呼唤者限定为上帝或先知，也不把主动句改成被动句，以免消除原有的神学张力和语法含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众巴力”保留原文复数；用“那些呼唤他们的人”澄清汉语代词关系，但不确定其身份。所有脚注标记均置于正文相应词句之后。
