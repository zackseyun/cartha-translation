base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/006.yaml
  text: A sword will whirl through his cities[a], and will consume his bars[b], and devour them because of their counsels.
translation:
  language: zh_hans
  text: 刀剑必席卷他的城邑[a]，毁灭他的门闩[b]，并因他们的谋划[c]而吞噬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “席卷”所译的希伯来动词含义较难确定；也可译作“在他的城邑中旋转”、“临到他的城邑”或“在他的城邑中肆虐”。
    reason: lexical_alternative
  - marker: b
    text: 或译“他的城门闩”。有人把这里的希伯来词理解为“他的统治者”，但城邑遭攻击的语境更支持指防御用的门闩。
    reason: alternative_reading
  - marker: c
    text: “因”也可理解为“出于”或“从”；这里的希伯来介词既可表示原因，也可带有来源之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָלָה
  choice: 必席卷
  rationale: 该动词在此形式中的含义较难确定，可能描写旋转、降临或猛烈肆虐。“席卷”在现代汉语中自然地表现刀剑在城中横行毁坏的动态，同时以脚注保留其他可能。
- source_word: חֶרֶב
  choice: 刀剑
  rationale: 保留希伯来文单数的具体兵器意象；“刀剑”在汉语先知性语境中也可集合性地指战争与杀戮。
- source_word: בְּעָרָיו
  choice: 他的城邑
  rationale: בְּ־基本义为“在……中”；与“席卷”搭配时，汉语已自然表达刀剑在各城中横行。单数领属“他的”按原文保留。
- source_word: וְכִלְּתָה
  choice: 毁灭
  rationale: כלה表示使之终结、彻底除去；“毁灭”适合城防被摧毁的语境，也与下句“吞噬”构成递进。
- source_word: בַדָּיו
  choice: 他的门闩
  rationale: בדים可指杠、杆或闩；在城邑遭刀剑攻击的语境中，城门的门闩最为贴切。另有将其理解为统治者的解释，故在脚注中说明。
- source_word: וְאָכָלָה
  choice: 吞噬他们
  rationale: אכל本义为吃、吞吃，此处将刀剑人格化为吞噬者。“他们”是为汉语句法补出的宾语，并非希伯来文中明说的宾语。
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: 因他们的谋划
  rationale: 介词 מן 在这里最可能表原因，即灾祸源于他们的谋划；“谋划”较中性地保留 עצה 所含的筹划、主意之义，不预先把它定性为阴谋。
theological_decisions:
- issue: 领属后缀由单数转为复数
  choice: 保留“他的城邑／他的门闩”与“他们的谋划”之间的数转换
  alternative: 为汉语顺畅而统一译作“他们的城邑／他们的门闩／他们的谋划”
  rationale: 原文先用阳性单数后缀，末尾转为复数。单数可能把以色列或以法莲人格化为一个整体，复数则指向其中的百姓；译文不应擅自消除这一张力。
- issue: “吞噬”的宾语
  choice: 在正文中补出“他们”，并在说明中注明原文未明说宾语
  alternative: 不补宾语，译作“并因他们的谋划而吞噬”
  rationale: 汉语中的“吞噬”通常需要宾语，补出“他们”可使句意完整，但不把这一补足说成原文明确具有的成分。
- issue: מן 的关系
  choice: 按原因译作“因”
  alternative: 按来源译作“出于／从他们的谋划”
  rationale: 上下文最自然地表达审判因百姓的谋划而来，但希伯来介词本身容许来源色彩，因此用脚注保留可能性。
translation_notes:
  register: 采用现代、庄重而易懂的先知性表达。“城邑”比“城市”略具经文语体但仍属现代通用词；“席卷”使艰涩的动态意象在汉语中自然有力。正文保留原文单数领属转为复数领属的突变，并以脚注呈现关键词义的不确定性。
