  text: אֵ֞יךְ אֶתֶּנְ/ךָ֣ אֶפְרַ֗יִם אֲמַגֶּנְ/ךָ֙ יִשְׂרָאֵ֔ל אֵ֚יךְ אֶתֶּנְ/ךָ֣ כְ/אַדְמָ֔ה אֲשִֽׂימְ/ךָ֖ כִּ/צְבֹאיִ֑ם נֶהְפַּ֤ךְ עָלַ/י֙ לִבִּ֔/י יַ֖חַד נִכְמְר֥וּ נִחוּמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/008.yaml
  text: How can I give you up[a], Ephraim? How can I hand you over, Israel? How can I make you like Admah? How can I set you like Zeboiim? My heart is turned over within me[c][b]; all my compassions are stirred.
translation:
  language: zh_hans
  text: '我怎能舍弃你，以法莲？


    怎能把你交出去，以色列？


    我怎能使你像押玛，


    怎能使你如洗扁[a]？


    我的心在我里面翻转了[b]，


    我的怜悯全都激动起来[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 押玛和洗扁是与所多玛、蛾摩拉一同遭倾覆的城；这里的比较使人想到彻底的毁灭（参申命记29:23）。
    reason: cross_reference
  - marker: b
    text: 或译：“我的心在我里面改变了。”希伯来文更直译为心“翻转了”，表达强烈的内在震动或转折。
    reason: lexical_alternative
  - marker: c
    text: 或译：“我的怜悯全都发热了”或“燃起了”。原文可描写内在情感变得炽热、受到强烈触动。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: 我怎能
  rationale: 这里的疑问带有惊愕和不忍，并非单问方式；“怎能”自然传达情感上的难以如此行。
- source_word: אֶתֶּנְךָ
  choice: 舍弃你
  rationale: נתן 本义为“给、交出”，在审判语境中指任其遭受毁灭；“舍弃”既符合现代汉语，也保留神不忍放弃以法莲的情感张力。
- source_word: אֲמַגֶּנְךָ
  choice: 把你交出去
  rationale: 此处 Piel 词形表示交付、交出；与上一句“舍弃”形成近义而不完全重复的平行。
- source_word: אֶפְרַיִם / יִשְׂרָאֵל
  choice: 以法莲／以色列
  rationale: 保留专名及两行中的直接称呼；在何西阿书中二者在此平行指向北国及圣约子民。
- source_word: כְאַדְמָה / כִּצְבֹאיִם
  choice: 像押玛／如洗扁
  rationale: 保留原文所点名的两座城，不在正文中用解释性措辞代替；其遭毁灭的背景以脚注说明。
- source_word: אֲשִׂימְךָ
  choice: 使你
  rationale: שים 本义为“放置、设立”，接比较短语时，“使你像……”是自然且准确的汉语表达。
- source_word: נֶהְפַּךְ עָלַי לִבִּי
  choice: 我的心在我里面翻转了
  rationale: 保留 הפך“翻转、倒转”的强烈内在意象，而不将其平化为单纯的“改变心意”；“在我里面”自然表达 עָלַי 在此习语中的内在指向。
- source_word: יַחַד
  choice: 全都
  rationale: 字面可作“一同、一起”；在这里用“全都”统摄复数的怜悯之情，表达其一齐发动。
- source_word: נִכְמְרוּ נִחוּמָי
  choice: 我的怜悯全都翻涌起来
  rationale: נִכְמְרוּ 可描述发热、燃起或内心强烈激动；“翻涌起来”在现代汉语中自然传达深切而强烈的内在触动，同时以脚注保留“发热、燃起”的词义可能。
theological_decisions:
- issue: 以拟人化语言描写上帝内心的强烈活动
  choice: 保留“心……翻转”及“怜悯……翻涌”的鲜明身体与情感意象
  alternative: 抽象化为“我改变了主意”
  rationale: 希伯来文有意以强烈、关系性的语言描绘上帝的怜悯；译文不把其中的神学张力化约为抽象判断。
- issue: 押玛和洗扁所指的审判背景
  choice: 正文保留两座城的名称
  alternative: 意译为“那些被我毁灭的城”
  rationale: 原文明确使用专名来唤起彻底倾覆的历史记忆；保留名称并用脚注交代背景，更忠实于原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留诗体的短行、反复问句和两组平行结构。专名按中文圣经通行译法处理；“翻转”“翻涌”刻意保存原文强烈的内在意象，并以脚注提示其他可行译法。
