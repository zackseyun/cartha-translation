source:
  edition: WLC
  text: עַל רָאשֵׁ֨י הֶ/הָרִ֜ים יְזַבֵּ֗חוּ וְ/עַל הַ/גְּבָעוֹת֙ יְקַטֵּ֔רוּ תַּ֣חַת אַלּ֧וֹן וְ/לִבְנֶ֛ה וְ/אֵלָ֖ה כִּ֣י ט֣וֹב צִלָּ֑/הּ עַל כֵּ֗ן תִּזְנֶ֨ינָה֙ בְּנ֣וֹתֵי/כֶ֔ם וְ/כַלּוֹתֵי/כֶ֖ם תְּנָאַֽפְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/013.yaml
  text: On the tops of the mountains they sacrifice[a], and on the hills they burn incense, under oak and poplar and terebinth, because their shade is good. Therefore your daughters prostitute themselves[c][b], and your daughters-in-law commit adultery.
translation:
  language: zh_hans
  text: 他们在山顶献祭，在冈陵上烧香[a]，在橡树、白杨和黄连木[b]下，因为树荫宜人。因此，你们的女儿行淫[c]，你们的儿媳通奸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烧香”也可译作“焚烧祭物”；这个希伯来语动词既可专指焚香，也可泛指使祭物焚烧冒烟。
    reason: lexical_alternative
  - marker: b
    text: 这些古代树名传统上分别认作橡树、白杨和黄连木一类的树，但其确切的植物学对应并不完全确定。
    reason: cultural_note
  - marker: c
    text: 何西阿书常以性方面的不忠比喻对上帝之约的不忠；不过，本节的措辞也直接指向实际的淫乱行为。
    reason: cross_reference
lexical_decisions:
- source_word: רָאשֵׁי הֶהָרִים
  choice: 山顶
  rationale: 原文直译为“群山的头”，惯用义是山的顶部或峰顶；“山顶”自然简洁，也保留高处祭祀的场景。
- source_word: יְזַבֵּחוּ
  choice: 献祭
  rationale: זבח 的 Piel 词形指宰杀并献上祭牲；“献祭”准确且符合现代汉语宗教语境。
- source_word: יְקַטֵּרוּ
  choice: 烧香
  rationale: קטר 的 Piel 可指焚香，也可较宽泛地指焚烧祭物使烟气上升。正文采用常见的“烧香”，脚注保留较宽的词义可能。
- source_word: תַּחַת אַלּוֹן וְלִבְנֶה וְאֵלָה
  choice: 在橡树、白杨和黄连木下
  rationale: 按常见植物学对应分别译出三种树木；“黄连木”用来表达 אֵלָה 一类的 terebinth，同时以脚注说明古代树名的确切对应并不完全确定。
- source_word: כִּי טוֹב צִלָּהּ
  choice: 因为那里的树荫宜人
  rationale: 原文“荫影好”中的阴性单数后缀可指所述树木形成的整体树荫，也可能以末一种树为代表；“那里的树荫”自然地保留场景而不强行确定单复数所指。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 明确表达前述偶像祭祀环境与后述淫乱之间的结果或因果联系。
- source_word: תִּזְנֶינָה
  choice: 行淫
  rationale: זנה 可指卖淫或较广义的淫乱，也常在何西阿书中承载对盟约不忠的比喻意义。“行淫”避免把商业交易强加于原文，同时保留强烈的性不忠含义。
- source_word: בְּנוֹתֵיכֶם
  choice: 你们的女儿
  rationale: 直接对应亲属称谓。
- source_word: וְכַלּוֹתֵיכֶם
  choice: 你们的儿媳
  rationale: כַּלָּה 可指新娘或儿媳；与“你们的女儿”并列时，“儿媳”更符合家庭关系语境。
- source_word: תְּנָאַפְנָה
  choice: 通奸
  rationale: נאף 特指婚姻关系中的奸淫；“通奸”保留其与前句较宽泛的 זנה 之间的词义区别。
theological_decisions:
- issue: 性行为用语应按字面罪行还是按属灵不忠的隐喻翻译
  choice: 正文按具体性行为译为“行淫”和“通奸”，脚注同时指出何西阿书中的盟约不忠意象。
  alternative: 把两者直接意译为属灵上的背叛或拜偶像。
  rationale: 本节明确提到“女儿”和“儿媳”，并使用两个具体的性行为动词，因此字面层面的社会与道德罪行不可抹去；但何西阿书反复以性不忠象征对上帝盟约的不忠，故以脚注保留双重意涵。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“冈陵”与“山顶”形成自然的诗性平行；补出“他们……这样做”以明确树下行为与前两项祭祀动作相连。“行淫”比“卖淫”更能保留 זנה 是否特指商业性行为的歧义，并与特指婚姻不忠的“通奸”区别开来。
