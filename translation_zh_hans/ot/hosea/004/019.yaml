base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/019.yaml
  text: The wind has wrapped her in its wings[a], and they will be put to shame because of their sacrifices.
translation:
  language: zh_hans
  text: 风把她裹在翅膀里[a]；他们必因自己的祭物蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“灵把她捆在它的翅膀里。”希伯来语“רוּחַ”可指“风”“气息”或“灵”；译为“裹”的动词也可译为“捆住”或“围住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַר
  choice: 裹
  rationale: 该动词可表达捆绑、包住或围住；与“风”和“翅膀”的诗歌意象相配时，“裹”既自然，也保留被风卷住、困住的意味。希伯来语完成式在中文中无需另加时态标记。
- source_word: רוּחַ
  choice: 风
  rationale: 该词可指风、气息或灵；本句与“翅膀”搭配，首先形成风施行席卷和审判的意象，因此正文译作“风”，并以脚注保留“灵”的可能。
- source_word: אוֹתָהּ
  choice: 她
  rationale: 阴性单数宾语代词承接上下文中被人格化的以色列或以法莲这一群体。
- source_word: בִּכְנָפֶיהָ
  choice: 在翅膀里
  rationale: 介词 ב 保留“在……里面”的包围意象；阴性单数后缀在语法上可指 רוּחַ，中文无需为风另设物主代词，直接说“翅膀”更自然。
- source_word: וְיֵבֹשׁוּ
  choice: 他们必……蒙羞
  rationale: בוש 表示羞愧、受辱或希望落空；“蒙羞”简洁地表达审判所带来的羞辱结果。未把复数主语改成与前句相同的阴性单数，以保留原文由“她”转为“他们”的数与视角变化。
- source_word: מִזִּבְחוֹתָם
  choice: 因自己的祭物
  rationale: 介词 מן 在此按原因理解，表示他们蒙羞是由于其祭物；“祭物”比“献祭”更直接对应复数名词 זבחות，也不额外说明其性质。
theological_decisions:
- issue: רוּחַ 的含义与审判意象
  choice: 正文译为“风”，描绘被风裹住的群体，并让上下文显出审判意味。
  alternative: 可译为“灵”，并把动词理解为“捆住”或“围住”。
  rationale: “风”与“翅膀”的意象结合较自然，但原文并未明确说明这风就是流亡、灾祸或某种特定的神圣行动，因此不在正文中作进一步解释，并在脚注保留词义歧义。
- issue: 祭物与蒙羞的关系
  choice: 译作“因自己的祭物蒙羞”，将 מן 理解为原因。
  alternative: 也可较直译为“从他们的祭物蒙羞”，或理解为他们的祭物最终令其失望。
  rationale: 上下文指向敬拜上的不忠，因果读法最通顺；但正文只说“祭物”，不擅自加入“偶像”或“邪恶”等限定。
- issue: “她”与“他们”的指称变化
  choice: 保留“她”到“他们”的转换。
  alternative: 为中文一致性，可全部处理为单数群体或全部处理为复数成员。
  rationale: 原文先用阴性单数宾语指人格化的群体，后用阳性复数动词指其成员；保留转换可避免抹平诗句中真实存在的语法张力。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。以“裹在翅膀里”保留诗歌意象；分号呈现两小句间紧密但未完全明说的审判关系。脚注标记[a]已置于相关意象之后。
