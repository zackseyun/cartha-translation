source:
  edition: WLC
  text: לֹֽא אֶפְק֨וֹד עַל בְּנוֹתֵי/כֶ֜ם כִּ֣י תִזְנֶ֗ינָה וְ/עַל כַּלּֽוֹתֵי/כֶם֙ כִּ֣י תְנָאַ֔פְנָה כִּי הֵם֙ עִם הַ/זֹּנ֣וֹת יְפָרֵ֔דוּ וְ/עִם הַ/קְּדֵשׁ֖וֹת יְזַבֵּ֑חוּ וְ/עָ֥ם לֹֽא יָבִ֖ין יִלָּבֵֽט־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/014.yaml
  text: I will not punish your daughters when they prostitute themselves[a], nor your daughters-in-law when they commit adultery; for the men themselves go apart with prostitutes and sacrifice with cult prostitutes[c][b], and a people without understanding comes to ruin.
translation:
  language: zh_hans
  text: 你们的女儿卖淫，我不惩罚她们；你们的儿媳通奸，我也不惩罚她们；因为他们这些男人与妓女走到一旁[a]，又跟那些称为“圣女”的女子一同献祭[b]。无知的民必败亡[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “走到一旁”也可理解为“与妓女厮混”。希伯来语动词字面意思是“分开、走开”。
    reason: lexical_alternative
  - marker: b
    text: “圣女”所译的希伯来语词与“圣、分别为圣”有关，指与非法祭仪相关的女子。传统上常译作“祭祀淫女”或“庙妓”，但其具体社会角色仍有争议。
    reason: lexical_alternative
  - marker: c
    text: 末尾的希伯来语动词十分罕见，也可能有“被摔倒”“陷入混乱”或更笼统的“走向毁灭”之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְקוֹד
  choice: 惩罚
  rationale: פקד 与 עַל 连用并处于审判语境时，表示追究、施罚；“惩罚”在现代汉语中清楚表达其司法含义。
- source_word: תִזְנֶינָה
  choice: 卖淫
  rationale: זנה 在此指不正当性行为，并保留何西阿书中的卖淫意象；直译为“卖淫”比泛化为“淫乱”更具体。
- source_word: כַלּוֹתֵיכֶם
  choice: 你们的儿媳
  rationale: כַּלָּה 在此亲属关系语境中指儿子的妻子，而不只是婚礼中的新娘。
- source_word: תְנָאַפְנָה
  choice: 通奸
  rationale: נאף 特指奸淫或通奸，应与前面的 זנה 区分。
- source_word: יְפָרֵדוּ
  choice: 走到一旁
  rationale: פרד 的字面义是分开、走开；此处可能委婉指男人与妓女私下交合。“走到一旁”保留原文意象，不把含义解释得过满。
- source_word: הַזֹּנוֹת
  choice: 妓女
  rationale: 清楚、自然地表达 זנה 的阴性复数名词用法。
- source_word: הַקְּדֵשׁוֹת
  choice: 祭祀淫女
  rationale: 该词指与非法祭祀及性行为相关的女性。“祭祀淫女”保留祭祀背景，又避免把地点限定为圣殿。
- source_word: יְזַבֵּחוּ
  choice: 献祭
  rationale: 准确表达 זבח 的基本祭祀含义，且符合现代汉语搭配。
- source_word: וְעָם לֹא יָבִין
  choice: 无知的民
  rationale: 简洁表达“不明白、不辨识的民”，保留 עם 的集合性和泛指意味。
- source_word: יִלָּבֵט
  choice: 必败亡
  rationale: 该罕见动词含义不完全确定，可能指被摔倒、困惑或陷入毁灭；“败亡”自然概括其毁灭性结果，同时以脚注保留歧义。
theological_decisions:
- issue: 本节是否表示上帝宽免女性的性罪
  choice: 保留原文“不惩罚”的直接陈述，并让“因为男人自己……”说明男人同样卷入败坏。
  alternative: 解释为上帝不单独惩罚女性，或理解为绝对不惩罚她们。
  rationale: 原文因果句把不施罚与男人自身的同类罪行联系起来，但没有明说“只是不单独惩罚”。正文不补入这一解释，以保留神学张力。
- issue: קְדֵשׁוֹת 的身份
  choice: 祭祀淫女
  alternative: 庙妓；被分别为圣的女子
  rationale: 上下文把该词与献祭和性败坏相连。“祭祀淫女”表达其礼仪和性含义，却不把制度或地点说得超过原文。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“卖淫”与“通奸”分别对应两个不同的希伯来语动词；“走到一旁”刻意保留原文的委婉和含混。分句调整为自然汉语语序，但未补入原文没有明说的“只”或“单独”等解释性词语。
