source:
  edition: WLC
  text: אִם זֹנֶ֤ה אַתָּה֙ יִשְׂרָאֵ֔ל אַל יֶאְשַׁ֖ם יְהוּדָ֑ה וְ/אַל תָּבֹ֣אוּ הַ/גִּלְגָּ֗ל וְ/אַֽל תַּעֲלוּ֙ בֵּ֣ית אָ֔וֶן וְ/אַל תִּשָּׁבְע֖וּ חַי יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/015.yaml
  text: Though you prostitute yourself[a], Israel, let not Judah become guilty. And do not go to Gilgal, and do not go up to Beth-aven, and do not swear, ‘As Yahweh lives.’
translation:
  language: zh_hans
  text: 以色列啊，即使你行淫，犹大也不可招致罪责。你们不要往吉甲去，不要上伯亚文[a]去，也不要起誓说：“雅威永活！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯亚文”意为“邪恶之家”或“罪孽之家”，很可能是先知用来讽刺伯特利的称呼。
    reason: 解释带有讽刺意味的地名及其可能所指。
lexical_decisions:
- source_word: אִם
  choice: 即使
  rationale: 此处结合上下文可表达让步意味：以色列行淫已被视为事实，重点是警告犹大不要卷入。“即使”同时保留了希伯来语条件结构的痕迹。
- source_word: זֹנֶה
  choice: 行淫
  rationale: 保留何西阿书以性不忠喻指背约和偶像崇拜的尖锐先知性隐喻，不将其淡化为笼统的“不忠”。
- source_word: אַל יֶאְשַׁם
  choice: 不可陷入罪责
  rationale: אשם在此指成为有罪、招致罪责；这一译法体现祈使禁令的语气，并避免将经文扩大解释为法律上的定罪。
- source_word: תָּבֹאוּ הַגִּלְגָּל
  choice: 往吉甲去
  rationale: בוא在前往某地的禁令中自然译为“往……去”；吉甲按通行中文地名音译。
- source_word: תַּעֲלוּ
  choice: 上……去
  rationale: 保留עלה“上去”的方向性及前往祭祀地点的希伯来表达，同时符合现代汉语。
- source_word: בֵּית אָוֶן
  choice: 伯亚文
  rationale: 保留原文刻意使用的讽刺性地名，而不直接改成“伯特利”；其含义及所指另以脚注说明。
- source_word: תִּשָּׁבְעוּ
  choice: 起誓
  rationale: 该词在此明确指发誓或立誓，“起誓”庄重、自然。
- source_word: חַי יְהוָה
  choice: 雅威永活
  rationale: 按原文保留简短的誓言公式，并直接呈现神的名字；不补入原文没有的“作证”或“我指着”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的功能，而不以称号替代。
theological_decisions:
- issue: 以性行为比喻圣约不忠
  choice: 行淫
  alternative: 不忠；属灵淫乱
  rationale: 原文有意使用强烈而具体的זנה隐喻。“行淫”既保留先知话语的冲击力，也没有添加“属灵”等解释性限定。
- issue: אִם所表达的条件或让步关系
  choice: 即使
  alternative: 如果
  rationale: 上下文将以色列的不忠作为现实来谴责，故让步理解较为自然；“即使”仍带有条件色彩，没有把句间关系解释得过死。
- issue: 誓言中神名的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，音译可保留盟约语境中专名的作用，避免以称号取代。
- issue: 伯亚文与伯特利的关系
  choice: 正文保留“伯亚文”，脚注说明其讽刺含义及可能所指
  alternative: 正文直接译作“伯特利”或“罪恶之家”
  rationale: בֵּית אָוֶן是文本本身的修辞选择。保留名称可以维持先知的双关和讽刺，同时不把“可能指伯特利”提升为正文中的确定读法。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。以“行淫”保留先知性隐喻，以“陷入罪责”表达אשם的动态含义；各项禁令用“不可”形成整齐有力的节奏。脚注标记置于正文“伯亚文”之后，与脚注内容准确对应。
