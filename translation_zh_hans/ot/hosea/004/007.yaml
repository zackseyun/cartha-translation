base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/007.yaml
  text: The more they increased[a], the more they sinned against me[b]; I will change their glory into disgrace.
translation:
  language: zh_hans
  text: 他们越增多[a]，就越得罪我；我要把他们的荣耀变为羞辱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们怎样增多，也怎样得罪我。”
    reason: 保留כְּרֻבָּם与כֵּן较为形式对应的译法。
  - marker: b
    text: “变为”或译“换成”。
    reason: אָמִיר既可表示改变，也可表示交换。
lexical_decisions:
- source_word: כְּרֻבָּם ... כֵּן
  choice: 他们越增多……就越……
  rationale: כְּ与כֵּן构成相应关系，表达“随着……增多，也相应地……”。现代汉语用“越……就越……”自然地保留这种递进关联。
- source_word: חָטְאוּ לִי
  choice: 得罪我
  rationale: חטא与ל连用可表示对某人犯罪或冒犯；“得罪我”在现代汉语中清楚表达罪是针对上帝的，同时不额外添加解释。
- source_word: כְּבוֹדָם
  choice: 他们的荣耀
  rationale: כָּבוֹד可指荣耀、尊荣或显赫地位。“荣耀”保留原文范围，也不限定它具体指祭司尊荣、财富地位或上帝自己。
- source_word: בְּקָלוֹן
  choice: 变为羞辱
  rationale: קָלוֹן表示羞耻、耻辱或受辱的状态；与אָמִיר连用时，“变为羞辱”自然体现由荣耀到羞辱的逆转。
- source_word: אָמִיר
  choice: 我要把……变为……
  rationale: 该形式通常理解为“改变、兑换”。“把……变为……”符合现代汉语习惯，并明确保留第一人称单数主语。
theological_decisions:
- issue: “他们的荣耀”所指为何
  choice: 正文保留“他们的荣耀”，不作解释性扩展
  alternative: 可理解为他们的祭司尊荣、财富与地位，或以神为他们的荣耀
  rationale: 希伯来文没有明确限定所指；保留含混性，能维持原文的反讽和神学张力，避免把某一种解释写进正文。
- issue: אָמִיר所表达的是改变还是交换
  choice: 正文译为“变为”
  alternative: 也可译为“换成”
  rationale: 两种理解都符合语境；正文采用较自然的状态转变表达，脚注保留“换成”这一词义可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“越……就越……”便于普通读者理解原文的关联结构；“荣耀”与“羞辱”形成鲜明对照。所有脚注标记均置于正文相应位置。
