  text: וְ/אָֽכְלוּ֙ וְ/לֹ֣א יִשְׂבָּ֔עוּ הִזְנ֖וּ וְ/לֹ֣א יִפְרֹ֑צוּ כִּֽי אֶת יְהוָ֥ה עָזְב֖וּ לִ/שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/010.yaml
  text: They will eat[a], but not be satisfied; they will commit sexual immorality, but not increase, because they have abandoned Yahweh[c][b], to cherish prostitution.
translation:
  language: zh_hans
  text: 他们会吃，却不得饱足；他们会行淫[a]，却不能增多[b]，因为他们已经离弃雅威，不再留心听从他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行淫”也可译作“卖淫”。这个希伯来词可专指卖淫，也可泛指不正当的性行为；在《何西阿书》中还常暗含对雅威不忠。
    reason: lexical_alternative
  - marker: b
    text: “增多”也可译作“繁衍”。希伯来文直译为“冲破”或“扩展”，这里很可能指后代或人口增加。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文十分简略，直译近似“他们离弃了雅威，以谨守”。这里“不再留心听从他”反映“离弃／停止”与不定式连用时“停止留意或遵从雅威”的自然理解。也有人认为原文省略了宾语，并理解为不再遵守他的教导；本译文不补出“律法”等具体宾语。
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: 他们会吃
  rationale: 连词连接的完成式处于先知宣告审判后果的语境中，汉语用“会”自然表达将临的结果。
- source_word: יִשְׂבָּעוּ
  choice: 不得饱足
  rationale: שׂבע 指吃饱、得到满足；“不得饱足”既自然，也保留审判中匮乏而不满足的意象。
- source_word: הִזְנוּ
  choice: 行淫
  rationale: זנה 可指卖淫或更广义的不正当性行为，在《何西阿书》中也常带有背约的隐喻色彩。“行淫”简洁地保留具体性行为与属灵不忠之间的张力。
- source_word: יִפְרֹצוּ
  choice: 增多
  rationale: פרץ 本义为冲破、扩展；在行淫之后却无结果的平行结构中，最可能指人口或后代不能增多。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: עָזְבוּ
  choice: 离弃了
  rationale: “离弃”准确传达 עזב 所表达的抛弃与背约意味，并符合先知谴责的庄重语气。
- source_word: לִשְׁמֹר
  choice: 不再谨守
  rationale: שמר 可指谨守、留意、遵行。原文不定式结构简短且宾语未明说；译文保留这种省略，不擅自补入“律法”“道路”或“淫乱”。
theological_decisions:
- issue: זנה 在本节是具体性行为还是属灵背约
  choice: 译作“行淫”，让字面上的性行为居于前景，同时保留其在《何西阿书》中可能含有的背约意味。
  alternative: 明确译作“卖淫”或“属灵淫乱”。
  rationale: “不能增多”的上下文支持与生育有关的具体含义，但全书语境又使其具有圣约不忠的共鸣；不应在正文中只锁定其中一层。
- issue: לִשְׁמֹר 的省略结构
  choice: 译作“不再谨守”，保留未明说宾语的简短表达。
  alternative: 补作“不再留心听从他”“不再谨守他的律法”，或从相邻语境补出“以淫乱为念”。
  rationale: 给出的希伯来文本止于 לִשְׁמֹר，没有明示宾语。补入“他”“律法”或“淫乱”都会替原文消除真实的句法含混，因此正文采用可独立成立但仍保留省略感的表达，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不得饱足”“离弃”“谨守”保留先知书的凝练语气，又避免过度古雅。脚注标记按正文出现顺序排列为[a]、[b]、[c]。
