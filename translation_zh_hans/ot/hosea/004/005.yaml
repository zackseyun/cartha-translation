  text: וְ/כָשַׁלְתָּ֣ הַ/יּ֔וֹם וְ/כָשַׁ֧ל גַּם נָבִ֛יא עִמְּ/ךָ֖ לָ֑יְלָה וְ/דָמִ֖יתִי אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/005.yaml
  text: You will stumble by day[a], and the prophet also will stumble with you by night[c][b]; and I will destroy your mother.
translation:
  language: zh_hans
  text: 你必在白昼跌倒，先知也必与你一同在夜间跌倒；我要毁灭[b]你的母亲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的母亲”很可能是比喻，指人民、国家或圣约群体。
    reason: cultural_note
  - marker: b
    text: “毁灭”或译“使沉寂”或“剪除”；原文动词在审判语境中可有这些相近含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשַׁלְתָּ
  choice: 你必……跌倒
  rationale: כשל在本节审判宣告中宜取将来意义；“跌倒”保留原文比喻，不扩大为彻底灭亡。
- source_word: הַיּוֹם
  choice: 在白昼
  rationale: 与后文לָיְלָה形成昼夜对照，因此不是“今天”。
- source_word: וְכָשַׁל
  choice: 也必……跌倒
  rationale: 与前一כשל保持一致，并按预告性的审判话语译作将来。
- source_word: גַּם נָבִיא
  choice: 先知也
  rationale: גַּם表示追加；希伯来语名词无冠词，汉语无需强行区分“一个”或“那个”，因而自然保留其指称弹性。
- source_word: עִמְּךָ
  choice: 与你一同
  rationale: 直接表达עם加第二人称阳性单数后缀的共同关系。
- source_word: לָיְלָה
  choice: 在夜间
  rationale: 与“在白昼”对应，保留昼夜平行结构。
- source_word: וְדָמִיתִי
  choice: 我要毁灭
  rationale: 在审判语境中，דמה可指使之灭亡或除灭；“毁灭”最符合威胁语气，但相关的“使沉寂、剪除”义保留于脚注。
- source_word: אִמֶּךָ
  choice: 你的母亲
  rationale: 按字面保留何西阿的母亲意象，不在正文中直接解释为民族、人民或圣约群体。
theological_decisions:
- issue: “你的母亲”的所指
  choice: 正文保留“你的母亲”这一比喻
  alternative: 明确译为以色列、人民、国家、母城或圣约群体
  rationale: 原文没有在本节内明说所指；保留亲属意象可避免消解何西阿书中的文学和神学张力。
- issue: 昼夜短语与两个跌倒分句的关系
  choice: 按马所拉重音和通常句法理解为“你在白昼……先知与你在夜间……”
  alternative: 把“白昼”与后面的“先知”连读，形成“今日连先知也与你一同跌倒”等理解
  rationale: 主译文呈现最自然的昼夜对举，同时不把其他可能的分句方式写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“白昼／夜间”保留诗句的对称；“跌倒”保留审判性隐喻。所有脚注标记均置于正文相应内容之后。
