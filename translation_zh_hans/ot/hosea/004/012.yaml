source:
  edition: WLC
  text: עַמִּ/י֙ בְּ/עֵצ֣/וֹ יִשְׁאָ֔ל וּ/מַקְל֖/וֹ יַגִּ֣יד ל֑/וֹ כִּ֣י ר֤וּחַ זְנוּנִים֙ הִתְעָ֔ה וַ/יִּזְנ֖וּ מִ/תַּ֥חַת אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/012.yaml
  text: My people consult their piece of wood[a], and their staff tells them; for a spirit of whoredom has led them astray, and they have played the whore[c][b], departing from under their God.
translation:
  language: zh_hans
  text: 我的子民向木头求问[a]，他们的杖向他们指示；因为淫乱之灵[b]使他们走迷，他们行淫，背离自己的上帝[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木头”也可译作“他们的木头”，或较解释性地译作“木制偶像”。原文为单数“他的木头”，与集合意义的“我的子民”相应，很可能指用于占卜的木制宗教物件。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“卖淫之灵”或“不忠之灵”。原文保留了明确的淫乱隐喻。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“从他们的上帝下面”，是指脱离他们本应归属并忠于的上帝。
    reason: idiom_clarification
lexical_decisions:
- source_word: עַמִּי
  choice: 我的子民
  rationale: 保留上帝对以色列的关系性、立约性称呼；现代汉语中“子民”庄重自然，也比“国民”更贴合语境。
- source_word: בְּעֵצוֹ
  choice: 求问木头
  rationale: 原文直译近于“求问他的木头”，所指很可能是用于占卜的木制宗教物件。“木头”保留原文具体而带讽刺意味的表达，不在正文中直接解释为偶像。
- source_word: יִשְׁאָל
  choice: 求问
  rationale: שׁאל 的基本义是询问；在占卜语境中，“求问”既自然，又能表达向某物寻求指引。
- source_word: וּמַקְלוֹ
  choice: 手中的杖
  rationale: מַקֵּל 可指杖或棍。这里与占卜有关，译作“杖”较合适；加入“手中的”自然表达其所属关系，同时避免生硬重复“他们的”。
- source_word: יַגִּיד לוֹ
  choice: 竟向他们传话
  rationale: נגד 的使役式表示告知、宣告。“传话”符合木杖提供神谕的语境；“竟”传达先知话语中对这种行为的反讽，但不改变命题内容。
- source_word: רוּחַ זְנוּנִים
  choice: 淫乱的灵
  rationale: 保留 זְנוּנִים 明确的性隐喻及其先知性冲击力，不淡化为抽象的“不忠”；“灵”也保留其可能指一种支配性倾向或属灵力量的歧义。
- source_word: הִתְעָה
  choice: 使他们走迷了
  rationale: תעה 的使役式兼有使人迷失、走入歧途之意。“走迷”保留行路意象，并表达偏离正道。
- source_word: וַיִּזְנוּ
  choice: 他们行淫
  rationale: 直保 זנה 的淫乱隐喻，不直接改译成“拜偶像”或“不忠”，从而保留何西阿书将宗教背叛描绘为淫乱的修辞张力。
- source_word: מִתַּחַת אֱלֹהֵיהֶם
  choice: 离开了自己上帝的权下
  rationale: 保留 מִתַּחַת“从……下面”的空间意象，同时以“权下”说明其涉及脱离上帝的权柄、归属和效忠关系。
theological_decisions:
- issue: 以淫乱比喻偶像崇拜和盟约背叛
  choice: 正文保留“淫乱的灵”和“行淫”
  alternative: 译作“不忠的倾向”“背弃上帝”或直接译作“拜偶像”
  rationale: 原文有意采用鲜明的性隐喻；弱化或改成解释性神学术语会损失何西阿先知话语的修辞力度。
- issue: “淫乱的灵”的所指
  choice: 保留“灵”的开放表达
  alternative: 明确解释为邪灵、淫乱欲望或不忠倾向
  rationale: רוּחַ 可指灵、风气、倾向或驱动力；上下文没有要求译文排除这些可能，因此不在正文中锁定某一种解释。
- issue: מִתַּחַת 所表达的关系
  choice: 译为“离开了自己上帝的权下”
  alternative: 仅译“离开自己的上帝”或按字面译“从他们上帝下面”
  rationale: “权下”既保留“在……之下”的意象，又让现代读者理解这是脱离上帝权柄和盟约归属；不将其扩展成特定宗派性的教义表述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留先知话语中“木头”“杖”的反讽，以及“淫乱”的尖锐盟约隐喻；对集合单数采用自然的汉语复数指代。
