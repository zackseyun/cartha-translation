  terminology: “我的子民”“上帝”以及“淫乱之灵／行淫”均适合庄重现代汉语，也保留了原文蓄意鲜明的性化盟约隐喻，不把它解释性地改成“偶像崇拜”或“不忠”。“淫乱之灵”可保留其究竟指属灵力量、风气或驱动力的开放性。
