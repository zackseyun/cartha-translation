  text: חַטַּ֥את עַמִּ֖/י יֹאכֵ֑לוּ וְ/אֶל עֲוֺנָ֖/ם יִשְׂא֥וּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/008.yaml
  text: They feed on the sin of my people[b][a], and they set their appetite on their iniquity.
translation:
  language: zh_hans
  text: 他们以我百姓的罪为食[a]，一心贪恋百姓的罪孽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们吃我百姓的赎罪祭。”希伯来语“罪”也可指“赎罪祭”。
    reason: alternative_reading
  - marker: b
    text: 直译近似：“他们向他们的罪孽举起他的心灵。”这个希伯来语习语表示渴望或贪求；但动词是复数，“他的心灵”却是单数，语法关系较难确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: 罪
  rationale: 该词既可指“罪”，也可指礼仪中的“赎罪祭”。本节下半句以“罪孽”平行，正文采用较广的道德含义“罪”，同时用脚注保留祭祀含义。
- source_word: יֹאכֵלוּ
  choice: 以……为食
  rationale: 原义是“吃”。译作“以……为食”既保留进食意象，也自然表达祭司从百姓犯罪中获利的控诉意味。
- source_word: עַמִּי
  choice: 我百姓
  rationale: 直接保留第一人称所属关系，符合现代中文圣经语体。
- source_word: עֲוֺנָם
  choice: 他们的罪孽
  rationale: עָוֹן可指罪孽、罪责或罪罚；这里与前半句的“罪”平行，道德意义最为贴切。
- source_word: יִשְׂאוּ נַפְשׁוֹ
  choice: 一心贪恋
  rationale: “举起生命/心向着……”在此表达强烈欲求。“一心贪恋”以自然中文传达这种趋向和欲望，同时由脚注保留原文异常的单数形式。
theological_decisions:
- issue: חַטַּאת在谴责腐败祭司的语境中应译为“罪”还是“赎罪祭”
  choice: 正文译作“罪”
  alternative: 也可译作“赎罪祭”
  rationale: 原文有意容许道德与祭祀两层理解：祭司可能实际吃祭物，也可能因百姓持续犯罪而获利。下半句的“罪孽”支持正文采用“罪”，但脚注保留“赎罪祭”，不消除原文的张力。
- issue: נַפְשׁוֹ的单数形式与复数主语之间的不协调
  choice: 正文按语境译作复数群体共同的欲望：“一心贪恋”
  alternative: 直译为“他们向他们的罪孽举起他的心/性命”
  rationale: 原文动词为复数，而“他的生命/心”带第三人称单数后缀，语法关系不寻常。正文传达习语意义，脚注则明确保留这一文本难点，不武断指定单数所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以……为食”保留原文的进食隐喻；“一心贪恋”自然表达强烈欲求。正文简洁，两个脚注分别保存“罪／赎罪祭”的词义歧义及末句的语法难点。
