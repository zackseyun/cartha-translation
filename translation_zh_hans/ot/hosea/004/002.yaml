base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/002.yaml
  text: Cursing[a], lying, murder, theft, and adultery break out[b]; bloodshed follows bloodshed.
translation:
  language: zh_hans
  text: 诅咒[a]、说谎、杀人、偷盗、通奸，不断爆发；一桩流血事件紧接一桩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诅咒”也可理解为“起假誓”或“违背誓言”；在这里的盟约控诉语境中，这几种含义都有可能。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“血接触血”，意思是流血杀人的事一桩接着一桩。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלֹה
  choice: 诅咒
  rationale: 该词在此可指发出咒诅，也可能涉及起假誓或违背誓言。“诅咒”简洁地保留其直接语义，其他可能性在脚注说明。
- source_word: כַחֵשׁ
  choice: 说谎
  rationale: 该词表示撒谎、虚假行事；“说谎”自然清楚，也适合罪恶清单的并列结构。
- source_word: רָצֹחַ
  choice: 杀人
  rationale: רצח通常指不法夺取人命。“杀人”在现代汉语中自然，并保留其道德谴责意味，而不泛化为所有致死行为。
- source_word: גָנֹב
  choice: 偷盗
  rationale: 准确表达窃取之意，并与清单中其他双音节或动宾式罪行名称协调。
- source_word: נָאֹף
  choice: 通奸
  rationale: 该词特指通奸，而不是泛指一切性方面的不道德行为。
- source_word: פָּרָצוּ
  choice: 四处横行
  rationale: 原词有冲破、迸发之意，在此概括上述罪行肆虐。“四处横行”以自然汉语表达其泛滥失控之势，同时不补出“界限”等原文没有明说的宾语。
- source_word: דָמִים
  choice: 血案
  rationale: 复数形式“血”在此指流血杀人的事件。“血案”具体而自然，适合表达接连发生的暴力杀戮。
- source_word: בְּדָמִים נָגָעוּ
  choice: 一桩血案紧接一桩血案
  rationale: 字面为“血触及血”，描绘流血事件彼此相接、接连不断；此译保留其连续叠加的意象和力度。
theological_decisions:
- issue: אָלֹה在盟约控诉语境中的含义
  choice: 正文译作“诅咒”
  alternative: 起假誓；违背誓言
  rationale: 该词既可直接指咒诅，也可能与誓言行为有关。正文不将其限定为某一种盟约违法行为，脚注保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。前半句保持紧凑的罪行清单节奏，后半句用重复结构再现希伯来文“血……血”的强烈效果。
