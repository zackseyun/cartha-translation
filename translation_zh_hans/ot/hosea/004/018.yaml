  text: סָ֖ר סָבְאָ֑/ם הַזְנֵ֣ה הִזְנ֔וּ אָהֲב֥וּ הֵב֛וּ קָל֖וֹן מָגִנֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/018.yaml
  text: When their drink is gone[a], they give themselves to prostitution[c][b]; her shields dearly love shame.
translation:
  language: zh_hans
  text: 他们的酒喝完了[a]，就一味行淫[b]；她的盾牌深深爱着羞耻[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的酒变酸了”，或“他们的醉意过去了”。希伯来文开头含义不确定，可能指酒宴结束，也可能指酒变坏了。
    reason: lexical_alternative
  - marker: b
    text: “一味行淫”原文以同一词根的两个形式连用，用来加强语气；这一意象也可指属灵上的不忠。
    reason: source_structure
  - marker: c
    text: “她的盾牌”可能比喻她的统治者或保护者。本句希伯来文十分艰涩；“深深爱着羞耻”也可较字面地理解为：“他们爱：‘给羞耻吧！’”
    reason: alternative_reading
lexical_decisions:
- source_word: סָר סָבְאָם
  choice: 他们的酒喝完了
  rationale: סָר 本义为“离开、转去”，与指酒饮或醉饮的 סָבְאָם 连用，开句含义不确定。“酒喝完了”在现代汉语中自然，并保留酒宴告一段落这一可能意思；其他可能见脚注。
- source_word: הַזְנֵה הִזְנוּ
  choice: 就一味行淫
  rationale: 不定式绝对式与限定动词连用，加强动作。“一味行淫”既体现强调语气，也保留何西阿书刻意使用的性不忠意象，而不将其抽象化为一般的“不忠”。
- source_word: אָהֲבוּ הֵבוּ
  choice: 深深爱着
  rationale: 这组词的希伯来文十分艰涩。אָהֲבוּ 是“爱”；הֵבוּ 形式上可解作“给吧”，也常被视为加强爱慕程度。正文采用可通顺理解的加强译法，并在脚注保留较字面的异读。
- source_word: קָלוֹן
  choice: 羞耻
  rationale: 该名词指羞耻、耻辱；“羞耻”直接、自然，并保持先知话语的道德力度。
- source_word: מָגִנֶּיהָ
  choice: 她的盾牌
  rationale: 直译为“她的盾牌”，在诗歌中可能借指统治者或保护者。正文保留原文比喻，脚注说明可能所指。
theological_decisions:
- issue: 是否把行淫意象淡化为一般性的宗教不忠
  choice: 正文保留“行淫”
  alternative: 译作“彻底不忠”或“背信弃义”
  rationale: 何西阿有意借性方面的不忠表现以色列的盟约不忠。保留具体意象，才能维持先知信息的冲击力与神学张力。
- issue: 是否在正文中将“她的盾牌”直接解释为统治者
  choice: 正文直译“她的盾牌”
  alternative: 译作“她的首领”或“她的保护者”
  rationale: “盾牌”很可能是统治者或保护者的比喻，但所指仍属解释。正文保留形象，脚注提供可能含义，避免过早消除歧义。
- issue: 如何处理 אָהֲבוּ הֵבוּ 的艰涩句法
  choice: 正文译作“深深爱着羞耻”
  alternative: 较字面地译作“他们爱：‘给羞耻吧！’”
  rationale: 原文措辞异常，无法完全确定 הֵבוּ 的功能。正文采用较可能且可读的加强理解，同时以脚注明确保留字面异读，不把不确定性隐藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一味行淫”保留先知性谴责及原文的加强形式；“她的盾牌”保留诗性比喻。所有实质性歧义均以脚注呈现。
