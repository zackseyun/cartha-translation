  text: אַ֥ךְ אִ֛ישׁ אַל יָרֵ֖ב וְ/אַל יוֹכַ֣ח אִ֑ישׁ וְ/עַמְּ/ךָ֖ כִּ/מְרִיבֵ֥י כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/004.yaml
  text: Yet let no man contend[a], and let no man reprove[b], for your people are like those who contend with a priest.
translation:
  language: zh_hans
  text: 然而，谁也不要争辩，谁也不要责备[a]；因为你的百姓如同与祭司争辩的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “责备”也可译作“纠正”或“驳斥”；原文动词可表示纠正、责斥或辩明是非。
    reason: lexical_alternative
  - marker: b
    text: 这个比喻可能使人联想到抗拒祭司裁断的严重性；参申命记17:12。
    reason: cross_reference
lexical_decisions:
- source_word: אַךְ
  choice: 然而
  rationale: 在这里表示强烈的转折或限制，承接上文的指控；“然而”既自然，也保留原文突转的语气。
- source_word: אִישׁ ... אִישׁ
  choice: 谁也……谁也
  rationale: 原文两次使用单数阳性名词，但在禁令中具有泛指作用；现代汉语用“谁也”自然地表达“任何人都不要”，并保留重复结构。
- source_word: אַל יָרֵב
  choice: 不要争辩
  rationale: ריב可指争执、争讼或提出控诉；“争辩”兼顾一般争执与准法律语气，又不把场景限定为正式诉讼。
- source_word: וְאַל יוֹכַח
  choice: 也不要责备
  rationale: יכח的使役形可指责备、纠正或辩明是非；“责备”在本句中自然，并保留道德纠正的意味。
- source_word: וְעַמְּךָ
  choice: 因为你的百姓
  rationale: 此处连接词按上下文可作解释或说明理由，译作“因为”能清楚呈现后半句对前面禁令的说明。
- source_word: כִּמְרִיבֵי
  choice: 如同……争辩的人
  rationale: כ表示比较，ריב的分词复数指以争辩为特征的人；重复“争辩”也保留它与前句同一词根的呼应。
- source_word: כֹהֵן
  choice: 祭司
  rationale: 该单数名词在此可作类指；汉语“与祭司争辩”无需添加量词，既可自然表达泛指，也不强行判定特指。
theological_decisions:
- issue: 末句“你的百姓如同与祭司争辩的人”的解释
  choice: 保留明喻，将百姓描写为抗拒纠正、竟与祭司争辩的人。
  alternative: 将其明确译成对申命记律法中抗拒祭司裁断之罪的特指。
  rationale: 希伯来文清楚表达比较，但究竟只是泛指悖逆，还是特意呼应祭司司法权威，并未完全明说；正文保留这种张力，脚注提供可能的律法背景。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前后两次使用“争辩”，以显出希伯来文同一词根的呼应；“谁也……谁也”保留原文重复的禁令节奏。
