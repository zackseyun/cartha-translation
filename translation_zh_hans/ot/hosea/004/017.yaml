  text: חֲב֧וּר עֲצַבִּ֛ים אֶפְרָ֖יִם הַֽנַּֽח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/017.yaml
  text: Ephraim is joined to idols[a]; leave him alone.
translation:
  language: zh_hans
  text: 以法莲与偶像相连[a]；任凭他吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以法莲与偶像相联；由他去吧。”希伯来文十分简短；末尾的命令可表示任凭以法莲继续陷于自己选择的偶像崇拜。
    reason: 说明“相连”也可译为“相联”，并保留末尾命令所表达的放任或弃置意味，避免把联结关系具体化为“缠住”。
lexical_decisions:
- source_word: חֲבוּר
  choice: 紧紧相连
  rationale: 该词是 חבר 的被动分词，表示被联结、结合或缚在一起。“紧紧相连”既保留其被动状态所体现的牢固关系，也符合现代汉语表达；“紧紧”传达这里关系难以拆解的语境意味，但不具体限定为盟约或捆绑。
- source_word: עֲצַבִּים
  choice: 偶像
  rationale: 该复数名词可指雕像或形像，但在先知谴责敬拜假神的语境中通常指“偶像”；此译法准确传达其宗教含义与贬斥色彩。
- source_word: אֶפְרָיִם
  choice: 以法莲
  rationale: 保留专名的音译。何西阿书中“以法莲”常可转喻北国以色列，但正文不作解释性扩展，以保留先知原有的拟人化表达。
- source_word: הַנַּח
  choice: 任凭……吧
  rationale: 这个使役命令式可表示让其保持现状、不再干预或放任。“任凭他吧”在现代汉语中自然、凝练，并能体现这句突兀命令中放手不管的意味。
- source_word: לוֹ
  choice: 他
  rationale: 该代词为第三人称阳性单数，回指被拟人化的“以法莲”。汉语用“他”保留这种人格化表达。
theological_decisions:
- issue: “以法莲”的所指
  choice: 正文保留“以法莲”这个专名，不扩译。
  alternative: 将其解释为北国以色列或以色列民。
  rationale: 此名在上下文中很可能代表北国，但原文仍以“以法莲”称呼并加以拟人化；保留专名可避免把合理的转喻解释直接写进正文。
- issue: 末尾命令的语气与对象
  choice: 译作“任凭他吧”，理解为命令未明说的听者不再干预以法莲。
  alternative: 可译作“不要管他”或“由他去吧”；也有人可能把命令理解为要求人与以法莲分开。
  rationale: 原文极其简短，命令的听者没有明说。“任凭他吧”保留放任、弃置或停止劝阻的语气，同时不过度界定是谁受命、具体停止何种行动。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。全句延续原文的短促语势；分号呈现陈述与命令之间的骤然转折。“任凭他吧”比“别管他”更适合经文体，也比“离开他”较少预先限定命令的具体行动。
