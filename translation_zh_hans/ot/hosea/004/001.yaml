id: HOS.4.1
reference: Hosea 4:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם יוֹשְׁבֵ֣י הָ/אָ֔רֶץ כִּ֠י אֵין אֱמֶ֧ת וְֽ/אֵין חֶ֛סֶד וְ/אֵֽין דַּ֥עַת אֱלֹהִ֖ים בָּ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/001.yaml
  text: Hear the word of Yahweh[a], sons of Israel, for Yahweh has a case against the inhabitants of the land, because there is no truth, no faithfulness[d][c][b], and no knowledge of God in the land.
translation:
  language: zh_hans
  text: 以色列人[a]哪，要听雅威的话！因为雅威要与这地[d]的居民争讼[b]；这地没有诚实，没有忠贞之爱[c]，也没有对上帝的认识。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的儿子们”，也可译作“以色列的子孙”。
    reason: lexical_alternative
  - marker: b
    text: “争讼”也可译作“提出控告”或“进行诉讼”；原文带有法律争端的意味。
    reason: lexical_alternative
  - marker: c
    text: “忠贞之爱”所译的希伯来词也可译作“坚定的爱”“忠诚”“慈爱”或“怜悯”。
    reason: lexical_alternative
  - marker: d
    text: “这地”很可能特指以色列地；原词也可较宽泛地译作“大地”或“地上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 复数命令式；“要听”保留先知宣告中的郑重召唤，也符合现代汉语表达。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留先知书常见的“雅威的话”这一公式，并将四字神名作为专名音译。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的儿子们”，在这里是对以色列民的整体称呼；正文采用自然、无歧义的现代汉语，直译信息收入脚注。
- source_word: רִיב
  choice: 争讼
  rationale: 该词在此具有法律或盟约诉讼色彩；“争讼”既保留司法语感，也没有把意象过度具体化为现代法庭程序。
- source_word: עִם יוֹשְׁבֵי הָאָרֶץ
  choice: 与这地的居民
  rationale: עִם 字面为“与”，在争讼语境中表示争讼的相对方；“居民”准确表达居住者。
- source_word: הָאָרֶץ / בָּאָרֶץ
  choice: 这地／这地上
  rationale: 上下文针对以色列及其所居之地；“这地”比“全地”或“世界”更能保留其地域和盟约背景，同时脚注说明可能译法。
- source_word: אֱמֶת
  choice: 诚实
  rationale: 该词兼有真实、可靠、信实等含义；在对社会伦理的指控中，“诚实”自然贴切，并与 חֶסֶד 略作区分。
- source_word: חֶסֶד
  choice: 忠贞之爱
  rationale: 该词包含坚定的爱、忠诚、恩慈和怜悯等重叠含义；“忠贞之爱”兼顾关系中的爱与持守，避免只译成情感或怜悯。
- source_word: דַּעַת אֱלֹהִים
  choice: 对上帝的认识
  rationale: 这里不仅指关于上帝的知识，也带有关系和行为层面的认识；名词结构保留原文三项并列的形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；正文以现代汉语常用音译“雅威”呈现其专名性质，不以称号“主”替代。
- issue: חֶסֶד 在控诉语境中的含义
  choice: 忠贞之爱
  alternative: 慈爱／忠诚／怜悯
  rationale: 此处既可能强调群体关系中的忠诚，也保有爱与恩慈的意味；正文不直接增添“盟约”一词，以免把语境推论写入词面，同时用脚注保留其他可能译法。
- issue: הָאָרֶץ 的范围
  choice: 这地
  alternative: 大地／地上
  rationale: 直接受话者是以色列，控诉也聚焦当地居民，因此很可能指以色列地；脚注保留较宽泛理解的可能。
- issue: דַּעַת אֱלֹהִים 的性质
  choice: 对上帝的认识
  alternative: 关于上帝的知识／承认上帝
  rationale: 原文可包含认知、关系与实践层面；“认识”保留这种张力，不将其缩减为资料知识或单一宗教表态。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“哪……要听”保留先知呼告的语势；“争讼”维持司法意象；三个“没有”构成整齐的控诉节奏。神名译作“雅威”，上帝的通称 אֱלֹהִים 译作“上帝”，以区分专名与称号。
