  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל כֵּ֣ן תֶּאֱבַ֣ל הָ/אָ֗רֶץ וְ/אֻמְלַל֙ כָּל יוֹשֵׁ֣ב בָּ֔/הּ בְּ/חַיַּ֥ת הַ/שָּׂדֶ֖ה וּ/בְ/ע֣וֹף הַ/שָּׁמָ֑יִם וְ/גַם דְּגֵ֥י הַ/יָּ֖ם יֵאָסֵֽפוּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/003.yaml
  text: Therefore the land mourns[a], and everyone who dwells in it languishes, along with the beasts of the field and the birds of the heavens[b]; even the fish of the sea are taken away.
translation:
  language: zh_hans
  text: 因此，这地[a]必哀哭；住在其中的一切居民，以及田野的走兽和天空的飞鸟，都必衰残；甚至海里的鱼也必被收去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这地”也可译为“大地”。希伯来语 אֶרֶץ 可指“地”或“大地”；这里的上下文是对以色列的审判，所以正文译作“这地”。
    reason: alternative_reading
  - marker: b
    text: “被收去”也可译作“被除去”；更直译为“被聚集”。在这里的审判语境中，意思是连海里的鱼也要消失。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱבַל
  choice: 必悲哀
  rationale: 该动词通常表示哀恸、悲哀。以“地”为主语时形成拟人表达，应予保留，不宜直接化约为“干旱”或“枯萎”。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: אֶרֶץ既可指“地、土地”，也可指“大地”。何西阿书此处针对以色列施行审判，“这地”最符合近处语境，同时保留先知话语的指向性。
- source_word: וְאֻמְלַל
  choice: 都必衰败
  rationale: 该形式表达衰弱、凋残或失去生机。“衰败”既可用于人，也能涵盖一同受灾的动物，且不把意象局限为植物枯萎。
- source_word: כָּל־יוֹשֵׁב בָּהּ
  choice: 其中所有居民
  rationale: 单数分词与כָּל连用具有集合意义。“所有居民”自然表达全面范围，并以“其中”对应בָּהּ。
- source_word: בְּחַיַּת הַשָּׂדֶה
  choice: 连同田野的走兽
  rationale: 介词表明这些动物与地上居民同受灾害。“田野的走兽”保留原文类别和较庄重的圣经语体。
- source_word: וּבְעוֹף הַשָּׁמָיִם
  choice: 和天空的飞鸟
  rationale: 直译核心意象；现代汉语中“天空的飞鸟”比“诸天的飞鸟”自然，同时准确传达שָּׁמַיִם在此所指的空中领域。
- source_word: וְגַם
  choice: 甚至
  rationale: 该组合在此推进并强化审判范围；“甚至”呈现从陆兽、飞鸟到海鱼的高潮。
- source_word: דְּגֵי הַיָּם
  choice: 海里的鱼
  rationale: 直接表达其通常词义，并保存陆地动物、空中飞鸟和海中鱼类的完整次序。
- source_word: יֵאָסֵפוּ
  choice: 必被收去
  rationale: אסף的尼法勒式可表示“被聚集”或“被除去、收去”。在审判语境中，“被收去”既传达消失和除去，也避免明确断言其具体方式。
theological_decisions:
- issue: הָאָרֶץ的范围
  choice: 这地
  alternative: 大地
  rationale: 本节处于针对以色列的审判宣告中，因此更可能指以色列所在之地，而非明确指全世界；脚注保留该词可有的更广泛读法。
- issue: יֵאָסֵפוּ所表达的结局
  choice: 必被收去
  alternative: 必被聚集／必被除灭
  rationale: 原词本身可表达聚集，也可在此语境中表示被带走或除去。“收去”保留词义张力，不把经文明确化为某一种死亡机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必”体现未完成式在先知审判宣告中的将来指向；用分号呈现原文由土地、居民与陆空生物，再推进到海鱼的层次。保留“这地悲哀”的拟人表达，并把词义上的真实歧义放入脚注。
