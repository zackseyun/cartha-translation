id: HOS.4.6
reference: Hosea 4:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נִדְמ֥וּ עַמִּ֖/י מִ/בְּלִ֣י הַ/דָּ֑עַת כִּֽי אַתָּ֞ה הַ/דַּ֣עַת מָאַ֗סְתָּ וְ/אֶמְאָֽסְא/ךָ֙ מִ/כַּהֵ֣ן לִ֔/י וַ/תִּשְׁכַּח֙ תּוֹרַ֣ת אֱלֹהֶ֔י/ךָ אֶשְׁכַּ֥ח בָּנֶ֖י/ךָ גַּם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/006.yaml
  text: My people are destroyed for lack of knowledge[a]. Because you have rejected knowledge, I also reject you from being priest to me. Since you have forgotten the law of your God[c][b], I also will forget your children.
translation:
  language: zh_hans
  text: 我的子民因缺乏认识而灭亡[a]。因为你弃绝了认识，我也要弃绝你，不让你作我的祭司。你既忘记了你上帝的律法[b]，我也要忘记你的儿女[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灭亡”也可译作“消亡”、“被剪除”或“归于沉寂”。
    reason: lexical_alternative
  - marker: b
    text: “律法”所译的希伯来语 תורה（托拉）也可指“教导”。
    reason: lexical_alternative
  - marker: c
    text: “儿女”也可译作“儿子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמוּ
  choice: 灭亡
  rationale: 此处 דמה 的尼法勒形结合审判语境，主要表示遭毁灭、归于灭亡；“灭亡”自然凝练，也保留其结果性宣告。
- source_word: מִבְּלִי הַדָּעַת
  choice: 因缺乏认识
  rationale: מִבְּלִי 表示缺失或没有；“因缺乏认识”既传达原因，也符合现代汉语。
- source_word: הַדָּעַת / הַדַּעַת
  choice: 认识
  rationale: 在何西阿书中，这个词不只是知识信息，也带有对上帝及其约要求的关系性、道德性认识；译作“认识”可保留这种幅度，又不把原文扩写成“认识上帝”。
- source_word: מָאַסְתָּ / וְאֶמְאָסְאֲךָ
  choice: 弃绝了／也要弃绝你
  rationale: מאס 表示拒绝、厌弃；前后采用同一译词，保留上帝回应性审判的修辞对称。
- source_word: מִכַּהֵן לִי
  choice: 不让你作我的祭司
  rationale: כהן 在此为动词，表示担任或履行祭司职分，מִן 表示从该职分中排除；此译自然地表达“不再获准担任我的祭司”，同时避免增添具体事奉方式。
- source_word: וַתִּשְׁכַּח / אֶשְׁכַּח
  choice: 忘记了／也要忘记
  rationale: 重复“忘记”以保存原文针锋相对的审判结构，不将其解释性改译为“忽视”。
- source_word: תּוֹרַת אֱלֹהֶיךָ
  choice: 你上帝的律法
  rationale: תורה 可指律法，也可泛指教导；正文采用读者熟悉且具有圣约分量的“律法”，脚注保留“教导”这一较宽含义。
- source_word: בָּנֶיךָ
  choice: 你的儿女
  rationale: בנים 虽为阳性复数，却可统指后代；“儿女”在此自然表达整体后裔，同时以脚注保留较窄的“儿子”读法。
theological_decisions:
- issue: “认识”在何西阿圣约诉讼中的含义
  choice: 正文只译“认识”
  alternative: “对上帝的认识”
  rationale: 上下文赋予该词圣约和宗教伦理内涵，但本节希伯来文此处没有明说“上帝”；不扩写可保存原文的简洁与含义张力。
- issue: 第二人称单数的指向
  choice: 保留单数“你”，并按祭司身份翻译
  alternative: 理解为泛指整个以色列的集合单数
  rationale: “作我的祭司”强烈暗示受话者是祭司或祭司群体的代表；译文不进一步锁定某位个人或整个阶层。
- issue: בָּנֶיךָ 的性别和范围
  choice: 你的儿女
  alternative: 你的儿子
  rationale: 希伯来语阳性复数可泛指子女或后代；正文采用较可能的包容性所指，脚注保留形式上较窄的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“认识—弃绝—忘记”的词语重复保留原文的控诉与对应审判；用“上帝”指 אֱלֹהִים。脚注标记均紧随相关词语，次序按正文出现排列。
