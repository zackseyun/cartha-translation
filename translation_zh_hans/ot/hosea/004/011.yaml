  text: זְנ֛וּת וְ/יַ֥יִן וְ/תִיר֖וֹשׁ יִֽקַּֽח לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/011.yaml
  text: Sexual immorality[a], wine, and new wine take away the heart.
translation:
  language: zh_hans
  text: 淫乱、酒和新酒，夺去人的心[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使人失去心智”或“使人丧失判断力”；希伯来文直译为“夺去心”。
    reason: 说明“心”的希伯来语惯用含义，并保留解释性译法。
lexical_decisions:
- source_word: זְנוּת
  choice: 淫乱
  rationale: 该词泛指不正当的性行为，在《何西阿书》中也常带有卖淫或背约不忠的意味。“淫乱”是现代汉语中简洁、庄重且范围较宽的表达，保留其道德力度，而不把含义局限为狭义的卖淫。
- source_word: יַיִן
  choice: 酒
  rationale: 这是葡萄酒的一般称谓；本节没有理由作特殊处理。
- source_word: תִירוֹשׁ
  choice: 新酒
  rationale: 通常指新出产或新酿的酒，与前面的 יַיִן 有意区分；“新酒”保留了原文的词汇区别。
- source_word: יִקַּח
  choice: 夺去
  rationale: 该动词基本义为“拿、取”；与“心”连用时表达内在判断力或心智被夺走。“夺去”既贴近原文意象，也能自然传达其有害作用。
- source_word: לֵב
  choice: 人的心
  rationale: 希伯来语“心”涵盖思想、判断、意志和内在倾向，不只指情感。正文保留“心”的具体意象，并补出汉语所需的泛指“人的”；其语境含义在脚注说明。
theological_decisions:
- issue: 末尾短语应直译为“夺去人的心”，还是解释为“使人失去心智/判断力”
  choice: 正文保留“夺去人的心”
  alternative: 使人失去心智；使人丧失判断力
  rationale: 本节使用具体而含义丰富的希伯来语人体意象，并未作技术性的教义陈述。保留“心”可呈现原文对人的思想、意志和内在生命的整体认识，同时借脚注交代其可能侧重心智或判断力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“淫乱、酒和新酒”的并列结构贴近原文，句末“夺去人的心”保留先知话语简短有力的节奏和原文的含混张力。
