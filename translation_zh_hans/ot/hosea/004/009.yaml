base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/009.yaml
  text: 'And it will be: like people[a], like priest. And I will punish him for his ways[b], and repay him for his deeds.'
translation:
  language: zh_hans
  text: 将来必是：民怎样，祭司也怎样[a]。我必按他的行径惩罚他，照他的作为报应他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“民如何，祭司也如何”。希伯来文是一个简短的比较句，意思是祭司和民同样要面对审判。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文这里使用单数代词“他／他的”；这可能是对群体中各人的分配性说法，也可能把焦点收窄到祭司。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: （不另行直译，以“民怎样，祭司也怎样”直接表达所形成的情形）
  rationale: 这里的“וְהָיָה”引出随后的结果或情形。若机械译为“事情将是”，现代汉语较生硬；直接进入判断句，既自然，也保留其预告性质。
- source_word: כָעָם כַּכֹּהֵן
  choice: 民怎样，祭司也怎样
  rationale: 希伯来文是简短的对比等同句，表示民与祭司同样面对审判。采用汉语对应的格言式结构，保留简洁和对称。
- source_word: וּפָקַדְתִּי עָלָיו
  choice: 我必因他的所行惩罚他
  rationale: פקד与עַל连用，在审判语境中表示追究、惩罚；“惩罚”清楚传达司法含义。介词所引出的依据与דְּרָכָיו结合译出。
- source_word: דְּרָכָיו
  choice: 他的所行
  rationale: דֶּרֶךְ在道德语境中指一个人的行径或生活方式。“所行”自然、庄重，并能表达行为层面的含义。
- source_word: וּמַעֲלָלָיו
  choice: 他的作为
  rationale: מַעֲלָלִים指带有道德评价色彩的行为或 deeds；“作为”简洁并符合先知审判语体。
- source_word: אָשִׁיב לוֹ
  choice: 报应他
  rationale: 使役形态的שוב加ל在司法语境中可表示按人的行为施行回报。“报应他”在现代汉语中明确表达应得的惩治。
theological_decisions:
- issue: 审判分句中单数代词的指向和数
  choice: 保留单数形式“他／他的”
  alternative: 改为复数“他们／他们的”，或明确专指祭司
  rationale: 希伯来文在“民—祭司”的集合性比较之后使用单数后缀。保留单数可容许其作分配性或群体性理解，也不排除焦点转向祭司，避免过早消解原文的含混和张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“民怎样，祭司也怎样”保留原文格言式的简洁对称；审判分句保留单数代词，并以脚注说明其真实歧义。
