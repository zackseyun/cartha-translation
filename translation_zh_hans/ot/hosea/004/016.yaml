  text: כִּ֚י כְּ/פָרָ֣ה סֹֽרֵרָ֔ה סָרַ֖ר יִשְׂרָאֵ֑ל עַתָּה֙ יִרְעֵ֣/ם יְהוָ֔ה כְּ/כֶ֖בֶשׂ בַּ/מֶּרְחָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/016.yaml
  text: For Israel is as stubborn as a stubborn heifer[a]; now Yahweh will pasture them like a lamb in a broad place.
translation:
  language: zh_hans
  text: 因为以色列倔强，像一头倔强的母牛；如今，耶和华要像牧放在宽阔之地的一只羊羔那样牧放他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在宽阔之地”也可译作“在开阔之处”或“在宽广之地”。这个希伯来语意象既可能指开阔的牧场，也可能指在审判中毫无遮蔽、容易受害的处境。
    reason: 说明“宽阔之地”的词义选择，并保留末句可能兼有牧养与审判意味的歧义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的指控或审判说明缘由；“因为”在现代汉语中自然保留这一解释性连接。
- source_word: כְּפָרָה
  choice: 像一头……母牛
  rationale: פָרָה 指母牛；量词“一头”和“母牛”准确保留具体的农牧意象。
- source_word: סֹרֵרָה / סָרַר
  choice: 倔强，像一头倔强的母牛
  rationale: 原文以同一词根重复强调顽梗抗拒；中文重复“倔强”既自然，也保留修辞力度。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文圣经语境中的标准专名译法。
- source_word: עַתָּה
  choice: 如今
  rationale: 标示由以色列的倔强而来的当前后果；“如今”庄重而自然。
- source_word: יִרְעֵם
  choice: 要牧放他们
  rationale: רעה 可指牧养、放牧或喂养；“牧放”保留牲畜意象，同时不把语气限定为温柔照料，因为上下文也可能含反讽或审判意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文中对四字神名的通行音译，保留其作为专名而非一般称号的功能。
- source_word: כְּכֶבֶשׂ
  choice: 像牧放一只羊羔
  rationale: כֶּבֶשׂ 通常指羊羔或幼羊；“羊羔”保留单数和可能蕴含的脆弱形象。为使中文句法清楚，依照前面的牧放动词补出“牧放”。
- source_word: בַּמֶּרְחָב
  choice: 在宽阔之地
  rationale: מֶרְחָב 是宽广、开阔的地方；此译保留空间意象，不预先判定它象征丰足自由还是审判中的暴露与失控。
theological_decisions:
- issue: 末句的语气与意象
  choice: 译为陈述句，并保留“牧放”与“宽阔之地”的双重可能性。
  alternative: 可理解为反问：“如今耶和华还能牧放他们，像羊羔在宽阔之地吗？”也可把末句明确解释为安然牧养或暴露于审判。
  rationale: 马所拉文本本身没有明确疑问标记，直陈译法最少增添解释；同时，“羊羔在宽阔之地”既可能让人想到开阔牧场，也可能暗示孤立、暴露或被放散，因此正文不消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“倔强……倔强”有意保留原文同根词的重复；“牧放”维持全节一致的牲畜意象。脚注标记置于其实际说明的末句意象之后。
