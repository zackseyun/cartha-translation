base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/006.yaml
  text: I will be like the dew to Israel[a]; he will blossom like the lily[b], and he will strike his roots like Lebanon.
translation:
  language: zh_hans
  text: 我必作以色列的甘露；他[a]必如百合花开放，并像黎巴嫩一样扎下根来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用阳性单数形式指作为一个整体的以色列，因此这里用“他”；也可按集合意义理解为以色列民。
    reason: 说明集合单数及代词选择，保留原文的人格化表达。
  - marker: b
    text: 黎巴嫩令人联想到当地根深、坚固而宏伟的树木；原文没有明确说“香柏树”。
    reason: 交代文化意象，并防止把解释性的树种加入正文。
lexical_decisions:
- source_word: אֶהְיֶה
  choice: 我必
  rationale: 这是动词“是、成为”的第一人称单数未完成式；在应许语境中采用将来含义。“我必……如”在现代汉语诗体中自然地表达“我必成为如同”。
- source_word: כַטַּל
  choice: 如甘露
  rationale: 保留כ的比喻功能及露水滋养、赐予生机的农业意象；“甘露”符合庄重而通顺的现代汉语表达。
- source_word: לְיִשְׂרָאֵל
  choice: 向以色列
  rationale: ל表示关系或受益方向；“向以色列如甘露”保留神对以色列施惠的方向性。
- source_word: יִפְרַח
  choice: 他必……开放
  rationale: 该动词为阳性单数，与作为集合单数的“以色列”呼应；“开放”紧接花的比喻，比笼统的“兴旺”更贴近原文意象。
- source_word: כַשּׁוֹשַׁנָּה
  choice: 如百合花
  rationale: 保留花卉比喻。שׁוֹשַׁנָּה通常译作“百合花”，虽其具体植物种类未必能够确定。
- source_word: וְיַךְ שָׁרָשָׁיו
  choice: 扎下根来
  rationale: נכה的使役式与“他的根”构成使根深入、稳固的表达。汉语“扎下根来”自然传达这一动态，同时“他”已明确保留集合单数的人称呈现。
- source_word: כַלְּבָנוֹן
  choice: 像黎巴嫩一样
  rationale: 原文只说“像黎巴嫩”，没有明说香柏树；正文保留地名及其稳固、宏伟的联想，不加添具体树种。
theological_decisions:
- issue: 以色列作为集合单数时，后续阳性单数形式如何表达
  choice: 用“他”承接“以色列”
  alternative: 按集合意义译成“他们”，或用无性别代词“它”
  rationale: 原文以阳性单数动词和第三人称阳性单数后缀呈现以色列。中文用“他”可保留以色列被人格化为单一整体的诗歌形象；脚注说明这种语法现象，以免误解为某个个体。
- issue: “像黎巴嫩”的具体意象
  choice: 正文保留“像黎巴嫩一样”
  alternative: 解释性地译为“像黎巴嫩的香柏树一样”
  rationale: 黎巴嫩可能使读者联想到当地高大、根基稳固的名木，但希伯来文没有出现“香柏树”；不应在正文中把联想变成明说内容。
- issue: שׁוֹשַׁנָּה所指的花卉
  choice: 采用传统且可理解的“百合花”
  alternative: 译作较宽泛的“花朵”，或指定为莲花等其他植物
  rationale: 该词常指百合类花卉，但精确植物学鉴定存在不确定性；正文采用常规译名，不据此发展额外象征解释。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。“如甘露”“如百合花”保留紧凑的平行意象；“扎下根来”比逐字译作“击打他的根”自然，又传达使根深入稳固的使役含义。所有脚注标记均置于正文相应位置。
