id: HOS.14.10
reference: Hosea 14:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ֤י חָכָם֙ וְ/יָ֣בֵֽן אֵ֔לֶּה נָב֖וֹן וְ/יֵֽדָעֵ֑/ם כִּֽי יְשָׁרִ֞ים דַּרְכֵ֣י יְהוָ֗ה וְ/צַדִּקִים֙ יֵ֣לְכוּ בָ֔/ם וּ/פֹשְׁעִ֖ים יִכָּ֥שְׁלוּ בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/010.yaml
  text: Who is wise? Let him understand these things[a]. Who is discerning? Let him know them. For the ways of Yahweh are straight, and the righteous walk in them[b], but transgressors stumble in them.
translation:
  language: zh_hans
  text: 谁有智慧？愿他明白这些事。谁有悟性？愿他认识这一切。因为雅威的道路正直[a]；义人行走在其中，悖逆的人[b]却在其中跌倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正直”或可译作“平直”或“正确”。
    reason: lexical_alternative
  - marker: b
    text: “悖逆的人”或可译作“过犯者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי חָכָם
  choice: 谁有智慧？
  rationale: 保留原文的反问形式，不改写为泛指条件句；“智慧”自然承接本书结尾的智慧劝诫。
- source_word: וְיָבֵן אֵלֶּה
  choice: 愿他明白这些事
  rationale: 未完成式在这里具有劝勉意味；“这些事”指向何西阿书的信息整体，又不把所指限定得过窄。
- source_word: נָבוֹן
  choice: 有悟性
  rationale: 与“有智慧”形成平行，同时避免同后面的“明白”完全重复；表达能辨识、领悟的能力。
- source_word: וְיֵדָעֵם
  choice: 愿他认识这一切
  rationale: ידע在此保留较宽泛的“认识、知道”义；“这一切”自然回指前述诸事。
- source_word: יְשָׁרִים
  choice: 正直
  rationale: 既表达道德上的正确，也能与“道路、行走、跌倒”的路径意象相连；不将其缩减为纯粹的空间描述。
- source_word: דַּרְכֵי יְהוָה
  choice: 雅威的道路
  rationale: “道路”保留全节的核心比喻；“雅威”音译神圣四字名，表明这里是专名而非称号。
- source_word: וְצַדִּיקִים יֵלְכוּ בָם
  choice: 义人行走在其中
  rationale: 保留“行走在道路中”的比喻，指义人在雅威的道路中生活行事。
- source_word: וּפֹשְׁעִים
  choice: 悖逆的人
  rationale: פשׁע强调背叛、违抗；“悖逆的人”比一般的“犯罪的人”更能体现这种关系性的反叛意味。
- source_word: יִכָּשְׁלוּ בָם
  choice: 却在其中跌倒
  rationale: 保留与道路、行走相呼应的具体意象；“却”清楚呈现义人与悖逆者之间的对比。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用神的专名；采用“雅威”音译，避免用称号替代专名。
- issue: “雅威的道路正直”的含义
  choice: 保留道德判断与道路意象的双重含义
  alternative: 道路笔直／道路正确
  rationale: יְשָׁרִים既可表达平直，也可表达正当；“正直”不把经文仅解释为空间比喻或抽象伦理命题。
- issue: 义人与悖逆者面对同一道路的不同结果
  choice: 两者都以“在其中”对应同一组道路
  alternative: 将后半句解释为因道路而跌倒
  rationale: בָם可表示“在其中”，也可能带有“因它们”的意味。正文保留平行的道路意象，不额外断定雅威的道路是悖逆者跌倒的直接原因。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。开头两个短问句保留希伯来文智慧文学式的修辞节奏；“道路—行走—跌倒”的贯穿意象尽量原样保存。脚注标记置于其实际说明的词语之后。
