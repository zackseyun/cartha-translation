base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/009.yaml
  text: Ephraim—what have I to do anymore with idols? I have answered him and will look after him[a]. I am like a flourishing cypress[c][b]; from me your fruit is found.
translation:
  language: zh_hans
  text: 以法莲啊，我与偶像还有什么关系呢？我已经回应他，也必看顾他[a]。我如同一棵青翠茂盛的柏树[b]；你的果实是从我而得的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头也可理解为以法莲的宣认：“以法莲说：‘我与偶像还有什么关系呢？’”希伯来文没有明示说话者转换。另，“看顾他”也可译作“注视他”或“留意他”。
    reason: alternative_reading_and_lexical_alternative
  - marker: b
    text: “柏树”所译的希伯来词也可能指冷杉或圆柏一类的常青树。
    reason: lexical_alternative
  - marker: c
    text: 或译：“你的果实是从我而来的”；较字面的译法是：“从我，你的果实被找到。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי עוֹד לָעֲצַבִּים
  choice: 我与偶像还有什么关系呢？
  rationale: “מַה לִּי”是表示撇清关系的习语，“עוֹד”有“还、再”的意思；此译自然表达“我与……还有什么相干”，同时没有在正文中强行消除说话者的歧义。
- source_word: עָנִיתִי
  choice: 我已经回应他
  rationale: 此处ענה意为“回答、回应”，完成式译作“已经回应”，体现已发生并具有当前效力的行动。
- source_word: וַאֲשׁוּרֶנּוּ
  choice: 也必看顾他
  rationale: 该词可指“看、注视、留意”；“看顾”在现代汉语中自然地传达关注与照料，但不把含义限定为单纯保护，其他可能译法列入脚注。
- source_word: כִּבְרוֹשׁ רַעֲנָן
  choice: 如同一棵青翠茂盛的柏树
  rationale: בְּרוֹשׁ所指树种并不完全确定，传统常译“柏树”；רַעֲנָן表示青翠、繁茂而有生机。“青翠茂盛”保留两个语义侧面。
- source_word: מִמֶּנִּי פֶּרְיְךָ נִמְצָא
  choice: 你的果实是从我而得的
  rationale: נמצא是מצא的尼法勒式，字面为“被找到”，此处“从我而得”既保留被动结果意味，也以自然汉语凸显果实源自上帝。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 采用现代简体中文圣经人名的通行音译；此处以人格化方式指北国百姓。
- source_word: עֲצַבִּים
  choice: 偶像
  rationale: 先知书语境中指供人敬拜的神像或偶像；“偶像”是清楚、自然且带有原文贬抑意味的现代对应词。
theological_decisions:
- issue: 开头一句的说话者身份
  choice: 正文将“以法莲啊，我与偶像还有什么关系呢？”连入耶和华随后的第一人称话语。
  alternative: 也可理解为以法莲的悔改宣认：“以法莲说：‘我与偶像还有什么关系呢？’”
  rationale: 希伯来文没有显明的引语标记，语法上两种理解皆有依据；邻近的“我已经回应”“我如同”“从我”支持将正文读作上帝的话，但脚注保留以法莲发言的可能，以免消除真实的释义张力。
- issue: 上帝与结果子的关系
  choice: 译为“你的果实是从我而得的”，将上帝呈现为以法莲果实的来源。
  alternative: “你的果实是从我而来的”或较字面的“从我，你的果实被找到”。
  rationale: 此译遵循מִמֶּנִּי的来源意义与נמצא的结果意味，不进一步界定“果实”是物质福分、道德更新还是属灵成果，从而保留经文本身的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我与……还有什么关系”传达希伯来习语的断绝意味；“看顾”自然但不过度解释；“青翠茂盛的柏树”保留诗歌意象。脚注标记均置于相关正文之后，并按[a]、[b]、[c]顺序排列。
