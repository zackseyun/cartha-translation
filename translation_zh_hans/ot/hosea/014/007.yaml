base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/007.yaml
  text: Its shoots will spread out[a], and its splendor will be like the olive tree[b], and its fragrance like Lebanon.
translation:
  language: zh_hans
  text: 它的嫩枝必伸展开来[a]；它的荣美必如橄榄树[b]，它的芬芳必如黎巴嫩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它的枝条必向外长出”，或“它的幼芽必伸展”。希伯来语动词直译为“走”，在这里表示枝条向外延伸。
    reason: lexical_alternative
  - marker: b
    text: “荣美”也可译作“华美”、“威荣”或“光彩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: 必伸展开来
  rationale: 该动词本义为“走、去”，但以“嫩枝”为主语时，表示枝条向外延伸。“伸展开来”自然保留植物生长的意象。
- source_word: יֹנְקוֹתָיו
  choice: 它的嫩枝
  rationale: 此词指从植物长出的新枝或幼芽。“嫩枝”既体现其新生、吸取养分的特点，也符合现代汉语的植物意象。
- source_word: וִיהִי
  choice: 必如
  rationale: 该形式在这里承接前文对复兴景象的将来描述；用“必”表达预告和确定性，比祈愿式译法更合上下文。
- source_word: כַזַּיִת
  choice: 如橄榄树
  rationale: 保留原文的直接明喻和树木意象；现代汉语中“橄榄树”比单说“橄榄”更明确。
- source_word: הוֹדוֹ
  choice: 它的荣美
  rationale: הוֹד 可指威荣、华美或光彩。“荣美”兼顾尊荣与可见之美，适合此处橄榄树繁茂美观的诗性比较。
- source_word: וְרֵיחַ לוֹ
  choice: 它的芬芳
  rationale: 原文直译近于“它有香气”。“它的芬芳”是自然的汉语领属表达，并传达正面、诗意的香气。
- source_word: כַלְּבָנוֹן
  choice: 如黎巴嫩
  rationale: 保留地名及其森林、草木香气所唤起的意象，不把原文未明说的具体树种加入正文。
theological_decisions:
- issue: 第三人称阳性单数后缀的所指
  choice: 译作“它的”，指在植物比喻中得到复兴的以色列／以法莲。
  alternative: 机械地按语法性别译作“他的”。
  rationale: 希伯来语后缀虽为阳性单数，但上下文把复兴的群体描绘成繁茂的植物。现代汉语用“它”可维持这一延展比喻，并避免让读者误以为所指是某个男性个人。
- issue: וִיהִי 的语气
  choice: 作为预告复兴的将来陈述，译为“必如”。
  alternative: 译作祈愿式“愿……如”。
  rationale: 该形式虽可能带有祈使／愿望色彩，但在本段连续的复兴应许中，更自然地承接将来景象。正文采用陈述式，同时不额外加入因果或教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留希伯来诗歌的三段植物意象和并列节奏。以分号区分嫩枝伸展与后续两项比较；三个“必”使复兴预告清楚连贯。正文中的[a]、[b]与脚注逐一对应。
