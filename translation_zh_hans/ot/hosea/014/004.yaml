  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַשּׁ֣וּר לֹ֣א יוֹשִׁיעֵ֗/נוּ עַל סוּס֙ לֹ֣א נִרְכָּ֔ב וְ/לֹא נֹ֥אמַר ע֛וֹד אֱלֹהֵ֖י/נוּ לְ/מַעֲשֵׂ֣ה יָדֵ֑י/נוּ אֲשֶׁר בְּ/ךָ֖ יְרֻחַ֥ם יָתֽוֹם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/004.yaml
  text: Assyria will not save us[a]; we will not ride on horses, and we will no longer say, ‘Our God,’ to the work of our hands[b]. In you the fatherless finds mercy.
translation:
  language: zh_hans
  text: 亚述必不拯救我们；我们不骑马，也不再对自己亲手所做的说：“你是我们的神。”在你那里，孤儿[a]蒙怜悯。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文常指失去父亲、缺少父亲保护的人，也可泛指无依无靠的弱势者。
    reason: lexical_alternative
  - marker: b
    text: 末句也可理解为：“因为在你那里，孤儿蒙怜悯。”
    reason: alternative_reading
lexical_decisions:
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 这是国家名称的现代汉语标准译名；本句宣告不再倚靠外邦强权。
- source_word: לֹא יוֹשִׁיעֵנוּ
  choice: 不会拯救我们
  rationale: ישׁע的使役形表示“拯救、解救”；“不会拯救我们”保留将来或意愿层面的陈述，避免用“不能”过度强调能力上的绝对不可能。
- source_word: עַל סוּס לֹא נִרְכָּב
  choice: 我们不再骑战马
  rationale: 原文的“马”在此具有集合意义，并在语境中象征军事力量；“战马”使现代读者自然理解其军事含义。“不再”也符合整段悔改与弃绝旧有倚靠的语气。
- source_word: וְלֹא נֹאמַר עוֹד
  choice: 也不再……称为
  rationale: עוֹד与否定词连用表示从今以后停止某种行为；“不再”是自然、准确的现代汉语表达。
- source_word: אֱלֹהֵינוּ
  choice: “我们的神”
  rationale: 虽然אֱלֹהִים在形式上是复数，但这里是对偶像所用的称谓；译作单数“我们的神”符合句法和语境，并以引号标出所说的话。
- source_word: לְמַעֲשֵׂה יָדֵינוּ
  choice: 把自己亲手所造的
  rationale: 这是指人手制造的偶像。“自己亲手所造的”在现代汉语中自然，也保留了原文对人造之物的强调。
- source_word: יְרֻחַם
  choice: 蒙怜悯
  rationale: רחם的Pual形表示被施以怜悯或慈爱；“蒙怜悯”简洁地保留被动意义和庄重的认信语气。
- source_word: יָתוֹם
  choice: 孤儿
  rationale: 该词本义为失去父亲、缺少父亲保护的人，常指社会中的弱势者；“孤儿”是现代汉语中最自然的对应词，同时通过脚注说明其较具体的字面范围。
theological_decisions:
- issue: 末句是否明确译为因果关系
  choice: 正文独立译作“在你那里，孤儿蒙怜悯”
  alternative: “因为在你那里，孤儿蒙怜悯”
  rationale: אֲשֶׁר在这里可以具有解释或因果作用，但其衔接并非只能这样理解。正文不添加明确连词，以保存诗句的凝练和原文关系上的开放性；脚注列出因果读法。
- issue: “孤儿”是仅指真实的孤儿，还是隐喻悔改的以色列
  choice: 保留具体名词“孤儿”，不作解释性扩展
  alternative: “我们这些无依无靠的人”
  rationale: 本句可能既宣告上帝对实际弱势者的怜悯，也映照以色列无助的处境；原文只说“孤儿”，因此不把潜在隐喻直接写入正文。
translation_notes:
  register: 采用自然、庄重而清晰的现代标准汉语。“亚述不会拯救我们”与“不再骑战马”构成对政治和军事倚靠的弃绝；“自己亲手所造的”直接点明偶像是人造之物。末句保持简洁，不在正文中限定其因果关系或把“孤儿”直接解释为以色列。
