  text: אֶרְפָּא֙ מְשׁ֣וּבָתָ֔/ם אֹהֲבֵ֖/ם נְדָבָ֑ה כִּ֛י שָׁ֥ב אַפִּ֖/י מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/005.yaml
  text: I will heal their apostasy; I will love them freely[a], for my anger has turned away from them.
translation:
  language: zh_hans
  text: 我必医治他们的背道；我必乐意爱他们[a]，因为我的怒气已离开他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文作“从他”，由前文的复数转为单数；有些译本为使前后一致，译作“从他们身上”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְפָּא
  choice: 我要医治
  rationale: Qal词形在此表示“医治”。保留疾病与复原的比喻，又符合现代汉语表达。
- source_word: מְשׁוּבָתָם
  choice: 他们的背道
  rationale: מְשׁוּבָה指离弃、背叛，何西阿书的语境涉及背离与上帝所立的约；“背道”简洁地保留这一含义，复数后缀译为“他们的”。
- source_word: אֹהֲבֵם
  choice: 我要爱他们
  rationale: אהב直接表示“爱”，宾语后缀为第三人称阳性复数，因此译作“他们”。
- source_word: נְדָבָה
  choice: 甘心
  rationale: 该词表示自愿、出于自由意愿，也可指甘心献上的礼物；在此作方式状语，“甘心”表达这爱并非受迫或勉强，同时避免过度解释为某种特定教义术语。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出前述应许的理由；“因为”在现代汉语中清楚自然。
- source_word: שָׁב
  choice: 已经……转离了
  rationale: שׁוּב在这里描述怒气的回转或撤去；“转离”既保留方向性意象，也能自然表达怒气不再临到其对象。
- source_word: אַפִּי
  choice: 我的怒气
  rationale: אַף字面可指“鼻子”，但在此是表达愤怒的惯用语；译作“怒气”准确而自然。
- source_word: מִמֶּנּוּ
  choice: 从他身上
  rationale: 马所拉文本的后缀是第三人称阳性单数，故保留“他”，不把原文从复数到单数的转换悄然协调为复数。
theological_decisions:
- issue: 末句代词由复数转为单数
  choice: 正文保留“从他身上”
  alternative: 从他们身上
  rationale: 前文的“他们的”和“他们”均为复数，但מִמֶּנּוּ是第三人称阳性单数。保留单数可忠实呈现原文真实存在的数转换；脚注说明常见的复数协调译法，而不在正文中替原文消除张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“医治……背道”保留原文的比喻；“甘心爱”简明表达自愿、无勉强的爱。分号对应两个并列的第一人称应许。
