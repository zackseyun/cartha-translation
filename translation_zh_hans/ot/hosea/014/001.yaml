- from: 撒马利亚必担当自己的罪责[a]，因为她悖逆了自己的上帝。他们必倒在刀下；他们的幼儿必被摔碎[b]，他们的孕妇必被剖开肚腹。
  to: 撒马利亚必担当罪责[a]，因为她悖逆了她的上帝。他们必倒在刀下；他们的幼儿必被摔得粉碎[b]，他们的孕妇腹部必被剖开。
