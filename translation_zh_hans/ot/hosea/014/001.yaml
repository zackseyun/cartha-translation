  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תֶּאְשַׁם֙ שֹֽׁמְר֔וֹן כִּ֥י מָרְתָ֖ה בֵּֽ/אלֹהֶ֑י/הָ בַּ/חֶ֣רֶב יִפֹּ֔לוּ עֹלְלֵי/הֶ֣ם יְרֻטָּ֔שׁוּ וְ/הָרִיּוֹתָ֖י/ו יְבֻקָּֽעוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/001.yaml
  text: Samaria shall bear her guilt[a], because she has rebelled against her God. They shall fall by the sword; their little children shall be dashed to pieces[b], and their pregnant women ripped open.
translation:
  language: zh_hans
  text: 撒马利亚必担当罪责[a]，因为她悖逆了她的上帝。他们必倒在刀下；他们的幼儿必被摔得粉碎[b]，他们的孕妇腹部必被剖开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必被定为有罪”，或“必因自己的罪受苦”。
    reason: lexical_alternative
  - marker: b
    text: “幼儿”也可译作“婴孩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאְשַׁם
  choice: 必担当自己的罪责
  rationale: אשם在此既涉及有罪，也涉及因罪承担后果。“担当自己的罪责”兼顾罪责与随之而来的刑罚，没有把词义缩减为单纯“被惩罚”。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用现代中文圣经与历史地名中通行的译名；原文将该城拟人化为阴性。
- source_word: כִּי מָרְתָה בֵּאלֹהֶיהָ
  choice: 因为她悖逆了自己的上帝
  rationale: כִּי明确引出原因；מרה表示对权威的抗拒、悖逆，介词ב标明悖逆的对象。后缀为第三人称阴性单数，故保留撒马利亚的拟人化表达。
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: 必倒在刀下
  rationale: 保留“倒下”的战争语汇，并用中文惯用说法表达死于刀剑，没有扩译为“被杀”。
- source_word: עֹלְלֵיהֶם
  choice: 他们的幼儿
  rationale: עולל指年幼的孩子；“幼儿”既体现年龄幼小，也避免过度限定为新生婴儿。
- source_word: יְרֻטָּשׁוּ
  choice: 必被摔碎
  rationale: 忠实保留原文被动式及其刻意呈现的残酷暴力，不作弱化。
- source_word: וְהָרִיּוֹתָיו יְבֻקָּעוּ
  choice: 他们的孕妇必被剖开肚腹
  rationale: בקע在此指战争暴行中剖开孕妇身体。“剖开肚腹”准确、清楚，也保留原文的强烈冲击；物主后缀形式为单数，但语境所指是撒马利亚的集体人口，中文随前文采用复数“他们的”。
theological_decisions:
- issue: 撒马利亚的拟人化与后续复数指称
  choice: 首句以“她”保留城市的阴性拟人化，随后以“他们”指撒马利亚的居民。
  alternative: 全节都用单数指撒马利亚，或取消拟人化而只说“撒马利亚人”。
  rationale: 原文先用阴性单数描述撒马利亚的罪，继而转用复数动词和“他们的幼儿”，将审判落到居民身上；译文保留这一文学与语法张力。
- issue: 审判宣告中的露骨暴力
  choice: 在正文中直译幼儿被摔碎、孕妇被剖开肚腹。
  alternative: 用较含蓄的措辞概括为居民遭受杀戮。
  rationale: 原文有意以具体而残酷的战争暴行展现审判后果；弱化会改变先知话语的力度，但译文也不额外渲染。
- issue: אשם所含罪责与后果的关系
  choice: 译作“担当自己的罪责”，同时保留道德罪责和承受后果两层含义。
  alternative: 译作“被定为有罪”或“必因罪受罚”。
  rationale: 原文动词容许“有罪、负罪责、因罪承担后果”等相邻含义，不宜在正文中只锁定司法定罪或刑罚结果。
translation_notes:
  register: 采用现代、庄重而直接的普通话。句式尽量贴近希伯来文的因果关系和由城市拟人化转向居民群体的结构；暴力措辞不作委婉化，也不添加原文没有的细节。
