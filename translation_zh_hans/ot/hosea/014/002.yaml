  text: שׁ֚וּבָ/ה יִשְׂרָאֵ֔ל עַ֖ד יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּ֥י כָשַׁ֖לְתָּ בַּ/עֲוֺנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/002.yaml
  text: Return[a], O Israel, to Yahweh your God, for you have stumbled in your iniquity.
translation:
  language: zh_hans
  text: 以色列啊，归向雅威——你的上帝吧！因为你在自己的罪孽中[a]跌倒了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因自己的罪孽跌倒了。”这里的希伯来语介词既可表示原因，也可表示以色列跌倒时所处的罪孽境况。
    reason: 保留介词 ב 在因果义与范围、处境义之间的词义歧义。
lexical_decisions:
- source_word: שׁוּבָה
  choice: 归向
  rationale: 该命令式的基本义是“返回、转回”。“归向”既保留朝向上帝的方向性和盟约意味，也自然包含悔改之意，却不把词义直接收窄为“悔改”。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 按现代汉语通行形式译出专名；此处是直接呼语，故加“啊”。
- source_word: עַד
  choice: 向
  rationale: 与表示转回的动词连用时，标示行动所朝向的目标；汉语“归向”自然整合这一关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文直接使用的盟约之名。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称单数所属关系，表达雅威与以色列之间的盟约关系。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出劝告以色列归回的理由，现代汉语用“因为”清楚自然。
- source_word: כָשַׁלְתָּ
  choice: 跌倒了
  rationale: 保留 כשל 的绊跌隐喻，不将其强化为完全倾覆，也不抽象改写为单纯的“失败”。
- source_word: בַּעֲוֺנֶךָ
  choice: 在自己的罪孽中
  rationale: 紧贴介词 ב 的范围或处境用法，同时借脚注保留其因果用法。“自己的”在直接对以色列说话的语境中自然表达第二人称单数归属。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”以保留其专名性质，不以称号替代。
- issue: שׁוב 是译为“归向”还是“悔改”
  choice: 归向
  alternative: 悔改
  rationale: 原词首先表达转回、返回，并在先知性的盟约语境中蕴含悔改。“归向”保留其空间意象和较宽的神学张力。
- issue: בַּעֲוֺנֶךָ 中介词 ב 的关系
  choice: 在自己的罪孽中
  alternative: 因自己的罪孽
  rationale: 希伯来语介词既可描写以色列跌倒所在的罪孽处境，也可表达罪孽是跌倒的原因。正文采用较形式对应的范围表达，脚注保留因果理解。
translation_notes:
  register: 采用现代、庄重而易懂的呼告语气。“归向……吧”适合先知劝告；“跌倒”保留原文形象。脚注标记置于实际存在词义分歧的“跌倒了”之后，而非置于“归向”之后。
