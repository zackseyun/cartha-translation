  text: קְח֤וּ עִמָּ/כֶם֙ דְּבָרִ֔ים וְ/שׁ֖וּבוּ אֶל יְהוָ֑ה אִמְר֣וּ אֵלָ֗י/ו כָּל תִּשָּׂ֤א עָוֺן֙ וְ/קַח ט֔וֹב וּֽ/נְשַׁלְּמָ֥ה פָרִ֖ים שְׂפָתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/003.yaml
  text: Take words with you and return to Yahweh[a]. Say to him, “Take away all iniquity and receive what is good[b], and we will repay with the fruit of our lips.”
translation:
  language: zh_hans
  text: 你们要带着话语归向雅威。要对他说：“求你除去一切罪孽[a]，悦纳美善；我们必献上嘴唇的公牛作为偿还[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除去一切罪孽”也可译作“赦免一切罪责”；希伯来语习语的字面意象是把罪孽承担并带走。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语作“我们嘴唇的公牛”，把口中的赞美、认罪或许愿之言比作所献的公牛。一些古代见证和解释传统则理解为“嘴唇的果子”。
    reason: alternative_reading
lexical_decisions:
- source_word: קְחוּ עִמָּכֶם דְּבָרִים
  choice: 带着话语
  rationale: 保留“拿取／带着”与“话语”的具体表达；这里所指虽是悔改祷告的话，却不在正文中提前解释为“认罪”或“恳求”。
- source_word: וְשׁוּבוּ אֶל־יְהוָה
  choice: 归向雅威
  rationale: “归向”自然传达 שׁוב 的回转意象及悔改含义；“雅威”直接呈现神的专名 יְהוָה。
- source_word: כָּל־תִּשָּׂא עָוֺן
  choice: 除去一切罪孽
  rationale: נשא עון 是承担、带走乃至赦免罪孽的习语；正文保留“除去”的动作意象，脚注注明“赦免”这一自然理解。
- source_word: וְקַח־טוֹב
  choice: 悦纳美善
  rationale: 原文高度凝练，直译近于“取美善”；在祷告语境中用“悦纳”表达接受之意，同时不擅自补出明确宾语，如“我们的祭物”或“我们的善行”。
- source_word: וּנְשַׁלְּמָה
  choice: 献上还愿
  rationale: שלם 的这一形式带有偿付、履行誓愿的祭祀语感；“献上还愿”比单说“偿还”更符合上下文，又保留回应神恩的义务意味。
- source_word: פָרִים שְׂפָתֵינוּ
  choice: 嘴唇的牛犊
  rationale: 依马所拉文本保留鲜明而不寻常的献祭隐喻，不在正文中直接改写为较流畅的“嘴唇的果子”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名。采用“雅威”以专名形式呈现，并避免用称号取代原文的专名。
- issue: שׁוב 的悔改意涵
  choice: 归向
  alternative: 回转；回来
  rationale: “归向”同时保留方向性的回归图像和盟约关系中的悔改含义，不把二者割裂。
- issue: פָרִים שְׂפָתֵינוּ 的祭祀隐喻
  choice: 嘴唇的牛犊
  alternative: 嘴唇的果子；以嘴唇献上祭物
  rationale: 正文优先保存马所拉文本“牛犊”的困难读法，让言语与祭牲之间的张力保持可见；较顺畅的古代异读／解释置于脚注。
- issue: וְקַח־טוֹב 中 טוֹב 的所指
  choice: 美善
  alternative: 美好的祭物；善言；恩惠
  rationale: 希伯来文没有明说“美善”具体指什么，因此不把它限定为祭物、祷告或神所赐的福分。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“带着话语”与“嘴唇的牛犊”刻意保留原文略显陌生的诗性表达；“要……求……”使先知的劝告及其提供的祷词层次清楚。
