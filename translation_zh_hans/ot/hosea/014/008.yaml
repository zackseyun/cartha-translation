base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/008.yaml
  text: Those who dwell in his shade will return[a]; they will revive like grain and blossom like the vine[b]; his renown will be like the wine of Lebanon.
translation:
  language: zh_hans
  text: 住在他荫下的人必归回；他们必使五谷复苏[a]，又像葡萄树一样开花；他的声名[b]必如黎巴嫩的酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来语十分凝练，也可理解为“他们必如五谷复苏”或“他们必靠五谷恢复生机”。
    reason: lexical_alternative
  - marker: b
    text: “声名”也可译作“记念”或“名声”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֻׁבוּ
  choice: 必归回
  rationale: שוב的Qal未完成式通常表示“返回、归回”。这里将其理解为蒙荫庇之人的复归，同时不把它改写成较具体的“重新居住”。
- source_word: יֹשְׁבֵי בְצִלּוֹ
  choice: 住在他荫下的人
  rationale: 分词יֹשְׁבֵי作名词用，指“居住的人”；“荫下”自然保留צֵל所表达的遮蔽、保护与福分意象。
- source_word: יְחַיּוּ דָגָן
  choice: 他们必使五谷复苏
  rationale: חיה的Piel形式直译为“使……活、使……复苏”。希伯来语在此高度凝练，译文保留其使役结构和农业意象，不在正文中擅自补入原文没有的比较词。
- source_word: וְיִפְרְחוּ כַגָּפֶן
  choice: 又像葡萄树一样开花
  rationale: פרח表示开花或繁茂；כ明确引出比喻。“开花”与前面的五谷复苏共同构成恢复兴盛的农业图景。
- source_word: זִכְרוֹ
  choice: 他的声名
  rationale: זֵכֶר可指记念、名声或声誉。与黎巴嫩的酒相比时，“声名”在现代汉语中最自然，也保留第三人称阳性单数后缀。
- source_word: כְּיֵין לְבָנוֹן
  choice: 如黎巴嫩的酒
  rationale: 按原文保留直接的明喻和地域名称，不额外说明这种酒的品质或香气。
theological_decisions:
- issue: “他荫下”和“他的声名”中第三人称单数后缀的所指
  choice: 两处均译作单数“他”，不在正文中明确其所指
  alternative: 明确译作人格化的以色列、以法莲，或复兴后的群体
  rationale: 希伯来语使用阳性单数后缀，而上下文以人格化和群体性意象描写复兴。保留“他”可维持原文的语法形式及所指上的诗性张力。
- issue: יְחַיּוּ דָגָן的主客关系与复兴意象
  choice: 正文按使役形式译为“使五谷复苏”，并以脚注列出主要理解
  alternative: 译作“他们必如五谷复苏”或“他们必靠五谷复苏”
  rationale: 原文没有明确的比较介词，而Piel形式通常具有使役意义；但诗句凝练且与下一分句平行，故不排除将人比作复苏五谷或理解为因五谷而恢复生机。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“荫下”“归回”“复苏”“声名”等词保留诗歌的凝练感；正文尽量贴近希伯来语结构，并用脚注呈现难句和代词所指的真实歧义。
