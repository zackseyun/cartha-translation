  text: א֤וֹי לָ/הֶם֙ כִּֽי נָדְד֣וּ מִמֶּ֔/נִּי שֹׁ֥ד לָ/הֶ֖ם כִּֽי פָ֣שְׁעוּ בִ֑/י וְ/אָנֹכִ֣י אֶפְדֵּ֔/ם וְ/הֵ֕מָּה דִּבְּר֥וּ עָלַ֖/י כְּזָבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/013.yaml
  text: Woe to them[a], for they have wandered away from me! Destruction is theirs, for they have rebelled against me. Though I would redeem them, they speak lies against me.
translation:
  language: zh_hans
  text: 他们有祸了，因为他们离开我，漂泊不定！毁灭临到他们，因为他们背叛了我。我虽愿救赎他们，他们却以谎言攻击我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我虽愿救赎他们”也可译作“然而我愿救赎他们”；有人把这个动词理解为过去时：“但我救赎了他们。”
    reason: 保留希伯来语未完成式在此处可能具有的意愿、意向或过去叙事等不同理解。
lexical_decisions:
- source_word: א֤וֹי לָהֶם
  choice: 他们有祸了
  rationale: אוי兼有哀叹与宣告灾祸的语气；“有祸了”保留先知性警告，比单纯“可悲”更有力度。
- source_word: נָדְדוּ מִמֶּנִּי
  choice: 离开我，四处漂荡
  rationale: נדד可指漂荡、流离或逃离；此译既表达实际的离开，也保留与上帝疏离的关系含义，而不把动作过度限定为蓄意逃跑。
- source_word: שֹׁד לָהֶם
  choice: 毁灭临到他们
  rationale: שֹׁד表示毁坏、灾祸或暴力造成的毁灭；希伯来语是简短的名词句，此译在现代汉语中自然，并保留审判宣告。
- source_word: פָשְׁעוּ בִי
  choice: 背叛了我
  rationale: פשע不只是一般犯罪，也含反叛、破坏忠诚关系之意；“背叛”适合何西阿书的盟约关系语境。
- source_word: וְאָנֹכִי אֶפְדֵּם
  choice: 我本要救赎他们
  rationale: 未完成式 אֶפְדֵּם 可表达意愿或意向；“本要”保留上帝愿意施行救赎与百姓敌对回应之间的张力，同时不将其强定为过去已经完成。
- source_word: דִּבְּרוּ עָלַי כְּזָבִים
  choice: 他们却说谎攻击我
  rationale: דבר עלי כזבים 表示以虚假言语敌对上帝；“说谎攻击我”比泛泛的“说谎话论到我”更清楚传达 עָלַי 的敌对方向。
theological_decisions:
- issue: וְאָנֹכִי אֶפְדֵּם 中救赎行动的时态和语气
  choice: 我本要救赎他们
  alternative: 但我救赎了他们；然而我愿救赎他们
  rationale: 希伯来语未完成式自然容许意愿或意向的非过去含义；“本要”保存上帝救赎意愿与以色列持续说谎之间的神学张力，不武断地改成已完成的历史行动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他们有祸了”保留先知宣告的力度；以“却”明确呈现上帝救赎意愿和百姓虚假敌对之间的反差。脚注标记置于相关分句之后。
