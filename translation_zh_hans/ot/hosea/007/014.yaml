  text: וְ/לֹֽא זָעֲק֤וּ אֵלַ/י֙ בְּ/לִבָּ֔/ם כִּ֥י יְיֵלִ֖ילוּ עַל מִשְׁכְּבוֹתָ֑/ם עַל דָּגָ֧ן וְ/תִיר֛וֹשׁ יִתְגּוֹרָ֖רוּ יָס֥וּרוּ בִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/014.yaml
  text: They do not cry out to me from their heart[a], but they wail on their beds; for grain and new wine they gather themselves; they turn away from me.
translation:
  language: zh_hans
  text: 他们并没有从心里向我呼求，却在床上哀号；为了谷物和新酒，他们聚集起来[a]；他们背离我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处“聚集起来”所对应的希伯来语动词意义不确定；也可译为“割伤自己”。后一种理解可能指他们为谷物和新酒所作的仪式性自割。
    reason: alternative_reading
lexical_decisions:
- source_word: זָעֲקוּ
  choice: 呼求
  rationale: 该词常指人在困苦中大声求助；“呼求”既保留强烈语气，也体现向上帝求援的方向。
- source_word: אֵלַי בְּלִבָּם
  choice: 从心里向我
  rationale: 直陈内在真实，与下句外在的哀号形成对照，又不把“真诚”等解释性词语直接加入正文。
- source_word: כִּי
  choice: 却
  rationale: 此处语境突出对比：他们不是从心里向上帝呼求，而只是在床上哀号；“却”自然表达这一转折关系。
- source_word: יְיֵלִילוּ
  choice: 哀号
  rationale: 保留大声悲鸣、哀哭的意味，语体庄重而自然，也不必采用偏动物意象的“嗥叫”。
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: 在床上
  rationale: 直接保留地点意象；现代汉语简洁自然。
- source_word: דָּגָן וְתִירוֹשׁ
  choice: 五谷和新酒
  rationale: “五谷”自然表达粮食、谷物的集合概念；“新酒”保留 תירוש 的农产与初成酒意象。
- source_word: יִתְגּוֹרָרוּ
  choice: 聚集起来
  rationale: 该词形和词义存在困难。按马所拉文本可联系“聚集”理解，且不把可能基于异读或仪式背景的“割伤自己”无标记地写入正文；另一主要解释置于脚注。
- source_word: יָסוּרוּ בִי
  choice: 仍背离我
  rationale: 表达他们在关系上转离上帝；“仍”承接前文，显示哀号并未构成真实归向，但不强化为更具体的神学术语。
theological_decisions:
- issue: יִתְגּוֹרָרוּ 的解释
  choice: 正文译为“他们聚集起来”
  alternative: 他们割伤自己，即可能指为五谷和新酒举行仪式性哀悼
  rationale: 希伯来语动词疑难，可理解为聚集，也常被联系到自割身体。为遵循现有马所拉文本并避免正文过早解决争议，采用“聚集”作为正文读法，同时以脚注保存“割伤自己”的重要可能性。
- issue: 哀号与真实祷告的关系
  choice: 用“并没有……却……”保留经文的批判性对照
  alternative: 将 כִּי 译为“因为”，使后句成为原因说明
  rationale: 上下文重点在于外在哀号并非发自内心向上帝呼求。对比译法在现代汉语中更清楚，但没有把他们的动机进一步定性为虚伪或偶像崇拜。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“呼求”“哀号”“背离”保留先知书的力度；句式简洁，并以脚注明确保存疑难动词的另一种重要读法。
