id: HOS.7.2
reference: Hosea 7:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בַל יֹֽאמְרוּ֙ לִ/לְבָבָ֔/ם כָּל רָעָתָ֖/ם זָכָ֑רְתִּי עַתָּה֙ סְבָב֣וּ/ם מַֽעַלְלֵי/הֶ֔ם נֶ֥גֶד פָּנַ֖/י הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/002.yaml
  text: And they do not say in their heart that I remember all their evil[a]. Now their deeds surround them[c][b]; they are before my face.
translation:
  language: zh_hans
  text: 他们心里并没有想到[a]：他们一切的恶[b]，我都记得。如今，他们的所作所为围住了他们；这一切都在我面前[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“对自己的心说”，意思是“在心里思量”或“对自己说”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他们一切的邪恶”或“他们一切的恶行”。
    reason: lexical_alternative
  - marker: c
    text: 原文较字面地说“在我的脸前”，表示完全暴露在上帝的临在和审察之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַל
  choice: 并没有
  rationale: וּ连接前文，בַל表示否定；“并没有”自然承接持续的指控，同时不把连接词过度解释为强烈转折。
- source_word: יֹאמְרוּ לִלְבָבָם
  choice: 心里……想到
  rationale: 原文直译为“对自己的心说”，是内心思量、反省的希伯来语表达。“心里想到”在现代汉语中自然，同时由脚注保留原文意象。
- source_word: כָּל רָעָתָם
  choice: 他们一切的恶
  rationale: רָעָה在此概括其道德上的邪恶，既可包括恶行，也不局限于个别行为；“一切的恶”保留其宽泛含义。
- source_word: זָכָרְתִּי
  choice: 我都记得
  rationale: 完成式在这里表达上帝已经记住、现今仍记得的状态；汉语“都记得”自然呈现持续有效的知悉，而不限定为单一过去事件。
- source_word: עַתָּה
  choice: 如今
  rationale: 标示当前处境或后果；“如今”符合先知性话语的庄重语体。
- source_word: סְבָבוּם
  choice: 围住了他们
  rationale: 保留动词“环绕、包围”的具体比喻，描绘他们自己的行为反过来将他们困住。
- source_word: מַעַלְלֵיהֶם
  choice: 他们的所作所为
  rationale: מַעֲלָל指行为、作为，常带道德评价；“所作所为”在现代汉语中自然且具有相应分量。
- source_word: נֶגֶד פָּנַי
  choice: 在我面前
  rationale: 该短语字面涉及“我的脸”，表达他们的行为直接暴露在上帝的临在和察看之下；正文采用自然而仍具形象性的“在我面前”，脚注说明字面表达。
- source_word: הָיוּ
  choice: 都在
  rationale: 虽为完成式，此处描述这些行为如今处于上帝面前的现状；汉语用现在状态表达最为自然。
theological_decisions:
- issue: 以上帝的“脸/面前”表达其知悉与审察
  choice: 在我面前
  alternative: 在我眼前；在我的脸前
  rationale: “在我面前”保留原文关于上帝临在和直接审察的具体意象，又不以生硬直译额外强化身体性理解。
- issue: 上帝“记得”人的一切恶
  choice: 我都记得
  alternative: 我已经记住；我一直放在心上
  rationale: 保留原文“记得”的措辞及其审判语境，不将其改写为遗忘后回想，也不额外说明记念将如何落实为惩罚。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语体。前半句以冒号呈现内心本应承认的内容；后半句保留“所作所为围住他们”的拟人化比喻，并用“这一切”明确末句所指，避免现代汉语中代词指向含混。
