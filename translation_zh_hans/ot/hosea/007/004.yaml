  text: כֻּלָּ/ם֙ מְנָ֣אֲפִ֔ים כְּמ֣וֹ תַנּ֔וּר בֹּעֵ֖רָה מֵֽ/אֹפֶ֑ה יִשְׁבּ֣וֹת מֵעִ֔יר מִ/לּ֥וּשׁ בָּצֵ֖ק עַד חֻמְצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/004.yaml
  text: All of them are adulterers[a], like an oven heated by a baker[c][b], who stops stirring from the kneading of the dough until its leavening.
translation:
  language: zh_hans
  text: 他们全都是行奸淫的人，像烘饼的人烧热的炉子[a]；烘饼的人从揉面以后，直到面团发酵[c]，不再拨旺炉火[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像烘饼的人点燃的炉子”或“像燃烧着的炉子”。希伯来语分词也可强调炉子正在燃烧、发热。
    reason: lexical_alternative
  - marker: b
    text: “拨旺炉火”原文含义较难确定；也可译作“停止照管炉子”或“停止搅动”。
    reason: lexical_alternative
  - marker: c
    text: “发酵”或译“发起来”；希伯来语所指可能是面团发酵或受酵膨起的过程。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: 他们全都是
  rationale: 保留该短语涵盖全体并带强调的语气，同时符合现代汉语表达。
- source_word: מְנָאֲפִים
  choice: 奸淫的人
  rationale: 该分词在此作复数名词用；译文保留其直接的道德指控，不在正文中明说是属灵或盟约层面的不忠。
- source_word: כְּמוֹ תַנּוּר
  choice: 像……炉子
  rationale: 保留原文的明喻；上下文是烤饼场景，因此采用家用烤炉意象，而非工业性的熔炉。
- source_word: בֹּעֵרָה מֵאֹפֶה
  choice: 烤饼的人烧热的
  rationale: 将介词理解为施事关系，参与分词译作被烧热，以自然汉语呈现烤炉由烤饼者加热的图景；同时用脚注保留‘燃烧着’的可能。
- source_word: יִשְׁבּוֹת מֵעִיר
  choice: 他不再拨旺炉火
  rationale: יִשְׁבּוֹת 表示停止；מֵעִיר 在此语境含义较难确定，结合烤炉图景译作停止拨旺炉火，但以脚注明示其他可能。
- source_word: מִלּוּשׁ בָּצֵק
  choice: 从揉面以后
  rationale: 表达原文由揉面起算的时间范围；补足动作关系，使现代汉语清楚自然。
- source_word: עַד חֻמְצָתוֹ
  choice: 直到面团发酵
  rationale: חֻמְצָתוֹ 指面团发酵或受酵的过程；正文选择‘发酵’，并在脚注保留结果性的‘发起来’。
theological_decisions:
- issue: 是否将‘奸淫的人’明确扩展为属灵或盟约上的不忠
  choice: 正文只译作‘奸淫的人’，不作解释性扩展
  alternative: 背约不忠、犯属灵奸淫的人
  rationale: 何西阿书常以奸淫指向盟约不忠，但本节采用的是具体的奸淫用语。保留直译可维持字面与隐喻之间的张力，避免把解释写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“烤饼的人”比单用“烘焙者”更贴近日常古代烤炉图景；句中补出“他”和“炉火”，使困难的希伯来语省略关系在汉语中可理解，同时用脚注保留词义不确定性。所有脚注标记均置于相关正文位置。
