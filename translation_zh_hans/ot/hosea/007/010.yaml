base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/010.yaml
  text: The pride of Israel testifies against him[a], yet they do not return to Yahweh their God[b], nor do they seek him in all this.
translation:
  language: zh_hans
  text: 以色列的骄傲当面指证他[a]；他们却不归向耶和华他们的上帝，也不在这一切事上寻求他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他面前指证他”或“当着他的面作证”。希伯来文直译为“在／对着他的脸”。
    reason: lexical_alternative
  - marker: b
    text: “在这一切事上”也可理解为“尽管有这一切”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנָה
  choice: 指证
  rationale: 此处与“骄傲”和“当面”连用，具有作证并形成控告的意味；“指证”比直译为“回答”更符合先知责备的语境。
- source_word: גְאוֹן יִשְׂרָאֵל
  choice: 以色列的骄傲
  rationale: גאון 可指骄傲、尊荣或威严；本节处于责备语境，负面的“骄傲”最贴切。
- source_word: בְּפָנָיו
  choice: 当面
  rationale: 希伯来文直译为“在他面前／对着他的脸”。“当面”自然保留空间与对质意味，也不完全锁定为法庭式的“控告他”；单数“他”按原文保留。
- source_word: שָׁבוּ אֶל
  choice: 归向
  rationale: שוב 与 אֶל 连用表示转回、回到某一对象，也常含悔改和恢复关系之意；“归向”简洁而庄重。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，而不以“主”这一称号代替。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 忠实保留所有格，突出他们不肯归向那位本是他们上帝者的反差。
- source_word: בִקְשֻׁהוּ
  choice: 寻求他
  rationale: בקש 在此可涵盖寻求上帝、求问他并向他求助；“寻求他”自然且保持语义宽度。
- source_word: בְּכָל זֹאת
  choice: 在这一切之中
  rationale: 贴近介词 בְּ 与概括性短语“这一切”的字面表达，指此前所述的一切处境；上下文也可能赋予让步意味。
theological_decisions:
- issue: בְּפָנָיו 中单数后缀的指向及经文中的数转换
  choice: 译作单数“他”，以集合性单数“以色列”为其可能的所指
  alternative: 按群体意义顺译为“他们”，或将短语理解为“在他面前”
  rationale: 希伯来文后缀明确为阳性单数，而下一分句主语转为复数。保留“他／他们”的数转换，可避免抹平原文的语法张力。
- issue: בְּכָל זֹאת 的关系意义
  choice: 正文采用中性的“在这一切之中”
  alternative: “尽管有这一切”
  rationale: 介词本身容许处境性理解，而语境可产生让步色彩；正文保留较少解释性的表达，并在脚注列出让步读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“指证”体现先知性控诉；正文保留原文从集合性单数“他”转为复数“他们”的变化。所有脚注标记均已置于正文。
