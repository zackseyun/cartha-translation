  text: אֶפְרַ֕יִם בָּ/עַמִּ֖ים ה֣וּא יִתְבּוֹלָ֑ל אֶפְרַ֛יִם הָיָ֥ה עֻגָ֖ה בְּלִ֥י הֲפוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/008.yaml
  text: Ephraim mixes himself among the peoples[b][a]; Ephraim has become a cake not turned.
translation:
  language: zh_hans
  text: 以法莲混杂在列邦之中[a]；以法莲成了没有翻过面的饼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与列邦掺混。”
    reason: lexical_alternative
  - marker: b
    text: 这里描绘的是烤饼没有翻面，结果一面烤焦，另一面却没有熟。
    reason: cultural_note
lexical_decisions:
- source_word: יִתְבּוֹלָל
  choice: 混杂
  rationale: 该反身词形表达以法莲主动使自己与别族掺混；“混杂”在现代汉语中自然，并保留先知话语中的批判意味。
- source_word: בָּעַמִּים
  choice: 在列邦之中
  rationale: עַמִּים为复数，可指周围诸民族或列国；“列邦”简洁庄重，不把所指过度限定为现代民族国家。
- source_word: עֻגָה
  choice: 饼
  rationale: 此词指在热石或炭火上烤制的圆饼；“饼”符合古代食物意象，也比“蛋糕”准确。
- source_word: בְּלִי הֲפוּכָה
  choice: 没有翻过面的
  rationale: 直译烤饼时未被翻面，简明保留比喻本身；其一面焦、一面未熟的含义由脚注说明。
- source_word: הָיָה
  choice: 成了
  rationale: 完成式在语境中表示已经形成的结果状态；“成了”自然传达以法莲如今落入这种状态。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 按原文保留专名；在何西阿书中常代表北国以色列，但不在正文中以解释替换原称。
theological_decisions:
- issue: “以法莲”的所指
  choice: 正文保留“以法莲”，让其隐含地代表北国以色列。
  alternative: 直接译为“以色列”或“北国”。
  rationale: 原文使用具有盟约历史背景的专名“以法莲”；保留它可避免把解释写入正文。
- issue: 与列邦混杂的主动性
  choice: 译作“混杂在列邦之中”，保留其自我卷入、同化于外邦的责备意味。
  alternative: 译作“被混在列邦之中”，理解为纯被动状态。
  rationale: יִתְבּוֹלָל的反身形态支持主体参与其中，但汉语正文不额外说明这种混杂具体属于政治、宗教还是文化层面，以保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列邦”保留先知文学语体，“没有翻过面的饼”则用直观现代汉语呈现古代烤饼意象。所有脚注标记均置于相关正文之后。
