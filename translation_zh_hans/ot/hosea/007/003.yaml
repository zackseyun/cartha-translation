  yaml_path: translation/ot/hosea/007/003.yaml
  text: By their evil they make the king glad[a], and by their lies the princes.
translation:
  language: zh_hans
  text: 他们以自己的恶行使君王欢喜，以自己的谎言使首领欢喜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谎言”或译“欺骗”；“首领”或译“官长”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָתָם
  choice: 以自己的恶行
  rationale: 介词 ב 表示手段；“以”保留工具意义。“恶行”比单说“恶”更自然，并能表达群体所行之恶。
- source_word: יְשַׂמְּחוּ
  choice: 使……欢喜／使……快乐
  rationale: שׂמח 的 Piel 形式具有使动意义，因此译出“使”，而非译作他们自己欢喜。后半句承前省略的动词在中文中补出，以免句意含混。
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 上下文所指为以色列的王；“君王”符合宫廷政治语境，也具有庄重而现代的表达。
- source_word: וּבְכַחֲשֵׁיהֶם
  choice: 以自己的谎言
  rationale: כחשׁ 可指谎言、虚假或欺骗；“谎言”直接、清楚，并与“恶行”构成平行。
- source_word: שָׂרִים
  choice: 首领
  rationale: שׂרים 指高层领袖或官长。“首领”既保留其政治领导含义，也避免现代汉语中“王子”可能造成的血缘误解。
