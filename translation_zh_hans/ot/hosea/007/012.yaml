base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/012.yaml
  text: As they go[a], I will spread my net over them; like the birds of the heavens I will bring them down[b]. I will chasten them according to the report to their assembly.
translation:
  language: zh_hans
  text: 他们去的时候，我要把我的网张在他们上面；我要把他们像空中的飞鸟一样击落。我要照着传给他们会众的消息管教他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句含义不易确定。直译可作“照着给他们会众的消息”。也可理解为“照着在他们会众中所宣告的”，或“正如他们的会众所听见的”。
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר יֵלֵכוּ
  choice: 他们去的时候
  rationale: כַּאֲשֶׁר引入时间从句，יֵלֵכוּ为“去、行走”；译文保留其一般而未明确目的地的动态含义。
- source_word: אֶפְרוֹשׂ עֲלֵיהֶם רִשְׁתִּי
  choice: 我要把我的网撒在他们身上
  rationale: פרשׂ与“网”连用表示铺开、张开捕网；“撒在……身上”自然传达由上覆盖并捕捉的图像。
- source_word: כְּעוֹף הַשָּׁמַיִם אוֹרִידֵם
  choice: 我要使他们坠落，如同空中的飞鸟
  rationale: עוֹף是集合名词，指飞鸟；אוֹרִידֵם是ירד的使役形，意为“使他们下来”。“使……坠落”保持捕鸟意象和审判力度，又不添加原文没有的“地上”。
- source_word: אַיְסִרֵם
  choice: 我要管教他们
  rationale: יסר的使役形可指管教、惩戒；“管教”兼具纠正和惩治色彩，避免把经文单向收窄为纯粹刑罚。
- source_word: כְּשֵׁמַע לַעֲדָתָם
  choice: 正如他们的会众所听见的
  rationale: שֵׁמַע可涉及听见之事、消息或传告，לַעֲדָתָם指向“他们的会众”。此译法贴近句法表层，同时承认末句所指并不明确。
theological_decisions:
- issue: אַיְסִרֵם所表达的神圣行动性质
  choice: 管教
  alternative: 惩罚；惩戒
  rationale: “管教”保留יסר兼具纠正与审判的语义张力，不把先知性审判化约为单纯报应。
- issue: 末句כְּשֵׁמַע לַעֲדָתָם的解释
  choice: 正如他们的会众所听见的
  alternative: 照着传给他们会众的消息；照着在他们会众中所宣告的
  rationale: 希伯来语句法和שֵׁמַע的具体所指均有困难；正文采用较贴近原文且可读的表达，脚注列出主要可能解释，不武断消除歧义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“会众”对应עֵדָה，保留群体聚集之意而不特指后来的教会制度；整体维持捕鸟比喻及神说话的第一人称力度。
