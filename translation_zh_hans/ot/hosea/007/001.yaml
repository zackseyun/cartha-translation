source:
  edition: WLC
  text: כְּ/רָפְאִ֣/י לְ/יִשְׂרָאֵ֗ל וְ/נִגְלָ֞ה עֲוֺ֤ן אֶפְרַ֨יִם֙ וְ/רָע֣וֹת שֹֽׁמְר֔וֹן כִּ֥י פָעֲל֖וּ שָׁ֑קֶר וְ/גַנָּ֣ב יָב֔וֹא פָּשַׁ֥ט גְּד֖וּד בַּ/חֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/001.yaml
  text: When I would heal Israel[a], the iniquity of Ephraim is uncovered, and the evil deeds of Samaria; for they practice falsehood. A thief comes in[c][b]; a raiding band strips outside.
translation:
  language: zh_hans
  text: 我医治以色列的时候[a]，以法莲的罪孽显露出来，撒马利亚的恶行也显露出来；因为他们行事诡诈。盗贼进来，一队劫匪在外抢掠。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当我医治以色列时”“当我正医治以色列时”或“当我医治了以色列时”。
    reason: 原文时间结构可指正在发生、意欲进行或已发生的医治；正文避免过度限定。
  - marker: b
    text: 或译：“盗贼闯进来；一队劫匪在街上抢掠。”
    reason: “进来”未明确进入的具体地点；“在外”也可指街市。פָּשַׁט与גְּדוּד连用可表达一队人出动袭掠、劫掠。
lexical_decisions:
- source_word: כְּרָפְאִי
  choice: 我医治……的时候
  rationale: כְּ引出时间情境，רָפְאִי表明上帝为第一人称施事者。正文采用自然的未定时中文，既可涵盖“当我医治时”，也不把动作强限定为已经完成或仅属意愿。
- source_word: לְיִשְׂרָאֵל
  choice: 以色列
  rationale: 医治行动所指向的对象；保留民族专名。
- source_word: וְנִגְלָה
  choice: 就显露出来……也暴露了
  rationale: נפעל词形表示被揭露、显现。中文以“显露出来/暴露”保持隐藏罪恶被揭开的意象，并用“就”承接时间从句。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: 此处指以法莲被揭露的道德败坏与罪责；“罪孽”兼具伦理与盟约性分量。
- source_word: וְרָעוֹת
  choice: 恶行
  rationale: רָעוֹת在此更自然地指道德上的恶事，而非所遭受的灾祸；“恶行”保留复数集合意义。
- source_word: פָּעֲלוּ שָׁקֶר
  choice: 他们弄虚作假
  rationale: פָעַל与שֶׁקֶר连用，表示施行虚假、作出欺骗行为；“弄虚作假”在现代汉语中自然，并传达惯常的欺诈实践。
- source_word: וְגַנָּב יָבוֹא
  choice: 盗贼入室
  rationale: יָבוֹא本义为“进来/进入”，语境与下句“在外”形成内外对照。“入室”明确其侵入性，但不额外指定破门方式。
- source_word: פָּשַׁט גְּדוּד בַּחוּץ
  choice: 匪帮在外抢掠
  rationale: פָּשַׁט与גְּדוּד组合描写成群袭掠；“抢掠”自然表达剥夺、劫掠之意，“在外”保留בַּחוּץ及其与室内盗贼的对照。
theological_decisions:
- issue: 上帝医治与罪恶显露之间的时间关系
  choice: 译为“我医治以色列的时候”，把医治之际与罪孽显露并置，不限定为已完成的过去事件。
  alternative: “我本想医治以色列时”或“我医好了以色列时”。
  rationale: 希伯来语允许“当/在……时”的时间义，但未必明确表达反事实意愿或完成体。正文保留时间关系和张力，脚注列出可行理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“以法莲”“撒马利亚”保留先知书中的专名及其转喻空间；句式保持希伯来诗性散文的急促推进，同时用“入室/在外”呈现内外呼应。所有脚注标记均置于正文。
