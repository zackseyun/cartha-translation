base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/006.yaml
  text: For they draw near with their hearts like an oven in their lying in wait[a]; all night their baker sleeps[b], but in the morning it burns like a flaming fire.
translation:
  language: zh_hans
  text: 因为他们埋伏时，带着如火炉般的心走近[a]；整夜，给他们烤饼的人睡着[b]；到了清晨，便如烈焰之火燃烧起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “埋伏时”也可译作“在他们设伏之中”或“当他们潜伏等候时”。原文含暗中图谋、伺机攻击的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他们的烤饼的人”。在本句延续的火炉比喻中，这人可能象征照管或煽旺他们炽热图谋的人。
    reason: cultural_note
lexical_decisions:
- source_word: קֵרְבוּ
  choice: 逼近
  rationale: 该词为קרב的Qal完成式第三人称复数，表示靠近、临近。译作“逼近”既保留趋近行动的意象，也与埋伏、图谋的语境自然衔接，但不明说他们逼近的具体对象。
- source_word: כַתַּנּוּר
  choice: 如同火炉般
  rationale: 介词כ明确引出比喻；“火炉”保留本段持续出现的炽热意象。
- source_word: לִבָּם
  choice: 心
  rationale: 希伯来语为带第三人称阳性复数后缀的集合性单数。“怀着火炉般的心”在现代汉语中自然，同时保留共同欲念或图谋的集合意味。
- source_word: בְּאָרְבָּם
  choice: 埋伏时
  rationale: 源自动词ארב，含埋伏、潜伏以待攻击之意。译为时间性短语，简洁表达其图谋和伺机而动的语境。
- source_word: יָשֵׁן
  choice: 沉睡
  rationale: 以汉语谓语表达其睡着的状态；“沉睡”与次晨火势骤起形成鲜明对照。
- source_word: אֹפֵהֶם
  choice: 给他们烤饼的人
  rationale: 字面为“他们的烤饼者”。采用解释最少而又可懂的称呼，保留火炉比喻中的人物，不直接将其释为煽动阴谋者。
- source_word: בֹעֵר
  choice: 燃烧起来
  rationale: בער的主动分词表示燃烧、炽烈。“燃烧起来”符合清晨火势显现的动态画面。
- source_word: כְאֵשׁ לֶהָבָה
  choice: 如熊熊烈火
  rationale: 原文以“火”和“火焰”叠加强化意象；“熊熊烈火”用自然庄重的现代汉语传达这种强度。
theological_decisions:
- issue: 火炉比喻中的主语与行动者
  choice: 将他们的心比作火炉，并保留“给他们烤饼的人”这一延续比喻的人物；末句省略明确主语。
  alternative: 明确解释为阴谋者自己带着炽热的心接近君王，或把“烤饼的人”直接译成煽动、操纵阴谋的人。
  rationale: 希伯来语句法紧缩，末句的阳性单数主语既可顺着“心”，也可顺着“火炉”意象理解。中文以省略主语的方式保留这一张力，不把比喻锁定为某一种具体历史或神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“怀着火炉般的心逼近”保留原文不寻常而紧缩的意象；“给他们烤饼的人”避免使用现代职业称谓“面包师”，以贴近古代火炉烤饼的场景。末句不补出“心”或“火炉”为主语，以保存原文的指向弹性。
