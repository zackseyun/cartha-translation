id: HOS.7.9
reference: Hosea 7:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָכְל֤וּ זָרִים֙ כֹּח֔/וֹ וְ/ה֖וּא לֹ֣א יָדָ֑ע גַּם שֵׂיבָה֙ זָ֣רְקָה בּ֔/וֹ וְ/ה֖וּא לֹ֥א יָדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/009.yaml
  text: Strangers have devoured his strength[a], but he does not know it; even gray hair is sprinkled on him[b], but he does not know it.
translation:
  language: zh_hans
  text: 外族人吞噬了他的力量[a]，他却不知道；连白发也已散布在他身上[b]，他却不知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“外族人耗尽了他的力量。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“白发已被撒在他身上。”这是衰败和老化的形象。
    reason: cultural_note
lexical_decisions:
- source_word: אָכְלוּ
  choice: 吞噬了
  rationale: 该词为 אכל 的 Qal 完成式第三人称复数；这里比喻性地表示耗尽国力。“吞噬”保留先知话语中鲜明而强烈的意象。
- source_word: זָרִים
  choice: 外族人
  rationale: 此处所指并非泛泛的陌生人，而是侵耗以色列的外来民族或势力；“外族人”既准确又符合现代汉语。
- source_word: כֹּחוֹ
  choice: 他的力量
  rationale: כֹּחַ 可指力量、能力或活力；上下文涉及国家被耗损，“力量”保留其宽泛含义，不限定为军事力量。
- source_word: וְהוּא לֹא יָדָע
  choice: 他却不知道
  rationale: 原文重复此句以形成强调。“却”自然表达前述衰败事实与当事者毫无察觉之间的反差；宾语按汉语习惯由上下文省略。
- source_word: גַּם
  choice: 连……也
  rationale: 这里引出进一步的衰败迹象，具有递进和强调作用；“连……也”在现代汉语中自然传达这种语气。
- source_word: שֵׂיבָה
  choice: 白发
  rationale: 该词可指白发或老年；保留具体的“白发”意象，比抽象译作“衰老”更贴近原文。
- source_word: זָרְקָה
  choice: 已散布
  rationale: זרק 的基本意象是抛撒、散布；与“白发”搭配时，表示白发已经零星遍布。“散布”既保留原文比喻，也比直译“被撒”更自然。
- source_word: בּוֹ
  choice: 在他身上
  rationale: 介词短语描写白发出现在他身上；此译保留拟人化的国家形象，并符合汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“吞噬”和“白发散布”的双重意象，以及两次“他却不知道”的重复结构，以呈现原文的讽刺与强调；代词“他”承接上下文中被人格化的以色列。
