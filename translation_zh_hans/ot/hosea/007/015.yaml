source:
  edition: WLC
  text: וַ/אֲנִ֣י יִסַּ֔רְתִּי חִזַּ֖קְתִּי זְרֽוֹעֹתָ֑/ם וְ/אֵלַ֖/י יְחַשְּׁבוּ רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/015.yaml
  text: Though I trained and strengthened their arms[a], yet they devise evil against me.
translation:
  language: zh_hans
  text: 我虽训练[a]他们，使他们的臂膀强壮，他们却图谋恶事与我作对。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“管教”或“惩戒”；这里的希伯来语动词既可表示纠正、惩戒，也可表示教导、训练。
    reason: 词义存在真实幅度，正文按平行句采用塑造性的含义，脚注保留纠正和惩戒的可能。
lexical_decisions:
- source_word: יִסַּרְתִּי
  choice: 训练
  rationale: יסר可指管教、训诲、惩戒或训练。这里与“使他们的臂膀强壮”并列，较适合表达塑造、装备之意；同时用脚注保留其纠正或惩戒的可能含义。
- source_word: חִזַּקְתִּי
  choice: 使……强壮
  rationale: חזק的皮珥式在此意为“使强壮、加强”；采用使动表达，符合现代汉语习惯。
- source_word: זְרֹעוֹתָם
  choice: 他们的臂膀
  rationale: 原文直译为“他们的双臂/臂膀”。保留具体的身体意象，不将其直接抽象化为“力量”。
- source_word: וְאֵלַי
  choice: 与我作对
  rationale: 介词结构字面可指“向着我、对我”，但与“图谋恶事”连用时表达敌对方向；“与我作对”自然传达此意。
- source_word: יְחַשְּׁבוּ רָע
  choice: 图谋恶事
  rationale: חשב与רע搭配表示筹划、谋算恶事，不只是心中泛泛地想到邪恶；“图谋恶事”兼顾行动意向和道德分量。
- source_word: וַאֲנִי
  choice: 我虽
  rationale: 连词与强调代词在上下文中形成让步对比：尽管上帝训练并加强他们，他们仍以恶回应。汉语以“虽……却……”清楚呈现这一关系。
theological_decisions:
- issue: יִסַּרְתִּי所描述的上帝行动是塑造训练，还是惩戒管教
  choice: 正文采用较具塑造和装备意味的“训练”
  alternative: 管教；惩戒
  rationale: 紧接的平行语“使他们的臂膀强壮”倾向于正面的装备之举，但希伯来词本身仍可带纠正或惩戒意味，因此不在正文中消除这一张力，而以脚注保留其他读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“臂膀”保留原文具体意象；“我虽……他们却……”呈现鲜明的恩待与背叛之对比。
