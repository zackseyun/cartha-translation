  terminology: “训练”“强壮”“臂膀”“图谋恶事”均符合原文语义和现代汉语宗教文本的适当语域。脚注准确说明“训练”所依据的形成性含义，并保留该动词可指纠正或惩戒的真实词义范围；锚点位置正确。
