  source_fidelity: 译文准确对应希伯来文的两组动作：יִסַּרְתִּי译为“训练”，并以脚注保留“管教／惩戒”的语义可能；חִזַּקְתִּי זְרֹעוֹתָם译为“使他们的臂膀强壮”，保留了具体的“臂膀”意象。结尾“他们却图谋恶事与我作对”恰当表达וְאֵלַי יְחַשְּׁבוּ רָע中恶意筹划指向上帝的敌对意味。“虽……却……”是对上下文对比关系的自然、可接受呈现。
