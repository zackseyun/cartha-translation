  text: יָשׁ֣וּבוּ לֹ֣א עָ֗ל הָיוּ֙ כְּ/קֶ֣שֶׁת רְמִיָּ֔ה יִפְּל֥וּ בַ/חֶ֛רֶב שָׂרֵי/הֶ֖ם מִ/זַּ֣עַם לְשׁוֹנָ֑/ם ז֥וֹ לַעְגָּ֖/ם בְּ/אֶ֥רֶץ מִצְרָֽיִם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/016.yaml
  text: They turn[a], but not upward; they are like a deceitful bow. Their princes will fall by the sword because of the insolence of their tongue[b]. This will be their mockery in the land of Egypt.
translation:
  language: zh_hans
  text: 他们回转[a]，却不是向上；他们好像一张靠不住的弓[b]。他们的首领必倒在刀下，因为他们口出狂言；这必使他们在埃及地遭人讥笑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们回转，却不是归向至高者。”这里的“向上”可能省略地指向上帝，并可能受到上一节“至高者”一词的影响。
    reason: alternative_reading
  - marker: b
    text: “靠不住的弓”也可译作“松弛的弓”、“诡诈的弓”或“有毛病的弓”，指一张不能可靠地射中目标的弓。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: 他们回转
  rationale: שׁוב可表示“转向、返回”。本节涉及属灵与政治上的转向，“回转”既保留先知话语的伦理意味，也不把方向解释得过于具体。
- source_word: לֹא עָל
  choice: 却不是向上
  rationale: 希伯来文本直译近于“不向上”，措辞艰难；本句没有明确写出“至高者”，因此正文保留方向性表达，并在脚注列出以上帝为所指的可能解释。
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: 好像一张靠不住的弓
  rationale: רְמִיָּה可指诡诈、背信或不可靠；用于弓时，重点是弓不能可靠地射中目标。“靠不住的弓”在现代汉语中自然地传达这一意象，同时以脚注保留“松弛、诡诈、有毛病”等词义可能。
- source_word: יִפְּלוּ בַחֶרֶב
  choice: 必倒在刀下
  rationale: 这是表示死于兵刃或审判的常见表达；“倒在刀下”庄重、自然，并保留原文意象。
- source_word: שָׂרֵיהֶם
  choice: 他们的首领
  rationale: שַׂר可指首领、官长或贵族。“首领”适合此处政治语境，也便于现代读者理解。
- source_word: מִזַּעַם לְשׁוֹנָם
  choice: 因为他们口出狂言
  rationale: זַעַם本义涉及愤怒、忿激或激烈冒犯；与“舌头”相连时，所指是狂妄、挑衅而激烈的话。“口出狂言”以自然汉语表达其功能，但不限定为单纯的怒气。
- source_word: לַלְעְגָּם
  choice: 使他们……遭人讥笑
  rationale: לַעַג指讥笑、嘲弄。原文名词结构可理解为他们成为讥笑的对象；汉语用“使他们遭人讥笑”清楚表达这一结果。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 保留原文完整地名结构及先知文学的庄重语感。
theological_decisions:
- issue: לֹא עָל的所指
  choice: 正文译作“却不是向上”
  alternative: “却不是归向至高者”
  rationale: 本节马所拉文本没有明确出现“至高者”；虽然上节的עֶלְיוֹן可能影响本句的省略理解，但正文不应无标记地补入神称。脚注保存这一重要解释。
- issue: זֹו לַלְעְגָּם的句法功能
  choice: 译为前述审判将使他们在埃及遭人讥笑
  alternative: “这就是他们在埃及地所讥笑的”或较直译的“这将是他们的讥笑”
  rationale: לַעַג通常指嘲弄或被嘲弄的对象；上下文较自然地指他们因审判而成为笑柄，但原文简略，译文仅补足汉语所需的结果关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“回转”“倒在刀下”“埃及地”保留先知文学语感；“靠不住的弓”“口出狂言”“遭人讥笑”则避免生硬直译。所有脚注标记均已置于正文相应位置。
