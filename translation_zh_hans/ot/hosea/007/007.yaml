  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֻּלָּ֤/ם יֵחַ֨מּוּ֙ כַּ/תַּנּ֔וּר וְ/אָכְל֖וּ אֶת שֹֽׁפְטֵי/הֶ֑ם כָּל מַלְכֵי/הֶ֣ם נָפָ֔לוּ אֵין קֹרֵ֥א בָ/הֶ֖ם אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/007.yaml
  text: All of them are hot like an oven[a], and they devour their judges; all their kings have fallen. None among them calls to me.
translation:
  language: zh_hans
  text: '他们全都热得像火炉，吞吃他们的审判官[a]；

    他们的君王全都倒下了，

    他们中没有一个向我呼求。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“统治者”。这个希伯来词也可泛指掌权施政的人，不仅指司法官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: 他们全都
  rationale: 保留希伯来文总括性的指控，也以自然的现代汉语引出全句。
- source_word: יֵחַמּוּ
  choice: 热得
  rationale: חמם表示发热、变热；与“像火炉”连用时，“热得像火炉”自然地保留比喻，不擅自限定为情欲、怒火或谋反激情。
- source_word: כַּתַּנּוּר
  choice: 像火炉
  rationale: 直译明喻，并保留本段反复出现的炽热、具有毁灭性的火炉意象。
- source_word: וְאָכְלוּ
  choice: 吞吃
  rationale: 保留“吃”的强烈暴力隐喻；汉语不强加明确时体，容纳希伯来完成式在此可能表达既成行为、概括性结果或生动描述的张力。
- source_word: אֶת שֹׁפְטֵיהֶם
  choice: 他们的审判官
  rationale: שֹׁפְטִים直接可指施行审判者；脚注同时保留其在政治语境中泛指统治者或执政者的可能。
- source_word: כָּל מַלְכֵיהֶם
  choice: 他们的君王全都
  rationale: 保留כָּל的总括性，并与句首“全都”形成对应。
- source_word: נָפָלוּ
  choice: 倒下了
  rationale: “倒下”保留君王死亡、被推翻或失势等可能，不把具体方式写入译文。
- source_word: אֵין קֹרֵא בָהֶם אֵלָי
  choice: 他们中没有一个向我呼求
  rationale: 保留存在否定和“在他们中”的范围；“向我呼求”自然表达转向上帝求告的含义。
theological_decisions:
- issue: 是否明确解释火炉所象征的具体激情
  choice: 只保留“热得像火炉”的比喻
  alternative: 译作“欲火中烧”“怒火中烧”或“因谋反而发热”
  rationale: 上下文可让人联想到欲望、怒气和政治阴谋，但本节没有明说是哪一种；译文不应消除这种开放性。
- issue: שֹׁפְטֵיהֶם是狭义的司法审判者还是广义的统治者
  choice: 正文译“审判官”，脚注保留“统治者”
  alternative: 正文直接译“统治者”或“官长”
  rationale: 正文优先呈现该词较直接的词义，同时借脚注说明先知政治批判语境中的广义用法。
- issue: 君王“倒下”具体指死亡还是被废黜
  choice: 保留“倒下了”
  alternative: 译作“被杀了”或“被推翻了”
  rationale: 希伯来文נפל本身没有在此限定倒下的具体方式，故不作窄化。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。三分句保持原文递进：炽热的状态、吞噬政治领袖的暴行、君王相继倒下，最后以无人向上帝呼求收束。正文脚注标记[a]已与脚注对应。
