  text: וַ/יְהִ֣י אֶפְרַ֔יִם כְּ/יוֹנָ֥ה פוֹתָ֖ה אֵ֣ין לֵ֑ב מִצְרַ֥יִם קָרָ֖אוּ אַשּׁ֥וּר הָלָֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/011.yaml
  text: Ephraim has become like a silly dove[a], without sense; they call to Egypt, they go to Assyria.
translation:
  language: zh_hans
  text: 以法莲成了像一只愚蠢、毫无见识的鸽子；他们向埃及求助，前往亚述。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 成了
  rationale: 该形式引出以法莲如今所处的结果状态；“成了”既自然，也保留状态转变之意。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 原文明确使用专名；虽然在何西阿书中常代指北国，正文仍保留原称，避免直接释作“以色列”。
- source_word: כְּיוֹנָה
  choice: 一只……的鸽子
  rationale: יוֹנָה通常指鸽子；中文量词使比喻自然流畅。
- source_word: פוֹתָה
  choice: 愚昧
  rationale: 该词表达幼稚、轻信、容易受骗；“愚昧”保留先知责备的力度，又适合庄重的现代汉语。
- source_word: אֵין לֵב
  choice: 无知
  rationale: 字面是“没有心”，其中“心”指理解力、判断力；“无知”与“愚昧”组成自然的汉语表达，传达缺乏辨识力。
- source_word: מִצְרַיִם קָרָאוּ
  choice: 他们向埃及求援
  rationale: קרא在此语境表示向埃及呼求、寻求帮助；“求援”清楚呈现外交求助的含义，避免中文“呼叫埃及”的歧义。
- source_word: אַשּׁוּר הָלָכוּ
  choice: 又投奔亚述
  rationale: הלך字面为“去、前往”；在寻求外国势力帮助的上下文中，“投奔”自然表达前去倚靠亚述，同时未把具体外交形式说得过细。
theological_decisions:
- issue: “以法莲”的所指
  choice: 正文保留“以法莲”，让其在语境中代表北国群体。
  alternative: 直接译作“以色列”或“北国”。
  rationale: 保留原文专名可避免把先知的转喻在正文中解释得过满，也保有何西阿书的历史和修辞特色。
- issue: 埃及与亚述之间的关系
  choice: 用“向埃及求援，又投奔亚述”并列呈现两种外交倚靠。
  alternative: 明确解释为在两强之间摇摆或同时结盟。
  rationale: 原文只陈述他们向埃及呼求、往亚述而去；译文不进一步断定行动的时间关系或具体条约性质。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“愚昧无知”传达 פוֹתָה אֵין לֵב 的整体责备；不保留生硬的“没有心”。后半句用“求援／投奔”呈现外交语境，并以“又”保持希伯来语简短并列的节奏。
