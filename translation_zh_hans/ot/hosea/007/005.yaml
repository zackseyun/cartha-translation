  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: י֣וֹם מַלְכֵּ֔/נוּ הֶחֱל֥וּ שָׂרִ֖ים חֲמַ֣ת מִ/יָּ֑יִן מָשַׁ֥ךְ יָד֖/וֹ אֶת לֹצְצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/005.yaml
  text: On the day of our king[a], the princes made themselves sick with the heat of wine[c][b]; he stretched out his hand with mockers.
translation:
  language: zh_hans
  text: 在我们王的日子[a]，众首领因酒的灼热[b]而病倒；他向嘲讽者伸出手[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我们王的节庆日。”原文直译为“我们王的日子”，可能指为王举行宴饮庆典的日子，但没有明确说是宴席。
    reason: lexical_alternative
  - marker: b
    text: “酒的灼热”也可理解为“酒的烧灼”，较不可能指“酒的毒性”。
    reason: lexical_alternative
  - marker: c
    text: “向嘲讽者伸出手”在这里可能表示王接纳他们，与他们交往或为伍。
    reason: cultural_note
lexical_decisions:
- source_word: י֣וֹם מַלְכֵּ֔נוּ
  choice: 在我们王的日子
  rationale: 保留希伯来语“我们王的日子”这一较为直译且含义开放的结构；“在”按现代汉语表达补出。不直接增译为“王的宴席之日”，因为原文并未明说宴席。
- source_word: הֶחֱל֥וּ
  choice: 病倒
  rationale: 此处按חלה的使役形理解为众首领因纵酒而使自己患病或变得虚弱。汉语“病倒”自然简洁，并与后面的酒意象相合，同时不采用争议较大的“开始”。
- source_word: שָׂרִ֖ים
  choice: 众首领
  rationale: 该词可指王公、官长或统治者。这里处于王室场景中，“众首领”既保留其权贵身份，又比现代汉语中的“王子们”更不易被误解为君王之子。
- source_word: חֲמַ֣ת מִיָּ֑יִן
  choice: 因酒的灼热
  rationale: חמה可表示热气、炽烈，也可表示毒性。译作“酒的灼热”保留原文鲜明而含混的比喻，不武断解释为酒毒；“因”自然表达其导致病倒的关系。
- source_word: מָשַׁ֥ךְ יָד֖וֹ
  choice: 他……伸出手
  rationale: 保留希伯来语“伸出手”的身体意象，不在正文中直接释为结交或同流合污；其社交含义由脚注说明。
- source_word: אֶת לֹצְצִֽים
  choice: 向嘲讽者
  rationale: לצצים指讥诮、嘲弄的人。结合“伸出手”，现代汉语用“向”表达动作所朝向或接纳的对象；其可能表示与他们为伍，留在脚注中说明。
theological_decisions:
- issue: “他向嘲讽者伸出手”中单数主语的身份
  choice: 正文保留为“他”，不明确补成“王”
  alternative: 可将其明确译为“王”，或按语意理解为众首领的集体行动
  rationale: 希伯来语动词和物主后缀均为阳性单数，最自然的先行词是前文的王；但原文没有再次点明主语，因此保留“他”，避免消除语法上仍存在的指代余地。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们王”保留宫廷中的群体视角；“众首领”避免把שׂרים误解成君王的儿子；正文保留“酒的灼热”和“伸出手”的原文意象，并以脚注交代可能含义。所有脚注标记均置于相应正文之后。
