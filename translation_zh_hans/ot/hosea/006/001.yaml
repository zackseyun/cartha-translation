  text: לְכוּ֙ וְ/נָשׁ֣וּבָה אֶל יְהוָ֔ה כִּ֛י ה֥וּא טָרָ֖ף וְ/יִרְפָּאֵ֑/נוּ יַ֖ךְ וְ/יַחְבְּשֵֽׁ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/001.yaml
  text: Come[a], let us return to Yahweh, for he has torn us, but he will heal us; he has struck us[b], but he will bind us up.
translation:
  language: zh_hans
  text: '来吧，我们归向雅威！


    因为他撕裂了我们[a]，也必医治我们；


    他击打了我们[b]，也必包扎我们的伤口。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撕裂”常用于猛兽撕扯猎物，突出审判的严厉。
    reason: cultural_note
  - marker: b
    text: 该动词形式也可理解为“他将击打”；这里根据它与上句“撕裂了”的诗歌平行关系，译为已经发生的行动。
    reason: textual_ambiguity
lexical_decisions:
- source_word: לְכוּ
  choice: 来吧
  rationale: 这是הלך的复数命令式，在“我们……”之前作劝勉语。现代汉语用“来吧”能自然表达共同响应的号召，而非实际空间方向上的“去”或“来”。
- source_word: וְנָשׁוּבָה
  choice: 我们归向
  rationale: שוב的第一人称复数鼓励式表达共同决意；“归向”既保留返回某一对象的方向感，也契合何西阿书中回转归向上帝的语境，而不直接解释为“悔改”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为以色列之上帝专名的性质，不用称号替代。
- source_word: טָרָף
  choice: 撕裂了我们
  rationale: 该动词常用于猛兽撕裂猎物；“撕裂”保留原文强烈的审判意象。宾语“我们”由后续平行分句中的代词后缀及整体诗意补明。
- source_word: וְיִרְפָּאֵנוּ
  choice: 也必医治我们
  rationale: 未完成式在此表达所期待的后续行动。“必”传达说话者对医治的确信；连接词译作“也”，保留希伯来文וְ的并列形式，让伤害与医治之间的反差由语境显出。
- source_word: יַךְ
  choice: 他击伤了我们
  rationale: 虽为未完成式/短式形态，但诗歌平行结构使其与前面的完成式טָרָף对应，宜理解为已经临到的击打。“击伤”兼顾打击动作及下句包扎伤口的意象；宾语“我们”依平行关系补出。
- source_word: וְיַחְבְּשֵׁנוּ
  choice: 也必包扎我们
  rationale: חבש在此指包扎伤处。“包扎我们”保留将群体描绘为伤者的比喻；“必”与前句“必医治”平行，表达预期的复原。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名而非称号；“雅威”是现代汉语中对YHWH的直接音译，可保留经文的专名性质。
- issue: 审判与复原的时序
  choice: 将“撕裂、击伤”译为已经发生，将“医治、包扎”译为将来且可期待的行动
  alternative: 把“击打”理解为将来动作；或把四个动作统一处理为同一时态
  rationale: 首组完成式与诗歌平行关系支持把撕裂、击伤视为既成的审判；两个带וְ的未完成式则表达所期待的医治与包扎。这样保留同一位上帝既施行审判又带来复原的张力。
- issue: 连接词וְ是否译成转折
  choice: 译作“也”，不明加“却/但”
  alternative: 译作“却必医治我们……却必包扎我们”
  rationale: 希伯来文连接词本身只是一般性的“和/而”；上下两行的反差已清楚可见。采用“也”既合乎自然汉语，又避免把语法上未明说的转折关系定得过死。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，按原文分为劝勉句和两组平行句。“来吧”自然传达共同号召；“归向”保留回转方向与盟约语境。“撕裂—医治、击伤—包扎”的意象和神学张力均予保留，未用解释性词语消解。
