base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/004.yaml
  text: What shall I do with you[a], Ephraim? What shall I do with you, Judah? Your loyalty is like a morning cloud, and like dew that goes away early.
translation:
  language: zh_hans
  text: “以法莲啊，我该拿你怎么办呢？犹大啊，我该拿你怎么办呢？你们的忠贞[a]如早晨的云，又如清早消散的露水。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠贞”所译的希伯来词也可译作“忠诚”、“慈爱”或“信实”；这里指关系中坚定不移的爱与忠诚，带有盟约背景。
    reason: 保留חֶסֶד的多重语义及其盟约关系色彩，避免正文以单一词义消除原文的丰富性。
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לְךָ
  choice: 我该拿你怎么办呢
  rationale: 保留反问中无奈、责问和斟酌的语气；现代汉语自然，同时不把它弱化为单纯询问行动方案。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 按通行中文圣经人名音译；这里虽代表北国，原文仍直接以该名称呼。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 按通行中文圣经人名音译，并保留其与“以法莲”的平行称呼。
- source_word: חַסְדְּכֶם
  choice: 你们的忠贞
  rationale: חֶסֶד在此指向关系中的忠诚与坚贞；“忠贞”兼顾忠诚和情爱色彩，又避免在正文中加入原文未明说的“盟约”一词。其丰富含义以脚注说明。
- source_word: כַּעֲנַן בֹּקֶר
  choice: 如早晨的云雾
  rationale: עָנָן本义为“云”；“云雾”在现代汉语中更自然地传达清晨短暂易散的景象，同时保留云的意象。
- source_word: וְכַטַּל
  choice: 又如……露水
  rationale: 准确保留与前一意象平行的明喻；“又如”使中文对偶自然。
- source_word: מַשְׁכִּים הֹלֵךְ
  choice: 清早消散
  rationale: מַשְׁכִּים表示早早发生，הֹלֵךְ在此语境表示离去、消失；合译为“清早消散”清楚呈现露水迅速逝去。
theological_decisions:
- issue: 先知书盟约语境中חֶסֶד的译法
  choice: 忠贞
  alternative: 忠诚、慈爱、信实、盟约之爱
  rationale: 本节责备以法莲和犹大对神的回应转瞬即逝。译作“忠贞”可保留关系性的爱与忠诚，却不把该词缩减为情感，也不在正文中明确添加“盟约”这一解释性限定；其他可能义项收入脚注，以保存原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我该拿你怎么办呢”体现神责问中的痛惜与无奈；两个平行问句及“云雾／露水”的短暂意象均予保留。脚注标记[a]已置于对应词后。
