base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/009.yaml
  text: And like men lying in wait[a], a band of priests murders on the way to Shechem; indeed[b], they have committed wickedness.
translation:
  language: zh_hans
  text: 如同埋伏等候的人[a]，一伙祭司在通往示剑的路上杀人；他们实在犯下了恶行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来文含义不易确定。也可译作：“强盗怎样埋伏等候一个人，祭司一伙也怎样在通往示剑的路上杀人。”
    reason: alternative_reading
  - marker: b
    text: “恶行”也可译作“骇人的罪行”或“无耻的恶事”。希伯来词所指的是极其邪恶、令人震惊的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְחַכֵּי אִישׁ גְּדוּדִים
  choice: 如同结伙埋伏等人的匪徒
  rationale: 这段希伯来文结构紧缩且含义不易确定；译文保留“埋伏等候”与成群劫掠者的暴力意象，同时用现代汉语自然表达比喻。
- source_word: חֶבֶר כֹּהֲנִים
  choice: 祭司也结成一伙
  rationale: חֶבֶר指结成的群体；“结成一伙”既传达群体性，也符合本节阴谋行凶的负面语境。
- source_word: דֶּרֶךְ
  choice: 在通往……的路上
  rationale: 保留“道路”的地点含义，并与带方向词尾的地名自然衔接。
- source_word: יְרַצְּחוּ
  choice: 杀人
  rationale: רצח通常指非法、罪恶的杀人，而非泛指杀死；“杀人”在本语境中简洁而明确。
- source_word: שֶׁכְמָה
  choice: 通往示剑
  rationale: 地名“示剑”带方向词尾，故译出“通往”的趋向意义。
- source_word: כִּי
  choice: 实在
  rationale: 此处可作强调和说明，而不必限定为严格的因果连接；“实在”符合先知谴责的语气。
- source_word: זִמָּה
  choice: 恶行
  rationale: 该词指骇人、无耻或邪恶的行为；这里没有充分依据将其限定为淫乱，故用较宽而严厉的“恶行”。
- source_word: עָשׂוּ
  choice: 犯下了
  rationale: 与“恶行”搭配自然，并表达该行为已经发生。
theological_decisions:
- issue: וּכְחַכֵּי אִישׁ גְּדוּדִים这一困难比喻的句法与所指
  choice: 将其理解为以结伙埋伏的匪徒比喻祭司群体
  alternative: 可理解为“强盗怎样埋伏等候一个人，祭司一伙也怎样在通往示剑的路上杀人”；也可能是残缺或省略的句式。
  rationale: 希伯来文十分紧缩，具体句法存在争议；正文保存埋伏、匪徒和群体暴力的核心意象，脚注则说明另一种组织句法的方式，不把疑难处暗中定死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“结伙”“杀人”“恶行”保持先知谴责的直接力度；正文不将זִמָּה收窄为性方面的罪，也以脚注保留开头希伯来文的句法歧义。
