  text: וְ/הֵ֕מָּה כְּ/אָדָ֖ם עָבְר֣וּ בְרִ֑ית שָׁ֖ם בָּ֥גְדוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/007.yaml
  text: But they[a], like Adam, transgressed the covenant; there they dealt faithlessly with me.
translation:
  language: zh_hans
  text: 但他们[a]像亚当一样，违背了盟约；他们在那里对我行事诡诈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像人一样”或“像人类一样”。希伯来语“亚当”既可指亚当本人，也可泛指人或人类。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵמָּה
  choice: 但他们
  rationale: וְ 可在上下文中表达转折，הֵמָּה 带强调意味；译为“但他们”既呈现与上文的反差，也保留对“他们”的强调。
- source_word: כְּאָדָם
  choice: 像亚当一样
  rationale: אָדָם 既可作专名“亚当”，也可泛指“人”或“世人”。正文采用专名读法，因为“违背了约”可能使人联想到起初的违命；原文真实存在的歧义则在脚注中保留。
- source_word: עָבְרוּ
  choice: 违背了
  rationale: עָבַר 与“约”连用时表示越过约的界限、违反约定。“违背”在现代汉语中自然，并保留其盟约语境中的分量。
- source_word: בְרִית
  choice: 约
  rationale: 希伯来语形式上没有冠词，但语境指向与上帝之间特定的约的关系。汉语“违背了约”无需添加量词或指示词，也能自然表达其特指意味。
- source_word: שָׁם
  choice: 在那里
  rationale: שָׁם 最直接的空间义是“在那里”；其具体所指在本节中并未明说，译文不加解释，以保留原文的含蓄。
- source_word: בָּגְדוּ
  choice: 背叛了
  rationale: בגד 表示以不忠、诡诈的方式背弃关系，常用于约的语境。“背叛”准确传达这种关系性的失信，也符合现代汉语表达。
- source_word: בִי
  choice: 我
  rationale: בגד 与介词 בְּ 连用，表示背信所针对的对象。汉语以“背叛了我”自然表达，不必把介词单独译出。
theological_decisions:
- issue: 盟约语境中 כְּאָדָם 的解释
  choice: 像亚当一样
  alternative: 像人一样／像世人一样
  rationale: אָדָם 可以是人名“亚当”，也可以泛指人类。正文采用前者，以保留可能指向人类起初违命的互文联系；脚注列出泛指读法，避免把有争议的解释表述为唯一可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“违背了约”保留盟约语义；“背叛了我”比“对我行事诡诈”更自然直接。“在那里”的所指不明，依原文保留，不作补充解释。
