base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/005.yaml
  text: Therefore I have hewn them by the prophets; I have slain them by the words of my mouth[a], and my judgments go forth like light.
translation:
  language: zh_hans
  text: 因此，我借着先知砍伐他们；我以口中的话击杀他们。你的判决[a]必如光显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的判决必如光显现。”希伯来文本读作“你的判决”，但有些解释者根据上下文理解为上帝的判决或公义显现。
    reason: 说明“你的”这一第二人称后缀所形成的文本与释义分歧；正文遵循所给马所拉文本的读法。
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接上文的指控，表达由此而来的结果，简洁自然。
- source_word: חָצַבְתִּי
  choice: 砍削
  rationale: 保留原词砍凿木石的强烈意象；既可让人想到劈砍，也可含塑造意味，不将隐喻过早解释为单纯惩罚。
- source_word: בַּנְּבִיאִים
  choice: 借先知
  rationale: 这里的介词表示手段；“借先知”自然地表达上帝以先知为施行话语的媒介。
- source_word: הֲרַגְתִּים
  choice: 击杀他们
  rationale: 忠实保留动词的严厉力度，同时符合庄重的诗性语体。
- source_word: בְּאִמְרֵי פִי
  choice: 以我口中的话
  rationale: 保留神亲口发言的具体形象，也清楚表明击杀所用的手段。
- source_word: וּמִשְׁפָּטֶיךָ
  choice: 你的判决
  rationale: 按所给马所拉文本的元音与第二人称阳性单数后缀直译为“你的”；“判决”比“律例”更贴合司法与审判语境。
- source_word: אוֹר
  choice: 如光
  rationale: 希伯来文没有显式比较词，但此处自然理解为以光作表语性比拟；“如光”在中文中凝练而清楚。
- source_word: יֵצֵא
  choice: 发出
  rationale: 表达判决显现、传出或施行的动态，并保持诗句简洁。
theological_decisions:
- issue: וּמִשְׁפָּטֶיךָ 的人称后缀及“判决”的归属
  choice: 你的判决如光发出
  alternative: 我的判决如光发出；判决如光发出
  rationale: 所给WLC文本读作第二人称单数“你的”，虽在上下文中较难理解，仍应在正文保留这一真实文本张力。部分解释依据语境理解为上帝的判决，故列入脚注而不在正文中替换。
- issue: 先知话语“击杀”的性质
  choice: 保留“击杀”隐喻，不解释为属灵定罪或实际处死
  alternative: 借先知责打、宣判他们
  rationale: 原文使用强烈的死亡动词，但没有明确说明其作用方式；直保留可避免导入特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“砍削—击杀—如光发出”保留原句鲜明而紧凑的先知性意象；分号呈现两个平行的第一人称行动，末句则保留希伯来文本中突转为第二人称的张力。
