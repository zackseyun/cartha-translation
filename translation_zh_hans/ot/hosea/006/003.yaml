id: HOS.6.3
reference: Hosea 6:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נֵדְעָ֣ה נִרְדְּפָ֗ה לָ/דַ֨עַת֙ אֶת יְהוָ֔ה כְּ/שַׁ֖חַר נָכ֣וֹן מֽוֹצָא֑/וֹ וְ/יָב֤וֹא כַ/גֶּ֨שֶׁם֙ לָ֔/נוּ כְּ/מַלְק֖וֹשׁ י֥וֹרֶה אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/003.yaml
  text: So let us know[a]; let us press on to know Yahweh. His going forth is as sure as the dawn, and he will come to us like the rain[d][c][b], like the spring rain that waters the earth.
translation:
  language: zh_hans
  text: 让我们认识雅威，竭力追求[a]认识他。他的出现[b]如晨曦一样确实；他必临到[c]我们，如同雨，如同滋润大地的春雨[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “竭力追求”也可译作“紧紧追随”或“奋力寻求”。原文动词本义是“追赶”。
    reason: lexical_alternative
  - marker: b
    text: “出现”原文直译为“出去”或“出来”，这里可能指他的显现。
    reason: lexical_alternative
  - marker: c
    text: “他必临到”也可理解为愿望：“愿他临到我们，如同雨。”原文动词形式容许这两种理解。
    reason: alternative_reading
  - marker: d
    text: “春雨”原文指雨季后段的雨，即作物成熟前对农耕十分重要的晚季雨，传统上也译作“后雨”。
    reason: cultural_note
lexical_decisions:
- source_word: וְנֵדְעָה
  choice: 我们要认识
  rationale: 第一人称复数鼓励式表达共同的劝勉和决心。保留“认识”而不补出宾语，使它与下句“认识雅威”形成希伯来诗歌式递进。
- source_word: נִרְדְּפָה לָדַעַת
  choice: 竭力追求认识
  rationale: רדף本义为追赶、追求；这里表示坚持不懈地寻求认识雅威。“竭力追求”兼顾原词力度和现代汉语的自然表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号代替。
- source_word: כְשַׁחַר נָכוֹן מוֹצָאוֹ
  choice: 他的出现确如晨曦，必定来到
  rationale: שׁחר是晨曦；נכון表示确定、稳固。מוצא字面为“出来、出发”，此处指雅威如晨曦般显现。译文既表达比喻的确定性，也用脚注保留字面意象。
- source_word: וְיָבוֹא
  choice: 他必临到
  rationale: 未完成式在此最自然地表达有把握的将来；“临到”符合庄重语体，并准确表达朝向“我们”而来。
- source_word: כַגֶּשֶׁם
  choice: 如同雨水
  rationale: גשם是雨的通称；“雨水”在汉语中自然地传达其滋养生命的形象。
- source_word: כְמַלְקוֹשׁ
  choice: 如同……春雨
  rationale: מלקוש指作物成熟前的晚季雨，发生于当地春季；“春雨”比“后雨”更便于现代读者理解，具体农业背景由脚注说明。
- source_word: יוֹרֶה אָרֶץ
  choice: 滋润大地
  rationale: 此处表示降雨在地上或使地得水。“滋润大地”以自然汉语表达雨水的作用，同时不把“地”局限为特定疆域。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。音译“雅威”保留专名性质，避免以称号取代，也不把较晚形成的传统读音写入正文。
- issue: וְיָבוֹא的语气
  choice: 确定的将来：他必临到
  alternative: 愿他临到；让他临到
  rationale: 前句以晨曦的确定性为背景，后句又以季节性雨水作比，整体更像信心宣告。不过，该动词也可能具有愿望语气，因此在脚注中保留另一理解。
- issue: ידע的内涵
  choice: 认识
  alternative: 承认；认定
  rationale: “认识”保留原词可能包含的认知、关系及盟约忠诚等多重内涵，不在正文中将其缩减为单纯知道或口头承认。
- issue: מוצאו所指
  choice: 他的出现
  alternative: 他的出来；他的升起
  rationale: 上下文将雅威比作晨曦，可能指他的显现或来临。“出现”可读且不过度具体化；脚注保留原文“出来”的空间意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留希伯来诗歌的平行推进：“认识—竭力追求认识”，并以“晨曦—雨水—春雨”维持原有自然意象。正文避免教派化解释；语气、词义和农业背景的真实歧义均以脚注交代。
