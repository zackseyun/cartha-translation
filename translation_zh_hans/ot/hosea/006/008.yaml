lexical_decisions:
- source_word: גִּלְעָד
  choice: 基列
  rationale: 沿用现代中文圣经中通行的地名译法。
- source_word: קִרְיַת
  choice: ……的城
  rationale: 这是附属形式，连接后面的分词短语；译为“……之人的城”自然且忠实。
- source_word: פֹּעֲלֵי אָוֶן
  choice: 作恶之人
  rationale: 该组合指惯行邪恶的人；“作恶之人”简明、庄重，并保留行为层面的含义。
- source_word: עֲקֻבָּה
  choice: 遍留……迹
  rationale: 该词罕见且含义困难，可能描写留下足迹、踪迹或痕迹；结合“血”，译作“遍留血迹”保留其踪迹意象，同时符合现代汉语。
- source_word: מִדָּם
  choice: 血迹
  rationale: 介词与前词的搭配较难确定；合译为“血迹”表达被血留下踪迹或印记的可能含义，而不过度限定是沾染还是足印。
