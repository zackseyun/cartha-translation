  text: כִּ֛י חֶ֥סֶד חָפַ֖צְתִּי וְ/לֹא זָ֑בַח וְ/דַ֥עַת אֱלֹהִ֖ים מֵ/עֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/006.yaml
  text: For I desire steadfast love and not sacrifice[b][a], and the knowledge of God rather than burnt offerings.
translation:
  language: zh_hans
  text: 因为我喜爱忠诚之爱[a]，不喜爱祭牲；我喜爱认识上帝，胜过燔祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠诚之爱”也可译作“怜悯”“坚定的爱”或“忠贞的爱”。希伯来语 חֶסֶד 可同时包含盟约中的忠诚、坚定的爱和怜悯。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“多于燔祭”；这里表达偏爱和优先，可译作“胜过燔祭”或“而不是燔祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的责备说明理由；“因为”自然保留解释性的语气。
- source_word: חֶסֶד
  choice: 忠贞的爱
  rationale: 兼顾盟约关系中的忠诚、恒久之爱与怜悯，不把词义缩减为情感或单纯慈悲。
- source_word: חָפַצְתִּי
  choice: 我喜爱
  rationale: 表达意愿和以某事为喜悦；在两组礼仪对比中，“喜爱”自然且庄重。
- source_word: זָבַח
  choice: 祭牲
  rationale: 指献祭中宰杀的祭物；译作“祭牲”既保留礼仪含义，也与下句较具体的“燔祭”有别。
- source_word: דַעַת אֱלֹהִים
  choice: 认识上帝
  rationale: 这里不只是拥有关于上帝的知识，也包括关系性、盟约性的认识；动词化表达在现代汉语中更自然。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 原文使用通称 אֱלֹהִים，而非四字神名；因此译为“上帝”。
- source_word: מֵעֹלוֹת
  choice: 胜过燔祭
  rationale: 介词 מִן 在此表达比较和优先次序；“胜过”保留偏重之意，不将经文解释成绝对废除献祭。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 这是整只焚烧在坛上的祭物之标准礼仪用语。
theological_decisions:
- issue: 本节是绝对否定献祭，还是强调优先次序
  choice: 保留诗句的强烈否定，同时由第二分句明确表达：忠贞之爱和认识上帝优先于礼仪献祭
  alternative: 把本节译成对献祭制度的绝对废除
  rationale: 第一分句采用“不是……而是……”式的先知性对比，第二分句的比较介词 מִן 表达“胜过／多于”。译文不削弱责备的力度，也不额外断定一切献祭本身均被否定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个分句以“我喜爱”形成平行结构；“祭牲／燔祭”保留一般祭物与特定全烧祭之间的区别。脚注标记均置于相关词语之后。
