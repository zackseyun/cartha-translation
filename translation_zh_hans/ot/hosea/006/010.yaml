base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/010.yaml
  text: 'In the house of Israel I have seen a horrible thing: there is prostitution in Ephraim[c][b][a]; Israel has defiled itself.'
translation:
  language: zh_hans
  text: 在以色列家中，我看见了一件骇人的事[a]：在那里，以法莲有淫乱[b]；以色列已经污秽了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一件可憎的事”或“一件令人震惊的事”。原文所用的词指骇人、惊人或极其恶劣的事。
    reason: lexical_alternative
  - marker: b
    text: 原文结构简略，也可译作“在那里，以法莲行淫”或“那里有属于以法莲的淫乱”。介词可表达地点、归属或关联。
    reason: alternative_reading
  - marker: c
    text: 或译：“以色列已经玷污自己”“以色列已经变得不洁”或“以色列已经被玷污”。原文形式可着重状态、状态的变化或反身意义。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּבֵית יִשְׂרָאֵל
  choice: 在以色列家中
  rationale: 保留“家”的盟约群体和家族意象，同时以自然的现代汉语表达 בְּ 的范围或处所意义。
- source_word: רָאִיתִי
  choice: 我看见了
  rationale: 希伯来语完成式第一人称单数在此陈述先知已经目睹的事实；“看见了”简洁自然。
- source_word: שעריריה
  choice: 一件骇人的事
  rationale: 该词表示令人震惊、可憎或骇然的事；“骇人的事”保留强烈的道德震撼感，又不显陈旧。
- source_word: שָׁם
  choice: 那里
  rationale: 明确保留指回前述“以色列家”的地点副词，不将其隐去。
- source_word: זְנוּת
  choice: 淫乱
  rationale: “淫乱”在现代中文中既可指性方面的不忠，也能承载《何西阿书》中对盟约背叛的隐喻，不把含义限定为单一层面。
- source_word: לְאֶפְרַיִם
  choice: 以法莲那里有
  rationale: לְ 与 זְנוּת 构成简缩表达，可表示地点、归属或关联；正文采用通顺的地点性表达，并在脚注中保留其他可能。
- source_word: נִטְמָא
  choice: 已经染上污秽
  rationale: Nifal 形式可表示处于污秽状态或变得不洁；此译保留结果状态，同时避免把反身施事意义写得过满。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留盟约群体的名称，也维持本节“以色列家”“以法莲”“以色列”之间的修辞区分。
theological_decisions:
- issue: זְנוּת 应主要指实际的性罪，还是以性不忠比喻偶像崇拜和盟约背叛
  choice: 正文译作“淫乱”，让字面的性不忠与盟约不忠的隐喻张力同时存在。
  alternative: 卖淫；邪淫；不忠
  rationale: 《何西阿书》反复借婚姻和性不忠描绘以色列对耶和华的不忠；“淫乱”不强行排除字面或隐喻中的任何一面。
- issue: נִטְמָא 是单纯描述“处于污秽中”，还是强调以色列主动玷污自己
  choice: 译作“已经染上污秽”。
  alternative: 已经玷污自己；已经变得不洁；已经被玷污
  rationale: 希伯来语 Nifal 在这里允许状态、状态变化及反身色彩；正文采用不过度指定施事关系的表达，脚注列出主要译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以色列家”保留先知文本的群体和家族意象；“骇人的事”“淫乱”“染上污秽”均为普通读者易懂而又具有先知性力度的表达。
