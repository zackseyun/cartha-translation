  text: גַּם יְהוּדָ֕ה שָׁ֥ת קָצִ֖יר לָ֑/ךְ בְּ/שׁוּבִ֖/י שְׁב֥וּת עַמִּֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/011.yaml
  text: Also for you[a], Judah, a harvest is appointed[b], when I restore the fortunes of my people.
translation:
  language: zh_hans
  text: 犹大啊，也为你定下了一场收割[a]；当我使我子民的境况复原时[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大啊，也为你设下了收割。”
    reason: 保留 שָׁת קָצִיר לָךְ 较贴近字面的表达，不将“收割”具体化为“收割的时候”。
  - marker: b
    text: 或译：“当我使我子民从被掳中归回时。”希伯来语这一表达也可指使他们的境况复原。
    reason: 说明 שְׁבוּת 可按较字面的“被掳”理解，也可作为恢复、扭转困境的较宽泛表达。
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 保留其追加作用，把犹大也纳入前文所说的范围。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代汉语圣经语境中通行的专名译法。
- source_word: שָׁת קָצִיר לָךְ
  choice: 为你定下了收割的时候
  rationale: שָׁת 表示设立、安置或定下；קָצִיר 基本义为收割、收获。此译既保留隐喻，也以自然汉语表达为犹大所定的收割。
- source_word: בְּשׁוּבִי
  choice: 那时，我要使……复原
  rationale: 该结构字面可理解为“在我使……回转时”；与 שְׁבוּת 连用构成复兴或扭转困境的表达，汉语用时间分句较自然。
- source_word: שְׁבוּת עַמִּי
  choice: 我子民的境况
  rationale: שְׁבוּת 在先知书的固定表达中可指被掳，也可泛指衰败的处境或命运；正文采用较宽泛的“境况”，并由“复原”表达扭转与恢复。
theological_decisions:
- issue: “收割”究竟指审判还是祝福
  choice: 正文只保留“收割”的隐喻，不加性质说明
  alternative: 译作“审判的收割”或“蒙福的收获”
  rationale: 上下文含有强烈的审判意味，后半句却使用复兴语言；原文没有明说收割的性质，因此不在翻译中消除这种张力。
- issue: שְׁבוּת 是专指被掳，还是泛指境况的复原
  choice: 正文译为“使我子民的境况复原”
  alternative: “使我被掳的子民归回”或“使我子民从被掳中归回”
  rationale: 该希伯来表达可涉及被掳归回，也常作为扭转困境、恢复景况的公式用语。正文采用能够涵盖二者的译法，脚注保留较字面的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“犹大啊”明确呼语；分号呈现两小句之间紧密但未完全明说的关系。正文不把“收割”解释为审判或祝福，以保留原文张力。
