  to: 过了两天，他必使我们复苏[a]；第三天，他必使我们重新站立起来[b][c]，我们就得以在他面前存活[d]。
  rationale: 修订只改善现代汉语的时间指向、动作表达和句法衔接。“过了两天……第三天”保留原文的两日—第三日序列；“重新站立起来”保持复兴、扶起及可能的复活意象而不作教义限定；末句以结果性表达保留 וְ 的语义弹性。所有原有脚注锚点均保留并与相应词语对应。
