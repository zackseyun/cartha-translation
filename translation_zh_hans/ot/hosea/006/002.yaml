base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/002.yaml
  text: He will revive us after two days[a]; on the third day he will raise us up[d][c][b], that we may live before him.
translation:
  language: zh_hans
  text: 过了两天，他必使我们复苏[a]；第三天，他必使我们重新站立起来[b][c]，我们就得以在他面前存活[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在两天内”。希伯来文的时间表达可指一段短暂时期，随后进入第三天。
    reason: lexical_alternative
  - marker: b
    text: “使我们重新站立起来”也可较广义地理解为“使我们恢复”或“使我们站立起来”。
    reason: lexical_alternative
  - marker: c
    text: 本节直接说的是百姓得到恢复；许多基督徒也把“第三天”的措辞看作预表弥赛亚的复活。
    reason: cross_reference
  - marker: d
    text: “在他面前存活”也可译为“在他的同在中生活”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֵּנוּ
  choice: 他必使我们复苏
  rationale: חיה 的 Piel 形态在这里带有使役意义，即“使活过来”。“使我们复苏”既保留生命恢复的力度，也符合本段把百姓受创后得医治、重获生命的语境。
- source_word: מִיֹּמָיִם
  choice: 过两天
  rationale: 介词 מִן 与双数“日”构成时间表达，可理解为“过两天”或“在两天内”。正文采用自然且能与“第三天”衔接的“过两天”，另以脚注保留时间范围上的歧义。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 这是标准的时间表达；现代汉语中无需加“在”，即可自然、准确地表达“到了第三日”的意思。
- source_word: יְקִימֵנוּ
  choice: 他必使我们起来
  rationale: קום 的 Hiphil 形态可指“使站起来、扶起、兴起、恢复”。“使我们起来”紧扣原文动作意象，并与前句“使我们复苏”平行，同时不把复兴或复活的某一种解释写死。
- source_word: וְנִחְיֶה
  choice: 使我们活
  rationale: 连接词 וְ 在此可表达随之而来的结果，也可带目的意味。“使我们活”在汉语中顺畅地承接上帝的两个行动，表达其结果或目的。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 这是 לְפָנָיו 的直接对应，既可表示在上帝面前生活，也蕴含活在他同在中的关系意义；后一种译法在脚注中说明。
theological_decisions:
- issue: 是否把“第三天”直接译成关于弥赛亚复活的预言
  choice: 正文保留第一人称复数，直接呈现上帝使百姓复苏、起来的群体性复兴图景。
  alternative: 有些基督徒把“第三天”的措辞理解为在预表上指向弥赛亚的复活。
  rationale: 希伯来文直接说的是“我们”，上下文首先关乎百姓的恢复。正文不加入原句未明说的基督论限定，但脚注保留基督教正典阅读中的预表理解。
- issue: יְקִימֵנוּ 是指身体复活，还是较广义的恢复
  choice: 采用“使我们起来”，保留身体起身、从死亡般境况中复苏及群体复兴等多重意象。
  alternative: 可明确译为“使我们复兴”或“使我们站起来”。
  rationale: 原词语义范围较宽，与“使我们复苏”平行时带有强烈的生命恢复意象，却不足以单独限定为身体复活；译文因此不消除这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必”体现诗歌中对上帝行动的确信；两个“使我们”保持希伯来文使役动词的平行结构。标点呈现两日与第三日之间递进而达到高潮的节奏。
