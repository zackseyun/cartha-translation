base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/006.yaml
  text: And Yahweh[b][a], the God of hosts—Yahweh is his memorial name.
translation:
  language: zh_hans
  text: 雅威[b]——万军之神；雅威是人所记念的名[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“雅威是他的记念”；意思是，雅威是人记念或呼求他的名。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来神名 YHWH 的音译；传统上也译作“耶和华”或“上主”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: 雅威
  rationale: 连词 וַ 在这里承接上文；中文无需机械译作“并且”。יהוה按其专名音译为“雅威”，避免以称号替代原文中的名字。
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: 万军之上帝
  rationale: 这是与“雅威”同位的神圣称号。הַצְּבָאוֹת可指众军、天军及受统辖的诸般力量；“万军”保留其宽广含义，也符合庄重的现代中文表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文再次使用四字神名，以重复形成强调；译文照样重复，不改为代词或称号。
- source_word: זִכְרוֹ
  choice: 他的纪念名
  rationale: זֵכֶר在此指使人记念并用来呼求他的名号。“纪念名”补出希伯来语语境中隐含的“名”，同时由脚注保留较直译的可能。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用以色列上帝的专名，而非普通称号。“雅威”较直接地呈现该专名；脚注说明传统译法，以免读者误解。
- issue: זִכְרוֹ 与神名的关系
  choice: 雅威是他的纪念名
  alternative: 雅威是他的纪念；雅威是人记念他的名
  rationale: 这句话可直译为“雅威是他的纪念”。正文补出“名”，清楚表达这是人记念或呼求他的名，却不把其含义限定为单纯的记忆。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“万军之上帝”保留传统神圣称号的广度；破折号呈现同位关系及后半句的强调。脚注标记均置于正文相应词句之后。
