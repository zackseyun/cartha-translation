- from: 雅各逃到亚兰地[a]；以色列为娶妻而服役，又为娶妻而看守[b]。
  to: 雅各逃往亚兰的田野[a]；以色列为娶妻而服事，又为娶妻而看守[b]。
  rationale: 修订仅调整两处词语：“服役”改为“服事”，以准确表达为得妻子而替人劳作、服务；“亚兰地”改为“亚兰的田野”，以在正文保留希伯来语的具体意象。保留名字交替、重复句式和“看守”的未指明宾语，脚注继续呈现地域词与שׁמר的可选含义。
