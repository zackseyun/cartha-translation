base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/013.yaml
  text: Jacob fled to the field of Aram[a]; Israel served for a wife[b], and for a wife he kept watch.
translation:
  language: zh_hans
  text: 雅各逃往亚兰的田野[a]；以色列为娶妻而服事，又为娶妻而看守[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“亚兰的田野”；也可译“亚兰乡间”或“亚兰地区”。
    reason: lexical_alternative
  - marker: b
    text: “看守”也可译“守护”或“照管”；结合雅各的经历，可能指看守、照料羊群。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: 逃到
  rationale: ברח表示逃走、逃往；“逃到”既保留逃离的叙事力度，也自然带出目的地。
- source_word: שְׂדֵה אֲרָם
  choice: 亚兰地
  rationale: שׂדה字面为“田野、野地”，在此组合中可指亚兰的地域或乡野。“亚兰地”符合现代汉语地名表达，字面形象另以脚注保留。
- source_word: וַיַּעֲבֹד
  choice: 服役
  rationale: עבד可指服事、劳作；此处指雅各在拉班手下为娶妻而做工。“服役”保留为人效力的关系性，比单纯“工作”更贴近原词。
- source_word: בְּאִשָּׁה / וּבְאִשָּׁה
  choice: 为娶妻 / 又为娶妻
  rationale: 介词ב在上下文中表示目的或代价，即为了得到妻子。重复“为娶妻”保留希伯来文的平行和强调。
- source_word: שָׁמָר
  choice: 看守
  rationale: שׁמר可指看守、守护、照管；结合雅各的故事，很可能暗指看守或照料羊群，但原文未明说宾语，因此正文不补出“羊群”，并以脚注说明语义范围。
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: 雅各 / 以色列
  rationale: 原文刻意交替使用两个名字；分别保留，可同时唤起族长本人及其与以色列群体的联系。
theological_decisions:
- issue: 雅各与以色列两个名字的交替
  choice: 正文分别保留“雅各”和“以色列”
  alternative: 为行文顺畅而统一译作“雅各”或“以色列”
  rationale: 名字的变化出自原文，可能兼指族长及其后裔所构成的民族；统一名称会消除诗意与神学上的张力。
- issue: 是否明说看守羊群
  choice: 正文只译“看守”，不补宾语
  alternative: 译作“看守羊群”或“牧羊”
  rationale: 创世记背景支持羊群之意，但本节希伯来文没有明示宾语。保留省略可避免把上下文推断写成原文明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文两个名字的交替及“为娶妻”的重复；用分号呈现两组平行陈述。脚注处理“亚兰的田野”的字面表达及שׁמר未明说宾语所形成的含义空间。
