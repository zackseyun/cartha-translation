  text: כְּנַ֗עַן בְּ/יָד֛/וֹ מֹאזְנֵ֥י מִרְמָ֖ה לַ/עֲשֹׁ֥ק אָהֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/008.yaml
  text: A merchant—with deceptive scales in his hand—loves to oppress[a].
translation:
  language: zh_hans
  text: 商人[a]手里拿着骗人的秤，喜爱欺压人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文是“迦南”，也可理解为“迦南人”，并可引申指“商人”；下文所说的秤支持“商人”这一理解。
    reason: 保留原词在专名、族称与商业称谓之间的多义性。
lexical_decisions:
- source_word: כְּנַעַן
  choice: 商人
  rationale: 该词字面为“迦南”，也可指“迦南人”，并因迦南人与贸易的关联而引申为“商人”。下文提到秤，商业语境明显，因此正文采用“商人”，同时以脚注保留原文的多义性。
- source_word: בְּיָדוֹ
  choice: 手里拿着
  rationale: 直译为“在他手里”。译作“手里拿着”自然地保留了手持秤的具体画面。
- source_word: מֹאזְנֵי מִרְמָה
  choice: 骗人的秤
  rationale: מֹאזְנֵי 指称量用的秤；מִרְמָה 是“欺骗、诡诈”。“骗人的秤”在现代汉语中自然明白，并表达使用不公秤具实施欺诈的含义。
- source_word: לַעֲשֹׁק
  choice: 欺压人
  rationale: עשׁק 可指欺压、剥削、勒索或欺诈。商业语境容许译作“欺诈”，但“欺压人”保留了更宽的语义范围和社会伦理力度；补出“人”使汉语完整自然。
- source_word: אָהֵב
  choice: 喜爱
  rationale: 表达对恶行的惯常偏爱。“喜爱”保留原文强烈而简洁的道德指控。
theological_decisions:
- issue: כְּנַעַן 应理解为专名“迦南”、族称“迦南人”，还是引申义“商人”
  choice: 正文译作“商人”
  alternative: “迦南”或“迦南人”
  rationale: 骗人的秤所构成的直接语境支持商业意义。但原词仍可能使人联想到“迦南”，并借此把以法莲刻画成迦南式的人；脚注保留这种修辞和解释上的张力，不在正文中将其完全消除。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“骗人的秤”比“诡诈的天平”更贴近日常表达，同时不削弱先知谴责的力度；句式简洁，保留原文鲜明的商业意象。
