base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/014.yaml
  text: By a prophet Yahweh brought Israel up from Egypt[b][a], and by a prophet he was guarded.
translation:
  language: zh_hans
  text: 耶和华借着一位先知[a]领以色列从埃及上来；以色列借着一位先知得蒙保守[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按出埃及的背景，这位先知很可能是摩西。
    reason: cross_reference
  - marker: b
    text: “得蒙保守”也可译作“得蒙看守”或“得以保存”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנָבִיא
  choice: 借着一位先知
  rationale: 介词 בְּ 在这里表示媒介或施事方式；“借着”自然地表达这一含义，并保留两分句中重复出现的平行结构。“一位先知”不把经文未明说的人名写入正文。
- source_word: הֶעֱלָה
  choice: 领……从……上来
  rationale: עלה 的使役式在这里意为“使上来、带上来”，也是出埃及叙事的惯用表达；“领……从埃及上来”既保留“上来”的意象，又符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文中通行的音译呈现上帝的专名，而不以称号代替。
- source_word: מִמִּצְרַיִם
  choice: 从埃及
  rationale: 这是该地名与介词的标准、直接译法。
- source_word: נִשְׁמָר
  choice: 得蒙看守
  rationale: שׁמר 的尼法勒式在此为被动，表示“被看守、被保守”。“得蒙看守”保留被动语态和简练措辞，同时由上文自然承接“以色列”为主语。
theological_decisions:
- issue: 两处分句中“先知”的身份
  choice: 正文保留“一位先知”的不定表达，并在注释中说明按出埃及背景很可能指摩西。
  alternative: 在正文译作“那位先知”或直接写作“摩西”。
  rationale: 希伯来文没有明确写出先知的名字，其修辞重点在于耶和华借先知施行拯救与看守。保留不定表达可避免把合理推断写成明说内容。
- issue: נִשְׁמָר 的含义范围
  choice: 译作“得蒙看守”。
  alternative: 译作“得蒙保守”或“得以保存”。
  rationale: “看守”较直接对应 שׁמר，并保留可能包含照管、护卫在内的语义张力；“保守”较容易带入更强的神学化色彩，“保存”则偏重存续结果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两分句都保留“借着一位先知”，以呈现原文的重复和平行；第二分句保留被动表达，不额外明说施行动作的主体。
