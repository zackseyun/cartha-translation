  text: וַ/יֹּ֣אמֶר אֶפְרַ֔יִם אַ֣ךְ עָשַׁ֔רְתִּי מָצָ֥אתִי א֖וֹן לִ֑/י כָּל יְגִיעַ֕/י לֹ֥א יִמְצְאוּ לִ֖/י עָוֺ֥ן אֲשֶׁר חֵֽטְא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/009.yaml
  text: And Ephraim said[a], “Surely I have become rich; I have found wealth for myself[c][b]. In all my labor they will not find in me iniquity that is sin.”
translation:
  language: zh_hans
  text: 以法莲说：“我的确发了财，为自己得了财富[a]。在我一切的劳碌中，他们找不出我有任何算得上罪的过错[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财富”也可译作“力量”或“财力”；这里很可能是指物质财富。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来文十分简练，也可译作：“在我一切所得中，他们找不出我有什么过错是罪。”“劳碌”一词也可指劳碌所得。
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: 的确
  rationale: 在此引出以法莲自信而带有自我辩护意味的断言；“的确”自然地表达强调语气，又不将其限定性地译成“只”。
- source_word: עָשַׁרְתִּי
  choice: 我发了财
  rationale: 完成式表示已经达到富足的结果；“发了财”既保留结果义，也符合经商致富的语境。
- source_word: אוֹן
  choice: 财富
  rationale: 该词可指力量、财力或资财；本节的商业语境更支持物质财富之义，同时在脚注保留“力量/财力”的词义可能。
- source_word: כָּל יְגִיעַי
  choice: 我一切的劳碌
  rationale: יְגִיעַ可指劳苦，也可指劳苦所得；正文用“劳碌”保留行为与成果之间的张力，脚注说明另一种理解。
- source_word: יִמְצְאוּ לִי
  choice: 他们找不出我有
  rationale: 保留希伯来文未明说主语的复数形式，并以自然汉语传达无法在以法莲身上查出或归给他罪责的法庭式意味。
- source_word: עָוֺן אֲשֶׁר חֵטְא
  choice: 任何算得上罪的过错
  rationale: 原文简短而含混；此译保留“过错”与“罪”并置的结构，也呈现以法莲声称其过错不构成罪的自辩意味，而不替先知判断其说法真伪。
theological_decisions:
- issue: 说话者视角与道德反讽
  choice: 按以法莲自我辩护的口吻直接引述，不在正文中判定其说法为真。
  alternative: 在正文中明说这是欺骗、自义或反讽之言。
  rationale: 希伯来文只直接记录以法莲的宣称；译文让更广的上下文显明先知的批判，避免把解释性定论加入本节。
- issue: עָוֺן אֲשֶׁר חֵטְא的关系
  choice: 译作“算得上罪的过错”，保留限定或归类意味。
  alternative: 译作“就是罪的过错”或“因而有罪的罪孽”。
  rationale: 原短语可作同位或限定关系理解；所选译法较自然地表达其压缩结构及自我开脱语气，但脚注保留更贴近形式的译法。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。用“发了财”传达已取得财富的结果，用“算得上罪”呈现以法莲带有法律辩解色彩的自信口吻；不在正文中明说讽刺或谴责，以保留原文的神学张力。
