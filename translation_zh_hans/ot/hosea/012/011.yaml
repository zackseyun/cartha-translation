base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/011.yaml
  text: I spoke through the prophets[a]; I myself multiplied visions[c][b], and through the hand of the prophets I gave parables.
translation:
  language: zh_hans
  text: 我曾借众先知说话[a]；我亲自使异象增多，又借众先知之手[b]用比喻说话[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我曾向众先知说话”，也可能是“我曾就众先知说话”。这里的希伯来语介词可有多种理解；上下文的平行结构较支持“借众先知说话”。
    reason: alternative_reading
  - marker: b
    text: “借……之手”是希伯来语表示由某人施行或以某人为媒介的习语，也可译作“借众先知”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“用比较的话说”或“使用比拟”。这里的希伯来语动词含义较难确定，可能指用形象化或譬喻性的方式表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתִּי עַל הַנְּבִיאִים
  choice: 我曾借众先知说话
  rationale: 介词 עַל 在这里可表示对先知说话、论到先知，或以先知为传话媒介。下半句“借众先知之手”形成平行，因此正文采用媒介义“借……说话”，同时以脚注保留其他可能。
- source_word: וְאָנֹכִי
  choice: 我亲自
  rationale: 独立人称代词 אָנֹכִי 在动词已有主语信息之外加强语气；“我亲自”以自然的现代汉语保留这一强调。
- source_word: חָזוֹן הִרְבֵּיתִי
  choice: 我亲自使异象增多
  rationale: רבה 的使役式表达“使多、增多”，而 חָזוֹן 是其宾语。“使异象增多”既保留原文结构，也没有把具体的启示媒介泛化。
- source_word: וּבְיַד הַנְּבִיאִים
  choice: 并借众先知之手
  rationale: בְּיַד 是表示施事或媒介的希伯来语习语。译文保留“之手”的形象，同时用“借”清楚表达媒介意义。
- source_word: אֲדַמֶּה
  choice: 作比喻
  rationale: דמה 的这一形式语义较难确定，可指作比较、使用相似形象或以譬喻表达。“作比喻”简洁可懂，并以脚注保留“用比较的话说”等可能。
theological_decisions:
- issue: 先知启示的传递方式
  choice: 理解为上帝借先知说话，并赐下异象、使用比喻。
  alternative: 首句也可理解为上帝向先知说话，或论到先知说话。
  rationale: 上下两行的平行结构，特别是“借众先知之手”，较支持先知作为传话媒介；但 עַל 本身具有歧义，因此不把替代读法排除在脚注之外。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“使异象增多”略带原文色彩，以保留使役结构；“借众先知之手”有意保留希伯来语的媒介意象，并由脚注解释。标点呈现原文两组平行分句。
