source:
  edition: WLC
  text: אֶפְרַ֜יִם רֹעֶ֥ה ר֨וּחַ֙ וְ/רֹדֵ֣ף קָדִ֔ים כָּל הַ/יּ֕וֹם כָּזָ֥ב וָ/שֹׁ֖ד יַרְבֶּ֑ה וּ/בְרִית֙ עִם אַשּׁ֣וּר יִכְרֹ֔תוּ וְ/שֶׁ֖מֶן לְ/מִצְרַ֥יִם יוּבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/002.yaml
  text: Ephraim feeds on wind and pursues the east wind all day long[a]; he multiplies lies and destruction. They make a covenant with Assyria[e][d][c][b], and oil is carried to Egypt.
translation:
  language: zh_hans
  text: 以法莲以风为食[a]，终日追逐东风[b]；他使虚假与毁灭增多[c]。他们与亚述立约[d]，油被运往埃及[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“牧养风”；这里的希伯来语动词本义可指放牧、牧养或使之吃草。
    reason: lexical_alternative
  - marker: b
    text: 当地的东风通常炎热而具破坏性；这个意象既可表示徒劳，也可暗示危害。
    reason: cultural_note
  - marker: c
    text: “虚假与毁灭”也可译作“谎言与暴行”或“欺骗与蹂躏”。
    reason: lexical_alternative
  - marker: d
    text: 希伯来语直译为“切约”，是订立盟约或条约的惯用说法。
    reason: lexical_alternative
  - marker: e
    text: 这些油很可能是作为贡物或外交馈赠送往埃及的；原文只说“油”，没有明说用途。
    reason: cultural_note
lexical_decisions:
- source_word: רֹעֶה רוּחַ
  choice: 以风为食
  rationale: רעה可指放牧、牧养或取食；与“风”连用，形成以虚空之物为食的鲜明比喻。“以风为食”在现代汉语中自然，也保留原文意象。
- source_word: וְרֹדֵף קָדִים
  choice: 追逐东风
  rationale: רדף意为追逐；קדים特指东风，在当地常是炎热而具破坏性的风。直译保留徒劳与危害并存的意象。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁自然地表达持续整天的动作。
- source_word: כָּזָב וָשֹׁד
  choice: 虚假与毁灭
  rationale: כזב指虚假、谎言或欺骗；שד可指毁灭、蹂躏、暴力或掠夺。“虚假与毁灭”保留较宽的语义范围，避免把后者限缩为单纯的人际暴力。
- source_word: יַרְבֶּה
  choice: 他使……不断增多
  rationale: 该使役形态表达使之增多或加剧；用单数“他”对应作为集合性主体的“以法莲”。
- source_word: וּבְרִית עִם אַשּׁוּר יִכְרֹתוּ
  choice: 他们与亚述立约
  rationale: כרת ברית字面为“切约”，是订立盟约或条约的固定表达。“立约”符合现代中文习惯；“他们”保留原文由集合单数转为复数的变化。
- source_word: וְשֶׁמֶן לְמִצְרַיִם יוּבָל
  choice: 又把油送到埃及
  rationale: שמן为油，语境中很可能是橄榄油；יובל是被带去、运去。中文主动式泛指处理此事的人，表达自然而不补出原文未明说的执行者。
theological_decisions:
- issue: 政治控诉中的风之比喻
  choice: 保留“以风为食”和“追逐东风”的具体意象
  alternative: 释义为“追求虚空和毁灭”
  rationale: 原文借风同时传达空虚、徒劳和危害；正文不把这层张力化约为单一解释。
- issue: 集合主体的数变化
  choice: 前半用单数“他”，后半用复数“他们”
  alternative: 全节统一为单数或复数
  rationale: 希伯来文先以“以法莲”为集合单数，随后在“立约”处使用复数动词。保留变化可呈现原文从国家整体转向其人民或领袖的表达。
- issue: 与外邦结盟的性质
  choice: 译作“立约”，不在正文中判定其纯属政治条约或带有宗教意义的盟约
  alternative: 译作“签订条约”
  rationale: ברית的语义可涵盖盟约和条约；“立约”保留其正式性和可能具有的政治—宗教张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留先知话语中“风”和“东风”的诗性意象，并保留原文由集合单数转为复数的突变。标点按中文阅读习惯处理，以分号区分意象控诉与其具体政治表现。
