reference: Hosea 12:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: סְבָבֻ֤/נִי בְ/כַ֨חַשׁ֙ אֶפְרַ֔יִם וּ/בְ/מִרְמָ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל וִֽ/יהוּדָ֗ה עֹ֥ד רָד֙ עִם אֵ֔ל וְ/עִם קְדוֹשִׁ֖ים נֶאֱמָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/001.yaml
  text: Ephraim has surrounded me with lies[a], and the house of Israel with deceit[b]; but Judah still roams with God and is faithful with the Holy One.
translation:
  language: zh_hans
  text: 以法莲用谎言包围我，以色列家用诡诈围住我；犹大却仍与上帝同行，忠于那位圣者。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半句的希伯来语含义不明确，尤其是译作“同行”的动词。也可译作：“犹大仍悖逆上帝，反抗那位信实的圣者。”
    reason: alternative_reading
  - marker: b
    text: “那位圣者”原文在形式上是复数，也可译作“众圣者”，可能指天上的圣者。
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבָבֻנִי
  choice: 包围我
  rationale: 该词为סבב的完成式复数形式，带第一人称单数宾语后缀，直译为“他们包围了我”。“包围我”保留了被虚假环绕、困住的意象。
- source_word: בְכַחַשׁ
  choice: 用谎言
  rationale: כחש在此指虚假、欺骗；“谎言”通俗自然，也符合先知对以法莲不忠的指控。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 保留专名；在何西阿书中常代指北国，但正文不将这一转喻直接解释出来。
- source_word: וּבְמִרְמָה
  choice: 用诡诈
  rationale: מרמה指欺骗、诡诈或奸诈。“诡诈”与“谎言”相应，同时保留两词之间的语义差别。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留希伯来语结构及先知文学的庄重表达。
- source_word: וִיהוּדָה
  choice: 犹大却
  rationale: 连接词本可译为“而”或“和”；按本句正面解读，译作“却”能自然呈现犹大与以法莲、以色列家的对比。
- source_word: עֹד
  choice: 仍
  rationale: 表达动作或状态持续至今，简洁自然。
- source_word: רָד עִם אֵל
  choice: 与上帝同行
  rationale: רָד的词义和词形解释均有困难，也可能被理解为游荡、躁动或掌权。正文按与后面的“忠信”相协调的正面读法译为“同行”，但在脚注保留负面理解。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל在此是对以色列之神的通用称号；译为“上帝”清楚自然。
- source_word: וְעִם קְדוֹשִׁים
  choice: 对那位圣者
  rationale: קְדוֹשִׁים在形式上是复数，可指“众圣者”；也可能以尊称或强化复数指上帝。正文采用单数理解，并在脚注注明复数可能。介词עִם结合中文“忠信”的搭配，译作“对”。
- source_word: נֶאֱמָן
  choice: 忠信
  rationale: 该词表达可靠、忠诚、信实。此处以犹大为主语，译作“忠信”既简洁又保留关系性的含义。
theological_decisions:
- issue: 犹大分句在希伯来语中的正面或负面含义
  choice: 将犹大与以法莲形成正面对比：犹大仍与上帝同行，对圣者忠信。
  alternative: “犹大仍悖逆上帝，反抗那位信实的圣者。”
  rationale: רָד含义难定，而נֶאֱמָן既可形容犹大，也可能形容圣者。正文采用能与“忠信”自然衔接的正面读法，但不把有真实文本依据的负面读法隐藏起来。
- issue: קְדוֹשִׁים的单复数所指
  choice: 理解为指上帝的“那位圣者”。
  alternative: 按形态复数译为“众圣者”，可能指天上的圣者。
  rationale: 该词虽为复数形式，但诗歌和先知语境中可以作为尊称指上帝；由于所指仍有歧义，复数读法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谎言／诡诈”保留平行结构及词义差别；“以色列家”保留先知文体。两个脚注标记均置于存在歧义的犹大分句之后，避免误指前半句。
