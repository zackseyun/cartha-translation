base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/004.yaml
  text: In the womb he grasped his brother’s heel[b][a], and in his strength he contended with God.
translation:
  language: zh_hans
  text: 在母腹中，他抓住他兄弟的脚跟[a]；他凭着自己的力量与上帝较力[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“拉住他兄弟的脚跟。”这个希伯来动词使人想起雅各出生的叙事，也可引申为取代或胜过。
    reason: lexical_alternative
  - marker: b
    text: 或译：“与一位神圣的存在者较力。”下一节称这位为“天使”，因此这里保留原文在“上帝”与天使描述之间的张力。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּבֶּטֶן
  choice: 在母腹中
  rationale: בטן可指腹部或母腹；这里指雅各出生前的情形，译作“母腹”自然且准确。
- source_word: עָקַב אֶת אָחִיו
  choice: 抓住哥哥的脚跟
  rationale: עָקַב呼应雅各出生时抓住以扫脚跟的叙事，并可能兼有排挤、取代之意。正文保留具体意象，延伸含义在脚注说明。אָחִיו在该出生叙事中具体指哥哥。
- source_word: וּבְאוֹנוֹ
  choice: 壮年时
  rationale: און可表示力量、精力或旺盛时期；与“在母腹中”形成时间上的对照时，“壮年时”自然地表达其精力旺盛之际，但原文也可理解为“凭着他的力量”。
- source_word: שָׂרָה
  choice: 较力
  rationale: 该动词表示争斗、较量，并呼应雅各与“以色列”之名的叙事。“较力”保留双方角力的意味，不擅自加入得胜的结果。
- source_word: אֶת אֱלֹהִים
  choice: 与上帝
  rationale: אֱלֹהִים正文直译为“上帝”；在表示争斗的动词后，אֶת表达较力的对象，现代汉语自然译作“与上帝”。
theological_decisions:
- issue: 雅各较力对象אֱלֹהִים的所指
  choice: 上帝
  alternative: 神圣者；结合下一节理解为天使
  rationale: 本节希伯来文本用אֱלֹהִים，故正文保留“上帝”；下一节又称该对象为“天使”。脚注指出另一译法，以保留何西阿文本中的神圣与天使描述之间的张力，而不加以调和。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“抓住哥哥的脚跟”保留出生叙事的具体画面；“较力”比“争胜”更中性，不预断结果。将וּבְאוֹנוֹ译为“壮年时”，突出与“在母腹中”的修辞对照，同时承认“凭着他的力量”也是可行理解。脚注标记均置于正文相关语句之后。
