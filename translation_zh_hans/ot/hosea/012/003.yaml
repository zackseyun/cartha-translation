review_pass:
  verdict: revise
  source_fidelity: 原文的 משפט争讼意象、犹大与雅各两个名称、以及按行为施行报偿的平行结构，整体均已把握。惟“按雅各所行的追讨他”在现代汉语中结构不完整且指代不够清楚；补出“行事／道路”的中心语可更准确对应כִּדְרָכָיו，并使审判行动自然落在雅各身上。
  naturalness: “耶和华与犹大有争讼”自然且庄重。“按雅各所行的追讨他”缺少宾语中心表达，读来别扭；改为“必按雅各所行的道路追讨他”仍略生硬，采用“必按雅各所行的追究他”更简洁，但不如“必按雅各的行事追讨他”清晰。为保持“道路”隐喻及现代通顺，正文采用“必按雅各的行事追讨他”。
  terminology: “耶和华”“犹大”“雅各”均合宜且忠于原文。“争讼”恰当保留רִיב的司法语域；“追讨”可表达לפקד על的查究、问责和惩治，不必把含义限窄为单纯惩罚。“报应”在此为合宜的司法性报偿用语。
