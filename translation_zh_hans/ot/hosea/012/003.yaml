- from: 耶和华与犹大有争讼[a]，也必按雅各所行的追讨他[b]，照他的作为报应他。
  to: 耶和华与犹大有争讼[a]；他必按雅各的行事追讨他[b]，照他的作为报应他。
  rationale: 修订仅处理正文中“所行的”缺少中心语所造成的句法问题，改为“雅各的行事”，使其准确对应“按他的道路／行为方式”，同时保留原文的司法审判语气、犹大与雅各的名称区分，以及“按行事追讨／照作为报应”的对应结构。脚注a调整替代译法，使其更符合现代汉语且不将原文法律关系具体化过度。
