base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/003.yaml
  text: Yahweh has a charge against Judah[a], and he will punish Jacob according to his ways[b]; according to his deeds he will repay him.
translation:
  language: zh_hans
  text: 耶和华与犹大有争讼[a]；他必按雅各的行事追讨他[b]，照他的作为报应他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有争讼”也可译作“有控诉”或“有案件”。原文使用司法争讼用语。
    reason: lexical_alternative
  - marker: b
    text: “追讨”也可译作“惩罚”或“追究责任”。原文用语字面含“临到……查究”之意，常指施行审判或惩治。
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: 有争讼
  rationale: 该词在先知书语境中带有司法争议、诉讼或指控的意味。“有争讼”既保留法律色彩，也不把具体诉讼程序表达得过于确定。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，以专名呈现，而不以“主”这一称号替代。
- source_word: עִם יְהוּדָה
  choice: 与犹大
  rationale: 介词字面为“与”；在争讼语境中表示犹大是争议的相对方。中文“与犹大有争讼”自然保留了这种司法对立关系。
- source_word: לִפְקֹד עַל
  choice: 追讨
  rationale: 该结构在审判语境中表示临到某人施行查究、惩处。“追讨”兼具问责和惩罚含义，比单纯“惩罚”更能保留司法查究的色彩。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 依原文保留“雅各”，不改写为“以色列”，从而保存族长姓名与其后裔群体之间可能存在的修辞关联。
- source_word: כִדְרָכָיו
  choice: 按雅各所行的
  rationale: דֶּרֶךְ的复数在此指行为方式或生活表现。译作“所行的”符合现代汉语，同时表达按其行为衡量的意思。
- source_word: כְמַעֲלָלָיו
  choice: 照他的作为
  rationale: 该词指带有道德评价色彩的行为、作为；“作为”简洁庄重，适合审判语境。
- source_word: יָשִׁיב לוֹ
  choice: 报应他
  rationale: 使役形态配合间接受词在此表达把相应后果归还给某人，即按其行为施行回报。“报应”准确体现司法性偿还。
theological_decisions:
- issue: 犹大与雅各在审判宣告中的关系
  choice: 按原文分别保留“犹大”和“雅各”：耶和华与犹大争讼，并按雅各的行为追讨、报应他。
  alternative: 把“雅各”直接解释并译成包括犹大和以色列在内的全体民族，或将两个名称统一。
  rationale: 原文有意并列两个名称，其具体指涉范围存在张力。译文不将二者合并，也不在正文中替作者界定“雅各”的范围。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“争讼、追讨、报应”保留先知性司法宣告的力度；句式沿用原文的递进与对应关系，并让所有脚注标记在正文中明确出现。
