    rationale: 中文中“有案件要控告”容易理解为尚待提出的个别案件，较弱化原文当前的法律争讼关系。改为“有控告雅各的案件”亦会误改对象；故以“有案可告”不够庄重。保留“有争讼”，并以“有控诉”“有案件”作为替代，较为稳妥。
