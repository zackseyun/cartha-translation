  text: וְ/אַתָּ֖ה בֵּ/אלֹהֶ֣י/ךָ תָשׁ֑וּב חֶ֤סֶד וּ/מִשְׁפָּט֙ שְׁמֹ֔ר וְ/קַוֵּ֥ה אֶל אֱלֹהֶ֖י/ךָ תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/007.yaml
  text: So you[a], by your God, return; keep steadfast love and justice[b], and wait continually for your God.
translation:
  language: zh_hans
  text: 所以，你要靠着你的上帝回转[a]；持守忠贞的爱和公正，不断等候[b]你的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“归向你的上帝。”希伯来语直译近似“靠着／在你的上帝里回转”，结构较少见，可能表示凭借、关系或方向。
    reason: lexical_alternative
  - marker: b
    text: “等候”也可译作“仰望”或“盼望”，含有期待之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהֶיךָ
  choice: 靠着你的上帝
  rationale: 前缀 בְּ 可表示凭借、关系或所在范畴。“靠着”在现代汉语中较自然地表达回转以与上帝的关系为依据或凭借，同时没有把这一少见结构直接化约为方向性的“归向”。
- source_word: תָשׁוּב
  choice: 回转
  rationale: שׁוּב 的基本义是返回、转回。“回转”兼顾动作本义和盟约关系恢复的意味，又不把经文本身较宽的词义直接限定为“悔改”。
- source_word: חֶסֶד
  choice: 忠贞的爱
  rationale: חֶסֶד 涵盖坚定的爱、信实、怜悯和盟约忠诚。“忠贞的爱”既易懂，也突出其持久而忠诚的关系性内涵。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 在伦理命令的语境中，“公正”能自然表达 מִשְׁפָּט 在社会、司法和正直行为方面的含义；“审判”在此过于偏向司法裁决或事件。
- source_word: שְׁמֹר
  choice: 持守
  rationale: “持守”可自然搭配“忠贞的爱和公正”，表达持续遵行、维护的命令语气。
- source_word: וְקַוֵּה
  choice: 等候
  rationale: קוה 表示带着盼望和期待而等候。“等候”保留依赖与持续期待的姿态，其“盼望、仰望”的语义由脚注说明。
- source_word: אֶל אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: אֶל 本有“向着”的方向意味；与 קוה 连用时，汉语以“等候你的上帝”最为自然，而期待、朝向他的意味仍由动词和语境体现。
- source_word: תָּמִיד
  choice: 常常
  rationale: תָּמִיד 表示持续不断。“常常”用于劝勉自然清楚，并与“等候”顺畅搭配。
theological_decisions:
- issue: 是否把回转的呼召明确译作悔改
  choice: 回转
  alternative: 悔改；转回
  rationale: 本节确有盟约性的归回呼召，但 שׁוּב 本身比专指内心悔罪的用语更宽。“回转”保留神学上的呼召，又不预先缩窄其含义。
- issue: בֵּאלֹהֶיךָ 所表达的关系
  choice: 靠着你的上帝
  alternative: 归向你的上帝；与自己的上帝一同回转
  rationale: 希伯来语介词结构少见，可能表达凭借、关系、范畴或按语意理解为方向。正文采用“靠着”保存介词最直接可见的凭借意味，脚注同时保留方向性解读，避免消除原文的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”与所给英语审校层及原文 אֱלֹהִים 对应；分号呈现“回转”与随后伦理命令之间的推进关系。脚注标记均置于相关词语之后，并将关于 קוה 的脚注标在“等候”处。
