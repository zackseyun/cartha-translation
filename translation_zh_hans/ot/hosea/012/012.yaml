source:
  edition: WLC
  text: אִם גִּלְעָ֥ד אָ֨וֶן֙ אַךְ שָׁ֣וְא הָי֔וּ בַּ/גִּלְגָּ֖ל שְׁוָרִ֣ים זִבֵּ֑חוּ גַּ֤ם מִזְבְּחוֹתָ/ם֙ כְּ/גַלִּ֔ים עַ֖ל תַּלְמֵ֥י שָׂדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/012.yaml
  text: If Gilead is iniquity[a], they have surely become nothing; in Gilgal they sacrifice bulls; indeed[c][b], their altars are like stone heaps on the furrows of the field.
translation:
  language: zh_hans
  text: 基列若是罪孽[a]，他们就全然成了虚妄[b]；他们在吉甲献公牛为祭。连他们的祭坛也像田地犁沟上的石堆[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “若是”也可理解为强调语气，译作：“基列确是罪孽。”
    reason: alternative_reading
  - marker: b
    text: “虚妄”也可译作“虚假”“空无”或“毫无价值”；原文的简练说法兼含这些意味。
    reason: lexical_alternative
  - marker: c
    text: 这里可能是把众多祭坛比作耕田时从土中清出、堆放在田地犁沟上的石堆。此比喻也可能暗示祭坛众多、无用，或将被弃置；原文未明确限定其重点。
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: 若是
  rationale: 保留希伯来文可作条件词的表层形式及其修辞张力；其也可能具有强调语气，故以脚注说明。
- source_word: גִּלְעָד
  choice: 基列
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: אָוֶן
  choice: 罪孽
  rationale: 表达道德邪恶与罪责，也容纳先知语境中可能具有的偶像崇拜意味，而不将含义限定为“偶像”。
- source_word: אַךְ
  choice: 全然
  rationale: 传达此处加强断言的语气，并与后面的“虚妄”组成自然、庄重的现代汉语。
- source_word: שָׁוְא
  choice: 虚妄
  rationale: 保留该词兼有空虚、无价值及虚假之意的语义范围，避免只译作“不存在”。
- source_word: הָיוּ
  choice: 成了
  rationale: 将系词理解为进入某种状态，贴合先知对他们现状的判语。
- source_word: בַּגִּלְגָּל
  choice: 在吉甲
  rationale: 采用通行地名译法并明确地点关系。
- source_word: שְׁוָרִים
  choice: 牛
  rationale: 该词指用于献祭的牛科牲畜；“牛”自然且不额外断定其性别。
- source_word: זִבֵּחוּ
  choice: 献牛为祭
  rationale: 以中文祭祀语汇明确动词与宾语的关系；过去式形态在先知陈述中可指已发生或惯常行为，中文无需强加时态标记。
- source_word: גַּם
  choice: 连……也
  rationale: 自然表达递进或附加的强调，引出对祭坛的进一步判语。
- source_word: מִזְבְּחוֹתָם
  choice: 他们的祭坛
  rationale: 直接对应复数名词及第三人称复数所属后缀。
- source_word: כְּגַלִּים
  choice: 像……石堆
  rationale: גלים 指堆积物，语境很可能是石堆；补出“石”使农田意象在中文中清楚，同时以脚注交代。
- source_word: עַל תַּלְמֵי שָׂדָי
  choice: 田间犁沟旁
  rationale: תלם 指犁出的沟垄；介词 עַל 在空间图景中可表达“在……上/旁”，译作“旁”更符合石块从耕地清出后堆在沟垄边的意象。
theological_decisions:
- issue: 开头 אִם גִּלְעָד אָוֶן 的句法
  choice: 译作修辞性条件句“基列若是罪孽”
  alternative: “基列确是罪孽”或“基列岂是罪孽？”
  rationale: אִם 可作条件词，也可能在诗歌和先知话语中加强断言。正文保留条件形式，脚注呈现强调式读法，不消除原文张力。
- issue: שָׁוְא 对基列居民或其宗教行为的判语
  choice: 译作“他们就全然成了虚妄”
  alternative: “他们全是虚假”或“他们毫无价值”
  rationale: “虚妄”保留空虚、无价值、虚假等重叠含义，不把先知的神学控诉缩窄为单一概念。
- issue: 祭坛与田间石堆的比喻
  choice: 保留为祭坛“像田间犁沟旁的石堆”
  alternative: 将其解释为祭坛数量众多或终将沦为废墟
  rationale: 原文只明说相似关系，可能着重数量、无用或毁坏后的景象；正文不替原文选定单一神学寓意。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“罪孽”“虚妄”“献……为祭”“祭坛”等保留先知文学的凝练力度；正文按自然汉语分为两句，并将脚注标记紧随相关词句。
