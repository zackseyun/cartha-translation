  text: הִכְעִ֥יס אֶפְרַ֖יִם תַּמְרוּרִ֑ים וְ/דָמָי/ו֙ עָלָ֣י/ו יִטּ֔וֹשׁ וְ/חֶ֨רְפָּת֔/וֹ יָשִׁ֥יב ל֖/וֹ אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/015.yaml
  text: Ephraim has provoked bitter anger[a]; his bloodguilt will be left on him[b], and his Lord will repay him for his disgrace.
translation:
  language: zh_hans
  text: 以法莲激起了强烈的愤怒[a]；他的血债必留在他身上[b]，他的主[c]必把他的羞辱归还给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按原文的凝练表达译为“以法莲极其惹怒”。其中“强烈”所译的词也含有苦毒、苦涩之意；原文未明说被惹怒者。
    reason: lexical_and_grammatical_ambiguity
  - marker: b
    text: “血债”字面为“他的血”（复数），也可译作“他流血的罪”或“他的血腥罪行”。本分句动词的主语在原文中没有明说。
    reason: lexical_and_grammatical_ambiguity
  - marker: c
    text: “他的主”也可译作“他的主人”；按上下文，这一称呼很可能指上帝，但原文没有使用“耶和华”这一神名。
    reason: alternative_reading
lexical_decisions:
- source_word: הִכְעִיס
  choice: 惹动了……怒气
  rationale: 该词是כעס的使役形，通常表示“激怒、惹动怒气”。此译法符合现代汉语，也保留了使役意义。
- source_word: תַּמְרוּרִים
  choice: 苦烈的怒气
  rationale: 该复数名词表达强烈的苦楚、苦毒或苦烈之意；与“惹动”连用时可理解为所激起之怒的强烈性质。译文保留其情感力度，脚注说明原文的压缩表达。
- source_word: וְדָמָיו
  choice: 他的血债
  rationale: דמים字面为复数的“血”，在先知性和司法语境中常指流血所负的罪责。“血债”在现代汉语中能同时传达流血与责任。
- source_word: עָלָיו יִטּוֹשׁ
  choice: 必留在他身上
  rationale: נטש在此表示留下、不予除去。希伯来文动词为主动式但主语未明说；汉语采用不明示施事者的表达，以保留这一点。
- source_word: וְחֶרְפָּתוֹ
  choice: 他的羞辱
  rationale: חרפה可指羞辱、耻辱或辱骂。“他的羞辱”贴近原文，并避免擅自判定这是他所受的羞辱、他加给别人的羞辱，还是他可耻行为所招致的报应。
- source_word: יָשִׁיב לוֹ
  choice: 必把……还给他
  rationale: שוב的使役形与间接受词连用，在审判语境中有归还、还报之意。“还给他”保留原文的回返意象和报应含义。
- source_word: אֲדֹנָיו
  choice: 他的主
  rationale: 该形式在此作单数尊称，语境很可能指上帝；译作“他的主”既保留神圣称号，也不把原文并未出现的יהוה译入正文。
theological_decisions:
- issue: אֲדֹנָיו所指的是谁
  choice: 正文译作“他的主”，按语境很可能指上帝
  alternative: “他的主人”
  rationale: 执行审判并还报以法莲羞辱者在何西阿书语境中最自然地理解为上帝；但原词是“主／主人”，不是神名יהוה，因此正文和脚注保留词义上的可能性。
- issue: “他的羞辱”的具体关系
  choice: 保留“他的羞辱”这一属格结构
  alternative: “他加给人的羞辱”或“他所受的羞辱”
  rationale: 希伯来文后缀本身没有明确说明羞辱的施受关系。直译可保存真实歧义，避免把报应的具体机制解释得超过原文。
- issue: 谁使血债留在以法莲身上
  choice: 不在正文补出主语
  alternative: “他必把以法莲的血债留在他身上”，把主语理解为上帝
  rationale: 原文动词为第三人称阳性单数，但本分句没有明说主语；虽可从下句理解为“他的主”，译文仍不应无提示地消除语法上的含混。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“苦烈的怒气”保留原文的强烈感情色彩；“血债”是普通读者可理解的司法性表达。末句略带原文式的“归还”意象，以保存报应语言及“他的羞辱”未决的属格关系。
