base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/005.yaml
  text: He strove with the angel and prevailed[a]; he wept and sought his favor. At Bethel he found him[b], and there he spoke with us—
translation:
  language: zh_hans
  text: 他与天使较力，且得胜；他哭泣，恳求他施恩[a]。神在伯特利找到了他；神在那里向我们说话[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恳求他施恩”或译“向他苦苦哀求”。
    reason: lexical_alternative
  - marker: b
    text: 马所拉文本作“向我们说话”；有的译法作“向他说话”，以配合前文的单数人称。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: 较力
  rationale: 此处动词 שרה 呼应雅各较力的叙事（创世记32章），表达争斗、角力之意；“较力”既保留典故，也适合庄重的现代汉语。
- source_word: מַלְאָךְ
  choice: 天使
  rationale: 虽然该词也可泛指“使者”，这里指雅各较力事件中的超自然使者，译作“天使”最符合语境。
- source_word: וַיֻּכָל
  choice: 得胜
  rationale: יכל 在与“较力”并列的语境中表示占了上风、胜过；“得胜”保留原叙事的张力。
- source_word: בָּכָה
  choice: 哭泣
  rationale: 直接表达其流泪哀哭，准确而庄重。
- source_word: וַיִּתְחַנֶּן לוֹ
  choice: 恳求他施恩
  rationale: חנן 的 Hitpael 形式指恳求恩惠或怜悯；此译兼顾恳求的动作及“恩惠”这一词义成分。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 采用现代中文圣经中通行的地名译法。
- source_word: יִמְצָאֶנּוּ
  choice: 他找到了他
  rationale: 按单数主语和第三人称单数宾语理解，延续对雅各经历的回顾；“找到”直接保留 מצא 的基本意义，而不把相遇的性质解释得过满。
- source_word: וְשָׁם יְדַבֵּר עִמָּנוּ
  choice: 他在那里向我们说话
  rationale: 保留马所拉文本第一人称复数“我们”，不将突变的人称修平；未完成式在回顾性、先知性叙述中按上下文译为过去发生的事。
theological_decisions:
- issue: 末句从第三人称单数转为第一人称复数
  choice: 正文保留“向我们说话”
  alternative: 向他说话
  rationale: 马所拉文本的“我们”虽突兀，却把雅各在伯特利的经历与何西阿时代的群体联系起来。保留这一神学张力，不在正文中协调为单数。
- issue: 雅各与天使较力并“得胜”
  choice: 保留“得胜”
  alternative: 胜过了他／有能力
  rationale: 原文有意沿用雅各叙事中的强烈措辞；译文不以解释性语言削弱“得胜”与随后哭泣恳求之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“较力”“施恩”保留经文典故和神学词义，但避免古奥句式。分号呈现原文连续而彼此张紧的动作；末尾破折号表明句意在下一节延续。
