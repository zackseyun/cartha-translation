  text: וְ/אָנֹכִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם עֹ֛ד אוֹשִֽׁיבְ/ךָ֥ בָ/אֳהָלִ֖ים כִּ/ימֵ֥י מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/010.yaml
  text: Yet I am Yahweh your God from the land of Egypt; I will again make you dwell in tents[a], as in the days of the appointed feast.
translation:
  language: zh_hans
  text: 然而，自从你出埃及地以来，我就是雅威你的上帝；我还要使你住在帐篷里[a]，如同在所定节期的日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所定节期”也可译作“所定的时候”或“节日”。这里提到住帐篷，可能影射住棚节；以色列人在这节期住在临时搭建的棚里。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: 然而……我就是
  rationale: אָנֹכִי为强调式第一人称代词；结合上下文，将וְ译作转折性的“然而”，并保留明确而强调的主语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现以色列上帝的专名，不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 直接表达带第二人称阳性单数后缀的圣约称谓；采用现代普通读者易懂的“上帝”。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 自从你出埃及地以来
  rationale: 介词מִן可表达起点；结合“我是雅威你的上帝”的关系性陈述，汉语以“自从……以来”自然传达自出埃及时就确立并持续的关系，同时保留出埃及的历史指向。
- source_word: עֹד
  choice: 还要
  rationale: 在未完成式使役动词前表达未来中再次或进一步发生的行动；“还要”在汉语中保留其延续兼重复的语感，而不过度限定为纯粹重复。
- source_word: אוֹשִׁיבְךָ
  choice: 使你住
  rationale: 这是ישׁב的Hiphil使役式，译为“使你住”明确保留使役意义。
- source_word: בָאֳהָלִים
  choice: 在帐篷里
  rationale: אֹהֶל在此指帐篷；不用带有后期宗教术语色彩的“会幕”或“住棚”，节期联系留待脚注说明。
- source_word: כִּימֵי
  choice: 像在……的日子一样
  rationale: 自然呈现比较结构，并保持对某段日子或时期的类比。
- source_word: מוֹעֵד
  choice: 约定节期
  rationale: מוֹעֵד兼有约定的时间与节庆之意；“约定节期”保留这两层语义，又不在正文中直接认定为某一特定节日。
theological_decisions:
- issue: 住在帐篷里究竟是应许、审判，还是带反讽意味的逆转
  choice: 按原文直陈上帝将使以色列再次住在帐篷中，不加入褒贬词。
  alternative: 明确译成恢复出埃及时期亲密关系的应许，或明确译成流亡与贫困的威胁。
  rationale: 希伯来文没有明示该行动的正面或负面评价；中性表述可保留恢复、惩罚及旷野回忆之间的神学张力。
- issue: מוֹעֵד是否特指住棚节
  choice: 正文译为较宽泛的“约定节期”，脚注提示可能影射住棚节。
  alternative: 正文直接译作“住棚节”。
  rationale: 帐篷意象使住棚节的联想很强，但מוֹעֵד本身并未点明节名，因此不应在正文中过度限定。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“雅威”保留神名；“帐篷”使用普通读者熟悉的具体词语。语序略作汉语化处理，把时间起点置于系词陈述中，同时不替正文判定回归帐篷生活究竟是恩典还是审判。
