  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֻכָּ֣ה אֶפְרַ֔יִם שָׁרְשָׁ֥/ם יָבֵ֖שׁ פְּרִ֣י בלי יַעֲשׂ֑וּ/ן גַּ֚ם כִּ֣י יֵֽלֵד֔וּ/ן וְ/הֵמַתִּ֖י מַחֲמַדֵּ֥י בִטְנָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/016.yaml
  text: Ephraim is stricken[a]; their root is dried up; they will bear no fruit. Even if they give birth[b], I will put to death the cherished ones of their womb.
translation:
  language: zh_hans
  text: 以法莲受了击打；他们的根已经枯干，结不出果子。即使他们生下儿女，我也要杀死他们腹中所珍爱的孩子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所珍爱的孩子”也可译作“宝贵的孩子”或“心爱的孩子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻכָּה
  choice: 受了击打
  rationale: 这是נכה的被动式，表示以法莲遭受审判性的击打，并带有已然结果；译文保留先知话语的严厉感。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 保留专名；此处以单数集合名称指北国民众。
- source_word: שָׁרְשָׁם
  choice: 他们的根
  rationale: 希伯来文虽以单数集合名词“以法莲”为先行词，却使用复数代词后缀；“他们的根”既反映原文形式，也体现其所指的群体。
- source_word: יָבֵשׁ
  choice: 已经枯干
  rationale: 表达根所处的完成性、结果性状态；“枯干”自然贴合植物意象。
- source_word: פְּרִי בלי יַעֲשׂוּן
  choice: 结不出果子
  rationale: 以现代汉语常用的植物表达保留“果子”意象，并让下句的生育与丧子形成递进。
- source_word: גַּם כִּי
  choice: 即使
  rationale: 在语境中引出让步性的加重：纵然能够生育，也不能逃过审判。
- source_word: יֵלֵדוּן
  choice: 生下儿女
  rationale: 清楚地由植物结果转入人的生育；补出“儿女”符合汉语表达，所指也由下文“腹中”确定。
- source_word: וְהֵמַתִּי
  choice: 我也要杀死
  rationale: מות的使役式第一人称明确表示说话者亲自施行致死的审判；译文不将这一神圣行动弱化为非人格性的死亡结果。
- source_word: מַחֲמַדֵּי בִטְנָם
  choice: 他们腹中所珍爱的孩子
  rationale: מַחֲמַדֵּי可指珍爱、宝贵或可喜爱的人或物；结合生育语境，译作“所珍爱的孩子”，自然呈现父母珍视儿女的含义。“腹中”则保留בטן的身体意象。
theological_decisions:
- issue: 审判中的神圣主体性
  choice: 保留第一人称直接行动：“我也要杀死”
  alternative: 弱化为“他们也必死亡”等非人格结果
  rationale: 希伯来文使用第一人称单数使役式，明确把致死的审判归于说话者；译文不应消解这种令人不安却真实存在的神学张力。
- issue: “以法莲”的单数名称与复数所指
  choice: 以“以法莲”作集合名称，随后用“他们”
  alternative: 全按政治实体处理，译作“它的根”
  rationale: 原文自身在单数专名之后使用复数后缀，显示名称与群体成员之间的转换；中文保留这一转换，比统一成单数更贴近文本。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“根—果子—生育—孩子”的意象递进，并维持原文中神直接施行审判的严厉表达。脚注只说明מַחֲמַדֵּי的词义幅度；正文中的复数“他们”已直接呈现希伯来文形式，无须另加注释。
