base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/014.yaml
  text: Give them[a], O Yahweh—what will you give? Give them a miscarrying womb and dry breasts.
translation:
  language: zh_hans
  text: 雅威啊，求你赐给他们——你要赐给他们什么呢？求你赐给他们使人丧子的子宫[a]和枯干的乳房。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“会流产的子宫”。这个希伯来语分词可指使人失去儿女；在生育受审判的语境中，也可具体理解为会流产。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן
  choice: 求你赐给
  rationale: 这是直接向上帝发出的祈使语。译作“求你赐给”既保留恳求的语气，也保留原文反复出现的“赐给”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝的专名四字神名，避免用称号取代原文中的名字。
- source_word: מַה תִּתֵּן
  choice: 你要赐给他们什么呢？
  rationale: 疑问词加未完成式在这里自然构成带有迟疑和痛苦意味的反问；此译保留先发问、后明确所求审判的结构。
- source_word: רֶחֶם
  choice: 母腹
  rationale: 该词指“子宫、母腹”。“母腹”在现代汉语中自然而庄重，也适合与后文的生育和哺乳意象相连。
- source_word: מַשְׁכִּיל
  choice: 流产的
  rationale: 该使役分词源于 שכל，在此修饰“母腹”，可指造成流产或使人丧子。正文采用符合生育审判语境的“流产的”，并以脚注保留“使人丧子”的可能含义。
- source_word: שָׁדַיִם
  choice: 乳房
  rationale: 保留原文具体而强烈的身体意象，不作抽象化处理。
- source_word: צֹמְקִים
  choice: 干瘪的
  rationale: 该分词表示萎缩、干枯；“干瘪的乳房”在汉语中既表达萎缩，也暗示无乳可哺，较贴近原文意象。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用的是上帝的专名而非“主”这一称号；正文采用较贴近 YHWH 常见学术复原读音的“雅威”。
- issue: רֶחֶם מַשְׁכִּיל 所表达的审判
  choice: 流产的母腹
  alternative: 使人丧子的母腹
  rationale: 语境聚焦生育能力与哺乳能力受到审判。“流产”使生殖层面的含义清楚，但该分词也可泛指丧失儿女，因此用脚注保留另一读法，不把语义范围绝对限定。
translation_notes:
  register: 采用现代、庄重而直接的祷告语言。保留原文“赐给……赐给”的重复、句中的突转问句，以及生育与哺乳意象的严厉张力；不缓和先知求审判的措辞。
