base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/002.yaml
  text: Threshing floor and winepress will not feed them[a], and new wine will fail her.
translation:
  language: zh_hans
  text: 禾场和榨酒池不能养活他们；新酒必使她失望。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使她失望”也可译作“辜负她”或“向她显为虚假”。原文动词可指未能实现所期待的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: 禾场
  rationale: 指打谷的场地，也可借指谷物收成；保留具体的农业意象，与何西阿书的审判语境相符。
- source_word: יֶקֶב
  choice: 榨酒池
  rationale: 指压榨葡萄的设施或承接汁液的池槽；“榨酒池”在现代汉语中清楚自然，也与“禾场”构成对应。
- source_word: יִרְעֵם
  choice: 不能养活他们
  rationale: 源自动词“牧养、喂养”。以禾场和榨酒池为主语时，表达它们无法供应生活所需；“养活”既自然，又保留供养之意。
- source_word: תִּירוֹשׁ
  choice: 新酒
  rationale: 通常指新酿的酒或葡萄的新产，保留收成与丰产应许受挫的农业含义。
- source_word: יְכַחֶשׁ
  choice: 必辜负
  rationale: 该动词可表示说谎、证明虚假、未能兑现期待。以“新酒”为主语时，“辜负”自然传达预期落空，同时保留拟人色彩。
- source_word: בָּהּ
  choice: 她
  rationale: 这是第三人称阴性单数后缀，语境中最可能指被女性化拟人的以色列或以法莲；保留“她”避免将原文的数与文学形象抹平。
theological_decisions:
- issue: בָּהּ中阴性单数后缀的所指
  choice: 译作“她”，指被女性化拟人的以色列或以法莲。
  alternative: 按集合意义顺译为“他们”，或理解为“那地”。
  rationale: 这主要是语法与文学语境的判断。何西阿常以女性形象描写这个民族；保留阴性单数既忠于形式，也不排除读者结合上下文辨认其所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“禾场—榨酒池—新酒”保留原文农业意象；“不能养活他们”符合汉语习惯。“辜负她”刻意保留原文由复数“他们”转为阴性单数“她”的张力及新酒的拟人表达。
