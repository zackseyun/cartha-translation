revisions:
- from: 他们所有的恶都在吉甲；我正是在那里恨恶他们[a]，因为他们所做的尽是恶。我必把他们赶出我的家[b]，不再爱他们。他们所有的首领都是悖逆的[c]。
  to: 他们一切的恶都在吉甲；我正是在那里恨恶他们[a]，因他们所行的恶。我必把他们赶出我的家[b]，不再爱他们。他们所有的首领都是悖逆的[c]。
  rationale: 修订仅收紧两处措辞：“一切的恶”使集合性表达更自然；“因他们所行的恶”避免“尽是恶”可能造成的绝对化含义，并更直接对应“他们行为的邪恶”。其余措辞及脚注锚点均保留原文的语义张力与歧义。
