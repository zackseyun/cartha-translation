id: HOS.9.15
reference: Hosea 9:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל רָעָתָ֤/ם בַּ/גִּלְגָּל֙ כִּֽי שָׁ֣ם שְׂנֵאתִ֔י/ם עַ֚ל רֹ֣עַ מַֽעַלְלֵי/הֶ֔ם מִ/בֵּיתִ֖/י אֲגָרְשֵׁ֑/ם לֹ֤א אוֹסֵף֙ אַהֲבָתָ֔/ם כָּל שָׂרֵי/הֶ֖ם סֹרְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/015.yaml
  text: All their evil is at Gilgal[a]; indeed, there I hated them because of the evil of their deeds. I will drive them out of my house; I will no longer love them[c][b]. All their princes are rebels.
translation:
  language: zh_hans
  text: 他们一切的恶都在吉甲；我正是在那里恨恶他们[a]，因他们所行的恶。我必把他们赶出我的家[b]，不再爱他们。他们所有的首领都是悖逆的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我在那里恨恶他们。”希伯来语连词“כִּי”既可表示原因，也可带强调作用。
    reason: lexical_alternative
  - marker: b
    text: “我的家”也可能更具体地指耶和华的土地、圣所或盟约群体；希伯来原文保留了简洁而未限定的意象。
    reason: cultural_note
  - marker: c
    text: “悖逆的”也可译作“反叛的”或“顽梗的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רָעָתָם
  choice: 他们所有的恶
  rationale: כָּל与单数抽象名词רָעָה连用，整体指他们全部的邪恶；译作“所有的恶”简洁保留其集合性和抽象性。
- source_word: בַּגִּלְגָּל
  choice: 在吉甲
  rationale: 介词בְּ在这里表示地点；“在吉甲”符合现代汉语地名表达。
- source_word: כִּי שָׁם
  choice: 正是在那里
  rationale: כִּי既可表原因，也可带强调作用；正文采用强调读法，以“正是”突出地点，因果读法列入脚注。
- source_word: שְׂנֵאתִים
  choice: 我恨恶他们
  rationale: שׂנא直接表达恨恶或强烈弃绝；不以“拒绝”等较弱措辞淡化原文。
- source_word: עַל רֹעַ מַעַלְלֵיהֶם
  choice: 因为他们所做的尽是恶
  rationale: עַל在此说明原因，רֹעַ指邪恶，מַעַלְלִים指行为；此译自然地传达其行为的邪恶本质。
- source_word: מִבֵּיתִי אֲגָרְשֵׁם
  choice: 我必把他们赶出我的家
  rationale: גָּרַשׁ配合表示来源的מִן，意为从某处驱逐出去；“赶出”保留审判行动的力度，“我的家”保留原文紧凑的意象。
- source_word: לֹא אוֹסֵף אַהֲבָתָם
  choice: 不再爱他们
  rationale: אָסַף与后接不定式的结构在此表达不再继续某行动；“不再爱他们”是清楚自然的现代汉语。
- source_word: כָּל שָׂרֵיהֶם
  choice: 他们所有的首领
  rationale: שָׂרִים可指首领、统治者或官长；“首领”既保留政治领导者含义，也不限定为王室成员。
- source_word: סֹרְרִים
  choice: 都是悖逆的
  rationale: 该分词源于סרר，表示顽梗反叛；“悖逆的”兼顾其持续状态和先知文学语体。
theological_decisions:
- issue: 上帝恨恶的措辞
  choice: 保留“我恨恶他们”的直接表达
  alternative: 我弃绝他们／我转而反对他们
  rationale: 希伯来语שׂנא明确表达恨恶或弃绝。正文不作神学弱化，保留盟约审判话语的尖锐张力。
- issue: “我的家”的所指
  choice: 正文保留“我的家”这一意象
  alternative: 我的土地／我的圣所／我的家族
  rationale: 原文可能指耶和华的土地、圣所或盟约群体，但没有具体限定；保留原有比喻可避免过度诠释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“恨恶”“悖逆”等词保留先知审判话语的力度；句式清晰，避免古奥表达，同时不消解原文中כִּי的语义歧义及“我的家”的开放所指。
