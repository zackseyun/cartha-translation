id: HOS.9.7
reference: Hosea 9:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּ֣אוּ יְמֵ֣י הַ/פְּקֻדָּ֗ה בָּ֚אוּ יְמֵ֣י הַ/שִׁלֻּ֔ם יֵדְע֖וּ יִשְׂרָאֵ֑ל אֱוִ֣יל הַ/נָּבִ֗יא מְשֻׁגָּע֙ אִ֣ישׁ הָ/ר֔וּחַ עַ֚ל רֹ֣ב עֲוֺנְ/ךָ֔ וְ/רַבָּ֖ה מַשְׂטֵמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/007.yaml
  text: The days of punishment have come[a]; the days of repayment have come; Israel will know it. The prophet is a fool; the man of the spirit is mad[c][b], because of the greatness of your iniquity and your great hostility.
translation:
  language: zh_hans
  text: 惩罚的日子已经来到[a]，报应的日子已经来到；以色列必会知道。先知是愚妄的，受灵感的人是疯癫的[b]；这是因你的罪孽深重，敌意极大[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惩罚”也可译作“追讨”或“清算”；原词可指上帝临到察验并施行审判。
    reason: lexical_alternative
  - marker: b
    text: 有些人把这句话理解为百姓讥讽真先知的话：“先知是愚妄的，受灵感的人是疯癫的。”希伯来文并未明确标示这是引语。“受灵感的人”直译为“灵的人”，也可能指自称受灵感的人。
    reason: alternative_reading
  - marker: c
    text: 末句也可译作“因你的罪责众多，仇恨深重”。“敌意”或“仇恨”的对象，原文没有说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדָּה
  choice: 惩罚
  rationale: 在先知宣告审判的语境中，指带来刑罚的察验或追讨；“惩罚”在现代汉语中清楚保留其审判意味。
- source_word: שִׁלֻּם
  choice: 报应
  rationale: 此词表示偿还、报偿或按行为施予后果；“报应”与前句“惩罚”平行，也符合先知书审判语境。
- source_word: יֵדְעוּ יִשְׂרָאֵל
  choice: 以色列必会知道
  rationale: 将未完成式理解为预告未来的认识，即以色列终将认清所宣告的审判；中文不另补宾语，以保留原文简约表达。
- source_word: אֱוִיל הַנָּבִיא
  choice: 先知是愚妄的
  rationale: 保留谓语式表述及尖锐的谴责语气；“愚妄”兼具道德与属灵判断色彩，比口语化的“傻瓜”庄重。
- source_word: מְשֻׁגָּע
  choice: 疯癫的
  rationale: 表达失常、如同发狂的状态，语气有力而不过分口语化。
- source_word: אִישׁ הָרוּחַ
  choice: 受灵感的人
  rationale: 此短语直译为“灵的人”，可指受灵感或自称受灵感者；“受灵感的人”在现代中文中较自然，同时不明确限定为圣灵。
- source_word: עַל
  choice: 这是因
  rationale: 在此引出前述审判或谴责的原因；补出“这是”使中文衔接自然，但不限定其只修饰某一个前句。
- source_word: רֹב עֲוֺנְךָ
  choice: 你的罪孽深重
  rationale: רֹב 表示多、大或深重；“罪孽深重”自然地传达罪责的严重与累积。
- source_word: וְרַבָּה מַשְׂטֵמָה
  choice: 敌意极大
  rationale: מַשְׂטֵמָה 指敌意、仇恨或仇视；原文未明说敌意的对象，也没有重复第二人称后缀，因此不补出“你的”，以保存句法及指向上的开放性。
theological_decisions:
- issue: “先知是愚妄的，受灵感的人是疯癫的”由谁说、指谁
  choice: 正文不加引号，按经文表层语流呈现为审判临到时对先知或自称受灵感者的揭露
  alternative: 也可能是以色列人讥讽真先知的话，或专指假先知
  rationale: 希伯来文没有明确的引语标记；正文不加引号可避免把有争议的解释写死，脚注则交代另一种重要读法。
- issue: אִישׁ הָרוּחַ 中“灵”的所指
  choice: 译作“受灵感的人”，不明确写成“受圣灵感动的人”
  alternative: 可理解为受上帝之灵感动的人，也可带有自称受灵感的意味
  rationale: 原文在这里没有明确限定为圣灵；结合谴责语境，保持这种含混比加入特定教义判断更稳妥。
- issue: 末句“敌意”的归属与对象
  choice: 译作“敌意极大”，不补明是谁的敌意、针对谁
  alternative: 可理解为以色列的仇恨，也可能描述因罪而加剧的敌对状态
  rationale: 原文名词本身没有明说对象，且其前没有第二人称后缀；保持省略可保存经文的张力。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。重复“已经来到”以保留希伯来文的平行和紧迫感；“罪孽深重”兼顾自然表达与宗教语义；正文避免引号及“圣灵”等限定，以保存原文的解释空间。
