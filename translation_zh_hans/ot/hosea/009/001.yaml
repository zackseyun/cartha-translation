  text: אַל תִּשְׂמַ֨ח יִשְׂרָאֵ֤ל אֶל גִּיל֙ כָּֽ/עַמִּ֔ים כִּ֥י זָנִ֖יתָ מֵ/עַ֣ל אֱלֹהֶ֑י/ךָ אָהַ֣בְתָּ אֶתְנָ֔ן עַ֖ל כָּל גָּרְנ֥וֹת דָּגָֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/001.yaml
  text: Do not rejoice[a], Israel, with exultation like the peoples, for you have played the prostitute away from your God[b]; you have loved a prostitute’s payment on every threshing floor of grain.
translation:
  language: zh_hans
  text: 以色列啊，不要欢喜雀跃，像列族那样[a]！因为你背离你的神行淫；你喜爱各处打谷场上的妓女酬金[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文措辞紧缩，也可译作“以色列啊，不要像列族那样欢腾”。
    reason: lexical_alternative
  - marker: b
    text: “妓女酬金”指付给妓女的报酬。这里作为比喻，保留何西阿书以性交易意象控诉以色列背离神的表达；“打谷场”原文特别指谷物的打谷场。
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  choice: 不要欢喜
  rationale: אַל加未完成式表示禁止；“欢喜”自然、庄重，也准确表达שׂמח。
- source_word: אֶל גִּיל כָּעַמִּים
  choice: 不要像列族那样欢腾
  rationale: 原文结构紧缩，可能修饰前面的禁令。“欢腾”保留גיל较强烈的喜乐意味，“列族”贴近复数עַמִּים。
- source_word: זָנִיתָ מֵעַל אֱלֹהֶיךָ
  choice: 你背离你的神行淫
  rationale: 保留何西阿书以行淫比喻背约和偶像崇拜的鲜明意象；“背离”表达מֵעַל在此所含的离弃忠诚之意，而不把比喻抽象化。
- source_word: אֶתְנָן
  choice: 淫资
  rationale: 该词指付给娼妓的报酬；“淫资”简洁、现代，并保留原文具体而尖锐的形象。
- source_word: עַל כָּל גָּרְנוֹת דָּגָן
  choice: 各个谷物打谷场上
  rationale: 明确译出גָּרְנוֹת的“打谷场”和דָּגָן的“谷物”，避免把农业背景隐去。
theological_decisions:
- issue: 以性不忠比喻以色列对神的背约
  choice: 正文保留“行淫”和“淫资”的比喻
  alternative: 译作“你对神不忠”或“你喜爱偶像崇拜所得的利益”
  rationale: 原文刻意使用卖淫意象来控诉以色列离弃神；保留张力可避免淡化先知信息，也不把隐喻限定为某一种具体宗教仪式。
- issue: 打谷场与“淫资”的关系
  choice: 按原文并列呈现，不说明淫资具体如何来自打谷场
  alternative: 解释为在丰收祭仪中所得的报酬，或把谷物本身明确说成淫资
  rationale: 经文暗示以色列把各打谷场的出产视为偶像崇拜所得，却未明说具体仪式或支付方式，因此正文不作过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列族”保持先知书语体并区别于现代民族国家概念；“行淫”“淫资”虽尖锐，却是理解本节神学控诉不可删减的核心意象。
