  text: הֶעְמִֽיקוּ שִׁחֵ֖תוּ כִּ/ימֵ֣י הַ/גִּבְעָ֑ה יִזְכּ֣וֹר עֲוֺנָ֔/ם יִפְק֖וֹד חַטֹּאותָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/009.yaml
  text: They have gone deep into corruption[a], as in the days of Gibeah; he will remember their iniquity[b]; he will punish their sins.
translation:
  language: zh_hans
  text: 他们败坏至深[a]，如同基比亚的日子一样[b]；他必记念他们的罪孽，追讨他们的罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文措辞简短，近于“他们深入了；他们败坏了”，也可理解为“他们使自己败坏至深”。
    reason: lexical_alternative
  - marker: b
    text: “基比亚的日子”指《士师记》19—21章所记基比亚的暴行及其后果；这里以那段往事比拟以色列的败坏。
    reason: cross_reference
lexical_decisions:
- source_word: הֶעְמִיקוּ שִׁחֵתוּ
  choice: 深陷败坏
  rationale: 原文由“使深、深入”和“败坏”两个动词构成，表达简短而带有惯用意味。“深陷败坏”在现代汉语中自然，并保留了“深”这一意象和败坏不断加深的含义，而不把原文过度解释为某一种反身结构。
- source_word: כִּימֵי הַגִּבְעָה
  choice: 如同基比亚的日子
  rationale: 保留比较结构和地名，并以“日子”呈现原文对那段历史时期的指涉。
- source_word: יִזְכּוֹר
  choice: 必记住
  rationale: 未完成式在审判宣告的语境中指向将来的行动；“必”符合庄重的先知性语气。
- source_word: עֲוֺנָם
  choice: 他们的罪孽
  rationale: עָוֹן可指罪孽、罪责或罪罚；下句另有追讨之意，因此此处用“罪孽”保留其道德过犯的含义。
- source_word: יִפְקֹד
  choice: 追讨
  rationale: פקד在审判语境中表示察究、问责并施罚。“追讨”既清楚传达审判含义，也比直接译作“惩罚”更多保留该词的语义幅度。
- source_word: חַטֹּאותָם
  choice: 他们的罪
  rationale: 与“罪孽”平行，且处于审判语境中，明确指所犯的罪，而非赎罪祭。
theological_decisions:
- issue: 两个审判动词的隐含主语
  choice: 以“他”保留原文未明说姓名的第三人称单数主语
  alternative: 直接补出“上帝”或采用无主句
  rationale: 上下文表明施行记念和追讨的是上帝，但本节希伯来文并未明说其名；译作“他”既符合语境，也不消除原文形式上的含蓄。
- issue: “追讨”所表达的审判性质
  choice: 保留问责与施罚兼具的表达
  alternative: 明确译作“惩罚”
  rationale: 原词在此确有审判意味，但“追讨”避免把其较宽的察究、临到和问责语义缩减为单一的刑罚动作。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。“深陷败坏”保持原文意象而不显生硬；“罪孽／罪”呈现平行结构；分号划分败坏的指控与随后审判的宣告。
