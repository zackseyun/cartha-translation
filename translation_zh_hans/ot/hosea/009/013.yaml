id: HOS.9.13
reference: Hosea 9:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֶפְרַ֛יִם כַּ/אֲשֶׁר רָאִ֥יתִי לְ/צ֖וֹר שְׁתוּלָ֣ה בְ/נָוֶ֑ה וְ/אֶפְרַ֕יִם לְ/הוֹצִ֥יא אֶל הֹרֵ֖ג בָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/013.yaml
  text: Ephraim[a], as I have seen, is planted in a pleasant pasture like Tyre[c][b]; but Ephraim must bring out his children to the killer.
translation:
  language: zh_hans
  text: 正如我所见，以法莲像推罗一样，栽种在佳美之地[a]；然而，以法莲必带出自己的儿女[b]，交给杀戮者[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文的比较结构十分紧缩；也可译作：“以法莲，在我看来，栽种在佳美之地，如同推罗一样。”
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“他的众子”；这里按可统指后代的用法译作“儿女”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“杀人者”或“送去受杀戮”。希伯来文用的是指“正在杀害的人”的主动分词。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 采用现代中文圣经传统中通行的专名译法，指北国或同名支派。
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: 我所看见的
  rationale: 保留第一人称观察，并以自然中文嵌入结构含混而紧缩的比较句。
- source_word: לְצוֹר
  choice: 如同推罗
  rationale: 结合上下文，将介词 ל 理解为比较用法；同时借脚注说明希伯来文句法的压缩性。
- source_word: שְׁתוּלָה
  choice: 栽种
  rationale: 保留被栽植、安置的园艺意象，不将其解释性地改写为“繁荣”。
- source_word: בְנָוֶה
  choice: 在佳美的草场
  rationale: נָוֶה 可指草场、佳美居所或宜人之地；“佳美的草场”既体现有利环境，也与“栽种”的农业意象呼应。
- source_word: וְאֶפְרַיִם
  choice: 然而，以法莲却
  rationale: 连接词在此形成从安稳景象到惨痛结局的鲜明转折，中文用“然而……却”自然传达其逆接作用。
- source_word: לְהוֹצִיא
  choice: 必须把……带到
  rationale: 带 ל 的不定式在此表达注定或势必发生的行动；“必须”传达无法逃避的结局，而“带到”保留使之出去、带出的动作。
- source_word: אֶל הֹרֵג
  choice: 到杀人者面前
  rationale: הֹרֵג 是主动分词，直指实施杀戮的人；“杀人者”比抽象的“杀戮”更贴近原文的人称施事。
- source_word: בָּנָיו
  choice: 自己的儿女
  rationale: 字面为“他的众子”，但 בנים 可统指后代；这里着重全体儿女遭难，译作“儿女”符合现代中文集体用法。
theological_decisions:
- issue: 是否保留栽种的园艺意象
  choice: 保留“栽种在佳美的草场”
  alternative: 意译为“像推罗一样兴盛”
  rationale: 原文以安稳栽种与儿女被带去受杀害构成强烈对照；保留意象可避免把经文简化成对繁荣的解释。
- issue: 压缩的比较结构如何呈现
  choice: 正文译作“我所看见的以法莲，如同推罗栽种……”并以脚注保留另一种断句
  alternative: “照我所见，以法莲栽种在佳美之地，像推罗一样”
  rationale: 希伯来文中“我看见”“推罗”“栽种”和“草场”的句法关系紧缩，正文采用可读而较可能的比较关系，但不把其歧义隐藏起来。
- issue: בָּנָיו 指男性儿子还是后代整体
  choice: 儿女
  alternative: 儿子
  rationale: 该词形式上是“众子”，语境中也可概括子女或后代；译作“儿女”呈现家族整体遭审判的意义，同时以脚注交代字面形式。
- issue: אֶל הֹרֵג 应译为人物还是抽象事件
  choice: 杀人者
  alternative: 杀戮
  rationale: 原文使用主动分词，首先指向杀戮的施事者；正文保留这一人称性，不将其抽象化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“佳美的草场”维持原文农业意象；“杀人者”刻意保留主动分词所指的个人施事者。分号突出前半节安稳景象与后半节惨痛结局的转折。
