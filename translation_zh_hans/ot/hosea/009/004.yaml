id: HOS.9.4
reference: Hosea 9:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹא יִסְּכ֨וּ לַ/יהוָ֥ה יַיִן֮ וְ/לֹ֣א יֶֽעֶרְבוּ ל/וֹ֒ זִבְחֵי/הֶ֗ם כְּ/לֶ֤חֶם אוֹנִים֙ לָ/הֶ֔ם כָּל אֹכְלָ֖י/ו יִטַמָּ֑אוּ כִּֽי לַחְמָ֣/ם לְ/נַפְשָׁ֔/ם לֹ֥א יָב֖וֹא בֵּ֥ית יְהוָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/004.yaml
  text: They will not pour out wine offerings to Yahweh[a], and their sacrifices will not please him. They will be like mourners’ bread to them; all who eat it will become unclean. For their bread will be for themselves alone[b]; it will not enter the house of Yahweh.
translation:
  language: zh_hans
  text: 他们必不向雅威浇奠酒，他们的祭物也不会蒙他悦纳。他们的祭物对他们必如居丧者的饼[a]；凡吃这饼的，都必成为不洁净的。因为他们的饼只供自己食用[b]，不得进入雅威的殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如哀悼者的食物”。这短语很可能指与丧事有关、因接触死亡而带有礼仪性不洁净的食物。
    reason: lexical_alternative
  - marker: b
    text: 也可译“只为满足自己的食欲”或“只归他们自己”。希伯来语中的“自己”也可指“性命、食欲”；此处强调这些饼只能供他们食用，不适合带进雅威的殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְּכוּ ... יַיִן
  choice: 浇奠酒
  rationale: נסך在献祭语境中指浇奠，而יַיִן明确指出所奠的是酒；“浇奠酒”既保留动作，也自然传达祭祀含义。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל标明奠酒所献的对象；יהוה按其专名译作“雅威”。
- source_word: יֶעֶרְבוּ לוֹ
  choice: 蒙他悦纳
  rationale: ערב在这里表示祭物令神喜悦、为神所接纳；“蒙他悦纳”兼顾喜悦与祭祀是否被接纳的语境。
- source_word: זִבְחֵיהֶם
  choice: 他们的祭物
  rationale: זבח指宰献的祭牲或祭物；此处用“祭物”简洁自然，并与后文食用祭物相衔接。
- source_word: כְּלֶחֶם אוֹנִים
  choice: 如居丧者的饼
  rationale: 该短语指与丧事、死亡污秽相关的食物；保留“饼”的具体意象，并以“居丧者”说明其语境。
- source_word: יִטַמָּאוּ
  choice: 成为不洁净的
  rationale: טמא在献祭和圣所语境中表示礼仪上的不洁净，不宜泛化为道德上的败坏。
- source_word: לַחְמָם לְנַפְשָׁם
  choice: 他们的饼只供自己食用
  rationale: לחם直译为“饼”；נפש可指自己、生命或食欲。上下文强调这种食物只能满足他们自身，不能献入圣所。
- source_word: לֹא יָבוֹא בֵּית יְהוָה
  choice: 不得进入雅威的殿
  rationale: 原文表示这些食物不能进入雅威的殿，即不具备献入圣所的资格；“不得进入”自然传达这种礼仪上的排除。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式呈现立约之神的名字，而不以称号代替。
- issue: “居丧者的饼”所涉及的不洁净性质
  choice: 与居丧和死亡相关的礼仪性不洁净
  alternative: 一般的悲伤；道德上的污秽
  rationale: 本节围绕奠酒、祭物、食用后成为不洁净以及不得进入圣殿展开，因此这里主要是祭祀和礼仪层面的不洁净。
- issue: “如居丧者的饼”的句法所指
  choice: 承接“他们的祭物”
  alternative: 泛指他们所有的食物
  rationale: 马所拉文本在“他们的祭物”之后紧接比较短语，最自然是把祭物比作居丧者的饼；后文则进一步以“他们的饼”说明其食物不得进入圣殿。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“浇奠酒”“蒙他悦纳”“不洁净”保留献祭和礼仪语域；“居丧者的饼”保留原文意象，并用脚注解释其文化背景。所有脚注标记均置于相应词组之后。
