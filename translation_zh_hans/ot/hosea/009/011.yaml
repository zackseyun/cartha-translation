  yaml_path: translation/ot/hosea/009/011.yaml
  text: Ephraim—their glory will fly away like a bird—from birth[a], from the womb[b], and from conception.
translation:
  language: zh_hans
  text: 以法莲——他们的荣耀必如鸟飞去：不再有分娩[a]，不再有怀胎，也不再有受孕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分娩”指生孩子。希伯来文较直译为“从分娩、从子宫（或腹中）、从受孕”；整句表示他们在生育的各个阶段都将失去后代。
    reason: 说明希伯来文介词结构、子宫的字面义及三重表达的含义。
  - marker: b
    text: “受孕”所译的希伯来词也可译作“怀孕”。原文按“分娩—子宫（即怀胎阶段）—受孕”的次序，从后向前追溯生育过程。
    reason: 保留词义选择及原文逆向次序。
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 采用现代中文圣经人名的通行译法；此处将北国或该支派人格化。
- source_word: כָּעוֹף
  choice: 如鸟
  rationale: 前缀 כ 表示比拟；עוֹף 在此自然地译为“鸟”。
- source_word: יִתְעוֹפֵף
  choice: 必……飞去
  rationale: 该动词描写飞走、消逝；“飞去”兼顾动态意象与失去之意。
- source_word: כְּבוֹדָם
  choice: 他们的荣耀
  rationale: 保留 כָּבוֹד 的核心比喻及其“荣耀、尊荣、荣美”等语义空间，不在正文中将所指限定为儿女或生育力。
- source_word: מִלֵּדָה
  choice: 不再有生产
  rationale: מן 在本句表达荣耀从生产阶段离去、该阶段不再结果；用“不再有”使中文清楚表达剥夺或落空，而“生产”在此指生孩子。
- source_word: וּמִבֶּטֶן
  choice: 不再有怀胎
  rationale: בֶּטֶן 字面可指腹部或子宫，此处处于生育阶段的序列中，按语境译为“怀胎”，避免生硬的“从子宫”。
- source_word: וּמֵהֵרָיוֹן
  choice: 不再有受孕
  rationale: הֵרָיוֹן 可指受孕或怀孕；在“生产—怀胎—受孕”的逆向序列中，“受孕”最能显出回溯到最初阶段的修辞。
theological_decisions:
- issue: “他们的荣耀”所指为何
  choice: 正文保留“荣耀”这一比喻，由上下文暗示儿女、生育力和民族生命力。
  alternative: 直接译成“他们引以为荣的儿女”或理解为财富、广义的国家尊荣。
  rationale: 本节没有明说“荣耀”就是儿女，虽然上下文强烈指向后代与生育；保留比喻可避免过度限定。
- issue: 三个介词短语的作用
  choice: 理解为在生产、怀胎、受孕各阶段都失去后代，并保留希伯来文由后向前追溯的次序。
  alternative: 仅视为三个并列项目，不强调逆向推进或全面剥夺。
  rationale: 希伯来文依次列出生产、子宫/怀胎、受孕，形成回溯整个生育过程的三重表达；中文以重复“不再有”显明这种剥夺含义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“以法莲——”后的破折号保留先提出主题、再作宣告的力度；冒号引出荣耀消逝在生育各阶段的具体表现。正文避免生硬直译“从生产、从子宫、从受孕”，以“不再有”传达 מן 在语境中的剥夺含义，同时通过脚注保存原文形式与歧义。
