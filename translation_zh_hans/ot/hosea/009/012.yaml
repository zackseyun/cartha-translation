id: HOS.9.12
reference: Hosea 9:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י אִם יְגַדְּלוּ֙ אֶת בְּנֵי/הֶ֔ם וְ/שִׁכַּלְתִּ֖י/ם מֵֽ/אָדָ֑ם כִּֽי גַם א֥וֹי לָ/הֶ֖ם בְּ/שׂוּרִ֥/י מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/012.yaml
  text: Even if they raise their children[a], I will bereave them so that not a man remains; for indeed[b], woe to them when I depart from them.
translation:
  language: zh_hans
  text: 即使他们养大自己的儿女[a]，我也要使他们丧尽儿女，无一人存留。的确，我离开[b]他们时，他们就有祸了！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿女”或译“儿子”。希伯来语名词可以特指儿子，也常泛指子女或后代。
    reason: lexical_alternative
  - marker: b
    text: “离开”或译“转离”。希伯来语可强调神在审判中转身离去、撤去眷顾与同在。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 即使
  rationale: 此处引出让步条件；“即使”自然地表达“纵然如此，结局仍不改变”的语气。
- source_word: יְגַדְּלוּ
  choice: 养大
  rationale: גדל 的 Piel 词形用于儿女时表示抚养、养育成人；“养大”简明而符合现代汉语。
- source_word: בְּנֵיהֶם
  choice: 自己的儿女
  rationale: בנים 可特指儿子，也常泛指后代；上下文着重丧失子女，故正文采用涵盖性较强的“儿女”，并以脚注保留“儿子”这一较窄译法。
- source_word: וְשִׁכַּלְתִּים
  choice: 我也要使他们丧尽儿女
  rationale: שׁכל 表示遭受丧子之痛或被夺去儿女。“使他们丧尽儿女”保留神施行审判的主语和惨烈程度。
- source_word: מֵאָדָם
  choice: 无一人存留
  rationale: 该短语字面简练且含义困难；结合使人丧失儿女的语境，译为“无一人存留”，表达彻底失去人的结果，同时避免抽象译作“离开人类”。
- source_word: כִּי גַם
  choice: 的确
  rationale: 此组合在这里加强随后的警告；“的确”以自然汉语保留其强调语气。
- source_word: אוֹי לָהֶם
  choice: 他们就有祸了
  rationale: אוֹי 是先知性哀叹与审判宣告。“有祸了”庄重、清楚，并与时间从句自然衔接。
- source_word: בְּשׂוּרִי מֵהֶם
  choice: 我离开他们时
  rationale: סור 表示离开或转离，第一人称词尾表明行动者是神；前缀 בְּ 在此表达时间或情境，故译作“……时”。
theological_decisions:
- issue: 末句中神离开的含义
  choice: 译作“我离开他们时”，指神在审判中撤去同在与眷顾。
  alternative: “我转离他们时”或“我离弃他们时”。
  rationale: בְּשׂוּרִי 的第一人称形式有力支持是神离开百姓，而不是百姓离开神。正文不进一步解释这种离开的系统神学含义，以保留经文自身的张力。
- issue: מֵאָדָם 所表达的审判范围
  choice: 译作“无一人存留”，将其理解为儿女被夺尽的彻底结果。
  alternative: “使他们丧失人丁”或较字面的“使他们丧失人”。
  rationale: 希伯来文短语高度凝练，可能强调不再有任何人存留。译文呈现上下文最可能的结果含义，但不把它扩展为对全人类的普遍陈述。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“丧尽儿女”传达原文的丧亲之痛与审判力度；末句用感叹号保留 אוֹי 的哀叹和警告色彩。所有代词均依上下文保留，不额外补入“以色列”或其他解释性称谓。
