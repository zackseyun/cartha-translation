source:
  edition: WLC
  text: מַֽה תַּעֲשׂ֖וּ לְ/י֣וֹם מוֹעֵ֑ד וּ/לְ/י֖וֹם חַג יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/005.yaml
  text: What will you do on the day of appointed assembly[a], and on the day of the feast of Yahweh?
translation:
  language: zh_hans
  text: 到了指定的圣会[a]的日子，到了耶和华节期的日子，你们要怎么办呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“指定的时间”或“节期”。希伯来语 מוֹעֵד 可泛指指定的时间，也可特指神圣的聚会。
    reason: 保留 מוֹעֵד 在时间与宗教集会之间的词义幅度。
lexical_decisions:
- source_word: מַה
  choice: 怎么办
  rationale: 该疑问词在这里引出反问；与 תַּעֲשׂוּ 合译为现代汉语自然的“怎么办”，既包含“做什么”，也传达面临审判处境时无计可施的语气。
- source_word: תַּעֲשׂוּ
  choice: 你们要……办
  rationale: 这是 עשה 的 Qal 未完成式第二人称阳性复数；“你们要怎么办”自然表达指向未来处境的疑问。
- source_word: לְיוֹם
  choice: 到了……的日子
  rationale: 介词 לְ 在此作时间用法；“到了……的日子”符合现代汉语习惯，也保留对将来特定时日的指向。
- source_word: מוֹעֵד
  choice: 指定圣会
  rationale: 该词可指指定的时间，也可特指宗教性的集会或节期。上下文与 חַג 平行，译作“指定圣会”保留其受指定和敬拜聚集的双重意味，同时不与后面的“节期”完全合并。
- source_word: וּלְיוֹם
  choice: 到了……的日子
  rationale: 重复时间结构，以体现希伯来语的平行句式；汉语省去生硬的连接词仍可清楚表达递进并列。
- source_word: חַג
  choice: 节期
  rationale: 该词指庆典或朝圣节期；“节期”是自然、庄重且适合敬拜语境的现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语圣经传统中通行的专名“耶和华”表达四字神名，而不以“主”等称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是四字神名的音译形式；采用现代汉语读者最熟悉的“耶和华”，并保留其作为专名而非称号的性质。
- issue: מוֹעֵד 与 חַג 的关系
  choice: 分别译作“指定圣会”和“节期”
  alternative: 两者都译作“节期”或将前者译作“指定时间”
  rationale: 原文使用两个相关却不完全相同的礼仪词汇。加以区分，既保留平行结构，也避免把两者的语义范围压平；脚注则说明 מוֹעֵד 的真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们要怎么办呢”保留原文反问力度；重复“到了……的日子”再现平行结构。
