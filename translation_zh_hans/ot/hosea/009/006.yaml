  text: כִּֽי הִנֵּ֤ה הָֽלְכוּ֙ מִ/שֹּׁ֔ד מִצְרַ֥יִם תְּקַבְּצֵ֖/ם מֹ֣ף תְּקַבְּרֵ֑/ם מַחְמַ֣ד לְ/כַסְפָּ֗/ם קִמּוֹשׂ֙ יִֽירָשֵׁ֔/ם ח֖וֹחַ בְּ/אָהֳלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/006.yaml
  text: For behold[a], they have gone away from destruction; Egypt will gather them, Memphis will bury them. Nettles will possess the precious things of their silver; thorns will be in their tents.
translation:
  language: zh_hans
  text: 看哪，他们因毁灭而逃走；埃及必收聚他们，孟斐斯必埋葬他们。荨麻[a]必占据他们所珍爱的银财；荆棘必长在他们的帐棚里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荨麻”所译的希伯来植物名确切种类不明，也可能泛指荨麻一类的荒草。
    reason: 说明植物名称在词汇辨识上的不确定性，避免造成虚假的植物学精确性。
lexical_decisions:
- source_word: מִשֹּׁד
  choice: 逃离毁灭
  rationale: שֹׁד指暴力造成的毁坏或毁灭；介词מִן与“离去”连用，表达从毁灭中逃走，却不暗示他们最终成功脱险。
- source_word: תְּקַבְּצֵם
  choice: 必收聚他们
  rationale: קבץ在此意为聚集、收拢；以埃及为拟人化主语，并保留该词在审判语境中的反讽意味。
- source_word: מֹף
  choice: 孟斐斯
  rationale: 这是埃及古城孟斐斯的希伯来名称，采用现代中文通行译名。
- source_word: תְּקַבְּרֵם
  choice: 必埋葬他们
  rationale: קבר直接指埋葬；与“埃及必收聚他们”平行，表明逃亡最终以客死异乡告终。
- source_word: מַחְמַד לְכַסְפָּם
  choice: 他们珍爱的银财
  rationale: מַחְמַד指可喜爱、贵重之物，כֶּסֶף可指银子或钱财；“珍爱的银财”自然地表达他们视为宝贵的银质财物或财富，又不将所指限制为某类器具。
- source_word: קִמּוֹשׂ
  choice: 荨麻
  rationale: 该词指荒废之地滋生的有害植物，具体品种不能完全确定；正文采用较具体且有传统依据的“荨麻”，并以脚注说明不确定性。
- source_word: יִירָשֵׁם
  choice: 必归……占有
  rationale: ירשׁ可指承受、占有或夺取；此处以荨麻为主语，描绘荒草接管被遗弃财物的反转景象。
- source_word: חוֹחַ
  choice: 荆棘
  rationale: חוֹחַ泛指有刺植物；“荆棘”符合现代中文圣经诗歌语体，也清楚呈现荒凉景象。
- source_word: בְּאָהֳלֵיהֶם
  choice: 在他们的帐棚里
  rationale: אֹהֶל本义为帐棚；保留具体意象，并与荒废后荆棘丛生的画面相配。
theological_decisions:
- issue: הָלְכוּ מִשֹּׁד开头短语的解释
  choice: 他们已经从毁灭中逃走，但并未真正脱离审判
  alternative: 他们因毁灭而离去；或他们已成功逃过毁灭
  rationale: 介词短语可带空间或原因意味，但下文说埃及收聚他们、孟斐斯埋葬他们，明确否定了成功获救的理解。“逃离毁灭”保留移动方向，同时让后文显明这场逃亡徒劳无功。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留先知话语的警示力度；“收聚—埋葬”保持原文平行结构；“银财”“帐棚”兼顾普通读者的可懂度与诗歌意象。
