  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִמְאָסֵ֣/ם אֱלֹהַ֔/י כִּ֛י לֹ֥א שָׁמְע֖וּ ל֑/וֹ וְ/יִהְי֥וּ נֹדְדִ֖ים בַּ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/017.yaml
  text: My God will reject them because they have not listened to him[a], and they will be wanderers among the nations.
translation:
  language: zh_hans
  text: 我的上帝必弃绝他们，因为他们不听从他[a]；他们必在列国中漂泊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不顺服他。”希伯来文直译为“不听他”，在本句语境中含有不顺服之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְאָסֵם
  choice: 必弃绝他们
  rationale: מָאַס表示拒绝、弃绝；“弃绝”在现代中文中自然庄重，也保留此处审判与盟约关系破裂的力度，而不把它过度解释为情感上的憎恶。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 保留第一人称单数所属后缀，呈现何西阿亲自宣告“我的上帝”的先知声音。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出上帝弃绝他们的原因，“因为”准确而自然。
- source_word: לֹא שָׁמְעוּ לוֹ
  choice: 他们不听从他
  rationale: שׁמע与ל连用兼有听取和服从之意。“听从”保留“听”的意象，同时自然传达语境中不顺服的含义。
- source_word: וְיִהְיוּ
  choice: 他们必……
  rationale: היה在此描述随后所处的境况；中文无需另加“成为”，以“必……漂泊”简洁表达结果状态。
- source_word: נֹדְדִים
  choice: 漂泊
  rationale: 该分词表达流离、四处迁徙的状态。“漂泊”简明自然，并避免把含义收窄为“逃亡”。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: 指以色列将散居其间的各国；“列国”符合经文语域，又不引入新约语境较强的“外邦人”。
theological_decisions:
- issue: 先知所说“我的上帝”
  choice: 保留“我的上帝”
  alternative: 简化为“上帝”
  rationale: 希伯来文明确含第一人称所属后缀；保留它既忠于原文，也维持先知个人宣告及其盟约意味。
- issue: שׁמע应译作“听”还是“顺服”
  choice: 正文译作“不听从他”
  alternative: “不听他的话”或“不顺服他”
  rationale: “听从”同时保留听取的语言形象和语境所含的顺服意义，不必在两者之间作过度单一化的处理。
- issue: 流亡境况是“成为”还是“处于”漂泊状态
  choice: 译作“他们必在列国中漂泊”
  alternative: “他们必成为列国中的漂泊者”
  rationale: 希伯来文היה可表示“是”或“成为”；汉语动词性表达更自然，也保留将来结果而不强行确定其体貌细节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弃绝”保持审判力度；“漂泊”自然呈现流散于列国的处境。正文中的脚注标记[a]与脚注对应。
