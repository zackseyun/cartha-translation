id: HOS.9.3
reference: Hosea 9:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹ֥א יֵשְׁב֖וּ בְּ/אֶ֣רֶץ יְהוָ֑ה וְ/שָׁ֤ב אֶפְרַ֨יִם֙ מִצְרַ֔יִם וּ/בְ/אַשּׁ֖וּר טָמֵ֥א יֹאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/003.yaml
  text: They will not remain in the land of Yahweh[a]; Ephraim will return to Egypt[c][b], and in Assyria they will eat unclean food.
translation:
  language: zh_hans
  text: 他们必不得住在耶和华的地上[a]；以法莲必返回埃及[b]，并在亚述吃不洁净的食物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“居住在耶和华的地上。”
    reason: יֵשְׁבוּ既可泛指居住，也可在此语境中强调继续留居。
  - marker: b
    text: “埃及”既可指实际地点，也可能让人联想到再次受奴役、被掳流亡；原文将它与亚述并提，并未消除这层张力。
    reason: 保存地名的字面所指与其可能具有的象征、预表意味。
  - marker: c
    text: 直译：“吃不洁净之物。”
    reason: 原文以形容词טָמֵא作名词性用法，并未明说“食物”。
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: 住
  rationale: יָשַׁב可指居住、生活或停留；此处否定式置于流亡审判语境中，表达他们不能继续居住在此地。中文“不得住在”自然保留居住与继续留居两层意味。
- source_word: בְּאֶרֶץ יְהוָה
  choice: 在耶和华的地上
  rationale: 该短语表明这地属于耶和华，并带有圣约土地的意味；直译为“耶和华的地”既自然，也不把归属关系弱化为单纯地名。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确对应四字神名，而不以泛称替代。
- source_word: וְשָׁב
  choice: 必返回
  rationale: 在先知性审判话语中，此形式指向将来的结果；“返回”准确表达שׁוב，并呼应埃及作为以往奴役之地的背景。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 保留原文专名；它在何西阿书中常代指北国，但正文不将其解释性改写为“以色列”。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 保留原文明确的地名，不在正文中决定它是实际目的地，还是重陷奴役与流亡的象征。
- source_word: וּבְאַשּׁוּר
  choice: 并在亚述
  rationale: וְ是普通连接词；译作“并”保留埃及与亚述并列所形成的张力，不强加转折或解释两者关系。
- source_word: טָמֵא
  choice: 不洁净的食物
  rationale: 此形容词作名词性用法，是“所吃的不洁之物”；补出“食物”符合现代汉语，同时保留礼仪和圣约层面的不洁含义。
- source_word: יֹאכֵלוּ
  choice: 吃
  rationale: 按其直接含义翻译；与“不洁净的食物”连用，表达流亡中无法维持礼仪洁净的后果。
theological_decisions:
- issue: “埃及”是实际地点，还是重陷奴役与流亡的象征
  choice: 正文保留“埃及”这一地名，不判定其为纯字面或纯象征。
  alternative: 将“埃及”解释为一般性的流亡象征，或仅视亚述为实际流亡地。
  rationale: 希伯来文本明确同时提到埃及和亚述；何西阿书中的“埃及”可能兼有历史及预表意味。译文应保存这种张力，而非将两处协调为单一目的地。
- issue: טָמֵא的礼仪含义
  choice: 译作“不洁净的食物”。
  alternative: 译作“污秽的食物”或“不洁净之物”。
  rationale: 上下文涉及离开耶和华之地后的处境，重点不只是卫生或品质，而是礼仪与圣约意义上的不洁；“不洁净的食物”在现代汉语中清楚而不过度阐释。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“必不得”与“必返回”保留先知审判宣告的确定性；使用“耶和华”“以法莲”“亚述”等中文圣经传统通行专名。脚注标记依其对应词语顺序列为[a]、[b]、[c]。
