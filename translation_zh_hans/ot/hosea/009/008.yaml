  text: צֹפֶ֥ה אֶפְרַ֖יִם עִם אֱלֹהָ֑/י נָבִ֞יא פַּ֤ח יָקוֹשׁ֙ עַל כָּל דְּרָכָ֔י/ו מַשְׂטֵמָ֖ה בְּ/בֵ֥ית אֱלֹהָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/008.yaml
  text: Ephraim’s watchman is with my God[a]; the prophet is a fowler’s snare on all his ways[b], and hostility is in the house of his God.
translation:
  language: zh_hans
  text: 以法莲的守望者与我的上帝同在[a]；先知在他所走的一切道路上，都是捕鸟人的网罗；敌意就在他上帝的家中。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以法莲是与我的上帝同在的守望者；先知在他所走的一切道路上，都是捕鸟人的网罗。”希伯来语句法较难确定；有人将第一小句理解为正面的陈述，随后经文才转为控诉。
    reason: alternative_reading
  - marker: b
    text: “敌意”也可译为“仇恨”或“仇视”。末句直译为“敌意在他上帝的家中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפֶה
  choice: 守望者
  rationale: 该分词指负责观察、警戒的人；“守望者”自然保留了希伯来圣经中的守望意象及其可能具有的先知职分色彩。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 采用现代中文圣经中通行的支派及北国名称译法。
- source_word: עִם אֱלֹהָי
  choice: 与我的上帝同在
  rationale: עִם通常表示“与……同在”，אֱלֹהָי的一人称单数后缀译为“我的上帝”，保留马所拉文本突出的说话者视角。
- source_word: נָבִיא
  choice: 先知
  rationale: 希伯来语没有冠词；中文“先知”可自然地作代表性单数使用，同时避免不必要地强加“一个”或“那位”。
- source_word: פַּח יָקוֹשׁ
  choice: 捕鸟人的网罗
  rationale: 这一捕捉鸟类的设网意象译为“捕鸟人的网罗”，既清楚自然，也保留诱捕与危害的含义。
- source_word: עַל כָּל דְּרָכָיו
  choice: 在他所走的一切道路上
  rationale: 保留“道路”的具象及比喻空间；“他”依照三人称阳性单数后缀，不擅自明确其指代对象。
- source_word: מַשְׂטֵמָה
  choice: 敌意
  rationale: 该名词表示仇视、敌对或仇恨；“敌意”既涵盖内在仇视，也可包含实际敌对，不作过度限定。
- source_word: בְּבֵית אֱלֹהָיו
  choice: 在他上帝的殿中
  rationale: “殿”在敬拜场所语境中比字面的“房屋”更自然；保留“他上帝”的第三人称后缀，与前面的“我的上帝”形成原文中的张力。
theological_decisions:
- issue: “我的上帝”与“他上帝”的人称变化
  choice: 保留“与我的上帝同在……在他上帝的殿中”
  alternative: 将两处都顺译为“上帝”，或统一人称
  rationale: 马所拉文本明确呈现一人称与三人称的转换。译文不加以调和，以保存说话者视角及可能暗示的疏离张力。
- issue: “守望者／先知”的身份与句法关系
  choice: 正文按谴责性语境理解：以法莲的守望者与“先知”相联系，后者成为网罗
  alternative: 把前半句正面理解为“以法莲是与我的上帝同在的守望者”，随后才转为对先知的控诉
  rationale: 上下文整体偏向审判与谴责，因此正文采用负面指向；但希伯来语句法简约而困难，另一种分句及理解仍属真实可能，故收入脚注。
- issue: “他的道路”中代词的指向
  choice: 保留含混的“他所走的一切道路”
  alternative: 明确解释为先知、以法莲，或被先知陷害之人的道路
  rationale: 三人称阳性单数后缀的指向并不完全明确；译文维持原文的含混，不替读者作超出文本的裁定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“守望者”“网罗”“殿”保留经文意象；分号呈现希伯来诗行内部的转折与并列。正文及脚注保留原文句法、人称和代词指向上的真实张力。
