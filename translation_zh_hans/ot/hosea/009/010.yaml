source:
  edition: WLC
  text: כַּ/עֲנָבִ֣ים בַּ/מִּדְבָּ֗ר מָצָ֨אתִי֙ יִשְׂרָאֵ֔ל כְּ/בִכּוּרָ֤ה בִ/תְאֵנָה֙ בְּ/רֵ֣אשִׁיתָ֔/הּ רָאִ֖יתִי אֲבֽוֹתֵי/כֶ֑ם הֵ֜מָּה בָּ֣אוּ בַֽעַל פְּע֗וֹר וַ/יִּנָּֽזְרוּ֙ לַ/בֹּ֔שֶׁת וַ/יִּהְי֥וּ שִׁקּוּצִ֖ים כְּ/אָהֳבָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/010.yaml
  text: Like grapes in the wilderness I found Israel[a]; like the first-ripe fruit on the fig tree in its first season I saw your fathers. They came to Baal-peor and consecrated themselves to shame[d][c][b], and they became detestable like the thing they loved.
translation:
  language: zh_hans
  text: 我发现以色列，如同在旷野发现葡萄；我看见你们的祖先，如同无花果树初结时的早熟果子[a]。他们来到巴力·毗珥，献身于羞耻[b][c]；他们变得可憎，如同他们所爱之物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“无花果树起初时的初熟果”；所描绘的是最早成熟、格外珍贵的无花果。
    reason: lexical_alternative
  - marker: b
    text: “羞耻”很可能是对巴力·毗珥相关偶像的蔑称；也可译作“那可耻之物”。
    reason: alternative_reading
  - marker: c
    text: 参见《民数记》25:1—5；那里记载以色列人与巴力·毗珥联合。
    reason: cross_reference
lexical_decisions:
- source_word: כַּעֲנָבִים בַּמִּדְבָּר
  choice: 如同在旷野发现葡萄
  rationale: כְּ表示比拟；מִדְבָּר可指旷野或荒漠。译作“旷野”既自然，也保留在不结果之地意外发现佳果的意象。
- source_word: מָצָאתִי יִשְׂרָאֵל
  choice: 我……发现以色列
  rationale: מצא的qal完成式直译为“发现／找到”。“发现”适合这里意外遇见珍贵果实的比喻，并以“以色列”为宾语。
- source_word: כְּבִכּוּרָה בִתְאֵנָה בְּרֵאשִׁיתָהּ
  choice: 如同看见无花果树初结的果子
  rationale: בִּכּוּרָה指最早成熟、格外珍贵的果子；בְּרֵאשִׁיתָהּ字面为“在它起初的时候”。此译自然呈现早期初熟果的农业意象，脚注保留较直译的表达。
- source_word: רָאִיתִי אֲבוֹתֵיכֶם
  choice: 我看见你们的祖先
  rationale: ראה与前句מצא平行，译为“看见”。אֲבוֹתֵיכֶם字面是“你们的父辈”，在此指现今听众的先祖；中文“祖先”准确而自然。
- source_word: הֵמָּה בָּאוּ בַעַל פְּעוֹר
  choice: 他们却来到巴力·毗珥
  rationale: בוא是“来到／进入”。独立代词הֵמָּה带强调，在前后强烈转折的语境中用“却”表达其对比作用；“巴力·毗珥”保留专名。
- source_word: וַיִּנָּזְרוּ לַבֹּשֶׁת
  choice: 献身于那可耻之物
  rationale: נזר的nifal在此有分别、委身或献身的宗教意味。“献身”保留讽刺性的敬拜语感；בֹּשֶׁת本义为羞耻，也可能是对偶像的蔑称，故译为“那可耻之物”，同时以脚注说明歧义。
- source_word: וַיִּהְיוּ שִׁקּוּצִים
  choice: 他们也变得可憎
  rationale: שִׁקּוּצִים常指可憎之物，尤其用于偶像崇拜语境。因主语是人，中文以谓语“变得可憎”较自然，并保留强烈的宗教道德厌恶。
- source_word: כְּאָהֳבָם
  choice: 如同他们所爱之物
  rationale: 短语高度凝练，可理解为他们变得像自己所爱的对象。此译保留比较关系和对象未明说的含蓄性，不直接补成“偶像”。
theological_decisions:
- issue: לַבֹּשֶׁת在偶像崇拜语境中的所指
  choice: 译为“献身于那可耻之物”，不在正文直接把它等同于巴力
  alternative: “献身于羞耻”或“献身于那偶像”
  rationale: 希伯来文使用“羞耻”这一带蔑视意味的词，可能借指巴力或相关偶像。正文保留其修辞和一定歧义，脚注说明可能所指，避免过度明确化。
- issue: כְּאָהֳבָם所爱的对象
  choice: 译为“如同他们所爱之物”
  alternative: “如同他们所爱的偶像”或“照着他们的爱”
  rationale: 上下文强烈暗示偶像，但希伯来文并未明说宾语。译文保留这种含蓄与神学张力。
- issue: אֲבוֹתֵיכֶם的表达
  choice: 译为“你们的祖先”
  alternative: “你们的父辈”
  rationale: 此词形式上为阳性复数“父辈”，语境中指民族先祖。现代中文“祖先”既准确指向历史先辈，也不额外改变经文论旨。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前两分句保持葡萄与初熟无花果的平行比喻；后半以“却”体现独立代词在强烈语境中的强调和反差。“巴力·毗珥”采用中文圣经传统音译并加间隔号。所有脚注标记均已置于正文相应位置。
