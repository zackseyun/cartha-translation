- from: 我在旷野发现以色列，如同发现葡萄；我看见你们的祖先，如同看见无花果树初结的果子[a]。他们却来到巴力·毗珥，献身于那可耻之物[b][c]；他们也变得可憎，如同他们所爱之物。
