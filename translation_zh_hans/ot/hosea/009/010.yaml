  naturalness: 修订后以“如同在旷野发现葡萄”及“如同无花果树初结时的早熟果子”重现两个平行比喻，现代汉语自然且庄重。“献身于羞耻”在此先知性讽刺语境中可理解，脚注提供偶像所指的必要说明。
  terminology: “巴力·毗珥”是适当的专名译法。“祖先”“可憎”“所爱之物”均符合语境。删除“却”和“也”：希伯来文的独立代词可表达强调，但没有明示转折连词；“也”则无必要增补。
