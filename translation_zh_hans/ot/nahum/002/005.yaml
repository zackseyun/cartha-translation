base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/005.yaml
  text: In the streets the chariots race wildly[a]; they rattle through the squares. Their appearance is like torches[c][b]; like lightning they dart about.
translation:
  language: zh_hans
  text: 战车在街上狂奔[a]，在广场上辚辚作响[b]；它们的样子如同火把；它们如闪电般来回飞驰[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂奔”或译“横冲直撞”；原文动词可表示疯狂、失控般的行动。
    reason: lexical_alternative
  - marker: b
    text: “辚辚作响”或译“轰隆作响”；这个罕见的希伯来语动词可能具有拟声性质，突出战车颠簸奔驰时的嘈杂声。
    reason: lexical_alternative
  - marker: c
    text: “来回飞驰”也可译作“疾驰穿梭”；原文强调快速往返的运动。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּצוֹת
  choice: 在街上
  rationale: חוּצוֹת在这里指城中的街道，与下一分句的“广场”平行；译作“街上”自然且符合城市语境。
- source_word: יִתְהוֹלְלוּ
  choice: 狂奔
  rationale: 该词在此表达近乎疯狂、失控的猛烈行动；“狂奔”兼顾高速运动与狂乱色彩。
- source_word: הָרֶכֶב
  choice: 战车
  rationale: רֶכֶב虽为单数形式，在这里是集合名词，指成群的战车；汉语“战车”本身可作集合性表达。
- source_word: יִשְׁתַּקְשְׁקוּן
  choice: 轰隆作响
  rationale: 这是罕见且可能具有拟声性质的动词，描写战车颠簸奔驰时发出的巨大杂乱声响；“轰隆作响”在现代汉语中形象自然。
- source_word: בָּרְחֹבוֹת
  choice: 在广场上
  rationale: רְחֹבוֹת指城内宽阔的公共空间或广场；“广场”准确呈现其城市空间含义。
- source_word: מַרְאֵיהֶן
  choice: 它们看起来
  rationale: 原词指可见的外观；采用动词化表达，使中文自然流畅，同时保留视觉描写。
- source_word: כַּלַּפִּידִם
  choice: 如同火把
  rationale: לַפִּידִים指火把或燃烧的火炬；“火把”通俗、鲜明，并保留原比喻。
- source_word: כַּבְּרָקִים
  choice: 如闪电般
  rationale: בְּרָקִים指闪电或闪电的亮光；“如闪电般”自然连接后面的快速动作。
- source_word: יְרוֹצֵצוּ
  choice: 来回飞驰
  rationale: 该动词强调迅速地奔走往返；“来回飞驰”保留其高速和往复运动的意象。
