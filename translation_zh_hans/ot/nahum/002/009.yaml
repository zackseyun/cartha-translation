  text: וְ/נִינְוֵ֥ה כִ/בְרֵֽכַת מַ֖יִם מִ֣/ימֵי הִ֑יא וְ/הֵ֣מָּה נָסִ֔ים עִמְד֥וּ עֲמֹ֖דוּ וְ/אֵ֥ין מַפְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/009.yaml
  text: Nineveh has been like a pool of water from her earliest days[a], yet they are fleeing[b]. “Stop! Stop!”—but no one turns back.
translation:
  language: zh_hans
  text: 尼尼微自古以来[a]就像一池水，如今他们却在逃跑。“站住！站住！”[b]但没有人回头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“从她存在的日子起”，意思是从尼尼微早期或久远的过去开始。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“停下！停下！”“站住”较贴近原文动词的字面意思；在众人逃跑的场景中，命令的实际意思是叫他们停下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִינְוֵה
  choice: 尼尼微
  rationale: 按现代汉语通行译名处理地名。
- source_word: כִבְרֵכַת מַיִם
  choice: 像一池水
  rationale: 保留原文将城比作聚集水体的简明意象，不额外限定为人工水库。
- source_word: מִימֵי הִיא
  choice: 自古以来
  rationale: 原文直译近于“从她存在的日子起”，表达尼尼微长久以来的状态；“自古以来”在现代汉语中自然凝练。
- source_word: וְהֵמָּה נָסִים
  choice: 如今他们却在逃跑
  rationale: 独立代词加分词突出城中人正在逃跑；“却”呈现与尼尼微昔日如池水般聚集、稳定的状态之间的反差，“如今”为汉语补明语境中的今昔对照。
- source_word: עִמְדוּ עֲמֹדוּ
  choice: 站住！站住！
  rationale: 重复命令表现急迫呼喊；“站住”既贴近动词“站立”的字面意义，也能在逃亡场景中自然表达叫人停下。
- source_word: וְאֵין מַפְנֶה
  choice: 但没有人回头
  rationale: 按语境将该分词结构作人的动作理解，指无人响应呼喊而转回；“回头”保留转向之意，也符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。主句保留“水池—逃跑”的突转，不把“他们”解释性改写成“池水”，以保存原文由城市意象转向居民行动的张力。引语使用短促重复，表现现场的慌乱与命令无人理会。
