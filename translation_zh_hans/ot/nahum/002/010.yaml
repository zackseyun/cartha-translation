  text: בֹּ֥זּוּ כֶ֖סֶף בֹּ֣זּוּ זָהָ֑ב וְ/אֵ֥ין קֵ֨צֶה֙ לַ/תְּכוּנָ֔ה כָּבֹ֕ד מִ/כֹּ֖ל כְּלִ֥י חֶמְדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/010.yaml
  text: Plunder silver! Plunder gold! There is no end to the treasure[b][a], an abundance of every precious thing.
translation:
  language: zh_hans
  text: 抢夺银子！抢夺金子！积存的财宝无穷无尽[a]，各样珍贵物件极其丰富[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“储藏的财物无穷无尽。”译作“积存的财宝”的希伯来语名词十分罕见，可能侧重已经积聚起来的储备。
    reason: lexical_alternative
  - marker: b
    text: “各样珍贵物件”也可译作“各样珍贵器皿”；原文所用的词范围较广，可指器皿、用具或其他物品。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּזּוּ
  choice: 抢夺！
  rationale: 这是动词בזז的复数命令式，指在战争中夺取财物。“抢夺”既自然，又保留命令的力度；两次重复也照原文保留。
- source_word: כֶסֶף
  choice: 银子
  rationale: 与“金子”平行，语境所指是可被掠夺的贵金属，而非泛指钱财。
- source_word: זָהָב
  choice: 金子
  rationale: 按其通常含义直译，并与“银子”构成平行。
- source_word: וְאֵין קֵצֶה
  choice: 无穷无尽
  rationale: 自然表达“没有尽头、没有限度”，突出财富之多。
- source_word: תְּכוּנָה
  choice: 积存的财宝
  rationale: 此名词罕见，可能侧重储存、积存之物；结合掠夺金银的语境，以“积存的财宝”兼顾储藏与财富两层含义。
- source_word: כָּבֹד
  choice: 极其丰富
  rationale: 该词通常可指“荣耀、分量”，在此物质财富的语境中表达贵重物品的丰厚与盛多；译为“极其丰富”较符合现代汉语。
- source_word: מִכֹּל כְּלִי חֶמְדָּה
  choice: 各样珍贵物件
  rationale: כְּלִי可泛指器皿、用具或物件，חֶמְדָּה表示可喜爱、贵重；“珍贵物件”避免把范围不必要地缩窄为容器。
theological_decisions: []
