base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/008.yaml
  text: 'It is fixed: she is stripped bare[a], she is carried away; and her servant girls are led off, moaning like the sound of doves[b], beating on their hearts.'
translation:
  language: zh_hans
  text: 事情已成定局[a]：她被剥得赤裸[b]，被带走；她的女奴被赶着走，发出鸽子般的哀鸣，捶着自己的心口[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 首句希伯来文含义不确定；也可理解为“她被安置”或“她站定了”，传统上还有将这个词视为专名的译法。
    reason: textual_ambiguity
  - marker: b
    text: 或译“她被揭露”，也可能译作“她被掳去”；希伯来文含义困难，可能同时带有受辱和被迁走的意象。
    reason: alternative_reading
  - marker: c
    text: 希伯来文直译“在自己的心上”；这里可能是指哀悼时捶胸。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֻצַּב
  choice: 事情已成定局
  rationale: 这个形式的含义历来有争议。按非人称被动表达理解为事情已经确定，既符合审判场景，也避免用“下令”或“判定”过度引入司法意味。
- source_word: גֻּלְּתָה
  choice: 她被剥得赤裸
  rationale: גלה的被动形式可指被揭露、被剥露，也可能使人联想到流放。这里与下句“被带走”并列，译作“被剥得赤裸”较能保留受辱的图景，而不把两个分句合并为同一层意思。
- source_word: הֹעֲלָתָה
  choice: 被带走
  rationale: עלה的使役被动形式字面涉及被带上去；在城破、俘虏被押解的语境中，“被带走”自然地表达了受强制移动，同时不过度限定具体方向。
- source_word: אַמְהֹתֶיהָ
  choice: 她的女奴
  rationale: אָמָה指处于从属地位的女性奴仆。“女奴”比“侍女”更清楚地保留原词所反映的社会身份。
- source_word: מְנַהֲגוֹת
  choice: 被赶着走
  rationale: 该词在这里描绘这些女子在他人驱赶下行进。“被赶着走”保留了俘虏队伍所受的强制，比单纯的“被带领”更贴合语境。
- source_word: כְּקוֹל יוֹנִים
  choice: 发出鸽子般的哀鸣
  rationale: 原文明确以鸽子的声音作比。汉语用“发出……般的哀鸣”既保留听觉意象，也自然表达此处哀悼的语境。
- source_word: מְתֹפְפֹת
  choice: 捶着
  rationale: 该分词表示反复或有节奏地击打；结合哀悼动作，译作“捶着”最自然。
- source_word: עַל לִבְבֵהֶן
  choice: 自己的心口
  rationale: 字面为“在她们的心上”。希伯来表达中的“心”也可指心脏所在的胸口；“心口”既接近原有身体意象，也能让现代汉语读者理解为哀悼时捶胸。
theological_decisions:
- issue: 首句是否表达上帝正式颁布的判决
  choice: 译为“事情已成定局”
  alternative: “已经下令”或“已经判定”
  rationale: 原文没有明说发布命令者，且词形本身含义困难。中性表达保留审判不可挽回的语气，却不擅自补出明确的神学施事者或司法场景。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“事情已成定局”传达诗句突兀、不可逆转的宣告；“女奴”保留古代社会身份，“被赶着走”“鸽子般的哀鸣”“捶着自己的心口”则形成连贯的俘虏哀悼画面。对三个语义困难处均以脚注保留其他可能读法。
