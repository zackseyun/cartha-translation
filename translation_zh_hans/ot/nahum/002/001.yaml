id: NAM.2.1
reference: Nahum 2:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֨ה עַל הֶ/הָרִ֜ים רַגְלֵ֤י מְבַשֵּׂר֙ מַשְׁמִ֣יעַ שָׁל֔וֹם חָגִּ֧י יְהוּדָ֛ה חַגַּ֖יִ/ךְ שַׁלְּמִ֣י נְדָרָ֑יִ/ךְ כִּי֩ לֹ֨א יוֹסִ֥יף ע֛וֹד ל/עבור בָּ֥/ךְ בְּלִיַּ֖עַל כֻּלֹּ֥/ה נִכְרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/001.yaml
  text: Look[a], on the mountains are the feet of one who brings good news, who announces peace. Celebrate your festivals, Judah; fulfill your vows[b], for the worthless one will never again pass through you; he is completely cut off.
translation:
  language: zh_hans
  text: 看哪，群山上有传好消息、宣告平安之人的脚[a]！犹大啊，要守你的节期，履行你所许的愿！因为那卑劣之徒[b]必不再从你中间经过；他已被彻底剪除。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“传好消息之人的脚。”
    reason: 原文突出报信者的“脚”；中文正文保留这一具体意象。
  - marker: b
    text: 也可译作“邪恶之徒”；传统上音译为“彼列”。
    reason: 该词可作描述卑劣、邪恶者的普通名词，也在后来的传统中被当作专名；本处正文不预断为专名。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注目并把眼前景象鲜明呈现出来的指示语气，同时符合庄重而易懂的现代汉语。
- source_word: עַל הֶהָרִים
  choice: 群山之上
  rationale: 按原文作地点表达，保留“山”的复数和信使越山而来的图景。
- source_word: רַגְלֵי מְבַשֵּׂר
  choice: 传好消息之人的脚步
  rationale: 保留原文具体的“脚”这一意象；汉语用“脚步”更自然，也能使读者联想到报信者正在来到。
- source_word: מַשְׁמִיעַ שָׁלוֹם
  choice: 宣告平安
  rationale: 使役分词表达“使人听见”，在报信语境中自然译为“宣告”；“平安”保留 שָׁלוֹם 的核心含义，不将其缩窄为单纯停战。
- source_word: חָגִּי ... חַגַּיִךְ
  choice: 要守你的节期
  rationale: 动词与同根名词相连，指举行或遵守宗教节期；“守节期”在现代汉语中清楚庄重，且不把节期误解为仅仅宴饮庆祝。
- source_word: שַׁלְּמִי נְדָרָיִךְ
  choice: 偿还你的愿
  rationale: 这是履行所许之愿的希伯来语惯用表达；“偿还你的愿”既贴近原文“付清、履行”的意味，也保留敬拜语境。
- source_word: בְּלִיַּעַל
  choice: 卑劣之徒
  rationale: 在本处按描述性普通名词处理，表达邪恶、无用或卑劣的敌对者，不预先把它认定为后来传统中的专名。
- source_word: לֹא יוֹסִיף עוֹד לַעֲבוֹר בָּךְ
  choice: 必不再从你中间经过
  rationale: 保留“经过、穿行”的原文比喻，不直接解释成“入侵”，同时“从你中间”自然表达对犹大境内的穿越。
- source_word: כֻּלֹּה נִכְרָת
  choice: 他已被彻底剪除
  rationale: “彻底”体现 כֻּלֹּה 的完全性，“剪除”保留 נִכְרָת 常见的毁灭、断绝意象。
theological_decisions:
- issue: בְּלִיַּעַל 是专名还是描述性称谓
  choice: 正文译作描述性称谓“卑劣之徒”
  alternative: “彼列”或“邪恶之徒”
  rationale: 本段首先是在宣告压迫犹大的敌人被除灭，原文并不要求将该词理解为一个具名的邪灵。正文采用描述性译法可避免引入后期邪灵论，脚注则保留专名及其他语义可能。
- issue: שָׁלוֹם 的语义范围
  choice: 译作“平安”
  alternative: “和平”
  rationale: “平安”既可涵盖战争止息，也保留完整、安稳和福祉等较宽含义，避免只限定为政治或军事和平。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的普通话。以短促的感叹句和命令句再现先知宣告的喜悦与确定性；保留“群山”“脚步”“经过”“剪除”等原文意象，不把敌人的行动过度释义为具体军事术语。
