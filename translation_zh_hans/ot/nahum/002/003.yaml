source:
  edition: WLC
  text: כִּ֣י שָׁ֤ב יְהוָה֙ אֶת גְּא֣וֹן יַעֲקֹ֔ב כִּ/גְא֖וֹן יִשְׂרָאֵ֑ל כִּ֤י בְקָקוּ/ם֙ בֹּֽקְקִ֔ים וּ/זְמֹרֵי/הֶ֖ם שִׁחֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/003.yaml
  text: For Yahweh is restoring the majesty of Jacob like the majesty of Israel[c][b][a], though destroyers have destroyed them and ruined their vine branches.
translation:
  language: zh_hans
  text: 因为耶和华正在恢复雅各的威荣，如同以色列的威荣[a][b]；尽管劫掠者把他们洗劫一空[c]，毁坏了他们的葡萄枝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正在恢复”也可译为“已经恢复”或“必恢复”；希伯来语动词在先知性话语中可用确定的语气表达必然成就之事。
    reason: lexical_alternative
  - marker: b
    text: “威荣”也可译为“尊荣”。本句也可理解为：“恢复雅各的威荣，就是以色列的威荣。”正文按希伯来语比较前缀译作“如同”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“使之空虚的人使他们空虚”，以同根词强调他们遭到彻底洗劫。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: 正在恢复
  rationale: 该完成式在先知性语境中可表达已成事实、当前确定之事或将来必然发生之事；“正在恢复”自然地传达生动而确定的逆转，同时不把时态严格限定为过去。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中对四字神名的通行音译，以保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: גְּאוֹן
  choice: 威荣
  rationale: 该词既可指负面的骄傲，也可指正面的尊荣、威严或荣美；这里是耶和华所恢复的事物，正面意义更合语境。“威荣”兼具尊严与光彩，不易被误解为罪性的自高。
- source_word: כִּ/גְאוֹן יִשְׂרָאֵל
  choice: 使它如以色列的威荣
  rationale: 按马所拉文本将前缀 כ 理解为比较词“如同”。补出“使它”令现代汉语关系清楚，同时保留“雅各的威荣”与“以色列的威荣”之间略显张力的比较结构。
- source_word: בְקָקוּם ... בֹּקְקִים
  choice: 劫掠者把他们洗劫一空
  rationale: 同根动词与分词构成强化性的同源表达，基本图像是使之空虚、彻底掠夺。“洗劫一空”既传达彻底性，也符合自然汉语。
- source_word: וּ/זְמֹרֵי/הֶם
  choice: 他们的葡萄枝
  rationale: זְמֹרָה 特指葡萄树的枝条或嫩枝；明确译出“葡萄”以保存原文农业意象。
- source_word: שִׁחֵתוּ
  choice: 毁坏了
  rationale: 该词的加强词干表示败坏、毁损或摧毁；“毁坏”与葡萄枝的意象搭配自然，并保留破坏力度。
theological_decisions:
- issue: גְּאוֹן 用于雅各和以色列时的意义
  choice: 理解为神所恢复的正面威荣与尊荣
  alternative: 理解为“骄傲”或“自豪”
  rationale: 耶和华在此施行有利于雅各／以色列的恢复，因此正面含义最符合上下文；但脚注保留“尊荣”等可能表达，避免把该词义域压缩为单一概念。
- issue: שָׁב 的时间指向
  choice: 正文采用进行性的“正在恢复”
  alternative: “已经恢复”或“必恢复”
  rationale: 先知话语中的完成式可用确定的语气描述正在发生或未来必成之事。正文不将其简化为普通过去时，脚注则明确保留其他可能。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“威荣”保留诗体的尊严感；“洗劫一空”以自然汉语再现希伯来语同根结构的强化作用。正文保留雅各与以色列之间比较关系的歧义，并通过脚注列出同位理解。
