base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/013.yaml
  text: The lion tore enough for his cubs and strangled prey for his lionesses[b][a]; he filled his dens with prey and his lairs with torn flesh.
translation:
  language: zh_hans
  text: 狮子为幼狮撕裂足够的猎物[a]，又为母狮勒死猎物；他使自己的洞穴充满猎物，使自己的巢穴充满撕碎的肉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“狮子不断为幼狮撕裂足够的猎物。”希伯来文的分词也可表达持续进行的动作。
    reason: lexical_alternative
  - marker: b
    text: “撕碎的肉”也可译作“猎物”或“被撕裂之物”。这里采用不同译词，以保留希伯来文诗句中的用词变化。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: 狮子
  rationale: 单数名词在这里构成鲜明的代表性形象，指向上下文中的亚述或尼尼微；保留狮子意象，不在正文中直解其政治所指。
- source_word: טֹרֵף בְּדֵי
  choice: 撕取足够的猎物
  rationale: טֹרֵף 表示撕扯、撕取猎物，בְּדֵי 表示足够、充足；合译以明确保留原文的数量含义。
- source_word: גֹרוֹתָיו
  choice: 幼狮
  rationale: 指狮子的幼崽；“幼狮”在现代汉语中自然、准确，并与整节的狮子意象一致。
- source_word: וּמְחַנֵּק
  choice: 又……勒死猎物
  rationale: 该分词意为勒死、扼死；原文未明说宾语，但从捕食语境可知是猎物，汉语补出“猎物”以使句意完整。
- source_word: לְלִבְאֹתָיו
  choice: 为母狮
  rationale: 该词指雌狮；“母狮”是普通现代汉语中直接而自然的表达。
- source_word: וַיְמַלֵּא
  choice: 他用……填满
  rationale: 该动词推进画面，表示使洞穴装满；用“他”承接前面的狮子，并按汉语习惯表达。
- source_word: טֶרֶף
  choice: 猎物
  rationale: 该词常指被捕获、撕取的猎物；此处保留捕食意象，同时让其在全书语境中仍可暗示掠物。
- source_word: חֹרָיו
  choice: 洞穴
  rationale: 指兽类藏身的洞或穴；“洞穴”清楚自然，也适合狮子的画面。
- source_word: וּמְעֹנֹתָיו
  choice: 巢穴
  rationale: 指居所或藏身处；与“洞穴”形成近义平行，同时保留原诗的措辞变化。
- source_word: טְרֵפָה
  choice: 撕碎的肉
  rationale: 指被撕裂的动物肉或猎物；译作“撕碎的肉”可与前面的 טֶרֶף“猎物”有所区别，并保留原文血腥、具体的捕食画面。
theological_decisions:
- issue: 亚述或尼尼微的狮子隐喻
  choice: 正文保留字面的狮子及捕食意象，不直接点明其政治所指。
  alternative: 意译为亚述王为其臣民掠夺财物。
  rationale: 本节是针对尼尼微的诗性嘲讽；保留隐喻既忠于希伯来文，也避免把解释直接写入译文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保持诗性平行；“撕取、勒死、填满、塞满”强化连续的捕食画面。“母狮”和“幼狮”不另加复数标记，符合现代汉语习惯。脚注标记分别紧随其实际说明的词语。
