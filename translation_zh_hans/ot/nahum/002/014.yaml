source:
  edition: WLC
  text: הִנְ/נִ֣י אֵלַ֗יִ/ךְ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וְ/הִבְעַרְתִּ֤י בֶֽ/עָשָׁן֙ רִכְבָּ֔/הּ וּ/כְפִירַ֖יִ/ךְ תֹּ֣אכַל חָ֑רֶב וְ/הִכְרַתִּ֤י מֵ/אֶ֨רֶץ֙ טַרְפֵּ֔/ךְ וְ/לֹֽא יִשָּׁמַ֥ע ע֖וֹד ק֥וֹל מַלְאָכֵֽ/כֵה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/014.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will burn your chariots in smoke; the sword will devour your young lions. I will cut off your prey from the earth[c][b], and the voice of your messengers will no longer be heard.
translation:
  language: zh_hans
  text: 万军之雅威宣告：“看哪，我与你为敌！我要在烟中焚烧她的战车[a]；刀剑必吞噬你的少壮狮子[b]。我要从大地上除掉你的猎物；你的使者[c]的声音必不再被听见。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“她的战车”；本节其余部分以“你”称呼尼尼微。这里“在烟中”也可译作“烧成烟”。
    reason: 保留原文人称转换，并说明介词短语既可表示焚烧的情状，也可表示结果。
  - marker: b
    text: “少壮狮子”延续对尼尼微的狮子比喻，可能指她的战士或统治者。
    reason: 说明古代诗歌意象及其可能的隐喻所指，同时不在正文中将其确定化。
  - marker: c
    text: 或译“使节”。这里指奉派办理事务的人，不是天使。
    reason: מַלְאָךְ可指一般使者、正式使节或天使；语境支持人间使者。
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: 看哪，我与你为敌
  rationale: 保留先知宣告中引人注意的庄严语气；介词短语在此表示敌对。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 万军之雅威宣告说
  rationale: נְאֻם采用郑重的先知宣告用语；יהוה音译为“雅威”，צְבָאוֹת译为“万军”，保留神圣称号的含义。
- source_word: וְהִבְעַרְתִּי בֶעָשָׁן
  choice: 我要在烟中焚烧
  rationale: 使役式动词表达以火焚毁；בֶעָשָׁן既可侧重焚烧时烟雾弥漫的情景，也可能侧重烧成烟的结果，正文保留较贴近形式的“在烟中”。
- source_word: רִכְבָּהּ
  choice: 她的战车
  rationale: 名词可作集合用法，故译为复数“战车”；后缀严格说是第三人称阴性单数“她的”，正文保留马所拉文本在本节第二人称称呼中出现的这一人称转换。
- source_word: וּכְפִירַיִךְ
  choice: 你的少壮狮子
  rationale: 保留כְּפִיר的狮子意象，不在正文中直接释为战士或统治者；“少壮狮子”比“幼狮”更能表达已经强健凶猛的年轻狮子。
- source_word: תֹּאכַל חָרֶב
  choice: 刀剑必吞噬
  rationale: 保留希伯来语把刀剑拟人化为吞噬者的鲜明表达。
- source_word: וְהִכְרַתִּי מֵאֶרֶץ טַרְפֵּךְ
  choice: 我要从大地上除掉你的猎物
  rationale: “猎物”延续上下文的狮子意象，也暗指亚述掠夺所得；“除掉”自然表达כרת使役式在此处的彻底清除之意。
- source_word: וְלֹא יִשָּׁמַע עוֹד קוֹל מַלְאָכֵכֵה
  choice: 你使者的声音必不再被听见
  rationale: 保留原文被动结构及“不再”的终结意味；מַלְאָךְ在此指尼尼微或亚述派出的人员，而非天使。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较接近יהוה常见学术重构读音的“雅威”，不以称号“主”代替。
- issue: “少壮狮子”的所指
  choice: 正文保留狮子意象
  alternative: 译作“勇士”或“统治者”
  rationale: 上下文刻意以狮子、猎物描绘尼尼微。虽可能隐喻其战士、王族或统治者，原文并未明确限定，故不在正文中消解其比喻张力。
translation_notes:
  register: 采用现代、庄重而清楚的先知宣告语体。“看哪”保留警醒和审判临近的力量；句式尽量简洁有节奏，并以“吞噬、猎物”维持全段连贯的狮子意象。
