base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/002.yaml
  text: A scatterer has come up against your face[a]. Guard the fortress; watch the road; strengthen your loins[c][b]; muster your strength greatly.
translation:
  language: zh_hans
  text: 那打碎者[a]已经上来，直逼你面前[b]。要防守堡垒[c]，瞭望道路；束紧腰身，大大增强力量！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“驱散者”；这个希伯来词既可强调使人四散，也可强调击碎、毁灭。
    reason: lexical_alternative
  - marker: b
    text: 直译“在你面前”或“当着你的面”；这里指直逼你而来，或直接与你为敌。
    reason: lexical_alternative
  - marker: c
    text: 或译“坚固处”；也可能指围城工事或防御工事。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: 已经上来
  rationale: 完成式把来袭者描写为已经推进或临近；“已经上来”保留军事语境中向城进攻的动态。
- source_word: מֵפִיץ
  choice: 打碎者
  rationale: 该分词名词可指使人四散者，也可强调击碎、毁灭者。上下文是攻城威胁，“打碎者”自然有力，同时以脚注保留“驱散者”的可能。
- source_word: עַל פָּנַיִךְ
  choice: 迎面攻击你
  rationale: 直译为“在你脸上/面前”；这里表示敌人逼到面前、直接来攻。译文保留“迎面”的身体意象，也清楚表达敌对方向。
- source_word: נָצוֹר
  choice: 守住
  rationale: 命令式要求采取防御行动；“守住”简洁，并符合连续军事命令的语气。
- source_word: מְצֻרָה
  choice: 堡垒
  rationale: 此名词可指堡垒、坚固处，也可能涉及围城工事；命令序列较支持守卫防御据点，因此正文采用“堡垒”。
- source_word: צַפֵּה דֶרֶךְ
  choice: 察看道路
  rationale: 表示哨兵监视敌军来路；“察看道路”保留命令的简练和具体对象。
- source_word: חַזֵּק מָתְנַיִם
  choice: 束紧腰身
  rationale: 字面涉及使腰部强健，是准备行动、坚定应战的身体隐喻。汉语“束紧腰身”能自然传达临战准备，同时保留原文意象。
- source_word: אַמֵּץ כֹּחַ מְאֹד
  choice: 竭力奋勇
  rationale: 原文要求极力增强、振作力量。“竭力奋勇”以自然凝练的汉语表达强化语气和军事紧迫感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而有紧迫感的军事命令语体。四个短促命令形成递进节奏；正文以自然汉语呈现，同时通过脚注保存关键希伯来词的词义宽度和身体意象。
