  text: יִזְכֹּר֙ אַדִּירָ֔י/ו יִכָּשְׁל֖וּ ב/הלכות/ם יְמַֽהֲרוּ֙ חֽוֹמָתָ֔/הּ וְ/הֻכַ֖ן הַ/סֹּכֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/006.yaml
  text: He summons his nobles; they stumble in their march. They hurry to her wall, and the siege shelter is set up.
translation:
  language: zh_hans
  text: 他召集自己的权贵；他们行进时跌跌撞撞。他们急忙赶到城墙那里，攻城用的盾棚已经架好。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִזְכֹּר
  choice: 召集
  rationale: 该词通常意为“记念、想起”，但在军事语境中可指点名或召来属下；结合后文权贵赶赴城墙，译作“召集”更符合语境，同时保留主语未明说的特点。
- source_word: אַדִּירָיו
  choice: 自己的权贵
  rationale: אַדִּיר可指有权势者、贵族或将领；“权贵”既保留其社会地位含义，也不把他们过早限定为军官。后缀表示“他的”，中文按语境译为“自己的”。
- source_word: בַּהֲלִיכוֹתָם
  choice: 行进时
  rationale: 源于“行走、步伐、行进”，这里描写他们匆忙奔赴防御位置的动作；“行进时”自然且带有军事场景色彩。
- source_word: חֽוֹמָתָהּ
  choice: 城墙那里
  rationale: 字面为“她的墙”；阴性后缀所指应是城，中文以“城墙”自然表达，避免生硬拟人化。方向词尾表达“向……去”，结合“赶到”译出。
- source_word: הַסֹּכֵךְ
  choice: 攻城用的盾棚
  rationale: 该词指遮蔽物或防护棚，此处很可能是进攻者靠近城墙时使用的攻城防护设施。“盾棚”体现其遮护功能，加“攻城用的”说明语境，同时不武断限定具体构造。
theological_decisions:
- issue: 首句主语身份
  choice: 保留为未明说的“他”
  alternative: 明确译为亚述王或尼尼微的统帅
  rationale: 希伯来文本仅有第三人称阳性单数动词及所属后缀，具体人物须由上下文推断；不在本节中补入身份，以保存原文的指代张力。
- issue: יִזְכֹּר的语义
  choice: 按军事语境译为“召集”
  alternative: 译为“想起”或“记起”
  rationale: “想起自己的权贵”在语义上可成立，但随后他们立即奔赴城墙，显示这里更可能包含点名、召来或调遣的作用；采用“召集”而不附加神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“跌跌撞撞”鲜明传达יִכָּשְׁלוּ的失足与慌乱；分号保持原文快速推进的战场节奏。
