base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/012.yaml
  text: Where is the lions’ den[a], the feeding place of the young lions, where the lion and lioness walked, where the lion’s cub was[b], with none to make them afraid?
translation:
  language: zh_hans
  text: 狮群的狮穴和少壮狮子的觅食之地在哪里？狮子和母狮曾在那里行走，幼狮也在那里，无人惊吓它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַיֵּה
  choice: 在哪里
  rationale: 这是询问地点的疑问词；结合上下文，形成对尼尼微倾覆的嘲问。
- source_word: מְעוֹן אֲרָיוֹת
  choice: 狮群的巢穴
  rationale: מְעוֹן本指居所；在狮子喻象中译作“巢穴”自然，也保留其栖居之所的含义。复数“狮子”用“狮群”表达，符合现代汉语。
- source_word: וּמִרְעֶה ... לַכְּפִרִים
  choice: 少壮狮子的觅食之地
  rationale: מִרְעֶה通常指牧场或供食之处；因这里说的是狮子，译作“觅食之地”可避免造成狮子吃草的误解，同时保留供其取食的地点意象。
- source_word: הָלַךְ
  choice: 曾在那里行走
  rationale: 采用动词“行走”的基本义，不强化为原文未明确表达的“潜行”或“巡行”；“曾”体现这里追问一个已经消失的旧日场景。
- source_word: אַרְיֵה
  choice: 雄狮
  rationale: 该词通常指狮子；在与לָבִיא和幼狮并列的家庭性图景中，以“雄狮”表达较为清楚。
- source_word: לָבִיא
  choice: 母狮
  rationale: 该词可泛指强壮的狮子，也可在此语境中理解为母狮；与雄狮、幼狮并列时，“母狮”最自然，但以脚注保留另一可能。
- source_word: גּוּר אַרְיֵה
  choice: 幼狮
  rationale: 这一组合指狮子的幼崽；“幼狮”简洁、自然，并与前文“少壮狮子”有所区分。
- source_word: וְאֵין מַחֲרִיד
  choice: 无人惊吓它们
  rationale: 直译无人使其害怕，表达狮群从前安然无惧的状态；宾语“它们”由上下文补出。
theological_decisions: []
