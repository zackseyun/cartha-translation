base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/011.yaml
  text: Devastation[a], desolation, and destruction! Hearts melt, knees give way, anguish is in every waist, and all their faces grow pale.
translation:
  language: zh_hans
  text: 空无、荒凉、毁灭！人心都融化了，双膝发软，人人腰间剧痛，众人的脸色都尽失了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译可作“众人的脸上都聚集了黑色”。这句希伯来语含义较难确定，可能是说人因惊恐而脸色变暗，或血色尽失。
    reason: 保留疑难希伯来语表达的较直译形式及其可能含义，避免把不确定的面色变化只限定为“苍白”。
lexical_decisions:
- source_word: בּוּקָה וּמְבוּקָה וּמְבֻלָּקָה
  choice: 一片空虚，一片荒凉，一片破败
  rationale: 三个近义词快速叠加，并带有语音呼应，描绘城被洗劫后彻底败落的景象。译文以三个结构相同的短语保留排比和递进感，不强行为三个词划定过于精确的差别。
- source_word: לֵב נָמֵס
  choice: 人心消融
  rationale: 保留希伯来语“心融化”的鲜明比喻，表达众人因恐惧而丧胆；用“人心”自然呈现原文集合性的单数。
- source_word: פִק בִּרְכַּיִם
  choice: 双膝发软
  rationale: פִק 在这里指膝盖摇晃、支撑不住。“双膝发软”是现代汉语中自然的恐惧反应，同时保留身体性的描写。
- source_word: חַלְחָלָה בְּכָל מָתְנַיִם
  choice: 人人腰间战栗
  rationale: חַלְחָלָה 可指战栗、扭痛或剧烈痛苦；结合全句对惊恐身体反应的描写，译作“战栗”。“人人”传达“所有腰间”的分配意义。
- source_word: וּפְנֵי כֻלָּם קִבְּצוּ פָארוּר
  choice: 众人的脸都失色了
  rationale: 这是一个含义困难的希伯来语表达，可能描写因恐惧而脸色变暗或血色尽失。正文用自然汉语表达可确定的惊恐效果，并在脚注保留较直译的说法和词义不确定性。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。开头用三个“一片……”形成急促排比；后半句保留从内心丧胆到膝、腰、脸的连续身体反应。脚注标记置于其实际所解释的“脸都失色了”之后。
