  source_fidelity: 译文整体准确传达了希伯来文由毁败宣告转入恐惧所致的内心和身体反应的结构。开头三联语保留了原文急促的排比；“双膝发软”准确表达膝盖支撑不住。“人人腰间战栗”虽可理解，却未能自然、充分地表达חַלְחָלָה在此可指的剧痛、痉挛或强烈痛苦，且“腰间战栗”在现代汉语中搭配不够自然。
