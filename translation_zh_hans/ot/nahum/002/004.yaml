base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/004.yaml
  text: The shield of his mighty men is red[a]; the men of valor are clothed in scarlet. The chariots flash with the fire of steel on the day of his preparation[b], and the cypress spears are brandished.
translation:
  language: zh_hans
  text: 他勇士们的盾牌被染得通红，精兵身着朱红色衣服。在他整备的日子，战车因钢铁的火光[a]而闪耀，柏木制的长矛[b]被挥舞起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来文含义不确定，也可译作“战车带着火一般的钢铁”；可能指战车的金属配件或刀刃闪出火光。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“柏树摇动起来”。原文直译为“柏树”，这里很可能以柏木代指用这种木材制成的矛杆或长矛。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָגֵן
  choice: 盾牌
  rationale: 采用现代汉语中最自然、通行的军用防具名称。
- source_word: גִּבֹּרֵיהוּ
  choice: 他勇士的
  rationale: 保留第三人称单数所属后缀，并传达גִּבּוֹר在军事语境中的勇猛战士之意。
- source_word: מְאָדָּם
  choice: 染得通红
  rationale: 体现该词的被动或状态意义；既可能指染色，也可描写盾牌呈现的红色。
- source_word: אַנְשֵׁי חַיִל
  choice: 精兵
  rationale: 在军事语境中简洁表达有能力、英勇善战的人，符合现代汉语习惯。
- source_word: מְתֻלָּעִים
  choice: 身穿朱红衣服
  rationale: 该词与朱红或绯红染料相关；在此修饰战士，语境中隐含其衣着颜色。
- source_word: בְּאֵשׁ פְּלָדוֹת
  choice: 因钢铁的火光而闪耀
  rationale: 原短语艰深，可能描绘战车金属配件或刀刃如火的闪光；正文以自然汉语呈现其视觉意象，并用脚注保留不确定性。
- source_word: הָרֶכֶב
  choice: 战车
  rationale: 该词在此为集合性军用车辆称谓；汉语“战车”无需另加复数标记。
- source_word: בְּיוֹם הֲכִינוֹ
  choice: 到他备战的日子
  rationale: 保留原文第三人称单数后缀，不具体判定“他”的身份；“备战”符合上下文，但不细化为集结或出征。
- source_word: וְהַבְּרֹשִׁים
  choice: 柏木长矛
  rationale: 字面为柏树或类似针叶树；军事语境中很可能借木材指以其制作的矛杆，正文适度明示这一转喻。
- source_word: הָרְעָלוּ
  choice: 挥舞起来
  rationale: 该动词含义有争议，可能表示摇动、震动；与长矛搭配时，“挥舞”自然地传达战阵中的动作。
