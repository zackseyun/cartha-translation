base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/007.yaml
  text: The gates of the rivers are opened[b][a], and the palace melts away.
translation:
  language: zh_hans
  text: 江河的门户敞开了[a]，宫殿[b]消融了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“河道的门户敞开了”，如果这里所说的是尼尼微的水道或水渠，而不是通常意义上的江河。
    reason: lexical_alternative
  - marker: b
    text: 或译：“圣殿”。希伯来语“黑卡勒”既可指宫殿，也可指圣殿；这里的上下文较支持“宫殿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעֲרֵי
  choice: 门户
  rationale: 这是 שַׁעַר 的复数构造形式，意为“门、门户”。译作“门户”既保留原文意象，也避免把它过早具体化为水利设施的“闸门”。
- source_word: הַנְּהָרוֹת
  choice: 江河
  rationale: נָהָר 的复数通常指河流。“江河”符合现代汉语表达并保留基本词义；在尼尼微的语境中也可能指河道或水渠，故以脚注注明。
- source_word: נִפְתָּחוּ
  choice: 敞开了
  rationale: פָּתַח 的尼法勒完成式第三人称复数，表示“被打开、敞开”。“敞开了”自然地呈现先知叙述中事件已经发生的鲜明画面。
- source_word: הַהֵיכָל
  choice: 宫殿
  rationale: הֵיכָל 可指宫殿或圣殿；本节是针对尼尼微的审判宣告，语境较支持王宫或宫殿建筑群。
- source_word: נָמוֹג
  choice: 消融了
  rationale: 该词表达融化、消解或因软弱恐惧而崩溃。“消融了”保留原文强烈的融化意象，同时可涵盖宫殿瓦解的含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“门户”保留原文不寻常的“江河之门”意象，不擅自解释为闸门；“消融了”则保留宫殿如同融化、瓦解的诗性张力。
