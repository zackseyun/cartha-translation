  text: An oracle concerning Nineveh[a]. The book of the vision of Nahum the Elkoshite.
translation:
  language: zh_hans
  text: 有关尼尼微的宣告[a]。这是记载伊勒歌斯人那鸿所见异象的书。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尼尼微的重担”，或“关于尼尼微的宣言”。
    reason: 词语 מַשָּׂא 在先知书标题中可指郑重的先知性宣告；其基本词义也与“重担”有关。
lexical_decisions:
- source_word: מַשָּׂא
  choice: 宣告
  rationale: 该词在先知书标题中通常指郑重而有分量的先知性宣言，并非字面意义的重担。“宣告”在现代汉语中自然清楚，也保留其正式、权威的语气。
- source_word: נִינְוֵה
  choice: 尼尼微
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: סֵפֶר
  choice: 书
  rationale: 此词可指书卷、文书或记载；在本节标题结构中译作“书”最直接自然。
- source_word: חֲזוֹן
  choice: 异象
  rationale: 这是先知文学中表示从上帝而来的所见或启示信息的常用词；“异象”保留了其先知性含义而不限定具体领受方式。
- source_word: נַחוּם
  choice: 那鸿
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הָאֶלְקֹשִׁי
  choice: 伊勒歌斯人
  rationale: 原文为带冠词的籍贯或关联称谓，表示那鸿来自或属于伊勒歌斯；译作“伊勒歌斯人”简洁且保留原文未进一步说明的关系。
theological_decisions:
- issue: 标题中两个名词性短语的关系
  choice: 分作两个简短标题句，并在第二句补出“这是……所得”，使中文通顺。
  alternative: 合为一句：“关于尼尼微的宣告，就是伊勒歌斯人那鸿异象的书。”
  rationale: 希伯来文由两个并列或同位的标题成分组成。分句可保留其标题式结构；“关于”也避免把“尼尼微”误解为宣告的来源。补入“所得”仅明确异象与那鸿的关系，不额外说明启示方式。
- issue: מַשָּׂא 的语义张力
  choice: 正文译作“宣告”，脚注保留“重担”与“关于尼尼微的话”等可能表达。
  alternative: 正文直译为“尼尼微的重担”。
  rationale: 在先知标题中，该词惯用于郑重的神谕或宣判，但其词形也可表达“重担”。正文采用自然中文，脚注保存词义联系与传统译法所体现的分量感。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留先知书标题的简短结构；专名使用中文圣经中通行的“尼尼微、那鸿、伊勒歌斯”。
