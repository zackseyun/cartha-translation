  text: כִּ֚י עַד סִירִ֣ים סְבֻכִ֔ים וּ/כְ/סָבְאָ֖/ם סְבוּאִ֑ים אֻ֨כְּל֔וּ כְּ/קַ֥שׁ יָבֵ֖שׁ מָלֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/010.yaml
  text: For though they are tangled like thorns[a], and drenched with their drink[b], they will be consumed like fully dry stubble.
translation:
  language: zh_hans
  text: 因为他们虽如缠结的荆棘[a]，又被自己的酒浸透[b]，也必如全然干透的秸秆被吞灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句开头的希伯来语十分凝练，也可译作：“因为，当他们如缠结的荆棘时……”
    reason: alternative_reading
  - marker: b
    text: 这几个希伯来词的含义不易确定；也可理解为“像醉汉一样喝醉了”或“沉醉在自己的酒宴中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出前述宣告的理由；译为“因为”能自然承接上文，也不额外加强语气。
- source_word: עַד
  choice: 即使
  rationale: 这里的诗句高度压缩，עַד 不宜机械地按空间意义翻译；结合全句，采用让步表达，呈现他们虽处于纠结、沉醉的状态，仍必遭吞灭。
- source_word: סִירִים סְבֻכִים
  choice: 像荆棘一样纠结在一起
  rationale: סִירִים 指荆棘或带刺灌木，סְבֻכִים 描写彼此缠结；译文保留其密集纠缠、易被焚毁的鲜明意象。
- source_word: וּכְסָבְאָם סְבוּאִים
  choice: 又被自己的酒浸透
  rationale: 原文以同源或相关的酒饮词语形成难解而浓缩的表达，可能指喝醉、喝足或沉浸于酒宴；“被自己的酒浸透”保留液体意象及醉酒含义，同时在脚注中说明其他理解。
- source_word: אֻכְּלוּ
  choice: 也必……被吞尽
  rationale: 该完成式在先知诗歌中可表达必然实现的审判；“必”传达其确定性，“被吞尽”保留动词“吃尽、吞灭”的基本意象，而不明加原文未明说的“火”。
- source_word: כְּקַשׁ יָבֵשׁ מָלֵא
  choice: 像完全干透的碎秸一样
  rationale: קַשׁ 是禾秆残屑或碎秸；יָבֵשׁ מָלֵא 强调其彻底干燥。“完全干透的碎秸”在现代汉语中自然，并保留极易被吞灭的比喻。
theological_decisions:
- issue: 先知性完成式 אֻכְּלוּ 的时态
  choice: 译作将来且确定的“也必……被吞尽”
  alternative: 译作已经发生的“已经被吞尽”
  rationale: 上下文是对敌人结局的宣告；完成式可将未来审判描述为确定无疑。此处理表达语法功能，不把审判方式或时间作进一步教义化界定。
- issue: 是否明说由火烧毁
  choice: 采用“被吞尽”，不在正文添加“火”
  alternative: 译作“被烧尽”
  rationale: 干碎秸的意象容易使人联想到火，但原文动词本身是“吃尽、吞灭”。保留较宽的措辞可避免把隐含画面变成明说内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文保留荆棘、酒和干碎秸三个诗歌意象，并以“即使……也必……”呈现可能的让步关系；对希伯来语压缩句法及酒饮短语的歧义放入脚注，不在正文中武断消解。
