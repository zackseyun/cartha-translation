source:
  edition: WLC
  text: אֵ֣ל קַנּ֤וֹא וְ/נֹקֵם֙ יְהוָ֔ה נֹקֵ֥ם יְהוָ֖ה וּ/בַ֣עַל חֵמָ֑ה נֹקֵ֤ם יְהוָה֙ לְ/צָרָ֔י/ו וְ/נוֹטֵ֥ר ה֖וּא לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/002.yaml
  text: Yahweh is a jealous and avenging God[a]; Yahweh is avenging and full of wrath. Yahweh takes vengeance on his adversaries[c][b], and he keeps wrath for his enemies.
translation:
  language: zh_hans
  text: 耶和华是忌邪[a]、施行报应的上帝；耶和华施行报应，满有烈怒[b]。耶和华向敌对他的人施行报应；他向自己的仇敌保留怒气[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忌邪”也可译作“满有热忱”；原词指上帝要求盟约关系中的专一忠诚。
    reason: lexical_alternative
  - marker: b
    text: 字面意思是“烈怒的主人／拥有烈怒者”。
    reason: literal_rendering
  - marker: c
    text: “保留怒气”字面可译作“保留（怒气）”；也可译作“怀怒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: 上帝
  rationale: 此处与后面的形容词和分词共同说明耶和华的属性；译作“上帝”自然准确，不额外加入“全能”等原文没有的含义。
- source_word: קַנּוֹא
  choice: 忌邪
  rationale: 该词表示上帝要求盟约关系中的专一忠诚，并为此大发热心；“忌邪”保留了这种排他性的盟约含义，同时避免把它误解为卑劣的嫉妒。
- source_word: נֹקֵם / וְנֹקֵם
  choice: 施行报应
  rationale: 原文三次重复同一分词，强调耶和华持续而确定地实行公正的追讨；三处均统一译为“施行报应”，以保留重复和力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行的专名形式呈现四字神名，不用头衔替代。
- source_word: וּבַעַל חֵמָה
  choice: 满有烈怒
  rationale: בַעַל 字面为“主人／拥有者”，此处是表示具有某种特质的习语；“满有烈怒”自然表达他拥有强烈怒气这一含义。
- source_word: חֵמָה
  choice: 烈怒
  rationale: 在先知宣告审判的语境中，该词指强烈并带有审判性质的怒气；“烈怒”保留其强度，又不暗示失控。
- source_word: לְצָרָיו
  choice: 向敌对他的人
  rationale: 介词 לְ 标明施行报应所针对的对象；“敌对他的人”清楚表达 צָרָיו 所指的敌对者。
- source_word: וְנוֹטֵר
  choice: 怀怒
  rationale: נטר 有保留、持守之意；在本节怒气与报应的平行语境中，“怀怒”自然表达持续保留怒气，但脚注保留较字面的译法。
- source_word: הוּא
  choice: 他
  rationale: 原文显式代词带有强调作用，中文保留“他”，使末句的主语同样突出。
- source_word: לְאֹיְבָיו
  choice: 向自己的仇敌
  rationale: 介词短语指出怀怒所针对的对象；“自己的”明确对应第三人称所属关系。
theological_decisions:
- issue: 上帝的“忌邪”
  choice: 译为“忌邪”，并由脚注说明这是要求盟约专一忠诚的热忱
  alternative: 译为“热忱”或“嫉妒”
  rationale: “热忱”容易淡化原词的排他性，“嫉妒”又容易使现代读者联想到罪性的猜忌；正文与脚注配合，可保留原文的盟约张力。
- issue: 上帝的报应与烈怒
  choice: 保留三次“施行报应”以及“烈怒”的强烈审判语言
  alternative: 弱化为“惩罚”或“生气”
  rationale: 原文刻意三次重复 נקם，并使用 חֵמָה；译文不应把上帝司法性的追讨淡化成一般的不悦。
- issue: 末句 נטר 的含义
  choice: 按上下文译为“怀怒”，脚注注明字面可理解为“保留（怒气）”
  alternative: 译为“存留怒气”或脱离怒气语境译作“看守”
  rationale: 本节的平行结构明显延续烈怒和报应的主题，但原动词“保留、持守”的意象仍值得在脚注中呈现。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“施行报应”的三次重复再现希伯来文的修辞力度；“敌对他的人”与“仇敌”保留原文两个近义称谓的差别。所有脚注标记均置于相应正文词语之后。
