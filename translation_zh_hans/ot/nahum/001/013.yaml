  yaml_path: translation/ot/nahum/001/013.yaml
  text: And now I will break his yoke from upon you[a], and I will tear off your bonds.
translation:
  language: zh_hans
  text: 现在，我要从你身上折断他的轭[a]，扯断捆绑你的绳索。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的横木”。这个希伯来词可指杖、横木或轭；这里与下句的绳索相对应，译作“轭”较符合受压迫的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 这是引出上帝即将采取行动的时间性话语标记。现代汉语中省去句首“而”更自然，同时保留“现在”的转折推进作用。
- source_word: אֶשְׁבֹּר
  choice: 我要……折断
  rationale: שבר 的 Qal 未完成式第一人称单数表示折断、打破；“折断”与轭的具体意象相配。
- source_word: מֹטֵהוּ
  choice: 他的轭
  rationale: 该词可指杖、杆或轭；本节与束缚之物构成平行，语境指压迫者加在受话者身上的辖制，因此“轭”最贴切，同时保留第三人称阳性单数后缀“他的”。
- source_word: מֵעָלַיִךְ
  choice: 从你身上
  rationale: 介词组合表达从受话者（阴性单数）上面移除，译作“从你身上”既保留负担压在身上的图像，也符合现代汉语。
- source_word: וּמוֹסְרֹתַיִךְ
  choice: 捆绑你的绳索
  rationale: 复数名词指绳索、捆绑物或约束。“捆绑你的绳索”在汉语中清楚呈现第二人称所属关系，并保持受压制的比喻。
- source_word: אֲנַתֵּק
  choice: 扯断
  rationale: נתק 的 Piel 未完成式第一人称单数可表示猛力拉开、扯断。“扯断”既体现加强语态的力度，也自然搭配绳索。
theological_decisions:
- issue: “他的轭”中第三人称阳性单数后缀的所指
  choice: 正文保留“他的轭”，不明说所指是谁。
  alternative: 译为“亚述的轭”或“亚述王的轭”。
  rationale: 上下文显示所指是压迫势力，很可能是亚述或其君王，但希伯来文本只使用第三人称阳性单数后缀。保留代词可避免把上下文推断写入正文。
- issue: מֹטֵהוּ 的具体意象
  choice: 译为“他的轭”。
  alternative: 译为“他的横木”或“他的杖”。
  rationale: “横木／杖”在词汇上均有可能，但与下半句的绳索和解除奴役的主题相配时，“轭”最能传达压迫与辖制的意象；脚注保留词义上的真实可能性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“从你身上折断他的轭”保留原文负担压在人身上的空间意象；“扯断捆绑你的绳索”避免生硬的所有格表达，并与前半句形成清晰平行。
