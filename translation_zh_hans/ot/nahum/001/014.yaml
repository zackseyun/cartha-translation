id: NAM.1.14
reference: Nahum 1:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/צִוָּ֤ה עָלֶ֨י/ךָ֙ יְהוָ֔ה לֹֽא יִזָּרַ֥ע מִ/שִּׁמְ/ךָ֖ ע֑וֹד מִ/בֵּ֨ית אֱלֹהֶ֜י/ךָ אַכְרִ֨ית פֶּ֧סֶל וּ/מַסֵּכָ֛ה אָשִׂ֥ים קִבְרֶ֖/ךָ כִּ֥י קַלּֽוֹתָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/014.yaml
  text: 'Yahweh has commanded concerning you: No more will your name be sown[a]. From the house of your gods I will cut off carved image and cast image. I will make your grave[c][b], for you are contemptible.'
translation:
  language: zh_hans
  text: '雅威已经对你下令：

    “你的名必不再延续[a]。

    我要从你众神的殿中[b]，

    除掉雕刻的神像和铸造的神像。

    我要为你造坟墓，

    因为你实在卑贱[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你的名必不再被播种。”意思可能是你不再有后裔，你的家系或王朝也不再延续。
    reason: 保留希伯来文的播种隐喻，并说明其可能的家系或王朝含义。
  - marker: b
    text: 直译：“从你众神的家中。”这里的“家”可指神庙；也有人把“众神”译作“神”。
    reason: 说明 בַּיִת 的具体语境义，并保留 אֱלֹהִים 数的译法差异。
  - marker: c
    text: 或译：“可鄙”，或“微不足道”。
    reason: קַלּוֹתָ 可表达卑贱、受轻视或无足轻重，汉语没有单一词能覆盖全部含义。
lexical_decisions:
- source_word: וְצִוָּה עָלֶיךָ
  choice: 已经对你下令
  rationale: 完成体表达已经发出的神圣命令，并具有当前效力；“对你”保留 עַל 在此处可指命令所针对对象的宽泛含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不用称号替代专名。
- source_word: לֹא יִזָּרַע מִשִּׁמְךָ עוֹד
  choice: 你的名必不再延续
  rationale: 希伯来文直译是“你的名必不再被播种”，语境指名号、后裔或王朝不再延续。正文采用自然汉语，同时在脚注保留播种隐喻及其可能含义。
- source_word: מִבֵּית אֱלֹהֶיךָ
  choice: 从你众神的殿中
  rationale: אֱלֹהֶיךָ 在形态上为复数，且亚述多神崇拜的语境支持“众神”；בַּיִת 在此指供奉神明的殿宇。
- source_word: אַכְרִית
  choice: 除掉
  rationale: 使役词干表达彻底剪除或清除；“除掉”在现代汉语中自然，并保留审判的力度。
- source_word: פֶּסֶל וּמַסֵּכָה
  choice: 雕刻的神像和铸造的神像
  rationale: 分别呈现以雕刻和金属浇铸方式制成的敬拜形像，避免仅用“偶像”抹去制作方式的对照。
- source_word: אָשִׂים קִבְרֶךָ
  choice: 我要为你造坟墓
  rationale: 保留原文简短而突兀的表达，指雅威将使受话者死亡并遭埋葬；不在正文中进一步解释。
- source_word: כִּי קַלּוֹתָ
  choice: 因为你实在卑贱
  rationale: 该词含“轻微、不受重视、可鄙”之意；“卑贱”既可表达地位低微，也可表达受鄙视，保留一定语义张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，正文以音译保留其专名性质，而不以“主”这一称号替代。
- issue: “你的名被播种”的含义
  choice: 正文译作“你的名必不再延续”，脚注保留播种隐喻
  alternative: 你的名必不再被播种；你必不再有后裔
  rationale: 原文隐喻很可能宣告后裔、家系或王朝断绝，但没有明确限定其中一种；正文采用可懂的汉语，又借脚注保留原文形象和解释范围。
- issue: אֱלֹהֶיךָ 的数
  choice: 你众神
  alternative: 你的神
  rationale: 该形式在形态上是复数，反偶像语境和亚述宗教背景也支持复数；不将其神学性地改成单数。
- issue: כִּי קַלּוֹתָ 的评价含义
  choice: 卑贱
  alternative: 可鄙；微不足道
  rationale: 原词可涉及被看轻、无足轻重或道德上可鄙。正文不用更强的定性词，以免消除原有语义幅度。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语，并以诗行呈现神谕。句式避免古奥文言；“雕刻的神像和铸造的神像”保留原文工艺对举，“为你造坟墓”保留宣判的突兀力度。
