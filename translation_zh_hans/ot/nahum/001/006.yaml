  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לִ/פְנֵ֤י זַעְמ/וֹ֙ מִ֣י יַֽעֲמ֔וֹד וּ/מִ֥י יָק֖וּם בַּ/חֲר֣וֹן אַפּ֑/וֹ חֲמָת/וֹ֙ נִתְּכָ֣ה כָ/אֵ֔שׁ וְ/הַ/צֻּרִ֖ים נִתְּצ֥וּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/006.yaml
  text: Who can stand before his indignation? And who can rise up in the heat of his anger? His wrath is poured out like fire[c][b][a], and the rocks are shattered by him.
translation:
  language: zh_hans
  text: 谁能在他的盛怒面前站立得住？谁能在他怒火中挺立？他的烈怒如火倾泻而出，磐石也因他而崩碎。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “磐石也因他而崩碎”也可译作“磐石也被他击碎”或“磐石也从他而来地崩碎”；这里的希伯来介词可表示原因、施事或来源。“磐石”也可译作“岩壁”或“峭壁”。
    reason: 保留 מִמֶּנּוּ 的语义歧义，并说明 הַצֻּרִים 的主要词义范围；删除原文末句未出现的“面前”。
lexical_decisions:
- source_word: לִפְנֵי זַעְמוֹ
  choice: 在他的盛怒面前
  rationale: לִפְנֵי 表示“在……面前”；זַעַם 是强烈且带审判意味的忿怒。“盛怒”既自然，也保留其力度。
- source_word: יַעֲמוֹד
  choice: 站立得住
  rationale: 此处反问所问的是承受、抵挡的能力；“站立得住”兼顾“站立”的形象和语境中的能力含义。
- source_word: יָקוּם
  choice: 挺立
  rationale: קוּם 本义为“起来、站起”；“挺立”与前句形成近义平行，又传达面对烈怒仍企图站住的意思。
- source_word: בַּחֲרוֹן אַפּוֹ
  choice: 在他怒火中
  rationale: חֲרוֹן אַף 字面涉及怒气的燃烧、炽烈；“怒火”保留热与火的隐喻，并与下句的火相呼应。
- source_word: חֲמָתוֹ
  choice: 他的烈怒
  rationale: חֵמָה 在审判语境中指强烈忿怒。“烈怒”与前面的“盛怒、怒火”有所变化，反映原文叠用不同怒词的诗性力度。
- source_word: נִתְּכָה כָאֵשׁ
  choice: 如火倾泻而出
  rationale: נִתְּכָה 是被倾倒、倾泻；כָאֵשׁ 是“如火”。这一表达保留倾泻动作和明喻。
- source_word: הַצֻּרִים
  choice: 磐石
  rationale: צוּר 可指岩石、岩壁或峭壁。“磐石”适合庄重诗体，也凸显最坚固之物仍被震裂的意象。
- source_word: נִתְּצוּ
  choice: 崩裂
  rationale: 该动词表示被拆毁、击碎。“崩裂”适用于磐石，简洁呈现强烈的破坏效果。
- source_word: מִמֶּנּוּ
  choice: 因他
  rationale: מִן 在此可表达来源、原因或施事。“因他”保留一定开放性，不把它完全限定为直接施事或空间上的“从他而来”。
theological_decisions:
- issue: 三个神圣忿怒词的处理
  choice: 分别译为“盛怒、怒火、烈怒”
  alternative: 全部统一译作“愤怒”，或采用更强烈的“狂怒、暴怒”
  rationale: 原文接连使用 זַעַם、חֲרוֹן אַף、חֵמָה，既相关又不完全相同。采用相近而有变化的中文词，可保存诗歌层层加强的效果，又避免加入超出原文的失控情绪色彩。
- issue: 两个反问句的能力语气
  choice: 用“谁能……站立得住／挺立”表达无人能够承受
  alternative: 直译为“谁站立／谁起来”，或释义为“谁能忍受”
  rationale: 语境明显是关于面对神审判时能否站住的反问；“能”和“得住”使其语用力量在现代汉语中清楚，同时保留站立意象。
- issue: מִמֶּנּוּ 的关系
  choice: 正文译“因他”，脚注说明也可理解为“被他”或“从他面前”
  alternative: 明确译为“被他击碎”，将其限定为施事
  rationale: 希伯来介词可表示来源、原因或施事。正文避免过早消除歧义，脚注列出主要可能。
translation_notes:
  register: 采用现代、庄重而易懂的先知诗歌语体。两个反问句保持紧凑平行；“盛怒—怒火—烈怒”反映原文词汇变化；不添加特定宗派解释。
