base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/004.yaml
  text: He rebukes the sea and dries it up; he makes all the rivers run dry[a]. Bashan and Carmel wither; even the blossom of Lebanon withers.
translation:
  language: zh_hans
  text: 他斥责海，使海干涸；他使一切江河枯干[a]。巴珊和迦密衰残，黎巴嫩的花朵也衰残。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使一切江河干涸。”这里的希伯来语动词可直接表达使水域干竭。
    reason: 保留 חרב 使役式在本节水域语境中的贴近字面替代译法，并消除‘江河荒废’在现代汉语中的歧义。
lexical_decisions:
- source_word: גּוֹעֵר
  choice: 斥责
  rationale: 该分词表示有力的言语责令；“斥责”保留了上帝以命令制服海洋的鲜明人格化意象。
- source_word: בַּיָּם
  choice: 海
  rationale: 定冠词单数在此泛指或具有宇宙性意涵；中文用“海”自然，也不将其误作专名。
- source_word: וַיַּבְּשֵׁהוּ
  choice: 使海干涸
  rationale: 动词带第三人称阳性单数后缀，回指“海”；明确复现“海”可避免中文代词含混，并保留使役意义。
- source_word: וְכָל הַנְּהָרוֹת הֶחֱרִיב
  choice: 他使一切江河枯干
  rationale: חרב 的使役式在水域语境中表示使之干枯；“枯干”贴近原文，也与前句构成诗意平行。
- source_word: אֻמְלַל
  choice: 衰残
  rationale: 该词可描写植物萎蔫、衰败；“衰残”既适用于作为地区代称的巴珊、迦密，也保持庄重诗体。
- source_word: בָּשָׁן
  choice: 巴珊
  rationale: 按通行中文圣经地名音译；该地以丰饶著称，使衰败意象更强烈。
- source_word: וְכַרְמֶל
  choice: 和迦密
  rationale: 保留地名，不增添原文没有的“山”。
- source_word: וּפֶרַח לְבָנוֹן
  choice: 黎巴嫩的花朵也
  rationale: פֶרַח 为花朵或繁花；“也”自然表达 וּ 的递进兼并列作用，但不把递进程度说得过满。
- source_word: אֻמְלָל
  choice: 衰残
  rationale: 与前一处同词同译，保留重复及诗歌平行结构。
theological_decisions:
- issue: 本节的神圣主语在希伯来文中省略
  choice: 以“他”承接上文所指的耶和华
  alternative: 在本节明确重复“耶和华”
  rationale: 原文使用第三人称阳性单数动词，主语由那鸿书1:2-3的上下文提供；译作“他”既使中文句法完整，又不增添本节未出现的神名。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；以“斥责—干涸—枯干—衰残”的词汇链保留神命令自然、丰饶之地随之凋敝的诗性推进。
