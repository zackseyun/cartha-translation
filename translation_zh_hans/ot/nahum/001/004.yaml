  terminology: 地名‘巴珊’、‘迦密’、‘黎巴嫩’均规范。‘斥责’适切传达 גּוֹעֵר 的强有力责令；‘干涸’与‘枯干’分别用于海和江河，表达清晰。脚注宜将替代译法限于‘使……干涸’，避免以‘荒废’扩展为不自然且易误解的意义。
  issues:
