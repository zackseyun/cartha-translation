  text: ט֣וֹב יְהוָ֔ה לְ/מָע֖וֹז בְּ/י֣וֹם צָרָ֑ה וְ/יֹדֵ֖עַ חֹ֥סֵי בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/007.yaml
  text: Yahweh is good[a], a stronghold in the day of distress[c][b]; he knows those who take refuge in him.
translation:
  language: zh_hans
  text: 雅威是良善的；在患难之日[c]，他是坚固堡垒[a]；他认识那些投靠他的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坚固堡垒”也可译作“避难所”或“堡垒”。
    reason: lexical_alternative
  - marker: b
    text: “投靠他”也可译作“在他里面避难”或“信靠他”；希伯来文更直接地表达寻求庇护的意思。
    reason: lexical_alternative
  - marker: c
    text: “患难之日”也可译作“困苦之日”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 良善
  rationale: 该形容词概括雅威在品格与作为上的善；“良善”简洁、庄重，也不把含义局限为“仁慈”或“施惠”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接保留上帝的专名，以现代汉语常见音译“雅威”表达，而不以称号替代。
- source_word: לְמָעוֹז
  choice: 是……的坚固堡垒
  rationale: מָעוֹז指提供安全和防护之处。“坚固堡垒”保留具体的防御意象；前缀לְ在这里按表语性用法处理，而非目的义。
- source_word: בְּיוֹם צָרָה
  choice: 患难之日
  rationale: 该短语表示遭逢困苦危急之时；“患难之日”保留希伯来文的凝练表达，但不限定为末世某个特定日子。
- source_word: וְיֹדֵעַ
  choice: 他认识
  rationale: ידע的核心义为“认识、知道”，在此可包含亲自认得和眷顾的意味；译作“认识”保留这种丰富性，不直接释义为“照顾”。
- source_word: חֹסֵי בוֹ
  choice: 那些投靠他的人
  rationale: חסה的分词形式描写寻求庇护的人。“投靠他”既保留避难求护的图像，也符合自然现代汉语。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其专名性质，避免用“主”这一称号取代。
- issue: “患难之日”是否特指末世的日子
  choice: 保留一般性的时间表达“患难之日”
  alternative: 特指末世患难的某一日
  rationale: 本节本身不足以要求末世论上的专门解释，因此不在译文中缩窄其指向。
- issue: “认识”是否应解释为特别眷顾
  choice: 直译为“认识”
  alternative: 眷顾；看顾
  rationale: 上下文容许“认识”带有关系性认定和关怀，但原词仍保有较宽的语义，译文不替读者消除这层张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来诗句的简洁与平行推进；“雅威是良善的，是……”虽略带书面色彩，却能清楚呈现两个并列表述。
