  text: וּ/בְ/שֶׁ֣טֶף עֹבֵ֔ר כָּלָ֖ה יַעֲשֶׂ֣ה מְקוֹמָ֑/הּ וְ/אֹיְבָ֖י/ו יְרַדֶּף חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/008.yaml
  text: But with an overwhelming flood he will make a complete end of its place[a], and darkness will pursue his enemies.
translation:
  language: zh_hans
  text: 但他必用横扫而过的洪流，把她的地方彻底毁灭；黑暗必追赶他的仇敌。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשֶׁטֶף עֹבֵר
  choice: 但他必用横扫而过的洪流
  rationale: וּ在第7节耶和华保护投靠他的人与本节审判仇敌的对比中可作转折理解。שֶׁטֶף是泛滥的洪流，עֹבֵר描写其越过、席卷而去；“横扫而过”保留洪水的动态与毁灭力量。
- source_word: כָּלָה יַעֲשֶׂה
  choice: 彻底毁灭
  rationale: 该短语直译近于“造成完全的终结”。现代汉语用“彻底毁灭”自然地传达כָּלָה所含的完全、终结之意，而不弱化审判力度。
- source_word: מְקוֹמָהּ
  choice: 她所在之地
  rationale: 后缀为阴性单数，可能把受审判的城（很可能是尼尼微）人格化。“她所在之地”既保留阴性指称，也比生硬的“她的地方”更符合现代汉语。
- source_word: וְאֹיְבָיו
  choice: 他的仇敌
  rationale: 阳性单数后缀在上下文中最自然地指耶和华，即与他敌对的人；译文保留原文由阴性“她”转为阳性“他”的变化。
- source_word: יְרַדֶּף חֹשֶׁךְ
  choice: 黑暗必追赶
  rationale: רָדַף的加强词干表示追赶、追逐；חֹשֶׁךְ直译为“黑暗”。保留黑暗主动追赶仇敌的鲜明拟人意象，不在正文中解释为审判。
theological_decisions:
- issue: “她所在之地”与“他的仇敌”中代词后缀的所指
  choice: “她”指受审判并被人格化的城或敌对势力（很可能是尼尼微），“他”指耶和华。
  alternative: 把מְקוֹמָהּ非人格化地译作“其所在之地”，或把两个后缀视为同一所指。
  rationale: 希伯来文先用阴性单数后缀，随后改用阳性单数后缀。正文保留这一转换，避免把原文的语法差异和所指张力抹平。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“横扫而过的洪流”保留具体而强烈的灾难图景；“彻底毁灭”自然表达完全终结；分号呈现审判行动的两个相连画面。
