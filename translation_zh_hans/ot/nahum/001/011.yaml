base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/011.yaml
  text: From you has come one who plots evil against Yahweh[a], a counselor of worthlessness.
translation:
  language: zh_hans
  text: 从你那里出来一个图谋攻击耶和华的恶事的人；他是一个卑劣的谋士。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卑劣的谋士”或译“彼列的谋士”，若将希伯来语“彼列”理解为近似专名，而非指卑劣、邪恶或无价值。
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֵּךְ
  choice: 从你那里
  rationale: מִן加第二人称阴性单数后缀，表示来源；上下文中“你”很可能指作为城市或实体的尼尼微。现代汉语无需在代词中标出阴性。
- source_word: יָצָא
  choice: 出来了
  rationale: 完成式表示已经发生的行动；与“从你那里”搭配时，“出来了”自然地表达某人从该处兴起或出现。
- source_word: חֹשֵׁב עַל יְהוָה רָעָה
  choice: 图谋恶事、敌对耶和华
  rationale: חֹשֵׁב在敌对语境中指筹划、图谋；רָעָה在此指带有恶意的事。עַל在这一语境中具有敌对含义，故明确译作“敌对”，同时保留“图谋恶事”的宾语关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣四字名音译，保留其作为专名的性质，而不以一般称号替代。
- source_word: יֹעֵץ בְּלִיָּעַל
  choice: 出谋行恶的人
  rationale: יֹעֵץ是“出主意、谋划”的分词；בְּלִיָּעַל在希伯来圣经中通常表达败坏、邪恶或无价值。译文以自然中文表达其定性含义，不预先把它当作专名。
theological_decisions:
- issue: בְּלִיָּעַל应理解为普通名词还是近似专名
  choice: 正文按普通名词理解，译为“出谋行恶的人”
  alternative: “彼列的谋士”
  rationale: 本节不要求把בְּלִיָּעַל理解为后来人格化的专名；普通名词义更符合希伯来圣经中的常见用法。脚注保留专名式理解，以免消除真实的释义可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就是”表明后半句与前面的“一个……的人”同位，描写同一人物；用“图谋恶事、敌对耶和华”避免误读为人在谋划加害耶和华本身，同时保留希伯来语的敌对关系。
