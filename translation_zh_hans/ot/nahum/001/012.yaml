  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם שְׁלֵמִים֙ וְ/כֵ֣ן רַבִּ֔ים וְ/כֵ֥ן נָגֹ֖זּוּ וְ/עָבָ֑ר וְ/עִ֨נִּתִ֔/ךְ לֹ֥א אֲעַנֵּ֖/ךְ עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/012.yaml
  text: 'Thus says the LORD: Though they are whole, and likewise many, even so they will be cut down and pass away. Though I have afflicted you, I will afflict you no more.'
translation:
  language: zh_hans
  text: '耶和华如此说：


    “他们虽然安然无恙，人数众多，


    也必被剪除，消逝。


    我曾使你受苦，


    今后不再使你受苦。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: 完整无缺
  rationale: 保留该词“完整、健全”的基本含义；在本句中可指敌方阵容完备、实力未损，不直接扩写为“强盛”。
- source_word: נָגֹזּוּ
  choice: 被剪除
  rationale: 采用该动词常见的“剪断、剪除”意象，并保留被动形式。
- source_word: וְעָבָר
  choice: 归于消逝
  rationale: 表达“过去、消逝”的结果；其单数形式与前面的复数存在句法张力，译文不强行说明主语转换。
- source_word: וְעִנִּתִךְ
  choice: 我曾使你受苦
  rationale: 动词 ענה 的使役性语境义为“使受苦、苦待”；阴性单数宾语“你”在中文中不标性别。
theological_decisions:
- issue: 说话者的圣名 יהוה
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经传统中普通读者最熟悉的专名形式，同时明确保留这是神的专名，而非仅译作“主”。
- issue: 末句是否表示苦难已经结束
  choice: 我虽然曾使你受苦，却不再使你受苦
  alternative: 我使你受苦，但不会再使你受苦
  rationale: 保留经文中神自称为此前苦难的施行者，也保留“不再”的应许；“曾”自然传达完成性，但不额外限定苦难的方式或原因。
- issue: אִם 的让步功能
  choice: 虽然
  alternative: 如果
  rationale: 上下文和对应分句支持让步义：“即使/虽然他们完整且众多，仍必被剪除”；直译为条件句会削弱此处预告的确定性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，使用诗行呈现平行结构。避免把“完整无缺”解释性扩写为军事强盛，也不补出经文未明说的敌国名称。
