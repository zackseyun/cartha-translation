  text: מַה תְּחַשְּׁבוּ/ן֙ אֶל יְהוָ֔ה כָּלָ֖ה ה֣וּא עֹשֶׂ֑ה לֹֽא תָק֥וּם פַּעֲמַ֖יִם צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/009.yaml
  text: What are you plotting against Yahweh? He will make a complete end[b][a]; trouble will not rise up a second time.
translation:
  language: zh_hans
  text: 你们图谋什么来抵挡耶和华？他必施行彻底的毁灭。[a]患难不会再兴起。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施行彻底的毁灭”也可译作“使其完全终结”。原文未明说被终结的对象。
    reason: lexical_alternative
  - marker: b
    text: “患难不会再兴起”也可译作“灾祸不会第二次发生”。原文十分简练，可能指敌人的攻击不会再次兴起，也可能指患难不会再次临到，或不必重复施行审判。
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: 为什么
  rationale: מַה本义是“什么”，但在反问句“你们图谋什么反对耶和华”中，现代汉语用“为什么”更自然，也准确传达责问语气。
- source_word: תְּחַשְּׁבוּן
  choice: 图谋
  rationale: חשׁב可指思想、谋划或设计；结合介词אֶל及审判语境，“图谋”保留敌对谋划的意味。
- source_word: אֶל
  choice: 反对
  rationale: אֶל通常表示“向、对”，与“图谋”及敌对语境结合时译为“反对”最合适，同时没有把具体阴谋过度明说。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语体中广为人知的神名形式“耶和华”，明确保留专名而非以称号替代。
- source_word: כָּלָה
  choice: 彻底毁灭
  rationale: כָּלָה表示终结、完全的结局，在审判语境中含毁灭意味；“彻底毁灭”自然表达其完全性，但不指定毁灭对象。
- source_word: הוּא עֹשֶׂה
  choice: 他必
  rationale: 代词加分词可表达正在、确定或即将发生的行动；在先知性宣告中用“必”体现其确定性。
- source_word: לֹא תָקוּם
  choice: 必不……兴起
  rationale: 保留קום“起来、兴起”的意象，并以“必不”表达否定宣告的确定语气。
- source_word: פַּעֲמַיִם
  choice: 再次
  rationale: 字面可作“两次”，此处“再次”是自然汉语，表达不会有第二次。
- source_word: צָרָה
  choice: 患难
  rationale: צָרָה可指困苦、患难、灾祸；“患难”保持宽泛，不预先判定它是敌军攻击、百姓所受苦难，还是重复施行的审判。
theological_decisions:
- issue: 末句中“患难”的所指及语力
  choice: 保留“患难必不再次兴起”的简洁表述，强调耶和华行动的决定性，同时不明确限定患难临到谁。
  alternative: 可理解为敌人的攻击不会再次兴起；也可理解为患难不会第二次临到神的百姓；或耶和华无需重复审判。
  rationale: 希伯来文צָרָה没有明示受事者或具体所指。直译式的简洁表达能保存原文的多义性与神学张力，避免把经文局限于某一解释。
- issue: “彻底毁灭”的对象
  choice: 不补出宾语。
  alternative: 可补作“他必将你们彻底毁灭”或“他必彻底毁灭敌人”。
  rationale: 原文כָּלָה הוּא עֹשֶׂה没有明确说出被终结者；不补宾语既忠于句法，也避免过早确定发言对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“图谋反对”保留原文“谋划＋向着/反对”的结构；“彻底毁灭”体现审判语境中的完全终结。两个脚注标记均置于正文相关分句之后。
