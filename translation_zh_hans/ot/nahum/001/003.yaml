  text: יְהֹוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ ו/גדול כֹּ֔חַ וְ/נַקֵּ֖ה לֹ֣א יְנַקֶּ֑ה יְהוָ֗ה בְּ/סוּפָ֤ה וּ/בִ/שְׂעָרָה֙ דַּרְכּ֔/וֹ וְ/עָנָ֖ן אֲבַ֥ק רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/003.yaml
  text: Yahweh is slow to anger and great in power[a], and he will by no means leave the guilty unpunished. Yahweh—his way is in the whirlwind and the storm, and clouds are the dust of his feet.
translation:
  language: zh_hans
  text: 耶和华不轻易发怒，大有能力；他绝不以有罪者为无罪[a]。耶和华的道路在旋风和暴风中；云彩是他脚下的尘土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他绝不让有罪者免受惩罚。”较直译为：“他绝不宣告有罪者无罪。”
    reason: 说明强调结构 וְנַקֵּה לֹא יְנַקֶּה 所容许的司法性译法和语境性译法。
lexical_decisions:
- source_word: יְהֹוָה / יְהוָה
  choice: 耶和华
  rationale: 以现代中文中广为人知的专名“耶和华”译出四字神名，保留原文直接使用立约之名的特征。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒
  rationale: 这是表示忍耐、迟于发怒的希伯来语习语；“不轻易发怒”自然易懂，也准确传达其意义。
- source_word: וּגְדוֹל־כֹּחַ
  choice: 大有能力
  rationale: גדול与כח合用，表达能力或力量强大；“大有能力”符合现代中文经文语体。
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: 绝不以有罪的为无罪
  rationale: 同根动词配合否定构成强调，意为绝不宣告无罪或免除惩罚；此译法保留司法色彩，并按语境补出隐含的有罪者。
- source_word: בְּסוּפָה וּבִשְׂעָרָה
  choice: 在旋风和暴风之中
  rationale: 分别保留两种猛烈风暴的并列意象，用现代中文可理解的“旋风”和“暴风”表达。
- source_word: דַּרְכּוֹ
  choice: 行在……之中
  rationale: 原义为“他的道路”；在此描写耶和华以风暴为行进之途，转译为“行在……之中”使中文自然，同时保留动态意象。
- source_word: וְעָנָן אֲבַק רַגְלָיו
  choice: 云彩是他脚下的尘土
  rationale: 将单数集合名词עָנָן自然译作“云彩”，保留云如神行进时脚下扬尘的诗性比喻。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次直接使用神名；正文采用现代中文读者最熟悉且具有专名功能的“耶和华”，不以“主”替代，从而保留专名特征。
- issue: וְנַקֵּה לֹא יְנַקֶּה 的审判含义
  choice: 他绝不以有罪的为无罪
  alternative: 他绝不免除惩罚
  rationale: 所选译法保留“宣告无罪／清白”的司法含义，以及强调否定的力度；脚注列出惩罚层面的语义可能，避免把词义限缩为单一解释。
- issue: 忍耐与审判之间的张力
  choice: 并列保留“不轻易发怒”与“绝不以有罪的为无罪”
  alternative: 将前句解释为延迟惩罚
  rationale: 原文同时陈述神迟于发怒和绝不宣告有罪者无罪；译文不把其中一面消解为另一面。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“不轻易发怒”“大有能力”保持清晰流畅；后半句保留旋风、暴风、云彩和尘土的诗歌意象。脚注标记[a]已在正文相应位置出现。
