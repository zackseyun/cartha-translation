base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/005.yaml
  text: The mountains quake before him[a], and the hills melt away; the earth rises up before his face[b], the world and all who dwell in it.
translation:
  language: zh_hans
  text: '群山因他震动[a]，丘陵都熔化；

    大地在他面前隆起[b]——

    整个世界和其中所有居民。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因他”也可译作“在他面前”或“由于他”；希伯来文的介词字面有“从他”的意思。
    reason: lexical_alternative
  - marker: b
    text: “隆起”也可译作“翻腾”或“被掀起”。这里的希伯来动词可表达抬起、升起或剧烈翻动。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים רָעֲשׁוּ מִמֶּנּוּ
  choice: 群山因他震动
  rationale: רעש表示震动、战栗；מִמֶּנּוּ字面为“从他”，此处自然表达为由他的临在所引发的震动，同时用脚注保留介词的其他理解。
- source_word: הַגְּבָעוֹת הִתְמֹגָגוּ
  choice: 丘陵都熔化
  rationale: מוג的Hitpael形式描写消融、熔化；“熔化”保留神显场景中鲜明而强烈的宇宙性意象。
- source_word: וַתִּשָּׂא הָאָרֶץ
  choice: 大地……隆起
  rationale: נשׂא的基本意义涉及抬起、升起；“隆起”既保留向上的动态，也符合大地剧烈震荡的语境。脚注说明可作“翻腾”或“被掀起”。
- source_word: מִפָּנָיו
  choice: 在他面前
  rationale: 希伯来语字面涉及“他的面”；汉语“在他面前”自然、庄重，并保留其临在感。
- source_word: תֵבֵל
  choice: 整个世界
  rationale: תֵבֵל常指有人居住、井然有序的世界；加“整个”与下句“所有居民”相称，并凸显范围。
- source_word: כָל יֹשְׁבֵי בָהּ
  choice: 其中所有居民
  rationale: 分词结构指住在世界中的一切人；“居民”简洁自然，也保持集体性的表达。
theological_decisions:
- issue: 神审判显现中的宇宙性意象
  choice: 按经文直接描写受造界在上主临在前震动、熔化和隆起，不将其弱化为单纯的政治隐喻。
  alternative: 将山岭与大地的变化解释并译成政治动荡。
  rationale: 上下文描写上主在忿怒与威严中显现；译文保留宇宙性的张力，但不额外断定这些意象应按何种方式实现。
- issue: 大地、世界及居民与谓语的关系
  choice: 以“也都如此”表明“整个世界和其中所有居民”承接“大地在他面前隆起”所描写的震荡。
  alternative: 把“世界和其中所有居民”处理为与前句无明确谓语关系的并列补语。
  rationale: 希伯来文后两项在结构上补充并扩展“大地”的范围；汉语补出“也都如此”可保持语义联系，又避免生硬地说居民本身“隆起”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“群山—丘陵—大地—整个世界”保留原文范围逐步扩展的诗歌结构；分行呈现平行与递进关系。
