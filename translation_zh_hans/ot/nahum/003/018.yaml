  text: נָמ֤וּ רֹעֶ֨י/ךָ֙ מֶ֣לֶךְ אַשּׁ֔וּר יִשְׁכְּנ֖וּ אַדִּירֶ֑י/ךָ נָפֹ֧שׁוּ עַמְּ/ךָ֛ עַל הֶ/הָרִ֖ים וְ/אֵ֥ין מְקַבֵּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/018.yaml
  text: Your shepherds slumber[a], O king of Assyria; your nobles lie down. Your people are scattered on the mountains[d][c][b], and there is no one to gather them.
translation:
  language: zh_hans
  text: 亚述王啊，你的牧人[a][b]沉睡了；你的权贵躺卧[c]。你的百姓散落在群山上[d]，无人招聚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沉睡”也可译作“睡着”；这里可能描绘领袖疏忽或无力行动。
    reason: lexical_alternative
  - marker: b
    text: “牧人”比喻亚述的统治者或领袖。
    reason: cultural_note
  - marker: c
    text: “躺卧”所译的希伯来语动词也可表示“居住”或“安歇”；这里可能承接上一句领袖沉睡的意象。
    reason: alternative_reading
  - marker: d
    text: 译作“散落”的希伯来词含义困难；此译法主要根据下句“无人招聚”。
    reason: textual_variant
lexical_decisions:
- source_word: נָמוּ
  choice: 沉睡了
  rationale: 该动词表示睡眠或打盹；“沉睡”既保留诗歌意象，也能暗示领袖失去行动能力，但不在正文中断定是疏忽、瘫痪还是死亡。
- source_word: רֹעֶיךָ
  choice: 你的牧人
  rationale: 直译为“你的牧人”，在先知文学中比喻君王手下的统治者或领袖；正文保留原有比喻。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王啊
  rationale: 上下文显示这是直接称呼；汉语用“啊”自然表达呼格。
- source_word: יִשְׁכְּנוּ
  choice: 躺卧不动
  rationale: שׁכן通常可指居住、安歇；在与“沉睡”平行的语境中，译作“躺卧不动”较能传达领袖毫无行动的诗意画面，同时脚注保留“安歇／居住”的词义可能。
- source_word: אַדִּירֶיךָ
  choice: 你的权贵
  rationale: 该词可指尊贵、有权势的人；“权贵”适合亚述政治领袖的语境，又不把所指过度限定为军人。
- source_word: נָפֹשׁוּ
  choice: 散落
  rationale: 此词形和词义困难；结合“在群山上”以及下句“无人招聚”，上下文最自然地指百姓四散。
- source_word: עַמְּךָ
  choice: 你的百姓
  rationale: 采用该词通常的广义含义，不无根据地缩窄为“军队”。
- source_word: עַל הֶהָרִים
  choice: 在群山上
  rationale: 直接传达介词短语及הָרִים的通常含义；“群山”符合现代汉语诗体表达。
- source_word: וְאֵין מְקַבֵּץ
  choice: 无人招聚
  rationale: 简洁表达“没有招聚者”；“招聚”的宾语从前句“百姓”自然承接，无须重复。
theological_decisions:
- issue: 沉睡与躺卧的含义
  choice: 正文保留领袖沉睡、躺卧不动的诗歌意象
  alternative: 明确译为领袖死亡，或明确解释为玩忽职守
  rationale: 希伯来文本描绘无能为力的状态，却未明确限定其成因；不应把死亡或失职的解释写死。
- issue: נָפֹשׁוּ的困难词义
  choice: 依上下文译为“散落”并加注说明
  alternative: 按可能的词根联系译为“喘息／得喘息”
  rationale: 后句“无人招聚”强烈支持分散之意，但原词本身存在词汇或文本困难，故正文采用语境意义，脚注保留不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的先知诗歌语体。“牧人”保留原文政治隐喻；“沉睡了／躺卧不动”形成平行句式；“散落在群山上，无人招聚”保持简洁和末日般的无助感。所有脚注标记均置于相关正文表达之后。
