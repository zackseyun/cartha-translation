  text: אֵין כֵּהָ֣ה לְ/שִׁבְרֶ֔/ךָ נַחְלָ֖ה מַכָּתֶ֑/ךָ כֹּ֣ל שֹׁמְעֵ֣י שִׁמְעֲ/ךָ֗ תָּ֤קְעוּ כַף֙ עָלֶ֔י/ךָ כִּ֗י עַל מִ֛י לֹֽא עָבְרָ֥ה רָעָתְ/ךָ֖ תָּמִֽיד־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/019.yaml
  text: There is no healing for your fracture[a]; your wound is grievous. All who hear the report about you clap their hands over you[b], for over whom has your evil not continually passed?
translation:
  language: zh_hans
  text: 你的创伤无法缓解[a]，你的伤口极其严重。凡听见你的消息的人，都因你的败亡而拍手称快[b]；因为有谁不曾不断遭受你的恶行呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的创伤无法医治。”这里的词可指伤势得以缓解，也可引申为医治。
    reason: lexical_alternative
  - marker: b
    text: “拍手称快”在这里表示因尼尼微败亡而欢庆。末句的反问强调：尼尼微长期作恶，所造成的伤害波及极广。
    reason: cultural_note
lexical_decisions:
- source_word: אֵין כֵּהָה לְשִׁבְרֶךָ
  choice: 你的创伤无法缓解
  rationale: אֵין引出绝对否定；כֵּהָה在此指伤势的减轻或缓解，שֶׁבֶר延续破裂、创伤的比喻。译文保留无可减轻的判词，同时避免把上下文暗示的“无法医治”直接写入正文。
- source_word: נַחְלָה מַכָּתֶךָ
  choice: 你的伤口极其严重
  rationale: מַכָּה指击打所致的伤口；נַחְלָה在此形容伤势严重、恶化。译作“极其严重”自然明确，但不将其过度限定为“绝症”。
- source_word: כֹּל שֹׁמְעֵי שִׁמְעֲךָ
  choice: 凡听见你的消息的人
  rationale: 同根词组表达听见有关尼尼微的消息；“你的消息”在现代汉语中简洁自然，并由语境表明是其败亡的消息。
- source_word: תָּקְעוּ כַף עָלֶיךָ
  choice: 都因你而拍手
  rationale: תָּקְעוּ כַף是击掌、拍手的动作；在审判语境中表示幸灾乐祸或欢庆。“因你而拍手”保留动作及其针对性，具体含义交由脚注说明。
- source_word: כִּי עַל מִי לֹא עָבְרָה רָעָתְךָ תָּמִיד
  choice: 因为你的恶行不断临到，谁能幸免呢？
  rationale: 保留反问的普遍指向，并以自然汉语重组语序。עָבְרָה原指经过、越过，此处与עַל连用，表示恶行不断波及或临到人；“谁能幸免”传达否定反问，而不把受害范围机械译成绝对无一例外。
theological_decisions:
- issue: 审判宣告中רָעָתְךָ的道德含义
  choice: 你的恶行
  alternative: 你的邪恶；你的暴行；你所造成的灾祸
  rationale: 这里谴责亚述持续施加于各国的道德恶及其伤害。“恶行”兼顾道德责任和具体作为，既不缩窄为某一种暴行，也不淡化为纯粹的灾祸。
- issue: 末句反问的范围
  choice: 谁能幸免呢？
  alternative: 有谁未曾遭受你的恶行呢？
  rationale: 希伯来语以否定反问强调尼尼微恶行波及极广。正文保留反问和修辞力度，不将其解释成严格意义上每个个体都曾受害；脚注说明其语用含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文维持创伤与伤口的意象，也保留末句的反问力度；标点按现代汉语处理。“你”在本节指尼尼微。
