- from: 你的创伤无法缓解[a]，你的伤口极其严重。凡听见你的消息的人，都因你而拍手[b]；因为你的恶行不断临到，谁能幸免呢？
  to: 你的创伤无法缓解[a]，你的伤口极其严重。凡听见你的消息的人，都因你的败亡而拍手称快[b]；因为有谁不曾不断遭受你的恶行呢？
  rationale: 修订末句以“有谁不曾不断遭受你的恶行呢”完整对应原文的否定反问、持续性和泛指受害者。拍手动作在本段结语的历史与修辞语境中明确是对尼尼微败亡的欢庆，故使其在汉语中自然可懂。其余内容维持原译的伤损隐喻、庄重语体和对词义范围的审慎处理。
