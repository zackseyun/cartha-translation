  register: 采用庄重而自然的现代标准汉语。“比天上的星星还多”保留原文夸张性的比较；后半句保持简短有力，以呈现蝗虫突然掠尽而去的意象。所有词义歧义均在脚注中保留，未加入宗派性解释。
