  yaml_path: translation/ot/nahum/003/016.yaml
  text: You multiplied your merchants more than the stars of the heavens[b][a]; the locust strips bare and flies away.
translation:
  language: zh_hans
  text: 你使你的商人增多，数目超过天上的星星；蝗虫[a]剥掠一空[b]，便飞走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“幼蝗”或“蝗蝻”；希伯来语指某一种类或生长阶段的蝗虫。
    reason: lexical_alternative
  - marker: b
    text: 这个希伯来语动词也可译作“铺展开来”或“剥去”；这里很可能描写蝗虫剥掠后离去。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבֵּית
  choice: 你使……增多
  rationale: 这是 רבה 的使役词干完成式第二人称阴性单数，直接称呼被拟人化为女性的尼尼微；译文用“你使你的商人……还多”自然表达使之增多的含义。
- source_word: רֹכְלַיִךְ
  choice: 你的商人
  rationale: רכל 指从事贸易的人；“商人”是现代汉语中自然、清楚的对应，也符合尼尼微商业繁盛的语境。
- source_word: מִכּוֹכְבֵי הַשָּׁמָיִם
  choice: 比天上的星星还多
  rationale: 介词 מִן 在 רבה 之后表示比较；此译法准确传达数量超过天上众星，并符合现代汉语表达。
- source_word: יֶלֶק
  choice: 蝗虫
  rationale: 该词可指某一种类或生长阶段的蝗虫；正文采用普通读者容易理解的总称，较具体的可能性收入脚注。
- source_word: פָּשַׁט
  choice: 剥掠一空
  rationale: 该动词可有铺开、剥去或剥掠之意；在蝗灾意象中，“剥掠一空”自然呈现蝗虫造成破坏后离去的画面，同时以脚注保留词义上的不确定性。
- source_word: וַיָּעֹף
  choice: 便飞走了
  rationale: עוּף 意为“飞”；“便”自然表达连续动作，呈现蝗虫剥掠之后迅速离去。
theological_decisions: []
