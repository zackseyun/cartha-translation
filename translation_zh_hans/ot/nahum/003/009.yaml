base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/009.yaml
  text: Cush was her strength[a], and Egypt without end[d][c][b]; Put and the Libyans were among your helpers.
translation:
  language: zh_hans
  text: 古实是她的力量[a][b]，埃及的援助无穷无尽[e]；普特[c]和路比人[d]是帮助你的援军。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文中人称发生转换：这里是第三人称阴性单数“她的力量”，后面却是第二人称阴性单数“帮助你”。译文保留这一转换。
    reason: lexical_alternative
  - marker: b
    text: 有译本作“古实是你的力量”，使这里与后面的“你”一致；但希伯来语“力量”一词所带的后缀是“她的”。
    reason: alternative_reading
  - marker: c
    text: “普特”是希伯来专名，也有传统译法作“弗”。
    reason: lexical_alternative
  - marker: d
    text: “路比人”按希伯来语族名音译，通常认为是利比亚一带的民族。
    reason: cultural_note
  - marker: e
    text: 原文直译为“埃及，且没有尽头”，未明说“没有尽头”具体修饰什么。这里按语境补作“援助无穷无尽”；也可理解为埃及所提供的资源或力量没有穷尽。
    reason: translation_note
lexical_decisions:
- source_word: כּוּשׁ
  choice: 古实
  rationale: 按希伯来专名音译；“埃塞俄比亚”是带有现代地理色彩的解释性对应，范围未必相同。
- source_word: עָצְמָהּ
  choice: 是她的力量
  rationale: 该词带第三人称阴性单数后缀，直指上文作为阴性城市的挪亚们；保留“她”，不与后半节第二人称“你”协调一致。
- source_word: וּמִצְרַיִם וְאֵין קֵצֶה
  choice: 埃及的势力无穷无尽
  rationale: “没有尽头”在此表示支援力量广大无边；补出“势力”使省略式希伯来语在现代汉语中自然，同时不把数量具体化。
- source_word: פּוּט
  choice: 普特人
  rationale: 按希伯来名称音译，并加“人”表明这里所指的民族或军力。
- source_word: לוּבִים
  choice: 路比人
  rationale: 保留希伯来族名的音译，避免直接等同于现代国界意义上的“利比亚人”。
- source_word: הָיוּ בְּעֶזְרָתֵךְ
  choice: 都来帮助你
  rationale: 以自然汉语表达这些民族构成该城援助力量；“你”保留原文第二人称阴性单数的直接称呼。
theological_decisions:
- issue: 本节内部的人称转换
  choice: 前半句译“她”，后半句译“你”
  alternative: 全节统一译为“你”
  rationale: 希伯来文本由第三人称阴性单数转为第二人称阴性单数；该转换属于原文修辞与语法现象，不宜静默消除。
- issue: “没有尽头”的修饰关系
  choice: 理解为埃及所提供的势力无穷无尽
  alternative: 理解为古实与埃及合在一起的力量无穷无尽，或笼统译“没有尽头”
  rationale: 原文高度简省，句法关系存在一定张力；正文采用自然且符合语境的表达，脚注说明字面形式，避免把解释说成唯一可能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“她／你”的转换刻意保留原文形式；地名和族名优先按希伯来语音译。分号呈现前后两组盟援力量，避免长句含混。
