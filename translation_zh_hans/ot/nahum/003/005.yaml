  text: הִנְ/נִ֣י אֵלַ֗יִ/ךְ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וְ/גִלֵּיתִ֥י שׁוּלַ֖יִ/ךְ עַל פָּנָ֑יִ/ךְ וְ/הַרְאֵיתִ֤י גוֹיִם֙ מַעְרֵ֔/ךְ וּ/מַמְלָכ֖וֹת קְלוֹנֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/005.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will uncover your skirts over your face, and I will show the nations your nakedness and the kingdoms your shame.
translation:
  language: zh_hans
  text: “看哪，我与你为敌！”万军之雅威宣告，“我要把你的裙摆掀到你脸上[a]，使列国看见你的赤身，使各王国看见你的羞耻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文描绘把女子的裙摆掀到脸上的情景，作为公开暴露和羞辱的比喻；也可意译为“我要暴露你的赤身”。
    reason: 说明原文文化意象及可采用的意译。
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: 看哪，我与你为敌
  rationale: הִנְנִי引出庄严、要求注意的神谕；与אֵלַיִךְ连用时表达敌对姿态。译文保留“看哪”的先知性语气，并自然表达“与你为敌”。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 万军之雅威宣告
  rationale: 保留标准先知宣告公式；“雅威”音译神名יהוה，“万军之”保留צְבָאוֹת所体现的统帅与宇宙主权称号。
- source_word: וְגִלֵּיתִי שׁוּלַיִךְ עַל פָּנָיִךְ
  choice: 我要把你的裙摆掀到你脸上
  rationale: 具体保留掀开衣服下摆、使其蒙到脸上的强烈羞辱意象；“裙摆”比抽象的“衣服”更贴近שׁוּלַיִךְ。
- source_word: וְהַרְאֵיתִי גוֹיִם מַעְרֵךְ
  choice: 使列国看见你的赤裸
  rationale: 使役形态הַרְאֵיתִי译为“使……看见”；מַעְרֵךְ指被暴露的赤裸，在本节中含公开羞辱之意。
- source_word: וּמַמְלָכוֹת קְלוֹנֵךְ
  choice: 使各王国看见你的羞耻
  rationale: 后半句承接前句省略动词，中文补出“使……看见”以显明平行关系；“各王国”与“列国”相应而不混同，“羞耻”准确传达קְלוֹנֵךְ。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”以呈现其专名性质，不以称号替代。
- issue: 公开裸露意象的处理
  choice: 按原文保留具体而严厉的羞辱图像
  alternative: 概括译为“我要公开羞辱你”
  rationale: 该图像是对拟人化为女性的尼尼微所宣告的审判，兼具赤裸与公开蒙羞的张力；抽象化会削弱原文力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的郑重语气；引号与破折号帮助读者辨明神谕公式，同时不改变希伯来文句法关系。
