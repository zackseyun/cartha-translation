  text: הִנֵּ֨ה עַמֵּ֤/ךְ נָשִׁים֙ בְּ/קִרְבֵּ֔/ךְ לְ/אֹ֣יְבַ֔יִ/ךְ פָּת֥וֹחַ נִפְתְּח֖וּ שַׁעֲרֵ֣י אַרְצֵ֑/ךְ אָכְלָ֥ה אֵ֖שׁ בְּרִיחָֽיִ/ך׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/013.yaml
  text: Look[a], your troops are women in your midst; the gates of your land stand wide open to your enemies[c][b]; fire has consumed your bars.
translation:
  language: zh_hans
  text: 看哪，你中间的民众都是妇女[a]；你国土的城门已经向仇敌完全敞开[b]；火已经吞噬了你的门闩[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “民众”也可按本节的战争语境理解为“守军”或“军兵”。希伯来语עַם通常指“人民”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“打开，已经打开”，用重复式结构加强语气，表示城门大开或完全敞开。
    reason: lexical_alternative
  - marker: c
    text: “门闩”也可译作“门栓”，指横在城门后、用来把门锁牢的闩木。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引出强调性观察或宣告的指示感叹词；“看哪”简洁庄重，也保留了原文的突显作用。
- source_word: עַמֵּךְ
  choice: 你的民众
  rationale: עַם通常指“人民、民众”。本节处于军事审判语境，也可能特指尼尼微的守军，但正文采用较直接的词义，并以脚注保留语境性理解。
- source_word: נָשִׁים
  choice: 妇女
  rationale: 原文是复数名词“妇女”，没有明示比较词；直译保留先知嘲讽敌军软弱的尖锐修辞。
- source_word: בְּקִרְבֵּךְ
  choice: 在你中间
  rationale: 保留表示内部位置的措辞，指尼尼微内部的情形。
- source_word: לְאֹיְבַיִךְ
  choice: 向仇敌
  rationale: 介词לְ在城门敞开的意象中表示朝向或对着敌人；“向仇敌”符合汉语表达。
- source_word: פָּתוֹחַ נִפְתְּחוּ
  choice: 已经完全敞开
  rationale: 不定式绝对形与限定动词连用，加强“打开”的程度；“完全敞开”表达大开、毫无遮拦的强调意味，“已经”体现完成后的状态。
- source_word: שַׁעֲרֵי אַרְצֵךְ
  choice: 你国土的城门
  rationale: אַרֶץ在这里指尼尼微所属的疆土或国境；“国土的城门”保留原有意象，而不局限为单座城市的门。
- source_word: אָכְלָה אֵשׁ
  choice: 火已经吞噬了
  rationale: 原文以“火”为主语，完成式描写焚毁已成事实；“吞噬”保留אָכַל的生动拟人色彩。
- source_word: בְּרִיחָיִךְ
  choice: 你的门闩
  rationale: 指用来封固城门的横闩或门栓；结合前句的城门意象，“门闩”明确自然。
theological_decisions:
- issue: נָשִׁים所构成的性别化军事嘲讽
  choice: 正文直译为“都是妇女”
  alternative: “像妇女一样”或“都软弱无力”
  rationale: 希伯来文直接使用“妇女”这一名词，没有比较词，也没有明说“软弱”。译文不淡化古代战争语境中的尖锐修辞，也不把隐含评价扩写进正文。
- issue: עַמֵּךְ在军事语境中的所指
  choice: 正文译为“你的民众”，脚注说明也可能指守军
  alternative: 直接译为“你的军兵”或“你的军队”
  rationale: 词语本义较宽，通常指人民；上下文则明显涉及防御力量。正文与脚注共同保留这一词义张力，避免把语境推断处理成唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“看哪”保留先知宣告的力度；分号维持原文三个递进的审判画面。正文尽量贴近希伯来语，同时用脚注说明军事语境中的词义可能性与强调结构。
