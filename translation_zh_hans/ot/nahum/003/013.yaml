  source_fidelity: 正文准确对应希伯来文的三个断言：הִנֵּה译为“看哪”；עַמֵּךְ按通常义译为“你中间的民众”，并以脚注保留其在军事语境下可指守军的可能；נָשִׁים直译为“妇女”，没有擅自补入“像”或“软弱”等比较、解释性词语。פָּתוֹחַ נִפְתְּחוּ的加强式由“已经……完全敞开”恰当地表达；末句保留“火”作主语及完成性。
