  terminology: “民众／守军”通过正文和脚注保留了עם的词义范围；“妇女”忠实保留原文性别化的战争嘲讽修辞；“门闩”准确表达בְּרִיחַ在城门语境中的横闩、门栓之义。脚注标记a、b、c均在正文中有对应锚点，内容与所附位置相符。
