base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/014.yaml
  text: Draw water for yourself for the siege; strengthen your fortresses[a]. Go into the clay and tread the mortar; take hold of the brick mold.
translation:
  language: zh_hans
  text: 你要为自己汲取围城时所需的水，加固你的堡垒。你要走进泥里，踩踏黏土，抓住砖模[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或将“砖模”译作“砖窑”。希伯来语“מַלְבֵּן”十分罕见，既可能指砖模，也可能指砖窑；本句提到进入泥里并踩踏黏土，因此正文采用“砖模”。
    reason: 保留罕见希伯来词 מַלְבֵּן 的词义歧义，不改变前面动词“抓住”的理解。
lexical_decisions:
- source_word: מֵי מָצוֹר
  choice: 围城时所需的水
  rationale: 该结构直译为“围城之水”。结合上下文，指为将临的围城预先汲取和储备的水；这一译法既保留军事语境，也符合现代汉语表达。
- source_word: שַׁאֲבִי לָךְ
  choice: 你要为自己汲取
  rationale: 阴性单数祈使式，是对拟人化的城发话；“为自己”保留 לָךְ 的与格、受益者意味。
- source_word: חַזְּקִי מִבְצָרָיִךְ
  choice: 加固你的堡垒
  rationale: חזק 的 Piel 祈使式表示使之坚固；מִבְצָרִים 指设防之处或堡垒。“加固你的堡垒”准确而自然。
- source_word: בֹּאִי בַטִּיט
  choice: 你要走进泥里
  rationale: טִיט 可指泥、泥浆或制砖用的湿黏土。“走进泥里”保留动作画面，并避免把同句两个材料词完全同译。
- source_word: וְרִמְסִי בַחֹמֶר
  choice: 踩踏黏土
  rationale: רמס 的基本义是踩踏；חֹמֶר 在制砖语境中可指黏土或泥料。“踩踏黏土”传达以脚调制砖料的具体动作。
- source_word: הַחֲזִיקִי מַלְבֵּן
  choice: 抓住砖模
  rationale: החזיק 在此可理解为抓住、拿稳；מַלְבֵּן 是罕见词，在泥土与制砖的连续画面中可指砖模。不过该词也可能指砖窑，故以脚注保留异译。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。连续使用“汲取、加固、走进、踩踏、抓住”，保留原文一连串阴性单数祈使式的紧迫感；以明确的“你”维持对拟人化城市的直接呼告。
