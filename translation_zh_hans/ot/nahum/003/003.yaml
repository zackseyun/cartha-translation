    rationale: 希伯来文并非汉语被动式；脚注宜说明其字面后缀及所指歧义，而不把“被尸体”称作直译。
  - severity: low
    issue: “矛头如电”略将“长矛的闪电／闪光”限缩为矛头。
    rationale: 改作“矛光如电”更贴近兵器闪光的整体意象，也更符合原文名词并列结构。
