  yaml_path: translation/ot/nahum/003/003.yaml
  text: Horsemen charging[a], and the flashing sword and the gleaming spear, and a multitude of slain, and heaps of corpses[c][b]; and there is no end to the bodies— they stumble over the bodies.
translation:
  language: zh_hans
  text: 骑兵冲锋，刀光闪耀，矛光如电；被杀的人成群，尸体堆积；尸首无穷无尽——人们在尸体中绊倒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在尸体中”所对应的希伯来文可直译为“在他们的尸体中”或“被他们的尸体绊倒”；“他们”可能泛指眼前那些被杀的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרָשׁ מַעֲלֶה
  choice: 骑兵冲锋
  rationale: פָּרָשׁ虽为单数形式，在战场描写中可作集合名词；מַעֲלֶה本义为“上来、前进”，此处译作“冲锋”，自然传达骑兵进攻的动态。
- source_word: לַהַב חֶרֶב
  choice: 刀光闪耀
  rationale: לַהַב本义为“火焰、焰光”，用于刀剑时描写其闪光；“刀光闪耀”既保留鲜明意象，也符合现代汉语表达。
- source_word: בְּרַק חֲנִית
  choice: 矛头如电
  rationale: בְּרַק意为“闪电、闪光”；“如电”保留原文以闪电描绘长矛寒光的意象，而“矛头”使汉语画面自然明确。
- source_word: רֹב חָלָל
  choice: 被杀的人成群
  rationale: חָלָל在此战场语境中指被杀的人，רֹב强调数量众多；该译法直接清楚，并与后续尸体景象衔接。
- source_word: כֹבֶד פָּגֶר
  choice: 尸体堆积
  rationale: כֹבֶד本义涉及“重量、沉重”，在此表达尸体数量巨大、形成重重堆积；“尸体堆积”简洁而有视觉冲击。
- source_word: אֵין קֵצֶה לַגְּוִיָּה
  choice: 尸首无穷无尽
  rationale: 直译为“尸体没有尽头”；“尸首无穷无尽”保留数量无边的强调，并避免与前句措辞完全重复。
- source_word: יכשלו בִּגְוִיָּתָם
  choice: 人都被尸体绊倒
  rationale: יכשלו表示“绊倒、踉跄”；主语在希伯来文中未明说，汉语补出泛指的“人”。בִּגְוִיָּתָם带第三人称复数后缀，其所指略有含混，正文按场景译为“尸体”，脚注说明字面形式。
