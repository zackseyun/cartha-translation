base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/015.yaml
  text: There the fire will devour you; the sword will cut you off; it will devour you like the locust[a]. Multiply yourself like the locust; multiply yourself like the swarming locust.
translation:
  language: zh_hans
  text: 在那里，火必吞噬你；刀剑必剪除你，刀剑必像蝗虫一样吞噬你。[a]你要像蝗虫一样增多；你要像成群的蝗虫一样增多！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在本节用了两个相关的虫名：יֶלֶק可能指某一种蝗虫或蝗虫的某个生长阶段；אַרְבֶּה则是“蝗虫”的常用词。正文分别译作“蝗虫”和“成群的蝗虫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: 在那里
  rationale: 保留指向具体地点的方位副词，表明尼尼微自以为安全之处正是灾祸临到之处。
- source_word: תֹּאכְלֵךְ ... אֵשׁ
  choice: 火必吞噬你
  rationale: אָכַל本义为“吃”，以火为主语时译作“吞噬”既自然，又保留鲜明的毁灭意象。
- source_word: תַּכְרִיתֵךְ חֶרֶב
  choice: 刀剑必剪除你
  rationale: כרת的使役形含“剪除、消灭”之意；“剪除”保留原词的切断意象，并符合庄重的审判语境。
- source_word: תֹּאכְלֵךְ כַּיָּלֶק
  choice: 必像蝗虫一样吞噬你
  rationale: 延续前面的“吞噬”，并让“刀剑”自然充当承接的主语；יֶלֶק的具体虫种或生长阶段并不确定，因此正文采用通俗的“蝗虫”。
- source_word: הִתְכַּבֵּד / הִתְכַּבְּדִי
  choice: 你尽管……增多
  rationale: כבד的反身形在此表示变得众多。“尽管”传达带有讥讽意味的命令：即使敌城大量增添人力，也逃不过毁灭。
- source_word: אַרְבֶּה
  choice: 成群的蝗虫
  rationale: אַרְבֶּה是常见的“蝗虫”一词；加上“成群的”既与前面的יֶלֶק有所区别，也呈现蝗群大量聚集的画面。
theological_decisions: []
