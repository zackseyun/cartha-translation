  text: כָּ֨ל מִבְצָרַ֔יִ/ךְ תְּאֵנִ֖ים עִם בִּכּוּרִ֑ים אִם יִנּ֕וֹעוּ וְ/נָפְל֖וּ עַל פִּ֥י אוֹכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/012.yaml
  text: All your fortresses are fig trees with first-ripe figs; if they are shaken[a], they fall into the mouth of the eater.
translation:
  language: zh_hans
  text: 你所有的堡垒都像结着初熟果子的无花果树；只要一摇，果子就落进吃的人口中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְצָרַיִךְ
  choice: 你所有的堡垒
  rationale: 该词指设防之地或坚固据点；“堡垒”具体鲜明，并保留对尼尼微的军事意象。
- source_word: תְּאֵנִים
  choice: 无花果树
  rationale: 该形式也可理解为“无花果”，但这里与堡垒构成比喻，且下文提到初熟果子和摇动，因此译作“无花果树”更连贯。
- source_word: עִם בִּכּוּרִים
  choice: 结着初熟果子的
  rationale: בִּכּוּרִים 指最先成熟的出产，此处特指早熟的无花果；这样表达自然，也避免误导为礼仪性的“初熟之物”。
- source_word: אִם
  choice: 只要
  rationale: 原词为条件连接词；语境强调这些堡垒极易陷落，“只要……就……”既保留条件关系，又传达比喻中的必然结果。
- source_word: יִנּוֹעוּ
  choice: 一摇
  rationale: נוע 可指摇动、晃动；这里主语在意象上可能关联树或果子，汉语省略受动标记可自然保留这种指向张力。
- source_word: וְנָפְלוּ
  choice: 果子就落
  rationale: 条件句后的完成式表示随即发生的结果；明确补出“果子”使中文意象清楚，也与落入口中的动作相合。
- source_word: עַל פִּי אוֹכֵל
  choice: 落进吃的人口中
  rationale: 字面为“在吃者的口上”；译作“落进吃的人口中”符合现代汉语，并凸显不费力便可取得的意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以明喻“像”自然呈现希伯来语名词并置的比较关系；分号保留前后意象与结果之间的紧密联系。未设置脚注，因为“无花果树”与上下文最协调，而中文正文已清楚呈现果树及果子的关系。
