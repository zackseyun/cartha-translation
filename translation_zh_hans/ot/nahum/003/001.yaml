  text: ה֖וֹי עִ֣יר דָּמִ֑ים כֻּלָּ֗/הּ כַּ֤חַשׁ פֶּ֨רֶק֙ מְלֵאָ֔ה לֹ֥א יָמִ֖ישׁ טָֽרֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/001.yaml
  text: Woe to the city of bloodshed[a], all of it full of lies, full of plunder[d][c][b]; prey never departs.
translation:
  language: zh_hans
  text: 祸哉，这座流人血的城[a]！全城充满谎言，满是劫掠[b]；猎物从不离去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流人血的城”原文直译为“血之城”；希伯来文“血”用复数，指一座充斥杀戮、背负血债的城。也可译作“血债累累的城”。
    reason: lexical_alternative
  - marker: b
    text: “劫掠”也可译作“抢夺”或“劫掠之物”；原词带有以暴力夺取的意味。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“猎物从不断绝”，意指这城掠夺成性，暴行持续不止。
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是兼具哀叹与宣告审判意味的感叹词；“祸哉”保留先知谴责的力度，也符合庄重的经文语体。
- source_word: עִיר דָּמִים
  choice: 流人血的城
  rationale: 原文直译为“众血之城”，是指一座以杀戮、暴行和血债为特征的城；“流人血的城”在现代汉语中清楚自然。
- source_word: כֻּלָּהּ
  choice: 全城
  rationale: 阴性单数后缀回指这座城，强调城内整体的败坏；译作“全城”比“她的全部”更符合现代汉语。
- source_word: כַּחַשׁ
  choice: 谎言
  rationale: 该词可指虚假、欺骗；“谎言”鲜明地表达先知对这城的指控。
- source_word: פֶּרֶק
  choice: 劫掠之物
  rationale: 该词涉及以暴力撕夺、抢掠及由此所得之物；译作“劫掠之物”既体现暴力取得，也与下句“猎物”的掠食意象相连。
- source_word: מְלֵאָה
  choice: 充满／满是
  rationale: 原文说明城市所处的充盈状态；汉语用两个近义表达，既保留重复强调，也避免生硬。
- source_word: לֹא יָמִישׁ
  choice: 从不离去
  rationale: 动词基本义为离开、移走，否定形式表达持续不离；“从不离去”保留其空间和持续含义。
- source_word: טָרֶף
  choice: 猎物
  rationale: 该词常指猛兽撕取的猎物；此处保留“猎物”可凸显尼尼微掠夺成性的捕食者形象。
theological_decisions:
- issue: “血”的复数形式所表达的罪责
  choice: 译为“流人血的城”，并以脚注说明其包含杀戮与血债之意
  alternative: 血债累累的城／嗜血之城
  rationale: 主文尽量贴近原文意象，不把“血债”这一解释直接写入正文，同时让现代读者能理解这是对暴力杀戮的谴责。
- issue: 末句究竟强调猎物持续存在，还是掠夺行为从不停止
  choice: 正文采用较贴近动词本义的“猎物从不离去”
  alternative: 猎物从不断绝／抢掠从不止息
  rationale: 原文以“猎物”为语法主语，动词本义是“离去”；正文保留这一结构，脚注交代其也可按持续不绝的意义理解，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“祸哉”保留宣告审判的力度；“全城充满……满是……”再现原文对整座城的集中控诉，同时使汉语节奏自然。
