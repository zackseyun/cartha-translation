base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/017.yaml
  text: Your guards are like locusts[a], and your scribes like swarms of locusts, settling on the walls on a cold day. The sun rises, and they fly away[d][c][b]; no one knows where they are.
translation:
  language: zh_hans
  text: 你的权贵[a]像蝗虫；你的官长[b]好像成群的蝗虫，在寒冷的日子栖息在围墙[c]上。太阳一出来，它们便飞走；无人知道它们去了哪里[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权贵”所译的希伯来词很罕见，也可理解为“戴冠者”、“首领”或“受分别者”。
    reason: lexical_alternative
  - marker: b
    text: “官长”也可译作“书记”、“军官”或“统帅”。
    reason: lexical_alternative
  - marker: c
    text: “围墙”也可指篱笆、围栏或圈围之处，不一定专指城墙。
    reason: lexical_alternative
  - marker: d
    text: 原文直译近于：“它／它们的所在无人知道——它们在哪里？”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְּזָרַיִךְ
  choice: 你的权贵
  rationale: 这个罕见词的确切含义有争议，可能指戴冠者、首领或受分别者。上下文将其与另一类高级官员并列；“权贵”自然表达尼尼微的上层人物，同时避免把不确定的军事职能落实为“守卫”。
- source_word: כָּאַרְבֶּה
  choice: 多如蝗虫
  rationale: 原文是集合性的比喻；“多如蝗虫”符合汉语表达，并带出人数众多的意味。
- source_word: טַפְסְרַיִךְ
  choice: 你的官长
  rationale: 这是含义有争议的借词，可指书记、官员或军事统帅。此处采用较宽泛的“官长”，适合亚述行政或军事高官的语境，并在脚注保留其他可能。
- source_word: כְּגֹב גֹּבָי
  choice: 好像成群的蝗虫
  rationale: 叠用形式强化群聚景象；“成群的蝗虫”在现代汉语中清楚自然。
- source_word: הַחוֹנִים
  choice: 栖息
  rationale: חנה基本义为扎营、停驻；用于蝗虫时，“栖息”贴合画面，又保留暂时停留之意。
- source_word: בַּגְּדֵרוֹת
  choice: 在围墙上
  rationale: 该词可指围墙、篱笆或圈围之处。“围墙”适合尼尼微受审判的城市语境，但脚注保留其较宽的词义范围。
- source_word: בְּיוֹם קָרָה
  choice: 寒冷的日子
  rationale: 直接表达低温使蝗虫聚集不动的时间背景。
- source_word: שֶׁמֶשׁ זָרְחָה
  choice: 太阳一出来
  rationale: 以汉语自然的时间结构表现太阳升起后情势立即转变，也维持诗歌画面的鲜活感。
- source_word: וְנוֹדַד
  choice: 它们便飞走
  rationale: 动词可指逃离、游移或离去；以蝗虫为意象时，“飞走”自然。原文为单数形式，可能承接集合名词，汉语按群体意象用复数代词。
- source_word: וְלֹא נוֹדַע מְקוֹמוֹ אַיָּם
  choice: 它们去了哪里，无人知道
  rationale: 原文末句近于“它／它们的所在不为人知——它们在哪里？”此译传达突然消失及下落不明，并由脚注保留原文数与句法的含混。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现权贵和官长与蝗群之间的平行关系，并以“太阳一出来……便……”表现迅速消散的反讽。罕见职衔不作过度确定的军事化解释，相关歧义均在脚注中说明。
