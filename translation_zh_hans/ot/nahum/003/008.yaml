  naturalness: 原文总体通顺、庄重。“挪亚们”是此埃及城名在中文圣经传统中可接受的音译。修订后仍保持简洁的反问与城市拟人。
  terminology: 保留“挪亚们”“尼罗河的水道”“屏障”及“海”的处理；不将“海”定译为尼罗河，以维持原文水域所指的解释空间。
  issues:
