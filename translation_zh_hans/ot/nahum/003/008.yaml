base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/008.yaml
  text: Are you better than No-amon, who sat among the Nile channels, with waters all around her, whose rampart was the sea, whose wall was from the sea?
translation:
  language: zh_hans
  text: 你比挪亚们更好吗？她坐落在尼罗河的水道之间，四面环水；海是她的屏障，她的城墙由海而来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתֵיטְבִי מִן
  choice: 你比……更强吗
  rationale: 该比较结构字面可作“你比……更好吗”，但在城邦安危与防御的语境中，译作“更强”更自然，也保留反问的力度。
- source_word: נֹא אָמוֹן
  choice: 挪亚们
  rationale: 这是埃及名城底比斯的希伯来名称，采用音译以贴近原文专名。
- source_word: הַיֹּשְׁבָה
  choice: 坐落
  rationale: 原义为“坐着、居住”，用于城市时“坐落”符合现代汉语，同时保留其安居于水道之间的图景。
- source_word: בַּיְאֹרִים
  choice: 在尼罗河的水道之间
  rationale: יְאֹרִים 可指尼罗河及其支流、水道；复数在此宜译为“尼罗河的水道”。介词所表达的地理位置用“之间”自然呈现。
- source_word: חֵיל
  choice: 屏障
  rationale: 该词可指军力、防御工事或外郭；此处与“城墙”平行，并以海水为防护，故译“屏障”，不将其过度具体化为某类工事。
- source_word: יָם
  choice: 海／海水
  rationale: 此词通常为“海”，在埃及水域语境中也可能泛指大片水域或尼罗河。正文保留“海”的原文意象，第二处依汉语表达译作“海水”。
theological_decisions:
- issue: 对挪亚们防御优势的反问
  choice: 保留直接反问，不补明审判结论
  alternative: 译成陈述，如“你并不比挪亚们更强”
  rationale: 原文用疑问形式使尼尼微与已倾覆的挪亚们形成警告性比较；保留反问可维持原有修辞与神学张力。
- issue: “海”在埃及地理中的所指
  choice: 正文保留“海／海水”意象
  alternative: 明确译为“尼罗河”或“尼罗河水”
  rationale: יָם 的具体地理指向存在解释空间；不在正文中武断消除歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“坐落”“水道”“屏障”等普通读者易懂的词呈现城市及其水域防御图景；保留原文简洁、强烈的反问结构。
