base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/004.yaml
  text: because of the many prostitutions of the prostitute[a], charming in grace, mistress of sorceries[b], who sells nations by her prostitutions and clans by her sorceries.
translation:
  language: zh_hans
  text: 都因那妓女的无数淫行——她妩媚动人[a]，惯行邪术，以淫行出卖列国，以邪术出卖各宗族[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“秀美可爱”。希伯来语形容一种具有诱惑力的魅力。
    reason: lexical_alternative
  - marker: b
    text: 或译“各家族”或“各族”。希伯来语可指范围较广的亲族群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב
  choice: 都因……无数
  rationale: מִן与רֹב在此表示原因，并强调数量众多；译文以“都因……无数”自然承接上文的审判景象。
- source_word: זְנוּנֵי / זוֹנָה
  choice: 那妓女淫行无数
  rationale: 保留“淫行／妓女”的同词根强化效果和先知性隐喻，同时避免古奥或弱化的措辞。
- source_word: טוֹבַת חֵן
  choice: 妩媚动人
  rationale: 该短语形容富有吸引力、能诱惑人的魅力，不把含义局限为外貌美丽。
- source_word: בַּעֲלַת כְּשָׁפִים
  choice: 精通邪术
  rationale: בַּעֲלַת表示以某事物为特征或掌握某事物的人；“精通邪术”在现代汉语中自然，并保留女性拟人形象的语境。
- source_word: הַמֹּכֶרֶת
  choice: 出卖
  rationale: 保留מכר的商业与剥削意象；“出卖”也适合列国和各族作为宾语。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 此处指地缘政治意义上的众国；“列国”符合先知书庄重语体。
- source_word: בִּזְנוּנֶיהָ
  choice: 以淫行
  rationale: 介词בְּ表示手段；“以”简洁地表达凭借或通过。
- source_word: וּמִשְׁפָּחוֹת
  choice: 各族
  rationale: מִשְׁפָּחוֹת可指家族、宗族或氏族群体；“各族”与“列国”形成自然平行，又不局限于核心家庭。
- source_word: בִּכְשָׁפֶיהָ
  choice: 以邪术
  rationale: 再次以“以”表达工具意义，并与前面的“邪术”保持用词一致。
theological_decisions:
- issue: 妓女与邪术意象的范围
  choice: 保留卖淫、诱惑、邪术和出卖的多重隐喻，不限定为单一类型的罪恶。
  alternative: 只解释为偶像崇拜，或只解释为政治、经济上的诱骗和剥削。
  rationale: 经文把尼尼微拟人为诱惑并辖制列国的妓女；意象可能同时涉及政治操控、文化诱惑、经济剥削和属灵败坏。译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“都因”保留本节作为上文审判景象之原因的句法关系；分号呈现妓女形象及其后续描述。脚注标记按实际词语位置分别置于“妩媚动人”和“各族”之后。
