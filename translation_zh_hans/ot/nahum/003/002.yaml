  text: The crack of the whip[a], and the rumble of the wheel[b], with galloping horse and bounding chariot!
translation:
  language: zh_hans
  text: 鞭声劈啪[a]，车轮轰鸣[b]；马疾驰，战车腾跃！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“鞭声，车轮的震响。”
    reason: lexical_alternative
  - marker: b
