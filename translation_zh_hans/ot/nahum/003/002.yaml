    reason: cultural_note
lexical_decisions:
- source_word: ק֣וֹל שׁ֔וֹט
  choice: 鞭声劈啪
  rationale: קוֹל意为“声音”，שׁוֹט意为“鞭子”。结合战车疾驰的场景，译作“鞭声劈啪”既保留听觉焦点，也以自然的现代汉语再现鞭子抽动的脆响。
- source_word: ק֖וֹל רַ֣עַשׁ אוֹפָ֑ן
  choice: 车轮轰响
  rationale: רַעַשׁ可指震动、喧响或隆隆声，אוֹפָן是“轮子”。“车轮轰响”简洁地传达沉重、嘈杂的滚动声，并与前句形成紧凑并列。
- source_word: ס֣וּס דֹּהֵ֔ר
  choice: 骏马飞驰
  rationale: סוּס是“马”，דֹּהֵר描写快速奔跑。“飞驰”自然有力；“骏马”在汉语中适合高速奔驰的战马场景，但不额外明说原文未明确表达的“战马”。
- source_word: מֶרְכָּבָ֖ה מְרַקֵּדָֽה
  choice: 战车腾跃
  rationale: מֶרְכָּבָה指战车；מְרַקֵּדָה源自“跳跃、舞动”，在此描绘战车颠簸跳动。“腾跃”保留生动动态，又避免“跳舞”在现代汉语中可能带来的欢庆意味。
