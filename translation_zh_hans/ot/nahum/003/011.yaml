  text: גַּם אַ֣תְּ תִּשְׁכְּרִ֔י תְּהִ֖י נַֽעֲלָמָ֑ה גַּם אַ֛תְּ תְּבַקְשִׁ֥י מָע֖וֹז מֵ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/011.yaml
  text: You too will become drunk[a]; you will be hidden[b]. You too will seek a refuge from the enemy.
translation:
  language: zh_hans
  text: 你也必喝醉[a]，必被隐藏起来。你也必为躲避仇敌而寻找避难所[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喝醉”在先知性的审判图像中，很可能不只指实际醉酒，也描绘遭受打击后踉跄失控的状态。
    reason: cultural_note
  - marker: b
    text: “避难所”或译“堡垒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַתְּ
  choice: 你也
  rationale: 重复的短语把尼尼微与前文的挪亚们相比，强调她也必遭遇同样的命运；“你也”自然保留这一修辞力量。
- source_word: תִּשְׁכְּרִי
  choice: 必喝醉
  rationale: שׁכר 的 Qal 未完成式通常指喝醉或醉酒；这里也可能以醉态描绘在审判下踉跄、失去抵抗力。正文保留具体意象，不将隐喻解释直接写入译文。
- source_word: תְּהִי נַעֲלָמָה
  choice: 必隐没不见
  rationale: היה 加 עלם 的被动形态表达进入隐藏、看不见的状态。“隐没不见”在现代汉语中自然，也保留究竟是被藏起、逃藏还是从视野中消失的含混性。
- source_word: תְּבַקְשִׁי
  choice: 寻找
  rationale: בקש 的 Piel 形式表示寻求、寻找或设法获得；“寻找”在此清楚自然。
- source_word: מָעוֹז
  choice: 避难所
  rationale: מָעוֹז 可指提供安全或力量之处，也可具体指堡垒。上下文强调躲避来敌，因此正文采用功能明确的“避难所”，脚注保留“堡垒”这一具体可能。
- source_word: מֵאוֹיֵב
  choice: 为躲避仇敌
  rationale: 介词 מִן 在这里最自然地表达远离威胁、寻求保护；汉语以“为躲避仇敌而”明确连接避难行为，同时不改变其基本关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”体现预言语境中的确定性；短句和“你也”的重复保留希伯来文的宣告节奏。脚注标记已按其实际说明对象放置，避免将醉酒意象与“堡垒”的词义变体错配。
