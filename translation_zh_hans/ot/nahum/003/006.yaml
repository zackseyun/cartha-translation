source:
  edition: WLC
  text: וְ/הִשְׁלַכְתִּ֥י עָלַ֛יִ/ךְ שִׁקֻּצִ֖ים וְ/נִבַּלְתִּ֑י/ךְ וְ/שַׂמְתִּ֖י/ךְ כְּ/רֹֽאִי׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/006.yaml
  text: And I will throw filth upon you[a], and treat you with contempt[b], and make you a spectacle.
translation:
  language: zh_hans
  text: 我要把污秽之物扔在你身上[a]，羞辱你，使你成为众人观看的对象[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “污秽之物”也可译作“可憎之物”或“令人厌恶之物”。这个希伯来词常指礼仪上或道德上可憎的事物；在这里也可能具体指用来公开羞辱尼尼微的肮脏废物。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“使你成为供观看之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי
  choice: 我要……扔
  rationale: 使役词干在此表示有意地投掷；“扔”是自然、直接的现代汉语，也保留动作力度。
- source_word: עָלַיִךְ
  choice: 在你身上
  rationale: 介词加阴性单数第二人称后缀表达空间方向；尼尼微在上下文中被人格化为女性，汉语无需标示语法性别。
- source_word: שִׁקֻּצִים
  choice: 污秽之物
  rationale: 该词常指可憎、令人厌恶之物；在公开羞辱的语境中，“污秽之物”既保留其厌恶色彩，也能表达被扔到身上的具体物件。
- source_word: וְנִבַּלְתִּיךְ
  choice: 羞辱你
  rationale: 此处Piel形态表示使之受辱、遭轻贱；“羞辱你”简洁地保留主动行为和名誉受损的结果。
- source_word: וְשַׂמְתִּיךְ
  choice: 使你成为
  rationale: שׂים与后面的表语结构连用，在汉语中译为“使……成为”最自然。
- source_word: כְּרֹאִי
  choice: 众人观看的对象
  rationale: 原表达字面接近“供观看之物”；此译保留公开陈列、任人观看的意思，而不把羞耻意味过度解释进正文。
theological_decisions:
- issue: 对人格化的尼尼微所使用的先知性羞辱与审判意象
  choice: 保留上帝施行审判和公开羞辱的严厉语气，同时不增加原文没有明说的性化含义。
  alternative: 采用更抽象的“把可憎之物扔在你身上，使你卑贱”，或强化为“使你成为笑柄”。
  rationale: 原文明确描写投掷可憎之物、使其受辱并成为观看对象；译文应保存这种张力，但“笑柄”等说法会额外限定旁观者的反应。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。三个并列动作以“扔在你身上—羞辱你—使你成为……”推进，保留希伯来原文的审判节奏。正文用“众人观看的对象”避免“奇观”可能带有的正面意味，也避免“笑柄”对旁观反应的过度解释。
