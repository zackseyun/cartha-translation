  text: וְ/הָיָ֤ה כָל רֹאַ֨יִ/ךְ֙ יִדּ֣וֹד מִמֵּ֔/ךְ וְ/אָמַר֙ שָׁדְּדָ֣ה נִֽינְוֵ֔ה מִ֖י יָנ֣וּד לָ֑/הּ מֵ/אַ֛יִן אֲבַקֵּ֥שׁ מְנַחֲמִ֖ים לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/007.yaml
  text: And it will happen that all who see you will shrink from you and say, ‘Nineveh is devastated; who will grieve for her? Where can I seek comforters for you?’
translation:
  language: zh_hans
  text: 凡看见你的，都必躲开你，说：“尼尼微被毁灭了！谁会为她悲伤呢？我到哪里去为你寻找安慰你的人呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִדּוֹד מִמֵּךְ
  choice: 躲开你
  rationale: 该动词在此表达因惊惧或厌弃而退避、离开的动作；“躲开”自然传达与尼尼微拉开距离之意，又不强化为仓皇逃命。
- source_word: שָׁדְּדָה
  choice: 被毁灭了
  rationale: 此处是完成式被动形态，宣告尼尼微已遭摧毁；“被毁灭了”保留被动语态和灾难已经临到的语势。
- source_word: יָנוּד לָהּ
  choice: 为她悲伤
  rationale: נוּד在此指因他人的灾祸而哀伤、表示同情；“为她悲伤”保留哀悼与同情之间的语义幅度。
- source_word: מְנַחֲמִים
  choice: 安慰你的人
  rationale: 原词为复数分词，指前来安慰的人；译文将其展开为自然的现代汉语。
theological_decisions:
- issue: 尼尼微的第二人称与第三人称交替
  choice: 保留“你—她—你”的人称转换
  alternative: 全部统一为“你”或全部统一为“她”
  rationale: 原文先直接对尼尼微说话，所引话语中又以第三人称提到她，随后再次直接称“你”；保留转换可呈现先知话语的修辞张力。
- issue: 旁观者对尼尼微的反应
  choice: 译为无人“为她悲伤”且无人安慰
  alternative: 解释为尼尼微绝对不配得到怜悯
  rationale: 经文本身强调她遭弃绝、无人同情的处境，但没有在本节中明说关于其是否配得怜悯的系统性判断，因此不加入额外神学结论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“凡……都必……”体现预告性的审判语气；引语中的两个问句保留原文的哀歌式反问和人称转换。
