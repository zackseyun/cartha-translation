base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/010.yaml
  text: Yet she too went into exile[a], into captivity; her children too were dashed to pieces at the head of every street. They cast lots for her honored men[d][c][b], and all her great men were bound in chains.
translation:
  language: zh_hans
  text: '她也被掳去，沦为俘虏；

    她的幼儿也在每一条街口[a]被摔碎。

    人们为她尊贵的人抽签；

    她所有显要的人都被锁链捆绑。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “街口”直译为“街道的头部”，可指街道入口、转角或显眼的交会处。
    reason: cultural_note
lexical_decisions:
- source_word: גַּם הִיא
  choice: 她也
  rationale: 保留 גַּם 的“也、同样”之意，并以阴性单数“她”承接上文拟人化的城。
- source_word: לַגּוֹלָה הָלְכָה בַשֶּׁבִי
  choice: 被掳到异乡，沦为俘虏
  rationale: 该短语描写被带走、流落异乡并陷入被俘状态；中文用两个相承的分句保留“流亡”与“被掳”两层意象，同时避免生硬直译为“走向流亡”。
- source_word: עֹלָלֶיהָ
  choice: 她的幼儿
  rationale: עֹלָלִים 特指年幼的孩子；“幼儿”比泛称“孩子”更准确，也符合现代中文。
- source_word: יְרֻטְּשׁוּ
  choice: 被摔碎
  rationale: 保留 רטש 所表达的残酷暴力，不以较缓和的措辞淡化原文。
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: 在每一条街口
  rationale: 字面为“在所有街道的头部”；“街口”是自然中文，可表达街道入口或显眼交会处，并以脚注保留字面意象。
- source_word: נִכְבַּדֶּיהָ
  choice: 她的尊贵人
  rationale: 该词源于“有分量、受尊重”，指有地位的人；“尊贵人”保留身份和社会声望含义，不限定为某一官爵。
- source_word: יַדּוּ גוֹרָל
  choice: 抽签
  rationale: 准确对应以签决定归属或命运的惯用表达；正文不进一步说明抽签的具体目的，以保留原文的简约和语境张力。
- source_word: גְּדוֹלֶיהָ
  choice: 她所有的大人物
  rationale: 指有权势或社会地位显赫的人；“大人物”是现代中文中自然且范围较宽的对应，不缩窄为官员或领袖。
- source_word: רֻתְּקוּ בַזִּקִּים
  choice: 被锁链捆住
  rationale: 同时表达被牢牢缚住的被动状态和 זִקִּים 所指的锁链、镣铐类拘束物。
