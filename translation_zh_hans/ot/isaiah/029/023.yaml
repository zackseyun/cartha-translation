id: ISA.29.23
reference: Isaiah 29:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י בִ֠/רְאֹת/וֹ יְלָדָ֞י/ו מַעֲשֵׂ֥ה יָדַ֛/י בְּ/קִרְבּ֖/וֹ יַקְדִּ֣ישֽׁוּ שְׁמִ֑/י וְ/הִקְדִּ֨ישׁוּ֙ אֶת קְד֣וֹשׁ יַֽעֲקֹ֔ב וְ/אֶת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל יַעֲרִֽיצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/023.yaml
  text: For when he sees his children[a], the work of my hands, in his midst, they will sanctify my name; they will sanctify the Holy One of Jacob[b], and they will stand in awe of the God of Israel.
translation:
  language: zh_hans
  text: 因为，当他看见他的儿女——我手所做的工——在他中间时，他们必尊我的名为圣；他们必尊雅各的圣者为圣，并敬畏以色列的上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “敬畏”也可译作“畏惧”或“尊崇”。原文动词包含因敬重而战兢、肃然生畏的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי בִרְאֹתוֹ
  choice: 因为，当他……看见……时
  rationale: כִּי承接上文，说明前述应许的根据；ב加不定式结构具有时间意义，因此译作“当……时”。
- source_word: יְלָדָיו
  choice: 他的儿女
  rationale: יְלָדִים在此为集合用语，可泛指后代或儿女，不必限定为男性。
- source_word: מַעֲשֵׂה יָדַי
  choice: 我双手所做的工作
  rationale: 保留希伯来文“我手的工作”这一具体意象，同时用自然的现代汉语表达其创造、塑造之意。
- source_word: בְּקִרְבּוֹ
  choice: 在自己当中
  rationale: 保留第三人称单数后缀，使其仍可指上文的族长，也可指人格化的雅各／以色列群体，不强行消除原文歧义。
- source_word: יַקְדִּישׁוּ שְׁמִי
  choice: 他们必尊我的名为圣
  rationale: 使役词形在这里表示承认、看待为圣；“尊……为圣”既自然，又保留圣洁语言。
- source_word: וְהִקְדִּישׁוּ אֶת קְדוֹשׁ יַעֲקֹב
  choice: 他们必尊雅各的圣者为圣
  rationale: 重复“尊……为圣”，再现原文两次使用קדש的修辞呼应，并保留以赛亚书中的神圣称号“雅各的圣者”。
- source_word: יַעֲרִיצוּ
  choice: 敬畏
  rationale: 该动词在此表达面对上帝时带有战兢、崇敬的畏惧；“敬畏”兼顾畏惧与尊崇。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 采用现代汉语中清楚、庄重的标准神圣称号。
theological_decisions:
- issue: 单数代词“他看见……在他当中”的所指
  choice: 正文保留单数“他／自己”，不明确指定为某一位族长或单指民族。
  alternative: 明确译为亚伯拉罕看见自己的后代，或雅各看见自己的儿女；也可明确译为人格化的雅各／以色列民族。
  rationale: 上文同时提到雅各和亚伯拉罕；这些单数代词可能呼应其中一位族长，也可能把雅各／以色列作为一个整体人格化。正文应保存这种真实歧义，脚注列出主要理解。
- issue: 两处קדש的圣化语言
  choice: 两处均译为“尊……为圣”。
  alternative: 译作“承认……是圣的”“以……为圣”或“使……成圣”。
  rationale: 这里并非人使上帝获得圣洁，而是承认并尊崇他本有的圣洁；同时应保留希伯来文两次קדש形成的重复。
- issue: 对上帝的יַעֲרִיצוּ所含情感
  choice: 译为“敬畏”。
  alternative: 译为“畏惧”“尊崇”或“肃然起敬”。
  rationale: 原词兼有畏惧、战兢与崇敬的力度；“敬畏”不把它弱化为一般尊敬，也不把它收窄为纯粹恐惧。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“尊……为圣”保留经文的圣洁主题及两处关键词重复；“在自己当中”略带希伯来语意象，但用于保存单数所指的歧义。所有脚注标记均置于正文相应位置。
