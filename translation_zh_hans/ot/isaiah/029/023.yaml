  naturalness: “在自己当中看见”不合现代汉语习惯，且“自己”引入不必要的反身意味。以破折号标示同位语，并将“在他中间”置于该名词短语后，能较自然地保留原文单数后缀及其所指歧义。
  terminology: “儿女”“我手所做的工”“尊我的名为圣／尊雅各的圣者为圣”“敬畏以色列的上帝”均恰当。两次 קדש 的对应表达应保持一致；“雅各的圣者”作为以赛亚书的神圣称号也应保留。
