revisions:
- from: 因为，当他在自己当中看见他的儿女[a]，就是我双手所做的工作时，他们必尊我的名为圣；他们必尊雅各的圣者为圣，并敬畏以色列的上帝[b]。
  to: 因为，当他看见他的儿女——我手所做的工——在他中间时，他们必尊我的名为圣；他们必尊雅各的圣者为圣，并敬畏以色列的上帝[b]。
  rationale: 修改只调整“在他中间”的中文句法位置，并相应修正脚注 a 的引文，使其既贴合希伯来文，也避免“在自己当中看见”的中文歧义。正文仍以“他／他的／在他中间”保存单数代词的未决所指；两处“尊……为圣”及其重复均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:21:35Z'
