base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/017.yaml
  text: Is it not yet a very little while[a], and Lebanon will turn into an orchard, and the orchard will be regarded as a forest?
translation:
  language: zh_hans
  text: 再过极短的一段时间，黎巴嫩岂不将变为肥沃的田地[a]，肥沃的田地也将被看作森林吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肥沃的田地”也可译作“果园”。希伯来语 כַּרְמֶל 在这里指肥沃、经过耕作的土地，并非地名“迦密”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: 岂不……吗
  rationale: 保留希伯来文反问语气，并体现其期待肯定回答的作用。原文只在句首出现一次，但其作用涵盖整句，中文以配套反问结构自然表达。
- source_word: עוֹד מְעַט מִזְעָר
  choice: 再过极短的一段时间
  rationale: 三个词共同强调时间很短；此译既表达尚需再过一点时间，也保留强化的短暂感。
- source_word: וְשָׁב
  choice: 就要变为
  rationale: 此处 שוב 表示状态转变，并非明确指恢复到先前状态；“变为”避免误导为“回归”。
- source_word: לְבָנוֹן
  choice: 黎巴嫩
  rationale: 按专有地名翻译；上下文虽可能借其著名林木形成意象，译文仍保留地名本身。
- source_word: כַּרְמֶל
  choice: 肥沃的田地
  rationale: 此处更可能是普通名词，指肥沃、可耕作的土地，而非专名“迦密”。“肥沃的田地”比“果园”覆盖的词义更宽，也能与“森林”形成土地状态的对照。
- source_word: לַיַּעַר
  choice: 森林
  rationale: יַעַר 指森林或林地；与 יֵחָשֵׁב 连用，表示被归为或视为森林。
- source_word: יֵחָשֵׁב
  choice: 被看作
  rationale: 保留 Niphal 的被动评定含义，同时使用自然、通俗的现代汉语。
theological_decisions:
- issue: 土地转变意象的性质
  choice: 按原文译为土地状况的戏剧性逆转，不限定为纯字面、纯象征或二者兼有。
  alternative: 明确解释为农业环境的实际变化，或明确解释为社会与属灵状况的象征性逆转。
  rationale: 经文本身清楚表达更新与逆转，却没有在本节限定其实现层面；保留意象可避免替原文消解先知话语的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“极短的一段时间”传达原文叠加词语所强调的迫近感；“肥沃的田地”保持农业意象的宽度，并与“森林”形成清晰对照。
