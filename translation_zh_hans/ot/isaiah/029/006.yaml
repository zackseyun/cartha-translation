base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/006.yaml
  text: From Yahweh of hosts you will be visited with thunder and with earthquake and a great noise[a], with whirlwind and storm[c][b], and with the flame of a consuming fire.
translation:
  language: zh_hans
  text: 你必受万军之雅威察访；他必以雷鸣、地震[b]和巨响[c]，以旋风、暴风，以及吞噬之火的烈焰临到你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你必受到惩罚”。希伯来语动词本义较宽，可指上帝为施恩或审判而“察访”、介入处置；本节上下文表明这里是审判。
    reason: lexical_alternative
  - marker: b
    text: “地震”也可译作“震动”或“震荡”。
    reason: lexical_alternative
  - marker: c
    text: “巨响”也可译作“宏大的声音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעִם
  choice: 受到……的
  rationale: 该介词在此标明察访的来源或施事者；结合中文被动表达，译作“受到万军之雅威的察访”，自然地传达行动来自雅威。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译上帝的专名，避免以称号替代；“万军之”保留固定神圣称谓，并不将“军”限定为地上的军队。
- source_word: תִּפָּקֵד
  choice: 你必受到……的察访
  rationale: 保留פקד所含“察访、介入处置”的宽广语义及被动形式；上下文显明这是审判性的察访，但正文不把该动词直接窄化为“惩罚”。第二人称单数所指为拟人化的亚利伊勒／耶路撒冷。
- source_word: בְּרַעַם
  choice: 伴随着雷鸣
  rationale: 介词ב在这一连串景象中表示伴随或方式；“雷鸣”自然且有庄严的声响感。
- source_word: וּבְרַעַשׁ
  choice: 地震
  rationale: רַעַשׁ可指震动或地震；在神显般的风暴景象中，“地震”具体呈现大地震荡的力量，同时以脚注保留较宽的译法。
- source_word: וְקוֹל גָּדוֹל
  choice: 和巨响
  rationale: קוֹל在没有明确说话者时可指声音或响声；“巨响”简洁地表达גָּדוֹל所强调的强烈声势，且避免误解为人的声音。
- source_word: סוּפָה וּסְעָרָה
  choice: 旋风、暴风
  rationale: 分别翻译两个相近而不完全相同的风暴词，保留诗句层层累积的猛烈气象意象。
- source_word: וְלַהַב אֵשׁ אוֹכֵלָה
  choice: 以及吞噬之火的烈焰
  rationale: “烈焰”表达לַהַב的火焰或火光，“吞噬之火”保留אֵשׁ אוֹכֵלָה的主动、毁灭性意象。
theological_decisions:
- issue: פקד所表达的神圣察访性质
  choice: 正文保留“察访”，由上下文显示其审判性质。
  alternative: 直接译作“惩罚你”或“追讨你”。
  rationale: 该动词本身可指上帝为施恩或审判而介入；本节的雷鸣、地震与烈火明确指向审判，但不宜把动词本身较宽的神学张力消除。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用神名的现代普通话音译，保留其作为以色列上帝专名的性质，而不是以称号替代。
- issue: 第二人称单数的指向
  choice: 保留“你”，不在正文补明所指。
  alternative: 译为“耶路撒冷”或“亚利伊勒”。
  rationale: 原文沿用上下文中的第二人称单数；保留代词可维持诗歌直接宣告的力量，也避免在本节内加入原文未重复的名称。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文两组“伴随着”的排比，使雷鸣、震动、风暴与烈火逐层累积；同时避免过度古雅的“眷顾”或过早明释为“刑罚”。
