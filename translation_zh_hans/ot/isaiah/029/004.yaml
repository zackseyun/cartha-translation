base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/004.yaml
  text: Then you will be brought low; from the earth you will speak[a], and from the dust your speech will be low. Your voice will be like that of a medium from the earth, and from the dust your speech will chirp.
translation:
  language: zh_hans
  text: 你必被降卑，从地上说话；你的言语必从尘土中低声传出。你的声音必像灵媒的声音，从地上传来；你的言语必从尘土中唧唧作声。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵媒”或译“亡灵”或“交鬼者”。希伯来语אוֹב与求问亡灵有关；在这里，这个词使人联想到从地下传出的微弱声音。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַלְתְּ
  choice: 你必降到低处
  rationale: שׁפל表示降低、卑微；此处阴性单数与被拟人化的城相呼应，并引出伏地、从尘土中发声的审判意象。
- source_word: מֵאֶרֶץ
  choice: 从地上／从地里
  rationale: אֶרֶץ在此可指地、地面。首处译“从地上”以表现说话者被压低在地，比较句中译“从地里传来”以自然表达仿佛地下传出的声音。
- source_word: תִּשַּׁח אִמְרָתֵךְ
  choice: 你的言语必从尘土中低声发出
  rationale: שׁוח的形式和句法较难，但语境明确指言语低沉、微弱。译作“低声发出”既保留“低”的意象，也符合现代汉语。
- source_word: כְּאוֹב
  choice: 像招魂者的声音
  rationale: אוֹב可指被求问的亡灵，也可转指交鬼、招魂的人。这里是声音的比喻，译“招魂者”保留与招魂术的词义联系，又不把被审判的城直接认定为亡灵；歧义在脚注说明。
- source_word: תְּצַפְצֵף
  choice: 唧唧作声
  rationale: צפף描写尖细、微弱如鸟鸣的声音。“唧唧作声”保留声音意象及其诡异、微弱的效果。
theological_decisions:
- issue: אוֹב在涉及招魂术的语境中如何理解
  choice: 正文译“招魂者”
  alternative: “亡灵”或“交鬼者”
  rationale: 本句用明喻描写这城从低处发出的微弱声音，并非认可招魂行为。正文保留该词与招魂者的通常关联，脚注则呈现它也可能指亡灵或交鬼者，避免消除原文的词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留“地／尘土”平行和声音逐渐微弱、诡异的诗歌意象。第二人称阴性单数按汉语惯例译作“你”，所指为被拟人化的城。
