  text: וַ/תְּהִ֨י לָ/כֶ֜ם חָז֣וּת הַ/כֹּ֗ל כְּ/דִבְרֵי֮ הַ/סֵּ֣פֶר הֶֽ/חָתוּם֒ אֲשֶֽׁר יִתְּנ֣וּ אֹת֗/וֹ אֶל יוֹדֵ֥עַ ה/ספר לֵ/אמֹ֖ר קְרָ֣א נָא זֶ֑ה וְ/אָמַר֙ לֹ֣א אוּכַ֔ל כִּ֥י חָת֖וּם הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/011.yaml
  text: And the vision of all this has become to you like the words of a sealed scroll[a], which they give to one who knows writing, saying, “Please read this,” and he says, “I cannot, because it is sealed.”
translation:
  language: zh_hans
  text: 这一切异象对你们已变得如同一卷封住的书卷中的话语；人把这书卷交给识字的人[a]，说：“请读这个。”他却说：“我不能，因为它封住了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “识字的人”直译为“懂得书卷的人”，也可译作“会读书卷的人”。
    reason: 保留 יוֹדֵעַ הַסֵּפֶר 的字面表达及其在语境中指能阅读之人的惯用意义。
lexical_decisions:
- source_word: וַתְּהִי לָכֶם
  choice: 因此……对你们来说，就像
  rationale: 结合上下文表达结果状态；中文用“因此”承接前文，并以“对你们来说”的自然句式体现 לָכֶם。
- source_word: חָזוּת הַכֹּל
  choice: 你们所见的这一切异象
  rationale: חָזוּת 指异象或先知性启示，הַכֹּל 概括前述全部内容；此译保留“异象”，并自然指回前文。
- source_word: כְּדִבְרֵי הַסֵּפֶר הֶחָתוּם
  choice: 像封住的书卷上的话
  rationale: 保留原文的明喻及“话/文字—书卷—封住”的意象；סֵפֶר 在历史语境中译作“书卷”较准确。
- source_word: יוֹדֵעַ הַסֵּפֶר
  choice: 识字的人
  rationale: 该短语直译为“懂得书卷/文字的人”，语境所指是能够阅读的人；“识字的人”是现代汉语中准确而自然的表达。
- source_word: קְרָא נָא זֶה
  choice: 请念这个
  rationale: נָא 表示礼貌请求；在把书卷交给人朗读的场景中，“请念这个”自然地表达 קְרָא。
- source_word: לֹא אוּכַל כִּי חָתוּם הוּא
  choice: 我不能，因为它封住了
  rationale: 不补出“念”或解释不能阅读的原因，保留原文简洁表达及其语境含义。
theological_decisions:
- issue: 启示无法接近的比喻
  choice: 保留封住书卷的具体意象，不解释为“无法理解上帝的话”
  alternative: 意译为“这一切启示对你们都无法理解”
  rationale: 原文借封住的书卷呈现异象不可接近的状态；保留比喻可避免把经文本身未明说的神学解释写入正文。
- issue: חָזוּת הַכֹּל 的范围
  choice: 理解为概括前述全部异象内容
  alternative: 理解为“整个异象”或“万事的异象”
  rationale: 定冠词化的 הַכֹּל 很可能回指前文整体，但措辞仍保持概括性，不进一步限定具体内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“书卷”保留古代书写载体的文化背景；“封住”比单用“封闭”更具体，也与下文重复用词相呼应。脚注标记已置于正文相关短语之后。
