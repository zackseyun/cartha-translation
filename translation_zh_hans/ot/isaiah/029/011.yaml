  to: 这一切异象对你们已变得如同一卷封住的书卷中的话语；人把这书卷交给识字的人[a]，说：“请读这个。”他却说：“我不能，因为它封住了。”
  rationale: 修订删除原文未明说的“因此”和“你们所见的”，以保留“全部异象内容”的概括性；将“书卷上的话”调整为“书卷中的话语”，并以“这书卷”明确下文被交付的对象。脚注标记移至其实际所注释的“识字的人”之后。
