  text: וַ/יֹּ֣אמֶר אֲדֹנָ֗/י יַ֚עַן כִּ֤י נִגַּשׁ֙ הָ/עָ֣ם הַ/זֶּ֔ה בְּ/פִ֤י/ו וּ/בִ/שְׂפָתָי/ו֙ כִּבְּד֔וּ/נִי וְ/לִבּ֖/וֹ רִחַ֣ק מִמֶּ֑/נִּי וַ/תְּהִ֤י יִרְאָתָ/ם֙ אֹתִ֔/י מִצְוַ֥ת אֲנָשִׁ֖ים מְלֻמָּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/013.yaml
  text: 'And the Lord said: Because this people draws near with its mouth and honors me with its lips[a], while its heart is far from me, and their fear of me has become a commandment of men that is taught[b],'
translation:
  language: zh_hans
  text: 主说：“因为这百姓用口亲近我，用嘴唇尊敬我，心却远离我；他们对我的敬畏[a]，竟成了由人传授的诫命[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”也可理解为“畏惧”“崇敬”或“敬拜”；希伯来语直译为“他们对我的惧怕／敬畏”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“学来的人的诫命”或“人所教导的诫命”。这句话责备人把本应发自内心、归向神的敬畏，变成仅由人传授的规条。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神圣称号 אֲדֹנָי，而非四字神名；译作“主”既准确，也符合先知宣告的庄重语体。
- source_word: יַעַן כִּי
  choice: 因为
  rationale: 该组合引出理由；“因为”是现代汉语中自然、清楚的因果连接语。
- source_word: נִגַּשׁ
  choice: 亲近
  rationale: 此动词表示靠近、来到近前，在敬拜语境中可有进到神面前的意味；“亲近”保留这种宗教语境，同时与后文“远离”形成鲜明对照。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留原文集合单数及先知文学的称呼方式；“百姓”在现代汉语圣经语体中庄重而易懂。
- source_word: בְּפִיו וּבִשְׂפָתָיו
  choice: 用口……用嘴唇
  rationale: 保留原文“口／嘴唇”的平行结构，凸显外在言语表现。
- source_word: כִּבְּדוּנִי
  choice: 尊敬我
  rationale: כבד 在此表示给予尊荣；“尊敬我”自然地表达言语上的尊崇，又不额外强化为“荣耀”。
- source_word: לִבּוֹ רִחַק מִמֶּנִּי
  choice: 心却远离我
  rationale: 保留“心”与外在口唇的对照，并用“却”清楚呈现转折；“远离”也与前面的“亲近”对应。
- source_word: וַתְּהִי
  choice: 竟成了
  rationale: “成了”表达原文所指的结果状态；“竟”传达此种敬畏发生扭曲的反常意味，但不增添具体教义解释。
- source_word: יִרְאָתָם אֹתִי
  choice: 他们对我的敬畏
  rationale: “敬畏”兼具惧怕与尊崇的语义，能保留 יִרְאָה 在对神语境中的幅度，不把它单纯化为恐惧或敬拜。
- source_word: מִצְוַת אֲנָשִׁים
  choice: 由人……的诫命
  rationale: אֲנָשִׁים 在这里泛指人类；汉语“人”无需使用带性别色彩的表达，并清楚保留这种诫命出于人的批判意味。
- source_word: מְלֻמָּדָה
  choice: 传授
  rationale: 该被动分词可指被教导或学来的；“由人传授”在汉语中自然地保留被教导的含义，其他可能译法列入脚注。
theological_decisions:
- issue: יִרְאָה 所指对神的态度
  choice: 对我的敬畏
  alternative: 对我的畏惧；对我的崇敬；对我的敬拜
  rationale: 原词可涵盖惧怕、尊崇及敬虔；正文采用“敬畏”以保留这些层面之间的张力，不把它限定为单纯恐惧或礼仪敬拜。
- issue: מִצְוַת אֲנָשִׁים מְלֻמָּדָה 的关系
  choice: 由人传授的诫命
  alternative: 学来的人的诫命；人所教导的诫命
  rationale: 原文可以着重诫命是由人教导的，也可理解为人所制定而被学来的规条。正文以自然汉语呈现核心批判，同时在脚注保留“教导／学来”的语义空间。
- issue: אֲנָשִׁים 的泛指性质
  choice: 人
  alternative: 世人；人的规条
  rationale: 此处重点是神圣敬畏被降为人的教导，并非强调男性；现代汉语“人”准确表达泛指意义，也不引入性别议题。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“口／嘴唇—心”及“亲近—远离”的对应得到保留，以呈现原文的诗性对照。正文避免使用过度古雅的“缘因”“训诲”，也不把“敬畏”解释性地缩减为某一种宗教行为。
