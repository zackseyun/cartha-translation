  naturalness: 首句自然庄重。第二分句宜以“得以看见”调整，使现代标准汉语通顺，同时仍维持原文具体的感官图像与诗歌性重复。
  terminology: “聋人”“盲人的眼睛”“幽暗”“黑暗”均恰当且避免不必要的诠释。“书卷中的话”可保留；脚注中的“文书上的话”改为“文书中的话”，以与原文“……的话／言语”的属格关系一致。
