- from: 到那日，聋人必听见书卷中的话[a]；盲人的眼睛必从幽暗和黑暗中看见。
  to: 到那日，聋人必听见书卷中的话[a]；盲人的眼睛必从幽暗和黑暗中得以看见。
  rationale: 仅作必要的汉语语法与搭配调整。“得以看见”使第二分句自然清楚，仍保留原文未指明看见对象的开放性，并保留“幽暗”和“黑暗”两项平行意象。脚注同步微调以准确反映“话／言语”与“文书”的关系。
