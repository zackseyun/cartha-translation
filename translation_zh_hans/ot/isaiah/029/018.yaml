base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/018.yaml
  text: And on that day the deaf will hear the words of a book[a], and out of gloom and out of darkness the eyes of the blind will see.
translation:
  language: zh_hans
  text: 到那日，聋人必听见书卷中的话[a]；盲人的眼睛必从幽暗和黑暗中得以看见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“书中的话”或“文书中的话”；希伯来语 סֵפֶר 可泛指书卷、书或书面文献。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ
  choice: 必听见
  rationale: 连词与完成式在先知性语境中表达将来必然发生之事；“必”既自然，又传达应许的确定性。
- source_word: בַיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知文学中的时间标记；“到那日”是自然、庄重的现代汉语表达。
- source_word: הַחֵרְשִׁים
  choice: 聋人
  rationale: 该形容词在此作名词使用，指耳聋的人；译法简洁且符合现代汉语。
- source_word: דִּבְרֵי סֵפֶר
  choice: 书卷中的话
  rationale: דִּבְרֵי 是“话、言语”的构造形式，סֵפֶר 可泛指书卷、书或文书。“书卷中的话”既符合古代书写语境，也不把所指限定为某一种文献。
- source_word: וּמֵאֹפֶל
  choice: 从幽暗中
  rationale: 介词 מִן 表示来源或脱离；“幽暗”保留 אֹפֶל 所描绘的朦胧、深暗状态。
- source_word: וּמֵחֹשֶׁךְ
  choice: 和黑暗中
  rationale: 与“幽暗”构成强化性的诗歌平行；分别译出两个词，避免压平希伯来文意象。
- source_word: עֵינֵי עִוְרִים
  choice: 盲人的眼睛
  rationale: 直接保留原文的构造短语及具体身体意象。
- source_word: תִּרְאֶינָה
  choice: 必……看见
  rationale: 阴性复数未完成式与“眼睛”呼应，指向将来的视觉恢复；不额外加入“重新”或“得以”，以免超出原文。
theological_decisions:
- issue: 本节的聋、盲及听见、看见应仅按身体医治理解，还是按属灵复兴理解
  choice: 保留具体的感官用语，不加解释性限定
  alternative: 明确译成属灵上的领悟、醒悟或启明
  rationale: 原文采用具体的听觉和视觉词汇，但这些意象在《以赛亚书》的语境中也可能带有比喻意义。直译核心意象可同时保留身体医治与属灵复兴两方面的可能，不替读者消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“幽暗”和“黑暗”并列，以保留希伯来诗歌的强化平行；分号呈现两组对应的医治意象。脚注标记[a]已置于正文相关词组之后。
