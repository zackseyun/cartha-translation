  terminology: 以“悟性”对应בִּינָה，保留其理解、辨识的能力含义；以“教导”对应לֶקַח，避免“教训”在现代汉语中常有惩戒意味。未将רוּחַ译为“圣灵”，也未引入特定神学解释。
