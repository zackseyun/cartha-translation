  text: וְ/יָדְע֥וּ תֹֽעֵי ר֖וּחַ בִּינָ֑ה וְ/רוֹגְנִ֖ים יִלְמְדוּ לֶֽקַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/024.yaml
  text: And those who go astray in spirit will come to understanding[b][a], and those who grumble will learn instruction.
translation:
  language: zh_hans
  text: 心思迷误的人必获得悟性；发怨言的人必学习教导。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 必明白
  rationale: 该动词本义为“知道”，与“悟性、明辨”连用时表达获得理解；译作“必明白”既保留结果与将来意味，也符合现代汉语。
- source_word: תֹעֵי רוּחַ
  choice: 心里迷失的人
  rationale: תעה表示迷路、偏离或犯错；רוּחַ在此指人的内在心思或性情。“心里迷失”保留偏离正道的意象，同时不把它限定为对圣灵的特定陈述。
- source_word: בִּינָה
  choice: 事理
  rationale: 该词指悟性、理解力或明辨；在“明白事理”这一自然搭配中，表达获得正确认识和判断。
- source_word: וְרוֹגְנִים
  choice: 发怨言的人
  rationale: רגן指抱怨、埋怨或嘟囔。“发怨言的人”准确体现其抵触和不满的态度，且庄重易懂。
- source_word: יִלְמְדוּ
  choice: 必领受
  rationale: למד通常意为学习；与לֶקַח连用时，重点在接受、学得教导。“必领受”使中文搭配自然，并保留将来的确定语气。
- source_word: לֶקַח
  choice: 教诲
  rationale: 该词指所接受的教导、训诲。“教诲”适合智慧传统的语境，比“课程”庄重，又不加入原文没有的具体内容。
theological_decisions:
- issue: תֹעֵי רוּחַ中רוּחַ的含义
  choice: 理解为人的内在心思或性情，译作“心里”
  alternative: 理解为“受风吹而迷失”，或特指人在圣灵方面的错误
  rationale: 上下文描述原先迷失、抱怨之人的认识与态度得到更新。采用人类内在状态的含义最合语境，同时避免引入原文未明确要求的圣灵论解释。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“心里迷失”保留希伯来文的动态意象；“明白事理”与“领受教诲”形成自然平行。原文意义在中文正文中可充分表达，因此不另设脚注。
