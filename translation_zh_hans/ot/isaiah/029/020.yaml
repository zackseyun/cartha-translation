base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/020.yaml
  text: For the ruthless one will come to nothing[a], the scoffer will be finished[b], and all who watch for wrongdoing will be cut off.
translation:
  language: zh_hans
  text: 因为强暴的人必归于无有[a]，嘲讽者必不复存在，所有伺机作恶[b]的人都必被剪除。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强暴的人”也可译作“暴君”或“凶暴的人”。希伯来语 עָרִיץ 指凶暴、残酷或压迫他人的人。
    reason: lexical_alternative
  - marker: b
    text: “伺机作恶的人”也可译作“专心作恶的人”或“守候着要行不义的人”。希伯来语分词 שֹׁקְדֵי 表示警醒、持续而刻意地留意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的应许说明根据；现代汉语用“因为”自然清楚。
- source_word: אָפֵס
  choice: 必归于无有
  rationale: 表达终止、不复存在的意思，并保留原文带有结果意味的强烈措辞。
- source_word: עָרִיץ
  choice: 强暴的人
  rationale: 该词指凶暴、压迫他人的人；“强暴的人”既保留暴力与压迫色彩，也不把含义限于政治统治者。
- source_word: וְכָלָה
  choice: 必不复存在
  rationale: 表达终结、消失；与前句形成平行，同时避免把原词过度具体化为某一种毁灭方式。
- source_word: לֵץ
  choice: 嘲讽者
  rationale: 指以傲慢轻蔑态度讥诮的人；“嘲讽者”是现代汉语中清楚而庄重的表达。
- source_word: וְנִכְרְתוּ
  choice: 都必被剪除
  rationale: 保留כרת被动式“被剪除”的审判性意象，不将其直接窄化为“杀灭”。
- source_word: כָּל
  choice: 所有
  rationale: 准确表达原文涵盖全体的意思。
- source_word: שֹׁקְדֵי
  choice: 伺机
  rationale: 该分词含警醒注视、专心等待之意；在此与恶事连用，“伺机”自然传达蓄意寻找机会的意味。
- source_word: אָוֶן
  choice: 作恶
  rationale: 此处指罪恶、不义之事；与שֹׁקְדֵי合译为“伺机作恶”，符合现代汉语习惯，并保留道德含义。
