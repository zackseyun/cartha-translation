source:
  edition: WLC
  text: מַחֲטִיאֵ֤י אָדָם֙ בְּ/דָבָ֔ר וְ/לַ/מּוֹכִ֥יחַ בַּ/שַּׁ֖עַר יְקֹשׁ֑וּ/ן וַ/יַּטּ֥וּ בַ/תֹּ֖הוּ צַדִּֽיק׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/021.yaml
  text: those who make a man an offender by a word[a], and lay a snare for the one who reproves in the gate[c][b], and turn aside the righteous with emptiness.
translation:
  language: zh_hans
  text: 那些凭一句话定人有罪的[a]，在城门口给责备者设圈套[b]，又以虚妄的理由屈枉义人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因一句话定人有罪”，又或“用一句话使人犯罪”。希伯来语既可有司法上的定罪之意，也可有使人犯罪之意；本节的审判语境较支持前者。
    reason: lexical_alternative
  - marker: b
    text: “城门口”是古代公开议事和审判案件的地方。“责备者”也可指提出指正或在诉讼中申辩的人。
    reason: cultural_note
  - marker: c
    text: 或译：“无缘无故屈枉义人”，或“以虚空之事使义人得不到公正”。原文可指用毫无实质的根据扭曲正义。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲטִיאֵי
  choice: 定……有罪
  rationale: 这是חטא的使役分词，既可指“使人犯罪”，也可指“判定有罪”。本节连续出现城门口、设圈套和屈枉义人等司法意象，因此正文采用司法含义，同时用脚注保留使役含义。
- source_word: אָדָם
  choice: 人
  rationale: 此处为单数泛指，现代汉语用“人”自然地涵盖泛指的个人，不必增添性别限定。
- source_word: בְּדָבָר
  choice: 凭一句话
  rationale: דבר可指话、事情或案件；“凭一句话”保留原文的简洁和可能指言词、指控的含义，也显出定罪根据薄弱。
- source_word: לַמּוֹכִיחַ
  choice: 责备人的
  rationale: יכח的分词可指责备、纠正或在诉讼中申辩。正文采用范围较宽的“责备人的”，脚注说明其司法可能性。
- source_word: בַּשַּׁעַר
  choice: 在城门口
  rationale: 古代城门口是公共议事和审判之处；译出“城”使现代读者不会误解为普通住宅门口。
- source_word: יְקֹשׁוּן
  choice: 设下圈套
  rationale: 准确保留原词“布置网罗、陷阱”的恶意诱捕比喻，又符合现代汉语表达。
- source_word: וַיַּטּוּ
  choice: 屈枉
  rationale: נטה在司法语境可表示使案件偏离公正；“屈枉义人”简洁呈现不公审判，同时避免机械直译为“使……转离”。
- source_word: בַּתֹּהוּ
  choice: 以虚妄的理由
  rationale: תֹהוּ可指虚空、虚妄、无实质之物。结合司法语境，“虚妄的理由”说明手段或依据，却不强行限定为某一种具体虚假指控。
- source_word: צַדִּיק
  choice: 义人
  rationale: צדיק兼有道德上的正直与司法上的无辜、理应获判为正之意；“义人”保留这两层常见圣经含义。
theological_decisions:
- issue: מַחֲטִיאֵי的司法含义与使人犯罪含义
  choice: 正文译为“定人有罪”
  alternative: “使人犯罪”
  rationale: 城门审判、设圈套及屈枉义人的并列语境较支持司法理解，但原词的使役歧义仍在脚注中明确保留。
- issue: וַיַּטּוּ בַתֹּהוּ צַדִּיק的具体关系
  choice: “以虚妄的理由屈枉义人”
  alternative: “使义人偏离正道”或“无缘无故排斥义人”
  rationale: 司法语境支持“屈枉”，而介词短语可能表示凭虚妄之事、以空洞理由或毫无根据；脚注保留这些可能性，不把经文收窄成单一教义判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。整体保留三项并列罪行及司法场景；“定人有罪”“屈枉义人”清楚传达法律语境，“城门口”辅以文化脚注。“虚妄的理由”比直译“以虚空”更自然，同时由脚注保留原词的意象与歧义。
