  yaml_path: translation/ot/isaiah/029/002.yaml
  text: And I will distress Ariel[a], and there will be mourning and lamentation, and she will be to me like an altar hearth.
translation:
  language: zh_hans
  text: 我必使亚利伊勒[a]受困；她必有哀号和悲叹；她对我必如祭坛的炉台。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚利伊勒”是希伯来语 אֲרִיאֵל 的音译，这里很可能有双关：名叫“亚利伊勒”的城将变得如同“祭坛的炉台”。末句也可按形式对应译作：“她对我必如亚利伊勒。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲצִיקוֹתִי
  choice: 我必使……受困
  rationale: 该词的使役形表达施加压力、困苦或压迫；“使……受困”既保留广义的困迫，也与下文围城语境相合，而不把本节过度限定为军事行动。
- source_word: לַאֲרִיאֵל
  choice: 亚利伊勒
  rationale: 此处在上下文中是耶路撒冷的称号，按专名音译；其可能含有“祭坛火炉”的意义，并与句末同词构成双关。
- source_word: תַאֲנִיָּה וַאֲנִיָּה
  choice: 哀哭和悲叹
  rationale: 两个近义名词叠用，加强悲哀之意；译文保留两项并列及可闻的哀悼色彩。
- source_word: וְהָיְתָה לִּי
  choice: 她对我来说，必……
  rationale: 阴性单数很可能回指作为城市的亚利伊勒；用“她”保留希伯来文对城市的拟人表达。
- source_word: כַאֲרִיאֵל
  choice: 如祭坛的火炉
  rationale: 第二个 אֲרִיאֵל 很可能取该词的普通名词义，以此显出双关和献祭意象；中文用释义呈现其先知性反讽。
theological_decisions:
- issue: 重复出现的 אֲרִיאֵל 如何保留双关
  choice: 第一次音译为城市称号“亚利伊勒”，第二次译作“祭坛的火炉”
  alternative: 两处都音译为“亚利伊勒”
  rationale: 上下文表明第一次是耶路撒冷的称号，而句末很可能借该称号的词义形成双关。这样处理能传达双关的主要作用，同时用脚注保留更形式对应的另一种译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受困”保留困迫与围困之间的语义空间；“哀哭和悲叹”保留诗句的近义叠加；脚注明示名称与祭坛意象之间的双关及形式直译的可能性。
