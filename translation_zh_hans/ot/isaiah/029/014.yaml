source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֥י יוֹסִ֛ף לְ/הַפְלִ֥יא אֶת הָֽ/עָם הַ/זֶּ֖ה הַפְלֵ֣א וָ/פֶ֑לֶא וְ/אָֽבְדָה֙ חָכְמַ֣ת חֲכָמָ֔י/ו וּ/בִינַ֥ת נְבֹנָ֖י/ו תִּסְתַּתָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/014.yaml
  text: Therefore[a], behold, I will again do something astonishing with this people—something astonishing and marvelous; and the wisdom of its wise men will perish, and the understanding of its discerning men will hide itself.
translation:
  language: zh_hans
  text: 因此，看哪，我要再向这百姓施行奇事，奇事又奇事[a]；其中智慧人的智慧必消亡，明达人的聪明必隐藏起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“我要再奇妙地对待这百姓，奇妙再加奇妙。”
    reason: 原文连续使用 פלא 词根，既可理解为施行令人惊奇的事，也可更贴近字面地表达为以奇妙的方式对待百姓；重复结构具有加强语气的作用。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 表明本节是对上文指责所得出的后果；“因此”自然、庄重，并保留推论关系。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留先知话语中郑重唤起注意的功能，“我”则明确原文第一人称。
- source_word: יוֹסִף לְהַפְלִיא
  choice: 要再……施行奇事
  rationale: יסף接不定式可表示再次或继续采取行动；这里译作“再”，而“施行奇事”传达פלא使役式所指的非凡作为。
- source_word: אֶת הָעָם הַזֶּה
  choice: 向这百姓
  rationale: “这百姓”保留先知语体中的单数集合称谓；介词“向”自然表达该行动以百姓为对象，同时不预先限定其具体方式。
- source_word: הַפְלֵא וָפֶלֶא
  choice: 奇事又奇事
  rationale: 保留פלא词根的强调性重复及简洁有力的修辞，避免把这非凡作为预先解释为单纯的恩典或灾祸。
- source_word: וְאָבְדָה
  choice: 必消亡
  rationale: 先知语境中的完成式表达将来的确定结果；“消亡”保留其强烈的丧失、归于无有之意。
- source_word: חָכְמַת חֲכָמָיו
  choice: 他们智慧人的智慧
  rationale: 保留原文同词根式的重复；集合名词“百姓”的单数后缀在现代汉语中自然译为“他们”。
- source_word: וּבִינַת נְבֹנָיו
  choice: 明达人的聪明
  rationale: 用“明达的人”表达נבון所指有辨识力者，并以“聪明”表达בינה，与前句形成平行而不完全重叠。
- source_word: תִּסְתַּתָּר
  choice: 必隐藏起来
  rationale: 保留该动词的反身或被动意味，让“聪明”作为主语隐去，而不增添是谁使其隐藏的解释。
theological_decisions:
- issue: פלא重复所表达的神圣行动
  choice: 奇事又奇事
  alternative: 奇妙无比的事／奇上加奇
  rationale: 上下文表明这是上帝针对百姓的非凡行动，但本短语自身兼有令人惊异与奇妙的语义色彩。重复译法保留修辞力度，也不把它单向解释为赐福或刑罚。
- issue: 智慧者和明达者的性别表达
  choice: 智慧人／明达人
  alternative: 智慧男子／有智慧和辨识力的人
  rationale: 希伯来语使用阳性复数，但此处重点在社会角色或群体特征。汉语“智慧人”“明达人”可忠实表达所指群体，不必额外突出原文语法性别，也没有将范围明确扩大或缩小。
- issue: “聪明必隐藏”的施事者
  choice: 保留反身表达“必隐藏起来”
  alternative: 必被隐藏／必不再显露
  rationale: 原文形式容许反身或被动理解；不明说由谁隐藏，可保留原文的含混和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语体。“看哪”保留经文宣告的郑重感；分号呈现希伯来诗句从上帝行动转向智慧消亡之结果的结构。
