base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/015.yaml
  text: Woe to those who go deep to hide counsel from Yahweh[a], whose deeds are in darkness, and who say, “Who sees us[b], and who knows us?”
translation:
  language: zh_hans
  text: 那些深藏谋略、企图瞒过雅威的人有祸了！[a]他们的作为在黑暗中；他们说：“谁看得见我们？谁知道我们呢？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似：“那些深深隐藏谋略、要瞒过雅威的人有祸了。”这里“深深”描绘他们极力秘密筹划。
    reason: alternative_reading
  - marker: b
    text: “知道我们”在这里含有察知他们及其所作所为的意思；原文仍保留简短的“知道我们”。
    reason: semantic_clarification
lexical_decisions:
- source_word: הוֹי
  choice: 有祸了
  rationale: 这是先知宣告谴责与审判的感叹语；“有祸了”既保留警告力度，也符合现代汉语圣经语体。
- source_word: הַמַּעֲמִיקִים
  choice: 把……藏得很深
  rationale: 保留“使之深、深入”的意象，同时按本节语境自然表达极力隐蔽的行动。
- source_word: מֵיהוָה לַסְתִּר עֵצָה
  choice: 把谋略藏得很深、想瞒过雅威
  rationale: 介词 מִן 表明他们企图不让雅威察知；עֵצָה 在这里指经过筹划的谋略。“想瞒过”表达企图而不暗示他们真能成功。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现希伯来文的神圣名字，而不是用称号替代。
- source_word: בְמַחְשָׁךְ
  choice: 在黑暗中
  rationale: 保留原文具体的黑暗意象，并让其秘密行事和道德隐晦的含义由语境呈现。
- source_word: מַעֲשֵׂיהֶם
  choice: 他们……行事
  rationale: 用自然汉语表达“他们的行为/作为”，同时保留行动层面的含义。
- source_word: מִי רֹאֵנוּ וּמִי יוֹדְעֵנוּ
  choice: 谁看得见我们？谁知道我们呢？
  rationale: 保持原文简短、并列的反问和“看见—知道”的递进，不把“知道”的具体对象过度明说。
theological_decisions:
- issue: 神圣名字 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”可将名字与一般称号区分，并避免加入宗派性解释。
- issue: 人能否真正向神隐藏谋略
  choice: 用“想瞒过”表达其企图
  alternative: “瞒过雅威”
  rationale: 原文谴责他们试图隐藏，并不肯定他们确实能逃过神的察知；加入意愿色彩可避免造成这种神学误读。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“把谋略藏得很深”保留原文的深度意象；“在黑暗中”保留先知诗歌的具体比喻。反问句维持简洁，不替原文补足过多解释。
