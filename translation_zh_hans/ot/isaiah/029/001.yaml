base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/001.yaml
  text: Ah[a], Ariel, Ariel, the city where David encamped! Add year to year; let the feasts run their round.
translation:
  language: zh_hans
  text: 唉，亚利伊勒[a]，亚利伊勒！大卫安营的城啊！一年复一年地增添吧；让节期照常循环吧！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚利伊勒”在这里是耶路撒冷的称呼；这个希伯来词也可能使人联想到“祭坛炉台”或“上帝之狮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 唉
  rationale: 该感叹词可表达哀叹、警告或引人注意。此处既有哀叹又含威胁意味；“唉”保留宽泛的感叹语气，不预先收窄为单纯的“祸哉”。
- source_word: אֲרִיאֵל
  choice: 亚利伊勒
  rationale: 此处用作耶路撒冷的称呼，并由“大卫安营的城”加以说明。音译可保留其名称功能以及可能涉及“祭坛炉台”或“上帝之狮”的文字游戏。
- source_word: קִרְיַת חָנָה דָוִד
  choice: 大卫安营的城
  rationale: חנה通常指扎营、安营；这一表达保留了与大卫及耶路撒冷相关的历史和军事色彩，同时符合现代汉语。
- source_word: סְפוּ שָׁנָה עַל שָׁנָה
  choice: 任凭一年又添一年
  rationale: סְפוּ是复数命令式，字面意为“加添”；结合语境带有反讽式放任意味。“一年又添一年”保留时间不断累加的简洁重复感。
- source_word: חַגִּים
  choice: 节期
  rationale: 指以色列按年举行的宗教节庆。“节期”既体现礼仪背景，也为现代中文读者熟悉。
- source_word: יִנְקֹפוּ
  choice: 周而复始
  rationale: 该动词可表示环绕、循环或完成一轮。用于每年节期时，“周而复始”自然表达周期反复，又不限定具体举行方式。
theological_decisions:
- issue: אֲרִיאֵל应按含义翻译还是保留为名称
  choice: 正文音译为“亚利伊勒”，脚注说明它在此指耶路撒冷，并保留可能的词义联想。
  alternative: 译作“祭坛炉台”或“上帝之狮”。
  rationale: 紧接的同位描述表明其所指是耶路撒冷，重复形式也显示它在呼语中充当名称。音译能保留先知话语中的多义性，不把文字游戏固定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“唉”保留开篇感叹的开放语气；“任凭……吧”体现命令式可能具有的反讽放任色彩；“周而复始”自然呈现节期逐年循环。
