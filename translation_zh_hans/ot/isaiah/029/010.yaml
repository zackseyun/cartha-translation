id: ISA.29.10
reference: Isaiah 29:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי נָסַ֨ךְ עֲלֵי/כֶ֤ם יְהוָה֙ ר֣וּחַ תַּרְדֵּמָ֔ה וַ/יְעַצֵּ֖ם אֶת עֵֽינֵי/כֶ֑ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת רָאשֵׁי/כֶ֥ם הַ/חֹזִ֖ים כִּסָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/010.yaml
  text: For Yahweh has poured out on you a spirit of deep sleep[b][a], and has shut your eyes—the prophets—and covered your heads—the seers.
translation:
  language: zh_hans
  text: 因为耶和华把沉睡之灵[a]浇灌在你们身上，封闭了你们的眼睛——就是先知，又遮盖了你们的头——就是先见。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沉睡之灵”也可译作“昏沉之灵”；这里的希伯来词可指深睡，也可指使人麻木迟钝的昏沉状态。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语句法较可能是把“先知”与“你们的眼睛”、“先见”与“你们的头”分别视为同位语；也有人理解为不同的受词，例如：“他封闭了先知，又遮盖了你们的头，就是先见。”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明其原因，保留希伯来语的解释性连接。
- source_word: נָסַךְ
  choice: 浇灌
  rationale: 保留原文倾倒、浇出的具体意象，也自然表达这状态临到众人。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中最通行、庄重的神名译法。
- source_word: רוּחַ תַּרְדֵּמָה
  choice: 沉睡之灵
  rationale: רוּחַ在此指一种临到人的内在状态；תַּרְדֵּמָה表示深沉的睡眠，也可含昏沉麻木之意。
- source_word: וַיְעַצֵּם אֶת עֵינֵיכֶם
  choice: 封闭了你们的眼睛
  rationale: 保留闭合眼睛的具体比喻，不直接释作使人失明。
- source_word: אֶת הַנְּבִיאִים
  choice: 就是先知
  rationale: 按较可能的同位语句法，把先知解释为你们的眼睛。
- source_word: רָאשֵׁיכֶם
  choice: 你们的头
  rationale: 保留原文与眼睛相平行的身体意象，不提前解释为领袖。
- source_word: הַחֹזִים
  choice: 先见
  rationale: 这是与先知相区别的传统预言职分用语，中文简洁且准确。
- source_word: כִּסָּה
  choice: 遮盖了
  rationale: 直接保留覆盖的意象，并与封闭眼睛形成平行。
theological_decisions:
- issue: 审判性刚硬中的神圣主动性
  choice: 直译为耶和华浇灌、封闭并遮盖
  alternative: 弱化为耶和华容许沉睡临到他们
  rationale: 原文明确以耶和华为这些动作的施事者；译文保留这一神学张力，不改写成单纯许可。
- issue: 先知、先见与眼睛、头的句法关系
  choice: 将先知和先见视为同位说明
  alternative: 将先知视为另一个受封闭的宾语，并把先见与头作其他方式连接
  rationale: 同位语读法较好地呈现原文的平行结构：先知是百姓的眼睛，先见是百姓的头；但原句句法困难，脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“浇灌”“封闭”“遮盖”保留原文连续而强烈的审判意象；破折号后的“就是”使困难的同位结构在中文中清楚可读。所有脚注标记均置于正文中。
