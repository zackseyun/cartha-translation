base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/005.yaml
  text: But the multitude of your strangers shall become like fine dust[a], and the multitude of the ruthless like passing chaff; and it shall happen suddenly[b], in an instant.
translation:
  language: zh_hans
  text: 然而，你众多的外族人[a]必如细尘，众多残暴之徒必如飞逝的糠秕[b]；这事必在顷刻之间突然发生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外人”。原词可指陌生人或外来的异族人；在本段语境中，他们是敌对的入侵者。
    reason: lexical_alternative
  - marker: b
    text: 也可译“如转瞬消散的糠秕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 必如／必……发生
  rationale: 该词在本节出现两次。第一次连接两个比喻性表语，汉语以“必如”自然表达其状态或转变；末句则指事件发生，译作“必……发生”。
- source_word: כְּאָבָק דַּק
  choice: 如细尘
  rationale: אָבָק意为“尘土”，דַּק强调细小；“细尘”既简洁自然，也保留容易被吹散的意象。
- source_word: הֲמוֹן
  choice: 众多
  rationale: 该词表示大量的人或喧嚷的群体。此处用“众多”分别修饰两类人，避免把原文未明确说明的军事含义译入正文。
- source_word: זָרָיִךְ
  choice: 你那里……的外族人
  rationale: 该词指陌生人、外人或外族人；语境表明他们是敌对的外来者。“外族人”保留其外来身份，而不直接释作“敌人”。
- source_word: וּכְמֹץ עֹבֵר
  choice: 如飞逝的糠秕
  rationale: מֹץ是脱粒后轻飘的糠秕，עֹבֵר表示经过、逝去。“飞逝的糠秕”保留其被风带走、迅速消失的动态画面。
- source_word: עָרִיצִים
  choice: 残暴之徒
  rationale: 该词常指强暴、冷酷的压迫者。“残暴之徒”保留其道德含义，又符合现代庄重汉语。
- source_word: לְפֶתַע פִּתְאֹם
  choice: 在顷刻之间突然
  rationale: 两个近义副词叠用，强化事情来得迅疾而出人意料；译文同时保留“顷刻”与“突然”，不削弱原文强调。
