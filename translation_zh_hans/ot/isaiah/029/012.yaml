  text: וְ/נִתַּ֣ן הַ/סֵּ֗פֶר עַל֩ אֲשֶׁ֨ר לֹֽא יָדַ֥ע סֵ֛פֶר לֵ/אמֹ֖ר קְרָ֣א נָא זֶ֑ה וְ/אָמַ֕ר לֹ֥א יָדַ֖עְתִּי סֵֽפֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/012.yaml
  text: And the book is given to one who does not know writing, saying, “Please read this,” and he says, “I do not know writing.”
translation:
  language: zh_hans
  text: 又有人把书卷递给不识字的人，说：“请你念一念这个。”他却说：“我不识字。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: 书卷
  rationale: 在古代语境中指成卷的文书；“书卷”比现代装订书意义的“书”更贴切，并与上下文相称。
- source_word: לֹא יָדַע סֵפֶר
  choice: 不识字
  rationale: 字面近于“不懂书写／文字”，实际是指不具备读写能力。“不识字”是现代汉语最自然、简洁的对应，也保留原文前后重复。
- source_word: קְרָא נָא זֶה
  choice: 请你念一念这个
  rationale: קרא在此指把书卷上的文字读出来；“念一念”自然体现出声阅读，נָא以“请”表达。
- source_word: וְנִתַּן
  choice: 又有人把……递给
  rationale: 希伯来语是无人称被动“又被交给”；汉语采用泛指主动句更自然，同时不指定具体递交者。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的表达。“不识字”准确传达不具读写能力，并避免生硬直译成“不懂书写”。引语保持原文简短重复的修辞效果。
