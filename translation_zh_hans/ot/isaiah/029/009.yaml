base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/009.yaml
  text: Be stunned and be astonished[a]; blind yourselves and be blind. They are drunk, but not with wine; they stagger[b], but not from strong drink.
translation:
  language: zh_hans
  text: 你们尽管迟疑吧，尽管惊愕吧[a]！尽管蒙蔽自己，变得盲目吧[b]！他们醉了，却不是因酒；他们东倒西歪，却不是因烈酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们尽管惊愕吧，尽管惊奇吧。”前两个命令式既可表示迟延、踌躇，也可表示因困惑而怔住、惊愕。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你们尽管昏蒙吧，尽管眼瞎吧。”这里两个希伯来语动词罕见且含义不易确定，可表达蒙蔽、眼瞎或神志麻木；第一个动词也可能带有“使自己”如此的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְמַהְמְהוּ
  choice: 迟疑惊愕
  rationale: 该反身式复数命令形可表示迟延、踌躇，也可指因困惑而怔住；结合与“惊愕”的诗歌平行关系，译为“迟疑惊愕”以兼顾两层意味。
- source_word: וּתְמָהוּ
  choice: 惊愕
  rationale: 该动词表示诧异、惊骇或惊愕；“惊愕”保留了命令语气的力度，并与前一动词形成紧密平行。
- source_word: הִשְׁתַּעַשְׁעוּ וָשֹׁעוּ
  choice: 目眩眼瞎
  rationale: 这对罕见且释义困难的动词在此通常属于眼瞎、目眩或神志昏蒙的语义范围。“目眩眼瞎”保持诗句的凝练和平行结构，也避免误取“自娱”之义。
- source_word: שָׁכְרוּ
  choice: 他们醉了
  rationale: 完成式第三人称复数在连续命令之后生动描述其状态；“醉了”自然表达已经陷入醉态的结果。
- source_word: וְלֹא יַיִן
  choice: 却不是因酒
  rationale: 否定名词短语指出这种醉态并非由葡萄酒造成，从而保留原文的反常醉酒意象。
- source_word: נָעוּ
  choice: 他们东倒西歪
  rationale: 该动词表示摇晃、蹒跚或踉跄；“东倒西歪”是现代汉语中形象自然的说法，与醉态意象相称。
- source_word: וְלֹא שֵׁכָר
  choice: 却不是因烈酒
  rationale: שֵׁכָר 指葡萄酒之外可使人醉的酒类；“烈酒”简明地区别于前面的“酒”，且为普通读者所熟悉。
theological_decisions:
- issue: 醉态与眼瞎意象的性质
  choice: 保留原文对非酒精所致醉态和眼瞎昏蒙的隐喻表达，不在正文中明说其属灵或审判性质。
  alternative: 在正文中解释为“属灵昏睡”“神使他们刚硬”，或按字面酒醉理解。
  rationale: 本节用“不是因酒”和“不是因烈酒”明确排除普通醉酒，却未在本句直接说明成因。译文应保留其神学张力，由上下文阐明，而不预先加入解释。
translation_notes:
  register: 采用现代、庄重而直接的先知性语气。“尽管”体现命令在语境中带有挑战或讽刺意味；前半句保留成对命令，后半句转为第三人称状态描写。正文所有脚注标记均已对应出现。
