base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/022.yaml
  text: 'Therefore thus says Yahweh to the house of Jacob[a], he who redeemed Abraham: Jacob will no longer be ashamed[b], and his face will no longer grow pale.'
translation:
  language: zh_hans
  text: 因此，雅威——救赎亚伯拉罕的那一位——论到雅各家如此说：“雅各必不再羞愧；他的面色也必不再变白。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 保留与上文之间明确的推论关系，同时符合现代汉语表达。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知话语中惯用的使者宣告格式，庄重而简洁。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，不以称号替代其专名。
- source_word: אֶל בֵּית יַעֲקֹב
  choice: 对雅各家
  rationale: “家”保留该词所指的家族、后裔和群体性圣约身份。
- source_word: אֲשֶׁר פָּדָה אֶת אַבְרָהָם
  choice: 他曾救赎亚伯拉罕
  rationale: פדה译为“救赎”，保留从困境或权势下赎回、解救的内涵；“曾”体现这项行动是当前应许的历史根据。
- source_word: לֹא עַתָּה
  choice: 不再
  rationale: 结合上下文表达处境的转变；比机械直译“现在不”更符合现代汉语，同时避免额外规定具体起点。
- source_word: יֵבוֹשׁ
  choice: 羞愧
  rationale: 直接表达בוש的羞耻、受辱含义，同时不明确加入外在施事者。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 保留原文重复使用的族长名；此处以雅各代表其后裔群体。
- source_word: פָּנָיו
  choice: 他的脸
  rationale: 保留原文具体而具身体感的面容意象。
- source_word: יֶחֱוָרוּ
  choice: 变得苍白
  rationale: 保留该动词“发白、变白”的动态含义，以及因羞耻或惊惶而面色苍白的形象。
theological_decisions:
- issue: “救赎亚伯拉罕”的关系从句所指
  choice: 将“他”理解为雅威，即雅威是救赎亚伯拉罕的那一位。
  alternative: 将关系从句在句法上与邻近的“雅各家”相连。
  rationale: 从句紧随“雅各家”，表面语序存在张力；但其单数动作和语义最自然地描述雅威，并以他过去对亚伯拉罕的救赎作为如今向雅各家应许的根据。正文用破折号保留原句的插入感，脚注说明所指。
- issue: 两次לֹא עַתָּה的时间含义
  choice: 译为两次“不再”，表达羞辱处境的终止。
  alternative: 直译为“现在不”或“如今不”。
  rationale: 上下文中的应许指向处境逆转；“不再”在现代汉语中最自然，但不添加“永远”等原文没有的绝对限定。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“如此说”保留先知宣告的正式语体；破折号使插入的关系从句清楚可读，又不完全抹平希伯来语序的张力。两个“不再”形成与原文相称的平行结构。
