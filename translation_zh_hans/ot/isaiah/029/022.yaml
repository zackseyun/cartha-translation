  to: 因此，雅威——救赎亚伯拉罕的那一位——论到雅各家如此说：“雅各必不再羞愧；他的面色也必不再变白。”
  rationale: 将关系从句改为“雅威——救赎亚伯拉罕的那一位——”这一同位语式结构，既明确采用原文最自然的所指，也在脚注保留其紧邻“雅各家”的句法张力。以“面色……变白”替代“脸……变得苍白”，使现代汉语更自然，同时保留原文的动态面色意象。
