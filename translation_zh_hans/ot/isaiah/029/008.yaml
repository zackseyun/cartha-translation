source:
  edition: WLC
  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ יַחֲלֹ֨ם הָ/רָעֵ֜ב וְ/הִנֵּ֣ה אוֹכֵ֗ל וְ/הֵקִיץ֮ וְ/רֵיקָ֣ה נַפְשׁ/וֹ֒ וְ/כַ/אֲשֶׁ֨ר יַחֲלֹ֤ם הַ/צָּמֵא֙ וְ/הִנֵּ֣ה שֹׁתֶ֔ה וְ/הֵקִיץ֙ וְ/הִנֵּ֣ה עָיֵ֔ף וְ/נַפְשׁ֖/וֹ שׁוֹקֵקָ֑ה כֵּ֣ן יִֽהְיֶ֗ה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל הַ֥ר צִיּֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/008.yaml
  text: And it will be as when a hungry man dreams[a], and behold, he is eating, but he wakes and his appetite is empty; and as when a thirsty man dreams, and behold, he is drinking, but he wakes, and behold, he is faint and his appetite craves[b]. So will be the multitude of all the nations that wage war against Mount Zion.
translation:
  language: zh_hans
  text: 这情形必像饥饿的人做梦，梦见自己正在吃东西，醒来时，腹中却仍是空空的[a]；又像口渴的人做梦，梦见自己正在喝水，醒来时，却仍然疲乏，喉咙依旧焦渴[b]。攻打锡安山的列国大军也必如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他的生命（或他自身）是空的”。希伯来语 נֶפֶשׁ 可指生命、自身或欲求；这里在饥饿的语境中指未获满足的食欲。
    reason: 说明正文以“腹中空空”具体呈现饥饿意象，同时保留原词较宽的语义范围。
  - marker: b
    text: 也可译“他的欲求仍在强烈渴望”。希伯来语 נֶפֶשׁ 可指生命、自身或欲求；在这里也可按身体意象理解为“喉咙焦渴”。原文强调梦中虽在喝，醒后仍未解除干渴。
    reason: 保留נֶפֶשׁ שׁוֹקֵקָה在具体干渴与强烈未满足欲求之间的语义张力。
lexical_decisions:
- source_word: וְהָיָה ... כֵּן יִהְיֶה
  choice: 这情形必像……也必如此
  rationale: 保留希伯来文前后呼应的预言性比较结构，同时使现代汉语表达连贯自然。
- source_word: הָרָעֵב / הַצָּמֵא
  choice: 饥饿的人／口渴的人
  rationale: 两个带冠词的形容词在此作名词用，表示具有代表性的单数人物；汉语用“……的人”自然且无需增添原文未强调的性别。
- source_word: וְהִנֵּה אֹכֵל / וְהִנֵּה שֹׁתֶה
  choice: 梦见自己正在吃东西／梦见自己正在喝水
  rationale: וְהִנֵּה使梦境画面突然呈现，分词表示正在进行的动作；汉语以“梦见……正在……”传达其鲜明和即时性。
- source_word: וְרֵיקָה נַפְשׁוֹ
  choice: 肚腹却是空的
  rationale: נֶפֶשׁ在饥饿语境中指人的生命、自身或欲求所在；“肚腹”贴合具体意象，而脚注保留较直译的可能。
- source_word: עָיֵף
  choice: 疲乏
  rationale: 表示因缺乏水分而衰弱、疲惫；“疲乏”既自然，也不过度限定其生理程度。
- source_word: וְנַפְשׁוֹ שׁוֹקֵקָה
  choice: 喉咙依旧焦渴
  rationale: נֶפֶשׁ可指生命、自身、欲望，某些语境也可涉及喉咙；שׁוֹקֵקָה表达强烈而未获满足的渴求。“喉咙……焦渴”贴合饮水意象，脚注说明原文的语义张力。
- source_word: הֲמוֹן כָּל־הַגּוֹיִם הַצֹּבְאִים
  choice: 攻打锡安山的列国大军
  rationale: הֲמוֹן表示众多的人群，הַצֹּבְאִים表示集结作战或攻打；合译为“列国大军”简洁地表达围攻者的庞大众势。
theological_decisions:
- issue: 饥渴语境中נֶפֶשׁ的译法
  choice: 正文按具体语境译作“肚腹”和“喉咙”
  alternative: 灵魂／内心／自身／欲望
  rationale: 此处重点是梦中得到满足、醒后仍饥渴的反差，并非对“灵魂”作技术性的神学陈述。正文采用具体身体意象，脚注则保留נֶפֶשׁ较宽的含义，避免把原文的人论含义收窄为单一解释。
- issue: 列国攻打锡安山的结局
  choice: 保留“也必如此”的比喻，不明说具体结局
  alternative: 解释为列国必突然幻灭或一无所得
  rationale: 上下文比喻暗示列国的期待将落空，但本节本身以“如此”维持形象性的开放表达，译文不额外补入解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这情形必像……也必如此”保留预言语气和首尾照应；两组“做梦—梦见—醒来”形成平行节奏。“列国大军”避免生硬直译“列国的群众”，同时保持围攻锡安的宏大场面。
