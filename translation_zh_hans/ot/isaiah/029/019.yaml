  text: וְ/יָסְפ֧וּ עֲנָוִ֛ים בַּֽ/יהוָ֖ה שִׂמְחָ֑ה וְ/אֶבְיוֹנֵ֣י אָדָ֔ם בִּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל יָגִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/019.yaml
  text: The humble will again increase their joy in Yahweh[b][a], and the poor among mankind will rejoice in the Holy One of Israel.
translation:
  language: zh_hans
  text: 谦卑的人必在雅威里越发喜乐[a]；人间穷乏的人必在以色列的圣者里欢欣。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谦卑的人必再次在雅威里有喜乐。”原文动词本义为“增添、增加”，也可能带有“再次”的含义。
    reason: lexical_alternative
  - marker: b
    text: “在以色列的圣者里欢欣”也可译作“因以色列的圣者而欢欣”。原文介词可指欢欣所系的对象或范围，也可按上下文理解为缘由。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָסְפוּ ... שִׂמְחָה
  choice: 必……越发喜乐
  rationale: יסף的基本意义是“增添、增加”，与“喜乐”连用表示喜乐有所增添；“越发喜乐”在现代汉语中自然，同时保留增长之意。
- source_word: עֲנָוִים
  choice: 谦卑的人
  rationale: 该词兼有谦卑、温顺和处境卑微的语义；此处采用“谦卑的人”，保留其属灵与品格色彩，又不排除社会处境上的低微。
- source_word: בַּיהוָה
  choice: 在雅威里面
  rationale: 介词ב表示喜乐所系于的对象或范围；“在雅威里面”保留希伯来文表达及神的专名。
- source_word: וְאֶבְיוֹנֵי אָדָם
  choice: 人间的贫穷人
  rationale: אֶבְיוֹן指贫穷、困苦或有需要的人；אָדָם在此泛指人类。“人间的贫穷人”自然地表达这一构造，同时避免误解为仅指男性。
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: 因以色列的圣者
  rationale: 介词ב可表示喜乐所系于的对象或缘由。汉语“因……欢欣”自然，但“在……里面”也是可行译法，故以脚注保留歧义。
- source_word: יָגִילוּ
  choice: 欢欣
  rationale: גיל表示强烈、雀跃的喜乐；“欢欣”既符合诗体，也与前句的“喜乐”形成词汇区分。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；译作“雅威”旨在保留其作为神圣专名的性质，不以称号代替。
- issue: “以色列的圣者”的身份与称号
  choice: 直译为“以色列的圣者”
  alternative: 以色列的圣洁者
  rationale: 这是《以赛亚书》中突出的神圣称号。直译可保留其神学分量及与以色列的关系，不作解释性扩写。
- issue: 介词ב与欢欣的关系
  choice: 因以色列的圣者欢欣
  alternative: 在以色列的圣者里面欢欣
  rationale: ב既可标明喜乐的对象或范围，也可按汉语理解为缘由；正文采用较自然的因由表达，脚注保留更形式对应的读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留希伯来诗歌的平行结构。正文以分号区分两个对应分句；“越发喜乐／欢欣”既体现词义差别，也避免生硬重复。
