base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/003.yaml
  text: And I will encamp against you all around[a], and I will besiege you with siegeworks[c][b], and I will raise up siege towers against you.
translation:
  language: zh_hans
  text: 我必在你四围安营[a]；我必用围城阵地围攻你[b]，又必向你筑起攻城工事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你四围”原文也可较直译为“像圆圈一样”或“如同环形”；此处指围绕包围。
    reason: lexical_alternative
  - marker: b
    text: “围城阵地”所译的希伯来词指安置或驻设之物；也可理解为“驻军”“哨所”或“固定阵地”。
    reason: lexical_alternative
  - marker: c
    text: “攻城工事”所译的原文术语具体所指不确定；也可能指攻城壁垒、土坡或攻城塔。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִיתִי
  choice: 我要……安营
  rationale: חנה意为“安营、扎营”；这里是军事围攻语境。连续的第一人称动词表达将来的审判行动，中文以“我要”自然呈现。
- source_word: כַדּוּר
  choice: 环绕
  rationale: דּוּר的基本意象可能是“圆圈、环”；在围城语境中，“环绕”自然表达形成包围圈的意思，同时以脚注保留较直译的可能。
- source_word: עָלָיִךְ / עָלַיִךְ
  choice: 攻击你
  rationale: 介词עַל加阴性单数后缀在此表示敌对行动；“攻击你”比空间性的“在你上面”更符合军事语境。阴性单数所指的城在中文中无须标明语法性别。
- source_word: וְצַרְתִּי
  choice: 围困你
  rationale: צור在这里是“围攻、围困”。“围困”与前面的环绕安营及后面的攻城设施自然衔接。
- source_word: מֻצָּב
  choice: 围城据点
  rationale: 该词指被安置、驻设之物，可能是驻军、哨所或固定阵地。“围城据点”既符合上下文，也避免过度断定其具体形制。
- source_word: וַהֲקִימֹתִי
  choice: 又筑起
  rationale: קום的使役式表示“使之立起、设立”。搭配军事设施时，“筑起”是自然庄重的现代汉语。
- source_word: מְצֻרוֹת
  choice: 攻城工事
  rationale: 该复数名词泛指围城或攻城设施，具体可能包括壁垒、土坡或攻城塔。“攻城工事”保留其较宽的语义范围，不把不确定的具体形制写死。
theological_decisions:
- issue: 审判行动的说话者与施行者
  choice: 以连续的“我要”直接呈现上帝作为围城行动的主体。
  alternative: 将其解释为上帝仅仅容许或间接命令人类军队行动。
  rationale: 希伯来文连续使用第一人称单数动词，直接陈述说话者的行动。译文不将这种直接施行弱化为许可，也不在本节未说明之处补出执行围城的人类军队。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。三个并列分句保留原文逐步加强的围城图景，并重复敌对方向，明确行动都针对受话之城。
