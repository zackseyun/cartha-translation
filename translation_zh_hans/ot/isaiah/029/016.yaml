  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ֨פְכְּ/כֶ֔ם אִם כְּ/חֹ֥מֶר הַ/יֹּצֵ֖ר יֵֽחָשֵׁ֑ב כִּֽי יֹאמַ֨ר מַעֲשֶׂ֤ה לְ/עֹשֵׂ֨/הוּ֙ לֹ֣א עָשָׂ֔/נִי וְ/יֵ֛צֶר אָמַ֥ר לְ/יוֹצְר֖/וֹ לֹ֥א הֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/016.yaml
  text: You turn things upside down! Shall the potter be regarded as clay[a], that what is made should say of its maker, “He did not make me,” and what is formed say of the one who formed it, “He has no understanding”?
translation:
  language: zh_hans
  text: 你们竟把事情颠倒了！难道窑匠会被看作泥土，以至所做成的对造它的说：“他没有造我”，被塑造的对塑造它的说：“他不明白”吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头也可较直译为“你们的颠倒啊！”；另有人理解为“你们真悖谬！”。
    reason: 保留 הַפְכְּכֶם 这一压缩表达的主要词义与句法替代解释。
lexical_decisions:
- source_word: הַפְכְּכֶם
  choice: 你们竟把事情颠倒了
  rationale: 该词是由 הפך 构成、带第二人称复数后缀的压缩感叹语；在上下文中责备百姓颠倒真实秩序。用现代汉语的感叹句表达其力度，同时以脚注保留较直译和“悖谬”的可能。
- source_word: אִם
  choice: 难道……吗
  rationale: 此处不是普通条件句，而是引出反问；“难道……吗”自然表达其否定性的论辩语气。
- source_word: כְּחֹמֶר
  choice: 被看作泥土
  rationale: חֹמֶר 指窑匠使用的泥土；“泥土”清楚保留材料与制作者之间的意象。
- source_word: הַיֹּצֵר
  choice: 窑匠
  rationale: יצר 本义为塑造；与泥土连用时具体指窑匠，保留先知话语中的鲜明比喻。
- source_word: יֵחָשֵׁב
  choice: 被看作
  rationale: חשׁב 的尼法勒式在此意为被算作、被视为；“被看作”符合现代汉语表达。
- source_word: מַעֲשֶׂה
  choice: 受造之物
  rationale: 在制作者与所制之物的对照中，此词指做成的对象。“受造之物”兼顾被动结果与庄重语体，但不把所指局限于某一类创造物。
- source_word: לְעֹשֵׂהוּ
  choice: 论到造它的
  rationale: אמר 后的 לְ 可表示对某人说或论及某人；此处采用“论到”，与引语内容自然衔接，同时不强行判定话语是否直接对制作者说。
- source_word: עָשָׂנִי
  choice: 造我
  rationale: 完成式否认制作者已经作成说话者；汉语“没有造我”自然准确。
- source_word: יֵצֶר
  choice: 制成之物
  rationale: 指被塑造成的成品，与前半句“受造之物”构成平行，同时避免两处完全同词而掩盖希伯来文词汇差异。
- source_word: לְיוֹצְרוֹ
  choice: 论到塑造它的
  rationale: 保留 יצר 的“塑造”含义，并与前句结构平行；“论到”也保留介词关系的一定开放性。
- source_word: הֵבִין
  choice: 不明白
  rationale: בין 的使役式可表示理解、具有辨识力；“不明白”简洁自然，并保留对塑造者能力的荒谬否定。
theological_decisions:
- issue: 窑匠与泥土的比喻
  choice: 明确保留“窑匠”和“泥土”的创造者—受造物意象
  alternative: 抽象译作“创造者”和“受造物”，或全程译作“塑造者”与“材料”
  rationale: 经文的神学张力来自窑匠被降为泥土这一荒谬倒置。保留具体意象，既忠于原文，也不额外加入系统神学表述。
- issue: 开头感叹语的解释
  choice: 译作责备性的“你们竟把事情颠倒了”
  alternative: 译作“你们的颠倒啊！”或“你们真悖谬！”
  rationale: 原文表达压缩且存在词义理解差异；正文采用最符合上下文的动态表达，脚注保留直译及另一种理解，避免把争议静默消除。
- issue: לְ 与 אמר 的关系
  choice: 用“论到”保留话语是关于制作者的表达
  alternative: 译作“对造它的说”，理解为直接向制作者发言
  rationale: 介词可容许“对……说”或“论及……说”的理解；“论到”符合中文且避免过度确定说话对象，但不改变对创造者身份与智慧的否认。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“窑匠—泥土”保留具体先知意象；两个反问句呈现希伯来文的论辩力度。脚注标记[a]已置于正文相关问句之后。
