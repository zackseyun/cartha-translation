id: ISA.29.7
reference: Isaiah 29:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּֽ/חֲלוֹם֙ חֲז֣וֹן לַ֔יְלָה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל אֲרִיאֵ֑ל וְ/כָל צֹבֶ֨י/הָ֙ וּ/מְצֹ֣דָתָ֔/הּ וְ/הַ/מְּצִיקִ֖ים לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/007.yaml
  text: And the multitude of all the nations that wage war against Ariel[a], even all who wage war against her and her stronghold, and who distress her, will be like a dream[c][b], a vision of the night.
translation:
  language: zh_hans
  text: 攻打亚利伊勒[a]的列国大军，就是所有攻打她和她的坚垒[c]、使她受困苦的人，都必如梦，如夜间的异象[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚利伊勒”在本段语境中是以赛亚对耶路撒冷的诗性称呼。
    reason: cross_reference
  - marker: b
    text: 或译：“夜间所见的景象。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“她的堡垒”；也有人把原文理解为“围攻她的工事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 都必如
  rationale: 此处带连接词的完成式在先知话语中引出将来的比喻结果；用“必”表达预告的确定性，并使中文句式自然。
- source_word: כַּחֲלוֹם
  choice: 如梦
  rationale: 前缀כ表示比较；“如梦”简洁、自然，也保留原文的诗意。
- source_word: חֲזוֹן לַיְלָה
  choice: 夜间的异象
  rationale: 该组合直译为“夜的异象”；“夜间的异象”既保留与“梦”的平行，也清楚表达发生于夜间的异象，同时在脚注保留“夜间所见的景象”这一较普通的理解。
- source_word: הֲמוֹן כָּל הַגּוֹיִם
  choice: 列国大军
  rationale: הֲמוֹן可指众多的人群或喧腾的大群；结合军事语境译为“大军”，而“列国”自然表达כָּל הַגּוֹיִם。
- source_word: הַצֹּבְאִים עַל
  choice: 攻打
  rationale: צבא在此军事语境中表示出兵作战，עַל标明敌对对象；“攻打”准确而简洁。
- source_word: אֲרִיאֵל
  choice: 亚利伊勒
  rationale: 保留希伯来文的诗性地名，不在正文中直接改译为“耶路撒冷”；采用现代中文圣经语境中可辨认的音译。
- source_word: וְכָל צֹבֶיהָ
  choice: 所有攻打她……的人
  rationale: 阴性单数后缀回指亚利伊勒；重复“攻打”保留与前一分句的词汇联系，并明确其敌对含义。
- source_word: וּמְצֹדָתָהּ
  choice: 和她的坚垒
  rationale: מְצוֹדָה通常指堡垒或坚固据点，阴性后缀最自然地理解为亚利伊勒的坚垒；原词也可能涉及围城工事，故在脚注保留歧义。
- source_word: וְהַמְּצִיקִים לָהּ
  choice: 使她受困苦的人
  rationale: 该使役分词可表示使人受压迫、窘迫或困苦；此译保留广义的敌对压力，不限定为某一种围城行动。
theological_decisions:
- issue: “亚利伊勒”的所指
  choice: 正文保留音译“亚利伊勒”，脚注说明在本段语境中这是以赛亚对耶路撒冷的诗性称呼。
  alternative: 在正文中直接译作“耶路撒冷”。
  rationale: 希伯来文明确使用אֲרִיאֵל；保留名称可维持原文的诗性和可能的文字张力，又借脚注帮助普通读者理解所指。
- issue: מְצֹדָתָהּ的指向与含义
  choice: 译为“她的坚垒”，理解为亚利伊勒所属的防御据点。
  alternative: 译为“她的堡垒”，或理解为“攻城工事”。
  rationale: 名词通常表示坚垒或堡垒，且阴性单数后缀自然回指亚利伊勒；然而语境容许把它理解为针对她的围城设施，因此不在正文中排除该读法，而在脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“列国大军”呈现军事场景，以“如梦，如夜间的异象”保留希伯来诗歌的平行结构。正文不把“亚利伊勒”解释性替换为“耶路撒冷”，并通过脚注保存מְצֹדָתָהּ的词义与指向歧义。
