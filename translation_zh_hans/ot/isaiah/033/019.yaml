  text: אֶת עַ֥ם נוֹעָ֖ז לֹ֣א תִרְאֶ֑ה עַ֣ם עִמְקֵ֤י שָׂפָה֙ מִ/שְּׁמ֔וֹעַ נִלְעַ֥ג לָשׁ֖וֹן אֵ֥ין בִּינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/019.yaml
  text: You will no longer see the insolent people[a], a people of speech too deep to understand[c][b], of a stammering tongue without comprehension.
translation:
  language: zh_hans
  text: 你必不再看见那狂傲的民[a]，就是言语深奥、难以听懂的民[b]，说着含混、难以理解的语言[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂傲”或译“强悍”或“桀骜”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“嘴唇深得听不明白的民”，意指他们的言语艰深隐晦，听者无法理解。
    reason: lexical_alternative
  - marker: c
    text: 或译“结结巴巴的舌头”、“讥诮的舌头”或“陌生／外族的语言”。原文含义较难确定；在本节中，很可能指听者无法理解的外族语言。
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹעָז
  choice: 狂傲
  rationale: 该词可指强悍、放肆或傲慢无礼；结合敌对外族带来的威吓，“狂傲”兼顾其骄横与逼人之感，同时以脚注保留“强悍、桀骜”的可能。
- source_word: תִרְאֶה
  choice: 你必不再看见
  rationale: ראה的基本义是“看见”；否定式在语境中表示将不再见到或面对这敌对之民。
- source_word: עִמְקֵי שָׂפָה
  choice: 言语深奥
  rationale: 直译为“嘴唇深”，在此形容话语对听者而言艰深、隐晦，难以听懂；正文保留“深”的意象，又用后句说明其功能含义。
- source_word: מִשְּׁמוֹעַ
  choice: 听不明白
  rationale: 字面涉及“听”，但此处重点不是听觉能力，而是听见后不能领会，因此译作自然的现代汉语“听不明白”。
- source_word: נִלְעַג לָשׁוֹן
  choice: 口舌含混
  rationale: 该短语含义困难，可指结巴、嘲弄或听来陌生难辨的言语；结合平行句，正文采用“含混”，表达外语在听者耳中难以辨识，而不武断认定为生理性口吃。
- source_word: אֵין בִּינָה
  choice: 无法理解
  rationale: 表达缺乏理解或可理解性；在本节语境中，指这种言语不能被听者理解。
- source_word: עַם ... עַם
  choice: 民……民
  rationale: 保留希伯来文的重复，以维持强调和诗体结构。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你必不再看见”贴近原文否定式，并传达不再面对压迫者的语境。“言语深奥、听不明白”保留原文“深”的意象；“口舌含混”避免把有争议的词义过度确定为实际口吃。所有词义歧义均在脚注中交代。
