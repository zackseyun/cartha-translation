base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/018.yaml
  text: 'Your heart will meditate on terror: “Where is the scribe? Where is the one who weighs? Where is the one who counts the towers?”[a][b]'
translation:
  language: zh_hans
  text: 你心里必思量恐惧[a]：“文书官在哪里？称量的人在哪里？清点塔楼的人在哪里？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “思量”也可译作“默想”或“低声念叨”。希伯来语动词既可表示内心反复思想，也可表示低声发出话语。
    reason: lexical_alternative
  - marker: b
    text: “文书官……称量的人……清点塔楼的人”很可能指参与核算、贡赋征收或围城计算的外国官员。
    reason: cultural_note
lexical_decisions:
- source_word: לִבְּךָ
  choice: 你心里
  rationale: לֵב在这里指人的内在思想与意识。译作“你心里”既保留希伯来语以“心”表达内在活动的方式，也符合现代汉语习惯。
- source_word: יֶהְגֶּה
  choice: 必思量
  rationale: הגה可指内心默想、反复思索，也可指低声念叨。上下文侧重危机过后的内在回顾，因此用“思量”，同时以脚注保留其他可能的语感。
- source_word: אֵימָה
  choice: 那可怕的事
  rationale: אֵימָה表示恐惧、惊恐或令人畏惧之事。汉语若直译为“思量恐怖”较生硬；“那可怕的事”自然地表达所经历或所面对的恐怖情境，又不具体限定其内容。
- source_word: אַיֵּה
  choice: 在哪里
  rationale: 原文三次重复同一疑问词，形成带有胜利回望意味的连续反问；译文逐次保留“在哪里”。
- source_word: סֹפֵר
  choice: 书记
  rationale: 该分词可指书写、记录或计数的人。此处首次出现时较可能指负责记录或核算的官员；“书记”保留其行政职分，也避免把具体职责解释得过窄。
- source_word: שֹׁקֵל
  choice: 称重的
  rationale: 该分词字面指“称量的人”，可能涉及称量贡银或核定款项。译作“称重的”保留原文动作，不擅自指定官职或称量对象。
- source_word: סֹפֵר אֶת הַמִּגְדָּלִים
  choice: 数城楼的
  rationale: 这里ספר与城楼连用，最自然的意思是点数；“数城楼的”简洁保留敌方勘察防御设施的具体图景。
- source_word: הַמִּגְדָּלִים
  choice: 城楼
  rationale: מִגְדָּל指塔楼；本节处于城防与围攻语境，“城楼”比泛指的“塔”更能自然呈现防御建筑，同时没有扩大为全部“防御工事”。
theological_decisions:
- issue: 三类人物的身份与功能
  choice: 正文按字面译为“书记、称重的、数城楼的”，不明确补作亚述或其他外国官员
  alternative: 直接译成“登记贡赋的、称量贡银的、勘察城楼的敌方官员”
  rationale: 这些人物很可能是参与征税、贡赋核算或围城侦察的外国官员，但原文没有明说其国籍，也未明确各人的具体任务。正文保留含蓄性，背景判断放入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“书记”保留古代行政人员的称谓；“称重的”和“数城楼的”依原文使用动作性表达，以维持三重反问的节奏，并避免把不确定的历史职务解释得过细。
