  text: מִ/קּ֣וֹל הָמ֔וֹן נָדְד֖וּ עַמִּ֑ים מֵ/ר֣וֹמְמֻתֶ֔/ךָ נָפְצ֖וּ גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/003.yaml
  text: At the sound of the tumult[a], peoples fled; at your rising up[b], nations were scattered.
translation:
  language: zh_hans
  text: 因喧嚷声[a]，万民逃遁；因你兴起[b]，列国四散。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因喧闹声。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“因你的崇高威荣”；希伯来语可强调神兴起行动，也可强调他的崇高威荣。
    reason: alternative_reading
lexical_decisions:
- source_word: מִקּוֹל הָמוֹן
  choice: 因喧嚷之声
  rationale: מִן在这里表示引发行动的原因或时机；קוֹל הָמוֹן指喧闹、骚动所发的响声。“因喧嚷之声”既保留声音意象，也符合上下文中万民惊逃的场景。
- source_word: נָדְדוּ
  choice: 逃跑
  rationale: 该动词本可表示游荡、离开；在列国面对神介入的军事语境中，表示因惧怕而逃离最为贴切。
- source_word: עַמִּים
  choice: 万民
  rationale: 译作“万民”自然地表达复数族群，并与下半句的גּוֹיִם“列国”保持措辞上的区别；“万”在此为集合性表达，并非精确数字。
- source_word: מֵרוֹמְמֻתֶךָ
  choice: 因你兴起
  rationale: רוממות可指升起、兴起，也可指被高举或尊崇。正文采用“兴起”，契合神起来施行干预的上下文，同时用脚注保留“受高举”的可能。
- source_word: נָפְצוּ
  choice: 四散
  rationale: 该词可表示散开，也可能带有击碎之意；以列国为主语时，“四散”最清楚地表达其溃散。
- source_word: גּוֹיִם
  choice: 列国
  rationale: “列国”准确表达多个国家或民族群体，不引入后期语境中“外邦人”的特定对照含义。
theological_decisions:
- issue: “你兴起”中第二人称所指
  choice: 保留第二人称直称，按上下文最可能指耶和华起来施行审判
  alternative: 也有人可能理解为人格化的锡安或耶路撒冷
  rationale: 本章近处直接呼求耶和华，并描述他介入敌国之事，因此所指最可能是神；正文不补出“耶和华”，以免消除原文代词留下的张力。
- issue: מֵרוֹמְמֻתֶךָ所表达的是行动还是尊荣
  choice: 正文译为“兴起”，突出起来行动
  alternative: 译为“受高举”或“尊荣彰显”
  rationale: 上下文支持神起来使列国溃散，但希伯来语也可强调他的崇高尊荣，因此以脚注保留另一理解。
translation_notes:
  register: 采用现代、庄重而简洁的对偶句式。“万民／列国”“逃跑／四散”呈现希伯来诗歌的平行结构；两个“因”明确表达原文介词所表示的触发原因。
