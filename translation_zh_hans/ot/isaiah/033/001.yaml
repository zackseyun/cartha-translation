base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/001.yaml
  text: Woe to you[a], destroyer, though you yourself have not been destroyed, and betrayer, though they have not betrayed you. When you finish destroying, you will be destroyed; when you cease betraying[c][b], they will betray you.
translation:
  language: zh_hans
  text: 祸哉，你这抢掠者！你未曾被抢掠；你这行诡诈的！他们也未曾向你行诡诈[a]。等你抢掠完了，你必被抢掠[b]；等你行完诡诈[c]，他们必向你行诡诈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译作“他们也未曾向他行诡诈”。正文依本节的直接称呼和对仗关系译作“向你”；第三人称的读法也可能成立。
    reason: alternative_reading
  - marker: b
    text: “抢掠”也可译作“毁坏”或“蹂躏”；原词既可强调夺取财物，也可泛指暴力摧毁。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“等你停止行诡诈”或“等你不再以诡诈待人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 引出先知宣告审判，既保留强烈的谴责语气，也符合庄重而易懂的现代中文表达。
- source_word: שׁוֹדֵד / שָׁדוּד / תּוּשַּׁד
  choice: 抢掠者／被抢掠
  rationale: 该词根可指劫掠、蹂躏或毁坏；本节反复使用同一词根，译作“抢掠”能清楚保留施害者反受其害的文字呼应。
- source_word: בּוֹגֵד / בגד
  choice: 行诡诈／向……行诡诈
  rationale: 保留分词与后续动词的词根重复，并涵盖背信、欺诈和以诡诈相待的含义，不把对象关系收窄为某一种特定的政治或盟约行为。
- source_word: כַּהֲתִמְךָ
  choice: 等你……完了
  rationale: 表达动作完成之时，采用自然的现代汉语时间结构。
- source_word: כַּנְּלֹתְךָ לִבְגֹּד
  choice: 等你行完诡诈
  rationale: כלה在此表示达到终点或完成；“行完”保留完成义，同时不排除“停止”的语境含义。
theological_decisions:
- issue: בָגְדוּ בוֹ中的第三人称与全节第二人称直呼之间的张力
  choice: 正文按平行结构译为“人也未曾向你行诡诈”，并加注说明希伯来文本字面作“向他”
  alternative: 人也未曾向他行诡诈
  rationale: 上下文连续直呼抢掠者，第二人称使两组平行句清楚连贯；但马所拉文本确为第三人称单数，故不静默消除该文本现象。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“祸哉”保留先知宣告的力度；两组“抢掠／被抢掠”和“行诡诈／向你行诡诈”刻意保留原文的重复、对称与报应反转。
