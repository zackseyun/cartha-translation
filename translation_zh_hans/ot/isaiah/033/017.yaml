  text: מֶ֥לֶךְ בְּ/יָפְי֖/וֹ תֶּחֱזֶ֣ינָה עֵינֶ֑י/ךָ תִּרְאֶ֖ינָה אֶ֥רֶץ מַרְחַקִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/017.yaml
  text: Your eyes will behold the king in his beauty[a]; they will see a far-reaching land.
translation:
  language: zh_hans
  text: 你的眼睛必看见王的荣美；也必看见辽远之地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“遥远之地”；较直译为：“远方之地”或“有遥远距离的地”。
    reason: 说明מַרְחַקִּים为表示远处或远距离的复数形式；正文“辽远”以自然诗体保留其空间广远的含义。
lexical_decisions:
- source_word: מֶלֶךְ
  choice: 王
  rationale: 该词意为“王”。希伯来文虽无冠词，但上下文可指特定的王；汉语“王”本身自然保留这种指称，也不必增添“那位”。
- source_word: בְּיָפְיוֹ
  choice: 他的荣美
  rationale: 保留介词结构所表达的“处于其美丽、华美之中”，并以“荣美”兼顾外在华美、君王威仪与恢复后的尊荣，不将含义限于容貌。
- source_word: תֶּחֱזֶינָה
  choice: 必看见
  rationale: חזה可含专注观看、亲眼目睹之意；现代汉语以“看见”最自然，“必”表达未完成式在此处的将来语气。
- source_word: עֵינֶיךָ
  choice: 你的眼睛
  rationale: 保留原文明确的身体意象，也维持两个阴性复数动词以“眼睛”为主语的诗意结构。
- source_word: תִּרְאֶינָה
  choice: 必看见
  rationale: 该阴性复数动词仍以“你的眼睛”为主语；第二分句省略重复主语，符合自然汉语，并保留平行结构。
- source_word: אֶרֶץ
  choice: 地
  rationale: אֶרֶץ可指土地、疆域或国土。“地”在诗体中宽泛而自然，不强行判定为特定国家或应许之地。
- source_word: מַרְחַקִּים
  choice: 辽阔远方
  rationale: 该复数名词表达遥远之处或广远的距离。“辽阔远方之地”保留距离与广袤两方面的可能含义，避免只解释为偏远之地。
theological_decisions:
- issue: “王”的身份
  choice: 只译作“王”，不指明其身份
  alternative: 明确解释为希西家、耶和华，或弥赛亚君王
  rationale: 本节原文只称“王”，没有明说所指。译文保留其历史、神学与末世性解释之间的张力。
- issue: “辽阔远方之地”的所指
  choice: 保留为空间广远的诗性表达
  alternative: 明确解释为疆域扩张、远方国土或遥远之地
  rationale: אֶרֶץ מַרְחַקִּים的简短组合容许“广袤之地”和“遥远之地”等理解，不宜在正文中排除其中任何一种。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两个分句都用“必看见”保持平行；第二句承接“你的眼睛”而不重复主语。正文不锁定“王”的身份，也不把אֶרֶץ מַרְחַקִּים单一解释为疆域、远国或应许之地。
