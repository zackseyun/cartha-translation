  yaml_path: translation/ot/isaiah/033/007.yaml
  text: Look[a], their heroes cry out outside[b]; the messengers of peace weep bitterly.
translation:
  language: zh_hans
  text: 看哪，他们的勇士[a]在外面哀号；和平使者[b]痛哭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “勇士”所译的希伯来词含义不确定；也可能指“他们的亚利伊勒人”，或“他们的上帝的狮子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“和平使节”或“外交使节”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强语气的感叹词；“看哪”庄重自然，也保留先知诗歌的宣告力度。
- source_word: אֶרְאֶלָּם
  choice: 他们的勇士
  rationale: 此词含义不确定；结合本节中求和使者痛哭以及上下文所写的危局，译作人的勇士最为通顺，同时以脚注保留其他可能。
- source_word: צָעֲקוּ
  choice: 哀号
  rationale: 该动词表示因困苦而发出的呼喊；“哀号”在此比普通的“呼喊”更清楚地传达悲痛语境。
- source_word: חֻצָה
  choice: 在外面
  rationale: 该词基本义为向外或在外面；采用较宽泛的译法，不把场景具体限定为街道。
- source_word: מַלְאֲכֵי שָׁלוֹם
  choice: 求和的使者
  rationale: מַלְאָך在此政治语境中指受差遣的人，而非天使；“求和的使者”既表达和平使命，也不把其官职过度限定为大使。
- source_word: מַר יִבְכָּיוּן
  choice: 痛哭
  rationale: מַר在这里加强哭泣的痛苦程度；“痛哭”以自然简洁的现代汉语表达“苦苦哭泣”。
theological_decisions:
- issue: אֶרְאֶלָּם所指的身份
  choice: 理解为人的勇士或英勇之士
  alternative: “亚利伊勒之士”“上帝的狮子”，或与亚利伊勒相关的人
  rationale: 上下文涉及荒凉、外交失败与公开哀恸，把它理解为人的勇士最符合两行的平行场景；但原词确实晦涩，故不把这一解释伪装成确定含义。
- issue: מַלְאֲכֵי שָׁלוֹם的身份
  choice: 理解为执行求和使命的人间使者
  alternative: “和平的使者”或较具体的“求和使节”
  rationale: 条约和道路荒废的语境支持外交使者之义；译文避免使读者误解为天使，同时脚注保留“使节”的具体表达。
translation_notes:
  register: 采用现代、庄重而易懂的先知诗歌语体。两分句保持紧凑平行；“在外面”忠实保留地点表达的宽泛性，“哀号／痛哭”传达全节强烈的悲恸。所有脚注标记均置于正文对应词语之后。
