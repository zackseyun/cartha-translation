  text: וּ/בַל יֹאמַ֥ר שָׁכֵ֖ן חָלִ֑יתִי הָ/עָ֛ם הַ/יֹּשֵׁ֥ב בָּ֖/הּ נְשֻׂ֥א עָוֺֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/024.yaml
  text: And no inhabitant will say[a], “I am sick”; the people who dwell there are forgiven their iniquity.
translation:
  language: zh_hans
  text: 居民必不说：“我病了。”住在其中的百姓，罪孽已蒙赦免。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的罪责已被除去”或“他们的罪孽已被带走”。希伯来语按字面说，罪孽被背负、带走或除去。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַל
  choice: 必不再
  rationale: וּ连接上文，בַל作强烈否定；结合复兴语境，译作“必不再”自然表达预言中的未来状态。
- source_word: יֹאמַר
  choice: 说
  rationale: 未完成式在预言语境中指向未来，与“必不再”合用即可清楚表达“将不会说”。
- source_word: שָׁכֵן
  choice: 居民
  rationale: 该单数形式泛指居住在那里的人；“居民”简洁自然，并保留定居者的含义。
- source_word: חָלִיתִי
  choice: 我病了
  rationale: חלה可指患病或软弱；直引语中的“我病了”是自然现代汉语，也保留身体患病这一基本意义。
- source_word: הָעָם
  choice: 百姓
  rationale: עם在此指当地整体人口；“百姓”符合先知书语体，也不突出政治民族概念。
- source_word: הַיֹּשֵׁב בָּהּ
  choice: 住在其中的
  rationale: 单数分词与集合名词搭配，表达其中的居民；בָּהּ字面为“在她里面”，指前文之城，译作“其中”在汉语中自然且保留所指。
- source_word: נְשֻׂא
  choice: 已蒙赦免
  rationale: נשׂא与עָוֹן搭配可表示罪孽被担当、除去，因而获得赦免；“蒙赦免”清楚传达惯用意义，而脚注保留字面意象及语义幅度。
- source_word: עָוֺן
  choice: 罪孽
  rationale: עָוֹן可涵盖罪孽、罪责或罪罚；“罪孽”保留其道德与神学分量，同时不把语义限缩为主观罪疚感。
theological_decisions:
- issue: 疾病消除与罪孽赦免之间的关系
  choice: 并列呈现锡安居民不再患病与百姓罪孽蒙赦免这两项复兴之福，不明说二者存在逐一对应的因果关系。
  alternative: 把疾病完全解释为属灵状况的比喻，或断言每个人的疾病都是其个人犯罪的直接结果。
  rationale: 希伯来文本把两项福分并列，却没有明确建立个体疾病与个体罪行之间的一一因果关系；译文保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“居民”与“百姓”避免重复生硬；“必不再说”体现预言性的未来否定。“已蒙赦免”沿用自然的经文语体，脚注说明נשא עון的字面意象与可译范围。
