  text: תַּהֲר֥וּ חֲשַׁ֖שׁ תֵּ֣לְדוּ קַ֑שׁ רוּחֲ/כֶ֕ם אֵ֖שׁ תֹּאכַלְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/011.yaml
  text: You conceive chaff; you give birth to stubble[a]. Your breath is a fire that will consume you.
translation:
  language: zh_hans
  text: 你们怀的是糠秕，生的是秸秆；你们的气息[a]就是火，必吞灭你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们的灵就是火，必吞灭你们”。希伯来语 רוּחַ 可指“气息”、“风”或“灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּהֲרוּ
  choice: 你们怀的是
  rationale: 该词为 הרה 的 Qal 未完成式第二人称阳性复数，表示怀孕、怀胎；此译保留从怀孕到生产的连续比喻，又符合现代汉语表达。
- source_word: חֲשַׁשׁ
  choice: 糠秕
  rationale: 指轻薄、干燥、易燃的植物废料；“糠秕”既呈现其无用和易燃的特征，也与下句“秸秆”形成诗歌平行。
- source_word: תֵּלְדוּ
  choice: 生的是
  rationale: 该词为 ילד 的 Qal 未完成式第二人称阳性复数，意为生育、生产；与前面的“怀”共同保留生育意象。
- source_word: קַשׁ
  choice: 秸秆
  rationale: 通常指干草、禾秸或脱粒后的干燥茎秆；“秸秆”是现代普通读者熟悉的说法，并延续易燃废料的意象。
- source_word: רוּחֲכֶם
  choice: 你们的气息
  rationale: רוּחַ 可指气息、风或灵；在随后的火焰意象中，“气息”最具体地呈现从他们自身发出、反过来毁灭他们的力量，同时不排除其内在生命或意向的含义。
- source_word: אֵשׁ
  choice: 火
  rationale: 直接译出火的意象；汉语无需添加不定冠词。
- source_word: תֹּאכַלְכֶם
  choice: 必吞灭你们
  rationale: אכל 本义为吃、吞吃；以火为主语时，“吞灭”自然地表达火焰彻底毁灭的力量，并保留原词的吞噬感。
theological_decisions:
- issue: 审判意象中 רוּחֲכֶם 的含义
  choice: 你们的气息
  alternative: 你们的灵；你们的风
  rationale: “气息”保留原文具体而强烈的意象，即从受审判者自身而出的东西成为毁灭他们的火；脚注同时交代“灵”的可能译法，不把多义词预先限定为单一的心理或神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“怀—生”保留原文的生育比喻，以“糠秕—秸秆—火”维持诗句中无用、易燃并自取灭亡的意象链；分号呈现两组平行而递进的判断。
