  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נִטְּשׁ֖וּ חֲבָלָ֑יִ/ךְ בַּל יְחַזְּק֤וּ כֵן תָּרְנָ/ם֙ בַּל פָּ֣רְשׂוּ נֵ֔ס אָ֣ז חֻלַּ֤ק עַֽד שָׁלָל֙ מַרְבֶּ֔ה פִּסְחִ֖ים בָּ֥זְזוּ בַֽז־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/023.yaml
  text: Your ropes hang loose[a]; they cannot hold firm the base of their mast; they cannot spread the sail. Then abundant plunder will be divided[b]; even the lame will carry off the spoil.
translation:
  language: zh_hans
  text: 你的绳索松脱了；它们不能固定桅杆的底座，也不能展开帆[a]。随后，大量战利品将被瓜分；连瘸腿的人也要夺取掠物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不能展开旗帜（或号旗）。”希伯来语“נֵס”通常指旗帜或号旗；这里因绳索和桅杆的船舶意象而译作“帆”。
    reason: lexical_alternative
  - marker: b
    text: 本节沿用一艘索具松脱、无法升帆的船的意象，表现其瘫痪，并描绘掠物容易被取得的情景。船只所指的对象在本节中没有明说。
    reason: cultural_note
lexical_decisions:
- source_word: נִטְּשׁוּ חֲבָלָיִךְ
  choice: 你的绳索松脱了
  rationale: נִטְּשׁוּ表示绳索已被放松、撇下或不再绷紧；结合航海意象译作“松脱”，既保留完成状态，也自然呈现船具失灵。第二人称阴性单数后缀以“你的”保留。
- source_word: בַּל יְחַזְּקוּ
  choice: 它们不能固定
  rationale: בַּל在此表示强烈否定，语境强调能力丧失；יְחַזְּקוּ有使稳固、系牢之意，故译作“不能固定”。
- source_word: כֵן תָּרְנָם
  choice: 桅杆的底座
  rationale: כֵן含义较难确定，可指基座、支架或承托之物；תֹּרֶן指桅杆。译文采用符合船舶意象的“桅杆的底座”，但不进一步限定具体构件。
- source_word: בַּל פָּרְשׂוּ נֵס
  choice: 也不能展开帆
  rationale: פָּרְשׂוּ意为展开、铺开；נֵס通常指旗帜或号旗，但在桅杆和绳索的航海语境中可理解为帆。正文采用“帆”以保持整体意象，并在脚注保留通常词义。
- source_word: אָז חֻלַּק עַד שָׁלָל מַרְבֶּה
  choice: 那时，许多掠物将被瓜分
  rationale: אָז标示随后的结果；חֻלַּק是被动式“被分配、被瓜分”。עַד שָׁלָל מַרְבֶּה的结构不寻常，但整体指大量战利品，译作“许多掠物”保持简洁。
- source_word: פִּסְחִים בָּזְזוּ בַז
  choice: 连瘸腿的人也能夺取战利品
  rationale: פִּסְחִים指行动不便、瘸腿的人；בָּזְזוּ בַז由同根动词与名词构成，意为掠取掠物。加入“连……也”传达敌方败落之彻底，连通常无力参战者都能取走战利品。
theological_decisions:
- issue: 残破船只意象所指的对象
  choice: 正文不明说船只代表亚述、敌军或耶路撒冷，仅保留第二人称船只意象
  alternative: 明确译成敌人的船或将其解释为亚述的覆亡
  rationale: 希伯来文本本节没有直接点明船只所代表的对象；上下文允许敌方败亡的理解，但翻译不应把解释写入正文。
- issue: 预言时态
  choice: 将חֻלַּק译为“将被瓜分”，并将后句译为“也能夺取”
  alternative: 按希伯来完成式译为“被瓜分了／夺取了”
  rationale: 希伯来预言语境可用完成式描绘确定将发生之事。现代汉语采用将来表达较顺畅，同时保留事件的预告性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“绳索松脱”“固定桅杆的底座”“展开帆”连贯呈现航海意象；“瘸腿的人”较为准确、自然，也避免贬抑性称呼。正文保留希伯来文本中船只所指对象的含混性，并用脚注说明נֵס的词义分歧。
