source:
  edition: WLC
  text: וְ/הָיָה֙ אֱמוּנַ֣ת עִתֶּ֔י/ךָ חֹ֥סֶן יְשׁוּעֹ֖ת חָכְמַ֣ת וָ/דָ֑עַת יִרְאַ֥ת יְהוָ֖ה הִ֥יא אוֹצָרֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/006.yaml
  text: And he will be the stability of your times[a], a wealth of salvation, wisdom, and knowledge[c][b]; the fear of Yahweh is his treasure.
translation:
  language: zh_hans
  text: 你各时期必有安稳[a]，有丰盛的拯救[b]、智慧和知识；敬畏耶和华是他的珍宝[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必成为你各时期的安稳。”原文动词为阳性单数，可承接上下文理解为以“他”为主语；也可作无人称理解。
    reason: alternative_reading
  - marker: b
    text: “拯救”原文为复数，可指丰盛的拯救或多次搭救。
    reason: lexical_alternative
  - marker: c
    text: “他的”所指不完全明确；也可译作“你的珍宝”或“它的珍宝”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: 他必使……安稳
  rationale: 希伯来语为阳性单数，可指上文的耶和华；汉语以使动表达“他成为你诸时的稳定”较自然，同时在脚注保留无人称读法。
- source_word: אֱמוּנַת עִתֶּיךָ
  choice: 使你在世局变迁中安稳
  rationale: אֱמוּנָה在此表示稳固、安定；עִתִּים指各个时期或时势。此译传达客观的安稳，而非主观的信心。
- source_word: חֹסֶן
  choice: 丰盛的
  rationale: 该词可指财富、宝藏或丰富；在拯救、智慧和知识的并列结构前，译作“丰盛的”自然地表达充足供应。
- source_word: יְשׁוּעֹת
  choice: 拯救
  rationale: 原文为复数，可表示多次施救或加强意义；正文用现代汉语较自然的集合性单数，脚注说明复数意味。
- source_word: חָכְמַת וָדָעַת
  choice: 智慧和知识
  rationale: 忠实保留两个并列名词及其区别。
- source_word: יִרְאַת יְהוָה
  choice: 敬畏耶和华
  rationale: “敬畏”保留对神既尊崇又畏惧的盟约性表达；יהוה按其专名译作“耶和华”。
- source_word: הִיא אוֹצָרוֹ
  choice: 就是他的珍宝
  rationale: הִיא回指阴性短语“敬畏耶和华”；אוֹצָרוֹ含第三人称阳性单数后缀。正文保留“他的”，并在脚注交代所指存在争议。
theological_decisions:
- issue: וְהָיָה的主语
  choice: 以耶和华为隐含主语：“他必使……安稳”
  alternative: 无人称理解：“你的世局必安稳”
  rationale: 阳性单数动词可承接上下文中的耶和华，但希伯来语也容许存在句式；正文采用语境较顺的个人主语，脚注保留真实歧义。
- issue: אוֹצָרוֹ中后缀的所指
  choice: 译作“他的珍宝”，不在正文明确其先行词
  alternative: “你的珍宝”或“它的珍宝”
  rationale: 第三人称阳性单数后缀的指向并不确定，可能联系前述人物、锡安或整体情境；直译“他的”能避免在正文中过度释义，其他可能性收入脚注。
- issue: יְשׁוּעֹת的复数神学意味
  choice: 正文译作集合性的“拯救”
  alternative: “多次搭救”或“种种拯救”
  rationale: 复数可能是加强或表示多重施救；正文采用自然汉语，不将其限定为单一事件，脚注保留形式信息。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“世局变迁”概括复数“你的时期/时势”，避免生硬的“你的诸时”；“珍宝”比“库房”更符合此处作为宝贵所有物的语境。所有脚注标记均置于正文相应位置。
