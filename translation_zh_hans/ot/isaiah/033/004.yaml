  yaml_path: translation/ot/isaiah/033/004.yaml
  text: And your spoil will be gathered like the gathering of locusts[a]; like the rushing of swarms[b], they rush upon it.
translation:
  language: zh_hans
  text: 你们的掳物必被收聚，如同蝗虫的聚集[a]；又如虫群奔涌，蜂拥而上，扑向它[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同吞噬性蝗虫的聚集”。希伯来语חָסִיל可指某一种或某一生长阶段的蝗虫。
    reason: lexical_alternative
  - marker: b
    text: 第二个比喻的希伯来原文含义不易确定，也可译作：“如蝗虫发动袭击”或“如蝗虫四处奔涌”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֻסַּף
  choice: 必被收集
  rationale: 该词是אסף的被动形式；结合上下文，以将来被动表达敌方战利品将被收取，并以“必”体现预告语气。
- source_word: שְׁלַלְכֶם
  choice: 你们的战利品
  rationale: שׁלל指战争中夺得的财物；“战利品”在现代汉语中准确而自然。
- source_word: אֹסֶף
  choice: 收集食物
  rationale: 这是与前一动词同根的名词，构成强调性的比较。汉语若直译为“如同蝗虫的收集”不够自然，因此补出语境隐含的“食物”，并在脚注说明较形式对应的译法。
- source_word: הֶחָסִיל
  choice: 蝗虫
  rationale: חָסִיל可指某一种或某一生长阶段的蝗虫；正文采用现代读者易懂的总称“蝗虫”，保留脚注中的词义余地。
- source_word: כְּמַשַּׁק
  choice: 如……蜂拥而上
  rationale: מַשַּׁק是罕见词，可能表示奔涌、冲击或袭击；“蜂拥而上”传达突然且密集的动态，同时不把罕见词限定为军事攻击。
- source_word: גֵּבִים
  choice: 成群的蝗虫
  rationale: 该罕见名词含义不确定，语境中很可能指成群涌动的虫群；结合前半句的蝗虫意象译出，但以脚注保留其他理解。
- source_word: שׁוֹקֵק
  choice: 蜂拥着扑向
  rationale: 分词表达活跃、反复而急切的奔涌动作；“蜂拥着扑向”在汉语中形象地呈现众多收掠者奔向战利品的画面。
- source_word: בּוֹ
  choice: 向战利品
  rationale: 介词加代词后缀回指战利品，表示奔涌动作所朝向或落在其上的对象；汉语明确重复“战利品”以免代词指向含混。
theological_decisions: []
