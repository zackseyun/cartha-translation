id: ISA.33.13
reference: Isaiah 33:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְע֥וּ רְחוֹקִ֖ים אֲשֶׁ֣ר עָשִׂ֑יתִי וּ/דְע֥וּ קְרוֹבִ֖ים גְּבֻרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/013.yaml
  text: Hear[a], you who are far away, what I have done; and know, you who are near[b], my might.
translation:
  language: zh_hans
  text: 远方的人哪，要听我所做的；近处的人哪，要知道我的大能。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能”也可译作“力量”或“能力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 这是复数命令式。用“要听”保留先知宣告中直接召唤的语气，也符合现代汉语表达。
- source_word: רְחוֹקִים
  choice: 远方的人
  rationale: 复数形容词在此作名词使用，并带呼语功能；译为“远方的人哪”自然呈现受话群体，并与“近处的人”形成对照。
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: 我所做的
  rationale: 关系词加第一人称单数完成式，指已经成就的事；“我所做的”简洁自然，不额外限定其时间意义。
- source_word: וּדְעוּ
  choice: 要知道
  rationale: 这是ידע的复数命令式，与前句“要听”构成平行；“知道”比“承认”或“认识到”更少解释性。
- source_word: קְרוֹבִים
  choice: 近处的人
  rationale: 复数形容词名词化使用，与“远方的人”平行；“近处的人哪”清楚保留空间或修辞距离上的对比。
- source_word: גְּבֻרָתִי
  choice: 我的大能
  rationale: גְּבוּרָה可指力量、能力或威势。“大能”在庄重的现代汉语中自然，并适合这里上帝已经彰显的能力，同时没有具体化为某一件“大能的作为”。
theological_decisions:
- issue: 第一人称说话者的身份
  choice: 按上下文理解为耶和华，但正文不补出“耶和华”或“上帝”
  alternative: 在正文中明确译为“耶和华所做的”或“上帝的大能”
  rationale: 本节的第一人称动词和后缀在上下文中指向耶和华，但希伯来文本本句没有明说主语；保留第一人称可避免加入原文未明载的神名。
- issue: גְּבֻרָתִי是抽象能力还是具体作为
  choice: 译作抽象名词“我的大能”
  alternative: 译作“我的大能作为”
  rationale: 上下文虽可使人联想到已经施行的大能作为，但该词本身仍可表示能力、力量或威势；不具体化更能保留原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个呼语以“……的人哪”形成鲜明平行；分号保留希伯来诗句的两分结构。脚注只说明גְּבוּרָה的主要词义选择。
