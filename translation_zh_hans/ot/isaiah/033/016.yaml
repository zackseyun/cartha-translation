reference: Isaiah 33:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ה֚וּא מְרוֹמִ֣ים יִשְׁכֹּ֔ן מְצָד֥וֹת סְלָעִ֖ים מִשְׂגַּבּ֑/וֹ לַחְמ֣/וֹ נִתָּ֔ן מֵימָ֖י/ו נֶאֱמָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/016.yaml
  text: He will dwell on the heights[a]; rocky fortresses will be his refuge; his bread will be given[b], his water will be sure.
translation:
  language: zh_hans
  text: 他必住在高处；岩石的堡垒是他的避难所[a]；他的饼必得供应，他的水必定充足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “避难所”也可译作“坚固据点”或“保障”；原词指高而安全、可供保护的地方。
    reason: lexical_alternative
  - marker: b
    text: “必定充足”直译可作“可靠”或“稳妥”；此处指水的供应不会断绝。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: 他
  rationale: 承接上一节所描写的行义之人，保留希伯来文阳性单数指代，不另行限定为上帝、弥赛亚或某一群体。
- source_word: מְרוֹמִים
  choice: 在高处
  rationale: 该复数名词指高地或高处；译文保留空间上的高峻意象，也与全节的安全保障主题相合。
- source_word: יִשְׁכֹּן
  choice: 必住
  rationale: Qal未完成式表示居住、安居；在应许语境中用“必住”自然表达将来的稳固状态。
- source_word: מְצָדוֹת סְלָעִים
  choice: 岩石堡垒
  rationale: 构词结构直译为“岩石的堡垒”，这里用自然简洁的中文保留坚固、难以攻取的岩地防御意象。
- source_word: מִשְׂגַּבּוֹ
  choice: 他的保障
  rationale: 该词指高而安全的庇护处或坚固据点。鉴于前文已有“岩石堡垒”，正文用“保障”突出保护功能，并在脚注保留“避难所／坚固据点”的词义可能。
- source_word: לַחְמוֹ
  choice: 他的饼
  rationale: 保留具体名词“饼”，而不泛化为“食物”；在本节中代表维持生命的供应。
- source_word: נִתָּן
  choice: 必有供应
  rationale: Niphal形式具有被给予、获供应之意；结合上下文的应许语气，译为“必有供应”比生硬的“必被给予”更符合现代汉语。
- source_word: מֵימָיו
  choice: 他的水
  rationale: מַיִם虽为复数形态，通常表示不可数的“水”；中文采用单数集合表达。
- source_word: נֶאֱמָנִים
  choice: 必不短缺
  rationale: 该词基本义为可靠、稳固、可信；用于水源时，意指供应可靠、不会断绝。正文采用符合汉语搭配的功能性表达，脚注保留较形式对应的译法。
theological_decisions:
- issue: 阳性单数代词所指
  choice: 指上一节所描写的行义之人
  alternative: 泛指义人，或按预表理解为忠信余民
  rationale: 以赛亚书33:15列出这人的品格，16节接着陈述他所得的保障和供应。译文保留“他”，不把经文本身未明确提出的上帝、弥赛亚或余民身份加入正文。
- issue: 保障与供应的性质
  choice: 按经文直陈为安全居所与可靠的日用供应
  alternative: 将高处、饼和水完全灵意化
  rationale: 原文首先使用具体的地势、防御、食物和水源意象；译文保留这些具体内容，不排除其神学含义，却不在翻译中把它们改写为特定的属灵象征。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“岩石堡垒”保留原文险峻坚固的图像；“必有供应”“必不短缺”使被动供应和水源可靠的含义在普通读者看来清楚自然。所有脚注标记均已置于正文对应位置。
