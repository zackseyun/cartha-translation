  yaml_path: translation/ot/isaiah/033/012.yaml
  text: And the peoples will become burnings of lime; like cut thornbushes[a], they will be burned in the fire.
translation:
  language: zh_hans
  text: 列邦必像烧制的石灰；又像砍下的荆棘，在火中被焚烧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被点燃”或“着火”。希伯来语动词既可着重于着火，也可着重于被火焚毁。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: 必像……烧成
  rationale: היה 与谓语名词连用，在此表达审判所造成的结果或状态变化；中文以“必像……烧成”自然呈现这种转变，并与后半节的明喻协调。
- source_word: עַמִּים
  choice: 列邦
  rationale: 复数 עַמִּים 指众多民族或邦国；“列邦”保留集体性和复数范围，也符合庄重的先知诗歌语体。
- source_word: מִשְׂרְפוֹת שִׂיד
  choice: 像石灰烧成灰烬
  rationale: 该短语字面高度凝缩，可指石灰的焚烧或焚烧后的产物。结合烧制石灰的毁灭性图景，译文保留石灰经火烧成的意象；“灰烬”表达彻底焚毁的结果，而不误解为现代成品石灰正在燃烧。
- source_word: קוֹצִים כְּסוּחִים
  choice: 砍下的荆棘
  rationale: קוֹצִים 可指荆棘或带刺灌木，כְּסוּחִים 表示被割下、砍下；“砍下的荆棘”简洁呈现易燃的枯枝灌木图景。
- source_word: בָּאֵשׁ
  choice: 在火中
  rationale: 介词在此最自然地表达处所，描绘荆棘投入火中的场景。
- source_word: יִצַּתּוּ
  choice: 燃烧
  rationale: 该动词可着重于被点燃、着火或被烧掉。正文用中性而自然的“燃烧”，保留过程与结果之间的语义张力；脚注列出较明确的替代理解。
theological_decisions: []
