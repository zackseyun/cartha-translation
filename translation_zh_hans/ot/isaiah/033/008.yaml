base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/008.yaml
  text: The highways lie desolate[a]; the traveler has ceased from the road. He has broken the covenant, despised the cities[b], and regarded no man.
translation:
  language: zh_hans
  text: 大路荒凉，行路的人绝迹了。他毁约，藐视城邑[a]，不顾念任何人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些古代译本所反映的读法可译作“藐视见证人”；马所拉文本作“城邑”。
    reason: textual_variant
  - marker: b
    text: 希伯来文 אֱנוֹשׁ 是单数，指人或必死的人；这里具有泛指作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ מְסִלּוֹת
  choice: 大路荒凉
  rationale: נָשַׁמּוּ表示陷入荒凉、无人使用的状态；מְסִלּוֹת指供公众往来的大道。译作“大路荒凉”简洁自然，并保留结果状态。
- source_word: שָׁבַת עֹבֵר אֹרַח
  choice: 行路的人绝迹了
  rationale: 字面为“经过道路的人止息了”。“绝迹了”在现代汉语中自然地表达再没有旅人通行，也与上句道路荒凉的景象衔接。
- source_word: הֵפֵר בְּרִית
  choice: 他毁了约
  rationale: הֵפֵר意为破坏、废弃或违背，בְּרִית可指盟约或条约。此处用“约”保留其范围，不把语境限定为纯政治条约。
- source_word: מָאַס עָרִים
  choice: 藐视城邑
  rationale: 马所拉文本作עָרִים“城邑”。מָאַס表达厌弃或轻蔑；“藐视城邑”既贴近原文，也符合庄重的现代汉语。
- source_word: לֹא חָשַׁב אֱנוֹשׁ
  choice: 不把世人放在眼里
  rationale: חָשַׁב在此表示看重、顾念；אֱנוֹשׁ是指脆弱必死之人的单数集合性用语。“不把世人放在眼里”自然传达完全不顾惜人的意思。
theological_decisions:
- issue: 本节后半句三个单数动词的主语
  choice: 以未加说明的“他”承接
  alternative: 明确译为“敌人”“背约者”或亚述王
  rationale: 希伯来文本只有阳性单数动词，并未在本节明说主语。译作“他”维持这种指代上的开放性，避免从上下文擅自补入具体身份。
- issue: אֱנוֹשׁ的集合性所指
  choice: 世人
  alternative: 一个人；凡人；任何人
  rationale: 原词形式为单数，但在否定句中具有泛指人类个体的力量。“世人”保留其人类、必死之人的语义，同时避免让中文误解为仅仅不看重某一个特定的人。
- issue: בְּרִית的语境范围
  choice: 约
  alternative: 盟约；条约
  rationale: 本节可能涉及政治协定，但原词也是重要而宽泛的圣经用语。“约”既可涵盖政治之约，也不武断排除更广的盟约意味。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大路荒凉”“行路的人绝迹了”形成简洁的平行画面；后半句保留未明说身份的“他”。脚注标记均置于相关词语之后。
