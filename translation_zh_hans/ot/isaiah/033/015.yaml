id: ISA.33.15
reference: Isaiah 33:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֹלֵ֣ךְ צְדָק֔וֹת וְ/דֹבֵ֖ר מֵֽישָׁרִ֑ים מֹאֵ֞ס בְּ/בֶ֣צַע מַעֲשַׁקּ֗וֹת נֹעֵ֤ר כַּפָּי/ו֙ מִ/תְּמֹ֣ךְ בַּ/שֹּׁ֔חַד אֹטֵ֤ם אָזְנ/וֹ֙ מִ/שְּׁמֹ֣עַ דָּמִ֔ים וְ/עֹצֵ֥ם עֵינָ֖י/ו מֵ/רְא֥וֹת בְּ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/015.yaml
  text: He who walks in righteousness and speaks what is upright[a], who despises gain from extortions, who shakes his hands free from taking a bribe, who stops his ears from hearing of bloodshed[c][b], and shuts his eyes from looking on evil—
translation:
  language: zh_hans
  text: 那行公义[a]、说正直的话的人，厌恶靠欺压得来的财利[b]，摆手拒收贿赂，塞住耳朵不听流血之事[c]，闭上眼睛不看邪恶——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行公义”也可译作“行公义的事”或“秉行正义”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“勒索所得的利益”或“欺压人的不义之财”。
    reason: lexical_alternative
  - marker: c
    text: “流血”原文为复数的“血”，可指流血、杀戮或血债。
    reason: cultural_note
lexical_decisions:
- source_word: הֹלֵךְ צְדָקוֹת
  choice: 行公义
  rationale: 保留希伯来语以“行走”表达生活方式的伦理意象，同时用现代汉语自然的“行公义”表达持续按公义而活；复数形式也可能侧重公义之举，故收入脚注。
- source_word: וְדֹבֵר מֵישָׁרִים
  choice: 说正直话
  rationale: מֵישָׁרִים 可指正直、公平或正直之事；“说正直话”既自然，也保留言语在道德上的正直含义。
- source_word: מֹאֵס
  choice: 厌恶
  rationale: 该词不只是拒绝，也带有强烈的道德反感；“厌恶”保留这一力度。
- source_word: בְּבֶצַע מַעֲשַׁקּוֹת
  choice: 欺压所得的财利
  rationale: בֶּצַע 指利益、财利，常含不义色彩；מַעֲשַׁקּוֹת 是欺压或勒索行为的复数。“欺压所得的财利”清楚呈现所得及其来源，同时不把范围限于一种勒索形式。
- source_word: נֹעֵר כַּפָּיו מִתְּמֹךְ בַּשֹּׁחַד
  choice: 甩手不受贿赂
  rationale: 保留“甩手”的鲜明肢体意象，并以“不受贿赂”说明动作所表示的拒绝；תמך 在此是拿取、抓住或接受。
- source_word: אֹטֵם אָזְנוֹ מִשְּׁמֹעַ דָּמִים
  choice: 塞耳不听流血之事
  rationale: “塞耳”贴近希伯来语主动堵住耳朵的形象；דָּמִים 字面为复数“血”，惯用上可指流血、杀戮或血债，此处用“流血之事”保留一定范围。
- source_word: וְעֹצֵם עֵינָיו מֵרְאוֹת בְּרָע
  choice: 闭眼不看邪恶
  rationale: 直译其主动拒绝观看邪恶的动作，不额外限定为参与、欣赏或旁观中的某一种。
theological_decisions:
- issue: 一连串阳性单数分词的主语表达
  choice: 那……的人，他……
  alternative: 凡……的人；行……者
  rationale: 希伯来语以阳性单数分词描写一个具有这些品格的人。汉语采用代表性单数“那……的人”，并补出“他”以维持句法清晰，不将经文改写为纯抽象德目。
- issue: צְדָקוֹת 的公义、正义与公义行为之张力
  choice: 公义
  alternative: 正义；公义的事
  rationale: 本节整体描写人的伦理品格，“公义”覆盖面较广；原文复数也可能强调具体公义行为，因此以脚注保留这一可能。
- issue: מִשְּׁמֹעַ דָּמִים 所指范围
  choice: 不听流血之事
  alternative: 不听流血的图谋；不听血债之事
  rationale: 上下文强调拒绝邪恶，但原文没有明说是“图谋”、命令还是消息；主文保留较宽表达，避免把参与暴力计划这一合理推断写成唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用“行公义”“甩手”“塞耳”“闭眼”维持原文连续而具体的伦理动作意象；破折号保留本节通向下一节结果陈述的未完句势。
