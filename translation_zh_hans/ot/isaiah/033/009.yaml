base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/009.yaml
  text: The land mourns and withers[a]; Lebanon is ashamed and withers away. Sharon has become like the Arabah[b], and Bashan and Carmel shake off their leaves.
translation:
  language: zh_hans
  text: '这地哀恸而凋残；

    黎巴嫩蒙羞而枯萎。

    沙仑变得像亚拉巴[a]；

    巴珊和迦密抖落叶子[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚拉巴”也可译为“荒原”或“旷野”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“巴珊和迦密抖落”；所抖落的对象未明说，按上下文可理解为叶子或枝叶。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַל
  choice: 悲哀
  rationale: 该动词通常表示哀恸、悲伤；用于“大地”时保留了原文的拟人表达，也暗含荒凉景象。
- source_word: אֻמְלְלָה
  choice: 衰残
  rationale: 该词可表示衰弱、凋残或枯萎；“衰残”既适用于大地，又与后文草木枯萎的意象相呼应。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 本节描写遭受灾祸的地域；“大地”比“地球”准确，并能自然承接拟人化的“悲哀”。
- source_word: הֶחְפִּיר
  choice: 蒙羞
  rationale: 该动词表示羞愧、受辱或狼狈；“蒙羞”保留黎巴嫩被拟人化的诗意。
- source_word: לְבָנוֹן
  choice: 黎巴嫩
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: קָמַל
  choice: 枯萎
  rationale: 该词用于植物凋谢、干枯；此处描写以繁茂著称的黎巴嫩衰败。
- source_word: הַשָּׁרוֹן
  choice: 沙仑
  rationale: 采用该地区名称的中文通行译法，不把冠词另行译出。
- source_word: כָּעֲרָבָה
  choice: 像亚拉巴
  rationale: עֲרָבָה既可指约旦裂谷一带的亚拉巴地区，也可泛指干旱荒原；正文保留地理名称，脚注说明其词义范围。
- source_word: נֹעֵר
  choice: 抖落了叶子
  rationale: 该动词本义为抖动、抖落。原文未明说所抖落的对象，但上下文描写植被衰败，因此正文补出“叶子”，同时以脚注保留原文的简约表达。
- source_word: בָּשָׁן
  choice: 巴珊
  rationale: 采用该地区名称的中文通行译法。
- source_word: כַרְמֶל
  choice: 迦密
  rationale: 采用该地名的中文通行译法；原文此处没有明说“山”，故不增译。
theological_decisions: []
translation_notes:
