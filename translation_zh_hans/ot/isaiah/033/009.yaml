  to: '这地哀恸而凋残；

    黎巴嫩蒙羞而枯萎。

    沙仑变得像亚拉巴[a]；

    巴珊和迦密抖落叶子[b]。'
  rationale: 修订保持原有的四行诗体、地名及拟人表达，仅使“地”的范围更符合语境，并以较不限定时态的措辞译出“抖落”。脚注明确叶子／枝叶是由上下文补足，避免把原文未表达的“尽都脱落”当作明示内容。
