  text: עַתָּ֥ה אָק֖וּם יֹאמַ֣ר יְהוָ֑ה עַתָּה֙ אֵֽרוֹמָ֔ם עַתָּ֖ה אֶנָּשֵֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/010.yaml
  text: Now I will arise[a], says Yahweh; now I will be exalted; now I will lift myself up.
translation:
  language: zh_hans
  text: 雅威说：“如今我要起来[a]；如今我要被尊崇；如今我要高举自己。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末尾两个希伯来语动词意义相近，但词根和语态不同。这里分别译为“被尊崇”和“高举自己”；也可有“升高”“被高举”等不同译法。
    reason: 说明末两动词的近义关系及可容许的语态、词义差异，避免将其诗性递进限定为单一解释。
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 表示行动即刻发生的时间副词；三次均保留，以再现原文的重复、节奏和递进力量。
- source_word: אָקוּם
  choice: 我要起来
  rationale: קום 的 Qal 未完成式第一人称单数，描写雅威起身采取决定性行动；“起来”自然且保留庄重语气。
- source_word: יֹאמַר יְהוָה
  choice: 雅威说
  rationale: 按希伯来语语序保留插入式先知宣告公式；以“雅威”音译四字神名，区别于作为称号的“主”。
- source_word: אֵרוֹמָם
  choice: 我要升高
  rationale: רום 的形式在这里表达升至高处或显为崇高；“升高”既可自然地指位置或地位的上升，也不强行补入使动或外在施动者。
- source_word: אֶנָּשֵׂא
  choice: 我要被高举
  rationale: נשׂא 的 Niphal 未完成式第一人称单数具有被动或中间态意味；“被高举”与前面的“升高”有所区别，同时保留两词意义紧密相连的诗性递进。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；“雅威”是现代汉语中较贴近通行学术重构的音译，也避免用称号取代专名。
- issue: 末尾两个升高动词的区分
  choice: 将 אֵרוֹמָם 译为“我要升高”，将 אֶנָּשֵׂא 译为“我要被高举”
  alternative: 分别译为“我要受尊崇”和“我要高高升起”，或将两者都概括为“我要被高举”
  rationale: 两个动词意义相近但词根和语态不同。正文作适度区分，以保留原文递进；脚注说明其他可行理解，不把诗句限定为某一种神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的先知诗歌语体。三次重复“现在”并保留三个短分句，突出雅威即刻介入以及语势逐步上扬；引语中的插入式“雅威说”贴近原文结构。
