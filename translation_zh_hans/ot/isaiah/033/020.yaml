base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/020.yaml
  text: Look upon Zion[a], the city of our appointed feasts; your eyes will see Jerusalem, a quiet habitation, a tent that will not be moved; its stakes will never be pulled up[c][b], and none of its ropes will be torn apart.
translation:
  language: zh_hans
  text: 你要观看锡安[a]，我们举行节期的城；你的眼睛必看见耶路撒冷：安宁的居所[b]，永不挪移的帐篷；它的橛子永远不会被拔起[c]，它所有的绳索一根也不会被扯断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们举行节期的城”也可译作“我们举行圣会的城”或“我们过节的城”。希伯来语 מוֹעֲדֵנוּ 可指指定的时间或聚会，在这里尤其带有敬拜节期的意味。
    reason: lexical_alternative
  - marker: b
    text: “安宁的居所”也可译作“安稳的居所”；原词可表示安逸、不受侵扰或安全稳妥。
    reason: lexical_alternative
  - marker: c
    text: 这里以帐篷描绘耶路撒冷的长久稳固：橛子不被拔起，绳索也不被扯断。
    reason: cultural_note
lexical_decisions:
- source_word: חֲזֵה
  choice: 你要观看
  rationale: 保留第二人称阳性单数命令式的直接呼召；“观看”庄重而自然，比单纯“看见”更能体现主动注目。
- source_word: קִרְיַת מוֹעֲדֵנוּ
  choice: 我们守节的城
  rationale: מוֹעֵד可指指定的时间或聚会，在锡安敬拜语境中尤指按时举行的节期；“守节的城”兼顾节期和群体敬拜含义。
- source_word: עֵינֶיךָ תִרְאֶינָה
  choice: 你的眼睛必看见
  rationale: 保留原文以“你的眼睛”为主语的具身强调，并以“必”表达未完成式在预言语境中的确定将来意味。
- source_word: נָוֶה שַׁאֲנָן
  choice: 安宁的居所
  rationale: נָוֶה在此指居所；שַׁאֲנָן含安逸、不受侵扰或安稳之意。“安宁”不把含义缩限为军事安全。
- source_word: אֹהֶל בַּל יִצְעָן
  choice: 不再迁移的帐篷
  rationale: אֹהֶל按普通意义译作“帐篷”；罕见动词יצען在语境中表达迁动、漂移或被挪动。“不再迁移”保留营帐意象及稳定性的反差。
- source_word: בַּל יִסַּע יְתֵדֹתָיו לָנֶצַח
  choice: 它的橛子永远不会拔起
  rationale: נסע与帐篷橛子连用，指拔营时将橛子拔起；“永远不会拔起”清楚表达持续不变。
- source_word: וְכָל חֲבָלָיו בַּל יִנָּתֵקוּ
  choice: 它所有的绳索一根也不会扯断
  rationale: חבלים指固定帐篷的绳索；נתק的被动形态表达被扯断或挣断。汉语用“一根也不会”自然呈现原文“所有……不”的全称否定。
theological_decisions:
- issue: 锡安和耶路撒冷意象的性质
  choice: 按原文直译为耶路撒冷安宁、稳固的应许，并保留帐篷、橛子和绳索的连续比喻。
  alternative: 将帐篷语言明确解释为末世上帝的子民，或将其限定为历史政治复兴。
  rationale: 本节本身以不可迁动的帐篷描绘锡安的稳定，却未在措辞中明确限定其历史或末世层面；译文不替读者消解这种神学张力。
translation_notes:
  register: 采用现代标准普通话和庄重的经文语体。句子保持呼召、应许和帐篷意象的推进；避免“会幕”等可能额外引入专门宗教含义的译词。所有脚注标记均已置于正文相应位置。
