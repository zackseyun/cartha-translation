  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נִשְׂגָּ֣ב יְהוָ֔ה כִּ֥י שֹׁכֵ֖ן מָר֑וֹם מִלֵּ֣א צִיּ֔וֹן מִשְׁפָּ֖ט וּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/005.yaml
  text: Yahweh is exalted[a], for he dwells on high; he has filled Zion with justice and righteousness.
translation:
  language: zh_hans
  text: 耶和华崇高，因他居于高处；他使锡安充满公平和公义。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשְׂגָּב
  choice: 崇高
  rationale: 该词在此为状态意义，既保留高举、高远的空间意象，也表达耶和华尊荣至高的地位；“崇高”简洁庄重。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中最通行的专名形式呈现四字神名，避免以称号代替原文专名。
- source_word: כִּי
  choice: 因
  rationale: 此处引出前句所述“崇高”的依据；“因”准确而符合诗体的凝练语气。
- source_word: שֹׁכֵן מָרוֹם
  choice: 他居于高处
  rationale: 分词表达持续居住的状态，מָרוֹם 指高处或高天；译文保留原文的垂直空间意象。
- source_word: מִלֵּא
  choice: 他使……充满
  rationale: 皮尔完成式表达使某处充满某物的动作，并可含完成后持续生效的意味；“使……充满”清楚呈现使役关系。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的地名译法，保留其历史与盟约诗歌意涵。
- source_word: מִשְׁפָּט
  choice: 公平
  rationale: 在与 צְדָקָה 的固定搭配中，指合乎正道的裁断及社会秩序；“公平”自然明白，并与“公义”保持区别。
- source_word: צְדָקָה
  choice: 公义
  rationale: 表达道德正直及符合正道的品格与行为；“公义”是现代中文神学及圣经语体中清楚、稳定的对应词。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文正文采用广为读者熟悉的“耶和华”，既以专名而非称号呈现，也避免正文出现较陌生的音译形式。
- issue: מִשְׁפָּט וּצְדָקָה 这一词组的区分
  choice: 公平和公义
  alternative: 正义和公义
  rationale: 两个希伯来词意义相关但并不相同；分别译为“公平”和“公义”，保留社会治理、正确裁断与道德正直这两方面，而不把二者合并为同一概念。
- issue: נִשְׂגָּב 与 שֹׁכֵן מָרוֹם 的关系
  choice: 崇高，因他居于高处
  alternative: 被尊为高，因他住在高天
  rationale: 前者可表达上帝本有的至高状态，后者以居于高处说明这种崇高；译文不将其限定为人对上帝的尊崇，也不消除空间意象与尊荣含义之间的张力。
translation_notes:
  register: 采用凝练、庄重而自然的现代标准汉语，保留希伯来诗句中“崇高／高处”的呼应。句号前以分号连接宣告及其在锡安中的结果。正文没有脚注，因此无需脚注标记。
