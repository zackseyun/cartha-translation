  text: פָּחֲד֤וּ בְ/צִיּוֹן֙ חַטָּאִ֔ים אָחֲזָ֥ה רְעָדָ֖ה חֲנֵפִ֑ים מִ֣י יָג֣וּר לָ֗/נוּ אֵ֚שׁ אוֹכֵלָ֔ה מִי יָג֥וּר לָ֖/נוּ מוֹקְדֵ֥י עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/014.yaml
  text: 'Sinners in Zion are afraid[d][c][b][a]; trembling has seized the godless: “Who among us can dwell with a consuming fire? Who among us can dwell with everlasting burnings?”'
translation:
  language: zh_hans
  text: '锡安的罪人害怕；战兢抓住了不敬虔的人[a]。


    “我们中间谁能与吞噬的火[c]同住[b]？


    我们中间谁能与永远的烈焰[d]同住？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不虔诚的人”或“假冒为善的人”。这个希伯来词可指不敬神、不虔诚的人，并不只指言行不一的人。
    reason: lexical_alternative
  - marker: b
    text: “同住”也可译作“寄居”或“长久居留”。
    reason: lexical_alternative
  - marker: c
    text: “吞噬的火”呼应圣经中用火描写神圣洁并施行审判的临在；参申命记4:24；希伯来书12:29。
    reason: cross_reference
  - marker: d
    text: 或译“永恒的焚烧”或“不息的火焰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּחֲדוּ בְצִיּוֹן חַטָּאִים
  choice: 锡安的罪人都害怕
  rationale: 按希伯来语语序和处境保留“锡安”这一地点；完成式在此表达恐惧已经临到并持续存在的状态，用“都害怕”自然呈现。
- source_word: אָחֲזָה רְעָדָה
  choice: 战兢抓住了
  rationale: 保留“抓住、攫住”的具体意象，而不将其弱化为抽象的“感到恐惧”。
- source_word: חֲנֵפִים
  choice: 不敬虔的人
  rationale: 该词在这里指不虔敬、悖逆神的人，不只指言行不一者；“不敬虔的人”兼顾宗教和道德含义。
- source_word: מִי יָגוּר לָנוּ
  choice: 我们中间谁能……同住
  rationale: לָנוּ在此自然理解为群体内部的“我们中间”，גור可指寄居或居住；“同住”也与后文关于谁能安居的回答相衔接。
- source_word: אֵשׁ אוֹכֵלָה
  choice: 吞噬人的烈火
  rationale: 保留“火”及分词“吞噬”的动态意象；补出“人”使现代汉语表达自然，但不明说这火的所指。
- source_word: מוֹקְדֵי עוֹלָם
  choice: 永远燃烧的烈焰
  rationale: 以复数意味浓厚的“烈焰”呈现持续燃烧的强烈图景，并用“永远”保留עוֹלָם所表达的持久性。
theological_decisions:
- issue: “吞噬人的烈火”和“永远燃烧的烈焰”所指为何
  choice: 正文保留火焰隐喻，不直接把它改写成神或某一种特定刑罚；注释指出它呼应神圣洁而施行审判的临在。
  alternative: 将其明确译为神的审判之火，或解释为锡安祭坛上的火。
  rationale: 上下文表明恶人惧怕耶和华在锡安的临在，下一节则说明谁能安居；但本节诗句本身仍以火为隐喻，译文不应消除这一张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。诗行保留平行结构和火焰意象；“他们说”是为引出直接引语而作的最小限度补足。所有词义替代和神学提示均置于脚注，不在正文中消解原文的歧义。
