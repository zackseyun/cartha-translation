  text: כִּ֤י יְהוָה֙ שֹׁפְטֵ֔/נוּ יְהוָ֖ה מְחֹקְקֵ֑/נוּ יְהוָ֥ה מַלְכֵּ֖/נוּ ה֥וּא יוֹשִׁיעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/022.yaml
  text: For Yahweh is our judge[a]; Yahweh is our lawgiver; Yahweh is our king[b]; he will save us.
translation:
  language: zh_hans
  text: '因为雅威[a]是我们的审判者，

    雅威是我们的立法者[b]，

    雅威是我们的王；

    他必拯救我们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来神名 יהוה（YHWH）的拟音；汉语传统常译作“耶和华”，有些译本以“主”代替。
    reason: alternative_reading
  - marker: b
    text: “立法者”也可译作“为我们制定律法者”；在某些语境中，这个词也可指“统治者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明理由；“因为”在现代汉语中自然地保留了原文的解释性连接作用。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来神名四字母 YHWH 的通行学术拟音处理为专名，避免以“主”这一称号取代原文中的名字；全节三次重复，以保留原文的修辞力度。
- source_word: שֹׁפְטֵנוּ
  choice: 我们的审判者
  rationale: 保留司法职分及名词性表达，与下文“律法颁布者”和“王”形成并列。
- source_word: מְחֹקְקֵנוּ
  choice: 我们的律法颁布者
  rationale: 该词源于颁定、刻写法令的语义领域；此译法既表达制定并颁布律法的职分，也避免“立法者”过强的现代议会色彩。
- source_word: מַלְכֵּנוּ
  choice: 我们的王
  rationale: 直接保留原文的君王意象，并维持三重职分称谓的递进结构。
- source_word: הוּא
  choice: 他
  rationale: 保留原文明示的代词，使末句成为对前三个称谓的总结和高潮。
- source_word: יוֹשִׁיעֵנוּ
  choice: 必拯救我们
  rationale: 未完成式在此表达有把握的将来行动；“必”传达确定性，“拯救”同时保留现实解救与神学救恩的语义空间。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用的是神的专名，而非“主”这一称号，因此正文采用接近 YHWH 通行拟音的“雅威”。脚注说明汉语传统译名，以兼顾读者熟悉度而不取代原文专名。
- issue: מְחֹקְקֵנוּ 的职分含义
  choice: 我们的律法颁布者
  alternative: 我们的立法者；我们的统治者
  rationale: 上下文把审判、颁定律法和王权并列。“律法颁布者”保留其中独立的法律职分，不把它泛化为“统治者”，也不将其限定为现代政治制度中的议员。
- issue: 末句救恩行动的时态与力度
  choice: 他必拯救我们
  alternative: 他要拯救我们；他解救我们
  rationale: 原文形式指向将来或结果性的行动；“必”符合诗性宣告的确定语气，但不额外限定拯救仅是政治、军事或属灵意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“雅威”三次重复及三项职分的平行结构，并以分行呈现诗体节奏；不把原文的司法、立法与王权意象合并或作宗派化解释。
