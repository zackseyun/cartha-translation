  to: 但在那里，威严的雅威必成为我们的江河之地[a]，有宽阔的水道[b]；划桨的船[c]不能航行其上，强大的船只也不能穿过。
  rationale: 仅作两项安全修订：以“强大的船只”避免“舰船”的不当军事专指；重写脚注a，使其真正反映原文无系词及形容词句法关系的余地，而不加入原文没有的“彰显威荣”。其余正文保留原有对水域隐喻、船只意象和脚注锚点的处理。
