id: ISA.33.21
reference: Isaiah 33:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אִם שָׁ֞ם אַדִּ֤יר יְהוָה֙ לָ֔/נוּ מְקוֹם נְהָרִ֥ים יְאֹרִ֖ים רַחֲבֵ֣י יָדָ֑יִם בַּל תֵּ֤לֶךְ בּ/וֹ֙ אֳנִי שַׁ֔יִט וְ/צִ֥י אַדִּ֖יר לֹ֥א יַעַבְרֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/021.yaml
  text: But there the majestic Yahweh will be for us a place of rivers[a], of broad streams, where no rowing ship can go[c][b], and no mighty vessel can pass through.
translation:
  language: zh_hans
  text: 但在那里，威严的雅威必成为我们的江河之地[a]，有宽阔的水道[b]；划桨的船[c]不能航行其上，强大的船只也不能穿过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那里，威严的雅威必为我们成为江河与宽阔水道之地。”原文没有明示系词；“威严的”也可理解为对雅威的述语性描述。
    reason: 保留名词句及 אַדִּיר 与 יהוה 关系的句法余地，同时不改变雅威成为保护性水域之地的隐喻。
  - marker: b
    text: “宽阔”原文直译为“双手（或两边）宽阔”，是形容水域十分宽广的说法。
    reason: 说明希伯来语习语，避免读者误解字面意象。
  - marker: c
    text: 或译：“有桨的船”。原词组指用于航行、可能以桨推进的船只。
    reason: 保留船只类型在词义上的不确定性。
lexical_decisions:
- source_word: כִּי אִם
  choice: 但
  rationale: 此处承接上文并形成强烈转折；现代汉语用“但”简洁自然。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留指向锡安的地点强调。
- source_word: אַדִּיר יְהוָה
  choice: 威严的雅威
  rationale: אַדִּיר可表达威严、尊荣或强大；按最直接的句法理解，用它修饰神名，同时保留其庄严意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: לָנוּ
  choice: 我们的
  rationale: 将受益关系融入“成为我们的……之地”，表达雅威为其百姓提供保护。
- source_word: מְקוֹם נְהָרִים יְאֹרִים
  choice: 江河之地，有……水道
  rationale: 保留雅威成为防护性水域之“地”的大胆隐喻，并区分两组水域词。
- source_word: רַחֲבֵי יָדָיִם
  choice: 宽阔的
  rationale: 该短语字面为“双手／两边宽阔”，在此是形容水道十分宽广的习语。
- source_word: אֳנִי שַׁיִט
  choice: 划桨的船
  rationale: שַׁיִט指主动航行或以桨推进的船只；此译法通俗清楚，又不限定为某一特定古代船型。
- source_word: וְצִי אַדִּיר
  choice: 威武的舰船
  rationale: צִי指船只，אַדִּיר在此强调其强大、壮观；“舰船”也传达潜在的军事威胁。
- source_word: לֹא יַעַבְרֶנּוּ
  choice: 也不能经过
  rationale: 保留否定和穿越水域的动作；宾语由上文的江河水道自然补足。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较贴近学界通常重构的读音，并避免以“主”这一称号取代专名。
- issue: 雅威与江河水道之间的隐喻关系
  choice: 雅威必成为我们的江河之地
  alternative: 雅威必像江河水道一样保护我们
  rationale: 原文采用直接认同式的隐喻，而不是明说“像”或解释“保护”；正文保留这种诗性张力。
- issue: אַדִּיר 与 יְהוָה 的句法关系
  choice: 威严的雅威
  alternative: 雅威必在那里为我们彰显威荣
  rationale: 原文无明示系词，אַדִּיר既可看作修饰神名，也可作表语；正文采用较直接的定语读法，脚注保留另一可能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“江河之地”略带诗性，以保存原文将雅威直接描绘为防护水域之地的大胆隐喻；后半句使用“航行其上”“舰船”等自然水域用语。所有脚注标记均已置入正文。
