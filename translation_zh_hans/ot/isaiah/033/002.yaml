source:
  edition: WLC
  text: יְהוָ֥ה חָנֵּ֖/נוּ לְ/ךָ֣ קִוִּ֑ינוּ הֱיֵ֤ה זְרֹעָ/ם֙ לַ/בְּקָרִ֔ים אַף יְשׁוּעָתֵ֖/נוּ בְּ/עֵ֥ת צָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/002.yaml
  text: O Yahweh[a], be gracious to us; we wait for you. Be our arm every morning, also our salvation in the time of distress.
translation:
  language: zh_hans
  text: 耶和华啊，求你施恩给我们；我们等候你。求你每天清晨作他们的膀臂[a]，也在患难之时作我们的拯救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“他们的膀臂”。有些译本根据这段群体祷告的上下文译作“我们的膀臂”。
    reason: 说明原文突兀的人称转换及常见的上下文顺译。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代中文通行的专名“耶和华”译出神名；“啊”体现祷告中的直接呼求。
- source_word: חָנֵּנוּ
  choice: 求你施恩给我们
  rationale: חנן的祈使式请求恩惠；“施恩”既自然庄重，也避免把含义缩窄为单纯怜悯。
- source_word: לְךָ קִוִּינוּ
  choice: 我们等候你
  rationale: קוה含有带着盼望、信赖而等候之意；保留“等候”的动词意象，不把它完全解释为内在的盼望。
- source_word: זְרֹעָם
  choice: 他们的膀臂
  rationale: 按马所拉文本的第三人称阳性复数后缀译为“他们的”，并保留“膀臂”这一象征力量和施救能力的希伯来语意象。
- source_word: לַבְּקָרִים
  choice: 每天清晨
  rationale: 复数“清晨”在此表达反复、逐日发生的意思；“每天清晨”符合现代中文表达。
- source_word: יְשׁוּעָתֵנוּ
  choice: 我们的拯救
  rationale: יְשׁוּעָה可指救恩、解救；此处“拯救”既贴合患难中的搭救，也不排除更广的救恩含义。
- source_word: בְּעֵת צָרָה
  choice: 在患难之时
  rationale: 准确表达困苦、危难的时刻，语体庄重而易懂。
theological_decisions:
- issue: זְרֹעָם的人称后缀
  choice: 他们的膀臂
  alternative: 我们的膀臂
  rationale: 马所拉文本明确为第三人称复数“他们的”，因此正文保留从“我们”转为“他们”的人称变化，不擅自消除原文张力。鉴于上下文是群体祷告，有些译者将其理解为对祷告群体的集合性指称，并顺译为“我们的”；该理解收入脚注。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“膀臂”保留原文具体比喻；“每天清晨”自然传达逐日反复之意。
