  text: אֲדֹנָ֤/י יְהוִה֙ פָּתַֽח לִ֣/י אֹ֔זֶן וְ/אָנֹכִ֖י לֹ֣א מָרִ֑יתִי אָח֖וֹר לֹ֥א נְסוּגֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/005.yaml
  text: The Lord GOD has opened my ear[a], and I was not rebellious; I did not turn back.
translation:
  language: zh_hans
  text: 主耶和华开启了我的耳朵；我没有悖逆，也没有后退。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我没有退缩。”
    reason: 保留נסוגתי“退却、退缩”的自然中文替代译法；正文“后退”则明示保留אָחוֹר的方向性。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号的两个成分；以现代中文圣经语体中自然、庄重的“主耶和华”表达。
- source_word: פָּתַח לִי אֹזֶן
  choice: 开启了我的耳朵
  rationale: 保留希伯来文具体的“开启耳朵”意象，不抽象化为“使我听从”；“我的耳朵”自然表达字面的“为我一只耳朵”。
- source_word: מָרִיתִי
  choice: 悖逆
  rationale: 该词指反抗、悖逆；“没有悖逆”准确保留其意志与顺服层面的含义。
- source_word: אָחוֹר לֹא נְסוּגֹתִי
  choice: 没有退缩
  rationale: סוג表示向后退、退却；“退缩”自然传达面对使命不向后撤的意思，而“向后”已隐含在该词中。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上主／主雅威
  rationale: “主耶和华”既保留 אֲדֹנָי 的“主”，也用现代中文读者熟悉的专名形式呈现四字神名，避免把两个成分合并为单一称号。
- issue: “开启耳朵”是否解释为使仆人顺服
  choice: 保留“开启了我的耳朵”的意象
  alternative: 使我听从／使我受教
  rationale: 原文以具体意象表达领受与回应；直保留该意象可避免把其确切神学含义过早限定。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“开启了我的耳朵”略具诗性，符合先知书语体并保存原文意象；两个否定分句用“也”衔接，使朗读自然。
