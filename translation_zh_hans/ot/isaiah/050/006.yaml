base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/006.yaml
  text: I gave my back to those who strike[a], and my cheeks to those who pull out the beard; I did not hide my face from disgrace and spitting.
translation:
  language: zh_hans
  text: 我把背交给击打我的人，把双颊交给拔我毛发的人[a]；我没有掩面躲避羞辱和唾沫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“拔我胡须的人。”希伯来文没有明确说所拔的是胡须；但结合“双颊”来看，这很可能是其所指。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּוִי
  choice: 我的背
  rationale: גֵּו可指背部或身体；在遭受击打的语境中，“背”最自然、具体。
- source_word: נָתַתִּי
  choice: 我把……交给
  rationale: נתן基本义为“给”。汉语用“把……交给”既保留主动给予的表达，也自然呈现说话者自愿承受的语气，而不作过度解释。
- source_word: לְמַכִּים
  choice: 击打我的人
  rationale: 这是נכה的分词形式，指施加击打的人；“击打我的人”贴近原文且符合现代汉语。
- source_word: וּלְחָיַי
  choice: 我的双颊
  rationale: לְחִי指面颊或下颌部位；此处带第一人称复数性词尾，“双颊”准确而自然。
- source_word: לְמֹרְטִים
  choice: 拔毛的人
  rationale: מרט意为拔除、扯掉，常以毛发为对象，但本句未明说宾语。“拔毛”保留原文的省略与歧义，不把“胡须”直接写入正文。
- source_word: פָּנַי
  choice: 自己的脸
  rationale: פנים加第一人称词尾直译为“我的脸”；在“我没有遮掩”之后用“自己的脸”更符合自然汉语，所指不变。
- source_word: לֹא הִסְתַּרְתִּי
  choice: 我没有遮掩
  rationale: סתר的使役式表示隐藏、遮蔽；“没有遮掩”准确表达未把脸藏起来。
- source_word: מִכְּלִמּוֹת
  choice: 面对羞辱
  rationale: כְּלִמּוֹת表示羞耻、凌辱。介词מִן在此可表达面对某事而不躲避；译为“面对羞辱”使汉语关系清楚，同时保留受辱意象。
- source_word: וָרֹק
  choice: 唾沫
  rationale: רֹק是唾液、唾沫；“唾沫”具体呈现侮辱行为，比抽象的“吐唾沫”更贴近名词形式。
theological_decisions:
- issue: 是否在译文中明确弥赛亚或基督论应用
  choice: 保持希伯来文中仆人第一人称说话的层次，不明加“弥赛亚”或“耶稣”。
  alternative: 采用突出耶稣受难应验的措辞。
  rationale: 本节可作基督论理解，但希伯来文本本身没有明说说话者是耶稣；正文不应把后续神学认定直接加入原文。
- issue: 是否把לְמֹרְטִים的隐含对象确定为胡须
  choice: 正文译作“拔毛的人”，脚注说明很可能指拔胡须。
  alternative: 正文直接译作“拔我胡须的人”。
  rationale: 上下文中的“双颊”使胡须成为最可能的对象，但希伯来文没有明说“胡须”。正文保留省略，脚注提供最可能的具体理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我把……交给……，把……交给……”保留原文平行结构；后半句调整为“面对……，我没有……”以避免生硬，同时准确传达不躲避羞辱的意思。
