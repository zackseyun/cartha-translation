revisions:
- from: 看哪，你们这些点燃火焰、用火把[a]束腰的人！你们就行在自己火焰的光中，行在自己点燃的火把中吧！这是从我手中临到你们的：你们必躺卧在痛苦[b]之中。
  to: 看哪，你们这些点火、腰间束着火把[a]的人！你们去吧，走在自己火的光中，在你们所点燃的火把之间行走！这是从我手中临到你们的：你们必躺卧在痛苦[b]之中。
  rationale: 修订仅处理现代汉语的搭配和空间关系：“点火”替代冗余的“点燃火焰”，“腰间束着”使束腰意象自然可懂，并将第二个介词短语译为“在……之间”，避免“在火把中”的不当字面表达。未改变审判性反讽、神直接施行后果或关键词的歧义处理。
