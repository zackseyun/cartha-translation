source:
  edition: WLC
  text: הֵ֧ן כֻּלְּ/כֶ֛ם קֹ֥דְחֵי אֵ֖שׁ מְאַזְּרֵ֣י זִיק֑וֹת לְכ֣וּ בְּ/א֣וּר אֶשְׁ/כֶ֗ם וּ/בְ/זִיקוֹת֙ בִּֽעַרְתֶּ֔ם מִ/יָּדִ/י֙ הָיְתָה זֹּ֣את לָ/כֶ֔ם לְ/מַעֲצֵבָ֖ה תִּשְׁכָּבֽוּ/ן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/011.yaml
  text: 'Look[a], all of you who kindle a fire, who gird yourselves with burning arrows: walk in the light of your fire and among the arrows you have set ablaze[b]. This has come to you from my hand: you will lie down in torment.'
translation:
  language: zh_hans
  text: 看哪，你们这些点火、腰间束着火把[a]的人！你们去吧，走在自己火的光中，在你们所点燃的火把之间行走！这是从我手中临到你们的：你们必躺卧在痛苦[b]之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火把”或译“火星”“燃烧的木柴”，也可能指“火箭”。
    reason: זִיקוֹת的具体所指不确定，可表示火星、燃烧物或带火的投射物。
  - marker: b
    text: “痛苦”或译“忧伤”或“苦恼”。
    reason: מַעֲצֵבָה涵盖痛楚、忧伤和苦恼等相近含义。
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 作为指示兼感叹词，引出尖锐的宣告；“看哪”在现代中文中庄重而仍可理解。
- source_word: קֹדְחֵי אֵשׁ
  choice: 点燃火焰
  rationale: קדח的主动分词在此指点火、燃起火焰；译文保留主动行为及火的意象。
- source_word: מְאַזְּרֵי
  choice: 用……束腰
  rationale: אזר的基本义是束腰、系带；直译保留了以随后之物武装或装备自己的形象。
- source_word: זִיקוֹת
  choice: 火把
  rationale: 该词可指火星、燃烧物，也可能带有火焰投射物的意味。“火把”能与“束腰”和“点燃”搭配，并保留人为制造火光的意象；主要词义歧义列入脚注。
- source_word: לְכוּ
  choice: 行……吧
  rationale: הלך的命令式；“行”与“在光中”自然搭配，并能承载上下文中带审判意味的反讽命令。
- source_word: בְּאוּר אֶשְׁכֶם
  choice: 在自己火焰的光中
  rationale: אוּר可指光或火光；此译保留他们依赖自造之光的反讽。
- source_word: וּבְזִיקוֹת בִּעַרְתֶּם
  choice: 行在自己点燃的火把中
  rationale: בער在此为点燃、使燃烧；重复“火把”维持与前半句的词汇对应。
- source_word: מִיָּדִי
  choice: 从我手中
  rationale: 保留希伯来文“从我的手”这一直接表达，突出说话者亲自施行后果，而不扩展解释。
- source_word: לְמַעֲצֵבָה
  choice: 在痛苦之中
  rationale: 该名词表示痛楚、忧伤或苦恼；“痛苦”兼具身体与内心层面，不把含义限定得过窄。
- source_word: תִּשְׁכָּבוּן
  choice: 你们必躺卧
  rationale: 直译שכב的动作意象，并以“必”表达此处宣告后果的确定语气。
theological_decisions:
- issue: “行在自己火焰的光中”的命令语气
  choice: 译为带审判性反讽的命令：“你们就……吧”
  alternative: 理解为中性的许可或邀请
  rationale: 随后“从我手中临到你们”及“必躺卧在痛苦之中”表明这不是赞许，而是对他们所选道路及其结局的讽刺性宣判。
- issue: “从我手中”所指的施事者
  choice: 保留第一人称，让上下文表明是神所施行的后果
  alternative: 在正文中明说“从神手中”或弱化为“从我而来”
  rationale: 先知话语的语境指向神，但原文只说“我的手”；直译既保留神圣审判，也不额外补入说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“束腰”“从我手中”“躺卧”等原文意象；用“就……吧”传达命令中的反讽审判色彩，同时以脚注保留זִיקוֹת和מַעֲצֵבָה的真实词义范围。
