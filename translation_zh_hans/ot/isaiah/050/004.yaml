id: ISA.50.4
reference: Isaiah 50:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהֹוִ֗ה נָ֤תַן לִ/י֙ לְשׁ֣וֹן לִמּוּדִ֔ים לָ/דַ֛עַת לָ/ע֥וּת אֶת יָעֵ֖ף דָּבָ֑ר יָעִ֣יר בַּ/בֹּ֣קֶר בַּ/בֹּ֗קֶר יָעִ֥יר לִ/י֙ אֹ֔זֶן לִ/שְׁמֹ֖עַ כַּ/לִּמּוּדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/004.yaml
  text: The Lord GOD has given me the tongue of those who are taught[a], that I may know how to sustain the weary with a word. Morning by morning he awakens[c][b]; he awakens my ear to hear like those who are taught.
translation:
  language: zh_hans
  text: 主耶和华[a]赐给我受教者的舌头[b]，使我知道怎样用一句话扶助[c]疲乏的人。清晨又清晨，他唤醒我；他唤醒我的耳朵，使我像受教者一样聆听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的“主耶和华”由“主”这一称号和神名YHWH（耶和华）组成。
    reason: cultural_note
  - marker: b
    text: “受教者的舌头”也可译作“门徒的舌头”或“受过教导之人的舌头”。
    reason: lexical_alternative
  - marker: c
    text: 译作“扶助”的希伯来文动词词义有疑难，也可能意为“帮助”，较不可能意为“回答”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 这一复合称号同时包含“主”和神名YHWH；“主耶和华”符合现代中文圣经语体，也保留两个要素。
- source_word: לְשׁוֹן
  choice: 舌头
  rationale: 保留希伯来文以身体器官指代说话能力的具体比喻。
- source_word: לִמּוּדִים
  choice: 受教者
  rationale: 该词指受过教导的人；译作“受教者”既保留其被教导的意味，又避免把它限定为某种制度化的“门徒”身份。前后两处采用同一译法，以保留呼应。
- source_word: לָעוּת
  choice: 扶助
  rationale: 此处动词词义有疑难；“扶助”表达借言语帮助、支撑疲乏者的语境意义，同时以脚注保留其他可能。
- source_word: יָעֵף
  choice: 疲乏的人
  rationale: 将形容词实体化，涵盖身体疲惫或心力困乏，不作过窄限定。
- source_word: דָּבָר
  choice: 用一句话
  rationale: דָּבָר在此指所说的话；“用一句话”自然表达其工具性作用。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 每天清晨
  rationale: 希伯来文重复“清晨”表示持续、规律发生；现代中文用“每天清晨”自然传达这一点。
- source_word: יָעִיר ... יָעִיר לִי אֹזֶן
  choice: 他都唤醒我，唤醒我的耳朵
  rationale: 保留原文“唤醒”的重复；首句的宾语在希伯来文中省略，中文依据下句语境补出“我”，使表达通顺，但不改变动作主体。
- source_word: לִשְׁמֹעַ
  choice: 聆听
  rationale: 这里不只是声音进入耳中，而是受教者领受教导；“聆听”在中文中兼具听见和专心领受的语感。
theological_decisions:
- issue: 复合神圣称号אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”保留“主”这一称号与YHWH这一神名，并符合普通中文读者熟悉的庄重圣经用语；脚注说明原文结构，不以译名选择推导额外的宗派立场。
- issue: לִמּוּדִים所指身份
  choice: 受教者
  alternative: 门徒
  rationale: 原词强调受到教导，未必明确指定正式门徒身份；采用较宽的“受教者”以保留语义空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“舌头”和“唤醒耳朵”的希伯来文意象，并通过“受教者”前后复现来呈现本节关于先聆听、后说话的结构呼应。
