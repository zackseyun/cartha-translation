  terminology: “离婚书”准确对应 סֵפֶר כְּרִיתוּת；“遣走”对应 שִׁלַּח／שֻׁלְּחָה，并在上下文中保留其离婚意象。“我哪一个债主”直接呈现 נֹשַׁי（我的债主），不将其改述为泛泛的欠债情形。罪孽／过犯的区分可保留。
