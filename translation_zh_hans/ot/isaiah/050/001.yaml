base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/001.yaml
  text: 'Thus says the LORD: Where is your mother''s certificate of divorce, with which I sent her away? Or which of my creditors is it to whom I sold you? Look, you were sold because of your iniquities, and your mother was sent away because of your transgressions.'
translation:
  language: zh_hans
  text: '耶和华如此说：


    “我遣走你们母亲所用的离婚书在哪里？


    我把你们卖给了我哪一个债主？


    看哪，你们被卖是因你们的罪孽；


    你们的母亲被遣走是因你们的过犯。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֵפֶר כְּרִיתוּת
  choice: 休书
  rationale: 指正式的离婚文书；“休书”在现代中文中仍可理解，也保留申命记24:1等处的法律与婚姻背景。
- source_word: שִׁלַּחְתִּיהָ / שֻׁלְּחָה
  choice: 休了／被休
  rationale: 在离婚语境中不是泛指“送走”，而是解除婚姻关系；如此也使前后的“休书”意象连贯。
- source_word: נֹשַׁי
  choice: 我欠了……债
  rationale: 该词意为债主、债权人。为使反问在普通话中自然，将“我的债主”转述为“我欠了谁的债”。
- source_word: נִמְכַּרְתֶּם
  choice: 你们被卖
  rationale: 保留被动形式以及因负债而卖人的法律、社会意象，不弱化为一般的流亡或交付。
- source_word: עֲוֺנֹתֵיכֶם / פִשְׁעֵיכֶם
  choice: 罪孽／过犯
  rationale: 分别保留两个近义而不完全相同的罪恶用语；前者强调罪责与败坏，后者强调悖逆、违犯。
- source_word: הֵן
  choice: 看哪
  rationale: 保留引人注意并转入结论的语用力量，同时符合庄重的先知话语体。
theological_decisions:
- issue: 上帝是否因自身负债或任意离婚而弃绝锡安
  choice: 保留两个反问，并明确把被卖、被休的原因归于百姓的罪孽和过犯
  alternative: 将本节直接解释成“上帝并未弃绝你们”
  rationale: 原文借婚姻和债务两个法律意象提出反问，随后说明审判原因；译文不把其潜在神学结论扩写进正文。
- issue: “母亲”所指
  choice: 保留“你们的母亲”而不在正文中指定为锡安、耶路撒冷或以色列
  alternative: 译作“你们的母亲锡安”
  rationale: 原文本节只说“你们的母亲”；让上下文承担辨识所指的作用，可避免消除原有意象与指称空间。
- issue: 婚姻比喻中的法律状态
  choice: 用“休书／休”呈现正式离婚意象
  alternative: 用较弱的“离弃／赶走”
  rationale: 原文明确出现离婚文书术语；保留这一法律性比喻，同时不额外断定关系永久终止。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。首个反问按希伯来语结构拆成两行，以避免中文把“在哪里”与关系从句堆叠得生硬；第二个反问改用“我欠了谁的债”，自然表达“我的哪一个债主”。保留诗行式排版和“耶和华”这一专名译法。
