language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ֤י בָ/כֶם֙ יְרֵ֣א יְהוָ֔ה שֹׁמֵ֖עַ בְּ/ק֣וֹל עַבְדּ֑/וֹ אֲשֶׁ֣ר הָלַ֣ךְ חֲשֵׁכִ֗ים וְ/אֵ֥ין נֹ֨גַהּ֙ ל֔/וֹ יִבְטַח֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/יִשָּׁעֵ֖ן בֵּ/אלֹהָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/010.yaml
  text: Who among you fears Yahweh[a], listening to the voice of his servant? Let the one who walks in darkness and has no light trust in the name of Yahweh and lean on his God.
translation:
  language: zh_hans
  text: 你们中间谁敬畏耶和华，听从他仆人的声音[a]？那行在黑暗中、没有光亮的人，要信靠耶和华的名，倚靠自己的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从”也可译作“听”或“留心听”；这里的希伯来语也可含“顺从”的意思。
    reason: 保留 שׁמע בקול 在听取、留心与顺从之间的语义幅度。
lexical_decisions:
- source_word: מִי בָכֶם
  choice: 你们中间谁
  rationale: 以自然的现代汉语保留直接向听众发问的形式。
- source_word: יְרֵא יְהוָה
  choice: 敬畏耶和华
  rationale: “敬畏”兼具畏惧、尊崇与虔敬的含义；以“耶和华”对应神名 יהוה。
- source_word: שֹׁמֵעַ בְּקוֹל עַבְדּוֹ
  choice: 听从他仆人的声音
  rationale: שׁמע בקול 不仅可指听见，也常含留心、听从之意；“听从……的声音”既保留声音意象，也不把含义完全收窄为服从。
- source_word: עַבְדּוֹ
  choice: 他仆人
  rationale: “仆人”符合以赛亚书受差遣之仆的语境，同时不预先限定其身份。
- source_word: אֲשֶׁר הָלַךְ חֲשֵׁכִים
  choice: 那行在黑暗中的人
  rationale: 将复数形式 חֲשֵׁכִים 按抽象或加强用法译为“黑暗”，并保留“行在”这一生活道路的隐喻。
- source_word: וְאֵין נֹגַהּ לוֹ
  choice: 没有光亮
  rationale: נֹגַהּ 指光辉、亮光；“没有光亮”自然地表达缺乏照明或盼望的处境。
- source_word: יִבְטַח בְּשֵׁם יְהוָה
  choice: 要信靠耶和华的名
  rationale: 保留“名”，体现对耶和华所启示的身份与品格的信赖。
- source_word: וְיִשָּׁעֵן בֵּאלֹהָיו
  choice: 倚靠自己的神
  rationale: “倚靠”保留 שׁען 所含身体倚着支撑物的鲜明比喻，也符合现代汉语。
theological_decisions:
- issue: “他仆人”的身份
  choice: 正文只译作“他仆人”，不指明具体身份
  alternative: 先知、以色列，或具有弥赛亚意义的仆人
  rationale: 本节没有明说仆人的身份；保留指代的开放性，避免把上下文可能具有的多重关联缩减为单一解释。
- issue: שֹׁמֵעַ 的语气强度
  choice: 听从
  alternative: 听、听见、服从
  rationale: “听从”兼顾听取与响应，在汉语中比单纯“听”更符合 שׁמע בקול 的常见搭配，又不像“服从”那样完全消除其听觉意象；脚注列出可理解的不同侧重。
- issue: 黑暗中的人与前句的关系
  choice: 以“那……的人”承接，并用劝勉句“要……”
  alternative: 把关系从句直接连于“谁”，译作“谁……行在黑暗中……”
  rationale: 希伯来句法可紧密承接前面的敬畏者，但后面的两个未完成式具有劝勉作用；汉语分作问句与劝勉句更清楚，同时不否认两者指同一类人的可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“行在黑暗中”“信靠……的名”“倚靠……神”等表达保留原文的核心意象；标点将发问与随后的劝勉清楚区分。
