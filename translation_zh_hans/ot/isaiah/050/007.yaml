source:
  edition: WLC
  text: וַ/אדֹנָ֤/י יְהוִה֙ יַֽעֲזָר לִ֔/י עַל כֵּ֖ן לֹ֣א נִכְלָ֑מְתִּי עַל כֵּ֞ן שַׂ֤מְתִּי פָנַ/י֙ כַּֽ/חַלָּמִ֔ישׁ וָ/אֵדַ֖ע כִּי לֹ֥א אֵבֽוֹשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/007.yaml
  text: But the Lord GOD helps me[a]; therefore I have not been disgraced. Therefore I have set my face like flint[d][c][b], and I know that I will not be put to shame.
translation:
  language: zh_hans
  text: 但主耶和华帮助我[a]，所以我没有受辱；所以我使脸面如燧石般坚硬[b]，我知道自己必不蒙羞[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主耶和华”对应原文 אֲדֹנָי יְהוִה，即“主”加上神名YHWH；“耶和华”是该神名的中文惯用译名。
    reason: 说明复合神名及正文译法。
  - marker: b
    text: “使脸面如燧石般坚硬”是表达坚定不屈决心的形象说法。
    reason: 解释希伯来语比喻，避免添加原文未明说的对象。
  - marker: c
    text: “蒙羞”也可译作“羞愧”或“被证明所盼望的落空”。
    reason: 保留 בוש 在此处的词义范围。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 复合称号直译为“主耶和华”，既保留 אֲדֹנָי 的主权称谓，也按现代中文圣经惯例呈现神名。
- source_word: יַעֲזָר לִי
  choice: 帮助我
  rationale: 未完成式在此表达持续并面向未来的确信；中文“帮助我”自然保留这种不限定于单一时点的含义。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 原文连续两次使用同一因果连接语；重复译为“所以”，保留其修辞结构，同时符合现代汉语。
- source_word: נִכְלָמְתִּי
  choice: 我没有受辱
  rationale: 该词的 Niphal 形式表示遭受羞辱或凌辱；“受辱”简洁地保留被动、结果性的含义。
- source_word: שַׂמְתִּי פָנַי כַּחַלָּמִישׁ
  choice: 我使自己的脸坚如燧石
  rationale: 保留“脸”和“燧石”的希伯来意象，并以“坚如”使比喻在现代中文中清楚可懂，表达面对敌对时的坚定决心。
- source_word: וָאֵדַע
  choice: 我知道
  rationale: 用现在时态表达说话者已经确立的确信，符合该叙述形式在语境中的功能。
- source_word: לֹא אֵבוֹשׁ
  choice: 我必不蒙羞
  rationale: “蒙羞”保留因外在结果而陷入羞耻的意味；“必”表达语境中的未来确信，又与前面的“受辱”保持词义上的细微区别。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上主；主雅威
  rationale: 原文同时含有“主”这一称号和四字神名。译作“主耶和华”保留两者，避免将神名消隐为普通称号，也采用普通中文读者熟悉的庄重形式。
- issue: 受苦仆人的确信是否译成已然或未来结果
  choice: 前句译“没有受辱”，末句译“必不蒙羞”
  alternative: 两处都译为“不会羞愧”
  rationale: 这样保留 נִכְלָמְתִּי 的完成/结果色彩与 אֵבוֹשׁ 的未完成、面向未来色彩，不把两种不同词形和词汇完全合并。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留原文两次“所以”的平行推进，以及“脸坚如燧石”的具体意象；“受辱”与“蒙羞”分别对应两个相关但不同的希伯来词，避免抹平其张力。
