id: ISA.50.9
reference: Isaiah 50:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵ֣ן אֲדֹנָ֤/י יְהוִה֙ יַֽעֲזָר לִ֔/י מִי ה֖וּא יַרְשִׁיעֵ֑/נִי הֵ֤ן כֻּלָּ/ם֙ כַּ/בֶּ֣גֶד יִבְל֔וּ עָ֖שׁ יֹאכְלֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/009.yaml
  text: Behold[a], the Lord GOD helps me; who is he who will declare me guilty? Behold, all of them will wear out like a garment; a moth will eat them.
translation:
  language: zh_hans
  text: 看哪，主耶和华帮助我；谁能定我的罪[a]？看哪，他们全都要像衣服一样渐渐破旧，蛀虫要吞吃他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣判我有罪。”原文动词带有司法含义，指在审判中宣告某人有罪或将其定罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强语气的话语标记；“看哪”保留先知话语庄重、有力的语感，在现代汉语中也清楚可懂。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合称号的两个成分：אֲדֹנָי译作“主”，四字神名יְהוִה按通行的现代中文圣经表达译作“耶和华”。
- source_word: יַעֲזָר לִי
  choice: 帮助我
  rationale: עזר的未完成式在这里表达仆人确信上帝正在并将要帮助他；汉语现在时“帮助我”自然地兼有持续和确定的意味。
- source_word: מִי הוּא יַרְשִׁיעֵנִי
  choice: 谁能定我的罪
  rationale: רשע的使役式具有司法语义，即宣告某人有罪或定罪；“谁能”自然传达反问中的挑战和确信。
- source_word: כֻּלָּם
  choice: 他们全都
  rationale: 保留“全部、无一例外”的范围，并以“他们”承接上下文中的敌对者。
- source_word: כַּבֶּגֶד יִבְלוּ
  choice: 要像衣服一样渐渐破旧
  rationale: 保留衣服逐渐磨损、朽坏的具体比喻；“渐渐破旧”在现代汉语中自然，也表达בלה所指的耗损过程。
- source_word: עָשׁ יֹאכְלֵם
  choice: 蛀虫要吞吃他们
  rationale: עָשׁ指蛀蚀衣物的虫；“吞吃”保留אָכַל“吃”的鲜明意象，并与前面的衣服比喻相连。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”既区分并保留原文中的称号与神名，也符合普通现代中文读者熟悉的庄重表达；不借此加入特定宗派解释。
- issue: יַרְשִׁיעֵנִי的司法含义
  choice: 定我的罪
  alternative: 宣判我有罪
  rationale: “定罪”简洁保留法庭性的宣告，并维持仆人面对控告者时的反问张力；脚注列出更明确的司法性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知文本的强调语气；两个分句以分号衔接，使上帝的帮助与无人能定罪的反问紧密相连。
