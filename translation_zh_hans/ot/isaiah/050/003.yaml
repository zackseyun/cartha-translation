  text: אַלְבִּ֥ישׁ שָׁמַ֖יִם קַדְר֑וּת וְ/שַׂ֖ק אָשִׂ֥ים כְּסוּתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/003.yaml
  text: I clothe the heavens with darkness[b][a], and I make sackcloth their covering.
translation:
  language: zh_hans
  text: 我使诸天披上幽暗[a]，以麻衣[b]作它们的遮盖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幽暗”也可译作“黑暗”或“阴沉”。
    reason: lexical_alternative
  - marker: b
    text: 麻衣是用粗糙织物制成的衣物，常用于表达哀悼和悲痛。
    reason: cultural_note
lexical_decisions:
- source_word: אַלְבִּישׁ
  choice: 我使……披上
  rationale: 该词是לבשׁ的使役形，表示“使穿上、给……披上”。“使诸天披上”既保留使役意义，也符合汉语诗歌表达。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 该复数形式可指天空或诸天；“诸天”保留原文的复数色彩和庄重的诗体语域。
- source_word: קַדְרוּת
  choice: 幽暗
  rationale: 该名词可表示黑暗、昏暗或阴郁。“幽暗”能自然呈现天色变暗的景象，同时保留哀伤、阴沉的意味。
- source_word: וְשַׂק
  choice: 以麻衣
  rationale: שַׂק指粗糙织物制成、常与哀悼相关的麻衣。译作“麻衣”保留其圣经文化意象；介词“以”按汉语表达补出工具或材料关系。
- source_word: אָשִׂים
  choice: 作
  rationale: שׂים基本义为放置、设立；在“作它们的遮盖”中译作“作”，简洁自然地表达使麻衣成为遮盖物。
- source_word: כְּסוּתָם
  choice: 它们的遮盖
  rationale: 该词可指遮盖物或衣服。“遮盖”与前句“披上”形成诗意对应，又避免把比喻限定为某一种具体衣物。
theological_decisions:
- issue: 审判与哀悼的宇宙性意象
  choice: 保留神使诸天变暗、以麻衣遮盖诸天的诗歌图景，不判定它仅是字面的天象或仅是象征。
  alternative: 明确解释为实际的宇宙变暗，或明确解释为哀悼、审判的纯比喻。
  rationale: 原文把宇宙变暗的景象与麻衣的哀悼意象并置，能够同时唤起神掌管受造界、审判和悲哀等含义；译文应保存这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“诸天”保持以赛亚诗歌的崇高语气；“披上……作……遮盖”保留原文两行之间的服饰意象和平行结构。
