base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/008.yaml
  text: Near is the one who vindicates me[a]; who will contend with me? Let us stand together[b]. Who is the master of my case? Let him come near to me.
translation:
  language: zh_hans
  text: 那判我有理的就在近旁[a]；谁要同我争讼？让我们一同站立。谁是与我争讼的[b]？让他到我这里来！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那为我申冤的”或“那宣告我为义的”。这里的希伯来语动词用于司法语境，指判明某人有理、为其辩白。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“我案件的主人（持有人）”，指持有并提出针对我的法律主张的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: 就在近旁
  rationale: 保留句首所强调的临近，并与末句“到我这里来”形成呼应；现代汉语中自然且庄重。
- source_word: מַצְדִּיקִי
  choice: 那为我申冤的
  rationale: 使役词形在本节法庭语境中指判明某人有理、为其洗雪；“申冤”传达司法性的维护与昭雪，避免理解为使人获得内在道德改变。
- source_word: יָרִיב אִתִּי
  choice: 跟我争讼
  rationale: “争讼”兼具争辩与诉讼意味，符合 ריב 的司法语域，同时不把具体诉讼程序说得过满。
- source_word: נַעַמְדָה יָּחַד
  choice: 让我们一同出庭
  rationale: 字面是“一同站立”；在上下文中指双方一同站到审判者面前。“出庭”以自然汉语明确其法庭挑战意味。
- source_word: בַעַל מִשְׁפָּטִי
  choice: 控告我的对头
  rationale: 该短语字面为“我案件的主人／持有人”，指持有并提出针对说话者之法律主张的人；正文采用自然汉语，脚注保留字面结构与语义范围。
- source_word: יִגַּשׁ אֵלַי
  choice: 让他到我这里来
  rationale: 表达祈使性的公开挑战，并与开头“近旁”保持空间意象上的呼应。
theological_decisions:
- issue: מַצְדִּיקִי 应理解为司法性判定还是道德性改变
  choice: 司法性的“为我申冤”
  alternative: “使我成为义人”或术语性的“称我为义”
  rationale: 本节由争讼、共同站立、法律案件及对方上前等法庭用语构成，因此这里是在说判明说话者有理并为其洗雪，而不是描述内在道德改变；译文也避免引入后期神学术语所附带的额外含义。
- issue: נַעַמְדָה יָּחַד 的场景是否应在正文中明示
  choice: 按语境译为“让我们一同出庭”
  alternative: 较字面的“让我们一同站立”
  rationale: 希伯来语本身没有“法庭”一词，但整节法律语境清楚；“出庭”在现代汉语中准确传达双方同立于审判者前的挑战，同时脚注不必为此增设原文没有的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的法庭语体。“就在近旁”保留原文句首强调；“争讼—出庭—控告—到我这里来”维持连续的司法场景和坚定的挑战语气。所有脚注标记均已置于正文对应位置。
