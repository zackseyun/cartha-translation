reference: Isaiah 50:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַדּ֨וּעַ בָּ֜אתִי וְ/אֵ֣ין אִ֗ישׁ קָרָֽאתִי֮ וְ/אֵ֣ין עוֹנֶה֒ הֲ/קָצ֨וֹר קָצְרָ֤ה יָדִ/י֙ מִ/פְּד֔וּת וְ/אִם אֵֽין בִּ֥/י כֹ֖חַ לְ/הַצִּ֑יל הֵ֣ן בְּ/גַעֲרָתִ֞/י אַחֲרִ֣יב יָ֗ם אָשִׂ֤ים נְהָרוֹת֙ מִדְבָּ֔ר תִּבְאַ֤שׁ דְּגָתָ/ם֙ מֵ/אֵ֣ין מַ֔יִם וְ/תָמֹ֖ת בַּ/צָּמָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/002.yaml
  text: Why[a], when I came, was there no man? When I called, was there no one to answer? Is my hand really too short to redeem, or is there no power in me to deliver? Behold[b], by my rebuke I dry up the sea; I make rivers a wilderness[c]; their fish stink for lack of water and die of thirst.
translation:
  language: zh_hans
  text: 为什么我来时，一个人也没有[a]？我呼唤时，无人回答？难道我的手竟缩短了，以致不能救赎[b]吗？还是我没有能力搭救[c]？看哪，我一斥责，就使海干涸，使江河变成旷野；其中的鱼因无水而发臭，因干渴而死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一个人”：希伯来语为阳性单数名词אִישׁ，在这里泛指任何人。
    reason: lexical_alternative
  - marker: b
    text: “我的手竟缩短了，以致不能救赎”：也可译作“我的手真的短得不能施行救赎吗？”“手缩短”是无力施行的比喻。
    reason: lexical_alternative
  - marker: c
    text: “搭救”：也可译作“拯救”或“救援”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ בָּאתִי וְאֵין אִישׁ
  choice: 为什么我来时，一个人也没有
  rationale: 保留反问和“我来”的具体动作；אִישׁ在此用于泛指，译作“一个人”既贴近单数形式，也符合现代汉语。
- source_word: קָרָאתִי וְאֵין עוֹנֶה
  choice: 我呼唤时，无人回答
  rationale: קרא既可指呼叫，也可指召唤；“呼唤”保留这一区间。分词עוֹנֶה表示作出回应者，汉语自然表达为“无人回答”。
- source_word: הֲקָצוֹר קָצְרָה יָדִי מִפְּדוּת
  choice: 难道我的手竟缩短了，以致不能救赎吗
  rationale: 保留“手缩短”这一拟人化能力隐喻，并以“以致不能”自然表达מִן在这里所体现的无力、受限含义。
- source_word: וְאִם אֵין בִּי כֹחַ לְהַצִּיל
  choice: 还是我没有能力搭救
  rationale: כֹחַ译为“能力”；הציל的意义是从危险或困境中救出，“搭救”避免把它限定为某一种神学意义。
- source_word: הֵן בְּגַעֲרָתִי אַחֲרִיב יָם
  choice: 看哪，我一斥责，就使海干涸
  rationale: הֵן是引人注意的语气词，译作庄重而通行的“看哪”；גערה是有权威的斥责，חרב结合下文缺水景象译为“使……干涸”。
- source_word: אָשִׂים נְהָרוֹת מִדְבָּר
  choice: 使江河变成旷野
  rationale: 保留源文把江河转变为荒旷之地的强烈意象，不弱化为仅仅“水量减少”。
- source_word: תִּבְאַשׁ דְּגָתָם מֵאֵין מַיִם וְתָמֹת בַּצָּמָא
  choice: 其中的鱼因无水而发臭，因干渴而死
  rationale: 按源文保留“发臭”这一具体而严厉的后果，并清楚呈现无水与死亡之间的因果关系。
theological_decisions:
- issue: 上帝之“手”是否应抽象化为能力
  choice: 保留“我的手竟缩短了”
  alternative: 难道我的能力不足以救赎
  rationale: 源文有意采用身体意象表达上帝施行救赎的能力；下一问已经明确提到“能力”，因此不应把前一句也抽象化而消除修辞张力。
- issue: פדות与הציל的区分
  choice: 分别译作“救赎”和“搭救”
  alternative: 两者都译作“拯救”
  rationale: 前者是“救赎、赎回”的名词，后者是从危险中救出的动词。分别翻译既保留词义差异，也不把经文限定于某一教派化解释。
- issue: אִישׁ的性别与代表性用法
  choice: 译作“一个人”
  alternative: 一个男人
  rationale: 此处问题在于无人到场回应，并无强调男性性别的语境；现代汉语“人”自然保留其个体、代表性意义。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的普通话。反问句保持紧迫力度；“看哪”保留先知文学的郑重提示功能；“干涸、旷野、发臭、干渴”等具体意象均按希伯来文保留。
