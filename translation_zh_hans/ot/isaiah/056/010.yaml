base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/010.yaml
  text: His watchmen are blind[a], all of them; they know nothing. All of them are mute dogs, unable to bark, dreamers, lying down, loving to slumber.
translation:
  language: zh_hans
  text: 他的守望者全都瞎了眼，什么也不知道；他们全是哑巴狗，不能吠叫，做着梦，躺卧着，贪爱打盹。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“发呓语”。这里的希伯来词罕见，按上下文难以确定；正文依照周围关于躺卧和打盹的意象译作“做梦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צפו
  choice: 他的守望者
  rationale: 按传统释读理解为“他的守望者”；“守望者”保留先知责备中本应警醒看守之人的形象。
- source_word: עִוְרִים כֻּלָּם
  choice: 全都瞎了眼
  rationale: 保留“瞎眼”的具体比喻，并以自然汉语表达 כֻּלָּם 所强调的无一例外。
- source_word: לֹא יָדָעוּ
  choice: 什么也不知道
  rationale: 直陈他们全无认识或辨识，既传达否定的力度，也不把所缺乏的知识具体化。
- source_word: כְּלָבִים אִלְּמִים
  choice: 哑巴狗
  rationale: 保留尖锐的犬类比喻；“哑巴狗”在现代汉语中清楚传达不能发声的意思。
- source_word: לֹא יוּכְלוּ לִנְבֹּחַ
  choice: 不能吠叫
  rationale: 准确表达能力上的不能，并以“吠叫”延续狗的意象。
- source_word: הֹזִים
  choice: 做梦
  rationale: 该词罕见且含义困难；结合下文“躺卧”和“打盹”的睡眠意象，正文采用“做梦”，同时以脚注保留另一种词义可能。
- source_word: שֹׁכְבִים
  choice: 躺卧
  rationale: 保留 שכב 分词所描绘的身体姿态，并采用庄重而易懂的现代汉语。
- source_word: אֹהֲבֵי לָנוּם
  choice: 贪爱打盹
  rationale: “打盹”传达 נום 的困倦、睡意；“贪爱”体现 אֹהֲבֵי，不淡化对懒散失职的责备。
