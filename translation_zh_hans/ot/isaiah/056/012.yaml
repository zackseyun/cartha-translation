base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/012.yaml
  text: Come[a], let me get wine, and let us fill ourselves with strong drink; and tomorrow will be like this day[b], great beyond measure.
translation:
  language: zh_hans
  text: “来吧！我去拿酒；我们喝烈酒，喝个痛快。[a]明天必会像今天这样—更为丰盛，多得多！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们喝烈酒，喝到饱足。”希伯来语动词可强调喝得满足、饱足；上下文暗含纵饮过度之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“明天必像今天一样，甚至更大得多。”希伯来语末尾的短语加强了说话者对明日更加丰盛的夸口。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵתָיוּ
  choice: 来吧
  rationale: 这是向众人发出的邀约语；“来吧”简洁自然，也保留说话者纵饮作乐的语气。
- source_word: אֶקְחָה
  choice: 我去拿
  rationale: 该形式表达第一人称的意愿；“我去拿”在汉语对话中自然地传达主动提议，比直译为“让我拿”更顺畅。
- source_word: יַיִן
  choice: 酒
  rationale: 这里与下文“烈酒”并列；“酒”准确、自然，且不必将其狭义化为现代某一种葡萄酒。
- source_word: וְנִסְבְּאָה
  choice: 我们……喝个痛快
  rationale: סבא含有喝到满足、饱足之意，语境暗示纵饮；“喝个痛快”保留饱饮意味，又未直接把词义限定为“喝醉”。
- source_word: שֵׁכָר
  choice: 烈酒
  rationale: 指具有致醉作用、与יַיִן并列的酒类饮品；“烈酒”是现代汉语中简明易懂的宽泛对应。
- source_word: כָזֶה יוֹם מָחָר
  choice: 明天必像今天一样
  rationale: 按现代汉语语序表达“明日之日将如此”，清楚保留对当前宴饮情形的比较。
- source_word: גָּדוֹל יֶתֶר מְאֹד
  choice: 甚至更加丰盛，远远超过今天
  rationale: 末尾短语强化对明日的夸口，不只是“同样”，而且会大得多；“丰盛”结合饮宴语境表达גָּדוֹל，“远远超过今天”呈现יֶתֶר מְאֹד的强烈递进。
