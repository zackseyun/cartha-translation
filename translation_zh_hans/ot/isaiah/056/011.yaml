- from: 这些狗胃口凶猛[a]，不知饱足；他们又是毫无悟性的牧人[b]。他们全都偏向自己的道路，各人追求自己的利益，无一例外[c]。
  to: 这些狗贪食无厌[a]，永不知足；他们又是不知明辨的牧人[b]。他们全都各走自己的路，各人追求自己的利益，无一例外[c]。
  rationale: 修订仅改善汉语自然度并更贴近希伯来语的动作和语境义：“贪食无厌，永不知足”呈现食欲强烈及不知饱足的递进；“不知明辨”保留“不知”的重复；“各走自己的路”恢复“转向自身道路”的动作性。保留“利益”及对末尾困难短语的脚注，不额外加入法律或教义性的限定。
