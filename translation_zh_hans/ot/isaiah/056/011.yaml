source:
  edition: WLC
  text: וְ/הַ/כְּלָבִ֣ים עַזֵּי נֶ֗פֶשׁ לֹ֤א יָֽדְעוּ֙ שָׂבְעָ֔ה וְ/הֵ֣מָּה רֹעִ֔ים לֹ֥א יָדְע֖וּ הָבִ֑ין כֻּלָּ/ם֙ לְ/דַרְכָּ֣/ם פָּנ֔וּ אִ֥ישׁ לְ/בִצְע֖/וֹ מִ/קָּצֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/011.yaml
  text: And the dogs are greedy in appetite[a]; they do not know satisfaction. And they are shepherds who do not know understanding; all of them have turned to their own way, each one to his own gain[c][b], every one without exception.
translation:
  language: zh_hans
  text: 这些狗贪食无厌[a]，永不知足；他们又是不知明辨的牧人[b]。他们全都各走自己的路，各人追求自己的利益，无一例外[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“食欲强烈”；原文直译近于“欲望（或食欲）强烈”。
    reason: 说明希伯来习语עַזֵּי נֶפֶשׁ的字面构成及其在本句中的语境义。
  - marker: b
    text: 或译：“不知道如何明白”，或“全无辨别力”。
    reason: 保留לֹא יָדְעוּ הָבִין不寻常的动词结构及其可能表达。
  - marker: c
    text: “无一例外”所对应的希伯来短语含义不易确定；也可译作“从各方”。
    reason: 标明מִקָּצֵהוּ的解释难点，不把总体性读法说成唯一可能。
lexical_decisions:
- source_word: הַכְּלָבִים
  choice: 这些狗
  rationale: 保留希伯来文具体而尖锐的“狗”这一比喻，不在正文中直接改释为领袖或守望者；“这些”承接上文所指的狗。
- source_word: עַזֵּי נֶפֶשׁ
  choice: 胃口凶猛
  rationale: נֶפֶשׁ在此指食欲、胃口，עַזֵּי表示强烈、凶猛；此译保留原文略显生动突兀的身体欲望意象。
- source_word: לֹא יָדְעוּ שָׂבְעָה
  choice: 不知饱足
  rationale: 直接保留“知道”与“饱足”的搭配，中文凝练自然，也与下句“不知如何明白”形成修辞呼应。
- source_word: רֹעִים
  choice: 牧人
  rationale: 保留原文牧人的领导者隐喻，避免改成带特定教会制度色彩的“牧师”或宽泛的“领袖”。
- source_word: לֹא יָדְעוּ הָבִין
  choice: 毫无悟性
  rationale: 希伯来结构可理解为“不知道如何明白”；正文以自然中文表达其缺乏理解、辨别能力的意思，另在脚注保留较贴近形式的译法。
- source_word: כֻּלָּם לְדַרְכָּם פָּנוּ
  choice: 他们全都偏向自己的道路
  rationale: 保留全体性的指控、转向的动作和“道路”的道德隐喻；“偏向”也体现其离开正路、转顾自身的语境含义。
- source_word: אִישׁ לְבִצְעוֹ
  choice: 各人追求自己的利益
  rationale: אִישׁ具逐一分配作用，译作“各人”；בֶּצַע在此带贪图私利的负面语境，但词义可指利益、所得，故正文不额外加入“非法”以免过度限定。
- source_word: מִקָּצֵהוּ
  choice: 无一例外
  rationale: 此困难短语在语境中很可能强化指控覆盖全体的程度；采用通顺的总体性表达，同时以脚注保留空间性解释。
theological_decisions:
- issue: “狗”与“牧人”所指的身份
  choice: 正文保留两重比喻，不直接替换为特定制度中的领袖称谓。
  alternative: 译作“这些领袖贪得无厌”或将“牧人”解释为特定宗教职分。
  rationale: 原文借狗与牧人的形象谴责失职且逐利的人；保留形象可避免把经文的适用范围收窄到某一宗派或制度。
- issue: בֶּצַע的道德色彩
  choice: 译作“自己的利益”，由上下文和“追求”传达贪图私利的谴责。
  alternative: 译作“自己的不义之财”或“自己的暴利”。
  rationale: 该词常有不正当获利的负面色彩，但本节并未明说所得的法律性质；较宽的译法保存词义范围与神学张力。
- issue: מִקָּצֵהוּ的困难读法
  choice: 正文采用总体性理解“无一例外”。
  alternative: 按空间意义译作“从各方”或较直译的“从他的尽头”。
  rationale: 马所拉文本的短语意义困难；上下文已有“全都、各人”的铺陈，总体性理解连贯，但不能排除空间性读法，因此在脚注注明。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号和短句保留希伯来诗句的平行推进；正文保留“狗”“牧人”“道路”等核心意象，并用脚注处理习语与困难短语。
