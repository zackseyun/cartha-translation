  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בְנֵ֣י הַ/נֵּכָ֗ר הַ/נִּלְוִ֤ים עַל יְהוָה֙ לְ/שָׁ֣רְת֔/וֹ וּֽ/לְ/אַהֲבָה֙ אֶת שֵׁ֣ם יְהוָ֔ה לִ/הְי֥וֹת ל֖/וֹ לַ/עֲבָדִ֑ים כָּל שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/006.yaml
  text: And the sons of the foreigner who join themselves to Yahweh[a], to minister to him, and to love the name of Yahweh[d][c][b], to be his servants—everyone who keeps the Sabbath from profaning it and holds fast my covenant—
translation:
  language: zh_hans
  text: 至于那些归附耶和华，为要事奉他、爱耶和华的名、作他的仆人，又谨守安息日而不亵渎它、并持守我约的外族人[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“外族人的儿子们”，这里指外族人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַנֵּכָר
  choice: 外族人
  rationale: 希伯来语直译为“外族人的儿子们”，在这里是指外族人这一群体。现代汉语用“外族人”自然清楚，也不把原文的男性形式误解为只包括男性。
- source_word: הַנִּלְוִים עַל יְהוָה
  choice: 归附耶和华
  rationale: נלוה 表示加入、依附并归属；“归附”兼顾主动委身与归属关系，适合此处的圣约语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以一般称号代替。
- source_word: לְשָׁרְתוֹ
  choice: 事奉他
  rationale: שרת 在对上帝的语境中常指敬拜性、礼仪性的服事；“事奉”比一般的“服务”更符合中文宗教语域。
- source_word: וּלְאַהֲבָה אֶת שֵׁם יְהוָה
  choice: 爱耶和华之名
  rationale: 保留原文“爱……的名”的表达，不将其简化为“爱耶和华”，从而保留名字所承载的启示、尊荣与关系含义。
- source_word: לִהְיוֹת לוֹ לַעֲבָדִים
  choice: 作他仆人
  rationale: עבד 可指奴隶或仆人；此处重点是对上帝的事奉和归属，“仆人”在现代中文中更自然，同时仍保留从属关系。
- source_word: כָּל שֹׁמֵר שַׁבָּת מֵחַלְּלוֹ
  choice: 每一个谨守安息日、不亵渎这日的人
  rationale: כָּל 加单数分词具有逐一、分配性的意义，故译作“每一个……的人”；מִן 加不定式表达避免某行为，用“不亵渎这日”清楚呈现。
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  choice: 并持守我约
  rationale: חזק ב 表示紧握、牢牢坚持；“持守”是自然而庄重的中文圣约用语。原文此处为复数分词，与前面的单数分配结构存在数的不整齐，中文不必强行显出。
theological_decisions:
- issue: 外族人的圣约归属
  choice: 译为“归附耶和华……并持守我约”，完整保留外族人参与事奉和圣约的表述
  alternative: 将其泛化为仅仅敬拜上帝的人，或加入后来群体身份的解释
  rationale: 原文明确列举归附、事奉、爱其名、作仆人、守安息日和持守圣约，不应削弱其纳入性，也不应加入超出本节的后期神学结论。
- issue: עֲבָדִים 的身份含义
  choice: 仆人
  alternative: 奴仆／奴隶
  rationale: 原词确有受支配、归属他者的含义，但本节语境突出敬拜性事奉。“仆人”较符合现代中文语感，又不消除归属关系。
- issue: כָּל שֹׁמֵר 与 וּמַחֲזִיקִים 的数不一致
  choice: 以“每一个……的人”保留前半句的分配性，后半句用中文不标数的“持守”承接
  alternative: 统一译成复数“所有……的人”
  rationale: 马所拉文本先用单数分词 שֹׁמֵר，后用复数分词 מַחֲזִיקִים。译文不擅自校订文本，并利用中文动词不标数的特点保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“事奉”“亵渎”“持守我约”保留先知书和敬拜语境的肃穆感；全句以破折号结尾，以反映本节句法尚未完结，并承接下一节。
