  source_fidelity: 草稿整体准确传达了外族人归附耶和华、事奉、爱其名、作其仆人、守安息日和持守圣约的内容，并正确保留了本节末尾延续至下一节的破折号。可是“就是每一个……的人”把原文的限定结构处理成较生硬的说明性同位语；中文宜将守安息日与持守圣约直接作为限定“外族人”的后续特征。
  naturalness: “至于那些……外族人，就是每一个……的人”在现代汉语中不够顺畅，且“就是”容易造成不必要的界定语气。改为“至于那些……又……的外族人”更自然，并保持庄重的先知书语域。
  terminology: “耶和华”“事奉”“耶和华的名”“仆人”“安息日”“亵渎”“持守我约”均合乎现代标准汉语圣经语域，也忠实反映原文的重要术语。保留“外族人”，并以脚注交代“外族人的儿子们”的字面表达，是兼顾忠实和自然的可行方式。
  issues:
