    rationale: “这日”虽可指安息日，但“安息日而不亵渎它”在紧邻先行词的语境下指代明确，也更贴近原文的代词宾语。
  revised_text: 至于那些归附耶和华，为要事奉他、爱耶和华的名、作他的仆人，又谨守安息日而不亵渎它、并持守我约的外族人[a]——
