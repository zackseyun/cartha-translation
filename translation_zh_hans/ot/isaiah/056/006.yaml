revisions:
- from: 至于那些归附耶和华、事奉他、爱耶和华之名、作他仆人的外族人[a]，就是每一个谨守安息日、不亵渎这日，并持守我约的人——
  to: 至于那些归附耶和华，为要事奉他、爱耶和华的名、作他的仆人，又谨守安息日而不亵渎它、并持守我约的外族人[a]——
  rationale: 修订只调整中文句法和指代方式：删除说明性较强的“就是每一个……的人”，把守安息日及持守圣约与前列行为一同作为对“外族人”的限定；保留“为要”以表达原文连续不定式所示的目的或委身方向。未增添任何神学解释，也未试图消解原文单、复数分词之间的形式张力。
