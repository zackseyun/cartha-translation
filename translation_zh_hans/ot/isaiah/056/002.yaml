  text: אַשְׁרֵ֤י אֱנוֹשׁ֙ יַעֲשֶׂה זֹּ֔את וּ/בֶן אָדָ֖ם יַחֲזִ֣יק בָּ֑/הּ שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וְ/שֹׁמֵ֥ר יָד֖/וֹ מֵ/עֲשׂ֥וֹת כָּל רָֽע־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/002.yaml
  text: 'Blessed is the man who does this, and the son of man who holds fast to it: keeping the Sabbath from profaning it, and keeping his hand from doing any evil.'
translation:
  language: zh_hans
  text: 做这事的人，持守它的世人，有福了：他们谨守安息日，不亵渎它；又约束自己的手，不做任何恶事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 表达希伯来语对蒙福之人处境的赞叹，并保留智慧文学式的宣告语气。
- source_word: אֱנוֹשׁ / בֶן־אָדָם
  choice: 人
  rationale: 两个表达在此构成同义平行，泛指凡人；现代汉语若直译为“人子”容易被误解为特定称号，因此合并为自然的泛称，同时不改变所指。
- source_word: יַחֲזִיק בָּהּ
  choice: 持守这事
  rationale: 保留“牢牢抓住、不放弃并切实践行”的语义；阴性代词所指可理解为前文所说之事，在本节中由后续分句具体说明。
- source_word: שֹׁמֵר שַׁבָּת מֵחַלְּלוֹ
  choice: 谨守安息日而不亵渎它
  rationale: “谨守”体现持续看守、遵行；“亵渎”保留 חלל 将圣日当作俗常、使之失去神圣性的宗教含义。
- source_word: שֹׁמֵר יָדוֹ
  choice: 约束自己的手
  rationale: 希伯来语字面是“看守他的手”，语境义为管束行动；采用自然汉语表达，并保留“手”作为行为的转喻。
- source_word: כָּל־רָע
  choice: 任何恶事
  rationale: 忠实表达“所有/任何恶”，在“做”之后补出“事”以符合现代汉语习惯。
theological_decisions:
- issue: “这事/它”的具体所指
  choice: 保留“这事”，并让后续两个分句说明其内容
  alternative: 明确译为“遵行公义”或专指“守安息日”
  rationale: 阴性代词 בָּהּ 的指向存在一定开放性，可能回指前文整体要求，也由本节后半具体展开；不在译文中强行限定。
- issue: 安息日与不作恶之间的句法关系
  choice: 将二者并列为“这样做、持守这事”的具体表现
  alternative: 把后半译成独立的定语从句，或使“不作恶”从属于守安息日
  rationale: 两个 שֹׁמֵר 分词结构彼此平行，均刻画蒙福之人的持续行为。
- issue: בֶן־אָדָם 是否作为基督论称号
  choice: 按普通希伯来语习语译为泛指的“人”
  alternative: 直译“人子”
  rationale: 此处与 אֱנוֹשׁ 同义平行，指一般凡人，并非上下文中的专门称号。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为避免把希伯来诗歌的同义平行机械译成重复且可能误导的“人/人子”，将主语合并，并在句末复现“有福了”，形成自然的汉语首尾呼应；冒号后的两个并列短语体现原文两个分词结构。
