id: ISA.56.1
reference: Isaiah 56:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה שִׁמְר֥וּ מִשְׁפָּ֖ט וַ/עֲשׂ֣וּ צְדָקָ֑ה כִּֽי קְרוֹבָ֤ה יְשֽׁוּעָתִ/י֙ לָ/ב֔וֹא וְ/צִדְקָתִ֖/י לְ/הִגָּלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/001.yaml
  text: 'Thus says Yahweh: Keep justice[a], and do righteousness, for my salvation is near to come[b], and my righteousness to be revealed.'
translation:
  language: zh_hans
  text: '雅威如此说：

    “你们要持守公正，施行公义；

    因为我的拯救[a]快要来到，

    我的公义[b]也快要显明。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“解救”或“救恩”。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“正义”或“伸冤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告的固定格式，并将四字神名直接译作“雅威”，语气庄重而自然。
- source_word: שִׁמְרוּ מִשְׁפָּט
  choice: 持守公正
  rationale: שׁמר在此表示谨守、坚持；מִשְׁפָּט指合乎正义的秩序与判断。“持守公正”既保留命令的力度，也适合现代汉语。
- source_word: וַעֲשׂוּ צְדָקָה
  choice: 施行公义
  rationale: 直译עשה的行动含义，并以“公义”区别于前句的מִשְׁפָּט，同时保留其伦理和神学分量。
- source_word: יְשׁוּעָתִי
  choice: 我的拯救
  rationale: 该词可指救恩、解救或得胜；“拯救”在此兼具具体施救行动与较广的救恩含义。
- source_word: קְרוֹבָה ... לָבוֹא
  choice: 快要来到
  rationale: 表达拯救临近、即将来临的意思，比逐字译作“临近要来”更符合现代汉语。
- source_word: וְצִדְקָתִי לְהִגָּלוֹת
  choice: 我的公义也快要显明
  rationale: צְדָקָה可涵盖上帝的公义、正义行动和为人伸冤；“公义”保留这一宽广张力。לְהִגָּלוֹת为被动意义，译作“显明”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常重构的读音，并明确保留其作为立约之名的性质。
- issue: מִשְׁפָּט与צְדָקָה的关系
  choice: 公正／公义
  alternative: 正义／正直
  rationale: 两词意义相近却并不完全相同；分别译作“公正”和“公义”，避免把它们合并为同一概念。
- issue: 上帝的צְדָקָה所指为何
  choice: 我的公义
  alternative: 我的正义／我为人伸冤
  rationale: 本词既可指上帝的公义属性，也可指他施行正义、拯救并为人伸冤的行动；正文采用较宽广的“公义”，不把含义限制为单一司法概念。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。诗行保留原文两组命令及两项即将实现之事的平行结构；以“快要”分别修饰“来到”和“显明”，使汉语节奏清楚，并明确表达原文的临近之意。
