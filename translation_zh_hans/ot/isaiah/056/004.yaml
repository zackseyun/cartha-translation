  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה לַ/סָּֽרִיסִים֙ אֲשֶׁ֤ר יִשְׁמְרוּ֙ אֶת שַׁבְּתוֹתַ֔/י וּ/בָֽחֲר֖וּ בַּ/אֲשֶׁ֣ר חָפָ֑צְתִּי וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/004.yaml
  text: 'For thus says the LORD to the eunuchs who keep my Sabbaths, and choose what I delight in, and hold fast to my covenant:'
translation:
  language: zh_hans
  text: 因为耶和华对那些谨守我的安息日、选择我所喜悦之事、持守我约的太监如此说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确对应四字神名。
- source_word: לַסָּרִיסִים
  choice: 对那些……的太监
  rationale: סָרִיס 在本段语境中与前文所说身体残缺相连，具体指被阉割的男子；“太监”是简明且通行的中文对应。
- source_word: יִשְׁמְרוּ אֶת־שַׁבְּתוֹתַי
  choice: 谨守我的安息日
  rationale: שמר 不仅指一般遵守，也含谨慎守护之意；复数“安息日”按原文保留。
- source_word: וּבָחֲרוּ בַּאֲשֶׁר חָפָצְתִּי
  choice: 选择我所喜悦之事
  rationale: 保留“选择”这一主动行为及 חפץ 的喜悦、乐意含义，不把泛指关系结构过度具体化。
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  choice: 持守我的约
  rationale: חזק ב 表示紧紧抓住、坚定持守；“持守”自然传达忠于盟约而不放弃。
theological_decisions:
- issue: 三个关系从句之间的逻辑关系
  choice: 用顿号并列“谨守……、选择……、持守……”
  alternative: 重复“那些/并且”或把后两项处理成结果关系
  rationale: 希伯来文以连续的并列结构列出三项特征，没有明示因果或先后；中文并列可保留这种开放关系。
- issue: “我的约”的性质
  choice: 保留概括性的“我的约”
  alternative: 具体解释为摩西之约、割礼之约或新约
  rationale: 本节没有限定所指之约，译文不加入宗派性或体系化解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为……如此说”承接上文并引出下一节的宣告，保留本节末尾冒号所体现的未完句法。
