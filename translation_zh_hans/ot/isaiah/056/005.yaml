base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/005.yaml
  text: And I will give them[a], in my house and within my walls, a monument and a name better than sons and daughters[b]; I will give them an everlasting name that will not be cut off.
translation:
  language: zh_hans
  text: 我要在我的殿中和墙垣之内，赐给他们比儿女更美好的纪念碑和名[a]；我要赐给他永远的名，永不被剪除[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纪念碑和名”：希伯来文直译为“手和名”；“手”在这里指纪念标志或纪念物。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在本节由前面的复数“他们”转为单数“他”，可能是把对群体的应许落实到其中每一个人。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要赐给
  rationale: נתן的常用义是“给、赐给”；此处说话者是上主，用“赐给”自然庄重，并保留本节动词的重复。
- source_word: לָהֶם
  choice: 他们
  rationale: 原文首先使用复数代词，承接上文所指的群体，应保留复数。
- source_word: בְּבֵיתִי וּבְחֹמֹתַי
  choice: 在我的殿中、我的墙内
  rationale: בַּיִת字面为“房屋、家”，此处语境指上主的殿；译作“殿”在现代汉语中清楚自然。חֹמוֹת为“墙”，译文保留这一具体意象及圣所范围内的位置关系。
- source_word: יָד וָשֵׁם
  choice: 纪念碑和名号
  rationale: יָד本义为“手”，但在该组合中指纪念标志或纪念物；“纪念碑”传达其具体而持久的纪念功能。“名号”既保留שֵׁם的“名”，又较自然地表达受尊重、被记念的身份。
- source_word: טוֹב מִבָּנִים וּמִבָּנוֹת
  choice: 胜过儿女
  rationale: 保留比较结构和“儿子、女儿”的双重表达；汉语“儿女”简洁且没有抹去后裔含义。
- source_word: שֵׁם עוֹלָם
  choice: 一个永远的名
  rationale: עוֹלָם在此表示永久长存；“永远的名”自然、庄重，并保留“名”的重复。
- source_word: אֶתֶּן לוֹ
  choice: 我要赐给他
  rationale: 马所拉文本由前面的复数לָהֶם转为单数לוֹ。译文保留这一真实的数变化，不擅自统一。
- source_word: אֲשֶׁר לֹא יִכָּרֵת
  choice: 永不被剪除
  rationale: כרת的尼法勒式意为“被剪除、断绝”。“剪除”保留原文意象，并呼应无后裔者对名分或世系断绝的忧虑。
theological_decisions:
- issue: יָד וָשֵׁם的习语表达
  choice: 纪念碑和名号
  alternative: 纪念物和名字；手和名
  rationale: 直译“手和名”在现代汉语中难以理解；“纪念碑和名号”保留具体的纪念标志和持久声名两方面，不将其收窄为某一教派性解释。
- issue: 由复数לָהֶם转为单数לוֹ
  choice: 保留“他们……他”的变化
  alternative: 全译为复数“他们”；释译为“他们每一个人”
  rationale: 数的转换存在于希伯来文本中，可能把对群体的应许落实到其中的个体。正文保留这种张力，脚注说明，而不加以协调。
- issue: “不被剪除”的神学回响
  choice: 保留“剪除”意象
  alternative: 永不消失；永不断绝
  rationale: 该措辞既可指名字不被除去，也与后裔断绝的语境形成呼应；较直译的表达让这些层次继续开放。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿”按上下文表达上主的בית，但不扩写为“圣殿”。保留“纪念碑和名号”的具体性，也保留复数转单数及“剪除”的原文张力。
