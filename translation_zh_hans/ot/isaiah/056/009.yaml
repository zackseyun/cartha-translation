  text: כֹּ֖ל חַיְת֣וֹ שָׂדָ֑י אֵתָ֕יוּ לֶ/אֱכֹ֥ל כָּל חַיְת֖וֹ בַּ/יָּֽעַר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/009.yaml
  text: All you beasts of the field[b][a], come to devour— all you beasts of the forest.
translation:
  language: zh_hans
  text: 田野的一切走兽[a]，都来吞吃吧！林中的一切走兽，也都来吧！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里召来野兽吞吃，很可能是将临审判的图像；也有人认为这些野兽比喻入侵的敌军。
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל
  choice: 一切
  rationale: 表示所呼召走兽的全体；“一切”自然地保留集合性的总括语气。
- source_word: חַיְתוֹ
  choice: 走兽
  rationale: 在“田野／林中”的搭配及吞吃的语境里，指野生兽类；“走兽”既明确又保留先知话语的力度。
- source_word: שָׂדָי
  choice: 田野的
  rationale: שׂדה在这里与森林相对；“田野”是现代汉语中清楚而自然的对应表达。
- source_word: אֵתָיוּ
  choice: 都来吧
  rationale: 复数命令式，直接召唤众兽前来；补入“都”呼应两次כֹּל，并使中文句势自然。
- source_word: לֶאֱכֹל
  choice: 吞吃
  rationale: 该词本义为“吃”，但此处召来野兽取食，语境具有捕食和审判的力度；“吞吃”不改变意象而能传达这种力量。
- source_word: בַּיָּעַר
  choice: 林中的
  rationale: 介词加定冠词直指“在森林中”；中文以“林中的走兽”自然表达其栖居范围，并与“田野的走兽”形成平行。
theological_decisions:
- issue: 受召野兽的先知性意象
  choice: 正文保留对野兽的直接召唤，并让它作为将临审判的意象发挥作用
  alternative: 把野兽直接译解为入侵的敌军或列国
  rationale: 希伯来文表层明确呼唤田野和林中的走兽前来吃；上下文可使人联想到敌军和审判，但正文不应把这一可能含义取代原有的动物意象。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“都来吞吃吧”保留命令式召唤；末句补出“也都来吧”，避免希伯来文省略结构在中文中显得残缺，同时不另增吞吃对象。
