  text: וְ/אַל יֹאמַ֣ר בֶּן הַ/נֵּכָ֗ר הַ/נִּלְוָ֤ה אֶל יְהוָה֙ לֵ/אמֹ֔ר הַבְדֵּ֧ל יַבְדִּילַ֛/נִי יְהוָ֖ה מֵ/עַ֣ל עַמּ֑/וֹ וְ/אַל יֹאמַר֙ הַ/סָּרִ֔יס הֵ֥ן אֲנִ֖י עֵ֥ץ יָבֵֽשׁ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/003.yaml
  text: Let not the foreigner who has joined himself to the LORD say, “The LORD will surely separate me from his people”; and let not the eunuch say, “Look, I am a dry tree.”
translation:
  language: zh_hans
  text: 那归附耶和华的外族人，不要说：“耶和华必定把我从他的子民中分离出来。”太监也不要说：“看哪，我是一棵枯树。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן הַנֵּכָר
  choice: 外族人
  rationale: 字面为“外族之子”，在本节指不属于以色列本族的人；“外族人”自然、庄重，也与后文“他的子民”形成对照。
- source_word: הַנִּלְוָה אֶל יְהוָה
  choice: 归附耶和华
  rationale: נלוה 表示联结、依附；“归附”既传达主动归向并与耶和华联合，也避免过度具体化为某种后世宗教身份。
- source_word: הַבְדֵּל יַבְדִּילַנִי
  choice: 必定把我……分别出去
  rationale: 保留希伯来语不定式绝对式加限定动词所表达的强烈确定语气；“分别出去”也保留 בדל 的分隔意象。
- source_word: הַסָּרִיס
  choice: 太监
  rationale: 该词可指被阉割者或宫廷宦官；上下文以不能生育的“枯树”为喻，“太监”是现代汉语中简明且贴合语境的表达。
- source_word: הֵן
  choice: 看哪
  rationale: 保留引人注意、强调自身处境的语气，较“看”更庄重，适合先知书体裁。
- source_word: עֵץ יָבֵשׁ
  choice: 一棵枯树
  rationale: 直译其树木意象，表达无后裔、无果实的自我认知，不在正文中解释或弱化隐喻。
theological_decisions:
- issue: 外族人与耶和华关系的表述
  choice: 归附耶和华
  alternative: 加入耶和华的群体
  rationale: 原文直接说与耶和华联结，而非仅加入社群；译文保留这一神学关系，同时不进一步界定其礼仪或盟约身份。
- issue: 耶和华是否会排斥外族人的陈述
  choice: 保留说话者所担忧的肯定语气：“必定”
  alternative: 译作疑问或较弱的“恐怕会”
  rationale: 原文是带强化结构的直接引语，表达外族人的断定或忧虑；本节命令他不要这样说，并非译者应在引语内先行纠正。
- issue: “枯树”的含义
  choice: 保留隐喻，不在正文中释为“没有后代”
  alternative: 意译为“我不能留下后代”
  rationale: 原文的生育、延续和生命意象具有神学张力，并与下文应许相连，应予保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式尽量贴近希伯来文的两组“不要说”，同时以自然汉语处理修饰结构。神名译为“耶和华”，符合现代中文圣经传统并明确呈现四字神名。
