  text: נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה מְקַבֵּ֖ץ נִדְחֵ֣י יִשְׂרָאֵ֑ל ע֛וֹד אֲקַבֵּ֥ץ עָלָ֖י/ו לְ/נִקְבָּצָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/008.yaml
  text: 'The declaration of the Lord GOD[b][a], who gathers the outcasts of Israel: I will gather still more to him besides those already gathered to him.'
translation:
  language: zh_hans
  text: 这是主耶和华[a]的宣告；他招聚以色列被赶散的人：“我要在已经归聚于他的那些人之外，再招聚人归于他[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主耶和华”译自 אֲדֹנָי יְהוָה，直译为“主YHWH”；后一个词是以色列上帝的名字。
    reason: lexical_alternative
  - marker: b
    text: “归于他”原文两处后缀均为阳性单数，可能把以色列视为一个整体；也可按集合意义译为：“我要在已经归聚于他们的那些人之外，再招聚其他人归于他们。”其所指也有人理解为锡安或那地。
    reason: alternative_reading
lexical_decisions:
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 保留名词性和庄严的神谕引介语气，同时符合现代汉语表达。
- source_word: אֲדֹנָי יְהוָה
  choice: 主耶和华
  rationale: 分别对应 אֲדֹנָי（主）和神圣名字 יהוה；“主耶和华”是简体中文圣经语域中自然且庄重的组合。
- source_word: מְקַבֵּץ
  choice: 他招聚
  rationale: 分词描述神是招聚者；“招聚”既有召集又有使分散者归回的含义。
- source_word: נִדְחֵי יִשְׂרָאֵל
  choice: 以色列中被赶散的人
  rationale: נדח 不只表示中性的分散，也可指被驱逐、赶散；此译法保留其受迫离散的意味。
- source_word: עוֹד אֲקַבֵּץ
  choice: 我还要招聚更多的人
  rationale: עוֹד 在此具有追加之意，未完成式表达神将来的应许或意向。
- source_word: עָלָיו
  choice: 归于他
  rationale: 保留希伯来文第三人称阳性单数后缀，让“他”可继续体现以色列作为集合性单数的表达，而不改写成复数。
- source_word: לְנִקְבָּצָיו
  choice: 除了已经归聚于他的
  rationale: 表达 לְ 在上下文中的追加、在已有群体之外之意，并体现被动分词所表示的已归聚状态；保留单数后缀。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוָה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”较直接地保留两个希伯来语成分，也避免把 יהוה 仅处理成普通称号；脚注说明其构成和神名性质。
- issue: עָלָיו / נִקְבָּצָיו 单数后缀的所指
  choice: 在正文中译为单数“他”，可能把以色列人格化为集合性单数
  alternative: 按集合意义译成“他们”；或理解为归到锡安／那地
  rationale: 希伯来文后缀确为阳性单数，正文不将其提前化解为复数；脚注保留集合复数译法及所指的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“招聚”贯穿本节，呈现 מקבץ／אקבץ／נקבציו 的词根呼应。引号明确区分神的第一人称宣告；正文保留单数代词造成的真实歧义，并以脚注交代其他理解。
