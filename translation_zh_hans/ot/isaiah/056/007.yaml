  text: וַ/הֲבִיאוֹתִ֞י/ם אֶל הַ֣ר קָדְשִׁ֗/י וְ/שִׂמַּחְתִּי/ם֙ בְּ/בֵ֣ית תְּפִלָּתִ֔/י עוֹלֹתֵי/הֶ֧ם וְ/זִבְחֵי/הֶ֛ם לְ/רָצ֖וֹן עַֽל מִזְבְּחִ֑/י כִּ֣י בֵיתִ֔/י בֵּית תְּפִלָּ֥ה יִקָּרֵ֖א לְ/כָל הָ/עַמִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/007.yaml
  text: I will bring them to my holy mountain[a], and I will make them glad in my house of prayer; their burnt offerings and their sacrifices will be accepted on my altar, for my house will be called a house of prayer for all peoples.
translation:
  language: zh_hans
  text: 我必领他们到我的圣山，使他们在我的祷告之殿中欢喜。他们的燔祭和祭物，在我的祭坛上必蒙悦纳；因为我的殿必称为供万民祷告的殿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万民”也可译作“万国”。希伯来语 עַמִּים 可指各族人民或各国；此处译作“万民”，以保留上下文中对不同族群的广泛涵盖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבִיאוֹתִים
  choice: 我必领他们到
  rationale: 使役形态表达上帝主动使他们来到；“领他们到”在现代汉语中自然，并保留上帝的主动作为。
- source_word: אֶל הַר קָדְשִׁי
  choice: 我的圣山
  rationale: 直译这一结构，保留锡安及圣殿山的神圣意象。
- source_word: וְשִׂמַּחְתִּים
  choice: 使他们……欢喜
  rationale: 保留该动词加强形态所表达的使役意味，即上帝使他们得着喜乐。
- source_word: בְּבֵית תְּפִלָּתִי
  choice: 在我祷告的殿中
  rationale: 保留“祷告”这一具体含义，并以自然汉语表达这是属上帝、以祷告为特征的殿。
- source_word: עוֹלֹתֵיהֶם
  choice: 他们的燔祭
  rationale: “燔祭”是该祭祀术语在中文圣经语境中的准确而通行的对应词。
- source_word: וְזִבְחֵיהֶם
  choice: 和祭物
  rationale: 该词泛指宰献的祭牲或祭物；“祭物”既与“燔祭”区分，也避免不必要地缩窄类别。
- source_word: לְרָצוֹן
  choice: 必蒙悦纳
  rationale: 在献祭语境中表示获得上帝的认可与喜悦；“蒙悦纳”自然表达这种关系，并未把接受者省略所造成的意义补得过满。
- source_word: עַל מִזְבְּחִי
  choice: 在我的祭坛上
  rationale: 直接、自然地表达祭物所在及献上的位置。
- source_word: כִּי
  choice: 因为
  rationale: 明确保留该连词对前文所作的原因或依据说明。
- source_word: בֵיתִי בֵית תְּפִלָּה יִקָּרֵא
  choice: 我的殿必称为……祷告的殿
  rationale: 保留原文“我的殿—祷告的殿”的重复和宣告语气，也准确反映被动式“必称为”。
- source_word: לְכָל הָעַמִּים
  choice: 万民
  rationale: “万民”自然、庄重，涵盖各族群与各民族，又不使人误解为现代民族国家；在句中表达这殿为所有群体而设的范围。
theological_decisions:
- issue: לְכָל הָעַמִּים 的范围
  choice: 万民
  alternative: 万国；所有民族
  rationale: 上下文涉及外族人加入耶和华的敬拜。“万民”保留原文广泛而群体性的范围，不把普世视野缩限为现代国家，也不越过经文本身去界定其神学实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“圣山、燔祭、祭坛、蒙悦纳”等保留必要的圣经祭祀和圣所用语；句式尽量清晰，同时保留原文的宣告感与“殿”字的强调性重复。
