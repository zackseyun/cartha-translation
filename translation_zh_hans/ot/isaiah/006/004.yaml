id: ISA.6.4
reference: Isaiah 6:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּנֻ֨עוּ֙ אַמּ֣וֹת הַ/סִּפִּ֔ים מִ/קּ֖וֹל הַ/קּוֹרֵ֑א וְ/הַ/בַּ֖יִת יִמָּלֵ֥א עָשָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/004.yaml
  text: The foundations of the thresholds shook at the sound of the one calling[b][a], and the house was filled with smoke.
translation:
  language: zh_hans
  text: 门槛的支座[a]因那呼喊者的声音而震动，殿宇[b]里充满了烟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“门槛的柱脚”“门槛的门柱”。原文所指是门口或门槛区域的结构构件。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“房屋”；这里指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנֻעוּ
  choice: 震动
  rationale: נוּעַ表示摇动或震动；“震动”自然、鲜明，又不过度限定震动的强度。
- source_word: אַמּוֹת הַסִּפִּים
  choice: 门槛的支座
  rationale: אַמּוֹת在这一建筑性搭配中指门口或门槛区域的支撑构件，具体可理解为支座、柱脚或门柱；“门槛的支座”保留了结构关系及原文的不完全确定性。
- source_word: מִקּוֹל
  choice: 因……的声音
  rationale: 介词מִן在此表达原因；此译法在现代汉语中自然，并明确保留声音引发震动的关系。
- source_word: הַקּוֹרֵא
  choice: 那呼喊者
  rationale: 这是带冠词的实词化分词，指正在呼喊的那一位；不在正文中进一步认定其身份，从而保留原文指称方式。
- source_word: וְהַבַּיִת
  choice: 殿宇
  rationale: בַּיִת字面为“房屋”，在异象语境中指圣殿内部；“殿宇”既自然传达所指，又不像直接增译“圣殿”那样完全消除原词的宽度。
- source_word: יִמָּלֵא
  choice: 充满了
  rationale: 尼法勒未完成式在叙事顺序中表示殿宇进入被烟充满的状态；汉语“充满了”自然呈现该结果。
- source_word: עָשָׁן
  choice: 烟
  rationale: 这是该词直接、自然的现代汉语对应词。
theological_decisions:
- issue: 异象中的圣殿用语
  choice: 殿宇
  alternative: 房屋；圣殿
  rationale: 原文使用普通名词בַּיִת，但上下文所指是圣殿。“殿宇”兼顾原词与语境；脚注说明其字面形式，以免把解释悄然当作原文字面。
- issue: 呼喊者的身份
  choice: 那呼喊者
  alternative: 撒拉弗；主
  rationale: 原文只写“那正在呼喊的”，近处语境虽指向撒拉弗的呼喊，正文仍不补出身份，以保留其语法表达和可能的指称张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“门槛的支座”保留建筑意象及词义弹性；“殿宇”适合异象语境，脚注交代原文直译。所有脚注标记均置于正文相应词语之后。
