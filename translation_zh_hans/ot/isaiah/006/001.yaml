source:
  edition: WLC
  text: בִּ/שְׁנַת מוֹת֙ הַ/מֶּ֣לֶךְ עֻזִּיָּ֔הוּ וָ/אֶרְאֶ֧ה אֶת אֲדֹנָ֛/י יֹשֵׁ֥ב עַל כִּסֵּ֖א רָ֣ם וְ/נִשָּׂ֑א וְ/שׁוּלָ֖י/ו מְלֵאִ֥ים אֶת הַ/הֵיכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/001.yaml
  text: In the year of King Uzziah’s death[a], I saw the Lord seated on a throne, high and lifted up[b], and the hem of his robe filled the temple.
translation:
  language: zh_hans
  text: 乌西雅王去世那年，我看见主坐在一座高耸而崇高的宝座上；他袍子的下摆[a]充满了圣殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他袍子拖曳的衣裾”。
    reason: שׁוּלָיו 可指衣服的下摆、边缘或拖在后面的衣裾。
  - marker: b
    text: “圣殿”原文也可译作“宫殿”。
    reason: הֵיכָל 同时具有“宫殿”和“圣殿”的词义；这里的异象兼有王宫与圣所色彩。
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת הַמֶּלֶךְ עֻזִּיָּהוּ
  choice: 乌西雅王去世那年
  rationale: 以自然的现代汉语表达时间结构，同时把 מוֹת 译作已发生的“去世”，而不是过程性的“垂死”。
- source_word: וָאֶרְאֶה
  choice: 我看见
  rationale: 准确表达第一人称叙事中的看见异象；汉语无需机械译出句首连接词。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这里是神圣称号 אֲדֹנָי，并非四字神名；译作“主”既保留称号性质，也不擅自代入原文没有写出的圣名。
- source_word: יֹשֵׁב עַל כִּסֵּא
  choice: 坐在……宝座上
  rationale: 保留君王登基、掌权的具体图像，并采用自然清楚的现代汉语。
- source_word: רָם וְנִשָּׂא
  choice: 高高举起的
  rationale: 两个词共同描绘高耸、崇高的状态；此处按最直接的句法关系修饰“宝座”，并尽量保留原文的空间意象。
- source_word: שׁוּלָיו
  choice: 他袍服的下摆
  rationale: 该词指衣服下端或拖曳部分；“袍服的下摆”比“衣裾”更易懂，也比单译“衣边”更能传达宏大的异象。
- source_word: מְלֵאִים אֶת הַהֵיכָל
  choice: 充满了圣殿
  rationale: 参与式形式描写袍服下摆占满整个空间的景象；结合后文撒拉弗与敬拜场景，הֵיכָל 取“圣殿”义，同时以脚注保留“宫殿”的词义可能。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 主人／主宰
  rationale: 原文使用的是神圣称号而非四字神名。“主”保持经文的神学分量，又避免把称号改写成专名。
- issue: הֵיכָל 的语境义
  choice: 圣殿
  alternative: 宫殿
  rationale: 该词可指宫殿或圣殿；本异象既有宝座的王宫意象，也有撒拉弗和圣洁颂赞的圣所意象。正文采用较符合整体场景的“圣殿”，脚注保留另一可能。
- issue: רָם וְנִשָּׂא 的修饰对象
  choice: 修饰宝座：“高高举起的宝座”
  alternative: 理解为描述主：“主……崇高尊贵”
  rationale: 原文中该短语紧接“宝座”，最自然可理解为描写宝座高耸；但因“宝座”和“主”在希伯来语中均为阳性单数，语义上主自身的崇高仍会在异象中产生共鸣，不宜扩写为排他的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“乌西雅王去世那年”符合当代汉语时间表达；“高高举起的宝座”保留异象的空间感和崇高感；以“袍服的下摆”避免过度文言化。脚注标记均置于相关词语之后。
