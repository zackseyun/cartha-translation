  naturalness: “我便说”“主啊，还要到几时呢？”和“直到城邑荒废，无人居住，房屋空无一人”均自然、庄重，适合现代汉语先知书语体。“土地也荒废，沦为荒凉之地”比“土地也荒凉，成为废墟”更自然，也避免“荒凉”与“成为”搭配略显生硬。
  terminology: “主啊”恰当对应 אֲדֹנָי；“城邑”“房屋”“土地”均符合语境。“空无一人”准确表达 אָדָם 的泛指，未错误限缩为男性。末句应以“荒凉之地”而非“废墟”对应 שְׁמָמָה。
