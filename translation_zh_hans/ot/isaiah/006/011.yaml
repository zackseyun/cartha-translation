id: ISA.6.11
reference: Isaiah 6:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֹמַ֕ר עַד מָתַ֖י אֲדֹנָ֑/י וַ/יֹּ֡אמֶר עַ֣ד אֲשֶׁר֩ אִם שָׁא֨וּ עָרִ֜ים מֵ/אֵ֣ין יוֹשֵׁ֗ב וּ/בָתִּים֙ מֵ/אֵ֣ין אָדָ֔ם וְ/הָ/אֲדָמָ֖ה תִּשָּׁאֶ֥ה שְׁמָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/011.yaml
  text: Then I said[a], “Until when, Lord?” And he said, “Until cities lie waste, without inhabitant, and houses without man, and the land is laid waste[b], a desolation.”
translation:
  language: zh_hans
  text: 我便说[a]：“主啊，还要到几时呢？”他说：“直到城邑荒废，无人居住，房屋空无一人，土地也荒废，沦为荒凉之地[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我便问”。
    reason: “说”在此处引出询问；正文保留原文常用动词“说”的叙事表达。
  - marker: b
    text: 原文直译作“土地荒废，成为荒凉”，以相近的荒废用语加强土地彻底凄凉的景象。
    reason: 说明末句动词与名词的累加强调，同时避免将“荒凉”限缩为具体的“废墟”。
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我就说
  rationale: 连续式叙事动词推进场景；“就”自然表达先知随即回应，同时保留简单的“说”。
- source_word: עַד מָתַי
  choice: 要到什么时候呢
  rationale: 既保留“直到何时”的时间界限，也符合现代汉语问句习惯，并与答语中的“直到”形成呼应。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是先知对上帝的直接称呼；“主”是庄重而通行的译法，语气词“啊”自然标明呼语。
- source_word: עַד אֲשֶׁר אִם
  choice: 直到
  rationale: 该组合在此引出审判持续的界限；不把 אִם 生硬译成条件性的“如果”。
- source_word: שָׁאוּ עָרִים
  choice: 城邑荒废
  rationale: שׁאה 表示遭毁坏而荒凉的状态；“城邑荒废”凝练、庄重，并符合先知书语体。
- source_word: מֵאֵין יוֹשֵׁב
  choice: 无人居住
  rationale: 准确表达没有居民或居住者，比逐字译作“没有居住者”更自然。
- source_word: וּבָתִּים מֵאֵין אָדָם
  choice: 房屋空无一人
  rationale: אָדָם 在这里泛指人，并非特指男性；“空无一人”保留无人存在的强烈图景，也避免现代汉语中“没有男人”的误读。
- source_word: וְהָאֲדָמָה
  choice: 土地
  rationale: 此处指整个国土或地域受审判后的景况；“土地”既可涵盖国土，也保持与人居环境的联系。
- source_word: תִּשָּׁאֶה שְׁמָמָה
  choice: 荒凉，成为废墟
  rationale: 动词与名词叠加强化彻底荒废的结果；汉语用两个连续表述保留这种强化，而不机械重复同词。
theological_decisions:
- issue: 审判持续到何时
  choice: 保留“直到”而不暗示随后必然立即复兴
  alternative: 译成“直到……为止”，使读者容易推断其后状态必然逆转
  rationale: 原文明确给出先知使命与土地荒废之间的时间界限，却未在本节说明荒废之后具体发生什么；译文不补足这种神学结论。
- issue: אָדָם 的泛指意义
  choice: 空无一人
  alternative: 没有男人
  rationale: 此处 אָדָם 指一般的人或人类个体，而不是强调男性；“一人”准确传达泛指范围。
- issue: 荒凉措辞的强化
  choice: 荒凉，成为废墟
  alternative: 完全荒凉
  rationale: 保留 תִּשָּׁאֶה 与 שְׁמָמָה 的双重表达，让审判图景保持原文的累加强度，而不把它缩减为单一程度副词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留先知叙事的简洁与审判宣告的沉重节奏。“城邑”略带书面庄重色彩，但在现代汉语中清楚可懂；“房屋空无一人”与“无人居住”形成自然平行。所有脚注标记均已置于正文。
