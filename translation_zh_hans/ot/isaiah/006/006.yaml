base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/006.yaml
  text: Then one of the seraphim flew to me[a], and in his hand was a glowing coal that he had taken from the altar with tongs.
translation:
  language: zh_hans
  text: 于是，撒拉弗中有一位飞到我这里，手里拿着一块炽热的炭[a]，是他用钳子从祭坛上取来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“烧热的石块”。原文所用的词可指从祭坛上取下的热石或燃着的炭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעָף אֵלַי
  choice: 飞到我这里来
  rationale: עוּף表示飞行，אֵלַי表示朝向说话者；合译为“飞到我这里来”，自然地保留动作及方向。
- source_word: אֶחָד מִן הַשְּׂרָפִים
  choice: 撒拉弗中有一位
  rationale: שְׂרָפִים在本异象中指一类天上活物；采用中文圣经语境中通行的专名“撒拉弗”，避免用“燃烧者”等词源性译法增加解释色彩。
- source_word: וּבְיָדוֹ
  choice: 手里拿着
  rationale: 原文是表示“在他手中”的名词性结构；中文用“手里拿着”补足自然句法，同时保留具体画面。
- source_word: רִצְפָּה
  choice: 一块炽热的炭
  rationale: 该词在这里指从祭坛取来的灼热物体，可理解为热石、炭或余火；“炽热的炭”符合祭坛场景，也便于现代读者理解，其词义范围在脚注中说明。
- source_word: בְּמֶלְקַחַיִם
  choice: 用火钳
  rationale: מֶלְקַחַיִם指夹取祭坛炭火的钳子；“火钳”简洁、自然，并明确其工具作用。
- source_word: לָקַח מֵעַל הַמִּזְבֵּחַ
  choice: 是……从祭坛上取来的
  rationale: 完成式לָקַח描述此前已经完成的动作；“是……取来的”清楚表达它先被从祭坛上取下，随后被带到以赛亚面前。
theological_decisions:
- issue: 异象中שְׂרָפִים的译法
  choice: 撒拉弗
  alternative: 燃烧者
  rationale: 这里的词指宝座异象中特定的一类天上活物。保留专名可维持叙事和神学上的特指性，同时不把词源含义直接当作身份解释。
- issue: 祭坛洁净场景中רִצְפָּה所指的物体
  choice: 炽热的炭
  alternative: 烧热的石块
  rationale: 原词可指灼热的石块或炭火，具体材质并不完全确定。“炽热的炭”在现代中文中画面清楚，又不加入后来的教义性解释；脚注保留“烧热的石块”的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接前文异象；“撒拉弗”沿用通行专名；脚注标记紧随存在词义歧义的“炭”，而非置于方向短语之后。
