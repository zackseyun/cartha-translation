  text: וָ/אֶשְׁמַ֞ע אֶת ק֤וֹל אֲדֹנָ/י֙ אֹמֵ֔ר אֶת מִ֥י אֶשְׁלַ֖ח וּ/מִ֣י יֵֽלֶךְ לָ֑/נוּ וָ/אֹמַ֖ר הִנְ/נִ֥י שְׁלָחֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/008.yaml
  text: Then I heard the voice of the Lord saying[a], “Whom shall I send, and who will go for us?” And I said, “Here am I[b]. Send me.”
translation:
  language: zh_hans
  text: 于是，我听见主的声音说：“我该差遣谁呢？谁愿为我们[a]去呢？”我说：“我在这里[b]，请差遣我！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“替我们”或“为我们”。这个复数可能与上下文中的天上议会有关；一些基督徒也从整本正典的角度，认为它与后来关于三一的启示相呼应。经文本身没有说明“我们”具体指谁。
    reason: 保留第一人称复数的神学张力，并说明主要解释可能。
  - marker: b
    text: 也可译作“我在此”。这个希伯来语惯用语表达已经准备好、愿意听命。
    reason: 说明该惯用语的另一种译法及语用含义。
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: 于是，我听见
  rationale: 连续叙事形式推进场景；“于是”自然表达承接关系，“听见”准确传达感知声音之意。
- source_word: קוֹל אֲדֹנָי אֹמֵר
  choice: 主的声音说
  rationale: קוֹל 在有明确言语内容的语境中指“声音”；אֲדֹנָי 译作尊称“主”；分词 אֹמֵר 以“说”自然衔接直接引语。
- source_word: מִי אֶשְׁלַח
  choice: 我该差遣谁呢
  rationale: 保留第一人称单数及疑问语气；“该”在现代汉语中自然表达说话者的审议意味，而不把句子改成能力问题。
- source_word: וּמִי יֵלֶךְ לָנוּ
  choice: 谁会替我们去呢
  rationale: 保留 לָנוּ 的第一人称复数“我们”；“替……去”自然表达代表或为其前往，但不进一步指定“我们”的所指。
- source_word: הִנְנִי
  choice: 我在这里
  rationale: 这一希伯来语惯用语表达自我呈现、准备好并可供差遣；正文采用自然庄重的现代汉语，脚注说明其语用含义。
- source_word: שְׁלָחֵנִי
  choice: 请差遣我
  rationale: 祈使式加第一人称单数宾语后缀，表达主动请命；汉语加“请”可自然传达向主提出请求，而非削弱命令形式。
theological_decisions:
- issue: 神圣话语中的第一人称复数“我们”
  choice: 正文保留“我们”，不确定其所指。
  alternative: 解释为天上议会、尊贵或商议复数，或基督徒按整本正典理解为与后来三一启示相呼应。
  rationale: 希伯来文本明确使用第一人称复数后缀。译文应保留文本本身的张力，不改成单数，也不在正文中指定所指。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”推进叙事；问句保留审议语气；结尾用“请差遣我”表现先知主动请命。脚注标记按其实际解释对象分别置于“我们”和“我在这里”之后。
