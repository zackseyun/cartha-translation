reference: Isaiah 6:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֹמַ֞ר אֽוֹי לִ֣/י כִֽי נִדְמֵ֗יתִי כִּ֣י אִ֤ישׁ טְמֵֽא שְׂפָתַ֨יִם֙ אָנֹ֔כִי וּ/בְ/תוֹךְ֙ עַם טְמֵ֣א שְׂפָתַ֔יִם אָנֹכִ֖י יוֹשֵׁ֑ב כִּ֗י אֶת הַ/מֶּ֛לֶךְ יְהוָ֥ה צְבָא֖וֹת רָא֥וּ עֵינָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/005.yaml
  text: And I said[a], “Woe is me, for I am ruined; for I am a man of unclean lips, and I dwell among a people of unclean lips; for my eyes have seen the King[b], Yahweh of Armies.”
translation:
  language: zh_hans
  text: 我就说：“我有祸了！我灭亡了[a]！因为我是嘴唇不洁的人，又住在嘴唇不洁的民中；我的眼睛看见了君王——万军之耶和华[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我灭亡了”也可译作“我完了”“我被毁灭了”或“我归于沉寂了”。
    reason: 原词 נִדְמֵיתִי 在此可能表达毁灭、断绝或沉寂；正文不能完全呈现其词义幅度。
  - marker: b
    text: “耶和华”是希伯来文中的神名，也常音译作“雅威”；“万军之耶和华”传统上也译作“万军之主”。
    reason: 说明神名与整个称号的主要译法，帮助读者区分专名和替代称谓。
lexical_decisions:
- source_word: אֽוֹי לִי
  choice: 我有祸了
  rationale: 这是表达哀号与灾祸临头的感叹；“我有祸了”自然、庄重，也保留先知面对审判时的惊惧。
- source_word: נִדְמֵיתִי
  choice: 我灭亡了
  rationale: 此处 דמה 的尼法勒形式表示被毁灭、归于沉寂或断绝；“我灭亡了”在异象语境中清楚传达以赛亚在神圣临在前所感到的致命危机，同时以脚注保留词义的不确定性。
- source_word: אִישׁ טְמֵא שְׂפָתַיִם
  choice: 嘴唇不洁的人
  rationale: 保留 אִישׁ 的自指个体意义，也按希伯来语意象将不洁具体落在“嘴唇”上，指向言语与敬拜方面的不洁。
- source_word: וּבְתוֹךְ עַם
  choice: 又住在……民中
  rationale: בְּתוֹךְ 表示“在……中间”；结合 יוֹשֵׁב，译文采用现代汉语自然的“住在……民中”，保留持续居住和群体归属感。
- source_word: הַמֶּלֶךְ
  choice: 大君王
  rationale: 原文是带定冠词的“王”。汉语“君王”较庄重；加入“大”体现该称号用于耶和华时的尊崇语气，而不改变其身份所指。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”直接呈现四字神名在汉语中的通行音译；“万军之”是 צְבָאוֹת 的传统而仍可理解的表达，涵盖神所统辖的天上众军，并避免把所指不必要地限定为人间军队。
- source_word: רָאוּ עֵינַי
  choice: 我的眼睛竟看见了
  rationale: 保留“我的眼睛看见”的希伯来语强调方式；“竟”自然表达说话者面对这一经历的震惊与惧怕。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用神的专名。正文采用现代中文圣经读者最熟悉的专名形式“耶和华”，脚注说明其为神名，并列出更贴近学术重构发音的“雅威”，不以“主”取代专名。
- issue: יְהוָה צְבָאוֹת 中 צְבָאוֹת 的范围
  choice: 万军之耶和华
  alternative: 众军之耶和华
  rationale: 原词可指军队或成群的众军，在此作为神的称号，强调他统辖天上众军。“万军之耶和华”保留庄严且通行的汉语称号，同时不武断限定这些军队的具体构成。
- issue: 以赛亚“看见”神与神圣临在的张力
  choice: 直译为“我的眼睛竟看见了大君王”
  alternative: 我的眼睛看见了大君王的显现
  rationale: 原文直接说眼睛看见了王，并未加入“显现”“异象中的形象”等限定；译文保留这一直接表述及其神学张力，不替原文解释他究竟以何种方式看见。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留先知惊呼的急迫感、重复的“嘴唇不洁”以及“我的眼睛看见”这一希伯来语强调结构。以破折号凸显“大君王”与“万军之耶和华”的同位关系；所有脚注标记均已置于正文相应位置。
