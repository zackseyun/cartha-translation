source:
  edition: WLC
  text: הַשְׁמֵן֙ לֵב הָ/עָ֣ם הַ/זֶּ֔ה וְ/אָזְנָ֥י/ו הַכְבֵּ֖ד וְ/עֵינָ֣י/ו הָשַׁ֑ע פֶּן יִרְאֶ֨ה בְ/עֵינָ֜י/ו וּ/בְ/אָזְנָ֣י/ו יִשְׁמָ֗ע וּ/לְבָב֥/וֹ יָבִ֛ין וָ/שָׁ֖ב וְ/רָ֥פָא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/010.yaml
  text: Make the heart of this people dull[a], and make their ears heavy, and blind their eyes, lest they see with their eyes, and hear with their ears, and understand with their heart, and turn back[c][b], and be healed.
translation:
  language: zh_hans
  text: 要使这百姓的心迟钝，使他们的耳朵发沉，使他们的眼睛昏蒙[a]，免得他们用眼睛看见，用耳朵听见，心里明白，回转过来[b]，并得到医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“闭住他们的眼睛”或“遮住他们的眼睛”；希伯来语动词表示使眼睛闭塞、失去反应。
    reason: lexical_alternative
  - marker: b
    text: 或译“返回”；这个动词一般表示转回或返回，在本处语境中也可能包含悔改、归回的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁמֵן לֵב
  choice: 使……的心迟钝
  rationale: הַשְׁמֵן字面为“使肥胖”，与“心”连用时表示使内在的理解和意志变得迟钝、不敏锐。“心迟钝”既传达习语意义，也保留原文的人体意象。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留希伯来语集合单数和先知话语的庄重语气；“这百姓”在现代汉语中自然，并不必改作“这些人”。
- source_word: וְאָזְנָיו הַכְבֵּד
  choice: 使他们的耳朵发沉
  rationale: כבד的基本意象是“沉重”；“耳朵发沉”在汉语中能表达听觉或领受上的不灵敏，同时避免以“刚硬”取代原文不同的比喻。
- source_word: וְעֵינָיו הָשַׁע
  choice: 使他们的眼睛昏蒙
  rationale: 该动词在此表示使眼睛闭塞、失去反应，也可能带有涂抹遮住的意象。“昏蒙”表达视觉被遮蔽的效果，同时以脚注保留词义选择。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达פֶּן的防止性或否定目的含义，并保留原文命令与后果之间尖锐的关系。
- source_word: יִרְאֶה ... יִשְׁמַע ... יָבִין
  choice: 他们……看见……听见……明白
  rationale: 原文动词形态为单数，回指集合名词“这百姓”。现代汉语以复数代词承接更自然，不改变集合所指。
- source_word: לֵב / לְבָבוֹ
  choice: 心／心里
  rationale: לֵב涵盖思想、理解与意志。“心”保留希伯来语的人观和经文共鸣；后半句用“心里明白”符合现代汉语搭配。
- source_word: וָשָׁב
  choice: 回转过来
  rationale: שׁוב的基本意义是转回、返回；“回转过来”保留动作意象，也不直接收窄为专门的宗教术语“悔改”。
- source_word: וְרָפָא לוֹ
  choice: 得到医治
  rationale: 原文表达简练，未明确说出施治者，可理解为“他得医治”或“医治临到他”。“得到医治”自然地表达结果而不补入原文没有明说的主语。
theological_decisions:
- issue: 审判性刚硬中的神圣行动
  choice: 将三个使役命令直接译为“要使……使……使……”，并保留“免得”引出的否定目的句。
  alternative: 弱化为许可式“任凭……变得迟钝”，或改译为单纯结果。
  rationale: 希伯来语使用对先知说的第二人称阳性单数使役命令。直译保留这项使命令人不安的力度及其神学张力，不将其预先解释为单纯许可或结果。
- issue: 集合单数与汉语代词
  choice: 以“这百姓”保留集合称谓，后文用“他们”自然承接。
  alternative: 全句维持单数称代，或改为“这些人”。
  rationale: 汉语“百姓”本身可作集合名词，用“他们”承接清楚自然；这既反映原文的群体所指，也避免生硬的单数表达。
- issue: “回转”的悔改含义
  choice: 译作“回转过来”，让上下文呈现其可能包含的悔改意义。
  alternative: 直接译作“悔改”或仅作空间性的“回来”。
  rationale: שׁוב可泛指转回，在先知语境中常包含归向神或悔改，但原词本身并未在此把意义限定为专门术语。
translation_notes:
  register: 采用现代、庄重而易懂的先知话语体。命令句保持原文的强烈语气；“迟钝、发沉、昏蒙”分别保存心、耳、眼的不同意象，避免把三者一概抽象化为“刚硬”。标点以分号分开命令和“免得”从句，使长句层次清楚。
