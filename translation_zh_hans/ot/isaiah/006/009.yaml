base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/009.yaml
  text: 'And he said[a], “Go, and say to this people: ‘Keep hearing, but do not understand; keep seeing, but do not perceive.’”'
translation:
  language: zh_hans
  text: 他说[a]：“你去对这百姓说：‘你们尽管听，却不要明白；尽管看，却不要知晓。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他说：‘你去对这百姓说：你们听了又听，却不要明白；看了又看，却不要知晓。’”这种译法较形式化地保留希伯来语的加强结构。这句话也可理解为带有预言意味：“你们确实会听见……确实会看见……”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 叙事性的 wayyiqtol，引出直接引语；中文用“他说”自然承接上文，不额外强调时间先后。
- source_word: לֵךְ וְאָמַרְתָּ
  choice: 你去告诉
  rationale: 保留两个相承的命令，同时以现代汉语自然表达“去，并对……说”。
- source_word: לָעָם הַזֶּה
  choice: 这百姓
  rationale: עָם 是单数集合名词，译作“百姓”既自然，也保留指示词所带的疏离语气。
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: 你们尽管听
  rationale: 命令式加不定词绝对形强化动词。“尽管听”保留命令式及反讽、审判性的语气，同时避免把它单纯改写成预言。
- source_word: וְאַל תָּבִינוּ
  choice: 却不要明白
  rationale: בין 表示理解、辨明；“却”自然呈现听与不明白之间的转折。
- source_word: וּרְאוּ רָאוֹ
  choice: 尽管看
  rationale: 同样是命令式加不定词绝对形；与“尽管听”形成平行，体现强化语气。
- source_word: וְאַל תֵּדָעוּ
  choice: 却不要知晓
  rationale: ידע 的直接词义是知道、认识；“知晓”保留它与前句 בין“明白”的词汇区别，也容纳此处“认出、领会”的语境含义。
theological_decisions:
- issue: 本节应译为直接命令，还是带审判意味的预言
  choice: 按希伯来语形式译为直接命令：“尽管听……不要明白；尽管看……不要知晓。”
  alternative: 译成预言语气：“你们必定听见……却不明白；必定看见……却不知道。”
  rationale: שִׁמְעוּ 和 רְאוּ 在形式上是命令式，后面的 אַל 加未完成式也自然延续禁止命令。上下文使这些话带有反讽和司法审判的张力，但正文不应把明确的命令形式直接消解为单纯预言；预测性的理解在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这百姓”保留原文的集合单数和疏离色彩；“尽管……却……”呈现强化命令及其反讽张力。“知晓”略显庄重，但可与“明白”区分，并避免把 ידע 的语义完全收窄为视觉性的“看出”。
