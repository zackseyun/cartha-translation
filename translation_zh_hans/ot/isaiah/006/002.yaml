  text: שְׂרָפִ֨ים עֹמְדִ֤ים מִ/מַּ֨עַל֙ ל֔/וֹ שֵׁ֧שׁ כְּנָפַ֛יִם שֵׁ֥שׁ כְּנָפַ֖יִם לְ/אֶחָ֑ד בִּ/שְׁתַּ֣יִם יְכַסֶּ֣ה פָנָ֗י/ו וּ/בִ/שְׁתַּ֛יִם יְכַסֶּ֥ה רַגְלָ֖י/ו וּ/בִ/שְׁתַּ֥יִם יְעוֹפֵֽף׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/002.yaml
  text: 'Seraphim were standing above him. Each had six wings: with two he covered his face[a], and with two he covered his feet, and with two he flew.'
translation:
  language: zh_hans
  text: 撒拉弗[a]站立在他上方；每一个都有六只翅膀：用两只遮自己的脸，用两只遮自己的脚，用两只飞翔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撒拉弗”是音译；这个词可能与表示“燃烧”的词根有关，因而也可理解为“燃烧者”。
    reason: 说明名称的音译性质及可能但不确定的词源含义。
lexical_decisions:
- source_word: שְׂרָפִים
  choice: 撒拉弗
  rationale: 采用现代中文圣经语境中较为人熟悉的音译，指异象中这一类天上活物；不把可能的词源含义直接写入正文，以免将不确定的词源解释当作确定含义。
- source_word: עֹמְדִים
  choice: 侍立
  rationale: 分词描绘持续的站立姿态；“侍立”既符合宝座异象的场景，也自然表达他们站在主面前服侍的姿态，但不额外说明其具体职分。
- source_word: מִמַּעַל לוֹ
  choice: 在他上方
  rationale: 按空间关系直译，代词依上下文指坐在宝座上的主；保留原文所呈现的相对位置。
- source_word: שֵׁשׁ כְּנָפַיִם ... שֵׁשׁ כְּנָפַיִם לְאֶחָד
  choice: 每一个都有六只翅膀
  rationale: 原文先说“六只翅膀”，再以分配式表达“每一个”；中文整合为自然清楚的说法，同时保留每个个体各有六翼的含义。
- source_word: בִּשְׁתַּיִם
  choice: 用两只
  rationale: 介词表达工具或方式，所指是六只翅膀中的两只；“用两只”简明并与三组动作平行。
- source_word: יְכַסֶּה פָנָיו
  choice: 遮脸
  rationale: 忠实表达“遮盖自己的脸”；中文在“每一个”统摄下可自然省略重复的物主代词。
- source_word: יְכַסֶּה רַגְלָיו
  choice: 遮脚
  rationale: רַגְלָיו在此按通常意义译为“脚”；不采用可能带有委婉解释的其他译法，以保留原文表层含义。
- source_word: יְעוֹפֵף
  choice: 飞翔
  rationale: 未完成式在异象描写中表示其飞行动作或能力；“飞翔”与前两项并列，中文简洁自然。
theological_decisions:
- issue: שְׂרָפִים应音译还是按词源意译
  choice: 正文音译为“撒拉弗”，脚注说明可能的词源含义
  alternative: 译为“燃烧者”或“烈焰者”
  rationale: 经文把该词用作一类天上活物的名称，而其与“燃烧”词根的关系虽很可能存在，却不足以要求正文采用意译；音译可避免把词源推测变成明确的形象描写。
- issue: לוֹ所指为何
  choice: 译为“他”，指上下文中坐在宝座上的主
  alternative: 译为“它”，指宝座
  rationale: 该阳性单数代词在紧邻语境中最自然地回指坐在宝座上的主；中文用人格代词与该指向相符。
- issue: 如何表达复数撒拉弗与后续分配式单数
  choice: 用“每一个”统摄三组动作
  alternative: 全句统一使用复数“他们”
  rationale: 原文由复数转为分配式单数，强调每一个撒拉弗各有六翼并分别用两翼行动；“每一个”在中文中准确保留这一结构，而无需为天上活物增添原文没有明确标出的性别代词。
- issue: “遮脚”是否采用委婉释义
  choice: 保留字面表达“遮脚”
  alternative: 解释为遮盖下体或身体下部
  rationale: 原词通常意为“脚”，上下文未明确要求委婉解释；正文不应替原文消除这种可能的含义张力。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙述语体。“侍立”贴合宝座场景；三个“用两只”形成整齐的平行结构。脚注标记置于“撒拉弗”之后，使其明确对应所解释的词。
