  text: וְ/ע֥וֹד בָּ/הּ֙ עֲשִׂ֣רִיָּ֔ה וְ/שָׁ֖בָה וְ/הָיְתָ֣ה לְ/בָעֵ֑ר כָּ/אֵלָ֣ה וְ/כָ/אַלּ֗וֹן אֲשֶׁ֤ר בְּ/שַׁלֶּ֨כֶת֙ מַצֶּ֣בֶת בָּ֔/ם זֶ֥רַע קֹ֖דֶשׁ מַצַּבְתָּֽ/הּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/013.yaml
  text: And though a tenth remains in it[a], it will again be for burning, like a terebinth or like an oak whose stump remains when it is felled. The holy seed is its stump.
translation:
  language: zh_hans
  text: 即使其中还剩下十分之一，也必再次遭到焚烧；就像笃耨香树或橡树被砍倒时[a]，树墩仍然存留。圣洁的种子就是它的树墩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“落叶时”。希伯来词 בְּשַׁלֶּכֶת 含义难定；正文按树被砍后留下树墩的图像翻译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד בָּהּ עֲשִׂרִיָּה
  choice: 即使其中还剩下十分之一
  rationale: 希伯来文直陈“其中仍有十分之一”；结合审判语境，以“即使”表达其延续而又带让步的语气，同时保留明确的十分之一。
- source_word: וְשָׁבָה וְהָיְתָה לְבָעֵר
  choice: 也必再次遭到焚烧
  rationale: שוב 表示再次发生，לבער 表示供焚烧或被烧除；此译保留重复审判及火烧意象，不进一步限定毁灭方式。
- source_word: כָּאֵלָה
  choice: 像笃耨香树
  rationale: אֵלָה 指 terebinth；采用现代中文圣经语境中可辨认的专名“笃耨香树”，避免泛化为普通“大树”。
- source_word: וְכָאַלּוֹן
  choice: 或橡树
  rationale: אַלּוֹן 指橡树；两个平行比喻在中文中自然用“或”连接。
- source_word: בְּשַׁלֶּכֶת
  choice: 被砍倒时
  rationale: 此词含义有争议；按上下文树墩存留的图像，正文采用“被砍倒时”，而将“落叶时”的可能意义收入脚注。
- source_word: מַצֶּבֶת בָּם
  choice: 树墩仍然存留
  rationale: מַצֶּבֶת 在树木比喻中指仍立着的残干或树墩；此译简明地保留砍伐后尚有余存的图像。
- source_word: זֶרַע קֹדֶשׁ
  choice: 圣洁的种子
  rationale: 直译“圣洁的种子”，既承接树木意象，也保留其可指后裔或余民的开放性。
- source_word: מַצַּבְתָּהּ
  choice: 就是它的树墩
  rationale: 与前句 מַצֶּבֶת 的树墩意象对应，并保留阴性单数后缀的指代，不在正文中擅自明确其所指。
theological_decisions:
- issue: “圣洁的种子”的身份
  choice: 保留“圣洁的种子”这一原文表达，不具体说明其身份
  alternative: 明确译作忠信余民、存留的圣约子民或弥赛亚谱系
  rationale: 本节表明审判之后仍有被分别为圣的存留核心，却未在此明确限定其具体身份；直译可保留余民、后裔及树木新生意象之间的神学张力。
- issue: 末句“它的树墩”中代词的所指
  choice: 保留代词“它”
  alternative: 解释为“这地的树墩”或“以色列的树墩”
  rationale: 希伯来文使用阴性单数后缀，但近距离树木比喻与更广语境中的土地或群体均可能影响理解；正文不替读者消除这一指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留先知审判宣告的凝练力度；“笃耨香树”保留具体树种，“树墩”则用普通读者容易理解的词。脚注标记紧随有争议的“被砍倒时”，使注释与正文对应。
