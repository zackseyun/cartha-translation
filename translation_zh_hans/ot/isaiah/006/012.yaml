- from: 雅威必把众人远远迁走[a]，境内荒废之处必增多[b]。
  to: 雅威必把人们远远迁走[a]，境内必有许多荒废之地[b]。
  rationale: 修订仅使谓词更贴近原文对荒废数量或程度的断言，避免将其限定为逐步“增多”的过程；同时改善集合名词及替代译法的现代汉语自然度。原文对具体荒废之地和抽象荒废状态之间的含混，仍由正文与脚注共同保留。
