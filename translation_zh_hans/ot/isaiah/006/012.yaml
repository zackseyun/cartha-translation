  naturalness: “把人们远远迁走”及“境内必有许多荒废之地”在现代庄重书面汉语中自然、清楚。“众人”有时可带“所有人”的强调，改为“人们”更适合这里的集合性居民。
  terminology: “雅威”一致保留四字神名。“人们”适切表达集合单数 הָאָדָם；“荒废之地”保留 הָעֲזוּבָה 可作具体地域的理解，并以脚注保存其抽象理解。
