  text: וְ/רִחַ֥ק יְהוָ֖ה אֶת הָ/אָדָ֑ם וְ/רַבָּ֥ה הָ/עֲזוּבָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/012.yaml
  text: And Yahweh will remove people far away[b][a], and the forsaken places will be many in the midst of the land.
translation:
  language: zh_hans
  text: 雅威必把人们远远迁走[a]，境内必有许多荒废之地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人们”原文为单数的“人”，在这里是集合用法，指当地居民。
    reason: lexical_alternative
  - marker: b
    text: 或译：“境内必极其荒凉”，或“境内的荒废必很严重”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְרִחַק
  choice: 必把……远远迁走
  rationale: 该动词表达使之远离、移到远方；在先知审判的语境中用将来意义的“必……迁走”，既保留距离概念，也自然表达居民被移离本地。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，以保留以色列上帝的专名，而不以称号代替。
- source_word: הָאָדָם
  choice: 众人
  rationale: אָדָם 虽为单数形式，此处却是集合用法，泛指当地人口；“众人”在现代汉语中自然，并不把所指范围缩限为男性。
- source_word: וְרַבָּה
  choice: 必增多
  rationale: 阴性单数形式与后面的 הָעֲזוּבָה 呼应，在此表示数量多或程度大；配合具体化的“荒废之处”，译作“增多”最为顺畅。
- source_word: הָעֲזוּבָה
  choice: 荒废之处
  rationale: 该词可指被撇弃、荒废的状态，也可具体理解为荒废之地；正文采用具体表达，以适合“境内”的空间语境，同时用脚注保留抽象读法。
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: 境内
  rationale: 简洁表达“在这地中间／在这地之内”，说明荒废遍及这片土地内部。
theological_decisions:
- issue: 集合名词 הָאָדָם 的所指
  choice: 众人
  alternative: 人类；人
  rationale: 经文论到审判中当地居民被迁离。“众人”准确传达集合意义，又避免现代汉语中的“人”被误解为单一个体或仅指男性。
- issue: הָעֲזוּבָה 是具体地点还是抽象状态
  choice: 荒废之处
  alternative: 荒凉必很严重；被撇弃的景象必增多
  rationale: 希伯来语容许具体与抽象两种理解。正文采用符合汉语习惯的具体读法，脚注则明确保留抽象的程度性读法，不消除原文的含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“远远迁走”保留使人远离的动作和距离感；“境内荒废之处必增多”简洁自然，并以脚注交代原文也可能侧重荒凉程度。
