  text: וְ/קָרָ֨א זֶ֤ה אֶל זֶה֙ וְ/אָמַ֔ר קָד֧וֹשׁ קָד֛וֹשׁ קָד֖וֹשׁ יְהוָ֣ה צְבָא֑וֹת מְלֹ֥א כָל הָ/אָ֖רֶץ כְּבוֹדֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/003.yaml
  text: 'And one called to another and said: “Holy[a], holy, holy is Yahweh of hosts[b]; the whole earth is full of his glory.”'
translation:
  language: zh_hans
  text: 他们彼此呼喊，说：“圣洁，圣洁，圣洁的是万军之雅威[a]；全地都充满着他的荣耀。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来神名YHWH的拟音；传统上常译作“耶和华”，或以“上主”代替。“万军”指受他统领的众军，可包括天上和地上的力量。
    reason: 说明神名及复合称号的译法与范围。
lexical_decisions:
- source_word: וְקָרָא זֶה אֶל זֶה
  choice: 他们彼此呼喊
  rationale: זֶה אֶל זֶה是相互性的表达；译作“彼此”符合现代汉语。קרא在此是可听见的宣告，结合上下文译作“呼喊”，保留其庄严而响亮的场景感。
- source_word: וְאָמַר
  choice: 说
  rationale: 承接“呼喊”，用“说”直接引出宣告；汉语无需重复连接词“并”。
- source_word: קָדוֹשׁ קָדוֹשׁ קָדוֹשׁ
  choice: 圣哉！圣哉！圣哉！
  rationale: 完整保留三次重复及其强调和礼仪力量；“哉”在现代中文中仍是读者熟悉的庄严颂赞语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来神名YHWH的通行学术拟音译出专名，不以“主”这一称号代替。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: “万军”是中文中简洁且已有传统的表达，涵盖受神统领的众军，而不擅自限定为天军或地上的军队。
- source_word: מְלֹא כָל הָאָרֶץ
  choice: 全地都充满
  rationale: 希伯来语名词性结构在汉语中自然表达为谓语句；“都”突出遍及全地的意思。
- source_word: כְּבוֹדוֹ
  choice: 他的荣耀
  rationale: 关系代词后缀指向雅威；“荣耀”保留כבוד在神显现语境中的分量和光辉，不将其窄化为名声。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质；“耶和华”是较传统的混合读法，“上主”则以称号代替了原文神名。脚注提供传统译法，便于读者辨识。
- issue: 称号יְהוָה צְבָאוֹת的理解
  choice: 万军之雅威
  alternative: 军队之雅威；天军之雅威
  rationale: צְבָאוֹת所指范围可包含天上和地上受其统领的众军；“万军”既保留宽度，也避免只限定为某一种军队。
- issue: 三重“圣”的表达
  choice: 不解释其神学含义，只保留三次重复
  alternative: 将三次重复明示为特定教义指涉
  rationale: 本节本身以重复加强至圣属性，但没有明说重复次数所对应的教义，因此不在正文中增添解释。
translation_notes:
  register: 采用现代、庄严、适合诵读的汉语。“圣哉”保留颂赞语气；其余句法尽量自然简明。正文中的“他们”依据前节复数的撒拉弗补出，使本节单独呈现时主语清楚。
