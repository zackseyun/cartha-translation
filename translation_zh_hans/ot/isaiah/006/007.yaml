  text: וַ/יַּגַּ֣ע עַל פִּ֔/י וַ/יֹּ֕אמֶר הִנֵּ֛ה נָגַ֥ע זֶ֖ה עַל שְׂפָתֶ֑י/ךָ וְ/סָ֣ר עֲוֺנֶ֔/ךָ וְ/חַטָּאתְ/ךָ֖ תְּכֻפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/007.yaml
  text: And he touched my mouth and said, “Look, this has touched your lips; your guilt is removed, and your sin is atoned for.”
translation:
  language: zh_hans
  text: 他用炭触了我的口，说：“看哪，这炭已经触了你的嘴唇；你的罪孽已经除去，你的罪已经得赎。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגַּע עַל־פִּי
  choice: 他用炭碰了我的口
  rationale: 希伯来文直译为“他使之碰到我的口”；主语承接上一节的撒拉弗，省略的受事物是上一节所取的炭。中文补出“用炭”，使指代自然清楚，同时不改变上下文。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引起注意和郑重宣告的语气；“看哪”在现代中文中庄重而仍可理解。
- source_word: עֲוֺנֶךָ
  choice: 你的罪孽
  rationale: עָוֹן在此兼有罪责与罪孽的语义；“罪孽”保留其道德—神学厚度，并与下句“罪”区分。
- source_word: סָר
  choice: 已经除去
  rationale: 表示罪孽从当事人身上被移走；“除去”贴合空间性隐喻，也符合完成性语境。
- source_word: חַטָּאתְךָ תְּכֻפָּר
  choice: 你的罪已经赎清
  rationale: כפר的被动形式表达罪得遮盖、涂抹或赎除；“赎清”自然表达代赎后罪被处理的结果，同时保留被动意义所隐含的施行者。
theological_decisions:
- issue: עָוֹן是译作“罪责”还是“罪孽”
  choice: 罪孽
  alternative: 罪责
  rationale: 该词可指罪行及其罪责；这里与“除去”连用，二者皆可能。正文用较宽的“罪孽”，避免把含义限缩为法律地位。
- issue: תְּכֻפָּר的赎罪含义
  choice: 已经赎清
  alternative: 已经得到遮盖／已经得赎
  rationale: 被动未完成式在并列宣告中具有结果性或完成性。译为“已经赎清”传达赎罪已经生效，但不额外说明赎罪机制或主体。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。保留“看哪”的先知文学色彩；避免过度古雅的“汝”“得蒙”等表达。
