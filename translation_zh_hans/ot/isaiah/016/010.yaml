source:
  edition: WLC
  text: וְ/נֶאֱסַ֨ף שִׂמְחָ֤ה וָ/גִיל֙ מִן הַ/כַּרְמֶ֔ל וּ/בַ/כְּרָמִ֥ים לֹֽא יְרֻנָּ֖ן לֹ֣א יְרֹעָ֑ע יַ֗יִן בַּ/יְקָבִ֛ים לֹֽא יִדְרֹ֥ךְ הַ/דֹּרֵ֖ךְ הֵידָ֥ד הִשְׁבַּֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/010.yaml
  text: Joy and gladness are taken away from the fruitful field[a], and in the vineyards no one sings for joy, no one shouts; no treader treads out wine in the presses[b]; I have put an end to the vintage shout.
translation:
  language: zh_hans
  text: 欢乐和喜悦必从肥沃的田野[a]中被夺去；葡萄园里无人欢唱，无人欢呼；酒榨中，再没有人踩葡萄榨酒。我已经使葡萄收获时的呼喊止息了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“迦密”，即把 כַּרְמֶל 视为地名，而不是“肥沃的田野”。
    reason: alternative_reading
  - marker: b
    text: 原文也可译为“葡萄收成时的呼喊”或“踩榨葡萄时的呼喊”，指葡萄收获、踩榨时发出的响亮呼声。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱסַף
  choice: 消失
  rationale: 此处尼法勒式表达欢乐与喜悦被收走、不复存在；“消失”在现代汉语中自然地传达结果，且不把动作主体明说出来。
- source_word: שִׂמְחָה וָגִיל
  choice: 欢乐和喜悦
  rationale: 用两个意义相近而有区别的常用词保留希伯来诗歌的成对表达。
- source_word: כַּרְמֶל
  choice: 肥沃的田野
  rationale: 上下文与葡萄园、榨酒池并列，较支持普通名词“肥沃之地”，而非地名“迦密”。
- source_word: יְרֻנָּן לֹא יְרֹעָע
  choice: 无人欢唱，无人欢呼
  rationale: 保留两个并列动词：前者偏向欢欣的歌唱或高声呼喊，后者指响亮的呼声；中文采用自然且适合丰收场景的表达。
- source_word: יַיִן בַּיְקָבִים לֹא יִדְרֹךְ הַדֹּרֵךְ
  choice: 榨酒池中，无人踩葡萄榨酒
  rationale: 原文以同根形式强调“踩酒者不再踩”，直译在中文中生硬；译文明确古代在榨酒池中踩葡萄酿酒的动作，并保留无人作业的强调。
- source_word: הֵידָד
  choice: 收割时的呐喊
  rationale: 该词指葡萄收获或踩榨时发出的响亮呼声；“收割时的呐喊”比音译或含混的“呼声”更清楚，同时不预设这呼声在所有语境中都表示欢乐。
- source_word: הִשְׁבַּתִּי
  choice: 我已经止息了
  rationale: 保留使役意义和第一人称，不在正文中补出原文未明说的主语身份。
theological_decisions:
- issue: 本节末尾第一人称动词的说话者
  choice: 保留“我已经止息了”，不补写“耶和华”
  alternative: 译作“我耶和华已经止息了”
  rationale: 上下文可辨认说话者，但本节希伯来文只明说第一人称，没有重述神名；不补写可避免超出原文。
- issue: כַּרְמֶל 是地名还是普通名词
  choice: 按普通名词译为“肥沃的田野”
  alternative: 按地名译为“迦密”
  rationale: 本节的农业意象及其与葡萄园、榨酒池的平行关系较支持普通名词义；脚注保留地名读法，以呈现真实歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号呈现诗句中农业场景的递进，避免生硬复制“踩酒者踩酒”的同根重复；正文保留第一人称及完成意味，不擅自补明神名。
