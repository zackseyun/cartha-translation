revisions:
- from: 欢乐和喜悦必从肥沃的田野[a]消失；葡萄园里无人欢唱，无人欢呼；榨酒池中，无人踩葡萄榨酒。我已经止息了收割时的呐喊[b]。
  to: 欢乐和喜悦必从肥沃的田野[a]中被夺去；葡萄园里无人欢唱，无人欢呼；酒榨中，再没有人踩葡萄榨酒。我已经使葡萄收获时的呼喊止息了[b]。
  rationale: 修订仅作两项语义澄清：将末句的呼喊明确置于葡萄收获语境，并用“使……止息”表达希伯来语使役动词。其余保留原译的现代庄重文体、诗行层次、第一人称而不补出神名，以及 כַּרְמֶל 的普通名词读法和相应脚注。
