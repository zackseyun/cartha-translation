  to: 如同漂泊的飞鸟，如同被赶散的巢[b]，摩押的女儿们[a]将会在亚嫩河的渡口。
  rationale: 将“必出现在”改为“将会在”，消除原文未表达的“出现”动作；将“摩押的女子”改为“摩押的女儿们”，以保留希伯来诗歌的字面措辞及其对妇女与拟人化属地／聚落的双重可能。脚注相应收敛为词义与意象说明，避免过度阐释。
