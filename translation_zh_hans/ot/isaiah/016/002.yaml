  source_fidelity: “必出现在”把希伯来文两个“是／将是”（וְהָיָה、תִּהְיֶינָה）的状态性表达具体化为“出现”，增添了原文没有的动作含义。应译为“将会在……”。“摩押的女子”虽可指妇女，却在现代汉语中较难保留“女儿们”可拟指属城／聚落的诗性歧义，宜恢复为“摩押的女儿们”。两个“如同”准确对应平行比喻；“亚嫩河的渡口”亦恰当。
  naturalness: 修订后以“将会在……那里”表达未来状态，现代汉语自然，同时保留经文的庄重诗体。“摩押的女儿们”虽带诗歌色彩，但在此语境清晰且比“女子”更贴近原文修辞。
  terminology: “亚嫩河”是恰当的常用地名译法。“女儿们”保留 בְּנוֹת 的字面形式与可能的拟人化指称。对 קֵן מְשֻׁלָּח，正文“被赶散的巢”可传达受扰、离散的压缩意象；脚注须避免将“其中成员流离四散”当作原文明确陈述。
  issues:
