base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/002.yaml
  text: And like a wandering bird[a], like a scattered nest[b], so the daughters of Moab will be at the fords of the Arnon.
translation:
  language: zh_hans
  text: 如同漂泊的飞鸟，如同被赶散的巢[b]，摩押的女儿们[a]将会在亚嫩河的渡口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摩押的女儿们”原文直译如此；可指摩押妇女，也可能是以女儿们拟人化地指摩押的城镇、聚落或其居民。
    reason: lexical_alternative
  - marker: b
    text: “被赶散的巢”所译原文意象十分凝练，字面有“被遣走／被赶走的巢”之意；也可译作“被赶走的巢”或“被弃的巢”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... תִּהְיֶינָה
  choice: 必出现在
  rationale: 前置的“如同……”说明摩押女子届时所处的状态；中文用“必出现在”自然表达将来的情景，同时不把系词译得过于生硬。
- source_word: כְעוֹף נוֹדֵד
  choice: 如同漂泊的飞鸟
  rationale: עוֹף意为鸟或飞禽，נוֹדֵד表示游移、流离或逃离；“漂泊的飞鸟”保留其流离无定的诗意形象，又不强行限定为惊逃。
- source_word: קֵן מְשֻׁלָּח
  choice: 如同被赶散的巢
  rationale: קֵן是“巢”，מְשֻׁלָּח是שלח的被动分词，字面有“被遣走、被赶走”之意。原文意象凝练，“被赶散的巢”保留巢遭扰乱、其中成员离散的画面。
- source_word: בְּנוֹת מוֹאָב
  choice: 摩押的女子
  rationale: 直译为“摩押的女儿们”。“摩押的女子”在现代中文中较自然，也保留其可指摩押妇女或拟人化城镇、居民点的歧义。
- source_word: מַעְבָּרֹת
  choice: 渡口
  rationale: 该复数名词指可涉水过河的地点；中文集合性表达“渡口”简洁自然，语境中可涵盖多个过河处。
- source_word: לְאַרְנוֹן
  choice: 亚嫩河
  rationale: אַרְנוֹן是地名，语境指亚嫩河及其渡口；补出“河”符合现代中文地理名称习惯。
theological_decisions:
- issue: “摩押的女子”的指称范围
  choice: 正文保留“摩押的女子”，脚注说明其双重可能
  alternative: 明确译作“摩押妇女”或“摩押的城镇”
  rationale: 原文既可能实指摩押妇女，也可能以“女儿们”拟人化地指摩押的城镇或居民点；不应在翻译中排除其中一种理解。
translation_notes:
  register: 采用现代、庄重而可懂的诗体中文，以两个平行的“如同”对应希伯来文的双重比喻。保留“摩押的女子”及“被赶散的巢”的诗性和歧义，不把流离、逃难的具体方式解释得过满。
