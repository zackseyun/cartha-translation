source:
  edition: WLC
  text: עַל כֵּ֡ן אֶבְכֶּ֞ה בִּ/בְכִ֤י יַעְזֵר֙ גֶּ֣פֶן שִׂבְמָ֔ה אֲרַיָּ֨וֶ/ךְ֙ דִּמְעָתִ֔/י חֶשְׁבּ֖וֹן וְ/אֶלְעָלֵ֑ה כִּ֧י עַל קֵיצֵ֛/ךְ וְ/עַל קְצִירֵ֖/ךְ הֵידָ֥ד נָפָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/009.yaml
  text: Therefore I weep with the weeping of Jazer for the vine of Sibmah[a]; I drench you with my tears, Heshbon and Elealeh[b], because over your summer fruit and over your harvest the battle shout has fallen.
translation:
  language: zh_hans
  text: 因此，我要与雅谢一同哭泣，为西比玛的葡萄树哀哭；希实本和以利亚利啊，我要用泪水浸透你们[a]，因为呼喊声已经临到你们的夏果和收成[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “浸透”也可译作“浇灌”或“湿透”；原词表达使其充分湿润。
    reason: lexical_alternative
  - marker: b
    text: “呼喊声已经临到”可能指敌军的呐喊临到收成，也可能暗示收获时的欢呼已经止息。
    reason: alternative_reading
lexical_decisions:
- source_word: אֶבְכֶּה
  choice: 我要哭泣
  rationale: 未完成式在哀歌语境中可表达当前延续或将要发出的哀哭；“我要哭泣”自然保留其意愿与将来色彩。
- source_word: בִּבְכִי יַעְזֵר
  choice: 与雅谢一同哭泣
  rationale: 介词加“哭泣”可表伴随或关联；此译法用自然汉语表达与雅谢共同哀哭，同时不把地名本身拟人化得过重。
- source_word: גֶּפֶן שִׂבְמָה
  choice: 西比玛的葡萄树
  rationale: 保留 גפן 的单数诗歌意象；它也可能集合性地指当地葡萄园或葡萄产业。
- source_word: אֲרַיָּוֶךְ
  choice: 我要浸透你们
  rationale: Piel 形式表达使之饱足、湿透；与“泪水”连用时，“浸透”鲜明而贴近原文。
- source_word: חֶשְׁבּוֹן וְאֶלְעָלֵה
  choice: 希实本和以利亚利啊
  rationale: 按呼语处理，并以“啊”明确现代汉语中的直接称呼。
- source_word: קֵיץ
  choice: 夏果
  rationale: 指夏季成熟、收取的果实；“夏果”简洁保留农业时令含义。
- source_word: קָצִיר
  choice: 庄稼
  rationale: 原词可指收割、收获或所收庄稼；与“临到”搭配时，“庄稼”在现代汉语中较自然，并保留受灾对象。
- source_word: הֵידָד
  choice: 呼喊声
  rationale: 该词既可指收获时的欢呼，也可指敌军的呐喊；采用中性的“呼喊声”以保留歧义。
- source_word: נָפָל
  choice: 已经临到
  rationale: 字面为“落下”；汉语“临到”保留某事降临其上的图景，又避免误解为声音从物体上跌落。
theological_decisions:
- issue: 末句 הֵידָד נָפָל 的解释
  choice: 译为“呼喊声已经临到”，不在正文中限定为敌军呐喊或收获欢呼停止
  alternative: “战斗的呐喊已经临到”或“收获的欢呼已经止息”
  rationale: 原文以“呼喊声落下”构成诗意审判图景，既可能描写入侵者的呐喊压到收成之上，也可能暗示原有的收获欢呼消失；正文保持张力，脚注说明两种理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。地名按常用圣经译名处理；保留葡萄树、夏果及呼喊声等诗歌意象，并以脚注保存末句的真实歧义。
