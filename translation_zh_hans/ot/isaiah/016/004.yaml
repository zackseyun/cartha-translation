  text: יָג֤וּרוּ בָ/ךְ֙ נִדָּחַ֔/י מוֹאָ֛ב הֱוִי סֵ֥תֶר לָ֖/מוֹ מִ/פְּנֵ֣י שׁוֹדֵ֑ד כִּֽי אָפֵ֤ס הַ/מֵּץ֙ כָּ֣לָה שֹׁ֔ד תַּ֥מּוּ רֹמֵ֖ס מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/004.yaml
  text: Let the outcasts of Moab stay with you; be a shelter for them from the destroyer. For the oppressor has come to an end[a], destruction has ceased, those who trample have vanished from the land.
translation:
  language: zh_hans
  text: 让摩押被赶散的人寄居在你那里；你要作他们躲避毁灭者的藏身处。因为欺压者已经绝迹[a]，毁灭已经止息，践踏者也已从这地消失。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按另一种常见的句法理解：“摩押啊，让我被赶散的人寄居在你那里；你要作他的藏身处，躲避毁灭者。”这种译法采用了不同的元音标注或词语划分。
    reason: alternative_reading
lexical_decisions:
- source_word: יָגוּרוּ בָךְ
  choice: 寄居在你那里
  rationale: גור表示以寄居者身份暂住，也可含寻求庇护之意；“寄居在你那里”既保留临时受容的意味，又符合庄重自然的现代汉语。
- source_word: נִדָּחַי מוֹאָב
  choice: 摩押被赶散的人
  rationale: נדח指被驱逐、赶散的人；此译保留其被动处境，并避免把他们仅仅理解为主动逃亡者。
- source_word: הֱוִי סֵתֶר
  choice: 你要作他们的藏身处
  rationale: סתר可指藏身处、遮蔽处；“藏身处”保留具体的躲藏和保护意象。
- source_word: מִפְּנֵי שׁוֹדֵד
  choice: 躲避毁灭者
  rationale: שׁודד是施行劫掠、蹂躏或毁坏的人；“毁灭者”表达此处广泛的暴力威胁，不局限于财物掠夺。
- source_word: אָפֵס
  choice: 已经绝迹
  rationale: אפס表示不复存在、归于无有；“已经绝迹”简洁地表达完成性的消失。
- source_word: הַמֵּץ
  choice: 欺压者
  rationale: 该词语义较难确定，可理解为欺压者或勒索者；在毁灭和践踏的平行语境中，“欺压者”较为稳妥而不致过窄。
- source_word: כָּלָה שֹׁד
  choice: 毁灭已经止息
  rationale: שֹׁד可指暴行、蹂躏、毁坏或劫掠；结合上下文，译作“毁灭”涵盖较广，כָּלָה则表达终止。
- source_word: תַּמּוּ רֹמֵס
  choice: 践踏人的也已……消失
  rationale: 动词为复数，而רֹמֵס可作集合性称谓；“践踏人的”在汉语中容许集合含义，并保留蹂躏压迫的形象。
- source_word: מִן הָאָרֶץ
  choice: 从这地
  rationale: 在有关摩押及区域性威胁的语境中，הָאָרֶץ更自然地指当地或这片土地，而非整个世界。
theological_decisions:
- issue: 开头呼吁的受话者和句法
  choice: 按马所拉文本的读法，将阴性单数受话者理解为应当接纳摩押被赶散之人的一方。
  alternative: 按另一种常见的元音或分词方式理解为：“摩押啊，让我被赶散的人寄居在你那里；你要作他的藏身处，躲避毁灭者。”
  rationale: 所给WLC文本的元音标注支持阴性单数“在你那里”和“摩押被赶散的人”这一结构。另一读法历史悠久且具有解释意义，但需采用不同的元音或词语划分，因此置于脚注以保留文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“寄居”“藏身处”“践踏”等原文意象；不把语义具体化为某一特定帝国、历史人物或教义解释。主文脚注标记[a]与脚注完全对应。
