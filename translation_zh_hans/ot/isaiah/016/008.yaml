id: ISA.16.8
reference: Isaiah 16:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י שַׁדְמוֹת֩ חֶשְׁבּ֨וֹן אֻמְלָ֜ל גֶּ֣פֶן שִׂבְמָ֗ה בַּעֲלֵ֤י גוֹיִם֙ הָלְמ֣וּ שְׂרוּקֶּ֔י/הָ עַד יַעְזֵ֥ר נָגָ֖עוּ תָּ֣עוּ מִדְבָּ֑ר שְׁלֻ֣חוֹתֶ֔י/הָ נִטְּשׁ֖וּ עָ֥בְרוּ יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/008.yaml
  text: For the fields of Heshbon languish[a], the vine of Sibmah as well. The lords of the nations have struck down its choice vines; they reached as far as Jazer, they wandered into the wilderness[c][b]; its shoots spread out and crossed the sea.
translation:
  language: zh_hans
  text: 因为希实本的田野衰败了，西比玛的葡萄树也凋残了。列国的统治者击打了它上等的葡萄藤[a]；这些藤蔓一直伸到雅谢，蔓延到旷野；它的枝条向外伸展[b]，越过了海[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“它的藤蔓”或“它的枝条”。原词可能着重指优良的葡萄藤，也可能指葡萄树伸出的藤枝。
    reason: lexical_alternative
  - marker: b
    text: “向外伸展”所译的希伯来语动词含义不确定，也可理解为“被放开”或“被弃置”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“海”按当地地理环境，可能特指死海。
    reason: cultural_note
lexical_decisions:
- source_word: שַׁדְמוֹת
  choice: 田野
  rationale: 该词指耕种的农田；译作“田野”既保留其一般农业含义，也与下文葡萄树的意象自然衔接。
- source_word: אֻמְלָל
  choice: 衰败／凋残
  rationale: 该动词可表达衰弱、枯萎或衰败。对田野用“衰败”，对省略谓语的葡萄树补出“凋残”，符合现代汉语搭配，同时保留诗歌中的枯败景象。
- source_word: גֶּפֶן שִׂבְמָה
  choice: 西比玛的葡萄树
  rationale: 保留原文单数的集体性、诗性形象，不将其直接改写为“葡萄园”。
- source_word: בַּעֲלֵי גוֹיִם
  choice: 列国的统治者
  rationale: 此处בעלים指掌权者、主宰者；“统治者”在现代汉语中清楚自然，并符合外族权势者施行毁坏的语境。
- source_word: הָלְמוּ
  choice: 击毁了
  rationale: 动词基本义为击打；在毁坏葡萄藤的语境中，“击毁”既表达打击动作，也传达其破坏性结果。
- source_word: שְׂרוּקֶּיהָ
  choice: 它上等的葡萄藤
  rationale: 该词可能指精选、优良的葡萄藤，也可能被理解为藤蔓或枝条；正文采用与优质葡萄品种相关的含义，另以脚注保留歧义。
- source_word: עַד יַעְזֵר נָגָעוּ
  choice: 这些藤蔓一直伸到雅谢
  rationale: 复数主语承接前面的葡萄藤，而非列国统治者；“一直伸到”自然表达葡萄藤生长范围远达雅谢。
- source_word: תָּעוּ מִדְבָּר
  choice: 曲折伸入旷野
  rationale: תעה本义为游荡、迷行；用于藤蔓时具有拟人色彩。“曲折伸入”在汉语中保留其无定向蔓延的图景，同时避免不自然地说植物“游荡”。
- source_word: שְׁלֻחוֹתֶיהָ
  choice: 它的枝条
  rationale: 该名词指向外发出的嫩枝、枝条；“枝条”清楚承接葡萄树意象。
- source_word: נִטְּשׁוּ
  choice: 向外伸展
  rationale: 此词在这里含义困难，可理解为被放开、伸展开，也可能与弃置有关；正文按葡萄枝蔓向外延展的上下文译出，并以脚注注明不确定性。
- source_word: עָבְרוּ יָם
  choice: 越过了海
  rationale: 直译保留“海”的宽泛称呼，不在正文中确定其必然为死海。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而具诗意的普通话。保留原文以单数“葡萄树”统摄其葡萄藤和枝条的形象；分号呈现藤蔓从雅谢、旷野直至海的层层延展。所有解释性补足均限于汉语语法与搭配所需，未消除原文词义上的真实不确定性。
