  to: 因为希实本的田野衰败了，西比玛的葡萄树也凋残了。列国的统治者击打了它上等的葡萄藤[a]；这些藤蔓一直伸到雅谢，蔓延到旷野；它的枝条向外伸展[b]，越过了海[c]。
