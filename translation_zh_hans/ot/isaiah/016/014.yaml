id: ISA.16.14
reference: Isaiah 16:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֗ה דִּבֶּ֣ר יְהוָה֮ לֵ/אמֹר֒ בְּ/שָׁלֹ֤שׁ שָׁנִים֙ כִּ/שְׁנֵ֣י שָׂכִ֔יר וְ/נִקְלָה֙ כְּב֣וֹד מוֹאָ֔ב בְּ/כֹ֖ל הֶ/הָמ֣וֹן הָ/רָ֑ב וּ/שְׁאָ֥ר מְעַ֛ט מִזְעָ֖ר ל֥וֹא כַבִּֽיר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/014.yaml
  text: But now Yahweh has spoken[a], saying, “Within three years, like the years of a hired worker, the glory of Moab will be brought low, with all its great multitude; and the remnant will be few, very small[c][b], not mighty.”
translation:
  language: zh_hans
  text: 但现在，雅威已经说：“三年之内，如同雇工的年期，摩押的荣耀，以及它所有庞大的众多，都必被贬低[a]；余剩的寥寥无几，极其微小，并不强大[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被贬低”也可译作“受辱”或“失去尊荣”。“所有庞大的众多”中的“众多”可指大量的人、财富或其他丰盛，原文未作限定。
    reason: 保留נִקְלָה对荣耀、威望或地位受损的含义，并避免将הָמוֹן限定为“众民”。
  - marker: b
    text: “余剩的寥寥无几，极其微小，并不强大”也可译作“所剩下的很少，极少，不强盛”。“余剩”指审判后所留下的，未必限定为某一类人。
    reason: 反映שְׁאָר与连续小量词מְעַט、מִזְעָר的强调，并保留כַבִּיר“强大、重大”的开放范围。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 但现在
  rationale: 承接上文并转入当前、带对比意味的神圣宣告，保留连接词与时间副词的合力。
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: 雅威说
  rationale: 用自然汉语引出直接引语；完成式在先知宣告中表达已经发出、确定有效的话。
- source_word: בְּשָׁלֹשׁ שָׁנִים כִּשְׁנֵי שָׂכִיר
  choice: 三年之内，像雇工计算年期那样
  rationale: ב加时间短语可指期限之内；雇工的比喻强调年期按约计算，不任意延长。
- source_word: וְנִקְלָה כְּבוֹד מוֹאָב
  choice: 摩押的荣耀……必受辱
  rationale: קלה的尼法勒式在此指荣誉、地位遭贬损；“受辱”与“荣耀”形成原文所具有的强烈反差。
- source_word: בְּכֹל הֶהָמוֹן הָרָב
  choice: 连同它庞大的众民
  rationale: הָמוֹן可指众人、群体或丰盛；此处选“众民”贴合国家受审判的语境，同时以脚注保留较宽的词义。
- source_word: וּשְׁאָר מְעַט מִזְעָר
  choice: 剩下的人寥寥无几，微不足道
  rationale: 将שְׁאָר理解为劫后所剩的人；מְעַט与מִזְעָר叠加强调数量极少、规模极小。
- source_word: לֹא כַבִּיר
  choice: 也无力自强
  rationale: כַבִּיר可表达强大、强盛或重大；在国家余民的语境中译为缺乏力量，同时保留脚注中的其他可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其作为专名的性质。
- issue: שְׁאָר 是否采用带神学色彩的“余民”
  choice: 剩下的人
  alternative: 余民；幸存者
  rationale: 本节重点是审判后人数稀少、力量微弱，并未明确赋予这群人积极的救赎角色；较普通的表达可避免额外导入神学含义。
- issue: בְּשָׁלֹשׁ שָׁנִים 的期限含义
  choice: 三年之内
  alternative: 三年后；三年间
  rationale: 介词本身允许一定弹性；结合雇工年期的比喻，正文表达一个受严格计算的三年期限，而脚注提示其确切期限的侧重。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威”作为神名音译；“寥寥无几，微不足道”再现连续小量词的加强效果。所有脚注标记均置于相关正文之后。
