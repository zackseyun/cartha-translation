- from: 但现在，雅威说：“三年之内，像雇工计算年期那样[a]，摩押的荣耀连同它庞大的众民，都必受辱[b]；剩下的人寥寥无几，微不足道，也无力自强[c]。”
  to: 但现在，雅威已经说：“三年之内，如同雇工的年期，摩押的荣耀，以及它所有庞大的众多，都必被贬低[a]；余剩的寥寥无几，极其微小，并不强大[b]。”
  rationale: 修订以希伯来文本为先：保留“但现在”所标示的转折、“已经说”所体现的庄严既成宣告，以及“三年之内／如同雇工的年期”所表达的严格期限。删除正文中对众多对象和余剩身份的过度限定，直接呈现其极少、极小且不强大的状态；同时重排脚注锚点，使每个脚注紧邻其所说明的语句。
