source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל מוֹאָ֖ב מֵ/אָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/013.yaml
  text: This is the word that Yahweh spoke concerning Moab in time past[a].
translation:
  language: zh_hans
  text: 这是雅威从前论到摩押所说的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是雅威以前论到摩押所说的信息。”
    reason: 词汇替代：דָּבָר可译为“话”或“信息”，מֵאָז也可译为“以前”。
lexical_decisions:
- source_word: זֶה
  choice: 这是
  rationale: 保留希伯来文指示词在总结前文时的直指作用；虽然后面的言说发生在过去，中文仍可自然地说“这是”。
- source_word: הַדָּבָר
  choice: 话
  rationale: דָּבָר在此指先知性言论。“话”既保留神谕用语的庄重感，也比“事情”更符合语境；“信息”则较偏解释。
- source_word: אֲשֶׁר דִּבֶּר
  choice: 所说的
  rationale: 以现代汉语自然的关系结构表达“所……的”；“说”准确对应דבר，不额外加入“宣告”的强调。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: אֶל מוֹאָב
  choice: 论到摩押
  rationale: אֶל在此神谕总结语中表示言论所涉及的对象。“论到”保留指涉意义，不把它强化为“攻击”，也不误作直接对摩押说话。
- source_word: מֵאָז
  choice: 从前
  rationale: 简洁表达相对于当前陈述的以往时间；原文本身未明确强调相隔很久，故不译作“很久以前”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质。“主”会以称号替代原文神名，“耶和华”则反映较晚形成的混合读法。
- issue: 神谕语境中אֶל מוֹאָב的语力
  choice: 论到摩押
  alternative: 对摩押；攻击摩押
  rationale: 本节总结的是关于摩押的神谕。“论到”不额外断定这是直接受话或特意强化敌对含义，因而保留介词在此处的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这是……所说的话”保留总结性神谕用语；“论到”适合经文语域，同时不至于古奥。
