base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/001.yaml
  text: Send a lamb to the ruler of the land[b][a], from Sela in the wilderness to the mountain of daughter Zion.
translation:
  language: zh_hans
  text: 你们要把一只羊羔[b]从西拉[a]经旷野送到这片土地的统治者那里，送到锡安女子的山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西拉”也可译作“岩石”或“峭壁”；希伯来词“סֶלַע”既可作普通名词，此处更可能是地名。
    reason: lexical_alternative
  - marker: b
    text: 这里的“羊羔”很可能是送给统治者的贡物。
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ
  choice: 你们要……送给
  rationale: 这是שלח的Qal命令式阳性复数；用“你们要……送给”自然表达对一群人的直接命令。
- source_word: כַר
  choice: 一只羊羔
  rationale: 该名词指羊羔或幼羊；上下文很可能涉及进贡，但正文保留具体物象，不把语境推断直接写成“贡物”。
- source_word: מֹשֵׁל אֶרֶץ
  choice: 这地的统治者
  rationale: מֹשֵׁל是“统治者”，אֶרֶץ可指“地、国土”或“全地”；本段地域性语境支持“这地”，而不取宇宙性的“全地”。希伯来语关系简略，中文按最可能的受事关系译为“送给……统治者”。
- source_word: מִסֶּלַע
  choice: 从西拉
  rationale: סלע本义可为“岩石、峭壁”，此处很可能是地名西拉；正文采用地名音译，另在脚注保留普通名词的可能。
- source_word: מִדְבָּרָה
  choice: 往旷野去
  rationale: 该词带方向词尾־ה，较直接表示朝旷野的方向。译作“往旷野去”保留移动方向，不将其静态化为“在旷野中”；其与后续终点短语的关系在希伯来文中较为紧缩。
- source_word: אֶל הַר בַּת צִיּוֹן
  choice: 直到锡安女子的山
  rationale: אֶל表示趋向目标，הַר是“山”，בַּת צִיּוֹן是把锡安人格化为女子的诗性称呼。中文保留这一意象，不直接改写为“耶路撒冷”。
theological_decisions:
- issue: 是否在正文中明说羊羔是献给统治者的贡物
  choice: 保留“一只羊羔”的具体说法，并用脚注说明进贡背景
  alternative: 译为“羊羔贡物”或“以羊羔进贡”
  rationale: 政治性进贡很可能是本句背景，但כַר本身只明确说羊羔；正文不把语境推断变成词义，以保留原文的具体形象。
- issue: מֹשֵׁל אֶרֶץ与כַר的句法关系
  choice: 按上下文译为“把一只羊羔送给这地的统治者”
  alternative: 译为“把这地统治者的羊羔送去”
  rationale: 希伯来文没有明写“给”的介词，句法较为压缩；多数语境证据支持把统治者理解为贡物的接收者，但所有格式理解在形式上并非完全不可想象，因此不进一步扩写。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“锡安女子”保留先知诗歌中的人格化表达；冒号使出发方向和目的地与主要命令的关系更清楚，同时不消除原文紧缩句法带来的张力。
