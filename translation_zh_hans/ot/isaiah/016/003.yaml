  text: הביאו עֵצָה֙ עֲשׂ֣וּ פְלִילָ֔ה שִׁ֧יתִי כַ/לַּ֛יִל צִלֵּ֖/ךְ בְּ/ת֣וֹךְ צָהֳרָ֑יִם סַתְּרִי֙ נִדָּחִ֔ים נֹדֵ֖ד אַל תְּגַלִּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/003.yaml
  text: Bring counsel[a]; make a decision. Make your shadow like the night in the middle of noon; hide the outcasts[c][b]; do not betray the fugitive.
translation:
  language: zh_hans
  text: “提出谋略，作出裁断[a]；使你的阴影[b]在正午如同黑夜；把被赶散的人藏起来，不要把逃亡者暴露出来[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作出裁断”也可译作“施行公断”“作出判决”或“进行仲裁”；原文名词带有法律、司法意味。
    reason: lexical_alternative
  - marker: b
    text: “阴影”也可译作“影子”或“荫蔽”。原词既可指影子，也可指供人躲避烈日的荫蔽。
    reason: lexical_alternative
  - marker: c
    text: “把……暴露出来”直译为“显露”或“揭露”；在这里指不可泄露逃亡者的所在。
    reason: lexical_alternative
lexical_decisions:
- source_word: הביאו עֵצָה
  choice: 请献上谋略
  rationale: הביאו是复数使役命令式，意为“带来、提出”；עֵצָה指谋略、意见。合译为“献上谋略”，既保留正式请求的语气，也符合政治商议的语境。
- source_word: עֲשׂוּ פְלִילָה
  choice: 作出裁断
  rationale: פְלִילָה带有司法裁决或仲裁色彩；“作出裁断”比泛化的“作决定”更能保留其法律语义，同时在现代汉语中仍然清楚。
- source_word: שִׁיתִי כַלַּיִל צִלֵּךְ
  choice: 使你的荫影……如同黑夜
  rationale: שִׁיתִי是阴性单数命令式；צֵל可指影子或遮蔽人的荫影。这里与黑夜的比喻相连，“荫影”兼顾遮蔽作用和幽暗意象。
- source_word: בְּתוֹךְ צָהֳרָיִם
  choice: 在正午
  rationale: 原文直译为“在正午当中”。现代汉语用“在正午”自然简洁，仍保留最明亮时刻反成黑夜的强烈对比。
- source_word: סַתְּרִי נִדָּחִים
  choice: 把被赶散的人藏起来
  rationale: נִדָּחִים是被动分词，指被驱逐、赶散的人；“被赶散的人”比“流亡者”更直接呈现其被迫离散的含义。סַתְּרִי表示隐藏、遮蔽。
- source_word: נֹדֵד אַל תְּגַלִּי
  choice: 不要暴露逃亡者
  rationale: נֹדֵד可指漂泊者或逃亡者；在藏匿受驱逐者的语境中，“逃亡者”贴切。גלה本义是揭开、显露，因此采用“暴露”，既准确又表达不可泄露其所在的实际含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“请”使连续命令在汉语中呈现为恳求式劝告；分号保留原文各命令之间的推进关系。复数命令式转为阴性单数命令式这一变化在汉语中无法用动词形态直接体现，未额外补入原文没有明确说出的受话对象。
