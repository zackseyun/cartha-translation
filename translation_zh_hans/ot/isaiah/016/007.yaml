base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/007.yaml
  text: Therefore Moab will wail for Moab; all of it will wail. You will moan[a] for the raisin-cakes of Kir-hareseth, utterly stricken.
translation:
  language: zh_hans
  text: 因此，摩押必为摩押哀号，整个摩押都必哀号。你们必为吉珥·哈列设的葡萄干饼[a]悲叹，极其受创。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吉珥·哈列设的根基”。希伯来语אֲשִׁישֵׁי的含义较难确定，但马所拉文本最自然的读法是“葡萄干饼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 作为推论连接词，引出前文审判所导致的结果；“因此”庄重而自然。
- source_word: יְיֵלִיל
  choice: 必哀号
  rationale: ילל在审判语境中表示响亮而强烈的哀哭；“哀号”既保留力度，也符合现代汉语表达。
- source_word: מוֹאָב לְמוֹאָב
  choice: 摩押必为摩押
  rationale: 保留原文刻意重复的“摩押”，呈现这个国家为自身遭遇举哀的拟人化表达。
- source_word: כֻּלֹּה
  choice: 整个摩押都
  rationale: 所指是作为整体的摩押；明确补出“摩押”，比直译为“它的全部”更符合汉语，同时保留整体性。
- source_word: לַאֲשִׁישֵׁי
  choice: 为……葡萄干饼
  rationale: אֲשִׁישָׁה在其他经文中通常指用葡萄干压制的饼；此处可表示因昔日物产或繁荣丧失而哀叹。该词有文本或词源上的解释困难，另说见脚注。
- source_word: קִיר חֲרֶשֶׂת
  choice: 吉珥·哈列设
  rationale: 作为摩押城邑的专名按音译处理，并以间隔号标明复合地名。
- source_word: תֶּהְגּוּ
  choice: 你们必……悲叹
  rationale: הגה可指低沉发声、呻吟或悲鸣；在哀悼语境中译为“悲叹”自然，并保留第二人称复数造成的修辞转向。
- source_word: אַךְ נְכָאִים
  choice: 个个痛苦不堪
  rationale: אַךְ在此加强程度，נְכָאִים描写受打击、被压倒的状态；“个个”呼应复数对象，“痛苦不堪”表达强烈而彻底的悲苦。
