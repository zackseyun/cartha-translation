  text: שָׁמַ֥עְנוּ גְאוֹן מוֹאָ֖ב גֵּ֣א מְאֹ֑ד גַּאֲוָת֧/וֹ וּ/גְאוֹנ֛/וֹ וְ/עֶבְרָת֖/וֹ לֹא כֵ֥ן בַּדָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/006.yaml
  text: We have heard of the pride of Moab—how very proud he is—of his arrogance[a], his pride, and his fury; his boasts are not so.
translation:
  language: zh_hans
  text: 我们听说摩押的骄傲——他极其骄傲——以及他的狂妄、骄傲和暴怒；他的夸口[a]并不如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的空谈并非如此”，或“他的谎言并非如此”。希伯来语这个词可指夸大的声称、空谈或虚假之言。
    reason: 保留בַּדָּיו在“夸口”“空谈”和“谎言”之间的词义幅度，避免把原文的歧义只限定为一种解释。
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: 我们听说
  rationale: 该词是שׁמע的Qal完成式第一人称复数；这里表示众人从传闻中得知摩押的性情。“我们听说”符合现代汉语的转述语境，并保留其现实关联。
- source_word: גְאוֹן
  choice: 骄傲
  rationale: 在审判摩押的语境中，该词指高傲自大，而非中性的“威严”或“尊荣”。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用该地名及民族名的标准中文译名。
- source_word: גֵּא מְאֹד
  choice: 他极其骄傲
  rationale: 形容词גאה受מְאֹד加强。译成破折号内的分句，既自然，也保留原文反复强调摩押骄傲的修辞。
- source_word: גַּאֲוָתוֹ
  choice: 他的狂妄
  rationale: 这是多个近义词连续堆叠中的一个；译作“狂妄”，既体现高傲之意，也避免把所有词都扁平化为同一个中文词。
- source_word: וּגְאוֹנוֹ
  choice: 骄傲
  rationale: 该词与本节开头的גְאוֹן同源，重复译作“骄傲”，以反映原文的词根呼应和核心指控。
- source_word: וְעֶבְרָתוֹ
  choice: 暴怒
  rationale: עֶבְרָה常表示强烈、奔涌的怒气；“暴怒”简洁有力，符合谴责语气。
- source_word: לֹא כֵן
  choice: 并不是事实
  rationale: 该短语否认有关言论与实情相符。此处译成现代汉语中自然的“并不是事实”，同时保留简洁而直接的否定。
- source_word: בַּדָּיו
  choice: 他的夸口
  rationale: 该词可指夸大的声称、空谈或谎言。上下文集中揭露摩押的骄傲，因此正文采用“夸口”，并以脚注保留其他词义可能。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。破折号保留原文对摩押极度骄傲的插入式强调；“狂妄、骄傲和暴怒”呈现近义词的层叠效果。脚注标记置于它实际解释的“夸口”之后。
