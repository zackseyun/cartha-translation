  to: 因此，我的肺腑为摩押如琴一般低鸣[a]；我的内心也为吉珥·哈列斯低鸣[b]。
  rationale: 修订使“如同琴”的比喻直接对应 כַּכִּנּוֹר，并以“低鸣”表达 יֶהֱמוּ 的低沉、哀伤响声。两处“低鸣”在中文中明确了后半行依靠前半行所省略的谓语。地名正文按本节较短的希伯来形式音译，传统扩展形式保留在脚注；第一人称说话者的身份仍不作解释性限定。
