  text: עַל כֵּן֙ מֵעַ֣/י לְ/מוֹאָ֔ב כַּ/כִּנּ֖וֹר יֶֽהֱמ֑וּ וְ/קִרְבִּ֖/י לְ/קִ֥יר חָֽרֶשׂ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/011.yaml
  text: Therefore my inward parts moan like a harp for Moab[b][a], and my inner being for Kir-heres.
translation:
  language: zh_hans
  text: 因此，我的肺腑为摩押如琴一般低鸣[a]；我的内心也为吉珥·哈列斯低鸣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琴”所译的希伯来语指一种弦乐器；也可译作“竖琴”或“里拉琴”。
    reason: lexical_alternative
  - marker: b
    text: “吉珥·哈列斯”是摩押的一座城；传统上也译作“吉珥·哈列设”（Kir-hareseth）。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעַי
  choice: 我的肺腑
  rationale: 该词本指内脏，常用来表达深切情感。“肺腑”既保留具体的身体意象，也符合现代汉语庄重的哀歌语体。
- source_word: לְמוֹאָב
  choice: 为摩押
  rationale: 介词 ל 在此标明哀悼所指向的对象；“为摩押”自然地表达因摩押而发的悲恸。
- source_word: כַּכִּנּוֹר
  choice: 如同琴声
  rationale: כִּנּוֹר 是一种弦乐器，其确切形制难以用单一现代乐器名称对应；正文用较宽泛的“琴”，避免过度确定，脚注说明。
- source_word: יֶהֱמוּ
  choice: 哀鸣
  rationale: המה 可指低沉、回荡的响声；在本段哀歌语境中，“哀鸣”兼顾声音意象与悲恸情绪。
- source_word: וְקִרְבִּי
  choice: 我的内心
  rationale: קֶרֶב 指内部、内里，在这里与“肺腑”平行，表示人的内在生命与情感；“内心”在现代汉语中清楚自然。
- source_word: לְקִיר חָרֶשׂ
  choice: 为吉珥·哈列设
  rationale: 将其视为摩押城名并音译；脚注保留其他常见音译形式。
theological_decisions:
- issue: 发出哀鸣者的身份
  choice: 保留第一人称，不在译文中明确其为先知或上帝
  alternative: 解释为“先知的肺腑”或“耶和华的肺腑”
  rationale: 希伯来文本仅使用第一人称物主形式，语境对说话者身份存在解释空间；正文不应擅自消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“肺腑”保留希伯来文内脏意象，“内心”则自然呈现平行句的内在人格含义。重复“哀鸣”以补足希伯来诗歌后半句省略的谓语，使中文清楚，同时保持两行平行结构。
