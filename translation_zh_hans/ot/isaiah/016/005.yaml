id: ISA.16.5
reference: Isaiah 16:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הוּכַ֤ן בַּ/חֶ֨סֶד֙ כִּסֵּ֔א וְ/יָשַׁ֥ב עָלָ֛י/ו בֶּ/אֱמֶ֖ת בְּ/אֹ֣הֶל דָּוִ֑ד שֹׁפֵ֛ט וְ/דֹרֵ֥שׁ מִשְׁפָּ֖ט וּ/מְהִ֥ר צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/005.yaml
  text: A throne will be established in steadfast love[a], and one will sit on it in faithfulness in the tent of David[c][b], judging and seeking justice and swift to do righteousness.
translation:
  language: zh_hans
  text: 必有一座宝座因着忠贞之爱[a]而坚立；必有一位[c]在大卫的帐幕中，凭信实[b]坐在其上，施行审判，寻求公正，迅速秉行公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠贞之爱”所译的希伯来词也可指“慈爱”或“盟约忠诚”；“因着”也可译作“在……中”或“凭”。
    reason: 说明חסד的丰富语义及介词ב的歧义。
  - marker: b
    text: 或译：“凭真实”。
    reason: אמת既可表示信实、可靠，也可表示真实。
  - marker: c
    text: 原文没有明说坐在宝座者的身份，也可译作：“他必坐在其上”。
    reason: 希伯来文动词为第三人称阳性单数，但主语是隐含的。
lexical_decisions:
- source_word: וְהוּכַן
  choice: 必……坚立
  rationale: הוכן是כון的霍法勒式，表达被坚固、被确立的结果；“坚立”保留被动含义和诗歌的庄重感。
- source_word: בַּחֶסֶד
  choice: 因忠贞之爱
  rationale: חסד兼有慈爱、信实和盟约忠诚的内涵；“忠贞之爱”保留其丰富含义，而“因”体现介词ב可能具有的凭借或原因意味。
- source_word: כִּסֵּא
  choice: 一座宝座
  rationale: 原文无定冠词；“一座”在现代汉语中自然，并保留其非特指形式。
- source_word: וְיָשַׁב עָלָיו
  choice: 必有一位……坐在其上
  rationale: 动词为第三人称阳性单数，但本分句没有明说主语；“有一位”既符合汉语表达，也不把其身份说得比原文更明确。
- source_word: בֶּאֱמֶת
  choice: 凭信实
  rationale: אמת可指真实、可靠或信实；在君王治理和审判的语境中，“信实”突出可靠忠诚，“凭”则自然表达其施政所依循的品格。
- source_word: בְּאֹהֶל דָּוִד
  choice: 在大卫的帐幕中
  rationale: 直译原文意象，不将“帐幕”解释性地改作“家”或“王朝”，从而保留其诗性及可能的王朝含义。
- source_word: שֹׁפֵט
  choice: 施行审判
  rationale: 分词描写坐在宝座者持续履行的职能；“施行审判”比单说“审判”更符合现代汉语。
- source_word: וְדֹרֵשׁ מִשְׁפָּט
  choice: 寻求公正
  rationale: דרשׁ在此有积极追求、致力于之意，משפט指公正的裁断和司法秩序；译文保留原文动词“寻求”。
- source_word: וּמְהִר צֶדֶק
  choice: 迅速秉行公义
  rationale: מהר表达迅速、及时，צדק指公义或正义；“秉行”以自然汉语表达压缩的希伯来诗句，同时避免仅将公义理解为抽象属性。
theological_decisions:
- issue: 大卫王权人物的身份
  choice: 保留为未具名的大卫王权统治者
  alternative: 在正文中明确译作弥赛亚或某位历史上的大卫后裔君王
  rationale: 原文指向大卫的帐幕和坐宝座者，却未明确称其为弥赛亚，也未指名某位历史君王；译文保留这种开放性，让读者在更广的经文和神学脉络中理解。
- issue: בֶּאֱמֶת的语义
  choice: 信实
  alternative: 真实
  rationale: 两义在原文中均有依据；君王施行公正治理的语境较支持“信实”，但脚注保留“真实”这一可能。
- issue: 宝座坚立所凭借的בַּחֶסֶד
  choice: 因忠贞之爱
  alternative: 在忠贞之爱中／凭慈爱
  rationale: 介词ב可表达范围、方式或凭借；正文采用自然且合乎语境的原因或凭借表达，脚注说明核心词的语义宽度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宝座”“大卫的帐幕”“公义”等保留先知诗歌及王权语汇；句式略带诗性，但避免古奥表达。脚注标记按所解释词语紧随正文出现。
