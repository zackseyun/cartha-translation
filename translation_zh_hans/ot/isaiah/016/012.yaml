base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/012.yaml
  text: And when it is seen that Moab is worn out on the high place[a], and he comes to his sanctuary to pray[c][b], he will not be able.
translation:
  language: zh_hans
  text: 到那时，当人看见摩押在丘坛上疲惫不堪时，他进到自己的圣所祷告，也无能为力。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “当人看见”或译“当显明摩押在丘坛上疲惫不堪时”。“也无能为力”或译“也不能奏效”。原文只说“不能”，没有明说所不能成就的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 到那时
  rationale: 这一结构引出将来的情形；“到那时”在现代汉语中自然，也保留时间推进的意味。
- source_word: נִרְאָה
  choice: 人看见
  rationale: 尼法勒式可表达“被看见”或非人称的“显而易见”。汉语用“人看见”保留被察觉、变得明显之意，同时不把观察者具体化。
- source_word: נִלְאָה
  choice: 疲惫不堪
  rationale: 该词表示因徒劳耗力而疲倦、衰竭；此译兼顾状态和程度。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用通行中文译名，并按希伯来文的单数形式将国家人格化。
- source_word: עַל הַבָּמָה
  choice: 在丘坛上
  rationale: במה 指设于高处的祭祀场所；“丘坛”是简洁且较为明确的中文宗教文化用语，并保留单数。
- source_word: וּבָא אֶל מִקְדָּשׁוֹ
  choice: 他进到自己的圣所
  rationale: בוא 在此可指进入；מקדש 是分别为圣的敬拜场所。“圣所”不限定其建筑形态，也保留摩押人格化的单数指称。
- source_word: לְהִתְפַּלֵּל
  choice: 祷告
  rationale: 该词在此意为祈祷；不采用更具体的“代求”。
- source_word: וְלֹא יוּכָל
  choice: 也无能为力
  rationale: יכל 的核心义是“能够”。在祷告徒然的语境中，“无能为力”既保留能力不足的表层表达，也自然传达不能奏效，而不擅自补明对象。
theological_decisions:
- issue: 摩押所接续的单数形式
  choice: 将摩押人格化，以“他”承接
  alternative: 按民族群体译作“他们”，或改用完全非人称表达
  rationale: 希伯来文以单数动词和第三人称阳性单数后缀指称摩押。保留人格化单数可呈现原文修辞，又不加入额外教义解释。
- issue: 末句所指的失败
  choice: 译作“也无能为力”，不明说是祷告不蒙应允或不能得逞
  alternative: 译作“也不能奏效”或“也不能得逞”
  rationale: 原文只说“不能”，宾语或结果未明示。正文保留这种省略和张力，避免把可能的语境含义写成唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号呈现两项连续而徒劳的宗教行动；“丘坛”与“圣所”区分祭祀高处和所属敬拜场所。所有脚注标记均已置于正文。
