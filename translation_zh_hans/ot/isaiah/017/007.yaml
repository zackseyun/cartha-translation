  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא יִשְׁעֶ֥ה הָ/אָדָ֖ם עַל עֹשֵׂ֑/הוּ וְ/עֵינָ֕י/ו אֶל קְד֥וֹשׁ יִשְׂרָאֵ֖ל תִּרְאֶֽינָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/007.yaml
  text: In that day man will look to his Maker[b][a], and his eyes will look to the Holy One of Israel.
translation:
  language: zh_hans
  text: 在那日[a]，人[b]必仰望造他的那一位；他的眼睛必看向以色列的圣者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当那日”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“人”是代表性单数，泛指人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知话语中常见的时间表达。“到那日”自然、庄重，并保留其指向将来特定时刻的语气，不进一步限定具体时间。
- source_word: יִשְׁעֶה
  choice: 必仰望
  rationale: 该动词表示把注意或目光转向某人。“仰望”在现代汉语中既保留观看的意象，也可表达敬重和倚赖的含意，但没有直接增译为“信靠”或“悔改”。
- source_word: הָאָדָם
  choice: 人
  rationale: 原文是带定冠词的单数名词，在此作代表性单数，泛指人类；汉语“人”既保留单数形式，也能自然表达泛指。
- source_word: עַל
  choice: 仰望……
  rationale: 此介词与 שׁעה 连用，表示把注意转向某对象；其关系已自然融入汉语动词结构，无须机械译作“在……之上”。
- source_word: עֹשֵׂהוּ
  choice: 造他的那一位
  rationale: 原文是“造他者”的分词形式，带第三人称阳性单数后缀。此译法准确保留创造者与被造之人的个人关系，也避免加入原文没有的“主”等称谓。
- source_word: וְעֵינָיו
  choice: 他的眼睛
  rationale: 直译身体意象，以保留两行之间的诗歌平行结构。
- source_word: אֶל
  choice: 向
  rationale: 表示目光所朝向的对象；“看向”符合现代汉语习惯。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 保留《以赛亚书》中具有特色的上帝称号，并完整翻译其构造。
- source_word: תִּרְאֶינָה
  choice: 必看向
  rationale: ראה 通常意为“看见”或“看”，但本句与前半句构成平行，强调眼睛定向于以色列的圣者；“看向”保留视觉动作和方向性。
theological_decisions:
- issue: הָאָדָם 是否译成抽象的“人类”
  choice: 人
  alternative: 人类
  rationale: 原文采用代表性单数。“人”保留这一语法和修辞形式，同时在汉语中可自然泛指世人；脚注说明其范围，以免误解为某一个特定的人。
- issue: 是否把仰望明确解释为信靠或悔改
  choice: 必仰望
  alternative: 必信靠；必回转归向
  rationale: 上下文可使这一动作带有重新转向上帝的神学含意，但原文动词本身着重于观看、关注或定睛。因此正文保留意象和含蓄张力，不把推论直接写入经文。
- issue: עֹשֵׂהוּ 是否采用带神圣称谓的译法
  choice: 造他的那一位
  alternative: 他的创造主；造他的主
  rationale: 上下文清楚表明所指是上帝，但希伯来文本身使用的是“造”的分词，并没有“主”这一名词。所选译法避免增添称谓，同时保留明确的创造关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“仰望”与“看向”既保留希伯来诗句的平行关系，又避免两处完全重复而显得生硬；“造他的那一位”略带庄重色彩，并比增译“主”更贴近原文。
