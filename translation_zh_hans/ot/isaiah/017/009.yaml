  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִהְי֣וּ עָרֵ֣י מָעֻזּ֗/וֹ כַּ/עֲזוּבַ֤ת הַ/חֹ֨רֶשׁ֙ וְ/הָ֣/אָמִ֔יר אֲשֶׁ֣ר עָזְב֔וּ מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָיְתָ֖ה שְׁמָמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/009.yaml
  text: In that day his fortified cities will be like the deserted places of the forest and the treetop[a], which they abandoned before the sons of Israel[b]; and it will become a desolation.
translation:
  language: zh_hans
  text: 到那日，他的坚城必像树林和树梢[a]间被遗弃的地方，就是在以色列众子面前被离弃的[b]；也必成为荒凉之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “树梢”也可译作“上面的枝条”或“树顶的枝条”。希伯来语这个词指树木最上面的部分。
    reason: lexical_alternative
  - marker: b
    text: “在以色列众子面前”也可译作“因为以色列众子”。这里的希伯来语表达可能指人们因以色列众子的临在而退避。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知话语中常见的时间公式，同时符合现代汉语习惯。
- source_word: עָרֵי מָעֻזּוֹ
  choice: 他的坚城
  rationale: מָעוֹז表示坚固之处或堡垒；用“坚城”简洁表达设防城市，并保留第三人称阳性单数后缀“他的”。
- source_word: כַּעֲזוּבַת הַחֹרֶשׁ וְהָאָמִיר
  choice: 像树林和树梢被遗弃的地方
  rationale: 将עֲזוּבַת所表达的荒弃状态按汉语自然地译为“被遗弃的地方”；חֹרֶשׁ译作“树林”，אָמִיר译作“树梢”，保留树木顶端的意象。
- source_word: אֲשֶׁר עָזְבוּ
  choice: 就是人们……所撇弃的
  rationale: 保留复数主动动词，但希伯来文未明说主语；汉语以泛指“人们”表达这一未指明的复数主体，避免擅自确定其身份。
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: 在以色列众子面前
  rationale: 较直接地保留מִפְּנֵי“从……面前／在……面前”的空间与退避意味，并以“以色列众子”反映בְּנֵי的阳性形式；可能的因果含义留在脚注。
- source_word: וְהָיְתָה שְׁמָמָה
  choice: 这些城必成为荒场
  rationale: “成为”传达结果状态；以“这些城”明示汉语中的所指，而“荒场”保留שְׁמָמָה的荒废、凄凉含义。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的性别形式与民族称谓
  choice: 以色列众子
  alternative: 以色列人／以色列子民
  rationale: 正文保留原文“众子”的阳性形式及其互文色彩，同时不把该表达扩展成某一特定神学解释。
- issue: מִפְּנֵי所表达的关系
  choice: 在……面前
  alternative: 因为……／由于……的缘故
  rationale: 正文保留原文可能含有的空间、临在和退避意味，不将其单一定为因果关系；因果读法在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“坚城”“荒场”保持先知文学的凝练力度；句中用“就是”连接比喻和关系从句，使复杂的希伯来语结构在汉语中清楚可读。所有歧义均通过正文与脚注保留，未擅自确认未明说的复数主语。
