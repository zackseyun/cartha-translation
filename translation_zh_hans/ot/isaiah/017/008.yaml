  text: וְ/לֹ֣א יִשְׁעֶ֔ה אֶל הַֽ/מִּזְבְּח֖וֹת מַעֲשֵׂ֣ה יָדָ֑י/ו וַ/אֲשֶׁ֨ר עָשׂ֤וּ אֶצְבְּעֹתָי/ו֙ לֹ֣א יִרְאֶ֔ה וְ/הָ/אֲשֵׁרִ֖ים וְ/הָ/חַמָּנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/008.yaml
  text: And he will not look to the altars[a], the work of his hands[b], and he will not regard what his fingers have made—the Asherim and the incense altars.
translation:
  language: zh_hans
  text: 他必不再仰望自己双手所造的祭坛，也不再注目自己手指所做的亚舍拉祭祀物[a]和日柱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚舍拉祭祀物”指与女神亚舍拉崇拜有关的祭祀物件；也可译作“亚舍拉木柱”或“亚舍拉像”，其具体形态并不确定。
    reason: lexical_alternative
  - marker: b
    text: “日柱”原文所指不完全确定；也可理解为“日像”、祭祀柱，或焚香用的坛或台。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁעֶה
  choice: 仰望
  rationale: 此处不只是视觉上的观看，也含有把注意和倚赖转向某物的意味；“仰望”在现代汉语中能保留这种敬拜语境中的指向性。
- source_word: הַמִּזְבְּחוֹת
  choice: 祭坛
  rationale: 该词直接指献祭用的坛；上下文已用“自己双手所造的”表明这些是人造的崇拜设施，无须另加“偶像”等解释。
- source_word: מַעֲשֵׂה יָדָיו
  choice: 自己双手所造的
  rationale: 既保留希伯来文“手的作品”这一形象，也以自然汉语明确其为人亲手制造之物。
- source_word: וַאֲשֶׁר עָשׂוּ אֶצְבְּעֹתָיו
  choice: 自己手指所做的
  rationale: 保留“手指”这一具体意象，以及先知对人手制造敬拜物的讽刺意味。
- source_word: יִרְאֶה
  choice: 注目
  rationale: 本义为“看”，但在这里与יִשְׁעֶה平行，指带着关注而观看；“注目”既保留视觉意义，也避免与前句机械重复。
- source_word: הָאֲשֵׁרִים
  choice: 亚舍拉敬拜物
  rationale: 该复数词指与亚舍拉崇拜有关的祭祀物件，其具体形态未必总能确定；采用音译加类别说明，避免一概限定为木杆或神像。
- source_word: הַחַמָּנִים
  choice: 日柱
  rationale: 这是形态和用途不完全确定的异教祭祀物名称，常被理解为与太阳有关的柱或像；“日柱”简洁地保留这一较可能的关联，其他理解置于脚注。
theological_decisions:
- issue: 如何表达先知对异教敬拜物的谴责
  choice: 在正文中具体列出人手所造的祭坛和敬拜物，不笼统改写为“偶像”
  alternative: 将这些物件统称为“偶像”，或在正文加入解释性的谴责用语
  rationale: 希伯来文让谴责从“不再仰望”和“自己手所造”的对照中自然显出；保留具体物件可避免加入原文没有明说的神学阐释。
- issue: 亚舍拉敬拜物的具体形态
  choice: 使用较宽泛的“亚舍拉敬拜物”并加脚注
  alternative: 明确译作“亚舍拉木柱”或“亚舍拉神像”
  rationale: 原词确指与亚舍拉崇拜有关的物件，但具体是木柱、神像还是其他祭祀标志，在不同语境中并不完全确定。
- issue: חַמָּנִים的所指
  choice: 正文译作“日柱”，脚注保留其他可能
  alternative: 译作“日像”“香坛”或“香台”
  rationale: 该词可能与太阳崇拜有关，但物件的外形与用途仍有争议；正文采用简明译法，同时借脚注保存真实的词义不确定性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“仰望—注目”对应原文两个相近但不完全相同的观看动词；两处“自己……所造”保留人造敬拜物这一核心反讽。正文中的[a]、[b]分别紧随所解释的术语。
