id: ISA.17.6
reference: Isaiah 17:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נִשְׁאַר בּ֤/וֹ עֽוֹלֵלֹת֙ כְּ/נֹ֣קֶף זַ֔יִת שְׁנַ֧יִם שְׁלֹשָׁ֛ה גַּרְגְּרִ֖ים בְּ/רֹ֣אשׁ אָמִ֑יר אַרְבָּעָ֣ה חֲמִשָּׁ֗ה בִּ/סְעִפֶ֨י/הָ֙ פֹּֽרִיָּ֔ה נְאֻם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/006.yaml
  text: 'Yet gleanings will be left in it[a], as when an olive tree is beaten: two or three berries at the top of the highest bough, four or five on its fruitful branches, declares Yahweh, the God of Israel.'
translation:
  language: zh_hans
  text: 然而，其中仍会留下些余果[a]，像橄榄树被击打后：最高的枝梢上两三颗，它多果的枝条上四五颗。这是雅威——以色列的上帝——的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仍会留下两三颗橄榄……四五颗在它多果的枝条间。”
    reason: 原文的句法可将后面的数目直接理解为对所余橄榄的说明；正文以“余果”保留收获后所余的概念。
lexical_decisions:
- source_word: וְנִשְׁאַר בּוֹ
  choice: 然而，其中仍会剩下
  rationale: נשׁאר 的尼法勒式表示“留下、剩余”；结合上文审判语境，וְ 带转折意味，译作“然而”自然保留审判中仍有余剩的张力。בּוֹ 直译为“其中”，不强行判定其所指是土地、人民还是先前的意象。
- source_word: עֹלֵלֹת
  choice: 一些可拾取的果子
  rationale: 该词指收获后留下、可供拾取的果实；此译既表达“余果”，也让现代普通读者易于理解拾取收成的农业背景。
- source_word: כְּנֹקֶף זַיִת
  choice: 像打过的橄榄树
  rationale: נֹקֶף 在这里指击打橄榄树以收取果实的过程；“打过的橄榄树”简洁、自然，并保留明喻。
- source_word: גַּרְגְּרִים
  choice: 颗
  rationale: 该词指一颗颗的小果实；上下文已明确是橄榄树，量词“颗”自然表达零星余果，而不必重复“橄榄”。
- source_word: בְּרֹאשׁ אָמִיר
  choice: 最高的枝梢上
  rationale: רֹאשׁ 表示顶部，אָמִיר 指树冠高处或最高枝条；“最高的枝梢”准确传达果实留在难以触及的高处。
- source_word: בִּסְעִפֶיהָ פֹּרִיָּה
  choice: 结果子的枝条上
  rationale: סְעִפֶיהָ 指树的枝条，פֹּרִיָּה 表示多产、结果；译文保留修饰关系，同时避免较生硬的“丰产枝条”。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华……的宣告
  rationale: נְאֻם 是庄重的先知宣告公式；将 יהוה 音义传统化译为现代中文圣经读者熟悉的“耶和华”，保留其专名性质。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 按原文属格结构直译，完整保留上帝与以色列的身份关联。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为人知、具有专名性质的“耶和华”，不以“主”替代，从而保留原文神名与称号之间的区别；“雅威”是更接近学界常见拟音的可选译法。
- issue: 余剩意象是否明确解释为“余民”
  choice: 保留橄榄树上余果的农业比喻，不在正文中直译为“余民”
  alternative: 把果子解释性译为幸存的余民
  rationale: 上下文确有少数存留者的神学意涵，但本节以拾取余果和橄榄收成为具体图像；保留比喻可避免把隐含意义直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“最高的枝梢”“结果子的枝条”保持诗性平行；重复“只剩”凸显审判后数量极少，但不把比喻的所指过度解释。脚注标记[a]已置于正文相应位置。
