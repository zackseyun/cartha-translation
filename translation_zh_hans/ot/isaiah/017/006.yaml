  terminology: “雅威”直接对应英语审校轨迹所采用的 Yahweh，并与“以色列的上帝”保留原文专名和称号的区分。“余果”“枝梢”“多果的枝条”分别恰当呈现 עֹלֵלֹת、אָמִיר 和 פֹּרִיָּה。
