  to: 然而，其中仍会留下些余果[a]，像橄榄树被击打后：最高的枝梢上两三颗，它多果的枝条上四五颗。这是雅威——以色列的上帝——的宣告。
  rationale: 修订仅澄清橄榄收获的动作性比喻，采用更直接的“余果”，并在脚注补回“多果的”修饰语。数目、空间对照及原文的农业意象均得到保留，未将该图像解释性改写为“余民”。
