base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/004.yaml
  text: And in that day the glory of Jacob will become thin[b][a], and the fatness of his flesh will waste away.
translation:
  language: zh_hans
  text: 到那日，雅各的荣耀必衰微[a]，他肥壮的身躯必消瘦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必减弱”或“必变得微薄”。希伯来语动词可指变小、变弱、减少，也可指变瘦；这里与下句身体消瘦的意象相呼应。
    reason: lexical_alternative
  - marker: b
    text: 直译可作：“他肉体的肥壮必变得瘦弱。”原文用肥壮与消瘦的身体意象，描绘雅各失去力量与昌盛。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书中常见的时间表达。现代汉语用“到那日”既自然简洁，也保留了预告将来情形的语气。
- source_word: יִדַּל
  choice: 必衰微
  rationale: 该动词可表示变小、变弱、减少或变得瘦弱。主语是“荣耀”，译作“衰微”符合现代汉语搭配，同时与下半句身体消瘦的意象相呼应。
- source_word: כְּבוֹד
  choice: 荣耀
  rationale: 此词可涵盖尊荣、显赫、荣华和实力；“荣耀”保留其宽广含义，不将经文局限为财富或政治地位。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 原文直接使用“雅各”这一名字，故不在正文中解释性地改作“以色列”，从而保留其民族及盟约语境中的回响。
- source_word: וּמִשְׁמַן בְּשָׂרוֹ
  choice: 他肥壮的身躯
  rationale: 原文直指“他肉体的肥厚/肥壮”。译文以自然汉语保留身体丰满强健的具体意象，而不直接抽象化为富足或强盛。
- source_word: יֵרָזֶה
  choice: 必消瘦
  rationale: 该动词表示变瘦、变得瘦弱。“消瘦”准确呈现身体逐渐失去肥壮的形象，也能暗示力量与昌盛的衰退。
theological_decisions:
- issue: 审判预言中“雅各”的所指
  choice: 正文保留“雅各”
  alternative: 以色列；雅各的子孙
  rationale: 本节涉及群体性的衰败，但希伯来文用的是“雅各”。保留原名可维持其民族与盟约含义，同时避免在正文中替作者作出解释性替换。
- issue: 身体消瘦意象与国家衰败的关系
  choice: 正文保留身体意象，不直接释作国力或财富减少
  alternative: 他的富足必消逝；他的实力必衰退
  rationale: 上下两句刻意以衰微、消瘦描绘雅各失去荣耀。保留具体意象，使读者既能看见字面修辞，也不会把其象征范围过早限定为某一种损失。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“衰微”适合修饰“荣耀”，“肥壮的身躯必消瘦”则保留希伯来文鲜明的身体意象，并使两行形成自然的平行关系。
