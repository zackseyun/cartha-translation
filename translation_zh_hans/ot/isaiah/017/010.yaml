id: ISA.17.10
reference: Isaiah 17:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י שָׁכַ֨חַתְּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/ךְ וְ/צ֥וּר מָעֻזֵּ֖/ךְ לֹ֣א זָכָ֑רְתְּ עַל כֵּ֗ן תִּטְּעִי֙ נִטְעֵ֣י נַעֲמָנִ֔ים וּ/זְמֹ֥רַת זָ֖ר תִּזְרָעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/010.yaml
  text: For you have forgotten the God of your salvation[a], and have not remembered the Rock of your refuge[c][b]; therefore you plant pleasant plants and sow it with a foreign vine.
translation:
  language: zh_hans
  text: 因为你忘记了拯救你的上帝，也没有记念你避难的磐石；所以你栽种悦目的植物[a]，又种下外来的葡萄枝[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悦目的植物”也可译作“上好的栽种”或“可爱的植物”；这句话可能影射外来宗教仪式所用的栽培植物。
    reason: 词义备选及文化背景说明
  - marker: b
    text: “外来的葡萄枝”也可译作“陌生的插枝”或“异族的嫩枝”。
    reason: 词义备选
  - marker: c
    text: 这些农业意象可能暗示人倚靠外来的宗教或联盟，而不倚靠耶和华；但希伯来原文没有明说。
    reason: 保留含混性的文化与神学说明
lexical_decisions:
- source_word: שָׁכַחַתְּ
  choice: 你忘记了
  rationale: Qal完成式第二人称阴性单数；用“忘记了”表达已经发生、并导致当前后果的行动。
- source_word: אֱלֹהֵי יִשְׁעֵךְ
  choice: 拯救你的上帝
  rationale: 原文直译为“你救恩的上帝”。现代汉语用“拯救你的上帝”更自然，同时保留上帝是救恩来源的意思。
- source_word: צוּר מָעֻזֵּךְ
  choice: 作你保障的磐石
  rationale: 保留“磐石”这一指向上帝稳固保护的比喻；“保障”传达 מָעוֹז 所含的力量、庇护和坚固处之意，而不将意象过度军事化。
- source_word: לֹא זָכָרְתְּ
  choice: 也不记念
  rationale: 与前面的“忘记了”构成平行；“记念”比单纯“想起”更能表达持续放在心上、据此行事的语义。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 自然表达原文由忘记上帝转入其后行为或后果的推论关系。
- source_word: תִּטְּעִי נִטְעֵי נַעֲמָנִים
  choice: 你栽种悦人的植物
  rationale: תִּטְּעִי 为未完成式第二人称阴性单数，可描写当前惯常行为或将来的行动；这里采用生动的现在时。“悦人的”保留 נַעֲמָנִים 的可喜、可爱或精选之义，不在正文中确定为宗教礼仪用植物。
- source_word: זְמֹרַת זָר
  choice: 外来的葡萄枝
  rationale: זְמֹרָה 指葡萄藤的枝条或插枝，זָר 可指外来、陌生或异族的；此译保留农业图景及“外来”的含混意味。
- source_word: תִּזְרָעֶנּוּ
  choice: 又种下
  rationale: 该词来自动词 זרע“撒种、播种”，但宾语是葡萄枝；现代汉语说“种下葡萄枝”较自然，也没有把动作具体限定为某一种栽培方法。原文第三人称阳性单数后缀所指略显压缩，汉语不强行补出不明确的“它”。
theological_decisions:
- issue: 是否在正文中把植物和外来葡萄枝明确解释为异教崇拜
  choice: 保留原文的农业意象，不在正文中明说偶像崇拜、异教园圃或政治联盟。
  alternative: 将其明确译作异教礼仪所用的园圃或象征倚靠外邦势力的栽种。
  rationale: 上下文将这些行为与忘记上帝相连，可能暗示对外来宗教或外邦势力的依赖；但本节希伯来文本本身仍采用含蓄的农业语言。脚注说明可能含义，而正文保留其神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留原文“因为……所以……”的因果结构，以及“上帝／磐石”和两项栽种行为的平行关系。第二人称阴性单数在汉语中不作性别标记；不以“她”或其他补语强行确定所指。
