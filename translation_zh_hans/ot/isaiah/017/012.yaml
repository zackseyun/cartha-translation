base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/012.yaml
  text: Ah[a], the roar of many peoples— they roar like the roaring of the seas[b]; and the rushing of nations— they rush like the rushing of mighty waters.
translation:
  language: zh_hans
  text: 啊[a]，许多民族的喧嚷——他们喧嚷，如众海轰鸣；列国的喧嚣——他们喧嚣，如浩大水流轰鸣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“祸哉，许多民族……”或“唉！”原文感叹词הוֹי可引出哀叹、警告，也可用于强烈地唤起注意。
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: 啊
  rationale: 这是一个语气强烈的感叹词，可表达哀叹、警告或引人注意。正文用“啊”保留开放的感叹语气，不将其限定为灾祸宣告；“祸哉”或“唉”仍是可能的理解。
- source_word: הֲמוֹן עַמִּים רַבִּים
  choice: 许多民族喧声大作
  rationale: הֲמוֹן既可指众多的人群，也可指他们发出的喧嚷；下文以海的声音作比并使用同源动词，语境侧重听觉意象。“喧声大作”兼顾群体声势和巨大声响。
- source_word: כַהֲמוֹת יַמִּים יֶהֱמָיוּן
  choice: 他们喧嚷，如大海轰鸣
  rationale: 名词与同源动词反复营造轰响效果，译文以“喧声／喧嚷”呼应，并用自然的现代汉语“如大海轰鸣”呈现海洋意象。希伯来文“海”为复数，中文采用集合性的“大海”以免“众海”显得生硬。
- source_word: וּשְׁאוֹן לְאֻמִּים
  choice: 列国轰声大作
  rationale: שָׁאוֹן指轰鸣、喧嚣或奔涌之声；“轰声大作”保留听觉力度。לְאֻמִּים译作“列国”，与前半句“民族”形成对应而不完全重复。
- source_word: כִּשְׁאוֹן מַיִם כַּבִּירִים יִשָּׁאוּן
  choice: 他们轰鸣，如浩大水流奔腾
  rationale: מַיִם כַּבִּירִים意为强盛、浩大的水；“浩大水流”保留其规模与力量。动词与שָׁאוֹן相关，核心仍是发出巨响；“轰鸣”明确声音，“奔腾”则自然呈现水势，但不以动态含义取代原文的声响重点。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以两个“声大作”和两个声响动词维持希伯来诗歌的平行与回响。“民族／列国”对应两个近义集合名词；避免使用生僻拟声词，也不把开头感叹词单一解释为正式的咒诅宣告。
