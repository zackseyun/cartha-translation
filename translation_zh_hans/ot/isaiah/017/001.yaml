base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/001.yaml
  text: 'An oracle concerning Damascus: Behold[a], Damascus will be removed from being a city[b], and it will become a heap of ruins.'
translation:
  language: zh_hans
  text: 关于大马士革的宣告[a]：看哪，大马士革将不再为城[b]，必成为一堆废墟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于大马士革的重担”，或“关于大马士革的神谕”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“从城被除去”，意思是它将不再是一座城。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: 宣告
  rationale: 在先知书标题中，此词引出带有审判意味的神谕性宣言。“宣告”在现代汉语中自然、庄重，也不把其本义争议局限为“重担”。
- source_word: דַּמָּשֶׂק
  choice: 大马士革
  rationale: 采用现代汉语通行地名译法。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文唤起注意、使预言场景鲜明而庄重的语用功能。
- source_word: מוּסָר מֵעִיר
  choice: 将不再为城
  rationale: 原文直译近于“从城被除去”，语义是大马士革失去城市的地位或状态；此译简洁自然，并保留将来的预言指向。
- source_word: וְהָיְתָה
  choice: 必成为
  rationale: 这里表示审判所导致的状态转变；“成为”比单纯的“是”更能体现结果意义，“必”则自然传达预言宣告的确定语气。
- source_word: מְעִי מַפָּלָה
  choice: 一堆废墟
  rationale: 该短语描绘因倒塌毁坏而形成的堆积；“一堆废墟”是自然、形象且符合上下文的现代汉语表达。
theological_decisions: []
