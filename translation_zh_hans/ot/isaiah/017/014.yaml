revisions:
- from: 到晚上，看哪，尽是惊恐！天还未亮，他们就不复存在了。这就是掳掠我们之人的份，是抢夺我们之人的命运。
  to: 傍晚时分，看哪，惊恐！清晨以前，已不见了。这是掳掠我们之人的份额，也是抢夺我们之人所得的签。
  rationale: 修订时间表达，删除无根据的“尽是”，并用无主句保留原文单数代词的指代与数的含混。末句以“份额／所得的签”呈现两项平行的分配意象，且不补出原文未明说的神圣施行者。
