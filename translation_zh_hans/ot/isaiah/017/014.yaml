  source_fidelity: “尽是”给 בַּלָּהָה（惊恐／恐怖）增添了“全是、到处都是”的范围意义；“他们”则把原文阳性单数的未明指代明确复数化。原文可按上下文指敌对势力的整体，但并未在本句明说，宜保留其指代上的含混。
  naturalness: “傍晚时分”比“到晚上”更准确自然地对应“在傍晚的时候”。省略“就不复存在了”的主语，译为“已不见了”，在现代汉语中流畅，也能不预设其单复数。
  terminology: 保留“掳掠／抢夺”的平行；以“份额／所得的签”对应 חֵלֶק／גוֹרָל，避免把“签／抽签所得”直接抽象化为“命运”，并维持原文两项分配意象的并行。
  issues:
