source:
  edition: WLC
  text: לְ/עֵ֥ת עֶ֨רֶב֙ וְ/הִנֵּ֣ה בַלָּהָ֔ה בְּ/טֶ֥רֶם בֹּ֖קֶר אֵינֶ֑/נּוּ זֶ֚ה חֵ֣לֶק שׁוֹסֵ֔י/נוּ וְ/גוֹרָ֖ל לְ/בֹזְזֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/014.yaml
  text: At evening time, look—terror! Before morning, he is no more. This is the portion of those who plunder us, and the lot of those who loot us.
translation:
  language: zh_hans
  text: 傍晚时分，看哪，惊恐！清晨以前，已不见了。这是掳掠我们之人的份额，也是抢夺我们之人所得的签。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֵת עֶרֶב
  choice: 到晚上
  rationale: 表达“在傍晚时分”的时间含义，同时保持简洁自然。
- source_word: וְהִנֵּה בַלָּהָה
  choice: 看哪，尽是惊恐！
  rationale: “看哪”保留突现与引人注意的语气；“惊恐”对应 בַלָּהָה 所指的恐怖、惊惶景象。
- source_word: אֵינֶנּוּ
  choice: 他们就不复存在了
  rationale: 希伯来语形式为阳性单数，但可回指上一节作为集合整体的“列国”；中文用复数代词承接语境更自然，同时保留其彻底消失之意。
- source_word: חֵלֶק
  choice: 份
  rationale: 保留所分得之“份”的报应性意象。
- source_word: גוֹרָל
  choice: 命运
  rationale: 该词本义可指“签、所得的份”，此处与 חֵלֶק 平行，表示临到抢夺者的结局；“命运”在中文中自然且庄重。
- source_word: שׁוֹסֵינוּ / בֹזְזֵינוּ
  choice: 掳掠我们之人／抢夺我们之人
  rationale: 用两个近义表达保留希伯来诗句的平行结构与细微措辞差别。
theological_decisions:
- issue: אֵינֶנּוּ 的指代与数
  choice: 译作“他们就不复存在了”，按上下文指敌对列国或掳掠者这一集合群体
  alternative: “他就不复存在了”或“它就不复存在了”
  rationale: 原文语法为阳性单数，指代对象并未在本句明说；上一节的列国可被视为一个集合整体。中文若直译“他”容易误导为某个特定个人，因此采用语境化复数，但不具体点明是哪一国。
- issue: חֵלֶק 与 גוֹרָל 的神学含义
  choice: 保留“份／命运”的审判性陈述
  alternative: 扩译为“上帝给他们的报应”
  rationale: 原文没有在本句明确说出施行者，故不补入“上帝”，避免把隐含神学关系变成明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“看哪”的先知性突现语气，并以短句和感叹号再现从夜间惊恐到黎明前消亡的急剧转折。
