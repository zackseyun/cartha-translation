base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/005.yaml
  text: And it will be as when one gathers standing grain at harvest[a], and his arm reaps the ears[b]; and it will be as when one gleans ears in the Valley of Rephaim.
translation:
  language: zh_hans
  text: 那时，必像收割的人收聚田中未割的庄稼；他的手臂收割谷穗[a]。又像人在利乏音谷[b]拾取余下的谷穗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谷穗”也可译作“穗头”。
    reason: lexical_alternative
  - marker: b
    text: “利乏音”是地名的音译；这个名称也与“巨人”的说法有关。
    reason: alternative_reading
lexical_decisions:
- source_word: כֶּאֱסֹף קָצִיר קָמָה
  choice: 像人在收割时拢起直立的禾稼
  rationale: כֶּאֱסֹף引出比喻；קָצִיר在此可表示收割或收割者，与קָמָה“直立未割的庄稼”连用。译文用泛指主语“人”和时间表达“在收割时”，既自然，也保留收拢田间禾稼的画面。
- source_word: קָמָה
  choice: 直立的禾稼
  rationale: 指仍立在田间、尚未割下的谷类作物。“禾稼”不限定具体谷物，“直立的”则保留原词所强调的状态。
- source_word: וּזְרֹעוֹ
  choice: 用臂膀
  rationale: 原文直译为“他的臂膀”。汉语采用工具性表达“用臂膀”，使动作关系清楚，同时保留鲜明的身体意象。
- source_word: שִׁבֳּלִים
  choice: 穗子
  rationale: 泛指谷类作物的穗，不宜具体化为“麦穗”。“穗子”是现代汉语自然且准确的农业用语。
- source_word: יִקְצוֹר
  choice: 割取
  rationale: 这是收割庄稼的常用动词；结合宾语“穗子”，译作“割取”比再次使用“收割”更顺畅，并保留割下作物的动作。
- source_word: כִּמְלַקֵּט
  choice: 像人在……捡拾遗落的
  rationale: לקט在收割语境中特指捡拾收割后剩下的穗子。译作“捡拾遗落的”向普通读者明示拾穗含义，而不把它泛化为一般的采集。
- source_word: בְּעֵמֶק רְפָאִים
  choice: 在利乏音谷
  rationale: 这是地名，采用音译“利乏音”，避免直接译成“巨人”而把可能的名称关联当作确定含义。
theological_decisions:
- issue: 地名רְפָאִים的处理
  choice: 音译为“利乏音谷”
  alternative: “巨人谷”
  rationale: 此处明确用于地名。音译既符合专名处理原则，也避免将该名称与“巨人”的词义关联解释为经文明说的地理含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两个“像”保持原文并列比喻结构；“禾稼”“穗子”“捡拾遗落的”延续统一的收割意象。脚注标记均置于正文相应词语之后。
