  to: 那时，必像收割的人收聚田中未割的庄稼；他的手臂收割谷穗[a]。又像人在利乏音谷[b]拾取余下的谷穗。
  rationale: 修订使首个比喻明确对应原文的“收聚站立的庄稼”，以“田中未割的庄稼”自然表达其状态；保留“他的手臂”这一原文形象。第二个比喻以“拾取余下的谷穗”表达“拾穗”而不把地名解释化。脚注a置于“谷穗”后，对应其词义替代；脚注b仍紧随地名。
