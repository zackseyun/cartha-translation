  text: וְ/נִשְׁבַּ֤ת מִבְצָר֙ מֵֽ/אֶפְרַ֔יִם וּ/מַמְלָכָ֥ה מִ/דַּמֶּ֖שֶׂק וּ/שְׁאָ֣ר אֲרָ֑ם כִּ/כְב֤וֹד בְּנֵֽי יִשְׂרָאֵל֙ יִֽהְי֔וּ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/003.yaml
  text: And the fortress will cease from Ephraim[a], and the kingdom from Damascus; and the remnant of Aram will be like the glory of the sons of Israel[b], declares Yahweh of hosts.
translation:
  language: zh_hans
  text: 以法莲的堡垒将不复存在，大马士革的王国也必消逝；亚兰的余民必如同以色列子孙的荣耀[a][b]。万军之耶和华宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”也可译作“荣光”或“尊荣”；希伯来词可涵盖这些含义。
    reason: lexical_alternative
  - marker: b
    text: 这里没有明说亚兰的余民在哪一方面如同以色列子孙的荣耀；按上下文，这可能是说亚兰将与以色列同样衰微。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִשְׁבַּת
  choice: 必消失／必消亡
  rationale: 此处שׁבת的尼法勒词干表示停止存在或被除去。按两个并列名词分别译作“消失”和“消亡”，既传达终止之意，也使现代汉语自然流畅，不额外解释为“被毁灭”。
- source_word: מִבְצָר
  choice: 堡垒
  rationale: 该单数名词指设防之处或军事据点；“堡垒”保留具体的军事含义及单数形式。
- source_word: מֵאֶפְרַיִם
  choice: 以法莲的
  rationale: 保留希伯来文所用的支派兼地域名称“以法莲”，不直接释为北国以色列。介词מִן与“消失”结合，在汉语中自然转化为所属结构。
- source_word: וּמַמְלָכָה מִדַּמֶּשֶׂק
  choice: 大马士革的国权也必消亡
  rationale: מַמְלָכָה可指王国、王权或统治。“国权”在这里既能表达政治统治，又能与地点“大马士革”自然搭配；动词承接前句的省略结构。
- source_word: וּשְׁאָר אֲרָם
  choice: 亚兰的余民
  rationale: שְׁאָר指剩余者或余下部分。“余民”保留先知文体，也与复数动词יִהְיוּ所体现的集合性相合；专名按原文译为“亚兰”，不改作“叙利亚”。
- source_word: כִּכְבוֹד
  choice: 必像……的荣耀
  rationale: כָּבוֹד可指荣耀、尊荣或荣光。“荣耀”保留词义的分量与开放性；“像”忠实呈现比较关系，不明说比较的具体方面。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 较贴近字面的“以色列之子”，并用“众子”表达复数，避免将原文的阳性形式无依据地中性化。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 这是万军之耶和华的宣告
  rationale: נְאֻם是先知性宣告公式；“宣告”庄重而清楚。יהוה按通行中文圣经专名译作“耶和华”，צְבָאוֹת保留传统神圣称号“万军之”。
theological_decisions:
- issue: “亚兰的余民必像以色列众子的荣耀”这一比较的确切含义
  choice: 正文保留形式上的含混，不说明亚兰在哪一方面“像”以色列众子的荣耀。
  alternative: 可理解为亚兰的余民将与以色列一同衰微，也可理解为二者在地位、荣光或命运上相似。
  rationale: 希伯来文本身没有明说比较点。下文语境倾向于衰落或削减，但本节并未直接限定，因此不在译文中消除这一解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知文体。“堡垒”“国权”“余民”“宣告”等词兼顾原文结构与中文可读性；比较句刻意保留原文未明确说明的含义。
