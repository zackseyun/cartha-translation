  to: 列国如众水轰鸣般喧嚷；他斥责它，它便远远逃去[a]，被追赶，如同山上的糠秕被风吹散，又如旋转之物被暴风卷走[b][c]。
  rationale: 修订保留原文单数代词及未明说的斥责者，不把“它”在正文中限定为“喧嚷”。同时调整末尾两个风驱比喻，使汉语表达更连贯，并保留גַּלְגַּל的词义不确定性。原脚注a中关于“列国／万民”和“众水”的信息属词汇说明，但“万民”并非本节唯一必要的正文歧义；为避免无对应锚点的附加脚注，保留与修订文本直接相关的三个脚注。
