id: ISA.17.13
reference: Isaiah 17:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְאֻמִּ֗ים כִּ/שְׁא֞וֹן מַ֤יִם רַבִּים֙ יִשָּׁא֔וּ/ן וְ/גָ֥עַר בּ֖/וֹ וְ/נָ֣ס מִ/מֶּרְחָ֑ק וְ/רֻדַּ֗ף כְּ/מֹ֤ץ הָרִים֙ לִ/פְנֵי ר֔וּחַ וּ/כְ/גַלְגַּ֖ל לִ/פְנֵ֥י סוּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/013.yaml
  text: The peoples roar like the roaring of many waters[a], but he rebukes it, and it flees far away, chased like chaff on the mountains before the wind[d][c][b], and like whirling dust before the storm.
translation:
  language: zh_hans
  text: 列国如众水轰鸣般喧嚷；他斥责它，它便远远逃去[a]，被追赶，如同山上的糠秕被风吹散，又如旋转之物被暴风卷走[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“斥责它……它便逃去”使用单数形式，可能把众多列国视为一个整体，也可能承接它们的喧嚷或声势。
    reason: alternative_reading
  - marker: b
    text: “旋转之物”原文所指不确定，也可理解为“滚动之物”或类似风滚草的植物。
    reason: lexical_alternative
  - marker: c
    text: “暴风”也可译作“旋风”或“风暴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֻמִּים
  choice: 列国
  rationale: 该复数名词指多个民族或国家群体；“列国”简洁庄重，也符合以赛亚书国际性群体的语境。“万民”亦可能，但容易弱化群体之间的复数感。
- source_word: כִּשְׁאוֹן מַיִם רַבִּים יִשָּׁאוּן
  choice: 喧嚷，如众水轰鸣
  rationale: שָׁאוֹן与相关动词共同突出巨大嘈杂的声响；“轰鸣”贴合众水的听觉意象，“喧嚷”则自然表达列国发出的 tumult。
- source_word: וְגָעַר בּוֹ
  choice: 但他斥责这喧嚷
  rationale: גָּעַר表示严厉斥责、喝止。希伯来语宾语为阳性单数，译文以“这喧嚷”承接前面的集体性声势，既说明所指，又保留单数形式；“但”体现语意突转。
- source_word: וְנָס מִמֶּרְחָק
  choice: 它便远远逃去
  rationale: 动词为单数，继续把列国的喧嚷或整体声势视作一个集体。מִמֶּרְחָק在此表达逃离至远处，“远远逃去”符合现代汉语。
- source_word: וְרֻדַּף
  choice: 被追赶
  rationale: 该形式为被动，描绘受斥责者在逃遁中被驱逐、追赶；直译“被追赶”保留动作关系。
- source_word: כְמֹץ הָרִים לִפְנֵי רוּחַ
  choice: 如山上的糠秕在风前飞散
  rationale: מֹץ通常指被风吹走的糠秕；“山上的”表达压缩结构מֹץ הָרִים，并呈现高处受风驱散的图景。“飞散”为汉语自然表达，显明לִפְנֵי רוּחַ所含的受风驱赶之意。
- source_word: וּכְגַלְגַּל
  choice: 又如旋飞之物
  rationale: גַלְגַּל在此所指不确定，可能是滚动或旋转的轻物，也可能指类似风滚草的植物。“旋飞之物”保留动态意象而不武断指定具体物体。
- source_word: לִפְנֵי סוּפָה
  choice: 在暴风前
  rationale: סוּפָה指猛烈风暴，也可带旋风含义。“暴风”既通俗又保留其强烈程度，避免把词义限定为单一类型的旋风。
theological_decisions:
- issue: 复数“列国”之后出现单数宾语与单数动词
  choice: 以“这喧嚷／它”承接，把列国的声势视为一个集体整体
  alternative: 按意义译成“斥责他们，他们便逃去”
  rationale: וְגָעַר בּוֹ与וְנָס均为单数；译为“这喧嚷／它”既符合语法，也保留诗歌中从复数列国转为单一喧嚷整体的张力。
- issue: 斥责者的身份
  choice: 译作“他”，不在正文点明身份
  alternative: 明确译作“上主”或“神”
  rationale: 上下文暗示斥责者为神，但本节希伯来文本没有明说其名号；保留“他”避免把上下文推断写成正文中的明示。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。正文保持希伯来诗句的听觉与运动意象，并用分号呈现列国轰鸣与突然溃散之间的强烈转折。代词处理刻意保留原文单数与身份未明说的特点。
