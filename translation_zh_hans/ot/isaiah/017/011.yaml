  text: בְּ/י֤וֹם נִטְעֵ/ךְ֙ תְּשַׂגְשֵׂ֔גִי וּ/בַ/בֹּ֖קֶר זַרְעֵ֣/ךְ תַּפְרִ֑יחִי נֵ֥ד קָצִ֛יר בְּ/י֥וֹם נַחֲלָ֖ה וּ/כְאֵ֥ב אָנֽוּשׁ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/011.yaml
  text: On the day you plant[a], you make it grow luxuriantly; and in the morning you make your seed sprout[b]. But the harvest flees away in a day of grief and incurable pain.
translation:
  language: zh_hans
  text: 你栽种的那天，就使它繁茂；到了早晨，又使你的种子发芽。然而，到了患难[a]和无可医治的痛苦之日，收成却消逝了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难”也可译作“疾病”或“苦难”。
    reason: lexical_alternative
  - marker: b
    text: “收成却消逝了”所依据的原文短语含义不确定；也可较直译为“一堆收成”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְעֵךְ
  choice: 你栽种
  rationale: 原文形式上是带第二人称阴性单数后缀的名词“你的栽种”，译作动词短语更符合现代汉语，同时保留农业意象。
- source_word: תְּשַׂגְשֵׂגִי
  choice: 使它繁茂
  rationale: 该动词表达旺盛生长；补出“它”承接所栽种之物，使汉语语意清楚。
- source_word: זַרְעֵךְ תַּפְרִיחִי
  choice: 使你的种子发芽
  rationale: פרח 的使役形表示使之萌发或开花；在种子的农业语境中，“发芽”最自然。
- source_word: נֵד קָצִיר
  choice: 收成却消逝了
  rationale: נֵד 在本句中含义困难；正文依审判语境取收成被移去、消失之意，并在脚注保留“收成堆”的较直译可能。
- source_word: בְּיוֹם נַחֲלָה
  choice: 到了患难之日
  rationale: נַחֲלָה 此处通常按疾病、灾患或苦难理解；“患难”既与下句的痛苦平行，也不过度限定为身体疾病。
- source_word: וּכְאֵב אָנושׁ
  choice: 和无可医治的痛苦
  rationale: כאב 是痛苦，אָנושׁ 可指严重、绝望或无法医治；此译保留先知审判语言中的强烈和无望感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语；保留原文第二人称阴性单数的直接 خطاب，但汉语不显性标注性别。以“然而”和“却”呈现前半节精心催生作物与后半节收成骤失之间的反差。
