base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/002.yaml
  text: The cities of Aroer are abandoned[a]; they will be for flocks[b], and they will lie down with no one to make them afraid.
translation:
  language: zh_hans
  text: 亚罗珥的城邑必被遗弃[a]；它们必归群畜[b]，群畜必躺卧，无人使它们害怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被遗弃”也可译为“被离弃”或“荒废了”。
    reason: lexical_alternative
  - marker: b
    text: “群畜”也可译为“羊群”或“牲畜群”。原文泛指成群的牲畜；废弃的城邑将供它们使用。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזֻבוֹת
  choice: 被撇弃了
  rationale: 这是动词 עזב 的阴性复数被动分词，与“城邑”一致，表示这些城邑处于被人离弃、荒废的状态；“被撇弃了”保留被动意味和审判语境。
- source_word: עָרֵי
  choice: 城邑
  rationale: עִיר 的复数附属形，可指城市或城镇；“城邑”庄重而涵盖范围较宽，适合先知书语体。
- source_word: עֲרֹעֵר
  choice: 亚罗珥
  rationale: 专有地名，按现代中文圣经人名地名惯例音译。
- source_word: לַעֲדָרִים
  choice: 成为羊群的牧场
  rationale: עֵדֶר 可指羊群或其他成群牲畜；介词 ל 表示归属或用途。原文直译为“给群畜”，中文补出“牧场”可自然表达废城供牲畜栖息放牧的图景。
- source_word: תִּהְיֶינָה
  choice: 必成为
  rationale: היה 的阴性复数未完成式，与前面的城邑相应；在预言语境中译作“必成为”，既表达将来结果，也保持庄严语气。
- source_word: וְרָבְצוּ
  choice: 羊群必躺卧
  rationale: רבץ 常描写牲畜伏卧、躺卧。原文动词为阳性复数，主语自然转为前述群畜；中文明确补出“羊群”，避免误解为城邑躺卧。
- source_word: וְאֵין מַחֲרִיד
  choice: 无人惊扰
  rationale: מחריד 是 חרד 的使役分词，表示使其惊惧或惊动的人；“无人惊扰”简洁传达牲畜安然躺卧、没有人驱赶吓阻的意思。
theological_decisions: []
