base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/014.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you.'
translation:
  language: zh_hans
  text: 王这样说：“不要让希西家欺骗你们[a]，因为他不能救你们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“误导你们”。原文动词可指欺骗，也可指使人走入歧途。
    reason: lexical_alternative
  - marker: b
    text: 或译：“解救你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: 王这样说
  rationale: 保留王室使者宣告公式的庄重语气；希伯来语直译为“王如此说”，现代汉语用“王这样说”自然清楚，也不把上下文中的亚述王之名添入正文。
- source_word: אַל יַשִּׁא לָכֶם חִזְקִיָּהוּ
  choice: 不要让希西家欺骗你们
  rationale: יַשִּׁא在此表示使人受骗或被引入歧途；“欺骗”直接自然。לָכֶם按汉语习惯并入“欺骗你们”。
- source_word: כִּי לֹא יוּכַל
  choice: 因为他不能
  rationale: כִּי引出禁令的理由；לֹא יוּכַל表达能力上的否定。“不能”在汉语中简洁地保留此情态意义。
- source_word: לְהַצִּיל אֶתְכֶם
  choice: 救你们
  rationale: הציל指从现实危险中搭救、解救；本节处于军事威胁语境，“救”简明自然，脚注补充“解救”这一语义选择。
theological_decisions:
- issue: “王”的所指
  choice: 正文只译作“王”
  alternative: 译作“西拿基立”或“亚述王”
  rationale: 原文仅有הַמֶּלֶךְ“王”。其所指可由上下文确定，但本节不明说姓名，故不在译文中增补。
- issue: 希西家能否施救的表述
  choice: “他不能救你们”
  alternative: “他将不能救你们”
  rationale: 原文לֹא יוּכַל强调无能力；汉语“不能”既自然，也不额外限定为纯粹未来时，同时保留敌方使者话语中的断言。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留简短有力的宣告与警告语气；人称复数译为“你们”，符合对耶路撒冷民众的公开喊话场景。
