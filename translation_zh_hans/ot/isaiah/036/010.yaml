  text: וְ/עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/הַשְׁחִיתָ֑/הּ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה אֶל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/010.yaml
  text: And now[a], was it apart from Yahweh that I came up against this land to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: zh_hans
  text: 现在，难道我上来攻打这地、要毁灭它，是撇开雅威[a]而来的吗？雅威对我说：‘上去攻打这地，毁灭它。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撇开雅威”或译“没有雅威”或“不依靠雅威”。
    reason: 原词 מִבַּלְעֲדֵי 可表示“没有、离开、不依靠”。本句为反问；这些译法保留说话者所声称的行动并非独立于雅威，未把该声称强化为正式授权。
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: 难道我是撇开……吗
  rationale: 疑问词与 מִבַּלְעֲדֵי 构成反问，表示“没有、离开、独立于”。“撇开”在现代汉语中自然地保留了“并非独立行动”的含义，又不直接把这句话改写成“奉命”或“蒙许可”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现神名，而不以“主”这一称号代替专名。
- source_word: עָלִיתִי עַל הָאָרֶץ הַזֹּאת
  choice: 上来攻击这地
  rationale: 保留 עלה 的上行意象；介词 עַל 在军事语境中具有敌对指向，因此译作“攻击”。
- source_word: לְהַשְׁחִיתָהּ
  choice: 要毁灭它
  rationale: 希斐勒式在此表示使这地遭受毁坏；“毁灭”直接保留其力度，目的不定式译作“要……”。
- source_word: אָמַר אֵלַי
  choice: 对我说
  rationale: 以自然、直接的现代汉语表达普通的引语引介。
- source_word: עֲלֵה אֶל הָאָרֶץ הַזֹּאת
  choice: 上去攻击这地
  rationale: 命令式 עֲלֵה 译作“上去”；结合军事语境，用“攻击”表达行动的敌对方向。
- source_word: וְהַשְׁחִיתָהּ
  choice: 毁灭它
  rationale: 保留原文第二次明确出现的毁灭命令，不将其弱化或省略。
theological_decisions:
- issue: 亚述使者声称雅威授权此次入侵
  choice: 按说话者的原话保留这一声称
  alternative: 改写为明确否定、讽刺或已获许可的陈述
  rationale: 本节记录的是亚述使者的宣称；译文既不替他背书，也不预先判定其真假，而让上下文处理这一张力。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”直接音译四字神名，保留其作为以色列之神专名的性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上来／上去”保留原文重复的上行动词；直接引语简洁有力。“撇开雅威”避免把原文含义过度限定为正式授权、许可或军事援助。
