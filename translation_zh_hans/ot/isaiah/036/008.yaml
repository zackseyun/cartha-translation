base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/008.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: zh_hans
  text: 现在，请你同我主——亚述王打个赌吧[a]：我给你两千匹马，前提是你能给它们配上骑兵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “打个赌”也可译作“作出保证”或“订立协议”。这里的希伯来语可指作出保证，或以某事为赌注；结合上下文，更适合理解为带有嘲讽意味的打赌或挑战。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב נָא
  choice: 请你……打个赌吧
  rationale: 此处是带礼貌语气词 נָא 的命令式；结合使者嘲讽性的挑战语境，“打个赌”自然传达押注、较量之意，“请……吧”保留表面客气而实际讥讽的口吻。
- source_word: אֶת אֲדֹנִי הַמֶּלֶךְ אַשּׁוּר
  choice: 跟我主亚述王
  rationale: אֶת 在这里引出参与打赌或挑战的另一方；“我主”明确指说话者的人间君主，“亚述王”是同位说明。
- source_word: וְאֶתְּנָה לְךָ
  choice: 我给你
  rationale: 承接挑战，表达说话者提出的给予条件；现代汉语中用“我给你”简洁有力，也符合其夸口语气。
- source_word: אַלְפַּיִם סוּסִים
  choice: 两千匹马
  rationale: 按原文直接翻译数字和名词，并使用现代汉语量词“匹”。
- source_word: אִם תּוּכַל
  choice: 看你能不能
  rationale: 字面为“如果你能”；在本节的嘲讽挑战中，“看你能不能”既保留能力条件，也更自然地表现挑衅口吻。
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: 给这些马配上骑兵
  rationale: 原文直译近于“为自己把骑乘者放在它们上面”，实际指备齐能骑这些马的人；“配上骑兵”清楚传达人员不足的讥讽，同时保留 לְךָ 所暗示的受益者语意于上下文中。
