- source_word: יְהוּדִית
  choice: 犹大话
  rationale: 指当时犹大居民所说的语言，现代中文中比“犹太语”更能贴合历史语境。
- source_word: הַ/מֶּלֶךְ הַ/גָּדוֹל
  choice: 大王
  rationale: 保留亚述王自称中的尊号色彩，也符合自然汉语。
