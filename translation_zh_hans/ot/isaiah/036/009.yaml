  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/009.yaml
  text: How then can you repulse a single captain of the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: zh_hans
  text: 这样，你怎能击退[a]我主人最卑微的臣仆中的一个官长[b]呢？你却还倚靠埃及的战车和骑兵！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击退”直译为“使……的脸转回”，是表示抵挡或逼退的惯用语。
    reason: lexical_alternative
  - marker: b
    text: “官长”也可译作“省长”“官员”或“统领”；希伯来语所指的是一位从属的统治者或官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ
  choice: 这样，你怎能
  rationale: 既承接上文的论证，又保留反问语气；“这样”在现代汉语中自然体现连接词的推进作用。
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: 击退
  rationale: 希伯来语直译为“使……的脸转回”，在此是军事语境中的惯用表达，意为抵挡并使敌方退却；“击退”简洁自然。
- source_word: פַחַת
  choice: 官长
  rationale: 该词可指省长、官员或军政长官；此处虽有军事语境，但身份含义不必限定为纯军事职衔，因此采用较宽泛而庄重的“官长”。
- source_word: אַחַד
  choice: 哪怕一个
  rationale: 突出嘲讽意味：对方连一个较低级的官长也无法击退。
- source_word: עַבְדֵי אֲדֹנִי הַקְטַנִּים
  choice: 我主人最小的仆从中
  rationale: 保留“我主人”和“最小的仆从”的从属、等级关系；“最小”指地位最低，并非体格最小。
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: 你竟倚靠埃及
  rationale: “倚靠”准确表达政治和军事上的信赖；“竟”体现原文反问后的讥讽和不合理性，לְךָ无需生硬译作“为自己”。
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: 战车和骑兵
  rationale: 两个词均为军事集合名词；“战车和骑兵”是清楚、自然的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的汉语。主句以“怎能……呢”保留嘲讽性的反问，并以“哪怕一个”凸显亚述使者的轻蔑口吻；后句用感叹形式自然呈现对倚靠埃及军力的讥讽。脚注标记按其所解释词语的出现次序置于正文中。
