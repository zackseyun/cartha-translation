  rationale: 修订明确“最卑微”所表达的等级意义，减弱“竟”所带来的额外语气强化，并调整脚注锚点，使其各自紧邻“击退”和“官长”。其余译法保留原稿对反问、军事语境及说话者轻蔑口吻的准确呈现。
