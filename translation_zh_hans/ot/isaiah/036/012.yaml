base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/012.yaml
  text: But the Rabshakeh said[a], “Has my master sent me to your master and to you to speak these words? Has he not sent me to the men sitting on the wall, to eat their own dung and drink their own urine with you?”
translation:
  language: zh_hans
  text: 但拉伯沙基说：“我的主人差我来，难道只是要对你的主人和你说这些话吗？难道不是要让坐在城墙上的那些人和你们一起吃自己的粪、喝自己的尿吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文刻意使用粗鄙的围城用语，直译为“吃自己的粪，喝自己的尿”。“尿”一词的书写形式反映了抄写传统中以较委婉的字形代替更粗俗说法的做法。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 按上下文保留亚述官衔的传统音译，避免把其具体职能解释得过死。
- source_word: אֲדֹנֶיךָ / אֲדֹנִי
  choice: 你主 / 我主
  rationale: 两处均指政治上的君主或上级；用“主”简洁保留对应关系，又不在此处引入神圣称谓。
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: 说这些话
  rationale: 贴近希伯来语“说这些话”，也是自然现代汉语。
- source_word: הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחוֹמָה
  choice: 坐在城墙上的那些人
  rationale: 准确表达定冠词、复数名词及分词结构；汉语无需明示阳性。
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: 他们将……吃……喝
  rationale: 在汉语中显明围城将导致的结果，同时不增添“注定”等原文没有明说的判断。
- source_word: חראיהם
  choice: 自己的粪
  rationale: 保留原文故意粗鄙、侮辱性的围城语言，不淡化为抽象委婉语。
- source_word: שיניהם
  choice: 自己的尿
  rationale: 传达所指的排泄物；抄写传统及更粗俗的读法另以脚注说明。
- source_word: עִמָּכֶם
  choice: 和你们一起
  rationale: 自然表达共同承受围城惨况之意，并保留单数“你”转为复数“你们”的变化。
