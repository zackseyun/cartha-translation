  text: וַ/יֵּצֵ֥א אֵלָ֛י/ו אֶלְיָקִ֥ים בֶּן חִלְקִיָּ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/שֶׁבְנָא֙ הַ/סֹּפֵ֔ר וְ/יוֹאָ֥ח בֶּן אָסָ֖ף הַ/מַּזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/003.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, came out to him, along with Shebna the scribe and Joah son of Asaph[d][c][b], the recorder.
translation:
  language: zh_hans
  text: 于是，希勒家的儿子以利亚敬，就是王宫总管[b]，和书记官舍伯那[c]，以及亚萨的儿子记事官约亚[d]，出来见他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“出去到他那里。”
    reason: lexical_alternative
  - marker: b
    text: “王宫总管”是负责王宫行政事务的高级王室官员。
    reason: cultural_note
  - marker: c
    text: “书记官”或译“秘书”。
    reason: lexical_alternative
  - marker: d
    text: “记事官”或译“史官”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 于是……出来
  rationale: 该叙事动词表示“出去／出来”，并承接上一事件；“于是”自然体现希伯来叙事的推进。“出来”符合众官员从城中到亚述使者面前的场景，方向也可理解为“出去”，故以脚注保留另一译法。
- source_word: אֵלָיו
  choice: 见他
  rationale: 介词短语直译为“到他那里／向着他”；汉语在此用“出来见他”更自然，所指是上文的亚述代表。
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: 希勒家的儿子以利亚敬
  rationale: 按现代中文圣经姓名的通行音译处理人名，并保留希伯来语父子关系结构。
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: 就是王宫总管
  rationale: 这是王室职衔，指负责王宫及宫廷事务的高级官员。“王宫总管”比逐字的“在家之上”清楚自然，也保留其行政职能。
- source_word: הַסֹּפֵר
  choice: 书记官
  rationale: סֹפֵר在王室语境中可指负责文书的书记或秘书。“书记官”既贴近词义，又能显出这是官职；“秘书”列作脚注中的可选理解。
- source_word: יוֹאָח בֶּן אָסָף
  choice: 亚萨的儿子……约亚
  rationale: 人名采用通行音译，父子关系按自然汉语表达。
- source_word: הַמַּזְכִּיר
  choice: 记事官
  rationale: 该职衔指负责记录、备忘或向王报告事务的官员。“记事官”较“提醒者”的机械直译自然，并避免把具体职责限定得过窄。
theological_decisions: []
