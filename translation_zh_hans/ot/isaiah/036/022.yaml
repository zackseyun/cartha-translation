base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/022.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: zh_hans
  text: 于是，掌管王室事务的希勒家之子以利亚敬、书记舍伯那和亚萨之子史官约亚，衣服都撕裂了，来到希西家面前，把拉伯沙基[a]的话告诉了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉伯沙基”是亚述的一种官衔，常被理解为类似“首席酒政”的职位，也可能指另一种高级宫廷官员。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 于是……来到
  rationale: 该叙事性连续动词推进事件发展；“于是”自然表达先后承接关系。
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: 掌管王宫的
  rationale: 这一惯用语指主管王室内务的官员；结合王廷语境译作“掌管王宫”既清楚又不过度细化具体职权。
- source_word: הַסּוֹפֵר
  choice: 书记
  rationale: 该词可指文士或王室秘书；此处是宫廷官衔，“书记”简洁并符合行政语境。
- source_word: הַמַּזְכִּיר
  choice: 史官
  rationale: 该官职负责记录、呈报或使君王记起政务；“史官”是简明且为中文读者熟悉的王廷职称，但不把其职责限定为单纯编年。
- source_word: קְרוּעֵי בְגָדִים
  choice: 穿着撕裂的衣服
  rationale: 原文描述他们来到时衣服已撕裂的状态，这是悲痛或惊惧的外在表示；此译避免额外断定撕裂衣服发生的具体时刻。
- source_word: וַיַּגִּידוּ לוֹ
  choice: 把……告诉了他
  rationale: 该使役词形在此表示告知或报告；“告诉”自然，并由后面的宾语说明所传达的内容。
- source_word: דִּבְרֵי
  choice: ……的话
  rationale: 保留“言语、话语”的直接含义，表明他们转述前述官员所说的话，而不概括为抽象的“信息”。
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 这是亚述官衔，在叙事中近似固定称谓；正文采用传统音译，并用脚注说明其性质，以免把职能不确定的称号强行固定为某一官职。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。人名沿用中文圣经中通行的译名；三个宫廷职称以简洁的现代汉语表达。脚注标记置于其实际说明的“拉伯沙基”之后。
