  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: פֶּן יַסִּ֨ית אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵ֑/נוּ הַ/הִצִּ֜ילוּ אֱלֹהֵ֤י הַ/גּוֹיִם֙ אִ֣ישׁ אֶת אַרְצ֔/וֹ מִ/יַּ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/018.yaml
  text: Do not let Hezekiah mislead you[a], saying, ‘Yahweh will deliver us.’ Have any of the gods of the nations, each one[b], delivered his land from the hand of the king of Assyria?
translation:
  language: zh_hans
  text: 不要让希西家误导你们[a]，说：‘雅威必搭救我们。’列国的神中，有哪一个曾从亚述王手中救出自己的国土呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文也可理解为“唆使你们”或“诱导你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: 不要让
  rationale: 这里引出防范性的否定警告；“不要让”比直译“免得”更符合现代汉语，同时保留劝阻语气。
- source_word: יַסִּית
  choice: 误导
  rationale: סות 的使役式可指唆使、诱导或使人误入歧途；在拉伯沙基贬斥希西家劝民信靠雅威的语境中，“误导”自然且不过度强化为蓄意欺骗。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，保留其作为专名的性质，不以称号代替。
- source_word: יַצִּילֵנוּ
  choice: 必搭救我们
  rationale: נצל 的使役式在军事威胁语境中指解救、救出；“搭救”清楚自然，“必”表达引语中对未来结果的断言。
- source_word: הַהִצִּילוּ
  choice: 曾……救出
  rationale: 疑问词与完成式构成反问，质问是否存在任何成功救出国土的先例；“曾”自然体现这种经验性追问。
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: 列国的神
  rationale: 忠实保留“各国民／列国之神”的政治族群含义，并符合现代汉语表达。
- source_word: אִישׁ
  choice: 有哪一个
  rationale: 此处 אִישׁ 具分配作用，逐一指向列国诸神；放入“神中，有哪一个”的问句结构，可清楚表达“任何一个／各自”的含义。
- source_word: אַרְצוֹ
  choice: 自己的国土
  rationale: 单数后缀与分配性的 אִישׁ 呼应，指每一位神所属的国家土地；“自己的国土”在汉语中比“他的地”更清楚自然。
- source_word: מִיַּד מֶלֶךְ אַשּׁוּר
  choice: 从亚述王手中
  rationale: 保留希伯来语“从……手中”的权势意象；该说法在现代汉语中仍然自然易懂。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；译作“雅威”保留专名性质，避免以“主”这一称号取代，也采用较贴近通常学术重构的中文音译。
- issue: 列国之神未能施救的反问
  choice: 保留为拉伯沙基的反问，不替叙述者判定其论证
  alternative: 改写为直接断言列国的神都不能施救
  rationale: 原文呈现敌方使者的修辞问题；保持引语中的张力和说话者立场，不把其比较雅威与列国诸神的论证转化为叙述者认可的神学断言。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“不要让……误导你们”呈现直接警告；“列国的神中，有哪一个……”以自然汉语保留原文分配性的反问结构。
