base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/001.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: zh_hans
  text: 希西家王在位第十四年，亚述王西拿基立上来攻打犹大所有的坚城，并攻占了这些城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: （不另译）
  rationale: 此处叙事性连接形式引入新事件；现代汉语可直接从纪年语起句，无须加“事情发生了”或“那时”，以免显得冗赘或增添原文未明说的时间副词。
- source_word: בְּאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: 希西家王十四年
  rationale: 这是君王在位纪年的标准表达；简洁、自然，并准确表达“希西家作王的第十四年”。
- source_word: עָלָה ... עַל
  choice: 上来攻打
  rationale: 军事语境中的 עלה 与 עַל 表示向某地进军攻击；“上来攻打”既保留方向性，又清楚传达敌对行动。
- source_word: סַנְחֵרִיב
  choice: 西拿基立
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 准确表达希伯来语的属格结构，同时符合现代汉语称谓习惯。
- source_word: כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: 犹大所有的坚城
  rationale: הַבְּצֻרוֹת 指设防、加固的城；“坚城”是简明庄重且常用的中文军事表达。
- source_word: וַיִּתְפְּשֵׂם
  choice: 并且攻取了它们
  rationale: תפשׂ 在攻城语境中表示夺取、占领；“攻取”比泛称“抓住”准确，“它们”明确回指诸城。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留“上来攻打”的军事与方向色彩；不把 וַיְהִי 扩写成带额外时间含义的“那时”。
