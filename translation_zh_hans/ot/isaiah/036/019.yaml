  terminology: 哈马、亚珥拔、西法瓦音、撒马利亚均为通行且一致的中文圣经地名形式。“神”不强加汉语单复数标记，能自然承载原文构造复数的含义。脚注所列“解救了”“救出”均为 הִצִּילוּ 的可行词汇替代。
