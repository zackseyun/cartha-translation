  source_fidelity: 译文准确保留了希伯来文三重反诘／嘲讽结构：“哈马和亚珥拔的神”“西法瓦音的神”以及“他们……救了撒马利亚脱离我的手吗”。“难道……吗”恰当地表达 וְכִי 在此处所引出的、预期否定回答的反问。末句的“我的手”保留了原文第一人称夸口及其权势意象，未擅自具体化其指涉。
