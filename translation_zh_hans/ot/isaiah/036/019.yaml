source:
  edition: WLC
  text: אַיֵּ֞ה אֱלֹהֵ֤י חֲמָת֙ וְ/אַרְפָּ֔ד אַיֵּ֖ה אֱלֹהֵ֣י סְפַרְוָ֑יִם וְ/כִֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/019.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim? And have they delivered Samaria from my hand?[a]
translation:
  language: zh_hans
  text: 哈马和亚珥拔的神在哪里？西法瓦音的神在哪里？他们难道救了撒马利亚脱离我的手吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救了”也可译作“解救了”或“救出”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: 在哪里
  rationale: 这是询问所在之处的疑问词；按现代汉语习惯置于主语之后，保留嘲讽式反问语气。
- source_word: אֱלֹהֵי
  choice: ……的神
  rationale: 这是 אֱלֹהִים 的复数构造形。汉语“神”本身不标示单复数，在此可由多个城邑及后文复数动词理解为各地诸神。
- source_word: חֲמָת וְאַרְפָּד
  choice: 哈马和亚珥拔
  rationale: 按常见中文圣经地名音译，连接词直译为“和”。
- source_word: סְפַרְוָיִם
  choice: 西法瓦音
  rationale: 采用现代中文圣经读者较熟悉的地名音译。
- source_word: וְכִי
  choice: 难道……吗
  rationale: 在此引出带嘲讽意味的高潮反问；“难道……吗”自然传达预期否定答案的语气。
- source_word: הִצִּילוּ
  choice: 救了
  rationale: נצל 的使役完成式复数，意为“救出、解救”；“救了”简洁保留军事语境中的脱险含义。
- source_word: אֶת שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 宾格标记不译；地名采用通行中文译名。
- source_word: מִיָּדִי
  choice: 脱离我的手
  rationale: 保留希伯来文“手”所表达的权势与控制意象，同时“救……脱离……”符合自然现代汉语。
theological_decisions:
- issue: 演说中“我的手”所指
  choice: 保留第一人称的夸口，不在正文中加以解释
  alternative: 明确译作“亚述王的手”或意译为“我的权势”
  rationale: 希伯来文本以第一人称呈现说话者的挑衅。保留“我的手”既维持原有修辞，也不替读者预先判定其具体指涉。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个平行问句保留原文重复结构，末句以“难道……吗”体现亚述使者的嘲讽与夸口；不额外解释异教诸神或“我的手”的神学含义。
