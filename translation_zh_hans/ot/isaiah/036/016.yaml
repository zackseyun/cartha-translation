  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר הַ/מֶּ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵי בוֹרֽ/וֹ־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/016.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern[b],'
translation:
  language: zh_hans
  text: “不要听希西家的话，因为亚述王这样说：‘你们要与我讲和[a]，出来到我这里来；各人[b]可以吃自己葡萄树上的果子，吃自己无花果树上的果子，喝自己蓄水池里的水，’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“与我成就祝福”；这是表示讲和或达成有利条件的习语。
    reason: lexical_alternative
  - marker: b
    text: “各人”译自原文反复出现的אִישׁ，强调群体中的每一个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: 听……的话
  rationale: 该结构在此意为听从、理会。译作“听……的话”自然地保留了“听取并接受劝告”的语气，又不把含义强化为完全顺服。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: כִּי כֹה אָמַר הַמֶּלֶךְ אַשּׁוּר
  choice: 因为亚述王这样说
  rationale: 忠实表达引出直接引语的使者公式，同时符合现代汉语表达。
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: 与我讲和
  rationale: 字面涉及“祝福”，但在外交语境中是缔结和约或达成有利条件的习语；“讲和”准确而自然。字面形式收入脚注。
- source_word: וּצְאוּ אֵלַי
  choice: 出来归向我
  rationale: 保留“出来”和“到我这里”的表层意象，并以“归向”表达方向；未直接译作“投降”，以免把语境中的含意写死。
- source_word: וְאִכְלוּ אִישׁ
  choice: 这样，你们各人就可以吃
  rationale: 原文为命令式，但在亚述王的劝降话语中带有应许、允诺意味；用“就可以”使现代汉语顺畅，并保留其诱劝效果。“各人”表达 אִישׁ 的逐一分配意义。
- source_word: גַּפְנוֹ
  choice: 自己葡萄树上的果子
  rationale: 原文直译为“自己的葡萄树”；汉语说“吃葡萄树”不自然，因此补出隐含的“果子”，同时保留个人所有关系。
- source_word: תְּאֵנָתוֹ
  choice: 自己无花果树上的果子
  rationale: 为符合汉语习惯补出所吃的是树上的果子，并保留所有关系以及安居丰足的意象。
- source_word: מֵי בוֹרוֹ
  choice: 自己水池里的水
  rationale: בּוֹר 在此指储水用的池或窖，不是泉源；“水池”比“井”更贴近其储水设施含义，也较易为普通读者理解。
