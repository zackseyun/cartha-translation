  to: 看哪，你倚靠的是埃及，是这根压伤的芦苇杖；人[a]若靠在上面，它就会刺入他的手掌，把手掌刺破。埃及王法老对所有倚靠他的人，也是这样。
  rationale: 修订“压裂”为“压伤”，使其更贴合原文并符合现代汉语；同时简化手掌受伤的描写，避免重复或过度强化。其余句法、比喻、称谓和脚注锚点均予保留。
