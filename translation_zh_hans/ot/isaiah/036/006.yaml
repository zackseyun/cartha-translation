  text: הִנֵּ֣ה בָטַ֡חְתָּ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/006.yaml
  text: Look[a], you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, goes into his hand and pierces it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: zh_hans
  text: 看哪，你倚靠的是埃及，是这根压伤的芦苇杖；人[a]若靠在上面，它就会刺入他的手掌，把手掌刺破。埃及王法老对所有倚靠他的人，也是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为阳性单数“一个男人”，这里用作泛指。
    reason: 说明希伯来文的语法性别及其代表性用法；中文正文用泛指的“人”自然表达。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文提醒听者注意的语气；“看哪”简洁庄重，在现代中文中仍容易理解。
- source_word: בָטַחְתָּ
  choice: 你倚靠的是
  rationale: 这里指当下持续的政治依赖；“倚靠”既符合中文习惯，也与下文靠在芦苇杖上的形象相呼应。
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: 这根压裂的芦苇杖
  rationale: מִשְׁעֶנֶת 指供人支撑的杖；רָצוּץ 表示被压坏、破裂。“压裂”保留其受损而会伤人的具体形象。
- source_word: עַל מִצְרַיִם
  choice: 埃及
  rationale: 埃及是前述芦苇杖比喻所指的对象；中文以“你倚靠的是埃及，是……”自然表达同位关系。
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: 人若靠在上面
  rationale: 关系从句描述一种假设情形；用“若”清楚呈现条件意味。
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: 它反会扎进他的手掌，把手掌刺穿
  rationale: 具体呈现破芦苇进入手掌并将其刺穿的结果；“反会”点明本来用于支撑之物反而造成伤害。
- source_word: כֵּן
  choice: 也是这样
  rationale: 简洁标明芦苇杖与法老之间的比较。
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: 对所有倚靠他的人
  rationale: 保留原文“对所有……的人”的范围，并与前半句“倚靠”保持词语呼应。
theological_decisions: []
