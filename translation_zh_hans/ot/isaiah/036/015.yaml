id: ISA.36.15
reference: Isaiah 36:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה לֹ֤א תִנָּתֵן֙ הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/015.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us[b]; this city will not be given into the hand of the king of Assyria.’
translation:
  language: zh_hans
  text: 也不要让希西家叫你们倚靠雅威，说：‘雅威必定会救我们[a]；这城不会交在亚述王手中[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“救，必救我们”，以同根词重复构成强调，意思是“必定会救我们”。
    reason: 说明原文的强调结构。
  - marker: b
    text: “交在……手中”也可译作“交到……的权下”。
    reason: 说明希伯来语“手”表示权势或控制的惯用含义。
lexical_decisions:
- source_word: וְאַל
  choice: 也不要
  rationale: 承接拉伯沙基前面的讲话，并以自然的现代汉语表达否定禁令。
- source_word: יַבְטַח אֶתְכֶם
  choice: 叫你们倚靠
  rationale: 保留בטח使役式的因果含义，即希西家使听众把信赖放在雅威身上；不译作“欺骗你们”，以免加入原动词没有明说的判断。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל יְהוָה
  choice: 倚靠雅威
  rationale: בטח与介词אֶל连用，在此表示把信赖寄托于雅威；“倚靠”自然且保留信赖、依赖的含义。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然引出希西家被转述的话。
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: 必定会救我们
  rationale: 以“必定”表达同一词根的不定式绝对形与限定动词连用所产生的强调语气；“救”适合军事威胁下的解救语境。
- source_word: לֹא תִנָּתֵן
  choice: 不会交在
  rationale: 表达נתן的被动式，同时配合汉语固定说法“交在……手中”；不额外加强为“绝不会”。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 简洁自然地表达带定冠词的名词与指示词组合。
- source_word: בְּיַד
  choice: 手中
  rationale: 保留希伯来语“在……手中”的权势意象，这一表达在现代汉语中也清楚自然。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 采用简洁、通行的中文国名与君王称谓。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现该名，而不是用“主”这一称号代替。
- issue: הַצֵּל יַצִּילֵנוּ的强调程度
  choice: 雅威必定会救我们
  alternative: 雅威会救我们
  rationale: 原文以不定式绝对形配合同根限定动词加强断言，因此用“必定”保留其明确的强调语气。
- issue: 拉伯沙基转述之言的叙事身份
  choice: 按原文直接保留引语，不评断其真伪
  alternative: 在正文中标明这是希西家的信仰宣告或拉伯沙基的歪曲
  rationale: 本节呈现的是拉伯沙基对希西家话语的转述；译文不应加入原文未明说的神学评价。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“叫你们倚靠”保留使役含义；引语清晰有力，但不使用文言句式。所有脚注标记均置于正文对应词句之后。
