base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/004.yaml
  text: 'Then the Rabshakeh said to them[a], “Please say to Hezekiah, ‘Thus says the great king[b], the king of Assyria: What is this confidence that you have trusted in?’”'
translation:
  language: zh_hans
  text: 拉伯沙基[a]对他们说：“请你们告诉希西家：‘大王、亚述王如此说：你所倚靠的这份信心[b]，究竟是什么？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉伯沙基”很可能是亚述官衔；可能指“御酒长”，也可能指另一种高级宫廷或军事官员。
    reason: cultural_note
  - marker: b
    text: 或译“这倚靠，你所倚靠的是什么？”希伯来语在这里使用同一词根的名词和动词，以加强反问语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 该词很可能是源自阿卡德语的亚述官衔，但具体职能仍有争议；采用音译可保留历史称号，避免武断译成某一特定官职。
- source_word: אִמְרוּ נָא
  choice: 请你们告诉
  rationale: 命令式加语气词נָא使口吻有所缓和；“请你们告诉”符合现代汉语表达。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留使者宣告公式的正式、庄重语气。
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: 大王
  rationale: “大王”简洁体现亚述君王的正式尊号及其夸耀色彩，也避免现代汉语中“伟大的王”略显生硬的表达。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 按希伯来语同位结构紧接“大王”，保留王号的重复和正式风格。
- source_word: הַבִּטָּחוֹן הַזֶּה
  choice: 这份把握
  rationale: 名词指信心、倚靠或自以为可靠的凭据；“把握”在此自然地表达被质问的自信。
- source_word: אֲשֶׁר בָּטָחְתָּ
  choice: 你所倚仗的
  rationale: 以“倚仗”传达בָּטַח所含依靠、信赖之意，并与“把握”共同构成自然的现代汉语反问。
