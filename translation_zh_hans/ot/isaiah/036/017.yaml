base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/017.yaml
  text: until I come and take you away to a land like your own land—a land of grain and new wine[b][a], a land of bread and vineyards.
translation:
  language: zh_hans
  text: 直到我来，把你们带走，带到一片像你们自己的土地一样的土地[a]，一片有五谷和新酒[b]、有饼和葡萄园的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把你们带到一片像你们自己的土地一样的土地。”希伯来语动词本身只表示“带、取”；正文的“带走”按语境点明迁离原地之意。
    reason: lexical_alternative
  - marker: b
    text: “新酒”所译的希伯来语 תירוש，通常有别于泛指酒的另一个常用词。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: 直到
  rationale: 表示时间界限，承接上文所要求的等候，译作“直到”自然准确。
- source_word: בֹּאִי
  choice: 我来
  rationale: בוא 的第一人称单数形式，直译为“我来”，不必强化为“我到达”。
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: 把你们带走
  rationale: לקח 本义是“取、带”；语境涉及迁移或掳去，译作“带走”既显明离开原地，又避免用“掳走”过度限定动词本身。
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: 领到一个像你们本地一样的地方
  rationale: 保留 אֶל 所表达的移向目的地，以及 כְּ 的比较意义；“本地”在现代汉语中自然表达他们自己的国土。
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: 一个盛产五谷和新酒的地方
  rationale: דגן 泛指谷物，译作“五谷”符合汉语农业语汇；תירוש 常指新酿的酒或新酒，并与一般的“酒”用词有所区别。“盛产”自然表达希伯来语“某物之地”的丰饶含义。
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: 饼和葡萄园的地方
  rationale: 保留 לחם 的具体意象“饼”，不泛化为“食物”；כרמים 译作“葡萄园”。与前一“地方”合并组织，以免中文重复累赘。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“地方”比反复使用“土地”更自然，同时仍保留 אֶרֶץ 在此所指的地域。“饼”保留原文具体的粮食制品意象；句式以“就是”引出对目的地丰饶的说明。
