base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/020.yaml
  text: Who among all the gods of these lands has delivered their land from my hand, that Yahweh should deliver Jerusalem from my hand?
translation:
  language: zh_hans
  text: 这些土地所有的神明中，有谁曾从我手中救出他们的土地呢？难道雅威能从我手中救出耶路撒冷吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת הָאֵלֶּה
  choice: 这些地方所有的神明中，有谁
  rationale: 以自然的现代汉语表达“在……之中谁”的反问结构；“神明”在此指列国所敬奉的诸神，也避免与独一真神的称谓混淆，但不替说话者预先作神学评断。
- source_word: הִצִּילוּ
  choice: 曾……救出
  rationale: 使役词干在此有搭救、解救之意；“曾”配合列举既往征服的语境，并保留反问的挑战意味。
- source_word: אַרְצָם
  choice: 自己的土地
  rationale: 希伯来语为第三人称阳性复数后缀，按分配关系指各神明所属之地；现代汉语用“自己的土地”比“他们的土地”更清楚自然。
- source_word: מִיָּדִי
  choice: 从我手中
  rationale: 保留原文具体的“手”这一权势与控制的隐喻，汉语中也通顺。
- source_word: כִּי יַצִּיל
  choice: 难道……能……救出吗
  rationale: 将连接词与未完成式置于嘲讽性的反问中整体表达；“能”突出亚述使者质疑其可能性，而非断言一个中性的未来事件。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉的神圣名字译写，明确其为专名而非称号。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用该地名的现代标准汉语惯用译名。
theological_decisions:
- issue: 如何处理亚述使者将耶和华与列国神明并列的亵慢言论
  choice: 按说话者的原有逻辑直译为两个连续反问，不添加纠正性说明
  alternative: 在正文中加入“他竟以为”等评断性措辞
  rationale: 本节是在引述敌方使者的嘲讽；译文应保留其亵慢与神学张力，不把说话者的观点改写成叙述者的认同，也不提前替后文作答。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对四字神名的汉语处理；正文采用普通现代中文读者最熟悉且庄重的传统专名“耶和华”，不以“主”替换原文的专名。
- issue: יַצִּיל 所表达的语气
  choice: 难道……能……吗
  alternative: ……将会……吗
  rationale: 上下文是带有嘲弄意味的可能性挑战。“能”较好地保留说话者对耶和华拯救能力的质疑，同时不把未完成式仅限于单纯将来。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事引语风格。“这些地方”承接列国疆土的语境；两个问句比照原文的论证层次，第二句以“难道”显出嘲讽反问。无脚注，因此正文不设脚注标记。
