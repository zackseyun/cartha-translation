base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/007.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall bow down before this altar’?”
translation:
  language: zh_hans
  text: 但如果你对我说：‘我们倚靠耶和华我们的上帝’，难道他不就是那位希西家拆除了他的丘坛和祭坛，又对犹大和耶路撒冷说：‘你们要在这座祭坛前敬拜。’的神吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּטַחְנוּ
  choice: 我们倚靠
  rationale: 表达希伯来语完成式在引语中所陈明的信赖状态；“倚靠”自然且保留宗教语境中的信靠含义。
- source_word: בָּמוֹתָיו
  choice: 其丘坛
  rationale: במות 指设于高处或地方性敬拜场所的祭祀设施；“丘坛”比泛称“高处”更明确地传达其宗教功能，同时不预断这些设施在说话者眼中的合法性。
- source_word: מִזְבְּחֹתָיו
  choice: 祭坛
  rationale: 对应献祭用的坛，与后文单数“这座祭坛”形成原文的对照。
- source_word: תִּשְׁתַּחֲווּ
  choice: 敬拜
  rationale: 该词字面涉及俯伏，但在祭坛前的语境中表达敬拜行为；“敬拜”在现代汉语中自然且准确。
- source_word: לִפְנֵי הַמִּזְבֵּחַ הַזֶּה
  choice: 在这座祭坛前
  rationale: 保留介词“在……前”及指示语“这座”，不将其改释为仅仅“在这坛献祭”。
theological_decisions:
- issue: 拉伯沙基把丘坛和祭坛归属于耶和华，从而误解或歪曲希西家的宗教改革
  choice: 按说话者的反问原样保留“其丘坛和祭坛”，不加正文纠正
  alternative: 译成带贬义的“你们的丘坛”或在正文说明这些丘坛并非耶和华认可
  rationale: 原文刻意呈现亚述使者的论证及其神学误判；译文应保留这一叙事张力，不替说话者纠错。
- issue: יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: “耶和华”是现代简体中文圣经语域中最广为普通读者识别的专名形式，并能与后面的“我们的上帝”自然衔接。
- issue: “他”所指对象可能因中文代词而略显不清
  choice: 译为“他不就是那位……的神吗”以明确所指为耶和华
  alternative: 直译“他不就是希西家拆除其丘坛和祭坛的那一位吗”
  rationale: 希伯来语阳性代词的先行词清楚是耶和华；补出“神”是汉语所需的轻度显化，不改变论证。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保持使者带有讥讽意味的反问。引语层次清楚；“丘坛”保留古代近东敬拜场所的具体性。未添加原文没有的解释性脚注。
