base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/011.yaml
  text: Then Eliakim[a], Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it[b]. And do not speak to us in Judean in the hearing of the people who are on the wall.”
translation:
  language: zh_hans
  text: 于是，以利亚敬、舍伯那和约亚对拉伯沙基说：“请用亚兰语同你的仆人说话，因为我们听得懂。不要用犹大语[a]同我们说话，免得城墙上的百姓听见。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“希伯来语”。原文 יְהוּדִית 更具体地指犹大人所说的语言。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 这是源自阿卡德语的亚述官衔，具体职掌并不确定；采用传统音译可避免武断地译成某一特定官职。
- source_word: דַּבֶּר נָא
  choice: 请……说话
  rationale: 祈使式加语气词 נָא 表达礼貌请求；“请”自然保留了恭敬语气。
- source_word: עֲבָדֶיךָ
  choice: 仆人们
  rationale: 这是外交场合中的谦称，既保留自谦意味，又不误导为实际奴隶身份。
- source_word: אֲרָמִית
  choice: 亚兰语
  rationale: 该词明确指亚兰人的语言；现代汉语以“用亚兰语说话”最自然。
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: 因为我们听得懂
  rationale: שׁמע 本义为“听”，在语言语境中表示“听懂、理解”；此译兼顾听觉意象与实际含义。
- source_word: יְהוּדִית
  choice: 犹大语
  rationale: 该词具体指犹大人所用的语言，并非现代语言学意义上笼统的“希伯来语”；“犹大语”保留其地域和族群指向。
- source_word: בְּאָזְנֵי
  choice: 免得……听见
  rationale: 希伯来语习语直义为“在……耳中”；结合否定请求，用目的式表达能自然传达不要让城墙上的百姓听到的意思。
- source_word: הָעָם אֲשֶׁר עַל הַחוֹמָה
  choice: 城墙上的百姓
  rationale: הָעָם 是“百姓、民众”，原文没有将其限定为军队；简洁保留这一宽泛称谓。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名依常见中文圣经音译；官衔“拉伯沙基”保留音译以避免过度确定其职掌。礼貌请求和外交自谦均在中文中明确表达。
