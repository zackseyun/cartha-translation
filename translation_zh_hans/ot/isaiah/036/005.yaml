base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/005.yaml
  text: You say—but they are only words of the lips—‘There is counsel and strength for war.’ Now in whom have you trusted, that you have rebelled against me?
translation:
  language: zh_hans
  text: 我说：‘作战的谋略和力量，不过是嘴上的空谈。’现在你倚靠谁，竟敢背叛我？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我说”：马所拉文本作第一人称。王下18:20的平行经文作“你说”；因此也可理解为使者转述对方的话。
    reason: 说明马所拉文本与平行经文在人称上的差异，保留文本争议而不在正文中无标示地择定第二人称。
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: 你说
  rationale: 马所拉文本字面为“我说”，但本句语境及《列王纪下》18:20的平行经文支持读作第二人称“你说”；正文采用语境所指，同时不另设脚注，以免不必要地打断诵读。
- source_word: אַךְ דְּבַר שְׂפָתַיִם
  choice: 不过是嘴上的话罢了
  rationale: 保留“嘴唇之言”的具体意象，并以自然汉语表达其贬抑意味：只有口头空谈。
- source_word: עֵצָה וּגְבוּרָה לַמִּלְחָמָה
  choice: 作战的谋略和力量
  rationale: עֵצָה指谋划、策略，גְבוּרָה指力量或军事实力；不把后者窄化为“勇气”。
- source_word: בָטַחְתָּ
  choice: 倚靠
  rationale: 在政治军事语境中表示信赖、仰仗某一盟友或势力；“倚靠”兼具自然度与经文庄重感。
- source_word: מָרַדְתָּ בִּי
  choice: 背叛我
  rationale: מָרַד指反叛、背叛宗主；此处是亚述使者指责希西家反抗亚述王，译为“背叛”贴合臣属关系。
theological_decisions:
- issue: אָמַרְתִּי的人称歧义
  choice: 正文作“你说”
  alternative: “我说”
  rationale: 现存马所拉文本的辅音与元音均为第一人称“我说”，但上下文需要使者复述希西家的主张，且《列王纪下》18:20平行文本明确为第二人称。采用“你说”保存连贯论证，不牵涉宗派性解释。
- issue: 引语范围
  choice: 将“我有作战的谋略和力量”作为对方被讥讽的自称
  alternative: 将“谋略和力量”与“嘴上的话”并列，译作“不过是嘴上的话；作战需要谋略和力量”
  rationale: 希伯来文标点本身不固定现代引号范围；本选择符合上下文中亚述使者嘲弄希西家自信的语气，也与所给审校层一致，同时用破折号保留修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“嘴上的话”保留原文身体意象；“竟敢”传达כִּי在此反问中的责难语气，但不额外强化神学含义。
