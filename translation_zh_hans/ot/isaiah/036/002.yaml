base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/002.yaml
  text: Then the king of Assyria sent the Rabshakeh from Lachish to Jerusalem, to King Hezekiah, with a heavy force. And he stood by the conduit of the upper pool, on the highway to the launderer’s field.
translation:
  language: zh_hans
  text: 亚述王从拉吉派拉伯沙基率领大军到耶路撒冷去见希西家王。他站在上池的水渠旁、通往漂布匠田地的大路上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 这是亚述宫廷官衔，具体职能及其在此处是否已用作称号不完全确定；采用传统音译，避免武断译为“酒政”或特定军职。
- source_word: בְּחֵיל כָּבֵד
  choice: 率领一支强大的军队
  rationale: חַיִל 在军事语境中指军队或兵力，כָּבֵד 表示分量大、势力强；译文自然表达其兵力强盛，不机械直译为“沉重的军力”。
- source_word: בִּתְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: 在上池的水渠旁
  rationale: תְּעָלָה 指导水渠、沟渠；介词结构在此表示所在位置。
- source_word: בִּמְסִלַּת שְׂדֵה כוֹבֵס
  choice: 在通往漂布匠田地的大路上
  rationale: מְסִלָּה 指修筑的道路或大路；כּוֹבֵס 指洗涤、漂洗衣物或布料的人。“通往”符合地点短语的自然汉语表达，同时不把田地所有关系规定得过死。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“拉伯沙基”保留官衔的历史陌生感；地名与王名依通行中文圣经译名。将连续两个希伯来叙事动词自然处理为两句。
