base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/021.yaml
  text: But they kept silent and did not answer him a word[a], for the king’s command was, saying, “Do not answer him.”
translation:
  language: zh_hans
  text: 他们却默不作声，一句话也不回答他[a]，因为王的命令是：“不要回答他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“不回答他一句话”，意思是完全不作回应。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִישׁוּ
  choice: 众人却默不作声
  rationale: 该动词在此表示有意保持沉默；“默不作声”自然传达他们遵命克制、不予回应。连接词按语境译作“却”，突出他们面对喊话仍然沉默。
- source_word: וְלֹא עָנוּ אֹתוֹ דָּבָר
  choice: 一句话也不回答他
  rationale: 保留希伯来语“话”这一成分及其强调语气，同时符合现代汉语习惯，表示完全没有回应。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出众人沉默不答的原因。
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: 王曾吩咐
  rationale: מִצְוָה在这里指君王所下的命令；用动词式表达比“王的命令是”更符合自然现代汉语，而“曾”表明命令先于当前反应。
- source_word: הִיא לֵאמֹר
  choice: 说
  rationale: 该结构用于引出命令的具体内容；汉语以“吩咐说”自然承接直接引语。
- source_word: לֹא תַעֲנֻהוּ
  choice: 不要回答他
  rationale: 准确表达对复数听众所下的禁止性命令；现代汉语无需显明复数即可保留原意。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众人”补明复数主语，但不另行指定其身份；保留“一句话也不回答他”的源语强调，并以脚注解释其习语含义。
