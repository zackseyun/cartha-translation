  text: הֵ֛ן עֵ֥ד לְאוּמִּ֖ים נְתַתִּ֑י/ו נָגִ֥יד וּ/מְצַוֵּ֖ה לְאֻמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/004.yaml
  text: Behold[a], I have made him a witness to the peoples[c][b], a leader and commander for the peoples.
translation:
  language: zh_hans
  text: 看哪，我已立他作万民的见证人[a]，作万民的领袖和发号施令者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我已立他作万民的见证人”也可译作“我已将他赐给万民作见证人”。
    reason: 保留 נְתַתִּיו 较字面的“赐下”含义，以及介词关系的另一种自然表达。
  - marker: b
    text: “发号施令者”也可译作“统领者”或“发令者”。这里的“他”可能指大卫或大卫王系的代表；有些读者将其理解为弥赛亚。
    reason: 说明分词 מְצַוֵּה 的译法范围，并保留代词所指的解释空间。
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引起注意并加强语气的话语标记；“看哪”保留先知宣告的庄重力度，也符合现代中文圣经语体。
- source_word: עֵד
  choice: 见证
  rationale: 此处指承担作证职分的人，而非抽象的“证言”；中文“作……的见证”既能表达人的角色，也保留原文较宽的含义。
- source_word: לְאוּמִּים
  choice: 万民
  rationale: 该复数名词可指诸民族、列国或众民；“万民”自然、庄重，并保留复数群体的广泛范围。
- source_word: נְתַתִּיו
  choice: 我已立他作
  rationale: 字面是“我已赐下他”，但与后续身份名词连用时，中文用“立他作”更自然，并准确表达上帝赋予其职分；“已”体现完成体及其当前效力。
- source_word: נָגִיד
  choice: 领袖
  rationale: 该词指被设立在众人之上的领导者；“领袖”比“王子”少了一层原文未必要求的世袭意味，也不像“统治者”那样突出强制权力。
- source_word: וּמְצַוֵּה
  choice: 和发令者
  rationale: 这是源自动词“吩咐、命令”的分词，指发出命令的人；“发令者”保留主动施令的含义，同时避免“司令”所带的现代军事职衔色彩。
theological_decisions:
- issue: 阳性单数宾语后缀“他”的所指
  choice: 正文保留“他”，不明确指定其身份。
  alternative: 可理解为大卫、大卫王系的代表或弥赛亚；也有人提出人格化的以色列。
  rationale: 上文第3节提到赐给大卫的可靠慈爱，因此此处很可能指大卫或其王系代表；但希伯来文本只使用代词，译文不应把某一种神学解释写入正文。
- issue: 见证、领袖和发令者所面对群体的关系
  choice: 两处均译为“万民的”，保留原文重复和角色关系的开放性。
  alternative: 第二处可译“给万民的”或“管理万民的”。
  rationale: 介词לְ可表达对象、关系或受益关系；译为“万民的”可避免把领导关系过度限定为统治，同时维持希伯来文的平行结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知性强调；“万民”比“各民族”更凝练，也符合诗体平行。避免使用“王子”“司令”等可能过度限定政治或军事身份的词。
