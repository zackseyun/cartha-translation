  text: הַטּ֤וּ אָזְנְ/כֶם֙ וּ/לְכ֣וּ אֵלַ֔/י שִׁמְע֖וּ וּ/תְחִ֣י נַפְשְׁ/כֶ֑ם וְ/אֶכְרְתָ֤ה לָ/כֶם֙ בְּרִ֣ית עוֹלָ֔ם חַֽסְדֵ֥י דָוִ֖ד הַ/נֶּאֱמָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/003.yaml
  text: Incline your ear and come to me; hear[a], and your soul shall live; and I will make with you an everlasting covenant—the faithful covenant love promised to David.
translation:
  language: zh_hans
  text: 你们要侧耳，到我这里来；要听，你们就必得以存活。我必与你们立永远的约，就是应许给大卫的可靠慈爱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给大卫那确实的恩惠”，也可较直译为“大卫可靠的慈爱”。“慈爱”所译的希伯来语可指盟约中的忠爱、恩惠或怜悯；原文也没有明确说明“大卫”与这些“慈爱／恩惠”之间的具体关系。
    reason: 保留חסד的宽广语义，以及חַסְדֵי דָוִד这一属格结构的真实歧义。
lexical_decisions:
- source_word: הַטּוּ אָזְנְכֶם
  choice: 你们要侧耳
  rationale: 保留“使耳朵倾斜”的希伯来语意象，同时在现代汉语中自然表达专心聆听。
- source_word: וּלְכוּ אֵלַי
  choice: 到我这里来
  rationale: 从说话者的角度，הלך与אֶל连用在邀请语境中自然译为“到我这里来”。
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 保留שמע兼具聆听和接受回应的意味，不直接增译为“顺从”。
- source_word: וּתְחִי נַפְשְׁכֶם
  choice: 你们就必得以存活
  rationale: נפש在此指人的生命或整个人；汉语用“你们……存活”比直译“你们的灵魂存活”更自然，也避免把词义缩窄为非物质灵魂。连接词译作“就”，体现命令之后的结果或应许。
- source_word: וְאֶכְרְתָה לָכֶם בְּרִית
  choice: 我必与你们立……约
  rationale: כרת ברית是“立约”的固定表达；“与你们立约”准确而自然。
- source_word: בְּרִית עוֹלָם
  choice: 永远的约
  rationale: 在盟约语境中，עוֹלָם自然译为“永远的”。
- source_word: חַסְדֵי דָוִד הַנֶּאֱמָנִים
  choice: 应许给大卫那可靠的慈爱
  rationale: חסד在此兼有慈爱、恩惠和盟约忠诚之意；הנאמנים表明确实、可靠。正文采用通顺的关系性理解，同时用脚注保留希伯来语属格和复数表达的歧义。
theological_decisions:
- issue: “大卫的可靠慈爱”与永约的关系
  choice: 将其理解为上帝应许给大卫、如今在永约中赐给听众的可靠盟约恩惠
  alternative: 大卫所行的忠诚之举；或较直译为“大卫可靠的慈爱／恩惠”
  rationale: 上下文由上帝作主语，宣告要与听众立约，因此更可能指与大卫相关、由上帝保证的盟约慈爱或恩惠；脚注保留原短语可能有的其他表达，避免把后续神学结论写入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“侧耳”“立约”保留经文意象和盟约语域；避免使用较古奥的“灵魂必活”，以“你们就必得以存活”表达נפש所涵盖的生命与整个人。
