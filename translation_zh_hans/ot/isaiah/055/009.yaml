  text: כִּֽי גָבְה֥וּ שָׁמַ֖יִם מֵ/אָ֑רֶץ כֵּ֣ן גָּבְה֤וּ דְרָכַ/י֙ מִ/דַּרְכֵי/כֶ֔ם וּ/מַחְשְׁבֹתַ֖/י מִ/מַּחְשְׁבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/009.yaml
  text: For as the heavens are higher than the earth[a], so my ways are higher than your ways[b], and my thoughts than your thoughts.
translation:
  language: zh_hans
  text: 天怎样高过地[a]，我的道路也照样高过你们的道路；我的意念也高过你们的意念[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天”也可译作“天空”或“诸天”；希伯来文 שָׁמַיִם 在形式上是复数。
    reason: lexical_alternative
  - marker: b
    text: “意念”在这里也可指“计划”或“意图”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 省译为比喻句式中的“怎样……也照样……”
  rationale: 此处承接上文并引出解释。在中文单节中，以“怎样……也照样……”自然表达希伯来文 כִּי…כֵּן 的说明和类比关系，避免生硬地加“因为”。
- source_word: גָבְהוּ
  choice: 高过
  rationale: 完成式在此表达状态，且 מִן 引出比较对象；“高过”准确呈现比较意义，并维持诗句的意象。
- source_word: שָׁמַיִם
  choice: 天
  rationale: 该词虽为复数形式，但现代汉语通常以“天”表达天空、诸天这一概念，既自然又保留庄重语体。
- source_word: מֵאָרֶץ
  choice: 过地
  rationale: מִן 在此为比较用法；与“高”组成“高过地”，清楚表达天与地的高度对比。
- source_word: כֵּן
  choice: 也照样
  rationale: 明确标示前后类比关系，符合现代汉语“怎样……也照样……”的自然结构。
- source_word: דְרָכַי
  choice: 我的道路
  rationale: 保留 דֶּרֶךְ 的道路隐喻，不窄化为“行事方式”，并与下文“你们的道路”严格对应。
- source_word: מִדַּרְכֵיכֶם
  choice: 高过你们的道路
  rationale: 比较介词 מִן 依上下文补足“高过”，保持诗歌平行结构。
- source_word: וּמַחְשְׁבֹתַי
  choice: 我的意念
  rationale: מַחֲשָׁבוֹת 可指思想、计划或意图；“意念”在庄重而现代的中文中保留其概念宽度，也与上文及本句的人神对照相称。
- source_word: מִמַּחְשְׁבֹתֵיכֶם
  choice: 高过你们的意念
  rationale: 按比较用法译出“高过”，并重复“意念”以保持词汇对应和诗行平衡。
theological_decisions:
- issue: 上帝与人的行动及认知之间的拟人化比较
  choice: 保留“我的道路”和“我的意念”的直接隐喻
  alternative: 译为“我的行事方式”和“我的计划”
  rationale: 原文以高度差异比拟上帝与人在道路和意念上的差异。直译这些隐喻可保留上帝超越性与人类局限之间的诗性张力，避免把含义限定为行为方式或预定计划。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。以“怎样……也照样……”承载希伯来诗句的类比结构；用分号显出“道路”与“意念”两组平行成分。所有脚注标记均置于正文相应词语之后。
