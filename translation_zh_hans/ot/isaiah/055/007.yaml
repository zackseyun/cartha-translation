id: ISA.55.7
reference: Isaiah 55:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַעֲזֹ֤ב רָשָׁע֙ דַּרְכּ֔/וֹ וְ/אִ֥ישׁ אָ֖וֶן מַחְשְׁבֹתָ֑י/ו וְ/יָשֹׁ֤ב אֶל יְהוָה֙ וִֽ/ירַחֲמֵ֔/הוּ וְ/אֶל אֱלֹהֵ֖י/נוּ כִּֽי יַרְבֶּ֥ה לִ/סְלֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/007.yaml
  text: Let the wicked man forsake his way[a], and the man of iniquity his thoughts; let him return to Yahweh, and he will have compassion on him, and to our God[e][d][c][b], for he will abundantly pardon.
translation:
  language: zh_hans
  text: 恶人当离弃自己的道路[a]，作恶的人当离弃自己的意念；他当归向耶和华，耶和华必怜悯他；他也当归向我们的上帝，因为上帝必丰丰富富地赦免[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “道路”指一个人的生活方向和行事方式。
    reason: 说明原文保留的希伯来语隐喻。
  - marker: b
    text: “丰丰富富地赦免”也可译作“慷慨赦免”。
    reason: 呈现 כִּי יַרְבֶּה לִסְלוֹחַ 所表达的丰盛赦免之意及可行译法。
lexical_decisions:
- source_word: יַעֲזֹב
  choice: 离弃
  rationale: 此处未完成式带劝勉语气；“离弃”既自然，也保留主动决绝地抛弃罪恶生活的道德意味。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 名词性单数形式，指作为代表的邪恶之人；“恶人”是现代汉语中简洁、庄重且准确的对应。
- source_word: דַּרְכּוֹ
  choice: 自己的道路
  rationale: 保留“道路”这一表示生活方向和行为方式的希伯来语隐喻，不将其窄化为单纯的行为。
- source_word: אִישׁ אָוֶן
  choice: 作恶的人
  rationale: אָוֶן 在此指罪恶、邪恶；“作恶的人”符合现代汉语，又与前句“恶人”形成平行而不显生硬。
- source_word: מַחְשְׁבֹתָיו
  choice: 自己的意念
  rationale: 该词可指思想、意图或谋划；“意念”兼顾内在思想与意图，并与外在的“道路”构成对照。
- source_word: וְיָשֹׁב
  choice: 当归向
  rationale: שׁוּב 的基本图像是转回、返回；“归向”保留朝向上帝的关系性运动，而不直接以术语“悔改”取代原文图像。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不以称号“主”替代。
- source_word: וִירַחֲמֵהוּ
  choice: 耶和华就必怜悯他
  rationale: רחם 表达怜悯与慈悲；补出主语“耶和华”可避免汉语歧义，“就必”呈现劝勉之后所应许的结果。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 保留第一人称复数所属关系，体现先知与群体共同的信仰告白。
- source_word: כִּי יַרְבֶּה לִסְלוֹחַ
  choice: 因为他必广行赦免
  rationale: רבה 加不定式表达赦免的丰盛、充足；“广行赦免”是庄重而可懂的现代汉语，保留加强语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文明确使用四字神名，正文采用中文传统且广为人知的专名“耶和华”，避免用称号“主”遮蔽专名；“雅威”是可能的音译替代。
- issue: שׁוּב 是否直接译作“悔改”
  choice: 归向
  alternative: 转回；悔改
  rationale: 上下文以离弃恶道和意念具体呈现悔改，但动词本身保有“返回、转向”的关系性图像；“归向”避免将其窄化为后来的神学术语。
- issue: 两个介词短语的平行结构
  choice: “归向耶和华……；当归向我们的上帝……”
  alternative: 将“归向我们的上帝”紧接在怜悯分句之后
  rationale: 原文“归向耶和华”与“归向我们的上帝”彼此平行，各自连于怜悯和赦免；中文重复“当归向”可清楚呈现这一结构。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。句式保留希伯来诗体的平行结构；以“恶人／作恶的人”“道路／意念”“耶和华／我们的上帝”“怜悯／赦免”形成对应。
