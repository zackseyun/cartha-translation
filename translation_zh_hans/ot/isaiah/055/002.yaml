source:
  edition: WLC
  text: לָ֤/מָּה תִשְׁקְלוּ כֶ֨סֶף֙ בְּֽ/לוֹא לֶ֔חֶם וִ/יגִיעֲ/כֶ֖ם בְּ/ל֣וֹא לְ/שָׂבְעָ֑ה שִׁמְע֨וּ שָׁמ֤וֹעַ אֵלַ/י֙ וְ/אִכְלוּ ט֔וֹב וְ/תִתְעַנַּ֥ג בַּ/דֶּ֖שֶׁן נַפְשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/002.yaml
  text: Why do you weigh out silver for what is not bread[a], and your labor for what does not satisfy? Listen carefully to me, and eat what is good[c][b], and let your soul delight itself in richness.
translation:
  language: zh_hans
  text: 为什么为那不是食物的称出银子[a]，又为什么为那不能使人饱足的耗费你们的劳力？你们务要听我[b]，吃美好的食物；愿你们的心以丰美为乐[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为什么把钱花在不是食物的东西上”；希伯来文直译为“称出银子”，反映古代按重量支付银子的做法。
    reason: lexical_alternative
  - marker: b
    text: 也可直译“听啊，要听我”；希伯来文以同一词根的两个形式连用，加强命令的语气。
    reason: lexical_alternative
  - marker: c
    text: “丰美”也可译作“肥甘”或“丰盛”；“你们的心”也可译作“你们自己”或“你们的生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁקְלוּ כֶסֶף
  choice: 称出银子
  rationale: שׁקל在此保留按重量支付的古代交易图景，כֶּסֶף取其本义“银子”；正文保留具体意象，脚注说明其惯用含义。
- source_word: בְּלוֹא לֶחֶם
  choice: 为那不是食物的
  rationale: לֶחֶם可指饼、食物或粮食；此处译作“食物”较符合现代汉语，同时不把比喻明确解释为某种属灵事物。
- source_word: וִיגִיעֲכֶם
  choice: 耗费你们的劳力
  rationale: יְגִיעַ可指劳碌，也可指劳碌所得；“劳力”保留付出辛劳这一基本意义，并与前句的金钱支出形成平行。
- source_word: בְּלוֹא לְשָׂבְעָה
  choice: 为那不能使人饱足的
  rationale: שָׂבְעָה表示饱足、满足；采用动词性表达，使否定关系在现代汉语中清楚自然。
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: 务要听我
  rationale: 命令式与绝对不定式并用以加强语气；“务要”传达强调，又避免汉语中生硬的重复。
- source_word: וְאִכְלוּ טוֹב
  choice: 吃美物
  rationale: טוֹב在这里名词化，指美好之物；“美物”简洁保留其美好、可享用的宽广含义。
- source_word: וְתִתְעַנַּג
  choice: 使……以……为乐
  rationale: Hitpael词干表达享受、以某物为乐；按照后置主语נַפְשְׁכֶם处理为“你们的心”所经历的喜乐。
- source_word: בַּדֶּשֶׁן
  choice: 以丰美
  rationale: דֶּשֶׁן本指肥美、丰腴，并可延伸为丰富佳美之物；“丰美”既保留饮食意象，又避免现代汉语中“肥胖”的误导联想。
- source_word: נַפְשְׁכֶם
  choice: 你们的心
  rationale: נֶפֶשׁ可指生命、自身或内在的人；在现代汉语诗性语境中，“心”自然表达全人的内在享受，而不强行限定为后期的身灵二分概念。
theological_decisions:
- issue: 食物与饱足的比喻性语言
  choice: 保留“食物、饱足、吃、丰美”等具体饮食意象。
  alternative: 直接释为属灵的滋养或救恩的满足。
  rationale: 希伯来文本以具体饮食图景发出上帝的邀请，并未在本节明说其所指；正文不提前消解这一比喻和神学张力。
- issue: נֶפֶשׁ所指的范围
  choice: 译作“你们的心”，表达人的内在与全人感受。
  alternative: 译作“你们的灵魂”或“你们自己”。
  rationale: “灵魂”可能引入过强的身灵二分含义，“自己”则削弱诗歌的内在感；“心”在现代普通话中较自然，但脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留原文的诗歌平行结构和饮食意象。“务要”略带庄重色彩，但在现代宗教及正式语境中仍自然；避免将本节直接属灵化或加入特定宗派解释。
