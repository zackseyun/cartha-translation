  text: כִּֽי בְ/שִׂמְחָ֣ה תֵצֵ֔אוּ וּ/בְ/שָׁל֖וֹם תּֽוּבָל֑וּ/ן הֶ/הָרִ֣ים וְ/הַ/גְּבָע֗וֹת יִפְצְח֤וּ לִ/פְנֵי/כֶם֙ רִנָּ֔ה וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה יִמְחֲאוּ כָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/012.yaml
  text: For you will go out with joy and be led in peace[a]; the mountains and the hills will break out in singing before you[b], and all the trees of the field will clap their hands.
translation:
  language: zh_hans
  text: 因为你们必欢欢喜喜地出去，在平安中被引领[a]；群山和山冈必在你们面前迸发欢歌[b]，田野中的一切树木也必拍掌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“平平安安地被引领”。原文动词意为“被带领、被引导”，没有再次明说“出去”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在你们面前欢呼歌唱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的邀请与应许，表达理由或结果；“因为”自然保留连接作用。
- source_word: בְשִׂמְחָה
  choice: 欢欢喜喜地
  rationale: 表达伴随出去的喜乐状态；叠词符合现代汉语诗歌语感，并保留原文的喜悦力度。
- source_word: תֵצֵאוּ
  choice: 你们必……出去
  rationale: 准确反映第二人称复数未完成式及其在应许语境中的将来意义，也保留出离与归回的意象。
- source_word: וּבְשָׁלוֹם
  choice: 平平安安地
  rationale: 既自然表达平安中的行动，也保留 שָׁלוֹם 所含平安、安稳与完好之意，而不作过度展开。
- source_word: תּוּבָלוּן
  choice: 蒙引领
  rationale: 该词为 יבל 的使役被动式，意为“被带领、被引导”；“蒙引领”保留被动意义及庄重语体，不擅自补出原文未重复的“出去”。
- source_word: הֶהָרִים וְהַגְּבָעוֹת
  choice: 大山小山
  rationale: 以自然凝练的汉语表达山与丘陵的成对意象，同时保持诗歌节奏。
- source_word: יִפְצְחוּ ... רִנָּה
  choice: 欢呼歌唱
  rationale: 该组合表示突然迸发出欢呼或歌声；此译兼顾 רִנָּה 的欢呼与歌唱含义，并保持诗意。
- source_word: לִפְנֵיכֶם
  choice: 在你们面前
  rationale: 贴近原文空间表达，同时可自然理解为归回者沿途所见的受造界响应。
- source_word: וְכָל עֲצֵי הַשָּׂדֶה
  choice: 田野所有的树木
  rationale: 保留“田野”及树木整体参与的自然景象。
- source_word: יִמְחֲאוּ כָף
  choice: 拍掌
  rationale: 准确传达希伯来语拍手的习语，并保留树木拟人化的鲜明意象。
theological_decisions:
- issue: 复兴图景中受造界的诗性拟人
  choice: 保留大山、小山欢呼歌唱和树木拍掌的拟人描写
  alternative: 将其淡化为自然景色优美或环境喜庆
  rationale: 原文有意把受造界写成与归回群体一同欢庆的参与者；保留拟人手法才能呈现诗歌中的普遍复兴图景，同时不额外引入特定教义解释。
- issue: תּוּבָלוּן 的施动者未明说
  choice: 采用“蒙引领”，不补明是谁引领
  alternative: 译作“上帝必引领你们”或“你们将被领出去”
  rationale: 希伯来文本使用被动式且未明确施动者；中文保留被动与含蓄性，既容许神圣被动的理解，也不把解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留希伯来诗歌的平行结构、将来应许语气和受造界拟人意象。“欢欢喜喜地／平平安安地”形成节奏对应；“大山小山”凝练自然。“蒙引领”略带经文庄重色彩，但仍为现代读者可理解，并有助于保留原文的被动式与施动者含蓄性。
