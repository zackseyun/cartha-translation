  text: תַּ֤חַת הַֽ/נַּעֲצוּץ֙ יַעֲלֶ֣ה בְר֔וֹשׁ תחת הַ/סִּרְפַּ֖ד יַעֲלֶ֣ה הֲדַ֑ס וְ/הָיָ֤ה לַֽ/יהוָה֙ לְ/שֵׁ֔ם לְ/א֥וֹת עוֹלָ֖ם לֹ֥א יִכָּרֵֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/013.yaml
  text: Instead of the thornbush[a], the cypress will come up; instead of the brier, the myrtle will come up. And it will be for Yahweh a name[c][b], an everlasting sign that will not be cut off.
translation:
  language: zh_hans
  text: 荆棘将被柏树[a]取代；刺灌木[b]将被桃金娘取代。这要为雅威带来名声，成为永远的记号，永不被剪除。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柏树”所译的希伯来词具体指哪一种树并不确定，也可译作“杉树”等常青树。
    reason: lexical_alternative
  - marker: b
    text: “刺灌木”所译的希伯来词具体指哪一种植物并不确定，也可能指“荨麻”或其他有刺的野生植物。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: 被……取代
  rationale: 此处表示替代而非空间上的“在……下面”；这一表达自然呈现有害植物被佳木取代的平行对比。
- source_word: הַנַּעֲצוּץ
  choice: 荆棘
  rationale: 原词泛指带刺的有害植物，具体种类不明；“荆棘”既自然，也不作过度精确的植物学认定。
- source_word: בְרוֹשׁ
  choice: 柏树
  rationale: 具体树种有争议；“柏树”是通行且易懂的对应词，并能传达高大常青佳木的意象，另以脚注保留其他可能。
- source_word: הַסִּרְפַּד
  choice: 蒺藜
  rationale: 原词所指植物不能确定；“蒺藜”能表达有刺、令人厌恶的野生植物，并与“荆棘”构成诗意平行，脚注保留其他解释。
- source_word: הֲדַס
  choice: 桃金娘
  rationale: 这是该词公认且较为准确的现代汉语植物名称。
- source_word: וְהָיָה
  choice: 这要
  rationale: 单数动词很可能总括前述整项更新景象；“这”让所指清楚，同时不过度限定是某一棵树。
- source_word: לַיהוָה לְשֵׁם
  choice: 为雅威带来名声
  rationale: לְשֵׁם直译为“作为一个名”，在此是名声、声誉或纪念的习语；正文采用自然汉语，脚注说明原文形式。
- source_word: לְאוֹת עוֹלָם
  choice: 成为永远的记号
  rationale: 保留אוֹת的公开标志意义及עוֹלָם的持久含义。
- source_word: לֹא יִכָּרֵת
  choice: 永不被剪除
  rationale: 保留כרת“砍下、剪除”的具体意象，也让结句与全节植物图景相呼应，而不弱化为泛泛的“不会消失”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常重构的读音，并使其作为专名呈现，不以称号替代。
- issue: “这”所指的范围
  choice: 总括荆棘和蒺藜被佳木取代的更新景象
  alternative: 仅指紧邻的桃金娘，或指某一棵树
  rationale: וְהָיָה虽为阳性单数，但上下文最自然地把它理解为对前述转变整体的概括；译文不将“永远的记号”局限于单一植物。
- issue: “永不被剪除”的修饰对象
  choice: 永远的记号
  alternative: 雅威的名声
  rationale: 希伯来语中关系表达紧接“永远的记号”，语法上最自然地修饰记号；同时保留“剪除”与植物意象之间可能存在的诗性张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两组“被……取代”保留希伯来诗句的平行结构；“永不被剪除”有意保留原文略显突出的砍剪意象及其与植物主题的呼应。所有植物学上不能确定的词均避免在正文中过度说明，并以脚注呈现主要备选。
