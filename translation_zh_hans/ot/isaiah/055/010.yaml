base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/010.yaml
  text: For just as the rain and the snow come down from heaven and do not return there unless they have watered the earth[a], made it bear fruit, and made it sprout, and have given seed to the sower and bread to the eater[b],
translation:
  language: zh_hans
  text: 正如雨雪从天[a]而降，并不返回那里，直到滋润大地，使地出产，又使它萌芽，并把种子给撒种的人，把饼给吃的人[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天”的希伯来语形式上是复数，也可译作“诸天”或“天空”。
    reason: lexical_alternative
  - marker: b
    text: “饼”也可译作“粮食”或“食物”。这里的希伯来语 לֶחֶם 可特指饼，也可泛指供人食用的粮食。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: 怎样
  rationale: 本节开启一个延续到下一节的比较句。汉语以“怎样……也照样”自然表达比较关系；解释性的 כִּי 在上下文中由整句逻辑体现，不生硬另译为“因为”。
- source_word: יֵרֵד הַגֶּשֶׁם וְהַשֶּׁלֶג
  choice: 雨雪……从天而降
  rationale: “而降”保留 ירד 的方向含义，并以“雨雪”简洁自然地表达并列主语。
- source_word: מִן הַשָּׁמַיִם
  choice: 从天
  rationale: שָׁמַיִם 形式上为复数，但此处指雨雪降下的天空；“从天”在现代汉语中自然、庄重，也不额外限定其宇宙论含义。
- source_word: וְשָׁמָּה לֹא יָשׁוּב
  choice: 不再返回那里
  rationale: 明确译出 שָׁמָּה“那里”，并保留“返回”的空间方向。
- source_word: כִּי אִם
  choice: 除非先
  rationale: 表达例外兼先后关系：雨雪不是毫无成效地返回，而是在完成下列作用之后；“先”使汉语逻辑清楚，但不改变原句的条件意味。
- source_word: הִרְוָה אֶת הָאָרֶץ
  choice: 滋润大地
  rationale: רוה 的使役式表示使土地饱得水分；“滋润”既准确又符合本段诗性语体。
- source_word: וְהוֹלִידָהּ וְהִצְמִיחָהּ
  choice: 使大地出产，使植物生长
  rationale: 两个使役动词分别强调使土地有所产出和使所产之物萌发生长；补出“大地”和“植物”以避免汉语代词指向含混，同时保留成对推进的意象。
- source_word: וְנָתַן זֶרַע לַזֹּרֵעַ
  choice: 又赐种子给撒种的
  rationale: 保留具体的农业意象及“种子—撒种者”的词根呼应；“赐”符合语境中供应的庄重语气。
- source_word: וְלֶחֶם לָאֹכֵל
  choice: 赐食物给吃的人
  rationale: לֶחֶם 可具体指饼，也可在语境中泛指供人食用的粮食或食物；此处与生产循环相连，正文用自然的“食物”，脚注保留“饼”的具体译法。
