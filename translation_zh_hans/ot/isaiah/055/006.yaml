base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/006.yaml
  text: Seek Yahweh while he may be found[a]; call on him while he is near.
translation:
  language: zh_hans
  text: 趁耶和华可被寻见时寻求他；趁他临近时呼求他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: 寻求
  rationale: 这里的祈使式意为转向并寻求上帝，兼含悔改、敬拜和求问之意；“寻求”自然简洁，也保留劝勉的力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名；“耶和华”是现代汉语圣经传统中辨识度最高的专名形式，并非以“主”这一称号替代。
- source_word: בְּהִמָּצְאוֹ
  choice: 当趁……可被寻见的时候
  rationale: 介词 בְּ 加不定词构成时间表达，字面近于“在他被寻见时”；“可被寻见”保留原文的被动形式和机会尚在的紧迫感，而不把它解释成不确定性。
- source_word: קְרָאֻהוּ
  choice: 呼求他
  rationale: קרא 加人的宾语在此表示向他呼喊、求告或祈求；“呼求他”在现代汉语中自然，并保留宗教语境中的恳求意味。
- source_word: בִּהְיוֹתוֹ
  choice: 当趁他……的时候
  rationale: 介词 בְּ 加 היה 的不定词构成时间从句；这样的表达与上半句形成清楚的诗歌平行。
- source_word: קָרוֹב
  choice: 临近
  rationale: 该词可指空间上的近，也可指可亲近、就在身边；“临近”与“呼求”搭配自然，并保留关系和时机上的双重意味。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名。中文采用广为人知的“耶和华”，保留专名而不以“主”替代；“雅威”则更接近当代学界常见的拟音。
- issue: בְּהִמָּצְאוֹ 所表达的可寻见性
  choice: 可被寻见
  alternative: 被寻见
  rationale: “可被寻见”体现当下可以寻见他的时机与紧迫性，却不进一步断言这种可能性为何或何时终止；脚注保留更贴近希伯来语形式的译法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两次“当趁……的时候”保留原文平行结构和时间上的迫切感；“寻求／呼求”形成对应。
