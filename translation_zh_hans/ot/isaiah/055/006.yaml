  terminology: “寻求／呼求”恰当对应דרש与קרא；“临近”恰当对应קרוב。“耶和华”保留四字神名这一专名译法，未以称号“主”替代。脚注应把“被寻见”明确表述为较贴近原文形式的完整时间短语，而非孤立的词语。
