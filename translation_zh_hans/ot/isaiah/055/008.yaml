source:
  edition: WLC
  text: כִּ֣י לֹ֤א מַחְשְׁבוֹתַ/י֙ מַחְשְׁב֣וֹתֵי/כֶ֔ם וְ/לֹ֥א דַרְכֵי/כֶ֖ם דְּרָכָ֑/י נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/008.yaml
  text: For my thoughts are not your thoughts[a], and your ways are not my ways, declares Yahweh.
translation:
  language: zh_hans
  text: 因为我的意念不是你们的意念[a]，你们的道路也不是我的道路。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我的计划不是你们的计划，你们的道路也不是我的道路。”希伯来语中译作“意念”的词也可表示“计划”或“谋算”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的劝告说明理由；“因为”自然保留希伯来语的解释或因由关系。
- source_word: מַחְשְׁבוֹתַי / מַחְשְׁבוֹתֵיכֶם
  choice: 我的意念／你们的意念
  rationale: מַחֲשָׁבָה 可指思想、意念、计划或谋算。“意念”既保留宽泛含义和两处重复，也不把语义限定为理性思想或具体计划。
- source_word: דַרְכֵיכֶם / דְּרָכָי
  choice: 你们的道路／我的道路
  rationale: “道路”保留原文的路径隐喻，并可自然指行事方式、作为或人生方向；比“行为”更不狭窄。
- source_word: לֹא ... וְלֹא
  choice: 不是……也不是……
  rationale: 补出汉语判断词，并以“也”连接两个否定分句，保留原文平衡的诗歌平行结构。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: נְאֻם 是庄重的先知性发言公式；独立成句可在现代汉语中清楚传达其宣告性质。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名最通行、最易辨识的专名译法，而不以“主”这一称号取代原文的名字。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。简体中文面向普通读者的译文采用广为人知的“耶和华”，既将其作为专名呈现，也避免以称号“主”替代；“雅威”较贴近学术界常见的拟音，但在大众中文中辨识度较低。
- issue: מַחֲשָׁבָה 的含义范围
  choice: 正文译“意念”，脚注保留“计划／谋算”的可能
  alternative: 正文直接译“计划”
  rationale: 上下文涉及恶人的道路和意念，也涉及耶和华的赦免与作为。原词可兼指思想、意图和计划，因此正文不应把神学含义缩窄为单一的“计划”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“意念／意念”和“道路／道路”的重复与对称，使希伯来诗歌的平行结构清晰可见；将发言公式另成一句，以免中文长句生硬。
