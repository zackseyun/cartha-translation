source:
  edition: WLC
  text: ה֤וֹי כָּל צָמֵא֙ לְכ֣וּ לַ/מַּ֔יִם וַ/אֲשֶׁ֥ר אֵֽין ל֖/וֹ כָּ֑סֶף לְכ֤וּ שִׁבְרוּ֙ וֶֽ/אֱכֹ֔לוּ וּ/לְכ֣וּ שִׁבְר֗וּ בְּ/לוֹא כֶ֛סֶף וּ/בְ/ל֥וֹא מְחִ֖יר יַ֥יִן וְ/חָלָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/001.yaml
  text: Come[a], everyone who is thirsty, come to the waters; and he who has no money, come, buy and eat! Yes[b], come, buy wine and milk without money and without price.
translation:
  language: zh_hans
  text: 来吧[a]！所有口渴的人，都到水那里来；没有银钱的人[b]，也来吧！来买，来吃！来吧，不用银钱，也不用付价，买酒和奶！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文开头是呼喊语，也可较形式对应地译作：“唉！所有口渴的人，都到水那里来。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文此处采用阳性单数形式，但具有泛指作用，意思是“任何没有银钱的人”。
    reason: source_form_clarification
lexical_decisions:
- source_word: הוֹי
  choice: 来吧
  rationale: 该呼喊语在这里引出急切的邀请，而不是哀叹或宣告灾祸。“来吧”在现代汉语中自然地传达其召唤作用；字面呼喊形式保留在脚注中。
- source_word: כָּל צָמֵא
  choice: 所有口渴的人
  rationale: כָּל加单数形容词具有集合意义；此译法清楚保留邀请面向一切口渴之人的范围。
- source_word: לְכוּ
  choice: 来吧／来
  rationale: הלך的命令式本可直译为“去”，但说话者发出邀请时，汉语用“来”更自然。原文反复出现该命令，译文也保留其催促感。
- source_word: לַמַּיִם
  choice: 到水这里来
  rationale: 希伯来文使用复数“水”，描绘充足的供应；汉语通常以不可数的“水”表达，采用“到水这里来”以保留趋向和具体意象。
- source_word: וַאֲשֶׁר אֵין לוֹ כָּסֶף
  choice: 没有银钱的
  rationale: 原文为阳性单数，却具有代表性的泛指作用。汉语“没有银钱的”不标示性别，能自然、准确地表达泛指。
- source_word: שִׁבְרוּ
  choice: 买
  rationale: 该动词在取得食物的语境中通常指购买。此处第一次出现时未明说宾语，因此不把它收窄为“买粮食”。
- source_word: וֶאֱכֹלוּ
  choice: 来吃
  rationale: 保留命令语气及与“买”的连续行动；重复“来”使汉语召唤语气自然有力，而不改变基本意义。
- source_word: בְּלוֹא כֶסֶף
  choice: 不用银钱
  rationale: 直接表达没有货币支付，并保留“购买却不用钱”的修辞张力。
- source_word: וּבְלוֹא מְחִיר
  choice: 不付代价
  rationale: מְחִיר指价格或代价。此译法与“不用银钱”形成平行，同时在现代汉语中清楚自然。
- source_word: יַיִן וְחָלָב
  choice: 酒和奶
  rationale: 按原文保留具体饮食意象，不在正文中将其改写为属灵福分或其他神学解释。
theological_decisions:
- issue: 邀请中的阳性单数泛指表达
  choice: 译作不标示性别的“没有银钱的”
  alternative: 译作“那没有银钱的男人”或“他没有银钱”
  rationale: 原文语法形式虽为阳性单数，语用上却是泛指。现代汉语无需借助男性代词表达泛指，因此正文既可忠实传达范围，也不必制造原文没有的性别限制。
- issue: 经济与饮食意象是否应属灵化
  choice: 保留“买”“银钱”“代价”“酒和奶”等具体语言
  alternative: 直接释义为白白领受救恩或属灵福分
  rationale: 经文本身借市场交易与丰富饮食的悖论性画面发出邀请。译文应保存这一意象及其神学张力，让解释从文本生发，而不把某种神学阐释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的邀请语体。保留“来”与“买”的反复，以呈现原文急切而慷慨的召唤；用“银钱”略带诗体色彩，但仍为普通读者所熟悉。
