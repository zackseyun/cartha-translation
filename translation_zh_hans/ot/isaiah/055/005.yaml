id: ISA.55.5
reference: Isaiah 55:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵ֣ן גּ֤וֹי לֹֽא תֵדַע֙ תִּקְרָ֔א וְ/ג֥וֹי לֹֽא יְדָע֖וּ/ךָ אֵלֶ֣י/ךָ יָר֑וּצוּ לְמַ֨עַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/לִ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל כִּ֥י פֵאֲרָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/005.yaml
  text: Behold[a], you will call a nation that you do not know, and a nation that did not know you will run to you, because of Yahweh your God, and the Holy One of Israel[c][b], for he has glorified you.
translation:
  language: zh_hans
  text: 看哪，你要呼召你所不认识的一国；不认识你的国必奔向你。这是因耶和华你的上帝、以色列的圣者，因为他已使你得荣耀。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因耶和华你的上帝”也可译作“为了耶和华你上帝的缘故”。
    reason: 保留לְמַעַן可表示原因或“为了……的缘故”的词义幅度。
  - marker: b
    text: “使你得荣耀”也可译作“使你得尊荣”或“使你华美”。
    reason: 保留פאר在此处“荣耀、尊荣、华美／装饰”等语义幅度。
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 引出带强调意味的先知性宣告；“看哪”庄重而仍为现代读者所理解。
- source_word: גּוֹי
  choice: 国
  rationale: 这里的单数指一个民族或国家；“国”保留原文宽泛含义，不额外限定为外邦。
- source_word: לֹא תֵדַע
  choice: 素不认识的
  rationale: 以“素不”自然表达此前并无认识，同时适合修饰未来所召的国。
- source_word: תִּקְרָא
  choice: 你要召来
  rationale: קרא可指呼叫或召唤；“召来”清楚呈现发出呼召并使其前来的语境。
- source_word: לֹא יְדָעוּךָ
  choice: 素不认识你的
  rationale: 完成式表示在奔来之前并不认识受话者；“素不认识”在中文中简洁自然。
- source_word: אֵלֶיךָ יָרוּצוּ
  choice: 必奔向你
  rationale: 保留רוּץ快速奔跑的鲜明意象；“必”表达预告的确定性。
- source_word: לְמַעַן
  choice: 因
  rationale: 此处引出列国奔来的缘由；简洁的“因”符合先知诗歌语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，区别于一般称号“主”。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 直接呈现附属结构和第二人称单数所属关系。
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 与“耶和华你的上帝”并列，指向同一位神；中文省去重复介词，使句法自然但不消除同位关系。
- source_word: כִּי
  choice: 因为
  rationale: 引出进一步说明：列国之所以因耶和华而来，是因为他使受话者得荣耀。
- source_word: פֵאֲרָךְ
  choice: 他使你得了荣耀
  rationale: פאר的Piel可表示使华美、得尊荣或得荣耀；此译兼顾公开尊荣与光彩，另以脚注保留其他词义可能。
theological_decisions:
- issue: 第二人称单数“你”的所指
  choice: 正文保留“你”，不具体指明是锡安、以色列或大卫式人物。
  alternative: 明确译作锡安／耶路撒冷，或明确译作仆人／大卫式君王。
  rationale: 希伯来文只使用阳性单数第二人称；上下文容许不同理解，翻译不宜替正文消除这种张力。
- issue: 耶和华与“以色列的圣者”的关系
  choice: 将两者作为对同一位神的并列称谓处理。
  alternative: 把第二称谓理解为另一个独立对象。
  rationale: 连续的介词结构与以赛亚书惯用称谓支持同位并列；中文仍保留两个称谓。
- issue: 列国奔来的原因结构
  choice: 把לְמַעַן译为“因”，并把כִּי从句理解为进一步解释神使“你”得荣耀。
  alternative: 将לְמַעַן译作“为了……的缘故”，强调目的或利益关系。
  rationale: 上下文主要说明列国为何奔来；但לְמַעַן兼有“为了……的缘故”的语感，故在脚注说明。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“素不认识”避免时态解释过重；“奔向你”保留原文动感。神名译作“耶和华”，“God”译作“上帝”。脚注标记已在正文相应内容之后列出。
