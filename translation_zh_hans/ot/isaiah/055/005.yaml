revisions:
- from: 看哪，你要召来素不认识的国；素不认识你的国也必奔向你，都是因耶和华你的上帝、以色列的圣者，因为他使你得了荣耀。[a]
  to: 看哪，你要呼召你所不认识的一国；不认识你的国必奔向你。这是因耶和华你的上帝、以色列的圣者，因为他已使你得荣耀。[a][b]
  rationale: 修订不界定“你”的具体所指，也不改变两个神圣称谓的同位关系。调整关系从句、因果衔接和完成式表达，使中文更自然并更清楚对应希伯来原文；将两个词汇性说明拆为独立脚注锚点。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:22:09Z'
