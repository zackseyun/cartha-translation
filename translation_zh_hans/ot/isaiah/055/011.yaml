base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/011.yaml
  text: 'so will my word be that goes out from my mouth: it will not return to me empty[c][b][a], but it will accomplish what I desire and succeed in the purpose for which I sent it.'
translation:
  language: zh_hans
  text: 我口所出的话也必如此[c]：它必不徒然归回到我这里，反而必成就我所愿的，并在我差遣它所做的事上有成效[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“并在我差遣它所做的事上成功。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“照样，我口所出的话必是如此：……”
    reason: syntactic_alternative
lexical_decisions:
- source_word: כֵּן יִהְיֶה
  choice: 也必如此
  rationale: 承接上文雨雪降下并使大地生长的比喻，保留比较关系和将来语气；置于“我口中所出的话”之后，符合现代汉语表达。
- source_word: דְבָרִי
  choice: 我的话
  rationale: “话”保留דָּבָר在本节中作为上帝所发言语、宣告或信息的宽广语义，也不把它明确译成位格性称号。
- source_word: אֲשֶׁר יֵצֵא מִפִּי
  choice: 我口中所出
  rationale: 保留“从口中出去”的具体言说意象，同时采用简洁庄重的现代汉语定语结构。
- source_word: לֹא יָשׁוּב אֵלַי רֵיקָם
  choice: 绝不会徒然返回我这里
  rationale: “徒然”表达רֵיקָם“空空地、没有成果”的语义；“绝不会”清楚传达否定和结果的确定性。
- source_word: כִּי אִם
  choice: 反而
  rationale: 该结构在否定句后引出强烈对照；“反而”自然表达“不是前者，而是后者”。
- source_word: עָשָׂה אֵת אֲשֶׁר חָפַצְתִּי
  choice: 必成就我所愿的
  rationale: “成就”表达行动达到预期结果；“我所愿的”保留חפץ所含的意愿、喜悦和愿望，不扩展为技术性的“预定”或“谕旨”。
- source_word: וְהִצְלִיחַ אֲשֶׁר שְׁלַחְתִּיו
  choice: 并在我差它去做的事上必有成效
  rationale: “有成效”自然表达צלח的成功、顺利之意，并保留上帝的话受差遣去完成特定任务的图景。
theological_decisions:
- issue: “我的话”是否应译为明确的位格性称号
  choice: 按上下文译作上帝所发出并产生功效的话语，不明示为某个位格。
  alternative: 依据更广泛的正典神学，将这里的“话”直接理解并译为先存的圣子。
  rationale: 以赛亚书55章的直接语境用雨雪比喻上帝言语的功效；希伯来文本本身没有要求在译文中加入明确的基督论身份。
- issue: 上帝话语的功效与人的回应
  choice: 明确表达上帝的话必完成其意愿并取得成效，但不添加超出经文的决定论措辞。
  alternative: 将本节扩写为不可抗拒的谕旨，或弱化为仅仅劝服人的信息。
  rationale: 原文坚定宣告上帝话语的有效性，却没有在本节具体说明这种功效与人的意志如何关联；译文保留这一神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我口中所出”保留希伯来文的具体意象；“徒然”“成就”“有成效”兼顾文学质感和日常可理解性。
