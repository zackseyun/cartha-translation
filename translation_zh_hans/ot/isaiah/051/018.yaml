  text: אֵין מְנַהֵ֣ל לָ֔/הּ מִ/כָּל בָּנִ֖ים יָלָ֑דָה וְ/אֵ֤ין מַחֲזִיק֙ בְּ/יָדָ֔/הּ מִ/כָּל בָּנִ֖ים גִּדֵּֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/018.yaml
  text: There is no one to guide her among all the sons she has borne[a], and no one to take her by the hand among all the sons she has raised.
translation:
  language: zh_hans
  text: 她所生的众子中，没有一个引导她；她所养大的众子中，也没有一个扶住她的手。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְנַהֵל
  choice: 引导
  rationale: 该分词源于 נהל，表示带领、引导；这里锡安被拟人化为孤立无助的母亲，“引导”既保留方向性的含义，也符合庄重的现代汉语。
- source_word: לָהּ
  choice: 她
  rationale: 阴性单数代词后缀指向上下文中被拟人化为女性的锡安／耶路撒冷。
- source_word: מִכָּל בָּנִים
  choice: 众子中
  rationale: 介词 מן 与 כָּל 连用，在这里表示从整个群体之中；בָּנִים 明确为阳性复数，因此译作“众子”，保留原文的性别表达和母子意象。
- source_word: יָלָדָה
  choice: 她所生的
  rationale: 该完成式指她已经生下的众子；“所生的”自然凝练，并保留母亲生育的意象。
- source_word: מַחֲזִיק בְּיָדָהּ
  choice: 搀扶她的手
  rationale: 该表达字面涉及握住或扶持她的手，在本处传达实际支撑和帮助；“搀扶她的手”保留手的形象，也符合一个无力站稳者需要扶助的语境。
- source_word: גִּדֵּלָה
  choice: 她所养大的
  rationale: גדל 的皮勒式在此意为养育、抚养长大；“养大的”是清楚自然的现代汉语，并与前句“所生的”形成对应。
- source_word: אֵין ... וְאֵין
  choice: 没有一个……也没有一个
  rationale: 保留两次存在否定所形成的平行和强调，突出锡安被众子完全弃置、无人扶助的处境。
theological_decisions:
- issue: בָּנִים 的性别表达
  choice: 众子
  alternative: 众儿女／孩子们
  rationale: 原文明确使用阳性复数“儿子们”，且本节以母亲与众子的关系构成修辞意象；译作“众子”可避免将原文的性别特征无声中和，同时不额外引入教派性解释。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语；两分句保持希伯来诗歌的平行结构。“众子”略带经文语体，但含义清楚，并准确保留原文的阳性复数。
