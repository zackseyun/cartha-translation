base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/019.yaml
  text: These two things have come upon you—who will mourn for you?—devastation and destruction[a], famine and sword[b]; who will comfort you?
translation:
  language: zh_hans
  text: 这两样事临到你——谁为你哀恸？——劫掠与毁灭[a]，饥荒与刀剑[b]；谁能安慰你？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你哀恸”也可译作“为你悲叹”或“同情你”；希伯来文动词可指哀悼或表示同情。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文先说“两样事”，随后列出四种灾祸，可能是分作两组：“劫掠与毁灭”和“饥荒与刀剑”。
    reason: cultural_note
lexical_decisions:
- source_word: שְׁתַּיִם הֵנָּה
  choice: 这两样事
  rationale: 保留希伯来文明确的数目“二”和指示意味；“这两样事”是自然、庄重的现代汉语。
- source_word: קֹרְאֹתַיִךְ
  choice: 临到你
  rationale: 此处虽源自动词“呼叫”，但灾祸作主语时是“遭遇、临到”的习语；译作“临到你”准确且符合先知文学语体。
- source_word: מִי יָנוּד לָךְ
  choice: 谁为你哀恸
  rationale: נוּד可表达哀悼、同情或摇头悲叹；“为你哀恸”保留哀悼和同情的核心语义，同时在中文中自然庄重。
- source_word: הַשֹּׁד
  choice: 荒废
  rationale: 该词指劫掠所造成的毁坏、荒凉；“荒废”突出灾难的结果，并能与下词构成一组。
- source_word: הַשֶּׁבֶר
  choice: 毁灭
  rationale: 该词本义涉及破裂、崩毁，在灾祸语境中指毁坏或崩溃；“毁灭”清楚传达其强烈程度。
- source_word: הָרָעָב
  choice: 饥荒
  rationale: 这是רָעָב在审判与灾难语境中的标准对应词。
- source_word: הַחֶרֶב
  choice: 刀剑
  rationale: 直译该词，并以常见的圣经汉语表达战争和暴力死亡。
- source_word: מִי אֲנַחֲמֵךְ
  choice: 谁能安慰你
  rationale: Piel词干在此意为安慰、劝慰；“安慰”也保留《以赛亚书》中反复出现的重要主题。中文加“能”自然表达反问的无助意味，不改变其基本内容。
theological_decisions:
- issue: 经文先说“两样事”，随后却列出四个灾祸名词
  choice: 保留“两样事”，并将四个名词按两组并列：“荒废与毁灭，饥荒与刀剑”
  alternative: 将“两样事”泛化为“重重灾祸”，或据推测修改原文
  rationale: 希伯来文本明确写“二”，而后四项可自然理解为两组成对的灾祸。这样既不修订原文，也不消解经文本身的张力。
- issue: נוּד所表达的是哀悼还是同情
  choice: 正文译作“为你哀恸”，脚注说明也可含为其悲叹、表示同情之意
  alternative: 谁怜悯你；谁向你摇头
  rationale: 上下文强调锡安遭灾后无人陪伴哀悼；“哀恸”最能涵盖公开悲叹的主要语义，而脚注保留词义范围，避免将歧义绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。破折号保留原句中插入反问的修辞力度；分号区分灾祸清单与末尾关于安慰的反问。所有脚注标记均置于对应正文处。
