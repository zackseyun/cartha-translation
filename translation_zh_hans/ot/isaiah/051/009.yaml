source:
  edition: WLC
  text: עוּרִ֨י עוּרִ֤י לִבְשִׁי עֹז֙ זְר֣וֹעַ יְהוָ֔ה ע֚וּרִי כִּ֣/ימֵי קֶ֔דֶם דֹּר֖וֹת עוֹלָמִ֑ים הֲ/ל֥וֹא אַתְּ הִ֛יא הַ/מַּחְצֶ֥בֶת רַ֖הַב מְחוֹלֶ֥לֶת תַּנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/009.yaml
  text: Awake[a], awake, put on strength, arm of Yahweh; awake, as in days of old, generations of long ago[b]. Was it not you who cut Rahab in pieces, who pierced the dragon?
translation:
  language: zh_hans
  text: 醒来！醒来！披上力量吧，雅威的膀臂！醒来吧，如同古时，如同远古的世代！把拉哈伯[a]劈碎、把大龙[b]刺透的，不正是你吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉哈伯”是骄傲敌对势力的诗性名称，此处常被理解为指埃及。
    reason: cross_reference
  - marker: b
    text: 或译“大海怪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: 醒来
  rationale: 阴性单数祈使式呼告拟人化的“雅威的膀臂”；重复译出，以保留诗歌的急切感和节奏。
- source_word: לִבְשִׁי עֹז
  choice: 披上力量
  rationale: 保留“把力量当作衣服穿上”的希伯来语隐喻，同时符合现代汉语诗体表达。
- source_word: זְרוֹעַ יְהוָה
  choice: 雅威的膀臂
  rationale: “膀臂”保留神施展能力与拯救行动的传统圣经意象；将יהוה音译为“雅威”，呈现经文中的专名。
- source_word: כִּימֵי קֶדֶם דֹּרוֹת עוֹלָמִים
  choice: 像古时的日子，像远古的世代一样
  rationale: 将两个表示久远过去的平行短语分别呈现，避免把עוֹלָמִים误解为此处的形而上“永恒”。
- source_word: הַמַּחְצֶבֶת
  choice: 劈碎
  rationale: 表达חצב在此处猛烈砍劈、击败敌对势力的含义，也与下句的“刺透”形成有力平行。
- source_word: רַהַב
  choice: 拉哈伯
  rationale: 保留诗性专名及其多层意象，不在正文中直接等同于埃及。
- source_word: מְחוֹלֶלֶת
  choice: 刺透
  rationale: 在与“劈碎”平行的战斗语境中表达强力击穿，同时不扩展为经文未明说的“杀死”。
- source_word: תַּנִּין
  choice: 大龙
  rationale: 在此诗歌语境中指带有混沌怪兽色彩的巨大生物；“大龙”保留其鲜明意象，脚注列出“大海怪”这一可行译法。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用现代汉语中较贴近其学术重构读音的“雅威”，而不以称号替代专名。
- issue: 拉哈伯与大龙意象的解释
  choice: 正文保留“拉哈伯”和“大龙”
  alternative: 把拉哈伯直接译作“埃及”；把תנין译作“大海怪”
  rationale: 这组意象可能同时唤起出埃及历史与战胜混沌势力的诗性图景。正文保留其含混和神学张力，脚注提供必要说明而不将意义压缩为单一所指。
- issue: 对雅威膀臂的呼告
  choice: 保留拟人化的直接呼告
  alternative: 意译为求雅威亲自醒来施力
  rationale: 阴性祈使式在语法上与拟人化的“膀臂”呼应；保留这一形式可忠实呈现先知诗歌大胆的呼求。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以短促重复的“醒来”保存呼告力度，用“披上力量”“膀臂”“劈碎”“刺透”等具象词汇维持原诗的战斗意象与平行结构。
