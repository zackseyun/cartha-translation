source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י/הָ֙ בְּ/יַד מוֹגַ֔יִ/ךְ אֲשֶׁר אָמְר֥וּ לְ/נַפְשֵׁ֖/ךְ שְׁחִ֣י וְ/נַעֲבֹ֑רָה וַ/תָּשִׂ֤ימִי כָ/אָ֨רֶץ֙ גֵּוֵ֔/ךְ וְ/כַ/ח֖וּץ לַ/עֹבְרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/023.yaml
  text: And I will put it into the hand of those who afflict you, who said to you, ‘Bow down, so that we may pass over’; and you made your back like the ground, and like the street for those passing by.
translation:
  language: zh_hans
  text: '我要把这杯交在那些苦待你的人手中；他们曾对你说：

    “俯伏下来，好让我们从你身上走过去。”

    你便使自己的背如同地面，

    如同街道，任人走过。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹגַיִךְ
  choice: 那些苦待你的人
  rationale: 该词在本节指使锡安受苦、受压迫的人；“苦待”自然清楚，也不把含义过度限定为肉体折磨。
- source_word: לְנַפְשֵׁךְ
  choice: 对你
  rationale: נפשׁ在这里以第二人称指受话者本身，并非专指与身体相对的“灵魂”；现代汉语用“对你”最自然。
- source_word: שְׁחִי
  choice: 俯伏下来
  rationale: 保留身体屈身伏下以及受辱顺服的意象。
- source_word: וְנַעֲבֹרָה
  choice: 好让我们从你身上走过去
  rationale: 目的语气以“好让”表达；结合下文把背当作地面和街道，补明他们是在受辱者身上走过。
- source_word: גֵּוֵךְ
  choice: 自己的背
  rationale: גֵּו可指背或躯干；上下文描绘伏地供人践踏，“背”最贴切。
- source_word: כַחוּץ
  choice: 如同街道
  rationale: חוּץ本义可为外面、户外或街道；与“任人走过”搭配时，“街道”准确呈现可供通行的公共道路意象。
theological_decisions:
- issue: 本节开头代词“她/它”所指为何
  choice: 译作“这杯”
  alternative: 译作“它”
  rationale: 阴性宾语后缀回指前文耶和华忿怒之杯；明译“这杯”使跨节衔接清楚，同时没有增加新的神学解释。
- issue: 受辱意象是否仅作比喻处理
  choice: 保留从背上走过、背如地面和街道的具体图景
  alternative: 概括为“任人践踏羞辱”
  rationale: 原文以强烈的身体和道路意象表达压迫与羞辱；保留意象可避免将其抽象化或削弱。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。诗行保留希伯来诗歌的推进：杯转交给施虐者、施虐者的命令、锡安受辱的具体画面。引语自然，避免古奥措辞。
