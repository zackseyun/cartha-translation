source:
  edition: WLC
  text: שְׂאוּ֩ לַ/שָּׁמַ֨יִם עֵֽינֵי/כֶ֜ם וְֽ/הַבִּ֧יטוּ אֶל הָ/אָ֣רֶץ מִ/תַּ֗חַת כִּֽי שָׁמַ֜יִם כֶּ/עָשָׁ֤ן נִמְלָ֨חוּ֙ וְ/הָ/אָ֨רֶץ֙ כַּ/בֶּ֣גֶד תִּבְלֶ֔ה וְ/יֹשְׁבֶ֖י/הָ כְּמוֹ כֵ֣ן יְמוּת֑וּ/ן וִ/ישֽׁוּעָתִ/י֙ לְ/עוֹלָ֣ם תִּֽהְיֶ֔ה וְ/צִדְקָתִ֖/י לֹ֥א תֵחָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/006.yaml
  text: Lift up your eyes to the heavens[a], and look at the earth beneath; for the heavens will vanish like smoke, and the earth will wear out like a garment, and its inhabitants will die likewise. But my salvation will be forever[b], and my righteousness will not be shattered.
translation:
  language: zh_hans
  text: 你们要举目仰望诸天，观看下方的大地；因为诸天必像烟一样消散[a]，大地必像衣服一样渐渐破旧，住在其中的人也必照样死去；但我的救恩必永远长存，我的公义[b]绝不被摧毁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来动词词义较难确定，也可译作“消逝”；这里的意思是诸天终必过去。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“正义”或“公正”；希伯来词兼有这些含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ ... עֵינֵיכֶם
  choice: 举目
  rationale: 这是“抬起你们的眼睛”的自然汉语表达，既保留具体的观看动作，也符合现代庄重语体。
- source_word: לַשָּׁמַיִם
  choice: 望天／诸天
  rationale: שׁמים在形态上为复数，并与“大地”构成宇宙性的对应；命令句中用自然的“望天”，后文论及其消逝时用“诸天”保留原文范围。
- source_word: אֶל הָאָרֶץ מִתַּחַת
  choice: 下面的大地
  rationale: מִתַּחַת表示下方，与上面的天形成对照；“大地”比“土地”更适合此处天地并列的宇宙语境。
- source_word: נִמְלָחוּ
  choice: 消散
  rationale: 此罕见动词词义困难，但上下文明确指诸天逝去；“消散”与“如烟”的比喻自然衔接，同时不把不确定的字源解释写入正文。
- source_word: תִּבְלֶה
  choice: 破旧
  rationale: בלה常指衣物逐渐磨损、变旧；“像衣服一样破旧”保留原文的明喻，并使用自然现代汉语。
- source_word: וְיֹשְׁבֶיהָ
  choice: 其中的居民
  rationale: 分词作名词，指居住在大地上的人；此译简洁，并明确所属关系。
- source_word: כְּמוֹ כֵן
  choice: 也必同样
  rationale: 按马所拉读法，此短语表示与前述天地消逝相对应；“也必同样”保留其比较关系。
- source_word: וִישׁוּעָתִי לְעוֹלָם תִּהְיֶה
  choice: 我的拯救必永远长存
  rationale: 以“长存”自然表达“永远存在”，并与前半节受造界和居民的消逝形成鲜明对照。
- source_word: וְצִדְקָתִי לֹא תֵחָת
  choice: 我的公义绝不破灭
  rationale: צדקה保留“公义”这一兼具正直、公正及施行拯救意味的宽广用语；חתת在此表达被打碎、毁坏或归于无有，“破灭”既保留力度又符合汉语搭配。
theological_decisions:
- issue: צִדְקָתִי的语义范围
  choice: 我的公义
  alternative: 我的正义／我的公正
  rationale: 该词既可指公正的审判，也常在《以赛亚书》中与上帝信实而施行拯救的作为相连。“公义”较能保留这种宽广的神学张力；脚注注明“正义”这一可能译法。
- issue: 后半节与前半节的对比关系
  choice: 用“然而”明确转折
  alternative: 用“但”或不明示连接关系
  rationale: 希伯来文仅以连接词起句，但语义上将天地和居民的消逝与上帝拯救、公义的永久性相对照；“然而”自然呈现该语篇关系，不额外限定其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“举目望天”保留先知文体的凝练感；“破旧”“同样死亡”“永远长存”避免古奥表达。正文保留天地消逝与上帝拯救、公义长存之间的张力，并用脚注呈现两个重要词语的真实语义不确定性。
