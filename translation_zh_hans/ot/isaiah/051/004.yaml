  text: הַקְשִׁ֤יבוּ אֵלַ/י֙ עַמִּ֔/י וּ/לְאוּמִּ֖/י אֵלַ֣/י הַאֲזִ֑ינוּ כִּ֤י תוֹרָה֙ מֵ/אִתִּ֣/י תֵצֵ֔א וּ/מִשְׁפָּטִ֔/י לְ/א֥וֹר עַמִּ֖ים אַרְגִּֽיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/004.yaml
  text: Pay attention to me[a], my people, and give ear to me, my nation; for instruction will go out from me[c][b], and I will set my justice as a light for the peoples.
translation:
  language: zh_hans
  text: “我的百姓啊，要留心听我！我的国民啊，要侧耳听我！因为教诲[a]必从我而出；我要把我的公正[b]立为万民之光[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教诲”或译“律法”或“教导”（希伯来文：תּוֹרָה）。
    reason: lexical_alternative
  - marker: b
    text: “公正”或译“我的审判”或“我的判决”（希伯来文：מִשְׁפָּטִי）。
    reason: lexical_alternative
  - marker: c
    text: 本句最后的动词含义较难确定，也可理解为“我要使它安歇”或“我要安置它”；这里按“确立、立定”的意思翻译。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: 留心听
  rationale: 表达专注聆听的命令语气，比单说“听”更充分保留原文的呼召力度，同时符合现代汉语。
- source_word: עַמִּי
  choice: 我的百姓
  rationale: 准确表达单数集合名词及其圣约性的称呼，也是自然、庄重的现代中文。
- source_word: וּלְאוּמִּי
  choice: 我的国民
  rationale: לְאֹם可指民族或国民；这里用“国民”与前句“百姓”保持平行又保留词汇区别，并避免将两个希伯来词完全译同。
- source_word: הַאֲזִינוּ
  choice: 侧耳听
  rationale: 保留与“留心听”平行而不完全相同的听觉意象，也维持诗歌的庄重语气。
- source_word: תּוֹרָה
  choice: 教诲
  rationale: 此处指从上帝而出的权威性教导，范围不必限于成文律法；“教诲”兼具教导与规范意味。
- source_word: תֵצֵא
  choice: 必从我而出
  rationale: 直接保留“出去、发出”的动态意象；“必”自然表达未完成式在此处的将来确定性。
- source_word: וּמִשְׁפָּטִי
  choice: 我的公正
  rationale: מִשְׁפָּט可指判决、审判或公正；在“万民之光”的语境中，“公正”较自然地呈现上帝正直秩序的积极彰显，同时以脚注保留“审判”的可能。
- source_word: לְאוֹר עַמִּים
  choice: 立为万民之光
  rationale: “万民”自然表达复数עמים所涵盖的众民族；“之光”庄重而易懂，并保留目的或结果关系。
- source_word: אַרְגִּיעַ
  choice: 立为
  rationale: 该使役形动词语义困难；结合宾语“我的公正”和补语“万民之光”，“立为”简洁表达使其安置、确立的意思，同时不在正文中强行采用较生硬的“使安歇”。
theological_decisions:
- issue: תּוֹרָה与מִשְׁפָּט面向万民的范围
  choice: 译作从上帝而出的“教诲”和成为“万民之光”的“公正”，呈现其普世指向。
  alternative: 将תּוֹרָה狭义理解为摩西律法，并把מִשְׁפָּט理解为只针对以色列的判决。
  rationale: 原文明说“万民”，支持向众民族扩展的视野；译文不把这层意义纳入任何后来的特定教义体系。
- issue: מִשְׁפָּט的性质
  choice: 正文采用“公正”。
  alternative: “审判”或“判决”。
  rationale: 与“万民之光”搭配时，“公正”较能表达上帝正直秩序的显明，而非预先限定为惩罚性审判；脚注保留其他真实可能。
- issue: אַרְגִּיעַ的含义
  choice: 按“安置、确立”理解，译为“立为”。
  alternative: 按使役意义较直译为“使它安歇”或“使它安定”。
  rationale: 该动词在本句中确有词义和句法上的难度；正文采用通顺且与上下文相合的表达，脚注明确保留其他解释，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而可朗读的先知诗歌语体。“留心听／侧耳听”和“百姓／国民”分别保留两组希伯来平行词的同义呼应及细微差别；“万民之光”简洁自然，并保持原文的普世视野。所有词义不确定处均以脚注呈现。
