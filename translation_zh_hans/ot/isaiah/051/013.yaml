language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תִּשְׁכַּ֞ח יְהוָ֣ה עֹשֶׂ֗/ךָ נוֹטֶ֣ה שָׁמַיִם֮ וְ/יֹסֵ֣ד אָרֶץ֒ וַ/תְּפַחֵ֨ד תָּמִ֜יד כָּל הַ/יּ֗וֹם מִ/פְּנֵי֙ חֲמַ֣ת הַ/מֵּצִ֔יק כַּ/אֲשֶׁ֥ר כּוֹנֵ֖ן לְ/הַשְׁחִ֑ית וְ/אַיֵּ֖ה חֲמַ֥ת הַ/מֵּצִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/013.yaml
  text: and you forgot Yahweh your Maker[a], who stretched out the heavens and founded the earth, and you feared continually all day long because of the fury of the oppressor, when he set himself to destroy. But where is the fury of the oppressor?
translation:
  language: zh_hans
  text: 你却忘了创造你的雅威——他铺展诸天，奠立大地；你因欺压者的烈怒，终日不断地惧怕，当他准备毁灭时[a]。然而，欺压者的烈怒在哪里呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛他准备毁灭。”
    reason: כַּאֲשֶׁר כּוֹנֵן לְהַשְׁחִית 可按时间情境理解为“当他准备毁灭时”，也可带有拟然意味，理解为“仿佛他准备毁灭”。
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: 你竟忘记了
  rationale: 该形式是שׁכח的Qal叙事式未完成时第二人称阳性单数；在先知责问中以完成性的“忘记了”自然表达，并用“竟”传达责备语气，不改变命题内容。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接保留四字神名，以现代汉语常见音译“雅威”呈现，而不以称号代替。
- source_word: עֹשֶׂךָ
  choice: 造你的
  rationale: 保留עשה分词加第二人称单数后缀的关系，直接修饰“雅威”；比抽象称号“创造主”更贴近原文措辞。
- source_word: נוֹטֶה שָׁמַיִם
  choice: 铺展诸天
  rationale: נטה在宇宙创造语境中表示伸展、铺开；“铺展诸天”简洁庄重，也保留持续性分词所描绘的创造作为。
- source_word: וְיֹסֵד אָרֶץ
  choice: 奠立大地
  rationale: יסד带有奠基、建立之意；“奠立”保留原文根基意象，又符合庄重的现代汉语。
- source_word: וַתְּפַחֵד
  choice: 你……惧怕
  rationale: פחד直接表示惧怕、恐惧；“惧怕”贴近词义，不额外加入身体发抖的意象。
- source_word: תָּמִיד כָּל הַיּוֹם
  choice: 终日不停地
  rationale: 同时体现תמיד的持续性和כל־היום的整日范围，避免把两重时间强调压缩掉。
- source_word: מִפְּנֵי חֲמַת הַמֵּצִיק
  choice: 因欺压者的烈怒
  rationale: מִפְּנֵי在此按原因理解；חמה是强烈怒气，מֵצִיק指施加压迫、困扰的人。“欺压者的烈怒”直接而自然。
- source_word: כַּאֲשֶׁר כּוֹנֵן לְהַשְׁחִית
  choice: 因为他准备施行毁灭
  rationale: 将主语承接最近的“欺压者”；כונן表达准备、部署或定意，להשחית表示毁灭。כַאֲשֶׁר的具体语气存在歧义，正文按现实性的情境表达，另以脚注保留拟然读法。
- source_word: וְאַיֵּה חֲמַת הַמֵּצִיק
  choice: 然而，欺压者的烈怒如今在哪里呢？
  rationale: אַיֵּה引出反问；“然而”呈现与先前恐惧的转折，“如今”使汉语反问自然，并凸显威胁的消逝或无能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用专名而非“主”这一称号；“雅威”较直接对应通常重构的YHWH读音，并避免以称号替换神名。
- issue: “准备施行毁灭”的主语
  choice: 欺压者
  alternative: 不定或泛指的主体
  rationale: 最近的明确先行词是“欺压者”，随后反问也再次聚焦其烈怒，因此保持同一主语最连贯。
- issue: כַּאֲשֶׁר כּוֹנֵן לְהַשְׁחִית的现实性或拟然性
  choice: 因为他准备施行毁灭
  alternative: 仿佛他已经准备好要毁灭
  rationale: 正文采用情境性、现实性的读法，但希伯来语结构也可被理解为受威胁者主观感受到的拟然威胁；脚注保留这一张力，不据神学预设替原文消歧。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“诸天”“奠立”保留诗性和创造意象；其余措辞避免古奥。第二人称单数在汉语中自然呈现为“你”。脚注标记紧随真正存在译法歧义的分句，而不置于“造你的雅威”之后。
