revisions:
- from: 你竟忘记了造你的雅威；他铺展诸天，奠立大地。你因欺压者的烈怒，终日不停地惧怕，因为他准备施行毁灭[a]。然而，欺压者的烈怒如今在哪里呢？
  to: 你却忘了创造你的雅威——他铺展诸天，奠立大地；你因欺压者的烈怒，终日不断地惧怕，当他准备毁灭时[a]。然而，欺压者的烈怒在哪里呢？
  rationale: 修正 כַּאֲשֶׁר 从句的关系，使正文保留原文的时间/情境读法，并将另一种拟然理解置于脚注；同时改善“创造你的雅威”的汉语修饰关系，删除原文未表达的“如今”。其余关键术语与诗性创造意象均予保留。
