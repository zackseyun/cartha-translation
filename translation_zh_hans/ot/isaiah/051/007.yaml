  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְע֤וּ אֵלַ/י֙ יֹ֣דְעֵי צֶ֔דֶק עַ֖ם תּוֹרָתִ֣/י בְ/לִבָּ֑/ם אַל תִּֽירְאוּ֙ חֶרְפַּ֣ת אֱנ֔וֹשׁ וּ/מִ/גִּדֻּפֹתָ֖/ם אַל תֵּחָֽתּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/007.yaml
  text: 'Listen to me[a], you who know righteousness, people with my law in their hearts: do not fear the reproach of man[d][c][b], and do not be dismayed by their insults.'
translation:
  language: zh_hans
  text: “你们要听我[a]：你们这些知道公义[b]、心里有我律法[c]的百姓，不要害怕人的辱骂[d]，也不要因他们的毁谤而惊惶[e]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听我”也可译作“听从我”。
    reason: 保留 שִׁמְעוּ אֵלַי 所含的聆听、留心之意。
  - marker: b
    text: “公义”也可译作“正义”。
    reason: 保留 צֶדֶק 的可行词义选择。
  - marker: c
    text: “律法”也可译作“训诲”或“教导”。
    reason: 保留 תּוֹרָה 的词义幅度。
  - marker: d
    text: 这里译作“人”的希伯来语词有时带着必死、脆弱之人的意味。
    reason: 说明 אֱנוֹשׁ 的常见语义色彩，而不将其强加于正文。
  - marker: e
    text: “惊惶”也可译作“被击垮”或“丧胆”。
    reason: 保留 חתת 在此处可指内心受挫、崩溃的较强语气。
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: 要听我
  rationale: 复数命令式配合介词 אֶל，表示有指向地聆听并留心；“要听我”自然、直接。
- source_word: יֹדְעֵי צֶדֶק
  choice: 知道公义
  rationale: צֶדֶק 可指公义或正义；此处与内存于心的上帝律法并列，“公义”较能涵盖道德与圣约层面的正直，同时不排除公正的含义。
- source_word: עַם תּוֹרָתִי בְלִבָּם
  choice: 心里有我律法的百姓
  rationale: תּוֹרָה 可译“律法”或“训诲”；此处保留其规范性而译“律法”。集体名词 עַם 译作“百姓”，בְלִבָּם 按汉语习惯译作“心里有”。
- source_word: אַל תִּירְאוּ חֶרְפַּת אֱנוֹשׁ
  choice: 不要怕人的辱骂
  rationale: חֶרְפָּה 指辱骂、羞辱或讥诮；אֱנוֹשׁ 为泛指人的单数名词，并可带有必死、脆弱之人的意味。汉语“人的”自然保留泛指。
- source_word: וּמִגִּדֻּפֹתָם
  choice: 因他们的毁谤
  rationale: גִּדּוּפוֹת 指侮辱、毁谤一类恶言；在此为人对人的言语攻击，不宜特指对上帝的亵渎。介词 מִן 在此自然表达导致惊惶的缘由。
- source_word: אַל תֵּחָתּוּ
  choice: 不要……惊惶
  rationale: חתת 的尼法勒式可表示惊惶、丧胆或被击垮；与前句“不要怕”平行时，“惊惶”既自然，也保留敌对言语使人内心崩溃的较强语气。
theological_decisions:
- issue: צֶדֶק 的译法
  choice: 公义
  alternative: 正义
  rationale: “公义”在此较好地表达上帝所定的道德正直和圣约秩序；“正义”仍是词义上成立的选择，但可能偏重社会司法层面。
- issue: תּוֹרָה 的译法
  choice: 律法
  alternative: 训诲
  rationale: “律法”保留此处上帝旨意的规范性；原词也能表示教导或训诲，因此以脚注保存另一可能。
- issue: אֱנוֹשׁ 的泛指与脆弱含义
  choice: 人
  alternative: 必死的人
  rationale: 正文用“人”最符合现代汉语泛指表达，不加入原文未明说的性别；脚注说明该词有时带着人必死、脆弱的意味。
- issue: אַל תֵּחָתּוּ 的力度
  choice: 不要惊惶
  alternative: 不要被击垮
  rationale: 该动词可指惊惶，也可含被打垮、崩溃的强烈色彩。正文选自然庄重的“惊惶”，脚注保留更强的比喻性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。呼语用“……的百姓啊”，突出原文的直接召唤；避免过于古雅的“侧耳”或过度口语化表达。
