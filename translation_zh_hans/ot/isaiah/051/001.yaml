id: ISA.51.1
reference: Isaiah 51:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְע֥וּ אֵלַ֛/י רֹ֥דְפֵי צֶ֖דֶק מְבַקְשֵׁ֣י יְהוָ֑ה הַבִּ֨יטוּ֙ אֶל צ֣וּר חֻצַּבְתֶּ֔ם וְ/אֶל מַקֶּ֥בֶת בּ֖וֹר נֻקַּרְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/001.yaml
  text: 'Listen to me[a], you who pursue righteousness, you who seek Yahweh: look to the rock from which you were cut[c][b], and to the quarry from which you were dug.'
translation:
  language: zh_hans
  text: “你们这追求公义、寻求雅威的人，要听我说！要看你们从中被凿取出来的磐石，也要看你们从中被挖出来的坑穴[a]。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑穴”所译的希伯来语短语也可理解为“采石坑”或“采石场”。其中词语的构词关系和具体所指并不完全确定；这里保留人从采掘之处被取出的意象。
    reason: 原文מַקֶּבֶת בּוֹר的结构和确切所指较难确定，需保留其词义与意象上的可能性。
  - marker: b
    text: 下一节以亚伯拉罕和撒拉说明这里的磐石与坑穴意象。
    reason: 提示紧接下文对本节比喻的展开，而不把解释提前写入正文。
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: 要听我说
  rationale: 复数命令式要求受众留心听从；“听我说”既自然，也保留了“向我听”的直接召唤。
- source_word: רֹדְפֵי צֶדֶק
  choice: 追求公义的人
  rationale: 保留分词所表达的持续特征和“追逐、追求”的动态意象。צֶדֶק兼有公义、正义之意；此处与“寻求雅威”平行，“公义”较能涵盖其道德与信仰语境。
- source_word: מְבַקְשֵׁי יְהוָה
  choice: 寻求雅威的人
  rationale: 保持与前一分词短语的平行，并把“寻求”所含的敬拜、求问和归向之意保留在开放语义中。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: הַבִּיטוּ אֶל
  choice: 要仰望……也要看……
  rationale: 命令式要求带着思考注视源头。“仰望”用于首个意象较庄重自然；第二分句用“看”避免汉语重复，二者均未把比喻解释掉。
- source_word: צוּר חֻצַּבְתֶּם
  choice: 凿出你们的磐石
  rationale: חצב指从岩石中凿取、开采；“凿出”准确保留采石意象，“磐石”符合庄重的经文语体。
- source_word: מַקֶּבֶת בּוֹר נֻקַּרְתֶּם
  choice: 挖出你们的坑穴
  rationale: 该短语字面和句法较难，涉及坑穴及挖掘、凿取的意象。“坑穴”保留בּוֹר的具体形象，“挖出”对应被动的开凿来源关系，同时避免在正文中过度确定为现代意义的“采石场”。
theological_decisions:
- issue: 是否在正文中把磐石和坑穴直接解释为亚伯拉罕与撒拉
  choice: 保留比喻，不在本节正文中点明人物
  alternative: 直接译作“亚伯拉罕和撒拉”或在正文中加以解释
  rationale: 希伯来文本在本节仅给出采石、挖掘的来源比喻，下一节才以亚伯拉罕和撒拉展开。保留这一推进可避免提前消解意象。
- issue: צֶדֶק的语义范围
  choice: 正文译“公义”，脚注提示“正义”
  alternative: 正文译“正义”
  rationale: “公义”较贴合此处与“寻求雅威”并列的道德—信仰含义；脚注保留该词可能偏向社会司法层面的另一面。
- issue: 神名יהוה的呈现
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 使用音译以保留神名的专名性质；不据宗派传统把它改成称号，也不以另一传统音译取代正文选择。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们这……的人”清楚标示两组平行分词共同指向受话者；两个命令句保留原文的劝诫力度。正文维持磐石、凿取、坑穴、挖出的具体意象，并以脚注处理难解短语和上下文说明。
