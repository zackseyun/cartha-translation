  source_fidelity: 正文把两个被动动词的施受关系译反了：“凿出你们的磐石／挖出你们的坑穴”在现代汉语中通常表示磐石、坑穴是动作的施事或所产出之物，而希伯来文是受话者从磐石、坑穴（或采掘处）中被凿出、被挖出的意象。修订以“你们从中被……”明确保留原文的来源关系及被动语态。
  naturalness: “你们这……的人”及“要听我说”自然且适合庄重语体。修订后的“从中被凿取出来／从中被挖出来”略具意象性的正式感，但在本节采石隐喻中清楚、可读。两个“看”改为平行的“看”，避免无依据地把首个动作强化为带宗教含义的“仰望”。
  terminology: “公义”“寻求雅威”“磐石”均可保留；“雅威”一致呈现四字神名。“坑穴”暂保留为对בּוֹר的较宽译法；脚注说明מַקֶּבֶת בּוֹר的构词关系与具体指涉不确定，并保留“采石坑／采石场”等可能，不在正文武断定为单一现代术语。
