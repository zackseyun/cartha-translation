id: ISA.51.3
reference: Isaiah 51:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי נִחַ֨ם יְהוָ֜ה צִיּ֗וֹן נִחַם֙ כָּל חָרְבֹתֶ֔י/הָ וַ/יָּ֤שֶׂם מִדְבָּרָ/הּ֙ כְּ/עֵ֔דֶן וְ/עַרְבָתָ֖/הּ כְּ/גַן יְהוָ֑ה שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יִמָּ֣צֵא בָ֔/הּ תּוֹדָ֖ה וְ/ק֥וֹל זִמְרָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/003.yaml
  text: For Yahweh comforts Zion[a]; he comforts all her ruins. He makes her wilderness like Eden, and her desert like the garden of Yahweh. Joy and gladness will be found in her[d][c][b], thanksgiving and the sound of song.
translation:
  language: zh_hans
  text: 因为耶和华安慰锡安，安慰她一切的废墟；他使她的旷野如伊甸，使她的荒原如耶和华的园子。在她那里必寻见欢喜和快乐、感谢和歌唱的声音。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明此前劝勉与应许的根据，保留因果关系。
- source_word: נִחַם
  choice: 安慰
  rationale: 此处以锡安及其废墟为对象，含恢复、抚慰之意；汉语现在式可表达先知性应许的确定性，而不强行限定为过去或将来。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中通行的神名音译，保留原文专名而不以称号替代。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用该地名及人格化城市名称的通行汉语译名。
- source_word: כָּל חָרְבֹתֶיהָ
  choice: 她一切的废墟
  rationale: חָרְבוֹת 指遭毁坏、荒废之处；“废墟”具体自然，也契合城市复兴的语境。
- source_word: וַיָּשֶׂם
  choice: 他使
  rationale: 在先知性话语中描写确定的复兴行动；汉语不标时态，可保留原文在既成确定性与未来实现之间的张力。
- source_word: מִדְבָּרָהּ
  choice: 她的旷野
  rationale: מִדְבָּר 常指旷野或荒漠；“旷野”与下句 עֲרָבָה 的“荒原”保持词义区别。
- source_word: כְּעֵדֶן
  choice: 如伊甸
  rationale: 保留专名及其对《创世记》园子意象的呼应，不泛化为“乐园”。
- source_word: וְעַרְבָתָהּ
  choice: 她的荒原
  rationale: עֲרָבָה 指干旱平原、荒漠地带；“荒原”自然简洁，并与“旷野”有所区别。
- source_word: כְּגַן יְהוָה
  choice: 如耶和华的园子
  rationale: 直接保留所属关系及与伊甸园的平行意象。
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: 欢喜和快乐
  rationale: 保留两个近义名词构成的节庆喜乐表达，语言通俗而庄重。
- source_word: יִמָּצֵא בָהּ
  choice: 必在她里面找到
  rationale: 贴近尼法勒式“被找到、存在于”的表达；“必”传达复兴应许的确定性。
- source_word: תּוֹדָה וְקוֹל זִמְרָה
  choice: 感谢和歌唱的声音
  rationale: תּוֹדָה 在敬拜语境中可指感谢、称谢；קוֹל זִמְרָה 直指歌唱或乐歌之声。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名；译文保留为专名。现代简体中文普通读者最熟悉“耶和华”，同时不以“主”这一称号替换原名。
- issue: 复兴预言中的动词时间与体貌
  choice: “安慰／使”配合“必……找到”
  alternative: 统一译成过去式或统一加“将要”
  rationale: 希伯来文以完成式和叙事形式表达确定的复兴行动，而 יִמָּצֵא 明示未完成形式。汉语前两句不强标时态，末句用“必”，可保存先知话语的鲜活确定性和未来指向。
- issue: 锡安的人格化阴性指称
  choice: 她
  alternative: 它／那里
  rationale: 原文连续使用阴性单数后缀指向锡安。用“她”保留城市人格化，不把意象消解为纯地点说明。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语；保留诗歌平行结构和锡安的女性人格化。原文没有必须借脚注处理而正文无法承载的异文或歧义，因此不设脚注。
