  text: וְ/אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ רֹגַ֣ע הַ/יָּ֔ם וַ/יֶּהֱמ֖וּ גַּלָּ֑י/ו יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/015.yaml
  text: For I am Yahweh your God[b][a], who stirs up the sea so that its waves roar— Yahweh of hosts is his name.
translation:
  language: zh_hans
  text: 因为我，耶和华，是你的神；我搅动海[a]，使它的波浪轰鸣。万军之耶和华是他的名[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “搅动”也可译作“使……平静”。原文这个词可按语境表示搅动或平息；本句随后说海浪轰鸣，因此正文采用“搅动”。
    reason: lexical_alternative
  - marker: b
    text: 原文是“万军之耶和华是他的名”，使用第三人称“他的”；有些译本按直接引语顺译为“是我的名”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: 因为我是
  rationale: 连接词在上下文中引出解释和保证，独立代词又强调说话者；译作“因为我是”兼顾承接关系与第一人称的强调。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，与作为称号的“主”相区别。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 直接体现第二人称阳性单数后缀；中文无需标示语法性别。
- source_word: רֹגַע הַיָּם
  choice: 我搅动大海
  rationale: רגע在此可有“搅动”或“使平静”的理解；下句海浪咆哮更支持“搅动”。将希伯来语分词按前句第一人称自然译出。
- source_word: וַיֶּהֱמוּ גַּלָּיו
  choice: 使海浪咆哮
  rationale: 将前后动作理解为结果关系；“咆哮”自然传达 המה 所描写的轰鸣翻腾。后缀所指已由“大海”明确，中文用“海浪”比“它的浪”自然。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留传统且准确的神圣称号，表达统领众军的大能与威严。
- source_word: שְׁמוֹ
  choice: 是他的名
  rationale: 严格保留马所拉文本的第三人称单数后缀，不顺改为直接引语中更常见的“是我的名”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是简体中文圣经传统中最通行、最易被普通读者识别的神名形式；保留专名，不以“主”替代。
- issue: רֹגַע 描述大海时的语义
  choice: 我搅动大海
  alternative: 我使大海平静
  rationale: 该词存在真实词义歧义，但紧随其后的“海浪咆哮”在本句中更支持搅动海水的理解；以脚注保存另一可能。
- issue: שְׁמוֹ 在神直接说话中的人称
  choice: 是他的名
  alternative: 是我的名
  rationale: 希伯来文本明确使用第三人称“他的”；虽在直接引语中显得突兀，仍予保留，以免默默消解原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句号划分突出神掌管海洋的行动以及末尾的神圣称号；保留原文第三人称所产生的突兀感。
