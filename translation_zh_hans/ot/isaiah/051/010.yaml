id: ISA.51.10
reference: Isaiah 51:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/ל֤וֹא אַתְּ הִיא֙ הַ/מַּחֲרֶ֣בֶת יָ֔ם מֵ֖י תְּה֣וֹם רַבָּ֑ה הַ/שָּׂ֨מָה֙ מַֽעֲמַקֵּי יָ֔ם דֶּ֖רֶךְ לַ/עֲבֹ֥ר גְּאוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/010.yaml
  text: Was it not you who dried up the sea[a], the waters of the great deep[b], who made the depths of the sea a way for the redeemed to cross over?
translation:
  language: zh_hans
  text: 难道不正是你使海和大深渊的水干涸，使海的深处成为道路，让蒙救赎的人[a]走过吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被赎回的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אַתְּ הִיא
  choice: 难道不正是你
  rationale: הֲלוֹא引出预期肯定回答的反问；אַתְּ הִיא带强调意味。用“难道不正是你”既保留反问，也自然传达强调。希伯来语阴性单数形式承接上文阴性名词“膀臂”，现代汉语第二人称无须标示语法性别。
- source_word: הַמַּחֲרֶבֶת
  choice: 使……干涸
  rationale: 该使役分词在此以海水为宾语，表示使之变干；“使……干涸”符合出海事件的图景，也庄重自然。
- source_word: יָם
  choice: 海
  rationale: 按原词直译为“海”，保留对出埃及过海事件的暗示，而不在正文中将其明确限定为某一片海。
- source_word: מֵי תְּהוֹם רַבָּה
  choice: 大深渊的水
  rationale: 保留构词关系及תְּהוֹם所带的深广、原初水域意象；“大深渊的水”在现代汉语中清楚而有诗性。
- source_word: הַשָּׂמָה
  choice: 使……成为
  rationale: שׂים在此表示把海的深处设为可通行之路；“使……成为”准确表达结果关系。
- source_word: מַעֲמַקֵּי יָם
  choice: 海的深处
  rationale: 保留复数所概括的海中深处意象，同时采用自然的汉语表达。
- source_word: דֶּרֶךְ
  choice: 道路
  rationale: 既可指实际通行之路，也能保留救赎叙事中的象征张力；“道路”比“路”略显庄重。
- source_word: לַעֲבֹר
  choice: 走过
  rationale: עבר在此指从海中通行、越过；“走过”简洁自然，并与“道路”搭配顺畅。
- source_word: גְּאוּלִים
  choice: 蒙救赎的人
  rationale: 该词是גאל的被动分词复数，指已经得到救赎或赎回的人。“蒙救赎的人”保留被动含义和以赛亚书中的救赎用语，同时避免将其窄化为单纯的金钱赎买。
theological_decisions:
- issue: 出埃及暗示与救赎意象的范围
  choice: 正文只译作“海”，直接保留海中开路和蒙救赎者走过的图景，不明说“红海”或“芦苇海”。
  alternative: 在正文中明确译为“红海”，或把整节泛化为纯粹象征性的拯救。
  rationale: 原文明显唤起出埃及过海事件，同时在以赛亚书语境中又承载更广的复兴与救赎盼望。保留“海”可兼顾历史暗示和更宽广的神学意蕴。
- issue: גְּאוּלִים的救赎与赎回含义
  choice: 正文采用“蒙救赎的人”。
  alternative: 译为“被赎回的人”。
  rationale: 词根גאל可强调亲属赎回、释放或救赎；“蒙救赎的人”在此与全书的救赎主题自然衔接，而脚注保留较具体的“被赎回”读法。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“难道不正是你”传达原文强调；两个“使”保留平行结构。正文不补出“红海”等解释性专名，以保存原文的历史暗示与诗性张力。
