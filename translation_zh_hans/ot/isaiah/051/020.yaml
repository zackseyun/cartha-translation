base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/020.yaml
  text: Your sons have fainted[a]; they lie at the head of every street, like an antelope in a net, full of the wrath of Yahweh[b], the rebuke of your God.
translation:
  language: zh_hans
  text: 你的儿子们已经昏厥，倒卧在各街口[a]，像落网的羚羊[b]；他们饱受雅威的烈怒和你上帝的斥责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在每条街的头部”，可能指各街口、街角或街道端头。
    reason: lexical_alternative
  - marker: b
    text: 或译“像野牛落在网中”。希伯来语所指的动物不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַיִךְ
  choice: 你的儿子们
  rationale: בֵּן的复数形式带第二人称阴性单数后缀，直译为“你的儿子们”；保留原文的性别指向。
- source_word: עֻלְּפוּ
  choice: 昏厥了
  rationale: 该被动完成式表示因极度困苦或衰弱而昏倒；“昏厥了”准确而自然。
- source_word: שָׁכְבוּ
  choice: 倒卧
  rationale: 既表达“躺卧”的状态，也与前面的昏厥相衔接，呈现倒在街头的景象。
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: 在各街口
  rationale: רֹאשׁ本义为“头、起点”；用于街道时很可能指街口或街道端头。“各街口”符合现代汉语习惯，字面信息另见脚注。
- source_word: כְּתוֹא
  choice: 像羚羊
  rationale: תּוֹא所指的具体野生动物不能确定；“羚羊”可自然呈现被猎网捕获的野兽形象，同时以脚注保留另一译法。
- source_word: מִכְמָר
  choice: 落在网中
  rationale: מִכְמָר指捕捉动物的网；“落在网中”符合汉语对受困猎物的自然表达。
- source_word: חֲמַת יְהוָה
  choice: 雅威的烈怒
  rationale: חֵמָה表示炽烈的愤怒；“烈怒”保留其强度，יהוה按项目惯例译作“雅威”。
- source_word: גַּעֲרַת אֱלֹהָיִךְ
  choice: 你上帝的斥责
  rationale: גְּעָרָה指严厉、有权威的责斥；“斥责”清楚而有力度。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，并与本项目既定译法一致。
- issue: “雅威的烈怒”与“你上帝的斥责”的关系
  choice: 用破折号呈现同位或解释关系
  alternative: 用“和”连接为两个并列对象
  rationale: 希伯来文两个名词短语之间没有连接词，后者很可能重述并解释前者。破折号保留这种紧密关系，又不把语法可能性绝对化。
- issue: תוא所指动物
  choice: 羚羊
  alternative: 野牛
  rationale: 具体物种无法确定，且不影响经文的神学重点；正文采用较通行、形象清楚的译法，脚注保留传统替代译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“昏厥了”“倒卧”“满受”保持灾难场景的凝重感；正文避免古奥措辞，并以脚注保存地点表达和动物名称的不确定性。
