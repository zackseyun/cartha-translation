base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/014.yaml
  text: The one bent low will soon be set free[a]; he will not die in the pit[b], and his bread will not be lacking.
translation:
  language: zh_hans
  text: 那屈身受压的人很快就会得到释放[a]；他必不死在坑中[b]，他的食物也必不缺少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被掳的人很快就会获释。”希伯来语这一表达含义较难确定，可能描绘一个因受压迫而屈身、随后获得释放的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他必不死在牢坑里。”希伯来语“坑”可指实际的坑、牢坑，也可比喻毁灭或坟墓。
    reason: alternative_reading
lexical_decisions:
- source_word: מִהַר
  choice: 很快就会
  rationale: 该形式表达迅速或临近；这里用“很快就会”自然传达先知性应许即将实现的意味。
- source_word: צֹעֶה
  choice: 屈身受压的人
  rationale: 此词含义较难确定，可指屈身、蜷伏或受拘禁者。“屈身受压的人”保留受压而低伏的形象，又不把所指限定为囚犯。
- source_word: לְהִפָּתֵחַ
  choice: 得到释放
  rationale: 字面义与“被打开”有关，但在此语境中指解除拘禁或压迫；“得到释放”符合现代汉语表达。
- source_word: וְלֹא יָמוּת
  choice: 他必不死
  rationale: 直接保留否定未完成式所表达的保证，并以“必”体现应许的确定性，而非另加时间含义。
- source_word: לַשַּׁחַת
  choice: 在坑中
  rationale: שחת可指坑、牢坑、坟墓或毁灭。“坑”保留具体意象，也容许监禁与死亡的双重联想。
- source_word: וְלֹא יֶחְסַר לַחְמוֹ
  choice: 他的食物也必不缺少
  rationale: לֶחֶם本义为饼，也常泛指食物。此处译作“食物”在现代汉语中更自然，并保留供应不缺的含义。
theological_decisions:
- issue: 受压者的身份
  choice: 按希伯来语保留单数个体表述，同时让其可代表受压或被掳的群体
  alternative: 明确译为某个囚犯，或直接改为复数的被掳者
  rationale: 原文使用单数形式，语境又可能使此人具有代表性；译文不把这一张力限定为某一特定人物或仅仅一个囚犯。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“屈身受压”保留原文意象与词义不确定性；“得到释放”清楚表达语境中的惯用义。分号呈现释放、免死与得供应三层并列应许。
