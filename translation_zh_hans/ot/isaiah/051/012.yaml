  text: אָנֹכִ֧י אָנֹכִ֛י ה֖וּא מְנַחֶמְ/כֶ֑ם מִֽי אַ֤תְּ וַ/תִּֽירְאִי֙ מֵ/אֱנ֣וֹשׁ יָמ֔וּת וּ/מִ/בֶּן אָדָ֖ם חָצִ֥יר יִנָּתֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/012.yaml
  text: I[a], I am he who comforts you. Who are you that you fear man, who dies, and the son of man, who is made like grass?
translation:
  language: zh_hans
  text: “我，我就是安慰你们的那一位。你是谁，竟惧怕那必死的人，又惧怕那必如青草的人子[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“人子”是希伯来语中指普通人的说法，与前面的“人”平行；在本节中不是弥赛亚称号。
    reason: 说明希伯来语习语，避免中文“人子”可能引起的称号联想，同时保留正文的字面译法。
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי הוּא
  choice: 我，我就是……的那一位
  rationale: 保留第一人称代词的重复和强调；“就是……的那一位”自然表达 הוּא 在自我宣告句式中的强调作用。
- source_word: מְנַחֶמְכֶם
  choice: 安慰你们的
  rationale: 分词表示持续或特征性的行动；“安慰你们的那一位”既自然，也保留原文复数受词。
- source_word: מִי אַתְּ וַתִּירְאִי
  choice: 你是谁，竟惧怕
  rationale: 保留直接的反问语气；“竟”传达此处责问和反差的修辞力量。希伯来文的“你”是阴性单数，现代汉语不在口语代词或动词上标示这一语法信息。
- source_word: אֱנוֹשׁ יָמוּת
  choice: 必死的世人
  rationale: אֱנוֹשׁ 突出人的脆弱有限，יָמוּת 表明死亡的必然性；“必死的世人”简洁呈现两者。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 直译该词组，以保留它与前半句“世人”之间的诗歌平行和原文措辞；脚注说明此处通常指普通人类，避免把上下文中的含义预先限定为称号。
- source_word: חָצִיר יִנָּתֵן
  choice: 必如青草
  rationale: 这里以青草比喻人的短暂脆弱。中文用“必如青草”自然传达结果性的比较，也避免生硬直译为“被置为青草”。
theological_decisions:
- issue: 非弥赛亚语境中 בֶּן אָדָם 的译法
  choice: 人子
  alternative: 世人／凡人
  rationale: 本节中该词组与 אֱנוֹשׁ 平行，主要强调普通人的有限和必朽；正文保留“人子”以呈现希伯来文纹理，脚注则说明其语境义，不把它自动解释为弥赛亚称号。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留开头“我，我”的强烈重复和全句的反问语势；用“你们”对应复数受词，用“你”对应随后阴性单数的拟人化称呼，但不在正文中额外解释其所指。
