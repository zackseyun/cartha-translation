  text: לָ/כֵ֛ן שִׁמְעִי נָ֥א זֹ֖את עֲנִיָּ֑ה וּ/שְׁכֻרַ֖ת וְ/לֹ֥א מִ/יָּֽיִן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/021.yaml
  text: 'Therefore, please hear this, afflicted one, drunk, but not from wine:'
translation:
  language: zh_hans
  text: 所以，请听这话，你这受苦的人；你醉了，却不是因酒而醉：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出由此而来的劝告，符合该连接词的推论意味。
- source_word: שִׁמְעִי נָא
  choice: 请听
  rationale: 阴性单数命令式指向拟人化的锡安；נָא带有恳请、敦促语气，用“请”自然表达。
- source_word: עֲנִיָּה
  choice: 受苦的人
  rationale: 该阴性形式描述遭受困苦、压迫者；用“受苦的人”既保留称呼功能，也不将含义缩窄为贫穷。
- source_word: וּשְׁכֻרַת
  choice: 你醉了
  rationale: 阴性单数状态描述，直译其醉态，并以第二人称与前面的直接称呼衔接。
- source_word: וְלֹא מִיָּיִן
  choice: 却不是因酒而醉
  rationale: 保留原文的强烈反差；补出“而醉”使现代汉语完整清楚，同时不解释其隐喻所指。
theological_decisions:
- issue: “醉”是否解释为承受上帝忿怒或审判
  choice: 正文保留“醉了，却不是因酒而醉”的隐喻
  alternative: 译作“因上帝的忿怒而踉跄”之类的解释性表达
  rationale: 上下文会展开杯与忿怒的意象，但本节本身刻意否定普通酒醉；不在此处提前消解隐喻及其张力。
translation_notes:
  register: 采用现代、庄重且易懂的直接呼告。“所以，请听这话”保留推论和恳请语气；分号区分称呼与醉态描述，冒号保留其引出下文的功能。
