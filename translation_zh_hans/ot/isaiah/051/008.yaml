revisions:
- from: 因为蛀虫必像吃衣服一样吃掉他们，虫子也必像吃羊毛一样吃掉他们；但我的公义[a]必存到永远，我的救恩必延续世世代代。
  to: 因为衣蛾必吞蚀他们，如同吞蚀衣服；蛀虫必吞蚀他们，如同吞蚀羊毛；但我的公义[a]必存到永远，我的救恩必存到世世代代。
  rationale: 修订主要澄清两组比较结构，并以“衣蛾／蛀虫”对应原文两个不同的虫类词：前者按עָשׁ的通常含义译出，后者对语义不完全确定的סָס保持宽泛。其余保留草稿的“公义”“救恩”及其脚注处理。
