base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/008.yaml
  text: For the moth will eat them like a garment[a], and the worm will eat them like wool; but my righteousness will be forever, and my salvation to generation after generation.
translation:
  language: zh_hans
  text: 因为衣蛾必吞蚀他们，如同吞蚀衣服；蛀虫必吞蚀他们，如同吞蚀羊毛；但我的公义[a]必存到永远，我的救恩必存到世世代代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正义”。此希伯来词既可指道德上的正直，也可指正义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的劝勉说明理由，保留因果关系。
- source_word: כַבֶּגֶד יֹאכְלֵם עָשׁ
  choice: 蛀虫必像吃衣服一样吃掉他们
  rationale: 保留“吃”的鲜明意象，并以自然汉语明确衣物遭蛀虫吞蚀的比喻关系。
- source_word: וְכַצֶּמֶר יֹאכְלֵם סָס
  choice: 虫子也必像吃羊毛一样吃掉他们
  rationale: סָס所指并不完全确定，可能是毁坏织物的幼虫；译作较宽泛的“虫子”，避免过度限定，并保留与上句的平行。
- source_word: וְצִדְקָתִי
  choice: 但我的公义
  rationale: 连词按上下文的强烈对比译为“但”；“公义”保留צְדָקָה所涵盖的正直、正义及信实行动等较宽语义。
- source_word: לְעוֹלָם תִּהְיֶה
  choice: 必存到永远
  rationale: 自然表达持续存在至永远的含义。
- source_word: וִישׁוּעָתִי
  choice: 我的救恩
  rationale: יְשׁוּעָה在本段指上帝施行的拯救；“救恩”简洁且符合以赛亚书语境。
- source_word: לְדֹר דּוֹרִים
  choice: 必延续世世代代
  rationale: 体现一代接一代持续不止的迭代意义，同时使汉语句子完整自然。
theological_decisions:
- issue: צִדְקָה在先知文学中的译法
  choice: 公义
  alternative: 正义
  rationale: 此词既可指道德上的正直，也可涉及施行正义及信守关系的行动。“公义”能保留较宽的神学语义，而脚注保存“正义”这一真实可能。
- issue: יְשׁוּעָה的译法
  choice: 救恩
  alternative: 拯救
  rationale: 上下文强调上帝持久的救赎作为；“救恩”与“公义”形成庄重的诗歌并列，但不排除行动性更强的“拯救”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保持希伯来诗歌的两组平行与短暂无常和永恒救恩之间的对比；对סָס不作过度具体化。
