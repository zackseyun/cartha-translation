    rationale: 希伯来文意为蛀食衣物的虫“如同吞蚀衣服／羊毛那样吞蚀他们”。草稿的“必像吃衣服一样吃掉他们”虽可理解，却较口语化且句法负担重；改写可清晰保留比喻。
  - severity: low
