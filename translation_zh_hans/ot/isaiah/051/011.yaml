  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/פְדוּיֵ֨י יְהוָ֜ה יְשׁוּב֗וּ/ן וּ/בָ֤אוּ צִיּוֹן֙ בְּ/רִנָּ֔ה וְ/שִׂמְחַ֥ת עוֹלָ֖ם עַל רֹאשָׁ֑/ם שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יַשִּׂיג֔וּ/ן נָ֖סוּ יָג֥וֹן וַ/אֲנָחָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/011.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing[a]; everlasting joy will be upon their heads; gladness and joy will overtake them[b]; sorrow and sighing will flee away.
translation:
  language: zh_hans
  text: 耶和华所救赎的人必归回，欢呼着[a]来到锡安；永远的喜乐必临到他们头上；欢欣和喜乐必追上他们[b]，忧愁和叹息都必逃去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“歌唱着”；希伯来词既可指喜乐的欢呼，也可指欢唱。
    reason: lexical_alternative
  - marker: b
    text: 或译：“欢欣和喜乐必临到他们”；原文动词本义为“赶上、追上”，在这里把喜乐描绘成追赶他们并追上他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְדוּיֵי
  choice: 赎回的人
  rationale: 该词是פדה的被动分词复数，指被赎出、获救赎的人；“赎回的人”既保留救赎意象，也符合现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”直译四字神名，不以称号替代。
- source_word: יְשׁוּבוּן
  choice: 必归回
  rationale: שוב在此表示返回；“归回”适合复兴预言的语境，并保留回归故土的意味。
- source_word: וּבָאוּ
  choice: 来到
  rationale: בוא意为“来、来到”；与前面的“归回”连用，表达回归并抵达锡安。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 保留希伯来专名及其诗歌和神学意蕴，不改释为耶路撒冷。
- source_word: בְּרִנָּה
  choice: 欢呼着
  rationale: רִנָּה可指欢乐的高声呼喊，也可包含歌唱；“欢呼着”较直接地保留声音响亮、喜庆的色彩。
- source_word: שִׂמְחַת עוֹלָם
  choice: 永远的喜乐
  rationale: 该结构直指持续到永远的喜乐；此译简洁自然，并保留עוֹלָם的久远、恒常含义。
- source_word: עַל רֹאשָׁם
  choice: 临到他们头上
  rationale: 保留“在头上”的诗歌图像，同时用“临到”使中文通顺，呈现喜乐如冠冕般落在他们头上的意象。
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: 欢欣和喜乐
  rationale: 用两个近义而不完全相同的中文词，对应希伯来文并列的两个喜乐词，避免合并或重复为同一词。
- source_word: יַשִּׂיגוּן
  choice: 必追上他们
  rationale: נשׂג的使役式在此有赶上、追及之意；“追上”保留欢欣喜乐被拟人化、追赶并赶上他们的生动图像。
- source_word: נָסוּ
  choice: 都必逃去
  rationale: 虽为完成式形态，但在未来复兴的预言语境中表达随之出现的结果；“必逃去”保留未来指向和拟人化图像。
- source_word: יָגוֹן וַאֲנָחָה
  choice: 忧愁和叹息
  rationale: 分别对应悲痛与叹息，语言自然庄重，也维持诗句中两项苦难经验的并列。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文稿采用广为普通读者识别的专名“耶和华”，不以“主”这一称号取代，也不额外加入宗派性解释。
- issue: נָסוּ在预言诗歌中的时间指向
  choice: 未来／结果：“都必逃去”
  alternative: 完成时：“已经逃去”
  rationale: 尽管希伯来文采用完成式，该分句置于未来归回与复兴的语境，并与前面的未完成式陈述构成结果关系；译为未来更能传达整句的预言走向，同时不否认原文形式。
- issue: 喜乐“在头上”的意象
  choice: 保留身体与冠冕式图像：“临到他们头上”
  alternative: 抽象化为“他们必永远喜乐”
  rationale: 原文明确说喜乐在他们头上，可能唤起冠冕或笼罩其身的诗意；保留这一张力，避免把图像化表达改成抽象命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。诗句保持希伯来文的平行结构与拟人意象；用“欢呼着”自然连接两个连续动词，并在脚注中保留“歌唱着”的词义可能。所有脚注标记均已置于正文相应位置。
