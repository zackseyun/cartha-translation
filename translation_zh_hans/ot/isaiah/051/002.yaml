base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/002.yaml
  text: Look to Abraham your father and to Sarah who bore you; for I called him when he was one[a], and I blessed him and multiplied him.
translation:
  language: zh_hans
  text: 你们要仰望你们的父亲亚伯拉罕，和那生你们的撒拉；因为我呼召他的时候，他不过是一个人[a]；我赐福给他，使他繁衍增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一”或“一人”；也可译作“他孤身一人”。
    reason: 保留 אֶחָד 的字面表达，并提示其“孤身一人”的可能语境性理解。
lexical_decisions:
- source_word: הַבִּיטוּ
  choice: 仰望
  rationale: 复数命令式；保留“观看”的形象，同时表达以亚伯拉罕和撒拉为鉴的劝勉意味。
- source_word: אַבְרָהָם אֲבִיכֶם
  choice: 你们的父亲亚伯拉罕
  rationale: 保留原文亲属与圣约性的“父亲”称谓，不泛化为“祖先”。
- source_word: שָׂרָה תְּחוֹלֶלְכֶם
  choice: 生你们的撒拉
  rationale: 该动词可指生产及产痛；此译自然凝练，并保留撒拉作为民族之母的形象。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述劝勉的根据。
- source_word: אֶחָד
  choice: 只是一个人
  rationale: 原文直译为“一”；结合上下文，指亚伯拉罕蒙召时仅为一人，并与后来增多形成对照。脚注保留更贴字面的表达及“孤身一人”的可能理解。
- source_word: קְרָאתִיו
  choice: 我呼召他
  rationale: 准确表达神主动召唤亚伯拉罕，并保留其圣约语境。
- source_word: וַאֲבָרְכֵהוּ
  choice: 我赐福给他
  rationale: 直接传达 ברך 的含义及圣约色彩。
- source_word: וְאַרְבֵּהוּ
  choice: 使他人数增多
  rationale: 使役形态意为“使之增多”；如此表达能自然说明由一人繁衍成众多后裔的语境，又不把宾语擅自改作“后裔”。
theological_decisions:
- issue: אֶחָד 所指的亚伯拉罕蒙召时的状态
  choice: 他只是一个人
  alternative: 他是一个；他孤身一人
  rationale: “一个人”保留“一”的核心含义，并清楚呈现神从一人兴起众民的神学张力；“孤身一人”可能暗示没有撒拉相伴，解释性较强，故列入脚注而不放入正文。
- issue: וְאַרְבֵּהוּ 的宾语范围
  choice: 使他人数增多
  alternative: 使他增多；使他的后裔增多
  rationale: 希伯来文代词宾语指亚伯拉罕本人，但实际含义涉及由他而出的众多人口；正文避免补入原文没有明说的“后裔”，同时使现代汉语可理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仰望”延续先知性劝勉的形象；两个“仰望”使并列结构清楚。“只是一个人”与“人数增多”形成原文所强调的鲜明对照。
