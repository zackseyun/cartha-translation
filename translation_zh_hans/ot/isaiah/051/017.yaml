revisions:
- from: 醒来，醒来！起来吧，耶路撒冷！你曾从雅威手中喝了他烈怒的杯；那使人踉跄的杯，你连碗[a]都喝了，喝得一滴不剩。
  to: 醒来，醒来；起来吧，耶路撒冷！你曾从雅威手中喝过他烈怒的杯；你喝了那碗状的、使人踉跄的杯，把它喝得一滴不剩。
  rationale: 修订仅处理后半句中饮器与所饮之物混淆的问题，并保留原文的重复、审判之杯的隐喻、踉跄的效果及“饮尽”的强化语气。脚注相应改锚定于“碗状的……杯”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:21:52Z'
review_pass:
  verdict: revise
  source_fidelity: 译文正确保留了三重命令、雅威之手、烈怒之杯和彻底饮尽的审判隐喻。不过“你连碗都喝了”在汉语中会自然理解为把盛器本身喝下，未能忠实表达原文中“碗状饮器／杯”的复合意象，也使“碗”与“杯”的关系倒置。
  naturalness: 前半句庄重、流畅。后半句“那使人踉跄的杯，你连碗都喝了”语序和搭配不自然；改以“碗状的……杯”说明该饮器的形状，并以“把它喝得一滴不剩”明确所饮的是杯中之物。
  terminology: “雅威”“烈怒”“使人踉跄”均可接受，且适合先知性、庄重的现代书面语。“碗状的……杯”既保留קֻבַּעַת与כּוֹס并置所造成的饮器意象，也避免将两者误作可分别饮用的物体。
  issues:
  - severity: medium
    issue: “你连碗都喝了”把饮器误表述为被喝下的对象。
    rationale: 原文的קֻבַּעַת与כּוֹס构成对碗状饮器／杯的复合描述，随后“喝了、饮尽”所指是杯中所盛的审判之饮。汉语“喝碗”可勉强省略内容物，但“连碗都喝了”明确表示连容器也吞下，造成意义偏移。
  - severity: low
    issue: “那使人踉跄的杯，你连碗都喝了”将“碗”置于“杯”之后，关系不清。
    rationale: 调整为“那碗状的、使人踉跄的杯”可自然呈现碗状饮器与使人踉跄之杯的意象，并保留原文重复提及饮器的强调。
  revised_text: 醒来，醒来；起来吧，耶路撒冷！你曾从雅威手中喝过他烈怒的杯；你喝了那碗状的、使人踉跄的杯，把它喝得一滴不剩。
  revised_footnotes:
  - marker: a
    text: “碗状的……杯”也可译作“杯盏”；原词指一种碗状的饮器。
    reason: lexical_alternative
  revision_rationale: 修订仅处理后半句中饮器与所饮之物混淆的问题，并保留原文的重复、审判之杯的隐喻、踉跄的效果及“饮尽”的强化语气。脚注相应改锚定于“碗状的……杯”。
