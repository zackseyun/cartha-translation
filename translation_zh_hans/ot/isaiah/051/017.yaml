  text: הִתְעוֹרְרִ֣י הִֽתְעוֹרְרִ֗י ק֚וּמִי יְר֣וּשָׁלִַ֔ם אֲשֶׁ֥ר שָׁתִ֛ית מִ/יַּ֥ד יְהוָ֖ה אֶת כּ֣וֹס חֲמָת֑/וֹ אֶת קֻבַּ֜עַת כּ֧וֹס הַ/תַּרְעֵלָ֛ה שָׁתִ֖ית מָצִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/017.yaml
  text: Awake[a], awake, rise up, Jerusalem, you who have drunk from the hand of Yahweh the cup of his wrath; you have drunk the bowl, the cup of staggering[c][b]; you have drained it dry.
translation:
  language: zh_hans
  text: 醒来，醒来；起来吧，耶路撒冷！你曾从雅威手中喝过他烈怒的杯；你喝了那碗状的、使人踉跄的杯，把它喝得一滴不剩。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְעוֹרְרִי הִתְעוֹרְרִי
  choice: 醒来，醒来
  rationale: 重复的阴性单数命令式直接呼唤被拟人化的耶路撒冷；汉语“醒来”自然有力，重复保留催促感。
- source_word: קוּמִי
  choice: 起来吧
  rationale: 保留起身、站起的命令，并与前面的“醒来”形成自然的诗歌呼召。
- source_word: מִיַּד יְהוָה
  choice: 从雅威手中
  rationale: 保留“从……手中”的希伯来语施事／来源意象，并将神名明确译作“雅威”。
- source_word: כּוֹס חֲמָתוֹ
  choice: 他烈怒的杯
  rationale: 保留先知文学中饮杯承受神震怒的隐喻；“烈怒”传达 חֵמָה 的强烈程度。
- source_word: קֻבַּעַת
  choice: 碗
  rationale: 该词指碗状饮器；译为“碗”清楚地区别于 כּוֹס“杯”，并以脚注提示也可理解为杯盏。
- source_word: כּוֹס הַתַּרְעֵלָה
  choice: 使人踉跄的杯
  rationale: תַּרְעֵלָה 指饮后摇晃、踉跄的效果；采用作用性表达，比传统的“战兢之杯”更贴近词义。
- source_word: שָׁתִית מָצִית
  choice: 喝了，喝得一滴不剩
  rationale: 保留两个动词的递进：先喝下，再彻底饮尽；现代汉语表达完整而有力度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”使专名性质清楚，不以称号替代。
- issue: 烈怒之杯的隐喻
  choice: 完整保留饮杯的审判意象
  alternative: 意译为“承受他的惩罚”
  rationale: 原文将耶路撒冷所受的神圣审判描绘为从雅威手中饮下烈怒之杯；保留这一意象及其神学张力，不将其抽象化。
- issue: “从雅威手中”的施事含义
  choice: 正文保留原有身体意象
  alternative: 译为“受了雅威所降的”
  rationale: 直译既表明苦难来自雅威的审判行动，也避免加入原文没有的解释性措辞。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以短促重复和感叹号呈现命令的紧迫感；保留“手”“杯”“碗”和“踉跄”等具体意象，同时调整后半句语序，使两个“喝”动词在中文里形成自然递进。
