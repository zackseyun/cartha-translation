source:
  edition: WLC
  text: וָ/אָשִׂ֤ים דְּבָרַ/י֙ בְּ/פִ֔י/ךָ וּ/בְ/צֵ֥ל יָדִ֖/י כִּסִּיתִ֑י/ךָ לִ/נְטֹ֤עַ שָׁמַ֨יִם֙ וְ/לִ/יסֹ֣ד אָ֔רֶץ וְ/לֵ/אמֹ֥ר לְ/צִיּ֖וֹן עַמִּ/י אָֽתָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/016.yaml
  text: And I have put my words in your mouth[a], and covered you with the shadow of my hand, to plant the heavens and to found the earth, and to say to Zion[b], ‘You are my people.’
translation:
  language: zh_hans
  text: 我已把我的话放在你口中，用我手的荫影遮护你[a]，为要栽植诸天[b]，奠立大地，并对锡安说：“你是我的子民。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把你遮藏在我手的荫影里”，或“把你遮护在我手的荫影之下”。
    reason: 希伯来介词בְּ在此既可表示凭借手的荫影来遮护，也可表示处于手的荫影里或之下。
  - marker: b
    text: “栽植诸天”是希伯来原文不寻常的说法；也可按其含义译作“建立诸天”。这一意象可能使人联想到创造，也可能使人联想到如同新创造的复兴。
    reason: 原文动词נטע通常指“栽种、栽植”，与“诸天”搭配形成刻意而罕见的意象，宜在正文保留，并在脚注说明可能含义。
lexical_decisions:
- source_word: וָאָשִׂים
  choice: 我已把……放在
  rationale: שׂים意为“放、安置”。结合后面的完成式כִּסִּיתִיךָ，此处采用已然表达；“已”也可体现行动已经成就或确然有效，但不排除希伯来叙述形式在语境中的其他时态分析。
- source_word: דְּבָרַי בְּפִיךָ
  choice: 我的话放在你口中
  rationale: דְּבָרַי是复数形式，现代汉语中集合性地译作“我的话”即可自然表达复数含义；“放在你口中”保留先知受托发言的原文意象。
- source_word: וּבְצֵל יָדִי כִּסִּיתִיךָ
  choice: 用我手的荫影遮护你
  rationale: בְּ既可作工具性理解，也可作方位性理解。“用……荫影”贴近句法，“遮护”兼顾כסה的“遮盖”本义及此处明显的保护意味；方位性译法列入脚注。
- source_word: לִנְטֹעַ שָׁמַיִם
  choice: 栽植诸天
  rationale: נטע通常意为“栽种、栽植”。尽管与“诸天”搭配罕见，仍保留这一鲜明意象，不改写成原文未用的“展开”或较宽泛的“建立”。
- source_word: וְלִיסֹד אָרֶץ
  choice: 奠立大地
  rationale: יסד意为“奠基、建立”。“奠立”在现代庄重汉语中简洁自然，并保留根基与创立的意象。
- source_word: וְלֵאמֹר לְצִיּוֹן
  choice: 并对锡安说
  rationale: אמר是普通的“说”，无需强化为“宣告”；保留锡安作为直接受话者。
- source_word: עַמִּי אָתָּה
  choice: 你是我的子民
  rationale: 原文以阳性单数“你”称呼人格化的锡安，随后用“我的子民”作身份认定。汉语如此表达自然，并保留圣约公式的意味。
theological_decisions:
- issue: 第二人称单数“你”的所指
  choice: 保留单数“你”，不在正文中指明其究竟是谁
  alternative: 明确译为仆人、先知，或作为整体的以色列／锡安
  rationale: 本节本身没有明说受话者身份。保留代词可避免在译文中提前裁定这位受话者是仆人、先知，还是人格化的以色列／锡安。
- issue: “栽植诸天、奠立大地”的宇宙性语言
  choice: 按原文保留创造性的宇宙意象
  alternative: 明确释为以色列复兴或新创造的比喻，或只按字面宇宙创造理解
  rationale: 以赛亚书常把创造与救赎复兴的语言交织在一起。正文不应把这组强烈的创造意象缩减成单一解释。
- issue: 三个目的／结果短语与前文的关系
  choice: 用“为要……并……”保留其共同目的结构，不补明执行者
  alternative: 明确说是上帝、受话者，或上帝借受话者来栽植诸天、奠立大地并向锡安说话
  rationale: 希伯来文连续使用ל不定式，但没有在这些短语内另行点明行动主体。译文保持句法开放性，避免加入原文未明说的施事者。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“荫影”比日常的“阴影”更适合表达保护性的荫蔽；“栽植诸天、奠立大地”保留诗歌的高昂气势与平行结构。脚注标记按其实际对应词组置于“遮护你”和“栽植诸天”之后，避免咨询层英文材料中标记位置与脚注内容错配。
