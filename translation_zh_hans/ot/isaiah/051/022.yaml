base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/022.yaml
  text: 'Thus says your Lord[a], Yahweh, and your God, who pleads the cause of his people: Behold, I have taken from your hand the cup of staggering, the bowl of the cup of my wrath[b]; you shall never again drink it.'
translation:
  language: zh_hans
  text: '你的主，雅威，你的上帝，就是为他子民申辩的那一位，如此说：


    “看哪，我已从你手中拿走那令人踉跄的杯[a]，


    就是那碗——我烈怒之杯[b]；


    你再也不会喝它了。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使人摇晃的杯”或“使人昏眩的杯”。希伯来语强调审判使人失去稳健、踉跄不定的效果。
    reason: lexical_alternative
  - marker: b
    text: 或译“我烈怒之杯的碗”或“我烈怒之杯的钵”。原文将“碗”和“杯”两种饮用器皿的意象叠加，以加强语势。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנַיִךְ יְהוָה וֵאלֹהַיִךְ
  choice: 你的主雅威、你的上帝
  rationale: 保留原文叠加的神圣称谓，并以“雅威”音译四字神名；中文通过顿号自然呈现同位关系。
- source_word: יָרִיב עַמּוֹ
  choice: 为他子民申辩的那一位
  rationale: ריב在此带有诉讼、为人争辩的司法色彩；“申辩”比泛泛的“保护”更贴近原文，同时在现代中文中清楚自然。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知话语中引人注意的指示力量和庄重语气。
- source_word: לָקַחְתִּי מִיָּדֵךְ
  choice: 我已从你手中拿走
  rationale: 既保留完成动作的语气，也保留杯原先在对方手中的具体意象。
- source_word: כּוֹס הַתַּרְעֵלָה
  choice: 那使人踉跄的杯
  rationale: תַּרְעֵלָה描述审判如烈酒般使人摇晃、失去稳健的效果；“使人踉跄”在现代中文中直观且保留隐喻。
- source_word: קֻבַּעַת כּוֹס חֲמָתִי
  choice: 我烈怒之杯的碗盏
  rationale: 尽量保留原文将“碗盏”和“杯”层叠使用的器皿意象，不把它简化为抽象的惩罚。
- source_word: לֹא תוֹסִיפִי לִשְׁתּוֹתָהּ עוֹד
  choice: 你再也不会喝它了
  rationale: 自然表达יסף加不定式及עוֹד所强调的终止和将来不再发生。
theological_decisions:
- issue: 神圣称谓的连续排列
  choice: 你的主雅威、你的上帝
  alternative: 主、你的雅威和你的上帝
  rationale: 原文把“你的主”“雅威”“你的上帝”连续用于同一位说话者。译文保留各称谓，又避免把“雅威”误解为受领属代词修饰的普通称号。
- issue: ריב的司法含义
  choice: 为他子民申辩
  alternative: 为他的子民争战／保护他的子民
  rationale: 此处可以含有争辩、争讼或维护案件的意味。“申辩”保留法庭背景，而不把行动限定为军事拯救。
- issue: 烈怒之杯的隐喻
  choice: 保留杯与碗盏的具体意象
  alternative: 意译为上帝所降的惩罚
  rationale: “烈怒之杯”是重要的圣经审判意象；保留原比喻可维持经文间的联系，也不替原文解释其全部神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“如此说”“看哪”保留先知宣告的正式语体；其余措辞避免文言化。诗行按宣告、取杯和不再饮用三个意群排列。
