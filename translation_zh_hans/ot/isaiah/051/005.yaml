id: ISA.51.5
reference: Isaiah 51:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: קָר֤וֹב צִדְקִ/י֙ יָצָ֣א יִשְׁעִ֔/י וּ/זְרֹעַ֖/י עַמִּ֣ים יִשְׁפֹּ֑טוּ אֵלַ/י֙ אִיִּ֣ים יְקַוּ֔וּ וְ/אֶל זְרֹעִ֖/י יְיַחֵלֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/005.yaml
  text: My righteousness is near[a], my salvation has gone out, and my arms will judge the peoples; the coastlands will wait for me[c][b], and for my arm they will hope.
translation:
  language: zh_hans
  text: 我的公义临近[a]，我的救恩已经发出；我的双臂[b]要审判万民。众海岛都要等候我[c]，仰望我的膀臂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”或“为我伸冤”。希伯来词 צֶדֶק 可随语境表达公义、正义或伸冤得直。
    reason: lexical_alternative
  - marker: b
    text: 原文此处是复数“我的双臂”，本节末尾则是单数“我的膀臂”；这意象指神所施展的能力。
    reason: lexical_alternative
  - marker: c
    text: “众海岛”也可译作“众海岛之地”或“遥远的海岸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: 临近
  rationale: 作谓语的形容词，表达空间或时间上的接近；“临近”简洁庄重，也不额外添加动作体貌。
- source_word: צִדְקִי
  choice: 我的公义
  rationale: צדק 可指公义、正义或伸冤；此处与“我的拯救”平行，“公义”保留其较宽广的救赎与治理内涵，另以脚注注明其他可能。
- source_word: יָצָא
  choice: 已经发出
  rationale: 完成式表示已经展开且具有当前效力的行动；“发出”保留原文具体的外出、发出意象。
- source_word: יִשְׁעִי
  choice: 我的拯救
  rationale: 该词表示拯救、解救；“拯救”在本段救恩宣告中自然清楚。
- source_word: וּזְרֹעַי
  choice: 我的双臂
  rationale: 原文为复数并带第一人称单数后缀；“双臂”在中文中自然地保留复数，同时延续上帝以膀臂施展能力的拟人意象。
- source_word: עַמִּים
  choice: 万民
  rationale: 表示多个民族或民众群体；“万民”是自然庄重的中文集合表达，并不要求数学意义上的全部。
- source_word: יִשְׁפֹּטוּ
  choice: 要审判
  rationale: שפט 可涵盖审判和治理；上下文有公义与万民，故保留核心司法意义。
- source_word: אֵלַי
  choice: 等候我
  rationale: 介词字面指向“我”，与 קוה 连用表达期待地等候；中文以“等候我”最为自然。
- source_word: אִיִּים
  choice: 众海岛之地
  rationale: 在《以赛亚书》中常泛指海岛、沿海地区或远方海域之地；正文采用兼顾意象与广义地域的表达，并在脚注保存其他译法。
- source_word: יְקַוּוּ
  choice: 都要等候
  rationale: 表达带着期待的等待；译作“等候”，与后句 יחל 的盼望语义形成既平行又有区别的措辞。
- source_word: וְאֶל זְרֹעִי
  choice: 仰望我的膀臂
  rationale: 原文此处为单数“我的膀臂”；“仰望”自然表达介词 אֶל 与 יחל 所构成的期待方向，同时保留身体隐喻。
- source_word: יְיַחֵלוּן
  choice: 仰望
  rationale: Piel 形式表达怀着盼望等候；“仰望”在现代中文中能自然承载期待和信赖，又避免与前句机械重复。
theological_decisions:
- issue: 救恩宣告中 צדק 的译法
  choice: 我的公义
  alternative: 我的正义；为我伸冤
  rationale: 本节把上帝的 צדק 与拯救、审判万民相连。“公义”保留其道德、治理和救赎层面的广度，不将其缩减为司法正义或个人伸冤；脚注保留真实的词义张力。
- issue: 上帝“臂／膀臂”的拟人意象
  choice: 正文保留“双臂／膀臂”
  alternative: 能力；大能
  rationale: 原文借身体意象描绘上帝积极施行审判和拯救的能力。直译能保存先知文学的形象；同时依原文分别呈现前处复数、后处单数。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公义—拯救—审判”保持原文神学与诗歌联系；前半句以分号连接行动，后半句保留“等候／仰望”的平行变化。所有脚注标记均置于正文相关词句之后。
