  text: הִנְ/נִ֣י מֵשִׁ֣יב אֶת צֵ֣ל הַֽ/מַּעֲל֡וֹת אֲשֶׁ֣ר יָרְדָה֩ בְ/מַעֲל֨וֹת אָחָ֥ז בַּ/שֶּׁ֛מֶשׁ אֲחֹרַנִּ֖ית עֶ֣שֶׂר מַעֲל֑וֹת וַ/תָּ֤שָׁב הַ/שֶּׁ֨מֶשׁ֙ עֶ֣שֶׂר מַעֲל֔וֹת בַּֽ/מַּעֲל֖וֹת אֲשֶׁ֥ר יָרָֽדָה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/008.yaml
  text: Behold[a], I will make the shadow go back ten steps, which had gone down on the steps of Ahaz by the sun[b]. And the sun went back ten steps on the steps on which it had gone down.
translation:
  language: zh_hans
  text: 看哪，我要使那在太阳照射下、在亚哈斯的台阶[b]上已经下移的影子往回退十阶[a]。于是，太阳就在它先前下移过的台阶上往回退了十阶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十阶”也可译作“十度”。原文的词本义是“台阶”或“上升处”；有人认为这里指一种台阶状的日影计时装置。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“亚哈斯的日晷”。原文直译为“亚哈斯的台阶”，可能指一座用来标示日影的设施。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: 保留郑重宣告和引人注意的语气；“看哪”在现代中文中庄重而可懂。
- source_word: מֵשִׁיב
  choice: 使……倒退
  rationale: 该词为使役形，译文明确保留“使……返回”的使役意义。
- source_word: צֵל
  choice: 影子
  rationale: 按字面指太阳所投下、作为兆头一部分的影子。
- source_word: מַעֲלוֹת
  choice: 台阶／级
  rationale: 该词本义为上升处或台阶。涉及亚哈斯的设施时译作“台阶”，计数时用自然的量词“级”，不把它直接解释为日晷的度数。
- source_word: בְמַעֲלוֹת אָחָז
  choice: 在亚哈斯的台阶上
  rationale: 贴近希伯来文，保留这座设施具体为何物的不确定性。
- source_word: בַּשֶּׁמֶשׁ
  choice: 借着太阳
  rationale: 表达影子的移动与太阳之间的媒介或成因关系，同时避免增添原文没有的机械解释。
- source_word: אֲחֹרַנִּית
  choice: 倒退
  rationale: 自然表达方向的逆转，并与 שוב 的返回含义共同呈现。
- source_word: עֶשֶׂר מַעֲלוֹת
  choice: 十级
  rationale: 保留数字及台阶意象；“级”适合中文对台阶层级的计数，也不排除“度数”的可能理解。
- source_word: וַתָּשָׁב הַשֶּׁמֶשׁ
  choice: 于是，太阳……倒退了
  rationale: 原文明确以“太阳”为主语，译文保留其观察性叙述，不改写成纯粹的影子变化。
- source_word: אֲשֶׁר יָרָדָה
  choice: 它曾往下移动的
  rationale: 保留下降方向。因希伯来文动词为阴性，而“太阳”通常为通性或阳性，该处存在所指或语法张力；中文用“它”保留一定开放性。
theological_decisions:
- issue: 太阳与影子之兆的性质
  choice: 按经文的观察性语言叙述影子和太阳的倒退，不对神迹作自然化解释。
  alternative: 只按日晷装置解释，或改写以避免太阳倒退的表述。
  rationale: 希伯来文明确先说影子倒退，随后说太阳倒退；译文应保留这种神迹性叙述及其张力，而不引入现代科学说明。
- issue: 末句阴性动词的所指
  choice: 正文以“它”承接，脚注说明语法上可能回指“影子”。
  alternative: 明确译为“影子曾往下移动”，或完全按“太阳曾往下移动”处理。
  rationale: 原文表层主语是“太阳”，但末尾 יָרָדָה 为阴性，更自然地与阴性名词“影子”呼应；不宜在正文中无提示地消除这一张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“看哪”保留先知性宣告的语体；“台阶”和“级”维持原文的具体意象，脚注交代“度”及日晷解释。正文不以现代天文学重述神迹，并保留末句在太阳与影子之间的语法张力。
