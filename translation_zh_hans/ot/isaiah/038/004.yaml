  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יְשַׁעְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/004.yaml
  text: Then the word of Yahweh came to Isaiah[a], saying,
translation:
  language: zh_hans
  text: 随后，雅威[a]的话临到以赛亚，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH；也可译作“耶和华”。
    reason: 说明四字神名及其另一种通行中文译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 随后……临到
  rationale: 未完成式连 waw 推进叙事，表示接着发生的事件；“随后”自然体现时序，“临到”则与整句的先知性启示公式相配。
- source_word: דְּבַר
  choice: 话
  rationale: 在“雅威的话临到……”这一固定先知公式中，“话”既贴近原文，也比解释性的“信息”更能保留启示用语。
- source_word: יְהוָה
  choice: 雅威[a]
  rationale: 按希伯来语四字神名 YHWH 音译，保留其作为上帝专名的性质；脚注说明另一种通行译法。
- source_word: אֶל
  choice: 临到
  rationale: 原词标明上帝之话所到的对象；中文以“临到以赛亚”自然表达这一关系。
- source_word: יְשַׁעְיָהוּ
  choice: 以赛亚
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节的直接话语；中文用“说：”简洁自然，并保留与后文引语的衔接。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名 YHWH；正文采用较贴近学界常见重建读音的“雅威”，同时在脚注保留中文传统中通行的“耶和华”，不以“主”这一称号代替专名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“随后”承接叙事进程；“雅威的话临到以赛亚”保留先知文献中可辨识的启示公式；句末用冒号引出下一节的话语。
