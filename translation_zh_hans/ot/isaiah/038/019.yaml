base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/019.yaml
  text: The living[a], the living—he gives thanks to you, as I do today[b]; a father makes your faithfulness known to children.
translation:
  language: zh_hans
  text: 活着的人，活着的人，他称谢你，正如我今日所做的；父亲使儿女[b]知道你的信实[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“真实”。希伯来语אֱמֶת可表示真实、信实或可靠。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“儿子”；这里的语境泛指父亲把上帝的信实传给下一代，因此译作“儿女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי חַי
  choice: 活着的人，活着的人
  rationale: 保留希伯来文的重复和强调，并以现代汉语自然表达其名词化用法。
- source_word: יוֹדֶךָ
  choice: 称谢你
  rationale: ידה的使役词干在向上帝发言的感恩诗歌语境中表示感谢、赞美；“称谢”兼具感恩与颂赞之意。
- source_word: כָּמוֹנִי הַיּוֹם
  choice: 正如我今日所做的
  rationale: 按汉语习惯从前句补出动作，表明说话者当日也在称谢上帝。
- source_word: אָב לְבָנִים
  choice: 父亲……儿女
  rationale: בָּנִים字面为阳性复数“儿子”，在代际传承的概括性陈述中可指子女；“儿女”自然地表达后代整体。
- source_word: יוֹדִיעַ
  choice: 要把……告诉
  rationale: 保留ידע使役词干“使人知道、使……为人所知”的意义，同时符合现代汉语表达。
- source_word: אֲמִתֶּךָ
  choice: 你的信实
  rationale: אֱמֶת可指真实、信实或可靠；这里所传扬的是上帝可信可靠的属性，“信实”最契合语境。
theological_decisions:
- issue: בָּנִים的性别与所指范围
  choice: 儿女
  alternative: 儿子
  rationale: 虽然原词为阳性复数，但本节是关于父辈向下一代传扬上帝的概括性陈述，并无证据限定为男性后代；脚注保留字面形式。
- issue: אֱמֶת用于上帝时的语义
  choice: 信实
  alternative: 真实
  rationale: “信实”突出上帝可靠可信的属性，适合代代传扬的语境；原词也可表示“真实”，故以脚注保存这一真实歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留“活着的人”的重复以再现原文强调，并将两个脚注标记分别置于其实际解释的“信实”和“儿女”之后。
