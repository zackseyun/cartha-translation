  text: וַ/יֹּ֥אמֶר חִזְקִיָּ֖הוּ מָ֣ה א֑וֹת כִּ֥י אֶעֱלֶ֖ה בֵּ֥ית יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/022.yaml
  text: And Hezekiah said[a], “What is the sign that I shall go up to the house of Yahweh?”
translation:
  language: zh_hans
  text: 希西家说[a]：“我将上到耶和华的殿去，有什么兆头呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“什么兆头表明我将上到耶和华的殿去？”
    reason: 原文“什么兆头”可作较特指的问法；正文以“有什么兆头”表达同一求证之意。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进话语；现代汉语在此省略生硬的“于是/并且”更自然，语序仍清楚表达后续发言。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用中文圣经传统中通行且易识别的人名译法。
- source_word: מָה
  choice: 什么
  rationale: 直接保留疑问词要求辨明兆头的功能，不额外加入“哪一种”等限定。
- source_word: אוֹת
  choice: 兆头
  rationale: 此处指证实应许的可识别记号；“兆头”在先知叙事语境中自然、庄重，也避免把它解释性地窄化为“证据”。
- source_word: כִּי
  choice: （由语序表达）
  rationale: 这里引出兆头所要证实的内容。汉语用“我将……，有什么兆头”即可自然表达，不必机械译出连接词。
- source_word: אֶעֱלֶה
  choice: 我将上
  rationale: 未完成体在语境中指将来的行动；“上”保留前往圣殿所含的上行意味。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בֵּית直译为“家/房屋”，但在此明确指圣殿；译为“殿”既自然又准确，同时保留所属关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的四字神名传统译法，明确呈现原文的专名，而不以“主”替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都旨在呈现四字神名；“耶和华”是简体中文圣经传统中最通行、最易识别的专名形式，且不把原文改为称号“主”。
- issue: 问题是在索取兆头，还是询问已有兆头
  choice: 正文采用“有什么兆头”
  alternative: “兆头是什么”
  rationale: 原文 מָה אוֹת 可理解为询问“是什么兆头”，也可自然理解为“有什么兆头”。正文采用现代汉语较自然的后一表达，并以脚注保留前一种较特指的读法，不裁定兆头是否已明确给出。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“耶和华的殿”比“耶和华的家”更符合此处圣殿语境；问句保留原文简洁，并用脚注呈现冠词与语用上的真实歧义。
