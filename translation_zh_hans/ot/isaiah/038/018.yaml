id: ISA.38.18
reference: Isaiah 38:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י לֹ֥א שְׁא֛וֹל תּוֹדֶ֖/ךָּ מָ֣וֶת יְהַלְלֶ֑/ךָּ לֹֽא יְשַׂבְּר֥וּ יֽוֹרְדֵי ב֖וֹר אֶל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/018.yaml
  text: For Sheol does not thank you[a]; death does not praise you[b]; those who go down to the pit do not hope for your faithfulness.
translation:
  language: zh_hans
  text: 因为阴间不会称谢你[a]，死亡不会赞美你；下到坑中的人也不会仰望你的信实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”或译“坟墓”或“死人之境”。
    reason: lexical_alternative
  - marker: b
    text: “仰望你的信实”也可译“等候你的真实”；希伯来语可表达带着盼望等候神的真实或信实。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 指死人所在之境，不只是埋葬遗体的坟墓；“阴间”是现代中文圣经语境中较简明、可辨认的对应词，并以脚注保留其他译法。
- source_word: תּוֹדֶךָּ
  choice: 称谢你
  rationale: ידה的使役式在此表示称谢、赞颂；“称谢”既自然庄重，也与下一分句的“赞美”保持词义上的区别。
- source_word: מָוֶת
  choice: 死亡
  rationale: 按原文直译，并保留它与“阴间”构成诗歌平行、近似拟人化的表达。
- source_word: יְהַלְלֶךָּ
  choice: 赞美你
  rationale: הלל的加强式通常表示赞美；此译准确自然，并与“称谢你”形成平行。
- source_word: יְשַׂבְּרוּ
  choice: 仰望
  rationale: שׂבר的加强式含带着盼望等候、期待之意；“仰望”适合以神的信实为对象，同时保留期待和盼望的意味。
- source_word: יוֹרְדֵי בוֹר
  choice: 下到坑中的人
  rationale: 保留希伯来文的分词表达和具体意象，指走向或进入死亡领域的人，不直接改写为抽象的“死人”。
- source_word: בּוֹר
  choice: 坑
  rationale: 保留原文以坑象征死亡领域的诗歌意象，不将其过早解释为“坟墓”或“阴间”。
- source_word: אֲמִתֶּךָ
  choice: 你的信实
  rationale: אֱמֶת可指真实、可靠或信实；与“仰望”搭配时，“信实”自然表达对神可靠性的期待，同时脚注注明“真实”等可能译法。
theological_decisions:
- issue: 本节是否断言死者完全没有意识，也不能以任何方式与神相交
  choice: 按诗歌本身表述阴间和死亡不再称谢、赞美神，下坑者不再仰望神的信实
  alternative: 将本节解释为死者在本体意义上完全无意识，绝不可能与神有任何关系
  rationale: 原文聚焦死亡与活人称谢、赞美和期待神之作为之间的反差，并未系统说明死后的中间状态；译文因此保留其张力，不加入超出经文的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不会”贴近原文的否定陈述，避免用“不能”把诗句强化为关于死者能力或意识状态的绝对论断；整体保留三个平行分句及“阴间—死亡—坑”的诗歌意象。
