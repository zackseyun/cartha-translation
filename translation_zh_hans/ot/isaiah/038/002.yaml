  yaml_path: translation/ot/isaiah/038/002.yaml
  text: Then Hezekiah turned his face to the wall and prayed to Yahweh[b][a],
translation:
  language: zh_hans
  text: 于是，希西家把脸转向墙壁，向耶和华[a]祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”；也译作“雅威”，传统上常译作“上主”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: 转向
  rationale: 该词是 סבב 的使役式连续叙事形，描写身体朝某一方向转动；“转向”自然、准确。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: פָּנָיו
  choice: 把脸
  rationale: 原文明确提到“他的脸”；保留这一身体动作，以呈现场景的具体性和情感力度。
- source_word: אֶל הַקִּיר
  choice: 向墙壁
  rationale: אֶל 表示动作朝向；中文“向墙壁”既自然，也保留方向意义，而不额外断定他与墙壁的距离。
- source_word: וַיִּתְפַּלֵּל
  choice: 祷告
  rationale: פלל 的 Hitpael 形式在此为向神祷告的常用表达。
- source_word: אֶל יְהוָה
  choice: 向耶和华
  rationale: 介词 אֶל 标明祷告的对象；יְהוָה 以现代中文最通行的专名形式“耶和华”呈现，并以脚注交代其希伯来文形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用普通中文读者熟悉且具有专名性质的“耶和华”，避免用称号取代原文专名；脚注说明希伯来文为 YHWH，并列出常见替代译法，不据此引入特定宗派解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接上文叙事；保留“把脸转向墙壁”的具体动作。句末逗号反映本节在更大句段中继续至下一节。
