  text: כְּ/ס֤וּס עָגוּר֙ כֵּ֣ן אֲצַפְצֵ֔ף אֶהְגֶּ֖ה כַּ/יּוֹנָ֑ה דַּלּ֤וּ עֵינַ/י֙ לַ/מָּר֔וֹם אֲדֹנָ֖/י עָֽשְׁקָה לִּ֥/י עָרְבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/014.yaml
  text: Like a swift or a crane[a], so I chirp; I moan like a dove. My eyes grow weak looking upward. Lord, I am oppressed; be my pledge.
translation:
  language: zh_hans
  text: 我像雨燕或鹤[a]那样啁啾，像鸽子那样哀鸣。我仰望高处，眼睛渐渐疲乏。主啊，我受欺压；求你为我作保。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按传统辨识译作“燕子或鹤”。第一个鸟名的确切所指不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּסוּס עָגוּר
  choice: 像雨燕或鹤一样
  rationale: 两个鸟名的辨识有困难，尤其是סוּס。正文采用“雨燕或鹤”，既呈现鸟鸣的比喻，也不过度断定具体鸟种；传统的“燕子”译法列入脚注。
- source_word: אֲצַפְצֵף
  choice: 啁啾
  rationale: 该动词指鸟类尖细的鸣叫。“啁啾”在现代汉语中自然、凝练，并保留原文的拟鸟声色彩。
- source_word: אֶהְגֶּה
  choice: 哀鸣
  rationale: 该词可指低声吟咏、呻吟或哀叹；在患病者的哀歌语境中，“哀鸣”既传达痛苦，也与鸽子的低沉叫声相配。
- source_word: כַּיּוֹנָה
  choice: 像鸽子一样
  rationale: 直接保留明喻；鸽子的低鸣在此表达哀伤。
- source_word: דַּלּוּ עֵינַי
  choice: 我的眼睛……渐渐昏弱
  rationale: 该习语表示眼睛因长久用力而衰弱、失去力量。“渐渐昏弱”保留身体衰竭的意象，也符合现代汉语表达。
- source_word: לַמָּרוֹם
  choice: 仰望高处
  rationale: 原文是“向着高处”，并未明说“天”。译作“仰望高处”交代视线方向，同时避免补入原文没有明言的地点。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝的直接称呼，为称号而非四字神名；“主啊”自然体现呼语。
- source_word: עָשְׁקָה לִּי
  choice: 我受了欺压
  rationale: 原句简短且语法不寻常，核心词根表示欺压或亏负。“我受了欺压”保留被动受害的申诉语气。
- source_word: עָרְבֵנִי
  choice: 求你为我作保
  rationale: 该动词属于担保、承担保证的法律关系用语。“为我作保”比笼统的“帮助我”更能保留原文意象；加“求你”使汉语祈求语气自然。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主啊
  alternative: 我的主啊
  rationale: 原词在这里是对上帝的直接称呼，不是四字神名。译作“主啊”准确呈现称号和呼语，也不额外强调所有关系。
- issue: כְּסוּס עָגוּר 中鸟类名称的不确定性
  choice: 像雨燕或鹤一样
  alternative: 像燕子或鹤一样
  rationale: 希伯来语鸟名的动物学辨识不能确定。正文采用有根据的现代辨识，脚注保留传统译法，以免把词义争议误写成定论。
- issue: עָרְבֵנִי 的法律—关系意象
  choice: 求你为我作保
  alternative: 求你帮助我
  rationale: 原文要求主成为担保者或保证者。保留“作保”既呈现恳求，也保留其较具体而未完全展开的关系意象，不把它泛化为一般帮助。
translation_notes:
  register: 采用现代、庄重而可懂的哀歌语体。“啁啾”与“哀鸣”形成尖细和低沉两种声音的对照；“仰望高处”保留原文空间表达；“作保”虽略带法律色彩，但正好承载希伯来语的具体意象。
