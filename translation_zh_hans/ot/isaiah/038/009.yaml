  text: 'A writing of Hezekiah king of Judah[b][a], when he had been sick and had recovered from his sickness:'
translation:
  language: zh_hans
  text: 犹大王希西家的文字[a]：他患病以后，从病中痊愈[b]所作：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“希西家的文稿”或“希西家的记录”。希伯来语原词指书面作品，并未明确限定文体。
    reason: lexical_alternative
  - marker: b
    text: 直译“他从自己的病中活了”；这里指他从病中恢复，即病愈。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּב
  choice: 手记
  rationale: 该词泛指书面作品或文稿，并未限定具体文体。“手记”自然地表明这是希西家所作的文字，同时不把它过度界定为诗或诗篇。
- source_word: לְחִזְקִיָּהוּ
  choice: 希西家的
  rationale: 此处前缀 לְ 在标题中表示归属或作者关联；“希西家的”在现代汉语中可自然表达这种归属，同时保留作者归属上的一般性。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 这是表明希西家王位与统治地域的连属结构；译作“犹大王”简洁、自然。
- source_word: בַּחֲלֹתוֹ
  choice: 他患病
  rationale: 介词 בְּ 加不定词结构表达时间背景，即“当他患病时”；结合后面的痊愈事件，汉语标题用“他患病、病愈之后”能清楚呈现回顾性的时间关系。
- source_word: וַיְחִי
  choice: 病愈
  rationale: 字面是“他活了”，但与“从他的病”连用时，惯用意义是从疾病中恢复、活下来；“病愈”准确而不使人误解为复活。
- source_word: מֵחָלְיוֹ
  choice: 病愈
  rationale: 介词 מִן 表示脱离疾病的状态；汉语将其与 וַיְחִי 合译为“病愈”，自然表达“从疾病中恢复”的整体意义。
