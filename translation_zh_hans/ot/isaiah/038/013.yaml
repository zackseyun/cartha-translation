  text: שִׁוִּ֤יתִי עַד בֹּ֨קֶר֙ כָּֽ/אֲרִ֔י כֵּ֥ן יְשַׁבֵּ֖ר כָּל עַצְמוֹתָ֑/י מִ/יּ֥וֹם עַד לַ֖יְלָה תַּשְׁלִימֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/013.yaml
  text: I waited until morning[a]; like a lion, so he breaks all my bones[b]. From day to night you bring me to an end.
translation:
  language: zh_hans
  text: 我等候到早晨[a]；他如狮子折断我的一切骨头[b]。从白昼到夜晚，你使我走到尽头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我使自己镇定，直到早晨。”句首动词含义较难确定，也有人理解为使自己安静或镇定。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在这里由“他折断”转为“你使我走到尽头”；译文保留了这种诗性的人称转换。
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: 我等候
  rationale: 该动词在此语境中含义较难确定；结合“到早晨”和整段哀歌，译作“等候”最能表达彻夜承受苦难、盼到清晨的意思，同时以脚注保留“使自己镇定”的可能。
- source_word: עַד בֹּקֶר
  choice: 到早晨
  rationale: 直接保留时间终点，现代汉语自然清楚。
- source_word: כָּאֲרִי
  choice: 如狮子
  rationale: 保留希伯来文的明喻及其猛烈、摧折性的形象。
- source_word: כֵּן יְשַׁבֵּר
  choice: 他……折断
  rationale: כֵּן承接比喻；中文以“他如狮子折断”自然整合比较结构。שׁבר的加强词干表达强力折断。
- source_word: כָּל עַצְמוֹתָי
  choice: 我的一切骨头
  rationale: 保留具体的身体意象和“全部”的强调。
- source_word: מִיּוֹם עַד לַיְלָה
  choice: 从白昼到夜晚
  rationale: 贴近原文“从日间直到夜晚”，并与前句“早晨”形成清楚的时间推进。
- source_word: תַּשְׁלִימֵנִי
  choice: 你使我走到尽头
  rationale: 此处使役形表达使某事完成，在哀歌语境中指使说话者走到生命或苦难的终局；此译保留其力度，也避免过度口语化的“把我了结”。
theological_decisions:
- issue: 本节由第三人称转为第二人称
  choice: 保留“他……你……”的人称转换
  alternative: 统一译为第三人称，或把两句都改成对上帝的第二人称直呼
  rationale: 希伯来文本确有诗性的人称转换。保留这一变化，不把狮子比喻与上帝的身份关系解释得比原文更明确，也维持哀歌突然直面上帝的张力。
- issue: תַּשְׁלִימֵנִי所指的“终结”
  choice: 你使我走到尽头
  alternative: 你使我复原；你把我彻底了结
  rationale: 上下文描述死亡临近，故不取“复原”；同时采用庄重而不过度解释的措辞，不明确补入“生命”等原文未明说的宾语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留狮子、骨头和时间跨度等具体诗歌意象；“走到尽头”既符合哀歌语境，又不擅自限定为某一种终结。
