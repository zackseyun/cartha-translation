base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/015.yaml
  text: What can I say? He has spoken to me[a], and he himself has done it. I will walk slowly all my years because of the bitterness of my soul.
translation:
  language: zh_hans
  text: 我还能说什么呢？他已经对我说了；他也亲自做成了这事。我因心灵的苦楚，一生都要缓步而行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我一生都要在心灵的苦楚中缓步而行。”这里的动词十分罕见，可能指缓慢或低沉地行走；“苦楚”一语也可表示行走时所处的境况或方式，而不只是原因。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲדַבֵּר
  choice: 我还能说什么呢？
  rationale: 保留反问语气，表达惊愕之下无言可说；“还能”符合现代汉语表达。
- source_word: וְאָמַר לִי
  choice: 他已经对我说了
  rationale: 按上下文理解为已经完成的言说行为，同时不在正文中补出未明说的“上帝”。
- source_word: וְהוּא עָשָׂה
  choice: 而这事也是他亲自做的
  rationale: “他亲自”体现显式代词 הוּא 的强调；“这事”自然承接隐含宾语。
- source_word: אֶדַּדֶּה
  choice: 缓步而行
  rationale: 该动词罕见，可能指缓慢、低沉或谨慎地行走；此译保留行动及生活方式的比喻。
- source_word: כָּל שְׁנוֹתַי
  choice: 我一生
  rationale: 自然表达“我所有的年日”，不擅自补入“余下的”。
- source_word: עַל מַר נַפְשִׁי
  choice: 因我心灵的苦楚
  rationale: 将 עַל 理解为原因，נֶפֶשׁ 译作“心灵”，保留内在生命承受痛苦的含义。
theological_decisions:
- issue: 第三人称动词的主语
  choice: 正文保留“他”，由上下文指向耶和华
  alternative: 直接译作“上帝”或理解为未指明的主体
  rationale: 上下文清楚指向耶和华，但本节希伯来文本没有明说神名，因此不在正文中补出。
- issue: 苦楚与缓步而行的关系
  choice: 将 עַל 译为原因：“因我心灵的苦楚”
  alternative: 译为方式或处境：“在我心灵的苦楚中”
  rationale: 介词可表达原因或相关处境；正文采用合乎语境的因果理解，同时以脚注保留方式性读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“缓步而行”既可指实际行动，也保留受苦之后度日为人的比喻含义。脚注标记置于相关分句之后。
