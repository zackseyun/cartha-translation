  text: אָמַ֨רְתִּי֙ לֹא אֶרְאֶ֣ה יָ֔הּ יָ֖הּ בְּ/אֶ֣רֶץ הַ/חַיִּ֑ים לֹא אַבִּ֥יט אָדָ֛ם ע֖וֹד עִם י֥וֹשְׁבֵי חָֽדֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/011.yaml
  text: I said[a], “I will not see Yah, Yah in the land of the living[b]; I will no longer look on man among the inhabitants of cessation.”
translation:
  language: zh_hans
  text: 我说：“我将不得在活人之地看见雅，雅[a]；我也不再在止息之境的居民中间看见世人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”音译自希伯来语 יָהּ，是神名的诗体短式；原文重复两次。许多译本译作“耶和华”或“主”。
    reason: alternative_reading
  - marker: b
    text: 本句末尾原文含义艰深；也可按字面语序理解为“我不再看见世人，与止息之境的居民一同”。“止息之境”所译的希伯来词 חָדֶל 含有停止、消逝或脆弱之意，也可能指与日常生命隔绝的领域。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: 我说
  rationale: 这是 אמר 的第一人称单数完成式，在这里引出希西家的直接哀歌；直译为“我说”自然且忠实。
- source_word: לֹא אֶרְאֶה
  choice: 我必不得……看见
  rationale: 否定词与第一人称未完成式表达说话者预期将失去的经历；“必不得”既有将来意味，也符合哀歌语气。
- source_word: יָהּ יָהּ
  choice: 雅，雅
  rationale: 原文两次使用神名的诗体短式 יָהּ，而非完整的四字神名；采用简洁音译“雅”，并保留重复所带的强调。
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: 在活人之地
  rationale: 这是与死亡或阴间相对的希伯来语惯用表达；“活人之地”简明、庄重，并保留原文意象。
- source_word: לֹא אַבִּיט
  choice: 我也不再看见
  rationale: נבט 的使役词干在此意为观看、看见；结合后面的 עוֹד，译成“不再看见”，既自然又与前半句的视觉意象平行。
- source_word: אָדָם
  choice: 世人
  rationale: 这里指人类社会中的人，而非专名亚当；“世人”保留集合性和代表性，又符合现代汉语表达。
- source_word: עוֹד
  choice: 不再
  rationale: 在否定动词的语境中，עוֹד 表示这种经历不再继续。
- source_word: עִם
  choice: 在……中间
  rationale: עִם 通常意为“与”，但此处可表达说话者所处的人群范围；“在……居民中间”使汉语通顺，同时不消除句法上的困难。
- source_word: יֹשְׁבֵי
  choice: 居民
  rationale: ישב 的复数主动分词构造形式在此作名词使用，指居住者；译作“居民”简洁自然。
- source_word: חָדֶל
  choice: 止息之境
  rationale: 这是罕见而含义困难的词，与停止、消逝或脆弱相关。“止息之境”保留其词根意象及地点性，但不直接把它等同于阴间或死人世界。
theological_decisions:
- issue: 神名短式 יָהּ 的译法
  choice: 雅，雅
  alternative: 主，主；耶和华，耶和华
  rationale: 本节实际使用的是诗体短式 יָהּ，并重复两次。音译为“雅”可区分这一短式与完整神名，也保留原文的诗歌强调。
- issue: חָדֶל 是否明确指死人世界
  choice: 止息之境
  alternative: 死人之地；阴间；短暂无常之世
  rationale: 该词罕见，可能涉及止息、消逝、脆弱或与日常生命隔绝的领域。正文采用较透明的表达，不把不确定的指称固定为某一死亡观；脚注说明其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前后两句保留“看见”的视觉平行，并保留神名短式的重复。末句在正文中维持原文罕见词及句法所造成的张力，不将其过度解释为明确的“阴间”或“死人世界”。
