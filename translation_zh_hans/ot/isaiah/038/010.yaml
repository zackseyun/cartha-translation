base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/010.yaml
  text: I said[a], “In the middle of my days I must go through the gates of Sheol[b]; I am deprived of the rest of my years.”
translation:
  language: zh_hans
  text: 我说：“正值壮年[a]，我将到阴间[b]的门前去；我被夺去余下的年岁。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一短语含义较难确定，也可译作“在我人生中途”或“在我年日被截断之时”；这里可能指人生的盛年或中段。
    reason: lexical_alternative
  - marker: b
    text: “阴间”原文为“示奥勒”（Sheol），指死者的领域，也可译作“坟墓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְמִי יָמַי
  choice: 正值壮年
  rationale: דְּמִי 含义较难确定；结合下半句痛惜余年被夺，此处最可能指人生尚在中途或盛年。“正值壮年”以自然汉语表达英年早逝之意，同时用脚注保留原文的词义困难。
- source_word: אֵלֵכָה בְּשַׁעֲרֵי
  choice: 我却得走进……的门
  rationale: אֵלֵכָה 表达说话者预期自己将走向死亡，语境带有无可避免之感；介词 בְּ 与“门”连用可表达经由或进入。“走进……的门”在现代汉语中自然地呈现进入死者领域的意象。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל 指死者所在之域，不宜窄化为实际坟墓，也不应译成带有后期刑罚观念的“地狱”。“阴间”是现代中文圣经语境中较易懂且不过度限定的对应词。
- source_word: פֻּקַּדְתִּי יֶתֶר שְׁנוֹתָי
  choice: 我余下的年岁都被夺去了
  rationale: פֻּקַּדְתִּי 是 פקד 的被动形式，此处与“余下的年岁”连用，语境指本可继续享有的寿年被取走。“被夺去了”保留被动及哀叹语气；“都”自然表达余年整体丧失，并非另加数量判断。
theological_decisions:
- issue: 如何翻译 שְׁאוֹל 所表达的死亡领域
  choice: 阴间
  alternative: 坟墓；死者的领域
  rationale: 本节沿用古代以色列关于死亡的语言，只指向人死后所归之域，并未明确谈论最终刑罚。“阴间”既保留这一概念，也避免把它教义化为“地狱”；脚注列出较直白的释义。
- issue: 是否把 בִּדְמִי יָמַי 明确限定为人生的准确中点
  choice: 正值壮年
  alternative: 在我人生中途；在我年日被截断之时
  rationale: 原词可能涉及中途、止息或截断，确切词义有争议。上下文明确强调死亡过早临到，但未要求数学意义上的寿命中点，因此正文采用自然而不过度精确的“正值壮年”，脚注保留歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正值壮年”传达过早离世的哀叹；“我却得”体现不情愿却无法避免的语气；“走进阴间的门”保留原文鲜明的门槛意象。所有脚注标记均置于相应词语之后。
