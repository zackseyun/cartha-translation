  to: “你去告诉希西家：‘耶和华、你祖先大卫的神这样说：我听见了你的祷告，也看见了你的眼泪。看，我要使你的寿数增加十五年。’”
  rationale: 作轻微标点修订，使神谕公式在现代标准汉语中更自然，同时不改变任何语义。保留“祖先”以反映 אָב 在王朝谱系语境中的祖先含义，保留“看”对应 הִנְנִי。
