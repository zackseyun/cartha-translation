    rationale: 原文是常规神谕公式“耶和华，你祖先大卫的神，这样说”。中文以逗号处理同位语更平稳，也避免破折号使该称谓看似附加说明而非说话者身份的一部分。
  revised_text: “你去告诉希西家：‘耶和华、你祖先大卫的神这样说：我听见了你的祷告，也看见了你的眼泪。看，我要使你的寿数增加十五年。’”
