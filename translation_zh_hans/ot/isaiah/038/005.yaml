base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/005.yaml
  text: 'Go and say to Hezekiah, ‘Thus says the LORD, the God of David your father: I have heard your prayer; I have seen your tears. Look, I will add fifteen years to your days.’'
translation:
  language: zh_hans
  text: “你去告诉希西家：‘耶和华、你祖先大卫的神这样说：我听见了你的祷告，也看见了你的眼泪。看，我要使你的寿数增加十五年。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: 你去告诉
  rationale: 希伯来语是“去，并且说”的惯用表达；现代汉语用“去告诉”自然、准确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的专名译法，区别于泛称“主”。
- source_word: אֱלֹהֵי דָּוִד אָבִיךָ
  choice: 你祖先大卫的神
  rationale: אָב在此指家族先祖，并非希西家的亲生父亲；译作“祖先”避免现代读者误解。
- source_word: הִנְנִי
  choice: 看，我要
  rationale: 保留原文提示注意、强调随后的神圣宣告之功能，同时使用自然的现代汉语。
- source_word: יוֹסִף עַל יָמֶיךָ
  choice: 使你的寿数增加
  rationale: 原文字面为“加在你的日子之上”；“使你的寿数增加”在中文中清楚表达延长生命。
theological_decisions:
- issue: 神名四字神名 יהוה 的表达
  choice: 耶和华
  alternative: 主
  rationale: 原文使用专有神名而非 אֲדֹנָי；译出专名更直接保留词汇区别，不借此导入宗派性解释。
- issue: “你父亲大卫”中 אָב 的亲属范围
  choice: 你祖先大卫
  alternative: 你父亲大卫
  rationale: 大卫是希西家的先祖；中文“父亲”通常专指生父，改用“祖先”传达希伯来语此处的谱系含义。
- issue: יוֹסִף 的使役主体与应许性质
  choice: 我要使你的寿数增加十五年
  alternative: 我要在你的日子上加十五年
  rationale: 明确保留第一人称神为行动主体及确定应许，同时避免生硬直译。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。引语层级清晰；保留“这样说”的先知宣告格式，并以破折号标明同位说明。“看”保留 הִנְנִי 的强调作用。
