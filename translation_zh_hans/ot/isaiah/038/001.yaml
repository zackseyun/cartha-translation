revisions:
- from: 在那些日子，希西家病重，濒临死亡。亚摩斯的儿子以赛亚先知来见他，对他说：“雅威如此说：‘你要安排好你的家事，因为你快要死了[a]，不能活下去。’”
  to: 在那些日子，希西家病重，濒临死亡。亚摩斯的儿子以赛亚先知来见他，对他说：“雅威如此说：‘你要安排好你的家事，因为你快要死了[a]，你必不能活下去。’”
  rationale: 仅作两项小幅修订：以“你必不能活下去”明确原文对未来死亡的确定宣告，避免“不能”可能产生的能力性理解；并润饰脚注中不自然的直译，仍保留其所说明的词汇歧义和语境判断。
