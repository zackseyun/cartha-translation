  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּב֣וֹא אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/001.yaml
  text: 'In those days Hezekiah became sick to the point of death[a], and Isaiah the prophet, the son of Amoz, came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you shall not live.”'
translation:
  language: zh_hans
  text: 在那些日子，希西家病重，濒临死亡。亚摩斯的儿子以赛亚先知来见他，对他说：“雅威如此说：‘你要安排好你的家事，因为你快要死了[a]，你必不能活下去。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可较直译为“因为你正在死去”，甚至“因为你已经死了”；这里的希伯来语表达是在宣告死亡即将临到，而且确定无疑。
    reason: 说明希伯来语谓语分词可作较字面的译法，以及语境中所表达的临近而确定的死亡。
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: 在那些日子
  rationale: 保留希伯来语常见的叙事时间用语及其与上下文的衔接；比“那时”更贴近原文形式。
- source_word: חָלָה ... לָמוּת
  choice: 病重，濒临死亡
  rationale: חָלָה表示患病，לָמוּת在这里表达疾病达到致命程度；中文用“病重，濒临死亡”自然传达其结果或程度。
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: 亚摩斯的儿子以赛亚先知
  rationale: 完整保留姓名、父名和先知身份，并采用现代中文可顺畅理解的次序。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式的庄重语气，并将四字神名直接译作“雅威”。
- source_word: צַו לְבֵיתֶךָ
  choice: 你要安排好你的家事
  rationale: 原文直译近于“吩咐你的家”，语境指临死前对家庭及相关事务作出交代；“安排好你的家事”在现代中文中清楚而不过度缩窄含义。
- source_word: כִּי מֵת אַתָּה
  choice: 因为你快要死了
  rationale: 谓语分词配合人称代词表达正在逼近且确定的死亡；避免生硬且在语境中容易误解的“你是死的”。
- source_word: וְלֹא תִחְיֶה
  choice: 不能活下去
  rationale: 直接保留“不会继续活着”的意思，不将其解释性地缩窄为“不能康复”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用上帝的专名；“雅威”较直接地音译该名，不以称号代替，也不引入特定宗派表述。
- issue: 死亡宣告 כִּי מֵת אַתָּה וְלֹא תִחְיֶה 的力度
  choice: 因为你快要死了，不能活下去
  alternative: 因为你必死，不能存活／因为你正在死去，不能活下去
  rationale: 译文同时保留死亡临近和宣告确定这两层意味；不按字面误译成希西家当时已经死亡，也不擅自改成仅指疾病不能痊愈。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。保留先知传信公式“雅威如此说”，但将希伯来语习语译为普通读者易懂的“安排好你的家事”；句式简洁，避免古奥措辞。
