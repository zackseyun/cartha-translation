review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了“在那些日子”、希西家患病至死、以赛亚作为亚摩斯之子和先知来见他，以及雅威藉先知发出的死亡宣告。“病重，濒临死亡”恰当地表达了חָלָה לָמוּת。末句“不能活下去”在中文中较容易表示能力或条件上的不能，未充分表达原文未完成式所宣告的将来结果；宜改为“你必不能活下去”。
  naturalness: 整体为自然、庄重的现代汉语。“雅威如此说”和“安排好你的家事”符合先知宣告及临终安排的语境。将末句改为“你必不能活下去”可同时保持自然度和宣告的确定性。
  terminology: “雅威”一致呈现יהוה；“希西家”“以赛亚”“亚摩斯”均符合通行中文圣经人名形式。保留“家事”能涵盖家庭、家业及相关安排，未不当窄化为医疗或财产事项。
