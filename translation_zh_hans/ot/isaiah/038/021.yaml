  text: וַ/יֹּ֣אמֶר יְשַׁעְיָ֔הוּ יִשְׂא֖וּ דְּבֶ֣לֶת תְּאֵנִ֑ים וְ/יִמְרְח֥וּ עַֽל הַ/שְּׁחִ֖ין וְ/יֶֽחִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/021.yaml
  text: Isaiah had said[a], “Let them take a cake of figs and spread it on the boil, so that he may recover.”
translation:
  language: zh_hans
  text: 以赛亚曾说：“让人取一块无花果饼，敷在疮上，使他康复[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“使他活”或“让他活下来”。这里的“活”指从疾病中恢复。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 曾说
  rationale: 该形式在上下文中补叙先前所说的话；用“曾说”自然表达这一叙事关系，同时不额外加入原文没有的时间副词。
- source_word: יִשְׂאוּ
  choice: 让人取
  rationale: נשׂא在此指取来医治所用之物；希伯来语为第三人称复数，但主语不明确，现代汉语用泛指的“人”表达自然。
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: 一块无花果饼
  rationale: 该词组指无花果压制成的饼块；“一块无花果饼”既贴近原义，也符合现代汉语习惯。
- source_word: וְיִמְרְחוּ
  choice: 敷
  rationale: מרח意为涂抹、敷上；在医治疮患的语境中，“敷”简洁自然，并包含将前述无花果饼贴敷其上的意思。
- source_word: עַל הַשְּׁחִין
  choice: 在疮上
  rationale: שְׁחִין指疖、疮或发炎的皮肤病灶；“疮”保留一定范围，避免将病灶过度限定为某一种现代医学诊断。
- source_word: וְיֶחִי
  choice: 使他康复
  rationale: חיה字面为“活”，在疾病得医治的语境中表示恢复健康；正文采用自然的“康复”，脚注保留字面表达。
theological_decisions:
- issue: וְיֶחִי所表达的结果与“活”的字面意义
  choice: 使他康复
  alternative: 让他活下来／他便会活
  rationale: 语境明确关乎病得医治，因此正文表达为“康复”；但“活”本身可能带有存活的力度，故以脚注保留原文措辞，不把这层张力完全消除。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“让人”表达未明确身份的复数执行者；“无花果饼”和“敷在疮上”保留古代医治场景，又便于普通读者理解。脚注标记置于“康复”之后，与其所说明的词语直接对应。
