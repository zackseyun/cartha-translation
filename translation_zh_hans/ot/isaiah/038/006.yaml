  text: וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִ֖י עַל הָ/עִ֥יר הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/006.yaml
  text: And I will deliver you and this city from the hand of the king of Assyria[a], and I will defend this city.
translation:
  language: zh_hans
  text: 我必救你和这城脱离亚述王的手[a]，也必保护这城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“脱离亚述王的掌控”。希伯来语直译为“脱离亚述王的手”。
    reason: 说明希伯来语身体部位惯用语所表达的权势或控制含义，同时保留正文中的原文意象。
lexical_decisions:
- source_word: מִכַּף
  choice: 脱离……的手
  rationale: כַּף本指“手掌、手”，在此表示权势或控制。“脱离……的手”既保留希伯来语的具体意象，在现代汉语中也自然易懂。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 这是属格结构，指统治亚述的君王；“亚述王”是简洁、标准的现代汉语表达。
- source_word: אַצִּילְךָ
  choice: 我必救你
  rationale: נצל的使役词干在此指从危险或敌人权下救出。“救”符合历史军事语境，也不额外引入经文未明说的救恩论含义。
- source_word: וְאֵת הָעִיר הַזֹּאת
  choice: 和这城
  rationale: 直接宾语标记连接第二个受拯救的对象；指示词明确指当前所说的城。“这城”简洁自然，不添加额外强调。
- source_word: וְגַנּוֹתִי
  choice: 也必保护
  rationale: גנן表示遮护、保护或防卫。此处是上帝保护城市免受军事威胁；“保护”自然庄重，并保留其护卫含义。
- source_word: עַל הָעִיר הַזֹּאת
  choice: 这城
  rationale: עַל与גנן连用，表达对这城施行保护。现代汉语直接说“保护这城”最自然，无须机械译出介词。
theological_decisions:
- issue: 历史军事语境中的神圣拯救用语
  choice: 译作“救”，指上帝把希西家和耶路撒冷从亚述王的权势下救出。
  alternative: “拯救”或“搭救”
  rationale: 本节所说的是从现实敌国威胁中获救。“救”准确、庄重而不过度专门化，不把更广泛的救恩论含义强加于本节。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“我必……也必……”体现两个连续的第一人称应许；正文保留“手”的希伯来语意象，并以脚注说明其“掌控、权势”之义。
