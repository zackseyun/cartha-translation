source:
  edition: WLC
  text: הִנֵּ֥ה לְ/שָׁל֖וֹם מַר לִ֣/י מָ֑ר וְ/אַתָּ֞ה חָשַׁ֤קְתָּ נַפְשִׁ/י֙ מִ/שַּׁ֣חַת בְּלִ֔י כִּ֥י הִשְׁלַ֛כְתָּ אַחֲרֵ֥י גֵוְ/ךָ֖ כָּל חֲטָאָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/017.yaml
  text: Behold[a], for my peace I had great bitterness; but you have held my soul back from the pit of destruction, for you have cast all my sins behind your back.
translation:
  language: zh_hans
  text: 看哪，就我的平安而言，我却经历了极大的苦楚；但你使我的性命免于落入毁灭之坑[a]，因为你把我一切的罪都抛在你的背后。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你眷爱我的性命，使它脱离毁灭之坑。”希伯来语动词可表示深切依恋或眷爱。
    reason: 保留 חָשַׁקְתָּ 的直接词义，以及该词与上下文所强调之拯救结果之间的张力。
lexical_decisions:
- source_word: לְשָׁלוֹם
  choice: 为了使我得平安
  rationale: שָׁלוֹם在这里可涵盖平安、安康和完整；结合介词לְ，译文保留苦楚竟导向平安这一出人意料的关系，同时避免把它缩窄为单指身体康复。
- source_word: מַר לִי מָר
  choice: 我经历了极大的苦楚
  rationale: 原文重复“苦”这一词根以加强语气。现代汉语用“极大的苦楚”自然表达其强烈程度，而不作生硬重复。
- source_word: חָשַׁקְתָּ
  choice: 使……免陷
  rationale: 该动词通常表示依恋、眷爱或深切关注；在与“毁灭之坑”搭配的语境中，这种眷顾产生保全、搭救的结果。正文表达拯救的语境功能，脚注保留“眷爱”这一直接词义。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ可指生命、本人或魂；本节谈到从死亡般的坑中获救，“性命”最符合语境，也保留强烈的个人意味。
- source_word: מִשַּׁחַת בְּלִי
  choice: 毁灭之坑
  rationale: שַׁחַת兼有坑、败坏、毁灭等含义，בְּלִי加强彻底毁灭的意味；“毁灭之坑”同时保留具体意象和毁灭含义。
- source_word: הִשְׁלַכְתָּ אַחֲרֵי גֵוְךָ
  choice: 把……抛在你的背后
  rationale: 直译保留原文鲜明比喻，表达上帝不再把这些罪摆在眼前追究；不在正文中把隐喻解释性改写为抽象教义术语。
- source_word: חֲטָאַי
  choice: 我一切的罪
  rationale: 复数形式直接指说话者的诸般罪；“一切的罪”也与原文כָּל相应。
theological_decisions:
- issue: חָשַׁקְתָּ נַפְשִׁי מִשַּׁחַת בְּלִי主要强调上帝的眷爱还是实际的拯救
  choice: 正文译作“你使我的性命免陷毁灭之坑”，突出上下文中的保全结果。
  alternative: “你眷爱我的性命，使它脱离毁灭之坑。”
  rationale: 希伯来动词本身常有依恋、爱慕之义，但这里的介词结构把这种深切眷顾与脱离毁灭相连。正文采用语境中较自然的拯救表达，脚注则保留词汇上真实且具有神学意义的“眷爱”读法，不把两者强行合并。
- issue: 苦楚与平安之间的关系
  choice: 译作“我经历了极大的苦楚，竟是为了使我得平安”。
  alternative: “就我的平安而言，我却经历了极大的苦楚。”
  rationale: 介词לְ容许目的、结果或关涉等理解。正文采用较符合全节感恩语境的目的／结果表达，并用“竟”呈现苦楚与平安之间的张力，但不进一步断言苦楚本身具有某种特定教义性的功用。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留הִנֵּה的郑重提示作用；分号呈现苦楚、蒙救与赦罪之间的推进。“抛在你的背后”有意保留原文具体意象，不改成较抽象的“完全赦免”。
