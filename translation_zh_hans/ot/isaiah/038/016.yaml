  text: אֲדֹנָ֖/י עֲלֵי/הֶ֣ם יִֽחְי֑וּ וּ/לְ/כָל בָּ/הֶן֙ חַיֵּ֣י רוּחִ֔/י וְ/תַחֲלִימֵ֖/נִי וְ/הַחֲיֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/016.yaml
  text: Lord[a], by these things men live, and in all these is the life of my spirit[c][b]; so restore me to health and let me live.
translation:
  language: zh_hans
  text: 主啊，人靠这些而活[a]；我灵的生命也都在这一切之中。求你使我康复[b]，使我存活[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人靠这些而活”也可译作“他们靠这些而活”或“人由此得以存活”；希伯来语动词没有明说主语。
    reason: lexical_alternative
  - marker: b
    text: “使我康复”也可译作“医治我”；该动词可指使人恢复健康或使人痊愈。
    reason: lexical_alternative
  - marker: c
    text: “使我存活”也可译作“使我复苏”或“保全我的性命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 作为对上帝的直接呼求，译作“主啊”自然、庄重；希伯来语形式虽也可直译为“我的主”，此处不必生硬保留领属形式。
- source_word: עֲלֵיהֶם
  choice: 靠这些
  rationale: עַל 加代词后缀在此语义较难确定；结合上下文，取工具或凭借义，指人藉前述之事得以活着。
- source_word: יִחְיוּ
  choice: 人……活
  rationale: 动词为第三人称阳性复数，但没有明说主语；中文用泛指的“人”既自然，又保留其普遍陈述的性质。
- source_word: וּלְכָל בָּהֶן
  choice: 也全在其中
  rationale: 将这一不寻常的组合理解除了承接前面的“这些”，表达我灵的生命完全在这些事之中；中文以“全在其中”简洁保留范围与领域意味。
- source_word: חַיֵּי רוּחִי
  choice: 我灵的生命
  rationale: רוּחַ 可指灵、气息或生命力；此处保留“灵”，不把含义缩减为呼吸，并维持原文构造关系。
- source_word: וְתַחֲלִימֵנִי
  choice: 求你使我康复
  rationale: 该使役形式在疾病语境中指使人恢复健康；“使我康复”兼顾使役语气和现代汉语的自然表达。
- source_word: וְהַחֲיֵנִי
  choice: 使我存活
  rationale: חיה 的使役形式可表示使活、救活或保全生命；“使我存活”不预先限定为复苏或持续保命，保留语义张力。
theological_decisions:
- issue: יִחְיוּ 没有明示主语
  choice: 以泛指“人”补出主语
  alternative: 译作“他们活着”，或省略主语而译为“得以存活”
  rationale: 原文第三人称阳性复数既可能泛指人，也可能承接某个隐含群体；正文采用自然的泛指表达，并以脚注保留语法上的不确定性。
- issue: וְהַחֲיֵנִי 所指的生命行动
  choice: 译作“使我存活”
  alternative: “使我复苏”或“保全我的性命”
  rationale: 在希西家病愈的语境中，这些意义均有可能；正文避免把它专门解释为复苏或单纯延命。
translation_notes:
  register: 采用现代、庄重的祷告语体。“主啊”标明直接呼求；分号呈现普遍陈述与个人生命经验之间的推进，末句用两个并列祈求保留原文节奏。所有脚注标记均置于正文相关句末。
