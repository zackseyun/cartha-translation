base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/012.yaml
  text: My dwelling is pulled up and carried away from me like a shepherd’s tent[a]; I have rolled up my life like a weaver; from the loom he cuts me off[c][b]. From day to night you bring me to an end.
translation:
  language: zh_hans
  text: 我的住处像牧人的帐篷一样，被拆起，从我身边挪走[a]；我像织工一样卷起我的生命[b]；他从织机的经线上把我剪断[c]。从白昼到黑夜，你使我走向终结。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的住处”或译“我的世代”或“我的一生”。整句也可译为“我的世代离去，从我身边被挪走，如同牧人的帐篷”。这里的希伯来词通常指“世代”，在本句中也可能指“住处、居所”。
    reason: lexical_alternative
  - marker: b
    text: “卷起了”或译“剪断了”。这里的希伯来动词含义不确定；正文按照织布的意象理解为卷起织物。
    reason: lexical_alternative
  - marker: c
    text: “从织机的经线上”或译“从织机上”或“从垂挂的线头上”。希伯来词更具体地指织机上垂挂的线或经线。
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹרִי
  choice: 我的居所
  rationale: דּוֹר通常可指“世代”，但在本句与可拆迁的牧人帐篷相连，取“居所、住处”更符合具体意象；同时以脚注保留“我的世代”等可能。
- source_word: נִסַּע וְנִגְלָה
  choice: 被拔起……迁走
  rationale: 两个被动动词共同描绘帐篷被拆起并移走；“拔起”呼应拔营，“迁走”表达从原处挪去。
- source_word: כְּאֹהֶל רֹעִי
  choice: 像牧人的帐篷
  rationale: 保留牧人临时、可移动帐篷的比喻，现代汉语自然明白。
- source_word: קִפַּדְתִּי
  choice: 卷起了
  rationale: 该动词含义困难；结合织布语境，译作把织物卷起，维持纺织意象，又不提前引入下句“剪断”的动作。
- source_word: כָאֹרֵג חַיַּי
  choice: 我像织布的人一样卷起了我的生命
  rationale: 希伯来诗句高度凝练；此译保留第一人称动作及织工比喻，不把生命明确解释为布匹。
- source_word: מִדַּלָּה
  choice: 从织机的经线上
  rationale: 该词所指可能是织机上垂挂的经线或线头；正文用较具体且可理解的“织机的经线”，脚注保留术语范围。
- source_word: יְבַצְּעֵנִי
  choice: 他……将我剪断
  rationale: 动词表示割断、截断；“剪断”既切合织布图景，也表达生命终止，并保留第三人称主语。
- source_word: מִיּוֹם עַד לַיְלָה
  choice: 从白昼到黑夜
  rationale: 贴近字面的一日时段，表达死亡迅速临近，不直接释为“一天之内”。
- source_word: תַּשְׁלִימֵנִי
  choice: 你使我走到尽头
  rationale: 使役形在此表示使某人终结；此译庄重自然，并保留对上帝的第二人称直述。
theological_decisions:
- issue: 第三人称到第二人称的主语转换
  choice: 保留“他……将我剪断；……你使我走到尽头”
  alternative: 统一译为“你”或改成无明确主语
  rationale: 希伯来文本先用第三人称延续织布剪线的图景，随后转为第二人称直接呼告。保留这一突转，可维护诗歌的张力，避免替原文消解其语法与神学上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留帐篷与织布两组连续意象，以及第三人称转第二人称的突变。正文所有脚注标记均依次出现。
