  text: וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/003.yaml
  text: And he said[a], “Please, O Yahweh, remember how I have walked before you in faithfulness and with a whole heart[c][b], and have done what is good in your eyes.” And Hezekiah wept greatly.
translation:
  language: zh_hans
  text: 他说：“耶和华啊，求你记念我怎样以忠信、以一颗完全的心[a]行在你面前，又做了你眼中看为好的事。”希西家就大哭起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完全的心”也可译作“全心”或“专一的心”，指内心完整、不分裂，并不必然表示绝对无罪。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“哭了一场大哭”，是加强哭泣程度的表达。
    reason: literal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语基督教读者熟悉的专名形式来表达四字神名，不以“主”这一称号替代。
- source_word: אָנָּה ... נָא
  choice: 啊，求你
  rationale: 两个恳求语气成分共同表达迫切祈求；“啊，求你”在现代汉语祷告语境中自然庄重。
- source_word: זְכָר
  choice: 记念
  rationale: 保留祈求上帝顾念并据此行动的圣经语义；“记念”比单纯心理意义的“记得”更贴合语境。
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: 行在你面前
  rationale: 保留“行走”这一描述生活与行为的圣经意象，以及人在上帝面前生活的关系性表达。
- source_word: בֶּאֱמֶת
  choice: 以忠信
  rationale: 此词可指真实、可靠或忠信；在希西家陈述自己如何生活的语境中，“忠信”最贴切，同时不排除真实诚恳之意。
- source_word: וּבְלֵב שָׁלֵם
  choice: 以一颗完全的心
  rationale: שָׁלֵם强调完整、全心和不分裂；正文保留较形式对应的“完全”，脚注说明其含义，避免被误解为绝对无罪。
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: 又做了你眼中看为好的事
  rationale: 保留希伯来语“在你眼中为好”的评价性习语，同时使汉语表达通顺。
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: 就放声大哭
  rationale: 希伯来语以同根名词结构加强哭泣的程度；“放声大哭”自然表达强烈哭泣，而不额外指定“苦涩”这一情感性质。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 希西家自述“一颗完全的心”是否表示绝对无罪
  choice: 正文译作“以一颗完全的心”，脚注释为“全心”或“专一的心”
  alternative: 以一颗专一的心；全心全意
  rationale: 原文强调内心完整、忠诚而不分裂，并不必然宣称道德上毫无罪过。正文保留原文张力，脚注防止读者把“完全”理解成无罪的完美。
- issue: 神名的表达
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用专有神名而非称号；译文采用中文读者最熟悉的专名形式，不以“主”替换。
translation_notes:
  register: 采用自然、庄重的现代标准汉语，并保留“记念”“行在你面前”“你眼中看为好”等重要圣经意象。主句按希伯来语祈祷语气组织；末句用“放声大哭”传达同根名词结构的强烈程度。所有脚注标记均置于正文相应位置。
