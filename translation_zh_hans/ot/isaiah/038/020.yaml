language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֖ה לְ/הוֹשִׁיעֵ֑/נִי וּ/נְגִנוֹתַ֧י נְנַגֵּ֛ן כָּל יְמֵ֥י חַיֵּ֖י/נוּ עַל בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/020.yaml
  text: Yahweh is ready to save me[c][b][a]; and we will play my songs on stringed instruments all the days of our lives at the house of Yahweh.
translation:
  language: zh_hans
  text: 雅威要拯救我[a]；我们要在雅威的殿中[c]，终身弹奏我的弦乐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文结构简略，直译近于“雅威——拯救我”。也可译作“雅威拯救我”或“雅威随时拯救我”。
    reason: 保留希伯来文带 לְ 的不定式结构所含的句法、时态和语气歧义。
  - marker: b
    text: “弦乐”也可译作“乐曲”“音乐”或“弦乐曲”。
    reason: נְגִינוֹתַי可指与弹弦乐器有关的音乐，也可较宽泛地指乐曲；第一人称单数所属为“我的”。
  - marker: c
    text: 也可译作“在雅威的殿那里”或“在雅威的殿旁”。
    reason: 原文介词 עַל 在此表示与圣殿相关的处所；“在……中”顺应敬拜语境，但原文未用通常表示“在……里面”的介词。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质，不以“主”这一称号替代。
- source_word: לְהוֹשִׁיעֵנִי
  choice: 必拯救我
  rationale: 原文是带 לְ 的不定式结构，句法简略，直译近于“雅威——拯救我”。结合全诗对获救的确信，正文译为自然而不夸张的“必拯救我”，并以脚注保留结构上的歧义。
- source_word: וּנְגִינוֹתַי
  choice: 我的弦乐曲
  rationale: נְגִינוֹת 指与弹弦演奏有关的乐曲或音乐；“弦乐曲”兼顾音乐内容与乐器色彩，并保留第一人称单数所属。
- source_word: נְנַגֵּן
  choice: 我们要……奏
  rationale: נגן 的 Piel 未完成式第一人称复数表示弹奏或作乐；“奏”与“弦乐曲”自然搭配，也保留复数主语。
- source_word: כָּל יְמֵי חַיֵּינוּ
  choice: 度过我们一生的年日
  rationale: 按希伯来语“我们生命的一切日子”这一终身性惯用语译成庄重而易懂的现代汉语，同时保留“日子”的意象。
- source_word: עַל בֵּית יְהוָה
  choice: 在雅威的殿中
  rationale: 介词 עַל 的基本空间义较宽，此处结合圣殿敬拜场景作处所理解；正文采用自然汉语“在……殿中”，脚注说明也可理解为“在……殿那里”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用以色列上帝的四字神名，而非“主”的称号；“雅威”较直接反映学界通常重构的读音，同时不把专名改成称谓。
- issue: לְהוֹשִׁיעֵנִי 所表达的时态与语气
  choice: 必拯救我
  alternative: 要拯救我／随时拯救我
  rationale: 希伯来文是省略式表达，并未明说系词、时态或“预备好”的概念。正文按上下文表达确信，但以脚注保留“要拯救我”等可能译法，避免把“随时预备”定为唯一含义。
- issue: 圣殿处所短语 עַל בֵּית יְהוָה
  choice: 在雅威的殿中
  alternative: 在雅威的殿那里
  rationale: 敬拜语境支持殿内演奏，但介词并非通常表示“在……里面”的 בְּ；因此在脚注中保留较宽泛的处所理解。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“雅威必拯救我”简洁有力；后半句以“奏……度过……”重组汉语语序，使“我们”这一复数主语和终身敬拜的意思自然呈现，同时用脚注保存原文的句法与处所歧义。
