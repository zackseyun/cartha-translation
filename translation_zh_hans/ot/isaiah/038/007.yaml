  text: וְ/זֶה לְּ/ךָ֥ הָ/א֖וֹת מֵ/אֵ֣ת יְהוָ֑ה אֲשֶׁר֙ יַעֲשֶׂ֣ה יְהוָ֔ה אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה אֲשֶׁ֥ר דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/007.yaml
  text: 'And this will be the sign to you from Yahweh[a], that Yahweh will do this thing that he has spoken:'
translation:
  language: zh_hans
  text: 这是耶和华给你的兆头：耶和华必成就他所说的这件事[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这件事”也可译作“这事”或“这话”；希伯来语דָּבָר可指事情、事项，也可指说出的话。
    reason: 保留דָּבָר在事件与话语之间的词义宽度，避免把它仅理解为其中一项。
lexical_decisions:
- source_word: וְזֶה
  choice: 这就是
  rationale: 承接上文并引出下文所述的兆头；现代汉语中不必机械译出句首连接词，仍保留指示和衔接作用。
- source_word: לְּךָ
  choice: 给你的
  rationale: לְ加第二人称阳性单数词尾表示兆头的领受者；“给你的”比“向你的”更符合现代汉语表达。
- source_word: הָאוֹת
  choice: 兆头
  rationale: 指上帝为确认其宣告而给出的可识别凭据；“兆头”既自然，也保留先知叙事中的印证意味。
- source_word: מֵאֵת יְהוָה
  choice: 耶和华给你的
  rationale: מֵאֵת表示来源；调整为自然汉语语序，并将四字神名译作传统且明确的专名“耶和华”。
- source_word: אֲשֶׁר יַעֲשֶׂה יְהוָה
  choice: 表明耶和华必成就
  rationale: 关系从句说明兆头所印证的内容；“表明”显明句法关系，“必成就”表达未完成式在此处的将来和确定语气。
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: 这件事
  rationale: דָּבָר在此指耶和华已经宣告并将实行的事；“这件事”保留其可指事情、事项或话语的宽泛语义。
- source_word: אֲשֶׁר דִּבֵּר
  choice: 他所说的
  rationale: 忠实表达耶和华先前已经说出的宣告，不把一般的“说”限定性地解释为“应许”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次直接使用四字神名。正文采用现代中文圣经读者最熟悉且作为专名使用的“耶和华”，不以“主”替代神名；“雅威”则更接近常见学术拟音。
- issue: 兆头与所宣告事件之间的关系
  choice: 表明
  alternative: 直译为“就是……的兆头：耶和华必……”
  rationale: 希伯来语关系词אֲשֶׁר可表达兆头所确认的内容。“表明”使现代汉语关系清楚，却不进一步规定兆头如何发挥作用。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这就是……给你的兆头”适合直接对话语境；句末冒号保留本节向下一节具体兆头内容的引导作用。
