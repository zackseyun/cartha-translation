base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/023.yaml
  text: In that day there will be a highway from Egypt to Assyria[a], and Assyria will come into Egypt, and Egypt into Assyria[b]; and Egypt will serve with Assyria.
translation:
  language: zh_hans
  text: 到那日，必有一条大道从埃及通往亚述；亚述人要进入埃及，埃及人也要进入亚述；埃及人要和亚述人一同事奉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“埃及人要服事亚述人”。希伯来文句法容许这种读法；但上下文更支持埃及人与亚述人一同事奉上帝的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: מְסִלָּה
  choice: 大道
  rationale: 该词常指修筑起来、便于通行的道路；“大道”自然、庄重，也保留两国公开连通的意象。
- source_word: מִמִּצְרַיִם אַשּׁוּרָה
  choice: 从埃及通往亚述
  rationale: מִן 表起点，方向词尾表朝向；译作“从……通往……”符合现代汉语道路表达。
- source_word: וּבָא אַשּׁוּר בְּמִצְרַיִם
  choice: 亚述人要进入埃及
  rationale: בוא 与 בְּ 连用表示进入某地；国名在此转喻该国人民，汉语补出“人”更自然。
- source_word: וּמִצְרַיִם בְּאַשּׁוּר
  choice: 埃及人也要进入亚述
  rationale: 希伯来文省略了承接上句的 בוא；汉语补出“要进入”，清楚呈现平行关系。
- source_word: וְעָבְדוּ
  choice: 要……一同事奉
  rationale: עבד 可指服事、效劳，也可指宗教性的事奉。结合本段列国共同归向耶和华的语境，“事奉”能保留宗教含义而不窄化为单纯“敬拜”。
- source_word: מִצְרַיִם אֶת אַשּׁוּר
  choice: 埃及人要和亚述人一同事奉
  rationale: 字面句法可把亚述视为直接宾语，但上下文描绘埃及与亚述一同蒙福、彼此通行，因此正文采用共同事奉的语境性理解，同时以脚注保留更直译的可能。
theological_decisions:
- issue: וְעָבְדוּ מִצְרַיִם אֶת אַשּׁוּר 的对象与关系
  choice: 埃及人要和亚述人一同事奉
  alternative: 埃及人要服事亚述人；或埃及人要敬拜亚述
  rationale: אֶת 通常标示直接宾语，因此“服事亚述”在句法上确有依据；但19:24-25展现埃及与亚述并列蒙耶和华赐福，而非一方臣服或敬拜另一方。正文据语境表达共同事奉，又用脚注保存原文的真实张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到那日”“必有”保留先知文体；两处补出“人”和省略的动词，使平行结构在中文中清楚自然。
