  text: וְ/סִכְסַכְתִּ֤י מִצְרַ֨יִם֙ בְּ/מִצְרַ֔יִם וְ/נִלְחֲמ֥וּ אִישׁ בְּ/אָחִ֖י/ו וְ/אִ֣ישׁ בְּ/רֵעֵ֑/הוּ עִ֣יר בְּ/עִ֔יר מַמְלָכָ֖ה בְּ/מַמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/002.yaml
  text: I will stir up Egyptians against Egyptians[a], and each will fight against his brother, and each against his neighbor, city against city[b], kingdom against kingdom.
translation:
  language: zh_hans
  text: 我要挑动埃及人彼此相争[a]；他们必彼此争战：人人攻击自己的弟兄，人人攻击自己的邻舍；城与城相争，国与国相争。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译作“我要使埃及攻击埃及”。这里的国名集合性地指埃及人彼此发生内部冲突。
    reason: lexical_alternative
lexical_decisions:
- source_word: סִכְסַכְתִּי
  choice: 我要挑动……彼此相争
  rationale: 该动词表示使双方彼此敌对、引发冲突。“挑动……彼此相争”保留使役意义，也自然表达这里的内乱语境。
- source_word: מִצְרַיִם בְּמִצְרַיִם
  choice: 埃及人彼此
  rationale: 原文逐字为“埃及攻击埃及”，以国名集合性地指埃及人。译作“埃及人彼此”可清楚表达国内冲突，同时以脚注保留原文形式。
- source_word: וְנִלְחֲמוּ
  choice: 他们必彼此争战
  rationale: 原文为复数“他们必争战”，后面的两个分配性短语具体说明个人之间的冲突；补出“彼此”符合上下文。
- source_word: אִישׁ בְּאָחִיו וְאִישׁ בְּרֵעֵהוּ
  choice: 人人攻击自己的弟兄，人人攻击自己的邻舍
  rationale: אִישׁ在这里具有分配义，译作“人人”比重复“一个人”更符合现代汉语；“弟兄”保留亲属意象，“邻舍”则表现冲突由家族扩展到社会关系。
- source_word: עִיר בְּעִיר
  choice: 城与城相争
  rationale: 简洁保留原文对称结构及冲突由个人上升到城市层面的递进。
- source_word: מַמְלָכָה בְּמַמְלָכָה
  choice: 国与国相争
  rationale: מַמְלָכָה指政治统治单位；“国与国”是现代汉语中自然、庄重的表达，并保留全节的递进结构。
theological_decisions:
- issue: 内乱语境中集合性国名מִצְרַיִם的表达
  choice: 埃及人彼此相争
  alternative: 埃及与埃及相争
  rationale: 后文明确描写个人、城市和政治单位之间的内部争战，因此正文将集合性国名显明为“埃及人”；脚注保留原文较为含混而有力度的字面形式。这是语义表达选择，并不改变上帝主动引发审判性纷争的陈述。
- issue: אִישׁ的分配意义
  choice: 人人……人人……
  alternative: 一个人……另一个人……
  rationale: 此处重点是冲突遍及个人，并非特别强调参与者的性别。“人人”准确传达分配意义，也符合现代标准汉语。
- issue: 上帝在冲突中的使役作用
  choice: 我要挑动
  alternative: 我要使……陷入混乱
  rationale: 原文使用第一人称使役动词，直接陈述说话者引发敌对状态；“挑动”保留这一主动作用，不将其弱化为仅仅容许，也不进一步解释其作用方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；以分号和冒号呈现从全体、个人到城市及国家层面的递进。保留“弟兄—邻舍”的社会关系层次，并避免添加原文未说明的具体历史解释。
