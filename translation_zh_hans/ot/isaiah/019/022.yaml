  text: וְ/נָגַ֧ף יְהוָ֛ה אֶת מִצְרַ֖יִם נָגֹ֣ף וְ/רָפ֑וֹא וְ/שָׁ֨בוּ֙ עַד יְהוָ֔ה וְ/נֶעְתַּ֥ר לָ/הֶ֖ם וּ/רְפָאָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/022.yaml
  text: And Yahweh will strike Egypt[a], striking and healing; and they will return to Yahweh[b], and he will respond to their pleas and heal them.
translation:
  language: zh_hans
  text: 雅威必击打埃及——击打，也医治；他们必归向雅威[a]，他必应允他们的祈求[b]，医治他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归向”也可译作“转向”或“回到……那里”。这个希伯来语动词在先知书语境中常含悔改归回的意味。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他必垂听他们的恳求”；较直译为“他必受他们恳求”。这里表示雅威有利地回应他们的求告。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָגַף
  choice: 必击打
  rationale: נָגַף在此表示以灾祸或重击施行审判。“击打”简明有力，又不采用古奥措辞；先知性语境中的完成式按将来意义译为“必”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中通行的音译呈现神的专名，区别于作为称号的“主”。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 该国名的标准现代汉语译法。
- source_word: נָגֹף וְרָפוֹא
  choice: 击打，也医治
  rationale: 保留两个不定式绝对形并列所形成的强调与对照，不擅自将二者明确处理为严格的先后阶段。
- source_word: וְשָׁבוּ עַד יְהוָה
  choice: 他们必归向雅威
  rationale: שׁוב与עַד连用表示转向或归回到雅威；“归向”在现代汉语中自然，并保留先知语境中悔改归回的意味，而不将其过度教义化。
- source_word: וְנֶעְתַּר לָהֶם
  choice: 他必应允他们的祈求
  rationale: עתר的尼法勒式表达雅威容许人向他恳求并给予有利回应。“应允他们的祈求”比直译为“被他们恳求”更符合现代汉语，同时保存其回应祷告的含义。
- source_word: וּרְפָאָם
  choice: 医治他们
  rationale: רפא的基本义为“医治”；此处也可能涵盖民族性的复兴，但保留“医治”可与前文呼应，并维持比喻范围的开放性。
theological_decisions:
- issue: 神的审判与复兴之间的关系
  choice: 保留雅威既击打埃及、也医治埃及的并置表达。
  alternative: 把“医治”仅解释为政治或国家层面的复原。
  rationale: 希伯来文明确把击打和医治都归于雅威，又把医治与埃及归向他、他应允祈求相连；译文不削弱其中任何一面。
- issue: שׁוב所含的悔改意味
  choice: 译为“归向雅威”。
  alternative: 译为“转向雅威”或“回到雅威那里”。
  rationale: “归向”既传达方向性的转回，也自然保留先知语境中的悔改与关系恢复意味，但不把它扩展为更完整的教义公式。
- issue: עתר尼法勒式中神回应恳求的表达
  choice: 译为“他必应允他们的祈求”。
  alternative: 较形式地译为“他必受他们恳求”或译为“他必垂听他们”。
  rationale: 该形式既可突出雅威容许人求告，也可表达他有利地回应；主译采用自然汉语，脚注保留形式和语义上的其他可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“击打，也医治”保留原文紧凑的对称与神学张力；破折号帮助普通读者看出后半语是对前句的强调和展开。所有代词均按现代汉语常规处理，不额外加入原文没有的解释性称谓。
