id: ISA.19.1
reference: Isaiah 19:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַשָּׂ֖א מִצְרָ֑יִם הִנֵּ֨ה יְהוָ֜ה רֹכֵ֨ב עַל עָ֥ב קַל֙ וּ/בָ֣א מִצְרַ֔יִם וְ/נָע֞וּ אֱלִילֵ֤י מִצְרַ֨יִם֙ מִ/פָּנָ֔י/ו וּ/לְבַ֥ב מִצְרַ֖יִם יִמַּ֥ס בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/001.yaml
  text: 'An oracle concerning Egypt: Behold[a], Yahweh is riding on a swift cloud and is coming to Egypt; the idols of Egypt will tremble before him[c][b], and the heart of Egypt will melt within it.'
translation:
  language: zh_hans
  text: 关于埃及的宣告[a]：看哪，雅威驾着一朵疾行的云，正来到埃及。埃及的偶像在他面前[b]战抖，埃及的心在其中融化[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣告”也可译作“重担”或“神谕”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从他面前”，意即因雅威的临在。
    reason: lexical_alternative
  - marker: c
    text: 原文把埃及视为一个单数整体，也可译作“在他里面”。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: מַשָּׂא
  choice: 宣告
  rationale: 在先知书标题中指郑重而沉重的神谕性宣告；“宣告”自然、庄重，也不把“重担”这一可能的词源或语义色彩直接写入正文。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和营造先知异象临场感的功能，符合庄重的现代汉语经文语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其专名性质，而不以称号替代。
- source_word: רֹכֵב עַל עָב קַל
  choice: 驾着一朵疾行的云
  rationale: 保留神显中乘云而来的具体意象；קַל在这里表达轻快、迅疾，“疾行的云”比“轻云”更清楚地传达速度。
- source_word: וּבָא
  choice: 正来到
  rationale: 与前面的分词式动态描写相连，呈现眼前正在发生、迫近的先知性异象。
- source_word: וְנָעוּ
  choice: 战抖
  rationale: 表达摇动、震颤以及面对神临在时的惊惧；用于偶像也保留拟人化效果。
- source_word: אֱלִילֵי מִצְרַיִם
  choice: 埃及的偶像
  rationale: 准确指称埃及诸神像；不额外加入“虚无”或“无用”等贬义成分，以免超出本句明说的内容。
- source_word: מִפָּנָיו
  choice: 在他面前
  rationale: 自然表达字面的“从他面前／因他的临在”，并在脚注说明其临在所产生的因果意味。
- source_word: וּלְבַב מִצְרַיִם
  choice: 埃及的心
  rationale: 保留把埃及视为一个整体而拟人化的比喻，可涵盖其内在勇气、意志和精神。
- source_word: יִמַּס
  choice: 消融
  rationale: 保留“融化”的形象，同时自然传达勇气瓦解、内心崩溃的含义。
- source_word: בְּקִרְבּוֹ
  choice: 在其中
  rationale: 所指为作为单一整体的埃及；中文“其中”既可指其内部，也避免强行指定为男性人格。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名身份，不用称号替换，也不把较晚形成的混合读音放入正文。
- issue: 雅威乘云而来的神显图像
  choice: 直接保留“驾着一朵疾行的云”
  alternative: 意译为“雅威迅速来临”
  rationale: 原文以具体的乘云图像描写神的来临；保留图像，避免将神显语言抽象化或消解。
- issue: 埃及的拟人化及代词指向
  choice: 译作“埃及的心在其中消融”
  alternative: “埃及的心在他里面消融”
  rationale: 希伯来语将埃及作为阳性单数整体处理；中文用“其中”保存整体性和内部崩溃的含义，同时不把国家明确人格化为男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留先知宣告的标题形式、神显图像、国家拟人化和“心消融”的隐喻；正文中的[a]、[b]、[c]均与脚注对应。
