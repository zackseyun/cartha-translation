  text: וְ/הָי֥וּ שָׁתֹתֶ֖י/הָ מְדֻכָּאִ֑ים כָּל עֹ֥שֵׂי שֶׂ֖כֶר אַגְמֵי נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/010.yaml
  text: And her foundations will be crushed[b][a]; all who work for wages will be grieved in soul.
translation:
  language: zh_hans
  text: 她的根基必被压碎[a]；一切为工价劳作的人，都必心里悲伤[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本含义不确定。“根基”也可理解为“支柱、支撑物”；另有人提议译作“织布工”。
    reason: alternative_reading
  - marker: b
    text: 本节末句在希伯来文中晦涩难解，字面近于“心灵的池沼”或“生命／欲望的沼泽”；许多人按语境理解为内心悲伤或沮丧。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁתֹתֶיהָ
  choice: 她的根基
  rationale: 此罕见名词的含义有争议；按可能与“安置、奠立”有关的词根，并结合埃及社会经济结构崩溃的上下文，译作“根基”。其他主要理解保留于脚注。
- source_word: מְדֻכָּאִים
  choice: 必被压碎
  rationale: דכא 的被动分词表示遭压碎或摧毁；与 וְהָיוּ 连用，在预言语境中以“必被压碎”表达将来的结果及原文的强烈程度。
- source_word: כָּל
  choice: 一切
  rationale: 保留其涵盖随后整个群体的周遍意义。
- source_word: עֹשֵׂי שֶׂכֶר
  choice: 为工价劳作的人
  rationale: 字面近于“制造／赚取工价的人”，在此自然理解为靠劳作领取报酬者；该译法兼顾原文形式和现代汉语可读性。
- source_word: אַגְמֵי נָפֶשׁ
  choice: 心里悲伤
  rationale: 马所拉辅音文本所得短语十分晦涩，字面可能近于“心灵／生命的池沼”。依语境将其理解为内心忧伤，但在脚注中保留原文的不确定性。
