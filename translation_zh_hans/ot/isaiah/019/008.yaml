base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/008.yaml
  text: And the fishermen will lament[a], and all who cast a hook into the Nile will mourn[b]; those who spread a net over the waters will waste away.
translation:
  language: zh_hans
  text: 捕鱼的必哀叹；凡把鱼钩抛入尼罗河[a]的，都必悲哀；在水面上撒网的，都必衰弱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“河”。在这里的埃及语境中，这个希伯来词通常特指尼罗河。
    reason: lexical_alternative
  - marker: b
    text: 或译“必衰颓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנוּ
  choice: 必哀叹
  rationale: 该动词表示因悲痛而哀叹、叹息；结合预言语境，用“必”表达将要发生之事。
- source_word: הַדַּיָּגִים
  choice: 打鱼的
  rationale: 指以捕鱼为业的人；“打鱼的”是自然、通俗的现代汉语表达。
- source_word: וְאָבְלוּ
  choice: 都必悲哀
  rationale: אבל常表示哀伤、悲痛；与前面的“哀叹”形成同义平行，同时保留措辞差异。
- source_word: כָּל מַשְׁלִיכֵי
  choice: 凡……的，都
  rationale: 分词结构按其持续从事的活动指称一类人；“凡……的，都”自然体现כָּל的周遍含义。
- source_word: בַיְאֹר
  choice: 抛入尼罗河
  rationale: 在针对埃及的语境中，יְאֹר通常指尼罗河或其水道；正文采用明确所指的“尼罗河”，脚注保留“河”的词义可能。介词ב在抛钩语境中自然译作“入”。
- source_word: חַכָּה
  choice: 鱼钩
  rationale: 该名词指捕鱼用的钩；“鱼钩”比单说“钩”更明确，也符合现代汉语习惯。
- source_word: וּפֹרְשֵׂי
  choice: 撒网的
  rationale: 该分词表示铺开、张开渔网的人；汉语捕鱼语境中“撒网”自然简洁。
- source_word: מִכְמֹרֶת
  choice: 网
  rationale: 指捕鱼用的网；上下文已明确捕鱼活动，无须增译“渔”。
- source_word: עַל פְּנֵי מַיִם
  choice: 在水面上
  rationale: 较直接地保留“在水的表面上”这一空间意象，同时符合现代汉语表达。
- source_word: אֻמְלָלוּ
  choice: 必衰颓
  rationale: 该动词表达衰弱、凋萎或困顿；“衰颓”兼顾身体、情绪和生计上的衰败，不把语义限定为其中一项。
