revisions:
- from: 到那日，埃及必像妇女一样[a]；万军之雅威向它挥手[b]，它就战兢惧怕。
  to: 到那日，埃及必像妇女一样[a]；因万军之雅威向它挥动手，它就战兢惧怕[b]。
  rationale: 修订将恐惧明确表述为因雅威向埃及挥动手而起，并保留原文以同根词重复描写‘手的挥动’及‘挥动’的效果。没有把介词方向强行限定为唯一的‘攻击’，故仍保留原文在‘朝向／针对’与敌对审判语境之间的表达空间。
