  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא יִֽהְיֶ֥ה מִצְרַ֖יִם כַּ/נָּשִׁ֑ים וְ/חָרַ֣ד וּ/פָחַ֗ד מִ/פְּנֵי֙ תְּנוּפַת֙ יַד יְהוָ֣ה צְבָא֔וֹת אֲשֶׁר ה֖וּא מֵנִ֥יף עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/016.yaml
  text: In that day Egypt will be like women[a], trembling and afraid because of the waving of the hand of Yahweh of Armies[c][b], which he waves against it.
translation:
  language: zh_hans
  text: 到那日，埃及必像妇女一样[a]；因万军之雅威向它挥动手，它就战兢惧怕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像妇女一样”是古代战争语境中表示脆弱和恐惧的比喻；希伯来原文明确说“妇女”。
    reason: cultural_note
  - marker: b
    text: “挥动手”也可译作“向它扬手”或“向它挥手攻击”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知书中常见的时间公式，也符合现代汉语的庄重表达。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 指埃及这个国家；下文以单数形式将其视为一个整体。
- source_word: כַּנָּשִׁים
  choice: 像妇女一样
  rationale: 希伯来文明确使用“妇女”，译文保留这一源于古代战争语境的性别化比喻，不在正文中将其弱化或中性化。
- source_word: וְחָרַד וּפָחַד
  choice: 战兢惧怕
  rationale: 两个并列动词共同强化恐惧反应；“战兢惧怕”既保留双重表达，也自然庄重。
- source_word: מִפְּנֵי
  choice: ……就
  rationale: 此处表达埃及恐惧的原因。汉语用前置原因加“就”的结构，自然呈现因果关系。
- source_word: תְּנוּפַת יַד ... מֵנִיף
  choice: 挥手
  rationale: 原文以同根词描写手的挥动或扬起。汉语正文凝练为“挥手”，保留具体且带威吓意味的动作意象；较强的“挥手攻击”列入脚注。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译神圣四字名；“万军之”是 צְבָאוֹת 在中文圣经语体中清楚、庄重且具有军事意味的表达。
- source_word: אֲשֶׁר הוּא מֵנִיף עָלָיו
  choice: 向它挥手
  rationale: 代词回指作为国家整体的埃及。“向它”保留 עָלָיו 在此处可能兼有“朝向、针对”的敌对语境，同时不把动作明确程度译得过强。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神圣四字名。正文以“雅威”呈现其专名性质，同时不把它替换为头衔“主”。
- issue: 称号 צְבָאוֹת 的译法
  choice: 万军之
  alternative: 众军之
  rationale: “万军之雅威”符合庄重的现代中文圣经语体，并保留该称号在审判语境中的军事力量感。
- issue: 是否保留“像妇女一样”的比喻
  choice: 正文照译，并以脚注说明古代语境
  alternative: 改写为“软弱无力”或“惊恐万分”
  rationale: 原文有意使用带性别的战争比喻。直接改写会抹去其历史文化特征，也会替作者化解文本带来的张力。
- issue: עָלָיו 的方向或敌对含义
  choice: 向它
  alternative: 攻击它／在它上方
  rationale: 上下文显然带有审判和威吓意味，但介词本身可表达朝向、针对或在其上方。译作“向它”保留一定歧义，脚注提示较强译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“战兢惧怕”保留先知书语气；分号使威吓动作与埃及的反应层次清楚。所有脚注标记均置于相关正文之后。
