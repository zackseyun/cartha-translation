  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/סִכַּרְתִּי֙ אֶת מִצְרַ֔יִם בְּ/יַ֖ד אֲדֹנִ֣ים קָשֶׁ֑ה וּ/מֶ֤לֶךְ עַז֙ יִמְשָׁל בָּ֔/ם נְאֻ֥ם הָ/אָד֖וֹן יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/004.yaml
  text: I will give Egypt into the hand of a harsh master[a], and a fierce king will rule over them, declares the Lord[c][b], Yahweh of Armies.
translation:
  language: zh_hans
  text: 我必把埃及交在一位严酷的统治者手中[a]；一位强悍的君王必统治他们。这是主，万军之耶和华的宣告[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “统治者”一词在希伯来文中形态为复数（“众主”），但与它搭配的形容词是单数，下一句的“君王”和动词也都是单数，因此这里很可能指一位统治者。也可译作：“我必把埃及交在一位严酷统治者的权下。”
    reason: lexical_alternative
  - marker: b
    text: 传统译法作：“这是主万军之耶和华说的。”
    reason: alternative_reading
lexical_decisions:
- source_word: וְסִכַּרְתִּי
  choice: 我必把……交在
  rationale: 此处表示将埃及交付他人权下；“交在……手中”既自然，也与后面的 בְּיַד 共同保留希伯来语意象。
- source_word: בְּיַד
  choice: 在……手中
  rationale: 这是表示落入某人权势或控制之下的常见希伯来语习语；中文同样能够自然使用“在……手中”。
- source_word: אֲדֹנִים קָשֶׁה
  choice: 一个严酷的主子
  rationale: אֲדֹנִים 形态为复数，但结合单数形容词 קָשֶׁה，以及下一分句的单数“王”和动词，语境更支持指一位统治者。“主子”与末尾神的称号“主”有所区分；“严酷”表达其苛刻压迫。
- source_word: וּמֶלֶךְ עַז
  choice: 一个凶猛的王
  rationale: עַז 可指强大、刚强或凶猛；在审判语境中，又与“严酷的主子”并列，“凶猛”较能传达令人畏惧的统治。
- source_word: יִמְשָׁל בָּם
  choice: 必统治他们
  rationale: 直接表达 משל 加 ב 的管辖、统治含义，不额外加入“压迫”等解释。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 采用现代中文先知宣告公式，保留话语的庄严权威。
- source_word: הָאָדוֹן
  choice: 主
  rationale: 在此作为神的称号，并与专名耶和华同位；译作“主”庄重且自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名形式，明确区别于称号“主”，而不以另一个称号代替专名。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: “万军之耶和华”是中文中清楚而庄重的固定表达，保留 צְבָאוֹת 的军旅、众军含义。
theological_decisions:
- issue: 神圣称号组合 הָאָדוֹן יְהוָה צְבָאוֹת 的表达
  choice: 主——万军之耶和华
  alternative: 主耶和华——万军之主
  rationale: 将 הָאָדוֹן 作为称号“主”，并将 יְהוָה 作为神名“耶和华”，从而保留原文称号与专名的区别；“万军之耶和华”自然连接 צְבָאוֹת。
- issue: אֲדֹנִים 的数
  choice: 正文按单数译为“一个……主子”
  alternative: 严酷的众主子
  rationale: 其形态虽为复数，但形容词 קָשֶׁה 为单数，后句又以单数“王”和单数动词继续描述，因此正文采用单数；形态上的张力留在脚注说明。
translation_notes:
  register: 采用现代、庄重且可朗读的标准普通话。正文保留“交在……手中”的希伯来意象，以“主子”指人的统治者、以“主”指神，避免两处 אֲדֹנִים／אָדוֹן 在中文中混淆；破折号标明“主”与“万军之耶和华”的同位关系。
