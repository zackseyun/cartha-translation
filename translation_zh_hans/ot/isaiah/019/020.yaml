revisions:
- from: 这必在埃及地为万军之耶和华作记号和见证。因为他们受欺压时必向耶和华呼求，他就差遣一位拯救者和卫护者[a]给他们，搭救他们。
  to: 这必在埃及地为万军之耶和华作记号和见证。因为他们必因压迫他们的人向耶和华呼求，他就差遣一位拯救者和卫护者[a]给他们，并搭救他们。
  rationale: 将“受欺压时”改为“因压迫他们的人”，以保留原文的因果关系和复数施压者；微调脚注，使其更准确反映 וָרָב 的争议。其余译文维持原有的忠实、庄重和现代汉语表达。
