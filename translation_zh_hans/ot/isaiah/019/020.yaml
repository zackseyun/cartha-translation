id: ISA.19.20
reference: Isaiah 19:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֨ה לְ/א֥וֹת וּ/לְ/עֵ֛ד לַֽ/יהוָ֥ה צְבָא֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם כִּֽי יִצְעֲק֤וּ אֶל יְהוָה֙ מִ/פְּנֵ֣י לֹֽחֲצִ֔ים וְ/יִשְׁלַ֥ח לָ/הֶ֛ם מוֹשִׁ֥יעַ וָ/רָ֖ב וְ/הִצִּילָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/020.yaml
  text: It will be for a sign and for a witness to Yahweh of Armies in the land of Egypt. For they will cry out to Yahweh because of oppressors[a], and he will send them a savior and champion, and he will deliver them.
translation:
  language: zh_hans
  text: 这必在埃及地为万军之耶和华作记号和见证。因为他们必因压迫他们的人向耶和华呼求，他就差遣一位拯救者和卫护者[a]给他们，并搭救他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卫护者”所译的希伯来词含义和句法都不易确定；也可理解为“一位大能者”或“强者”。
    reason: 保留 וָרָב 的词义与句法不确定性，避免正文把有争议的含义说得过于确定。
lexical_decisions:
- source_word: וְהָיָה
  choice: 这必……作
  rationale: 承接上文的祭坛和柱子，以“这”保留希伯来文单数主语的指代，并以“必”表达未完成式在预言语境中的将来意味。
- source_word: לְאוֹת וּלְעֵד
  choice: 作记号和见证
  rationale: 分别保留אוֹת的标记意义和עֵד的见证、作证意味，同时采用自然的现代汉语搭配。
- source_word: לַיהוָה צְבָאוֹת
  choice: 为万军之耶和华
  rationale: “耶和华”直接呈现神名יהוה；“万军之”简洁传达צְבָאוֹת所指的众军，并保留庄重的经文语体。
- source_word: כִּי
  choice: 因为
  rationale: 按其解释前句之所以成为记号和见证的功能翻译；“当……时”也是语境上可能的理解，但正文保留因果衔接。
- source_word: יִצְעֲקוּ אֶל־יְהוָה
  choice: 必向耶和华呼求
  rationale: “呼求”兼顾צעק在困苦中的迫切呼喊及向神求助的含义。
- source_word: מִפְּנֵי לֹחֲצִים
  choice: 受欺压时
  rationale: 将字面的“因欺压者”转成自然汉语的受事结构；上下文仍清楚表明呼求源于人的欺压。
- source_word: מוֹשִׁיעַ
  choice: 拯救者
  rationale: 直接表达使役分词“施行拯救的人”，又避免在此预先限定其具体身份。
- source_word: וָרָב
  choice: 和卫护者
  rationale: 该词在此较难确定；按与“拯救者”和“搭救”平行的功能义译作“卫护者”，并在脚注保留“强者”等可能。
- source_word: וְהִצִּילָם
  choice: 搭救他们
  rationale: 准确表达נצל使役式使人脱离危险或压迫的意义，并与前面的“拯救者”形成词义呼应而不机械重复。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经读者最熟悉的专名形式，同时将其作为神的专名而非普通称号处理。
- issue: צְבָאוֹת的译法
  choice: 万军之
  alternative: 众军的
  rationale: “万军之耶和华”自然、庄重，也能传达众军之意；不将其释义扩展为“统领万军”，以免加入原文未明说的动词关系。
- issue: 拯救者的身份
  choice: 不在正文中明确其为神圣或人间人物
  alternative: 救主
  rationale: 原文只说神将差遣一位מוֹשִׁיעַ，具体身份在本节并未说明；“拯救者”保留这一开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这”承接上文却不擅自补明所指；句式保留预言的确定语气。脚注标记[a]紧随其所解释的“卫护者”。
