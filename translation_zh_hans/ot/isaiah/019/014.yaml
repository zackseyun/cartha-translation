base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/014.yaml
  text: Yahweh has mixed within her a spirit of confusion[a], and they have led Egypt astray in all its work[b], as a drunkard staggers in his vomit.
translation:
  language: zh_hans
  text: 耶和华在埃及中掺进了使人迷乱的灵[a]；他们使埃及在一切所做的事上迷失方向[b]，好像醉汉在自己的呕吐物中踉跄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使人颠倒的灵”、“乖谬的灵”或“使人眩晕的灵”。希伯来语表达一种使人错乱、失去方向或发生扭曲的影响，体现审判。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语动词是复数：“他们使埃及迷失方向。”这里没有明确说明“他们”是谁；可能指这些使人迷乱的影响，也可能指受其影响的埃及首领。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神名音译，不以“主”这一称号替代原文专名。
- source_word: מָסַךְ
  choice: 调入了
  rationale: 该动词本义涉及调和、掺混液体；“调入”保留具体的混合意象，同时自然表达耶和华把这种影响置于埃及之中。
- source_word: בְּקִרְבָּהּ
  choice: 在埃及中间
  rationale: 阴性单数后缀回指埃及；中文不使用有性代词，明确重复“埃及”可避免指代含混。
- source_word: רוּחַ עִוְעִים
  choice: 使人迷乱的灵
  rationale: רוּחַ在此指一种支配性的灵或影响；עִוְעִים含扭曲、错乱和令人失去方向之意。“使人迷乱”兼顾作用与上下文中的判断色彩，但不限定其为单纯心理状态。
- source_word: וְהִתְעוּ
  choice: 他们使……迷失方向
  rationale: 保留马所拉文本第三人称复数动词及其使役意义，不擅自确定复数主语。
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: 在一切所做的事上
  rationale: 表达埃及所有行动和事务的整体范围；中文如此措辞自然，也避免机械处理阳性单数后缀。
- source_word: כְּהִתָּעוֹת שִׁכּוֹר
  choice: 好像醉汉……踉跄
  rationale: 将表示迷乱游移的动词性结构译为“踉跄”，传达醉酒者失控、辨不清方向的动态画面。
- source_word: בְּקִיאוֹ
  choice: 在自己的呕吐物中
  rationale: 直译原文强烈而屈辱的意象，不作弱化。
theological_decisions:
- issue: 神在审判中与“使人迷乱的灵”的关系
  choice: 译文明确说耶和华把这灵“调入”埃及中间，保留原文所陈述的主动施行。
  alternative: 译作耶和华仅仅容许埃及内部发生混乱。
  rationale: 原文以耶和华为מָסַךְ的明确主语；译文不将这种主动性弱化为许可，也不进一步界定系统神学上的因果机制。
- issue: וְהִתְעוּ的复数主语
  choice: 保留“他们使埃及……迷失方向”，不明确补出主语所指。
  alternative: 译为“这灵使埃及迷失方向”或使用被动式“埃及被引入迷途”。
  rationale: 希伯来文本使用复数动词，而具体主语在诗句中有所压缩；保留复数和指代张力最贴近文本证据。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“调入”保留原文混合液体的隐喻；“迷失方向”与“踉跄”形成语义呼应。保留“呕吐物”的尖锐画面，并以脚注呈现关键词义及复数主语的真实歧义。
