base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/007.yaml
  text: The reeds along the Nile[a], along the bank of the Nile, and every sown field of the Nile will dry up, be driven away[c][b], and be no more.
translation:
  language: zh_hans
  text: 尼罗河边、沿尼罗河岸的水草[a]，以及尼罗河的一切播种之地[b]，都必枯干，被吹散，不复存在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水草”所译的希伯来词在本处含义不确定；也可理解为“裸露之地”“草场”或“河边的植物”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“尼罗河边一切所播种的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹת
  choice: 水草
  rationale: 此词在本处含义不确定。上下文聚焦尼罗河干涸及河岸生态受损，因此译作概括河边植物的“水草”，比具体限定为“芦苇”更谨慎；另在脚注保留其他可能。
- source_word: יְאֹר
  choice: 尼罗河
  rationale: 在以埃及为背景的预言中，此词指尼罗河或其水系；正文明确译为“尼罗河”，便于现代读者识别。
- source_word: עַל פִּי יְאֹר
  choice: 尼罗河岸边
  rationale: פֶּה本义为“口”，与河流连用时可指边缘或河岸；“河岸边”自然地表达这里的空间关系。
- source_word: מִזְרַע יְאֹר
  choice: 尼罗河边所有播种之地
  rationale: מִזְרַע可指种子、所播种之物或播种地。这里译作“播种之地”，保留农业含义，也避免过度具体化为田地或庄稼。
- source_word: יִיבַשׁ
  choice: 枯干
  rationale: 该动词表示变干；“枯干”既适用于河岸植物，也适用于耕种之地及其出产。
- source_word: נִדַּף
  choice: 被风吹散
  rationale: 该被动形式有被驱散、吹散之意；“被风吹散”具体呈现其图景，并与枯干后的植物或作物相称。
- source_word: וְאֵינֶנּוּ
  choice: 归于无有
  rationale: 这一表达强调不复存在；“归于无有”庄重而清楚地保留原文结尾的彻底性。
