  yaml_path: translation/ot/isaiah/019/025.yaml
  text: whom Yahweh of Armies has blessed[a], saying, “Blessed be Egypt my people, and Assyria the work of my hands[b], and Israel my inheritance.”
translation:
  language: zh_hans
  text: 万军之雅威[a]赐福给他们，说：“愿埃及——我的子民，亚述——我手所做的，以色列——我的产业，都蒙福！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”或按传统译作“耶和华”；“万军之雅威”也常译作“万军之耶和华”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בֵּרֲכוֹ
  choice: 赐福给他们
  rationale: 关系从句承接上一节并列的埃及、亚述和以色列。希伯来语宾语后缀为阳性单数，但在语境中统指这三个群体；现代汉语用复数代词自然呈现其集合性所指。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译神名יהוה；“万军”传达צְבָאוֹת所含众军、军旅之意，并保留庄重的神圣称号形式。
- source_word: בָּרוּךְ
  choice: 愿……都蒙福
  rationale: 这里是祝福宣告。汉语以“愿……蒙福”自然保留祝福语气；“都”表明同一祝福涵盖随后并列的三个对象。
- source_word: עַמִּי מִצְרַיִם
  choice: 我的子民埃及
  rationale: 保留原文同位结构及其出人意料的神学力度，不改写为解释性的关系从句。
- source_word: מַעֲשֵׂה יָדַי אַשּׁוּר
  choice: 我手所造的亚述
  rationale: 直译“我双手的作品/作为”的同位称谓；现代汉语用“我手所造的”简洁自然，同时保留亚述蒙受这一称号的突出意味。
- source_word: נַחֲלָתִי יִשְׂרָאֵל
  choice: 我的产业以色列
  rationale: נַחֲלָה指所得之份、产业或承受之业；“产业”既准确又符合汉语圣经语体，并保留以色列与雅威之间的归属关系。
theological_decisions:
- issue: 神名יהוה及称号יהוה צבאות的译法
  choice: 万军之雅威
  alternative: 万军之耶和华
  rationale: 正文音译四字神名，以区别神的专名和“主”等称号；脚注保留中文读者熟悉的传统译名。
- issue: 盟约性称谓用于埃及和亚述
  choice: 直接保留“我的子民埃及”和“我手所造的亚述”
  alternative: 解释为“如今成为我子民的埃及”等
  rationale: 原文刻意把常与以色列关联的称谓直接用于埃及和亚述。译文不添加时间、归信过程或条件，以保存其张力和惊异感。
- issue: 单数祝福形式与三个并列对象的关系
  choice: 以“愿……都蒙福”统摄三者
  alternative: 分别重复“有福了”
  rationale: 原文只有一个בָּרוּךְ，统领埃及、亚述、以色列三个同位短语；中文用一个祝福谓语统摄全组，避免误显为三个独立句式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。引语保留祝福宣告的礼仪感，并以紧凑的并列结构呈现三个国家；不增添解释性限定，以维持原文的神学张力。
