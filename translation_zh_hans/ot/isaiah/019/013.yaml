  text: נֽוֹאֲלוּ֙ שָׂ֣רֵי צֹ֔עַן נִשְּׁא֖וּ שָׂ֣רֵי נֹ֑ף הִתְע֥וּ אֶת מִצְרַ֖יִם פִּנַּ֥ת שְׁבָטֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/013.yaml
  text: The princes of Zoan have become foolish; the princes of Noph are deceived. They have led Egypt astray[a], they who are the cornerstone of her tribes.
translation:
  language: zh_hans
  text: 琐安的首领变得愚昧；挪弗[a]的首领受了迷惑；他们——埃及各支派的房角石——使埃及走入迷途。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挪弗”是孟斐斯的希伯来名称。
    reason: 说明古地名的通行对应名称；正文采用希伯来形式的音译。
lexical_decisions:
- source_word: נֽוֹאֲלוּ
  choice: 变得愚昧
  rationale: 该词为 יאל 的尼法勒形态，表达陷入愚昧或显出愚昧；“变得愚昧”保留结果状态。
- source_word: שָׂרֵי
  choice: 首领
  rationale: שַׂר 可指统治者、权贵或官长；“首领”既符合政治精英的语境，也比“王子”更不易造成血统上的误解。
- source_word: צֹעַן
  choice: 琐安
  rationale: 按希伯来地名 צֹעַן 音译，并采用中文圣经传统中较易辨认的形式。
- source_word: נִשְּׁאוּ
  choice: 受了蒙骗
  rationale: 此处取 נשׁא 尼法勒的“受欺骗、受迷惑”义，与前句的愚昧及后句使埃及迷失构成语义连贯。
- source_word: נֹף
  choice: 挪弗
  rationale: 按希伯来文地名音译；其通常被认定为孟斐斯，置于脚注说明。
- source_word: הִתְעוּ
  choice: 使……走入迷途
  rationale: תעה 的使役形表达使对象偏离正路；此译保留使役力量及“迷途”的意象。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 现代汉语中该国家与地区名称的标准译法。
- source_word: פִּנַּת
  choice: 房角石
  rationale: 原义为“角、房角”，在此比喻支撑国家群体的核心人物；“房角石”保留具体建筑隐喻。
- source_word: שְׁבָטֶיהָ
  choice: 各支派
  rationale: שֵׁבֶט 在此指埃及内部的组成群体；阴性单数后缀指向埃及，汉语借“埃及各支派”明确所属关系。
theological_decisions:
- issue: “埃及各支派的房角石”与前文首领的关系
  choice: 将该短语同位地解释为上述首领，并用“他们这些”表达
  alternative: 把该短语理解为另一个主语，或直接并列为“她各支派的房角石”
  rationale: 希伯来语末尾名词短语没有明示系词，最自然是对两组首领作同位说明；译文保留房角石比喻，而不进一步解释其政治或神学含义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。分号保留两组首领之间的平行结构；“竟”传达本应作为国家支柱者反而误导国家的反讽，但不增添具体因果解释。脚注标记置于整节末，所注地名“挪弗”已在正文出现。
