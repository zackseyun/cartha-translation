base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/019.yaml
  text: In that day there will be an altar to Yahweh in the midst of the land of Egypt[a], and a pillar to Yahweh beside its border.
translation:
  language: zh_hans
  text: 当那日，埃及地中央必有一座献给雅威的祭坛；埃及边界旁也必有一根献给雅威的石柱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “石柱”也可译作“立石”。希伯来语 מַצֵּבָה 指竖立起来的石头或柱体。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的时间公式；“到那日”自然、庄重，并保留其预言语气。
- source_word: יִהְיֶה
  choice: 必有
  rationale: 此处 היה 是存在句；“必有”简洁地表达将来的存在，并符合先知性宣告的语体。
- source_word: מִזְבֵּחַ
  choice: 祭坛
  rationale: 通常指献祭用的坛，本节没有理由采用更宽泛或比喻性的译法。
- source_word: לַיהוָה
  choice: 献给雅威的
  rationale: 介词 ל 在此表示归属或奉献对象；译作“献给雅威的”能清楚说明祭坛和石柱均为雅威而设。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的音译，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: בְּתוֹךְ
  choice: 在……中央
  rationale: 表示位于埃及境内中央或腹地，而非边缘；“中央”既准确又适合现代汉语。
- source_word: אֶרֶץ מִצְרָיִם
  choice: 埃及地
  rationale: 保留原文“埃及之地”的构造，同时采用中文圣经语体中自然简洁的表达。
- source_word: וּמַצֵּבָה
  choice: 也必有一根……石柱
  rationale: מַצֵּבָה 指竖立的石头或石柱；“石柱”既保留材质和竖立形态，也避免泛化为“纪念碑”。补出“必有”使并列结构在中文中清楚自然。
- source_word: אֵצֶל
  choice: 在……旁
  rationale: 表达邻近、靠近的空间关系；“旁”简明自然。
- source_word: גְּבוּלָהּ
  choice: 埃及的边界
  rationale: 阴性单数后缀回指“埃及地”。中文明说“埃及”可避免“它的边界”指代含混。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以称号替代。
- issue: 正面预言语境中 מַצֵּבָה 的译法
  choice: 石柱
  alternative: 立石；纪念碑
  rationale: 该词可指竖立的石头或柱体，在别处有时涉及受谴责的宗教设施，但本节将其正面描述为献给雅威之物。译作“石柱”保留原词具体含义和经文中的神学张力，不加以淡化或调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“到那日”的先知书语体，并以重复的“献给雅威”对应原文两次出现的 לַיהוָה。脚注标记置于整节末尾，对“石柱”的词义作说明。
