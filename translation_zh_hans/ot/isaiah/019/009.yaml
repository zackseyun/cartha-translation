  yaml_path: translation/ot/isaiah/019/009.yaml
  text: Those who work with combed flax will be ashamed[b][a], and those who weave white cloth.
translation:
  language: zh_hans
  text: 从事精梳亚麻[a]加工的必蒙羞，织白布[b]的也必蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精梳亚麻”或译“优质亚麻”。原文所用词含义不十分确定，可能指经过特别加工的亚麻。
    reason: lexical_alternative
  - marker: b
    text: “白布”或译“白麻布”，可能指经过漂白的纺织品。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֹשׁוּ
  choice: 必蒙羞
  rationale: בוש常指因失败或败落而受羞辱；在审判所造成的经济崩溃语境中，“必蒙羞”既保留直接词义，也表达预告的语气。
- source_word: עֹבְדֵי
  choice: 加工……的
  rationale: 这是עבד的分词形式，指从事某项劳动的人；与亚麻连用时，“加工”比笼统的“做工”更自然，也符合纺织生产语境。
- source_word: פִשְׁתִּים
  choice: 亚麻
  rationale: 该词指亚麻这种植物或纺织原料，并非直接指成品麻布，因此译作“亚麻”。
- source_word: שְׂרִיקוֹת
  choice: 精梳
  rationale: 此词含义不十分确定，可能指经过梳理等特别处理的优质亚麻；“精梳”保留加工层面的理解，同时以脚注说明“细麻”的可能译法。
- source_word: וְאֹרְגִים
  choice: 织……的
  rationale: ארג的分词指织布者；译作“织……的”，与上句职业性表达构成自然的平行。
- source_word: חוֹרָי
  choice: 白布
  rationale: 该词大概指洁白或漂白的纺织品；“白布”清楚自然，又不把原文未明确指出的材质限定为亚麻。
