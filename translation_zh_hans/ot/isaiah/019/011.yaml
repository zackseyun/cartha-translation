base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/011.yaml
  text: Surely the princes of Zoan are fools[a]; the wise counselors of Pharaoh give foolish counsel. How can you say to Pharaoh, “I am a son of wise men[b], a son of ancient kings”?
translation:
  language: zh_hans
  text: 琐安的首领实在愚蠢；法老那些有智慧的谋士，所出的计谋愚昧[a]。你们怎能对法老说：“我是智慧人的子孙[b]，是古代君王的后裔”？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文十分紧缩，直译近于“计谋是愚昧的”，也可译作“所出的主意毫无见识”。
    reason: lexical_alternative
  - marker: b
    text: “智慧人的子孙”和“古代君王的后裔”都是表示出身或传承的说法，不一定指直接的父子关系。
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: 实在
  rationale: 此处作强调语气，而非表示限制；“实在”自然地加强断言。
- source_word: אֱוִלִים
  choice: 愚蠢
  rationale: 作谓语尖锐评断琐安的首领；“愚蠢”清楚保留原文的贬斥力度。
- source_word: שָׂרֵי צֹעַן
  choice: 琐安的首领
  rationale: שָׂרִים在宫廷政治语境中可指首领、权贵或官长；“首领”既准确又不把身份过度限定为王族。צֹעַן按传统地名译作“琐安”。
- source_word: חַכְמֵי יֹעֲצֵי פַרְעֹה
  choice: 法老有智慧的谋士
  rationale: 保留这些谋士被视为有智慧之人的表述，并与下文“愚昧不堪”的计谋形成原文的讽刺张力。
- source_word: עֵצָה נִבְעָרָה
  choice: 所出的计谋愚昧不堪
  rationale: 希伯来文是紧缩的名词结构，直译近于“计谋是愚昧的”；中文补出“所出的”使句意自然，同时保留נִבְעָרָה所含的迟钝、愚昧意味。
- source_word: אֵיךְ תֹּאמְרוּ אֶל־פַּרְעֹה
  choice: 你们怎能对法老说
  rationale: 动词为复数，故明示“你们”；“怎能”传达反问中的惊诧与责难。
- source_word: בֶּן חֲכָמִים אֲנִי
  choice: 我是智慧人的子孙
  rationale: בֶּן在此可表达出身、传承或群体归属；“子孙”在现代中文中自然体现谱系自夸，又不误解为多位智慧人的同一个亲生儿子。
- source_word: בֶּן מַלְכֵי קֶדֶם
  choice: 是古代君王的后裔
  rationale: קֶדֶם在此指往昔、古代；“后裔”自然表达王室世系，同时与上一分句保持平行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。用“愚蠢”与“愚昧不堪”保留两处严厉评断，并让“有智慧”与“愚昧”之间的讽刺张力保持可见；引语中的谱系用语则译为自然中文，同时以脚注说明其习语性质。
