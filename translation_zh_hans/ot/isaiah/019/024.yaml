  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִהְיֶ֤ה יִשְׂרָאֵל֙ שְׁלִ֣ישִׁיָּ֔ה לְ/מִצְרַ֖יִם וּ/לְ/אַשּׁ֑וּר בְּרָכָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/024.yaml
  text: In that day Israel will be the third with Egypt and Assyria[a], a blessing in the midst of the earth,
translation:
  language: zh_hans
  text: 当那日，以色列必与埃及和亚述同为三者之一，在全地之中成为福分。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“那地”。希伯来语 אֶרֶץ 既可指“全地、世界”，也可指特定的“土地、国土”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的时间用语；“到那日”自然庄重，也保留其预言语体。
- source_word: יִהְיֶה
  choice: 将……成为
  rationale: 用现代汉语的将来表达呈现 היה 的未完成式在此处的预告功能。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文圣经及一般读者熟悉的标准译名。
- source_word: שְׁלִישִׁיָּה
  choice: 并列为三者之一
  rationale: 该阴性序数词在这里作名词使用，指以色列与埃及、亚述共同构成三方；此译法比直译“第三”更能自然表达其关系，又不暗示等级次序。
- source_word: לְמִצְרַיִם וּלְאַשּׁוּר
  choice: 与埃及和亚述
  rationale: 介词 לְ 在“第三者”的结构中表达结伴或归入同一组，故译为“与”。
- source_word: בְּרָכָה
  choice: 成为福分
  rationale: 直接保留名词“福分”的含义及其盟约性回响，不扩写为“福分的源头”。
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: 在全地
  rationale: בְּקֶרֶב 字面有“在……中间”之意；结合此处跨国范围，现代汉语用“在全地”较自然地表达遍及世上的场域。הָאָרֶץ 也可指特定的“那地”，故以脚注保留歧义。
theological_decisions:
- issue: הָאָרֶץ 的范围
  choice: 全地
  alternative: 那地
  rationale: 上下文并列埃及、亚述和以色列，较支持广泛、国际性的范围；但希伯来词本身也可指特定土地，因此不排除较窄的理解，并在脚注中注明。
- issue: 福分所描述的对象
  choice: 让句法自然指向包括以色列、埃及和亚述在内的三者
  alternative: 只把“福分”理解为以色列的角色
  rationale: 希伯来文的同位关系可使“福分”紧接以色列，也可在语境中概括三方共同体。正文不添加“共同”等限定词，以保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“并列为三者之一”避免生硬的“作第三”，清楚传达三国同列的意思；句末脚注标记与正文对应。
