  text: בַּ/יּ֣וֹם הַ/ה֡וּא יִהְיוּ֩ חָמֵ֨שׁ עָרִ֜ים בְּ/אֶ֣רֶץ מִצְרַ֗יִם מְדַבְּרוֹת֙ שְׂפַ֣ת כְּנַ֔עַן וְ/נִשְׁבָּע֖וֹת לַ/יהוָ֣ה צְבָא֑וֹת עִ֣יר הַ/הֶ֔רֶס יֵאָמֵ֖ר לְ/אֶחָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/018.yaml
  text: In that day there will be five cities in the land of Egypt speaking the language of Canaan and swearing allegiance to the LORD of Armies. One of them will be called the City of Destruction.
translation:
  language: zh_hans
  text: 到那日，埃及地必有五座城说迦南的语言，并向万军之耶和华起誓。其中一座必称为“毁灭城”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁灭城”依马所拉文本；另有希伯来文本作“太阳城”，七十士译本作“公义城”。
    reason: 此处存在影响城名含义的重要古代文本异文，需向读者透明说明。
lexical_decisions:
- source_word: שְׂפַת כְּנַעַן
  choice: 迦南的语言
  rationale: שׂפה本义为“嘴唇”，在此按常用转义指语言；译文自然，同时保留其明确的迦南指向。
- source_word: וְנִשְׁבָּעוֹת לַיהוָה צְבָאוֹת
  choice: 并向万军之耶和华起誓
  rationale: 保留介词ל所表达的对象或归属方向，不把誓言内容过度具体化为经文未明说的“效忠”；יהוה צבאות采用庄重且通行的“万军之耶和华”。
- source_word: עִיר הַהֶרֶס
  choice: 毁灭城
  rationale: 按马所拉文本הֶרֶס直译为“毁灭”，并以中文名称形式简洁呈现。
theological_decisions:
- issue: 埃及诸城向耶和华起誓的性质
  choice: 向万军之耶和华起誓
  alternative: 宣誓效忠万军之耶和华
  rationale: 原文可暗示忠诚或归属，但没有明说誓言内容；正文保留这一含蓄性，避免把解释写进译文。
- issue: 末句城名的文本差异
  choice: 正文采用马所拉文本“毁灭城”
  alternative: “太阳城”或“公义城”
  rationale: 指定底本WLC作הֶרֶס，因此正文依底本翻译；重要的古代异文另以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“到那日……必……”保留先知性宣告的节奏；“五座城”符合现代量词习惯；城名加引号以便普通读者识别。
