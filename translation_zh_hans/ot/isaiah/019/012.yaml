  text: אַיָּ/ם֙ אֵפ֣וֹא חֲכָמֶ֔י/ךָ וְ/יַגִּ֥ידוּ נָ֖א לָ֑/ךְ וְ/יֵ֣דְע֔וּ מַה יָּעַ֛ץ יְהוָ֥ה צְבָא֖וֹת עַל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/012.yaml
  text: Where[a], then, are your wise men? Let them tell you, please; let them know what Yahweh of Armies has purposed against Egypt.
translation:
  language: zh_hans
  text: 那么，你的智慧人在哪里呢？让他们告诉你吧；让他们知道万军之雅威[a]对埃及所定的旨意是什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之雅威”也可按传统译作“万军之主”。“雅威”译自希伯来文的神名 YHWH。
    reason: 说明神名及“万军之雅威”这一称号的传统译法。
lexical_decisions:
- source_word: אַיָּם אֵפוֹא
  choice: 那么……在哪里呢
  rationale: 地点疑问词与强调、推论语气词连用，构成带嘲讽意味的反问；此译符合现代汉语语序，并保留“那么”和句末“呢”所表达的挑战语气。
- source_word: חֲכָמֶיךָ
  choice: 你的智慧人
  rationale: 指埃及的智者、谋士等精英群体；“智慧人”不把其身份过度限定为术士或官员。
- source_word: וְיַגִּידוּ נָא לָךְ
  choice: 请他们告诉你
  rationale: 动词在此带祈使或挑战意味，נָא 加强催促语气；“请”在上下文中可自然传达带讥讽色彩的敦促。
- source_word: וְיֵדְעוּ
  choice: 让他们知道
  rationale: 按字面保留 ידע“知道”的意义及与前句并列的命令语气，不擅自改为“辨明”或把两个分句合并。
- source_word: מַה יָּעַץ
  choice: 定了什么旨意
  rationale: יעץ 在此表示经过筹划而作出的意图或计划；“定了……旨意”既体现完成性和决意，也适合神圣语境。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: צְבָאוֹת 指众军或众天军；采用现代中文圣经读者较易识别的称号，同时以脚注说明神名与较直译的表达。
- source_word: עַל מִצְרָיִם
  choice: 对埃及
  rationale: 介词 עַל 在此既可表示“关于”，也可因审判语境带有“针对、攻击”的意味；“对埃及”保留这种范围，避免把敌对含义说得过死。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威（YHWH）
  rationale: 正文采用现代中文读者熟悉的神名形式“耶和华”，同时在脚注指出原文为专名 YHWH，并提供较接近学术音译的“雅威”，不以“主”这一称号代替专名。
- issue: 称号 יְהוָה צְבָאוֹת 的表达
  choice: 万军之耶和华
  alternative: 统领万军的雅威
  rationale: “万军之耶和华”保留希伯来语“神名＋众军”的紧密称号结构；备选译法更明确表达这些军队受其统领，但会增加原文未明说的关系词。
- issue: עַל 在审判语境中的方向
  choice: 对埃及
  alternative: 针对埃及／关于埃及
  rationale: 原文介词可表示所涉及的对象，也可在本章审判语境中含敌对方向；“对”有意保留这层张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那么……在哪里呢”保留先知话语中的反问和讥讽；“请他们”在这里是挑战式催促，并非温和请求。句法尽量维持“告诉你／让他们知道”的并列，以保存原文略显突兀的修辞张力。
