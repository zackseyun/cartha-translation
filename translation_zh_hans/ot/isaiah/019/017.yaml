  text: וְ֠/הָיְתָה אַדְמַ֨ת יְהוּדָ֤ה לְ/מִצְרַ֨יִם֙ לְ/חָגָּ֔א כֹּל֩ אֲשֶׁ֨ר יַזְכִּ֥יר אֹתָ֛/הּ אֵלָ֖י/ו יִפְחָ֑ד מִ/פְּנֵ֗י עֲצַת֙ יְהוָ֣ה צְבָא֔וֹת אֲשֶׁר ה֖וּא יוֹעֵ֥ץ עָלָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/017.yaml
  text: And the land of Judah will become a terror to Egypt[c][b][a]; everyone to whom it is mentioned will fear because of the plan of Yahweh of Armies that he is planning against it.
translation:
  language: zh_hans
  text: 犹大地必令埃及惊恐[a]；凡听人提起犹大地的，都会害怕[b]，因为万军之雅威[c]正在筹划针对埃及的计划。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“恐惧之物”“可怕之事”；另有解释传统译作“摇晃”。这里的希伯来词罕见，含义难定。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近于“每一个有人向他提起她的”；“她”指犹大地。意思是，凡听见有人提起犹大地的，都会害怕。
    reason: lexical_alternative
  - marker: c
    text: 传统译法：“万军之耶和华。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת יְהוּדָה
  choice: 犹大地
  rationale: אַדְמָה可指土地或地域；这里涉及犹大与埃及，译作“犹大地”既简洁又符合地缘语境。
- source_word: לְמִצְרַיִם
  choice: 使埃及
  rationale: 介词ל在此表示犹大地对埃及所产生的结果或影响；汉语用“使埃及”自然表达这种关系。
- source_word: לְחָגָּא
  choice: 惊恐
  rationale: 该罕见名词含义有争议；下文明确说人会害怕，因此正文采用“惊恐”，并以脚注保留“恐惧之物、可怕之事、摇晃”等可能解释。
- source_word: כֹּל אֲשֶׁר יַזְכִּיר אֹתָהּ אֵלָיו
  choice: 每一个听人向他提起犹大的人
  rationale: 原文结构紧缩，直译近于“每一个有人向他提起她的人”；这里阴性代词回指犹大地，译文明确所指，同时保留逐人听见提及便害怕的分配意义。
- source_word: יִפְחָד
  choice: 都会害怕
  rationale: 直接表达פחד在此处的惧怕含义，并与前句“惊恐”形成语义呼应。
- source_word: מִפְּנֵי עֲצַת
  choice: 因为……的计划
  rationale: מִפְּנֵי在此表示原因；עֵצָה可指谋略、筹算或计划，语境中指神针对埃及的意图。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 以“雅威”呈现神名，以“万军”表达צְבָאוֹת所含众军或天上军旅的力量意象；脚注列出传统译法。
- source_word: אֲשֶׁר הוּא יוֹעֵץ עָלָיו
  choice: 正在筹划对付埃及
  rationale: 分词יוֹעֵץ表达正在筹划或既定意向；עָלָיו带有针对、对付之意，末尾阳性代词回指阳性名词“埃及”，故明确译出“埃及”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用较直接反映四字神名的现代汉语形式，同时在脚注提供传统读法，避免把传统替代读音无说明地并入正文。
- issue: 称号צְבָאוֹת的译法
  choice: 万军
  alternative: 万军之耶和华／天军
  rationale: “万军”是现代中文圣经读者可辨认的传统表达，也保留该称号的军事与宇宙性力量意象；不把它缩减为单指地上军队。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“每一个听人向他提起犹大的人”保留原文紧缩句法的分配意义，又避免生硬直译；末句略带“筹划……计划”的重复，是为同时呈现原文名词“计划”与分词“正在筹划”的呼应。
