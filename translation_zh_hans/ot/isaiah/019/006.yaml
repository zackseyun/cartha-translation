  yaml_path: translation/ot/isaiah/019/006.yaml
  text: The rivers will stink[a]; the canals of Egypt will dwindle and dry up[c][b]; reed and rush will wither.
translation:
  language: zh_hans
  text: 江河必发臭[a]；埃及的河道[b]水量必减少，终必干涸；芦苇和蒲草[c]都必枯萎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“江河必变得污浊”。这里的希伯来语动词很罕见，含有水体腐败发臭的意思。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“玛琐的河道”；“玛琐”在这里最可能是埃及的诗体名称。
    reason: lexical_alternative
  - marker: c
    text: “蒲草”也可译作“纸莎草”。这个希伯来语词指生长在河岸或沼泽地带的植物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶאֶזְנִיחוּ
  choice: 必发臭
  rationale: 该动词罕见；在水道语境中表示变得污浊腐臭。“发臭”简洁自然，并保留审判图景的强烈感。
- source_word: נְהָרוֹת
  choice: 江河
  rationale: 该复数名词可指河流或水道；“江河”是自然、庄重的总称，也可与下文较具体的“河道”区分。
- source_word: דָּלֲלוּ
  choice: 必水势衰微
  rationale: 该动词表示变少、变弱或降低；用于水体时，“水势衰微”既呈现水量减少，也保持诗歌语体。
- source_word: וְחָרְבוּ
  choice: 终至干涸
  rationale: 该动词用于河道时指干枯、无水。“终至”自然表达与前一动词构成的递进关系，但不把两个动作合并。
- source_word: יְאֹרֵי
  choice: 河道
  rationale: 在埃及语境中，该词常指尼罗河及其支流或水渠；“河道”兼容天然支流与人工渠道，避免过度限定。
- source_word: מָצוֹר
  choice: 埃及
  rationale: 这里最可能是“埃及”的诗体或罕见称呼。正文采用清楚的地名，脚注保留音译形式及其解释。
- source_word: קָנֶה
  choice: 芦苇
  rationale: 指生于水边的高秆植物；“芦苇”是现代汉语中最自然且准确的对应词。
- source_word: וָסוּף
  choice: 蒲草
  rationale: 该词泛指沼泽或河岸植物，也可能特指纸莎草。用“蒲草”可与“芦苇”区分，并保留较宽的植物类别。
- source_word: קָמֵלוּ
  choice: 都必枯萎
  rationale: 该动词表示植物萎蔫、凋枯；“枯萎”与植物主语搭配自然，也避免重复前文用于水道的“干涸”。
