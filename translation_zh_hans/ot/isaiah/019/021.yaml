reference: Isaiah 19:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נוֹדַ֤ע יְהוָה֙ לְ/מִצְרַ֔יִם וְ/יָדְע֥וּ מִצְרַ֛יִם אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/עָֽבְדוּ֙ זֶ֣בַח וּ/מִנְחָ֔ה וְ/נָדְרוּ נֵ֥דֶר לַֽ/יהוָ֖ה וְ/שִׁלֵּֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/021.yaml
  text: And Yahweh will make himself known to Egypt[a], and Egypt will know Yahweh in that day, and they will serve with sacrifice and offering[c][b], and they will vow vows to Yahweh and fulfill them.
translation:
  language: zh_hans
  text: 耶和华必向埃及显明自己[a]；在那日，埃及人必认识耶和华，以献祭和供物敬拜他[b]。他们必向耶和华许愿，并履行所许的愿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华必为埃及所认识。”希伯来文动词也可作较被动的理解。
    reason: lexical_alternative
  - marker: b
    text: “敬拜他”或译“事奉他”。原词可指服事；在这里，献祭和供物表明所说的是敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹדַע
  choice: 必向……显明自己
  rationale: ידע 的尼פעל式可表示“被认识、为人所知”，也可带有反身意味。结合语境，译作“显明自己”自然地表达耶和华向埃及启示自己，同时以脚注保留较被动的理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行且可辨识的专名“耶和华”翻译四字神名，而不以称号替代。
- source_word: לְמִצְרַיִם
  choice: 向埃及
  rationale: 介词 ל 在此标明耶和华向谁显明自己；“向埃及”既准确，也符合现代汉语习惯。
- source_word: וְיָדְעוּ מִצְרַיִם אֶת־יְהוָה
  choice: 埃及人必认识耶和华
  rationale: מִצְרַיִם 在这里以国家名指其人民。汉语译为“埃及人”比“埃及必认识”更自然，也清楚表达集体所指。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知书常见的末世性时间表达，同时采用自然、庄重的现代汉语。
- source_word: וְעָבְדוּ
  choice: 敬拜他
  rationale: עבד 可意为“服事”或“敬拜”；下文紧接献祭与供物，明确属于礼仪敬拜语境，因此正文译作“敬拜”，并在脚注保留“事奉”的可能。宾语“他”依上下文补出。
- source_word: זֶבַח
  choice: 献祭
  rationale: 在礼仪语境中表示祭牲或祭祀；与动词结构结合译作“以献祭……敬拜”自然清楚。
- source_word: וּמִנְחָה
  choice: 供物
  rationale: מִנְחָה 可指礼物、供物，并常指素祭。此处未明说其具体种类，故用较宽泛的“供物”，避免过度限定。
- source_word: וְנָדְרוּ נֵדֶר
  choice: 必……许愿
  rationale: 希伯来文以同根动词和名词构成强调式。汉语“许愿”已自然表达其意义；不机械重复为“许下愿”，以免生硬。
- source_word: וְשִׁלֵּמוּ
  choice: 并且还愿
  rationale: שלם 与“愿”连用时表示履行、偿付所许的愿。“还愿”是准确而自然的汉语宗教用语，并与“许愿”形成清楚对应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最通行、普通读者最易识别的专名“耶和华”，既不以“主”替代，也不把特定学术拟音强加于正文。
- issue: עבד 在献祭语境中的含义
  choice: 敬拜他
  alternative: 事奉他
  rationale: 献祭、供物、许愿和还愿共同构成明确的礼仪语境，所以“敬拜”能准确传达宗教性含义；脚注保留“事奉”的词汇可能，避免消除原词语义幅度。
- issue: וְנוֹדַע 所体现的神圣主动性
  choice: 向埃及显明自己
  alternative: 为埃及所认识
  rationale: 尼פעל式容许较被动或反身的理解。正文采用符合上下文的自我显明表达，但以脚注明确保留被动译法，不把语法上的张力静默抹平。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“到那日”保留先知书语体；“许愿、还愿”简洁表达希伯来文的同根强调结构。正文中的脚注标记均与脚注对应。
