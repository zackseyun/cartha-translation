  text: And the waters of the sea will dry up[b][a], and the river will be parched and dry.
translation:
  language: zh_hans
  text: 海中的水必枯竭[a]，河流[b]必干涸，成为枯干。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“海里的水必被排干。”希伯来语动词可表示水被耗尽或干竭。
    reason: lexical_alternative
  - marker: b
    text: 按上下文，“河流”很可能指尼罗河；但希伯来原文用的是普通名词“河”，并未使用专名。
    reason: cultural_note
lexical_decisions:
- source_word: נִשְּׁתוּ
  choice: 必枯竭
  rationale: 该词在此为被动或结果意义，表示水被耗尽、干竭；译作“枯竭”既自然，也避免按字面误译为“被喝尽”。
- source_word: מַיִם מֵהַיָּם
  choice: 海水
  rationale: 希伯来文直译为“来自海的水”；现代汉语用“海水”简洁自然，同时保留“海”的用词，不擅自明确其具体所指。
- source_word: נָהָר
  choice: 大河
  rationale: 原文使用普通名词“河”，并非专名；在埃及语境中显然指当地主要河流，故译作“大河”，既符合语境，又不直接改为“尼罗河”。
- source_word: יֶחֱרַב וְיָבֵשׁ
  choice: 必干涸枯干
  rationale: 两个相近的动词连用，形成加强语气。译文保留两个近义表达，以呈现原文的紧凑重复和强烈程度。
