base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/015.yaml
  text: And there will be no work for Egypt that head or tail[a], palm branch or reed[b], can do.
translation:
  language: zh_hans
  text: 埃及将没有任何事可由头还是尾[a]、棕榈枝还是芦苇[b]做成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “头、尾、棕榈枝、芦苇”是涵盖社会各阶层的比喻，表示从最高到最低的所有人；参看以赛亚书9:14的相似意象。
    reason: cross_reference
  - marker: b
    text: 或译：“头和尾，棕榈枝和芦苇。”希伯来语可将这两组词读作并列，但意思是埃及无论尊卑，任何阶层都无力行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֶׂה
  choice: 事可做
  rationale: 此名词可指行为、工作或所从事之事；与存在句结合译为“无事可做”，符合现代汉语习惯，也保留埃及无力有所作为的含义。
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: 都做不了什么
  rationale: 未完成式在此语境中表达行动能力；译文用“做不了”自然传达无论哪一阶层都不能有所作为。
- source_word: רֹאשׁ וְזָנָב
  choice: 头还是尾
  rationale: 直译保留先知的两极意象；“还是”表达分举关系，即无论居首或居末者都无能为力。
- source_word: כִּפָּה
  choice: 棕榈枝
  rationale: 该词在此与芦苇构成高低对照；“棕榈枝”保留可能的植物意象，并与以赛亚书9:14的相似表达相呼应。
- source_word: אַגְמוֹן
  choice: 芦苇
  rationale: 该词指沼泽植物，如芦苇或灯心草；“芦苇”是现代汉语中清楚自然的对应词，也能保留与高处棕榈枝的反差。
- source_word: לְמִצְרַיִם
  choice: 埃及……无事可做
  rationale: 介词在此标示归属或关联；转换为汉语主谓结构，表示埃及没有能够成就的事。
- source_word: וְלֹא יִהְיֶה
  choice: 将无
  rationale: 这是将来时态的否定存在句；“将无”简洁、庄重，并保留预言语气。
theological_decisions:
- issue: 两组两极意象所指的范围
  choice: 正文保留“头、尾、棕榈枝、芦苇”的具体比喻，脚注说明它们涵盖社会各阶层。
  alternative: 直接意译为“无论尊贵卑贱，谁都不能做什么”。
  rationale: 原文有意使用成对意象表达从最高到最低；保留意象可维持与以赛亚书9:14的文学联系，同时借脚注帮助现代读者理解。
- issue: 连接词 וְ 的关系
  choice: 按分举意义译作“还是”。
  alternative: 形式上译作“和”。
  rationale: 希伯来语连接词本身可作并列理解，但语境强调任何一端、任何阶层都不能行动；正文采用自然汉语的分举表达，脚注保留“和”的形式对应作为替代读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文尽量保留希伯来诗歌的成对意象，以“无事可做……都做不了什么”自然表达存在句和能力上的否定；两个脚注标记均置于对应意象之后。
