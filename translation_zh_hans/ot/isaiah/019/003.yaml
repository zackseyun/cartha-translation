  text: וְ/נָבְקָ֤ה רֽוּחַ מִצְרַ֨יִם֙ בְּ/קִרְבּ֔/וֹ וַ/עֲצָת֖/וֹ אֲבַלֵּ֑עַ וְ/דָרְשׁ֤וּ אֶל הָֽ/אֱלִילִים֙ וְ/אֶל הָ֣/אִטִּ֔ים וְ/אֶל הָ/אֹב֖וֹת וְ/אֶל הַ/יִּדְּעֹנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/003.yaml
  text: And the spirit of Egypt will be emptied out within it[a], and I will swallow up its counsel; and they will seek the idols, the mutterers, the mediums, and the spiritists.
translation:
  language: zh_hans
  text: 埃及的心志必在国内耗尽；我要吞没它的谋略；埃及人必求问偶像、低声念咒的人[a]、招魂者和通灵者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “低声念咒的人”：原文用词罕见，含义不确定；也可能指“低语者”“施咒者”或“鬼魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבְקָה
  choice: 消散
  rationale: 该词表达被倒空、耗尽之意；与“心志”搭配译作“消散”，既保留内部力量流失的意象，也符合现代汉语表达。
- source_word: רוּחַ מִצְרַיִם
  choice: 埃及的心志
  rationale: רוּחַ在这里指埃及这个群体内在的精神、勇气或意志。“心志”保留一定语义宽度，又能自然表达国家内部的崩溃。
- source_word: בְּקִרְבּוֹ
  choice: 在其中
  rationale: 阳性单数后缀回指作为集体实体的埃及；“在其中”保留原文内部瓦解的空间意象。
- source_word: עֲצָתוֹ
  choice: 它的谋略
  rationale: עֵצָה可指计谋、筹划或所议定的方策；此处“谋略”适合国家危机和政策失效的语境。
- source_word: אֲבַלֵּעַ
  choice: 我要吞没
  rationale: 保留בלע“吞下、吞没”的具体隐喻，不把它直接解释为“扰乱”或“挫败”。
- source_word: וְדָרְשׁוּ אֶל
  choice: 他们必求问
  rationale: דרשׁ与אֶל连用，在占卜语境中表示向某对象寻求指示或咨询；“求问”比单纯“寻求”更清楚。
- source_word: הָאֱלִילִים
  choice: 偶像
  rationale: 直译这一带贬义的常用称谓，简明且符合先知文本的语气。
- source_word: הָאִטִּים
  choice: 低声念咒的人
  rationale: 这是罕见且词义不确定的词，可能与低语、喃喃作声或施咒有关；正文采用较少预设其为鬼魂的译法，并以脚注保留其他可能。
- source_word: הָאֹבוֹת
  choice: 招魂者
  rationale: אוֹב可指被召之亡灵，也可转指召亡灵的灵媒。列举求问对象的语境可容许两种理解；“招魂者”在现代汉语中清楚表达相关实践。
- source_word: הַיִּדְּעֹנִים
  choice: 通灵者
  rationale: 该词指借助隐秘灵界知识行事的人；“通灵者”现代、易懂，并与“招魂者”有所区分。
theological_decisions:
- issue: 如何呈现一连串与灵界求问有关的罕见术语
  choice: 采用“偶像、低声念咒的人、招魂者和通灵者”等现代直接称谓
  alternative: 译作“虚神、鬼魂、交鬼的和巫师”，或把אוֹב理解为被求问的亡灵
  rationale: 译文应显明埃及在危机中转向偶像和隐秘术，却不把语义不确定的词统一解释成特定的灵界实体，也不引入宗派性的灵界分类。
- issue: רוּחַ在本节是一般的“灵”，还是民族的勇气与意志
  choice: 译作“心志”
  alternative: 译作“灵”或“勇气”
  rationale: “心志”体现全国内在精神力量的衰败，同时避免把它限定为圣灵论意义的“灵”或仅仅等同于勇气。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“吞没”保留希伯来文的鲜明隐喻；四个并列对象用现代读者能够理解的词语表达，同时以脚注标明罕见词הָאִטִּים的不确定性。
