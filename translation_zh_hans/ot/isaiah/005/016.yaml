source:
  edition: WLC
  text: וַ/יִּגְבַּ֛ה יְהוָ֥ה צְבָא֖וֹת בַּ/מִּשְׁפָּ֑ט וְ/הָ/אֵל֙ הַ/קָּד֔וֹשׁ נִקְדָּ֖שׁ בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/016.yaml
  text: But Yahweh of hosts is exalted in justice[b][a], and the Holy God is shown holy in righteousness.
translation:
  language: zh_hans
  text: 但万军之耶和华借着审判显为崇高[a]，圣洁的上帝借着公义显为圣洁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着审判”或译“在公正中”。希伯来语מִשְׁפָּט既可指公正，也可指施行审判。
    reason: lexical_alternative
  - marker: b
    text: “显为圣洁”也可译“被尊为圣”或“被显明为圣洁”；意思是上帝的圣洁得到彰显或证实。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּה
  choice: 显为崇高
  rationale: גבה意为“高、崇高”。结合上下文，上帝崇高的地位借审判彰显出来；“显为崇高”既保留状态意义，也自然表达其公开彰显。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”音译神名，以传统且通顺的“万军”表达צְבָאוֹת所涵盖的众军之意。
- source_word: בַּמִּשְׁפָּט
  choice: 借着审判
  rationale: מִשְׁפָּט既可指公正原则，也可指司法审判行动。此处前文正描述惩罚，因此正文采用“审判”，同时以脚注保留“公正”的可能。介词ב理解为彰显所借的途径或手段。
- source_word: וְהָאֵל הַקָּדוֹשׁ
  choice: 圣洁的上帝
  rationale: 保留אֵל与定冠词形容词הַקָּדוֹשׁ的组合，以自然现代汉语表达上帝圣洁的属性。
- source_word: נִקְדָּשׁ
  choice: 显为圣洁
  rationale: קדש的Niphal形在此不是指上帝从不圣洁变为圣洁，而是指他的圣洁得到彰显或证实；“显为圣洁”也比“被尊为圣”较少引入人为主体。
- source_word: בִּצְדָקָה
  choice: 借着公义
  rationale: צְדָקָה表达公义、正直，与מִשְׁפָּט相关而不完全相同；使用“公义”保留两词的诗意对应和词义区别。
theological_decisions:
- issue: 如何翻译上帝“被分别为圣”的语言而不暗示其本性发生改变
  choice: 显为圣洁
  alternative: 被尊为圣；被显明为圣洁；成为圣洁
  rationale: נִקְדָּשׁ在形式上是Niphal，但语境所说的是上帝的圣洁借公义彰显、得到证实，并非上帝获得此前没有的圣洁。
- issue: 是否区分מִשְׁפָּט与צְדָקָה
  choice: 审判……公义
  alternative: 公正……公义；审判……正义；公义……公义
  rationale: 两个词彼此平行却不等同。“审判”贴合当前惩罚语境，“公义”则保留第二个词的道德与关系性内涵。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确这是神名而非一般称号，同时不以“主”替代原文专名。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“万军之耶和华”保留以赛亚书中重要的神圣称号；两个平行分句都用“借着……显为……”增强诗句结构，同时不抹平“审判”与“公义”的词义差别。
