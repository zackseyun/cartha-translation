base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/024.yaml
  text: Therefore[a], as the tongue of fire devours stubble, and dry grass sinks before the flame, so their root will become rot, and their blossom will go up like dust; for they have rejected the law of Yahweh of hosts[b], and have despised the word of the Holy One of Israel.
translation:
  language: zh_hans
  text: 因此，正如火舌吞噬碎秸，干草在火焰前萎倒，他们的根也必腐烂[b]，花朵必飞散如尘土；因为他们厌弃万军之雅威的律法，藐视以色列的圣者的言语。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “必腐烂”也可译作“必如腐物”；希伯来文的比较结构既可按结果性的谓语理解，也可译成明确的明喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接前文的控诉，引出审判的后果，保留先知话语中的因果逻辑。
- source_word: לְשׁוֹן אֵשׁ
  choice: 火舌
  rationale: 保留希伯来文“火的舌头”这一鲜明的诗性隐喻，同时符合现代汉语表达。
- source_word: קַשׁ
  choice: 碎秸
  rationale: 指收割后留下、容易燃烧的干枯茎秆；“碎秸”既呈现农业意象，也与后面的干燥植物材料有所区分。
- source_word: חֲשַׁשׁ
  choice: 干草
  rationale: 该词泛指干燥、易燃的植物材料；“干草”自然易懂，又不把所指限定得过窄。
- source_word: יִרְפֶּה
  choice: 萎倒
  rationale: 该动词本义涉及松弛、衰弱或倒下；“萎倒”呈现干草在火焰中失去形态的景象，而没有把词义直接强化为“烧尽”。
- source_word: שָׁרְשָׁם
  choice: 他们的根
  rationale: 保留希伯来文的单数集合意象，把群体生命的根源描绘为一个整体。
- source_word: כַּמָּק
  choice: 腐烂
  rationale: מַק 表示腐朽、溃烂；译作“腐烂”简洁而形象。比较词 כ 的句法可理解为结果性谓语，也可保留明喻，故加注说明。
- source_word: וּפִרְחָם
  choice: 花朵
  rationale: 与“根”构成完整的植物意象，指植物所开之花，也象征其外在成果与荣美。
- source_word: כָּאָבָק יַעֲלֶה
  choice: 必如尘土飞扬
  rationale: 保留“像尘土”和“上升”的双重意象；“飞扬”在现代汉语中自然表达尘土向上扬起。
- source_word: מָאֲסוּ
  choice: 厌弃
  rationale: 表达拒绝并鄙弃的强烈态度，与后面的“藐视”并列而不完全重复。
- source_word: תּוֹרַת
  choice: 律法
  rationale: 在此盟约违背与审判语境中，“律法”体现其规范性和权威性；同时不否认该词也可泛指教导。
- source_word: אִמְרַת
  choice: 话
  rationale: 自然表达神所说、所颁布的话，与前面的“律法”形成平行。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其作为专名的性质，不以称号“主”取代。
- issue: יְהוָה צְבָאוֹת 的结构
  choice: 万军之雅威
  alternative: 雅威——万军之主
  rationale: “万军之雅威”紧贴希伯来文结构，保留传统而庄重的神圣称谓；“万军”具体所指在本节并未解释，译文不加限定。
- issue: תּוֹרָה 在先知性盟约语境中的含义
  choice: 律法
  alternative: 训诲；教导
  rationale: 本节把拒绝 תּוֹרָה 作为受审判的原因，强调其盟约性的权威；译作“律法”保留这一力度，但不额外引入特定宗派的律法分类。
- issue: כַּמָּק 的比较结构
  choice: 必腐烂
  alternative: 必如腐物
  rationale: 比较介词 כ 可在汉语中按谓语结果自然表达为“腐烂”，也可明确译成明喻。正文采用较自然的结果表达，脚注保留另一种句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“火舌、根、花朵、尘土”等诗歌意象和平行结构；用“萎倒”呈现原文动词的衰弱、倒下之意，避免无根据地直译为“烧尽”。脚注标记均置于相关词语之后。
