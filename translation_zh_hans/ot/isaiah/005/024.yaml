- from: 因此，火舌怎样吞噬碎秸，干草[a]怎样在火焰中萎倒，他们的根也必腐烂[b]，花朵必如尘土飞扬；因为他们厌弃万军之雅威的律法，藐视以色列圣者的话。
  to: 因此，正如火舌吞噬碎秸，干草在火焰前萎倒，他们的根也必腐烂[b]，花朵必飞散如尘土；因为他们厌弃万军之雅威的律法，藐视以色列的圣者的言语。
  rationale: 删除脚注 a：其脚注内容讨论的是 חֲשַׁשׁ（“干草”），但英文审计轨迹的 a 锚点实际上附在前一词 קַשׁ（“碎秸／秸秆”）之后；中文草稿将 a 锚在“干草”后会造成审计锚点不一致，且“干草”正文译法已足够自然，无须保留该非必要异译注。保留并校正 b 脚注。正文调整比较句、火焰前的空间／受迫关系，以及花朵如尘土散去的意象；不改变神名、律法或审判含义。
