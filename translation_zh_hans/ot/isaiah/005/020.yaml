base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/020.yaml
  text: Woe to those who call evil good and good evil[a], who make darkness light and light darkness[b], who make bitter sweet and sweet bitter.
translation:
  language: zh_hans
  text: 祸哉！那些称恶为善、称善为恶的人[a]；他们以黑暗为光明，以光明为黑暗[b]；以苦为甜，以甜为苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对恶说‘善’，对善说‘恶’。”
    reason: lexical_alternative
  - marker: b
    text: 这里反复使用“黑暗／光明”和“苦／甜”的意象，强化了颠倒道德现实的指控，并非只是在说用词错误。
    reason: cultural_note
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是先知宣告审判、谴责的感叹语；“祸哉”既保留力度，也符合庄重的先知文体。
- source_word: הָאֹמְרִים לָרַע טוֹב וְלַטּוֹב רָע
  choice: 那些称恶为善、称善为恶的人
  rationale: אָמַר 字面为“说”，但此处句式表达给事物定性或冠名；“称……为……”自然地保留了道德判断被颠倒的含义与对称结构。
- source_word: שָׂמִים חֹשֶׁךְ לְאוֹר וְאוֹר לְחֹשֶׁךְ
  choice: 他们以黑暗为光明，以光明为黑暗
  rationale: “以……为……”贴合 שׂים 与 ל 构成的交换、视作关系，避免将意象解释成实体变化，同时保持希伯来诗歌的平行。
- source_word: שָׂמִים מַר לְמָתוֹק וּמָתוֹק לְמָר
  choice: 以苦为甜，以甜为苦
  rationale: 保留味觉意象和紧凑的反向平行；中文省略第二次“他们”，使三个分句连接自然而不削弱原文反复的力度。
theological_decisions:
- issue: 谴责的性质
  choice: 将经文呈现为对善恶及其象征秩序被颠倒的谴责，不限定于某一政治、司法或宗派语境。
  alternative: 把本节仅理解为一般性的认知混乱，或仅限定为司法与社会领域的批判。
  rationale: “恶／善”“黑暗／光明”“苦／甜”三组对照逐层强化颠倒现实秩序的指控；译文保留其广度和道德分量，但不加入原文未明说的具体应用。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“祸哉”保留先知宣告的严肃语气；主体首次明说“那些……的人”，后续以分号连接平行分句，兼顾汉语流畅度与希伯来诗歌的紧凑、对称和递进。
