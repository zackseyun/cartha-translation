revisions:
- from: 他们说：“让他快点，让他赶紧完成他的作为，好叫我们看看；让以色列圣者的计划临近并实现，好叫我们知道。”
  to: 他们说：“让他快些，让他赶紧施行他的作为，好让我们看见；让以色列的圣者的计划[a]临近、来到，好让我们知道。”
  rationale: 修订删除“完成”和“实现”所加入的结果或完成含义，分别以“施行”和“来到”对应原文的行动与双重临近表达。保留“快些／赶紧”的讥讽性重复、第三人称的修辞距离，以及“好让我们看见／知道”的平行。脚注锚定在“计划”上，保留 עֲצַת 的合理词汇歧义。
