base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/019.yaml
  text: who say[a], “Let him hurry; let him hasten his work, so that we may see it; let the plan of the Holy One of Israel draw near and come, so that we may know it.”
translation:
  language: zh_hans
  text: 他们说：“让他快些，让他赶紧施行他的作为，好让我们看见；让以色列的圣者的计划[a]临近、来到，好让我们知道。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列的圣者的旨意”或“以色列的圣者的谋议”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: 他们说
  rationale: 分词承接上一节受祸之人的描述；汉语用“他们说”自然地延续其行为刻画。
- source_word: יְמַהֵר יָחִישָׁה
  choice: 让他快点，让他赶紧
  rationale: 两个近义动词构成讥讽性的催促；分别译出，以保留希伯来文的重复加强。
- source_word: מַעֲשֵׂהוּ
  choice: 他的作为
  rationale: 该词可指工作、行为或所做之事；“作为”简洁庄重，并保留这里可能指上帝将要施行之事或审判的开放性。
- source_word: לְמַעַן נִרְאֶה
  choice: 好叫我们看看
  rationale: 表达目的，也以口语化的“看看”传达说话者轻蔑、挑衅的语气。
- source_word: וְתִקְרַב וְתָבוֹאָה
  choice: 临近并实现
  rationale: 保留两个递进动词的结构；汉语中计划“实现”比计划“来到”更自然，同时表达从临近到实际发生。
- source_word: עֲצַת
  choice: 计划
  rationale: 该词可指谋议、计划或旨意；“计划”在现代汉语中清楚易懂，也不额外引入技术性的神学含义。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列圣者
  rationale: 保留以赛亚书中这一具有代表性的上帝称号，简洁且庄重。
- source_word: וְנֵדָעָה
  choice: 好叫我们知道
  rationale: 与前面的“好叫我们看看”平行，传达讥讽者要求亲眼验证的挑战。
theological_decisions:
- issue: 第三人称单数动词及代词所指
  choice: 保留“他／他的”，由“以色列圣者”及上下文表明所指是上帝
  alternative: 直接译为“上帝快点……完成上帝的作为”
  rationale: 原文以第三人称制造带有轻蔑意味的修辞距离；不直接补出“上帝”，可保留这种讥讽张力。
- issue: עֲצַת 的含义
  choice: 计划
  alternative: 谋略；旨意
  rationale: “计划”最符合现代普通读者的表达习惯，并保留神所拟施行之事的宽泛含义；本节无需将其技术化为特定教义概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“快点／赶紧／看看”刻意保留说话者讥讽挑衅的口吻；整体句式则维持经文所需的凝练与平行结构。
