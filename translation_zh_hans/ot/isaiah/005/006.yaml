base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/006.yaml
  text: And I will make it a wasteland[a]; it will not be pruned or hoed, and briers and thorns will grow up[c][b]; and I will command the clouds not to rain on it.
translation:
  language: zh_hans
  text: 我要使它成为荒地[a]；不再修剪，也不再锄地[b]，荆棘和蒺藜必长起来；我要吩咐云彩，不在它上面降雨[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使它荒废”或“使它成为荒芜之地”。
    reason: lexical_alternative
  - marker: b
    text: 原文指翻挖或锄松土壤。
    reason: lexical_alternative
  - marker: c
    text: 原文按字面可译为“吩咐云彩不使雨降在它上面”；这是指使雨不降在其上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשִׁיתֵהוּ
  choice: 我要使它
  rationale: שׂים在此带表语名词，表示使葡萄园成为某种状态；“使它”自然保留说话者主动施行审判的语气。
- source_word: בָתָה
  choice: 荒废
  rationale: 该词指荒芜、废弃或不再耕作的状态；“荒废”既符合葡萄园语境，也适合现代汉语。
- source_word: לֹא יִזָּמֵר
  choice: 无人修剪
  rationale: זמר在葡萄园语境中特指修剪葡萄枝；译为“无人修剪”以自然汉语表达希伯来语被动式及停止料理之意。
- source_word: וְלֹא יֵעָדֵר
  choice: 无人锄地
  rationale: עדר指翻挖或锄松土壤；“锄地”明确传达葡萄园停止耕作。
- source_word: וְעָלָה
  choice: 却要长起来
  rationale: 该动词描写植物冒出、生长；“长起来”自然清楚，“却”凸显停止耕作与野生荆棘滋长的对比。
- source_word: שָׁמִיר וָשָׁיִת
  choice: 荆棘和蒺藜
  rationale: 这是一组表示荒地有刺植物的固定搭配；具体植物辨识并不完全确定，采用庄重且常见的概括性译法。
- source_word: וְעַל הֶעָבִים אֲצַוֶּה
  choice: 我也要吩咐云彩
  rationale: 保留第一人称直接施行审判的表达，并按现代汉语语序将“云彩”作为吩咐所及的对象。
- source_word: מֵהַמְטִיר עָלָיו מָטָר
  choice: 不降雨在它上面
  rationale: 介词מן接使雨降下的不定式，在צוה之后表达禁止或阻止；译文自然表达为命令云彩不向葡萄园降雨。
theological_decisions:
- issue: 审判意象中说话者的主动作为
  choice: 保留第一人称的直接行动：“我要使……”“我要吩咐……”
  alternative: 弱化为无人称的荒废或自然灾害
  rationale: 希伯来文明确将葡萄园的荒废和禁雨归于说话者的主动命令；保留这一点，不把神学张力淡化为自然过程。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无人修剪，无人锄地”以自然汉语呈现两个希伯来语被动动词；“荆棘和蒺藜”保留荒芜意象而不对植物种类作过度限定。所有脚注标记均置于相关正文之后。
