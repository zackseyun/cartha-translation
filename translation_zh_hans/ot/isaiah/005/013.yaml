source:
  edition: WLC
  text: לָ/כֵ֛ן גָּלָ֥ה עַמִּ֖/י מִ/בְּלִי דָ֑עַת וּ/כְבוֹד/וֹ֙ מְתֵ֣י רָעָ֔ב וַ/הֲמוֹנ֖/וֹ צִחֵ֥ה צָמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/013.yaml
  text: Therefore my people go into exile for lack of knowledge; their honored men are dying of hunger[a], and their multitude is parched with thirst.
translation:
  language: zh_hans
  text: 因此，我的百姓因缺乏知识而流亡；他们的尊贵人[a]饥饿不堪，民众因干渴而枯竭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译作“他的荣耀：饥饿之人”；这里很可能指百姓中尊贵或显要的人。
    reason: 保留 כְבוֹדוֹ 的字面表达及该短语在句法和词义上的歧义。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的控诉，引出其后果，保留先知话语清楚的因果逻辑。
- source_word: גָּלָה
  choice: 被掳去
  rationale: 该动词常指离开本地进入流亡或被掳的处境；此译在中文圣经语境中清楚表达放逐之意，同时不补充原文未明说的具体执行者。
- source_word: עַמִּי
  choice: 我的百姓
  rationale: 忠实保留第一人称所属关系及其圣约语境。
- source_word: מִבְּלִי דָעַת
  choice: 因缺乏知识
  rationale: מִבְּלִי 表示缺少或没有，在本句中具有因果意味；“知识”保留 דַּעַת 可涵盖认识、道德辨识及对上帝的认识等宽广含义。
- source_word: כְבוֹדוֹ
  choice: 他们的尊贵人
  rationale: 字面为“他的荣耀”，其中单数代词回指作为整体的“我的百姓”；结合下文指人的短语，语境很可能指民族中有身份、受尊崇的人。脚注保留字面形式及解释上的难点。
- source_word: מְתֵי רָעָב
  choice: 饥饿不堪
  rationale: 字面为“饥饿之人”，描述受饥荒折磨的状态；避免把 מְתֵי 误解或扩展为“正在饿死”，同时以自然中文传达其严重程度。
- source_word: הֲמוֹנוֹ
  choice: 民众
  rationale: 指人数众多的群众或百姓大众；“民众”与前面的尊贵人形成自然对照。
- source_word: צִחֵה צָמָא
  choice: 渴得干枯
  rationale: צִחֵה 表示干燥、干枯，צָמָא 表示干渴；此译保留两词叠加造成的强烈身体意象。
theological_decisions:
- issue: “知识”在先知控诉中的含义
  choice: 知识
  alternative: 认识／悟性
  rationale: דַּעַת 既可泛指知识，也可包含对上帝的认识及圣约和道德层面的辨识。“知识”不把含义缩窄为智力理解，也不在译文中预先限定其神学范围。
- issue: גָּלָה 的时间与语态表达
  choice: 被掳去
  alternative: 已经被掳去／流亡
  rationale: 希伯来语完成式在先知话语中可陈述将临之事的确定性，也可能从审判已成定局的角度说话。中文不另加“已经”或“必”，以免过度锁定时间层面；“被掳去”则清楚呈现上下文中的放逐处境。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“饥饿不堪”与“渴得干枯”形成平行，保留原文由社会上层到广大民众的对照，并避免把“饥饿之人”扩译为“正在饿死”。
