base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/027.yaml
  text: None among them is weary[a], and none stumbles; none slumbers or sleeps; the belt at his waist is not loosened[b], and the strap of his sandals is not broken.
translation:
  language: zh_hans
  text: 其中[a]没有疲倦的，也没有绊跌的；没有一个打盹，也没有一个睡觉；他腰间的腰带没有松开[b]，他凉鞋的鞋带也没有断裂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在此用单数代词“他／它”，把这支军队作为一个整体来描写。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他腰间的腰带没有解开。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָיֵף
  choice: 疲倦
  rationale: 准确表达行军中的身体疲乏，现代汉语自然清楚。
- source_word: כּוֹשֵׁל
  choice: 绊跌
  rationale: 保留失足、跌绊之意，与“疲倦”并列描写这支军队锐不可当。
- source_word: בּוֹ
  choice: 其中
  rationale: 希伯来语用阳性单数代词指前文作为整体的外邦军队；“其中”在中文里自然体现集合中的成员，又不必强行改成复数代词。
- source_word: יָנוּם / יִישָׁן
  choice: 打盹 / 睡觉
  rationale: 用两个近义而有区别的现代汉语词，保留原文的诗歌并列。
- source_word: נִפְתַּח
  choice: 松开
  rationale: 该词基本义为“被打开”，用于腰带时指解开或松脱；“松开”符合此处装备始终整齐牢靠的图景。
- source_word: אֵזוֹר חֲלָצָיו
  choice: 他腰间的带子
  rationale: 既保留腰部和束带的具体形象，也避免“腰带”与“带子”重复堆叠；单数“他”承接原文对军队整体的拟人化指称。
- source_word: נִתַּק
  choice: 断裂
  rationale: 表达被扯断、绷断的结果，用于鞋带清楚自然。
- source_word: שְׂרוֹךְ נְעָלָיו
  choice: 鞋上的带子
  rationale: 指古代鞋履的系带；“鞋上的带子”比可能引起现代鞋带联想的单独“鞋带”更具体，并保留原文装备意象。
