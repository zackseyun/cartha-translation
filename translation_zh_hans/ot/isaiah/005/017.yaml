base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/017.yaml
  text: Then lambs will graze as in their pasture[d][c][b][a], and sojourners will eat among the ruins of the well-fed.
translation:
  language: zh_hans
  text: 那时，羊羔[a]必像在自己的草场上[b]吃草；寄居者[d]必在富足者[c]的荒废之地取食。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊羔”也可译作“羊”。
    reason: lexical_alternative
  - marker: b
    text: “像在自己的草场上”：希伯来语כדברם含义和构词均有疑难；这是一种按牧放之地理解的译法，也可译作“在自己的牧放之地”。
    reason: lexical_alternative
  - marker: c
    text: “富足者”也可译作“肥壮者”；此处希伯来语词罕见，也可能带有富有者的含义。
    reason: lexical_alternative
  - marker: d
    text: “寄居者”指住在当地的外来人，也可译作“外来者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָעוּ
  choice: 那时……必……吃草
  rationale: רעה的Qal在此指牲畜吃草。将连接词וְ按上文审判所带来的结果译为“那时”，比单纯的“并且”更符合语篇推进。
- source_word: כְבָשׂים
  choice: 羊羔
  rationale: כְבָשׂים可泛指羊，也常指羊羔；正文采用常见的具体义，同时用脚注保留“羊”的可能。
- source_word: כְדָבְרָם
  choice: 像在自己的草场上
  rationale: 该词形和含义较难确定；按语境取与牧放之地有关的传统理解，表达羊群自由自在地吃草，同时在脚注中说明不确定性。
- source_word: וְחָרְבוֹת
  choice: 在……的废墟中
  rationale: חָרְבוֹת指荒废、毁坏之处。结合后面的“吃食”，以处所结构译出，使现代汉语自然。
- source_word: מֵחִים
  choice: 饱食者
  rationale: 这是罕见且含义不完全确定的形式，通常理解为肥壮、富足或富有的人。“饱食者”保留具体的丰足形象，也容纳社会地位上的含义。
- source_word: גָּרִים
  choice: 寄居者
  rationale: גָּרִים指居住在当地却不属于本地群体的人；“寄居者”比“陌生人”或泛泛的“外人”更准确。
- source_word: יֹאכֵלוּ
  choice: 吃食
  rationale: יֹאכֵלוּ的通常含义是“吃”。汉语用“吃食”可自然表达在废墟或荒地间取食，而不擅自补明具体食物。
theological_decisions:
- issue: 审判之后的社会逆转意象
  choice: 保留“饱食者”与“寄居者”的对照
  alternative: 将מֵחִים明确解释为“富人”，并把גָּרִים泛化为“外族人”
  rationale: 原文既有肥足的具体意象，也可能暗含富裕阶层；不把这种张力收窄为单一社会或族群解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吃草—吃食”保留原文两个动词之间的呼应；脚注标记紧随各自所说明的词语，避免英文咨询层中标记集中而造成指向不清。
