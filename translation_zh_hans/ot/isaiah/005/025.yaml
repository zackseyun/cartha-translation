  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל כֵּ֡ן חָרָה֩ אַף יְהוָ֨ה בְּ/עַמּ֜/וֹ וַ/יֵּ֣ט יָד֧/וֹ עָלָ֣י/ו וַ/יַּכֵּ֗/הוּ וַֽ/יִּרְגְּזוּ֙ הֶֽ/הָרִ֔ים וַ/תְּהִ֧י נִבְלָתָ֛/ם כַּ/סּוּחָ֖ה בְּ/קֶ֣רֶב חוּצ֑וֹת בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/025.yaml
  text: Therefore the anger of Yahweh burned against his people[a], and he stretched out his hand against them and struck them; the mountains quaked, and their corpses were like refuse in the midst of the streets. For all this, his anger has not turned away, and his hand is still stretched out.
translation:
  language: zh_hans
  text: 因此，耶和华向他的百姓燃起怒火；他伸手攻击他们，击打他们。群山震动，他们的尸体如同街道当中的垃圾[a]。尽管如此，他的怒气仍未转消，他的手仍然伸着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“清扫出去的污物”；希伯来语所指的是被扫除或丢弃之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 表达前文罪状与本节审判之间的推论和因果关系，简洁自然。
- source_word: חָרָה אַף יְהוָה בְּעַמּוֹ
  choice: 耶和华向他的百姓怒火燃烧
  rationale: 保留希伯来语“怒气燃烧”的鲜明意象，并以“向”清楚标明怒气所针对的对象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式译出四字神名，而不以普通称谓替代。
- source_word: וַיֵּט יָדוֹ עָלָיו
  choice: 他伸手攻击他们
  rationale: 保留“伸手”的拟人化审判意象；原文单数代词指作为集合体的“百姓”，中文按语义译为复数“他们”。
- source_word: וַיַּכֵּהוּ
  choice: 击打他们
  rationale: 直接表达审判行动，并将指向集合名词“百姓”的单数后缀按中文习惯译为“他们”。
- source_word: וַיִּרְגְּזוּ הֶהָרִים
  choice: 群山震动
  rationale: 准确表达山岭因审判而摇撼的强烈景象，语体庄重而自然。
- source_word: נִבְלָתָם
  choice: 他们的尸体
  rationale: 明确译出死尸之意，不淡化原文所呈现的惨烈后果。
- source_word: כַּסּוּחָה
  choice: 如同……垃圾
  rationale: 该词指被清扫、丢弃的污物；“垃圾”通俗清楚，脚注保留更贴近词源意象的译法。
- source_word: בְּקֶרֶב חוּצוֹת
  choice: 街道上
  rationale: 自然表达尸体暴露在城中公共街道里的景象，避免生硬直译“街道中间”。
- source_word: בְּכָל זֹאת
  choice: 虽有这一切
  rationale: 在以赛亚书反复出现的审判叠加语境中，表达先前一切惩罚仍未使怒气止息。
- source_word: לֹא שָׁב אַפּוֹ
  choice: 他的怒气仍未转消
  rationale: “转消”既符合中文表达，也保留怒气尚未转离、止息的动态意象。
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: 他的手仍然伸着
  rationale: 保留原文持续伸手的拟人化画面及尚未结束的审判张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经传统中最为人熟悉的专名形式，同时明确其为神名而非普通称谓。
- issue: 上帝发怒并伸手的拟人化语言
  choice: 保留“怒火燃烧”和“伸手”的具体意象
  alternative: 意译为“耶和华十分愤怒，并继续惩罚他们”
  rationale: 原文借身体和火焰意象表现真实而持续的神圣审判；保留这些表达可维持先知话语的力度，不将其抽象化。
- issue: 末句审判是否已经结束
  choice: 译为“他的手仍然伸着”
  alternative: 解释为“他仍要施行惩罚”
  rationale: 直译保留“伸手”究竟侧重即将继续还是正在持续施行审判的形象性张力，不作超出原文的限定。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。句式保持先知审判宣告的节奏，以分号和短句呈现连续动作；避免古奥措辞，同时保留“怒火燃烧”“伸手”等原文核心意象。脚注标记置于“垃圾”之后，与其解释对象准确对应。
