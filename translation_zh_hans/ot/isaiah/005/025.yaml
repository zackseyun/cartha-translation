- from: 因此，耶和华向他的百姓怒火燃烧；他伸手攻击他们，击打他们。群山震动，他们的尸体如同街道上的垃圾[a]。虽有这一切，他的怒气仍未转消，他的手仍然伸着。
  to: 因此，耶和华向他的百姓燃起怒火；他伸手攻击他们，击打他们。群山震动，他们的尸体如同街道当中的垃圾[a]。尽管如此，他的怒气仍未转消，他的手仍然伸着。
  rationale: 本次修订只处理汉语搭配、空间表达和连接语的自然度。“燃起怒火”保留希伯来语愤怒燃烧的形象；“街道当中”对应“在街道中间”；“尽管如此”自然承接先前审判仍未平息怒气的反复宣告。脚注标记仍准确锚定“垃圾”。
