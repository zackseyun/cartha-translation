  text: בְּ/אָזְנָ֖/י יְהוָ֣ה צְבָא֑וֹת אִם לֹ֞א בָּתִּ֤ים רַבִּים֙ לְ/שַׁמָּ֣ה יִֽהְי֔וּ גְּדֹלִ֥ים וְ/טוֹבִ֖ים מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/009.yaml
  text: 'In my ears Yahweh of Armies has sworn: Surely many houses will become a desolation[a], great and good houses[b], without inhabitant.'
translation:
  language: zh_hans
  text: '我亲耳听见万军之雅威[b]的宣告[a]：


    “许多房屋，包括宽大华美的房屋，必成为荒凉之地，无人居住。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“在我耳中，万军之雅威……”，这是表示以赛亚直接听见此信息的习语；其后的誓言公式使这宣告带有郑重而确定的语气。
    reason: lexical_alternative
  - marker: b
    text: “万军之雅威”也常译作“万军之耶和华”或“万军之主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָזְנָי
  choice: 亲自在我耳中
  rationale: 保留希伯来语“在我耳中”的具体意象，并以“亲自”传达先知直接听见宣告的意味；脚注说明这一习语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来神名的通行学术拟音处理为“雅威”，不以称号代替专名。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: “万军”是现代中文圣经语境中可理解且庄重的表达，指雅威统领天上和地上的众军。
- source_word: אִם לֹא
  choice: 必
  rationale: 该组合用于誓言时表达强烈断言，并隐含若不实现便受咒诅的省略语；中文以“必”自然传达其确定性。
- source_word: בָּתִּים רַבִּים
  choice: 许多房屋
  rationale: 此处具体指房舍，而非主要指家族或家庭。
- source_word: לְשַׁמָּה יִהְיוּ
  choice: 必成为荒场
  rationale: 保留谓语名词“荒凉、荒废之地”的结果状态，比单说“荒废”更接近原文结构。
- source_word: גְּדֹלִים וְטוֹבִים
  choice: 宽大华美的房屋
  rationale: 在房屋语境中，גָּדוֹל 表示规模大，טוֹב 表示优良、悦目或上好；“宽大华美”符合现代汉语，又不过度限定其价值意味。
- source_word: מֵאֵין יוֹשֵׁב
  choice: 必无人居住
  rationale: 以简洁自然的中文表达原文“没有居住者”的冷峻图景。
theological_decisions:
- issue: 神圣称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之雅威
  alternative: 万军之耶和华；万军之主
  rationale: 原文直接使用四字神名，故正文保留专名而不以“主”替代；“万军”保留其统帅众军的称号。脚注列出中文传统译名。
- issue: 是否明说“起誓”
  choice: 正文译作“宣告”，以“必”表达誓言的断言力量
  alternative: 在我耳中起誓说
  rationale: 希伯来文没有明写“起誓”这一动词，但 אִם לֹא 是誓言公式。译作“宣告”避免给原文补入显式动词，同时以“必”保存庄严而确定的誓言语气。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。诗行保留审判宣告的节奏和平行关系；“荒场”“宽大华美”“无人居住”形成由毁坏到空无的递进。正文中的[a]、[b]均与脚注对应。
