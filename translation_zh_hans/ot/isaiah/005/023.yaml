  text: מַצְדִּיקֵ֥י רָשָׁ֖ע עֵ֣קֶב שֹׁ֑חַד וְ/צִדְקַ֥ת צַדִּיקִ֖ים יָסִ֥ירוּ מִמֶּֽ/נּוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/023.yaml
  text: who acquit the wicked for a bribe[a], and take away the righteousness of the righteous from him.
translation:
  language: zh_hans
  text: 那些因贿赂而判恶人无罪的人[a]，又夺去每个义人的公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些因贿赂而称恶人为义的人，又夺去每个义人的公道。”
    reason: “判……无罪”也可较直译为“称……为义”；“公义”在此司法语境中也可理解为“公道”。
lexical_decisions:
- source_word: מַצְדִּיקֵי
  choice: 判……无罪的人
  rationale: 这是צדק的使役分词，在司法语境中指宣判某人无罪或为义，并非使人在道德上成为义；“判……无罪”自然传达其法庭含义。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 单数形容词作名词使用，泛指作恶或有罪之人；“恶人”也与下文“义人”形成直接对照。
- source_word: עֵקֶב שֹׁחַד
  choice: 因贿赂而
  rationale: עֵקֶב在此表示原因，שֹׁחַד指贿赂；此译保留因果关系，同时不额外限定行贿或受贿的具体方式。
- source_word: וְצִדְקַת
  choice: 又……公义
  rationale: צְדָקָה在此兼有道德与司法层面的含义。“公义”保留它与צדק词根的联系，也不把语义过度收窄为单纯的判决或权益。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词作名词，指义人这一类人；现代汉语“义人”可由语境表达集合或复数意义，并与“恶人”对应。
- source_word: יָסִירוּ
  choice: 夺去
  rationale: 该使役形式意为移除、拿走；“夺去”清楚表现腐败审判使义人失去本应归于他的公义或公道。
- source_word: מִמֶּנּוּ
  choice: 从义人身上……他的
  rationale: 马所拉文本为第三人称阳性单数后缀。中文“义人”本身不标明单复数，配合“他的”可较自然地保留原文逐一指向单个义人的分配性表达。
theological_decisions:
- issue: 司法伦理谴责中צִדְקָה的译法
  choice: 公义
  alternative: 公道；正当权益
  rationale: 上下文明确涉及腐败司法，但该词也与“判……无罪”及“义人”共享צדק词根。“公义”保留原文的词根呼应和道德—司法张力；脚注说明可按司法结果理解为“公道”。
- issue: 复数“义人”与单数代词后缀的关系
  choice: 从义人身上夺去他的公义
  alternative: 夺去义人们的公义
  rationale: 保留马所拉文本第三人称阳性单数后缀所呈现的分配性视角，不用复数所有格抹平其形式，同时借助汉语不强制标数的“义人”保持可读性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文作为上一节定语性控诉清单一部分的句法形态；“因贿赂而”避免增添原文未明说的受贿主体，“义人／他的”则兼顾汉语自然度与马所拉文本的单数后缀。
