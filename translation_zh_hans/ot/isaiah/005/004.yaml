base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/004.yaml
  text: What more was there to do for my vineyard that I have not done in it? Why[a], when I expected it to produce grapes, did it produce wild grapes?
translation:
  language: zh_hans
  text: 我为我的葡萄园，还有什么可做而我没有在其中做过的呢？我期待它结葡萄，为何却结出坏果子[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“野葡萄”“无用的果子”或“恶臭的果子”；希伯来语所指的是劣质、不可用的果实。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לַּעֲשׂוֹת עוֹד
  choice: 还能做什么
  rationale: 保留希伯来语反问的力度，表达已经没有任何该做而未做之事；现代汉语自然简洁。
- source_word: לְכַרְמִי
  choice: 为我的葡萄园
  rationale: 此处介词表示为葡萄园施行有益的工作；“葡萄园”直译并保留诗歌意象。
- source_word: וְלֹא עָשִׂיתִי בּוֹ
  choice: 是我没有在园中做过的呢
  rationale: 保留 בּוֹ 的空间意义“在其中”，并以完成体“做过”传达园主并无疏漏的反问。
- source_word: קִוֵּיתִי
  choice: 我既期待
  rationale: קוה 在这里指对葡萄园出产的期待，而不仅是等候；“既”使前提与反常结果之间的张力在汉语中清楚可辨。
- source_word: לַעֲשׂוֹת עֲנָבִים
  choice: 它结出好葡萄
  rationale: עשה 用于土地或植物出产时可译作“结出”；原文 עֲנָבִים 本为“葡萄”，加入“好”是为清楚呈现其与后文劣质果实的对比。
- source_word: וַיַּעַשׂ בְּאֻשִׁים
  choice: 它反倒结出坏葡萄
  rationale: “反倒”体现预期与实际结果的强烈反差；בְּאֻשִׁים 指恶臭、劣质而不可用的果实，“坏葡萄”比传统的“野葡萄”更直接传达词义，同时脚注保留其他可能表达。
theological_decisions:
- issue: 葡萄园的比喻意象
  choice: 正文保留“我的葡萄园”，不在本节内解释其所指。
  alternative: 直接译成“我的百姓”或“以色列”。
  rationale: 本节本身以葡萄园诗歌发问，所指在上下文中才得到说明；翻译不应提前用解释取代意象。
- issue: 园主的充分作为与葡萄园的失败之间的张力
  choice: 以两个反问保留原文张力，不补充失败原因。
  alternative: 解释为葡萄园因悖逆或罪恶而结坏果。
  rationale: 这些解释可由上下文推知，但本节的措辞集中于园主的质问；正文不应加入原文未明说的神学因果说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个反问尽量贴近希伯来语结构；“在园中”保留原文空间表达。正文以“坏葡萄”传达 בְּאֻשִׁים 的贬义，脚注列出传统译法及较字面的语义范围。
