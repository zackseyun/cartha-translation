  text: כִּ֗י עֲשֶׂ֨רֶת֙ צִמְדֵּי כֶ֔רֶם יַעֲשׂ֖וּ בַּ֣ת אֶחָ֑ת וְ/זֶ֥רַע חֹ֖מֶר יַעֲשֶׂ֥ה אֵיפָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/010.yaml
  text: For ten yoke-pairs of vineyard will yield one bath[b][a], and a homer of seed will yield an ephah.
translation:
  language: zh_hans
  text: 因为十轭地的葡萄园只能出产一罢特[a][b]，一贺梅珥的种子只能出产一伊法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十轭地”也可译作“十对轭的葡萄园”。“轭”本指一对负轭的耕畜，也可能指一对耕畜所能耕作的土地面积；这里大概是指十对耕畜所对应的耕作面积，并不是说葡萄园里有十对牲畜。
    reason: lexical_alternative
  - marker: b
    text: “罢特”是液体容量单位，“伊法”是干物容量单位；一贺梅珥等于十伊法。这里强调严重的歉收：大片葡萄园只出极少的酒，大量种子播下后，收成却只有种子量的十分之一。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的审判宣告，表达原因或解释关系；“因为”在现代汉语中自然清楚。
- source_word: עֲשֶׂרֶת צִמְדֵּי כֶרֶם
  choice: 十轭地的葡萄园
  rationale: צֶמֶד本指一对负轭牲畜，也可引申为一对牲畜所能耕作的土地面积。译作“轭地”保留古代农耕计量意象，并避免换算成不确定的现代面积。
- source_word: יַעֲשׂוּ
  choice: 只能出
  rationale: עשה在农产语境中表示出产；加入“只能”自然凸显原文巨大面积与微薄产量之间的强烈反差。
- source_word: בַּת אֶחָת
  choice: 一罢特
  rationale: 保留古代液体容量单位的专名，不在正文中作不确定的现代换算。
- source_word: וְזֶרַע חֹמֶר
  choice: 一贺梅珥种子
  rationale: 按结构表达以一贺梅珥为量的种子；措辞简洁，并保留古代容量单位。
- source_word: יַעֲשֶׂה
  choice: 只能收
  rationale: 同一动词在播种与收成的语境中自然译为“收”，明确这是投入种子后所得的产量；“只能”呈现歉收的反差。
- source_word: אֵיפָה
  choice: 一伊法
  rationale: 保留古代干量单位的专名，以维持原文计量关系的准确性。
theological_decisions: []
