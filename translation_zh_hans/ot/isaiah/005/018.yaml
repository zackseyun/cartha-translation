  text: ה֛וֹי מֹשְׁכֵ֥י הֶֽ/עָוֺ֖ן בְּ/חַבְלֵ֣י הַ/שָּׁ֑וְא וְ/כַ/עֲב֥וֹת הָ/עֲגָלָ֖ה חַטָּאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/018.yaml
  text: Woe to those who drag iniquity with cords of falsehood[a], and sin with cart ropes[b],
translation:
  language: zh_hans
  text: 祸哉！那些用虚妄[a]的绳索拖着罪孽，又像用套车的粗绳[b]一样拉着罪恶的人！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚妄”也可译为“虚假”或“虚空”；希伯来词可表达虚空、徒然或虚假。
    reason: lexical_alternative
  - marker: b
    text: 原文此处可直译为“像用套车的粗绳一样”。这幅图景也可能暗示他们把罪责或惩罚招到自己身上，而不只是拖着罪恶前行。
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是先知宣告审判或发出哀叹的感叹词；“祸哉”简洁庄重，并保留其谴责力度。
- source_word: מֹשְׁכֵי
  choice: 拖着／拉着
  rationale: 分词表示持续的动作；结合绳索与车绳的意象，译为“拖着”“拉着”，呈现用力牵引的画面。
- source_word: עָוֹן
  choice: 罪孽
  rationale: 该词可指恶行，也可指罪责及其后果；“罪孽”保留道德分量，又与后面的 חַטָּאָה“罪恶”有所区别。
- source_word: בְּחַבְלֵי הַשָּׁוְא
  choice: 用虚妄的绳索
  rationale: שָׁוְא 可表示虚空、虚妄或虚假；“虚妄”在现代中文中兼顾空妄与不实，不把语义限缩为蓄意欺骗。
- source_word: וְכַעֲבֹתוֹת הָעֲגָלָה
  choice: 用套车的粗绳
  rationale: עֲבֹתוֹת 指粗绳，הָעֲגָלָה 指车；中文以“套车的粗绳”自然呈现用于牵引车辆的结实绳索。希伯来文的 כְּ 可表比较，脚注保留这一点。
- source_word: חַטָּאָה
  choice: 罪恶
  rationale: 译作“罪恶”可自然承接牵拉意象，同时避免与前面的 עָוֹן 完全合并为同一个中文词。
theological_decisions:
- issue: 人和罪孽之间的比喻关系
  choice: 正文描绘人主动而持续地拖拉罪孽、牵拉罪恶，突出他们执意与恶相连。
  alternative: 也可能含有他们借虚妄把罪责或惩罚招到自己身上的意思。
  rationale: 两个受词 עָוֹן 与 חַטָּאָה 最直接地构成被牵拉之物；但 עָוֹן 也可涵盖罪责及后果，因此不应排除“招致罪责或刑罚”的余义。
translation_notes:
  register: 采用现代、庄重而形象的先知性语言。“祸哉”保留宣告审判的力度；平行结构以“拖着／拉着”避免机械重复，并使绳索与套车粗绳的递进画面清楚可懂。
