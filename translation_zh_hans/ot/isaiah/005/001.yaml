base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/001.yaml
  text: 'Let me sing[a], please, for my beloved a song of my beloved concerning his vineyard: my beloved had a vineyard on a fertile hill.'
translation:
  language: zh_hans
  text: 请让我为我的挚爱唱一首歌：一首我所爱者的歌，关于他的葡萄园。我的挚爱有一座葡萄园，在肥沃的山冈上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肥沃的山冈”希伯来文直译为“油之子的角”；“角”指突起的高地，这一习语形容土地丰饶肥美。
    reason: 保留原文独特的地貌比喻和希伯来习语，同时让正文保持自然清楚。
lexical_decisions:
- source_word: אָשִׁירָה נָּא
  choice: 请让我……歌唱
  rationale: אָשִׁירָה是第一人称单数鼓励式，נָּא增添恳请或柔和语气；合译为“请让我……歌唱”，既表达自我倡议，也保留语气词的作用。
- source_word: לִידִידִי
  choice: 为我的挚爱
  rationale: ל可表示对象或关联；“为”自然表达歌唱所指向的对象。“挚爱”保留亲密而诗意的关系称谓，不预先说明其身份。
- source_word: שִׁירַת דּוֹדִי לְכַרְמוֹ
  choice: 我爱的人关于他葡萄园的歌
  rationale: 保留结构中“我爱的人之歌”与“关于他葡萄园”的关系，同时不把属格进一步限定为“所作”或“写给”，以免消除原文可能保有的含混。
- source_word: כֶּרֶם
  choice: 葡萄园
  rationale: 这是该词在本语境中的标准、自然对应词。
- source_word: הָיָה לִידִידִי
  choice: 我的挚爱有
  rationale: 希伯来语以“有一个葡萄园属于我的挚爱”的存在—领属结构表达所有关系；现代汉语自然译为“我的挚爱有”。
- source_word: בְּקֶרֶן בֶּן שָׁמֶן
  choice: 在肥沃的山冈上
  rationale: קֶרֶן字面为“角”，此处作地貌比喻，指突起的山冈；בֶּן שָׁמֶן字面为“油脂之子”，是表示丰饶肥美的习语。正文传达地理与农业意义，字面意象收入脚注。
theological_decisions:
- issue: “挚爱／我爱的人”的身份
  choice: 正文保留诗歌中的关系称谓，不明确指认其身份。
  alternative: 直接把所爱者认定为耶和华，或认定为先知的朋友／诗歌中的文学人物。
  rationale: 本节作为葡萄园之歌的开篇，尚未明说所爱者是谁；后文虽逐步揭示比喻所指，译文仍应保留此处的文学悬念与神学张力。
- issue: יָדִיד与דּוֹד的关系称谓
  choice: 分别译作“挚爱”和“我爱的人”，但不赋予不同的神学身份。
  alternative: 两者完全统一为同一中文称谓，或把דּוֹד专门译成带有情爱意味的“恋人”。
  rationale: 原文使用两个相近而不同的词。中文用相近称谓略作区分，可保留诗意变化，又不把关系过度性化或建立原文未明说的身份差别。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“请让我”传达鼓励式与נָּא的柔和语气；“挚爱／我爱的人”亲密但不过度浪漫化。脚注标记置于其所解释的“肥沃的山冈”之后。
