  text: וַֽ/יְעַזְּקֵ֣/הוּ וַֽ/יְסַקְּלֵ֗/הוּ וַ/יִּטָּעֵ֨/הוּ֙ שֹׂרֵ֔ק וַ/יִּ֤בֶן מִגְדָּל֙ בְּ/תוֹכ֔/וֹ וְ/גַם יֶ֖קֶב חָצֵ֣ב בּ֑/וֹ וַ/יְקַ֛ו לַ/עֲשׂ֥וֹת עֲנָבִ֖ים וַ/יַּ֥עַשׂ בְּאֻשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/002.yaml
  text: He dug it up[a], cleared it of stones, and planted it with choice vines; he built a tower in its midst, and also hewed out a winepress in it. Then he expected it to produce grapes, but it produced wild grapes.
translation:
  language: zh_hans
  text: 他翻松园地，清除石头，栽上上等的葡萄树；又在园中建了一座塔，凿出一个榨酒池。他期待园子结出葡萄，园子却结出坏葡萄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“野葡萄”或“坏果子”。希伯来词指品质恶劣、令人厌弃或毫无价值的果实，与园主所期待的葡萄相反。
    reason: 说明 בְּאֻשִׁים 的词义范围及常见译法，避免将它仅理解为某一种野生葡萄。
lexical_decisions:
- source_word: וַיְעַזְּקֵהוּ
  choice: 翻松园地
  rationale: 该动词在葡萄园语境中指翻掘、耕作土壤；“翻松园地”既自然，又保留了整地的农业图景。
- source_word: וַיְסַקְּלֵהוּ
  choice: 清除石头
  rationale: 此处的加强词干指从田地中除去石块，而不是用石头击打；译文明示其语境义。
- source_word: שֹׂרֵק
  choice: 上等的葡萄树
  rationale: 该词指优良、精选的葡萄品种；用集合意义的“葡萄树”表达所栽种的优质葡萄植株。
- source_word: מִגְדָּל
  choice: 塔
  rationale: 希伯来词本义为“塔”；虽在葡萄园中可能用作瞭望塔，正文不额外限定其用途。
- source_word: בְּתוֹכוֹ
  choice: 在园中
  rationale: 自然表达“在它中间”，并明确代词所指的葡萄园，避免现代汉语中的指代含混。
- source_word: יֶקֶב
  choice: 榨酒池
  rationale: 该词指压榨葡萄、承接汁液的设施；“榨酒池”符合凿造于园中的具体图景。
- source_word: חָצֵב
  choice: 凿出
  rationale: 该动词常指从岩石中凿取或开凿；“凿出”保留了设施由石中开出的鲜明画面。
- source_word: וַיְקַו
  choice: 期待
  rationale: 该动词可表示等候、盼望；园主精心预备之后，“期待”准确传达其合理的盼望。
- source_word: לַעֲשׂוֹת עֲנָבִים
  choice: 结出好葡萄
  rationale: 字面为“结出葡萄”；上下文将所期待的葡萄与实际结出的劣果相对照，补出“好”使汉语中的对比清楚而不改变所指。
- source_word: וַיַּעַשׂ בְּאֻשִׁים
  choice: 却结出了劣质的葡萄
  rationale: בְּאֻשִׁים 指与预期佳果相反的坏果、臭果或无价值的葡萄；“劣质的葡萄”保留贬义且不过度限定具体品种。
theological_decisions:
- issue: 葡萄园意象后来被解释为以色列（参本章第7节）
  choice: 本节只保留具体的葡萄园农业图景
  alternative: 在译文中提前点明葡萄园所象征的对象
  rationale: 本节作为葡萄园之歌的一部分，尚以具体意象展开；应让后文自行揭示其寓意，不在这里提前消解比喻张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；用“翻松园地”“凿出”等具体动词保持诗歌的农业画面，并以分号和转折突出园主精心预备与意外坏果之间的反差。
