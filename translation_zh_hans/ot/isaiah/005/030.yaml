base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/030.yaml
  text: And he will roar over it on that day like the roaring of the sea[a]; and if one looks to the land, behold, darkness and distress[d][c][b], and the light is darkened in its clouds.
translation:
  language: zh_hans
  text: 那日，他必向它咆哮，如同海的怒吼[a]；人若望向那地[b]，看哪，尽是黑暗和困苦[c]，光在其云层中也昏暗了[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向它”也可译作“向他”或“在他上方”；希伯来语后缀为阳性单数，可能指人格化的百姓、土地或受攻击的对象，须视上文如何理解而定。
    reason: alternative_reading
  - marker: b
    text: “那地”也可译作“大地”；希伯来语 אֶרֶץ 两义皆可。
    reason: lexical_alternative
  - marker: c
    text: “困苦”也可译作“痛苦”或“患难”；希伯来语 צַר 含有窘迫、受压和艰难之意。
    reason: lexical_alternative
  - marker: d
    text: 末句的希伯来文较难确定；也可译作“光因其云层而昏暗”或“光在其浓云中昏暗”。“其”可按上下文理解为那地，但原文的具体指向不宜完全确定。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִנְהֹם
  choice: 他必……咆哮
  rationale: נהם表示响亮的吼叫或咆哮。动词为第三人称阳性单数，主语未明说；用“他”保留其单数和人格化表达，不擅自指明是敌军、民族或其他对象。
- source_word: עָלָיו
  choice: 向它
  rationale: על加第三人称阳性单数后缀在这里可表示朝向、针对或临到某对象。“向它”符合咆哮这一动作的汉语搭配，同时避免断定所指究竟是百姓、土地还是受攻击的对象。
- source_word: בַּיּוֹם הַהוּא
  choice: 那日
  rationale: 采用现代汉语中简洁而庄重的先知性时间表达。
- source_word: כְּנַהֲמַת יָם
  choice: 如同海的怒吼
  rationale: 保留原文以海浪轰鸣比拟咆哮声的听觉意象；“怒吼”在审判语境中自然有力。
- source_word: וְנִבַּט לָאָרֶץ
  choice: 人若望向那地
  rationale: 该形式可作非特指的观察表达，译作“人若”自然地传达“若有人观看”的意思；אֶרֶץ在本段语境中优先译为“那地”，同时以脚注保留“大地”的可能。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文突然引人注目的指示和异象感，也符合庄重的现代圣经汉语。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 直接传达该词的基本意义，并保持诗歌中的审判意象。
- source_word: צַר
  choice: 困苦
  rationale: 该词可指窘迫、患难、痛苦或受压迫的处境；“困苦”兼顾外在境况与内在感受。
- source_word: וָאוֹר חָשַׁךְ
  choice: 光……也昏暗了
  rationale: 保留“光”与“黑暗”的强烈反差；“昏暗了”自然表达结果状态，又不把句法过度限定为被动。
- source_word: בַּעֲרִיפֶיהָ
  choice: 在那地的云层中
  rationale: 按ב的常见处所义译为“在……中”，并将阴性单数后缀自然回指“那地”。עריפים罕见且末句含义困难，正文采用“云层”，脚注保留“浓云”等可能。
