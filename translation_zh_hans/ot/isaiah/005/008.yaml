  text: ה֗וֹי מַגִּיעֵ֥י בַ֨יִת֙ בְּ/בַ֔יִת שָׂדֶ֥ה בְ/שָׂדֶ֖ה יַקְרִ֑יבוּ עַ֚ד אֶ֣פֶס מָק֔וֹם וְ/הֽוּשַׁבְתֶּ֥ם לְ/בַדְּ/כֶ֖ם בְּ/קֶ֥רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/008.yaml
  text: Woe to those who join house to house[a], who bring field near to field until there is no place left[b], and you are made to dwell alone in the midst of the land.
translation:
  language: zh_hans
  text: 祸哉！那些房屋连着房屋、田地接着田地的人，直到没有余地，以致你们被安置，独自住在这地中间。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末句突然转用第二人称复数，直接指向这些兼并房屋田地的人。这里的动词为被动使役式，意为“你们被安置居住”；经文没有说明是谁如此安置他们。
    reason: 说明第二人称转换，并保留动词的被动使役语态及未明施事者。
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是先知宣告审判的感叹语；“祸哉”保留警告与谴责的庄重语气。
- source_word: מַגִּיעֵי בַיִת בְּבַיִת
  choice: 那些房连房……的人
  rationale: 使役分词本义为“使……相接”；“房连房”自然简洁，并呈现不断兼并房产的图景。
- source_word: שָׂדֶה בְשָׂדֶה יַקְרִיבוּ
  choice: 田接田
  rationale: יַקְרִיבוּ本义为“使靠近”，与前句平行；在地产语境中译作“田接田”，清楚表达把相邻田地并在一起。
- source_word: עַד אֶפֶס מָקוֹם
  choice: 直到再无余地
  rationale: 表达兼并持续到没有剩余空间；“再无余地”既贴近原义，也符合现代汉语。
- source_word: וְהוּשַׁבְתֶּם
  choice: 只剩你们……居住
  rationale: 保留希伯来文突然转为第二人称复数的直接指斥；在汉语中以结果表达承载其被动或使役色彩，避免生硬的“被使居住”。
- source_word: לְבַדְּכֶם
  choice: 只剩你们独居
  rationale: 同时传达“你们自己”和排除他人的意味，突出侵占者最终独占土地。
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: 在这地中间
  rationale: 保留“在地的内部／中间”的空间意象；“这地”在上下文中自然指所论之地。
theological_decisions:
- issue: 末句的语态与施事者
  choice: 译为“只剩你们独居”，不补明是谁使他们居住
  alternative: “你们被安置，独自住在这地中间”
  rationale: וְהוּשַׁבְתֶּם形态带有被动或使役结果色彩，但经文没有明说施事者；正文保留结果与第二人称冲击力，不将其明确解释为上帝的安排或许可。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“房连房、田接田”保存原文平行节奏和地产兼并意象；末句用逗号连续推进，呈现贪婪扩张直至独占全地的结果。
