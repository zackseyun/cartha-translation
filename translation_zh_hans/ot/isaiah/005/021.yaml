  text: ה֖וֹי חֲכָמִ֣ים בְּ/עֵֽינֵי/הֶ֑ם וְ/נֶ֥גֶד פְּנֵי/הֶ֖ם נְבֹנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/021.yaml
  text: Woe to those who are wise in their own eyes and discerning in their own sight[a].
translation:
  language: zh_hans
  text: 那些自以为有智慧、自视为明达的人有祸了！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明达”也可译作“有悟性”或“有辨别力”。希伯来语原词指理解、洞察和辨别的能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 有祸了
  rationale: 这是先知宣告审判或哀叹的感叹词；“有祸了”在现代汉语中自然有力，并保留警告和定罪的语气。
- source_word: חֲכָמִים
  choice: 有智慧
  rationale: 表示“有智慧的人”；与“自以为”连用，清楚表达这里所谴责的是人的自我评价，而非真正的智慧。
- source_word: בְּעֵינֵיהֶם
  choice: 自以为
  rationale: 希伯来语直译为“在自己眼中”，是表达自我判断的惯用语；“自以为”自然传达其反身含义及负面语境。
- source_word: וְנֶגֶד פְּנֵיהֶם
  choice: 自视为
  rationale: 字面涉及“在自己面前／脸前”，与前半句平行，表达以自己为判断标准；“自视为”既自然又保留自我评断的平行结构。
- source_word: נְבֹנִים
  choice: 明达
  rationale: 该词表示有理解力、洞察力或辨别力；“明达”语言庄重简洁，并能与“有智慧”形成既相近又不完全重复的对应。
theological_decisions:
- issue: 经文所谴责的是智慧本身，还是自以为有智慧
  choice: 明确指向自我认定的智慧和明达
  alternative: 把句子理解为对所有智慧或理解力的谴责
  rationale: 两个反身性短语“在自己眼中”和“在自己面前”限定了谴责对象；经文反对的是自负、自我认证，而非真正的智慧。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自以为……自视为……”保留原文两个平行的自我评价短语；“有祸了”呈现先知审判宣告的力度。
