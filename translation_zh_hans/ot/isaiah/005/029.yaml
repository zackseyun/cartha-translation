base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/029.yaml
  text: Its roaring is like a lion[a], and it roars like young lions; it growls and seizes prey, and carries it off[b], with none to rescue.
translation:
  language: zh_hans
  text: 它的吼声如狮子[a]，它吼叫如少壮狮子；它低吼，抓住猎物，把猎物带走[b]，无人能救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狮子”也可译作“母狮”；此词在某些语境中可有较具体的雌性含义，但此处译作泛称的“狮子”较能保留原文的开放性，并与“少壮狮子”形成平行。
    reason: lexical_alternative
  - marker: b
    text: “带走”或译“拖走”或“带走而脱身”；原文动词表示将猎物带离，使其无法被夺回。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָגָה ל֖/וֹ
  choice: 它的吼声
  rationale: 名词 שְׁאָגָה 指狮子的吼声；לוֹ 的阳性单数后缀回指上文拟人化的入侵者，汉语用“它的”自然地表达集体性指称。
- source_word: כַּ/לָּבִיא
  choice: 如雄狮
  rationale: לָבִיא 指强壮成熟的狮子，有时可更具体理解为母狮；此处与“少壮狮子”平行，“雄狮”能突出成熟强壮的形象，同时以脚注保留词义可能性。
- source_word: ו/שאג
  choice: 它吼叫
  rationale: 完成式在诗歌的生动描写序列中呈现眼前景象，汉语不必用将来时；“吼叫”保留狮吼意象。
- source_word: כַּ/כְּפִירִים
  choice: 如少壮狮子
  rationale: כְּפִירִים 指正值强健、能够捕猎的年轻狮子，并非幼小的狮崽；“少壮狮子”兼顾年龄与力量。
- source_word: וְ/יִנְהֹם
  choice: 它咆哮
  rationale: נהם 表示猛兽低沉的吼声或咆哮；“咆哮”自然有力，并与前面的“吼叫”形成声音层次。
- source_word: וְ/יֹאחֵז טֶרֶף
  choice: 抓住猎物
  rationale: אחז 是牢牢抓住，טֶרֶף 在狮子比喻中直接指猎物；此译保持动作鲜明。
- source_word: וְ/יַפְלִיט
  choice: 将其叼走
  rationale: 此处使役形表达把猎物带离、使之无法被夺回；在狮子意象中“叼走”比一般的“带走”更具体，脚注保留“拖走、带走而脱身”等译法。
- source_word: וְ/אֵין מַצִּיל
  choice: 无人能救
  rationale: 原文强调没有施救或解救者；“无人能救”简洁自然，也传达猎物无可挽回的处境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而具诗歌力度的普通话。以“吼声—吼叫—咆哮—抓住—叼走”的连续动作为主线，保存希伯来诗句的猛兽意象和紧迫感；两处真实词义可能性以脚注说明。
