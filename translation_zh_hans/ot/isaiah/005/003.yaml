  text: וְ/עַתָּ֛ה יוֹשֵׁ֥ב יְרוּשָׁלִַ֖ם וְ/אִ֣ישׁ יְהוּדָ֑ה שִׁפְטוּ נָ֕א בֵּינִ֖/י וּ/בֵ֥ין כַּרְמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/003.yaml
  text: And now[a], inhabitant of Jerusalem and man of Judah, judge, please, between me and my vineyard.
translation:
  language: zh_hans
  text: 如今，耶路撒冷的居民和犹大人哪，请在我和我的葡萄园之间作出判断。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转折，承接前文的葡萄园之歌，并转入直接呼告；汉语用“现在”自然，无须机械译出连接词“和”。
- source_word: יוֹשֵׁב יְרוּשָׁלַם
  choice: 耶路撒冷的居民
  rationale: 单数分词在此具有集合性，以代表性单数称呼耶路撒冷全体居民；中文“居民”本身不显数，可兼顾原文形式与自然表达。
- source_word: וְאִישׁ יְהוּדָה
  choice: 和犹大人
  rationale: אִישׁ为阳性单数，在此与前句平行，代表犹大众民；“犹大人”保留人物称谓和代表性单数的空间，又比“犹大的男人”更符合现代汉语及语境。
- source_word: שִׁפְטוּ
  choice: 评判
  rationale: 复数命令式要求听众对争议双方作出判断；“评判”既体现司法性判断，也适合此处的修辞邀请。
- source_word: נָא
  choice: 请
  rationale: 表达恳请语气，缓和命令，现代汉语自然简洁。
- source_word: בֵּינִי וּבֵין כַּרְמִי
  choice: 在我和我的葡萄园之间
  rationale: 保留重复介词所表达的争议双方结构；“葡萄园”是כֶּרֶם在本段比喻中的标准自然译法。
theological_decisions:
- issue: 代表性单数与群体称呼
  choice: 正文译作“耶路撒冷的居民和犹大人”，并以脚注说明希伯来文使用单数形式代表群体。
  alternative: 译作“耶路撒冷的居民们和犹大众人”或“耶路撒冷和犹大的百姓”。
  rationale: 原文以两个阳性单数表达向全体听众发言，同时复数命令式表明所呼告的是群体。正文尽量保留代表性单数的质感，脚注则防止读者误以为只指两个个体。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“哪”标示直接呼告；“请……评判”保留原文恳请式命令的修辞力度。
