id: ISA.5.7
reference: Isaiah 5:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י כֶ֜רֶם יְהוָ֤ה צְבָאוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/אִ֣ישׁ יְהוּדָ֔ה נְטַ֖ע שַׁעֲשׁוּעָ֑י/ו וַ/יְקַ֤ו לְ/מִשְׁפָּט֙ וְ/הִנֵּ֣ה מִשְׂפָּ֔ח לִ/צְדָקָ֖ה וְ/הִנֵּ֥ה צְעָקָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/007.yaml
  text: For the vineyard of Yahweh of Armies is the house of Israel[a], and the men of Judah are the planting of his delight. He looked for justice, but behold, bloodshed; for righteousness, but behold[c][b], an outcry.
translation:
  language: zh_hans
  text: 因为万军之耶和华的葡萄园就是以色列家，犹大人[b]是他所喜悦的栽种。他指望公平，看哪，竟有流血；指望公义，看哪，竟有哀号。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 原文直译为“犹大之人”，形式为单数，但在这里可作集合意义，指犹大人这一群体。
    reason: alternative_reading
  - marker: c
    text: 希伯来文在这里有两组音近词：מִשְׁפָּט（公平）与 מִשְׂפָּח（流血），צְדָקָה（公义）与 צְעָקָה（哀号）。这种文字游戏突出耶和华所指望的与实际看见的之间的尖锐反差。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并解释葡萄园之歌的寓意，保留原文的因果、说明作用。
- source_word: כֶרֶם
  choice: 葡萄园
  rationale: 指经过栽培的葡萄园，与上文持续的葡萄园意象相符。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”采用现代中文圣经读者熟悉的神名形式；“万军之”保留 צְבָאוֹת 所表达的统帅众军之称号。[a]
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留希伯来语表示整体群体及盟约共同体的惯用说法。
- source_word: וְאִישׁ יְהוּדָה
  choice: 犹大人
  rationale: אִישׁ 形式为单数，此处具有集合意义；中文“犹大人”可自然地兼具单数形式与群体所指，不必强行改成复数。
- source_word: נְטַע שַׁעֲשׁוּעָיו
  choice: 他所喜爱的栽种
  rationale: 兼顾农业隐喻和神喜爱其所栽种之物的含义，避免将名词意象弱化为一般性的“植物”。
- source_word: וַיְקַו
  choice: 他指望
  rationale: 表达园主期待葡萄园结出相称果实的语境含义，比单纯“观看”更准确。
- source_word: לְמִשְׁפָּט
  choice: 公平
  rationale: 此处指社会及司法秩序中的公正；“公平”与后面的“公义”既相关又有所区分。
- source_word: מִשְׂפָּח
  choice: 流血
  rationale: 该罕见词在此通常理解为暴力流血，并与 מִשְׁפָּט 构成音近反讽；正文采用清楚自然的“流血”，以脚注说明文字游戏。
- source_word: לִצְדָקָה
  choice: 公义
  rationale: 保留 צדקה 的道德、社会及盟约秩序内涵。
- source_word: צְעָקָה
  choice: 哀号
  rationale: 指受压迫或遭受不义者发出的痛苦呼喊；“哀号”比泛指声音的“呼喊”更能显明语境中的苦难。
theological_decisions:
- issue: 神名 יְהוָה 的中文表达
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文不以“主”替代，而采用现代中文圣经传统中最广为人知的专名“耶和华”；脚注交代其对应关系，以免掩盖原文。
- issue: וְאִישׁ יְהוּדָה 的单数形式与集合意义
  choice: 犹大人
  alternative: 犹大众人／犹大这个人
  rationale: 保留 אִישׁ 的单数表面形式，同时让中文自然表达其在上下文中的群体指向，不将其限定为某一个个体，也不额外强化性别。
- issue: 神所期待与实际所得之间的张力
  choice: 保留“公平—流血、公义—哀号”的并列反差
  alternative: 释义为“他本想他们行善，却发现他们作恶”
  rationale: 原文借具体的社会伦理用语及音近文字游戏揭露不义；概括性释义会削弱先知话语的力度和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“看哪，竟是／竟有”保留 הִנֵּה 的突现感和惊讶反差；句式维持原文两组平行结构。所有专门的原文信息置于脚注，正文保持普通读者可直接理解。
