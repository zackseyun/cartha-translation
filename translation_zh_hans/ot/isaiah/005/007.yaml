revisions:
- from: 因为万军之耶和华的葡萄园就是以色列家，犹大人[b]是他所喜爱的栽种。他指望公平，看哪，竟是流血；指望公义，看哪，竟有哀号。[c]
  to: 因为万军之耶和华的葡萄园就是以色列家，犹大人[b]是他所喜悦的栽种。他指望公平，看哪，竟有流血；指望公义，看哪，竟有哀号。[c]
  rationale: 仅作两项安全的中文表达修订：以‘所喜悦的栽种’明确原文属格与农业意象；以两处‘竟有’增强原文两组名词性对照的平行和现代中文的自然度。保留神名、集合性理解、伦理术语及文字游戏脚注，未增添教派性解释。
