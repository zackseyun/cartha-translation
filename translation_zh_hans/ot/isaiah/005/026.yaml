base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/026.yaml
  text: He will raise a signal for the nations from far away[a], and whistle for them from the end of the earth; and behold, quickly, swiftly[c][b], it comes.
translation:
  language: zh_hans
  text: 他要向远方的列国竖起旗号[a]，又从地极向他们吹哨召唤[b]；看哪，他们正迅速敏捷地赶来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旗号”也可译作“旗帜”或“信号”。原词指竖起供人看见、用于召集或指示的标志。
    reason: lexical_alternative
  - marker: b
    text: 原词指吹口哨，发出尖锐的声音作为召唤信号。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文“向他……他来”均为单数形式，可能把列国所代表的来犯势力视为一个整体。译文按前文“列国”用复数表达。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וְנָשָׂא
  choice: 他要……竖起
  rationale: 该完成式在先知话语的语境中指向将来的行动；“竖起”与旗号这一意象搭配自然。
- source_word: נֵס
  choice: 旗号
  rationale: 指竖起作为召集或指示之用的标志，也可指旗帜；“旗号”兼顾可见标志及军事召集的功能。
- source_word: לַגּוֹיִם מֵרָחוֹק
  choice: 向远方的列国
  rationale: 将介词理解为信号所指向、召集的对象，并把“从远处”自然表达为列国所在的远方。
- source_word: וְשָׁרַק
  choice: 吹哨召唤
  rationale: 该词表示发出尖锐的口哨声；补出“召唤”说明其语境功能，避免现代读者误解为嘘声。
- source_word: לוֹ
  choice: 向他们
  rationale: 希伯来文形式为阳性单数，但所指是前文列国所代表的集体；正文用复数使现代汉语顺畅，并以脚注交代原文的单数变化。
- source_word: מִקְצֵה הָאָרֶץ
  choice: 从地极
  rationale: 这是表示大地遥远尽头的凝练表达，保留先知文学的宏阔意象。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注目、加强临场感的语篇标记。
- source_word: מְהֵרָה קַל
  choice: 迅速敏捷地
  rationale: 两个相邻词共同强调来势之快；分别译出“迅速”和“敏捷”，保留叠加强调而不显累赘。
- source_word: יָבוֹא
  choice: 来了
  rationale: 原文为阳性单数未完成式，在“看哪”之后具有生动、迫近的呈现效果；“来了”符合现代汉语的临场表达。
theological_decisions:
- issue: 被召来的列国与末句单数形式之间的指称关系
  choice: 前半句按列国这一复数对象译作“他们”，末句以“那支大军”呈现单数的集体形象，并加脚注说明。
  alternative: 全句都译为复数“他们……来了”，或严格按形式译为单数“它……来了”。
  rationale: 原文先说复数“列国”，继而用单数代词和动词描写被召来的势力。译文既不把这一变化完全抹平，也避免现代汉语中指代不明；这属于语法和文学意象的处理，不据此限定其具体历史身份。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“旗号”“地极”“看哪”保留先知诗歌的意象和力度；“吹哨召唤”则以现代读者容易理解的方式交代动作功能。末句使用“那支大军”使单数集体意象在汉语中清楚可读。
