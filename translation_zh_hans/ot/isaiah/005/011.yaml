  text: ה֛וֹי מַשְׁכִּימֵ֥י בַ/בֹּ֖קֶר שֵׁכָ֣ר יִרְדֹּ֑פוּ מְאַחֲרֵ֣י בַ/נֶּ֔שֶׁף יַ֖יִן יַדְלִיקֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/011.yaml
  text: Woe to those who rise early in the morning to pursue strong drink[a], who stay late into the evening until wine inflames them.
translation:
  language: zh_hans
  text: 祸哉！那些清早起来追逐浓酒，流连到暮色[a]降临，葡萄酒使他们发热的人！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“晨曦”。希伯来语 נֶשֶׁף 指晨昏交替时的微光，既可指暮色，也可指晨曦；本节从“清早”延续到较晚时分，较支持译作“暮色”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是先知宣告审判并带有哀叹色彩的感叹语；“祸哉”简洁庄重，也保留其强烈语气。
- source_word: מַשְׁכִּימֵי בַבֹּקֶר
  choice: 清早起来
  rationale: 保留“早起”的分词含义和清晨这一时间背景，同时符合现代汉语表达。
- source_word: שֵׁכָר
  choice: 浓酒
  rationale: 泛指葡萄酒以外能使人醉的饮料，并不专指现代蒸馏烈酒；“浓酒”可避免过度限定酒类。
- source_word: יִרְדֹּפוּ
  choice: 追逐
  rationale: 保留动词“追赶、追求”的鲜明形象，表现他们急切而沉迷地寻求酒。
- source_word: מְאַחֲרֵי
  choice: 仍迟迟不散
  rationale: 该分词表示拖延、逗留到很晚；结合饮宴语境译为“仍迟迟不散”，自然呈现持续逗留之意。
- source_word: בַנֶּשֶׁף
  choice: 在暮色中
  rationale: נֶשֶׁף 可指晨昏的微光；本节从清早延续到较晚时分，语境较支持傍晚暮色，但以脚注保留词义上的歧义。
- source_word: יַיִן
  choice: 葡萄酒
  rationale: 明确对应葡萄酿成的酒，也与前面的 שֵׁכָר“浓酒”有所区分。
- source_word: יַדְלִיקֵם
  choice: 使他们浑身发热
  rationale: 该使役动词含有点燃、烧热的形象；此译保留酒使人如被点燃的身体感受，又不把比喻缩减为单纯的“兴奋”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的先知性语体。“祸哉”保留审判宣告的力度；后半句维持原文“酒使他们燃热”的形象。脚注标记置于“暮色中仍迟迟不散”之后，因为脚注实际说明的是 נֶשֶׁף，而不是“浓酒”。
