id: ISA.5.14
reference: Isaiah 5:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן הִרְחִ֤יבָה שְּׁאוֹל֙ נַפְשָׁ֔/הּ וּ/פָעֲרָ֥ה פִ֖י/הָ לִ/בְלִי חֹ֑ק וְ/יָרַ֨ד הֲדָרָ֧/הּ וַ/הֲמוֹנָ֛/הּ וּ/שְׁאוֹנָ֖/הּ וְ/עָלֵ֥ז בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/014.yaml
  text: Therefore Sheol has enlarged its throat and opened its mouth without measure[a], and her splendor, her multitude, her uproar[c][b], and the one who exults in her go down.
translation:
  language: zh_hans
  text: 因此，阴间张大了喉咙，敞开了口，毫无限度[a]；城的荣华、人群、喧嚣，以及在城中欢欣的人，都要降下去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“扩大了她的נֶפֶשׁ（生命／魂）”；在张口吞噬的意象中，此处可指“喉咙”，也可理解为“胃口”或“食欲”。“毫无限度”也可译为“无限无量”。
    reason: 说明希伯来语习语及“毫无限度”的词义选择。
  - marker: b
    text: 原文中“她的”及“在她中间”的阴性单数后缀，按上下文通常指本段所说的城；故正文译作“城的／在城中”。
    reason: 说明阴性后缀的通常所指及正文为中文清晰度所作的显化。
lexical_decisions:
- source_word: שְּׁאוֹל
  choice: 阴间
  rationale: 指死人所在的领域，并在本节中被拟人化为张口吞噬者；“阴间”是现代中文圣经语体中自然且不等同于坟墓或抽象死亡的表达。
- source_word: הִרְחִיבָה ... נַפְשָׁהּ
  choice: 张大了喉咙
  rationale: נֶפֶשׁ 字面义宽泛，在张口吞咽的上下文中指喉咙或吞食的欲望；译作“喉咙”保留具体的身体意象，并与下句相呼应。
- source_word: וּפָעֲרָה פִיהָ
  choice: 敞开了口
  rationale: 保留阴间张口吞噬的鲜明拟人意象；中文简洁自然。
- source_word: לִבְלִי חֹק
  choice: 毫无限度
  rationale: חֹק 在此不是律例，而是界限或限度；该译法表达阴间之口无边无际。
- source_word: וְיָרַד
  choice: 都要下到那里去
  rationale: 希伯来语单数动词置于复合主语之前；中文用“都要”统摄后列各项，表达预告审判的确定性。“那里”承接前文阴间，使去向清楚。
- source_word: הֲדָרָהּ
  choice: 城中的荣华
  rationale: 阴性后缀所指在语境中是城；显化为“城中的”可避免现代中文误以为是阴间的荣华，同时保留城市的显赫与华美。
- source_word: הֲמוֹנָהּ
  choice: 群众
  rationale: 表达城中众多的人群，保留集合意义。
- source_word: שְׁאוֹנָהּ
  choice: 喧嚣
  rationale: 既可涵盖嘈杂声响，也适合上文宴乐及城市骚动的语境。
- source_word: וְעָלֵז בָּהּ
  choice: 在其中欢欣的人
  rationale: 保留希伯来语单数形式，又让 בָּהּ 的指向在中文中保持一定开放性；“欢欣”可包含宴乐与得意的意味，不额外加入傲慢。
theological_decisions:
- issue: שְּׁאוֹל 在审判诗歌中的译法
  choice: 阴间
  alternative: 坟墓／死亡／死人之境
  rationale: “阴间”保留其作为死人领域并被拟人化的诗意和神学张力，不把它缩减为单一坟墓，也不抽象化为死亡本身。
- issue: 阴性代词后缀的所指
  choice: 将荣华、群众、喧嚣明确归于城，但将“在其中”保留为较开放的指代
  alternative: 把所有阴性后缀统一明确为耶路撒冷，或统一理解为阴间
  rationale: 本节在阴间的阴性拟人和城市的阴性指称之间形成可能的指代张力。列举之物按语境属于城；最后 בָּהּ 可指城，也可能在诗句结构中与阴间形成回响，因此不在正文中强行指定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“阴间”保存 שְׁאוֹל 的传统概念和拟人意象；用“张大了喉咙，敞开了口”保持诗歌的吞噬画面。主句依中文习惯以“都要下到那里去”收束复合主语。所有脚注标记均已置入正文。
