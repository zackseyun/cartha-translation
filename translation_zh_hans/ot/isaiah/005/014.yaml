- from: 因此，阴间张大了喉咙，敞开了口，毫无限度[a]；城中的荣华、群众、喧嚣[b]，以及在其中欢欣的人，都要下到那里去。
  to: 因此，阴间张大了喉咙，敞开了口，毫无限度[a]；城的荣华、人群、喧嚣，以及在城中欢欣的人，都要降下去[b]。
  rationale: 修订不改变阴间吞噬城中繁华与欢宴者的审判意象。它以较自然的“人群”替换“群众”，删除末句额外补出的“那里”，并校正脚注b对代词所指的说明，使之符合句法、上下文及中文读者的理解。
