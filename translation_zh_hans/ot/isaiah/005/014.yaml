  naturalness: “城中的群众”略带现代政治语汇色彩，在此诗歌语境中“城的人群”更自然。“都要降下去”庄重、清楚，也保留预言性审判的语气。
  terminology: “阴间”可自然对应שׁאול，并保留其并非单纯坟墓或抽象死亡、且在本节被拟人化的意象。“喉咙”是此处נפש在吞噬语境下可接受的具体化译法；脚注同时说明“胃口／食欲”的可行理解。
