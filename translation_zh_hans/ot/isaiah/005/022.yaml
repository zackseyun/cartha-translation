id: ISA.5.22
reference: Isaiah 5:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ה֕וֹי גִּבּוֹרִ֖ים לִ/שְׁתּ֣וֹת יָ֑יִן וְ/אַנְשֵׁי חַ֖יִל לִ/מְסֹ֥ךְ שֵׁכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/022.yaml
  text: Woe to those who are heroes at drinking wine[b][a], and men of strength at mixing strong drink.
translation:
  language: zh_hans
  text: 祸哉，那些善于喝葡萄酒的英雄[a]，善于调制烈酒的勇士[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“强者”或“勇士”。这个希伯来词通常指有能力的人或战士，在这里却讽刺地用于形容喝酒的本领。
    reason: lexical_alternative
  - marker: b
    text: 原文也可译“有能力的人”或“英勇的人”。这个惯用语通常表示有才干或勇武的人，在这里却讽刺地用于形容善于调制醉人饮料的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是先知宣告审判并带有哀叹色彩的感叹词；“祸哉”以庄重而清楚的现代中文保留其强烈语气。
- source_word: גִּבּוֹרִים
  choice: 英雄
  rationale: 该词通常指勇士或强者，本节却讽刺地称善饮者为“英雄”；此译法能突出反讽。
- source_word: לִשְׁתּוֹת יַיִן
  choice: 善于喝葡萄酒
  rationale: 介词ל与不定式说明这些人被称为“英雄”的领域；“善于”在中文中自然表达其所谓本领。יַיִן按通常含义译为“葡萄酒”。
- source_word: אַנְשֵׁי חַיִל
  choice: 勇士
  rationale: 这一词组常指有能力、有力量或英勇的人，与前半句平行，在此同样具有讽刺意味。
- source_word: לִמְסֹךְ
  choice: 善于调制
  rationale: 该动词指混合、调配饮料；“调制”既保留具体动作，也与前句“善于”形成平行。
- source_word: שֵׁכָר
  choice: 烈酒
  rationale: 该词泛指能使人醉的酒类饮料，不宜限定为某一种酒；“烈酒”是简明自然的中文对应。
theological_decisions:
- issue: 是否把本节明确解释为谴责一切饮酒行为
  choice: 不作此扩展，只保留经文对以饮酒和调酒本领自夸之人的讽刺与祸患宣告
  alternative: 译成对任何饮酒行为的普遍禁令
  rationale: 原文直接抨击的是被讽称为“英雄”“勇士”的饮酒、调酒能手；译文不应加入原文没有明说的伦理范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“祸哉”保留先知审判宣告的语体；两个“善于”使希伯来文的平行结构在中文中清晰自然。“英雄／勇士”刻意保留原文的讽刺张力，脚注说明其常见的军事或能力含义。
