reference: Isaiah 5:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּה֙ אוֹדִֽיעָה נָּ֣א אֶתְ/כֶ֔ם אֵ֛ת אֲשֶׁר אֲנִ֥י עֹשֶׂ֖ה לְ/כַרְמִ֑/י הָסֵ֤ר מְשׂוּכָּת/וֹ֙ וְ/הָיָ֣ה לְ/בָעֵ֔ר פָּרֹ֥ץ גְּדֵר֖/וֹ וְ/הָיָ֥ה לְ/מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/005.yaml
  text: 'And now[a], please let me tell you what I will do to my vineyard: I will remove its hedge, and it will be burned; I will break down its wall[b], and it will be trampled down.'
translation:
  language: zh_hans
  text: 现在，请让我告诉你们，我要怎样处置我的葡萄园：我要除去它的篱笆，任它被吞吃[a]；我要拆毁它的围墙，任它被践踏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“任它被焚烧”或“任它被毁灭”。希伯来语直译近似“使它成为供吞吃（或焚烧）之物”。
    reason: 保留וְהָיָה לְבָעֵר对于毁坏方式及施事者未予明说的词义余地。
  - marker: b
    text: 或译“使它成为任人践踏之地”。
    reason: 保留וְהָיָה לְמִרְמָס的名词性表达。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 这是承接上文并引出下一步行动的话语转换；现代汉语用“现在”已能自然表达其承接和时间意味。
- source_word: אוֹדִיעָה נָּא אֶתְכֶם
  choice: 请容我告诉你们
  rationale: ידע的使役式表示“使知道、告知”，נָא带请求或郑重劝请的语气；“请容我告诉你们”既保留这一语气，也符合庄重自然的现代汉语。
- source_word: אֵת אֲשֶׁר אֲנִי עֹשֶׂה לְכַרְמִי
  choice: 我要怎样处置我的葡萄园
  rationale: 分词עֹשֶׂה在此指即将采取的行动；“怎样处置”自然表达“我要对葡萄园做什么”，并凸显后文所列的具体行动。
- source_word: הָסֵר מְשׂוּכָּתוֹ
  choice: 我要拆去它的篱笆
  rationale: הָסֵר是绝对不定式，在行动宣告中具有明确而果断的作用；מְשׂוּכָּה指葡萄园外围的防护篱笆。
- source_word: וְהָיָה לְבָעֵר
  choice: 使它被烧毁
  rationale: 该结构直译近似“使它成为焚烧之物”，表达撤去保护后的毁坏结果；正文采用“被烧毁”，同时以脚注保留“被吞吃净／被毁掉”等词义可能。
- source_word: פָּרֹץ גְּדֵרוֹ
  choice: 拆毁它的围墙
  rationale: פָּרֹץ表示冲破、拆毁；גָּדֵר是围墙或围护设施，与前面的篱笆有别，因此译作“围墙”。
- source_word: וְהָיָה לְמִרְמָס
  choice: 使它遭受践踏
  rationale: מִרְמָס表示践踏或供践踏之处；正文用自然的动词表达结果，并在脚注保留名词性理解。
theological_decisions:
- issue: 葡萄园作为审判意象
  choice: 正文保留葡萄园、篱笆、围墙和践踏等农业意象，不在本节明说葡萄园所指。
  alternative: 在正文中直接说明葡萄园象征以色列或犹大。
  rationale: 本节本身继续以葡萄园之歌的形象说话；其所指由上下文揭示，不宜在翻译中提前解释，以免削弱比喻及其审判张力。
- issue: לְבָעֵר所描述的毁坏方式
  choice: 正文译为“被烧毁”，脚注说明其他可能。
  alternative: 译为“被吞吃净”或较宽泛的“被毁掉”。
  rationale: 该词在此可能唤起焚烧或耗尽、吞吃的含义；正文依据其形态及葡萄园毁坏意象采用“烧毁”，但不以此排除其他理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“请容我告诉你们”保留נָא的郑重语气；“篱笆”与“围墙”明确区分两层防护。两个结果分句结构平行，以呈现希伯来诗句的节奏和审判力度。
