  yaml_path: translation/ot/isaiah/005/028.yaml
  text: whose arrows are sharpened[a], and all his bows are bent; the hooves of his horses are considered like flint[c][b], and his wheels like the whirlwind.
translation:
  language: zh_hans
  text: 那国的箭都已磨利，所有的弓都已拉开[a]；它的马蹄被看作如火石一般坚硬[b]，它的车轮好像旋风[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“都已上弦”；希伯来文描写弓已经预备好，可以使用。
    reason: lexical_alternative
  - marker: b
    text: 或译“坚石”；这个比喻强调马蹄极其坚硬。
    reason: lexical_alternative
  - marker: c
    text: 或译“暴风”或“狂风”；这个意象强调行进迅猛，势不可挡。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 那国的
  rationale: 本词引出关系从句，承接上一节所说的入侵之国。汉语以“那国的”自然带出后续各项，同时保留集体名词作为单数对象。
- source_word: חִצָּיו שְׁנוּנִים
  choice: 箭都已磨利
  rationale: שְׁנוּנִים表示箭锐利或已经磨尖；“已磨利”突出武器已为战斗预备妥当。
- source_word: וְכָל קַשְּׁתֹתָיו דְּרֻכוֹת
  choice: 所有的弓都已张开
  rationale: דְּרֻכוֹת描写弓已被弯张、处于可用状态；“已张开”既保留动作意象，也表达备战状态。
- source_word: פַּרְסוֹת סוּסָיו
  choice: 它的马蹄
  rationale: 准确表达“它的马匹之蹄”，并沿用希伯来文第三人称阳性单数后缀所体现的集体单数指称。
- source_word: כַּצַּר
  choice: 火石
  rationale: צַר在此指坚硬的石头，通常理解为火石；“火石”简洁传达马蹄坚硬耐击的比喻。
- source_word: נֶחְשָׁבוּ
  choice: 被视为
  rationale: 保留חשׁב的尼法勒语态所表达的“被看作、被算为”，不把判断弱化为单纯的“仿佛”。
- source_word: וְגַלְגִּלָּיו
  choice: 它的车轮
  rationale: 原词直指轮子；上下文为军队推进，译作“车轮”自然明确，又不额外加入原文未明说的“战车”。
- source_word: כַּסּוּפָה
  choice: 好像旋风
  rationale: סוּפָה可指猛烈风暴或旋风；“旋风”同时呈现急速和强大破坏力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙述。“那国”承接上文的集体单数对象，后续以“它”保持希伯来文单数后缀的一致性。三个并列意象节奏紧凑，呈现入侵军队装备精良、行动迅猛的威势。
