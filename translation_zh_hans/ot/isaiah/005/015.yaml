base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/015.yaml
  text: And man is brought low[a], and a man is humbled[b], and the eyes of the lofty will be brought low.
translation:
  language: zh_hans
  text: 人就屈身[a]，世人也降卑；高傲者的眼目[b]必降卑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人被降低”。原文前两句使用两个意思相关却不相同的动词：第一个表达俯下或屈身，第二个表达降卑或被降低。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“高者的眼目”，指自高之人傲慢的眼神。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁח
  choice: 便被压低
  rationale: 该动词表示俯伏、降低或被压低。这里处于审判语境，用被动式“被压低”既保留受贬抑之意，也与下一分句的近义动词形成诗歌平行；“便”承接上文所述的审判结果。
- source_word: אָדָם
  choice: 人
  rationale: 此处泛指人类，同时保持希伯来文单数集合性用法；简洁的“人”适合与下一分句的“世人”构成平行。
- source_word: וַיִּשְׁפַּל
  choice: 降卑
  rationale: שׁפל 表示变低、降卑。译作“降卑”可与前句“被压低”保持同一语义场，又呈现原文两个相关而不同的动词。
- source_word: אִישׁ
  choice: 世人
  rationale: 该词在这里与 אָדָם 平行，泛指人。汉语若直译为“一个人”容易误解为某一特定个人，因此用“世人”表达普遍指向，同时避免把两个平行词完全合并。
- source_word: עֵינֵי גְבֹהִים
  choice: 高傲之人的眼目
  rationale: 直译为“高者的眼目”。“高傲之人的眼目”保留具体的眼目意象，并在现代汉语中清楚表达自高、傲慢的含义。
- source_word: תִּשְׁפַּלְנָה
  choice: 必低垂
  rationale: 该阴性复数未完成式与“眼目”一致。译作“必低垂”既呼应 שׁפל 的降低含义，也自然呈现骄傲眼目受挫的具体形象；“必”传达先知审判宣告的确定性。
theological_decisions:
- issue: אָדָם 与 אִישׁ 两个人称名词的诗歌平行
  choice: 人……世人
  alternative: 人……一个人；人类……各人
  rationale: 两词在此共同指向人类，却不是完全相同的词。译文以“人……世人”保留平行中的轻微变化，又不把后者误解为某个特定个体。
- issue: 先知诗歌中的时体关系
  choice: 前两句用承接结果的“便”，末句用确定性将来的“必”
  alternative: 全译为过去时；全译为将来时
  rationale: 前两个 wayyiqtol 可描绘审判带来的既定结果，也可作为先知性宣告表达必然发生之事；末句未完成式更明显地指向将临的结果。汉语措辞保留这种推进，而不强行规定严格的时间顺序。
- issue: “眼目降低”的意象
  choice: 保留“高傲之人的眼目必低垂”
  alternative: 高傲的人必受羞辱
  rationale: 原文以眼目具体表现人的自高。保留该意象可维持诗歌力度，并避免把身体意象完全抽象化为神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被压低／降卑／低垂”形成递进式平行，保留原文反复出现的降低意象；分号划分前两个人类总称分句与末尾眼目意象。
