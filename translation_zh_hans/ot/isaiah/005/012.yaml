id: ISA.5.12
reference: Isaiah 5:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֨ה כִנּ֜וֹר וָ/נֶ֗בֶל תֹּ֧ף וְ/חָלִ֛יל וָ/יַ֖יִן מִשְׁתֵּי/הֶ֑ם וְ/אֵ֨ת פֹּ֤עַל יְהוָה֙ לֹ֣א יַבִּ֔יטוּ וּ/מַעֲשֵׂ֥ה יָדָ֖י/ו לֹ֥א רָאֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/012.yaml
  text: There are lyre and harp[a], tambourine and flute, and wine at their feasts; but they do not look to the work of Yahweh[b], and they do not see the work of his hands.
translation:
  language: zh_hans
  text: 他们宴饮时，有琴、瑟[a]、手鼓、笛子和酒；他们却不留意雅威[b]的作为，也不察看他手所做的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琴、瑟”所译的两个希伯来词都指弦乐器，但其确切形制无法确定，也可分别理解为里拉琴和竖琴一类的乐器。
    reason: lexical_alternative
  - marker: b
    text: “雅威”音译希伯来文的神名יהוה（YHWH）；传统译本常译作“耶和华”或以“上主”代称。
    reason: divine_name
lexical_decisions:
- source_word: וְהָיָה
  choice: 有
  rationale: 这里的完成式用于铺陈宴饮场景；汉语用“有”自然引出后面的器乐和酒，并不强行限定为过去某一次事件。
- source_word: כִנּוֹר וָנֶבֶל
  choice: 琴、瑟
  rationale: 两词指彼此有别的弦乐器，但具体形制难以确定。“琴、瑟”在现代中文圣经语体中简洁、易懂，也保留两种乐器并列；脚注说明其大致类别。
- source_word: תֹּף
  choice: 手鼓
  rationale: 该词指手持的框鼓一类打击乐器。“手鼓”比“铃鼓”更少暗示其必定带有金属小钹。
- source_word: חָלִיל
  choice: 笛子
  rationale: 该词指管状吹奏乐器，可能是笛或管；“笛子”是普通读者易懂的近似称呼。
- source_word: יַיִן
  choice: 酒
  rationale: 此处指葡萄酒；中文在宴饮清单中用“酒”自然明确，无须弱化其含义。
- source_word: מִשְׁתֵּיהֶם
  choice: 他们宴饮时
  rationale: 该名词表示饮酒的宴席或宴饮。“宴饮时”既表达宴席场景，也保留其中饮酒的意味，并与清单中的“酒”呼应。
- source_word: פֹּעַל יְהוָה
  choice: 雅威的作为
  rationale: פֹּעַל可指工作、行动或作为；“作为”适合指神所行的事，同时避免把经文具体限定为创造、审判或护理中的某一种。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留希伯来文本中的专名，而不以称号替代。
- source_word: יַבִּיטוּ
  choice: 留意
  rationale: 此处不只是肉眼观看，而是把注意力转向并认真看待；“留意”在中文中准确表达这种有意识的关注。
- source_word: מַעֲשֵׂה יָדָיו
  choice: 他手所做的
  rationale: 保留希伯来语“手”的具体意象，并与前面的“作为”形成诗歌平行。
- source_word: רָאוּ
  choice: 察看
  rationale: 在平行句中表示看见、认识或关注。“察看”既保留视觉用语，又传达认真看待之意；不译成“看不见”，以免暗示他们没有能力看见。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用神的专名。音译为“雅威”可保留这一点，不把专名改作称号；脚注说明其性质，避免读者误以为这是另一个神名或普通称谓。
- issue: “雅威的作为”和“他手所做的”具体指什么
  choice: 保留概括而平行的表述
  alternative: 明确译为雅威的创造、审判或救赎行动
  rationale: 本节本身没有把这些作为限定为某一类神圣行动。保留原文的概括性，可让上下文承担解释功能，不在译文中提前消解其神学张力。
- issue: 他们“没有看”的性质
  choice: 不留意……也不察看
  alternative: 不能看见／不明白
  rationale: 原文谴责他们没有关注雅威的行动，并未明确说他们缺乏看见或理解的能力。因此采用带有主动忽视意味、但不过度解释其内在动机的措辞。
translation_notes:
  register: 采用现代、庄重而易懂的中文。前半句用“宴饮时”迅速建立场景，以紧凑清单呈现音乐和酒；后半句以“却”突出宴乐与忽视神作为之间的反差。“不留意……不察看”保留希伯来诗句的平行结构，同时避免把第二动词误解为生理上的失明。所有脚注标记均已置于正文对应位置。
