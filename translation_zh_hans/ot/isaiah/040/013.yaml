base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/013.yaml
  text: Who has measured the Spirit of Yahweh[b][a], or what man has made his counsel known to him?
translation:
  language: zh_hans
  text: 谁曾衡量耶和华的灵[a][b]？谁曾把自己的谋略告诉他呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译作“心意”。希伯来词可指灵、气息或内在意念；《七十士译本》以及《罗马书》11:34所反映的传统译作“心意”。
    reason: lexical_alternative
  - marker: b
    text: “衡量”也可理解为“指引”或“指导”。后半句也可按古希腊译本及《罗马书》11:34所反映的传统译作：“谁能作他的谋士，教导他呢？”
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 疑问代词引出修辞性问句；简洁的“谁”自然对应原文。
- source_word: תִכֵּן
  choice: 曾衡量
  rationale: תכן 的基本语义涉及测量、衡定；承接本章上文的度量意象，也保留具体隐喻。
- source_word: רוּחַ יְהוָה
  choice: 耶和华的灵
  rationale: רוּחַ 可指灵、气息或内在意念；与神名连用时译作“耶和华的灵”最直接，同时用脚注保留“心意”的可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的专名形式呈现四字神名，而不以称号替代。
- source_word: וְאִישׁ עֲצָתוֹ
  choice: 谁又能作他的谋士
  rationale: 原文结构可理解为“谁作为他的谋士”；עֵצָה 所属词形在此指提供谋议者。中文以“作他的谋士”自然表达这一关系。
- source_word: יוֹדִיעֶנּוּ
  choice: 教导他
  rationale: ידע 的使役式直译为“使他知道”；在谋士语境中自然表达为“教导他”，宾语后缀所指为耶和华。
theological_decisions:
- issue: רוּחַ יְהוָה 的所指
  choice: 耶和华的灵
  alternative: 耶和华的心意
  rationale: 正文保留希伯来语“灵”的直接表达，不把它单义化为“心意”；脚注说明语义范围及古希腊译本传统。
- issue: 前半句动词 תִכֵּן 的含义
  choice: 衡量
  alternative: 指引／指导
  rationale: “衡量”较贴近希伯来语动词的核心义和上下文度量意象；“指引”见于古代译本及后续引用传统，故列入脚注而不取代正文。
- issue: 后半句的句法关系
  choice: 谁又能作他的谋士，教导他呢
  alternative: 谁曾把他的谋略告诉他呢
  rationale: 将 אִישׁ עֲצָתוֹ 理解为“他的谋士”，与古希腊译本及罗马书11:34的引用一致，也形成清楚的修辞问句；另一种关系分析仍有可能，故在脚注交代。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“曾衡量”保留原文的具体度量隐喻；“作他的谋士，教导他”使希伯来语的修辞关系在中文中清楚自然。所有异读与语义张力均在脚注中保留。
