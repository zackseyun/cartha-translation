source:
  edition: WLC
  text: יָבֵ֤שׁ חָצִיר֙ נָ֣בֵֽל צִ֔יץ כִּ֛י ר֥וּחַ יְהוָ֖ה נָ֣שְׁבָה בּ֑/וֹ אָכֵ֥ן חָצִ֖יר הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/007.yaml
  text: The grass dries up[a], the flower withers, because the breath of Yahweh blows on it; surely the people are grass.
translation:
  language: zh_hans
  text: 草枯干，花凋谢，因为雅威的气息[a]吹过其上；百姓的确是草。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅威的风吹过其上”；译作“雅威的灵吹过其上”的可能性较小。
    reason: 保留רוּחַ可指“气息、风、灵”的词义歧义，并说明语境上的可能性差异。
lexical_decisions:
- source_word: יָבֵשׁ
  choice: 枯干
  rationale: 该动词表示变干、失去生机；“枯干”自然贴合草木意象，并与下句“凋谢”形成诗歌平行。
- source_word: חָצִיר
  choice: 草
  rationale: 在本段关于生命短暂的比喻中，常用义“草”最为清楚自然，也能贯穿上下文的核心意象。
- source_word: נָבֵל
  choice: 凋谢
  rationale: 该动词可指植物或花朵枯萎、衰残；“凋谢”与“花”搭配自然，并保留诗意。
- source_word: צִיץ
  choice: 花
  rationale: 在草木易逝的语境中，“花”简明易懂；“花朵”亦可，但略显赘余。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出草枯花谢的原因，“因为”明确表达因果关系。
- source_word: רוּחַ
  choice: 气息
  rationale: רוּחַ可指气息、风或灵。这里描写雅威吹气使草木枯萎，“气息”既保留神亲自施行行动的意象，也不排除风的联想；其他可能译法列入脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: נָשְׁבָה
  choice: 吹
  rationale: 该动词的基本含义是“吹”。汉语不必强行标明完成体，能自然表达诗句中的普遍性陈述。
- source_word: בּוֹ
  choice: 在其上
  rationale: 介词加代词后缀指向前述草木意象；“在其上”保留原文代词及气息临到草木的方向。
- source_word: אָכֵן
  choice: 的确
  rationale: 该语气词表示强调、确认或结论；“的确”自然传达这一断定语气。
- source_word: הָעָם
  choice: 百姓
  rationale: 原词是带定冠词的集合名词，可指特定群体或人民；“百姓”保留其集体性，也不擅自将范围扩大为全人类。
theological_decisions:
- issue: רוּחַ יְהוָה的多义性
  choice: 雅威的气息
  alternative: 雅威的风；雅威的灵
  rationale: רוּחַ本身可表示气息、风或灵。草木因吹拂而枯萎的直接图景支持“气息”或“风”；“灵”在词义上可能，但在此语境中较不可能。正文采用“气息”，并以脚注保留真实歧义。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非称号；音译“雅威”较直接地保留专名性质，避免在正文中以“主”替换。
translation_notes:
  register: 采用简洁、庄重而现代的普通话，保留原文两组平行结构及末句的强调语气。正文不添加原文没有的解释性对象；“在其上”维持代词指涉的凝练诗体。
