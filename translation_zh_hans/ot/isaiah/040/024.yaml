  text: אַ֣ף בַּל נִטָּ֗עוּ אַ֚ף בַּל זֹרָ֔עוּ אַ֛ף בַּל שֹׁרֵ֥שׁ בָּ/אָ֖רֶץ גִּזְעָ֑/ם וְ/גַם נָשַׁ֤ף בָּ/הֶם֙ וַ/יִּבָ֔שׁוּ וּ/סְעָרָ֖ה כַּ/קַּ֥שׁ תִּשָּׂאֵֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/024.yaml
  text: Scarcely are they planted[a], scarcely are they sown, scarcely has their stem taken root in the earth, when he merely blows on them and they wither[b], and a storm carries them away like stubble.
translation:
  language: zh_hans
  text: 他们刚被栽种[a]，刚被播下，他们的茎干刚在地里扎根；他向他们吹气，他们就枯干，暴风把他们像秸秆一样卷走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们甚至还没有被栽种，还没有被播下，他们的茎干甚至还没有在地里扎根……”原文三次重复强调否定，也突出他们才兴起便迅速败亡。
    reason: lexical_alternative
  - marker: b
    text: “暴风”也可译作“旋风”；“秸秆”也可译作“秸”或“残茬”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף בַּל
  choice: 刚……就
  rationale: 三次重复构成强烈的诗歌推进，强调他们尚未稳固便被除去。汉语用连续的“刚”并在后半句以“就”承接，较自然地表达“才刚／几乎还没有”的时间与修辞力量。
- source_word: נִטָּעוּ
  choice: 被栽上
  rationale: 保留נטע的被动意义及植物隐喻，指掌权者才被安置在位。
- source_word: זֹרָעוּ
  choice: 被种下
  rationale: 保留זרע的被动形式，并与“被栽上”形成农业意象的平行。
- source_word: שֹׁרֵשׁ
  choice: 扎根
  rationale: 此处表达茎干在土地中生根、站稳；“扎根”是自然且准确的现代汉语。
- source_word: גִּזְעָם
  choice: 他们的茎干
  rationale: גזע可指树干、残干或茎干。此处选“茎干”，既延续植物比喻，又不把形象限定为大树。
- source_word: נָשַׁף
  choice: 吹气
  rationale: 该动词可指吹或呼气。“向他们吹气”保留上帝轻易施行审判的具体形象，不另加原文没有的副词。
- source_word: וַיִּבָשׁוּ
  choice: 他们就枯干
  rationale: יבש意为干枯；“枯干”延续植物意象，并自然表达吹气后的结果。
- source_word: סְעָרָה
  choice: 暴风
  rationale: סְעָרָה可指猛烈风暴或旋风。“暴风”兼顾可读性与破坏力，同时以脚注保留“旋风”的可能。
- source_word: כַּקַּשׁ
  choice: 像碎秸一样
  rationale: קשׁ指收割后干燥、轻薄的秸秆或残茬，并非严格意义上的糠秕。“碎秸”能说明可被风卷走的干秸形象。
- source_word: תִּשָּׂאֵם
  choice: 把他们……卷走
  rationale: נשא在此表示带走、卷去；与“暴风”搭配时，“卷走”是自然的汉语表达，并保留被彻底带离的动势。
theological_decisions:
- issue: “向他们吹气”的单数主语所指
  choice: 用“他”承接上文所说施行审判的上帝
  alternative: 理解为无人格的风吹在他们身上
  rationale: 以赛亚书40:23—24的连续语境中，施动者是使统治者归于虚无的那一位。译作“他”保留原文的人格性神圣行动，同时不在本节擅自补出神名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“刚……就……”重现原文三重强调所带出的迅速转折；保留栽种、播种、扎根、枯干和碎秸等连贯农业意象。所有脚注标记均置于正文相应位置。
