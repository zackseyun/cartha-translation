base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/016.yaml
  text: Lebanon is not enough to burn[b][a], nor are its animals enough for a burnt offering.
translation:
  language: zh_hans
  text: 黎巴嫩的林木不足以供燃烧[a]；那里的动物也不足以作燔祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“黎巴嫩不足以供燃烧”。这里很可能以黎巴嫩代指其著名的森林；意思是，即使其中所有林木也不够作燃火之用。
    reason: cultural_note
  - marker: b
    text: 或译“那里的走兽”。原文指属黎巴嫩的动物；此处以夸张的祭祀意象说明，即使这些动物也不足以作燔祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָנוֹן
  choice: 黎巴嫩的木柴
  rationale: 希伯来文直称“黎巴嫩”，在此借该地著名的森林指可供燃烧的木材。中文若仅说“黎巴嫩不足以燃火”略显晦涩，因此在正文补出语境隐含的“木柴”，并以脚注说明原文形式。
- source_word: אֵין דֵּי
  choice: 不足以
  rationale: 准确表达“不够、不足”的数量含义，并使前后两个分句保持整齐。
- source_word: בָּעֵר
  choice: 燃火
  rationale: 该词在这里指燃烧、供火使用；结合祭献语境译为“燃火”自然明确。
- source_word: וְחַיָּתוֹ
  choice: 其中的走兽
  rationale: חַיָּה 可泛指动物，也常指野兽；后缀指黎巴嫩。译作“其中的走兽”既保留地域归属，也不把范围限定得过窄，脚注列出较宽泛的译法。
- source_word: עוֹלָה
  choice: 燔祭
  rationale: 这是希伯来祭祀制度中全牲焚烧之祭的常用术语；“燔祭”为现代中文圣经语境中简洁而明确的对应词。
theological_decisions:
- issue: 祭祀意象所表达的含义
  choice: 保留夸张性的比较：即使黎巴嫩全部的木材和走兽，也不足以献上与上帝威荣相称的燔祭。
  alternative: 概括为一切人类敬拜资源都不足够。
  rationale: 上下文强调上帝无可比拟的伟大；正文保留具体的木柴、走兽和燔祭意象，不将其扩展成经文本身未明说的系统性教义命题。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“燔祭”保留必要的圣经祭祀术语；句式以两个“不足以”对应希伯来文的平行结构。
