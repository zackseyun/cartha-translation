  to: 你们要向上举目观看：是谁创造了这些？是那位按数目领出这些万象、逐一按名呼唤它们的。[a] 因他大有能力，力量强盛，一个也不缺少。[b]
  rationale: 修订仅处理汉语表达及句法衔接：“这些万象”自然传达原文天军作为有序集合的含义，并与“这些”相呼应；完整的“是那位……的”结构保留了原文以行动辨认创造者的修辞。保留“一个也不缺少”，不把分配性的 אִישׁ 误译为专指男性或人类。
