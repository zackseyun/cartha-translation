  text: שְׂאוּ מָר֨וֹם עֵינֵי/כֶ֤ם וּ/רְאוּ֙ מִי בָרָ֣א אֵ֔לֶּה הַ/מּוֹצִ֥יא בְ/מִסְפָּ֖ר צְבָאָ֑/ם לְ/כֻלָּ/ם֙ בְּ/שֵׁ֣ם יִקְרָ֔א מֵ/רֹ֤ב אוֹנִים֙ וְ/אַמִּ֣יץ כֹּ֔חַ אִ֖ישׁ לֹ֥א נֶעְדָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/026.yaml
  text: 'Lift up your eyes on high and see: who created these? He who brings out their host by number[a], calling all of them by name. Because of the greatness of his might and the strength of his power[c][b], not one is missing.'
translation:
  language: zh_hans
  text: 你们要向上举目观看：是谁创造了这些？是那位按数目领出这些万象、逐一按名呼唤它们的。[a] 因他大有能力，力量强盛，一个也不缺少。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万象”在此指天上排列有序的众多天体，很可能主要是众星。
    reason: cultural_note
  - marker: b
    text: 原文直译可作“没有一个缺席”；其中“一个”是逐一分配性的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ מָרוֹם עֵינֵיכֶם
  choice: 你们要举目望向高处
  rationale: 保留复数命令、举目动作和向上方观看的空间含义；“举目望向高处”庄重而符合现代汉语。
- source_word: וּרְאוּ מִי בָרָא אֵלֶּה
  choice: 看看：是谁创造了这些？
  rationale: 以自然的汉语引出反问，并保留“这些”这一指示语，不在正文中直接改成“众星”，以免缩窄原文所保留的指涉空间。
- source_word: הַמּוֹצִיא בְמִסְפָּר צְבָאָם
  choice: 就是那按数目领出它们队伍的
  rationale: 分词结构以“就是那……的”承接前面的“是谁”，保留识别创造者的修辞结构；“按数目”体现有秩序的点数，“队伍”保留 צבא 的集合及编列意象，又不把它误解为人间军队。
- source_word: לְכֻלָּם בְּשֵׁם יִקְרָא
  choice: 他一一按名呼唤它们
  rationale: לְכֻלָּם 表示全体无一遗漏；汉语“一一”自然传达逐个之意，“按名呼唤”保留神对每一成员的认识与权柄。
- source_word: מֵרֹב אוֹנִים וְאַמִּיץ כֹּחַ
  choice: 因他能力浩大，力量强盛
  rationale: 将介词 מִן 按语境译为原因；用两个相近而不完全相同的力量词保持原文的加强和平行表达。
- source_word: אִישׁ לֹא נֶעְדָּר
  choice: 一个也不缺少
  rationale: אִישׁ 在此是逐一分配性的用法，并非特指男性；译为“一个也不缺少”准确对应天上队伍的成员，且符合现代汉语。
theological_decisions:
- issue: “这些”和“它们队伍”的所指
  choice: 正文保留“这些”和“它们队伍”，由上下文指向天上的众多天体
  alternative: 在正文中明确译作“众星”或“天上的万象”
  rationale: 举目向高处、按数领出并逐一呼名，都强烈指向天体，尤其是众星；但原文没有直接使用“星”一词，因此正文不将其明说，以保留原文修辞及可能稍广的指涉。
- issue: אִישׁ 的分配性含义
  choice: 一个也不缺少
  alternative: 没有一人缺席
  rationale: 这里的阳性单数形式逐一指向天上队伍的成员，并不涉及人的性别；采用不带人物误导的汉语表达。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。句首命令保持先知性劝告的力度；“就是那……的”保留希伯来语分词结构与前面反问的衔接。避免直接增补“神”或“众星”，使原文的主语识别和指涉范围不被提前解释。
