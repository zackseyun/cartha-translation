  text: הִנֵּ֨ה אֲדֹנָ֤/י יְהוִה֙ בְּ/חָזָ֣ק יָב֔וֹא וּ/זְרֹע֖/וֹ מֹ֣שְׁלָה ל֑/וֹ הִנֵּ֤ה שְׂכָר/וֹ֙ אִתּ֔/וֹ וּ/פְעֻלָּת֖/וֹ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/010.yaml
  text: Behold[a], the Lord GOD comes with strength, and his arm rules for him; behold, his reward is with him[d][c][b], and his recompense before him.
translation:
  language: zh_hans
  text: 看哪，主雅威大有能力而来；他的膀臂为他施行统治。看哪，他的赏赐与他同在；他的报偿在他面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赏赐”也可译作“工价”；“报偿”也可译作“酬劳”或“工作的成果”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注目、郑重指示的语气，并在两处重复，以呈现原文的修辞强调。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי（主）与圣名 יהוה（耶和华），同时符合现代中文圣经语体。
- source_word: בְּחָזָק יָבוֹא
  choice: 大有能力而来
  rationale: 将 בְּחָזָק 理解为来临的方式，保留 יָבוֹא 的生动宣告感；中文无需强加明确的未来时态。
- source_word: וּזְרֹעוֹ
  choice: 他的膀臂
  rationale: 保留原文以膀臂象征施展力量的具体意象，而不抽象化为“能力”。
- source_word: מֹשְׁלָה לוֹ
  choice: 为他掌权
  rationale: 分词表达持续或当前的统治作用；“为他”保留 לוֹ 所表达的归属或为其效力之意，不把潜在歧义完全消解。
- source_word: שְׂכָרוֹ
  choice: 他的赏赐
  rationale: 该词可指工价或奖赏；此处选“赏赐”，既适合先知语境，也与后句构成诗意平行。
- source_word: אִתּוֹ
  choice: 与他同在
  rationale: 直接表达伴随关系，并保持庄重自然的中文。
- source_word: וּפְעֻלָּתוֹ
  choice: 他的报偿
  rationale: 该词本可指工作、成果或工作的报酬；在 שְׂכָרוֹ 的平行结构中，“报偿”最能体现所得或所付的酬报含义。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 保留原文空间性表达及王者来临的图景，不扩释为“由他带来”等解释。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: 原文同时含“主”与四字神名。译作“主耶和华”可在中文传统可识别性与原文两个成分之间取得平衡，并避免把神名直接替换成普通称谓“上帝”。
- issue: “赏赐／报偿”的归属与对象
  choice: 保留“他的赏赐……他的报偿”的字面归属
  alternative: 明确解释为他要赐给人的奖赏或他所得的报酬
  rationale: 原文代词明确归属于他，但在本节本身并未明说接受赏赐或报偿的对象；正文不替上下文预先消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”略带提升感，但在此能自然保留 הִנֵּה 的郑重强调。“膀臂”保留圣经诗歌的力量意象；整体尽量维持两行平行结构。
