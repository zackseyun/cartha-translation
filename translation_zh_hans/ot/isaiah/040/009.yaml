  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַ֣ל הַר גָּבֹ֤הַ עֲלִי לָ/ךְ֙ מְבַשֶּׂ֣רֶת צִיּ֔וֹן הָרִ֤ימִי בַ/כֹּ֨חַ֙ קוֹלֵ֔/ךְ מְבַשֶּׂ֖רֶת יְרוּשָׁלִָ֑ם הָרִ֨ימִי֙ אַל תִּירָ֔אִי אִמְרִי֙ לְ/עָרֵ֣י יְהוּדָ֔ה הִנֵּ֖ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/009.yaml
  text: Go up on a high mountain[a], bearer of good news to Zion; lift up your voice with strength, bearer of good news to Jerusalem; lift it up, do not fear; say to the cities of Judah[b], “Behold your God!”
translation:
  language: zh_hans
  text: 登上高山吧，给锡安报好消息的使者[a]！大力扬声吧，给耶路撒冷报好消息的使者[b]！扬声，不要惧怕！要对犹大的城邑说：“看哪，你们的上帝！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“锡安啊，你这报好消息的，登上高山吧！”希伯来文也可把“锡安”理解为受呼唤、负责传报好消息的城。
    reason: alternative_reading
  - marker: b
    text: 或译：“耶路撒冷啊，你这报好消息的，要大力扬声！”“报好消息的”在希伯来文中是阴性单数形式，既可指一位使者，也可与拟人化的城相呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלִי
  choice: 登上
  rationale: 这是动词עלה的阴性单数祈使式；“登上”自然地保留了向高处移动的方向含义。
- source_word: הַר גָּבֹהַ
  choice: 高山
  rationale: 指适合公开宣告的高处；现代汉语无需以冠词区分特指或泛指，因此译作“高山”，不强行判定。
- source_word: מְבַשֶּׂרֶת
  choice: 报好消息的使者
  rationale: 该词是阴性单数分词，表示传报佳音者。“报好消息的使者”保留其行动者含义；希伯来文究竟把锡安、耶路撒冷视为使者，还是把它们视为消息传达的对象，另以脚注说明。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的地名音译，不作解释性改写。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文通行的地名音译。
- source_word: הָרִימִי
  choice: 扬声
  rationale: 原义为“举起”，与“声音”连用时，现代汉语自然表达为“扬声”；第二次重复也保留，以体现强调。
- source_word: בַכֹּחַ
  choice: 大力
  rationale: 保留כוח所表达的力量和强度，同时符合汉语修饰“扬声”的习惯。
- source_word: קוֹלֵךְ
  choice: 声
  rationale: 在公开宣告的语境中指人的声音；与“扬”组成自然且庄重的“扬声”。
- source_word: אַל תִּירָאִי
  choice: 不要惧怕
  rationale: 直接保留禁止式的语气；“惧怕”简洁庄重，也为现代读者所理解。
- source_word: אִמְרִי
  choice: 要……说
  rationale: 忠实表达אמר的祈使含义，并借“要”在汉语中明确命令语气。
- source_word: לְעָרֵי יְהוּדָה
  choice: 对犹大的城邑
  rationale: 保留介词所表达的言说对象及地域名称；“城邑”适合先知性宣告的庄重语体。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是唤起注意并指示人观看的词；“看哪”既保留突出的宣告作用，也符合中文圣经的庄重语域。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 保留第二人称复数所属后缀；此处使用אֱלֹהִים而非神名יהוה，因此译为“上帝”，不译作“耶和华”或“主”。
theological_decisions:
- issue: 阴性分词מְבַשֶּׂרֶת与“锡安／耶路撒冷”的句法关系
  choice: 正文将其理解为向锡安和耶路撒冷报好消息的使者。
  alternative: 也可把锡安和耶路撒冷当作被直接呼唤、并亲自传报好消息的城，即“锡安啊，你这报好消息的……耶路撒冷啊，你这报好消息的……”。
  rationale: 希伯来文容许两种句法理解，且现代汉语无法在不增添关系词的情况下自然保留全部歧义。因此正文采用一种通顺读法，脚注明确保存另一种重要读法，不借翻译排除其神学与修辞张力。
- issue: אֱלֹהִים的译法
  choice: 上帝
  alternative: 神；不可在此直接译作“耶和华”或“主”。
  rationale: 本节是带第二人称复数后缀的普通神称，所指为犹大诸城的上帝；原文此处没有出现יהוה，因此不引入神名。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“报好消息”比“传佳音”更直接透明，“城邑”和“看哪”则适度保留先知文本的崇高语感。正文保留连续祈使句和“扬声”的重复，以传达原文急切、有力的公开宣告。
