  text: וְ/יִֽעֲפ֥וּ נְעָרִ֖ים וְ/יִגָ֑עוּ וּ/בַחוּרִ֖ים כָּשׁ֥וֹל יִכָּשֵֽׁלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/030.yaml
  text: Even young men grow faint and become weary[a], and young men surely stumble.
translation:
  language: zh_hans
  text: 就是少年人也要疲乏困倦，青年人[a]也必跌倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “青年人”原文指正值青春盛期、体力旺盛的年轻男子；也可译作“强壮的青年人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִעֲפוּ
  choice: 也会疲乏
  rationale: 该词表示变得疲乏、精疲力竭；“会疲乏”自然地表达未完成体在此处所陈述的一般可能性。
- source_word: נְעָרִים
  choice: 少年人
  rationale: 指年轻人或少年；译作“少年人”，并与下句 בַחוּרִים 所指处于体力盛期的青年作出适度区分。
- source_word: וְיִגָעוּ
  choice: 困倦
  rationale: יגע 表示劳累、疲倦；与“疲乏”并列，保留诗句的同义推进。
- source_word: וּבַחוּרִים
  choice: 壮年人
  rationale: בַחוּרִים 指青春盛期、体力旺盛的年轻男子；“壮年人”在现代汉语中突出其强健状态，并避免误译为“被拣选的人”。
- source_word: כָּשׁוֹל יִכָּשֵׁלוּ
  choice: 也必跌倒
  rationale: 不定式绝对形与限定动词连用加强语气；“必跌倒”简洁传达这种强调，而不把动作过度解释为彻底败亡。
theological_decisions:
- issue: 经文所强调的人群范围
  choice: 将两组词都理解为年轻而有体力的人，第二组更突出强健盛期
  alternative: 把 בַחוּרִים 译为“被拣选的少年人”
  rationale: 上下文以最有体力者仍会衰弱，反衬耶和华赐力；该名词在此通常指年轻男子，而非神学意义上的蒙拣选者。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“少年人／壮年人”保留两个希伯来名词之间的区别；“疲乏困倦”形成自然并列，“必”体现原文加强结构。
