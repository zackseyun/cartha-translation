  text: יָבֵ֥שׁ חָצִ֖יר נָ֣בֵֽל צִ֑יץ וּ/דְבַר אֱלֹהֵ֖י/נוּ יָק֥וּם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/008.yaml
  text: The grass withers[a], the flower fades, but the word of our God will stand forever.
translation:
  language: zh_hans
  text: 草必枯干，花必凋谢；但我们的上帝的话必永远立定。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立定”也可译作“长存”或“永远有效”；希伯来语原词的基本意象是“站立”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: 枯干
  rationale: 该动词表示变干、枯萎；“枯干”自然地描绘草因失去水分而衰败，并与下一分句的动词有所区别。
- source_word: חָצִיר
  choice: 草
  rationale: 在此诗歌语境中指一般草木，“草”是现代汉语中最自然、清楚的表达。
- source_word: נָבֵל
  choice: 凋谢
  rationale: 该动词可表示枯萎、衰残；用于花时，“凋谢”自然准确，也保留与“枯干”的相关而不相同。
- source_word: צִיץ
  choice: 花
  rationale: 在草的平行意象中指花朵；“花”通俗、自然且范围适当。
- source_word: וּדְבַר
  choice: 但……的话
  rationale: ו本义常为“和”，但此处上下句构成明显转折；用“但”在汉语中清楚传达受造物短暂与上帝之言长存的对比。
- source_word: אֱלֹהֵינוּ
  choice: 我们上帝的
  rationale: 带第一人称复数后缀的אֱלֹהִים在以色列语境中指独一的上帝，译作“我们的上帝”。
- source_word: יָקוּם
  choice: 立定
  rationale: קום字面涉及起来、站立；此处表示持续成立、稳固不移。“立定”保留站立的具体意象，也表达其恒久有效。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 该惯用语在此表达无尽的持续，“永远”是现代汉语最自然的对应词。
theological_decisions:
- issue: 短暂无常的草花与上帝之言之间的转折关系
  choice: 正文用“但”
  alternative: 用形式上更直接的“和”或“而”
  rationale: 希伯来语连接词可直译为“和”，但诗歌平行结构明确表达对比。“但”使现代读者自然把握原文已有的转折，而不增加额外教义。
- issue: דָּבָר的语义范围
  choice: 译作“话”
  alternative: 译作“应许”或“信息”
  rationale: 原词范围较广。“话”保留其开放性，不把上帝所说的内容限缩为应许或某一种信息。
- issue: יָקוּם所表达的恒久性
  choice: 译作“立定”
  alternative: 译作“长存”或“永远有效”
  rationale: “立定”既保留原文“站立”的比喻，又可表达上帝的话稳固、持续成立；避免仅以抽象解释取代原文意象。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。前两分句以“枯干／凋谢”区分两个相关但不同的希伯来语动词；后半句用“立定”保留原文的具体意象。脚注标记置于完整经文末尾，补充关键词的译法而不打断诗歌节奏。
