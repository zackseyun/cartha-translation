base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/014.yaml
  text: Whom did he consult[a], and who gave him understanding? Who taught him the path of justice, taught him knowledge[b], and made known to him the way of understanding?
translation:
  language: zh_hans
  text: 他曾向谁请教，谁使他明白？谁教导他公正之道[a]，教给他知识，又使他知道明辨之道[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公正之道”也可译作“判断之道”。
    reason: lexical_alternative
  - marker: b
    text: “明辨之道”也可译作“洞察之道”或“理解之路”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי נוֹעָץ
  choice: 他曾向谁请教
  rationale: אֶת מִי 在此引出 נוֹעָץ 所涉及的对象；נֹועָץ 是 יעץ 的尼法勒式，表示寻求意见、请教。“向谁请教”符合现代汉语，也突出了上下文中上主不依赖任何谋士。
- source_word: וַיְבִינֵהוּ
  choice: 谁使他明白
  rationale: בין 的使役式表达“使……明白”。保留使役关系，不将其弱化为一般的“告诉”或“指导”。
- source_word: וַיְלַמְּדֵהוּ
  choice: 教导他／传授他
  rationale: למד 在这里表示教导。原文连续两次使用同一动词；汉语分别译作“教导”和“传授”，避免生硬重复，同时保留两次教学行为。
- source_word: בְּאֹרַח מִשְׁפָּט
  choice: 行公正之路
  rationale: אֹרַח 是道路、路径；מִשְׁפָּט 可指公正、审判或判断。“行公正之路”自然表达按公正行事的道路；“判断之道”作为真实可行的词义另见脚注。
- source_word: דַעַת
  choice: 知识
  rationale: דַעַת 直指知识。译作“知识”可与本节中 בין 和 תְּבוּנוֹת 所表达的明白、明辨区分开来。
- source_word: וְדֶרֶךְ תְּבוּנוֹת
  choice: 明辨之道
  rationale: דֶרֶךְ 与前面的 אֹרַח 平行，意为道路；תְּבוּנוֹת 是与理解、洞察、辨别有关的复数抽象形式。“明辨之道”既简洁自然，也保留了辨识和洞察的意味。
- source_word: יוֹדִיעֶנּוּ
  choice: 指示给他
  rationale: ידע 的使役式意为使人知道、使人认识。“指示给他”在此与“道”自然搭配，并保留使其知晓的含义。
theological_decisions:
- issue: 第三人称代词所指
  choice: 保留“他”，由上下文指向上主
  alternative: 直接补明为“上主”或“神”
  rationale: 本节没有重复神名，但以赛亚书40:13–14的上下文清楚是在反问谁曾指导上主。保留希伯来文的代词，不在正文中补入原文没有的神名。
- issue: מִשְׁפָּט 的含义
  choice: 公正
  alternative: 判断／审判
  rationale: 此处描写无人能教导上主正确、公正的行事之道。“公正”在现代汉语中清楚自然，但原词也可表示判断或审判，因此在脚注中保留另一译法。
- issue: 反问所表达的神学张力
  choice: 保持连续反问，不直接改写为“没有人”
  alternative: 释义为“没有人曾教导他”
  rationale: 上下文确实预期否定答案，强调上主的智慧独立无匹；但正文保留原文的反问形式，使其修辞力度和含蓄结论不被提前解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以三个连续分句保留希伯来诗句的反问和递进；用“公正之路”与“明辨之道”呈现道路意象及平行结构。所有脚注标记均置于对应词组之后。
