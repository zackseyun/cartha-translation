  text: וְ/נִגְלָ֖ה כְּב֣וֹד יְהוָ֑ה וְ/רָא֤וּ כָל בָּשָׂר֙ יַחְדָּ֔ו כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/005.yaml
  text: And the glory of Yahweh will be revealed[a], and all flesh together will see, for the mouth of Yahweh has spoken.
translation:
  language: zh_hans
  text: 耶和华的荣耀必显露出来；凡有血气的[a]都必一同看见，因为耶和华已经亲口说了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“全人类”；希伯来文直译“所有血肉（肉身）”。
    reason: 说明“凡有血气的”所译希伯来惯用语的字面意象及其通常指向全人类的含义。
lexical_decisions:
- source_word: וְנִגְלָה
  choice: 必显露出来
  rationale: נִגְלָה是גלה的尼法勒形态，表达被揭示、显现之意；“必显露出来”既保留其被动/显现色彩，也传达先知话语中的确定性。
- source_word: כְּבוֹד יְהוָה
  choice: 耶和华的荣耀
  rationale: כָּבוֹד表示荣耀、尊荣及分量；按原文所属结构译为“耶和华的荣耀”，庄重而自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行的专名“耶和华”对应四字神名，保留其作为名字而非称号的性质。
- source_word: וְרָאוּ
  choice: 都必……看见
  rationale: 此处在先知语境中具有将来且确定的意味；“必看见”简洁直接。原文没有明说宾语，译文也不补入“它”或“这荣耀”。
- source_word: כָל בָּשָׂר
  choice: 凡有血肉的
  rationale: בָּשָׂר本义为“肉身、血肉”，此惯用语普遍指人类；保留具体的受造者意象，同时用脚注说明其含义。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 表达共同、同时的范围；“一同”在现代中文中自然，并保留群体性的强调。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出上述应许可靠的根据；“因为”清楚呈现原文的因果关系。
- source_word: פִּי יְהוָה
  choice: 耶和华……亲口
  rationale: “亲口”是现代中文表达“耶和华的口”这一具体强调方式的自然说法，保留话语出于耶和华本人的重点。
- source_word: דִּבֵּר
  choice: 已经……说了
  rationale: 完成式把宣告表述为已经成立，因此确定可靠；“已经说了”保留这一完成意味。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 耶和华
  alternative: 上主；雅威
  rationale: 原文使用神的专名而非一般称号；采用现代简体中文读者最熟悉的专名形式，避免以称号取代名字。
- issue: כָל בָּשָׂר应保留字面意象还是直接解释
  choice: 正文作“凡有血肉的”，脚注说明“全人类”
  alternative: 全人类；所有人
  rationale: 正文保留希伯来文“血肉”的受造性和有限性意象，脚注则使其普遍指向清楚可懂。
- issue: 是否补明“看见”的宾语
  choice: 不补宾语
  alternative: 看见这荣耀；看见它
  rationale: 希伯来文只说“看见”，虽可从上文自然理解所见与耶和华的荣耀有关，却没有明说宾语；不补写可保留原文的简洁与语法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“显露出来”比单说“出现”更贴近尼法勒语态；“亲口说了”避免生硬的“耶和华的口说了”，同时保留原文的具体强调。脚注标记置于其实际解释的短语之后。
