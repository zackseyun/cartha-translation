base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/022.yaml
  text: He is the one who sits above the circle of the earth[a], and its inhabitants are like grasshoppers[b]; who stretches out the heavens like a curtain and spreads them out like a tent to dwell in.
translation:
  language: zh_hans
  text: 他坐在大地的圆圈之上[a]；地上的居民好像蚱蜢。他把诸天展开，如同薄纱[b]；又将它们张开，如同可供居住的帐篷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地的穹窿”或“大地的地平线”。希伯来语可表示圆形的范围或穹窿般的边界。
    reason: lexical_alternative
  - marker: b
    text: 或译“薄幕”或“帷幔”。这里的希伯来语指薄而细的东西。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשֵׁב
  choice: 他就是那位坐……的
  rationale: 将实词化分词译为持续状态的描述，中文自然，又不增添原动词未明说的“坐王位”含义。
- source_word: עַל חוּג הָאָרֶץ
  choice: 在大地圆圈之上
  rationale: חוּג直译为“圆圈”，可兼容圆形边界、穹窿或地平线等意象；“之上”表达上方与超越，不暗示接触。
- source_word: וְיֹשְׁבֶיהָ
  choice: 地上的居民
  rationale: 自然表达带第三人称阴性单数后缀的居住者，所指为大地上的人。
- source_word: כַּחֲגָבִים
  choice: 好像蚱蜢
  rationale: חָגָב可指蚱蜢或蝗虫；“蚱蜢”在此更自然地突出人在上帝面前的微小。
- source_word: הַנּוֹטֶה
  choice: 他铺展
  rationale: 延续对上帝的分词描述；“铺展”符合展开天空的诗歌意象。
- source_word: כַדֹּק
  choice: 犹如薄纱
  rationale: דֹק指薄而细的东西；“薄纱”简洁保留轻薄、易于展开的比喻，同时不把具体材质绝对化。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 保留原文广阔的宇宙性和庄重诗体，比“天空”范围更宽。
- source_word: וַיִּמְתָּחֵם
  choice: 又将诸天张开
  rationale: 动词表示拉伸、展开；“张开”避免与前句机械重复，并保留帐棚意象。
- source_word: כָּאֹהֶל לָשָׁבֶת
  choice: 好像供居住的帐棚
  rationale: 保留帐棚比喻，并以“供居住”表达不定式的目的或用途，而不擅自指定居住者。
theological_decisions:
- issue: חוּג הָאָרֶץ的宇宙图景
  choice: 大地圆圈
  alternative: 大地的穹窿；大地的地平线
  rationale: 经文以诗歌图像颂扬上帝的超越和创造权能。“圆圈”最直接保留希伯来语意象，不将其改写成现代科学命题，也不武断限定某一种古代宇宙模型。
- issue: לָשָׁבֶת的居住主体
  choice: 供居住
  alternative: 供人居住；让他居住
  rationale: 希伯来语不定式未明说居住者；采用无明确主体的表达，保留原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“他就是那位”凸显连续的上帝描述；以“诸天”保持宏阔语域。分号承接前后两个并列画面。脚注[b]置于“薄纱”之后，以对应דֹק，而不误置于“蚱蜢”之后。
