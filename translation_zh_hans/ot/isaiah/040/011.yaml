  yaml_path: translation/ot/isaiah/040/011.yaml
  text: Like a shepherd he will pasture his flock[a]; with his arm he will gather the lambs, and in his bosom he will carry them[c][b]; he will gently lead the nursing ewes.
translation:
  language: zh_hans
  text: 他要像牧人牧养自己的羊群；用臂膀聚集羊羔，将它们抱在怀中；温柔地引导正在哺乳的母羊[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“带着幼崽的母羊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֹעֶה
  choice: 像牧人一样
  rationale: 前缀כ表示比较；此译自然保留明喻，并承接上下文中耶和华的牧养形象。
- source_word: עֶדְרוֹ יִרְעֶה
  choice: 牧养自己的羊群
  rationale: עֵדֶר在牧羊语境中指羊群；רעה表示放牧、照料。用“牧养”既简洁，又保留牧人照管和喂养羊群的具体意象。
- source_word: בִּזְרֹעוֹ
  choice: 用臂膀
  rationale: 介词ב在此表示凭借或工具；“用臂膀”保留以力量聚拢羊羔的身体意象。
- source_word: יְקַבֵּץ טְלָאִים
  choice: 聚集羊羔
  rationale: קבץ意为聚拢、集合，טְלָאִים指羊羔；直译在现代汉语中清楚自然。
- source_word: וּבְחֵיקוֹ יִשָּׂא
  choice: 把它们抱在怀中
  rationale: חֵיק指胸怀、怀抱，נשא指举起、携带；“抱在怀中”自然传达贴近胸前携带的温柔画面，代词所指为前面的羊羔。
- source_word: עָלוֹת
  choice: 乳养幼崽的母羊
  rationale: 该词指正在哺乳或带着幼崽的母畜；在本节牧羊语境中明确为母羊。“乳养幼崽”保留哺乳含义，也顾及“带幼崽的母羊”这一词义范围。
- source_word: יְנַהֵל
  choice: 温柔地引导
  rationale: נהל表示引领、带领；对象是哺乳或带幼崽的母羊，语境呈现体贴谨慎的引领。“温柔地”使隐含于情境的方式在汉语中自然显明，但不改变基本动作。
theological_decisions:
- issue: 神作为牧人的意象
  choice: 直接保留牧人与羊群的比喻，不在译文中加入后来的弥赛亚或基督论解释
  alternative: 在措辞中明确指向弥赛亚式的应验
  rationale: 本节在其直接语境中描绘耶和华兼具力量与温柔的照管。译文应保留旧约文本自身的牧人意象，让后续神学关联由读者和释经处理。
- issue: עָלוֹת所指对象的状态
  choice: 译为“乳养幼崽的母羊”
  alternative: 译为“带幼崽的母羊”
  rationale: 原词可涉及哺乳或带着幼崽的母畜。正文采用较具体的哺乳义，同时用脚注保留较宽的另一译法，避免消除词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“牧养”属于当代汉语中可理解且富有经文语体色彩的词；“用臂膀”“抱在怀中”分别保留力量与亲密照料的对照。句式按希伯来诗行的动作次序展开，并使用分号与逗号保持节奏。
