source:
  edition: WLC
  text: דַּבְּר֞וּ עַל לֵ֤ב יְרֽוּשָׁלִַ֨ם֙ וְ/קִרְא֣וּ אֵלֶ֔י/הָ כִּ֤י מָֽלְאָה֙ צְבָאָ֔/הּ כִּ֥י נִרְצָ֖ה עֲוֺנָ֑/הּ כִּ֤י לָקְחָה֙ מִ/יַּ֣ד יְהוָ֔ה כִּפְלַ֖יִם בְּ/כָל חַטֹּאתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/002.yaml
  text: Speak to the heart of Jerusalem[a], and call out to her that her hard service is completed, that her iniquity is pardoned[c][b], that she has received from the hand of Yahweh double for all her sins.
translation:
  language: zh_hans
  text: 要对耶路撒冷说安慰的话，向她宣告：她服苦役的期限已满[a]，她的罪孽已蒙赦免[b]；她因自己一切的罪，已经从雅威手中受了双倍[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服苦役的期限”也可译作“争战的日子已经结束”或“服役期已满”。
    reason: lexical_alternative
  - marker: b
    text: “罪孽已蒙赦免”也可理解为“她的罪责已获悦纳”，或“她罪孽的刑罚已得接纳／满足”。
    reason: lexical_alternative
  - marker: c
    text: “双倍”可能是表示足量、满额的说法，不一定指精确的两倍；在上下文中常被理解为她已从雅威手中领受的审判。
    reason: cultural_note
lexical_decisions:
- source_word: דַּבְּרוּ עַל־לֵב
  choice: 说安慰的话
  rationale: 该习语指向人心说劝慰、鼓舞的话；此译自然传达安慰语气，又不把“心”这一希伯来语意象生硬直译进现代汉语。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代汉语通行地名。
- source_word: וְקִרְאוּ אֵלֶיהָ
  choice: 向她宣告
  rationale: קרא אֶל 可指向某人呼喊或宣告；上下文是先知性的信息发布，“宣告”较为贴切。
- source_word: מָלְאָה צְבָאָהּ
  choice: 她服苦役的期限已满
  rationale: צָבָא 可指战争、服役或规定的劳役期；此译保留期限届满和艰苦服役两层意思，不局限为实际战争。
- source_word: נִרְצָה עֲוֺנָהּ
  choice: 她的罪孽已蒙赦免
  rationale: רצה 的尼法勒式具有被接纳、获得悦纳之意；与 עָוֹן 连用并处于复兴宣告中，结果可自然表达为罪孽蒙赦免，同时以脚注保留刑罚已获接纳或满足的可能。
- source_word: לָקְחָה מִיַּד יְהוָה
  choice: 已经从雅威手中受了
  rationale: לקח 在此表示领受；“从……手中”保留原文将所受之事直接归于雅威的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，区别于作为称号的“主”。
- source_word: כִּפְלַיִם
  choice: 双倍
  rationale: 保留该词“二倍、双重”的直接意义，不在正文中断定它是精确算术比例还是表示足量的习语。
- source_word: בְּכָל חַטֹּאתֶיהָ
  choice: 因自己一切的罪
  rationale: 此处 חַטֹּאות 指罪，而非赎罪祭；介词 בְּ 表达所受刑罚与罪之间的缘由或对应关系。
theological_decisions:
- issue: 耶路撒冷从雅威手中所受“双倍”的含义
  choice: 正文保留“双倍”，并依上下文明确所受的是惩罚，但不把双倍解释成精确数学比例。
  alternative: 可理解为与她一切罪相应的足量、满额惩罚；也有人理解为严格的两倍惩罚。
  rationale: 上下文先说服役期满、罪孽获赦，表明她已经历审判；“双倍”可能是足量的习语，正文和脚注共同保留其张力。
- issue: נִרְצָה עֲוֺנָהּ 的神学语力
  choice: 译为“罪孽已蒙赦免”，突出复兴宣告所带来的结果。
  alternative: 可译为“她罪孽的刑罚已被接纳／已经偿清”，或“她的罪责已获接纳”。
  rationale: 希伯来语并非普通的“赦免”动词，而有被悦纳、被认为满意之意；因此正文采用自然结果表达，脚注保留其法理和祭仪色彩。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“她”延续耶路撒冷的人格化形象；“服苦役的期限已满”兼顾 צָבָא 的服役与期限语义；正文保留“雅威”“双倍”等源文鲜明措辞，并用脚注呈现真实的词义歧义。
