revisions:
- from: 你难道不知道吗？你难道没有听过吗？耶和华是永恒的上帝，是创造大地四极的主。他不疲乏，也不困倦；他的智慧无法测度。
  to: 你难道不知道吗？你难道没有听过吗？雅威是永恒的上帝，是创造大地四极的造物主。他不疲乏，也不困倦；他的智慧无法测度。
  rationale: 删去原文未出现的“主”，将创造者称号直接译为“造物主”。同时将神名调整为与 Yahweh 对应的“雅威”，并以脚注保留中文传统译名“耶和华”。其余措辞保留原译的平行节奏和庄重现代语体。
