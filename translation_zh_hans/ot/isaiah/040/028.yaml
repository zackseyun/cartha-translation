  text: הֲ/ל֨וֹא יָדַ֜עְתָּ אִם לֹ֣א שָׁמַ֗עְתָּ אֱלֹהֵ֨י עוֹלָ֤ם יְהוָה֙ בּוֹרֵא֙ קְצ֣וֹת הָ/אָ֔רֶץ לֹ֥א יִיעַ֖ף וְ/לֹ֣א יִיגָ֑ע אֵ֥ין חֵ֖קֶר לִ/תְבוּנָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/028.yaml
  text: Have you not known? Have you not heard? Yahweh is the everlasting God[a], the Creator of the ends of the earth. He does not grow faint or become weary; his understanding is unsearchable.
translation:
  language: zh_hans
  text: 你难道不知道吗？你难道没有听过吗？雅威是永恒的上帝，是创造大地四极的造物主。他不疲乏，也不困倦；他的智慧无法测度。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא יָדַעְתָּ
  choice: 你难道不知道吗
  rationale: 反问句预期肯定回答，带有提醒和责问意味；“难道……吗”在现代汉语中自然保留这一语气。
- source_word: אִם לֹא שָׁמַעְתָּ
  choice: 你难道没有听过吗
  rationale: 这里与前句构成平行反问，并非条件句；“听过”指早已听闻这项真理。
- source_word: אֱלֹהֵי עוֹלָם
  choice: 永恒的上帝
  rationale: 该结构直译为“永恒之上帝”；此译自然表达上帝恒久、超越时间的属性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的形式音译四字神名，不用称号替代原文中的专名。
- source_word: בּוֹרֵא קְצוֹת הָאָרֶץ
  choice: 创造大地四极的主
  rationale: 分词在此标明耶和华的身份；“大地四极”保留原文“大地尽头”的空间意象，同时自然表达全地最远之处。
- source_word: לֹא יִיעַף וְלֹא יִיגָע
  choice: 他不疲乏，也不困倦
  rationale: 以两个相近而有区别的现代汉语词呈现原文平行动词，强调上帝绝不会因劳作而衰弱或疲惫。
- source_word: אֵין חֵקֶר לִתְבוּנָתוֹ
  choice: 他的智慧无法测度
  rationale: 原文直意为“他的理解无从探究”；“智慧无法测度”自然保留人不能穷究其洞察力的含义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名。正文采用中文圣经传统中最为普通读者熟悉的“耶和华”，而不是用“主”取代；“雅威”是按学界常见拟音的另一译法。
- issue: אֱלֹהֵי עוֹלָם 所表达的时间含义
  choice: 永恒的上帝
  alternative: 亘古的上帝
  rationale: “永恒”既可表达无尽久远，也不把语义局限于只从古时存在；保留 עוֹלָם 在此处的宽广时间含义。
- issue: 上帝的 תְבוּנָה 是否可被穷究
  choice: 智慧无法测度
  alternative: 他的理解无人能查究
  rationale: 原文否定的是对上帝洞察力的穷尽探究，并非断言人对上帝完全不能有任何认识；“无法测度”保留这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。两个开头的反问保持平行；后半句以对称节奏呈现上帝永不疲倦与智慧不可穷究。正文不设脚注，因为关键异译已可在译注资料中说明，且正文没有需要脚注标记才能避免误解之处。
