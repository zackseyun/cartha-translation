    rationale: בּוֹרֵא的意思是“创造者／造物主”，原文在此没有אָדוֹן一类“主”的称号。应直接译出创造者身份，避免增添称谓。
  - severity: low
    issue: 神名译法与英文审校轨迹未对齐
    rationale: 英文审校明确采用 Yahweh。中文正文采用“雅威”可直接对应该专名；“耶和华”作为传统译名宜以脚注交代。
  revised_text: 你难道不知道吗？你难道没有听过吗？雅威是永恒的上帝，是创造大地四极的造物主。他不疲乏，也不困倦；他的智慧无法测度。
  revised_footnotes:
  - marker: a
    text: “雅威”：希伯来文为 YHWH（四字神名）；中文传统译作“耶和华”。
    reason: alternative_reading
