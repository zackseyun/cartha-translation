base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/023.yaml
  text: who brings princes to nothing[b][a], and makes the judges of the earth like emptiness.
translation:
  language: zh_hans
  text: 他使权贵归于无有，也使地上的审判官如同虚空[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空”也可译作“混沌”、“虚无”或“荒芜”；希伯来语 תֹהוּ 可表示空虚、荒废或没有实质。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: 他使……归于
  rationale: 该分词承接上文对上帝的描述，与לְאָיִן连用时，以“使……归于”自然表达使之沦为某种状态的含义。
- source_word: רוֹזְנִים
  choice: 权贵
  rationale: 该词指地位显赫的统治者、达官或贵族；“权贵”既保留政治权势与尊荣色彩，也符合现代汉语。
- source_word: לְאָיִן
  choice: 归于无有
  rationale: אָיִן表示不存在或虚无；“归于无有”准确传达上帝使世间权贵失去实质与影响的强烈意味。
- source_word: שֹׁפְטֵי אֶרֶץ
  choice: 地上的审判官
  rationale: 构造短语可指“地／全地的审判者”；本章语境具有普世范围，因此用“地上的”，同时“审判官”保留שֹׁפְטֵי的司法、治理意味。
- source_word: כַּתֹּהוּ
  choice: 如同虚空
  rationale: תֹהוּ可指空虚、荒芜、混沌或无实质；“虚空”在本处自然表达地上审判官在上帝面前毫无实质，却不把词义限定为创世记1章的“无形”。
- source_word: עָשָׂה
  choice: 使
  rationale: 虽为完成式，该动词在诗歌平行句中描述上帝一贯而典型的作为；汉语用“使”可自然承接前一分句。
theological_decisions:
- issue: אֶרֶץ在שֹׁפְטֵי אֶרֶץ中的范围
  choice: 地上（普世意义）
  alternative: 那地／国中的
  rationale: 以赛亚书40章上下文强调上帝对万民和全地的主权，“地上”保留普世范围，同时没有过度具体化为某一地区。
- issue: תֹהוּ所表达的状态
  choice: 虚空
  alternative: 混沌／虚无／荒芜
  rationale: 此处重点是世上掌权者在上帝面前变得空洞、无实质；译作“虚空”保留语义张力，不将其专门解释为创造前的混沌状态。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“权贵”比“王子”更贴近רוֹזְנִים所指的高级统治者或显贵；两句以“使……也使……”保持希伯来诗歌的平行结构。
