base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/015.yaml
  text: Look[a], the nations are like a drop from a bucket, and are regarded as dust on the scales; look[b], the coastlands he lifts like fine dust.
translation:
  language: zh_hans
  text: 看哪，列国好像从桶中滴下的一滴水[a]，也被看作天平上的微尘；看哪，他举起沿海诸地[b]，如举起细尘一般。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“像桶里的一滴水”。希伯来文较直译为“从桶中（来的）一滴”。
    reason: lexical_alternative
  - marker: b
    text: 或译“众海岛”。这里的希伯来词可指岛屿、沿海地区或遥远的海洋地带。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意的指示、感叹词；“看哪”既保留两次出现所形成的修辞强调，也符合庄重而易懂的现代汉语。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 泛指世上各国；“列国”简洁地保留先知书语境中的整体性和庄重语体。
- source_word: כְּמַר מִדְּלִי
  choice: 像从桶中滴下的一滴水
  rationale: מַר 指一滴，מִן 表明来源，即“从桶中”；译作“滴下的一滴水”使汉语意象自然，同时保留源出于桶的关系。
- source_word: וּכְשַׁחַק מֹאזְנַיִם
  choice: 又如天平上的微尘
  rationale: שַׁחַק 在此指细微尘土，מֹאזְנַיִם 指天平；“微尘”传达其重量微不足道的形象。
- source_word: נֶחְשָׁבוּ
  choice: （由“就像……又如……”表达）被算为、被视为
  rationale: 该被动词表示衡量或看待。汉语用比拟句直接表达这种估量，避免生硬地重复“被看作”，但仍保留列国在衡量中微不足道的含义。
- source_word: אִיִּים
  choice: 沿海诸地
  rationale: 该词可指岛屿、海岸地带或遥远的海洋地区；以“沿海诸地”为正文可涵盖以赛亚书中常见的较广地理意义，并在脚注保留“海岛”这一可能译法。
- source_word: כַּדַּק
  choice: 如同细尘
  rationale: דַּק 表示细小、纤薄之物；结合上下文的微尘和衡量意象，译作“细尘”最为贴切。
- source_word: יִטּוֹל
  choice: 他提起
  rationale: 该动词可表示提起、拿起或承载；“提起”保留动作本身及其轻而易举的意味。第三人称阳性单数的主语由上下文指向神。
theological_decisions:
- issue: יִטּוֹל 的隐含主语
  choice: 译作“他”，由上下文指向神，不在本节补出神的名号
  alternative: 译作“有人提起”，或明确译作“耶和华提起”
  rationale: 希伯来文动词为第三人称阳性单数，但本分句没有明说主语。上下文清楚谈论神；用“他”既使现代汉语完整，又不把原文未明说的神名加入本节。
- issue: נֶחְשָׁבוּ 的被动估量语气
  choice: 在汉语比拟结构中含蓄表达“被视为微不足道”
  alternative: 直译为“被看作天平上的微尘”
  rationale: 原文强调列国在神面前的分量，并不必然要求补出执行估量者。当前译法保存这种神学张力，同时使句子自然流畅。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留先知诗歌的呼告力度；全句维持两个平行比喻，并以“微尘／细尘”再现原文关于极小分量的意象。
