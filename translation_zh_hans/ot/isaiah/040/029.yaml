source:
  edition: WLC
  text: נֹתֵ֥ן לַ/יָּעֵ֖ף כֹּ֑חַ וּ/לְ/אֵ֥ין אוֹנִ֖ים עָצְמָ֥ה יַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/029.yaml
  text: He gives strength to the weary[a], and to the one without vigor he increases might.
translation:
  language: zh_hans
  text: 他赐力量给疲乏的人，又使无力的人大有能力。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹתֵן
  choice: 赐
  rationale: 此处Qal主动分词在上下文中表达上帝一贯的作为；“赐”自然、庄重，也适合上帝把力量给予人的语境。
- source_word: לַיָּעֵף
  choice: 给疲乏的人
  rationale: 该词指疲惫、困乏的人。“疲乏的人”是现代汉语中自然且准确的表达，并与后半句“无力的人”形成平行。
- source_word: כֹּחַ
  choice: 力量
  rationale: 在此指人所缺乏并蒙赐予的体力或能力；“力量”比抽象的“权能”更切合语境。
- source_word: וּלְאֵין אוֹנִים
  choice: 又使无力的人
  rationale: אֵין表示缺乏，אוֹנִים指精力、能力或力气；“无力的人”简洁地保留了完全缺乏力量的含义。介词结构与后面的使役动词合译为自然汉语。
- source_word: עָצְמָה
  choice: 能力
  rationale: 该名词表示力量、强力。译作“能力”既与前面的“力量”有所区分，也保留诗句的近义平行。
- source_word: יַרְבֶּה
  choice: 使……大有
  rationale: Hiphil使役形表示使之增多、加添。“使……大有能力”在汉语中自然地表达使能力增多的含义，没有弱化其使役性。
theological_decisions:
- issue: 本节省略的主语
  choice: 译出“他”，指承接上文的耶和华
  alternative: 不显明主语，译为“赐力量给……”
  rationale: 希伯来文此节未明说主语，但上下文明显继续描述耶和华的作为。现代汉语需要补出主语；使用“他”既清楚又不加入原文以外的神学解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“他赐……又使……”保留两分句的诗体平行；不添加脚注，因为本节主要词义差异可由正文中的近义表达充分承载，且英文脚注所列替代说法实质上对应后半句，并非必须在中文正文外另作说明。
