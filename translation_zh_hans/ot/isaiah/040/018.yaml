  text: וְ/אֶל מִ֖י תְּדַמְּי֣וּ/ן אֵ֑ל וּ/מַה דְּמ֖וּת תַּ֥עַרְכוּ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/018.yaml
  text: To whom[a], then, will you liken God, and what likeness will you compare to him?
translation:
  language: zh_hans
  text: 那么，你们要把上帝比作谁呢？要拿什么形像与他相比？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要把上帝比作谁？要把什么样式摆在他旁边呢？”
    reason: 保留וְ作简单连接词，以及ערך“摆放、排列”和דמות“样式”的较直译可能。
lexical_decisions:
- source_word: וְ/אֶל מִי
  choice: 那么……谁呢
  rationale: אֶל מִי标明比较的对象；וְ在此承接上文的论述，现代汉语用“那么”自然地表达其推论和转折推进作用。
- source_word: תְּדַמְּיוּן
  choice: 要把……比作
  rationale: דמה在此指把一方比作另一方；“把上帝比作谁”保留比较方向，也符合汉语反问句习惯。
- source_word: אֵל
  choice: 上帝
  rationale: 本段语境所指是以色列的上帝，与偶像形成对照，并非泛指某一个神明。
- source_word: וּ/מַה
  choice: 要拿什么
  rationale: 原文连接两个平行问句；汉语第二问省去生硬的“并且”，仍清楚保留并列关系。
- source_word: דְּמוּת
  choice: 形像
  rationale: דמות可指形状、样式或相似之物；“形像”在造像语境中既表达可见形式，也保留“相似物”的含义。
- source_word: תַּעַרְכוּ
  choice: 相比
  rationale: ערך本义可为排列、摆放；与דמות及ל连用时，是把某种形像摆在上帝旁边作比较。“相比”清楚表达语境中的比较功能。
- source_word: לֽוֹ
  choice: 与他
  rationale: ל在此表示某形像同上帝之间的比较关系，现代汉语自然表达为“与他”。
theological_decisions:
- issue: 反偶像语境中אֵל的所指
  choice: 上帝
  alternative: 神；一个神明
  rationale: 上下文强调独一真神无可比拟。“上帝”明确表达特指，同时没有增添“全能者”等原文没有的称号。
- issue: 第二问是单纯比较还是把形像陈列在上帝旁边
  choice: 要拿什么形像与他相比
  alternative: 要把什么形像摆在他旁边
  rationale: ערך容许“摆放、排列”的具体意象，也可在此表达“拿来相比”。正文采用自然的比较说法，脚注保留更贴近其空间意象的译法，避免消除词义张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。“形像”沿用宗教与造像语境中较明确的写法，以区别于一般的“形象”；以“那么”衔接上文关于上帝伟大无比的论述。
