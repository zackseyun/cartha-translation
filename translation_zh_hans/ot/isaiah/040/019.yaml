  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/פֶּ֨סֶל֙ נָסַ֣ךְ חָרָ֔שׁ וְ/צֹרֵ֖ף בַּ/זָּהָ֣ב יְרַקְּעֶ֑/נּוּ וּ/רְתֻק֥וֹת כֶּ֖סֶף צוֹרֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/019.yaml
  text: As for the idol, a craftsman casts it, and a goldsmith overlays it with gold and forges silver chains for it.
translation:
  language: zh_hans
  text: 偶像呢，匠人把它铸造出来，金匠给它包上金子，又为它锻造银链。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפֶּסֶל
  choice: 偶像
  rationale: 该词本义为雕刻或制作的像；在本段讽刺人手制造敬拜对象的语境中，译作“偶像”自然且准确。句首用“呢”体现希伯来语名词前置所带出的论题转换。
- source_word: נָסַךְ
  choice: 铸造出来
  rationale: 此处描述匠人以熔融金属制作像，译作“铸造”符合工艺语境；加“出来”使现代汉语表达完整自然。
- source_word: חָרָשׁ
  choice: 匠人
  rationale: 泛指制作偶像的工匠，不将其过度限定为某一种专门手艺。
- source_word: וְצֹרֵף
  choice: 金匠
  rationale: צֹרֵף 指从事金属熔炼、加工的人；后接“金子”，用“金匠”最贴合上下文。
- source_word: בַּזָּהָב יְרַקְּעֶנּוּ
  choice: 给它包上金子
  rationale: רקע 表示捶打、延展金属；在此指用打成薄片的金覆盖偶像。“包上金子”清楚传达成品动作，同时避免误解为纯金铸像。
- source_word: וּרְתֻקוֹת כֶּסֶף צוֹרֵף
  choice: 又为它锻造银链
  rationale: רְתֻקוֹת 是链条；末词 צוֹרֵף 在此按分词作工艺动作理解，译作“锻造”比“提炼”更符合制作银链的语境。
theological_decisions:
- issue: 经文对偶像制作的讽刺意味
  choice: 直陈偶像由匠人铸造、包金并配上银链，不额外解释其虚妄
  alternative: 加入“不过是”或“竟由人手”等显明贬义措辞
  rationale: 贬抑和讽刺已由上下文及制作过程本身表达；不增添原文没有的评价词，以保留先知话语的含蓄力度。
- issue: 银链的用途
  choice: 仅译“为它锻造银链”
  alternative: 明确译作固定偶像、装饰偶像或悬挂偶像的链子
  rationale: 原文没有说明链条的具体用途，应保留这一歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“偶像呢”承接上下文并凸显论题；“铸造出来—包上金子—锻造银链”保留原文依次描写人工制作的节奏。
