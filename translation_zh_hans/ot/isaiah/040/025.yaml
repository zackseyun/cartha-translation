  text: וְ/אֶל מִ֥י תְדַמְּי֖וּ/נִי וְ/אֶשְׁוֶ֑ה יֹאמַ֖ר קָדֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/025.yaml
  text: To whom then will you compare me[a], that I should be equal? says the Holy One.
translation:
  language: zh_hans
  text: “你们要把我比作谁，使我与谁相等呢？[a]”圣者说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要把我比拟为谁，使我与谁相同呢？”
    reason: 词汇替代：דמה可译为“比拟为”，שוה可按语境译为“相同”；比较对象由前面的“谁”补足。
lexical_decisions:
- source_word: וְאֶל מִי
  choice: 你们要……谁
  rationale: אֶל引出比较的对象；句首的וְ承接上文，在现代汉语中无须机械译作“而”。疑问词מִי在介词结构中译作“谁”。
- source_word: תְדַמְּיוּנִי
  choice: 把我比作
  rationale: דמה的强意词干表示“使……相似、把……比作”；“把我比作谁”既贴近原文，也符合现代汉语表达。
- source_word: וְאֶשְׁוֶה
  choice: 叫我与他相等
  rationale: שוה表示相同、相等。这里的וְ可表达比较所导致的结果；“他”承接前面的“谁”，没有指定任何具体对象。
- source_word: יֹאמַר
  choice: 说
  rationale: 先知话语中的未完成式用于引出正在宣告的直接引语，汉语用现在性的“说”自然简洁。
- source_word: קָדוֹשׁ
  choice: 圣者
  rationale: 原文单独使用“圣者”作为上帝的称号，并未出现“以色列的”，因此不扩充为“以色列的圣者”。
theological_decisions:
- issue: 上帝的独一无可比拟
  choice: 保留反问形式和“圣者”这一简短称号
  alternative: 意译为“谁能与我相比？”或扩写为“以色列的圣者”
  rationale: 原文借上帝亲口提出的反问强调其无可比拟；保留原有称号和比较结构，可避免加入经文没有明说的限定或后来的神学表述。
- issue: וְאֶשְׁוֶה中未明说的比较对象
  choice: 译作“与他相等”
  alternative: 译作“成为相等的”或重复为“与谁相等”
  rationale: 希伯来文的比较对象可由前面的מִי自然补足；汉语需要明确关系对象，“他”仅回指不定的“谁”，不把它解释为某个特定存在。
translation_notes:
  register: 采用现代、庄重而易懂的直接引语。“圣者”保留神圣称号的凝练感；问句保持原文的修辞力度。
