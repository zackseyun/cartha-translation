  text: הֲ/ל֤וֹא תֵֽדְעוּ֙ הֲ/ל֣וֹא תִשְׁמָ֔עוּ הֲ/ל֛וֹא הֻגַּ֥ד מֵ/רֹ֖אשׁ לָ/כֶ֑ם הֲ/לוֹא֙ הֲבִ֣ינֹתֶ֔ם מוֹסְד֖וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/021.yaml
  text: Do you not know? Do you not hear? Has it not been told to you from the beginning? Have you not understood from the foundations of the earth?[a]
translation:
  language: zh_hans
  text: 你们岂不知道吗？岂不听见吗？这事岂不是从起初就告诉你们了吗？从大地立基之初，你们岂不明白吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们岂不明白大地的根基吗？”
    reason: 原文末句也可把“大地的根基”理解为“明白”的宾语。
lexical_decisions:
- source_word: הֲלוֹא
  choice: 岂不／岂没有／岂不是
  rationale: 重复的否定疑问形式构成期待肯定回答的反问；按各分句的汉语句法略作变化，同时保留反复追问的力度。
- source_word: תֵדְעוּ
  choice: 知道
  rationale: 此处表示知道、知晓；“知道”直接自然，并与后文的听见、告诉、明白相呼应。
- source_word: תִשְׁמָעוּ
  choice: 听见
  rationale: 采用“听见”保留感知含义，不额外加入“听从”或专心聆听的意味。
- source_word: הֻגַּד
  choice: 告诉
  rationale: נגד 的被动式表示信息已传达给听众；用“这事……告诉你们”符合现代汉语表达。
- source_word: מֵרֹאשׁ
  choice: 从起初
  rationale: 表示从最早的时候或开端；“从起初”简洁而庄重，并保留时间意义。
- source_word: הֲבִינֹתֶם
  choice: 明白
  rationale: 此处表示理解、领悟；“明白”适合本节连续的认知性反问。
- source_word: מוֹסְדוֹת
  choice: 奠基
  rationale: 该词可指根基，也可在此结构中表达大地被奠基的起始时刻；正文采用时间／来源理解，以自然汉语译作“自大地奠基以来”。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 上下文论及创造和宇宙秩序，指全地而非特定地域；“大地”在现代汉语中自然且具有庄重感。
theological_decisions:
- issue: 末句“מוֹסְדוֹת הָאָרֶץ”与动词“明白”的句法关系
  choice: 自大地奠基以来，你们岂不明白吗？
  alternative: 你们岂不明白大地的根基吗？
  rationale: 希伯来语在“大地的根基”前没有明示介词，因此既可将其理解为“明白”的宾语，也可理解为与前句“从起初”平行的时间／来源表达。正文采用后者，但以脚注保留可行的宾语读法，不消除原文的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。四个反问保留原文重复推进的修辞力度；为避免正文中“从大地的根基”产生生硬或空间性误解，将时间／来源读法自然表达为“自大地奠基以来”。
