reference: Isaiah 40:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל הַ/גּוֹיִ֖ם כְּ/אַ֣יִן נֶגְדּ֑/וֹ מֵ/אֶ֥פֶס וָ/תֹ֖הוּ נֶחְשְׁבוּ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/017.yaml
  text: All the nations are as nothing before him[a]; they are regarded by him as less than nothing and emptiness.
translation:
  language: zh_hans
  text: 列国在他面前都如同虚无；在他看来，它们比无有和虚空[a]还不如。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空”所译的希伯来语也可表示“荒芜”或“混沌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  choice: 列国
  rationale: כָּל表示整体总括，הַגּוֹיִם指各国、万邦；“列国”简洁自然，也保留其集合意义。
- source_word: כְּאַיִן
  choice: 如同虚无
  rationale: 前缀כְּ־表示比较，אַיִן意为“无、虚无”；“如同虚无”保留明示的比拟关系。
- source_word: נֶגְדּוֹ
  choice: 在他面前
  rationale: נֶגֶד既可表示处于某人面前，也可在语境中带有相对于他的评价意味；此译保留这两层可能。
- source_word: מֵאֶפֶס
  choice: 比无有……还不如
  rationale: 将מִן理解为比较用法，אֶפֶס表示无有、全无；结合句末动词，用“比……还不如”表达递进的贬抑语气。
- source_word: וָתֹהוּ
  choice: 和虚空
  rationale: תֹהוּ可指虚空、荒芜或混沌；这里与אֶפֶס并列，重点是毫无分量和实质，因此正文采用“虚空”，并以脚注保留其他词义。
- source_word: נֶחְשְׁבוּ לוֹ
  choice: 在他看来，它们……还不如
  rationale: נֶחְשְׁבוּ是חשב的尼法勒式，表示“被看作、被算为”；לוֹ指出这是在他的判断或估量中。汉语以“在他看来”自然表达这一关系。
theological_decisions:
- issue: 下半句否定程度及其修辞力度
  choice: 译作“比无有和虚空还不如”
  alternative: 译作“被他算为无有和混沌”或“算作虚无和空虚”
  rationale: מֵאֶפֶס中的מִן可作比较理解；上下两句层层加强，强调列国与上帝相比全无分量。此译保留修辞夸张，却不把它扩展为有关列国本体不存在的形而上主张。
- issue: תֹהוּ是否明确译为创造语境中的“混沌”
  choice: 正文译“虚空”，脚注注明“荒芜”或“混沌”
  alternative: 正文直接译“混沌”
  rationale: 本节语境着重上帝与列国不可相比，并未要求读者联想到创世图景；保留脚注可避免抹去该词真实的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“列国”符合先知文学语域；“在他看来”自然呈现希伯来语的估量关系。下半句保留原文“无有／虚空”两个近义词叠加所形成的强调。
