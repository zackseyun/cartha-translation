  yaml_path: translation/ot/isaiah/040/001.yaml
  text: Comfort[a], comfort my people[b], says your God.
translation:
  language: zh_hans
  text: “安慰，安慰我的百姓！”你们的上帝说。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说”原文也可译作“将要说”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲמוּ
  choice: 安慰
  rationale: 该词是נחם的皮埃勒词干复数祈使式，在此直接命令听众安慰百姓。“安慰”自然、庄重，也能保留命令的力度。
- source_word: נַחֲמוּ נַחֲמוּ
  choice: 安慰，安慰
  rationale: 保留原文的重复，以传达强调、迫切和庄严的修辞效果，不另加原文没有的宾语。
- source_word: עַמִּי
  choice: 我的百姓
  rationale: עַם在这里指与上帝有归属关系的群体；“我的百姓”既保留所有格，也传达圣约关系的意味。
- source_word: יֹאמַר
  choice: 说
  rationale: 形态上是未完成式，可直译为“将要说”；但在先知话语的引述公式中可表达当前、持续或宣告性的言说。正文采用汉语自然的“说”，并以脚注保留形态上的未来可能。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: אֱלֹהִים虽具有复数形式，在此指以色列的独一上帝；第二人称复数后缀译为“你们的”。
theological_decisions:
- issue: 说话者身份与圣约语气
  choice: 译作“你们的上帝说”，表明命令源自上帝，同时保留“我的百姓／你们的上帝”的关系性措辞。
  alternative: 译作“你们的上帝将要说”，突出未完成式的未来意味。
  rationale: 原文没有说明复数命令所针对的具体听众，因此不补入先知、使者或其他中介身份；同时保留上帝与百姓之间亲密而带有圣约意味的称谓。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吧”使复数祈使句在中文中自然，同时不削弱重复命令的郑重语气；引号清楚标示上帝命令的内容。
