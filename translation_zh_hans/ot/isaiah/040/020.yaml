base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/020.yaml
  text: He who is too poor for an offering chooses wood that will not rot[c][b][a]; he seeks out for himself a skilled craftsman to prepare an idol that will not totter.
translation:
  language: zh_hans
  text: 献不起供物的人[a]，挑选不会朽坏的木头；他为自己寻找一位技艺精湛的工匠[c]，来制作一尊不会摇动的偶像[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“贫困的人挑选不会朽坏的木头作为供物。”希伯来语开头十分凝练，可以有略微不同的句法理解。
    reason: alternative_reading
  - marker: b
    text: “偶像”也可译作“雕刻的像”。
    reason: lexical_alternative
  - marker: c
    text: 也可按不同语序理解为：“他寻找一位技艺精湛的工匠，让他为自己制作……”。
    reason: syntactic_alternative
lexical_decisions:
- source_word: הַמְסֻכָּן תְּרוּמָה
  choice: 献不起供物的人
  rationale: 希伯来语开头高度凝练；此译按语境理解为因贫困而无力献上贵重供物的人，同时用脚注保留另一种句法理解。
- source_word: עֵץ לֹא יִרְקַב
  choice: 不会朽坏的木头
  rationale: 保留原文具体的木材腐朽意象，也体现制作者刻意选择耐久材料的讽刺意味。
- source_word: חָרָשׁ חָכָם
  choice: 技艺精湛的工匠
  rationale: חָכָם在此指工艺娴熟，而非道德或属灵意义上的智慧。
- source_word: יְבַקֶּשׁ לוֹ
  choice: 他为自己寻找
  rationale: 既表达主动寻求，也保留לוֹ所表示的为自己办理、取得之意。
- source_word: לְהָכִין
  choice: 制成
  rationale: 该动词有预备、使稳固或做成之意；在工匠与雕像的语境中，‘制成’自然且不过度展开具体工序。
- source_word: פֶּסֶל
  choice: 偶像
  rationale: 该词指雕刻而成的像；本段明确讽刺人手制造的敬拜对象，‘偶像’能传达其语境功能，脚注保留较形式对应的译法。
- source_word: לֹא יִמּוֹט
  choice: 不会摇动
  rationale: 保留动词‘动摇、晃动’的基本意义，以及人设法使所造之像站稳的反讽。
theological_decisions:
- issue: 反偶像语境中פֶּסֶל的译法
  choice: 偶像
  alternative: 雕像
  rationale: ‘偶像’在此有充分的词义与上下文依据，能清楚表达先知所批判的是被当作神明敬奉的人造之像；脚注同时避免抹去该词‘雕刻之像’的具体含义。
- issue: 希伯来语开头的句法关系
  choice: 献不起供物的人
  alternative: 贫困的人挑选不会朽坏的木头作为供物
  rationale: 主译采取较通行的理解，即此人贫穷到献不起贵重供物；但原文措辞紧凑，תְּרוּמָה与前后成分的关系并非毫无歧义，因此在脚注中保留另一种可能。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“朽坏”“技艺精湛”“摇动”便于普通读者理解，也保留原文以耐久木材和稳固偶像反衬偶像无能的讽刺。
