revisions:
- from: 献不起供物的人[a]，挑选不会朽坏的木头；他为自己寻找一位技艺精湛的工匠[c]，制成一尊不会摇动的偶像[b]。
  to: 献不起供物的人[a]，挑选不会朽坏的木头；他为自己寻找一位技艺精湛的工匠[c]，来制作一尊不会摇动的偶像[b]。
  rationale: 修订仅消除汉语中“制成”的施事者歧义，使工匠明确成为制作偶像的人；同时调整相关脚注，使其译文自然并更准确反映可保留的句法关系。其余用词忠实、自然，无须改动。
