source:
  edition: WLC
  text: וְ/קוֹיֵ֤ יְהוָה֙ יַחֲלִ֣יפוּ כֹ֔חַ יַעֲל֥וּ אֵ֖בֶר כַּ/נְּשָׁרִ֑ים יָר֨וּצוּ֙ וְ/לֹ֣א יִיגָ֔עוּ יֵלְכ֖וּ וְ/לֹ֥א יִיעָֽפוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/031.yaml
  text: But those who wait for Yahweh will renew their strength[a]; they will rise up with wings like eagles; they will run and not grow weary[b]; they will walk and not faint.
translation:
  language: zh_hans
  text: 但等候雅威的人必重新得力[a]；他们必如鹰展翅上腾[b]；他们奔跑也不疲倦，行走也不困乏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候”也可译作“仰望”。希伯来语这个词含有怀着期待和盼望而等候的意思。
    reason: lexical_alternative
  - marker: b
    text: “鹰”：希伯来语 נשר 泛指某类大型猛禽，也可能包括秃鹫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/קוֹיֵ יְהוָה
  choice: 但等候雅威的人
  rationale: קוה 的分词形式表示带着期待而等候；“等候”保留具体的时间性和期待性。וְ 在这里承接上文年轻人也会疲倦跌倒的对比，译作“但”。יהוה 按其专名音译为“雅威”。
- source_word: יַחֲלִיפוּ כֹחַ
  choice: 必重新得力
  rationale: חלף 的使役形与“力量”连用，可表达力量得到更新或替换；“重新得力”在现代汉语中自然，也保留恢复活力的含义。
- source_word: יַעֲלוּ אֵבֶר
  choice: 必……展翅上腾
  rationale: עלה 表示上升，אֵבֶר 指翅膀或翼羽。“展翅上腾”自然地呈现凭翼升起的诗歌意象，又不过度解释其方式。
- source_word: כַּנְּשָׁרִים
  choice: 如鹰
  rationale: נשר 指大型猛禽，在圣经诗歌的腾飞意象中通常译为“鹰”；其也可能泛指包括秃鹫在内的大型猛禽，故以脚注保留词义范围。
- source_word: יָרוּצוּ וְלֹא יִיגָעוּ
  choice: 奔跑也不疲倦
  rationale: רוץ 是“奔跑”；יגע 表示因劳作或用力而疲倦。“也不”自然表达希伯来语并列中的否定结果。
- source_word: יֵלְכוּ וְלֹא יִיעָפוּ
  choice: 行走也不困乏
  rationale: הלך 表示行走或前行；יעף 表示疲乏、衰弱。“困乏”与前句“疲倦”形成自然的平行，同时保留两个近义动词的区别。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名 יהוה；译作“雅威”以保留其作为以色列之神专名的性质，而不以“主”这一称号替代。
- issue: קוה 在应许语境中的含义
  choice: 等候雅威
  alternative: 仰望雅威
  rationale: 该词兼有等候与怀着期待盼望的意味。“等候”保留其具体动作和时间维度，而脚注说明其中的盼望意味，避免只取其一。
- issue: יַחֲלִיפוּ כֹחַ 的语义张力
  choice: 必重新得力
  alternative: 必获得新的力量
  rationale: חלף 可表达更新、替换或改变。“重新得力”符合上下文，并不明确断定力量是被替换、恢复，还是重新赐予。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“但”呈现与上文的对比；保留“奔跑—行走”和“疲倦—困乏”的诗歌平行。两个脚注标记均置于相关正文之后。
