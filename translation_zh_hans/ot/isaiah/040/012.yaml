  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִֽי מָדַ֨ד בְּ/שָׁעֳל֜/וֹ מַ֗יִם וְ/שָׁמַ֨יִם֙ בַּ/זֶּ֣רֶת תִּכֵּ֔ן וְ/כָ֥ל בַּ/שָּׁלִ֖שׁ עֲפַ֣ר הָ/אָ֑רֶץ וְ/שָׁקַ֤ל בַּ/פֶּ֨לֶס֙ הָרִ֔ים וּ/גְבָע֖וֹת בְּ/מֹאזְנָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/012.yaml
  text: Who has measured the waters in the hollow of his hand[a], and marked off the heavens with a span, and measured the dust of the earth in a measure[c][b], and weighed the mountains in scales and the hills in balances?
translation:
  language: zh_hans
  text: 谁曾用手心量过诸水，用一掌之距[a]量定诸天，用量器[b]量过大地的尘土，又用秤称过群山，用天平称过冈陵呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一掌之距”是古代长度单位，指张开手时从拇指尖到小指尖的距离。
    reason: 说明 זֶרֶת 所指的手量单位，并避免“拃”在现代汉语中的用法歧义。
  - marker: b
    text: 原文所指可能是一种古代量器，或容量为某一单位的器皿；其确切大小不能确定。也可译作“用三分之一量器”。
    reason: 保留 בַּשָּׁלִישׁ 的词义和度量值的不确定性。
lexical_decisions:
- source_word: מִי מָדַד
  choice: 谁曾……量过
  rationale: 以反问句保留 מִי 的质问力量；“曾……过”自然表达完成性动作，并贯穿全句。
- source_word: בְּשָׁעֳלוֹ
  choice: 用手心
  rationale: שָׁעֹל 指手掌中可盛物的凹处；“手心”简明自然，也保留拟人化的度量图景。
- source_word: מַיִם
  choice: 诸水
  rationale: 保留希伯来语复数所呈现的宏大范围；“诸水”在庄重诗体中简洁可懂，又不擅自限定为海水。
- source_word: בַּזֶּרֶת
  choice: 用一拃[a]
  rationale: זֶרֶת 是以张开手掌时拇指至小指的距离为准的长度单位；“一拃”准确保留具体的手量意象，并以脚注说明。
- source_word: תִּכֵּן
  choice: 量定
  rationale: 该动词在此可指量出、确定尺度；“量定”既与前面的“量”呼应，也表达确定诸天范围之意。
- source_word: וְכָל בַּשָּׁלִשׁ
  choice: 用量器[b]量过
  rationale: 动词在上下文中表示度量；שָׁלִישׁ 在此很可能是某种古代容量器具或容量单位，但确切数值不明，因此正文不作虚假精确化。
- source_word: עֲפַר הָאָרֶץ
  choice: 大地的尘土
  rationale: 直接呈现原文属格结构和宇宙性意象。
- source_word: וְשָׁקַל בַּפֶּלֶס הָרִים וּגְבָעוֹת בְּמֹאזְנָיִם
  choice: 又用秤称过群山，用天平称过冈陵
  rationale: 保留“群山—冈陵”及“秤—天平”的诗歌平行结构，不把两种衡器强行合并。
theological_decisions:
- issue: 以人的手和度量动作描写上帝
  choice: 照原文保留“手心”“一拃”以及量、称等具体意象
  alternative: 抽象译为“凭能力测定”或“精确安排”
  rationale: 原诗刻意用拟人化的度量图景彰显创造主远超受造界；抽象化会削弱其修辞力量。
- issue: 反问所指对象
  choice: 正文只译“谁”，不在本节补出“上帝”
  alternative: 译作“除了上帝，谁……”
  rationale: 原文以开放的反问发问，其答案由上下文显明；不在译文中提前补足，以保留原有修辞张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体。“诸水”“群山”“冈陵”维持平行和宇宙尺度；“一拃”虽属具体旧式量词，但现代读者仍可借脚注理解。全句以“谁曾……呢”构成自然有力的汉语反问。
