reference: Isaiah 40:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ק֚וֹל אֹמֵ֣ר קְרָ֔א וְ/אָמַ֖ר מָ֣ה אֶקְרָ֑א כָּל הַ/בָּשָׂ֣ר חָצִ֔יר וְ/כָל חַסְדּ֖/וֹ כְּ/צִ֥יץ הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/006.yaml
  text: A voice says[a], “Cry out!” And I said, “What shall I cry?” All flesh is grass[c][b], and all its loveliness is like the flower of the field.
translation:
  language: zh_hans
  text: 有声音说[a]：“你要呼喊！”我说：“我该呼喊什么呢？”凡有血肉的都如草[b]；他们一切的美好[c]，都像田野的花。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有一种传统读法可译作：“有人说”或“他说”。
    reason: alternative_reading
  - marker: b
    text: “凡有血肉的”是字面表达，指全人类或所有人。
    reason: lexical_alternative
  - marker: c
    text: 或译“荣美”。这里的希伯来词可指人身上美好、荣美或可称许之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל אֹמֵר
  choice: 有声音说
  rationale: קוֹל在此指未说明身份的说话声音；分词אֹמֵר用现在时“说”，保留异象场景的鲜明感。
- source_word: קְרָא
  choice: 你要呼喊
  rationale: קרא可指呼叫、宣告；这里是命令式，译作“你要呼喊”既有公开发声的力度，又不把它过度限定为某种正式宣告。
- source_word: וְאָמַר
  choice: 我说
  rationale: 依马所拉元音读为第一人称“我说”；辅音文本也容许传统上的第三人称读法，故在脚注保留。
- source_word: מָה אֶקְרָא
  choice: 我该呼喊什么呢
  rationale: 重复קרא词根，以“呼喊”呼应前面的命令；“该……什么呢”在现代汉语中自然地表达未完成式的商询语气。
- source_word: כָּל הַבָּשָׂר
  choice: 凡有血肉的
  rationale: 保留“肉体/血肉”的具体意象，同时以现代汉语常用结构表达全体必死的人类。
- source_word: חָצִיר
  choice: 草
  rationale: 准确而自然地呈现短暂易枯的草本意象。
- source_word: חַסְדּוֹ
  choice: 他们一切的美好
  rationale: חסד通常可指慈爱、忠诚，但在与田野之花平行的语境中，更可能指人身上可爱、荣美或值得称羡之处；“美好”保留一定语义宽度，不强行解释为外貌美丽或盟约忠诚。
- source_word: כְּצִיץ הַשָּׂדֶה
  choice: 像田野的花
  rationale: ציץ指花或花朵；此译简洁自然，并保留野地花朵转瞬凋谢的诗意形象。
theological_decisions:
- issue: וְאָמַר中应答者的身份
  choice: 依马所拉元音译作第一人称“我说”
  alternative: “有人说”或“他说”
  rationale: 主文遵从WLC所呈现的马所拉读法，但不把应答者身份的文本歧义静默消除，故以脚注列出第三人称的传统读法。
- issue: חַסְדּוֹ在此处的含义
  choice: 美好
  alternative: 荣美；慈爱；忠诚
  rationale: 上下文把它比作田野的花，重点是人所拥有的可爱、荣美或可称许之处也会消逝；译作“美好”可避免无根据地引入盟约性专义，同时保留原词罕见用法的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“有声音说”保留说话者未具名的情形；用“凡有血肉的都如草”维持原文诗歌的具体比喻和人类必死性的张力。脚注标记按相关词语就近安置。
