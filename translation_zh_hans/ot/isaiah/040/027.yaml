  text: לָ֤/מָּה תֹאמַר֙ יַֽעֲקֹ֔ב וּ/תְדַבֵּ֖ר יִשְׂרָאֵ֑ל נִסְתְּרָ֤ה דַרְכִּ/י֙ מֵֽ/יְהוָ֔ה וּ/מֵ/אֱלֹהַ֖/י מִשְׁפָּטִ֥/י יַעֲבֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/027.yaml
  text: Why do you say[a], O Jacob, and speak, O Israel, “My way is hidden from Yahweh, and my justice is disregarded by my God”?
translation:
  language: zh_hans
  text: 雅各啊，你为何说；以色列啊，你为何讲：“我的道路向雅威隐藏，我的公道[a]被我的上帝忽略了”？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公道”也可译作“权利”或“申诉”。希伯来语 מִשְׁפָּטִי 可指一个人应得的公正、合法权利，或其案件、申诉。
    reason: 保留 מִשְׁפָּטִי 的多重合法词义，避免正文过度限定。
lexical_decisions:
- source_word: לָמָּה תֹאמַר ... וּתְדַבֵּר
  choice: 你为什么这样说……你为什么这样讲
  rationale: 保留反问语气及 אמר、דבר 的平行变化；重复“为什么”使现代汉语中的两重呼语清楚自然。
- source_word: יַעֲקֹב ... יִשְׂרָאֵל
  choice: 雅各……以色列
  rationale: 采用通行译名；二者在此平行指称上帝的子民。
- source_word: נִסְתְּרָה דַרְכִּי
  choice: 我的道路……隐藏
  rationale: 保留“道路”的比喻和被动含义，不把它限定解释为人生遭遇、处境或行为。
- source_word: מֵיְהוָה
  choice: 向雅威
  rationale: מִן 表示这道路在雅威的察看范围之外；“向……隐藏”保留原文表达。יהוה 译作“雅威”，呈现其专名性质。
- source_word: מִשְׁפָּטִי
  choice: 我的公道
  rationale: מִשְׁפָּטִי 可指应得的公正、权利或有待裁断的申诉。“公道”能保留其广度，其他可能含义收入脚注。
- source_word: יַעֲבוֹר
  choice: 被……忽略了
  rationale: 该动词本义为“经过、越过”；在此语境中表达申诉或公道被越过、不予理会。意译为“被忽略了”较符合现代汉语，同时保留说话者认为上帝没有处理其诉求的抱怨。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以专名呈现，不以称号替代。
- issue: מִשְׁפָּטִי 所表达的诉求
  choice: 我的公道
  alternative: 我的权利；我的申诉
  rationale: 原词容许司法、公正和权利等相关含义。正文不把它缩限为单一法律概念，并以脚注保存其他合理理解。
- issue: 以色列认为上帝忽略其处境的抱怨
  choice: 按抱怨本身直陈
  alternative: 加入“仿佛”等缓和词
  rationale: 原文直接引述以色列的感受，没有先行修正其判断；译文保留这一神学张力，由下文作出回应。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“这样说／这样讲”呈现希伯来诗歌的平行结构，以“道路”和“隐藏”保留原文意象；脚注标记紧随其所解释的“公道”。
