base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/004.yaml
  text: Every valley will be lifted up[a], and every mountain and hill will be made low; the uneven ground will become level[b], and the ridges a plain.
translation:
  language: zh_hans
  text: 一切山谷都要升高；一切山岭和山丘都要降低。高低不平之地[a]要变为平地，山脊[b]要变为平原。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“曲折之地”；希伯来语这个词可指弯曲、曲折或高低不平。
    reason: lexical_alternative
  - marker: b
    text: 或译“崎岖之处”；这个希伯来语名词较为罕见，可能泛指崎岖的地带。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּיא
  choice: 山谷
  rationale: 该词指山谷或峡谷；“山谷”自然易懂，也与下文的山岭形成鲜明对照。
- source_word: יִנָּשֵׂא
  choice: 要抬高
  rationale: 这是נשׂא的尼法勒式，在此表示山谷被提升；汉语用“要抬高”简洁地保留被改变的地形意象。
- source_word: הַר וְגִבְעָה
  choice: 大小山岭
  rationale: הַר指山，גִבְעָה指较小的山丘；“大小山岭”以自然汉语保留两类高地并举的总体含义。
- source_word: יִשְׁפָּלוּ
  choice: 都要降低
  rationale: 该动词表示变低或被降下；“降低”与前句“抬高”平行，并保持具体的地貌变化。
- source_word: הֶעָקֹב
  choice: 高低不平之地
  rationale: 该词可表示弯曲、曲折或不平；在修筑道路和改变地貌的语境中，“高低不平之地”清楚自然，同时以脚注保留“曲折之地”的可能。
- source_word: לְמִישׁוֹר
  choice: 变为平地
  rationale: מִישׁוֹר表示平坦之地或平原；这里与“不平”形成直接对照，译作“平地”简明贴切。
- source_word: הָרְכָסִים
  choice: 山脊
  rationale: 这是罕见名词，可能指山脊或更笼统的崎岖地带；正文采用具体的地形词“山脊”，脚注说明较宽泛的译法。
- source_word: לְבִקְעָה
  choice: 变为平原
  rationale: בִקְעָה可指宽阔谷地或平原；“平原”与“山脊”构成清楚对比，也避免与开头“山谷”重复。
theological_decisions:
- issue: 地形意象的性质
  choice: 正文按希伯来文直译为具体的地形改变。
  alternative: 把山谷抬高、山岭降低直接解释为卑微者升高和骄傲者降卑，或直接写成末世性的预备。
  rationale: 本节直接描写为耶和华预备道路时的地貌变化。其比喻意义及末世含义可由上下文和后来的经文引用呈现，不应预先嵌入译文，以免消除原文意象的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“抬高／降低”和“平地／平原”的平行结构保留希伯来诗歌的节奏；不用古奥词汇，也不在正文中加入解释性神学语言。
