  text: ק֣וֹל קוֹרֵ֔א בַּ/מִּדְבָּ֕ר פַּנּ֖וּ דֶּ֣רֶךְ יְהוָ֑ה יַשְּׁרוּ֙ בָּ/עֲרָבָ֔ה מְסִלָּ֖ה לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/003.yaml
  text: 'A voice cries: “In the wilderness prepare the way of Yahweh[a]; make straight in the desert a highway for our God.”'
translation:
  language: zh_hans
  text: 有声音呼喊：“要在旷野为雅威[a]预备道路；在荒原为我们的上帝修直一条大道。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按另一种断句译作：“有声音在旷野呼喊：‘要为雅威预备道路；在荒原为我们的上帝修直一条大道。’”
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וֹל
  choice: 有声音
  rationale: קוֹל可指“声音”或“声响”；这里与分词“呼喊”连用，译作“有声音”自然地呈现先知宣告的开头，也不把声音的身份具体化。
- source_word: קוֹרֵא
  choice: 呼喊
  rationale: 该分词直译为“正在呼叫”；汉语以“有声音呼喊”既保留持续、鲜明的宣告意味，也符合现代汉语表达。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר指荒无人烟的旷野。马所拉重音倾向于把本短语与后面的命令“预备”相连，因此正文采用“要在旷野……预备”；另一种句法划分收入脚注。
- source_word: פַּנּוּ
  choice: 预备
  rationale: פנה在此为复数命令式，语境中指清理、预备道路；“预备”既自然，也保留迎接君王所需的修路意象。
- source_word: דֶּרֶךְ
  choice: 道路
  rationale: דֶּרֶךְ可指道路、路径或行程；在“雅威的道路”这一结构中译作“道路”，兼顾具体修路图景及其可能承载的比喻意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中通行的音译“雅威”呈现四字神名，保留其作为以色列上帝专名的性质，不以称号替代。
- source_word: יַשְּׁרוּ
  choice: 修直
  rationale: 该使役性动词意为使之笔直、平正；“修直”保持道路施工的具体画面，并与上句“预备道路”平行。
- source_word: בָּעֲרָבָה
  choice: 在荒原
  rationale: עֲרָבָה指干旱的平原或荒漠地带；“荒原”与“旷野”有所区分，同时保持诗句的荒凉环境意象。
- source_word: מְסִלָּה
  choice: 一条大道
  rationale: מְסִלָּה通常指修筑或垫高的道路；“大道”比一般“道路”更能体现为盛大通行而特意修筑的路线，量词使现代汉语流畅。
- source_word: לֵאלֹהֵינוּ
  choice: 为我们的上帝
  rationale: אֱלֹהִים虽为复数形态，在此按希伯来语通常用法指以色列的独一上帝；介词ל表达这条大道是为他预备的。
theological_decisions:
- issue: “在旷野”的句法归属
  choice: 正文将“在旷野”连接后面的命令：“要在旷野为雅威预备道路。”
  alternative: 也可连接前面的分词：“有声音在旷野呼喊：‘要为雅威预备道路……’”
  rationale: 马所拉重音支持正文的划分，但希伯来语辅音文本本身容许另一种断句；后一读法又见于新约引文传统，因此以脚注保留，不在正文中消除这项真实的句法张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“旷野／荒原”和“道路／大道”保留希伯来诗歌的平行变化；语序力求自然，同时依照马所拉重音呈现正文断句。
