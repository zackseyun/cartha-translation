source:
  edition: WLC
  text: רֹ֥עָה הִֽתְרֹעֲעָ֖ה הָ/אָ֑רֶץ פּ֤וֹר הִֽתְפּוֹרְרָה֙ אֶ֔רֶץ מ֥וֹט הִֽתְמוֹטְטָ֖ה אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/019.yaml
  text: The earth is utterly shattered[a]; the earth is completely broken apart; the earth is violently shaken.
translation:
  language: zh_hans
  text: 大地彻底破碎[a]，大地完全崩裂，大地猛烈震荡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“土地彻底破碎……土地完全崩裂……土地猛烈震荡。”
    reason: 词义选择：אֶרֶץ 既可指“大地”，也可指“土地”。
lexical_decisions:
- source_word: רֹעָה הִתְרֹעֲעָה
  choice: 彻底破碎
  rationale: 不定式绝对式与限定动词同根连用，强化“破碎”的程度；“彻底”自然传达这一加强语气。
- source_word: הָאָרֶץ / אֶרֶץ / אָרֶץ
  choice: 大地
  rationale: אֶרֶץ 可指“地、土地”或“大地”；本章宇宙性审判的语境支持“大地”。三次重复均予保留，以再现希伯来文的节奏和强调。
- source_word: פּוֹר הִתְפּוֹרְרָה
  choice: 完全崩裂
  rationale: 同根不定式绝对式加强动词，描绘大地瓦解、裂开的状态；“完全崩裂”与首句“破碎”有所区分，又保留强烈程度。
- source_word: מוֹט הִתְמוֹטְטָה
  choice: 猛烈震荡
  rationale: מוֹט 表示摇动、动摇或蹒跚；同根结构加强语气。在灾变语境中，“猛烈震荡”既自然，也传达剧烈摇撼。
theological_decisions:
- issue: אֶרֶץ 的范围
  choice: 正文译作“大地”
  alternative: “土地”
  rationale: 以赛亚书24章的广阔审判图景较支持全地性的含义，但原词也可指特定土地，因此在脚注保留另一译法，不将范围绝对化。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。保留三个平行分句及“大地”的反复，以体现原文密集而有力的诗歌节奏；用“彻底、完全、猛烈”分别传达三组不定式绝对式的强化作用，同时避免三个分句措辞单调。
