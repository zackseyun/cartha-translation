  text: The new wine mourns[a], the vine withers; all the glad of heart groan.
translation:
  language: zh_hans
  text: 新酒悲哀，葡萄树凋萎；所有心中欢乐的人都哀叹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבַל
  choice: 悲哀
  rationale: 该动词通常表示哀痛、悲伤；用于“新酒”时构成拟人，且与后半句人的叹息相呼应。
- source_word: תִּירוֹשׁ
  choice: 新酒
  rationale: 通常指新酿的酒或葡萄所产的新酒；译作“新酒”可保留其与一般“酒”的词义区别。
- source_word: אֻמְלְלָה
  choice: 衰残
  rationale: 该词表达衰弱、凋萎；“衰残”既适合葡萄树的景象，也保留诗句的庄重语气。
- source_word: גָפֶן
  choice: 葡萄树
  rationale: 在农业语境中明确指结葡萄的藤本植物；现代汉语用“葡萄树”自然易懂。
- source_word: נֶאֶנְחוּ
  choice: 叹息
  rationale: 该形式表达因悲苦而发出的哀叹；“叹息”自然地传达从欢乐转为愁苦的反差。
- source_word: כָּל
  choice: 所有……都
  rationale: 以“所有……都”的结构自然表达原文的整体性。
- source_word: שִׂמְחֵי לֵב
  choice: 心中欢乐的人
  rationale: 原文直译为“心里欢乐的”；此译保留“心”的意象，又符合现代汉语表达。
