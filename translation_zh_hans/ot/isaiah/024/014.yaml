id: ISA.24.14
reference: Isaiah 24:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵ֛מָּה יִשְׂא֥וּ קוֹלָ֖/ם יָרֹ֑נּוּ בִּ/גְא֣וֹן יְהוָ֔ה צָהֲל֖וּ מִ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/014.yaml
  text: They lift up their voice; they shout for joy. At the majesty of Yahweh[a], they cry aloud from the sea.
translation:
  language: zh_hans
  text: 他们扬声欢呼；因雅威的威严，他们从海上[a]高声呐喊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从海上”也可译作“从西方”或“从沿海地区”；在先知诗歌中，希伯来语“海”可以带有地理方位的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: 他们
  rationale: 独立第三人称复数代词带有强调作用；现代汉语用“他们”自然承接上下文，不额外添加可能过度表达的强调词。
- source_word: יִשְׂאוּ קוֹלָם
  choice: 扬声
  rationale: 这是“提高声音、发声”的惯用表达；“扬声”简洁而庄重，并保留集体发声的意味。
- source_word: יָרֹנּוּ
  choice: 欢呼
  rationale: 该动词表示喜乐地呼喊，也可能带歌唱意味；“欢呼”保留喜悦与高声表达的核心含义，而不限定为歌唱。
- source_word: בִּגְאוֹן
  choice: 因……的威严
  rationale: גאון在此指崇高、威严；介词ב可表达原因、处境或所面对的对象。正文采用自然的因果表达，但不把这种语法关系提升为超出诗句的神学解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，保留其专名性质，不以称号代替。
- source_word: צָהֲלוּ
  choice: 高声呐喊
  rationale: 该动词传达响亮、激昂的呼喊；此译法保留声音强度，并与前面的“欢呼”形成适度变化。
- source_word: מִיָּם
  choice: 从海上
  rationale: 直译介词מן与名词ים；该短语在先知诗歌中也可能具有“从西方”或“从沿海地区”的地理含义，另以脚注说明。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。采用“雅威”保留专名性质；不以“主”这一称号替换，也不在本节加入经文未明说的教派性解释。
- issue: בִּגְאוֹן 所表达的关系
  choice: 因雅威的威严
  alternative: 面对雅威的威严；在雅威的威严中
  rationale: 介词ב在诗歌中具有一定弹性。这里采用最符合上下文欢呼缘由的因果译法，同时承认原文也可理解为对威严的回应或置身于威严之中。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“扬声欢呼”与“高声呐喊”保留希伯来诗句中两个近义欢呼动词的递进和变化；标点将两组动作清楚连接，不补入原文没有的主语身份或场景说明。
