  yaml_path: translation/ot/isaiah/024/010.yaml
  text: The city of chaos is broken down[b][a]; every house is shut up so that none may enter.
translation:
  language: zh_hans
  text: 混乱之城被摧毁了[a]；每一所房屋都被关上，无人能进入[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “混乱”也可译作“空虚”或“荒凉”。希伯来语 תֹּהוּ 可表达混乱、空无或荒芜。
    reason: lexical_alternative
  - marker: b
    text: 直译：“从进入”；意为房屋被关上，以致无法进入。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבְּרָה
  choice: 被摧毁了
  rationale: שׁבר 的尼法勒完成式表达被动及结果状态。在城邑荒凉的语境中，“被摧毁了”自然地传达城遭破坏、陷入废墟的景象。
- source_word: קִרְיַת
  choice: ……之城
  rationale: קִרְיָה 的构造形表示“……的城”。“……之城”简洁庄重，适合先知文学的语体。
- source_word: תֹּהוּ
  choice: 混乱
  rationale: תֹּהוּ 可表示混乱、空虚或荒凉；正文采用“混乱”，保留其抽象而强烈的意象，并以脚注列出其他可能含义。
- source_word: סֻגַּר
  choice: 封闭起来
  rationale: סגר 的被动强化词干完成式表示“被关闭、被封住”。“封闭起来”既体现被动结果，也符合房屋阻绝出入的语境。
- source_word: כָּל בַּיִת
  choice: 家家户户
  rationale: כָּל 加单数名词具有周遍、逐一的含义。“家家户户”是现代汉语中自然的分配式表达；此处仍可指每一座房屋。
- source_word: מִבּוֹא
  choice: 无人能进去
  rationale: 介词 מִן 与 בוא 的不定词构造连用，字面为“使进入受阻”。译作“无人能进去”自然呈现封闭所造成的结果，而不额外指定封闭者。
