base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/023.yaml
  text: Then the moon will be ashamed[a], and the sun disgraced, for Yahweh of hosts reigns on Mount Zion and in Jerusalem[b], and before his elders there is glory.
translation:
  language: zh_hans
  text: 那时，月亮必蒙羞，太阳必惭愧；因为万军之雅威在锡安山和耶路撒冷作王，在他的众长老[a]面前有荣耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的”也可能理解为指锡安或耶路撒冷，即“锡安（或耶路撒冷）的众长老”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文末尾简短作“荣耀”，没有明示动词；也可理解为“他的荣耀在众长老面前”，或直译为“在他的众长老面前，荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָפְרָה
  choice: 必蒙羞
  rationale: 此处动词表达受羞辱、相形见绌，并非“挖掘”；“蒙羞”保留其被压倒而羞惭的诗意。
- source_word: הַלְּבָנָה
  choice: 月亮
  rationale: 这是“月亮”的常用名词；在与“太阳”的平行结构中所指明确。
- source_word: וּבוֹשָׁה
  choice: 必惭愧
  rationale: בוש表示羞愧；与前句“蒙羞”形成同义平行，同时用不同措辞反映两个不同的希伯来语动词。
- source_word: הַחַמָּה
  choice: 太阳
  rationale: 该词可与热力相关，但在这里与月亮相对，明确指太阳。
- source_word: כִּי
  choice: 因为
  rationale: 引出日月蒙羞、惭愧的原因：雅威作王，并有荣耀在众长老面前。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该完成式在先知性语境中可表达已然的确定性或将来的实现；中文“作王”不强行限定时态，并保留君王统治的意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: צְבָאוֹת
  choice: 万军的
  rationale: 保留“众军、万军”的广义意象，不将其解释性地改写为“全能者”。
- source_word: בְּהַר צִיּוֹן
  choice: 在锡安山
  rationale: 自然表达雅威在锡安山作王的地点。
- source_word: וּבִירוּשָׁלִַם
  choice: 和耶路撒冷
  rationale: 与“在锡安山”共同受介词支配，中文无需重复“在”也清楚自然。
- source_word: וְנֶגֶד
  choice: 在……面前
  rationale: 此处表示处于某些人面前或在其见证之下。
- source_word: זְקֵנָיו
  choice: 他的众长老
  rationale: 三单阳性后缀最自然地回指雅威；“众长老”保留群体性的领袖意象，同时以脚注保存另一种可能指向。
- source_word: כָּבוֹד
  choice: 有荣耀
  rationale: 原文以“荣耀”这一名词简短收束，并无明示动词；中文补入最低限度的“有”，使句子自然而不添加“彰显”等解释。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；音译“雅威”保留专名性质，也避免用称号“主”取代原文。
- issue: זְקֵנָיו 中后缀的所指
  choice: “他的众长老”，理解为雅威的众长老
  alternative: 锡安或耶路撒冷的众长老
  rationale: 阳性单数后缀可自然回指本句主语雅威，但原文简练，亦可能回指作为阳性意象的锡安；在正文采用较自然的读法，并在脚注保留歧义。
- issue: 末句 כָּבוֹד 的句法关系
  choice: “面前有荣耀”
  alternative: “他的荣耀在众长老面前”；“在众长老面前，荣耀”
  rationale: 希伯来文末尾只有简短的名词“荣耀”，没有明说系词，也没有“他的”修饰“荣耀”；正文以最低限度的中文补词表达，脚注保留更简短及带所属关系的可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“蒙羞／惭愧”保留诗歌平行及两个近义动词的区别；末句避免加入“彰显”“充满”等原文没有的解释。
