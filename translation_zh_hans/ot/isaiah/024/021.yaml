  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִפְקֹ֧ד יְהוָ֛ה עַל צְבָ֥א הַ/מָּר֖וֹם בַּ/מָּר֑וֹם וְ/עַל מַלְכֵ֥י הָ/אֲדָמָ֖ה עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/021.yaml
  text: And on that day the LORD will punish the host of the height in the height, and the kings of the earth on the earth.
translation:
  language: zh_hans
  text: 到那日，耶和华必在高处惩罚高处的众军[a]，在地上惩罚地上的列王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高处的众军”也可理解为“天上的众军”；原文没有明确说明这些对象的具体身份。
    reason: 说明 צְבָא הַמָּרוֹם 的语义范围，同时避免在正文中消除原文的含混性。
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 采用现代汉语自然的先知性时间表达，保留原文所指的特定审判之日。
- source_word: יִפְקֹד
  choice: 惩罚
  rationale: פקד 在此语境中表示追讨、施行审判；“惩罚”清楚传达其司法含义。
- source_word: צְבָא הַמָּרוֹם
  choice: 高处的众军
  rationale: 贴近原文“高处之军”的结构，不直接限定为天使、星宿或属灵势力，从而保留所指对象的开放性。
- source_word: בַּמָּרוֹם
  choice: 在高处
  rationale: 保留与“高处的众军”之间的词语呼应，也避免把原文范围过早明确化为“天上”。
- source_word: מַלְכֵי הָאֲדָמָה עַל הָאֲדָמָה
  choice: 在地上惩罚地上的列王
  rationale: 重现原文“地上的列王／在地上”的刻意重复，并与前半句形成平行。
theological_decisions:
- issue: “高处的众军”所指为何
  choice: 不在正文中确定其身份，译作“高处的众军”
  alternative: 译作“天上的众军”“天军”或“高位者”
  rationale: 原文可让人联想到天上或超地上的势力，但本节并未明确说明其具体身份；保留空间与地上列王的对照，更忠实于原文的含混和张力。
- issue: 耶和华行动的性质
  choice: 译为“惩罚”
  alternative: 译为较中性的“察访”或“眷顾”
  rationale: 上下文是普世审判，פקד 在此具有追讨罪责的负面含义；“惩罚”不会削弱审判语气。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。通过“在高处……在地上……”的对称句式保留希伯来文的平行结构，并保留“高处／地上”的重复和空间对照。
