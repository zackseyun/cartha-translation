  text: וְֽ֠/הָיָה הַ/נָּ֞ס מִ/קּ֤וֹל הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עוֹלֶה֙ מִ/תּ֣וֹךְ הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אֲרֻבּ֤וֹת מִ/מָּרוֹם֙ נִפְתָּ֔חוּ וַֽ/יִּרְעֲשׁ֖וּ מ֥וֹסְדֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/018.yaml
  text: 'And it will happen: the one who flees from the sound of terror will fall into the pit[a], and the one who comes up from the midst of the pit will be caught in the trap; for the windows from on high are opened, and the foundations of the earth shake.'
translation:
  language: zh_hans
  text: 必有这样的事：逃避惊恐之声的人，必坠入坑中；从坑中上来的人，必落入陷阱。因为高天的窗户[a]已经打开，大地的根基也震动了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上的水闸”。希伯来文直译为“高处的窗户”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 那时
  rationale: 该表达引出随之发生的情形；“那时”在现代汉语中自然凝练，也保留预言叙事的推进作用。
- source_word: הַנָּס
  choice: 躲避……的
  rationale: 分词作名词用，泛指正在逃避的人；汉语用“……的”可自然保留泛指功能。
- source_word: מִקּוֹל הַפַּחַד
  choice: 躲避恐怖之声
  rationale: קוֹל可指声音，פַּחַד指恐怖、惊惧；直译为“恐怖之声”保留原文听觉意象及其含混性。
- source_word: יִפֹּל אֶל הַפַּחַת
  choice: 必坠入坑中
  rationale: פַּחַת是坑、陷坑；“坠入坑中”既具体又符合灾祸意象。
- source_word: וְהָעוֹלֶה מִתּוֹךְ הַפַּחַת
  choice: 从坑里爬上来的
  rationale: 保留分词的泛指结构和由坑中向上出来的空间关系；“爬上来”比机械的“上来”更符合此处脱坑语境。
- source_word: יִלָּכֵד בַּפָּח
  choice: 必被网罗缠住
  rationale: פַּח指捕捉猎物的罗网或圈套；“网罗”保留具体捕捉意象，并与前面的“坑”相区别。
- source_word: אֲרֻבּוֹת מִמָּרוֹם
  choice: 高处的窗户
  rationale: 按字面保留“高处”与“窗户”的图像，不在正文中直接解释为天上的水闸。
- source_word: נִפְתָּחוּ
  choice: 已经敞开
  rationale: 被动完成式可表达已经发生并形成当前状态；“已经敞开”兼顾完成性和鲜明画面。
- source_word: וַיִּרְעֲשׁוּ
  choice: 都震动了
  rationale: 该动词表示震动、摇撼；汉语完成体顺应希伯来语叙事形式，同时“都”自然关联复数主语。
- source_word: מוֹסְדֵי אָרֶץ
  choice: 大地的根基
  rationale: מוֹסְדֵי指根基、基础；本章语境具有宇宙性，“大地”比局部性的“土地”更合适。
theological_decisions:
- issue: אָרֶץ的范围
  choice: 大地
  alternative: 土地／这地
  rationale: 上下文描绘广泛乃至宇宙性的审判，“大地”更符合此处范围，同时不额外加入特定教义解释。
- issue: אֲרֻבּוֹת מִמָּרוֹם的意象
  choice: 高处的窗户
  alternative: 天上的水闸
  rationale: 正文采用较贴近原文的表达，以保留意象及其解释空间；传统的洪水闸门理解列入脚注。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。通过“坑／网罗”的并列保留原文连续的捕捉意象；句式凝练，以呈现审判无法逃脱的节奏。
