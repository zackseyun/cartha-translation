  text: They do not drink wine with a song[a]; strong drink is bitter to those who drink it.
translation:
  language: zh_hans
  text: 人不再伴着歌声喝酒[a]；浓酒在饮用它的人口中变得苦涩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人将不再唱着歌喝酒。”希伯来语未完成式也可理解为将来时；בַּשִּׁיר也可译为“在歌声中”或“唱着歌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשִּׁיר
  choice: 伴着歌声
  rationale: 介词 בְּ 与“歌”连用，在此自然表示伴随或方式，描写饮酒不再有歌声相伴；中文表达自然，也保留诗意。
- source_word: לֹא יִשְׁתּוּ
  choice: 人不再……喝
  rationale: 未完成式在先知诗歌中可指当前的生动景象，也可带将来意味。正文按语境译作现状描述，并用脚注保留将来理解。
- source_word: יַיִן
  choice: 酒
  rationale: יַיִן通常指葡萄酒；此处译作简洁自然的“酒”，并与下句的שֵׁכָר保持区别。
- source_word: יֵמַר
  choice: 使……觉得苦涩
  rationale: 源自动词 מרר，意为“苦、变苦”。此译既表达饮者的感受，也避免中文“浓酒是苦的”可能造成的生硬。
- source_word: שֵׁכָר
  choice: 浓酒
  rationale: 指有致醉作用、区别于普通葡萄酒的饮料。“浓酒”是中文圣经语体中自然而凝练的对应。
- source_word: לְשֹׁתָיו
  choice: 喝的人
  rationale: 指喝这种浓酒的人；中文无需重复代词“它”，仍能清楚表达所属关系。
