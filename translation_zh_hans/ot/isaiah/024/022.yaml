  text: וְ/אֻסְּפ֨וּ אֲסֵפָ֤ה אַסִּיר֙ עַל בּ֔וֹר וְ/סֻגְּר֖וּ עַל מַסְגֵּ֑ר וּ/מֵ/רֹ֥ב יָמִ֖ים יִפָּקֵֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/022.yaml
  text: And they will be gathered together like prisoners into a pit[a], and they will be shut up in a prison; and after many days they will be punished.
translation:
  language: zh_hans
  text: 他们必如囚犯般被聚集在坑中，又被囚禁在监牢里；过了许多日子，他们必受惩罚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们必被眷顾或被追究。”希伯来语动词可指受到眷顾、探访或被追究；在这里的审判语境中，译为“受惩罚”较为可能。
    reason: 保留יִפָּקֵדוּ的语义宽度及在审判语境下仍存在的较宽泛译法。
lexical_decisions:
- source_word: וְאֻסְּפוּ אֲסֵפָה
  choice: 他们必被聚集
  rationale: 以被动式保留主语被聚拢的含义；同根名词加强“聚集”的语势，汉语不宜生硬重复。
- source_word: אַסִּיר עַל־בּוֹר
  choice: 像囚犯被关进坑里
  rationale: אַסִּיר虽为单数形式，在复数谓语之后具有集合意义；“像囚犯”保留比拟意味。עַל在移送、拘禁语境中可表达进入某处，译作“关进坑里”自然地呈现强制拘禁。
- source_word: וְסֻגְּרוּ עַל־מַסְגֵּר
  choice: 他们必被囚禁在牢中
  rationale: סגר的被动式表示遭到关闭或拘禁；מַסְגֵּר指拘禁之处。“被囚禁在牢中”兼顾被动语态和监禁意象。
- source_word: וּמֵרֹב יָמִים
  choice: 许多日子以后
  rationale: 该短语表示经过很长的一段时间；此译法贴近原文“许多日子”并符合现代汉语。
- source_word: יִפָּקֵדוּ
  choice: 他们必受惩罚
  rationale: פקד的尼法勒式可指被察看、被处置或被追究；本节处于审判语境，并承接聚集和监禁的意象，因此正文采用“受惩罚”，同时以脚注保留较宽泛的译法。
theological_decisions:
- issue: 审判语境中יִפָּקֵדוּ的含义
  choice: 他们必受惩罚
  alternative: 他们必被察看／被处置
  rationale: 上下文强烈指向审判性的追究，但该动词本身语义较宽，既可表示眷顾，也可表示追究，因此不应抹去其真实歧义；正文表达本语境最可能的含义，脚注说明另一种译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坑”保留古代囚禁之坑的具体意象；“牢中”避免过于古雅的“地牢”。分号和句号呈现从聚集、监禁到日后追究的推进。
