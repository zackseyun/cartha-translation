  text: וְ/הָ/אָ֥רֶץ חָנְפָ֖ה תַּ֣חַת יֹשְׁבֶ֑י/הָ כִּֽי עָבְר֤וּ תוֹרֹת֙ חָ֣לְפוּ חֹ֔ק הֵפֵ֖רוּ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/005.yaml
  text: The earth is defiled under its inhabitants[a], because they have transgressed laws, violated a statute[b], and broken the everlasting covenant.
translation:
  language: zh_hans
  text: 大地因其居民而被玷污；因为他们违犯了律例，更改了法令[a]，背弃了永远的约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逾越了法令。”希伯来语动词可表示越过、逾越，也可表示改变。
    reason: lexical_alternative
  - marker: b
    text: 本节没有明确说明“永远的约”指哪一个约；有人将它理解为挪亚之约，也有人理解为神为人类所设立、恒久有效的道德秩序。
    reason: alternative_reading
lexical_decisions:
- source_word: חָנְפָה
  choice: 受了玷污
  rationale: 该词在这里表达道德与宗教意义上的污染或亵渎；“受了玷污”既说明大地所处的结果状态，也不把含义局限于礼仪性不洁。
- source_word: תַּחַת יֹשְׁבֶיהָ
  choice: 在其居民脚下
  rationale: 保留介词“在……之下”的空间意象，同时以现代汉语可理解的“脚下”表达居民的罪使他们所居之地受污；后面的“因为”明确因果关系。
- source_word: עָבְרוּ תוֹרֹת
  choice: 违犯了律例
  rationale: עָבְרוּ在法律和道德语境中指越界、违犯；תּוֹרֹת为复数，指具有约束力的教导或法则。“律例”自然凝练，并保留法律性，不强行限定为摩西律法。
- source_word: חָלְפוּ חֹק
  choice: 逾越了定例
  rationale: חָלְפוּ可指越过、改变；正文按与前后分句平行的语境译作“逾越”，同时用脚注保留“更改”的可能。חֹק指确立的规章或定例。
- source_word: הֵפֵרוּ בְּרִית עוֹלָם
  choice: 背弃了永远的约
  rationale: הֵפֵרוּ是常见的违约用语，可译为破坏、废弃或违背；汉语“背弃了……约”自然表达对盟约的破坏。“永远的约”保留其持久、恒常之意。
theological_decisions:
- issue: “永远的约”所指为何
  choice: 正文只译作“永远的约”，不具体指认
  alternative: 挪亚之约；受造秩序中的恒常道德规范；神与全人类之间的一般性永约
  rationale: 本节没有明确说明这约的具体身份。保持概括性称谓，既保留其神学分量，也避免把某一种解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“大地在其居民脚下”保留原文意象；三个并列动词“违犯、逾越、背弃”呈现递进的法律—盟约语气。所有脚注标记均置于正文相应词组之后。
