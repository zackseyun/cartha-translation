  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: צְוָחָ֥ה עַל הַ/יַּ֖יִן בַּֽ/חוּצ֑וֹת עָֽרְבָה֙ כָּל שִׂמְחָ֔ה גָּלָ֖ה מְשׂ֥וֹשׂ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/011.yaml
  text: There is an outcry over the wine in the streets[a]; all joy has grown dark[b]; the gladness of the earth has gone away.
translation:
  language: zh_hans
  text: 街上响起为酒而发的哀号；一切欢乐都昏暗了[a]，大地的欢欣已经离去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切欢乐都入暮了”，保留希伯来文把欢乐描绘成如天色入夜般变暗的意象。
    reason: lexical_alternative
  - marker: b
    text: “大地”也可译作“土地”或“这地”。
    reason: alternative_reading
lexical_decisions:
- source_word: צְוָחָה
  choice: 响起……哀号
  rationale: 该名词表示困苦中的呼喊或哀号；用存在性表达“响起……哀号”，既保留名词意味，也符合现代汉语习惯。
- source_word: עַל הַיַּיִן
  choice: 为酒而发的
  rationale: 介词 עַל 在此可指哀号所关乎的对象或原因；“为酒”保留了因缺酒而哀叹和为失去酒而呼喊之间的含混性。
- source_word: בַּחוּצוֹת
  choice: 街上
  rationale: 该复数名词指城中的户外公共空间，可包括街道和广场；“街上”简洁自然，并呈现公开哀号的场景。
- source_word: עָרְבָה
  choice: 昏暗了
  rationale: 此动词有“天色变暗、入暮”之意；用于“欢乐”时形成鲜明隐喻。“昏暗了”保留夜幕降临般的意象，未将其简化为“消失”。
- source_word: כָּל שִׂמְחָה
  choice: 一切欢乐
  rationale: 表达欢乐的全面止息；“一切欢乐”自然凝练，也与后句的 מְשׂוֹשׂ 略作区分。
- source_word: גָּלָה
  choice: 已经离去
  rationale: 该动词可表示离开、被移去或流亡；以“欢欣”为主语时，“离去”自然保留其拟人化的动态，而不把它过度具体化为“被掳”。
- source_word: מְשׂוֹשׂ
  choice: 欢欣
  rationale: 该词指欢腾、喜悦；“欢欣”与前句“欢乐”意义相近却不完全重复，体现希伯来文两个近义名词。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 以赛亚书24章的审判视野广阔，具有普世范围；“大地”比“本地”或“这片土地”更符合上下文，同时仍保留希伯来词可指土地的基本语感。
theological_decisions:
- issue: הָאָרֶץ 的范围
  choice: 大地
  alternative: 土地／这地
  rationale: 本章语言指向广泛、普世性的审判，因此正文采用“大地”；脚注保留其也可指特定“土地”的词义可能，避免把语义范围说成毫无歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哀号—欢乐—欢欣”维持原文由公开悲声转向普遍喜乐消退的诗性推进；“昏暗了”刻意保留 עָרְבָה 的夜幕意象及其不寻常搭配。
