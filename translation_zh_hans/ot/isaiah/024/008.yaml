  yaml_path: translation/ot/isaiah/024/008.yaml
  text: The mirth of tambourines has ceased[a]; the noise of the jubilant has stopped[b]; the mirth of the lyre has ceased.
translation:
  language: zh_hans
  text: 手鼓的欢乐止息了；欢庆之人的喧闹声停了；琴[a]的欢乐止息了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琴”指古代的拨弦乐器，通常认作“里拉琴”；传统译本也常译作“竖琴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבַת
  choice: 止息了
  rationale: 该词在此表示活动已经停止；两处采用同一译法，以保留原文首尾呼应的结构。
- source_word: מְשׂוֹשׂ
  choice: 欢腾
  rationale: 该名词指喜乐、欢欣，语境中特指伴随乐器的节庆欢乐；“欢腾”比泛指内在感受的“喜乐”更能体现这种公开而热烈的气氛。
- source_word: תֻּפִּים
  choice: 手鼓
  rationale: תֹּף 指手持敲击乐器；“手鼓”准确、简明，也避免现代“铃鼓”可能带来的特定构造联想。
- source_word: חָדַל
  choice: 停了
  rationale: 该动词意为停止；与“喧闹声”搭配自然，同时通过不同于 שָׁבַת 的译词，适度反映原文动词变化。
- source_word: שְׁאוֹן
  choice: 喧闹声
  rationale: 该词可指响声、喧嚷或嘈杂声；这里是欢庆人群发出的声响，“喧闹声”既保留听觉力度，也不额外暗示骚乱。
- source_word: עַלִּיזִים
  choice: 欢庆之人
  rationale: 该复数形式指欢欣、庆贺的人；“欢庆之人”自然传达群体性的喜庆状态，又不加入醉酒作乐等原文未明说的含义。
- source_word: כִּנּוֹר
  choice: 弦琴
  rationale: 该词指古代拨弦乐器，通常识别为里拉琴；正文用较易懂的“弦琴”，脚注说明其较精确的乐器类别。
