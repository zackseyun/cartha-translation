  yaml_path: translation/ot/isaiah/024/012.yaml
  text: Desolation is left in the city[a], and the gate is battered into ruins.
translation:
  language: zh_hans
  text: 城中只剩荒凉[a]，城门被击毁，沦为废墟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“城中留下荒凉；城门被击打，归于毁坏。”
    reason: 原文 נִשְׁאַר 可译为“剩下”或“被留下”；שַׁמָּה 和 שְׁאִיָּה 均可指荒凉、荒废或毁坏。此译较贴近原文的并列结构和词汇重复。
lexical_decisions:
- source_word: נִשְׁאַר
  choice: 只剩下
  rationale: שׁאר 的尼法勒式表示灾变之后留下或剩余；“只剩下”自然传达劫后所余的语气。
- source_word: בָּעִיר
  choice: 城中
  rationale: עִיר 通常指城市；介词和定冠词合译为“城中”，简洁自然。
- source_word: שַׁמָּה
  choice: 一片荒凉
  rationale: 该词表示荒废、凄凉的状态；“一片荒凉”符合现代汉语习惯，并将其作为 נִשְׁאַר 的所余之物。
- source_word: וּשְׁאִיָּה
  choice: 成废墟
  rationale: שְׁאִיָּה 表示毁坏、废墟或荒废；与被动动词结合，结果式“被砸成废墟”既自然又保留毁坏的结果。
- source_word: יֻכַּת
  choice: 被砸
  rationale: כתת 的霍法勒式表达遭击打、砸毁；“被砸”保留被动和强烈的破坏力。
- source_word: שָׁעַר
  choice: 城门
  rationale: שַׁעַר 指门，在此语境中即城市的城门；明译为“城门”可避免现代读者理解为普通门扇。
