base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/002.yaml
  text: 'And it shall be: as with the people[a], so with the priest; as with the slave, so with his master; as with the female slave, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the creditor, so with the one indebted to him.'
translation:
  language: zh_hans
  text: 将要这样：百姓怎样，祭司也怎样；奴隶怎样，他的主人也怎样；女奴怎样，她的女主人也怎样；买主怎样，卖主也怎样；放贷者怎样，借款者也怎样；债权人怎样，对他负债的人也怎样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对他负债的人”，希伯来文直译作“向他负债的人”。
    reason: 说明末句关系从句的字面表达，并准确反映בוֹ所指的“对他”。
lexical_decisions:
- source_word: וְהָיָה
  choice: 到那时……也怎样
  rationale: 该表达引出将要出现的局面；用“到那时”自然承接预言语境，并统摄全句。
- source_word: כָעָם כַּכֹּהֵן
  choice: 百姓怎样，祭司也怎样
  rationale: 保留连续比较句式，表达灾祸临到时社会身份不造成区别。
- source_word: כַעֶבֶד כַּאדֹנָיו
  choice: 奴仆怎样，主人也怎样
  rationale: עֶבֶד在此社会等级清单中指受主人支配的人；“奴仆”既保留身份差异，也符合庄重经文语体。
- source_word: כַשִּׁפְחָה כַּגְּבִרְתָּהּ
  choice: 婢女怎样，主母也怎样
  rationale: 原文明确标示女性从属者及其女性主人；“婢女／主母”简洁保留性别与家庭等级关系。
- source_word: כַקּוֹנֶה כַּמּוֹכֵר
  choice: 买主怎样，卖主也怎样
  rationale: 两个分词作名词，构成买卖双方的对举；“买主／卖主”自然且对称。
- source_word: כַמַּלְוֶה כַּלֹּוֶה
  choice: 放贷的怎样，借贷的也怎样
  rationale: 分别表达使人借得款项者与借款者；采用通俗角色表达，保留双方对举。
- source_word: כַנֹּשֶׁה כַּאֲשֶׁר נֹשֶׁא בוֹ
  choice: 债主怎样，欠他债的也怎样
  rationale: 前者是追索债务的债权人，后者字面结构较不寻常，语境指对他负有债务的人；正文采取清楚的现代汉语表达，并以脚注保留原文字面形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的排比句式；以六组社会与经济身份的对举呈现原文节奏。避免把比较关系解释为身份本身相同，而保留“遭遇相同”的语境含义。
