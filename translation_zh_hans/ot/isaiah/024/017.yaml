  yaml_path: translation/ot/isaiah/024/017.yaml
  text: Terror and the pit and the snare are upon you[a], inhabitant of the earth.
translation:
  language: zh_hans
  text: 惊恐、陷坑和网罗临到你，地[a]上的居民哪！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地”也可译作“土地”；“地上的居民”也可译作“住在地上的人”。
    reason: 保留 הָאָרֶץ 的词义范围，以及单数分词短语在中文中的另一种自然表达。
lexical_decisions:
- source_word: פַּחַד
  choice: 惊恐
  rationale: 该名词可指恐惧、畏惧或可怕之事；在与“陷坑、网罗”并列的审判三联语中，“惊恐”既保留恐惧感，也传达迫近的可怕灾祸。
- source_word: פַחַת
  choice: 陷坑
  rationale: 此词指用来捕捉猎物的坑。“陷坑”简洁自然，并明确呈现其捕捉功能。
- source_word: פָח
  choice: 网罗
  rationale: 此词指捕捉鸟兽的罗网或圈套。“网罗”与“陷坑”有清楚区别，也保留诗歌性的审判意象。
- source_word: עָלֶיךָ
  choice: 都临到你了
  rationale: 原文是无动词句，直译为“在你身上”。中文用“临到你了”表达灾祸当前的迫切性；“都”为配合三个并列名词而补出。
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: 地上的居民哪
  rationale: 单数分词在这里作呼语，故保留集合性单数称呼；“哪”自然体现呼告语气。结合本章广阔的审判范围，הָאָרֶץ 译作“地”而非限定为某一国土。
theological_decisions:
- issue: הָאָרֶץ 的范围
  choice: 地
  alternative: 土地／国土
  rationale: 该词本身既可指全地，也可指某片土地；本章语境呈现广泛、近乎普世的审判，因此正文采用“地”，但脚注保留局部地域的词义可能。
translation_notes:
  register: 采用庄重而易懂的现代汉语。“惊恐、陷坑和网罗”保持原文紧密的三联结构；希伯来语三个名词具有显著的近音效果，中文无法自然复制，故以节奏整齐的并列语保留其诗意。
