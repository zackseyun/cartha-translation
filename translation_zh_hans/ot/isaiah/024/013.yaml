review_pass:
  verdict: revise
  source_fidelity: 原文以两个农业采收后的稀少残余作比：橄榄树的击打，以及葡萄采收结束后的遗留果实。草稿准确把握总体意象，但正文首个比喻把原文的“击打橄榄树”改写为“击打后所剩的果子”，使动作意象在正文中不够直接；第二个比喻的“零星余果”也略泛，未明确其为葡萄。修订保留原文的动作与结果性图像，同时不把“余民”等解释加入正文。
  naturalness: 草稿整体庄重自然。“情形将是这样”虽可理解，但“将会是这样”略顺畅。修订后的两个“如同”并列结构清晰，且“橄榄树击打后所剩的橄榄”与“葡萄收割完毕后所剩的零星葡萄”在现代书面普通话中自然明确。
  terminology: “大地”“万民”“橄榄”“葡萄”均合适。“万民”保留复数族群概念和经文的庄重语域。将泛称的“果子／余果”分别落实为“橄榄／葡萄”，忠实于两个具体农业意象；这不是神学性扩展。
