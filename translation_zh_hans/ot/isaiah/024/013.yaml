  text: כִּ֣י כֹ֥ה יִהְיֶ֛ה בְּ/קֶ֥רֶב הָ/אָ֖רֶץ בְּ/ת֣וֹךְ הָֽ/עַמִּ֑ים כְּ/נֹ֣קֶף זַ֔יִת כְּ/עוֹלֵלֹ֖ת אִם כָּלָ֥ה בָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/013.yaml
  text: 'For so it will be in the midst of the earth[a], among the peoples: like the beating of an olive tree[b], like gleanings when the grape harvest is finished.'
translation:
  language: zh_hans
  text: 因为在大地之中[a]、在万民之间，情形将会是这样：如同橄榄树击打后所剩的橄榄[b]，又如葡萄收割完毕后所剩的零星葡萄[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“那地”或“地上”。这里与“万民”并列，可能指全地。
    reason: lexical_ambiguity
  - marker: b
    text: 较直译：“如同击打橄榄树。”古时人击打或摇动树枝收取橄榄，树上只会留下少量果实。
    reason: cultural_image
  - marker: c
    text: 也可译作“又如葡萄收成结束后的拾遗”。原文指主要采收后留下的少量葡萄。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה יִהְיֶה
  choice: 因为……情形将是这样
  rationale: כִּי承接上文，说明前述审判所造成的局面；כֹה יִהְיֶה直译为“将要如此”。译文用现代汉语自然表达其解释和预告功能。
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: 在大地之中
  rationale: קֶרֶב表示“内部、中间”，הָאָרֶץ既可指“大地”也可指“那地”。本节随即说“在万民之间”，较广的“大地”更符合普世语境，同时以脚注保留另一可能。
- source_word: בְּתוֹךְ הָעַמִּים
  choice: 在万民之间
  rationale: עַמִּים为复数，指众多族群或人民；“万民”自然、庄重，也避免把古代族群概念限定为现代民族国家。
- source_word: כְּנֹקֶף זַיִת
  choice: 如同击打橄榄树后所剩的果子
  rationale: נֹקֶף描写击打橄榄树使果实落下的动作。上下文的重点是收取之后所剩无几，译文将该图像在汉语中明确表达，但脚注保留较贴近字面的说法。
- source_word: כְּעוֹלֵלֹת
  choice: 零星余果
  rationale: עוֹלֵלֹת指主要收成后留待拾取的少量果实或小串葡萄。“零星余果”既传达稀少，也适合葡萄收获的图像。
- source_word: אִם כָּלָה בָצִיר
  choice: 葡萄收割完毕后
  rationale: 此处אִם在语境中带时间意味，可理解为“当……完毕时”或“……以后”；בָצִיר特指葡萄收成。译文采用自然的时间表达，不按条件句处理。
theological_decisions:
- issue: 审判之后仍有少量余剩者的意象
  choice: 借两幅收获后的余果图像表达稀少的存留，不在正文中直接加上“余民”等神学术语
  alternative: 明确译为“地上只剩少数余民”
  rationale: 希伯来文以橄榄和葡萄收获后的残余作比喻，本节没有直接使用“余民”一词。保留图像及其张力，可避免把解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“情形将是这样”使希伯来语的简短预告结构在汉语中顺畅；两个并列比喻保留农业图像，并以“所剩”“零星”传达原文所暗示的稀少。
