  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִבּ֧וֹק תִּבּ֛וֹק הָ/אָ֖רֶץ וְ/הִבּ֣וֹז תִּבּ֑וֹז כִּ֣י יְהוָ֔ה דִּבֶּ֖ר אֶת הַ/דָּבָ֥ר הַ/זֶּֽה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/003.yaml
  text: The earth will be utterly emptied and utterly plundered[a], for Yahweh has spoken this word.
translation:
  language: zh_hans
  text: 大地必被彻底掏空，必遭完全劫掠[a]，因为雅威已经说了这话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这地必被彻底掏空，必遭完全劫掠。”希伯来语 אֶרֶץ 既可指某一片“土地”或“这地”，也可指“大地”；本章较广阔的语境支持“大地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבּוֹק תִּבּוֹק
  choice: 必被彻底掏空
  rationale: 不定式绝对形与限定动词连用，加强动作语气；“必……彻底……”既体现确定性和强调，也保留尼法勒式的被动意义。“掏空”在现代汉语中自然地表达被倒空、变得空无的图景。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ 可指“地、土地、国土”或“大地、全地”。以赛亚书24章的普世性语境较支持“大地”，但在脚注中保留“这地”的可能。
- source_word: וְהִבּוֹז תִּבּוֹז
  choice: 必遭完全劫掠
  rationale: 第二组不定式绝对形加限定动词同样表示强调；בזז 指抢夺、劫掠。“遭……劫掠”保留被动受害含义，“完全”传达希伯来文的强化作用。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出上述审判宣告的根据，用“因为”清楚自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其作为上帝专名的功能音译为“雅威”，不以称号替代。
- source_word: דִּבֶּר
  choice: 已经说了
  rationale: 完成式把神的宣告呈现为已经确立、确定有效；“已经说了”是自然庄重的现代汉语。
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: 这话
  rationale: דָּבָר 在先知宣告公式中指所说出的信息或宣告；“这话”比“这个事情”更贴合语境，也较符合现代汉语。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名，正文以“雅威”音译其专名，保留其作为以色列之神名字的功能，而不改译为头衔。
- issue: הָאָרֶץ 的范围
  choice: 大地
  alternative: 这地
  rationale: 该词本身容许地域性与普世性两种理解；本章广阔、宇宙性的审判语境支持“大地”，同时用脚注保存真实的词义歧义。
translation_notes:
  register: 采用现代、庄重而清楚的先知宣告语体。两个“必”以及“彻底／完全”对应原文两组强化结构；分句保持平行，但避免生硬逐词对应。
