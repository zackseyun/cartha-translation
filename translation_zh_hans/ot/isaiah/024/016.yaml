id: ISA.24.16
reference: Isaiah 24:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ/כְּנַ֨ף הָ/אָ֜רֶץ זְמִרֹ֤ת שָׁמַ֨עְנוּ֙ צְבִ֣י לַ/צַּדִּ֔יק וָ/אֹמַ֛ר רָזִי לִ֥/י רָֽזִי לִ֖/י א֣וֹי לִ֑/י בֹּגְדִ֣ים בָּגָ֔דוּ וּ/בֶ֥גֶד בּוֹגְדִ֖ים בָּגָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/016.yaml
  text: 'From the edge of the earth we hear songs: “Glory to the righteous one.” But I say[a], “I waste away, I waste away. Woe is me!” The treacherous deal treacherously[c][b]; with treachery the treacherous deal treacherously.'
translation:
  language: zh_hans
  text: '从大地边缘[a]，我们听见歌声：


    “荣美归于义者[b]！”


    但我说：


    “我消瘦了，我消瘦了[c]！


    我有祸了！”


    背信的人行背信之事；


    背信的人以背信行背信之事。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地的翅膀”或“地极”。
    reason: lexical_alternative
  - marker: b
    text: “荣美”也可译作“荣耀”或“尊荣”；“义者”也可能泛指义人群体。
    reason: alternative_reading
  - marker: c
    text: “我消瘦了”所据的希伯来语很难确定。传统上理解为衰瘦、耗损的哀叹；也有人译作“我的秘密，我的秘密”或“这对我是奥秘”。
    reason: alternative_reading
lexical_decisions:
- source_word: מִכְּנַף הָאָרֶץ
  choice: 从大地边缘
  rationale: כָּנָף本义为“翅膀”，用于地理表达时指边缘或极处。译作“大地边缘”既保留单数意象，又符合现代汉语；“地极”也是可能的意译。
- source_word: זְמִרֹת שָׁמַעְנוּ
  choice: 我们听见歌声
  rationale: זְמִרֹת泛指歌或乐歌，不额外加入原文未明说的“赞美”；完成式在先知异象的鲜明叙述中用“听见”自然表达。
- source_word: צְבִי לַצַּדִּיק
  choice: 荣美归于义者
  rationale: צְבִי可指荣美、荣耀或尊荣；“荣美”保留其审美与尊荣两方面的语义。לַצַּדִּיק形式为带定冠词的单数，故用“义者”，但不指定其身份。
- source_word: וָאֹמַר
  choice: 但我说
  rationale: 连接词本身推进叙事，而上下文从远方歌声骤转为哀叹，汉语用“但”自然呈现这一强烈对比。
- source_word: רָזִי לִי רָזִי לִי
  choice: 我消瘦了，我消瘦了
  rationale: 按与“瘦弱、消瘦”相关的传统理解翻译，并保留重复的哀叹。该希伯来语措辞艰难，也可能按“秘密”理解，故收入脚注。
- source_word: אוֹי לִי
  choice: 我有祸了
  rationale: 以现代而庄重的汉语表达哀祸呼喊，并保留说话者自身面临灾祸的语气。
- source_word: בֹּגְדִים בָּגָדוּ וּבֶגֶד בּוֹגְדִים בָּגָדוּ
  choice: 诡诈的人行诡诈；诡诈的人以诡诈行诡诈
  rationale: 反复使用“诡诈”以再现בגד词根及名词בֶּגֶד的密集重复。中文略显沉重的措辞是有意保留原文的修辞力度，而不简化为“极其奸诈”。
theological_decisions:
- issue: לַצַּדִּיק所指的是谁
  choice: 义者
  alternative: 义人（集合意义）
  rationale: 原文为带定冠词的单数形式，却没有明确说明所指身份。“义者”保留单数形式，也不把它直接认定为某一特定人物；脚注保留集合性理解。
- issue: רָזִי לִי的含义
  choice: 我消瘦了
  alternative: 我的秘密只归我／这奥秘使我困惑
  rationale: 上下文紧接“我有祸了”和背信者的诡诈，传统的衰瘦、耗损理解较契合哀叹；但原词确实艰难，另一词源分析可能与“秘密”有关，因此不将歧义隐藏。
translation_notes:
  register: 采用现代、庄重、可朗读的书面汉语。诗行保留从普世歌声骤转为个人哀叹的结构，并有意保留末句密集重复所造成的沉重感。所有脚注标记均置于对应词句之后。
