  text: נ֣וֹעַ תָּנ֤וּעַ אֶ֨רֶץ֙ כַּ/שִּׁכּ֔וֹר וְ/הִֽתְנוֹדְדָ֖ה כַּ/מְּלוּנָ֑ה וְ/כָבַ֤ד עָלֶ֨י/הָ֙ פִּשְׁעָ֔/הּ וְ/נָפְלָ֖ה וְ/לֹא תֹסִ֥יף קֽוּם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/020.yaml
  text: The earth will stagger like a drunkard[a], and sway back and forth like a hut; its transgression lies heavy upon it, and it will fall and not rise again.
translation:
  language: zh_hans
  text: 大地必东倒西歪，像醉汉；又来回摇晃，像临时搭的棚子[a]。它的悖逆重重压在它身上；它必倒下，再也不起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“像看守人的棚子”。希伯来语所用的词指简陋、临时搭建的住处或遮蔽处。
    reason: 词义可包含一般临时棚子或看守人所住的棚子；正文采用较宽泛的译法，脚注保留较具体的可能含义。
lexical_decisions:
- source_word: נ֣וֹעַ תָּנ֤וּעַ
  choice: 必东倒西歪
  rationale: 不定式绝对式与未完成式连用，加强“摇动、蹒跚”的语气。“东倒西歪”以自然汉语传达这种强烈而不稳的动作，并与下文醉汉的比喻贴合。
- source_word: אֶ֨רֶץ֙
  choice: 大地
  rationale: 以赛亚书24章的审判具有普世范围；“大地”比局部性的“这地”更符合上下文，同时保留该词在希伯来语中的宏观含义。
- source_word: כַּ/שִּׁכּ֔וֹר
  choice: 像醉汉
  rationale: 该词指喝醉的人；“醉汉”简洁、自然，不额外限定身份。
- source_word: וְ/הִֽתְנוֹדְדָ֖ה
  choice: 又来回摇晃
  rationale: 该词形表达反复、不稳定的晃动。“来回摇晃”既与前句呼应，又保留第二个动词所描绘的持续摆动。
- source_word: כַּ/מְּלוּנָ֑ה
  choice: 像临时搭的棚子
  rationale: מְלוּנָה 指供人暂住或看守用的简陋棚子，重点在临时、单薄和不稳。“临时搭的棚子”比单说“棚子”更清楚地传达这一形象；具体可能是看守人的棚子，留在脚注说明。
- source_word: וְ/כָבַ֤ד עָלֶ֨י/הָ֙
  choice: 重重压在它身上
  rationale: כבד 在此表达沉重负担；“重重压在”保留重量隐喻，并以叠词自然体现沉重感。
- source_word: פִּשְׁעָ֔/הּ
  choice: 它的悖逆
  rationale: פשע 可指过犯，也突出反叛性质。“悖逆”保留其道德与关系层面的严重性，而不把含义缩窄为一般错误。
- source_word: וְ/נָפְלָ֖ה
  choice: 它必倒下
  rationale: 在这一先知性审判序列中，完成式表达确定将临的结果；“必倒下”兼顾将来意义与确定语气。
- source_word: וְ/לֹא תֹסִ֥יף קֽוּם
  choice: 再也不能起来
  rationale: יסף 加不定式在此表示“不再做某事”。“再也不能起来”是清楚自然的汉语，也保留倒下后不再复起的终局性。
theological_decisions:
- issue: אֶרֶץ 在末世性审判语境中的范围
  choice: 大地
  alternative: 这地／土地
  rationale: 本章描绘广及全地的毁坏。“大地”较能反映上下文的普世视野，但不进一步规定具体的末世体系。
- issue: פִּשְׁעָהּ 所指的罪责性质
  choice: 它的悖逆
  alternative: 它的罪过／它的过犯
  rationale: “悖逆”保留 פשע 的反叛色彩以及大地因其上居民犯罪而承受审判的张力，不把经文解释为大地本身具有独立道德人格。
translation_notes:
  register: 采用现代、庄重而具画面感的普通话。“东倒西歪”“来回摇晃”再现两个相近却不完全相同的动作；分号和短句保持希伯来诗句的推进与审判语气。脚注标记[a]已置于对应词语之后。
