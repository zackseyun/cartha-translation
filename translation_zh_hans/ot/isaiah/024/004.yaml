  text: אָבְלָ֤ה נָֽבְלָה֙ הָ/אָ֔רֶץ אֻמְלְלָ֥ה נָבְלָ֖ה תֵּבֵ֑ל אֻמְלָ֖לוּ מְר֥וֹם עַם הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/004.yaml
  text: The earth mourns and withers[a]; the world wastes away and withers; the exalted people of the earth waste away.
translation:
  language: zh_hans
  text: 大地哀恸，凋残；世界衰败，凋残；地上居高位的人衰败。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“地上的权贵衰败。”希伯来语直译为“地上百姓的高处”，也可指“地上百姓的高位”或“尊荣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבְלָה
  choice: 悲哀
  rationale: 该词通常表示哀恸、悲伤；这里把大地拟人化，表达审判之下的哀伤，不仅是物质上的干枯。
- source_word: נָבְלָה
  choice: 衰残／凋残
  rationale: 词义是衰萎、凋谢。按不同搭配分别译作“衰残”和“凋残”，使现代汉语自然，同时保留原文重复所形成的衰败意象。
- source_word: הָאָרֶץ
  choice: 大地／地上
  rationale: 与“世界”（תֵּבֵל）平行，语境具有普世范围，因此首处译“大地”；在末句所属结构中自然译作“地上”。
- source_word: אֻמְלְלָה / אֻמְלָלוּ
  choice: 衰败
  rationale: 该词表示变得衰弱、萎靡或枯竭。“衰败”既适用于世界，也适用于人，并与 נבל 的凋残意象有所区别。
- source_word: תֵּבֵל
  choice: 世界
  rationale: 通常指有人居住、秩序化的世界；“世界”与“大地”构成自然而庄重的诗歌平行。
- source_word: מְרוֹם עַם הָאָרֶץ
  choice: 地上尊贵的人
  rationale: מְרוֹם 本义为“高处、高位、崇高”，此处很可能指百姓中居高位或受尊崇的人。“尊贵的人”保留社会地位意味，但不限定为某一具体阶层。
theological_decisions:
- issue: הָאָרֶץ 与 תֵּבֵל 所指审判的范围
  choice: 采用普世范围，译作“大地／世界”
  alternative: 将 הָאָרֶץ 译作局部的“这地”或“国土”
  rationale: 两词在诗句中并列，且以广泛、普世的语言描述衰败；译为“大地／世界”更符合本节的诗意和上下文，又不引入后来的神学体系。
- issue: מְרוֹם עַם הָאָרֶץ 的语法与所指
  choice: 理解为地上受尊崇、居高位的人
  alternative: 更字面地理解为“地上百姓的高处／尊荣”
  rationale: 单数抽象名词“高位／尊荣”可集体指身居高位者；正文采用自然汉语表达，并用脚注保留原文的字面含混。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；以分号呈现三重平行结构。正文保留“悲哀”的拟人色彩，并以“衰残／衰败／凋残”呈现原文相关但不完全相同的衰萎词汇。
