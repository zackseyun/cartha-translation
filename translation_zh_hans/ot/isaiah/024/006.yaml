id: ISA.24.6
reference: Isaiah 24:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל כֵּ֗ן אָלָה֙ אָ֣כְלָה אֶ֔רֶץ וַֽ/יֶּאְשְׁמ֖וּ יֹ֣שְׁבֵי בָ֑/הּ עַל כֵּ֗ן חָרוּ֙ יֹ֣שְׁבֵי אֶ֔רֶץ וְ/נִשְׁאַ֥ר אֱנ֖וֹשׁ מִזְעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/006.yaml
  text: Therefore a curse has devoured the earth[a], and those who dwell in it bear their guilt; therefore the inhabitants of the earth are scorched[c][b], and few men are left.
translation:
  language: zh_hans
  text: 因此，咒诅吞噬了大地[a]，住在地上的人担当自己的罪责；因此，大地的居民被烧灼，只剩下寥寥几人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “咒诅”也可译作“誓言”；这里承接上一节所说的违约，因此译作“咒诅”。“大地”也可译作“土地”或“国土”。
    reason: 保留 אָלָה 与 אֶרֶץ 的真实词义范围，同时说明正文选择所依据的上下文。
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接上一节对人违背律法、毁约的指控，明确表达随之而来的结果。
- source_word: אָלָה
  choice: 咒诅
  rationale: 该词可指“誓言”或“咒诅”；在违约及审判的语境中，“咒诅”最能体现司法性的后果，同时以脚注保留另一词义。
- source_word: אָכְלָה
  choice: 吞噬了
  rationale: 保留 אכל“吃、吞吃”的鲜明比喻，比一般的“毁坏”更贴近原文。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 本章具有普世性的审判视野，“大地”比局部性的“土地”更合适，并保留该词可能指“地、国土”的脚注说明。
- source_word: וַיֶּאְשְׁמוּ
  choice: 担当自己的罪责
  rationale: אשם 可兼有有罪与承担罪责后果的意味；此译法保留罪咎和刑罚含义之间的张力。
- source_word: יֹשְׁבֵי בָהּ
  choice: 住在地上的人
  rationale: 自然表达分词结构所指持续居住于其上的人。
- source_word: חָרוּ
  choice: 被烧灼
  rationale: 表达 חרר 在此处被烧焦、灼烧的审判图景，又不将其强化为彻底焚毁。
- source_word: יֹשְׁבֵי אֶרֶץ
  choice: 大地的居民
  rationale: 简洁、庄重地表达原文的属格结构，并与前句避免机械重复。
- source_word: וְנִשְׁאַר
  choice: 只剩下
  rationale: 准确传达 שׁאר 的被留下、成为余剩者之义。
- source_word: אֱנוֹשׁ
  choice: 人
  rationale: 该单数名词在此作集合用法，指必死的人类；现代汉语用“人”既自然又不误限于男性。
- source_word: מִזְעָר
  choice: 寥寥几人
  rationale: 自然传达数量极少之意，并与集合名词 אֱנוֹשׁ 配合。
theological_decisions:
- issue: אָלָה 在审判语境中的含义
  choice: 咒诅
  alternative: 誓言；带咒诅的誓言
  rationale: 上一节提到违背永约，本节因而最自然地指违约所招致的咒诅；脚注保留“誓言”的词义可能。
- issue: אֶרֶץ 的范围
  choice: 大地
  alternative: 土地；国土
  rationale: 以赛亚书24章的修辞范围广及全地，“大地”较能呈现普世视野，但不否认该希伯来词本身也可有地域性含义。
- issue: וַיֶּאְשְׁמוּ 的罪责与刑罚张力
  choice: 担当自己的罪责
  alternative: 被定为有罪；受到惩罚
  rationale: 不把该动词单方面限定为法律判罪或刑罚结果，而同时保留居民确有罪责并承受其后果的意味。
- issue: אֱנוֹשׁ 的集合性所指
  choice: 人
  alternative: 人类；世人
  rationale: 原文以阳性单数集合名词指必死的人类，并非专指男性；“人”在现代汉语中准确、自然。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“吞噬了大地”保留先知性意象；“担当自己的罪责”保留罪咎与后果之间的神学张力；末句用“寥寥几人”自然表达原文极少数人余留的意思。
