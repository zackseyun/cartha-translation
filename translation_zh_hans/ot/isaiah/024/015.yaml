  text: עַל כֵּ֥ן בָּ/אֻרִ֖ים כַּבְּד֣וּ יְהוָ֑ה בְּ/אִיֵּ֣י הַ/יָּ֔ם שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/015.yaml
  text: Therefore in the east give glory to Yahweh; in the coastlands of the sea[a], to the name of Yahweh, the God of Israel.
translation:
  language: zh_hans
  text: 因此，你们要在东方荣耀耶和华；在海岛各地，要荣耀耶和华——以色列的上帝——的名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 自然表达承接上文的推论关系。
- source_word: בָּאֻרִים
  choice: 在东方
  rationale: 原词含义有争议；与下句海上众岛的地理平行关系支持“东方”这一理解，同时在脚注保留其他可能。
- source_word: כַּבְּדוּ
  choice: 荣耀
  rationale: 复数命令式，表示把荣耀归给上帝；中文用“荣耀”作及物动词，简洁而庄重。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式译出四字神名，不以称号替代。
- source_word: בְּאִיֵּי הַיָּם
  choice: 在海的众海岛上
  rationale: אִיִּים可指岛屿或沿海地区；此译保留海洋地理意象及复数范围。
- source_word: שֵׁם יְהוָה
  choice: 耶和华……的名
  rationale: 保留希伯来文对上帝启示之名的明确强调。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列上帝
  rationale: 准确表达构造关系，指明耶和华是以色列的上帝。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是中文中的专名表达；正文采用普通现代中文读者更熟悉且庄重的“耶和华”，避免用“主”这一称号取代原文专名。
- issue: בָּאֻרִים 的解释
  choice: 地理意义“在东方”
  alternative: “在光明之地”或“在火中”
  rationale: 该词词义确有困难。与“在海的众海岛上”的平行结构倾向于地理解释，但脚注保留其他词义，不把原文歧义悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。用“你们”显明复数命令对象；后半句补出“要荣耀”，使中文平行结构清楚。主文保留希伯来诗句的地理对举，破折号标明“以色列上帝”是对耶和华的进一步说明。
