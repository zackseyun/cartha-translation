  text: הִנֵּ֧ה יְהוָ֛ה בּוֹקֵ֥ק הָ/אָ֖רֶץ וּ/בֽוֹלְקָ֑/הּ וְ/עִוָּ֣ה פָנֶ֔י/הָ וְ/הֵפִ֖יץ יֹשְׁבֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/001.yaml
  text: Behold[a], Yahweh is emptying the earth and laying it waste[b]; he will distort its surface and scatter its inhabitants.
translation:
  language: zh_hans
  text: 看哪[a]，雅威正使大地空虚，使它荒凉；他使地面[b]变形，驱散其上的居民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”；希伯来语 אֶרֶץ 可指“大地”或“土地”，但这里较广阔的上下文更支持普世意义。
    reason: lexical_alternative
  - marker: b
    text: “地面”直译为“它的脸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为先知宣告的引介语，唤起郑重注意；“看哪”保留了原文的指示性和庄严语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为专名的性质，不以称号代替。
- source_word: בּוֹקֵק
  choice: 正使……空虚
  rationale: 分词表达正在发生或迫近的行动；“使……空虚”保留其掏空、使空荡的核心意象。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ既可指某片土地，也可指全地；本章较广阔的审判语境支持“大地”，同时在脚注保留另一可能。
- source_word: וּבֹלְקָהּ
  choice: 使它荒凉
  rationale: 罕见动词与בּוֹקֵק形成音韵和意义上的加强；汉语难以复制双关，故以平行短语表达彻底荒废的结果。
- source_word: וְעִוָּה
  choice: 使……变形
  rationale: 该动词有扭曲、弄弯之意；“变形”保持具体而强烈的图像，又不把含义过度确定为“倾覆”。
- source_word: פָנֶיהָ
  choice: 地面
  rationale: 字面为“它的脸”，用于大地时自然指其表面；“地面”符合现代汉语表达。
- source_word: וְהֵפִיץ
  choice: 驱散
  rationale: 准确表达把人群分散开来的审判行动，语气鲜明自然。
- source_word: יֹשְׁבֶיהָ
  choice: 其上的居民
  rationale: 原文为居住在其中的人；“其上的居民”与“大地”搭配自然，并保留集合意义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，避免以称号“主”代替。
- issue: הָאָרֶץ的范围
  choice: 大地
  alternative: 这地；土地
  rationale: 该词本身有歧义，但以赛亚书24章的广阔语境较支持普世范围；脚注明确保留地域性读法。
- issue: וְעִוָּה פָנֶיהָ的意象
  choice: 使地面变形
  alternative: 扭曲它的脸；使地面倾覆
  rationale: 原文的“脸”与“扭曲”形成具体意象；译文以自然汉语表达，但不将其解释性收窄为完全毁灭或倾覆。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。以“看哪”保留先知宣告的郑重感；两个前置分句用平行结构体现原文的强化效果。所有脚注标记均置于正文相关词语之后。
