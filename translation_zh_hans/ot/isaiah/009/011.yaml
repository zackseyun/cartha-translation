  text: אֲרָ֣ם מִ/קֶּ֗דֶם וּ/פְלִשְׁתִּים֙ מֵֽ/אָח֔וֹר וַ/יֹּאכְל֥וּ אֶת יִשְׂרָאֵ֖ל בְּ/כָל פֶּ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/011.yaml
  text: Aram from the east and the Philistines from the west devoured Israel with full mouth[a]. For all this, his anger has not turned away[b], and his hand is still stretched out.
translation:
  language: zh_hans
  text: 东边的亚兰人和西边的非利士人[b]大口[a]吞吃以色列。尽管如此，他的怒气仍未转消；他的手仍然伸着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“用全口”；此处可指张开大口、贪婪地或彻底地吞吃。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“从后面”；这里与“东边”相对，很可能是指西边。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: 亚兰人
  rationale: 采用希伯来 ethnogeographic 名称的通行音译，并按语境指称亚兰这一敌对群体；不以后来的地名“叙利亚”替代。
- source_word: מִקֶּדֶם
  choice: 东边
  rationale: קֶדֶם 可指“前面”或“东方”；与 מֵאָחוֹר 构成方位对举时，宜译为东方。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用该族群名称的现代中文通行译法。
- source_word: מֵאָחוֹר
  choice: 西边
  rationale: 字面为“后面”；与“东边”对举时，按古代以东方为前方的方位观，语境所指很可能是西方，并用脚注保留字面义。
- source_word: וַיֹּאכְלוּ
  choice: 吞吃
  rationale: 动词字面为“吃”，此处比喻敌人猛烈侵吞以色列；“吞吃”既保留意象，也符合现代汉语。
- source_word: בְּכָל פֶּה
  choice: 大口
  rationale: 希伯来语字面近于“用整个口”，表达贪婪、彻底地吞吃；“大口吞吃”在中文中自然，并保留口食意象。
- source_word: בְּכָל זֹאת
  choice: 尽管如此
  rationale: 这一反复出现的句式表明，先前的惩罚并未使上帝的怒气止息；“尽管如此”清楚传达让步关系。
- source_word: לֹא שָׁב אַפּוֹ
  choice: 他的怒气仍未转消
  rationale: אַף 字面为“鼻子”，在此为“怒气”；שׁוב 表示转回、退去。“转消”保留怒气尚未撤回或平息的动态意味。
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: 他的手依然伸出
  rationale: 贴近希伯来语的持续状态表达，并保留先知书中上帝继续施行审判的鲜明意象，不在正文中将其解释性扩写。
theological_decisions:
- issue: 反复句中代词“他”的所指
  choice: 保留“他”，由上下文指向上帝
  alternative: 直接译为“耶和华的怒气……耶和华的手……”
  rationale: 上下文表明施行持续审判的是耶和华，但希伯来文使用第三人称附属代词；保留代词既忠于形式，也避免在本节中作解释性增补。
- issue: 伸出的手所表达的行动
  choice: 保留审判意象，不明说“继续击打”
  alternative: 解释为“他仍伸手惩罚他们”
  rationale: 语境确与持续审判有关，但原文仅呈现“手依然伸出”的意象；直译可保留其诗性以及可能的修辞张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。用“东边有……西边有……”呈现希伯来文简短的并列结构；“大口吞吃”保留原文的进食隐喻，同时避免生硬的“用整个口”。脚注标记按其实际所释词语放置：方位脚注置于“西边”之后，惯用语脚注置于“吞吃以色列”之后。
