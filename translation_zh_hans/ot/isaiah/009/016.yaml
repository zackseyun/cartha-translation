reference: Isaiah 9:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל כֵּ֨ן עַל בַּחוּרָ֜י/ו לֹֽא יִשְׂמַ֣ח אֲדֹנָ֗/י וְ/אֶת יְתֹמָ֤י/ו וְ/אֶת אַלְמְנֹתָי/ו֙ לֹ֣א יְרַחֵ֔ם כִּ֤י כֻלּ/וֹ֙ חָנֵ֣ף וּ/מֵרַ֔ע וְ/כָל פֶּ֖ה דֹּבֵ֣ר נְבָלָ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/016.yaml
  text: Therefore the Lord does not rejoice over their young men[a], and he does not have compassion on their fatherless and their widows; for every one of them is godless and an evildoer, and every mouth speaks folly. For all this his anger has not turned away[b], and his hand is still stretched out.
translation:
  language: zh_hans
  text: 因此，主不以他们的青年人为乐[a]，也不怜悯他们的孤儿和寡妇；因为他们个个都不敬虔、作恶，人人口中都说荒唐话[b]。尽管如此，他的怒气仍未转消；他的手依然伸着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他的青年人……他的孤儿……他的寡妇”；这里的单数“他”以整体方式指百姓，正文按现代汉语译为“他们的”。
    reason: lexical_alternative
  - marker: b
    text: “荒唐话”也可译为“可耻的愚妄话”或“败坏的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接上文的指控并引出其后果，保留原文的推论关系。
- source_word: בַּחוּרָיו
  choice: 他们的青年人
  rationale: בָּחוּר在此指年富力强的青年男子；第三人称阳性单数后缀所指的是作为整体的百姓，故按现代汉语用复数“他们的”。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是以色列上帝的称号；译作“主”自然、庄重，也不误导为普通的第一人称领属关系。
- source_word: יְתֹמָיו וְאֶת אַלְמְנֹתָיו
  choice: 他们的孤儿和寡妇
  rationale: יָתוֹם指失去父亲、缺乏社会保障的孩子，汉语“孤儿”简洁地涵盖这一弱势身份；领属后缀依其集体所指译为“他们的”。
- source_word: לֹא יְרַחֵם
  choice: 不怜悯
  rationale: 保留רִחַם所表达的慈怜与同情，也符合现代庄重汉语。
- source_word: כֻלּוֹ
  choice: 他们个个都
  rationale: 将单数集合表达的全体性自然展开，突出无人例外。
- source_word: חָנֵף
  choice: 不敬虔
  rationale: 在先知语境中主要指对上帝不虔不敬，而不仅是待人虚伪。
- source_word: מֵרַע
  choice: 作恶
  rationale: 该形式描写持续或特征性的恶行；汉语动词“作恶”比抽象的“邪恶”更能表现行动含义。
- source_word: כָל פֶּה דֹּבֵר נְבָלָה
  choice: 人人口中都说荒唐话
  rationale: 保留“口说”的具体意象，并用“荒唐话”表达נְבָלָה兼有愚妄、可耻和败坏的语义范围。
- source_word: בְּכָל זֹאת
  choice: 虽有这一切
  rationale: 保留以赛亚书反复出现的承接语，表示此前的一切仍未使上帝的怒气止息。
- source_word: לֹא שָׁב אַפּוֹ
  choice: 他的怒气仍未转消
  rationale: אַף在此是“怒气”，שׁוּב表示转回或消退；“未转消”兼顾原文方向性与汉语可读性。
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: 他的手依然伸着
  rationale: 直译审判语境中的形象，不在正文中额外解释其动作目的。
theological_decisions:
- issue: 神圣称号אֲדֹנָי的译法
  choice: 主
  alternative: 我的主
  rationale: 该形式在先知书中已作为上帝的固定称号使用；译为“主”能准确指向上帝，又避免加入原句并不着重的第一人称领属意味。
- issue: “青年人、孤儿、寡妇”领属后缀的处理
  choice: 他们的青年人……他们的孤儿和寡妇
  alternative: 他的青年人……他的孤儿和寡妇
  rationale: 希伯来语后缀在形式上是第三人称阳性单数，但所指是被视为一个整体的百姓；现代汉语用复数“他们的”较自然，也避免让读者误以为这些人属于某个男性个人。
- issue: “伸着的手”是否解释为审判
  choice: 保留“他的手依然伸着”的意象
  alternative: 他的手仍伸出来施行审判
  rationale: 上下文暗示这是持续的审判，但原句本身保留了形象性；不在正文补入“施行审判”，可避免把隐含意义写成明说。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语；保留先知诗句的排比、全称指控和末尾审判意象。脚注标记紧随各自所说明的词句，避免误置。
