  text: הָ/עָם֙ הַ/הֹלְכִ֣ים בַּ/חֹ֔שֶׁךְ רָא֖וּ א֣וֹר גָּד֑וֹל יֹשְׁבֵי֙ בְּ/אֶ֣רֶץ צַלְמָ֔וֶת א֖וֹר נָגַ֥הּ עֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/001.yaml
  text: The people walking in darkness have seen a great light; on those dwelling in a land of deep darkness[a], light has shone.
translation:
  language: zh_hans
  text: 行在黑暗中的百姓看见了大光；住在幽暗[a]之地的人，有光照耀他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幽暗”或译“死荫”。希伯来语 צַלְמָוֶת 传统上常译作“死荫”，也可泛指极深的黑暗或阴郁。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: 百姓
  rationale: 此处是单数集合名词，指一群人民；“百姓”在现代汉语中自然、庄重，也保留群体含义。
- source_word: הַהֹלְכִים
  choice: 行在
  rationale: 分词表达持续的处境或生活状态；“行在”保留希伯来文“行走”的意象，又符合经文语体。
- source_word: בַּחֹשֶׁךְ
  choice: 黑暗中
  rationale: 既可指实际黑暗，也可作隐喻；直译能保留这种双重含义。
- source_word: רָאוּ
  choice: 看见了
  rationale: 完成式表示已经发生的行动；汉语以“了”自然表达其完成性，不额外判定其具体时间或预言表达方式。
- source_word: אוֹר גָּדוֹל
  choice: 大光
  rationale: 直接保留原文名词与形容词的简洁搭配，并与下半句“光”形成重复。
- source_word: יֹשְׁבֵי
  choice: 住在……的人
  rationale: 保留分词所表达的持续居住状态，同时使现代汉语句法自然清楚。
- source_word: בְּאֶרֶץ
  choice: 在……之地
  rationale: “之地”适合与表示性质的“幽暗”结合，既庄重又不将其过度具体化为某一国家。
- source_word: צַלְמָוֶת
  choice: 幽暗
  rationale: 该词可表示极深的黑暗或阴沉，也传统上译作“死荫”；正文用“幽暗”保留强烈黑暗感而不直接加入“死亡”，传统理解列入脚注。
- source_word: אוֹר
  choice: 光
  rationale: 直接翻译，并保留原文对“光”的重复，以维持诗歌呼应。
- source_word: נָגַהּ
  choice: 照耀
  rationale: 该动词表示发光、照亮；“照耀”直接而自然，并与介词“他们”顺畅搭配。
- source_word: עֲלֵיהֶם
  choice: 他们
  rationale: 在“有光照耀他们”中自然表达光临到他们身上的含义；汉语无需机械译出“在……之上”。
theological_decisions:
- issue: צַלְמָוֶת 在具有弥赛亚意义的预言语境中的译法
  choice: 幽暗
  alternative: 死荫
  rationale: 该词在此很可能泛指极深的黑暗或阴郁，不一定明确指死亡。正文采用“幽暗”以反映较可能的语义，同时用脚注保留历史悠久且具有神学影响的“死荫”译法，不消除原词的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语；保留“黑暗—大光—光”的诗歌对照与“行在”的动态意象。脚注标记置于整节末尾，所注对象为“幽暗”。
