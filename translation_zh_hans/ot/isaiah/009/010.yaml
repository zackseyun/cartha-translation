source:
  edition: WLC
  text: וַ/יְשַׂגֵּ֧ב יְהוָ֛ה אֶת צָרֵ֥י רְצִ֖ין עָלָ֑י/ו וְ/אֶת אֹיְבָ֖י/ו יְסַכְסֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/010.yaml
  text: And Yahweh raised up the adversaries of Rezin against him[a], and stirred up his enemies[b],
translation:
  language: zh_hans
  text: 雅威使利汛的敌手得势，来攻击他[a]；又煽动他的仇敌[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……得势”也可译作“高举”或“使强盛”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文保留单数代词（“攻击他……他的仇敌”）；从上下文看，所指的是北国（以法莲）。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: 高举
  rationale: שׂגב 的使役形可表示使之高升、强盛或得势；这里以敌对者为宾语。“高举”保留原词的空间性和使役色彩，脚注说明在本语境中也可理解为“使强盛”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: צָרֵי רְצִין
  choice: 利汛的敌手
  rationale: 准确表达构造词组“利汛的敌对者”，并与后面的“仇敌”适度区分，避免机械重复。
- source_word: עָלָיו
  choice: 来攻击他
  rationale: עַל 在敌对行动语境中表示“针对、攻击”；保留第三人称阳性单数“他”，不在正文中替换为以法莲或北国。
- source_word: אֹיְבָיו
  choice: 他的仇敌
  rationale: 直接保留名词及第三人称阳性单数后缀，与前面的“敌手”形成自然而忠实的对应。
- source_word: יְסַכְסֵךְ
  choice: 煽动
  rationale: סכסך 表示挑动、激起敌对冲突；“煽动”简洁地传达使仇敌行动起来的使役含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留其作为专名的性质，而不以“主”这一称号代替。
- issue: “攻击他”及“他的仇敌”中单数代词的所指
  choice: 保留“他／他的”，正文不明确指名
  alternative: 以色列；以法莲；北国
  rationale: 希伯来文两处均为第三人称阳性单数后缀。上下文虽指向北国／以法莲，正文仍保留原文的指称张力，不擅自补明。
- issue: 上帝兴起敌对势力施行审判的表达
  choice: 按原文明确保留雅威为两个动词的施事者
  alternative: 弱化为敌人自行兴起或被动出现
  rationale: 原文明确以雅威为“高举”和“煽动”的主语；忠实呈现这一神学张力，不将其淡化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“高举”贴近原词但略具古典色彩，已用脚注交代语境义；“煽动”自然传达挑起敌对行动。句末用分号，以适应本节与后续经文相连的结构。
