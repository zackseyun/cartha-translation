id: ISA.9.5
reference: Isaiah 9:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי יֶ֣לֶד יֻלַּד לָ֗/נוּ בֵּ֚ן נִתַּן לָ֔/נוּ וַ/תְּהִ֥י הַ/מִּשְׂרָ֖ה עַל שִׁכְמ֑/וֹ וַ/יִּקְרָ֨א שְׁמ֜/וֹ פֶּ֠לֶא יוֹעֵץ֙ אֵ֣ל גִּבּ֔וֹר אֲבִי עַ֖ד שַׂר שָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/005.yaml
  text: For a child has been born to us[a], a son has been given to us, and the rule is on his shoulder; and his name is called Wonderful Counselor, Mighty God, Father of Eternity[b], Prince of Peace.
translation:
  language: zh_hans
  text: 因为有一个孩子为我们而生[a]，有一个儿子赐给我们；政权在他的肩上；他的名被称为“奇妙的谋士、大能的神、永恒之父[b]、和平之君”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按预言语境译：“因为有一个孩子要为我们而生，有一个儿子要赐给我们；政权必在他的肩上；他的名必称为……”
    reason: 保留希伯来语完成式在预言语境中可理解为确定将来的另一种译法。
  - marker: b
    text: “永恒之父”按希伯来语构词也可译为“永恒的父”或“永在的父”。
    reason: 说明 אֲבִי עַד 的构词关系，并保留常见译法之间的词义张力。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前宣告的盼望说明根据，保留因果和解释作用。
- source_word: יֶלֶד
  choice: 孩子
  rationale: 准确表达一般意义上的幼儿，现代汉语自然，也不把词义缩窄为特定年龄的男孩。
- source_word: יֻלַּד לָנוּ
  choice: 为我们而生
  rationale: 保留被动出生和“为我们”的受益意味；汉语不强加原文未明说的施事者。
- source_word: בֵּן נִתַּן לָנוּ
  choice: 有一个儿子赐给我们
  rationale: “儿子”保留原文的男性所指，“赐给”传达被给予、作为礼物临到的意义，同时不明说赐予者。
- source_word: הַמִּשְׂרָה
  choice: 政权
  rationale: 指统治权柄或王权；“政权”简洁地表达治理权，而非仅指现代政府机构。
- source_word: וַתְּהִי ... עַל שִׁכְמוֹ
  choice: 落在他的肩上
  rationale: 保留王权由他肩负的具体意象，并用自然的结果性汉语表达该权柄归于他；不在正文中将时态限定为纯粹过去或将来。
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: 他的名叫作
  rationale: 以自然汉语表达希伯来语命名公式，同时避免替原文不明确的单数主语指定为某一人物。
- source_word: פֶּלֶא יוֹעֵץ
  choice: 奇妙的谋士
  rationale: 将两词理解为一个王室尊号，兼顾非凡、奇妙与谋划、劝导的含义。
- source_word: אֵל גִּבּוֹר
  choice: 大能的神
  rationale: 直接保留该短语强烈的神性含义；“大能”对应 גִּבּוֹר，也避免用“全能”引入原词未明确表达的绝对性。
- source_word: אֲבִי עַד
  choice: 永恒之父
  rationale: 反映“父”与“永恒／久远”的构词关系，既可表达永恒的父，也保留“永恒之父”的字面张力。
- source_word: שַׂר שָׁלוֹם
  choice: 和平之君
  rationale: 准确而庄重地表达带来并治理 שָׁלוֹם 的王室尊号；“和平”在正文中保留原词丰富含义而不作展开性释义。
theological_decisions:
- issue: 一连串王室尊号的归属及其神性力度
  choice: 把“奇妙的谋士、大能的神、永恒之父、和平之君”作为孩子所得的名号。
  alternative: 把部分称号解释为指向给孩子命名的神，或把 אֵל גִּבּוֹר 弱化为“神圣英雄”“大能者”。
  rationale: 命名公式后的句法最自然地把整组称号归给这个孩子。译文既不削弱“大能的神”的神性力度，也不额外加入原文没有明说的基督论解释。
- issue: 预言语境中动词的时间指向
  choice: 正文采用“为我们而生”“赐给我们”“落在他的肩上”“叫作”等不刻意标明绝对时态的汉语表达。
  alternative: 全译为明确的过去完成事件，或全译为“要／必／将”的未来事件。
  rationale: 希伯来语形式具有完成性，而预言宣告的语境也容许面向将来的理解。汉语正文保留这种张力，并在脚注列出传统的未来式译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文保留“肩上”的王权意象，并以四个结构协调的尊号形成宣告性的节奏；避免过度古雅，也避免现代政治术语压倒王室语境。
