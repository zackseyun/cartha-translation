  text: זָקֵ֥ן וּ/נְשׂוּא פָנִ֖ים ה֣וּא הָ/רֹ֑אשׁ וְ/נָבִ֥יא מֽוֹרֶה שֶּׁ֖קֶר ה֥וּא הַ/זָּנָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/014.yaml
  text: The elder and the honored man is the head[b][a], and the prophet who teaches falsehood is the tail.
translation:
  language: zh_hans
  text: 长老和受尊重的人就是头[a]；教导虚假之事的先知就是尾巴[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受尊重的人”或译“地位显赫的人”；希伯来语直译为“脸被抬起的人”。
    reason: lexical_alternative
  - marker: b
    text: “教导虚假之事的”或译“教导谎言的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: 长老
  rationale: 该词既可指年长者，也可指群体中的长老；本节语境涉及社会领袖，以“长老”既自然又保留其身份含义。
- source_word: וּנְשׂוּא פָנִים
  choice: 和受尊重的人
  rationale: 此习语字面为“脸被抬起的人”，表示受到尊崇或地位显要者；“受尊重的人”准确传达其社会声望而不拘泥于字面。
- source_word: הוּא הָרֹאשׁ
  choice: 就是头
  rationale: 保留原文“头”的身体隐喻，并用“就是”呈现 הוּא 的辨识、说明作用。
- source_word: וְנָבִיא
  choice: 先知
  rationale: 与后面的分词短语共同构成特指性描述，指那教导虚假的先知这一代表性人物。
- source_word: מוֹרֶה שֶּׁקֶר
  choice: 教导虚假的
  rationale: 分词表达持续或特征性的行为；שֶׁקֶר 可指虚假、谎言，“教导虚假的”保留对象表述的概括性。
- source_word: הוּא הַזָּנָב
  choice: 就是尾巴
  rationale: 直接保留与“头”相对的“尾巴”隐喻，不加解释性扩写。
theological_decisions:
- issue: 将社会领袖和宗教领袖分别称为“头”和“尾巴”的隐喻
  choice: 直接译出“头”和“尾巴”，不作解释性展开。
  alternative: 把“头”解释为领袖，把“尾巴”解释为卑下者或随从。
  rationale: 原文刻意采用具体的身体部位意象，且上下文会进一步说明；保留隐喻可维持先知话语的修辞张力，避免把翻译变成注释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“长老”“头”“尾巴”保留原文简洁有力的身份称谓和身体隐喻；两个脚注分别说明希伯来语习语及 שֶׁקֶר 的可选译法。
