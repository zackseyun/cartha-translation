source:
  edition: WLC
  text: וַ/יַּכְרֵ֨ת יְהוָ֜ה מִ/יִּשְׂרָאֵ֗ל רֹ֧אשׁ וְ/זָנָ֛ב כִּפָּ֥ה וְ/אַגְמ֖וֹן י֥וֹם אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/013.yaml
  text: So Yahweh cut off from Israel head and tail[a], palm branch and reed[b], in one day.
translation:
  language: zh_hans
  text: 耶和华在一日之内从以色列中剪除头与尾[a]、棕榈枝与芦苇[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指整个民族中从尊高者到卑微者的各等人；下一节解释了这个比喻。
    reason: cross_reference
  - marker: b
    text: “芦苇”或译“灯心草”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְרֵת
  choice: 剪除
  rationale: 使役形在审判语境中表示果断地除去；“剪除”既保留切断的具体意象，也自然表达消灭、清除之意。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，不以“主”这一称号代替。
- source_word: מִיִּשְׂרָאֵל
  choice: 从以色列中
  rationale: 介词 מן 表示从一个群体内部加以分离、除去；“从以色列中”准确而自然。
- source_word: רֹאשׁ וְזָנָב
  choice: 头与尾
  rationale: 保留原文具体的身体意象，不提前把下一节所给的解释译入本节。
- source_word: כִּפָּה
  choice: 棕榈枝
  rationale: 该词指棕榈树的梢或枝，与低处的沼泽植物构成对照；“棕榈枝”清楚且保留意象。
- source_word: וְאַגְמוֹן
  choice: 芦苇
  rationale: 该词指生长在湿地的草本植物；“芦苇”是自然、易懂的现代汉语表达，并与高举的棕榈枝形成对照。
- source_word: יוֹם אֶחָד
  choice: 在一日之内
  rationale: 自然表达审判在一天内突然、彻底临到的时间含义，同时不增加原文未明说的解释。
theological_decisions:
- issue: 保留比喻还是直接译出其所指
  choice: 正文保留“头与尾、棕榈枝与芦苇”
  alternative: 译作“领袖和百姓、尊贵的和卑微的”等解释性表达
  rationale: 原文刻意采用成对的具体意象，且下一节才加以解释。正文保留比喻，可避免提前限定其含义，并保存原文的修辞张力。
translation_notes:
  register: 采用庄重、简洁而易懂的现代标准汉语。句序略作汉语化处理，把“在一日之内”置于动词前；同时保留原文两组并列意象及其简练、有力的审判语气。
