base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/008.yaml
  text: And all the people will know—Ephraim and the inhabitants of Samaria—who say in pride and in arrogance of heart,[a]
translation:
  language: zh_hans
  text: 全体百姓，就是以法莲和撒玛利亚的居民，都必知道；他们心怀骄傲，自高自大地说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“心的伟大”。这里与“骄傲”并列，指内心的自我抬高；故译为“自高自大”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 都必知道
  rationale: 在先知性宣告的语境中，将带连接词的完成式理解为将来或结果性的行动；“必知道”既自然，也保留宣告的确定语气。
- source_word: הָעָם כֻּלּוֹ
  choice: 全体百姓
  rationale: 表达整个群体，无一例外；“全体百姓”简洁自然。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 保留原文专名；在上下文中可指北国，但本节明确使用“以法莲”，不直接改译为“以色列”。
- source_word: וְיוֹשֵׁב שֹׁמְרוֹן
  choice: 和撒玛利亚的居民
  rationale: 原文单数分词具有集合意义，汉语以复数集合称谓“居民”表达最自然。
- source_word: בְּגַאֲוָה
  choice: 怀着骄傲
  rationale: גַּאֲוָה在此表示负面的高傲；“怀着”与后面的内心状态相配。
- source_word: וּבְגֹדֶל לֵבָב
  choice: 和自大的心
  rationale: 字面为“心的广大/伟大”，在此与“骄傲”并列，指内心自我抬高；“自大的心”清楚传达负面语义，同时以脚注保留字面形式。
- source_word: לֵאמֹר
  choice: 说
  rationale: 引出下一节的夸口内容；用冒号表示引语将在后文继续。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就是以法莲和撒玛利亚的居民”作为同位说明，界定“全体百姓”；分号使后面的“他们”清楚回指该群体，冒号则保留本句向下一节引语延伸的结构。
