  text: בְּ/עֶבְרַ֛ת יְהוָ֥ה צְבָא֖וֹת נֶעְתַּ֣ם אָ֑רֶץ וַ/יְהִ֤י הָ/עָם֙ כְּ/מַאֲכֹ֣לֶת אֵ֔שׁ אִ֥ישׁ אֶל אָחִ֖י/ו לֹ֥א יַחְמֹֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/018.yaml
  text: By the wrath of Yahweh of hosts the land is scorched[a], and the people have become like fuel for the fire; no man spares his brother.
translation:
  language: zh_hans
  text: 因万军之耶和华的烈怒，大地被烧焦了[a]；百姓成了火的燃料，谁也不怜惜自己的弟兄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地被烧尽了”，又或“大地变黑了”。这里的希伯来语动词十分罕见，确切含义尚有争议；上下文紧接着采用火和燃料的意象，因此正文译作“被烧焦了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶבְרַת
  choice: 因……的烈怒
  rationale: 介词 בְּ 在这里表达原因或施事作用；עֶבְרָה 指强烈、迸发的怒气。“因……的烈怒”自然地保留审判语气。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”保留四字神名的专名性质；“万军之”是 צְבָאוֹת 在中文圣经传统中清楚而庄重的表达，也传达上帝统率众军的权能。
- source_word: נֶעְתַּם
  choice: 被烧焦了
  rationale: 此罕见动词的确切含义有争议，可理解为“烧焦、烧尽”或“变暗”。紧接着的火与燃料意象支持“被烧焦了”，同时不把程度强化为彻底烧尽。
- source_word: אָרֶץ
  choice: 大地
  rationale: אָרֶץ 可指土地、国土或大地。这里描写神怒之下整个地域遭灾，“大地”既自然又保留一定的范围开放性。
- source_word: וַיְהִי הָעָם
  choice: 百姓成了
  rationale: 该叙事形式推进审判结果，并呈现形成后的状态；“成了”在现代汉语中简洁自然。
- source_word: כְּמַאֲכֹלֶת אֵשׁ
  choice: 火的燃料
  rationale: 字面为被火吞吃之物。“火的燃料”保留人被火吞噬的比喻，又比“火的食物”更符合现代汉语。
- source_word: אִישׁ אֶל אָחִיו
  choice: 谁也……自己的弟兄
  rationale: אִישׁ 在否定句中具有逐一、普遍的分配意义，因此译作“谁也”；“自己的弟兄”保留 אָחִיו 的亲属语言和同胞相残的震撼。
- source_word: לֹא יַחְמֹלוּ
  choice: 不怜惜
  rationale: חמל 表示因怜悯而饶恕、不加伤害。“不怜惜”明确保留其怜悯内涵，并适合这里的暴力语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知、具专名功能的“耶和华”，而不以“主”替代，从而保留盟约之名。
- issue: 百姓彼此不怜惜的表述范围
  choice: 谁也不怜惜自己的弟兄
  alternative: 一人不怜惜自己的弟兄
  rationale: 否定词与分配性的 אִישׁ 共同表达普遍的社会崩坏；“谁也不”忠实传达此义，同时保留“弟兄”所呈现的同胞关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号对应原文由土地受审判转向百姓彼此残害的推进；保留“万军之耶和华”和“弟兄”等富有经文色彩但普通读者仍能理解的表达。
