  source_fidelity: 正文正确把 מְאַשְּׁרֵי／מְאֻשָּׁרָיו 按上下文译为“引导者／受引导的人”，并保留了 תעה 的使役义和 בלע 的“吞没”意象。脚注也恰当地保留了 אשר 可关联“称为有福”的另一种可行理解。可是“竟”在希伯来文中没有明确对应，略加强了评注性的反讽；可不加而保留原文的修辞效果。
