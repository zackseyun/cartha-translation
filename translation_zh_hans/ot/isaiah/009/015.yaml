base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/015.yaml
  text: And the guides of this people have become those who lead them astray[a], and those guided by them are swallowed up.
translation:
  language: zh_hans
  text: 这百姓的引导者成了使他们迷失的人[a]；受他们引导的人被吞没。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“称这百姓有福的人使他们迷失；被他们称为有福的人被吞没。”希伯来语中源自 אשר 的两个词形可以与“称人为有福”有关，但上下文也支持“引导者／受引导的人”的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 竟成了
  rationale: 此处表示形成的结果状态；“成了”体现转变，“竟”自然传达上下文中的反常与讽刺，但不另加具体解释。
- source_word: מְאַשְּׁרֵי
  choice: 引导者
  rationale: 该分词可指引路、领导的人；与后面的“使……走迷路”形成鲜明反讽，也和下半句的被动形式相呼应。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 直接对应希伯来语，保留先知话语的指称方式。
- source_word: מַתְעִים
  choice: 使他们走迷路的人
  rationale: 使役分词表示使人偏离、迷失；此译保留使役语义，并在现代汉语中清楚自然。
- source_word: וּמְאֻשָּׁרָיו
  choice: 受他们引导的
  rationale: 按上下文将被动分词理解为受前述引导者带领的人；中文用复数“他们”承接集合意义上的“引导者”。
- source_word: מְבֻלָּעִים
  choice: 都被吞灭
  rationale: 保留“吞下、吞没”的强烈意象，同时“吞灭”在庄重现代汉语中自然表达其毁灭性结果。
theological_decisions:
- issue: 本节两个 אשר 词形的解释
  choice: 正文译作“引导者”与“受他们引导的”
  alternative: 译作“称这百姓有福的人”与“被他们称为有福的人”
  rationale: 紧邻的“使……走迷路”以及两个词形之间的主动—被动对应，更支持引导或领导之义；不过，希伯来语也容许“称为有福”的理解，因此以脚注保留该真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“引导者—受他们引导的”保留原文的词形呼应；“走迷路”表达使役性的偏离；脚注明示 אשר 的另一种合理读法，不在正文中消除原文歧义。
