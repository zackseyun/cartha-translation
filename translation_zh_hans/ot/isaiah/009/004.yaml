  text: כִּ֤י כָל סְאוֹן֙ סֹאֵ֣ן בְּ/רַ֔עַשׁ וְ/שִׂמְלָ֖ה מְגוֹלָלָ֣ה בְ/דָמִ֑ים וְ/הָיְתָ֥ה לִ/שְׂרֵפָ֖ה מַאֲכֹ֥לֶת אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/004.yaml
  text: For every boot of the tramping warrior in the battle's tumult[a], and every garment rolled in blood, will be for burning, fuel for the fire.
translation:
  language: zh_hans
  text: 因为每一只在喧嚣中踏步的军靴[a]，以及每一件卷在血中的衣服，都必供焚烧，作火的燃料。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每一只在喧嚣中践踏的军靴。”这里的希伯来语表达罕见且难解；有些译法不将其理解为军靴，而较抽象地译作战争的声响。
    reason: 保留סְאוֹן סֹאֵן בְּרַעַשׁ这一罕见短语在词义和句法上的真实不确定性。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的宣告说明缘由；现代汉语用“因为”自然清楚。
- source_word: כָל
  choice: 每一只／每一件
  rationale: 按分配意义分别修饰单数的“军靴”和“衣服”，符合汉语量词习惯。
- source_word: סְאוֹן
  choice: 军靴
  rationale: 此词罕见且含义不确定；结合相邻分词及血衣的战争图景，理解为战士所穿的军靴最为连贯，同时以脚注保留其他解释。
- source_word: סֹאֵן
  choice: 踏响的
  rationale: 用动态表达呈现分词所描绘的践踏、跺步之声，又不必在正文中增补原文未明说的“战士”。
- source_word: בְּרַעַשׁ
  choice: 在战阵喧嚣中
  rationale: רַעַשׁ可指震动、响声或骚动；上下文明确是战争场景，“战阵喧嚣”既自然，也保留声响与骚动的意象。
- source_word: וְשִׂמְלָה
  choice: 以及每一件……衣服
  rationale: שִׂמְלָה泛指衣服；从前面的כָל承接“每一”，使两个并列意象在汉语中清晰对应。
- source_word: מְגוֹלָלָה
  choice: 滚过的
  rationale: 保留该被动分词的“滚、卷”意象，不改写为较具解释性的“浸透”或“沾满”。
- source_word: בְדָמִים
  choice: 在血中
  rationale: 希伯来语虽用复数形式，汉语以“血”表达自然，并与“滚过”构成鲜明的战争图景。
- source_word: וְהָיְתָה לִשְׂרֵפָה
  choice: 都必被焚烧
  rationale: 原文直译为“成为供焚烧之物”；用被动句表达其预定结局，简洁而不改变意义。
- source_word: מַאֲכֹלֶת אֵשׁ
  choice: 成为火的燃料
  rationale: 原意近于“火的食物”；“火的燃料”是现代汉语中自然且仍保留隐喻的表达。
theological_decisions: []
