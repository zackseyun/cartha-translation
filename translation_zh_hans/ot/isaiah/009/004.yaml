  source_fidelity: 首句的罕见希伯来语短语确实应以脚注保留不确定性，但正文的“战阵”把原文仅有的“喧嚣／震动”（רַעַשׁ）明确限定为战场，属不必要的增译。衣服“在血中滚过”则容易表达为衣物自行穿过血泊，未能恰当呈现被动分词“卷起／卷作一团”与“在血中”的结合。
  naturalness: “在喧嚣中踏步的军靴”比“在战阵喧嚣中踏响的军靴”更简洁自然，也不增加“战阵”或“踏响”所带来的额外语义。“卷在血中的衣服”保留原文强烈、略带凝练的意象；全句仍保持庄重的经文书面语体。
  terminology: “军靴”“焚烧”“火的燃料”均合乎现代汉语并适合本节战争意象。“供焚烧，作火的燃料”较准确地对应לִשְׂרֵפָה מַאֲכֹלֶת אֵשׁ的两个并列目的／结果表达。
