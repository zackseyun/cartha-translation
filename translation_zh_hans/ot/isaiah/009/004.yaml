  to: 因为每一只在喧嚣中踏步的军靴[a]，以及每一件卷在血中的衣服，都必供焚烧，作火的燃料。
  rationale: 修订删除原文未明说的“战阵”，将“踏响”调整为较直接的“踏步”，并以“卷在血中”替代“在血中滚过”，从而更贴近原文的被动卷起意象。焚烧和火的燃料保留为两个相连表达，以反映希伯来文的措辞。
