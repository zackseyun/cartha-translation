base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/007.yaml
  text: The Lord sent a word into Jacob[a], and it fell on Israel.
translation:
  language: zh_hans
  text: 主向雅各发出话语[a]，这话落在以色列身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向雅各”也可按上下文译为“攻击雅各”；“落在以色列身上”也可译为“临到以色列”。
    reason: 原文介词בְּ可指向作用对象，并可能在审判语境中带有敌对意味；נפל保留“落下”的图像，也可按先知文体译作“临到”。
lexical_decisions:
- source_word: דָּבָר
  choice: 话语
  rationale: דָּבָר在这里指主所发出的言语或信息。“话语”既保留原文简洁的措辞，也不预先把它限定为信息、判语或已经发生的事件。
- source_word: שָׁלַח
  choice: 发出
  rationale: שׁלח的基本义是“差遣、发送”。汉语说“发出话语”自然，并保留主主动差遣其话语的意象。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神的称号אֲדֹנָי，而非四字神名；译作“主”准确、庄重，也符合现代汉语宗教文本的通常表达。
- source_word: בְּיַעֲקֹב
  choice: 向雅各
  rationale: 介词בְּ在此可表达话语所指向或所作用的对象。主译采用自然的“向雅各”，同时用脚注保留上下文可能暗示的敌对、审判意味。
- source_word: וְנָפַל
  choice: 这话落在
  rationale: נפל的基本义是“落下、落在”。补明主语“这话”可使汉语清楚，同时保留神的话如同落下并产生作用的鲜明比喻。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列身上
  rationale: נפל与介词בְּ连用，在此表达话语落到以色列并对其发生作用；“落在……身上”保留原文意象和审判语境。
theological_decisions:
- issue: בְּיַעֲקֹב所表达的是方向、范围还是敌对目标
  choice: 正文译作“向雅各”，脚注保留“攻击雅各”的可能
  alternative: “在雅各中”或“攻击雅各”
  rationale: 原文介词本身容许不止一种理解，而下半句“落在以色列身上”又带有审判色彩。正文采用较少解释性的方向表达，脚注则保存潜在的惩罚意味，避免把歧义静默消除。
- issue: 是否把“话语落在以色列身上”直接解释为审判临到
  choice: 保留“落在”的比喻
  alternative: “审判临到以色列”
  rationale: 上下文虽指向审判，但原文仍以“话”及其“落下”来表达。直译该意象可保留神的话语与其实际效力之间的神学张力，不额外加入“审判”一词。
- issue: 神圣称号אֲדֹנָי的处理
  choice: 译作“主”
  alternative: 以盟约之名的译法替代
  rationale: 此处原文明确使用称号אֲדֹנָי，不是יהוה，因此应翻译称号而不改换为别的神名形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“发出话语”保持先知文本的凝练感；“这话”补明后半句主语，使指代清楚；保留“落在……身上”的具体意象，不把经文改写成抽象的神学说明。
