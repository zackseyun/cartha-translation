  text: וְ/הָ/עָ֥ם לֹא שָׁ֖ב עַד הַ/מַּכֵּ֑/הוּ וְ/אֶת יְהוָ֥ה צְבָא֖וֹת לֹ֥א דָרָֽשׁוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/012.yaml
  text: But the people did not return to him who struck them[a], nor did they seek Yahweh of Armies.
translation:
  language: zh_hans
  text: 但这百姓不归向那击打他们的，也不寻求万军之耶和华。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָעָם
  choice: 但这百姓
  rationale: וְ在审判语境中带有转折意味，译为“但”；הָעָם以“这百姓”自然承接上下文所指的群体。
- source_word: לֹא שָׁב
  choice: 仍不归向
  rationale: שׁוּב的基本义是“转回、归回”；与עַד连用并以击打者为对象，译作“归向”既保留方向和关系含义，又不直接收窄为内心“悔改”。“仍”体现审判之后百姓依然没有回转的语境。
- source_word: עַד הַמַּכֵּהוּ
  choice: 那击打他们的
  rationale: 分词短语指实施击打者；宾语后缀虽为阳性单数，但先行词הָעָם是集合名词，现代汉语自然译为复数“他们”。不补出“神”，以保留原文表达。
- source_word: וְאֶת ... לֹא
  choice: 也不
  rationale: 第二个否定分句与前句并列，现代汉语用“也不”自然表达连续否定。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”在现代汉语圣经语境中直接标示四字神名；“万军之”是צְבָאוֹת作为神圣称号的通行、庄重且易懂的译法。
- source_word: לֹא דָרָשׁוּ
  choice: 不寻求
  rationale: דָּרַשׁ在此表示寻求神，可能包含求助、求问和转向之意；“寻求”保留其宽广语义而不限定为单纯“求问”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。简体中文现代圣经语域中“耶和华”辨识度最高，并保留专名性质；“雅威”是较接近学术重构发音的可行替代。
- issue: 称号צְבָאוֹת的译法
  choice: 万军之
  alternative: 众军之
  rationale: “万军之耶和华”是庄重、自然且广为理解的现代中文称号；“万”在此表示众多而非精确数字，能够涵盖天上及地上的军旅，不强行限定所指。
- issue: שׁוּב是否明确译为悔改
  choice: 归向
  alternative: 悔改归向
  rationale: 原词首先表达转回或归回；语境确有悔改意味，但原文未使用一个只表示内心悔改的词，因此采用“归向”以保存行为、关系与神学上的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这百姓”承接先知话语中的特定群体；两分句结构紧凑平行。译文没有把击打者直接明说为神，也没有把“归向”解释性扩充为“悔改”，从而保留原文的含蓄与张力。
