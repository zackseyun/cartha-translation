source:
  edition: WLC
  text: מְנַשֶּׁ֣ה אֶת אֶפְרַ֗יִם וְ/אֶפְרַ֨יִם֙ אֶת מְנַשֶּׁ֔ה יַחְדָּ֥ו הֵ֖מָּה עַל יְהוּדָ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/020.yaml
  text: Manasseh devours Ephraim[a], and Ephraim Manasseh; together they are against Judah. For all this his anger has not turned away, and his hand is still stretched out.
translation:
  language: zh_hans
  text: 玛拿西吞吃以法莲[a]，以法莲吞吃玛拿西；他们一同攻击犹大。尽管如此，他的怒气并未转消；他的手仍然伸出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“玛拿西……以法莲”和“以法莲……玛拿西”两处都省略了动词。“吞吃”是承接上一节的意象补出的；也可按语境理解为彼此敌对。
    reason: 说明希伯来文省略谓语，并保留由上下文补出“吞吃”与较宽泛的敌对理解之间的歧义。
lexical_decisions:
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 按现代中文圣经通行译名音译这一支派名。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 按现代中文圣经通行译名音译这一支派名。
- source_word: יַחְדָּו הֵמָּה עַל יְהוּדָה
  choice: 他们又联合起来攻击犹大
  rationale: יַחְדָּו 表示共同行动；עַל 在敌对语境中译作“攻击”。“又”使他们先彼此吞吃、继而共同敌对犹大的转折并列关系在中文中自然显明。
- source_word: בְּכָל זֹאת
  choice: 尽管如此
  rationale: 作为反复出现的审判叠句，表达上述一切之后怒气仍未止息；现代中文用“尽管如此”简洁自然。
- source_word: לֹא שָׁב אַפּוֹ
  choice: 他的怒气还没有转消
  rationale: אַף 在此按惯用义译为“怒气”；שׁוּב 保留转回、消退的动态意象，译作“转消”。
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: 他的手依然伸着
  rationale: 保留“手伸着”的身体意象及持续状态，表示审判行动尚未结束。
theological_decisions:
- issue: “他的怒气”和“他的手”所指为何
  choice: 正文保留第三人称“他”，不明说“耶和华”
  alternative: 译作“耶和华的怒气……他的手……”
  rationale: 文学语境表明所指是上帝，但希伯来文使用代词；保留代词可维持原文形式和反复叠句的节奏，不作不必要的明说。
- issue: 前半句省略动词的理解
  choice: 依据上一节吞食肉体的意象补出“吞吃”
  alternative: 译为较宽泛的“玛拿西攻击以法莲，以法莲攻击玛拿西”
  rationale: 希伯来文在两个带 אֶת 的短语中都省略谓语；由上一节的吞食意象补出“吞吃”最能保持上下文连贯，同时以脚注说明原文的省略，保留其语法歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“吞吃”保留上下文强烈意象；“转消”和“依然伸着”维持反复审判叠句的凝练节奏。
