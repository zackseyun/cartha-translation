base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/002.yaml
  text: You have multiplied the nation[a]; you have not increased the joy. They rejoice before you as with the joy at harvest[b], as men exult when they divide spoil.
translation:
  language: zh_hans
  text: 你使这国民增多，却没有使喜乐增多[a]。他们在你面前欢喜，好像收割时的欢喜[b]，又像人分掳物时那样欢腾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一些古代译本和许多译本作“你使它的喜乐增多”，所反映的希伯来文读法可能是 לוֹ（“给它”，即“它的”），而不是 לֹא（“不／没有”）。
    reason: textual_variant
  - marker: b
    text: 本句也可译作：“他们在你面前欢喜，如同收割时的喜乐，又如人分掳物时欢腾。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבִּיתָ הַגּוֹי
  choice: 你使这国人口增多
  rationale: הִרְבִּיתָ 是 רבה 的使役式，表示“使增多”；以“人口增多”自然表达一个国家或民族人数增加的含义，同时保留使役关系。
- source_word: לֹא הִגְדַּלְתָּ הַשִּׂמְחָה
  choice: 却没有使喜乐增多
  rationale: 按所提供的马所拉文本，将 לֹא 译为“没有”，不因上下文较难理解而擅自改读；“却”体现两分句之间出人意料的张力。
- source_word: שָׂמְחוּ לְפָנֶיךָ
  choice: 他们在你面前欢喜
  rationale: 直译其在上帝面前欢喜的指向；完成式在先知性描写中以中文现在式表达，保持场景鲜明。
- source_word: כְּשִׂמְחַת בַּקָּצִיר
  choice: 好像收割时的欢喜
  rationale: 清楚表达收获季节所带来的喜悦，并保留原文以“喜乐”作比较的名词结构。
- source_word: כַּאֲשֶׁר יָגִילוּ
  choice: 又像人……时那样欢腾
  rationale: גיל 表达强烈、雀跃的喜乐；“欢腾”比一般的“欢喜”语气更强。“人”为泛指，不将阳性复数不必要地限定为男性。
- source_word: בְּחַלְּקָם שָׁלָל
  choice: 分掳物时
  rationale: 指战胜后分配所掠之物；“掳物”保留军事语境，也符合庄重的经文语体。
theological_decisions:
- issue: 第二分句中 לֹא（“不／没有”）与 לוֹ（“给它／它的”）的文本异读
  choice: 正文依马所拉文本译作“却没有使喜乐增多”
  alternative: 依若干古代译本及许多译法译作“你使它的喜乐增多”
  rationale: 所提供的 WLC 正文明确为 לֹא。虽然否定式在语境中形成明显张力，而另一个读法更顺畅，但不应默默改动原文；因此正文保留马所拉文本，异读列于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“喜乐”保留诗歌与敬虔语境的语感，“掳物”保留战争意象。正文不消解马所拉文本中“人数增多”与“喜乐没有增多”之间的张力。
