id: ISA.9.6
reference: Isaiah 9:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ל/םרבה הַ/מִּשְׂרָ֜ה וּ/לְ/שָׁל֣וֹם אֵֽין קֵ֗ץ עַל כִּסֵּ֤א דָוִד֙ וְ/עַל מַמְלַכְתּ֔/וֹ לְ/הָכִ֤ין אֹתָ/הּ֙ וּֽ/לְ/סַעֲדָ֔/הּ בְּ/מִשְׁפָּ֖ט וּ/בִ/צְדָקָ֑ה מֵ/עַתָּה֙ וְ/עַד עוֹלָ֔ם קִנְאַ֛ת יְהוָ֥ה צְבָא֖וֹת תַּעֲשֶׂה זֹּֽאת־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/006.yaml
  text: Of the increase of the dominion and of peace there will be no end[a], on the throne of David and over his kingdom, to establish it and to uphold it with justice and with righteousness from now on and forever. The zeal of Yahweh of Armies will do this.
translation:
  language: zh_hans
  text: 政权必不断扩展；和平必无穷尽。他必在大卫的宝座上掌权，统治大卫的国；以公平和公义使这国坚立、扶持它，从现在直到永远。万军之耶和华[a]的热忱必成就这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”所译的是上帝的圣名יהוה（YHWH），也常音译为“雅威”。
    reason: 说明神名的原文形式及常见替代音译。
lexical_decisions:
- source_word: למרבה המשרה
  choice: 他的政权必不断扩展
  rationale: למרבה与משרה共同表达统治权不断增长、扩展。译作“政权”保留王权语境，又避免把它窄化为现代行政机构；补出“他的”承接上下文所说的王子。
- source_word: ולשלום אין קץ
  choice: 和平必永无止境
  rationale: שלום涵盖和平、安宁与福祉；正文采用最简洁自然的“和平”。אין קץ直译为“没有尽头”，在预言语境中用“必永无止境”表达其延续性。
- source_word: על כסא דוד ועל ממלכתו
  choice: 在大卫的宝座上掌权，统治他的国
  rationale: על在王位和国度的语境中表示统治范围。中文补出“掌权、统治”以呈现希伯来语省略的谓语关系；“他的国”保留后缀所具有的大卫王朝语境，不增添后期教义称谓。
- source_word: להכין אתה
  choice: 使国坚立
  rationale: כון的使役形表示使之稳固、确立；“坚立”兼顾建立与稳固的含义。
- source_word: ולסעדה
  choice: 得以维系
  rationale: סעד表示支撑、扶持或维持。译作“维系”适合国度延续的语境，并与“坚立”形成互补。
- source_word: במשפט ובצדקה
  choice: 以公平和公义
  rationale: משפט在治理语境中指公正的裁断与秩序，译作“公平”；צדקה指合乎正道的品格和作为，译作“公义”，从而保留两词的区别。
- source_word: מעתה ועד עולם
  choice: 从现在直到永远
  rationale: 忠实表达从预言所指的当前时点开始并持续无尽的时间范围，措辞自然庄重。
- source_word: קנאת
  choice: 热忱
  rationale: קנאה可指嫉妒或热心；此处指耶和华坚定而炽烈地成就应许的意志，“热忱”比“嫉妒”更符合语境。
- source_word: יהוה צבאות
  choice: 万军之耶和华
  rationale: יהוה采用现代中文圣经传统中广为人知的专名形式“耶和华”；צבאות直译为“万军”，保留其神圣王权与统帅意象。
theological_decisions:
- issue: 大卫王权应许与弥赛亚含义的表达
  choice: 保留“大卫的宝座”和“他的国”以及永恒统治的措辞，不在正文加入“弥赛亚”或后期基督论称谓。
  alternative: 在正文直接说明这是弥赛亚或基督的国度。
  rationale: 原文具有大卫王朝和弥赛亚指向，但本节并未使用这些后期明确称谓；保留原有张力可避免把解释写入译文。
- issue: יהוה צבאות的译法
  choice: 万军之耶和华
  alternative: 万军之雅威；万军之主
  rationale: “耶和华”是现代中文读者熟悉的圣名形式；“万军”直接保留צבאות所指的众军意象，而不将其含义窄化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。首句以两个并列分句重现政权扩展与和平无尽的平行关系；后半句保持王权、治理、公平、公义和永恒应许的正式语域。
