revisions:
- from: 他的政权必不断扩展，和平必永无止境。他必在大卫的宝座上掌权，统治他的国，以公平和公义使国坚立、得以维系，从现在直到永远。万军之耶和华[a]的热忱必成就这事。
  to: 政权必不断扩展；和平必无穷尽。他必在大卫的宝座上掌权，统治大卫的国；以公平和公义使这国坚立、扶持它，从现在直到永远。万军之耶和华[a]的热忱必成就这事。
  rationale: 修订只处理两处可安全判定的表达：明确“国”的大卫关联，并恢复“扶持”作为行动者的主动作为。其余保留原译在王权语境、永恒范围、治理术语和神名上的准确、自然表达；不将弥赛亚或后期教义解释写入正文。
