base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/017.yaml
  text: For wickedness burns like a fire; it devours brier and thorn[a], and it kindles the thickets of the forest, and they roll upward in a column of smoke.
translation:
  language: zh_hans
  text: 因为邪恶如火燃烧，吞噬荆棘和蒺藜，点燃林中的密丛；烟雾翻腾上升。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们在烟雾中翻卷上升。”希伯来文末句含义较难确定；正文采用烟雾翻腾上升这一较可能的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָעֲרָה
  choice: 燃烧
  rationale: 这是בער的Qal完成式阴性单数，以“邪恶”为主语；在先知性话语中可生动地描述当前或已然展开的景象。“燃烧”自然保留火焰意象。
- source_word: רִשְׁעָה
  choice: 邪恶
  rationale: 该抽象名词指道德上的恶或邪恶；译作“邪恶”既通顺，也保留其被拟人化为火的表达。
- source_word: כָאֵשׁ
  choice: 如火
  rationale: 直译比较结构，简洁保留原文意象。
- source_word: שָׁמִיר וָשַׁיִת
  choice: 荆棘和蒺藜
  rationale: 这是一组表示带刺无用植物的惯用搭配，具体植物品种难以确定，因此采用普通读者易懂、不过度限定物种的译法。
- source_word: תֹּאכֵל
  choice: 吞噬
  rationale: אכל本义为“吃”，常用于描写火焰烧尽事物；“吞噬”在中文中鲜明而自然。
- source_word: וַתִּצַּת
  choice: 点燃
  rationale: יצת表示点着或使燃烧；“点燃”保留从烧掉带刺植物发展到引燃森林密丛的动态。
- source_word: סִבְכֵי הַיַּעַר
  choice: 林中的密丛
  rationale: סבך指枝木交错的浓密灌丛；此译简洁呈现林中纠结密生的植物景象。
- source_word: וַיִּתְאַבְּכוּ
  choice: 翻腾上升
  rationale: 这是罕见而含义困难的动词，在本句中很可能描绘烟雾盘旋、翻卷而上的运动；该译保留动态，同时以脚注说明不确定性。
- source_word: גֵּאוּת עָשָׁן
  choice: 烟雾……上升
  rationale: גֵּאוּת可表达高起、隆起或翻涌之势，与“烟”连用时很可能指高升、翻腾的烟团；中文将这一意象自然整合进末句。
theological_decisions:
- issue: “邪恶”作为行动主体的拟人化
  choice: 保留“邪恶”燃烧、吞噬并点燃的主语结构
  alternative: 将其解释为恶人的行为或上帝施行的审判
  rationale: 原文直接以抽象名词רִשְׁעָה为主语，说明邪恶本身如火蔓延；不应在译文中加入原句未明说的行动者或神学解释。
translation_notes:
  register: 采用现代、庄重而具画面感的普通话。“吞噬”“密丛”“翻腾上升”保持诗性力度，同时避免生僻古雅措辞。脚注标记[a]已置于相关的末句之后。
