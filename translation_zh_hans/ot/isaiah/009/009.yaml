  text: לְבֵנִ֥ים נָפָ֖לוּ וְ/גָזִ֣ית נִבְנֶ֑ה שִׁקְמִ֣ים גֻּדָּ֔עוּ וַ/אֲרָזִ֖ים נַחֲלִֽיף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/009.yaml
  text: Bricks have fallen[a], but we will rebuild with cut stone; sycamores have been cut down[b], but we will replace them with cedars.
translation:
  language: zh_hans
  text: 砖墙倒塌了，但我们要用凿成的石料[a]重建；埃及无花果树[b]被砍倒了，但我们要换成香柏树。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凿成的石料”也可译作“凿石”或“加工过的石材”。
    reason: lexical_alternative
  - marker: b
    text: “埃及无花果树”指 sycamore-fig（Ficus sycomorus），并非通常所说的悬铃木。
    reason: cultural_note
lexical_decisions:
- source_word: לְבֵנִים
  choice: 砖墙
  rationale: 原词为复数“砖”，在“倒塌—重建”的建筑语境中，汉语说“砖墙倒塌”比“砖倒塌”自然；不限定为泥砖，以免超出希伯来文。
- source_word: נָפָלוּ
  choice: 倒塌了
  rationale: 完成体表示已经发生的毁坏；“倒塌了”自然呈现其结果，并与后面的重建相接。
- source_word: גָזִית
  choice: 凿好的石头
  rationale: 指经过凿制、加工的建筑石材；此译法通俗而准确，也保留它与普通砖材之间的对比。
- source_word: נִבְנֶה
  choice: 我们要……重建
  rationale: 第一人称复数未完成式在此表达意愿和将来的行动；动词本义是“建造”，但前文已说建筑倒塌，汉语用“重建”符合语境。
- source_word: שִׁקְמִים
  choice: 无花果桑树
  rationale: 该词指当地常见的 sycamore-fig，而非现代汉语通常理解的悬铃木；“无花果桑树”较明确地标示树种。
- source_word: גֻּדָּעוּ
  choice: 被砍倒了
  rationale: 被动形式表示树木遭砍伐；此译保留被动意义，语言自然。
- source_word: אֲרָזִים
  choice: 香柏树
  rationale: 这是圣经语境中对 cedars 的常用现代汉语名称，也体现其比无花果桑树更贵重、坚固的材料地位。
- source_word: נַחֲלִיף
  choice: 我们要换成
  rationale: 使役形在此表示以一种东西替换另一种；“换成”简洁自然，并清楚呈现从无花果桑树到香柏树的升级。
theological_decisions:
- issue: 说话者宣言的语气
  choice: 以自信而抗拒的重建宣言来表达，不另加“骄傲”等解释词。
  alternative: 视为中性的灾后重建陈述。
  rationale: 上下文表明这是面对审判仍自恃的回应；材料从砖升级为凿石、从无花果桑树升级为香柏树，本身已传达其夸张自信。译文保留这种张力而不把解释直接写入经文。
- issue: 两个 וְ/וַ 连接词的关系
  choice: 译作转折性的“但”。
  alternative: 直译为并列的“和／又”。
  rationale: 两组分句都形成“受损—以更优材料替代”的明显对照；现代汉语用“但”能自然表达语境中的反差，同时不改变事件内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两组平行句保持紧凑节奏；用“砖墙”使汉语搭配自然，用“无花果桑树”避免把古代近东树种误解为现代常称的西洋悬铃木。
