  naturalness: 整体庄重清楚。将首项改为“压在他身上的重负之轭”，并将末项改为“欺压者的棍棒”，可使现代汉语更顺畅，同时维持原文意象与区分。结尾“正如在米甸的日子一样”比“如同在米甸之日”更自然。
