  text: כִּ֣י אֶת עֹ֣ל סֻבֳּל֗/וֹ וְ/אֵת֙ מַטֵּ֣ה שִׁכְמ֔/וֹ שֵׁ֖בֶט הַ/נֹּגֵ֣שׂ בּ֑/וֹ הַחִתֹּ֖תָ כְּ/י֥וֹם מִדְיָֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/003.yaml
  text: For the yoke of his burden[a], and the staff on his shoulder[c][b], the rod of his oppressor—you have shattered them as on the day of Midian.
translation:
  language: zh_hans
  text: 因为压在他身上的重负之轭[a]、他肩头上的杖，以及欺压者的棍棒，你都已经打碎了[b]，正如在米甸的日子一样[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他重担的轭”或“压迫他的轭”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文使用完成式“你已经打碎”；这是预言中把上帝必定成就的胜利说成已经发生的表达方式。有些译本作“你必打碎”。
    reason: alternative_reading
  - marker: c
    text: “米甸的日子”很可能是指耶和华在基甸时代击败米甸人的事（士师记7章）。
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接上文，说明欢喜与拯救的缘由；“因为”自然保留了因果关系。
- source_word: עֹל סֻבֳּלוֹ
  choice: 他所负的轭
  rationale: עֹל直指“轭”，סֻבֳּל指所承受、背负的重担；译文保留轭的具体意象，同时用“所负”表达强加于人的重压。
- source_word: מַטֵּה שִׁכְמוֹ
  choice: 他肩头上的杖
  rationale: מַטֶּה可指杖或棍；这里与肩头的负担和压迫相连。译作“杖”既保留原有形象，也与下一个שֵׁבֶט所译的“棍”有所区别。
- source_word: שֵׁבֶט הַנֹּגֵשׂ בּוֹ
  choice: 欺压他的人的棍
  rationale: שֵׁבֶט在此具有击打、管束的含义，נֹגֵשׂ指强逼、欺压人的人；这一表达保留了施压者及其暴力工具的关系。
- source_word: הַחִתֹּתָ
  choice: 你都已经打碎了
  rationale: 该动词意为打碎、折断，是第二人称阳性单数完成式，直接对上帝说话。“都”统摄前面的轭、杖和棍，符合现代汉语表达。
- source_word: כְּיוֹם מִדְיָן
  choice: 如同在米甸之日
  rationale: 保留历史事件式的简练称谓，指向米甸遭到决定性击败的日子，而不在正文中展开解释。
theological_decisions:
- issue: 预言语境中的完成式与上帝的施事身份
  choice: 译作直接称呼上帝的完成式：“你都已经打碎了”
  alternative: 译作将来时：“你必打碎”
  rationale: 希伯来文使用第二人称完成式，能以已经成就的方式宣告确定的拯救。正文保留这一修辞张力，脚注说明有些译本按预言所指的将来事件处理。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他”延续希伯来文的单数指代，可代表受压迫的百姓；不擅自改为复数。“轭—杖—棍”保留原文连续的具体压迫意象，并以不同汉语词汇反映מַטֶּה与שֵׁבֶט的区别。
