base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/019.yaml
  text: He cuts on the right[a], but is hungry; he eats on the left, but is not satisfied[b]. Each one eats the flesh of his own arm.
translation:
  language: zh_hans
  text: 他向右边抢夺[a]，仍然饥饿；向左边吃，也不饱足。各人都吃自己手臂的肉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他向右边割取……向左边吞吃。”这里的希伯来文意象可能不是普通进食，而是为食物而凶暴抢夺。
    reason: lexical_alternative
  - marker: b
    text: 直译：“各人都吃自己手臂的肉。”这可能以食人般的意象描绘极端的内部争斗或自我毁灭。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְזֹר
  choice: 割取
  rationale: גזר的基本义是“割、割下”。“割取”既保留具体而暴烈的动作，也容许上下文所暗示的抢夺食物之意。
- source_word: עַל יָמִין
  choice: 向右边
  rationale: 保留空间方向，并与后文“向左边”构成平行。
- source_word: וְרָעֵב
  choice: 仍旧饥饿
  rationale: 表达前一动作之后饥饿依然未解的反差；“仍旧”自然传达语境中的转折结果。
- source_word: וַיֹּאכַל
  choice: 吞吃
  rationale: אכל通常意为“吃”；此处采用“吞吃”，在不改变基本动作的前提下，体现饥荒与暴力语境中的急迫感。
- source_word: עַל שְׂמֹאול
  choice: 向左边
  rationale: 与“向右边”对称，保留希伯来文的修辞结构。
- source_word: וְלֹא שָׂבֵעוּ
  choice: 也不饱足
  rationale: שׂבע指吃饱、得到满足。中文不标单复数，既自然，也不强行消除希伯来文由前文单数动作转为复数动词的变化。
- source_word: אִישׁ
  choice: 各人
  rationale: 这里具有逐一分配的含义；“各人”简洁保留这一作用。
- source_word: בְּשַׂר
  choice: 肉
  rationale: 直接呈现בשר的身体含义，保留原文骇人的具体意象。
- source_word: זְרֹעוֹ
  choice: 自己手臂上的
  rationale: זרוע通常指“手臂”。“自己”明确中文所需的所属关系，但不把“手臂”改释为力量或其他比喻。
- source_word: יֹאכֵלוּ
  choice: 都吃
  rationale: 复数动词与分配性的“各人”相配；中文以“各人都吃”自然表达逐个发生的共同动作。
theological_decisions:
- issue: “吃自己手臂上的肉”是字面事件还是象征
  choice: 正文保留原文具体的食人式意象，不判定其实现方式
  alternative: 直接译为彼此残害或自相吞噬
  rationale: 上下文可能借极端饥荒与食人意象描绘内部争斗或自我毁灭，但原文本身使用身体语言；正文不应以解释取代意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“割取”保留原文动词的具体性；“向右边……向左边……”保持平行节奏；“不饱足”较“得不到满足”更贴近进食语境。脚注标记均置于其所解释的词句之后。
