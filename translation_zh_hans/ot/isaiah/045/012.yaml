revisions:
- from: 是我造了大地，又创造了地上的人类[a]；是我的手铺展诸天，我也向天上的万象发令。
  to: 是我造了大地，也在其上创造了人类[a]；我亲手铺展了诸天，并命令诸天的一切万象。
  rationale: 修订只处理不自然的“是我的手”结构，并使“万象”与“诸天”的回指更明确。“亲手”在此不是额外的神学解释，而是对原文“我＋我的手”重复强调及“手”这一施事意象的自然汉语表达；“一切万象”则保留צָבָאם可指天上有序众多成员的宽度。
  reviewer_model: gpt-5.6-terra
