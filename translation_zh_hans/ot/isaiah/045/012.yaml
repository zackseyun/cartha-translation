source:
  edition: WLC
  text: אָֽנֹכִי֙ עָשִׂ֣יתִי אֶ֔רֶץ וְ/אָדָ֖ם עָלֶ֣י/הָ בָרָ֑אתִי אֲנִ֗י יָדַ/י֙ נָט֣וּ שָׁמַ֔יִם וְ/כָל צְבָאָ֖/ם צִוֵּֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/012.yaml
  text: I made the earth[a], and I created man upon it; my hands stretched out the heavens, and I commanded all their host.
translation:
  language: zh_hans
  text: 是我造了大地，也在其上创造了人类[a]；我亲手铺展了诸天，并命令诸天的一切万象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“人”（אָדָם）在这里是集合单数，指全人类。
    reason: 说明希伯来语单数形式所表达的集合意义。
lexical_decisions:
- source_word: אָֽנֹכִי עָשִׂ֣יתִי
  choice: 是我造了
  rationale: 独立代词放在动词前带有强调作用；用“是我”自然保留这种强调。“造”对应 עשה，并与后面的 ברא 区分。
- source_word: אֶ֔רֶץ
  choice: 大地
  rationale: 本节与“诸天”平行，语境是宇宙性的创造，因此指大地而非某一片土地。
- source_word: וְאָדָ֖ם
  choice: 人类
  rationale: אָדָם 在这里是集合单数，指整个人类；“人类”在现代汉语中准确、自然，也不会被误解为仅指男性。
- source_word: עָלֶ֣יהָ
  choice: 地上的
  rationale: 阴性单数后缀回指“大地”；将“在其上”自然化为“地上的”，使汉语流畅而不改变空间关系。
- source_word: בָרָ֑אתִי
  choice: 创造了
  rationale: ברא 是典型的神创造用语；译作“创造”，并与前面的“造”保持词汇区别。
- source_word: אֲנִ֗י יָדַי֙
  choice: 是我的手
  rationale: 原文再次使用独立代词，突出上帝亲自施行；“是我的手”比直译“我，我的手”更符合现代汉语，同时保留强调。
- source_word: נָט֣וּ שָׁמַ֔יִם
  choice: 铺展诸天
  rationale: נטה 与“诸天”连用表示伸展、展开；“铺展”既自然又保留诗性意象。
- source_word: וְכָל צְבָאָ֖ם
  choice: 天上的万象
  rationale: 后缀回指“诸天”，צָבָא 在此指诸天中成列的全部成员。“万象”能自然表达其总体与有序众多的含义，但具体所指仍具一定开放性。
- source_word: צִוֵּֽיתִי
  choice: 我也向……发令
  rationale: צוה 表示命令；“向……发令”清楚表达受令对象，也保留上帝对天上万象的主权。
theological_decisions:
- issue: אָדָם 的集合意义及性别范围
  choice: 人类
  alternative: 人；世人
  rationale: 此处不是专名“亚当”，而是指上帝安置在大地上的人类整体。译作“人类”明确保留集合意义，避免现代读者误以为只指男性。
- issue: כָל צְבָאָם 的具体所指
  choice: 天上的万象
  alternative: 天上的万军；诸天的万象
  rationale: 该短语可涵盖星辰等诸天中成列的众多成员，也可能带有“天军”的意涵。“万象”不把所指过早限定为天使军队或单指星辰，保留原文的宽度。
- issue: 重复第一人称代词的强调
  choice: 两处均用“是我／是我的手”体现
  alternative: 仅译作“我造了……我的手……”
  rationale: אָנֹכִי 与后面的 אֲנִי 都是明示的独立代词，具有修辞强调；汉语用“是我”结构可自然传达上帝亲自创造并统管万有的宣告，而不额外加入“亲手”等原文没有的概念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大地／诸天”保留先知诗歌的宇宙性对举；分号呈现原文两组创造宣告。“发令”比“命令万象”更自然，也清楚表达 צוה 的支配关系。
