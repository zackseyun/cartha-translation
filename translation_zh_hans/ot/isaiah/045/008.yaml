  to: '诸天啊，从上面滴下吧；

    愿云层降下公义[a]。


    愿大地敞开，

    使救恩结出果实，

    使公义一同萌发。


    我，雅威，创造了它[b]。'
  rationale: 修订以更自然的现代标准汉语保留诗体，同时恢复末句单数代词的歧义，并以“使公义一同萌发”反映阴性单数使役动词与“大地”的句法关联。
