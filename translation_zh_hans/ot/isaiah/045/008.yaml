id: ISA.45.8
reference: Isaiah 45:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַרְעִ֤יפוּ שָׁמַ֨יִם֙ מִ/מַּ֔עַל וּ/שְׁחָקִ֖ים יִזְּלוּ צֶ֑דֶק תִּפְתַּח אֶ֣רֶץ וְ/יִפְרוּ יֶ֗שַׁע וּ/צְדָקָ֤ה תַצְמִ֨יחַ֙ יַ֔חַד אֲנִ֥י יְהוָ֖ה בְּרָאתִֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/008.yaml
  text: Drip down from above[a], O heavens, and let the clouds pour down righteousness; let the earth open, that salvation may sprout, and let righteousness spring up together. I, Yahweh, have created it.
translation:
  language: zh_hans
  text: '诸天啊，从上面滴下吧；

    愿云层降下公义[a]。


    愿大地敞开，

    使救恩结出果实，

    使公义一同萌发。


    我，雅威，创造了它[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”；本节两个同词根的词都可含有正直、公正或正义的意思。
    reason: 保留צדק／צדקה的语义幅度，且明确脚注适用于本节两处用词。
  - marker: b
    text: “它”原文为阳性单数代词；可指“救恩”，也可能概括前面所描绘的情景。
    reason: 保留בראתיו后缀的单数形式及其未完全确定的指代。
lexical_decisions:
- source_word: הַרְעִיפוּ ... מִמַּעַל
  choice: 要从上方滴下
  rationale: רָעַף表示滴落、滴降；保留从上而下的水滴意象，又不强化为暴雨。希伯来文未明说所滴下的对象，译文也不擅自补足。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 复数形式用于庄重的宇宙性呼语；“诸天”既保留诗体格调，也与下句“云层”构成平行。
- source_word: שְׁחָקִים יִזְּלוּ
  choice: 云层要流淌
  rationale: שְׁחָקִים在降水意象中指云天、云层；נזל表示流下或滴流。“流淌”自然地承接前句的滴降意象。
- source_word: צֶדֶק / צְדָקָה
  choice: 公义
  rationale: 两个同词根名词在本节中彼此呼应；“公义”能涵盖正直、合宜秩序及公正作为，并以脚注保留“正义”的语义可能。
- source_word: תִּפְתַּח אֶרֶץ
  choice: 愿大地敞开
  rationale: 保持祈使、愿望式诗句及天地相对的宇宙图景；“大地”比“土地”更符合这里的范围。
- source_word: וְיִפְרוּ יֶשַׁע
  choice: 让救恩结出果实
  rationale: פרה的核心意象是结果、繁茂。“结出果实”比单纯“萌发”更贴近该词，并与下一分句צמח的“萌发”区分。原文动词为复数，诗句中的主语关系较压缩；汉语无须强行补出一个不确定的复数主语。
- source_word: וּצְדָקָה תַצְמִיחַ יַחַד
  choice: 让公义与它一同萌发
  rationale: צמח具有植物生长、萌生的意象；“与它一同”明确表达יחד所指的同时出现，并自然回指救恩。
- source_word: אֲנִי יְהוָה
  choice: 我雅威
  rationale: 以“雅威”音译四字神名，保留其作为上帝盟约之名的性质；汉语中置于动词前可自然表达强调。
- source_word: בְּרָאתִיו
  choice: 创造了这一切
  rationale: ברא译为“创造”。阳性单数后缀的所指并不完全明确；正文将其理解为概括此前所描绘的整体景象，同时用脚注保留较窄的回指可能。
theological_decisions:
- issue: צדק / צדקה应译为“公义”还是“正义”
  choice: 公义
  alternative: 正义
  rationale: 本节把该词族与救恩及宇宙更新的图景相连，“公义”较能保留其道德、关系和拯救层面的宽广含义；不过司法与社会公正的意味并未排除，故列入脚注。
- issue: יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”使读者看见这是专名，而不是普通称号；不据此附加任何宗派性解释。
- issue: בראתיו中代词后缀的所指
  choice: 这一切
  alternative: 救恩；它
  rationale: 后缀为阳性单数，可能回指阳性名词“救恩”，也可能概括整幅天地降下公义、地上生出救恩与公义的景象。正文采用自然的整体性表达，脚注注明另一可能，不把歧义静默消除。
translation_notes:
  register: 采用庄重而可朗读的现代标准汉语，保留希伯来诗歌的天地平行、降水与植物生长意象。分行呈现诗体节奏；避免古奥虚词，也不将原文压缩的主语关系和代词所指解释得过死。
