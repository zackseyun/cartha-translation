  text: וְ/נָתַתִּ֤י לְ/ךָ֙ אוֹצְר֣וֹת חֹ֔שֶׁךְ וּ/מַטְמֻנֵ֖י מִסְתָּרִ֑ים לְמַ֣עַן תֵּדַ֗ע כִּֽי אֲנִ֧י יְהוָ֛ה הַ/קּוֹרֵ֥א בְ/שִׁמְ/ךָ֖ אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/003.yaml
  text: And I will give you the treasures of darkness and the hidden riches of secret places[a], so that you may know that I am Yahweh, the one who calls you by name[c][b], the God of Israel.
translation:
  language: zh_hans
  text: 我要把黑暗中的宝藏[a]和隐秘处的珍藏[b]赐给你，使你知道，我是雅威[c]，是按名呼召你的那一位，是以色列的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可直译作“黑暗的宝藏”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“隐秘处所藏的财富”。
    reason: lexical_alternative
  - marker: c
    text: “雅威”是希伯来语中上帝之名“YHWH”的音译；传统上也译作“耶和华”，或以“主”代称。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要……赐给你
  rationale: 连接词加完成式在本段对居鲁士所发的预告中表达将来的应许；“我要……赐给你”既符合语境，也保留庄重语气。
- source_word: אוֹצְרוֹת חֹשֶׁךְ
  choice: 黑暗的宝藏
  rationale: 按原文连属结构直译，保留“黑暗”与“宝藏”之间略带含混的诗性关系；可理解为藏在黑暗中的宝藏，另在脚注说明。
- source_word: וּמַטְמֻנֵי מִסְתָּרִים
  choice: 隐秘处的珍藏
  rationale: מַטְמֻנִים指藏起来的储藏或财宝，מִסְתָּרִים指隐蔽之处；此译保留地点和隐藏财富两层意思，并与前半句形成诗歌平行。
- source_word: לְמַעַן תֵּדַע
  choice: 使你知道
  rationale: 明确表达原文的目的关系，在现代汉语中简洁自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名YHWH的常见汉语音译，不以称号替代其专名性质。
- source_word: הַקּוֹרֵא בְשִׁמְךָ
  choice: 按名呼召你的那一位
  rationale: 既保留分词结构所表达的持续身份，也传达上帝具体点名召唤居鲁士的意思。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 自然、标准地表达希伯来语连属结构，并保留上帝与以色列的特定关系。
theological_decisions:
- issue: 神圣四字名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用YHWH这一专名；音译“雅威”保留其作为以色列上帝之名的功能，而不将其改成称号。
- issue: 宝藏意象的性质
  choice: 保留具体、物质性的宝藏意象
  alternative: 解释为属灵的宝藏
  rationale: 上下文论及居鲁士、列国、城门与隐藏的财富，首先指向实际财宝；译文不将其灵意化，同时保留这一意象所彰显的上帝主权。
- issue: “黑暗的宝藏”的语义关系
  choice: 正文保留连属结构的含混性
  alternative: 明确译为“藏在黑暗中的宝藏”
  rationale: 希伯来语可直译为“黑暗的宝藏”，实际含义很可能是藏于黑暗处的财富；正文保留诗性张力，脚注提供较明确的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“黑暗的宝藏”有意保留原文凝练的诗性表达；“隐秘处的珍藏”与之构成自然平行。“按名呼召”兼顾现代可懂性与原文对个人特定召唤的强调。
