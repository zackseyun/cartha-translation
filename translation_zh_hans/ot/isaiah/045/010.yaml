revisions:
- from: 祸哉！那对父亲说：“你生的是什么？”又对妇人说：“你为生产什么而阵痛？”[a]
  to: 那对父亲说：“你要生什么后代？”又对妇人说：“你因什么而阵痛？”的人有祸了！[a]
  rationale: 修订使父亲的“生育后代”与妇人的“临产阵痛”在中文中各自清晰且自然，不把隐含的造物主类比扩写进正文。脚注保留妇人动词可按“生产什么”译出的词汇可能性，并说明其临产痛苦的语义色彩。
