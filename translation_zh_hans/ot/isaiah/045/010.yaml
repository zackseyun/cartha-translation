  yaml_path: translation/ot/isaiah/045/010.yaml
  text: Woe to one who says to a father[a], ‘What are you fathering?’ or to a woman[b], ‘What are you giving birth to?’
translation:
  language: zh_hans
  text: 那对父亲说：“你要生什么后代？”又对妇人说：“你因什么而阵痛？”的人有祸了！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你因什么而阵痛”也可译作“你要生什么？”原文动词着重妇人临产时的翻腾、阵痛。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 保留先知性谴责与警告的强烈语气，比单纯的“唉”更符合上下文。
- source_word: אֹמֵר
  choice: 那……说
  rationale: 将实词化分词译为泛指单数，同时使现代汉语表达自然。
- source_word: לְאָב
  choice: 对父亲
  rationale: 原文没有物主后缀，因此不增译为“对自己的父亲”。
- source_word: מַה תּוֹלִיד
  choice: 你生的是什么
  rationale: תּוֹלִיד 是 ילד 的使役式阳性单数，指男子生育、使人生下，即“生育/生下后代”；汉语难以用简洁而自然的单一动词专指父亲的生育作用，故以“生”保留问题的直接性，并由“父亲”限定其父系含义。
- source_word: וּלְאִשָּׁה
  choice: 又对妇人
  rationale: 保留并列关系；原文仅为“妇人”，没有物主后缀，不擅自改成“母亲”。
- source_word: מַה תְּחִילִין
  choice: 你为生产什么而阵痛
  rationale: 该动词表达翻腾、阵痛或临产之苦，而不只是生产的结果；此译保留妇人分娩阵痛的具体意象。
theological_decisions:
- issue: 父亲与妇人的生育意象所指
  choice: 在正文中保留字面的父亲与妇人，不明说这是质问造物主的类比
  alternative: 译成“父母”，或直接增释为人不该质问上帝
  rationale: 本节以具体的生育图像延续上下文的反诘；其神学指向可由上下文显明，不应在本节正文中消解隐喻。
- issue: 两个疑问句的语义张力
  choice: 分别保留父亲“生育什么”与妇人“为何物生产而阵痛”的侧重点
  alternative: 将两句统一译成“你生的是什么”
  rationale: 原文使用不同动词：前者是父系生育，后者突出妇人的临产阵痛。保留差异更贴近希伯来语的平行而非同义重复。
translation_notes:
  register: 采用现代、庄重且可朗读的简体中文。“祸哉”保留先知宣告的力度；正文不使用生僻的“生育、生产”专门术语堆叠，但借脚注说明第二个动词所含的分娩阵痛意象。
