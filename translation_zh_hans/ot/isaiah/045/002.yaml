base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/002.yaml
  text: I myself will go before you[a], and I will level the rough places; I will break in pieces doors of bronze, and I will cut through bars of iron.
translation:
  language: zh_hans
  text: 我必亲自走在你前面，使崎岖之处平坦；[a]我必打碎青铜门，砍断铁闩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使崎岖之处平坦”所译的希伯来短语在文本和词义上较难确定；或译“使高低不平之处平坦”，也有译本更具体地译作“使山岭平坦”或“削平高处”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי֙ לְפָנֶ֣יךָ אֵלֵ֔ךְ
  choice: 我必亲自在你前面行
  rationale: 明确译出独立代词 אֲנִי 的强调意味；“在你前面行”自然表达 לְפָנֶיךָ 的先行之意，未增添原文之外的神学解释。未完成体在预言应许语境中译作将来。
- source_word: וַהֲדוּרִ֖ים אושר
  choice: 使崎岖之处平坦
  rationale: 马所拉文本的措辞和形态疑难，但整体似指把高低不平、崎岖或隆起之处整平。“崎岖之处”保留较宽泛的地形含义，避免武断限定为“山岭”；“使……平坦”表达使役意义。
- source_word: דַּלְת֤וֹת נְחוּשָׁה֙
  choice: 铜门
  rationale: דַּלְתוֹת 本义为门；נְחוּשָׁה 在此指铜或青铜。现代汉语中“铜门”简洁自然，也与下句“铁闩”形成有力的平行。
- source_word: אֲשַׁבֵּ֔ר
  choice: 打碎
  rationale: Piel 词形表达强烈、彻底的破坏动作；“打碎”比单纯“打破”更能体现其力度。
- source_word: בְרִיחֵ֥י בַרְזֶ֖ל
  choice: 铁闩
  rationale: בְרִיחַ 指用于固定门的横闩或门闩；“铁闩”符合现代汉语习惯，并保持与“铜门”的平行。
- source_word: אֲגַדֵּֽעַ
  choice: 砍断
  rationale: 该动词表示砍下、斩断；用于铁闩时，“砍断”自然传达彻底除去阻碍的动作。
theological_decisions:
- issue: 神亲自先行的强调
  choice: 我必亲自在你前面行
  alternative: 我必在你前面行
  rationale: 原文显式使用独立代词 אֲנִי，具有强调作用。“亲自”保留这一语用力度，同时不引入额外教义内容。
- issue: 疑难地形短语的解释范围
  choice: 使崎岖之处平坦
  alternative: 使山岭平坦／使弯曲之处变直
  rationale: 原文短语存在文本与词义困难。正文采用能涵盖不平、隆起或崎岖地势的宽泛表达，并以脚注保存其他可能理解，不将其神学化或过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必”体现预言应许的确定性；分号保留诗句两部分的推进关系。正文中的脚注标记置于相关疑难短语之后。
