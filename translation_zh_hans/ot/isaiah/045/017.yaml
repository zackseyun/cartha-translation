  text: יִשְׂרָאֵל֙ נוֹשַׁ֣ע בַּ/יהוָ֔ה תְּשׁוּעַ֖ת עוֹלָמִ֑ים לֹא תֵבֹ֥שׁוּ וְ/לֹא תִכָּלְמ֖וּ עַד ע֥וֹלְמֵי עַֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/017.yaml
  text: Israel is saved by Yahweh with an everlasting salvation[b][a]; you will not be put to shame or disgraced forever and ever.
translation:
  language: zh_hans
  text: 以色列靠雅威[a]得救，得享永远的救恩；你们必不蒙羞，也不受辱[b]，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠雅威”也可译作“在雅威里面”或“藉着雅威”；希伯来语介词可表示范围、凭借或施事。
    reason: alternative_reading
  - marker: b
    text: “蒙羞……受辱”也可译作“感到羞愧……遭到羞辱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל נוֹשַׁע
  choice: 以色列却……得救
  rationale: נוֹשַׁע是ישׁע的尼法勒式，表达以色列蒙拯救。上下文带有宣告和应许色彩，汉语“得救”无需强行限定为过去或将来；“却”承接前文对比，本节自身虽无显式转折词，但符合诗段语势。
- source_word: בַּיהוָה
  choice: 靠雅威
  rationale: 介词ב既可表达施事、凭借，也可表达范围或联合。汉语“靠雅威”自然地传达救恩出于雅威，同时不完全排除“在雅威里”的范围意味；另以脚注保留歧义。
- source_word: יהוה
  choice: 雅威
  rationale: 按所给神学决策，将四字神名直接音译为“雅威”，以体现经文中的盟约之名。
- source_word: תְּשׁוּעַת עוֹלָמִים
  choice: 得着永远的救恩
  rationale: 该同源名词短语加强前面的“得救”；“永远的救恩”自然保留עוֹלָמִים所表达的恒久性，补入“得着”使现代汉语句法通顺。
- source_word: לֹא תֵבֹשׁוּ
  choice: 你们必不蒙羞
  rationale: 二人称复数未完成式在此表达应许。“蒙羞”兼顾公开受羞辱及结果状态，且保持庄重凝练。
- source_word: וְלֹא תִכָּלְמוּ
  choice: 也不受辱
  rationale: כלם的尼法勒式与בושׁ构成近义平行，并较突出被羞辱、受耻辱之意；“受辱”既与“蒙羞”有别，又保留诗歌叠加强调。
- source_word: עַד עוֹלְמֵי עַד
  choice: 直到永永远远
  rationale: 这是强化永久性的希伯来语表达。“直到永永远远”既保留עַד的界限用法，也传达无尽延续。
theological_decisions:
- issue: בַּיהוָה中介词ב的施事、凭借与范围含义
  choice: 靠雅威
  alternative: 在雅威里；藉着雅威
  rationale: 原文允许多重关系。“靠”在现代汉语中可自然表达救恩的来源与凭借，并避免把歧义完全收窄为单纯施事；脚注明示其他可能。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 依据提供的项目神学决策，直接呈现神名，而非以称号替代；“雅威”是现代汉语中较能反映学界常见复原读音的形式。
- issue: נוֹשַׁע的时间指向
  choice: 得救
  alternative: 已经得救；必将得救
  rationale: 希伯来语形式及先知语境不要求在汉语中明确限定为过去或将来。“得救”保留宣告与应许之间的张力，后面的“必不”则清楚表达未来保障。
translation_notes:
  register: 采用现代、庄重且适合朗读的标准普通话。“蒙羞／受辱”保留希伯来诗歌的近义平行；两个脚注标记均置于正文相关位置。
