base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/004.yaml
  text: For the sake of my servant Jacob[a], and Israel my chosen one, I called you by your name; I surnamed you, though you did not know me.
translation:
  language: zh_hans
  text: 为我仆人雅各和我所拣选的以色列的缘故，我按你的名召你；我赐你名号[a]，尽管你不认识我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赐你名号”也可译作“给你称号”“给你起别名”或“赐你尊号”。希伯来语动词可指赋予某种称谓或名号。
    reason: 保留 אֲכַנְּךָ 的词义范围，避免正文过度限定其为姓氏、别名或尊号。
lexical_decisions:
- source_word: לְמַעַן
  choice: 为了
  rationale: 表达行动所为的对象与目的；在本句中重复“为了”可清楚呈现雅各与以色列的平行关系。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 这里是先知语境中带有尊荣与立约意味的称谓，并非着重受奴役的身份。
- source_word: בְּחִירִי
  choice: 我所拣选的
  rationale: 保留神主动拣选以色列的含义，并以现代汉语自然地修饰“以色列”。
- source_word: וָאֶקְרָא לְךָ בִּשְׁמֶךָ
  choice: 我按你的名字召你
  rationale: 兼顾“呼召/召唤”与亲自指名的含义，也明确反映原文第二人称所有格。
- source_word: אֲכַנְּךָ
  choice: 我赐给你名号
  rationale: 该动词可能指赋予称号、别名或尊称；“赐给你名号”既保留授名动作，也不把尊荣性质写死在正文中。
- source_word: וְלֹא יְדַעְתָּנִי
  choice: 尽管你不认识我
  rationale: 上下文呈让步关系：神虽未被居鲁士认识，仍点名并任用他；“认识我”准确保留第一人称宾语。
theological_decisions:
- issue: 受话者不认识神，却被神点名任用
  choice: 译作“尽管你不认识我”
  alternative: “而你不认识我”或“虽然你未曾承认我”
  rationale: 上下文中的受话者是居鲁士。译文保留神任用不认识他的外邦君王这一张力，不暗示其后来归信，也不把“认识”弱化为仅仅“不承认”。
- issue: אֲכַנְּךָ 所赋予之名号的性质
  choice: 正文采用较宽泛的“赐给你名号”，脚注列出“称号、别名或尊称”
  alternative: “赐给你尊号”或“给你起别名”
  rationale: 原词的准确语义存在一定不确定性；正文不应直接限定为尊号或姓氏，以免消除真实的词义幅度。
- issue: 第一人称宾语所指的神名
  choice: 译作“我”
  alternative: 扩译为“耶和华”
  rationale: 希伯来文仅有第一人称宾语后缀；说话者在上下文中已明确，因此不作解释性扩充。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“按你的名字召你”保留原文指名呼召的力度；“名号”较“姓氏”更符合古代称谓语境，也比“尊号”少一层未经确定的解释。
