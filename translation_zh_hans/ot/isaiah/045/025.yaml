  text: בַּ/יהוָ֛ה יִצְדְּק֥וּ וְ/יִֽתְהַלְל֖וּ כָּל זֶ֥רַע יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/025.yaml
  text: In Yahweh all the offspring of Israel will be justified and will boast[a][b].
translation:
  language: zh_hans
  text: 在雅威里面，以色列全体后裔[b]都必得称为义[a]，并要夸耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被证明为义”或“得伸冤”。希伯来语动词可指被判定为义，也可指被显明为在理、得到伸冤。
    reason: alternative_reading
  - marker: b
    text: 直译“以色列的所有种子”。这里的“种子”集合性地指后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: 在雅威里
  rationale: 介词 בְּ 在此最自然地表示范围或根基；前置短语可同时关联“称义”和“夸耀”。采用“雅威”直译神的圣名 יהוה。
- source_word: יִצְדְּקוּ
  choice: 都必得以称义
  rationale: צדק 的 Qal 在此可指被判定为义、显明为正或获证明为正。“得以称义”保留其宣告性和结果性，同时用脚注注明“得证为正”这一真实可能。
- source_word: וְיִתְהַלְלוּ
  choice: 并要夸耀
  rationale: הלל 的 Hitpael 在此表示夸耀或以某者为荣。“夸耀”是自然的现代汉语，也保留原文未明说宾语的简练表达。
- source_word: כָּל
  choice: 所有的
  rationale: כָּל 修饰后面的集合性名词短语，直指全体。
- source_word: זֶרַע יִשְׂרָאֵל
  choice: 以色列所有的后裔
  rationale: זֶרַע 字面为“种子”，此处集合性地指以色列的后代；“后裔”庄重、自然，并以脚注保留字面意象。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的拟音，也明确保留西奈之约中的神名。
- issue: צדק 在救恩语境中的含义
  choice: 得以称义
  alternative: 得证为正
  rationale: “称义”呈现被判为义的宣告性含义，但不把该词限定为某一后期教义体系；脚注保留其“获证明为正、得伸张”的语义张力。
- issue: בַּיהוָה 与两个动词的关系
  choice: 将“在雅威里”置于全句句首，使其自然涵盖称义与夸耀
  alternative: 分别译作“靠雅威称义，并以他为夸耀”
  rationale: 原文前置介词短语具有范围上的开放性；不分别补入“靠”和“以他为”，可避免把其语法关系解释得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“得以称义”保留经文的宣告性表达；句首“在雅威里”维持原文的紧凑结构和有意保留的关系歧义。
