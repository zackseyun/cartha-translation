  to: 使从日出之处到日落之处的人都知道：除我以外，别无其他；我是雅威，没有别的。
  rationale: 将正文中相对生硬的“别无他者”改为“别无其他”，并将地理范围明确表达为“从日出之处到日落之处的人”，使译文更自然而不缩窄或扩充原文的排他性与普世范围。脚注内容本身准确，仅规范“希伯来语”的表述。
