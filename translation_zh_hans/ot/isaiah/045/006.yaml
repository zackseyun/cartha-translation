  text: לְמַ֣עַן יֵדְע֗וּ מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ וּ/מִ/מַּ֣עֲרָבָ֔/הּ כִּי אֶ֖פֶס בִּלְעָדָ֑/י אֲנִ֥י יְהוָ֖ה וְ/אֵ֥ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/006.yaml
  text: so that they may know[a], from the rising of the sun and from its setting, that there is none besides me. I am Yahweh[b], and there is no other.
translation:
  language: zh_hans
  text: 使从日出之处到日落之处的人都知道：除我以外，别无其他；我是雅威，没有别的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: 好让人……都知道
  rationale: לְמַעַן引出目的，未完成式יֵדְעוּ表示所期望达到的认识；“好让……知道”自然保留目的意味。第三人称复数在此泛指各地的人，译作“人……都”与后面的普世地理范围相称。
- source_word: מִמִּזְרַח שֶׁמֶשׁ וּמִמַּעֲרָבָהּ
  choice: 从日出之地到日落之处
  rationale: 原文直陈太阳升起与落下，并以后缀回指“太阳”。中文用“从……到……”自然表达两端所涵盖的整体范围，同时保留太阳升落的诗意图景。
- source_word: כִּי
  choice: 知道：
  rationale: כִּי在这里引出“知道”的内容。中文以冒号衔接，比直译为“知道……即”更自然清楚。
- source_word: אֶפֶס בִּלְעָדָי
  choice: 除我以外，别无他者
  rationale: 此短语宣告说话者独一无二。“他者”保留希伯来文省略所比较对象的特点，避免擅自补入“神”或把它误解为除神以外万物皆不存在。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 保留强调性的第一人称代词，并将四字神名按较接近YHWH传统学术读音的形式译为“雅威”。
- source_word: וְאֵין עוֹד
  choice: 再没有别的
  rationale: 这是《以赛亚书》中反复出现的排他性表达。译文保持其简洁和绝对语气，也不补明原文省略的名词。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名YHWH。正文采用“雅威”以显示这是专名；脚注交代传统音译，既不以称号代替神名，也不把某种汉语传统形式当作唯一可能的发音。
- issue: 地理表达的范围
  choice: 从日出之地到日落之处
  alternative: 从东方到西方
  rationale: 原文借太阳升落表达从东到西乃至普世的范围。正文保留意象，脚注列出方向性的自然译法。
- issue: 独一性宣告中省略的对象
  choice: 别无他者……再没有别的
  alternative: 没有别的神
  rationale: 上下文显然涉及雅威的独一性，但这两个希伯来短语本身没有明说“神”。译文保留这种省略及其强烈语气，不额外导入后期神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好让”清楚表达目的；“日出之地到日落之处”保留诗性而不显古奥；两句独一性宣告刻意简洁重复，以对应希伯来文的强调结构。
