  naturalness: “别无他者”在现代普通话中偏书面且不够自然；“别无其他”更自然，同时仍保留原文未明示名词的开放性。“使从日出之处到日落之处的人都知道”清楚、庄重，也保留原文的太阳意象。
  terminology: “雅威”可作为YHWH的学术性音译，符合本项目对神名的处理。脚注中以“希伯来语”替代“希伯来文”更规范；“耶和华”作为传统汉语音译的说明恰当。
