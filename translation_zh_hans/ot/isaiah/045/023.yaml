base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/023.yaml
  text: 'By myself I have sworn[a]; from my mouth has gone out a righteous word, and it will not return: to me every knee will bow[b], every tongue will swear allegiance.'
translation:
  language: zh_hans
  text: 我指着自己起誓；从我口中发出了公义的话[a]，这话必不返回：万膝都必向我屈膝，万口都必起誓[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从我口中在公义中发出的话”；希伯来语既可着重这话是公义的，也可着重它是在公义中说出的。
    reason: lexical_alternative
  - marker: b
    text: 或译“都必宣誓效忠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: 我指着自己起誓
  rationale: 这是希伯来语的起誓用语，表示上帝以自己为誓；“指着自己”既自然，也保留强调意味。
- source_word: יָצָא מִפִּי
  choice: 从我口中发出了
  rationale: 保留话语从上帝口中发出的具体意象，同时符合现代汉语表达。
- source_word: צְדָקָה דָּבָר
  choice: 公义的话
  rationale: 这一紧缩结构可着重于话本身是公义的，也可表示话是在公义中说出的；正文采用自然而贴近词义的“公义的话”，并以脚注保留另一种理解。
- source_word: וְלֹא יָשׁוּב
  choice: 这话绝不返回
  rationale: 保留原文“返回、转回”的意象，不直接解释为“绝不撤回”或“绝不落空”。
- source_word: לִי תִּכְרַע כָּל בֶּרֶךְ
  choice: 万膝都必向我屈膝
  rationale: “屈膝”自然表达臣服或敬拜，同时准确保留“向我”的方向。
- source_word: תִּשָּׁבַע כָּל לָשׁוֹן
  choice: 万舌都必起誓
  rationale: 按字面保留“起誓”的含义，不在正文中进一步限定为自愿认信或宣誓效忠；可能的效忠含义列入脚注。
theological_decisions:
- issue: 普世屈膝和起誓的性质
  choice: 表述所有人都向耶和华屈膝并起誓，但不说明这种降服是自愿还是被迫。
  alternative: 将“起誓”明确译为“宣誓效忠”或“承认”。
  rationale: 原文宣告普世对耶和华主权的承认，却没有说明其内在态度；直译可保留这一神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“万膝”“万舌”保留原文的身体意象与普世范围；“这话绝不返回”有意保存原文比喻，不将其解释性改写为“绝不撤回”或“绝不落空”。
