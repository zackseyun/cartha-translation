  text: אֲנִ֤י יְהוָה֙ וְ/אֵ֣ין ע֔וֹד זוּלָתִ֖/י אֵ֣ין אֱלֹהִ֑ים אֲאַזֶּרְ/ךָ֖ וְ/לֹ֥א יְדַעְתָּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/005.yaml
  text: I am Yahweh[a], and there is no other; besides me there is no God. I strengthen you, though you have not known me.
translation:
  language: zh_hans
  text: 我是雅威；除我以外，再没有别的；除我以外没有神。我给你束腰[a]，尽管你不认识我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我装备你”或“我使你强壮”。希伯来语动词可指给人束腰、装备，或由此使人强壮。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译神的专名，保留四字神名作为名字的性质，不以称号代替。
- source_word: וְאֵין עוֹד
  choice: 再没有别的
  rationale: 自然表达绝对排他性，并与下句形成递进和平行。
- source_word: זוּלָתִי
  choice: 除我以外
  rationale: 准确表达相对于说话者的排除意义，在现代汉语中清楚自然。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本句否认雅威以外另有上帝；采用现代汉语常用称谓，传达单数语义，而不据词形机械译成复数。
- source_word: אֲאַזֶּרְךָ
  choice: 我束上你的腰，使你有力量
  rationale: 动词אזר基本意象是束腰、装备，语境效果是赐力量；正文兼顾形象与功能，避免只译“加力量”而抹去原文意象。
- source_word: וְלֹא יְדַעְתָּנִי
  choice: 尽管你不认识我
  rationale: 结合上下文将ו理解为让步关系，同时用“认识”保留ידע可指认知与关系的宽度，不擅自限定为盟约性认识。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”能保留其专名性质，不以称号替换。
- issue: 末句连接词的逻辑关系
  choice: 尽管你不认识我
  alternative: 而你不认识我；你虽不认识我
  rationale: 上下文强调雅威在居鲁士尚不认识他时仍装备并赐力量；让步译法体现这种张力，但不增添原文之外的教义判断。
- issue: אזר的形象与作用
  choice: 束上你的腰，使你有力量
  alternative: 使你有力量；装备你；给你束腰
  rationale: 保留束腰装备的具体意象，也明示其赋能作用；脚注列出更简约的可行译法，以保存词义范围。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“我是雅威”保持宣告力度；两个“除我以外”维持希伯来诗句的排他性和平行感。对אֲאַזֶּרְךָ采用兼具形式与意义的表达，正文中的脚注标记与脚注完全对应。
