  yaml_path: translation/ot/isaiah/045/015.yaml
  text: Truly[a], you are a God who hides himself, the God of Israel, the Savior.
translation:
  language: zh_hans
  text: 诚然[a]，你是隐藏自己的上帝——以色列的上帝、救主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你是隐而不显的上帝。”希伯来语分词既可理解为反身意义（“隐藏自己”），也可较偏状态地理解（“隐而不显”）。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: 诚然
  rationale: 表达强调性的确认或领悟，语气庄重，也符合现代汉语。
- source_word: אַתָּה
  choice: 你
  rationale: 保留对上帝的第二人称单数直接称呼；现代简体中文采用“你”。
- source_word: אֵל
  choice: 上帝
  rationale: 此处明确指以色列的上帝；不增译为“大能的上帝”。
- source_word: מִסְתַּתֵּר
  choice: 隐藏自己的
  rationale: 希伯来语 Hitpael 分词可表达反身或中间意义；“隐藏自己的”保留其动态、反身色彩。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 按同位关系进一步说明受话者身份，不额外增添呼格语气。
- source_word: מוֹשִׁיעַ
  choice: 救主
  rationale: 该 Hiphil 分词指施行拯救者；“救主”自然、庄重，并保留称号性质。
theological_decisions:
- issue: 上帝之隐藏的含义
  choice: 隐藏自己的
  alternative: 隐藏的上帝／隐而不显的上帝
  rationale: 经文本身没有说明这是指不可测度、隐秘的护理，还是暂时掩面，因此不作神学解释，只保留隐藏与拯救并列所形成的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“是……是……是……”保留原文同位成分层层确认的结构；脚注交代“隐藏自己”与“隐而不显”之间的真实歧义。
