  text: יוֹצֵ֥ר אוֹר֙ וּ/בוֹרֵ֣א חֹ֔שֶׁךְ עֹשֶׂ֥ה שָׁל֖וֹם וּ/ב֣וֹרֵא רָ֑ע אֲנִ֥י יְהוָ֖ה עֹשֶׂ֥ה כָל אֵֽלֶּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/007.yaml
  text: forming light and creating darkness[a], making peace and creating calamity; I am Yahweh, who does all these things.
translation:
  language: zh_hans
  text: 我造光，创造黑暗；我赐平安，创造灾祸[a]。我，雅威，施行这一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译为“灾难”、“祸患”或“恶”。希伯来语 רָע 可指恶、祸患、灾害或不幸；本句与“平安”相对，较可能指灾祸或逆境，而不是道德上的邪恶。
    reason: 说明 רָע 的语义范围及其在本句对举中的语境义，同时正文保留 ברא 两次均译为“创造”的对应。
lexical_decisions:
- source_word: יוֹצֵר
  choice: 造
  rationale: 该词是יצר的Qal主动分词，表示塑造、形成。汉语“造”简洁自然，并可与下句“创造”保持词语区别。
- source_word: אוֹר
  choice: 光
  rationale: 采用基本词义“光”，保留与“黑暗”的直接对举。
- source_word: וּבוֹרֵא
  choice: 也创造
  rationale: ברא常用于上帝的创造行动；译作“创造”保留其分量，并使本节两次出现的该词译法一致。连接词按汉语对举表达为“也”。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 采用标准词义，清楚保留与“光”的反义关系。
- source_word: עֹשֶׂה שָׁלוֹם
  choice: 赐平安
  rationale: עשה语义宽泛，在此与“平安”搭配。直译“制造平安”在现代汉语中不自然，“赐平安”自然表达雅威使平安临到，同时未把שָׁלוֹם窄化为内心感受。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 该词可指和平、安宁、福祉与完整；“平安”简洁，并与后面的灾祸构成语境中的对照。
- source_word: וּבוֹרֵא רָע
  choice: 也降灾祸
  rationale: רָע在此与שָׁלוֹם相对，最可能指灾害、祸患或逆境，而非道德上的邪恶。“灾祸”保留其严峻含义；用“降”符合现代汉语对灾祸临到的表达，但脚注保留“创造灾祸”的形式对应。
- source_word: אֲנִי יְהוָה
  choice: 我雅威
  rationale: 独立代词强化自我宣告；直接音译圣名为“雅威”，保留经文中的专名。
- source_word: עֹשֶׂה כָל־אֵלֶּה
  choice: 行这一切
  rationale: 末句概括前述各项作为。“行这一切”自然、庄重，并保留雅威对所有这些事的主动施行。
theological_decisions:
- issue: רָע与上帝行动的关系
  choice: 灾祸
  alternative: 祸患；灾难；恶
  rationale: 在本节的平行对举中，רָע与שָׁלוֹם相反，语境首先指临到人的灾害、祸患或逆境。译作“恶”在现代汉语中容易被限定为道德邪恶，从而加入原文在此并未必然表达的主张；“灾祸”仍保留雅威掌管并施行逆境的神学张力。
- issue: 动词ברא用于רָע时的表达
  choice: 降灾祸，并以脚注注明“创造灾祸”
  alternative: 创造灾祸
  rationale: 原文两处均用ברא，应让读者知道这一点；但“创造灾祸”在汉语中较生硬。“降灾祸”较自然，脚注则保存词汇重复和形式上的神学力度。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为现代汉语音译，保留其作为专名的性质，不以称号代替。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以两组对举呈现原文诗体：“光／黑暗”和“平安／灾祸”。“我雅威行这一切”保留独立代词的强调和末句总括作用；脚注标记[a]已置于正文相应词后。
