source:
  edition: WLC
  text: בּ֥וֹשׁוּ וְ/גַֽם נִכְלְמ֖וּ כֻּלָּ֑/ם יַחְדָּו֙ הָלְכ֣וּ בַ/כְּלִמָּ֔ה חָרָשֵׁ֖י צִירִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/016.yaml
  text: They are put to shame and also humiliated[a], all of them together; the makers of idols go in disgrace.
translation:
  language: zh_hans
  text: 他们全都必蒙羞，也必受辱；制造偶像[a]的人必一同陷入羞愧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”或译“形像”。
    reason: צִירִים在此可指供崇拜的偶像，也可较宽泛地译作所制造的形像。
lexical_decisions:
- source_word: בּוֹשׁוּ
  choice: 必蒙羞
  rationale: בוש表示遭受羞耻或因失败而羞愧；“蒙羞”兼顾公开受辱的结果，配合先知语境用“必”表达确定将临之事。
- source_word: וְגַם נִכְלְמוּ
  choice: 也必受辱
  rationale: וגם有递加、并列之意；נכלמו与“蒙羞”意义相近而略有加强，用“受辱”保留平行与递进，又避免生硬重复。
- source_word: כֻּלָּם
  choice: 他们全都
  rationale: 明确译出第三人称复数后缀及整体性，强调无一例外。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 按马所拉重音结构，与后面的“而去”相连，表达这些人的共同结局。
- source_word: הָלְכוּ בַכְּלִמָּה
  choice: 必……含羞而去
  rationale: הלך在此描述带着某种处境离去；“含羞而去”自然表达בכלמה所指的羞辱状态。完成式结合先知宣告译为确定的将来。
- source_word: חָרָשֵׁי
  choice: 制造……的人
  rationale: חָרָשֵׁי为复数构词形，指工匠或制作者；“制造……的人”清楚自然，并突出其制作行为。
- source_word: צִירִים
  choice: 偶像
  rationale: 该词可指被制成的形像；本章上下文针对假神及其制作者，“偶像”准确传达这里带批判意味的所指，同时以脚注保留较宽的词义。
theological_decisions:
- issue: חָרָשֵׁי צִירִים所指为何
  choice: 制造偶像的人
  alternative: 制造形像的人
  rationale: 以赛亚书45章的近处语境将耶和华与人手所造之物相对照，因此正文用“偶像”表达语境中的宗教性所指；脚注保留“形像”这一较字面的可能译法，避免掩盖词汇范围。
- issue: 希伯来语完成式的时间指向
  choice: 以“必”表达确定将临的蒙羞与受辱
  alternative: 译作已经发生的“蒙羞、受辱”
  rationale: 上下文具有先知性宣告色彩，完成式可将将来结局陈述为确定事实；汉语用“必”既自然，也不把它误解为单纯的过去事件。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“蒙羞—受辱—含羞而去”保留原文密集的羞耻语义及平行推进；分号对应诗句转折，并使“制造偶像的人”作为具体所指自然显明。
