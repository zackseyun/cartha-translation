source:
  edition: WLC
  text: הַגִּ֣ידוּ וְ/הַגִּ֔ישׁוּ אַ֥ף יִֽוָּעֲצ֖וּ יַחְדָּ֑ו מִ֣י הִשְׁמִיעַ֩ זֹ֨את מִ/קֶּ֜דֶם מֵ/אָ֣ז הִגִּידָ֗/הּ הֲ/ל֨וֹא אֲנִ֤י יְהוָה֙ וְ/אֵֽין ע֤וֹד אֱלֹהִים֙ מִ/בַּלְעָדַ֔/י אֵֽל צַדִּ֣יק וּ/מוֹשִׁ֔יעַ אַ֖יִן זוּלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/021.yaml
  text: Declare it and present your case[a]; indeed, let them consult together. Who announced this from long ago? Who declared it from former times? Was it not I, Yahweh? There is no other God besides me, a righteous God and a Savior[c][b]; there is none except me.
translation:
  language: zh_hans
  text: 你们要宣告，提出你们的论据[a]；让他们一同商议吧。谁从古时就使人听见这事？谁早已宣告了它？不就是我——耶和华[b]吗？除我以外，再没有上帝；我是公义的上帝，是拯救者[c]；除我以外，再没有别的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提出你们的论据”也可译作“把它带来”或“把它呈上”；这里很可能带有法庭辩论、要求举证的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文为上帝的名字“YHWH”（יהוה）；“耶和华”是传统中文译法，也常拟音作“雅威”。
    reason: lexical_alternative
  - marker: c
    text: “公义”也可译作“公正”；“拯救者”也可译作“施行拯救的那一位”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: 宣告
  rationale: 复数命令式要求公开、正式地说出，与本节辩论和质询的语境相称。
- source_word: וְהַגִּישׁוּ
  choice: 陈明你们的案情
  rationale: נגשׁ 的使役命令式本义可指“带近、呈上”；在此争讼语境中，译为“陈明案情”自然地表达提出论据或案件，同时以脚注保留较直译的可能。
- source_word: אַף יִוָּעֲצוּ יַחְדָּו
  choice: 让他们一同商议吧
  rationale: 保留第三人称复数的转换以及集体商议、共同筹谋的劝令语气；אַף 在此起加强或推进作用，中文不必机械另译。
- source_word: מִי הִשְׁמִיעַ זֹאת מִקֶּדֶם
  choice: 谁从古时就使人听见这事
  rationale: 保留使役词形 הִשְׁמִיעַ 的“使人听见、使人知道”含义，也呈现 מִקֶּדֶם 的久远时间指向。
- source_word: מֵאָז הִגִּידָהּ
  choice: 谁早已将它宣告
  rationale: 承接前一个疑问词形成平行问句；“早已”自然表达 מאז 所指的先前时刻。
- source_word: הֲלוֹא אֲנִי יְהוָה
  choice: 不就是我——耶和华吗
  rationale: 用反问句保留 הֲלוֹא 的预期肯定回答；将圣名直接音译为现代中文通行的“耶和华”，并以脚注注明其希伯来形式。
- source_word: וְאֵין עוֹד אֱלֹהִים מִבַּלְעָדַי
  choice: 除我以外，再没有上帝
  rationale: 准确保留排他性的独一宣告；“上帝”是自然、庄重且广为理解的现代汉语称谓。
- source_word: אֵל צַדִּיק
  choice: 公义的上帝
  rationale: צַדִּיק 可表达合乎正义、正直和信实；“公义”保留其道德与审判维度，脚注说明“公正”这一语义侧重。
- source_word: וּמוֹשִׁיעַ
  choice: 又是拯救者
  rationale: 该词是使人得救、施行拯救者的分词称谓；“拯救者”比名词化程度较高的传统称号更直接，也保留行动者含义。
- source_word: אַיִן זוּלָתִי
  choice: 除我以外，再没有别的
  rationale: 保留末句再次强调的排他性，又避免在中文中强行补出原文未重复的“上帝”或“拯救者”。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；耶和华（上主）
  rationale: 原文明确使用四字神名。正文采用现代中文圣经读者最熟悉的专名“耶和华”，而不是用普通称号替代；脚注交代希伯来字母形式及另一常见拟音，以免把读音问题说得过于确定。
- issue: צַדִּיק 用于上帝时的含义
  choice: 公义的上帝
  alternative: 公正的上帝
  rationale: 该词既可突出上帝自身的正直、公义，也可突出其判断和作为的公正。正文采用涵盖面较广的“公义”，脚注保留“公正”的合法语义侧重。
- issue: 上帝的公义与拯救并列
  choice: 我是公义的上帝，又是拯救者
  alternative: 一位公义并施行拯救的上帝
  rationale: 原文将 אֵל צַדִּיק 与 וּמוֹשִׁיעַ 并列，既不把公义与拯救对立，也不说明二者关系的具体机制；译文保留这种并置和神学张力。
translation_notes:
  register: 采用现代标准普通话的庄重书面语，句式清楚而不过度古雅。开头保留争讼、举证的语境；两个平行问句和两次排他宣告均予保留。正文中的所有脚注标记均与脚注项目对应。
