reference: Isaiah 45:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְ֠הוָה בּוֹרֵ֨א הַ/שָּׁמַ֜יִם ה֣וּא הָ/אֱלֹהִ֗ים יֹצֵ֨ר הָ/אָ֤רֶץ וְ/עֹשָׂ/הּ֙ ה֣וּא כֽוֹנְנָ֔/הּ לֹא תֹ֥הוּ בְרָאָ֖/הּ לָ/שֶׁ֣בֶת יְצָרָ֑/הּ אֲנִ֥י יְהוָ֖ה וְ/אֵ֥ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/018.yaml
  text: 'For thus says Yahweh[a], who created the heavens—he is God—who formed the earth and made it, he established it; he did not create it as a wasteland, but formed it to be inhabited: I am Yahweh, and there is no other.'
translation:
  language: zh_hans
  text: 因为创造诸天的耶和华——他是上帝——如此说：他塑造大地，造了它；他使它坚立。他创造它，不是要使它成为荒芜[a]，而是要使它有人居住。我是耶和华，除我以外再没有别的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荒芜”也可译作“空虚”“混沌”或“无定形”。希伯来语 תֹהוּ 可指空无、荒凉或无定形的状态；本节与“有人居住”相对，因此正文译作“荒芜”。
    reason: 说明原词的语义范围，并交代上下文为何支持正文译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经读者熟悉的神名音译“耶和华”，保留专名性质，不以“主”这一称号替代。
- source_word: בּוֹרֵא הַשָּׁמַיִם
  choice: 创造诸天
  rationale: 分词在此描述耶和华的身份和作为；“诸天”既反映希伯来语复数形式，也符合以赛亚书的宇宙创造语境。
- source_word: הוּא הָאֱלֹהִים
  choice: 他是上帝
  rationale: 保留独立而强调的认同句，不提前增译“独一”，因为排他性在句末另有明确表达。
- source_word: יֹצֵר הָאָרֶץ
  choice: 塑造大地
  rationale: “塑造”保留 יצר 所含的有意塑形意味；宇宙创造语境中的 הָאָרֶץ 译作“大地”，而非局部的“土地”。
- source_word: וְעֹשָׂהּ
  choice: 又造了大地
  rationale: עשה 含义宽泛，“造”简洁自然；重复“大地”可避免现代汉语连续代词指代不清。
- source_word: הוּא כוֹנְנָהּ
  choice: 并使它稳固
  rationale: כון 在此表示使之坚立、稳固；此译法比抽象的“建立它”更清楚地传达稳定含义。
- source_word: תֹהוּ
  choice: 荒芜
  rationale: 本节以“让人居住”作对照，因此重点是荒凉、不可居住的状态；“荒芜”较“空虚”或“混沌”更贴合上下文，同时以脚注保留语义范围。
- source_word: לָשֶׁבֶת יְצָרָהּ
  choice: 而是塑造它，让人居住
  rationale: 目的性不定式译为“让人居住”，自然表达大地被塑造的用途，并重复“塑造”以保留与前文 יֹצֵר 的词根联系。
- source_word: וְאֵין עוֹד
  choice: 再没有别的
  rationale: 保留希伯来语简洁而绝对的排他声明；所省略的对象由“我是耶和华”自然限定，不擅自补入解释性名词。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是现代中文圣经传统中广为识别的专名形式，能够保留经文所用神名而不是以称号替代；不据此加入额外的宗派解释。
- issue: תֹהוּ 在创造目的陈述中的含义
  choice: 荒芜
  alternative: 空虚；混沌；无形
  rationale: 后句“让人居住”构成直接对照，显示这里着重于不适合居住的荒凉状态，而非明确论述创造过程中的无形阶段；脚注保留该词真实的语义宽度。
- issue: הוּא הָאֱלֹהִים 的强调作用
  choice: 他是上帝
  alternative: 他是那位上帝；唯有他是上帝
  rationale: 直译认同句，既保留强调，也不把句末“再没有别的”的排他含义提前并入本句。
- issue: וְאֵין עוֹד 的省略与排他性
  choice: 再没有别的
  alternative: 再没有别神；除我以外再没有上帝
  rationale: 原文没有明说所省略的名词，因此保留简洁表达及其语境所产生的神学张力，不擅自补足。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以分号和破折号呈现原文层层展开的宣告结构；为避免代词含混，第二次提及地时重复“大地”。保留“创造／塑造／造／使稳固”的动词差异，并使句末神谕具有应有的强调力度。
