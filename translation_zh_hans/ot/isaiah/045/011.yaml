  text: כֹּֽה אָמַ֧ר יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/יֹצְר֑/וֹ הָ/אֹתִיּ֣וֹת שְׁאָל֔וּ/נִי עַל בָּנַ֛/י וְ/עַל פֹּ֥עַל יָדַ֖/י תְּצַוֻּֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/011.yaml
  text: 'Thus says Yahweh[a], the Holy One of Israel and his Maker: Ask me about the things to come concerning my sons[c][b], and command me concerning the work of my hands.'
translation:
  language: zh_hans
  text: '耶和华——以色列的圣者、以色列的塑造者——如此说：


    “关于将要发生的事，问我吧；

    关于我的众子[a]，

    以及我双手所做的工，你们要吩咐我。[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的众子”也可能集体指上帝的子民以色列。
    reason: lexical_alternative
  - marker: b
    text: 原文的“吩咐我”语气刻意强烈。结合上下文，有人将此句理解为责问：“至于我双手所做的工，你们竟要吩咐我吗？”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，保留上帝盟约之名的专属性。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 准确保留先知书中这一固定称号及其属格结构。
- source_word: וְיֹצְרוֹ
  choice: 塑造以色列的主
  rationale: 原文后缀为第三人称阳性单数，指向紧邻的“以色列”；中文若直译“塑造他的那一位”容易误解，因此明示所指，同时保留“塑造”的造物意象。
- source_word: הָאֹתִיּוֹת
  choice: 将要发生的事
  rationale: 此处按预言语境理解为即将来到或发生的事，而非“字母”；该译法自然且保留时间指向。
- source_word: שְׁאָלוּנִי
  choice: 你们可以问我
  rationale: 保留复数命令形式；结合全句可能具有反诘语气，用“可以问我”避免在中文中形成生硬而误导的许可口吻。
- source_word: עַל בָּנַי
  choice: 关于我的众子
  rationale: 保留原文阳性复数“众子”，不径自中性化为“儿女”，同时以脚注说明可能集体指以色列民。
- source_word: פֹּעַל יָדַי
  choice: 我双手所做的工
  rationale: 保留原文具体的“双手”意象和创造、施行之工的含义。
- source_word: תְּצַוֻּנִי
  choice: 你们竟要吩咐我吗
  rationale: 保留动词“吩咐、命令”的强烈含义，并按上下文以反诘表达其挑衅性语气；“竟”体现责问，但不改换核心词义。
theological_decisions:
- issue: 末句是否表示人可以命令上帝
  choice: 译作反诘“你们竟要吩咐我吗？”
  alternative: 直陈“你们要吩咐我”或命令式“你们吩咐我吧”
  rationale: 希伯来文动词形式本身可呈命令或未完成体，句中没有书面问号；但上下文责备受造者与造物主争辩，反诘理解很有根据。正文保留“吩咐我”的刺耳张力，脚注同时交代直陈/命令式可能。
- issue: בָּנַי 的所指与性别表达
  choice: 正文译“我的众子”
  alternative: 译“我的儿女”或“我的子民”
  rationale: 原文明确为阳性复数；可能集体指上帝的以色列子民，但不在正文中把解释直接取代原词。
- issue: וְיֹצְרוֹ 的代词所指
  choice: 明示为“塑造以色列的主”
  alternative: “塑造他的那一位”或“以色列的创造主”
  rationale: 第三人称阳性单数最自然回指“以色列”。明示所指符合中文表达，又不把“塑造”泛化为抽象头衔。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以诗行呈现平行结构；“圣者”“塑造”“双手所做的工”保留以赛亚书的先知性与创造意象。正文中的所有脚注标记均与脚注对应。
