id: ISA.45.1
reference: Isaiah 45:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּה אָמַ֣ר יְהוָה֮ לִ/מְשִׁיח/וֹ֮ לְ/כ֣וֹרֶשׁ אֲשֶׁר הֶחֱזַ֣קְתִּי בִֽ/ימִינ֗/וֹ לְ/רַד לְ/פָנָי/ו֙ גּוֹיִ֔ם וּ/מָתְנֵ֥י מְלָכִ֖ים אֲפַתֵּ֑חַ לִ/פְתֹּ֤חַ לְ/פָנָי/ו֙ דְּלָתַ֔יִם וּ/שְׁעָרִ֖ים לֹ֥א יִסָּגֵֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/001.yaml
  text: 'Thus says Yahweh to his anointed[a], to Cyrus, whose right hand I have grasped, to subdue nations before him and to loosen the loins of kings, to open doors before him[c][b], and gates shall not be shut:'
translation:
  language: zh_hans
  text: '耶和华对他的受膏者[a]居鲁士如此说：


    “我握住他的右手，

    使列国降服在他面前；

    我要解开君王的腰带[b]，

    为他打开双扇门[c]，

    城门必不关闭。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受膏者”所对应的希伯来词，与后来通常译作“弥赛亚”的词同源；这里指耶和华为这项使命所任用的居鲁士。
    reason: 说明词汇联系，并避免将后来的专门称号直接套用于居鲁士。
  - marker: b
    text: 直译为“解开君王的腰”；这是削弱君王、使其惊惶或解除其武装的形象说法。
    reason: 原文习语在汉语中需要说明，同时保留其可能含义。
  - marker: c
    text: “门”在希伯来文中是双数形式，可能特指一对门扇。
    reason: 交代原文的双数形态及其可能含义。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告的固定格式和庄重语气，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神圣名译法，区别于一般称号“主”。
- source_word: לִמְשִׁיחוֹ
  choice: 对他的受膏者
  rationale: מָשִׁיחַ本义为受膏、受任命的人；此处明确指居鲁士。译作“受膏者”既保留与后来“弥赛亚”用语的词源联系，也不把后来的专门含义直接套入此处。
- source_word: לְכוֹרֶשׁ
  choice: 居鲁士
  rationale: 采用该波斯君王在现代标准汉语中的通行译名。
- source_word: אֲשֶׁר הֶחֱזַקְתִּי בִימִינוֹ
  choice: 我握住他的右手
  rationale: 保留原文具体意象，表达耶和华扶持、引导并赋予他能力。
- source_word: לְרַד לְפָנָיו גּוֹיִם
  choice: 使列国降服在他面前
  rationale: רדה在此具有制伏、辖制的军事政治含义；“使……降服”自然传达目的关系。
- source_word: וּמָתְנֵי מְלָכִים אֲפַתֵּחַ
  choice: 我要解开君王腰间的带子
  rationale: 原文直指君王的腰部被解开；补出“带子”使意象在汉语中可理解，又不在正文中把隐喻直接解释成“削弱”或“解除武装”。
- source_word: דְּלָתַיִם
  choice: 双扇门
  rationale: 该词为双数形式，可指成对的两扇门；“双扇门”保留这一形态信息。
- source_word: וּשְׁעָרִים לֹא יִסָּגֵרוּ
  choice: 使城门不再关闭
  rationale: שְׁעָרִים在征服城市的语境中自然指城门；保留被动关闭的结果意义。
theological_decisions:
- issue: 以居鲁士为מָשִׁיחַ（受膏者）
  choice: 他的受膏者
  alternative: 他的弥赛亚
  rationale: 原文把通常具有神圣任命意味的称谓用于一位外邦君王，形成真实的神学张力。“受膏者”保留这种任命含义与词汇联系，却避免让现代读者误以为这里直接把居鲁士等同于后来专称的弥赛亚。
- issue: 君王腰间被解开的意象
  choice: 保留“解开……腰间的带子”的具体形象
  alternative: 使君王软弱／解除君王的武装
  rationale: 原文意象可能涵盖削弱、使惊惶或解除武装等意思；正文不将其限定为单一解释，脚注说明其语用范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分行形式呈现诗体宣告；正文保留“受膏者”“握住右手”和“解开腰间带子”等核心意象，并借脚注说明容易误解的词义与希伯来文形式。
