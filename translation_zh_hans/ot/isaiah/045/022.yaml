  text: פְּנוּ אֵלַ֥/י וְ/הִוָּשְׁע֖וּ כָּל אַפְסֵי אָ֑רֶץ כִּ֥י אֲנִי אֵ֖ל וְ/אֵ֥ין עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/022.yaml
  text: Turn to me and be saved[a], all the ends of the earth; for I am God, and there is no other.
translation:
  language: zh_hans
  text: 地极的众人哪，你们都要转向我，就必得救[a]；因为我是上帝，再没有别的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们都要仰望我，就必得救。”希伯来语动词可以表示转向某人；在本句语境中，也可能包含把目光投向上帝的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ
  choice: 转向
  rationale: פנה 的复数祈使式表示转身或朝向某人；“转向我”自然保留方向性的召唤，又不把词义限缩为视觉上的“仰望”。
- source_word: אֵלַי
  choice: 向我
  rationale: 介词 אֶל 加第一人称单数词尾表示朝向说话者；与“转”合译为“转向我”，符合现代汉语。
- source_word: וְהִוָּשְׁעוּ
  choice: 就必得救
  rationale: 这是 ישׁע 的尼法勒复数祈使式，表达领受拯救而非自我拯救；“得救”保留被动意义，“就必”在汉语中自然呈现与前一命令相连的结果性应许。
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: 地极的人……都
  rationale: אַפְסֵי אָרֶץ 指大地最远之处；希伯来语直接呼告“所有地极”，汉语补出“的人”可清楚表明受召者是遍及最远地区的万民，而“都”对应 כָּל。
- source_word: כִּי
  choice: 因为
  rationale: 引出这项普世召唤的根据，现代汉语用“因为”清楚自然。
- source_word: אֲנִי אֵל
  choice: 我是上帝
  rationale: אֵל 在此是“上帝”这一普通称号，不作为专名音译；没有在本分句增添原文未明说的“独一”。
- source_word: וְאֵין עוֹד
  choice: 再没有别的
  rationale: 该习语宣告上帝的绝对独一性；“再没有别的”保留原文未明说宾语的简洁表达，不擅自补入“上帝”或“在我以外”。
theological_decisions:
- issue: 上帝的独一性／一神论宣告
  choice: 再没有别的
  alternative: 除我以外，再没有上帝
  rationale: 原文以简短绝对句 וְאֵין עוֹד 宣告上帝的独一，并以此作为普世得救呼召的根据。译文保留其神学力度，同时不补入希伯来文隐含而未明说的“我”或“上帝”。
- issue: 命令与得救之间的关系
  choice: 你们都要转向我，就必得救
  alternative: 你们都要转向我，并且得救
  rationale: 两个复数祈使式并列，形式上均带命令色彩，但语境可让第二项自然表达转向上帝所带来的救恩。汉语“就必得救”保留救恩由上帝赐下的被动意义，且避免生硬地把“得救”理解成靠人完成的第二项行动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“地极的人哪”保留先知书普世呼告的气势；“上帝”用于 אֵל。“转向”作为正文较贴近原词的方向性含义，“仰望”列入脚注以保留可能的视觉内涵。
