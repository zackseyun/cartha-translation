id: ISA.45.14
reference: Isaiah 45:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה יְגִ֨יעַ מִצְרַ֥יִם וּֽ/סְחַר כּוּשׁ֮ וּ/סְבָאִים֮ אַנְשֵׁ֣י מִדָּה֒ עָלַ֤יִ/ךְ יַעֲבֹ֨רוּ֙ וְ/לָ֣/ךְ יִֽהְי֔וּ אַחֲרַ֣יִ/ךְ יֵלֵ֔כוּ בַּ/זִּקִּ֖ים יַעֲבֹ֑רוּ וְ/אֵלַ֤יִ/ךְ יִֽשְׁתַּחֲוּוּ֙ אֵלַ֣יִ/ךְ יִתְפַּלָּ֔לוּ אַ֣ךְ בָּ֥/ךְ אֵ֛ל וְ/אֵ֥ין ע֖וֹד אֶ֥פֶס אֱלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/014.yaml
  text: 'Thus says Yahweh: The wealth of Egypt and the merchandise of Cush and the Sabeans[a], men of great stature, will pass over to you and will be yours; they will walk behind you, they will pass over in chains; they will bow down to you, they will pray to you: ‘Surely God is in you, and there is no other[b]; there is no other god.’'
translation:
  language: zh_hans
  text: '耶和华如此说：

    “埃及的财富、古实[a]的货物，

    以及身材高大的西巴人，

    都要来到你这里，归你所有；

    他们要跟在你身后，

    戴着锁链来到你这里。

    他们要向你下拜，向你祈求[b]说：

    ‘上帝确实在你中间，

    此外再没有别的；

    再没有别的神。’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实”是希伯来文地名，所指地区大致在埃及以南的尼罗河上游一带；一些传统译本译作“埃塞俄比亚”。
    reason: cultural_note
  - marker: b
    text: “向你祈求”也可译作“恳求你”。这个希伯来动词既可指祷告，也可指迫切求告。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确保留四字神名，而不以“主”代替。
- source_word: יְגִיעַ מִצְרַיִם
  choice: 埃及的财富
  rationale: יְגִיעַ可指劳作所得、收益或财富；此处与商业货物平行，“财富”自然地概括埃及的物质出产。
- source_word: סְחַר כּוּשׁ
  choice: 古实的货物
  rationale: סְחַר在此指贸易所得或商品；“货物”保留具体的经济含义，并与“财富”形成平行。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 按希伯来地名音译，避免直接等同于范围并不完全相同的现代埃塞俄比亚。
- source_word: סְבָאִים
  choice: 西巴人
  rationale: 以族名音译，表达来自西巴的族群，不与“示巴人”混同。
- source_word: אַנְשֵׁי מִדָּה
  choice: 身材高大的西巴人
  rationale: 该短语直指“有身量的人”，在语境中表示体格高大；中文如此表达清楚自然。
- source_word: עָלַיִךְ יַעֲבֹרוּ וְלָךְ יִהְיוּ
  choice: 都要来到你这里，归你所有
  rationale: 兼顾向受话者移动与归属、受其支配两层意思；中文不强行确定这种转移是进贡、臣服还是被掳。
- source_word: אַחֲרַיִךְ יֵלֵכוּ
  choice: 他们要跟在你身后
  rationale: 保留原文具体的空间图像，而不只抽象译为“跟随你”。
- source_word: בַּזִּקִּים
  choice: 戴着锁链
  rationale: 清楚表达被镣铐束缚的状态，同时保持庄重、易懂的现代汉语。
- source_word: וְאֵלַיִךְ יִשְׁתַּחֲוּוּ
  choice: 他们要向你下拜
  rationale: 该动词既可表示俯伏致敬，也可在特定语境中表示敬拜；受话者为阴性单数，译作“下拜”保留动作而不预先断定其神学性质。
- source_word: אֵלַיִךְ יִתְפַּלָּלוּ
  choice: 向你祈求
  rationale: יִתְפַּלָּלוּ通常与祷告相关，但这里明确以第二人称阴性单数为对象，也可理解为恳求；“祈求”保留宗教语感及向人恳求的可能性，并以脚注说明。
- source_word: אַךְ בָּךְ אֵל
  choice: 上帝确实在你中间
  rationale: בָּךְ可表示“在你里面／中间”；中文“在你中间”适合群体或城邑受话者，同时不把其确切身份写入正文。אַךְ在此表达确认，译作“确实”。
- source_word: וְאֵין עוֹד אֶפֶס אֱלֹהִים
  choice: 此外再没有别的；再没有别的神
  rationale: 保留原文连续两重否定的强调，并将末尾אֱלֹהִים按“神明”这一普通名词语义译作“神”。
theological_decisions:
- issue: “下拜”是否应直接译成“敬拜”
  choice: 译作“向你下拜”
  alternative: 向你敬拜；俯伏在你面前
  rationale: 原文动作可用于敬拜，也可用于向人表示臣服。这里受话对象是阴性单数，而随后宣认上帝在其“中间”；“下拜”不会把对受话者的举动提前定性为对其施行神圣敬拜。
- issue: יִתְפַּלָּלוּ是向受话者祷告还是向其恳求
  choice: 正文译作“向你祈求”，脚注保留“恳求你”
  alternative: 向你祷告；恳求你
  rationale: 原文语法明确指向第二人称阴性单数，但动词在此语境中的宗教含义与一般恳求含义存在张力。“祈求”较能兼容两者，脚注则公开另一种合理理解。
- issue: 末句אֱלֹהִים应作专名式“上帝”还是类别名词“神”
  choice: 译作“再没有别的神”
  alternative: 再没有别的上帝
  rationale: 这句话否认任何其他神明存在，末词在句法上适合作类别名词；小写与大写的英语问题在中文不存在，但用“神”可保留普通名词功能。
- issue: 第二人称阴性单数所指是谁
  choice: 正文仅保留“你”，不点明身份
  alternative: 锡安；耶路撒冷；以色列
  rationale: 希伯来语显示受话者为阴性单数，但本节本身没有明说名称；为避免替原文消除指代张力，不在正文补出特定对象。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。诗行保留原文的平行与重复，尤其是“来到你这里”和双重“再没有”；不在正文补明阴性单数“你”的身份，也不淡化“戴着锁链”所呈现的臣服或被掳图像。
