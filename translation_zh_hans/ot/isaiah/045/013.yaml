id: ISA.45.13
reference: Isaiah 45:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָנֹכִי֙ הַעִירֹתִ֣/הֽוּ בְ/צֶ֔דֶק וְ/כָל דְּרָכָ֖י/ו אֲיַשֵּׁ֑ר הֽוּא יִבְנֶ֤ה עִירִ/י֙ וְ/גָלוּתִ֣/י יְשַׁלֵּ֔חַ לֹ֤א בִ/מְחִיר֙ וְ/לֹ֣א בְ/שֹׁ֔חַד אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/013.yaml
  text: I have stirred him up in righteousness[a], and I will make all his ways straight. He will rebuild my city and send my exiles away, not for a price and not for a bribe[c][b], says Yahweh of Armies.
translation:
  language: zh_hans
  text: 我以公义兴起了他[a]；我要使他一切的道路平直。他必重建[b]我的城，释放我被掳的子民；不用价银，也不用贿赂。万军之耶和华如此说。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兴起”也可译作“唤起”或“激发”。
    reason: 希伯来动词可表示使人醒起、行动或承担使命。
  - marker: b
    text: “重建”原文直译为“建造”；这里根据耶路撒冷恢复的历史语境译作“重建”。
    reason: 说明正文中的语境性补足，避免掩盖希伯来动词本身较宽泛的含义。
  - marker: c
    text: “万军”指受耶和华统辖的众军；传统也常译作“万军之主”。
    reason: 解释称号“万军之耶和华”的构成及常见替代译法。
lexical_decisions:
- source_word: הַעִירֹתִהוּ
  choice: 兴起了他
  rationale: 该词是 עור 的使役式，可表示唤起、激发或兴起。上下文指耶和华使这位受膏者起来执行使命；“兴起”自然地保留神主动促成的含义，同时不在正文中明说居鲁士。
- source_word: בְצֶדֶק
  choice: 凭公义
  rationale: 介词短语可表达行动所依据的原则或方式；“凭公义”既保留 צדק 的道德与司法意味，也不把它限缩为单纯的“公正”。
- source_word: אֲיַשֵּׁר
  choice: 修直
  rationale: ישר 的加强式意为使之笔直、平坦或顺畅。“修直道路”保留原文的道路意象，并暗示神为他的行动开路。
- source_word: דְּרָכָיו
  choice: 他一切的道路
  rationale: 直译为“他的道路”，既可指实际路径，也可比喻他的行程和作为；译文保留这种开放性。
- source_word: יִבְנֶה עִירִי
  choice: 重建我的城
  rationale: בנה 本义为“建造”，但历史语境涉及被毁之城的恢复，因此“重建”在现代汉语中更准确地传达语境所指；脚注保留形式上更直接的译法。
- source_word: גָלוּתִי
  choice: 我被掳的子民
  rationale: 该词既可指被掳这一状态，也可指被掳群体。与“释放”连用时，指人群最为自然；补出“子民”使现代汉语清楚流畅。
- source_word: יְשַׁלֵּחַ
  choice: 释放
  rationale: שלח 的加强式在此可表示放走、遣出或释放。“释放”准确表达被掳者获准离去，又不擅自补明返回的目的地。
- source_word: לֹא בִמְחִיר וְלֹא בְשֹׁחַד
  choice: 不收取价银，也不接受贿赂
  rationale: 分别保留 מחיר 的交易代价和 שׁחד 的贿赂含义；加入与主语相应的动词，使汉语自然，并凸显这次释放并非通过赎价或利诱换取。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”呈现专名 יהוה；“万军”是 צבאות 在中文圣经语域中清楚、庄重而广为理解的表达。
theological_decisions:
- issue: 是否在正文中明说“居鲁士”
  choice: 保留“他”
  alternative: 译作“居鲁士”
  rationale: 本节希伯来文只用代词，所指人物由上下文辨明。保留代词尊重本节措辞，避免将解释性身份直接写入正文。
- issue: בְצֶדֶק 表示神行动的方式、依据还是目的
  choice: 译作“凭公义”，不进一步限定
  alternative: “为成就公义”或“按公正”
  rationale: 原介词短语容许方式、规范或目的色彩。“凭公义”保留其神学张力，不把它静默收窄为某一种关系。
- issue: 神名 יהוה 的呈现
  choice: 耶和华
  alternative: 上主
  rationale: 原文直接使用四字神名；用中文常见音译“耶和华”呈现其专名性质，而非以称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式略带宣告体，以配合先知话语；避免生硬照搬希伯来语序。正文保留道路意象和代词指称，并用脚注交代“兴起／唤起”及“建造／重建”的真实词义空间。
