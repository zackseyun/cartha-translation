  text: אַ֧ךְ בַּ/יהוָ֛ה לִ֥/י אָמַ֖ר צְדָק֣וֹת וָ/עֹ֑ז עָדָי/ו֙ יָב֣וֹא וְ/יֵבֹ֔שׁוּ כֹּ֖ל הַ/נֶּחֱרִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/024.yaml
  text: Only in Yahweh[a], it shall be said of me, are righteousness and strength; to him they shall come[b], and all who were enraged against him shall be put to shame.
translation:
  language: zh_hans
  text: '“人必论到我说：‘唯有在雅威那里有公义[b]和力量。’”[a]


    人必到他那里；所有向他发怒的，都必蒙羞。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文句法凝练，也可译作：“人必说：‘唯有在雅威那里有公义和力量。’”或“他对我说：‘唯有在雅威那里有公义和力量。’”
    reason: alternative_reading
  - marker: b
    text: “公义”的希伯来文为复数，也可理解为“公义的作为”或“伸张正义的行动”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 唯独
  rationale: 在这里表示排他性的强调，指出公义和力量唯独在雅威里面。
- source_word: בַּיהוָה
  choice: 在雅威里面
  rationale: 介词 בְּ 表示公义和力量所在的范围或源头；יהוה 采用音译“雅威”，保留神的专名。
- source_word: לִי אָמַר
  choice: 人必这样论到我说
  rationale: 原文是高度凝练且句法含混的表达；此译法保留“论到我”的第一人称成分和引述性质，同时不指定说话者。
- source_word: צְדָקוֹת
  choice: 公义
  rationale: 原文为复数，可指公义的作为或伸张正义的行动；正文用现代汉语较自然的集合性抽象名词“公义”，复数含义另见脚注。
- source_word: עֹז
  choice: 力量
  rationale: 表达能力、强力或大能；“力量”与“公义”并列自然，也便于普通读者理解。
- source_word: עָדָיו יָבוֹא
  choice: 人都必到他那里
  rationale: 动词形式为单数，主语未明，可作不定或集合性理解；结合下句复数群体，译成泛指的“人都”较为自然。
- source_word: וְיֵבֹשׁוּ
  choice: 都必蒙羞
  rationale: בוש 在审判语境中表示遭受羞辱、落得羞愧；“蒙羞”保留其结果性。
- source_word: הַנֶּחֱרִים בּוֹ
  choice: 向他发怒的
  rationale: 分词源于 חרה，描写怒火中烧；介词短语表明怒气指向他。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”可表明这是神的专名，并避免以称号代替原文专名。
- issue: צְדָקוֹת 的神学语义范围
  choice: 公义
  alternative: 公义的作为；伸张正义的行动
  rationale: “公义”保留品格、合宜秩序、拯救与伸冤行动等较宽的语义范围，不把它限缩为单一法庭概念。
- issue: לִי אָמַר 的句法归属
  choice: 人必这样论到我说
  alternative: 他对我说；人必说“唯独在雅威里面才有公义和力量”
  rationale: 原文可能把 לִי 理解为“论到我”或“对我”，也可能与引语关系不同。正文采用契合上下文的报告式理解，脚注保留其他可能。
- issue: 从第一人称“我”转为第三人称“他”
  choice: 保留人称转换
  alternative: 统一改作第一人称或第三人称
  rationale: 希伯来文确实从 לִי（我）转为 עָדָיו/בּוֹ（他）；不在译文中擅自抹平这种诗歌中的人称转换。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“才有”与“唯独”呼应，体现排他性；保留原文由“我”转为“他”的人称变化。两个脚注标记均置于正文中，但第二个放在整节末尾，避免打断诗句节奏。
