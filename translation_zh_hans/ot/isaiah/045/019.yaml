source:
  edition: WLC
  text: לֹ֧א בַ/סֵּ֣תֶר דִּבַּ֗רְתִּי בִּ/מְקוֹם֙ אֶ֣רֶץ חֹ֔שֶׁךְ לֹ֥א אָמַ֛רְתִּי לְ/זֶ֥רַע יַעֲקֹ֖ב תֹּ֣הוּ בַקְּשׁ֑וּ/נִי אֲנִ֤י יְהוָה֙ דֹּבֵ֣ר צֶ֔דֶק מַגִּ֖יד מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/019.yaml
  text: I did not speak in secret[a], in a land of darkness; I did not say to the offspring of Jacob, ‘Seek me in vain.’ I, Yahweh, speak righteousness[b], declaring what is upright.
translation:
  language: zh_hans
  text: '我没有在隐秘中、在黑暗之地说话；


    我没有对雅各的后裔说：


    “你们徒然寻求我[a]。”


    我，耶和华，宣讲公义[b]，


    宣告正直之事。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们白费地寻求我。”希伯来语“徒然”也可表示空虚、虚无或混沌；这里的意思是，寻求耶和华并非毫无结果。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我耶和华说正当的话”或“说公正的话”。希伯来语“公义”可包含公义、正当和公正等含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַסֵּתֶר
  choice: 在隐秘中
  rationale: סֵתֶר表示隐蔽、隐秘之处或秘密状态；“在隐秘中”保留空间意象，也与本节强调耶和华公开、可信的启示形成对照。
- source_word: בִּמְקוֹם אֶרֶץ חֹשֶׁךְ
  choice: 在黑暗之地
  rationale: 原文较直译为“在黑暗之地的某处”；中文采用“在黑暗之地”，保留黑暗地域的意象，同时避免生硬重复。
- source_word: לְזֶרַע יַעֲקֹב
  choice: 对雅各的后裔
  rationale: זֶרַע在此是集合用法，指雅各的子孙；“后裔”自然且保留群体含义。
- source_word: תֹּהוּ
  choice: 徒然
  rationale: תֹהוּ可表示空虚、虚无、混沌或徒劳；在“寻求我”的语境中，重点是寻求耶和华并非徒劳无功。
- source_word: בַקְּשׁוּנִי
  choice: 你们寻求我吧
  rationale: 这是带第一人称宾语后缀的复数祈使式；补出“你们”并用“吧”自然表达直接命令。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名音译，保留其作为专名而非普通称号的功能。
- source_word: דֹּבֵר צֶדֶק
  choice: 所说的是公义
  rationale: צֶדֶק涵盖公义、正当与公正；保留名词“公义”，不将其范围缩窄为单纯“真实”或司法意义的“正义”。
- source_word: מַגִּיד מֵישָׁרִים
  choice: 所宣告的是正直
  rationale: מֵישָׁרִים字面涉及平直、正直之事；“正直”与前句“公义”平行，并保留道德与可靠性的色彩。
theological_decisions:
- issue: 末句中耶和华自我描述的含义
  choice: 我耶和华所说的是公义，所宣告的是正直
  alternative: 我耶和华说正义的话，宣告正直的事
  rationale: 原文的צֶדֶק与מֵישָׁרִים既可指抽象的公义、正直，也可指公正、正确的话或事。正文保留名词表达，以维持其道德、盟约和言语可靠性之间的张力，不限定为单一司法或命题层面的含义。
- issue: “寻求我”与תֹּהוּ的关系
  choice: “你们寻求我吧，却是徒然”置于否定性引语之内
  alternative: “你们在虚无之地寻求我”
  rationale: 语序允许保留一定诗性张力，但上下文最自然地表达耶和华并未吩咐雅各后裔作徒劳的寻求；不把תֹּהוּ解释为一个具体地名或宇宙混沌。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。诗行保留希伯来文的平行结构；“我耶和华”维持神圣宣告的郑重语气。“在隐秘中、在黑暗之地”共享“说话”这一谓语，既贴近原文句法，也避免误增第二个独立动作。
