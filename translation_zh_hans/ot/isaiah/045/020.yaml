  text: הִקָּבְצ֥וּ וָ/בֹ֛אוּ הִֽתְנַגְּשׁ֥וּ יַחְדָּ֖ו פְּלִיטֵ֣י הַ/גּוֹיִ֑ם לֹ֣א יָדְע֗וּ הַ/נֹּֽשְׂאִים֙ אֶת עֵ֣ץ פִּסְלָ֔/ם וּ/מִתְפַּלְלִ֔ים אֶל אֵ֖ל לֹ֥א יוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/020.yaml
  text: Gather yourselves and come[a]; draw near together, you survivors of the nations. They have no knowledge[c][b], those who carry the wood of their carved image and pray to a god that cannot save.
translation:
  language: zh_hans
  text: 列国中逃脱的人哪，你们要聚集前来，一同上前[a]！那些抬着木头雕成的偶像[b]、向不能施救的神祷告[c]的人，毫无知识。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要集合起来，前来，一同上前。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“他们雕像的木头”，指木制的偶像。
    reason: lexical_alternative
  - marker: c
    text: “不能施救”或译“不施救”。
    reason: alternative_reading
lexical_decisions:
- source_word: הִקָּבְצוּ וָבֹאוּ
  choice: 要聚集前来
  rationale: 两个复数命令动词构成召集；“聚集前来”在现代汉语中自然简洁，也保留了聚拢并来到的双重动作。
- source_word: הִתְנַגְּשׁוּ יַחְדָּו
  choice: 一同走近
  rationale: הִתְנַגְּשׁוּ 是 נגש 的 Hitpael 命令式，在此表示靠近、上前；יַחְדָּו 表示共同采取行动。
- source_word: פְּלִיטֵי הַגּוֹיִם
  choice: 列国中逃脱的人
  rationale: פְּלִיטֵי 指逃脱灾难而存留的人；“逃脱的人”兼顾逃亡与幸存之意，“列国中”清楚表达其群体范围。
- source_word: לֹא יָדְעוּ
  choice: 毫无知识
  rationale: 直陈这些人的无知，保留先知话语中带有责备意味的概括判断，而不另行补足他们“不知道”的具体内容。
- source_word: הַנֹּשְׂאִים
  choice: 那些抬着……的人
  rationale: 分词描述持续或惯常行为；“抬着”适合携带木制神像的具体场景，并体现偶像反而需要人搬运的讽刺。
- source_word: עֵץ פִּסְלָם
  choice: 木头雕成的偶像
  rationale: 希伯来语直译近于“他们雕像的木头”。正文采用自然汉语，同时保留偶像是木制人造物的论战锋芒。
- source_word: וּמִתְפַּלְלִים אֶל אֵל
  choice: 向一个……的神祷告
  rationale: 保留 אֵל 的“神”称谓及其反讽作用，不直接改写为“偶像”，以呈现列国敬拜者自认所求告的对象。
- source_word: לֹא יוֹשִׁיעַ
  choice: 不能施救
  rationale: ישׁע 的 Hiphil 表示拯救、解救；上下文着重揭露该神毫无救助能力。“施救”简洁庄重，也不限定所救脱的具体灾祸。
theological_decisions:
- issue: אֵל לֹא יוֹשִׁיעַ 对假神救助能力的否定
  choice: 一个不能施救的神
  alternative: 一个不施救的神
  rationale: “神”保留原文的反讽性称谓，并不承认偶像是真神；“不能施救”表达偶像的无能。由于 לֹא יוֹשִׁיעַ 在形式上也可译为“不施救”，脚注保留这一较贴近表层语法的译法。
translation_notes:
  register: 采用现代、庄重而易懂的召唤语体。以“前来”“走近”呈现连续命令，以“毫无知识”保留先知式责备；不把 אֵל 直接替换成带宗派解释色彩的术语。
