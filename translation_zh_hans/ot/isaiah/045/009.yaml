base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/009.yaml
  text: Woe to the one who contends with his Maker— a potsherd among the potsherds of the earth! Shall the clay say to the one who forms it[a], “What are you making?” or your work, “He has no hands”?
translation:
  language: zh_hans
  text: 祸哉，与自己的塑造者争辩的人！他不过是地上众陶片中的一片。泥土岂能对塑造它的人说：“你在做什么？”你所造的岂能说：“他没有双手”[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它没有把手。”这种理解把末句看作成品批评自身的形制，而不是批评塑造者的能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 该词在此引出责备和警告；“祸哉”保留先知宣告的力度，同时保持庄重。
- source_word: רָב אֶת יֹצְרוֹ
  choice: 与造他的主争辩的人
  rationale: רָב 表示争辩、抗争；יֹצְרוֹ 指塑造他者。译作“造他的主”既体现创造者与受造者的对照，也自然承接制陶比喻。
- source_word: חֶרֶשׂ אֶת חַרְשֵׂי אֲדָמָה
  choice: 他不过是地上众瓦片中的一片
  rationale: 原文表达简略，意指争辩者不过是地上许多陶器碎片之一。“瓦片”在现代汉语中简明地传达陶器碎片的意象；补出“不过是……中的一片”使省略的关系清楚而不过度解释。
- source_word: הֲיֹאמַר חֹמֶר לְיֹצְרוֹ
  choice: 泥土岂能对塑造它的说
  rationale: חֹמֶר 是制陶用的泥土；疑问形式为反问。“塑造它的”贴近分词 יֹצֵר，并保留造物者与受造物的关系。
- source_word: מַה תַּעֲשֶׂה
  choice: 你在做什么
  rationale: עשה 可指“做”或“制造”。“你在做什么”在汉语中自然，也保留原词较宽的语义，而上下文仍明确是塑造器物。
- source_word: וּפָעָלְךָ
  choice: 你所造的
  rationale: פֹּעַל 在这里指行动的产物，即制成之物。“你所造的”清楚呈现该物开口批评制造者的平行结构。
- source_word: אֵין יָדַיִם לוֹ
  choice: 他没有手
  rationale: 直译为“他没有双手/手”。此处主要理解为受造物讥讽塑造者无能力或手艺；同时“手”也可能指器皿的把手，因此在脚注保留另一读法。
theological_decisions:
- issue: 末句中受造物批评的对象与含义
  choice: 受造之物指着塑造者说“他没有手”
  alternative: 受造之物说自己“没有把手”
  rationale: 上下文责备受造者与创造者争辩，主读法将末句理解为对塑造者能力的无礼质疑，较符合修辞推进。但 יָדַיִם 在器皿语境中可能指“把手”，故不排除另一读法，并以脚注保存张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祸哉”保留先知谴责语气；主体转换以“他”“它”区分人与泥土，并让制陶比喻清晰。脚注标记置于相关末句之后。
