  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׁפַט֙ בֵּ֣ין הַ/גּוֹיִ֔ם וְ/הוֹכִ֖יחַ לְ/עַמִּ֣ים רַבִּ֑ים וְ/כִתְּת֨וּ חַרְבוֹתָ֜/ם לְ/אִתִּ֗ים וַ/חֲנִיתֽוֹתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹא יִשָּׂ֨א ג֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ ע֖וֹד מִלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/004.yaml
  text: And he will judge between the nations and arbitrate for many peoples[a]; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[b], and they will not learn war anymore.
translation:
  language: zh_hans
  text: 他要在列国之间施行审判，为许多民族裁断[a]。他们要把刀剑打成犁头，把长矛打成修枝刀。国与国之间不再举刀相向，也不再学习战事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “裁断”也可译作“纠正”或“责备”；原文动词既可带有司法裁决的意思，也可带有纠正、责备的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“也不再学习战争”；这里的表达也可包含为战争而受训。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַט
  choice: 他要……施行审判
  rationale: שׁפט在此与“在……之间”及下句司法性动词平行，主要表达审判、裁决之意；保留第三人称代词，不明说其所指。
- source_word: בֵּין הַגּוֹיִם
  choice: 在列国之间
  rationale: בֵּין可指“在……之间／之中”；“列国之间”既保留审断语境，也符合庄重的现代汉语。
- source_word: וְהוֹכִיחַ
  choice: 裁断
  rationale: יכח的Hiphil形式可表示裁断、判明或责备；此处与שׁפט平行，并导向止息战争的结果，司法性的“裁断”最贴切，同时用脚注保留纠正、责备的可能。
- source_word: לְעַמִּים רַבִּים
  choice: 为许多民族
  rationale: 保留עַמִּים与前句גּוֹיִם在用词上的区别；לְ在此可表达针对、涉及或为其裁断。
- source_word: וְכִתְּתוּ
  choice: 他们要把……打成
  rationale: כתת指击打、打碎；在兵器改制为农具的语境中，“打成”准确而自然。
- source_word: חַרְבוֹתָם לְאִתִּים
  choice: 把刀剑打成犁头
  rationale: חֶרֶב为刀剑，אִתִּים为耕作器具或犁刃；“犁头”保留具体农业意象且为汉语读者熟悉。
- source_word: וַחֲנִיתוֹתֵיהֶם לְמַזְמֵרוֹת
  choice: 把长矛打成修枝刀
  rationale: חֲנִית为矛，מַזְמֵרָה为修剪枝条的工具；“修枝刀”是清楚、现代的对应表达。
- source_word: לֹא יִשָּׂא גוֹי אֶל גּוֹי חֶרֶב
  choice: 国与国之间不再举刀相向
  rationale: נשא חרב描绘举起刀剑攻击的动作；“举刀相向”保留意象并符合自然汉语。
- source_word: וְלֹא יִלְמְדוּ עוֹד מִלְחָמָה
  choice: 也不再学习战事
  rationale: 直译“学习战争”；“学习战事”保留原文较宽的含义，可包括研习和训练，而不只限于军事操练。
theological_decisions:
- issue: “他要施行审判”之主语身份
  choice: 保留“他”，不在本节明说所指
  alternative: 译作“耶和华要施行审判”
  rationale: 希伯来文动词仅标明第三人称阳性单数，主语须由上下文理解；虽然语境指向耶和华的作为，本节没有明写名字，因此不在译文中消除这一语法上的含蓄。
- issue: וְהוֹכִיחַ的司法性与纠正性张力
  choice: 正文译“裁断”
  alternative: 责备／纠正
  rationale: 与“施行审判”构成平行，司法含义在本语境中较强；但该词也能带有责备或纠正之意，故以脚注保存其词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”“民族”分别对应原文两个近义词；“刀剑—犁头、长矛—修枝刀”保留兵器变农具的平行意象。所有脚注标记均已置于正文。
