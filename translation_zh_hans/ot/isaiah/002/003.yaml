  timestamp: '2026-07-14T07:00:09Z'
review_pass:
  verdict: revise
  source_fidelity: 正文整体准确呈现了许多民族前往锡安、彼此邀请上山、受教并按其道路而行，以及训诲和耶和华的话从锡安／耶路撒冷发出的平行结构。“耶和华”“许多民族”“教诲”等关键选择恰当。惟“他必将自己的道路教导我们”在汉语中搭配不自然，且“自己的”无原文所要求的强调；改为“好让他教导我们他的道路”更直接对应原文的受教目的。
  naturalness: 整体庄重、清晰，适合现代普通话书面语。“登耶和华的山”虽可理解，但“上耶和华的山去”更自然地表达朝圣性的“上去”。“雅各的上帝的殿”略有重复但关系明确，且保留原文“雅各的上帝之殿”的表述。
  terminology: 神名译为“耶和华”，保留专名性质；torah译为“教诲”，并以脚注交代“律法／教导”的语义范围，均合适。“耶和华的话”符合先知书的既有中文表达。
  issues:
  - severity: low
    issue: “他必将自己的道路教导我们”搭配生硬，并添加“自己的”
    rationale: 汉语通常不说“将道路教导某人”；原文的“他的道路”无需添加反身强调。“好让他教导我们他的道路”既自然，也保留目的关系和“他的道路”这一内容。
  - severity: low
    issue: “登耶和华的山”略显不完整
    rationale: 原文含“去／上去”的共同劝勉；“上耶和华的山去”在现代汉语中更顺畅，并保留上耶路撒冷的朝圣意象。
