  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְֽ/הָלְכ֞וּ עַמִּ֣ים רַבִּ֗ים וְ/אָמְרוּ֙ לְכ֣וּ וְ/נַעֲלֶ֣ה אֶל הַר יְהוָ֗ה אֶל בֵּית֙ אֱלֹהֵ֣י יַעֲקֹ֔ב וְ/יֹרֵ֨/נוּ֙ מִ/דְּרָכָ֔י/ו וְ/נֵלְכָ֖ה בְּ/אֹרְחֹתָ֑י/ו כִּ֤י מִ/צִּיּוֹן֙ תֵּצֵ֣א תוֹרָ֔ה וּ/דְבַר יְהוָ֖ה מִ/ירוּשָׁלִָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/003.yaml
  text: And many peoples will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For instruction will go out from Zion[b], and the word of Yahweh from Jerusalem.
translation:
  language: zh_hans
  text: 许多民族必前来，说[a]：“来吧！让我们上耶和华的山去，到雅各的上帝的殿；好让他教导我们他的道路，使我们行在他的路径上。”因为教诲必从锡安传出[b]，耶和华的话必从耶路撒冷发出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “前来”直译为“走、去”；这里指各民族朝锡安而行。
    reason: lexical_alternative
  - marker: b
    text: “教诲”所译的希伯来语是“妥拉”（torah），也可译作“律法”或“教导”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: 必前来
  rationale: 动词本义为“走、去”；这里描写许多民族朝叙述焦点锡安移动，现代汉语用“前来”自然地保留朝向目的地的动态，脚注注明直译可能。
- source_word: עַמִּים רַבִּים
  choice: 许多民族
  rationale: עַמִּים 指多个具有群体和族属意义的人民或民族；“民族”比政治意味较强的“国家”更贴合此处。
- source_word: לְכוּ וְנַעֲלֶה
  choice: 来吧！让我们登
  rationale: 这是共同朝圣的劝勉；“登”简洁保留前往高处及上耶路撒冷的意象。
- source_word: הַר יְהוָה
  choice: 耶和华的山
  rationale: הַר 为“山”；יְהוָה 以现代汉语中通行且可辨识的专名“耶和华”表达。
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  choice: 雅各之上帝的殿
  rationale: בַּיִת 字面为“房屋、家”，此处明确指敬拜场所；“殿”在中文中自然而庄重，也避免“房屋”的误解，同时未扩展为原文未明说的专门术语。
- source_word: וְיֹרֵנוּ מִדְּרָכָיו
  choice: 他必将自己的道路教导我们
  rationale: ירה 的使役式意为“教导”；מִן 在这一结构中表达所教内容的范围，汉语不宜生硬译作“从他的道路教我们”，故按希伯来语习语自然表达为“将自己的道路教导我们”。
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  choice: 好让我们行在他的路径上
  rationale: 保留“行在路径上”关于生活操行的比喻，并用“好让”呈现与前句相连的目的或结果关系。
- source_word: תּוֹרָה
  choice: 教诲
  rationale: תּוֹרָה 在此不限于成文法规，而涵盖从上帝而来的训导；“教诲”兼具庄重性和广义教学含义，脚注保留“律法、教导”等可能译法。
- source_word: תֵּצֵא
  choice: 传出／发出
  rationale: יצא 表示“出去、出来”；对于“教诲”用“传出”、对于“话”用“发出”，符合现代汉语搭配，并保留由锡安和耶路撒冷向外传播的意象。
- source_word: וּדְבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知书中稳定的“耶和华的话”表达，不将 דָּבָר 限定为某一种具体信息类型。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；中文正文采用广为人知的专名“耶和华”，不以“主”替代，从而保留其作为名字的性质。
- issue: 普世朝圣语境中 תּוֹרָה 的范围
  choice: 教诲
  alternative: 律法
  rationale: 此处所指是从锡安传出的神圣训导，语义可涵盖律法却不局限于法规；“教诲”避免预先缩窄其范围。
- issue: וְיֹרֵנוּ 与 וְנֵלְכָה 的关系
  choice: 他必……好让我们……
  alternative: 愿他……使我们可以……
  rationale: 上下文既可听作期待，也带有目的或结果色彩；正文用自然汉语保留其衔接，不把语气强化为无条件的神学断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。正文维持希伯来诗句的平行结构；用“登山”“行在路径上”等表达保留朝圣和操行的双重意象。所有脚注标记均已置入正文。
