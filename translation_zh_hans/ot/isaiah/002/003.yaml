revisions:
- from: 许多民族必前来，说[a]：“来吧！让我们登耶和华的山，到雅各之上帝的殿；他必将自己的道路教导我们，好让我们行在他的路径上。”因为教诲必从锡安传出[b]，耶和华的话必从耶路撒冷发出。
  to: 许多民族必前来，说[a]：“来吧！让我们上耶和华的山去，到雅各的上帝的殿；好让他教导我们他的道路，使我们行在他的路径上。”因为教诲必从锡安传出[b]，耶和华的话必从耶路撒冷发出。
  rationale: 修订仅处理两处安全的汉语表达问题：以“上……山去”明确共同上行的劝勉，以“教导我们他的道路”替代不自然的“将自己的道路教导我们”。其余措辞及两个脚注锚点均予保留。
