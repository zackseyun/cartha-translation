  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י י֞וֹם לַ/יהוָ֧ה צְבָא֛וֹת עַ֥ל כָּל גֵּאֶ֖ה וָ/רָ֑ם וְ/עַ֖ל כָּל נִשָּׂ֥א וְ/שָׁפֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/012.yaml
  text: For Yahweh of Armies has a day against all that is proud and lofty[a], and against all that is lifted up—and it shall be brought low.
translation:
  language: zh_hans
  text: 因为万军之雅威的日子必临到一切骄傲自高的，临到一切被高举的；它们都必降卑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明人必降卑的缘由；“因为”保留其因果连接作用。
- source_word: יוֹם לַיהוָה
  choice: 雅威定有一日
  rationale: 希伯来文是名词句，直译近似“有一日属于雅威”；此处指雅威施行审判的特定日子，“定有一日”既自然，又传达其确定性而不过度解释。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 以“雅威”呈现神名，以“万军”表达צְבָאוֹת所指受他统辖的众军；同时保留这一复合称号的庄重感。
- source_word: עַל
  choice: 临到
  rationale: 在审判语境中表示针对并降临于某对象；“临到”比单纯的“在……之上”更符合现代汉语，也保留审判迫近的语气。
- source_word: כָּל גֵּאֶה וָרָם
  choice: 一切骄傲高大的
  rationale: “骄傲”表达גֵּאֶה的傲慢含义，“高大”保留רָם的高度意象，并让二者共同修饰泛指的人或事物，不擅自限定对象。
- source_word: כָּל נִשָּׂא
  choice: 一切高举的
  rationale: 保留נִשָּׂא“被抬高、被高举”的被动和高度意象，同时不预先判定所指仅为人或仅为物。
- source_word: וְשָׁפֵל
  choice: 使其降卑
  rationale: 按上下文将该形式理解为结果性的动词表达，指高举者被降下；“降卑”兼顾位置降低与尊荣受挫的双重意象。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；正文采用较贴近学界常见重构读音的“雅威”，不以称号取代专名。
- issue: יהוה צבאות这一称号的译法
  choice: 万军之雅威
  alternative: 万军之耶和华；万军之上主
  rationale: “万军”在现代汉语圣经语体中简洁而可理解，也保留神统辖天上及地上众军的宏大、威严意象，不将其窄化为某一支具体军队。
- issue: וְשָׁפֵל的句法与神学张力
  choice: 作为审判结果译为“使其降卑”
  alternative: 按形容词并列译为“以及一切低微的”
  rationale: 本段反复宣告高傲者必被降低，结果性理解最契合上下文；但希伯来文形式也容许形容词式读法，因此以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“骄傲高大”“高举”“降卑”保留原文连续的高低意象；两个“一切”维持希伯来文的平行结构。
