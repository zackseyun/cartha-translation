revisions:
- from: 因为万军之雅威[a]定有一日，要临到一切骄傲高大的，临到一切高举的，使其降卑。[b]
  to: 因为万军之雅威的日子必临到一切骄傲自高的，临到一切被高举的；它们都必降卑。
  rationale: 以“万军之雅威的日子”自然呈现 יוֹם לַיהוָה צְבָאוֹת，同时保留审判“临到／针对”对象的重复结构。将“高大”改为“自高”，并将末句改为“都必降卑”，使高低意象、审判结果和汉语指代都更清晰；删除会误导句法理解的脚注b。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:00:01Z'
review_pass:
  verdict: revise
  source_fidelity: 正文基本把握了审判对象的平行结构和由高至卑的意象，但“高大”容易主要理解为物理体量，未充分表达 רָם 的“自高／高举”意味；“使其降卑”则加入了原文未明说的使役主语，且“其”的指向不够清楚。וְשָׁפֵל在此更适宜按先知性结果理解为“必降卑”，不宜将“以及一切低微的”作为同等的句法替代。
  naturalness: “万军之雅威定有一日”略显生硬，“一切骄傲高大的”搭配也不自然。改为“万军之雅威的日子必临到……”更符合现代汉语先知书语体，并清楚保留“日子”作为审判时刻的表达。
  terminology: “雅威”与“万军”可保留，既呈现 יהוה 专名，也传达 צבאות 的军旅含义。“骄傲自高”“被高举”“降卑”连贯地表达原文的高低意象，且不限定对象仅为人。
  issues:
  - severity: medium
    issue: “骄傲高大”弱化并可能误导 רָם 的语义。
    rationale: 在本节审判高傲者的语境中，רָם与骄傲并列，具有“高、崇高、自高”的隐喻意义；“高大”在现代汉语中常指身材或物体尺寸。
  - severity: medium
    issue: “使其降卑”将末句改成使役表达，且代词指向含混。
    rationale: וְשָׁפֵל可在此理解为对被高举者的结果宣告；译为“都必降卑”更直接地保留其结果性，而不增添未明说的施事。
  - severity: medium
    issue: 脚注b所述“以及一切低微的”并非本节中与结果性动词同等可取的替代译法。
    rationale: 该词形在此处及上下文的审判宣告中适合译作“必降卑／必被降下”；把它处理为与前项并列的静态形容词，会破坏本句由高举转为降卑的宣告。
  revised_text: 因为万军之雅威的日子必临到一切骄傲自高的，临到一切被高举的；它们都必降卑。
  revised_footnotes:
