base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/006.yaml
  text: For you have forsaken your people[a], the house of Jacob, because they are full of eastern ways, and they practice divination like the Philistines[c][b], and they strike hands with the children of foreigners.
translation:
  language: zh_hans
  text: 因为你离弃了你的子民——雅各家，因为他们充满了东方的风俗[a]，又像非利士人一样占卜[b]，并与外邦人的儿女击掌[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “东方的风俗”原文直译为“从东方”；也可能指来自东方的人或影响。
    reason: lexical_alternative
  - marker: b
    text: 或译：“又像非利士人一样作观兆的人。”
    reason: lexical_alternative
  - marker: c
    text: 末句动词罕见，含义不确定；“击掌”可能表示结交或达成协议，也可译为“立约”或“联合”。
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתָּה
  choice: 你离弃了
  rationale: 该动词意为离开、撇弃或离弃；“离弃”既自然，也保留先知话语中圣约与审判的力度。
- source_word: עַמְּךָ בֵּית יַעֲקֹב
  choice: 你的子民——雅各家
  rationale: 保留同位结构，以“雅各家”进一步说明“你的子民”，且不把原文“雅各”替换为“以色列”。
- source_word: מָלְאוּ מִקֶּדֶם
  choice: 充满了东方的风俗
  rationale: מִקֶּדֶם 字面为“从东方”，此处结构省略，语境很可能指从东方传入的风俗或影响；正文适度补足隐含意义，脚注保留直译。
- source_word: עֹנְנִים
  choice: 占卜
  rationale: 该分词指行占卜或观兆之事；用动词表达符合现代汉语，也清楚传达被谴责的行为。
- source_word: כַּפְּלִשְׁתִּים
  choice: 像非利士人一样
  rationale: 直接保留比较关系，简洁自然。
- source_word: וּבְיַלְדֵי נָכְרִים
  choice: 与外邦人的子孙
  rationale: יַלְדֵי 字面为“儿女、子孙”，נָכְרִים 为外邦人或异族人；“外邦人的子孙”较贴近原文，且不限定为男性。
- source_word: יַשְׂפִּיקוּ
  choice: 携手结交
  rationale: 此罕见动词含义不确定，可能涉及击掌、缔约或交往。“携手结交”保留联合交往的意象，但不把具体法律性盟约确定为唯一解释；其他可能见脚注。
theological_decisions:
- issue: 犹大接受外来习俗并与外邦人交往的性质
  choice: 将本节呈现为对采纳东方占卜风俗及与外邦人结交的谴责
  alternative: 末句可能更具体地指与外邦人击掌立约；“从东方”也可能指来自东方的人，而非东方风俗
  rationale: 上下文责备的是宗教与社会上的妥协，不应扩展为对异族本身的笼统谴责。由于“从东方”是省略表达，末句动词也罕见难解，正文采取语境上较可能的译法，并以脚注保存不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“子民——雅各家”用破折号清楚呈现同位关系；“携手结交”避免生硬直译，同时由脚注交代罕见动词的多种可能。
