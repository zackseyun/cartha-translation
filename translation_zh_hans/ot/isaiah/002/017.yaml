source:
  edition: WLC
  text: וְ/שַׁח֙ גַּבְה֣וּת הָ/אָדָ֔ם וְ/שָׁפֵ֖ל ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/017.yaml
  text: The loftiness of man will be brought low[a], and the exaltation of men will be humbled; and Yahweh alone will be exalted in that day.
translation:
  language: zh_hans
  text: 人的高傲必被降卑[a]，世人的自高必被贬抑；在那日，惟有雅威必被高举。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“人的高大必被降下，世人的高位必被降卑。”希伯来文以高低的形象描写人的傲慢。
    reason: 说明原文的高度隐喻及可行的较直译表达。
lexical_decisions:
- source_word: וְשַׁח
  choice: 必降为卑
  rationale: 该词在预言语境中以完成式表达将来必然发生的事；“降为卑”既传达降低，也保留与后文“被尊为高”相反的垂直意象。
- source_word: גַּבְהוּת הָאָדָם
  choice: 人的高傲
  rationale: גַּבְהוּת本指高度，在此指人的高傲；“人的”自然表达הָאָדָם的泛指意义，同时没有把对象局限为男性。
- source_word: וְשָׁפֵל
  choice: 必被贬抑
  rationale: 表达从高处被降下的结果，与前句构成平行；“贬抑”在现代汉语中庄重自然。
- source_word: רוּם אֲנָשִׁים
  choice: 世人的自高
  rationale: רוּם具有高度、抬高之意，在此语境指人自抬身价；“自高”保留高度意象，“世人”则自然表达复数人类群体。
- source_word: וְנִשְׂגַּב
  choice: 被尊为高
  rationale: 该Nifal形式表示被高举、显为崇高；此译法与前两句人的高傲被降低形成清楚反转。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用汉语中对四字神名较贴近“Yahweh”的音译，以保留专名而不以称号替代。
- source_word: לְבַדּוֹ
  choice: 唯有
  rationale: 突出排他性：到那日，只有雅威被尊为高。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 自然、庄重地表达先知书常见的时间短语，并体现所预告事件的终局指向。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名，因此正文保留专名；“雅威”较贴近学界通常重构的读音，而“耶和华”是汉语传统中更熟悉的形式。
- issue: הָאָדָם与אֲנָשִׁים的所指
  choice: 人的……世人的
  alternative: 男人的……众男人的
  rationale: 两词在本节泛指人类，与雅威形成对照，并非专指男性；采用自然的现代汉语泛称，同时保留单数泛指与复数群体之间的修辞变化。
- issue: 人的高与雅威的高之间的张力
  choice: 保留“高—低—高”的意象链
  alternative: 完全意译为“骄傲受辱，雅威得荣耀”
  rationale: 原文反复运用高度意象，将人的自高被降低与雅威独受高举并置；正文不把这种张力化约为抽象的道德评语。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“必”体现先知性宣告的确定性；句式保留原文三分结构和平行关系，并用分号凸显人的自高被降低与雅威独受高举的对照。
