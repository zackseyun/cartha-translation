  text: הַ/דָּבָר֙ אֲשֶׁ֣ר חָזָ֔ה יְשַֽׁעְיָ֖הוּ בֶּן אָמ֑וֹץ עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/001.yaml
  text: The word that Isaiah son of Amoz saw concerning Judah and Jerusalem[a][b].
translation:
  language: zh_hans
  text: 亚摩斯的儿子以赛亚所看见[b]、有关犹大和耶路撒冷的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译作“信息”或“事情”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“看见”；这是先知领受异象启示的惯用表达。
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: 话
  rationale: דָּבָר可指“话、信息、事情”。先知书标题中译作“话”既保留希伯来语的具体表达，也符合现代中文圣经语体；其他可能译法列入脚注。
- source_word: אֲשֶׁר
  choice: 所……的
  rationale: 用现代汉语关系结构“所……的”连接“话”与“看见”，准确而自然。
- source_word: חָזָה
  choice: 看见
  rationale: 该动词本义为“看见”，也是先知领受异象启示的惯用语。直译为“看见”可保留原文的视觉意象，不把它解释性地改写为“领受”或“预言”。
- source_word: יְשַׁעְיָהוּ
  choice: 以赛亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 以自然的现代汉语表达希伯来语的父子属格关系。
- source_word: אָמוֹץ
  choice: 亚摩斯
  rationale: 采用现代中文圣经传统中通行的人名译法；此名所对应的是希伯来文 אָמוֹץ（Amoz），并非先知阿摩司的名字 עָמוֹס（Amos）。
- source_word: עַל
  choice: 有关
  rationale: 这里的介词引出异象所涉及的对象或主题。“有关”保持中性，不预先限定为敌对性的“攻击”，也能涵盖后文的审判与盼望。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用通行的中文地名译法。
- source_word: וִירוּשָׁלִָם
  choice: 和耶路撒冷
  rationale: 连词与地名按现代汉语自然译出，地名采用通行译法。
theological_decisions:
- issue: חָזָה所表达的先知启示性质
  choice: 保留“看见”的异象性语言
  alternative: 译作“在异象中领受”或“预言”
  rationale: 原文明确使用“看见”这一先知术语。保留其视觉隐喻，既忠于原文，也不把启示方式压平为一般性的说话或预言。
- issue: 标题中עַל的范围与语气
  choice: 译为“有关犹大和耶路撒冷”
  alternative: 译为“攻击犹大和耶路撒冷”或“论到犹大和耶路撒冷”
  rationale: 本标题概括异象的主题范围，而后文兼有审判和将来的盼望。“有关”不擅自加入纯粹敌对的语气，保留原文在神学上的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。语序以“亚摩斯的儿子以赛亚”为主语，使长定语清晰可读；保留“看见……的话”这一略带陌生感的先知性表达，并用脚注解释。所有脚注标记均置于正文相应位置。
