  yaml_path: translation/ot/isaiah/002/014.yaml
  text: and against all the high mountains[a], and against all the lofty hills.
translation:
  language: zh_hans
  text: 又临到一切高山，临到一切高耸的冈陵。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高耸的”原文也可译作“被举起的”或“崇高的”。
    reason: 说明הַנִּשָּׂאוֹת的动词意象及可能带出的尊崇色彩，同时不改变正文较自然的汉语表达。
lexical_decisions:
- source_word: וְעַל
  choice: 又临到
  rationale: 承接上下文的审判清单；עַל在这里表示耶和华的日子所针对、所临到的对象。“临到”自然保留审判迫近的语气，而非单纯空间意义的“在……之上”。
- source_word: כָּל
  choice: 一切
  rationale: 准确表达反复出现的总体、周遍意义，也符合汉语诗体列举的语感。
- source_word: הֶהָרִים
  choice: 山
  rationale: 与下句גְּבָעוֹת“冈陵”保持地貌层级上的区别。
- source_word: הָרָמִים
  choice: 高
  rationale: רום在此直接描述高度；“高山”简洁自然，不预先把地貌意象解释为人的骄傲。
- source_word: הַגְּבָעוֹת
  choice: 冈陵
  rationale: 表达较山为低小的隆起地貌，并与“山”形成庄重、清楚的诗歌平行。
- source_word: הַנִּשָּׂאוֹת
  choice: 高耸的
  rationale: נשׂא的被动分词带有被举起、升高之意；“高耸的”在现代汉语中自然地保留向上隆起的动态意象。
theological_decisions:
- issue: 地貌词语是否应译得更具象征性，以突出人的骄傲
  choice: 正文保留具体地貌：“高山”和“高耸的冈陵”
  alternative: 译作“崇高的山”和“被高举的冈陵”，更明显暗示骄傲与尊荣
  rationale: 本节本身列举真实的高处，而全段语境可使这些高耸之物产生象征共鸣。保留具体景象，既不削弱上下文主题，也不把一种解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的先知诗歌语体。两个“临到”保留希伯来文重复和平行结构；“山／冈陵”维持地貌对举。脚注标记置于整节末尾，对应“高耸的”的词义备选。
