id: ISA.2.10
reference: Isaiah 2:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בּ֣וֹא בַ/צּ֔וּר וְ/הִטָּמֵ֖ן בֶּֽ/עָפָ֑ר מִ/פְּנֵי֙ פַּ֣חַד יְהוָ֔ה וּ/מֵ/הֲדַ֖ר גְּאֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/010.yaml
  text: Enter into the rock and hide yourself in the dust from before the terror of Yahweh and from the splendor of his majesty[a][b][c].
translation:
  language: zh_hans
  text: 你要进入岩石间，藏在尘土中，为要躲避耶和华所带来的惊恐[a][b]和他威严的荣光[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华所带来的惊恐”或译“耶和华的可怕”或“耶和华的惊吓”。这里指他施行审判时所引起的战栗，并非通常所说敬虔的“敬畏耶和华”。
    reason: lexical_alternative
  - marker: b
    text: “躲避”原文直译为“从……面前”，带有逃离耶和华临在的意味。
    reason: source_form
  - marker: c
    text: 或译“他荣光的威严”。原文把“荣光”和“威严”两个近义词相连，描写压倒一切的君王荣耀。
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא בַצּוּר
  choice: 进入磐石中
  rationale: בּוֹא是阳性单数命令式，בַצּוּר指进入磐石、岩壁所提供的藏身之处。“进入磐石中”保留原文具体而强烈的岩石意象，虽略带诗性，却符合本节语体。
- source_word: וְהִטָּמֵן
  choice: 藏身
  rationale: טמן的尼法勒命令式在此具有反身意味；“藏身”自然地表达“把自己隐藏起来”，又比“被隐藏”更符合命令语气。
- source_word: בֶּעָפָר
  choice: 于尘土里
  rationale: עָפָר是“尘土、泥土”；“尘土”保留卑微、俯伏及近于坟墓的文学联想。
- source_word: מִפְּנֵי
  choice: 躲避
  rationale: 该介词字面为“从……面前”，在此表达因耶和华显现而逃避。正文用自然汉语“躲避”，脚注保留其临在与方位色彩。
- source_word: פַּחַד יְהוָה
  choice: 耶和华可畏的威势
  rationale: פַּחַד在审判语境中指令人战栗的恐惧或可畏性，并非智慧文学中敬虔的“敬畏”。“可畏的威势”传达恐怖效果，同时避免把短语误解成主观的敬畏之情。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式“耶和华”呈现四字神名，而不以“主”这一称号取代。
- source_word: הֲדַר גְּאֹנוֹ
  choice: 他威严的荣光
  rationale: הָדָר可指荣美、光辉，גָּאוֹן可指威严、崇高。此译保留两个近义名词层叠形成的皇家荣耀意象。
theological_decisions:
- issue: פַּחַד יְהוָה所表达的神圣可畏性
  choice: 耶和华可畏的威势
  alternative: 耶和华所带来的恐惧／对耶和华的惧怕
  rationale: 希伯来语属格关系可侧重耶和华本身令人战栗的显现，也可侧重由他引发的恐惧。正文不把它缩减为人的主观心理，脚注则说明另一种表达。
- issue: 神名יְהוָה的中文呈现
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 原文使用神的专名。译文采用现代中文中广为人知的音译“耶和华”，而不用一般称号“上主”；“雅威”是另一种音译形式。
- issue: הֲדַר גְּאֹנוֹ中两个荣耀词的关系
  choice: 他威严的荣光
  alternative: 他荣光的威严
  rationale: 原文以两个意义相近但不完全相同的词构成属格短语。正文保留二者，不将其合并为单一的“荣耀”或“威严”，也不把神的גאון误译成负面的“骄傲”。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语体。“你要”体现单数命令式；“磐石”“尘土”“荣光”保留原文浓厚的诗歌意象。正文以自然汉语表达逃避关系，同时借脚注保存מִפְּנֵי的字面空间含义及两个荣耀词之间未完全固定的关系。
