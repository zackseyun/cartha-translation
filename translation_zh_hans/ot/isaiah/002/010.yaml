  rationale: 修订以“耶和华所带来的惊恐”恢复פַּחַד在审判语境中的核心意义，同时不把属格关系武断地限定为单一语法分析。将“磐石中”改为“岩石间”，使中文更自然，并仍保留躲入岩石隐蔽处的形象。脚注锚点和措辞相应更新，且保留关于“从……面前”及两个荣耀词搭配的必要信息。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:00:09Z'
