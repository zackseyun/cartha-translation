  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עֵינֵ֞י גַּבְה֤וּת אָדָם֙ שָׁפֵ֔ל וְ/שַׁ֖ח ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/011.yaml
  text: The lofty eyes of man will be brought low[a], and the haughtiness of men will be humbled; and Yahweh alone will be exalted in that day.
translation:
  language: zh_hans
  text: 人的高傲目光必被压低[a]，世人的傲气必被压低；到那日，唯有雅威被高举。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人高傲的眼目必被压低。”希伯来文以高抬的眼目描绘人显露出来的骄傲。
    reason: 保留原文“眼目”与高低的具体意象，并说明较贴近原文结构的译法。
lexical_decisions:
- source_word: עֵינֵי גַּבְהוּת אָדָם
  choice: 人的高傲目光
  rationale: 原文直译近于“人的高傲之眼”，描绘骄傲从眼神和姿态中流露；译为“高傲目光”既保留眼目的意象，也符合现代汉语表达。
- source_word: שָׁפֵל
  choice: 必降为卑
  rationale: 该词表达降低、成为卑下；“降为卑”保留与高傲相反的垂直意象，并按预言语境表达将来的确定性。
- source_word: וְשַׁח רוּם אֲנָשִׁים
  choice: 世人的傲气必被压低
  rationale: רוּם本指高度、高举，在此语境指人的高傲；שַׁח表示降低、屈下。“傲气必被压低”自然地保存高低对照。אֲנָשִׁים为复数泛指人群，译作“世人”避免误解为只指男性。
- source_word: וְנִשְׂגַּב
  choice: 被尊为至高
  rationale: 该动词有崇高、被高举之意；此译清楚呈现雅威独受尊崇，并与人被降低形成鲜明对照。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名音译为“雅威”，保留经文所用的上帝专名，不以称号替代。
- source_word: לְבַדּוֹ
  choice: 唯有
  rationale: 强调排他性，即到那日只有雅威被尊为至高。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知文学常见的时间表达；“到那日”在现代汉语中自然，并保留所指日期未明确界定的语气。
theological_decisions:
- issue: אָדָם与אֲנָשִׁים在审判宣告中的泛指范围
  choice: 人……世人
  alternative: 男人……众男人
  rationale: 两词在此泛指骄傲的人类，而非只限男性；译法保存单数泛称与复数群体之间的修辞变化，同时避免不必要的性别限缩。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，故以现代汉语中较贴近学术重构读音的“雅威”音译，保留专名性质。
- issue: 人被降低与雅威被高举的神学张力
  choice: 保留高低意象及“唯有”的排他性
  alternative: 意译为上帝惩罚人的骄傲
  rationale: 原文没有在本节明确说明施动者或展开惩罚机制，而是并置人的降卑与雅威独受高举；译文不额外补入解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“高傲目光—降为卑”“傲气—压低”“雅威—至高”重现原文贯穿全句的高低对照；分号保留两个人类降卑分句与雅威独受高举之间的结构转折。
