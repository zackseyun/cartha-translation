  text: וַ/תִּמָּלֵ֥א אַרְצ֖/וֹ אֱלִילִ֑ים לְ/מַעֲשֵׂ֤ה יָדָי/ו֙ יִֽשְׁתַּחֲו֔וּ לַ/אֲשֶׁ֥ר עָשׂ֖וּ אֶצְבְּעֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/008.yaml
  text: And his land is filled with idols; they bow down to the work of their hands[a], to what their fingers have made.
translation:
  language: zh_hans
  text: 他的国土[a]充满偶像；他们向自己双手所做的下拜，向自己手指所造的下拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“他的国土”；这里的单数代词是对整个民族或百姓的集合性称呼。
    reason: 说明希伯来语集合性单数，避免读者误以为只指某一个人。
lexical_decisions:
- source_word: וַתִּמָּלֵא
  choice: 充满
  rationale: 该动词为尼法勒式，在这里描述一种已然存在的状态；汉语“充满”自然保留了被偶像遍布的状态感，不必强行标明过去时。
- source_word: אַרְצוֹ
  choice: 他的国土
  rationale: 保留希伯来语第三人称阳性单数后缀；上下文中的单数是对雅各家或以色列民族的集合性称呼。“国土”比孤立的“地”更清楚地表达民族所居之地。
- source_word: אֱלִילִים
  choice: 偶像
  rationale: 这是现代汉语中清楚、标准的对应词，也能在上下文中承载原词所含的贬抑意味，无须扩译为“虚无的偶像”。
- source_word: לְמַעֲשֵׂה יָדָיו
  choice: 向自己双手所做的
  rationale: 介词与下拜动词共同标示下拜的对象；译文保留“手所做的”这一具体意象及人敬拜自己制品的讽刺意味。集合性单数在汉语中依照复数主语译作“自己”。
- source_word: יִשְׁתַּחֲווּ
  choice: 下拜
  rationale: 保留俯身跪拜的身体动作，同时让其敬拜含义由偶像崇拜的语境显明，避免直接抽象化为“敬拜”。
- source_word: לַאֲשֶׁר עָשׂוּ אֶצְבְּעֹתָיו
  choice: 向自己指头所造的下拜
  rationale: 保留“指头”这一具体身体意象和与前半句近似平行的结构；补出省略的“下拜”，使现代汉语关系清楚。“自己”对应集合性先行词与复数行动者之间的关系。
theological_decisions:
- issue: השתחוה 所表示的拜偶像行为
  choice: 下拜
  alternative: 敬拜；俯伏
  rationale: “下拜”既保留原文的身体动作，也不削弱宗教语境中的敬拜含义，使对偶像崇拜的谴责从上下文自然显出。
- issue: 集合性单数与复数行动者的转换
  choice: 他的国土……他们……自己双手……自己指头
  alternative: 他们的国土……他们的手……他们的指头；他的国土……他的手……他的指头
  rationale: 原文以单数指称作为整体的民族，却用复数动词描述百姓的行动。译文保留“他的国土”以反映形式上的单数，并在后句用“他们／自己”清楚表达集体成员亲自制造并跪拜偶像的含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“国土”清楚表达民族之地；“下拜”保留具体动作。“双手……指头”维持原文平行意象和讽刺张力。
