  yaml_path: translation/ot/isaiah/002/018.yaml
  text: And the idols will completely vanish[a].
translation:
  language: zh_hans
  text: 偶像必全然消逝[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必全然逝去。”
    reason: 词义备选：חלף可指“逝去、过去”，כָּלִיל表示“全然、完全”。
lexical_decisions:
- source_word: וְהָאֱלִילִים
  choice: 偶像
  rationale: 定冠词使所指明确；אֱלִילִים直指偶像，并带有虚无、无价值的贬义色彩。中文用“偶像”最自然清楚，该贬义可由语境体现。句首וְ在此承接上下文，中文单节表达中不必机械译出“而/并且”。
- source_word: כָּלִיל
  choice: 全然
  rationale: 此词在这里作副词，强调彻底、完全；“全然”简洁庄重，保留其强调力度。
- source_word: יַחֲלֹף
  choice: 必……消逝
  rationale: חלף可表示过去、消失或消逝。以偶像为主语并受כָּלִיל强化时，“消逝”自然表达其彻底不复存在的预言意味；“必”体现未完成式在预言语境中的确定将来意义。
