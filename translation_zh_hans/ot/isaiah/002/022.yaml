  text: חִדְל֤וּ לָ/כֶם֙ מִן הָ֣/אָדָ֔ם אֲשֶׁ֥ר נְשָׁמָ֖ה בְּ/אַפּ֑/וֹ כִּֽי בַ/מֶּ֥ה נֶחְשָׁ֖ב הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/022.yaml
  text: Stop trusting in man, whose breath is in his nostrils; for what is he really worth?
translation:
  language: zh_hans
  text: 你们不要再倚靠世人；他的鼻孔里不过有一口气，他究竟算什么呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִדְלוּ לָכֶם מִן־הָאָדָם
  choice: 你们不要再倚靠世人
  rationale: חִדְלוּ מִן 表示“停止、离开、不再”；לָכֶם 带有劝诫对象自身应当停止之意。结合上下文所责备的倚赖，译作“不要再倚靠”比单纯“不要理会”更自然；הָאָדָם 泛指脆弱的人类，译为“世人”。
- source_word: אֲשֶׁר נְשָׁמָה בְּאַפּוֹ
  choice: 他的鼻孔里不过有一口气
  rationale: 保留“气息在鼻孔中”的具体意象，凸显人的生命短暂脆弱；补入“不过”传达该从句在论证中的限制意味。
- source_word: כִּי בַמֶּה נֶחְשָׁב הוּא
  choice: 他究竟算什么呢
  rationale: נחשב 可指“被看为、被算作”；במה 构成反问“算什么/有何价值”。译文保留其反问力度，而不把价值判断具体化为某一种标准。
theological_decisions:
- issue: 本节是否明确禁止一切对人的信任
  choice: 按上下文译为“不要再倚靠世人”，强调不可把终极依靠放在人身上
  alternative: 不要再理会人／离开人吧
  rationale: 希伯来语介词结构本身较宽泛，但以赛亚书2章对人的骄傲与虚妄依赖形成鲜明批判；译文不扩展为禁止所有正常的人际信任。
- issue: 末句对人的评价
  choice: 保留反问“他究竟算什么呢”
  alternative: 他有什么价值呢／他不值得重视
  rationale: 原文用反问表达人的有限，不宜改成对人格价值的绝对否定，也不应消解其尖锐语气。
translation_notes:
  register: 采用庄重而通顺的现代普通话。“世人”与“一口气”既保留诗性，也便于普通读者理解；分号呈现命令与理由之间的逻辑关系。
