  rationale: 修订使译文以“又要临到”承接2:12的“耶和华的日子要临到”，不在本节无明载动词之处加入过于具体的“攻击”。同时以“高塔”取代较冗的“高耸的塔楼”。脚注保留依上下文将介词短语理解为审判性“攻击”的可能，且锚点置于该平行短语的首项后，覆盖两项。
