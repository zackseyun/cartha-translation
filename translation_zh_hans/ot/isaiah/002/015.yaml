base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/015.yaml
  text: and against every high tower[a], and against every fortified wall—
translation:
  language: zh_hans
  text: '又要临到一切高塔[a]，

    又临到一切坚固的城墙——'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按上下文译：“攻击一切高塔，攻击一切坚固的城墙。”希伯来语介词较直译为“在……之上”或“临到……之上”；这里承接上文，列出耶和华的日子所要临到、施行审判的对象。
    reason: 词义异译
lexical_decisions:
- source_word: וְעַל
  choice: 攻击
  rationale: 本节承接2:12所说耶和华的日子临到一切高傲之物；重复的介词短语列出审判所针对的对象。译为“攻击”自然表达敌对、审判的方向，同时脚注保留更直译的“临到……之上”。
- source_word: כָּל
  choice: 一切
  rationale: 与单数名词搭配时具有周遍、逐一涵盖的意思；“一切”适合本段诗歌反复铺陈的语体。
- source_word: מִגְדָּל
  choice: 塔楼
  rationale: 该词泛指高起的塔状建筑；“塔楼”不把含义收窄为特定用途的瞭望塔。
- source_word: גָּבֹהַ
  choice: 高耸的
  rationale: 既准确传达实体高度，也与本章关于人所高举之物的主题形成自然呼应，而不在译文中额外解释象征意义。
- source_word: חוֹמָה
  choice: 城墙
  rationale: 该名词常指具有防御作用的墙垣；结合“坚固的”及塔楼意象，“城墙”比泛称“墙”更符合军事防御语境。
- source_word: בְצוּרָה
  choice: 坚固的
  rationale: 该形容词表示设防、难以攻取；“坚固的城墙”是现代汉语自然搭配，清楚传达防御意味。
theological_decisions:
- issue: 上下文省略而隐含的神圣审判
  choice: 把两个 עַל 短语译为“攻击……”，表明它们是审判所针对的对象。
  alternative: 较形式地译为“临到……之上”，由上下文体现敌对含义。
  rationale: 以赛亚书2:12—16是一连串列举，说明耶和华的日子所要临到的高傲之物。“攻击”明确表达上下文已有的审判方向，并未增添新的神学内容；脚注则保留希伯来语介词的空间性表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两行重复“攻击一切”，重现希伯来文 וְעַל כָּל 的平行结构；破折号保留本节仍向下一节延展的列举语势。
