source:
  edition: WLC
  text: בֵּ֖ית יַעֲקֹ֑ב לְכ֥וּ וְ/נֵלְכָ֖ה בְּ/א֥וֹר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/005.yaml
  text: House of Jacob[a], come[b], and let us walk in the light of Yahweh.
translation:
  language: zh_hans
  text: 雅各家[a]啊，来吧[b]！让我们行在雅威的光中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“雅各之家啊”。希伯来语在这里直接称呼雅各的后裔。
    reason: lexical_alternative
  - marker: b
    text: 也可较直译为“去吧，让我们行”。希伯来语以复数命令式接共同勉励式，号召众人一起行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יַעֲקֹב
  choice: 雅各家
  rationale: 这是一个作呼语的组合词，指雅各的后裔。“雅各家”保留希伯来语的家族性意象和先知文体；用“啊”明确直接呼唤的语气。
- source_word: לְכוּ
  choice: 来吧
  rationale: 这是הלך的复数命令式；在命令式后接共同勉励式的结构中，它可作号召语，意为“来吧”。这样既自然，也与下文“让我们行……”形成共同参与的邀请。
- source_word: וְנֵלְכָה
  choice: 让我们行
  rationale: 这是הלך的第一人称复数共同勉励式，带连接词，表达共同的劝勉或决意。“让我们行”保留原文的行动隐喻，不解释性地改成“生活”。
- source_word: בְּאוֹר
  choice: 在……的光中
  rationale: 介词ב既可表示范围，也可表示凭借；“在……的光中”保留这种较宽的意象，既可指处于神的光照之下，也可包含按其引导而行。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文中的专名性质，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用现代学界较通行的拟音“雅威”，同时避免把专名改译为“主”；“耶和华”是汉语传统中常见的另一音译。
- issue: “在雅威的光中行”的含义
  choice: 保留“行在……的光中”的隐喻
  alternative: 按雅威的光生活／靠雅威的光前行
  rationale: 原文可同时唤起生活方式、光照和引导等意涵；直保留“行”与“光”的组合，不将其限定为单一神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅各家啊”保留先知向群体直接呼告的语气；“来吧！让我们……”呈现热切的共同劝勉；“行在……的光中”保留清晰可懂的圣经意象。
