  text: לָ/בוֹא֙ בְּ/נִקְר֣וֹת הַ/צֻּרִ֔ים וּ/בִ/סְעִפֵ֖י הַ/סְּלָעִ֑ים מִ/פְּנֵ֞י פַּ֤חַד יְהוָה֙ וּ/מֵ/הֲדַ֣ר גְּאוֹנ֔/וֹ בְּ/קוּמ֖/וֹ לַ/עֲרֹ֥ץ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/021.yaml
  text: to enter the caverns of the rocks and the clefts of the crags[a], from before the terror of Yahweh and from the splendor of his majesty[b], when he rises to terrify the earth.
translation:
  language: zh_hans
  text: 进入岩石的洞穴和峭壁的裂缝[a]，为躲避雅威所带来的恐惧和他威严的荣光；当他起来使大地惊恐时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“岩石的孔洞和山崖的裂隙。”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא
  choice: 进入
  rationale: 这是带 ל 的不定式，承接上文进入藏身之处的动作；“进入”在现代汉语中自然，也准确表达进入岩穴躲藏。
- source_word: נִקְרוֹת הַצֻּרִים
  choice: 岩石的洞穴
  rationale: נִקְרוֹת 指岩体中的孔洞或洞穴；译作“洞穴”既符合藏身场景，也比“孔洞”庄重自然。
- source_word: סְעִפֵי הַסְּלָעִים
  choice: 峭壁的裂缝
  rationale: 在地貌语境中，סְעִפֵי 表示分裂处或裂隙，סְּלָעִים 指岩崖、峭壁；此译保留与前一短语平行而略有区别的意象。
- source_word: מִפְּנֵי
  choice: 躲避
  rationale: 原义涉及从某者面前离开，在本段逃入岩穴的语境中用“躲避”自然表达离开其临在与威势的含义。
- source_word: פַּחַד יְהוָה
  choice: 雅威的可畏威势
  rationale: פַּחַד 在这里不只指人的主观恐惧，也指雅威令人惊惧的威势；“可畏威势”保留这一致使人恐惧的客观意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，避免用称号取代原文专名。
- source_word: הֲדַר גְּאוֹנוֹ
  choice: 他威严的荣光
  rationale: הֲדַר 表示荣美、光彩，גָּאוֹן 在此表示崇高威严；“威严的荣光”保留两个词的层次及其紧密组合。
- source_word: בְּקוּמוֹ
  choice: 他起来
  rationale: 介词 בְּ 加不定式在这里具有时间意义；汉语“他起来”在后续“要……”结构中自然表达“当他起来时”。
- source_word: לַעֲרֹץ הָאָרֶץ
  choice: 要使大地震恐
  rationale: לַעֲרֹץ 可表示使人惊惧，也可能带有使之战栗的意味；“使大地震恐”兼顾恐惧与震颤意象。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 上下文描绘全人类在雅威面前降卑，故取较广的“大地”，同时不排除“地、土地”本身的语义范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较贴近 Yahweh 发音的现代汉语音译“雅威”，而不是以“主”等称号替代。
- issue: לַעֲרֹץ 的语义
  choice: 使大地震恐
  alternative: 使大地震动
  rationale: 该动词可强调造成恐惧，也可理解为使之战栗、震动；正文以“震恐”保留两层意象，脚注列出偏重物理震动的译法。
- issue: הָאָרֶץ 的范围
  choice: 大地
  alternative: 这地
  rationale: 本章语境具有普世性的审判图景，因此采用“大地”；但希伯来词本身也可指特定地域，正文不作超出上下文的进一步限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。全句承接上一节，因此保留以“进入”起首的延续结构；分号帮助读者辨明躲避的动作与雅威起来施行震慑之间的关系。
