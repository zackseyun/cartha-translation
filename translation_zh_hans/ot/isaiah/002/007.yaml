base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/007.yaml
  text: His land is filled with silver and gold[a], and there is no end to his treasures; his land is filled with horses[b], and there is no end to his chariots.
translation:
  language: zh_hans
  text: 他的国土充满了金银[a]，他的财宝[b]无穷无尽；他的国土充满了马匹，他的战车也无穷无尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文中“他的国土……他的财宝……他的战车”的所属后缀均为第三人称阳性单数；这里的单数很可能集合性地指整个民族或国家。
    reason: lexical_alternative
  - marker: b
    text: “财宝”也可译作“宝库”或“储藏处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמָּלֵא
  choice: 充满了
  rationale: 该词源自 מלא，表示“充满、装满”。采用“充满了”保留希伯来语叙述形式及其结果状态；在本节的先知性描述中，也自然表达国土已经遍布这些事物。
- source_word: אַרְצוֹ
  choice: 他的国土
  rationale: 原文为“地、土地”加第三人称阳性单数后缀。“国土”在现代汉语中比直译“他的地”自然，并适合这里以单数集体指向国家或民族的语境；“他的”则保留原文单数。
- source_word: כֶּסֶף וְזָהָב
  choice: 金银
  rationale: 这是现代汉语中自然、凝练的固定搭配，准确表达作为贵重金属和财富象征的“银与金”，同时符合希伯来诗句的节奏。
- source_word: וְאֵין קֵצֶה
  choice: 无穷无尽
  rationale: 原意为“没有尽头、没有限度”。“无穷无尽”自然传达数量多得没有边际，并保留两处重复所形成的修辞平行。
- source_word: לְאֹצְרֹתָיו
  choice: 他的财宝
  rationale: אֹצָר 可指财宝、宝库或储藏处。上下文刚提到金银，因此正文采用“财宝”，侧重所积聚的财富；其他可能义在脚注中保留。
- source_word: סוּסִים
  choice: 马匹
  rationale: 直接表达复数“马”；“马匹”在现代书面汉语中自然庄重。
- source_word: לְמַרְכְּבֹתָיו
  choice: 他的战车
  rationale: מֶרְכָּבָה 指车辆或战车；与马匹并列且处于财富和国力的描述中，“战车”最能传达古代军事装备的语境。
theological_decisions:
- issue: 集体性谴责中第三人称阳性单数后缀的处理
  choice: 他的国土……他的财宝……他的战车
  alternative: 他们的国土……他们的财宝……他们的战车
  rationale: 希伯来语三处所属后缀以及“国土”的后缀均为阳性单数，可能以单数集合性地指雅各、其民族或国家。正文保留“他的”，不把原文的数改平为复数；脚注说明这种集合用法，以免读者误以为必然指某个未具名的个人。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文两组平行句和“无穷无尽”的重复，以呈现诗性节奏；同时保留第三人称单数，不在正文中消解其集合性所指。
