  naturalness: “供他跪拜”比“让他跪拜”更自然且句法关系明确；“扔给”在此保留将偶像弃给这些动物的形象，语气也较合先知书上下文。
  terminology: “偶像”“跪拜”“蝙蝠”均恰当。“鼹鼠”可作为正文的传统、易懂译法，但应以脚注保留 לַחְפֹּר פֵּרוֹת 所指动物的不确定性。
