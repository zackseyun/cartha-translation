  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יַשְׁלִ֣יךְ הָ/אָדָ֔ם אֵ֚ת אֱלִילֵ֣י כַסְפּ֔/וֹ וְ/אֵ֖ת אֱלִילֵ֣י זְהָב֑/וֹ אֲשֶׁ֤ר עָֽשׂוּ ל/וֹ֙ לְ/הִֽשְׁתַּחֲוֺ֔ת לַ/חְפֹּ֥ר פֵּר֖וֹת וְ/לָ/עֲטַלֵּפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/020.yaml
  text: In that day man will throw away his idols of silver and his idols of gold[a], which they made for him to bow down to[c][b], to the moles and to the bats.
translation:
  language: zh_hans
  text: 到那日，人必把他的银偶像和金偶像，就是人们为他制造、供他跪拜的，扔给鼹鼠[a]和蝙蝠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鼹鼠”：原文这个词组所指的动物不能确定，也可能泛指其他穴居动物。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知书常见的时间公式，并采用自然、庄重的现代汉语表达。
- source_word: יַשְׁלִיךְ
  choice: 丢给
  rationale: 该动词表示投掷、丢弃；结合后面的介词短语，译为“丢给”既表现弃绝偶像，也自然连接鼹鼠和蝙蝠。
- source_word: הָאָדָם
  choice: 人
  rationale: 希伯来语单数在此具有泛指和代表性；汉语“人”可自然保留这种概括意义，无须改成复数。
- source_word: אֱלִילֵי כַסְפּוֹ וְאֵת אֱלִילֵי זְהָבוֹ
  choice: 他的银偶像和金偶像
  rationale: 准确传达所属关系与材质；汉语无需机械重复“偶像”，仍保留原文并列和谴责语气。
- source_word: אֲשֶׁר עָשׂוּ לוֹ
  choice: 就是人们为他制造
  rationale: 保留原文复数主动动词与单数受益者；以“人们”表达未明说的制作者，不擅自限定为工匠。
- source_word: לְהִשְׁתַּחֲוֺת
  choice: 让他跪拜
  rationale: 保留俯伏、跪拜这一身体动作及其敬拜含义，也使目的结构在现代汉语中清楚自然。
- source_word: לַחְפֹּר פֵּרוֹת
  choice: 鼹鼠[a]
  rationale: 原词组所指动物不确定，传统上常理解为鼹鼠；正文采用熟悉译法，并以脚注保留不确定性。
- source_word: וְלָעֲטַלֵּפִים
  choice: 和蝙蝠
  rationale: 词义明确，与前面的穴居动物共同构成被弃于幽暗之处的意象。
theological_decisions:
- issue: הָאָדָם 的代表性范围
  choice: 用单数泛指的“人”
  alternative: 人类；人们
  rationale: 原文使用单数 אָדָם 代表一般的人。现代汉语“人”既自然又保留单数泛指，不把它误解为某一特定男子，也不将其不必要地复数化。
- issue: 跪拜行为与敬拜含义
  choice: 正文译“跪拜”
  alternative: 敬拜；俯伏敬拜
  rationale: 原动词直接描写俯伏动作，同时在偶像语境中具有敬拜含义。“跪拜”保留具体动作，不将原文的具象表达抽象化。
- issue: 偶像被丢弃的去向
  choice: 译作“丢给鼹鼠和蝙蝠”
  alternative: 丢到鼹鼠和蝙蝠那里；丢弃给穴居动物和蝙蝠
  rationale: 介词 לְ 可表达交给或丢向这些动物。正文保留“给”的简洁结构，不进一步断定具体地点或处置方式。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。“到那日”维持预言语体；句中插入解释性关系分句，以保留原文“人们为他制造”的复数主动形式。仅对确有文本依据的不确定动物名称加注。
