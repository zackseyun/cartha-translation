id: ISA.2.19
reference: Isaiah 2:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָ֨אוּ֙ בִּ/מְעָר֣וֹת צֻרִ֔ים וּ/בִ/מְחִלּ֖וֹת עָפָ֑ר מִ/פְּנֵ֞י פַּ֤חַד יְהוָה֙ וּ/מֵ/הֲדַ֣ר גְּאוֹנ֔/וֹ בְּ/קוּמ֖/וֹ לַ/עֲרֹ֥ץ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/019.yaml
  text: And they will enter the caves of the rocks and the holes of the dust from before the terror of Yahweh and from the splendor of his majesty[a], when he rises to terrify the earth.
translation:
  language: zh_hans
  text: 他们必进入岩石的洞穴和尘土中的地洞[a]，躲避雅威所带来的恐怖和他威严的荣光；当他兴起、使大地惊恐时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地洞”也可译作“尘土中的洞穴”或“尘土中的兽穴”。
    reason: 原词 מְחִלּוֹת 可指洞、地下通道或兽穴，具体形态并不确定。
lexical_decisions:
- source_word: וּבָאוּ
  choice: 他们必躲进
  rationale: 该动词在预言语境中具有将来、承接之意；结合随后表示藏身处的介词短语，译为“躲进”自然地表达进入避难之处的动作，也与本节逃避审判的语境相符。
- source_word: בִּמְעָרוֹת צֻרִים
  choice: 岩石的洞穴
  rationale: מְעָרוֹת 指洞穴，צֻרִים 指岩石、峭壁；此译保留两者的具体意象，并符合现代汉语表达。
- source_word: וּבִמְחִלּוֹת עָפָר
  choice: 尘土中的地洞
  rationale: מְחִלּוֹת 可指洞、地穴或兽穴，עָפָר 本义为尘土；“尘土中的地洞”既保留原文意象，又比直译“尘土的洞”自然。
- source_word: מִפְּנֵי
  choice: 逃避
  rationale: 该短语字面为“从……面前”，在此表示因雅威临近而逃离。中文用“逃避”可清楚传达方向和处境；所逃避的临在感由下文神兴起的场景保留。
- source_word: פַּחַד יְהוָה
  choice: 雅威的威严
  rationale: פַּחַד 可指恐惧、惊惧，也可转指使人恐惧的威势。此处与“他庄严的荣光”并列，译作“雅威的威严”兼顾神所显出的可畏威势，避免让“逃避恐惧”在中文中产生仅指内在情绪的歧义。
- source_word: וּמֵהֲדַר גְּאוֹנוֹ
  choice: 和他庄严的荣光
  rationale: הָדָר 表示荣美、光辉，גָּאוֹן 在指神时表示尊荣、威严；此译保留复合的庄严与光辉意象，并避免生硬重复。
- source_word: בְּקוּמוֹ
  choice: 那时，他必兴起
  rationale: 介词加不定式结构表示时间情境，即“当他起来时”；“兴起”适合神施行审判的庄严语域，“那时”明确其时间关系。
- source_word: לַעֲרֹץ
  choice: 使……惊恐
  rationale: 该动词在此有使人战栗、惊惧之意；“使大地惊恐”保留原文以“大地”为受事者的拟人化表达。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 本节审判图景范围广阔，“大地”比局部性的“那地”更合适，也保留诗歌语体。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为较贴近学界通行重构读音的音译，保留其作为专名的性质，不以称号替代。
- issue: פַּחַד יְהוָה 所指的是人的恐惧还是神可畏的威势
  choice: 雅威的威严
  alternative: 对雅威的恐惧；雅威所带来的惊恐
  rationale: 该短语可能指雅威所激起的恐怖，也可能以“恐怖”转指其可畏临在。因其与“他庄严的荣光”平行，本译采用“威严”，但不把审判所造成的惊恐削弱；末句“使大地惊恐”明确保留这一层面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句子依照希伯来诗句的推进分为藏身、逃避神的威荣、神兴起使大地惊恐三层；保留“大地惊恐”的拟人化张力。
