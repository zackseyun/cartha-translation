  to: 他们必进入岩石的洞穴和尘土中的地洞[a]，躲避雅威所带来的恐怖和他威严的荣光；当他兴起、使大地惊恐时。
  rationale: 修订保留原文的三重推进：进入洞穴、逃避雅威引起的恐怖及其威严荣光、以及他兴起使大地惊恐的时间情境。“所带来的恐怖”在现代汉语中避免“雅威的恐怖”可能产生的属格歧义，同时不把恐怖误化为单纯威严。脚注锚点及其词汇替代项均保留。
