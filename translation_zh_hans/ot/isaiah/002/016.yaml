    又攻击一切华美的船舶。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “华美的船舶”也可能译作“所有华美的图像”或“所有可喜爱的作品”。这里译作“船舶”的希伯来词十分罕见，确切含义不明；由于它与“他施的船只”并列，正文采用与船舶有关的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 攻击
  rationale: 本节承接2:12起耶和华审判所针对的对象；译作“攻击”自然表达敌对方向，并以重复句式保留诗歌的排比。
- source_word: כָּל
  choice: 所有
  rationale: 表达整体性的范围，也保留原文两次重复所形成的广泛审判之意。
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: 他施的船只
  rationale: 保留原文的属格结构及传统地名表达，不强行判定为往返他施的船，或泛指远洋商船。
- source_word: שְׂכִיּוֹת
  choice: 船艇
  rationale: 该词极罕见，确切含义不明。鉴于它与“他施的船只”构成海事语境中的诗歌平行，“船艇”是较合语境的正文选择；其他可能义项在脚注中保留。
- source_word: הַחֶמְדָּה
  choice: 华美的
  rationale: 该词表示可喜爱、令人向往或珍贵；“华美的”在修饰船艇时自然，并传达其因精美而受珍视的意味。
