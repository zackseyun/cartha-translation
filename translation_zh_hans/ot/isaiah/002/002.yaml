id: ISA.2.2
reference: Isaiah 2:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים נָכ֨וֹן יִֽהְיֶ֜ה הַ֤ר בֵּית יְהוָה֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֖א מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ אֵלָ֖י/ו כָּל הַ/גּוֹיִֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/002.yaml
  text: And in the latter days the mountain of the house of Yahweh shall be established as the highest of the mountains[a], and shall be lifted up above the hills[c][b]; and all the nations shall stream to it.
translation:
  language: zh_hans
  text: 末后的日子必然来到，那时，雅威殿的山必被坚立，成为众山之首[a]，并高过众岭；万国都必涌向这山[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成为众山之首”也可译作“被坚立在众山之巅”。
    reason: alternative_reading
  - marker: b
    text: 原文动词描绘万国像河水一样涌流向这山；也可译作“万国都必如水流向它”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 到……必
  rationale: 引出将来的先知性景象；汉语无需直译为“事情将要发生”，以“到……必”自然承接时间短语并保留未来意味。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 到末后的日子
  rationale: 保留希伯来语先知性时间惯用语及其开放幅度，不将它限定为某一具体末世体系。
- source_word: נָכוֹן יִהְיֶה
  choice: 必被坚立
  rationale: 表达稳固、确立、不可动摇的状态；“坚立”兼顾原文形象和庄重文体。
- source_word: הַר בֵּית יְהוָה
  choice: 耶和华殿的山
  rationale: 清楚呈现“耶和华之殿”与“山”的所属关系，同时使现代汉语简洁自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，明确保留专名性质，而不以“主”这一称号替代。
- source_word: בְּרֹאשׁ הֶהָרִים
  choice: 成为众山之首
  rationale: רֹאשׁ 可指顶部，也可表示首位；结合下句“高过众岭”，正文取尊荣、居首之意，并以脚注保留空间性读法。
- source_word: וְנִשָּׂא מִגְּבָעוֹת
  choice: 高过众岭
  rationale: 简洁表达被抬高或受尊崇而高于丘陵的比较意义，并与“众山之首”形成自然平行。
- source_word: גְּבָעוֹת
  choice: 众岭
  rationale: 指较低的丘陵；“岭”在此与“山”构成庄重而自然的地貌平行。
- source_word: וְנָהֲרוּ
  choice: 必如水奔流
  rationale: 保留动词描绘像河水流动的鲜明隐喻；加“如水”使这一反常地用于万国向山而流的图像在中文中清楚可感。
- source_word: אֵלָיו
  choice: 归向它
  rationale: 阳性单数代词回指“山”；用“它”避免将所指误解为人物，“归向”表达朝向并汇聚于此。
- source_word: כָּל הַגּוֹיִם
  choice: 万国
  rationale: 自然概括所有列国，符合先知书语体；不译作“外邦人”，以免过度强调其与以色列的对立身份。
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים 的末世性幅度
  choice: 到末后的日子
  alternative: 在将来的日子／到末日
  rationale: 正文较形式地保留先知性表达，既容纳末世意涵，也不武断指定某一时间表；脚注说明较宽泛的可能译法。
- issue: 耶和华殿之山如何被高举
  choice: 被坚立，成为众山之首
  alternative: 被坚立在众山之巅
  rationale: 希伯来语可表达首位、至高，也可能被理解为空间上的山顶位置。平行句“高过众岭”支持正文采用尊荣与超越之意，但不排除较空间性的读法。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 正文保留神名而非仅用称号；“耶和华”是现代简体中文圣经传统中辨识度最高、最通行的专名形式。
- issue: 万国“奔流”上山的意象
  choice: 如水奔流归向它
  alternative: 涌向它
  rationale: 原文有河水流动的隐喻，而且水反常地流向高山，强化万国受吸引归向锡安的图景；不将其淡化为普通的“前往”。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“末后的日子”“坚立”“万国”等保留先知书语感；用“如水奔流”显明原文核心隐喻。正文不强行界定末世时间，也不把山的升高限定为纯地理变化。
