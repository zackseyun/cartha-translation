  to: 末后的日子必然来到，那时，雅威殿的山必被坚立，成为众山之首[a]，并高过众岭；万国都必涌向这山[b]。
  rationale: 修订仅处理神名一致性、现代汉语的句法自然度，以及动词方向义的精确性。正文仍保留“末后的日子”的先知性开放幅度、“众山之首”的优越／高举意义，并藉脚注保留“在众山之巅”的空间性读法及万国如水流汇聚的词汇图像。
