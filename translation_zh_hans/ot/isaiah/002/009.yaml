  text: וַ/יִּשַּׁ֥ח אָדָ֖ם וַ/יִּשְׁפַּל אִ֑ישׁ וְ/אַל תִּשָּׂ֖א לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/009.yaml
  text: So man is bowed down[a], and each person is brought low; do not forgive them.
translation:
  language: zh_hans
  text: 世人屈身，人人降卑；不要赦免他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要抬举他们。”希伯来语这个动词可表示“抬起、背负、承担”，在某些语境中也可表示“赦免”。
    reason: 保留末句动词的另一种可行读法。
lexical_decisions:
- source_word: וַיִּשַּׁח
  choice: 屈身
  rationale: 该词表示弯下、低伏或受屈辱；这里与下句“降卑”构成诗歌平行，也可能承接上文，暗示人在偶像前屈身。
- source_word: אָדָם
  choice: 世人
  rationale: 在与 אִישׁ 的平行结构中泛指人类；“世人”自然保留了整体性的泛称。
- source_word: וַיִּשְׁפַּל
  choice: 降卑
  rationale: שׁפל 表示变为低微、被贬低或受屈辱；“降卑”凝练地传达审判语境中的卑下状态。
- source_word: אִישׁ
  choice: 人人
  rationale: 与泛称“世人”相对，突出每一个个体，并以自然的汉语保留诗句的递进和平行。
- source_word: וְאַל תִּשָּׂא לָהֶם
  choice: 不要赦免他们
  rationale: נשא 可指抬起、承担，也可在涉及罪责时表示赦免。审判偶像崇拜与骄傲的语境支持“赦免”，但“抬举”仍是可行读法，故收入脚注。
theological_decisions:
- issue: 末句 נשא 的含义
  choice: 请求上帝不要赦免他们
  alternative: 不要抬举他们
  rationale: 该动词本身允许“赦免”与“抬起、抬举”两种理解。上下文的审判语气使“不赦免”较为合适，但不应消除原文真实存在的歧义，因此保留另一读法。
- issue: 前两句描述敬拜动作还是受审判后的卑微
  choice: 采用兼容两者的“屈身……降卑”
  alternative: 明确译为“下拜……被贬低”或“被压低……被降卑”
  rationale: 动词形式和上下文既可让人想到在偶像前屈身，也可描述人受辱降卑；中文采用不强行排除任一层面的表达。
translation_notes:
  register: 采用现代、庄重而简洁的经文语体。“世人……人人”体现 אָדָם 与 אִישׁ 的诗歌平行；分号保留前两句陈述与末句祈使之间的转折力度。
