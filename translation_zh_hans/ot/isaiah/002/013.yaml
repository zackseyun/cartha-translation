  text: וְ/עַל֙ כָּל אַרְזֵ֣י הַ/לְּבָנ֔וֹן הָ/רָמִ֖ים וְ/הַ/נִּשָּׂאִ֑ים וְ/עַ֖ל כָּל אַלּוֹנֵ֥י הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/013.yaml
  text: and against all the cedars of Lebanon[a], lofty and lifted up, and against all the oaks of Bashan.
translation:
  language: zh_hans
  text: 又临到黎巴嫩所有高耸、挺立的香柏树，又临到巴珊所有的橡树[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“笃耨香树”。希伯来语所指的具体树种不能完全确定，可能指橡树或笃耨香树一类的大树。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 又临到
  rationale: 在耶和华之日施行审判的清单中，עַל 表示带有敌意的临到；译为“又临到”既保留重复的并列结构，也自然表达审判将落在这些对象之上。
- source_word: כָּל
  choice: 一切
  rationale: 与复数树木名称搭配，表达诗歌性总括；“一切”符合现代汉语庄重语体。
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: 黎巴嫩一切……香柏树
  rationale: 这是表示地域关联的构词组合；“黎巴嫩的香柏树”是本义，因“一切”插入，译作“黎巴嫩一切……香柏树”更顺畅。
- source_word: הָרָמִים וְהַנִּשָּׂאִים
  choice: 高大耸立的
  rationale: 两个并列分词都描写树木高耸，并与上下文的高傲主题呼应。“高大耸立”保留其实体意象，不把它直接解释为人的骄傲。
- source_word: אַלּוֹנֵי הַבָּשָׁן
  choice: 巴珊一切的橡树
  rationale: אַלּוֹן 通常可译作“橡树”，与香柏树并列时也符合雄伟树木的语境；树种识别仍有不确定性，故在脚注保留另一可能。
theological_decisions:
- issue: 审判诗歌中树木的象征作用
  choice: 正文保留真实树木的意象，让其与高傲者的关联由上下文呈现。
  alternative: 在正文中直接译成骄傲的统治者或列国的象征。
  rationale: 本段列举高耸的自然物与人造物，说明耶和华要使一切自高者降卑。直译树木意象可保存诗歌张力，并避免把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。重复“又临到”以保留原文审判清单的节奏；用“高大耸立”传达两个近义词的累积效果，同时避免生硬重复。
