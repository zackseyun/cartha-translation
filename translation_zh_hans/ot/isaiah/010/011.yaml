  yaml_path: translation/ot/isaiah/010/011.yaml
  text: shall I not do to Jerusalem and her idols just as I did to Samaria and her idols?[a]
translation:
  language: zh_hans
  text: 我怎样对待了撒玛利亚和她的偶像，难道不也要照样对待耶路撒冷和她的神像吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在两处用了不同的词：撒玛利亚的是“偶像”（אֱלִילִים），耶路撒冷的是“神像／偶像”（עֲצַבִּים）。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 难道不会……吗
  rationale: 引出预期肯定回答的反问，既保留希伯来语的修辞力量，也符合现代汉语表达。
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 怎样……照样
  rationale: 清楚呈现撒玛利亚与耶路撒冷之间的对应比较，保持原文的平行结构。
- source_word: עָשִׂיתִי / אֶעֱשֶׂה
  choice: 对待……不会……对待
  rationale: 前者指已经对撒玛利亚做过的事，后者指将要对耶路撒冷做的事；“对待”自然表达 עשה ל־ 的受事关系，同时不在正文中过度补明敌对含义。
- source_word: לְשֹׁמְרוֹן / לִירוּשָׁלַםִ
  choice: 对待撒玛利亚 / 对待耶路撒冷
  rationale: 这里的 ל־ 标明行动所涉及的对象；用“对待”比直译“向”更符合现代汉语，又不额外解释具体行动。
- source_word: אֱלִילֶיהָ
  choice: 她的偶像
  rationale: אֱלִילִים 通常指虚无、无用的偶像；正文采用通行而清楚的“偶像”，不额外展开其贬义色彩。
- source_word: עֲצַבֶּיהָ
  choice: 她的神像
  rationale: 该词可指祭祀用的像或偶像。译作“神像”既传达所指，也保留它与前一分句 אֱלִילִים 的词汇差异。
theological_decisions:
- issue: 两种不同的偶像用语（אֱלִילִים 与 עֲצַבִּים）如何处理
  choice: 正文分别译作“偶像”和“神像”
  alternative: 两处都译作“偶像”，并仅在脚注说明希伯来文用词不同
  rationale: 原文刻意使用了两个不同名词；汉语中“偶像／神像”可以自然地保留这一差异，同时不削弱撒玛利亚与耶路撒冷命运相同的修辞平行。脚注进一步说明二词均指受敬拜的像。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“难道不会……吗”保留反问语气，用“怎样……照样”呈现原文的比较结构；“对待”避免生硬直译，也不把上下文中的毁灭含义直接增补进本节。
