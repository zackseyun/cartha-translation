base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/034.yaml
  text: And the thickets of the forest will be cut down with iron[a], and Lebanon will fall by a mighty one.
translation:
  language: zh_hans
  text: 森林中茂密交错的枝木必被铁器砍下；黎巴嫩必在一位大能者手中倒下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“黎巴嫩必在那大能者手中倒下。”这里的“大能者”也可理解为指神的称号。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִקַּף
  choice: 砍倒
  rationale: 该动词的尼法勒式在此表达被砍伐的意思；“砍倒”自然地承接树木倾倒的意象，并与下句“倾倒”形成呼应。
- source_word: סִבְכֵי הַיַּעַר
  choice: 森林的密林
  rationale: סבך指繁密交错的灌木或枝木；“密林”简洁保留森林中茂密、纠结成片的景象，不限定为树梢或枝条。
- source_word: בַּבַּרְזֶל
  choice: 用铁器
  rationale: 原文直译为“用铁”，是以材质代指铁制砍伐工具；中文用“铁器”既保留材质意象，也不擅自具体化为斧头。
- source_word: וְהַלְּבָנוֹן
  choice: 黎巴嫩
  rationale: 保留地名及其著名森林所承载的宏伟意象，也保留其可能具有的象征性。
- source_word: בְּאַדִּיר
  choice: 在一位大能者手下
  rationale: אַדִּיר可指大能、威严者；介词ב在此可表施事。此译法在现代中文中自然表达“由一位大能者使之倾倒”，同时不直接断定这是神的称号。
- source_word: יִפּוֹל
  choice: 必……倾倒
  rationale: נפל的基本义为“倒下、倾倒”；“倾倒”保留树木轰然倒下的诗歌画面，没有改译成被动的“被砍倒”。
theological_decisions:
- issue: אַדִּיר是否应明确译作指向神的称号
  choice: 一位大能者
  alternative: 大能者（作为神的称号）
  rationale: 上下文强烈暗示施行审判的是耶和华，但本节原文没有出现神名，也未明确要求把אַדִּיר认作专有称号。正文保留其可能泛指或特指神的张力，脚注说明另一种理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“铁器”保留原文以材质代工具的表达；“密林”呈现枝木繁密交错的意象。正文不以专名化方式消除“大能者”所具有的指称歧义。
