revisions:
- from: 他要用铁器砍倒森林的密林，黎巴嫩必在一位大能者手下倾倒。[a]
  to: 森林中茂密交错的枝木必被铁器砍下；黎巴嫩必在一位大能者手中倒下。[a]
  rationale: 修订删除原文未明示的“他要”，以被动句保留原文对森林被砍伐的描写；将重复的“森林的密林”改为“森林中茂密交错的枝木”，更贴近סִבְכֵי的意象。下半句以“在一位大能者手中”表达施事关系，避免“手下”的歧义，同时维持“大能者”是否为神圣称号的文本张力。
