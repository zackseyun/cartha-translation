language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עוֹרֵ֨ר עָלָ֜י/ו יְהוָ֤ה צְבָאוֹת֙ שׁ֔וֹט כְּ/מַכַּ֥ת מִדְיָ֖ן בְּ/צ֣וּר עוֹרֵ֑ב וּ/מַטֵּ֨/הוּ֙ עַל הַ/יָּ֔ם וּ/נְשָׂא֖/וֹ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/026.yaml
  text: And Yahweh of hosts will stir up a whip against him[a], as at the striking down of Midian at the rock of Oreb; and his staff will be over the sea[c][b], and he will lift it as in the way of Egypt.
translation:
  language: zh_hans
  text: 万军之耶和华必兴起鞭子攻击他[a]，像从前在俄立磐石那里击打米甸一样[b]；他的杖要在海上方[c]，他必照着在埃及的方式把它举起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必兴起一根鞭子来攻击他。”
    reason: 原文动词有“唤起、激起、使之发动”的意思；正文以“兴起鞭子”表达其使役意义。
  - marker: b
    text: “俄立磐石”使人想起《士师记》7:25：米甸首领俄立在那里被杀。
    reason: 指出原文明确唤起的历史背景。
  - marker: c
    text: “他的杖”可能指耶和华的杖，也有人理解为亚述人的杖；海与埃及的意象很可能暗指出埃及时举杖过海的事件。
    reason: 保留希伯来语代词指向的歧义，并说明出埃及的典故。
lexical_decisions:
- source_word: וְעוֹרֵר
  choice: 必扬起
  rationale: 使役式在此表示使惩罚的器具发动；汉语以“扬起鞭子”自然表达举鞭施打，并体现上下文中的将来行动。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神的专名“耶和华”，并以传统而易懂的“万军”表达צְבָאוֹת所指受他统辖的众军。
- source_word: שׁוֹט
  choice: 鞭子
  rationale: 具体保留施打与惩罚的比喻，不抽象化为“刑罚”。
- source_word: כְּמַכַּת מִדְיָן
  choice: 像从前……击打米甸一样
  rationale: מַכָּה在此指击打、击败的行动；“击打”保留词根的动作感，又避免“屠杀”所增加的群体杀戮含义。
- source_word: בְּצוּר עוֹרֵב
  choice: 在俄立磐石那里
  rationale: 保留历史地点名称及对《士师记》7:25的暗示。
- source_word: וּמַטֵּהוּ עַל הַיָּם
  choice: 他的杖必临到海上
  rationale: 保留“他的”所具有的指代空间，并用“临到海上”表达עַל的空间关系而不额外规定具体动作。
- source_word: וּנְשָׂאוֹ
  choice: 他必将杖举起
  rationale: נשׂא的基本义是举起；把代词所指的“杖”明说，符合现代汉语并清楚保留动作。
- source_word: בְּדֶרֶךְ מִצְרָיִם
  choice: 如同当年对付埃及一样
  rationale: 该短语更可能表示“埃及事件中的方式”，暗指过红海，而非通往埃及的道路；此译自然传达方式比较，同时由脚注保留另一种可能。
theological_decisions:
- issue: 后半句代词的指向
  choice: 正文保留“他的杖／他必举起”的形式，依出埃及的海上意象，较自然地理解为耶和华的杖和行动。
  alternative: “他的”也可能指亚述人的杖，即其杖被转而用来攻击他。
  rationale: 紧邻上下文提到亚述的杖，构成指代张力；但“海”和“埃及”强烈唤起耶和华在出埃及时的行动。译文不另加明确主语，以免消除原文张力。
- issue: 历史救赎事件的双重暗示
  choice: 保留俄立磐石、海和埃及的具体意象。
  alternative: 概括译作“像过去击败仇敌一样”。
  rationale: 原文有意把将来的审判与米甸之败及出埃及过海相连，概括译法会丢失这些神学与历史关联。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万军之耶和华”为圣经语域中通行且可理解的称呼；句式保持诗性平行，同时避免生硬直译“按埃及的道路”。所有脚注标记均置于相关正文之后。
