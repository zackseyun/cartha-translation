  naturalness: “万军之耶和华”“俄立磐石”“米甸”均合乎现代中文圣经语域。“他的杖必临到海上”搭配生硬，宜改为较自然而仍保留空间意象的“他的杖要在海上方”。
  terminology: 神名“耶和华”、称号“万军之”、地名“俄立”“米甸”均可保留。脚注a的“激起鞭打来攻击他”中文不通，且把鞭子误作“鞭打”的动作；应说明“兴起/发动一根鞭子”。脚注c应保留代词指向的歧义，但不应把正文的“方式”解释成唯一的“对付埃及”。
