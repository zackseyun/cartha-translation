  yaml_path: translation/ot/isaiah/010/008.yaml
  text: For he says[b][a], “Are not my commanders all kings?”
translation:
  language: zh_hans
  text: 因为他说：“我的将领不都是王吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “将领”或译“首领”“官长”；希伯来语这个词可指统治者、官员或军事长官。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为亚述王狂妄行事作出解释；“因为”自然保留原文的说明或因由关系。
- source_word: יֹאמַר
  choice: 他说
  rationale: 未完成式在先知话语中可生动地引出人物一贯或正在表达的夸口；现代汉语用“他说”最自然。
- source_word: הֲלֹא
  choice: 不全都是……吗
  rationale: 保留期待肯定回答的反问语气，并与复数主语及יַחְדָּו的整体含义自然结合。
- source_word: שָׂרַי
  choice: 我的将领
  rationale: שַׂר可指首领、官长、统治者或军事长官；在亚述帝国夸耀武力的语境中，“将领”既贴合军事政治身份，也避免“王子”所暗示的血统含义。
- source_word: יַחְדָּו
  choice: 全都
  rationale: 该词字面为“一同”，此处强调这些将领无一例外、个个如王；译作“全都”符合现代汉语反问句习惯。
- source_word: מְלָכִים
  choice: 王
  rationale: 原词直接指诸王；汉语在“全都是王”中通常无需使用复数标记，也能清楚表达复数意义。
theological_decisions: []
