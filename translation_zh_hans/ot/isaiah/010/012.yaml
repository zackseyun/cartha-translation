id: ISA.10.12
reference: Isaiah 10:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יְבַצַּ֤ע אֲדֹנָ/י֙ אֶת כָּל מַֽעֲשֵׂ֔/הוּ בְּ/הַ֥ר צִיּ֖וֹן וּ/בִ/ירוּשָׁלִָ֑ם אֶפְקֹ֗ד עַל פְּרִי גֹ֨דֶל֙ לְבַ֣ב מֶֽלֶךְ אַשּׁ֔וּר וְ/עַל תִּפְאֶ֖רֶת ר֥וּם עֵינָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/012.yaml
  text: And it will happen that when the Lord has finished all his work on Mount Zion and in Jerusalem[a], I will punish the fruit of the greatness of the heart of the king of Assyria[c][b], and the splendor of his haughty eyes.
translation:
  language: zh_hans
  text: 将来，主在锡安山和耶路撒冷完成他一切的工作时，我必追讨[a]亚述王狂傲之心所结的果子[b]，和他高傲眼神的光彩[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “追讨”也可译作“惩罚”或“问罪”。原文动词可指神临到人施行审判。
    reason: lexical_alternative
  - marker: b
    text: 直译：“亚述王心之高大的果子。”这里“心之高大”指内心的狂傲。
    reason: literal_rendering
  - marker: c
    text: 直译：“他眼目之高的荣美（或光彩）。”这是指他眼神中显出的骄傲与自矜。
    reason: literal_rendering
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 等到
  rationale: 这一组合引出将来完成后的时间情境；“等到”自然表达“当……完成以后”的语义，也保留后续审判的次序。
- source_word: יְבַצַּע
  choice: 完成
  rationale: 此处的加强词干表示把行动进行到底、做完；“完成”准确且符合现代汉语。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神的称号“主”，不是四字神名；按称号翻译为“主”。
- source_word: כָּל מַעֲשֵׂהוּ
  choice: 他一切的工作
  rationale: מַעֲשֶׂה可指行为、作为或工作；这里概括神在锡安和耶路撒冷所做的一切，译作“工作”宽泛而自然。
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלָם
  choice: 在锡安山和耶路撒冷
  rationale: 介词按地点义处理，不擅自译成“攻击”或“敌对”，从而保留神在当地施行之工作的开放性与张力。
- source_word: אֶפְקֹד עַל
  choice: 追讨
  rationale: 在审判语境中，该结构表示临到某人而问罪、惩治；“追讨”兼具查究与施行审判之意。
- source_word: פְּרִי גֹדֶל לְבַב
  choice: 心中狂傲所结的果子
  rationale: 保留“果子”的比喻，同时将“心的高大”这一希伯来表达的负面语境义自然传达为“心中狂傲”。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 这是中文表达该属格结构的简洁标准形式。
- source_word: תִּפְאֶרֶת רוּם עֵינָיו
  choice: 他高傲眼神的威风
  rationale: 原文直陈“他眼目高高在上的荣美”；“高傲眼神”保留眼目的意象并传达惯用义，“威风”表达其自矜的华美与气势，同时允许反讽意味。
theological_decisions:
- issue: 是否把神在锡安山和耶路撒冷的工作明确解释为攻击或惩罚
  choice: 采用地点表达“在锡安山和耶路撒冷”，不说明工作的性质
  alternative: 译为“对锡安山和耶路撒冷所施行的一切惩罚”
  rationale: 原文介词可自然理解为地点标记，而“工作”本身没有在本节中明确限定为惩罚或复兴；不加解释可保留神先在锡安和耶路撒冷完成其工作、继而追讨亚述王的神学张力。
- issue: “主”与第一人称“我”在同一句中的转换
  choice: 保留“主……我必”的人称转换
  alternative: 统一改成“主……他必”或把前半句改成“我……我的工作”
  rationale: 希伯来文本先以第三人称称“主”，随后直接转为神的第一人称宣告。保留这一转换，避免以顺滑文体为由改写原文话语结构。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“等到……我必……”清楚呈现时间次序；“追讨”具有先知审判话语的力度。“果子”和“眼神”保留原文的核心意象，较生硬的字面结构则放入脚注说明。
