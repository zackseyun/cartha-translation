  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יָס֤וּר סֻבֳּל/וֹ֙ מֵ/עַ֣ל שִׁכְמֶ֔/ךָ וְ/עֻלּ֖/וֹ מֵ/עַ֣ל צַוָּארֶ֑/ךָ וְ/חֻבַּ֥ל עֹ֖ל מִ/פְּנֵי שָֽׁמֶן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/027.yaml
  text: And in that day his burden will depart from your shoulder[a], and his yoke from your neck; and the yoke will be broken because of fatness.
translation:
  language: zh_hans
  text: 到那日，他加在你肩头的重担必被挪去，他套在你颈上的轭也必被除掉；那轭必因肥壮而折断。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因肥壮”或译“因油脂”；传统也译作“因受膏”。原文含义不确定。
    reason: 保留מִפְּנֵי שָׁמֶן的词义与解释歧义，避免把传统神学理解直接写入正文。
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 采用现代汉语中自然而庄重的先知性时间公式，表达未来情境的转换。
- source_word: יָסוּר סֻבֳּלוֹ מֵעַל שִׁכְמֶךָ
  choice: 他加在你肩头的重担必被挪去
  rationale: יָסוּר表示离开、移除；补出“加在”使所属关系和压迫意象在汉语中清楚，同时保留肩头承重的画面。
- source_word: וְעֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: 他套在你颈上的轭也必被除掉
  rationale: 保留“轭”这一支配和奴役的农业隐喻；“套在……上”自然呈现轭压在颈项上的具体形象。
- source_word: וְחֻבַּל עֹל
  choice: 那轭必……折断
  rationale: 被动式表达轭遭破坏而失去效用；“那轭”承接前句，符合现代汉语篇章衔接。
- source_word: מִפְּנֵי שָׁמֶן
  choice: 因肥壮
  rationale: שָׁמֶן可指脂油、肥壮或丰肥；此处短语含义著名地艰深。“肥壮”保留身体增长使轭折断的具体意象，又不擅自引入“受膏”的神学解释。
theological_decisions:
- issue: מִפְּנֵי שָׁמֶן的解释
  choice: 因肥壮
  alternative: 因油脂；因膏油（传统也译作“因受膏”）
  rationale: 原词通常与油脂、肥壮有关，而上下文没有明确提到受膏仪式或受膏者。正文保留较直接但仍有张力的形象，并在脚注列出其他可能和传统译法。
translation_notes:
  register: 采用现代、庄重、易懂的普通话书面语。“重担—轭—肩头—颈上”的平行身体意象予以保留；末句刻意保留原文较为突兀且多义的“肥壮”意象。
