id: ISA.10.24
reference: Isaiah 10:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת אַל תִּירָ֥א עַמִּ֛/י יֹשֵׁ֥ב צִיּ֖וֹן מֵֽ/אַשּׁ֑וּר בַּ/שֵּׁ֣בֶט יַכֶּ֔/כָּה וּ/מַטֵּ֥/הוּ יִשָּֽׂא עָלֶ֖י/ךָ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/024.yaml
  text: 'Therefore thus says the Lord GOD of hosts: Do not fear[a], my people who dwell in Zion, because of Assyria. He will strike you with the rod, and he will lift up his staff against you in the manner of Egypt.'
translation:
  language: zh_hans
  text: 因此，万军之主耶和华如此说：“住在锡安的我的百姓啊，不要因亚述惧怕。亚述必用杖击打你，向你举起他的杖，像埃及所行的那样[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在埃及的路上。”这里也可能指埃及从前压迫以色列的方式。
    reason: 原文 בְּדֶרֶךְ מִצְרָיִם 可指“埃及的方式”，也保留较字面的“埃及之路”理解；脚注保留这一歧义。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 作为承接上文并引出结论的篇章标记，“因此”自然保留其推论关系。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重和公式化色彩。
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: 万军之主耶和华
  rationale: 分别表达 אֲדֹנָי（主）、יהוה（耶和华）和 צְבָאוֹת（万军），同时采用现代中文圣经语域中自然庄重的词序。
- source_word: אַל תִּירָא
  choice: 不要……惧怕
  rationale: 直接表达否定命令，语气简洁而带安慰意味。
- source_word: עַמִּי יֹשֵׁב צִיּוֹן
  choice: 住在锡安的我的百姓啊
  rationale: 将单数形式的分词按集合意义处理，并用呼语“啊”自然呈现直接称呼。
- source_word: מֵאַשּׁוּר
  choice: 因亚述
  rationale: 介词在惧怕动词之后表示惧怕的对象或缘由；“因亚述惧怕”比直译“从亚述惧怕”自然。
- source_word: בַּשֵּׁבֶט יַכֶּכָּה
  choice: 他虽用杖击打你
  rationale: “用杖”保留工具格意义；未完成式在上下文中指将发生或持续的压迫。补出“虽”以体现整句禁令与现实威胁之间的让步关系，但不消除亚述确会施压的张力。
- source_word: וּמַטֵּהוּ יִשָּׂא עָלֶיךָ
  choice: 向你举起棍来
  rationale: 呈现举起棍杖攻击或威吓的形象；“棍”也与前面的“杖”保持词汇区分。
- source_word: בְּדֶרֶךְ מִצְרָיִם
  choice: 如同埃及所行的
  rationale: 正文采用“方式、作法”的理解，指向埃及昔日压迫以色列的方式；脚注保留可能的路径性直译。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה צְבָאוֹת 的表达
  choice: 万军之主耶和华
  alternative: 万军之主雅威
  rationale: “耶和华”在现代简体中文圣经语域中仍是广泛可识别的专名表达，且与“主”并列时能保留原文两个称谓的区别；不以单一称号吞并神名。
- issue: בְּדֶרֶךְ מִצְרָיִם 的历史含义
  choice: 如同埃及所行的
  alternative: 在埃及的路上
  rationale: 上下文更可能把亚述的压迫与埃及昔日的压迫相类比；但原文 דֶּרֶךְ 可指“道路”也可指“方式”，因此以脚注保留较字面的另一种理解。
- issue: 禁令与亚述攻击之间的张力
  choice: 不要因亚述惧怕。他虽用杖击打你
  alternative: 不要怕亚述；他要用杖击打你
  rationale: 加入让步连接词使现代汉语逻辑清楚，同时保留百姓将受击打、却仍蒙命不要惧怕的神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“万军之主耶和华如此说”保留先知宣告的正式语气；“杖／棍”分别对应 שֵׁבֶט 与 מַטֶּה。经文在本节末句法未完，末尾使用逗号以衔接下一节。
