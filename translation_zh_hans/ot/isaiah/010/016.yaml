source:
  edition: WLC
  text: לָ֠/כֵן יְשַׁלַּ֨ח הָ/אָד֜וֹן יְהוָ֧ה צְבָא֛וֹת בְּ/מִשְׁמַנָּ֖י/ו רָז֑וֹן וְ/תַ֧חַת כְּבֹד֛/וֹ יֵקַ֥ד יְקֹ֖ד כִּ/יק֥וֹד אֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/016.yaml
  text: Therefore the Lord[a], Yahweh of Armies, will send wasting sickness among his stout warriors[c][b], and under his glory a burning will be kindled like the burning of fire.
translation:
  language: zh_hans
  text: 因此，主——万军之雅威——必使他那些强壮的人消瘦[a]；在他的荣耀之下[b]，必有烈焰燃起，如火焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强壮的人”直译为“肥壮的人”；原文以肥壮象征健壮、富足或有权势的人。“消瘦”也可译为“衰耗”。
    reason: 说明 בְּמִשְׁמַנָּיו 与 רָזוֹן 的身体意象反转，并保留其不限定为疾病的词义范围。
  - marker: b
    text: “在他的荣耀之下”也可译为“取代他的荣耀”；“荣耀”在这里也可理解为“荣华”或“威仪”。
    reason: 保留 תחת 的替代义以及 כבוד 在审判语境中的词义幅度。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文，引出亚述因骄傲而受审判的结果。
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: 主——万军之雅威——
  rationale: 分别保留定冠词所标明的称号“主”和神名“雅威”；“万军”自然表达 צְבָאוֹת，也保留其广阔含义。
- source_word: בְּמִשְׁמַנָּיו
  choice: 他那些强壮的人
  rationale: 原文直译为“他肥壮的人”，以肥壮形容亚述势力中健壮、强盛的人；不擅自限定为军人。
- source_word: רָזוֹן
  choice: 日渐消瘦
  rationale: 保留“肥壮”与“消瘦”之间的刻意反差，并在现代汉语中自然表达衰耗、瘦弱的审判。
- source_word: וְתַחַת כְּבֹדוֹ
  choice: 在他的荣耀之下
  rationale: 按 תחת 的基本空间义翻译，保留烈火在外在荣华之下燃起的意象；“取代”之义列入脚注。
- source_word: יֵקַד יְקֹד כִּיקוֹד אֵשׁ
  choice: 必有烈焰燃起，如同火焰熊熊燃烧
  rationale: 以“烈焰燃起”和“熊熊燃烧”传达希伯来文同根词叠用造成的加强效果，同时保持庄重、自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名；采用“雅威”以音译其较通行的学术重构，不以头衔取代专名。
- issue: “肥壮的人”的指涉范围
  choice: 强壮的人
  alternative: 肥壮的人；精锐勇士
  rationale: 上下文指向亚述强盛的权贵或精锐力量，但该词本身没有“勇士”成分，因此正文既传达比喻含义，又不把军事指涉说死。
- issue: תחת 的语义
  choice: 在……之下
  alternative: 取代……
  rationale: 正文保留较直接的空间意象，同时以脚注呈现可能的替代义，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文保留“肥壮—消瘦”和“荣耀之下燃火”的诗性张力，不加入原文未明说的“勇士”，并用脚注呈现真实的词义歧义。
