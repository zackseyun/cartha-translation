base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/001.yaml
  text: Woe to those who decree decrees of wickedness[a], and the writers who keep writing oppression[b],
translation:
  language: zh_hans
  text: 祸哉！那些制定邪恶法令的人，以及那些写下压迫之事、写下这些事的人！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 先知宣告审判的感叹语；“祸哉”庄重有力，也符合现代中文圣经语体。
- source_word: הַחֹקְקִים חִקְקֵי אָוֶן
  choice: 那些制定邪恶法令的人
  rationale: חֹקְקִים 与 חִקְקֵי 构成同根复沓，表达制定有约束力的法令；中文若机械重复“制定法令”已自然保留其法律意味，而“邪恶”呈现 אָוֶן 在此处的道德败坏含义。
- source_word: וּמְכַתְּבִים עָמָל כִּתֵּבוּ
  choice: 那些不断写下压迫条文的人
  rationale: מְכַתְּבִים 与 כִּתֵּבוּ 形成刻意重复，强调持续书写；“不断写下”传达这种持续、强化的动作。“压迫条文”结合司法语境说明所写内容带来压迫，同时不把原词限定为现代法律术语。
- source_word: עָמָל
  choice: 压迫
  rationale: 该词可指劳苦、患难、祸害或不公所造成的重担；在制定和书写法令的语境中，“压迫”最能表达这些条文加给人的伤害。
