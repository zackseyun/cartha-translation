base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/014.yaml
  text: My hand found the wealth of the peoples as one finds a nest[a]; and as one gathers abandoned eggs, I gathered all the earth, and there was none that fluttered a wing, or opened a mouth[b], or chirped.
translation:
  language: zh_hans
  text: 我的手找到万民的财富[a]，如同找到鸟窝；我收聚全地[b]，如同收聚被遗弃的鸟蛋。没有谁扇动翅膀、张开嘴，或发出啁啾声。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财富”所译的希伯来词也可指资源、力量或军队；这里的鸟窝、鸟蛋和收聚等意象表明，重点可能是轻易掠得的财物。
    reason: lexical_alternative
  - marker: b
    text: “全地”也可译作“整个国家”或“全世界”。希伯来词可指土地、国家或大地；这里保留说话者夸张口吻中的范围弹性。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמְצָא
  choice: 寻得
  rationale: 保留מצא“找到、寻得”的基本意义，并传达亚述王夸口战利品得来轻易的语气，不强化为“夺取”。
- source_word: כַקֵּן
  choice: 如同寻见鸟窝
  rationale: 原文简略作“像鸟窝”；结合“我的手寻得”，汉语补出“寻见”，使比喻自然清楚，同时保留鸟窝意象。
- source_word: יָדִי
  choice: 我的手
  rationale: 直译以保留“手”所表达的个人能力和行动主体，也维持说话者自夸的口吻。
- source_word: לְחֵיל הָעַמִּים
  choice: 万民的财富
  rationale: חַיִל可指力量、军队、资源或财富；鸟窝、鸟蛋和“收聚”的语境较支持可掠取的财富。“万民”自然表达复数הָעַמִּים，且与下句夸张的普世范围相称。
- source_word: וְכֶאֱסֹף בֵּיצִים עֲזֻבוֹת
  choice: 就像人收聚被遗下的鸟蛋
  rationale: “被遗下”准确保留עֲזֻבוֹת的被弃置、无人看守之意；“鸟蛋”承接鸟窝意象，“人”是为现代汉语明晰而补出的泛指主语。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: אֶרֶץ既可指“地、土地”，也可指“全地、世界”；“全地”保留原文范围上的弹性，又能体现帝国夸口的普遍性。
- source_word: אָסַפְתִּי
  choice: 我收聚
  rationale: 保留אסף的基本意义，并与收集鸟蛋的比喻形成词语呼应。
- source_word: וְלֹא הָיָה נֹדֵד כָּנָף
  choice: 没有谁拍动翅膀
  rationale: נֹדֵד在此描写翅膀活动；“拍动翅膀”是自然、具象的汉语，也保留毫无反抗的鸟类画面。
- source_word: וּפֹצֶה פֶה וּמְצַפְצֵף
  choice: 也没有谁张嘴鸣叫
  rationale: 原文是“张嘴，并啁啾/鸣叫”；合译为“张嘴鸣叫”既保留两个动作，又避免汉语中生硬重复，并维持鸟类意象。
theological_decisions:
- issue: 亚述王夸口的范围
  choice: 全地
  alternative: 整个国家／全世界
  rationale: 原文אֶרֶץ可指某片土地或更广的世界；“全地”不把夸张的帝国言辞限定为某一国家，也不将其硬性解释为字面上的全球征服。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“寻得—寻见”和“收聚—收聚”刻意保留原文的动词呼应；全句维持鸟窝、鸟蛋、翅膀、鸣叫这一连续意象。脚注标记均置于相关正文之后。
