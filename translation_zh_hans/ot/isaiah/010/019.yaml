base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/019.yaml
  text: And the remaining trees of his forest will be few in number[b][a], and a boy can write them down.
translation:
  language: zh_hans
  text: 他树林中剩下的树必屈指可数[a]，一个男孩也能把它们写下来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他树林中余下的树将成为一个数目，一个少年会把它们写下来。”希伯来文以“数目”表达少到可以数清。
    reason: lexical_alternative
  - marker: b
    text: “男孩”所译的希伯来语词为阳性单数，也可指“少年”或“青年”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר
  choice: 剩下的
  rationale: 指毁坏之后所余之物；此处修饰树林中的树，用“剩下的”自然清楚，也避免把“余民”的神学术语色彩带入树木意象。
- source_word: עֵץ יַעְרוֹ
  choice: 他林中的树
  rationale: עֵץ 在此为集合用法，宜译作复数“树”；יַעְרוֹ 的阳性单数后缀保留为“他”，承接上下文所拟人化的亚述。
- source_word: מִסְפָּר יִהְיוּ
  choice: 必屈指可数
  rationale: 字面近于“必成为一个数目”，是指少到能够数点；“屈指可数”以现代汉语自然表达数量极少且可数的含义。
- source_word: וְנַעַר
  choice: 连孩童也
  rationale: נַעַר 可指男孩、少年或青年；这里强调即使年幼者也能记录其数目。“孩童”保留年龄较小的形象，而“连……也”显明上下文中的结果与程度关系。
- source_word: יִכְתְּבֵם
  choice: 能把它们写下来
  rationale: 形式上是“将写下它们”，语境表达树木少到孩童即可逐一记下；用“能”传达隐含的能力和容易程度，“写下来”保留具体书写意象。
theological_decisions:
- issue: 树林的所属代词
  choice: 他林中
  alternative: 其林中
  rationale: 希伯来语后缀为阳性单数，按上下文指向亚述这一被拟人化的势力；“他”较透明地保留原文的人称形式，并不额外确定更具体的神学所指。
- issue: “数目”的习语意义
  choice: 屈指可数
  alternative: 必成为一个数目
  rationale: 原文保留“数目”一词，但语境明显描写审判后所剩树木极少。“屈指可数”传达习语含义；脚注同时保留较直译的可能性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“屈指可数”自然表达希伯来语的数量习语；“写下来”保留原文具体意象。脚注标记均置于对应词句之后。
