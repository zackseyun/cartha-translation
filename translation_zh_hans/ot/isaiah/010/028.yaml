lexical_decisions:
- source_word: בָּא עַל
  choice: 来到
  rationale: 这里的介词 עַל 可表示朝向、抵达或临到；在这段快速推进的行军路线中，译作“来到”最自然，同时避免将原文未明确表达的敌对含义强加进去。
- source_word: עַיַּת
  choice: 亚叶
  rationale: 按希伯来语此处的地名形式音译；通常认为是“艾”的另一形式。
- source_word: יַפְקִיד
  choice: 存放
  rationale: 此动词使役形在这里表示安置、托付保管；结合军队行进语境，译作“存放”准确而自然。
- source_word: כֵּלָיו
  choice: 他的辎重
  rationale: כְּלִי 可泛指器具、装备或物品；在军事行军语境中指随军携带的物资装备，现代汉语以“辎重”概括最为贴切。
