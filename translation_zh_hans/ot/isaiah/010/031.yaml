  yaml_path: translation/ot/isaiah/010/031.yaml
  text: Madmenah has fled[a]; the inhabitants of Gebim have sought refuge.
translation:
  language: zh_hans
  text: 玛得米拿逃走了；基柄的居民都赶去避难[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“都躲藏起来”或“都逃往安全之处”。这里的希伯来语动词含义较难确定，可能强调为求安全而仓促行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדְדָה
  choice: 逃走了
  rationale: 该词是נדד的Qal完成式、阴性单数，与阴性地名“玛得米拿”呼应；在敌军推进、各城惊逃的语境中，译为“逃走了”自然地保留了对城镇的拟人表达。
- source_word: מַדְמֵנָה
  choice: 玛得米拿
  rationale: 专有地名按希伯来语音译，不按其可能的词源意义意译。
- source_word: יֹשְׁבֵי
  choice: 居民
  rationale: ישב的复数构造式分词在此名词化，表示居住在该地的人；“居民”简洁自然，并保留集合意义。
- source_word: הַגֵּבִים
  choice: 基柄
  rationale: 专有地名按希伯来语音译；希伯来文中的冠词不必在汉语地名中另行表达。
- source_word: הֵעִיזוּ
  choice: 都赶去避难
  rationale: 该Hiphil完成式在此处含义困难，语境表明居民为躲避进军而采取急迫的自保行动。“赶去避难”既体现行动的仓促性，也避免采用“显出刚强”等在此语境中容易误导的字面译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；两个分句保持希伯来诗行中城镇接连惊逃的紧凑节奏。完成式以“了”和整体陈述表达；在第二分句加入“都”，自然呈现复数居民的集体反应。脚注标记置于所说明的困难动词短语之后。
