source:
  edition: WLC
  text: כִּ֣י אִם יִהְיֶ֞ה עַמְּ/ךָ֤ יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם שְׁאָ֖ר יָשׁ֣וּב בּ֑/וֹ כִּלָּי֥וֹן חָר֖וּץ שׁוֹטֵ֥ף צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/022.yaml
  text: For though your people[a], Israel, are like the sand of the sea, only a remnant of them will return. A destruction is decreed[b], overflowing with righteousness.
translation:
  language: zh_hans
  text: 即使你的百姓以色列多如海沙，归回的也只有其中的余民[a]。毁灭已经定下，满溢着公义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归回”也可理解为“回转”；原文没有把它明确限定为悔改或从流亡之地返回。“其中”的原文代词是单数，所指的是作为一个整体的百姓。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“正义”。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם יִהְיֶה
  choice: 因为，即使……
  rationale: 这里引出让步关系：尽管以色列人数众多，归回的却只有余民。“因为，即使”既承接上文，也清楚表达反差。
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: 你的百姓以色列
  rationale: 保留第二人称单数所属关系，并把“以色列”自然地理解为“你的百姓”的同位语。
- source_word: כְּחוֹל הַיָּם
  choice: 多如海沙
  rationale: 用现代汉语的惯用比喻表达数量广大，同时保留原文“海沙”的意象。
- source_word: שְׁאָר
  choice: 余民
  rationale: “余民”简洁表达灾难后存留的一部分人，也保留《以赛亚书》中反复出现的主题性用语。
- source_word: יָשׁוּב
  choice: 归回
  rationale: שׁוב既可指返回，也可带有回转的神学意味；“归回”保留两者之间的张力，不把意思限定为悔改或从某次流亡返回。
- source_word: בּוֹ
  choice: 其中
  rationale: 该代词形式上为阳性单数，回指作为集合整体的“百姓”或“以色列”；“其中”自然保留这种集合内的部分关系。
- source_word: כִּלָּיוֹן
  choice: 毁灭
  rationale: 该词表示毁灭、消耗殆尽；“毁灭”清楚有力，又不因译作“彻底灭绝”而与余民存留的内容产生不必要的冲突。
- source_word: חָרוּץ
  choice: 已经定下
  rationale: 表达已经决定、确定无疑之意，保留审判不可更改的语气。
- source_word: שׁוֹטֵף
  choice: 满溢着
  rationale: 保留洪水涌流、漫溢的形象，同时使其在现代汉语中能够自然修饰前述毁灭。
- source_word: צְדָקָה
  choice: 公义
  rationale: 该词可指公义或正义；主文用“公义”表达这项审判在道德上的正直性质，并在脚注保留“正义”这一可行译法。
theological_decisions:
- issue: 余民“归回”的含义
  choice: 只译作“归回”，不限定具体所指
  alternative: 译作“悔改归向”或明确指从流亡之地返回
  rationale: 原文可同时唤起实际返回和属灵回转，也与以赛亚的余民主题相呼应；不进一步限定，能保留预言本身的张力。
- issue: צְדָקָה在末句中的含义
  choice: 公义
  alternative: 正义
  rationale: 两种含义都有词义根据。“公义”较完整地表达所定审判的正直性质，而“正义”作为司法语境中的自然理解列入脚注。
- issue: 广大民数与少数余民的对比
  choice: 用“即使……也只有……”明确表达让步和限制
  alternative: 直译为“若……必有余民……”
  rationale: 上下文重点在于人数虽多如海沙，归回的却只是其中的余民；此译法呈现原文的修辞对比，但不改变余民归回这一核心陈述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“多如海沙”“余民归回”保留先知文学的核心意象；末句维持简短有力的审判宣告，并保留“满溢”所含的洪流意象。
