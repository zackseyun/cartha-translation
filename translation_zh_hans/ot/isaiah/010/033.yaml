source:
  edition: WLC
  text: הִנֵּ֤ה הָ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת מְסָעֵ֥ף פֻּארָ֖ה בְּ/מַעֲרָצָ֑ה וְ/רָמֵ֤י הַ/קּוֹמָה֙ גְּדוּעִ֔ים וְ/הַ/גְּבֹהִ֖ים יִשְׁפָּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/033.yaml
  text: Behold[a], the Lord, Yahweh of Armies, is lopping off the boughs with terrifying power; the tall in stature are cut down[b], and the lofty are brought low.
translation:
  language: zh_hans
  text: 看哪，主，万军之雅威，正以骇人的威势[a]砍去繁枝；高大的必被砍下[b]，高耸的必降为卑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“轰然一声”“以暴力”或“以惊骇之势”；这个希伯来词表现猛烈、可畏的力量。
    reason: lexical_alternative
  - marker: b
    text: 这里描绘砍去枝条、伐倒高树的景象，同时象征尊高者的倾覆。
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意的指示词；“看哪”保留先知话语鲜明、庄重的语气，又是现代读者熟悉的表达。
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: 主，万军之雅威
  rationale: הָאָדוֹן 是带定冠词的尊称“主”，יְהוָה 作为神的专名译为“雅威”，צְבָאוֹת 直译其统领众军的含义；并列结构避免将两个称谓合并。
- source_word: מְסָעֵף
  choice: 正……砍去
  rationale: 分词使行动显得正在发生或迫在眉睫；“砍去”清楚保留修砍树枝的具体图像。
- source_word: פֻּארָה
  choice: 繁枝
  rationale: 该词指繁茂的枝条或枝叶；“繁枝”既保留树木意象，也符合本节庄重而凝练的文体。
- source_word: בְמַעֲרָצָה
  choice: 以骇人的威势
  rationale: 该词兼有猛烈、可畏、震撼的语义色彩；此译保留力量与恐怖感，同时以脚注列出其他可能理解。
- source_word: רָמֵי הַקּוֹמָה
  choice: 身量高大的
  rationale: 原文直指身量或高度，不直接解释为骄傲者；这样既保留树木图像，也容许其象征受审判的高位者。
- source_word: גְּדוּעִים
  choice: 被砍倒
  rationale: 这是表示砍断、砍倒之结果的被动形式；“被砍倒”自然地延续伐木意象。
- source_word: הַגְּבֹהִים יִשְׁפָּלוּ
  choice: 高耸的必降为卑
  rationale: “高耸的”保留字面高度与比喻崇高之间的双重可能；“必降为卑”表达未完成式所指向的将来结果，又不把含义限定为内心谦卑。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，并与称号“主”并列；音译“雅威”既区分专名与称号，也避免在中文中重复译作两个“主”。
- issue: 树木图像与对高傲者之审判的关系
  choice: 在正文中保留砍枝、身量和高度的图像
  alternative: 直接释义为上帝使骄傲尊贵的人降卑
  rationale: 上下文暗示这些高大树木象征被高举者，但本节本身刻意运用伐木意象；保留图像可维护原文的含混性与神学张力。
- issue: יִשְׁפָּלוּ 的结果是物理降低还是身份降卑
  choice: 降为卑
  alternative: 被压低；受羞辱
  rationale: 此译可同时涵盖树木倒下的低落和尊高者身份被贬抑，不额外加入羞辱或道德悔改等原文未明说的含义。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“看哪”保留先知宣告的提升语体；“繁枝”“降为卑”凝练而不古奥。分号呈现希伯来诗句由砍枝图像转向高者降卑的平行推进。
