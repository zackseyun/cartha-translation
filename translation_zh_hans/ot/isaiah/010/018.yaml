base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/018.yaml
  text: And the glory of his forest and of his fruitful land he will consume[a], from soul to flesh, and it will be like the wasting away of a sick man.
translation:
  language: zh_hans
  text: 他必毁灭他树林和肥沃之地的荣华，从性命到肉身；这一切必像病人渐渐衰残一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句的希伯来文含义不确定。也可译作：“如同一个渐渐衰残的人。”末一个词也有人作其他解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְבוֹד
  choice: 荣美
  rationale: כָּבוֹד可指荣耀、尊荣或华美；此处指亚述树林和肥田所展现的繁盛与壮美。“荣美”既保留其比喻分量，也适合自然景物的语境。
- source_word: יַעְרוֹ
  choice: 他的树林
  rationale: יַעַר的基本义是“树林、森林”；此处也是象征亚述的力量和众多，直译可保留先知的意象。
- source_word: וְכַרְמִלּוֹ
  choice: 和肥田的
  rationale: כַּרְמֶל在此更可能是普通名词，指肥沃、丰产的田地或园圃，而非专名“迦密”。“肥田”简洁地表达与树林并列的丰饶土地。
- source_word: מִנֶּפֶשׁ וְעַד בָּשָׂר
  choice: 从性命到肉身，全都
  rationale: 原文直译为“从性命直到肉身”，以两个具体词语表达彻底毁灭。“性命”比现代汉语中的“灵魂”更贴近נֶפֶשׁ在此所指的生命，同时保留原文从生命到身体的张力；补入“全都”使其整体性在中文中清楚。
- source_word: יְכַלֶּה
  choice: 他必……毁灭
  rationale: כלה的Piel词形可表示耗尽、消灭、毁坏。上下文虽有火焚意象，但中文“毁灭”与树林、肥田以及性命、肉身都能自然搭配，也避免把本节动词过度具体化为“烧尽”。
- source_word: וְהָיָה
  choice: 那景象就……一样
  rationale: 原文主语可理解为先前所述整体遭毁后的状态。用“那景象”自然承接整幅毁灭图景，而不武断限定为某一个名词。
- source_word: כִּמְסֹס
  choice: 渐渐衰残
  rationale: 罕见形式通常联系于消融、衰败或渐渐耗损。“渐渐衰残”表达持续败落的过程，并适合与病人作比。
- source_word: נֹסֵס
  choice: 病人
  rationale: 末词含义困难。传统和不少现代解释依据语境将其理解为病弱、衰残之人；正文采用这一通顺解释，同时用脚注明确保留原文的不确定性及其他分析。
theological_decisions:
- issue: “从נֶפֶשׁ到肉身”是否表达灵魂与身体的二分
  choice: 译作“从性命到肉身，全都”，保留两个具体范畴而不据此建立系统性的人论区分
  alternative: 译作“从灵魂到肉体”或直接意译为“彻底”
  rationale: 该措辞主要表达毁灭的全面性，但原文有意使用נֶפֶשׁ与בָּשָׂר。译文既不抹去这种张力，也不把נֶפֶשׁ固定解释成与身体截然分离的“灵魂”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“肥田”传达丰产土地的普通名词义；“从性命到肉身”有意保留希伯来文的具体表达和张力。脚注标记[a]置于相关难解末句之后。
