base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/032.yaml
  text: Still this very day he will halt at Nob[a]; he will shake his hand at the mountain of the daughter of Zion[b], the hill of Jerusalem.
translation:
  language: zh_hans
  text: 今天，他仍要停在挪伯；他要向锡安之家的山[a]、耶路撒冷的山岗扬手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给希伯来文本作“锡安之家的山”。有些文本传统或译本采用不同的读法或顺译方式。
    reason: alternative_reading
  - marker: b
    text: “扬手”也可译作“挥手”或“挥动他的手”；这里所描写的是带有威吓意味的手势。
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֥וֹד הַיּ֖וֹם
  choice: 就在今天，他还要
  rationale: “就在今天”传达 הַיּוֹם 的临场感，“还要”保留 עוֹד 所表示的延续和迫近之意。
- source_word: בְּנֹ֣ב לַֽעֲמֹ֑ד
  choice: 在挪伯停驻
  rationale: 在进军语境中，עמד 表示到达某处后站住或停下；“停驻”兼顾动作和军事场景。
- source_word: יְנֹפֵ֤ף יָד/וֹ֙
  choice: 挥动他的手
  rationale: נוף 可指挥动、摇动或扬起；正文保留动作本身，不把敌意直接写入词义，威吓意味留在语境及脚注中。
- source_word: הַ֣ר בית צִיּ֔וֹן
  choice: 锡安之家的山
  rationale: 按所给 WLC 文本中的 בית 直译为“家”，不据其他传统或顺译方式擅自改成“女子”或简化为“锡安山”。
- source_word: גִּבְעַ֖ת יְרוּשָׁלִָֽם
  choice: 耶路撒冷的冈陵
  rationale: 保留原文的地形意象及与前一短语的平行关系；“冈陵”庄重而自然。
theological_decisions:
- issue: 单数主语“他”的所指
  choice: 正文只译作“他”，不直接指明身份
  alternative: 亚述王；拟人化的亚述军队
  rationale: 上下文指向亚述侵略者，但本节原文只使用单数形式；保留这种表达，避免把上下文推断写进正文。
- issue: הַר בית ציון 中 בית 的处理
  choice: 保留为“锡安之家”
  alternative: 锡安女子的山；锡安山
  rationale: 所给希伯来文本明确包含 בית。虽然其他文本传统或译本有不同处理，正文首先忠于指定的原文证据。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“停驻”符合军队推进的场景；“锡安之家”虽略带原文色彩，但为忠实保留指定希伯来文本中的特殊措辞。
