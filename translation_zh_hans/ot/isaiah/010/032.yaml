  to: 今天，他仍要停在挪伯；他要向锡安之家的山[a]、耶路撒冷的山岗扬手[b]。
  rationale: 修订限于现代汉语的顺畅度与脚注表述精确性。正文仍保留原文未明说身份的“他”、地名和单数动作，也保留指定希伯来文本中“锡安之家”的特殊读法，不以其他传统的“锡安女子”替换。
