  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא לֹֽא יוֹסִ֨יף ע֜וֹד שְׁאָ֤ר יִשְׂרָאֵל֙ וּ/פְלֵיטַ֣ת בֵּֽית יַעֲקֹ֔ב לְ/הִשָּׁעֵ֖ן עַל מַכֵּ֑/הוּ וְ/נִשְׁעַ֗ן עַל יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל בֶּ/אֱמֶֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/020.yaml
  text: And in that day the remnant of Israel and the survivors of the house of Jacob will no longer continue to lean on the one who struck them, but will lean on the LORD, the Holy One of Israel, in truth.
translation:
  language: zh_hans
  text: 到那日，以色列的余民和雅各家的幸存者，必不再倚靠那击打他们的，却要真诚地倚靠耶和华——以色列的圣者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁאָר יִשְׂרָאֵל
  choice: 以色列的余民
  rationale: “余民”准确表达灾难或审判后存留下来的群体，也保留以赛亚书中的重要用语。
- source_word: פְלֵיטַת בֵּית יַעֲקֹב
  choice: 雅各家的幸存者
  rationale: פְלֵיטָה指逃脱灾祸、得以存活的人；“幸存者”自然且与“余民”有所区分。
- source_word: לְהִשָּׁעֵן עַל / וְנִשְׁעַן עַל
  choice: 倚靠……却要……倚靠
  rationale: 保留原文同一动词的重复和鲜明对照，既包含依赖也带有信靠之意。
- source_word: מַכֵּהוּ
  choice: 那击打他们的
  rationale: 分词带第三人称单数宾语后缀，直译为“击打他的”；因前项是集合性群体，现代汉语用“他们”指代更清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应四字神名。
- source_word: בֶּאֱמֶת
  choice: 真诚地
  rationale: 此处可指真实、忠实或诚实；“真诚地”在汉语中自然修饰“倚靠”，同时保留内在真实而非虚假的意味。
theological_decisions:
- issue: בֶּאֱמֶת与“倚靠”的关系
  choice: 真诚地倚靠耶和华
  alternative: 倚靠耶和华，以色列的圣者，持守信实／确实倚靠
  rationale: 句末介词短语最自然地说明倚靠的方式或性质。译作“真诚地”不把它过度限定为人的忠信、神的信实或单纯的确定性。
- issue: “那击打他们的”所指为何
  choice: 不在正文中明定其身份
  alternative: 明确译成“亚述”或其他历史势力
  rationale: 原文只用分词称“击打者”，正文应保留这一指称方式，避免把上下文推断写进经文本身。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“余民”“以色列的圣者”等稳定的经文术语保留先知文学语感；用“必不再……却要……”再现原文的未来性与对照结构。
