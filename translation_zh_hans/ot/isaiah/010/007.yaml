base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/007.yaml
  text: But he does not think so[a], and his heart does not reckon so; for it is in his heart to destroy[b], and to cut off not a few nations.
translation:
  language: zh_hans
  text: 但他并不这样想[a]；他心里也不这样盘算。因为他心里所想的是毁灭，剪除不少国家[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这样想”也可译作“这样打算”或“这样意图”；原文动词可指心中构想，也可带有定意、谋划的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“不少国家”（字面为“不少”），以否定反面来强调数量众多。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַמֶּה
  choice: 设想
  rationale: 此处指亚述王心中所构想或意图之事。“设想”既能表达认知，也保留可能涉及意图的语义，并与下句“盘算”形成近义平行而不完全重复。
- source_word: לְבָבוֹ
  choice: 他心里
  rationale: לֵבָב在希伯来语中是思想、意志和意图的内在中心。现代汉语“心里”自然保留这一人类学表达，不把它缩减为情感。
- source_word: יַחְשֹׁב
  choice: 盘算
  rationale: חשב可指思量、谋划或筹算。“盘算”突出内在谋划，并与“设想”有所区别，保存平行句的层次。
- source_word: כִּי
  choice: 只
  rationale: 此处引出亚述王实际的内心意图，与前文“不这样”构成转折性说明。汉语用“只想”可自然呈现‘实际却是’的语气，而不额外加入神学解释。
- source_word: לְהַשְׁמִיד
  choice: 毁灭
  rationale: שׁמד的使役式表示使之毁坏或消灭。“毁灭”准确而有力度，同时不必限定具体手段。
- source_word: בִּלְבָבוֹ
  choice: 他心里
  rationale: 重复“心里”保留原文对其内在意图的强调。
- source_word: לְהַכְרִית
  choice: 剪除
  rationale: כרת的使役式有切断、除掉之意。“剪除”保留其形象和消灭性的力度，又不把具体方式解释得过死。
- source_word: גּוֹיִם
  choice: 国家
  rationale: 此处是帝国征伐的政治语境，גּוֹיִם主要指作为政治实体的列国；“国家”符合现代汉语。
- source_word: לֹא מְעָט
  choice: 许多
  rationale: 原文直译为“不少”，是一种曲言表达，实际意为数量众多。正文采用自然汉语“许多”，并以脚注说明原文修辞。
- source_word: וְהוּא
  choice: 但他
  rationale: 连接词在上下文中带有明显转折，指出亚述王的想法不同于上文所述目的。“但他”清楚而不增添解释。
theological_decisions:
- issue: 上帝的意图与亚述王自身意图之间的关系
  choice: 正文只呈现“他并不这样设想”与其毁灭列国的内在打算之间的对照。
  alternative: 明确译成“他不明白上帝的旨意”或“他的意图并非如此”。
  rationale: 上下文确实形成神圣目的与人的野心之间的张力，但本节没有明说“不明白上帝的旨意”。保留指代和语义张力，避免把上下文中的神学解释直接加入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“设想／盘算”保存两个近义动词的平行和细微区别；“心里”保留希伯来语关于思想与意志中心的惯用表达。正文将曲言“不少”自然译为“许多”，脚注交代原文形式。
