  text: וְ/הָיָ֤ה אֽוֹר יִשְׂרָאֵל֙ לְ/אֵ֔שׁ וּ/קְדוֹשׁ֖/וֹ לְ/לֶהָבָ֑ה וּ/בָעֲרָ֗ה וְ/אָֽכְלָ֛ה שִׁית֥/וֹ וּ/שְׁמִיר֖/וֹ בְּ/י֥וֹם אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/017.yaml
  text: And the light of Israel will become a fire[a], and his Holy One a flame[c][b]; it will burn and consume his thorns and his briers in a single day.
translation:
  language: zh_hans
  text: 以色列的光必成为火[a]，他的圣者必成为火焰[b]；这火必燃烧，吞灭他的荆棘和蒺藜[c]，在一天之内。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必是火”；这里“成为”也可较直译为“是”。
    reason: lexical_alternative
  - marker: b
    text: “他的圣者”很可能是指耶和华的神圣称号；以赛亚书常用类似称号称呼他。
    reason: cross_reference
  - marker: c
    text: “荆棘”和“蒺藜”原文均指带刺的植物；前一个词较罕见，也可能泛指灌木或丛生杂草。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 必成为
  rationale: היה 后接 לְ 表示进入某种状态，在此自然表达“成为”，同时保留先知性语境中的将来指向。
- source_word: אוֹר יִשְׂרָאֵל
  choice: 以色列的光
  rationale: 贴近原文的属格结构，保留“光”的诗性隐喻，不在正文中明说其所指。
- source_word: לְאֵשׁ
  choice: 火焰
  rationale: 与“成为”连用自然；译作“火焰”也便于同下句“烈焰”构成诗歌平行，同时不减弱焚烧意象。
- source_word: וּקְדוֹשׁוֹ
  choice: 他的圣者
  rationale: 保留第三人称所有格及称号性表达；“圣者”在以赛亚书中常指耶和华，但正文不直接补明。
- source_word: לְלֶהָבָה
  choice: 烈焰
  rationale: 准确传达 לֶהָבָה 的火焰意象，并与前半句形成递进式平行。
- source_word: וּבָעֲרָה
  choice: 这火就要燃烧
  rationale: 阴性单数动词承接前面的火与烈焰意象；中文补出“这火”可澄清主语而不改变所指。完成式在先知话语序列中具有将来意义。
- source_word: וְאָכְלָה
  choice: 吞灭
  rationale: אכל 用于火时有吞噬、烧尽之意；“吞灭”兼具火势的形象性和毁灭力度。
- source_word: שִׁיתוֹ
  choice: 他的荆棘
  rationale: 该词在此义项较罕见，与 שׁמיר 并列时指带刺植物；“荆棘”清楚而自然。
- source_word: וּשְׁמִירוֹ
  choice: 蒺藜
  rationale: 保留与“荆棘”不同的平行词，表达另一类有刺的荒生植物。
- source_word: בְּיוֹם אֶחָד
  choice: 一天之内
  rationale: 自然传达“在一日内”，突出审判来临的迅速与彻底。
theological_decisions:
- issue: “以色列的光”与“他的圣者”的所指
  choice: 正文保留隐喻和称号，不直接增译为“耶和华”。
  alternative: 将两者明确译解为耶和华，或把“以色列的光”理解为较宽泛的神圣护佑。
  rationale: 以赛亚书的用语强烈暗示所指为耶和华，但本节以诗性隐喻和称号表达；保留原貌可避免把合理推断写入正文。
- issue: 燃烧动作的主语
  choice: 以“这火”概括前文的“火焰／烈焰”。
  alternative: 直接以“他”作主语，明确指向圣者。
  rationale: 希伯来语动词为阴性单数，语法上与前述火焰意象相应；中文用“这火”既顺畅，也不额外解决隐喻与神圣行动者之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“火焰／烈焰”保存诗歌平行，以“这火”使后半句主语在中文中清楚；脚注标记均置于相关正文词语之后。
