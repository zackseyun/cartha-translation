id: ISA.10.21
reference: Isaiah 10:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שְׁאָ֥ר יָשׁ֖וּב שְׁאָ֣ר יַעֲקֹ֑ב אֶל אֵ֖ל גִּבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/021.yaml
  text: A remnant will return[a], the remnant of Jacob[b], to the Mighty God.
translation:
  language: zh_hans
  text: 余民必归回[a]，雅各的余民必归向大能的上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “余民必归回”呼应以赛亚书7:3中“施亚雅述”这个名字；该名字的意思就是“余民必归回”。
    reason: cross_reference
  - marker: b
    text: 或译“上帝——大能者”；较不可能译作“一位大能的神”或“大能的勇士”。希伯来语称号אֵל גִּבּוֹר也见于以赛亚书9:6。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר
  choice: 余民
  rationale: 指审判或灾难之后存留下来的人。“余民”在以赛亚书中自然、凝练，也保留了人数与神学层面的含义。
- source_word: יָשׁוּב
  choice: 必归回／必归向
  rationale: 这是שוב的Qal未完成式，可指回来或转回。“必”表达预告中的将来与确定语气；先用“归回”保留空间与属灵转向之间的含混，随后结合介词אֶל，用“归向”自然说明所归向的对象。
- source_word: שְׁאָר יַעֲקֹב
  choice: 雅各的余民
  rationale: 忠实呈现属格结构，并保留“雅各”这一原文明确使用的个人兼群体之名，不释义改成“以色列”。
- source_word: אֶל
  choice: 归向
  rationale: 介词表示朝向某一对象；与שוב连用时，“归向”是自然的现代汉语表达。
- source_word: אֵל גִּבּוֹר
  choice: 大能的上帝
  rationale: 上下文表明余民归向这一位，最自然地理解为对上帝的称号；此译法也保留该短语在以赛亚书9:6中的分量。
theological_decisions:
- issue: אֵל גִּבּוֹר所指是上帝、神明还是勇士
  choice: 大能的上帝
  alternative: 上帝——大能者；一位大能的神；大能的勇士
  rationale: “归向”这一对象在当前语境中最自然是上帝，而同一称号也见于以赛亚书9:6。正文采用神圣称号的理解，同时在脚注保留词汇上可能但较不符合语境的译法。
- issue: שוב是空间上的返回还是属灵上的转回
  choice: 用“归回／归向”保留两层可能含义
  alternative: 回来；悔改归向
  rationale: 原词本身可涵盖返回和转回。正文不把它窄化为单纯地理返回，也不明说原文没有直接写出的“悔改”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“余民”承接先知文学中的固定概念；以重复“余民”和“归”保留希伯来诗句的强调与回响。脚注标记按其实际说明对象安置：[a]解释“余民必归回”的名字呼应，[b]解释“大能的上帝”的译法。
