base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/029.yaml
  text: They have crossed over the pass[a]; Geba is our lodging place. Ramah trembles[b]; Gibeah of Saul has fled.
translation:
  language: zh_hans
  text: '他们已经越过隘口[a]；

    迦巴是我们的宿营地。

    拉玛惊恐战栗；

    扫罗的基比亚[b]已经逃走。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“通道”或“渡口”。希伯来语 מַעְבָּרָה 泛指可供通过之处；这里按军事行军路线的语境译作“隘口”。
    reason: lexical_alternative
  - marker: b
    text: 也可译“基比亚（扫罗的）”。原文直译为“扫罗的基比亚”；这里以城镇名称代指当地居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְרוּ
  choice: 已经越过
  rationale: 该词为עבר的Qal完成式第三人称复数，描写敌军已完成的推进；“已经越过”既保留动作方向，也传达生动战报中已然发生的意味。
- source_word: מַעְבָּרָה
  choice: 隘口
  rationale: 该名词指可供通过之处，也可指渡口；本节处于军事进军路线的语境中，“隘口”最自然，但不排除较宽泛的“通道”之义。
- source_word: גֶּבַע
  choice: 迦巴
  rationale: 按现代中文圣经地名的通行音译处理。
- source_word: מָלוֹן לָנוּ
  choice: 是我们的宿营地
  rationale: מָלוֹן指住宿或过夜之处，לָנוּ直译为“给我们”；在无动词句中译作“是我们的宿营地”，自然地保留敌军把迦巴当作驻宿地点的意思。
- source_word: חָרְדָה
  choice: 惊恐战栗
  rationale: חרד兼有因惧怕而发抖、惊恐之意；合译为“惊恐战栗”，保留身体反应和恐惧情绪，并以现在式般的生动画面呈现完成式。
- source_word: הָרָמָה
  choice: 拉玛
  rationale: 按现代中文圣经地名的通行音译处理；希伯来语的定冠词属于该地名在此处的形式，不另译出。
- source_word: גִּבְעַת שָׁאוּל
  choice: 扫罗的基比亚
  rationale: 该结构是属格构词，表示与扫罗相关的基比亚；此译保留希伯来语关系，也符合中文传统地名表达。
- source_word: נָסָה
  choice: 已经逃走
  rationale: 该词为נוס的Qal完成式第三人称阴性单数，与阴性地名“基比亚”呼应；原文以城镇代指居民，译文保留这一诗性转喻及完成动作。
theological_decisions: []
