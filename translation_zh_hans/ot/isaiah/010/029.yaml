  register: 采用现代、庄重而清楚的诗体语言，按原文分成四个短句，以呈现敌军推进和各城恐慌的急促节奏。保留原文从“他们”突然转为“我们”的人称变化，也保留以城名代指居民的转喻，不把这些张力解释进正文。
