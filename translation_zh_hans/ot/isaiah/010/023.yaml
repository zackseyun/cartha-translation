source:
  edition: WLC
  text: כִּ֥י כָלָ֖ה וְ/נֶחֱרָצָ֑ה אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת עֹשֶׂ֖ה בְּ/קֶ֥רֶב כָּל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/023.yaml
  text: For the Lord Yahweh of hosts is carrying out a complete destruction[a], one that has been decreed, in the midst of all the earth.
translation:
  language: zh_hans
  text: 因为主耶和华——万军之主，正在全地[a]之中施行已经定下的彻底毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”或译“整个国土”或“全境”。希伯来语אֶרֶץ可按语境指“大地”，也可指某一片“土地”或“国土”。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，为其中的宣告说明理由；“因为”保留了原文的因果连接作用。
- source_word: כָלָה
  choice: 彻底毁灭
  rationale: 该名词表示终结、耗尽；在审判语境中指向毁灭。“彻底毁灭”同时表达终局性和审判含义。
- source_word: וְנֶחֱרָצָה
  choice: 已经定下的
  rationale: נחרצה是חרץ的尼פעל形式，表示某事已经决定、判定；译作定语，与前面的“彻底毁灭”自然衔接。
- source_word: אֲדֹנָי יְהוִה
  choice: 主——耶和华
  rationale: אֲדֹנָי译为“主”，יהוה以中文通行的音译“耶和华”保留神名；破折号避免将两个称谓读成不自然的连续组合。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 这是神圣称号的一部分；“万军”是现代中文圣经语境中简洁而易懂的传统表达，且不把所指局限于人间军队。
- source_word: עֹשֶׂה
  choice: 正在……施行
  rationale: 分词呈现正在进行或迫近的行动；“施行”适合已经判定的审判，比宽泛的“做”更准确。
- source_word: בְּקֶרֶב
  choice: 在……中
  rationale: 表达行动发生在某一范围之内；结合现代汉语语序，以“正在全地施行”自然传达此空间含义。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: אֶרֶץ可指大地，也可指特定地域。“全地”保留原文范围广阔而具体所指仍有弹性的表达，并以脚注注明另一理解。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主——万军之耶和华
  alternative: 主——万军之雅威
  rationale: 正文采用现代中文读者较熟悉的“耶和华”指称יהוה，同时明确保留专名性质；不以普通称号取代神名。
- issue: הָאָרֶץ 所指范围
  choice: 全地
  alternative: 整个国土／全境
  rationale: 原词既可指普世大地，也可指语境中的一片土地。正文不把范围限定为某国，脚注则保留地域性理解，以免消除原文歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一场……彻底毁灭”避免古奥的“尽行灭绝”，并清楚呈现כָלָה的名词性质；破折号使复合神圣称号在中文中层次清晰。
