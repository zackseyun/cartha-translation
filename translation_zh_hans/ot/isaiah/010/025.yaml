base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/025.yaml
  text: For in just a very little while[a], indignation will come to an end, and my anger will be for their destruction.
translation:
  language: zh_hans
  text: 因为再过极短的一会儿，愤怒就要止息；我的怒气要临到他们，使他们灭亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们灭亡”所译的希伯来语名词十分罕见，也可理解为“他们的彻底毁灭”“耗尽他们”或“他们的终结”。其具体含义仍有争议；但上下文清楚指向压迫者的败亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的应许说明理由或提供保证；现代汉语中“因为”衔接自然。
- source_word: עוֹד מְעַט מִזְעָר
  choice: 再过极短的一会儿
  rationale: 两个表示微少的近义词叠加强调时间极短；此译既保留强调，也符合现代汉语表达。
- source_word: וְכָלָה זַעַם
  choice: 愤怒就要止息
  rationale: כָלָה在此预言语境中指达到终点、结束；“止息”自然表达愤怒不再持续。
- source_word: וְאַפִּי
  choice: 我的怒气
  rationale: אַפִּי字面为“我的鼻子”，是表示愤怒的惯用语；“我的怒气”清楚保留第一人称领属。
- source_word: עַל תַּבְלִיתָם
  choice: 却要临到他们，使他们灭亡
  rationale: עַל可表示怒气所针对的对象；罕见名词תַּבְלִיתָם带第三人称复数后缀，语境指压迫者的终局或毁灭。译文保留“他们”，并以结果表达其毁灭。
theological_decisions:
- issue: “他们”所指对象
  choice: 保留复数代词，并按上下文理解为敌人或压迫者，直接语境中特别指亚述。
  alternative: 将末句较抽象地译为“直到毁灭”或“以毁灭为终局”，不明确指定人称对象。
  rationale: 原文名词带第三人称复数后缀；上下文从耶和华对其子民的愤怒转向压迫者的覆亡，因此不宜删去该代词，但正文也不额外加入“亚述”来消除原文的指代空间。
- issue: 两种愤怒表达之间的关系
  choice: 将זַעַם译为“愤怒”，אַפִּי译为“我的怒气”，并用“却”呈现从前者止息到后者针对敌人的语义转折。
  alternative: 把二者都译作“怒气”，或不体现任何转折。
  rationale: 原文使用两个相关而不完全相同的词；上下文显示神对其子民的义愤将结束，而怒气将转向压迫者。“却”使汉语逻辑清楚，但不引入额外教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“极短的一会儿”保留原文叠词的加强语气；分号呈现两小句之间紧密而有转折的关系。脚注标记置于所解释的末句之后。
