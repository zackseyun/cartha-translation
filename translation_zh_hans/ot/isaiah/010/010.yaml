  text: כַּ/אֲשֶׁר֙ מָצְאָ֣ה יָדִ֔/י לְ/מַמְלְכֹ֖ת הָ/אֱלִ֑יל וּ/פְסִ֣ילֵי/הֶ֔ם מִ/ירֽוּשָׁלִַ֖ם וּ/מִ/שֹּׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/010.yaml
  text: As my hand has reached the kingdoms of the idols[a], whose carved images were greater than those of Jerusalem and Samaria,
translation:
  language: zh_hans
  text: 正如我的手伸到偶像的列国；它们雕刻的神像胜过耶路撒冷和撒玛利亚的雕像[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“正如我的手伸到偶像的列国，以及它们的雕刻神像，出自耶路撒冷和撒玛利亚。”希伯来文此处结构简略；按上下文，末语表达比较：这些列国的神像胜过耶路撒冷和撒玛利亚的神像。
    reason: 保留末句形式上可按“从／出自”理解的字面结构，并说明正文根据上下文采用比较义。
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 引出亚述王夸口中的类比，并与下一节承接；“正如”自然地保留比较意味。
- source_word: מָצְאָה יָדִי
  choice: 我的手征服了
  rationale: 字面为“我的手找到了”，在帝国征战语境中表示势力所及并取得控制。“征服”清楚传达语境含义，同时保留“我的手”这一权势隐喻。
- source_word: לְמַמְלְכֹת הָאֱלִיל
  choice: 那些偶像之国
  rationale: לְ受前述动词支配；אֱלִיל带有虚妄、无价值的贬义，但“偶像”是简明且符合上下文的对应词。
- source_word: וּפְסִילֵיהֶם
  choice: 而它们的雕像
  rationale: פְסִיל指雕刻而成的宗教形像；“雕像”在现代汉语中自然，并由“它们的”明确所属关系。
- source_word: מִירוּשָׁלִַם וּמִשֹּׁמְרוֹן
  choice: 胜过耶路撒冷和撒玛利亚的雕像
  rationale: מִן在此按上下文表达比较。希伯来文省略了比较谓语及后项的中心语，译文适度补明，使中文可懂而不改变论旨。
theological_decisions:
- issue: 末句是否明确表达希伯来文省略的比较关系
  choice: 译作“它们的雕像胜过耶路撒冷和撒玛利亚的雕像”
  alternative: 较直译作“以及它们的雕像，来自耶路撒冷和撒玛利亚”
  rationale: 原文句法简略，但结合本节及下一节，亚述王是在夸称他所征服诸国的雕像胜过耶路撒冷和撒玛利亚的雕像。正文表达这一比较，同时以脚注保留字面形式及其歧义。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“偶像之国”保留原文对诸国及其偶像崇拜的紧密关联；“我的手”保留亚述王自夸权势的形象说法。句末用逗号，体现本节语法和论述延续至下一节。
