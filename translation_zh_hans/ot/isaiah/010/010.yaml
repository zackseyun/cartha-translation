revisions:
- from: 正如我的手征服了那些偶像之国，而它们的雕像胜过耶路撒冷和撒玛利亚的雕像[a]，
  to: 正如我的手伸到偶像的列国；它们雕刻的神像胜过耶路撒冷和撒玛利亚的雕像[a]，
  rationale: 修订以“伸到”替代“征服了”，避免在本节明示原文仅由语境暗示的征服行为；以“偶像的列国”和“雕刻的神像”改善自然度并准确反映复数王国及雕刻宗教形像。末句维持上下文所要求的比较解释，脚注则保留原文简略结构。
