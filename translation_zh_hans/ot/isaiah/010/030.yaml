base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/030.yaml
  text: Cry aloud[a], daughter of Gallim! Listen[c][b], Laishah! O poor Anathoth!
translation:
  language: zh_hans
  text: 迦琳的女儿[b]啊，高声呼喊[a]！莱沙啊，留心听！困苦的亚拿突[c]啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“发出尖厉的呼声。”希伯来语动词可指响亮、尖厉或回荡的呼喊。
    reason: lexical_alternative
  - marker: b
    text: “迦琳的女儿”是把城镇或其中居民人格化的称呼。
    reason: cultural_note
  - marker: c
    text: “困苦的”也可译为“可怜的”“受苦的”或“悲惨的”；原词可表达贫困、苦难或受压迫的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַהֲלִי קוֹלֵךְ
  choice: 高声呼喊
  rationale: צהל的阴性单数祈使式表示发出响亮、尖厉或回荡的呼声；结合敌军逼近的语境，译为“高声呼喊”既保留紧迫感，也不武断限定声音的具体性质。קוֹלֵךְ直译为“你的声音”，其意义在汉语动词“呼喊”中已自然体现。
- source_word: בַּת גַּלִּים
  choice: 迦琳的女儿
  rationale: 保留先知书中把城镇及其居民人格化为“女儿”的称呼方式，不将隐喻直接改写为“迦琳的居民”。
- source_word: הַקְשִׁיבִי
  choice: 留心听
  rationale: 该阴性单数祈使式不只是一般的听见，而是要求专心倾听；“留心听”自然地表达这一语气。
- source_word: לַיְשָׁה
  choice: 莱沙
  rationale: 按地名音译；保留此处带有词尾ה的形式，与较常见的“拉亿”不作人为同化。
- source_word: עֲנִיָּה
  choice: 困苦的
  rationale: 该形容词可表示贫困、受苦、遭压迫或处境悲惨。“困苦的”能涵盖苦难处境，又不把具体成因解释得过窄。
- source_word: עֲנָתוֹת
  choice: 亚拿突
  rationale: 按地名音译；在句中受阴性形容词עֲנִיָּה修饰，是对这座城的感叹性称呼。
