    rationale: דַּלִּים 在此可直接译为“穷人”；这既保留社会弱势的基本含义，也更符合现代普通话。
  - severity: medium
    issue: “并掠夺丧父的孩子”在汉语中宾语搭配略不自然，且可能弱化“把人当作掠物”的形象。
    rationale: 原文以“掠夺／劫掠”直指失父者。译作“把丧父的孩子当作掠物”不增添事件细节，同时使中文明确传达其被物化、遭劫掠的意思。
  - severity: low
    issue: “我百姓中困苦人”缺少结构助词。
    rationale: 改为“我百姓中的困苦人”更符合现代汉语定中结构。
