  timestamp: '2026-07-14T07:21:09Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了两个不定式所表达的谴责目的／后果、第一人称“我百姓”，以及寡妇和失父者这两个具体群体。“使……得不到公正”和“剥夺……正当权益”能恰当传达从司法公正中排除、夺去法律应得之分的意思。末句的“掠夺丧父的孩子”在形式上可对应原文，但现代汉语中“掠夺”通常更自然地接受财物、资源等作宾语，容易使对人的掠夺意象不够清楚。
  naturalness: “贫寒人”虽可理解，但在现代标准汉语中不如“穷人”自然、简洁。“我百姓中困苦人”也应加“的”，成为“我百姓中的困苦人”。将末句改为“把丧父的孩子当作掠物”可清楚表达原文把弱势者视为战利品、任意劫掠的意象，并与前面的“寡妇成为他们的掠物”形成自然平行。
  terminology: “公正”“正当权益”“寡妇”均合乎本节的司法及掠夺语境。“丧父的孩子”准确呈现 יְתוֹמִים 的字面社会类别；脚注保留“孤儿”这一通行译法是适当的。
