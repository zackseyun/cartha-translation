source:
  edition: WLC
  text: לְ/הַטּ֤וֹת מִ/דִּין֙ דַּלִּ֔ים וְ/לִ/גְזֹ֕ל מִשְׁפַּ֖ט עֲנִיֵּ֣י עַמִּ֑/י לִ/הְי֤וֹת אַלְמָנוֹת֙ שְׁלָלָ֔/ם וְ/אֶת יְתוֹמִ֖ים יָבֹֽזּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/002.yaml
  text: to turn aside the poor from justice[a], and to rob the afflicted of my people of their right, so that widows may become their spoil[b], and they may plunder the fatherless.
translation:
  language: zh_hans
  text: 为要使穷人[a]得不到公正，剥夺我百姓中的困苦人[b]应有的权利，好让寡妇成为他们的掠物，并把丧父的孩子[c]当作掠物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穷人”也可译作“弱小的人”；该词也可指社会地位低微的人。
    reason: lexical_alternative
  - marker: b
    text: “困苦人”也可译作“穷人”或“受压迫的人”。
    reason: lexical_alternative
  - marker: c
    text: 或译“孤儿”；原文特指失去父亲的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת מִדִּין
  choice: 使……得不到公正
  rationale: הטה的使役式在这里表示使人偏离或被排除在司法公正之外；译为“使……得不到公正”保留司法语境，也符合现代汉语表达。
- source_word: דַּלִּים
  choice: 贫寒人
  rationale: דַּל可指贫穷、弱小或社会地位低下的人；“贫寒人”突出其经济与社会上的弱势，同时以脚注保留其他可能含义。
- source_word: וְלִגְזֹל מִשְׁפַּט
  choice: 剥夺……的正当权益
  rationale: גזל表示强夺或不公正地夺取，מִשְׁפָּט在此指司法上应得的公断或权利；“剥夺……的正当权益”自然传达二者结合的法律含义。
- source_word: עֲנִיֵּי עַמִּי
  choice: 我百姓中困苦人
  rationale: עָנִי可指贫穷、受苦或受压迫的人；“困苦人”保留较宽的语义范围，“我百姓中”准确体现第一人称单数后缀。
- source_word: לִהְיוֹת אַלְמָנוֹת שְׁלָלָם
  choice: 好让寡妇成为他们的掠物
  rationale: 不定式可表达目的或结果；“好让”在此保留恶法制定者的目的意味。שָׁלָל的战争掠夺意象以“掠物”呈现。
- source_word: וְאֶת יְתוֹמִים יָבֹזּוּ
  choice: 并掠夺丧父的孩子
  rationale: יָתוֹם具体指失去父亲者；“丧父的孩子”比笼统的“孤儿”更精确。בזז译为“掠夺”，保留暴力攫取的意象。
theological_decisions:
- issue: 先知谴责中弱势群体的具体称谓
  choice: 保留“寡妇”和“丧父的孩子”等具体类别
  alternative: 概括为“弱势群体”或将יָתוֹם直接译为“孤儿”
  rationale: 原文点名当时在社会与司法上特别易受侵害的群体；保留具体称谓维持经文的伦理力度，也不把原文泛化。
- issue: עַמִּי中的第一人称后缀
  choice: 译为“我百姓”
  alternative: 译为“他的百姓”
  rationale: 希伯来文明确使用第一人称单数，反映上下文中神说话的视角，不应改为第三人称。
- issue: לִהְיוֹת所表达的目的与结果关系
  choice: 译为“好让”
  alternative: 译为“以致”
  rationale: 语法上目的和结果均有可能；结合恶法所带来的蓄意剥削，“好让”较贴合语境，但不额外引入超出文本的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。全句承接上一节的“祸哉”，因此保留“为要”开头的不完整句法关系；“得不到公正”“正当权益”清楚呈现司法压迫，“掠物”“掠夺”则保留原文连续的劫掠意象。
