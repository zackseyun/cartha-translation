revisions:
- from: 为要使贫寒人[a]得不到公正，剥夺我百姓中困苦人[b]的正当权益，好让寡妇成为他们的掠物，并掠夺丧父的孩子[c]。
  to: 为要使穷人[a]得不到公正，剥夺我百姓中的困苦人[b]应有的权利，好让寡妇成为他们的掠物，并把丧父的孩子[c]当作掠物。
  rationale: 修订以更自然的现代汉语替换“贫寒人”，补足“中的”以明确所属关系，并重塑末句，使“掠夺”针对人的掠夺性意象在中文中清楚可读。为保留原文连续的劫掠图像，采用“成为他们的掠物／当作掠物”的平行表达；“好让”仍保留不定式可有的目的或结果色彩，未把其解释限定为单一语法功能。
