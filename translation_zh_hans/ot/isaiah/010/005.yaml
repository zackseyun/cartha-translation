base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/005.yaml
  text: Woe to Assyria[a], the rod of my anger[b]; the staff in their hand is my wrath.
translation:
  language: zh_hans
  text: 祸哉，亚述——我怒气的杖！他们手中[a]的杖，就是我的震怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“在他们的手中”：名词“手”为单数形式，带第三人称阳性复数后缀。译文保留复数；有些译本为使意象顺畅，译作“他手中”或“它手中”。
    reason: 说明马所拉文本中单数名词与复数后缀的形式，并保留代词所指的含混。
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是引出审判宣告的感叹词，兼有哀叹与威吓意味；“祸哉”简洁地保留先知话语的力度和庄重语体。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 采用现代中文圣经与历史文献中通行的国名译法；这里既可指亚述帝国，也可借国名指其势力。
- source_word: שֵׁבֶט
  choice: 杖
  rationale: 此处不是强调王权的“权杖”，而是将亚述比作施打、惩治的器具；“杖”也能与下句的“棍”形成诗歌平行。
- source_word: אַפִּי
  choice: 我的怒气
  rationale: 该词字面与“鼻子”有关，但在希伯来语中惯指发怒；译作“怒气”自然清楚，并与后句较强的“震怒”相呼应。
- source_word: וּמַטֶּה
  choice: 棍
  rationale: מַטֶּה可指杖、棍或支派；在这里与שֵׁבֶט平行，表示握在手中的击打工具。用“棍”避免两个不同希伯来词都译成同一个中文词。
- source_word: בְיָדָם
  choice: 他们手中
  rationale: 马所拉文本的后缀是第三人称阳性复数“他们的”，而יָד“手”为单数。中文“他们手中”既自然，也保留复数代词，而不擅自改成“他手中”或“它手中”。
- source_word: זַעְמִי
  choice: 我的震怒
  rationale: 该词表达强烈的愤怒或义愤；“震怒”保留其力度，并与前句的“怒气”有所区分。
theological_decisions:
- issue: 上帝的主权与亚述作为审判工具
  choice: 直接保留亚述是“我怒气的杖”、其棍是“我的震怒”的器具性隐喻。
  alternative: 将亚述仅描写为独立行动或偶然成就审判的势力。
  rationale: 原文明确把亚述置于上帝怒气与震怒的隐喻之中。译文不淡化上帝的主动性，也不在本节之外解释亚述自身的责任，从而保留经文的神学张力。
- issue: בְיָדָם复数代词的指向
  choice: 正文译作“他们手中”，保留马所拉文本的复数形式。
  alternative: 按单数的“亚述”或“棍”顺译为“他手中”或“它手中”。
  rationale: 原文确实使用第三人称阳性复数后缀，其所指在本节内并未完全明说；不宜为使意象平顺而暗自改为单数。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“祸哉”保留先知审判宣告的传统力度；破折号突出“亚述”与“我怒气的杖”的同位关系。正文保持两行意象的紧凑性，不补入“工具”“用来惩罚”等解释性词语。
