revisions:
- from: 斧头岂能向用它砍伐的人夸耀？锯子岂能向挥动它的人自高？这就好像棍棒竟挥动举起它的人[a]，又好像木杖竟举起那不是木头的人！
  to: 斧头岂能向用它砍伐的人夸耀？锯子岂能向使用它的人自高？仿佛棍棒竟挥动举起它的人[a]，又仿佛杖竟举起那不是木头的人！
  rationale: 修订仅消除“木杖”所添加的材质信息，改善锯子的动作搭配，并使脚注准确界定“不是木头”所对应的原文范围。正文仍采用与英语审校文本一致、且由上下文支持的“人”作为补足；脚注保留替代理解，未把争议句法定于一说。
