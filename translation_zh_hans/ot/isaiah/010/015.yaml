id: ISA.10.15
reference: Isaiah 10:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/יִתְפָּאֵר֙ הַ/גַּרְזֶ֔ן עַ֖ל הַ/חֹצֵ֣ב בּ֑/וֹ אִם יִתְגַּדֵּ֤ל הַ/מַּשּׂוֹר֙ עַל מְנִיפ֔/וֹ כְּ/הָנִ֥יף שֵׁ֨בֶט֙ וְ/אֶת מְרִימָ֔י/ו כְּ/הָרִ֥ים מַטֶּ֖ה לֹא עֵֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/015.yaml
  text: Does the axe boast over the one who chops with it? Or does the saw magnify itself over the one who wields it? As if a rod were to wield the one who lifts it up[a], or as if a staff were to lift up one who is not wood!
translation:
  language: zh_hans
  text: 斧头岂能向用它砍伐的人夸耀？锯子岂能向使用它的人自高？仿佛棍棒竟挥动举起它的人[a]，又仿佛杖竟举起那不是木头的人！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语末尾直译为“不是木头”。这一简省短语也可理解为“不是木头的东西”；正文按上下文补出“人”。
    reason: 保留 לֹא עֵץ 的省略结构及其可能的不同理解。
lexical_decisions:
- source_word: יִתְפָּאֵר
  choice: 夸耀
  rationale: 该词的自反形式表达自我抬高、夸口；“夸耀”自然地体现工具竟凌驾于使用者之上的反讽。
- source_word: הַגַּרְזֶן
  choice: 斧头
  rationale: 切削工具的标准现代汉语称谓。
- source_word: הַחֹצֵב בּוֹ
  choice: 用它砍伐的人
  rationale: 保留分词所指的行动者和介词所表达的工具意义；“砍伐”也适合斧头的动作。
- source_word: יִתְגַּדֵּל
  choice: 自高
  rationale: 表达使自己为大的自反意义，并与前句“夸耀”形成自然的诗性平行。
- source_word: הַמַּשּׂוֹר
  choice: 锯子
  rationale: 与原文工具名称直接对应，通俗明确。
- source_word: מְנִיפוֹ
  choice: 挥动它的人
  rationale: הניף 可指挥动、举动；“挥动”保留操作者控制工具的形象，又不把动作限定得过细。
- source_word: כְּהָנִיף שֵׁבֶט
  choice: 好像棍棒竟挥动
  rationale: 原句简省且困难，但核心意象是工具反过来支配使用者；补出有限动词结构，使现代汉语清楚，同时保留比喻和荒诞感。
- source_word: שֵׁבֶט
  choice: 棍棒
  rationale: 在此指可挥动的棒状器具；译作“棍棒”可与后面的 מַטֶּה“木杖”有所区别。
- source_word: מְרִימָיו
  choice: 举起它的人
  rationale: 该形式表面带复数形态，但上下文采用单数工具和使用者的图景；汉语单数泛指自然且不强行标示数。
- source_word: כְּהָרִים מַטֶּה
  choice: 又好像木杖竟举起
  rationale: 保留行为主体倒置的意象，并用“又好像”呈现与前一比喻的平行。
- source_word: מַטֶּה
  choice: 木杖
  rationale: “杖”对应棒、杖类器具；加“木”使末尾“不是木头”的反差在汉语中可理解，但不消除其修辞张力。
- source_word: לֹא עֵץ
  choice: 那不是木头的人
  rationale: 希伯来语极为简省，直义为“非木”；正文按上下文补明为使用工具的人，脚注保留“不是木头的东西”等较不确定的理解。
theological_decisions:
- issue: 末句 לֹא עֵץ 的省略与指向
  choice: 正文理解为木制工具竟举起“那不是木头的人”，即活的使用者。
  alternative: 也可较不明确地理解为“不是木头的东西”；另有句法分析把“不属木头”与杖联系起来。
  rationale: 全节以斧头、锯子等工具不能凌驾于操作者之上为论证，所选译法最直接保留主体倒置的反讽；但原文的省略性不宜在正文中被视为毫无歧义，故以脚注说明。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。连续两个反问保持原文修辞；后两个“好像”保留工具与使用者角色倒置的荒诞意象。“斧头／锯子”和“棍棒／木杖”分别构成平行，并尽量区分两个近义希伯来词。
