base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/004.yaml
  text: Nothing remains but to crouch among the prisoners or to fall among the slain. For all this his anger has not turned away[a], and his hand is still stretched out.
translation:
  language: zh_hans
  text: 除了在囚犯中屈身、倒在被杀者中以外，再没有别的出路。［a］尽管如此，他的怒气还没有转消；他的手仍然伸着。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּלְתִּי
  choice: 除了……别无出路
  rationale: 本句高度省略；此处表示审判临到时只剩下这些结局。采用现代汉语的存现表达，使语意自然，同时不补入超出上下文的内容。
- source_word: כָרַע
  choice: 屈身
  rationale: 该动词可指弯下、跪下或蜷伏。此处描述受俘时被迫卑伏的状态；“屈身”保留动作幅度，也避免“下拜”可能带来的敬拜含义。
- source_word: תַּחַת
  choice: 在……中
  rationale: 字面可作“在……下面”，但结合囚徒与被杀者的群体语境，较自然地表示落在或列身于他们之中。直译“在……下面”在现代汉语中关系不明，因此将较字面的可能读法置于脚注。
- source_word: אַסִּיר
  choice: 被掳的人
  rationale: 该名词指遭捆绑、囚禁的人。此处“被掳的人”符合战争审判语境，并能与后面的“被杀的人”形成自然对应。
- source_word: הֲרוּגִים
  choice: 被杀的人
  rationale: 这是 הרג 的被动分词，明确指遭暴力杀害者；“被杀的人”比笼统的“死人”更准确。
- source_word: יִפֹּלוּ
  choice: 倒在
  rationale: 形态上是复数有限动词“他们必倒下”，但压缩句法容许与前面的 כָרַע 构成两个并列结局。正文用“或倒在”保持汉语顺畅，脚注保留主语转换的另一种分析。
- source_word: בְּכָל זֹאת
  choice: 尽管如此
  rationale: 这是以赛亚书反复出现的副歌，强调此前的审判仍未使怒气止息。“尽管如此”在现代汉语中清楚表达让步关系。
- source_word: לֹא שָׁב אַפּוֹ
  choice: 他的怒气还没有转消
  rationale: אַף 在此是“怒气”，שׁוּב 表示转回、止息。“转消”既保留“转”的意象，又自然表达怒气尚未止息。
- source_word: יָדוֹ נְטוּיָה
  choice: 他的手仍然伸着
  rationale: 保留以赛亚书中神伸手施行持续审判的拟人意象；“仍然”表达审判尚未结束。
theological_decisions:
- issue: 神施行审判的拟人语言
  choice: 保留“他的怒气”和“他的手仍然伸着”
  alternative: 意译为“他的审判仍在继续”
  rationale: 希伯来文本以怒气和伸出的手描写神持续施行审判。正文保留具体意象及其张力，不将其化约为抽象神学陈述。
- issue: 压缩句法中受审者的两种结局
  choice: 理解为只剩“屈身在被掳的人中”或“倒在被杀的人中”
  alternative: 理解为“除非屈身在囚徒之下，他们必倒在被杀者之下”
  rationale: 正文采用较连贯的并列分析，但希伯来语中的介词关系和动词主语并不完全明确，因此用脚注呈现较字面的另一种读法，而不把歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“屈身”避免敬拜色彩，“被掳的人／被杀的人”形成平行；保留本节作为审判副歌的凝重节奏。
