  text: הֲ/לֹ֥א כְּ/כַרְכְּמִ֖ישׁ כַּלְנ֑וֹ אִם לֹ֤א כְ/אַרְפַּד֙ חֲמָ֔ת אִם לֹ֥א כְ/דַמֶּ֖שֶׂק שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/009.yaml
  text: Is not Calno like Carchemish? Is not Hamath like Arpad? Is not Samaria like Damascus?[a]
translation:
  language: zh_hans
  text: 迦勒挪[a]不也和迦基米施一样吗？哈马不也和亚珥拔一样吗？撒马利亚不也和大马士革一样吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒挪”在一些译本中作“甲尼”，反映这个地名的传统异体形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 不也……吗
  rationale: 否定疑问形式构成期待肯定回答的反问；“不也……吗”既保留反问语气，也符合现代汉语表达。
- source_word: כְּכַרְכְּמִישׁ כַּלְנוֹ
  choice: 迦勒挪……和迦基米施一样
  rationale: 介词 כְּ 表示比较。汉语将被比较的城市“迦勒挪”置于前面，以自然句序表达两城处境相同的夸口。
- source_word: כַּלְנוֹ
  choice: 迦勒挪
  rationale: 按本节希伯来语辅音和读音音译，并采用中文圣经中通行的地名形式。
- source_word: כַּרְכְּמִישׁ
  choice: 迦基米施
  rationale: 采用现代中文圣经中通行的地名音译。
- source_word: אִם לֹא
  choice: 不也……吗
  rationale: 这里不是条件句，而是在诗体平行结构中继续反问；统一译法清楚传达连续夸口的语势。
- source_word: כְאַרְפַּד חֲמָת
  choice: 哈马……和亚珥拔一样
  rationale: 保留 כְ 的比较意义，并按自然汉语句序先说“哈马”，再说比较对象“亚珥拔”。
- source_word: חֲמָת
  choice: 哈马
  rationale: 采用现代中文圣经中通行的地名音译。
- source_word: אַרְפַּד
  choice: 亚珥拔
  rationale: 采用现代中文圣经中通行的地名音译。
- source_word: כְדַמֶּשֶׂק שֹׁמְרוֹן
  choice: 撒马利亚……和大马士革一样
  rationale: 保留两城之间的比较，并按自然汉语句序表达。
- source_word: דַּמֶּשֶׂק
  choice: 大马士革
  rationale: 采用现代标准汉语中的通行地名。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用中文圣经中通行的名称；本处首先指撒马利亚城，并可连带指向北国。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。三个平行反问均用“不也和……一样吗”，保留原文的重复结构、讥诮语气和亚述王将各城等量齐观的夸口；地名使用中文圣经读者较熟悉的译法。
