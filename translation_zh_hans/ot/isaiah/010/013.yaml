source:
  edition: WLC
  text: כִּ֣י אָמַ֗ר בְּ/כֹ֤חַ יָדִ/י֙ עָשִׂ֔יתִי וּ/בְ/חָכְמָתִ֖/י כִּ֣י נְבֻנ֑וֹתִי וְ/אָסִ֣יר גְּבוּלֹ֣ת עַמִּ֗ים ו/עתידתי/הם שׁוֹשֵׂ֔תִי וְ/אוֹרִ֥יד כַּ/אבִּ֖יר יוֹשְׁבִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/013.yaml
  text: For he says[a], “By the strength of my hand I have done it, and by my wisdom, for I have understanding. I remove the boundaries of peoples, and I plunder their treasures[c][b]; like a mighty man I bring down those who sit enthroned.”
translation:
  language: zh_hans
  text: 因为他说：“我凭手中的力量成就了这一切；我凭自己的智慧，因为我有悟性。我挪移万民的疆界，抢夺他们积存的财富[a]；我如勇士一般，使坐在高位的人[b]降卑。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的储备”“他们的财物”。这里的希伯来词较罕见，可能指预先积存起来的财富。
    reason: lexical_alternative
  - marker: b
    text: 或译“居民”。原文可泛指居住的人，在这里也可能特指坐在高位、掌权的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָמַר
  choice: 因为他说
  rationale: כִּי承接上文，说明上帝惩治亚述王的缘由；完成式אָמַר在这里概括其典型夸口，用现代汉语现在时“他说”自然表达。
- source_word: בְּכֹחַ יָדִי
  choice: 我靠自己的手有力量
  rationale: 保留“手”这一具体意象及其自夸语气；“自己的”凸显说话者将功劳归于自身。
- source_word: עָשִׂיתִי
  choice: 成就了这一切
  rationale: עָשָׂה本义宽泛，可指“做、成就”；补出“这一切”承接上下文中的征服行动，使汉语完整自然。
- source_word: וּבְחָכְמָתִי כִּי נְבֻנוֹתִי
  choice: 我凭自己的智慧，因为我有聪明
  rationale: 分别保留חָכְמָה的“智慧”和בין词干所表达的理解、明辨能力，也保留原文因果结构及自负口吻。
- source_word: וְאָסִיר גְּבוּלֹת עַמִּים
  choice: 我挪移万民的疆界
  rationale: סור的使役式表示移除或挪动；“挪移疆界”既符合征服后重划边界的语境，也不把עַמִּים过度现代化为民族国家。
- source_word: וַעֲתִידֹתֵיהֶם שׁוֹשֵׂתִי
  choice: 抢夺他们积存的财富
  rationale: עתידותיהם是罕见而有争议的词形，在此很可能指预备、储存起来的财物；שׁוֹשֵׂתִי表示掳掠、抢夺。译文以脚注保留词义的不确定性。
- source_word: וְאוֹרִיד כַּאבִּיר יוֹשְׁבִים
  choice: 我如勇士一般，使坐在高位的人降卑
  rationale: אַבִּיר可指强者、勇士；ישׁב本可泛指居住或坐着，但与“使下降”连用时可能特指居高位者。正文采用符合征服语境的理解，脚注保留较宽泛的可能。
theological_decisions:
- issue: 夸口者的指称
  choice: 保留单数“他／我”，让上下文将其理解为亚述王的夸口，同时可代表亚述整体的骄傲。
  alternative: 把说话者直接译作“亚述”这一整体。
  rationale: 希伯来文使用单数，紧邻上下文又指向亚述王；不在本节正文中补出专名，可避免排除其代表帝国整体的层面。
- issue: יוֹשְׁבִים是否特指掌权者
  choice: 正文译为“坐在高位的人”。
  alternative: 译为“居民”或“居住的人”。
  rationale: “使……降下”与“坐着”形成高低反差，在帝王征服的夸口中很可能指身居高位者；但该分词本身也可泛指居民，因此以脚注保存歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“挪移万民的疆界”保留先知书的宏阔语感；“积存的财富”和“坐在高位的人”使罕见词及语境含义清楚可懂，同时借脚注保存原文歧义。
