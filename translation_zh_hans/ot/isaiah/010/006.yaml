  to: 我要差遣他攻击不敬神的国[a]，又命令他攻击我所震怒的人民：夺取掳物，抢掠财物[b]，使其[c]成为任人践踏之物，如同街上的泥泞。
  rationale: 修订保留神差遣审判执行者、神的震怒及掳掠的双重强化表达。以“使其成为任人践踏之物，如同街上的泥泞”更紧密对应原文的代词、结果性名词和比喻，同时不在正文中裁定该代词究竟专指“国”还是“人民”。脚注标记均置于其所说明的词语或代词之后。
