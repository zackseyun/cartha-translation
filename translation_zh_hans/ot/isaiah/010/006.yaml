  - severity: low
    issue: “街上的泥土”弱化了 חֹמֶר 在此处作为街巷泥泞、泥浆的意象。
    rationale: “泥泞”更符合街道上可被踩踏的泥土，也更自然地与“任人践踏之物”相连。
