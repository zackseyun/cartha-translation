source:
  edition: WLC
  text: בְּ/ג֤וֹי חָנֵף֙ אֲשַׁלְּחֶ֔/נּוּ וְ/עַל עַ֥ם עֶבְרָתִ֖/י אֲצַוֶּ֑/נּוּ לִ/שְׁלֹ֤ל שָׁלָל֙ וְ/לָ/בֹ֣ז בַּ֔ז ו/ל/שימ/ו מִרְמָ֖ס כְּ/חֹ֥מֶר חוּצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/006.yaml
  text: Against a godless nation I send him[a], and against the people of my wrath I command him, to seize spoil and to carry off plunder[c][b], and to make it a trampling place like the mud of the streets.
translation:
  language: zh_hans
  text: 我要差遣他攻击不敬神的国[a]，又命令他攻击我所震怒的人民：夺取掳物，抢掠财物[b]，使其[c]成为任人践踏之物，如同街上的泥泞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不敬神的”也可译作“不敬虔的”或“不虔敬的”。原文形容在宗教和道德上悖逆、亵慢神的状态，并不只是指待人虚伪。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近似“掠取掠物，抢夺抢物”，以动词和同根名词并列，强化掳掠的行动。
    reason: lexical_alternative
  - marker: c
    text: 原文为阳性单数代词，可回指前面的“国”或“人民”，把它们视为一个整体；也可译作“使它成为被践踏之物”。
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹי חָנֵף
  choice: 不敬虔的国
  rationale: גּוֹי指政治与群体意义上的“国”；חָנֵף在先知语境中指亵渎、不虔或悖逆神，并非现代汉语通常所说的“虚伪”。“不敬虔”保留其宗教与道德谴责。
- source_word: אֲשַׁלְּחֶנּוּ
  choice: 我要差他去攻击
  rationale: 动词本义是“差遣他”；介词בְּ在此表示行动所针对的对象。补出“攻击”使现代汉语清楚自然，同时仍以“差”保留受差遣者作为审判工具的含义。
- source_word: עַם עֶבְרָתִי
  choice: 我所震怒的民
  rationale: עַם译作“民”，与前句的“国”形成对应；עֶבְרָה表示强烈、审判性的忿怒。“我所震怒的民”自然表达该民是神震怒所针对的对象。
- source_word: אֲצַוֶּנּוּ
  choice: 命令他
  rationale: צוה直接表示“命令”；保留神对这一审判执行者的主权。
- source_word: לִשְׁלֹל שָׁלָל וְלָבֹז בַּז
  choice: 夺取财物，掳掠货财
  rationale: 两组同根动词与名词构成强化性的掳掠惯用语。中文以两个近义并列短语再现其节奏和强度，避免生硬直译为“掠夺掠物”。
- source_word: וּלְשִׂימוֹ מִרְמָס
  choice: 使这民……任人践踏
  rationale: 阳性单数后缀可回指作为集合体的国或民；מִרְמָס指被践踏之物或任人践踏的状态。中文用“这民”明确集合性所指，并以“任人践踏”自然表达结果。
- source_word: כְּחֹמֶר חוּצוֹת
  choice: 如街上的泥土
  rationale: חֹמֶר在此指街巷中的泥泞或泥土，חוּצוֹת指街道、户外公共空间；此译保留具体而强烈的比喻。
theological_decisions:
- issue: “他”的指代
  choice: 保留阳性单数“他”，指上文作为神审判工具的亚述或其王
  alternative: 将亚述作为国家拟人化，译作“它”
  rationale: 希伯来语后缀为阳性单数，上下文把亚述描写为受差遣的行动者。“他”既贴近语法，也不消除亚述王与亚述整体之间的张力。
- issue: 神震怒的表达
  choice: 直译为“我所震怒的民”
  alternative: 弱化为“我所不悦的民”或解释为“我要惩罚的民”
  rationale: 原文明确使用עֶבְרָה这一强烈的神圣忿怒用语，应保留审判力度，不作淡化。
- issue: 践踏对象的指代
  choice: 正文用“这民”承接集合性的国与民
  alternative: 译作“它”或“他们”
  rationale: 原文是阳性单数后缀，却回指集合名词。现代汉语用“这民”既显明对象，也避免因“它／他们”而过度决定其语法数。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来诗歌的平行结构：“差他／命令他”“夺取／掳掠”。“震怒”保留审判语气；“街上的泥土，任人践踏”兼顾原文意象与中文可读性。所有脚注标记均置于正文相应位置。
