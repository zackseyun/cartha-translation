base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/003.yaml
  text: What will you do on the day of punishment[a], and in the devastation that comes from far away? To whom will you flee for help, and where will you leave your wealth?
translation:
  language: zh_hans
  text: 当惩罚的日子和从远方来到的毁灭临到时，你们要怎么办呢？你们要向谁逃去求助？又要把你们的财富[b]留在哪里呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译“你们的荣耀”或“你们的尊荣”。希伯来语既可指荣耀、尊荣，在本处也可能具体指所珍视的财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדָּה
  choice: 惩罚
  rationale: 在先知宣告审判的语境中，此词指带来惩罚的察访或追究；“惩罚”清楚传达其负面审判含义。
- source_word: שׁוֹאָה
  choice: 毁灭
  rationale: 此名词指灾难性的破坏、荒废或毁灭；“毁灭”简洁有力，也符合远方敌军来袭的语境。
- source_word: מִמֶּרְחָק תָּבוֹא
  choice: 从远方临到
  rationale: 保留灾难源自远处并将要来到的空间和未来意味；“临到”适合庄重的先知文体。
- source_word: תָּנוּסוּ לְעֶזְרָה
  choice: 逃到谁那里求助
  rationale: נוס表示逃离危险，לְעֶזְרָה表示寻求帮助；中文调整语序，使问句自然，同时保留“逃”和“求助”两个要素。
- source_word: תַעַזְבוּ
  choice: 留在
  rationale: 基本义为留下或撇下；“留在哪里”不预断是存放、托付还是被迫舍弃，保留原文的宽泛性。
- source_word: כְּבוֹדְכֶם
  choice: 你们的财富
  rationale: כבוד通常可指荣耀、尊荣，此处也可能具体指权贵所珍视的财物；正文采用较符合灾难处境的“财富”，并以脚注保存字面及抽象含义。
theological_decisions:
- issue: כְּבוֹדְכֶם 在审判宣告中是具体财物还是抽象的荣耀
  choice: 你们的财富
  alternative: 你们的荣耀／尊荣
  rationale: 上下文追问审判来临时这些人能向谁求助，以及将把所珍视之物留在哪里，具体译作“财富”较顺畅；但“荣耀、尊荣”仍是该词真实的词义和可能的修辞含义，因此不在正文中完全消除歧义，而以脚注注明。
- issue: פְּקֻדָּה 的审判性质
  choice: 惩罚的日子
  alternative: 察访的日子／追究的日子
  rationale: 在本段祸哉宣告中，该“察访”明显带有追究罪责和施行审判的意味；“惩罚”使现代读者直接把握语境，同时脚注保留其可理解为追究、察访的词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“临到”保留先知性审判宣告的语感；三个连续问句重现原文的修辞压力。正文中的[a]、[b]均与脚注对应。
