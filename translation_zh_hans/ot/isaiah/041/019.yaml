  yaml_path: translation/ot/isaiah/041/019.yaml
  text: I will put in the wilderness cedar[a], acacia, myrtle, and olive tree; I will set in the desert cypress, plane tree, and pine together[b],
translation:
  language: zh_hans
  text: 我要在旷野栽种香柏树、金合欢树、桃金娘和橄榄树[a]；我要在荒原一同栽种柏树、悬铃木和松树[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “橄榄树”原文直译为“油树”。
    reason: lexical_alternative
  - marker: b
    text: “柏树、悬铃木和松树”所指的确切树种都不能确定；也可能分别指桧树或冷杉、榆树，以及黄杨树等。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתֵּן / אָשִׂים
  choice: 栽上
  rationale: 两个动词本义分别偏向“放置”和“安置”；以树木为宾语时，现代汉语用“栽上”自然具体，同时保留两句平行的行动意象。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר可指荒凉、未耕作之地，不限于沙漠；“旷野”保留其较宽泛的含义。
- source_word: אֶרֶז
  choice: 香柏树
  rationale: 这是圣经希伯来语中该树名的惯常译法，通常指黎巴嫩香柏。
- source_word: שִׁטָּה
  choice: 皂荚树
  rationale: 该词指金合欢属树木；“皂荚树”是中文圣经传统中较熟悉的名称。现代植物学亦常译“金合欢树”。
- source_word: הֲדַס
  choice: 番石榴树
  rationale: 该词通常指桃金娘；采用中文圣经中较熟悉的“番石榴树”，但需注意并非现代通常所说的番石榴（guava）。
- source_word: עֵץ שָׁמֶן
  choice: 橄榄树
  rationale: 字面为“油树”；上下文中通常理解为产油的橄榄树，但字面译法保留于脚注。
- source_word: בָּעֲרָבָה
  choice: 在荒原
  rationale: עֲרָבָה可指干旱草原、荒漠地带，也可作专名“亚拉巴”；此处与“旷野”平行，宜按普通名词处理。
- source_word: בְּרוֹשׁ
  choice: 柏树
  rationale: 具体树种不确定，可能是柏、桧或冷杉一类；正文采用概括而常见的“柏树”。
- source_word: תִּדְהָר
  choice: 悬铃木
  rationale: 树种鉴定不确定；“悬铃木”对应常见的 plane tree 解释，其他可能性在脚注说明。
- source_word: תְאַשּׁוּר
  choice: 松树
  rationale: 树种鉴定不确定；“松树”是常见语境译法，其他可能性在脚注说明。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 准确表达这些树木共同出现、被栽在一起的意思，并保持诗句简洁。
