id: ISA.41.13
reference: Isaiah 41:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֗י אֲנִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מַחֲזִ֣יק יְמִינֶ֑/ךָ הָ/אֹמֵ֥ר לְ/ךָ֛ אַל תִּירָ֖א אֲנִ֥י עֲזַרְתִּֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/013.yaml
  text: For I am Yahweh your God[a], who takes hold of your right hand, who says to you, ‘Do not fear; I will help you.’
translation:
  language: zh_hans
  text: 因为我——雅威、你的神——握住你的右手，并对你说：“不要害怕，我必帮助你[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语按词形也可译作“我已经帮助了你”或“我帮助你”；这里译作“我必帮助你”，以表达上下文中的应许意味。
    reason: 词形与语境所表达的时体存在可保留的译法差异。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为“不必害怕”的劝勉说明理由，保留原文的因果连接。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质，不用称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 保留第二人称单数所属关系以及立约关系中的直接称呼。
- source_word: מַחֲזִיק יְמִינֶךָ
  choice: 握住你的右手
  rationale: חזק 的使役分词在此表示抓住、扶持；译文保留“右手”这一具体形象，并以“握住”自然表达持续扶持。
- source_word: הָאֹמֵר לְךָ
  choice: 对你说
  rationale: 冠词加分词继续描述雅威；现代汉语无需重复关系代词，即可清楚承接前句。
- source_word: אַל תִּירָא
  choice: 不要害怕
  rationale: 准确表达否定祈使语气，现代、清楚而庄重。
- source_word: עֲזַרְתִּיךָ
  choice: 我必帮助你
  rationale: 该词形态上是完成式，但在神安慰人的话语中具有确定应许的力量；“必”既表达未来指向，也凸显应许的确定性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，也较贴近学界通常采用的发音重构。
- issue: עֲזַרְתִּיךָ 的时体与应许语气
  choice: 我必帮助你
  alternative: 我已经帮助了你／我帮助你
  rationale: 完成式在此可传达已经确定的神圣保证。结合“不要害怕”的语境，汉语用“必”自然呈现其面向当前及未来的应许力量，同时以脚注保留形态上的完成式歧义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。用两个并列分句展开原文的分词结构，使主语和动作关系清楚；保留“握住右手”的具体意象。脚注标记紧随其实际说明的“我必帮助你”之后。
