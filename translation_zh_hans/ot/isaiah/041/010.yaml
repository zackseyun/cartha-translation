id: ISA.41.10
reference: Isaiah 41:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַל תִּירָא֙ כִּ֣י עִמְּ/ךָ אָ֔נִי אַל תִּשְׁתָּ֖ע כִּֽי אֲנִ֣י אֱלֹהֶ֑י/ךָ אִמַּצְתִּ֨י/ךָ֙ אַף עֲזַרְתִּ֔י/ךָ אַף תְּמַכְתִּ֖י/ךָ בִּ/ימִ֥ין צִדְקִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/010.yaml
  text: Do not fear[a], for I am with you; do not look around in dread, for I am your God. I will strengthen you; surely I will help you[b]; surely I will uphold you with my righteous right hand.
translation:
  language: zh_hans
  text: 不要害怕，因为我与你同在；不要惊慌四顾[a]，因为我是你的上帝。我必使你刚强，必定帮助你，必定用我公义的右手扶持你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来语动词也可译作“不要惊惶”；它可能含有因焦虑或惊恐而四下张望的意思。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译：“以我公义的右手。”
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: 不要害怕
  rationale: 直接表达 ירא 的禁止式，简洁、自然，并保留原文安慰性的命令语气。
- source_word: כִּי עִמְּךָ אָנִי
  choice: 因为我与你同在
  rationale: כִּי 在此说明不要害怕的理由；“与你同在”保留原文的立约与临在意象。
- source_word: אַל תִּשְׁתָּע
  choice: 不要惊慌四顾
  rationale: 该动词可能兼有因惊惧而环顾的具体动作和内心惶惑之意；此译法保留两层含义，又符合现代汉语。
- source_word: אֲנִי אֱלֹהֶיךָ
  choice: 我是你的上帝
  rationale: 按上下文作单数理解，直接保留第二人称所属关系。
- source_word: אִמַּצְתִּיךָ
  choice: 我必使你刚强
  rationale: אמץ 表示使人坚强有力；结合这一连串神的保证，以应许性的“必”表达其语篇功能。
- source_word: אַף
  choice: 必定
  rationale: 此处用于加强保证，不仅是简单递进；两次译作“必定”，保留原文反复强化的修辞。
- source_word: עֲזַרְתִּיךָ
  choice: 帮助你
  rationale: 准确表达 עזר 的普通含义，并与前后的应许并列。
- source_word: תְּמַכְתִּיךָ
  choice: 扶持你
  rationale: תמך 指支撑、托住；“扶持”自然地呼应后面的“右手”意象。
- source_word: בִּימִין צִדְקִי
  choice: 用我公义的右手
  rationale: 将 ב 理解为工具性介词；“公义的右手”在现代汉语中自然，同时保留“公义”修饰右手这一希伯来语结构所表达的神圣能力与正直。
theological_decisions:
- issue: 三个完成式动词的时态与语篇功能
  choice: 译为带“必”的应许性表达
  alternative: 我已经使你刚强／已经帮助你／已经扶持你
  rationale: 这些形式在此构成连续的神圣保证。汉语用“必”能清楚传达面向受话者的应许和确定性，同时不把它们硬性解释为单纯的过去事件。
- issue: בִּימִין צִדְקִי 的关系
  choice: 用我公义的右手
  alternative: 用我公义之右手／用我公义的右手之力／用我正义的右手
  rationale: 原文直译为“以我公义的右手”。正文保留“公义”与“右手”的紧密关系，不额外限定其为某一种教义概念；脚注提供较形式对应的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个禁止句保持平行，后半节以“必／必定”的反复形成逐步加强的保证；避免生硬的逐词对应，同时保留“同在”“右手”“公义”等核心意象。
