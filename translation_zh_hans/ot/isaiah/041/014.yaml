  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַל תִּֽירְאִי֙ תּוֹלַ֣עַת יַֽעֲקֹ֔ב מְתֵ֖י יִשְׂרָאֵ֑ל אֲנִ֤י עֲזַרְתִּי/ךְ֙ נְאֻם יְהוָ֔ה וְ/גֹאֲלֵ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/014.yaml
  text: Do not fear[a], worm Jacob, men of Israel; I myself help you, declares Yahweh, your Redeemer[c][b], the Holy One of Israel.
translation:
  language: zh_hans
  text: 虫一般的雅各，以色列中必死的人啊，不要害怕！[a][b]我亲自帮助你[c]——这是雅威的宣告——你的救赎主，以色列的圣者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虫”是软弱、卑微的比喻，并不是对雅各的字面描述。
    reason: cultural_note
  - marker: b
    text: “必死的人”也可译作“人”或“以色列人”；原文用词与“虫一般的雅各”相呼应，可能着重人的脆弱。
    reason: lexical_alternative
  - marker: c
    text: “我亲自帮助你”也可理解为“我已经帮助你”或“我将帮助你”；原文动词采用完成式，在这里可作为先知性的保证，强调这帮助确定无疑。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: 不要害怕
  rationale: אַל加未完成式构成禁令；阴性单数形式与被人格化、作为整体受称呼的“雅各”一致。
- source_word: תּוֹלַעַת יַעֲקֹב
  choice: 虫一般的雅各
  rationale: 保留“虫”的鲜明比喻及其软弱、卑微之意，同时用“虫一般的”使现代汉语称呼自然，避免被误解为字面分类。
- source_word: מְתֵי יִשְׂרָאֵל
  choice: 以色列这群必死的人
  rationale: מְתֵי可指“人、凡人、必死之人”；此处与“虫一般的雅各”平行，重点在脆弱和必死性。“这群”使集合性的呼语在汉语中顺畅，并不表达数量稀少。
- source_word: אֲנִי
  choice: 我必亲自
  rationale: 独立代词带有强调作用，用“亲自”体现说话者的着重。
- source_word: עֲזַרְתִּיךְ
  choice: 帮助你
  rationale: 形式上是完成式，但在先知性保证中可表达确定将要成就的行动；正文以“必”传达确定的将来保障，脚注保留时态理解的空间。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是先知话语中的宣告公式；将יהוה音译为“雅威”，明确保留神的专名。
- source_word: וְגֹאֲלֵךְ
  choice: 他是救赎你的
  rationale: גאל指承担亲属责任而赎回、解救者；动词化表达在现代汉语中较自然，同时保留救赎含义。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 保留以赛亚书中重要的神圣称号及其庄重语体。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为盟约之神专名的功能，不以称号代替。
- issue: מְתֵי יִשְׂרָאֵל所表达的群体与脆弱性
  choice: 以色列这群必死的人
  alternative: 以色列人／以色列的男子
  rationale: 此词虽为阳性复数，但可集体指以色列民；上下文与“虫”平行，突出人的软弱和必死性，不宜把神学重点限定为男性。
- issue: עֲזַרְתִּיךְ的时间指向
  choice: 我必亲自帮助你
  alternative: 我已经帮助你／我正在帮助你
  rationale: 希伯来语完成式可在先知性保证中表明行动确定无疑。正文采用确定将来，脚注列出形式上和语境上可能的其他理解，不消除其张力。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。保留“虫”的冲击力和“以色列的圣者”这一以赛亚式称号；以“虫一般的”避免生硬的“虫雅各”，并用短句清楚呈现神谕公式。所有脚注标记均置于相关正文之后。
