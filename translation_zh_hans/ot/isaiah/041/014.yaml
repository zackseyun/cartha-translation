- from: 虫一般的雅各，以色列这群必死的人啊，不要害怕！[a][b]我必亲自帮助你[c]。这是雅威的宣告；他是救赎你的，是以色列的圣者。
  to: 虫一般的雅各，以色列中必死的人啊，不要害怕！[a][b]我亲自帮助你[c]——这是雅威的宣告——你的救赎主，以色列的圣者。
  rationale: 修正不自然且不合语法的“他是救赎你的”为“你的救赎主”，恢复原文两个名词性神圣称号的同位关系。将“必”从正文移至脚注可避免过度确定完成式的时间指向；微调以色列群体称呼，使普通话更自然，同时保留其脆弱、卑微的修辞平行。脚注锚点均保留并紧邻相应词语。
