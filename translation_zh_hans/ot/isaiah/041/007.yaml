source:
  edition: WLC
  text: וַ/יְחַזֵּ֤ק חָרָשׁ֙ אֶת צֹרֵ֔ף מַחֲלִ֥יק פַּטִּ֖ישׁ אֶת ה֣וֹלֶם פָּ֑עַם אֹמֵ֤ר לַ/דֶּ֨בֶק֙ ט֣וֹב ה֔וּא וַ/יְחַזְּקֵ֥/הוּ בְ/מַסְמְרִ֖ים לֹ֥א יִמּֽוֹט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/007.yaml
  text: The craftsman strengthens the metalworker[a]; the one who smooths with the hammer strengthens the one who strikes the anvil, saying of the soldering, “It is good”[b]; then he fastens it with nails so that it will not totter.
translation:
  language: zh_hans
  text: 工匠鼓励金属匠；用锤子锤平的工匠鼓励敲打铁砧的工匠，论到接合[a]时说：“很好！”随后又用钉子把它钉牢，使它不致摇晃。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接合”也可译作“接合处”“焊接”或“焊料”；较不可能是“胶合”。希伯来语可指使制品连接起来的材料或工序。
    reason: lexical_alternative
  - marker: b
    text: “不致摇晃”也可译作“不被挪动”或“不致倾倒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: 鼓励
  rationale: חזק的加强式可表示“使刚强、鼓励”，这里以工匠彼此配合为背景；译作“鼓励”自然，也与后半节表示实际固定的同一词根形成含蓄对照。
- source_word: חָרָשׁ
  choice: 工匠
  rationale: 这是 skilled worker 的泛称；“工匠”保留其宽泛性，不把他限定为某一种金属工。
- source_word: צֹרֵף
  choice: 金属匠
  rationale: 该词指熔炼、精炼金属的人。上下文是制作金属制品，译作“金属匠”既清楚，又避免无根据地限定为金匠。
- source_word: מַחֲלִיק פַּטִּישׁ
  choice: 拿锤子锤平的
  rationale: חלק在此指把金属表面锤平或磨光；用动词短语表达，符合现代汉语工场场景。
- source_word: הוֹלֶם פָּעַם
  choice: 敲打砧座的
  rationale: הולם表示击打；פעם在本语境通常理解为承受敲击的砧座。译文保留工匠分工的平行结构。
- source_word: לַדֶּבֶק
  choice: 谈到接合时
  rationale: דבק可指接合的动作、接合处或接合材料。正文采用较宽泛的“接合”，避免把工艺过度限定为焊接或粘合。
- source_word: טוֹב הוּא
  choice: 很好
  rationale: 直截了当地保留对工艺成果的肯定；在现代汉语引语中自然简洁。
- source_word: וַיְחַזְּקֵהוּ בְמַסְמְרִים
  choice: 随后用钉子把它钉牢
  rationale: 同一词根חזק在这里明确指实际加固；“钉牢”准确呈现钉子的作用，也保留先鼓励工人、后固定制品的语义转折。
- source_word: לֹא יִמּוֹט
  choice: 使它不致摇晃
  rationale: מוט的受动词干可指摇动、失稳或倾倒；“摇晃”不把程度夸大为必然倒塌，并保留物件需要被固定的反讽。
theological_decisions:
- issue: 先知讽刺中所制作物件的身份
  choice: 正文只用“它”指代制成品，不增添“偶像”
  alternative: 为求明确而直接译成“偶像”
  rationale: 上下文表明所谈的是偶像制作，但本节希伯来文本只描写工匠的合作与物件的固定。沿用代词能忠实保留原文的表达方式及其含蓄反讽。
- issue: 工匠之间“加强”的性质
  choice: 译为彼此“鼓励”
  alternative: 译为在制作过程中彼此“帮助”或“加固”
  rationale: חזק在此容许鼓励和实际助力两种理解；工匠彼此称许的语境支持“鼓励”，而后半句另以同一词根明确表示用钉子加固。正文采用较自然的关系性表达，但不添加宗教评价。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“金属匠”避免把צֹרֵף过度限定为金匠；两个分词短语译成平行的“……的”，呈现工场中的协作。正文不补入“偶像”，让上下文与物件必须靠钉子站稳的反讽自行显明。
