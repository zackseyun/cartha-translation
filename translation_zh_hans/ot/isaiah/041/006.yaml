  yaml_path: translation/ot/isaiah/041/006.yaml
  text: Each man helps his neighbor[a], and says to his brother[b], “Be strong!”
translation:
  language: zh_hans
  text: 各人帮助自己的同伴[a]，又对自己的弟兄[b]说：“要刚强！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同伴”也可译作“邻舍”或“朋友”。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”在这里也可泛指同族的人或同伴。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: 人人彼此帮助
  rationale: אִישׁ在这里具有分配性，动词却用复数，描写众人各自帮助同伴。译作“人人彼此帮助”符合现代汉语习惯，也保留群体中互相扶助的场景；脚注说明רֵעַ的具体词义范围。
- source_word: יַעְזֹרוּ
  choice: 帮助
  rationale: 未完成式在此承接上下文，生动描写正在展开或惯常发生的行动，不必明确译成将来时。
- source_word: וּלְאָחִיו
  choice: 又对自己的弟兄说
  rationale: אָח最直接的意思是“弟兄”，同时也可泛指同族或同伴；正文保留直译，较宽含义见脚注。“又”自然连接两个并列动作。
- source_word: יֹאמַר
  choice: 说
  rationale: 与前一未完成式相应，采用汉语一般现在式的无标记表达，不额外强调将来意义。
- source_word: חֲזָק
  choice: 要刚强！
  rationale: 该阳性单数命令式要求对方坚强、坚定。汉语“要刚强”简洁庄重，并保留劝勉和命令的力度。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的普通话。“人人彼此帮助”避免生硬复制希伯来语单数主语与复数谓语的搭配，同时通过脚注保留原文结构及רֵעַ的词义幅度；命令语“要刚强”保持简洁有力。
