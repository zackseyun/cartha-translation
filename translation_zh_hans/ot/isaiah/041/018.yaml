  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֶפְתַּ֤ח עַל שְׁפָיִים֙ נְהָר֔וֹת וּ/בְ/ת֥וֹךְ בְּקָע֖וֹת מַעְיָנ֑וֹת אָשִׂ֤ים מִדְבָּר֙ לַ/אֲגַם מַ֔יִם וְ/אֶ֥רֶץ צִיָּ֖ה לְ/מוֹצָ֥אֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/018.yaml
  text: I will open rivers on the bare heights[a], and springs in the midst of the valleys; I will make the wilderness into a pool of water[b], and the dry land into springs of water.
translation:
  language: zh_hans
  text: 我要在光秃的高地上开出江河[a]，在谷地之中开出泉源；我要使旷野变为水池，使干旱之地变为涌水之处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “光秃的高地”也可译作“荒凉的山冈”或“裸露的高处”。
    reason: lexical_alternative
  - marker: b
    text: “涌水之处”也可译作“水源”或“泉源”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְתַּח
  choice: 我要……开出
  rationale: פתח的Qal未完成式第一人称单数在此表达上帝将来的应许；“开出”自然呈现使水道出现、畅通的意象。
- source_word: שְׁפָיִים
  choice: 光秃的高地
  rationale: 该词指裸露、常无草木的高处；“光秃的高地”兼顾地势和荒芜特征，并避免“邱坛”等宗教性联想。
- source_word: נְהָרוֹת
  choice: 江河
  rationale: 保留该词通常所指的河流及诗歌中水量丰沛的意象；相较“溪流”，不弱化原文力度。
- source_word: וּבְתוֹךְ בְּקָעוֹת
  choice: 在谷地之中
  rationale: בקעות可指山谷或宽阔低地；与前句高地形成对照。“之中”保留בְתוֹךְ的空间含义。
- source_word: מַעְיָנוֹת
  choice: 泉源
  rationale: 指自然涌出的泉水；“泉源”庄重而易懂，也能体现水从地下涌出的源头意象。
- source_word: אָשִׂים
  choice: 我要使……变为
  rationale: שים在这一转化语境中表示使某物成为另一状态；此译法符合现代汉语，并不额外解释变化机制。
- source_word: מִדְבָּר
  choice: 旷野
  rationale: 涵盖荒凉、缺水之地，不局限于沙质沙漠，也符合先知诗歌的常见表达。
- source_word: לַאֲגַם מַיִם
  choice: 变为水池
  rationale: אגם可指池塘、湖沼或积水处；“水池”中性自然，保留聚集之水的图景而不将其限定为沼泽或湖泊。
- source_word: אֶרֶץ צִיָּה
  choice: 干旱之地
  rationale: ציּה强调极度缺水、干燥；“干旱之地”比单纯“干地”更充分传达原词力度。
- source_word: לְמוֹצָאֵי מָיִם
  choice: 变为涌水之处
  rationale: מוֹצָאֵי字面涉及水的出口或流出之处；“涌水之处”既保留水涌出的动态，又避免与前面的מַעְיָנוֹת完全同词重复。
theological_decisions:
- issue: 环境转变意象的性质
  choice: 按先知诗歌的具体图景译为上帝使荒芜之地出现丰沛水源的应许，不在正文中将其寓意化。
  alternative: 将其明确解释为属灵复兴，或明确限定为末世新创造。
  rationale: 希伯来文直接呈现第一人称的神圣应许及具体环境意象。译文应保留其可作具体、象征或末世性理解的空间，而不替读者裁定。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。句式保留希伯来诗歌中“高地—谷地、旷野—干旱之地”的平行结构；两次使用“开出”强化前半句对应关系，后半句用“使……变为”呈现转化。所有脚注标记均已置于正文对应位置。
