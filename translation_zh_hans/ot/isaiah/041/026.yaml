source:
  edition: WLC
  text: מִֽי הִגִּ֤יד מֵ/רֹאשׁ֙ וְ/נֵדָ֔עָה וּ/מִ/לְּ/פָנִ֖ים וְ/נֹאמַ֣ר צַדִּ֑יק אַ֣ף אֵין מַגִּ֗יד אַ֚ף אֵ֣ין מַשְׁמִ֔יעַ אַ֥ף אֵין שֹׁמֵ֖עַ אִמְרֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/026.yaml
  text: Who declared it from the beginning[a], so that we might know, and beforehand, so that we might say, ‘He is right’? But there was no one declaring it, no one making it heard[b], no one hearing your words.
translation:
  language: zh_hans
  text: 谁从起初就宣告，好让我们知道；又预先说出，好让我们说：“他说得对”[b]？然而，没有人宣告，没有人使人听见，也没有人听见你们的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“他是对的”；传统译法：“他是公义的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 以简洁的疑问代词保留原文直接的反问和挑战语气。第二个并列分句沿用“谁”，使汉语句法完整，也不增添实体性内容。
- source_word: הִגִּיד
  choice: 宣告
  rationale: 该词为נגד的Hiphil，指公开或清楚地使人知道；“宣告”符合先知性、审判式挑战的语境。
- source_word: מֵרֹאשׁ
  choice: 从起初
  rationale: 保留时间上最早就已预告的含义；“从开头”也是可能译法，列入脚注。
- source_word: וְנֵדָעָה
  choice: 使我们可以知道
  rationale: 将祈愿式所表达的目的或结果自然地译出。
- source_word: וּמִלְּפָנִים
  choice: 预先
  rationale: 与“从起初”平行，突出事情发生前的预告；现代汉语简洁自然。
- source_word: וְנֹאמַר
  choice: 使我们可以说
  rationale: 与前一祈愿式平行，保留目的或结果意味。
- source_word: צַדִּיק
  choice: 他说得对
  rationale: 此处是对预言是否真实的判定，重在宣告者得到证实，而非主要描述其道德品质。补出“说”符合中文习惯，并由宣告的语境自然限定。
- source_word: אַף אֵין מַגִּיד
  choice: 然而，没有人宣告
  rationale: 用“然而”表现前面挑战与后面否定之间的转折；“没有人”保留连续加强的否定。
- source_word: מַשְׁמִיעַ
  choice: 传出消息
  rationale: שמע的Hiphil有“使人听见”的使役义；“传出消息”在现代汉语中自然，并保留让预告被听见的意思。
- source_word: שֹׁמֵעַ
  choice: 听见
  rationale: 保留分词所表达的“有任何人听见”之意，并与前面的“传出消息”形成听觉上的呼应。
- source_word: אִמְרֵיכֶם
  choice: 你们的话
  rationale: 直接对应复数“言语”，保留对偶像或其辩护者的复数称呼，不把对象解释得更窄。
theological_decisions:
- issue: 预言挑战中省略宾语的所指
  choice: 中文不补出“这事”“他”或具体事件，只用不及物式“宣告”
  alternative: 译作“谁从起初就宣告这事”或“谁从起初就宣告他”
  rationale: 希伯来文没有明示宾语。中文可以自然省略，因此不必像英语那样补“it”，从而最大限度保留所指的开放性。
- issue: צַדִּיק在本节中的含义
  choice: 他说得对
  alternative: 他是公义的；他是有理的
  rationale: 上下文是在检验预告是否真实可信，因此此词较可能表达司法式的认可或证实。正文采用自然汉语“他说得对”，脚注保留“他是对的／他是公义的”的词义可能。
- issue: 连续三个אַף אֵין的修辞力度
  choice: 以三个“没有人”构成递进并列
  alternative: 每句均译出“确实”或“甚至”
  rationale: 原文以重复加强彻底否定。汉语用连续重复“没有人”即可有效呈现力度，避免机械叠加副词。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文的法庭式挑战、并行问句和三重否定；不明确补出希伯来文省略的预告对象。正文中应有[b]标记，置于“他说得对”之后。
