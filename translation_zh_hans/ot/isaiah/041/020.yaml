  text: לְמַ֧עַן יִרְא֣וּ וְ/יֵדְע֗וּ וְ/יָשִׂ֤ימוּ וְ/יַשְׂכִּ֨ילוּ֙ יַחְדָּ֔ו כִּ֥י יַד יְהוָ֖ה עָ֣שְׂתָה זֹּ֑את וּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל בְּרָאָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/020.yaml
  text: so that they may see and know[a], and may consider and understand together, that the hand of Yahweh has done this, and the Holy One of Israel has created it.
translation:
  language: zh_hans
  text: 好叫人看见、知道、留心，并一同明白：雅威的手做了这事，以色列的圣者创造了它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: 好让
  rationale: 既保留目的或结果的语气，又符合现代汉语表达。
- source_word: יִרְאוּ וְיֵדְעוּ
  choice: 看见、知道
  rationale: 分别保留ראה和ידע的基本意义，并呈现由看见到认识的推进。
- source_word: וְיָשִׂימוּ
  choice: 留心
  rationale: 这里的שים具有把某事放在心上、加以思量的语义；“留心”自然简洁，也不把含义限定得过窄。
- source_word: וְיַשְׂכִּילוּ יַחְדָּו
  choice: 并一同明白
  rationale: שׂכל的使役形在此表示获得洞见或理解；“明白”适合认知动词序列，יַחְדָּו译作“一同”。
- source_word: כִּי
  choice: ：
  rationale: כִּי引出人所看见、知道和明白的内容；中文用冒号比直译“就是”更自然清楚。
- source_word: יַד יְהוָה
  choice: 雅威的手
  rationale: 保留希伯来语以“手”表达施行能力和作为的拟人说法，并将神名直接音译为“雅威”。
- source_word: עָשְׂתָה זֹּאת
  choice: 这是……所做的
  rationale: 保留עשה宽泛的“做、施行”之意，并以“这”回指上文所述作为。
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: 是以色列的圣者
  rationale: 保留以赛亚书中的神圣称号，并把并列分句自然地表达出来。
- source_word: בְּרָאָהּ
  choice: 所创造的
  rationale: ברא译作“创造”，与前面的“做”保持区别，也保留原文修辞上的重复和加强。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，同时不以称号替代专名。
- issue: “做”与“创造”两个分句的关系
  choice: 分别保留“所做的”和“所创造的”
  alternative: 合并为“这是雅威——以色列的圣者——所创造的”
  rationale: 原文使用עשה与ברא两个不同动词；分别翻译可保留其平行结构与修辞力度，而不额外断定两分句之间更具体的神学区别。
- issue: 四个认知动词的递进
  choice: 看见、知道，留心并一同明白
  alternative: 看见、认识，把这事放在心上，一同获得洞见
  rationale: 保留四个动词的层叠与推进，同时采用普通读者容易理解的现代汉语；“留心”也保留内在思量的意味。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“雅威的手”这一原文形象，并用冒号引出认知内容。主语“人都”使未明说的复数主体在汉语中清楚；不添加超出上下文的具体对象。
