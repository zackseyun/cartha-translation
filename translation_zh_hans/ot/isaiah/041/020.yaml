revisions:
- from: 好让人都看见、知道，留心并一同明白：这是雅威的手所做的，是以色列的圣者所创造的。
  to: 好叫人看见、知道、留心，并一同明白：雅威的手做了这事，以色列的圣者创造了它。
  rationale: 删除无对应的“都”，并将末句改为两个直接的并列行动分句，以保留“做”与“创造”的区别以及“这事／它”的回指关系。其余认知动词序列、神名和以赛亚书特有称号均保留。
