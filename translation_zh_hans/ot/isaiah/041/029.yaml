base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/029.yaml
  text: Look[a], all of them are nothing; their works are nothing[b]. Their cast images are wind and emptiness.
translation:
  language: zh_hans
  text: 看哪，他们全都是虚妄[a]；他们所做的全然归于无有。他们的铸像[b]是风和虚空。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚妄”也可译作“虚无”；原词还可表示祸患或邪恶，但本处着重表达空洞、无实质和无价值。
    reason: lexical_alternative
  - marker: b
    text: “铸像”也可译作“浇铸的像”或“铸造的偶像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意、加强结论语气的感叹词。“看哪”庄重而清楚，保留了原文的强调作用。
- source_word: כֻּלָּם
  choice: 他们全都
  rationale: 保留原文复数代词和总体性的表达，同时不强行限定所指仅为偶像或仅为制造偶像的人。
- source_word: אָוֶן
  choice: 虚无
  rationale: 该词可指虚妄、祸患或邪恶；在本段对偶像的抨击中，重点是其毫无实质和价值。“虚无”也与后文的“虚空”相呼应。
- source_word: אֶפֶס מַעֲשֵׂיהֶם
  choice: 他们所做的毫无价值
  rationale: אֶפֶס表达“不存在、什么也没有”；结合מַעֲשֵׂיהֶם，这里强调其作为或制成之物毫无效力与价值。此译法比直译成“他们的作为是无”更符合现代汉语。
- source_word: רוּחַ
  choice: 风
  rationale: 与תֹהוּ并列时，指向无实质、抓不住的事物；译作“风”可避免“灵”在此造成神学误解。
- source_word: תֹהוּ
  choice: 虚空
  rationale: 本处强调空洞、徒然，而非专指创世语境中的混沌或未成形状态。
- source_word: נִסְכֵּיהֶם
  choice: 他们铸造的偶像
  rationale: 该名词源于“浇铸”一词，指用熔化材料铸成的像；“铸造的偶像”在现代汉语中清楚自然，并明确本段的偶像语境。
theological_decisions:
- issue: 斥责对象的所指
  choice: 保留“他们”所指的宽度，使其可涵盖上下文中的偶像及与偶像有关的一方，而末句明确落在铸造的偶像上。
  alternative: 将“他们”直接译成“那些偶像”，或理解为制造偶像的人和偶像两者。
  rationale: 上下文主要揭露偶像不能言说、行动或预告未来，但复数形式本身没有在本节完全限定所指。直译代词可保留这种张力，避免过度解释。
- issue: 偶像是“虚无”的宣告
  choice: 将其理解为对偶像无实质、无能力、无价值的强烈否定。
  alternative: 把אָוֶן主要理解为道德上的“邪恶”或带来“祸患”。
  rationale: אָוֶן虽有较广语义，但与אֶפֶס、רוּחַ、תֹהוּ的平行结构表明，本节重点在偶像体系的空洞和无能，而不是单独判定其道德性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不过是风，是虚空”保留原文末句简短有力的并列结构；两处脚注标记均置于正文对应词语之后。
