base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/027.yaml
  text: The first says to Zion[a], ‘Look[d][c][b], here they are!’ and to Jerusalem I give a herald of good news.
translation:
  language: zh_hans
  text: 首先向锡安宣告[a]：“看哪，他们在这里！[b]”我赐给耶路撒冷一位报好消息的人。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文极为凝练，字面近于“首先／第一，向锡安”，没有明说主语和“宣告”这一动词；也可译作“我首先对锡安说”。
    reason: alternative_reading
  - marker: b
    text: 原文没有说明“他们”具体指谁或什么；可能指先前宣告的人或事情。
    reason: referential_ambiguity
  - marker: c
    text: “我赐给”也可译作“我要赐给”；“一位报好消息的人”也可译作“一位报喜信的使者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רִאשׁוֹן לְצִיּוֹן
  choice: 首先向锡安宣告
  rationale: 原文是高度凝练的诗句，字面近于“首先／第一，向锡安”，没有明说主语和谓语。译文采用汉语可自然省略主语的表达，并补出语境所含的“宣告”，既传达优先宣告之意，也避免把原文未明说的“我”或“那首先者”写入正文。
- source_word: הִנֵּה הִנָּם
  choice: 看哪，他们在这里！
  rationale: הִנֵּה 带有引人注意的指示语气，译作庄重而清楚的“看哪”；הִנָּם 含第三人称阳性复数后缀，直译为“他们在这里”，不擅自确定所指对象。
- source_word: וְלִירוּשָׁלִַם
  choice: 我又……给耶路撒冷
  rationale: 介词 ל 表示行动所指向或惠及的对象；“又”自然连接两个并列分句，不把它解释为时间先后。
- source_word: מְבַשֵּׂר
  choice: 一位报好消息的人
  rationale: 该分词指传报佳音者。此译法同时保留人的身份和消息的正面内容，比单译“使者”更完整，也不过度赋予专门职衔。
- source_word: אֶתֵּן
  choice: 我赐给
  rationale: 第一人称单数未完成式在先知话语中可表达现在或将来。正文采用生动的宣告式“赐给”，并以脚注注明未来式译法。
theological_decisions:
- issue: “他们”所指为何
  choice: 保留复数代词，不说明具体对象
  alternative: 归来的流亡者、先前预告的事情，或施行拯救的人员
  rationale: 希伯来文只给出复数代词，没有明确先行词；限定其所指会超出经文本身。
- issue: “首先”一语的主语与句法
  choice: 采用省略主语的“首先向锡安宣告”
  alternative: “我是首先对锡安说的”或“那首先者对锡安说”
  rationale: 原文没有明写第一人称代词或“说”这一动词。汉语省略主语可保留原文的凝练和一定程度的句法开放性，同时比名词化的“那首先者”更自然。
- issue: אֶתֵּן 的时间指向
  choice: 用宣告式现在表达“我赐给”
  alternative: “我要赐给”
  rationale: 未完成式在此可按先知性话语理解为将来，也可呈现为正在作出的生动宣告；正文不强行把时间限定为未来。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“看哪”保留先知诗歌中醒目的呼告语气；“报好消息的人”避免生硬术语。句首省略主语，既符合汉语表达，也保留希伯来文压缩句法的开放性。
