  text: וְ/אַתָּה֙ יִשְׂרָאֵ֣ל עַבְדִּ֔/י יַעֲקֹ֖ב אֲשֶׁ֣ר בְּחַרְתִּ֑י/ךָ זֶ֖רַע אַבְרָהָ֥ם אֹהֲבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/008.yaml
  text: But you[a], Israel, my servant, Jacob, whom I have chosen, offspring of Abraham, my friend—
translation:
  language: zh_hans
  text: '但你，以色列，我的仆人，

    雅各，我所拣选的，

    亚伯拉罕、我朋友[a]的后裔——'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“爱我的人”。
    reason: 保留 אֹהֲבִי 可按主动分词理解的另一种读法。
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 但你
  rationale: 连词加独立人称代词与上下文中的列国和拜偶像者形成鲜明对比；“但你”在现代汉语中自然传达这一转折强调。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文圣经及一般用语中的标准专名译法。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: עבד 可指奴仆或仆人；此处是以色列与上帝立约关系中的称号，“我的仆人”既自然，也不片面强调受奴役的身份。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用标准专名译法；此处与“以色列”同位。
- source_word: אֲשֶׁר בְּחַרְתִּיךָ
  choice: 我所拣选的
  rationale: 关系从句指向雅各／以色列；此译法简洁庄重，并保留上帝已经作出拣选的完成性。
- source_word: זֶרַע אַבְרָהָם
  choice: 亚伯拉罕的后裔
  rationale: זֶרַע 是集合性单数；现代汉语“后裔”能自然表达由亚伯拉罕而出的群体，无须生硬直译为“种子”。
- source_word: אֹהֲבִי
  choice: 我朋友
  rationale: 该带第一人称后缀的分词既可较直译为“爱我的人”，也可表达关系性的“我的朋友”；正文采用后者，以自然传达亚伯拉罕与上帝的亲密关系，同时用脚注保留字面可能。
theological_decisions:
- issue: אֹהֲבִי 用于亚伯拉罕时的含义
  choice: 我朋友
  alternative: 爱我的人
  rationale: 希伯来语形式可表示“爱我的人”，但在此语境中也可惯用地指与上帝有特殊亲密关系的人。正文译作“我朋友”以符合自然汉语，脚注列出较直译的读法，避免消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留希伯来诗句的同位结构与末尾承接下文的破折号；脚注标记紧随存在歧义的“朋友”。
