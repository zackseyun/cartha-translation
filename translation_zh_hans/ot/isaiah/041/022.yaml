translation_notes:
  register: 采用庄重而自然的现代标准汉语。首句以“证据”显明上下文中的法庭质询场景，同时用脚注注明原文宾语省略。保留“从前的事／将来的事”的对照，并将希伯来语的心之习语译为普通读者容易理解的“留心思量”。
