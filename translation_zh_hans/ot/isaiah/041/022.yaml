base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/022.yaml
  text: Let them bring them forward and tell us what will happen[a]. Tell us the former things—what they are—that we may set our heart on them and know their outcome[c][b]; or declare to us the things to come.
translation:
  language: zh_hans
  text: 让他们把这些呈上来，告诉我们将要发生的事。[a]先前的事是什么？请告诉我们，好让我们留心思量，也知道它们的结局；或者，把将来的事告诉我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“呈上来”的宾语；或译：“让他们呈上来，并告诉我们将要发生的事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַגִּישׁוּ
  choice: 让他们把证据呈上来
  rationale: 这是 נגשׁ 的使役式，在上下文的审判场景中是要求对方呈交其依据。原文宾语省略；中文补出“证据”，使法庭语境和句意自然清楚。
- source_word: וְיַגִּידוּ
  choice: 告诉我们
  rationale: נגד 的使役式可指告诉、说明或宣告；“告诉我们”符合现代汉语，也保留直接质询的语气。
- source_word: אֵת אֲשֶׁר תִּקְרֶינָה
  choice: 将要发生什么
  rationale: קרה 表示发生、临到；此译简洁自然，并准确表达所指的未来事件。
- source_word: הָרִאשֹׁנוֹת
  choice: 从前的事
  rationale: רִאשֹׁנוֹת 在这里指先前的事件，与后文“将来的事”形成对照。
- source_word: מָה הֵנָּה
  choice: 是什么
  rationale: 原文是无系词句，直译为“它们是什么”；中文结合前面的“从前的事”译为“是什么”，保留其开放性，不解释成“有什么意义”。
- source_word: הַגִּידוּ
  choice: 请说出
  rationale: 同样来自动词 נגד；“说出”与前文“告诉”保持语义联系，同时自然承接所要求说明的内容。
- source_word: וְנָשִׂימָה לִבֵּנוּ
  choice: 好让我们留心思量
  rationale: 原文直译为“把我们的心放在其上”，是专心注意、仔细考虑的习语。“留心思量”传达其认知与审慎意味，避免现代汉语中“把心放在……上”的误解。
- source_word: וְנֵדְעָה אַחֲרִיתָן
  choice: 知道它们的结局
  rationale: אַחֲרִית 可指末后、终局或结果；“结局”保留原词的终点意象，也符合此处考察先前事件如何收场的语境。
- source_word: אוֹ הַבָּאוֹת
  choice: 或者，把将来的事
  rationale: בוא 的分词形式指正在来到或即将发生的事；“将来的事”与“从前的事”形成清楚对照。
- source_word: הַשְׁמִיעֻנוּ
  choice: 告诉我们
  rationale: שׁמע 的使役式字面为“使我们听见”，此处功能是宣布、告知；“告诉我们”在现代汉语中自然，并保留挑战对方预告未来的语气。
