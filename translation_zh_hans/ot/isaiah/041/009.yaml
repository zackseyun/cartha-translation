base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/009.yaml
  text: you whom I took hold of from the ends of the earth[a], and called from its farthest corners, and said to you, ‘You are my servant; I have chosen you and not rejected you,’
translation:
  language: zh_hans
  text: 我从地极把你拉来，又从地的远方角落[a]召唤你，对你说：“你是我的仆人；我拣选了你，并没有弃绝你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“地的边缘”或“地的尽头”。这里的希伯来词词义有争议；也有人理解为“地的贵胄”。不过，地理性的理解与前面的“地极”更能构成平行。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזַקְתִּיךָ
  choice: 抓住你
  rationale: 此处使役词形结合“从地极”所表达的空间来源，较可能指抓住、带来，而非使人刚强。“抓住”保留了原文具体的动作意象。
- source_word: מִקְצוֹת הָאָרֶץ
  choice: 从地极
  rationale: 这是表示大地最遥远区域的常用诗歌表达；“地极”简洁、自然，也保留原文的地理广度。
- source_word: וּמֵאֲצִילֶיהָ
  choice: 从大地遥远的角落
  rationale: אציל 在此诗歌地理语境中可指边缘、尽头，与前句“地极”构成平行；译作“遥远的角落”清楚传达距离感，同时以脚注保留词义争议。
- source_word: קְרָאתִיךָ
  choice: 召你来
  rationale: קרא 可指呼唤或召唤；加“来”符合汉语中“从……召来”的自然表达，并保留神圣召命的含义。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: עבד 可指奴隶或仆人；在以赛亚书此处的立约和受差遣语境中，“仆人”最自然，也不额外强化奴役色彩。
- source_word: בְּחַרְתִּיךָ
  choice: 我拣选了你
  rationale: “拣选”准确表达有意选定，并在现代中文圣经语体中自然庄重；“了”表明过去的行动及其当前效力。
- source_word: מְאַסְתִּיךָ
  choice: 弃绝你
  rationale: מאס 表示拒绝、厌弃；“弃绝”贴合此处立约关系中的保证，又比“鄙视”少一层未经明说的情绪色彩。
theological_decisions:
- issue: 第二人称单数的所指
  choice: 全节保留单数“你”，将以色列／雅各作为整体性的单数仆人来称呼。
  alternative: 为凸显群体所指而译成“你们”。
  rationale: 希伯来文始终使用阳性单数第二人称。保留单数维持上下文的文学表达和神学张力，不改变受话者结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“抓住”保留原文动作意象；“召你来”使空间结构在中文中顺畅。原文以关系词承接上一节，中文按连续话语自然展开，不另加本节没有的所指说明。
