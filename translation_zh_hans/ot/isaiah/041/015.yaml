  text: הִנֵּ֣ה שַׂמְתִּ֗י/ךְ לְ/מוֹרַג֙ חָר֣וּץ חָדָ֔שׁ בַּ֖עַל פִּֽיפִיּ֑וֹת תָּד֤וּשׁ הָרִים֙ וְ/תָדֹ֔ק וּ/גְבָע֖וֹת כַּ/מֹּ֥ץ תָּשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/015.yaml
  text: Behold[a], I have made you a new sharp threshing sledge with double edges; you will thresh the mountains and crush them, and you will make the hills like chaff.
translation:
  language: zh_hans
  text: 看哪，我使你成为一具崭新、锋利、有刃齿[a]的碾谷器；你要碾压群山，把它们压碎，使丘陵如同糠秕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有双刃”“有许多刃”或“有锯齿”；希伯来语字面为“具有口（或刃）”。
    reason: 希伯来语פִּיפִיּוֹת与“口、刃”相关，其具体数目及切割构件的形制不确定。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是强调并引人注意的篇章标记；“看哪”保留先知话语的庄重和力度，也符合现代中文圣经语体。
- source_word: שַׂמְתִּיךְ
  choice: 我使你成为
  rationale: שׂוּם在此与לְמוֹרַג构成结果性表述，指使受话者成为一种器具；中文用“使你成为”自然地表达这一转变。
- source_word: לְמוֹרַג
  choice: 一具……碾谷器
  rationale: מוֹרַג指用于碾压、脱粒的农具。中文“碾谷器”既具体又不把其构造限定为某一种木橇形式；量词“具”适合器械。
- source_word: חָרוּץ חָדָשׁ
  choice: 崭新、锋利
  rationale: חָדָשׁ意为“新的”，חָרוּץ在此描述碾谷器的锐利切割性能；调整为自然中文修饰次序。
- source_word: בַּעַל פִּיפִיּוֹת
  choice: 有许多刃齿
  rationale: בַּעַל表示“具有”，פִּיפִיּוֹת字面与“口、刃”有关，其具体形制并不完全确定。“刃齿”贴合脱粒器具的切割部件，“许多”采用该复数形式的常见语境理解，同时以脚注保留其他可能。
- source_word: תָּדוּשׁ הָרִים
  choice: 你要碾碎群山
  rationale: דּוּשׁ是“打谷、碾谷”，在以山为宾语的比喻中，“碾碎”既保留农业动作，又符合中文搭配；“群山”自然表达复数הָרִים。
- source_word: וְתָדֹק
  choice: 把它们压得粉碎
  rationale: דקק表达压碎、使之细小；补出承接“群山”的代词，以清楚呈现宾语关系。
- source_word: וּגְבָעוֹת כַּמֹּץ תָּשִׂים
  choice: 使丘陵如同糠秕
  rationale: 保留“丘陵—糠秕”的诗歌比喻和平行结构；שׂוּם在此有造成某种结果之意。
theological_decisions:
- issue: 群山和丘陵所指的比喻意义
  choice: 正文保留具体的农业和地貌意象，不解释为敌国、权势或障碍。
  alternative: 将“群山、丘陵”直接意译为强敌、列国或重大障碍。
  rationale: 希伯来文本本节并未明说这些意象的具体所指；保留原有比喻可避免超出文本而消解其诗意及神学张力。
- issue: 受话者成为碾谷器的表达
  choice: 译作“我使你成为”，呈现上帝主动赋予能力和身份的语气。
  alternative: 译作“我把你安置为”或仅译“你是”。
  rationale: שׂוּם既可指安置，也可指使之成为；此处结果性比喻以“使……成为”最能体现动作，同时不额外界定这种改变的性质。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“看哪”保留先知宣告的力度；“碾谷器、刃齿、糠秕”维持古代农业意象，但句法按现代中文组织。
