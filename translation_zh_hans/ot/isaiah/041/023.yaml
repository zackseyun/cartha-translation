source:
  edition: WLC
  text: הַגִּ֨ידוּ֙ הָ/אֹתִיּ֣וֹת לְ/אָח֔וֹר וְ/נֵ֣דְעָ֔ה כִּ֥י אֱלֹהִ֖ים אַתֶּ֑ם אַף תֵּיטִ֣יבוּ וְ/תָרֵ֔עוּ וְ/נִשְׁתָּ֖עָה ו/נרא יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/023.yaml
  text: Declare to us the things to come afterward[a], that we may know that you are gods; indeed, do good or do harm[c][b], that we may be dismayed and see together.
translation:
  language: zh_hans
  text: 你们要宣告后来要发生的事[a]，好让我们知道你们是神明；也施福或降祸[b]，好让我们一同惊骇[c]、观看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“后来的事”。这个希伯来语说法指随后来到的事；在这里，是挑战它们预告未来。
    reason: lexical_alternative
  - marker: b
    text: 直译也可作“行善和作恶”。这里的意思是挑战它们显出任何真实能力，无论使人得益还是受害。
    reason: lexical_alternative
  - marker: c
    text: 译作“惊骇”的动词十分罕见，也可能有“敬畏地观看”或“惊慌地四下张望”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: 宣告
  rationale: 复数命令式，要求受挑战者公开说出未知之事；“宣告”既保留正式的挑战语气，也符合先知文体。
- source_word: הָאֹתִיּוֹת לְאָחוֹר
  choice: 后来要发生的事
  rationale: 原文可直译为“后来的事”，在本段语境中指尚未来到的事，即要求偶像预告未来；此译明确表达时间指向，同时在脚注保留较字面的译法。
- source_word: וְנֵדְעָה
  choice: 好让我们知道
  rationale: 第一人称复数鼓励式接在命令之后，可表达目的或结果；“好让我们知道”自然呈现这种语气。
- source_word: כִּי אֱלֹהִים אַתֶּם
  choice: 你们是神明
  rationale: 第二人称复数所指的是受讥讽和挑战的诸偶像；现代汉语“神明”可作类称，与“你们”搭配自然，又不误译为独一上帝。
- source_word: אַף
  choice: 来吧
  rationale: 该词在此加强挑战语气。汉语“来吧”比机械译作“甚至”更自然地呈现讥讽性的催促，同时不增加实质命题。
- source_word: תֵּיטִיבוּ וְתָרֵעוּ
  choice: 施福或降祸
  rationale: 两个使役动词构成涵盖两端的挑战，要求偶像显出任何实际能力，无论使人得益还是受害；“施福或降祸”避免把重点缩减为道德品行。
- source_word: וְנִשְׁתָּעָה
  choice: 惊骇
  rationale: 这是罕见词形，语境可能表示因威力显现而惊惧、震愕或带着畏惧观看；正文采用“惊骇”，脚注保留其不确定性。
- source_word: וְנִרְאֶה
  choice: 观看
  rationale: 按马所拉读法理解为第一人称复数“我们观看”。原文没有明说宾语，因此中文也不补出“这事”。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 直接表达众观察者共同作出反应；置于两个并列动词之前，使其自然地统摄“惊骇、观看”。
theological_decisions:
- issue: 在针对偶像的讥讽中如何翻译 אֱלֹהִים
  choice: 神明
  alternative: 诸神；神；神圣的存在
  rationale: 原文以复数“你们”向偶像发出挑战，意在让它们证明自己确有神性能力。译作“神明”既保留所谓神祇的类别意义，也避免误导读者把此处理解为独一上帝。
- issue: “施福或降祸”是否表示上帝认可偶像有能力
  choice: 保留挑战式表述，不另加否定语
  alternative: 译成“你们若真有本事，就施福或降祸”
  rationale: 经文本身以讥讽挑战揭露偶像无能，但本节没有明说条件句或否定句。正文不把语境中的结论提前写入，以保留修辞张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“宣告”“神明”“施福或降祸”保持先知审判言辞的正式感；“来吧”呈现原文带讥讽的挑战语气。句法分为两句，便于普通读者把握两重挑战，同时保留原文目的句和末尾共同反应的结构。
