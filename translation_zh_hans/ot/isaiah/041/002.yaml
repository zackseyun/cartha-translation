source:
  edition: WLC
  text: מִ֤י הֵעִיר֙ מִ/מִּזְרָ֔ח צֶ֖דֶק יִקְרָאֵ֣/הוּ לְ/רַגְל֑/וֹ יִתֵּ֨ן לְ/פָנָ֤י/ו גּוֹיִם֙ וּ/מְלָכִ֣ים יַ֔רְדְּ יִתֵּ֤ן כֶּֽ/עָפָר֙ חַרְבּ֔/וֹ כְּ/קַ֥שׁ נִדָּ֖ף קַשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/002.yaml
  text: Who has stirred up one from the east[a], calling him in righteousness to his feet? He gives nations before him and subdues kings; he gives them like dust to his sword[b], like driven stubble to his bow.
translation:
  language: zh_hans
  text: 谁从东方兴起一人，以公义召他到自己脚前[a]？他把列国交在那人面前，使他制伏君王[b]；他使他们在那人的刀下如尘土，在那人的弓前如被风吹散的碎秸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以胜利（或正义）召他随从自己。”原文这一短语较难确定；“公义”在这里也可能含伸冤、正当理由或得胜之意。
    reason: lexical_alternative
  - marker: b
    text: 本句原文的词形和句法较难确定；也可理解为“使君王降服在他面前”或“使他践踏君王”。
    reason: alternative_reading
lexical_decisions:
- source_word: הֵעִיר
  choice: 兴起
  rationale: 此处使役形表达唤起、激发某人采取行动；“兴起”自然庄重，并保留上帝使此人登场行动的含义。
- source_word: מִמִּזְרָח
  choice: 从东方
  rationale: 原词字面涉及日出之地，通常指东方；“从东方”是现代汉语中自然的地理表达。
- source_word: צֶדֶק
  choice: 以公义
  rationale: צֶדֶק可指公义、正义，也可在此语境含得胜或伸冤之意；正文保留其核心词义，脚注说明其他可能。
- source_word: יִקְרָאֵהוּ לְרַגְלוֹ
  choice: 召他到自己脚前
  rationale: 希伯来语句法困难；“到自己脚前”保留原文“脚”的意象及随从、听命的可能含义，避免在正文中过度解释。
- source_word: יִתֵּן לְפָנָיו גּוֹיִם
  choice: 把列国交在那人面前
  rationale: נתן与“在他面前”连用，语境中表示交付或置于征服者面前；“交在……面前”既贴近原文又清楚自然。
- source_word: וּמְלָכִים יַרְדְּ
  choice: 使他制伏君王
  rationale: 马所拉经文此处在词形和句法上都较困难；征服语境支持“制伏君王”，但脚注保留其他理解。
- source_word: יִתֵּן כֶּעָפָר חַרְבּוֹ
  choice: 使他们在那人的刀下如尘土
  rationale: 原文将被击败的列国和君王比作尘土，并与征服者的刀相联；汉语补出“他们”并用“刀下”清楚表达关系。
- source_word: כְּקַשׁ נִדָּף קַשְׁתּוֹ
  choice: 在他的弓前如被风吹散的碎秸
  rationale: קַשׁ指秸秆、碎秸，נִדָּף表示被驱散或吹散；译文保留农业意象及与前句尘土的平行。
theological_decisions:
- issue: 从东方而来者的身份
  choice: 正文不指明其姓名
  alternative: 居鲁士、亚伯拉罕，或上帝所兴起的理想化征服者
  rationale: 本节本身没有明确说出此人的身份；正文不加入姓名，以保留经文本身开放的指向。
- issue: צֶדֶק在呼召语句中的意义
  choice: 译作“以公义”
  alternative: “以胜利”或“按正义”
  rationale: 该词既可保持道德与司法层面的“公义”，在此也可能含伸冤、得胜之意；正文不把它单一化为军事胜利。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“兴起”“列国”“制伏”等词保持先知书语体；以“那人”明确代词所指，避免汉语中“他”连续出现造成歧义。所有解释性补充均受原文语境约束。
