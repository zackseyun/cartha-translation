  text: מִֽי פָעַ֣ל וְ/עָשָׂ֔ה קֹרֵ֥א הַ/דֹּר֖וֹת מֵ/רֹ֑אשׁ אֲנִ֤י יְהוָה֙ רִאשׁ֔וֹן וְ/אֶת אַחֲרֹנִ֖ים אֲנִי הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/004.yaml
  text: Who has acted and done this[a], calling the generations from the beginning? I, Yahweh, am the first, and with the last ones—I am he.
translation:
  language: zh_hans
  text: '是谁施行并成就了这一切，从起初召唤历代？


    我，耶和华，是首先的；

    我与末后的人同在；我就是那一位。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来文的连接方式简略而有歧义。也可较直译为：“与末后的人，我就是那一位。”有人按传统理解译作：“我是末后的。”
    reason: 保留 וְאֶת אַחֲרֹנִים 的句法与意义歧义，说明正文“与末后的人同在”补出了汉语所需的谓语关系。
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 以疑问代词引出反问，追问谁是历史行动背后的主宰。
- source_word: פָעַל וְעָשָׂה
  choice: 行事并成就这一切
  rationale: 保留两个并列动词所表达的行动与实现；“这一切”由上文所述的历史事件补出，使现代汉语语意完整。
- source_word: קֹרֵא
  choice: 召唤
  rationale: 分词表达持续或一贯的行动；“召唤”兼顾发出呼召与主权性地使历代登场的语境。
- source_word: הַדֹּרוֹת
  choice: 历代
  rationale: 自然表达一代接一代的历史序列，也保留复数含义。
- source_word: מֵרֹאשׁ
  choice: 从起初
  rationale: 按时间义理解，指从历史的开端。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的音译呈现以色列上帝的专名，不用称号替代。
- source_word: רִאשׁוֹן
  choice: 首先的
  rationale: 保留谓语形容词的形式，表达上帝在一切之先。
- source_word: וְאֶת אַחֲרֹנִים
  choice: 与末后的人同在的
  rationale: 将这里较难确定的 אֵת 理解为“与……同在”，并以“末后的人”保留希伯来文复数。
- source_word: אֲנִי הוּא
  choice: 我就是那一位
  rationale: 保留以赛亚书中简洁而有分量的自我认定公式，避免把它扩展成未明说的教义命题。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文以现代中文圣经传统中最广为人知的专名音译呈现，而不是译作“主”。
- issue: וְאֶת אַחֲרֹנִים 所表达的关系
  choice: 与末后的人同在
  alternative: 我是末后的／直到末后我仍是那一位
  rationale: 此结构简略且解释不一。正文保留 אֲחֲרֹנִים 的复数，并采用 אֵת 表伴随的可能读法；脚注说明另一种理解，不把歧义暗中消除。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“行事并成就”保留原文双动词，“历代”简洁呈现连续世代；末句略带原文的凝练与张力，并以脚注交代真实歧义。
