  naturalness: “属乌有”在此搭配生硬；“选择你们的，实为可憎”虽可理解，但省略中心词后略显文言化且语法指向不够明确。修订为现代庄重书面语，保持先知性语气。
  terminology: 以“虚无”对应 אַיִן，并以“比虚无还不如”表达 אָפַע 在本语境中通常所理解的强化贬抑；脚注说明该罕见词的词义不确定。以“可憎的”传达 תּוֹעֵבָה 的强烈厌弃判断，而不额外加入教派性解释。
