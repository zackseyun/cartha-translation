  text: הֵן אַתֶּ֣ם מֵ/אַ֔יִן וּ/פָעָלְ/כֶ֖ם מֵ/אָ֑פַע תּוֹעֵבָ֖ה יִבְחַ֥ר בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/024.yaml
  text: Look[a], you are from nothing, and your work is from nonexistence; whoever chooses you is an abomination.
translation:
  language: zh_hans
  text: 看哪，你们不过是虚无；你们的作为比虚无还不如[a]。选择你们的人是可憎的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比虚无还不如”所对应的希伯来词十分罕见，词义不确定；也可理解为“虚无”或“无有”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 作为指示兼感叹词，引出强调性的宣告；“看哪”庄重而清楚，保留先知话语的力度。
- source_word: מֵאַיִן
  choice: 本是虚无
  rationale: 字面带“从无而来”的形式，但本段是在断言偶像毫无实质与价值；“本是虚无”既保留介词结构的意味，也符合自然汉语。
- source_word: וּפָעָלְכֶם
  choice: 你们的作为
  rationale: 可指这些偶像所做之事、功效或成果；“作为”保持范围宽广，并与前句形成平行。
- source_word: מֵאָפַע
  choice: 属乌有
  rationale: 该词罕见且词义难定；按其与מֵאַיִן的平行关系，译作“属乌有”，表达全然不存在或毫无实效，同时以脚注保留不确定性。
- source_word: תּוֹעֵבָה
  choice: 可憎
  rationale: 这是表达强烈厌恶与宗教性排斥的词；“可憎”在现代中文中庄重有力，又不显累赘。
- source_word: יִבְחַר בָּכֶם
  choice: 选择你们的
  rationale: 该单数动词配合介词，意为选择、拣选这些偶像；用“选择你们的”自然表达泛指的单数主体。
theological_decisions:
- issue: 第二人称复数所指
  choice: 直译为“你们”，理解为上下文中受责问的偶像或诸神。
  alternative: 也可借代指制造偶像的人。
  rationale: 邻近经文向列国的神明发出挑战，而本节末句另行谴责选择它们的人；保留代词可避免把解释直接写入正文。
- issue: 末句“可憎”的语法归属
  choice: 将选择偶像的人断定为“可憎”。
  alternative: 可理解为“选择你们，是可憎之事”。
  rationale: 希伯来语以“可憎”置于句首，随后是“选择你们的”这一泛指分词式表达；译文保留对选择者的直接判断，同时承认另一种偏行为性的理解。
translation_notes:
  register: 采用现代标准普通话的庄重书面语。“虚无／乌有”保留原文平行而递进的修辞；全句简洁有力，符合先知对偶像的讥刺与裁断。
