revisions:
- from: 看哪[a]，你们本是虚无，你们的作为也属乌有；选择你们的，实为可憎。
  to: 看哪，你们不过是虚无；你们的作为比虚无还不如[a]。选择你们的人是可憎的。
  rationale: 修订消除了“属乌有”的不自然搭配，按上下文及原文两个否定短语的平行与强化关系，译出“虚无／比虚无还不如”的递进。脚注紧邻所涉罕见词的译文，保留其词义争议。末句补出“人”，明确可憎的是选择偶像者，未改变原文的泛指语气或加入解释。
