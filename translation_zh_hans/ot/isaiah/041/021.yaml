  text: קָרְב֥וּ רִֽיבְ/כֶ֖ם יֹאמַ֣ר יְהוָ֑ה הַגִּ֨ישׁוּ֙ עֲצֻמ֣וֹתֵי/כֶ֔ם יֹאמַ֖ר מֶ֥לֶךְ יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/021.yaml
  text: Present your case,” says Yahweh[c][b][a]; “bring forward your strong arguments,” says the King of Jacob.
translation:
  language: zh_hans
  text: “呈上你们的案件吧！”雅威说[a]；“提出你们有力的论据[b]吧！”雅各的王说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 YHWH 的音译；中文传统也译作“耶和华”或“上主”。
    reason: alternative_reading
  - marker: b
    text: “有力的论据”也可译作“充分的理由”、“证据”或“辩词”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבוּ רִיבְכֶם
  choice: 把你们的案情呈上来吧
  rationale: קָרְבוּ 字面为“靠近／使之靠近”，与 רִיב“争讼、案件”连用时构成法庭式传召。译作“把案情呈上来”既保留命令语气，也自然传达司法语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 音译为“雅威”，并以脚注说明传统译法，避免把专名无提示地替换为称号。
- source_word: הַגִּישׁוּ
  choice: 提出
  rationale: 该使役命令式意为“使靠近、呈上”。在论辩和审理语境中，“提出”与“论据”搭配自然。
- source_word: עֲצֻמוֹתֵיכֶם
  choice: 你们有力的论据
  rationale: 此词在本句中指支持己方主张的有力理由、根据或辩词，而非身体力量；“有力的论据”保留了词中的强度意味及法庭色彩。
- source_word: מֶלֶךְ יַעֲקֹב
  choice: 雅各的王
  rationale: 直译该属格结构，保留“雅各”这一原文专名及其盟约群体意涵，不改释为“以色列”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。正文采用接近 YHWH 常见学术复原读音的“雅威”，脚注交代中文传统常译“耶和华”或“上主”。
- issue: 本节的司法意象
  choice: 用“案情、呈上、论据”明确表达法庭式挑战
  alternative: 按空间义直译为“让你们的争讼靠近……使你们的强项靠近”
  rationale: 上下文是对敌对声索者的审问与挑战；司法措辞表达希伯来习语的实际功能，同时不替读者裁定对方论据的内容或有效性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以直接引语保留两次“说”的法庭宣告节奏。“吧”使两个命令句在现代汉语中自然，同时仍保持公开传召和挑战的力度。
