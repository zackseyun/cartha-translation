  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַחֲרִ֤ישׁוּ אֵלַ/י֙ אִיִּ֔ים וּ/לְאֻמִּ֖ים יַחֲלִ֣יפוּ כֹ֑חַ יִגְּשׁוּ֙ אָ֣ז יְדַבֵּ֔רוּ יַחְדָּ֖ו לַ/מִּשְׁפָּ֥ט נִקְרָֽבָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/001.yaml
  text: Be silent before me[a], coastlands; let the peoples renew their strength. Let them come near; then let them speak[c][b]. Together let us draw near for judgment.
translation:
  language: zh_hans
  text: 沿海各地[a]啊，要在我面前静默！众民要重新得力[b]。让他们近前来，然后让他们说话；让我们一同近前，赴审[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众海岛”或“远方海岸”；希伯来语这个词常泛指海岛、沿海地区或远方海域之地。
    reason: lexical_alternative
  - marker: b
    text: 或译“获得新的力量”；希伯来语这个表达字面涉及更换或更新力量。
    reason: lexical_alternative
  - marker: c
    text: 原文作“让我们一同为审判近前来”，呈现法律争讼或法庭审理的场景；但没有明确界定各方在审理中的具体角色。
    reason: cultural_note
lexical_decisions:
- source_word: הַחֲרִישׁוּ אֵלַי
  choice: 要在我面前静默
  rationale: הַחֲרִישׁוּ是复数命令式，要求听审者安静；אֵלַי字面为“向着我”，在法庭式传唤语境中译作“在我面前”较符合现代汉语，同时不增添原文没有明说的“听从”。
- source_word: אִיִּים
  choice: 沿海各地
  rationale: 该词既可指岛屿，也常在《以赛亚书》中泛指海岛、海岸及远方海域之地。“沿海各地”能体现其广泛地理范围，又避免仅限于孤立岛屿。
- source_word: וּלְאֻמִּים
  choice: 众民
  rationale: לְאֻמִּים指多个民族或民众群体。“众民”简洁庄重，并保留复数及群体含义。
- source_word: יַחֲלִיפוּ כֹחַ
  choice: 要重新得力
  rationale: חלף与כח构成的表达指力量得到更新或替换。“重新得力”是自然的现代汉语，也保留召集各民蓄力应诉的语境。
- source_word: יִגְּשׁוּ
  choice: 让他们近前来
  rationale: 此处未完成式具有祈使、命令语气；“让他们近前来”保留法庭传唤的语势。
- source_word: אָז יְדַבֵּרוּ
  choice: 然后让他们说话
  rationale: אָז标明行动次序；יְדַבֵּרוּ本义为“说话”。译文不把它扩写为“陈述案情”，使诉讼意味由上下文呈现。
- source_word: יַחְדָּו לַמִּשְׁפָּט נִקְרָבָה
  choice: 让我们一同近前，接受审理
  rationale: נִקְרָבָה是第一人称复数鼓励式，译作“让我们……近前”；לַמִּשְׁפָּט在这里具有司法、裁断含义。“接受审理”使汉语通顺，并由脚注保留其较直译的表达。
theological_decisions:
- issue: 本节的司法或法庭背景
  choice: 按神向列邦发出的法律性传唤来翻译，但不把“说话”扩译为“申诉”或“陈述案情”。
  alternative: 只理解为一般性的聆听呼召，或明确意译为“到法庭上来辩论”。
  rationale: “静默—得力—近前—说话—审理”的连续动作明显带有司法争辩场景；译文呈现这一背景，同时避免超过希伯来文本的明确程度。
- issue: 说话者是否也处于受审位置
  choice: 保留第一人称复数“让我们一同近前”，不解释说话者在审理中的具体角色。
  alternative: 将说话者明确处理为法官，或将列邦单独处理为受审者。
  rationale: נִקְרָבָה明确包含说话者，而לַמִּשְׁפָּט没有完全界定各方在司法过程中的角色；因此不应在译文中消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“静默”“众民”“近前”等词保留先知性宣告和正式传唤的语体；句式按希伯来文的行动次序推进。所有脚注标记均置于相关主文之后。
