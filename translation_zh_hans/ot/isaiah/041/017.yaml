source:
  edition: WLC
  text: הָ/עֲנִיִּ֨ים וְ/הָ/אֶבְיוֹנִ֜ים מְבַקְשִׁ֥ים מַ֨יִם֙ וָ/אַ֔יִן לְשׁוֹנָ֖/ם בַּ/צָּמָ֣א נָשָׁ֑תָּה אֲנִ֤י יְהוָה֙ אֶעֱנֵ֔/ם אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֹ֥א אֶעֶזְבֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/017.yaml
  text: The poor and needy seek water[a], but there is none; their tongue is parched with thirst. I, Yahweh, will answer them; I, the God of Israel, will not forsake them.
translation:
  language: zh_hans
  text: 贫穷人和穷乏人寻找水，却没有水；他们的舌头因干渴而枯干。我，雅威[a]，必回应他们；我，以色列的上帝，必不离弃他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为יהוה（YHWH），是上帝的专名；中文也常音译作“耶和华”。
    reason: 说明神名的原文形式及常见替代译法。
lexical_decisions:
- source_word: הָעֲנִיִּים
  choice: 困苦人
  rationale: עָנִי可指贫穷、受苦或受压迫的人；“困苦人”保留其苦难层面，也不把含义限缩为单纯经济贫困。
- source_word: וְהָאֶבְיוֹנִים
  choice: 和穷乏人
  rationale: אֶבְיוֹן指缺乏生活所需、处于匮乏中的人；“穷乏人”与“困苦人”形成自然的诗歌平行，又保留二词的区别。
- source_word: מְבַקְשִׁים מַיִם
  choice: 寻找水
  rationale: 分词描写持续而迫切的行动；现代汉语用“寻找水”简洁自然。
- source_word: וָאַיִן
  choice: 却一无所有
  rationale: אַיִן表示所寻找之物不存在；此处承接“水”，译文以转折表达绝望处境，同时避免机械重复。
- source_word: לְשׁוֹנָם בַּצָּמָא נָשָׁתָּה
  choice: 他们的舌头因干渴而枯干
  rationale: 保留希伯来语集合单数“舌头”的身体意象；נָשָׁתָּה表示干涸、枯干，“因干渴而枯干”清楚表达原因及严重程度。
- source_word: אֲנִי יְהוָה
  choice: 我—雅威—
  rationale: 独立代词אֲנִי具有强调作用，因此用插入同位结构呈现。“雅威”按四字神名的可能读音音译，保留这是专名而非头衔。
- source_word: אֶעֱנֵם
  choice: 必应允他们
  rationale: ענה在此表示回答、回应；“应允”既适合他们在困境中求助的语境，也保持庄重，但不额外说明回应的具体方式。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 我—以色列的上帝—
  rationale: 该短语与前面的神圣自称平行；补出“我”并采用同位结构，使汉语清楚呈现原文的强调和平行。
- source_word: לֹא אֶעֶזְבֵם
  choice: 必不离弃他们
  rationale: עזב可表示离开、抛弃；“离弃”保留关系和立约语境中的分量，同时仍为现代读者熟悉。
theological_decisions:
- issue: 神圣四字名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用יהוה。正文采用“雅威”以表明这是以色列上帝的专名；脚注交代希伯来文字母形式及中文常见的另一音译，不把不确定的古代元音读法说成毫无争议。
- issue: “应允他们”所指的对象
  choice: 保留“他们”，不补出祷告或呼求
  alternative: 垂听他们的祷告；回应他们的呼求
  rationale: 上下文只明说他们寻找水，并未在本节明确写出祷告或呼求；不补充可避免替原文消除其含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留希伯来诗歌的两组平行结构，并以破折号呈现两次强调性的神圣自称。
