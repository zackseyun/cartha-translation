  naturalness: “困苦人和穷乏人”可理解，但“贫穷人和穷乏人”更贴近本节在这组平行语中的匮乏含义。以破折号夹注“我—雅威—”在现代普通话经文中略显突兀；逗号同位语更自然、庄重。
