base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/028.yaml
  text: And I looked[a], but there was no man; among these there was no counselor, that I might ask them[b] and they would answer a word.
translation:
  language: zh_hans
  text: 我察看，却没有一个人[a]；这些当中，也没有一个谋士，使我可以询问他们，而他们能回答一句话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一个人”也可译作“谁”。原文用阳性单数“人”，在这里可代表任何人。
    reason: lexical_alternative
  - marker: b
    text: “回答一句话”也可译作“作出任何回答”；原文直译为“回答一句话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרֶא
  choice: 我察看
  rationale: ראה的第一人称单数未完成式在先知话语中可叙述过去的察看，也可形成生动的观察。“察看”保留主动审视的意味，并符合上下文中对偶像及其回应者的检视。
- source_word: וְאֵין אִישׁ
  choice: 却没有一个人
  rationale: אִישׁ为阳性单数“人、男人”，此处具有代表性，意思是找不到任何能作回应的人。汉语“没有一个人”自然地保留单数形式及全然无人之意，并不额外限定为成年男性。
- source_word: וּמֵאֵלֶּה
  choice: 这些当中
  rationale: 介词מִן在此宜按部分义理解，表示在刚才受检视的“这些”之中。译文不明说“这些”究竟专指偶像、其代言者，还是更广泛的对象，以保留原文指称的含蓄。
- source_word: וְאֵין יוֹעֵץ
  choice: 也没有一个谋士
  rationale: יוֹעֵץ是יעץ的主动分词作名词，指提出谋略或意见的人。“谋士”简洁、庄重，并保留其实词性质。
- source_word: וְאֶשְׁאָלֵם
  choice: 好让我询问他们
  rationale: 带连接词的未完成式在此可表达预期、可能或目的，而不必解作已经发生的过去动作。“好让我”保留这种潜在或目的意味；复数宾语后缀译为“他们”。
- source_word: וְיָשִׁיבוּ דָבָר
  choice: 由他们回答一句话
  rationale: שוב的使役式在此表示回答、作出回应；דָבָר字面为“话、言语”。译作“回答一句话”保留希伯来文简短而带讽刺性的表达。
theological_decisions:
- issue: “这些”及“谋士”的所指
  choice: 不在正文中具体指明，仅译作“这些当中”和“谋士”
  alternative: 明确译为偶像及其代言人，或泛指列国及其神明
  rationale: 以赛亚书41:21—29的直接语境是对偶像发出的法庭式挑战，但原句本身只说“这些”。保留代词可避免把语境推断写进正文，并维持指称范围可能存在的张力。
- issue: אִישׁ的性别与代表性用法
  choice: 没有一个人
  alternative: 没有一个男人；没有谁
  rationale: 该词在形式上是阳性单数，但此处主要表达“没有任何人能回应”。现代汉语“人”既忠实于词义，也保留其代表性功能；译成“男人”会在本句中加入原语境未必强调的性别限制。
- issue: 末句动作的时态和情态
  choice: 按潜在或目的关系译为“好让我询问他们，由他们回答……”
  alternative: 按过去叙事译为“我问他们，他们便回答……”
  rationale: 未完成式连用容许目的、预期或可能的理解；上下文强调根本找不到能受询并回答者。采用情态表达，避免把动作明确处理为已经实际发生。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“察看”“谋士”“询问”保持先知性法庭语境的正式感；句法尽量贴近原文的连续分句，同时用“好让”“由”使潜在关系在汉语中清楚自然。所有脚注标记均置于对应正文之后。
