  source_fidelity: 译文准确传达了希伯来文的宣告性语气、敌对者的羞辱、归于无有及灭亡的两组结果。‘所有向你发怒的人’对应 כָּל־הַנֶּחֱרִים בָּךְ；‘必蒙羞受辱’保留了 בוש 与 כלם 的并列递进；‘必变得如同无有’恰当保留 יִהְיוּ 的将来/结果意味及 כְ 的比较意味；末句也保留了 ריב 的争讼、争执色彩。
