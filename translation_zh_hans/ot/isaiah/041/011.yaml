  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵ֤ן יֵבֹ֨שׁוּ֙ וְ/יִכָּ֣לְמ֔וּ כֹּ֖ל הַ/נֶּחֱרִ֣ים בָּ֑/ךְ יִֽהְי֥וּ כְ/אַ֛יִן וְ/יֹאבְד֖וּ אַנְשֵׁ֥י רִיבֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/011.yaml
  text: Behold[a], all who are enraged against you will be put to shame and humiliated; they will become as nothing, and the men who contend with you will perish.
translation:
  language: zh_hans
  text: 看哪，所有向你发怒的人都必蒙羞受辱；他们必变得如同无有，与你争讼的人必灭亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 作为引人注意并带有确定语气的话语标记，“看哪”保留了先知宣告的力度，也符合现代庄重汉语。
- source_word: יֵבֹשׁוּ וְיִכָּלְמוּ
  choice: 必蒙羞受辱
  rationale: 分别表达两个相近而递进的动词：בוש 指蒙羞，כלם 的尼法勒式指受辱；不将两者合并为一个概念。
- source_word: כֹּל הַנֶּחֱרִים בָּךְ
  choice: 所有向你发怒的人
  rationale: חרה 的分词字面含有“燃烧”意象，在此惯用地指强烈愤怒；“向你发怒”自然表达 ב 的敌对指向，同时避免在正文中过度强化。
- source_word: יִהְיוּ כְאַיִן
  choice: 他们必变得如同无有
  rationale: 保留 יִהְיוּ 的将来变化意味和 כְּ 的比较成分；“如同无有”体现其成为无足轻重、归于虚无的表达。
- source_word: וְיֹאבְדוּ
  choice: 必灭亡
  rationale: אבד 的 Qal 在此是不及物的“灭亡、消失”，用“必灭亡”简洁保留其语态与确定性。
- source_word: אַנְשֵׁי רִיבֶךָ
  choice: 与你争讼的人
  rationale: ריב 可指争执，也带有诉讼、争讼色彩；此译法保留冲突和法律语义。虽 אַנְשֵׁי 字面为“人们/男子”，现代汉语“人”通常不标性别，若译作“男人”会造成原文语境未必要求的性别强调。
theological_decisions:
- issue: אַנְשֵׁי רִיבֶךָ 中阳性名词的表达
  choice: 与你争讼的人
  alternative: 与你争讼的男人
  rationale: 希伯来语 אַנְשֵׁי 在构词上为阳性复数，但也可在群体表达中泛指相关的人。现代汉语以“人”自然传达该群体，不额外断定敌对者仅限男性，也不削弱其人格性。
- issue: יִהְיוּ כְאַיִן 所表达的结局
  choice: 变得如同无有
  alternative: 化为乌有
  rationale: 保留比较词 כְּ“如同”，不把经文明确化为绝对本体性的不存在；这样维持原文在彻底败落、失去效力与归于无有之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”保留原文话语标记；全句两组并列结果清晰，使用“必”体现未完成式在预言语境中的确定将来意义。
