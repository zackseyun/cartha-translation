  terminology: ‘蒙羞受辱’、‘无有’、‘争讼’与‘灭亡’在此语境中用语准确。将 אַנְשֵׁי 译为‘人’在现代汉语中自然，不会无根据地把对象限定为男性，也未改变其作为敌对群体的指称。
