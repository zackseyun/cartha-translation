  text: יִרְדְּפֵ֖/ם יַעֲב֣וֹר שָׁל֑וֹם אֹ֥רַח בְּ/רַגְלָ֖י/ו לֹ֥א יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/003.yaml
  text: He pursues them and passes on safely[a], by a path his feet had not traveled.
translation:
  language: zh_hans
  text: 他追赶他们，安然前行[a]，沿着一条他的脚未曾踏过的路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他追赶他们，平安经过；沿着一条他的脚未曾踏过的路。”希伯来文末句较难理解，可能强调他安然无阻地推进，也可能着重说明他走的是一条未曾走过的路。
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְדְּפֵם
  choice: 他追赶他们
  rationale: 这是动词 רדף 的 Qal 未完成式第三人称阳性单数，带第三人称阳性复数后缀。此处采用叙事性的现在表达，既保留动作的鲜明感，也保留追击敌人的含义。
- source_word: יַעֲבוֹר
  choice: 前行
  rationale: עבר 的基本义是“经过、越过”。结合征服者持续推进的语境，“前行”自然表达他追赶之后继续向前，又不限定他具体越过什么。
- source_word: שָׁלוֹם
  choice: 安然
  rationale: שָׁלוֹם 字面可译“平安”，在这里作方式或结果用，表示推进时不受阻挡、安然无恙。“安然”既自然，也保留平安稳妥的意味。
- source_word: אֹרַח
  choice: 路
  rationale: אֹרַח 指道路、路径或行迹；译作“路”简洁自然，并与后面的“双脚未曾走过”形成具体的行路意象。
- source_word: בְּרַגְלָיו
  choice: 他双脚
  rationale: 原文直译为“用／凭他的脚”。汉语在“走过”的结构中无需直译介词；“他双脚”保留原文身体行走的具体意象。
- source_word: לֹא יָבוֹא
  choice: 未曾走过
  rationale: 字面为“不来／不进入”，但与“路”和“双脚”连用时，较自然地指他的脚从未走过那条路。“未曾走过”使压缩的希伯来表达在现代汉语中清楚可懂，同时在脚注中保留其难解性。
theological_decisions:
- issue: 末句 אֹרַח בְּרַגְלָיו לֹא יָבוֹא 的理解
  choice: 征服者沿着自己双脚未曾走过的路推进
  alternative: 他的脚不触及道路而前进；或按更贴近字面的结构译为“他双脚不曾进入的路”
  rationale: 希伯来文结构简短而难解。在耶和华兴起征服者、使他得胜推进的上下文中，最自然的理解是他沿着从未走过的路线迅速前进。正文保留道路与双脚的意象，不将其解释为超自然或非身体性的移动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“安然前行”表达征服者不受阻挡的推进；“他双脚未曾走过的路”保留希伯来文具体而略带张力的行路意象。脚注标记已在正文中以[a]呈现。
