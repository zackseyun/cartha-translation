  text: רָא֤וּ אִיִּים֙ וְ/יִירָ֔אוּ קְצ֥וֹת הָ/אָ֖רֶץ יֶחֱרָ֑דוּ קָרְב֖וּ וַ/יֶּאֱתָיֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/005.yaml
  text: The coastlands have seen and fear[a]; the ends of the earth tremble[b]. They draw near and come.
translation:
  language: zh_hans
  text: 沿海地区[a]看见了，便惧怕；地极战兢。他们走近，前来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众海岛”或“遥远的海岸”。
    reason: lexical_alternative
  - marker: b
    text: 原文末尾两个动词意义相近，直译为“他们走近，并且前来”，着重表现他们的移动。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיִּים
  choice: 沿海各地
  rationale: 该词在《以赛亚书》中常泛指海岛、沿海地区以及隔海的远方地域；“沿海各地”比单指地理岛屿更能保留其广泛指向，同时以脚注注明另一译法。
- source_word: רָאוּ
  choice: 看见了
  rationale: 完成式表示已经发生、并引起随后惧怕反应的看见；“看见了”在现代汉语中自然明晰。
- source_word: וְיִירָאוּ
  choice: 就惧怕
  rationale: ירא在此描述面对所见之事而产生的恐惧，不必解释为敬拜或敬畏；“就”自然呈现前后反应关系。
- source_word: קְצוֹת הָאָרֶץ
  choice: 大地的尽头
  rationale: 保留希伯来语表示世上最遥远地区的空间意象，也比“地极”更易为普通现代读者直接理解。
- source_word: יֶחֱרָדוּ
  choice: 战兢
  rationale: חרד兼有因恐惧而发抖和惊惶不安之意；“战兢”保留身体与情绪两方面的力度。
- source_word: קָרְבוּ
  choice: 他们走近
  rationale: 准确表达向某处靠近的动作，并保留原文与下一个动词构成的紧密递进。
- source_word: וַיֶּאֱתָיוּן
  choice: 前来
  rationale: 这是表示“来”的诗歌用语；“走近，前来”保留原文两个近义动作词的重复强调，而不擅自补明他们前来的目的或态度。
theological_decisions:
- issue: 远方众民回应的性质
  choice: 译为因所见而惧怕、战兢，并走近前来，但不说明这是归服、敬拜还是敌对聚集。
  alternative: 可把惧怕理解为敬畏，也可结合下文理解为众民因惊慌而联合制造偶像。
  rationale: 本节明确表达恐惧、战兢和移动，却没有直接界定他们前来的动机；译文保留这种神学与叙事张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“沿海各地”避免把 אִיִּים 过窄地限定为岛屿；“大地的尽头”保留先知文学的广阔意象；末句以简洁的近义并列再现希伯来语的诗性强调。
