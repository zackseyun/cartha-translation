base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/016.yaml
  text: You will winnow them[a], and the wind will carry them away, and the storm will scatter them; but you will rejoice in Yahweh[c][b]; in the Holy One of Israel you will boast.
translation:
  language: zh_hans
  text: 你要簸扬他们[a]，风要把他们卷走，暴风要将他们吹散；但你要因雅威[b]欢喜，以以色列的圣者为夸耀[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“扬散他们”。这里的希伯来语动词可泛指使之分散，但“簸扬”保留了上下文打粮的意象。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来文神名יהוה的音译；传统上也译作“耶和华”或以“上主”代称。
    reason: alternative_reading
  - marker: c
    text: 或译“以以色列的圣者为荣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרֵם
  choice: 你要簸扬他们
  rationale: זרה在此指簸扬、扬散谷物；结合上文打粮的意象，“簸扬”比泛指的“驱散”更具体。
- source_word: רוּחַ
  choice: 风
  rationale: 与“暴风”平行，并执行卷走碎屑的动作，故为气象意义的“风”，不是“灵”或“气息”。
- source_word: תִּשָּׂאֵם
  choice: 要把他们卷走
  rationale: נשׂא本义为抬起、携带；在风吹糠秕的图景中，“卷走”自然表达被风带离的结果。
- source_word: סְעָרָה
  choice: 暴风
  rationale: 该词指猛烈的风暴；“暴风”既体现强度，又不把词义过度限定为旋风。
- source_word: תָּפִיץ
  choice: 要将他们吹散
  rationale: פוץ的使役式表示使之分散；加入“吹”顺应暴风的主语及簸扬意象。
- source_word: תָּגִיל
  choice: 你要……欢喜
  rationale: גיל表达强烈的喜乐；现代汉语中“欢喜”自然、庄重。
- source_word: בַּיהוָה
  choice: 因雅威
  rationale: 介词ב可表达喜乐所因、所系；“因”在汉语中自然呈现以雅威为喜乐根据。神名יהוה音译为“雅威”。
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: 因以色列的圣者
  rationale: 完整保留以赛亚书的重要神圣称号，并使介词结构与前句平行。
- source_word: תִּתְהַלָּל
  choice: 夸耀
  rationale: הלל的Hitpael在此表示以某位为荣耀、以之夸口；“夸耀”保留积极的神学张力，而不误解为自我吹嘘。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的发音重构，也保留其作为专名的性质。
- issue: 以神为对象的夸口语言
  choice: 因以色列的圣者夸耀
  alternative: 以以色列的圣者为荣
  rationale: “夸耀”较直接对应Hitpael形式的הלל，保留原文积极地以神为夸口的表达；脚注提供更自然但略带解释性的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“簸扬—卷走—吹散”连贯呈现打粮与糠秕被风驱散的图景；分号保留前后转折。“夸耀”有意保存原文以神为夸口的力度，并用脚注说明自然汉语替代译法。
