language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַעִיר֤וֹתִי מִ/צָּפוֹן֙ וַ/יַּ֔את מִ/מִּזְרַח שֶׁ֖מֶשׁ יִקְרָ֣א בִ/שְׁמִ֑/י וְ/יָבֹ֤א סְגָנִים֙ כְּמוֹ חֹ֔מֶר וּ/כְמ֥וֹ יוֹצֵ֖ר יִרְמָס טִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/025.yaml
  text: I have stirred up one from the north[a], and he has come; from the rising of the sun he calls on my name. He will come upon rulers as upon clay[c][b], and like a potter he treads mud.
translation:
  language: zh_hans
  text: 我从北方兴起一人[c]，他已经来到；他从日出之地[a]呼求我的名[b]。他必临到统治者，如同临到黏土；又像陶匠一样践踏泥浆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从东方”；原文直译为“从太阳升起之处”。
    reason: lexical_alternative
  - marker: b
    text: “呼求我的名”也可译作“求告我的名”或“宣告我的名”。
    reason: lexical_alternative
  - marker: c
    text: 上帝所兴起的这一人物通常被理解为居鲁士，但本节希伯来文本没有提到他的名字。
    reason: cross_reference
lexical_decisions:
- source_word: הַעִירוֹתִי
  choice: 我……兴起
  rationale: 该词是 עור 的使役形，表示使某人起来采取行动。“兴起”自然表达上帝主动使此人登场，同时不过度说明具体方式。
- source_word: מִצָּפוֹן
  choice: 从北方
  rationale: 直接保留原文的方位表达。
- source_word: וַיַּאת
  choice: 他就来了
  rationale: 承接前面的完成式，表达上帝兴起此人后他随即来到；中文用“就”清楚呈现结果关系，又保留先知性叙述的确定感。
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: 从日出之地
  rationale: 保留原文“太阳升起之处”的形象，并让读者自然理解为东方；脚注注明常用译法。
- source_word: יִקְרָא בִשְׁמִי
  choice: 他求告我的名
  rationale: קרא בשם 可指求告、呼求或宣告某人的名。“求告我的名”保留其宗教性含义，同时不判定此人内在信仰的性质；其他可能译法列入脚注。
- source_word: וְיָבֹא
  choice: 他必临到
  rationale: 该动词在此带有逼近并制伏后续对象的语境。“临到”保留动作及威胁意味，却不额外加入原文没有明说的军事动词。
- source_word: סְגָנִים
  choice: 统治者
  rationale: 该词指高级官员或掌权者。“统治者”是清楚、现代而范围适当的表达。
- source_word: כְּמוֹ חֹמֶר
  choice: 如同临到黏土
  rationale: חֹמֶר 指陶土、黏土，也可指灰泥。此处与陶匠意象相连，译作“黏土”最为自然；补出重复的“临到”使中文比较关系清楚。
- source_word: וּכְמוֹ יוֹצֵר
  choice: 又像陶匠
  rationale: יוֹצֵר 在此指塑造陶器的人；“陶匠”简洁并准确保留比喻。
- source_word: יִרְמָס טִיט
  choice: 踩踏泥浆
  rationale: רמס 表示踩踏或践踏，טיט 指湿泥、泥浆。陶匠踩泥的画面本身也带有强力制伏的意味。
theological_decisions:
- issue: 上帝所兴起之人的身份及其对上帝之名的态度
  choice: 正文只称其为“一人”，不直接指名；将 יִקְרָא בִשְׁמִי 译为“求告我的名”，但用脚注保留其他语义可能。
  alternative: 在正文中明确称此人为居鲁士，并把该短语限定为虔诚信靠或仅仅宣告上帝的名。
  rationale: 上下文通常使人将此征服者理解为居鲁士，但本节希伯来文本没有直接提名。קרא בשם 也不足以单独判定此人是否真诚敬拜上帝。正文和脚注因此保留原文的身份留白与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“兴起”“求告”“临到”保留经文的庄严语气；“统治者”“黏土”“泥浆”则避免过度古雅。正文依原文保留方向、行动和陶匠比喻，也不把征服者的身份或信仰状态写死。
