  text: תְּבַקְשֵׁ/ם֙ וְ/לֹ֣א תִמְצָאֵ֔/ם אַנְשֵׁ֖י מַצֻּתֶ֑/ךָ יִהְי֥וּ כְ/אַ֛יִן וּ/כְ/אֶ֖פֶס אַנְשֵׁ֥י מִלְחַמְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/012.yaml
  text: You will seek them and not find them—those men who contend with you[a]. The men who wage war against you will become like nothing[b], like nonexistence.
translation:
  language: zh_hans
  text: 你要寻找他们，却找不到——那些与你争斗的人。那些与你交战的人，必变得如同无有，如同虚无。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּבַקְשֵׁם
  choice: 你寻找他们
  rationale: בקׁש 的 Piel 形式常指寻找、寻求；“寻找”与下句“找不到”自然呼应。
- source_word: וְלֹא תִמְצָאֵם
  choice: 也找不到
  rationale: מצא 的 Qal 形式意为“找到”；用“也”承接前句，既保留希伯来文的并列推进，也符合现代汉语表达。
- source_word: אַנְשֵׁי מַצֻּתֶךָ
  choice: 那些与你争斗的人
  rationale: 该短语直译为“你争斗之人”；מַצּוּת 表示争斗、争执或纷争。“与你争斗的人”保留人称对象与冲突含义，且不把它泛化为普通的“敌人”。
- source_word: יִהְיוּ
  choice: 必变得
  rationale: היה 可表示“是”或“变成”。上下文描写敌对者沦为虚无，译作“变得”更清楚地表达状态转变；“必”体现未完成式在预言语境中的确定将来。
- source_word: כְאַיִן
  choice: 如同虚无
  rationale: אַיִן 可指无、虚无或不存在；“如同虚无”保留比较前缀 כְ，并采用庄重而自然的中文。
- source_word: וּכְאֶפֶס
  choice: 如同不存在
  rationale: אֶפֶס 可表示无有、虚无或不存在。译作“如同不存在”与“如同虚无”相近而不完全重复，保留诗句递进式的平行表达。
- source_word: אַנְשֵׁי מִלְחַמְתֶּךָ
  choice: 那些与你交战的人
  rationale: 该结构直译为“你战争之人”，语境指对你发动或参与战争的人；“与你交战的人”自然明确，又不额外增添战争的发起方。
theological_decisions:
- issue: 敌对者归于无有的两个平行表达应如何呈现
  choice: 分别译为“如同虚无”和“如同不存在”
  alternative: 两处都译作“如同无有”，或意译为“彻底消失”
  rationale: 原文以 אַיִן 和 אֶפֶס 两个意义相近却不完全相同的词形成强化平行。分别译出可保留诗歌张力；同时保留“如同”的比较语气，避免把修辞性的审判宣告解释成关于形而上灭绝的明确教义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“争斗”保留 מַצּוּת 的争执和对抗含义；“交战”对应 מִלְחָמָה，形成由争斗到战争的诗意加强。破折号标明“那些与你争斗的人”是前文“他们”的同位说明。
