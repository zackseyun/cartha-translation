base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/022.yaml
  text: Hyenas will cry out in her palaces[a], and jackals in her luxurious halls. Her time is near to come[c][b], and her days will not be prolonged.
translation:
  language: zh_hans
  text: 鬣狗[a]要在她的宫殿[b]里哀号，胡狼要在她华美的殿宇中嚎叫。她的时辰快到了[c]，她的日子必不长久。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鬣狗”所译的希伯来词具体指哪一种动物并不确定，也可理解为“野兽”或“豺狼”。
    reason: lexical_alternative
  - marker: b
    text: “宫殿”处的希伯来文本较难理解；按现有元音标注，字面近于“寡妇”，但上下文及与“华美的殿宇”的平行关系表明，这里很可能指荒废的宅院或宫殿。
    reason: textual_lexical_difficulty
  - marker: c
    text: 这里把巴比伦城拟人化为女子，所以称“她的时辰”和“她的日子”。
    reason: cultural_note
lexical_decisions:
- source_word: וְעָנָה
  choice: 要……嚎叫
  rationale: ענה的基本义可为“回答、应声”，但以出没废墟的野兽为主语时，指其发出叫声；“嚎叫”自然地传达荒凉场景中的声音意象。
- source_word: אִיִּים
  choice: 鬣狗
  rationale: 该词所指的具体动物不能确定；“鬣狗”符合食腐野兽出没废墟的语境，但在脚注中保留“野兽、豺狼”等可能。
- source_word: בְּאַלְמנוֹתָיו
  choice: 在她的宫殿里
  rationale: 马所拉文本的词形按通常读法近于“在它的寡妇中”，在此语境十分费解。依据与下一短句“华美的殿宇”平行的建筑语境，正文采用“宫殿”，并以脚注说明文本难点。代词按本节后半对巴比伦的阴性拟人译为“她”。
- source_word: וְתַנִּים
  choice: 豺狼
  rationale: תנים在荒凉审判的语境中通常指豺狼一类的野兽，而非神话中的龙或海怪。
- source_word: בְּהֵיכְלֵי עֹנֶג
  choice: 在她华美的殿宇中
  rationale: היכל可指宏大的宫殿或殿宇，עֹנֶג表达享乐、华贵；“华美的殿宇”保留昔日奢华与将来荒废之间的反差。
- source_word: וְקָרוֹב לָבוֹא עִתָּהּ
  choice: 她的时辰快到了
  rationale: 贴近希伯来文的简洁表达，并保留巴比伦被拟人化为女性的形式；“时辰”在此指她受审、倾覆的时候。
- source_word: וְיָמֶיהָ לֹא יִמָּשֵׁכוּ
  choice: 她的日子必不长久
  rationale: משך的被动式在此表示“被延长”；此译自然地表达巴比伦余日无多，同时保留原文的确定语气。
theological_decisions:
- issue: “她的时辰”是否明说为毁灭之时
  choice: 正文保留“她的时辰快到了”
  alternative: “她毁灭的时候快到了”
  rationale: 原文只说“她的时辰”，语境虽明显指审判，却没有在本句明说“毁灭”；保留简洁表达可避免把解释直接写入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“嚎叫／呼号”形成声音上的平行而避免机械重复；“华美的殿宇”保留诗体色彩但不过分古雅。脚注分别保留动物名称和疑难建筑词的真实不确定性。
