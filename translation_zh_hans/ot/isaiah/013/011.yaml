source:
  edition: WLC
  text: וּ/פָקַדְתִּ֤י עַל תֵּבֵל֙ רָעָ֔ה וְ/עַל רְשָׁעִ֖ים עֲוֺנָ֑/ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן זֵדִ֔ים וְ/גַאֲוַ֥ת עָרִיצִ֖ים אַשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/011.yaml
  text: And I will punish the world for its evil[a], and the wicked for their iniquity; I will put an end to the pride of the arrogant[b], and I will humble the haughtiness of the ruthless.
translation:
  language: zh_hans
  text: 我要因世界的邪恶而惩罚世界，因恶人的罪孽而惩罚他们；我要终止狂傲人的骄傲，使残暴之人的高傲降卑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “使残暴之人的高傲降卑”也可译作“我必降卑残暴之人的高傲”。希伯来文在两个平行分句中使用两组意思相近、都表示狂妄自高的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: 我要……惩罚
  rationale: פָקַד与介词עַל连用，并以邪恶和恶人为审判对象，在此表示追究、施行惩罚；译为“惩罚”自然且明确。
- source_word: תֵּבֵל
  choice: 世界
  rationale: תֵּבֵל通常指有人居住的世界；“世界”既符合现代汉语习惯，也保留本节超出单一地域的广阔范围。
- source_word: רָעָה
  choice: 世上的邪恶
  rationale: 本词与“恶人”和“罪孽”并列，语境所指是道德上的邪恶，而非灾祸；“世上的”明确它与前面的“世界”相关。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 简洁保留希伯来语以形容词作名词、统称作恶者的用法。
- source_word: עֲוֺנָם
  choice: 他们的罪孽
  rationale: עָוֹן可指罪孽、罪责或罪的惩罚；此处是恶人受罚所因的道德过犯，“罪孽”保留其伦理分量。
- source_word: וְהִשְׁבַּתִּי
  choice: 我要止息
  rationale: שׁבת的使役式表示使之停止；“止息”简洁、庄重，并保留使其不再存在或运作的语义。
- source_word: גְּאוֹן
  choice: 骄傲
  rationale: 该词有时可指威荣，但与זֵדִים搭配时明显指负面的自我高举；“骄傲”贴合审判语境。
- source_word: זֵדִים
  choice: 狂傲人
  rationale: זֵדִים指狂妄、傲慢、放肆的人；“狂傲人”与“骄傲”形成自然搭配，并保留其强烈的道德色彩。
- source_word: וְגַאֲוַת
  choice: 高傲
  rationale: 与前句גְּאוֹן近义平行；采用“高傲”既保留重复强化，也略作词汇区分。
- source_word: עָרִיצִים
  choice: 残暴之人
  rationale: עָרִיץ常指强暴、压迫、令人畏惧的人；“残暴之人”保留其暴力和压迫性质，又不把范围限于正式掌权的暴君。
- source_word: אַשְׁפִּיל
  choice: 压低
  rationale: שׁפל的使役式本义是使之降低；“压低”保留高傲被降下的空间意象，并与前句“止息”形成平行。
theological_decisions:
- issue: תֵּבֵל所指的审判范围
  choice: 译作“世界”，指向有人居住的人类世界，不把审判范围仅限于巴比伦
  alternative: 译作“这地”，或将其专指巴比伦
  rationale: 以赛亚书13章的直接背景是针对巴比伦的宣告，但本节采用较广的תֵּבֵל，并使用“恶人”“罪孽”等普遍性的道德措辞；译文保留这种由具体历史对象延展至世界性审判的张力。
- issue: 两个骄傲意象的平行关系
  choice: 分别译为“狂傲人的骄傲”和“残暴之人的高傲”，保留两个近义平行分句
  alternative: 将两句合并为对同一群人的一次概括性陈述
  rationale: 希伯来文使用两组近义但不完全相同的词，后一句又把骄傲与残暴压迫者相连；保留平行结构，避免把两组人物和意象武断等同。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“止息”保留审判宣告的凝练语气；“压低”呈现“高傲”被降下的原文意象。分号维持原文由惩罚罪恶转向终止骄傲的两段式推进。
