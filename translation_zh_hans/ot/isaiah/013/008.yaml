base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/008.yaml
  text: They will be dismayed; pains and labor pangs will seize them[a]. They will writhe like a woman giving birth. Each man will stare at his neighbor; their faces will be faces of flame.
translation:
  language: zh_hans
  text: 他们必惊惶；剧痛和产痛必抓住他们。他们必像正在分娩的妇人一样扭动。各人都惊愕地望着同伴；他们的脸如火焰一般[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他们的脸是火焰之脸。”这幅鲜明的图像可能指脸如火燃烧、发红，也可能描写恐惧显露在脸上的样子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִבְהָלוּ
  choice: 他们必惊惶
  rationale: 该词为בהל的尼法勒式，表示突然而来的惊慌、惶恐；“惊惶”既保留其状态变化，也符合庄重的现代汉语。
- source_word: צִירִים וַחֲבָלִים
  choice: 剧痛和产痛
  rationale: 两个并列名词都指强烈痛苦，后者在随后临产比喻的语境中尤指生产阵痛；分别译出可保留希伯来文的叠加强调。
- source_word: יֹאחֵזוּן
  choice: 必抓住他们
  rationale: אחז本义为抓住、攫住。保留拟人化表达，呈现痛苦突然控制他们的形象。
- source_word: כַּיּוֹלֵדָה יְחִילוּן
  choice: 他们必像临产的妇人一样扭动
  rationale: יולדה指正在生产的妇人；יחילון在此描写生产般的痛苦与身体扭动。“临产”及“扭动”使比喻清楚，又不把动词过度解释为单纯颤抖。
- source_word: אִישׁ אֶל־רֵעֵהוּ יִתְמָהוּ
  choice: 各人都惊愕地望着同伴
  rationale: 希伯来文是逐一分配式表达，直义为“各人向他的同伴”；תמה表示惊异、愕然。“各人”自然涵盖群体，“惊愕地望着”保留凝视与震惊两层含义。
- source_word: פְּנֵי לְהָבִים פְּנֵיהֶם
  choice: 他们的脸如火焰一般
  rationale: 直译为“他们的脸是火焰之脸”。正文保留鲜明的火焰意象，同时用汉语自然的明喻表达；脚注说明更贴近字面的形式及其语义开放性。
