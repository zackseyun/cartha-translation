  yaml_path: translation/ot/isaiah/013/015.yaml
  text: Everyone who is found will be pierced through[a], and everyone who is caught will fall by the sword.
translation:
  language: zh_hans
  text: 凡被发现的，必被刺透；凡被擒获的[a]，必倒在刀下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被擒获的”或译“被卷走的”“被扫除的”。希伯来语分词הַנִּסְפֶּה的含义可比“被擒获”更宽；正文按本节战争审判的语境作此译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנִּמְצָא
  choice: 凡被找到的
  rationale: כָּל与作名词用的被动分词הַנִּמְצָא连用，逐一指所有被人发现、找到的人。“凡……的”既保留普遍范围，也符合现代汉语表达。
- source_word: יִדָּקֵר
  choice: 必被刺透
  rationale: דקר的Nifal未完成式表示被武器刺穿。“刺透”保留动作的猛烈程度和被动语态，又不额外指定武器种类。
- source_word: וְכָל הַנִּסְפֶּה
  choice: 凡被抓住的[a]
  rationale: 分词הַנִּסְפֶּה在此审判和战争语境中可理解为陷入敌手、被抓住的人；但ספה的语义可能更广，也可表示被卷走或扫除，因此用脚注保留这一真实的词义歧义。
- source_word: יִפּוֹל
  choice: 必倒下
  rationale: נפל在战争语境中通常指被杀而倒下。译作“倒下”保留原文意象，不直接把含义收窄为“死亡”。
- source_word: בֶּחָרֶב
  choice: 在刀下
  rationale: 介词בְּ在此表示手段；חֶרֶב是战争杀戮的刀剑。“倒在刀下”是自然而庄重的汉语表达，并保留原文的战争意象。
