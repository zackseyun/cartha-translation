base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/017.yaml
  text: Behold[a], I am stirring up the Medes against them, who do not value silver and do not delight in gold.
translation:
  language: zh_hans
  text: 看哪，我将激动玛代人来攻击他们；他们不看重银子，也不喜爱金子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不看重银子”也可译作“不把银子当回事”或“不顾念银子”；“不喜爱金子”也可译作“不渴慕金子”。原文强调玛代人不受金银吸引；这句话没有明说他们的具体动机。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我
  rationale: הִנֵּה与第一人称代词后缀合用，引出上帝郑重而迫近的宣告。“看哪，我”既保留先知话语的提醒力度，也符合现代汉语的庄重表达。
- source_word: מֵעִיר
  choice: 正激起
  rationale: 这是עור的使役分词，表示使之奋起、兴起采取行动。“正激起”保留分词所表达的正在进行或即将发生之感。
- source_word: עֲלֵיהֶם
  choice: 来攻击他们
  rationale: 介词עַל在敌对军事语境中表示针对某方；译作“来攻击他们”比空间性的“到他们之上”自然明确。
- source_word: אֶת מָדָי
  choice: 玛代人
  rationale: מָדַי在此指被兴起采取军事行动的族群，采用现代中文圣经与历史语境中通行的族名“玛代人”。
- source_word: כֶּסֶף לֹא יַחְשֹׁבוּ
  choice: 不看重银子
  rationale: חשב在此不是单指思想活动，而是“算为重要、视为有价值”。“不看重银子”自然传达他们不把银子当回事。
- source_word: וְזָהָב לֹא יַחְפְּצוּ בוֹ
  choice: 也不贪爱金子
  rationale: חפץ可表达喜爱、渴望或以某物为乐；“贪爱”在财富语境中体现他们不受金子吸引，同时保留意愿与情感层面的含义。
theological_decisions:
- issue: 上帝与玛代人行动之间的关系
  choice: 保留第一人称使役表达“我正激起”
  alternative: 弱化为“玛代人将起来”
  rationale: 原文明确把兴起玛代人的主动权归于说话者；译文直接保留这一表达，不额外解释其神学机制。
- issue: 玛代人对金银的态度
  choice: 按字面译为“不看重银子，也不贪爱金子”
  alternative: 解释性译为“他们不受贿赂，也不为掠夺财富而来”
  rationale: 上下文可能暗示金银不能收买或阻止他们，但原文只陈述其态度；正文保留这种张力，不把推论写成明说。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”保留原文的提醒与宣告力量；分号呈现主要行动与随后人物特征之间的结构关系。
