base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/016.yaml
  text: Their infants will be dashed to pieces before their eyes; their houses will be plundered[a], and their wives raped.
translation:
  language: zh_hans
  text: 他们的婴孩必在他们眼前被摔碎；他们的房屋必被抢掠，他们的妻子必遭强奸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלְלֵיהֶם
  choice: 他们的婴孩
  rationale: עֹלֵל指年幼、脆弱的孩子，常可具体指婴幼儿；“婴孩”在现代汉语中准确且庄重。
- source_word: יְרֻטְּשׁוּ
  choice: 必被摔碎
  rationale: רטש的被动式描写战争中猛烈摔砸、使身体破碎；“被摔碎”保留原文的残酷力度，不作淡化。
- source_word: לְעֵינֵיהֶם
  choice: 在他们眼前
  rationale: 这是表示亲眼目睹的惯用语；“在他们眼前”自然对应原文。
- source_word: יִשַּׁסּוּ
  choice: 必被抢掠
  rationale: שסס/שסה表示掠夺、劫掠；以房屋为主语时，汉语被动表达最自然。
- source_word: בָּתֵּיהֶם
  choice: 他们的房屋
  rationale: בַּיִת在此指遭受劫掠的具体住宅；“房屋”比“家园”更贴近词面。
- source_word: וּנְשֵׁיהֶם
  choice: 他们的妻子
  rationale: אִשָּׁה的复数附属形式加第三人称阳性复数后缀，在此最自然地指“他们的妻子”。
- source_word: תשגלנה
  choice: 必遭强奸
  rationale: שגל在此是粗直的战争性暴力用语，意指强行性交；“遭强奸”在现代汉语中明确传达性侵害，不以委婉语削弱原文。
theological_decisions:
- issue: 先知审判语境中对战争性暴力用词的处理
  choice: 他们的妻子必遭强奸
  alternative: 他们的妻子必受凌辱／必被污辱
  rationale: 原文用词直接而粗厉，明确涉及强迫性的性行为；正文采用“遭强奸”以忠实呈现审判神谕所描写的恐怖，不将其委婉化，也不对事件作超出文本的神学解释。
translation_notes:
  register: 采用现代、庄重而直接的书面汉语；三个分句保留希伯来诗句的并列推进和“必”的预告语气。暴力内容不作美化或弱化。
