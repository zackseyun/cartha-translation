  text: הֵילִ֕ילוּ כִּ֥י קָר֖וֹב י֣וֹם יְהוָ֑ה כְּ/שֹׁ֖ד מִ/שַּׁדַּ֥י יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/006.yaml
  text: Wail[a], for the day of Yahweh is near[b]; it will come like destruction from the Almighty.
translation:
  language: zh_hans
  text: 你们要哀号[a]，因为耶和华的日子临近了；它必如毁灭一般，从全能者那里来到[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“号啕”；原文是复数命令式，要求人因悲痛或恐惧发出响亮的呼喊。
    reason: lexical_alternative
  - marker: b
    text: “毁灭”（shod）与“全能者”（Shaddai）在希伯来语中声音相近，构成文字游戏；中文难以同时再现。
    reason: wordplay
lexical_decisions:
- source_word: הֵילִילוּ
  choice: 你们要哀号
  rationale: 复数命令式，指因悲痛或恐惧而发出响亮的呼喊；“哀号”自然、鲜明，并保留命令的力度。
- source_word: כִּי
  choice: 因为
  rationale: 引出哀号的原因，符合现代汉语的因果表达。
- source_word: קָרוֹב
  choice: 临近了
  rationale: 作谓语表示迫近；“临近了”既表达将近，也体现先知宣告中的紧迫感。
- source_word: יוֹם יְהוָה
  choice: 耶和华的日子
  rationale: 保留先知书中这一固定表达，指耶和华施行审判和介入的决定性日子。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，而非以称号替代专名。
- source_word: כְּשֹׁד
  choice: 如毁灭
  rationale: שֹׁד在此审判语境中指猛烈的毁坏；“如毁灭”保留原文简洁而突兀的比喻。
- source_word: מִשַּׁדַּי
  choice: 从全能者而来
  rationale: 介词מִן表示来源；שַׁדַּי作为神的称号译为“全能者”。
- source_word: יָבֹוא
  choice: 它必……而来
  rationale: 阳性单数动词可回指“日子”，也可泛指将临的事件；用“它”保留这种事件性指向，不改成神亲自来临。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且有长期经文传统的“耶和华”，保留其专名性质；“雅威”是较贴近学术重构读音的可行选择。
- issue: שַׁדַּי 的译法
  choice: 全能者
  alternative: 沙代
  rationale: 该词在此作为神的称号，正文译出其传统理解的含义；音译“沙代”虽可保留希伯来语声音，却不易为普通读者理解。
- issue: יָבֹוא 的主语指向
  choice: 以“它”回指耶和华的日子或将临的毁灭
  alternative: 译作“他必来”，理解为全能者亲自来临
  rationale: 最近的核心名词“日子”为阳性单数，且上下文描述审判事件临到；原文语法也容许一定张力，因此不把动词明确神学化为“他来”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们要哀号”明确复数命令；分号保留两小句的紧密推进。“它必如毁灭从全能者而来”略带先知诗歌的凝练语序，以保留原文比喻和来源关系。
