  text: עַל כֵּ֖ן כָּל יָדַ֣יִם תִּרְפֶּ֑ינָה וְ/כָל לְבַ֥ב אֱנ֖וֹשׁ יִמָּס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/007.yaml
  text: Therefore all hands will grow weak[a], and every human heart will melt.
translation:
  language: zh_hans
  text: 因此，所有人的手都必发软，每个人[a]的心都必融化。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “每个人”或译“凡人”。希伯来语 אֱנוֹשׁ 泛指人，常含脆弱、必死之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 表示由前文审判宣告引出的结果；“因此”简洁自然，并保留推论关系。
- source_word: כָּל יָדַיִם
  choice: 人人的手
  rationale: 希伯来文以复数“所有的手”作集合性表达。“人人的手”在现代汉语中更自然，同时保留手所象征的力量与行动能力。
- source_word: תִּרְפֶּינָה
  choice: 都必发软
  rationale: רפה 表示松弛、软弱或无力；“手发软”既保留身体意象，也自然表达力量因恐惧而消失。
- source_word: וְכָל לְבַב אֱנוֹשׁ
  choice: 世人的心
  rationale: לְבַב 指内心，也涉及勇气和意志；אֱנוֹשׁ 泛指脆弱、必死的人类。“世人的心”保留普遍的人类指向，避免误作仅指男性。
- source_word: יִמָּס
  choice: 都必消融
  rationale: 该动词本义为“熔化、消融”，在此比喻人因恐惧而勇气崩溃。“消融”保留原文鲜明意象，未将其直接释义为“丧胆”。
theological_decisions:
- issue: אֱנוֹשׁ 在泛指人类的表达中如何翻译
  choice: 世人
  alternative: 凡人／每个人
  rationale: 此词泛指人，并常带有脆弱、必死的意味。“世人”自然地涵盖全人类；“凡人”能更明显表达有限性，但在本句中略显强调，因此以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“手发软”和“心消融”保留原文并列的身体意象及恐惧所导致的力量、勇气崩溃；脚注标记置于相关整句之后。
