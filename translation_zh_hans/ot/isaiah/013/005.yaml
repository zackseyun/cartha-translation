id: ISA.13.5
reference: Isaiah 13:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּאִ֛ים מֵ/אֶ֥רֶץ מֶרְחָ֖ק מִ/קְצֵ֣ה הַ/שָּׁמָ֑יִם יְהוָה֙ וּ/כְלֵ֣י זַעְמ֔/וֹ לְ/חַבֵּ֖ל כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/005.yaml
  text: They are coming from a distant land[c][b][a], from the end of the heavens— Yahweh and the weapons of his wrath— to destroy the whole earth.
translation:
  language: zh_hans
  text: 他们从遥远之地而来，从诸天的尽头而来[a]——雅威和他震怒的兵器[b]——要毁灭整个大地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从天边而来”。
    reason: 原文מִקְצֵה הַשָּׁמַיִם直译为“从诸天的尽头”，也可按汉语习惯较简略地表达为“从天边而来”。
  - marker: b
    text: 或译：“他震怒的器具”。
    reason: כְּלִי既可泛指器具，也可在军事语境中指兵器。
  - marker: c
    text: “整个大地”也可译作“全地”或“全境”；本节的宇宙性语言较支持较宽广的译法。
    reason: הָאָרֶץ可指大地，也可指特定的土地或国境，原词存在真实的范围歧义。
lexical_decisions:
- source_word: בָּאִים
  choice: 他们……而来
  rationale: 阳性复数分词描绘正在逼近的行动；汉语用“他们……而来”承接上文所指的军队，并保留先知异象的临场感。
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: 从遥远之地
  rationale: אֶרֶץ在此首先指地域或国土，מֶרְחָק表示遥远；“遥远之地”自然、庄重，也与后文的הָאָרֶץ形成可辨的语境差异。
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: 从天边
  rationale: קָצֶה意为尽头、边缘；“天边”既简洁自然，又保留从天之极处而来的宏阔图景。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，不以头衔替代原文中的专名。
- source_word: וּכְלֵי זַעְמוֹ
  choice: 和他震怒的兵器
  rationale: כְּלִי可指器具或兵器；在战争与审判语境中译作“兵器”最贴切。זַעַם表示强烈的愤怒，“震怒”符合庄重的先知文体。
- source_word: לְחַבֵּל
  choice: 要毁灭
  rationale: 不定式表达目的；“毁灭”准确传达使之败坏、遭到摧毁的强烈含义。
- source_word: כָּל הָאָרֶץ
  choice: 整个大地
  rationale: הָאָרֶץ可指土地、国土或大地；结合“天边”的宇宙性意象，正文采用较宽广的“大地”，同时以脚注保留“全境”的可能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名，因此正文采用音译“雅威”，避免以称号“主”取代；“耶和华”是传统形式，但较不贴近通常重建的读音。
- issue: כָּל הָאָרֶץ所指审判的范围
  choice: 整个大地
  alternative: 全境；全地
  rationale: 该词本身容许地域性和广域性理解；本节“从天边而来”的宏阔语言使“大地”较为合适，但脚注保留较窄的地域义，不把语义张力消除。
- issue: 雅威与“兵器”的句法关系
  choice: 以破折号保留同位展开：“雅威和他震怒的兵器”
  alternative: 明确补成“来的是雅威和他震怒的兵器”
  rationale: 原文先用复数分词“而来”，随后点明雅威及其震怒的兵器；破折号保留这种突显式结构，不额外解释雅威如何与复数形式配合。
translation_notes:
  register: 采用现代、庄重而可朗读的先知书语体。“遥远之地”“天边”“震怒”“毁灭”通俗而不口语化；两组破折号再现希伯来文突然揭示行动主体的强调结构。所有脚注标记均置于相关词语之后。
