  text: לֹֽא תֵשֵׁ֣ב לָ/נֶ֔צַח וְ/לֹ֥א תִשְׁכֹּ֖ן עַד דּ֣וֹר וָ/ד֑וֹר וְ/לֹֽא יַהֵ֥ל שָׁם֙ עֲרָבִ֔י וְ/רֹעִ֖ים לֹא יַרְבִּ֥צוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/020.yaml
  text: It will never be inhabited[a], and it will not be dwelt in from generation to generation; no Arab will pitch his tent there, and shepherds will not make their flocks lie down there.
translation:
  language: zh_hans
  text: 那里必永远无人居住，世世代代都无人定居；没有阿拉伯人[a]在那里支搭帐篷，牧人也不使羊群在那里躺卧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿拉伯人”或译“沙漠游牧民”。这里的希伯来词可以特指阿拉伯人，也可能在本语境中泛指沙漠中的游牧者。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵשֵׁב
  choice: 无人居住
  rationale: יָשַׁב本义为“坐、居住”；以城邑为隐含主语时，表示该地有人居住。汉语用“无人居住”自然传达否定含义。
- source_word: לָנֶצַח
  choice: 永远
  rationale: 该短语表示永久、恒久；与否定词连用，译作“永远无人居住”既自然又保留永久荒废的语气。
- source_word: תִשְׁכֹּן
  choice: 无人定居
  rationale: שָׁכַן表示居住、安顿。译作“定居”与前句“居住”略作区分，同时符合城邑荒废的语境。
- source_word: עַד דּוֹר וָדוֹר
  choice: 世世代代
  rationale: 希伯来习语强调一代接一代持续下去；“世世代代”是自然、庄重的现代汉语表达。
- source_word: יַהֵל
  choice: 支搭帐篷
  rationale: 该动词在此表示搭帐篷扎营；“支搭帐篷”保留原文的游牧图景。
- source_word: עֲרָבִי
  choice: 阿拉伯人
  rationale: 该名词通常特指阿拉伯人或阿拉伯地区的人；正文采用直接对应词，同时以脚注保留“沙漠游牧民”的较宽理解。
- source_word: רֹעִים
  choice: 牧人
  rationale: 该词指放牧牲畜的人；“牧人”简洁、通行，并与经文语体相称。
- source_word: יַרְבִּצוּ
  choice: 使羊群……躺卧
  rationale: רבץ的使役形表示“使躺下、使安歇”。原文未明说宾语，但牧人语境表明所指是他们放牧的牲畜；补出“羊群”可避免误解为牧人自己躺卧。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那里”承接上下文所指的巴比伦；两组并行否定句保留原文逐层强化永久荒废的结构。脚注标记置于其实际解释的词“阿拉伯人”之后。
