source:
  edition: WLC
  text: עַ֤ל הַר נִשְׁפֶּה֙ שְֽׂאוּ נֵ֔ס הָרִ֥ימוּ ק֖וֹל לָ/הֶ֑ם הָנִ֣יפוּ יָ֔ד וְ/יָבֹ֖אוּ פִּתְחֵ֥י נְדִיבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/002.yaml
  text: On a bare mountain raise a signal[a]; lift up the voice to them; wave the hand[c][b], that they may enter the gates of the nobles.
translation:
  language: zh_hans
  text: 你们要在光秃的山上竖起旗号[a]，向他们高声呼喊；挥手示意[b]，使他们进入权贵的门[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旗号”或译“旗帜”、“信号”。希伯来语 נֵס 常指高高竖起、用于军事召集或指引的标志。
    reason: lexical_alternative
  - marker: b
    text: “挥手示意”或译“招手”。这个动作很可能是在召唤进攻的军队。
    reason: lexical_alternative
  - marker: c
    text: “权贵”或译“王公”、“首领”。希伯来语 נְדִיבִים 可指贵族、王公或其他显要人物。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁפֶּה
  choice: 光秃的
  rationale: 该词描写山岭被剥去覆盖、显得裸露；“光秃的山”自然地保留了这一视觉形象，也符合适于竖立远望信号的高地场景。
- source_word: נֵס
  choice: 旗号
  rationale: 此词在军事和先知语境中常指高高竖起、用于召集或指引人的标志；“旗号”兼顾其可见形态与信号功能。
- source_word: הָרִימוּ קוֹל
  choice: 高声呼喊
  rationale: 希伯来语直译为“扬起声音”；“高声呼喊”以现代汉语自然表达其呼召动作，同时保留提高音量的含义。
- source_word: לָהֶם
  choice: 向他们
  rationale: 介词在此最自然地表示声音所朝向的对象，不额外断定敌对或受益关系。
- source_word: הָנִיפוּ יָד
  choice: 挥手示意
  rationale: 保留挥动手的具体动作，并以“示意”表达其信号性质；具体是招呼还是其他手势，正文不作过度限定。
- source_word: וְיָבֹאוּ
  choice: 让他们进入
  rationale: 接在一连串命令之后，可自然理解为这些信号所要达到的目的或结果；“进入”也与后面的“城门”衔接。
- source_word: פִּתְחֵי
  choice: 城门
  rationale: 该复数构造形式泛指入口；在攻城或进入权贵据点的语境中，“城门”是自然且贴切的汉语表达。
- source_word: נְדִיבִים
  choice: 权贵
  rationale: 此处指身份显赫或掌权的人；“权贵”比“王公”涵盖面更广，也避免把原文限定为特定王族爵位。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留原文连续发令的力度；“向他们”维持所指对象在本节中的含蓄性，不擅自补明其身份；以脚注保存 נֵס、הָנִיפוּ יָד 和 נְדִיבִים 的真实词义范围。
