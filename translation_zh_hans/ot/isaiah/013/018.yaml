  text: וּ/קְשָׁת֖וֹת נְעָרִ֣ים תְּרַטַּ֑שְׁנָה וּ/פְרִי בֶ֨טֶן֙ לֹ֣א יְרַחֵ֔מוּ עַל בָּנִ֖ים לֹֽא תָח֥וּס עֵינָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/018.yaml
  text: And their bows will dash young men to pieces[a]; they will show no compassion on the fruit of the womb[b]; their eyes will not spare children.
translation:
  language: zh_hans
  text: 他们的弓必击碎青年人[a]；他们不怜悯母腹所生的；他们的眼也不顾惜儿女[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的弓必击碎青年人。”有些人把“弓”按转喻理解为“弓箭手”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“儿子们”；这里很可能广义地指“儿女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשָׁתוֹת
  choice: 弓
  rationale: 该词通常指“弓”，且阴性复数动词与该阴性复数名词自然呼应；保留弓作为杀戮工具的具体意象，不直接转喻为“弓箭手”。
- source_word: נְעָרִים
  choice: 青年人
  rationale: 该词可指少年、青年或年轻男子；本节是战争暴行的语境，“青年人”既保留年龄范围，也不误限为幼童。
- source_word: תְּרַטַּשְׁנָה
  choice: 砸得粉碎
  rationale: רטש 的 Piel 词形表达猛烈砸碎、摔碎；此译法保留原文残酷而强烈的动作感。
- source_word: פְרִי בֶטֶן
  choice: 腹中的果子
  rationale: 直译该希伯来习语，指由母腹所出的后代；“腹中的果子”在现代汉语中仍可理解，并保留原文鲜明意象。
- source_word: יְרַחֵמוּ
  choice: 不怜悯
  rationale: רחם 表达怜悯、慈悲的情感；“不怜悯”简洁自然，也准确传达其否定意义。
- source_word: בָּנִים
  choice: 儿女
  rationale: 该词形式上可译“儿子们”，但也常泛指子女或后代；与前句“腹中的果子”平行时，泛指“儿女”更符合语境。
- source_word: תָחוּס עֵינָם
  choice: 他们的眼也不顾惜
  rationale: 保留“眼”这一集体单数意象；חוס 在此表示怜惜、饶恕，“不顾惜”符合审判与暴行语境。
