source:
  edition: WLC
  text: אֲנִ֥י צִוֵּ֖יתִי לִ/מְקֻדָּשָׁ֑/י גַּ֣ם קָרָ֤אתִי גִבּוֹרַ/י֙ לְ/אַפִּ֔/י עַלִּיזֵ֖י גַּאֲוָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/003.yaml
  text: I myself have commanded my consecrated ones; I have also summoned my warriors for my anger[a], my proudly exulting ones.
translation:
  language: zh_hans
  text: 我亲自吩咐了我所分别归我使用的人；我也召集了我的勇士，为施行我的烈怒——我那些因我的威荣而欢腾的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因我的威荣而欢腾的人”或译“那些得意扬扬的人”，又或“那些因我的凯旋而欢腾的人”。
    reason: 希伯来语 עַלִּיזֵי גַּאֲוָתִי 结构凝练；גַּאֲוָה 可表示威荣、昂扬或凯旋，修饰关系也可有不同理解。
lexical_decisions:
- source_word: אֲנִי
  choice: 我亲自
  rationale: 独立人称代词与第一人称动词并用，带有强调意味；“我亲自”在现代汉语中自然地保留这一强调。
- source_word: צִוֵּיתִי
  choice: 吩咐了
  rationale: צוה 的 Piel 形通常表示吩咐、命令或委派；“吩咐了”既体现权威行动，也保持自然庄重。
- source_word: לִמְקֻדָּשָׁי
  choice: 我所分别出来的人
  rationale: 该词是 קדשׁ 的被动分词并带第一人称单数词尾，指为特定目的被分别出来归神使用的人；此处避免让“圣洁”被误解为对这些执行审判者品德的断言。
- source_word: גַּם
  choice: 也
  rationale: 连接神的第二项行动，与前面的“吩咐”并列。
- source_word: קָרָאתִי
  choice: 召来了
  rationale: 在集结军队施行审判的语境中，קרא 表示召集、征召；“召来了”符合军事语境。
- source_word: גִּבּוֹרַי
  choice: 我的勇士
  rationale: גבור 可指强者、勇士或战士；上下文是军队集结，因此“勇士”既保留英勇强健之意，又适合诗体。
- source_word: לְאַפִּי
  choice: 为要施行我的烈怒
  rationale: אַף 字面与“鼻”有关，惯用义为怒气；介词 לְ 在此表示目的。“施行”补足汉语表达所需的动作关系，但不改变他们奉召执行神愤怒审判的含义。
- source_word: עַלִּיזֵי
  choice: 欢腾的人
  rationale: 该词表示欣喜、雀跃或得胜般的欢腾；“欢腾”保留其高昂、诗意的语气。
- source_word: גַּאֲוָתִי
  choice: 因我的威荣
  rationale: גאוה 可表示高昂、威荣、威严、骄傲或胜利的昂扬；“威荣”适合指神的崇高显荣，但与 עַלִּיזֵי 的关系有歧义，故在脚注保留其他理解。
theological_decisions:
- issue: “我所分别出来的人”是否表示这些人具有道德上的圣洁
  choice: 理解为神为执行审判而分别、委派的 agents，不对其道德品质作断言
  alternative: 理解为道德上圣洁的人或天使性的“圣者”
  rationale: 本段直接语境是召集军队攻击巴比伦；קדשׁ 在此主要表达被分别用于神所定的目的。
- issue: 如何理解 עַלִּיזֵי גַּאֲוָתִי
  choice: 正文译为“那些因我的威荣而欢腾的人”
  alternative: “那些得意扬扬的人”或“那些因我的凯旋而欢腾的人”
  rationale: 希伯来语结构凝练，גאוה 可指神的威荣或凯旋，也可能描写勇士本身昂扬自得的状态；正文采用较贴近属神威荣的理解，脚注明确保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我亲自”保留开头的强调；破折号呈现末句对“勇士”的补充说明。正文中的脚注标记 [a] 与脚注相对应。
