    rationale: לִמְקֻדָּשָׁי 是“我的被分别为圣者／受奉献者”，不是单指从某群体中被挑选出来的人。补出“归我使用”可在不施加道德圣洁含义的情况下保留其功能性的分别。
  - severity: low
