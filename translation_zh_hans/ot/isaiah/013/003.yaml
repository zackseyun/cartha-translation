  naturalness: 整体庄重自然。“我所分别归我使用的人”比“我所分别出来的人”更符合现代汉语，也更准确。“召集了”比“召来了”更贴近“呼召／征召”的行动本身，不暗示已到达。
  terminology: “烈怒”“勇士”“威荣”均适合本段诗性、审判性的语域。“分别归我使用”传达“consecrated”的功能性分别，避免将这些执行审判者预设为道德上圣洁。末句及脚注保留 גַּאֲוָתִי 的句法和词义歧义。
