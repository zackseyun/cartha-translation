revisions:
- from: 我亲自吩咐了我所分别出来的人；我也召来了我的勇士，为要施行我的烈怒——就是那些因我的威荣而欢腾的人。[a]
  to: 我亲自吩咐了我所分别归我使用的人；我也召集了我的勇士，为施行我的烈怒——我那些因我的威荣而欢腾的人。[a]
  rationale: 仅修改“分别出来”为“分别归我使用”，以恢复 מְקֻדָּשָׁי 所含的归神、受分别之意，并将“召来了”调整为“召集了”，以避免增添被召者已经抵达的含义。其余译法及脚注所保留的末句歧义不变。
