id: ISA.13.9
reference: Isaiah 13:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֤ה יוֹם יְהוָה֙ בָּ֔א אַכְזָרִ֥י וְ/עֶבְרָ֖ה וַ/חֲר֣וֹן אָ֑ף לָ/שׂ֤וּם הָ/אָ֨רֶץ֙ לְ/שַׁמָּ֔ה וְ/חַטָּאֶ֖י/הָ יַשְׁמִ֥יד מִמֶּֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/009.yaml
  text: Behold[a], the day of Yahweh is coming—cruel, with wrath and fierce anger—to make the land a desolation[d][c][b], and he will destroy its sinners from it.
translation:
  language: zh_hans
  text: 看哪，耶和华的日子正在来到——残酷无情，带着愤怒和烈怒，要使大地成为荒凉之地，并从其中除灭罪人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”。希伯来词 אֶרֶץ 可有这两种含义；本章较广阔的审判图景支持“大地”。
    reason: lexical_alternative
  - marker: b
    text: “并从其中除灭罪人”也可理解为“他要从大地中除灭罪人”，其中“他”指耶和华；原文也可让“那日”作就近的语法主语。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意、郑重指示的语气；“看哪”在现代中文中略显庄重，但仍易懂。
- source_word: יוֹם יְהוָה
  choice: 耶和华的日子
  rationale: 保留希伯来文的先知性固定表达，并以“耶和华”译出神名。
- source_word: בָּא
  choice: 临近了
  rationale: 该完成式在此生动宣告确定且迫近的未来事件；“临近了”自然表达其迫切性。
- source_word: אַכְזָרִי
  choice: 残酷无情
  rationale: 表达这审判之日严酷、不留情面的性质；比单说“残酷”更能传出语境中的强度。
- source_word: וְעֶבְרָה
  choice: 带着盛怒
  rationale: עֶבְרָה表示强烈的震怒；“带着”使它与前面的形容词及后面的怒气词组自然衔接。
- source_word: וַחֲרוֹן אָף
  choice: 和怒火
  rationale: 该习语字面涉及怒气的燃烧或炽热；“怒火”既自然又保留其形象和强度。
- source_word: לָשׂוּם
  choice: 为要使
  rationale: 明确表达不定式所表示的目的。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ可指“地、土地、大地”；本章审判具有广阔乃至宇宙性的视野，“大地”既保留范围弹性，也比单指某片“土地”更符合上下文。
- source_word: לְשַׁמָּה
  choice: 荒凉
  rationale: 准确表达毁坏、荒废的状态，并保持先知文学庄重简洁的语体。
- source_word: וְחַטָּאֶיהָ
  choice: 其中的罪人
  rationale: 自然表达带阴性后缀的“它的罪人”，并清楚指向大地之中的罪人。
- source_word: יַשְׁמִיד
  choice: 除灭
  rationale: 使役词形表达彻底毁灭；“除灭”力度足够，也符合庄重的审判语境。
- source_word: מִמֶּנָּה
  choice: 从其中
  rationale: 希伯来文明确表达从大地上除去；中文在“把其中的罪人除灭”中已自然包含这一关系，避免生硬重复。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者普遍熟悉的专名形式，同时明确保留原文神名，而不以普通称号取代。
- issue: יַשְׁמִיד 的主语
  choice: 以“那日”为就近的语法主语，译文通过连续句式表达
  alternative: 明确补出“他”，指耶和华亲自除灭
  rationale: 希伯来文动词为阳性单数，既可承接阳性名词“日子”，也可理解为耶和华这一隐含施事者。正文不额外补出“他”，避免消除原文的句法张力；脚注说明另一种理解。
translation_notes:
  register: 采用现代、庄重而清晰的先知宣告语体。“看哪”保留原文的郑重提示；“盛怒和怒火”保留多个愤怒词语叠加的修辞力量。正文中的所有脚注标记均与脚注对应。
