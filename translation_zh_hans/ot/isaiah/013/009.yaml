revisions:
- from: 看哪，耶和华的日子临近了；那日残酷无情，带着盛怒和怒火，为要使大地荒凉[a]，把其中的罪人除灭[b]。
  to: 看哪，耶和华的日子正在来到——残酷无情，带着愤怒和烈怒，要使大地成为荒凉之地，并从其中除灭罪人。[a][b]
  rationale: 修订直接对应“日子正在来到”，补足“从其中”的空间关系，并以无明确主语的连续谓语保留希伯来原文对于除灭行动施事者的歧义。脚注标记调整为置于整句末尾，分别对应“大地”的词义选择及末句主语的替代理解。
