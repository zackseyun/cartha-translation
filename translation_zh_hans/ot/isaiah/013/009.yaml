  source_fidelity: 正文准确保留了宣告语气、审判之日的临到、愤怒词语的叠加、使地成为荒凉以及除灭罪人的意思。应将“临近了”改为“正在来到”，更直接对应 בָּא 的预告性“正在来临”，而不额外限定为已经临近。末句宜明示“从其中”，以对应 מִמֶּנָּה，同时不指定 יַשְׁמִיד 的主语，保留原文可指“那日”或隐含的耶和华的歧义。
  naturalness: 修订后的句子保持现代汉语中庄重、清晰的先知宣告语体。“愤怒和烈怒”自然呈现原文两个怒气名词的累积；“成为荒凉之地”清楚表达“成为荒凉”的结果。
  terminology: “耶和华的日子”是对 יוֹם יְהוָה 的恰当且通行的译法；“大地”在本章国际性、宇宙性审判语境中可取，并以脚注保留“土地”的词义可能。“除灭”适合 שׁמד 的强烈毁灭语义。
  issues:
