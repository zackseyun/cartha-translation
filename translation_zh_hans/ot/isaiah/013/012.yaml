  text: אוֹקִ֥יר אֱנ֖וֹשׁ מִ/פָּ֑ז וְ/אָדָ֖ם מִ/כֶּ֥תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/012.yaml
  text: I will make mortal man rarer than fine gold[a], and mankind than the gold of Ophir.
translation:
  language: zh_hans
  text: 我要使凡人比精金更稀少[a]，使人类比俄斐的黄金更稀少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要使凡人比精金更宝贵。”希伯来语动词可强调珍贵或价值；在本段语境中，这很可能意味着人将变得极其稀少。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹקִיר
  choice: 使……更稀少
  rationale: 该动词是יקר的使役式，可表达使之贵重、珍贵；在本章审判导致人口锐减的语境中，与黄金相比所突出的实际结果是人极其稀少。正文采用自然的汉语表达，并以脚注保留“更宝贵”的词义可能。
- source_word: אֱנוֹשׁ
  choice: 凡人
  rationale: אֱנוֹשׁ常带有人脆弱、必死的意味。“凡人”既指人，也保留其有限和脆弱的色彩。
- source_word: מִפָּז
  choice: 比精金
  rationale: פָּז指上等、精炼的黄金。“精金”简洁而庄重，能表达其高贵价值。
- source_word: וְאָדָם
  choice: 使人类
  rationale: אָדָם在此与אֱנוֹשׁ平行，泛指人类整体；“人类”清楚传达集合性的泛指意义。
- source_word: מִכֶּתֶם אוֹפִיר
  choice: 比俄斐的黄金
  rationale: כֶּתֶם指贵重的黄金，אוֹפִיר是以优质黄金著称的地名；“俄斐的黄金”保留地理典故，也避免在原文已借该名称暗示品质之处过度增译。
theological_decisions:
- issue: 审判语境中אוֹקִיר的比较含义
  choice: 更稀少
  alternative: 更宝贵
  rationale: 希伯来语可强调价值或珍贵程度，但上下文描绘毁灭性审判，人比黄金更难寻是主要语境效果。脚注保留“更宝贵”这一真实词义可能，不把歧义完全消除。
- issue: אָדָם作为泛指人类的表达
  choice: 人类
  alternative: 人
  rationale: 本节以两个平行词语描写审判之下人口的稀少；“人类”明确体现אָדָם的集合性泛指，同时与前句“凡人”形成对应。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留两行平行结构，以“凡人／人类”和“精金／俄斐的黄金”对应原文；脚注明示动词在“珍贵”与语境所指“稀少”之间的张力。
