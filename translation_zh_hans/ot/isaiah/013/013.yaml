revisions:
- from: 所以，我必使诸天震动，大地也必摇撼，离开原位；这是因万军之耶和华的盛怒，在他烈怒的日子。
  to: 因此，我必使诸天震动；大地必从原位摇动；这是在万军之耶和华的盛怒中，在他烈怒的日子。
  rationale: 修订仅处理中文句法和原文并列介词短语的关系。“在……盛怒中，在……日子”保留原文的双重表达及其未明说的精确逻辑关系，不将其过度解释为单一的因果、时间或工具关系。
