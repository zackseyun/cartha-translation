source:
  edition: WLC
  text: עַל כֵּן֙ שָׁמַ֣יִם אַרְגִּ֔יז וְ/תִרְעַ֥שׁ הָ/אָ֖רֶץ מִ/מְּקוֹמָ֑/הּ בְּ/עֶבְרַת֙ יְהוָ֣ה צְבָא֔וֹת וּ/בְ/י֖וֹם חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/013.yaml
  text: Therefore I will make the heavens tremble[a], and the earth will shake from its place, at the fury of Yahweh of Armies, in the day of his burning anger.
translation:
  language: zh_hans
  text: 因此，我必使诸天震动；大地必从原位摇动；这是在万军之耶和华的盛怒中，在他烈怒的日子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: 所以
  rationale: 作为推论连接词，简洁自然地表明本节是前述审判宣告的结果。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 保留希伯来语复数形式及宇宙性的庄严语域，与下文“大地”相对。
- source_word: אַרְגִּיז
  choice: 我必使……震动
  rationale: 体现רגז使役式的因果意义，即说话者使诸天震动。
- source_word: וְתִרְעַשׁ
  choice: 也必摇撼
  rationale: 表达רעש所指的剧烈震荡，并与前句形成平行而不机械重复。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 上下文以诸天与大地构成宇宙性对举，因此不取局部性的“土地”。
- source_word: מִמְּקוֹמָהּ
  choice: 离开原位
  rationale: 直接传达大地从其所在位置被震离的意象。
- source_word: בְּעֶבְרַת
  choice: 因……的盛怒
  rationale: עֶבְרָה表示强烈、汹涌的忿怒；介词在此可自然理解为导致震动的原因。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”呈现神名，“万军”则以汉语中清楚而庄严的传统表达传达צְבָאוֹת所含的军旅与天军意象。
- source_word: וּבְיוֹם
  choice: 在……的日子
  rationale: 保留先知书常见的审判之日表达，同时符合现代汉语。
- source_word: חֲרוֹן אַפּוֹ
  choice: 他烈怒
  rationale: חֲרוֹן אַף含有怒气燃烧、炽烈的意象；“烈怒”简洁自然，并保留强度。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名形式“耶和华”，将其作为名字而非以“主”替代；“雅威”则是较接近学术重构发音的另一译法。
- issue: יהוה צבאות这一称号的译法
  choice: 万军之耶和华
  alternative: 军队之雅威
  rationale: “万军之耶和华”在中文中庄严、清楚，并能涵盖地上军旅或天上众军的可能范围，不把所指过度限定为某一种军队。
translation_notes:
  register: 采用现代、庄严而易懂的先知书语体。“诸天—大地”保留宇宙性平行结构；分号标明前半节的震动结果与后半节的原因、时间说明。原文没有必须另列的文本异读或歧义脚注。
