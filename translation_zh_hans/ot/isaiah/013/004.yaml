id: ISA.13.4
reference: Isaiah 13:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ק֥וֹל הָמ֛וֹן בֶּֽ/הָרִ֖ים דְּמ֣וּת עַם רָ֑ב ק֠וֹל שְׁא֞וֹן מַמְלְכ֤וֹת גּוֹיִם֙ נֶֽאֱסָפִ֔ים יְהוָ֣ה צְבָא֔וֹת מְפַקֵּ֖ד צְבָ֥א מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/004.yaml
  text: The sound of a multitude in the mountains[a], like a great people! The sound of an uproar of kingdoms[b], of nations gathered together! Yahweh of hosts is mustering an army for battle.
translation:
  language: zh_hans
  text: 山中传来人群的声音[a]，仿佛一大群人！众王国、聚集的列国，发出喧腾的声音[b]！万军之雅威正在调集作战的军队。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“山上传来人群的声音。”
    reason: 介词ב可按山地范围译作“山中”，也可按山体表面译作“山上”。
  - marker: b
    text: 或译：“众王国一片喧腾，列国正在集结。”
    reason: נֶאֱסָפִים可表达已聚集的状态，也可表达正在集结的过程；שְׁאוֹן亦可译为“喧腾”或“骚动”。
lexical_decisions:
- source_word: ק֥וֹל הָמ֛וֹן
  choice: 群众的喧声
  rationale: קוֹל表示声音，הָמוֹן兼有群众、众多与喧腾之意；译为“群众的喧声”，既呈现听觉场景，也保留人群的集体含义。
- source_word: בֶּֽהָרִ֖ים
  choice: 山中
  rationale: 介词ב在这里最自然地表示地点；“山中”简洁保留复数山地的空间意象，另以脚注注明“山上”的可能。
- source_word: דְּמ֣וּת עַם רָ֑ב
  choice: 仿佛一大群人
  rationale: דְּמוּת在此具有比较作用；עַם רָב可指庞大或人数众多的民众。“一大群人”在现代汉语中自然，并与前面的声响相连。
- source_word: שְׁא֞וֹן
  choice: 喧嚷不已
  rationale: שְׁאוֹן指强烈的喧腾、骚动或轰响；“喧嚷不已”适合各国集结的军事场景，同时避免把它限定为言语内容。
- source_word: מַמְלְכ֤וֹת גּוֹיִם֙ נֶֽאֱסָפִ֔ים
  choice: 众王国喧嚷不已，列国聚集起来
  rationale: 原文连续堆叠“王国、列国”，且分词נֶאֱסָפִים在语法性别上更自然地与גּוֹיִם“列国”呼应。译文保留两组政治群体及其聚集动作。
- source_word: יְהוָ֣ה צְבָא֔וֹת
  choice: 万军之雅威
  rationale: “雅威”直接音译神名יהוה；“万军之”保留צְבָאוֹת在固定神圣称号中的广阔含义，不将其限缩为本节地上的一支军队。
- source_word: מְפַקֵּ֖ד
  choice: 正在点集
  rationale: פקד语义广泛；与צְבָא מִלְחָמָה连用时，表示检点、召集并编组军队。“点集”保留检阅与召集两方面的军事色彩。
- source_word: צְבָ֥א מִלְחָמָֽה
  choice: 作战的军队
  rationale: 该短语直指为战争而组织的军事力量；“作战的军队”清楚自然，也不与神名中的“万军”混同。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”以现代汉语音译呈现专名，而不以“主”等称号替代；脚注可说明传统汉语形式“耶和华”。
- issue: צְבָאוֹת在神圣称号中的范围
  choice: 万军之
  alternative: 众军之
  rationale: “万军之雅威”保留这一称号可涵盖天上与地上众军的宽广性，避免仅凭本节军事语境把称号解释为某一支人间军队。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以两个感叹句再现先知话语中逐层增强的听觉冲击。重复“喧声／喧嚷”呼应原文两次קוֹל，同时用“正在点集”呈现结句的军事行动感。所有脚注标记均已置于正文相应位置。
