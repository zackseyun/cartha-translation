base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/014.yaml
  text: And it will be like a hunted gazelle[a], and like sheep with no one to gather them; each man will turn to his own people[b], and each will flee to his own land.
translation:
  language: zh_hans
  text: 他们必像被赶散的羚羊[a]，又像无人收聚的羊群；各人转向自己的本族[b]，各自逃往自己的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被追赶的羚羊”；希伯来语可指被驱赶、赶走或追逐，并不只指遭猎捕。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“各人转向自己的民”；这里的“各人”是逐一分配的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 他们必像
  rationale: 该形式在先知性话语中引出将要出现的情形。中文结合后续复数动词补出“他们”，并用“必”表达面向未来的结果。
- source_word: כִּצְבִי מֻדָּח
  choice: 像被赶散的羚羊
  rationale: צְבִי 译作现代汉语常用的“羚羊”；נדח 的被动分词主要表示被驱赶、赶散。此译保留受驱逐的含义，不把语义限定为遭猎捕。
- source_word: וּכְצֹאן וְאֵין מְקַבֵּץ
  choice: 又像无人聚拢的羊群
  rationale: צֹאן 是集合名词，可指羊或小型牲畜；语境强调无人收聚，译作“羊群”自然清楚。מְקַבֵּץ 表示聚集、收拢。
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  choice: 各人都转向自己的族人
  rationale: אִישׁ 在此作逐一分配用法，译作“各人”；עַם 在归返语境中指所属群体，“族人”比宽泛的“人民”更自然。פנה 保留为“转向”，不擅自强化成“归回”。
- source_word: וְאִישׁ אֶל אַרְצוֹ יָנוּסוּ
  choice: 各自逃回自己的土地
  rationale: נוס 明确表示逃跑；אֶרֶץ 指各人所属之地，译作“土地”。“逃回”自然表达朝自己土地逃去，但不暗示从前永久居住于那里。
theological_decisions:
- issue: אִישׁ 的阳性单数分配用法
  choice: 译作“各人／各自”
  alternative: 各个男人／每个人
  rationale: 这里的 אִישׁ 逐一指称人群中的成员，重点在分散后各归本族、本地，并非特别强调男性性别。现代汉语“各人／各自”既保留分配意义，也不额外限定所指范围。
- issue: עַם 的群体含义
  choice: 自己的族人
  alternative: 自己的人民／自己的民族
  rationale: 上下文描写外来人口各自逃散；“族人”能表达所属共同体，同时避免把 עַם 过度制度化为现代民族国家概念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被赶散”与后文“无人聚拢”形成意象呼应；分号保留两组比喻与两项逃散行动之间的结构层次。
