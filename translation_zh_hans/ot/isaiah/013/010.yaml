  text: כִּֽי כוֹכְבֵ֤י הַ/שָּׁמַ֨יִם֙ וּ/כְסִ֣ילֵי/הֶ֔ם לֹ֥א יָהֵ֖לּוּ אוֹרָ֑/ם חָשַׁ֤ךְ הַ/שֶּׁ֨מֶשׁ֙ בְּ/צֵאת֔/וֹ וְ/יָרֵ֖חַ לֹֽא יַגִּ֥יהַ אוֹרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/010.yaml
  text: For the stars of the heavens and their constellations will not give their light; the sun is darkened at its rising[a], and the moon will not make its light shine.
translation:
  language: zh_hans
  text: 因为天上的众星和其中的星座[a]都不发出自己的光；太阳升起时昏暗，月亮也不使自己的光发亮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“和其中的猎户座”。希伯来语“כְּסִיל”可特指猎户座；但这里用复数形式，也可能泛指星座。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的审判宣告说明缘由；现代汉语用“因为”最自然。
- source_word: כוֹכְבֵי הַשָּׁמַיִם
  choice: 天上的众星
  rationale: 准确表达希伯来语属格结构，同时保持先知文学的庄重语体。
- source_word: וּכְסִילֵיהֶם
  choice: 和其中的星座
  rationale: כְּסִיל可特指猎户座，但此处为复数并带第三人称复数后缀，语境中泛指天上的星座较为合宜；脚注保留特指猎户座的可能。
- source_word: לֹא יָהֵלּוּ אוֹרָם
  choice: 都不发光
  rationale: 简洁自然地传达“发出其光”的意思；“都”统摄众星和星座。
- source_word: חָשַׁךְ הַשֶּׁמֶשׁ בְּצֵאתוֹ
  choice: 太阳一升起就昏暗
  rationale: 以生动的先知性陈述呈现完成式 חָשַׁךְ，并把 בְּצֵאתוֹ 自然译为“一升起”。
- source_word: וְיָרֵחַ לֹא יַגִּיהַ אוֹרוֹ
  choice: 月亮也不使自己的光辉照耀
  rationale: 保留 נגהּ 使役式“使……照耀”的语义，并明确 אוֹרוֹ 是月亮自身的光。
theological_decisions:
- issue: 宇宙昏暗意象的性质
  choice: 直接保留众星、太阳和月亮失去光明的宇宙性图景，不在正文中判定为纯字面事件或纯政治隐喻。
  alternative: 将其明确解释为末世天象，或解释为地上政权倾覆的象征。
  rationale: 希伯来文本以宇宙失序的意象宣告审判；翻译应保存其神学张力，而不替读者解决解释问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用分号保留诗句两部分的平衡；不额外解释宇宙昏暗意象。
