    rationale: בְּצֵאתוֹ意为“在它升起时／当它出来时”；“一……就……”暗示紧接发生的时间关系，超出原文。
  - severity: medium
    issue: 月亮句汉语搭配生硬
    rationale: “不使自己的光辉照耀”虽试图保留使役式，却不够自然；“不使自己的光发亮”更顺畅，且仍体现使役语义。
  - severity: low
    issue: 脚注中的“猎户座群”不准确且不自然
    rationale: 原词可特指猎户座，复数及后缀的具体处理存在讨论空间，但“猎户座群”不是必要或清晰的对应表达。
  revised_text: 因为天上的众星和其中的星座[a]都不发出自己的光；太阳升起时昏暗，月亮也不使自己的光发亮。
