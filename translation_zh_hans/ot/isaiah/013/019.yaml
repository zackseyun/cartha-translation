id: ISA.13.19
reference: Isaiah 13:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיְתָ֤ה בָבֶל֙ צְבִ֣י מַמְלָכ֔וֹת תִּפְאֶ֖רֶת גְּא֣וֹן כַּשְׂדִּ֑ים כְּ/מַהְפֵּכַ֣ת אֱלֹהִ֔ים אֶת סְדֹ֖ם וְ/אֶת עֲמֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/019.yaml
  text: And Babylon[a], the beauty of kingdoms, the glory of the Chaldeans’ pride, will be like God’s overthrow of Sodom and Gomorrah.
translation:
  language: zh_hans
  text: 巴比伦，这列国中的华美、迦勒底人引以为傲的荣耀[a]，必像上帝倾覆所多玛和蛾摩拉一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“迦勒底人的威荣”。原文也可较中性地指巴比伦的尊荣和壮丽，而不一定含有负面的“骄傲”之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必像……一样
  rationale: 该完成式在预言语境中表达将来的结局；结合后面的比较结构，用“必像……一样”自然呈现。
- source_word: בָבֶל
  choice: 巴比伦
  rationale: 采用现代中文通行地名。
- source_word: צְבִי מַמְלָכוֹת
  choice: 列国中的华美
  rationale: צְבִי 可指美丽、荣美或华美；属格复数在此具有卓越、冠绝众国的意味。“列国中的华美”保留诗性而不过度解释。
- source_word: תִּפְאֶרֶת גְּאוֹן כַּשְׂדִּים
  choice: 迦勒底人引以为傲的荣耀
  rationale: תִּפְאֶרֶת 表示荣耀、华美；גְּאוֹן 可指威荣，也可带骄傲意味。正文以“引以为傲”保留审判语境中的负面色彩，同时用脚注说明中性理解。
- source_word: כַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留希伯来文中的族称，不泛化为“巴比伦人”。
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: 像上帝倾覆……一样
  rationale: מַהְפֵּכָה 指彻底倾覆；将上帝明确表达为施事者，比名词化结构更符合现代汉语。
- source_word: אֶת סְדֹם וְאֶת עֲמֹרָה
  choice: 所多玛和蛾摩拉
  rationale: 采用现代中文圣经传统中通行的两个城名。
theological_decisions:
- issue: 审判神谕中 גְּאוֹן 的含义
  choice: 正文表达为“引以为傲”
  alternative: “威荣”或“尊荣”
  rationale: 该词既可中性地指威荣、尊荣，也常在以赛亚书的审判语境中指人的骄傲。正文保留语境中的道德锋芒，脚注则明示其真实的词义歧义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“列国中的华美”与“引以为傲的荣耀”保持希伯来诗句的并列结构；“必像上帝倾覆……一样”清楚表达预言性的未来审判。
