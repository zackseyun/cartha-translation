base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/021.yaml
  text: But desert creatures will lie down there[a], and their houses will be full of owls; ostriches will dwell there[b], and wild goats will dance there.
translation:
  language: zh_hans
  text: 旷野的动物必伏卧在那里；那里的房屋必充满鸮鸟[a]；鸵鸟必栖居在那里，野山羊[b]必在那里跳舞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鸮鸟”所译的希伯来词含义不确定；也可理解为“哀号的兽类”或“豺狼”。
    reason: lexical_alternative
  - marker: b
    text: “野山羊”所译的希伯来词也可指“山羊鬼”或“萨提尔”（半人半羊的神怪）。
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָבְצוּ
  choice: 必卧
  rationale: רבץ常指动物伏卧、歇息；“必卧”既保留动物占据废墟的画面，也符合预言语体。
- source_word: צִיִּים
  choice: 旷野的走兽
  rationale: 该词泛指荒漠或废墟中的生物，难以确定具体物种；此译避免作过度具体的辨认。
- source_word: וּמָלְאוּ בָתֵּיהֶם
  choice: 他们的房屋必充满
  rationale: 保留希伯来文第三人称复数所有格，不擅自明确其指代对象。
- source_word: אֹחִים
  choice: 鸮鸟
  rationale: 该动物名称的确切所指不明；“鸮鸟”承接传统理解并适合废墟意象，同时以脚注注明其他可能。
- source_word: וְשָׁכְנוּ
  choice: 必住
  rationale: שׁכן表示居住、栖居；“必住”自然简洁，并与预言中的将来景象相合。
- source_word: בְּנוֹת יַעֲנָה
  choice: 鸵鸟
  rationale: 这是希伯来语的动物名称表达，直译为“鸵鸟之女”在现代汉语中不自然，故采用通常的物种名称。
- source_word: וּשְׂעִירִים
  choice: 野山羊
  rationale: 该词基本义为多毛的公山羊，也可能在某些语境中带有神怪或鬼魔意味；正文采用较稳妥的动物义，脚注保留另一层可能。
- source_word: יְרַקְּדוּ
  choice: 跳舞
  rationale: רקד可指跳舞、蹦跳；“跳舞”保留诗句鲜明而诡异的拟人化画面。
theological_decisions:
- issue: שְׂעִירִים应理解为实际的野山羊，还是带有鬼魔色彩的存在
  choice: 正文译作“野山羊”
  alternative: “山羊鬼”或带有半人半羊神怪意味的存在
  rationale: 该词的基本词义与多毛的山羊有关，但在部分经文中可能具有神怪或鬼魔联想。本节的荒凉景象不要求明确采用鬼魔解释，因此正文不强化其鬼魔含义，同时用脚注保留原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来诗歌的平行结构与重复的“在那里”；“他们的房屋”保留原文所有格指代上的含混，不在正文中擅自补明。
