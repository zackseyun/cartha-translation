  text: The oracle concerning Babylon[a], which Isaiah son of Amoz saw.
translation:
  language: zh_hans
  text: 亚摩斯的儿子以赛亚所看见的关于巴比伦的宣告[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巴比伦的重担”，或“针对巴比伦的宣告”。希伯来语 מַשָּׂא 是先知信息的标题，指分量重大的宣告，常带有审判意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: 宣告
  rationale: 该词在先知书标题中指郑重而分量重大的预言信息，常含审判意味。“宣告”在现代汉语中自然庄重，又不像直译“重担”那样容易被误解。
- source_word: בָּבֶל
  choice: 巴比伦
  rationale: 采用现代中文圣经及一般汉语通行的地名译法。
- source_word: אֲשֶׁר
  choice: 是……所……的
  rationale: 用现代汉语关系结构连接“宣告”与“以赛亚所看见的”，保留原文修饰关系。
- source_word: חָזָה
  choice: 看见
  rationale: 保留原文“看见”的表达，并让上下文承载先知异象的含义，不直接扩译为“在异象中领受”。
- source_word: יְשַׁעְיָהוּ
  choice: 以赛亚
  rationale: 采用现代中文通行的人名译法。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 准确表达希伯来文谱系关系，并符合现代汉语表达。
- source_word: אָמֽוֹץ
  choice: 亚摩斯
  rationale: 采用现代中文圣经中对先知以赛亚之父 Amoz 的通行译名；此人不同于先知阿摩司。
theological_decisions:
- issue: 先知性标题 מַשָּׂא 的译法
  choice: 关于巴比伦的宣告
  alternative: 巴比伦的重担；针对巴比伦的判词
  rationale: “关于”保留原文属格关系的宽泛性，不预先把它限定为“针对”；“宣告”表达先知信息的郑重性质，同时脚注说明其可能包含“重担”和审判性判词的意味。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留“所看见的”这一源语意象，以呈现先知启示的视觉性而不作过度解释。
