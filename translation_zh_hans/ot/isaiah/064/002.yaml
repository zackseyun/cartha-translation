  text: בַּ/עֲשׂוֹתְ/ךָ֥ נוֹרָא֖וֹת לֹ֣א נְקַוֶּ֑ה יָרַ֕דְתָּ מִ/פָּנֶ֖י/ךָ הָרִ֥ים נָזֹֽלּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/002.yaml
  text: When you did awesome things that we did not expect[a], you came down[b]; the mountains quaked before you.
translation:
  language: zh_hans
  text: 当你行了我们未曾料想的可畏之事时，你降临；群山在你面前流泻。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流泻”也可译作“震动”或“熔化”；希伯来文动词描绘流动、溶解的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲשׂוֹתְךָ
  choice: 当你行……时
  rationale: 介词 בְּ 加不定式构造式及第二人称阳性单数词尾，在这里自然表达时间关系；译法既贴近句法，又符合现代汉语。
- source_word: נוֹרָאוֹת
  choice: 可畏之事
  rationale: 该词指令人敬畏、震撼的作为。“可畏”保留由 ירא 所带出的威严与令人战兢之意，避免现代汉语“可怕”偏向纯粹负面的含义。
- source_word: לֹא נְקַוֶּה
  choice: 我们未曾料想的
  rationale: קוה 可指等候、盼望或期待；此处表示这些作为超出人的预期。“未曾料想”在汉语中自然，同时不把意思限定为“未曾盼望”。
- source_word: יָרַדְתָּ
  choice: 你降临
  rationale: ירד 的基本义是下来；在神显语境中，“降临”既保留向下而来的动作，又符合庄重而自然的汉语表达。
- source_word: מִפָּנֶיךָ
  choice: 在你面前
  rationale: 字面为“从你面前／从你的面容之前”，在此表示群山因上帝临在而产生的反应；“在你面前”简洁地保留这种关系。
- source_word: הָרִים
  choice: 群山
  rationale: הָרִים 是复数“山”。“群山”比“众山”更符合现代汉语诗体。
- source_word: נָזֹלּוּ
  choice: 消融如水
  rationale: 该动词呈现流动、熔化或溶解的意象。直译“流下”容易让汉语读者误解为山体位移；“消融如水”保留群山在神面前仿佛化为流体的鲜明诗意，同时脚注列出其他可能理解。
theological_decisions:
- issue: 上帝降临时群山的反应
  choice: 保留群山仿佛消融、流动的具体神显意象
  alternative: 群山震动；群山熔化
  rationale: 希伯来文的动词具有流动或溶解的诗性画面，不宜只概括为震动。“消融如水”呈现受造界在上帝临在面前仿佛失去固态的张力，但不把这一诗歌意象解释为某种特定物理事件。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可畏之事”保持神圣威严，不使用容易显得口语化或含义泛化的“了不起的事”；分号保留原句中上帝作为与群山反应之间紧密而有层次的关系。
