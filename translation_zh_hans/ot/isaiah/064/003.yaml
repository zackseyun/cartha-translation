  text: וּ/מֵ/עוֹלָ֥ם לֹא שָׁמְע֖וּ לֹ֣א הֶאֱזִ֑ינוּ עַ֣יִן לֹֽא רָאָ֗תָה אֱלֹהִים֙ זוּלָ֣תְ/ךָ֔ יַעֲשֶׂ֖ה לִ/מְחַכֵּה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/003.yaml
  text: From of old no one has heard, no ear has listened, no eye has seen a God besides you, who acts for the one who waits for him.
translation:
  language: zh_hans
  text: 自古以来，没有人听见过，没有耳朵侧耳听过，也没有眼睛见过除你以外、为等候他的人行事的神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自古以来，人未曾听见，耳未曾侧耳听，眼未曾看见：除你以外，没有神为等候他的人行事。”希伯来文前半句的主语未明说；末句也可按这种较接近原文语序的方式理解。
    reason: 保留前半句未明说的主语，以及末句“除你以外”与“为等候他的人行事”之间的句法关联；明确否定所支配的整句，避免误解为承认别神存在。
lexical_decisions:
- source_word: וּמֵעוֹלָם
  choice: 自古以来
  rationale: 表达从遥远过去直到如今的时间范围，符合现代汉语习惯。
- source_word: לֹא שָׁמְעוּ לֹא הֶאֱזִינוּ
  choice: 没有人听见，没有耳朵听闻
  rationale: 前一动词通常指听见，后一动词含留心听、侧耳听之意；结合后文“没有眼睛”，以“耳朵”明确感官上的平行结构，同时避免两个分句机械重复。
- source_word: אֱלֹהִים זוּלָתְךָ
  choice: 有哪一位神在你以外
  rationale: 保留原文“神……在你以外”的结构及其反问意味，不额外加入专名或教派性措辞。
- source_word: יַעֲשֶׂה
  choice: 行事
  rationale: 该动词宾语未明说，泛指神有所作为；“行事”保留其开放性，不擅自补成“施恩”或“预备”。
- source_word: לִמְחַכֵּה לוֹ
  choice: 为等候他的人
  rationale: מְחַכֶּה 表示怀着期待等候；第三人称代词按原文译为“他”。
theological_decisions:
- issue: 末句中神的独特性与作为
  choice: 有哪一位神在你以外，为等候他的人行事
  alternative: 除你以外，从未见过一位为等候他的人行事的神
  rationale: 采用反问表达，使“没有眼睛看见”自然支配后面的内容，同时保留“在你以外”对神独一性的强调，不将句子改写成超出原文的系统神学陈述。
- issue: 与《哥林多前书》2:9的措辞关系
  choice: 按《以赛亚书》希伯来文本独立翻译
  alternative: 采用“神为爱他的人所预备的”
  rationale: 本节原文是“为等候他的人行事”，不是“为爱他的人预备”；不以新约引文形式覆盖本处的希伯来文本。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“听见—听闻—看见”维持听觉与视觉的诗性排比；反问“有哪一位神……”使中文通顺，并保留原文的神学张力。
