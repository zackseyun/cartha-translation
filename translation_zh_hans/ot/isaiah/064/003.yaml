- from: 自古以来，没有人听见，没有耳朵听闻，没有眼睛看见，有哪一位神在你以外，为等候他的人行事。[a]
  to: 自古以来，没有人听见过，没有耳朵侧耳听过，也没有眼睛见过除你以外、为等候他的人行事的神。[a]
  rationale: 修订以自然的现代汉语重建原文的听觉—视觉排比，并以“除你以外、为……行事的神”表达“眼未见过神在你以外”的否定范围。保留“等候”与开放的“行事”，不将其改作“爱”或“预备”。脚注只呈现原文允许的语序和主语歧义，不引入额外神学解释。
