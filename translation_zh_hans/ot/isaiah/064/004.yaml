source:
  edition: WLC
  text: פָּגַ֤עְתָּ אֶת שָׂשׂ֙ וְ/עֹ֣שֵׂה צֶ֔דֶק בִּ/דְרָכֶ֖י/ךָ יִזְכְּר֑וּ/ךָ הֵן אַתָּ֤ה קָצַ֨פְתָּ֙ וַֽ/נֶּחֱטָ֔א בָּ/הֶ֥ם עוֹלָ֖ם וְ/נִוָּשֵֽׁעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/004.yaml
  text: You meet the one who gladly does righteousness[a], those who remember you in your ways. Behold, you were angry, and we sinned; in them we have been a long time[b], and shall we be saved?
translation:
  language: zh_hans
  text: 你迎接那欣然行公义的人[a]，就是那些在你的道路上记念你的人。看哪，你发怒了，我们犯了罪；我们在其中已经很久[b]，我们能得救吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你迎接那欢喜并行公义的人。”希伯来文的两个分词可以并列理解，也可以合起来描述一个欣然行义的人。
    reason: lexical_alternative
  - marker: b
    text: “我们在其中已经很久，我们能得救吗？”这一句的希伯来文在文字和句法上都很难确定。也可译作：“其中有恒久，我们必得救”，或“我们长久在其中，我们能得救吗？”
    reason: alternative_reading
lexical_decisions:
- source_word: פָּגַעְתָּ
  choice: 你迎接
  rationale: 此动词常指“相遇、遇见”；这里以神为主语，“迎接”自然表达神与行义者相遇的正面关系，又不将其解释为代求或敌对遭遇。
- source_word: שָׂשׂ וְעֹשֵׂה צֶדֶק
  choice: 那欣然行公义的人
  rationale: שָׂשׂ 表示欢喜，עֹשֵׂה צֶדֶק 表示行公义。主文采用自然的汉语副词性表达，同时以脚注保留“欢喜并行公义”的并列理解。
- source_word: בִּדְרָכֶיךָ יִזְכְּרוּךָ
  choice: 那些在你的道路上记念你的人
  rationale: 直译介词短语“在你的道路上”，保留其伦理与关系含义；复数动词以“那些……的人”表达，并用“就是”与前面的单数描述自然衔接。
- source_word: הֵן
  choice: 看哪
  rationale: 作为引人注意的话语标记，“看哪”庄重而为现代圣经语体所熟悉。
- source_word: קָצַפְתָּ וַנֶּחֱטָא
  choice: 你发怒了，我们也犯了罪
  rationale: 分别直陈神的愤怒与群体的犯罪；“也”维持并列推进，避免把二者之间的时间或因果关系规定得过细。
- source_word: בָּהֶם
  choice: 在其中
  rationale: 代词所指不明确，可能回指神的道路，也可能指前述情形；“其中”刻意保留这种含混。
- source_word: עוֹלָם
  choice: 已经很久
  rationale: 此处可表示长久、持续或古时；“已经很久”表达延续的时间，而不武断地译成绝对的“永远”。
- source_word: וְנִוָּשֵׁעַ
  choice: 还能得救吗？
  rationale: Niphal 形式表示“得救”。结合哀诉语境，主文采用反问；“还”体现前句长期处境所带来的张力，但脚注说明陈述式理解也可能。
theological_decisions:
- issue: 末句 וְנִוָּשֵׁעַ 是疑问还是陈述
  choice: 译作反问：“还能得救吗？”
  alternative: 译作陈述：“我们必得救”或“我们就得救了”
  rationale: 希伯来文没有明示疑问标记，整句语法又极其困难。反问较符合悔罪哀诉的张力，但不能排除陈述式的盼望，因此在脚注中保留另一读法。
- issue: בָּהֶם 的指代
  choice: 使用不明确的“其中”
  alternative: 明确译作“在你的道路上”或“在这些罪中”
  rationale: 原文代词可能有不同回指。主文不把它限定为神的道路、罪或某种处境，以免加入特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话圣经语体。“看哪”“行公义”“记念”保留经文的庄重感；末半句不刻意润饰其断裂与含混，以忠实呈现原文的文本困难和神学张力。
