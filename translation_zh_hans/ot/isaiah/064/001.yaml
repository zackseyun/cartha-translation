source:
  edition: WLC
  text: כִּ/קְדֹ֧חַ אֵ֣שׁ הֲמָסִ֗ים מַ֚יִם תִּבְעֶה אֵ֔שׁ לְ/הוֹדִ֥יעַ שִׁמְ/ךָ֖ לְ/צָרֶ֑י/ךָ מִ/פָּנֶ֖י/ךָ גּוֹיִ֥ם יִרְגָּֽזוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/001.yaml
  text: As when fire kindles brushwood[a], and fire causes water to boil, to make your name known to your adversaries[c][b], so that nations tremble at your presence—
translation:
  language: zh_hans
  text: 正如火点燃干柴[a]，火使水沸腾[b]，使你的名为你的敌人所知；列国在你面前战栗——[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “干柴”所译的希伯来词很罕见，也可译作“碎枝”或“枯草”，指容易燃着的材料。
    reason: lexical_alternative
  - marker: b
    text: “使水沸腾”也可译作“使水冒泡”。
    reason: lexical_alternative
  - marker: c
    text: 在一些英文经文编号传统中，本行编为以赛亚书63章19节下半节。
    reason: textual_variant
lexical_decisions:
- source_word: כִּקְדֹחַ
  choice: 好像……点燃
  rationale: כְּ引出比喻，קדח的不定式表达点燃或燃烧；此译既保留比较结构，也符合现代汉语表达。
- source_word: אֵשׁ
  choice: 火
  rationale: 直接对应原文，并保留本节反复出现的意象。
- source_word: הֲמָסִים
  choice: 干柴
  rationale: 该罕见词的确切所指不明，语境表明是容易燃着的材料；“干柴”自然易懂，同时以脚注保留“碎枝、枯草”等可能。
- source_word: מַיִם תִּבְעֶה אֵשׁ
  choice: 火使水沸腾
  rationale: 本句第二个“火”作主语，תִּבְעֶה在此指使水沸腾或冒泡；译文保留原文因果图景。
- source_word: לְהוֹדִיעַ
  choice: 愿你使……所知
  rationale: ידע的使役式不定式意为“使人知道”。结合本节承接上文祈愿的句法，加入“愿你”使中文关系清楚，但不补入上节的完整措辞。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 保留圣经中“名”所承载的身份、声誉与自我彰显，不将其窄化为单一解释。
- source_word: לְצָרֶיךָ
  choice: 敌对你的人
  rationale: צַר指对头或敌人；此译准确表达关系上的敌对，又比单纯的军事化用语更宽。
- source_word: מִפָּנֶיךָ
  choice: 在你面前
  rationale: 原文习语可指“因你的临在”或“在你面前”；此译保留面对上帝显现的空间与临在意味。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 指各国或万邦；“列国”符合先知诗歌的庄重语体，且不误导为专指某一族群。
- source_word: יִרְגָּזוּ
  choice: 战抖
  rationale: 该动词表示震动、战栗或骚动；“战抖”自然呈现列国面对神显现时的强烈反应。
theological_decisions:
- issue: 本节与上文祈求的句法关系
  choice: 将本节译为承接上文祈愿的比较性图景，并用“愿你”显明目的句的祈求语气，不在正文重述上一节的内容。
  alternative: 把本行并入前一节，明确补出“愿你裂天而降”等措辞。
  rationale: 希伯来文本以比较结构开头，意义依赖前文，却没有重述前文的祈求；译文应让这种延续可感，同时不把别节文字移入本节。
- issue: 神显现的火与沸水意象
  choice: 保留火点燃燃料、使水沸腾以及列国战抖的多重诗性效果。
  alternative: 把意象专门解释为审判，或专门解释为洁净。
  rationale: 原文兼具强烈显现、使敌对者认识神之名以及列国战栗等意味，不应将其神学作用限制为单一类别。
- issue: “使你的名为敌对你的人所知”的方向
  choice: 译为向敌对者彰显神的名。
  alternative: 译成针对敌人的惩罚性宣告。
  rationale: לְצָרֶיךָ自然表达认知对象；保留“使……所知”可避免把彰显之意提前限定为纯粹惩罚。
translation_notes:
  register: 采用现代、庄重而易懂的汉语诗歌语体。“好像”保留承接上文的比喻结构；分号区分自然意象与祈愿目的，句末破折号表示诗句仍向后延续。按所给经文编号处理；未加入英语传统编号差异的脚注，因为该差异并非希伯来文本异文，且用户所给参考已明确为以赛亚书64:1。
