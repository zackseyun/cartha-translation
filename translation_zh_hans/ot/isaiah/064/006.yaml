  text: וְ/אֵין קוֹרֵ֣א בְ/שִׁמְ/ךָ֔ מִתְעוֹרֵ֖ר לְ/הַחֲזִ֣יק בָּ֑/ךְ כִּֽי הִסְתַּ֤רְתָּ פָנֶ֨י/ךָ֙ מִמֶּ֔/נּוּ וַ/תְּמוּגֵ֖/נוּ בְּ/יַד עֲוֺנֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/006.yaml
  text: And there is no one who calls on your name[a], who stirs himself up to take hold of you; for you have hidden your face from us and have given us over into the hand of our iniquity.
translation:
  language: zh_hans
  text: 没有人求告你的名，也没有人奋起要抓住你；因为你向我们掩面，使我们在自己罪孽的手中消融。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在自己罪孽的手中”也可指在自己罪孽的权势下，或借着自己罪孽而如此。原文动词带有融化、瓦解或衰败的意象；也可按上下文理解为神任凭我们落在自己罪孽的权势下。
    reason: 保留“手”的原文意象及其可表达的权势或媒介含义，并说明“消融”的词汇意象和上下文层面的理解。
lexical_decisions:
- source_word: וְאֵין
  choice: 没有人
  rationale: 以现代汉语自然表达存在否定，并保留无人如此行的绝对语气；句首连接关系由上下文承接，不机械译出“并且”。
- source_word: קוֹרֵא בְשִׁמְךָ
  choice: 求告你的名
  rationale: 保留希伯来语借“名”表达呼求、祷告和敬拜的惯用说法，也符合庄重而易懂的现代中文。
- source_word: מִתְעוֹרֵר
  choice: 奋起
  rationale: 该词为反身形态，表示主动唤起自己采取行动；“奋起”简洁地传达自我振作和主动回应的意味。
- source_word: לְהַחֲזִיק בָּךְ
  choice: 抓住你
  rationale: 保留 חזק 与介词 בּ 构成的鲜明动作意象，表达竭力亲近并持守神，而不将其抽象化。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出前述无人求告、奋起的缘由，符合本句的因果关系。
- source_word: הִסְתַּרְתָּ פָנֶיךָ מִמֶּנּוּ
  choice: 你向我们掩面
  rationale: 保留“掩面”这一关于神撤回眷顾、显出不悦的核心圣经意象；“向我们掩面”在中文中简洁自然。
- source_word: וַתְּמוּגֵנוּ
  choice: 使我们……消融
  rationale: 直接保留 מוג 所含融化、瓦解、衰败的意象，并保留第二人称神为施事者的语法力度。
- source_word: בְּיַד עֲוֺנֵנוּ
  choice: 在自己罪孽的掌控下
  rationale: “手中”在此表示权势或控制；译为“掌控下”使现代读者清楚理解，同时保留罪孽仿佛辖制人的拟人意象。עָוֹן 在此仍译作“罪孽”，不限定为单指罪责或刑罚。
theological_decisions:
- issue: 末句中神的行动与人的罪孽之间的关系
  choice: 译作神使百姓在自身罪孽的掌控下消融
  alternative: 译作神任凭百姓落在自身罪孽手中，或因罪使他们衰败
  rationale: 原文既明确以神为“使我们消融”的施事者，又将百姓置于他们自己罪孽的“手中”。本译保留神的审判行动、人自身的罪责以及罪孽辖制人的张力，不进一步规定其形而上的因果机制。
- issue: “掩面”的神学意象
  choice: 保留“你向我们掩面”
  alternative: 解释为“你不再眷顾我们”或“你离弃了我们”
  rationale: 原文的身体意象可以表达撤回临在、恩宠或垂顾，但没有在本句中将其精确限定；直保“掩面”可避免过度解释。
translation_notes:
  register: 采用庄重、清晰的现代标准普通话。“求告你的名”“掩面”保留经文的重要意象；“奋起抓住你”保持动作感；末句用“掌控下消融”兼顾希伯来语意象与现代中文可理解性。脚注标记置于其实际所说明的末句之后。
