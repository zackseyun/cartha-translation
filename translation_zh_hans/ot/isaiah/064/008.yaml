id: ISA.64.8
reference: Isaiah 64:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַל תִּקְצֹ֤ף יְהוָה֙ עַד מְאֹ֔ד וְ/אַל לָ/עַ֖ד תִּזְכֹּ֣ר עָוֺ֑ן הֵ֥ן הַבֶּט נָ֖א עַמְּ/ךָ֥ כֻלָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/008.yaml
  text: 'Do not be exceedingly angry[a], O Yahweh, and do not remember iniquity forever. Look, please: we are all your people.'
translation:
  language: zh_hans
  text: 雅威啊，求你不要过度发怒，也不要永远记住罪孽[a]。看哪，求你垂看：我们都是你的子民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“罪责”。希伯来语“עָוֹן”既可指罪恶行为，也可指由此产生的罪责。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּקְצֹף ... עַד מְאֹד
  choice: 求你不要过度发怒
  rationale: קצף在此表示发怒、震怒；אַל与未完成式构成否定祈求。עַד מְאֹד加强程度，译为“过度”既贴近原文，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中通行的音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以称号代替。
- source_word: וְאַל לָעַד תִּזְכֹּר עָוֹן
  choice: 也不要永远记住罪孽
  rationale: 保留זכר“记住”的原文意象；在本段悔罪祷告中，它含有为审判而记念、不忘其罪的意味，但正文不将这一含义解释性扩写。
- source_word: עָוֹן
  choice: 罪孽
  rationale: עָוֹן可兼指罪恶行为及其所带来的罪责。“罪孽”保留其道德分量，脚注说明“罪责”这一语境上可行的译法。
- source_word: הֵן הַבֶּט נָא
  choice: 看哪，求你垂看
  rationale: הֵן是唤起注意的感叹语，译作“看哪”；הַבֶּט是“看”的命令式，נָא带恳求语气，合译为“求你垂看”，保留原文看似重复却富有迫切感的呼求。
- source_word: עַמְּךָ כֻלָּנוּ
  choice: 我们都是你的子民
  rationale: 原文为无系词名词句，直陈“你的子民——我们所有人”；此译自然表达全体共同诉诸盟约关系的意味。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；采用音译“雅威”可保留专名性质，避免以称号“主”取代，也不依赖较晚形成的混合读音。
- issue: 悔罪祷告中עָוֹן的语义
  choice: 罪孽
  alternative: 罪责
  rationale: 本词可能侧重所犯的罪，也可能侧重犯罪所招致的罪责。正文采用较能兼顾道德行为与归罪意味的“罪孽”，并以脚注保留另一可能，不把经文限定为单一神学解释。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“求你”传达否定祈使与נָא的恳求口吻；“看哪，求你垂看”刻意保留原文两个引人注目／观看表达的并列。脚注标记置于“罪孽”之后，使其与实际说明的词对应。
