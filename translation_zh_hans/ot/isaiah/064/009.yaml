  yaml_path: translation/ot/isaiah/064/009.yaml
  text: Your holy cities have become a wilderness; Zion has become a wilderness[a], Jerusalem a desolation.
translation:
  language: zh_hans
  text: 你的圣城都成了旷野；锡安成了旷野[a]，耶路撒冷成了荒场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旷野”也可译作“荒野”或“沙漠”；本节两处 מִדְבָּר 同。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי קָדְשְׁךָ
  choice: 你的圣城
  rationale: 这是“你之圣洁的城邑”的构造短语；译作“你的圣城”既自然，也保留了归属与神圣之意。原文为复数，汉语以“都”明确其复数整体性。
- source_word: הָיוּ / הָיָתָה
  choice: 成了
  rationale: 完成体在哀歌语境中表示变化后所形成的现状；“成了”简洁地传达从先前景况到如今荒废状态的转变。
- source_word: מִדְבָּר
  choice: 旷野
  rationale: 该词可指旷野、荒野或沙漠；此处着重城市荒废无人，而非特指干旱地貌，因此采用传统而宽泛的“旷野”。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经语境中通行的专名译法。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文通行的专名译法。
- source_word: שְׁמָמָה
  choice: 荒场
  rationale: 原词为名词，指荒凉、毁坏之地；“荒场”保留名词性和诗行中的谓语平行结构，并避免与前面的“旷野”完全同义重复。
