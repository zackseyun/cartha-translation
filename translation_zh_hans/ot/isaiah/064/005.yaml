  text: וַ/נְּהִ֤י כַ/טָּמֵא֙ כֻּלָּ֔/נוּ וּ/כְ/בֶ֥גֶד עִדִּ֖ים כָּל צִדְקֹתֵ֑י/נוּ וַ/נָּ֤בֶל כֶּֽ/עָלֶה֙ כֻּלָּ֔/נוּ וַ/עֲוֺנֵ֖/נוּ כָּ/ר֥וּחַ יִשָּׂאֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/005.yaml
  text: We all became like one who is unclean[a], and all our righteous deeds are like a filthy garment; we all wither like a leaf, and our iniquities carry us away like the wind.
translation:
  language: zh_hans
  text: 我们都成了像不洁净的人一样；我们一切的义行都像污秽的衣服[a]。我们都像叶子一样枯萎；我们的罪孽如风把我们卷走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 更具体地说，或译：“像经期不洁的衣服。”
    reason: 原文 עִדִּים 指向与月经有关的不洁；该细节具有词义价值，但置于脚注可使正文保持自然、庄重。
lexical_decisions:
- source_word: וַנְּהִי כַטָּמֵא כֻּלָּנוּ
  choice: 我们都成了不洁净的人
  rationale: וַנְּהִי 表达进入某种状态，译作“成了”；כַטָּמֵא 是“像不洁净者”，汉语用“不洁净的人”自然表达其人格性，同时不把不洁限定为单纯礼仪或单纯道德意义。
- source_word: וּכְבֶגֶד עִדִּים
  choice: 像污秽的衣服[a]
  rationale: עִדִּים 在此涉及经期不洁。正文采用庄重而易懂的概括表达，具体含义保留在脚注中。
- source_word: כָּל צִדְקֹתֵינוּ
  choice: 我们一切的义行
  rationale: 复数 צִדְקֹת 指具体的正义行为或善行；“义行”既保留复数所指的具体行动，也符合经文语体。
- source_word: וַנָּבֶל כֶּעָלֶה כֻּלָּנוּ
  choice: 我们都像叶子一样枯萎
  rationale: נבל 描写植物凋萎；“枯萎”与叶子的比喻自然搭配，并保留衰败意象。
- source_word: וַעֲוֺנֵינוּ
  choice: 我们的罪孽
  rationale: עָוֹן 可涵盖罪恶、罪责及其后果；“罪孽”保留其沉重的道德意味，不将范围缩窄为一般性的“罪”。
- source_word: כָרוּחַ יִשָּׂאֻנוּ
  choice: 如风把我们卷走
  rationale: נשא 的基本义为抬起、带走；结合叶子与风的图像，“卷走”在现代汉语中自然而形象，也表达无法抗拒地被带离。
theological_decisions:
- issue: 认罪中“不洁净”的性质
  choice: 保留“不洁净”及“污秽的衣服”的意象，不把它限定为纯礼仪性或纯道德性的陈述。
  alternative: 将此处只解释为礼仪不洁，或直接改写为某一系统神学命题。
  rationale: 原文借不洁的意象作悔罪认信，其礼仪背景与道德力量彼此交织；译文应保留这种张力，不引入经文未明说的后期教义表述。
- issue: 义行与污秽衣服的对照
  choice: 直译为“我们一切的义行都像污秽的衣服”。
  alternative: 将“义行”弱化为表面善行，或补充说明这些行为因动机、罪性等原因而无效。
  rationale: 经文本身作出强烈对照，却没有在本节解释其机制；译文不应替原文补足特定神学解释。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。“义行”“罪孽”保留经文语体和道德分量；句式保持诗歌式的平行与递进。
