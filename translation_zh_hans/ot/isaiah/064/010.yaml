source:
  edition: WLC
  text: בֵּ֧ית קָדְשֵׁ֣/נוּ וְ/תִפְאַרְתֵּ֗/נוּ אֲשֶׁ֤ר הִֽלְל֨וּ/ךָ֙ אֲבֹתֵ֔י/נוּ הָיָ֖ה לִ/שְׂרֵ֣פַת אֵ֑שׁ וְ/כָל מַחֲמַדֵּ֖י/נוּ הָיָ֥ה לְ/חָרְבָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/010.yaml
  text: Our holy and beautiful house[a], where our fathers praised you, has become a burning with fire[b], and all our precious things have become a ruin.
translation:
  language: zh_hans
  text: 我们圣洁荣美的殿，就是我们列祖赞美你的地方，已经被火焚烧[a]；我们一切珍爱的，都成了废墟[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于“成了火焚之物”。
    reason: 保留原文名词性结构的形式信息。
  - marker: b
    text: “废墟”也可译作“荒场”或“荒凉之地”。
    reason: 说明חָרְבָּה的词义范围。
lexical_decisions:
- source_word: בֵּית קָדְשֵׁנוּ וְתִפְאַרְתֵּנוּ
  choice: 我们圣洁荣美的殿
  rationale: 原文直译近于“我们圣洁和荣美之殿”。“殿”依敬拜语境自然指圣殿；“圣洁荣美”既保留两个并列属性，也符合现代汉语的庄重表达。
- source_word: אֲשֶׁר הִלְלוּךָ אֲבֹתֵינוּ
  choice: 就是我们列祖赞美你的地方
  rationale: אֲשֶׁר在此引出指向“殿”的处所性关系从句；“列祖”准确保留אֲבֹתֵינוּ的阳性、历史与群体意味，又比直译“父亲们”更符合汉语圣经语体。
- source_word: הִלְלוּךָ
  choice: 赞美你
  rationale: הלל的Piel形在敬拜语境中的常用义是“赞美”，直接而明确。
- source_word: הָיָה לִשְׂרֵפַת אֵשׁ
  choice: 已经被火焚烧
  rationale: 希伯来语名词性表达直译近于“成了火的焚烧”。汉语若照搬会生硬，“被火焚烧”自然传达其结果与毁灭力度；脚注保留更贴近原文形式的译法。
- source_word: מַחֲמַדֵּינוּ
  choice: 我们一切珍爱的
  rationale: 该词可指可喜爱、宝贵或珍藏的事物。“珍爱的”兼顾价值与情感，又不把所指限定为器物。
- source_word: לְחָרְבָּה
  choice: 成了废墟
  rationale: חָרְבָּה表示荒废、毁坏后的废墟或荒场。“废墟”具体、自然，并与圣殿及其珍爱之物遭毁的语境相合。
theological_decisions:
- issue: “我们圣洁荣美的殿”所指为何
  choice: 主要指耶路撒冷圣殿
  alternative: 泛指耶路撒冷或全地的圣所
  rationale: “殿”以及“列祖赞美你的地方”最直接指向圣殿；上下文虽哀叹锡安和耶路撒冷，本文不必将所指扩大。
- issue: אֲבֹתֵינוּ的译法
  choice: 我们列祖
  alternative: 我们的祖先
  rationale: 原文为阳性复数“父辈”。“列祖”在现代汉语中能保留父系、盟约历史的色彩，且不会像“我们的父亲们”那样引起仅指亲生父亲的误解。
- issue: מַחֲמַדֵּינוּ的范围
  choice: 保持为未明确限定的“我们一切珍爱的”
  alternative: 特指圣殿中的珍宝或器物
  rationale: 原文没有明确列举所指，可能包括珍贵器物、建筑或其他所珍爱的事物，因此不在译文中缩窄其范围。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“圣洁荣美的殿”“列祖”保留诗性与历史感；句子以分号分隔圣殿被焚和珍爱之物荒废两个平行悲叹。所有脚注标记均置于对应主文之后。
