source:
  edition: WLC
  text: וְ/עַתָּ֥ה יְהוָ֖ה אָבִ֣י/נוּ אָ֑תָּה אֲנַ֤חְנוּ הַ/חֹ֨מֶר֙ וְ/אַתָּ֣ה יֹצְרֵ֔/נוּ וּ/מַעֲשֵׂ֥ה יָדְ/ךָ֖ כֻּלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/007.yaml
  text: But now, O Yahweh, you are our Father; we are the clay, and you are our potter; we all are the work of your hand.
translation:
  language: zh_hans
  text: 但现在，耶和华啊，你是我们的父；我们是泥，你是塑造我们的陶匠；我们全都是你手所做的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 但现在
  rationale: 连词加时间副词承接前文，并带出转折性的恳求；“但现在”既保留语篇转折，也符合现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名形式译出四字神名，不以“主”这一称号替代。
- source_word: אָבִינוּ אָתָּה
  choice: 你是我们的父
  rationale: 保留“父”的亲属与盟约关系意象；独立代词具有强调作用，译文以“你是”自然呈现。
- source_word: אֲנַחְנוּ הַחֹמֶר
  choice: 我们是泥
  rationale: 在陶匠意象中，חֹמֶר指供塑造的泥；汉语无需机械表达希伯来语定冠词，“泥”简洁自然。
- source_word: וְאַתָּה יֹצְרֵנוּ
  choice: 你是塑造我们的陶匠
  rationale: יֹצֵר本义为塑造者；与“泥”并列时指陶匠。加入“塑造我们的”明确保留一复数后缀“我们的”，避免仅说“我们的陶匠”可能产生的领属歧义。
- source_word: וּמַעֲשֵׂה יָדְךָ
  choice: 你手所做的
  rationale: 贴近“你手的作品”这一结构，保留拟人化的“手”，同时用自然汉语表达。
- source_word: כֻּלָּנוּ
  choice: 我们全都
  rationale: 该词置于句末而受强调；“我们全都”保留群体无一例外的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名，应译作专名而非称号。“耶和华”是现代简体中文圣经语境中广泛通行且易于识别的专名形式；“雅威”更接近学界常见的拟音，但普通读者熟悉度较低。
- issue: 称上帝为 אָבִינוּ
  choice: 我们的父
  alternative: 我们的父亲；我们的双亲
  rationale: 原文明确使用阳性亲属称谓“父”，故不改为中性称谓；“父”用于庄重的直接呼告，也比口语性的“父亲”更贴合诗体。
- issue: 陶匠与泥的主权意象
  choice: 保留“泥—陶匠—手所做”的完整比喻
  alternative: 意译为“你创造并掌管我们”
  rationale: 原文借工匠塑造材料表达群体与上帝的关系；保留意象可避免把其中的创造、归属与可塑性压缩成单一教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。以分号保留原文三组平行陈述。称呼“耶和华啊”体现直接呼告；不添加原文没有的解释性神学术语。
