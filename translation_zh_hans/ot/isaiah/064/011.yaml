  text: הַ/עַל אֵ֥לֶּה תִתְאַפַּ֖ק יְהוָ֑ה תֶּחֱשֶׁ֥ה וּ/תְעַנֵּ֖/נוּ עַד מְאֹֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/011.yaml
  text: Will you restrain yourself over these things[b][a], O Yahweh? Will you keep silent and afflict us so very severely?
translation:
  language: zh_hans
  text: 雅威啊，因着这一切[a]，你还要克制自己吗？你还要默不作声，使我们受苦到极点[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于这一切”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使我们极其卑微”。这个希伯来语动词可表示使人受苦，也可表示使人降卑。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: 面对这一切
  rationale: 疑问词 הַ 与介词 עַל 构成反问；עַל 在这里可表示所面对的事态、缘由或关涉对象。结合上文所述的毁坏，“面对这一切”既自然，也保留了这些灾情是发问缘由的意味。
- source_word: תִתְאַפַּק
  choice: 克制自己
  rationale: אפק 的 Hitpael 形式表示自我约束、按捺不动；此处质问雅威是否仍不采取行动。“克制自己”保留了反身含义，又不擅自限定他所按捺的是行动、愤怒还是怜悯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: תֶּחֱשֶׁה
  choice: 默不作声
  rationale: 该动词表示沉默、不出声；“默不作声”符合哀歌中质问的语气，并与下句的受苦相连。
- source_word: וּתְעַנֵּנוּ
  choice: 使我们受苦
  rationale: 此处最可能是 ענה 的 Piel 形式，表示使人受苦、苦待或使人卑微。上下文是群体在严重灾祸中的哀诉，因此正文采用自然明确的“使我们受苦”，并以脚注保留“使我们卑微”的可能。
- source_word: עַד מְאֹד
  choice: 到极点
  rationale: 这一短语强烈表示程度，意为极其、非常之甚；“到极点”简洁地传达受苦程度之深。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文音译为“雅威”，以保留其作为以色列之神专名的功能，而不以“主”这一称号替换。
- issue: 雅威“克制自己”的具体所指
  choice: 不在正文中明确所克制的是行动、愤怒或怜悯
  alternative: 解释为不施怜悯或不出手拯救
  rationale: 原文只表达自我约束，并未明说所约束的具体对象。上下文暗示百姓盼望神采取行动，但译文应保留这种开放性。
- issue: וּתְעַנֵּנוּ 的语义
  choice: 使我们受苦
  alternative: 使我们卑微
  rationale: 在毁坏与群体哀诉的语境中，“使我们受苦”最贴切；但该动词也可带有使人降卑的含义，因此在脚注中保留另一译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个连续的“你还要……吗”传达原文反问和哀诉的力度；“面对这一切”承接上文灾情，“到极点”保留 עַד מְאֹד 的强烈程度。
