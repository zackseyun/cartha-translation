  source_fidelity: “攻击”将נגשׂ（此处指彼此施压、欺压）的含义强化为直接攻击；且正文先说“彼此欺压”，再以“攻击”展开，造成不必要的语义升级。宜在两个分配性短语中保持“欺压”，以贴合原文及英语审校记录。末句的נקלֶה主要指受轻视、地位低微者；“卑贱”在现代汉语中较易带本质或道德贬义，宜改为“受轻视的人”。
  naturalness: 修订后以“人欺压人，各人欺压邻舍”保留原文重复和分配性强调，仍为自然、庄重的现代书面普通话。“骄横”简洁传达对长者和受尊重者的傲慢、放肆态度。
  terminology: “少年人／老年人”恰当地保留年龄对比；脚注保留זָקֵן亦可指有资历、地位者的可能。“受轻视的人／受尊重的人”准确呈现נקלֶה与נכבד的社会评价对照，避免把前者道德化。
