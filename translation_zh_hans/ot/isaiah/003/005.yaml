revisions:
- from: 百姓彼此欺压——这人攻击那人，各人攻击邻舍；少年人傲慢地对待老年人[a]，卑贱的人也傲慢地对待尊贵的人。
  to: 百姓必彼此欺压——人欺压人，各人欺压邻舍；少年人必向老年人骄横，受轻视的人必向受尊重的人骄横。
  rationale: 修订以“欺压”一致翻译本节描述敌对社会压力的动词，保留“人……各人……”的分配性平行与普遍性。“骄横”表达后半节的傲慢放肆，而“受轻视的人”与“受尊重的人”则清楚保留社会地位和评价的反转对照。
