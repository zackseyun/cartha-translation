base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/005.yaml
  text: And the people will oppress one another—man against man[a], and each against his neighbor; the youth will act arrogantly toward the elder[c][b], and the despised toward the honored.
translation:
  language: zh_hans
  text: 百姓必彼此欺压——人欺压人，各人欺压邻舍；少年人必向老年人骄横，受轻视的人必向受尊重的人骄横。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִגַּשׂ
  choice: 彼此欺压
  rationale: 该词为 נגשׂ 的尼法勒形式；在这里描写社会秩序崩溃下人与人之间相互施压、欺凌。“彼此欺压”既表达敌对含义，也自然体现其相互性。
- source_word: אִישׁ בְּאִישׁ וְאִישׁ בְּרֵעֵהוּ
  choice: 这人攻击那人，各人攻击邻舍
  rationale: 两个带 בְּ 的分配性平行短语强调普遍而相互的敌对。“这人攻击那人”用自然汉语传达 אִישׁ בְּאִישׁ，“各人攻击邻舍”保留第二短语及其明确的冲突意味。
- source_word: יִרְהֲבוּ
  choice: 傲慢地对待
  rationale: רהב 在此表示骄横、放肆地对待别人；“傲慢地对待”清楚表达对正常社会等级与敬重秩序的冒犯。
- source_word: הַנַּעַר
  choice: 少年人
  rationale: 该词可指男孩、青年或年轻人；此处与 זָקֵן 对举，重点是年龄与社会位置的反常关系。“少年人”简洁而庄重。
- source_word: בַּזָּקֵן
  choice: 老年人
  rationale: זָקֵן 可指年老者，也可指有社会地位的长老。正文采用直接体现年龄对比的“老年人”，并以脚注保留“长老”的可能性。
- source_word: הַנִּקְלֶה
  choice: 卑贱的人
  rationale: 该词表示被人轻看、地位低微者；“卑贱的人”在此侧重社会评价和地位，与“尊贵的人”形成准确对照，并非断言其道德败坏。
- source_word: בַּנִּכְבָּד
  choice: 尊贵的人
  rationale: 该词源于 כבד，表示受尊重、有分量或地位显要者。“尊贵的人”自然保留其社会荣誉含义，并与“卑贱的人”对称。
theological_decisions:
- issue: 社会秩序反转的性质
  choice: 按预言语境呈现为普遍欺压、傲慢和尊卑秩序倒置
  alternative: 将本节解释为对年轻人或低地位者掌权本身的普遍谴责
  rationale: 经文描写的是审判之下社会关系陷入敌对，以及人以傲慢方式冒犯应受敬重者；译文不把年龄或社会地位本身扩大为跨语境的神学规范。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。破折号展开“彼此欺压”的具体表现；后半句补出第二个“傲慢地对待”，避免汉语中把末句误读为单纯并列身份，同时保留原文两个社会对比。
