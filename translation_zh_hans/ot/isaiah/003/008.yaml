source:
  edition: WLC
  text: כִּ֤י כָשְׁלָה֙ יְר֣וּשָׁלִַ֔ם וִ/יהוּדָ֖ה נָפָ֑ל כִּֽי לְשׁוֹנָ֤/ם וּ/מַֽעַלְלֵי/הֶם֙ אֶל יְהוָ֔ה לַ/מְר֖וֹת עֵנֵ֥י כְבוֹדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/008.yaml
  text: For Jerusalem has stumbled[a], and Judah has fallen, because their tongue and their deeds are against Yahweh, rebelling before the eyes of his glory.
translation:
  language: zh_hans
  text: 原来，耶路撒冷已经失足，犹大已经倒下；因为他们的舌头和行为都敌对雅威，冒犯他荣耀的眼目。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他荣耀的面前悖逆。”希伯来文直译为“悖逆（或冒犯）他荣耀的眼目”，以鲜明而不寻常的方式描写他们公开反抗雅威。
    reason: 说明原文中 לַמְרוֹת 与“他荣耀的眼目”的紧密句法关系，并提供较自然的解释性汉语译法。
lexical_decisions:
- source_word: כִּי
  choice: 原来
  rationale: 句首的 כִּי 承接上文，为先前所宣告的审判提供解释；“原来”在现代汉语中自然地保留这种说明语气。
- source_word: כָשְׁלָה
  choice: 已经绊跌
  rationale: 保留“失足、绊倒”的比喻，不将其过度强化为彻底毁灭；与下句“倒下”构成递进的诗意平行。
- source_word: וִיהוּדָה נָפָל
  choice: 犹大已经倒下
  rationale: 直接表达 נפל 的常见意义，并与“耶路撒冷已经绊跌”保持平行。
- source_word: לְשׁוֹנָם
  choice: 他们的舌头
  rationale: “舌头”转喻言语；保留原文具体而有力的意象，而不平化为“言语”。
- source_word: וּמַעַלְלֵיהֶם
  choice: 和行为
  rationale: מעללים 指人的作为或行径；“行为”简明自然，并涵盖其道德意味。
- source_word: אֶל יְהוָה
  choice: 都敌对雅威
  rationale: 在悖逆的语境中，אֶל 表示言语和行为朝向雅威而与他作对；“敌对”清楚传达这种方向性的对抗。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: לַמְרוֹת
  choice: 公然悖逆
  rationale: מרה 表示抗命、悖逆；结合后面的“眼目”意象，“公然”传达这种悖逆就在神面前发生，但不把动作弱化为单纯的冒犯。
- source_word: עֵנֵי כְבוֹדוֹ
  choice: 在他荣耀的眼目前
  rationale: 尽量保留原文“他荣耀的眼目”这一鲜明而不寻常的表达，同时用“在……前”组成可理解的现代汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用神的专名；“雅威”直接音译该名，避免以称号“主”替代，也不据宗派传统改用其他形式。
- issue: עֵנֵי כְבוֹדוֹ 与 לַמְרוֹת 的关系
  choice: 在他荣耀的眼目前公然悖逆
  alternative: 反抗他荣耀的眼目／在他荣耀的临在中悖逆
  rationale: 将“眼目”理解为悖逆发生于其面前，而不是把神的眼目当作受反抗的对象；同时保留“荣耀的眼目”这一原文中张力鲜明的意象，并以脚注说明较顺畅的译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“绊跌／倒下”保留诗句的平行和递进；“舌头和行为”保留具体意象；末句略带原文的陌生感，并借脚注帮助普通读者理解。
