source:
  edition: WLC
  text: וְ/שִׂפַּ֣ח אֲדֹנָ֔/י קָדְקֹ֖ד בְּנ֣וֹת צִיּ֑וֹן וַ/יהוָ֖ה פָּתְ/הֵ֥ן יְעָרֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/017.yaml
  text: therefore the Lord will strike the crown of the daughters of Zion with scabs[a], and Yahweh will lay bare their private parts.
translation:
  language: zh_hans
  text: 所以，主必使锡安女子的头顶长疮；雅威必使她们的私处裸露[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使她们赤身露体”。这里的希伯来词含义难定；有人认为它较具体地婉指隐私部位，也有人作其他解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׂפַּח
  choice: 必使……长疮
  rationale: 该动词在此表示使人患上疮痂或皮肤病。“使……长疮”既自然易懂，也保留了惩罚和身体受损的含义；句首连接词按上下文译为“所以”。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是表示主宰者的神圣称号，译作“主”，并与后面的神名 יהוה 区分。
- source_word: קָדְקֹד
  choice: 头顶
  rationale: 该词指头的顶部或头顶；“头顶”在现代汉语中明确自然，不会产生王冠之类的歧义。
- source_word: בְּנוֹת צִיּוֹן
  choice: 锡安女子
  rationale: 既保留原文“锡安的女儿们”这一先知性表达的基本意象，又采用现代汉语较自然的群体称谓。
- source_word: וַיהוָה
  choice: 雅威
  rationale: 用音译保留专名 יהוה，并清楚呈现它与本节前半句 אֲדֹנָי“主”的形式差别。
- source_word: פָּתְהֵן
  choice: 她们的私处
  rationale: 该词含义疑难；在羞辱和揭露的语境中，很可能婉指隐私部位。“私处”在现代汉语中清楚但不过度粗俗；其他可能理解在脚注中保留。
- source_word: יְעָרֶה
  choice: 必使……裸露
  rationale: 该动词表示揭开、暴露。“使……裸露”准确呈现主动揭露及公开羞辱的意味。
theological_decisions:
- issue: 同一节中 אֲדֹנָי 与 יהוה 两种神圣称谓的表达
  choice: 分别译为“主”和“雅威”
  alternative: 两者都译作“主”；或将 יהוה 译作“耶和华”
  rationale: 原文在平行句中有意使用不同称谓。分别翻译可保留源文本形式上的区别，也避免把专名 יהוה 与称号 אֲדֹנָי 混同。
- issue: 羞辱性审判语境中 פָּתְהֵן 的含义
  choice: 理解为婉指被暴露的隐私部位
  alternative: 泛指赤裸；或理解为额头等其他身体部位
  rationale: 相邻动词“揭开、使裸露”以及上下文的公开羞辱较支持身体隐私部位的理解，但该词本身疑难，故不把其他解释隐藏起来，而在脚注中注明。
translation_notes:
  register: 采用现代、庄重而直接的普通话。保留审判宣告的严厉语气，并以“私处”准确而克制地表达羞辱性暴露；句法简洁，适合公开诵读。
