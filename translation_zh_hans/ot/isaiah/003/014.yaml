source:
  edition: WLC
  text: יְהוָה֙ בְּ/מִשְׁפָּ֣ט יָב֔וֹא עִם זִקְנֵ֥י עַמּ֖/וֹ וְ/שָׂרָ֑י/ו וְ/אַתֶּם֙ בִּֽעַרְתֶּ֣ם הַ/כֶּ֔רֶם גְּזֵלַ֥ת הֶֽ/עָנִ֖י בְּ/בָתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/014.yaml
  text: 'Yahweh enters into judgment with the elders of his people and its princes: “It is you who have devoured the vineyard[d][c][b][a]; the plunder of the poor is in your houses.”'
translation:
  language: zh_hans
  text: '雅威要与他百姓的长老和首领进行诉讼[a]：


    “正是你们把葡萄园吞吃殆尽[b][c]；


    从穷人那里抢来的财物，就在你们家中。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “进行诉讼”也可译作“进入审判”或“前来审判”。原文介词字面为“与；同”，在此司法语境中表达雅威与这些领袖之间的审判性争讼。
    reason: lexical_alternative
  - marker: b
    text: “吞吃殆尽”也可译作“焚毁”“耗尽”或“吃光”；原文动词表达带来毁灭的消耗。
    reason: lexical_alternative
  - marker: c
    text: “葡萄园”很可能以比喻指百姓或共同体，并与《以赛亚书》其他葡萄园意象相呼应。
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译保留神的专名，不以“主”这一称号替代。
- source_word: בְּמִשְׁפָּט יָבוֹא
  choice: 要……进行审判
  rationale: בוא与במשפט连用表示进入司法审理；“要……进行审判”自然保留希伯来语未完成式的将来指向和审判场景。
- source_word: עִם
  choice: 同
  rationale: 按其基本义译为“同”，不在正文中直接强化为“控告”或“对付”；上下文的指控已显明其对抗性质。
- source_word: זִקְנֵי עַמּוֹ וְשָׂרָיו
  choice: 他百姓的长老和首领
  rationale: “长老”指群体领袖而非仅指年长者；“首领”较“官员”更符合שׂרים的统治者含义和先知文体。
- source_word: וְאַתֶּם
  choice: 正是你们
  rationale: 独立人称代词带有强调意味，“正是你们”准确传达当面指控的力度。
- source_word: בִּעַרְתֶּם
  choice: 把……吞吃殆尽
  rationale: 该动词可指焚烧、耗尽、清除或吃光；此处采用“吞吃殆尽”，既表达破坏性侵吞，也保留葡萄园意象的张力。
- source_word: הַכֶּרֶם
  choice: 葡萄园
  rationale: 保留原文农业意象，不在正文中解释为百姓或群体。
- source_word: גְּזֵלַת הֶעָנִי
  choice: 从穷人那里抢来的财物
  rationale: גְּזֵלָה可指抢夺行为或抢来的东西；语境所说财物存于家中，故采用具体自然的结果义表达。
- source_word: בְּבָתֵּיכֶם
  choice: 就在你们家中
  rationale: 保留复数第二人称所属含义；“就在”强化赃物现存于众首领住所中的指控语气。
theological_decisions:
- issue: “葡萄园”的隐喻所指
  choice: 正文保留“葡萄园”，不明说其代表百姓或共同体。
  alternative: 直接译作“我的百姓”或“这个国家”。
  rationale: 以赛亚书的葡萄园意象具有更广泛的文学呼应；保留意象可避免把可能的所指直接写入正文。
- issue: 审判语境中עִם的关系
  choice: 译作“同”，保留原介词措辞。
  alternative: 译作“控告”或“与……为敌”。
  rationale: 司法语境虽使这场审判带有对抗性，但原文使用基本义为“同、与”的介词；后面的罪状足以体现敌对审判关系。
- issue: 审判行动的时态
  choice: 以“要”表达将临而又鲜明的先知性宣告。
  alternative: 采用现在时“正在进行审判”或完成式“已经审判”。
  rationale: 希伯来语未完成式可表达未来行动；此处不必把先知性生动表达解释成已经发生。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。以“雅威”保留神名；用分行引语呈现法庭式指控。“吞吃殆尽”刻意保留强烈而略显反常的葡萄园隐喻，不将其平化为抽象的“毁坏”。
