  text: the headdresses[a], the ankle chains, the sashes, the perfume boxes[b], and the amulets.
translation:
  language: zh_hans
  text: 华美的头饰、脚链、腰带、香盒[a]和护符[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “香盒”原文直译为“生命（或气息）之屋”，可能指盛放香料或芳香物质的小容器。
    reason: lexical_alternative
  - marker: b
    text: 或译“符咒”。原词与低声念咒或咒语有关，可能指与法术相关的护身物。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּאֵרִים
  choice: 华美的头饰
  rationale: פְּאֵרִים指华美的头部装饰；“华美的头饰”既保留其装饰性，也避免把具体样式限定为头巾。
- source_word: הַצְּעָדוֹת
  choice: 脚链
  rationale: 该词与行走、迈步有关，在此饰物清单中最可能指戴在脚踝上的链饰；“脚链”自然且具体。
- source_word: הַקִּשֻּׁרִים
  choice: 腰带
  rationale: 该词源于“捆绑、系住”的词根，此处应指衣着中的束带；“腰带”是现代汉语中清楚自然的表达。
- source_word: בָּתֵּי הַנֶּפֶשׁ
  choice: 香盒
  rationale: 字面为“生命／气息之屋”，在随身饰物的语境中通常理解为盛放香料或香物的小容器；正文采用“香盒”，脚注保留字面表达及不确定性。
- source_word: הַלְּחָשִׁים
  choice: 护符
  rationale: 该词与低声念咒或咒语相关，在物件清单中较可能指与法术有关、可佩戴的护符；“护符”保留具体物件的性质，脚注说明其咒术背景。
theological_decisions:
- issue: הַלְּחָשִׁים可能具有的咒术含义
  choice: 正文译作“护符”
  alternative: 符咒；低声念出的咒语
  rationale: 本节列举将被除去的随身物件，因此正文宜译为具体物品；脚注则保留该词与低声念咒之间的语义联系，不把其宗教含义淡化，也不武断地译成纯粹的言语行为。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语，并保持本节饰物清单的简洁节奏。两个含义较不确定的希伯来语词在正文中作语境化翻译，同时以脚注保留字面意义、词源联系和真实歧义。
