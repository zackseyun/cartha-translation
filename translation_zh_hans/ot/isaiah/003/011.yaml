  text: א֖וֹי לְ/רָשָׁ֣ע רָ֑ע כִּֽי גְמ֥וּל יָדָ֖י/ו יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/011.yaml
  text: Woe to the wicked! It will go badly for him[a], for the work of his hands will be done to him.
translation:
  language: zh_hans
  text: 恶人有祸了！他必遭殃[a]，因为他必按自己手所做的受报。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式地译作：“恶人有祸了！恶事临到他，因为他手所作的报偿必临到他。”
    reason: 词义与句法上的另一种较形式对应译法；保留 רַע 可指“恶事／灾祸”，以及 גְּמוּל 可指“报偿”的可能性。
lexical_decisions:
- source_word: א֖וֹי
  choice: 有祸了
  rationale: 保留先知宣告审判时兼具哀叹与警告意味的固定表达；现代汉语中自然庄重。
- source_word: לְ/רָשָׁ֣ע
  choice: 恶人
  rationale: 介词标明祸患宣告的对象；用单数类称“恶人”保留希伯来文的代表性单数，不额外限定性别。
- source_word: רָ֑ע
  choice: 他必遭殃
  rationale: 此处 רַע 在祸患公式后作谓语，主要指不利结局而非抽象的道德邪恶；“遭殃”清楚表达灾祸临身。
- source_word: כִּֽי
  choice: 因为
  rationale: 引出前述祸患宣告的理由。
- source_word: גְמ֥וּל יָדָ֖י/ו
  choice: 他亲手所做的
  rationale: גְּמוּל 可指行为、报偿或相应的回报；结合“手”的习语与下文被动动词，此译法保留行为与后果之间的联系，也保留具体的手之意象。
- source_word: יֵעָ֥שֶׂה לּֽ/וֹ
  choice: 必报应在他身上
  rationale: 尼法勒形态在此表达临到他的被动结果；“报应在他身上”自然传达按其行为回报的力量，同时不把该词义技术化。
theological_decisions:
- issue: 审判格言中的代表性阳性单数
  choice: 以“恶人……他”保留单数表达
  alternative: 改用复数“恶人……他们”，或译成“邪恶的男人”
  rationale: 希伯来文在语法上为单数，并以一个代表性个体陈述普遍原则；“恶人”不额外凸显生理性别，而代词“他”保持原文单数。
- issue: 报应性公义的措辞
  choice: 译作“他亲手所做的，必报应在他身上”
  alternative: “他双手的报偿必施行在他身上”或“他必按自己所做的受报”
  rationale: 原文强调行为与所得之间相称、回到行为者身上的审判。所选译文表达这一对应关系，却不引入原文以外的系统神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有祸了”保留先知性宣告语气；“遭殃”虽较通俗，但准确表达 רַע 在此所指的不利结局。主句以“报应在他身上”呈现希伯来文按行为回报的力度，脚注则保存较形式化、也较生硬的词义可能。
