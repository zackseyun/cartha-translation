base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/003.yaml
  text: the captain of fifty[a], and the man of rank, and the counselor, and the skillful craftsman, and the expert enchanter.
translation:
  language: zh_hans
  text: 五十人的长官、显要人物、谋士、技艺精湛的工匠，以及精通咒语的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“善于低声念咒的人”。希伯来语直译是“明辨低语（或咒语）的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר חֲמִשִּׁים
  choice: 五十人的长官
  rationale: שַׂר指首领或官长，与“五十”连用，表示统辖五十人的军事或行政长官；保留原文数字结构，同时使用自然的现代汉语。
- source_word: נְשׂוּא פָנִים
  choice: 显要人物
  rationale: 字面为“被抬起脸面的人”，是指受尊崇、社会地位高的人；“显要人物”简洁传达其身份与声望。
- source_word: יוֹעֵץ
  choice: 谋士
  rationale: 该词指提供谋略或劝告的人；在这份社会领导阶层的名单中，“谋士”比泛称“顾问”更庄重贴切。
- source_word: חֲכַם חֲרָשִׁים
  choice: 技艺精湛的工匠
  rationale: חֲכַם在工匠语境中侧重娴熟、有技艺，חֲרָשִׁים指工匠或匠人；此译体现实际技能，不将其抽象化为一般智慧。
- source_word: נְבוֹן לָחַשׁ
  choice: 精通咒语的人
  rationale: נְבוֹן表示明辨、熟练或精通，לָחַשׁ可指低声念诵、符咒或咒语；此处译出其很可能涉及咒术的含义，同时用“人”保持名单中的人物指称。
theological_decisions:
- issue: 如何翻译与咒术实践有关的נְבוֹן לָחַשׁ
  choice: 精通咒语的人
  alternative: 善于低声念咒的人；善于施符咒的人
  rationale: 希伯来语很可能指熟悉低声念诵之符咒或咒语的人。译文保留这种含义，不弱化为一般说服技巧，也不额外加入原文未明说的赞同或谴责。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。全节是前文所列将被除去的社会人物之一部分，因此用顿号串联各类人物。避免把חֲכַם机械译为抽象的“智慧”，并以脚注保留לָחַשׁ在“低语、咒语”之间的词义张力。
