  yaml_path: translation/ot/isaiah/003/004.yaml
  text: And I will make youths their princes[a], and capricious children will rule over them.
translation:
  language: zh_hans
  text: 我必使少年人作他们的首领，反复无常的孩童[a]必辖管他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孩童”也可译作“孩子”“幼童”或“婴孩”；希伯来语这个词既可能强调年纪幼小，也可能强调幼稚、任性或反复无常的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我必使
  rationale: נתן本义为“给”，但在设立治理者的语境中具有任命、使之担任的含义；“使……作”自然地表达这一作用。
- source_word: נְעָרִים
  choice: 少年人
  rationale: 该词指年轻男性或少年；此处保留年龄幼小、经验不足的形象，而不把含义限定为成年青年。
- source_word: שָׂרֵיהֶם
  choice: 他们的首领
  rationale: שַׂר可指首领、官长或王侯；“首领”在现代汉语中自然庄重，也能涵盖此处的治理职分。
- source_word: וְתַעֲלוּלִים
  choice: 反复无常的孩童
  rationale: 此词罕见且含义有争议，可能兼有孩童、幼小和任性无常之意；正文保留年龄形象与行为特征，并以脚注注明其他可能。
- source_word: יִמְשְׁלוּ בָם
  choice: 必辖管他们
  rationale: משל加ב表示对人施行统治；“辖管”直接表达治理与支配的关系，并保持庄重语体。
theological_decisions:
- issue: 审判图景中的幼小与幼稚
  choice: 将经文译为上帝使少年人作首领，并由反复无常的孩童辖管百姓，保留字面年龄和象征性不成熟两方面的可能。
  alternative: 只理解为统治者年龄幼小，或只理解为统治者幼稚无能。
  rationale: 希伯来文所用词语既与年幼有关，也可能强调幼稚、任性和缺乏治理能力；不宜在译文中排除其中任何一层含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“少年人”与“孩童”保留先知话语的鲜明反差；“首领”和“辖管”体现治理语境。
