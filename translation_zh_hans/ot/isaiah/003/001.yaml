  text: כִּי֩ הִנֵּ֨ה הָ/אָד֜וֹן יְהוָ֣ה צְבָא֗וֹת מֵסִ֤יר מִ/ירוּשָׁלִַ֨ם֙ וּ/מִ֣/יהוּדָ֔ה מַשְׁעֵ֖ן וּ/מַשְׁעֵנָ֑ה כֹּ֚ל מִשְׁעַן לֶ֔חֶם וְ/כֹ֖ל מִשְׁעַן מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/001.yaml
  text: 'For look, the Lord, the LORD of Armies, is removing from Jerusalem and from Judah support and supply: all support of bread and all support of water.'
translation:
  language: zh_hans
  text: 因为，看哪，主——万军之耶和华——正在从耶路撒冷和犹大除去支撑和供应[a]：一切粮食的供应和一切水的供应。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “支撑和供应”原文是同一词根的阳性和阴性名词并列，可表达全面的支撑或倚靠；也可译作“支柱和倚靠”。
    reason: 说明原文的同根阳阴性对举及其可能的包举意味，但不把该意味误作正文中明示的“一切”。
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: 因为，看哪
  rationale: 保留כִּי与上文的因果衔接，也以“看哪”传达הִנֵּה引人注意、强调眼前宣告的作用。
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: 主——万军之耶和华——
  rationale: 分别保留定冠词所限定的“主”、神名יהוה和“万军”称号；破折号使同位关系清楚自然。
- source_word: מֵסִיר
  choice: 正要……除去
  rationale: 希伯来语分词描写即将施行、已成定局的行动；“正要”在现代汉语中兼顾其临近感和宣告语气。
- source_word: מַשְׁעֵן וּמַשְׁעֵנָה
  choice: 一切支撑和供应
  rationale: 原文用同词根的阳性、阴性形式构成包举式并列；汉语无法直接复制该形态对举，因此用两个相近而互补的词表达维系社会与生活的一切凭借。
- source_word: כֹּל מִשְׁעַן לֶחֶם וְכֹל מִשְׁעַן מָיִם
  choice: 一切粮食的供应和一切水的供应
  rationale: 按语境表达粮食和水作为基本生活保障的含义，同时保留两次כֹּל“一切”的强调与平行结构。
theological_decisions:
- issue: יהוה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: “耶和华”是现代简体中文圣经读者最熟悉的神名形式，且能与前面的“主”区分，显出原文同时出现הָאָדוֹן与יהוה。
- issue: 审判中被除去之物的范围
  choice: 一切支撑和供应
  alternative: 靠山和靠山／支柱和支杖
  rationale: 不把经文限缩为物质匮乏或政治领袖；总括语先保持广义，后面的粮食和水则明确包括基本生活供应，后续经节还会展开人的支柱。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“因为”承接上文，“看哪”保留先知宣告的强调语气；以破折号标示神圣称号的同位关系。避免生硬照搬“粮的支撑、水的支撑”，但借重复“一切……供应”保留原文的平行与力度。
