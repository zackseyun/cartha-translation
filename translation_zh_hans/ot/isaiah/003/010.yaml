  text: אִמְר֥וּ צַדִּ֖יק כִּי ט֑וֹב כִּֽי פְרִ֥י מַעַלְלֵי/הֶ֖ם יֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/010.yaml
  text: Say of the righteous that it will be well[a], for they will eat the fruit of their deeds.
translation:
  language: zh_hans
  text: 你们要说，义人必得福乐，因为他们必吃自己行为的果子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较贴近字面可译作：“要论义人说：他必得好处，因为他们必吃自己行为的果子。”希伯来文先用单数“义人”，末句却转用复数的动词和物主后缀。
    reason: 说明טוֹב在语境中指义人将有好的境遇，并保留原文代表性单数转为复数的语法现象。
lexical_decisions:
- source_word: אִמְרוּ
  choice: 你们要说
  rationale: 这是אמר的阳性复数祈使式，表示向一群听众发出的直接命令；译为“你们要说”既明确人数，也保持原文简洁。
- source_word: צַדִּיק
  choice: 义人
  rationale: 形容词作名词用，为代表性单数，指行义的人；“义人”是自然、庄重且具有道德含义的现代汉语表达。
- source_word: כִּי טוֹב
  choice: 必得福乐
  rationale: 首个כִּי引出所要宣告的内容，טוֹב字面为“好”，在本语境中表达义人的境况必然良好；“必得福乐”自然传达此意，并与下句所得行为之果相衔接。
- source_word: כִּי
  choice: 因为
  rationale: 第二个כִּי说明前述宣告的原因，译为“因为”清楚保留因果关系。
- source_word: פְרִי
  choice: 果子
  rationale: 保留原文“果实”的具体比喻，不将其抽象化为“结果”或“报偿”。
- source_word: מַעַלְלֵיהֶם
  choice: 自己行为所结的
  rationale: 该词指他们的行为、作为；结合“果子”译作“自己行为所结的”，使汉语流畅，同时保留行为产生果实的隐喻。
- source_word: יֹאכֵלוּ
  choice: 他们必吃
  rationale: 该动词为复数未完成式，语境中表示将来的确定结果；直译“必吃”保留享用行为之果的形象。
theological_decisions:
- issue: 代表性单数与复数转换
  choice: 前半句保留代表性单数“义人”，后半句按马所拉文本译为复数“他们”。
  alternative: 全句统一为单数：“你们要说，义人是有福的，因为他必吃自己行为所结的果子。”
  rationale: 希伯来文צַדִּיק为单数，而后面的物主后缀和动词均为复数。正文保留这一数的转换，以反映从代表性个体转向义人群体的表达，不强行消除原文张力。
- issue: טוֹב的时间与语义
  choice: 译为“必得福乐”，表达语境中的良好结局。
  alternative: 较形式化地译为“是好的”或“是好事”。
  rationale: טוֹב本身仅为“好”，没有明示“福乐”一词；但与后面的因果句相连时，所指是义人将有好的境遇。正文采用自然汉语表达，脚注保留较形式化的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必得福乐”避免生硬的“是好的”，而“吃……果子”保留原文具体有力的报偿隐喻。脚注明示单复数转换及较形式化译法。
