base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/026.yaml
  text: And her gates will lament and mourn[a], and she will be stripped bare and sit on the ground.
translation:
  language: zh_hans
  text: 她的城门必哀号、哀哭；她必被剥得一无所有[a]，坐在地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被清空”或“被剥得精光”。希伯来语动词在这里可表示被清空或被剥得一无所有。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנ֥וּ
  choice: 必哀号
  rationale: אנה在哀悼语境中表示发出悲叹；“哀号”保留其可听见的悲恸，也维持城门拟人化的诗意。
- source_word: וְאָבְל֖וּ
  choice: 悲鸣
  rationale: אבל表示哀悼、悲伤；与“哀号”并列而不合并两词，中文用“悲鸣”形成自然而庄重的诗性搭配。
- source_word: פְּתָחֶ֑י/הָ
  choice: 她的城门
  rationale: 该词本义可泛指入口，但在被拟人化的城市语境中，“城门”最符合以赛亚书的都市图景。阴性代词“她”保留锡安／耶路撒冷的人格化表达。
- source_word: וְנִקָּ֖תָה
  choice: 她必被剥夺净尽
  rationale: נקה的尼法勒式在此可表示被清空、被剥得一无所有。“被剥夺净尽”适合城市失去居民、财富与荣美的语境，同时不把具体损失对象说死。
- source_word: לָ/אָ֥רֶץ
  choice: 在地上
  rationale: ארץ虽可指大地或土地，但与ישב连用并处于受辱场景时，指坐在地面的具体姿态最自然。
- source_word: תֵּשֵֽׁב
  choice: 坐
  rationale: ישב可指坐、居住或停留；这里与“在地上”搭配，明显侧重蒙羞哀悼时坐地的姿态。
theological_decisions:
- issue: 阴性单数主语所指
  choice: 保留为拟人化的锡安／耶路撒冷，以“她”指称
  alternative: 理解为泛指的阴性城市形象
  rationale: 本节承接对锡安女子和耶路撒冷的审判宣告。译文保留阴性拟人，却不在正文中直接补出“锡安”或“耶路撒冷”，避免超出本节明说的范围。
- issue: וְנִקָּתָה所描绘的损失性质
  choice: 宽泛表达为“被剥夺净尽”
  alternative: 具体理解为居民尽失、装饰尽除，或城被洗劫
  rationale: 上下文容许这些具体联想，但希伯来语本身主要强调被清空、剥得精光的状态；正文不限定损失对象，以保存原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哀号悲鸣”保留希伯来诗歌的平行结构；分号呈现两幅相连的图景。“被剥夺净尽”略带诗性但意义清楚，并将脚注标记放在其所解释的词组之后。
