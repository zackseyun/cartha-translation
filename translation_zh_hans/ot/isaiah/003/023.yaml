  text: and the mirrors[a], and the linen garments, and the turbans[b], and the veils.
translation:
  language: zh_hans
  text: 还有镜子[a]、细麻衣、头巾和披巾[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “镜子”或译“薄片”。希伯来词也可能泛指表面光滑、经过抛光的物件；在这里的奢华饰物清单中，译作“镜子”较为贴切。
    reason: lexical_alternative
  - marker: b
    text: “披巾”或译“面纱”“披肩”。这种衣物的确切样式不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְיֹנִים
  choice: 镜子
  rationale: 该词可指光滑、抛光的物件；在妇女奢华服饰用品的清单中，理解为金属镜子最合语境。
- source_word: סְּדִינִים
  choice: 细麻衣
  rationale: 该词指细麻制成的衣物；此译保留材质信息，又不把具体样式或用途说得过细。
- source_word: צְּנִיפוֹת
  choice: 头巾
  rationale: 该词指缠裹在头上的物件；“头巾”自然、易懂，也不强行限定其具体式样。
- source_word: רְדִידִים
  choice: 披巾
  rationale: 该词似指披在身上的轻薄外层衣物；“披巾”比“面纱”更能保留其可能是披肩或裹衣的含义。
