  text: מ/ל/כם תְּדַכְּא֣וּ עַמִּ֔/י וּ/פְנֵ֥י עֲנִיִּ֖ים תִּטְחָ֑נוּ נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/015.yaml
  text: What do you mean by crushing my people and grinding the faces of the poor? declares the Lord GOD of hosts[a][b].
translation:
  language: zh_hans
  text: '“你们这是做什么[a]，竟压碎我的百姓，碾磨穷人的脸[b]？”


    这是主、万军之耶和华的宣告。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面近于“这与你们有什么关系？”这是带有斥责意味的惯用问法。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“碾压穷人的面容”。原文以磨碾人的脸这一强烈比喻描写残酷压迫。
    reason: lexical_alternative
lexical_decisions:
- source_word: מ/ל/כם
  choice: 你们这是做什么
  rationale: 希伯来语 מָה־לָכֶם 是省略性的责问，字面近于“这与你们何干／对你们来说是什么”，在此表达强烈斥责。“你们这是做什么”符合现代汉语习惯，同时没有把责问具体化为原文未明说的动机。
- source_word: תְּדַכְּאוּ
  choice: 压碎
  rationale: דכא 的 Piel 形式带有压碎、压垮之意；保留具体而强烈的暴力意象，胜于抽象的“欺压”。
- source_word: עַמִּי
  choice: 我的百姓
  rationale: 直接保留第一人称所属关系，也传达耶和华认同受害百姓的关系性含义。
- source_word: וּפְנֵי עֲנִיִּים
  choice: 穷人的脸
  rationale: פנים 形式上为复数，但汉语集合表达用单数“脸”更自然；עֲנִיִּים 在本段社会压迫语境中译作“穷人”。
- source_word: תִּטְחָנוּ
  choice: 碾磨
  rationale: טחן 的基本义是磨、碾；“碾磨”保留原文鲜明的压榨意象，并与前一动词“压碎”有所区别。
- source_word: נְאֻם
  choice: 宣告
  rationale: 这是先知话语中引出神谕的权威性公式；“宣告”庄重、清楚。
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: 主——万军之耶和华
  rationale: “主”对应 אֲדֹנָי，“万军之耶和华”对应 יְהוִה צְבָאוֹת；破折号表明二者是同位称号，避免误读为两个主体，也保留神的专名“耶和华”。
theological_decisions:
- issue: 复合神名称号 אֲדֹנָי יְהוִה צְבָאוֹת 的译法
  choice: 主——万军之耶和华
  alternative: 主上帝、万军之主；主雅威万军之神
  rationale: 译文分别呈现 אֲדֹנָי 的“主”和 יְהוִה 的专名“耶和华”，并将 צְבָאוֹת 译为传统而含义宽广的“万军”。破折号保留同位关系，不把称号拆成两个对象。
- issue: 责问是否明确补出“欺压”的伦理解释
  choice: 保留“压碎”“碾磨”的双重比喻
  alternative: 译为“欺压、残酷剥削”
  rationale: 原文用具体而尖锐的身体与磨碾意象谴责社会压迫；直保比喻可让其神学和伦理张力自然显现，而不以抽象解释取代原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。问句以“你们这是做什么，竟……”传达当面斥责；“压碎／碾磨”保留希伯来诗句的平行结构和暴力意象。神名称号用破折号清楚标示同位关系。
