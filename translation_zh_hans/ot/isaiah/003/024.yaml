base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/024.yaml
  text: 'And it shall be: instead of perfume[a], rottenness; and instead of a belt, a rope; and instead of well-set hair, baldness; and instead of a rich robe, a girding of sackcloth[c][b]; branding instead of beauty.'
translation:
  language: zh_hans
  text: 那时，必有腐烂代替香料，绳索[a]代替腰带，秃头代替精心梳理的头发[b]，束在腰间的麻布代替华美的袍服，烙痕代替美貌[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“细绳”。这个罕见的希伯来词可能指取代装饰性腰带的绳索，也可能指绳索状的羞辱性记号。
    reason: lexical_alternative
  - marker: b
    text: “精心梳理的头发”所对应的希伯来语短语含义不确定，也可能泛指精巧的装饰或精制的衣物；因下文以“秃头”与之相对，这里按发式理解。
    reason: lexical_alternative
  - marker: c
    text: 本节末句的希伯来文本和词义都很难确定。许多人理解为“烙痕代替美貌”；也有译本较笼统地译为“羞辱代替美貌”等。
    reason: textual_variant
lexical_decisions:
- source_word: בֹּשֶׂם
  choice: 香料
  rationale: 该词指芳香的香膏或香料；“香料”既保留具体事物，也自然承接与“腐臭”的反差。
- source_word: מַק
  choice: 腐臭
  rationale: 该名词表示腐烂、朽坏；此处与香料相对，“腐臭”在现代汉语中简洁地呈现腐败状态及其恶臭效果。
- source_word: חֲגוֹרָה
  choice: 腰带
  rationale: 泛指束在腰间之物；“腰带”是清楚、自然的现代汉语表达。
- source_word: נִקְפָּה
  choice: 绳索
  rationale: 这是罕见词，通常理解为绳或索，表示粗陋、羞辱之物取代装饰性的腰带；具体含义保留在脚注中。
- source_word: מַעֲשֶׂה מִקְשֶׁה
  choice: 精心梳理的头发
  rationale: 短语含义困难，或可泛指精工制作之物；但它与“秃头”构成对应，因此译作精心整理的发式最合语境。
- source_word: קָרְחָה
  choice: 秃头
  rationale: 该词意为秃发、秃头，与精心梳理的头发形成鲜明反转。
- source_word: פְּתִיגִיל
  choice: 华美的袍服
  rationale: 罕见词，指贵重、华美或节庆时穿的衣服；此译保留奢华服饰的意象，同时不武断限定具体样式。
- source_word: מַחֲגֹרֶת שָׂק
  choice: 束在腰间的麻布
  rationale: 字面为用麻布束裹；此译清楚呈现哀悼、卑微的麻布取代华服的图景。
- source_word: כִּי תַחַת יֹפִי
  choice: 烙痕代替美貌
  rationale: 马所拉文本末句极其简略且词义困难，辅音文本没有明写预期的“烙痕”一词；但“毁容的烙痕取代美貌”符合上下文，也有古今解释传统支持。译文采用这一常见理解，并以脚注保留不确定性。
