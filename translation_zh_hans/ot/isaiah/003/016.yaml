  text: וַ/יֹּ֣אמֶר יְהוָ֗ה יַ֚עַן כִּ֤י גָֽבְהוּ֙ בְּנ֣וֹת צִיּ֔וֹן וַ/תֵּלַ֨כְנָה֙ נטוות גָּר֔וֹן וּֽ/מְשַׂקְּר֖וֹת עֵינָ֑יִם הָל֤וֹךְ וְ/טָפֹף֙ תֵּלַ֔כְנָה וּ/בְ/רַגְלֵי/הֶ֖ם תְּעַכַּֽסְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/016.yaml
  text: 'And Yahweh said: Because the daughters of Zion are haughty[a], and walk with outstretched necks, glancing with their eyes, walking and mincing as they go, and making a jingling with their feet[b],'
translation:
  language: zh_hans
  text: 雅威说：“因为锡安的女子高傲，伸着脖子走路，眼目顾盼[a]，迈着碎步而行，脚下叮当作响[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以眼传情”或“斜眼窥看”。这个希伯来语表达很少见，可能指挑逗、虚假或斜睨的眼神动作。
    reason: lexical_alternative
  - marker: b
    text: 或译“用脚使脚镯叮当作响”。这里的动词很可能指脚部饰物发出的清脆声，但本节没有明确提到“脚镯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现神的专名，区别于“主”这一称号。
- source_word: יַעַן כִּי
  choice: 因为
  rationale: 这组词引出下一节审判的缘由；“因为”自然、清楚地保留因果关系。
- source_word: גָבְהוּ
  choice: 高傲
  rationale: 该动词本义与“高”有关，此处指骄傲自大的态度；“高傲”也与下文刻意抬颈的姿态相呼应。
- source_word: בְּנוֹת צִיּוֹן
  choice: 锡安的女子
  rationale: 保留“锡安之女”这一群体性表达，同时采用现代汉语较自然的说法，不将其缩减为一般的“耶路撒冷妇女”。
- source_word: נטוות גָּרוֹן
  choice: 伸着脖子
  rationale: 贴近希伯来语的身体意象，并在汉语中自然表现其刻意昂扬的姿态，而不把态度解释直接写入短语。
- source_word: מְשַׂקְּרוֹת עֵינָיִם
  choice: 眼目顾盼
  rationale: 原文表达罕见，可能指挑逗、斜睨或虚假的眼神动作；“顾盼”保留眼神游移的画面，同时避免在正文中断定其必为勾引。
- source_word: הָלוֹךְ וְטָפֹף תֵּלַכְנָה
  choice: 迈着碎步而行
  rationale: טפף很可能描述细小、刻意的步态；此译简洁呈现行走方式，也保留动作的做作感。
- source_word: וּבְרַגְלֵיהֶם תְּעַכַּסְנָה
  choice: 脚下叮当作响
  rationale: 动词很可能指脚部饰物发出的清脆声响，但本节没有明说“脚镯”；正文保留声音效果，具体来源置于脚注。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用神名的音译而非以称号“主”代替；“雅威”较接近学界对该名读音的通行重构，同时承认传统译名“耶和华”这一替代形式。
- issue: מְשַׂקְּרוֹת עֵינָיִם 是否明确带有诱惑意味
  choice: 正文译为较中性的“眼目顾盼”
  alternative: 以眼传情；抛媚眼；斜眼窥看
  rationale: 希伯来语表达罕见，其挑逗、欺骗或斜睨意味不能完全确定；正文不将可能的道德或性意味定死，脚注说明主要解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文因果从句延续至下一节的未完结构，故本节以逗号收束；“伸着脖子”“迈着碎步”“叮当作响”维持先知话语中具体而鲜明的身体与声音意象。
