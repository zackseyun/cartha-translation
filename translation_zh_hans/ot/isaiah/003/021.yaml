lexical_decisions:
- source_word: הַטַּבָּעוֹת
  choice: 戒指
  rationale: טַבָּעוֹת是טַבַּעַת的复数，基本义为环、指环。本节列举妇女饰物，译作“戒指”自然明确；“印章戒指”虽是可能含义，但此处上下文不足以限定其种类。
- source_word: וְנִזְמֵי הָאָף
  choice: 和鼻环
  rationale: נִזְמֵי指环形饰物，与הָאָף（鼻子）构成“鼻环”。这一译法符合现代汉语习惯，也保留原文具体的饰物形象。
- source_word: הָאָף
  choice: 鼻
  rationale: אָף在此指人体的鼻子；译作“鼻孔”过于狭窄，也不符合汉语对这种饰物的通常称呼。
