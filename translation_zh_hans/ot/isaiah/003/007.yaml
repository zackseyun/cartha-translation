base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/007.yaml
  text: On that day he will cry out[a], saying, “I will not be a healer, for in my house there is no bread and there is no cloak[b]; you must not make me leader of the people.”
translation:
  language: zh_hans
  text: 到那日，他必高声说[a]：“我不作医治者[b]；我家里没有饼，也没有外衣。你们不可立我为百姓的领袖[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高声说”原文字面为“举起”；在这里指提高声音，郑重发言或提出抗议。
    reason: lexical_alternative
  - marker: b
    text: 或译“包扎伤口的人”，保留原文的字面形象。
    reason: lexical_alternative
  - marker: c
    text: “领袖”也可译作“首领”或“官长”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: 高声说
  rationale: 该动词基本义为“举起、承担”，与“说”连用时在此表示郑重而公开地发言或抗议。“高声说”自然表达其强调语气，又不过度渲染为哀号。
- source_word: חֹבֵשׁ
  choice: 医治者
  rationale: 该分词字面指“包扎的人”，尤指包扎伤口者；在上下文中又隐喻能够修补社会危局的人。“医治者”保留这一形象，而不直接解释成“统治者”。
- source_word: לֶחֶם
  choice: 饼
  rationale: 基本义为“饼、面饼”，也可泛指食物。此处与衣服并列，具体描绘生活必需品，因此采用“饼”。
- source_word: שִׂמְלָה
  choice: 衣服
  rationale: 指衣服，常可特指外衣。现代汉语“衣服”自然清楚；脚注说明“外衣”这一较具体的可能译法。
- source_word: תְשִׂימֻנִי
  choice: 不可立我作
  rationale: שׂים意为“放置、设立、任命”。这里是拒绝被置于领导职位，译为“不可立我作”既贴近原文，也保持庄重自然。
- source_word: קְצִין עָם
  choice: 百姓的领袖
  rationale: קָצִין可指首领、官长或统领者。此处未明确限定为军事职务，故以较宽泛的“领袖”保留其范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到那日……必”保留先知性叙述语气；引语以直接拒绝的措辞呈现。原文两次重复“没有”，译文相应保留“没有饼，也没有衣服”的平行结构。
