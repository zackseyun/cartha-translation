  naturalness: “到那日，他必高声说”及其后的直接引语庄重、自然。“立我作”可理解，但“立我为”在现代庄重汉语中更顺畅。
  terminology: “医治者”能自然表达חֹבֵשׁ作为包扎、医治者的隐喻，不应改作“统治者”。שִׂמְלָה较具体地指外衣；译作“外衣”可更好保留其与“饼”并列的具体性。
  issues:
