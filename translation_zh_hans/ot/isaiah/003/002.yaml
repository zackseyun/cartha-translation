  text: גִּבּ֖וֹר וְ/אִ֣ישׁ מִלְחָמָ֑ה שׁוֹפֵ֥ט וְ/נָבִ֖יא וְ/קֹסֵ֥ם וְ/זָקֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/002.yaml
  text: the mighty man and the man of war[a], the judge and the prophet, the diviner and the elder.
translation:
  language: zh_hans
  text: 勇士和战士，审判官和先知，占卜者[a]和长老。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“术士”；希伯来词指从事占卜、借此预测吉凶的人。
    reason: 提供词义相近的译法，并说明该希伯来词所指的行为。
lexical_decisions:
- source_word: גִּבּוֹר
  choice: 勇士
  rationale: 此处指有力量、英勇的人；“勇士”自然保留其代表性社会角色，又不把它完全等同于下一项明确的军事身份。
- source_word: אִישׁ מִלְחָמָה
  choice: 战士
  rationale: 希伯来语直译为“战争之人”。现代汉语用“战士”简洁自然，也与前面的“勇士”保持区分。
- source_word: שׁוֹפֵט
  choice: 审判官
  rationale: 这里指承担司法或治理职责的人。“审判官”比现代专门职称“法官”更能容纳古代社会中的司法与公共权柄。
- source_word: נָבִיא
  choice: 先知
  rationale: 这是该公认职分在现代汉语中的标准译法。
- source_word: קֹסֵם
  choice: 占卜者
  rationale: 该词指从事占卜的人。“占卜者”准确、易懂，并按描述性语气翻译，不暗示经文认可这种行为。
- source_word: זָקֵן
  choice: 长老
  rationale: 在这份公共人物名单中，该词更可能表示具有身份和领导地位的长者，而不只是年老的人。
- source_word: וְ
  choice: 和；分项处用逗号
  rationale: 原文反复使用连接词形成庄重的列举。译文在成对项目中保留“和”，并以逗号分隔各组，使汉语自然且保留目录式节奏。
theological_decisions:
- issue: 在先知谴责的语境中如何翻译 קֹסֵם
  choice: 占卜者
  alternative: 术士；卜卦者
  rationale: 本节是在描述耶路撒冷和犹大社会中将被除去的各类人物，并非认可占卜。采用中性而明确的职业性称呼，可保留原文的描述力度，不作教义性的淡化或强化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“勇士和战士”保留原文前两项的区别；“审判官”与“长老”体现古代公共角色。脚注标记置于其实际说明的“占卜者”之后。
