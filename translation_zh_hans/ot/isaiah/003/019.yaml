lexical_decisions:
- source_word: הַנְּטִיפוֹת
  choice: 垂饰
  rationale: 该词可能指悬垂或滴状的装饰品。“垂饰”自然易懂，又不把它过度限定为耳环。
- source_word: הַשֵּׁירוֹת
  choice: 手镯
  rationale: 这是一个罕见词，所指饰物并不确定，可能是手镯、臂环或链饰；正文采用符合饰物清单语境的“手镯”，并以脚注保留不确定性。
- source_word: הָרְעָלוֹת
  choice: 面纱
  rationale: 该词指某种遮盖物或披覆衣物；“面纱”是本语境中清楚且常见的译法，但也可能指披巾或外披。
