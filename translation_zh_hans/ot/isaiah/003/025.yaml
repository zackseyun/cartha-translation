base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/025.yaml
  text: Your men will fall by the sword[a], and your mighty men in battle.
translation:
  language: zh_hans
  text: 你的男丁必倒在刀下，你的勇士[a]必倒在战场上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “勇士”或译“英豪”；原文直译也可作“你的力量”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתַיִךְ
  choice: 你的男丁
  rationale: מֵת在此处是诗歌用语，指人或男子，并非“死人”；结合刀剑与战争的语境，“男丁”自然地指锡安城中的成年男子，也可能涵盖参战者。
- source_word: בַּחֶרֶב
  choice: 在刀下
  rationale: 介词בְּ在这里表达手段或致死方式；“倒在刀下”是现代汉语中自然庄重的战争表达，也保留“刀剑”这一意象。
- source_word: יִפֹּלוּ
  choice: 必倒
  rationale: נפל的未完成式在预言语境中指将来的确定结局；“必倒”既保留“倒下”的圣经意象，又传达宣告的确定性。后半句按希伯来诗歌的省略结构补出同一谓语，使汉语意思完整。
- source_word: וּגְבוּרָתֵךְ
  choice: 你的勇士
  rationale: גְּבוּרָה通常指能力、力量或英勇，此处与“男丁”平行，并处于战争语境，最自然地转指有勇力的人，即“勇士”；脚注保留“英豪”及抽象名词“力量”的可能性。
- source_word: בַּמִּלְחָמָה
  choice: 在战场上
  rationale: מִלְחָמָה可指战争或战斗；“倒在战场上”符合现代汉语搭配，并准确呈现死于交战的情景。
theological_decisions:
- issue: 阴性第二人称单数后缀的指向
  choice: 保留为“你的”，理解为对人格化的锡安或耶路撒冷说话
  alternative: 也可理解为概括地对锡安的女子说话
  rationale: 上下文把锡安或耶路撒冷人格化为女性；正文不明说其名称，只保留第二人称，可避免加入超出本节的解释。
- issue: “勇力”是抽象力量还是具体勇士
  choice: 正文采用转喻性的“勇士”
  alternative: 直译为“力量”或译为“英豪”
  rationale: 它与“男丁”构成平行，并由“在战争中”限定，因此具体指有勇力的战士最合语境；脚注保留词语本身的抽象含义。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。两分句重复“必倒”，将希伯来诗歌中共用的谓语在汉语里明确表达；“刀下／战场上”保留平行的战争意象。
