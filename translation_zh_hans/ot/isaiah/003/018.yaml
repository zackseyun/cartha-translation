base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/018.yaml
  text: In that day the Lord will take away the beauty of the anklets[a], the headbands[c][b], and the crescent ornaments.
translation:
  language: zh_hans
  text: 在那日[a]，主必除去脚镯、头饰[b]和月牙形饰物[c]的华美。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当那日。”
    reason: lexical_alternative
  - marker: b
    text: “头饰”所指的具体物件不能确定；也可能是头带、帽饰或发网。
    reason: lexical_alternative
  - marker: c
    text: 或译：“月牙形项饰”；原文指月牙形的饰物。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 在那日
  rationale: 这是先知书中常见的时间用语，引出将来施行审判的时候；“在那日”自然庄重，也保留原文的先知性语气。
- source_word: יָסִיר
  choice: 必除去
  rationale: 使役词形表达“使之离开、移除”；“必除去”既准确，也传达预告审判的确定语气。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神的称号 Adonai，并非四字神名；译作“主”符合现代中文圣经语体。
- source_word: תִּפְאֶרֶת
  choice: 华美
  rationale: 此词可指美丽、荣耀或华饰；在列举装饰品的语境中，“华美”兼顾其外观之美和华饰意味。
- source_word: הָעֲכָסִים
  choice: 脚镯
  rationale: 该词指戴在脚踝处的饰物；“脚镯”是清楚、简洁的现代中文对应词。
- source_word: הַשְּׁבִיסִים
  choice: 头饰
  rationale: 具体物件不能确定，可能是头带、帽饰或发网；“头饰”作为较宽泛的译法，可避免无根据地过度具体化。
- source_word: הַשַּׂהֲרֹנִים
  choice: 月牙形饰物
  rationale: 该词与“月亮、月牙”相关，所指是月牙形的首饰；此译法保留形状意象，又不武断限定其佩戴方式。
