lexical_decisions:
- source_word: מַּחֲלָצוֹת
  choice: 华美礼服
  rationale: 该词指贵重或特殊场合穿着的衣服；“华美礼服”既体现其精美贵重，也保留礼仪或节庆场合用衣的可能性。
- source_word: מַּעֲטָפוֹת
  choice: 外袍
  rationale: 该词源于“包裹、披覆”的词根，指披在外面的衣物；“外袍”在现代汉语中自然，并能表达较完整的外层衣装。
- source_word: מִּטְפָּחוֹת
  choice: 披巾
  rationale: 该词指用于遮盖或披裹的布饰，具体形制不确定；“披巾”适合本节服饰清单的语境，又不武断限定为遮脸的面纱。
- source_word: חֲרִיטִים
  choice: 荷包
  rationale: 该词指盛放钱财或贵重物品的小袋；“荷包”简洁而有尊贵服饰配件的意味，比泛称“袋子”更贴合语境。
