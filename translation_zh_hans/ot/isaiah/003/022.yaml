  text: 节庆礼服[a]、外袍[b]、披巾[c]和荷包[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“华美礼服”。原文很可能指特殊或节庆场合穿的贵重衣服，而非日常衣着。
    reason: lexical_alternative
  - marker: b
    text: 或译“披衣”。
    reason: lexical_alternative
