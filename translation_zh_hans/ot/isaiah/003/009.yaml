id: ISA.3.9
reference: Isaiah 3:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַכָּרַ֤ת פְּנֵי/הֶם֙ עָ֣נְתָה בָּ֔/ם וְ/חַטָּאתָ֛/ם כִּ/סְדֹ֥ם הִגִּ֖ידוּ לֹ֣א כִחֵ֑דוּ א֣וֹי לְ/נַפְשָׁ֔/ם כִּֽי גָמְל֥וּ לָ/הֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/009.yaml
  text: The look on their faces testifies against them[a], and they proclaim their sin like Sodom; they do not hide it. Woe to themselves[c][b], for they have brought evil on themselves.
translation:
  language: zh_hans
  text: 他们脸上的神色指证他们[a]；他们像所多玛一样，公然宣扬自己的罪[b]，毫不隐瞒。他们有祸了[c]！因为他们自招祸患。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的面貌指证他们。”希伯来语可指脸上可见的神色或表情，成为不利于他们的证据。
    reason: lexical_alternative
  - marker: b
    text: “像所多玛一样”使人想到公开而不知羞耻的邪恶；参创世记13:13；19:5。
    reason: cross_reference
  - marker: c
    text: 直译可作：“他们自己有祸了”或“他们的性命有祸了。”希伯来语“נפש”可指自我、生命或整个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכָּרַת פְּנֵיהֶם
  choice: 他们脸上的神情
  rationale: 该词组最可能指脸上可辨认的神色或表情；这样译既自然，也与随后“作证控告”形成清楚的证据意象，同时在脚注保留“面貌”这一较字面的可能。
- source_word: עָנְתָה בָּם
  choice: 作证控告他们
  rationale: ענה 与介词 ב 连用，在这里具有针对某人作证的司法意味；“作证控告”兼顾见证和不利指证的语气。
- source_word: וְחַטָּאתָם ... הִגִּידוּ
  choice: 公然宣扬自己的罪
  rationale: חטאתם 是 הִגִּידוּ 的宾语，指他们的罪；Hiphil 形态的 נגד 表示告知、声明或使人知道。加入“公然”表达与“不掩饰”相连的公开性，但不改变基本命题。
- source_word: כִּסְדֹם
  choice: 像所多玛一样
  rationale: 保留简洁而强烈的圣经典故，不把所多玛之罪具体限定为某一种罪行。
- source_word: לֹא כִחֵדוּ
  choice: 毫不掩饰
  rationale: כחד 表示隐藏、隐瞒；“毫不掩饰”符合现代汉语，也传达公开且不知羞耻的语势。
- source_word: אוֹי לְנַפְשָׁם
  choice: 他们有祸了
  rationale: נפש 在此可指整个人、自身或生命，并非必然专指与身体相对的“灵魂”；“他们有祸了”自然地表达灾祸临到他们自身，脚注保留较字面的译法。
- source_word: כִּי גָמְלוּ לָהֶם רָעָה
  choice: 因为他们把祸害带给了自己
  rationale: גמל 可表示施予、报还或对待；本句强调其恶行反过来给自己招致祸害。“祸害”保留 רעה 在此兼具恶与灾祸后果的语义，而不明说经文未明说的机制。
theological_decisions:
- issue: לְנַפְשָׁם 中 נֶפֶשׁ 的含义
  choice: 译作“他们有祸了”，按“他们自身”理解
  alternative: “他们的灵魂有祸了”或“他们的性命有祸了”
  rationale: נפש 常可指人、自我或生命。上下文宣告的是这些人自身所受的祸患；避免将其窄化为技术性的灵魂观。
- issue: 末句所表达的审判机制
  choice: 表达恶行给自身招来祸害
  alternative: 明确译成上帝报应他们，或仅解释成社会层面的自然后果
  rationale: 希伯来文本强调他们将 רעה 施于或带给自己，却未在本句明确说明这一后果如何发生；译文保留自招祸患的张力，不额外界定机制。
- issue: “像所多玛一样”的罪
  choice: 保留概括性的所多玛典故
  alternative: 在正文中具体认定为某一种罪
  rationale: 本节着重其罪公开、不加掩饰；没有在此具体界定罪的类别，因此不导入特定教派或解释传统的限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“作证控告”保留司法语气；“公然宣扬……毫不掩饰”体现公开的悖逆；“他们有祸了”是现代读者易懂的先知性哀祸宣告。所有脚注标记均已置于正文相应位置。
