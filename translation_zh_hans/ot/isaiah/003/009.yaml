  to: 他们脸上的神色指证他们[a]；他们像所多玛一样，公然宣扬自己的罪[b]，毫不隐瞒。他们有祸了[c]！因为他们自招祸患。
  rationale: 修订只改善汉语的自然度并微调末句的因果力度：以“神色指证”取代略显重复的“作证控告”，以“自招祸患”表达恶行反归自身的结果；没有具体化所多玛之罪，也没有把末句解释为某一种特定的报应机制。脚注标记a、b、c均保留在相应正文位置。
