  text: נִצָּ֥ב לָ/רִ֖יב יְהוָ֑ה וְ/עֹמֵ֖ד לָ/דִ֥ין עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/013.yaml
  text: Yahweh takes his stand to contend[b][a], and stands to judge the peoples.
translation:
  language: zh_hans
  text: 耶和华站定，要争辩[a]；他站立，要审判众民[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“提出诉讼”或“进行争讼”；希伯来语动词带有法律争讼的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“列国”；希伯来语为复数，可广泛指多个民族或民众群体。
    reason: alternative_reading
lexical_decisions:
- source_word: נִצָּב
  choice: 挺身而立
  rationale: 这个尼法勒分词描绘坚定就位、预备行动的姿态；“挺身而立”在现代汉语中自然地保留了鲜明的司法场景。
- source_word: לָרִיב
  choice: 要争讼
  rationale: ריב在此带有法律争辩、诉讼的意味。“争讼”既保留司法色彩，又不把具体诉讼程序解释得过细。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，在简体中文圣经语境中采用通行且可辨识的专名“耶和华”，而不以称号替代。
- source_word: וְעֹמֵד
  choice: 他站着
  rationale: 保留עמד分词所表达的站立姿态，并与前半句形成平行；补出“他”使现代汉语句意清楚。
- source_word: לָדִין
  choice: 要审判
  rationale: דין在此最自然地表示司法意义上的判断或审判；“审判”清楚而不过度扩充。
- source_word: עַמִּים
  choice: 万民
  rationale: 原文为复数，指多个民族或民众群体。“万民”是自然、庄重的现代圣经汉语，同时保留广泛而未限定的范围；脚注说明也可译作“列国”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非一般称号。中文正文采用读者最熟悉的传统音译“耶和华”，避免以“主”替代专名。
- issue: עַמִּים所指的范围
  choice: 万民
  alternative: 列国
  rationale: 希伯来语复数可泛指多个民族或群体，未必专指以色列以外的国家；“万民”保留这一开放性，脚注列出“列国”的可能译法。
- issue: ריב的司法含义
  choice: 争讼
  alternative: 提出诉讼／申辩
  rationale: 上下文呈现法庭图景，但该动词本身可指争辩、诉讼或陈明案件；正文不进一步指定耶和华在诉讼程序中的具体角色。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“挺身而立”与“站着”保留原文两个近义分词的平行和法庭意象；分号呈现两个并列动作。所有脚注标记均置于正文相应词语之后。
