  source_fidelity: 正文总体准确传达了抓住兄弟、因有外衣而被推为首领、并要其承担社会崩坏局面的情景。不过“败局”通常指胜负已分的战局或失败局面，容易引入原文没有的军事／竞逐含义；מַכְשֵׁלָה在此较适合译为“祸患”或“崩溃”。“归在你手下”在现代汉语中不自然，且“归在”更易理解为隶属，而非承担责任。
  naturalness: “人会”略显泛泛，“一个人会”更贴合单数例示。将地点调整为“在自己父亲家中”更清楚。“由你来负责”以自然现代汉语表达“在你手下”的责任／管辖含义。
  terminology: “外衣”“首领”均恰当。“祸患”在此避免将该词狭义化为军事“败局”，并保留脚注中的“崩溃”与字面“绊脚石”备选。由于正文不再保留“在你手下”的字面形式，原b注释不宜继续保留。
