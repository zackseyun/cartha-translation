base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/006.yaml
  text: 'For a man will seize his brother in his father''s house: “You have a cloak[a]; you shall be our leader[b], and this ruin shall be under your hand.”'
translation:
  language: zh_hans
  text: 因为，一个人会在自己父亲家中抓住自己的兄弟，说：“你有外衣，就作我们的首领吧；这场祸患[a]由你来负责。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这场崩溃”；原文直译为“这块绊脚石”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明社会秩序崩溃时将出现的情形；“因为”保留其解释、因果作用。
- source_word: יִתְפֹּשׂ
  choice: 抓住
  rationale: 该动词表示用手抓住或拿住；“抓住”既自然，也保留了强行挽留、施压的意味。
- source_word: אִישׁ
  choice: 人
  rationale: 这里描写一个男子在家族中的具体举动；现代汉语以“人”作泛指主语自然，后面的“自己的兄弟”保留了原文的男性亲属关系。
- source_word: בְּאָחִיו
  choice: 自己的兄弟
  rationale: אָח的通常含义是“兄弟”；“父亲家里”的语境也支持直译，而不必扩大为泛指亲族。
- source_word: בֵּית אָבִיו
  choice: 在父亲家里
  rationale: 保留父系家庭的具体场景，同时比生硬的“父家”更符合现代普通话。
- source_word: שִׂמְלָה
  choice: 外衣
  rationale: 该词指衣裳，常尤指外层衣服；此处拥有一件体面的外衣竟成为被推举的条件。
- source_word: לְכָה
  choice: 你有
  rationale: 介词加代词后缀在此表达所有关系，现代汉语自然译为“你有”。
- source_word: קָצִין
  choice: 首领
  rationale: 该词指掌权或带领的人；“首领”保留权威色彩，又不强加军事职衔。
- source_word: תִּהְיֶה לָּנוּ
  choice: 就作我们的首领吧
  rationale: 未完成式在直接引语中带有要求、推举的语气；“吧”自然呈现请求兼催促的口吻。
- source_word: הַמַּכְשֵׁלָה הַזֹּאת
  choice: 这场败局
  rationale: 该名词字面与“绊倒、绊脚物”有关，在本段语境中指整个社会的破败或崩溃；正文用“败局”传达其处境含义，脚注保留字面形象及另一译法。
- source_word: תַּחַת יָדֶךָ
  choice: 归在你手下
  rationale: 保留希伯来语“在你手下”的形象表达；它在语境中表示由某人掌管或负责。
