revisions:
- from: 因为，人会在父亲家里抓住自己的兄弟，说：“你有外衣，就作我们的首领吧！这场败局[a]就归在你手下[b]。”
  to: 因为，一个人会在自己父亲家中抓住自己的兄弟，说：“你有外衣，就作我们的首领吧；这场祸患[a]由你来负责。”
  rationale: 修订“败局”为“祸患”，避免无根据地加入军事或竞逐语义，并保留原文有关绊倒／崩坏的词汇歧义于脚注。将“归在你手下”改为“由你来负责”，以自然中文准确表达“在你手下”这一希伯来语习语的责任含义；因此删除不再有对应锚点的b脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:00:02Z'
