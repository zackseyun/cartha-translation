source:
  edition: WLC
  text: עַמִּ/י֙ נֹגְשָׂ֣י/ו מְעוֹלֵ֔ל וְ/נָשִׁ֖ים מָ֣שְׁלוּ ב֑/וֹ עַמִּ/י֙ מְאַשְּׁרֶ֣י/ךָ מַתְעִ֔ים וְ/דֶ֥רֶךְ אֹֽרְחֹתֶ֖י/ךָ בִּלֵּֽעוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/012.yaml
  text: My people—his oppressors are children[a], and women rule over him. My people[b], your guides lead you astray and swallow up the course of your paths.
translation:
  language: zh_hans
  text: 我的百姓啊，欺压他们的是孩童，妇女辖管他们。我的百姓啊，给你引路的人[a]使你走入歧途，吞没了你所行道路的方向[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“给你祝福的人”或“称你为有福的人”。这个希伯来语词形可以有这种意思，但按上下文，更可能指误导百姓的领袖或引路者。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“他们吞没了你路径的道路”，以鲜明的比喻描写百姓本当遵行的路向被抹去。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשָׂיו
  choice: 欺压他们的
  rationale: נגשׂ表示强逼、压迫或严厉驱使。译作“欺压”符合本段对社会和政治秩序的谴责；第三人称阳性单数后缀所指的是集合名词“我的百姓”，汉语用复数“他们”更自然。
- source_word: מְעוֹלֵל
  choice: 是孩童
  rationale: 此处词形和句法有一定难度；结合上下文，最可能是说欺压百姓的是孩童，突出了统治者幼稚、不称职的形象，而不先行解释为抽象的“幼稚”。
- source_word: וְנָשִׁים מָשְׁלוּ בוֹ
  choice: 妇女辖管他们
  rationale: נָשִׁים通常意为“妇女”，משׁל ב表示辖管、统治。保留原文直陈，不将其泛化为“弱者”，也不扩展为关于妇女的一般性论断。
- source_word: מְאַשְּׁרֶיךָ
  choice: 给你引路的人
  rationale: 虽然אשר的加强词干可表示“称为有福”，但这里与“使你走入歧途”相连，语境更支持“引导者、领路者”。真实存在的另一词义保留在脚注中。
- source_word: מַתְעִים
  choice: 使你走入歧途
  rationale: 使役意义为“使人迷失、走错路”。此译既是现代汉语，又保留全节持续使用的道路意象。
- source_word: דֶרֶךְ אֹרְחֹתֶיךָ
  choice: 你所行道路的方向
  rationale: 原文将“道路”和“路径”两个近义词叠用。汉语译文以“所行道路的方向”保留行路及路向两层意象，同时避免生硬重复。
- source_word: בִּלֵּעוּ
  choice: 吞没了
  rationale: בלע的基本图像是吞下、吞噬或淹没；这里比抽象的“毁坏”或“弄乱”更能保留先知话语中鲜明的比喻。
theological_decisions:
- issue: “妇女辖管他们”可能被理解为对妇女统治的一般贬抑
  choice: 保留原文“妇女”及“辖管”的直接表述，只呈现本段审判语境中的社会失序图像
  alternative: 泛译为“弱者辖管他们”，或依据改读译为“债主辖管他们”
  rationale: 马所拉文本明确写作נָשִׁים（妇女）。原文优先要求不将性别指称中性化；同时译文不添加超出以赛亚当下修辞语境的普遍教义。
- issue: 集合名词“我的百姓”的代词数
  choice: 在汉语中用“他们”指集合性的百姓
  alternative: 机械保留希伯来语第三人称阳性单数，译作“他”
  rationale: 希伯来语以单数集合名词עַם承接第三人称单数后缀；汉语把“百姓”视为多人集合时通常用“他们”。此调整不改变所指，也避免现代汉语中把百姓称作单个“他”的突兀感。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我的百姓啊”保留先知话语中的直接呼告；“走入歧途—道路—方向—吞没”维持原文连续的路径意象。脚注标记放在各自实际解释的词组之后。
