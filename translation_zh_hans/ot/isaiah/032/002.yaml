base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/002.yaml
  text: And a man will be like a hiding place from the wind[a], and a shelter from the storm, like streams of water in a dry place[c][b], like the shade of a massive rock in a weary land.
translation:
  language: zh_hans
  text: 必有一人[c]，像避风之所[a]，像躲避暴雨的藏身处[b]，又像干旱之地的溪流，像疲乏之地的巨岩荫影。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“躲避风的藏身处”。
    reason: lexical_alternative
  - marker: b
    text: “暴雨”也可译作“骤雨”或“风暴”。
    reason: lexical_alternative
  - marker: c
    text: “一人”可能代表上一节所说的理想君王，也可能泛指每一位公义的首领，或在预表意义上有更深的指向。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: 必有
  rationale: 在先知性语境中表达将来或结果；与上文的衔接由中文语势自然承接。
- source_word: אִישׁ
  choice: 一人
  rationale: 保留希伯来文阳性单数及其代表性，不将所指限定为君王、众首领或弥赛亚。
- source_word: מַחֲבֵא רוּחַ
  choice: 避风之所
  rationale: 既保留具体的庇护处意象，也自然表达免受风袭的保护作用。
- source_word: סֵתֶר זָרֶם
  choice: 躲暴雨之处
  rationale: סֵתֶר指遮蔽或藏身之处；זָרֶם可指暴雨、骤雨或风暴，此处用“暴雨”突出与水势相关的恶劣天气意象。
- source_word: פַלְגֵי מַיִם
  choice: 溪流
  rationale: 指流动的水道或水流；“溪流”在现代汉语中自然，并保留旱地得水的生命意象。
- source_word: בְּצָיוֹן
  choice: 干旱之地
  rationale: 该词表示干燥、旱象或干旱地区；译法具体而不过度解释。
- source_word: צֵל סֶלַע כָּבֵד
  choice: 巨岩的荫影
  rationale: צֵל为荫影，סֶלַע为岩石或岩壁，כָּבֵד字面为“沉重”，此处以“巨”传达岩石厚重庞大、足以遮蔽的形象。
- source_word: בְּאֶרֶץ עֲיֵפָה
  choice: 疲乏之地中
  rationale: 保留 עֲיֵפָה“疲乏、困倦”的拟人化比喻，不直接改释为炎热或荒凉。
theological_decisions:
- issue: “一人”的所指
  choice: 正文保留“一人”，不作具体身份认定。
  alternative: 可理解为上一节的理想君王、每一位公义的首领，或在预表意义上指向弥赛亚。
  rationale: 紧邻上文同时提到君王和首领，单数可能具有代表作用；原文本身并未在本节明确限定，因此保留其解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；四个并列比喻保持诗性节奏。“疲乏之地”刻意保留原文拟人化表达。所有脚注标记均置于正文相关位置。
