  yaml_path: translation/ot/isaiah/032/012.yaml
  text: They beat their breasts in mourning over the delightful fields[b][a], over the fruitful vine.
translation:
  language: zh_hans
  text: 他们捶胸哀哭，为可喜爱的田地，为多结果子的葡萄树。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们为胸脯哀哭，为可喜爱的田地，为多结果子的葡萄树。”希伯来文表达简省；许多人把“胸”和“哀哭”理解为悲痛时捶胸的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁדַיִם
  choice: 胸
  rationale: 该词直译为“乳房、胸部”。结合哀哭语境，汉语用“捶胸”自然表达悲痛时击打胸部的动作，同时保留原文的身体意象。
- source_word: סֹפְדִים
  choice: 哀哭
  rationale: 该分词表示哀悼、悲叹。与前面的“胸”合起来，译作“捶胸哀哭”，补出希伯来文压缩表达中隐含的动作。
- source_word: שְׂדֵי חֶמֶד
  choice: 可喜爱的田地
  rationale: חֶמֶד含有可喜爱、宝贵、令人向往之意；“可喜爱的田地”既保留评价色彩，也适合庄重的现代汉语。
- source_word: גֶּפֶן פֹּרִיָּה
  choice: 多结果子的葡萄树
  rationale: גֶּפֶן指葡萄树，פֹּרִיָּה指多结果实、丰产；此译清楚保留农业意象。
- source_word: עַל
  choice: 为
  rationale: 这里反复出现的עַל标示哀悼的对象或缘由。汉语以重复的“为”自然呈现原文平行结构。
