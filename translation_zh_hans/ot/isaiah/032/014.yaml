  to: 因为宫殿被撇下，喧闹的城[a]被离弃；俄斐勒[b]和瞭望塔将永远沦为洞穴[c]，作野驴的乐园、羊群的牧场。
  rationale: 修订主要解决后半句的句法歧义和现代汉语搭配问题。“将永远沦为洞穴”明确承载 עַד עוֹלָם 所修饰的持久荒废状态；“作野驴的乐园、羊群的牧场”以自然、庄重的汉语重现两个并列构词短语。未将地名普通化，亦未对“永远”作神学性限缩。
