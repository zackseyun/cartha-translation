  text: כִּֽי אַרְמ֣וֹן נֻטָּ֔שׁ הֲמ֥וֹן עִ֖יר עֻזָּ֑ב עֹ֣פֶל וָ/בַ֜חַן הָיָ֨ה בְעַ֤ד מְעָרוֹת֙ עַד עוֹלָ֔ם מְשׂ֥וֹשׂ פְּרָאִ֖ים מִרְעֵ֥ה עֲדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/014.yaml
  text: For the palace is abandoned[a], the crowded city is forsaken; Ophel and the watchtower have become caves forever, a joy for wild donkeys[c][b], a pasture for flocks.
translation:
  language: zh_hans
  text: 因为宫殿被撇下，喧闹的城[a]被离弃；俄斐勒[b]和瞭望塔将永远沦为洞穴[c]，作野驴的乐园、羊群的牧场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喧闹的城”也可译作“人烟稠密的城”；原文所用的词可指城中的众人或喧嚷声。
    reason: lexical_alternative
  - marker: b
    text: “俄斐勒”是地名，可能指耶路撒冷设有防御工事的山冈或高地。
    reason: cultural_note
  - marker: c
    text: “沦为洞穴”也可译作“沦为兽穴”；原文可能着重描写城防废墟成为动物栖居之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְמוֹן
  choice: 宫殿
  rationale: 该词可指王宫或坚固的显要建筑；在这里译作“宫殿”自然贴切，也与城市荒废的图景相符。
- source_word: נֻטָּשׁ
  choice: 被撇下
  rationale: 保留被动含义，表达建筑遭人遗弃；并与下文“被离弃”形成近义平行。
- source_word: הֲמוֹן עִיר
  choice: 喧闹的城
  rationale: הֲמוֹן 可指众人、熙攘或声响；“喧闹的城”既反映城市昔日的人声繁盛，也不把含义缩限为人口稠密。
- source_word: עֻזָּב
  choice: 被离弃
  rationale: 准确表达 עזב 被动式的“被留下、被弃置”，同时保留与“被撇下”的平行和措辞变化。
- source_word: עֹפֶל
  choice: 俄斐勒
  rationale: 此处最可能是耶路撒冷一处有防御设施的山冈或高地之名，因此采用音译，并以脚注说明。
- source_word: בַּחַן
  choice: 瞭望塔
  rationale: 该词在此很可能指用于观察或守望的塔楼，与俄斐勒共同构成城防设施的图景。
- source_word: הָיָה בְעַד מְעָרוֹת
  choice: 成了洞穴
  rationale: 按上下文表达城防建筑沦为洞穴或兽穴般废墟的意思；汉语用复数复合主语搭配“成了”自然通顺。
- source_word: מְעָרוֹת
  choice: 洞穴
  rationale: 采用该词“洞穴、岩洞”的基本含义，同时让荒墟成为动物栖息地的意象自然显现。
- source_word: עַד עוֹלָם
  choice: 直到永远
  rationale: 保留先知审判语言中表示持续无尽或极其长久的惯用说法，不擅自限定其时长。
- source_word: מְשׂוֹשׂ פְּרָאִים
  choice: 野驴嬉乐之地
  rationale: מְשׂוֹשׂ 表示欢喜、嬉乐；译文保留荒城反倒成为野驴乐园的强烈反差。
- source_word: מִרְעֵה עֲדָרִים
  choice: 群羊吃草之处
  rationale: מִרְעֵה 指牧场或放牧、吃草之地，עֲדָרִים 指成群的牲畜；此译法现代自然，并呈现牧放图景。
theological_decisions:
- issue: “直到永远”的持续范围
  choice: 直译为“直到永远”，不在正文中限定期限
  alternative: 译为“长久”或“世世代代”
  rationale: 原文 עַד עוֹלָם 本身具有持久乃至无尽的张力；译文不根据后续经文或特定末世论体系预先消解这一表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“被撇下／被离弃”保留希伯来诗句的近义平行；后半句用“嬉乐之地／吃草之处”再现并列节奏。地名“俄斐勒”音译并加注，避免在正文中武断解释为普通地貌。
