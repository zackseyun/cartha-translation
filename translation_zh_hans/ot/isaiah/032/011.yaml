  text: חִרְדוּ֙ שַֽׁאֲנַנּ֔וֹת רְגָ֖זָה בֹּֽטְח֑וֹת פְּשֹׁ֣טָֽה וְ/עֹ֔רָה וַ/חֲג֖וֹרָה עַל חֲלָצָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/011.yaml
  text: Tremble[a], you complacent women; shudder, you confident ones. Strip, make yourselves bare[c][b], and tie sackcloth around your waist.
translation:
  language: zh_hans
  text: 安逸的妇女啊，战兢吧！自以为安稳的妇女啊，发抖吧！脱去衣服，赤身露体，在腰间围上麻布[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说所围的是“麻布”；按先知书中哀悼的语境，通常理解为围上麻布。
    reason: cultural_note
  - marker: b
    text: “腰间”直译为“在腰胯处”或“在髋部”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חִרְדוּ
  choice: 要战兢
  rationale: 该词是复数祈使式，表示因恐惧而颤抖；“战兢”简洁庄重，也符合先知警告的语气。
- source_word: שַׁאֲנַנּוֹת
  choice: 安逸的女子
  rationale: 阴性复数形式，指生活安逸、无忧而可能麻木的人；“安逸”保留其状态描述，不把责备意味过度强化为“自满”。
- source_word: רְגָזָה
  choice: 要发抖
  rationale: 阴性复数祈使式，与前句平行，含震动、惊惶之意；“发抖”自然，并与“战兢”形成有变化的对应。
- source_word: בֹּטְחוֹת
  choice: 自以为安稳的女子
  rationale: 阴性复数分词，指觉得自己安全稳妥的人；“自以为”表达先知语境中的反讽，但不把这种把握具体解释为信靠某一对象。
- source_word: פְּשֹׁטָה וְעֹרָה
  choice: 脱去衣服，赤露身体
  rationale: 两个连续的阴性复数祈使式分别表达脱下与裸露；译文保留递进和强烈意象，同时使用现代汉语。
- source_word: וַחֲגֹרָה
  choice: 把麻布束在
  rationale: 动词意为束上、围系；原文未明说所束之物，译入“麻布”依据先知书哀悼语境，但以脚注明确这是补足。
- source_word: עַל חֲלָצָיִם
  choice: 腰间
  rationale: 字面指腰胯、腰部；“腰间”符合现代汉语中围束衣物的自然表达。
theological_decisions:
- issue: 安逸与安稳的语气强度
  choice: 分别译为“安逸”和“自以为安稳”
  alternative: “自满”和“自信”
  rationale: 原词首先描述无忧与有安全感的状态；译文保留先知责备和反讽，却避免加入过强的道德或心理判断。
- issue: 是否在正文补出哀悼用的麻布
  choice: 正文补出“麻布”，并加脚注说明
  alternative: 仅译“束在腰间”，保留未明说的宾语
  rationale: 上下文与先知哀悼惯例强烈指向麻布，补出后普通读者容易理解；脚注则保存原文的省略和由此产生的解释空间。
translation_notes:
  register: 采用现代、庄重而直接的先知性警告语体；保留对女性群体的明确称呼和四个命令的急迫节奏。正文对省略宾语作必要补足，并以脚注标明，避免把语境推断伪装成原文明说。
