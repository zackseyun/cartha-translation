revisions:
- from: 安逸的女子啊，要战兢；自以为安稳的女子啊，要发抖。脱去衣服，赤露身体，把麻布[a]束在腰间[b]。
  to: 安逸的妇女啊，战兢吧！自以为安稳的妇女啊，发抖吧！脱去衣服，赤身露体，在腰间围上麻布[a][b]。
  rationale: 修订以直接祈使式再现原文急迫的先知性警告；以“妇女”避免无依据的年龄暗示；以“赤身露体”改善自然度并保留原文两个连续命令的强化效果。保留正文中按哀悼语境补出的“麻布”，同时通过紧邻脚注明确其并非原文显明的宾语；并更正腰胯词组的脚注释义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:21:03Z'
review_pass:
  verdict: revise
  source_fidelity: 译文正确保留了阴性复数受话者、四个祈使语气及末句“束/围于腰胯处”的结构。惟“要战兢／要发抖”较像将来或劝告式表达，不如直接祈使语气贴合原文。末句原文未明示所围之物；若依上下文补出“麻布”，必须由脚注清楚说明。
  naturalness: “赤露身体”在现代汉语中略显生硬；“赤身露体”是自然、庄重且能表达两项连续命令所造成的彻底暴露。以“战兢吧／发抖吧”表达先知性命令，也比“要……”更直接。
  terminology: “妇女”较“女子”更适合指称原文所面向的成年女性群体，避免“女子”可能带出的年龄色彩。“安逸”与“自以为安稳”可分别对应原文的安逸与自觉安全。脚注b应准确说明“腰间”所译的希伯来语词组，不能译作“腰胯之上”。
  issues:
  - severity: medium
    issue: 祈使语气译为“要战兢／要发抖”
    rationale: “要”在现代汉语中可作命令，但也常带将来、应当或预测色彩；原文是直接的复数祈使，宜用“战兢吧／发抖吧”等直接命令式。
  - severity: low
    issue: “赤露身体”不够自然
    rationale: 该表达可理解，但不如“赤身露体”符合现代庄重汉语的固定表达；后者仍保留脱衣与裸露的强化序列。
  - severity: low
    issue: 脚注b的直译说明不准确
    rationale: עַל חֲלָצָיִם意为“在腰胯处／在髋部”，并非“腰胯之上”。
  - severity: low
    issue: “女子”可能带来不必要的年龄含义
    rationale: 原文的阴性复数是语法性别标记，未限定年轻女性；“妇女”更为中性、合乎上下文。
  revised_text: 安逸的妇女啊，战兢吧！自以为安稳的妇女啊，发抖吧！脱去衣服，赤身露体，在腰间围上麻布[a][b]。
