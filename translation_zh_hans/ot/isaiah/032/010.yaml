base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/010.yaml
  text: In little more than a year you will tremble[a], you complacent women, because the grape harvest will fail[c][b]; the fruit harvest will not come.
translation:
  language: zh_hans
  text: 一年零几天后[a]，你们这些自以为安稳的妇女[b]必战栗；因为葡萄的收成必会落空，收聚的时节也不会来到[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“日子加在一年之上”，指满一年后再过不久。
    reason: lexical_alternative
  - marker: b
    text: 或译：“安稳的妇女”或“自信的妇女”。
    reason: lexical_alternative
  - marker: c
    text: “收聚”也可译为“收成”或“农产的收获”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל שָׁנָה
  choice: 一年零几天以后
  rationale: 原文直译为“日子加在一年之上”，表示一年以后再过一小段时间。此译保留其具体而迫近的时间感，同时符合现代汉语表达。
- source_word: תִּרְגַּזְנָה
  choice: 必战栗
  rationale: רגז可指震动、战栗或惊惶不安；在先知警告的语境中，“战栗”既保留身体颤抖的意象，也传达即将临到的恐惧。
- source_word: בֹּטְחוֹת
  choice: 自以为安稳的妇女
  rationale: 该阴性复数分词指感到安全、笃定的人。结合上下文的责备语气，“自以为安稳”表达这种安全感可能并不可靠，同时明确保留女性复数所指。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出她们将要战栗的原因；“因为”清楚保留因果关系。
- source_word: כָּלָה
  choice: 必断绝
  rationale: 该完成式在先知话语中可把未来之事说成确定事实。“断绝”比单纯“结束”更能表达葡萄收成落空，却不额外指定灾害原因。
- source_word: בָצִיר
  choice: 葡萄收成
  rationale: בָצִיר特指葡萄的采摘或葡萄收获；“葡萄收成”对现代读者明确自然。
- source_word: אֹסֶף
  choice: 收聚之期
  rationale: 此名词指农产的收聚、总收成。译为“收聚之期”保留原文较宽泛的农业意象，不擅自限定为某一种果实。
- source_word: בְּלִי יָבֹא
  choice: 也不会来到
  rationale: 原文近于“没有来到”；此译保留人们期待收聚时节来临、它却未能来到的具体意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必……也不会……”呈现先知宣告的确定性；“自以为安稳”保留上下文中的责备意味，但脚注列出较中性的词义可能。
