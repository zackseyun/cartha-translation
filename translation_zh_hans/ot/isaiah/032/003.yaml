source:
  edition: WLC
  text: וְ/לֹ֥א תִשְׁעֶ֖ינָה עֵינֵ֣י רֹאִ֑ים וְ/אָזְנֵ֥י שֹׁמְעִ֖ים תִּקְשַֽׁבְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/003.yaml
  text: Then the eyes of those who see will not be dim[a], and the ears of those who hear will listen attentively.
translation:
  language: zh_hans
  text: 那时，看得见的人的眼睛不再昏暗[a]，听得见的人的耳朵必留心聆听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“眼睛不再受蒙蔽”。这里的希伯来语动词可指眼目昏暗、受阻或被遮蔽。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: 那时……不再
  rationale: 句首的 וְ 承接前文所述的更新景象，译作“那时”显出语意推进；לֹא 直接表达否定，结合预言语境以“不再”自然呈现状态的改变。
- source_word: תִשְׁעֶינָה
  choice: 昏花
  rationale: 此处动词语义较少见，可指眼睛受损、模糊或被遮蔽。“昏花”贴合视觉不清的意象，也避免把含义限定为完全失明；另译可能见脚注。
- source_word: עֵינֵי רֹאִים
  choice: 能看见之人的眼睛
  rationale: 保留“眼睛”与分词“看见的人”的结构及看似悖论性的表达，不将其解释性改写为先知或领袖。
- source_word: וְאָזְנֵי שֹׁמְעִים
  choice: 能听见之人的耳朵
  rationale: 保留与前半句对应的领属结构和感官意象，使“眼睛—耳朵、看见—听见”的平行关系清楚可见。
- source_word: תִּקְשַׁבְנָה
  choice: 必留心聆听
  rationale: קשׁב 不只是听见声音，更包含专注、留意之意；“留心聆听”兼顾动作和专注程度。
theological_decisions:
- issue: 恢复的感知是身体医治还是属灵、道德上的辨识
  choice: 保留眼睛和耳朵的具体感官语言，同时让上下文中的辨识与领受含义自然显现
  alternative: 直接解释为身体失明、失聪得医治，或改译为属灵悟性得到恢复
  rationale: 以赛亚书32:1–4的语境涉及公义治理、认识与表达的更新。原文用感官语言承载更广的辨识意涵，但并未排除实际恢复的图景，因此正文不把这一张力化约为单一解释。
- issue: רֹאִים 是否特指先知性的“先见”
  choice: 译作“能看见之人”
  alternative: 译作“先见”或“先知”
  rationale: 这里的分词与“能听见之人”平行，较自然地泛指具有感知能力的人；译成技术性称谓会无根据地缩窄所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“昏花”保留视觉受损的具体意象；“留心聆听”准确表达专注倾听。两分句维持希伯来诗句的平行结构，并以“那时”自然承接前文。
