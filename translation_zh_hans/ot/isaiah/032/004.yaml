  yaml_path: translation/ot/isaiah/032/004.yaml
  text: The heart of the hasty will understand knowledge[b][a], and the tongue of stammerers will hasten to speak clearly.
translation:
  language: zh_hans
  text: 急躁人[a]的心必明白知识；口吃者的舌头必迅速清楚地说话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “急躁人”也可译作“鲁莽的人”，指行事或判断仓促、冲动的人。
    reason: lexical_alternative
  - marker: b
    text: “必迅速清楚地说话”也可译作“必赶快说得明白”或“必流利地说话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַב
  choice: 心
  rationale: 保留希伯来语的人观表达；这里的“心”由“明白”限定，指思考、理解的内在官能，不只是情感。
- source_word: נִמְהָרִים
  choice: 急躁人
  rationale: 该词指行事或判断仓促、冲动的人。“急躁人”自然简洁，并保留其负面的性格色彩。
- source_word: יָבִין לָדַעַת
  choice: 必明白知识
  rationale: 较贴近原文“明白／辨明”与“知识／知道”的认知性搭配；虽略带诗性，却保留原文措辞与意义张力。
- source_word: לְשׁוֹן
  choice: 舌头
  rationale: 采用具体的身体意象，并与上句的“心”形成诗歌平行。
- source_word: עִלְּגִים
  choice: 口吃者
  rationale: 指言语含混、迟滞或结巴的人；“口吃者”在现代汉语中清楚而不过度解释。
- source_word: תְּמַהֵר
  choice: 必能迅速
  rationale: Piel形式表达迅速、敏捷。加入“能”使汉语自然，并突出其言语能力得到转变，而“迅速”仍保留与上句“急躁”的词根呼应。
- source_word: לְדַבֵּר צָחוֹת
  choice: 说出清楚的话
  rationale: צָחוֹת表示清楚、明白或流利的言语；名词化表达比“清楚地说”更自然，也保留其可能指清晰言辞而非单指发音的范围。
theological_decisions: []
