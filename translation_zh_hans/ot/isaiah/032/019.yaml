  text: And it will hail when the forest falls[a], and the city will be utterly laid low in the lowland.
translation:
  language: zh_hans
  text: 当森林倒下时，必有冰雹降下[a]；城必在低地被彻底夷平。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“冰雹在森林降下（倒下）时降下。”希伯来文以“冰雹”为主语；“在森林降下时”是时间性短语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרַד
  choice: 冰雹必降下
  rationale: ברד可理解为与冰雹有关的非人称天气表达；汉语用“冰雹必降下”既自然，也保留“冰雹”作为显明意象。句首连接词在汉语中不必机械译作“并且”，以免生硬。
- source_word: בְּרֶדֶת
  choice: ……也必倒下
  rationale: 这是ירד（下去、降下）的不定式构造，前接ב通常表达时间关系，即“当……倒下时”。正文将这一关系顺译为两个相伴发生的事件，脚注保留较形式对应的时间句法。
- source_word: הַיָּעַר
  choice: 森林
  rationale: יער指森林或林地；“森林”是现代汉语中最直接、清楚的对应词。
- source_word: וּבַשִּׁפְלָה
  choice: 在低地
  rationale: שפלה表示低洼地区或低地；“低地”保留地形含义，也与后面的“夷平”形成原文的语义呼应。
- source_word: תִּשְׁפַּל
  choice: 必被彻底夷平
  rationale: שׁפל表示降低、变低或遭贬抑。以“城”为主语时，此处描写灾难性的倾覆，并非道德意义上的谦卑；“被彻底夷平”自然传达其强烈后果。
- source_word: הָעִיר
  choice: 城
  rationale: עיר是“城、城市”的普通用词；此处用简洁而庄重的“城”表达其定指性质。
