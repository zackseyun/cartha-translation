  text: עַד יֵ֨עָרֶ֥ה עָלֵ֛י/נוּ ר֖וּחַ מִ/מָּר֑וֹם וְ/הָיָ֤ה מִדְבָּר֙ לַ/כַּרְמֶ֔ל ו/כרמל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/015.yaml
  text: until a spirit from on high is poured out on us[a], and the wilderness becomes a fruitful field[b], and the fruitful field is regarded as a forest.
translation:
  language: zh_hans
  text: 直到从高天而来的灵倾注在我们身上[a]；那时，旷野将变成沃野[b]，沃野将被看作森林。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到上帝的灵从高天倾注在我们身上。”希伯来语“灵”（רוּחַ）也可指风或气息；在本句语境中，可能特指上帝的灵。
    reason: alternative_reading
  - marker: b
    text: “沃野”所译的希伯来语是כַּרְמֶל，指肥沃或经过耕作的土地；这里大概不是地名“迦密”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: 直到
  rationale: 标明前述状态延续的时间界限，也自然引出此后的转变。
- source_word: יֵעָרֶה
  choice: 浇灌
  rationale: 该词为 ערה 的尼法勒式，表达“被倾倒、被浇下”；中文用主动形式“有灵……浇灌”较自然，同时“浇灌在……身上”保留倾注的意象。
- source_word: עָלֵינוּ
  choice: 在我们身上
  rationale: 介词 עַל 与此动词搭配表示倾注所临到的对象；此译符合现代汉语习惯。
- source_word: רוּחַ
  choice: 有灵
  rationale: רוּחַ 可指灵、风或气息；本句从高天而来并带来更新的语境以“灵”最合适。希伯来文没有冠词，故正文不径直限定为“圣灵”，以保留原文张力。
- source_word: מִמָּרוֹם
  choice: 从高天
  rationale: מָרוֹם 指高处或至高之处；“高天”自然传达来自上方、属天领域的含义。
- source_word: וְהָיָה
  choice: 变成
  rationale: 形式上表示“将成为”，在这里引出浇灌所带来的结果；“变成”清楚呈现转化。
- source_word: מִדְבָּר
  choice: 旷野
  rationale: 既保留未经耕作之地的宽泛意义，也与后面的肥沃土地形成鲜明对比。
- source_word: כַּרְמֶל
  choice: 沃野
  rationale: 此处 כַּרְמֶל 更可能是普通名词，指肥沃、可耕种的土地，而非地名“迦密”；“沃野”简洁地表达这一含义。
- source_word: יַעַר
  choice: 树林
  rationale: יַעַר 指树林或森林；“树林”在此与沃野构成土地丰盛程度进一步提升的意象。
- source_word: יֵחָשֵׁב
  choice: 被看作
  rationale: חשב 的尼法勒式在此意为“被认为、被算作”；“被看作”清楚自然，并保留评价或认定的语气。
theological_decisions:
- issue: רוּחַ 是否应在正文中明确译为圣灵
  choice: 有灵从高天
  alternative: 圣灵从高天／那灵从高天
  rationale: 语境强烈暗示上帝赐生命、带来更新的作为，读者可以理解为上帝的灵；但原文没有冠词，也未出现“圣”字。正文因此保留较宽的“有灵”，脚注说明更具体的可能，以免把神学判断直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“高天”保留诗歌性的属天意象；“旷野—沃野—树林”形成简洁鲜明的递进。正文避免明确增译“圣灵”，借脚注保存原文的词义范围与神学张力。
