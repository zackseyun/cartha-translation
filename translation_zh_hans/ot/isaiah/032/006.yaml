id: ISA.32.6
reference: Isaiah 32:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י נָבָל֙ נְבָלָ֣ה יְדַבֵּ֔ר וְ/לִבּ֖/וֹ יַעֲשֶׂה אָ֑וֶן לַ/עֲשׂ֣וֹת חֹ֗נֶף וּ/לְ/דַבֵּ֤ר אֶל יְהוָה֙ תּוֹעָ֔ה לְ/הָרִיק֙ נֶ֣פֶשׁ רָעֵ֔ב וּ/מַשְׁקֶ֥ה צָמֵ֖א יַחְסִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/006.yaml
  text: 'For a fool speaks folly[a], and his heart devises iniquity: to practice godlessness and to speak error against Yahweh[c][b], to leave the hungry person empty and to withhold drink from the thirsty.'
translation:
  language: zh_hans
  text: 因为愚顽人说愚妄的话，他心里图谋罪孽：行不敬虔的事，说有关雅威的谬妄之言[a]，使饥饿的人空腹[b]，不给口渴的人水喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说有关雅威的谬妄之言”也可译作“说攻击雅威的谬妄之言”或“说关于雅威的虚假之言”。
    reason: 介词אֶל可表示言论所关乎的对象，也可带有针对的意味；תּוֹעָה可指谬妄、错误或虚假。
  - marker: b
    text: 原文直译为“使饥饿者的נֶפֶשׁ空空”；这里的נֶפֶשׁ指饥饿之人的生命、本人或食欲，并非专指“灵魂”。
    reason: 说明希伯来语נֶפֶשׁ在具体饥饿语境中的语义范围。
lexical_decisions:
- source_word: נָבָל / נְבָלָה
  choice: 愚顽人／愚妄的话
  rationale: 保留希伯来语的词根呼应；“愚顽”在此指道德和属灵上的悖谬，并非单指智力不足。
- source_word: וְלִבּוֹ יַעֲשֶׂה אָוֶן
  choice: 他心里图谋罪孽
  rationale: לֵב指人的思想与意志中心；יַעֲשֶׂה在此表达内心酝酿、筹划恶事，用“图谋”较符合现代汉语。
- source_word: חֹנֶף
  choice: 不敬虔的事
  rationale: 该词在以赛亚书中可指亵渎、不虔或伪善；上下文涉及对雅威的错误言论，因此正文采用范围较广的“不敬虔”。
- source_word: אֶל יְהוָה תּוֹעָה
  choice: 谈论雅威时说谬误
  rationale: אֶל在此可表示针对或关于；תּוֹעָה是偏差、谬误或虚假。正文采用自然且保留指涉开放性的表达，脚注列出敌对方向的可能译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，区别于作为称号的“主”。
- source_word: לְהָרִיק נֶפֶשׁ רָעֵב
  choice: 使饥饿的人腹中空空
  rationale: נֶפֶשׁ此处指有饥饿需求的人或其食欲、生命，并非狭义的非物质“灵魂”；汉语以“腹中空空”传达实际匮乏。
- source_word: וּמַשְׁקֶה צָמֵא יַחְסִיר
  choice: 不给口渴的人水喝
  rationale: 直译概念为使口渴者缺少饮品；此译简洁自然，并清楚表达蓄意剥夺其所需饮水。
theological_decisions:
- issue: חֹנֶף的伦理—宗教含义
  choice: 不敬虔的事
  alternative: 伪善的事
  rationale: 该词不仅可指虚伪，也可泛指亵渎和不虔；本节将其与对雅威的谬误言论及剥夺贫弱者相连，故不宜缩窄为表里不一。
- issue: נֶפֶשׁ在饥饿语境中的所指
  choice: 饥饿的人腹中
  alternative: 饥饿者的灵魂／食欲
  rationale: 此处所说的是处于身体匮乏中的人或其生命、胃口；避免用“灵魂”造成身心二分的误解。
- issue: אֶל יְהוָה的关系含义
  choice: 谈论雅威时
  alternative: 攻击雅威／对雅威
  rationale: 介词可表达关于或针对；正文不将其敌对方向过度确定，脚注保留“攻击雅威”的可能理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愚顽人／愚妄”保留原文文字呼应；冒号呈现后续不定式对“罪孽”内容的展开。神名译作“雅威”。
