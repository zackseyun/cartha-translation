  text: אַשְׁרֵי/כֶ֕ם זֹרְעֵ֖י עַל כָּל מָ֑יִם מְשַׁלְּחֵ֥י רֶֽגֶל הַ/שּׁ֖וֹר וְ/הַ/חֲמֽוֹר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/020.yaml
  text: Blessed are you who sow beside all waters[a], who let the feet of the ox and the donkey range free.
translation:
  language: zh_hans
  text: 你们在一切水边撒种，任牛和驴自由走动[a]，有福了！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“放出牛和驴的脚”，意思是让它们自由走动或吃草。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵיכֶם
  choice: 你们……有福了
  rationale: 该复数感叹语表达蒙福、处境可羡的状态。“有福了”保留祝福宣告的语气，也符合现代中文圣经语体。
- source_word: זֹרְעֵי
  choice: 撒种
  rationale: 分词描述受话者持续或典型的行动；置于“你们”之后，中文自然且保留其身份性含义。
- source_word: עַל כָּל מָיִם
  choice: 在一切水边
  rationale: עַל在此农业图景中宜理解为“在……旁、沿着”；“一切水边”保留כָּל מָיִם的广泛意味，并让读者联想到水源充足之地。
- source_word: מְשַׁלְּחֵי רֶגֶל
  choice: 任……自由走动
  rationale: 原文直译为“放出……的脚”，是让牲畜不受拘束地走动、放牧的表达；正文采用自然中文，脚的原始意象在脚注中说明。
- source_word: הַשּׁוֹר
  choice: 牛
  rationale: 这里指农耕环境中的牛类牲畜；中文“牛”自然，也避免无依据地限定其性别或用途。
- source_word: וְהַחֲמוֹר
  choice: 和驴
  rationale: 准确对应原文，并与“牛”共同构成农业生活的图景。
theological_decisions:
- issue: 本节的蒙福宣告与农业图景之间的关系
  choice: 保留为直接的蒙福宣告，不补出丰收、末世复兴等解释
  alternative: 将“有福”具体解释为因水源充足或将来复兴而兴旺
  rationale: 原文本身只宣告这些撒种并放养牲畜的人有福，没有明说福分的机制或时间；译文不应替文本消解其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们……有福了”保留希伯来语感叹式宣告；“任牛和驴自由走动”以自然中文表达农业习语，并用脚注保存原文“脚”的具体意象。
