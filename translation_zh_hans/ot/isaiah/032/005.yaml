  yaml_path: translation/ot/isaiah/032/005.yaml
  text: No longer will the fool be called noble[d][c][b][a], nor will the scoundrel be called generous.
translation:
  language: zh_hans
  text: 愚妄之人[a]不再被称为尊贵的人[b]，吝啬之徒[c]也不再被说成慷慨的人[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愚妄之人”也可译作“卑劣之人”或“无德之人”；原文兼有道德败坏与愚昧之意。
    reason: lexical_alternative
  - marker: b
    text: “尊贵的人”也可译作“高尚的人”或“慷慨的人”。
    reason: lexical_alternative
  - marker: c
    text: “吝啬之徒”也可译作“守财奴”或“刻薄之人”。
    reason: lexical_alternative
  - marker: d
    text: “慷慨的人”也可译作“显贵的人”“富有的人”或“有地位的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  choice: 愚顽人
  rationale: 该词不只是指智力不足，也包含道德上的愚昧、卑劣。“愚顽人”简洁地保留了智慧文学中的伦理意味。
- source_word: נָדִיב
  choice: 尊贵
  rationale: 该词可表示尊贵、慷慨或乐意施予；本节着重纠正对人的虚假社会评价，因此正文采用“尊贵”。
- source_word: כִילַי
  choice: 吝啬之徒
  rationale: 该词指吝啬、刻薄或品性卑下的人。“吝啬之徒”既保留贪吝意味，也带有相称的道德贬义。
- source_word: שׁוֹעַ
  choice: 慷慨
  rationale: 该词可涉及富有、显贵或有地位；与“吝啬之徒”对举时，“慷慨”最自然地呈现本句的伦理反差，同时在脚注保留身份和财富方面的可能含义。
- source_word: יִקָּרֵא
  choice: 被称为
  rationale: קרא 的尼法勒形在此表示被动称谓，“被称为”直接而自然。
- source_word: יֵאָמֵר
  choice: 被说成
  rationale: אמר 的尼法勒形在此表示被人如此谈论或认定；“被说成”既符合汉语，又保留其与前半句“被称为”的措辞差异。
- source_word: עוֹד
  choice: 不再
  rationale: 与否定词连用，表示以往或现有情形的终止，“不再”最为清楚简练。
theological_decisions:
- issue: 本节对比的性质
  choice: 这是社会与道德评价的纠正：败坏的人不再被冠以体面的称号。
  alternative: 可在更广语境中理解为将来理想时代的景象，或视为关于诚实评价的一般格言。
  rationale: 希伯来文本直接陈述人不再被错误地冠以尊荣称谓。上下文可以赋予这句话将来的意义，但译文不明加“弥赛亚时代”等解释，以保留其语境张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两分句结构平行，以“不再……也不再……”呈现希伯来文的对称；同时用“被称为／被说成”保留两个被动言说动词的细微差别。
