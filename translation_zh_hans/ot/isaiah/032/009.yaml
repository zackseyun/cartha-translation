  text: You complacent women[a], rise up; hear my voice. You confident daughters[c][b], listen to my word.
translation:
  language: zh_hans
  text: 安逸自得的妇女啊[a]，起来，听我的声音！安然自信的女儿们啊[b][c]，侧耳听我的话！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安逸自得”也可译作“安然无忧”或“安逸”；希伯来语既可指生活不受搅扰，也可在这里带有因安逸而疏忽的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“女儿们”；这里用作对一群女性的呼称。
    reason: cultural_note
  - marker: c
    text: “安然自信”也可译作“安稳”或“有安全感”；希伯来语强调她们感到安全、稳妥。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁים
  choice: 妇女
  rationale: 该复数名词在这里泛指妇女，并与下句“女儿们”平行；译作“妻子”会无端缩小所指范围。
- source_word: שַׁאֲנַנּוֹת
  choice: 安逸自得
  rationale: 该词表示生活不受搅扰、安然自在；在先知责备的语境中又带有疏忽自满的意味。“安逸自得”兼顾生活状态与负面语气，同时以脚注保留较中性的可能。
- source_word: קֹמְנָה
  choice: 起来
  rationale: 这是קום的阴性复数命令式。“起来”自然、直接，也保留先知急切召唤听众留意的语气。
- source_word: שְׁמַעְנָה
  choice: 听
  rationale: 这是阴性复数命令式，可表示听见或听从；此处与后句“侧耳听”平行，简洁译作“听”。
- source_word: קוֹלִי
  choice: 我的声音
  rationale: קוֹל在直接呼告中通常指“声音”；直译可保留原文与“我的话”之间的平行关系。
- source_word: בָּנוֹת
  choice: 女儿们
  rationale: 原文直译为“女儿们”，在这里是对一群女性的呼称。保留这一称谓，避免把两行都抹平为“妇女”。
- source_word: בֹּטְחוֹת
  choice: 自以为安稳
  rationale: 该分词描述主观上觉得安全、稳妥的人。语境是警告，因此“自以为安稳”表达其安全感可能并不可靠，又避免译作“信靠”而让人误解为正确的信仰。
- source_word: הַאְזֵנָּה
  choice: 侧耳听
  rationale: 这是אזן的使役词干阴性复数命令式，强调专心留意。“侧耳听”在现代中文中自然且庄重，也比单纯“听”更能体现其加强语气。
- source_word: אִמְרָתִי
  choice: 我的话
  rationale: 该名词指说出的话或言语。“我的话”简洁自然，并与前句“我的声音”形成对应。
