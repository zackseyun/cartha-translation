  text: וְ/הָיָ֛ה מַעֲשֵׂ֥ה הַ/צְּדָקָ֖ה שָׁל֑וֹם וַֽ/עֲבֹדַת֙ הַ/צְּדָקָ֔ה הַשְׁקֵ֥ט וָ/בֶ֖טַח עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/017.yaml
  text: And the work of righteousness will be peace, and the service of righteousness, quietness and security forever.
translation:
  language: zh_hans
  text: 公义的工作必带来平安；公义的劳作必带来永远的安宁和安稳。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲשֵׂה הַצְּדָקָה
  choice: 公义的工作
  rationale: מַעֲשֶׂה可指工作、行为或所产生的成果；译作“工作”既贴近基本词义，也保留其可指过程或结果的余地。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 此词可涵盖和平、健全与福祉；“平安”在本节语境中自然且保留较宽的语义范围。
- source_word: עֲבֹדַת הַצְּדָקָה
  choice: 公义的功用
  rationale: עֲבֹדָה通常指工作、劳作或服事；此处与前半句平行，并指公义所发挥的作用。“功用”避免误解为专指宗教事奉，同时以脚注保留其他可能译法。
- source_word: הַשְׁקֵט
  choice: 安宁
  rationale: 该不定式名词表达安静、平静的状态；“安宁”符合与“平安”和“安稳”并列的语境。
- source_word: בֶּטַח
  choice: 安稳
  rationale: 此词表达安全、无忧或信赖的状态；“安稳”自然体现客观安全与主观安心。
- source_word: עַד־עוֹלָם
  choice: 永远
  rationale: 直译其持续无止境之意。
theological_decisions:
- issue: 两个无系词名词句之间的结果关系
  choice: 用“必带来”表达
  alternative: 直译为“必是”
  rationale: 上下文说明公义产生平安、安宁与安稳；“必带来”使现代汉语通顺，并未把公义与平安作简单的同一认定。
- issue: עֲבֹדָה是否应译作宗教性的“事奉”
  choice: 正文译“功用”，脚注列出“工作”或“服事”
  alternative: 事奉
  rationale: 原词本身不要求宗教礼仪或特定教义含义；在本节的平行结构中，“功用”更自然，同时脚注保留词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以两个平行分句呈现希伯来诗句结构，并用“平安—安宁—安稳”保留近义词之间的层次。
