  rationale: 修订后将“欢腾的城”作为“所有欢乐的房屋”的所在／限定语，符合该句在语境中的通常句法理解及英文审计文本。以“也必如此”补足后半句所省略、并与前句呼应的结果，明确荆棘和蒺藜将蔓生覆盖这些房屋；这不是增加新的事件，而是以现代汉语再现原文的省略结构。脚注标记仍分别紧随“荆棘和蒺藜”及“欢腾的城”的对应位置。
