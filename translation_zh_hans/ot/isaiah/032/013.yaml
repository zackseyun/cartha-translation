  text: עַ֚ל אַדְמַ֣ת עַמִּ֔/י ק֥וֹץ שָׁמִ֖יר תַּֽעֲלֶ֑ה כִּ֚י עַל כָּל בָּתֵּ֣י מָשׂ֔וֹשׂ קִרְיָ֖ה עַלִּיזָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/013.yaml
  text: On the land of my people[a], thorn and brier will come up; indeed[b], over all the joyful houses in the exultant city.
translation:
  language: zh_hans
  text: 我子民的土地上必长出荆棘和蒺藜[a]；是的，欢腾的城中所有欢乐的房屋上也必如此[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长出”也可译作“冒出”。
    reason: lexical_alternative
  - marker: b
    text: “欢腾的城”也可译作“欢乐的城”；希伯来语形容这城以欢喜、雀跃为特征。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת עַמִּי
  choice: 我子民的土地
  rationale: אַדְמָה可指土地、地面或土壤；此处是审判临到百姓居住之地的语境，用“土地”自然且保留具体地域感。
- source_word: קוֹץ שָׁמִיר
  choice: 荆棘和蒺藜
  rationale: 这是一组常见于荒凉审判意象中的带刺植物名称；“荆棘和蒺藜”符合现代汉语圣经语体，又不对具体植物品种作过度限定。
- source_word: תַּעֲלֶה
  choice: 必长出
  rationale: עלה在此描写植物从地里生长出来；“必长出”清楚表达未然和确定性，也保持画面具体。
- source_word: כִּי
  choice: 甚至
  rationale: 此处更可能起强调、推进作用，而非严格表示原因；“甚至”自然引出荒芜蔓延至住宅和城中的加重描述。
- source_word: בָּתֵּי מָשׂוֹשׂ
  choice: 欢乐的房屋
  rationale: 直译为“欢乐的房屋”，可指充满喜乐或宴乐的住所；此译保留其开放性，不擅自限定为宫殿、娱乐场所或宴饮之家。
- source_word: קִרְיָה עַלִּיזָה
  choice: 欢腾的城
  rationale: עַלִּיזָה表示欢喜、雀跃；“欢腾的城”保留明面的喜乐含义，而不额外加入“安逸”或“骄纵”等解释。
theological_decisions:
- issue: 后半句省略谓语及“欢乐的房屋”与“欢腾的城”的句法关系
  choice: 补出第二个“遍及”，将二者并列呈现
  alternative: 译作“欢腾城中一切欢乐的房屋”
  rationale: 希伯来文后半句省略了与前句呼应的谓语，且马所拉重音允许把“欢乐的房屋”与“欢腾的城”看作并列对象。补出“遍及”使汉语完整，同时避免加入原文没有的“城中”而过早消除句法张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“必长出”承接先知审判宣告的确定语气；后半句保留原文省略谓语的紧凑感，但以重复“遍及”使中文关系清楚。所有脚注标记均置于对应词语之后。
