  to: 至于恶棍，他的手段邪恶[a]；他图谋恶计，要用虚谎的话毁害困苦的人[b]，即使穷人申诉的是公正的事[c]。
  rationale: 修正末句的中文语法，并以“至于恶棍”自然表达本节承接上下文的对比。“虚谎的话”更贴近“虚假言语”的复数表达；“毁害”保留动词所表达的蓄意败坏／毁灭，而不限定为杀害。脚注完整保留末句句法和מִשְׁפָּט词义的歧义。
