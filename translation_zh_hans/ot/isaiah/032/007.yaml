source:
  edition: WLC
  text: וְ/כֵלַ֖י כֵּלָ֣י/ו רָעִ֑ים ה֚וּא זִמּ֣וֹת יָעָ֔ץ לְ/חַבֵּ֤ל ענוים בְּ/אִמְרֵי שֶׁ֔קֶר וּ/בְ/דַבֵּ֥ר אֶבְי֖וֹן מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/007.yaml
  text: And the rogue’s devices are evil[a]; he devises schemes to ruin the humble with lying words[c][b], even when the poor man speaks what is just.
translation:
  language: zh_hans
  text: 至于恶棍，他的手段邪恶[a]；他图谋恶计，要用虚谎的话毁害困苦的人[b]，即使穷人申诉的是公正的事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “手段”也可译作“工具”“器具”或“兵器”；希伯来词既可指具体器物，也可比喻所采用的方法。
    reason: lexical_alternative
  - marker: b
    text: “困苦的人”也可译作“谦卑的人”“温顺的人”或“受苦的人”。
    reason: lexical_alternative
  - marker: c
    text: 末句直译近于“并在穷人说出公正（或：案件）时”。也可能指恶棍即使面对穷人有理的申诉，仍企图陷害他。
    reason: ambiguity
lexical_decisions:
- source_word: כֵלַי / כֵּלָיו
  choice: 手段
  rationale: כְּלִי本指器具、工具或兵器，在此与谋划恶计相联，用作比喻，指恶棍所采用的手段；“手段”在现代汉语中自然，并保留具体名词转为方法之意。
- source_word: רָעִים
  choice: 邪恶的
  rationale: 该形容词在先知谴责的语境中具有明确的道德分量，“邪恶”比一般的“坏”更贴切。
- source_word: זִמּוֹת יָעָץ
  choice: 图谋恶计
  rationale: זִמּוֹת指筹划或计谋，语境含恶意；יָעָץ在此是谋划之意。“图谋恶计”简洁表达蓄意策划害人的含义。
- source_word: לְחַבֵּל
  choice: 要……毁掉
  rationale: 此处表达伤害、败坏或使人遭毁灭的意图；“毁掉”保留强烈程度，同时不限定为杀死。
- source_word: ענוים
  choice: 困苦的人
  rationale: 该词可指谦卑、温顺或受苦受压的人。此处是恶棍借谎言加害弱者的社会语境，“困苦的人”保留受压受苦的含义，也避免与后文专指贫穷者的אֶבְיוֹן完全重合。
- source_word: בְּאִמְרֵי שֶׁקֶר
  choice: 用谎言
  rationale: 介词ב表示手段；“用谎言”是简洁自然的现代汉语，也准确传达“借虚假言语”的意思。
- source_word: אֶבְיוֹן
  choice: 穷人
  rationale: אֶבְיוֹן为阳性单数，指贫穷或缺乏的人。汉语“穷人”既可对应单数代表性用法，也无需额外标明性别。
- source_word: וּבְדַבֵּר אֶבְיוֹן מִשְׁפָּט
  choice: 即使穷人所申诉的合乎公正
  rationale: בְּדַבֵּר可按时间或伴随情形理解，מִשְׁפָּט可指公正、判决或合法正当的诉求。此译结合司法语境表达“穷人提出有理案件时仍遭陷害”，但以脚注保留原文较凝练的歧义。
theological_decisions:
- issue: ענוים所指是谦卑者还是受苦者
  choice: 困苦的人
  alternative: 谦卑的人／温顺的人
  rationale: 该词兼有社会处境和品格层面的语义。上下文聚焦恶棍以虚假言语伤害弱者，并与后文“穷人”相接，因此正文采用处境性较强的“困苦的人”，脚注保留其他可能。
- issue: 末句与前文的逻辑关系
  choice: 即使穷人所申诉的合乎公正
  alternative: 穷人申说公正／在穷人申诉案件时
  rationale: 希伯来语结构可作时间、伴随或让步理解，而מִשְׁפָּט也可指公正或案件。正文采用语境顺畅的让步理解，却不把它提升为教义判断，并在脚注注明直译与其他可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“恶棍”承接上一节的人物类型；分号保留两小句的紧密平行。“申诉”体现מִשְׁפָּט可能具有的司法语境，同时脚注保留“公正／案件”及句法关系的歧义。
