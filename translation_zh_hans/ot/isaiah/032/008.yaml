  yaml_path: translation/ot/isaiah/032/008.yaml
  text: But a noble man plans noble things[b][a], and he stands on noble things.
translation:
  language: zh_hans
  text: 但高尚的人筹划高尚的事[a]；他必立足于高尚的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高尚的事”也可译作“慷慨的事”。希伯来语 נָדִיב／נְדִיבוֹת 可含尊贵、高尚或慷慨之意。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他必因高尚的事站立得住”、“他必在高尚的事上站立”，或“他必坚守高尚的事”。希伯来语 עַל … יָקוּם 的表达简练，可指在其上站立、由此得以确立，或持续坚守。
    reason: alternative_reading
lexical_decisions:
- source_word: נָדִיב
  choice: 高尚的人
  rationale: 该词可指尊贵、慷慨之人；本节与上文卑劣之人形成品格上的对照，因此译作“高尚的人”，避免限定为政治身份。
- source_word: נְדִיבוֹת
  choice: 高尚的事
  rationale: 复数抽象名词可指高尚或慷慨的意图与行为；如此翻译既与נָדִיב形成词根呼应，也保留较宽的语义范围。
- source_word: יָעָץ
  choice: 谋划
  rationale: 此处表示构想、筹划，而非向别人提供劝告；“谋划”自然地表达有意识地定意。
- source_word: עַל
  choice: 凭
  rationale: 与יקום连用时可表达立足的根据或使人站立的凭借；“凭”在现代汉语中比直译“在……之上”更自然，同时保留支撑关系。
- source_word: יָקוּם
  choice: 立稳
  rationale: קום的基本义为起来、站立；语境中可能含坚持或确立之意。“立稳”兼顾具体意象与坚定持续的伦理意味。
theological_decisions:
- issue: עַל ... יָקוּם所表达的关系
  choice: 他也凭高尚的事立稳
  alternative: 他也坚守高尚的事／他也在高尚的事上站立
  rationale: 希伯来语表达简练，可理解为凭这些事站立、在其中确立，或持续坚守。正文采用自然且保留支撑意象的译法，并以脚注说明其他可能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“高尚的人／高尚的事”重现原文同源词的反复；“谋划”与“立稳”保持两分句的简洁和平衡。
