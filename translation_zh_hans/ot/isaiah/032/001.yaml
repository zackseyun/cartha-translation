id: ISA.32.1
reference: Isaiah 32:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵ֥ן לְ/צֶ֖דֶק יִמְלָךְ מֶ֑לֶךְ וּ/לְ/שָׂרִ֖ים לְ/מִשְׁפָּ֥ט יָשֹֽׂרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/001.yaml
  text: Behold[a], a king will reign in righteousness[d][c][b], and princes will rule with justice.
translation:
  language: zh_hans
  text: 看哪[a]，必有一位君王按公义掌权[b][d]，众首领也必秉公治理[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“请看”或“看”。
    reason: lexical_alternative
  - marker: b
    text: “按公义掌权”也可译作“公正地掌权”；希伯来文直译为“为着／按照公义作王”。
    reason: lexical_alternative
  - marker: c
    text: “首领”也可译作“王公”“统治者”或“官长”。
    reason: lexical_alternative
  - marker: d
    text: 许多基督徒从更广的语境把这位君王理解为弥赛亚，但此处希伯来文只说“一位君王”。
    reason: cross_reference
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引起注意并带有强调意味的感叹语。“看哪”保留先知宣告的庄重语气，在现代中文中也清楚自然。
- source_word: לְצֶדֶק
  choice: 按公义
  rationale: 介词 לְ 在此表示统治所遵循的准则或方式。“按公义”既保留名词“公义”的道德与司法分量，又比单纯译作“公正地”更贴近原文形式。
- source_word: יִמְלָךְ מֶלֶךְ
  choice: 必有一位君王……掌权
  rationale: מֶלֶךְ 无冠词，因此用“一位君王”保留其不定性；未完成式在此表达将来的统治。“掌权”自然呈现君王施行统治的意思。
- source_word: וּלְשָׂרִים
  choice: 众首领
  rationale: שָׂרִים 可指王公、领袖或官长。此处与君王并列，指其下的治理者；“众首领”既不过度限定世袭身份，也保留政治领导层面的含义。
- source_word: לְמִשְׁפָּט
  choice: 秉公
  rationale: 此短语表示治理所依据的公平、正义准则。“秉公”是自然凝练的现代中文，传达 מִשְׁפָּט 的司法与伦理内涵。
- source_word: יָשֹׂרוּ
  choice: 治理
  rationale: 该动词源于 שׂרר，意为行使统治或权柄。“治理”准确适合政治语境，也避免从上下文额外加入“行为正直”的意义。
theological_decisions:
- issue: 是否在正文中明确把这位君王认定为弥赛亚
  choice: 保留“一位君王”的不定表达，不在正文中直接认定为弥赛亚。
  alternative: 译成更具特指意味的“那位君王”，或直接以弥赛亚称谓表述。
  rationale: 基督徒可从更广的语境作弥赛亚式理解，但本节希伯来文本只说无冠词的“一位君王”，并未明说其身份。译文因此保留原文的开放性与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“看哪”保留先知性宣告的力度；“掌权／治理”构成自然平行。“公义／秉公”分别呈现 צֶדֶק 与 מִשְׁפָּט 的相近而不完全重合的含义。所有脚注标记均已置于正文。
