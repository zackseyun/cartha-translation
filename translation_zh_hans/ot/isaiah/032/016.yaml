base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/016.yaml
  text: Then justice will dwell in the wilderness[b][a], and righteousness will abide in the fruitful field.
translation:
  language: zh_hans
  text: '那时，公平必住在旷野，公义必安居[b]在肥沃的田地[a]。


    [a] 或译“迦密”。希伯来语“迦密”既可指肥沃的耕地，在某些语境中也可指迦密地区或迦密山。


    [b] “安居”原文直译为“坐下”，这里表示安顿下来、长久居住。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迦密”。希伯来语“迦密”既可指肥沃的耕地，在某些语境中也可指迦密地区或迦密山。
    reason: lexical_alternative
  - marker: b
    text: “安居”原文直译为“坐下”，这里表示安顿下来、长久居住。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַן
  choice: 那时……必住
  rationale: שׁכן在此可按先知性完成式理解为将来的确定情景；结合上文的发展，连接词וְ自然译作“那时”，而“住”保留定居之意。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר指旷野或荒地；“旷野”既自然，也能与后面的肥沃耕地形成鲜明对照。
- source_word: מִשְׁפָּט
  choice: 公平
  rationale: 这里所指的是公正秩序的确立，并非一次审判行为；“公平”在现代汉语中自然，并与“公义”保持相关而有别的平行关系。
- source_word: וּצְדָקָה
  choice: 公义
  rationale: צְדָקָה与מִשְׁפָּט并列；译作“公义”可保留正直、公正的神学内涵，同时避免将两个词都译成同一概念。
- source_word: בַּכַּרְמֶל
  choice: 在肥田
  rationale: כַּרְמֶל在此最可能是普通名词，指肥沃、可耕种的土地，与“旷野”构成诗意对照；脚注保留专名“迦密”的可能。
- source_word: תֵּשֵׁב
  choice: 必安居
  rationale: ישׁב字面为“坐下”，在此拟人化地表达安顿、长久居住；“安居”比直译“坐下”更符合现代汉语，同时保留稳定居留的意象。
theological_decisions:
- issue: מִשְׁפָּט与צְדָקָה这一对相关概念的区分
  choice: 分别译作“公平”和“公义”
  alternative: 都译作“公正”或“正义”
  rationale: 原文把两个相关但不完全相同的概念并列。分别译出可保留公正秩序与正直、公义之间的诗性和神学张力，不将二者合并。
- issue: בַּכַּרְמֶל是普通名词还是地名
  choice: 正文译作普通名词“肥田”
  alternative: 译作地名“迦密”
  rationale: 本节中“旷野”与肥沃耕地的对照支持普通名词义，但希伯来语本身容许地名理解，故以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“住／安居”形成自然的平行句式，并保留“公平”“公义”的拟人化表达；“必”表达上下文中的确定将来意义。
