base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/018.yaml
  text: And my people will dwell in a peaceful habitation[a], in secure dwellings[b], and in quiet resting places.
translation:
  language: zh_hans
  text: 我的子民必住在平安的居所[a]、安稳的住处和宁静的安歇之地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“平安之居”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“安然的安歇之处”或“安逸的歇息之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב
  choice: 必住
  rationale: ישב在此表示居住、安居；结合预言语境，用“必住”自然表达将来的确定应许。句首连接词不机械译出，以符合现代汉语行文。
- source_word: עַמִּי
  choice: 我的子民
  rationale: עם加第一人称单数词尾是关系性的“我的人民”；“我的子民”在庄重现代汉语中自然，也保留其群体与盟约色彩。
- source_word: בִּנְוֵה שָׁלוֹם
  choice: 在平安的居所
  rationale: נוה在这里指居所、住处；שׁלום涵盖平安、安宁与完好。“平安的居所”既自然，又保留名词修饰关系。
- source_word: וּבְמִשְׁכְּנוֹת מִבְטַחִים
  choice: 住在安稳的住处
  rationale: משכנות是多个住处，并无必要引入“帐幕”的宗教联想；מבטחים强调客观上的安全可靠，因此译作“安稳的”。
- source_word: וּבִמְנוּחֹת שַׁאֲנַנּוֹת
  choice: 也住在宁静安歇之地
  rationale: מנוחות指休息、安歇之处；שאננות表示安然、无扰、从容。合译为“宁静安歇之地”，呈现地点与安宁状态，同时保持与前两项的平行。
theological_decisions:
- issue: 所应许之平安与安稳的实现范围
  choice: 将经文译为上帝子民具体而共同享有的平安、安全和安歇，不限定其实现属于近期历史、末世或预表层面。
  alternative: 明确译成犹大的历史复兴，或明确译成末世弥赛亚和平。
  rationale: 本节本身陈述应许的生活境况，却未单独界定实现的时间和方式；译文因此保留原文的神学张力，不加进特定解释体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“居所—住处—安歇之地”保留希伯来诗句三重平行；适度重复“住在”，使汉语结构清晰。所有脚注标记均已置于正文。
