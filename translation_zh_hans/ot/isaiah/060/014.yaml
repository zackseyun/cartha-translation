id: ISA.60.14
reference: Isaiah 60:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָלְכ֨וּ אֵלַ֤יִ/ךְ שְׁח֨וֹחַ֙ בְּנֵ֣י מְעַנַּ֔יִ/ךְ וְ/הִֽשְׁתַּחֲו֛וּ עַל כַּפּ֥וֹת רַגְלַ֖יִ/ךְ כָּל מְנַֽאֲצָ֑יִ/ךְ וְ/קָ֤רְאוּ לָ/ךְ֙ עִ֣יר יְהוָ֔ה צִיּ֖וֹן קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/014.yaml
  text: The sons of those who afflicted you will come to you bowed down[a], and all who despised you will bow down at the soles of your feet; and they will call you The City of Yahweh[c][b], Zion of the Holy One of Israel.
translation:
  language: zh_hans
  text: 那些曾苦待你的人的儿子，必屈身来到你面前[a]；所有藐视你的人，都必俯伏在你脚掌前[b]。他们必称你为“雅威之城”，为“以色列圣者的锡安”[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些压迫你的人的儿子，必屈身来到你面前。”原文直译为“苦待你的人的儿子”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“俯伏”表示向锡安臣服或致敬，并非把这座城当作神来敬拜。
    reason: cultural_note
  - marker: c
    text: 原文为紧缩的称号结构，可理解为“以色列圣者的锡安”；也可按其字面次序译作“锡安，以色列的圣者”。本译文按上下文将其理解为锡安属于以色列的圣者。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁחֹחַ
  choice: 屈身
  rationale: 表达身体压低、弯身而来的姿态，同时保留屈服与降卑的意味，较“弯腰”更庄重。
- source_word: בְּנֵי מְעַנַּיִךְ
  choice: 那些曾苦待你的人的儿子
  rationale: 保留בְּנֵי明确的阳性“儿子”，并以“苦待”传达ענה在此处使人受苦、压迫的含义。
- source_word: וְהִשְׁתַּחֲווּ
  choice: 俯伏
  rationale: 该动词描写伏地致敬或表示臣服；此处对象是锡安，不宜译成指向神明的“敬拜”。
- source_word: עַל כַּפּוֹת רַגְלַיִךְ
  choice: 在你脚掌前
  rationale: כַּפּוֹת与“脚”连用具体指脚掌；保留原文强烈的降服画面。
- source_word: מְנַאֲצָיִךְ
  choice: 藐视你的人
  rationale: 准确传达נאץ所含轻蔑、鄙弃之意，且符合现代汉语表达。
- source_word: עִיר יְהוָה
  choice: 雅威之城
  rationale: 直接音译圣名יְהוָה，并用“之城”自然表达归属关系及称号性质。
- source_word: צִיּוֹן קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列圣者的锡安
  rationale: 按压缩的希伯来语属格关系理解，表明锡安属于“以色列的圣者”，避免误读为锡安本身就是圣者。
- source_word: וְקָרְאוּ לָךְ
  choice: 他们必称你为
  rationale: 自然表达以特定称号称呼或命名的含义。
theological_decisions:
- issue: 向锡安俯伏的性质
  choice: 译作“俯伏”，表示臣服或致敬
  alternative: 译作“敬拜”
  rationale: השתחוה虽可在特定语境中指敬拜，但此处受礼者是复兴后的锡安；“俯伏”保留动作及臣服含义，而不暗示把城市当作神敬拜。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译呈现该立约之名，不以称号替代。
- issue: צִיּוֹן קְדוֹשׁ יִשְׂרָאֵל的句法关系
  choice: 理解为“以色列圣者的锡安”
  alternative: “锡安，以色列的圣者”
  rationale: 将其处理为归属称号，既符合上下文中对城市的命名，也避免把锡安与“以色列的圣者”等同；脚注说明原文的紧缩结构。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。以“屈身来到”与“俯伏在脚掌前”保留两种相关但不完全相同的身体姿态；称号加引号以帮助普通读者辨认命名结构。
