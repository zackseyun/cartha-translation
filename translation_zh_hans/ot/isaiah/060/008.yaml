  yaml_path: translation/ot/isaiah/060/008.yaml
  text: Who are these that fly like a cloud[a], and like doves to their windows?
translation:
  language: zh_hans
  text: 这些是谁，像云一样飞翔，又像鸽子飞向它们的窗户[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“它们的鸽舍入口”，即鸽舍的开口或窗洞。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֵלֶּה
  choice: 这些是谁
  rationale: 疑问代词与复数指示词构成惊叹性的问句；按现代汉语补出系词“是”，并保留“这些”的指示意味。
- source_word: כָּעָב
  choice: 如云
  rationale: 比较介词加单数名词“云”；保留单数集合意象，描绘成群而来的景象。
- source_word: תְּעוּפֶינָה
  choice: 飞来
  rationale: 该动词为阴性复数未完成式，基本义是“飞”；结合本章远方众人归来的方向性语境，用“飞来”表达鲜明的进行景象。
- source_word: וְכַיּוֹנִים
  choice: 又如鸽子
  rationale: 保留与前一短语平行的明喻；“又”自然连接两幅相继的图景。
- source_word: אֶל אֲרֻבֹּתֵיהֶם
  choice: 飞回自己的窗户
  rationale: אֶל表示趋向；אֲרֻבּוֹת基本义为窗户或开口。鸽子归巢的语境使“飞回”自然，“自己的”对应第三人称复数所属关系；具体指鸽舍入口的可能性置于脚注。
