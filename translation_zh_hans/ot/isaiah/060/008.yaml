  source_fidelity: 草稿准确保留了惊叹性问句、云与鸽子的双重比喻，以及“窗户／开口”的主要词义。但“飞回”加入了原文未明说的“返回”动作；希伯来文只说飞向其窗户（或开口）。第一处“飞来”虽可从本章语境理解，却也比原文动词本身更具体。
  naturalness: “这些是谁？他们……”可懂，但将原文的一个连贯问句拆开，且“他们”使指示对象略显平直。改为单一问句并以“像云一样飞翔”保持简洁自然的先知性语气。
  terminology: “窗户”可作为אֲרֻבּוֹת的直接译法。脚注保留“鸽舍入口”的语境性可能；将“自己的”改为“它们的”，可清楚表明所属者是鸽子，而非问句中的“这些”。
