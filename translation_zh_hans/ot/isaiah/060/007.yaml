id: ISA.60.7
reference: Isaiah 60:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל צֹ֤אן קֵדָר֙ יִקָּ֣בְצוּ לָ֔/ךְ אֵילֵ֥י נְבָי֖וֹת יְשָׁרְת֑וּ/נֶךְ יַעֲל֤וּ עַל רָצוֹן֙ מִזְבְּחִ֔/י וּ/בֵ֥ית תִּפְאַרְתִּ֖/י אֲפָאֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/007.yaml
  text: All the flocks of Kedar will be gathered to you[a]; the rams of Nebaioth will minister to you. They will go up with acceptance on my altar[b], and I will beautify my glorious house.
translation:
  language: zh_hans
  text: 基达的一切羊群都要聚集到你这里；尼拜约的公羊要服侍你。它们必蒙悦纳，献在我的祭坛上[a]；我必使我荣耀的殿得荣耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“它们必蒙悦纳，上到我的祭坛”；“上去”在这里带有献上祭物的意思。
    reason: 保留原文“上升”意象及“蒙悦纳”的复合表达。
  - marker: b
    text: “我荣耀的殿”直译为“我荣耀／荣美的房屋”，这里指圣殿；“荣耀”和“得荣耀”在希伯来文中出自同一词根。
    reason: 说明圣殿所指，并呈现原文在名词与动词之间的同根词呼应。
lexical_decisions:
- source_word: צֹאן
  choice: 羊群
  rationale: 该词是集合名词，泛指以绵羊、山羊为主的小型牲畜；“羊群”既保留集合意义，也适合本节进献牲畜的语境。
- source_word: קֵדָר
  choice: 基达
  rationale: 阿拉伯族群或地区的专名，采用现代中文圣经读者熟悉的音译。
- source_word: יִקָּבְצוּ לָךְ
  choice: 都要聚集到你这里
  rationale: Nifal未完成式可表达被动或自发聚集；中文如此表达自然，也保留朝向受话者锡安而来的意思，不强行限定施动者。
- source_word: אֵילֵי נְבָיוֹת
  choice: 尼拜约的公绵羊
  rationale: 祭坛和羊群的上下文明确支持אֵילִים的动物义“公绵羊”，而非比喻义“首领”；尼拜约为专名。
- source_word: יְשָׁרְתוּנֶךְ
  choice: 要服侍你
  rationale: שרת表示服侍，也可带礼仪性服务色彩；“服侍你”保留牲畜作为奉献而供锡安使用的拟人化表达。
- source_word: יַעֲלוּ עַל רָצוֹן מִזְבְּחִי
  choice: 它们必蒙悦纳，献在我的祭坛上
  rationale: 原文结合“上去”和“蒙悦纳”的观念，祭祀语境表明牲畜被献到祭坛上；正文采用自然中文表达，脚注保留其字面上升意象。
- source_word: בֵית תִּפְאַרְתִּי
  choice: 我荣美的殿
  rationale: 字面为“我荣美／荣耀的房屋”。祭坛语境指向圣殿；“荣美”兼顾华美与荣耀的语义。
- source_word: אֲפָאֵר
  choice: 使……更显荣美
  rationale: Piel词形可表示使美丽、增添荣饰或使得荣耀；此译既自然，又与前面的תִּפְאַרְתִּי形成同根词呼应。
theological_decisions:
- issue: 第二人称阴性单数后缀“你”的所指
  choice: 正文保留对“你”的直接称呼，由上下文指向拟人化的锡安／耶路撒冷
  alternative: 直接译成“锡安”或广义解释为“上帝的子民”
  rationale: 以赛亚书60章的直接语境把锡安／耶路撒冷拟人化为女性；保留“你”既忠于语法，也不把更广泛的神学应用写入正文。
- issue: 牲畜登上祭坛的祭祀含义
  choice: 译作蒙悦纳并献在祭坛上
  alternative: 仅理解为一般性的贡物与服务，或逐字译作“登上祭坛”
  rationale: 羊群、公绵羊、祭坛和悦纳共同构成明确的献祭图景；正文表达这一语境含义，同时以脚注保留希伯来文“上去”的具体意象。
- issue: “我荣美的殿”的具体所指
  choice: 在祭坛语境中译为圣殿意义的“殿”
  alternative: 较为宽泛地译作“我荣耀的居所／房屋”
  rationale: 本节的“祭坛”使圣殿所指十分明确；“殿”无需额外加入超出原文的宗派性解释。
translation_notes:
  register: 采用庄重、流畅的现代标准普通话。“基达”“尼拜约”使用通行音译；以分号呈现两组平行句。“更显荣美”避免生硬重复，同时保留希伯来文词根呼应。
