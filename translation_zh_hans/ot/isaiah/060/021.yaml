source:
  edition: WLC
  text: וְ/עַמֵּ/ךְ֙ כֻּלָּ֣/ם צַדִּיקִ֔ים לְ/עוֹלָ֖ם יִ֣ירְשׁוּ אָ֑רֶץ נֵ֧צֶר מטע/ו מַעֲשֵׂ֥ה יָדַ֖/י לְ/הִתְפָּאֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/021.yaml
  text: And all your people will be righteous[a]; forever they will possess the land, the shoot of my planting, the work of my hands[c][b], that I may be glorified.
translation:
  language: zh_hans
  text: 你的子民全都必是义人；他们必永远拥有这地[a][b]，是我所栽种的嫩芽，是我手所做的，为要彰显我的荣耀[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“承受这地为业”。希伯来语动词可表示“承受产业”，也可表示“取得、拥有”。
    reason: lexical_alternative
  - marker: b
    text: “这地”也可译作“大地”。希伯来语אֶרֶץ可指“地”或“大地”；在复兴的上下文中，“这地”更为直接。
    reason: lexical_alternative
  - marker: c
    text: 马所拉读法（qere）为“我所栽种的”；辅音写法（ketiv）可读作“他所栽种的”。正文依马所拉读法译出；下一短语为“我手所做的”。
    reason: textual_variant
lexical_decisions:
- source_word: וְעַמֵּךְ כֻּלָּם
  choice: 你的人民全都是
  rationale: עַמֵּךְ以阴性单数第二人称指向锡安或耶路撒冷；כֻּלָּם表示整体范围。中文用“全都是”自然地保留“他们全体”的强调。句首וְ在本节中文语境中不必机械译为“而且”。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 该词既涉及行为正直，也带有在正当关系或约中被视为正直的分量。“义人”是庄重、通行且保留神学张力的译法。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 表达持续而不终止的状态，符合本段复兴应许的语境。
- source_word: יִירְשׁוּ
  choice: 拥有
  rationale: ירשׁ可指承受产业或取得并持有。此处“拥有”突出安稳、长久的占有；“承受”作为可能译法保留在脚注中。
- source_word: אָרֶץ
  choice: 这地
  rationale: 在锡安复兴的上下文中，特定的“土地”比泛指“全地”更直接；但אֶרֶץ本身也可指“大地”，故以脚注保留。
- source_word: נֵצֶר
  choice: 嫩芽
  rationale: 指植物新生的芽或枝条。“嫩芽”具体自然，并与“栽种”的意象协调。
- source_word: מטעו
  choice: 他所栽种的
  rationale: 所给马所拉文本形态带第三人称阳性单数后缀，直译为“他的栽种”或“他所栽种的”。中文采用后者，使修饰“嫩芽”的关系清楚，同时不把人称改成第一人称。
- source_word: מַעֲשֵׂה יָדַי
  choice: 我双手的作品
  rationale: 保留“手”的具体创造、塑造意象；“作品”在现代中文中庄重且易懂。
- source_word: לְהִתְפָּאֵר
  choice: 使我得荣耀
  rationale: 该反身词形在这里表达神借自己的作为显出荣耀的目的或结果。“使我得荣耀”自然地保留这一目的含义，而不强行扩展为某种特定教义解释。
theological_decisions:
- issue: “他所栽种的嫩芽”与“我双手的作品”之间的人称转换
  choice: 正文保留所给马所拉文本中的第三人称转第一人称：“他所栽种的……我双手的……”
  alternative: 协调为第一人称：“我所栽种的嫩芽，我双手的作品”
  rationale: 所提供的希伯来文本在מטעו上显示第三人称阳性单数后缀，随后ידי则为第一人称单数。译文不擅自校改或消除这一转换，并用脚注说明常见的协调读法。
- issue: לְהִתְפָּאֵר所表达的荣耀
  choice: 使我得荣耀
  alternative: 为彰显我的荣美；使我彰显自己的荣耀
  rationale: 所选译法保留目的或结果关系及神是得荣耀者这一点，同时避免将反身形式解释得过度具体。
translation_notes:
  register: 采用现代标准普通话，语气庄重而清楚。以分号和句号梳理诗句层次，并用“他们是……”明确后半句与“你的人民”的同位关系。保留植物、双手和荣耀的具体意象，也保留原文中不寻常的人称转换。
