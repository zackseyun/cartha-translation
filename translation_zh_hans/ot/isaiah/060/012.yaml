base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/012.yaml
  text: For the nation and the kingdom that will not serve you will perish[b][a], and those nations will be utterly laid waste.
translation:
  language: zh_hans
  text: 因为不服事你的国家和王国必灭亡；列国[a]必全然荒凉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文先用单数“国家和王国”，后转为复数“列国”，形成修辞上的变化。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在这里把同一词根的不定式绝对式与限定动词连用，以加强语气；也可译作“必荒凉无遗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为此前的应许与审判说明理由；“因为”保留了原文的连接和解释作用。
- source_word: הַגּוֹי וְהַמַּמְלָכָה
  choice: 那……国家和王国
  rationale: 分别保留 גּוֹי 的“国家”和 מַמְלָכָה 的“王国”，也保留原文第一分句的单数表达。
- source_word: אֲשֶׁר לֹא יַעַבְדוּךְ
  choice: 不服事你的
  rationale: עבד 在此意为“服事、效力”；“服事”准确而庄重，并保留阴性单数第二人称“你”的直接称呼，不擅自解释其所指。
- source_word: יֹאבֵדוּ
  choice: 必灭亡
  rationale: אבד 表示灭亡、败亡；“必灭亡”既自然，也符合先知性宣告的语气。
- source_word: וְהַגּוֹיִם
  choice: 列国
  rationale: “列国”简洁地表达复数 הַגּוֹיִם，并显出原文由单数转为复数的修辞变化。
- source_word: חָרֹב יֶחֱרָבוּ
  choice: 必彻底荒废
  rationale: 同根不定式绝对形与限定动词连用，起强调作用；“彻底”传达其强意，“荒废”对应 חרב 所表达的荒凉、毁坏。
theological_decisions:
- issue: “服事你”中阴性单数第二人称所指
  choice: 保留为“你”，不作解释性扩写
  alternative: 译成“服事锡安”“服事耶路撒冷”或“服事由圣城所代表的上帝子民”
  rationale: 上下文以阴性单数称呼锡安／耶路撒冷；正文保留直接称呼，可避免把先知意象化约为单一神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“服事”保留经文语域但不作宗派化解释；分号呈现两分句的平行与递进。
