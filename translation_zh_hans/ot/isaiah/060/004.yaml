  text: שְׂאִֽי סָבִ֤יב עֵינַ֨יִ/ךְ֙ וּ/רְאִ֔י כֻּלָּ֖/ם נִקְבְּצ֣וּ בָֽאוּ לָ֑/ךְ בָּנַ֨יִ/ךְ֙ מֵ/רָח֣וֹק יָבֹ֔אוּ וּ/בְנֹתַ֖יִ/ךְ עַל צַ֥ד תֵּאָמַֽנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/004.yaml
  text: Lift up your eyes all around and see[a]; all of them gather together; they come to you. Your sons will come from far away[b], and your daughters will be carried on the hip.
translation:
  language: zh_hans
  text: 你举目环顾，看吧：他们全都聚集，到你这里来。你的儿子要从远方而来；你的女儿要被抱在身侧[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在身侧”或译“在一旁”；希伯来语短语指被带在身体的一侧，通常可理解为靠近腰胯处。
    reason: lexical_alternative
  - marker: b
    text: “被抱”或译“被哺育”或“受照料”；原文动词可含养育、照料的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאִי סָבִיב עֵינַיִךְ וּרְאִי
  choice: 你举目四望，看哪
  rationale: 两个阴性单数命令式是对拟人化的锡安说的。“举目四望”自然传达“向四周抬起眼睛”的意思；“看哪”保留第二个命令式的直接性和强调作用。
- source_word: כֻּלָּם נִקְבְּצוּ בָאוּ לָךְ
  choice: 众人都聚集起来，来到你这里
  rationale: 保留כֻּלָּם的总体强调，并以生动的现在景象表达两个完成式所呈现的先知性画面。
- source_word: בָּנַיִךְ מֵרָחוֹק יָבֹאוּ
  choice: 你的儿子们要从远方而来
  rationale: בָּנַיִךְ明确指“儿子们”，与下句“女儿们”构成对应；未完成式在此表达预期中的归来。
- source_word: וּבְנֹתַיִךְ עַל צַד תֵּאָמַנָה
  choice: 你的女儿们要被抱在腰间
  rationale: עַל צַד描绘孩子被带在身侧、通常靠着腰胯的具体形象；תֵּאָמַנָה在此可表达被托抱、扶持或照料。“被抱在腰间”在现代汉语中自然，也与上下文的归回场景相合，同时用脚注保留词义幅度。
theological_decisions:
- issue: 复兴图景中的性别用语
  choice: 保留“儿子们”和“女儿们”
  alternative: 统译为“儿女”或“孩子们”
  rationale: 希伯来文有意使用男性与女性相对应的称呼，描绘锡安的后代全都归回；不宜将这一平行结构中性化。
- issue: 先知话语中的动词时体
  choice: 前半句用生动的当前景象，后半句用“要”表达将来的应许
  alternative: 全部译为过去时或全部译为将来时
  rationale: 前两个完成式把聚集与来到呈现为眼前可见的确定景象，后两个未完成式则自然指向即将实现的归回；如此保留原文时体形成的张力。
- issue: תֵּאָמַנָה所表达的照料形象
  choice: 正文译作“要被抱”
  alternative: “要被乳养”或“要受扶持”
  rationale: 该动词容许被照料、扶持或乳养的意味；结合עַל צַד所指的身体位置，“被抱”最能形成清楚具体的图景，但不以正文排除其他词义可能。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“举目四望”保持诗性但属于常用表达；“聚集起来，来到你这里”读来流畅，并保留原文的并列推进。正文中的两个脚注标记紧接争议短语，避免沿用英文咨询层中标记位置与脚注内容不相对应的问题。
