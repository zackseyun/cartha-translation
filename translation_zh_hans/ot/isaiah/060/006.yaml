  rationale: 修订恢复前半“众多骆驼”与“米甸和以法的幼骆驼”的说明关系，并在后半明确示巴来者为携带黄金、乳香和宣扬赞美的主体，消除“全都从示巴而来”可能误修饰米甸和以法的歧义。神名依英文审校轨迹统一为“雅威”；赞美短语改为不增添“当受”或“作为”等解释的表述。
