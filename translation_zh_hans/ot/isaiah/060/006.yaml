    rationale: 原文在“米甸和以法”后转写“都从示巴而来”的来者，随后他们带黄金和乳香并宣扬赞美。中文应明示示巴来者，以避免不合地理与句法脉络的指代。
  - severity: medium
    issue: 正文“耶和华”未与英文审校轨迹中YHWH→Yahweh的决定一致。
    rationale: 英文审校资料明确将四字神名译作Yahweh；中文应采用相应音译“雅威”，并可在脚注说明原文形式。
