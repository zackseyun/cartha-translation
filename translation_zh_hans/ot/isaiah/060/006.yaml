  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִֽׁפְעַ֨ת גְּמַלִּ֜ים תְּכַסֵּ֗/ךְ בִּכְרֵ֤י מִדְיָן֙ וְ/עֵיפָ֔ה כֻּלָּ֖/ם מִ/שְּׁבָ֣א יָבֹ֑אוּ זָהָ֤ב וּ/לְבוֹנָה֙ יִשָּׂ֔אוּ וּ/תְהִלֹּ֥ת יְהוָ֖ה יְבַשֵּֽׂרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/006.yaml
  text: A multitude of camels will cover you[a], the young camels of Midian and Ephah; all of them will come from Sheba. They will carry gold and frankincense[b], and they will proclaim the praises of Yahweh.
translation:
  language: zh_hans
  text: 成群的骆驼必遮盖你；米甸和以法的幼骆驼也在其中。示巴的人都必来到，带着黄金和乳香，并要宣扬雅威[a]的赞美。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”对应希伯来文神名 יהוה（YHWH）。
    reason: 说明四字神名的原文形式及正文音译。
  - marker: b
    text: “宣扬”所译的动词也含有“报传好消息”的意思；也可译为“并要报传雅威的赞美”。
    reason: 保留 יְבַשֵּׂרוּ 的报好消息语义，同时不限定“雅威的赞美”的属格关系。
lexical_decisions:
- source_word: שִׁפְעַת גְּמַלִּים
  choice: 成群的骆驼
  rationale: שִׁפְעַת 表示丰盛、众多；“成群”自然表达大量骆驼涌来的景象，又不把意象过度具体化为“洪流”。
- source_word: תְּכַסֵּךְ
  choice: 要遮满你
  rationale: 保留 כסה 的“遮盖”意象，并以“满”传达数量之多；“你”是阴性单数，指向锡安或耶路撒冷。
- source_word: בִּכְרֵי
  choice: 幼骆驼
  rationale: 该词指年轻的骆驼；此译比采用较生僻或可能过度限定品种的术语更清楚。
- source_word: מִדְיָן וְעֵיפָה
  choice: 米甸和以法
  rationale: 按现代中文圣经常见音译处理人名或地名。
- source_word: כֻּלָּם מִשְּׁבָא יָבֹאוּ
  choice: 它们全都从示巴而来
  rationale: 保留 כֻּלָּם 的整体强调和 מִן 所表示的来源。
- source_word: זָהָב וּלְבוֹנָה
  choice: 黄金和乳香
  rationale: לְבוֹנָה 特指乳香，并非泛指香料；“黄金”符合庄重的现代中文表达。
- source_word: יִשָּׂאוּ
  choice: 载着
  rationale: 该动词有携带、负载之义；以骆驼为当前语境中的承载者时，“载着”自然且贴切。
- source_word: וּתְהִלֹּת יְהוָה
  choice: 耶和华当受的赞美
  rationale: 保留 תְהִלֹּת 的复数集合意义，同时在中文中自然表达这些赞美归于耶和华；原文也可能指耶和华可称颂的作为，故加注说明。
- source_word: יְבַשֵּׂרוּ
  choice: 传扬
  rationale: 该词可表示报信、宣告好消息；“传扬”适合与“赞美”搭配，同时不把“好消息”的语义成分完全明说。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉的神名音译，对应希伯来文四字神名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文正文采用广为人知、具有长期圣经使用传统的“耶和华”；脚注交代原文为四字神名，也有“雅威”的音译。
- issue: וּתְהִלֹּת יְהוָה יְבַשֵּׂרוּ 的语义关系
  choice: 传扬耶和华当受的赞美
  alternative: 宣告耶和华可称颂的作为／把赞美归给耶和华
  rationale: 希伯来语短语较为紧凑，可指对耶和华的赞美，也可侧重他可称颂的作为；正文保持赞美归属，脚注保留另一理解及 יְבַשֵּׂרוּ 的报好消息色彩。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“遮满你”保留先知诗歌的鲜明意象；“成群”“载着”“传扬”便于普通读者理解。分号划分骆驼来源、所载礼物和宣告行动三个层次。
