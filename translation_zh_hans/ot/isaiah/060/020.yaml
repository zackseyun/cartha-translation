id: ISA.60.20
reference: Isaiah 60:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹא יָב֥וֹא עוֹד֙ שִׁמְשֵׁ֔/ךְ וִ/ירֵחֵ֖/ךְ לֹ֣א יֵאָסֵ֑ף כִּ֣י יְהוָ֗ה יִֽהְיֶה לָּ/ךְ֙ לְ/א֣וֹר עוֹלָ֔ם וְ/שָׁלְמ֖וּ יְמֵ֥י אֶבְלֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/020.yaml
  text: Your sun will no longer go down[a], and your moon will not withdraw; for Yahweh will be your everlasting light[b], and the days of your mourning will be ended.
translation:
  language: zh_hans
  text: 你的太阳不再落下[a]，你的月亮也不再隐没[b]；因为雅威必作你永远的光，你哀恸的日子必告终。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “落下”：希伯来文直译为“不再来到”；以太阳为主语时，这里指太阳落下，也可译作“不再落山”。
    reason: lexical_alternative
  - marker: b
    text: “隐没”：希伯来文直译为“被收聚”或“被收走”，意指月亮不再从天际退去或停止照耀。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָבוֹא עוֹד שִׁמְשֵׁךְ
  choice: 你的太阳不再落下
  rationale: יָבוֹא 字面为“来到”，但以太阳为主语时，这里按上下文表达太阳落下。“落下”保留原有图像，也符合现代汉语表达。
- source_word: וִירֵחֵךְ לֹא יֵאָסֵף
  choice: 你的月亮也不再隐没
  rationale: יֵאָסֵף 是 אסף 的被动式，字面可指“被收聚、被收走”。在与太阳不再落下的平行句中，“隐没”自然表达月亮不再从天际消失，同时脚注保留其字面图像。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述应许的原因，现代汉语用“因为”清楚自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行学术拟音处理为专名“雅威”，不以称号替代。
- source_word: יִהְיֶה לָךְ לְאוֹר עוֹלָם
  choice: 必作你永远的光
  rationale: 以自然凝练的汉语表达“必为你成为永远的光”，保留谓语关系及 עוֹלָם 所表达的恒久性。
- source_word: וְשָׁלְמוּ יְמֵי אֶבְלֵךְ
  choice: 你哀恸的日子必告终
  rationale: שָׁלְמוּ 表示完成、结束；“必告终”准确表达哀恸时期彻底结束。אֵבֶל 译作“哀恸”，保留举哀和深切悲伤的语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”保留专名性质，并与较公认的拟音相符；不以“主”这一称号替代。
- issue: 太阳和月亮的末世性图像
  choice: 保留太阳不落、月亮不隐没以及雅威作永远之光的宇宙性图像
  alternative: 将其释义为安慰、兴盛或安全的纯比喻
  rationale: 原文让受造之光与雅威亲自成为永远之光并置。正文不限定这是纯字面还是纯比喻，以保留预言图像及其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“太阳”“月亮”保留直接的宇宙图像；“必作”“哀恸”“告终”维持先知文本的庄严语气，又避免生硬古奥。脚注标记均置于所说明的词语之后。
