base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/002.yaml
  text: For look, darkness will cover the earth, and thick darkness the peoples; but the LORD will rise upon you, and his glory will appear over you.
translation:
  language: zh_hans
  text: 看哪，黑暗必遮盖大地，幽暗必笼罩万民；耶和华却要在你之上升起，他的荣耀必在你之上显现。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知话语中引人注意、加强现场感的提示语，语体庄重而为现代读者所懂。
- source_word: הַחֹשֶׁךְ
  choice: 黑暗
  rationale: 直接对应普通名词“黑暗”，并保留其在上下文中可能兼具现实与象征意义的张力。
- source_word: עֲרָפֶל
  choice: 幽暗
  rationale: 该词指浓密、深沉的黑暗；“幽暗”与前句“黑暗”形成递进，又不额外加入雾气等原文未必强调的意象。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 此处不带定冠词，可指地或大地；与后面的“万民”平行时，“大地”最自然。
- source_word: לְאֻמִּים
  choice: 万民
  rationale: 表达复数“各民族、众民”，用“万民”保持诗体凝练，不把范围限定为某几个国家。
- source_word: יִזְרַח
  choice: 升起
  rationale: 该动词常用于日光升起、照耀；“在你上面升起”保留光明降临的意象，并与介词עַל相配。
- source_word: יֵרָאֶה
  choice: 显现
  rationale: 尼法勒形式表示“被看见、显现”；“显现”既自然，也避免改写成纯主动的“照耀”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应四字神名；不以普通称号取代，也不据此引入额外教义解释。
- issue: 第二人称阴性单数所指
  choice: 保留为“你”
  alternative: 明说“锡安”或“耶路撒冷”
  rationale: 原文以阴性单数后缀称呼上下文中的对象，本节本身没有重述其名称；保留“你”可维持原文的直接称呼及上下文依赖。
- issue: 荣耀显现的位置关系
  choice: “在你上面显现”
  alternative: “向你显现”
  rationale: 两处分句都使用עַל，重点是耶和华及其荣耀临到并显于“你”之上；不改成主要表示对象关系的“向你”。
translation_notes:
  register: 采用庄重而自然的现代标准普通话，保留希伯来诗歌的两组平行对照：黑暗／幽暗，大地／万民，以及耶和华升起／荣耀显现。句式凝练，不补入原文未明说的解释。
