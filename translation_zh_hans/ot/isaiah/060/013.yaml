  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כְּב֤וֹד הַ/לְּבָנוֹן֙ אֵלַ֣יִ/ךְ יָב֔וֹא בְּר֛וֹשׁ תִּדְהָ֥ר וּ/תְאַשּׁ֖וּר יַחְדָּ֑ו לְ/פָאֵר֙ מְק֣וֹם מִקְדָּשִׁ֔/י וּ/מְק֥וֹם רַגְלַ֖/י אֲכַבֵּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/013.yaml
  text: The glory of Lebanon will come to you—cypress[a], plane tree, and pine together—to beautify the place of my sanctuary[b], and I will honor the place of my feet.
translation:
  language: zh_hans
  text: 黎巴嫩的荣耀必来到你这里——柏树、悬铃木和松树一同前来[a]——为要使我圣所所在之地荣美；我必使我脚所在之处[b]得荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文列出三种树木。它们的确切树种不能完全确定；第二种也有译作“榆树”的，第三种也有译作“黄杨”的。
    reason: lexical_alternative
  - marker: b
    text: 或译“我的脚凳”。希伯来文更直译为“我脚所在之处”。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד
  choice: 荣耀
  rationale: 保留“荣耀、华美、尊荣”的语义幅度；在本节中也可使人联想到黎巴嫩著名林木所体现的壮美与财富。
- source_word: הַלְּבָנוֹן
  choice: 黎巴嫩
  rationale: 采用现代汉语通行地名。
- source_word: אֵלַיִךְ
  choice: 来到你这里
  rationale: 原文为阴性单数第二人称，语境所指是锡安或耶路撒冷；正文不补出名称，以保留原文的话语衔接。
- source_word: יָבוֹא
  choice: 必来到
  rationale: 按Qal未完成式直译为主动的“来到”；不改译成语境上可能成立但形态上较间接的“被运来”。
- source_word: בְּרוֹשׁ
  choice: 柏树
  rationale: 树种不能完全确定；“柏树”是圣殿与贵重木材语境中通行且易懂的对应词。
- source_word: תִּדְהָר
  choice: 悬铃木
  rationale: 确切树种有争议；“悬铃木”对应常见的 plane tree 解释，同时以脚注说明其他可能。
- source_word: תְאַשּׁוּר
  choice: 松树
  rationale: 确切树种有争议；“松树”能自然表达与其他名贵林木并列的树木，脚注保留黄杨等替代辨识。
- source_word: יַחְדָּו
  choice: 一同前来
  rationale: 明确表达三种树木共同来到的集合意义，并使中文句法完整。
- source_word: לְפָאֵר
  choice: 使……荣美
  rationale: Piel不定式在此表示使某处华美、壮丽；“荣美”兼顾美化与赋予荣光的色彩。
- source_word: מְקוֹם מִקְדָּשִׁי
  choice: 我圣所所在之地
  rationale: 保留“地方”与“圣所”的结构关系，同时采用自然、庄重的现代汉语。
- source_word: וּמְקוֹם רַגְלַי
  choice: 我脚所在之处
  rationale: 贴近原文“我双脚的地方”的拟人化意象，不直接以解释性的“脚凳”替代。
- source_word: אֲכַבֵּד
  choice: 我必使……得荣耀
  rationale: כבד的Piel在此有“使之尊荣、使之荣耀”的意义；如此也与前句“使……荣美”形成对应。
theological_decisions:
- issue: 上帝与圣所关系的拟人化表达
  choice: 正文保留“我脚所在之处”
  alternative: 我的脚凳
  rationale: 原文没有使用通常表示“脚凳”的名词，而是直说“我脚所在之处”。保留这一形象，既维持诗意，也不把相关经文中的解释预先写入正文。
- issue: 阴性单数“你”的所指
  choice: 正文只译“你”，不补明名称
  alternative: 锡安；耶路撒冷
  rationale: 上下文表明受话者是锡安或耶路撒冷，但本节没有明说；不补出名称可避免消除原文的语篇含蓄。
- issue: “黎巴嫩的荣耀”的具体含义
  choice: 保留“荣耀”这一宽广表达
  alternative: 黎巴嫩华美的林木；黎巴嫩的财富
  rationale: 上下文指向黎巴嫩的名贵树木，但כְּבוֹד本身仍有荣耀、华美和贵重之意；正文不把这一多义表达缩窄为单一解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。破折号标明三种树木是“黎巴嫩的荣耀”的具体展开；正文保留原文的拟人化表达和树种辨识上的不确定性，并通过脚注交代主要异译。
