base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/005.yaml
  text: Then you will see and be radiant[a], and your heart will tremble and swell, because the abundance of the sea will be turned to you[b]; the wealth of the nations will come to you.
translation:
  language: zh_hans
  text: 那时，你必看见，并且容光焕发；你的心必颤动，也必舒展开来。因为海上的丰盛必转归于你[a]，列国的财富必来到你这里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海上的丰盛”也可译作“海上的财富”，可能特指经由海路带到锡安的丰富财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְאִי
  choice: 你必看见
  rationale: 这是 ראה 的第二人称阴性单数未完成式，以预言性的将来语气对锡安／耶路撒冷说话；“看见”直接而自然。
- source_word: וְנָהַרְתְּ
  choice: 并且容光焕发
  rationale: 此处 נהר 最可能表示因所见之事而发光、明亮；“容光焕发”既保留光彩意象，也自然表达喜悦的外在反应。
- source_word: וּפָחַד
  choice: 必颤动
  rationale: 该动词以“你的心”为主语，描写强烈的身体与情感反应。“颤动”不把它限定为负面的恐惧，保留惊喜与敬畏交织的张力。
- source_word: וְרָחַב לְבָבֵךְ
  choice: 你的心……必舒展开来
  rationale: 直译为“你的心必宽阔”。“舒展开来”保留心被扩展的希伯来意象，同时比“变宽”更符合现代汉语。
- source_word: יֵהָפֵךְ עָלַיִךְ
  choice: 必转归于你
  rationale: 保留 Niphal 的被动／转移意味，并明确表达海上资源转向锡安、归给她的图景。
- source_word: הֲמוֹן יָם
  choice: 海上的丰盛
  rationale: הֲמוֹן 可指众多、丰盛或喧腾；结合下句“列国的财富”，这里很可能涉及海运带来的丰富资源。“海上的丰盛”保留原词较宽的含义。
- source_word: חֵיל גּוֹיִם
  choice: 列国的财富
  rationale: חֵיל 可表示力量、军队或财力；在各地资源涌向锡安的上下文中，“财富”最符合平行结构。
- source_word: יָבֹאוּ לָךְ
  choice: 必来到你这里
  rationale: 按普通移动义翻译，清楚呈现列国财富来到锡安的预言图景。
theological_decisions:
- issue: 锡安回应时的情感性质
  choice: 保留喜悦、震撼与敬畏交织的反应
  alternative: 仅译为恐惧，或仅译为喜乐
  rationale: “看见”“容光焕发”“心颤动”“心舒展开来”共同描写因上帝所赐复兴而产生的复杂反应；译文不将这种张力化约为单一情绪。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“你”承接希伯来文阴性单数，指向锡安／耶路撒冷；“容光焕发”和“舒展开来”使原文意象在现代汉语中自然可懂，同时避免过度解释。
