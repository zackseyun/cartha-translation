revisions:
- from: 海岛[a]必等候我；他施的船只在前头，要把你的儿子从远方带来，他们的金银也随他们一同带来。这一切都是为了耶和华你上帝的名，为了以色列的圣者，因为他使你得了荣耀[b]。
  to: 海岛[a]必等候我；他施的船只在前头，要把你的儿子从远方带来，带着他们自己的金银一同前来，为了耶和华你上帝的名，为了以色列的圣者；因为他使你得荣耀[b]。
  rationale: 删除原文未明说的“这一切都是”，使两个“为了”短语直接表达归回行动的目的；并调整金银短语，使中文更顺畅而仍保留“他们自己的”及“同来”的语义。其余用语、专名和脚注锚点均可保留。
