id: ISA.60.9
reference: Isaiah 60:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי לִ֣/י אִיִּ֣ים יְקַוּ֗וּ וָ/אֳנִיּ֤וֹת תַּרְשִׁישׁ֙ בָּ/רִ֣אשֹׁנָ֔ה לְ/הָבִ֤יא בָנַ֨יִ/ךְ֙ מֵֽ/רָח֔וֹק כַּסְפָּ֥/ם וּ/זְהָבָ֖/ם אִתָּ֑/ם לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהַ֔יִ/ךְ וְ/לִ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל כִּ֥י פֵאֲרָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/009.yaml
  text: Surely the coastlands wait for me[a], and the ships of Tarshish first, to bring your sons from far away, with their silver and their gold with them, for the name of Yahweh your God, and for the Holy One of Israel[b], because he has glorified you.
translation:
  language: zh_hans
  text: 海岛[a]必等候我；他施的船只在前头，要把你的儿子从远方带来，带着他们自己的金银一同前来，为了耶和华你上帝的名，为了以色列的圣者；因为他使你得荣耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海岛”也可译作“众岛屿”“沿海地区”或“远方海岸”；这个希伯来词常泛指海上的或沿海的远方地区。
    reason: lexical_alternative
  - marker: b
    text: “使你得荣耀”也可译作“使你美丽”或“使你尊贵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 必
  rationale: 此处连接上文，并带有肯定和保证的语气；汉语用“必”自然表达确定性，避免生硬直译为“因为”。
- source_word: לִי אִיִּים יְקַוּוּ
  choice: 海岛必等候我
  rationale: לִי 是等候、盼望的对象；אִיִּים 在以赛亚书中可泛指海岛、沿海地区或远方海岸，正文采用简洁传统的“海岛”，并以脚注保留范围。
- source_word: וָאֳנִיּוֹת תַּרְשִׁישׁ בָּרִאשֹׁנָה
  choice: 他施的船只在前头
  rationale: 保留地名性结构“他施的船只”；בָּרִאשֹׁנָה 表示优先或领先位置，“在前头”比孤立的“首先”更清楚地修饰船队。
- source_word: לְהָבִיא בָנַיִךְ מֵרָחוֹק
  choice: 要把你的儿子从远方带来
  rationale: 目的不定式译为“要……带来”；בָנַיִךְ 明确是阳性复数，且上下文另提女儿，因此保留“儿子”。
- source_word: כַּסְפָּם וּזְהָבָם אִתָּם
  choice: 他们的金银也随他们一同带来
  rationale: 保留金银属于归回者以及与他们同行的强调；以自然汉语稍作整合，避免机械重复。
- source_word: לְשֵׁם יְהוָה אֱלֹהַיִךְ
  choice: 为了耶和华你上帝的名
  rationale: לְ 表示目的或归荣；“为了……的名”兼顾名、声誉和尊荣的含义，并直接音译神名。
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: 为了以色列的圣者
  rationale: 与前一 לְ 短语平行；“以色列的圣者”保留以赛亚书中重要而固定的神圣称号。
- source_word: כִּי פֵאֲרָךְ
  choice: 因为他使你得了荣耀
  rationale: פָּאַר 可表示使得荣耀、华美或尊贵；正文采用涵盖较广的“使你得了荣耀”，脚注保留其他可能语感。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代中文圣经读者最熟悉“耶和华”，且它作为专名能区别于“主”；“雅威”是更接近学界重构发音的另一选择。
- issue: בָנַיִךְ 的性别表达
  choice: 你的儿子
  alternative: 你的儿女
  rationale: 原文是阳性复数，且相邻经文另行提到女儿；因此不将其泛化为“儿女”，以保留篇章中的性别区分。
- issue: פֵאֲרָךְ 所表达的行动
  choice: 使你得了荣耀
  alternative: 使你美丽／使你尊贵
  rationale: 该动词的语义包含荣耀、华美和尊荣。正文不把它限定为外在装饰，也不将其抽象化为纯粹地位，脚注保留真实的词义张力。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“在前头”体现船只领先而来的图景；“这一切都是”是为澄清两个目的短语与前述归回行动的关系所作的轻度显化。所有脚注标记均置于相应正文位置。
