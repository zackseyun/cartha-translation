  text: וּ/פִתְּח֨וּ שְׁעָרַ֧יִ/ךְ תָּמִ֛יד יוֹמָ֥ם וָ/לַ֖יְלָה לֹ֣א יִסָּגֵ֑רוּ לְ/הָבִ֤יא אֵלַ֨יִ/ךְ֙ חֵ֣יל גּוֹיִ֔ם וּ/מַלְכֵי/הֶ֖ם נְהוּגִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/011.yaml
  text: Your gates will be open continually[a]; day and night they will not be shut, so that the wealth of the nations may be brought to you[b], with their kings led in procession.
translation:
  language: zh_hans
  text: 你的城门必常开，昼夜不关闭，好让列国的财富[a]被运到你这里，他们的君王也被引领而来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财富”所译的希伯来词也可指“力量”或“军队”；本章的上下文较支持财富、资源之意。
    reason: lexical_alternative
  - marker: b
    text: “被引领而来”也可理解为在行列中被带来，或受制而被押来；希伯来原文没有明确说明是哪一种方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִתְּחוּ שְׁעָרַיִךְ תָּמִיד
  choice: 你的城门必常常敞开
  rationale: 按预言语境将完成式表达为将来的持续状态；“敞开”自然体现城门处于开放状态，“常常”对应 תָּמִיד 的不间断含义。
- source_word: יוֹמָם וָלַיְלָה לֹא יִסָּגֵרוּ
  choice: 昼夜都不关闭
  rationale: “昼夜”保留表示持续不断的并举结构；נפעל 未完成式译为被动或状态性的“不关闭”，符合现代汉语习惯。
- source_word: לְהָבִיא אֵלַיִךְ
  choice: 好让……运到你这里
  rationale: לְ 加不定式表示目的；结合财富这一宾语，以“运到”自然表达物资被带到锡安，同时保留第二人称阴性单数所指向的拟人化锡安。
- source_word: חֵיל גּוֹיִם
  choice: 列国的财富
  rationale: חֵיל 可指力量、军队或财富；本章上下文集中描写列国把金银、货物和资源带到锡安，因此正文取“财富”，并用脚注保留其他词义可能。
- source_word: וּמַלְכֵיהֶם נְהוּגִים
  choice: 他们的君王也被引领而来
  rationale: 保留 נהג 被动分词“被带领”的语态，并避免正文擅自判定君王是礼仪性列队、受护送，还是作为降服者被押来。
theological_decisions:
- issue: חֵיל גּוֹיִם 在列国朝向锡安的图景中所指为何
  choice: 列国的物质财富和资源
  alternative: 列国的力量或军队
  rationale: 以赛亚书60章邻近经文反复描写金银、乳香、牲畜和船运财货，因此“财富”最契合直接语境；脚注仍注明该词较宽的语义范围。
- issue: נְהוּגִים 所描绘的君王处境
  choice: 君王被引领而来，不进一步限定方式
  alternative: 君王在仪仗中被引领，或作为被征服者被押来
  rationale: 希伯来语明确表达被动的带领，却未明确说明是礼仪性护送还是受制后的押送；正文保留这种神学与政治意象上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“城门”“列国”“君王”保留先知诗歌的尊严；“被引领而来”略带典雅色彩，却不把原文含混的仪仗或降服意象强行定型。
