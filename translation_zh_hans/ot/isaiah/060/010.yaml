source:
  edition: WLC
  text: וּ/בָנ֤וּ בְנֵֽי נֵכָר֙ חֹמֹתַ֔יִ/ךְ וּ/מַלְכֵי/הֶ֖ם יְשָׁרְת֑וּ/נֶךְ כִּ֤י בְ/קִצְפִּ/י֙ הִכִּיתִ֔י/ךְ וּ/בִ/רְצוֹנִ֖/י רִֽחַמְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/010.yaml
  text: The sons of foreigners will rebuild your walls[a], and their kings will minister to you; for in my wrath I struck you[d][c][b], but in my favor I have had compassion on you.
translation:
  language: zh_hans
  text: 外族人必重建你的城墙[a]，他们的君王必服侍你；因为我曾在我的震怒中击打过你，却在我的恩宠中怜悯了你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“外族之子”，也可译作“外族人的儿子”；这个希伯来语表达可泛指外族人。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָנוּ
  choice: 重建
  rationale: 该动词本义为“建造”；以城墙和复兴为语境，“重建”自然表达恢复之意，并未实质增添原文内容。
- source_word: בְנֵי נֵכָר
  choice: 外族人
  rationale: 字面为“外族之子”，但此希伯来语表达可泛指外族人；中文直译为“外族人的儿子”容易被误解为只涉及下一代，因此正文采用自然的惯用义，并以脚注保留字面形式。
- source_word: חֹמֹתַיִךְ
  choice: 你的城墙
  rationale: 复数名词带第二人称阴性单数后缀，指向被人格化为女性的锡安或耶路撒冷；正文不补出原文未明说的地名。
- source_word: וּמַלְכֵיהֶם
  choice: 他们的君王
  rationale: 直接保留原文的复数所属关系和庄重语体。
- source_word: יְשָׁרְתוּנֶךְ
  choice: 必服侍你
  rationale: שׁרת 的加强词干表示侍奉、供职或服事；“服侍”兼具臣服和侍候的含义，比宗教色彩较强的“事奉”更适合此处对象为城邑的语境。
- source_word: בְקִצְפִּי
  choice: 在震怒中
  rationale: קצף 表示强烈愤怒；“震怒”符合先知文学的庄重语域。
- source_word: הִכִּיתִיךְ
  choice: 击打你
  rationale: 忠实表达 נכה 的使役完成式，不将其弱化，也不额外解释打击的形式。
- source_word: וּבִרְצוֹנִי
  choice: 却在恩宠中
  rationale: רָצוֹן 在此表示悦纳、恩惠或美意；“恩宠”能与“震怒”形成鲜明对照，同时保留神施恩悦纳的意味。
- source_word: רִחַמְתִּיךְ
  choice: 怜悯你
  rationale: רחם 表达出于深切慈爱的怜悯；中文“怜悯”简洁、庄重，并保留情感与施恩两方面的含义。
theological_decisions:
- issue: 是否在正文明确指出受话者是锡安或耶路撒冷
  choice: 保留“你／你的”，不补出地名
  alternative: 译作“耶路撒冷，外族人必重建你的城墙”或补出“锡安”
  rationale: 原文以阴性单数第二人称称呼被人格化的城，却未在本节写出专名；不补名可避免超出原文。
- issue: 如何呈现审判与怜悯的对照
  choice: “我曾在震怒中击打你，却在恩宠中怜悯你”
  alternative: “我因发怒击打你，却因喜悦向你施怜悯”
  rationale: 所选译法同时保留神的震怒、主动击打、恩宠和怜悯，不淡化审判，也不将两者纳入原文未说明的系统解释。
- issue: 动词时态如何在中文中表达
  choice: 前半用“必”，后半用“曾”并以语境表达已然行为
  alternative: 全部不加时态副词，译作“外族人重建……我在震怒中击打你……”
  rationale: 希伯来文前半为未完成式，指向将来的复兴；后半为完成式，回顾击打与怜悯。中文适度加“必”和“曾”可清楚体现这一对比而不过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“外族人”比“异邦人的儿子”更自然；“服侍”避免无根据地限定为礼仪性事奉；分号保留复兴宣告与其神学缘由之间的结构关系。
