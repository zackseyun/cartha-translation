  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹא יִשָּׁמַ֨ע ע֤וֹד חָמָס֙ בְּ/אַרְצֵ֔/ךְ שֹׁ֥ד וָ/שֶׁ֖בֶר בִּ/גְבוּלָ֑יִ/ךְ וְ/קָרָ֤את יְשׁוּעָה֙ חוֹמֹתַ֔יִ/ךְ וּ/שְׁעָרַ֖יִ/ךְ תְּהִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/018.yaml
  text: Violence will no longer be heard in your land[a], devastation or destruction within your borders; and you will call your walls Salvation, and your gates Praise.
translation:
  language: zh_hans
  text: 你的地上不再听见暴力，你的疆界内也不再听见抢掠和毁坏[a]；你要称你的城墙为“拯救”，称你的城门为“赞美”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抢掠和毁坏”也可译作“灾毁和崩坏”。
    reason: שֹׁד可着重于抢掠行为或其造成的灾毁，שֶׁבֶר可指破裂、崩坏或毁灭；正文采用较具体、自然的组合，脚注保留结果性译法。
lexical_decisions:
- source_word: יִשָּׁמַע
  choice: 听见
  rationale: 保留尼法勒未完成式的被动表达；在后半分句补出“听见”，使希伯来诗句中省略的谓语在现代汉语中清楚自然，同时不限定所听见的是声音还是消息。
- source_word: חָמָס
  choice: 暴力
  rationale: 该词可指暴行、强暴和暴虐的不义；“暴力”既直接，又符合它与后面毁灭性词语的并列关系。
- source_word: בְּאַרְצֵךְ
  choice: 你的地上
  rationale: אֶרֶץ在此指锡安所属之地；“地上”保留先知文学的地域意象，也比“国内”少添现代国家含义。
- source_word: שֹׁד
  choice: 抢掠
  rationale: 该词首先可指暴力掠夺，也可延伸指其造成的灾毁；“抢掠”保留行为层面的具体意义。
- source_word: שֶׁבֶר
  choice: 毁坏
  rationale: 该词的基本意象是破裂、崩毁，在此表示灾祸性的破坏；“毁坏”与“抢掠”并列自然。
- source_word: בִּגְבוּלָיִךְ
  choice: 你的疆界内
  rationale: גְּבוּל可指边界或边界以内的地域；“疆界内”同时保留界线和辖域的空间意象。
- source_word: וְקָרָאת
  choice: 你要称
  rationale: 连接词按顺承处理，不额外加入原文未明说的转折；动词保留给城墙和城门命名的句法。
- source_word: יְשׁוּעָה
  choice: 拯救
  rationale: 作为城墙所得的名称，“拯救”既表达解救与安全，又比抽象术语更贴近普通现代读者；引号标明其名称功能。
- source_word: חוֹמֹתַיִךְ
  choice: 你的城墙
  rationale: 直接保留城市防御工事的意象。
- source_word: שְׁעָרַיִךְ
  choice: 你的城门
  rationale: 直接保留城市入口及公共生活中心的意象。
- source_word: תְּהִלָּה
  choice: 赞美
  rationale: 该词通常指赞美或赞歌；在此与“拯救”平行，作为城门的名称，保留复兴所带来的敬拜含义。
theological_decisions:
- issue: יְשׁוּעָה和תְּהִלָּה应译为普通描述还是城墙、城门所得的名称
  choice: 译作带引号的名称“拯救”和“赞美”
  alternative: 译作不带名称标记的普通名词“拯救”和“赞美”
  rationale: “称……为……”的句法表明这是赋名。中文没有以首字母大写标示专名的方式，因此用引号显示名称功能，但不把二者人格化，也不额外指明其施行者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前后两分句重复“不再听见”，把希伯来诗句省略的谓语在中文中补明；“听见”本身仍容纳声音与消息两种可能。名称使用中文引号，不用现代行政色彩较强的“国内”。
