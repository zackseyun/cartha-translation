reference: Isaiah 60:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תַּ֣חַת הַ/נְּחֹ֜שֶׁת אָבִ֣יא זָהָ֗ב וְ/תַ֤חַת הַ/בַּרְזֶל֙ אָ֣בִיא כֶ֔סֶף וְ/תַ֤חַת הָֽ/עֵצִים֙ נְחֹ֔שֶׁת וְ/תַ֥חַת הָ/אֲבָנִ֖ים בַּרְזֶ֑ל וְ/שַׂמְתִּ֤י פְקֻדָּתֵ/ךְ֙ שָׁל֔וֹם וְ/נֹגְשַׂ֖יִ/ךְ צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/017.yaml
  text: Instead of bronze I will bring gold[a], and instead of iron I will bring silver; instead of wood, bronze, and instead of stones, iron. And I will make peace your overseers[c][b], and righteousness your taskmasters.
translation:
  language: zh_hans
  text: 我必以金子代替铜，以银子代替铁；以铜代替木头，以铁代替石头。我必使和平作你的治理者[a]，使公义[b]作你的督工[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “治理者”或译“治理”“官员”。原文可指监督、职分、行政体系，也可指执行职务的人。
    reason: lexical_alternative
  - marker: b
    text: “公义”或译“正义”。原文也可指公共秩序中的公平与正直。
    reason: lexical_alternative
  - marker: c
    text: “督工”也可译“催逼你的人”或“统治者”。原文常指催逼劳役或征收贡赋的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: 代替
  rationale: 本节连续比较建筑材料的更换与提升，表示替代关系；“代替”准确自然。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可泛指铜或青铜；现代汉语圣经语体中“铜”简洁自然，也保留原词材质范围，避免过度限定合金成分。
- source_word: אָבִיא
  choice: 我要拿……
  rationale: 使役形在这里表示上帝供应、带来更优质的材料；配合“代替”译作“我要拿……代替……”最符合现代汉语表达。
- source_word: זָהָב
  choice: 金子
  rationale: 常用而庄重的金属名称。
- source_word: בַּרְזֶל
  choice: 铁
  rationale: 建筑材料清单中的直接对应词。
- source_word: כֶסֶף
  choice: 银子
  rationale: 上下文列举金属材料，必指白银而非钱财。
- source_word: עֵצִים
  choice: 木头
  rationale: 在建筑材料语境中自然表达集合意义。
- source_word: אֲבָנִים
  choice: 石头
  rationale: 适合建筑材料语境，且为现代汉语常用说法。
- source_word: שַׂמְתִּי
  choice: 我要使……作……
  rationale: 既传达“设立、任命”的意义，又保留和平与公义被人格化为治理者的诗意结构。
- source_word: פְקֻדָּתֵךְ
  choice: 你的治理者
  rationale: 该词可指监督、职分、治理体系或任职者；与下一分句的人称职务词相平行，译作“治理者”可保留人格化和行政意味，同时避免教会职衔联想。
- source_word: שָׁלוֹם
  choice: 和平
  rationale: 虽也包含安康、完整与福祉，但在复兴异象中“和平”是核心且最为人熟悉的表达。
- source_word: נֹגְשַׂיִךְ
  choice: 你的督工
  rationale: 该词常指催逼劳役、征收贡赋的人；“督工”保留其具体而带强制性的历史色彩，也凸显如今由公义取代压迫的反差。
- source_word: צְדָקָה
  choice: 公义
  rationale: 该词兼有道德正直与公共秩序中正义的含义；“公义”较能保留其宽广的神学和伦理范围。
theological_decisions:
- issue: 末句中治理用语应理解为官员、行政体系，还是人格化的抽象品质
  choice: 保留诗歌人格化：“我要使和平作你的治理者，使公义作你的督工。”
  alternative: “我要使你的治理充满和平，使你的统治者秉行公义。”
  rationale: 希伯来文容许把相关词理解为治理职能、行政体系或执行职务的人。正文保留和平与公义仿佛亲自执政、督导的诗意张力，不将其化约成具体政体或单纯政治口号。
- issue: צְדָקָה 应译为道德性的“公义”还是公共秩序中的“正义”
  choice: 公义
  alternative: 正义
  rationale: 语境涉及恢复后的公共治理，但原词并不只限于司法公平；“公义”可同时涵盖品格正直与秩序公正，脚注提示另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前半句用整齐的“拿……代替……”保持四重替换的节奏；后半句保留和平与公义人格化的诗歌意象，并以脚注说明行政名词及强制性职务词的语义幅度。
