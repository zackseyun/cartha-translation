  text: לֹא יִֽהְיֶה לָּ֨/ךְ ע֤וֹד הַ/שֶּׁ֨מֶשׁ֙ לְ/א֣וֹר יוֹמָ֔ם וּ/לְ/נֹ֕גַהּ הַ/יָּרֵ֖חַ לֹא יָאִ֣יר לָ֑/ךְ וְ/הָיָה לָ֤/ךְ יְהוָה֙ לְ/א֣וֹר עוֹלָ֔ם וֵ/אלֹהַ֖יִ/ךְ לְ/תִפְאַרְתֵּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/019.yaml
  text: The sun will no longer be for you the light by day[a], nor will the moon shine for you for brightness; but Yahweh will be for you an everlasting light[c][b], and your God your glory.
translation:
  language: zh_hans
  text: 太阳不再作你白昼的光，月亮也不以光辉照耀你；雅威[a]却要作你永远的光，你的上帝要作你的荣耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”，这里音译作“雅威”；传统中文常译作“耶和华”。
    reason: alternative_reading
  - marker: b
    text: “荣耀”也可译作“荣美”或“华美”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לָּךְ עוֹד
  choice: 不再作你……的
  rationale: 自然表达原文的否定、延续状态的终止以及לָךְ所表示的“对你而言”关系。
- source_word: לְאוֹר יוֹמָם
  choice: 作你白昼的光
  rationale: 保留לְ所表达的功能关系，并以简洁自然的中文呈现太阳作为白昼之光的诗性意象。
- source_word: וּלְנֹגַהּ ... לֹא יָאִיר לָךְ
  choice: 也不再以光辉照耀你
  rationale: “光辉”对应נֹגַהּ的明亮、辉光之义，“照耀你”体现אור使役式及לָךְ的关系，同时避免生硬直译。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名YHWH，而不以“主”这一称号代替。
- source_word: לְאוֹר עוֹלָם
  choice: 作你永远的光
  rationale: “永远的光”准确保留עוֹלָם所表达的恒久性，也维持本节先知诗歌的庄严意象。
- source_word: לְתִפְאַרְתֵּךְ
  choice: 作你的荣美
  rationale: תִפְאֶרֶת兼有荣耀、华美、光彩之义；“荣美”既保留这种语义宽度，也与前面的“永远的光”形成诗性平行。
theological_decisions:
- issue: 太阳和月亮不再充当光源的意象应如何理解
  choice: 保留先知性诗歌意象，不限定为字面宇宙变化或纯粹属灵隐喻
  alternative: 明确解释为末世的物质变化，或仅解释为属灵光照
  rationale: 原文只宣告雅威取代受造光体而成为锡安永远的光，并未在本节说明实现方式；译文不应消解这种张力。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用专名YHWH。“雅威”较直接地按普遍学术重构音译；脚注同时说明传统中文译法，方便读者辨认。
- issue: לְתִפְאַרְתֵּךְ所表达的关系
  choice: 你的上帝要作你的荣美
  alternative: 你的上帝使你得荣耀；你的上帝是你的荣耀
  rationale: 保留原文省略系词而与前句平行的结构，使上帝既可被理解为锡安的荣耀，也可被理解为其荣美的根源，而不额外限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语；以“作你……的光”维持两半句的诗性对应，并用分号突出受造光体与雅威永恒之光之间的转折。
