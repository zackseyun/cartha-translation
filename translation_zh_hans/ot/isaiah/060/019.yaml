revisions:
- from: 太阳不再作你白昼的光，月亮也不再以光辉照耀你；雅威[a]却要作你永远的光，你的上帝要作你的荣美[b]。
  to: 太阳不再作你白昼的光，月亮也不以光辉照耀你；雅威[a]却要作你永远的光，你的上帝要作你的荣耀[b]。
  rationale: 修订仅删除第二分句中原文未明说的“不再”，并将较少见的“荣美”改为更自然且合语境的“荣耀”；保留日月与雅威的诗性对照、神名音译，以及不对意象实现方式作额外解释。
