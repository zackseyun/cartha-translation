    issue: “月亮也不再以光辉照耀你”中的“不再”
    rationale: 原文第二分句为“月亮不照耀你以供光辉／明亮”，没有重复עוֹד（“再、仍然”）。中文可藉“也不”维持平行，而不把首句的时间副词明确扩展至第二分句。
  - severity: low
    issue: “你的上帝要作你的荣美”
    rationale: “荣美”可成立，但现代普通话中较为生僻；此处神作为锡安的תִפְאֶרֶת，译为“荣耀”既贴合上下文也更自然。脚注可说明“荣美、华美”等替代义。
  revised_text: 太阳不再作你白昼的光，月亮也不以光辉照耀你；雅威[a]却要作你永远的光，你的上帝要作你的荣耀[b]。
