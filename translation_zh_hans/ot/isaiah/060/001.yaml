id: ISA.60.1
reference: Isaiah 60:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ק֥וּמִי א֖וֹרִי כִּ֣י בָ֣א אוֹרֵ֑/ךְ וּ/כְב֥וֹד יְהוָ֖ה עָלַ֥יִ/ךְ זָרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/001.yaml
  text: Arise[a], shine, for your light has come[b], and the glory of Yahweh has risen upon you.
translation:
  language: zh_hans
  text: 起来，发光[a]！因为你的光已经来到；雅威[b]的荣耀已经在你身上升起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“起来，焕发光彩！”这个希伯来语命令既可表示发出光，也可表示变得明亮。
    reason: lexical_alternative
  - marker: b
    text: 原文为神名YHWH；中文传统也常译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: ק֥וּמִי
  choice: 起来
  rationale: 这是קום的阴性单数命令式，直接呼召锡安起来；“起来”自然、庄重，也保留了先知宣告的语气。
- source_word: א֖וֹרִי
  choice: 发光
  rationale: 这是אור的阴性单数命令式，可指发出光或显得光明；“发光”与下句“你的光”形成清楚呼应，同时不把意象限缩为单纯的容光焕发。
- source_word: כִּ֣י
  choice: 因为
  rationale: 此处引出前面两个命令的根据，采用“因为”明确表达因果关系。
- source_word: בָ֣א
  choice: 已经来到
  rationale: 完成式在先知话语中把所应许的事实描写为已经实现；“已经来到”保留其完成感和生动的确定性。
- source_word: אוֹרֵ֑ךְ
  choice: 你的光
  rationale: 直译名词אור及阴性单数第二人称后缀，既保留光明意象，也不限定其救恩、复兴或神显等丰富内涵。
- source_word: וּכְב֥וֹד
  choice: 荣耀
  rationale: כבוד在此指雅威显明的尊荣、威严与光辉；“荣耀”是自然且涵义宽广的对应词。
- source_word: יְהוָ֖ה
  choice: 雅威
  rationale: 原文直接使用四字神名YHWH；“雅威”按其常见学术拟音译出专名性质，避免将其改写为称号。
- source_word: עָלַ֥יִךְ
  choice: 在你身上
  rationale: על加阴性单数第二人称后缀，表示荣耀的升起与锡安直接相关；“在你身上”在中文中自然并贴近原文。
- source_word: זָרָֽח
  choice: 升起
  rationale: זרח常用于太阳或晨光升起、照耀。这里选“升起”保留黎明般的图像，并与前句光已经来到相呼应。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名YHWH。正文采用“雅威”以保留专名；脚注说明中文传统译名“耶和华”，不把专名无提示地替换为称号“主”。
- issue: 完成式בָא和זָרָח的时间意味
  choice: 以“已经来到”“已经……升起”表达完成而又鲜活的实现
  alternative: 将要来到、将要升起；来到、升起
  rationale: 两个希伯来语完成式可在先知性语境中把将来必成之事呈现为确定实现。中文用“已经”保留这种完成感，却不在正文中明确判定其只指过去事件。
- issue: 对阴性单数受话者的处理
  choice: 沿用第二人称“你”，不在正文补出“锡安”或“耶路撒冷”
  alternative: 锡安啊；耶路撒冷啊
  rationale: 动词和代词显示受话者为阴性单数，语境指向锡安或耶路撒冷，但本节并未明说其名称；保留“你”可避免把上下文所指写成原文正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。短句和感叹号保留先知呼召的力度；“你的光”“荣耀”“升起”等表达延续原文的晨光意象。正文不补明受话者为锡安，也不将两个完成式直接改成将来时，以保留原文的语法张力。
