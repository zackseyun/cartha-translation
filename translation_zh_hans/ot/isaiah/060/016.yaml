  text: וְ/יָנַקְתְּ֙ חֲלֵ֣ב גּוֹיִ֔ם וְ/שֹׁ֥ד מְלָכִ֖ים תִּינָ֑קִי וְ/יָדַ֗עַתְּ כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/016.yaml
  text: You will nurse on the milk of nations[a], and you will suck the breast of kings; and you will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
translation:
  language: zh_hans
  text: 你必吸吮列国的奶，也必吸吮君王的乳房[a]；你就会知道，我，雅威，是你的救主、你的救赎主，是雅各的大能者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两次都使用“吸吮”一词，并保留“奶”和“乳房”的鲜明哺乳意象；这描绘锡安从列国和君王得到供应与尊荣。
    reason: 说明原文重复的哺乳意象及其语境意义，不以解释取代正文。
lexical_decisions:
- source_word: וְיָנַקְתְּ / תִּינָקִי
  choice: 你要吸吮……吮吸
  rationale: 两处均出自 ינק，表示婴儿吸奶。译文保留重复和鲜明的哺乳意象，同时用现代汉语中自然的“吸吮／吮吸”形成诗意平行。阴性单数形式所指的是人格化的锡安。
- source_word: חֲלֵב גּוֹיִם
  choice: 列国的奶
  rationale: חֲלֵב 的直接意义是“奶”，גּוֹיִם 在此指外邦各国。保留具体意象，不将其直接抽象化为“财富”或“丰富”。
- source_word: וְשֹׁד מְלָכִים
  choice: 君王的乳房
  rationale: שֹׁד 在此指供哺乳的乳房；直译虽大胆，却忠实保留原文刻意使用的身体意象。מְלָכִים 直译为“君王”。
- source_word: וְיָדַעַתְּ
  choice: 你就会知道
  rationale: 表达预言语境中的后续结果；“就”自然呈现上下文隐含的结果关系，而未将其强化为明确因果。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以“主”这一称号替代。
- source_word: מוֹשִׁיעֵךְ
  choice: 你的救主
  rationale: 该词是 ישׁע 的使役分词并带第二人称阴性单数后缀；“救主”简洁地表达施行拯救者的身份。
- source_word: וְגֹאֲלֵךְ
  choice: 你的救赎主
  rationale: גאל 的分词带第二人称阴性单数后缀。“救赎主”保留以赎回、解救为核心的含义，又不额外限定为某种具体亲属制度角色。
- source_word: אֲבִיר יַעֲקֹב
  choice: 雅各的大能者
  rationale: 保留原文的“雅各”，不改作“以色列”；“大能者”体现 אֲבִיר 作为神圣称号所表达的力量与威严。
theological_decisions:
- issue: 是否将哺乳意象解释性改译为列国和君王的财富或供应
  choice: 正文保留奶、吸吮和乳房的具象表达
  alternative: 你要享用列国的财富，得着君王的供应
  rationale: 原文两次使用 ינק，并明确出现“奶”和“乳房”。虽然上下文可使人理解为锡安从列国得到供应与尊荣，但正文不应消解原有的身体意象及其张力。
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名。采用“雅威”作为其现代汉语音译，避免用称号替代专名；“耶和华”是传统形式，但对辅音神名的读音反映较间接。
- issue: גֹאֵל 是否应明确译作“至亲救赎者”
  choice: 救赎主
  alternative: 至亲救赎者
  rationale: גאל 可带有亲属履行赎回责任的背景，但本节本身没有明说亲属关系；“至亲救赎者”会把可能的制度背景变成正文中的明确限定。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。保留希伯来诗歌的并列结构和重复意象；以“你”称呼被人格化为女性的锡安，因为现代汉语代词无需在正文中标示语法性别。
