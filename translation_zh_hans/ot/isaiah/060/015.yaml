  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תַּ֧חַת הֱיוֹתֵ֛/ךְ עֲזוּבָ֥ה וּ/שְׂנוּאָ֖ה וְ/אֵ֣ין עוֹבֵ֑ר וְ/שַׂמְתִּי/ךְ֙ לִ/גְא֣וֹן עוֹלָ֔ם מְשׂ֖וֹשׂ דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/015.yaml
  text: Instead of your being forsaken and hated[a], with no one passing through, I will make you an everlasting majesty, a joy from generation to generation.
translation:
  language: zh_hans
  text: 你虽曾被离弃、被憎恨，无人经过，我却要使你成为永远的尊荣，成为世世代代的喜乐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת הֱיוֹתֵךְ
  choice: 你虽曾
  rationale: 该结构引出昔日处境与将来复兴之间的替换和逆转。汉语用“虽曾……却……”比逐字译作“代替你曾经……”更自然，同时清楚保留对比。
- source_word: עֲזוּבָה
  choice: 被离弃
  rationale: 准确表达被抛下、遭遗弃的状态，也保留先知书复兴语境中的庄重语气。
- source_word: וּשְׂנוּאָה
  choice: 被憎恨
  rationale: 按被动分词的直接含义翻译，不弱化为“被轻视”或扩展为“被拒绝”。
- source_word: וְאֵין עוֹבֵר
  choice: 无人经过
  rationale: 保留城市荒凉、没有行人往来的具体图景；“经过”既可涵盖路过，也不排除穿行。
- source_word: וְשַׂמְתִּיךְ
  choice: 我却要使你成为
  rationale: שׂים与ל连用在此表示使之成为某种身份或状态；加入“却”自然呈现前后逆转。
- source_word: לִגְאוֹן עוֹלָם
  choice: 永远的尊荣
  rationale: גאון在此指上帝赐给锡安的崇高、受尊崇地位。“尊荣”避免现代汉语“骄傲”可能带来的负面道德含义，又保留尊贵与荣耀的语义范围。
- source_word: מְשׂוֹשׂ
  choice: 喜乐
  rationale: 该名词可指喜乐、欢欣或带来喜乐之物；在“使你成为”的结构中，“喜乐”简洁自然，并保留一定语义开放性。
- source_word: דּוֹר וָדוֹר
  choice: 世世代代
  rationale: 以自然庄重的汉语惯用表达传达一代接一代、持续不息的意思。
theological_decisions:
- issue: 复兴宣告中גאון的含义
  choice: 尊荣
  alternative: 威荣、荣耀、崇高；也可按词面译作“骄傲”
  rationale: 上下文讲的是耶和华使锡安从被离弃转为受尊崇，因此这里不是罪性的自高，而是蒙赐的崇高地位。“尊荣”既符合语境，也不额外加入宗派性解释。
- issue: מְשׂוֹשׂ所指的关系
  choice: 成为世世代代的喜乐
  alternative: 世世代代欢喜；成为历代的欢乐
  rationale: 原文没有明确说明是谁因锡安欢喜。译文保留这种开放性，不擅自补出“万民”“上帝”或“居民”等主体。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“虽曾……却……”重现希伯来文的逆转结构；避免生硬直译，也不消解“尊荣”和“喜乐”所保留的诗性张力。
