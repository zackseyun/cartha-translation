  yaml_path: translation/ot/isaiah/060/003.yaml
  text: Nations will come to your light[c][b][a], and kings to the brightness of your rising.
translation:
  language: zh_hans
  text: 列国必走向你的光[a][b]；君王必走向你升起的光辉[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “走向”也可译为“前往”或“行走到（你的光那里）”。
    reason: lexical_alternative
  - marker: b
    text: “列国”在某些语境中也可译作“外邦人”或“各民族”。
    reason: lexical_alternative
  - marker: c
    text: “你升起的光辉”也可译作“你黎明的光辉”或“你照耀而出的光辉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: 必走向
  rationale: הלך的基本义是“行走、去”；与表示方向的לְ连用时，这里自然表达朝目标而去。采用“走向”既保留行动意象，也符合预言语境中的将来含义。
- source_word: גוֹיִם
  choice: 列国
  rationale: גוים通常指各国、各民族；“列国”在先知文学中自然庄重，并避免“外邦人”可能带入的较窄解释。
- source_word: לְאוֹרֵךְ
  choice: 向你的光
  rationale: אוֹר意为“光”，לְ表示方向；阴性单数第二人称后缀指向上下文中被人格化的锡安或耶路撒冷。
- source_word: וּמְלָכִים
  choice: 君王
  rationale: מלכים明确指“王、君王”；不泛化为范围更宽的“统治者”。
- source_word: לְנֹגַהּ
  choice: 走向……光辉
  rationale: נֹגַהּ表示明亮、光辉或灿烂；第二分句省略前句动词，汉语补出“走向”，使平行结构清楚。
- source_word: זַרְחֵךְ
  choice: 你升起时的
  rationale: זרח含“升起、照耀而出”之意，常用于日出或曙光。“你升起时”保留其动作意象及对第二人称的直接称呼，不把比喻限定为单一解释。
theological_decisions:
- issue: 两个阴性单数第二人称后缀所指的对象
  choice: 按上下文保留对人格化的锡安或耶路撒冷的直接称呼“你”
  alternative: 将“你”解释性地改写为“上帝的子民”
  rationale: 以赛亚书60章的近距离语境以阴性单数称呼锡安；正文不把这一形象进一步等同于某个特定神学群体，从而保留经文本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，并保留希伯来诗歌两个平行分句的结构。第二分句在汉语中补出省略的“走向”，避免生硬；“你的光”与“你升起时的光辉”保持意象开放，不额外指明光的神学身份。
