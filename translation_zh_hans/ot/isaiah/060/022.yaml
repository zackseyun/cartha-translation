  rationale: 修订仅处理语义范围、汉语自然度及不必要的补足：“最微小的”更准确对应与“最小的”平行的 הַצָּעִיר；“一千”避免将数词限定为“千人”；“在其时候，我必加速成就这事”以自然、庄重的现代汉语保留原文的时间张力和神主动促成实现的使役意义。
