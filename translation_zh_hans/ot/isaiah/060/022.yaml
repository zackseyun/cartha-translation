  text: הַ/קָּטֹן֙ יִֽהְיֶ֣ה לָ/אֶ֔לֶף וְ/הַ/צָּעִ֖יר לְ/ג֣וֹי עָצ֑וּם אֲנִ֥י יְהוָ֖ה בְּ/עִתָּ֥/הּ אֲחִישֶֽׁ/נָּה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/022.yaml
  text: The smallest will become a thousand[a], and the least a mighty nation. I am Yahweh[c][b]; in its time I will hasten it.
translation:
  language: zh_hans
  text: 最小的必成为一千[a][b]，最微小的必成为强盛之国。我是雅威；在其时候[c]，我必加速成就这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最小的”也可译作“微小的”或“最不起眼的”。
    reason: lexical_alternative
  - marker: b
    text: “一千”在某些语境中也可指“宗族”或“氏族单位”；但这里与“强盛之国”平行，按数目理解更符合增长的意象。
    reason: lexical_alternative
  - marker: c
    text: “在其时候”也可译作“在所定的时候”。原文把既定的时机与“加速成就”并列，保留了两者之间的张力。
    reason: alternative_reading
lexical_decisions:
- source_word: הַקָּטֹן
  choice: 最小的
  rationale: 该形容词在此作名词用，指最小或最不起眼的个体或群体；“最小的”保留了原文的比较意味，也与下句平行。
- source_word: יִהְיֶה לָאֶלֶף
  choice: 必增至千人
  rationale: היה 在此表达由少变多的结果；中文用“增至”自然地呈现这种转变。אֶלֶף 首先是数词“一千”，结合下句“强盛之国”的增长意象，按人数理解最为合适。
- source_word: הַצָּעִיר
  choice: 最微弱的
  rationale: צָעִיר 可指年幼、微小或地位低微；本节与“最小的”平行，重点是弱小而非年龄，因此译为“最微弱的”。
- source_word: לְגוֹי עָצוּם
  choice: 成为强盛之国
  rationale: גּוֹי 通常指“国”或“民族”，עָצוּם 表示强大、强盛；“强盛之国”既自然又保留规模与力量的增长。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 原文直接使用四字神名 יהוה；以“雅威”音译，保留其作为专名的性质。
- source_word: בְּעִתָּהּ
  choice: 到它的时候
  rationale: 直译近于“在它的时候”；阴性后缀所指应是前述应许之事。“到它的时候”在现代汉语中较自然，同时不明确添加原文未明说的“指定”。
- source_word: אֲחִישֶׁנָּה
  choice: 我必使这事迅速成就
  rationale: 该词为 חושׁ 的使役形，并带阴性宾语后缀，表达雅威亲自使所应许之事迅速实现；此译法兼顾使役意义与中文可读性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文是神的专名而非普通称号；采用“雅威”可直接呈现这一点，并避免把专名化为称号。
- issue: 既有特定时候、又要迅速成就之间的张力
  choice: 到它的时候，我必使这事迅速成就
  alternative: 时候一到，我就立刻成就这事；到了指定的时候，我必迅速成就
  rationale: 原文并置“它的时候”与“使之加快”，形成固定时机和迅速实现之间的张力；正文保留这一并置，不解释为延迟或提前。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“最小的／最微弱的”形成平行，“千人／强盛之国”呈现由微小到兴盛的递进。末句避免用过度古雅的“速成”，也不把时间张力改写为单纯的“立即”。
