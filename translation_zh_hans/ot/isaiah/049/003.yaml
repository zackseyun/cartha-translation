  yaml_path: translation/ot/isaiah/049/003.yaml
  text: And he said to me[a], “You are my servant, Israel, in whom I will be glorified.”
translation:
  language: zh_hans
  text: 他对我说：“你是我的仆人，以色列；我要在你身上彰显我的荣耀。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要在你里面显出荣耀。”希伯来语动词也可较直译为这样；正文表达上帝在他的仆人身上彰显自己荣耀的意思。
    reason: 词义与句法上的可选译法
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: 他对我说
  rationale: 未完成式连续体承接上下文叙事；中文无需机械译出连接词，לִי自然译为“对我”。
- source_word: עַבְדִּי אָתָּה
  choice: 你是我的仆人
  rationale: 独立代词אָתָּה带有明确、略加强的指称；中文以“你是”自然保留。עֶבֶד在本段指受差遣服事者，译“仆人”比“奴隶”更合语境。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留专名，并按原文使其与“我的仆人”构成同位称呼，不在译文中判定其具体所指。
- source_word: אֲשֶׁר בְּךָ
  choice: 在你身上
  rationale: בְּךָ最直接是“在你里面／身上”；现代汉语中“在你身上”自然表达以上帝的仆人为彰显所在，同时不过早收窄为纯工具性的“借着你”。关系词אֲשֶׁר在汉语中可隐含。
- source_word: אֶתְפָּאָר
  choice: 我要彰显我的荣耀
  rationale: פאר的Hitpael形式可表达使自己显为荣耀、彰显自己的荣美；此译保留主动反身意义，又比“我要荣耀自己”更自然庄重。
theological_decisions:
- issue: “以色列”这一仆人的身份
  choice: 直接保留“你是我的仆人，以色列”这一称呼
  alternative: 将“以色列”明确解释为全民族、忠信余民，或代表以色列的个人／弥赛亚
  rationale: 本节称仆人为“以色列”，但更广语境使其与以色列的关系保持张力；译文不替经文作身份判定。
- issue: 上帝如何在仆人身上得荣耀
  choice: 译为“我要在你身上彰显我的荣耀”
  alternative: “我要在你里面显为荣耀”或“我要借着你得荣耀”
  rationale: 原文介词ב与反身动词允许所在、媒介及显荣等相近理解；正文采用自然且贴近语义的表达，脚注保留更形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“仆人”沿用以赛亚书仆人段落的通行表达；分号清楚标示称呼与随后关系分句的层次。脚注标记置于正文对应句末。
