  text: וְ/עַתָּ֣ה אָמַ֣ר יְהוָ֗ה יֹצְרִ֤/י מִ/בֶּ֨טֶן֙ לְ/עֶ֣בֶד ל֔/וֹ לְ/שׁוֹבֵ֤ב יַֽעֲקֹב֙ אֵלָ֔י/ו וְ/יִשְׂרָאֵ֖ל לא יֵאָסֵ֑ף וְ/אֶכָּבֵד֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֵ/אלֹהַ֖/י הָיָ֥ה עֻזִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/005.yaml
  text: And now Yahweh says—he who formed me from the womb to be his servant, to bring Jacob back to him, and that Israel might be gathered to him[a]—yet I am honored in the eyes of Yahweh, and my God has become my strength.
translation:
  language: zh_hans
  text: 现在，耶和华说——他从母腹中塑造我，使我作他的仆人，要使雅各归回到他那里，并使以色列被聚集到他那里[a]——我在耶和华眼中得尊荣，我的神也成了我的力量。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语辅音文本作“不”，可译为“以色列却没有被聚集”或“虽然以色列没有被聚集”。许多古代译本和解释传统则按“到他那里”理解，与前句“使雅各归回到他那里”形成平行。
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中广为人知的专名译法，保留其作为以色列之神圣名的功能。
- source_word: יֹצְרִי מִבֶּטֶן
  choice: 他从母腹中塑造我
  rationale: “塑造”体现 יצר 有目的地制作、成形之意；“从母腹中”保留蒙召始于出生以前的表达。
- source_word: לְעֶבֶד לוֹ
  choice: 使我作他的仆人
  rationale: עבד 在此着重受命服事的身份和使命；“仆人”比“奴隶”更符合本段语境，也保持庄重自然。
- source_word: לְשׁוֹבֵב יַעֲקֹב אֵלָיו
  choice: 要使雅各归回他
  rationale: שׁובב 在此表达使之返回的使役意义；“使……归回”既保留方向性，也契合先知书的复归语汇。
- source_word: וְיִשְׂרָאֵל לא יֵאָסֵף
  choice: 使以色列被聚集到他那里
  rationale: 正文依平行结构采用 לוֹ（“到他那里”）所反映的理解；马所拉文本所标的 לֹא（“不”）则在脚注中完整保留。
- source_word: וְאֶכָּבֵד בְּעֵינֵי יְהוָה
  choice: 我在耶和华眼中得尊荣
  rationale: כבד 的尼法勒形表达受尊重、得荣耀；“得尊荣”自然庄重，并不过度强化为神学术语。
- source_word: וֵאלֹהַי הָיָה עֻזִּי
  choice: 我的神也成了我的力量
  rationale: 保留 היה 的形成或结果意味，并将 עז 直译为“力量”，不擅自改作“保障”或“避难所”。
theological_decisions:
- issue: וְיִשְׂרָאֵל לא יֵאָסֵף 的文本与释义歧义
  choice: 正文作“使以色列被聚集到他那里”，将 לוֹ 的理解置于正文。
  alternative: 按马所拉标音作“以色列却没有被聚集”或“虽然以色列没有被聚集”。
  rationale: “到他那里”与前句“使雅各归回他”形成紧密平行，也有古代译本传统支持；然而现存马所拉文本明确标作否定词，因此用脚注公开保留这一具有神学张力的读法。
- issue: 仆人的尊荣与使命成效之间的关系
  choice: 以并列方式译作“我在耶和华眼中得尊荣”，不添加“然而”。
  alternative: 译作“然而，我在耶和华眼中仍得尊荣”，突出使命似乎未见成效时的转折。
  rationale: 若正文采用“聚集到他那里”的读法，希伯来语连接词 וְ 无须强译为转折；避免由脚注中的否定读法反向控制正文句法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。正文保留仆人之歌的第一人称使命宣告和破折号结构；避免过度古雅用语，也不借转折词预先解决文本异读所产生的张力。
