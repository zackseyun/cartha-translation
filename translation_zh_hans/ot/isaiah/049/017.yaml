base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/017.yaml
  text: Your children hurry back[a]; those who tore you down and devastated you will depart from you.
translation:
  language: zh_hans
  text: 你的儿女急忙归回[a]；拆毁你、使你荒凉的人，必从你那里离去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“建造你的人急忙赶来。”有些古代文本传统反映“建造你的人”，而非“你的儿女”的读法。
    reason: alternative_reading
lexical_decisions:
- source_word: מִהֲרוּ
  choice: 正赶着回来
  rationale: 该动词源自 מהר，意为“赶快、迅速行动”。原文没有明说“回来”，但本节以锡安的儿女与离去的毁灭者相对照，语境自然暗示儿女迅速归回；用“赶着回来”使现代汉语通顺，同时保留其急速之意。
- source_word: בָּנָיִךְ
  choice: 你的儿女
  rationale: 马所拉文本读作“你的众子/儿女”。锡安被拟人化为母亲，因此“儿女”既自然，也可泛指她归回的居民；“建造你的人”作为古代见证所反映的异读收入脚注。
- source_word: מְהָרְסַיִךְ
  choice: 拆毁你的人
  rationale: הרס 的分词表示“拆毁、摧毁者”。译成关系短语符合现代汉语，并保留针对城邑的拆毁意象。
- source_word: וּמַחֲרִבַיִךְ
  choice: 使你荒废的人
  rationale: 该词表示使某处荒凉、毁坏的人。“使你荒废”保留城邑遭毁而荒凉的含义，并与“拆毁你”形成递进而非完全重复。
- source_word: מִמֵּךְ
  choice: 从你那里
  rationale: 介词 מן 带阴性第二人称单数后缀，表达分离或离开；“从你那里”准确而自然。
- source_word: יֵצֵאוּ
  choice: 必……离去
  rationale: יצא 意为“出去、离开”。与“从你那里”连用时译为“离去”最符合现代汉语；“必”体现此未完成式在预言语境中的确定将来意味。
theological_decisions:
- issue: בָּנָיִךְ 的异文理解
  choice: 你的儿女
  alternative: 建造你的人
  rationale: 马所拉文本的元音标注明确支持“你的儿女”，也契合锡安儿女归回、毁灭者离去的复兴主题。部分古代见证反映“建造你的人”的读法，且与重建语境相合；为遵循希伯来文本同时保存真实的文本差异，正文采用“儿女”，异读列入脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正赶着回来”表达 מהר 的急迫感及语境所暗示的归回；分号凸显儿女归回与毁灭者离去之间的对照。
