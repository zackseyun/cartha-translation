- from: 他又说：“你作我的仆人，使雅各众支派重新站立，使以色列中蒙保全的人归回，这还算是小事；我还要使你成为列国的光[a]，使我的救恩临到地极[b]。”
  to: 他又说：“你作我的仆人，使雅各众支派重新站立，使以色列中蒙保全的人归回，这事太小了；我还要使你成为列国的光[a]，使你成为我的救恩，直到地极[b]。”
  rationale: 修订保留原文的比较力度，并恢复末句与“使你成为列国的光”相平行的“使你成为我的救恩”结构；这既忠实于希伯来文，也不对仆人的具体身份作神学预断。脚注b改为准确说明单数形式及其字面对应。
