  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר נָקֵ֨ל מִֽ/הְיוֹתְ/ךָ֥ לִ/י֙ עֶ֔בֶד לְ/הָקִים֙ אֶת שִׁבְטֵ֣י יַעֲקֹ֔ב ו/נצירי יִשְׂרָאֵ֖ל לְ/הָשִׁ֑יב וּ/נְתַתִּ֨י/ךָ֙ לְ/א֣וֹר גּוֹיִ֔ם לִֽ/הְי֥וֹת יְשׁוּעָתִ֖/י עַד קְצֵ֥ה הָ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/006.yaml
  text: And he said[a], “It is too small a thing for you to be my servant to raise up the tribes of Jacob and to bring back the preserved ones of Israel; I will also make you a light for the nations[c][b], to be my salvation to the end of the earth.”
translation:
  language: zh_hans
  text: 他又说：“你作我的仆人，使雅各众支派重新站立，使以色列中蒙保全的人归回，这事太小了；我还要使你成为列国的光[a]，使你成为我的救恩，直到地极[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国的光”也可译作“给列国的光”；“列国”也可译作“外邦人”。
    reason: lexical_alternative
  - marker: b
    text: “地极”原文为单数，字面是“地的尽头”；也可译作“直到地的尽头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: 还算是小事
  rationale: 该词有轻微、不足道之意；结合句式，表达仅承担使以色列复兴的使命，相较于更广大的旨意仍是“小事”。
- source_word: עֶבֶד
  choice: 仆人
  rationale: 在以赛亚书的仆人语境中，这是受上帝差遣者的身份与职分称谓；“仆人”自然庄重，也不额外强调奴役状态。
- source_word: לְהָקִים
  choice: 使……重新站立
  rationale: 保留קום使役形的“使站立”意象，同时以“重新”传达恢复、重建的语境含义。
- source_word: שִׁבְטֵי יַעֲקֹב
  choice: 雅各众支派
  rationale: 忠实保留原文“雅各”及支派用语，并与下句“以色列”形成平行。
- source_word: נְצִירֵי יִשְׂרָאֵל
  choice: 以色列中蒙保全的人
  rationale: נצר所表达的核心是被守护、被保存；“蒙保全的人”保留被动含义，又比生硬的“被保存者”更符合现代汉语。
- source_word: לְהָשִׁיב
  choice: 使……归回
  rationale: שוב的使役形基本义是使之返回；“归回”也保留地理返回与整体复兴之间的语义张力。
- source_word: וּנְתַתִּיךָ
  choice: 我还要使你成为
  rationale: 字面为“我还要给你”，但与身份补语连用时意为立为、使成为；“还”清楚体现使命从以色列扩展到列国。
- source_word: לְאוֹר גּוֹיִם
  choice: 列国的光
  rationale: גּוֹיִם在此指以色列以外的众民族；“列国”符合先知文学语体，并避免把含义预先收窄为特定族群称谓。
- source_word: יְשׁוּעָתִי
  choice: 我的救恩
  rationale: 该词可指拯救或解救；“救恩”保留上帝施行拯救的广度，并符合以赛亚书的用语。
- source_word: עַד קְצֵה הָאָרֶץ
  choice: 临到地极
  rationale: 原文为单数“地的尽头”；汉语惯用“地极”，既简洁自然，也能表达救恩所达到的最远范围。
theological_decisions:
- issue: 仆人的身份及使命范围
  choice: 保留经文本身所陈述的双重使命：使雅各／以色列复兴，并把上帝的救恩扩展到列国。
  alternative: 把仆人明确译成集体以色列，或在译文中明确认定为弥赛亚。
  rationale: 本节没有在句内消除仆人身份的解释张力；译文不加入特定身份判断，只呈现其面向以色列和列国的使命。
- issue: גּוֹיִם的范围
  choice: 列国
  alternative: 外邦人
  rationale: “列国”保留该词在先知语境中的普世视野，而不把它预先限定为与犹太人相对的族群术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“重新站立”保留希伯来文的具体意象；“蒙保全的人”保持原文可能指被守护者或幸存者的张力。所有代词均不擅自明确仆人的具体身份。
