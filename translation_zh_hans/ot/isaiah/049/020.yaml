  text: ע֚וֹד יֹאמְר֣וּ בְ/אָזְנַ֔יִ/ךְ בְּנֵ֖י שִׁכֻּלָ֑יִ/ךְ צַר לִ֥/י הַ/מָּק֖וֹם גְּשָׁ/ה לִּ֥/י וְ/אֵשֵֽׁבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/020.yaml
  text: Yet the children of your bereavement will still say in your hearing[a], ‘The place is too cramped for me[b]; make room for me so that I may dwell.’
translation:
  language: zh_hans
  text: 你丧子后所生的儿女[a]，还要在你耳边说：“这地方对我太挤了；请给我让出地方[b]，好让我住下。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译作“你丧子之事的儿子们（儿女）”。结合上下文，指锡安失去儿女之后重新得着的儿女；“儿女”用于群体性称呼。
    reason: 说明紧缩属格短语及其上下文所指，避免“儿女自己丧子”或“处在丧子之痛中”的误解。
  - marker: b
    text: 希伯来语动词字面可作“靠近些”或“上前”。在住处拥挤的语境中，这话可能是叫人挪动、让出空间。
    reason: 保留动词较字面的含义，同时说明正文“让出地方”的语境义；不将“给我”误释为“到我这里”。
lexical_decisions:
- source_word: ע֚וֹד
  choice: 还要
  rationale: 表达在先前应许基础上的延续和追加，符合预言语境，也自然引出将来的话语。
- source_word: בְ/אָזְנַ֔יִ/ךְ
  choice: 在你耳边
  rationale: 保留希伯来语的身体意象，同时在现代汉语中自然地表示当面听见。
- source_word: בְּנֵ֖י שִׁכֻּלָ֑יִ/ךְ
  choice: 你丧子之痛中的儿女
  rationale: 尽量保留“你丧子之事／丧子状态的儿女”这一紧缩而不寻常的关系表达，不擅自明确为“丧子之后所生”，也避免误说成儿女自己丧亲。
- source_word: צַר לִ֥/י הַ/מָּק֖וֹם
  choice: 这地方对我来说太挤了
  rationale: צַר在此表示空间狭窄、拥挤；“太挤了”比直译“太窄了”更符合人口增多、住处不足的语境。
- source_word: גְּשָׁ/ה לִּ֥/י
  choice: 请给我腾出地方
  rationale: 字面涉及“靠近、上前”，但在空间拥挤的语境中，最可能是要求对方挪动、让出空间；正文采用自然汉语，脚注保留字面可能。
- source_word: וְ/אֵשֵֽׁבָה
  choice: 让我住下
  rationale: ישׁב在此指安居、居住，而不只是坐下；“让我”自然表达前一命令所指向的目的或结果。
theological_decisions:
- issue: “丧子之痛中的儿女”与锡安先前丧子的关系
  choice: 不明确说明这些儿女是在丧子以后出生、归回，还是以其他方式与锡安的丧子状态相关
  alternative: 你丧子之后所生的儿女
  rationale: 希伯来语本身只是“你丧子之事的儿女”这一属格结构；上下文强调锡安从丧子到儿女众多的逆转，但本节未明说出生时间，因此保留张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“丧子之痛中的儿女”略带陌生感，是为保留希伯来语原句刻意形成的张力；引语则用自然口吻呈现拥挤和请求腾地方的场景。
