source:
  edition: WLC
  text: וְ/אָמַ֣רְתְּ בִּ/לְבָבֵ֗/ךְ מִ֤י יָֽלַד לִ/י֙ אֶת אֵ֔לֶּה וַ/אֲנִ֥י שְׁכוּלָ֖ה וְ/גַלְמוּדָ֑ה גֹּלָ֣ה וְ/סוּרָ֗ה וְ/אֵ֨לֶּה֙ מִ֣י גִדֵּ֔ל הֵ֤ן אֲנִי֙ נִשְׁאַ֣רְתִּי לְ/בַדִּ֔/י אֵ֖לֶּה אֵיפֹ֥ה הֵֽם־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/021.yaml
  text: Then you will say in your heart, ‘Who has borne these for me, since I was bereaved and barren, exiled and cast off? And these—who has raised them? Look, I was left alone; where then did these come from?’
translation:
  language: zh_hans
  text: 你必在心里说：“谁为我生了这些儿女？我丧失儿女，不能生育，又被掳、被撇弃；这些儿女是谁抚养大的？看哪，我独自一人被留下；这些儿女究竟是从哪里来的？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָלַד לִי
  choice: 为我生了
  rationale: 保留希伯来语“生育”意象及לִי所表达的关系；结合上下文补出“儿女”，使中文指代清楚。
- source_word: שְׁכוּלָה
  choice: 丧失儿女
  rationale: 该词指父母痛失儿女，直译其核心含义，并与本节突然出现众多儿女的惊异形成张力。
- source_word: גַלְמוּדָה
  choice: 不能生育
  rationale: 在本语境中与“丧失儿女”并列，表达无子、荒凉的状态；采用自然中文而不局限于生理诊断。
- source_word: גֹּלָה
  choice: 被掳
  rationale: 该形式在此表达流亡、被迁离故土的处境；“被掳”符合以赛亚书的历史语境和中文圣经语体。
- source_word: וְסוּרָה
  choice: 被撇弃
  rationale: 词根含离开、除去之意；保留主体遭遗弃或被移开的含混性，不具体指定施事者。
- source_word: גִּדֵּל
  choice: 抚养大的
  rationale: 使役强意词干表示使之长大、养育；“抚养大”自然且准确。
- source_word: אֵיפֹה הֵם
  choice: 究竟是从哪里来的
  rationale: 字面为“他们在哪里”，但在惊见这些儿女的语境中是追问其来源；用“从哪里来的”传达语用意义，并以“究竟”体现惊讶。
theological_decisions:
- issue: 说话者与“这些”的身份
  choice: 将“这些”译作“这些儿女”，但不在正文中明确说话者就是锡安
  alternative: 始终只译作“这些”，或补成“锡安的儿女”
  rationale: 上下文明确指归回并聚集的儿女，中文需要适度补明；但本节本身没有直接说出“锡安”，故不额外加入。
- issue: 被撇弃的施事者
  choice: 使用无施事者的被动表达“被撇弃”
  alternative: 译为“被上帝撇弃”或“离群独居”
  rationale: 希伯来文没有明说是谁使她处于该状态；不把神学解释写入正文。
- issue: 末句的空间问句与来源问句
  choice: 译为“究竟是从哪里来的”
  alternative: 形式直译为“这些儿女在哪里？”
  rationale: 眼前已经看见这些儿女，因此此问在语境中不是查询位置，而是惊问他们如何出现、从何而来；译文保留这一修辞作用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留连续反问和惊叹语气；以“看哪”对应הֵן，维持先知文学的庄严感。
