  text: וַ/יָּ֤שֶׂם פִּ/י֙ כְּ/חֶ֣רֶב חַדָּ֔ה בְּ/צֵ֥ל יָד֖/וֹ הֶחְבִּיאָ֑/נִי וַ/יְשִׂימֵ֨/נִי֙ לְ/חֵ֣ץ בָּר֔וּר בְּ/אַשְׁפָּת֖/וֹ הִסְתִּירָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/002.yaml
  text: And he made my mouth like a sharp sword; in the shadow of his hand he hid me[a]. And he made me into a polished arrow; in his quiver he concealed me.
translation:
  language: zh_hans
  text: 他使我的口如利剑，把我藏在他手的荫影下；又使我成为一支磨亮的箭[a]，把我藏在他的箭袋里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “磨亮的箭”或译“精选的箭”、“磨利的箭”或“炼净的箭”。希伯来语形容词有洁净、精炼或挑选之意；在这里可能指一支经过精心整备、可供使用的箭。
    reason: 保留 בָּרוּר 的词义幅度；“磨亮”符合箭的具体意象，但并非唯一可能的理解。
lexical_decisions:
- source_word: וַיָּשֶׂם פִּי
  choice: 他使我的口
  rationale: 保留“我的口”这一具体的身体隐喻，不抽象改写为“我的话”；“使……如……”自然表达 שׂוּם 加表语所形成的结果状态。
- source_word: כְּחֶרֶב חַדָּה
  choice: 如快刀
  rationale: “快刀”在现代汉语中自然表达锋利的刀剑，并保留原文的明喻及其鲜明力度；חֶרֶב 可泛指刀剑类武器。
- source_word: בְּצֵל יָדוֹ
  choice: 在他手的荫下
  rationale: 贴近原文“在他手的荫影中”的诗性意象，让遮蔽、保护和隐藏的含义由上下文呈现。
- source_word: הֶחְבִּיאָנִי
  choice: 把我藏
  rationale: 直接表达使役形所指的隐藏，不额外说明隐藏的目的。
- source_word: וַיְשִׂימֵנִי לְחֵץ
  choice: 又使我成为一支……箭
  rationale: 表达 שׂוּם 与 לְ 所形成的结果或用途关系；“成为”在汉语中自然，也不必断定是制造、任命还是比拟。
- source_word: בָּרוּר
  choice: 磨亮的
  rationale: 该词基本含义涉及洁净、精炼或挑选；用于箭的语境时，“磨亮的”能自然描写一支经过精心整备的箭，同时以脚注保留其他可能。
- source_word: בְּאַשְׁפָּתוֹ
  choice: 在他的箭袋里
  rationale: אַשְׁפָּה 在本语境中指箭袋；保留第三人称所有关系。
- source_word: הִסְתִּירָנִי
  choice: 把我藏
  rationale: 准确传达 סתר 使役形的隐藏、遮蔽之意；与前半句重复用词，也保留希伯来诗句两处近义平行的紧密联系。
theological_decisions:
- issue: 仆人口与兵器的隐喻所指
  choice: 正文保留“口如快刀”和“成为一支磨亮的箭”的具体意象，不在译文中解释为讲道、预言或某种特定的弥赛亚使命。
  alternative: 在正文中明确解释为有能力的话语、先知职分或基督论使命。
  rationale: 本节本身呈现仆人的话语与使命之兵器意象，却没有在这一句内穷尽其神学所指；保留隐喻可维持诗歌张力和诠释开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分号保留两组平行意象；两次译作“把我藏”，有意呈现原文近义动词的平行关系。脚注标记紧接“磨亮的箭”，使其准确对应存在词义分歧的 בָּרוּר。
