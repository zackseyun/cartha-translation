base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/012.yaml
  text: Look[a], these will come from far away, and look, these from the north and from the sea[b], and these from the land of Sinim.
translation:
  language: zh_hans
  text: 看哪，这些人要从远方来；看哪，这些人从北方、从海[a]而来；这些人从西尼姆地[b]来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可译作“从西方来”，因为在希伯来语的地理表达中，“海”有时可指西方。
    reason: lexical_alternative
  - marker: b
    text: “西尼姆”是地点不明的地名。有人认为是埃及南部的塞耶尼（今阿斯旺），也有人认为是更遥远的东方地区，但无法确定。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 用现代中文仍可自然理解的提示语，保留原文引人注意和指示眼前景象的作用；两处均译出，以体现原文的重复。
- source_word: אֵלֶּה
  choice: 这些人
  rationale: 原词是复数指示代词；上下文所指为归来的人，因此补出“人”使中文自然，同时三次重复，保留原文逐组指点的结构。
- source_word: מֵרָחוֹק
  choice: 从远方
  rationale: 准确表达空间上的遥远，语言简洁、庄重而自然。
- source_word: יָבֹאוּ
  choice: 要……来
  rationale: 该未完成体在本段语境中具有将来意味；“要……来”既通顺，也保留预告性的语气。后两组按希伯来文的省略结构承接“来”。
- source_word: מִצָּפוֹן
  choice: 从北方
  rationale: 直接表达带介词的方位来源。
- source_word: וּמִיָּם
  choice: 从海而来
  rationale: 正文保留 יָם 的字面意义“海”，不直接将其确定为“西方”；希伯来语中可能具有西方方位含义，另在脚注说明。
- source_word: מֵאֶרֶץ
  choice: 从……地
  rationale: 以自然的中文地名结构表达来源地，同时保留“地／地域”的含义。
- source_word: סִינִים
  choice: 西尼姆
  rationale: 该地名的确切所指不明，故按希伯来语音译，不在正文中采用任何有争议的地理鉴定。
