base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/001.yaml
  text: 'Listen to me[a], coastlands, and pay attention, peoples from far away: Yahweh called me from the womb[b]; from my mother’s body he mentioned my name.'
translation:
  language: zh_hans
  text: 众海岛[a]啊，要听我！远方的万民啊，要留心听！耶和华从母腹中呼召了我；从我母亲腹中，他提到了我的名字。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海岛”也可译作“沿海地区”；这个希伯来词可泛指远方的海岛或沿海地带。
    reason: lexical_alternative
  - marker: b
    text: “提到了我的名字”也可理解为“按名叫我”或“指定了我”；原文用语可表示使一个名字被提说或被记起。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: 要听我
  rationale: 保留复数命令语气及“向我、听我”的直接召唤；现代汉语自然简洁。
- source_word: אִיִּים
  choice: 众海岛
  rationale: 该词可指海岛，也可泛指沿海及远方海域之地；正文采用《以赛亚书》中自然且有诗意的“众海岛”，并以脚注保留较宽泛的地理含义。
- source_word: וְהַקְשִׁיבוּ
  choice: 要留心听
  rationale: 使役式命令在此表达专心倾听；“留心听”与前句平行，又比单纯“听”更强。
- source_word: לְאֻמִּים מֵרָחוֹק
  choice: 远方的万民
  rationale: 将地理上的遥远与复数族群合并为自然汉语，避免把 לְאֻמִּים 仅限于现代政治国家。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名音译，而不以“主”这一称号替代专名。
- source_word: מִבֶּטֶן קְרָאָנִי
  choice: 从母腹中就呼召了我
  rationale: “母腹”准确表达 בטן 的孕育语境；“呼召”保留 קרא 既可表示叫唤、又可能含使命委任的张力，“就”体现起始时间。
- source_word: מִמְּעֵי אִמִּי
  choice: 我还在母亲腹中
  rationale: 原文直指“我母亲的内腹”；如此译法自然，并与前一分句形成诗意平行而不生硬重复“母腹”。
- source_word: הִזְכִּיר שְׁמִי
  choice: 他就提到了我的名字
  rationale: 较贴近使役式 זכר 的“使被提及／提说”含义，不把它无提示地收窄为正式命名或任命；脚注说明语境中可能包含按名指认或指定之意。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名而非称号。正文保留专名；“耶和华”是现代中文读者最熟悉且庄重的传统音译，但不据此断定古代精确读音。
- issue: 胎中呼召与提名的含义
  choice: 保留“呼召”与“提到我的名字”的措辞
  alternative: “选召／任命我，并给我起名”
  rationale: 上下文可带有使命指定意味，但本节词语本身并未明确使用“拣选”或“任命”；因此不把潜在的神学含义写死。
translation_notes:
  register: 采用现代、庄重而可朗读的先知诗歌语体。以两次“啊”突出对远方各族的公开呼告；分号维持后半节两行平行结构。所有脚注标记均置于正文对应位置。
