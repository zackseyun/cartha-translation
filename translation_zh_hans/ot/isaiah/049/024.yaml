id: ISA.49.24
reference: Isaiah 49:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/יֻקַּ֥ח מִ/גִּבּ֖וֹר מַלְק֑וֹחַ וְ/אִם שְׁבִ֥י צַדִּ֖יק יִמָּלֵֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/024.yaml
  text: Can plunder be taken from a mighty man[b][a], or can the captives of a righteous one be rescued?
translation:
  language: zh_hans
  text: 掠物[a]岂能从勇士手中被夺走？或是义人[b]掳去的人岂能获救？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“猎物”或“战利品”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“义人的俘虏”。这句话在上下文中较难理解；有人作不同解释，某些古代译本所反映的读法则更接近“暴君（或可怕之人）的俘虏”。
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֻקַּח
  choice: 岂能……被夺走
  rationale: 疑问词与לקח的被动未完成式构成反问；“岂能……被夺走”既保留被动语态和可能意味，也符合现代汉语表达。
- source_word: מִגִּבּוֹר
  choice: 从勇士手中
  rationale: גִּבּוֹר可指强者或勇士，常带战士色彩；“勇士”适合掠物语境，“手中”是汉语为表达来源关系所需的自然补足。
- source_word: מַלְקוֹחַ
  choice: 掠物
  rationale: 该词指被夺取的财物、战利品或猎物；“掠物”简洁地对应夺取所得，并与下句被掳的人形成平行。
- source_word: וְאִם
  choice: 或是……岂能
  rationale: 这里不是普通条件句，而是引出与前句平行的第二个反问；“或是……岂能”自然地保留其选择和递进关系。
- source_word: שְׁבִי
  choice: 掳去的人
  rationale: 该名词可指被掳者或被掳状态；上下文谈到获救的人，因此译作“掳去的人”最清楚。
- source_word: צַדִּיק
  choice: 义人
  rationale: 马所拉文本的通常词义是“公义的人、义人”。虽然在此处形容掳人者显得费解，正文仍按现存希伯来文本直译，不消除其张力。
- source_word: יִמָּלֵט
  choice: 获救
  rationale: מלט的尼法勒式可表示逃脱或被解救；“获救”保留被动意味，并与前半句的“被夺走”相称。
theological_decisions:
- issue: צַדִּיק在掳人者语境中的解释
  choice: 正文保留马所拉文本的通常含义“义人”
  alternative: 按语境理解为“暴君”等，或采用某些古译本所反映、接近“可怕之人／强暴者”的异文
  rationale: 现存希伯来文本明确读作צַדִּיק。尽管这在语境中形成解释或文本上的困难，翻译不应暗中改写，而应在正文保留张力，并用脚注说明其他理解。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。两个平行反问均保留“岂能”，凸显修辞力度；正文不将צַדִּיק按语境改成负面称谓，以保存原文的真实难点。
