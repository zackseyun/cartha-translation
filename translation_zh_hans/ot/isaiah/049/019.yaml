base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/019.yaml
  text: For your ruins[a], your desolate places, and your devastated land—surely now you will be too cramped for inhabitants[b], and those who swallowed you up will be far away.
translation:
  language: zh_hans
  text: 因为你的废墟、荒凉之处和遭毁坏的土地——如今必会容不下居民[a]；吞噬你的人[b]必远去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如今你必因居民而显得狭窄。”希伯来原文的表达十分紧凑。
    reason: lexical_alternative
  - marker: b
    text: 也可表达为“吞灭你的人”。希伯来原文保留了“吞下、吞噬”的生动意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרְבֹתַיִךְ
  choice: 你的废墟
  rationale: חָרְבָּה 指荒废、毁坏之处；“废墟”自然简洁，并与后面的“荒凉之处”形成平行而不完全重复。
- source_word: שֹׁמְמֹתַיִךְ
  choice: 荒凉之处
  rationale: 源自动词 שׁמם，表达荒芜、无人居住的状态；“荒凉之处”保留其状态性含义。
- source_word: אֶרֶץ הֲרִסֻתֵיךְ
  choice: 遭毁坏的土地
  rationale: 该短语指因破坏而成为废土的土地；“遭毁坏的土地”保留结果和被动意味，也符合现代汉语。
- source_word: כִּי
  choice: 因为
  rationale: 句首 כִּי 为上文复兴应许提供根据，译作“因为”能清楚体现其因果衔接功能。
- source_word: כִּי עַתָּה
  choice: 如今必
  rationale: 第二个 כִּי 在此具有强调作用；“如今必”既表达转折后的当前局面，也传达肯定语气。
- source_word: תֵּצְרִי מִיּוֹשֵׁב
  choice: 必容不下居民
  rationale: 原文紧凑地表达地方因居住者而变得狭窄；“容不下居民”以自然汉语传达空间不足，同时通过脚注保留较形式对应的译法。
- source_word: וְרָחֲקוּ
  choice: 必远离你
  rationale: 完成式处于预言性救恩语境中，指向将要实现的结果；“必远离你”表达未来和确定性。
- source_word: מְבַלְּעָיִךְ
  choice: 吞噬你的人
  rationale: 保留 בלע“吞下、吞噬”的鲜明比喻，不将其弱化为一般性的“毁灭你的人”。
theological_decisions:
- issue: 末句完成式的时间指向
  choice: 按预言语境译为将来而确定的结果：“必远离你”
  alternative: 译为已经完成的过去或现在完成状态：“已经远离你”
  rationale: 本节处于锡安复兴的应许中，末句与前面的将来情景相配；用“必”既反映预言指向，也不把希伯来语完成式机械处理为过去时。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“废墟—荒凉之处—遭毁坏的土地”保留原文三重平行；破折号体现从昔日荒废到居民增多的强烈反转。“你”延续原文对锡安的阴性单数称呼，但不在正文中额外释明。
