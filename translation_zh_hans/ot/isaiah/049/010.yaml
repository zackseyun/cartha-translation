  text: לֹ֤א יִרְעָ֨בוּ֙ וְ/לֹ֣א יִצְמָ֔אוּ וְ/לֹא יַכֵּ֥/ם שָׁרָ֖ב וָ/שָׁ֑מֶשׁ כִּי מְרַחֲמָ֣/ם יְנַהֲגֵ֔/ם וְ/עַל מַבּ֥וּעֵי מַ֖יִם יְנַהֲלֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/010.yaml
  text: They will not hunger or thirst[a], nor will scorching heat or sun strike them; for the one who has compassion on them will lead them[b], and he will guide them to springs of water.
translation:
  language: zh_hans
  text: 他们必不饥饿，也不干渴[a]；灼热和太阳必不伤害他们。因为怜悯他们的那一位必引领他们，并带他们到水泉边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“干热和太阳必不伤害他们。”
    reason: lexical_alternative
  - marker: b
    text: “到水泉边”也可译作“到水泉那里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעָבוּ / יִצְמָאוּ
  choice: 饿 / 渴
  rationale: 两个Qal未完成式在应许语境中表示将来的状态；用简洁的“不饿也不渴”保留诗歌式对偶，符合现代汉语。
- source_word: יַכֵּם
  choice: 伤害他们
  rationale: נכה的Hiphil基本义为击打；主语是炎热和太阳时，汉语用“伤害”比直译“击打”自然，同时保留有害侵袭之意。
- source_word: שָׁרָב
  choice: 炎热
  rationale: 指灼人、干燥的酷热；“炎热”庄重自然，并与“太阳”并列顺畅。
- source_word: מְרַחֲמָם
  choice: 怜悯他们的那一位
  rationale: 保留带三复阳后缀的分词性描述，不在正文中直接补出“神”，从而保存原文的指称方式。
- source_word: יְנַהֲגֵם
  choice: 必引领他们
  rationale: נָהַג的Piel在此表示带领；“引领”符合牧养和复兴语境，也有庄重感。
- source_word: מַבּוּעֵי מַיִם
  choice: 水泉
  rationale: מַבּוּעַ是涌流的泉源；“水泉”具体而简洁，保留旷野中水源的意象。
- source_word: יְנַהֲלֵם
  choice: 带他们
  rationale: נהל的Piel有温和引导、带领之意；为避免与前句“引领”机械重复，译作“带他们”。
- source_word: וְעַל
  choice: 到……旁
  rationale: עַל可表达在旁、临近，也可在移动语境中指向某处；“到水泉旁”同时呈现移动目标和临水位置。
theological_decisions:
- issue: 怜悯者与引导者的身份
  choice: 以“怜悯他们的那一位”作描述，不在正文补出“神”
  alternative: 直接译作“怜悯他们的神”
  rationale: 上下文很可能指神，但希伯来文本本节用分词描述而未明说神的名号；保留这种表达可避免解释性增补。
- issue: עַל与水泉的空间关系
  choice: 到水泉旁
  alternative: 到水泉那里 / 在水泉旁
  rationale: 动词表示引导，介词既可突出方向，也可突出临近位置；正文采用兼顾二者的自然汉语，并以脚注保存另一种表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留希伯来诗歌的两组对偶；不使用过度古雅的“饥渴”“击打”等措辞，也不把神的身份解释性地加入正文。
