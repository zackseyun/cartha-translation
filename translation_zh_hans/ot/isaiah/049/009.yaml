  text: לֵ/אמֹ֤ר לַֽ/אֲסוּרִים֙ צֵ֔אוּ לַ/אֲשֶׁ֥ר בַּ/חֹ֖שֶׁךְ הִגָּל֑וּ עַל דְּרָכִ֣ים יִרְע֔וּ וּ/בְ/כָל שְׁפָיִ֖ים מַרְעִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/009.yaml
  text: saying to the prisoners[a], “Come out,” to those in darkness, “Show yourselves.” They will graze along the roads[b], and on all the bare heights will be their pasture.
translation:
  language: zh_hans
  text: '对被囚的人说：“出来吧！”


    对黑暗中的人说：“显现吧！”[a]


    他们必沿路觅食，


    一切光秃的高地都必成为他们的草场。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显现吧”或译“显露出来吧”“出现吧”。
    reason: lexical_alternative
  - marker: b
    text: “光秃的高地”指无遮蔽、少树木的山冈或高处；也可译“光秃的山冈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: 说
  rationale: 不定式承接上文并引出使命的内容；现代汉语用“说”自然简洁，同时保留与前文的连接。
- source_word: לַאֲסוּרִים
  choice: 对被囚的人
  rationale: 源于“捆绑、囚禁”的被动分词；“被囚的人”既保留受束缚的状态，也不限定为战俘或某一特定历史群体。
- source_word: צֵאוּ
  choice: 出来吧
  rationale: 复数祈使式，直接发出释放的召唤；“出来吧”符合中文引语语境。
- source_word: לַאֲשֶׁר בַּחֹשֶׁךְ
  choice: 对黑暗中的人
  rationale: 保留“黑暗”既可指实际处境、也可带有比喻意义的开放性。
- source_word: הִגָּלוּ
  choice: 显露出来吧
  rationale: Niphal复数祈使式表达变得可见、显现；“显露出来”保留中间态或被动态色彩，不强行解释为主动展示自己。
- source_word: עַל דְּרָכִים
  choice: 沿路
  rationale: 此处介词短语描述牧放所在之处；“沿路”自然表达在道路沿线觅食的分布性。
- source_word: יִרְעוּ
  choice: 他们必……牧放
  rationale: רעה在此使用牧养、吃草的图景；“牧放”保留牧群意象，并可让被释放者作为群体处于牧养之中。
- source_word: שְׁפָיִם
  choice: 光秃的高地
  rationale: 指无树木、无遮蔽或裸露的高处；避免译作“丘坛”等可能引入祭祀含义的词。
- source_word: מַרְעִיתָם
  choice: 他们的草场
  rationale: 该名词指牧场或放牧之地，带第三人称复数所有格；“草场”简洁自然，并保留集合意义。
theological_decisions:
- issue: 囚禁与黑暗是历史性还是属灵性的意象
  choice: 保留“被囚的人”和“黑暗中的人”的具体意象，不说明其专指被掳者、属灵受缚者，或兼指两者。
  alternative: 明确译成从被掳之地归回的人，或明确解释为属灵释放。
  rationale: 原文的复兴和释放图景能够涵盖历史处境及更广的拯救意义；译文不应消解这种张力。
- issue: יִרְעוּ的主语意象
  choice: 译为“他们必沿路牧放”，保留被释放之民如羊群得喂养的隐喻。
  alternative: 译为“他们必沿路吃草”或“他们必沿路得到喂养”。
  rationale: 直译“吃草”用于人群略显突兀，而“得到喂养”又增加被动解释；“牧放”较自然地维持诗歌中的牧养图景。
translation_notes:
  register: 采用现代、庄重且适于朗读的诗体中文。两句直接引语保持平行结构；后两行保留牧养和地貌意象。所有脚注标记均置于相应正文之后。
