  text: כֹּ֣ה אָֽמַר יְהוָה֩ גֹּאֵ֨ל יִשְׂרָאֵ֜ל קְדוֹשׁ֗/וֹ לִ/בְזֹה נֶ֜פֶשׁ לִ/מְתָ֤עֵֽב גּוֹי֙ לְ/עֶ֣בֶד מֹשְׁלִ֔ים מְלָכִים֙ יִרְא֣וּ וָ/קָ֔מוּ שָׂרִ֖ים וְ/יִֽשְׁתַּחֲוּ֑וּ לְמַ֤עַן יְהוָה֙ אֲשֶׁ֣ר נֶאֱמָ֔ן קְדֹ֥שׁ יִשְׂרָאֵ֖ל וַ/יִּבְחָרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/007.yaml
  text: 'Thus says Yahweh[a], the Redeemer of Israel, his Holy One, to one despised in soul, abhorred by the nation, a servant of rulers: Kings will see and rise up, princes also, and they will bow down, because of Yahweh, who is faithful, the Holy One of Israel[d][c][b], who has chosen you.'
translation:
  language: zh_hans
  text: '雅威[a]——以色列的救赎主、以色列的圣者——对那被人藐视[b]、被那国憎恶[c]、作统治者奴仆[d]的人说：


    “君王必看见，就必起立；


    首领也必下拜[e]。


    这都是因着雅威，


    就是那信实的、以色列的圣者；


    他拣选了你。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝之名 יהוה 的音译；传统译本常译作“耶和华”或以“主”代替。
    reason: divine_name
  - marker: b
    text: 此处希伯来语表达十分简缩，也可理解为“深受藐视”或“为人所藐视”。
    reason: lexical_alternative
  - marker: c
    text: “那国”原文为单数；也可按集合意义译作“列国”，或译作“为那国所憎恶的”。
    reason: lexical_alternative
  - marker: d
    text: “奴仆”也可译作“仆人”；这里的上下文着重表现他受辖制、遭羞辱的处境。
    reason: lexical_alternative
  - marker: e
    text: 原文没有明说首领向谁下拜。上下文可理解为他们因雅威而对这位先前受藐视者表示尊荣，但经文本身没有明确该动作的对象，也不宜据此断定其为对谁的敬拜。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的常见现代汉语音译，以保留专名性质，不以“主”这一称号替代。
- source_word: גֹּאֵל יִשְׂרָאֵל
  choice: 以色列的救赎主
  rationale: “救赎主”兼顾拯救与亲属赎回的盟约背景，又不把此处未明说的家族法细节写入正文。
- source_word: קְדוֹשׁוֹ
  choice: 他的圣者
  rationale: 保留第三人称单数后缀；在当前句法中，“他”最自然回指紧邻的“以色列”，但译文不把代词展开为解释性称号。
- source_word: לִבְזֹה נֶפֶשׁ
  choice: 对那被人藐视的
  rationale: 原文是高度压缩且解释有争议的表达；正文采用自然汉语表达受藐视的处境，并以脚注保留“深受藐视”等可能性。
- source_word: לִמְתָעֵב גּוֹי
  choice: 为国民所憎恶
  rationale: 保留 גּוֹי 的单数集合意义以及受憎恶的被动处境；“国民”比“民族”更适合此处作为施事群体。
- source_word: לְעֶבֶד מֹשְׁלִים
  choice: 作统治者奴仆的
  rationale: “奴仆”体现 עֶבֶד 在此屈辱、受辖制语境中的力度，同时比现代单用“奴隶”更符合经文的庄重语体。
- source_word: מְלָכִים יִרְאוּ וָקָמוּ
  choice: 君王看见了，就必起立
  rationale: 保留“看见”未明说的宾语，并以“起立”传达君王以动作表示敬意。
- source_word: שָׂרִים וְיִשְׁתַּחֲווּ
  choice: 首领也必俯伏
  rationale: “首领”可涵盖王公和高级官长；“俯伏”保留敬礼动作，又不预先判定其是否属于敬拜。
- source_word: לְמַעַן יְהוָה
  choice: 这是因着雅威
  rationale: 表达该敬意行为的根本原因，同时不补出原文未明说的俯伏对象。
- source_word: אֲשֶׁר נֶאֱמָן
  choice: 他是信实的
  rationale: נֶאֱמָן 表示可靠、可信守；“信实”符合以赛亚书的庄重神学语域。
- source_word: וַיִּבְחָרֶךָּ
  choice: 也是拣选你的那一位
  rationale: 把该分句与前面的雅威称号连贯起来，并明确第二人称单数宾语，而不另行指定其身份。
theological_decisions:
- issue: קְדוֹשׁוֹ（“他的圣者”）的所指
  choice: 保留代词形式；按句法最自然地让“他”回指以色列，即雅威是以色列的圣者。
  alternative: 将其理解为被称作“他的圣者”的仆人，或直接改写成“以色列的圣者”。
  rationale: 该词位于“以色列的救赎主”之后、受话者之前，第三人称后缀最自然回指“以色列”，也与本节后半明确的“以色列的圣者”相呼应。正文仍保留“他的”而不完全展开，以尊重原文形式。
- issue: 首领俯伏的对象
  choice: 不在正文补出对象，只说“首领也必俯伏”。
  alternative: 明确译作“向你俯伏”或“向雅威俯伏”。
  rationale: 希伯来文没有明说俯伏的对象；上下文把仆人的升高与“因着雅威”并置。保留省略可避免把致敬对象或其神学性质提前定死。
- issue: עֶבֶד 的社会身份力度
  choice: 译为“奴仆”，突出受统治者辖制与屈辱的身份。
  alternative: 译为较温和的“仆人”。
  rationale: 本节连续使用“藐视”“憎恶”等贬抑语汇，“奴仆”更能反映这一语境；但脚注保留“仆人”这一词义范围。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。破折号标出雅威的同位称号，诗行保持宣告与转折的节奏。正文尽量保留原文的代词、省略和神学张力；难以在自然汉语中完全呈现的压缩表达置于脚注。
