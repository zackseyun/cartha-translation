base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/016.yaml
  text: Look[a], I have engraved you on the palms of my hands; your walls are continually before me.
translation:
  language: zh_hans
  text: 看哪，我已将你铭刻在我双手的掌心上[a]；你的城墙常在我面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已将你刻写在我双手的掌心上。”原文动词指刻写或雕刻，突出了持久不灭的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强语气的感叹词。“看哪”庄重而清楚，保留原文的强调作用。
- source_word: עַל כַּפַּיִם
  choice: 在我的掌上
  rationale: כַּפַּיִם 是双数，指双手的掌面；汉语用“我的掌上”能自然保留具体的身体意象，而不必生硬地说“两个手掌上”。
- source_word: חַקֹּתִיךְ
  choice: 我已把你刻
  rationale: 该动词表示雕刻、刻写；完成式在此呈现已经完成、具有持续意义的行动。“刻”简洁地传达铭刻及其持久性。阴性单数宾语后缀按原文保留为“你”。
- source_word: חוֹמֹתַיִךְ
  choice: 你的城墙
  rationale: חוֹמֹת 指城的墙垣；译作“城墙”比单独的“墙”更能自然呈现锡安/耶路撒冷的城市语境，同时未在正文中直接补出城名。
- source_word: נֶגְדִּי
  choice: 在我面前
  rationale: 该表达指处于说话者眼前或关注之中。“在我面前”符合现代汉语，也保留原文的空间意象。
- source_word: תָּמִיד
  choice: 常
  rationale: 表示持续、恒常。“常在我面前”自然、凝练，并保持庄重语体。
theological_decisions:
- issue: 上帝的手掌与铭刻这一拟人化比喻
  choice: 直接保留“我已把你刻在我的掌上”
  alternative: 意译为“我永远不会忘记你”等解释性表达
  rationale: 原文用鲜明的身体意象表达上帝对锡安恒久的记念与眷顾。直接保留比喻，避免把形象缩减为单一解释。
- issue: 阴性单数后缀所指对象
  choice: 正文使用“你／你的”，由上下文确认其为锡安或耶路撒冷
  alternative: 在本节直接补明“锡安”或“耶路撒冷”
  rationale: 原文在本节以阴性单数第二人称直接称呼对象，并未重复其名称；保留代词既忠于形式，也不消除上下文关系。
- issue: “城墙”在被毁背景中的张力
  choice: 保留“你的城墙常在我面前”，不解释为现存城墙、重建蓝图或单纯记忆
  alternative: 增译为“你将来重建的城墙”或“你城墙的废墟”
  rationale: 原文让“城墙”持续在上帝面前，其具体指向带有诗性张力；译文不应擅自限定为某一种时间或神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“看哪”保留先知性话语的强调；“掌上”保持诗歌的凝练；分号对应两幅彼此关联的意象。脚注标记已置于相关短语之后。
