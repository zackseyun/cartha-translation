id: ISA.49.4
reference: Isaiah 49:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנִ֤י אָמַ֨רְתִּי֙ לְ/רִ֣יק יָגַ֔עְתִּי לְ/תֹ֥הוּ וְ/הֶ֖בֶל כֹּחִ֣/י כִלֵּ֑יתִי אָכֵן֙ מִשְׁפָּטִ֣/י אֶת יְהוָ֔ה וּ/פְעֻלָּתִ֖/י אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/004.yaml
  text: But I said[a], “I have labored in vain; I have spent my strength for emptiness and vanity. Yet surely my justice is with Yahweh[b], and my reward is with my God.”
translation:
  language: zh_hans
  text: 可是我说：“我劳碌却徒然，耗尽力气却只换来虚无和空幻。然而，我的公道[a]确实在雅威那里，我的报偿[b]在我的上帝那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的公道”或译“我的案件”或“为我伸冤之事”。
    reason: lexical_alternative
  - marker: b
    text: “我的报偿”或译“我的酬劳”或“我的工价”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרִיק
  choice: 却徒然
  rationale: רִיק表示空无、没有成果；“徒然”自然地表达劳作未见成效，并与下句形成呼应。
- source_word: יָגַעְתִּי
  choice: 我劳碌
  rationale: יגע含辛劳乃至疲乏之意；“劳碌”既保留付出心力的意味，也符合庄重的现代汉语。
- source_word: לְתֹהוּ וְהֶבֶל
  choice: 却只换来虚无和空幻
  rationale: תֹהוּ可指虚无、荒空，הֶבֶל本指气息、雾气，引申为短暂无实或徒劳；分别译作“虚无”和“空幻”，保留两个近义词的并列而不将其合并。
- source_word: כֹּחִי כִלֵּיתִי
  choice: 耗尽力气
  rationale: כלה的加强词干在此表示用尽、消耗；“耗尽力气”准确传达力量已全部付出的语气。
- source_word: אָכֵן
  choice: 然而……确实
  rationale: אָכֵן兼有转折与确认语气；“然而”承接前面的失望，“确实”表达后面的信赖。
- source_word: מִשְׁפָּטִי
  choice: 我的公道
  rationale: מִשְׁפָּט可指审判、案件、正当权益或申雪；“公道”保留正义和获得公正裁断的宽广含义，不预先限定为案件或已经实现的申雪。
- source_word: אֶת יְהוָה
  choice: 在雅威那里
  rationale: 此处אֶת表示与……同在、由……掌管；“在雅威那里”保留托付和掌管的意思，并以“雅威”音译神名יהוה。
- source_word: וּפְעֻלָּתִי
  choice: 我的报偿
  rationale: פְעֻלָּה可指工作、工价或所得报偿；本句与劳碌及מִשְׁפָּטִי平行，“报偿”最能表达劳作应得的结果，同时以脚注保留其他可能。
- source_word: אֶת אֱלֹהָי
  choice: 在我的上帝那里
  rationale: 与前一分句平行，表示报偿由上帝掌管；不添加“来自”等原文未明说的方向含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通行的学术重构读音，并保留其作为专名的性质。
- issue: 仆人所说מִשְׁפָּטִי的含义
  choice: 我的公道
  alternative: 我的案件；为我伸冤之事；我的裁断
  rationale: 本句表达说话者把自己的正当权益和裁断交托给上帝。“公道”不把含义缩窄为纯粹法律案件，也不暗示申雪已经完成，从而保留原文的神学张力。
- issue: פְעֻלָּתִי所指
  choice: 我的报偿
  alternative: 我的酬劳；我的工价；我的工作
  rationale: 上下文聚焦看似徒劳的服事及其应有结果，因此“报偿”最符合平行关系；但原词也可指工价或工作，故在脚注中保留。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“却只换来”使两个目的短语在汉语中顺畅连接，同时保留说话者感到劳作毫无成果的语气；后半句借“然而……确实”清楚呈现由哀叹转向信赖的转折。所有脚注标记均置于所解释的词语之后。
