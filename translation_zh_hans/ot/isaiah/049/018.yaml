base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/018.yaml
  text: 'Lift up your eyes all around and see: they all gather together; they come to you. As I live[a], declares Yahweh, you will surely put them all on like an ornament and bind them on like a bride.'
translation:
  language: zh_hans
  text: 你举目环顾，看看吧！他们全都聚集起来，到你这里来了。雅威[a]宣告：“我指着我的生命起誓：你必把他们全都当作饰物佩戴，像新娘一样把他们系在身上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译。
    reason: 帮助普通读者识别此处不是称号，而是经文中的神名。
lexical_decisions:
- source_word: שְׂאִי סָבִיב עֵינַיִךְ וּרְאִי
  choice: 你举目环顾，看看吧
  rationale: 两个阴性单数命令式是对人格化的锡安说的；“举目环顾”自然表达向四周抬眼观看，“看看吧”保留第二个命令的呼召语气。
- source_word: כֻּלָּם נִקְבְּצוּ בָאוּ לָךְ
  choice: 他们全都聚集起来，到你这里来了
  rationale: 完成式描绘眼前已经成就的聚集与来到；现代汉语用“来了”既自然，也保留先知异象的鲜明感。
- source_word: חַי אָנִי
  choice: 我凭我的永生起誓
  rationale: 这是常见的神圣起誓公式；相比逐字译为“我活着”，此译法在现代汉语中清楚传达誓言功能，同时保留以神自己的生命为凭据的含义。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: נְאֻם是庄重的先知宣告公式；“宣告”贴合其语用。יְהוָה作为专名译作“雅威”，而非以称号替代。
- source_word: כִּי כֻלָּם כָּעֲדִי תִלְבָּשִׁי
  choice: 你必把他们全都当作饰物佩戴
  rationale: כִּי在誓言后引出并加强誓言内容，汉语以“必”表达确定性；עֲדִי是饰物或装饰，“佩戴”既符合תִלְבָּשִׁי的穿戴意象，也适合汉语搭配。
- source_word: וּתְקַשְּׁרִים כַּכַּלָּה
  choice: 像新娘一样把他们系在身上
  rationale: 保留把归来者如新娘饰物般系在身上的鲜明比喻，不将其解释性改写为抽象的荣耀或喜乐。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”较接近YHWH通常重构的读音，并保留其作为以色列之神专名的性质，不以称号“主”取代。
- issue: 将归来者“佩戴”并“系在身上”的比喻
  choice: 保留拟人化锡安把众人当作新娘饰物佩戴的具体意象
  alternative: 解释为他们将成为锡安的荣耀或装饰
  rationale: 原文有意把人群与新娘饰物并置。直保留这一张力，可避免把诗歌意象过早化约为单一神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。对人格化的锡安使用隐含的女性形象，但汉语不强加性别代词；保留“佩戴他们、把他们系在身上”的诗性张力。
