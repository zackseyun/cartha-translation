base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/014.yaml
  text: But Zion said, “The LORD has forsaken me; my Lord has forgotten me.”
translation:
  language: zh_hans
  text: 但锡安说：“耶和华离弃了我；我的主忘记了我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经与普通读者熟悉的地名译法；这里以锡安拟人化，指向其中的群体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 将神的专名与下半句的称谓“我的主”区分开来。
- source_word: עֲזָבַנִי
  choice: 离弃了我
  rationale: 准确表达 עזב 在此处被遗弃、撇下的强烈哀诉语气。
- source_word: וַאדֹנָי
  choice: 我的主
  rationale: 希伯来文本带第一人称单数后缀，保留“我的”；同时用“主”与专名“耶和华”相区别。
- source_word: שְׁכֵחָנִי
  choice: 忘记了我
  rationale: 直译其认知与关系层面的哀诉，不弱化为仅仅“忽略”。
theological_decisions:
- issue: 锡安关于神离弃、忘记她的陈述是否作为客观事实呈现
  choice: 保留为锡安直接说出的哀诉
  alternative: 加入“仿佛”或“以为”等解释性措辞
  rationale: 原文把这话明确归于锡安，却未在本节内部加入缓和词；译文保留其情感与神学张力，不预先用后文回应来改写本句。
- issue: יהוה 与 אֲדֹנָי 的区分
  choice: 分别译作“耶和华”和“我的主”
  alternative: 两者均译作“主”或省略所有格
  rationale: 原文先用神的专名，后用带第一人称后缀的主名称谓；区分二者可保留平行句中的词汇变化和个人关系色彩。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“但”承接前文形成转折；保留简洁、对称的诗句结构与锡安强烈的第一人称哀诉。
