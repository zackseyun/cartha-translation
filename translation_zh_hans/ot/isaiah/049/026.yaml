id: ISA.49.26
reference: Isaiah 49:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַאֲכַלְתִּ֤י אֶת מוֹנַ֨יִ/ךְ֙ אֶת בְּשָׂרָ֔/ם וְ/כֶ/עָסִ֖יס דָּמָ֣/ם יִשְׁכָּר֑וּ/ן וְ/יָדְע֣וּ כָל בָּשָׂ֗ר כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/026.yaml
  text: I will make those who oppress you eat their own flesh[a], and they will become drunk with their own blood as with sweet wine. Then all flesh will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
translation:
  language: zh_hans
  text: 我要使那些欺压你的人吃自己的肉；他们必因自己的血醉得如同喝了甜酒。[a] 凡有血肉的都必知道：我耶和华是你的救主、你的救赎主，是雅各的大能者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “甜酒”也可译作“新酒”。希伯来语 עָסִיס 指甘甜的酒、新酿的酒，也可指鲜榨的果汁。
    reason: 保留该希伯来词在甜酒、新酒与鲜汁之间的词义幅度。
lexical_decisions:
- source_word: וְהַאֲכַלְתִּי
  choice: 我要使……吃
  rationale: 采用使役表达，准确体现希伯来语使役词干“使某人吃”的语义。
- source_word: מוֹנַיִךְ
  choice: 那些欺压你的人
  rationale: 该词指虐待、压迫锡安的人；此译自然清楚，并符合审判语境。
- source_word: בְּשָׂרָם
  choice: 自己的肉
  rationale: 物主后缀在上下文中具有反身意味；“自己的”明确保留敌人自相毁灭的骇人意象。
- source_word: וְכֶעָסִיס
  choice: 像喝甜酒一样
  rationale: עָסִיס可指甜酒、新酒或鲜榨汁；在醉酒语境中，“甜酒”自然且能表达可致醉的饮品，同时以脚注保留词义幅度。
- source_word: דָּמָם
  choice: 自己的血
  rationale: 明确物主和反身关系，并与“自己的肉”形成平行。
- source_word: יִשְׁכָּרוּן
  choice: 醉得
  rationale: 该动词表示喝醉或变得醉；此处结合比较结构译为“醉得像……一样”，简洁而有力度。
- source_word: כָל בָּשָׂר
  choice: 凡有血肉的
  rationale: 保留“肉身/血肉”这一先知文学惯用语及其普世范围，同时比生硬的“所有肉体”更符合现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式呈现四字神名，不用称号替代。
- source_word: מוֹשִׁיעֵךְ
  choice: 拯救你的
  rationale: 分词表达身份和持续职分；与后面的并列结构相配，译为“是拯救你的”自然且忠实。
- source_word: וְגֹאֲלֵךְ
  choice: 救赎你的
  rationale: 保留גאל在以赛亚书中的核心救赎含义，又避免把亲属救赎制度过度明说。
- source_word: אֲבִיר יַעֲקֹב
  choice: 雅各的大能者
  rationale: 忠实保留“雅各”而非改作“以色列”；“大能者”准确表达力量与威能的称号。
theological_decisions:
- issue: 是否淡化吃肉、喝血的暴烈审判意象
  choice: 直接保留吃自己的肉、喝自己的血的意象
  alternative: 概括为压迫者自相残害或自取灭亡
  rationale: 原文刻意采用震撼性的审判图像，表现压迫的逆转；概括会削弱先知修辞。
- issue: כָל בָּשָׂר的表达
  choice: 凡有血肉的
  alternative: 所有人；全人类
  rationale: 此译既让现代读者可懂，也保留希伯来语“凡有血肉者”的先知性措辞和经文互文意味。
- issue: 救主与救赎者的身份表述
  choice: 采用“我耶和华是拯救你的，是救赎你的”
  alternative: 采用名词称号“你的救主、你的救赎主”
  rationale: 中文动词结构更自然，并忠实反映原文分词所表达的施行拯救与救赎者身份，不额外限定其制度性内涵。
translation_notes:
  register: 采用庄重、鲜明而易懂的现代标准汉语。保留先知诗歌的平行结构和强烈审判意象；用“凡有血肉的”维持经文语体，用分句和分号改善朗读节奏。
