revisions:
- from: 我要使那些欺压你的人吃自己的肉；他们必喝自己的血，醉得像喝甜酒一样。[a] 凡有血肉的都必知道：我耶和华是拯救你的，是救赎你的，是雅各的大能者。
  to: 我要使那些欺压你的人吃自己的肉；他们必因自己的血醉得如同喝了甜酒。[a] 凡有血肉的都必知道：我耶和华是你的救主、你的救赎主，是雅各的大能者。
  rationale: 修订仅调整血与甜酒的比较关系，使之对应原文“他们必因自己的血醉，如同因甜酒醉”，并将末句两个并列分词以汉语称号结构表达，增强自然性且不改变其身份／持续职分含义。其余强烈的审判意象、神名、普世性措辞及“雅各”的原文称谓均予保留。
