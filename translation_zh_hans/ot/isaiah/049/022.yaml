  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה אֶשָּׂ֤א אֶל גּוֹיִם֙ יָדִ֔/י וְ/אֶל עַמִּ֖ים אָרִ֣ים נִסִּ֑/י וְ/הֵבִ֤יאוּ בָנַ֨יִ/ךְ֙ בְּ/חֹ֔צֶן וּ/בְנֹתַ֖יִ/ךְ עַל כָּתֵ֥ף תִּנָּשֶֽׂאנָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/022.yaml
  text: 'Thus says the Lord GOD: Behold[a], I will lift up my hand to the nations, and raise my banner to the peoples; and they will bring your sons in their bosom[b], and your daughters will be carried on the shoulder.'
translation:
  language: zh_hans
  text: '主耶和华如此说：


    “看哪，我要向列国举手，


    向万民竖起我的旗帜[a]；


    他们必把你的儿子抱在怀中[b]带来，


    你的女儿也必被背在肩上。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旗帜”也可译作“信号”或“旌旗”；原词指竖起供人看见、用来召集或示意的标志。
    reason: lexical_alternative
  - marker: b
    text: 字面可指“在胸前的衣襟中”，也可译作“在怀中”；意思是让孩子贴近身体被带来。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号，并在现代中文中直接呈现专名“耶和华”；“主耶和华”庄重、清楚，也避免把两个成分合并为同一称谓。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意、加强语气的感叹词；“看哪”虽具庄重色彩，现代读者仍能理解。
- source_word: אֶשָּׂא ... יָדִי
  choice: 我要向列国举手
  rationale: 保存原文“举手”的具体意象及介词方向；此动作在上下文中可表达召唤或示意，但正文不把其含义解释得过窄。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 表示众国或各民族国家，不采用可能带有后期宗教技术含义的“外邦人”。
- source_word: עַמִּים
  choice: 万民
  rationale: 与“列国”形成自然的平行变化，同时不夸大 גּוֹיִם 与 עַמִּים 之间的语义差别。
- source_word: אָרִים נִסִּי
  choice: 竖起我的旗帜
  rationale: נֵס 可指旗帜、旌旗或公开的信号标志；“旗帜”自然保留召集众人的可见标志这一意象，其他可能译法列于脚注。
- source_word: וְהֵבִיאוּ בָנַיִךְ
  choice: 他们必把你的儿子……带来
  rationale: 保留复数主语和预言性将来语气；“儿子”与下句“女儿”对应，反映原文明确的性别配对。
- source_word: בְּחֹצֶן
  choice: 抱在怀中
  rationale: חֹצֶן 可指胸怀、衣襟形成的兜或贴身承载之处；此译既保留贴近身体携带的画面，也符合现代汉语表达。
- source_word: עַל כָּתֵף תִּנָּשֶׂאנָה
  choice: 你的女儿也必被扛在肩上
  rationale: 保留尼法勒式的被动语态以及“肩上”的具体位置；“扛”明确表达承载，但不额外规定具体姿势。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文明确使用四字神名。正文采用中文圣经传统中广为人知的“耶和华”，既与前面的 אֲדֹנָי（主）有别，也不把神名泛化为称号；同时不借此引入任何宗派性解释。
- issue: 举手与旗帜动作的具体功能
  choice: 保留动作意象，不在正文限定为召唤、命令或起誓
  alternative: 我要向列国挥手召唤；我要向万民发出信号
  rationale: 上下文强烈暗示这是面向列国、召集他们送回儿女的公开示意，但原文只明说举手和竖起 נֵס。保留意象可避免消除其可能兼有的召唤、号令和信号意味。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。以诗行呈现希伯来文的平行结构；使用“看哪”“列国”“万民”保持经文气势，但避免过度古雅。脚注标记[a]、[b]均已置于正文相应词语之后。
