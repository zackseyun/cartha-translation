  to: '主耶和华如此说：


    “看哪，我要向列国举手，


    向万民竖起我的旗帜[a]；


    他们必把你的儿子抱在怀中[b]带来，


    你的女儿也必被背在肩上。”'
  rationale: 仅作两项安全的语言与词义澄清：以“背在肩上”替代“扛在肩上”，使中文更合乎携带孩子的自然表达；并精确化[b]脚注对חֹצֶן（胸前／衣襟褶兜）的说明。其余措辞保留，以维持原有的忠实性、诗行结构和庄重先知语体。
