  yaml_path: translation/ot/isaiah/049/011.yaml
  text: And I will make all my mountains into a road[b][a], and my highways will be raised up.
translation:
  language: zh_hans
  text: 我要使我所有的山都成为道路[a]；我的大道[b]必被抬高。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用作道路”或“作为通路”。希伯来语既可侧重结果（使山成为道路），也可侧重用途（使山用作道路）。
    reason: lexical_alternative
  - marker: b
    text: “大道”也可译为“道路”。该希伯来词可指修筑或垫高的道路。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: 我要使
  rationale: שׂים可表示“放置、设立、使成为”；结合לַדָּרֶךְ，此处译为“使……成为”自然地表达地形变为道路的结果。句首的连接词不必机械译出，以符合现代汉语诗歌语流。
- source_word: כָל הָרַי
  choice: 我的众山
  rationale: כָל与复数名词连用表示整体范围；“众山”既保留“所有”的含义，也比“我所有的山”更凝练庄重。第一人称后缀直译为“我的”。
- source_word: לַדָּרֶךְ
  choice: 成为道路
  rationale: דֶּרֶךְ可指道路、路径；介词לְ在שׂים之后可表达结果或用途。正文采用结果义“成为道路”，同时以脚注保留“用作道路”的目的义可能。
- source_word: וּמְסִלֹּתַי
  choice: 我的大道
  rationale: מְסִלָּה常指修筑、垫高的道路或大道；“大道”保留已预备之通路的具体意象，又不把“抬高”的含义重复塞入名词。
- source_word: יְרֻמוּן
  choice: 都必被抬高
  rationale: רום在此呈被动或不及物意义，描写道路升高。译作“被抬高”与道路修筑的图景相合，并避免“被高举”可能带来的抽象或敬崇意味；“都”自然承接复数主语。
theological_decisions:
- issue: 归回与行路意象的性质
  choice: 保留上帝使山成为道路、使大道升高的具体地形图景
  alternative: 明确解释为被掳者归回的实际路线，或属灵、护理层面的除去障碍
  rationale: 原文的实体地貌既可服务于复兴与归回的诗性意象，也可能含有实际行路的画面。译文不限定其为纯字面或纯隐喻，以保存经文本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“众山”保留诗体凝练感，“大道”与“道路”形成自然平行。正文中脚注标记按相关词语依次列为[a]、[b]。
