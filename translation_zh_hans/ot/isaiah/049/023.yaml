  source_fidelity: “他们的贵妇”未能充分表达שָׂרוֹתֵיהֶם所含的王室／统治阶层身份。在“列王”相对的语境中，译为“他们的王后”更贴合本节常见且有力的指向。其余措辞忠实保留了养育、俯伏、降卑及等候盼望的意象。
  naturalness: “面伏于地”比“脸伏于地”更合乎庄重、自然的现代书面汉语，也更常用于描写俯伏的姿态。其余句子流畅，诗性与庄重语体相称。
  terminology: “养父”“乳母”“耶和华”“等候我的人”“必不蒙羞”均恰当。将“贵妇”改为“王后”可避免把原文的王室地位泛化为一般富贵妇人。
  issues:
  - severity: medium
    issue: “他们的贵妇”弱化了שָׂרוֹתֵיהֶם的王室／统治者身份。
    rationale: 该阴性复数词在此与“列王”配对，并带有其所属女性王室成员或女性统治者的含义；“贵妇”在现代汉语通常只表示社会地位较高的女性，未能明确王室关系。译作“王后”符合此处语境，且不涉及不必要的神学解释。
  - severity: low
    issue: “脸伏于地”略显生硬。
    rationale: “面伏于地”是现代庄重汉语中更自然的表达，仍准确传达“脸／鼻贴地”的俯伏姿态。
