revisions:
- from: 列王必作你的养父[a]，他们的贵妇必作你的乳母。他们必脸伏于地，向你下拜，舔你脚上的尘土。于是你就知道我是耶和华；等候我的人[b]必不蒙羞。
  to: 列王必作你的养父[a]，他们的王后必作你的乳母。他们必面伏于地，向你下拜，舔你脚上的尘土。于是你就知道我是耶和华；等候我的人[b]必不蒙羞。
  rationale: 修订仅处理两处安全且必要的表达：“王后”保留与列王相配的王室身份；“面伏于地”改善汉语自然度。原文关于向锡安俯伏的政治／社会性臣服、强烈的“舔尘土”图像，以及等候与盼望的语义张力均予保留。
