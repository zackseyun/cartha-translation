id: ISA.49.23
reference: Isaiah 49:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָי֨וּ מְלָכִ֜ים אֹֽמְנַ֗יִ/ךְ וְ/שָׂרֽוֹתֵי/הֶם֙ מֵינִ֣יקֹתַ֔יִ/ךְ אַפַּ֗יִם אֶ֚רֶץ יִשְׁתַּ֣חֲווּ לָ֔/ךְ וַ/עֲפַ֥ר רַגְלַ֖יִ/ךְ יְלַחֵ֑כוּ וְ/יָדַ֨עַתְּ֙ כִּֽי אֲנִ֣י יְהוָ֔ה אֲשֶׁ֥ר לֹֽא יֵבֹ֖שׁוּ קוָֹֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/023.yaml
  text: Kings will be your foster fathers[a], and their princesses your nursing mothers. With faces to the ground they will bow down to you, and they will lick the dust of your feet. Then you will know that I am Yahweh[b]; those who wait for me will not be put to shame.
translation:
  language: zh_hans
  text: 列王必作你的养父[a]，他们的王后必作你的乳母。他们必面伏于地，向你下拜，舔你脚上的尘土。于是你就知道我是耶和华；等候我的人[b]必不蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “养父”也可译作“扶养者”或“保护者”；原词指承担抚养、扶持或保护之责的人。
    reason: lexical_alternative
  - marker: b
    text: “等候”也可译作“仰望”；原词兼有等候和怀着盼望期待的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְנַיִךְ
  choice: 你的养父
  rationale: 该词源自 אמן，在此指承担抚养、扶持或保护之责的男性；与下句“乳母”构成照应。“养父”保留了男性照护者的形象，也适合列王成为锡安扶养者的语境。
- source_word: שָׂרוֹתֵיהֶם
  choice: 他们的贵妇
  rationale: שָׂרוֹת 是 שַׂר 的阴性复数，可指有地位的女性、女首领或王室女性。“贵妇”不把所指过度限定为王后或公主，同时保留其高贵身份。
- source_word: מֵינִיקֹתַיִךְ
  choice: 你的乳母
  rationale: 该词指给婴儿哺乳的女性。“乳母”简洁自然，并与“养父”共同保留原文的抚育意象。
- source_word: אַפַּיִם אֶרֶץ
  choice: 脸伏于地
  rationale: 这是描写俯伏姿态的凝练表达，字面涉及“脸/鼻孔”和“地”；译文既呈现具体姿势，又符合现代汉语。
- source_word: יִשְׁתַּחֲווּ לָךְ
  choice: 向你下拜
  rationale: 动词表示俯伏、下拜或敬拜；此处列王及其贵妇向锡安表示臣服与尊崇，故用“下拜”，不预先解释为对神明的敬拜。
- source_word: וַעֲפַר רַגְלַיִךְ יְלַחֵכוּ
  choice: 舔你脚上的尘土
  rationale: 保留原文刻意鲜明且带屈服意味的图像，表现彻底降卑，而不弱化为一般性的“俯首称臣”。
- source_word: וְיָדַעַתְּ
  choice: 于是你就知道
  rationale: 连接词与完成式在预言语境中可表达结果；“于是”自然呈现前述事件使锡安认识耶和华这一关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神名形式，明确这是专名而非仅仅一个称号。
- source_word: לֹא יֵבֹשׁוּ
  choice: 必不蒙羞
  rationale: 该表达指最终不落入羞辱、失望或颜面尽失的处境；“不蒙羞”比单指内心羞愧更贴近原文。
- source_word: קוָֹי
  choice: 等候我的人
  rationale: קוה 的分词兼有等候与怀着盼望期待之意；正文用“等候”，脚注保留“仰望”这一信靠和盼望的层面。
theological_decisions:
- issue: 锡安所受的俯伏是否应译成敬拜用语
  choice: 译为“向你下拜”，呈现臣服和尊崇的动作
  alternative: 译为“敬拜你”
  rationale: השתחוה 可用于敬拜，也可用于向君王或尊贵者俯伏致敬。本节对象是被复兴的锡安；“下拜”保留动作及其庄重意味，却不额外断定锡安接受只归于神的敬拜。
- issue: 神名 יְהוָה 的中文表达
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用以色列之神的专名。译作“耶和华”保留专名性质，并符合普通中文读者较熟悉的表达；“雅威”是另一种可能的音译，“上主”则以称号代替专名。
- issue: קוה 所含等候与盼望的张力
  choice: 正文译“等候我的人”，脚注说明也可译“仰望我的人”
  alternative: 只译“仰望我的人”
  rationale: 该词同时包含持续等候和怀着信靠盼望的期待。正文和脚注共同保留两方面，避免把语义缩减为单纯等待或抽象希望。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“养父—乳母”保留原文成对的抚育意象；“脸伏于地”“舔你脚上的尘土”维持诗句具体而强烈的降服画面。第二人称阴性单数在汉语中不作语法标示，由上下文指向锡安。
