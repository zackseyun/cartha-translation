  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רָנּ֤וּ שָׁמַ֨יִם֙ וְ/גִ֣ילִי אָ֔רֶץ יפצחו הָרִ֖ים רִנָּ֑ה כִּֽי נִחַ֤ם יְהוָה֙ עַמּ֔/וֹ וַ/עֲנִיָּ֖/ו יְרַחֵֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/013.yaml
  text: Shout for joy[a], O heavens, and rejoice, O earth; let the mountains break out in singing[c][b], for Yahweh has comforted his people and will have compassion on his afflicted ones.
translation:
  language: zh_hans
  text: 诸天哪，要欢呼[a]！大地啊，要喜乐！愿群山放声欢唱！因为雅威[b]已经安慰了他的子民，也必怜悯他受苦的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诸天哪，要欢唱！”希伯来语动词既可指欢呼，也可指欢唱。
    reason: lexical_alternative
  - marker: b
    text: “雅威”音译希伯来语神名YHWH；有些译本译作“耶和华”或以“上主”代替。
    reason: alternative_reading
  - marker: c
    text: “受苦的人”也可译作“贫穷的人”或“卑微的人”；希伯来语词可包含这些含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָנּוּ
  choice: 欢呼
  rationale: 该复数命令式表示以声音洋溢地表达喜乐；“欢呼”简洁有力，也与全宇宙受召同庆的诗歌语境相称。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 在与“大地”和“群山”平行的宇宙性诗歌语境中，“诸天”既保留复数形式和庄重语体，又是现代中文读者熟悉的表达。
- source_word: וְגִילִי
  choice: 要喜乐
  rationale: 该阴性单数命令式以“大地”为呼语；“要喜乐”自然地表达欢欣，并与前句命令相呼应。
- source_word: אָרֶץ
  choice: 大地
  rationale: 此处与诸天、群山并列，指整个大地，而不是某一特定地域；“大地”比“土地”更符合宇宙性意象。
- source_word: יפצחו רִנָּה
  choice: 要放声欢唱
  rationale: פצח表达突然迸发或放声而出，רִנָּה可指喜乐的呼喊或歌唱；“放声欢唱”以自然中文合并传达两者的诗意和劝令色彩。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出诸天、大地和群山欢庆的原因。
- source_word: נִחַם
  choice: 已经安慰了
  rationale: 此处尼法勒完成式表示雅威已向他的子民施行安慰；“已经……了”体现已成之事及其当前意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名YHWH的常见学术拟音，不以“主”这一称号代替其专名。
- source_word: עַמּוֹ
  choice: 他的子民
  rationale: “子民”自然表达这个群体与雅威之间的归属和立约关系，又不把含义政治化为“国家”。
- source_word: וַעֲנִיָּו
  choice: 他那些受苦的人
  rationale: עָנִי可指受苦、贫穷或卑微的人；在安慰与怜悯的语境中，“受苦的人”最贴切，同时用脚注保留其语义范围。
- source_word: יְרַחֵם
  choice: 也必怜悯
  rationale: 未完成式在此指雅威将要施行怜悯；“必”表达诗句中坚定的应许语气，但不改变其将来指向。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名YHWH。译作“雅威”较直接地保存专名性质；脚注说明其希伯来文形式，避免读者误以为这是普通称号。
- issue: עָנִי的语义范围
  choice: 受苦的人
  alternative: 贫穷的人；卑微的人
  rationale: 该词同时具有受压困苦、贫穷和卑微等可能含义。本句以安慰和怜悯为中心，正文采用范围较宽的“受苦的人”，并在脚注中保留其他真实可能。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌体。以三个感叹句重现对诸天、大地和群山的拟人化召唤；“放声欢唱”兼顾希伯来语“迸发”与“喜乐歌声”的组合意义。神名保留为专名“雅威”，歧义处用脚注说明，不在正文中强行缩窄。
