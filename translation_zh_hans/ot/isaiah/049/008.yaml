source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה בְּ/עֵ֤ת רָצוֹן֙ עֲנִיתִ֔י/ךָ וּ/בְ/י֥וֹם יְשׁוּעָ֖ה עֲזַרְתִּ֑י/ךָ וְ/אֶצָּרְ/ךָ֗ וְ/אֶתֶּנְ/ךָ֙ לִ/בְרִ֣ית עָ֔ם לְ/הָקִ֣ים אֶ֔רֶץ לְ/הַנְחִ֖יל נְחָל֥וֹת שֹׁמֵמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/008.yaml
  text: 'Thus says Yahweh: “In a time of favor I answered you[a], and in a day of salvation I helped you; I will keep you and give you as a covenant for the people, to raise up the land[e][d][c][b], to apportion the desolate inheritances,”'
translation:
  language: zh_hans
  text: '耶和华如此说：


    “在蒙悦纳的时候，我回答了你[a]；

    在拯救[b]的日子，我帮助了你。

    我要保守你[c]，

    使你作百姓的约[d]，

    为要复兴这地[e]，

    使人承受荒废的产业。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在施恩的时候，我应允了你。”
    reason: 保留 רָצוֹן“恩惠、悦纳”及 ענה“回答、回应”的词义选择。
  - marker: b
    text: “拯救”也可译作“救助”或“救恩”。
    reason: יְשׁוּעָה既可指具体解救，也可有较广的救恩含义。
  - marker: c
    text: 或译：“我要护卫你。”
    reason: נצר兼有看守、保护和保存之义。
  - marker: d
    text: 或译：“使你作给百姓的约。”
    reason: לִבְרִית עָם将受话者置于“约”的角色中；לִ的具体关系可表达“百姓的”或“给百姓的”。
  - marker: e
    text: 或译：“建立这地”或“恢复这地”。
    reason: הקים可表达使站立、建立或恢复；上下文指向荒废之地的重建。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中广为人知的专名形式，清楚区别于通称“主”，并保留其作为以色列之神圣名的约的语境。
- source_word: בְּעֵת רָצוֹן
  choice: 在蒙悦纳的时候
  rationale: רָצוֹן兼有喜悦、恩惠、接纳之意；“蒙悦纳的时候”自然表达这是获得上帝恩眷与接纳的时机，同时不将其过度解释为抽象的“施恩时期”。
- source_word: עֲנִיתִיךָ
  choice: 我应允了你
  rationale: ענה基本义为回答、回应；在上帝回应祈求的语境中，“应允”是自然庄重的中文，也保留了积极回应的含义。
- source_word: בְיוֹם יְשׁוּעָה
  choice: 在拯救的日子
  rationale: יְשׁוּעָה可指拯救、救助或救恩；“拯救”既适合本节具体的解救语境，也不排除更广的救赎意涵。希伯来文无定冠词，中文不强加“那日”。
- source_word: עֲזַרְתִּיךָ
  choice: 我帮助了你
  rationale: 直接、自然地表达עזר的帮助和援助之义。
- source_word: וְאֶצָּרְךָ
  choice: 我要保守你
  rationale: נצר有看守、保护、保存之义；“保守”在庄重的现代中文中兼含保护和保存，适合此处上帝护卫仆人的语境。
- source_word: וְאֶתֶּנְךָ לִבְרִית עָם
  choice: 使你作众民的约
  rationale: 直译该人物本身被赐下而“作……的约”，不弱化为仅仅作立约的中介。“众民”保留עָם在此处可能是集合意义或指约民的歧义，并与以赛亚书49章较广的万民语境相协调。
- source_word: לְהָקִים אֶרֶץ
  choice: 为要复兴这地
  rationale: הקים在此可指使站立、建立或恢复。结合后文荒废产业，“复兴”自然呈现使遭破坏之地重新建立的含义；“这地”在中文中适度反映语境所指之地。
- source_word: לְהַנְחִיל נְחָלוֹת שֹׁמֵמוֹת
  choice: 使人承受荒废的产业
  rationale: הנחיל意为使人承受为业或分给产业；希伯来文未明说承受者，中文用泛指“人”补足必要句法而不限定对象。“荒废的产业”保留产业虽已荒凉、仍属可承受之业的张力。
theological_decisions:
- issue: 受话者被赐下“作众民的约”的身份和作用
  choice: 保留“使你作众民的约”的文本表述
  alternative: 使你作众民立约的中保；使你为众民建立约
  rationale: 希伯来文把受话者本人置于“约”的角色中。译文不把这一浓缩且富神学张力的表达解释成单纯的中保或立约行动。
- issue: יְשׁוּעָה的范围
  choice: 正文译为“拯救”
  alternative: 救恩；救助
  rationale: “拯救”可兼顾历史处境中的解救与更广的救赎意涵，避免只按后来的系统神学术语收窄词义；其他可能义列入脚注。
- issue: עָם的数与所指
  choice: 译为“众民”并以脚注保留“百姓”
  alternative: 百姓；一族之民
  rationale: 无冠词单数עָם可作集合名词，也可能特指约民。正文“众民”与本章万国性的上下文相称，但脚注保留特指“百姓”的可能，不武断解决范围问题。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留希伯来诗行的平行结构。正文尽量简洁，避免教派化术语。“蒙悦纳”“保守”“产业”等词虽具经文语体色彩，但在现代中文中仍清楚可懂。所有脚注标记均置于相应正文词句之后。
