source:
  edition: WLC
  text: הֲ/תִשְׁכַּ֤ח אִשָּׁה֙ עוּלָ֔/הּ מֵ/רַחֵ֖ם בֶּן בִּטְנָ֑/הּ גַּם אֵ֣לֶּה תִשְׁכַּ֔חְנָה וְ/אָנֹכִ֖י לֹ֥א אֶשְׁכָּחֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/015.yaml
  text: Can a woman forget her nursing child[a], and have no compassion on the son of her womb? Even these may forget, yet I will not forget you.
translation:
  language: zh_hans
  text: 妇人岂会忘记她吃奶的婴孩[a]，不怜惜她腹中所生的儿子？即使这样的妇人也可能忘记，我却不会忘记你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吃奶的婴孩”也可译作“乳儿”。
    reason: 说明 עוּל 的词义范围，并提供更简练但较书面的译法。
lexical_decisions:
- source_word: הֲתִשְׁכַּח
  choice: 岂会忘记
  rationale: 疑问词 הֲ 与未完成式构成反问；“岂会”自然表达这种几乎不可想象、却并非绝对不可能的语气。
- source_word: אִשָּׁה
  choice: 妇人
  rationale: 原词指“女人、妇人”，并非专门的“母亲”；下文的哺乳和生产意象已明确其母亲身份。
- source_word: עוּלָהּ
  choice: 她吃奶的婴孩
  rationale: 该名词指尚在吃奶、依赖母乳的幼儿；此译保留哺乳意象，也符合现代汉语。
- source_word: מֵרַחֵם
  choice: 不怜惜
  rationale: רחם 表达怜悯、疼惜；在此承接前面的“忘记”，译作“不怜惜”既自然，也保留强烈的亲情意味。
- source_word: בֶּן בִּטְנָהּ
  choice: 她腹中所生的儿子
  rationale: 保留 בֶּן 的阳性所指“儿子”和 בטן 的腹中、生育意象，同时用现代汉语可理解的表达呈现。
- source_word: גַּם אֵלֶּה תִשְׁכַּחְנָה
  choice: 即使这样的妇人也可能忘记
  rationale: “这样的妇人”保留 אֵלֶּה 的回指和强调，“也可能”呈现让步语境中的可能性，不把母亲忘记孩子说成必然事实。
- source_word: וְאָנֹכִי לֹא אֶשְׁכָּחֵךְ
  choice: 我却不会忘记你
  rationale: 独立代词 אָנֹכִי 带有强调作用；“却”突出与前句的鲜明对比，“不会忘记”传达坚定保证。
theological_decisions:
- issue: בֶּן בִּטְנָהּ 的性别用语
  choice: 她腹中所生的儿子
  alternative: 她腹中所生的孩子
  rationale: 原文明确使用 בֶּן（儿子），正文保留这一性别信息，不将其泛化；同时不赋予该措辞额外的教义含义。
- issue: 母亲可能忘记与上帝绝不忘记之间的张力
  choice: 即使这样的妇人也可能忘记，我却不会忘记你
  alternative: 纵然她们忘记，我也不会忘记你
  rationale: 译文保留让步和可能性，既不否认极端情况下母亲可能失责，也不削弱上帝所作保证的绝对性；不额外加入“圣约”等原节未明说的术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“岂会”保留反问力度；“怜惜”比“同情”更适合母子关系；末句以“我却”突出原文 אָנֹכִי 的强调。
