source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה גַּם שְׁבִ֤י גִבּוֹר֙ יֻקָּ֔ח וּ/מַלְק֥וֹחַ עָרִ֖יץ יִמָּלֵ֑ט וְ/אֶת יְרִיבֵ/ךְ֙ אָנֹכִ֣י אָרִ֔יב וְ/אֶת בָּנַ֖יִ/ךְ אָנֹכִ֥י אוֹשִֽׁיעַ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/025.yaml
  text: 'For thus says Yahweh: Even the captives of the mighty will be taken away[a], and the prey of the ruthless will escape; and I myself will contend with the one who contends with you[b], and I myself will save your children.'
translation:
  language: zh_hans
  text: 因为耶和华如此说：勇士所掳的人也必被夺回，强暴者抢来的也必逃脱；我必亲自与那同你争讼的人争讼，我必亲自拯救你的儿女[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“你的儿子”，在这里可统指锡安的后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行的专名译法，明确呈现四字神名，而不以“主”代替。
- source_word: שְׁבִי גִבּוֹר
  choice: 勇士所掳的人
  rationale: 将 שְׁבִי 按上下文理解为被掳者的集合，并保留 גִבּוֹר 所含强大勇士的意象。
- source_word: יֻקָּח
  choice: 必被夺回
  rationale: 被动式表示这些被掳者将从强者手中被取走；“夺回”在中文中清楚表达所有权逆转和解救语境。
- source_word: מַלְקוֹחַ עָרִיץ
  choice: 强暴者抢来的
  rationale: מַלְקוֹחַ 指掳物或被夺取者，עָרִיץ 指强暴、残酷的压迫者；此译法自然，并保留所指可能是人或战利品的宽度。
- source_word: יִמָּלֵט
  choice: 必逃脱
  rationale: 保留 Niphal 形式在此可表达的逃脱或得以脱身之意，不进一步解释施救方式。
- source_word: יְרִיבֵךְ / אָרִיב
  choice: 那同你争讼的／争讼
  rationale: 重复“争讼”以保留同根词呼应，也保留法律争辩与实际对抗之间的张力。
- source_word: אָנֹכִי
  choice: 我必亲自
  rationale: 独立代词具有强调作用；两次译作“亲自”，突出耶和华本人的介入。
- source_word: בָּנַיִךְ
  choice: 你的儿女
  rationale: 字面为复数“儿子”，但在锡安作为女性受话者的语境中可统指她的后代；“儿女”符合现代汉语的集合表达，字面形式见脚注。
- source_word: אוֹשִׁיעַ
  choice: 拯救
  rationale: 直接表达 ישׁע 的使役式意义，并保留神施行救恩的语义分量。
theological_decisions:
- issue: 锡安称谓中 בָּנַיִךְ 的范围
  choice: 你的儿女
  alternative: 你的儿子
  rationale: 受话者是拟人化的锡安／耶路撒冷，阳性复数名词在这里可集合性地指她的后代。正文采用自然且涵盖整体的“儿女”，脚注保留字面译法，避免抹去原文形式。
- issue: ריב 的法律与冲突意象
  choice: 争讼
  alternative: 争战；与……为敌
  rationale: “争讼”保留该词的法律语域及原文同根重复，不把语义单方面限定为军事争战或法庭辩护。
translation_notes:
  register: 采用庄重而现代的标准普通话。“勇士所掳的人”与“强暴者抢来的”形成平行；两次“我必亲自”保留原文的强调结构。
