id: ISA.42.4
reference: Isaiah 42:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹ֤א יִכְהֶה֙ וְ/לֹ֣א יָר֔וּץ עַד יָשִׂ֥ים בָּ/אָ֖רֶץ מִשְׁפָּ֑ט וּ/לְ/תוֹרָת֖/וֹ אִיִּ֥ים יְיַחֵֽילוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/004.yaml
  text: He will not grow dim or be crushed until he establishes justice in the earth[a], and the coastlands will wait for his instruction.
translation:
  language: zh_hans
  text: 他不会黯淡，也不会被压碎，直到他在大地上建立公正；沿海各地都等候他的训诲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“沿海各地都盼望他的训诲”。希伯来动词含有怀着期待等候的意思。
    reason: 保留 יְיַחֵילוּ 在“等候”与“盼望”之间的词义幅度。
lexical_decisions:
- source_word: יִכְהֶה
  choice: 黯淡
  rationale: 该词表示变暗、变微弱；“黯淡”保留了与上一节将残的灯火相呼应的意象，也没有将其解释性改写为“灰心”。
- source_word: יָרוּץ
  choice: 被压碎
  rationale: 该词源于 רצץ，意为压碎、折断；采用“被压碎”既反映被动语态，也保留与上一节“压伤的芦苇”之间的词根联系。
- source_word: עַד יָשִׂים
  choice: 直到……建立
  rationale: שׂים 本义为放置、设立；与 מִשְׁפָּט 搭配时，“建立公正”符合现代汉语表达，并体现使公正得以确立的结果意义。
- source_word: בָּאָרֶץ
  choice: 在大地上
  rationale: אֶרֶץ 可指土地、国土或全地；下文提到沿海各地，语境呈现广阔范围，因此译作“大地”，但不进一步引入经文没有明说的神学结论。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 此处指合乎正义的秩序，而不只是一次审判或判决；“公正”简洁自然，并符合本段语境。
- source_word: לְתוֹרָתוֹ
  choice: 他的训诲
  rationale: תּוֹרָה 的语义包括教导、指引和律法；“训诲”既保留庄重及权威意味，也避免将其限缩为成文法条。
- source_word: אִיִּים
  choice: 沿海各地
  rationale: 先知书中的 אִיִּים 常泛指海岛、沿海地区及远方海疆；“沿海各地”比单译“岛屿”更能体现其范围。
- source_word: יְיַחֵילוּ
  choice: 等候
  rationale: יחל 的强化词干可表示怀着期待等候或盼望；正文用“等候”保留动作含义，并以脚注注明“盼望”这一可能译法。
theological_decisions:
- issue: 仆人使命的地域范围
  choice: 以“大地”和“沿海各地”呈现经文本身暗示的广阔范围
  alternative: 将 אֶרֶץ 主要理解为以色列地，并认为更广范围只是次要含义
  rationale: 本节将 אֶרֶץ 与 אִיִּים 并列，视野自然超出单一本地；译文呈现这一指向，但不借此判定仆人的身份或加入后来的教义解释。
- issue: 仆人是否会灰心或遭挫败
  choice: 保留“黯淡／压碎”的具体意象
  alternative: 意译为“他不灰心，也不丧胆”
  rationale: 意译虽顺畅，却会消除本节与上一节灯火和芦苇意象的词汇呼应；直译也保留了文本中仆人主动不衰微与不被外力压垮之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“黯淡”“压碎”刻意保留诗歌意象及与上一节的呼应；分号呈现公正建立与远方等候之间的推进关系。脚注标记置于其所说明的“等候他的训诲”之后。
