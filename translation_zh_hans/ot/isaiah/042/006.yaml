base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/006.yaml
  text: I am Yahweh[a]; I have called you in righteousness, and I will take hold of your hand; I will keep you and give you as a covenant for the people[c][b], as a light for the nations.
translation:
  language: zh_hans
  text: “我耶和华凭公义召了你；我必握住你的手，保护你，并使你作百姓的约，作列国的光。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，避免用称号“主”取代原文中的名字。
- source_word: קְרָאתִיךָ
  choice: 召了你
  rationale: 原文完成式表明召唤已实施；“召了你”自然、简洁，并保留差遣语境。
- source_word: בְצֶדֶק
  choice: 凭公义
  rationale: צֶדֶק兼有公义、正直与公正的语义范围；“凭公义”保留名词形式，也自然表达行动的准则或方式。
- source_word: וְאַחְזֵק בְּיָדֶךָ
  choice: 我必扶持你的手
  rationale: 原文意象是抓住或坚固对方的手。“扶持你的手”在现代中文中既保留身体意象，也传达支持和坚固。
- source_word: וְאֶצָּרְךָ
  choice: 保护你
  rationale: נצר在此有看守、护卫、保全之意；“保护你”清楚自然，不把含义过度限定为监看或保存。
- source_word: וְאֶתֶּנְךָ
  choice: 使你作
  rationale: נתן字面为“赐下、给予”，此处后接角色性补语；中文用“使你作”能自然表达把仆人赐予众民、赋予其角色的意思，而不增添“中保”等解释。
- source_word: לִבְרִית עָם
  choice: 作众民的约
  rationale: 保留仆人本身被赐作“约”的鲜明表达，不释义为“立约的中保”。עָם无冠词，且可理解为集合性的人民；“众民”既自然，也避免未经原文明示就限定为某一特定民族。
- source_word: לְאוֹר גּוֹיִם
  choice: 作列国的光
  rationale: “列国”准确传达גּוֹיִם的复数民族范围，并与“众民”构成诗性平行；“光”保留原文意象。
theological_decisions:
- issue: 受话者被赐作“众民的约”
  choice: 直译为“使你作众民的约”
  alternative: 使你作众民立约的中保
  rationale: 希伯来文直接把受话者与“约”联系起来。保留这一张力，不在正文中将其解释为中保、施约者或约的承载者。
- issue: עָם与גּוֹיִם的范围关系
  choice: 译为“众民……列国”
  alternative: “这民……外邦人”或“百姓……列国”
  rationale: 原文עָם无冠词，其确切所指存在一定开放性；“众民……列国”保留集合性和平行结构，不强行确定为以色列与外邦人的技术性对照。
- issue: 神名的呈现
  choice: 耶和华
  alternative: 雅威；主
  rationale: 采用现代简体中文读者最熟悉的神名形式，同时保留原文是专名而非称号这一点。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。分号划分神的自我宣告与后续行动，两个“作……”形成平行。避免“中保”“外邦人”等可能提前收窄解释范围的术语。
