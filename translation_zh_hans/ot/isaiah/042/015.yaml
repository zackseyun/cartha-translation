id: ISA.42.15
reference: Isaiah 42:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַחֲרִ֤יב הָרִים֙ וּ/גְבָע֔וֹת וְ/כָל עֶשְׂבָּ֖/ם אוֹבִ֑ישׁ וְ/שַׂמְתִּ֤י נְהָרוֹת֙ לָֽ/אִיִּ֔ים וַ/אֲגַמִּ֖ים אוֹבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/015.yaml
  text: I will lay waste mountains and hills[a], and I will dry up all their vegetation; I will turn rivers into islands, and I will dry up pools.
translation:
  language: zh_hans
  text: 我要使群山和丘陵荒废；我要使其一切草木枯干；我要使江河变为岛屿[a]；我要使池沼干涸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “岛屿”或译“沿海之地”；希伯来语这个词可指岛屿，也可指临海的陆地。
    reason: 保留 אִיִּים 的真实词义范围，不在正文中消除其歧义。
lexical_decisions:
- source_word: אַחֲרִיב
  choice: 使……荒废
  rationale: 该词是 חרב 的使役式，表示使之荒凉、毁坏。“使……荒废”保留使役含义和审判语气，又不夸大为彻底消灭。
- source_word: הָרִים וּגְבָעוֹת
  choice: 群山和丘陵
  rationale: 分别对应“山”和“丘陵”；“丘陵”避免把后者误解为带有祭祀含义的“邱坛”。
- source_word: וְכָל עֶשְׂבָּם
  choice: 其一切草木
  rationale: עֵשֶׂב 可泛指青草、草本植物或植被；“草木”在现代汉语中自然地涵盖山岭上的各种植物，并保留复数后缀所指的群山和丘陵。
- source_word: אוֹבִישׁ
  choice: 使……枯干／干涸
  rationale: יבש 的使役式表示“使干”。用于草木时译作“枯干”，用于水体时译作“干涸”，以自然汉语表达同一使役动作，同时保留两处对应关系。
- source_word: וְשַׂמְתִּי
  choice: 使……变为
  rationale: שׂים 在宾语加表语的结构中表示使某物成为某种状态；“使……变为”准确传达转变含义。
- source_word: נְהָרוֹת
  choice: 江河
  rationale: 该词通常指河流；“江河”是自然、庄重的现代汉语表达。
- source_word: לָאִיִּים
  choice: 变为岛屿
  rationale: אִיִּים 可指岛屿或沿海之地。正文采用直接词义“岛屿”，不把语境推断的“旱地”写入正文；另一词义收入脚注。
- source_word: וַאֲגַמִּים
  choice: 池沼
  rationale: אֲגַמִּים 可指水池、池塘或沼泽水域；“池沼”范围适当，也与江河形成自然并列。
theological_decisions:
- issue: 上帝审判中涉及受造界的意象
  choice: 按具体地貌、水体和草木的荒废与枯干来翻译
  alternative: 直接解释为除去障碍的象征性语言
  rationale: 希伯来文使用具体的自然环境意象。上下文可能容许象征层面的理解，但译文不应预先判定这些话纯属比喻，或排除其历史性、宇宙性层面。
- issue: 第一人称使役行动的反复强调
  choice: 四个分句均保留“我要使”
  alternative: 为行文简洁而省略部分重复主语和使役词
  rationale: 原文连续使用四个第一人称单数动词，突出说话者主动施行审判；汉语保留反复可再现其庄严而有力的修辞节奏。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“群山和丘陵”“草木”“池沼”通俗可懂，又保持先知宣告的正式语体。四次“我要使”有意对应原文连续的第一人称使役行动；分号呈现四重平行节奏。脚注标记紧随其实际对应词“岛屿”。
