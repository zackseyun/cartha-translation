source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר הָ/אֵ֣ל יְהוָ֗ה בּוֹרֵ֤א הַ/שָּׁמַ֨יִם֙ וְ/נ֣וֹטֵי/הֶ֔ם רֹקַ֥ע הָ/אָ֖רֶץ וְ/צֶאֱצָאֶ֑י/הָ נֹתֵ֤ן נְשָׁמָה֙ לָ/עָ֣ם עָלֶ֔י/הָ וְ/ר֖וּחַ לַ/הֹלְכִ֥ים בָּֽ/הּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/005.yaml
  text: 'Thus says God[a], Yahweh, who created the heavens and stretched them out, who spread out the earth and its offspring[c][b], who gives breath to the people on it and spirit to those who walk in it:'
translation:
  language: zh_hans
  text: 神——雅威如此说：他创造诸天，将诸天铺展；他铺开[a]大地和地上所出的一切[b]；他把气息赐给地上的众民，把灵[c]赐给行走其上的人：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铺开”也可译作“敲打铺展”；希伯来语动词可使人想到把某物锤打、铺展开来。
    reason: lexical_alternative
  - marker: b
    text: “地上所出的一切”也可译作“大地的后裔”或“大地的出产”。
    reason: lexical_alternative
  - marker: c
    text: “灵”也可译作“气息”；希伯来语词 רוּחַ 可表示“灵”“气息”或“风”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל יְהוָה
  choice: 神雅威
  rationale: הָאֵל是“神”的称号，随后是神名יהוה；译作“神雅威”保留二者的同位关系，并直接呈现圣约之名。
- source_word: בּוֹרֵא הַשָּׁמַיִם
  choice: 创造诸天
  rationale: 分词描述雅威是创造诸天的那一位；汉语用关系性分句自然表达其属性。
- source_word: וְנוֹטֵיהֶם
  choice: 将诸天铺展
  rationale: נטה在此描绘把诸天伸展、展开；重复“诸天”比使用可能指代不清的代词更自然。
- source_word: רֹקַע הָאָרֶץ
  choice: 铺开大地
  rationale: רקע可指敲打而使之展开，也可强调铺展的结果；正文采用自然的“铺开”，较具体的动作意象收入脚注。
- source_word: וְצֶאֱצָאֶיהָ
  choice: 和地上所出的一切
  rationale: צאצאים指从大地生出、长出之物，范围可能包括出产和生物；此译法不把所指过早限缩为植物或后裔。
- source_word: נֹתֵן נְשָׁמָה
  choice: 把气息赐给
  rationale: נשמה在此是维系生命的气息，不宜译成“灵魂”；“气息”清楚保留创造与赐生命的意象。
- source_word: לָעָם עָלֶיהָ
  choice: 地上的众民
  rationale: עם是集合名词，指居住在大地上的人群；“众民”比单数的“人民”更贴合此处普遍性的语境。
- source_word: וְרוּחַ
  choice: 把灵赐给
  rationale: רוח可指灵、气息或风；译作“灵”可与前句的נשמה“气息”保持区别，同时保留其人论层面的张力。
- source_word: לַהֹלְכִים בָּהּ
  choice: 行走其上的人
  rationale: 保留“行走”的具体意象；בָּהּ在这里指大地，汉语按自然空间关系译为“其上”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专名的性质，不以称号替代。
- issue: נְשָׁמָה与רוּחַ的区分
  choice: 气息……灵
  alternative: 气息……气息；生命之气……气息
  rationale: 原文使用两个语义相近但并不相同的词；分别译为“气息”和“灵”，既保持词汇区别，也不消除二者在此处的语义重叠。
- issue: צֶאֱצָאֶיהָ所涵盖的范围
  choice: 地上所出的一切
  alternative: 大地的后裔；大地的出产
  rationale: 该词可以指从大地生出或长出的事物；采用较宽泛的表达，以免武断地只指农产、植物或生物。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号呈现原文连续的分词结构和创造行动的平行关系；使用“诸天”“赐给”等适度庄重的词语，但避免过度古雅。所有词汇歧义均在正文或脚注中保留。
