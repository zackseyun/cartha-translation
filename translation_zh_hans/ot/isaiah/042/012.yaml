language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יָשִׂ֥ימוּ לַֽ/יהוָ֖ה כָּב֑וֹד וּ/תְהִלָּת֖/וֹ בָּ/אִיִּ֥ים יַגִּֽידוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/012.yaml
  text: Let them give glory to Yahweh[c][b][a], and let them declare his praise in the coastlands.
translation:
  language: zh_hans
  text: 愿他们把荣耀归给雅威[c][b]，在众海岛[a]宣扬对他的赞美。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“在众岛屿”；这个词在《以赛亚书》中常广指远方的海岛和沿海地区。
    reason: lexical_alternative
  - marker: b
    text: 或译：“将荣耀献给雅威。”原文动词本义为“放置、设立”，在这里按习惯用法表示把荣耀归给某位。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语为יהוה（YHWH），这里音译作“雅威”；传统汉译常作“耶和华”或“上主”。
    reason: alternative_reading
lexical_decisions:
- source_word: יָשִׂימוּ
  choice: 愿他们把……归给
  rationale: שׂים本义为“放置、设立”，与“荣耀”及表示对象的介词ל连用时，是“把荣耀归给”的习惯表达；“愿他们”保留未完成式在此处的劝勉语气。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 介词ל标明荣耀所归的对象；יהוה按其专名音译为“雅威”。
- source_word: כָּבוֹד
  choice: 荣耀
  rationale: כָּבוֹד可指“荣耀、尊荣”；在敬拜语境中与“赞美”平行，“荣耀”最贴切。
- source_word: וּתְהִלָּתוֹ
  choice: 对他的赞美
  rationale: תְּהִלָּה意为“赞美”，第三人称阳性单数后缀指向雅威；译作“对他的赞美”，避免现代汉语将“他的赞美”误解为“他所发出的赞美”。
- source_word: בָּאִיִּים
  choice: 在众海岛
  rationale: אִיִּים字面指“岛屿”，在《以赛亚书》中也常泛指远方的沿海或海洋地区；正文采用较贴近词面的“众海岛”，脚注说明其较宽泛的地理含义。
- source_word: יַגִּידוּ
  choice: 宣扬
  rationale: נגד的使役词干表示“宣布、使人知道”；“宣扬”既有公开传告之意，也符合诗歌的庄重语体。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה；音译“雅威”保留其作为盟约专名的性质，同时以脚注交代传统汉译。
- issue: “他的赞美”所表达的关系
  choice: 对他的赞美
  alternative: 他的赞美；他的美名
  rationale: 后缀在此可理解为归于他、以他为对象的赞美。译文采用自然汉语表达，但不把תְּהִלָּה改释为较窄的“美名”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿他们”统摄两个并列动作，保留原文的劝勉色彩；“众海岛”维持先知诗歌中的地理意象，并由脚注说明其可涵盖沿海远方。
