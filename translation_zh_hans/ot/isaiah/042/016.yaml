source:
  edition: WLC
  text: וְ/הוֹלַכְתִּ֣י עִוְרִ֗ים בְּ/דֶ֨רֶךְ֙ לֹ֣א יָדָ֔עוּ בִּ/נְתִיב֥וֹת לֹֽא יָדְע֖וּ אַדְרִיכֵ֑/ם אָשִׂים֩ מַחְשָׁ֨ךְ לִ/פְנֵי/הֶ֜ם לָ/א֗וֹר וּ/מַֽעֲקַשִּׁים֙ לְ/מִישׁ֔וֹר אֵ֚לֶּה הַ/דְּבָרִ֔ים עֲשִׂיתִ֖/ם וְ/לֹ֥א עֲזַבְתִּֽי/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/016.yaml
  text: And I will lead the blind by a way they have not known; on paths they have not known I will guide them. I will make the darkness before them into light[a], and the crooked places into level ground. These are the things I have done, and I have not forsaken them.
translation:
  language: zh_hans
  text: 我要领盲人走他们不认识的路；在他们不知道的路径上引导他们。我要使他们面前的黑暗变为光明，使弯曲之处变为平坦之地。这些事我已经做了，并没有撇弃他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些事我必做，也必不撇弃他们。”希伯来文这里使用完成式动词，既可表示已经完成的行动，也可在此语境中表达神所应许之事必定成就。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוֹלַכְתִּי
  choice: 我要领……走
  rationale: 该词是הלך的使役式，直译为“使行走”；“领……走”在现代汉语中自然地表达带领前行。
- source_word: עִוְרִים
  choice: 盲人
  rationale: 阳性复数形容词在此作名词使用；“盲人”保留原文形象，不限定其为字面或比喻意义。
- source_word: בְּדֶרֶךְ לֹא יָדָעוּ
  choice: 走他们不认识的路
  rationale: דרך指道路或路径，ידע在此表示因经历而熟悉；此译符合汉语行路表达。
- source_word: בִּנְתִיבוֹת לֹא יָדְעוּ אַדְרִיכֵם
  choice: 引导他们行他们不知道的路径
  rationale: נתיבות是诗体复数“路径”，דרך的使役式表示引导行走；用“引导”与前句“领”形成自然平行而避免机械重复。
- source_word: מַחְשָׁךְ לִפְנֵיהֶם לָאוֹר
  choice: 使他们面前的黑暗变为光明
  rationale: 保留空间意象“他们面前”，并以“变为”清楚表达从黑暗到光明的转变。
- source_word: וּמַעֲקַשִּׁים לְמִישׁוֹר
  choice: 使崎岖之地变为平坦
  rationale: מַעֲקַשִּׁים指弯曲、难行之处，מִישׁוֹר指平坦处或平地；结合行路语境译为“崎岖之地……平坦”。
- source_word: אֵלֶּה הַדְּבָרִים עֲשִׂיתִם וְלֹא עֲזַבְתִּים
  choice: 这些事我已经做了，并没有撇弃他们
  rationale: 保留两个完成式所形成的体貌转折，以已经完成的口吻强调应许的确定性，同时不排除按上下文理解为将来应许。
theological_decisions:
- issue: 末句两个完成式在将来应许语境中的时态
  choice: 正文译为“我已经做了，并没有撇弃他们”
  alternative: “这些事我必做，也必不撇弃他们”
  rationale: 本节前半使用明确指向未来的形式，末句却转用完成式。正文保留这一转折，让神所应许之事以仿佛已经成就的方式表达其确定性；脚注列出顺应整体未来语境的另一种译法，不把原文的时态张力消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“路／路径”“黑暗／光明”“崎岖／平坦”保留希伯来诗歌的平行结构与行路意象；脚注标记置于涉及两句完成式的句末。
