  text: הֶחֱשֵׁ֨יתִי֙ מֵֽ/עוֹלָ֔ם אַחֲרִ֖ישׁ אֶתְאַפָּ֑ק כַּ/יּוֹלֵדָ֣ה אֶפְעֶ֔ה אֶשֹּׁ֥ם וְ/אֶשְׁאַ֖ף יָֽחַד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/014.yaml
  text: I have kept silent from long ago[a]; I have been quiet and restrained myself. Like a woman in labor I will cry out[b]; I will gasp and pant together.
translation:
  language: zh_hans
  text: 我从很久以前就保持沉默[a]，一直缄默，克制自己。我要像临产的妇人一样呼喊；我要喘息，急促吸气[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从很久以前”也可译作“长久以来”或“自古以来”。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译作“我要一同喘息、急促吸气”或“我要顿时一齐喘息、急促吸气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱשֵׁיתִי
  choice: 保持沉默
  rationale: 该词为חרשׁ的使役形第一人称单数，在这里表达使自己不出声、一直沉默；与后面的克制自己相呼应。
- source_word: מֵעוֹלָם
  choice: 从很久以前
  rationale: 此处指此前延续已久的时间，而不是绝对意义上的永恒；译法保留起点与长久时段之间的含混。
- source_word: אַחֲרִישׁ
  choice: 一直缄默
  rationale: 该词属于沉默、安静的语义范围。用“缄默”承接前句，既保留平行关系，也避免中文机械重复。
- source_word: אֶתְאַפָּק
  choice: 克制自己
  rationale: אפק的反身形表示自我约束、按捺不发，直接译出其反身意味。
- source_word: כַּיּוֹלֵדָה
  choice: 像临产的妇人一样
  rationale: 原文明确以分娩中的妇人为比喻；“临产的妇人”是自然、庄重且画面鲜明的现代汉语。
- source_word: אֶפְעֶה
  choice: 呼喊
  rationale: פעה表示发出声音或在痛苦中喊叫；“呼喊”能自然引出分娩时强烈发声和急促呼吸的意象。
- source_word: אֶשֹּׁם
  choice: 喘息
  rationale: 在临产与呼吸动作的语境中，此词宜理解为喘气，而非采用“使荒凉”等不同词义。
- source_word: וְאֶשְׁאַף
  choice: 急促吸气
  rationale: שׁאף可表示急切吸气、喘气；与“喘息”并列，呈现连续而急促的呼吸，同时避免两个中文动词完全同义。
- source_word: יַחַד
  choice: 同时
  rationale: 该副词表明两种呼吸动作一同发生，也可能带有突然一起爆发的意味；正文用“同时”，脚注保留“顿时一齐”的可能性。
theological_decisions:
- issue: 上帝以临产妇人的形象描述自己的行动
  choice: 原样保留“像临产的妇人一样”的明喻
  alternative: 弱化为一般性的强烈呼喊，或仅在注释中说明分娩意象
  rationale: 希伯来文明确保留这一明喻，用来表现长久克制之后即将爆发的强烈行动。译文不将其弱化，也不额外推演关于神本性的结论。
- issue: 动词时态所呈现的沉默与即将行动之间的转折
  choice: 以“如今，我要”明确表达由长期沉默转向将要发声
  alternative: 各分句机械使用相同时间表达，不显明语篇转折
  rationale: 前半节回顾长久沉默，后半节采用未完成式描写即将发生的行动；“如今”是语篇层面的自然显化，不改变神学内容。
translation_notes:
  register: 采用现代标准普通话，语气庄重而清楚。前半句以“保持沉默—缄默—克制自己”保留希伯来文的递进平行；后半句保留临产妇人的鲜明意象，并用两个相近但不完全重复的呼吸动词表现强度。所有脚注标记均置于正文相应位置。
