base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/003.yaml
  text: A bruised reed he will not break[a], and a dimly burning wick he will not extinguish[b]; he will faithfully bring forth justice.
translation:
  language: zh_hans
  text: 压伤的芦苇，他不折断；微弱的灯芯，他不熄灭[a]；他必忠实地施行公正[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灯芯”原文直译为“亚麻”，这里很可能指亚麻制成的灯芯；“微弱”也可译作“昏暗的”或“将熄的”。
    reason: 说明具体物象及保留的词义范围。
  - marker: b
    text: “忠实地”也可译作“按真理”。
    reason: 保留לֶאֱמֶת在“信实”与“真实”之间的真实语义歧义。
lexical_decisions:
- source_word: קָנֶה רָצוּץ
  choice: 压伤的芦苇
  rationale: קָנֶה通常指芦苇，רָצוּץ表示已受压、受损，却不一定已经折断。“压伤的芦苇”保留具体意象及其脆弱感。
- source_word: לֹא יִשְׁבּוֹר
  choice: 他不折断
  rationale: 未完成体在这里描写仆人的一贯作为，也带有预告意味；汉语“不折断”自然涵盖这种特征性陈述。
- source_word: פִשְׁתָּה כֵהָה
  choice: 微弱的灯芯
  rationale: פִשְׁתָּה字面为“亚麻”，在与昏暗及熄灭搭配时，很可能指亚麻制成的灯芯。译作“灯芯”清楚呈现语境中的物象；“微弱”保留כֵהָה所表达的暗淡、将熄状态，而不过度限定为冒烟。
- source_word: לֹא יְכַבֶּנָּה
  choice: 他不熄灭
  rationale: כבה意为使火或灯熄灭。“熄灭”准确对应灯芯意象，也保持庄重简洁。
- source_word: לֶאֱמֶת
  choice: 忠实地
  rationale: אֱמֶת可表达真实、信实或可靠；此处作状语，既可理解为“按真理”，也可强调仆人忠实可靠地施行其使命。正文采用自然的“忠实地”，并以脚注保留另一可行译法。
- source_word: יוֹצִיא מִשְׁפָּט
  choice: 带来公正
  rationale: יצא的使役形在此表示使之出现、带出；מִשְׁפָּט在本段不只指一次司法判决，更指公正的秩序。“带来公正”符合现代汉语，也保留经文的广度。
theological_decisions:
- issue: 仆人如何对待脆弱者的比喻
  choice: 保留“压伤的芦苇”和“微弱的灯芯”两个具体意象
  alternative: 直译其隐含意义，如“他不压垮软弱的人”
  rationale: 原文并未明说这些物象等同于哪一类人。保留比喻可维持诗歌张力，避免把某种解释直接写进正文。
- issue: לֶאֱמֶת的语义
  choice: 忠实地
  alternative: 按真理
  rationale: 该词既可能强调真实，也可能强调信实可靠。正文采用在此处较自然的状语表达，脚注则保留较贴近词面、且具有神学意义的另一译法。
- issue: מִשְׁפָּט的范围
  choice: 公正
  alternative: 审判
  rationale: 上下文所指可超越单一裁决，涉及使公义、公正得以实现。“公正”不把含义限缩为定罪或法庭判决。
translation_notes:
  register: 采用现代、简洁而庄重的书面汉语。句式保留希伯来诗歌的两个平行意象，并以分号呈现推进关系；避免使用过于古雅的“将残之灯火”等表达。
