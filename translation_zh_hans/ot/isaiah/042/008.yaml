base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/008.yaml
  text: I am Yahweh; that is my name. I will not give my glory to another[a], nor my praise to idols.
translation:
  language: zh_hans
  text: 我是雅威；这是我的名。我必不将我的荣耀归给别人，也不将我的颂赞归给雕刻的偶像[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雕刻的像”。希伯来词特指雕制或塑成的像，因此在此语境中指偶像。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为上帝专名的功能，不以称号替代。
- source_word: הוּא שְׁמִי
  choice: 这是我的名
  rationale: הוּא在此具有指认和强调作用；现代汉语用“这是我的名”自然地表达其含义。
- source_word: כְבוֹדִי
  choice: 我的荣耀
  rationale: כָּבוֹד在此指属于雅威的荣耀、尊荣；“荣耀”既贴近原文，也符合本段有关上帝独一性的语境。
- source_word: לְאַחֵר
  choice: 归给别人
  rationale: אַחֵר表示雅威以外的“另一个”；“别人”在现代汉语中简洁自然，同时不额外限定所指对象。
- source_word: אֶתֵּן
  choice: 我必不归给
  rationale: 未完成式在此表达坚定意志；“必不”传达这一决绝语气。“归给”与荣耀、颂赞的搭配比机械的“给”更自然。
- source_word: תְהִלָּתִי
  choice: 我的颂赞
  rationale: 保留原文紧凑的所有格表达，不扩写为“当受的赞美”；“颂赞”适合庄重诗体，并指向对雅威的赞美。
- source_word: לַפְּסִילִים
  choice: 归给雕刻的偶像
  rationale: פְּסִילִים特指雕制或塑成的神像；译作“雕刻的偶像”兼顾其制作方式和作为崇拜对象的含义。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，避免以称号“主”替代；“耶和华”是传统形式，但较不贴近通常重构的读音。
- issue: 是否将“我的颂赞”解释性扩写为“我当受的颂赞”
  choice: 保留“我的颂赞”
  alternative: 我当受的颂赞
  rationale: 原文诗句简洁，所有格本身已表达颂赞的归属；扩写虽可说明含义，却会加入原文没有明说的措辞。
- issue: פְּסִילִים应突出物质形态还是宗教功能
  choice: 雕刻的偶像
  alternative: 雕像；偶像
  rationale: 兼顾该词“雕制之像”的词汇意义及语境中的偶像崇拜含义，不把它泛化成所有雕像，也不完全抹去其人工制作的色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留希伯来诗歌的两个平行分句，并以“必不……也不……”体现雅威拒绝把荣耀与颂赞归给其他对象的坚定语气。
