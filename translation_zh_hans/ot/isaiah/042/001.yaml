  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵ֤ן עַבְדִּ/י֙ אֶתְמָךְ בּ֔/וֹ בְּחִירִ֖/י רָצְתָ֣ה נַפְשִׁ֑/י נָתַ֤תִּי רוּחִ/י֙ עָלָ֔י/ו מִשְׁפָּ֖ט לַ/גּוֹיִ֥ם יוֹצִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/001.yaml
  text: Behold my servant[a], whom I uphold, my chosen one, in whom my soul delights. I have put my Spirit upon him[c][b]; he will bring forth justice to the nations.
translation:
  language: zh_hans
  text: 看哪，我的仆人，就是我所扶持的；我所拣选、我心所喜悦的。[a]我已将我的灵放在他身上；他必把公正带给列国。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我心所喜悦的”也可译作“我所喜爱的”或“我所悦纳的”。
    reason: lexical_alternative
  - marker: b
    text: “公正”也可译作“审判”或“公理”；希伯来语 מִשְׁפָּט 可指司法裁断、公义或公正秩序。
    reason: lexical_alternative
  - marker: c
    text: 新约《马太福音》12:18把本节用于耶稣弥赛亚。
    reason: cross_reference
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意的指示词；“看哪”既保留先知话语的庄重感，也能为现代读者自然理解。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: עבד在此是身份与使命称谓；“仆人”比“奴隶”更符合这一先知性语境，同时不预先限定其具体身份。
- source_word: אֶתְמָךְ בּוֹ
  choice: 我所扶持的
  rationale: תמך与介词ב连用表达支撑、扶持；译成关系结构，既贴近原意，也与前面的“我的仆人”自然衔接。
- source_word: בְּחִירִי
  choice: 我所拣选的
  rationale: 该名词化形容词指蒙特别拣选者；此译保留所属关系和被拣选的身份。
- source_word: רָצְתָה נַפְשִׁי
  choice: 我心里喜悦他
  rationale: 原文直陈“我的נפש喜悦”；“我心里喜悦他”在现代汉语中自然，并保留神深切喜悦的表达力度。
- source_word: נָתַתִּי רוּחִי עָלָיו
  choice: 我已将我的灵赐给他
  rationale: נתן的基本义是“给、赐”，עליו表示临到或置于他身上；此译清楚表达神把自己的灵赐予仆人，而不额外说明其作用方式。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: מִשְׁפָּט可指判决、司法裁断、公义或公正秩序；在仆人面向列国的使命中，“公正”能保留较宽广的公共与司法含义。
- source_word: לַגּוֹיִם
  choice: 给列国
  rationale: גּוֹיִם在此泛指各国各族；“列国”庄重而不带后来“外邦人”一词可能具有的群体限定。
- source_word: יוֹצִיא
  choice: 带给
  rationale: 使役形态本义为“使出来、带出”；与“公正”搭配时，“带给”是自然汉语，并保留将公正带到列国面前的方向性。
theological_decisions:
- issue: 仆人的身份
  choice: 正文仅译作“我的仆人”，不直接加入弥赛亚或耶稣的身份说明。
  alternative: 将其明确解释为以色列、某位先知，或弥赛亚。
  rationale: 本节希伯来文本本身只称其为神的仆人。保持正文中性，可保留经文本身的开放性；新约对本节的应用另以脚注交代。
- issue: רוּחִי的所指
  choice: 译作“我的灵”，理解为说话者神自己的灵。
  alternative: 译作“我的气息”或指仆人的内在精神。
  rationale: 第一人称属格“我的”以及神把灵赐在仆人身上的结构，表明这里是神所赐、使仆人承担使命的灵；中文不以大小写区分，因此不额外添加称号。
- issue: מִשְׁפָּט的范围
  choice: 正文采用“公正”，保留司法裁断与公正秩序两方面的可能。
  alternative: 限定译作“审判”或“公理”。
  rationale: 本词语义范围较宽；单译“审判”容易使读者只想到定罪，单译“公理”则可能偏向抽象原则。“公正”较能保留此处的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”“仆人”“列国”保留先知文体的庄严感；句法按希伯来文的并列与同位结构适度调整，使中文朗读自然。所有解释性内容均置于脚注，不在正文中预先判定仆人的具体身份。
