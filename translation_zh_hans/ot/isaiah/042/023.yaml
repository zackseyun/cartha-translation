review_pass:
  verdict: revise
  source_fidelity: 译文正确保留了对“你们中间谁”的反问、听从／留心的呼吁，以及 לְאָחוֹר 所指向的后来的时间。可是把一个连续的问句拆作两个“谁肯”，并将两个听觉动词完全合并，略削弱了原文连续动词链的结构。
  naturalness: “好为将来”在现代普通话中搭配不完整，也使句末问号显得突兀。“以备将来”较自然、庄重，并能表达该词的面向后来的时间之意。
  terminology: “侧耳听”“留心”适合本节庄重的劝诫语体。“这话”可保留为单数指示词在汉语中的自然表达。
  issues:
  - severity: medium
    issue: “好为将来”不够自然
    rationale: 现代汉语中“为将来”通常需要补出宾语或与“着想”等词搭配；“以备将来”可自然表达“为后来的时候”的时间趋向，而不引入特定神学解释。
  - severity: low
    issue: 重复“谁肯”并合并“יַקְשִׁב וְיִשְׁמַע”
    rationale: 原文只有一个疑问代词，后接三个连续动词。汉语可保留一个“谁肯”，并以“留心聆听”体现后两个近义动词的强化关系。
  revised_text: 你们中间谁肯侧耳听这话，留心聆听，以备将来呢？
  revised_footnotes:
  - marker: a
    text: “以备将来”或译“以后”“后来”。希伯来语直译为“向后／在后”，此处可按时间理解为后来或将来。
