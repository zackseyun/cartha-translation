  yaml_path: translation/ot/isaiah/042/023.yaml
  text: Who among you will listen to this[a], will pay attention and hear hereafter?
translation:
  language: zh_hans
  text: 你们中间谁肯侧耳听这话，留心聆听，以备将来呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בָכֶם
  choice: 你们中间谁
  rationale: 疑问代词与介词短语合起来表示“你们当中谁”，保留对群体的反问语气。
- source_word: יַאֲזִין
  choice: 肯侧耳听
  rationale: אזן 的使役式表示专心倾听；“侧耳听”庄重而仍为现代汉语所理解，“肯”体现未完成式在反问中的意愿色彩。
- source_word: זֹאת
  choice: 这话
  rationale: 阴性单数指示词回指当前的信息或警告；汉语用“这话”比孤立的“这个”自然，又不扩展为复数内容。
- source_word: יַקְשִׁב וְיִשְׁמַע
  choice: 留心听
  rationale: 两个相近的听觉动词构成强化表达，重点是专注并真正听进去；汉语合译为“留心听”，避免生硬重复。
- source_word: לְאָחוֹר
  choice: 好为将来
  rationale: 字面涉及“向后／在后”，在此具有时间上的后来、将来之意；“好为将来”保留介词 לְ 的趋向或目的色彩，同时以脚注呈现真实歧义。
theological_decisions: []
translation_notes:
