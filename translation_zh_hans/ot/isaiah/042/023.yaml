revisions:
- from: 你们中间谁肯侧耳听这话，谁肯留心听，好为将来[a]？
  to: 你们中间谁肯侧耳听这话，留心聆听，以备将来呢？
  rationale: 修订使句子符合现代标准汉语，同时保留原文单一反问下连续的“听—留心—听见”呼吁。“以备将来”对应 לְאָחוֹר 的时间指向；脚注保留其“后／后来／将来”的词汇弹性。
  reviewer_model: gpt-5.6-terra
