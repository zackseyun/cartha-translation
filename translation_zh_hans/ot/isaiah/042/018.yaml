  yaml_path: translation/ot/isaiah/042/018.yaml
  text: Hear[a], you deaf; and look, you blind[b], that you may see.
translation:
  language: zh_hans
  text: 聋的人哪，听吧！瞎眼的人哪[a]，看吧，好叫你们看见。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聋的人”和“瞎眼的人”也可按名词性描述理解为“聋的人……瞎眼的人”；希伯来文带定冠词的形容词可作直接呼语，也可作名词性用法。
    reason: lexical_alternative
  - marker: b
    text: 或译“为要看见”。末句的希伯来文不定词表达目的：“看……好叫你们看见”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵרְשִׁים
  choice: 聋的人哪
  rationale: 带定冠词的形容词在此按呼语理解，直接召唤听者；用“聋的人哪”既保留具体意象，也符合现代汉语庄重的呼告语气。
- source_word: שְׁמָעוּ
  choice: 要听
  rationale: 复数命令式。译作“要听”保留先知性命令的力度，并与下句“要看”形成平行。
- source_word: וְהַעִוְרִים
  choice: 瞎眼的人哪
  rationale: 与前一呼语构成平行的直接称呼；保留“瞎眼”的具体感官意象，不在正文中解释为属灵迟钝。
- source_word: הַבִּיטוּ
  choice: 要看
  rationale: 该命令式要求有意识地观看；“要看”自然、清楚，并与“要听”相称，避免较古雅的“观看”或语义偏强的“凝视”。
- source_word: לִרְאוֹת
  choice: 好叫你们看见
  rationale: לְ加不定词在这里表达目的；“好叫你们看见”自然呈现“看，为要看见”的刻意重复和修辞张力。
theological_decisions:
- issue: “聋”和“瞎眼”是否应直接解释为属灵麻木
  choice: 正文保留具体的感官用语，由上下文显明其比喻意义
  alternative: 译作“心里麻木的人”或“属灵失明的人”
  rationale: 希伯来文使用具体的“聋”与“瞎眼”，保留原有意象可避免把解释直接写入译文，并维持本段的先知性张力。
- issue: 带定冠词的形容词是呼语还是名词性描述
  choice: 按呼语译为“聋的人哪……瞎眼的人哪”
  alternative: 译为“聋的人……瞎眼的人”
  rationale: 命令式语境支持直接呼告，但希伯来语形式本身也容许名词性理解，因此在脚注中保留另一种分析。
translation_notes:
  register: 采用现代、庄重而易懂的先知性呼告语体。以“哪”标示直接称呼，以两个“要”呈现平行命令，并保留“看……看见”的希伯来文重复。
