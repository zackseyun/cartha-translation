source:
  edition: WLC
  text: מִֽי נָתַ֨ן ל/משוסה יַעֲקֹ֛ב וְ/יִשְׂרָאֵ֥ל לְ/בֹזְזִ֖ים הֲ/ל֣וֹא יְהוָ֑ה ז֚וּ חָטָ֣אנוּ ל֔/וֹ וְ/לֹֽא אָב֤וּ בִ/דְרָכָי/ו֙ הָל֔וֹךְ וְ/לֹ֥א שָׁמְע֖וּ בְּ/תוֹרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/024.yaml
  text: Who gave Jacob over to plunder[a], and Israel to looters? Was it not Yahweh, he against whom we have sinned? They were not willing to walk in his ways[b], and they did not listen to his law.
translation:
  language: zh_hans
  text: 谁把雅各交出去，任人劫掠[a]，把以色列交给抢掠者呢？岂不是雅威——就是我们得罪的那一位吗？他们不肯在他的道路上行走，也不听从他的律法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文首句可表达“交给掠夺”或“作为掠物”；下句为“交给抢掠者”。两句描绘雅各和以色列被交出去，任人劫掠。
    reason: lexical_alternative
  - marker: b
    text: “律法”也可译作“训诲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/משוסה
  choice: 交给人掳掠
  rationale: 该名词描写被交出去成为掠物、任人劫掠；此译符合现代汉语表达，也保留受害者被交付的图景。
- source_word: לְ/בֹזְזִים
  choice: 交给抢掠者
  rationale: בזז 的分词指夺取财物的人；“抢掠者”既表达施害者身份，也与前半句构成平行。
- source_word: הֲ/לֹא יְהוָה
  choice: 岂不是雅威吗
  rationale: 反问句预期肯定回答；“雅威”音译四字神名，表明这里直接使用的是上帝的名。
- source_word: זוּ חָטָאנוּ ל/וֹ
  choice: 就是我们得罪的那一位
  rationale: זוּ 在此引出关系从句，חטא ל 表示得罪某位；“就是……的那一位”保留原文的强调，同时使汉语自然。
- source_word: וְ/לֹא אָבוּ
  choice: 他们不肯
  rationale: אבה 表示愿意；否定式可译为“不肯”，清楚传达主观上的不愿意，而不额外加强为更激烈的措辞。
- source_word: בִ/דְרָכָי/ו הָלוֹךְ
  choice: 行在他的道路上
  rationale: “行在……道路上”保留希伯来语关于生活行为的惯用比喻，在中文圣经语体中也清楚可懂。
- source_word: וְ/לֹא שָׁמְעוּ
  choice: 也不听从
  rationale: שׁמע 在此含听取并响应之意；“听从”兼顾听与顺服，又不将其简化为单纯的“服从”。
- source_word: בְּ/תוֹרָת/וֹ
  choice: 他的律法
  rationale: תורה 可指律法，也可泛指教导；本节的圣约语境支持“律法”，同时以脚注保留“训诲”这一语义可能。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接出现四字神名；“雅威”按较通行的学术重构音译，避免以称号替代专名。
- issue: “我们得罪”之后转为“他们不肯……也不听从”
  choice: 保留第一人称复数到第三人称复数的转换
  alternative: 统一译为“我们”
  rationale: 原文确有这一人称转换，可能形成共同认罪与对群体行为的描述之间的张力；不为求顺畅而消除。
- issue: זוּ 的强调作用
  choice: 就是我们得罪的那一位
  alternative: 我们得罪了他
  rationale: 独立的“就是……那一位”较充分反映 זוּ 所引出的强调性关系结构，而不把句法完全抹平。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“雅各／以色列”的诗歌平行、人称转换及“行在道路上”的行为隐喻；避免把隐含的顺服含义扩写成解释性释义。
