base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/009.yaml
  text: Behold[a], the former things have come to pass, and I declare new things; before they spring up[c][b], I announce them to you.
translation:
  language: zh_hans
  text: 看哪，先前的事[a]已经发生了[b]；我宣告新的事；在它们萌芽[c]以前，我就把它们告诉你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先前的事”也可译作“起初的事”或“早先的事”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“已经来到了”；用于事件时，可意译为“已经发生了”，也可按本段预言与成就的语境理解为“已经实现（应验）了”。
    reason: lexical_alternative
  - marker: c
    text: 原文动词本指植物“发芽”或“长出”，以尚未萌发的植物比喻还未显现的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִאשֹׁנוֹת
  choice: 先前的事
  rationale: 该复数形容词在此作名词使用，与后文“新的事”相对。“先前的事”自然清楚，也保留了它既可指先前事件、也可指先前所宣告之事的空间。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是唤起注意的指示语。“看哪”保留先知话语的庄重和强调作用，在现代中文中仍可理解。
- source_word: בָאוּ
  choice: 已经发生了
  rationale: 该词字面为“已经来到”，用于事件时可表达事情已经发生或成就。“已经发生了”符合现代中文，同时避免直接加入“应验”所带来的较强解释。
- source_word: חֲדָשׁוֹת
  choice: 新的事
  rationale: 复数形容词作名词，与“先前的事”形成简洁平行；不将其过早限定为某一类事件。
- source_word: מַגִּיד
  choice: 我现在宣告
  rationale: נגד 的使役分词表示使人知道、宣告；“现在”体现分词在本句中的进行性语气，而“宣告”符合神谕语境。
- source_word: בְּטֶרֶם
  choice: 在……以前
  rationale: 准确表达事情尚未发生前的时间关系，中文自然。
- source_word: תִּצְמַחְנָה
  choice: 它们萌芽
  rationale: 该动词本指植物发芽、生长；“萌芽”保留尚未显现之事开始出现的植物意象。
- source_word: אַשְׁמִיעַ אֶתְכֶם
  choice: 我就让你们听见
  rationale: שמע 的使役式字面意为“使你们听见”。此译保留使役结构和听觉意象；所听见的内容由上文“新的事”自然补足。
theological_decisions:
- issue: 先前之事与预言应验的关系
  choice: 正文译作“已经发生了”，并在注释中说明也可理解为“已经实现／应验”。
  alternative: 直接译作“已经应验了”。
  rationale: 上下文很可能强调神先前所宣告的事如今成就，但希伯来文 בָאוּ 本身字面只是“已经来到”，也可较一般地指过去之事已经发生。正文保留这一幅度，不把“预言应验”的解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”和“宣告”保留先知话语的郑重感；“萌芽”保存原文意象；句式依照希伯来文的对比与递进关系，用分号呈现。
