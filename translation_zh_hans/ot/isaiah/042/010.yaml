  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁ֤ירוּ לַֽ/יהוָה֙ שִׁ֣יר חָדָ֔שׁ תְּהִלָּת֖/וֹ מִ/קְצֵ֣ה הָ/אָ֑רֶץ יוֹרְדֵ֤י הַ/יָּם֙ וּ/מְלֹא֔/וֹ אִיִּ֖ים וְ/יֹשְׁבֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/010.yaml
  text: Sing to Yahweh a new song[a], his praise from the end of the earth, you who go down to the sea, and all that fills it[b], the coastlands and those who dwell in them.
translation:
  language: zh_hans
  text: 要向雅威唱一首新歌，从大地的尽头[a]赞美他！出海的人和海中万物，众海岛[b]及其居民，都要歌唱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“大地的尽头”（单数）；也可按汉语惯用表达译作“从地极”。
    reason: lexical_alternative
  - marker: b
    text: 或译“沿海各地”；这个希伯来词既可指岛屿，也可泛指遥远的沿海地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: 要……唱
  rationale: 这是复数命令式。用“要……唱”自然表达面向众人的直接呼召。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 原文直接使用四字神名יהוה；“雅威”保留其作为上帝圣约之名的性质。
- source_word: שִׁיר חָדָשׁ
  choice: 一首新歌
  rationale: 直译清楚自然，也保留因上帝作为而献上崭新赞美的表达。
- source_word: תְּהִלָּתוֹ
  choice: 赞美他
  rationale: 希伯来语名词直译为“他的赞美”，在此与“唱”平行；汉语用动词“赞美他”更自然，同时不增添解释。
- source_word: מִקְצֵה הָאָרֶץ
  choice: 从大地的尽头
  rationale: 保留原文单数“尽头”的形式和从遥远边界发出赞美的意象。
- source_word: יוֹרְדֵי הַיָּם
  choice: 出海的人
  rationale: 原文意为“下到海里／海上去的人”。“出海的人”在现代汉语中自然，并保留航向海上的动态含义。
- source_word: וּמְלֹאוֹ
  choice: 海中万物
  rationale: 原文为“充满它的一切”。“海中万物”简明地表达海里所有受造之物，避免生硬的“充满海的一切”。
- source_word: אִיִּים
  choice: 众海岛
  rationale: 该词可指岛屿，也可泛指遥远的沿海地区；正文采用基本意义“海岛”，并以脚注保留较宽泛的地理含义。
- source_word: וְיֹשְׁבֵיהֶם
  choice: 及其居民
  rationale: 准确表达“住在它们之中的人”，并与“众海岛”形成简洁自然的搭配。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名。译作“雅威”旨在保留专名性质，而不以称号取代，也不采用较晚形成的混合读音。
- issue: 海与海岛是否被拟人化为赞美者
  choice: 保留“海中万物”和“众海岛”都参与歌唱的诗性表达
  alternative: 仅把出海者和海岛居民理解为歌唱者
  rationale: 希伯来诗句把人、海中一切、海岛及其居民并列；正文不缩窄范围，以保留受造界共同赞美的诗意与句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为使希伯来语末尾连续列举的赞美者在汉语中句法完整，末尾补出原命令所支配的“都要歌唱”；这不是新增独立信息。
