base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/017.yaml
  text: They will be turned back[a]; they will be utterly put to shame—those who trust in an idol, who say to a cast image[d][c][b], “You are our gods.”
translation:
  language: zh_hans
  text: 信靠雕刻的偶像、对铸像[c]说：“你们是我们的神明”的人，必退后[a]，必大大蒙羞[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必退后”也可译作“必败退”或“必被迫退后”；希伯来语动词既可指自行退却，也可指受挫而退。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近似“因羞辱而羞愧”，以同根词加强语气，意思是彻底蒙羞。
    reason: lexical_alternative
  - marker: c
    text: “雕刻的偶像”和“铸像”对应希伯来文两个不同的造像用语；引语中的“你们”和“神明”在希伯来文中都是复数。
    reason: alternative_reading
lexical_decisions:
- source_word: נָסֹגוּ אָחוֹר
  choice: 必退后
  rationale: נסג与אָחוֹר合起来表示向后退、退却，也可能含有被迫败退的结果意味。结合上下文的审判语气，用“必退后”自然地表达其将来性，同时保留主动退却与受挫而退之间的张力。
- source_word: יֵבֹשׁוּ בֹשֶׁת
  choice: 蒙受极大的羞辱
  rationale: 动词בוש与同根名词בֹשֶׁת构成强调表达。汉语不宜机械译成“羞愧羞愧”，故以“蒙受极大的羞辱”传达强烈程度及公开受辱的意味。
- source_word: הַבֹּטְחִים
  choice: 信靠……的人
  rationale: 实词化分词描述这一类人的持续特征；“信靠”比单纯“相信”更能表达倚赖、寄托的含义。
- source_word: בַּפָּסֶל
  choice: 信靠雕像
  rationale: פֶּסֶל指为崇拜而制造、通常经雕刻的像。“雕像”保留制作方式，与后面的“铸像”形成原文中两个不同术语的对应；语境已清楚表明其偶像性质。
- source_word: הָאֹמְרִים לְמַסֵּכָה
  choice: 对铸像说
  rationale: מַסֵּכָה通常指浇铸而成的金属像；“铸像”简洁准确，并保留制造工艺的意味。
- source_word: אַתֶּם אֱלֹהֵינוּ
  choice: 你们是我们的神明
  rationale: אַתֶּם和אֱלֹהֵינוּ在形式上均为复数，故保留“你们／神明”的复数，不擅自顺成单数。“神明”在现代汉语中可自然指多个受崇拜对象。
theological_decisions:
- issue: פֶּסֶל与מַסֵּכָה两个偶像术语的处理
  choice: 分别译作“雕像”和“铸像”
  alternative: 分别译作“偶像”和“铸造的像”，或两者都译作“偶像”
  rationale: 原文有意使用两个不同的人工造像术语。分别译出其雕刻与浇铸的特征，可保留修辞层次，并避免将两词合并而损失信息。
- issue: 偶像崇拜者话语中אֱלֹהֵינוּ的数
  choice: 保留复数“我们的神明”并以“你们”呼应
  alternative: 按汉语习惯顺为单数“你是我们的神”
  rationale: 希伯来文的代词和名词均呈复数。保留复数既忠实于语法，也不替文本消解其可能指向多个造像或集合性对象的含混。
- issue: נָסֹגוּ的主动与结果性意味
  choice: 正文译“必退后”，脚注说明也可理解为“必败退／被迫退后”
  alternative: 直接译作“必被击退”
  rationale: 词形本身可表示退后、退却，语境又容许受审判而败退的结果意味。正文不把被动因果说死，以脚注保存这一语义范围。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。句首先交代被审判者，再落到“退后、蒙羞”的结局，符合汉语信息结构；保留“雕像／铸像”的词义区别及末句复数，不加入特定宗派解释。
