  text: יִשְׂא֤וּ מִדְבָּר֙ וְ/עָרָ֔י/ו חֲצֵרִ֖ים תֵּשֵׁ֣ב קֵדָ֑ר יָרֹ֨נּוּ֙ יֹ֣שְׁבֵי סֶ֔לַע מֵ/רֹ֥אשׁ הָרִ֖ים יִצְוָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/011.yaml
  text: Let the wilderness and its cities lift up their voice[a], the settlements where Kedar dwells; let the inhabitants of Sela sing for joy; let them shout from the tops of the mountains.
translation:
  language: zh_hans
  text: 愿旷野和其中的城邑，连基达居住的村落，都扬起声音；愿西拉[a]的居民欢呼歌唱，愿他们从群山之巅高声呼喊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西拉”或译“岩石”；若把 סֶלַע 视为普通名词，而非地名，本句可译为“愿住在岩石中的人欢呼歌唱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: 扬起声音
  rationale: 该词在此处属于表达号召或愿望的未完成式序列，原文未明说宾语；结合赞美的语境补出“声音”，使现代汉语自然，同时保留“举起、扬起”的意象。
- source_word: מִדְבָּר
  choice: 旷野
  rationale: “旷野”符合先知文学的常用语体，也能自然承载此处地域拟人化参与赞美的诗意。
- source_word: וְעָרָיו
  choice: 和其中的城邑
  rationale: 第三人称阳性单数后缀最自然地回指“旷野”；译作“其中的”既准确表达归属，又避免汉语中不必要的性别化拟人。
- source_word: חֲצֵרִים
  choice: 村落
  rationale: 该词指无城墙的聚居地，也可涵盖与基达相关的半游牧聚落；“村落”简洁、清楚，并保持诗歌语体。
- source_word: תֵּשֵׁב קֵדָר
  choice: 基达居住的
  rationale: 以关系修饰语表达原文，简明自然；“基达”保留为专名，可指与阿拉伯地区相关的族群或地域。
- source_word: יָרֹנּוּ
  choice: 欢呼歌唱
  rationale: רנן兼有喜乐歌唱与欢声呼喊之意；“欢呼歌唱”同时传达声音和喜乐的色彩。
- source_word: יֹשְׁבֵי
  choice: 居民
  rationale: 该分词名词指居住在某地的人；“居民”是简洁自然的现代汉语表达。
- source_word: סֶלַע
  choice: 西拉
  rationale: 本节与“基达”并列，且后接“居民”，较可能是地名，因此音译为“西拉”；其作为普通名词“岩石”的可能性保留在脚注中。
- source_word: מֵרֹאשׁ הָרִים
  choice: 从群山之巅
  rationale: 该短语表示从众山的顶部或峰巅发声；此译保留复数群山的图景，并符合庄重诗歌语体。
- source_word: יִצְוָחוּ
  choice: 高声呼喊
  rationale: צוח表示响亮地喊叫；在赞美语境中，“高声呼喊”传达热烈的公开颂扬，而不限定为悲痛呼号。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。连续使用“愿”来反映希伯来文未完成式在号召性序列中的意愿色彩；用“连……都……”把“基达居住的村落”自然纳入前一分句的复数主语。脚注标记紧随存在词义歧义的“西拉”。
