base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/020.yaml
  text: You have seen many things[a], but you do not observe; his ears are open, but he does not hear.
translation:
  language: zh_hans
  text: 你看见了许多事，却不留意；他的耳朵开着，他却听不见。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文前半节用第二人称“你”，后半节则转为第三人称“他的／他”。有些译本将后半节统一译作“你的／你”。
    reason: 说明原文的人称转换及另一种译法
lexical_decisions:
- source_word: ראית
  choice: 你看见了
  rationale: ראה的Qal完成式第二人称阳性单数；“看见了”既保留完成体意味，也符合先知责备的语境。
- source_word: רַבּוֹת
  choice: 许多事
  rationale: 阴性复数形容词在此作名词用；“许多事”是自然、简明的现代汉语表达。
- source_word: וְלֹא תִשְׁמֹר
  choice: 却不留意
  rationale: שׁמר可指看守、谨守或留心；在“看见”却未作回应的语境中，“不留意”自然表达其未加关注之意，同时避免误解为字面的守卫。
- source_word: פָּקוֹחַ אָזְנַיִם
  choice: 耳朵敞开
  rationale: 保留“敞开”与“耳朵”的感官意象，不将其解释性地改译为“留心听”。
- source_word: וְלֹא יִשְׁמָע
  choice: 他却听不见
  rationale: שמע的Qal未完成式第三人称阳性单数；“听不见”保持与耳朵的感官对应，并明确保留原文转为第三人称的现象。
theological_decisions:
- issue: 本节中语法人称的转换
  choice: 前半句保留第二人称“你”，后半句按马所拉文本转为第三人称“他的／他”
  alternative: 统一为第二人称：“你的耳朵敞开，你却听不见”
  rationale: 原文由第二人称单数转为第三人称单数，这一修辞张力可能与上下文对仆人／百姓的责备有关；译文不擅自将其统一。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不留意”比“没有看守”更符合感知而不回应的上下文；保留“耳朵敞开／听不见”的具体意象和原文突兀的人称转换。
