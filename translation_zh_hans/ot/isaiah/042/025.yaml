source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֤ךְ עָלָי/ו֙ חֵמָ֣ה אַפּ֔/וֹ וֶ/עֱז֖וּז מִלְחָמָ֑ה וַ/תְּלַהֲטֵ֤/הוּ מִ/סָּבִיב֙ וְ/לֹ֣א יָדָ֔ע וַ/תִּבְעַר בּ֖/וֹ וְ/לֹא יָשִׂ֥ים עַל לֵֽב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/025.yaml
  text: So he poured out on him the heat of his anger and the might of battle[a]; it set him ablaze all around, but he did not know; it burned in him[d][c][b], but he did not take it to heart.
translation:
  language: zh_hans
  text: 于是，他把他炽烈的怒气和战争的威力[a]倾倒在他身上；它从四面烧着他，他却不知道；它在他里面燃烧[b]，他却不放在心上。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战争的威力”也可译作“战争的猛烈”或“战争的凶猛”。
    reason: lexical_alternative
  - marker: b
    text: “在他里面燃烧”也可译作“烧着他”；原文的介词也可按语境理解为“在他身上”。
    reason: lexical_alternative
  - marker: c
    text: 本节的“他”指雅各、以色列，即把整个民族人格化为一个人。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁפֹּךְ
  choice: 倾倒
  rationale: 保留שׁפך“倾倒”的具体比喻，表达上帝将审判倾泻在人身上。
- source_word: חֵמָה אַפּוֹ
  choice: 自己的烈怒
  rationale: חֵמָה与אַף叠加强烈愤怒之意；“烈怒”自然凝练，也与下文燃烧意象相呼应。
- source_word: וֶעֱזוּז מִלְחָמָה
  choice: 战争的猛烈
  rationale: עֱזוּז可指强力、猛烈或凶猛；“战争的猛烈”保留名词结构及其一定的词义开放性。
- source_word: וַתְּלַהֲטֵהוּ מִסָּבִיב
  choice: 火焰从四面烧着他
  rationale: 动词表达火焰炽烈烧灼；补出“火焰”使现代汉语主语清楚，同时保留下文连续的火焰比喻。
- source_word: וְלֹא יָדָע
  choice: 他却不知道
  rationale: 紧贴ידע的基本义“知道”，并保留他未察觉或未领会审判意义的含混。
- source_word: וַתִּבְעַר בּוֹ
  choice: 火在他身上燃烧
  rationale: בּוֹ可理解为“在他里面、身上”或“烧着他”；“在他身上”既自然，也不把意义过度限定为内在感受。
- source_word: וְלֹא יָשִׂים עַל לֵב
  choice: 他却不放在心上
  rationale: 这是现代汉语中与“置于心上”相近的惯用表达，传达留意、认真看待并领会之意。
theological_decisions:
- issue: 单数代词所指
  choice: 保留“他”，按上下文指被人格化为一个人的以色列民。
  alternative: 为清楚起见译作复数“他们”。
  rationale: 希伯来文全节持续使用阳性单数；保留单数可呈现先知书将群体人格化的文学形式。
- issue: 各审判动作的主语
  choice: 首句以“他”指上帝；后两句转用“火焰／火”表达所倾倒审判产生的作用。
  alternative: 各句均明确以上帝为主语。
  rationale: 原文首句主语承接上文为上帝，随后阴性单数动词可回指烈怒或战争之力所形成的审判；译文不强行把所有动作都改成上帝直接施行。
- issue: ידע所表达的认知程度
  choice: 译作“不知道”，保留可能兼含未察觉、未领会的张力。
  alternative: 译作“不明白”。
  rationale: “不明白”会明确限定为理解失败；原文ידע较宽，宜避免提前消解其歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“倾倒”“烈怒”“燃烧”维持全节连贯的审判与火焰意象；分号保留希伯来诗句动作递进和两次“却不”的对照。
