- from: 耶和华如勇士出战，如久经战阵的人[a]激起热忱[b]。他高声呐喊，更发出战吼；面对仇敌，他显出刚强[c]。
  to: 耶和华如勇士出战，如久经战阵的人[a]激起热忱[b]。他高声呐喊，更发出战吼；他必胜过仇敌[c]。
  rationale: 将末句改为“他必胜过仇敌”，明确表达原文对仇敌占优势、得胜的意思；脚注保留“显出强大”这一较贴近反身形态的译法。脚注b改用“嫉妒／妒忌”作为直接词义替代，以中性保留原文歧义。其余措辞可保留。
