id: ISA.42.13
reference: Isaiah 42:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָה֙ כַּ/גִּבּ֣וֹר יֵצֵ֔א כְּ/אִ֥ישׁ מִלְחָמ֖וֹת יָעִ֣יר קִנְאָ֑ה יָרִ֨יעַ֙ אַף יַצְרִ֔יחַ עַל אֹיְבָ֖י/ו יִתְגַּבָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/013.yaml
  text: Yahweh goes out like a mighty warrior[a]; like a man of war he stirs up zeal. He shouts, yes, he raises a battle cry[c][b]; over his enemies he shows himself mighty.
translation:
  language: zh_hans
  text: 耶和华如勇士出战，如久经战阵的人[a]激起热忱[b]。他高声呐喊，更发出战吼；他必胜过仇敌[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“如战争之人”，其中“战争”为复数，指惯于征战的战士。
    reason: 原文形式与文化表达说明
  - marker: b
    text: “热忱”也可译作“嫉妒”或“妒忌”；希伯来词קִנְאָה可指热忱，也可指嫉妒。
    reason: 词义歧义
  - marker: c
    text: 也可译作“他在仇敌面前显出强大”。
    reason: 句法与词义替代译法
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，不以“主”这一称号替代。
- source_word: כַּגִּבּוֹר יֵצֵא
  choice: 如勇士出战
  rationale: גִּבּוֹר在本节军事语境中指勇猛的战士；“出战”自然表达יֵצֵא的“出去、出发”，并保留上下文的出征图景。
- source_word: כְּאִישׁ מִלְחָמוֹת
  choice: 如久经战阵的人
  rationale: 原文直译为“如一个战争之人”，其中“战争”为复数；此译法以自然中文表达善战、惯战之人，同时保留与前句相互平行而不完全重复的措辞。
- source_word: יָעִיר קִנְאָה
  choice: 激起热忱
  rationale: קִנְאָה可指热忱、妒忌或忌邪；在神出战的语境中，“热忱”最自然地传达强烈而付诸行动的情感，同时以脚注保留“忌邪”的契约性含义。
- source_word: יָרִיעַ אַף יַצְרִיחַ
  choice: 他高声呐喊，更发出战吼
  rationale: 两个动词形成递进，均指大声呼喊；“更”表达אַף的加强作用，“战吼”则由全节明确的军事语境支持。
- source_word: עַל אֹיְבָיו יִתְגַּבָּר
  choice: 面对仇敌，他显出刚强
  rationale: יִתְגַּבָּר为反身形态，可表示显出强大或取得优势；“显出刚强”保留反身意味，并呼应前面的“勇士”，而脚注注明“胜过”的动态译法。
theological_decisions:
- issue: 如何呈现耶和华的战士形象
  choice: 保留出战、战阵、呐喊、战吼和仇敌等强烈军事措辞
  alternative: 将画面淡化为一般性的能力或拯救
  rationale: 原文连续采用明确的战争意象；忠实翻译不应弱化神与仇敌交战的张力，也不应添加原文未说明的战争细节。
- issue: 神的קִנְאָה如何翻译
  choice: 正文译作“热忱”
  alternative: 译作“忌邪”或“嫉妒”
  rationale: 该词确有多重含义。“热忱”在本节出战语境中自然且避免现代汉语“嫉妒”的负面误解；“忌邪”仍是可能的契约性理解，故收入脚注。
- issue: 末句是显出能力还是宣告得胜
  choice: 正文保留“显出刚强”的反身意味
  alternative: 译作“胜过仇敌”
  rationale: יִתְגַּבָּר既可强调显出强大，也可按结果译为占上风或获胜；正文尽量保存词形及与גִּבּוֹר的词根呼应，脚注保留结果性读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“久经战阵的人”避免生硬直译“战争之人”，同时保存诗句的军事意象和平行结构；“高声呐喊，更发出战吼”呈现原文两动词的递进力度。
