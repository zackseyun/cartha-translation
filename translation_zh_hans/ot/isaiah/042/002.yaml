  yaml_path: translation/ot/isaiah/042/002.yaml
  text: He will not cry out or raise his voice[a], or make his voice heard in the street.
translation:
  language: zh_hans
  text: 他不呼喊，也不扬声[a]，也不在街上让人听见他的声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扬声”原文直译为“举起”；这里可理解为“举起声音”，即提高声音。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִצְעַק
  choice: 呼喊
  rationale: צעק表示大声呼叫，常用于困苦中的呼求或公开呼喊；“呼喊”既保留声音响亮、面向公众的含义，又不额外强调悲痛情绪。
- source_word: יִשָּׂא
  choice: 扬声
  rationale: נשׂא本义为“举起、抬起”；此处与后句“他的声音”平行，省略的宾语可理解为“声音”。“扬声”自然凝练，也保留诗句的节奏。
- source_word: יַשְׁמִיעַ
  choice: 让……听见
  rationale: שׁמע的使役式表示“使人听见”。译为“不让人在……听见”保留使役含义，并符合现代汉语表达。
- source_word: בַּחוּץ
  choice: 在街上
  rationale: חוּץ可指外面或公共空间，在此描绘公开发声的场景；“在街上”具体而自然，同时不加入“市场”等原文没有的限定。
- source_word: קוֹלוֹ
  choice: 他的声音
  rationale: קוֹל在言说语境中通常指“声音”；明确译出所属关系，保留原文第三分句的焦点。
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: 不……也不……不……
  rationale: 三个否定构成有节奏的并列。汉语用“不……也不……”自然呈现连续否定，同时避免机械重复。
theological_decisions:
- issue: 仆人之歌语境中未完成式动词的时间与体貌
  choice: 采用不标明时间的特征性陈述：“他不……”
  alternative: 采用明确将来表达：“他必不……”
  rationale: 这些未完成式既可在先知性语境中指向将来的行动，也可描述仆人的一贯行事方式。现代汉语不标明时间的陈述能保留这种张力，避免把原文的体貌范围过早限定为单纯将来。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；三段否定保持希伯来诗句的简洁和平行结构。“街上”呈现公共空间意象，“扬声”则避免冗长重复“声音”。
