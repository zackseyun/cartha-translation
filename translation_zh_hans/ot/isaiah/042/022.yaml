  text: וְ/הוּא֮ עַם בָּז֣וּז וְ/שָׁסוּי֒ הָפֵ֤חַ בַּֽ/חוּרִים֙ כֻּלָּ֔/ם וּ/בְ/בָתֵּ֥י כְלָאִ֖ים הָחְבָּ֑אוּ הָי֤וּ לָ/בַז֙ וְ/אֵ֣ין מַצִּ֔יל מְשִׁסָּ֖ה וְ/אֵין אֹמֵ֥ר הָשַֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/022.yaml
  text: But this is a people plundered and pillaged[a], all of them trapped in holes and hidden away in prison houses. They have become spoil, with no one to rescue them; plunder, with no one saying, “Restore!”
translation:
  language: zh_hans
  text: 但这是一群遭抢掠、被劫夺的人；他们全都困在坑洞中[a]，被藏在监牢里。他们成了战利品，无人搭救；成了掠物，无人说：“归还吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在坑洞中”也可能译作“在年轻人中”；若按 בַּחוּרִים 更常见的含义理解，就是“年轻人”，但上下文较支持“洞穴”或“坑洞”之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא עַם
  choice: 但这群人
  rationale: 按上下文将单数代词理解为集体性的“这群人”，并用“但”表达语境中的转折；现代汉语无需生硬译出“他是一个民族”。
- source_word: בָּזוּז וְשָׁסוּי
  choice: 遭人抢夺，被人劫掠
  rationale: 保留两个近义被动词所形成的强化和平行效果，并传达战争或暴力掠夺的语感。
- source_word: הָפֵחַ
  choice: 困
  rationale: 此处词形和含义较难确定；结合后面的处所短语，译为“困”能清楚表达陷入而无法逃脱的状态。
- source_word: בַּחוּרִים
  choice: 在洞穴中
  rationale: 上下文与平行句“藏在牢房里”支持“洞穴、坑洞”一类意义；较常见的“年轻人中”另列脚注，以保存文本歧义。
- source_word: וּבְבָתֵּי כְלָאִים הָחְבָּאוּ
  choice: 藏在牢房里
  rationale: “牢房”自然表达“拘禁之屋”，“藏在”保留被隐藏、被关在不见之处的状态。
- source_word: הָיוּ לָבַז
  choice: 他们成了战利品
  rationale: היה ל־ 表示“成为”；“战利品”体现被掠夺所得之物的战争语境。
- source_word: וְאֵין מַצִּיל
  choice: 无人搭救
  rationale: 简洁保留 אֵין 的无人存在之意和分词“搭救者”的功能。
- source_word: מְשִׁסָּה
  choice: 成了掠物
  rationale: 与前面的“战利品”构成同义平行，同时避免中文完全重复。
- source_word: וְאֵין אֹמֵר הָשַׁב
  choice: 无人说：‘归还吧！’
  rationale: 将祈使式 הָשַׁב 保留为向掠夺者发出的直接命令，不擅自补明被归还的是人、财物还是土地。
theological_decisions:
- issue: וְהוּא 中单数代词的所指
  choice: 按集体意义译为“这群人”
  alternative: 较字面地译作“他”或“它”
  rationale: 紧接的 עַם 表明所描述的是整体性的人民；这是语法和篇章判断，不额外引入神学解释。
- issue: 末句“归还”的宾语
  choice: 不补出宾语
  alternative: 译为“把他们送回来”或“归还所掠之物”
  rationale: 希伯来文本只保留命令“归还”，宾语未明；不补足可保存原文的开放性和张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“遭人抢夺，被人劫掠”保留希伯来文近义双词的力度；后半节以短句和平行结构重现哀叹语气。
