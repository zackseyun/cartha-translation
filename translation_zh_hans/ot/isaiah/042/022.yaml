revisions:
- from: 但这群人遭人抢夺，被人劫掠；他们全都困在洞穴中[a]，藏在牢房里。他们成了战利品，无人搭救；成了掠物，无人说：“归还吧！”
  to: 但这是一群遭抢掠、被劫夺的人；他们全都困在坑洞中[a]，被藏在监牢里。他们成了战利品，无人搭救；成了掠物，无人说：“归还吧！”
  rationale: 修订仅澄清原文的语法语态并微调困难词的中文对应：以“被藏在监牢里”保留被动意义；以“坑洞”表达所采纳的处所义。其余保留原译的平行、力度及末句宾语的开放性。
