  terminology: “战利品／掠物”“搭救”“归还”均处理妥当，且没有擅自补出“归还”的宾语。为保持原文两个近义受害动词的平行，采用“遭抢掠、被劫夺”。“监牢”比“牢房”更适合对应“拘禁之屋”的复数、概括性表达。
