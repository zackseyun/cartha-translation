base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/019.yaml
  text: Who is blind but my servant[a], and deaf like my messenger whom I send? Who is blind like the one who is at peace, and blind like the servant of Yahweh?
translation:
  language: zh_hans
  text: 除了我的仆人，谁是瞎眼的？除了我所差遣的使者，谁是耳聋的？谁瞎眼像那安好的人[a]？谁瞎眼像耶和华的仆人？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安好的人”：希伯来语 מְשֻׁלָּם 含义不易确定；也可理解为“完全／完好的人”“无可指责的人”，或“得了报偿的人”。此词可能带有完整、健全、安宁或和睦的含义。
    reason: 保留 מְשֻׁלָּם 的词义歧义，不把有争议的解释定为正文唯一读法。
lexical_decisions:
- source_word: עִוֵּר
  choice: 瞎眼
  rationale: 这是该词的常用义；全节三次采用同一译法，以保留原文反复质问的修辞力量。
- source_word: חֵרֵשׁ
  choice: 耳聋
  rationale: 与“瞎眼”并列，构成先知责备中鲜明的感官意象；此处用直白有力的常用表达。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: עבד 可指奴仆或仆役；在《以赛亚书》的语境中，“仆人”既自然，也能延续全书相关称谓。
- source_word: מַלְאָכִי
  choice: 我的使者
  rationale: מלאך 可指使者或天使；本节与“我的仆人”平行，又有“我所差遣的”这一说明，因此指受差派者的“使者”更合语境。
- source_word: אֶשְׁלָח
  choice: 我所差遣的
  rationale: 希伯来语为第一人称未完成式；汉语用关系结构修饰“使者”，不额外限定为过去或将来。
- source_word: מְשֻׁלָּם
  choice: 那安好的人
  rationale: 此词来自 שלם 的语义范围，可能涉及完整、安好、无可指责或关系和睦；“安好的人”保留其正面状态及本节反讽意味，又不添入原文没有明说的“与我”。歧义在脚注中说明。
- source_word: עֶבֶד יְהוָה
  choice: 耶和华的仆人
  rationale: 按原文所属结构直译，并与前文“我的仆人”保持呼应。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中通行且可辨识的神名译法。
- source_word: כִּי אִם
  choice: 竟像
  rationale: 原短语在反问中有“除了……还有谁”的排他力量；结合后续三个 כְּ 比较结构，汉语以连续的“竟像”形成自然而强烈的责问。
theological_decisions:
- issue: “我的仆人／我的使者”所指何人
  choice: 保留称谓，不在正文中进一步指明身份
  alternative: 明确译作以色列、先知或理想的仆人形象
  rationale: 本节只用受约与受差派的称谓，并未明说更具体的对象；译文保留这一神学张力。
- issue: מְשֻׁלָּם 的含义
  choice: 正文译作“那安好的人”
  alternative: “那完全的人”“那无可指责的人”或“那得了报偿的人”
  rationale: 该词词义及其在本节中的用法有争议。“安好”可体现 שלם 所含的完整、平安语义，同时避免把关系对象“与我”加入正文；其他主要可能性收入脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。四个反问以重复句式呈现原文的责备力度；“瞎眼”“耳聋”保留先知话语的直接性。脚注标记紧接真正存在词义争议的“那安好的人”。
