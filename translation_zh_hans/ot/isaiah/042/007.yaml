base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/007.yaml
  text: to open blind eyes[a], to bring a prisoner out from confinement[c][b], from the prison house those who sit in darkness.
translation:
  language: zh_hans
  text: 为要开启失明的眼睛[a]，把囚犯从禁闭之处[b]领出来，把坐在黑暗中的人[c]从牢房里领出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“盲人的眼睛”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“从囚牢”或“从监牢”；希伯来语此词既可指拘禁，也可指拘禁人的场所。
    reason: lexical_alternative
  - marker: c
    text: 或译：“住在黑暗中的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְקֹחַ
  choice: 开启
  rationale: 不定式表示目的；“开启”与“眼睛”搭配自然，也保留原文使眼睛张开的具体意象。
- source_word: עֵינַיִם עִוְרוֹת
  choice: 失明的眼睛
  rationale: 形容词直接修饰“眼睛”；此译保留原文结构与意象，同时符合现代汉语表达。
- source_word: לְהוֹצִיא
  choice: 领出来
  rationale: 使役形式表达使人出去；“领出来”既自然，又能体现受差遣者实施释放的行动。
- source_word: מִמַּסְגֵּר
  choice: 从禁闭之处
  rationale: 该词可指拘禁状态或受拘禁的场所；“禁闭之处”避免把其建筑形态限定得过于具体。
- source_word: אַסִּיר
  choice: 囚犯
  rationale: 原文为代表性的单数名词；汉语“囚犯”可自然表达这一泛指意义。
- source_word: מִבֵּית כֶּלֶא
  choice: 从牢房里
  rationale: 原文直译近于“监禁之屋”；“牢房”保留具体拘禁场所的意象，且现代读者容易理解。
- source_word: יֹשְׁבֵי חֹשֶׁךְ
  choice: 坐在黑暗中的人
  rationale: ישב可表示坐、居住或停留；“坐在黑暗中”保留诗歌中的鲜明动作和处境意象。
theological_decisions:
- issue: 失明、囚禁和黑暗的字面与象征范围
  choice: 正文保留具体意象，不明说其为属灵光照或释放。
  alternative: 直接解释为使人在属灵上看见，并使其脱离属灵捆绑。
  rationale: 本节原文容纳现实与象征两层共鸣，却没有在措辞中明确限定其范围；译文应保留这种张力。
- issue: 后两个诗行的对象关系
  choice: 按希伯来诗歌的平行结构，将“囚犯”和“坐在黑暗中的人”分别与两个介词短语对应，并在汉语中补出第二个“领出来”。
  alternative: 把后半节处理为单一连续结构，使“坐在黑暗中的人”成为前面“囚犯”的补充说明。
  rationale: 原文语法简练，存在一定结构含混；按平行诗句处理最自然，但不把两类人的现实或象征身份作进一步区分。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“为要”承接上下文中的使命目的；两个“领出来”明确呈现希伯来诗歌的平行关系。正文不增加属灵化解释。
