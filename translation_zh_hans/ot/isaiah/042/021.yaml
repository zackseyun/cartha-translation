revisions:
- from: 耶和华因自己的公义[a]而喜悦，要使训诲[b]尊大，并使它尊荣。
  to: 耶和华为自己的公义[a]，乐意使律法[b]显为伟大，并使它得尊荣。
  rationale: 修订消除“要”所增加的语气，使“乐意”自然统摄后面的行动；以“显为伟大，并使它得尊荣”分别表达两个并列使役动词。将正文改为“律法”更贴合本节语境，同时在脚注保留torah的较广词义。对לְמַעַן的动机、缘由和目的之间的开放性以脚注保留，避免过度定论。
