base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/021.yaml
  text: Yahweh was pleased[a], for the sake of his righteousness[c][b], to make the law great and glorious.
translation:
  language: zh_hans
  text: 耶和华为自己的公义[a]，乐意使律法[b]显为伟大，并使它得尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”或译“正义”。“为自己的公义”也可理解为“因自己的公义”或“为了自己的公义”。
    reason: alternative_reading
  - marker: b
    text: 希伯来语为 torah，也可译作“训诲”或“教导”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行的专名“耶和华”表达四字神名，不以“主”这一称号替代。
- source_word: חָפֵץ
  choice: 喜悦
  rationale: 该词可指喜爱、乐意或意愿；“喜悦”简洁自然，保留耶和华对此行动的赞许与意愿。
- source_word: לְמַעַן צִדְקוֹ
  choice: 因自己的公义
  rationale: לְמַעַן在此表达行动所据的缘由或所为的目的；“因……而”中文自然，但不把其语义严格限定为单纯原因。反身用语“自己的”明确后缀所指为耶和华。
- source_word: צִדְקוֹ
  choice: 自己的公义
  rationale: צדק兼有公义、正义等意义；正文采用较宽广且具圣经语体的“公义”，另以脚注保留“正义”。
- source_word: יַגְדִּיל
  choice: 使……尊大
  rationale: 使役形表达“使之为大、彰显其伟大”；“尊大”与后面的“尊荣”形成庄重而自然的平行。
- source_word: תּוֹרָה
  choice: 训诲
  rationale: תּוֹרָה既可指律法，也可泛指教导或训诲。此处不用定冠信息强行限定为摩西律法，采用“训诲”保留词义广度，并在脚注列出“律法、教导”。
- source_word: וְיַאְדִּיר
  choice: 并使它尊荣
  rationale: 使役形意为使之宏伟、荣美或尊荣；明确补出宾语“它”，忠实呈现与יַגְדִּיל并列的第二个使役动词。
theological_decisions:
- issue: צִדְקוֹ所表达的耶和华属性
  choice: 公义
  alternative: 正义
  rationale: “公义”可涵盖道德正直、信实及公正作为，不将本句收窄为司法意义；“正义”仍是可成立的理解，故列入脚注。
- issue: תּוֹרָה在本节的范围
  choice: 训诲
  alternative: 律法
  rationale: 希伯来词既可能专指律法，也可能泛指神的教导；正文以“训诲”保留范围上的开放性，脚注注明其他译法，避免未经文本证明便锁定为特定法典。
- issue: לְמַעַן的逻辑关系
  choice: 因……而
  alternative: 为了……的缘故
  rationale: 该介词可表达缘由、动机或目的。中文正文以自然表达呈现耶和华的公义与其行动之间的依据关系，同时不作进一步神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“使……尊大，并使它尊荣”保留原文两个并列使役动词的形式与力度；脚注标记均置于正文相应词语之后。
