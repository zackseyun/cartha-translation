  text: וְ/שִֽׁעֲשַׁ֥ע יוֹנֵ֖ק עַל חֻ֣ר פָּ֑תֶן וְ/עַל֙ מְאוּרַ֣ת צִפְעוֹנִ֔י גָּמ֖וּל יָד֥/וֹ הָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/008.yaml
  text: The nursing child will play over the cobra’s hole[b][a], and the weaned child will put his hand on the viper’s den.
translation:
  language: zh_hans
  text: 吃奶的婴孩必在眼镜蛇[a]的洞口玩耍；断奶的幼儿必把手放在毒蛇的洞穴上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眼镜蛇”或译“阿斯普蛇”。希伯来词指一种毒蛇，具体蛇种不能确定；传统上常认作阿斯普蛇或眼镜蛇。
    reason: lexical_alternative
  - marker: b
    text: “把手放在”或译“把手伸向”。这里的希伯来动词可表示放置或伸出手。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁעֲשַׁע
  choice: 玩耍
  rationale: 此处描绘幼小孩子在致命危险附近仍安然无惧；“玩耍”自然地表达了无忧无虑的活动，也符合该动词在本语境中的含义。
- source_word: יוֹנֵק
  choice: 吃奶的婴孩
  rationale: 该词指仍在吃奶的孩子；这一译法清楚保留其成长阶段，并与下半句“断奶的幼儿”形成对应。
- source_word: חֻר
  choice: 洞口
  rationale: 该名词指洞穴或孔洞；结合蛇的居所以及介词 עַל，“洞口”在中文中自然、形象。
- source_word: פָּתֶן
  choice: 眼镜蛇
  rationale: 该词泛指一种剧毒蛇，传统上常被认作蝮蛇或眼镜蛇；正文采用现代读者容易理解的“眼镜蛇”，并以脚注说明物种辨认的不确定性。
- source_word: מְאוּרַת
  choice: 巢穴
  rationale: 该词在这里指蛇栖居的洞穴；“巢穴”能与前句“洞口”形成诗意变化，同时不改变基本意象。
- source_word: צִפְעוֹנִי
  choice: 毒蛇
  rationale: 该词所指的精确蛇种不能确定，但明确是一种有毒的蛇；“毒蛇”避免作出过度具体的动物学认定。
- source_word: גָּמוּל
  choice: 断奶的幼儿
  rationale: 该词指已经断奶的孩子；“幼儿”符合现代汉语，并保留与仍吃奶的婴孩之间的发展阶段对照。
- source_word: יָדוֹ
  choice: 手
  rationale: 希伯来文带阳性单数后缀；中文在主语明确时通常不必重复“他的”，省略领属代词更自然，所指仍清楚。
- source_word: הָדָה
  choice: 把手放在
  rationale: 该动词在此可能表示放置、伸出或探出手；正文按与介词 עַל 的搭配译为“把手放在”，并用脚注保留“伸手”的可能。
theological_decisions:
- issue: 和平国度语境中这幅图景的性质
  choice: 直接呈现幼小孩子在毒蛇附近仍安然无恙的非凡和平与安全景象，不界定其为字面、象征或兼而有之。
  alternative: 将其明确解释为受造界发生完全的字面转变，或主要视为弥赛亚和平的象征。
  rationale: 经文本身以诗歌图景描写脆弱的孩子不受致命毒蛇伤害；翻译应保留这一图景，不替读者裁定经文没有明说的解释问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。上下两句以“吃奶的婴孩／断奶的幼儿”和“洞口／巢穴”形成诗体平行；保留毒蛇意象的危险性，又不在译文中解释其象征或末世含义。
