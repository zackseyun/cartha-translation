base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/012.yaml
  text: He will raise a banner for the nations[a], and gather the banished of Israel[c][b]; he will assemble the scattered of Judah from the four corners of the earth.
translation:
  language: zh_hans
  text: 他要向列国竖起旗帜，招聚以色列被赶散的人[a]；他要从大地的四方[b]聚集犹大四散的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被赶散的人”也可译作“被驱逐的人”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“大地的四个翅膀”，是指大地四方的边缘或极远之处。
    reason: cultural_note
  - marker: c
    text: “四散的人”在希伯来语中采用阴性复数形式，但这里很可能统指犹大离散的民众，并非专指女性。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא נֵס
  choice: 竖起旗帜
  rationale: נשא与נֵס连用，表示把可见的号旗高高立起，作为召集的信号。“竖起旗帜”在现代汉语中自然，也保留了公开招聚的意象。
- source_word: לַגּוֹיִם
  choice: 向列国
  rationale: גּוֹיִם指“列国”；介词ל在这里表示旗帜所面向、所召唤的对象。“向列国”比“为列国”更清楚地传达召集信号的方向。
- source_word: וְאָסַף נִדְחֵי יִשְׂרָאֵל
  choice: 招聚以色列中被赶散的人
  rationale: אסף表示收拢、招聚；נדח含有被驱逐、赶散之意。“被赶散的人”既保留被动与离散的力度，又比“被放逐者”更适合此处的群体性表达。
- source_word: וּנְפֻצוֹת יְהוּדָה יְקַבֵּץ
  choice: 聚集犹大中四散的人
  rationale: קבץ表示聚拢；נְפֻצוֹת是“被分散、四散者”。译作“犹大中四散的人”自然表达集体所指，同时不把阴性复数形态误解为专指女性。
- source_word: מֵאַרְבַּע כַּנְפוֹת הָאָרֶץ
  choice: 从大地的四方
  rationale: כַּנְפוֹת字面为“翅膀”，也可指边缘、尽头；“大地的四方”是自然的汉语惯用表达，传达从各处极远之地招聚的意思，而不造成宇宙形状方面的误解。
theological_decisions:
- issue: וּנְפֻצוֹת יְהוּדָה中阴性复数形式的所指
  choice: 正文译为“犹大中四散的人”，并以脚注说明其阴性复数形态
  alternative: “犹大中四散的女子”
  rationale: 希伯来语形式确为阴性复数，但上下文将其与“以色列中被赶散的人”平行，所指最自然地是犹大离散的群体，而非仅指女性。正文不凭语法性别缩窄所指，同时用脚注保存原文形态。
- issue: הָאָרֶץ的范围
  choice: 大地
  alternative: 土地
  rationale: 本节以“列国”为背景，并描绘从四方招聚；“大地”较能保留广阔范围，同时不强行把הָאָרֶץ限定为某一片土地。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语；以“招聚／聚集”适度体现原文אסף与קבץ两个近义动词，并保留“旗帜”和“四方”的先知性意象。
