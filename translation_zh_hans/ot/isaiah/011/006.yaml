  rationale: 修订仅处理词义边界、现代汉语清晰度和脚注锚点。“幼狮”避免把年龄词扩展为“少壮”的力量描述；“肥壮的牲畜”保留原文对养肥牲畜的概括性，不擅自限定为牛犊。未对动物和平意象的字面或象征性质作解释性裁定。
