source:
  edition: WLC
  text: וְ/גָ֤ר זְאֵב֙ עִם כֶּ֔בֶשׂ וְ/נָמֵ֖ר עִם גְּדִ֣י יִרְבָּ֑ץ וְ/עֵ֨גֶל וּ/כְפִ֤יר וּ/מְרִיא֙ יַחְדָּ֔ו וְ/נַ֥עַר קָטֹ֖ן נֹהֵ֥ג בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/006.yaml
  text: And the wolf will dwell with the lamb[a], and the leopard will lie down with the young goat; and the calf and the young lion and the fattened calf will be together[d][c][b], and a little boy will lead them.
translation:
  language: zh_hans
  text: '狼必与羔羊同住[a]，豹子必与山羊羔一同躺卧；牛犊、幼狮和肥壮的牲畜[b]必在一起，小男孩要带领它们。


    [a] 或译：“狼必与羔羊寄居。”


    [b] 也可译作“肥畜”；指被养肥的牲畜。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“狼必与羔羊寄居。”
    reason: lexical_alternative
  - marker: b
    text: 也可译作“肥畜”；指被养肥的牲畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָר
  choice: 必……同住
  rationale: גור在Qal词干中可指居住或寄居。“同住”自然地表达和平共处的画面，同时用脚注保留“寄居”这一词义可能。
- source_word: זְאֵב
  choice: 狼
  rationale: 该动物名的标准现代汉语译法。
- source_word: כֶּבֶשׂ
  choice: 羔羊
  rationale: 本词可指羊或羔羊；在猛兽与弱小家畜的诗意对照中，“羔羊”贴合语境。
- source_word: וְנָמֵר
  choice: 豹子
  rationale: נמר通常指豹；“豹子”是普通读者易懂的现代汉语。
- source_word: גְּדִי
  choice: 山羊羔
  rationale: 明确表达幼小的山羊，避免“羊羔”可能被理解为绵羊。
- source_word: יִרְבָּץ
  choice: 一同躺卧
  rationale: רבץ常用于动物伏卧或安歇；“躺卧”保留宁静和平的意象，而不强化捕猎姿态。
- source_word: וְעֵגֶל
  choice: 牛犊
  rationale: 准确表达幼牛。
- source_word: וּכְפִיר
  choice: 少壮的狮子
  rationale: כפיר指幼狮或年轻力壮的狮子；此译保留其年龄与力量感，而不把它限定为很小的狮崽。
- source_word: וּמְרִיא
  choice: 肥畜
  rationale: מריא指喂肥、肥壮的牲畜，原文没有明说其种类；“肥畜”保留这一概括性，并以脚注说明传统的“肥牛犊”译法。
- source_word: יַחְדָּו
  choice: 必在一起
  rationale: 该副词意为“一起”；汉语补出系词，使无动词的希伯来语短句自然完整。
- source_word: וְנַעַר קָטֹן
  choice: 小男孩
  rationale: נער为阳性单数，可指男孩或少年，קטן强调年幼或弱小；“小男孩”保留原文鲜明的性别和年龄形象。
- source_word: נֹהֵג בָּם
  choice: 要带领它们
  rationale: נהג可指引领、赶领；“带领”适合此和平画面，又不额外规定具体方式。
theological_decisions:
- issue: 和平国度意象的性质
  choice: 按原文直接呈现动物和平共处的先知性诗歌画面
  alternative: 将其明确解释为末世动物界的字面改变，或完全改写为人类社会与政治和平的比喻
  rationale: 希伯来文使用具体的动物意象，却没有在本节中解释其实现方式或象征范围；译文应保留这一神学张力，不替原文作出判定。
- issue: “肥畜”的具体种类
  choice: 正文保留原文未指明种类的概括表达，并在脚注列出“肥牛犊”
  alternative: 直接在正文限定为“肥牛犊”
  rationale: מריא本身强调牲畜被养肥，并不必然等同于牛犊；避免依据相邻的עגל重复补入原文未明说的动物种类。
translation_notes:
  register: 采用现代、庄重而通俗的简体中文。保留希伯来诗句中三组动物并列的节奏，以分号区分前两组与第三组；不把具象动物画面解释性地改写为某一特定末世论或社会寓意。
