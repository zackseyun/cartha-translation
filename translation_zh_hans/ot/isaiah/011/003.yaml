base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/003.yaml
  text: And his delight shall be in the fear of Yahweh[a], and he shall not judge by what his eyes see, nor decide by what his ears hear.
translation:
  language: zh_hans
  text: 他必以敬畏耶和华为乐[a]；他不凭眼见施行审判，也不凭耳朵所听见的作出裁决。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的嗅闻／感知在敬畏耶和华中。”原文动词按字面与“嗅闻”有关，句式和含义较难确定，可能暗示敏锐的辨识力。
    reason: 保留 וַהֲרִיחוֹ 的字面嗅觉意象、困难句式及其可能表达敏锐感知的含义。
lexical_decisions:
- source_word: וַהֲרִיחוֹ
  choice: 他必……为乐
  rationale: 该词是 ריח 的使役形，按字面与“嗅闻”有关，但此处结构罕见且语义困难。结合下文不单凭眼见、耳闻判断，正文采用自然的习语性表达“以……为乐”，同时用脚注保留“嗅闻／感知”及敏锐辨识的可能含义。
- source_word: בְּיִרְאַת
  choice: 以敬畏……为乐
  rationale: יִרְאָה 在此表示面对上帝的敬畏与尊崇；“敬畏”保留其伦理和盟约语境中的分量，不把它弱化为一般的尊敬。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式“耶和华”，使其作为以色列上帝的名字区别于一般称号“主”。
- source_word: לְמַרְאֵה עֵינָיו
  choice: 凭眼见
  rationale: 简洁保留“眼睛所见”的具体感官意象，表达他不只根据外在表象判断。
- source_word: יִשְׁפּוֹט
  choice: 施行审判
  rationale: שׁפט 在这里具有司法和治理意味；“施行审判”比单说“判断”更清楚地呈现君王裁断案件的语境。
- source_word: לְמִשְׁמַע אָזְנָיו
  choice: 凭耳闻
  rationale: 与“凭眼见”形成整齐的感官对照，也可涵盖听来的陈述或传闻，而不把含义限缩为“道听途说”。
- source_word: יוֹכִיחַ
  choice: 作出裁决
  rationale: יכח 的使役形可表示判定、仲裁、责备。此处与“施行审判”平行，司法性的“作出裁决”最切合上下文，同时避免窄化为道德责备。
theological_decisions:
- issue: 将来大卫后裔之君王的辨识力
  choice: 正文描写这位君王以敬畏耶和华为乐，并且审判不受表象或耳闻所局限。
  alternative: 开头也可能更直接地描写他凭“嗅闻”而有超常、敏锐的感知能力。
  rationale: 上下文讲到耶西之本所出的枝子蒙耶和华的灵赋能。译文既应呈现他敬畏上帝的内在取向，也不应抹去希伯来语开头可能强调敏锐辨识力的张力，因此正文采用通顺表达，脚注说明字面意象与另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凭眼见／凭耳闻”保持原文平行结构和感官意象；“施行审判／作出裁决”体现司法语境，并适度保留两个希伯来动词之间的差别。
