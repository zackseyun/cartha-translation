base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/013.yaml
  text: The jealousy of Ephraim will depart[a], and the adversaries of Judah will be cut off; Ephraim will not be jealous of Judah[b], and Judah will not harass Ephraim.
translation:
  language: zh_hans
  text: 以法莲的嫉妒必离去[a]，犹大的仇敌必被剪除；以法莲必不嫉妒犹大，犹大也必不与以法莲为敌[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嫉妒”也可译作“妒忌”；这里的希伯来词可表示因彼此争竞而产生的嫉妒或妒忌。
    reason: lexical_alternative
  - marker: b
    text: “与……为敌”也可译作“骚扰”或“压迫”；这里的希伯来动词可表达敌视、侵扰或压迫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרָה
  choice: 必消退
  rationale: 动词סור在这里以“以法莲的嫉妒”为主语，表达这种嫉妒离去、消失。“消退”在现代汉语中自然，也保留了逐渐离去的意象。
- source_word: קִנְאַת
  choice: 嫉妒
  rationale: קִנְאָה可指热心、嫉妒或妒忌；在以法莲与犹大彼此争竞的语境中，“嫉妒”最贴切，同时脚注保留“妒忌”这一近义选择。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 按希伯来专名音译；这里虽可代表北国或其群体，正文仍保留原文名称，不作解释性扩写。
- source_word: וְצֹרְרֵי יְהוּדָה
  choice: 敌对犹大的人
  rationale: צרר相关形式表示敌视、作对或压迫。“敌对犹大的人”范围较宽，不把含义限定为军事仇敌或具体压迫行为。
- source_word: יִכָּרֵתוּ
  choice: 必被剪除
  rationale: כרת的尼法勒式常指“被剪除”。此译保留希伯来语惯用意象及其严厉语气。
- source_word: לֹא יְקַנֵּא אֶת יְהוּדָה
  choice: 必不再嫉妒犹大
  rationale: קנא在这里延续上半句所说的嫉妒与争竞；加入“不再”自然表达预言中这种旧有敌对关系的终止。
- source_word: לֹא יָצֹר אֶת אֶפְרָיִם
  choice: 必不再与以法莲为敌
  rationale: 该动词可表达敌视、骚扰、围困或压迫。“与……为敌”保留主动敌对的核心意义，又不将语境过度限定为战争或压迫。
- source_word: וִיהוּדָה
  choice: 犹大也
  rationale: 保留专名，并以“也”自然呈现以法莲与犹大之间平衡的诗歌对句。
theological_decisions:
- issue: “以法莲”和“犹大”的指称
  choice: 正文保留“以法莲”和“犹大”这两个支派／国族名称
  alternative: 解释性译为“北国”和“南国”，或“以色列”和“犹大”
  rationale: 希伯来原文直接使用这两个名称。保留专名可维持经文的历史和诗歌质感，也避免在译文中强行限定其群体指称。
- issue: 两方敌对关系的对应方式
  choice: 保留“以法莲嫉妒犹大”与“犹大和以法莲为敌”之间不完全对称的措辞
  alternative: 将两句都统一译成彼此“嫉妒”或彼此“敌对”
  rationale: 原文分别使用קנא和יצור两个不同词根；译文不把这种词义差异抹平，从而保留原有的神学与修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必……”“被剪除”保留先知性宣告的力度；分号呈现希伯来诗句前后两组平行关系。
