  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא שֹׁ֣רֶשׁ יִשַׁ֗י אֲשֶׁ֤ר עֹמֵד֙ לְ/נֵ֣ס עַמִּ֔ים אֵלָ֖י/ו גּוֹיִ֣ם יִדְרֹ֑שׁוּ וְ/הָיְתָ֥ה מְנֻחָת֖/וֹ כָּבֽוֹד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/010.yaml
  text: And in that day the root of Jesse, who stands as a banner for the peoples—to him the nations will seek, and his resting place will be glory.
translation:
  language: zh_hans
  text: 到那日，耶西的根，就是那挺立作万民旗帜的；列国必寻求他，他安歇之处必有荣耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁרֶשׁ יִשַׁי
  choice: 耶西的根
  rationale: 保留希伯来文的核心意象及其弥赛亚式张力，不将其解释性改写为“后裔”。
- source_word: עֹמֵד
  choice: 挺立
  rationale: 既表达“站立”的状态，也自然传达作为旗帜显立不倒的形象。
- source_word: נֵס עַמִּים
  choice: 万民的旗帜
  rationale: נֵס 指高举、供人聚集辨识的旗号；“万民”在现代汉语中自然涵盖复数的 peoples。
- source_word: יִדְרֹשׁוּ
  choice: 寻求
  rationale: 保留 דרש 可指寻找、求问、转向寻求的语义宽度，不缩窄为单纯“归向”或“求教”。
- source_word: מְנֻחָתוֹ
  choice: 他安歇之处
  rationale: 该形式可指其安息、歇息之所；此译法在汉语中保留地点意味，并避免预先判定为居所、坟墓或统治中心。
- source_word: כָּבוֹד
  choice: 荣耀
  rationale: 按名词原形直译，保留“他的安歇之处必是/有荣耀”的浓缩表达；汉语采用“必有荣耀”以求自然，同时不改写为形容词“荣耀的”。
theological_decisions:
- issue: “耶西的根”的指向
  choice: 保留“耶西的根”这一隐喻
  alternative: 译作“耶西的后裔”或明确称为“弥赛亚”
  rationale: 原文以悖论式意象称其为耶西的“根”，上下文虽具有王权和弥赛亚关联，译文不应把解释直接写入正文。
- issue: 列国与此人物的关系
  choice: 译为“列国必寻求他”
  alternative: “列国必归向他”或“列国必求问他”
  rationale: 原词语义可涵盖寻访、求问和寻求，采用较宽的“寻求”以保存神学张力。
- issue: 末句的语法关系
  choice: “他安歇之处必有荣耀”
  alternative: “他的安息之所必是荣耀”或“他的居所必满有荣耀”
  rationale: 原文名词句字面接近“他的安歇之处必为荣耀”。“必有荣耀”在现代汉语中较通顺，又避免额外加入“充满”等原文没有的成分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留先知文体的凝练和意象；“挺立”“旗帜”“寻求”“安歇之处”兼顾原文形式与自然汉语。无脚注，故正文不设脚注标记。
