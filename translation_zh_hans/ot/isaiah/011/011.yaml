source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יוֹסִ֨יף אֲדֹנָ֤/י שֵׁנִית֙ יָד֔/וֹ לִ/קְנ֖וֹת אֶת שְׁאָ֣ר עַמּ֑/וֹ אֲשֶׁ֣ר יִשָּׁאֵר֩ מֵ/אַשּׁ֨וּר וּ/מִ/מִּצְרַ֜יִם וּ/מִ/פַּתְר֣וֹס וּ/מִ/כּ֗וּשׁ וּ/מֵ/עֵילָ֤ם וּ/מִ/שִּׁנְעָר֙ וּ/מֵ֣/חֲמָ֔ת וּ/מֵ/אִיֵּ֖י הַ/יָּֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/011.yaml
  text: And in that day the Lord will again extend his hand[a], a second time, to recover the remnant of his people who remain, from Assyria, from Egypt, from Pathros, from Cush, from Elam, from Shinar, from Hamath[c][b], and from the coastlands of the sea.
translation:
  language: zh_hans
  text: 到那日，主必第二次再伸手[a]，得回他百姓中所剩下的余民；这些余民是从亚述、埃及、巴忒罗、古实[b]、以拦、示拿、哈马，以及海中的众海岛[c]所留下的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主必第二次再伸手去取得……”。希伯来文直译近似“主必再一次，第二次伸出他的手去取得……”；正文“得回”是按这里重新取得余民的语境翻译。
    reason: lexical_alternative
  - marker: b
    text: “古实”是希伯来文古地名，通常与埃及以南的地区有关；有些译本译作“埃塞俄比亚”。
    reason: cultural_note
  - marker: c
    text: 或译：“海边各地”。原文所用词既可指海岛，也可较广泛地指沿海地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的时间转换语。中文以“到那日”自然表达将来的情境，也保留庄重的预言语体。
- source_word: יוֹסִיף אֲדֹנָי שֵׁנִית יָדוֹ
  choice: 主必再次伸手，第二次
  rationale: 保留原文“手”的拟人意象，并分别体现יוֹסִיף的重复含义和שֵׁנִית的序数含义；中文虽略有复沓，却对应希伯来文有意的双重表达。
- source_word: לִקְנוֹת
  choice: 得回
  rationale: קנה的基本义是取得、获得；在此语境中对象是散居各地的余民，“得回”既保留取得之意，又自然表达重新归属，且不加入“救赎”一词可能带来的额外神学含义。
- source_word: שְׁאָר עַמּוֹ אֲשֶׁר יִשָּׁאֵר
  choice: 他百姓中所剩下的人……所剩下的人
  rationale: 原文以同源词形成“余民／剩下”的重复。中文保留这种重复，避免把关系从句压缩而丢失修辞联系。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 此处是称号אֲדֹנָי，并非四字神名；译为现代中文圣经语体中自然、庄重的“主”。
- source_word: פַּתְרוֹס
  choice: 巴忒罗
  rationale: 按古代地名音译，通常指埃及南部地区，不用现代地理名称替代。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 保留希伯来古地名的传统中文音译，避免用现代“埃塞俄比亚”造成地理范围误解。
- source_word: אִיֵּי הַיָּם
  choice: 海中的众海岛
  rationale: אִיִּים可指岛屿，也可泛指沿海地带；正文采用较直接的“海岛”，并以脚注保留“沿海地区”的可能。
theological_decisions:
- issue: לִקְנוֹת应译作一般性的“取得”，语境性的“得回”，还是神学色彩较强的“救赎”
  choice: 得回
  alternative: 取得；赎回
  rationale: 上下文描写主再次采取行动，把散居列国的余民归聚。“得回”符合语境，同时仍接近קנה的取得义；“赎回”可能把本动词本身未明确表达的赎价或救赎概念带入经文。
- issue: 是否保留“主的手”这一拟人表达
  choice: 保留为“伸手”
  alternative: 意译为“再次召回”或“再次收聚”
  rationale: 原文明确使用“手”的形象，表现主主动施行大能；保留这一意象可避免把动作的具体内容过早限定为某一种解释。
- issue: שְׁאָר与יִשָּׁאֵר的同源重复是否压缩
  choice: 保留“所剩下的人”的重复
  alternative: 简化为“他百姓的余民”
  rationale: 重复强调这些人确实是灾变之后留下的群体。保留它可维持先知文本的语义和修辞张力，而不额外规定“余民”的系统神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。列举古地名时保持简洁；“再次……第二次”有意保留希伯来文的双重重复。“海中的众海岛”沿用清楚可懂的古典地理表达，同时以脚注说明其较宽泛的语义。
