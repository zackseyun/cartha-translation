base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/001.yaml
  text: Then a shoot will come out from the stump of Jesse[d][c][b][a], and a branch from his roots will bear fruit.
translation:
  language: zh_hans
  text: 于是[a]，耶西的树桩必发出一根嫩枝[b]；从他的根[d]生出的新枝[c]必结果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “于是”也可译作“并且”。这里译作“于是”，体现经文从先前的审判转向复兴盼望。
    reason: lexical_alternative
  - marker: b
    text: “嫩枝”也可译作“枝条”或“嫩条”。
    reason: lexical_alternative
  - marker: c
    text: “新枝”也可译作“萌芽”或“枝条”。有些读者在这一意象中看见弥赛亚意义，但正文保留其通常的植物含义。
    reason: lexical_alternative
  - marker: d
    text: 原文直译为“他的根”；有些译法按树木隐喻顺译为“它的根”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: 于是……要……长出
  rationale: יצא的基本意思是“出来”。在植物意象中，“长出”是自然的现代汉语表达；句首“于是”也体现上文审判之后转向复兴盼望的推进，但不把这种语境关系说得过满。
- source_word: חֹטֶר
  choice: 嫩枝
  rationale: חֹטֶר可指从树干或残桩生出的枝条、嫩条。“嫩枝”保留植物意象，也避免“杖”等译法在现代汉语中造成器物或武器方面的误解。
- source_word: מִגֵּזַע
  choice: 从……树桩上
  rationale: גֵּזַע在此指树被砍后留下的残干或根株。“树桩”清楚呈现审判、砍伐之后仍有新生的意象。
- source_word: יִשָׁי
  choice: 耶西
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: וְנֵצֶר
  choice: 一根新枝
  rationale: נֵצֶר指新生的枝条或萌芽。“新枝”与前半句的“嫩枝”形成诗意平行，同时略作词汇区分；不将其大写或处理成明示的弥赛亚称号。
- source_word: מִשָּׁרָשָׁיו
  choice: 从他的根中
  rationale: 希伯来语带第三人称阳性单数后缀。译作“他的”保留与耶西及其家系的语法联系，即使整句同时运用了树木隐喻。
- source_word: יִפְרֶה
  choice: 要结出果实
  rationale: פרה意为“结果子、繁衍、富有成果”。“结出果实”完整延续本节的植物意象，并比单说“茂盛”更贴近词义。
theological_decisions:
- issue: 植物意象的弥赛亚含义
  choice: 正文保留普通的植物和王朝谱系意象，不直接加入“弥赛亚”等解释性称号。
  alternative: 将“新枝”处理为带专名色彩的称号，或直接明示弥赛亚身份。
  rationale: 本节在基督教正典语境中具有公认的弥赛亚指向，但希伯来语正文首先描绘从耶西家系兴起的新枝。让神学含义由上下文和正典关联显明，可避免把解释写入词面。
- issue: “他的根”中的阳性单数后缀
  choice: 保留为“他的根”。
  alternative: 按纯植物意象顺译为“它的根”。
  rationale: “他的”忠实保留希伯来语阳性单数后缀，并维持其与耶西及耶西家系的联系；“它的”虽更符合通常的树木说法，却会抹平原文的人物—树木双重意象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“树桩—嫩枝—根—新枝—果实”的意象链保持清晰；句式保留希伯来诗歌的两行平行结构。量词“一根”使中文表达自然，也突出单一新生枝条，但不额外赋予专名色彩。脚注标记均置于所解释的对应词语之后。
