  text: וְ/הָיְתָ֣ה מְסִלָּ֔ה לִ/שְׁאָ֣ר עַמּ֔/וֹ אֲשֶׁ֥ר יִשָּׁאֵ֖ר מֵֽ/אַשּׁ֑וּר כַּ/אֲשֶׁ֤ר הָֽיְתָה֙ לְ/יִשְׂרָאֵ֔ל בְּ/י֥וֹם עֲלֹת֖/וֹ מֵ/אֶ֥רֶץ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/016.yaml
  text: And there will be a highway for the remnant of his people that remains from Assyria[b][a], as there was for Israel in the day of his coming up from the land of Egypt.
translation:
  language: zh_hans
  text: 必有一条大道，为他百姓中从亚述剩下的余民[a]而设，就像以色列从埃及地上来时那样。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从亚述余留下来的余民”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在他从埃及地上来的日子”；这里以以色列从埃及地上来的经历作比较，呼应出埃及事件。
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必有
  rationale: 在先知性语境中表达将来的结果；“必有”简洁自然，并保留预告和确定的语气。
- source_word: מְסִלָּה
  choice: 一条大道
  rationale: 该词指修筑或垫高的道路；“大道”保留预备归回通道的鲜明意象，又符合现代汉语。
- source_word: לִשְׁאָר עַמּוֹ
  choice: 为他百姓中的余民
  rationale: “余民”保留以赛亚书中 שְׁאָר 的重要文学和神学母题；“他”不明说所指，以保存原文的语境张力。
- source_word: אֲשֶׁר יִשָּׁאֵר מֵאַשּׁוּר
  choice: 从亚述剩下的
  rationale: 按单数集合名词“余民”理解，直陈这些余民是从亚述存留下来的，不另加解释。
- source_word: כַּאֲשֶׁר הָיְתָה לְיִשְׂרָאֵל
  choice: 正如以色列……的日子一样
  rationale: 自然表达原文对出埃及事件的比较；汉语省略重复的“大道”，仍可由上文清楚补足。
- source_word: בְּיוֹם עֲלֹתוֹ מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地上来的日子
  rationale: 保留“上来”这一出埃及的传统空间表达，也保留“日子”的原文形式，而不扩写为“第二次出埃及”。
theological_decisions:
- issue: “他百姓”中物主代词的所指
  choice: 保留“他百姓”，不明说“他”是谁
  alternative: 译作“耶和华的百姓”或“弥赛亚的百姓”
  rationale: 本节只使用第三人称物主后缀，须由上下文判断所指；直接点名会消除原文保留的解释空间。
- issue: 出埃及的预表意义
  choice: 按历史类比直译，保留出埃及的呼应
  alternative: 扩译为“末后余民的第二次出埃及”
  rationale: 经文明确作比较，却没有使用“第二次出埃及”等解释性称谓，因此不把可能的神学概括写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“为……而设”补明希伯来语介词所表达的大道用途；保留“余民”“上来”“埃及地”等关键措辞及其经文呼应。
