base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/007.yaml
  text: The cow and the bear will graze[a]; together their young will lie down, and the lion, like the ox[b], will eat straw.
translation:
  language: zh_hans
  text: 母牛和熊必一同吃草[a]；它们的幼崽必一起躺卧；狮子必像牛[b]一样吃秸秆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“母牛和熊必一同觅食。”希伯来语动词可较宽泛地指动物进食；译作“吃草”则突出了此处的动物画面。
    reason: lexical_alternative
  - marker: b
    text: 或译：“像牛群一样。”希伯来语“牛”可指一头牛，也可集合地指牛群或牛类。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרָה
  choice: 母牛
  rationale: פָרָה指母牛；此处与熊并列，采用自然明确的单数称谓。
- source_word: וָדֹב
  choice: 熊
  rationale: דֹּב的直接对应词；希伯来语在此不标明性别。
- source_word: תִּרְעֶינָה
  choice: 吃草
  rationale: רעה在此描写动物进食或牧食；“吃草”具体自然，也贴合母牛与熊共同安然进食的画面。保留较宽泛的译法于脚注。
- source_word: יַחְדָּו
  choice: 一同／一起
  rationale: 意为共同、在一起；中文为避免连续重复，在两个分句中分别用“一同”和“一起”。
- source_word: יִרְבְּצוּ
  choice: 躺卧
  rationale: רבץ常指动物伏卧或安卧；“躺卧”兼顾动作和安歇的画面。
- source_word: יַלְדֵיהֶן
  choice: 它们的幼崽
  rationale: 字面为“它们的孩子”；动物语境中“幼崽”自然，并保留两只母兽共有的阴性复数指代。
- source_word: וְאַרְיֵה
  choice: 狮子
  rationale: אַרְיֵה的标准译法。
- source_word: כַּבָּקָר
  choice: 像牛一样
  rationale: בָּקָר可指牛或牛群；“像牛一样”在现代汉语中自然，也不强行限定为阉牛。集合义“像牛群”不合此处比较表达。
- source_word: יֹאכַל
  choice: 必……吃
  rationale: 未完成式处于先知性图景中，采用“必”表达将来的确定描述。
- source_word: תֶּבֶן
  choice: 草料
  rationale: תֶּבֶן通常指用作饲料的干草秸或碎秸；“草料”易懂且能表明饲料用途，具体的“秸秆”列入脚注。
theological_decisions:
- issue: 动物和平图景的性质
  choice: 按原文具体呈现受造界和谐的动物图景，不说明其应按字面、象征或二者兼有来理解。
  alternative: 将其明确解释为人类政治和平的象征，或明确限定为动物本性的字面改变。
  rationale: 希伯来文本描绘了鲜明的动物和平景象，却没有在本节内界定其应验方式；译文不替文本消除这一解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号保留三幅并列画面；“必”维持先知性未来的语气。正文中的[a]、[b]均与脚注对应。
