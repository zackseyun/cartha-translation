  text: וְ/נָחָ֥ה עָלָ֖י/ו ר֣וּחַ יְהוָ֑ה ר֧וּחַ חָכְמָ֣ה וּ/בִינָ֗ה ר֤וּחַ עֵצָה֙ וּ/גְבוּרָ֔ה ר֥וּחַ דַּ֖עַת וְ/יִרְאַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/002.yaml
  text: 'And the Spirit of Yahweh will rest on him: a spirit of wisdom and understanding[a], a spirit of counsel and might[c][b], a spirit of knowledge and the fear of Yahweh.'
translation:
  language: zh_hans
  text: 耶和华的灵必安住在他身上：智慧和聪明的灵[a]，谋略和能力的灵，知识和敬畏耶和华的灵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“耶和华的灵”之后又三次说“灵”，借此突出这同一位灵的作为或特质：智慧和聪明、谋略和能力、知识和敬畏耶和华。
    reason: lexical_alternative
  - marker: b
    text: “敬畏耶和华”也可表达为“尊崇耶和华”；原文包含虔敬的畏惧与肃然，不只是恐惧。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחָה
  choice: 必安住
  rationale: נוח表示停驻、安歇并持续留驻；“安住”既保留降临后停留的意味，也符合现代汉语的庄重语体。“必”表达先知语境中的将来确定性。
- source_word: עָלָיו
  choice: 在他身上
  rationale: עַל加第三人称阳性单数后缀表示灵停驻的对象；“在他身上”是自然、清楚的现代汉语表达。
- source_word: רוּחַ יְהוָה
  choice: 耶和华的灵
  rationale: 此处רוּחַ指上帝的灵，而非风或人的性情；直接音译神名יהוה为“耶和华”，保留其专名性质。
- source_word: רוּחַ חָכְמָה וּבִינָה
  choice: 智慧和聪明的灵
  rationale: 保留希伯来文重复“灵”的诗体结构。חָכְמָה为智慧；בִינָה指理解、辨明的能力，“聪明”在此取明辨通达之义。
- source_word: רוּחַ עֵצָה וּגְבוּרָה
  choice: 谋略和能力的灵
  rationale: עֵצָה在理想君王的语境中指谋划、决策或良策；גְבוּרָה指力量、英勇之能。“谋略和能力”兼顾治理判断与实行力量。
- source_word: רוּחַ דַּעַת וְיִרְאַת יְהוָה
  choice: 知识和敬畏耶和华的灵
  rationale: דַּעַת直译为“知识”；יִרְאַת יְהוָה保留为“敬畏耶和华”，表达敬重、畏惧与虔敬交织的含义，不缩减为一般性的尊重。
theological_decisions:
- issue: 重复出现的רוּחַ是多个灵，还是同一位耶和华之灵的描述
  choice: 按同一位耶和华之灵的三组描述来表达，同时保留原文四次出现“灵”的结构
  alternative: 理解为若干彼此有别的属灵恩赐，或作七重之灵的系统性枚举
  rationale: 句法上，后三个“……的灵”自然地同位说明开头“耶和华的灵”。译文不加“同一位”等解释性措辞，以免消除原有的诗意开放性或导入后来的体系。
- issue: יִרְאַת יְהוָה的语义力度
  choice: 敬畏耶和华
  alternative: 尊崇耶和华；惧怕耶和华
  rationale: “敬畏”能较完整地容纳希伯来表达中的虔敬、肃然与畏惧，既不淡化为普通尊敬，也不收窄为恐怖。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留希伯来诗句中“灵”的反复和平行结构；使用“耶和华”呈现神名יהוה。
