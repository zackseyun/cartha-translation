base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/005.yaml
  text: Righteousness will be the belt of his waist[b][a], and faithfulness the belt of his loins.
translation:
  language: zh_hans
  text: 公义必作他腰间的束带[a]；信实必作他胯上的束带[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”或译“正义”。
    reason: lexical_alternative
  - marker: b
    text: “信实”或译“忠信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 是
  rationale: 希伯来语完成式在预言语境中指向将来的情形；中文上下文通常无须显明添加“将要”，用“是”更凝练，也保留诗歌式宣告。
- source_word: צֶדֶק
  choice: 公义
  rationale: 该词兼有合乎正道与施行公正之意；在此描写将来统治者的品格，“公义”能涵盖道德与治理层面。
- source_word: אֵזוֹר
  choice: 带子
  rationale: 指束在身体上的带子；采用现代、清楚而不过度具体的词，并在平行句中重复以保存原文结构。
- source_word: מָתְנָיו
  choice: 他腰间
  rationale: 指腰部区域；“腰间”符合现代中文习惯，并与下句的身体部位略作区分。
- source_word: וְהָאֱמוּנָה
  choice: 信实
  rationale: אֱמוּנָה在此表示坚定可靠、忠诚可信的品格；“信实”简洁地保留这一伦理和关系含义。
- source_word: חֲלָצָיו
  choice: 他胯间
  rationale: 该词指腰胯或髋部区域；“胯间”保存身体意象，也与前句“腰间”形成近义平行而不完全重合。
theological_decisions:
- issue: 预言中两种品格的表达
  choice: 以“公义”和“信实”描写这位将来统治者的品格，不在经文本身加入后来的基督论称谓或系统神学说明。
  alternative: 将צֶדֶק译作“正义”，或将אֱמוּנָה译作“忠信”。
  rationale: 原文以衣带比喻统治者恒常贴身的品格；译文保留其伦理力度与诗性意象，同时不超出本节明说的内容。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语；保留两句中“带子”的重复和平行结构。正文中的脚注标记依其所注词语分别放置。
