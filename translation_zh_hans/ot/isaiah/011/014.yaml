id: ISA.11.14
reference: Isaiah 11:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עָפ֨וּ בְ/כָתֵ֤ף פְּלִשְׁתִּים֙ יָ֔מָּ/ה יַחְדָּ֖ו יָבֹ֣זּוּ אֶת בְּנֵי קֶ֑דֶם אֱד֤וֹם וּ/מוֹאָב֙ מִשְׁל֣וֹח יָדָ֔/ם וּ/בְנֵ֥י עַמּ֖וֹן מִשְׁמַעְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/014.yaml
  text: They will swoop down on the shoulder of the Philistines to the west[a]; together they will plunder the sons of the east. Edom and Moab will be the putting forth of their hand[d][c][b], and the sons of Ammon will obey them.
translation:
  language: zh_hans
  text: 他们必向西飞扑到非利士人的侧翼[a]，一同掳掠东方人[b]。以东和摩押必在他们手下[c]，亚扪人也必听从他们[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“非利士人的肩膀”，可能指其侧翼，也可能指西面的非利士地区或其边缘。
    reason: 保留כָּתֵף的字面意象及地域上的歧义。
  - marker: b
    text: 原文直译为“东方之子”，即东方各族的人。
    reason: 说明希伯来语族群惯用语。
  - marker: c
    text: 原文直译近于“以东和摩押必成为他们伸手所及”；也可理解为“他们必向以东和摩押伸手”。
    reason: 保留מִשְׁלוֹחַ יָדָם这一凝练表达在攻击、掌控和从属之间的语义张力。
  - marker: d
    text: 也可译作“亚扪人必臣服于他们”。
    reason: 呈现מִשְׁמַעְתָּם可表示听命或归属其权下的含义。
lexical_decisions:
- source_word: וְעָפוּ
  choice: 扑向
  rationale: 原义为“飞”，在此军事语境中描写迅速发动攻击；“扑向”既保留迅猛俯冲的意象，也让现代读者清楚理解其敌对行动。
- source_word: בְכָתֵף פְּלִשְׁתִּים
  choice: 非利士人的侧翼
  rationale: כָּתֵף直译为“肩膀”，也可指一侧、山坡、边缘或侧翼。军事语境中译作“侧翼”自然清楚，同时用脚注保留字面意象和地域解释。
- source_word: יָמָּה
  choice: 向西
  rationale: 该方向副词源自“海”，按以色列地理习惯指向西、朝海的方向；“向西”简洁自然。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 准确表达双方联合行动，语体庄重而自然。
- source_word: יָבֹזּוּ
  choice: 掳掠
  rationale: בזז用于战争中的劫掠、夺取战利品；“掳掠”保留强烈的军事含义。
- source_word: בְּנֵי קֶדֶם
  choice: 东方人
  rationale: 字面为“东方之子”，是指东方各族的惯用语。中文译作“东方人”比“东方之子”自然，并未限定具体族群。
- source_word: מִשְׁלוֹחַ יָדָם
  choice: 受他们辖制
  rationale: 该压缩式名词结构字面涉及“伸出他们的手”，在此表示权力、占有或攻击所及。“受他们辖制”传达上下文中的臣服关系，同时以脚注保留原文意象及其他可能译法。
- source_word: מִשְׁמַעְתָּם
  choice: 听从他们
  rationale: 该名词形式源于“听”，表示听命、服从或归顺；“听从他们”贴近词源，也符合现代汉语。
- source_word: אֱדוֹם וּמוֹאָב
  choice: 以东和摩押
  rationale: 采用现代中文圣经传统中通行且易识别的专名译法。
- source_word: וּבְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 字面为“亚扪之子”，在这里是族群称谓；“亚扪人”是自然、准确的现代中文表达。
theological_decisions:
- issue: 是否把本节征战与臣服的意象弱化为一般性的政治影响
  choice: 保留明确的攻击、掳掠和臣服用语
  alternative: 泛化为势力扩张或政治影响
  rationale: 希伯来文使用迅速进攻、掳掠、伸手掌控和听命等强烈表达。即使本节处于复兴预言的语境中，译文也不应淡化其军事和臣服意象。
- issue: מִשְׁלוֹחַ יָדָם所表达的控制方式
  choice: 正文译为“受他们辖制”，脚注保留“伸手”意象
  alternative: 直译为“成为他们伸手之处”或译为“在他们手下”
  rationale: 原文结构凝练，并未明确说明是攻击、占有还是持续统治；正文传达共同的权力从属含义，脚注则避免把其具体方式定死。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“扑向”“掳掠”保留预言中的迅猛征战语气；对不自然的希伯来语身体隐喻和亲属式族名作适度转换，并以脚注保存其原文形式和真实歧义。
