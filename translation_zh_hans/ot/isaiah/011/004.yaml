id: ISA.11.4
reference: Isaiah 11:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׁפַ֤ט בְּ/צֶ֨דֶק֙ דַּלִּ֔ים וְ/הוֹכִ֥יחַ בְּ/מִישׁ֖וֹר לְ/עַנְוֵי אָ֑רֶץ וְ/הִֽכָּה אֶ֨רֶץ֙ בְּ/שֵׁ֣בֶט פִּ֔י/ו וּ/בְ/ר֥וּחַ שְׂפָתָ֖י/ו יָמִ֥ית רָשָֽׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/004.yaml
  text: but he will judge the poor with righteousness[a], and decide with equity for the humble of the earth; he will strike the earth with the rod of his mouth[e][d][c][b], and with the breath of his lips he will put the wicked to death.
translation:
  language: zh_hans
  text: 却要以公义审判贫穷人[a]，为地上的谦卑人作出公平的裁决[b]；他要用口中的杖击打大地[c]，以嘴唇的气息处死恶人[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”；“贫穷人”也可理解为“弱小者”或“困苦人”。
    reason: 保留צֶדֶק与דַּלִּים的词义范围。
  - marker: b
    text: “谦卑人”也可译作“温顺的人”或“受苦的人”；“地上”也可译作“这片土地上”。
    reason: 保留עָנָו的品格与受苦处境两方面含义，以及אֶרֶץ的地域歧义。
  - marker: c
    text: “大地”也可译作“土地”；“杖”也可能含有“权杖”的意味。
    reason: 保留אֶרֶץ的范围及שֵׁבֶט作为刑罚工具或王权象征的双重可能。
  - marker: d
    text: “恶人”原文为单数，也可译作“那个恶人”或“那恶者”。
    reason: 保留רָשָׁע可作泛指、集合性代表或特定个体的歧义。
lexical_decisions:
- source_word: וְשָׁפַט
  choice: 却要……审判
  rationale: 承接第3节“不凭眼见审判”的对比，译作“却要”使上下文关系自然；动词保留司法与治理意味。
- source_word: בְּצֶדֶק
  choice: 以公义
  rationale: צֶדֶק兼有公义与正义的道德—司法内涵；“以公义”庄重自然，也避免限缩为纯法律程序。
- source_word: דַּלִּים
  choice: 贫穷人
  rationale: דַּלִּים指贫穷、弱小或缺乏社会权势的人；此处在公正审判的语境中，“贫穷人”最直接自然。
- source_word: וְהוֹכִיחַ
  choice: 断案
  rationale: יכח的使役形在司法语境中可指裁决、判定；“断案”与前句“审判”平行，又不误解为单纯责备。
- source_word: בְּמִישׁוֹר
  choice: 以公平
  rationale: מִישׁוֹר本有平直、正直之意，引申为公平无偏；现代汉语“以公平”准确表达其司法含义。
- source_word: לְעַנְוֵי אָרֶץ
  choice: 为世上的谦卑人
  rationale: עָנָו可指谦卑、温顺或受苦的人；主文采用“谦卑人”，保留品格与社会处境之间的张力，并以脚注注明另一可能。
- source_word: וְהִכָּה אֶרֶץ
  choice: 击打大地
  rationale: נכה是击打；אֶרֶץ可指地、土地或大地。此处“击打大地”保留广阔、末世性的语气，同时脚注说明“地”也可理解为“这片土地”。
- source_word: בְּשֵׁבֶט פִּיו
  choice: 用口中的杖
  rationale: שֵׁבֶט可指杖、棍或权杖；“口中的杖”保留原文鲜明隐喻，表达他的话语成为施行审判的工具。
- source_word: וּבְרוּחַ שְׂפָתָיו
  choice: 以嘴唇的气息
  rationale: רוּחַ可指气息、风或灵；与“口”和“嘴唇”平行时，“气息”是最直接的具体意义，同时不消除其语义张力。
- source_word: יָמִית רָשָׁע
  choice: 处死恶人
  rationale: מות的使役形意为使之死亡、处死；רָשָׁע为单数，可作集合或泛指。“恶人”在中文中可自然泛指邪恶之人，脚注保留个体化读法。
theological_decisions:
- issue: אֶרֶץ在本节中的范围
  choice: 大地／世上
  alternative: 土地／这片土地
  rationale: 上下文具有广阔的弥赛亚统治视野，且本节两次使用אֶרֶץ，主文采用较宽泛的“大地／世上”；但该词确可指特定土地，因此以脚注保留。
- issue: 单数רָשָׁע的指向
  choice: 恶人（泛指或集合意义）
  alternative: 那恶者／那个恶人（个体意义）
  rationale: 希伯来语单数可作代表性或泛指用法，主文不将其锁定为某一特定人物；脚注明确保留个体化理解，以维持文本的神学张力。
- issue: רוּחַ的意义
  choice: 气息
  alternative: 灵／风
  rationale: “口—嘴唇”的平行结构支持具体的“气息”，并表现话语施行审判的能力；原词仍有“灵、风”的语义范围，但主文不借此引入超出本句的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“审判—断案”呈现希伯来诗句的司法平行；“口中的杖—嘴唇的气息”尽量保留原文具体而有力的诗性意象。脚注标记均在正文对应位置出现。
