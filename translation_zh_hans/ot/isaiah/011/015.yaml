source:
  edition: WLC
  text: וְ/הֶחֱרִ֣ים יְהוָ֗ה אֵ֚ת לְשׁ֣וֹן יָם מִצְרַ֔יִם וְ/הֵנִ֥יף יָד֛/וֹ עַל הַ/נָּהָ֖ר בַּ/עְיָ֣ם רוּח֑/וֹ וְ/הִכָּ֨/הוּ֙ לְ/שִׁבְעָ֣ה נְחָלִ֔ים וְ/הִדְרִ֖יךְ בַּ/נְּעָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/015.yaml
  text: And Yahweh will utterly destroy the tongue of the sea of Egypt[a], and he will wave his hand over the River with the scorching of his wind; he will strike it into seven streams[c][b], and make people walk through in sandals.
translation:
  language: zh_hans
  text: 雅威必将彻底毁灭埃及海的海湾[a]；他要向大河[b]挥动手，以他灼热的风[c]把它击成七条溪流，使人穿着凉鞋走过去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“埃及海的舌状海湾”；原文直译为“埃及海的舌”。
    reason: lexical_alternative
  - marker: b
    text: “大河”通常指幼发拉底河。
    reason: cross_reference
  - marker: c
    text: “灼热的风”所据的希伯来语含义不完全确定；或译“他风的热气”或“他猛烈的风”。
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: וְהֶחֱרִים
  choice: 必彻底毁掉
  rationale: חרם的使役式通常表示置于毁灭之下或彻底除去。这里强调海域不再构成阻碍；译作“彻底毁掉”保留其强烈程度，而不直接采用较具上下文解释性的“使……干涸”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文所载的上帝专名音译，不以称号替代。
- source_word: לְשׁוֹן יָם מִצְרַיִם
  choice: 埃及海的海舌
  rationale: לשון本义为“舌”，也可指舌状的海湾或水域。正文保留先知鲜明的地貌意象，脚注提供自然的地理性表达。
- source_word: וְהֵנִיף יָדוֹ עַל הַנָּהָר
  choice: 他要向大河挥手
  rationale: 保留上帝以挥手施展权能的形象；定冠词所指的“大河”不在正文中直接扩展为幼发拉底河。
- source_word: בַּעְיָם רוּחוֹ
  choice: 以他灼热的风
  rationale: 此处罕见词语的确切含义不完全确定，语境支持灼热、炙烤之意；רוּחַ在水域场景中译为“风”，同时以脚注保留另一种理解。
- source_word: וְהִכָּהוּ לְשִׁבְעָה נְחָלִים
  choice: 把它击成七条溪流
  rationale: 后缀指回“大河”；נְחָלִים可指溪流或河道。“七条溪流”既清楚又不判断“七”是实数还是完整性的象征。
- source_word: וְהִדְרִיךְ בַּנְּעָלִים
  choice: 使人穿着鞋便能走过
  rationale: 使役式表示使其行走或踏过。希伯来文未明说受事者，汉语以泛指“人”自然补足；“穿着鞋”突出通行容易，无须涉水赤足。
theological_decisions:
- issue: 埃及海与大河被制服的图景应如何表达
  choice: 按上帝作用于实际水域的先知性图景翻译，并保留其出埃及式意象
  alternative: 把全节直接解释为政治阻碍被除去，或仅视为出埃及事件的寓意重演
  rationale: 原文具体描写海、大河、溪流和穿鞋走过。译文应保留这些具体意象，不在正文中预先限定其预表、象征或末世层面的解释。
- issue: רוּחוֹ在本节的含义
  choice: 译为“他的风”
  alternative: 译为“他的气息”或“他的灵”
  rationale: 击打并分开水域的语境较支持“风”，但希伯来词本身也可指气息或灵；译文不据此引入特定圣灵论解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“海舌”有意保留原文意象，并由脚注解释；“雅威”按专名音译。“穿着鞋便能走过”以自然汉语表达通行之容易，同时避免增加“干地”等原文未明说的内容。
