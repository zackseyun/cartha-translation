  text: לֹֽא יָרֵ֥עוּ וְ/לֹֽא יַשְׁחִ֖יתוּ בְּ/כָל הַ֣ר קָדְשִׁ֑/י כִּֽי מָלְאָ֣ה הָ/אָ֗רֶץ דֵּעָה֙ אֶת יְהוָ֔ה כַּ/מַּ֖יִם לַ/יָּ֥ם מְכַסִּֽים־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/009.yaml
  text: They will not do harm or bring destruction on all my holy mountain[a], for the earth will be full of the knowledge of Yahweh as the waters cover the sea.
translation:
  language: zh_hans
  text: 它们在我圣山的各处都不伤害，也不毁坏；因为对耶和华的认识必充满大地[a]，如同水覆盖海洋。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“这地”或“土地”。
    reason: 希伯来语הָאָרֶץ既可表示整个大地，也可指特定的土地；本节语境容许两种范围理解。
lexical_decisions:
- source_word: יָרֵעוּ
  choice: 伤害
  rationale: 该词在使役词干中可指造成伤害；结合本段猛兽与牲畜和平共处的图景，译为“伤害”比宽泛的“作恶”更具体。
- source_word: יַשְׁחִיתוּ
  choice: 毁坏
  rationale: 该词在使役词干中常指毁灭、破坏；“毁坏”直接自然，并与“伤害”构成递进式并列。
- source_word: בְּכָל הַר קָדְשִׁי
  choice: 在我整个圣山上
  rationale: 保留介词的地点含义和כָל的完整范围；“在……山上”符合现代汉语习惯。
- source_word: מָלְאָה
  choice: 必充满
  rationale: 完成式置于先知性语境中表达将来确定实现之事；“必”既传达确定性，也避免误解为当前已经完全实现。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: ארץ既可指“大地”也可指“土地/这地”；正文采用与宏阔和平异象相称的“大地”，同时以脚注保留地域性理解。
- source_word: דֵּעָה אֶת יְהוָה
  choice: 对耶和华的认识
  rationale: 表达以耶和华为对象的认识，而非仅指关于他的资料；此译法自然、清楚，也避免生硬的“耶和华的知识”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经语境中广为人知的神名音译，明确其为专名而非以“主”这一称号替代。
- source_word: כַּמַּיִם לַיָּם מְכַסִּים
  choice: 如同水覆盖海洋
  rationale: 贴近原文“众水—覆盖—海”的比喻结构，同时保持庄重而可理解的汉语表达。
theological_decisions:
- issue: 和平异象的范围
  choice: 正文将הָאָרֶץ译为“大地”，呈现普世性的可能范围
  alternative: 译为“这地”或“土地”，理解为以圣地为中心的地域范围
  rationale: 上下文的和平图景和海水的宏阔比喻支持“大地”，但ארץ本身确有“土地/这地”的词义，因此不把另一理解排除，而在脚注中保留。
- issue: 行动主体
  choice: 译作“它们”，承接上文所列动物
  alternative: 译作“他们”或采用“谁也不”的无定表达
  rationale: 本节的复数动词承接11:6–8的动物群体；现代汉语用“它们”能清楚维持上下文指代，又不额外把主体扩大为人类。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在我整个圣山上”保留原文范围，“伤害，也不毁坏”保持并列力度；分号呈现结果与原因之间的清晰关系。脚注标记置于实际存在词义歧义的“大地”之后。
