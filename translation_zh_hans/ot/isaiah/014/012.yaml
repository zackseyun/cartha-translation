id: ISA.14.12
reference: Isaiah 14:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֵ֛יךְ נָפַ֥לְתָּ מִ/שָּׁמַ֖יִם הֵילֵ֣ל בֶּן שָׁ֑חַר נִגְדַּ֣עְתָּ לָ/אָ֔רֶץ חוֹלֵ֖שׁ עַל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/012.yaml
  text: How you have fallen from heaven[a], shining one, son of dawn! You have been cut down to the earth, you who subdued the nations.
translation:
  language: zh_hans
  text: 你这明亮者[a]，黎明之子，怎么竟从天上坠落！你这制伏列国的，竟被砍倒在地上！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“הֵילֵל”在一些较早的译本中传统上译作“路西弗”；按字义，它是一个发光天体的诗意称谓，常被理解为“晨星”或“启明星”。
    reason: 说明传统译名及原词可能具有的天象含义，同时不在正文中消除其诗意指称的开放性。
lexical_decisions:
- source_word: אֵיךְ
  choice: 怎么竟
  rationale: 以现代汉语自然表达惊愕、哀叹式的反问语气；“竟”加强原文感叹力度，却不额外加入“可悲”等解释。
- source_word: נָפַלְתָּ מִשָּׁמַיִם
  choice: 从天上坠落
  rationale: 保留完成性坠落动作及诗歌中的天上—地面对照；“坠落”比普通的“掉下”更符合庄重诗体。
- source_word: הֵילֵל
  choice: 明亮者
  rationale: 反映该词所指的发光天体形象，同时不把它直接定为专名“路西弗”，也不在正文中将其限定为某一种星体。
- source_word: בֶּן־שָׁחַר
  choice: 黎明之子
  rationale: 直译希伯来语诗意称谓，保留拟人化的天象意象及与“明亮者”的平行关系。
- source_word: נִגְדַּעְתָּ לָאָרֶץ
  choice: 被砍倒在地
  rationale: “被砍倒”体现Niphal被动语态和暴力贬降的意象；“在地”自然呈现落到地面的结果，并与“天上”形成对照。
- source_word: חוֹלֵשׁ עַל־גּוֹיִם
  choice: 制伏列国的
  rationale: 把分词表达为对该人物惯常作为的描述；“制伏”传达其压倒、制服列国的政治权势，而不把词义缩窄为单纯“使衰弱”。
theological_decisions:
- issue: 是否把הֵילֵל译作传统专名“路西弗”
  choice: 正文采用描述性称谓“明亮者”
  alternative: 路西弗；晨星；启明星
  rationale: 希伯来文在此呈现诗歌性称谓，并未明确要求视为专名。描述性译法优先反映原文，同时保留它可能指晨星等发光天体的空间，避免把后来的拉丁译名及相关神学认同直接写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“你这……，怎么竟……”再现讥讽诗中惊愕、嘲讽的呼语结构；第二句用“竟”维持感叹力度，避免机械重复。
