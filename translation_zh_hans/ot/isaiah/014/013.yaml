source:
  edition: WLC
  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ בִֽ/לְבָבְ/ךָ֙ הַ/שָּׁמַ֣יִם אֶֽעֱלֶ֔ה מִ/מַּ֥עַל לְ/כֽוֹכְבֵי אֵ֖ל אָרִ֣ים כִּסְאִ֑/י וְ/אֵשֵׁ֥ב בְּ/הַר מוֹעֵ֖ד בְּ/יַרְכְּתֵ֥י צָפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/013.yaml
  text: But you said in your heart[a], ‘I will ascend to the heavens; I will raise my throne above the stars of God, and I will sit on the mount of assembly in the far reaches of the north.’
translation:
  language: zh_hans
  text: 但你心里曾说：“我要升到天上；我要把我的宝座高举在上帝的众星之上；我要坐在聚会之山上，在北方最遥远之处[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可理解为“撒分山最遥远之处”；若“北方”（צָפוֹן）在此可能指涉古代近东传统中的撒分（Zaphon）山，这里便含有这种典故。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: 但你
  rationale: 结合上下文，此处连词带有转折意味；“但你”自然地突出受话者狂妄意图与其结局之间的反差。
- source_word: אָמַרְתָּ בִלְבָבְךָ
  choice: 你心里曾说
  rationale: 保留希伯来语“在心里说”的惯用表达，指内在的思想或自言自语；“曾”使先前的狂妄意念在中文叙述中更自然。
- source_word: הַשָּׁמַיִם אֶעֱלֶה
  choice: 我要升到天上
  rationale: “升到”准确表达עלה的向上运动，也保留夸耀者企图进入天界的崇高语气。
- source_word: מִמַּעַל לְכוֹכְבֵי אֵל
  choice: 在上帝的众星之上
  rationale: 按字面保留“上帝的众星”这一意象，不把它限定解释为天使、统治者或普通星辰；“众星”也自然体现集合意义。
- source_word: אָרִים כִּסְאִי
  choice: 我要把我的宝座高举
  rationale: רום的使役形表示使之升高或高举；“高举宝座”既保留空间图像，也传达自我抬高的意味。
- source_word: וְאֵשֵׁב
  choice: 我要坐
  rationale: ישב可指坐下或居住；此处与宝座及聚会之山的图像相连，直译“坐”可保留登位含义而不额外解释。
- source_word: בְּהַר מוֹעֵד
  choice: 在聚会之山上
  rationale: מוֹעֵד在此较可能指约定的集会；“聚会之山”保留其宇宙性或神圣议会背景，同时不将其误解为会幕。
- source_word: בְּיַרְכְּתֵי צָפוֹן
  choice: 在北方的极处
  rationale: יַרְכְּתֵי指边缘、深处或遥远尽头；“极处”简洁保留遥远位置感。צָפוֹן正文按通常意义译为“北方”，专名含义另见脚注。
theological_decisions:
- issue: צָפוֹן是否暗指古代近东传统中的撒分山
  choice: 正文译作“北方”
  alternative: 将צָפוֹן视为专名，译作“撒分山”
  rationale: צָפוֹן通常表示“北方”，这一译法直接且符合词汇常义；但在巴比伦王的讽歌中，它也可能暗指古代近东传统中的宇宙神山撒分山，因此以脚注保留这一文学和宗教背景上的可能性。
- issue: “上帝的众星”的象征对象
  choice: 保留“上帝的众星”这一原文意象
  alternative: 明确译为“天上的众灵”或“众天使”
  rationale: 该短语既可能指星辰，也可能唤起天上众灵或超凡权势的意象。正文不限定其所指，以保留原文的含混性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留连续的“我要……”以再现原文夸耀性的节奏；“聚会之山”“上帝的众星”等核心意象不作解释性改写。脚注标记置于其实际所说明的“北方的极处”之后。
