base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/016.yaml
  text: 'Those who see you will stare at you; they will look closely at you: ‘Is this the man who made the earth tremble[a], who shook kingdoms,’'
translation:
  language: zh_hans
  text: 看见你的人都要定睛看你，仔细端详你[a]，说：“使大地震动、使列国震动的，就是这个人吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仔细察看你”或“审视你”。希伯来语动词不仅可指观看，也可包含仔细考察、思量的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאֶיךָ
  choice: 看见你的人
  rationale: 该词是带第二人称阳性单数后缀的Qal主动分词复数，在此作名词使用；译法保留了“那些看见你的人”的直接含义与对“你”的称呼。
- source_word: אֵלֶיךָ יַשְׁגִּיחוּ
  choice: 都要定睛看你
  rationale: שׁגח的Hiphil形态表达朝向对象专注观看；“定睛看”自然传达惊讶而专注的凝视。
- source_word: אֵלֶיךָ יִתְבּוֹנָנוּ
  choice: 仔细端详你
  rationale: בין的Hitpolel形态在此含仔细观察、审视或思量之意；“仔细端详”既延续视觉语境，也保留审察意味。
- source_word: הֲזֶה
  choice: 就是这个……吗
  rationale: 疑问词缀ה与指示词זֶה构成带震惊意味的反问；汉语用“就是这个……吗”自然呈现其修辞力度。
- source_word: הָאִישׁ
  choice: 人
  rationale: 原文是阳性单数名词，指眼前这位已经败落的男性统治者；与指示成分合译为“这个人”。
- source_word: מַרְגִּיז הָאָרֶץ
  choice: 使大地震动
  rationale: 使役分词表达令大地震颤或动荡；“使大地震动”保留了使役意义。
- source_word: מַרְעִישׁ מַמְלָכוֹת
  choice: 使列国摇撼
  rationale: רעשׁ的Hiphil分词表示使之震动；“使列国摇撼”与前句形成清楚、自然的平行。
theological_decisions:
- issue: 嘲讽诗中“这个人”的所指
  choice: 按经文直译为一位人的统治者，不在正文中加入后来的身份认定
  alternative: 在正文中明确译作撒但／路西弗，或同时指巴比伦王与宇宙性的叛逆者
  rationale: 本节希伯来文明确说“这个人”，紧接的文学语境是对巴比伦王的嘲歌。译文应保留原文措辞，不把后来的神学解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“定睛看”与“仔细端详”保留原文两个观看动词的递进和平行；将脚注标记置于其实际说明的“仔细端详你”之后。
