  text: וּ/לְקָח֣וּ/ם עַמִּים֮ וֶ/הֱבִיא֣וּ/ם אֶל מְקוֹמָ/ם֒ וְ/הִֽתְנַחֲל֣וּ/ם בֵּֽית יִשְׂרָאֵ֗ל עַ֚ל אַדְמַ֣ת יְהוָ֔ה לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָח֑וֹת וְ/הָיוּ֙ שֹׁבִ֣ים לְ/שֹֽׁבֵי/הֶ֔ם וְ/רָד֖וּ בְּ/נֹגְשֵׂי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/002.yaml
  text: Peoples will take them and bring them to their place[a], and the house of Israel will possess them on the land of Yahweh as male slaves and female slaves. They will become captors of their captors[d][c][b], and they will rule over their oppressors.
translation:
  language: zh_hans
  text: 各族必带领他们，把他们带到他们自己的地方；以色列家必在雅威[d]的土地上得这些人为产业[a]，把他们据为己有，充作男奴和女奴[b]。他们必俘掳那些曾俘掳他们的人[c]，管辖那些压迫他们的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得这些人为产业”也可译作“把他们据为己有”；原文动词含有承受产业、取得为业的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文明确说“男奴和女奴”，分别标出两种性别。
    reason: lexical_clarification
  - marker: c
    text: 原文以同一词根重复表达“俘掳”，突出他们反过来俘掳昔日俘掳自己之人的逆转。
    reason: wordplay
  - marker: d
    text: “雅威”音译希伯来文神名 יהוה（YHWH）。
    reason: divine_name
lexical_decisions:
- source_word: וּלְקָחוּם עַמִּים
  choice: 各族必接他们来
  rationale: לקח的基本义是“取、带、接”；结合随后把他们送回故土的语境，“接他们来”自然表达各族接引以色列人的行动。עַמִּים译作“各族”，保留复数群体含义，不限定为现代民族国家。
- source_word: וֶהֱבִיאוּם אֶל־מְקוֹמָם
  choice: 把他们送回自己的地方
  rationale: הביא意为“带来、送到”；מְקוֹמָם直译“他们的地方”。“送回”依据复归故土的上下文，使中文自然，但不具体添加经文未明说的地名。
- source_word: וְהִתְנַחֲלוּם
  choice: 得这些人为产业
  rationale: נחל的Hitpael形式在这里带有取得为产业、占有之意；“得……为产业”既保留产业/继承色彩，也明确宾语是前述各族之人。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留这一集体性、 covenantal-national 固定称谓，且符合现代中文圣经语体。
- source_word: עַל אַדְמַת יְהוָה
  choice: 在雅威的土地上
  rationale: אדמה指土地、地土；属格表达保留这地属于雅威的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: 作男奴和女奴
  rationale: 原文明确表示受奴役的身份，并区分男性与女性；直译避免以“仆人”等词淡化其严酷含义。
- source_word: וְהָיוּ שֹׁבִים לְשֹׁבֵיהֶם
  choice: 他们必俘掳那些曾俘掳他们的人
  rationale: 以重复“俘掳”再现שבה词根形成的反转式双关，同时比“成为掳掠者的掳掠者”更符合现代汉语。
- source_word: וְרָדוּ בְּנֹגְשֵׂיהֶם
  choice: 管辖那些压迫他们的人
  rationale: רדה意为统治、管辖；נגשׂ指施压者、压迫者。“压迫他们的人”涵盖其语义而不缩窄为特定制度中的督工。
theological_decisions:
- issue: 以色列得昔日压迫者为奴的反转图景
  choice: 直接译出男奴、女奴及统治反转，不作弱化
  alternative: 将其译为“男女仆人”或笼统改写为“使他们臣服”
  rationale: 原文明确使用受奴役身份用语，并刻画流亡与压迫的逆转。译文应忠实呈现这种张力，不以委婉语消解，也不据此添加超出文本的伦理或教义判断。
- issue: 神名יְהוָה的呈现
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名；音译“雅威”保留其作为以色列之神专名的性质。
- issue: וְהִתְנַחֲלוּם的产业语义
  choice: 得这些人为产业
  alternative: 占有他们；承受他们
  rationale: 此动词兼有取得、占有与产业/继承色彩；正文保留产业意象，脚注说明可理解为占有，以免将其收窄为现代继承法概念。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“接他们来、送回自己的地方”使复归场景自然连贯；“得……为产业”“男奴和女奴”保留原文严峻而有张力的社会政治反转，不作美化。分号划分接引归回与以色列得人作产业两个层次。
