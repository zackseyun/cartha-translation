  text: שְׁא֗וֹל מִ/תַּ֛חַת רָגְזָ֥ה לְ/ךָ֖ לִ/קְרַ֣את בּוֹאֶ֑/ךָ עוֹרֵ֨ר לְ/ךָ֤ רְפָאִים֙ כָּל עַתּ֣וּדֵי אָ֔רֶץ הֵקִים֙ מִ/כִּסְאוֹתָ֔/ם כֹּ֖ל מַלְכֵ֥י גוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/009.yaml
  text: Sheol beneath is stirred up for you[a], to meet your coming; it rouses the shades for you, all the leaders of the earth[b]; it raises from their thrones all the kings of the nations.
translation:
  language: zh_hans
  text: 下方的阴间因你而骚动，迎接你的到来；它为你唤醒阴魂[a]，就是地上所有的首领[b]；它使列国所有的君王都从宝座上起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“死人”或“亡灵”。希伯来语为“利乏音”（Rephaim），这里指阴间里的死者。
    reason: lexical_alternative
  - marker: b
    text: 直译“地上的公山羊”，在这里比喻显赫的统治者或首领。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 指地下的死者领域。采用“阴间”既保留希伯来诗歌中的冥界观念，也避免“地狱”所带入的后期刑罚含义，或“坟墓”过于具体的含义。
- source_word: מִתַּחַת
  choice: 下方的
  rationale: 保留原文明确的空间意象，并自然修饰“阴间”。
- source_word: רָגְזָה
  choice: 震动
  rationale: 该动词可表示战栗、震颤或骚动；“震动”既保留动态和不安感，也适合阴间被人格化的诗意场景。
- source_word: לִקְרַאת בּוֹאֶךָ
  choice: 迎接你的到来
  rationale: 保留阴间主动准备接纳来者的拟人画面，以及“到来”的名词化表达。
- source_word: עוֹרֵר
  choice: 惊动
  rationale: 表达阴间使其中的死者受扰而起的使动意味；“惊动”也与全句的震荡气氛相称。
- source_word: רְפָאִים
  choice: 阴魂
  rationale: 此处指阴间里的死者，而不是利乏音族。“阴魂”比单纯的“死人”更能保留诗歌中的幽冥色彩。
- source_word: עַתּוּדֵי אָרֶץ
  choice: 地上所有的首领
  rationale: 原义为“地上的公山羊”，在这里比喻显赫的统治者。“首领”清楚传达喻义，字面意象则收入脚注。
- source_word: הֵקִים
  choice: 使……起来
  rationale: 准确体现使役词形，描绘死去的君王从宝座上起身迎候来者。
- source_word: מִכִּסְאוֹתָם
  choice: 从宝座上
  rationale: “宝座”符合其王权语境，并与下文“君王”直接呼应。
- source_word: כֹּל מַלְכֵי גוֹיִם
  choice: 列国所有的君王
  rationale: 保留“所有”的全称范围和“列国”的政治性群体意象。
theological_decisions:
- issue: 诗歌中 שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；地狱；死者的领域
  rationale: 经文把它人格化为迎接已死君王的地下领域。“阴间”在现代汉语中简明自然，又不把经文限定为单一坟墓，也不引入“地狱”所常含的终末刑罚观念。
- issue: רְפָאִים 在本节中的所指
  choice: 阴魂
  alternative: 死人；亡灵；利乏音人
  rationale: 上下文位于阴间，并把历代君王描写为起身迎候，因此这里应按死者的诗性称谓理解；同时用脚注保留其他可行的汉语表达。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“震动—惊动—起来”形成连续动作，保留阴间被人格化、众王起身迎候的讽刺性戏剧画面。
