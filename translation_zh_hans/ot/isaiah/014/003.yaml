base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/003.yaml
  text: And it shall be[a], in the day when Yahweh gives you rest from your pain and your turmoil, and from the hard service with which you were made to serve[b],
translation:
  language: zh_hans
  text: 到了耶和华使你从痛苦[a]、不安和你所受的严酷劳役[b]中得到安歇的那一天，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “痛苦”或译“忧伤”。
    reason: lexical_alternative
  - marker: b
    text: “你所受的严酷劳役”或译“强加给你的严酷劳役”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: 到了……的那一天
  rationale: 这是引出未来情形的时间表达。译为“到了……的那一天”既保留先知话语的承接和将来意味，也符合现代汉语句法；句末逗号保留本节与下一节的连续关系。
- source_word: הָנִיחַ ... לְךָ מִן
  choice: 使你摆脱……得享安歇
  rationale: נוח的使役形在这里表示使人从困苦中得到安歇或解脱。此译保留使役含义，并自然带出三个以מִן引导的困境来源。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文直接使用四字神名；“耶和华”是现代中文圣经语境中通行且可辨识的专名译法，不以称号“主”取代原文专名。
- source_word: מֵעָצְבְּךָ
  choice: 摆脱痛苦
  rationale: עֹצֶב可指疼痛、忧伤或广义苦楚；上下文涉及压迫和劳役，“痛苦”保持其广度，不限定为纯粹的身体疼痛或情绪悲伤。
- source_word: וּמֵרָגְזֶךָ
  choice: 和不安
  rationale: רֹגֶז可表示扰动、焦躁、战栗或动荡。“不安”在现代汉语中可涵盖内心和处境上的不宁，同时避免过度具体化。
- source_word: הָעֲבֹדָה הַקָּשָׁה
  choice: 苦役
  rationale: עֲבֹדָה表示劳作或服役，קָשָׁה说明其艰苦严酷；“苦役”简洁地表达受压迫的繁重劳役，但不额外断定具体的奴隶制度形态。
- source_word: אֲשֶׁר עֻבַּד בָּךְ
  choice: 你被迫服的
  rationale: עבד的被动形式配合ב表示劳役施加于受话者。“被迫服”在汉语中清楚传达强制性，也保留该词与“服役、劳作”的语义联系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 主
  rationale: 原文使用神的专名，而非表示“主”的称号；正文保留专名，以免抹去两者的区别。
- issue: 劳役的社会性质
  choice: 苦役
  alternative: 奴役
  rationale: 经文明确表达严酷而被迫的劳役，但本节用词本身不必然界定为某一种特定法律形态的奴隶制度，因此不采用范围更窄、解释性更强的“奴役”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“得享安歇”略带经文语体，但普通读者容易理解；全句作为连接下一节的时间从句处理，因此保留句末逗号。脚注标记均紧随相关词语。
