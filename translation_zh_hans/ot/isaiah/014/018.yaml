  rationale: 修正脚注 a 的锚点，使其明确对应“尊荣”，并以“个个都”取代“他们全都”，在不削弱 כָּל……כֻּלָּם 的双重强调下改善汉语自然度。其余措辞及脚注保留原有的字面性与上下文含蓄。
