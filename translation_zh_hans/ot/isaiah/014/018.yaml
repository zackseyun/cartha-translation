  yaml_path: translation/ot/isaiah/014/018.yaml
  text: All the kings of the nations[a], all of them, lie in glory[b], each in his own house.
translation:
  language: zh_hans
  text: 列国所有的君王，个个都在尊荣[a]中躺卧，各在自己的宅中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“体面地”。
    reason: lexical_alternative
  - marker: b
    text: 直译“自己的房屋里”；按上下文，这可能指各自的坟墓或墓室。
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַלְכֵי גוֹיִם כֻּלָּם
  choice: 列国所有的君王，他们全都
  rationale: 既表达כָּל所指的全体，也保留כֻּלָּם复指所形成的强调；“列国”自然对应גוֹיִם。
- source_word: שָׁכְבוּ
  choice: 躺卧
  rationale: 该动词在语境中描述死后安葬的状态；“躺卧”保留原文意象，不直接解释为“安息”或“长眠”。
- source_word: בְכָבוֹד
  choice: 在尊荣中
  rationale: כָבוֹד在此表示君王死后所得的体面与尊荣；译文保留介词结构及原文一定程度的含蓄，不把它完全解释为“隆重安葬”。
- source_word: אִישׁ בְבֵיתוֹ
  choice: 各在自己的宅中
  rationale: אִישׁ在此作逐一分配用法，译为“各”；בֵיתוֹ字面为“他的房屋”，结合君王语境用“自己的宅中”保留“房屋”意象，同时脚注说明可能指坟墓或墓室。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“他们全都”有意保留希伯来文在“所有”之后的复指强调；“宅中”既符合君王身份，又不抹去原文“房屋”的含蓄表达。
