  source_fidelity: 希伯来文的总称与复指强调（“列国所有的君王……个个都”）、死亡/安葬语境中的“躺卧”、尊荣，以及逐一分配的“各在自己的宅中”均得到保留。原草稿的主要问题是脚注 a 的锚点错误地附在“躺卧”之后；该脚注实际说明的是“尊荣”的另一种译法。
  naturalness: “列国所有的君王，他们全都”虽可理解，但“列国所有的君王，个个都”在现代庄重书面语中更凝练自然，同时保留原文的强调。“宅中”适合本节的诗歌性和王者语境。
  terminology: “尊荣”适当地对应 כָּבוֹד，避免将其过度具体化为某种葬礼仪式；“宅”保留 בַּיִת 的“房屋”意象，脚注谨慎说明其在上下文中可能指墓地或墓室。
