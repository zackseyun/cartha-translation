id: ISA.14.1
reference: Isaiah 14:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי֩ יְרַחֵ֨ם יְהוָ֜ה אֶֽת יַעֲקֹ֗ב וּ/בָחַ֥ר עוֹד֙ בְּ/יִשְׂרָאֵ֔ל וְ/הִנִּיחָ֖/ם עַל אַדְמָתָ֑/ם וְ/נִלְוָ֤ה הַ/גֵּר֙ עֲלֵי/הֶ֔ם וְ/נִסְפְּח֖וּ עַל בֵּ֥ית יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/001.yaml
  text: For Yahweh will have compassion on Jacob and will again choose Israel[a], and he will settle them on their own land. The foreigner will join them[b], and they will attach themselves to the house of Jacob.
translation:
  language: zh_hans
  text: 因为耶和华必怜悯雅各，再次拣选以色列，使他们安居在自己的土地上。外来寄居者[a]必加入他们，并归附雅各家[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外来寄居者”也可译作“寄居者”或“外族人”。希伯来语 גֵּר 常指住在以色列人中间的非本族人，不只是路过的外人。
    reason: 保留该词关于外来身份与居留状态的词义范围。
  - marker: b
    text: 或译：“他们也必被接入雅各家。”
    reason: 保留希伯来语动词可按被动意义理解的可能。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的审判宣告提供缘由；“因为”自然保留原文的因果衔接。
- source_word: יְרַחֵם
  choice: 必怜悯
  rationale: רחם 的 Piel 形式表达带有深切关怀的怜悯；“怜悯”庄重、通俗，也保留其情感力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确保留原文专名。
- source_word: וּבָחַר עוֹד בְּיִשְׂרָאֵל
  choice: 再次拣选以色列
  rationale: עוֹד 表明拣选行动的恢复或重申；“再次拣选”不把它误解为初次拣选。
- source_word: וְהִנִּיחָם עַל אַדְמָתָם
  choice: 使他们安居在自己的土地上
  rationale: 使役形式在归回土地的语境中兼有安置和得安息之意；“使……安居”自然地表达二者，而“自己的土地”体现所属后缀及复归含义。
- source_word: הַגֵּר
  choice: 寄居的外族人
  rationale: גֵּר 通常指住在以色列人中间、并非本族出生的人，不只是短暂停留的陌生人；此译兼顾其外来身份和居留状态。
- source_word: וְנִלְוָה הַגֵּר עֲלֵיהֶם
  choice: 寄居的外族人必与他们联合
  rationale: נלוה 表示加入、依附或联合；“与他们联合”自然保留主动归属的意味，同时避免过度规定其法律或宗教身份。
- source_word: וְנִסְפְּחוּ עַל בֵּית יַעֲקֹב
  choice: 也必归入雅各家
  rationale: ספח 的 Niphal 形式可表达被接入或归附；“归入”简洁地呈现与雅各家形成紧密归属关系，并保留“家”的群体与家族意象。
theological_decisions:
- issue: 以色列被“再次拣选”的含义
  choice: 译作“再次拣选以色列”，表达审判之后神重新施恩并坚立其拣选。
  alternative: 可理解为偏重民族政治复兴，或偏重末后性的复兴。
  rationale: 原文在复归语境中表达耶和华重新施予恩宠和确认关系，但没有限定这应当仅按民族、末世或预表层面理解，因此译文不替文本消除这种张力。
- issue: הַגֵּר 的身份
  choice: 译作“寄居的外族人”。
  alternative: 可译“寄居者”或“外族人”。
  rationale: 原文描绘非以色列出身者与雅各家联合；所选译法兼顾外来身份和长期居留的可能，不强行套用后期特定法律类别。
- issue: וְנִסְפְּחוּ 的语态和归属含义
  choice: 正文译作“归入雅各家”。
  alternative: 可译“被接入雅各家”。
  rationale: 希伯来语 Niphal 既容许强调主体归附，也容许强调被纳入；正文采用自然中文，脚注保留被动理解。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“安居”兼顾安置与得安息；“雅各家”保留原文的家族—群体意象。脚注标记按其实际说明对象放置，分别位于“寄居的外族人”和末句之后。
