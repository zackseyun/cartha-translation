  terminology: “耶和华”“雅各”“以色列”“拣选”“雅各家”均恰当，且保持庄重而不过分文言的经文语体。“外来寄居者”保留 גֵּר 的外来者及居留者双重语义，脚注说明其可能的较宽泛译法。
