revisions:
- from: 因为耶和华必怜悯雅各，再次拣选以色列，使他们安居在自己的土地上。寄居的外族人[a]必与他们联合，也必归入雅各家[b]。
  to: 因为耶和华必怜悯雅各，再次拣选以色列，使他们安居在自己的土地上。外来寄居者[a]必加入他们，并归附雅各家[b]。
  rationale: 修订仅改善中文搭配并更贴近两个“加入／归附”动词的方向性。“加入他们”对应外来者与以色列联合；“归附雅各家”保留原文“家”的群体意象及紧密归属关系。未将拣选、外来者身份或归附的含义作教义性扩展。
