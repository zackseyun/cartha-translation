  text: וְ/קַמְתִּ֣י עֲלֵי/הֶ֔ם נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/הִכְרַתִּ֨י לְ/בָבֶ֜ל שֵׁ֥ם וּ/שְׁאָ֛ר וְ/נִ֥ין וָ/נֶ֖כֶד נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/022.yaml
  text: And I will rise up against them[a], declares Yahweh of Armies, and I will cut off from Babylon name and remnant, offspring and posterity[b], declares Yahweh.
translation:
  language: zh_hans
  text: “我要起来攻击他们，”万军之雅威[a]宣告说，“我要从巴比伦剪除名号、余剩、子孙和后代[b]。”这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之雅威”也可译作“众军的雅威”；“万军”指他所统辖的众军。神名“雅威”传统上也译作“耶和华”。
    reason: lexical_alternative
  - marker: b
    text: “名号、余剩、子孙和后代”是全面性的并列表达，意指巴比伦的记念、所余剩的（包括幸存者）及其延续的后裔都要被除尽。
    reason: cultural_note
lexical_decisions:
- source_word: וְקַמְתִּי עֲלֵיהֶם
  choice: 我要起来攻击他们
  rationale: קום与עַל连用，在本段审判语境中表示采取敌对行动；“起来攻击”既保留希伯来语意象，也清楚表达其审判意味。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 万军之雅威宣告说
  rationale: נְאֻם按先知宣告公式译为“宣告说”；יְהוָה以专名“雅威”呈现；צְבָאוֹת译作传统而庄严的“万军”，保留其统帅众军的称号意味。
- source_word: וְהִכְרַתִּי לְבָבֶל
  choice: 我要从巴比伦剪除
  rationale: הכרית在审判语境中有除灭、断绝之意；“剪除”保留原文强烈而凝练的表达。此处לְבָבֶל在动词支配下表达从巴比伦除去这些事物。
- source_word: שֵׁם
  choice: 名号
  rationale: 该词可涵盖名字、身份与留在人间的记念；“名号”保留原文简洁，又比单说“名字”更适合国族语境。
- source_word: שְׁאָר
  choice: 残存者
  rationale: 这里指审判后仍存留的人，并无正面的神学含义；“残存者”可避免“余民”在圣经语境中可能带出的蒙保守意味。
- source_word: נִין וָנֶכֶד
  choice: 子孙和后代
  rationale: 两个近义亲属词并列，强调延续到以后世代的血脉；译文保留并列和一定程度的语义重叠，不强行限定为特定两代。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留原文末尾重复的先知宣告公式及其庄严强调；用自然的现代汉语收束全句。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”旨在把它作为专名呈现，而不是以称号“上主”替代；“耶和华”是汉语传统形式，可列为读者熟悉的异译。
- issue: 称号צְבָאוֹת的理解
  choice: 万军
  alternative: 众军；万军之主
  rationale: 原词可指受神统辖的天上及地上众军。“万军”保留军事和统帅色彩，也避免把范围只限定为天军；不增添原文没有的“主”字。
- issue: 四项并列语的整体力度
  choice: 保留“名号和残存者、子孙和后代”的列举
  alternative: 意译为“彻底消灭巴比伦的一切记忆和后裔”
  rationale: 原文通过四项并列表达全面灭绝。正文保留其修辞结构，脚注再说明整体效果，以免把诗性张力压缩成解释性改写。
translation_notes:
  register: 采用庄严而清楚的现代标准汉语。保留两次“宣告”公式、审判动词“剪除”和四项并列结构；避免文言化过重，也不把“残存者”处理成带正面救赎色彩的“余民”。
