  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי יְהוָ֧ה צְבָא֛וֹת יָעָ֖ץ וּ/מִ֣י יָפֵ֑ר וְ/יָד֥/וֹ הַ/נְּטוּיָ֖ה וּֽ/מִ֥י יְשִׁיבֶֽ/נָּה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/027.yaml
  text: For Yahweh of hosts has purposed[a], and who can annul it? His hand is stretched out[b], and who can turn it back?
translation:
  language: zh_hans
  text: 因为万军之耶和华已经定意[a]，谁能废除这旨意呢？他的手已经伸出[b]，谁能使它收回呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “废除”也可译作“挫败”。希伯来语动词可指破坏、废止或使计划落空。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他的手是伸出的”或“他的手伸展着”。这一意象通常表示主动施展能力，且常与审判有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的宣告说明根据；现代汉语以“因为”自然呈现这一论证关系。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神的专名“耶和华”，并以中文圣经传统中自然、庄重且语义较宽的“万军之”表达 צְבָאוֹת。
- source_word: יָעָץ
  choice: 已经定意
  rationale: 这里指形成并确定旨意或计划；“定意”简洁地保留其谋定、决意的意味。
- source_word: יָפֵר
  choice: 能废除
  rationale: פרר 的使役形在此可指破坏、废止或挫败既定计划；“废除”与隐含宾语“所定之意”搭配自然，同时保留结果性。
- source_word: יָדוֹ הַנְּטוּיָה
  choice: 他的手已经伸出
  rationale: 保留希伯来文拟人化意象；分词描述手处于伸出、正在施行能力的状态，“已经伸出”在中文中自然。
- source_word: יְשִׁיבֶנָּה
  choice: 能使它收回
  rationale: 使役形表达使那只伸出的手返回；“使它收回”直接呈现无人能令其撤回行动之意。
theological_decisions:
- issue: 神圣称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 万军之雅威
  rationale: 采用现代中文读者熟悉的神名形式“耶和华”，而非用“主”替代专名；“万军之”保留该称号对天上与地上众军的宽广指涉。
- issue: 伸手意象是否明确解释为审判
  choice: 保留“他的手已经伸出”的意象，不在正文中补入“施行审判”
  alternative: 他的手已经伸出施行审判
  rationale: 上下文可能指向审判中的主动能力，但本节本身以意象表达，并未明说“审判”；保留其神学张力，避免过度解释。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。两个反问句保留原文平行结构；“定意—废除”与“伸出—收回”形成鲜明对应。
