  text: וּ/מַֽה יַּעֲנֶ֖ה מַלְאֲכֵי ג֑וֹי כִּ֤י יְהוָה֙ יִסַּ֣ד צִיּ֔וֹן וּ/בָ֥/הּ יֶחֱס֖וּ עֲנִיֵּ֥י עַמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/032.yaml
  text: And what will one answer the messengers of the nation? That Yahweh has founded Zion[b][a], and in her the afflicted of his people will find refuge.
translation:
  language: zh_hans
  text: 人该怎样回答那国的使者[a]呢？应当说：雅威已经建立锡安；他百姓中受苦的人[b]必在她里面得庇护。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“使节”或“使臣”；这里的希伯来词可指外交代表。
    reason: lexical_alternative
  - marker: b
    text: “受苦的人”也可译作“穷人”或“卑微的人”；原词可指贫困、困苦受压或卑微。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה יַעֲנֶה
  choice: 那么，该怎样回答……呢？
  rationale: 连接上文并保留疑问语气；第三人称单数在此作泛指，汉语用无主句表达自然，也不强加具体回答者。
- source_word: מַלְאֲכֵי גוֹי
  choice: 那国的使者
  rationale: מַלְאָךְ在此可指奉差传话者或外交使节；单数גּוֹי结合上下文译作“那国”，但不进一步指明是哪一国。
- source_word: כִּי
  choice: 要说：
  rationale: 此处引出所问问题的回答内容；汉语以“要说”加冒号比机械译作“因为”更清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其专名性质。
- source_word: יִסַּד צִיּוֹן
  choice: 已经奠立锡安
  rationale: יָסַד含奠基、建立之意；“奠立”保留建筑意象，并表达此行动已经确立。
- source_word: וּבָהּ יֶחֱסוּ
  choice: 必投靠在她里面
  rationale: חסה表示寻求或获得庇护；“投靠”体现主动寻求庇护。阴性代词指锡安，以“她”保留城邑拟人化意象。
- source_word: עֲנִיֵּי עַמּוֹ
  choice: 他百姓中受苦的人
  rationale: עָנִי可表示贫穷、困苦、受压或卑微；正文采用涵盖面较广的“受苦的人”，并以脚注保留其他可能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，音译为“雅威”可保留其作为以色列之神专名的性质，而非以称号替代。
- issue: 锡安的阴性代词
  choice: 在她里面
  alternative: 在其中
  rationale: 后缀בָהּ为阴性单数并指向锡安；采用“她”保存先知文学中城邑人格化的意象。
- issue: עֲנִיֵּי的语义范围
  choice: 受苦的人
  alternative: 穷人；卑微的人
  rationale: 该词可兼指物质贫困、受压困苦和卑微处境；正文不把含义限缩为单一经济或灵性类别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么”承接上文，“要说：”明确引出答复内容；保留锡安的拟人化表达。所有脚注标记均置于正文相应词语之后。
