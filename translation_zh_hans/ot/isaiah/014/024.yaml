  text: נִשְׁבַּ֛ע יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר אִם לֹ֞א כַּ/אֲשֶׁ֤ר דִּמִּ֨יתִי֙ כֵּ֣ן הָיָ֔תָה וְ/כַ/אֲשֶׁ֥ר יָעַ֖צְתִּי הִ֥יא תָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/024.yaml
  text: 'Yahweh of Armies has sworn[a], saying: Surely, just as I have planned, so it has come to pass; and just as I have purposed[d][c][b], so it will stand.'
translation:
  language: zh_hans
  text: 万军之耶和华起誓说：“我怎样筹划，就果然怎样成了；我怎样定意，就必怎样立定。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “就果然怎样成了”：原文为完成式，也可理解为以已成之事表达其必然实现，译作“就必怎样成就”。
    reason: 保留 הָיָתָה 的完成式及其在先知宣告中可表达确定未来的体貌张力。
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”呈现神名，以“万军”表达 צְבָאוֹת 所指的众军，既保留以赛亚书中庄严的神圣称号，也符合现代中文圣经语体。
- source_word: נִשְׁבַּע
  choice: 起誓
  rationale: 该完成式动词表示郑重立誓；中文“起誓”简洁自然，能传达誓言的严肃性。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的常用表达，中文译作“说”自然且贴近原文功能。
- source_word: אִם לֹא
  choice: 不单独明译，以肯定式平行句体现
  rationale: 这是希伯来语誓言中的固定用语，字面为“若不”，实际加强随后陈述的确定性。中文由“起誓说”及两个“就必”自然传达其强烈肯定语气，避免生硬直译。
- source_word: דִּמִּיתִי
  choice: 我怎样筹划
  rationale: 该词可指思想、打算或谋划；在与 יָעַצְתִּי 平行且涉及神所决定之事的语境中，“筹划”体现有意的规划，同时不把两词完全合并。
- source_word: הָיָתָה
  choice: 事情就必怎样成就
  rationale: 原文形式为完成式，字面近于“就这样成了”。在先知性宣告中可表达确定必成之事；中文以“必……成就”传达其确定性，同时补出隐含的“事情”以使语句自然。
- source_word: יָעַצְתִּי
  choice: 我怎样定意
  rationale: 该动词可指商议、筹谋或决断。“定意”突出已经作出的决断，又与前句“筹划”形成有区别的平行表达。
- source_word: הִיא תָקוּם
  choice: 事情就必怎样立定
  rationale: תָקוּם 的基本意象是站立、成立；“立定”保留这一意象，并表达所定之事必然确立。阴性代词 הִיא 所指为隐含的计划、定意或事情，中文补作“事情”。
theological_decisions:
- issue: 神圣称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 万军之主；耶和华万军之神
  rationale: “万军之耶和华”同时保留神名和 צְבָאוֹת 的军事、天军或众军语义，不以一般称号取代专名，也不额外补入原文没有的“神”。
- issue: 誓言惯用语 אִם לֹא 的处理
  choice: 由“起誓说”和“就必”表达强烈肯定
  alternative: 明译为“我实在……”或字面译为“若不……”
  rationale: 原文不是普通条件句，而是誓言中的强烈断言。直译“若不”在中文中语义残缺；加入“实在”可行，但正文以誓言框架和“必”已充分传达确定性。
- issue: הָיָתָה 的时间与体貌
  choice: 译作“必……成就”
  alternative: 译作“已经成就”或“就这样成了”
  rationale: 希伯来语采用完成式，可能把神所计划之事视为确定实现，未必要求在说话时已经发生。结合下一分句未完成式 תָקוּם，中文用“必”保持先知性确定感，也在脚注中保留完成式的另一理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以两组“我怎样……事情就必怎样……”保持原文平行结构。“筹划／定意”和“成就／立定”分别呈现两组近义词的细微区别。正文中的脚注标记置于整节末尾。
