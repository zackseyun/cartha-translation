id: ISA.14.31
reference: Isaiah 14:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵילִ֤ילִֽי שַׁ֨עַר֙ זַֽעֲקִי עִ֔יר נָמ֖וֹג פְּלֶ֣שֶׁת כֻּלֵּ֑/ךְ כִּ֤י מִ/צָּפוֹן֙ עָשָׁ֣ן בָּ֔א וְ/אֵ֥ין בּוֹדֵ֖ד בְּ/מוֹעָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/031.yaml
  text: Wail[a], O gate! Cry out, O city! Melt away, all of you, Philistia! For smoke comes from the north[c][b], and there is no straggler in his ranks.
translation:
  language: zh_hans
  text: 城门啊，哀号[a]！城啊，呼喊！非利士啊，你全境都要消融[b]！因为烟从北方而来，来者的队伍中没有一人掉队[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哀号”也可译作“号啕”或“悲鸣”。
    reason: lexical_alternative
  - marker: b
    text: “消融”也可译作“瘫软”或“因恐惧而崩溃”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“在他指定的位置上，没有一人缺席。”原文末句也可能涉及指定的时间、地点或编组。
    reason: alternative_reading
lexical_decisions:
- source_word: הֵילִילִי
  choice: 要哀号
  rationale: 该词是阴性单数命令式，表示在悲痛或危难中高声哀哭；“哀号”自然、庄重，并保留强烈语气。
- source_word: שַׁעַר
  choice: 城门啊
  rationale: 原文直接呼唤“门”，并以城门代指城的防御和公共生活；补出“城”使现代中文清楚而不改变意象。
- source_word: זַעֲקִי
  choice: 要呼喊
  rationale: 阴性单数命令式，表示因危急而大声喊叫；“呼喊”保留紧迫感而不过度限定为哪一种叫声。
- source_word: עִיר
  choice: 城啊
  rationale: 与“城门”平行，采用呼语形式，保留先知诗歌中的直接斥呼。
- source_word: נָמוֹג
  choice: 消融
  rationale: 该词可指融化、崩溃或因恐惧而丧胆；“消融”保留原文隐喻及其多重可能。
- source_word: פְּלֶשֶׁת כֻּלֵּךְ
  choice: 非利士全地啊，你
  rationale: 非利士被视为阴性集合体而受呼唤；“全地”表达 כֻּלֵּךְ 所指整个非利士，同时用“你”保留单数拟人化称呼。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述哀号、呼喊和消融的原因。
- source_word: מִצָּפוֹן
  choice: 从北方
  rationale: 直接表达威胁来临的方向，不额外确定入侵者身份。
- source_word: עָשָׁן
  choice: 烟
  rationale: 保留字面意象；它可能象征进军扬尘、战火或毁灭，但正文不将其解释固定化。
- source_word: בָּא
  choice: 而来
  rationale: 希伯来语完成式在预言语境中可有鲜明、迫近的表达效果；“而来”在中文中简洁自然。
- source_word: וְאֵין בּוֹדֵד
  choice: 没有一人掉队
  rationale: בודד 表示与群体分离者；在进军语境中，“掉队”自然体现军队严整、无人落后。
- source_word: בְּמוֹעָדָיו
  choice: 在他的队伍中
  rationale: 该短语字面可涉及指定的时间、地点或编组；结合军事意象，正文采用“队伍中”，并以脚注保留歧义。
theological_decisions:
- issue: 末句 וְאֵין בּוֹדֵד בְּמוֹעָדָיו 的解释
  choice: 描述从北方而来的入侵力量队列严整，没有人掉队。
  alternative: 没有人在其指定的时间、地点或编组中缺席或落单。
  rationale: “北方来的烟”构成进军或毁灭的意象，军事性理解与上下文连贯；但 מועד 的语义并不完全确定，因此脚注保留较贴近字面的其他可能。
- issue: “烟”的所指
  choice: 正文保留“烟”的比喻，不明确解释为军队、尘云或战火。
  alternative: 将其解释性译为入侵大军所扬起的烟尘或毁灭之火。
  rationale: 原文只写 עָשָׁן，直接解释会消除诗歌意象本有的开放性。
translation_notes:
  register: 采用现代、庄重且可朗读的先知诗歌语体。以“城门啊”“城啊”“非利士全地啊”保留连续呼语和平行结构；正文尽量保存“消融”“烟”等原文意象，并用脚注说明关键歧义。
