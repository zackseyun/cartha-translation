  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹֽא תֵחַ֤ד אִתָּ/ם֙ בִּ/קְבוּרָ֔ה כִּֽי אַרְצְ/ךָ֥ שִׁחַ֖תָּ עַמְּ/ךָ֣ הָרָ֑גְתָּ לֹֽא יִקָּרֵ֥א לְ/עוֹלָ֖ם זֶ֥רַע מְרֵעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/020.yaml
  text: You will not be joined with them in burial[a], because you have destroyed your land; you have slain your people. The offspring of evildoers will never be named.
translation:
  language: zh_hans
  text: 你不会与他们同葬，因为你毁坏了自己的国土；杀害了自己的人民。作恶者的后代[a]必永远不被称名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后代”也可译作“后裔”或“子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵחַד אִתָּם בִּקְבוּרָה
  choice: 与他们同葬
  rationale: יחד在此表达与他人合在一起；结合קְבוּרָה，译为“与他们同葬”既简洁自然，也保留被排除在共同安葬之外的含义。
- source_word: אַרְצְךָ
  choice: 自己的国土
  rationale: 此处אֶרֶץ指受斥责之君王所统治的土地或国家；“国土”比“土地”更清楚地表达政治疆域，而“自己的”保留第二人称所有关系及其讽刺意味。
- source_word: שִׁחַתָּ
  choice: 毁坏了
  rationale: שׁחת的Piel词形在此表示毁灭、破坏；“毁坏了”符合先知审判语境，又不额外引入道德败坏之义。
- source_word: עַמְּךָ הָרָגְתָּ
  choice: 杀害了自己的人民
  rationale: 直译其宾语与动词关系，并以“杀害”保持庄重而强烈的控诉语气；不使用“谋杀”，以免加入原词未明说的法律分类。
- source_word: לֹא יִקָּרֵא לְעוֹלָם
  choice: 必永远不被称名
  rationale: 保留קרא的被动形式及“称名”这一核心意象，也保留其可能涉及名声、纪念或存续身份的含义，不将其缩窄为“无人提起”。
- source_word: זֶרַע מְרֵעִים
  choice: 作恶者的后代
  rationale: זֶרַע在此为集合性用法，可指后裔或后代；מְרֵעִים是复数，故译作泛指的“作恶者”，不擅自限定为单一暴君。
theological_decisions:
- issue: זֶרַע מְרֵעִים是专指受审君王的王朝，还是泛指作恶者的后代
  choice: 作恶者的后代
  alternative: 这个恶人的后代；恶人的子孙
  rationale: 希伯来文מְרֵעִים为复数，语法上是泛称；上下文虽可使读者联想到该君王的后裔，译文仍不把原文缩窄为只指一人或一个王朝。
- issue: “不被称名”具体指绝后、失去名望，还是不再被纪念
  choice: 保留“必永远不被称名”的表达
  alternative: 必永远不再被人纪念；必永远没有名号
  rationale: 原文没有明确解释“称名”的具体机制；直保留这一意象，可避免提前消除其关于身份、名声与延续性的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知审判语体。“同葬”“称名”略带经文庄严感，但在现代普通话中仍可理解。第二句依希伯来文的两个完成式并列处理为两个连续指控。
