  text: גַּם בְּרוֹשִׁ֛ים שָׂמְח֥וּ לְ/ךָ֖ אַרְזֵ֣י לְבָנ֑וֹן מֵ/אָ֣ז שָׁכַ֔בְתָּ לֹֽא יַעֲלֶ֥ה הַ/כֹּרֵ֖ת עָלֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/008.yaml
  text: 'Even the cypresses rejoice over you[a], the cedars of Lebanon: ‘Since you have lain down, no woodcutter comes up against us.’'
translation:
  language: zh_hans
  text: '连柏树[a]和黎巴嫩的香柏树也因你而欢喜；它们说：

    “自从你躺下以后，

    再没有伐木人上来砍伐我们。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杜松”或“冷杉”；希伯来词所指的确切树种不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 连……也
  rationale: 表达附加兼强调的语气，突出不仅人欢喜，连树木也欢喜。
- source_word: בְּרוֹשִׁים
  choice: 松树
  rationale: 该词指某种针叶树，但具体树种难以确定；“松树”是现代汉语中自然、易懂的概括性译法，并以脚注保留其他可能。
- source_word: שָׂמְחוּ לְךָ
  choice: 因你而欢喜
  rationale: שמח 与 ל 的组合可指因某人或其遭遇而欢喜；此译自然表达这些树因暴君倒下而欣喜，同时不额外说明原因。
- source_word: אַרְזֵי לְבָנוֹן
  choice: 黎巴嫩的香柏树
  rationale: 忠实呈现这一结构短语；“香柏树”是该树名在中文圣经传统及现代用语中清楚可辨的表达。
- source_word: מֵאָז
  choice: 自从……后
  rationale: 标明从对方倒下这一时刻开始并延续至今的状态。
- source_word: שָׁכַבְתָּ
  choice: 你躺下
  rationale: 保留希伯来文“躺下”的诗性隐喻，不直接解释为死亡或败亡。
- source_word: לֹא יַעֲלֶה
  choice: 再没有……上来
  rationale: 结合 מֵאָז 表达此后持续不再发生的情况，也保留“上来”的空间意象。
- source_word: הַכֹּרֵת
  choice: 伐木的人
  rationale: 该分词在树木语境中指砍伐树木者；此译比单纯“砍伐者”更自然明确。
- source_word: עָלֵינוּ
  choice: 上来砍伐我们
  rationale: 介词表达针对树木而来的敌对行动；中文以动词补足其实际所指，避免生硬的“上来攻击我们”。
theological_decisions:
- issue: 树木欢喜的比喻性质
  choice: 保留树木拟人化并让香柏树直接发言
  alternative: 将其处理为伐木活动实际减少的说明
  rationale: 本节属于讥讽诗，拟人化是诗歌表达的重要部分；不把意象扁平化为解释性陈述。
- issue: שָׁכַבְתָּ 在语境中的含义
  choice: 译作“你躺下”，保留隐喻
  alternative: 译作“你死了”或“你被打倒了”
  rationale: 原文可暗示死亡或败亡，但没有在本词中明说；保留措辞可维持诗意及其含义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“连……也”呈现强调，以直接引语保留树木拟人化；“躺下”保留原文对死亡或败亡的含蓄表达。
