base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/030.yaml
  text: The firstborn of the poor will graze[a], and the needy will lie down in safety; and I will kill your root with famine[b], and it will slay your remnant.
translation:
  language: zh_hans
  text: 穷人中的长子必得喂养[a]，穷困的人必安然躺卧；我也要用饥荒杀灭你的根；他要杀死你剩下的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“穷人中最贫穷的人。”希伯来文直译为“穷人的长子”，也可能是加强语气的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“他要杀死你剩下的人”，但没有明说“他”是谁；可理解为未指明的审判执行者，也可能指饥荒或施行审判者。
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָעוּ
  choice: 必吃草
  rationale: רעה在Qal中指牲畜吃草、放牧；这里与“躺卧”共同构成牧养图景，因此保留具体意象。
- source_word: בְּכוֹרֵי דַלִּים
  choice: 穷人中的长子
  rationale: 直译בכור的“长子”含义，不在正文中径直改成最高级；可能的惯用强化义置于脚注。
- source_word: וְאֶבְיוֹנִים
  choice: 贫寒人
  rationale: אביון强调贫乏和有需要的处境，并与前面的דלים略作区分。
- source_word: לָבֶטַח יִרְבָּצוּ
  choice: 必安然躺卧
  rationale: לבטח表示安全无惧，רבץ常指牲畜伏卧；译文兼顾自然汉语和牧养意象。
- source_word: וְהֵמַתִּי בָרָעָב
  choice: 我却要用饥荒治死
  rationale: מות的Hiphil表示使之死亡，ב表示手段；“治死”保留主动施行审判的力度。连接词译作“却”以自然呈现前后命运的对照。
- source_word: שָׁרְשֵׁךְ
  choice: 你的根
  rationale: 保留“根”的原文隐喻，不具体限定为根基、王统或后裔。
- source_word: וּשְׁאֵרִיתֵךְ
  choice: 你所余剩的人
  rationale: שארית指剩余者或余民；此处用自然汉语表达所剩下的人，同时不额外赋予专门神学含义。
- source_word: יַהֲרֹג
  choice: 另有一位要杀死
  rationale: 原文为第三人称阳性单数，且主语未明。此译保留从第一人称转为第三人称的突变，又避免把饥荒或上帝擅定为主语。
theological_decisions:
- issue: 末句第三人称单数动词的主语不明确
  choice: 译作“另有一位要杀死”，保留未指明的第三人称施事者
  alternative: 译作“饥荒要杀死”或“我要杀死”
  rationale: 希伯来文由“我却要……治死”转为第三人称阳性单数“他要杀死”。正文不把主语径直认定为饥荒、耶和华或其他审判执行者，以保存原文的语法张力；脚注说明其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吃草—躺卧”保留原文牧养图景；“根”保留审判宣告中的隐喻。正文中的[a]、[b]均与脚注对应。
