  text: שָׁבַ֥ר יְהוָ֖ה מַטֵּ֣ה רְשָׁעִ֑ים שֵׁ֖בֶט מֹשְׁלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/005.yaml
  text: Yahweh has broken the staff of the wicked[a], the scepter of rulers,
translation:
  language: zh_hans
  text: '雅威折断了恶人的杖[a]，

    也折断了统治者的权杖。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杖”也可译作“棍棒”。希伯来文在两个平行短语中使用了两个可表示权力工具的词：这里译作“杖”和“权杖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבַר
  choice: 折断了
  rationale: 该词是Qal完成式第三人称阳性单数，表示已经完成的“折断”行动；“折断了”自然、准确，也保留此行动在上下文中的现实结果。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，而不以“主”这一称号替代。
- source_word: מַטֵּה
  choice: 杖
  rationale: 该词可指杖或棍棒；此处与下句的שֵׁבֶט构成诗歌平行，“杖”既简洁，又能与“权杖”有所区分。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是复数的实词化形容词，泛指邪恶之人；“恶人”在现代汉语中自然，并保留其集合意义。
- source_word: שֵׁבֶט
  choice: 权杖
  rationale: 该词可指棍、杖或权杖；因其与“统治者”搭配，此处译作象征并施行统治权力的“权杖”最合适。
- source_word: מֹשְׁלִים
  choice: 统治者
  rationale: 这是词根משל（统治）的Qal主动分词复数；“统治者”直接传达其意义，不额外加入“暴君”等评价。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名；采用“雅威”保留其作为专名的性质，而不将其替换为称号。
- issue: 两行是否指同一类掌权者
  choice: 保留“恶人”与“统治者”的平行表达
  alternative: 将两者合并为“邪恶的统治者”
  rationale: 希伯来文分别使用“恶人”和“统治者”，两者在平行结构中关系密切，但并未在语法上明确合并为单一名词短语；译文保留这一张力，不作过度解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为使希伯来诗歌的平行结构在汉语中清楚可辨，第二行补出“也折断了”；这是语法上的自然补足，并未增加新的动作。
