  yaml_path: translation/ot/isaiah/014/014.yaml
  text: I will ascend above the heights of the clouds[a]; I will make myself like the Most High.
translation:
  language: zh_hans
  text: 我要升到云的高处之上；我要使自己与至高者相似[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要如同至高者。”希伯来语动词可作较简略的表达；“使自己与……相似”则较明确地呈现其自我比拟的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: 我要升到
  rationale: 该词是עלה的Qal未完成式第一人称单数，表示向上移动；“升到”既自然，也保留这里自我高举的语气。
- source_word: עַל
  choice: ……之上
  rationale: 与表示上升的动词及“云层的高处”连用时，宜表达超越性的高度，而非仅仅落在某物表面。
- source_word: בָּמֳתֵי עָב
  choice: 云层的高处
  rationale: בָּמָה表示“高处”，其复数构造式与עָב“云、密云”组成短语；“云层的高处”保留空间意象，又符合现代汉语。
- source_word: אֶדַּמֶּה
  choice: 我要使自己像
  rationale: 该词在此为דמה的Hitpael未完成式第一人称单数，带有使自己可与之相比、使自己变得相像的反身意味；“使自己像”比单纯“我要像”更充分地体现这一点。
- source_word: לְעֶלְיוֹן
  choice: 至高者
  rationale: עֶלְיוֹן在此用作对上帝的称号；“至高者”是庄重、清楚且通行的现代中文表达。
theological_decisions:
- issue: 将עֶלְיוֹן作为上帝的称号处理
  choice: 至高者
  alternative: 最高者
  rationale: 上下文是说话者妄图把自己抬高到与上帝相似的地位。“至高者”保留这一神学力度，同时不引入本节以外的后期解释。
- issue: אֶדַּמֶּה的反身意味
  choice: 我要使自己像
  alternative: 我要像
  rationale: 采用反身表达，以呈现说话者主动使自己与至高者相比的狂妄宣称；同时不把“相像”的具体范围解释得超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“云层的高处”保留希伯来语的垂直空间意象；分号对应两句并列的第一人称宣告，突出递进的自我高举。
