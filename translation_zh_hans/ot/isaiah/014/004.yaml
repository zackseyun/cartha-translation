base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/004.yaml
  text: 'you will take up this taunt against the king of Babylon[a], and say: “How the oppressor has ceased, the insolence has ceased!”'
translation:
  language: zh_hans
  text: '你要用这首讥讽诗讥刺巴比伦王，说：


    “那欺压人的何竟止息！


    残暴的压榨[a]何竟止息！”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “残暴的压榨”：希伯来语原词罕见，含义不确定；也可理解为“狂妄”、“猛烈进逼”或“强征暴政”。传统上有译作“金城”的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂאתָ
  choice: 你要用……说
  rationale: נשא与מָשָׁל连用，表示发出、吟诵或说出一首箴言式诗歌；汉语以“用这首……说”自然传达此惯用义。
- source_word: הַמָּשָׁל הַזֶּה
  choice: 这首讥讽诗
  rationale: מָשָׁל可指箴言、比喻、警句或讥讽歌；此处下文嘲弄巴比伦王，译作“讥讽诗”兼顾文体和语用功能。
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: 嘲弄巴比伦王
  rationale: עַל本可作“论到”或“针对”；结合敌对讥讽语境，以动词“嘲弄”自然表达其指向，但不把对象理解为仅仅中性的谈论主题。
- source_word: אֵיךְ
  choice: 何竟
  rationale: 引出惊叹性的讥讽；“何竟”比单纯“怎样”更能体现突然而彻底终结的感叹语气。
- source_word: שָׁבַת / שָׁבְתָה
  choice: 止息 / 终止
  rationale: 两者同源，都表示停止。汉语采用近义复现，保持平行结构，同时避免连续两句措辞僵硬。
- source_word: נֹגֵשׂ
  choice: 欺压人的
  rationale: 该分词名词化，指驱使、强征或压迫他人的人；“欺压人的”通俗而准确，可指巴比伦统治者。
- source_word: מַדְהֵבָה
  choice: 残暴的压榨
  rationale: 此词仅见于此处，意义不确定；从可能与施压、强征相关的解释看，“残暴的压榨”能与נֹגֵשׂ形成自然平行，并比传统的“金城”更有词源和语境依据。
theological_decisions:
- issue: 罕见词מַדְהֵבָה的解释
  choice: 残暴的压榨
  alternative: 金城；狂妄；猛烈进逼；强征暴政
  rationale: 这是词汇解释问题，并无必要作教义化处理。正文采用较符合上下文平行关系、也较受现代词汇研究支持的“压榨”义；脚注保留“金城”等传统及其他可能解释，明确呈现原文的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“讥讽诗”说明מָשָׁל在本段的诗歌和嘲讽功能；两行保留希伯来诗歌的平行与惊叹语气。脚注标记[a]置于相关诗句之后。
