  text: שָׂ֥ם תֵּבֵ֛ל כַּ/מִּדְבָּ֖ר וְ/עָרָ֣י/ו הָרָ֑ס אֲסִירָ֖י/ו לֹא פָ֥תַח בָּֽיְתָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/017.yaml
  text: who made the world like a wilderness and tore down its cities[a], who did not open the house for his prisoners?
translation:
  language: zh_hans
  text: 就是那使世界如同旷野、拆毁其中城邑、不为他的囚徒打开归家之路[a]的人吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文保留“打开”与“向家中／回家”的表达；可理解为“不让他的囚徒回家”、“不为他的囚徒开启归途”，或“不释放他的囚徒”。
    reason: 原文“打开”与带方向意义的“家／向家中”构成凝缩表达；脚注保留字面意象和几种合理理解，避免将其句法或含义定为单一解释。
lexical_decisions:
- source_word: שָׂם
  choice: 使……如同
  rationale: 这里的动词表达造成某种结果；“使世界如同旷野”既自然，也保留原文的比较结构。
- source_word: תֵּבֵל
  choice: 世界
  rationale: 该词通常指有人居住的世界；“世界”简明自然，也符合本段讽歌所呈现的广阔范围。
- source_word: כַּמִּדְבָּר
  choice: 如同旷野
  rationale: 前缀 כְּ 表示比较。“旷野”兼有荒凉、无人烟之意，不把意象局限为沙漠。
- source_word: וְעָרָיו
  choice: 其中城邑
  rationale: 后缀形式上是阳性单数，可理解为“它的”或“他的”。“其中”自然地把城邑与前述世界或其统治领域相连，同时避免断定这些城邑属于暴君个人。
- source_word: הָרָס
  choice: 拆毁
  rationale: 该动词指拆除、毁坏；“拆毁”保留了针对城邑的具体破坏意象。
- source_word: אֲסִירָיו
  choice: 他的囚徒
  rationale: 该词指被捆绑或囚禁的人。“囚徒”准确保留其受制于暴君的关系。
- source_word: לֹא פָתַח
  choice: 不……打开
  rationale: 保留 פתח“打开”的具体意象，不直接改写为“释放”，同时用后续短语使中文语义清楚。
- source_word: בָּיְתָה
  choice: 归家之路
  rationale: ביתה 含有朝向房屋或家中的方向意义。结合“打开”，译为“打开归家之路”较符合现代汉语，也保留原文关于“打开”和“回家”的双重意象；直译情况收入脚注。
