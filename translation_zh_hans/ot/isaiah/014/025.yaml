  text: לִ/שְׁבֹּ֤ר אַשּׁוּר֙ בְּ/אַרְצִ֔/י וְ/עַל הָרַ֖/י אֲבוּסֶ֑/נּוּ וְ/סָ֤ר מֵֽ/עֲלֵי/הֶם֙ עֻלּ֔/וֹ וְ/סֻ֨בֳּל֔/וֹ מֵ/עַ֥ל שִׁכְמ֖/וֹ יָסֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/025.yaml
  text: to break Assyria in my land[a], and on my mountains I will trample him; then his yoke will depart from upon them[b], and his burden from upon his shoulder will depart.
translation:
  language: zh_hans
  text: 我要在我的地上击破亚述[a]，在我的众山上践踏他；这样，他的轭必从他们身上离开，他的重担也必从他的肩头离开[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚述”也可译作“亚述人”；希伯来语这个词既可指亚述国，也可指代表它的君王或军队。
    reason: alternative_reading
  - marker: b
    text: 希伯来语在这里由复数的“他们身上”转为单数的“他的肩头”。这个单数可能把受压迫的百姓视为一个整体，也可能是分配式用法，意为各人的肩头。
    reason: number_shift
lexical_decisions:
- source_word: לִשְׁבֹּר
  choice: 击破
  rationale: 这是 שׁבר 的不定式，用来承接上文的誓言，表达目的或结果。“击破”既保留摧毁、折断的力度，也自然适用于作为帝国势力的亚述。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 该词既可指亚述国，也可指作为其代表的亚述王、军队或入侵者。正文采用国名“亚述”，脚注保留另一种理解。
- source_word: בְּאַרְצִי
  choice: 在我的地上
  rationale: 保留 אֶרֶץ 的领土含义和第一人称所属关系，也传达这片土地属于上帝的意味。
- source_word: הָרַי
  choice: 我的众山
  rationale: 保留原文复数和第一人称后缀；“众山”符合庄重的现代汉语表达。
- source_word: אֲבוּסֶנּוּ
  choice: 践踏他
  rationale: בוס 表示踩踏、践踏。保留阳性单数宾语，使亚述作为整体受到人格化处理。
- source_word: וְסָר / יָסוּר
  choice: 必……除去
  rationale: 两个动词均源于 סור，表示离开、移走。汉语用“从……身上除去”自然呈现轭和重担不再压在人身上的图像，并在两处重复以保留平行结构。
- source_word: עֻלּוֹ
  choice: 他的轭
  rationale: “轭”保留原文关于统治与压迫的常见比喻；“他的”指施压者亚述。
- source_word: סֻבֳּלוֹ
  choice: 他的重担
  rationale: 该词指强加在人身上承受的负荷，与“轭”平行；“重担”准确而自然。
- source_word: מֵעֲלֵיהֶם / מֵעַל שִׁכְמוֹ
  choice: 从他们身上 / 从他的肩头
  rationale: 严格保留马所拉文本从复数“他们”转为单数“他的”这一数的变化，不在正文中擅自协调。
theological_decisions:
- issue: אַשּׁוּר 的所指
  choice: 译作帝国势力“亚述”，并以单数代词将其人格化
  alternative: 译作“亚述人”，特指亚述王、军队或代表性的入侵者
  rationale: 本节描写的是亚述这一压迫势力在上帝土地上的覆灭；国名最能涵盖整体政治实体，而随后的单数代词仍容许代表人物或军队的理解。
- issue: 受压迫者由复数转为单数
  choice: 保留“他们身上”与“他的肩头”的转换
  alternative: 统一译成复数，如“从他们的肩头”
  rationale: 原文明确存在数的转换，可能是把受压迫的百姓人格化为一个整体，也可能是分配式单数。正文保留这种张力，脚注予以说明。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“击破”适合军事与帝国覆灭的语境；“践踏”“轭”“重担”保留原文鲜明的压迫图像。正文有意保留“他们／他的”的数转换，并以脚注说明，而不将其平滑化。
