  text: זֹ֛את הָ/עֵצָ֥ה הַ/יְּעוּצָ֖ה עַל כָּל הָ/אָ֑רֶץ וְ/זֹ֛את הַ/יָּ֥ד הַ/נְּטוּיָ֖ה עַל כָּל הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/026.yaml
  text: This is the plan that is planned against all the earth[a], and this is the hand that is stretched out against all the nations.
translation:
  language: zh_hans
  text: 这是针对全地[a]所定的计划；这是伸向万国的手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“全境”，若这里所指的是较具地域性的范围，而非普世范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָעֵצָה הַיְעוּצָה
  choice: 这是……所定的计划
  rationale: עֵצָה表示“计划、谋划、旨意”；同词根的被动分词יְעוּצָה表明这计划已经筹定。中文若机械重复“所计划的计划”不自然，因此译为“所定的计划”，既保留已确定之意，也保持现代汉语的庄重流畅。
- source_word: עַל
  choice: 为／向
  rationale: 此处介词带有针对对象的方向性。与“计划”搭配用“为……所定”，与“手”搭配用“向……伸出”，自然表达审判行动所针对的范围，而不把两个搭配强行译成同一汉语介词。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: הָאָרֶץ可指“大地”或“全地／全境”。平行句的“万国”支持广泛、近乎普世的范围；“全地”保留希伯来词的范围歧义，并以脚注说明地域性理解。
- source_word: הַיָּד הַנְּטוּיָה
  choice: 伸出的手
  rationale: 保留“手”的具体意象，表达施行权能与审判；נְטוּיָה译为“伸出的”，简洁而符合现代汉语。
- source_word: כָּל הַגּוֹיִם
  choice: 万国
  rationale: גּוֹיִם在此泛指列国；“万国”是自然、庄重的圣经汉语表达，并非特指与以色列相对的宗教类别。
theological_decisions:
- issue: הָאָרֶץ在审判宣告中的范围
  choice: 正文译“全地”，倾向广泛乃至普世范围
  alternative: 可按较地域性的范围理解为“全境”或“整个地区”
  rationale: 与“万国”的平行结构支持广阔范围，但הָאָרֶץ本身兼有“地、土地、地域”等义，因此不在正文中把范围解释得过死，并用脚注保存另一可能。
- issue: 伸出的手所表达的行动
  choice: 保留审判语境中的权能意象
  alternative: 意译为“施展的权能”
  rationale: 直译“手”保存原文鲜明的拟人性和行动感，也避免用抽象神学术语取代原文图像。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所定的计划”避免生硬的同根重复；分号体现两句平行结构。“全地”与“万国”保持原文宏阔的修辞，同时脚注保存范围上的真实歧义。
