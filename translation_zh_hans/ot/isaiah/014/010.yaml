id: ISA.14.10
reference: Isaiah 14:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֻּלָּ֣/ם יַֽעֲנ֔וּ וְ/יֹאמְר֖וּ אֵלֶ֑י/ךָ גַּם אַתָּ֛ה חֻלֵּ֥יתָ כָמ֖וֹ/נוּ אֵלֵ֥י/נוּ נִמְשָֽׁלְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/010.yaml
  text: All of them will answer and say to you[a], ‘You too have become weak like us[b]; you have become like us.’
translation:
  language: zh_hans
  text: 他们都要回应，对你说：“连你也变得像我们一样软弱了[a]；你也变得和我们一样了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“连你也像我们一样被削弱了。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“你也被比作我们了”，或“你也变得与我们同等了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: 他们都
  rationale: 指上下文中阴间所有回应者，保留“全都”的总括意味，同时符合现代汉语表达。
- source_word: יַעֲנוּ וְיֹאמְרוּ
  choice: 要回应，对你说
  rationale: 保留“回应”和“说”两个并列言语动词；“要”承接未完成式在诗歌语境中的将来意味。
- source_word: אֵלֶיךָ
  choice: 对你
  rationale: 直接表达言语所指向的对象。
- source_word: גַּם אַתָּה
  choice: 连你也
  rationale: 既表达“也”，又显出对昔日高位者竟落到同一境地的惊讶和嘲讽语气。
- source_word: חֻלֵּיתָ
  choice: 变得……软弱了
  rationale: 此处重点是力量衰败，而非具体患病；这一表达也呈现已经形成的结果状态。
- source_word: כָמוֹנוּ
  choice: 像我们一样
  rationale: 自然保留比较关系。
- source_word: אֵלֵינוּ נִמְשָׁלְתָּ
  choice: 变得和我们一样了
  rationale: נמשל可表示相像、被比作或处于同等境地；正文采用自然汉语，并保留与前句有意形成的语义重复。
theological_decisions:
- issue: 阴间中这番话的性质
  choice: 按诗歌中的嘲讽场景翻译，突出君王失去力量、落到与死者相同的境地。
  alternative: 将场景进一步解释为关于阴间存在状态的具体教义陈述，或强化其神话化含义。
  rationale: 经文本身运用死者开口讥讽的诗性图景；译文应保留这一图景和羞辱力量，却不借此裁定经文未明确说明的死后状态问题。
- issue: נִמְשָׁלְתָּ的语义范围
  choice: 正文译作“变得和我们一样了”。
  alternative: “被比作我们”或“变得与我们同等”。
  rationale: 原词允许“相像、被比拟、成为同等”之间的张力；正文采用通顺且不过度限定的说法，脚注列出主要可能性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“连你也”传达诗歌嘲讽中的意外和贬抑；两次“我们一样”有意保留原文的重复，不作合并。
