  text: מַכֶּ֤ה עַמִּים֙ בְּ/עֶבְרָ֔ה מַכַּ֖ת בִּלְתִּ֣י סָרָ֑ה רֹדֶ֤ה בָ/אַף֙ גּוֹיִ֔ם מֻרְדָּ֖ף בְּלִ֥י חָשָֽׂךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/006.yaml
  text: striking peoples in fury with an unceasing blow[a], ruling nations in anger[b], with unrelenting persecution.
translation:
  language: zh_hans
  text: 在暴怒中击打众民，施以不停的打击[a]；在怒气中辖制列国，不断追逼，毫不留情[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不停的打击”直译可作“不转离的打击”，即不停歇的打击。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语末句十分压缩；其中“被追逼”是被动形式，也可理解为“列国不断遭受追逼，毫不留情”。正文依上下文将其理解为继续描述暴君对列国的压迫。
    reason: alternative_reading
lexical_decisions:
- source_word: מַכֶּה עַמִּים
  choice: 击打万民
  rationale: מַכֶּה是使役词干分词，与后面的רֹדֶה平行，描写暴君持续一贯的行为；“击打”保留同根词מַכַּת所形成的反复修辞。“万民”自然表达עַמִּים所指的众民，并与后文“列国”有所区别。
- source_word: בְּעֶבְרָה
  choice: 在暴怒中
  rationale: עֶבְרָה表示强烈、仿佛满溢而出的愤怒；“暴怒”在现代汉语中有力度，也不显古奥。
- source_word: מַכַּת בִּלְתִּי סָרָה
  choice: 击打不停
  rationale: מַכַּת与前面的מַכֶּה同根，宜保留“击打”的回响；בִּלְתִּי סָרָה直指不停止、不转离，以“不停”简洁传达。
- source_word: רֹדֶה
  choice: 辖制
  rationale: רדה可指统治、制伏或压服；这里与暴怒和击打并列，“辖制”既保留统治义，也体现压迫语境。
- source_word: בָאַף
  choice: 在怒气中
  rationale: אַף本义为“鼻子”，在此是表示发怒的惯用语；译为“怒气”自然，并与前句形成平行。
- source_word: גּוֹיִם
  choice: 列国
  rationale: גּוֹיִם通常指各国或列邦；“列国”庄重而通俗，并与前面的עַמִּים“万民”相区别。
- source_word: מֻרְדָּף בְּלִי חָשָׂךְ
  choice: 穷追不舍，无人遏止
  rationale: מֻרְדָּף是רדף的被动形态，句法高度压缩，可表达持续追逼或迫害；בְּלִי חָשָׂךְ含不扣留、不制止或不收手之意。正文以紧凑的动作性表达呈现暴政的 relentless force，同时用脚注保留被动句法的另一理解。
theological_decisions:
- issue: 末句מֻרְדָּף בְּלִי חָשָׂךְ的所指和句法
  choice: 把它承接为暴君对列国的持续追逼：“穷追不舍，无人遏止”
  alternative: 也可按被动形式理解为“列国不断遭追逼”，或理解为暴君后来“遭追赶，无人拦阻”
  rationale: 马所拉文本的末句短促而含混。上下文主要回顾巴比伦王施行的暴政，因此正文让末句继续描写其压迫行为；但不把被动形态所容许的其他句法关系静默排除，而在脚注中明确说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；以两个平行分句保留希伯来诗句的节奏，并用“击打／击打”再现原文同根词的强调。正文避免过度补足主语，脚注则保留末句真实的句法歧义。
