  rationale: 修订删除无原文根据的“无人遏止”，以“毫不留情”表达“不顾惜／不收手”。前半改用“施以不停的打击”，使汉语更自然，并保留“击打／打击”的同根强调。末句正文依本段对暴君暴政的描述作主动性顺译，但脚注明确保留马所拉文本被动分词所带来的句法歧义，避免将争议解释当作确定含义。
