language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הוּרַ֥ד שְׁא֛וֹל גְּאוֹנֶ֖/ךָ הֶמְיַ֣ת נְבָלֶ֑י/ךָ תַּחְתֶּ֨י/ךָ֙ יֻצַּ֣ע רִמָּ֔ה וּ/מְכַסֶּ֖י/ךָ תּוֹלֵעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/011.yaml
  text: Your pomp has been brought down to Sheol[a], the sound of your harps; maggots are spread out beneath you[c][b], and worms are your covering.
translation:
  language: zh_hans
  text: 你的荣华[b]和你弦乐器的响声[c]，都被降到阴间[a]；蛆虫被铺在你身下，蠕虫盖在你身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”指死者所在之域；也可译作“坟墓”或“死者之域”。
    reason: lexical_alternative
  - marker: b
    text: “荣华”也可译作“尊荣”“排场”或“骄傲”。希伯来语此词既可指显赫的威势，也可指自高。
    reason: lexical_alternative
  - marker: c
    text: “弦乐器”指竖琴、里拉琴一类的乐器；也可译作“竖琴”或“里拉琴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: 被降到
  rationale: 该词是 ירד 的使役被动式，表达被迫降下；中文用“被降到”保留被动和受辱的意味。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 指死者所在之域；“阴间”在现代中文圣经语境中简明可懂，又不把它缩减为实体坟墓或等同于后期教义中的地狱。
- source_word: גְּאוֹנֶךָ
  choice: 你的威仪
  rationale: גאון 可指尊荣、威势，也可指骄傲；本节聚焦君王昔日显赫的排场被贬落，“威仪”兼顾王者的尊荣与自高意味。
- source_word: הֶמְיַת
  choice: 喧响
  rationale: 该名词表示响声或嘈杂声；“喧响”既适合众多弦乐器的声音，也呼应昔日盛大排场。
- source_word: נְבָלֶיךָ
  choice: 你琴瑟
  rationale: נבל 是竖琴或里拉琴一类的弦乐器；“琴瑟”是现代中文读者熟悉而有庄重感的概括性表达。
- source_word: תַּחְתֶּיךָ
  choice: 在你身下
  rationale: 自然表达空间位置，同时强化尸身如卧榻般躺下的图像。
- source_word: יֻצַּע
  choice: 铺在
  rationale: 该被动动词常用于铺设床榻；中文以“铺在”呈现蛆虫被铺作卧席的讽刺图像。
- source_word: רִמָּה
  choice: 蛆虫
  rationale: 指腐尸上的蛆类；“蛆虫”保留原文令人厌恶的死亡意象。
- source_word: וּמְכַסֶּיךָ
  choice: 盖在你身上
  rationale: 原文指“你的覆盖物”；转为自然的中文谓语表达，并保留与身下铺设物相对的被盖图像。
- source_word: תּוֹלֵעָה
  choice: 虫子
  rationale: 泛指虫或蠕虫；与前面的“蛆虫”有所区分，同时保留希伯来语平行意象。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死者之域
  rationale: 经文描绘君王被降到死者所在之域。“阴间”保留其古代希伯来语境中的死亡世界意象，不将其仅解释为墓穴，也不导入“地狱”的后期教义含义。
- issue: גְּאוֹנֶךָ 的褒贬张力
  choice: 威仪
  alternative: 骄傲；尊荣；排场
  rationale: 此词既可表示显赫尊荣，也可含自高骄傲。在君王受嘲讽的上下文中，“威仪”保留其昔日王者荣势，并让贬抑意味由“被降到阴间”的语境显出，避免把词义单向定为道德上的骄傲。
translation_notes:
  register: 采用现代、庄重而直观的汉语。前半句保留希伯来语两个并列名词短语的突兀感，以表现威仪与乐声一同坠落；后半句用“身下／身上”的对称结构，再现腐尸之虫如褥如被的讽刺意象。
