base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/021.yaml
  text: Prepare slaughter for his sons because of the guilt of their fathers[a], lest they rise up and possess the land[c][b], and fill the face of the world with cities.
translation:
  language: zh_hans
  text: 要为他的儿子预备杀戮，因为他们父辈的罪责[a]，免得他们兴起，占有土地[b]，使世上遍布城邑[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因为他们父辈的罪孽”。希伯来语“罪孽”一词也可指罪责，或罪责所招致的刑罚。
    reason: lexical_alternative
  - marker: b
    text: 或译“承受土地”。这里的希伯来语动词可指继承、取得或占有。
    reason: lexical_alternative
  - marker: c
    text: 直译“使世界的表面充满城邑”。
    reason: literal_rendering
lexical_decisions:
- source_word: הָכִינוּ
  choice: 预备
  rationale: 该词是כון的使役形复数命令式，表示直接吩咐人把某事准备妥当；“预备”保留了命令语气。
- source_word: לְבָנָיו
  choice: 为他的儿子们
  rationale: בנים加第三人称阳性单数词尾，直译为“他的儿子们”；保留男性复数及其与前文人物的关系。
- source_word: מַטְבֵּחַ
  choice: 杀戮
  rationale: 该名词指屠杀或杀戮；此处与“预备”连用，表达为这些儿子安排毁灭，保留审判场景的严厉程度。
- source_word: בַּעֲוֺן אֲבוֹתָם
  choice: 因为他们父辈的罪责
  rationale: 介词ב在此表原因；עָוֹן可指罪孽、罪责或罪所招致的刑罚。“罪责”保留道德责任，也不排除承担罪果的含义。אבות按上下文译作“父辈”，既自然又保留代际关联。
- source_word: בַּל יָקֻמוּ
  choice: 免得他们兴起
  rationale: בַּל引出否定的目的或结果；קום在此不仅可指站起，也可指崛起并采取行动。“兴起”保留这种政治意味及一定的开放性。
- source_word: וְיָרְשׁוּ אָרֶץ
  choice: 占据土地
  rationale: ירש可指继承、占有或夺取；“占据”适合此处王朝扩张的语境，又不额外引入盟约继承的含义。将ארץ译为“土地”，并与下句תֵבֵל“世上”区分。
- source_word: וּמָלְאוּ פְנֵי תֵבֵל עָרִים
  choice: 使世上遍布城邑
  rationale: 希伯来语的字面图像是“使世界的表面充满城邑”。正文采用自然现代汉语表达其全球范围，脚注保留原文图像。
theological_decisions:
- issue: 儿子因父辈的罪责而遭审判所形成的代际张力
  choice: 照原文保留儿子所受杀戮与父辈罪责之间的明确联系
  alternative: 解释为儿子只有延续父辈罪行才受罚，或把עָוֹן仅译作“刑罚”
  rationale: 本节直接把为儿子们预备杀戮与父辈的עָוֹן相连。译文不借其他经文消解这一张力；“罪责”保留其道德层面，同时不排除罪责所带来的后果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“预备杀戮”刻意保留原文突兀、严厉的审判措辞；“城邑”比“城市”略庄重，也适合古代语境。正文区分ארץ（“土地”）与תֵבֵל（“世上”），避免把两个词合并为同一概念。所有脚注标记均已置于正文相应位置。
