  text: אַ֧ךְ אֶל שְׁא֛וֹל תּוּרָ֖ד אֶל יַרְכְּתֵי בֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/015.yaml
  text: But you will be brought down to Sheol[a], to the depths of the pit.
translation:
  language: zh_hans
  text: 然而，你必被降到阴间[a]，到坑的深处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”也可译为“坟墓”或“死人之境”。希伯来词 שְׁאוֹל 所指不一定只是个别坟墓。
    reason: 词义存在可合理保留的不同表达；保留שְׁאוֹל所含死者领域的意象，避免将其限定为单一坟墓或后期教义化的概念。
lexical_decisions:
- source_word: אַךְ
  choice: 然而
  rationale: 承接13—14节向上升的夸口，表达强烈转折；“然而”庄重自然，也不排除原词略带强调的语气。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 指死人所在之境，并非仅指个人坟墓；“阴间”是现代汉语圣经语境中较为通行且可理解的表达，同时避免把它等同于后期教义中含义更明确的“地狱”。
- source_word: תּוּרָד
  choice: 你必被降到
  rationale: 该词为使役被动形式，保留“被使之下降”的被动含义，并传达从自高到受辱的逆转。
- source_word: יַרְכְּתֵי
  choice: 最深之处
  rationale: 原词可指最里面、最偏远的部分；在向下坠落的诗歌意象中，“最深之处”自然地传达坑的深处。
- source_word: בּוֹר
  choice: 坑
  rationale: 保留深坑、幽坑的诗歌意象，并与“阴间”构成平行而不混同的表达。
theological_decisions:
- issue: 诗歌性审判语境中 שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死人之境
  rationale: “阴间”保留死者领域的古代希伯来意象，不把它缩减为实体坟墓，也不将其直接解释为后期教义意义明确的地狱，从而保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“然而”突出与前文升高夸口的反转；“落入”使后半句与中文句法衔接自然，但不改变“被降下”的核心被动含义。
