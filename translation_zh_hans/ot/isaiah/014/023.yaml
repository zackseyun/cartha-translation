  text: וְ/שַׂמְתִּ֛י/הָ לְ/מוֹרַ֥שׁ קִפֹּ֖ד וְ/אַגְמֵי מָ֑יִם וְ/טֵֽאטֵאתִ֨י/הָ֙ בְּ/מַטְאֲטֵ֣א הַשְׁמֵ֔ד נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/023.yaml
  text: I will make her a possession of the hedgehog and pools of water[a], and I will sweep her with the broom of destruction, declares Yahweh of Armies.
translation:
  language: zh_hans
  text: “我要使她成为刺猬[a]所占之地，又变为水塘；我要用毁灭的扫帚把她扫除。”这是万军之雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“קִפֹּד”所指的动物不能确定，很可能是一种栖息在旷野或废墟中的动物；也可译作“豪猪”“猫头鹰”，传统上还有“麻鳽”的译法。
    reason: 说明原文动物名称的词义不确定性及主要备选译法。
lexical_decisions:
- source_word: וְשַׂמְתִּיהָ
  choice: 我要使她成为
  rationale: שׂוּם在此带表语成分，意为“使……成为”。阴性单数后缀指拟人化的巴比伦城，因此译作“她”。
- source_word: לְמוֹרַשׁ
  choice: 领地
  rationale: מוֹרָשׁ表示被占有之地或产业；“领地”自然表达荒废之城成为野生动物所占据的地方，同时避免“产业”可能带来的正面继承含义。
- source_word: קִפֹּד
  choice: 刺猬
  rationale: 该动物的确切种类存在争议；“刺猬”是现代词典中常见的可能译法，具体不确定性保留在脚注中。
- source_word: וְאַגְמֵי מָיִם
  choice: 和水塘
  rationale: אַגַם指积水的池沼或芦苇丛生的水域；“水塘”简洁易懂，并保留荒城积水的景象。
- source_word: וְטֵאטֵאתִיהָ
  choice: 我要把她扫除
  rationale: 保留טאטא“扫”的鲜明比喻；“扫除”在现代汉语中既自然，又能表达彻底除去。
- source_word: בְּמַטְאֲטֵא הַשְׁמֵד
  choice: 用毁灭的扫帚
  rationale: 按希伯来语的工具介词和属格结构直译，保留“扫帚”与“毁灭”结合所形成的强烈审判意象。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: נְאֻם是先知书中庄严的神谕公式；“宣告”比单纯的“说”更能体现其正式分量。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 将יהוה按其专名音译为“雅威”，并以汉语中清楚而庄重的“万军”表达צְבָאוֹת。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译，保留其作为专名的性质，而不以称号代替。
- issue: 巴比伦的阴性代词
  choice: 她
  alternative: 它
  rationale: 希伯来语两处第三人称阴性单数后缀均指向作为城市而被拟人化的巴比伦；译作“她”保留先知文学中的拟人意象。
- issue: קִפֹּד所指动物
  choice: 正文译“刺猬”，脚注说明不确定性
  alternative: 豪猪、猫头鹰或传统译法“麻鳽”
  rationale: 原词所指物种无法确定，不宜把某一种鉴定表述为无争议结论；正文采用可行的现代译名，脚注保留其他主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“领地”“水塘”“毁灭的扫帚”等具体意象，并用分号呈现两项审判行动；末句以神谕公式收束。
