  to: 你却被弃在自己的坟墓之外，像一根被厌弃的枝条[a]；你身披被杀的人，就是那些被刀剑刺透的人[b]，他们下到坑中的石头那里[c]；你如同一具被践踏的尸体。
  rationale: 修订仅改善汉语的自然度和原文意象的呈现。“被弃在自己的坟墓之外”保留被剥夺安葬的画面及原文的含混空间；“身披被杀的人”保留困难的“衣着”隐喻，不擅自将其化约为普通埋葬描写。脚注维持原有的词汇与文化说明，仅调整语体。
