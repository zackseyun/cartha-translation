source:
  edition: WLC
  text: וְ/אַתָּ֞ה הָשְׁלַ֤כְתָּ מִֽ/קִּבְרְ/ךָ֙ כְּ/נֵ֣צֶר נִתְעָ֔ב לְב֥וּשׁ הֲרֻגִ֖ים מְטֹ֣עֲנֵי חָ֑רֶב יוֹרְדֵ֥י אֶל אַבְנֵי ב֖וֹר כְּ/פֶ֥גֶר מוּבָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/019.yaml
  text: But you are cast out from your grave like a despised branch[a], clothed with the slain, those pierced by the sword, who go down to the stones of the pit[c][b], like a trampled corpse.
translation:
  language: zh_hans
  text: 你却被弃在自己的坟墓之外，像一根被厌弃的枝条[a]；你身披被杀的人，就是那些被刀剑刺透的人[b]，他们下到坑中的石头那里[c]；你如同一具被践踏的尸体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “枝条”也可译作“嫩枝”或“新枝”。这里指遭人厌弃、被丢弃的枝条。
    reason: lexical_alternative
  - marker: b
    text: “被刀剑刺透的人”也可译作“被刀剑刺穿的人”。原文这一表达较难确定，所指是战场上被杀的人。
    reason: lexical_alternative
  - marker: c
    text: “坑”在诗歌中可指坟墓或死人所在之处；“坑中的石头”可能令人联想到以石头砌成或铺设的墓穴。
    reason: cultural_note
lexical_decisions:
- source_word: הָשְׁלַכְתָּ מִקִּבְרְךָ
  choice: 被抛离自己的坟墓
  rationale: Hophal完成式表达被动及结果状态；介词מִן表示与坟墓分离。译作“被抛离”既保留被动形象，也不把经文过度限定为已经埋葬后又从墓中掘出。
- source_word: כְּנֵצֶר נִתְעָב
  choice: 像一根遭人厌弃的枝条
  rationale: נֵצֶר可指嫩枝、枝条；此处与“厌弃”相连，重点是被丢弃之物。“枝条”自然，并避免把以赛亚书11:1的弥赛亚意涵带入本节。
- source_word: לְבוּשׁ הֲרֻגִים
  choice: 身上裹着被杀的人
  rationale: 保留“以被杀者为衣/覆盖物”的强烈意象，同时用现代汉语可理解的表达呈现。
- source_word: מְטֹעֲנֵי חָרֶב
  choice: 被刀剑刺透的人
  rationale: 该希伯来语表达较难确定；在战死者的语境中，通常理解为被刀剑刺穿或击杀的人。正文采用通顺且符合语境的译法，脚注保留另一种表达。
- source_word: יוֹרְדֵי אֶל אַבְנֵי בוֹר
  choice: 他们下到坑中的石头那里
  rationale: 较直译地保留“坑中的石头”这一罕见具体形象，不将其直接简化为“坟墓”或“阴间”。
- source_word: כְּפֶגֶר מוּבָס
  choice: 如同一具遭人践踏的尸体
  rationale: פֶגֶר指尸体，מוּבָס表达被踩踏的状态；译文保留其羞辱和弃置的画面。
theological_decisions:
- issue: נֵצֶר是否应带出弥赛亚含义
  choice: 枝条
  alternative: 嫩枝
  rationale: 虽然该词在以赛亚书11:1具有弥赛亚关联，本节直接语境却是对一位蒙羞统治者的嘲歌；不应把别处的神学含义强加于此。
- issue: “离开坟墓”是被逐出墓穴还是不得安葬
  choice: 正文采用较开放的“被抛离自己的坟墓”
  alternative: 从自己的坟墓中被抛出来／被抛在自己的坟墓之外
  rationale: 介词结构可使读者联想到从墓中抛出，也可强调被排除在合宜安葬之外；正文不完全消除这一张力，脚注加以说明。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“被抛离”“身上裹着”“遭人践踏”保留原诗强烈、羞辱性的死亡意象；对罕见短语“坑中的石头”不作平滑改写，以保存原文的具体性和解释空间。
