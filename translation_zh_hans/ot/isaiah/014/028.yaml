  yaml_path: translation/ot/isaiah/014/028.yaml
  text: 'In the year of the death of King Ahaz[a], this oracle came:'
translation:
  language: zh_hans
  text: 亚哈斯王去世的那一年，有以下宣告[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣告”也可译作“神谕”；按字面可译作“重担”。
    reason: 保留מַשָּׂא在先知性标题中的语义范围及其字面意象。
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת
  choice: 去世的那一年
  rationale: 该结构是时间标记，直指亚哈斯死亡之年；现代汉语用“去世的那一年”自然、庄重，也准确表达מוֹת在此所指的死亡事实。
- source_word: הַמֶּלֶךְ אָחָז
  choice: 亚哈斯王
  rationale: 按现代汉语称谓习惯，将王号置于人名之后；专名采用通行译名“亚哈斯”。
- source_word: הָיָה
  choice: 有
  rationale: 希伯来语原义为“是／存在”。此处用“有”引出随后临到或发布的先知性信息，既贴近原文，又避免把“临到”等原文未明说的概念加入正文。
- source_word: הַמַּשָּׂא
  choice: 宣告
  rationale: מַשָּׂא在先知书标题中指庄严的先知性言论，往往带有审判意味。“宣告”比传统的“默示”或字面的“重担”更易为现代读者理解，同时不过度限定其形式。
- source_word: הַזֶּה
  choice: 以下
  rationale: 指向紧随其后的信息。汉语以“以下宣告”自然体现该指示词的前指功能；较直译的“这个宣告”在此标题句中略显生硬。
theological_decisions:
- issue: מַשָּׂא是否应译出“重担”的字面意象
  choice: 正文译作“宣告”
  alternative: “重担”或“默示”
  rationale: 该词在先知标题中的语境义是庄严的神谕或宣告。正文采用现代读者清楚可懂的功能对应词，并在脚注保留字面及传统译法，不据此建立额外的神学含义。
translation_notes:
  register: 采用现代、庄重而简洁的书面汉语。“亚哈斯王去世的那一年”符合自然汉语时间表达；冒号表明后文是该宣告的内容。
