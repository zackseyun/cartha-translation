  text: אַֽל תִּשְׂמְחִ֤י פְלֶ֨שֶׁת֙ כֻּלֵּ֔/ךְ כִּ֥י נִשְׁבַּ֖ר שֵׁ֣בֶט מַכֵּ֑/ךְ כִּֽי מִ/שֹּׁ֤רֶשׁ נָחָשׁ֙ יֵ֣צֵא צֶ֔פַע וּ/פִרְי֖/וֹ שָׂרָ֥ף מְעוֹפֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/029.yaml
  text: Do not rejoice, all of you Philistia, because the rod that struck you is broken; for from the root of the serpent will come out a viper, and its fruit will be a flying fiery serpent.
translation:
  language: zh_hans
  text: 非利士全地啊，不要欢喜，因为那击打你的杖已经折断；从蛇的根必生出毒蛇，它所结的果实将是会飞的火蛇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会飞的火蛇”直译为“飞行的撒拉弗”；这里的“撒拉弗”按上下文指带有灼烧意象的蛇类，不宜据此断定为某一已知蛇种或天使形象。
    reason: 说明罕见词组的字面形式和语义范围，并避免将其武断等同于特定蛇种或天使。
lexical_decisions:
- source_word: פְלֶשֶׁת כֻּלֵּךְ
  choice: 非利士全地啊
  rationale: 阴性单数地名搭配“你的全部”，是对整个非利士地区的拟人化呼语；译作“全地”比“你们所有非利士人”更贴合语法，也自然易懂。
- source_word: שֵׁבֶט מַכֵּךְ
  choice: 击打你的杖
  rationale: 保留“杖”的统治与惩罚意象，并按分词结构直译为“击打你的”。
- source_word: מִשֹּׁרֶשׁ נָחָשׁ
  choice: 蛇的根
  rationale: 保留源文压缩的谱系／生长隐喻，不将其解释为某个具体君王或政权。
- source_word: צֶפַע
  choice: 毒蛇
  rationale: 该蛇名的精确物种不能确定；用宽泛的“毒蛇”传达其危险性，避免虚假的动物学精确。
- source_word: שָׂרָף מְעוֹפֵף
  choice: 会飞的火蛇
  rationale: שָׂרָף可指带灼烧意象的毒蛇，מְעוֹפֵף意为“飞行的”；保留异象式的“火蛇”表达及其超常张力。
theological_decisions:
- issue: 蛇、毒蛇与飞行火蛇所指对象
  choice: 保留连续增强的蛇类意象，不指认具体历史人物
  alternative: 把三者明确解释为相继出现的亚述或其他统治者
  rationale: 本节本身没有明说各形象对应谁；直译可保存预言的历史张力和诗性含混。
- issue: “它的果实”的先行词
  choice: 按阳性单数代词译为“它所结的果实”，让“它”自然回指前述蛇根／蛇的意象
  alternative: 明译为“毒蛇所生的”或“蛇根所生的”
  rationale: 源文的代词关联具有意象上的流动性，不宜在译文中强行固定。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。以“非利士全地啊”表达拟人化呼语；分号保留前后因果与反转关系。正文中的脚注标记与脚注条目一致。
