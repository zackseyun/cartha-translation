  yaml_path: translation/ot/isaiah/014/007.yaml
  text: All the earth is at rest and quiet[a]; they break out in singing.
translation:
  language: zh_hans
  text: 全地安歇，宁静；众人迸发出欢歌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“全地已经安歇，宁静无扰；众人爆发出欢呼声。”
    reason: 保留完成式可译为已然结果状态，并反映 רִנָּה 可侧重响亮欢呼而非歌声的词义选择。
lexical_decisions:
- source_word: נָחָה
  choice: 安歇
  rationale: 该词是完成式，描写全地因压迫者倾覆而进入并处于安息的状态；“安歇”简洁庄重，也能表达结果状态。
- source_word: שָׁקְטָה
  choice: 宁静
  rationale: 与“安歇”并列，强调不再受扰、平静安稳；“宁静”自然地保留两个动词的并列力度。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: אֶרֶץ 可指“地”或“土地”；本段诗歌的视野广阔，“全地”既保持这种广度，也保留希伯来语可能涵盖大地及各地的表达。
- source_word: פָּצְחוּ
  choice: 都欢呼歌唱
  rationale: פצח 表示突然迸发出声音，结合 רִנָּה 表达众者一同发出欢快歌声；“欢呼歌唱”在现代汉语中自然，并体现动作的爆发感。
- source_word: רִנָּה
  choice: 欢呼歌唱
  rationale: 该名词可指响亮的欢呼或喜乐歌声；合并译为“欢呼歌唱”，保留声音响亮且喜乐的语义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“安歇宁静”保留原文两个并列完成式；分号呈现由全地安宁转向集体欢唱的推进。原文后半句主语仅以复数动词表达，译作“众人”以符合汉语语法，不具体限定所指群体。
