source:
  edition: WLC
  text: רֹעֶ֣ה אֵ֔פֶר לֵ֥ב הוּתַ֖ל הִטָּ֑/הוּ וְ/לֹֽא יַצִּ֤יל אֶת נַפְשׁ/וֹ֙ וְ/לֹ֣א יֹאמַ֔ר הֲ/ל֥וֹא שֶׁ֖קֶר בִּ/ימִינִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/020.yaml
  text: He feeds on ashes[a]; a deceived heart has led him astray, and he cannot deliver himself or say[b], “Is there not a lie in my right hand?”
translation:
  language: zh_hans
  text: 他以灰烬为食[a]；一颗受蒙骗的心使他走入歧途。他不能救自己[b]，也不会说：“我右手中岂不是有虚假之物吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他啃食灰烬”。原文用通常指牧放或吃草的动词，保留了鲜明的取食意象。
    reason: lexical_alternative
  - marker: b
    text: 原文“救他的נפשׁ”；此词在这里可指“自己”“性命”或“灵魂”，须按语境理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה אֵפֶר
  choice: 以灰烬为食
  rationale: רעה的分词形式保留放牧、吃草的鲜明意象；汉语“以……为食”自然表达其摄取毫无价值之物的讽刺意味，而脚注保留更贴近字面的“吃灰”。אֵפֶר按通常意义译为“灰烬”，也呼应上文焚烧木料的语境。
- source_word: לֵב הוּתַל
  choice: 受蒙骗的心
  rationale: 保留לֵב的“心”，涵盖思想、意志与道德判断；“受蒙骗”体现被动形式，不把欺骗者或原因擅自具体化。
- source_word: הִטָּהוּ
  choice: 使他偏离正道
  rationale: נטה的使役形式表示使人转离；“偏离正道”清楚传达宗教与道德上的迷失，同时保留“转离”的空间隐喻。
- source_word: וְלֹא יַצִּיל אֶת נַפְשׁוֹ
  choice: 他不能救自己
  rationale: נפשׁ在此指整个人或自身性命，并非专指非物质的灵魂；“救自己”自然表达反身意义。上下文所表达的是受迷惑而无力自救，故采用汉语情态表达。
- source_word: וְלֹא יֹאמַר
  choice: 也不会说
  rationale: 与前一否定分句并列，表达受蒙骗所导致的认知与言说失败；“也不会”符合现代汉语。
- source_word: הֲלוֹא
  choice: 岂不是……吗
  rationale: 保留预期肯定回答的反问语气和自我省察的力度。
- source_word: שֶׁקֶר
  choice: 虚假之物
  rationale: שֶׁקֶר可指谎言、虚假或骗人的东西。此处右手持有的是偶像，译作“虚假之物”既保留抽象的虚假含义，也适合可持在手中的具体对象；脚注提示“谎言”这一较直译表达。
- source_word: בִּימִינִי
  choice: 我右手里的
  rationale: 保留第一人称和手持偶像的具体画面；“右手里”比“右边”更符合此处语境。
theological_decisions:
- issue: נֶפֶשׁ的人论含义
  choice: 正文译为“自己”
  alternative: “自己的性命”或“自己的灵魂”
  rationale: 语境强调拜偶像者无法把自己从欺骗和毁灭中解救出来，并非对灵魂构成作技术性陈述；译为“自己”避免引入原文未明确强调的后期术语区分。
- issue: שֶׁקֶר所指的性质
  choice: 译为“虚假之物”
  alternative: “谎言”或“骗局”
  rationale: 原文可同时指虚假本身及带来欺骗的偶像。译文不把它缩减为单纯口头谎话，也不额外加入对偶像本体的体系化解释。
- issue: 否定动词的情态
  choice: 译作“不能……也不会……”
  alternative: “不救……也不说……”
  rationale: 希伯来语形式本身可直陈行为未发生，而上下文呈现受迷惑所造成的无力与不醒悟。汉语采用情态表达以传达语境，但不主张形而上的绝对无能力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号保留前后因果紧密而意象有别的结构；“偏离正道”表达道德和敬拜上的迷失。“虚假之物”略带书面色彩，但比“一个谎言”更自然地与“右手里的”搭配。所有脚注标记均已置入正文。
