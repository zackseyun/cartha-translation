source:
  edition: WLC
  text: מֵקִים֙ דְּבַ֣ר עַבְדּ֔/וֹ וַ/עֲצַ֥ת מַלְאָכָ֖י/ו יַשְׁלִ֑ים הָ/אֹמֵ֨ר לִ/ירוּשָׁלִַ֜ם תּוּשָׁ֗ב וּ/לְ/עָרֵ֤י יְהוּדָה֙ תִּבָּנֶ֔ינָה וְ/חָרְבוֹתֶ֖י/הָ אֲקוֹמֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/026.yaml
  text: who confirms the word of his servant and fulfills the counsel of his messengers[a], who says of Jerusalem, ‘She will be inhabited,’ and of the cities of Judah, ‘They will be rebuilt,’ and ‘I will raise up her ruins.’
translation:
  language: zh_hans
  text: 他使他仆人的话得以坚立，成全他使者们的谋略[a]；他论到耶路撒冷说：“必有人居住在那里。”论到犹大的各城说：“必被重建。”又说：“我要使她的废墟重新立起。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“天使”。希伯来语原词可指人的使者，也可指天上的使者；这里按上下文较可能指传达上帝话语的人。
    reason: 保留מַלְאָכָיו的词汇歧义。
lexical_decisions:
- source_word: מֵקִים
  choice: 使……立定
  rationale: 使役分词在这里以“话”为宾语，表示使所说的话确立并成为事实；“使……立定”既保留קום的形象，也符合汉语先知文体。
- source_word: דְּבַר עַבְדּוֹ
  choice: 自己仆人的话
  rationale: 保留דבר的“话”以及“仆人”的单数形式，不具体指定其身份。
- source_word: וַעֲצַת
  choice: 谋划
  rationale: עצה可指计谋、筹划或旨意；“谋划”在此能表达经由使者宣告、并由上帝成就的安排，又不额外引入教义性术语。
- source_word: מַלְאָכָיו
  choice: 自己众使者
  rationale: מלאך既可指人的使者，也可指天使；本节与“仆人的话”平行，并涉及先知性的复兴宣告，正文采用较宽泛的“使者”，另以脚注保留“天使”的可能。
- source_word: יַשְׁלִים
  choice: 使……实现
  rationale: שלם的使役形在此表示完成、贯彻；与“谋划”搭配时，“使……实现”自然且准确。
- source_word: הָאֹמֵר
  choice: 他……说
  rationale: 带冠词的分词描述上帝；汉语采用连续的“他……说”，保持本节的关系从句功能及宣告语气。
- source_word: לִירוּשָׁלִַם
  choice: 论到耶路撒冷
  rationale: 介词ל字面可作“向”；在此引出有关该城的宣告，“论到”能自然表达所指关系。
- source_word: תּוּשָׁב
  choice: 必有人居住其中
  rationale: 该阴性单数形式表达耶路撒冷重新成为有人居住之地；用无人称结构可自然呈现被动含义，并避免中文中不必要的城市阴性拟人。
- source_word: וּלְעָרֵי יְהוּדָה
  choice: 论到犹大的各城
  rationale: 与前一分句平行，表示宣告所涉及的对象。
- source_word: תִּבָּנֶינָה
  choice: 必重建起来
  rationale: 被动复数形式意为“被建造”；毁坏后的复兴语境使“重建”准确传达其语境含义。
- source_word: וְחָרְבוֹתֶיהָ
  choice: 其中的废墟
  rationale: חרבות指遭毁坏之处或废墟；阴性单数后缀在上下文中的具体指向略有张力，译为“其中”避免在耶路撒冷与犹大诸城之间作过度限定。
- source_word: אֲקוֹמֵם
  choice: 我要使……重新矗立
  rationale: קום的一人称加强式表达使废墟重新建立；“重新矗立”保留“立起”的形象，同时清楚传达复兴之意。
theological_decisions:
- issue: “他的仆人”与“他的使者们”的所指
  choice: 保留原文的单数“仆人”和复数“使者”，不指明具体人物
  alternative: 将仆人明确认作以赛亚，或把使者明确译为众先知
  rationale: 本节没有为这些称谓指名；保留形式可容纳一位特定仆人及更广泛先知群体等可能，不替原文消除张力。
- issue: מַלְאָכָיו是人的使者还是天使
  choice: 正文译作“使者”
  alternative: 译作“天使”
  rationale: 该词本身兼有两义；本节的平行结构和先知宣告语境较支持人的传信者，但词汇歧义应以脚注保留。
- issue: “她的废墟”的指向
  choice: 译作“其中的废墟”，不把后缀明确锁定为单一地点
  alternative: 译作“耶路撒冷的废墟”或“犹大各城的废墟”
  rationale: 阴性单数后缀可自然回指耶路撒冷，但紧邻的“犹大各城”也构成语境关联；采用较开放的中文表达以免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“立定—实现”和“居住—重建—重新矗立”呈现原文宣告逐步展开的节奏；引号与分号帮助读者辨明上帝所发的三项宣告。
