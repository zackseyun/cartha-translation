source:
  edition: WLC
  text: אַֽל תִּפְחֲדוּ֙ וְ/אַל תִּרְה֔וּ הֲ/לֹ֥א מֵ/אָ֛ז הִשְׁמַעְתִּ֥י/ךָ וְ/הִגַּ֖דְתִּי וְ/אַתֶּ֣ם עֵדָ֑/י הֲ/יֵ֤שׁ אֱל֨וֹהַּ֙ מִ/בַּלְעָדַ֔/י וְ/אֵ֥ין צ֖וּר בַּל יָדָֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/008.yaml
  text: Do not fear[a], and do not tremble. Have I not long ago made you hear and declared it? And you are my witnesses. Is there a God besides me? There is no Rock[c][b]; I know of none.
translation:
  language: zh_hans
  text: 不要惧怕，也不要惊恐[a]。我不是早已[b]使你听见，也宣告了吗？你们就是我的见证人。除我以外，难道还有神吗？没有别的磐石[c]；我不知道有任何别的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惊恐”所译的动词很少见，也可理解为“战兢”；它可能是对前一句“不要惧怕”的加强。
    reason: lexical_alternative
  - marker: b
    text: “早已”也可译为“从古时起”。
    reason: lexical_alternative
  - marker: c
    text: “磐石”在这里是用于神的称号，强调他的坚固可靠；也可按普通名词译作“岩石”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְחֲדוּ
  choice: 惧怕
  rationale: 该词表示惧怕、畏惧；“惧怕”简洁庄重，适合禁令语气。
- source_word: תִּרְהוּ
  choice: 惊恐
  rationale: 这是罕见形式，在本句中与前一禁令平行并加强其力度；“惊恐”自然保留这种强化作用，同时不把词义限定为身体上的发抖。
- source_word: מֵאָז
  choice: 早已
  rationale: 表示从先前、从很早的时候；“早已”符合现代汉语，也保留上帝诉诸先前启示的时间意味。
- source_word: הִשְׁמַעְתִּיךָ
  choice: 使你听见
  rationale: 使役式动词并带第二人称阳性单数后缀；直译为“使你听见”，既保留使役意义，也保留原文由单数“你”转到复数“你们”的人称变化。
- source_word: וְהִגַּדְתִּי
  choice: 并且宣告
  rationale: נגד表示宣告、使人知道；“宣告”保留正式而公开的语气。原文没有明说宾语，正文也不补出“这事”。
- source_word: עֵדָי
  choice: 我的见证人
  rationale: 名词为复数并带第一人称单数后缀；汉语“见证人”单复数同形，由复数代词“你们”清楚表达群体意义，也保留法律性、作证性的意象。
- source_word: אֱלוֹהַּ
  choice: 神
  rationale: 此处单数名词用于反问是否存在任何一位在耶和华以外的神；“神”直接保留类别与独一性的张力，中文无需借助英文式大小写。
- source_word: מִבַּלְעָדַי
  choice: 除我以外
  rationale: 该介词短语表达排除；“除我以外”是自然、准确的现代汉语。
- source_word: צוּר
  choice: 磐石
  rationale: 此处是用于神的隐喻性称号，表达坚固、可靠；“磐石”保留圣经诗歌的具体意象。
- source_word: בַּל יָדָעְתִּי
  choice: 我不知道有别的
  rationale: 该短语是强烈否定。“我不知道有别的”在现代汉语中自然，并承接前句“再没有磐石”，表达说话者不知有任何其他者。
theological_decisions:
- issue: 反问句中的神圣独一性
  choice: 译为“除我以外，难道还有神吗？”并以“再没有磐石；我不知道有别的”作绝对否定。
  alternative: 将 אֱלוֹהַּ 处理为泛指的“神明”或弱化为仅否定偶像。
  rationale: 上下文是对偶像的驳斥，也是耶和华独一性的宣告；反问与后续否定共同排除任何别的神，而不需加入原文以外的教义术语。
- issue: צוּר 的神圣称号功能
  choice: 正文译为“磐石”，脚注说明这是用于神的称号。
  alternative: 译作普通名词“岩石”，或直接意译为“可靠的神”。
  rationale: 原文保留具体隐喻，并在此指向神。中文没有大小写手段，故以“磐石”保留称号式意象，并用脚注澄清其功能，避免把隐喻解释进正文。
- issue: 单数“你”与复数“你们”的转换
  choice: 保留“使你听见”与“你们就是我的见证人”的人称数变化。
  alternative: 为求顺畅而统一译成复数“你们”。
  rationale: 希伯来文先用第二人称阳性单数后缀，随后使用复数独立代词；保留这一变化可避免无根据地消除原文现象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。诗行中的平行禁令、反问和见证语汇均予保留；不补出原文省略的宣告内容。中文正文按语义顺序标注[a]、[b]、[c]，所有脚注标记均已在正文出现。
