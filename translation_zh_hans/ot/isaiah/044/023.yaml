  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רָנּ֨וּ שָׁמַ֜יִם כִּֽי עָשָׂ֣ה יְהוָ֗ה הָרִ֨יעוּ֙ תַּחְתִּיּ֣וֹת אָ֔רֶץ פִּצְח֤וּ הָרִים֙ רִנָּ֔ה יַ֖עַר וְ/כָל עֵ֣ץ בּ֑/וֹ כִּֽי גָאַ֤ל יְהוָה֙ יַֽעֲקֹ֔ב וּ/בְ/יִשְׂרָאֵ֖ל יִתְפָּאָֽר־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/023.yaml
  text: Sing for joy[a], O heavens, for Yahweh has done it; shout aloud, depths of the earth. Break forth into singing, O mountains, O forest, and every tree in it; for Yahweh has redeemed Jacob[c][b], and in Israel he displays his glory.
translation:
  language: zh_hans
  text: 诸天哪，要欢唱，因为耶和华已经行事了[a]！大地深处[b]啊，要高声欢呼！群山哪，要放声歌唱；森林和其中所有的树木啊，也要歌唱！因为耶和华已经救赎了雅各，并在以色列身上彰显自己的荣耀[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“因为耶和华已经成就了”或“因为耶和华已经做成这事”。原文没有明说所行之事。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“大地最低之处”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“并在以色列中荣耀自己”或“并在以色列中显出自己的荣耀”。
    reason: alternative_reading
lexical_decisions:
- source_word: רָנּוּ
  choice: 欢唱
  rationale: 该复数命令式兼有歌唱与喜乐呼喊之意；“欢唱”简洁地保留两层含义。
- source_word: כִּי עָשָׂה יְהוָה
  choice: 因为耶和华已经成就了
  rationale: עשה在此未明说宾语，可指“做了、行事、成就”；译文不补出具体对象，以保留原文的开放性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的专名形式，表明原文使用的是神的名字YHWH，而非普通称号。
- source_word: הָרִיעוּ
  choice: 高声欢呼
  rationale: 该使役命令式表示发出响亮的呼喊，在此语境中带有喜庆欢呼之意。
- source_word: תַּחְתִּיּוֹת אָרֶץ
  choice: 大地深处
  rationale: 自然表达大地的下层或最低之处，并保留诗歌中天地上下共同响应的宇宙性图景。
- source_word: פִּצְחוּ הָרִים רִנָּה
  choice: 群山哪，要放声歌唱
  rationale: פִּצְחוּ表达突然迸发，רִנָּה可指欢歌或喜乐呼声；“放声歌唱”在现代中文中自然且有诗意。
- source_word: יַעַר וְכָל עֵץ בּוֹ
  choice: 森林和其中所有的树木
  rationale: 贴近单数集合名词“森林”及“其中每一棵树”的表达，同时保持中文流畅。
- source_word: גָאַל
  choice: 救赎
  rationale: 保留גאל所含的赎回、解救及亲属赎回者背景所形成的厚重含义，不缩减为一般性的“拯救”。
- source_word: יִתְפָּאָר
  choice: 彰显自己的荣耀
  rationale: 该反身形态可表示使自己得荣耀、显为荣耀；此译法保留神在以色列身上显明其荣耀的含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文读者最熟悉的YHWH专名形式，既不将神名化为“主”这一称号，也便于普通读者理解。
- issue: 末句יִתְפָּאָר的主语与语态
  choice: 耶和华在以色列身上彰显自己的荣耀
  alternative: 耶和华在以色列中得荣耀／显为荣耀
  rationale: 动词的语法主语是耶和华，反身词形容许“荣耀自己”或“显出荣耀”等理解；正文以自然中文表达其彰显自身荣耀，同时在脚注保留其他可能。
- issue: 介词בְּיִשְׂרָאֵל的关系
  choice: 在以色列身上
  alternative: 在以色列中／借着以色列
  rationale: ב可表达位置、范围或媒介；“在……身上”避免明确限定为单纯地点或工具关系，保留原文张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以“哪、啊”标示诗歌中的呼语；使用短促命令句重现逐层展开的宇宙性召唤。平行段落保留“欢唱、欢呼、歌唱”的语义变化，既避免机械重复，也不弱化原文的喜乐声势。
