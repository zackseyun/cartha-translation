  yaml_path: translation/ot/isaiah/044/027.yaml
  text: who says to the deep[a], ‘Be dry, and I will dry up your rivers,’
translation:
  language: zh_hans
  text: 那位对深渊[a]说：“干涸吧！我要使你的江河干涸。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“深处”。希伯来语此词指水的深处。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: 那……说
  rationale: 带定冠词的分词作名词性用法，承接上文对耶和华的描述。译作“那……说”既保留关系从句性质，也不在本节擅自补出主语名称。
- source_word: לַצּוּלָה
  choice: 对深渊
  rationale: צּוּלָה指深水、深处或水域的深渊；“深渊”简洁庄重，并保留其水域意象。
- source_word: חֳרָבִי
  choice: 干涸吧
  rationale: 阴性单数祈使式，与阴性名词“深渊”呼应。“干涸吧”在现代汉语中自然地表达水域变干的命令。
- source_word: וְנַהֲרֹתַיִךְ
  choice: 你的江河
  rationale: נְהָרוֹת是“河流”的复数，第二人称阴性单数后缀指向被呼告的“深渊”；“江河”符合庄重诗体，并清楚传达复数概念。
- source_word: אוֹבִישׁ
  choice: 我要使……干涸
  rationale: 这是יבש的使役式未完成体第一人称单数，表示使之变干；“我要使……干涸”明确保留使役意义及语境中的宣告语气。
theological_decisions:
- issue: 说话者的身份及本节与上文的句法关系
  choice: 保留承接上文的“那……说”结构，不在本节补出“耶和华”。
  alternative: 在正文中明确补为“耶和华对深渊说”。
  rationale: 希伯来文本以名词化分词继续上文对上帝的描述，本节本身没有再次写出“耶和华”。保留依附结构可避免增添原文没有的主语，同时让上下文指明说话者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“深渊”保留诗性水域意象；两个“干涸”形成原文命令与施行宣告之间的呼应。
