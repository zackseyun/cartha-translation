base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/021.yaml
  text: Remember these things[a], Jacob, and Israel, for you are my servant; I formed you; you are a servant to me. Israel, you will not be forgotten by me.
translation:
  language: zh_hans
  text: 雅各啊，以色列啊，要记住这些事；因为你是我的仆人。我塑造了你；你是我的仆人。以色列啊，我不会忘记你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列啊，你不可忘记我。”希伯来语形式也可这样理解；有些解释者把这句话视为劝诫，而不是上帝的保证。
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר
  choice: 要记住
  rationale: 这是זכר的Qal祈使式阳性单数，直接命令雅各／以色列记住所述之事；“要记住”自然、明确。
- source_word: אֵלֶּה
  choice: 这些事
  rationale: 复数指示代词回指上文内容；补出“事”符合现代汉语表达。
- source_word: יַעֲקֹב וְיִשְׂרָאֵל
  choice: 雅各啊……以色列啊
  rationale: 两名称以同位、平行方式呼唤同一群体；用“啊”保留呼格语气，并按希伯来语次序呈现。
- source_word: כִּי
  choice: 因为
  rationale: 引出记住这些事的理由，译作“因为”直接清楚。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: עבד可指奴仆或仆人；本处强调以色列归属并服事上帝的关系，“仆人”较合语境且不削弱从属意味。
- source_word: יְצַרְתִּיךָ
  choice: 我塑造了你
  rationale: יצר含塑造、形成之意，常带创造者或工匠意象；“塑造”保留这一形象。
- source_word: עֶבֶד לִי אַתָּה
  choice: 你是我的仆人
  rationale: 依原文独立名词句处理，不压缩成目的从句；现代汉语中“我的仆人”自然表达“作属我的仆人”。
- source_word: לֹא תִנָּשֵׁנִי
  choice: 我不会忘记你
  rationale: 按尼法勒式的被动意义理解为“你不会被我忘记”，在汉语中主动化为“我不会忘记你”更自然，也符合上下文的安慰语气；另一种语法理解保留于脚注。
theological_decisions:
- issue: לֹא תִנָּשֵׁנִי的主客体关系
  choice: 上帝的保证：“我不会忘记你”
  alternative: 对以色列的劝诫或预告：“你不可忘记我”／“你不会忘记我”
  rationale: 尼法勒式最自然地可理解为被动：“你不会被我忘记”，并与本节上帝塑造、认领以色列为仆人的语境相合。鉴于辅音形式也容许另一理解，脚注保留真实歧义，不将其静默消除。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以重复“仆人”保留原文两次עבד及其修辞强调；将末句的希伯来语被动式自然转换为汉语主动句，并以脚注保存另一种读法。
