  text: זֶ֤ה יֹאמַר֙ לַֽ/יהוָ֣ה אָ֔נִי וְ/זֶ֖ה יִקְרָ֣א בְ/שֵֽׁם יַעֲקֹ֑ב וְ/זֶ֗ה יִכְתֹּ֤ב יָד/וֹ֙ לַֽ/יהוָ֔ה וּ/בְ/שֵׁ֥ם יִשְׂרָאֵ֖ל יְכַנֶּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/005.yaml
  text: This one will say[a], ‘I am Yahweh’s’; another will call himself by the name of Jacob; and another will write on his hand[c][b], ‘Belonging to Yahweh,’ and will name himself by the name of Israel.
translation:
  language: zh_hans
  text: 这人要说：“我属于雅威。”那人要以雅各的名自称；又一人要在自己手上写下“归雅威”[a]，并以以色列之名称呼自己[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“把自己的手写归雅威”，通常理解为在手上题写或刻下表明归属雅威的文字或记号；“归雅威”是对其隐含归属意义的表达。
    reason: cultural_note
  - marker: b
    text: 也可译作“给自己冠上以色列之名”或“给自己取名为以色列”。原文动词可指以名字或称号称呼、命名。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה ... וְזֶה ... וְזֶה
  choice: 这人……那人……又一人
  rationale: 三个指示词依次指向不同的人；采用自然的现代汉语表达，同时保留逐一列举的分配意义。
- source_word: יֹאמַר
  choice: 要说
  rationale: 未完成式处于先知性语境，宜表达将来的行动。
- source_word: לַיהוָה אָ֔נִי
  choice: 我是雅威的
  rationale: 原文是省略性的名词句，字面近于“归雅威，我”；汉语所有结构自然表达“我属于雅威”的认信。
- source_word: יִקְרָא בְשֵׁם יַעֲקֹב
  choice: 要以雅各的名自称
  rationale: קרא בשם 可指以某名号称或求告；此处与归属宣告、手上书写及采用以色列之名平行，较可能表示认同并自称为雅各的一员。
- source_word: יִכְתֹּב יָדוֹ לַיהוָה
  choice: 要在手上写：“归雅威”
  rationale: 原文结构简略，字面为“把他的手写给雅威”；这里很可能指在手上写下或作出归属标记。译文保留具体的“手”与书写意象，并用引语明确其隐含内容。
- source_word: וּבְשֵׁם יִשְׂרָאֵל יְכַנֶּה
  choice: 并以以色列的名号称自己
  rationale: כנה 的强意形在此表示用某名号称或命名；译文保留自我认同的含义，也避免把较少见的“取姓”解释直接放入正文。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，区别于作为称号的“主”。
theological_decisions:
- issue: 本节认信语言的性质
  choice: 描写个人公开宣告自己归属雅威，并以雅各、以色列之名认同圣约群体。
  alternative: 也可能较宽泛地理解为加入或亲近以色列这一群体。
  rationale: 三组平行表达从口头宣告、采用名字到手上的书写，都显出有意的归属与认同；译文保留这种圣约色彩，却不引入后世宗派或教会制度术语。
- issue: “以雅各的名自称”中 קרא בשם 的歧义
  choice: 理解为采用雅各之名来标明身份。
  alternative: 可理解为“求告雅各的名”或“被称为雅各”。
  rationale: 上下文集中于个人自我标识，故采用身份称谓义；但该希伯来语搭配本身具有一定语义幅度。
- issue: יְכַנֶּה 的语义
  choice: 译为“以……的名号称自己”。
  alternative: 可译为“给自己取以色列这个姓”或“以以色列之名得称誉”。
  rationale: 正文采用较宽而自然的表达，以免过度限定其为现代意义上的姓氏，同时保留自我命名的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我是雅威的”“归雅威”简洁呈现归属宣告；保留“雅各”和“以色列”两个平行名称。正文仅设置一处脚注，并确保标记[a]出现在正文中。
