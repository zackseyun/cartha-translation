source:
  edition: WLC
  text: וְ/הָיָ֤ה לְ/אָדָם֙ לְ/בָעֵ֔ר וַ/יִּקַּ֤ח מֵ/הֶם֙ וַ/יָּ֔חָם אַף יַשִּׂ֖יק וְ/אָ֣פָה לָ֑חֶם אַף יִפְעַל אֵל֙ וַ/יִּשְׁתָּ֔חוּ עָשָׂ֥/הוּ פֶ֖סֶל וַ/יִּסְגָּד לָֽ/מוֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/015.yaml
  text: Then it becomes fuel for a man[a], and he takes some of them and warms himself; he also kindles a fire and bakes bread. He also makes a god and bows down; he makes it a carved image and prostrates himself before it.
translation:
  language: zh_hans
  text: 这木头可供人作燃料；人从中拿一些来取暖，又点火烤饼。他还用它造一个神，向它下拜；他把它做成雕像，在它面前俯伏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在它面前”或译“在它们面前”。这里的希伯来语代词形式通常是复数，可能是诗歌用法，也可能统指这些木料或制成的物件。
    reason: 保留לָמוֹ在单数语境中出现复数形式所造成的语法与指代张力。
lexical_decisions:
- source_word: וְהָיָה לְאָדָם לְבָעֵר
  choice: 这木头可供人作燃料
  rationale: לְבָעֵר表示烧用的目的或用途；“作燃料”在现代汉语中自然地传达木料被拿来焚烧。אָדָם在此为泛指的单数，汉语用“人”即可保留其代表性含义。
- source_word: וַיִּקַּח מֵהֶם וַיָּחָם
  choice: 人从中拿一些来取暖
  rationale: מֵהֶם具有部分义，指从前文所说的木料中取用一些；“取暖”自然表达因燃烧木料而暖和的语境含义。
- source_word: אַף יַשִּׂיק וְאָפָה לָחֶם
  choice: 又点火烤饼
  rationale: אַף表示递进或追加；יַשִּׂיק在这里指点燃，所点的是火可由语境补明。“烤饼”简洁表达אָפָה לָחֶם所指的烘烤面食。
- source_word: אַף יִפְעַל אֵל
  choice: 他还用它造一个神
  rationale: פעל意为制作、造作，אֵל是“神”。保留“造一个神”的直陈语气，以呈现先知刻意强调的荒谬反差；“用它”承接同一木料。
- source_word: וַיִּשְׁתָּחוּ
  choice: 向它下拜
  rationale: 该词本义涉及俯身、下拜；这里用“下拜”保留外在动作，同时让敬拜含义由语境自然显出。
- source_word: עָשָׂהוּ פֶסֶל
  choice: 他把它做成雕像
  rationale: פֶסֶל指经雕刻制作的形像。“雕像”保留制作方式，不先以“偶像”替代原词，从而维持אֵל与פֶסֶל之间的修辞推进。
- source_word: וַיִּסְגָּד לָמוֹ
  choice: 在它面前俯伏
  rationale: סגד表示俯伏致敬。按紧邻的单数“雕像”译作“它”最合现代汉语，但לָמוֹ的形式可能被理解为复数，故以脚注保存这一原文现象。
theological_decisions:
- issue: 制造神明的讽刺性措辞
  choice: 造一个神……做成雕像
  alternative: 造一个偶像……做成雕刻的偶像
  rationale: 原文先用אֵל“神”，后用פֶסֶל“雕像”。分别翻译可保留先知的讽刺张力：人把自己制造的物件当作神来下拜。
- issue: 末尾代词לָמוֹ的数
  choice: 正文按语境译为“它”，脚注说明复数形式
  alternative: 正文译为“它们”
  rationale: 紧邻先行词פֶסֶל是单数，且整句描述同一个制成的形像；现代汉语正文用“它”清楚自然。不过，לָמוֹ在形态上通常是复数形式，不能无声抹去，故在脚注中保留此歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“造一个神”与“做成雕像”刻意保持直白，以保存原文的讽刺力度；避免使用较古旧的“雕刻之像”“叩拜”等表达。
