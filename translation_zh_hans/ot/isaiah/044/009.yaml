source:
  edition: WLC
  text: יֹֽצְרֵי פֶ֤סֶל כֻּלָּ/ם֙ תֹּ֔הוּ וַ/חֲמוּדֵי/הֶ֖ם בַּל יוֹעִ֑ילוּ וְ/עֵדֵי/הֶ֣ם הֵׄ֗מָּׄהׄ בַּל יִרְא֛וּ וּ/בַל יֵדְע֖וּ לְמַ֥עַן יֵבֹֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/009.yaml
  text: All who fashion an idol are nothing[a], and the things they delight in do not profit. Their witnesses neither see nor know[d][c][b], so that they will be put to shame.
translation:
  language: zh_hans
  text: 凡制造偶像的，全都虚妄[a]；他们所珍爱的东西[b]毫无益处。他们的见证者[c]自己既看不见，也不知道，以致他们蒙羞[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚妄”也可译作“虚无”或“毫无价值”。这里强调他们徒劳、空洞，并非说他们不存在。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他们的珍宝”或“他们喜爱的东西”；这里所指很可能是他们所珍爱的偶像或偶像物件。
    reason: lexical_alternative
  - marker: c
    text: “他们的见证者”可能指为偶像作见证的敬拜者，也可能是讽刺性地指偶像本身。
    reason: alternative_reading
  - marker: d
    text: “以致他们蒙羞”也可译作“为要使他们蒙羞”。原文可表达结果或目的。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹצְרֵי פֶסֶל
  choice: 制造偶像的
  rationale: יֹצְרֵי 表示“塑造、制作”，פֶסֶל 指雕刻或制作出来供敬拜的像。“制造偶像”在现代汉语中自然清楚，同时保留制作行为及其宗教语境。
- source_word: כֻּלָּם תֹּהוּ
  choice: 全都虚妄
  rationale: תֹּהוּ 在此强调徒然、空洞和毫无价值，并非创世语境中的“混沌”。“虚妄”既保留先知话语的力度，也避免误解为这些人根本不存在。
- source_word: וַחֲמוּדֵיהֶם
  choice: 他们所珍爱的东西
  rationale: 该词源于 חמד，指可喜爱、可珍视之物；在上下文中暗指偶像或相关物件。此译保留情感色彩而不把所指限定得过死。
- source_word: בַּל יוֹעִילוּ
  choice: 毫无益处
  rationale: יוֹעִילוּ 表示带来益处或帮助；“毫无益处”简洁地传达偶像不能使人受益的意思。
- source_word: וְעֵדֵיהֶם הֵמָּה
  choice: 它们的见证者自己
  rationale: “见证者”保留 עֵדֵיהֶם 的直译及所指歧义；“自己”体现独立代词 הֵמָּה 的强调作用。
- source_word: בַּל יִרְאוּ וּבַל יֵדְעוּ
  choice: 既看不见，也不明白
  rationale: 重复的否定词 בַּל 构成并列指控；“既……也不……”符合现代汉语表达。“明白”在这里自然传达 ידע 所指的认知缺失。
- source_word: לְמַעַן יֵבֹשׁוּ
  choice: 以致他们蒙羞
  rationale: לְמַעַן 可表示目的或结果。正文采用结果表达，但脚注保留目的读法；“蒙羞”符合 בוש 在先知性宣告中的语气。
theological_decisions:
- issue: “它们的见证者”的所指
  choice: 正文使用“它们的见证者”，不明确限定为偶像崇拜者或偶像本身
  alternative: 明确译作“为偶像作见证的人”，或把偶像本身讽刺性地称为见证者
  rationale: 后面的“看不见、也不明白”既可指为偶像作证的人，也可讽刺无知无觉的偶像。希伯来文本容许这种修辞张力，故正文保留歧义，并在脚注说明。
- issue: תֹּהוּ 的性质
  choice: 译作“虚妄”，表达徒然、空洞和毫无价值
  alternative: “虚无”“毫无价值”或“混沌”
  rationale: 本节着重谴责制偶像者及偶像的无用，并非作关于其形而上存在的论断，也不是采用创世语境中的“混沌”义。
- issue: לְמַעַן 的目的或结果含义
  choice: 正文采用结果义“以致”
  alternative: 目的义“为要使”
  rationale: 两种句法理解均有根据；在本段责斥语境中，盲目无知导致蒙羞的结果读法较顺畅，但脚注保留目的读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“虚妄”“毫无益处”“蒙羞”保留先知责斥的力度；句式简洁，适合普通读者朗读和理解。所有原文中的关键歧义均在正文或脚注中保留。
