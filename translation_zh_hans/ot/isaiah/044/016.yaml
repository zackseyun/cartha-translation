  text: חֶצְי/וֹ֙ שָׂרַ֣ף בְּמוֹ אֵ֔שׁ עַל חֶצְי/וֹ֙ בָּשָׂ֣ר יֹאכֵ֔ל יִצְלֶ֥ה צָלִ֖י וְ/יִשְׂבָּ֑ע אַף יָחֹם֙ וְ/יֹאמַ֣ר הֶאָ֔ח חַמּוֹתִ֖י רָאִ֥יתִי אֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/016.yaml
  text: 'Half of it he burns in the fire[a]; over the other half he eats meat: he roasts a roast and is satisfied. He also warms himself and says, “Aha! I am warm[c][b]; I have seen the fire.”'
translation:
  language: zh_hans
  text: 他把其中一半放在火中烧，用另一半烤肉吃；他把肉烤熟，吃得饱足。他也烤火取暖，说：“啊哈！我暖和了，也看见火光了。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火光”也可译作“火”或“火焰”。
    reason: 希伯来词אוּר的语义可涵盖火、火焰以及发亮的火光，正文选择“火光”但不排除其他译法。
lexical_decisions:
- source_word: חֶצְיוֹ שָׂרַף בְּמוֹ אֵשׁ
  choice: 他把一半放在火中烧
  rationale: 保留“其中一半”的部分关系，并以现代汉语自然表达木料在火中焚烧的意思。
- source_word: עַל חֶצְיוֹ בָּשָׂר יֹאכֵל
  choice: 用另一半烤肉吃
  rationale: עַל 在语境中涉及其余木料的用途；补出“另一”以清楚呈现两半的对照。“烤肉吃”自然表达以这部分木料生火烹肉并食用。
- source_word: יִצְלֶה צָלִי
  choice: 他把肉烤熟
  rationale: 希伯来文为同根动词与名词的搭配，强调烤制；汉语若机械仿作“烤一个烤物”会生硬，故以“把肉烤熟”传达动作及结果。
- source_word: וְיִשְׂבָּע
  choice: 吃得饱足
  rationale: 该词指吃饱、得到满足；“饱足”庄重而易懂，也与进食语境紧密相连。
- source_word: אַף יָחֹם
  choice: 他也烤暖了自己
  rationale: אַף 表示递进添加，יָחֹם 在这里指人借火取暖；“烤暖了自己”呈现达到温暖状态的结果。
- source_word: הֶאָח
  choice: 啊哈！
  rationale: 保留因温暖而发出的欣喜、自得感叹。
- source_word: חַמּוֹתִי
  choice: 我暖和了
  rationale: 完成式表达已经达到温暖状态；“暖和了”比静态的“我很暖和”更能体现结果。
- source_word: רָאִיתִי אוּר
  choice: 也看见火光了
  rationale: אוּר 可指火、火焰或发亮的火光；“火光”保留火与可见亮光两方面的语义。
theological_decisions:
- issue: 是否在本节明说造偶像的讽刺含义
  choice: 只直述此人烧木、烤肉、取暖及自得的话
  alternative: 加入“造偶像的人”等解释性措辞
  rationale: 上下文确有反偶像崇拜的讽刺，但本节本身聚焦木料被用作燃料；不把上下文的解释直接增添进正文，可保存原文含蓄形成的反讽。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。前两句避免机械复制希伯来文同根表达造成的汉语生硬，同时保留从燃烧木料到烤肉、吃饱和取暖的累积性讽刺。所有脚注标记均置于正文。
