revisions:
- from: 耶和华——以色列的王和救赎他的主，万军之耶和华[a]——如此说：“我是首先的，我也是末后的；除我以外，再没有神。[b]”
  to: 耶和华——以色列的王、以色列的救赎主，万军之耶和华[a]——如此说：“我是首先的，我是末后的；除我以外，没有神。[b]”
  rationale: 将 גֹאֲלוֹ 修订为“以色列的救赎主”，准确表达其所属后缀并消除汉语歧义；删去“再”以避免添加时间性含义；调整脚注b，使替代译法完整反映“除我以外”的排他结构。其余称号、神名、平行句式及庄重语体均予保留。
