source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֧ה מֶֽלֶךְ יִשְׂרָאֵ֛ל וְ/גֹאֲל֖/וֹ יְהוָ֣ה צְבָא֑וֹת אֲנִ֤י רִאשׁוֹן֙ וַ/אֲנִ֣י אַחֲר֔וֹן וּ/מִ/בַּלְעָדַ֖/י אֵ֥ין אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/006.yaml
  text: 'Thus says Yahweh[a], the King of Israel and his Redeemer, Yahweh of Armies: I am the first, and I am the last[b]; apart from me there is no God.'
translation:
  language: zh_hans
  text: 耶和华——以色列的王、以色列的救赎主，万军之耶和华[a]——如此说：“我是首先的，我是末后的；除我以外，没有神。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之耶和华”传统也译作“万军之主”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“除我以外，没有别的神。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文中通行的神名译法“耶和华”，将四字神名作为专名呈现，而不以一般称号代替。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列的王
  rationale: 直接保留原文的属格结构和君王称号，表达庄重而自然。
- source_word: גֹאֲלוֹ
  choice: 救赎他的主
  rationale: גֹאֵל 指实施赎回、解救者，并可含亲属责任的背景；此处以“救赎他的主”自然表达其行动者含义，同时保留后缀“他的”所指向的以色列，不将亲属层面的含义过度明说。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: צְבָאוֹת 本指众军、军旅；“万军之耶和华”既贴近词义，又是现代中文读者熟悉且庄重的神圣称号。
- source_word: אֲנִי רִאשׁוֹן
  choice: 我是首先的
  rationale: 保留显明的第一人称代词和表语结构，突出神郑重的自我宣告。
- source_word: וַאֲנִי אַחֲרוֹן
  choice: 我也是末后的
  rationale: “也”自然传达并列和对应关系；重复“我”与“是”，保持原文平衡而庄严的节奏。
- source_word: וּמִבַּלְעָדַי
  choice: 除我以外
  rationale: 这是该介词短语自然准确的现代中文表达，清楚体现排他性。
- source_word: אֵין אֱלֹהִים
  choice: 再没有神
  rationale: אֵין 表示不存在，אֱלֹהִים 在此可指神或神明；正文以“神”呈现绝对性的独一宣告，同时用脚注保留普通名词理解的可能。
theological_decisions:
- issue: 如何翻译神圣称号 יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  alternative: 万军之主
  rationale: 所选译法既保留神名，也直接反映 צְבָאוֹת 的“众军”含义；“万军之主”较为传统，但会以称号“主”替换原文神名。
- issue: אֵין אֱלֹהִים 的独一神论力度与词汇歧义
  choice: 再没有神
  alternative: 再没有别的神明
  rationale: 上下文宣告耶和华独一无二，正文“再没有神”保留其绝对力度；由于希伯来语 אֱלֹהִים 也可作普通名词理解，脚注列出“神明”的译法，不把词汇层面的张力静默消除。
- issue: גֹאֲלוֹ 中救赎者与亲属责任的关系
  choice: 救赎他的主
  alternative: 他的至近亲属救赎者
  rationale: 该词常带亲属履责背景，但本节并未明说亲属身份；正文不将这一背景提升为明确陈述，以免过度诠释。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。破折号标出两个并列称号与主句的关系，避免长串修饰语造成误读；“首先的／末后的”保留原文对称和宣告式节奏。
