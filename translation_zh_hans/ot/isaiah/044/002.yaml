  text: כֹּה אָמַ֨ר יְהוָ֥ה עֹשֶׂ֛/ךָ וְ/יֹצֶרְ/ךָ֥ מִ/בֶּ֖טֶן יַעְזְרֶ֑/ךָּ אַל תִּירָא֙ עַבְדִּ֣/י יַֽעֲקֹ֔ב וִ/ישֻׁר֖וּן בָּחַ֥רְתִּי בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/002.yaml
  text: 'Thus says Yahweh[a], your Maker and the one who formed you from the womb, who will help you: Do not fear, my servant Jacob, Jeshurun, whom I have chosen.'
translation:
  language: zh_hans
  text: 耶和华如此说：“我是你的创造者，是从母腹中塑造你的那一位；我必帮助你。不要惧怕，我的仆人雅各，我所拣选的耶书仑[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶书仑”是以色列的诗性名称，可能含有“正直者”的意思。
    reason: 说明音译名称的指代和可能的词义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确保留原文专名的盟约语境，而不以“主”替代。
- source_word: עֹשֶׂךָ
  choice: 造你的
  rationale: 分词作名词性描述，指耶和华是以色列的创造者；此译自然简洁，并与下文“塑造”形成区别。
- source_word: וְיֹצֶרְךָ
  choice: 是……塑造你的
  rationale: יָצַר常带陶匠塑形的意味；“塑造”保留有意塑成的意象，并区别于较宽泛的“造”。
- source_word: מִבֶּטֶן
  choice: 从母腹中
  rationale: 直译其起源意象；在本节中修饰“塑造”，表达耶和华自以色列肇始之时便塑造他。
- source_word: יַעְזְרֶךָּ
  choice: 他必帮助你
  rationale: 未完成式在安慰和应许语境中自然表达将来的保证；独立成句避免中文关系从句过长。
- source_word: אַל תִּירָא
  choice: 不要惧怕
  rationale: 准确表达否定命令，庄重而符合现代中文表达。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 此处是以色列与耶和华之盟约关系中的称号；“仆人”比“奴隶”更切合上下文。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文通行的人名译法；此处以祖先之名人格化地称呼以色列。
- source_word: וִישֻׁרוּן
  choice: 耶书仑
  rationale: 该词在此为以色列的诗性名称，正文音译，可能的词义在脚注交代。
- source_word: בָּחַרְתִּי בוֹ
  choice: 我所拣选的
  rationale: 把完成式和带介词的代词按上下文译为修饰“耶书仑”的关系结构；保留拣选含义，同时使中文自然。
theological_decisions:
- issue: 以单数形式称呼作为群体的以色列
  choice: 保留单数第二人称“你”，并保留“雅各”和“耶书仑”两个称呼。
  alternative: 改译为“你们”或直接增译“以色列”。
  rationale: 希伯来文以单数形式将以色列人格化；保留单数可维持先知话语的盟约性和修辞特色。
- issue: יְשֻׁרוּן作为名称还是普通称谓
  choice: 正文音译为“耶书仑”，脚注说明其诗性用法及可能含义。
  alternative: 正文意译为“正直者”。
  rationale: 该词在此与“雅各”并列，作为以色列的诗性名称；音译避免把不完全确定的词源意义直接固定为正文含义。
- issue: בָּחַרְתִּי בוֹ的修饰对象
  choice: 译为“我所拣选的耶书仑”，同时按同位结构理解为同一个群体以色列。
  alternative: 另起一句译为“我拣选了他”，或将其明确同时修饰“雅各”和“耶书仑”。
  rationale: 原文最邻近的先行项是“耶书仑”，但“雅各”与“耶书仑”同指以色列；译文保持语法贴近，同时不把两者拆成不同对象。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。用两个并列陈述句展开希伯来文较长的描述结构，使朗读自然；保留“造／塑造”的词义差别、单数称呼和诗性名称。
