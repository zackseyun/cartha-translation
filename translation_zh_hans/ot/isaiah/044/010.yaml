  text: מִֽי יָצַ֥ר אֵ֖ל וּ/פֶ֣סֶל נָסָ֑ךְ לְ/בִלְתִּ֖י הוֹעִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/010.yaml
  text: Who fashions a god or casts an idol that is profitable for nothing?[a]
translation:
  language: zh_hans
  text: 谁塑造神明，铸造偶像，结果却毫无益处呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁塑造神明，铸造偶像，却不能带来任何益处呢？”
    reason: 原文末语可理解为所造的偶像不能使人得益，也可较宽泛地表示整个制作行为毫无益处。
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 疑问代词引出反问，简洁保留先知尖锐的质问语气。
- source_word: יָצַר
  choice: 塑造
  rationale: 该动词指工匠使材料成形；“塑造”既体现制作过程，也适合与“神明”搭配。
- source_word: אֵל
  choice: 神明
  rationale: 此处指人手制造的假神，并非以色列的真神；“神明”在现代汉语中自然表达泛指的神祇，同时避免误解为专名“神”。
- source_word: וּפֶסֶל
  choice: 铸造偶像
  rationale: וּ连接两个平行的制作动作；פֶסֶל在本段偶像论战中宜译为“偶像”，并与后面的铸造动词合译。
- source_word: נָסָךְ
  choice: 铸造
  rationale: 在制造偶像的语境中，该动词指熔化并浇铸金属；“铸造”准确且符合现代汉语习惯。
- source_word: לְבִלְתִּי הוֹעִיל
  choice: 结果却毫无益处
  rationale: 该结构可表达否定的目的或结果；在反问语境中，“结果却毫无益处”自然传达所造之物全然无用，同时不把受益者限定为某一方。
theological_decisions:
- issue: 偶像论战中 אֵל 的所指
  choice: 神明
  alternative: 神；神祇
  rationale: 上下文讥讽人手制造的假神。译作“神明”保留其泛指性质，又不致让读者误以为经文声称真神可由人制造。
- issue: לְבִלְתִּי הוֹעִיל 所表达的无益关系
  choice: 结果却毫无益处
  alternative: 却不能带来任何益处
  rationale: 原文可以着重于目的或结果，也未明确说明谁不获益；正文保留较宽泛的表达，不替原文指定受益者。
translation_notes:
  register: 采用现代、庄重而易懂的反问句。“塑造／铸造”呈现两个平行的工匠动作；“结果却”使希伯来语否定结果结构在汉语中清楚自然。
