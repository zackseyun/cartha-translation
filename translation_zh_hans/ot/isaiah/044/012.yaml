id: ISA.44.12
reference: Isaiah 44:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חָרַ֤שׁ בַּרְזֶל֙ מַֽעֲצָ֔ד וּ/פָעַל֙ בַּ/פֶּחָ֔ם וּ/בַ/מַּקָּב֖וֹת יִצְּרֵ֑/הוּ וַ/יִּפְעָלֵ֨/הוּ֙ בִּ/זְר֣וֹעַ כֹּח֔/וֹ גַּם רָעֵב֙ וְ/אֵ֣ין כֹּ֔חַ לֹא שָׁ֥תָה מַ֖יִם וַ/יִּיעָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/012.yaml
  text: The ironsmith works with a cutting tool and works over the coals; with hammers he shapes it and works it with his strong arm. He also becomes hungry[a], and there is no strength; he has not drunk water, and he grows faint.
translation:
  language: zh_hans
  text: 铁匠用切削工具[a]作工，在炭火中加工；他用锤子把它锻造成形，又用自己有力的臂膀制作它。他也饿了，力气全无；他没有喝水，便疲乏了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处所指的具体工具不确定，也可译作“锛子”“雕刻刀”或“凿子”。
    reason: 原词מַעֲצָד所指的具体器具类别存在词义不确定性。
lexical_decisions:
- source_word: חָרַשׁ בַּרְזֶל
  choice: 铁匠
  rationale: 该词组指以铁为业的工匠；“铁匠”简洁自然，也符合本节锻造偶像的场景。
- source_word: מַעֲצָד
  choice: 切削工具[a]
  rationale: 此词所指的具体工具不确定；正文采用概括性称呼，避免武断地限定为某一种工具，并在脚注列出可能译法。
- source_word: וּפָעַל
  choice: 作工
  rationale: פעל是一般性的“做、工作”；译作“作工”保留劳动过程及与后文同词根表达的呼应。
- source_word: בַּפֶּחָם
  choice: 在炭火上
  rationale: פֶּחָם指锻造所用的炭或炭火；此译自然呈现铁匠加热加工的场景。
- source_word: וּבַמַּקָּבוֹת
  choice: 用锤子
  rationale: 原文为复数，指锤具；现代汉语“用锤子”可作类称，既自然又不必生硬标明数量。
- source_word: יִצְּרֵהוּ
  choice: 把它锻造成形
  rationale: יצר意为塑造、形成；结合金属加工语境，“锻造成形”具体而清楚。
- source_word: וַיִּפְעָלֵהוּ
  choice: 加工
  rationale: 再次出现פעל词根；“加工”适合以器物为宾语的汉语表达，并与前面的“作工”保持语义呼应。
- source_word: בִּזְרֹעַ כֹּחוֹ
  choice: 用有力的臂膀
  rationale: 贴近字面“用他力量的臂膀”，同时符合现代汉语习惯，突出体力耗费。
- source_word: גַּם רָעֵב
  choice: 他也饿了
  rationale: 保留גַּם“也”的推进作用，并自然表达工匠在劳作中陷入饥饿。
- source_word: וְאֵין כֹּחַ
  choice: 便没有力气
  rationale: 原文直陈“没有力量”；“便”使汉语中的结果关系清楚，但不增添超出语境的解释。
- source_word: לֹא שָׁתָה מַיִם
  choice: 他没有喝水
  rationale: 按完成式表达已发生的缺水状态，承接饥饿与无力。
- source_word: וַיִּיעָף
  choice: 就疲乏了
  rationale: 该动词表示疲倦、衰弱；“疲乏了”自然呈现劳作、饥渴所导致的最终状态。
theological_decisions:
- issue: 先知讽刺中对偶像制造过程的描写
  choice: 正文具体描写铁匠耗费体力的劳动和人的软弱，不直接加入“徒劳”或“偶像无能”等解释。
  alternative: 在正文中明确点出制造偶像的徒劳和荒谬。
  rationale: 上下文具有讽刺偶像制造的神学作用，但本节本身借工匠饥饿、无力、口渴和疲乏来形成张力；让含义由具体描写和上下文显出，更忠于原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“作工—劳作—加工”表现持续劳动，用“饿了—没有力气—没有喝水—疲乏了”保留原文逐步加深的身体衰弱。脚注标记置于相关词“切削工具”之后。
