  text: מָחִ֤יתִי כָ/עָב֙ פְּשָׁעֶ֔י/ךָ וְ/כֶ/עָנָ֖ן חַטֹּאותֶ֑י/ךָ שׁוּבָ֥/ה אֵלַ֖/י כִּ֥י גְאַלְתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/022.yaml
  text: I have wiped away your transgressions like a cloud[a], and your sins like a mist. Return to me[c][b], for I have redeemed you.
translation:
  language: zh_hans
  text: 我已涂抹你的过犯，如浓云消散；除去你的罪，如云彩消散。归向我[b]，因为我已经救赎了你[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “归向我”也可译作“转回到我这里”或“回到我这里”；原词常含有关系恢复及悔改的意味。
    reason: lexical_alternative
  - marker: c
    text: 两个译作完成行动的动词，也可能是先知性完成式，强调事情必定实现，因而可译为：“我必涂抹……我必救赎你。”
    reason: alternative_reading
lexical_decisions:
- source_word: מָחִיתִי
  choice: 我已抹去
  rationale: מחה表示擦去、涂抹掉或除灭。“抹去”既保留具体意象，也自然表达过犯被彻底除去；“已”传达完成而仍具当前效力的动作。
- source_word: כָעָב
  choice: 如同抹去密云
  rationale: כ表示比拟；עָב常指云，亦可侧重浓厚的云。“密云”与后句“云雾”形成诗性变化，同时补出省略的动词，使现代汉语清楚通顺。
- source_word: פְּשָׁעֶיךָ
  choice: 你的过犯
  rationale: פשע可指悖逆或越界的罪责。“过犯”保留其道德和立约层面的分量，又不把含义限定为公开叛乱。
- source_word: וְכֶעָנָן
  choice: 也……如同抹去云雾
  rationale: עָנָן通常指云；在与עָב的平行结构中译作“云雾”，既不把它硬性缩窄为薄雾，也呈现两个相关云词的诗性变化。连接词וְ依汉语平行句式译为“也”。
- source_word: חַטֹּאותֶיךָ
  choice: 你的罪
  rationale: חטאות在此通常指人的罪，与“过犯”构成同义平行；“罪”是准确、自然且不加解释的译法。
- source_word: שׁוּבָה אֵלַי
  choice: 你要回转归向我
  rationale: שוב的命令式兼有返回、转回之意，אֵלַי明确指出方向是“向我”。“回转归向我”保留关系恢复及悔改的含义，却不把任何特定教义体系写入正文。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在这里说明命令的根据：之所以应当归向上帝，是因为上帝已经施行救赎。“因为”在现代汉语中清楚表达这一因果关系。
- source_word: גְאַלְתִּיךָ
  choice: 我已经救赎了你
  rationale: גאל是重要的救赎用语，可涉及亲属赎回、解救或重新取得归属。“救赎”保留其广泛的圣经神学分量，而不限定救赎的具体机制。
theological_decisions:
- issue: 两个完成式动词的时态与行动次序
  choice: 将מָחִיתִי和גְאַלְתִּיךָ译为具有当前结果的完成行动：“我已抹去……我已经救赎了你”
  alternative: 可按先知性完成式理解为确定将成之事：“我必抹去……我必救赎你”
  rationale: 希伯来语完成式在语境中可表达已经完成且现在仍有效的行动，也可能以先知性语气宣告未来必然实现之事。正文采用完成式，直接保留“归向我”这一命令所依据的既成救赎；脚注说明未来向的可能性，不消除原文的时态张力。
- issue: “回转”所含的立约与悔改意味
  choice: 译作“回转归向我”，让命令同时保留方向性、关系性和悔改意味
  alternative: 可较直白地译作“回到我这里”或“转向我”
  rationale: 原文没有展开悔改的步骤或制度，只要求转回上帝。因此不把特定悔改论写入正文，同时也不把שוב弱化为单纯空间移动。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文以简洁的平行句保留希伯来诗歌结构，并在第二分句补出原文省略但可由上句承接的“抹去”，避免汉语语意含混。“过犯／罪”和“密云／云雾”分别维持同义平行中的词汇变化。
