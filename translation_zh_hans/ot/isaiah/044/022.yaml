  to: 我已涂抹你的过犯，如浓云消散；除去你的罪，如云彩消散。归向我[b]，因为我已经救赎了你[c]。
  rationale: 修订恢复“涂抹过犯／除去罪”与“云”的比拟关系，并以“浓云／云彩”的词汇变化对应原文两个相关的云词。为使汉语诗句可理解，正文以“消散”明示该比拟所表达的除去意象；不再把云误作上帝所抹去的宾语。完成式及其可能的先知性用法仍由脚注保留。原脚注a主要为原草稿错误句法辩护，且其替代译文仍有同一问题，故删除；这不影响保留必要的时态歧义脚注。
