revisions:
- from: 谁能像我？让他来宣告，来说明，并在我面前按次序陈明；自从我设立古时的民以来[a]，让他们向众人宣告将来的事[b]，以及以后必发生的事。
  to: 还有谁像我？让他来宣告、说明，并在我面前按次序陈明；自从我设立古时的民以来[a]，让他们把将来的事[b]和将要来到的事宣告给他们。
  rationale: 修订仅处理三处：以“还有谁像我”贴近原文比较式反问；把无依据的“众人”改为“他们”，保留 יַגִּידוּ לָמוֹ 的复数代词歧义；以“将要来到的事”避免“必发生”的额外强化。保留原有的时间性理解、古远含义及脚注所保存的词义替代方案。
