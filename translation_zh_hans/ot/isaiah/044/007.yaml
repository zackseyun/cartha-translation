id: ISA.44.7
reference: Isaiah 44:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מִֽי כָמ֣וֹ/נִי יִקְרָ֗א וְ/יַגִּידֶ֤/הָ וְ/יַעְרְכֶ֨/הָ֙ לִ֔/י מִ/שּׂוּמִ֖/י עַם עוֹלָ֑ם וְ/אֹתִיּ֛וֹת וַ/אֲשֶׁ֥ר תָּבֹ֖אנָה יַגִּ֥ידוּ לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/007.yaml
  text: And who is like me? Let him call and declare it[a], and set it in order for me, since I appointed an ancient people. Let them declare to them the things to come[b], and the things that will come.
translation:
  language: zh_hans
  text: 还有谁像我？让他来宣告、说明，并在我面前按次序陈明；自从我设立古时的民以来[a]，让他们把将来的事[b]和将要来到的事宣告给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自从我设立古时的民以来”也可译作“从我设立上古之民的时候起”；“古时的民”也可理解为“永远的民”。
    reason: 保存 מִשּׂוּמִי 的时间表达及 עַם עוֹלָם 在“古远”与“永远”之间的词义张力。
  - marker: b
    text: “将来的事”也可译作“迹象”或“记号”。原词可以指迹象或记号；这里与下句平行，较可能指未来要发生的事。
    reason: 保留 וְאֹתִיּוֹת 的另一种词义，而正文采用较合上下文的未来事件义。
lexical_decisions:
- source_word: וּמִי כָמוֹנִי
  choice: 谁能像我？
  rationale: 保留反问式挑战；中文用“能”自然表达语境中对任何所谓对手能力的质问，而不把它改成普通比较。
- source_word: יִקְרָא וְיַגִּידֶהָ
  choice: 让他来宣告，来说明
  rationale: 将未完成式按挑战语境译作祈使意味。“宣告”体现 קרא 的公开发声含义，“说明”体现 נגד 的使人知道之意；希伯来文阴性单数宾语所指含蓄，中文不强加明确先行词。
- source_word: וְיַעְרְכֶהָ לִי
  choice: 并在我面前按次序陈明
  rationale: ערך 表示排列、按次序摆出；לִי 可直译“为我”，但此处“在我面前”更符合中文挑战场景，同时保留呈交给说话者审验的意味。
- source_word: מִשּׂוּמִי עַם עוֹלָם
  choice: 自从我设立古时的民以来
  rationale: מן 加不定词结构按时间理解为“自从……以来”；שׂים 译为“设立”；עַם עוֹלָם 按历史语境译作“古时的民”，不擅自断定其为永恒存在的民族。
- source_word: וְאֹתִיּוֹת
  choice: 将来的事
  rationale: 该词形式可理解为“迹象、记号”，但与后面的“必发生的事”平行，在上下文中较可能指将来的事件；另义收入脚注。
- source_word: וַאֲשֶׁר תָּבֹאנָה
  choice: 以及以后必发生的事
  rationale: 保留与前项并列的未来指向；“必发生”自然传达 תָּבֹאנָה 所说将要来到的事情。
- source_word: יַגִּידוּ לָמוֹ
  choice: 让他们向众人宣告
  rationale: 原文第三人称复数主语及间接宾语都较压缩。译文保留复数挑战对象，并以“众人”表达 לָמוֹ 的复数受事，避免生硬而含混的“向他们宣告”。
theological_decisions:
- issue: עַם עוֹלָם 的含义
  choice: 古时的民
  alternative: 永远的民；上古之民
  rationale: 本段以耶和华掌管历史、预告未来来挑战偶像；עוֹלָם 在此取古远年代之义更合语境，也避免把关于该民永久地位的教义结论带入经文。
- issue: וְאֹתִיּוֹת 的所指
  choice: 将来的事
  alternative: 迹象；记号
  rationale: 它与“以后必发生的事”平行，语境重在预告未来。不过原词可有“迹象、记号”之义，故以脚注保存真实歧义。
- issue: מִשּׂוּמִי 的关系
  choice: 时间义：自从我设立……以来
  alternative: 原因义：因为我设立了……
  rationale: מן 与不定词组合自然允许时间起点的理解，且适合本节诉诸悠久历史的论证；不把可能的句法关系绝对化，脚注兼列相关译法。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“按次序陈明”保留法庭式挑战和排列证据的意味；末句略作自然化处理，但不消除原文复数代词与并列结构的张力。所有脚注标记均已置于正文相应位置。
