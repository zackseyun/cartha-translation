base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/028.yaml
  text: who says of Cyrus, ‘He is my shepherd, and he will fulfill all my purpose,’ saying of Jerusalem, ‘She will be rebuilt,’ and of the temple, ‘Its foundation will be laid.’
translation:
  language: zh_hans
  text: 那位对居鲁士说：“他是我的牧人，必成全我一切所喜悦的”；又对耶路撒冷说：“你必重建”，对圣殿说：“你必奠基。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כּוֹרֶשׁ
  choice: 居鲁士
  rationale: 采用现代中文中通行的波斯王名译法。
- source_word: רֹעִי
  choice: 我的牧人
  rationale: 保留牧人隐喻及第一人称所属关系，不将其解释性改写为“领袖”或“君王”。
- source_word: חֶפְצִי
  choice: 我所喜悦的
  rationale: חֵפֶץ可指喜悦、旨意或意愿；此处保留“所喜悦的”这一兼含意愿与悦纳色彩的表达。
- source_word: יַשְׁלִם
  choice: 必成全
  rationale: 表达使某事完全实现、完成之意，与其宾语“我一切所喜悦的”自然搭配。
- source_word: תִּבָּנֶה
  choice: 你必重建
  rationale: 该被动式直译为“你必被建造”，但论已遭毁坏的耶路撒冷，现代汉语以“重建”自然表达恢复建造之意。
- source_word: תִּוָּסֵד
  choice: 你的根基必立定
  rationale: 保留被动语态及奠基含义；补出第二人称所属词，使中文与对圣殿的直接引语关系清楚。
theological_decisions:
- issue: 居鲁士被称为上帝的“牧人”
  choice: 直接保留“我的牧人”
  alternative: 我的领袖／我所任命的统治者
  rationale: 原文明确使用牧人意象；译文不应削弱上帝借外邦君王施行旨意所形成的神学张力。
- issue: חֶפֶץ所表达的是喜悦还是旨意
  choice: 我所喜悦的
  alternative: 我的旨意／我的计划
  rationale: “所喜悦的”较贴近词语本身，并保留情感与意志两方面的含义，避免将其单一化为抽象计划。
- issue: 耶路撒冷与圣殿引语中的人称
  choice: 采用直接称呼“你”
  alternative: 她必重建／它的根基必立定
  rationale: 希伯来文动词均为第二人称阴性单数，最自然地理解为分别直接对耶路撒冷和圣殿说话；中文因此保留第二人称。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“论……说”保留先知文体的宣告感；分号区分关于居鲁士的宣告与关于耶路撒冷、圣殿的命令式预告。
