  text: וְ/עַתָּ֥ה שְׁמַ֖ע יַעֲקֹ֣ב עַבְדִּ֑/י וְ/יִשְׂרָאֵ֖ל בָּחַ֥רְתִּי בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/001.yaml
  text: But now hear[a], Jacob my servant, and Israel, whom I have chosen.
translation:
  language: zh_hans
  text: 但现在[a]，我的仆人雅各，我所拣选的以色列啊，你要听！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “但现在”也可译作“而现在”或“现在”。
    reason: 说明开头连接词与时间副词的可行译法及其语篇转折语气。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 但现在
  rationale: 连接词与时间副词在此承接上文的责备，并转入对以色列的安慰和劝告；“但现在”自然地表达这一转折。
- source_word: שְׁמַע
  choice: 你要听
  rationale: 该词是阳性单数命令式，直接呼告被人格化的雅各／以色列；“你要听”既保留命令语气，也符合现代汉语的庄重表达。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: עבד 可指奴仆或仆人；在此为上帝对雅各／以色列的盟约性称谓，“我的仆人”能较自然地体现归属、服事和使命。
- source_word: וְיִשְׂרָאֵל
  choice: 以色列
  rationale: 雅各与以色列是对同一群体的平行称呼；中文以并列呼语呈现，不机械译出连接词，可避免不自然的“和以色列”。
- source_word: בָּחַרְתִּי בוֹ
  choice: 我所拣选的
  rationale: בחר 与介词 ב 连用，在此表示选择某人；中文关系结构“我所拣选的”自然地修饰“以色列”，并保留已完成选择在当前仍具效力的含义。
theological_decisions:
- issue: עַבְדִּי 对以色列身份的称谓
  choice: 我的仆人
  alternative: 我的奴仆
  rationale: 本节强调雅各／以色列属于上帝并承担服事使命；“奴仆”容易使现代读者过度聚焦受奴役状态，故采用语境更合宜的“仆人”。
- issue: וְעַתָּה 中连接词的语篇作用
  choice: 但现在
  alternative: 现在／而现在
  rationale: 本句从前文的责备与审判转向新的呼召和安慰。“但”呈现真实的语篇转折，却不增添原文没有的神学内容。
- issue: 雅各与以色列的关系
  choice: 以两个平行呼语指向同一被人格化的群体
  alternative: 将“以色列”解释为另一对象
  rationale: 希伯来诗体的平行结构表明二者是同一盟约群体的两个名称；译文借破折号保留这种平行和同位关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。破折号凸显“我的仆人”和“我所拣选的”分别说明“雅各”与“以色列”，同时保留原文紧凑的平行呼告；句末用感叹号体现命令式的直接力度。
