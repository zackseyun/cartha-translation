  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ גֹּאֲלֶ֔/ךָ וְ/יֹצֶרְ/ךָ֖ מִ/בָּ֑טֶן אָנֹכִ֤י יְהוָה֙ עֹ֣שֶׂה כֹּ֔ל נֹטֶ֤ה שָׁמַ֨יִם֙ לְ/בַדִּ֔/י רֹקַ֥ע הָ/אָ֖רֶץ מי את/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/024.yaml
  text: 'Thus says Yahweh[a], your Redeemer, who formed you from the womb: I am Yahweh, who makes all things, who alone stretched out the heavens, who spread out the earth by myself.'
translation:
  language: zh_hans
  text: '耶和华如此说：你的救赎主，就是从母腹中塑造你的那一位：


    “我是耶和华，是创造万有的；


    我独自铺展诸天，


    亲自铺开大地[a]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末尾几个字很难确定；另一种理解是：“谁与我同在？”无论采用哪种理解，本句都强调耶和华创造时没有任何助手。
    reason: 保留原文末尾的文本与句法歧义，并说明两种读法共有的语境重点。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中通行的专名“耶和华”对应四字神名，保留其作为以色列之神名字的性质，而不以“主”这一称号代替。
- source_word: גֹּאֲלֶךָ
  choice: 你的救赎主
  rationale: גאל兼有赎回、解救及亲属责任的背景；“救赎主”在中文中自然庄重，并保留其神学分量，同时不在本处过度明确为“至近亲属”。
- source_word: וְיֹצֶרְךָ מִבָּטֶן
  choice: 就是从母腹中塑造你的那一位
  rationale: יצר带有陶匠塑形般的“塑造”意象；“从母腹中”保留原文关于尚在母腹时即受塑造的表达。连接词在同位结构中译作“就是”，使中文关系清楚而不过度增添新命题。
- source_word: עֹשֶׂה כֹּל
  choice: 是成就万有的
  rationale: עשה含义宽广，可指制造、施行或成就；“成就万有”保留全面的神圣行动范围，也符合此处创造者宣告的语境。
- source_word: נֹטֶה שָׁמַיִם לְבַדִּי
  choice: 我独自铺展诸天
  rationale: נטה描绘伸展、铺开的创造图景；“铺展诸天”自然且具画面感。“独自”准确体现לְבַדִּי所强调的唯一行动者。
- source_word: רֹקַע הָאָרֶץ
  choice: 铺开大地
  rationale: רקע本可指锤打延展或铺展表面；“铺开”既传达延展意象，又避免在正文中过度突出金属加工的技术画面。
- source_word: מי אתי / מֵאִתִּי
  choice: 亲自
  rationale: 末尾辅音文字及其切分、元音解释困难。正文以“亲自”表达与上下文一致的无助者、独自创造之意，但用脚注保留可读作疑问句“谁与我同在？”的可能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。中文正文采用读者熟悉的专名“耶和华”，既保留专名性质，也避免用称号“主”取代神名。
- issue: 经文末尾对创造中唯一行动者的强调
  choice: 正文译为“亲自铺开大地”，并以脚注说明另一种句法理解
  alternative: “谁与我同在？”
  rationale: 希伯来文末尾形式艰涩。正文依上下文表达耶和华没有助手、独自创造，但不把文本困难隐藏起来，另在脚注保留疑问式理解。
- issue: “万有”是否仅限于物质创造
  choice: 保留宽泛表达“成就万有”
  alternative: “创造万物”
  rationale: עשה的语义比“创造”更宽，既可涵盖创造，也可涵盖施行和成就；不将其神学范围无根据地缩窄为物质宇宙。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“塑造”保留工匠意象；“铺展诸天／铺开大地”形成平行结构。诗行换行呈现宣告的节奏。脚注标记[a]已置于相关末句之后。
