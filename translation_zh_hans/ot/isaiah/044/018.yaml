  naturalness: 修订后的句子采用“使他们……；又使他们的心……”的平行结构，避免文言式且指向不清的“其”，在现代标准普通话中更通顺庄重。
  terminology: 保留“心”，并以“明辨”承载此处认知性的 הַשְׂכִּיל，避免将希伯来语的“心”直接替换为“头脑”。“蒙住”是自然的遮蔽隐喻；脚注说明 טַח 更具体的涂抹／覆盖画面。
