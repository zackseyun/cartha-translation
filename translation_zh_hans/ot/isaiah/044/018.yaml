source:
  edition: WLC
  text: לֹ֥א יָדְע֖וּ וְ/לֹ֣א יָבִ֑ינוּ כִּ֣י טַ֤ח מֵֽ/רְאוֹת֙ עֵֽינֵי/הֶ֔ם מֵ/הַשְׂכִּ֖יל לִבֹּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/018.yaml
  text: They do not know[a], nor do they understand, because he has shut their eyes from seeing[c][b], and their hearts from understanding.
translation:
  language: zh_hans
  text: 他们不知道，也不明白，因为他[c]蒙住了他们的眼睛[a]，使他们不能看见；又使他们的心不能明辨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙住”表达遮蔽之意。希伯来文动词带有把东西涂抹或覆在表面、使之被遮住的具体形象；也可较意译为“蒙蔽”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直说“他们的心”。在希伯来语表达中，“心”不仅指情感，也可指思想、判断和理解的所在。
    reason: cultural_note
  - marker: c
    text: 希伯来文动词是第三人称阳性单数，但本节没有明说“蒙住”的施事者是谁。
    reason: alternative_reading
lexical_decisions:
- source_word: יָדְעוּ
  choice: 不知道
  rationale: 否定词加完成式在本语境中表达当前的一般状态；“不知道”直接、自然地传达偶像制造者的无知。
- source_word: יָבִינוּ
  choice: 不明白
  rationale: בין 表示理解、辨明；“不明白”与“不知道”构成自然并列，又不额外限定为某一种认知活动。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他们不知道、不明白的原因；现代汉语用“因为”清楚自然。
- source_word: טַח
  choice: 糊住了
  rationale: 该动词本义带有涂抹、抹灰而遮住的具体形象；“糊住”在现代汉语中既保留这一形象，也能自然表达视线受阻。
- source_word: מֵרְאוֹת עֵינֵיהֶם
  choice: 使其不能看见
  rationale: 介词 מִן 配不定式表达阻止或无法进行；用结果结构传达眼睛受阻而不能看见。
- source_word: מֵהַשְׂכִּיל לִבֹּתָם
  choice: 使他们的心不能领悟
  rationale: השׂכיל 涉及领悟、洞察；保留“心”以反映希伯来语将心视为思想和理解所在的表达方式。
- source_word: לִבֹּתָם
  choice: 他们的心
  rationale: 不改写为“头脑”，从而保存希伯来语的人观和原文意象；“领悟”明确这里主要是认知意义。
theological_decisions:
- issue: טַח 的隐含主语
  choice: 他
  alternative: 用被动式译为“他们的眼睛被糊住了”
  rationale: 希伯来语动词为第三人称阳性单数，但本节没有明说主语。译作“他”保留单数主动形式，同时以脚注说明经文没有在此指明施事者，避免直接断定是上帝、工匠或其他对象。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“糊住”保留原文具体而突出的涂抹意象；后半句用“使……不能……”自然表达希伯来语介词加不定式的阻止意义。保留“心”而不直接改为“头脑”，并以脚注交代其认知内涵。
