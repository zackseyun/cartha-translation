- from: 他们不知道，也不明白，因为他[c]糊住了他们的眼睛[a]，使其不能看见，也使他们的心不能领悟[b]。
  to: 他们不知道，也不明白，因为他[c]蒙住了他们的眼睛[a]，使他们不能看见；又使他们的心不能明辨[b]。
  rationale: 将“糊住”改为“蒙住”，以获得自然、庄重的现代汉语，同时用脚注保留 טַח 所含的涂抹、覆盖意象。将“使其不能看见”改为“使他们不能看见”，消除指代含混；后半句改为“又使他们的心不能明辨”，保留“心”的认知含义，并以平行句式清楚表达原文中眼睛和心都受阻的结构。
