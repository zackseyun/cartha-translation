id: ISA.44.25
reference: Isaiah 44:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מֵפֵר֙ אֹת֣וֹת בַּדִּ֔ים וְ/קֹסְמִ֖ים יְהוֹלֵ֑ל מֵשִׁ֧יב חֲכָמִ֛ים אָח֖וֹר וְ/דַעְתָּ֥/ם יְשַׂכֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/025.yaml
  text: who frustrates the signs of liars and makes diviners act like fools, who turns wise men back and makes their knowledge foolish,
translation:
  language: zh_hans
  text: 他使说谎者的征兆落空，使占卜者变得愚妄；他使智慧人退后，使他们的知识变为愚昧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: 使……落空
  rationale: 该分词表示破坏、挫败或使之无效；“使……落空”自然地表达征兆未能应验。
- source_word: בַּדִּים
  choice: 说谎者
  rationale: 此词在本处可指说谎者、虚妄之人；结合其“征兆”与下文占卜者，译为“说谎者”既符合语境，也保留对其虚假性的判断。
- source_word: אֹתוֹת
  choice: 征兆
  rationale: 可指记号或预兆；此处与说谎者和占卜者并列，“征兆”最贴切。
- source_word: יְהוֹלֵל
  choice: 使……变得愚妄
  rationale: 使役形态表达使人显得或行事愚妄；“变得愚妄”保留原文简练的使役意义。
- source_word: מֵשִׁיב ... אָחוֹר
  choice: 使……退后
  rationale: 直译这一空间性表达，不擅自限定为击退、驳倒或挫败。
- source_word: יְשַׂכֵּל
  choice: 使……变为愚昧
  rationale: 该使役形式意为使之愚昧；与前面的智慧和知识形成刻意反转。
theological_decisions:
- issue: 智慧人与其知识所受的反转
  choice: 保留“使智慧人退后，使他们的知识变为愚昧”的直接陈述
  alternative: 解释为“证明智慧人错误，使他们的知识显得愚蠢”
  rationale: 原文并未明确说明这是揭露、惩罚还是实际使之失效，因此不在正文中消解其神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；维持本节连续分词结构所表达的神之作为，并保留“智慧—愚昧”的修辞反转。
