source:
  edition: WLC
  text: כִּ֤י אֶצָּק מַ֨יִם֙ עַל צָמֵ֔א וְ/נֹזְלִ֖ים עַל יַבָּשָׁ֑ה אֶצֹּ֤ק רוּחִ/י֙ עַל זַרְעֶ֔/ךָ וּ/בִרְכָתִ֖/י עַל צֶאֱצָאֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/003.yaml
  text: For I will pour water on the thirsty land[a], and streams on the dry ground; I will pour out my Spirit on your offspring[c][b], and my blessing on your descendants.
translation:
  language: zh_hans
  text: 因为我要把水浇灌在干渴之地[a]，使溪流[b]流过旱地；我要把我的灵[c]浇灌在你的后裔身上，把我的福倾注在你的子孙身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“干渴者”。希伯来语原词是“干渴的”，可以独立指人；但它与下句的“旱地”平行，因此正文按干渴的土地理解。
    reason: alternative_reading
  - marker: b
    text: “溪流”原文直译为“流动的事物”，在这里指流动的水。
    reason: lexical_alternative
  - marker: c
    text: “灵”所对应的希伯来语也可表示“气息”或“风”；本节将它与上帝赐给后代的福并列，因此正文译作“我的灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的应许说明根据；保留原文的因果或解释作用。
- source_word: אֶצָּק / אֶצֹּק（יצק）
  choice: 浇灌／倾注
  rationale: 该动词本义是倒出液体。与“水”和“灵”搭配时译作“浇灌”，既自然又保留共同意象；在省略同一动词的末句中，用“倾注”表达福分丰沛赐下，也保留液体隐喻。
- source_word: מַיִם
  choice: 水
  rationale: 采用基本、直接的词义。
- source_word: צָמֵא
  choice: 干渴之地
  rationale: 原词形式上是“干渴的”，可独立作名词；但与下句“旱地”平行，较可能指缺水的土地。补出“之地”使现代汉语清楚自然，同时以脚注保留另一可能。
- source_word: וְנֹזְלִים
  choice: 溪流
  rationale: 字面意思是“流动的事物”。结合水和旱地的语境，指流动的水；“溪流”简洁地呈现景象，又不夸大为洪水。
- source_word: יַבָּשָׁה
  choice: 旱地
  rationale: 指干燥的地面或土地；“旱地”简练，并与“干渴之地”构成诗歌平行。
- source_word: רוּחִי
  choice: 我的灵
  rationale: רוּחַ可指灵、气息或风；在上帝应许赐福后代的语境中，“我的灵”最符合上下文，同时脚注保留其词义范围。
- source_word: זַרְעֶךָ
  choice: 你的后裔
  rationale: 字面为“你的种子”，在此是集合用法，指人的后代；“后裔”是庄重而自然的现代汉语。
- source_word: וּבִרְכָתִי
  choice: 把我的福
  rationale: בְּרָכָה指祝福、福分；“我的福”简洁保留上帝所赐福分的含义，并与前句“我的灵”平行。
- source_word: צֶאֱצָאֶיךָ
  choice: 你的子孙
  rationale: 指从某人而出的后代。采用“子孙”与前面的“后裔”形成同义平行，同时避免汉语重复生硬。
theological_decisions:
- issue: 应许语境中 רוּחִי 的含义
  choice: 我的灵
  alternative: 我的气息／我的风
  rationale: 本节先以水滋润旱地为喻，继而以“我的灵”和“我的福”说明上帝赐给后代的恩惠。“我的灵”保留这一应许的神学力度，但脚注不抹去原词也可表示气息或风的词义张力。
- issue: צָמֵא 的所指
  choice: 干渴之地
  alternative: 干渴的人／干渴者
  rationale: 紧接的平行语句是“溪流……在旱地上”，因此前半句最自然地描写土地；不过该形容词也可独立指“干渴者”，故以脚注保留歧义。
- issue: 末句省略动词的处理
  choice: 把我的福倾注在你的子孙身上
  alternative: 把我的福赐给你的子孙
  rationale: 希伯来诗句让前面的“浇灌”继续支配“我的福”。译作“倾注”保留水的贯穿意象和诗歌结构，而不把“福”的内容具体化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“浇灌—倾注”贯穿水的诗歌意象；分号保留本节由自然图景转向后代蒙福的两组平行结构。所有脚注标记均置于正文相应词语之后。
