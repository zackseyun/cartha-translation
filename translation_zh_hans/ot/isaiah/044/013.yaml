id: ISA.44.13
reference: Isaiah 44:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חָרַ֣שׁ עֵצִים֮ נָ֣טָה קָו֒ יְתָאֲרֵ֣/הוּ בַ/שֶּׂ֔רֶד יַעֲשֵׂ֨/הוּ֙ בַּ/מַּקְצֻע֔וֹת וּ/בַ/מְּחוּגָ֖ה יְתָאֳרֵ֑/הוּ וַֽ/יַּעֲשֵׂ֨/הוּ֙ כְּ/תַבְנִ֣ית אִ֔ישׁ כְּ/תִפְאֶ֥רֶת אָדָ֖ם לָ/שֶׁ֥בֶת בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/013.yaml
  text: The woodworker stretches out a line; he marks it out with a stylus; he shapes it with planes[a], and marks it out with a compass. He makes it like the form of a man, like the beauty of a human, to dwell in a house.
translation:
  language: zh_hans
  text: 木匠拉开准绳，用划针[a]勾画它；他用刨具加工它，又用圆规勾画它。他把它做成人的形像，如人的华美，使它住在房屋里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“刻画工具”，也可能指“红色粉笔”；原文所指的具体画线工具不能确定。
    reason: 希伯来语 שֶׂרֶד 是罕见词，可能指刻画或放样用的工具，也可能指红色颜料。
lexical_decisions:
- source_word: חָרַשׁ עֵצִים
  choice: 木匠
  rationale: 原文直指从事木料加工的工匠；“木匠”是现代汉语中自然、明确的对应语。
- source_word: נָטָה קָו
  choice: 拉开准绳
  rationale: 保留拉伸线绳以测量、放样的实际动作；“准绳”在此指工匠所用的线。
- source_word: יְתָאֲרֵהוּ
  choice: 勾画它／画出轮廓
  rationale: 该动词表示描画、勾勒外形；依两处不同工具搭配稍作措辞变化，同时保留重复动作。
- source_word: בַשֶּׂרֶד
  choice: 用划针
  rationale: 该罕见名词大概指刻画或做记号的工具，但具体为何物不能确定；正文采用概括而符合工艺场景的“划针”，并以脚注保留其他可能。
- source_word: יַעֲשֵׂהוּ בַּמַּקְצֻעוֹת
  choice: 用刨具加工
  rationale: 复数名词指木工切削或修整工具，常解作刨具；“加工”比“制作”更清楚地表达工序。
- source_word: וּבַמְּחוּגָה
  choice: 用圆规
  rationale: 该词指画圆弧或勾勒曲线的器具，“圆规”是自然准确的现代汉语名称。
- source_word: כְּתַבְנִית אִישׁ
  choice: 做成人的形体
  rationale: תַּבְנִית 表示形状、式样或模型；此处描述偶像具有人形。
- source_word: כְּתִפְאֶרֶת אָדָם
  choice: 具有人的俊美
  rationale: תִּפְאֶרֶת 可指美丽、华美或荣美；在工匠塑造外观的语境中，“俊美”自然地表达人的美观，同时不赋予额外神学含义。
- source_word: לָשֶׁבֶת בָּיִת
  choice: 好住在房屋里
  rationale: יָשַׁב 可表示坐、居住或停留；直译“住”保留经文把人造偶像描述为住在屋中的讽刺意味，也不把“房屋”擅自限定为神龛。
theological_decisions:
- issue: אִישׁ 与 אָדָם 的人类用语
  choice: 人的形体，具有人​​的俊美
  alternative: 男人的形体，具有人类的华美
  rationale: 两词在这里都着重偶像仿照人的外貌，而不是指亚当或全体人类。统一译作“人”符合现代汉语习惯，也保留人形与神像之间的对照；不必强行把 אִישׁ 限定为男性。
- issue: לָשֶׁבֶת 的拟人意味
  choice: 住在房屋里
  alternative: 安放在房屋里／坐在房屋里
  rationale: “住”保留原动词的常见意义及其刻意的拟人化讽刺；若译作“安放”，会把执行者改为工匠并削弱原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，按原文工艺步骤连续陈述。保留“住在房屋里”的拟人化和讽刺张力；不将“房屋”解释性扩译为“神龛”。
