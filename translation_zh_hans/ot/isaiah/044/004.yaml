  text: And they will spring up among the grass like willows by streams of water[a].
translation:
  language: zh_hans
  text: 他们必在青草间生长，像水道旁的柳树[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像水道旁的杨树。”希伯来语“עֲרָבִים”通常译作“柳树”，但也有人将其理解为类似杨树的水边树木。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָמְחוּ
  choice: 他们必……生长
  rationale: צמח的Qal形态表示萌发、生长。结合上文所指的后裔，用“生长”既保留将来意义，也自然承接植物意象。
- source_word: בְּבֵין
  choice: 在……间
  rationale: בְּבֵין字面为“在……之间”；用于集合性名词“青草”时，“在青草间”符合现代汉语表达，并保留空间关系。
- source_word: חָצִיר
  choice: 青草
  rationale: חָצִיר指草或草本植物。“青草”简洁自然，也呈现本节蓬勃生长的图景；原文虽无定冠词，汉语无需另作标示。
- source_word: כַּעֲרָבִים
  choice: 如……柳树
  rationale: עֲרָבִים传统上多解作生长在水边的柳树，与下文水道的环境吻合；由于树种辨识并非绝对确定，脚注保留“杨树”这一可能。
- source_word: עַל
  choice: 旁
  rationale: עַל在此表达树木与水道的方位关系，译作“旁”比“在……上”更符合现代汉语和实际图景。
- source_word: יִבְלֵי מָיִם
  choice: 溪水
  rationale: 该复数短语指流水的渠道或水道。“溪水”在汉语中自然凝练，并能呈现沿流水生长的画面；脚注以“水道”保留较形式对应的译法。
