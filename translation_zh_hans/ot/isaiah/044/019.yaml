  text: וְ/לֹא יָשִׁ֣יב אֶל לִבּ֗/וֹ וְ/לֹ֨א דַ֥עַת וְ/לֹֽא תְבוּנָה֮ לֵ/אמֹר֒ חֶצְי֞/וֹ שָׂרַ֣פְתִּי בְמוֹ אֵ֗שׁ וְ֠/אַף אָפִ֤יתִי עַל גֶּחָלָי/ו֙ לֶ֔חֶם אֶצְלֶ֥ה בָשָׂ֖ר וְ/אֹכֵ֑ל וְ/יִתְר/וֹ֙ לְ/תוֹעֵבָ֣ה אֶעֱשֶׂ֔ה לְ/ב֥וּל עֵ֖ץ אֶסְגּֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/019.yaml
  text: And he does not take it to heart[a], and there is no knowledge or understanding to say, “I burned half of it in the fire; I also baked bread on its coals; I roasted meat and ate. Shall I make the rest of it into an abomination? Shall I bow down to a block of wood?”
translation:
  language: zh_hans
  text: 他不把这事放在心上，也没有知识和悟性，以致会说：“我把它的一半烧在火中，又在它的炭火上烤了饼；我烤了肉，也吃了。难道我要把剩下的做成可憎之物吗？难道我要向一截木头[a]下拜吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一块木头”或“一段木头”。希伯来语这一说法带有轻蔑意味，强调偶像不过是木头。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׁיב אֶל לִבּוֹ
  choice: 把这事放在心上
  rationale: 这是希伯来语习用表达，指把某事带回心中思量、认真省察；“放在心上”符合现代汉语表达，也保留内在反思之意。
- source_word: דַעַת וְלֹא תְבוּנָה
  choice: 知识和悟性
  rationale: 分别保留两个相近而有区别的概念：דַעַת 指知识，תְבוּנָה 指理解、洞察的能力。
- source_word: חֶצְיוֹ
  choice: 它的一半
  rationale: 后缀回指前文所说的木料，清楚呈现一半用作燃料、剩余部分被制成偶像的对比。
- source_word: שָׂרַפְתִּי בְמוֹ אֵשׁ
  choice: 烧在火中
  rationale: 自然传达木料在火中被焚烧的场景，不拘泥于介词的形式。
- source_word: וְאַף אָפִיתִי עַל גֶּחָלָיו לֶחֶם
  choice: 又在它的炭火上烤了饼
  rationale: “又”表达 אַף 的递进、附加语气；“它的炭火”保留后缀与木料的联系；“饼”在此自然表达古代所烤的 bread，同时保持具体食物意象。
- source_word: אֶצְלֶה בָשָׂר וְאֹכֵל
  choice: 我烤了肉，也吃了
  rationale: צלה 指用火烤肉；分句简洁保留先烤后吃的动作次序。
- source_word: וְיִתְרוֹ
  choice: 剩下的
  rationale: 自然表达同一块木料用去一半之后的余料，并与前面的“一半”形成鲜明对照。
- source_word: לְתוֹעֵבָה
  choice: 做成可憎之物
  rationale: 保留 תוֹעֵבָה 强烈的厌恶和宗教性谴责色彩，同时比生硬的“可憎物”更符合现代汉语。
- source_word: לְבוּל עֵץ
  choice: 一截木头
  rationale: 该短语轻蔑地揭露偶像不过是木料；“一截木头”自然、具体，也传达先知话语中的讥讽意味。
- source_word: אֶסְגּוֹד
  choice: 下拜
  rationale: 准确表达俯伏敬拜的动作，并与“向”搭配形成庄重、清楚的现代汉语。
theological_decisions:
- issue: 是否把末尾两句明确译成反问
  choice: 用“难道……吗？”统摄两个并列动作
  alternative: 按直陈形式译为“我要……，我要向……下拜”
  rationale: 上下文呈现偶像制造者本应作出的自我质问；希伯来语虽无独立疑问词，但语境支持反问。这样处理保留先知对偶像崇拜荒谬性的揭露，而不额外加入宗派性解释。
- issue: 如何保留“可憎之物”的宗教谴责力度
  choice: 可憎之物
  alternative: 偶像；令人厌恶的东西
  rationale: 不直接窄化为“偶像”，以保留 תוֹעֵבָה 本身较宽且强烈的语义，同时让上下文说明所指。
- issue: 炭火后缀的指向
  choice: 它的炭火
  alternative: 那些炭火；由它烧成的炭火
  rationale: 希伯来文使用阳性单数后缀，最自然地回指那块木料；直译为“它的炭火”既维持联系，也避免把隐含过程解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。保留原文由日常烧火做饭转向制造偶像的讽刺对比；末尾用自然汉语反问表达其修辞力量。脚注标记置于其实际说明的“一截木头”之后，而不是置于与脚注内容无关的句首表达之后。
