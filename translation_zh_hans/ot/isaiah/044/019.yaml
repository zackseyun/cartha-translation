revisions:
- from: 他没有把这事放在心上，也没有知识和悟性，不能说：“我把它的一半烧在火中，又在它的炭火上烤了饼；我烤了肉，也吃了。难道我要把剩下的做成可憎之物，向一截木头[a]下拜吗？”
  to: 他不把这事放在心上，也没有知识和悟性，以致会说：“我把它的一半烧在火中，又在它的炭火上烤了饼；我烤了肉，也吃了。难道我要把剩下的做成可憎之物吗？难道我要向一截木头[a]下拜吗？”
  rationale: 修订仅澄清原文“没有知识和悟性，说……”所表达的内在反省能力，避免“不能说”造成的汉语歧义；并恢复末尾两个并列反问的节奏。其余关键词及脚注锚点均予保留。
