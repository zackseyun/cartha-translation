base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/017.yaml
  text: And with the rest of it he makes a god—his carved image[a]; he bows down to it and worships, and prays to it and says, “Deliver me[b], for you are my god.”
translation:
  language: zh_hans
  text: 他用剩下的木头造了一个神——他的偶像[a]；他向它跪拜、俯伏，又向它祷告说：“救我吧，因为你是我的神。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”也可译作“雕刻的像”或“雕像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאֵרִיתוֹ
  choice: 他用剩下的木头
  rationale: שְׁאֵרִיתוֹ指上文所述木料的余下部分。中文补出“木头”，使指代清楚；“用”自然表达造像所用的材料。
- source_word: לְאֵל עָשָׂה
  choice: 造了一个神
  rationale: לְ在这里表示结果或用途；“造了一个神”保留原文把人造之物称作“神”的讽刺张力。完成体עָשָׂה按其形态译为“造了”。
- source_word: לְפִסְלוֹ
  choice: 就是自己的雕像
  rationale: פֶסֶל是雕刻而成的像，也可指偶像；“雕像”保留具体的制作方式，“就是”表明它与前面的“神”同指。
- source_word: יִסְגּוֹד לוֹ וְיִשְׁתַּחוּ
  choice: 他向它跪拜、俯伏
  rationale: סגד与שׁחה都表示以身体俯下表达敬拜。分别译作“跪拜、俯伏”，保留两个并列动作及原文的修辞累积。
- source_word: וְיִתְפַּלֵּל אֵלָיו
  choice: 又向它祷告
  rationale: התפלל אל意为向某对象祷告。中文以“它”指无生命的雕像，既自然，也不赋予它真实人格。
- source_word: הַצִּילֵנִי
  choice: 救我吧
  rationale: נצל的使役命令式表示救出、搭救；“救我吧”是自然而庄重的现代中文，并保留向偶像求救的反讽。
- source_word: כִּי אֵלִי אָתָּה
  choice: 因为你是我的神
  rationale: כִּי说明求救的理由；“我的神”直接保留说话者对雕像的神性宣称。
theological_decisions:
- issue: 如何称呼作为祷告对象的雕像
  choice: 叙述中用“它”，引语中用“你”
  alternative: 全用带人格色彩的“他”，以形式对应希伯来语阳性代词
  rationale: 希伯来语的阳性形式来自אֵל和פֶסֶל的语法性别，并不必然肯定偶像具有人格。现代中文叙述中用“它”准确呈现其无生命本质；直接引语中的“你”则自然保留敬拜者对偶像说话的荒谬与讽刺。
- issue: “神”与“雕像”的关系
  choice: 译作“一个神，就是自己的雕像”
  alternative: 译作“一个神，一个偶像”
  rationale: 同位表达保留原文将人造雕像当作神的张力，不把两个称谓误解为两个不同对象，也不额外加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面中文。用“跪拜、俯伏、祷告”保留连续三个敬拜动作；标点将“就是自己的雕像”处理为同位说明。
