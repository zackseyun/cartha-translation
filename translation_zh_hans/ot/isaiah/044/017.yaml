review_pass:
  verdict: revise
  source_fidelity: 译文准确传达余下木料被制成神/偶像，以及随后的跪拜、俯伏、祷告和求救。惟“自己的雕像”在现代中文中容易被理解为“描绘他本人形象的雕像”，而非“属于他、被他当作神敬拜的偶像”；宜改为“他的偶像”，以免引入原文没有的自我肖像含义。
  naturalness: 整体庄重通顺。以“他的偶像”替换“自己的雕像”后，句义更清楚自然；破折号也更适合同位性的补充说明。
  terminology: “神”“偶像”“跪拜、俯伏”“祷告”“救我吧”“我的神”均符合经文语境及现代标准汉语。叙述用“它”、祷词中用“你”恰当保留了偶像崇拜者直接呼告的语气。
  issues:
