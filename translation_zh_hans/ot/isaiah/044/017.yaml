  to: 他用剩下的木头造了一个神——他的偶像[a]；他向它跪拜、俯伏，又向它祷告说：“救我吧，因为你是我的神。”
  rationale: 将“就是自己的雕像”改为“——他的偶像”，消除“自己的雕像”可能指本人肖像的歧义，并以“偶像”明确此处פֶּסֶל在讽刺偶像崇拜语境中的含义。脚注保留“雕刻的像/雕像”的词汇替代，以反映该词的具体造像含义。其余表达无需改动。
