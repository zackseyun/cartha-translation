    issue: “自己的雕像”可能被误解为雕刻敬拜者本人的肖像。
    rationale: 希伯来语的后缀表示“他的雕刻像/偶像”，并不表示该像是敬拜者自己的肖像。中文“自己的雕像”常有“自己的塑像”的歧义。
