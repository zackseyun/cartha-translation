  text: הֵ֤ן כָּל חֲבֵרָי/ו֙ יֵבֹ֔שׁוּ וְ/חָרָשִׁ֥ים הֵ֖מָּה מֵֽ/אָדָ֑ם יִֽתְקַבְּצ֤וּ כֻלָּ/ם֙ יַֽעֲמֹ֔דוּ יִפְחֲד֖וּ יֵבֹ֥שׁוּ יָֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/011.yaml
  text: Look[a], all his companions will be put to shame, and the craftsmen are only men. Let them all gather and stand up; they will be terrified[b], they will be put to shame together.
translation:
  language: zh_hans
  text: 看哪，他的同伴都必蒙羞；那些工匠不过是人[a]。他们全都当聚集，都站立；他们必惧怕，一同蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“是出于人”；也可译为“属于人类”，强调制造偶像的工匠不过是人，并非神明。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 保留希伯来语引人注意并加强语气的功能，同时符合庄重、自然的现代汉语。
- source_word: חֲבֵרָיו
  choice: 他的同伙
  rationale: 指与偶像或制偶者相联的一群人；“同伙”保留共同参与之意，又不把他们限定为某种行业组织。
- source_word: יֵבֹשׁוּ
  choice: 必蒙羞
  rationale: 兼顾羞愧与受辱的结果性含义，并在本节两处保持一致，呈现先知宣告的审判语气。
- source_word: וְחָרָשִׁים
  choice: 那些工匠
  rationale: חָרָשׁ 是泛指有技艺的制造者，不应窄化为铁匠；上下文明确涉及制作偶像。
- source_word: הֵמָּה מֵאָדָם
  choice: 不过是人
  rationale: 自然表达“出于人类／属于人”的限制意味，突出工匠仅属人类、绝非神明。
- source_word: יִתְקַבְּצוּ כֻלָּם
  choice: 任凭他们全都聚集
  rationale: 将未完成式理解为带挑战意味的许可或命令语气；“任凭”能表现先知让他们聚集应战的反讽挑战。
- source_word: יַעֲמֹדוּ
  choice: 站立起来
  rationale: 表达他们上前站定、面对挑战，而非普通的静态站立。
- source_word: יִפְחֲדוּ
  choice: 必惧怕
  rationale: 直接保留 פחד 的恐惧含义，与随后“蒙羞”形成并列结果。
- source_word: יָחַד
  choice: 一同
  rationale: 简洁表达所有参与者共同承受同一结局。
theological_decisions:
- issue: מֵאָדָם 所表达的受造者与神明之对比
  choice: 不过是人
  alternative: 都是出于人类的
  rationale: 原文重点是工匠仅具人的身份，并无神性；“不过是人”保留这种限制和反讽，不额外引入性别限定。
- issue: יִתְקַבְּצוּ 与 יַעֲמֹדוּ 的语气
  choice: 任凭他们全都聚集，站立起来
  alternative: 他们全都聚集，站立起来
  rationale: 上下文适合视为向制偶者发出的挑战；但希伯来语未完成式本身可有陈述式理解，因此不把语气扩展为更具体的法庭或军事场景。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以短促并列句保留希伯来诗句的推进：先宣告蒙羞，再揭示工匠仅是人，继而发出聚集站立的挑战，最后以惧怕和共同蒙羞收束。主文脚注标记与脚注完全对应。
