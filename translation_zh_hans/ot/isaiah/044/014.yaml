  naturalness: “长得强壮”和“雨水使它长大”可以理解，但现代庄重汉语中“长得茁壮”及“使它生长”更自然。将“它”改为“它们”也消除前面两个树种后的指代歧义。
  terminology: “香柏树”“橡树”“松树”合乎中文圣经的常用表达。对 תִּרְזָה 和 אֹרֶ 的树种不确定性均已以脚注保留；不宜将其认定为唯一物种。
