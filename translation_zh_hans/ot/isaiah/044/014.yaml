  text: לִ/כְרָת ל֣/וֹ אֲרָזִ֔ים וַ/יִּקַּ֤ח תִּרְזָה֙ וְ/אַלּ֔וֹן וַ/יְאַמֶּץ ל֖/וֹ בַּ/עֲצֵי יָ֑עַר נָטַ֥ע אֹ֖רֶ וְ/גֶ֥שֶׁם יְגַדֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/014.yaml
  text: He cuts down cedars for himself[a], or he takes a cypress tree or an oak and chooses it from among the trees of the forest. He plants a pine[c][b], and the rain makes it grow.
translation:
  language: zh_hans
  text: 他为自己砍伐香柏树，又取柏树[a]和橡树，使它们在林中众树之间长得茁壮[b]；他栽种松树[c]，雨水使它生长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柏树”所译的希伯来语 תִּרְזָה 所指树种不能确定，也可能是冬青栎、笃耨香树或榆树。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来语较难理解。也可译作：“他从林中的树木里为自己选取一棵强壮的树。”
    reason: alternative_reading
  - marker: c
    text: “松树”所译的希伯来语 אֹרֶ 所指树种不能确定，也可能是冷杉、白蜡树或月桂树。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִכְרָת ל֣וֹ אֲרָזִים
  choice: 他为自己砍伐香柏树
  rationale: לִכְרָת 是带 לְ 的不定式，在上下文连续描写造偶像者的行动；汉语用限定动词“砍伐”自然。לּוֹ 表示为自己取用，译作“为自己”。אֲרָזִים 通常指香柏树。
- source_word: וַיִּקַּח
  choice: 又取
  rationale: וַ־连接下一项行动；原文没有明确的选择连词，因此保留较中性的承接关系“又”，不强行译成“或”。
- source_word: תִּרְזָה
  choice: 柏树
  rationale: 具体树种无法确定；“柏树”是语境中可理解的近似译名，并以脚注保留其他可能。
- source_word: וְאַלּוֹן
  choice: 和橡树
  rationale: אַלּוֹן 通常可译为“橡树”；连词按原文译作“和”。
- source_word: וַיְאַמֶּץ לּוֹ בַּעֲצֵי יָעַר
  choice: 让它在林中众树之间长得强壮
  rationale: אמץ 的基本意义与“强壮、坚固”有关；此处句法压缩且宾语未明说。正文采用使树长得强壮的理解，同时用脚注注明也可能指为自己选取强壮的树。
- source_word: נָטַע
  choice: 他栽种
  rationale: 该动词引入取得木材的另一项行动；现代汉语不必强制标明完成体，因而可自然承接上下文的一般性描写。
- source_word: אֹרֶ
  choice: 松树
  rationale: 具体树种无法确定；“松树”是常见且符合木材语境的译法，其他可能在脚注中说明。
- source_word: וְגֶשֶׁם יְגַדֵּל
  choice: 雨水使它长大
  rationale: יְגַדֵּל 是使役意义，表明雨水使树生长；“使它长大”既贴近原文，也符合现代汉语。
theological_decisions:
- issue: 反偶像语境中，对树木取得、培育及生长过程的描写
  choice: 按一连串普通的人类行动和自然生长过程来翻译，并保留困难分句的歧义。
  alternative: 将 וַיְאַמֶּץ לּוֹ 理解为“他从林中的树木里为自己选取一棵强壮的树”。
  rationale: 上下文的讽刺在于偶像所用的材料不过是人砍伐、栽种，并靠雨水长大的普通树木。困难分句既可能描写树被培育得强壮，也可能描写人选择强壮的树；正文采用较贴近 אמץ 常见词义的译法，脚注保留另一理解，不把语法歧义转化为教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“香柏树”沿用中文圣经语境中广为人知的树名；其余用日常植物名称。分号划分取用林木与栽种树木两组动作，使长句清晰，同时不补入原文没有明说的神学解释。
