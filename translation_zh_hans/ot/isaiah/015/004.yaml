source:
  edition: WLC
  text: וַ/תִּזְעַ֤ק חֶשְׁבּוֹן֙ וְ/אֶלְעָלֵ֔ה עַד יַ֖הַץ נִשְׁמַ֣ע קוֹלָ֑/ם עַל כֵּ֗ן חֲלֻצֵ֤י מוֹאָב֙ יָרִ֔יעוּ נַפְשׁ֖/וֹ יָ֥רְעָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/004.yaml
  text: Heshbon and Elealeh cry out[a]; their voice is heard as far as Jahaz. Therefore the armed men of Moab cry out[b]; his soul trembles within him.
translation:
  language: zh_hans
  text: 希实本和以利亚利哀号，他们的声音传到雅杂。因此，摩押的披甲战士高声呼喊[a]；他心里战栗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “披甲战士”也可译作“勇士”；“高声呼喊”也可译作“呐喊”。
    reason: lexical_alternative
  - marker: b
    text: 末句希伯来文含义不易确定，也可译作“他的心为他忧苦”或“他的心在他里面惊惶”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְעַק
  choice: 哀号
  rationale: זעק表示因危难或惊恐而发出的响亮呼声；“哀号”既传达灾难处境，也适合先知诗歌的语气。
- source_word: חֶשְׁבּוֹן וְאֶלְעָלֵה
  choice: 希实本和以利亚利
  rationale: 按现代中文圣经地名的通行音译处理；两座城在诗中被人格化为发声者。
- source_word: עַד יַהַץ נִשְׁמַע קוֹלָם
  choice: 他们的声音传到雅杂
  rationale: עַד表示声音所达到的范围；以“传到”自然表达被动式נִשְׁמַע所呈现的远处可闻之意。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 保留前后句之间明确的结果或推论关系。
- source_word: חֲלֻצֵי מוֹאָב
  choice: 摩押的披甲战士
  rationale: חֲלֻצִים在此指装备好、列阵作战的人；“披甲战士”保留军事含义，又不把词义过度限定为某一种兵种。
- source_word: יָרִיעוּ
  choice: 高声呼喊
  rationale: 该动词表示发出响亮的喊声，在军事语境中可指呐喊；此处不用“发出战吼”，以免在悲痛语境中把喊声性质说得过于确定。
- source_word: נַפְשׁוֹ יָרְעָה לּוֹ
  choice: 他心里战栗
  rationale: 末句希伯来文艰涩；נפש在这里指内在生命或内心，“心里”符合现代汉语。以“战栗”表达内在崩溃、惊惶的诗意，同时用单数“他”保留原文对摩押的拟人化。
theological_decisions:
- issue: 末句单数代词的指代
  choice: 保留单数“他”，理解为人格化的摩押
  alternative: 改为复数“他们”，指摩押的战士
  rationale: 原文连续使用第三人称阳性单数后缀נַפְשׁוֹ和לּוֹ；不应为求表面一致而擅自改成复数。
- issue: 末句נפש的表达
  choice: 译作“心里”，表示内在自我
  alternative: 直译为“灵魂”或译作“性命”
  rationale: 上下文重在恐惧与内在震动，并不要求技术性的灵魂观；“心里”在现代汉语中更自然，也不额外引入人论立场。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。地名使用简体中文圣经读者较熟悉的音译；前半句保留城邑人格化，末句保留指向人格化摩押的单数代词。诗句以分号呈现由外在哀号转入内在惊惶的层次。
