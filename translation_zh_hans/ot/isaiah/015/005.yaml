base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/005.yaml
  text: My heart cries out for Moab[a]; her fugitives flee as far as Zoar, as far as Eglath-shelishiyah. For they go up the ascent of Luhith with weeping[c][b]; for on the road to Horonaim they raise a cry of destruction.
translation:
  language: zh_hans
  text: 我的心为摩押哀号；她的逃亡者[a]逃到琐珥，逃到伊基拉·施利施亚[b]。他们沿着鲁希的坡道上去，一路哭泣[c]；在通往何罗念的路上，他们因毁灭而发出呼喊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 בְּרִיחֶיהָ 含义不确定，可指“她的逃亡者／难民”；按字面也可理解为“她的门闩”。有人将其视为比喻，或认为原文在流传中发生了讹误。
    reason: lexical_alternative
  - marker: b
    text: “伊基拉·施利施亚”很可能是地名；这几个希伯来词也可按字面理解为“一头三岁的母牛”。
    reason: lexical_alternative
  - marker: c
    text: 本节的希伯来语动词在单数和复数之间转换。正文按摩押民众集体逃亡的场景统一用复数表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי לְמוֹאָב יִזְעָק
  choice: 我的心为摩押哀号
  rationale: 保留“我的心”这一情感中心；לְמוֹאָב 表示哀号所关切的对象，“为摩押”自然表达替摩押悲痛之意。יִזְעָק 是痛苦中的高声呼喊，译作“哀号”符合哀歌语境。
- source_word: בְּרִיחֶיהָ
  choice: 她的逃亡者
  rationale: 该词形式和含义均有困难；按灾难中民众逃往琐珥的语境，取“逃亡者”最为连贯，同时在脚注保留更为字面的“门闩”等可能。
- source_word: עַד צֹעַר
  choice: 远逃到琐珥
  rationale: עַד 表示所达到的范围或终点；结合上下文补出动作“逃”，并以“远逃到”传达逃亡延伸至该地。
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  choice: 伊基拉·施利施亚
  rationale: 上下文连续列举地名和路线，因此按地名音译；但原词也可按普通名词理解为“三岁的母牛”，故在脚注说明。
- source_word: מַעֲלֵה הַלּוּחִית
  choice: 鲁希的坡道
  rationale: מַעֲלֵה 指向上的坡路或上坡路段；“坡道”比生硬的“上升处”更符合现代汉语地理表达。
- source_word: בִּבְכִי יַעֲלֶה בּוֹ
  choice: 沿着……上去，一路哭泣
  rationale: 保留上坡的动作和伴随的哭泣；“一路哭泣”自然呈现持续哀哭的景象。
- source_word: דֶּרֶךְ חוֹרֹנַיִם
  choice: 通往何罗念的路上
  rationale: 在路线语境中，דֶּרֶךְ 加地名自然译为通往该地的道路。
- source_word: זַעֲקַת שֶׁבֶר
  choice: 毁灭的哀号
  rationale: שֶׁבֶר 在此指灾难、崩溃或毁灭，而非字面的折断；“毁灭的哀号”兼顾灾情和悲声。
- source_word: יְעֹעֵרוּ
  choice: 他们发出
  rationale: 该动词本有唤起、激起之意，与“哀号”搭配时，现代汉语以“发出”表达最自然。
