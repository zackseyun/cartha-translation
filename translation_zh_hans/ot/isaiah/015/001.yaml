  text: מַשָּׂ֖א מוֹאָ֑ב כִּ֠י בְּ/לֵ֞יל שֻׁדַּ֨ד עָ֤ר מוֹאָב֙ נִדְמָ֔ה כִּ֗י בְּ/לֵ֛יל שֻׁדַּ֥ד קִיר מוֹאָ֖ב נִדְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/001.yaml
  text: 'An oracle concerning Moab: because in a night Ar of Moab is devastated[a], it is destroyed; because in a night Kir of Moab is devastated[c][b], it is destroyed.'
translation:
  language: zh_hans
  text: 关于摩押的宣告[a]：一夜之间，摩押的亚珥遭劫掠，被毁灭[b]；一夜之间，摩押的基珥遭劫掠，被毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣告”也可译作“重担”或“神谕”；这里是先知性审判宣言的标题。
    reason: lexical_alternative
  - marker: b
    text: “被毁灭”也可理解为“被剪除”或“归于沉寂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: 宣告
  rationale: 在先知书标题中指带有审判性质的先知性宣言；“宣告”自然庄重，又不把词义局限为字面的“重担”。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: כִּי
  choice: 不单独译出，以冒号后并列陈述呈现
  rationale: 此处可引出宣告的内容或说明其缘由；中文若重复译作“因为”会显得悬空。冒号既保持其引介功能，也保留内容与缘由之间的轻微歧义。
- source_word: בְּלֵיל
  choice: 一夜之间
  rationale: 表达事情在一个夜晚内突然发生，符合希伯来语简短而有冲击力的措辞。
- source_word: שֻׁדַּד
  choice: 遭到蹂躏
  rationale: 被动式表示遭劫掠、摧残而荒废；“蹂躏”保留暴力洗劫的意味，又不武断地断定完全消灭。
- source_word: עָר מוֹאָב
  choice: 摩押的亚珥
  rationale: 将其作为摩押城邑名处理，保留原文所属结构，并采用音译。
- source_word: נִדְמָה
  choice: 归于沉寂
  rationale: 该动词在此可表示被消灭、断绝或归于寂静；“归于沉寂”保留“被止息”的意象，也避免与前面的“遭到蹂躏”完全同义重复。
- source_word: קִיר מוֹאָב
  choice: 摩押的基珥
  rationale: 将其作为摩押城邑名处理，保留原文所属结构，并采用音译。
theological_decisions:
- issue: נִדְמָה 所表达的毁灭程度
  choice: 归于沉寂
  alternative: 被毁灭／被剪除
  rationale: 原词在毁灭语境中含义较宽。正文保留“沉寂”意象，脚注说明更强的毁灭性理解，不将其神学和修辞张力单一化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两个分句保持紧密平行，以再现原文的诗性节奏和突发感；“一夜之间”比生硬的“一夜里”更符合现代汉语，同时保留单夜内骤然倾覆的强调。
