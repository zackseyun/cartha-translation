revisions:
- from: 因为宁林的水必变为荒场[a]；青草已经枯干，嫩草也已消失，青绿之物一样也没有了。
  to: 因为宁林的水必成为荒凉[a]；草已经枯干，草木也已消尽，不再有任何青绿之物。
  rationale: 以“成为荒凉”替换“变为荒场”，避免将广义的荒凉／荒废限缩为农田或场地，同时维持原文关于“水”本身或其所在水域的含混。脚注删去未经明说的“枯竭”，并保留两种可行理解。后半句调整为更自然的现代普通话，且保留草、草木与一切青绿之物逐层消失的结构。
