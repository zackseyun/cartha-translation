base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/006.yaml
  text: For the waters of Nimrim will become desolations[a], for the grass is dried up, the vegetation is gone, and no green thing remains.
translation:
  language: zh_hans
  text: 因为宁林的水必成为荒凉[a]；草已经枯干，草木也已消尽，不再有任何青绿之物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必荒凉”或“必成为荒凉之地”。希伯来文表述十分简练，既可指这些水遭受荒凉，也可指其所在地区成为荒凉之地。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本节两个כִּי均引出对前文哀号与审判景象的解释；译作“因为”自然保留因果说明作用。
- source_word: מֵי נִמְרִים
  choice: 宁林的水
  rationale: מֵי是“水”的复数构造形式，נִמְרִים为地名；采用通行的中文音译“宁林”。
- source_word: מְשַׁמּוֹת יִהְיוּ
  choice: 必变为荒场
  rationale: היה与谓语名词连用可表示“成为”；מְשַׁמּוֹת为复数，指荒废、遭毁坏的地方或状态。正文用自然中文表达，并以脚注保留其紧凑结构所容许的不同理解。
- source_word: יָבֵשׁ חָצִיר
  choice: 青草已经枯干
  rationale: 完成式描写枯干后的状态；“青草”清楚呈现חָצִיר在此处的植物意象。
- source_word: כָּלָה דֶשֶׁא
  choice: 嫩草也已消失
  rationale: דֶשֶׁא指新生、鲜嫩的草木，כָּלָה表示耗尽或不复存在；“也已消失”承接渐进的荒芜描写。
- source_word: יֶרֶק לֹא הָיָה
  choice: 青绿之物一样也没有了
  rationale: יֶרֶק泛指绿色植物或青绿之物；存在句的否定表达彻底绝迹，译文保留其广泛而具体的范围。
