  yaml_path: translation/ot/isaiah/015/007.yaml
  text: Therefore the abundance they have gained and what they have stored up they carry away over the Brook of the Willows[a][b].
translation:
  language: zh_hans
  text: 因此，他们把所得的积蓄和所储存的财物[b]，都运过柳树河[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚拉巴的溪谷”，又或“荒漠平原的河谷”。希伯来语原文的含义不能确定；传统译法是“柳树河”。
    reason: alternative_reading
  - marker: b
    text: “所储存的财物”在希伯来语中含义较难确定，也可理解为“他们的财物”或“受托给他们保管的东西”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְרָה עָשָׂה
  choice: 他们所积聚的余财
  rationale: יִתְרָה可指余剩、富余或丰富之物；与עָשָׂה连用，在逃难携物的语境中译为“所积聚的余财”，既保留“余剩”的意味，也自然表达所得财物。
- source_word: וּפְקֻדָּתָם
  choice: 和所储藏的财物
  rationale: 该词含义困难，可能指储备、财物或受托保管之物；正文按上下文译作“所储藏的财物”，并在脚注保留其他可能。
- source_word: נַחַל
  choice: 河
  rationale: נַחַל常指溪流、河谷或季节性水道；在地名“柳树河”中用通俗简洁的“河”，具体地貌的不确定性由脚注说明。
- source_word: הָעֲרָבִים
  choice: 柳树
  rationale: 采用传统理解，将该词视为柳树或类似树木，构成地名“柳树河”；其与亚拉巴或荒漠平原相关的另一种分析保留在脚注。
- source_word: יִשָּׂאוּם
  choice: 都要带过
  rationale: נשׂא表示携带、搬运，宾语后缀回指前述财物；“带过”体现逃亡者把财物运过该水道的情景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“余财”与“财物”保持诗句的平行结构；“都要带过”自然表达集体逃难及宾语复数的关系。所有不确定读法均在脚注中保留。
