reference: Isaiah 15:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עָלָ֨ה הַ/בַּ֧יִת וְ/דִיבֹ֛ן הַ/בָּמ֖וֹת לְ/בֶ֑כִי עַל נְב֞וֹ וְ/עַ֤ל מֵֽידְבָא֙ מוֹאָ֣ב יְיֵלִ֔יל בְּ/כָל רֹאשָׁ֣י/ו קָרְחָ֔ה כָּל זָקָ֖ן גְּרוּעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/002.yaml
  text: He has gone up to the temple[a], and Dibon to the high places, to weep. Over Nebo and over Medeba Moab wails; on every head is baldness[b], every beard is cut off.
translation:
  language: zh_hans
  text: 他上到那殿宇[a]，底本上到丘坛，为要哀哭。摩押为尼波和米底巴哀号；每一颗头都剃光了[b]，每一把胡须都剪掉了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那房屋”。希伯来文直译是“那房屋”；在这里与“丘坛”并列，很可能指神庙或敬拜场所。
    reason: lexical_alternative
  - marker: b
    text: 剃光头发和剪掉胡须都是表示哀悼的举动。
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה
  choice: 上到
  rationale: 这是עלה的Qal完成式第三人称阳性单数；在哀歌式叙述中表示已经发生的上行行动。汉语用“上到”既保留方向，也不必强行标明英语式完成时。
- source_word: הַבַּיִת
  choice: 殿宇
  rationale: 字面是“那房屋”。本句将其与“丘坛”并列，语境很可能指敬拜用的神庙或圣所；“殿宇”能表达宗教场所，同时以脚注保留“房屋”的字面可能。
- source_word: וְדִיבֹן
  choice: 底本
  rationale: 摩押地名，按现代普通话音译。希伯来文仅以连词连接该名词；译文依上下文补足前句的“上到”，使省略结构在汉语中清楚。
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: במה在此处指设于高处的祭祀场所。“丘坛”比单纯的“高处”更能传达宗教含义，又不具体限定建筑形制。
- source_word: לְבֶכִי
  choice: 为要哀哭
  rationale: 介词לְ与名词“哭泣”在此表达目的。“为要哀哭”自然地呈现这一目的关系。
- source_word: נְבוֹ
  choice: 尼波
  rationale: 摩押地名，采用常见中文圣经音译。
- source_word: מֵידְבָא
  choice: 米底巴
  rationale: 地名，采用常见中文圣经音译。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 此处是集合性单数，指摩押全地或摩押人民；中文保留地名，让上下文维持这种集合含义。
- source_word: יְיֵלִיל
  choice: 哀号
  rationale: 该动词表示大声哭号。“哀号”兼有可闻的悲痛与强烈哀悼意味，比一般的“哀叹”更贴近原词。
- source_word: בְּכָל רֹאשָׁיו קָרְחָה
  choice: 人人头上光秃
  rationale: 原文直译近于“它的每个头上都有秃处”，以单数的摩押作集合主体。中文用“人人”自然表达分配意义，并保留光秃这一哀悼标志。
- source_word: כָּל זָקָן גְּרוּעָה
  choice: 胡须全都剪掉
  rationale: 保留“胡须”的具体意象，并将被动状态自然译出。גְּרוּעָה表示被削去、剪除，而非自然脱落。
theological_decisions:
- issue: הַבַּיִת所指的宗教场所
  choice: 正文译作“殿宇”
  alternative: “房屋”
  rationale: 与“丘坛”并列且用于哀哭的语境较支持神庙或圣所之意，但原词本身仍是普通的“房屋”，故以脚注保留这一词义张力，不指定它属于哪一位神。
- issue: 首句省略结构的主语与动词补足
  choice: 译作“他上到殿宇，底本上到丘坛”
  alternative: “底本上到殿宇和丘坛”或“他上到房屋，底本上到丘坛”
  rationale: 马所拉文本的句法十分紧缩，只有一个显式动词，且“底本”前无方向介词。正文尽量贴近其并列次序，只为汉语可读性给“底本”补出“上到”，不把两个地点强行合并为同一结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿宇”与“丘坛”保留古代宗教场景；“为要哀哭”“哀号”维持诗歌的悲恸语气。首句保留原文紧缩而略带歧义的并列结构，但适度补足动词以免中文难解。
