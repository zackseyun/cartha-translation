  to: 因为底们的水满了血[a]；我还要把更多的事加在底们身上[b]：狮子要临到摩押的逃亡者[c]，也临到那地所剩下的人。
  rationale: 修订不把原文省略的“更多之事”直接限定为“灾祸”，同时保留脚注中的语境性理解。调整“狮子”的句式以避免不必要的使役表达，并使“余剩者”的汉语表达更自然。脚注锚点a、b、c均保留并与正文对应。
