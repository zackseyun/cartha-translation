  text: כִּ֣י מֵ֤י דִימוֹן֙ מָ֣לְאוּ דָ֔ם כִּֽי אָשִׁ֥ית עַל דִּימ֖וֹן נוֹסָפ֑וֹת לִ/פְלֵיטַ֤ת מוֹאָב֙ אַרְיֵ֔ה וְ/לִ/שְׁאֵרִ֖ית אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/009.yaml
  text: 'For the waters of Dimon are full of blood[a], for I will bring more upon Dimon: a lion upon the fugitives of Moab[c][b], and upon the remnant of the land.'
translation:
  language: zh_hans
  text: 因为底们的水满了血[a]；我还要把更多的事加在底们身上[b]：狮子要临到摩押的逃亡者[c]，也临到那地所剩下的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “底们”可能与希伯来语“血”（dam）形成双关；也有人认为此地名与“底本”有关。
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作“我还要把更多的事加在底们身上”；所加添的具体内容没有明说。按上下文可理解为更多的灾祸。
    reason: alternative_reading
  - marker: c
    text: 这里的“狮子”可能指实际的狮子，也可能是进一步审判或毁灭的比喻形象。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵי דִימוֹן
  choice: 底们的水
  rationale: 保留马所拉文本中的地名“底们”（Dimon），而不在正文中改作“底本”；“水”自然表达构造关系。
- source_word: מָלְאוּ דָם
  choice: 满了血
  rationale: 直接保留原文鲜明而凝练的血水意象。
- source_word: אָשִׁית עַל דִּימוֹן נוֹסָפוֹת
  choice: 我还要把更多灾祸加在底们身上
  rationale: שׂים עַל 表示加诸、施加；נוֹסָפוֹת 字面为“更多的事物”，具体内容省略。正文按审判语境补出“灾祸”以使现代汉语通顺，并以脚注说明原文的含蓄表达。
- source_word: לִפְלֵיטַת מוֹאָב
  choice: 临到摩押逃脱的人
  rationale: פְלֵיטָה 指逃脱者或幸存者；此处采用“逃脱的人”，既符合逃难语境，也避免把它过早限定为神学术语“余民”。
- source_word: אַרְיֵה
  choice: 狮子
  rationale: 保留具体意象，不在正文判定是实际猛兽还是比喻性的审判力量。
- source_word: וְלִשְׁאֵרִית אֲדָמָה
  choice: 也临到那地余剩的人
  rationale: שְׁאֵרִית 表示剩余者；אֲדָמָה 在此按地域语境译为“那地”。将抽象的“剩余”自然表达为当地余剩的人。
- source_word: כִּי ... כִּי
  choice: 因为……；我还要……
  rationale: 首个 כִּי 译为“因为”，承接上下文；第二个 כִּי 在预告中带强调或说明作用，汉语以分号和“还要”体现，避免机械重复。
theological_decisions:
- issue: “狮子”的性质
  choice: 正文保留“狮子”这一具体形象，不作解释
  alternative: 实际的狮子；或象征入侵者及进一步审判
  rationale: 希伯来文本没有明说其所指，翻译应保留预言意象的开放性。
- issue: נוֹסָפוֹת 所指的追加之物
  choice: 正文依审判语境译作“更多灾祸”，并在脚注交代字面含蓄性
  alternative: “更多的事”或“额外之物”
  rationale: 原文把追加内容留作隐含；现代汉语若直译会生硬，但不应让读者误以为“灾祸”是原文明确出现的名词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号和冒号保留预言诗句层层推进的节奏；地名使用和合本传统中较熟悉的“底们”。正文中的所有脚注标记均与脚注对应。
