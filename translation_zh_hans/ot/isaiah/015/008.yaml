  text: כִּֽי הִקִּ֥יפָה הַ/זְּעָקָ֖ה אֶת גְּב֣וּל מוֹאָ֑ב עַד אֶגְלַ֨יִם֙ יִלְלָתָ֔/הּ וּ/בְאֵ֥ר אֵילִ֖ים יִלְלָתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/008.yaml
  text: For the outcry has gone around the border of Moab[a]; its wailing reaches as far as Eglaim[b], and its wailing to Beer-elim.
translation:
  language: zh_hans
  text: 因为哀号已绕遍摩押的边界；哀哭声远达以基莲，也传到比珥·以琳[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比珥·以琳”是地名，可能意为“以琳之井”或“勇士之井”。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的哀歌或审判宣告补充原因；现代汉语用“因为”能自然体现这一话语关系。
- source_word: הִקִּיפָה
  choice: 传遍了
  rationale: 该动词有“环绕、绕行”之意；以“哀号”为主语时，“传遍”符合汉语表达，同时脚注保留沿边界环绕传播的空间意象。
- source_word: הַזְּעָקָה
  choice: 哀号
  rationale: 指人在危难中的强烈呼喊；“哀号”兼具痛苦、公开呼喊和哀悼的色彩。
- source_word: אֶת גְּבוּל מוֹאָב
  choice: 摩押的边境
  rationale: גְּבוּל在此主要指地理边界或边境；“边境”自然地表达哀号传及摩押四境。
- source_word: עַד
  choice: 远达
  rationale: 表示传播范围所达到的地点；“远达”简洁体现“直到、远至”的地理延伸。
- source_word: אֶגְלַיִם
  choice: 以基莲
  rationale: 地名按现代中文圣经人名地名的常见音译处理。
- source_word: יִלְלָתָהּ
  choice: 哀哭声
  rationale: יִלְלָה表示悲痛的号哭；译成“哀哭声”自然明确。原文两次重复该词，中文第二处以“也传到”承接，以避免生硬，同时保持平行范围。
- source_word: וּבְאֵר אֵילִים
  choice: 也传到比珥·以琳
  rationale: 前缀וּ连接第二个地点，省略的传播概念由上句补出；用“也传到”清楚呈现平行结构，地名音译并以间隔号显示其复合形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“哀号”与“哀哭声”表现灾难中的强烈悲声；地名使用常见中文音译。主文以自然汉语表达传播范围，脚注保留希伯来文动词“环绕”的具体空间意象。
