base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/003.yaml
  text: In its streets they put on sackcloth; on its rooftops and in its squares everyone wails[a], going down in weeping.
translation:
  language: zh_hans
  text: 街道上，人们腰束麻布；屋顶上和广场上，众人都哀号，哭着下去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众人都哀号，在哭泣中下去。”原文直译为“下去，在哭泣中”；这可以指实际往低处走，也可能描绘人被悲痛压倒。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחוּצֹתָיו
  choice: 街道上
  rationale: חוּצוֹת在城镇语境中指户外的公共区域，通常包括街道；译作“街道上”自然地呈现公开哀悼的场景。
- source_word: חָגְרוּ שָׂק
  choice: 人们腰束麻布
  rationale: חגר本义是束在腰间；与שַׂק连用，指以麻布束身作为哀悼的标志。“腰束麻布”既保留动作意象，也符合庄重的现代汉语表达。
- source_word: עַל גַּגּוֹתֶיהָ
  choice: 房顶上
  rationale: גַּגּוֹת指当地房屋可供活动的平顶；“房顶上”准确而易懂。
- source_word: וּבִרְחֹבֹתֶיהָ
  choice: 和广场中
  rationale: רְחוֹבוֹת指城内宽阔的公共空间，常为广场；这样也与前面的“街道”保持词义区别。
- source_word: כֻּלֹּה
  choice: 全城都
  rationale: 该词形式上是“她的全部”，语境中集合性地指城中居民；“全城都”既保留城市整体受哀伤笼罩的表达，也自然指向其中的人。
- source_word: יְיֵלִיל
  choice: 在哀号
  rationale: ילל表示高声、强烈的悲鸣；“哀号”比“哀哭”更能传达声音的强度，又不带动物性的联想。
- source_word: יֹרֵד בַּבֶּכִי
  choice: 在哭泣中下去
  rationale: יֹרֵד直译为“下去、下降”，בַּבֶּכִי为“在哭泣中”。正文尽量保留原文含混而富于张力的意象，不明确限定为实际下行或被悲痛压倒，并以脚注说明。
