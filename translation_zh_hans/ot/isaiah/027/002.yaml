  text: 'In that day: “A pleasant vineyard”—sing of it![a][b]'
translation:
  language: zh_hans
  text: '到那日：


    “佳美的葡萄园”[a]——你们要为她歌唱！[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “佳美的葡萄园”也可译作“可喜爱的葡萄园”或“令人喜悦的葡萄园”。
    reason: lexical_alternative
  - marker: b
    text: “为她歌唱”也可译作“向她歌唱”“为她唱和”或“唱到她”；原文动词可指以歌声回应，阴性代词指葡萄园。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的时间公式；“到那日”既符合现代汉语习惯，也保留其预示性语气。
- source_word: כֶּרֶם
  choice: 葡萄园
  rationale: 该名词指种植葡萄的园子，而非单株葡萄树，也与上下文的葡萄园意象相符。
- source_word: חֶמֶד
  choice: 佳美的
  rationale: 此词表达可喜、可爱、令人愉悦或珍爱的性质；“佳美的葡萄园”自然、庄重，并保留正面的评价色彩。
- source_word: עַנּוּ
  choice: 你们要……歌唱
  rationale: 此处很可能是复数命令式；ענה在歌唱或礼仪语境中可指应答、唱和，因此正文采用自然清楚的“歌唱”，同时以脚注保留“唱和”的可能。
- source_word: לָהּ
  choice: 为她
  rationale: 介词ל接阴性单数代词，回指“葡萄园”。“为她”保留希伯来语的阴性拟人表达，也不武断限定为向她唱或歌唱她。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到那日”保留先知性节奏；以引语和破折号呈现诗歌标题式短语及随后的复数呼召。保留葡萄园的阴性拟人，不将介词与歌唱动词之间的语义关系过度具体化。
