reference: Isaiah 27:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יִתָּקַע֮ בְּ/שׁוֹפָ֣ר גָּדוֹל֒ וּ/בָ֗אוּ הָ/אֹֽבְדִים֙ בְּ/אֶ֣רֶץ אַשּׁ֔וּר וְ/הַ/נִּדָּחִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הִשְׁתַּחֲו֧וּ לַ/יהוָ֛ה בְּ/הַ֥ר הַ/קֹּ֖דֶשׁ בִּ/ירוּשָׁלִָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/013.yaml
  text: And in that day a great trumpet will be blown[c][b][a], and those perishing in the land of Assyria and those driven away in the land of Egypt will come and worship Yahweh on the holy mountain in Jerusalem.
translation:
  language: zh_hans
  text: 到那日，必有大号角吹响；在亚述地濒于灭亡的人[a]，以及在埃及地被赶散的人[b]，都必前来，在耶路撒冷的圣山上俯伏敬拜[c]耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “濒于灭亡的人”也可译作“迷失的人”或“失丧的人”。
    reason: lexical_alternative
  - marker: b
    text: “被赶散的人”也可译作“被放逐的人”或“流落在外的人”。
    reason: lexical_alternative
  - marker: c
    text: “俯伏敬拜”直译为“俯伏”或“下拜”；这里指在耶和华面前敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知文体中指向未来决定性时刻的固定表达；中文无需生硬补出“事情将会发生”。
- source_word: יִתָּקַע בְּשׁוֹפָר גָּדוֹל
  choice: 必有大号角吹响
  rationale: 采用非人格化表达再现希伯来语被动式；“号角”既自然，也比现代乐器意义上的“喇叭”更贴近 שׁוֹפָר 的古代礼仪与召集背景。“大”保留其规模或重要性的开放含义。
- source_word: הָאֹבְדִים
  choice: 将要灭亡的人
  rationale: 保留 אבד 分词所含的败亡、消亡之动态意义，同时以脚注保存“迷失的人”这一真实可行的词义。
- source_word: וְהַנִּדָּחִים
  choice: 被赶散的人
  rationale: 保留 נדח 被动分词的受迫离散意味，不把它限定为法律意义上的放逐；脚注列出其他可能译法。
- source_word: וּבָאוּ
  choice: 都必前来
  rationale: 直译其移动意义；“都”自然统摄前列两类人，并非额外限定人数范围。
- source_word: וְהִשְׁתַּחֲווּ
  choice: 俯伏敬拜
  rationale: 同时表达该动词具体的俯伏动作和在耶和华面前的敬拜意义，避免只译“敬拜”而丢失身体姿态。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，使其与普通称谓“主”有所区别。
- source_word: בְּהַר הַקֹּדֶשׁ בִּירוּשָׁלִָם
  choice: 在耶路撒冷的圣山上
  rationale: 自然表达地点关系，并保留“圣山”的宗教与地理意象；不擅自明确为仅指某一建筑。
theological_decisions:
- issue: “到那日”与聚集图景的时间指向
  choice: 保留开放的未来性，不限定为单一历史事件或末世事件
  alternative: 仅指历史上的被掳者归回；或仅指末后的终极聚集
  rationale: 经文本身以先知性的“到那日”连接亚述、埃及、圣山与敬拜意象，但未在本节中排除历史与终末之间可能存在的多重视域。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主；主；雅威
  rationale: “耶和华”是现代简体中文圣经传统中广为识别的专名形式，可明确反映原文神名；不借译名加入宗派性解释。
- issue: 归回者的身份
  choice: 按其处境译为“将要灭亡的人”和“被赶散的人”
  alternative: 将两者概括为“以色列余民”或“被掳的以色列人”
  rationale: 本节并未直接使用“余民”“被掳者”或族名；避免把上下文推断写进正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号划分号角吹响与流散者归来的两个画面；使用“必”保持先知宣告的确定语气。正文中的脚注标记均紧随相关措辞，未沿用英文咨询层中错置于“号角”后的标记顺序。
