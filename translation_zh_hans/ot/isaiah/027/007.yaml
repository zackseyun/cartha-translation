base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/007.yaml
  text: Has he struck him as he struck the one who struck him? Or has he been killed as his slain were killed?[a][b]
translation:
  language: zh_hans
  text: 他击打他，难道像那击打他的人击打他一样吗？或者，他被杀，难道像他所杀的人被杀一样吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像那击打他的人击打他一样”，也可译作“照着那击打他的人的击打方式”。
    reason: lexical_alternative
  - marker: b
    text: 本节各处“他”的所指在希伯来文中高度浓缩，并未明说。按上下文，大意可能是：所论者并未像那些被他（或其仇敌）杀的人那样遭到毁灭。
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּמַכַּת
  choice: 难道像……一样吗
  rationale: 疑问词 הַ 与比较介词 כְּ 构成反问式比较；中文用“难道像……一样吗”自然保留疑问和比较语气。
- source_word: מַכֵּהוּ
  choice: 那击打他的人
  rationale: נכה 的使役主动分词带第三人称阳性单数后缀，指“击打他的人”；此译保留施事者及代词。
- source_word: הִכָּהוּ
  choice: 他击打他
  rationale: 完成式在此陈述反问所比较的行动；采用简洁的“击打”并保留原文压缩的代词关系。
- source_word: אִם
  choice: （第二个）难道……吗
  rationale: 此处引出平行的第二个选择性疑问；汉语以另起反问表达其与前句并列、递进的功能，不机械译为“或者”。
- source_word: כְּהֶרֶג
  choice: 像……那样被杀
  rationale: הֶרֶג 表示杀戮、杀害；在比较结构中转为汉语动词性表达较自然，同时保持“像……那样”的对应。
- source_word: הֲרֻגָיו
  choice: 被他杀的人
  rationale: 被动分词带第三人称阳性单数后缀，可理解为“他所杀的人”；正文仍以代词表达，不明确指定其所指。
- source_word: הֹרָג
  choice: 他被杀
  rationale: 该形式表达被动意义，与“被他杀的人”形成词根复现；译作“被杀”比“被屠戮”更自然且不过度强化语义。
theological_decisions:
- issue: 反问比较中各代词的所指
  choice: 正文保留“他／那……的人”等代词，不直接改写为“以色列”“雅各”或“仇敌”。
  alternative: 明确译为耶和华击打以色列，却不像击打以色列之敌那样。
  rationale: 上下文很可能是在对比耶和华对雅各／以色列的管教与对其敌人的审判，但本节希伯来文本身以紧缩的代词和分词表达。保留这种含蓄可避免把上下文解释写入正文。
- issue: הֲרֻגָיו 中后缀所表达的关系
  choice: 译为“被他杀的人”，同时以脚注说明代词关系仍可能有不同理解。
  alternative: 译为较含混的“属他的被杀者”或按敌方施事理解。
  rationale: 语法上最直接可读作“他所杀的人”，但句中多个阳性单数代词的先行词并未明说，故不应在正文之外进一步锁定身份。
translation_notes:
  register: 采用现代、庄重而可读的反问句式；刻意保留原文代词所指的含混。以“击打”对应 נכה 的重复，以“杀／被杀”对应 הרג 的重复，避免使用过度古雅或带特定教派解释色彩的措辞。
