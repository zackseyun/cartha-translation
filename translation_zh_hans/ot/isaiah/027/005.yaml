  text: א֚וֹ יַחֲזֵ֣ק בְּ/מָעוּזִּ֔/י יַעֲשֶׂ֥ה שָׁל֖וֹם לִ֑/י שָׁל֖וֹם יַֽעֲשֶׂה לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/005.yaml
  text: Or let him take hold of my strength[a]; let him make peace with me; let him make peace with me.
translation:
  language: zh_hans
  text: 或让他抓住我的力量[a]；让他与我和好；让他与我和好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的力量”也可译作“我的避难所”、“我的保障”或“我的堡垒”。
    reason: מָעוֹז 的语义范围可包括力量、保护及坚固的避难处；此处具体侧重点存在真实的词义歧义。
lexical_decisions:
- source_word: א֚וֹ
  choice: 不然
  rationale: 在上下文中引出与先前审判图景相对的另一条路；“不然”自然表达“或者转而如此”的语气，同时不把逻辑关系说得过满。
- source_word: יַחֲזֵ֣ק
  choice: 让他抓住
  rationale: 保留 חזק 的具体动作意象，并以“让他”体现此处近似祈使、劝告的语气。
- source_word: בְּמָעוּזִּי
  choice: 我的力量
  rationale: מָעוֹז 可指力量、保障、避难处或堡垒；正文采用“我的力量”，使“抓住”保持鲜明的比喻性，其他空间性或保护性含义列入脚注。介词 בְּ 按汉语习惯融入“抓住”这一结构。
- source_word: יַעֲשֶׂ֥ה שָׁל֖וֹם לִ֑י
  choice: 与我和好
  rationale: עשה שׁלום לְ 在此表达与说话者建立和平关系；“与我和好”比逐字译作“向我行和平”自然，也保留关系修复的含义。
- source_word: שָׁל֖וֹם יַֽעֲשֶׂה לִּֽי
  choice: 让他与我和好
  rationale: 原文完整重复“与我和好”的意思以加强语气，译文不予删减或合并。
theological_decisions:
- issue: 第一人称代词所指
  choice: 保留上帝以第一人称直接发出的邀请
  alternative: 弱化第一人称的神圣说话者身份，作较为非人格化的表述
  rationale: 以赛亚书27章的直接语境表明说话者是上帝；译文保留“我的”“与我”，但不在正文中添加超出经文的教义解释。
- issue: 审判与和好的张力
  choice: 将本句译为审判之外所提出的另一条路
  alternative: 把本句解释为无条件宣告已经和好
  rationale: א֚וֹ 引出选择，而近似祈使的动词形式发出劝告或邀请；译文保留这种开放而急切的张力，不把结果预先确定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“抓住我的力量”刻意保留原文的具体比喻；分号及末句重复再现原文的强调。脚注标记[a]已置于正文对应词语之后。
