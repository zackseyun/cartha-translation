  text: אֲנִ֤י יְהוָה֙ נֹֽצְרָ֔/הּ לִ/רְגָעִ֖ים אַשְׁקֶ֑/נָּה פֶּ֚ן יִפְקֹ֣ד עָלֶ֔י/הָ לַ֥יְלָה וָ/י֖וֹם אֶצֳּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/003.yaml
  text: I[a], Yahweh, am its keeper[b]; I water it continually. Lest anyone punish it, I guard it night and day.
translation:
  language: zh_hans
  text: 我，雅威，是看守它的；我时时[a]给它浇水，免得有人侵害[b]它；我昼夜守护它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每时每刻”，也可理解为“一次又一次”。
    reason: לִרְגָעִים字面涉及一个个“时刻”，既可强调持续不断，也可强调反复发生。
  - marker: b
    text: 或译：“惩罚它”或“向它施行惩罚”。这个希伯来语短语也可指攻击、敌意介入或追讨惩罚。
    reason: פקד与על连用的语义范围较宽，正文不宜完全消除其敌对行动与司法惩罚之间的张力。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译神的专名，保留希伯来文本中的立约之名，不以称号替代。
- source_word: נֹצְרָהּ
  choice: 看守它
  rationale: נצר表示看守、护卫和保全；阴性单数后缀承接上下文中的葡萄园。这里用“看守”，既自然，也保留分词所表达的持续照管。
- source_word: לִרְגָעִים
  choice: 时时
  rationale: 字面与“时刻”有关，在本句表示反复而持续地照料；“时时”简洁自然，同时用脚注保留更逐字的表达。
- source_word: אַשְׁקֶנָּה
  choice: 给它浇水
  rationale: שקה的使役式意为使之喝水或浇灌；对象是葡萄园，因此“给它浇水”最符合现代汉语习惯。
- source_word: פֶּן
  choice: 免得
  rationale: 引出所要防止的情形，准确表达预防性的目的或结果。
- source_word: יִפְקֹד עָלֶיהָ
  choice: 有人侵害它
  rationale: פקד与על连用在这里可指敌意介入、攻击或追讨惩罚。结合雅威保护葡萄园的语境，“侵害”最顺畅，同时在脚注保留“惩罚”等司法色彩较强的可能。动词没有明说主语，故以不定的“有人”表达。
- source_word: לַיְלָה וָיוֹם
  choice: 昼夜
  rationale: 以简洁庄重的现代汉语表达“夜与日”这一表示持续不断的两极说法。
- source_word: אֶצֳּרֶנָּה
  choice: 守护它
  rationale: 同样源自נצר；这里是限定动词。“守护”既与前面的“看守”保持词义联系，又避免汉语中机械重复。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”旨在保留其专名性质，而不改译为“主”等称号。
- issue: יִפְקֹד的未明说主语
  choice: 有人
  alternative: 他／仇敌
  rationale: 希伯来文是第三人称阳性单数，却没有明确指出行动者；使用不定主语“有人”保留其开放性，不擅自指定为某一仇敌。
- issue: יִפְקֹד עָלֶיהָ的语义
  choice: 侵害它
  alternative: 惩罚它／向它施行惩罚
  rationale: 该短语既可能带有敌意攻击的意思，也可能具有追讨、惩罚的司法意味。正文依葡萄园受保护的语境采用“侵害”，脚注保留惩罚性理解。
translation_notes:
  register: 采用自然、庄重而清晰的现代标准汉语。“我雅威”保留原文强调性的自称；全句以“看守—浇水—侵害—守护”呈现葡萄园意象和持续照料。正文简洁，脚注交代关键词语的真实歧义。
