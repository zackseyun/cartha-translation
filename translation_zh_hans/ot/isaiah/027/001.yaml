  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֡וּא יִפְקֹ֣ד יְהוָה֩ בְּ/חַרְב֨/וֹ הַ/קָּשָׁ֜ה וְ/הַ/גְּדוֹלָ֣ה וְ/הַֽ/חֲזָקָ֗ה עַ֤ל לִוְיָתָן֙ נָחָ֣שׁ בָּרִ֔חַ וְ/עַל֙ לִוְיָתָ֔ן נָחָ֖שׁ עֲקַלָּת֑וֹן וְ/הָרַ֥ג אֶת הַ/תַּנִּ֖ין אֲשֶׁ֥ר בַּ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/001.yaml
  text: In that day Yahweh will punish Leviathan the fleeing serpent[a], Leviathan the twisting serpent, with his fierce and great and strong sword[c][b]; and he will kill the dragon that is in the sea.
translation:
  language: zh_hans
  text: 在那日，耶和华必用他那严酷、巨大而强劲的剑，惩罚利维坦——那逃窜的蛇[a]，惩罚利维坦——那盘曲的蛇[b]；他必杀死海中的巨龙[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逃窜的蛇”也可译作“迅捷的蛇”。
    reason: lexical_alternative
  - marker: b
    text: “盘曲的蛇”也可译作“弯曲的蛇”。
    reason: lexical_alternative
  - marker: c
    text: “巨龙”也可译作“海怪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知文学中常见的时间公式，同时符合现代汉语的庄重表达。
- source_word: יִפְקֹד
  choice: 惩罚
  rationale: פקד 在本节以 עַל 引出敌对对象，语境明确指施行审判或刑罚；“惩罚”简洁自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，不用称号替代。
- source_word: בְּחַרְבוֹ
  choice: 用他的剑
  rationale: 介词 ב 在此表示工具；保留具体的刀剑与争战意象。
- source_word: הַקָּשָׁה וְהַגְּדוֹלָה וְהַחֲזָקָה
  choice: 严厉、巨大而有力
  rationale: 保留三个并列形容词的累加强调。“严厉”体现 קָשֶׁה 在审判语境中的猛烈性质，“巨大”“有力”分别对应其余两词。
- source_word: לִוְיָתָן
  choice: 利维坦
  rationale: 音译这一诗歌性、神话意象中的专名，不预先把它解释为某个历史或灵界对象。
- source_word: נָחָשׁ בָּרִחַ
  choice: 那逃窜的蛇
  rationale: נָחָשׁ 译作“蛇”；בָּרִחַ 可指逃窜或迅捷，正文采用较直接的“逃窜”，并以脚注保留另一可能。
- source_word: נָחָשׁ עֲקַלָּתוֹן
  choice: 那盘曲的蛇
  rationale: עֲקַלָּתוֹן 表示弯曲、扭曲或盘绕；“盘曲”既贴合蛇的形象，也符合现代汉语诗体。
- source_word: וְהָרַג
  choice: 他必杀死
  rationale: 虽为连接词加完成式，在先知性叙述中延续前句将来意义；“杀死”直接表达动作。
- source_word: הַתַּנִּין
  choice: 巨龙
  rationale: תַּנִּין 在此海洋怪兽的诗歌语境中可指龙或海怪；“巨龙”保留宏大的神话诗歌意象，脚注列出“海怪”。
- source_word: אֲשֶׁר בַּיָּם
  choice: 海中的
  rationale: 以自然简洁的定语结构表达“在海里的”，不把“海”专名化。
theological_decisions:
- issue: 利维坦与海中 תַּנִּין 的指涉
  choice: 保留利维坦、蛇和巨龙的诗歌性怪兽意象，不在正文中将其等同于撒但或某一特定帝国。
  alternative: 可将这些形象解释为混沌邪恶、敌对列国或撒但的象征。
  rationale: 原文呈现古代近东及圣经共有的混沌怪兽意象，却没有在本节明确说明具体所指；保留意象可避免替文本消除其神学张力。
- issue: 两个“利维坦”短语的句法关系
  choice: 把两处都作为“惩罚”的对象，并重复“惩罚”以消除中文误读。
  alternative: 仅在首个对象前出现“惩罚”，依靠并列结构统摄第二个对象。
  rationale: 希伯来文以两个 עַל 短语并列，均受 יִפְקֹד 支配；中文重复谓语能准确显明这一结构，又不改变两者可能是同一形象的不同称谓这一开放性。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。以破折号标明“那逃窜的蛇”和“那盘曲的蛇”是对利维坦的同位说明；通过重复“惩罚”保持希伯来文两个介词短语的并列关系。所有脚注标记均置于相应正文词语之后。
