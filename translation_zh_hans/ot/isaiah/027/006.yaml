base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/006.yaml
  text: In days to come Jacob will take root[a]; Israel will blossom and flower[b], and they will fill the face of the world with fruit.
translation:
  language: zh_hans
  text: 将来的日子，雅各必扎根；以色列必发芽开花，他们的果实必遍满世界。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “果实”也可译作“出产”或“收成”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּאִים
  choice: 将来的日子
  rationale: 这个带定冠词的分词直译可指“那些将要来的人”，但在本节语境中更可能省略了时间名词，构成指向未来的表达。“将来的日子”在现代汉语中自然，也保留了先知预言的前瞻意味。
- source_word: יַשְׁרֵשׁ
  choice: 必扎根
  rationale: 该使役词形既可理解为“使……扎根”，也可在此作近似不及物用法。雅各是主语，并与后面的发芽、开花构成植物生长的连续意象，因此译为“必扎根”。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 保留标准专名译法；这里与“以色列”平行，整体指向群体，但正文不作解释性扩展。
- source_word: יָצִיץ
  choice: 必发芽
  rationale: 该词表示抽芽、萌发或开花；译为“发芽”可与随后“开花”形成自然的生长次序，并避免两个近义词在汉语中重复。
- source_word: וּפָרַח
  choice: 开花
  rationale: 该词具体指植物开花、绽放；“开花”保留了植物意象，比抽象的“兴盛”更贴近原文。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用标准专名译法，与“雅各”构成诗歌平行。
- source_word: וּמָלְאוּ
  choice: 他们必使……遍满
  rationale: 原文由前面的单数集体称谓转为复数动词，把以色列民看作众人。汉语明说“他们”，可自然呈现这一数的转换；“使……遍满”表达以果实充满世界之意。
- source_word: פְנֵי תֵבֵל
  choice: 世界
  rationale: 字面意为“世界的表面”。汉语“遍满世界”已经包含覆盖世界各处的意思，避免生硬照译“世界的表面”，同时保留其普世范围。
- source_word: תְּנוּבָה
  choice: 果实
  rationale: 该名词可指土地的出产、产物或收成。在扎根、发芽、开花的植物意象中，“果实”最连贯，也可承载比喻含义。
theological_decisions:
- issue: 农业比喻中“雅各／以色列”的群体身份
  choice: 正文保留“雅各”和“以色列”，让这两个名字拟人化地代表整体百姓。
  alternative: 解释性地译为“雅各的后裔”或“以色列民”。
  rationale: 原文直接使用两个专名，并通过诗歌平行和随后复数动词显出群体含义。保留专名既维持文学与神学张力，也避免把解释加入正文。
- issue: 复数动词所表达的群体视角
  choice: 译为“他们必使……遍满”，呈现从单数集体名称到复数群体的转换。
  alternative: 省略代词，译为“必使……遍满”，或把“以色列”始终处理为单数。
  rationale: 明确的复数代词忠实反映原文动词数的变化，同时不进一步规定“果实”究竟是人口、属灵成果还是其他具体应验。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“扎根—发芽—开花—果实”保持整节连续的植物生长意象；分号呈现两个平行名称之间的诗歌节奏。“遍满世界”避免生硬直译，同时保留原文的广阔范围。
