id: ISA.27.12
reference: Isaiah 27:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יַחְבֹּ֧ט יְהוָ֛ה מִ/שִּׁבֹּ֥לֶת הַ/נָּהָ֖ר עַד נַ֣חַל מִצְרָ֑יִם וְ/אַתֶּ֧ם תְּלֻקְּט֛וּ לְ/אַחַ֥ד אֶחָ֖ד בְּנֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/012.yaml
  text: And in that day Yahweh will thresh from the channel of the River to the Wadi of Egypt[a], and you will be gathered one by one[d][c][b], O sons of Israel.
translation:
  language: zh_hans
  text: 到那日，雅威必从大河的水流[a]起，直到埃及溪谷[b]，打谷；以色列子孙[d]啊，你们必被逐一收聚[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大河”通常指幼发拉底河；“水流”所译的希伯来词也可指河道或流动的水。
    reason: 说明“大河”的通常所指，并保留שִׁבֹּלֶת的词义范围。
  - marker: b
    text: 或译“埃及溪”。这里的希伯来词通常指旱溪、溪谷或季节性水道，不一定指尼罗河。
    reason: 说明נחל的地貌和水文含义，并避免误认作尼罗河。
  - marker: c
    text: 原文动词带有逐个捡拾、收集的意味，并与前句“打谷”的农业意象相连；“逐一”直译为“一个一个”。
    reason: 保留לָקַט被动式及分配性短语的农业意象和逐个收集的细节。
  - marker: d
    text: 原文直译为“以色列众子”，是对以色列群体的称呼；也可译“以色列人”。
    reason: 交代字面形式与其作为群体称谓的用法。
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的时间公式；译法简洁自然，同时保留其郑重的预告语气。
- source_word: יַחְבֹּט
  choice: 打谷
  rationale: 该动词指击打、脱粒或打落果实。此处保留农业意象，并与后文“逐一拾取”形成连贯图景。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号代替。
- source_word: מִשִּׁבֹּלֶת הַנָּהָר
  choice: 从大河的水道
  rationale: שִׁבֹּלֶת在此地理语境中可指水流或河道；הַנָּהָר作为专称通常指幼发拉底河。正文保留“大河”的源文表达，脚注说明可能所指。
- source_word: עַד נַחַל מִצְרָיִם
  choice: 直到埃及河谷
  rationale: נַחַל常指季节性有水的河谷或旱溪，并不必然指常流大河；“河谷”既符合地貌，也避免误解为尼罗河。
- source_word: תְּלֻקְּטוּ
  choice: 必被……拾取
  rationale: 该被动动词带有收割后逐件捡拾、收集的意味；“拾取”保留这一农业意象，而不只表达一般性的聚集。
- source_word: לְאַחַד אֶחָד
  choice: 逐一
  rationale: 准确表达分配性的“一个一个”，强调每一个都被单独收取。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 这是现代汉语圣经语体中自然而庄重的族群称谓，保留“以色列之子孙”的语源，同时可涵盖整个群体。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 源文使用神的专名。正文用音译“雅威”保留专名性质；不以“主”这一称号替换，也不把后起的混合读音作为正文。
- issue: “打谷”与“拾取”的关系
  choice: 保留两个农业动作及其张力
  alternative: 意译为“筛选并招聚”
  rationale: 源文先说雅威击打或脱粒，随后说以色列人被逐一拾取。正文不把这组意象直接解释为审判、净化或复兴，以免替先知消解其多层含义。
- issue: בְּנֵי יִשְׂרָאֵל 的群体指称
  choice: 以色列子孙
  alternative: 以色列众子；以色列人
  rationale: 此处既有字面上的阳性复数形式，也作为全体以色列的传统族群称谓。采用“子孙”保留血缘与盟约群体色彩，又不武断限定为男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到那日”保留先知宣告的语气；“打谷—拾取”的农业意象不作教义化释义。地理术语选用“大河的水道”和“埃及河谷”，正文自然，细节由脚注补足。
