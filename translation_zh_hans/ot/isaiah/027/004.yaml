base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/004.yaml
  text: I have no wrath[a]. Who would set briers and thorns against me in battle? I would march against them[b]; I would burn them up together.
translation:
  language: zh_hans
  text: 我没有愤怒。谁会在战场上把荆棘和蒺藜摆在我面前？[a]我必向它们进击，[b]把它们一并烧尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谁会在战场上把……摆在我面前”原文直译为“谁会给我荆棘和蒺藜，在战争中？”这里表达挑战，或希望敌手被置于说话者面前。
    reason: lexical_alternative
  - marker: b
    text: “向它们进击”和“把它们烧尽”中的希伯来语后缀均为阴性单数，集合性地指前面的“荆棘和蒺藜”；汉语按意义译作复数“它们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵמָה
  choice: 烈怒
  rationale: 该词表示炽烈的愤怒；“烈怒”既保留强度，也符合庄重、自然的现代汉语表达。
- source_word: אֵין לִי
  choice: 我没有
  rationale: 希伯来语存在句加介词性代词表达领有，译为“我没有”简洁自然，并未补出原文没有明说的对象。
- source_word: מִי יִתְּנֵנִי
  choice: 谁能把……摆在我面前
  rationale: 字面为“谁会给我……”，在此带有挑战或愿敌手出现的语气；此译保留反问形式，同时传达对阵的意味。
- source_word: שָׁמִיר שַׁיִת
  choice: 荆棘和蒺藜
  rationale: 这组词泛指带刺、可焚烧的野生植物；“荆棘和蒺藜”在现代汉语中清楚而具有经文意象。
- source_word: בַּמִּלְחָמָה
  choice: 与我交战
  rationale: 介词短语表示战争或交战的情境；结合“摆在我面前”，译作“与我交战”可自然呈现敌对场景。
- source_word: אֶפְשְׂעָה בָהּ
  choice: 我必向它们进击
  rationale: 动词有迈步、跨进、冲向之意，在战争语境中译作“进击”可兼顾动作和敌对方向。希伯来语阴性单数后缀集合性地回指荆棘与蒺藜，汉语按意义用复数“它们”。
- source_word: אֲצִיתֶנָּה
  choice: 把它们……烧尽
  rationale: 使役词形表示点燃、使之着火；语境指彻底焚毁，故译作“烧尽”。单数后缀仍按集合意义译为“它们”。
- source_word: יַחַד
  choice: 一并
  rationale: 该副词强调同时或整体处理；“一并”简洁地表达全部一起焚烧。
theological_decisions:
- issue: 说话者对葡萄园的态度
  choice: 保留无宾语限定的宣告“我没有烈怒”，按上下文理解为耶和华当前对受保护葡萄园的态度。
  alternative: 译成“我不向葡萄园发怒”，或把它理解为关于上帝从不发怒的绝对陈述。
  rationale: 原文没有明说烈怒所针对的对象；不在正文补入“对葡萄园”，可保留其简洁性和神学张力，同时上下文仍引导读者理解这句话与受保护的葡萄园有关。
- issue: 荆棘蒺藜的指涉
  choice: 保留植物和敌手相交叠的比喻，不明确指定为某一群体。
  alternative: 直接解释为葡萄园中的罪人、列国或上帝的仇敌。
  rationale: 本节将荆棘蒺藜置于交战场景，却未明确说明其所象征的对象；保持意象可避免引入特定神学体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“烈怒”保留原词的强度；“进击”呼应交战语境而不过度扩展为具体军事行动。脚注标记紧跟所解释的语句，纠正咨询层中[a]标记位置与脚注内容不相符的问题。
