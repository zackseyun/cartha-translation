base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/008.yaml
  text: By measure[a], when you sent her away, you contended with her[c][b]; he drove her out with his fierce wind on the day of the east wind.
translation:
  language: zh_hans
  text: 你遣走她时，按分量同她争讼[a][b]；刮东风的日子[c]，他用猛烈的风将她驱逐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按分量”也可译作“有节制地”。原文此词罕见，很可能表示审判受到限制，而不是彻底毁灭。
    reason: lexical_alternative
  - marker: b
    text: 原文使用阴性代词“她”，可能把锡安、以色列或上帝的子民拟人为女子。
    reason: alternative_reading
  - marker: c
    text: “东风”通常指从沙漠吹来的炎热而具有破坏性的风。
    reason: cultural_note
lexical_decisions:
- source_word: בְּסַּאסְּאָה
  choice: 有分寸地
  rationale: 该词罕见，通常理解为按一定分量、有限度地施行审判。“有分寸地”以自然现代汉语表达审判受到节制、并非彻底毁灭的含义，同时在脚注保留其他可能译法。
- source_word: בְּשַׁלְחָהּ
  choice: 你让她离去时
  rationale: שלח带第三人称阴性单数后缀。此译保留“她”及遣离、放逐的意味，不将其具体解释为离婚或灭绝。
- source_word: תְּרִיבֶנָּה
  choice: 与她相争
  rationale: ריב可指争辩、争讼或提出诉讼。“相争”保留其司法性和盟约诉讼色彩，又不强行限定为正式法庭程序。
- source_word: הָגָה
  choice: 将她驱逐
  rationale: 在审判及猛烈风的语境中，此动词表示强力移走或赶出。“驱逐”传达行动的决绝和风吹散的意象。
- source_word: בְּרוּחוֹ
  choice: 用……风
  rationale: רוּחַ可指风、气息或灵；因下文明确提到东风，此处以“风”为最合语境的本义。
- source_word: הַקָּשָׁה
  choice: 猛烈的
  rationale: 该形容词表示严厉、强硬；修饰“风”时，“猛烈的”是自然汉语，并能表达其破坏性力量。
- source_word: בְּיוֹם קָדִים
  choice: 刮东风的日子
  rationale: קדים指来自东方沙漠的风，常带炎热和破坏性。“刮东风的日子”保留原文意象，相关文化含义置于脚注。
theological_decisions:
- issue: 阴性后缀“她”的所指
  choice: 正文保留“她”，不明确指认其对象。
  alternative: 明确译作以色列、锡安，或被拟人化的上帝子民。
  rationale: 上下文可能将雅各、以色列或锡安拟人为女子，但本节没有直接说明所指；保留“她”可维持原文的拟人手法和解释空间。
- issue: 第二人称与第三人称之间的主语转换
  choice: 保留“你……；他……”的转换。
  alternative: 将两句统一译为“你”，或把第三人称处理为非人称诗句。
  rationale: 希伯来文本有明显的人称转换；保留这种突转，尊重其诗歌形式，不擅自调和。
- issue: 审判的程度
  choice: 以“有分寸地”表达有限度的审判。
  alternative: 译为“按分量”或“严格衡量地”，不明确其是否含节制之意。
  rationale: 罕见词的确切语义存在不确定性；正文采用语境中较可能的“节制、有限度”之意，脚注同时保存较直译的选项，避免把它解释成审判的取消。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“有分寸地”避免生硬直译；“相争”保留争讼意味；“猛烈的风”和“驱逐”维持审判意象。正文保留“她”以及“你”转为“他”的突变，不替原文消除指代和人称上的张力。
