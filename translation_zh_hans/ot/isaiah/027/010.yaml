- from: 因为坚固的城孤零零的，居所被撇下，被遗弃，如同旷野；牛犊在那里吃草，在那里躺卧，把城中的枝条吃光。[a]
  to: 因为坚固的城孤寂，居所遭弃置、被遗弃，如同旷野；牛犊在那里吃草，在哪里躺卧，吃尽它的枝条。
  rationale: 修改语体并消除“城中的”所加入的空间限定；“它的枝条”在汉语中保留原文由阴性后缀所形成的简略指代，最近的可指对象为城／居所。删除不必要且带有推测性的脚注，不改变经文含义。
