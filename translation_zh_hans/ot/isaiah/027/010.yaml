id: ISA.27.10
reference: Isaiah 27:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י עִ֤יר בְּצוּרָה֙ בָּדָ֔ד נָוֶ֕ה מְשֻׁלָּ֥ח וְ/נֶעֱזָ֖ב כַּ/מִּדְבָּ֑ר שָׁ֣ם יִרְעֶ֥ה עֵ֛גֶל וְ/שָׁ֥ם יִרְבָּ֖ץ וְ/כִלָּ֥ה סְעִפֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/010.yaml
  text: For the fortified city is solitary[a], a habitation deserted and abandoned like the wilderness; there a calf grazes[b], and there it lies down and strips its branches bare.
translation:
  language: zh_hans
  text: 因为坚固的城孤寂，居所遭弃置、被遗弃，如同旷野；牛犊在那里吃草，在哪里躺卧，吃尽它的枝条。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，表达解释或缘由；现代汉语用“因为”最自然。
- source_word: עִיר בְּצוּרָה
  choice: 坚固的城
  rationale: 指设有防御工事的城邑；译为“坚固的城”简明而保留诗体庄重感。
- source_word: בָּדָד
  choice: 孤零零的
  rationale: 表现城邑孤立、无人居住的荒凉状态，比单用“独自”更符合现代汉语。
- source_word: נָוֶה
  choice: 居所
  rationale: 该词可指住处，也可带有牧场意味；“居所”在这里与城形成同位描述，并保留一定宽泛性。
- source_word: מְשֻׁלָּח וְנֶעֱזָב
  choice: 被撇下，被遗弃
  rationale: 保留两个被动词的并列表达和加强效果，呈现彻底荒废的状态。
- source_word: כַּמִּדְבָּר
  choice: 如同旷野
  rationale: “旷野”既可指荒无人烟、未经耕作之地，又避免把意象缩窄为沙漠。
- source_word: שָׁם יִרְעֶה עֵגֶל
  choice: 牛犊在那里吃草
  rationale: 保留单数“牛犊”；“吃草”是现代汉语中描写牲畜放牧最自然的说法。
- source_word: וְשָׁם יִרְבָּץ
  choice: 在那里躺卧
  rationale: 准确表达牲畜安卧、歇息的动作，并与前句形成平行。
- source_word: וְכִלָּה סְעִפֶיהָ
  choice: 把城中的枝条吃光
  rationale: כלה表示完全耗尽或吃尽；“吃光”保留完整消耗之意。阴性后缀所指并不完全显明，译作“城中的”避免在汉语中把枝条不自然地说成城本身所有。
theological_decisions:
- issue: “坚固的城”具体指哪一座城
  choice: 不在正文中指明
  alternative: 明确解释为某一历史城邑或象征性敌城
  rationale: 本节希伯来文本没有点明城市身份；保持不确定性，避免引入特定释经体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留希伯来诗句中“在那里……在那里……”的复沓，并以“被撇下，被遗弃”重现并列强化。正文中的[a]与脚注对应。
