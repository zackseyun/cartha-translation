  to: 它的枝条[a]枯干时，就被折断；妇女来把它点燃。因为这是一个没有悟性的民族，所以造它的必不怜悯它，塑造它的也不施恩于它。
  rationale: 修改仅为提高源语对应和现代汉语表达：将“拿去生火”改为“把它点燃”，明确原文的集合性单数宾语并保留其燃烧意象；将“不施恩给它”改为自然的“不施恩于它”。其余措辞均可保留。
