id: ISA.27.11
reference: Isaiah 27:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בִּ/יבֹ֤שׁ קְצִירָ/הּ֙ תִּשָּׁבַ֔רְנָה נָשִׁ֕ים בָּא֖וֹת מְאִיר֣וֹת אוֹתָ֑/הּ כִּ֣י לֹ֤א עַם בִּינוֹת֙ ה֔וּא עַל כֵּן֙ לֹֽא יְרַחֲמֶ֣/נּוּ עֹשֵׂ֔/הוּ וְ/יֹצְר֖/וֹ לֹ֥א יְחֻנֶּֽ/נּוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/011.yaml
  text: When its branches[a] dry up, they are broken; women come and set them on fire. For this is a people without understanding; therefore its Maker will not have compassion on it, and the one who formed it will show it no favor.
translation:
  language: zh_hans
  text: 它的枝条[a]枯干时，就被折断；妇女来把它点燃。因为这是一个没有悟性的民族，所以造它的必不怜悯它，塑造它的也不施恩于它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文用复数动词表示枝条“被折断”，但在“把它点燃”处用阴性单数宾语，看来是把枝条或草木视为一个集合体。
    reason: 语法
lexical_decisions:
- source_word: בִּיבֹשׁ
  choice: 枯干时
  rationale: 介词 בְּ 与不定式结构在此表示时间；“枯干”自然承接枝条被折下、用来生火的图景。
- source_word: קְצִירָהּ
  choice: 它的枝条
  rationale: 该词通常可指收割之物，但本句所述之物枯干、被折断并用作燃料；上下文中的具体所指宜译为“枝条”，而非抽象的“收成”。
- source_word: תִּשָּׁבַרְנָה
  choice: 被折断
  rationale: 阴性复数动词指向前面的枝条或植物，中文可借“枝条”的复数集合意义自然表达，无须添加“它们”。
- source_word: נָשִׁים בָּאוֹת
  choice: 妇女来
  rationale: 直译其进行或接续的动作，保留普通妇女拾取枯枝作燃料的审判图景。
- source_word: מְאִירוֹת אוֹתָהּ
  choice: 拿去生火
  rationale: 该短语表示用枯干的植物作燃料。“拿去生火”符合现代汉语，也避免强行统一原文中复数动词与单数集合宾语之间的数差异。
- source_word: לֹא עַם בִּינוֹת הוּא
  choice: 这是一个没有悟性的民族
  rationale: “没有悟性”直接表达缺乏理解和辨识的责备；“民族”适合这里作为集合体的 עַם。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 清楚表达百姓缺乏悟性与随后的审判宣告之间的推论关系。
- source_word: לֹא יְרַחֲמֶנּוּ
  choice: 必不怜悯它
  rationale: רחם 表示怜悯、同情；宾语是阳性单数，回指作为集合体的“民族”，故保留“它”。
- source_word: עֹשֵׂהוּ
  choice: 造它的
  rationale: 保留分词式的神圣称谓及创造者与受造民族之间的关系，同时采用自然简洁的中文。
- source_word: וְיֹצְרוֹ
  choice: 塑造它的
  rationale: יצר 带有塑形、陶造的意象；“塑造”既与“造”平行，又保留两个希伯来动词的区别。
- source_word: לֹא יְחֻנֶּנּוּ
  choice: 不施恩给它
  rationale: חנן 指施予恩惠或眷顾；此译法保留神不施恩的含义，又不额外引入特定教派术语。
theological_decisions:
- issue: 植物意象中的所指与数的转换
  choice: 译作“枝条……被折断；妇女来拿去生火”，并用脚注说明原文的复数动词与单数宾语。
  alternative: 译作“收成枯干时，它就被折断；妇女来用它生火”。
  rationale: 上下文的实际动作更适合枯枝，而希伯来文在复数动作与集合性单数宾语之间转换。正文保持自然，脚注保留真实的语法张力，不把它悄然抹平。
- issue: 创造者施行审判的语言
  choice: 分别保留“造它的”和“塑造它的”，并保留“不怜悯”和“不施恩”的平行表达。
  alternative: 合并为“上帝必不怜悯他们”。
  rationale: 原文有意并列 עשה 与 יצר，也分别使用 רחם 与 חנן。保留这两组词展现创造者向无悟性的民族停止怜悯与施恩的严肃张力，而不加入额外的教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“悟性”比“理解力”更凝练，适合先知书的责备语气；“拿去生火”是普通读者易懂的生活表达。称谓“造它的／塑造它的”保持平行，并避免过度书面化的“制造者／陶成者”。
