revisions:
- from: 所以，雅各的罪债必借此得到赎除；除掉他的罪，所结的全部果效就是：他使祭坛的石头全都像粉碎的白垩石，亚舍拉木柱和香坛必不再立起。[a]
  to: 所以，雅各的罪责必因此得以赎清；而除去他的罪所结出的全部果效就是：当他把祭坛的一切石头砸得像粉碎的白垩石一样时，亚舍拉柱和日像必不再竖立。[a]
  rationale: 修订解决原译的汉语句法问题，以“罪责得以赎清”更自然地表达 עָוֹן 与 יְכֻפַּר 的搭配；将“全部果效”明确连接到“除去他的罪”。后半句以“当他把……砸得……”呈现原文不定式结构，并不界定“他”是雅各还是上帝。对 חַמָּנִים 采用较贴近其常见词义范围的“日像”，同时在脚注中保留“香坛”等解释可能。
