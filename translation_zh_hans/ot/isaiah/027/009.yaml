    rationale: 该词通常与太阳崇拜有关的柱像、像或祭祀设施相连；虽可有“香坛”解释，但不宜在正文中作为无保留的唯一含义。
  - severity: low
    issue: “使祭坛的石头全都像粉碎的白垩石”不够自然，破碎的动作关系未明。
    rationale: בְּשׂוּמוֹ 表示“当/借着他使……成为”；以“把……砸得像……一样”可自然呈现石头被彻底击碎的形象，同时保留未明说的主语。
