source:
  edition: WLC
  text: לָ/כֵ֗ן בְּ/זֹאת֙ יְכֻפַּ֣ר עֲוֺֽן יַעֲקֹ֔ב וְ/זֶ֕ה כָּל פְּרִ֖י הָסִ֣ר חַטָּאת֑/וֹ בְּ/שׂוּמ֣/וֹ כָּל אַבְנֵ֣י מִזְבֵּ֗חַ כְּ/אַבְנֵי גִר֙ מְנֻפָּצ֔וֹת לֹֽא יָקֻ֥מוּ אֲשֵׁרִ֖ים וְ/חַמָּנִֽים־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/009.yaml
  text: 'Therefore by this the guilt of Jacob will be atoned for, and this will be the full fruit of the removal of his sin: when he makes all the stones of the altar like crushed chalkstones, the Asherah poles and incense altars will not stand.'
translation:
  language: zh_hans
  text: 所以，雅各的罪责必因此得以赎清；而除去他的罪所结出的全部果效就是：当他把祭坛的一切石头砸得像粉碎的白垩石一样时，亚舍拉柱和日像必不再竖立。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “日像”所译的希伯来词含义未完全确定，通常指与太阳崇拜有关的柱像、像或祭祀设施；也有译作“香坛”的。
    reason: 保留 חַמָּנִים 的词义和具体形制的不确定性，避免将正文限定为“香坛”。
lexical_decisions:
- source_word: עֲוֹן
  choice: 罪债
  rationale: 此词兼有罪孽及其所招致罪责的含义；本句又与“赎除”搭配，因此译作“罪债”，保留罪与责任相连的意味。
- source_word: יְכֻפַּר
  choice: 得到赎除
  rationale: 这是 כפר 的被动式，表达罪债被遮盖、清除或获得赎罪；“得到赎除”既呈现被动语态，也避免擅自补出施行者。
- source_word: כָּל־פְּרִי
  choice: 全部果效
  rationale: 字面为“全部果子”，在此指除罪所显出的完整结果；“全部果效”保留结果性意象，同时符合现代汉语。
- source_word: אַבְנֵי־גִר מְנֻפָּצוֹת
  choice: 粉碎的白垩石
  rationale: גִּר 指白垩、石灰质材料；分词 מְנֻפָּצוֹת 表示被打碎，故据原文译出其易碎并被粉碎的状态。
- source_word: אֲשֵׁרִים
  choice: 亚舍拉木柱
  rationale: 指与亚舍拉崇拜相关的木制祭祀物；音译专名并补“木柱”，便于普通读者理解。
- source_word: חַמָּנִים
  choice: 香坛
  rationale: 该词所指祭祀设施存在争议，可能是日柱、太阳像或焚香祭坛；上下文为偶像崇拜设施，正文采用较通行且自然的“香坛”，并以脚注保留歧义。
theological_decisions:
- issue: “借此”具体指什么
  choice: 正文保留“借此”，不明确限定其先行内容
  alternative: 明确解释为“借着受惩罚”或“借着摧毁偶像祭坛”
  rationale: בְּזֹאת 的指代可联系上下文的管教，也可联系本节所述清除偶像崇拜的行动；原文具有解释张力，不宜在正文中单一定论。
- issue: 除罪与摧毁偶像祭物之间的关系
  choice: 保留“果效就是”的结果性表达
  alternative: 译为赎罪的条件或手段
  rationale: “这就是……全部果子”更自然地把清除偶像设施呈现为罪被除去的完整成果或明证，而不是直接界定为人靠拆毁祭坛取得赎罪。
- issue: “他使”所指主体
  choice: 保留第三人称“他”，不指明是雅各还是上帝
  alternative: 明确译为“雅各使”或“上帝使”
  rationale: בְּשׂוּמוֹ 的主语在句法和语境上可有不同理解；正文维持原文代词的含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“罪债—赎除”呈现司法责任与赎罪语义的联系；句式尽量保留希伯来文因果与结果结构，同时避免生硬直译。
