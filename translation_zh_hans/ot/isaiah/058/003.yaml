  - severity: medium
    issue: “私欲”将 חֵפֶץ 的语义过度限定为不正当或淫逸的欲望。
    rationale: 该词可指所喜悦的事、意愿、利益或事务。经文语境确有自利性的谴责，但不必在该名词本身加入比原文更窄的道德含义。
  - severity: low
    issue: 脚注a的“性命”可能在现代汉语中被误解为生命受到威胁。
    rationale: 此处 נֶפֶשׁ 是希伯来语“自身／性命”的习语成分；以“自身”说明更不易误解。
