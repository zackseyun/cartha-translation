review_pass:
  verdict: revise
  source_fidelity: 首句的反问结构、禁食和“使自己受苦”的习语，以及后半节对自利行为和催逼劳作者的指控，均得到保留。修订将“刻苦己心”改为更符合现代普通话且更贴近 עִנִּינוּ נַפְשֵׁנוּ 的“使自己受苦”，并避免把 חֵפֶץ 限定为带有过强道德贬义的“私欲”。
  naturalness: “刻苦己心”带有明显的古典宗教汉语色彩，不适合作为现代标准普通话正文；“我们使自己受苦”清楚自然。“追求自己所喜悦的事”比“追求自己的私欲”更自然，也不预断该词必指不正当欲望。
  terminology: “禁食”“看哪”“苛待”适合庄重的先知文本语体。“使自己受苦”保留希伯来习语的自我克制／受苦含义，脚注说明其字面表达及“克己”的替代译法。对于 עַצְּבֵיכֶם 保留“替你们做工的人”的主要理解，并以脚注保存“劳役／工作”的歧义。
