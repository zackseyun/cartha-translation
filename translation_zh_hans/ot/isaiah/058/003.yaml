source:
  edition: WLC
  text: לָ֤/מָּה צַּ֨מְנוּ֙ וְ/לֹ֣א רָאִ֔יתָ עִנִּ֥ינוּ נַפְשֵׁ֖/נוּ וְ/לֹ֣א תֵדָ֑ע הֵ֣ן בְּ/י֤וֹם צֹֽמְ/כֶם֙ תִּמְצְאוּ חֵ֔פֶץ וְ/כָל עַצְּבֵי/כֶ֖ם תִּנְגֹּֽשׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/003.yaml
  text: Why have we fasted[a], and you have not seen? Why have we humbled ourselves, and you do not notice? Look, on the day of your fast you pursue your own pleasure[c][b], and you drive all your laborers hard.
translation:
  language: zh_hans
  text: “我们禁食，你为什么不看见呢？我们使自己受苦[a]，你为什么不理会呢？”看哪，你们禁食的日子追求自己所喜悦的事[b]，并苛待所有替你们做工的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“使我们的自身受苦”；也可译“我们克己”或“我们使自己受苦”。
    reason: lexical_alternative
  - marker: b
    text: 也可译“寻求自己的欲望”或“办理自己的事务”。
    reason: lexical_alternative
  - marker: c
    text: 也可译“压迫你们所有的工人”；原文也可能指“强索一切劳役（或工作）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 引出百姓对上帝的直接质问，符合现代汉语问句。
- source_word: צַּמְנוּ
  choice: 我们禁食
  rationale: 忠实表达 צום 的完成动作；汉语无须强行标示完成体，语境已表明这是带着现实诉求的既往行为。
- source_word: רָאִיתָ
  choice: 不看
  rationale: 保留 ראה“看”的具体意象，并在汉语中自然表达“没有看见或重视”。
- source_word: עִנִּינוּ נַפְשֵׁנוּ
  choice: 我们刻苦己心
  rationale: 较贴近“使自己的性命/自身受苦”这一习语，也能表达与禁食相关的克己、自我降卑；其他可能义置于脚注。
- source_word: תֵדָע
  choice: 不理会
  rationale: ידע 在此与“看”平行，重点并非缺少认知，而是不予关注或认可；“不理会”在现代汉语中清楚自然。
- source_word: הֵן
  choice: 看哪
  rationale: 保留神谕反驳开头的强调与指示功能，同时维持庄重语体。
- source_word: בְּיוֹם צֹמְכֶם
  choice: 你们禁食的日子
  rationale: 明确保留原文的时间短语。
- source_word: תִּמְצְאוּ חֵפֶץ
  choice: 仍追求自己的私欲
  rationale: מצא חפץ 在此可指寻求自己所喜悦、所要之事；“追求自己的私欲”突出自利行为，但不排除“办自己的事务”等理解，故列脚注。补入“仍”自然呈现宗教行为与实际作为的反差。
- source_word: עַצְּבֵיכֶם
  choice: 所有为你们做工的人
  rationale: 结合 נגשׂ，优先理解为受其支配的劳作者；用描述性表达比“劳工”更自然，也避免误作抽象的劳务。
- source_word: תִּנְגֹּשׂוּ
  choice: 苛待
  rationale: 表达催逼、压迫或强索的语义，在劳作者语境中简洁自然。
theological_decisions:
- issue: 后半节社会性指控的对象与性质
  choice: 禁食者一面追逐自身欲求，一面苛待为他们做工的人。
  alternative: 禁食者仍办理自己的事务，并强索全部劳役或工作。
  rationale: חפץ 可指欲求、喜好或事务，עצב 也可能指劳作者或劳役；然而 נגשׂ 的催逼、压迫义与上下文的社会公义主题更支持对劳作者受压迫的理解。译文采用较可能的读法，同时以脚注保存真正的词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知话语的强调色彩；引号区分百姓的抱怨与随后上帝的反驳。脚注标记全部置于正文相应词组之后，并按出现顺序排列。
