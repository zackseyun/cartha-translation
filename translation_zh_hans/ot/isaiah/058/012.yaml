base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/012.yaml
  text: Those from among you will rebuild the ancient ruins[a]; you will raise up the foundations of generation after generation, and you will be called the repairer of the breach[b], the restorer of paths for dwelling.
translation:
  language: zh_hans
  text: 从你中间出来的人必重建古老的废墟；你必重新立起世世代代的根基[a]。你必被称为“修补破口的”， “修复道路、使人得以居住的”[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世世代代”直译为“世代又世代”，也可译作“许多世代以来的根基”。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作“修复供人居住的道路的”或“修复街道、使人得以居住的”。末句很可能指使群体所在之地重新适宜居住。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ מִמְּךָ
  choice: 你中间出来的人必重建
  rationale: 复数动词后接מִמְּךָ，表示从受话者群体中出来的人；结合复兴语境，בנה译为“重建”更准确。
- source_word: חָרְבוֹת עוֹלָם
  choice: 古老的废墟
  rationale: חָרְבוֹת指废墟或荒废之地，עוֹלָם在此指久远年代；“古老的废墟”自然并保留时间深度。
- source_word: מוֹסְדֵי דוֹר וָדוֹר
  choice: 世世代代的根基
  rationale: מוֹסְדֵי意为“根基”，דוֹר וָדוֹר直译“世代又世代”，是连续多代的表达；中文以“世世代代”贴近原文并较自然。
- source_word: תְּקוֹמֵם
  choice: 重新立起
  rationale: 该词具有使之站立、兴起的使役含义；“重新立起”既保留形象，也符合修复根基的上下文。
- source_word: וְקֹרָא לְךָ
  choice: 你必被称为
  rationale: 原文以第三人称单数主动形式作非特指表达，汉语用被动句自然传达别人给予称号之意。
- source_word: גֹּדֵר פֶּרֶץ
  choice: 修补裂口的
  rationale: גֹּדֵר指堵住、围起或修补者，פֶּרֶץ指破口或裂口；此译保留建筑和防护结构受损后被修复的意象。
- source_word: מְשֹׁבֵב נְתִיבוֹת
  choice: 修复道路
  rationale: מְשֹׁבֵב在此有恢复、使复原之意，נְתִיבוֹת指路径或道路；“修复道路”简明呈现复建语境。
- source_word: לָשָׁבֶת
  choice: 使人可以居住
  rationale: 该不定式可表达目的或结果，与前面的道路相连时，意指修复道路，从而使地方重新适宜居住；译文明确这种关系，同时在脚注保留句法上的其他理解。
