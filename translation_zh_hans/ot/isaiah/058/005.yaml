base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/005.yaml
  text: 'Is this the fast that I choose: a day for a man to humble himself? Is it to bow down his head like a reed, and to spread out sackcloth and ashes? Will you call this a fast, and a day acceptable to the LORD?'
translation:
  language: zh_hans
  text: 我所选择的禁食，难道是这样的吗？是叫人一天刻苦己心吗？是叫他像芦苇一样低下头，铺开麻布和灰吗？你会把这称为禁食，称为耶和华所悦纳的日子吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹום
  choice: 禁食
  rationale: 直译宗教性禁食，符合现代汉语圣经语域，并贯穿本节反问。
- source_word: עַנּוֹת ... נַפְשׁוֹ
  choice: 刻苦己心
  rationale: 表达使自己受苦、克制自身之意；“心”在此并非仅指情绪，而代表整个人，保留希伯来语 נֶפֶשׁ 的宽广含义。
- source_word: כְאַגְמֹן
  choice: 像芦苇一样
  rationale: 保留原文以湿地植物弯垂作比喻的具体形象。
- source_word: שַׂק וָאֵפֶר
  choice: 麻布和灰
  rationale: 保留古代哀恸、悔罪和自卑的外在标志，不作解释性扩写。
- source_word: יוֹם רָצוֹן
  choice: 蒙耶和华悦纳的日子
  rationale: רָצוֹן 在此指蒙接纳、得喜悦；采用自然中文表达其关系性含义。
- source_word: יהוה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中通行的专名译法，明确对应四字神名。
theological_decisions:
- issue: 本节是否否定禁食及其外在形式本身
  choice: 以连续反问质疑仅有一天自苦和外在姿态的禁食
  alternative: 译成对所有禁食、麻布和灰的绝对否定
  rationale: 上下文针对的是与不义并存、流于形式的宗教行为；本节措辞本身是反问，不宜扩写为全面的教义判断。
- issue: עַנּוֹת נַפְשׁוֹ 的含义
  choice: 刻苦己心
  alternative: 谦卑自己
  rationale: 动词含使受苦、克己之意；单译“谦卑”可能弱化身体和生活层面的自我克制，但原文也可能涵盖自卑，因此采用传统而含义较宽的表达。
- issue: 末句反问的力度
  choice: 你能把这称为……吗
  alternative: 你会称这为……吗
  rationale: 原文 הֲלָזֶה תִּקְרָא 是反问；“能把这称为”自然传达否定性的挑战，又不添加明确答案。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。保留原文三重反问及“芦苇、麻布和灰”的具体意象；避免过度古雅，也不将上下文中的伦理批判提前扩写进本节。
