source:
  edition: WLC
  text: הֵ֣ן לְ/רִ֤יב וּ/מַצָּה֙ תָּצ֔וּמוּ וּ/לְ/הַכּ֖וֹת בְּ/אֶגְרֹ֣ף רֶ֑שַׁע לֹא תָצ֣וּמוּ כַ/יּ֔וֹם לְ/הַשְׁמִ֥יעַ בַּ/מָּר֖וֹם קוֹלְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/004.yaml
  text: Look[a], you fast for strife and contention, and to strike with a wicked fist[b]. You are not fasting today to make your voice heard on high.
translation:
  language: zh_hans
  text: 看哪，你们禁食，是为了争吵和争斗，为了用拳头行凶[a]。你们今天这样禁食，不能使你们的声音在高处被听见[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“用罪恶的拳头”或“以拳头施行邪恶”。
    reason: lexical_alternative
  - marker: b
    text: “高处”可能指天上的领域，意指使他们的声音在神面前被听见。
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 作为强调性的引语词，引人注意并保留先知责问的力度；“看哪”庄重而仍为现代读者熟悉。
- source_word: לְרִיב וּמַצָּה
  choice: 为了争吵斗殴
  rationale: 两个近义冲突词并列，前者侧重争执，后者可指争斗；译作“争吵斗殴”既避免生硬重复，也保留由口角发展到冲突的语势。
- source_word: תָּצוּמוּ
  choice: 你们禁食
  rationale: 第二人称阳性复数；在责备当前惯常行为的语境中，以现代汉语陈述式直接表达。
- source_word: וּלְהַכּוֹת
  choice: 为了……打人
  rationale: ל加使役不定式表达目的或结果；“打人”自然明确，并与拳头的意象相合。
- source_word: בְּאֶגְרֹף רֶשַׁע
  choice: 挥动邪恶的拳头
  rationale: 保留“邪恶”对拳头或暴力行为的道德定性；加“挥动”使汉语搭配自然，而脚注保留更贴近字面的可能表达。
- source_word: לֹא תָצוּמוּ כַיּוֹם
  choice: 你们今天这样禁食，不能……
  rationale: כַיּוֹם可理解为“像今天这样”，所否定的不是禁食事实本身，而是这种禁食不能达成随后所说的目的；此译保留比较意味及责备逻辑。
- source_word: לְהַשְׁמִיעַ
  choice: 使……传到
  rationale: 希菲尔式表达“使人听见”；与“声音”和“高处”搭配时，“传到”是自然汉语，同时保留使声音被听见的含义。
- source_word: בַּמָּרוֹם
  choice: 高处
  rationale: 直译空间性表达，不直接增补“天上”或“神面前”，以保存原文含蓄性。
- source_word: קוֹלְכֶם
  choice: 你们的声音
  rationale: 直接对应复数领属形式；不限定为祷告、呼求或抗议，以免缩窄语义。
theological_decisions:
- issue: “高处”的所指
  choice: 正文保留“高处”
  alternative: “天上”或“神面前”
  rationale: 上下文很可能暗示让神垂听，但希伯来文没有在本节明确说“神”或“天”；保留空间隐喻，并以脚注说明可能含义。
- issue: 末句否定的范围
  choice: 译为这种禁食不能使声音传到高处
  alternative: “你们今天不是为了使声音传到高处而禁食”
  rationale: 原句的否定位置存在句法张力。结合责备语境，较自然的意思是他们以今日这种方式禁食，无法达到蒙垂听的目的；该译法避免误解成他们主观上根本不想被听见。
translation_notes:
  register: 采用现代、庄重而易懂的先知性责备语气。“看哪”保留突出的警告感；“争吵斗殴”“打人”清楚直接。末句以“今天这样禁食”保留כַיּוֹם的比较意味，并将“高处”的神学指向留在脚注中，不在正文中过度明说。
