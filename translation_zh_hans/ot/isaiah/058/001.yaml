source:
  edition: WLC
  text: קְרָ֤א בְ/גָרוֹן֙ אַל תַּחְשֹׂ֔ךְ כַּ/שּׁוֹפָ֖ר הָרֵ֣ם קוֹלֶ֑/ךָ וְ/הַגֵּ֤ד לְ/עַמִּ/י֙ פִּשְׁעָ֔/ם וּ/לְ/בֵ֥ית יַעֲקֹ֖ב חַטֹּאתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/001.yaml
  text: Cry out with your throat[a]; do not hold back. Raise your voice like a trumpet, and declare to my people their rebellion[b], and to the house of Jacob their sins.
translation:
  language: zh_hans
  text: 你要放开嗓子呼喊，不要抑制；要扬起声音，如同号角[a]，向我的百姓宣告他们的悖逆[b]，向雅各家宣告他们的罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “号角”所译的希伯来文指用于发信号或公开宣告的角号，常指公羊角制成的角号。
    reason: cultural_note
  - marker: b
    text: 也可译作“过犯”；原词常着重指有意反抗上帝的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא בְגָרוֹן
  choice: 放开喉咙呼喊
  rationale: 保留“用喉咙呼喊”的具体身体意象，同时用现代汉语自然表达高声、迫切呼喊的命令。
- source_word: אַל תַּחְשֹׂךְ
  choice: 不要收声
  rationale: 表达不可抑制、不可保留之意，并与前面的高声呼喊自然衔接。
- source_word: כַּשּׁוֹפָר
  choice: 像号角一样
  rationale: שׁוֹפָר特指用于发信号或宣告的角号；“号角”既保留古代器物色彩，也清楚传达响亮宣告的功能。
- source_word: הָרֵם קוֹלֶךָ
  choice: 扬声
  rationale: 简洁、庄重地传达“提高你的声音”，符合先知宣告的语域。
- source_word: וְהַגֵּד
  choice: 宣告
  rationale: 体现直接而有权威的公开揭示，比中性的“告诉”更切合先知性语境。
- source_word: לְעַמִּי
  choice: 向我的百姓
  rationale: 忠实保留第一人称所属关系及其盟约语气。
- source_word: פִּשְׁעָם
  choice: 他们的悖逆
  rationale: פֶּשַׁע常指有意违抗、背叛，不只是一般错误；“悖逆”保留其对抗性的语义。
- source_word: וּלְבֵית יַעֲקֹב
  choice: 向雅各家
  rationale: 保留原文独立的民族与盟约称谓，并与“我的百姓”形成平行。
- source_word: חַטֹּאתָם
  choice: 他们的罪
  rationale: “罪”在现代汉语中可作集合性表达，准确涵盖原文复数所指的诸般罪行。
theological_decisions:
- issue: “我的百姓”与“雅各家”的关系
  choice: 将两者作为平行称谓分别保留
  alternative: 把“雅各家”处理成“我的百姓”的同位说明，合并为一个称谓
  rationale: 原文以两个平行的介词结构分别指向两者，形成加强语势的先知性指控；分别保留可避免抹平修辞，也不额外限定二者的神学关系。
- issue: פֶּשַׁע的道德与盟约含义
  choice: 译为“悖逆”
  alternative: 译为“过犯”
  rationale: “悖逆”更突出原词所含有意反抗、背约的意味；脚注保留较宽泛的词义选择，避免将其语义绝对化。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“放开喉咙呼喊”“不要收声”“扬声”保持原文连续命令的力度；后半句保留两组平行结构，以呈现先知话语的节奏和盟约性称谓。
