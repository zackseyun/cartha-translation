source:
  edition: WLC
  text: וְ/תָפֵ֤ק לָֽ/רָעֵב֙ נַפְשֶׁ֔/ךָ וְ/נֶ֥פֶשׁ נַעֲנָ֖ה תַּשְׂבִּ֑יעַ וְ/זָרַ֤ח בַּ/חֹ֨שֶׁךְ֙ אוֹרֶ֔/ךָ וַ/אֲפֵלָתְ/ךָ֖ כַּֽ/צָּהֳרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/010.yaml
  text: and if you pour yourself out for the hungry and satisfy the afflicted soul[a], then your light will rise in the darkness[b], and your gloom will be like noonday.
translation:
  language: zh_hans
  text: 你若为饥饿的人倾注自己[a]，使困苦的人[b]得饱足，你的光就必在黑暗中升起，你的幽暗必如正午。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“向饥饿的人倾出你的生命（或自己）”。希伯来语“生命”（נֶפֶשׁ）在这里指整个自我或生命。
    reason: lexical_alternative
  - marker: b
    text: 直译为“使困苦的生命得饱足”；这里的“生命”（נֶפֶשׁ）通常指整个受苦的人，而不只是人的非物质部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפֵק ... נַפְשֶׁךָ
  choice: 为……倾注自己
  rationale: פוק 的使役式在这里与 נֶפֶשׁ 构成较特殊的表达，强调为饥饿者付出自己，而不只是施舍某样东西。“倾注自己”既保留自我付出的力度，也符合现代汉语。
- source_word: לָרָעֵב
  choice: 为饥饿的人
  rationale: רָעֵב 在此作名词性形容词，指“饥饿的人”；介词 ל 表示行动所惠及的对象。
- source_word: נַפְשֶׁךָ
  choice: 自己
  rationale: נֶפֶשׁ 在此指整个自我或生命，不宜缩窄为与身体相对的“灵魂”。
- source_word: וְנֶפֶשׁ נַעֲנָה
  choice: 困苦的人
  rationale: נֶפֶשׁ 可指整个人，נַעֲנָה 表示受苦、受压或困顿；译作“困苦的人”自然地表达全人的处境。
- source_word: תַּשְׂבִּיעַ
  choice: 使……得饱足
  rationale: שׂבע 的使役式表示使人吃饱、得到满足；上下文关乎饥饿者，“得饱足”保留了具体而鲜明的意象。
- source_word: וְזָרַח
  choice: 就必……升起
  rationale: 虽采用叙事形态，此处位于条件句的结果部分，表达将来的确定结果；“升起”保留光破暗而出的意象。
- source_word: בַּחֹשֶׁךְ
  choice: 在黑暗中
  rationale: 直译该处所短语，并保留明暗对照。
- source_word: אוֹרֶךָ
  choice: 你的光
  rationale: 保留原文的光之隐喻，不在正文中具体解释为福分、指引或复兴。
- source_word: וַאֲפֵלָתְךָ
  choice: 你的幽暗
  rationale: אֲפֵלָה 指浓重的黑暗；“幽暗”既与前面的“黑暗”有所区别，又保留困境的隐喻。
- source_word: כַּצָּהֳרָיִם
  choice: 如正午
  rationale: צָהֳרָיִם 指正午，以一天中明亮的时刻构成比喻；“如正午”简洁庄重。
theological_decisions:
- issue: 两处 נֶפֶשׁ 的人论含义
  choice: 第一处译作“自己”，第二处译作“人”，并以脚注保留“性命／生命”的字面意象。
  alternative: 两处一律译作“灵魂”或“性命”。
  rationale: 两处的 נֶפֶשׁ 都可指整个自我、生命或人，而非专指与身体分离的非物质部分。按各自句法译成自然汉语，同时用脚注保留原文重复用词，可避免把特定的身心二分观带入经文。
- issue: 应许与条件之间的关系
  choice: 用“你若……就必……”呈现条件及其结果。
  alternative: 将各分句并列为命令与陈述，不明确标出条件关系。
  rationale: 本节承接上文的条件结构，后半句描述前述行动所带来的结果；此译法不进一步界定这种关系的系统神学性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“倾注自己”保留原文自我付出的力度；“困苦的人得饱足”兼顾自然表达与上下文的饥饿意象。正文保留“光、黑暗、幽暗、正午”的诗性对照。
