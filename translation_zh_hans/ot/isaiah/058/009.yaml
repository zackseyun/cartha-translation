  - severity: low
    issue: “必应允”不如“必回应”贴合原文
    rationale: יַעֲנֶה在此与“呼求”相对，基本义为回答。中文“应允”常带答应、准许所求的含义；“回应”更准确且自然。
  - severity: low
    issue: “从你中间”及“不再伸指指人”表达不够自然，并略增语义
    rationale: 中文宜说“从你们中间”；“不再”不是原文显性成分，而“伸指指人”重复且生硬。可将后两项作为“除掉”的并列宾语处理。
