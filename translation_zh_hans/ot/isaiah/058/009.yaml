  naturalness: “从你中间”在现代汉语里不够自然；原文单数后缀可指向作为整体的群体，译为“从你们中间”更自然。将三个宾语以并列方式置于“除掉”之后，可避免“不再伸指指人”中动作重复、搭配生硬的问题。
  terminology: “耶和华”恰当保留四字神名。“轭”应保留其具体而带比喻性的意象，但不宜添加“重”。“恶言”可行，脚注应说明其亦可涵盖邪恶或虚妄的话，避免限定为某一类恶意言论。
