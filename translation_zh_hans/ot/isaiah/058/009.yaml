id: ISA.58.9
reference: Isaiah 58:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָ֤ז תִּקְרָא֙ וַ/יהוָ֣ה יַעֲנֶ֔ה תְּשַׁוַּ֖ע וְ/יֹאמַ֣ר הִנֵּ֑/נִי אִם תָּסִ֤יר מִ/תּֽוֹכְ/ךָ֙ מוֹטָ֔ה שְׁלַ֥ח אֶצְבַּ֖ע וְ/דַבֶּר אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/009.yaml
  text: Then you will call[a], and Yahweh will answer; you will cry for help, and he will say, ‘Here I am.’ If you remove from your midst the yoke, the pointing of the finger, and speaking wickedness[c][b],
translation:
  language: zh_hans
  text: 那时，你呼求，耶和华必回应；你呼救，他必说：“我在这里。”如果你从你们中间除掉轭[a]、指着人的手势[b]和恶言[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轭”原指套在牲畜颈上的轭木；这里比喻压迫性的对待或强加给别人的重担。
    reason: cultural_note
  - marker: b
    text: 原文直译为“伸出手指”，可能指责难、控告或轻蔑人的手势。
    reason: lexical_alternative
  - marker: c
    text: “恶言”也可译作“邪恶的话”或“恶意的话”；原词的含义可包括邪恶、祸害或虚妄。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 这是表示时间和结果的副词，承接上文所述的条件；“那时”在现代汉语中自然，也保留了先后关系。
- source_word: תִּקְרָא
  choice: 你呼求
  rationale: קרא 在向上帝祷告的语境中指发声求告；“呼求”比单纯“呼叫”更符合语境，并与下句“呼救”形成对应。
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 直接音译四字神名 יְהוָה，采用现代中文读者熟悉的传统形式，不以称号代替原文中的专名。
- source_word: יַעֲנֶה
  choice: 必应允
  rationale: ענה 在求告—回应的语境中表示回答；“应允”符合祷告语境，“必”表达未完成式在此处的应许语气。
- source_word: תְּשַׁוַּע
  choice: 你呼救
  rationale: שוע 的加强词干表示因困苦而急切求助；“呼救”简洁地传达求援意味。
- source_word: הִנֵּנִי
  choice: 我在这里
  rationale: 这是表示临在并预备回应的固定表达；“我在这里”自然地保留其直接性和亲近感。
- source_word: אִם תָּסִיר מִתּוֹכְךָ
  choice: 如果你从你中间除掉
  rationale: 保留 אִם 的条件意义，以及 מִתּוֹכְךָ 所表达的群体内部范围；中文第二人称单复数不作原文未明说的限定。
- source_word: מוֹטָה
  choice: 重轭
  rationale: 保留原文“轭、轭木”的具体比喻；加“重”使其压迫性在现代汉语中清楚，但不把比喻直接改写成抽象的“压迫”。
- source_word: שְׁלַח אֶצְבַּע
  choice: 伸指指人
  rationale: 原文直译为“伸出／送出手指”，大概指责难或轻蔑的手势；“伸指指人”既保留形象，也能让现代读者理解。
- source_word: וְדַבֶּר אָוֶן
  choice: 也不再口出恶言
  rationale: אָוֶן 可指邪恶、祸害、虚妄；在“说”之后，“恶言”保留道德上的负面含义，同时不把它过度限定为谎言、毁谤或威胁中的某一种。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用四字神名而非普通称号。正文保留专名，并采用中文中广为人知的“耶和华”；“雅威”更接近一种学术重构的读音，“上主”则会把专名改成称号。
- issue: 上帝回应的条件性
  choice: 保留“如果”引出的条件句
  alternative: 译作“当你……的时候”
  rationale: אִם 通常引出真实条件。保留“如果”可维持本节中应许与悔改要求之间的张力，而不把条件弱化为单纯时间关系。
- issue: מוֹטָה 的社会伦理含义
  choice: 正文保留“轭”的比喻
  alternative: 直接译为“压迫”或“强加给人的重担”
  rationale: 上下文显示这是对压迫性待人的谴责，但原文有意使用具体比喻；保留“轭”能同时保存诗性和社会伦理力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前半节用“呼求／呼救”和“应允／我在这里”保持希伯来诗句的平行与递进；后半节保留“轭”和“伸指”的具体意象。按所给经节范围，末尾逗号提示条件句在下一节继续。
