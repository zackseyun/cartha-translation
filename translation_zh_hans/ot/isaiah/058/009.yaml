  to: 那时，你呼求，耶和华必回应；你呼救，他必说：“我在这里。”如果你从你们中间除掉轭[a]、指着人的手势[b]和恶言[c]，
  rationale: 修订删除原文未明说的“重”，以“回应”对应“呼求”，并把末句三个名词性／动名性成分并列在“除掉”之下。这样既保留希伯来文的具体意象和条件性，也使现代普通话更顺畅。末尾逗号保留，因为本节的条件句延续至下一节。
