  text: אִם תָּשִׁ֤יב מִ/שַּׁבָּת֙ רַגְלֶ֔/ךָ עֲשׂ֥וֹת חֲפָצֶ֖י/ךָ בְּ/י֣וֹם קָדְשִׁ֑/י וְ/קָרָ֨אתָ לַ/שַּׁבָּ֜ת עֹ֗נֶג לִ/קְד֤וֹשׁ יְהוָה֙ מְכֻבָּ֔ד וְ/כִבַּדְתּ/וֹ֙ מֵ/עֲשׂ֣וֹת דְּרָכֶ֔י/ךָ מִ/מְּצ֥וֹא חֶפְצְ/ךָ֖ וְ/דַבֵּ֥ר דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/013.yaml
  text: If you turn back your foot from the Sabbath[a], from doing your own pleasure on my holy day, and call the Sabbath a delight, the holy thing of Yahweh honorable, and honor it by not going your own ways, nor seeking your own pleasure, nor speaking a word[c][b],
translation:
  language: zh_hans
  text: 你若在安息日收住脚步，不在我的圣日做自己所喜好的事，又称安息日为喜乐，称雅威的圣日为尊贵，并尊重它[a]，不走自己的道路，不寻求自己的喜好[b]，也不说一句话[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并尊崇他”，把这个代词理解为指雅威，而不是安息日。
    reason: alternative_reading
  - marker: b
    text: “自己的喜好”也可译为“自己的愿望”或按本节语境译为“自己的事务”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“说一句话”。这里可能是指不说日常、闲散或只顾自己的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב מִשַּׁבָּת רַגְלֶךָ
  choice: 你若在安息日收住脚步
  rationale: 保留“脚步”的具体意象；“收住”表达使脚转回、克制行动之意。“在安息日”按上下文自然表达因尊重安息日而停止践踏或违犯它，避免生硬的“使脚离开安息日”。
- source_word: עֲשׂוֹת חֲפָצֶיךָ
  choice: 做自己所喜好的事
  rationale: חפץ可指喜好、愿望或事务。此处采用“所喜好的事”，既通顺，也保留个人意愿与自我追求的含义。
- source_word: בְּיוֹם קָדְשִׁי
  choice: 在我的圣日
  rationale: 直接保留第一人称所属关系和该日分别为圣的性质。
- source_word: וְקָרָאתָ לַשַּׁבָּת עֹנֶג
  choice: 称安息日为喜乐
  rationale: 以“称……为……”对应希伯来语结构；עֹנֶג译作“喜乐”，自然而庄重。
- source_word: לִקְדוֹשׁ יְהוָה מְכֻבָּד
  choice: 称雅威的圣日为尊贵
  rationale: 该短语简练且带同位关系；上下文表明所指仍是安息日，故补出“日”以符合现代汉语，同时以“尊贵”表达应受尊重。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的现代汉语音译，而不以称号替代。
- source_word: וְכִבַּדְתּוֹ
  choice: 又尊重它
  rationale: 阳性单数代词在语流中最自然地回指安息日或圣日；“尊重”也与前面的“尊贵”保持词义联系。代词亦可能指雅威，故列入脚注。
- source_word: מֵעֲשׂוֹת דְּרָכֶיךָ
  choice: 不走自己的道路
  rationale: 保留“道路”的比喻，并以现代汉语表达不按自己的行动方式行事。
- source_word: מִמְּצוֹא חֶפְצְךָ
  choice: 不寻求自己的喜好
  rationale: מצא与חפץ的组合可表达追求自己想要的事；“喜好”也维持本节两次חפץ之间的词汇呼应。
- source_word: וְדַבֵּר דָּבָר
  choice: 不随意说话
  rationale: 原文直译为“不说话／不说一句话”，语义十分简练；结合并列的自我追求，“随意”在正文中传达普通、自我导向或无益言谈的可能含义，同时以脚注保留原文形式与解释范围。
theological_decisions:
- issue: וְכִבַּדְתּוֹ中代词的指向
  choice: 正文按代词回指安息日或圣日，译为“尊重它”。
  alternative: 代词也可能回指雅威，译为“尊崇他”。
  rationale: 本节语流持续以安息日为对象：称它为喜乐，称雅威的圣日为尊贵，继而尊重它。这个衔接较自然，但希伯来语阳性单数代词在语法上也容许回指雅威，因此用脚注保留歧义。
- issue: 安息日禁戒言语的范围
  choice: 正文译为“不随意说话”，不把它限定为某一特定种类的话。
  alternative: 可理解为不说日常、闲散、自利的话，或不谈自己的事务。
  rationale: 原文措辞极简，未明确限定言语类别；正文避免将它发展成特定宗派规则，脚注则说明上下文可能赋予的范围。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“收住脚步”保留原文意象而不过度解释；分号呈现三个相连的条件成分。本节句末在原文语境中仍接下一节，因此保留逗号。所有脚注标记均置于正文相应词句之后。
