  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָ֣ז יִבָּקַ֤ע כַּ/שַּׁ֨חַר֙ אוֹרֶ֔/ךָ וַ/אֲרֻכָתְ/ךָ֖ מְהֵרָ֣ה תִצְמָ֑ח וְ/הָלַ֤ךְ לְ/פָנֶ֨י/ךָ֙ צִדְקֶ֔/ךָ כְּב֥וֹד יְהוָ֖ה יַאַסְפֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/008.yaml
  text: Then your light will break forth like the dawn[a], and your healing will spring up quickly; your righteousness will go before you[c][b], and the glory of Yahweh will be your rear guard.
translation:
  language: zh_hans
  text: 那时，你的光必如晨曦迸发，你的医治[a]必迅速萌发；你的公义[b]必行在你前面，耶和华的荣耀必作你的后卫[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “医治”也可译作“复原”或“恢复”。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“公正”，在此也可能含有“昭雪”的意味。
    reason: lexical_alternative
  - marker: c
    text: 或译：“必从后面收聚你。”原文动词的基本意思是“聚集、收拢”，在这里描绘从后方收拢并护卫队伍。
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּקַע
  choice: 迸发
  rationale: 该词的尼法勒词形描绘破开、涌现；以“光”为主语时，“迸发”自然保留了光冲破黑暗的鲜明意象。
- source_word: כַּשַּׁחַר
  choice: 如晨曦
  rationale: שַׁחַר 指黎明或破晓；“晨曦”既准确又与“光”自然搭配，并保留原文的明喻。
- source_word: אוֹרֶךָ
  choice: 你的光
  rationale: 直译 אוֹר 及其第二人称单数所属后缀。
- source_word: אֲרֻכָתְךָ
  choice: 你的医治
  rationale: אֲרֻכָה 可指伤处愈合，也可延伸指复原、恢复；正文采用较为具体而仍可用于比喻的“医治”，其他可能性列入脚注。
- source_word: מְהֵרָה
  choice: 迅速
  rationale: 准确表达动作发生得快；语体庄重而符合现代汉语。
- source_word: תִצְמָח
  choice: 萌发
  rationale: צמח 的基本意象是发芽、生长；“萌发”使“医治”与植物生长的原文隐喻得以保留。
- source_word: וְהָלַךְ לְפָנֶיךָ
  choice: 必行在你前面
  rationale: 保留 הלך“行走”和 לפני“在……前面”的空间图景，而不额外限定为引导或保护。
- source_word: צִדְקֶךָ
  choice: 你的公义
  rationale: צֶדֶק 可涵盖公义、正直、公正或得以昭雪；“公义”保留其道德与盟约层面的宽广含义，避免仅限于社会司法。
- source_word: כְּבוֹד יְהוָה
  choice: 耶和华的荣耀
  rationale: 忠实表达构造关系；“耶和华”是现代中文圣经语境中对神圣四字名的通行音译，作为专名而非以头衔替代。
- source_word: יַאַסְפֶךָ
  choice: 必作你的后卫
  rationale: אסף 的基本义是聚集、收拢；在“前面／后面”的行进图景中，该词惯用于从后方收拢并护卫队伍。“作你的后卫”自然表达语境功能，字面含义则保留在脚注中。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神圣四字名而非一般称号。中文正文采用长期通行且普通读者易识别的专名“耶和华”，不以“主”替代；“雅威”是另一种学术性拟音。
- issue: צִדְקֶךָ 是“公义”还是“公正／昭雪”
  choice: 你的公义
  alternative: 你的公正；使你得以昭雪的正义
  rationale: 本章具有鲜明的社会公正背景，但此处该词被人格化，行在受话者前面，并与耶和华的荣耀形成前后呼应。“公义”能保留道德、关系和正义等多重意味，不把经文缩窄为单一层面。
- issue: יַאַסְפֶךָ 应按字面“收聚你”还是按语境“作你的后卫”
  choice: 必作你的后卫
  alternative: 必从后面收聚你
  rationale: 动词本义为“聚集、收拢”，但在行军或结队前行的图景中表示从后方收拢队伍，具有后卫作用。正文采用自然的语境义，脚注保留字面表达，避免掩盖原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。以“迸发”“萌发”保留原文连续而鲜明的破晓与生长意象；分号呈现两组彼此呼应的应许。“后卫”保留前后行进的空间结构，同时以脚注交代希伯来语动词较为字面的“收聚”含义。
