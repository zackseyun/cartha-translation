base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/007.yaml
  text: Is it not to share your bread with the hungry[a], and bring the poor who are cast out into your house? When you see the naked, to cover him[b], and not hide yourself from your own flesh?
translation:
  language: zh_hans
  text: 不就是把你的饼分给饥饿的人，把贫穷、流离失所的人[a]接到你家里吗？看见赤身的人，就给他衣服蔽体；对自己的骨肉[b]，不可躲避不顾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流离失所的人”所对应的希伯来词含义较难确定，可能指被赶逐、漂泊或无处栖身的贫困者。
    reason: lexical_alternative
  - marker: b
    text: “自己的骨肉”直译为“你自己的肉”。这可指自己的亲属，也可能进一步唤起对同为血肉之人的责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹס
  choice: 分给
  rationale: 原词有掰开、分开的具体含义；“把饼分给”既保留动作形象，也自然表达周济之意。
- source_word: לָרָעֵב לַחְמֶךָ
  choice: 把你的饼分给饥饿的人
  rationale: 保留“饼”的具体意象，并清楚标明饥饿者是领受者。
- source_word: עֲנִיִּים מְרוּדִים
  choice: 困苦无家的人
  rationale: עֲנִיִּים 指贫困、受苦者；含义较难确定的 מְרוּדִים 可能指被赶逐、漂泊而无处栖身的人。“困苦无家”自然呈现本句收留住宿的语境，同时不限定为现代社会类别。
- source_word: תָּבִיא בָיִת
  choice: 接到你家里
  rationale: 表达把人带入家中并予以接待的意思；“接到”符合现代汉语的款待语境。
- source_word: כִּי תִרְאֶה עָרֹם
  choice: 看见赤身的人
  rationale: כִּי 在此引出实际遇见的情形；עָרֹם 作名词性用法，指没有衣物遮体的人。
- source_word: וְכִסִּיתוֹ
  choice: 就给他遮体
  rationale: 保留“遮盖”的基本义，同时在汉语中清楚表达给赤身者衣物蔽体。
- source_word: וּמִבְּשָׂרְךָ
  choice: 对自己的骨肉
  rationale: “骨肉”是现代汉语中自然且有尊严的亲属隐喻，保留 בָּשָׂר“肉身”所表达的亲缘关系；其范围仍可能带有更广泛的人际伦理意味。
- source_word: לֹא תִתְעַלָּם
  choice: 不可躲避不顾
  rationale: Hitpael 形式有把自己藏起来、避而不见的意味；“躲避不顾”兼顾动作形象与实际含义。
theological_decisions:
- issue: “自己的骨肉”的范围
  choice: 正文保留亲缘性的身体隐喻，并以脚注说明范围可能不只限于家人。
  alternative: 译作“自己的家人”或泛化为“同胞”。
  rationale: 原文首先可指血亲，却也可能借共同的肉身关系唤起更广的责任；不把其伦理范围过早限定或扩大。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“不就是……吗”承接原文反问；并列动作保持先知话语的直接力度。正文中的脚注标记置于相关分句末。
