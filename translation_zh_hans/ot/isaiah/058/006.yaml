id: ISA.58.6
reference: Isaiah 58:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/ל֣וֹא זֶה֮ צ֣וֹם אֶבְחָרֵ/הוּ֒ פַּתֵּ֨חַ֙ חַרְצֻבּ֣וֹת רֶ֔שַׁע הַתֵּ֖ר אֲגֻדּ֣וֹת מוֹטָ֑ה וְ/שַׁלַּ֤ח רְצוּצִים֙ חָפְשִׁ֔ים וְ/כָל מוֹטָ֖ה תְּנַתֵּֽקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/006.yaml
  text: 'Is not this the fast that I choose: to loosen the chains of wickedness[a], to untie the cords of the yoke, to send the oppressed out free[c][b], and to tear off every yoke?'
translation:
  language: zh_hans
  text: 我所选择的禁食，不正是要解开邪恶的锁链[a]，松开轭上的绑带，让受压迫的人[b]自由离去，并扯断一切的轭[c]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “锁链”也可译作“捆绑”或“镣铐”。
    reason: lexical_alternative
  - marker: b
    text: “受压迫的人”直译可作“被压碎的人”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文两次使用“轭”，以实体束缚的图像强调必须彻底除去压迫。
    reason: cultural_note
lexical_decisions:
- source_word: צ֣וֹם
  choice: 禁食
  rationale: 指宗教性的禁食实践；“禁食”是现代汉语中准确、自然且庄重的对应词。
- source_word: אֶבְחָרֵהוּ
  choice: 我所选择的
  rationale: בּחר 的基本义是“选择”；这里表达上帝所认可、所选定的禁食方式，不扩展为“喜悦”。
- source_word: פַּתֵּחַ חַרְצֻבּוֹת רֶשַׁע
  choice: 解开邪恶的锁链
  rationale: 保留解除实体束缚的鲜明意象；רֶשַׁע 译为“邪恶”，兼顾道德败坏与这里具体的压迫情境。
- source_word: הַתֵּר אֲגֻדּוֹת מוֹטָה
  choice: 松开轭上的绑带
  rationale: אֲגֻדּוֹת 表示捆绑物或带子；译作“轭上的绑带”既呈现结构关系，也避免与前一分句的“锁链”混同。
- source_word: וְשַׁלַּח רְצוּצִים חָפְשִׁים
  choice: 让受压迫的人自由离去
  rationale: “让……离去”保留 שׁלח“送走、放行”的动词力度，“自由”对应 חָפְשִׁים；רְצוּצִים 按语境译为“受压迫的人”，脚注保留更字面的“被压碎的人”。
- source_word: וְכָל מוֹטָה תְּנַתֵּקוּ
  choice: 并扯断一切的轭
  rationale: נָתק 有拉开、扯断之意；“扯断”比泛化的“除去”更能保留强力拆毁压迫工具的图像，并保留 מוֹטָה“轭”的重复。
theological_decisions:
- issue: 上帝所选择之“禁食”的性质
  choice: 将其呈现为解除捆绑、释放受压迫者等具体行动
  alternative: 将其概括为内在敬虔或一般性的善意
  rationale: 希伯来文用一连串具体动作说明这种禁食；译文不把它抽象化，也不否认上下文中的宗教实践背景。
- issue: 压迫意象的处理
  choice: 保留两次出现的“轭”以及锁链、绑带、扯断等实体束缚图像
  alternative: 统一意译为“重担”或“压迫”
  rationale: 原文刻意以身体受制的图像表达不义；保留这些意象能呈现先知话语的力度及重复强调。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“不正是要……吗”自然承载原文的反问结构；用并列动词保持先知话语的节奏和具体行动导向。
