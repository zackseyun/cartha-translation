source:
  edition: WLC
  text: אָ֗ז תִּתְעַנַּג֙ עַל יְהוָ֔ה וְ/הִרְכַּבְתִּ֖י/ךָ עַל בָּ֣מֳותֵי אָ֑רֶץ וְ/הַאֲכַלְתִּ֗י/ךָ נַחֲלַת֙ יַעֲקֹ֣ב אָבִ֔י/ךָ כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/014.yaml
  text: then you will delight yourself in Yahweh[a], and I will make you ride on the heights of the earth; I will feed you with the inheritance of Jacob your father[b], for the mouth of Yahweh has spoken.
translation:
  language: zh_hans
  text: 那时，你必以耶和华为乐；我必使你登临大地的高处[a]，使你享用你先祖雅各的产业[b]，因为耶和华亲口说了这话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“这地”；“高处”是原文保留的诗性画面，可含尊荣、安全、胜利或兴盛之意，但本节没有限定为其中一种。
    reason: 词义与意象说明
  - marker: b
    text: 原文直译为“你父亲雅各的产业”；“父亲”在这里是盟约家族用语，指人民的先祖雅各。
    reason: 文化与盟约语言说明
lexical_decisions:
- source_word: תִּתְעַנַּג עַל
  choice: 以……为乐
  rationale: 反身词干表达以某对象为喜乐、从中得到满足；“以耶和华为乐”自然、庄重，也保留其个人与盟约关系的指向。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式呈现四字神名，而不以“主”这一称号替代。
- source_word: וְהִרְכַּבְתִּיךָ
  choice: 我必使你驰骋
  rationale: 保留使役词形“使你乘行”的含义；“驰骋”在中文中自然地传达登临高处、自由前行的诗性画面，但不限定为军事征服。
- source_word: בָּמוֹתֵי אָרֶץ
  choice: 大地的高处
  rationale: 保留“高处”的空间隐喻，不把它解释为祭祀邱坛、军事胜利或单纯地理位置；אָרֶץ在此无定指，译作“大地”较能保持表达的广度。
- source_word: וְהַאֲכַלְתִּיךָ
  choice: 使你享用
  rationale: 原文使役式直译为“使你吃”；因宾语是“产业”，中文用“享用”更自然，同时保留蒙赐并实际享受盟约福分之意。
- source_word: נַחֲלַת יַעֲקֹב אָבִיךָ
  choice: 你先祖雅各的产业
  rationale: נַחֲלָה译为“产业”，保留土地、承受之分与盟约福分的内涵；אָבִיךָ字面为“你父亲”，在这里指民族先祖，正文采用现代中文明确表达，脚注说明原文措辞。
- source_word: כִּי פִּי יְהוָה דִּבֵּר
  choice: 因为这是耶和华亲口说的
  rationale: “亲口说的”自然保留原文“耶和华的口说了”的庄严先知公式及其权威性；完成式在中文中用“说的”表达已经发出的确定宣告。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名而非称号。中文正文采用广为普通读者认识、并明确作为专名的“耶和华”；不以“上主”替代专名，也不借此处理有关发音重构的争议。
- issue: “大地的高处”的含义
  choice: 保留高处的诗性隐喻
  alternative: 解释为征服大地、在应许之地兴盛，或宗教性的邱坛
  rationale: 上下文可使该画面包含尊荣、安全、胜利或兴盛等盟约福分，但本节没有限定单一含义，因此不在正文中加以窄化。
- issue: “雅各，你父亲”的盟约家族语言
  choice: 正文译为“你先祖雅各”，脚注保留字面信息
  alternative: 直译为“你父亲雅各”
  rationale: 说话对象是雅各后裔的群体；“先祖”准确传达现代中文中的所指，而脚注让读者看见原文以“父亲”表达共同血缘与盟约身份。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“那时……必……”延续条件应许的语气；用“大地的高处”保留希伯来诗歌意象，用“亲口说的”保留宣告公式，同时避免生硬逐字翻译。所有脚注标记均已置入正文。
