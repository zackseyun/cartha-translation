id: ISA.58.11
reference: Isaiah 58:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָחֲ/ךָ֣ יְהוָה֮ תָּמִיד֒ וְ/הִשְׂבִּ֤יעַ בְּ/צַחְצָחוֹת֙ נַפְשֶׁ֔/ךָ וְ/עַצְמֹתֶ֖י/ךָ יַחֲלִ֑יץ וְ/הָיִ֨יתָ֙ כְּ/גַ֣ן רָוֶ֔ה וּ/כְ/מוֹצָ֣א מַ֔יִם אֲשֶׁ֥ר לֹא יְכַזְּב֖וּ מֵימָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/011.yaml
  text: And Yahweh will guide you continually[a], and satisfy your soul in parched places, and strengthen your bones; and you will be like a well-watered garden[c][b], and like a spring of water whose waters do not fail.
translation:
  language: zh_hans
  text: 耶和华必不断引导你；在干旱焦灼之地[a]，使你得饱足，也使你的骨头强健[c]。你必像得到充分浇灌的园子，又像泉源；它的水永不枯竭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “干旱焦灼之地”也可译作“干旱之处”或“被晒焦之地”。原文指炎热、干涸的环境。
    reason: lexical_alternative
  - marker: b
    text: 直译为“它的水不说谎”，意思是这水不会落空或断流，使人失望。
    reason: lexical_alternative
  - marker: c
    text: “使你的骨头强健”也可译作“使你的骨头恢复活力”。这里所用的希伯来动词含义较难确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחֲךָ
  choice: 必……引导你
  rationale: נחה通常指带领、引导；这里表达耶和华持续指引人的应许。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名号音译，不以“主”这一称号代替原文专名。
- source_word: תָּמִיד
  choice: 常常
  rationale: 表达持续、恒常之意，同时保持自然庄重的现代汉语。
- source_word: וְהִשְׂבִּיעַ ... נַפְשֶׁךָ
  choice: 使你得饱足
  rationale: שבע的使役式表示使需要得到充分满足；נפש在此可指人自身、生命或欲求，因此不将其缩窄为后期意义上的“灵魂”。
- source_word: בְּצַחְצָחוֹת
  choice: 在焦旱之地
  rationale: 该词描写被烈日晒灼的干旱环境；“焦旱之地”保留诗歌意象而不过度限定为某次旱灾。
- source_word: וְעַצְמֹתֶיךָ יַחֲלִיץ
  choice: 使你的骨头强健
  rationale: חלץ在这里词义较难确定，语境指向强健或恢复活力；译文保留“骨头”这一具体身体意象。
- source_word: כְּגַן רָוֶה
  choice: 像水分充足的园子
  rationale: רוה指充分得水、饱受灌溉；此译自然呈现园子丰润繁茂的形象。
- source_word: וּכְמוֹצָא מַיִם
  choice: 像一道水泉
  rationale: מוֹצָא מַיִם是水流出的源头；“水泉”简洁保留自然涌流的水源意象。
- source_word: אֲשֶׁר לֹא יְכַזְּבוּ מֵימָיו
  choice: 它的水永不枯竭
  rationale: כזב本义与说谎、落空有关，用于水源时表示水不会令人失望、不会断流；中文以“永不枯竭”传达其实际意象。
theological_decisions:
- issue: 神圣名号יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是现代中文圣经传统中广为人知的专名形式，既保留专名功能，也避免用称号“主”取代原文。
- issue: נפש的人论含义
  choice: 使你得饱足
  alternative: 使你的心灵得饱足；使你的生命得满足
  rationale: נפש语义可涵盖自我、生命和欲求；省去容易被理解为独立非物质实体的“灵魂”，可避免把原文的整体性含义过早限定。
- issue: חלץ在“骨头”一语中的罕见用法
  choice: 使你的骨头强健
  alternative: 使你的骨头恢复活力
  rationale: 上下文应许人在困乏中复苏，但该动词含义不完全确定；正文采用较宽泛的“强健”，并用脚注保留“恢复活力”的可能。
translation_notes:
  register: 采用自然、庄重且易懂的现代标准汉语。正文保持希伯来诗歌中由焦旱转向丰沛水源的意象，并以两个并列比喻收束。标点按中文句法分句；脚注标记均紧随所说明的词语。
