id: ISA.58.2
reference: Isaiah 58:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אוֹתִ֗/י י֥וֹם יוֹם֙ יִדְרֹשׁ֔וּ/ן וְ/דַ֥עַת דְּרָכַ֖/י יֶחְפָּצ֑וּ/ן כְּ/ג֞וֹי אֲשֶׁר צְדָקָ֣ה עָשָׂ֗ה וּ/מִשְׁפַּ֤ט אֱלֹהָי/ו֙ לֹ֣א עָזָ֔ב יִשְׁאָל֨וּ/נִי֙ מִשְׁפְּטֵי צֶ֔דֶק קִרְבַ֥ת אֱלֹהִ֖ים יֶחְפָּצֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/002.yaml
  text: Yet day after day they seek me[a], and they delight to know my ways, as if they were a nation that practiced righteousness and had not forsaken the justice of its God. They ask me for righteous judgments; they delight in the nearness of God.
translation:
  language: zh_hans
  text: 然而，他们天天寻求我，喜爱认识我的道路，仿佛他们是一个行公义、没有离弃自己上帝公正法则的国民。他们向我求问公义的判决，乐意亲近上帝[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以上帝的临近为乐。”希伯来语可指人亲近上帝，也可指上帝临近。
    reason: 原文短语קִרְבַת אֱלֹהִים在行动方向上有真实歧义。
lexical_decisions:
- source_word: וְאוֹתִי
  choice: 然而……我
  rationale: 连词在上下文中带出与前节斥责相对的转折；“然而”自然呈现这一语气，并保留“我”为寻求的对象。
- source_word: יוֹם יוֹם יִדְרֹשׁוּן
  choice: 他们天天寻求我
  rationale: “日、日”是分配性重复，表示持续、惯常的行动；“天天”在现代汉语中简洁自然，并保留重复所强调的频繁性。דרשׁ在此可指敬拜中寻求或求问上帝，译作“寻求”可涵盖两者。
- source_word: וְדַעַת דְּרָכַי יֶחְפָּצוּן
  choice: 乐意明白我的道路
  rationale: 原文表达对认识上帝道路的喜悦或愿望；“乐意明白”兼顾意愿、认知和喜悦，且符合现代汉语表达。
- source_word: כְּגוֹי אֲשֶׁר
  choice: 仿佛是……的国民
  rationale: 结合上下文，这一比较具有讽刺性；“仿佛是”使现代读者能听出先知揭露其表里不一的语气，而不增加原文以外的判断。
- source_word: צְדָקָה עָשָׂה
  choice: 行公义
  rationale: 这是希伯来语中“施行公义”的惯用搭配；“行公义”既简洁庄重，又保留实际践行的伦理含义。
- source_word: וּמִשְׁפַּט אֱלֹהָיו לֹא עָזָב
  choice: 没有离弃他们上帝公正的法则
  rationale: מִשְׁפָּט可指公正、判决、典章或秩序。此处既涉及上帝公义的要求，也与下文“判决”呼应；译作“公正的法则”保留规范性，并避免把它仅限于抽象的正义概念。
- source_word: יִשְׁאָלוּנִי
  choice: 他们向我求问
  rationale: 该动词可表示询问或求取；“向我求问”比单纯“问我”更能呈现宗教求询的语境，同时保持自然。
- source_word: מִשְׁפְּטֵי צֶדֶק
  choice: 公义的判决
  rationale: 复数结构可能指符合公义的司法裁决或神圣裁定；“公义的判决”保留מִשְׁפָּט的裁决含义，也与前文“行公义”形成词义联系。
- source_word: קִרְבַת אֱלֹהִים
  choice: 亲近上帝
  rationale: קִרְבָה可表示临近、接近或亲近。这里可理解为人来到上帝面前，也可能指上帝的临近；正文采用自然且符合宗教行动语境的“亲近上帝”，脚注保留另一种真实可能。
- source_word: יֶחְפָּצוּן
  choice: 乐意
  rationale: חפץ兼有喜爱、乐于和愿望之意。“乐意”适合本节两处宗教热忱的描写，并能体现其表面上的积极态度。
theological_decisions:
- issue: 是否明确表达比较句中的讽刺意味
  choice: 译作“仿佛是……的国民”
  alternative: 译作“像……的国民”
  rationale: 本段是在斥责虚假的敬虔；“仿佛是”把上下文已经具有的反讽自然传达出来，但不额外引入教义判断。
- issue: קִרְבַת אֱלֹהִים所指的方向
  choice: 正文译作“亲近上帝”
  alternative: “上帝的临近”或“上帝的同在临近”
  rationale: 希伯来语名词和属格关系容许“来到上帝面前”与“上帝临近”两种理解。正文依据语境中人的宗教行为采用前者，同时以脚注保存后者，避免消除原文歧义。
- issue: מִשְׁפָּט在前后两处的语义范围
  choice: 前处译“公正的法则”，后处译“判决”
  alternative: 两处均译作“公义/公正”或“典章”
  rationale: 同一词在不同搭配中可有不同侧重：前处指上帝所设立的公正秩序或要求，后处复数结构更像所求问的裁决。如此处理保留词义联系，也使汉语清楚自然。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“行公义”“求问”等措辞保留经文语域，但避免生硬古奥；比较句的反讽与末句的歧义均予以保存。
