revisions:
- from: 然而，他们天天寻求我，乐意明白我的道路，仿佛是行公义、没有离弃他们上帝公正法则的国民。他们向我求问公义的判决，乐意亲近上帝[a]。
  to: 然而，他们天天寻求我，喜爱认识我的道路，仿佛他们是一个行公义、没有离弃自己上帝公正法则的国民。他们向我求问公义的判决，乐意亲近上帝[a]。
  rationale: 修订仅改善汉语句法和词义贴合度：明确“仿佛他们是一个……国民”的比较结构，并以“喜爱认识”对应对上帝道路之知识的喜爱。末句正文保留“亲近上帝”，脚注继续保留“上帝的临近”的合理替代读法，未消除原文歧义。
  reviewer_model: gpt-5.6-terra
