  text: צ֖וֹר תְּעוּדָ֑ה חֲת֥וֹם תּוֹרָ֖ה בְּ/לִמֻּדָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/016.yaml
  text: Bind up the testimony[b][a]; seal the instruction among my disciples.
translation:
  language: zh_hans
  text: 你要把这见证束好[a]，在我的门徒中封存这训诲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “束好”也可译作“捆起”或“妥善收存”。原文带有把见证文书束起以保存的意象。
    reason: lexical_alternative
  - marker: b
    text: “训诲”也可译作“律法”或“教导”；原文所用的词含义宽广，不仅指法律条文。
    reason: lexical_alternative
lexical_decisions:
- source_word: צ֖וֹר
  choice: 卷起来
  rationale: 这是阳性单数祈使式，指把文书卷起、束好以妥善保存；“卷起来”在现代汉语中自然，也保留古代文书的具体意象。
- source_word: תְּעוּדָה
  choice: 见证
  rationale: 该词指具有证明作用的见证或证言；此处很可能承接先知此前所传的信息。“见证”既简洁，又保留其正式和先知性的分量。
- source_word: חֲת֥וֹם
  choice: 封存
  rationale: 这是阳性单数祈使式，表示给文书加封，使其受到保全；“封存”兼顾封印动作和保存目的。
- source_word: תּוֹרָ֖ה
  choice: 训诲
  rationale: 此处不必限于法典意义，而可指先知所传的教导。“训诲”保留权威性，又比“律法”更能涵盖该词在本语境中的广义。
- source_word: בְּ/לִמֻּדָֽ/י
  choice: 在我的门徒中
  rationale: 该形式直指“我的受教者”，即接受说话者教导的人；介词 בְּ 表示封存、保全所处的群体范围，故译作“在……中”。
theological_decisions:
- issue: תּוֹרָה 在先知语境中的含义
  choice: 训诲
  alternative: 律法；教导
  rationale: 不把该词未经文本要求便缩窄为法律条文，同时保留其作为权威性启示和教导的神学分量。
- issue: בְּלִמֻּדָי 所指群体
  choice: 我的门徒
  alternative: 我的受教者
  rationale: “门徒”自然表达受说话者教导、跟随其训诲的人；脚注保留较贴近词形的译法，避免过度界定其组织形态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“卷起来”保留文书意象，“封存”体现加封保存的动作；“训诲”避免将 תּוֹרָה 不必要地限定为法典。“门徒”通俗易懂，并以释义说明其为受教者。所有脚注标记均置于正文相应词语之后。
