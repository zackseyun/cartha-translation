  text: And many among them will stumble[a]; they will fall and be broken; they will be snared and captured.
translation:
  language: zh_hans
  text: 许多人必在其中绊倒[a]；他们必跌倒、被摔碎、落入圈套、被捉住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们中间必有许多人绊倒。”这里的代词也可能回指上文石头和网罗的意象，意为许多人因它们而绊倒。
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: 必……绊倒
  rationale: כשל常指绊倒或踉跄；“绊倒”承接上文绊脚石的具体意象，“必”自然表达此处预告的结果。
- source_word: בָם
  choice: 在其中
  rationale: 保留介词ב及复数代词所具有的指向弹性，可理解为“在他们中间”，也可能回指近处的石头或网罗意象，表示“因它们／在它们上面”。
- source_word: רַבִּים
  choice: 许多人
  rationale: 准确表达实词化形容词“众多者”，并在现代汉语中补出隐含的人称。
- source_word: וְנָפְלוּ
  choice: 他们必跌倒
  rationale: נפל是普通的“跌倒、倒下”；补出主语使汉语句链清楚。
- source_word: וְנִשְׁבָּרוּ
  choice: 摔碎
  rationale: שבר的尼法勒式表示被弄破、被打碎；“摔碎”与前面的跌倒构成自然的结果关系，同时保留被毁坏的具体意象。
- source_word: וְנוֹקְשׁוּ
  choice: 落入圈套
  rationale: יקשׁ的尼法勒式表示被网罗或陷阱捕获；“落入圈套”是自然现代汉语，并保留捕猎意象。
- source_word: וְנִלְכָּדוּ
  choice: 被捉住
  rationale: לכד表示捕捉、擒获；“被捉住”与“落入圈套”有别，并保留希伯来文由受困到被捕的推进。
theological_decisions:
- issue: 绊脚石语境中的审判隐喻
  choice: 保留绊倒、跌倒、摔碎、落入圈套和被捉住这一连串具体意象，不作寓意化扩写。
  alternative: 概括译作毁灭、败亡或属灵跌倒。
  rationale: 本节延续紧接上文的石头与网罗意象；具体译出各动作，既呈现审判的推进，也不把其神学含义限定为单一抽象类别。
- issue: בָם的指代对象
  choice: 正文译作“在其中”，并以脚注说明歧义。
  alternative: 明确译作“他们中间”或“因它们／在它们上面”。
  rationale: 复数后缀既可联系人群，也可能回指上文的石头、陷阱等意象；原文存在真实的句法与指代张力，不宜在正文中无提示地消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号保留前后两个意象群的层次；后半句用并列动词呈现原文紧凑、逐步加深的审判节奏。
