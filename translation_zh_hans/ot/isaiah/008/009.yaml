base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/009.yaml
  text: Be shattered[a], O peoples, and be broken; listen, all distant parts of the earth. Strap yourselves on for battle, and be broken; strap yourselves on for battle[b], and be broken.
translation:
  language: zh_hans
  text: 众民哪，你们必被粉碎[a]，也必被击垮！地上所有遥远之地啊，要侧耳听！束紧腰带吧，仍必被击垮；束紧腰带[b]吧，仍必被击垮！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头的希伯来文祈使语较难确定，也可译作“众民哪，发出战呼”或“众民哪，联合起来”。
    reason: alternative_reading
  - marker: b
    text: 或译“整装”；希伯来文原指束紧腰带，在这里很可能表示为争战作准备。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעוּ
  choice: 你们要粉碎
  rationale: 这个祈使形式的词义和词形解释均有争议。结合本节三次出现的“要被击垮”以及对敌对众民的讥讽性宣告，正文采用表示毁灭的理解；其他主要读法保留在脚注中。
- source_word: עַמִּים
  choice: 众民
  rationale: 保留复数和直接呼语，指多个族群；比“列国”更贴近 עַמִּים 的基本语义，也符合诗歌语体。
- source_word: וָחֹתּוּ
  choice: 要被击垮
  rationale: חתת 可表示破碎、败落或惊惶。这里反复出现在敌人备战之后，“被击垮”兼顾军事失败和整体崩溃，并保持三次重复的一致性。
- source_word: וְהַאֲזִינוּ
  choice: 要侧耳听
  rationale: 该使役形祈使语带有留心倾听的意思；“侧耳听”自然、庄重，并比单纯“听”更能体现强调。
- source_word: כֹּל מֶרְחַקֵּי אָרֶץ
  choice: 地上一切遥远之处
  rationale: 尽量保留原文以遥远地域为呼语的诗性表达和普世范围，不擅自补入“居民”。
- source_word: הִתְאַזְּרוּ
  choice: 束紧腰带
  rationale: אזר 的反身形表示束腰、整装，语境很可能是为冲突备战。“束紧腰带”保留原有身体意象，战争含义由上下文显明。
theological_decisions:
- issue: 开头祈使语 רֹעוּ 的解释
  choice: 作为对敌对众民的审判性讥讽：“你们要粉碎”
  alternative: “你们要喧嚷”或“你们要联合起来”
  rationale: 上下文反复宣告众民将被击垮，因此正文采用毁灭性祈使语，呈现先知式的讥讽和审判语气；但希伯来文确有歧义，故不把其他读法排除，而在脚注中明确说明。
- issue: 备战命令与失败宣告之间的关系
  choice: 用“吧，却要”表达让步和讥讽性的转折
  alternative: 逐字译作“束紧腰带，并要被击垮”
  rationale: 原文以并列形式紧接备战命令和失败结果，语用上形成强烈反讽。中文用“却”显明这种自然关系，而不增加具体的神学解释。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。保留原文的呼语、三重“要被击垮”和两次“束紧腰带”，以再现诗歌的重复与讥讽力度；所有脚注标记均已置于正文相应位置。
