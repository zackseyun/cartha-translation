base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/002.yaml
  text: 'And I will take for myself faithful witnesses: Uriah the priest and Zechariah son of Jeberekiah[a][b].'
translation:
  language: zh_hans
  text: 我要为自己请来[b]可靠的见证人[a]：祭司乌利亚和耶比利家的儿子撒迦利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可靠的”也可译作“可信的”或“忠信的”；希伯来语兼有可靠、值得信赖之意。
    reason: lexical_alternative
  - marker: b
    text: “请来”也可理解为“召来”或“指定”见证人，强调正式的见证程序。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָעִידָה
  choice: 我要……请……作证
  rationale: 该词是עוד的使役形，带有使人作证、正式召请或指定见证人的含义。“请……作证”在现代汉语中自然，也保留法律性见证的意味；“要”体现此处的意愿式语气。
- source_word: לִּי
  choice: 为自己
  rationale: 保留第一人称所表达的切身关系和目的，指为说话者本人取得见证。
- source_word: עֵדִים נֶאֱמָנִים
  choice: 可靠的见证人
  rationale: נֶאֱמָנִים强调可信、可靠、值得信赖；与“见证人”搭配时，“可靠”比“忠信”更符合现代汉语的法律和证明语境。
- source_word: אֵת
  choice: ：
  rationale: 希伯来语直接宾语标记在此引出两位见证人的名字；汉语用冒号自然地表示下文列名。
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: 祭司乌利亚
  rationale: 按现代汉语的常见头衔顺序，将定指职分置于人名前。
- source_word: זְכַרְיָהוּ בֶּן יְבֶרֶכְיָהוּ
  choice: 耶比利家的儿子撒迦利亚
  rationale: 采用中文圣经传统中较为熟悉的人名译法，并清楚保留希伯来语父子称谓结构。
theological_decisions:
- issue: 说话者身份
  choice: 保留第一人称，不在正文中补明说话者
  alternative: 将说话者明确为上主或以赛亚
  rationale: 本节希伯来文本只有第一人称形式；上下文对说话者的衔接存在解释空间，不宜在翻译中替读者作神学性判定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“请……作证”保留原文使役动词的见证含义；人名使用简体中文圣经读者较熟悉的传统译名。
