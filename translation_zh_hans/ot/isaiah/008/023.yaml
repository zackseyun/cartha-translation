  text: כִּ֣י לֹ֣א מוּעָף֮ לַ/אֲשֶׁ֣ר מוּצָ֣ק לָ/הּ֒ כָּ/עֵ֣ת הָ/רִאשׁ֗וֹן הֵקַ֞ל אַ֤רְצָ/ה זְבֻלוּן֙ וְ/אַ֣רְצָ/ה נַפְתָּלִ֔י וְ/הָ/אַחֲר֖וֹן הִכְבִּ֑יד דֶּ֤רֶךְ הַ/יָּם֙ עֵ֣בֶר הַ/יַּרְדֵּ֔ן גְּלִ֖יל הַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/023.yaml
  text: For there will be no gloom for her who was in anguish[a]. In the former time he brought contempt on the land of Zebulun and the land of Naphtali, but in the latter time he will make glorious the way of the sea, beyond the Jordan[c][b], Galilee of the nations.
translation:
  language: zh_hans
  text: 因为那曾受困苦之地必不再有幽暗。[a] 从前，他使西布伦地和拿弗他利地受轻视；在后来的时候，他必使沿海之路、约旦河对岸和列国的加利利[b]得享尊荣。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的希伯来文较难确定；“幽暗”也可译作“黑暗”或“昏暗”。原文用阴性形式指那受困苦的一方，可能是把这片土地拟人化。
    reason: lexical_alternative
  - marker: b
    text: “列国的加利利”也可译作“外族人的加利利”；希伯来文直译为“列国的加利利”。
    reason: lexical_alternative
  - marker: c
    text: 《马太福音》4:15—16引用这一区域的经文，用来说明耶稣公开传道工作的开始。
    reason: cross_reference
lexical_decisions:
- source_word: מוּעָף
  choice: 幽暗
  rationale: 该词罕见且含义有争议；“幽暗”既能表达压抑、昏暗的处境，也能与下文的盼望形成自然对比。
- source_word: מוּצָק
  choice: 受困苦
  rationale: 该词表示处于压迫、窘迫或苦难之中。“受困苦”符合现代汉语表达，也保留处境与感受两方面的含义。
- source_word: הֵקַל
  choice: 使……受轻视
  rationale: 这里与后面的“使……得着尊荣”形成轻与重、卑微与尊荣的反差；译文表达其受贬抑、被看轻的含义。
- source_word: הִכְבִּיד
  choice: 必使……得着尊荣
  rationale: 字面义为“使之沉重、有分量”，在与 הֵקַל 的对照中表示使之尊贵、得荣耀。采用将来表达，以呈现语境中由审判转向盼望的推进。
- source_word: דֶּרֶךְ הַיָּם
  choice: 沿海之路
  rationale: 保留“海之路”的地理表达，同时使用普通现代读者易懂的汉语。
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: 约旦河对岸
  rationale: 保留原文简洁的地理称谓，不限定观察者所在的方向。
- source_word: גְּלִיל הַגּוֹיִם
  choice: 列国的加利利
  rationale: גּוֹיִם 的基本义是“列国、各国之民”。正文采用较宽泛且贴近希伯来语的“列国”，并在脚注说明传统的另一种译法。
- source_word: כִּי לֹא
  choice: 然而……必不再有
  rationale: 在本段语境中引出从黑暗转向盼望的逆转。“然而”衔接前文，“必不再有”自然表达其前瞻意义。
- source_word: לַאֲשֶׁר מוּצָק לָהּ
  choice: 那曾受困苦之地
  rationale: 原文使用阴性代词，可能将受苦的地区或土地拟人化。汉语明确补出“地”，使指代自然，但不进一步限定具体地区。
theological_decisions:
- issue: 末句应表达将来的尊荣，还是延续的审判
  choice: 将来的尊荣：“必使……得着尊荣”
  alternative: 延续的审判：“使……负重担”或类似译法
  rationale: 上下文从幽暗和困苦转向盼望；前面的“使……受轻视”与后面的“使……得着尊荣”构成最连贯的反转。译文依据希伯来语语境作此选择，不把后来的基督教解释直接写入正文。
- issue: 开头是否明确补出受苦者为土地
  choice: 译作“那曾受困苦之地”
  alternative: 保留拟人表达：“那曾受困苦的她”
  rationale: 阴性代词很可能回指这一地区或土地。现代汉语若直译为“她”容易造成不必要的指代含混，因此补出“地”，同时用脚注保留原文难点。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“受轻视／得着尊荣”呈现原文“轻／重”的对照，而不生硬直译。“沿海之路、约旦河对岸、列国的加利利”保留地理名称的并列结构。
