source:
  edition: WLC
  text: וְ/אֶל אֶ֖רֶץ יַבִּ֑יט וְ/הִנֵּ֨ה צָרָ֤ה וַ/חֲשֵׁכָה֙ מְע֣וּף צוּקָ֔ה וַ/אֲפֵלָ֖ה מְנֻדָּֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/022.yaml
  text: And he will look to the earth[a], and behold, distress and darkness, the gloom of anguish[b]; and thick darkness will be driven away.
translation:
  language: zh_hans
  text: 他望向大地[a]，看哪，尽是患难与黑暗，是痛苦的幽暗；他必被赶入浓密的黑暗中。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”或“国土”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文十分凝练，直译近似：“患难与黑暗，痛苦的幽暗，以及浓密的黑暗——被驱逐的。”末语也可理解为“一个被驱逐的人”，或把“被驱散”与“浓密的黑暗”相连。
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֶרֶץ
  choice: 大地
  rationale: 此词既可指广义的“大地”，也可指特定的“土地、国土”。结合上文仰望与俯视的对照，正文采用“大地”，并在脚注保留另一可能。
- source_word: יַבִּיט
  choice: 他望向
  rationale: נבט 的使役形在此表示观看、察看；“望向”自然地表达其方向性，并与介词 אֶל 相配。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注意的指示作用和庄重语气。
- source_word: צָרָה
  choice: 患难
  rationale: 表达困苦、灾难或窘迫；“患难”符合先知诗歌的庄重语体。
- source_word: חֲשֵׁכָה
  choice: 黑暗
  rationale: 采用该词的基本意义，并让后面的词语逐步加强黑暗意象。
- source_word: מְעוּף
  choice: 幽暗
  rationale: 这是罕见词，通常理解为昏暗或幽暗；与后面的 צוּקָה 构成领属关系，译作“痛苦的幽暗”。
- source_word: צוּקָה
  choice: 痛苦
  rationale: 可指困厄、窘迫或痛苦；这样既保留与 צָרָה 的语义呼应，又避免中文机械重复。
- source_word: אֲפֵלָה
  choice: 浓密的黑暗
  rationale: 该词所指的黑暗程度强于一般的 חֲשֵׁכָה；“浓密的黑暗”保留压迫感和递进效果。
- source_word: מְנֻדָּח
  choice: 被赶入
  rationale: נדח 的被动分词表示被驱赶、逐出。正文依照最自然的上下文关系，以前面的单数人物为隐含主语，译为被赶入黑暗；原文的压缩结构及另一种句法理解见脚注。
theological_decisions:
- issue: 末句中被驱赶者的身份及其与“浓密的黑暗”的句法关系
  choice: 以前文“他”为隐含主语，译作“他必被赶入浓密的黑暗中”
  alternative: 可按原文词序理解为“浓密的黑暗——一个被驱逐的人”，或把“被驱散”与黑暗相连
  rationale: מְנֻדָּח 是阳性单数被动分词，与阴性名词 אֲפֵלָה 并不一致，因此较可能描述前文所说的人，而非说黑暗本身被驱散。由于希伯来文极为压缩，脚注保留其他句法理解，不以神学推论消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知文学的郑重提示语气；分号呈现原文由所见景象转向最终处境的节奏。
