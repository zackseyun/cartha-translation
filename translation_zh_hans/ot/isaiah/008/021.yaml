base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/021.yaml
  text: And he will pass through it[a], hard-pressed and hungry; and when he is hungry, he will become enraged and curse his king and his God, and he will turn upward.
translation:
  language: zh_hans
  text: 他必经过那地，困苦饥饿；他饥饿时，就必发怒，咒骂他的王和他的神，并转向上方[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向上看。”原文直译为“转向上方”，可能是说受苦的人抬头望天。
    reason: 保留“转向上方”的字面动作，同时提示语境中可能的“向上看”理解，而不将其作为正文确定事实。
lexical_decisions:
- source_word: וְעָבַר בָּהּ
  choice: 走遍那地
  rationale: עבר 加介词 בּ 可表示穿行、经过；阴性单数后缀按上下文自然落实为“那地”。“走遍”在现代汉语中简洁表达身处其中而行经各处的意思。
- source_word: נִקְשֶׁה וְרָעֵב
  choice: 困苦饥饿地
  rationale: נִקְשֶׁה 表示处境艰难、备受压迫，译为“困苦”既自然又不限定苦难类型；רָעֵב 直译为“饥饿”，不额外加强为“饥肠辘辘”。
- source_word: וְהָיָה כִי יִרְעַב
  choice: 他饿了
  rationale: 该结构引出随后情形，汉语用“他饿了，就……”自然保留时间与条件色彩，无须机械译出“事情将是”。
- source_word: וְהִתְקַצַּף
  choice: 就必恼怒
  rationale: 该词表示发怒、愤激；“恼怒”保留强烈怒气，同时符合庄重的现代汉语经文语体。
- source_word: וְקִלֵּל בְּמַלְכּוֹ וּבֵאלֹהָיו
  choice: 咒骂他的王和他的神
  rationale: קלל 的对象由 בּ 引出，汉语直接用宾语表达。“神”保留 אֱלֹהִים 在此较可能的单数意义，但不擅自认定具体所指。
- source_word: וּפָנָה לְמָעְלָה
  choice: 又转而向上看
  rationale: פנה 基本义为“转向”，למעלה 为“向上”。“转而向上看”在汉语中自然呈现转向上方的动作，也与下一节向下观看形成对应；“看”属于语境所含动作，故用脚注提示较直译法。
theological_decisions:
- issue: 审判语境中的代表性阳性单数
  choice: 全节用“他”
  alternative: 用“人”或复数“他们”表达泛指
  rationale: 希伯来文持续采用阳性单数动词与后缀。中文“他”忠实保留数与人称；这里可作代表性个体理解，并不表示受苦者仅限男性。
- issue: “他的神”的所指与单复数
  choice: 译作“他的神”，不进一步指明身份
  alternative: 译作“他的众神”，或明确译成“耶和华”
  rationale: 原文未使用神名；此处 אֱלֹהִים 结合单数所有关系及语境较宜作单数。译文保留其所指上的张力，不判定此人是背约者、异教徒或其他身份。
- issue: 向上动作是否明确包含观看
  choice: 正文译为“转而向上看”，并以脚注保留形式对应更直接的译法
  alternative: 译作“转向上方”
  rationale: 原文只明确说“转向上方”，但上下文与下一节的观看动作使“向上看”很可能是其实际含义。正文采用自然汉语，脚注则防止把语境推断误当作原文明说。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的简体中文。“走遍那地”避免生硬的“经过它”；分号与“就必”清楚呈现由困苦饥饿转入愤怒咒骂的推进。脚注标记置于对应句末。
