base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/011.yaml
  text: 'For thus Yahweh said to me with a strong hand[a], warning me not to walk in the way of this people[b], saying:'
translation:
  language: zh_hans
  text: 因为耶和华以大能的手[a]这样对我说，又警戒我[b]不可走这百姓所走的道路，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“以手的强力”；也可理解为“当他的手有力地加在我身上时”。这个希伯来语表达强调上帝强有力的约束或迫使。
    reason: lexical_alternative
  - marker: b
    text: “警戒”也可译作“训诲”或“管教”。原词可表示纠正、管教或教导；这里所引出的内容是一项禁令。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: 因为……这样……说
  rationale: כִּי承接并解释上文；כֹה אָמַר采用先知话语中自然而庄重的“这样……说”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名“耶和华”表达四字神名，避免以称号替代原文专名。
- source_word: כְּחֶזְקַת הַיָּד
  choice: 大力按住我
  rationale: 保留“手”所表达的强制性意象所含的实际作用，以自然汉语传达上帝强有力的约束；原文短语的具体句法关系仍有歧义，列入脚注。
- source_word: וְיִסְּרֵנִי
  choice: 并警戒我
  rationale: יסר可指管教、训诲或警戒；下文内容是禁止先知采取某种行为，因此正文用“警戒”，同时在脚注保留其他可能。
- source_word: מִלֶּכֶת בְּדֶרֶךְ
  choice: 不可走……所走的道路
  rationale: מן与不定式在此表示阻止或禁止；“走……道路”保留行为方式的隐喻。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留希伯来语单数集合名词和指示语气，采用庄重但仍易懂的现代汉语。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 原文在本节末引出下一节的直接话语，冒号保留跨节未完结构。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经传统中最广为人知的专名形式；两种形式均意在音译神名，而非以“主”等称号取代。
- issue: 上帝之手的作用强度
  choice: 大力按住我
  alternative: 以大能的手临到我／当他的手有力地加在我身上时
  rationale: 原文表达强烈的神圣约束或迫使，不宜弱化为一般性的启示；但不据此界定先知经验的具体方式。
- issue: יסר 的语义
  choice: 警戒
  alternative: 训诲／管教
  rationale: 紧接的禁止内容支持“警戒”，但该动词本身兼有纠正、管教和教导意味，故在脚注保存张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留先知话语的正式语气、道路隐喻，以及本节末引出下一节内容的冒号。正文中的“这百姓所走的道路”使汉语关系清楚，又不把“道路”扁平化为单纯的“行为方式”。
