  terminology: “耶和华”“万军之耶和华”“锡安山”均合宜；“记号和预兆”能保留אֹתוֹת与מוֹפְתִים的并列及其预示性。脚注中将“万军之主”称为传统译法不够准确：中文传统圣经常见形式正是“万军之耶和华”。
