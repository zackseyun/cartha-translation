  text: הִנֵּ֣ה אָנֹכִ֗י וְ/הַ/יְלָדִים֙ אֲשֶׁ֣ר נָֽתַן לִ֣/י יְהוָ֔ה לְ/אֹת֥וֹת וּ/לְ/מוֹפְתִ֖ים בְּ/יִשְׂרָאֵ֑ל מֵ/עִם֙ יְהוָ֣ה צְבָא֔וֹת הַ/שֹּׁכֵ֖ן בְּ/הַ֥ר צִיּֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/018.yaml
  text: Behold[a], I and the children whom Yahweh has given me are for signs and wonders in Israel from Yahweh of Armies, who dwells on Mount Zion.
translation:
  language: zh_hans
  text: 看哪，我和耶和华赐给我的孩子们，在以色列中是记号和预兆；这些记号和预兆出于住在锡安山上的万军之耶和华[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之耶和华”也可译作“万军之主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知话语中唤起注意并加重语气的作用，同时符合现代中文庄重表达。
- source_word: אָנֹכִי וְהַיְלָדִים
  choice: 我和……孩子们
  rationale: 独立人称代词带有强调意味，“看哪”及并列结构已在中文中体现重点；יְלָדִים按上下文指以赛亚的孩子。
- source_word: אֲשֶׁר נָתַן לִי יְהוָה
  choice: 耶和华赐给我的
  rationale: 准确表达关系从句，并以“赐给”体现孩子作为上帝所赐之礼物的语感。
- source_word: לְאֹתוֹת וּלְמוֹפְתִים
  choice: 作记号和预兆
  rationale: 介词ל表示功能或结果；本段语境强调以赛亚及其孩子具有预示意义，因此将מוֹפְתִים译作“预兆”，避免“奇事”可能造成他们施行神迹的误解。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列中
  rationale: 保留ב最直接的处所或范围含义，表明这些记号和预兆显在以色列当中。
- source_word: מֵעִם יְהוָה צְבָאוֹת
  choice: 这是出于……万军之耶和华
  rationale: מֵעִם表示来自某一位格的源头；增补“这是”使中文句法自然，同时明确记号和预兆源自耶和华。
- source_word: הַשֹּׁכֵן בְּהַר צִיּוֹן
  choice: 住在锡安山上的
  rationale: 分词表达持续、特征性的居住状态；“住在……山上”是自然现代中文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉且明确作为专名使用的“耶和华”，不以“主”这一称号替代原文神名。
- issue: 称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 万军之主
  rationale: “万军之耶和华”既保留神名，也传达צְבָאוֹת所指的众军，并避免用称号替换专名；传统替代译法列入脚注。
- issue: מוֹפְתִים 在本节中的语义
  choice: 预兆
  alternative: 奇事
  rationale: 该词可指奇事、异象性征兆或预兆；在以赛亚及其孩子本身充当信息载体的语境中，“预兆”更贴切，但脚注所涉传统称号之外不必过度限定其神学功能。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“看哪”保留先知文体；后半句以“这是出于……”重组希伯来语来源短语，使中文通顺而不改变其修饰关系。
