source:
  edition: WLC
  text: וְ/כִֽי יֹאמְר֣וּ אֲלֵי/כֶ֗ם דִּרְשׁ֤וּ אֶל הָ/אֹבוֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים הַֽ/מְצַפְצְפִ֖ים וְ/הַ/מַּהְגִּ֑ים הֲ/לוֹא עַם֙ אֶל אֱלֹהָ֣י/ו יִדְרֹ֔שׁ בְּעַ֥ד הַ/חַיִּ֖ים אֶל הַ/מֵּתִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/019.yaml
  text: And when they say to you[b][a], “Consult the mediums and the spiritists who chirp and mutter,” should not a people consult its God? Should they consult the dead on behalf of the living?
translation:
  language: zh_hans
  text: 当有人对你们说：“你们去求问那些招魂者[b]和通灵师，就是那些发出尖细声、喃喃低语的人[a]。”百姓岂不应当求问自己的上帝吗？难道可为活人求问死人吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发出尖细声”也可译作“发出鸟鸣般的叫声”。原文以鸟鸣般的尖细声和低沉含混的声音，描写通灵咨询时的发声。
    reason: lexical_alternative
  - marker: b
    text: “招魂者”所对应的希伯来词也可指“亡灵”；传统译法常作“交鬼者”。这里因其与“发出尖细声、喃喃低语的人”连用，正文理解为从事招魂的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יֹאמְרוּ אֲלֵיכֶם
  choice: 有人若对你们说
  rationale: וְכִי可引出预期或假设情形；中文用“若”自然保留条件意味。三复数主语在此未明，用泛指的“有人”避免虚构具体群体，同时“你们”保留复数受词。
- source_word: דִּרְשׁוּ
  choice: 求问
  rationale: דרש在本节指为了获得指引而询问某一对象。“求问”既适用于向上帝寻求指引，也适用于招魂语境，并能维持全节的词语呼应。
- source_word: הָאֹבוֹת
  choice: 招魂者
  rationale: 该词可指亡灵，也可转指与亡灵交往的术士；与后面的主动分词“叽叽叫、喃喃低语”结合，正文采用实践者的理解。“招魂者”比旧式术语更易为现代读者理解，同时脚注保留另一种可能。
- source_word: הַיִּדְּעֹנִים
  choice: 巫师
  rationale: 该词指从事通灵占卜的人。“巫师”在现代汉语中简洁可懂；上下文已明确这是求问亡灵的术士，不按现代奇幻文学含义理解。
- source_word: הַמְצַפְצְפִים וְהַמַּהְגִּים
  choice: 叽叽叫、喃喃低语
  rationale: 前一分词模仿尖细、鸟鸣般的声音，后一分词表示低声含混地念叨。译文保留两种声音的鲜明对照及令人不安的听觉效果。
- source_word: הֲלוֹא עַם אֶל אֱלֹהָיו יִדְרֹשׁ
  choice: 百姓岂不该求问自己的上帝吗？
  rationale: הֲלוֹא引出期待肯定答案的反问。“自己的上帝”反映单数所有格与集合名词“百姓”的关系，也保留经文所强调的归属。
- source_word: בְּעַד הַחַיִּים אֶל הַמֵּתִים
  choice: 岂可为活人去求问死人呢？
  rationale: 后一短语承接前面的דרש，中文补出“求问”以使省略结构清楚。“为活人”简洁表达בְּעַד的受益或代表意义，不额外断定死人是否有回应能力。
theological_decisions:
- issue: 求问上帝与求问死人的反问对照
  choice: 译成连续两个反问，谴责为了活人而向死人寻求指引
  alternative: 把末句仅理解为嘲讽求问死人不合逻辑，或由此推导关于死人能力的完整教义
  rationale: 希伯来文的直接重点是指引来源应当是百姓自己的上帝，而不是死人。译文保留尖锐对照，却不加入本节未明说的死后状态论。
- issue: אֹבוֹת指术士还是亡灵
  choice: 正文采用“招魂者”，脚注说明也可指亡灵
  alternative: 正文译为“亡灵”或传统的“交鬼者”
  rationale: 修饰语“叽叽叫、喃喃低语”在语法上更自然地描述施术者，但该名词本身确有指亡灵的词义可能，故不应完全消除歧义。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“求问”贯穿三处דרש及末句省略的动词，强化原文的修辞对照；“叽叽叫、喃喃低语”有意保留声音模仿。脚注标记均置于相关正文处。
