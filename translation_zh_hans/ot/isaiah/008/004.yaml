source:
  edition: WLC
  text: כִּ֗י בְּ/טֶ֨רֶם֙ יֵדַ֣ע הַ/נַּ֔עַר קְרֹ֖א אָבִ֣/י וְ/אִמִּ֑/י יִשָּׂ֣א אֶת חֵ֣יל דַּמֶּ֗שֶׂק וְ/אֵת֙ שְׁלַ֣ל שֹׁמְר֔וֹן לִ/פְנֵ֖י מֶ֥לֶךְ אַשּֽׁוּר׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/004.yaml
  text: For before the boy knows how to cry[c][b][a], ‘My father’ and ‘My mother,’ the wealth of Damascus and the spoil of Samaria will be carried away before the king of Assyria.
translation:
  language: zh_hans
  text: 因为在那孩子还不会叫“我父亲”“我母亲”以前，大马士革的财富和撒马利亚的战利品，必被带到亚述王面前。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “叫”或译“称呼”。
    reason: lexical_alternative
  - marker: b
    text: “战利品”或译“掳物”。
    reason: lexical_alternative
  - marker: c
    text: 原文只说“那孩子”；按上下文，这很可能指前文所提及的孩子。
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，对先前的预言作因果性解释；现代汉语用“因为”自然清楚。
- source_word: בְּטֶרֶם
  choice: 还……以前
  rationale: 表达某事发生在孩子达到某一成长阶段之前，符合希伯来语的时间关系。
- source_word: יֵדַע
  choice: 知道
  rationale: 与不定式“呼唤”连用，表示已经具备说出或呼唤这些称谓的能力；汉语“知道呼唤”保留原文结构和轻微的表达张力。
- source_word: הַנַּעַר
  choice: 这孩子
  rationale: נַעַר可指孩子或少年；上下文涉及尚不会呼唤父母的幼儿。“这”承接前文已提及的孩子，但不在正文中进一步认定其身份。
- source_word: קְרֹא
  choice: 呼唤
  rationale: 基本义为“呼叫、称呼”；此处引出孩子对父母的称谓。“呼唤”比单纯“说”更贴近词义，又不像“哭喊”那样增添原文没有的情态。
- source_word: אָבִי וְאִמִּי
  choice: “我父”和“我母”
  rationale: 保留两个希伯来词明确的第一人称所属形式；措辞庄重简洁，避免加入“爸爸、妈妈”的口语色彩。
- source_word: יִשָּׂא
  choice: 必被带到
  rationale: 原文主动单数可作不定施事表达；汉语用被动句自然，不擅自补出掳掠者，并与目的地“亚述王面前”顺畅衔接。
- source_word: חֵיל
  choice: 财富
  rationale: 该词可指力量、军队、资源或财富；与“掠物”并列且指大马士革所有之物，此处以物质财富为宜，同时承认“军力”在词汇上存在可能。
- source_word: שְׁלַל
  choice: 掠物
  rationale: 指战争中掳掠所得的财物；“掠物”准确而简洁，也保留其与掳掠行动的联系。
- source_word: לִפְנֵי מֶלֶךְ אַשּׁוּר
  choice: 到亚述王面前
  rationale: לִפְנֵי本义为“在……面前”；与“被带到”搭配，表达战利品被运到亚述王面前，不把含义收窄为仅仅“交给”他。
theological_decisions:
- issue: “这孩子”的所指
  choice: 正文只译为“这孩子”，不明确指认其身份。
  alternative: 明确译作“玛黑珥·沙拉勒·哈施·罢斯”或解释为更广泛的预兆之子。
  rationale: 本节原文只说“孩子”；上下文虽强烈指向前文所生之子，译文仍应保留原文表达范围，不把解释写入正文。
- issue: חֵיל所指是财富还是军力
  choice: 译为“大马士革的财富”。
  alternative: 译为“大马士革的军力”或“军队”。
  rationale: 该词本身多义，但与撒马利亚的“掠物”并列，并作为被带到王面前之物，物质财富的理解更符合语境；不据此引申任何特定神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“我父”“我母”的原文所属形式及先知文体，不改写成更口语化的“爸爸”“妈妈”。主文中的脚注标记均对应所列脚注。
