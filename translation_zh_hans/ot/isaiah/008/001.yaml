  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קַח לְ/ךָ֖ גִּלָּי֣וֹן גָּד֑וֹל וּ/כְתֹ֤ב עָלָי/ו֙ בְּ/חֶ֣רֶט אֱנ֔וֹשׁ לְ/מַהֵ֥ר שָׁלָ֖ל חָ֥שׁ בַּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/001.yaml
  text: 'Then Yahweh said to me[b][a], “Take for yourself a large tablet and write on it with an ordinary stylus: ‘Maher-shalal-hash-baz.’”'
translation:
  language: zh_hans
  text: 雅威对我说：“你拿一块大书写板，用普通的笔[a]在上面写：‘玛黑珥·沙拉勒·哈施·罢斯[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“用人的笔”、“用常用的笔”，或“用普通字体”。
    reason: 原文בְּחֶרֶט אֱנוֹשׁ既可能描述书写工具，也可能强调一般人所用、易于辨认的书写方式。
  - marker: b
    text: “玛黑珥·沙拉勒·哈施·罢斯”是希伯来语，意思可能是“掳掠速临，抢夺快到”。
    reason: 正文保留象征性人名的音译，脚注补充其词义。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留经文直接使用上帝圣名的特点。
- source_word: גִּלָּיוֹן גָּדוֹל
  choice: 一块大书写板
  rationale: גִּלָּיוֹן指可供书写的大片表面，具体材质与形态并不确定；“大书写板”既交代用途，也避免武断限定为卷轴或石版。
- source_word: קַח לְךָ
  choice: 你拿
  rationale: 中文祈使句以“你拿”自然表达命令；希伯来文לְךָ带有为自己取用的语气，但直译“给自己拿”在此较生硬。
- source_word: וּכְתֹב עָלָיו
  choice: 在上面写
  rationale: 直接、自然地表达“写在其上”，不额外限定为刻写。
- source_word: בְּחֶרֶט אֱנוֹשׁ
  choice: 用普通的笔
  rationale: 该短语字面可理解为“用人的笔”，也可能指一般人使用的笔或普通易读的书写方式；正文采用自然且可能性较高的理解，脚注保留歧义。
- source_word: לְמַהֵר שָׁלָל חָשׁ בַּז
  choice: 玛黑珥·沙拉勒·哈施·罢斯
  rationale: 下文将此语用作象征性人名，因此正文音译；其词义另列脚注。
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: 对我说
  rationale: 准确表达说话对象；本节开头的叙事连接词在现代中文中可不另译，以保持自然衔接。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，音译为“雅威”可保留其专名性质，不以称号“主”替代。
- issue: לְמַהֵר שָׁלָל חָשׁ בַּז应音译还是意译
  choice: 正文按人名音译，脚注说明含义
  alternative: 正文译作“掳掠速临，抢夺快到”
  rationale: 此语在上下文中成为孩子的象征性名字；音译保留人名功能，脚注则呈现其预言性含义。
- issue: בְּחֶרֶט אֱנוֹשׁ中אֱנוֹשׁ的含义
  choice: 普通的
  alternative: 人的；常用的；用普通字体
  rationale: 原短语含义不完全确定；正文选择通顺的习语性理解，脚注明列其他可能，不把“人”误解为专指男性，也不排除它描述字体而非工具的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大书写板”保留书写载体的不确定性；“普通的笔”使正文顺畅，同时用脚注保留原短语的真实歧义。人名以间隔号分节，便于普通读者辨读。
