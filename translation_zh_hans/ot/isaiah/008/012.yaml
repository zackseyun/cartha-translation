  text: לֹא תֹאמְר֣וּ/ן קֶ֔שֶׁר לְ/כֹ֧ל אֲשֶׁר יֹאמַ֛ר הָ/עָ֥ם הַ/זֶּ֖ה קָ֑שֶׁר וְ/אֶת מוֹרָא֥/וֹ לֹֽא תִֽירְא֖וּ וְ/לֹ֥א תַעֲרִֽיצוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/012.yaml
  text: Do not call conspiracy everything that this people calls conspiracy[a], and do not fear what they fear[b], nor be in dread.
translation:
  language: zh_hans
  text: 这百姓所称为“阴谋”的一切事，你们不可也称为“阴谋”[a]；他们所怕的，你们不可怕[b]，也不可惊恐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡这百姓说‘有阴谋’的事，你们不可也说‘有阴谋’。”
    reason: 原文可理解为不可把百姓称为“阴谋”的一切事同样定为“阴谋”，也可较直接地保留重复说“阴谋”的话语形式。
  - marker: b
    text: 原文可直译为“它所怕的”或“它的恐惧”；“它”指作为集合整体的“这百姓”。该短语可指恐惧本身，也可指使其恐惧的对象。
    reason: 说明“这百姓”为单数集合名词，及其后缀和名词所保留的语义可能性。
lexical_decisions:
- source_word: קֶשֶׁר / קָשֶׁר
  choice: 阴谋
  rationale: 该词可指秘密结成的同盟或谋划；“阴谋”既保留政治与社会语境，也能体现百姓给事件贴上的惊慌性标签。
- source_word: תֹאמְרוּן
  choice: 称为
  rationale: 本义为“说”，但这里与表语名词“阴谋”连用，译作“称为”更符合现代汉语，也准确表达给某事定性的意思。
- source_word: לְכֹל אֲשֶׁר יֹאמַר הָעָם הַזֶּה
  choice: 这百姓说是“阴谋”的一切事
  rationale: 保留“关于一切……之事”的范围，并以自然汉语表达原文略为压缩的宾语—表语关系。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: “这百姓”保留原文单数集合名词以及可能带有的疏离或责备语气，不泛化为“这个国家”。
- source_word: מוֹרָאוֹ
  choice: 他们所怕的
  rationale: 该词既可指恐惧本身，也可指使人恐惧的对象；此译法保留实际语义，并以汉语复数代词自然承接集合名词“这百姓”。
- source_word: תִּירְאוּ
  choice: 不要怕
  rationale: 直接表达 ירא 的含义，并与前面的“所怕的”保持词根所形成的修辞呼应。
- source_word: תַעֲרִיצוּ
  choice: 不要惊恐
  rationale: 该形式表达受震慑、陷入恐惧；“惊恐”比再次使用“怕”更强，保留末句的诗性递进。
theological_decisions:
- issue: 关于恐惧之禁令的所指与力度
  choice: 不可接受这百姓对局势的恐慌性判断，也不可同他们一起惧怕。
  alternative: 专指不可参与真实存在的政治阴谋，或主要指不可惧怕这百姓本身。
  rationale: “阴谋”的重复和后面两个平行禁令，表明重点是不可附和百姓的定性并感染其恐惧；译文不限定具体历史对象，以保留原文的开放性与张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不可”用于首个核心禁令，“不要”用于后续平行分句，使句势自然；重复“阴谋”以保留原文的修辞效果，并用“怕—惊恐”呈现末尾的语义加强。
