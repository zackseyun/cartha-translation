base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/010.yaml
  text: Make a plan[a], and it will be thwarted; speak a word, and it will not stand, for God is with us.
translation:
  language: zh_hans
  text: 你们筹划计谋，必被挫败；你们说出话来，也必不能实现，因为上帝与我们同在。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“因为与我们同在的是上帝”，呼应以赛亚书7:14和8:8中的名字“以马内利”（意为“上帝与我们同在”）。
    reason: cross_reference
lexical_decisions:
- source_word: עֻצוּ עֵצָה
  choice: 筹划计谋
  rationale: 动词与同根语义的名词连用，意为拟定计策。“筹划计谋”既保留原文的强调，也符合敌对势力谋划的语境；复数命令语气在上下文中带有挑战意味。
- source_word: וְתֻפָר
  choice: 必被挫败
  rationale: פרר的尼法勒未完成式表示计谋被破坏、废除或挫败。“被挫败”自然地表达敌方计划无法实现；“必”体现此处预告结果的确定性。
- source_word: דַּבְּרוּ דָבָר
  choice: 说出话来
  rationale: 保留דבר动词与名词的呼应，不把含义过度限定为“颁布命令”或“提出方案”。中文用“说出话来”自然表达所发之言。
- source_word: וְלֹא יָקוּם
  choice: 也必不能成立
  rationale: קום在此指所说的话不能站立、确立或生效。“不能成立”兼顾原文意象和现代汉语中言论、主张无法奏效的表达。
- source_word: כִּי
  choice: 因为
  rationale: 引出敌人计谋和言语不能成功的原因，明确保留因果关系。
- source_word: עִמָּנוּ אֵל
  choice: 上帝与我们同在
  rationale: 原文是“与我们同在的是上帝”这一短语性分句，而非连写的专名形式；译成完整汉语分句，清楚传达其意义，同时由脚注保存与“以马内利”的呼应。
theological_decisions:
- issue: עִמָּנוּ אֵל与以赛亚书7—8章“以马内利”主题的关系
  choice: 正文译作“上帝与我们同在”，并以脚注说明它与“以马内利”的呼应。
  alternative: 正文直接译作“因为以马内利”或采用倒装“因为与我们同在的是上帝”。
  rationale: 本节希伯来文写作两个词עִמָּנוּ אֵל，语法上是“上帝与我们同在”的分句；但它显然呼应7:14和8:8的名字“以马内利”。正文不直接改作专名，以免消除分句与名字之间真实存在的张力；脚注则保存重要的篇章联系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“筹划计谋—被挫败”与“说出话来—不能成立”形成清晰平行。脚注标记置于“上帝与我们同在”之后，因为注释所解释的是该短语，而不是前面的“计谋”。
