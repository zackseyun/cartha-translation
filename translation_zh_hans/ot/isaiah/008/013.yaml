  text: אֶת יְהוָ֥ה צְבָא֖וֹת אֹת֣/וֹ תַקְדִּ֑ישׁוּ וְ/ה֥וּא מוֹרַאֲ/כֶ֖ם וְ/ה֥וּא מַֽעֲרִֽצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/013.yaml
  text: Yahweh of hosts—you shall regard him as holy[a]. Let him be your fear[b], and let him be your dread.
translation:
  language: zh_hans
  text: 万军之耶和华——你们要尊他为圣[a]；要以他为你们所当惧怕的、所当畏惧的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要以他为圣。”这里不是说人使耶和华成为圣洁，而是要承认他是圣洁的，并按他的圣洁尊崇他。
    reason: 说明 תַקְדִּישׁוּ 的使役形式及其语境含义，防止中文读者误解为人能赋予神圣洁。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名译法“耶和华”，明确保留专名功能，而不以“主”这一称号替代。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: “万军”是 צְבָאוֹת 在神圣称号中的传统而准确的中文表达，既可涵盖天上的军旅，也不排除地上的众军，避免过度限定。
- source_word: אֹתוֹ תַקְדִּישׁוּ
  choice: 你们要尊他为圣
  rationale: 使役形态在此不是说人能使耶和华成为圣洁，而是命令人承认并以他为圣；“尊他为圣”兼顾原文形式、神学含义和现代中文自然度。
- source_word: מוֹרַאֲכֶם
  choice: 你们所当惧怕的
  rationale: מוֹרָא 可指惧怕本身或惧怕的对象。结合上下文的劝诫语气，以“所当惧怕的”自然表达耶和华应当成为百姓敬畏的对象。
- source_word: מַעֲרִצְכֶם
  choice: 你们所当畏惧的
  rationale: 该词表达强烈的畏惧或令人战栗的对象；与前句形成平行，同时用“畏惧”保留第二项的庄重和加强作用。
- source_word: וְהוּא ... וְהוּא
  choice: 他才是……他才是……
  rationale: 原文为两个无系词名词句，直译可作“他是……他是……”。上下文与第12节形成排他性对照，中文用“才是”传达焦点与劝诫力量，但不把句子改成显式命令。
theological_decisions:
- issue: 神圣称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 雅威万军之主；万军之主
  rationale: 原文直接使用四字神名，而非 אֲדֹנָי（主）。译作“耶和华”保留专名性质；“万军之耶和华”也是庄重、通行且易懂的中文称号。
- issue: “使其为圣”这一命令的含义
  choice: 尊他为圣
  alternative: 使他成圣；以他为圣
  rationale: 原文命令人承认、对待耶和华为圣，并非由人赋予神圣洁。“尊他为圣”避免产生人使神变得圣洁的误解，同时保留命令的神学分量。
- issue: 两个名词句的语气
  choice: 他才是你们所当惧怕的，他才是你们所当畏惧的
  alternative: 他是你们的惧怕，他是你们的战兢；要以他为你们所怕、所畏的
  rationale: 希伯来文形式上是陈述性的名词句，但处在劝诫语境中。正文保留陈述结构，并借“所当”体现规范性，避免把原文未明说的祈使形式绝对化。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“万军之耶和华”延续中文圣经语域；后半节以整齐的平行句呈现原文修辞，并用“才是”呼应上下文中不可随众惧怕其他对象的对比。
