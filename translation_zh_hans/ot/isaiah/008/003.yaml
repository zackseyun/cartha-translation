base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/003.yaml
  text: So I went near to the prophetess[a], and she conceived and bore a son. Then Yahweh said to me[b], “Call his name Maher-shalal-hash-baz.”
translation:
  language: zh_hans
  text: 我便亲近了那位女先知；她怀孕，生了一个儿子。耶和华对我说：“给他起名叫玛黑珥·沙拉勒·哈施·罢斯[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛黑珥·沙拉勒·哈施·罢斯”大意是“掳掠速临，抢夺快到”。
    reason: 说明这个象征性名字的含义。
lexical_decisions:
- source_word: וָאֶקְרַב
  choice: 我就亲近
  rationale: קרב的基本意思是“走近、亲近”。这里按上下文委婉指夫妻同房；译文保留原文含蓄的表达，不将其明说得更露骨。“就”也承接上文及连续叙事。
- source_word: הַנְּבִיאָה
  choice: 那女先知
  rationale: 该词是“先知”的阴性形式。“女先知”准确保留原文的性别标记，也是现代汉语中自然、通行的称谓。
- source_word: וַתַּהַר
  choice: 她就怀孕
  rationale: הרה意为“怀孕、受孕”。“怀孕”在现代汉语中自然清楚，并与后面的生产顺畅衔接。
- source_word: וַתֵּלֶד בֵּן
  choice: 生了一个儿子
  rationale: 直译为“生了一个儿子”，准确而符合现代汉语叙事习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不是以“主”这一称号替代。
- source_word: קְרָא שְׁמוֹ
  choice: 给他起名叫
  rationale: 希伯来语字面为“称他的名”。“给他起名叫”自然传达命名公式的含义。
- source_word: מַהֵר שָׁלָל חָשׁ בַּז
  choice: 玛黑珥·沙拉勒·哈施·罢斯
  rationale: 此处作为具有象征意义的人名，正文采用音译；名称的含义另以脚注说明。分隔点帮助现代读者辨认复合名称的各部分。
theological_decisions:
- issue: 是否把“亲近女先知”的性含义明说出来
  choice: 保留原文的委婉说法“亲近”
  alternative: “与那女先知同房”或“与那女先知发生关系”
  rationale: 上下文表明这是夫妻结合，但希伯来文采用含蓄措辞。译文维持原文的含蓄程度，不把隐含意义扩写成明说。
- issue: 如何处理具有预言意义的孩子名字
  choice: 正文音译，脚注释义
  alternative: 直接把名字译作“掳掠速临、抢夺快到”
  rationale: 该短语在句中承担专名功能，正文音译可保留其人名身份；脚注则使读者看见其对后文预言的重要语义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“亲近”有意保留希伯来原文的委婉表达；叙事以“就”体现连续动作。神名译作“耶和华”，人名采用中文音译并以脚注解释其意义。
