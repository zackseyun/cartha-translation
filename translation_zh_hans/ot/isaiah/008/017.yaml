base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/017.yaml
  text: And I will wait for Yahweh[a], who hides his face from the house of Jacob[b], and I will hope in him.
translation:
  language: zh_hans
  text: 我要等候雅威；他向雅各家[b]掩面[a]，我要仰望他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掩面”也可译作“正在掩面”或“向来掩面”。希伯来语分词可表示持续中的行动，也可描述具有特征性的行动。
    reason: lexical_alternative
  - marker: b
    text: “雅各家”是对雅各后裔的群体称谓，也就是以色列。
    reason: cultural_note
lexical_decisions:
- source_word: וְחִכִּיתִי
  choice: 我要等候
  rationale: חכה表示带着期待等候；“等候”自然、庄重，也不额外加入“耐心”等原文未明说的含义。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 介词ל标明等候所指向的对象；将יהוה音译为“雅威”，保留经文中的神圣名号。
- source_word: הַמַּסְתִּיר פָּנָיו
  choice: 他向……掩面
  rationale: 保留希伯来语“掩面”的意象及其神学张力，不解释性地改写为“收回恩惠”或“离弃”。分词既可指持续中的动作，也可描述其特征，正文采用简洁自然的“掩面”，并以脚注说明。
- source_word: מִבֵּית יַעֲקֹב
  choice: 向雅各家
  rationale: “雅各家”保留原文的群体性称谓，指雅各的后裔，即以色列；中文“向……掩面”比机械直译“从……掩面”自然。
- source_word: וְקִוֵּיתִי לוֹ
  choice: 我仍要仰望他
  rationale: קוה含等候、盼望和期待之意；“仰望他”在现代中文中自然表达对雅威的期待与信靠，并与前面的“等候”有所区分。“仍”显明在神掩面的处境中继续仰望的语境关系，但不消解原文张力。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为立约之名的性质，避免以称号取代专名。
- issue: 神“掩面”的表达
  choice: 保留“掩面”这一意象
  alternative: 转脸不顾；收回恩惠
  rationale: 原文意象具有盟约与审判层面的神学分量；直保留该说法，避免把其意义限定为某一种解释。
- issue: 分词הַמַּסְתִּיר的时态体意义
  choice: 正文译作简洁的“掩面”，脚注保留持续性与特征性之间的开放性
  alternative: 正在掩面；一向掩面；已经掩面
  rationale: 希伯来语分词可按上下文理解为正在持续或具有特征性的行动；中文若强定为“正在”或“已经”，会缩窄原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“等候—仰望”呈现两个近义动词的诗性呼应；保留“掩面”和“雅各家”等关键希伯来意象。所有脚注标记均置于正文中相应位置。
