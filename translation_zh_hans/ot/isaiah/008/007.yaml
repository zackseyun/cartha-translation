id: ISA.8.7
reference: Isaiah 8:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לָ/כֵ֡ן הִנֵּ֣ה אֲדֹנָ/י֩ מַעֲלֶ֨ה עֲלֵי/הֶ֜ם אֶת מֵ֣י הַ/נָּהָ֗ר הָ/עֲצוּמִים֙ וְ/הָ֣/רַבִּ֔ים אֶת מֶ֥לֶךְ אַשּׁ֖וּר וְ/אֶת כָּל כְּבוֹד֑/וֹ וְ/עָלָה֙ עַל כָּל אֲפִיקָ֔י/ו וְ/הָלַ֖ךְ עַל כָּל גְּדוֹתָֽי/ו־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/007.yaml
  text: Therefore[a], behold, the Lord is bringing up against them the waters of the River, mighty and many—the king of Assyria and all his glory[b]. And it will rise over all its channels and go over all its banks.
translation:
  language: zh_hans
  text: 因此，看哪，主必使大河[a]那汹涌浩瀚的水涌上来攻击他们——就是亚述王和他所有的威势。这水必漫过所有的河道，越过所有的河岸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大河”很可能指幼发拉底河；亚述王和他的全部威势在这里以这条河泛滥的洪水为喻。
    reason: 说明原文以定冠词称呼、却未直呼其名的地理所指，并交代正文同位结构明确给出的洪水比喻关系。
lexical_decisions:
- source_word: וְלָכֵן
  choice: 因此
  rationale: 承接上文百姓拒绝西罗亚缓流之水所导致的后果，保留明确的推论关系。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知话语中引人注意、使场景显得迫近的指示作用，同时维持庄重语体。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是 אֲדֹנָי 而非四字神名；译作“主”准确表达称号，不混同于对 YHWH 的专门译法。
- source_word: מַעֲלֶה עֲלֵיהֶם
  choice: 必使……上涨，淹向他们
  rationale: 表达使役主体是主，并保留水势上涨、冲向对象的生动意象；“必”在汉语中自然表达分词在预言语境里的迫近与确定性。
- source_word: מֵי הַנָּהָר
  choice: 大河……的水
  rationale: “大河”在圣经地理语境中自然指特定的大河，但正文不直接增译“幼发拉底河”，以保留原文称法。
- source_word: הָעֲצוּמִים וְהָרַבִּים
  choice: 汹涌浩瀚
  rationale: 分别传达水势强盛与水量丰沛，并以自然的现代汉语维持洪水意象。
- source_word: אֶת מֶלֶךְ אַשּׁוּר וְאֶת כָּל כְּבוֹדוֹ
  choice: 就是亚述王和他所有的威势
  rationale: 用“就是”清楚呈现与大河之水的同位解释；כבוד 在此语境包含王的显赫、军力及随从，“威势”较贴合入侵力量，同时不把含义限于外在华美。
- source_word: וְעָלָה עַל כָּל אֲפִיקָיו
  choice: 河水必漫过所有的河道
  rationale: 单数动词承接整体洪流意象；补出“河水”避免汉语代词指向含混，“漫过”准确传达水位超过正常河槽。
- source_word: וְהָלַךְ עַל כָּל גְּדוֹתָיו
  choice: 越过所有的堤岸
  rationale: 自然表达洪水突破边界的图景，并保留与上一分句平行递进的结构。
theological_decisions:
- issue: 入侵之水的身份
  choice: 把“大河……的水”保留为洪流比喻，并以“就是”呈现其所指为亚述王及其全部威势。
  alternative: 只按字面描写河水，或直接将正文改写为亚述军队。
  rationale: 希伯来文以同位结构明确连接河水与亚述王；译文同时保留比喻和原文给出的解释，不额外加入教派性理解。
- issue: 主与亚述入侵的关系
  choice: 明确译出“主必使”，保留审判行动由主发起的文本张力。
  alternative: 弱化为亚述之水自行上涨。
  rationale: מַעֲלֶה 是使水上涨的主动表达，主是语法主体；不应淡化神的主权性行动，也不进一步推演原文未说明的系统神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”保留先知文体；“汹涌浩瀚”呈现两个并列形容词的力度与数量含义；避免直接增译“幼发拉底河”，将较可能的地理识别置于脚注。
