- from: 因此，看哪，主必使大河汹涌浩瀚的水上涨，淹向他们——就是亚述王和他所有的威势[a]。河水必漫过所有的河道，越过所有的堤岸。
  to: 因此，看哪，主必使大河[a]那汹涌浩瀚的水涌上来攻击他们——就是亚述王和他所有的威势。这水必漫过所有的河道，越过所有的河岸。
