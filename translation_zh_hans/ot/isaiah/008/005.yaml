  text: וַ/יֹּ֣סֶף יְהוָ֔ה דַּבֵּ֥ר אֵלַ֛/י ע֖וֹד לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/005.yaml
  text: Yahweh spoke to me again[a], saying,
translation:
  language: zh_hans
  text: 耶和华又对我说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“耶和华又加添向我说话，说。”这是表示“耶和华又对我说”的惯用表达。
    reason: 说明希伯来语中“加添／又”与说话动词连用的惯用结构，以及正文采用自然汉语表达的原因。
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: 又
  rationale: 这里的“增添”与说话动词连用，是希伯来语表达再次行动的惯用方式；译作“又”自然地传达重复之意。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名“耶和华”呈现四字神名，保留其作为名字而非称号的性质。
- source_word: דַּבֵּר אֵלַי
  choice: 对我说
  rationale: דבר 表示“说话”，אֶל 指向说话对象；汉语“对我说”准确而自然。
- source_word: עוֹד
  choice: 又
  rationale: 在本语境中表示神再次向先知说话；其意义与 וַיֹּסֶף 共同由汉语“又”简洁表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出下一节的直接引语；汉语用“说”并加冒号最为自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文保留为专名；“耶和华”是现代中文普通读者最熟悉且通行的形式，同时不以“主”这一称号取代神名。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“又对我说”自然承接上下文；冒号表明下一节将出现直接引语。
