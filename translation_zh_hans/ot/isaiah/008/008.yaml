  text: וְ/חָלַ֤ף בִּֽ/יהוּדָה֙ שָׁטַ֣ף וְ/עָבַ֔ר עַד צַוָּ֖אר יַגִּ֑יעַ וְ/הָיָה֙ מֻטּ֣וֹת כְּנָפָ֔י/ו מְלֹ֥א רֹֽחַב אַרְצְ/ךָ֖ עִמָּ֥נוּ אֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/008.yaml
  text: It will sweep on into Judah; it will overflow and pass through; it will reach up to the neck. And the spread of its wings will fill the breadth of your land[a], O Immanuel.
translation:
  language: zh_hans
  text: 它必席卷犹大，泛滥而过，水势直涨到颈项。它展开的翅膀必遮满你国土的全境。以马内利[a]啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以马内利”意思是“上帝与我们同在”。
    reason: 说明希伯来名字עִמָּנוּ אֵל的字面含义，同时在正文中保留其专名形式。
lexical_decisions:
- source_word: וְחָלַף בִּיהוּדָה
  choice: 它必席卷犹大
  rationale: חָלַף本可表示“经过”，但承接上一节大河洪水的比喻，此处用“席卷”表达洪流侵入犹大的推进和破坏力；בְּ在运动语境中体现进入并经过该地。
- source_word: שָׁטַף וְעָבַר
  choice: 泛滥而过
  rationale: 保留洪水上涨、漫溢并穿越全境的连续动态，也避免用两个近义动词造成生硬重复。
- source_word: עַד צַוָּאר יַגִּיעַ
  choice: 水涨直到颈项
  rationale: 原文直译为“达到颈项”，描绘几乎完全淹没、危在旦夕却尚未灭顶的景象；补出“水涨”使汉语中的洪水意象自然清楚。
- source_word: מֻטּוֹת כְּנָפָיו
  choice: 它伸展的翅膀
  rationale: מֻטּוֹת表示伸展或铺开；保留原文由洪水转为展翅的复合意象，不将其解释性改写为军队或疆域。
- source_word: מְלֹא רֹחַב אַרְצְךָ
  choice: 必铺满你广阔的国土
  rationale: 以“铺满”对应מְלֹא的充满之意，以“广阔的国土”自然表达רֹחַב אַרְצְךָ所指国土的整个宽广范围。
- source_word: עִמָּנוּ אֵל
  choice: 以马内利啊
  rationale: 结合以赛亚书7:14，此处按人名及直接呼语处理；采用通行音译，并以“啊”自然标明呼告语气。
theological_decisions:
- issue: עִמָּנוּ אֵל应当作为名字还是“上帝与我们同在”这一陈述来翻译
  choice: 正文译作直接称呼“以马内利啊”
  alternative: 译作“上帝与我们同在”或“与我们同在的上帝啊”
  rationale: 该表达在以赛亚书7:14已经作为孩子的名字出现，本节又紧接第二人称“你的国土”，很可能是在直接呼唤这位具名者。正文保留名字可维持文学呼应；脚注说明词义，同时不排除读者听见名字本身所承载的神学宣告。
- issue: “你的国土”所暗示的以马内利与犹大土地之关系
  choice: 保留第二人称所有表达，不进一步解释
  alternative: 明确解释为以马内利拥有、治理或保护犹大
  rationale: 原文只说“你的地”，并未具体说明这种归属关系；译文不将其中的神学张力扩展为某种特定身份或统治论断。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“席卷、泛滥、水涨”维持洪水的强烈画面，“伸展的翅膀”则刻意保留原文突然交叠的翅翼意象，不作解释性调和。标点将末尾呼语独立成句，以呈现希伯来语末置称呼的力度。
