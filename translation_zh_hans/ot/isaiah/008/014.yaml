  text: וְ/הָיָ֖ה לְ/מִקְדָּ֑שׁ וּ/לְ/אֶ֣בֶן נֶ֠גֶף וּ/לְ/צ֨וּר מִכְשׁ֜וֹל לִ/שְׁנֵ֨י בָתֵּ֤י יִשְׂרָאֵל֙ לְ/פַ֣ח וּ/לְ/מוֹקֵ֔שׁ לְ/יוֹשֵׁ֖ב יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/014.yaml
  text: And he will become a sanctuary[a], but a stone to strike against and a rock to stumble over for both houses of Israel[b], a trap and a snare to the inhabitant of Jerusalem.
translation:
  language: zh_hans
  text: 他必成为圣所[a]；但对以色列两家，他却是使人撞上的石头、使人绊倒的磐石；对耶路撒冷的居民[b]，他是圈套，是网罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”也可译作“神圣之处”。本词兼有分别为圣之地和庇护之处的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“耶路撒冷的居住者”，语法上是单数，在这里可作集合称谓，指耶路撒冷的居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 他必成为
  rationale: 此处在先知话语中表达将来意义；“成为”自然引出同一位所呈现的不同作用，并保留上下文中的阳性单数指称。
- source_word: לְמִקְדָּשׁ
  choice: 圣所
  rationale: 保留该词的神圣、敬拜场所含义以及语境中隐含的庇护意味，不将其缩窄为单纯的“避难所”。
- source_word: אֶבֶן נֶגֶף
  choice: 使人碰撞的石头
  rationale: נֶגֶף含撞击、触碰而受挫之意；译作“碰撞”可与下一短语明确的“绊倒”有所区分。
- source_word: צוּר מִכְשׁוֹל
  choice: 使人绊倒的磐石
  rationale: צוּר为“磐石”，מִכְשׁוֹל指造成绊跌之物；此译保留具体意象和两个短语之间的平行。
- source_word: לִשְׁנֵי בָתֵּי יִשְׂרָאֵל
  choice: 对以色列两家
  rationale: 直译“两家”，保留以色列分为两个王国或政治实体的历史指向。
- source_word: לְפַח
  choice: 圈套
  rationale: פַּח常指捕捉猎物、尤其飞鸟的器具；“圈套”是现代汉语中清楚而概括的表达。
- source_word: וּלְמוֹקֵשׁ
  choice: 网罗
  rationale: מוֹקֵשׁ指使猎物被缠住或捕获的罗网；与“圈套”并列，保留希伯来文的双重意象。
- source_word: לְיוֹשֵׁב יְרוּשָׁלִָם
  choice: 对耶路撒冷的居民
  rationale: 原文使用阳性单数分词，但在此具有集合意义；汉语用“居民”既自然，也不必强行标明单复数。
theological_decisions:
- issue: “他”的所指
  choice: 保留“他”，按紧邻上文理解为耶和华
  alternative: 直接译成“耶和华”，或理解为与先知信息相关的非人称所指
  rationale: 以赛亚书8:13中最近的所指是耶和华；但本节原文没有重述神名，因此译文保留代词，以免超出措辞本身。
- issue: 圣所与审判意象之间的张力
  choice: 同时保留“圣所”和石头、磐石、圈套、网罗等意象，并以“但……却”显明转折
  alternative: 把“圣所”解释性地译为“避难所”，或淡化后半节的审判意味
  rationale: 原文把同一位既作圣所又成为碰撞、绊倒和被捕之因并置；译文不消解这一神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“使人碰撞的石头”与“使人绊倒的磐石”刻意区分两个相近的希伯来语意象；分号和重复的“对”使句法关系清楚，同时保留诗性排比。
