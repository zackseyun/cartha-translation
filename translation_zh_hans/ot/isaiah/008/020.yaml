base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/020.yaml
  text: To the law and to the testimony! If they do not speak according to this word[b][a], there is no dawn for them.
translation:
  language: zh_hans
  text: 当以训诲[a]和见证为准！他们若不照这话说，就没有曙光[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“律法”。希伯来语“妥拉”（תּוֹרָה）既可指训诲，也可较具体地指律法。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语末句十分紧凑，也可译作：“若不照这话说——这等人没有曙光。”又有人理解为所说的话本身“没有曙光”。
    reason: alternative_reading
lexical_decisions:
- source_word: לְתוֹרָה
  choice: 当以训诲……为准
  rationale: תּוֹרָה在此可指上帝所赐的训诲，也可指律法。“训诲”保留其较宽的语义，并与先知语境中寻求指引的主题相合；加上“为准”自然表达希伯来语呼吁人转向权威标准的简洁说法。
- source_word: וְלִתְעוּדָה
  choice: 和见证
  rationale: תְּעוּדָה指见证、证言或凭据。“见证”既贴近原词，也能表达具有权威性的启示记录，并与“训诲”形成庄重的并列。
- source_word: אִם לֹא
  choice: 若不
  rationale: 按通常的条件用法处理，引出不遵照这话而说的后果；不把它强行解释为起誓或强调语气。
- source_word: יֹאמְרוּ
  choice: 说
  rationale: אָמַר的基本义为“说”。这里涵盖发言、教导或给出指引，现代汉语用“说”简洁自然。
- source_word: כַּדָּבָר הַזֶּה
  choice: 照这话
  rationale: דָּבָר可指话、事情或信息。“照这话”保留其作为权威言语的含义，也自然表达前缀כ的“按照”。
- source_word: אֲשֶׁר אֵין לוֹ שָׁחַר
  choice: 就没有曙光
  rationale: שַׁחַר直指黎明或曙光；采用“曙光”保留黑暗与光明的先知性意象，不解释性地改成“希望”。上下文中的复数主语在中文里可自然承接为“他们……没有曙光”。
theological_decisions:
- issue: 末句的所指与句法关系
  choice: 理解为不照上帝启示之标准说话的人没有曙光
  alternative: 也可理解为“这等人没有曙光”，或把末句关联于所说的“话”，意为其中没有曙光；另有人把אִם לֹא理解为强调或起誓语气
  rationale: 上下文将求问交鬼者、行巫术者与转向上帝的训诲和见证相对照，因此主译把末句作为对“不照这话说”的人的警告。但希伯来语末句十分紧凑，关系代词אֲשֶׁר和单数代词לוֹ的所指存在解释空间，故以脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“当以……为准”传达原文开头简短有力的呼吁；“曙光”保留原文意象。所有译注标记均已置于正文相应位置。
