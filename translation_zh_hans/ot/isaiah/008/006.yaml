  text: יַ֗עַן כִּ֤י מָאַס֙ הָ/עָ֣ם הַ/זֶּ֔ה אֵ֚ת מֵ֣י הַ/שִּׁלֹ֔חַ הַ/הֹלְכִ֖ים לְ/אַ֑ט וּ/מְשׂ֥וֹשׂ אֶת רְצִ֖ין וּ/בֶן רְמַלְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/006.yaml
  text: Because this people has rejected the waters of Shiloah that flow gently[a], and rejoices over Rezin and the son of Remaliah[b],
translation:
  language: zh_hans
  text: 因为这百姓弃绝示罗亚[a]缓缓流淌的水，又因利汛和利玛利的儿子而欢喜[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示罗亚”是希伯来语名称；希腊语传统作“西罗亚”。
    reason: lexical_alternative
  - marker: b
    text: 本句原文较难理解。或译：“又在利汛和利玛利的儿子面前战兢。”希伯来文本作“欢喜”，但有人根据上下文作不同理解。
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן כִּי
  choice: 因为
  rationale: 复合连词引出下一节审判的缘由；“因为”自然、清楚地保留因果关系。
- source_word: מָאַס
  choice: 弃绝
  rationale: 该动词表示拒绝、摒弃；“弃绝”体现坚决拒绝，又不把重点过度转为情绪上的轻蔑。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留希伯来语单数集合名词和先知话语的表达；“百姓”也比“国家”更能体现关系性的语境。
- source_word: מֵי הַשִּׁלֹחַ
  choice: 示罗亚的水
  rationale: “示罗亚”按希伯来语 שִׁלֹחַ 的形式音译；较为人熟知、源于希腊语传统的“西罗亚”列入脚注。
- source_word: הַהֹלְכִים לְאַט
  choice: 缓缓流淌
  rationale: 原文直译为“缓慢／轻柔地行走”，用于水时译作“缓缓流淌”自然，并保留下节与滔滔大河的对比。
- source_word: וּמְשׂוֹשׂ
  choice: 又……而欢喜
  rationale: 马所拉文本自然来自“欢喜、雀跃”之意的词根 שׂושׂ；中文以“因……而欢喜”表达其以人名为对象的关系，同时不把疑难处改成推测性的负面含义。
- source_word: אֶת רְצִין וּבֶן רְמַלְיָהוּ
  choice: 利汛和利玛利的儿子
  rationale: 人名按通行中文形式处理；保留“利玛利的儿子”这一希伯来表达，不直接补明为比加，以免消除原文可能带有的疏离或轻蔑语气。
theological_decisions:
- issue: 疑难短语 וּמְשׂוֹשׂ אֶת רְצִין וּבֶן רְמַלְיָהוּ 的理解
  choice: 正文依马所拉文本译作“又因利汛和利玛利的儿子而欢喜”
  alternative: “又在利汛和利玛利的儿子面前战兢”
  rationale: 现存希伯来文本所用形式自然表达“欢喜、雀跃”。虽然上下文使本句难解，也有人按恐惧或惊慌来理解，但不应为使语境顺畅而在正文中以推测性的负面意思取代马所拉文本；因此正文保留“欢喜”，另在脚注说明异解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弃绝”保留先知话语的力度；“缓缓流淌”符合现代汉语对水流的自然描述。经文在本节末承接下一节，故保留逗号。
