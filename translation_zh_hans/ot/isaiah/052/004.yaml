  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה מִצְרַ֛יִם יָֽרַד עַמִּ֥/י בָ/רִֽאשֹׁנָ֖ה לָ/ג֣וּר שָׁ֑ם וְ/אַשּׁ֖וּר בְּ/אֶ֥פֶס עֲשָׁקֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/004.yaml
  text: 'For thus says the Lord GOD: My people went down at first to Egypt to sojourn there[b][a], and Assyria oppressed them without cause.'
translation:
  language: zh_hans
  text: '因为主耶和华如此说：


    “起初，我的子民下到埃及，在那里寄居；


    亚述无故[b]欺压了他们[a]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“欺压了他”，把“我的子民”视为一个整体。
    reason: 说明希伯来语单数代词后缀及其群体性所指。
  - marker: b
    text: “无故”也可译作“白白地”或“无偿地”。
    reason: 保留בְּאֶפֶס可指“白白地／无偿地”的词义可能。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达“主”和神的专名יהוה；“主耶和华”是现代中文圣经语体中清楚、庄重而自然的复合称谓。
- source_word: מִצְרַיִם יָרַד
  choice: 下到埃及
  rationale: 保留希伯来语以“下去”描述前往埃及的常用地理表达，中文也通顺。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 准确表达第一人称所属关系及群体性；“子民”适合神谕语境，同时普通读者容易理解。
- source_word: בָרִאשֹׁנָה
  choice: 起初
  rationale: 表示较早发生的历史事件，并与随后提到的亚述形成时间和处境上的对照。
- source_word: לָגוּר
  choice: 寄居
  rationale: 保留גור所含作为外来者居住、并非本土定居的意味。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 语境所指是亚述这一国家或势力，采用标准中文名称。
- source_word: בְּאֶפֶס
  choice: 无故
  rationale: 简洁表达“没有缘由、平白地”的主要语境含义，同时以脚注保留“白白地／毫无所得”等可能性。
- source_word: עֲשָׁקוֹ
  choice: 欺压了他们
  rationale: עשק表示欺压、压榨；希伯来语宾语后缀为阳性单数，回指作为整体的“我的子民”。中文用“他们”自然地表达该群体，脚注说明原文形式。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文明确同时使用“主”与יהוה。译作“主耶和华”既避免把专名化为普通称号，也不引入额外的宗派解释。
- issue: עֲשָׁקוֹ中单数宾语后缀的处理
  choice: 正文按中文习惯译为“他们”，脚注注明原文为单数“他”
  alternative: 欺压了他
  rationale: 原文把“我的子民”视为一个整体，故使用阳性单数后缀；中文若直译“他”容易被误解为另一个男性个体，用“他们”能传达实际所指，脚注则保留原文的整体人格化表达。
- issue: בְּאֶפֶס所表达的欺压性质
  choice: 无故
  alternative: 白白地／毫无所得
  rationale: 上下文强调亚述对神子民的无理欺压，“无故”最自然；但该短语也可理解为“白白地”或“没有所得”，因此不把词义范围完全封闭，并在脚注注明。
translation_notes:
  register: 采用现代、庄重而易懂的神谕语体。“下到埃及”和“寄居”保留原文的历史地理与外来居民色彩；以“却”自然呈现并列分句间的对照，但不额外说明亚述事件的具体年代。
