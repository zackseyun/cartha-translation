  text: לָ/כֵ֛ן יֵדַ֥ע עַמִּ֖/י שְׁמִ֑/י לָ/כֵן֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי אֲנִי ה֥וּא הַֽ/מְדַבֵּ֖ר הִנֵּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/006.yaml
  text: 'Therefore my people will know my name[a]; therefore on that day they will know that I am he who speaks: Here I am.'
translation:
  language: zh_hans
  text: 所以，我的子民必知道我的名；所以，到那日，他们必知道，是我在说话[a]：“我在这里！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我就是那说话的。”
    reason: 希伯来语“我就是他”和“说话的”可连读，构成强调性的自我指认。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 表示由上文引出的结果；两次均保留，以体现希伯来文的重复和先知话语的强调。
- source_word: יֵדַע
  choice: 必知道
  rationale: 未完成式在此表达将来的预告；“必”也传达应许的确定性。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 保留群体单数及圣约语境中的归属意味，同时符合现代中文圣经语体。
- source_word: שְׁמִי
  choice: 我的名
  rationale: 直译“名”，保留其可能涵盖身份、声誉和启示之品格的丰富含义，不在正文中加以解释。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 自然、庄重的中文先知性时间表达。
- source_word: כִּי
  choice: （以“是”引出所知内容）
  rationale: 此处最自然地理解为引出“知道”的内容；中文无需另译为因果连词。
- source_word: אֲנִי הוּא הַמְדַבֵּר
  choice: 是我在说话
  rationale: 把强调性的自我指认与分词连为自然中文，既保留“就是我”的强调，也不把短语过度神学化。
- source_word: הִנֵּנִי
  choice: 看哪，是我！
  rationale: 兼顾 הִנֵּה 的提示、临在意味与第一人称附着成分；比单纯“我在这里”更适合此处神亲自显明并发言的语境。
theological_decisions:
- issue: אֲנִי הוּא 的强调性神圣自我指认
  choice: 是我在说话
  alternative: 我就是那一位，是我在说话
  rationale: 希伯来语可将 אֲנִי הוּא 单独视为庄重的“我就是他/我就是那一位”，也可与 הַמְדַבֵּר 连读为“说话的就是我”。正文采用自然且紧凑的后一表达，脚注提示前一种句法可能，以保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留两次“所以”和“我的名”等原文特征；引号标明末句为神直接的自我宣告。
