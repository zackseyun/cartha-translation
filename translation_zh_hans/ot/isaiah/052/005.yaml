  text: וְ/עַתָּ֤ה מי ל/י פֹה֙ נְאֻם יְהוָ֔ה כִּֽי לֻקַּ֥ח עַמִּ֖/י חִנָּ֑ם משל/ו יְהֵילִ֨ילוּ֙ נְאֻם יְהוָ֔ה וְ/תָמִ֥יד כָּל הַ/יּ֖וֹם שְׁמִ֥/י מִנֹּאָֽץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/005.yaml
  text: And now[a], what do I have here? declares Yahweh. For my people have been taken away for nothing; those who rule over them wail, declares Yahweh, and continually, all day long[b], my name is despised.
translation:
  language: zh_hans
  text: “如今，我在这里有什么呢？”雅威宣告说：“因为我的子民被白白地掳去；统治他们的人哀号，”雅威宣告说，“我的名终日不断受人藐视[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“我的名终日不断遭到亵渎。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转折，现代汉语用“现在”自然表达；句首引号内的语气已足以承接上文，无须机械译出连接词。
- source_word: מַה־לִּי פֹה
  choice: 我在这里还有什么可做的呢？
  rationale: 这是带有抗议意味的修辞问句。直译“我在这里有什么”在汉语中语意不明；加“可做的”使其自然，同时保留原文的反问张力。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: 保留先知性宣告公式的权威语气，并以“雅威”音译四字神名。
- source_word: כִּי לֻקַּח עַמִּי
  choice: 因为我的子民被……掳走
  rationale: 被动形式保留子民遭受行动的焦点；“掳走”符合本段被掳语境，也比泛泛的“带走”明确。
- source_word: חִנָּם
  choice: 无偿
  rationale: 可兼顾“没有付出代价、白白地”的含义，不把原文过度限定为“无缘无故”。
- source_word: מֹשְׁלָיו
  choice: 辖制他们的人
  rationale: 该词基本义为统治者；“辖制”既保留统治关系，也自然显出上下文中的压迫色彩，而不直接改译为“压迫者”。代词按“我的子民”这一集合名词的复数所指处理。
- source_word: יְהֵילִילוּ
  choice: 哀号
  rationale: 表达大声哀鸣或号叫，比“哭泣”更能保留该动词强烈、公开的声音色彩。
- source_word: וְתָמִיד כָּל־הַיּוֹם
  choice: 终日不断
  rationale: 同时表达“持续”和“整日”两个要素，以简洁自然的汉语保留原文的强化效果。
- source_word: שְׁמִי מִנֹּאָץ
  choice: 我的名……受到藐视
  rationale: “藐视”保留 נאץ 较宽的鄙弃、轻蔑含义；被动表达与原文分词形式相应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较贴近学界通常重构发音的“雅威”，而不是以称号替代。
- issue: מִנֹּאָץ 对神名受辱的具体程度
  choice: 受到藐视
  alternative: 遭到亵渎
  rationale: 原词可表示轻蔑、弃绝，也可在涉及神名时表达亵渎。正文采用较宽的译法，脚注保留更强的宗教性表达，避免消除词义张力。
- issue: מֹשְׁלָיו 所指人物的性质
  choice: 辖制他们的人
  alternative: 压迫他们的人
  rationale: 原词直接表示统治者，但语境带有压迫意味。正文不将其完全解释成“压迫者”，脚注说明这一可能含义。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。以直接引语呈现两次“雅威宣告说”，使说话层次清楚；“终日不断”避免生硬重复，同时保留原文持续整日的强调。所有脚注标记均置于正文相应位置。
