  terminology: “雅威”恰当对应 יהוה；“我的名”及“藐视／亵渎”的正文与脚注层级合宜。正文改用“统治他们的人”，脚注仅说明在语境中可译为“压迫他们的人”，避免把解释当作原文的确定词义。
