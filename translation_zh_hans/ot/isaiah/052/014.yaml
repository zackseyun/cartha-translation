id: ISA.52.14
reference: Isaiah 52:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר שָׁמְמ֤וּ עָלֶ֨י/ךָ֙ רַבִּ֔ים כֵּן מִשְׁחַ֥ת מֵ/אִ֖ישׁ מַרְאֵ֑/הוּ וְ/תֹאֲר֖/וֹ מִ/בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/014.yaml
  text: Just as many were appalled at you—so disfigured was his appearance[a], beyond that of a man[c][b], and his form beyond the sons of man—
translation:
  language: zh_hans
  text: 正如许多人因你而惊骇，照样，他的容貌[a]毁损得不像人[b]，他的形体也不像世人[c]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在本节中由“你”转为“他的”：许多人因你而惊骇……他的容貌……他的形体。
    reason: alternative_reading
  - marker: b
    text: “毁损”也可译作“损毁”或“变得残破”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“人的众子”，是泛指人类的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 正如……照样
  rationale: 保留希伯来文的关联比较结构；本句的比较将在下一节继续展开。
- source_word: שָׁמְמוּ
  choice: 惊骇
  rationale: 该动词在此表达面对仆人容貌时震惊、骇异的反应，不只是一般的惊讶。
- source_word: עָלֶיךָ
  choice: 因你
  rationale: 保留马所拉文本的第二人称单数，不将其协调为第三人称。中文“因你而惊骇”自然表达因所见之人而产生的震骇。
- source_word: מִשְׁחַת
  choice: 毁损
  rationale: 表达容貌遭到严重破坏、变形的含义；“毁损”比“损坏”庄重，也比只强调外形变化的“毁容”更贴近原词的毁坏意味。
- source_word: מֵאִישׁ מַרְאֵהוּ
  choice: 他的容貌毁损得不像人
  rationale: מן在这里表示比较或超出常态；译文传达其容貌已超出正常人的样貌，同时保持现代中文的清晰自然。
- source_word: וְתֹאֲרוֹ
  choice: 他的形体
  rationale: “形体”与“容貌”形成对应，也保留מַרְאֶה与תֹּאַר之间的词义区别。
- source_word: מִבְּנֵי אָדָם
  choice: 不像世人
  rationale: 该表达字面涉及“人的众子”，实际泛指人类；“世人”简洁、庄重，并适合现代中文。
theological_decisions:
- issue: 本节中语法人称的转换
  choice: 保留从第二人称“你”转为第三人称“他的”
  alternative: 全节统一译成第三人称“他”
  rationale: 马所拉文本先直接称呼“你”，随后说“他的容貌”和“他的形体”。这一突兀转换属于原文现象，不应为求顺畅而消除。
- issue: 容貌受损程度的表达
  choice: 译为“毁损得不像人”
  alternative: 译为“比任何人都毁损”或“失去人的样貌”
  rationale: 所选译法保留比较结构及其强烈张力，却不额外断定此人已不具人的本质；经文谈的是可见的容貌与形体。
- issue: בְּנֵי אָדָם的人类泛称
  choice: 译为“世人”
  alternative: 直译为“人的众子”或译为“人类”
  rationale: “世人”准确传达此希伯来习语泛指人类的作用，避免在中文中造成仅指男性后代的误解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“正如……照样”保留跨节延续的比较结构，句末破折号提示语意尚未完结。
