  naturalness: 全文庄重通顺。“照样”在承接上一节的比较结构时可用；“闭口无言”自然。“洒净许多邦国”虽可理解，但搭配略显生硬，且“邦国”在现代普通话中较少用。“向许多列国施行洒礼”更顺畅，也较明确地传达原文动词的礼仪性用法。
  terminology: “列国”是中文圣经语体中对应גּוֹיִם的稳妥用语，并不预设后期“外邦人”的神学分类。“施行洒礼”避免将נזה直接等同于“洁净”；脚注保留“使……惊奇”的重要异解。
