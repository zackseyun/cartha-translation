base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/015.yaml
  text: So he will sprinkle many nations; kings will shut their mouths because of him. For they will see what had not been told to them[a], and they will understand what they had not heard.
translation:
  language: zh_hans
  text: 照样，他必向许多列国施行洒礼[a]；君王必因他闭口无言。因为他们将看见从未有人向他们讲述的事，也将明白他们从未听闻的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必使许多列国惊奇。”这个希伯来语动词通常理解为“洒”或“施行洒礼”，但有人认为此处是“使惊奇”的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  choice: 照样
  rationale: 承接52:14的比较结构，表达“正如……照样……”的对应关系，比单纯的“所以”更能保留希伯来文的比较意味。
- source_word: יַזֶּה
  choice: 洒净
  rationale: נזה的使役式通常指礼仪性的洒，译作“洒净”既保留洒的具体动作，也在中文中自然传达其洁净意味；“使惊奇”作为重要异解列入脚注。
- source_word: גּוֹיִם רַבִּים
  choice: 许多邦国
  rationale: 指众多国家或民族群体；“邦国”兼具国际范围与庄重语体，又避免把它限定为后期语境中的“外邦人”。
- source_word: עָלָיו
  choice: 因他
  rationale: 在君王闭口的语境中，介词表达他是君王震撼无言的缘由；“因他”简洁，并保留其所指关系。
- source_word: יִקְפְּצוּ מְלָכִים פִּיהֶם
  choice: 君王必因他闭口无言
  rationale: 保留“闭口”的具体意象，同时以“无言”清楚表达因震撼而沉默的惯用意义。
- source_word: אֲשֶׁר לֹא סֻפַּר לָהֶם רָאוּ
  choice: 他们将看见未曾有人向他们讲述的事
  rationale: 呈现此前无人向他们述说、如今却亲眼看见的对比；中文用“未曾”自然表达先于“看见”的状态。
- source_word: וַאֲשֶׁר לֹא שָׁמְעוּ הִתְבּוֹנָנוּ
  choice: 也将明白他们未曾听闻的事
  rationale: התבונן在此指领会、洞察，不只是思考；“明白”准确而通俗，并与前句形成平行。
theological_decisions:
- issue: 仆人使许多邦国יַזֶּה的含义
  choice: 他必洒净许多邦国
  alternative: 他必使许多邦国惊奇
  rationale: 该动词使役式的通常词义是“洒”，常见于礼仪与洁净语境；“洒净”保留可能的祭司性、洁净性意象，但不进一步规定其教义机制。鉴于部分学者按上下文理解为“使惊奇”，脚注明确保留这一真实的词义争议。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“照样”保留与上一节的对应关系；“闭口无言”保留原文意象并自然表达震惊；全句维持先看见、后明白的平行结构。
