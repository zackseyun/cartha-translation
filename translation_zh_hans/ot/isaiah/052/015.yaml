  rationale: 修订仅收窄“洒净”所加入的结果性含义，并以“施行洒礼”在现代汉语中自然表达原文的礼仪性“洒”及其直接宾语结构；“列国”取代较少见的“邦国”。其余句法、时态取向和“看见／明白”的平行关系均保留。
