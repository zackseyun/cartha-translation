  text: חָשַׂ֤ף יְהוָה֙ אֶת זְר֣וֹעַ קָדְשׁ֔/וֹ לְ/עֵינֵ֖י כָּל הַ/גּוֹיִ֑ם וְ/רָאוּ֙ כָּל אַפְסֵי אָ֔רֶץ אֵ֖ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/010.yaml
  text: Yahweh has bared his holy arm before the eyes of all the nations[c][b][a], and all the ends of the earth will see the salvation of our God.
translation:
  language: zh_hans
  text: 雅威在万国眼前[b]露出了他的圣臂[a]；地极的人都必看见我们上帝的救恩[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“揭开了”或“袒露了”。希伯来语动词描绘把手臂露出来、准备采取决定性行动的形象。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在万国众目之下”。
    reason: lexical_alternative
  - marker: c
    text: “救恩”也可译作“拯救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׂף
  choice: 露出了
  rationale: 该动词意为揭开、露出。译作“露出了”保留卷袖露臂、准备采取决定性行动的鲜明意象，也符合完成式所表达的已然行动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语通行音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以称号代替。
- source_word: זְרוֹעַ קָדְשׁוֹ
  choice: 他的圣臂
  rationale: 直译并保留拟人化比喻，表达雅威施行拯救的大能；“圣臂”自然凝练，不将具体诗歌意象抽象化为“神圣能力”。
- source_word: לְעֵינֵי כָּל הַגּוֹיִם
  choice: 在万国眼前
  rationale: 既保留“眼前”的视觉意象，也传达这行动公开显明、为万国所见的含义。
- source_word: וְרָאוּ
  choice: 都必看见
  rationale: 虽为完成式形态，但在先知性宣告中承接前句已然行动，表达其确定将发生的结果；“必”体现确定性而不过分解释时态。
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: 地极的人都
  rationale: “地极”保留希伯来语惯用意象；补出“人”使现代汉语中作为“看见”的主体更自然，而“都”对应 כָּל。
- source_word: יְשׁוּעַת אֱלֹהֵינוּ
  choice: 我们上帝的救恩
  rationale: “救恩”兼顾实际拯救与神学分量，并保留“我们”的第一人称复数立场和所属关系。
theological_decisions:
- issue: 上帝行动的拟人化表达
  choice: 保留“他的圣臂”这一具体比喻。
  alternative: 译为“他的神圣能力”或“他圣洁的大能”。
  rationale: 原文明确使用身体意象；保留该意象可维持诗歌力度，并避免把经文预先解释成抽象教义。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名。译作“雅威”旨在以音译保留专名，而不是用称号取代。
- issue: וְרָאוּ 的时间与情态
  choice: 译作“都必看见”，理解为确定的将来结果。
  alternative: “都看见了”或“都将看见”。
  rationale: 希伯来语完成式可在先知话语中把尚未来到的事说成确定事实；“必看见”既表达未来指向和确定性，也保留先知性宣告的力度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在万国眼前”与“圣臂”有意保留原文的视觉和身体意象；分号呈现前后两项行动及其结果。“上帝”用于 אֱלֹהִים，“雅威”用于专名 יְהוָה，以区分称谓与神名。
