  text: ס֤וּרוּ ס֨וּרוּ֙ צְא֣וּ מִ/שָּׁ֔ם טָמֵ֖א אַל תִּגָּ֑עוּ צְא֣וּ מִ/תּוֹכָ֔/הּ הִבָּ֕רוּ נֹשְׂאֵ֖י כְּלֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/011.yaml
  text: Turn away[a], turn away; go out from there. Touch no unclean thing. Go out from her midst; purify yourselves[c][b], you who carry the vessels of Yahweh.
translation:
  language: zh_hans
  text: 离开吧，离开吧！从那里出来！不要触碰不洁之物。要从她中间出来[a]；你们这些携带耶和华器皿的人，要洁净自己[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“从她中间”；阴性代词可能指被视为女性的那座城。
    reason: lexical_alternative
  - marker: b
    text: 或译：“要洁净”或“要自洁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  choice: 离开吧
  rationale: 复数命令式连续重复，表达紧迫而强烈的分别、离去之召；译作“离开”自然明确，又不与随后强调“出来”的 צְאוּ 完全重合。
- source_word: צְאוּ
  choice: 出来
  rationale: יצא 的复数命令式，直接表示从某处出去；在中文语境中“从那里出来”最自然。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 保留原文简明的地点指示，不擅自明确为巴比伦或其他城市。
- source_word: טָמֵא אַל תִּגָּעוּ
  choice: 不要触碰不洁之物
  rationale: טָמֵא 在此作名词性用法；“不洁之物”保留礼仪与道德层面均可能包含的含义。“触碰”准确传达 נגע。
- source_word: מִתּוֹכָהּ
  choice: 从她中间
  rationale: 保留第三人称阴性单数后缀，可能指语境中被拟人化为女性的城市；不将其扁平化为无性别的“其中”。
- source_word: הִבָּרוּ
  choice: 洁净自己
  rationale: 该复数命令式在此具有洁净、使自己纯洁的含义，与抬耶和华器皿的圣洁要求相称，同时不把含义限定为纯礼仪或纯道德洁净。
- source_word: נֹשְׂאֵי
  choice: 你们这些抬……的人
  rationale: 分词在此作呼语；“抬”贴合携带圣殿器皿的具体动作，也保持现代中文的可读性。
- source_word: כְּלֵי יְהוָה
  choice: 耶和华的器皿
  rationale: כְּלֵי 在语境中指用于敬拜的圣殿器具；“器皿”保留其礼仪背景。יְהוָה 采用现代中文圣经传统中通行的专名“耶和华”。
theological_decisions:
- issue: 不洁与洁净的性质
  choice: 保留“不洁之物”和“洁净自己”的圣洁语言，不限定为仅属礼仪或仅属道德的意义。
  alternative: 可解释为单纯避免礼仪污染，或单纯脱离巴比伦的道德罪恶。
  rationale: 抬圣所器皿的背景明显涉及礼仪圣洁，而离开那城的语境也含有道德分别的力量；译文保存这两方面的张力。
- issue: 阴性代词所指
  choice: 正文保留“她”，脚注说明可能指被视为女性的城。
  alternative: 译成“其中”或直接补明“巴比伦城中”。
  rationale: 原文只有阴性单数后缀，具体所指需由上下文判断；不宜在正文中过度明确。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。重复命令与短句保留先知话语的紧迫节奏；“耶和华的器皿”保持圣所语境。“她”虽略带直译色彩，但用于保存原文阴性指称，并以脚注辅助理解。
