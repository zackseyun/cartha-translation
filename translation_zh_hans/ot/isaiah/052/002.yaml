id: ISA.52.2
reference: Isaiah 52:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִתְנַעֲרִ֧י מֵ/עָפָ֛ר ק֥וּמִי שְּׁבִ֖י יְרֽוּשָׁלִָ֑ם התפתחו מוֹסְרֵ֣י צַוָּארֵ֔/ךְ שְׁבִיָּ֖ה בַּת צִיּֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/002.yaml
  text: Shake yourself from the dust[a]; rise up, sit down, Jerusalem. Loosen the bonds of your neck[c][b], captive daughter Zion.
translation:
  language: zh_hans
  text: 抖掉身上的尘土；起来，坐下吧[a]，耶路撒冷！挣脱你颈上的捆索[b]吧，被掳的锡安女子[c]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“坐”。在这里，从尘土中起来而坐下，可能暗示恢复安稳或尊荣，但原文没有明说“登上宝座”。
    reason: lexical_alternative
  - marker: b
    text: 译作“挣脱”的希伯来语形式不规则，与这里的阴性单数受话者并不一致；其大意很可能是“解开自己”或“得以脱开”颈上的捆索。
    reason: textual_variant
  - marker: c
    text: 或译“锡安的女儿”。这是把锡安人格化的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְנַעֲרִי מֵעָפָר
  choice: 抖掉身上的尘土
  rationale: התנערי是阴性单数反身命令式，表示把附着之物从自己身上抖落；“抖掉身上的尘土”既保留具体动作，也传达摆脱卑微、哀伤处境的意象，而不把比喻解释得过满。
- source_word: קוּמִי
  choice: 起来
  rationale: 阴性单数命令式，直陈从尘土中起身的动作；现代汉语自然简洁。
- source_word: שְּׁבִי
  choice: 坐下吧
  rationale: 该阴性单数命令式的基本义是“坐、就座”。上下文可能暗示恢复尊荣，但正文保留朴素词义及“起来—坐下”的张力，不直接增译“登上宝座”。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及公共语境中通行的地名译法。
- source_word: התפתחו
  choice: 挣脱
  rationale: 这一形式异常，语境所指很可能是解开或摆脱颈项上的束缚。“挣脱”在汉语中能自然搭配“捆索”，也保留主体摆脱束缚的反身意味，但不强行判定其精确语态。
- source_word: מוֹסְרֵי צַוָּארֵךְ
  choice: 你颈上的捆索
  rationale: מוסרי泛指捆绑物或束缚物，不必具体限定为金属锁链；“颈上的捆索”保留原文形象并符合现代汉语搭配。
- source_word: שְׁבִיָּה
  choice: 被掳的
  rationale: 该阴性形式描述锡安女子处于被俘、被掳的境况；“被掳的”简明保留流亡与囚禁意象。
- source_word: בַּת צִיּוֹן
  choice: 锡安女子
  rationale: 这是先知书中将锡安人格化的惯用称呼。“锡安女子”比逐字的“锡安的女儿”更符合现代汉语诗性称谓，同时在脚注保留后者。
theological_decisions:
- issue: שְּׁבִי在复兴宣告中的含义
  choice: 正文译为“坐下吧”
  alternative: 就尊位吧／坐在尊位上吧
  rationale: 上下文从尘土和捆绑转向复兴，确可使“坐”带有安居或恢复尊荣的意味；然而希伯来动词本身只明确表达“坐、就座”。正文不增添“宝座”观念，脚注说明语境中的可能意味，以保留含蓄和张力。
- issue: 异常形式התפתחו的语态与数性
  choice: 按最可能的语境意义译为“挣脱”
  alternative: 解开自己／得以脱开
  rationale: 马所拉文本的形式与阴性单数受话者并不规则，既可能按反身命令理解，也可译出较被动的意味。正文采用通顺且符合意象的译法，脚注明示原文困难，不借文本校订消除不确定性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。分号保留两个并列命令组；“起来，坐下吧”有意保留原文表面的动作张力。“捆索”较“锁链”宽泛，避免把束缚物的材质具体化。所有脚注标记均紧随其所说明的词组。
