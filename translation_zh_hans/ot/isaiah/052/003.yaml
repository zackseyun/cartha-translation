  rationale: 仅作汉语措辞和句法的安全润饰。“白白地”使状语功能明确；“不付银钱而被赎回”自然地表达“不是以银钱／钱财得赎”，而没有指定谁付款或赎回的机制。分号也更清楚地呈现两句的平行与反差。
