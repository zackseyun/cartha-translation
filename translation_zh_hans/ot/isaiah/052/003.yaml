  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה חִנָּ֖ם נִמְכַּרְתֶּ֑ם וְ/לֹ֥א בְ/כֶ֖סֶף תִּגָּאֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/003.yaml
  text: 'For thus says Yahweh: “You were sold for nothing[a], and you will be redeemed without money.”'
translation:
  language: zh_hans
  text: '因为雅威如此说：


    “你们白白地被卖[a]；


    你们也必不付银钱而被赎回。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “白白”也可译作“无偿地”或“毫无代价地”。
    reason: 说明חִנָּם的词义范围；这里强调被卖时没有收取代价，并与下句“不付银钱”相呼应。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接上文并引出解释性的神谕；“因为”保留其连接和说明作用。
- source_word: כֹה אָמַר
  choice: 如此说
  rationale: 保留先知信息中庄重、凝练的使者公式，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其专名性质，不以称号代替。
- source_word: חִנָּם
  choice: 白白
  rationale: 表达未付代价、没有所得的含义，并与下句“不用银钱”形成鲜明对应。
- source_word: נִמְכַּרְתֶּם
  choice: 你们被卖
  rationale: 将Nifal形态按被动理解，不额外引入“你们卖了自己”的反身含义。
- source_word: וְלֹא בְכֶסֶף
  choice: 也必不用银钱
  rationale: כֶּסֶף可指银子，也常泛指钱财；“银钱”兼顾具体意象与支付手段的通义。连词在汉语中译为“也”，突出两句的对应关系。
- source_word: תִּגָּאֵלוּ
  choice: 就被赎回
  rationale: 保留גאל所含的赎回与施行拯救之意，同时不在译文中规定赎回的具体机制。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用音译可保留其盟约专名性质，而不以称号取代。
- issue: 赎回陈述的性质
  choice: 保留买卖与赎回的经济意象，不说明具体机制
  alternative: 解释为实际付款赎身；改写为纯粹的复兴
  rationale: 原文刻意对照“白白被卖”与“不用银钱被赎回”。译文保留这层张力，不把比喻限定为实际金融交易，也不将其抽象化。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“如此说”保留先知宣告的正式语气；诗行分排体现两句之间的平行和反差。
