source:
  edition: WLC
  text: כִּ֣י לֹ֤א בְ/חִפָּזוֹן֙ תֵּצֵ֔אוּ וּ/בִ/מְנוּסָ֖ה לֹ֣א תֵלֵכ֑וּ/ן כִּֽי הֹלֵ֤ךְ לִ/פְנֵי/כֶם֙ יְהוָ֔ה וּ/מְאַסִּפְ/כֶ֖ם אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/012.yaml
  text: For you will not go out in haste[a], and you will not go in flight; for Yahweh is going before you[b], and the God of Israel is your rear guard.
translation:
  language: zh_hans
  text: 你们不会仓促地出去，也不会逃奔而去[a]；因为雅威在你们前面行走，以色列的上帝从后面收聚你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逃奔”也可译作“逃跑”或“像逃亡的人一样前行”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“从后面收聚你们”。此语也可指从后方护卫、照应行列，故可意译为“作你们的后卫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחִפָּזוֹן
  choice: 匆忙
  rationale: 该词表示急促、仓促；“匆忙”自然简洁，又不额外加入“惊慌”的情绪含义。
- source_word: תֵּצֵאוּ
  choice: 出发
  rationale: יצא本义为“出去”。此处描写群体离开之举，“出发”符合现代汉语，同时保留出埃及式的启程意象。
- source_word: וּבִמְנוּסָה
  choice: 逃奔
  rationale: מְנוּסָה指逃跑、奔逃；“逃奔”体现他们不是败逃或仓皇撤离。
- source_word: תֵלֵכוּן
  choice: 不必
  rationale: 原文直译为“你们不会走”；结合前句和上下文，汉语以“不必逃奔”自然表达因上帝护卫而无须如此行动的确定事实。
- source_word: הֹלֵךְ לִפְנֵיכֶם
  choice: 走在你们前面
  rationale: 保留分词所呈现的动态画面，表达雅威亲自走在百姓前方引领他们。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不用称号替代其专名。
- source_word: וּמְאַסִּפְכֶם
  choice: 在你们后面收拢队伍
  rationale: אסף在行军或队伍语境中可指从后方收拢人员、担任后卫；此译保留原文的动词意象，也显明保护队伍后方的作用。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现原文的领属结构，并保留其盟约群体身份。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；采用“雅威”保留专名性质，而不以称号“主”代替。
- issue: וּמְאַסִּפְכֶם 的保护含义
  choice: 在你们后面收拢队伍
  alternative: 作你们的后卫
  rationale: 原文使用动词“收拢”，可能兼含从后方集合掉队者和护卫队尾的意象；正文保留这一较具体且略带开放性的表达，脚注说明其功能。
- issue: 两个否定将来式的语气
  choice: 不必匆忙，也不必逃奔
  alternative: 不会匆忙出去，也不会逃奔而行
  rationale: 上下文的理由是雅威前导后护，因此“不必”在现代汉语中自然表达有保障的从容离去；并未将其改成命令。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。前后两个短句保持平行，“走在……前面／在……后面收拢队伍”呈现上帝前导后护的完整画面；不使用过度军事化或宗派化措辞。
