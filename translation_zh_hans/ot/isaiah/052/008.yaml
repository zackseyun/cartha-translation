- from: 你守望者的声音——他们扬声，一同欢呼；因为雅威归回锡安时[b]，他们必眼对眼地看见[a]。
  to: 你守望者的声音！他们扬声，一同欢呼；因为他们必亲眼看见[a]雅威归回锡安[b]。
  rationale: 修订以“亲眼看见”取代会造成相互对视含义的“眼对眼地看见”，同时以脚注保留希伯来文的字面意象及其直接、清楚看见的可能含义。将“雅威归回锡安”置于“看见”的宾语结构中，紧随原文“他们看见……雅威归回锡安”的语序和关系；替代性“复兴锡安”解释仍由脚注保留。
