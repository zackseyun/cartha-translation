  text: ק֥וֹל צֹפַ֛יִ/ךְ נָ֥שְׂאוּ ק֖וֹל יַחְדָּ֣ו יְרַנֵּ֑נוּ כִּ֣י עַ֤יִן בְּ/עַ֨יִן֙ יִרְא֔וּ בְּ/שׁ֥וּב יְהוָ֖ה צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/008.yaml
  text: The voice of your watchmen—they lift up their voice[a]; together they shout for joy[b], for they will see eye to eye when Yahweh returns to Zion.
translation:
  language: zh_hans
  text: 你守望者的声音！他们扬声，一同欢呼；因为他们必亲眼看见[a]雅威归回锡安[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲眼看见”直译为“眼对眼地看见”；也可理解为“清楚、直接地看见”。
    reason: lexical_alternative
  - marker: b
    text: “雅威归回锡安”也可译作“雅威复兴锡安”或“雅威使锡安复原”。
    reason: alternative_reading
lexical_decisions:
- source_word: ק֥וֹל צֹפַ֛יִךְ
  choice: 你守望者的声音
  rationale: 保留希伯来文以名词“声音”起句的突显结构；“你”是阴性单数，指向锡安或耶路撒冷。
- source_word: נָ֥שְׂאוּ ק֖וֹל
  choice: 他们扬声
  rationale: 这是“提高声音、扬起声音”的惯用表达；“扬声”简洁而庄重。
- source_word: יַחְדָּ֣ו יְרַנֵּ֑נוּ
  choice: 一同欢呼
  rationale: יַחְדָּו 强调共同一致，יְרַנֵּנוּ 表达公开而喜乐的呼喊，也可含歌唱意味；“欢呼”在现代汉语中自然贴切。
- source_word: עַ֤יִן בְּעַ֨יִן֙
  choice: 眼对眼地
  rationale: 保留原文鲜明而不寻常的意象，不把它直接化约为“亲眼”或“清楚地”；脚注说明其可能语义。
- source_word: יִרְא֔וּ
  choice: 他们必……看见
  rationale: 未完成式在此处指向守望者将要目睹的行动，用“必”表达语境中的将来与确定性。
- source_word: בְּשׁ֥וּב יְהוָ֖ה צִיּֽוֹן
  choice: 雅威归回锡安时
  rationale: 按句法将雅威理解为“归回”的主语，בְּ 加不定词结构译作“……时”；“锡安”保留专名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为专有名称的性质，而不以称号代替。
theological_decisions:
- issue: עַיִן בְּעַיִן 的含义
  choice: 眼对眼地
  alternative: 亲眼；清楚、直接地
  rationale: 原文意象可能强调亲自、直接而清楚地目睹，并非现代汉语所说“意见一致”。正文保留字面张力，脚注交代较自然的理解。
- issue: בְּשׁוּב יְהוָה צִיּוֹן 的句法与意义
  choice: 雅威归回锡安时
  alternative: 雅威复兴锡安时；雅威使锡安复原时
  rationale: 将 יְהוָה 作为 שוב 的主语，是较直接的句法理解；但 שוב 在语境中也可能带有使锡安恢复的含义，因此在脚注保留另一译法。
translation_notes:
  register: 采用现代、庄重且可朗读的书面汉语。“你守望者的声音——”保留原文突出的名词式开头；破折号帮助现代读者理解后句是对这声音的展开。“眼对眼地”刻意保留原文意象，其可能含义由脚注澄清。
