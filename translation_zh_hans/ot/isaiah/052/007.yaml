source:
  edition: WLC
  text: מַה נָּאו֨וּ עַל הֶ/הָרִ֜ים רַגְלֵ֣י מְבַשֵּׂ֗ר מַשְׁמִ֧יעַ שָׁל֛וֹם מְבַשֵּׂ֥ר ט֖וֹב מַשְׁמִ֣יעַ יְשׁוּעָ֑ה אֹמֵ֥ר לְ/צִיּ֖וֹן מָלַ֥ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/007.yaml
  text: How beautiful on the mountains are the feet of the one who brings good news[a], who announces peace, who brings good news of good things, who announces salvation, who says to Zion, “Your God reigns.”
translation:
  language: zh_hans
  text: 在群山之上，传好消息之人的脚步多么美好！他宣告平安，传扬美好的消息，宣告拯救，对锡安说：“你的上帝作王了！[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你的上帝掌权”或“你的上帝是王”。希伯来语既可强调登基作王，也可强调正在施行王权。
    reason: 保留מָלַךְ在此处可能表达的登基事件与持续统治两重含义。
lexical_decisions:
- source_word: מַה נָּאווּ
  choice: 多么美好
  rationale: מַה在此引出感叹，并非疑问；נָאווּ表达悦目、可喜。“多么美好”自然保留赞叹语气。
- source_word: עַל הֶהָרִים
  choice: 翻山越岭
  rationale: 原文直译为“在群山之上”。结合报信者前来这一动态场景，“翻山越岭”以现代汉语自然呈现其越过山地而来的图景。
- source_word: רַגְלֵי
  choice: 脚步
  rationale: “脚步”既保留脚的具体诗歌意象，也较自然地指向报信者的到来；若译“脚”则现代汉语中略显生硬。
- source_word: מְבַשֵּׂר
  choice: 传好消息之人
  rationale: 该分词在此作名词使用；此译保留其动作含义，又不额外赋予技术性职分。
- source_word: מַשְׁמִיעַ שָׁלוֹם
  choice: 宣告平安
  rationale: שׁמע的使役分词意为“使人听见”，在此即公开宣告；שָׁלוֹם涵盖和平、安宁与福祉，以“平安”保持其宽广含义。
- source_word: מְבַשֵּׂר טוֹב
  choice: 传扬美好的消息
  rationale: 保留与前文“传好消息”的重复，同时使טוֹב的广泛含义自然进入中文，不把它缩窄为物质兴盛。
- source_word: מַשְׁמִיעַ יְשׁוּעָה
  choice: 宣告拯救
  rationale: יְשׁוּעָה可指拯救、解救或胜利；“拯救”保留其在本段中的救援意义及较广的经文共鸣。
- source_word: אֹמֵר לְצִיּוֹן
  choice: 对锡安说
  rationale: 采用简洁的直接引语引介；“锡安”保留传统地名，也容纳其人格化指向城与居民的用法。
- source_word: מָלַךְ אֱלֹהָיִךְ
  choice: 你的上帝作王了
  rationale: מָלַךְ的完成式在报信语境中可突出登基、开始施行王权，也可宣告持续统治。“作王了”保留事件性和王权宣告，其他可能含义列入脚注。
theological_decisions:
- issue: 王权宣告מָלַךְ אֱלֹהָיִךְ的时态与体貌
  choice: 你的上帝作王了
  alternative: 你的上帝掌权；你的上帝是王
  rationale: 希伯来语完成式既可让人听见登基或王权正式显明的宣告，也可表达上帝正在作王统治。正文以“作王了”呈现其报信式、事件性的力度，脚注保留状态性和持续统治的理解，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。以短句和并列分句保留希伯来诗句的报信节奏；“翻山越岭”增强中文动态感，“脚步”维持具体诗意。脚注标记置于相关直接引语之后。
