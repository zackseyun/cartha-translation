  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: פִּצְח֤וּ רַנְּנוּ֙ יַחְדָּ֔ו חָרְב֖וֹת יְרוּשָׁלִָ֑ם כִּֽי נִחַ֤ם יְהוָה֙ עַמּ֔/וֹ גָּאַ֖ל יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/009.yaml
  text: Break forth[a], sing together, you ruins of Jerusalem, for Yahweh has comforted his people; he has redeemed Jerusalem.
translation:
  language: zh_hans
  text: 耶路撒冷的废墟啊，要一同欢呼歌唱！因为耶和华已经安慰了他的子民，救赎了耶路撒冷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּצְחוּ רַנְּנוּ
  choice: 欢呼歌唱
  rationale: 两个复数命令式共同描写突然迸发的喜乐之声；合译为“欢呼歌唱”，既自然，也保留歌唱与欢呼的双重意味。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 直接表达众废墟共同发声的集体性，并与复数命令相呼应。
- source_word: חָרְבוֹת
  choice: 废墟
  rationale: 指遭毁坏、荒废之处；“废墟”简洁鲜明，也能自然地作为拟人化呼语。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出欢呼命令的原因。
- source_word: נִחַם
  choice: 已经安慰了
  rationale: 该完成式在预言语境中把上帝的安慰与复兴作为确定成就来宣告；“安慰”保留其解除痛苦、带来慰藉的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名最通行、最易识别的音译，保留其专名性质，不以称号替代。
- source_word: עַמּוֹ
  choice: 他的子民
  rationale: 准确表达第三人称阳性单数所属关系；“子民”符合庄重的圣经语体。
- source_word: גָּאַל
  choice: 救赎了
  rationale: 保留该词所含的赎回、解救与恢复归属之意，以及其盟约性分量，又不额外限定具体机制。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用通行中文地名，并保留原文末尾重复，以维持诗句的强调与收束。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名。中文正文采用最通行且易于普通读者识别的“耶和华”，同时不以“主”等称号取代专名。
- issue: גָּאַל 的救赎含义
  choice: 救赎了耶路撒冷
  alternative: 赎回了耶路撒冷
  rationale: “救赎”能兼顾解救、恢复与至亲赎回者背景所形成的盟约意味，而不把本节限定为金钱赎价或某一种特定教义机制。
- issue: 完成式所表达的行动状态
  choice: 已经安慰了……救赎了
  alternative: 安慰……救赎……
  rationale: 用“已经”显出先知把这些行动作为确定事实来宣告的语气；中文只在第一个并列谓语前标示，语义自然涵盖两项行动。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体中文。将呼语“耶路撒冷的废墟啊”前置，符合原文对废墟的直接召唤；以感叹号呈现两个命令式的欢庆力度。
