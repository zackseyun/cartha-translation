base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/013.yaml
  text: Behold[a], my servant will act wisely; he will be raised and lifted up and highly exalted.
translation:
  language: zh_hans
  text: 看哪，我的仆人必行事明智[a]；他必升高，被高举，且极其崇高。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必亨通”。希伯来语动词可指行事明智，并可由此引申为成功、亨通。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 以庄重而自然的现代汉语引起注意，保留先知话语的强调语气。
- source_word: יַשְׂכִּיל
  choice: 必行事明智
  rationale: 保留使役式动词所表达的明智、审慎行事这一核心含义，同时以脚注说明由此引申出的亨通、成功之义。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: “仆人”符合本段语境及现代汉语习惯，不在译文中预先限定其身份或加入明确的弥赛亚称谓。
- source_word: יָרוּם
  choice: 必升高
  rationale: 直接保留רום的上升、升高意象，并与后续两个表示崇高的动词构成递进。
- source_word: וְנִשָּׂא
  choice: 被高举
  rationale: 体现该形式的被动或受高举意味，同时保留空间升举与尊荣提升之间的张力。
- source_word: וְגָבַהּ מְאֹד
  choice: 且成为至高
  rationale: 表达גבהּ与מְאֹד构成的强烈高潮；“至高”自然传达极其崇高之意，同时避免把三个近义动词压缩为同一表达。
theological_decisions:
- issue: 仆人可能具有的弥赛亚指向
  choice: 正文仅译作“我的仆人”，不明说其为弥赛亚或基督。
  alternative: 在译文中直接将仆人认定为弥赛亚或基督。
  rationale: 希伯来文本本节只称“我的仆人”。译文保留这一称谓及其解释空间，不把后来的基督论认定直接写入正文。
- issue: 三重升高措辞是否暗示受难后的尊荣
  choice: 保留“升高—被高举—成为至高”的递进，不在译文中说明其事件次序或神学机制。
  alternative: 把三词解释性地译成复活、升天或得荣耀。
  rationale: 原文使用三个升高与崇高动词，却未在本节明说具体事件；保持意象和递进可避免过度释义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留先知宣告的郑重感；三个升高词分别译出，以呈现原文的平行递进和高潮。
