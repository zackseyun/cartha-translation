  text: עוּרִ֥י עוּרִ֛י לִבְשִׁ֥י עֻזֵּ֖/ךְ צִיּ֑וֹן לִבְשִׁ֣י בִּגְדֵ֣י תִפְאַרְתֵּ֗/ךְ יְרוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ כִּ֣י לֹ֥א יוֹסִ֛יף יָבֹא בָ֥/ךְ ע֖וֹד עָרֵ֥ל וְ/טָמֵֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/001.yaml
  text: Awake[a], awake; put on your strength, Zion; put on your beautiful garments, Jerusalem, the holy city[b]. For no longer shall the uncircumcised and the unclean enter you again.
translation:
  language: zh_hans
  text: 醒来，醒来！锡安啊，披上你的力量；耶路撒冷啊，圣城啊，穿上你华美的衣服。[a] 因为未受割礼的人和不洁净的人，必不再进入你里面。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “华美的衣服”也可译作“荣美的衣裳”。
    reason: lexical_alternative
  - marker: b
    text: “未受割礼的人和不洁净的人”保留了希伯来文中圣约与洁净的用语；这里可能泛指一切不容于圣城之圣洁的人，原文没有进一步限定。
    reason: cultural_note
lexical_decisions:
- source_word: עוּרִי עוּרִי
  choice: 醒来，醒来
  rationale: 两个阴性单数祈使式直接呼唤拟人化的锡安；保留重复，以传达迫切感和诗歌力度。
- source_word: לִבְשִׁי עֻזֵּךְ
  choice: 披上你的力量
  rationale: 保留把“力量”当作衣服穿上的比喻；“披上”符合汉语表达，也与下句的穿衣意象相连。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: לִבְשִׁי בִּגְדֵי תִפְאַרְתֵּךְ
  choice: 穿上你华美的衣服
  rationale: תִפְאֶרֶת可表示华美、荣美或荣耀；“华美的衣服”自然清楚，并保留复兴与装饰的意象。
- source_word: יְרוּשָׁלִַם עִיר הַקֹּדֶשׁ
  choice: 耶路撒冷圣城啊
  rationale: 将“圣城”作为对耶路撒冷的同位称呼，并用“啊”明确呼语，使现代汉语顺畅。
- source_word: כִּי לֹא יוֹסִיף יָבֹא בָךְ עוֹד
  choice: 因为……必不再进入你里面
  rationale: יוֹסִיף与עֹוד共同表达今后停止、再也不发生；“必不再”保留强烈的未来断绝语气。
- source_word: עָרֵל וְטָמֵא
  choice: 未受割礼的和不洁净的
  rationale: 保留希伯来文的圣约及洁净范畴，不把所指擅自限定为外族侵略者、礼仪不洁者或某一末世群体。
theological_decisions:
- issue: “未受割礼的和不洁净的”所指范围
  choice: 原样保留圣约与洁净用语，不限定其具体对象
  alternative: 明确译作外族侵略者、礼仪不洁者，或末世中被排除的人
  rationale: 本节没有完全界定这两个称谓是族群、礼仪、道德还是末世意义；直译能保存经文本身的张力。
- issue: 锡安与耶路撒冷的拟人化
  choice: 使用第二人称“你的”“你里面”，并以呼语呈现
  alternative: 改写为对城中居民的直接命令
  rationale: 希伯来文将城市拟人化为阴性受话者；保留这一诗歌手法比解释性改写更贴近原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留祈使句的重复、穿衣隐喻、城市拟人化以及圣约和洁净术语；标点按中文诗歌呼语习惯处理。
