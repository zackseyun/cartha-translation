  text: Pass through your land like the Nile[a], daughter of Tarshish[c][b]; there is no restraint anymore.
translation:
  language: zh_hans
  text: 他施的女儿啊，你要像尼罗河一样穿过你的地[a]；再没有约束了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穿过”也可译作“经过”“横越”或“漫过”。希伯来语动词本义是经过、穿越；“像尼罗河一样”的比喻也可能暗示河水漫流、遍及全地。
    reason: lexical_alternative
  - marker: b
    text: 译作“约束”的希伯来语词十分罕见，也有人理解为“屏障”“港口设施”或“系船之物”。本句大意是他施不再受到约束。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִי
  choice: 走遍
  rationale: 这是阴性单数命令式，基本义为“经过、穿越”。“走遍”保留行动本身，并让随后的“像尼罗河一样”说明其方式，同时在中文中自然表达不再受限制地遍及全地。
- source_word: אַרְצֵךְ
  choice: 你的土地
  rationale: 该词为“地、国土”加阴性单数第二人称后缀；“你的土地”既准确，也与对“他施的女儿”的拟人称呼呼应。
- source_word: כַיְאֹר
  choice: 像尼罗河一样
  rationale: יְאֹר在此最可能特指尼罗河；这一明喻唤起河水漫流、遍及土地的景象。
- source_word: בַּת תַּרְשִׁישׁ
  choice: 他施的女儿
  rationale: 保留先知文学中把城市或其居民人格化为“女儿”的意象，不将其平化为“他施的居民”。
- source_word: אֵין
  choice: 没有
  rationale: 直接表达希伯来语的存在否定。
- source_word: מֵזַח
  choice: 束缚
  rationale: 这是罕见且词义不确定的词，可能指捆束、限制或固定之物。“束缚”保留较宽泛的核心意思，避免过早限定为港口设施或缆绳。
- source_word: עוֹד
  choice: 再也
  rationale: 与否定词连用，表示先前存在的状态如今不再持续。
