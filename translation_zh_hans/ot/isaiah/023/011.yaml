  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יָד/וֹ֙ נָטָ֣ה עַל הַ/יָּ֔ם הִרְגִּ֖יז מַמְלָכ֑וֹת יְהוָה֙ צִוָּ֣ה אֶל כְּנַ֔עַן לַ/שְׁמִ֖ד מָעֻזְנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/011.yaml
  text: He has stretched out his hand over the sea[a]; he has made kingdoms tremble. Yahweh has commanded concerning Canaan[c][b], to destroy her strongholds.
translation:
  language: zh_hans
  text: 他向海上伸出手[a]，使列国震动。雅威已就迦南[b]下令，要摧毁她的堡垒[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向海上”也可译作“向海”或“攻击海”；这里的希伯来介词可有不同理解。
    reason: alternative_reading
  - marker: b
    text: 这里的“迦南”很可能指与推罗相关的腓尼基地区。
    reason: cultural_note
  - marker: c
    text: 原文使用阴性单数后缀，因此译作“她的”，把这片土地或城邑人格化；也可译作“它的堡垒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹ נָטָה
  choice: 他……伸出手
  rationale: 保留“伸手”这一具体的拟人意象，表达主动施行权能与审判，不将其抽象化为“施展能力”。
- source_word: עַל הַיָּם
  choice: 向海
  rationale: עַל可表达“在……之上、向着、攻击”等关系；“向海伸出手”在现代汉语中自然，也保留其指向或敌对意味的开放性。
- source_word: הִרְגִּיז
  choice: 使……震动
  rationale: 该使役式动词表示使之震颤、动荡；“使列国震动”兼顾政治动荡和惊惧的语境。
- source_word: מַמְלָכוֹת
  choice: 列国
  rationale: 原词为复数“王国”；诗歌语境中“列国”自然凝练，仍明确指多个政治实体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现神的专名，而不以称号代替。
- source_word: צִוָּה אֶל כְּנַעַן
  choice: 向迦南发出命令
  rationale: אֶל在此结构中较为特殊，可能表示命令所针对的对象，也可能表示命令的受领者；此译尽量保留这种张力。
- source_word: כְּנַעַן
  choice: 迦南
  rationale: 正文保留希伯来地名；本章语境中它很可能特指推罗所属的腓尼基地区，另以脚注说明。
- source_word: לַשְׁמִיד
  choice: 要摧毁
  rationale: 表达彻底破坏的目的，又避免用“灭绝”等可能超出此处建筑或防御设施语境的措辞。
- source_word: מָעֻזְנֶיהָ
  choice: 她的堡垒
  rationale: מָעוֹז可指坚固之处、堡垒或保障；“堡垒”适合军事政治语境。阴性单数后缀译作“她的”，保留土地或城邑的拟人化。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；正文采用音译，以保留专名性质，不用称号替代。
- issue: כְּנַעַן的地域所指
  choice: 正文译“迦南”，脚注说明可能指腓尼基地区
  alternative: 正文直接译“腓尼基”
  rationale: 原文首先是传统地名“迦南”；以脚注交代其在以赛亚书23章中的具体语境，可避免将可能的历史指称直接写进正文。
- issue: צִוָּה אֶל כְּנַעַן的关系
  choice: 向迦南发出命令
  alternative: 下令攻击迦南；论到迦南发出命令
  rationale: 希伯来介词结构容许不止一种理解；主译文避免完全确定迦南究竟是命令的受领者还是命令所针对的对象。
- issue: 阴性后缀的呈现
  choice: 她的堡垒
  alternative: 它的堡垒
  rationale: 保留原文阴性单数后缀及先知诗歌中将土地或城邑人格化的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保持先知诗歌的简洁力度；“雅威”“迦南”为规范专名表达，“她的堡垒”有意保留原文拟人化。
