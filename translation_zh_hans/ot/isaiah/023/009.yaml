revisions:
- from: 万军之耶和华定意如此[a]：要亵渎一切华美的骄傲[b]，使地上一切尊贵的人蒙羞[c]。
  to: 万军之耶和华定意这样做[a]：要使一切荣美的骄傲[b]蒙受羞辱，使地上一切尊贵的人受轻视[c]。
  rationale: 修订仅处理现代汉语搭配和词义侧重：“蒙受羞辱”表达חלל所指的玷辱、使失去荣誉；“受轻视”表达להקל的贬低、看轻。保留“荣美的骄傲”这一与希伯来文紧凑属格结构相应、且在语境中可理解的表达；不将其释义性扩展为“荣美所带来的骄傲”。脚注a改为不额外加入“攻击”的表达，并保留推罗为阴性后缀所指的可能。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:20:56Z'
review_pass:
  verdict: revise
  source_fidelity: 整体忠实反映了耶和华定意施行审判，以及两个不定式所说明的目的。惟“亵渎……骄傲”在现代汉语中搭配不自然，且“亵渎”通常带有对神圣事物不敬的专门含义；此处的חלל更适合译出使其失去荣誉、受辱的意思。阴性后缀的歧义应继续保留，脚注不宜把无介词的直接宾语过度落实为“攻击”。
  naturalness: “定意如此”可懂，但“定意这样做”更符合现代普通话。“使一切……蒙受羞辱”和“使……受轻视”既自然，也分别保留两项平行行动的语义侧重。
  terminology: “万军之耶和华”庄重、通行，并恰当保留神名及称号。“荣美”“尊贵的人”可准确传达צבי和נכבדי。“受轻视”比“蒙羞”更贴近להקל的“使人看轻／贬低”，并避免与前一分句的受辱语义混同。
  issues:
  - severity: medium
    issue: “亵渎一切华美的骄傲”搭配生硬，且“亵渎”在汉语中容易限缩为宗教性不敬。
    rationale: חלל在这里指使荣耀受污、遭贬辱；改作“使……蒙受羞辱”可保留审判性的贬抑，而不引入不必要的宗教专义。
  - severity: low
    issue: 脚注a的“定意攻击她”过度具体化了直接宾语后缀。
    rationale: 原文并无“攻击／ נגד”一类介词；后缀可以指推罗，但以“这样对待她”说明该可能性更贴近原文，同时保留正文的歧义。
  - severity: low
    issue: “定意如此”略显书面且指代不够明确。
    rationale: “定意这样做”自然承接后面的两个目的不定式，且不判定阴性后缀的具体所指。
