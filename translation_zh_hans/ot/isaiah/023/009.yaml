  text: יְהוָ֥ה צְבָא֖וֹת יְעָצָ֑/הּ לְ/חַלֵּל֙ גְּא֣וֹן כָּל צְבִ֔י לְ/הָקֵ֖ל כָּל נִכְבַּדֵּי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/009.yaml
  text: 'Yahweh of hosts has purposed it: to defile the pride of all beauty[c][b][a], to humble all the honored ones of the earth.'
translation:
  language: zh_hans
  text: 万军之耶和华定意这样做[a]：要使一切荣美的骄傲[b]蒙受羞辱，使地上一切尊贵的人受轻视[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“定意这样对待她”；阴性后缀可特指推罗城。
    reason: alternative_reading
  - marker: b
    text: “荣美”也可译作“华美”“荣光”或“光彩”。
    reason: lexical_alternative
  - marker: c
    text: “使……受轻视”也可译作“使……降卑”或“使……蒙羞”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”保留神的专名，并用汉语圣经语体中清楚、庄重的“万军之”表达 צְבָאוֹת；这一称号不局限于某一种军队。
- source_word: יְעָצָהּ
  choice: 定意如此
  rationale: יעץ 表示筹划、定意；“如此”自然承接上下文所宣告的审判，同时不在正文中强行限定阴性宾语后缀的所指。
- source_word: לְחַלֵּל
  choice: 要亵渎
  rationale: חלל 的 Piel 形在此有使之失去尊荣、加以亵渎之意；“亵渎”保留原词强烈的贬抑色彩，而不弱化为一般性的破坏。
- source_word: גְּאוֹן כָּל צְבִי
  choice: 一切华美的骄傲
  rationale: גאון 在审判语境中取“骄傲”，צבי 则可指华美、荣美或荣光；“一切华美的骄傲”保持希伯来语紧凑结构及其可理解的张力。
- source_word: לְהָקֵל
  choice: 使……蒙羞
  rationale: קלל 的 Hiphil 在此表示使之轻贱、降低或失去尊荣；“使……蒙羞”与后面的“尊贵的人”形成鲜明反差，并比单纯“降卑”更充分表达名誉受损。
- source_word: כָּל נִכְבַּדֵּי אָרֶץ
  choice: 地上一切尊贵的人
  rationale: נכבדי 指有分量、受尊重或地位显赫者；“尊贵的人”保持范围宽广，不限于贵族阶层。ארץ 依此处宏观语境译作“地上”。
theological_decisions:
- issue: יְעָצָהּ 中阴性单数宾语后缀的所指
  choice: 正文译作“定意如此”，指向所宣告之事或审判
  alternative: 译作“定意攻击她”，把后缀明确指向作为阴性城市的推罗
  rationale: 后续两个不定式说明耶和华定意要成就的内容，因此“如此”衔接自然；脚注同时保留后缀特指推罗的真实可能性，避免消除原文歧义。
- issue: גְּאוֹן 的评价色彩
  choice: 译作“骄傲”
  alternative: 译作“威荣”或“高贵”
  rationale: 本节的审判和贬抑语境支持负面的“骄傲”，但该词本身也可表达威荣或高昂，故以脚注保留相关词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“万军之耶和华”保留先知书的崇高语域；正文标点显明后半节是神所定旨意的内容。脚注标记均置于对应词句之后，并按正文出现顺序排列。
