  text: מַשָּׂ֖א צֹ֑ר הֵילִ֣ילוּ אֳנִיּ֣וֹת תַּרְשִׁ֗ישׁ כִּֽי שֻׁדַּ֤ד מִ/בַּ֨יִת֙ מִ/בּ֔וֹא מֵ/אֶ֥רֶץ כִּתִּ֖ים נִגְלָה לָֽ/מוֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/001.yaml
  text: 'An oracle concerning Tyre: Wail[a], ships of Tarshish, for it is destroyed, without house or harbor[b]. From the land of Kittim it is revealed to them.'
translation:
  language: zh_hans
  text: '关于推罗的默示：

    他施的船只啊，哀号吧！

    因为它已被毁，再无房屋，也无港口。[a]

    他们从基提地[b]得知了这事。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“再无房屋，也无入口”。希伯来文可能是说，推罗遭到彻底毁坏，房屋和港口或通路都不复存在。
    reason: lexical_alternative
  - marker: b
    text: “基提”可能指塞浦路斯，也可能泛指附近的西方沿海地区。
    reason: cultural_note
lexical_decisions:
- source_word: מַשָּׂא
  choice: 默示
  rationale: 在先知书标题中指从上帝而来的宣告，常含审判意味。“默示”是现代中文圣经语体中简洁而庄重的常用表达；不直译为“重担”，以免遮蔽其文类功能。
- source_word: צֹר
  choice: 推罗
  rationale: 采用该地名通行的现代中文译名。
- source_word: הֵילִילוּ
  choice: 哀号吧
  rationale: 复数命令式，要求发出悲痛的呼号；“哀号”既保留声音强烈的意味，也符合先知性哀歌语境。
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: 他施的船只
  rationale: 保留希伯来文属格结构，不限定为驶往、来自他施或某一特定船型，从而保留其地理及商贸关联的开放性。
- source_word: שֻׁדַּד
  choice: 已被毁
  rationale: 被动形式表示遭劫掠、毁坏后的荒废状态；“已被毁”简洁，并与下文无房屋、无入口或港口的结果相衔接。
- source_word: מִבַּיִת מִבּוֹא
  choice: 再无房屋，也无港口
  rationale: 按上下文将两个介词短语理解为缺失或剥夺意义。海运语境使“港口”自然表达可进入之处，但原词也可泛指“入口”，故在脚注保留。
- source_word: מֵאֶרֶץ כִּתִּים
  choice: 从基提地
  rationale: 保留希伯来文地理名称，不在正文中将其过早限定为塞浦路斯；可能的所指见脚注。
- source_word: נִגְלָה לָמוֹ
  choice: 他们……得知了这事
  rationale: 该被动形式在此表示事情向他们显明、为他们所知。中文改用自然的主动表达，所知内容由上文补为“这事”，不额外指定传信者。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。分行呈现诗体节奏；呼语“他施的船只啊”保留原文的拟人化表达。正文避免把基提明确等同于塞浦路斯，也避免把“他施的船只”限定为航向或来源，以保存原文的地理与语义张力。
