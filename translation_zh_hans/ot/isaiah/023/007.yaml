  text: הֲ/זֹ֥את לָ/כֶ֖ם עַלִּיזָ֑ה מִֽ/ימֵי קֶ֤דֶם קַדְמָתָ/הּ֙ יֹבִל֣וּ/הָ רַגְלֶ֔י/הָ מֵֽ/רָח֖וֹק לָ/גֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/007.yaml
  text: Is this your exultant city[a], whose origin is from days of old, whose feet carried her far away to sojourn?
translation:
  language: zh_hans
  text: 这就是你们那欢腾的城吗？她的历史源自远古；她的脚将带她到远方去寄居。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲזֹאת לָכֶם
  choice: 这就是你们……吗
  rationale: 疑问词、阴性指示词与第二人称复数形式构成反问；按现代汉语习惯译为“这就是你们……吗”，并保留对推罗居民的直接质问。
- source_word: עַלִּיזָה
  choice: 欢腾的城
  rationale: 该阴性形容词表示欢喜、雀跃或得意欢庆；结合上下文补出“城”，既明确所指是推罗，也保留拟人化色彩。
- source_word: מִימֵי קֶדֶם קַדְמָתָהּ
  choice: 她自远古就已存在
  rationale: 原文强调她的久远历史可追溯到古时；此译避免生硬重复“古老／远古”，以自然汉语传达其古老渊源。
- source_word: יֹבִלוּהָ רַגְלֶיהָ
  choice: 她的脚曾带她
  rationale: 使役形态的 יבל 可指带领、带去；保留“脚带着她”的拟人意象，而不改写为抽象的迁徙或殖民活动。
- source_word: מֵרָחוֹק
  choice: 远走他乡
  rationale: 在移动语境中表达相隔遥远；正文依上下文理解为走向远方，但希伯来语介词也可理解为“从远方”，故以脚注保留方向上的歧义。
- source_word: לָגוּר
  choice: 寄居
  rationale: גור 常指以外来者或临时居民身份居住；“寄居”比单纯“居住”更能保留这种非本土、非永久定居的意味。
theological_decisions: []
