  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא תוֹסִ֥יפִי ע֖וֹד לַ/עְל֑וֹז הַֽ/מְעֻשָּׁקָ֞ה בְּתוּלַ֣ת בַּת צִיד֗וֹן כתיים ק֣וּמִי עֲבֹ֔רִי גַּם שָׁ֖ם לֹא יָנ֥וּחַֽ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/012.yaml
  text: He said[a], “You will exult no more, oppressed virgin daughter of Sidon. Arise, cross over to Kittim[b]; even there you will find no rest.”
translation:
  language: zh_hans
  text: '他又说[a]：

    “受欺压的西顿处女啊，

    你再也不会欢腾了。

    起来，渡到基提[b]去；

    即使在那里，你也不得安歇。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文只说“他”，没有在本节内明说说话者是谁。
    reason: discourse_ambiguity
  - marker: b
    text: “基提”通常指塞浦路斯，也可引申指西方的海上地区。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他又说
  rationale: 保留叙事连接词 וַ־ 的承接作用；主语在本节原文中只以第三人称阳性单数表示，因此译作“他”，不擅自补明身份。
- source_word: לֹא תוֹסִיפִי עוֹד לַעְלוֹז
  choice: 你再也不会欢腾了
  rationale: לֹא תוֹסִיפִי עוֹד 表示某事不再继续，עלז 指强烈、洋溢的喜乐；“再也不会欢腾”兼顾语义力度和先知宣告的语气。
- source_word: הַמְעֻשָּׁקָה
  choice: 受欺压的
  rationale: 该被动形式描述遭人压迫或欺凌的状态；“受欺压的”直接、自然。
- source_word: בְּתוּלַת בַּת צִידוֹן
  choice: 西顿处女
  rationale: 保留先知文学中把城市或其民人格化为“处女”的意象，同时避免生硬直译成“处女之女”；“西顿”表达其所属关系。
- source_word: כתיים / כִּתִּים
  choice: 基提
  rationale: 按专名音译，不在正文中直接等同于塞浦路斯，以保留该名称可能涵盖更广泛西方海域的空间。
- source_word: קוּמִי עֲבֹרִי
  choice: 起来，渡到……去
  rationale: 两个阴性单数命令式均保留，呼应被人格化为女性的西顿；“渡到”适合跨海前往基提的语境。
- source_word: גַּם שָׁם לֹא יָנוּחַ לָךְ
  choice: 即使在那里，你也不得安歇
  rationale: גַּם שָׁם 在逃往别处的语境中有“连那里也”的强调作用；“不得安歇”自然表达 לֹא יָנוּחַ לָךְ 所指无处获得安息。
theological_decisions:
- issue: 说话者的身份
  choice: 正文保留“他”
  alternative: 补译为“耶和华”
  rationale: 本节希伯来文只写第三人称“他又说”，没有明说姓名；虽可由上下文推断，正文仍保留原文的指代形式，避免过度解释。
translation_notes:
  register: 采用现代、庄重而清楚的先知诗体。“西顿处女”保留城市人格化意象；分行呈现宣告、呼语与命令的节奏。
