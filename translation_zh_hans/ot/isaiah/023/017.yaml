  text: וְ/הָיָ֞ה מִ/קֵּ֣ץ שִׁבְעִ֣ים שָׁנָ֗ה יִפְקֹ֤ד יְהוָה֙ אֶת צֹ֔ר וְ/שָׁבָ֖ה לְ/אֶתְנַנָּ֑/ה וְ/זָֽנְתָ֛ה אֶת כָּל מַמְלְכ֥וֹת הָ/אָ֖רֶץ עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/017.yaml
  text: And it will happen at the end of seventy years that Yahweh will attend to Tyre[c][b][a], and she will return to her wages and prostitute herself with all the kingdoms of the earth on the face of the earth.
translation:
  language: zh_hans
  text: 七十年期满，耶和华必临到推罗[a]；她必重操旧业，收取妓女的酬金[b]，与世上万国行淫，遍及全地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶和华必察访推罗”。希伯来语动词可随上下文表示察访、惩罚或眷顾；此处不明确限定这种介入的性质。
    reason: lexical_alternative
  - marker: b
    text: “妓女的酬金”延续本段把推罗比作妓女的意象，指她从与列国的逐利往来中所得的收益。
    reason: cultural_note
  - marker: c
    text: 本句前后用了两个相关但不同的希伯来语词：前者可指“地、世界”，后者较具体地指“土地、地面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה מִקֵּץ שִׁבְעִים שָׁנָה
  choice: 七十年期满
  rationale: 自然、简洁地表达预言叙事中的未来时间，并保留“到了所定期限之末”的含义。
- source_word: יִפְקֹד
  choice: 必察看
  rationale: “察看”表达耶和华对推罗采取关注和行动，同时尽量不预先限定这种介入究竟是惩罚还是恢复。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的上帝专名译法，不以普通称号代替专名。
- source_word: צֹר
  choice: 推罗
  rationale: 采用该地名通行的现代中文译名。
- source_word: וְשָׁבָה לְאֶתְנַנָּה
  choice: 她必回去赚取卖淫的酬金
  rationale: 阴性单数保留推罗被拟人化为女子的形象；“卖淫的酬金”明确体现 אֶתְנַן 的特殊含义，而非一般工资。
- source_word: וְזָנְתָה
  choice: 行淫
  rationale: 保留先知以妓女比喻推罗逐利贸易关系的鲜明意象，同时使用庄重而通行的中文表达。
- source_word: אֶת כָּל מַמְלְכוֹת הָאָרֶץ
  choice: 与世上万国
  rationale: “与”符合该动词在此处所表达的关系对象；“万国”自然表达所有王国的广泛范围。
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: 地面上的
  rationale: 保留“在地面上”的空间性表达，并使 אֲדָמָה 与前面的 אֶרֶץ 在中文中有所区别。
theological_decisions:
- issue: יִפְקֹד 所表达的神圣临到或介入的性质
  choice: 采用相对中性的“察看”
  alternative: “惩罚”“眷顾”“临到”
  rationale: 上下文表明耶和华将决定性地介入推罗的处境，但该动词本身可随语境指惩罚、眷顾或一般性的察访；正文不将其单方面解释为刑罚或复兴。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“她”保留城市推罗的女性拟人；句式避免过度解释商业隐喻，同时以脚注说明“酬金”的文化和修辞背景。
