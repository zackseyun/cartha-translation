revisions:
- from: 七十年期满，耶和华必察看推罗[a]；她必回去赚取卖淫的酬金[b]，与地面上的世上万国行淫[c]。
  to: 七十年期满，耶和华必临到推罗[a]；她必重操旧业，收取妓女的酬金[b]，与世上万国行淫，遍及全地[c]。
  rationale: 修订以“临到”保留 פקד 的语义开放性；以“重操旧业，收取妓女的酬金”更自然且忠实地表达推罗恢复原有商业性活动的拟人化比喻；并重组末句，消除不合汉语的地域词叠置，同时保留原文对全球范围的强调及相应脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:21:01Z'
