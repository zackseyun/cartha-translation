  source_fidelity: “察看”不足以充分表达 פקד 在此处所指耶和华对推罗的决定性介入；改为“临到”可保留其未明说是惩罚还是恢复的语义张力。原文“回去赚取”将“回到她的酬金”改写为再次赚取，且措辞略显累赘，宜改为“重操旧业，收取妓女的酬金”，以自然传达其回归原有逐利活动的拟人化隐喻。
  naturalness: 原句“与地面上的世上万国行淫”中“地面上的世上”叠置生硬。改为“与世上万国行淫，遍及全地”在现代庄重普通话中更流畅，并在不强行区分两个近义地域词的同时保留原文的广泛范围与重复强调。
  terminology: “耶和华”“推罗”“妓女的酬金”“行淫”均适合本段先知性、拟人化和商业—性隐喻的语域。“妓女的酬金”比“卖淫的酬金”更符合中文圣经语体，且准确对应 אֶתְנַן。
