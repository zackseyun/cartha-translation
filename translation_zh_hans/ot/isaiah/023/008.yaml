base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/008.yaml
  text: Who has planned this against Tyre[a], the bestower of crowns, whose merchants are princes[b], whose traders are the honored ones of the earth?
translation:
  language: zh_hans
  text: 是谁谋划这事来对付推罗——这赐人冠冕的城？它的商人是王公；它的商贾[a]是世上尊贵的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “商贾”原文直译为“迦南人”；“迦南人”在这里可能用来指商人或贸易者。
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יָעַץ זֹאת עַל צֹר
  choice: 是谁谋划了这一切，要攻击推罗
  rationale: 保留反问语气；יָעַץ译为“谋划”，表达有意的筹划；זֹאת结合上文审判信息译作“这一切”；עַל在敌对语境中以“攻击”体现其方向。
- source_word: הַמַּעֲטִירָה
  choice: 这赐人冠冕的城
  rationale: 该阴性使役分词修饰推罗，字面意象是“使人戴上冠冕者”。译文保留冠冕隐喻，并补“城”使汉语指称自然，但不把其具体含义限定为册立君王或使人富足。
- source_word: סֹחֲרֶיהָ
  choice: 它的商人
  rationale: 指从事商业活动的人；“商人”准确、自然，也与下句形成诗意平行。
- source_word: שָׂרִים
  choice: 王公
  rationale: 该词可指首领、贵族或高官；“王公”保留其显赫社会地位以及与“冠冕”相呼应的高贵意象。
- source_word: כִּנְעָנֶיהָ
  choice: 它的贸易者
  rationale: 该词形式上是“迦南人”，但在商业语境中可转指商贾。正文按上下文译为“贸易者”，脚注保留族称的字面可能。
- source_word: נִכְבַּדֵּי אָרֶץ
  choice: 世上尊贵的人
  rationale: נכבד含有受尊重、具分量之意；ארץ在推罗的国际贸易背景中宜译“世上”，突出其跨地域声望。
