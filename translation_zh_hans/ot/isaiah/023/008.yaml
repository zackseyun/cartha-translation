  naturalness: 修订后采用现代庄重的书面普通话；“谋划这事来对付”自然呈现反问及敌对方向。“商贾”比“贸易者”更符合本节的诗歌性平行，也更自然。
  terminology: “推罗”“王公”“商人”“商贾”“世上尊贵的人”均适当。“赐人冠冕的城”保留原文的冠冕隐喻，不擅自限定为册立君王或赐予财富。脚注保留כִּנְעָנֶיהָ的字面族称及其语境性商业含义。
