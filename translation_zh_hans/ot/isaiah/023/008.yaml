- from: 是谁谋划了这一切，要攻击推罗——这赐人冠冕的城？它的商人都是王公，它的贸易者都是世上尊贵的人。[a]
  to: 是谁谋划这事来对付推罗——这赐人冠冕的城？它的商人是王公；它的商贾[a]是世上尊贵的人。
  rationale: 将指示词改为“这事”，并以“来对付”表达谋划针对推罗的含义，避免将原文不明示的目的关系强化为“要攻击”。将解释כִּנְעָנֶיהָ的脚注直接锚定在“商贾”之后，并以“商贾”替换不够自然的“贸易者”。其余译文保留原稿对冠冕隐喻、社会地位与国际声望的准确呈现。
