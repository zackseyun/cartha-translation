  text: בּ֣וֹשִׁי צִיד֔וֹן כִּֽי אָמַ֣ר יָ֔ם מָע֥וֹז הַ/יָּ֖ם לֵ/אמֹ֑ר לֹֽא חַ֣לְתִּי וְ/לֹֽא יָלַ֗דְתִּי וְ/לֹ֥א גִדַּ֛לְתִּי בַּחוּרִ֖ים רוֹמַ֥מְתִּי בְתוּלֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/004.yaml
  text: Be ashamed[a], Sidon, for the sea has spoken, the stronghold of the sea, saying, “I have not been in labor, and I have not given birth[c][b], and I have not raised young men or exalted virgins.”
translation:
  language: zh_hans
  text: 西顿啊，你要羞愧[a]！因为海，就是海的保障[b]，已经说：“我没有经历产痛[c]，也没有生产；我没有养育青年男子，也没有抚养童女[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羞愧”也可译作“蒙羞”。
    reason: lexical_alternative
  - marker: b
    text: “海的保障”也可译作“海的坚垒”或“海上保障”。这短语可能把海描绘为强大的保障或坚垒，也可能暗指作为海上坚垒的推罗。
    reason: lexical_and_referential_ambiguity
  - marker: c
    text: “经历产痛”也可译作“临产挣扎”。
    reason: lexical_alternative
  - marker: d
    text: “童女”也可译作“少女”或“年轻女子”；希伯来语所用的词通常特指处女。
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשִׁי
  choice: 你要羞愧
  rationale: 保留阴性单数命令式的直接语气；西顿被拟人化为女性城市。
- source_word: צִידוֹן
  choice: 西顿
  rationale: 采用该腓尼基城市在现代汉语中的标准译名。
- source_word: יָם
  choice: 大海
  rationale: 按字面译出并保留大海开口说话的拟人意象。
- source_word: מָעוֹז הַיָּם
  choice: 海上的堡垒
  rationale: מָעוֹז意为堡垒、坚固据点；此处与“大海”的句法关系有歧义，可能进一步描述海，也可能暗指海上堡垒推罗，因此正文采用自然但不过度解释的表达，并以脚注保留其他理解。
- source_word: לֹא חַ֣לְתִּי
  choice: 我没有经历产痛
  rationale: חול／חיל在这里指分娩时的阵痛或挣扎；“经历产痛”既清楚又与下句生产相连。
- source_word: יָלַדְתִּי
  choice: 生产
  rationale: 直接表达生育、分娩之意，并与前面的产痛构成自然次序。
- source_word: גִדַּלְתִּי
  choice: 养育
  rationale: 在儿女语境中表示将人抚育成人；“养育”符合现代汉语。
- source_word: בַּחוּרִים
  choice: 青年男子
  rationale: 该词指年轻男子，并不明确等于“儿子”；译文保留与后面童女之间的性别对应。
- source_word: רוֹמַמְתִּי
  choice: 抚养
  rationale: 该词根通常有举高、提升之意，但在此与养育平行且以年轻女性为宾语，语境义是抚养成人；避免生硬译成“高举”。
- source_word: בְתוּלוֹת
  choice: 童女
  rationale: 保留希伯来词通常所含的未婚贞女含义；脚注说明也可按语境理解为少女或年轻女子。
theological_decisions:
- issue: “大海”与“海上的堡垒”的关系
  choice: 以同位语方式译作“大海，就是海上的堡垒”
  alternative: “大海和海上的堡垒”或将“海上的堡垒”直接解释为推罗
  rationale: 原文可能把“海上的堡垒”作为“大海”的进一步说明，也可能借此暗指推罗；正文保留同位关系及其张力，不把所指武断固定。
translation_notes:
  register: 采用庄重而现代的标准普通话，以“西顿啊”保留先知话语的呼告语气。产育意象用日常可懂的“经历产痛、生产、养育、抚养”表达；对מָעוֹז הַיָּם的句法及所指保持开放。
