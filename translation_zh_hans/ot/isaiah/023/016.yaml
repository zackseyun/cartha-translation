  text: קְחִ֥י כִנּ֛וֹר סֹ֥בִּי עִ֖יר זוֹנָ֣ה נִשְׁכָּחָ֑ה הֵיטִ֤יבִי נַגֵּן֙ הַרְבִּי שִׁ֔יר לְמַ֖עַן תִּזָּכֵֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/016.yaml
  text: Take a lyre[a], go about the city, forgotten prostitute; play skillfully, sing many songs, so that you may be remembered.
translation:
  language: zh_hans
  text: 拿起琴[a]，在城中走来走去吧，被遗忘的妓女！要好好弹奏，多唱些歌，好让人再想起你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琴”原文指古代的一种弦乐器，常译作“里拉琴”或“竖琴”。
    reason: 说明כִנּוֹר的乐器类别及常见译法；现代乐器名称难与古代形制完全对应。
lexical_decisions:
- source_word: קְחִי כִנּוֹר
  choice: 拿起琴
  rationale: קְחִי是阴性单数命令式，意为“拿起”；כִנּוֹר指古代弦乐器。正文用现代汉语较自然的“琴”，脚注说明其具体类型并保留不确定性。
- source_word: סֹבִּי עִיר
  choice: 走遍城中
  rationale: סבב在这里表示在城里巡行；希伯来文没有明示介词。“走遍城中”以自然汉语表达其动态意义，又不把方向限定为只绕城外围。
- source_word: זוֹנָה נִשְׁכָּחָה
  choice: 被遗忘的妓女
  rationale: זוֹנָה直指妓女，נִשְׁכָּחָה为被动意义，修饰前者。保留对推罗的鲜明拟人隐喻，不作淡化。
- source_word: הֵיטִיבִי נַגֵּן
  choice: 要弹得动听
  rationale: הֵיטִיבִי在此修饰弹奏，要求把琴弹好；“动听”适合卖唱求取注意的语境，也比逐字的“好好弹奏”更自然。
- source_word: הַרְבִּי שִׁיר
  choice: 多唱些歌
  rationale: 字面为“增多歌唱/歌曲”；“多唱些歌”清楚传达反复歌唱或唱许多歌的意思。
- source_word: לְמַעַן תִּזָּכֵרִי
  choice: 好让人再想起你
  rationale: לְמַעַן表示目的；תִּזָּכֵרִי为尼法勒未完成式阴性单数，可译“被记起”。汉语用主动泛指“让人想起你”更自然；“再”呼应先前“被遗忘”的语境。
theological_decisions:
- issue: 以妓女比喻推罗
  choice: 正文保留“被遗忘的妓女”这一明确称呼
  alternative: 被遗忘的娼妓；被遗忘的淫妇
  rationale: 本节以妓女卖唱求关注的形象拟人化推罗。译文保留先知话语的尖锐隐喻，同时避免古雅或可能误指一般性淫乱的用词。
- issue: תִּזָּכֵרִי所表达的被动意义
  choice: 译作“让人再想起你”
  alternative: 使你被人记起；好叫你被记念
  rationale: 希伯来文保持“被记起”的语义；现代汉语以泛指主体“人”表达被动更顺畅，不额外断定记起她的是谁，也不赋予“记念”可能带有的宗教褒义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。连续使用对女性说话的命令语气，并以感叹号凸显“被遗忘的妓女”这一呼语；不使用“娼妓”“妓妇”等较古旧表达。
