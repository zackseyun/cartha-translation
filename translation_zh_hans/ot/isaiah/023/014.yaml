  yaml_path: translation/ot/isaiah/023/014.yaml
  text: Wail[a], ships of Tarshish[b], for your stronghold has been destroyed.
translation:
  language: zh_hans
  text: 他施的船只啊，要哀号[a]！因为你们的坚固之所[b]已被摧毁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要号哭！”希伯来语动词指因悲痛或危难而发出的大声哭喊。
    reason: lexical_alternative
  - marker: b
    text: 或译：“堡垒”或“避难所”。这里很可能指推罗，即这些船只的安全依托之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: 哀号
  rationale: 这是复数命令式，表示因悲痛或危难而发出的响亮哭喊。“哀号”既保留强烈语气，也符合现代汉语的先知文学语体。
- source_word: אֳנִיּוֹת
  choice: 船只
  rationale: 原词泛指船，没有修饰语要求译为“商船”或“船队”；“船只”准确且自然。
- source_word: תַּרְשִׁישׁ
  choice: 他施
  rationale: 专名采用中文圣经传统中通行的音译；“他施的船只”保留原文所属关系的开放性。
- source_word: כִּי
  choice: 因为
  rationale: 引出船只应当哀号的原因，在现代汉语中清楚自然。
- source_word: שֻׁדַּד
  choice: 已被摧毁
  rationale: 该被动完成式表达遭受暴力毁坏后的状态；“已被摧毁”保留被动语态和完成意味。
- source_word: מָעֻזְּכֶן
  choice: 你们的保障
  rationale: 该词可指坚固之地、堡垒或避难所，并带第二人称阴性复数后缀，与“船只”呼应。“保障”能保留其作为安全依靠之处的比喻广度，不把它过度具体化为港口。
theological_decisions: []
