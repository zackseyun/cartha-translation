id: ISA.23.13
reference: Isaiah 23:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵ֣ן אֶ֣רֶץ כַּשְׂדִּ֗ים זֶ֤ה הָ/עָם֙ לֹ֣א הָיָ֔ה אַשּׁ֖וּר יְסָדָ֣/הּ לְ/צִיִּ֑ים הֵקִ֣ימוּ בחיני/ו עֹרְרוּ֙ אַרְמְנוֹתֶ֔י/הָ שָׂמָ֖/הּ לְ/מַפֵּלָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/013.yaml
  text: Look at the land of the Chaldeans—this is the people that was not[a]; Assyria appointed it for desert creatures. They set up their siege towers, they stripped her palaces bare[d][c][b], they made her a ruin.
translation:
  language: zh_hans
  text: 看哪，迦勒底人之地！这就是那不曾存在的民族[a]。亚述为旷野生灵奠立了这地[b]。他们架起攻城塔[c]，把她的宫殿剥露出来[d]；他使这地沦为废墟[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“这个民族原本并不存在”或“这个民族无足轻重”。希伯来原句简短，含义很难确定。
    reason: alternative_reading
  - marker: b
    text: “旷野生灵”也可指“旷野居民”；本句也可译作“亚述为旷野居民建立了这地”。
    reason: lexical_alternative
  - marker: c
    text: 译作“攻城塔”的希伯来词形和含义不确定；也有人译作“瞭望塔”或“堡垒”。
    reason: textual_variant
  - marker: d
    text: “剥露出来”也可译作“使……裸露”或按语境译作“拆毁”。
    reason: lexical_alternative
  - marker: e
    text: 原文此处的动词是阳性单数“他使”，前两个动词则是复数“他们”；“他”可能指亚述。也可依照上下文译作“他们使这地沦为废墟”。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意的指示感叹词；“看哪”简洁、庄重，也保留原文突出的语气。
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: 迦勒底人之地
  rationale: 保留原文的属格结构和民族—地域双重含义，而不直接将其化约为单一地名“迦勒底”。
- source_word: זֶה הָעָם לֹא הָיָה
  choice: 这就是那不曾存在的民族
  rationale: 原句极其简略且解释困难；此译尽量保留“没有／不存在”的字面张力，不擅自确定为“无足轻重”或加入更明确的历史时间框架。
- source_word: אַשּׁוּר יְסָדָהּ
  choice: 亚述……奠立了这地
  rationale: יסד的基本义是奠基、建立；“奠立”既贴近原词，又避免把上下文关系直接解释为“指定”。阴性宾语后缀按中文所指译为“这地”。
- source_word: לְצִיִּים
  choice: 为旷野生灵
  rationale: 该复数名词通常指荒野中的生物，但也可能指荒野居民；“旷野生灵”保留非人类所指的主要可能，又不限定具体兽类。
- source_word: הֵקִימוּ בחיניו
  choice: 他们架起攻城塔
  rationale: 相关希伯来词形和确切所指不确定；在围攻、宫殿遭毁与废墟的语境中，“攻城塔”较为连贯，同时以脚注保留其他可能。
- source_word: עֹרְרוּ אַרְמְנוֹתֶיהָ
  choice: 剥露了其中的宫殿
  rationale: 此处动词宜按“使裸露、剥开”理解；“剥露”保留破坏性动作，又不像“拆毁”那样把结果解释得过满。
- source_word: שָׂמָהּ לְמַפֵּלָה
  choice: 他使这地沦为废墟
  rationale: 动词形式为第三人称阳性单数，故正文保留从复数“他们”转为单数“他”的突变；宾语按中文明确为“这地”，לְמַפֵּלָה译出成为倾覆废墟的结果。
theological_decisions:
- issue: 困难短句“这民族不曾存在”的含义
  choice: 保留存在与否的字面悖论，并以脚注列出主要理解
  alternative: 译为“这个民族原本无足轻重”或“这个民族从前并不存在”
  rationale: 原文不足以排除“并不存在”“尚未形成”或“无足轻重”等理解；不应让译文替读者解决这一历史与修辞难题。
- issue: 末句施事者由复数转为单数
  choice: 译作“他们……；他……”并加注说明
  alternative: 为行文连贯统一译作“他们使这地沦为废墟”
  rationale: 原文形态上的主语变化可能有解释意义，也可能源于艰难文本；正文保留这种张力比无声统一主语更忠实。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“看哪”保留先知性宣告语气；“奠立”“沦为废墟”较为凝练，但仍属现代读者可理解的表达。正文不抹平原文的突兀句法、词义不确定性及末句主语变化，必要处用脚注交代。
