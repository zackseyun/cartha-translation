base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/005.yaml
  text: When the report comes to Egypt[a], they will writhe at the report of Tyre.
translation:
  language: zh_hans
  text: 消息传到埃及的时候，埃及人一听见推罗的消息，就必痛苦地战栗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “痛苦地战栗”也可译作“痛苦不安”、“颤抖”或“疼痛”。原词可描写扭动、震颤，甚至类似产痛的剧烈痛苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ……的时候
  rationale: 这里引出时间从句，表示消息传到埃及时所发生的反应；比比较性的“正如”更符合上下文。
- source_word: שֵׁמַע
  choice: 消息
  rationale: 该名词可指听闻、消息或传闻；现代汉语用“消息”自然，并可在前后两处保留希伯来文的重复。
- source_word: לְמִצְרָיִם
  choice: 传到埃及
  rationale: 将介词 ל 理解为方向，表示有关推罗的消息抵达埃及；“传到”补明希伯来文省略的动作，使中文通顺。
- source_word: יָחִילוּ
  choice: 痛苦战栗
  rationale: חול 在此描写强烈而带身体反应的痛楚、扭动或颤抖；“痛苦战栗”兼顾痛楚与震颤的语义幅度，避免将意象缩减为一般忧伤。
- source_word: כְּשֵׁמַע
  choice: 一听见……的消息
  rationale: כְּ 在这里表示引发反应的时机，可自然译作“一……就……”；同时保留“消息”这一关键词。
- source_word: צֹר
  choice: 推罗
  rationale: 采用该地名在现代中文圣经和一般中文中的通行译名。
theological_decisions:
- issue: 复数动词 יָחִילוּ 的主语在希伯来文中未明说
  choice: 译作“埃及人”
  alternative: 译作“他们”或保留无明确主语的表达
  rationale: 上下文中消息传到埃及，复数反应者自然指埃及居民；中文若只说“他们”会缺少明确的先行对象。此处只是补足语法所需的隐含主语，不增加特定神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一听见……就……”清楚呈现消息引发痛苦反应的关系；前后重复“消息”，呼应希伯来文两次出现的 שֵׁמַע。标点后的脚注标记指向 יָחִילוּ 的词义幅度。
