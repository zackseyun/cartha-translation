  text: דֹּ֖מּוּ יֹ֣שְׁבֵי אִ֑י סֹחֵ֥ר צִיד֛וֹן עֹבֵ֥ר יָ֖ם מִלְאֽוּ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/002.yaml
  text: Be silent[a], inhabitants of the coastland; the merchant of Sidon, crossing the sea[b], has filled you.
translation:
  language: zh_hans
  text: 沿海地区[a]的居民啊，你们要静默！西顿的商人横越海洋，使你充盈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“岛屿”；希伯来语 אִי 可指岛屿，也可指沿海地区。
    reason: lexical_alternative
  - marker: b
    text: 本句也可按商业语境理解为：“横越海洋的西顿商人供应你”，或“横越海洋的西顿商贸成了你的收益”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹּמּוּ
  choice: 要静默
  rationale: 这是דמם的复数命令式；“要静默”保留命令语气，并传达审判临到时震惊无言的意味，而不额外限定为哀悼。
- source_word: יֹשְׁבֵי אִי
  choice: 沿海地区的居民
  rationale: יֹשְׁבֵי是作名词用的构造式分词；אִי既可指岛屿，也可指滨海地区。腓尼基航海语境中，“沿海地区”自然且不过度局限于一座岛。
- source_word: סֹחֵר צִידוֹן
  choice: 西顿的商人
  rationale: סֹחֵר在形式上为单数，可作集合性或代表性称谓；译文保留单数，不擅自改为复数。
- source_word: עֹבֵר יָם
  choice: 渡海而来
  rationale: 分词短语描写持续的航海贸易活动；“渡海而来”在现代汉语中自然，并保留跨越海洋的动态意象。
- source_word: מִלְאֻךְ
  choice: 使你充盈
  rationale: 保留מלא“充满”的核心意象及阴性单数第二人称宾语，同时用较自然的汉语表达；上下文中的商业含义存在，但正文不将其明确化为“供应”或“收益”。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“居民啊，要静默”保留先知宣告的呼告与命令语气；“使你充盈”刻意保留原文在一般性的“充满”和商业性的“供应、收益”之间的张力，并以脚注列出其他可能理解。
