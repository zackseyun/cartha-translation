  text: וְ/הָיָ֨ה סַחְרָ֜/הּ וְ/אֶתְנַנָּ֗/הּ קֹ֚דֶשׁ לַֽ/יהוָ֔ה לֹ֥א יֵֽאָצֵ֖ר וְ/לֹ֣א יֵֽחָסֵ֑ן כִּ֣י לַ/יֹּשְׁבִ֞ים לִ/פְנֵ֤י יְהוָה֙ יִֽהְיֶ֣ה סַחְרָ֔/הּ לֶ/אֱכֹ֥ל לְ/שָׂבְעָ֖ה וְ/לִ/מְכַסֶּ֥ה עָתִֽיק׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/018.yaml
  text: And her merchandise and her wages will be holy to Yahweh[a]; they will not be stored up or hoarded, for her merchandise will be for those who dwell before Yahweh[b], for eating to satisfaction and for durable clothing.
translation:
  language: zh_hans
  text: 她的货物和雇价都要归耶和华为圣[a]，不被积存，也不被储藏；因为她的货物要供给那些住在耶和华面前的人，使他们吃得饱足，并有耐穿的衣服[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雇价”也可译作“酬金”或“报酬”。原词常可指妓女所得的报酬，可能呼应本章把推罗比作妓女的意象。
    reason: lexical_alternative
  - marker: b
    text: “耐穿的衣服”所对应的原文短语含义较难确定；也可理解为“华美的衣服”“上好的衣服”或“充足的遮盖物”。
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: סַחְרָהּ
  choice: 她的货物
  rationale: 该词可指贸易、商品或商业所得；本章以推罗的海上贸易为背景，“货物”具体自然，也与后文重复出现的同一词保持一致。
- source_word: אֶתְנַנָּהּ
  choice: 所得的雇价
  rationale: 该词指雇价、酬金，并常可带有娼妓所得报酬的意味。译作“所得的雇价”既能与商业收益衔接，也保留本章将推罗比作妓女的意象。
- source_word: קֹדֶשׁ לַיהוָה
  choice: 归耶和华为圣
  rationale: 准确表达分别、奉献给耶和华的祭祀性含义，比单说“归给”更能保留 קֹדֶשׁ 的神圣内涵。
- source_word: יֵאָצֵר וְלֹא יֵחָסֵן
  choice: 不再积存，也不再囤积
  rationale: 两个近义动词形成平行。“积存”和“囤积”既作区分，又共同表达不把财富储藏起来的意思。
- source_word: לַיֹּשְׁבִים לִפְנֵי יְהוָה
  choice: 归给那些住在耶和华面前的人
  rationale: 保留“住”和“在……面前”的原文表达，不将其所指过早限定为祭司或其他特定群体。
- source_word: לֶאֱכֹל לְשָׂבְעָה
  choice: 使他们吃得饱足
  rationale: 自然表达吃到满足、饱足的结果，也符合现代汉语习惯。
- source_word: לִמְכַסֶּה עָתִיק
  choice: 并有耐穿的衣服
  rationale: מכסה 可指遮盖物或衣服；罕见的 עתיק 在此可能指耐久、上好或华美。正文采用符合生活供应语境的“耐穿”，并以脚注保留不确定性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用普通中文读者最熟悉且具有专名功能的“耶和华”；该词在原文中是神的名字，而非一般称号。
- issue: 推罗商业所得的性质
  choice: 归耶和华为圣
  alternative: 分别归给耶和华
  rationale: 原文明确使用 קֹדֶשׁ，表明这些所得被神圣地分别出来；译文保留这一奉献含义，不进一步断定其具体管理方式。
- issue: “住在耶和华面前的人”的身份
  choice: 不明确限定
  alternative: 祭司或敬拜者
  rationale: 原文没有明确指出这一群体的具体身份，因此保留开放表述，避免把合理推测写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“归……为圣”保留经文的祭祀性语言；“积存／囤积”和“吃得饱足／耐穿的衣服”则用普通读者容易理解的表达。
