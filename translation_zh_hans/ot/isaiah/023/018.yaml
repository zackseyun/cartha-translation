  to: 她的货物和雇价都要归耶和华为圣[a]，不被积存，也不被储藏；因为她的货物要供给那些住在耶和华面前的人，使他们吃得饱足，并有耐穿的衣服[b]。
  rationale: 修订删除“所得的”的重复表达，并将两个否定动词译为“不被积存，也不被储藏”，以反映希伯来文的被动语态且避免加入“再”的时间暗示。后半句改作“供给……使……并有……”，更自然地呈现货物供耶和华面前居住者食用和穿着的目的。保留“归耶和华为圣”、神名“耶和华”及末语的疑难脚注，避免把有争议的עָתִיק含义定死。
