lexical_decisions:
- source_word: עִבְרוּ
  choice: 渡到……去
  rationale: 该复数祈使式表达越过、渡往某处；结合他施这一海上目的地，用“渡到……去”自然地保留了渡行之意，又不额外说明逃亡等动机。
- source_word: תַּרְשִׁישָׁה
  choice: 到他施去
  rationale: 专名带方向词尾，表示朝向他施移动；“到他施去”符合现代汉语表达。
- source_word: הֵילִילוּ
  choice: 哀号
  rationale: 该复数祈使式指因悲痛或灾难发出强烈哭喊；“哀号”兼具悲哀与高声呼号的力度。
- source_word: יֹשְׁבֵי
  choice: ……的居民
  rationale: 分词在此作名词使用，指居住于该地的人；译为“居民”简洁自然。
- source_word: אִי
  choice: 海岛
  rationale: 该词可指岛屿，也可指沿海地区或海疆；正文采用直接的单数义“海岛”，并以脚注保留“沿海地区”的语义可能。
