  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/נִשְׁכַּ֤חַת צֹר֙ שִׁבְעִ֣ים שָׁנָ֔ה כִּ/ימֵ֖י מֶ֣לֶךְ אֶחָ֑ד מִ/קֵּ֞ץ שִׁבְעִ֤ים שָׁנָה֙ יִהְיֶ֣ה לְ/צֹ֔ר כְּ/שִׁירַ֖ת הַ/זּוֹנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/015.yaml
  text: 'And in that day Tyre will be forgotten for seventy years[a], like the days of one king. At the end of seventy years[b], it will happen to Tyre as in the song of the prostitute:'
translation:
  language: zh_hans
  text: 到那日，推罗必被遗忘七十年；这七十年如同一位君王的年日[a]。七十年期满时，推罗的情形将如妓女之歌所言[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“如同一位君王的一生”。希伯来文直译为“如同一位君王的年日”。
    reason: 保留“一个王的年日”所指为君王寿命或其他相应时段的解释空间，不在正文中限定为其在位年限。
  - marker: b
    text: 也可较直译为：“推罗将如同妓女之歌。”
    reason: 保留希伯来文简练的比较结构；正文以“所言”自然引出下一节引用的歌曲。
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知话语中常见的时间表达；“到那日”自然、庄重，并保留其指向未来的语气。
- source_word: וְנִשְׁכַּחַת
  choice: 必被遗忘
  rationale: שׁכח 的尼法勒形态表达被动或结果状态；“被遗忘”准确传达推罗不再受人关注的景象，“必”则体现预言语境中的将来确定性。
- source_word: צֹר
  choice: 推罗
  rationale: 采用该城名在现代中文圣经与历史文献中的通行译名。
- source_word: שִׁבְעִים שָׁנָה
  choice: 七十年
  rationale: 直接保留原文明确的时段，不把它象征化或改写为不确定的长期。
- source_word: כִּימֵי מֶלֶךְ אֶחָד
  choice: 如同一位君王在位的年日
  rationale: 保留比较词“如同”和复数“年日”；补出“在位”以使中文可懂，同时不武断地把这段时期解释为君王的寿命。
- source_word: מִקֵּץ
  choice: 期满时
  rationale: 表示七十年这一时段结束之际；“期满时”比逐字译作“从……尽头”更符合现代汉语。
- source_word: יִהְיֶה לְצֹר
  choice: 推罗的景况将……
  rationale: היה ל 在这里引出临到推罗的情形；译作“景况将”使中文句子完整，又不具体限定事件性质。
- source_word: כְּשִׁירַת הַזּוֹנָה
  choice: 如妓女之歌所唱的那样
  rationale: 比较结构承接下一节将引用的歌曲；此译法自然地引出后文，同时保留“妓女”这一直接而有力的比喻。
theological_decisions:
- issue: 将推罗比作妓女的商业隐喻
  choice: 直接保留“妓女”
  alternative: 淫荡的女子；娼妓
  rationale: 原文用 זונה 构成带有性意味的商业隐喻，并与下一节的歌曲紧密相连。弱化或抽象化这一称呼会削减先知话语的修辞力度；“妓女”在现代汉语中准确而不过分古雅。
- issue: “一位君王的年日”所指的时长
  choice: 正文译作“一位君王在位的年日”，并以脚注保留“一生”的可能
  alternative: 一位君王的一生
  rationale: 原文只说“如同一位君王的年日”，没有明确使用“统治”或“寿命”一词。正文以较自然的中文表达其王朝时间背景，但通过脚注保留另一种理解，避免消除原文的含混性。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“到那日”“必被遗忘”“期满时”保持先知宣告的凝练语气；“妓女”直接传达原文修辞，不使用古雅的“娼妓”或弱化表达。两个脚注标记均置于正文相关语句之后。
