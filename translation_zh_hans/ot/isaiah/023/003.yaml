base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/003.yaml
  text: On many waters was the grain of Shihor[a], the harvest of the Nile, her revenue[b]; and she became the merchant of nations.
translation:
  language: zh_hans
  text: 在众水之上，西曷[a]的粮食——尼罗河的收成——是她的收入；她成了万国的商贾[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西曷”可能指尼罗河或其一条支流；也可译为“尼罗河的粮食”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“万国的商品”或“万国的贸易”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמַיִם רַבִּים
  choice: 在众水之上
  rationale: 保留ב的空间或媒介意味及海上运输的图景；在推罗的贸易语境中，“众水”指向跨海商路。
- source_word: זֶרַע
  choice: 五谷
  rationale: 与“收成”和商业进项并列，所指是作为商品的谷物，而非供播种的种子或后裔。
- source_word: שִׁחֹר
  choice: 西曷
  rationale: 按专名音译，以保存原文地名；其具体所指可能是尼罗河或其一条支流，详见脚注。
- source_word: קְצִיר יְאֹר
  choice: 尼罗河的收成
  rationale: 在埃及语境中，יְאֹר通常指尼罗河或其水道；此译自然表达属格关系。
- source_word: תְּבוּאָתָהּ
  choice: 成了她的进项
  rationale: תְּבוּאָה可指产物、收益或进项；此处描述推罗从埃及农产贸易所得，故译“进项”，并以“她”承接阴性城市推罗。
- source_word: וַתְּהִי
  choice: 她也成了
  rationale: 体现动词所表达的形成或结果状态，并以阴性代词承接推罗。
- source_word: סְחַר גּוֹיִם
  choice: 万国的商贾
  rationale: סְחַר可指贸易、商品或从商者；“商贾”较贴合此处把推罗人格化为国际贸易经营者的表述，同时保留其他词义于脚注。
theological_decisions: []
