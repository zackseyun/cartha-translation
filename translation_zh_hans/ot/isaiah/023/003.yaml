- from: 在众水之上，西曷[a]的五谷、尼罗河的收成，成了她的进项；她也成了万国的商贾[b]。
  to: 在众水之上，西曷[a]的粮食——尼罗河的收成——是她的收入；她成了万国的商贾[b]。
  rationale: 修订仅澄清原文的同位与表语关系：西曷的粮食（即尼罗河的收成）是推罗的收入，而非货物本身转变为收入。保留“众水”的海上贸易图景、专名音译，以及末句对推罗的女性人格化。
