  source_fidelity: 原文将“西曷的粮食”与“尼罗河的收成”并列（或同位）说明，并称其为推罗的收益；草稿“……收成，成了她的进项”容易读成粮食和收成本身发生转变，未清楚表达“是她的收益”。末句“商贾”可保留推罗人格化为贸易经营者的意象。
  naturalness: “在众水之上”保留庄重的经文意象，但应调整主干关系，使现代汉语清楚表达这些农产所带来的收益。“五谷”在现代汉语中可指多种粮食作物，较“粮食”略显特指；原文此处是可贸易的谷物/粮产，译为“粮食”更稳妥。
  terminology: “西曷”作为专名音译合适，脚注说明其可能所指即可。“收入”比“进项”更自然且仍可表达商业收益。“万国的商贾”虽有文言色彩，但在庄重经文体中可接受，并较好对应将推罗描写为国际贸易者的表达。
