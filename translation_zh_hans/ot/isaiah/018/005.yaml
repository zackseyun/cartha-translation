  text: כִּֽי לִ/פְנֵ֤י קָצִיר֙ כְּ/תָם פֶּ֔רַח וּ/בֹ֥סֶר גֹּמֵ֖ל יִֽהְיֶ֣ה נִצָּ֑ה וְ/כָרַ֤ת הַ/זַּלְזַלִּים֙ בַּ/מַּזְמֵר֔וֹת וְ/אֶת הַ/נְּטִישׁ֖וֹת הֵסִ֥יר הֵתַֽז־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/005.yaml
  text: For before the harvest[a], when the blossom is finished and the flower becomes a ripening grape, he will cut off the shoots with pruning knives[b], and he will remove and lop off the spreading branches.
translation:
  language: zh_hans
  text: 因为在收割以前[a]，当花谢了，花朵变成正在发育的青葡萄时，他就要用修枝刀剪掉嫩枝[b]，又把蔓生的枝条除去、砍掉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当花谢了，花朵变成未熟的葡萄时。”希伯来文的图景由开花推进到收割前果实仍在发育的阶段。
    reason: lexical_alternative
  - marker: b
    text: 这里指葡萄藤生长部分的两个希伯来词都较罕见；可译为“细枝”“卷须”或“垂曳的枝条”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 省略显式连接词
  rationale: 此处承接上文作解释；现代汉语可借语序自然表达因果或说明关系，若硬译“因为”会使单节显得悬空。
- source_word: לִפְנֵי קָצִיר
  choice: 收割以前
  rationale: 直接保留农业场景中的时间界限；“收割”也能涵盖葡萄采收的语境。
- source_word: כְּתָם פֶּרַח
  choice: 花期一结束
  rationale: תם表示达到终点或完成；“花期结束”自然表达开花阶段告终，同时不把具体植物过程解释得过细。
- source_word: וּבֹסֶר גֹּמֵל יִהְיֶה נִצָּה
  choice: 花朵结成渐熟的葡萄
  rationale: בֹסֶר指未熟葡萄，גֹּמֵל描写发育趋熟，נִצָּה与花朵相关；译文保留从花到果、尚未成熟的进程。
- source_word: וְכָרַת
  choice: 他就要……剪掉
  rationale: 在时间从句之后描写将发生的行动，以“就要”表达预告性的将来，并保留动作的骤然性。
- source_word: הַזַּלְזַלִּים
  choice: 嫩枝
  rationale: 该词指葡萄藤新生或茂盛的细枝；“嫩枝”适合修剪场景，但因词义罕见而加注说明。
- source_word: בַּמַּזְמֵרוֹת
  choice: 用修枝刀
  rationale: 指修剪葡萄藤的器具；“修枝刀”具体而不引入现代剪刀结构的时代错置。
- source_word: הַנְּטִישׁוֹת
  choice: 蔓生的枝条
  rationale: 罕见词，可能指伸展、垂曳或蔓延的藤枝；“蔓生的枝条”贴合葡萄藤形象，又避免过度确定。
- source_word: הֵסִיר הֵתַז
  choice: 除去、砍下
  rationale: 保留两个连续动词及其加强效果：先除去，再砍落；顿号使汉语简洁而有力度。
theological_decisions:
- issue: 修剪行动者的身份
  choice: 保留代词“他”而不在本节补明身份
  alternative: 明确译作“耶和华”或“神”
  rationale: 希伯来文本本节仅用动词的第三人称阳性单数形式；不把上下文推断直接写入正文，可保留原文指涉方式与文学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“花期”“渐熟”“修枝刀”“蔓生”等词清楚呈现葡萄栽培图景；正文保持紧凑，罕见植物术语的歧义置于脚注，不在正文中过度释义。
