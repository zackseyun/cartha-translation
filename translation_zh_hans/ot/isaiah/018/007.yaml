source:
  edition: WLC
  text: בָּ/עֵת֩ הַ/הִ֨יא יֽוּבַל שַׁ֜י לַ/יהוָ֣ה צְבָא֗וֹת עַ֚ם מְמֻשָּׁ֣ךְ וּ/מוֹרָ֔ט וּ/מֵ/עַ֥ם נוֹרָ֖א מִן ה֣וּא וָ/הָ֑לְאָה גּ֣וֹי קַו קָ֣ו וּ/מְבוּסָ֗ה אֲשֶׁ֨ר בָּזְא֤וּ נְהָרִים֙ אַרְצ֔/וֹ אֶל מְק֛וֹם שֵׁם יְהוָ֥ה צְבָא֖וֹת הַר צִיּֽוֹן־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/007.yaml
  text: At that time a gift will be brought to the LORD of Armies from a people tall and smooth-skinned, from a people feared far and wide, a nation of command upon command and trampling, whose land rivers divide, to the place of the name of the LORD of Armies, Mount Zion.
translation:
  language: zh_hans
  text: 那时，必有礼物从一个身材高大、皮肤光滑的民族那里，带到万军之耶和华面前；这个民族远近都令人畏惧，是一个号令接连不断、践踏别人的民族[a]，国土被河流切割。这礼物要带到万军之耶和华名所在的地方，就是锡安山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “号令接连不断”所译的希伯来语含义不确定，字面与“绳线又绳线”有关；也有人译作“被量度又量度”或“一派强盛”。“践踏别人”也可译作“遭践踏”。
    reason: קַו קָו与מְבוּסָה在本节的具体含义和主动／被动指向均有解释分歧；脚注保留主要可能性，避免把争议当作定论。
lexical_decisions:
- source_word: שַׁי
  choice: 礼物
  rationale: 可指献给尊贵者的礼物或贡物；“礼物”保留其较宽泛的意义，不预先断定这是被迫缴纳的贡赋。
- source_word: מְמֻשָּׁךְ וּמוֹרָט
  choice: 身材高大、皮肤光滑
  rationale: מְמֻשָּׁךְ有“拉长、修长”之意，在描述民族体貌时自然译为“身材高大”；מוֹרָט可指光滑、无毛或剃净，结合人物外貌译作“皮肤光滑”。
- source_word: נוֹרָא מִן־הוּא וָהָלְאָה
  choice: 远近都令人畏惧
  rationale: 该表达强调其威名延伸至远方；此译法用现代汉语传达“从那里直到更远之处”的范围意味。
- source_word: קַו קָו וּמְבוּסָה
  choice: 强盛而践踏四方
  rationale: קַו קָו在本节语义不确定，可能涉及力量、号令、丈量或反复的“线”；结合מְבוּסָה所表达的践踏、征服含义，正文采用语境通顺但不作过细限定的译法，并以脚注说明。
- source_word: בָּזְאוּ נְהָרִים אַרְצוֹ
  choice: 国土被河流切割
  rationale: בזא在此与河流作主语，可能描写冲刷、分割或蹂躏土地；“切割”贴合地理图景，也避免把它窄化为人的劫掠行为。
- source_word: מְקוֹם שֵׁם יְהוָה צְבָאוֹת
  choice: 万军之耶和华名所在的地方
  rationale: 保留“名”与“地方”的圣所语言，不将其直接改写为一般性的“耶和华居住之处”。
theological_decisions:
- issue: 礼物与该民族之间的关系
  choice: 译为“礼物从……民族那里……带到”，并在后句重申“这礼物”
  alternative: 把该民族本身理解为被献上的礼物
  rationale: 介词מִן明确出现在第二个“民族”之前，语境也支持该民族献礼；但希伯来语首个“民族”前省略介词，句法略显压缩，因此不进一步说明礼物的具体内容。
- issue: 神名与称号的译法
  choice: 万军之耶和华
  alternative: 万军之主／雅威万军之神
  rationale: “耶和华”是简体中文圣经传统中广为人知的专名形式；“万军之”保留צְבָאוֹת的称号结构，不额外解释“军队”是天军还是地上军旅。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“万军之耶和华”“名所在的地方”等保留先知书的神圣语域；对民族体貌和地理描述则使用普通读者易懂的现代措辞。
