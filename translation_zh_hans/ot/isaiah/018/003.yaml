base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/003.yaml
  text: 'All you inhabitants of the world[a], and you dwellers on the earth: when a banner is raised on the mountains, you will see it; and when a trumpet is blown[b], you will hear it.'
translation:
  language: zh_hans
  text: 世上一切的居民，地上所有的住民啊！当山上竖起旗号[a]时，你们就会看见；当号角[b]吹响时，你们就会听见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旗号”或译“信号”或“旌旗”；希伯来语 נֵס 指竖立起来、可从远处看见的标志。
    reason: lexical_alternative
  - marker: b
    text: “号角”或译“角”或“羊角号”；希伯来语 שׁוֹפָר 通常指用羊角制成、用于发出信号的号角。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: 世上所有的居民
  rationale: 保留“所有”所表达的普世范围；“世上”自然传达 תֵבֵל 所指有人居住的世界。
- source_word: וְשֹׁכְנֵי אָרֶץ
  choice: 地上所有的住民
  rationale: 保留与上句近义的诗歌平行，也用“住民”形成适度措辞变化；补出“所有的”使汉语中的普遍呼召清楚自然。
- source_word: כִּנְשֹׂא
  choice: 竖起……时
  rationale: 在此按时间关系理解 כִּי；原文未说明执行者，汉语以无主句保留这一点。
- source_word: נֵס
  choice: 旗号
  rationale: 该词指竖立在高处、供远方看见的标志；“旗号”兼顾旗帜实体与公共信号的功能。
- source_word: הָרִים
  choice: 山上
  rationale: 保留复数群山的整体意象；现代汉语通常无需明示复数。
- source_word: תִּרְאוּ
  choice: 你们要看
  rationale: 保留第二人称复数和公开召唤的语气，不另加原文没有明说的宾语。
- source_word: וְכִתְקֹעַ שׁוֹפָר
  choice: 号角吹响时
  rationale: 与前一时间分句保持平行；采用无主表达，保留吹角者未被指明这一特点。
- source_word: שׁוֹפָר
  choice: 号角
  rationale: 既符合古代以角发声传讯的器物，也比泛称“喇叭”更贴近历史语境。
- source_word: תִּשְׁמָעוּ
  choice: 你们要听
  rationale: 保留第二人称复数及召唤语气，并不把“听”进一步解释为“顺从”。
theological_decisions:
- issue: תִּרְאוּ 与 תִּשְׁמָעוּ 的情态
  choice: 译作“你们要看……你们要听”
  alternative: “你们会看见……你们会听见”
  rationale: 希伯来语未完成式在这一普世呼召中可带指令或预期意味；正文采用较符合先知号召语境的“要”，但不强化为命令性更强的“务必”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两组近义称呼和两个时间分句保持诗歌平行；以“啊”呈现直接面向全地居民的呼召。脚注标记依其实际词汇对象分别置于“旗号”和“号角”之后。
