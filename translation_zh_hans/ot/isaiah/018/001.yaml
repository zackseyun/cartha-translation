  text: ה֥וֹי אֶ֖רֶץ צִלְצַ֣ל כְּנָפָ֑יִם אֲשֶׁ֥ר מֵ/עֵ֖בֶר לְ/נַֽהֲרֵי כֽוּשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/001.yaml
  text: Ah[a], land of whirring wings, which is beyond the rivers of Cush[b],
translation:
  language: zh_hans
  text: '唉，翅膀嗡鸣之地啊！[a]

    你在古实诸河的彼岸。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “翅膀嗡鸣”原文含义难定，也可译作“翅膀沙沙作响”或“飞翼嗡嗡作响之地”；这说法可能令人想到翅膀、昆虫，或某种翼状物移动的声音。
    reason: lexical_alternative
  - marker: b
    text: 古实指埃及以南的地区，通常与努比亚或古代埃塞俄比亚一带有关，并不等同于某个现代国家。
    reason: cultural_note
lexical_decisions:
- source_word: הוֹי
  choice: 唉
  rationale: 这是可引出哀叹、警告或呼唤的感叹词；本节尚未明确宣告灾祸，译作“唉”既保留感叹语气，也不提前限定为“祸哉”。
- source_word: אֶרֶץ
  choice: 地
  rationale: 此处指一个地理区域；“地”自然、庄重，又不把它限定为现代国家。
- source_word: צִלְצַל כְּנָפָיִם
  choice: 翅膀嗡鸣之地
  rationale: 原文短语含义困难，可能使人联想到翅膀、昆虫或翼状物运动时的声响；此译保留“翅膀”的具体意象和声音感，而不确定具体所指。
- source_word: מֵעֵבֶר לְנַהֲרֵי
  choice: 在……众河的彼岸
  rationale: 表达位于诸河另一边的方位。“彼岸”符合先知书的庄重语体，也保留从说话者视角所见的远方位置。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 采用该圣经地名在现代中文中的通行音译，不用“埃塞俄比亚”等现代国名替代，以免作过度的地缘认定。
theological_decisions:
- issue: הוֹי 的语气
  choice: 译作“唉”，保留感叹而不明确判定为灾祸宣告
  alternative: “祸哉”或“啊”
  rationale: 该词可用于哀叹、威胁或呼唤；上下文在本节开头仍有语气张力，不宜径直定为定罪宣告。
- issue: 古实的地理认定
  choice: 保留历史地名“古实”
  alternative: “努比亚”或“埃塞俄比亚”
  rationale: 原文只给出古代地名；采用音译可避免把它等同于某一现代国家，同时保留其圣经历史语境。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。以两行呈现呼语与方位描述；“唉……啊”传达希伯来语开头的强烈呼告，“众河”反映复数形式。脚注保留关键词组的真实歧义和历史地理背景。
