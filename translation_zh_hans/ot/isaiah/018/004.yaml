source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֵלַ֔/י אשקוטה וְ/אַבִּ֣יטָה בִ/מְכוֹנִ֑/י כְּ/חֹ֥ם צַח֙ עֲלֵי א֔וֹר כְּ/עָ֥ב טַ֖ל בְּ/חֹ֥ם קָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/004.yaml
  text: 'For this is what Yahweh said to me: “I will remain quiet and look on from my dwelling place[a], like clear heat in sunshine[b], like a cloud of dew in the heat of harvest.”'
translation:
  language: zh_hans
  text: '因为耶和华这样对我说：


    “我要安静，


    并从我的居所观看[a]，


    好像阳光下清澈的热气[b]，


    又像收割时炎热中的露云。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要安静，在我固定的位置观看。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“好像在光之上的清澈热气。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中最通行、最易辨识的专名译法，明确保留以色列之神的立约名，而不以“主”替代。
- source_word: אֵלַי
  choice: 对我
  rationale: אֶל带第一人称单数词尾，在“说”之后自然表示话语所指向的对象；原文明确有“对我”，故予以保留。
- source_word: אשקוטה
  choice: 我要静静不动
  rationale: שׁקט表示安静、平静、不受扰动；“静静不动”在此体现有意保持静止而暂不介入，避免“休息”可能带出的疲乏含义。
- source_word: וְאַבִּיטָה
  choice: 观看
  rationale: נבט表示看、注视；“观看”既可表达持续观察，也不额外解释为冷漠或准备审判。
- source_word: בִמְכוֹנִי
  choice: 从我的居所
  rationale: מָכוֹן指固定、设立之处，也可指居所；结合“观看”的视点，以“从我的居所”表达所在之处兼观察起点。脚注保留“在我固定的位置”的较形式对应译法。
- source_word: כְּחֹם צַח
  choice: 好像……清澈的热气
  rationale: חֹם是热、热气，צַח有明净、清澈或明亮之意；此译保留原文不寻常的气象意象，不将其具体化为热浪。
- source_word: עֲלֵי אוֹר
  choice: 阳光下
  rationale: 字面为“在光之上”；上下文是自然景象，汉语以“阳光下”自然传达明亮日光中的热气，同时用脚注保存字面形式。
- source_word: כְּעָב טַל
  choice: 又像……露云
  rationale: עָב为云，טַל为露水；“露云”简洁保留两个具体意象及其紧密关系，不擅自改为雨云或雾。
- source_word: בְּחֹם קָצִיר
  choice: 收割季节炎热时
  rationale: 保留收割的时令背景和炎热情境，并按现代汉语语序自然表达。
theological_decisions:
- issue: 上帝静止与观看的姿态
  choice: 直译为“静静不动……观看”，不说明这是漠不关心、安息，还是暗中预备审判。
  alternative: 可译为“我要安歇并观看”，强调平静安歇；也可释义为暂缓行动、等待审判时机。
  rationale: 原文以两个自然界比喻呈现耶和华安静观看的姿态，却未在本节直接解释其动机；译文保留这种张力。
- issue: 两个气象比喻的性质
  choice: 保留“清澈的热气”和“露云”这两个较陌生的意象。
  alternative: 可将其解释为烈日下的热浪和收割季节的清凉露雾。
  rationale: 经文本身将炎热与露云并列，释义性改写容易把意象统一为恩惠、威胁或审判征兆；正文不替原文消除这种张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。诗行按原文陈述和两个平行比喻分行；“静静不动”比“安歇”更少引入疲乏或休息的联想。“露云”略带诗性，但可让普通读者理解，并保留原文紧凑、陌生的气象组合。
