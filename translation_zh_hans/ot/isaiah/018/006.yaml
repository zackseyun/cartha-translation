base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/006.yaml
  text: They will all be left to the birds of prey of the mountains and to the beasts of the earth[a]; and the birds of prey will summer on them[b], and every beast of the earth will winter on them.
translation:
  language: zh_hans
  text: 它们都要被撇下，留给山中的猛禽和地上的野兽[a]；猛禽要在它们身上度夏[b]，地上所有的野兽都要在它们身上过冬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们要一同被撇下，给山中的猛禽和地上的野兽。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来语这里用单数形式（“猛禽”“在它身上”），但具有集合意义；正文按复数所指译为“它们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָזְבוּ
  choice: 要被撇下
  rationale: 该词是עזב的尼法勒未完成式，结合语境宜作被动，描写它们被弃置、暴露在食腐鸟兽面前。“被撇下”既保留原文动作，也符合庄重的现代汉语。
- source_word: יַחְדָּו
  choice: 都
  rationale: 该副词本义为“一同、一起”，这里强调全体无一例外；正文用“都”自然传达其集合意义，另以脚注保留“一同”的直译可能。
- source_word: לְעֵיט הָרִים
  choice: 给山中的猛禽
  rationale: עַיִט指猛禽或食腐鸟，原文为单数而可作集合称谓；汉语“猛禽”本身可统称一类鸟。“山中的”保留הָרִים的山地意象。
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: 和地上的野兽
  rationale: בְּהֵמָה可泛指兽类；在尸体被鸟兽吞食的语境中，“野兽”比泛称“动物”更准确自然。
- source_word: וְקָץ
  choice: 要……度夏
  rationale: קוץ在此指度过夏季；“度夏”简洁地保留季节性意象，并与下文“过冬”形成平行。
- source_word: עָלָיו
  choice: 在它们身上
  rationale: 希伯来语使用阳性单数后缀，可能以单数集合性地指向被弃置之物；汉语正文用复数“它们”衔接句首复数，脚注说明原文形式。
- source_word: תֶּחֱרָף
  choice: 要……过冬
  rationale: חרף在此表示度过冬季。“过冬”是自然现代汉语，并与“度夏”保持原文的季节对偶。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“都……度夏……过冬”保存原文的集合意味和鲜明的季节平行；不具体说明“它们”所指为何，以免消除上下文中仍存在的指代张力。
