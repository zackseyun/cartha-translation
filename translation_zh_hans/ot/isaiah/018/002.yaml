source:
  edition: WLC
  text: הַ/שֹּׁלֵ֨חַ בַּ/יָּ֜ם צִירִ֗ים וּ/בִ/כְלֵי גֹמֶא֮ עַל פְּנֵי מַיִם֒ לְכ֣וּ מַלְאָכִ֣ים קַלִּ֗ים אֶל גּוֹי֙ מְמֻשָּׁ֣ךְ וּ/מוֹרָ֔ט אֶל עַ֥ם נוֹרָ֖א מִן ה֣וּא וָ/הָ֑לְאָה גּ֚וֹי קַו קָ֣ו וּ/מְבוּסָ֔ה אֲשֶׁר בָּזְא֥וּ נְהָרִ֖ים אַרְצֽ/וֹ־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/002.yaml
  text: 'who sends envoys by sea in vessels of papyrus over the waters: “Go, swift messengers, to a nation tall and smooth-skinned[a], to a people feared far and wide, a nation that measures out and tramples down[b], whose land rivers divide[c].”'
translation:
  language: zh_hans
  text: 那地差遣使者渡海，乘纸莎草制的船在水上航行，说：“迅捷的使者啊，你们去吧！到一个身材高大、皮肤光滑的民族那里[a]，到一个远近都令人畏惧的百姓那里，到一个量度又践踏的民族那里[b]，就是江河分割其国土的民族[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“伸展而磨光”；这句话很可能是在描写人的外貌。
    reason: alternative_reading
  - marker: b
    text: 希伯来文为“准绳又准绳和践踏”，也可理解为“量度并践踏的民族”；整个说法含义不明。
    reason: alternative_reading
  - marker: c
    text: 也可译作“江河掠夺其国土”或“江河毁坏其国土”。这个动词通常有掠夺之意；“分割”是根据当地地理所作的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: 那差遣……的说
  rationale: 定冠词加分词承接上一节对古实之地的描述；中文以“那……的”形成关系结构，并由后面的引语自然补出“说”。
- source_word: צִירִים
  choice: 使者
  rationale: 此词可指外交使节；“使者”既保留政治语境，也与下句 מַלְאָכִים 的称呼自然呼应。
- source_word: בַּיָּם
  choice: 渡海
  rationale: 介词短语表示经由水路；“渡海”符合现代汉语行旅表达。
- source_word: וּבִכְלֵי גֹמֶא
  choice: 乘蒲草船
  rationale: גֹמֶא 指纸莎草一类水生植物；此处是以这种材料制成的轻舟。“蒲草船”简洁且易懂。
- source_word: עַל פְּנֵי מַיִם
  choice: 行在水面上
  rationale: 保留“在水面之上”的空间意象，同时以“行”表达船只航行。
- source_word: לְכוּ
  choice: 你们去吧
  rationale: 准确表达复数命令语气，并以“吧”使中文呼语自然。
- source_word: מַלְאָכִים קַלִּים
  choice: 快行的使者
  rationale: קַלִּים 在这里表示行动迅速；“快行的使者”比“轻的使者”更符合语境。
- source_word: גּוֹי מְמֻשָּׁךְ וּמוֹרָט
  choice: 一个身材高大、皮肤光滑的民族
  rationale: 该难解短语很可能描写外貌；正文采用常见的语境性理解，脚注保留较直译的“伸展、磨光”。
- source_word: עַם נוֹרָא מִן הוּא וָהָלְאָה
  choice: 一个远近都令人畏惧的民族
  rationale: 原语范围表达含混；此译自然传达其威名广布，而不限定为空间或时间。
- source_word: גּוֹי קַו קָו וּמְבוּסָה
  choice: 他们丈量并践踏
  rationale: קַו קָו 与量绳、划定相关，但整个称号异常晦涩；正文采用“丈量并践踏”的主要可辩护解释，脚注明确其他可能。
- source_word: אֲשֶׁר בָּזְאוּ נְהָרִים אַרְצוֹ
  choice: 他们的国土被江河分割
  rationale: 按地理语境理解为河流切割国土；因 בָּזְאוּ 通常有掠夺、抢掠义，脚注保留该词义上的不确定性。
