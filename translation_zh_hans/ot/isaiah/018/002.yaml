  terminology: “使者”适合同时对应外交性的 צירים 与命令中的 מלאכים；“纸莎草制的船”比“蒲草船”更准确指向 גמא。对外貌、קַו קַו，以及河流句的歧义均以脚注保留，未作教义性定论。
