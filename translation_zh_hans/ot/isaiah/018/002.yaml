revisions:
- from: 那差遣使者渡海、乘蒲草船行在水面上的说：“快行的使者啊，你们去吧！到一个身材高大、皮肤光滑的民族那里[a]，到一个远近都令人畏惧的民族那里；他们丈量并践踏[b]，他们的国土被江河分割[c]。”
  to: 那地差遣使者渡海，乘纸莎草制的船在水上航行，说：“迅捷的使者啊，你们去吧！到一个身材高大、皮肤光滑的民族那里[a]，到一个远近都令人畏惧的百姓那里，到一个量度又践踏的民族那里[b]，就是江河分割其国土的民族[c]。”
  rationale: 修订补足承接上一节的“那地”，使中文句法完整；以“纸莎草制的船在水上航行”准确且自然地表达水路运输；并恢复原文对目标民族连续使用同位称号的修辞结构。对三个公认难解处保留原有脚注功能，并微调b注的直译，使其更贴近“线／准绳”的词义。
