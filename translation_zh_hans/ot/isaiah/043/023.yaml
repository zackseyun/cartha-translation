source:
  edition: WLC
  text: לֹֽא הֵבֵ֤יאתָ לִּ/י֙ שֵׂ֣ה עֹלֹתֶ֔י/ךָ וּ/זְבָחֶ֖י/ךָ לֹ֣א כִבַּדְתָּ֑/נִי לֹ֤א הֶעֱבַדְתִּ֨י/ךָ֙ בְּ/מִנְחָ֔ה וְ/לֹ֥א הוֹגַעְתִּ֖י/ךָ בִּ/לְבוֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/023.yaml
  text: You have not brought me sheep for your burnt offerings[a], nor have you honored me with your sacrifices. I have not burdened you with grain offerings, nor wearied you with frankincense.
translation:
  language: zh_hans
  text: 你没有把羊带来给我作燔祭，也没有用你的祭物尊崇我。我没有用素祭役使你[a]，也没有用乳香使你疲惫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “役使你”或译“叫你以素祭服事”。希伯来语可表示使人服劳役，语气与下句“使你疲惫”相呼应。
    reason: 说明使役动词的直译及其较强语气，同时保留“服事”的词汇可能性。
lexical_decisions:
- source_word: שֵׂה
  choice: 羊
  rationale: 该词泛指羊群中的一只，可指绵羊或山羊；中文“羊”自然地保留了这种概括性，不限定为羊羔。
- source_word: עֹלֹתֶיךָ
  choice: 燔祭
  rationale: עֹלָה是整只焚烧献上的祭物；“燔祭”是准确且通行的礼仪用语。
- source_word: זְבָחֶיךָ
  choice: 你的祭物
  rationale: זֶבַח指宰杀献上的祭牲或祭物；此处用“祭物”既保留献祭语境，也符合现代中文表达。
- source_word: כִבַּדְתָּנִי
  choice: 尊崇我
  rationale: כבד的加强词干在此表示给予尊荣；“尊崇”比“尊重”更符合对上帝的语境，又不引入“荣耀”可能带出的额外含义。
- source_word: הֶעֱבַדְתִּיךָ
  choice: 役使你
  rationale: עבד的使役形式可指使人服事或服劳役；“役使”保留原文较强的使役色彩，并与下句“使你疲惫”形成平行。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在献祭语境中，该词通常指以谷物为主的供物；“素祭”是简明、准确的传统中文术语。
- source_word: הוֹגַעְתִּיךָ
  choice: 使你疲惫
  rationale: 该使役形式表示使人劳累、疲倦；此译法直接保留其使役意义。
- source_word: לְבוֹנָה
  choice: 乳香
  rationale: 该词特指乳香，而非泛指一切香料或香；采用具体词义可保留礼仪细节。
- source_word: לִי
  choice: 带来给我
  rationale: 介词表示对象或受益者；“带来给我”在中文中自然地明确了献祭所指向的对象。
theological_decisions:
- issue: 上帝关于献祭服事的陈述应如何理解
  choice: 保留“我没有用素祭役使你，也没有用乳香使你疲惫”的直接陈述，不补入“过分”“繁重”等解释性限定
  alternative: 译成“我没有用素祭加重你的负担”，明确理解为上帝没有施加压迫性的礼仪要求
  rationale: 原文以“役使”与“使疲惫”平行，带有负重服役的意味，但并未明说上帝完全不要求祭物，也未直接加入“过度”一类限定。直译其修辞张力，可避免把经文解释为否定献祭制度，或过早限定为只是否定过重要求。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“燔祭”“素祭”“乳香”保留必要的祭祀术语；句式依照原文两组平行否定句，避免添加解释性连接语。
