  terminology: “燔祭”“素祭”“乳香”均为准确、通行且与原文祭祀术语相配的中文用语。“祭物”对较宽泛的זְבָחֶיךָ合宜；“尊崇”也符合对神给予尊荣的语境。脚注准确说明“役使”的较直译读法和“叫你以素祭服事”的可能性，且锚点置于相关词语后。
