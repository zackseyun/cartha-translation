source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה גֹּאַלְ/כֶ֖ם קְד֣וֹשׁ יִשְׂרָאֵ֑ל לְמַעַנְ/כֶ֞ם שִׁלַּ֣חְתִּי בָבֶ֗לָ/ה וְ/הוֹרַדְתִּ֤י בָֽ/רִיחִים֙ כֻּלָּ֔/ם וְ/כַשְׂדִּ֖ים בָּ/אֳנִיּ֥וֹת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/014.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: For your sake I have sent to Babylon and brought them all down as fugitives, even the Chaldeans[b], in the ships of their rejoicing.'
translation:
  language: zh_hans
  text: '雅威如此说——他是你们的救赎主，是以色列的圣者：


    “为了你们，我已差遣往巴比伦[b]，


    使他们全都沦为逃亡者[a]；


    连迦勒底人也在他们欢呼的船只中。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们所有的门闩都落下”；译作“逃亡者”的希伯来词含义难定，也有人将它理解为“门闩”，较少见的解释是“贵族”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我已派人攻打巴比伦。”希伯来文直译为“我已差遣往巴比伦”，差遣的对象没有明说。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通常学术拟音直译为“雅威”，以保留经文所用的专名，而不以称号替代。
- source_word: גֹּאַלְכֶם
  choice: 你们的救赎主
  rationale: 保留 גאל 在以赛亚书中解救、赎回其子民的分量；“救赎主”在现代汉语中庄重且易懂。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 这是以赛亚书反复出现的称号；直译既清楚，也保留其庄严性。
- source_word: לְמַעַנְכֶם
  choice: 为了你们
  rationale: 表达行动是为以色列的益处而采取，符合原文的受益含义，也比“因为你们”更少歧义。
- source_word: שִׁלַּחְתִּי בָבֶלָה
  choice: 我已派人到巴比伦
  rationale: בָבֶלָה 的方向词尾支持“到巴比伦”；原文未明说差遣的对象，汉语为成句而用泛指的“人”，并在脚注保留“攻打巴比伦”的解释。
- source_word: וְהוֹרַדְתִּי
  choice: 使……沦为
  rationale: 原义是“使下去、使降下”；结合“逃亡者”表达使巴比伦人败落受辱的结果，采用自然汉语“使……沦为”，而不额外限定是地理上的下降。
- source_word: בָרִיחִים
  choice: 逃亡者
  rationale: 该词词义有争议；在巴比伦败落及迦勒底人乘船的语境中，与“逃跑”相关的解释较连贯，但脚注保留“门闩”等主要异读。
- source_word: כֻּלָּם
  choice: 他们全都
  rationale: 保留集合性的全称含义，汉语表达自然。
- source_word: וְכַשְׂדִּים
  choice: 连迦勒底人也
  rationale: 将连接词理解为补充并强调迦勒底人也包括在败逃者之中；“连……也”自然呈现这一强调。
- source_word: בָּאֳנִיּוֹת
  choice: 乘上……船只
  rationale: 介词 ב 可表示在船上或借船而行；“乘上”符合逃亡语境，同时不细分“在”与“进入”的空间差别。
- source_word: רִנָּתָם
  choice: 他们引以欢呼的
  rationale: רִנָּה 表示响亮的欢呼；此译保留喜乐欢呼与后来败逃之间的反差，也使“欢呼”与船只的关系在汉语中通顺。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用接近 Yahweh 的汉语拟音“雅威”，保留专名；“耶和华”是影响深远的传统音译，但较不符合现今对该名读音的通常重构。
- issue: 疑难词 בָרִיחִים 的处理
  choice: 逃亡者
  alternative: 门闩；较不可能为“贵族”
  rationale: “逃亡者”最能衔接巴比伦被降卑和迦勒底人乘船的上下文，但原词确有真实的词汇歧义，因此不把其他解释从读者面前隐藏。
- issue: 完成式动作的时间色彩
  choice: 我已派……使……
  alternative: 我将派……使……
  rationale: 希伯来文使用完成式，可能以已经成就的口吻宣告将来的拯救。正文保留完成式的确定语气，不明确化为单纯将来时。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“如此说”保留先知宣告的正式语气；平行分行帮助读者看出诗体结构。正文不强行消除“逃亡者／门闩”的词义争议，也不把完成式完全改写成未来时。
