review_pass:
  verdict: revise
  source_fidelity: 正文将שִׁלַּחְתִּי בָבֶלָה中未明说的受差遣对象补成“人”，缩窄了原文有意保留的空缺，须删除。另“乘上”增添了原文介词ב未明确表达的“登上”动作；宜以“在……船只中”保留其较宽的空间／处境关系。其余主要对应关系准确：雅威、救赎主、以色列的圣者、为你们的缘故、完成式的宣告语气，以及对בָרִיחִים的暂定处理均可成立。
  naturalness: 整体庄重、可朗读，分行也适合先知诗体。将“我已派人到”改为“我已差遣往”虽略带庄重书面色彩，却在此宣告体中自然，并能避免无依据补足宾语。“他们欢呼的船只”保留原文属格关系的简洁与一定含混，较“引以欢呼的船只”少作解释。
  terminology: “雅威”“救赎主”“以色列的圣者”“迦勒底人”均合适且前后一致。“逃亡者”可作为对疑难词בָרִיחִים的暂定译法，但必须保留说明其可译为“门闩”等的脚注。
