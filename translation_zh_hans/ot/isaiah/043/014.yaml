- from: '雅威如此说——他是你们的救赎主，是以色列的圣者：

    “为了你们，我已派人到巴比伦[b]，

    使他们全都沦为逃亡者[a]；

    连迦勒底人也乘上他们引以欢呼的船只。”'
  to: '雅威如此说——他是你们的救赎主，是以色列的圣者：


    “为了你们，我已差遣往巴比伦[b]，


    使他们全都沦为逃亡者[a]；


    连迦勒底人也在他们欢呼的船只中。”'
  rationale: 修订删除正文中无原文依据的“人”，并同步使脚注准确说明宾语未明说；将“乘上”改为“在……中”，避免增添登船动作；略收束对“欢呼”与“船只”关系的解释。脚注锚点a、b均保留在相应疑难处，且脚注集合完整。
  reviewer_model: gpt-5.6-terra
