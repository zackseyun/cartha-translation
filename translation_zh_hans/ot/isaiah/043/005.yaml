source:
  edition: WLC
  text: אַל תִּירָ֖א כִּ֣י אִתְּ/ךָ אָ֑נִי מִ/מִּזְרָח֙ אָבִ֣יא זַרְעֶ֔/ךָ וּ/מִֽ/מַּעֲרָ֖ב אֲקַבְּצֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/005.yaml
  text: Do not fear[a], for I am with you; from the east I will bring your offspring[b], and from the west I will gather you.
translation:
  language: zh_hans
  text: 不要惧怕，因为我与你同在；我必从东方带来你的后裔[a]，从西方召聚你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”在希伯来语中是集合性单数，也可译作“子孙”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“你”是单数形式，指作为一个整体的以色列（雅各）。
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: 不要惧怕
  rationale: 否定词אַל与未完成式动词连用，表达禁止；“不要惧怕”准确、庄重，也符合现代汉语表达。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出不要惧怕的理由；“因为”清楚保留原文的因果关系。
- source_word: אִתְּךָ אָנִי
  choice: 我与你同在
  rationale: 直接表达上帝的临在；采用自然而庄重的汉语语序，并保留“同在”所承载的关系性含义。
- source_word: מִמִּזְרָח
  choice: 从东方
  rationale: 该词虽与日出相关，在这里表示地理方位；“东方”是自然、准确的对应表达。
- source_word: אָבִיא
  choice: 我必……带来
  rationale: בוא的使役式表示使之来到，即“带来”；不擅自加入原动词未明说的“带回来”之意。“必”自然表达先知话语中的未来应许。
- source_word: זַרְעֶךָ
  choice: 你的后裔
  rationale: זֶרַע在此指人的后代，是集合性单数；“后裔”比字面的“种子”自然，又能保持庄重语体。
- source_word: וּמִמַּעֲרָב
  choice: 从西方
  rationale: 与“从东方”构成方位上的平行；“西方”是此处惯用的地理义。
- source_word: אֲקַבְּצֶךָּ
  choice: 召聚你
  rationale: קבץ的加强式表示聚集、召集；“召聚”既保留主动聚集的含义，也适合上帝召聚其子民的语境。宾语仍用单数“你”，对应原文对以色列整体的单数称呼。
theological_decisions:
- issue: 第二人称单数的所指
  choice: 正文保留单数“你”和“你的”，并以脚注说明这是对以色列整体的称呼。
  alternative: 译成“你们”或“你的子民”，直接显明群体所指。
  rationale: 原文以阳性单数称呼雅各／以色列这个群体。保留单数可维持先知话语的修辞形式，脚注则避免现代读者误以为只指一个个人。
- issue: זַרְעֶךָ的集合性含义
  choice: 译为“你的后裔”，并以脚注说明希伯来语形式为集合性单数。
  alternative: 译为“你的子孙”或字面译为“你的种子”。
  rationale: “后裔”能自然表达由一词统称众多后代的含义，又不把集合性单数强行改写成明确复数；“种子”在现代汉语中容易产生误解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。以“东方／西方”保留平行结构，以“我必……带来／召聚”再现应许和聚集的意象；不添加原文未明确表达的“回来”。
