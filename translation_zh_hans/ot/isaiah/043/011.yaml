  text: אָנֹכִ֥י אָנֹכִ֖י יְהוָ֑ה וְ/אֵ֥ין מִ/בַּלְעָדַ֖/י מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/011.yaml
  text: I[a], I am Yahweh, and besides me there is no savior.
translation:
  language: zh_hans
  text: 我，我是雅威；除我以外[a]，没有救主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我之外”。
    reason: 词义替代译法；מִבַּלְעָדַי可译为“除我以外”或“在我之外”。
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי
  choice: 我，我是
  rationale: 保留独立人称代词的重复，以传达希伯来文鲜明的强调语气；这种表达虽庄重有力，现代读者仍能自然理解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，而不以称号代替。
- source_word: וְאֵין
  choice: 没有
  rationale: אֵין表示不存在；“没有”是现代汉语中简洁自然的存在否定。分号已清楚表达上下分句的承接关系，无须机械译出וְ。
- source_word: מִבַּלְעָדַי
  choice: 除我以外
  rationale: 准确表达“在我之外／除了我”的排他意义，并与后面的“没有救主”自然衔接。
- source_word: מוֹשִׁיעַ
  choice: 救主
  rationale: 该词是ישׁע使役词干的分词，在此作名词使用，指施行拯救者；“救主”简明地保留其身份性和神学力度。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的读音重构，并保留其作为专名的性质。
- issue: 拯救者的排他性
  choice: 除我以外，没有救主
  alternative: 在我之外，没有拯救者
  rationale: 原文断然宣告雅威是唯一的拯救者；译文不弱化这一排他主张，也不扩展其范围。
- issue: 重复人称代词的强调
  choice: 我，我是雅威
  alternative: 唯有我才是雅威
  rationale: 保留原文重复，而不把强调进一步解释为“唯有”，从而避免加入原文此处未明说的措辞。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。保留原文开头的重复以呈现强调；用分号体现两项宣告之间紧密而有力的关系。
