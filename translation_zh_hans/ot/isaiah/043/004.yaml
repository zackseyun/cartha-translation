  text: מֵ/אֲשֶׁ֨ר יָקַ֧רְתָּ בְ/עֵינַ֛/י נִכְבַּ֖דְתָּ וַ/אֲנִ֣י אֲהַבְתִּ֑י/ךָ וְ/אֶתֵּ֤ן אָדָם֙ תַּחְתֶּ֔י/ךָ וּ/לְאֻמִּ֖ים תַּ֥חַת נַפְשֶֽׁ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/004.yaml
  text: Because you are precious in my eyes[a], honored, and I love you, I give men in exchange for you[b], and peoples in place of your life.
translation:
  language: zh_hans
  text: 因为你在我眼中宝贵[a]，受尊重，并且我爱你，所以我用人换取你，用万民换取你的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你在我眼中曾为宝贵、受尊重，并且我一直爱你。”希伯来语动词在本语境中可有过去或现在的意味。
    reason: lexical_alternative
  - marker: b
    text: “我用人换取你，用万民换取你的性命”也可译作：“我必用人换取你，必用万民换取你的性命。”希伯来语动词在这个预言语境中可有将来的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֲשֶׁר
  choice: 因为
  rationale: 此处最自然地表示原因，说明耶和华施行拯救的缘由；也可能含“自从”的时间意味。
- source_word: יָקַרְתָּ בְעֵינַי
  choice: 你在我眼中宝贵
  rationale: 保留希伯来语“在我眼中”的评价性意象，并以现在时表达持续的珍视；完成式也可有过去时意味。
- source_word: נִכְבַּדְתָּ
  choice: 受尊重
  rationale: Nifal形态表示被看重、受尊崇；“受尊重”避免把意义抽象化为“荣耀”。
- source_word: וַאֲנִי אֲהַבְתִּיךָ
  choice: 并且我爱你
  rationale: 以自然的现代汉语表达持续有效的爱，同时不否认希伯来语完成式可作过去或完成意义。
- source_word: וְאֶתֵּן
  choice: 所以我用
  rationale: 结合前面的因果分句，以现在性的宣告表达神的行动；该未完成式在预言语境中也可译作将来。
- source_word: אָדָם
  choice: 人
  rationale: 此处是集合意义的人类用语；汉语“人”准确自然，并与下句“万民”形成递进平行。
- source_word: תַּחְתֶּיךָ
  choice: 换取你
  rationale: תחת在这里表示替代或交换，而不是空间上的“在下面”。
- source_word: וּלְאֻמִּים
  choice: 万民
  rationale: 指多个族群或民族；“万民”在庄重汉语中自然地表达复数群体，并保留诗句的递进力度。
- source_word: תַּחַת נַפְשֶׁךָ
  choice: 换取你的性命
  rationale: נפש在此指人的生命，而非与身体分离的“灵魂”；“性命”清楚表达生命被保全的具体含义。
theological_decisions:
- issue: אָדָם的集合性所指
  choice: 人
  alternative: 世人；人类
  rationale: “人”既可作集合名词，也不额外限定性别或把经文扩大为抽象的全人类概念。
- issue: נֶפֶשׁ的含义
  choice: 性命
  alternative: 灵魂；生命；本人
  rationale: 语境所说的是受保护者的生命，不宜引入后期身心二分的含义。
- issue: 交换语言的神学张力
  choice: 直译为“用人换取你，用万民换取你的性命”
  alternative: 为救你而舍弃他人
  rationale: 保留原文鲜明且令人不安的替代性表达，不解释这些人或万民的具体历史身份，也不把它改写成一套赎罪理论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在我眼中”保留原文意象；“宝贵—受尊重—爱”保留三个并列关系词。“用……换取……”再现两行平行结构及替代性的语义张力。
