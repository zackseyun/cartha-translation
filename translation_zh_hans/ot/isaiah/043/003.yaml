id: ISA.43.3
reference: Isaiah 43:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֗י אֲנִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ קְד֥וֹשׁ יִשְׂרָאֵ֖ל מוֹשִׁיעֶ֑/ךָ נָתַ֤תִּי כָפְרְ/ךָ֙ מִצְרַ֔יִם כּ֥וּשׁ וּ/סְבָ֖א תַּחְתֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/003.yaml
  text: For I am Yahweh your God[a], the Holy One of Israel, your Savior; I have given Egypt as your ransom[b], Cush and Seba in exchange for you.
translation:
  language: zh_hans
  text: '因为我是耶和华你的上帝，

    是以色列的圣者，是你的救主；

    我已拿埃及作你的赎价，

    拿古实[a]和西巴代替你[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实”是埃及以南的古代地区，通常与努比亚一带相关，不宜简单等同于现代某一国家。
    reason: cultural_note
  - marker: b
    text: “代替你”也可译作“换取你”或“顶替你”；原文表达替代或交换。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明上帝应许保护、救赎的依据；现代汉语中“因为”清楚自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行译法，保留其专名和盟约语境中的力量。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达名词及第二人称阳性单数后缀，也符合现代标准汉语的称谓习惯。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 保留以赛亚书中这一具有称号性质的固定表达，同时避免将其弱化为一般形容。
- source_word: מוֹשִׁיעֶךָ
  choice: 你的救主
  rationale: 该分词在此名词化，并带第二人称单数后缀；“救主”简洁地保留称号和亲身关系。
- source_word: נָתַתִּי
  choice: 我已拿……作
  rationale: 希伯来语完成式表达已经成就或被确定为成就的行动；“已”保留完成意味，“拿……作”则使后接赎价和交换对象的句式自然。
- source_word: כָפְרְךָ
  choice: 你的赎价
  rationale: 此处指为某人付出的补偿性代价，重点是替代和交换，并非特指礼仪性的赎罪；“赎价”既准确又易懂。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 采用该地名的现代中文标准译名。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 采用传统且能与现代国家名称区分的音译，避免把古代区域直接等同于当代埃塞俄比亚。
- source_word: סְבָא
  choice: 西巴
  rationale: 采用此古地名的通行中文音译，并与“示巴”相区别。
- source_word: תַּחְתֶּיךָ
  choice: 代替你
  rationale: 直接表达该介词结构所含的替代、交换意义；正文措辞清楚，同时脚注保留“换取你”这一可行表达。
theological_decisions:
- issue: 埃及、古实和西巴作为赎价或替代物的含义
  choice: 译文保留上帝以这些国家作为以色列之赎价、代替以色列的强烈交换意象。
  alternative: 也可较宽泛地理解为政治上的补偿或交换。
  rationale: 上下文谈的是上帝对以色列的拯救和保护。译作“赎价”和“代替你”忠实呈现原文，却不把后来的系统神学赎罪理论引入本节。
- issue: נָתַתִּי完成式的时间指向
  choice: 用“已”表达原文完成式，可理解为已经成就，或在先知话语中被确定为必然成就。
  alternative: 可译为不带“已”的“我拿……作”，或按先知性完成式理解为将来的确定行动。
  rationale: 原文单凭动词形式与本节无法完全消除时间层面的张力；译文保留完成意味，不进一步指定历史事件。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并以诗行呈现平行结构。“圣者”“救主”“赎价”保留称号和交换意象；地名使用简体中文圣经传统中的通行形式。
