  text: אַֽל תִּזְכְּר֖וּ רִֽאשֹׁנ֑וֹת וְ/קַדְמֹנִיּ֖וֹת אַל תִּתְבֹּנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/018.yaml
  text: Do not remember the former things[a], and do not consider the things of old.
translation:
  language: zh_hans
  text: 不要记念从前的事，也不要思量古时的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要记念先前的事，也不要思量久远的事。”
    reason: 词义可选译法：רִאשֹׁנוֹת可译“先前的事”，קַדְמֹנִיּוֹת可译“久远的事”。
lexical_decisions:
- source_word: אַל תִּזְכְּרוּ
  choice: 不要追念
  rationale: אַל与未完成式构成禁止语气；זכר表示记念、回想。译作“不要追念”既保留命令的直接性，也比单纯“不要记得”更自然地表达主动回顾之意。
- source_word: רִאשֹׁנוֹת
  choice: 从前的事
  rationale: 该阴性复数形容词在此作名词用，指先前或以往之事；“从前的事”与下一节“新事”形成清楚而自然的对照，同时不限定具体所指。
- source_word: וְ
  choice: 也
  rationale: 连接两个并列的禁止句。汉语用“也不要”比直译为“和不要”更自然，并保留平行结构。
- source_word: קַדְמֹנִיּוֹת
  choice: 古时的事
  rationale: 指古老、久远或先前之事。“古时的事”保留它与רִאשֹׁנוֹת之间近义而不完全相同的诗歌对应。
- source_word: אַל תִּתְבֹּנָנוּ
  choice: 不要思想
  rationale: התבונן在此表示专注思量、仔细考虑；“思想”在庄重而通顺的现代汉语中能表达持续留意和反思，且避免把含义缩窄为单纯理解。
theological_decisions:
- issue: “从前的事／古时的事”的具体所指
  choice: 不在正文中明确限定
  alternative: 明确解释为出埃及等上帝过去的拯救作为
  rationale: 本节本身没有明说这些事具体指什么；上下文可能使读者联想到过去的拯救，但翻译应保留原文的概括性和由语境产生的张力。
translation_notes:
  register: 采用现代、庄重、易懂的书面汉语；两个“不要”保持希伯来诗句的平行禁止结构。“追念／思想”避免过度口语化，同时不把命令误解为要求失去记忆。脚注标记置于整节末尾，涵盖全句的词汇替代译法。
