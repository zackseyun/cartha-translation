source:
  edition: WLC
  text: הִנְ/נִ֨י עֹשֶׂ֤ה חֲדָשָׁה֙ עַתָּ֣ה תִצְמָ֔ח הֲ/ל֖וֹא תֵֽדָע֑וּ/הָ אַ֣ף אָשִׂ֤ים בַּ/מִּדְבָּר֙ דֶּ֔רֶךְ בִּֽ/ישִׁמ֖וֹן נְהָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/019.yaml
  text: Look[a], I am doing a new thing; now it springs up—do you not perceive it? I will even make a way in the wilderness[b], rivers in the wasteland.
translation:
  language: zh_hans
  text: 看哪，我正在做一件新事；如今它正萌发出来，你们岂不知道[a]吗？我要在旷野[b]开道路，在荒漠开江河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “知道”也可译作“察觉”或“认出”。
    reason: lexical_alternative
  - marker: b
    text: “旷野”也可译作“沙漠”。原文用两个相关却不同的词描述荒凉之地，这里分别译作“旷野”和“荒漠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我正在
  rationale: הִנְנִי在此引出上帝郑重而直接的宣告；“看哪”保留提示注意的指示力量，“我正在”同时自然承接后面的分词。
- source_word: עֹשֶׂה חֲדָשָׁה
  choice: 做一件新事
  rationale: עֹשֶׂה是分词，表达正在进行或已临近的行动；חֲדָשָׁה为形容词名词化，译作“一件新事”自然且不限定这行动的具体实现。
- source_word: עַתָּה תִצְמָח
  choice: 如今它正萌发出来
  rationale: “如今”保留即时性；צמח带有植物发芽、生长的鲜明意象，“萌发出来”既保留比喻，也符合现代汉语。
- source_word: הֲלוֹא תֵדָעוּהָ
  choice: 你们岂不知道吗
  rationale: הֲלוֹא引出预期肯定回应的反问；ידע的基本义为“知道、认识”，此处也可指察觉或认出正在发生之事，因此正文保留较宽的“知道”。
- source_word: אַף אָשִׂים
  choice: 我要……开
  rationale: אַף在此加强并推进宣告，可由汉语语势体现，不必机械译出“甚至”；שׂים本义为放置、设立，与道路和江河搭配时译作“开”更自然，并保留创造通路与水源的行动性。
- source_word: בַּמִּדְבָּר דֶּרֶךְ
  choice: 在旷野开道路
  rationale: מִדְבָּר指荒凉、未开垦之地，“旷野”保留其圣经语境及较广泛含义；דֶּרֶךְ译作“道路”，既可具体理解，也不排除主题性含义。
- source_word: בִּישִׁמוֹן נְהָרוֹת
  choice: 在荒漠开江河
  rationale: יְשִׁימוֹן强调荒芜之地，以“荒漠”与前面的“旷野”相区别；נְהָרוֹת是复数，故译为“江河”。
theological_decisions:
- issue: “新事”及旷野道路、荒漠江河意象的救赎含义
  choice: 保留具体而开放的更新与新出埃及式意象，不在正文指定唯一应验。
  alternative: 明确解释为被掳归回、末世更新，或弥赛亚救恩的预表。
  rationale: 希伯来文的意象可首先关联上帝为百姓施行的新拯救，同时容纳更广的神学回响；译文不应把经文本身未明说的单一解释写入正文。
- issue: תֵדָעוּהָ所表达的认知方式
  choice: 正文译作“知道”，脚注说明也可理解为“察觉”或“认出”。
  alternative: 正文直接译作“察觉”或“认出”。
  rationale: “知道”最贴近ידע的广义词汇范围，而语境确实偏向辨认正在萌发的作为；脚注可保存这一语境义而不缩窄原文。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。“看哪”保留先知宣告的郑重感；“正萌发出来”维持原文的生长意象；末句以两个“开”形成自然平行。脚注标记置于本节末，涵盖本节两处需要说明的词汇差异。
