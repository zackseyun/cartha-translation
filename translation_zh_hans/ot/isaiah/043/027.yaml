base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/027.yaml
  text: Your first father sinned[b][a], and your spokesmen rebelled against me.
translation:
  language: zh_hans
  text: 你最早的祖先犯了罪[a]，你的代言人[b]背叛了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你最初的父亲犯了罪。”原文没有说明此处具体指哪一位祖先。
    reason: lexical_alternative
  - marker: b
    text: “代言人”也可译作“传译者”或“中间人”，指代表百姓说话的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיךָ הָרִאשׁוֹן
  choice: 你最早的祖先
  rationale: 直译为“你最初的父亲”在现代汉语中容易被误解为生父；“最早的祖先”自然表达祖先之意，同时不具体认定为亚当、亚伯拉罕或雅各。
- source_word: חָטָא
  choice: 犯了罪
  rationale: 在道德和宗教语境中准确表达“犯罪”，措辞清楚而庄重。
- source_word: מְלִיצֶיךָ
  choice: 你的代言人
  rationale: 该词可指替他人说话的传译者、代表或居间者；“代言人”保留代表发言的核心含义，又不限定为祭司性中保。
- source_word: פָּשְׁעוּ
  choice: 背叛了
  rationale: 该动词具有蓄意违犯、反叛的力度；“背叛”配合“我”作宾语，在汉语中自然体现关系性和对抗性。
- source_word: בִי
  choice: 我
  rationale: 与“背叛”搭配时，希伯来语介词所表达的“针对、反对”可由汉语及物结构“背叛了我”自然承载。
theological_decisions:
- issue: “最早的祖先”的身份
  choice: 不指明具体人物，以“你最早的祖先”表达
  alternative: 亚当、亚伯拉罕、雅各，或较直译的“你最初的父亲”
  rationale: 原文没有点明所指人物；保持泛指可避免把一种解释写入正文，并保留经文的歧义。
- issue: מְלִיצֶיךָ 所指群体的职能
  choice: 代言人
  alternative: 传译者、中间人、使者
  rationale: 上下文未明确限定其为祭司、先知或其他特定职分，因此采用较宽泛的代表性称谓。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“最早的祖先”避免“最初的父亲”可能造成的直系亲属误解；“代言人”与“背叛了我”保持先知控诉的力度，并保留原文对人物身份和职能的开放性。
