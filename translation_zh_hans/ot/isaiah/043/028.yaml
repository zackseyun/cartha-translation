source:
  edition: WLC
  text: וַ/אֲחַלֵּ֖ל שָׂ֣רֵי קֹ֑דֶשׁ וְ/אֶתְּנָ֤ה לַ/חֵ֨רֶם֙ יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל לְ/גִדּוּפִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/028.yaml
  text: So I profaned the princes of the sanctuary[a], and I gave Jacob over to destruction, and Israel to reviling.
translation:
  language: zh_hans
  text: 所以，我使圣所的领袖受到亵渎，把雅各交付毁灭[a]，使以色列遭受辱骂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“交给禁毁”或“定为当毁灭之物”。希伯来语 חֵרֶם 指在上帝审判中被置于禁毁之下、划归毁灭的事物或人。
    reason: 保留 חֵרֶם 的专门宗教法律含义及其经文互文价值。
lexical_decisions:
- source_word: וָאֲחַלֵּל
  choice: 我使……受到亵渎
  rationale: חלל 的皮珥词干在此具有使之成为俗物、亵渎或玷污神圣地位的含义；译作“使……受到亵渎”保留宗教礼仪色彩，也符合上下文中上帝施行审判的结果性语气。
- source_word: שָׂרֵי קֹדֶשׁ
  choice: 圣所的领袖
  rationale: שָׂרֵי 指领袖、首领或官长；与 קֹדֶשׁ 构成的短语更自然地指属于神圣领域或圣所体系的领袖。原文没有明确说“祭司”，因此不作窄化。
- source_word: וְאֶתְּנָה
  choice: 把……交给
  rationale: נתן 基本义为“给”，在审判语境中表示“交出、交付”；“交给”既自然，也体现司法性的移交。
- source_word: לַחֵרֶם
  choice: 交给毁灭
  rationale: חֵרֶם 在此指在神圣审判下被列为当毁灭之物。正文采用现代汉语中清楚而严肃的“交给毁灭”，并在脚注保留“禁毁”这一具有经文互文意义的译法。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用通行专名译法；此处以“雅各”指代整个立约群体。
- source_word: וְיִשְׂרָאֵל
  choice: 以色列
  rationale: 采用通行专名译法，与“雅各”形成诗歌平行，二者都指同一民族。
- source_word: לְגִדּוּפִים
  choice: 遭受辱骂
  rationale: גִּדּוּפִים 指侮辱性的言语、嘲骂或毁谤。汉语“遭受辱骂”自然表达以色列成为公开羞辱对象的含义；不译作“亵渎”，以免误导为专门针对上帝的言语。
theological_decisions:
- issue: חֵרֶם 所表达的神圣审判性质
  choice: 把雅各交给毁灭
  alternative: 把雅各交给禁毁／把雅各定为当毁灭之物
  rationale: 保留原文审判语言的严厉程度，不用较柔和的措辞淡化；同时避免加入后来的教义范畴。“禁毁”的技术性含义在脚注说明。
- issue: שָׂרֵי קֹדֶשׁ 的所指
  choice: 圣所的领袖
  alternative: 圣洁的首领／祭司
  rationale: 原文指向神圣或圣所领域中的领袖，但未明确限定为祭司；因此既不将其泛化为普通首领，也不擅自窄化为祭司。
- issue: וָאֲחַלֵּל 中上帝与神圣领袖地位的关系
  choice: 我使圣所的领袖受到亵渎
  alternative: 我亵渎了圣所的领袖／我使圣所的领袖失去圣职
  rationale: 译文保留上帝在审判中使其神圣地位遭到亵渎的张力，不将其解释成正式撤职，也不回避原文直接将行动归于上帝的表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句式保留“雅各／以色列”的诗歌平行；“领袖”避免古奥，“亵渎”“毁灭”“辱骂”则维持原文审判宣告的严肃语气。脚注标记置于其实际解释的“毁灭”之后。
