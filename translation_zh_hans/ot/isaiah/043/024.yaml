  text: לֹא קָנִ֨יתָ לִּ֤/י בַ/כֶּ֨סֶף֙ קָנֶ֔ה וְ/חֵ֥לֶב זְבָחֶ֖י/ךָ לֹ֣א הִרְוִיתָ֑/נִי אַ֗ךְ הֶעֱבַדְתַּ֨/נִי֙ בְּ/חַטֹּאותֶ֔י/ךָ הוֹגַעְתַּ֖/נִי בַּ/עֲוֺנֹתֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/024.yaml
  text: You did not buy me sweet cane with silver[a], or satisfy me with the fat of your sacrifices; instead, you burdened me with your sins[b]; you wearied me with your iniquities.
translation:
  language: zh_hans
  text: 你没有用银子为我买香菖蒲[a]，也没有用你祭牲的脂肪使我饱足；反倒用你的罪使我劳苦[b]，用你的罪孽使我疲惫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “香菖蒲”也可译作“芳香的芦苇”或“芳香植物”；原文指一种昂贵的芳香植物。
    reason: lexical_alternative
  - marker: b
    text: 原文直译是“你使我服事（或劳作）”，也可表达为“你用你的罪加重我的负担”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתָ לִּי בַכֶּסֶף קָנֶה
  choice: 用银子为我买香菖蒲
  rationale: קנה在此指昂贵的芳香植物，而非普通芦苇；“香菖蒲”符合现代中文圣经语域，并保留其祭祀香料背景。בַכֶּסֶף按支付手段译作“用银子”。
- source_word: חֵלֶב זְבָחֶיךָ
  choice: 你祭物的脂肪
  rationale: חֵלֶב在献祭语境中特指献给上帝的脂肪部分；直译保留具体的祭祀意象。
- source_word: הִרְוִיתָנִי
  choice: 使我饱足
  rationale: רוה的使役式表示使之饱满、饱足；这里保留拟人表达，不抽象化为“尊崇我”。
- source_word: אַךְ
  choice: 反倒
  rationale: 此处引出尖锐反差：百姓没有献上当献之物，反而以罪恶加重上帝的负担。
- source_word: הֶעֱבַדְתַּנִי
  choice: 使我……服苦役
  rationale: עבד的使役式直指“使服事、使劳作”；译作“服苦役”保留原文惊人的角色倒置，比单译“使我负担沉重”更贴近词形。
- source_word: בְּחַטֹּאותֶיךָ
  choice: 因你的罪
  rationale: 介词ב可表达手段或原因；中文用“因”自然地表达罪使上帝服苦役这一关系。
- source_word: הוֹגַעְתַּנִי
  choice: 使我……疲惫
  rationale: יגע的使役式意为使疲倦；“疲惫”保留先知话语中的拟人张力。
- source_word: בַּעֲוֺנֹתֶיךָ
  choice: 因你的罪孽
  rationale: עָוֹן可指罪孽或罪责；“罪孽”保留其道德和盟约分量，并与前句的חטאות“罪”有所区分。
theological_decisions:
- issue: 上帝因祭物而“饱足”、又被人的罪驱使并疲惫的拟人语言
  choice: 保留“使我饱足”“使我服苦役”“使我疲惫”等具体拟人表达
  alternative: 抽象化为“没有尊崇我，却以罪冒犯我”
  rationale: 原文刻意以强烈拟人和角色倒置责备以色列；保留这种张力，避免按某种神学体系削弱经文本身的表达。
- issue: הֶעֱבַדְתַּנִי的解释力度
  choice: 正文采用较直译的“使我服苦役”，并以脚注说明也可理解为使上帝负担沉重
  alternative: 正文直接译作“使我负担沉重”
  rationale: 使役词形的字面意义是“使服事/劳作”，应优先保留；但语境含有“加重负担”的惯用效果，故在脚注中呈现。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来文前后鲜明的对照和平行结构；“香菖蒲”略具经文语域，因此用脚注解释；“服苦役”刻意保留原文强烈而反常的拟人表达。
