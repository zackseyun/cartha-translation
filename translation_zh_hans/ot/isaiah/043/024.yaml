review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了四个并列的控诉及其拟人化张力。但“使我因你的罪而服苦役”将בְּ（以、用）较明确地转成原因性“因”，且“服苦役”在现代汉语中容易暗示被奴役或刑罚；原文核心是“使我劳作／服事”，并由罪作为手段或负担。宜在正文以“用……使我劳苦”自然表达，并在注释保留字面意义。
  naturalness: “你祭物的脂肪”略显生硬，改为“你祭牲的脂肪”更符合祭祀语境和现代中文搭配。“用你的罪使我劳苦，用你的罪孽使我疲惫”保持平行，也比“因……而服苦役”自然。
  terminology: “香菖蒲”可作为קָנֶה的暂定译名，并以脚注呈现“芳香的芦苇／芳香植物”的词义范围；不应把该植物的精确鉴定说得过满。“脂肪”“罪”“罪孽”及“饱足”均能保留原文祭祀与道德语义。
  issues:
  - severity: medium
    issue: “使我因你的罪而服苦役”对הֶעֱבַדְתַּנִי及其前置词的表达不够稳妥。
    rationale: 原文直义为“你使我服事／劳作，藉着（用）你的罪”；“因……服苦役”既弱化了手段意义，也使中文读者容易理解为上帝因罪受奴役或刑役。改为“用你的罪使我劳苦”，并以脚注交代字面“使我服事／劳作”，可兼顾忠实和自然。
  - severity: low
    issue: “你祭物的脂肪”搭配略不自然。
    rationale: זְבָחֶיךָ指祭牲／祭物；中文“你祭牲的脂肪”更具体、顺畅，且不改变含义。
