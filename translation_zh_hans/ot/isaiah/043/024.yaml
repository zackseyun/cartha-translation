  to: 你没有用银子为我买香菖蒲[a]，也没有用你祭牲的脂肪使我饱足；反倒用你的罪使我劳苦[b]，用你的罪孽使我疲惫。
  rationale: 修订将“服苦役”改为“劳苦”，使汉语自然且避免额外引入刑役或奴役的含义；同时以“用你的罪”对应原文介词所标示的手段，并在脚注保留该动词“使服事／劳作”的反常拟人力度。将“祭物”调整为“祭牲”改善中文搭配，其他关键祭祀、罪恶及拟人表达均予保留。
