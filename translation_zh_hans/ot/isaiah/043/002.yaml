base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/002.yaml
  text: When you pass through the waters[a], I am with you; and through the rivers, they will not sweep over you. When you walk through fire, you will not be scorched[b], and the flame will not burn you.
translation:
  language: zh_hans
  text: 你从水中经过时，我与你同在；你从江河中经过时，江河不会淹没你[a]。你从火中行走时，必不被灼伤[b]，火焰也不会烧着你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“江河不会漫过你”或“不会把你冲走”。希伯来语动词可指洪水漫过、冲走或淹没。
    reason: lexical_alternative
  - marker: b
    text: 或译：“必不被烧伤”。这里的希伯来语与下一句所用的动词不同；下一句更直接地说火焰不会烧着你。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ……时
  rationale: 此处引出时间情境；译作“……时”符合两个平行分句，也不把应许弱化为假设。
- source_word: תַעֲבֹר בַּמַּיִם
  choice: 从水中经过
  rationale: 保留 עבר 的经过、穿越之意以及复数“水”的诗歌意象，同时采用自然的现代汉语表达。
- source_word: אִתְּךָ אָנִי
  choice: 我与你同在
  rationale: 准确传达上帝亲自同在的保证；汉语语序自然，并保留原文的强调意味。
- source_word: וּבַנְּהָרוֹת
  choice: 渡过江河
  rationale: “江河”对应复数 נְהָרוֹת；“渡过”承接前句的移动意象，符合汉语习惯。
- source_word: לֹא יִשְׁטְפוּךָ
  choice: 河水不会淹没你
  rationale: שטף 可指洪水漫过、冲走或压倒；“淹没”保留具体的洪水图景，又能自然表达危险无法吞没受话者。
- source_word: תֵלֵךְ בְּמוֹ אֵשׁ
  choice: 从火中行走
  rationale: 较贴近 הלך 的“行走”，并与前半节“从水中经过”形成诗歌平行。
- source_word: לֹא תִכָּוֶה
  choice: 必不被灼伤
  rationale: כוה 的被动形式表示被烧灼或烧伤；“灼伤”与下一句更直接的“烧着”有所区分。
- source_word: וְלֶהָבָה לֹא תִבְעַר בָּךְ
  choice: 火焰也不会烧着你
  rationale: 以自然汉语表达火焰不能在受话者身上燃烧或造成焚烧，保留原文的具体意象。
theological_decisions:
- issue: 水与火之应许的性质
  choice: 保留具体的水、江河、火与火焰意象，表达上帝在严重危险中同在并保护的应许。
  alternative: 将这些意象限定为属灵试炼，或解释为信徒绝不会遭受任何肉体伤害的绝对应许。
  rationale: 原文以具体而富诗意的危险场景宣告上帝的同在与保守，却未在本节内说明这些意象仅属比喻，也未系统界定应许适用的方式；译文因此不替原文消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同在”保留圣经语体的庄重感；“经过—渡过—行走”呈现原文的平行推进，“灼伤—烧着”则保留两个不同希伯来语动词的区别。
