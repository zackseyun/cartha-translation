base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/016.yaml
  text: 'Thus says Yahweh[a], who makes a way in the sea and a path in the mighty waters:'
translation:
  language: zh_hans
  text: 雅威如此说：他在海中开道路，在强盛的水中[a]辟路径：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在海中”和“在强盛的水中”也可译作“穿过海”和“穿过强盛的水”。希伯来语介词的字面义是“在……中”，但在此语境中也可表达从水中穿过。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知信息中常见的宣告公式；“如此说”简洁庄重，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现上帝的专名，而不以“主”这一称号替代。
- source_word: הַנּוֹתֵן
  choice: 他……开……辟……
  rationale: 该分词描述雅威是开设道路的那一位。因汉语不宜在两个并列宾语前机械重复同一动词，分别采用“开道路”和“辟路径”，自然地表达“设置、开出”之意。
- source_word: בַּיָּם
  choice: 在海中
  rationale: 保留介词 בְּ 的基本空间意义“在……中”，同时让出埃及过海的意象保持含蓄，不在正文中直接限定为“穿过”。
- source_word: דָּרֶךְ
  choice: 道路
  rationale: “道路”既可指实际通路，也保留可能的比喻意味，适合这里的诗歌语境。
- source_word: וּבְמַיִם עַזִּים
  choice: 在浩荡的大水中
  rationale: “浩荡”表达 עַזִּים 的强盛有力，“大水”则是现代汉语中庄重而自然的集合性说法；避免译成“汹涌”而额外指定水势状态。
- source_word: נְתִיבָה
  choice: 路径
  rationale: 与“道路”形成近义平行，同时保留原文两个不同名词的诗歌层次。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文用“雅威”音译其专名，避免以称号“主”取代；“耶和华”虽是传统译名，但所反映的是后期混合读音。
- issue: 海水与道路的关系
  choice: 在海中……在浩荡的大水中
  alternative: 穿过海……穿过浩荡的大水
  rationale: 希伯来介词 בְּ 的字面义是“在……中”，语境也可让人理解为从水中穿过。正文保留较直接的空间表达，脚注说明动态理解，以免过早消除原文的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“如此说”保留先知宣告的郑重语气；破折号引出对说话者的描述，句末冒号表明宣告内容在下一节继续。诗行中的“道路／路径”与“海中／大水中”维持原文平行结构。
