id: ISA.43.10
reference: Isaiah 43:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַתֶּ֤ם עֵדַ/י֙ נְאֻם יְהוָ֔ה וְ/עַבְדִּ֖/י אֲשֶׁ֣ר בָּחָ֑רְתִּי לְמַ֣עַן תֵּ֠דְעוּ וְ/תַאֲמִ֨ינוּ לִ֤/י וְ/תָבִ֨ינוּ֙ כִּֽי אֲנִ֣י ה֔וּא לְ/פָנַ/י֙ לֹא נ֣וֹצַר אֵ֔ל וְ/אַחֲרַ֖/י לֹ֥א יִהְיֶֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/010.yaml
  text: You are my witnesses[a], declares Yahweh, and my servant whom I have chosen, so that you may know and believe in me and understand that I am he. Before me no god was formed[c][b], and after me there will be none.
translation:
  language: zh_hans
  text: 耶和华宣告：“你们是我的见证人，也是我所拣选的仆人，为要使你们认识我、信靠我，并且明白：我就是那一位。[a]在我以前，没有神被造；在我以后，也必没有。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我是他”；这是以赛亚书中简洁的神圣自我认定，也可译作“我就是那一位”。
    reason: 说明希伯来语惯用表达及其中文处理。
  - marker: b
    text: 原文末句省略了主语，直译为“在我以后也必没有”；按上文，所指的是“神”。
    reason: 说明原文的省略结构，避免将补足内容误认为明文。
lexical_decisions:
- source_word: עֵדַי
  choice: 我的见证人
  rationale: 复数名词带第一人称单数后缀，指以色列群体中的众见证人；现代汉语用“见证人”自然且准确。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: 保留庄严的先知宣告公式，并按项目惯例音译神名 יהוה。
- source_word: וְעַבְדִּי אֲשֶׁר בָּחָרְתִּי
  choice: 也是我所拣选的仆人
  rationale: “仆人”为单数，按原文保留；在本段中自然与作为群体的以色列同位，但译文不排除该称谓本身的张力。
- source_word: לְמַעַן
  choice: 为要使
  rationale: 清楚表达目的关系，并顺应后接三个并列动词的汉语句法。
- source_word: תֵּדְעוּ
  choice: 认识我
  rationale: 宾语可由上下文中的 לִי 统摄；此处涉及对耶和华的关系性认知，“认识我”比单独的“知道”更自然。
- source_word: וְתַאֲמִינוּ לִי
  choice: 信靠我
  rationale: Hiphil אמן 加 ל 可表达相信、信任某人；“信靠我”保留关系性的信任含义，又不局限为仅相信某句话。
- source_word: וְתָבִינוּ
  choice: 并且明白
  rationale: 保留“认识—信靠—明白”的三项递进结构。
- source_word: כִּי אֲנִי הוּא
  choice: 我就是那一位
  rationale: 汉语若直译“我是他”容易造成错误指代；“我就是那一位”保留简短而庄严的自我认定，并用脚注注明原文形式。
- source_word: לֹא נוֹצַר אֵל
  choice: 没有神被造
  rationale: 保留 יצר 的被动形式和 אֵל 的普通名词用法，不改写为较强解释性的“没有别神存在”。
- source_word: וְאַחֲרַי לֹא יִהְיֶה
  choice: 在我以后，也必没有
  rationale: 原文省略主语；正文保留这种简练表达，所省略的是前句的“神”，并以脚注说明。
theological_decisions:
- issue: “我的仆人”的所指
  choice: 保留单数“仆人”，让上下文自然指向作为整体的以色列
  alternative: 明确译作“我的仆人以色列”或理解为个别仆人形象
  rationale: 本节以复数“你们”称呼见证人，同时用单数“仆人”描述蒙拣选者；直译其数的差异，避免把正文没有明说的身份补入。
- issue: אֲנִי הוּא 的神学分量
  choice: 译作“我就是那一位”并注出直译
  alternative: “我是他”或“我是”
  rationale: “我是他”在现代汉语中会引发第三人称误解；单译“我是”则可能过度引入别处的神学联想。“我就是那一位”较好地保存以赛亚书中的神圣自我认定。
- issue: “没有神被造”的表述
  choice: 保留原文对“神被造”的否定命题
  alternative: 意译为“在我以前没有别神，在我以后也不会有”
  rationale: 原文使用“塑造、形成”的被动式，可能有意呼应偶像被制造的语境；保留该措辞可维持其论辩锋芒和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“耶和华宣告”保持先知话语的肃穆感；全句尽量保留原文并列和递进结构，同时借助标点提升可读性。
