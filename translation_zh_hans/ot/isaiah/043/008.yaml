  text: הוֹצִ֥יא עַם עִוֵּ֖ר וְ/עֵינַ֣יִם יֵ֑שׁ וְ/חֵרְשִׁ֖ים וְ/אָזְנַ֥יִם לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/008.yaml
  text: Bring out a blind people[a], though they have eyes, and the deaf, though they have ears.
translation:
  language: zh_hans
  text: 领出瞎眼却有眼睛的民，以及耳聋却有耳朵的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领出”也可译作“带出来”。原文的语序较直译为：“领出瞎眼的民，他们有眼睛；以及耳聋的人，他们有耳朵。”
    reason: 说明 הוֹצִיא 的词义选择，并保留原文两个并列对象及其反讽性的补充说明。
lexical_decisions:
- source_word: הוֹצִיא
  choice: 领出来
  rationale: 该词是 יצא 的使役式祈使语气，命令听者使人出来。“领出来”既保留命令含义，也适合人群被召集出来作见证的语境；“带出来”亦可。
- source_word: עַם
  choice: 民
  rationale: עַם 指作为整体的一群人。这里的“民”简洁庄重，并避免“民族”可能带来的现代政治或族裔色彩。
- source_word: עִוֵּר
  choice: 瞎
  rationale: 原词直指失明，也可在先知语境中隐喻无知觉。“瞎”保留直接的感官用语及其反讽张力，不在正文中明说为属灵意义。
- source_word: וְעֵינַיִם יֵשׁ
  choice: 有眼却瞎
  rationale: 希伯来文直译近于“并且有眼睛”，但上下文形成让步反差。汉语调整语序为“有眼却瞎”，自然表达其反讽，同时保留“有眼”这一具体意象。
- source_word: וְחֵרְשִׁים
  choice: 有耳却聋
  rationale: חֵרְשִׁים 是复数形容词作名词性用法，意为“聋的人”。结合平行结构译为“有耳却聋”，在汉语中与前半句整齐对应。
- source_word: וְאָזְנַיִם לָמוֹ
  choice: 有耳
  rationale: 该短语直译近于“耳朵属于他们”，即“他们有耳朵”。译作“有耳”，简洁保留身体意象，并与“有眼”平行。
theological_decisions:
- issue: 瞎与聋的性质
  choice: 保留字面的感官词语，让上下文暗示其属灵或认知层面的迟钝
  alternative: 在正文中明确译作“心灵瞎眼、属灵耳聋”
  rationale: 希伯来文使用普通的“瞎”和“聋”，虽在以赛亚书语境中可有比喻意义，却没有在本节明确加入“属灵”等限定。保留原有表述可避免把解释写入正文。
- issue: “民”是否特指某一群体
  choice: 不加“那”或身份说明
  alternative: 译作“那瞎眼的民”或明确为以色列
  rationale: 原文 עַם 没有冠词，也未在本节名词短语内明说身份。正文保持不定和开放，由上下文辨明所指。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“有眼却瞎、有耳却聋”以对称结构传达希伯来文的平行和反讽；“民”保持经文语体，但普通读者仍易理解。
