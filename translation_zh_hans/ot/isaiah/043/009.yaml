  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּֽל הַ/גּוֹיִ֞ם נִקְבְּצ֣וּ יַחְדָּ֗ו וְ/יֵאָֽסְפוּ֙ לְאֻמִּ֔ים מִ֤י בָ/הֶם֙ יַגִּ֣יד זֹ֔את וְ/רִֽאשֹׁנ֖וֹת יַשְׁמִיעֻ֑/נוּ יִתְּנ֤וּ עֵֽדֵי/הֶם֙ וְ/יִצְדָּ֔קוּ וְ/יִשְׁמְע֖וּ וְ/יֹאמְר֥וּ אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/009.yaml
  text: Let all the nations be gathered together[a], and let the peoples be assembled. Who among them can declare this and make the former things heard? Let them present their witnesses, that they may be justified; and let them hear and say[b], “It is true.”
translation:
  language: zh_hans
  text: 万国都当一同聚集，众民都当集合。他们中间谁能宣告这事，并把先前的事[a]说给我们听？让他们带来自己的证人，好使他们被判为有理[b]；让他们听了便说：“这是真的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“最初的事”。在《以赛亚书》中，这个说法常可指先前发生的作为或先前作出的宣告，用来显明耶和华掌管历史。
    reason: lexical_alternative
  - marker: b
    text: 或译“好证明他们有理”。原文在这里带有法庭裁断的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  choice: 万国
  rationale: גּוֹיִם在这里指世界各国；“万国”简洁自然，也符合先知书召集列国受审的语境。
- source_word: נִקְבְּצוּ יַחְדָּו
  choice: 都要聚集
  rationale: 体现קבץ的尼法勒式聚集含义；“都”兼顾כָּל与יַחְדָּו所表达的整体性，避免汉语中“聚集在一起”的轻微重复。
- source_word: וְיֵאָסְפוּ לְאֻמִּים
  choice: 众民都要集合
  rationale: 以“众民”对应לְאֻמִּים，与前句“万国”形成有变化的平行；“集合”表达אסף尼法勒式的聚拢。
- source_word: מִי בָהֶם יַגִּיד זֹאת
  choice: 他们中间谁能宣告这事
  rationale: “谁能”自然表达法庭挑战的反问语气；“宣告”保留נגד使役式公开陈说的意味。
- source_word: וְרִאשֹׁנוֹת יַשְׁמִיעֻנוּ
  choice: 并把先前的事说给我们听
  rationale: “先前的事”保留רִאשֹׁנוֹת可能指早先事件或预先宣告的开放性；“说给我们听”自然体现יַשְׁמִיעֻנוּ的使役意义及第一人称复数宾语“我们”。
- source_word: יִתְּנוּ עֵדֵיהֶם
  choice: 让他们带来自己的证人
  rationale: 在法庭场景中，נתן与“证人”连用宜自然译为“带来”；“自己的”明确表达附属代词。
- source_word: וְיִצְדָּקוּ
  choice: 好使他们被判为有理
  rationale: 保留צדק在法庭语境中的裁断和证实含义，同时避免以可能带有后期教义术语色彩的“称义”来过度限定。
- source_word: וְיִשְׁמְעוּ וְיֹאמְרוּ אֱמֶת
  choice: 让他们听了便说：“这是真的。”
  rationale: 保留希伯来文复数主语指代上的一定开放性；把אֱמֶת译成自然的判断句“这是真的”。
theological_decisions:
- issue: 列国受审的法庭意象
  choice: 采用“证人”和“被判为有理”等司法措辞
  alternative: 译作“得称为义”或仅作“证明他们正确”
  rationale: 本节是举证和裁断的场景；“被判为有理”既显出司法意味，也不把后来的系统神学术语强加于此。
- issue: “先前的事”的所指
  choice: 正文保留概括性的“先前的事”
  alternative: 明确译成“从前发生的事”或“最初的事”
  rationale: רִאשֹׁנוֹת可涉及早先的作为，也可涉及先前的宣告；正文不替读者消除这种语义张力。
- issue: 末句“他们”的指代
  choice: 继续使用“他们”，不明确改成“证人”或“列国”
  alternative: 译作“让证人听了便说”
  rationale: 希伯来文只使用复数动词，指代可能承接列国一方，也可能在语境中涉及其证人；保留代词可避免无依据地缩窄所指。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以“万国／众民”保持希伯来诗句的平行变化。保留法庭场景、第一人称复数“我们”以及末句代词的开放性；不用“外邦人”“称义”等容易引入额外宗派或教义联想的措辞。
