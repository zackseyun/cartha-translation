  yaml_path: translation/ot/isaiah/043/015.yaml
  text: I am Yahweh[a], your Holy One, the Creator of Israel, your King.
translation:
  language: zh_hans
  text: 我就是雅威[a]，你们的圣者，以色列的创造者，你们的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为神名 יהוה（YHWH）；本译音译为“雅威”（Yahweh）。中文传统译作“耶和华”。
    reason: 说明原文四字神名、本译音译及传统中文译名。
lexical_decisions:
- source_word: אֲנִי
  choice: 我就是
  rationale: 独立人称代词带有强调和自我宣告的意味；“我就是”在现代汉语中自然地呈现无系词名词句的认定语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中广为人知的神名译写；脚注说明原文使用四字神名，并保留“雅威”这一可选音译。
- source_word: קְדוֹשְׁכֶם
  choice: 你们的圣者
  rationale: 保留第二人称复数所属关系及该词作为上帝称号的作用；“圣者”庄重而易懂。
- source_word: בּוֹרֵא יִשְׂרָאֵל
  choice: 以色列的创造者
  rationale: 分词在此具有特征性、称号性的力量；“创造者”比单纯过去时“创造了……的”更能保留这一点。
- source_word: מַלְכְּכֶם
  choice: 你们的王
  rationale: 准确保留第二人称复数后缀，并与“你们的圣者”形成平行结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 正文作“耶和华”，脚注注明“雅威”及原文四字神名
  alternative: 正文直接作“雅威”
  rationale: 原文明确使用神的专名，不宜以“主”等称号替代。中文传统译名“耶和华”最易为普通读者识别；脚注同时透明呈现更接近学界通行重构的“雅威”，不掩盖原文证据。
- issue: “圣者”“创造者”“王”是否作为专名式称号处理
  choice: 保留称号性的名词表达，但按现代汉语常规不另作英文式大小写标示
  alternative: 改写为描述性分句，如“使你们成圣的”或“创造了以色列的”
  rationale: 希伯来文以同位结构连续说明耶和华的身份；名词式译法保留其平行、庄重和神学张力，不增添原文没有的解释。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“我就是”突出原文开头独立代词的自我宣告力量；全句保留四个同位成分的紧凑平行结构。
