  text: כֹּ֚ל הַ/נִּקְרָ֣א בִ/שְׁמִ֔/י וְ/לִ/כְבוֹדִ֖/י בְּרָאתִ֑י/ו יְצַרְתִּ֖י/ו אַף עֲשִׂיתִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/007.yaml
  text: everyone who is called by my name[a], whom I created for my glory, whom I formed, indeed whom I made.
translation:
  language: zh_hans
  text: 凡奉我名被召的人，都是我为自己的荣耀创造的；我塑造了他们，确实作成了他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּל
  choice: 凡……的人
  rationale: 上下文指上帝从各方招聚的百姓（5—6节）。用“凡……的人”自然表达集合性的“所有人”，同时与后面的单数宾语后缀相协调。
- source_word: הַנִּקְרָא בִשְׁמִי
  choice: 称为我名下
  rationale: 此处 נִקְרָא בְשֵׁם 表示以某人的名来称呼，从而表明归属或身份。“称为我名下”既保留被动含义，也用现代汉语清楚表达属于上帝之意。
- source_word: וְלִכְבוֹדִי
  choice: 为自己的荣耀
  rationale: כָּבוֹד 在此指上帝的荣耀、尊荣及其彰显。“为自己的荣耀”自然地表达创造的目的。
- source_word: בְּרָאתִיו
  choice: 我……所创造的
  rationale: 保留 ברא 的“创造”含义，并以关系结构承接前面的集合性人物指称。
- source_word: יְצַרְתִּיו
  choice: 我塑造
  rationale: יצר 带有塑形、塑造的意味；“塑造”保留它与“创造”和“造作”之间的词义区别。
- source_word: אַף
  choice: 也
  rationale: אַף 在这里加强最后一个动作。“也”在“是……、也是……”结构中自然体现递进和强调；脚注保留更强的“确实”译法。
- source_word: עֲשִׂיתִיו
  choice: 我造作
  rationale: עשה 是广义的“做、制造”。“造作”在庄重经文语体中可与“创造”“塑造”并列，又不混同前两个动词。
theological_decisions:
- issue: 集合性先行词与阳性单数宾语后缀
  choice: 用“凡……的人”统摄后文，并以“所创造的／塑造／造作”承接，不另加男性代词。
  alternative: 较形式化地译为“凡称为我名下的；我为自己的荣耀创造了他，我塑造了他，确实造作了他”。
  rationale: 希伯来文以集合性的 כֹּל 加分词开头，随后三个动词都带第三人称阳性单数后缀。中文无需以“他”限定性别，省去代词仍可准确保留集合中每一个人的代表性单数关系。
- issue: “为我的荣耀”与“创造”的句法关系
  choice: 译作“我为自己的荣耀所创造的”，明确表达目的关系。
  alternative: 保留较松散的语序：“凡称为我名下的，并且为了我的荣耀，我创造了他……”
  rationale: 原文 וְלִכְבוֹדִי 紧接 בְּרָאתִיו 之前，最自然地表达上帝为自己的荣耀而创造这些人；此译法未超出原文，同时符合现代汉语。
- issue: 三个创造动词的关系
  choice: 保留“创造—塑造—造作”三个不同动词，并以“也是”体现最后一项的强调。
  alternative: 合并为单一的“创造”，或把 אַף 译为较强的“确实”。
  rationale: 原文依次使用 ברא、יצר、עשה，不宜抹平其修辞累积；但三者在这里并非必须被解释为三个可严格区分的创造阶段。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“称为我名下”表达命名与归属；“造作”略带经文语体色彩，用来保留 עשה 与“创造”“塑造”的区别。主文以自然中文重组句法，脚注提供更贴近希伯来语形式的译法。
