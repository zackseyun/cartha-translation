base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/013.yaml
  text: Indeed[a], from that day on I am he, and there is none who can deliver from my hand; I act[b], and who can turn it back?
translation:
  language: zh_hans
  text: 的确，从那日以来[a]，我就是那一位；无人能从我手中救出。我行事，谁能使它回转[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从今日起”“自古以来”，或较具解释性地译作“从永恒以来”。希伯来语原句很简练，可表达不止一种时间含义。
    reason: alternative_reading
  - marker: b
    text: 也可译作“谁能扭转它呢？”“它”指上帝所行的事；希伯来语字面意思是“使它返回”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 的确
  rationale: 此处主要加强断言的语气，并非单纯表示“也”；“的确”自然地传达强调作用。
- source_word: מִיּוֹם
  choice: 从那日以来
  rationale: 原文极其简练，字面为“从日”；正文采用表示从某一时间点延续至今的译法，同时以脚注保留“从今日起”“自古以来”等可能理解。
- source_word: אֲנִי הוּא
  choice: 我就是那一位
  rationale: 保留以赛亚书中庄重的自我宣告形式；相较于单译“我是”，此译既符合现代汉语，也不把后来的神学解释直接写入正文。
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: 无人能从我手中救出
  rationale: “手”象征权能与掌管，予以保留；分词 מַצִּיל 在此表达施行解救者，汉语补出“能”可自然呈现无人有此能力。
- source_word: אֶפְעַל
  choice: 我行事
  rationale: פעל 表示做、施行或行动；“行事”兼顾广义和庄重语体，突出上帝决定性的作为。
- source_word: יְשִׁיבֶנָּה
  choice: 使它回转
  rationale: 使役形态表达“使之返回、扭转”；保留原文具体的回转意象，并以“它”对应阴性宾语后缀，所指可理解为上帝所行之事。
theological_decisions:
- issue: מִיּוֹם 的时间范围
  choice: 从那日以来
  alternative: 从今日起；自古以来；从永恒以来
  rationale: 原文没有明确限定是哪一日，短语可有不止一种时间理解。正文不直接采用较强的“从永恒以来”，脚注则明确保留其歧义和相关解释空间。
- issue: אֲנִי הוּא 的自我宣告
  choice: 我就是那一位
  alternative: 我是；我就是
  rationale: 此公式在以赛亚书中具有重要神学分量。译文保留独特身份宣告的庄重感，却不将经文未明说的后期教义表述加入其中。
- issue: יְשִׁיבֶנָּה 所指为何
  choice: 以“它”指向上帝所行之事
  alternative: 省略宾语，译作“谁能扭转呢”
  rationale: 原文有阴性宾语后缀，但其先行对象是隐含的，可理解为所行的事或行动结果。正文保留代词，脚注说明其意义，避免过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我就是那一位”“从我手中救出”保留原文的身份宣告和手的权能隐喻；标点呈现三个紧密相连的断言与末尾反问。
