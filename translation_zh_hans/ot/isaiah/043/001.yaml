revisions:
- from: 但现在，雅各啊，创造你的雅威如此说；以色列啊，塑造你的那一位说：“不要惧怕，因为我已经救赎了你；我按你的名呼唤了你[a]；你是属我的。”
  to: 但现在，雅威——雅各啊，创造你的；以色列啊，塑造你的——如此说：“不要惧怕，因为我已经救赎了你；我按你的名呼唤了你[a]；你是属我的。”
  rationale: 修正了原文唯一说话者及两个分词同位修饰之间的句法关系，避免凭空增加“说”。以破折号承载汉语中较难直译的插入式称呼与同位结构，保留雅各／以色列的呼语功能、创造／塑造的平行，以及随后第一人称神谕的连贯性。
