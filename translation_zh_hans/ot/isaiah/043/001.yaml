id: ISA.43.1
reference: Isaiah 43:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֞ה כֹּֽה אָמַ֤ר יְהוָה֙ בֹּרַאֲ/ךָ֣ יַעֲקֹ֔ב וְ/יֹצֶרְ/ךָ֖ יִשְׂרָאֵ֑ל אַל תִּירָא֙ כִּ֣י גְאַלְתִּ֔י/ךָ קָרָ֥אתִי בְ/שִׁמְ/ךָ֖ לִ/י אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/001.yaml
  text: 'But now[a], thus says Yahweh, he who created you, Jacob, and he who formed you, Israel: Do not fear, for I have redeemed you; I have called you by name; you are mine.'
translation:
  language: zh_hans
  text: 但现在，雅威——雅各啊，创造你的；以色列啊，塑造你的——如此说：“不要惧怕，因为我已经救赎了你；我按你的名呼唤了你[a]；你是属我的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我指名召唤了你。”
    reason: “呼唤”所译的קרא在此也可表达带有目的性的召唤；“按你的名”也可自然表达为“指名”。
lexical_decisions:
- source_word: וְעַתָּה כֹּה אָמַר
  choice: 但现在……如此说
  rationale: “但现在”体现上下文中的转折，“如此说”保留先知宣告公式的庄重语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用上帝自启之名的音译，不以称号替代专名。
- source_word: בֹּרַאֲךָ
  choice: 创造你的
  rationale: 保留ברא所表达的创造行动，并以关系从句自然修饰“雅威”。
- source_word: וְיֹצֶרְךָ
  choice: 塑造你的
  rationale: “塑造”保留יצר所含的成形、陶塑意象，也与“创造”形成有区别的平行。
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: 雅各……以色列
  rationale: 按专名音译，并用“啊”明确其呼语功能；两个名字共同指向圣约群体。
- source_word: אַל תִּירָא
  choice: 不要惧怕
  rationale: 简洁地保留否定命令的直接性与庄重语气。
- source_word: גְאַלְתִּיךָ
  choice: 我已经救赎了你
  rationale: “救赎”保留גאל兼具亲属责任、解救和归属的圣约含义，而不限定具体方式。
- source_word: קָרָאתִי בְשִׁמְךָ
  choice: 我按你的名呼唤了你
  rationale: 既保留“你的名”这一所有格，也自然表达亲自、特定地呼唤；原文可兼有召唤之意。
- source_word: לִי אָתָּה
  choice: 你是属我的
  rationale: 以简洁的判断句保留原文所表达的归属和圣约主张。
theological_decisions:
- issue: גאל的圣约与救赎含义
  choice: 救赎
  alternative: 赎回；解救
  rationale: “救赎”能同时承载上帝施行拯救及宣告归属的意味，又不把原文限缩为支付赎价等单一机制。
- issue: לִי אָתָּה所表达的归属
  choice: 你是属我的
  alternative: 你属于我
  rationale: 所选译法保留原文简短有力的圣约宣告，也不额外解释拣选、保护等由语境引出的含义。
- issue: “雅各／以色列”的指向
  choice: 保留为两个呼语专名
  alternative: 解释为以色列民族
  rationale: 不把名字直接释义化，使其既保有族长名称，也保有对圣约群体的集体称呼所形成的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号呈现“雅各／以色列”和“创造／塑造”的平行结构；直接引语保持简洁有力。脚注标记置于实际涉及词义差异的短语之后。
