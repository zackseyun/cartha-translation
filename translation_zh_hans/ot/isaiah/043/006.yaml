base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/006.yaml
  text: I will say to the north[a], ‘Give them up,’ and to the south, ‘Do not hold them back.’ Bring my sons from far away[b], and my daughters from the end of the earth.
translation:
  language: zh_hans
  text: 我必对北方说：“交出来！”对南方说：“不要扣留！”把我的众子从远方带来，把我的众女儿从地极带来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹמַר
  choice: 我要……说
  rationale: 未完成式第一人称单数在这一预言宣告中自然表示将来的行动。
- source_word: לַצָּפוֹן
  choice: 对北方
  rationale: 保留方位名词及其拟人化受话者角色。
- source_word: תֵּנִי
  choice: 交出来
  rationale: 阴性单数命令式呼应拟人化的“北方”；希伯来文宾语省略，中文也可自然省略，由上下文指向分散各处的子民。
- source_word: וּלְתֵימָן
  choice: 对南方
  rationale: 与“北方”平行，此处指方位或南方地区，而非以东地名提幔。
- source_word: אַל תִּכְלָאִי
  choice: 不要扣留
  rationale: 表达禁止扣住、不放行之意；宾语仍由上下文补足，不明说以保存原文的省略。
- source_word: הָבִיאִי
  choice: 带来
  rationale: 使役词干阴性单数命令式，继续向拟人化地区发令。
- source_word: בָנַי
  choice: 我的儿子们
  rationale: 保留阳性复数的具体表达，并与下句“女儿们”形成明确对应。
- source_word: מֵרָחוֹק
  choice: 从远方
  rationale: 简洁自然地表达距离遥远的来源。
- source_word: וּבְנוֹתַי
  choice: 我的女儿们
  rationale: 保留阴性复数及与“儿子们”的平行结构。
- source_word: מִקְצֵה הָאָרֶץ
  choice: 从地极
  rationale: 原文“地的尽头”是单数；“地极”是现代中文庄重而自然的对应，也不必强行显明单复数。
theological_decisions:
- issue: 向北方和南方所发命令的所指
  choice: 把北方和南方作为拟人化的地区，命令它们释放并带回上帝分散的子民。
  alternative: 把它们理解为没有具体被掳归回背景的纯粹宇宙力量。
  rationale: 上下文论及以色列的复兴和招聚；阴性单数命令式与拟人化方位相合，“我的儿子们”和“我的女儿们”则明确了被招聚者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“交出来”和“不要扣留”保留直接命令的力度；两处不补出宾语，以保存希伯来文真实的省略。
