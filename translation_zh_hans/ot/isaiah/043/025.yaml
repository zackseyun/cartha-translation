  text: אָנֹכִ֨י אָנֹכִ֥י ה֛וּא מֹחֶ֥ה פְשָׁעֶ֖י/ךָ לְמַעֲנִ֑/י וְ/חַטֹּאתֶ֖י/ךָ לֹ֥א אֶזְכֹּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/025.yaml
  text: I[a], I am he who blots out your transgressions for my own sake[c][b], and your sins I will not remember.
translation:
  language: zh_hans
  text: 我，惟有我，为我自己的缘故涂抹你的过犯；我必不记念你的罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不记念”在这里指不再把这些罪作为追究你的依据。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי הוּא
  choice: 我，我就是那位
  rationale: 保留两个第一人称代词的重复，以传达强调；“就是那位”自然表达 הוּא 在此处加强自我宣告的作用。
- source_word: מֹחֶה
  choice: 涂抹
  rationale: 保留擦除、抹去记录的意象；在中文圣经语体中庄重而明确，又不把隐喻解释得过满。
- source_word: פְשָׁעֶיךָ
  choice: 你的过犯
  rationale: פשע 可指反叛或越界之罪；“过犯”既保留其道德与盟约上的严重性，也与下文“罪”有所区别。
- source_word: לְמַעֲנִי
  choice: 为我自己的缘故
  rationale: 明确保留行动以神自身为根据和目的的反身强调，不加入经文未说明的人方条件。
- source_word: וְחַטֹּאתֶיךָ
  choice: 你的罪
  rationale: 采用现代中文最自然、准确的通用表达，并保留它与“过犯”这一相关但不完全相同的词语并列。
- source_word: לֹא אֶזְכֹּר
  choice: 我必不记念
  rationale: 直接呈现希伯来语未完成体在语境中的决意和将来意味；“记念”保留圣经语境中把某事置于关注之下并据此行动的含义。
theological_decisions:
- issue: 赦免行动的根据
  choice: “为我自己的缘故”表明神涂抹过犯是基于他自身的缘故、旨意与信实。
  alternative: 将赦免主要归因于罪人的悔改、功德或配得。
  rationale: 原文明确使用 לְמַעֲנִי；译文应保留这种以神自身为根据的表达，不添加本节没有陈述的条件。
- issue: “不记念”是否指神失去认知
  choice: 保留“不记念”，并以脚注说明其语境意义是神不再据这些罪追究他的子民。
  alternative: 理解为神在认知或记忆能力上忘记了这些罪。
  rationale: 圣经中的“记念”常含有关注并据此行动的关系性、司法性意义；脚注可防止误解，同时不替正文消除原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我，我”刻意保留原文的强调性重复；“涂抹”“过犯”“记念”略带圣经语体，但在上下文中清楚自然。脚注标记置于所解释分句之后。
