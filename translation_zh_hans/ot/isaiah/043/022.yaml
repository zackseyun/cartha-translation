id: ISA.43.22
reference: Isaiah 43:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹא אֹתִ֥/י קָרָ֖אתָ יַֽעֲקֹ֑ב כִּֽי יָגַ֥עְתָּ בִּ֖/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/022.yaml
  text: Yet you have not called on me[a], Jacob, because you have grown weary of me[b], Israel.
translation:
  language: zh_hans
  text: 然而你没有呼求我[a]，雅各啊；因为你厌倦了我[b]，以色列啊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“呼叫我”。希伯来语动词本义是“呼叫”，在祷告或敬拜的语境中常有“呼求”的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因我而疲倦”。希伯来语介词容许这一相近译法，但按上下文，“厌倦了我”更自然。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: 然而……没有
  rationale: 连接词在此承接上文并形成反差；“然而”以自然的现代汉语保留责备语气。
- source_word: אֹתִי קָרָאתָ
  choice: 呼求我
  rationale: קרא 基本义为“呼叫”，以神为对象时常指祷告或敬拜中的求告；“呼求我”既明确语境含义，也保留“呼叫我”的可能性于脚注。
- source_word: יַעֲקֹב
  choice: 雅各啊
  rationale: 专名在此作呼语，指向立约群体；加“啊”清楚表达呼格而不改变指称。
- source_word: כִּי
  choice: 因为
  rationale: 此处自然地引出前述控诉的原因；“因为”是现代汉语中最清楚的对应。
- source_word: יָגַעְתָּ בִּי
  choice: 你厌倦了我
  rationale: יגע 表示疲倦、困乏，与介词 בּ 连用时可表达对某人感到厌倦；此译符合上下文，同时在脚注保留“因我而疲倦”的近似可能。
- source_word: יִשְׂרָאֵל
  choice: 以色列啊
  rationale: 与“雅各”平行，同作呼语，强化对同一立约群体的直接责备。
theological_decisions:
- issue: 以色列对神之失责的含义
  choice: 以色列没有呼求神，并且对神感到厌倦。
  alternative: 以色列因与神相关的事而疲倦；或本句仅说他们没有“呼叫”神。
  rationale: 句法上，以色列是两个动词的主语；译文保留直接的立约责备，不进一步断定他们厌倦的是神本身、敬拜活动，还是与神有关的责任。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“雅各啊”“以色列啊”明确保留原文两个平行呼语；分号呈现控诉与原因之间的结构。
