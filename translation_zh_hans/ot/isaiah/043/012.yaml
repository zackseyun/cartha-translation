  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָנֹכִ֞י הִגַּ֤דְתִּי וְ/הוֹשַׁ֨עְתִּי֙ וְ/הִשְׁמַ֔עְתִּי וְ/אֵ֥ין בָּ/כֶ֖ם זָ֑ר וְ/אַתֶּ֥ם עֵדַ֛/י נְאֻם יְהוָ֖ה וַֽ/אֲנִי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/012.yaml
  text: I myself declared and saved and announced[a], and there was no foreign god among you; and you are my witnesses, declares Yahweh, and I am God.
translation:
  language: zh_hans
  text: 是我亲自宣告、拯救，又使你们听见；你们中间没有外神[a]。你们是我的见证人——这是雅威的宣告——而我是上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们中间没有外人。”希伯来语 זָר 可指“外来的、陌生的对象”；在这里很可能是指外邦的神。
    reason: 保留 זָר 的词汇歧义，同时说明正文依上下文采用“外神”的理由。
lexical_decisions:
- source_word: אָנֹכִי
  choice: 是我亲自
  rationale: 独立人称代词带有强调意味；“是我亲自”自然地保留重音，又不额外加入“唯独”的排他含义。
- source_word: הִגַּדְתִּי
  choice: 宣告
  rationale: נגד 的使役式常指宣告、使人知道；“宣告”符合本段庄严且带有见证意味的语境。
- source_word: וְהוֹשַׁעְתִּי
  choice: 拯救
  rationale: ישׁע 的使役式意为拯救或搭救；“拯救”简明，并保留神施行救恩的含义。
- source_word: וְהִשְׁמַעְתִּי
  choice: 又使你们听见
  rationale: שׁמע 的使役式直译为“使人听见”；如此既保留原文形式，也避免与前面的“宣告”完全重复。宾语“你们”由上下文补明。
- source_word: וְאֵין בָכֶם זָר
  choice: 你们中间并没有外神
  rationale: זָר 本义可指外来的、陌生的对象；在本段关于雅威宣告、拯救及以色列作证的论辩中，最可能指外邦神明。正文采用“外神”，脚注保留“外人”的词义可能。
- source_word: עֵדַי
  choice: 我的见证人
  rationale: 该词为“见证人”加第一人称单数词尾，直指受话者是雅威的见证人。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: נְאֻם 是先知话语中庄严的宣告公式；“宣告说”符合现代汉语习惯，יְהוָה 按项目规范译为“雅威”。
- source_word: וַאֲנִי אֵל
  choice: 我就是上帝
  rationale: אֵל 在此作普通称号“上帝”，而非音译为专名；“就是”承接前文强调，但没有增添原文此分句未明说的“唯一”。
theological_decisions:
- issue: וְאֵין בָכֶם זָר 中 זָר 的所指
  choice: 正文译作“外神”，脚注保留“外人”的可能
  alternative: 你们中间并没有外人／陌生人
  rationale: 上下文聚焦雅威独自宣告、施救，并要求以色列为此作证，因此神明意义更切合论辩脉络；然而 זָר 本身并未明写“神”，故以脚注保存词汇歧义。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；“雅威”以常见学术音译保留其作为盟约神名的性质。
- issue: וַאֲנִי אֵל 的排他力度
  choice: 我就是上帝
  alternative: 唯独我是上帝
  rationale: 本节和上下文具有排他性的神学力量，但此分句本身没有“唯独”一词；不在译文中额外补入，以保留原文表达的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“是我亲自”保留开头的强调；三个动词按原文次序排列。“又使你们听见”略偏形式对应，以呈现使役式，并与“宣告”有所区别。破折号标出先知宣告公式的插入语性质。
