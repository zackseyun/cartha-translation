  to: 这百姓，是我为自己所塑造的[a]；他们要传扬对我的赞美。
  rationale: 修订仅改善现代汉语的流畅度与脚注的词义准确性。“所塑造的”较自然地承接前置的“这百姓”；“传扬”适合先知书庄重语体，并表达ספר在此讲述、宣告赞美的含义。保留分号与“要”，不把原文隐含的目的或结果关系明确化为单一解释。
