  text: עַם זוּ֙ יָצַ֣רְתִּי לִ֔/י תְּהִלָּתִ֖/י יְסַפֵּֽרוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/021.yaml
  text: This people I formed for myself[a]; they will declare my praise.
translation:
  language: zh_hans
  text: 这百姓，是我为自己所塑造的[a]；他们要传扬对我的赞美。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塑造”也可译作“形成”或“造作”。
    reason: 说明יצר的词汇替代译法，不改变“为自己”对לי的直接表达。
lexical_decisions:
- source_word: עַם
  choice: 百姓
  rationale: 这里指一个群体；“百姓”自然贴合先知书语体，也不带现代民族国家的含义。
- source_word: זוּ
  choice: 这
  rationale: 保留指示词的近指意味，承接上下文所说的群体。
- source_word: יָצַרְתִּי
  choice: 我……塑造的
  rationale: יצר含有有意塑形、造就的意味；“塑造”比宽泛的“创造”更能传达这一形象。
- source_word: לִי
  choice: 为自己
  rationale: 表达归属和目的，同时保持希伯来语介词短语可能兼具的两层意味。
- source_word: תְּהִלָּתִי
  choice: 对我的赞美
  rationale: 中文若直译“我的赞美”容易理解为“我所发出的赞美”；“对我的赞美”明确表示赞美以神为对象。
- source_word: יְסַפֵּרוּ
  choice: 述说
  rationale: ספר的加强词干在此可指讲述、宣扬；“述说”既保留讲述意味，又符合庄重的先知文体。
theological_decisions:
- issue: 后半句与前半句的目的或结果关系
  choice: 以分号连接，并译作“他们要述说对我的赞美”
  alternative: 译作“为要使他们述说对我的赞美”或“好叫他们述说对我的赞美”
  rationale: 希伯来文本没有明示目的连词。采用分号和未完成式语气，保留前后之间隐含的目的或结果关系，不把其中一种解释写死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这百姓”保留原文强调性的前置结构；“述说对我的赞美”避免“述说我的赞美”在现代汉语中的歧义。
