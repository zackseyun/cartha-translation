id: ISA.43.17
reference: Isaiah 43:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/מּוֹצִ֥יא רֶֽכֶב וָ/ס֖וּס חַ֣יִל וְ/עִזּ֑וּז יַחְדָּ֤ו יִשְׁכְּבוּ֙ בַּל יָק֔וּמוּ דָּעֲכ֖וּ כַּ/פִּשְׁתָּ֥ה כָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/017.yaml
  text: who brings out chariot and horse[a], army and mighty one together; they lie down, they do not rise; they are extinguished, quenched like flax.
translation:
  language: zh_hans
  text: 那使战车、战马、军队和强者一同出动的；他们倒卧，不再起来；他们熄灭了，像麻一样灭了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像亚麻制的灯芯一样”；希伯来文直译为“像麻一样”，在这里的熄灭意象中，可能使人联想到亚麻制的灯芯。
    reason: 说明“麻”的可能具体意象，同时保留正文的字面表达，不把该意象断定为原文唯一含义。
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: 那使……出动的
  rationale: 这是使役词干分词，承接上文对耶和华的描述。“使……出动”既保留使役意义，也适合战车、战马和军队的军事语境；汉语不明标时态，可保留历史回顾与生动描述之间的张力。
- source_word: רֶכֶב וָסוּס
  choice: 战车、战马
  rationale: 两个名词均可作集合性单数；汉语以“战车、战马”自然表达整体类别，并显明军事语境。
- source_word: חַיִל
  choice: 军队
  rationale: 此词在这里指军事力量；“军队”是现代汉语中清楚、自然的对应。
- source_word: וְעִזּוּז
  choice: 和强者
  rationale: 该词可指强有力者。“强者”贴近原文，又不额外加入原文没有明说的“战士”。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 直接表达这些军事力量共同出动、共同覆灭。
- source_word: יִשְׁכְּבוּ
  choice: 他们倒卧
  rationale: 保留“躺卧”的基本意象，同时“倒卧”在汉语中能自然表现战败后倒地不起。
- source_word: בַּל יָקוּמוּ
  choice: 不再起来
  rationale: 表达强烈否定，并与“倒卧”构成自然对应，呈现彻底的失败。
- source_word: דָּעֲכוּ
  choice: 他们熄灭了
  rationale: 该动词常用于火焰熄灭；“熄灭”保留随后的火焰比喻。
- source_word: כַּפִּשְׁתָּה
  choice: 像麻一样
  rationale: 按原文字面译作“麻”，不在正文中补入解释性的“灯芯”；相关可能意象收入脚注。
- source_word: כָבוּ
  choice: 被扑灭
  rationale: 与前面的“熄灭”保留原文两个近义动词的诗性复沓；被动表达也自然呈现火被扑灭的图像。
theological_decisions:
- issue: 耶和华行动及敌军败亡的时间与体貌
  choice: 采用汉语不明确标示时态的生动叙述：“使……出动……他们倒卧”
  alternative: 全句明确译成过去时的历史回顾，专指过红海事件
  rationale: 原文的分词及动词序列既强烈唤起出埃及事件，又具有鲜明的描述性。现代汉语无需强制标明过去或现在，因此可保留这种张力。
- issue: 败亡军队的具体身份
  choice: 只译出战车、战马、军队和强者
  alternative: 在正文中明确补作“埃及人”或“法老的军队”
  rationale: 上下文确实暗指出埃及过红海，但本节没有直接说出埃及或法老；不补明身份，可保留原文的含蓄指涉。
- issue: עִזּוּז是泛指强者还是特指勇猛战士
  choice: 译为“强者”
  alternative: 译为“勇士”或“勇猛战士”
  rationale: 军事上下文支持“勇士”的理解，但原词本身强调强大有力。“强者”既切合语境，又避免把未明说的角色具体化。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。句式保留原文的诗性并列与骤然转折；“熄灭了……被扑灭”有意保留希伯来文近义复沓。脚注标记置于其实际说明的“麻”之后，而非置于“战马”之后。
