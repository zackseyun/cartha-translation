  text: הַזְכִּירֵ֕/נִי נִשָּׁפְטָ֖ה יָ֑חַד סַפֵּ֥ר אַתָּ֖ה לְמַ֥עַן תִּצְדָּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/026.yaml
  text: Remind me[a]; let us argue the case together. State your case[b], so that you may be proved right.
translation:
  language: zh_hans
  text: 你提醒我吧[a]；让我们一同来辩论。你陈述吧，好使你显为有理[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你使我想起吧。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“好使你被证明为有理”；也可译为“好使你得以称义”或“得到辩白”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְכִּירֵנִי
  choice: 你提醒我吧
  rationale: 使役式命令语气，直译为“使我想起／提醒我”。加“吧”自然传达带挑战意味的命令，又不改变其法庭语境。
- source_word: נִשָּׁפְטָה
  choice: 让我们辩明
  rationale: 该词在本段具有司法、争讼色彩，表达双方共同进入申辩或评断。“辩明”比单纯“审判”更能传达相互陈明案情的意味，同时保留谁最终被判定的开放性。
- source_word: יָחַד
  choice: 一同
  rationale: 直接表达双方共同参与这场争辩。
- source_word: סַפֵּר אַתָּה
  choice: 你陈明吧
  rationale: ספר的加强词干命令式可指述说、陈明；独立代词אַתָּה带强调。将“你”置于动词前，既保留强调，也符合现代汉语表达。上下文已确立法庭场景，因此不必额外补出“案情”。
- source_word: לְמַעַן
  choice: 好使
  rationale: 保留目的或预期结果的关系，语气庄重而自然。
- source_word: תִּצְדָּק
  choice: 你能证明自己有理
  rationale: צדק在此为司法语境中的“显为正当／有理”。该译法避免把它限定为后期教义术语，同时传达经申辩而被证实有理的意思。
theological_decisions:
- issue: צדק的司法含义
  choice: 证明自己有理
  alternative: 被判为义；得以昭雪
  rationale: 经文呈现上帝发出的法庭式挑战，重点是对方能否陈明理由而显为有理。译作“被判为义”可能使普通读者首先联想到特定的系统神学用语；“证明自己有理”保留司法判断，同时不预断其更广泛的神学含义。
- issue: נִשָּׁפְטָה的语态与参与关系
  choice: 让我们一同辩明
  alternative: 让我们一同受审；让我们一同进入审判
  rationale: 希伯来语形式可产生“共同进入审判／争讼”的张力。正文采用自然的司法争辩表达，脚注保留较形式对应的可能译法，避免将其简单处理成双方都被第三方审判。
translation_notes:
  register: 采用现代、庄重而易懂的法庭语体。“提醒我—一同辩明—陈明—有理”维持原文连续的争讼修辞；用“你陈明吧”体现独立代词的强调，又避免不自然的重复。所有脚注标记均已置于正文。
