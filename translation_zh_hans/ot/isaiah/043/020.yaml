  text: תְּכַבְּדֵ֨/נִי֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה תַּנִּ֖ים וּ/בְנ֣וֹת יַֽעֲנָ֑ה כִּֽי נָתַ֨תִּי בַ/מִּדְבָּ֜ר מַ֗יִם נְהָרוֹת֙ בִּֽ/ישִׁימֹ֔ן לְ/הַשְׁק֖וֹת עַמִּ֥/י בְחִירִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/020.yaml
  text: The beasts of the field will honor me[a], jackals and ostriches, because I give water in the wilderness, rivers in the wasteland, to give drink to my people[c][b], my chosen ones.
translation:
  language: zh_hans
  text: '野地的走兽，就是豺狼[a]和鸵鸟[b]，要尊崇我；


    因为我在旷野赐下水，

    在荒地赐下江河，

    好使我的子民、我所拣选的[c]得喝。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “豺狼”一词在较古老的译本传统中有时译作“龙”；在这里的旷野动物语境中，更可能指豺狼。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“鸵鸟之女”，是指鸵鸟的惯用说法；较古老的译本有时译作“猫头鹰”。
    reason: lexical_alternative
  - marker: c
    text: 原文为单数“我所拣选的”，很可能以单数集合性地指以色列。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַבְּדֵנִי
  choice: 要尊崇我
  rationale: כבד 的 Piel 形式表示尊敬、尊荣；“尊崇”既保留对上帝的敬重意味，也符合现代中文诗体表达。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 野地的走兽
  rationale: 该结构指野生动物；“野地的走兽”保留原文意象与庄重语体。
- source_word: תַּנִּים
  choice: 豺狼
  rationale: 在旷野动物的语境中，此词最可能指豺狼，而非神话性的龙或泛称的蛇。
- source_word: בְנוֹת יַעֲנָה
  choice: 鸵鸟
  rationale: 字面为“鸵鸟之女”，是指鸵鸟的惯用说法；中文直接译为“鸵鸟”最自然。
- source_word: נָתַתִּי
  choice: 赐下
  rationale: 希伯来语完成式在此可表达先知性语境中上帝行动的确定性；中文不强加“已经”或“将要”，保留其时体张力。
- source_word: בַמִּדְבָּר מַיִם
  choice: 在旷野赐下水
  rationale: “旷野”保留 מִדְבָּר 的圣经意象，并自然呈现荒芜之地得到供应的对比。
- source_word: נְהָרוֹת בִּישִׁימוֹן
  choice: 在荒地赐下江河
  rationale: “荒地”表现 יְשִׁימוֹן 的荒凉，“江河”保留复数及水源丰沛的强化意象。
- source_word: לְהַשְׁקוֹת
  choice: 好给……喝
  rationale: 目的不定式表示使人得水喝；这一表达具体、自然，并保留原文目的关系。
- source_word: עַמִּי בְחִירִי
  choice: 我的子民……就是我所拣选的
  rationale: “我的子民”保留盟约性称谓；后半采用中文不标数的关系结构，既与群体称谓相连，又不擅自消除希伯来语单数形式的张力。
theological_decisions:
- issue: בְחִירִי 的单数形式与 עַמִּי 的群体指称并置
  choice: 译作“我的子民……就是我所拣选的”，并以脚注说明原文单数
  alternative: “我的选民”或“我所拣选的那一位”
  rationale: “我的选民”会完全抹平原文单数，而“那一位”又容易被误解为另一个单独人物。正文采用中文数目不显明的结构，保留其集合性与个体化表达之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文，以分行保留希伯来诗歌的并行结构。“赐下”不另加完成或将来标记，以免过度限定先知性完成式；“就是我所拣选的”刻意保留原文群体名词与单数称谓之间的张力。
