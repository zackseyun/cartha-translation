  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָפַ֤ל אַשּׁוּר֙ בְּ/חֶ֣רֶב לֹא אִ֔ישׁ וְ/חֶ֥רֶב לֹֽא אָדָ֖ם תֹּֽאכֲלֶ֑/נּוּ וְ/נָ֥ס ל/וֹ֙ מִ/פְּנֵי חֶ֔רֶב וּ/בַחוּרָ֖י/ו לָ/מַ֥ס יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/008.yaml
  text: And Assyria will fall by a sword not of man[a], and a sword not of humankind will devour him; and he will flee from before the sword[d][c][b], and his young men will become forced labor.
translation:
  language: zh_hans
  text: 亚述必倒在不出于人的刀下；不出于世人的刀必吞灭他[a]。他必逃避刀剑[b]，他的壮丁必服苦役[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”和“世人”分别对应两个近义的希伯来词。原文也可较直译为：“不是人的刀……不是人类的刀”；重点是这刀并非出于人的力量，至于审判的具体方式，原文没有说明。
    reason: lexical_alternative
  - marker: b
    text: “他”承接作为集体单数的“亚述”，也可理解为亚述的统治者或军队。
    reason: referent_clarification
  - marker: c
    text: “壮丁”也可译作“年轻人”或“精壮之士”；“服苦役”也可译作“服贡役”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָפַל
  choice: 必倒下
  rationale: 在预言语境中，此处完成式带有指向将来的确定意味；“必”既表达未来，也保留宣告的坚定语气。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 此专名在这里统称亚述国家及其势力，采用现代中文通行译名。
- source_word: בְּחֶרֶב לֹא אִישׁ
  choice: 在不出于人的刀下
  rationale: בְּ 表示手段；“不出于人的”保留刀剑并非来自人类力量的含义，又避免把具体施行方式限定为某种超自然事件。
- source_word: וְחֶרֶב לֹא אָדָם
  choice: 不出于世人的刀
  rationale: 用“人／世人”对应 אִישׁ／אָדָם 的平行变化，在自然中文中尽量保留原文的词汇差别。
- source_word: תֹּאכֲלֶנּוּ
  choice: 必吞灭他
  rationale: 原义为“吃、吞吃”，以刀剑作主语时是毁灭的强烈比喻；“吞灭”兼顾形象与现代中文可读性。
- source_word: וְנָס לוֹ מִפְּנֵי חֶרֶב
  choice: 他必逃避刀剑
  rationale: 将集体单数“亚述”继续作为主语；“逃避刀剑”自然表达 מִפְּנֵי חֶרֶב 的意思，不额外指定逃亡方式。
- source_word: בַחוּרָיו
  choice: 他的壮丁
  rationale: בָּחוּר 指正值盛年的青年，在此军事语境中“壮丁”较“年轻人”更贴合，同时没有直接增译为“战士”。
- source_word: לָמַס יִהְיוּ
  choice: 必服苦役
  rationale: מַס 可指征用的劳役或贡役；“服苦役”清楚传达战败后被强制服役的结果。
theological_decisions:
- issue: 击败亚述之刀的性质
  choice: 译作“不出于人的刀……不出于世人的刀”
  alternative: 明确译成天使、瘟疫或上帝亲自挥动的刀
  rationale: 希伯来文两次否定人的来源或力量，却没有说明耶和华施行审判的确切方式；译文保留这种开放性，不把它限定为某一种神迹机制。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“必”呈现预言的确定语气；保留刀剑“吞灭”的诗性拟人，并用“人／世人”的变化反映原文平行结构。
