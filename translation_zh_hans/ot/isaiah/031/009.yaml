source:
  edition: WLC
  text: וְ/סַלְע/וֹ֙ מִ/מָּג֣וֹר יַֽעֲב֔וֹר וְ/חַתּ֥וּ מִ/נֵּ֖ס שָׂרָ֑י/ו נְאֻם יְהוָ֗ה אֲשֶׁר א֥וּר ל/וֹ֙ בְּ/צִיּ֔וֹן וְ/תַנּ֥וּר ל֖/וֹ בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/009.yaml
  text: His rock will pass away because of terror[a], and his princes will be terrified at the signal, declares Yahweh[c][b], whose fire is in Zion and whose furnace is in Jerusalem.
translation:
  language: zh_hans
  text: 他的磐石必因惊恐而消逝[a]；他的首领必因旗号而惊慌[b]。这是雅威的宣告：他在锡安有火，在耶路撒冷有炉[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的堡垒必在惊恐中消失。”原文“磐石”可能比喻亚述的避难所、坚固保障或统治者。
    reason: lexical_alternative
  - marker: b
    text: “旗号”也可译作“旌旗”或“军旗”；原文既可指旗帜，也可指用来传递号令的标志。
    reason: alternative_reading
  - marker: c
    text: 雅威在锡安的“火”和在耶路撒冷的“炉”，很可能表现他施行审判的临在；原文没有把这意象进一步限定为祭坛、熔炉或某一特定事件。
    reason: cultural_note
lexical_decisions:
- source_word: וְסַלְעוֹ
  choice: 他的磐石
  rationale: סֶלַע本义为岩石、磐石；上下文中可能比喻亚述的坚固保障、堡垒或统治者。正文保留原文意象，不在译文中把比喻限定为某一种解释。
- source_word: מִמָּגוֹר
  choice: 因惊恐
  rationale: 介词מִן在这里可表达原因或来源；“因惊恐”自然地传达其可能的因果意义，同时脚注保留“在惊恐中”的理解。
- source_word: יַעֲבוֹר
  choice: 消逝
  rationale: עבר基本义为经过、越过；在本句审判和溃败的语境中，表示不复存在或被除去，“消逝”既通顺，也未过度具体化。
- source_word: וְחַתּוּ
  choice: 必……惊慌
  rationale: חתת在Qal中可指惊惶、丧胆，也可带有被击垮的意味；以人为主语时，“惊慌”符合上下文。
- source_word: מִנֵּס
  choice: 因旗号
  rationale: נֵס可指旗帜、旌旗、旗杆或用来发出号令的标志。“旗号”在现代汉语中可保留军情信号与旗帜两方面的含义。
- source_word: שָׂרָיו
  choice: 他的首领
  rationale: שַׂר可指王公、官长或军事将领。“首领”保持较宽泛的所指，不强行限定为王室贵族或军官。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是先知话语中常见的权威宣告格式；将יהוה音译为“雅威”，保留经文中的神圣名字。
- source_word: אֲשֶׁר אוּר לוֹ בְצִיּוֹן
  choice: 他在锡安有火
  rationale: אוּר在此与“炉”平行，宜译为“火”而非“光”；לֹו直译式表达为“有”，保留原文朴素而有力的意象。
- source_word: וְתַנּוּר לוֹ בִּירוּשָׁלִָם
  choice: 在耶路撒冷有炉
  rationale: תַּנּוּר可指烤炉或熔炉。正文用较中性的“炉”，避免擅自限定为祭坛之火或冶炼炉，并让“火—炉”的平行意象保持开放。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，也与所提供审定层的处理一致。
- issue: “磐石”所指为何
  choice: 正文保留“磐石”的比喻
  alternative: 堡垒；保障；亚述王
  rationale: 上下文容许把“磐石”理解为亚述的保障、据点或统治者，但原文本身没有明确限定；保留比喻可避免消除真实歧义。
- issue: 锡安的“火”和耶路撒冷的“炉”如何解释
  choice: 保留原有意象，不在正文中明确解释
  alternative: 明确译作祭坛之火；明确译作末世审判之火
  rationale: 这些意象很可能表现雅威施行审判、吞灭仇敌的临在，但经文本节没有将其缩小为单一的祭祀或末世含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“磐石—火—炉”的诗性意象和原文歧义；分号呈现两个平行句及宣告公式后的神圣临在意象。所有脚注标记均置于正文相应位置。
