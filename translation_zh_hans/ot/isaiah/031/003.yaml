id: ISA.31.3
reference: Isaiah 31:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מִצְרַ֤יִם אָדָם֙ וְֽ/לֹא אֵ֔ל וְ/סוּסֵי/הֶ֥ם בָּשָׂ֖ר וְ/לֹא ר֑וּחַ וַֽ/יהוָ֞ה יַטֶּ֣ה יָד֗/וֹ וְ/כָשַׁ֤ל עוֹזֵר֙ וְ/נָפַ֣ל עָזֻ֔ר וְ/יַחְדָּ֖ו כֻּלָּ֥/ם יִכְלָיֽוּ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/003.yaml
  text: Egypt is man and not God[a], and their horses are flesh and not spirit. When Yahweh stretches out his hand, the helper will stumble and the one helped will fall[c][b], and together all of them will come to an end.
translation:
  language: zh_hans
  text: 埃及不过是人，并不是神[a]；他们的马不过是血肉，并不是灵[b]。耶和华一伸手，帮助人的必踉跄，受帮助的必跌倒；他们全都要一同灭亡[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“埃及只是人，并不是神。”
    reason: “人”是集合性、性质性的判断，强调埃及属于人的层面，而不具有神性。
  - marker: b
    text: “灵”也可理解为气息、生命力或非物质的能力；这里不一定特指圣灵。
    reason: רוּחַ语义范围较广，正文应保留它与“血肉”之间的开放性对比。
  - marker: c
    text: “灭亡”也可译作“归于终结”或“被耗尽”。
    reason: יִכְלָיוּן可描述消亡、终结或耗尽。
lexical_decisions:
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 按国名直译；此处以国家整体为单数主语。
- source_word: אָדָם
  choice: 人
  rationale: 与“神”形成简洁鲜明的对比，强调埃及只是受造、有限的人，而非强调性别；加入“不过”自然表达希伯来语对比所隐含的限制意味。
- source_word: אֵל
  choice: 神
  rationale: 这里指真正的神性，与作为人的埃及相对。
- source_word: סוּסֵיהֶם
  choice: 他们的马
  rationale: 直接传达带第三人称复数后缀的名词。
- source_word: בָּשָׂר
  choice: 血肉
  rationale: 现代汉语中“血肉”比单说“肉”更自然，并保留受造、脆弱、必朽的含义及其与“灵”的对照。
- source_word: רוּחַ
  choice: 灵
  rationale: 保留“血肉—灵”的开放性对比，不特指圣灵，也不把词义限定为气息或生命力。
- source_word: יהוה
  choice: 耶和华
  rationale: 以中文圣经传统中广为人知的专名表达四字神名。
- source_word: יַטֶּה יָדוֹ
  choice: 一伸手
  rationale: 自然而凝练地表达神伸手施行决定性行动；“一……便……”式语感也契合后续必然结果。
- source_word: עוֹזֵר
  choice: 帮助人的
  rationale: 以名词化短语表达施助者，并与“受帮助的”形成清楚对应。
- source_word: עָזֻר
  choice: 受帮助的
  rationale: 保留被动分词的角色含义，明确指接受援助的一方。
- source_word: כָּשַׁל
  choice: 踉跄
  rationale: 保留开始失足、站立不稳的具体意象，并与下一分句的“跌倒”构成递进。
- source_word: נָפַל
  choice: 跌倒
  rationale: 直接自然地表达倒下，与“踉跄”形成平行而递进的搭配。
- source_word: יִכְלָיוּן
  choice: 灭亡
  rationale: 在此审判语境中自然表达全部终结、消亡，同时以脚注保留“耗尽”的可能语感。
theological_decisions:
- issue: רוּחַ是否应明确译为“圣灵”
  choice: 灵
  alternative: 气息／生命力／圣灵
  rationale: 原文以רוּחַ与“血肉”相对，所指可涵盖非物质的生命或能力，但并未明确指定圣灵；正文保留其神学张力，不作过度限定。
- issue: אָדָם在“埃及是אָדָם而不是神”中的表达
  choice: 人
  alternative: 人类／凡人
  rationale: “人”在现代汉语中既简洁又能表达埃及仅属人而非神；“凡人”会强化必朽含义，“人类”则削弱原句的警句式力度。
- issue: 末句יִכְלָיוּן的审判力度
  choice: 全都要一同灭亡
  alternative: 全都要一同完结／耗尽
  rationale: “灭亡”符合上下文中踉跄、跌倒之后的彻底结局，但脚注保留该动词也可表达被耗尽或归于终结。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前两句用“不过是……并不是……”再现尖锐对比；后半句以“踉跄—跌倒—灭亡”呈现原文逐步崩溃的节奏。所有脚注标记均置于相关正文之后。
