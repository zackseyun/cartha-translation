id: ISA.31.1
reference: Isaiah 31:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ה֣וֹי הַ/יֹּרְדִ֤ים מִצְרַ֨יִם֙ לְ/עֶזְרָ֔ה עַל סוּסִ֖ים יִשָּׁעֵ֑נוּ וַ/יִּבְטְח֨וּ עַל רֶ֜כֶב כִּ֣י רָ֗ב וְ/עַ֤ל פָּֽרָשִׁים֙ כִּֽי עָצְמ֣וּ מְאֹ֔ד וְ/לֹ֤א שָׁעוּ֙ עַל קְד֣וֹשׁ יִשְׂרָאֵ֔ל וְ/אֶת יְהוָ֖ה לֹ֥א דָרָֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/001.yaml
  text: Woe to those who go down to Egypt for help[a], who rely on horses and trust in chariots because they are many, and in horsemen because they are very strong[c][b], but do not look to the Holy One of Israel and do not seek Yahweh.
translation:
  language: zh_hans
  text: 那些下到埃及求援的人有祸了！他们倚靠马匹，信赖战车，因为战车众多；又信赖骑兵[a]，因为骑兵十分强大[b]；却不仰望以色列的圣者，也不寻求雅威[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “骑兵”也可译作“骑马的战士”。
    reason: 保留פָּרָשִׁים所指个体骑手与集体骑兵之间的词义范围。
  - marker: b
    text: “十分强大”也可理解为“人数极多”。
    reason: עָצְמוּ מְאֹד可强调力量强盛，也可能强调数量庞大。
  - marker: c
    text: “雅威”是希伯来文神名יהוה；传统中文译本常译作“耶和华”，也有译本以“主”代称。
    reason: 说明正文直接音译神名的依据，并帮助读者辨认常见传统译法。
lexical_decisions:
- source_word: הוֹי
  choice: 有祸了
  rationale: 这是先知宣告审判的感叹语。译为“有祸了”既保留警告和定罪的力度，也比单独使用古雅的“祸哉”更符合现代普通话。
- source_word: הַיֹּרְדִים מִצְרַיִם לְעֶזְרָה
  choice: 那些下到埃及求援的人
  rationale: 分词作名词使用，指具有这类行为的人；“下到埃及”保留希伯来文的地理表达，“求援”简洁表达此行目的。
- source_word: עַל סוּסִים יִשָּׁעֵנוּ
  choice: 他们倚靠马匹
  rationale: שׁען的尼法勒词形描绘靠在某物上而获得支撑。“倚靠”在中文中兼具具体图像和依赖之意。
- source_word: וַיִּבְטְחוּ עַל רֶכֶב כִּי רָב
  choice: 信赖战车，因为战车众多
  rationale: רֶכֶב在这里是集合名词，译为复数概念“战车”；בטח译为“信赖”，凸显他们把安全寄托在军事力量上。
- source_word: וְעַל פָּרָשִׁים
  choice: 又信赖骑兵
  rationale: פָּרָשִׁים指骑马作战的人，可译“骑兵”或“骑士”。中文用“骑兵”自然地表达集体军事力量；为句意清楚，补出前面统摄此短语的“信赖”。
- source_word: כִּי עָצְמוּ מְאֹד
  choice: 因为骑兵十分强大
  rationale: עָצַם可表示强盛，也可涉及数量众多。正文采用“十分强大”，保留军事威势，并以脚注说明数量方面的可能理解。
- source_word: וְלֹא שָׁעוּ עַל קְדוֹשׁ יִשְׂרָאֵל
  choice: 却不仰望以色列的圣者
  rationale: שׁעה表示带着关注、倚赖而转眼观看。“仰望”自然表达对神的注目与依靠，并与前文倚靠埃及形成对照。
- source_word: וְאֶת יְהוָה לֹא דָרָשׁוּ
  choice: 也不寻求雅威
  rationale: דרש在此表示寻求神、求问神或转向神。“寻求”保留其较宽广的含义；“雅威”直接呈现神名יהוה。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名יהוה。译为“雅威”旨在呈现该专名，而不是用称号“主”取代；脚注同时帮助熟悉传统中文译名的读者辨认。
- issue: 时态与体貌
  choice: 以现代汉语的一般陈述表达这类人的行为
  alternative: 全部处理成已经发生的过去事件
  rationale: 开头的分词把受责备者描写成一类人，后续动词构成先知性的祸灾宣告。现代汉语无需强加过去时标记，因而保留此宣告兼具现实指向和典型性的效果。
- issue: עָצְמוּ מְאֹד所指的是力量还是数量
  choice: 正文译“十分强大”
  alternative: 译“人数极多”或“极其众多”
  rationale: 该词根既可表达强盛，也可在相关语境中表达数量庞大。正文选择军事语境中自然的“强大”，但不排除数量含义，故在脚注保留另一种读法。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“有祸了”保留先知宣告的力度而避免过度古雅；分号呈现希伯来诗句中军事倚靠的平行结构，“却”突出倚靠埃及与不寻求神之间的神学对照。
