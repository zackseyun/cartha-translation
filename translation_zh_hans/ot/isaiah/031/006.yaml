  text: שׁ֗וּבוּ לַ/אֲשֶׁ֛ר הֶעְמִ֥יקוּ סָרָ֖ה בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/006.yaml
  text: Return to him from whom the sons of Israel have deeply revolted[a][b].
translation:
  language: zh_hans
  text: 以色列人哪，你们要归向你们深深背叛的那一位。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列人哪，你们要归回那一位，就是你们深深背叛的那一位。”希伯来语的介词加关系词结构十分凝缩：它既可凸显背叛所针对的对象，也与“归回”的方向相连。
    reason: alternative_reading
  - marker: b
    text: “以色列人”所译的希伯来语字面为“以色列的儿子们”；这里是对以色列人的集体称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: 要归向
  rationale: 复数命令式，表达悔改并重新转向的呼召；“归向”既保留方向感，也符合先知性劝诫的庄重语体。
- source_word: לַאֲשֶׁר
  choice: 你们所……的那一位
  rationale: 希伯来语关系结构高度凝缩；结合“归向”和后面的“背叛”，中文自然表达为“归向你们所深深背叛的那一位”，不在正文中补出原文未明说的上帝名号。
- source_word: הֶעְמִיקוּ
  choice: 深深
  rationale: 使役形在此加强 סָרָה 的程度，字面涉及“使之深入”；用“深深”自然保留其强化作用。
- source_word: סָרָה
  choice: 背叛
  rationale: 该词表示偏离、反叛或背道；“背叛”通俗而有分量，能表达对立约之主的严重离弃，又避免“叛教”等术语化措辞。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的儿子们
  rationale: 保留希伯来语阳性复数结构的字面形式；此称呼在语境中集体指以色列人。
theological_decisions:
- issue: 是否在正文中明确补出归向的对象是上帝或耶和华
  choice: 保留关系表达“那一位”
  alternative: 归向耶和华；归向上帝
  rationale: 上下文清楚指向以色列的上帝，但本节希伯来文本没有直接写出神名。保留“那一位”避免把上下文信息直接写进经文本身。
- issue: לַאֲשֶׁר 与叛逆关系的表达
  choice: 归向你们所深深背叛的那一位
  alternative: 归回你们远离的那一位
  rationale: 介词与关系词构成压缩表达；正文突出背叛所针对的对象，脚注同时保留从离开对象那里归回的方向性理解。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“以色列的儿子们哪”刻意保留源文形式；“那一位”维持原文未明说神名的含蓄，同时让上下文确定所指。
