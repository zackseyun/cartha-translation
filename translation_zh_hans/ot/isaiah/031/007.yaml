base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/007.yaml
  text: For on that day each man will reject his idols of silver and his idols of gold, which your hands have made for you as sin.
translation:
  language: zh_hans
  text: 因为在那日，各人都必弃绝自己的银偶像和金偶像，就是你们亲手为自己造作的罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲手为自己造作的罪”：原文直译近于“你们的手为你们所造的罪”。句末“罪”的句法十分凝练；它可将所造的偶像称为罪，也可强调造偶像之举是罪。
    reason: 说明חֵטְא与“你们的手所造”之间的简约、可多向理解的关系，避免将其单一化为“所犯的罪”或仅作方式状语。
lexical_decisions:
- source_word: יִמְאָסוּן
  choice: 必弃绝
  rationale: 该动词表示厌弃、拒绝；结合先知所宣告的将来情景，用“必弃绝”既保留明确语气，也符合现代汉语表达。
- source_word: אֱלִילֵי כַסְפּוֹ וֶאֱלִילֵי זְהָבוֹ
  choice: 自己的银偶像和金偶像
  rationale: 分别保留“银制的偶像”和“金制的偶像”，并以“自己的”体现希伯来文第三人称单数所有格与“各人”的对应。
- source_word: חֵטְא
  choice: 罪
  rationale: 原文以名词“罪”作简约而有张力的收束，可将偶像本身及制造偶像之举都置于罪的判定之下；正文不将其弱化为泛指的“错误”。
theological_decisions:
- issue: חֵטְא与制造偶像行为之间的关系
  choice: 译作“为自己造下的罪”，使“罪”直接界定这些人亲手制造偶像之事及其产物
  alternative: 译作“你们犯罪所造的”或“你们罪恶的手所造的”
  rationale: 希伯来文只在句末使用名词חֵטְא，句法关系高度凝练。正文保留“罪”的名词力度，同时用脚注交代可作方式状语理解，避免排他性地解决原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们各人”保留原文由复数主体转入“各人”的表达；“亲手”自然呈现“你们的手”，并强调责任归属。脚注标记已在正文中对应出现。
