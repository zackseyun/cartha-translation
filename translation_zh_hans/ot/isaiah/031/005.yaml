source:
  edition: WLC
  text: כְּ/צִפֳּרִ֣ים עָפ֔וֹת כֵּ֗ן יָגֵ֛ן יְהוָ֥ה צְבָא֖וֹת עַל יְרֽוּשָׁלִָ֑ם גָּנ֥וֹן וְ/הִצִּ֖יל פָּסֹ֥חַ וְ/הִמְלִֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/005.yaml
  text: Like birds hovering[a], so Yahweh of Armies will shield Jerusalem—shielding and delivering, passing over and rescuing.
translation:
  language: zh_hans
  text: 如飞翔的鸟，万军之雅威必护卫耶路撒冷——护卫并搭救，越过[a]并使她脱险。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “越过”也可译作“顾惜”或“护庇”；这里的希伯来词也呼应出埃及记中的逾越节用语。
    reason: 说明פָּסֹחַ的语义范围，并保留其与逾越节语言的关联。
lexical_decisions:
- source_word: כְּ/צִפֳּרִים עָפוֹת
  choice: 如同飞鸟翱翔在上
  rationale: צִפֳּרִים是“鸟”的复数，עָפוֹת直指飞翔。“翱翔在上”既保留飞鸟的动态，也与后文雅威在耶路撒冷之上的护卫行动相呼应；不把动词过度限定为护雏式的“盘旋”。
- source_word: יָגֵן ... גָּנוֹן
  choice: 必……护卫；他必护卫
  rationale: גנן表示遮护、保卫。用“护卫”兼具具体的防护意味和自然的现代汉语表达，并保留原文同根词的重复强调。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 以“雅威”音译神名יהוה，不用头衔替代；“万军”保留צְבָאוֹת所含军旅及天上众军的意象，也是庄重而易懂的汉语表达。
- source_word: עַל יְרוּשָׁלִָם
  choice: 护卫耶路撒冷
  rationale: עַל在此表达护卫行动所临到、所覆盖的对象；汉语及物结构“护卫耶路撒冷”自然，而前句“翱翔在上”保留了空间意象。
- source_word: וְ/הִצִּיל
  choice: 并搭救
  rationale: נצל的使役式表示救出、解救；“搭救”简洁地传达从危险中救出的含义。
- source_word: פָּסֹחַ
  choice: 越过
  rationale: 保留פסח与出埃及记逾越事件相呼应的字面表达，不在正文中直接消除其也可表示“顾惜、护庇”的语义张力。
- source_word: וְ/הִמְלִיט
  choice: 并使她脱险
  rationale: מלט的使役式含有使之逃脱、救其脱险之意。“使她脱险”既与前面的“搭救”有所区别，也准确保留使役色彩；“她”指耶路撒冷城。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”以呈现专名，不以“主”这一头衔替换，也不借译名选择引入宗派性解释。
- issue: פָּסֹחַ与逾越节意象的处理
  choice: 正文译“越过”，脚注列出“顾惜”或“护庇”
  alternative: 顾惜；护庇
  rationale: 该词可能唤起出埃及记中逾越的语言，同时在本语境中传达保护性地放过、顾惜之意。正文保留“越过”，脚注说明其他可能，以保存双重意涵和神学张力。
- issue: 飞鸟比喻的具体图景
  choice: 飞鸟翱翔在上
  alternative: 飞鸟盘旋；护雏的鸟
  rationale: 原文只明说鸟正在飞，并未明说鸟巢、幼雏或盘旋。译文避免把一种可能的保护图景固定为原文唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“如同……也必照样……”清楚呈现比喻关系；分号后保留原文连续四个动作及“护卫”的重复。用“翱翔在上”而不用较具解释性的“盘旋护雏”，避免超出希伯来文本。
