  to: 然而，他也有智慧，带来灾祸[a]；他不收回自己所说的话[b]，却起来攻击作恶之人的家和行不义之人的援助[c]。
  rationale: 修订删除“必”和“降下”所附加的情态及方向性，按原文采用较中性的“带来灾祸”。末句删除解释性补语“所倚仗的”，以“行不义之人的援助”保留原文构词关系的含混；同时使一个“攻击”统摄两个并列对象，行文更简洁自然。脚注锚点均紧随相应词语，脚注内容与正文一致。
