  text: וְ/גַם ה֤וּא חָכָם֙ וַ/יָּ֣בֵא רָ֔ע וְ/אֶת דְּבָרָ֖י/ו לֹ֣א הֵסִ֑יר וְ/קָם֙ עַל בֵּ֣ית מְרֵעִ֔ים וְ/עַל עֶזְרַ֖ת פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/002.yaml
  text: Yet he too is wise and brings disaster[a]; he does not take back his words[c][b], but rises against the house of evildoers and against the help of workers of iniquity.
translation:
  language: zh_hans
  text: 然而，他也有智慧，带来灾祸[a]；他不收回自己所说的话[b]，却起来攻击作恶之人的家和行不义之人的援助[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带来灾难”。这里的“灾祸”指审判所带来的祸患，并非道德上的邪恶。
    reason: lexical_alternative
  - marker: b
    text: 或译“他不撤回自己的话”。
    reason: lexical_alternative
  - marker: c
    text: 原文为抽象名词“援助”或“帮助”，并不是“帮助者”。
    reason: lexical_clarification
lexical_decisions:
- source_word: וְגַם הוּא חָכָם
  choice: 然而，他也有智慧
  rationale: “然而”体现上下文中的反衬意味；明示的代词和“也”保留了与人所倚重之智慧的对比。
- source_word: וַיָּבֵא רָע
  choice: 必降下灾祸
  rationale: רָע在此指审判性的灾难，而非道德上的邪恶；未完成式在预告语境中自然表达为将要发生的行动。
- source_word: וְאֶת דְּבָרָיו לֹא הֵסִיר
  choice: 他不收回自己所说的话
  rationale: הֵסִיר与“话”连用，意为不撤回、不取消已说的话；此译自然且保留复数所涵盖的言说内容。
- source_word: וְקָם עַל
  choice: 反而起来攻击
  rationale: קום על表示起而敌对、采取行动攻击；“反而”呈现这里与人的盘算相对立的推进关系。
- source_word: בֵּית מְרֵעִים
  choice: 作恶之人的家
  rationale: 保留בֵּית的“家、家室或集团”意象，不把其范围过早限定为家庭、国家或军营。
- source_word: עֶזְרַת
  choice: 所倚仗的帮助
  rationale: 原文是抽象名词“帮助、援助”，不是“帮助者”；补入“所倚仗的”使中文关系清楚，同时仍以“帮助”为中心。
- source_word: פֹּעֲלֵי אָוֶן
  choice: 行不义之人
  rationale: 以现代、庄重的中文表达持续作恶的人；“不义”保留אָוֶן在此处的道德分量。
theological_decisions:
- issue: 上帝行动中的רָע应如何表达
  choice: 灾祸
  alternative: 邪恶；灾难
  rationale: 上下文所指是上帝施行审判而带来的祸患，并非说上帝行道德之恶；“灾祸”保留主动审判的力度。
- issue: 代词הוּא的所指
  choice: 正文保留“他”，由上下文指向耶和华
  alternative: 直接译为“耶和华”
  rationale: 原文使用强调代词而未重复神名；保留代词既忠于句法，也维持它与埃及智慧之间的对比。
- issue: עֶזְרַת是援助还是援助者
  choice: 帮助
  alternative: 帮助者
  rationale: 原文为抽象名词，可能指埃及所提供的支援；不将它改写成人称名词，以保留文本的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“然而……也”保留原文的讽刺性对照；“反而起来攻击”体现敌对行动。“作恶之人的家”有意保留“家”的集合性和范围上的含混，不擅自限定其政治或军事所指。
