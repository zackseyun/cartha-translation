  text: כִּ֣י כֹ֣ה אָֽמַר יְהוָ֣ה אֵלַ֡/י כַּ/אֲשֶׁ֣ר יֶהְגֶּה֩ הָ/אַרְיֵ֨ה וְ/הַ/כְּפִ֜יר עַל טַרְפּ֗/וֹ אֲשֶׁ֨ר יִקָּרֵ֤א עָלָי/ו֙ מְלֹ֣א רֹעִ֔ים מִ/קּוֹלָ/ם֙ לֹ֣א יֵחָ֔ת וּ/מֵֽ/הֲמוֹנָ֖/ם לֹ֣א יַֽעֲנֶ֑ה כֵּ֗ן יֵרֵד֙ יְהוָ֣ה צְבָא֔וֹת לִ/צְבֹּ֥א עַל הַר צִיּ֖וֹן וְ/עַל גִּבְעָתָֽ/הּ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/004.yaml
  text: 'For thus Yahweh said to me: As the lion or the young lion growls over its prey[a], and though a band of shepherds is called out against it, it is not terrified by their voice or cowed by their noise[b], so Yahweh of hosts will come down to wage war on Mount Zion and on its hill.'
translation:
  language: zh_hans
  text: '因为耶和华这样对我说：


    “狮子和少壮狮子守着猎物低声咆哮[a]；


    即使一大群牧人被召来攻击它，


    它也不因他们的喊声惊惶，


    不因他们的喧嚷屈服[b]。


    照样，万军之耶和华必降下来，


    在锡安山和它的山冈上争战。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狮子和少壮狮子”也可理解为“狮子，或少壮狮子”；希伯来语的并列可能是诗歌中的复指或代表性配对，并不一定指两只不同的狮子。
    reason: lexical_alternative
  - marker: b
    text: “屈服”所译的希伯来语也可较直译为“回应”；本句也可译作“不回应他们的喧嚷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确保留四字神名，而不以“主”替代。
- source_word: יֶהְגֶּה
  choice: 低声咆哮
  rationale: 此处描写狮子守着猎物发出的低沉威吓声；既保留低声含义，也用自然中文呈现狮吼意象。
- source_word: הָאַרְיֵה וְהַכְּפִיר
  choice: 狮子，就是少壮狮子
  rationale: 保留希伯来语连接词，同时按诗歌同位或复指理解，避免武断地改成二选一，也不暗示必有两只狮子。
- source_word: מְלֹא רֹעִים
  choice: 一大群牧人
  rationale: מְלֹא在此表示人数众多、整群聚集；“一大群”比直译“满数”自然，也保留场面的声势。
- source_word: לֹא יֵחָת
  choice: 不……惊惶
  rationale: 表达חתת被动词形所指的受惊、丧胆，与狮子毫不畏惧的图景相合。
- source_word: לֹא יַעֲנֶה
  choice: 不……屈服
  rationale: 结合与“不惊惶”的平行关系，正文采用被压服、屈服之义；其可能的字面义“回应”收入脚注。
- source_word: הֲמוֹנָם
  choice: 他们的喧嚷
  rationale: 指牧人聚集时发出的嘈杂声势；“喧嚷”兼具声音和骚动感。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留传统而清楚的神圣称号，并契合本节争战语境。
- source_word: לִצְבֹּא
  choice: 争战
  rationale: 该不定式源于צבא，在此具有出征作战之意；“争战”简洁保留军事力量。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 正文使用中文读者广泛识别的神名音译，不以称号替代专名；不同的拟音传统不影响经文所指。
- issue: 耶和华在锡安山“争战”的关系指向
  choice: 保留“在锡安山和它的冈陵上争战”
  alternative: 为锡安山争战；攻打锡安山
  rationale: 介词עַל既可能表示地点，也可能在语境中带有“为……而战”或“攻打……”的关系色彩。正文不补入“为”或“攻打”，以保留原文张力。
- issue: לֹא יַעֲנֶה的语义
  choice: 不因喧嚷屈服
  alternative: 不回应他们的喧嚷
  rationale: 与前句“不惊惶”的诗体平行支持受压服之义，但词根常见的“回答、回应”义仍真实存在，因此以脚注保留。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并按希伯来诗体分行。使用“伏在猎物上”“一大群牧人”“喧嚷”等具体表达维持捕食者图景；正文对עַל的关系不作神学性增译，从而保留耶和华降临与锡安之间的原文张力。
