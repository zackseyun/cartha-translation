  text: וּ/תְקַעְתִּ֥י/ו יָתֵ֖ד בְּ/מָק֣וֹם נֶאֱמָ֑ן וְ/הָיָ֛ה לְ/כִסֵּ֥א כָב֖וֹד לְ/בֵ֥ית אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/023.yaml
  text: And I will drive him like a peg into a secure place[b][a], and he will become a throne of honor to his father's house.
translation:
  language: zh_hans
  text: 我要把他像钉子一样钉入坚固之处[a]；他必成为他父家的荣耀宝座[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他像钉子一样钉牢在稳固之处。”
    reason: 原文动词可强调钉入，也可强调固定牢靠；此译法呈现后一层语气，同时保留地点短语。
  - marker: b
    text: “荣耀宝座”也可译作“尊荣的宝座”或“荣耀的座位”。
    reason: כִּסֵּא可指宝座或座位，כָבוֹד可指荣耀或尊荣；原短语容许这些相近表达。
lexical_decisions:
- source_word: וּתְקַעְתִּיו
  choice: 我要把他……钉在
  rationale: תקע与“钉子”连用，表示把物件钉入或钉牢；“钉在”保留具体动作和稳固安置的意象，也符合现代汉语表达。
- source_word: יָתֵד
  choice: 钉子
  rationale: יָתֵד可指木钉、橛子或支撑重物的钉；“钉子”通俗自然，并能与动词“钉在”形成原文中的鲜明意象。
- source_word: בְּמָקוֹם נֶאֱמָן
  choice: 在牢固之处
  rationale: נֶאֱמָן在此表示可靠、稳固，而非人格意义上的“忠信”；“牢固之处”准确表达可承重、不动摇的地点。
- source_word: וְהָיָה
  choice: 他必成为
  rationale: היה既可表示“是”，也可表示“成为”；这里描述上帝安置他之后产生的结果，因此译作“成为”，而“必”体现预告语境。
- source_word: לְכִסֵּא כָבוֹד
  choice: 荣耀宝座
  rationale: כִּסֵּא是宝座或座位，כָבוֹד可指荣耀、尊荣；“荣耀宝座”保留原文的王权与尊荣意象，不把比喻解释成一般的显贵地位。
- source_word: לְבֵית אָבִיו
  choice: 他父家的
  rationale: “父家”在此指父系家族或宗族。“他父家的”简洁表达该宝座与其家族的关系；介词לְ所含的归属或受益意味可由上下文保留。
theological_decisions:
- issue: 以利亚敬的角色所采用的双重比喻
  choice: 保留“钉子”和“宝座”两个具体意象
  alternative: 解释性地译为“稳固的领袖，并使家族得尊荣”
  rationale: 原文将稳固、承重与尊荣的意象并置，并未直接将其化约为政治职分的说明；保留比喻可避免加入超出本节的神学或政治解释。
- issue: כָבוֹד在宝座短语中的语义关系
  choice: 译作“荣耀宝座”，保留可理解为带来荣耀或具有尊荣的张力
  alternative: 译作“尊荣的座位”或明确译成“给他父家带来荣耀的宝座”
  rationale: 希伯来语名词组合可表达荣耀性质、尊荣地位或相关结果；正文采用凝练的名词组合，不将这种关系单一化。
translation_notes:
  register: 采用庄重而现代的标准普通话。“父家”是圣经家族语境中简洁可懂的表达；分号呈现安置行动与随后结果之间的关系。正文保留原文层叠的“钉子—宝座”比喻，不作解释性改写。
