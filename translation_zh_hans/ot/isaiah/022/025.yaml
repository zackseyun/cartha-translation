source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת תָּמוּשׁ֙ הַ/יָּתֵ֔ד הַ/תְּקוּעָ֖ה בְּ/מָק֣וֹם נֶאֱמָ֑ן וְ/נִגְדְּעָ֣ה וְ/נָפְלָ֗ה וְ/נִכְרַת֙ הַ/מַּשָּׂ֣א אֲשֶׁר עָלֶ֔י/הָ כִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/025.yaml
  text: On that day[a], declares Yahweh of hosts, the peg fastened in a secure place will give way, and it will be cut down and fall, and the load that was on it will be cut off[b], for Yahweh has spoken.
translation:
  language: zh_hans
  text: 到那日，万军之耶和华宣告：“钉在牢固之处的钉子[a]必松脱，被砍断，坠落；挂在它上面的重物[b]也必被除掉，因为耶和华已经说了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “钉子”也可译作“木钉”或“橛子”。
    reason: lexical_alternative
  - marker: b
    text: “重物”也可译作“重担”，指挂在钉子上、由它承载之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 万军之耶和华宣告
  rationale: נְאֻם是先知宣告的固定用语，译作“宣告”自然而庄重；יְהוָה按专名译作“耶和华”；צְבָאוֹת保留为“万军”，不把其所指过度限定为某一种军队。
- source_word: תָּמוּשׁ
  choice: 必松脱
  rationale: מוּשׁ可表示移动、离开或失去原位；用于承重的钉子时，“松脱”自然呈现其不再稳固并即将失效的图景。
- source_word: הַיָּתֵד
  choice: 钉子
  rationale: יָתֵד可指木钉、橛子或钉状固定物。上下文强调它钉在牢固之处并承载重物，“钉子”在现代汉语中简洁自然，同时不特别引入帐篷意象。
- source_word: הַתְּקוּעָה בְּמָקוֹם נֶאֱמָן
  choice: 钉在牢固之处
  rationale: תקע的被动分词表达被钉入、固定；נֶאֱמָן在这里指稳固可靠，而非道德意义上的忠信。
- source_word: וְנִגְדְּעָה וְנָפְלָה
  choice: 被砍断，坠落
  rationale: גדע表示砍断、截断；נפל表示落下。“坠落”承接钉子松脱和被砍断后的结果，并保留审判的强烈动作次序。
- source_word: וְנִכְרַת הַמַּשָּׂא אֲשֶׁר עָלֶיהָ
  choice: 挂在它上面的重物也必被除掉
  rationale: מַשָּׂא本义为负载、重担；在钉子的比喻中译作“重物”更具体。כרת在此表示被剪除、毁去；“被除掉”在汉语中清楚表达其彻底失去，同时避免不自然地说重物被“割断”。
- source_word: כִּי יְהוָה דִּבֵּר
  choice: 因为耶和华已经说了
  rationale: 这是确认预言必然实现的结束语；“已经说了”保留完成式的确定语气，并符合现代汉语表达。
theological_decisions:
- issue: 钉子比喻的具体所指
  choice: 正文保留钉子的比喻，不明确指认其人物或群体。
  alternative: 将钉子明确解释为以利亚敬、他所支撑的家族，或前文稳定应许的逆转。
  rationale: 本节希伯来文本没有明说钉子所指。直接点名会替正文解决其有意保留的张力，因此译文只呈现原有意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留先知宣告公式、连续的审判动作和钉子承重的整体比喻；脚注标记均置于对应词语之后。
