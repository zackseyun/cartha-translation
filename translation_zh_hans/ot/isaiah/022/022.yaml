  text: וְ/נָתַתִּ֛י מַפְתֵּ֥חַ בֵּית דָּוִ֖ד עַל שִׁכְמ֑/וֹ וּ/פָתַח֙ וְ/אֵ֣ין סֹגֵ֔ר וְ/סָגַ֖ר וְ/אֵ֥ין פֹּתֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/022.yaml
  text: And I will place the key of the house of David on his shoulder; he will open[a], and no one will shut; he will shut, and no one will open.
translation:
  language: zh_hans
  text: 我必把大卫家的钥匙放在他的肩上；他开[a]，无人能关；他关，无人能开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “开、关”所表达的、无人能够推翻的权柄意象，也见于《启示录》3:7。
    reason: cross_reference
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我必把……放在
  rationale: נתן可表示“给、放置、安放”；与“在他的肩上”连用时，“把……放在”既具体自然，也保留授予职权象征的意味。
- source_word: מַפְתֵּחַ
  choice: 钥匙
  rationale: 该名词意为“钥匙”；汉语无需借冠词表达其由“大卫家的”所限定的特指性。
- source_word: בֵּית דָּוִד
  choice: 大卫家
  rationale: 贴近希伯来语，保留“家族、王朝及其治理体系”的可能含义，不在正文中增添“王室”等解释。
- source_word: עַל שִׁכְמוֹ
  choice: 在他的肩上
  rationale: 直译其空间意象，保留钥匙作为职权标志由其肩负的象征，而不将象征意义明说。
- source_word: וּפָתַח
  choice: 他打开
  rationale: 在神的应许之后表示随之而来的行动或结果；用简洁陈述与下句保持平衡。
- source_word: וְאֵין סֹגֵר
  choice: 无人能关
  rationale: 希伯来语字面为“没有关闭者”，语境强调无人可以逆转他的行动；“能”自然传达这种不可抗拒的权柄。
- source_word: וְסָגַר
  choice: 他关闭
  rationale: 与“他打开”形成严整平行；“关闭”在现代汉语中庄重清楚。
- source_word: וְאֵין פֹּתֵחַ
  choice: 无人能开
  rationale: 与“无人能关”对称，表达他的关闭无人能够推翻。
theological_decisions:
- issue: 是否在正文中明确弥赛亚含义或新约呼应
  choice: 正文保持以赛亚书当下历史与文学语境中的表述，不加入明确的弥赛亚解释。
  alternative: 采用刻意凸显启示录3:7或大卫王权之弥赛亚意义的扩展译法。
  rationale: 本节直接描述与大卫家相关的受托权柄；后来的经文呼应不应反过来被加入正文，而宜在脚注中指出。
- issue: “开／关”是否译成具体准入与拒绝的行政行为
  choice: 保留“打开／关闭”的意象。
  alternative: 解释为“准许进入／禁止进入”或“任命／罢免”。
  rationale: 原文没有指明所开关的具体对象；保留动词的开放性可维护其真实含混与权柄意象。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以分号保留希伯来语两组平行分句的节奏；“无人能关／无人能开”自然呈现原文强调的不可逆转性。
