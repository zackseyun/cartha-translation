  text: וְ/תָל֨וּ עָלָ֜י/ו כֹּ֣ל כְּב֣וֹד בֵּית אָבִ֗י/ו הַ/צֶּֽאֱצָאִים֙ וְ/הַ/צְּפִע֔וֹת כֹּ֖ל כְּלֵ֣י הַ/קָּטָ֑ן מִ/כְּלֵי֙ הָֽ/אַגָּנ֔וֹת וְ/עַ֖ד כָּל כְּלֵ֥י הַ/נְּבָלִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/024.yaml
  text: 'And they will hang on him all the honor of his father’s house: the offspring and the offshoots, every small vessel, from the bowls to all the jars.'
translation:
  language: zh_hans
  text: 人要把他父家的全部荣耀都挂在他身上：子孙和后裔，一切小器皿，从盆到各样瓶罐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּבוֹד
  choice: 荣耀
  rationale: 保留该词“分量、尊荣、荣耀”的核心意象；在“父家”语境中，既可指家族的尊荣，也暗含全家的重负系于一人。
- source_word: הַצֶּאֱצָאִים וְהַצְּפִעוֹת
  choice: 子孙和后裔
  rationale: 两词均指家族所生、所出的成员，第二词罕见且意义不完全确定；采用近义并列，保留原文繁衍支系的表达而不作过度具体化。
- source_word: כְּלֵי הַקָּטָן
  choice: 一切小器皿
  rationale: 直译其器皿隐喻，指家族中地位较小或依附的人，同时与下文不同器具相连。
- source_word: אַגָּנוֹת
  choice: 盆
  rationale: 该词通常指盆、钵一类容器；用现代汉语常见且宽泛的“盆”。
- source_word: נְּבָלִים
  choice: 瓶罐
  rationale: 此处指一类盛装用器皿；“瓶罐”自然地概括其容器意义，并与“盆”形成范围性的列举。
theological_decisions:
- issue: “挂在他身上”的器皿意象是否解释为家族成员
  choice: 保留“挂”和“器皿”的比喻，不在正文中释义
  alternative: 译作“全都倚靠他，包括家中所有地位低微的人”
  rationale: 上下文把以利亚敬描绘为稳固的钉子；原文刻意延续把家族荣耀及器皿挂在钉上的意象。直陈释义会消解这一文学和神学张力。
- issue: כְּבוֹד侧重“荣耀”还是“尊荣/荣誉”
  choice: 荣耀
  alternative: 尊荣
  rationale: “荣耀”较完整保留希伯来词的丰富语义及家族全部分量系于一人的意味；未将其限定为社会声誉。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留钉子与器皿的连续隐喻。用冒号展开“父家的全部荣耀”的具体内容，避免添加原文没有的解释。
