base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/008.yaml
  text: And he removed the covering of Judah[b][a], and on that day you looked to the weapons of the House of the Forest.
translation:
  language: zh_hans
  text: 他除去了犹大的遮盖[a]；在那一天，你看向林宫[b]的兵器。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹大的防护”或“犹大的保障”。希伯来文直译为“犹大的遮盖”，以遮盖物比喻庇护或防御。
    reason: lexical_alternative
  - marker: b
    text: “林宫”很可能指王室的军械库或宫殿，也就是别处所称的“黎巴嫩林宫”。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגַל
  choice: 他揭去了
  rationale: 使役形在这里表示揭去或除去某物；用“揭去了”既保留动作及其具体意象，也不把未明说的主语进一步解释出来。
- source_word: מָסַךְ
  choice: 遮盖
  rationale: 原词指遮盖物、帘幕或屏障；这里可能比喻犹大的防护。“遮盖”保留原文的具体比喻，解释性含义置于脚注。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: וַתַּבֵּט אֶל
  choice: 你看向
  rationale: 动词为第二人称阳性单数，搭配介词 אֶל，意为朝某物观看；“你看向”保留单数拟人化称呼及方向性。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 简洁自然地表达先知话语中的特定时间指向。
- source_word: נֶשֶׁק
  choice: 兵器
  rationale: 该词泛指武器装备；“兵器”在此军事语境中清楚、庄重，也不局限为护甲。
- source_word: בֵּית הַיָּעַר
  choice: 林宫
  rationale: 字面为“森林之屋”，很可能指别处所称的“黎巴嫩林宫”，并与王室军械库有关。“林宫”作为建筑名称简明自然，具体辨识留在脚注说明。
theological_decisions:
- issue: “犹大的遮盖”的比喻意义
  choice: 正文保留“遮盖”的具体比喻
  alternative: 译作“犹大的防御”或“犹大的保障”
  rationale: 原文没有直接使用“防御”一词；保留意象可避免过早限定其所指，同时由脚注说明其可能的保护或防御含义。
- issue: 第二人称动词的受话者
  choice: 保留单数“你”，理解为对耶路撒冷或犹大的拟人化称呼
  alternative: 改为复数称呼，或使用不明确受话者的表达
  rationale: 希伯来语动词是第二人称阳性单数；中文“你”能保留先知话语直接质问、陈述的修辞张力，而不另行指定群体。
- issue: 揭去遮盖者的身份
  choice: 按原文译作“他”，不在本节中明指身份
  alternative: 直接补译为“主”或采用无主句
  rationale: 希伯来语动词带第三人称阳性单数主语，但本节未重述其身份；保留代词可维持上下文衔接和原文在本节中的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。正文保留“遮盖”的原文意象和单数“你”的拟人化称呼；分号体现两个连续动作。所有解释性辨识均置于脚注，避免在正文中过度阐释。
