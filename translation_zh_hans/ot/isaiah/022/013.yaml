base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/013.yaml
  text: 'And behold[a], joy and gladness, killing cattle and slaughtering sheep, eating meat and drinking wine: “Let us eat and drink, for tomorrow we die.”'
translation:
  language: zh_hans
  text: 看哪[a]，欢喜快乐，宰牛杀羊，吃肉喝酒：“我们吃吧，喝吧，因为明天我们要死了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们吃吧，喝吧”也可较直译为“吃吧，喝吧”，保留希伯来文省略主语、简短而像口号的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注意、使场景骤然呈现的功能；在现代中文中庄重而自然。
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: 欢喜快乐
  rationale: 以两个意义相近的词保留希伯来文并列所表现的欢庆气氛，不额外加入道德评价。
- source_word: הָרֹג בָּקָר וְשָׁחֹט צֹאן
  choice: 宰牛杀羊
  rationale: 用中文凝练的并列结构表达屠宰牛与羊的连续活动；“宰”与“杀”均不强行限定为礼仪献祭。
- source_word: אָכֹל בָּשָׂר וְשָׁתוֹת יָיִן
  choice: 吃肉喝酒
  rationale: 采用自然、具体的现代中文，保留宴饮场景及 יַיִן 的酒意。
- source_word: אָכוֹל וְשָׁתוֹ
  choice: 我们吃吧，喝吧
  rationale: 两个绝对不定式在语境中具有口号式劝勉功能；加入第一人称复数与后句 נָמוּת 相呼应，同时脚注保留更形式对应的译法。
- source_word: כִּי מָחָר נָמוּת
  choice: 因为明天就要死了
  rationale: 清楚表达未完成式在此处的将来指向；“就要”传达口号中迫近而宿命的语气。
theological_decisions:
- issue: 是否在译文中明确谴责宴乐行为
  choice: 仅描述欢庆、宰杀和宴饮，不添加“罪恶”“放纵”等评价词
  alternative: 译作“罪恶的狂欢”或“放纵宴乐”
  rationale: 希伯来文本在本节直接呈现百姓的行为和宿命式口号，先知性的谴责由上下文显明；译文不应把语境判断增添进本节措辞。
- issue: 如何处理 אָכוֹל וְשָׁתוֹ 的语法张力
  choice: 正文按语境译为第一人称复数劝勉“我们吃吧，喝吧”
  alternative: 更形式对应地译为“吃吧，喝吧”
  rationale: 后接“我们死”使这句话自然构成群体口号，但希伯来文动词形式本身并未明示第一人称，因此以脚注保存较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保持先知文体的警示感；“宰牛杀羊，吃肉喝酒”以简洁四字节奏再现原文密集的宴乐活动。正文中的脚注标记[a]与脚注对应。
