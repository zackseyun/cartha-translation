  text: וַ/יְהִ֥י מִבְחַר עֲמָקַ֖יִ/ךְ מָ֣לְאוּ רָ֑כֶב וְ/הַ/פָּ֣רָשִׁ֔ים שֹׁ֖ת שָׁ֥תוּ הַ/שָּֽׁעְרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/007.yaml
  text: And your choicest valleys were filled with chariots[a], and the horsemen took their positions at the gate.
translation:
  language: zh_hans
  text: 你最好的山谷布满了战车，骑兵也在城门口列阵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向城门列阵。”希伯来语在这里既带有方向意味，又用不定式绝对形配合限定动词来加强“部署、就位”的语气。
    reason: 保留הַשָּׁעְרָה可能表示“朝向城门”的歧义，并说明שֹׁת שָׁתוּ的强调结构。
lexical_decisions:
- source_word: מִבְחַר עֲמָקַיִךְ
  choice: 你最好的山谷
  rationale: מִבְחַר表示所精选、最优良的部分，与“你的山谷”构成结构，指城所拥有的最佳谷地；用“最好的山谷”自然传达其最高程度含义。第二人称阴性单数指向拟人化的城。
- source_word: מָלְאוּ רָכֶב
  choice: 布满了战车
  rationale: רָכֶב为集合名词，指战车或战车部队；“布满了战车”既保留充满的图景，也符合现代汉语军事场景的表达。
- source_word: הַפָּרָשִׁים
  choice: 骑兵
  rationale: 该词指骑马作战者；“骑兵”在现代汉语中清楚、简洁，并与战车构成军事部署的并列图景。
- source_word: שֹׁת שָׁתוּ
  choice: 列阵
  rationale: שׁית的不定式绝对形与限定动词连用，加强“安置、部署”的动作。结合军事语境，“列阵”传达骑兵有意就位，并以语义力度补偿希伯来语的强调结构。
- source_word: הַשָּׁעְרָה
  choice: 在城门口
  rationale: 定向词尾־ה通常可表示朝向；但与部署之意的שׁית连用时，也可理解为在城门处就位。正文采用符合场景的“在城门口”，脚注保留“向城门”的方向性可能。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“布满”“列阵”保持先知书军事场景的凝练力度；不增添原文未明说的攻守立场。
