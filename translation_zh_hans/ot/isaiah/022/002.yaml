  rationale: 修订仅处理两处：以“城邑”替代单用的“邑”，使措辞更自然且仍保留诗歌平行中的词汇变化；以“死于战争”对应“战争中的死者”，避免“战场上”所增加的地点限定。保留原文对“被杀者”与“死于刀剑／战争”的刻意并置和未明说的张力。
