base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/002.yaml
  text: O city full of shouting[a], tumultuous city, exultant town—your slain are not slain by the sword, nor dead in battle.
translation:
  language: zh_hans
  text: 满是喧嚷的城啊[a]，喧闹的城，欢腾的城邑！你那些被杀的人，并非死于刀剑，也不是死于战争。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“满是骚动的城……嘈杂的城……欢乐的城邑。”希伯来文连续使用几个意义相近的词，描绘这城响亮、欢庆而喧乱的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשֻׁאוֹת
  choice: 喧嚷
  rationale: 指响亮嘈杂的声响或骚动；“喧嚷”既保留声音意象，也适合与下文“喧闹、欢腾”并列。
- source_word: מְלֵאָה
  choice: 满是
  rationale: 自然表达城市充满某种声响、以此为鲜明特征。
- source_word: עִיר
  choice: 城
  rationale: עיר的常用对应词，也适合直接呼语。
- source_word: הוֹמִיָּה
  choice: 喧闹的
  rationale: 该词源于表示轰鸣、嘈杂或骚动的词根；此处描述全城人声鼎沸，“喧闹”自然贴切。
- source_word: קִרְיָה
  choice: 邑
  rationale: 与עיר近义；用“邑”略作词汇变化，并保留先知诗歌庄重而紧凑的平行结构。
- source_word: עַלִּיזָה
  choice: 欢腾的
  rationale: 表达喜乐、雀跃和兴高采烈；“欢腾”兼具热烈声势，与前两项声音描写相呼应。
- source_word: חֲלָלַיִךְ
  choice: 你那些被杀的人
  rationale: 语境所指是已经丧命的人，而不只是受伤者；此译也保留其与后续“被……所杀”的重复呼应。
- source_word: חַלְלֵי חֶרֶב
  choice: 被刀剑所杀
  rationale: 这是指遭兵器杀死的常见表达；“刀剑”符合圣经战争语境，又保持原文的兵器意象。
- source_word: מֵתֵי מִלְחָמָה
  choice: 死在战场上
  rationale: 表示战争中的死者；结合前句，“死在战场上”以自然汉语清楚呈现军事背景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。开头以三个近义短语形成诗歌排比；“城／邑”保留词汇变化，“喧嚷／喧闹／欢腾”呈现原文层叠的声响与庆乐意味。后半句保持反常而未解释的张力：城中的死者并非死于刀剑或战场，具体死因留待上下文说明。
