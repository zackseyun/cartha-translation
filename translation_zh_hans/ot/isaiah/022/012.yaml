source:
  edition: WLC
  text: וַ/יִּקְרָ֗א אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בַּ/יּ֣וֹם הַ/ה֑וּא לִ/בְכִי֙ וּ/לְ/מִסְפֵּ֔ד וּ/לְ/קָרְחָ֖ה וְ/לַ/חֲגֹ֥ר שָֽׂק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/012.yaml
  text: In that day the Lord GOD of hosts called for weeping[a], for mourning, for baldness, and for putting on sackcloth.
translation:
  language: zh_hans
  text: 当那日，主雅威，万军之主，呼召人哭泣、哀悼、使头顶光秃、腰间束上麻布[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“剃去头发”或“秃发”。希伯来语原词字面指头顶光秃；在这里是哀悼的习俗。
    reason: 保留 קָרְחָה 所指状态与其在哀悼语境中可指剃发行为之间的语义空间。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼召人
  rationale: 这里的 קרא 是发出要求或召唤，要求人采取随后列出的哀悼行动。“呼召人”在现代汉语中自然，也保留了原文的权威语气；“人”是按汉语表达补出的泛指对象。
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: 主万军之耶和华
  rationale: 保留 אֲדֹנָי（主）、יהוה（耶和华）和 צְבָאוֹת（万军）三个要素，并采用中文圣经语体中庄重而可辨识的复合称号。
- source_word: בַּיּוֹם הַהוּא
  choice: 当那日
  rationale: 这是先知书常见的时间表达；“当那日”简洁、庄重，也符合现代中文圣经语体。
- source_word: לִבְכִי
  choice: 哭泣
  rationale: בְּכִי 指流泪哭泣；此处与介词 ל 连用，表示呼召人从事的行动。
- source_word: וּלְמִסְפֵּד
  choice: 哀号
  rationale: מִסְפֵּד 指公开表达悲痛的哀悼、哀哭；“哀号”既与“哭泣”有所区分，也体现外显的悲恸。
- source_word: וּלְקָרְחָה
  choice: 剃光头发
  rationale: קָרְחָה 字面指秃发或光秃状态，在此语境中指以剃去头发表示哀悼。“剃光头发”清楚传达该礼俗行动，脚注保留字面可能。
- source_word: וְלַחֲגֹר שָׂק
  choice: 腰束麻布
  rationale: חגר 指把衣物或布料束在腰间，שׂק 是哀悼时穿用的粗麻布。“腰束麻布”保留具体动作和文化意象。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה צְבָאוֹת 的译法
  choice: 主万军之耶和华
  alternative: 主雅威万军之上帝；主上帝万军之主
  rationale: 所选译法没有省略“主”、四字神名和“万军”中的任何一项，也避免把“万军”限定为仅指地上的军队。采用“耶和华”是现代中文读者熟悉且庄重的神名音译；原文对万军范围并未在本节中加以界定。
- issue: קָרְחָה 是状态还是哀悼行为
  choice: 正文译作“剃光头发”，脚注说明字面含义
  alternative: 秃头；使头秃
  rationale: 上下文列举受召采取的哀悼行动，因此正文表达产生秃发状态的礼俗行为；脚注保留希伯来名词本身指“秃发”的形式与歧义，不对该行为作额外神学评断。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，并保留先知书的宣告语气。四个哀悼动作以并列结构呈现；“腰束麻布”略带圣经语体色彩，但含义清楚，并比泛化为“穿麻衣”更贴近 חגר 的具体动作。
