base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/003.yaml
  text: All your rulers have fled together[a]; they were captured without the bow. All of your fugitives who were found were captured together[b]; they had fled far away.
translation:
  language: zh_hans
  text: 你的首领都一同逃跑了；他们未用弓便被俘[a]。你所有被找到的人都一同被俘[b]；他们逃到了远方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“从弓被捆绑”。这短语的意思不甚确定：可能指他们未用弓便被俘，或未需用弓箭便被擒；也可理解为“被弓所制”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“你所有被找到的人都一同被捆绑；他们从远方逃来。”原文末句结构简略，“从远方”与“逃跑”的关系可有不同理解。
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִינַיִךְ
  choice: 你的首领
  rationale: קָצִין可指官长、统治者或军官；“首领”既符合耶路撒冷政军领袖的语境，也不限定具体官阶。
- source_word: נָדְדוּ
  choice: 逃跑了
  rationale: נדד本可表示漂泊或离去，但在围城、被俘的语境中表示逃跑最为贴切。
- source_word: יַחַד / יַחְדָּו
  choice: 一同
  rationale: 两个近义副词都强调集体行动，统一译作“一同”。
- source_word: מִקֶּשֶׁת
  choice: 没有经过弓战
  rationale: 将介词מִן理解为缺失或脱离，表达他们未经过弓箭交战便被俘；同时以脚注保留“从弓”及其他可能理解。
- source_word: אֻסָּרוּ / אֻסְּרוּ
  choice: 被俘
  rationale: אָסַר字面为“捆绑”，在军事语境中指被捆作俘虏；两处一致译为“被俘”，自然传达其语境意义。
- source_word: נִמְצָאַיִךְ
  choice: 你所有被找到的人
  rationale: 该词是מצא的尼法勒分词并带第二人称阴性单数所属后缀，直指“属于你的、被找到的人”；不擅自把他们限定为男人或逃亡者。
- source_word: מֵרָחוֹק בָּרָחוּ
  choice: 他们早已逃到远方
  rationale: ברח意为逃跑，מֵרָחוֹק表示遥远距离；“早已”自然交代逃跑先于被找到和被俘，但原文压缩句法容许不同理解，故附脚注。
