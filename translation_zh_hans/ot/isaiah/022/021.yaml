  text: וְ/הִלְבַּשְׁתִּ֣י/ו כֻּתָּנְתֶּ֗/ךָ וְ/אַבְנֵֽטְ/ךָ֙ אֲחַזְּקֶ֔/נּוּ וּ/מֶֽמְשֶׁלְתְּ/ךָ֖ אֶתֵּ֣ן בְּ/יָד֑/וֹ וְ/הָיָ֥ה לְ/אָ֛ב לְ/יוֹשֵׁ֥ב יְרוּשָׁלִַ֖ם וּ/לְ/בֵ֥ית יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/021.yaml
  text: I will clothe him with your tunic[a], and I will fasten your sash on him; I will place your authority into his hand, and he will become a father to the inhabitants of Jerusalem and to the house of Judah.
translation:
  language: zh_hans
  text: 我要给他穿上你的长衣，把你的腰带紧系在他身上；我要把你的职权交在他手中。他要作耶路撒冷居民和犹大家的父亲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父亲”在这里是比喻，表示负责任、施行保护的领导者，并非指生身父亲。
    reason: 说明原文政治领导语境中的直接隐喻，避免现代读者误解为血缘关系，同时不取代正文意象。
lexical_decisions:
- source_word: וְהִלְבַּשְׁתִּיו
  choice: 我要给他穿上
  rationale: 使役形表达“使他穿上”；中文用“给他穿上”自然地保留授予服饰的动作和任职语境。
- source_word: כֻּתָּנְתֶּךָ
  choice: 你的长衣
  rationale: כֻּתֹּנֶת 指贴身或内层的长衣。“长衣”比“袍子”更少暗示宽大的外袍，也比音译名称更便于普通读者理解。
- source_word: וְאַבְנֵטְךָ אֲחַזְּקֶנּוּ
  choice: 把你的腰带紧系在他身上
  rationale: אַבְנֵט 是束身的带子；חזק 的加强语态在此表示系牢、束紧。此译保留腰带作为任职服饰的具体形象。
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: 你的职权
  rationale: מֶמְשָׁלָה 可指统治权或管辖权；本节涉及官职交接，“职权”既体现治理权柄，也符合行政任命语境。
- source_word: אֶתֵּן בְּיָדוֹ
  choice: 交在他手中
  rationale: 直译为“放在／交在他手中”，表示把权力和责任托付给他；中文保留“手中”的具体意象。
- source_word: וְהָיָה לְאָב
  choice: 他要作……的父亲
  rationale: 保留希伯来文直接的父亲隐喻，并表达任命后形成的身份，不改写为“像父亲”或“保护者”。
- source_word: לְיוֹשֵׁב יְרוּשָׁלִַם
  choice: 耶路撒冷居民
  rationale: 单数分词在此具有集合意义，译作“居民”简洁自然。
- source_word: וּלְבֵית יְהוּדָה
  choice: 犹大家
  rationale: 保留“家”这一民族—王国称谓的圣经意象，同时符合现代中文圣经语体。
theological_decisions:
- issue: 以“父亲”称政治官员的隐喻
  choice: 他要作耶路撒冷居民和犹大家的父亲
  alternative: 他要像父亲一样照顾耶路撒冷居民和犹大家；他要成为他们的庇护者
  rationale: 原文使用直接隐喻 לְאָב，而非明喻。正文保留“父亲”，不将其解释性地化约为照顾、保护或宗教职衔，从而保留负责、庇护和仁厚治理等可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“长衣、腰带、手中、父亲”等具体意象均予保留；以“职权”清楚呈现官职交接的语境。句式按服饰授予、权力移交、领导身份三个层次展开。
