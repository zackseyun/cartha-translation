base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/016.yaml
  text: What do you have here[a], and whom do you have here, that you have cut out a tomb for yourself here, cutting out his tomb on the height, carving a dwelling for himself in the rock?
translation:
  language: zh_hans
  text: “你在这里有什么，又有谁，竟在这里为自己凿出坟墓——在高处凿他的坟墓，在磐石中为他刻出居所[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较通顺地译：“在高处凿你的坟墓，在磐石中为自己刻出居所。”希伯来文在这里从第二人称转为第三人称。
    reason: 说明原文的人称转换，并提供不改变基本所指的顺译。
lexical_decisions:
- source_word: מַה לְּךָ פֹה
  choice: 你在这里有什么
  rationale: 保留原文简短而带质问意味的句式，既可涉及所有或依凭，也不把含义强化为原文未明说的“你有什么权利”。
- source_word: וּמִי לְךָ פֹה
  choice: 你在这里有谁
  rationale: 与前一句形成平行，可能质问此人在当地有什么亲属或关系；译文保留这种未明确说明的含义。
- source_word: חָצַבְתָּ לְּךָ פֹּה קָבֶר
  choice: 竟在这里为自己凿出坟墓
  rationale: חצב表示凿石；“凿出”自然传达岩石墓穴的建造动作。“竟”在汉语中承接前面的反问，表达כִּי所引出的责问。
- source_word: מָרוֹם
  choice: 在高处
  rationale: 保留其具体的高地或高处意象，以及墓穴位置显赫的意味，而不进一步解释其动机。
- source_word: קִבְרוֹ
  choice: 他的坟墓
  rationale: 按马所拉文本保留第三人称阳性单数后缀，不将其悄然统一为第二人称。
- source_word: חֹקְקִי בַסֶּלַע מִשְׁכָּן לוֹ
  choice: 在磐石中为他刻出居所
  rationale: “刻出”体现חקק在岩石上雕凿的动作；“居所”保留מִשְׁכָּן的基本词义及其用于墓穴时的含蓄反讽。
theological_decisions:
- issue: 分词短语中的人称转换
  choice: 正文保留从第二人称转为第三人称的形式：“他的坟墓……为他”
  alternative: 将后半句顺译为“在高处凿你的坟墓，在磐石中为自己刻出居所”
  rationale: 马所拉文本先直接以第二人称责问，随后使用第三人称后缀。尽管汉语读来突兀，正文仍保留这一真实的语法张力，并在脚注提供较顺畅的第二人称译法。
translation_notes:
  register: 采用现代、庄重而可理解的质问语气。“磐石”和“居所”保留先知文体的凝练感；破折号标明后两个分词短语对凿墓行为的展开描述。
