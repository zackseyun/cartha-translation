base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/001.yaml
  text: 'An oracle concerning the Valley of Vision: What is the matter with you now[a], that all of you have gone up to the rooftops?'
translation:
  language: zh_hans
  text: 关于“异象谷”的宣告：你究竟怎么了[a]，竟全都上了屋顶？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “异象谷”很可能是耶路撒冷的诗性称呼，不过本节本身并未明确指出这一点。
    reason: cross_reference
lexical_decisions:
- source_word: מַשָּׂא
  choice: 宣告
  rationale: 在先知书标题中常指从上帝而来的庄严信息或预言性宣告；“宣告”自然、清楚，又不把该词限定为“重担”。
- source_word: גֵּיא חִזָּיוֹן
  choice: 异象谷
  rationale: 按希伯来语属格结构直译，保留其诗性称谓及所指对象的含混，不在正文中直接解释为耶路撒冷。
- source_word: מַה לָּךְ אֵפוֹא
  choice: 你究竟怎么了
  rationale: מַה לָּךְ 是询问发生何事的习语；אֵפוֹא 在这里加强反问语气，“究竟”比机械译作“现在”更符合现代汉语。
- source_word: כִּי
  choice: 竟
  rationale: 这里引出令发问者惊讶的情形。汉语用“竟”能自然衔接反问，并传达语境中的诧异，而不必硬译为“因为”或“以致”。
- source_word: עָלִית כֻּלָּךְ
  choice: 全都上了
  rationale: 动词与后缀在形式上以阴性单数称呼被人格化的城市，而“全都”体现其居民整体行动的集合意义。
- source_word: לַגַּגּוֹת
  choice: 屋顶
  rationale: 指古代房屋可供人登上的平屋顶；现代汉语以“屋顶”简洁自然地表达复数场景。
theological_decisions:
- issue: “异象谷”的所指
  choice: 正文保留字面称谓，不直接认定地点
  alternative: 明确译作或解释为耶路撒冷
  rationale: 本节希伯来文本没有明说其所指；虽很可能是耶路撒冷的诗性称呼，但将这一判断放在脚注中，可避免正文消除原有含混。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“你”按希伯来语阴性单数指向被人格化的城市，“全都”则自然涵盖城中居民。
