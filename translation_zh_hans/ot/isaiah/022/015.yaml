base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/015.yaml
  text: 'Thus says the Lord Yahweh of hosts: Go[a], come to this steward, to Shebna[b], who is over the house:'
translation:
  language: zh_hans
  text: 主万军之耶和华如此说：“你去，到这位总管舍伯那里去；他掌管王宫：”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告常用的使者公式及其庄重语气。
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: 主万军之耶和华
  rationale: 分别体现 אֲדֹנָי（主）、神名 יהוה（耶和华）和 צְבָאוֹת（万军）；这一语序也符合现代中文圣经语体。
- source_word: לֶךְ בֹּא
  choice: 你去，进到
  rationale: 保留原文相连的两个命令式，不把它们完全合并；脚注说明二者也可作为一个组合表达来理解。
- source_word: הַסֹּכֵן הַזֶּה
  choice: 这个管家
  rationale: סֹכֵן 指受托管理事务的官员；结合下文其掌管王宫的身份，“管家”既简洁，又能表达受托治理之意。“这个”保留原文近指词及语境中可能带有的轻蔑色彩。
- source_word: עַל שֶׁבְנָא
  choice: 舍伯那那里
  rationale: 这里的介词短语在语境中指向并进一步确认该官员就是舍伯那，不译成带敌对意味的“攻击舍伯那”。
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: 他掌管王宫
  rationale: 原文直译为“在这家之上”，是宫廷职衔用语；“掌管王宫”以自然中文表达其高级宫廷行政职务。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主……耶和华
  alternative: 主上帝；主雅威
  rationale: “耶和华”明确保留 יהוה 是神名这一点，同时用“主”对应 אֲדֹנָי；不将二者合并，也不使“主”重复。
- issue: צְבָאוֹת 在神圣称号中的范围
  choice: 万军
  alternative: 众军；军队
  rationale: “万军”保留该称号涵盖天上与地上众军的宽广含义，不将其限定为人间军队。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“主万军之耶和华如此说”保留先知宣告的节奏；正文保留“去，进到”略显突兀的双重命令，以反映希伯来文形式，并用脚注交代其惯用语可能性。分号帮助读者辨明“舍伯那”与其职衔之间的关系，同时保留经文在下一节继续发言的开放结构。
