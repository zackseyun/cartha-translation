  to: 主万军之耶和华如此说：“你去，到这位总管舍伯那里去；他掌管王宫：”
  rationale: 将“管家”改为“总管”，以准确表达舍伯那作为宫廷高级官员的身份；调整命令语序，使中文更自然，并保留原文两个命令式的效果。同步修正脚注b对“家”的字面说明。神名与“万军”的既有译法可保留。
