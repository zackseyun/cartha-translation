  text: צָנ֤וֹף יִצְנָפְ/ךָ֙ צְנֵפָ֔ה כַּדּ֕וּר אֶל אֶ֖רֶץ רַחֲבַ֣ת יָדָ֑יִם שָׁ֣מָּ/ה תָמ֗וּת וְ/שָׁ֨מָּ/ה֙ מַרְכְּב֣וֹת כְּבוֹדֶ֔/ךָ קְל֖וֹן בֵּ֥ית אֲדֹנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/018.yaml
  text: He will surely wrap you up tightly[a], like a ball, into a broad land. There you will die, and there will be the chariots of your glory[c][b], O shame of your master's house.
translation:
  language: zh_hans
  text: 他必把你紧紧卷起[a]，如同球一样，送往一片宽阔之地[b]。你必死在那里；那里将有你引以为荣的战车[c]。你这使主人家蒙羞的人啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把你紧紧缠裹起来”或“把你紧紧滚卷起来”。希伯来文以同一词根的强化结构并配合同根名词，着重强调这个动作。
    reason: lexical_alternative
  - marker: b
    text: 直译：“到一片双手宽广之地”；这是指宽广、辽阔之地的习语。
    reason: cultural_note
  - marker: c
    text: 或译：“你华美的战车”或“曾是你荣耀的战车”。这句话可能指他所夸耀的战车。
    reason: lexical_alternative
lexical_decisions:
- source_word: צָנוֹף יִצְנָפְךָ צְנֵפָה
  choice: 他必把你紧紧卷起
  rationale: 同根词的强化结构强调卷裹、缠紧的动作；“紧紧卷起”在现代汉语中自然，并保留具体方式上的一定开放性。
- source_word: כַּדּוּר
  choice: 像球一样
  rationale: 该比喻把受审判者描绘成卷成球状之物；“球”简明自然。
- source_word: אֶל אֶרֶץ רַחֲבַת יָדָיִם
  choice: 送到一片宽阔之地
  rationale: “双手宽阔之地”是表示地域辽阔的习语。“宽阔之地”保留其空间意象；“送到”补足汉语中方向表达的需要，但不另增一个明确的“投掷”动作。
- source_word: שָׁמָּה ... וְשָׁמָּה
  choice: 在那里……也必留在那里
  rationale: 保留原文地点副词的重复及其强调作用；第二处依上下文用“留”使战车与该地的关系在汉语中完整。
- source_word: תָמוּת
  choice: 你必死
  rationale: “必”传达先知宣告的确定性，措辞直接庄重。
- source_word: מַרְכְּבוֹת כְּבוֹדֶךָ
  choice: 你引以为荣的战车
  rationale: 该压缩的属格结构可指华美的战车，也可指当事人以之为荣的战车；正文采用自然汉语表达其最可能的关系，同时以脚注保留另一可能。
- source_word: קְלוֹן בֵּית אֲדֹנֶיךָ
  choice: 你这使主人家蒙羞的人啊
  rationale: 按同位呼语理解，是对官员的直接斥责。“主人”指其人间上级；此译比“主人家的羞耻”更符合现代汉语，却保留谴责力度。
