  to: 他必把你紧紧卷起[a]，如同球一样，送往一片宽阔之地[b]。你必死在那里；那里将有你引以为荣的战车[c]。你这使主人家蒙羞的人啊！
  rationale: 修订仅消除后半句“留在那里”所增加的持续、留存含义，恢复原文地点副词重复及省略“有”的简练表述；首句作轻微语序调整以提升现代汉语连贯性，且不添加原文未明说的独立“抛掷”动作。脚注b将“宽阔”改为“宽广”，使直译说明更准确自然。
