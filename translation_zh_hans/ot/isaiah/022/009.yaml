  text: וְ/אֵ֨ת בְּקִיעֵ֧י עִיר דָּוִ֛ד רְאִיתֶ֖ם כִּי רָ֑בּוּ וַֽ/תְּקַבְּצ֔וּ אֶת מֵ֥י הַ/בְּרֵכָ֖ה הַ/תַּחְתּוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/009.yaml
  text: You saw that the breaches of the city of David were many[a], and you collected the waters of the lower pool.
translation:
  language: zh_hans
  text: 你们看见大卫城的裂口很多，就把下池的水汇集起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּקִיעֵי
  choice: 裂口
  rationale: 该词指墙体或建筑上的破口、缺口；在城防语境中，“裂口”自然地表达城墙防御工事受损形成的开口。
- source_word: עִיר דָּוִד
  choice: 大卫城
  rationale: 保留这一固定历史地名；现代汉语通常称“大卫城”。
- source_word: רְאִיתֶם
  choice: 你们看见
  rationale: 忠实对应ראה的基本义，并可自然涵盖察看、注意到城墙状况之意。
- source_word: כִּי רָבּוּ
  choice: 很多
  rationale: כִּי在此引出所看见的内容，רָבּוּ表示数量众多；汉语用“看见……很多”简洁自然。
- source_word: וַתְּקַבְּצוּ
  choice: 就……汇集起来
  rationale: קבץ意为聚集、收集；以水为宾语时，“汇集”既贴近原义，也符合水利语境。叙事形式承接前句，译作“就”表达行动次序。
- source_word: מֵי הַבְּרֵכָה הַתַּחְתּוֹנָה
  choice: 下池的水
  rationale: בְּרֵכָה可指水池或蓄水池；“下池”简洁保留该设施的方位名称，מֵי在汉语中自然译为单数集合概念“水”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“裂口”体现城防背景；“下池”保留地名式表达。原文没有需要以脚注处理的实质歧义；英语咨询层所附脚注内容实际涉及后半句“水池/蓄水池”的词义，而非其正文标记所在的“很多”，因此未沿用该错置标记。
