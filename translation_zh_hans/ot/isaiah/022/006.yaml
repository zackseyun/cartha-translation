  text: וְ/עֵילָם֙ נָשָׂ֣א אַשְׁפָּ֔ה בְּ/רֶ֥כֶב אָדָ֖ם פָּֽרָשִׁ֑ים וְ/קִ֥יר עֵרָ֖ה מָגֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/006.yaml
  text: And Elam bore the quiver with chariots and horsemen[b][a], and Kir uncovered the shield.
translation:
  language: zh_hans
  text: 以拦携带箭袋，带着战车、战士和骑兵[a]；吉珥亮出盾牌[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文对部队的列举十分紧缩，也可译作“带着载有战士和骑兵的战车”，或“乘着战车，同战士和骑兵一起”。“战车”“人”和“骑兵”之间的确切关系不十分明确。
    reason: lexical_alternative
  - marker: b
    text: 或译“揭开盾牌”或“使盾牌露出”；可能指除去盾牌的遮盖，预备作战。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵילָם
  choice: 以拦
  rationale: 这是地名或族名，采用现代中文圣经中通行的音译。
- source_word: נָשָׂא
  choice: 背起
  rationale: 该动词可表示拿起、携带；与“箭袋”搭配时，“背起”自然地呈现出军队携装备出战的动作。
- source_word: אַשְׁפָּה
  choice: 箭袋
  rationale: 指盛放箭的袋或箭囊；“箭袋”是现代中文清楚而常用的说法。
- source_word: בְּרֶכֶב אָדָם פָּרָשִׁים
  choice: 随同载人的战车和骑兵
  rationale: 原文是高度压缩的军队列举，בְּ可表达伴随关系，אָדָם与“战车”的确切句法关系并不完全清楚。正文以“载人的战车”体现אָדָם，又用脚注保留其他可能理解。
- source_word: אָדָם
  choice: 人（在“载人的战车”中）
  rationale: 在军队语境中按普通名词理解为人或战士，不视为专名；将其与“战车”相联，避免误列成与战车、骑兵并列的第三类兵力。
- source_word: פָּרָשִׁים
  choice: 骑兵
  rationale: 指骑马者或骑兵；中文军事语境中“骑兵”比“骑马的人”更凝练自然。
- source_word: קִיר
  choice: 吉珥
  rationale: 这是地名或族名，采用现代中文圣经中通行的音译。
- source_word: עֵרָה
  choice: 使……露出
  rationale: 该动词的基本意象是使之裸露、揭开；此译保留原文意象，而不直接改写为“准备作战”。
- source_word: מָגֵן
  choice: 盾牌
  rationale: 原文为单数，可作集合或代表性用法；中文用无定数形式“盾牌”即可自然保留这一点。
