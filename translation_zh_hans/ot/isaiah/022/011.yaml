id: ISA.22.11
reference: Isaiah 22:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מִקְוָ֣ה עֲשִׂיתֶ֗ם בֵּ֚ין הַ/חֹ֣מֹתַ֔יִם לְ/מֵ֖י הַ/בְּרֵכָ֣ה הַ/יְשָׁנָ֑ה וְ/לֹ֤א הִבַּטְתֶּם֙ אֶל עֹשֶׂ֔י/הָ וְ/יֹצְרָ֥/הּ מֵֽ/רָח֖וֹק לֹ֥א רְאִיתֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/011.yaml
  text: You made a reservoir between the two walls for the waters of the old pool[a], but you did not look to the one who made it, nor did you see the one who formed it long ago.
translation:
  language: zh_hans
  text: 你们在两道城墙之间修造蓄水池，用来汇集旧池的水；可是，你们没有仰望那位造它的，也没有看见那位在久远以前[a]塑造它的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从远处”。希伯来语可指空间上的遥远；在这里也可理解为时间上的久远。
    reason: 保留 מֵרָחוֹק 的空间义与时间义之间的真实歧义。
lexical_decisions:
- source_word: מִקְוָה
  choice: 蓄水池
  rationale: 此处处于城防与供水工程的语境，指人工修造、汇集水的设施；“蓄水池”比抽象的“聚集处”更清楚，也与后面的“旧池”有所区别。
- source_word: בֵּין הַחֹמֹתַיִם
  choice: 在两道城墙之间
  rationale: הַחֹמֹתַיִם 是双数形式，明确保留“两道”城墙的含义。
- source_word: לְמֵי הַבְּרֵכָה הַיְשָׁנָה
  choice: 用来汇集旧池的水
  rationale: 介词 לְ 表明蓄水设施与旧池之水的用途或关系；中文增用“汇集”使工程关系自然清楚，而“旧池”保留 בְּרֵכָה 与前面 מִקְוָה 的词语区别。
- source_word: הִבַּטְתֶּם אֶל
  choice: 仰望
  rationale: 该表达不只是肉眼朝向，也含有转向、倚赖和重视的意味；“仰望”在此能保留身体意象及关系层面的含义。
- source_word: עֹשֶׂיהָ
  choice: 那位造它的
  rationale: 保留阴性单数后缀所表达的“它”，不擅自限定为城、池或整个供水防御体系；“那位”依上下文自然指向上帝。
- source_word: יֹצְרָהּ
  choice: 那位……塑造它的
  rationale: “塑造”传达 יצר 所含有的有意塑形、安排之意，并与较一般的“造”形成适度区别。
- source_word: מֵרָחוֹק
  choice: 在久远以前
  rationale: 在先知性语境中可表示时间上的久远，指上帝早已作成或筹定；同时以脚注保留空间意义“从远处”。
- source_word: לֹא רְאִיתֶם
  choice: 没有看见
  rationale: 直译“看见”可与前句“仰望”构成视觉意象的平行，也让上下文自然显出未曾认识、留意上帝的责备。
theological_decisions:
- issue: “造它的”和“塑造它的”所造之物具体指什么
  choice: 译作“它”，不明确限定其所指；“那位”按语境指上帝。
  alternative: 把“它”明确译为耶路撒冷、蓄水池，或整个城防供水体系。
  rationale: 希伯来文使用阴性单数后缀，具体先行词并不完全明确。上下文的神学重点是百姓倚靠防御工程，却不转向掌管并塑造这一切的上帝；保留“它”可避免过度释义。
- issue: מֵרָחוֹק 表示时间还是空间
  choice: 正文采用时间义“在久远以前”。
  alternative: 译作空间义“从远处”。
  rationale: 时间义契合上帝早已塑造、筹定的先知性表达，但原词也可指空间距离，因此以脚注保留另一可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“修造蓄水池”符合工程语境；“仰望—看见”保留原文的平行视觉意象。代词“它”刻意不具体化，以保存原文所指的含混。
