  text: כִּ֣י יוֹם֩ מְהוּמָ֨ה וּ/מְבוּסָ֜ה וּ/מְבוּכָ֗ה לַֽ/אדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בְּ/גֵ֣יא חִזָּי֑וֹן מְקַרְקַ֥ר קִ֖ר וְ/שׁ֥וֹעַ אֶל הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/005.yaml
  text: For it is a day of tumult and trampling and confusion from the Lord GOD of Armies in the Valley of Vision[c][b][a], a battering down of the wall and a cry to the mountain.
translation:
  language: zh_hans
  text: 因为这是出于主雅威—万军之主的[a]喧嚷、践踏和混乱之日；在“异象谷”中，有拆毁城墙[b]，有朝向山的呼喊[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是归于主雅威—万军之主的日子”或“这是属于主雅威—万军之主的日子”。希伯来语介词既可表示来源，也可表示关系或归属。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译近于“拆毁城墙”；这里的动词形式较难确定，也可译作“击垮城墙”或“毁坏城墙”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“向山呼喊。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先知的哀叹说明缘由；现代汉语中“因为”能自然体现这一解释关系。
- source_word: יוֹם מְהוּמָה וּמְבוּסָה וּמְבוּכָה
  choice: 喧嚷、践踏和混乱的日子
  rationale: 保留三个并列灾难名词及其递进效果。“喧嚷”突出嘈杂动乱，“践踏”保留词根的具体意象，“混乱”表达判断临到时的失序和惶惑。
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: 是从主雅威—万军之主而来的
  rationale: 将 ל 理解为灾难之日的来源，但以脚注保留其关系或归属义。“主雅威”分别表达 אֲדֹנָי 与神名 יְהוִה，“万军之主”自然传达 צְבָאוֹת 所指的天上与地上众军。
- source_word: בְּגֵיא חִזָּיוֹן
  choice: 在“异象谷”中
  rationale: 按字面保留这一具有名称性质的地点称呼；引号表明它是特殊称谓，而非普通地形描写。
- source_word: מְקַרְקַר קִיר
  choice: 城墙遭到拆毁
  rationale: 该动词形式疑难，但语境明显涉及对墙体的破坏。采用被动表达，避免为希伯来文未明说的施事者作出判断。
- source_word: וְשׁוֹעַ אֶל־הָהָר
  choice: 呼喊声传向山上
  rationale: 保留呼喊与朝向山地的意象，同时使汉语表达自然；脚注说明也可理解为直接“向山呼喊”。
theological_decisions:
- issue: 神名 יְהוָה 及复合称号 אֲדֹנָי יְהוִה צְבָאוֹת 的译法
  choice: 主雅威—万军之主
  alternative: 主耶和华—万军之上帝；主耶和华—万军之主
  rationale: “雅威”以音译保留盟约神名，避免把专名完全改作称号；“主”对应 אֲדֹנָי，“万军之主”则以现代汉语表达 צְבָאוֹת 的统领含义。
- issue: לַאדֹנָי 所表达的关系
  choice: 从主雅威—万军之主而来
  alternative: 归于主雅威—万军之主；属于主雅威—万军之主
  rationale: 审判语境支持来源或施事含义，但介词 ל 本身也可表达关系或归属，因此正文采用语境上较顺畅的来源义，并以脚注保留歧义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留先知诗句中三个灾难名词的并列结构和“异象谷”的名称性意象；对疑难动词和介词不作过度确定，以正文加脚注呈现真实歧义。
