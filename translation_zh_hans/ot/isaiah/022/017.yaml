  text: הִנֵּ֤ה יְהוָה֙ מְטַלְטֶלְ/ךָ֔ טַלְטֵלָ֖ה גָּ֑בֶר וְ/עֹטְ/ךָ֖ עָטֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/017.yaml
  text: Look[a], Yahweh is about to hurl you away violently, O man, and wrap you up tightly.
translation:
  language: zh_hans
  text: 看哪[a]，耶和华必猛烈地把你抛出去，你这人哪，并把你紧紧裹住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，耶和华必猛烈地抛掷你，强壮的人哪。”希伯来文十分紧凑，含义较难确定；“人”也可理解为“强壮的人”，并且未必作呼语。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 引出强调性的宣告，保留指示和唤起注意的作用，同时符合庄重而易懂的现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名形式译出四字神名，不以头衔代替。
- source_word: מְטַלְטֶלְךָ טַלְטֵלָה
  choice: 必猛烈地把你抛出去
  rationale: 动词与同根名词构成强调结构，表达剧烈抛掷；用“猛烈地”吸收同源宾语的加强语气。“必”配合先知性宣告，表达迫近而确定的行动。
- source_word: גָּבֶר
  choice: 壮汉哪
  rationale: 保留该词可含“强壮男子”的意味，并按呼语理解；由于句法紧凑且有歧义，另一种分析收入脚注。
- source_word: וְעֹטְךָ עָטֹה
  choice: 并把你紧紧裹住
  rationale: עטה取“包裹、裹住”义；不定式绝对式加强有限动词，以“紧紧”自然体现强调。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经传统中最通行、最易识别的神名形式，同时明确按专名而非“主”这一头衔翻译。
- issue: גָּבֶר 的句法功能
  choice: 按呼语译作“壮汉哪”
  alternative: 按句中成分理解为“像壮汉一样”或仅作“人”
  rationale: 希伯来文极为紧凑，呼语读法语意通顺，也保留对舍伯那带有反讽可能的称呼；但不将此分析绝对化，脚注注明其他可能。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留先知宣告的强调色彩；“猛烈地把你抛出去”与“紧紧裹住”呈现原文两个加强结构。正文保留 גָּבֶר 的解释张力，并用脚注说明句法歧义。
