  yaml_path: translation/ot/isaiah/022/019.yaml
  text: And I will thrust you from your office[a], and he will pull you down from your station.
translation:
  language: zh_hans
  text: 我要把你从你的职位上赶走；他要把你从你的岗位上拉下来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文从“我要把你……赶走”转为“他要把你……拉下来”。有些译本把第二句顺译为“我也要把你拉下来”。
    reason: 说明原文显著的人称转换及常见的协调译法。
lexical_decisions:
- source_word: וַהֲדַפְתִּיךָ
  choice: 我要把你……赶走
  rationale: הדף表示用力推开、驱逐。这里是预言语境，完成式带将来意义；“赶走”自然地表达强制罢黜，同时保留施力驱逐的意味。
- source_word: מִמַּצָּבֶךָ
  choice: 从职位上
  rationale: מַצָּב可指所站之处、职守或官位。上下文涉及舍伯那被撤职，“职位”明确表达其官职身份。
- source_word: וּמִמַּעֲמָדְךָ
  choice: 从你的岗位上
  rationale: מַעֲמָד指站立之处、地位或任职之所。“岗位”既与“职位”形成平行，又避免完全重复，并保留其任职位置的意象。
- source_word: יֶהֶרְסֶךָ
  choice: 他也要把你……推下去
  rationale: הרס通常表示拆毁、推倒。以人为宾语时，此处比喻其被罢黜、失去地位；“推下去”保留向下推倒的形象，并照原文保留第三人称单数主语“他”。
theological_decisions:
- issue: 第二分句的主语人称转换
  choice: 保留原文从第一人称“我”转为第三人称阳性单数“他”
  alternative: 将两句统一为第一人称：“我要把你……赶走，也要把你……推下去”；或译成无人称被动句
  rationale: 马所拉文本清楚呈现人称转换，却未明确说明“他”所指是谁。保留这一转换，避免把可能指上帝自称转换或受其支配的不定施事者擅自确定下来。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“职位／岗位”体现两个近义名词的平行关系；“赶走／推下去”保留两个动词不同的力度与意象。脚注标记置于整节末尾，所注内容涉及两分句之间的人称转换。
