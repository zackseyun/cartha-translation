  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/קָרָ֣אתִי לְ/עַבְדִּ֔/י לְ/אֶלְיָקִ֖ים בֶּן חִלְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/020.yaml
  text: And it shall happen on that day that I will call my servant Eliakim son of Hilkiah,[a]
translation:
  language: zh_hans
  text: 到那日，我必召来我的仆人希勒家的儿子以利亚敬。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“呼召”。希伯来语这个动词在此也可含有召人接受任命或差遣的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的未来时间表达。现代汉语用“到那日”自然、庄重，也保留了预言性的时间框架；不另译“事情将会发生”，以免中文冗赘。
- source_word: וְקָרָאתִי
  choice: 我必召来
  rationale: קרא 与介词 ל 连用，在此可指呼召或召来某人接受任命。“召来”贴合语境中的委任行动，同时脚注保留“呼召”的可能译法。
- source_word: לְעַבְדִּי
  choice: 我的仆人
  rationale: עבד 可指奴仆或仆人；此处是上帝对受委任者的称谓，“我的仆人”既符合宫廷和先知语境，也不突出文本并未强调的奴隶身份。
- source_word: אֶלְיָקִים
  choice: 以利亚敬
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: בֶּן חִלְקִיָּהוּ
  choice: 希勒家的儿子
  rationale: 按希伯来语父系称谓直译，并采用通行中文专名“希勒家”。
theological_decisions:
- issue: 以利亚敬作为上帝所委任之人的称谓
  choice: 我的仆人
  alternative: 我的奴仆
  rationale: 该短语表明以利亚敬隶属并受命于上帝，但本节本身不要求加入后来的弥赛亚或预表解释。“仆人”保留委任和归属含义，又不过度强调社会奴役身份。
- issue: קרא 的委任色彩
  choice: 召来
  alternative: 呼召
  rationale: 上下文涉及撤换并委任官员；“召来”保留具体召见的动作，而不直接把任命本身写入译文，以免消除原文动词的语义宽度。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“到那日，我必……”保留先知宣告的语气；专名沿用中文圣经通行译法。
