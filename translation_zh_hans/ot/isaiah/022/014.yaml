  to: 万军之耶和华向我耳中启示说：“这罪孽直到你们死，也绝不能为你们得蒙赎除。”这是主耶和华——万军之主说的。
  rationale: 删除无对应的“亲自”，并以较自然的中文保留“向我耳中”这一原文意象。将“赎除”调整为“得蒙赎除”，以体现原文被动语态及 כפר 的赎罪意义；仍保留“直到你们死”的原有时间表达，不扩大为关于死后结局的断言。
