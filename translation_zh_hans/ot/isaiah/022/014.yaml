base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/014.yaml
  text: 'And the LORD of Armies has revealed in my ears: “Surely this iniquity will not be atoned for you until you die,” says the Lord GOD of Armies.'
translation:
  language: zh_hans
  text: 万军之耶和华向我耳中启示说：“这罪孽直到你们死，也绝不能为你们得蒙赎除。”这是主耶和华——万军之主说的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִגְלָה בְאָזְנָי
  choice: 亲自在我耳中启示
  rationale: 保留“在我耳中”的具体意象；用“启示”表达 נִגְלָה 的被动显明含义，“亲自”使中文清楚传达启示来自耶和华，而非普通听闻。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: צְבָאוֹת 译为“万军”，保留其统帅天上与地上众军的传统称号；专名 יהוה 译作“耶和华”。
- source_word: אִם יְכֻפַּר
  choice: 绝不能……赎除
  rationale: 此处 אִם 用于否定誓言，语气为“断然不会”；כפר 的被动式涉及赎罪或除罪，不仅是主观宽恕，因此采用“赎除”。
- source_word: לָכֶם
  choice: 为你们
  rationale: 明确保留原文的受益者或相关对象，不把该成分省略。
- source_word: עַד תְּמֻתוּן
  choice: 直到你们死
  rationale: 直译时间界限，不擅自断定死亡之后是否仍有任何可能。
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: 主耶和华——万军之主
  rationale: 同时体现 אֲדֹנָי 与 יהוה，并以“万军之主”自然表达完整称号；破折号有助于现代中文朗读和辨识。
theological_decisions:
- issue: “直到你们死”是否暗示死后可获赎除
  choice: 保留原文的时间表达，不加解释
  alternative: 译成“你们至死也永不得赦免”或明确扩展为永恒定罪
  rationale: 原文本身强调该罪直到死亡都不被赎除；译文不应把潜在含义扩展成经文未明说的系统神学结论。
- issue: כפר 的表达
  choice: 赎除
  alternative: 赦免
  rationale: “赦免”较自然，却容易只表达免罪；“赎除”更能保留 כפר 所含的赎罪、除罪色彩。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。保留“在我耳中”的先知领受意象，并以直接引语呈现神谕；避免古奥的“断不得”等旧式说法，同时维持严厉、宣告性的语气。
