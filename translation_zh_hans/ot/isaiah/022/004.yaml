  text: עַל כֵּ֥ן אָמַ֛רְתִּי שְׁע֥וּ מִ/נִּ֖י אֲמָרֵ֣ר בַּ/בֶּ֑כִי אַל תָּאִ֣יצוּ לְ/נַֽחֲמֵ֔/נִי עַל שֹׁ֖ד בַּת עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/004.yaml
  text: Therefore I said[a], “Look away from me; let me weep bitterly[b]. Do not labor to comfort me over the destruction of the daughter of my people.”
translation:
  language: zh_hans
  text: 因此我说：“你们转过脸去，容我痛哭[a]！不要急着因我民之女所遭的毁灭来安慰我[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “容我痛哭”也可译作“让我在哭泣中尝尽苦楚”。原文把“苦”与“哭泣”连在一起，强调哀恸之深。
    reason: lexical_alternative
  - marker: b
    text: “我民之女”是先知文学中的诗性说法，把说话者的百姓人格化为一位女子。
    reason: cultural_note
lexical_decisions:
- source_word: שְׁעוּ מִנִּי
  choice: 你们转过脸去
  rationale: שְׁעוּ在此是复数命令式，语境要求旁人转开目光、让哀哭者独处；“转过脸去”既保留视觉意味，也符合现代汉语表达。
- source_word: אֲמָרֵר בַּבֶּכִי
  choice: 容我痛哭
  rationale: אֲמָרֵר表达在哭泣中承受或流露深切苦楚；“痛哭”自然地合并了“苦楚”与“哭泣”的语义，“容我”传达此处近似意愿式的语气。
- source_word: אַל תָּאִיצוּ לְנַחֲמֵנִי
  choice: 不要硬要安慰我
  rationale: תָּאִיצוּ可指催逼、强求或急切促成；在拒绝安慰的语境中，“硬要”比单纯的“急着”更清楚地表达不顾对方意愿而坚持安慰。
- source_word: שֹׁד
  choice: 毁灭
  rationale: 该词指暴力造成的摧毁、劫掠或灾难性破坏；“毁灭”保留其广泛而强烈的灾祸含义，不将所指限缩为掳掠。
- source_word: בַּת עַמִּי
  choice: 我民之女
  rationale: 直译并保留先知文学中把群体人格化为女子的诗性称谓；脚注解释其功能，避免正文将其过早限定为耶路撒冷或犹大。
theological_decisions:
- issue: בַּת עַמִּי应保留诗性人格化称谓，还是直接解释为百姓、锡安或耶路撒冷
  choice: 正文保留“我民之女”
  alternative: 译作“我的百姓”或按语境解释为“锡安女子／耶路撒冷”
  rationale: 原文明确使用“我民之女”，本节本身没有直接点名锡安或耶路撒冷。保留这一称谓可维护其文学张力和情感力量，也避免加入经文未明说的狭义身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“转过脸去”“容我痛哭”“不要硬要安慰我”便于普通读者理解；保留“我民之女”这一略带诗性的结构，以呈现原文意象，并用脚注说明。
