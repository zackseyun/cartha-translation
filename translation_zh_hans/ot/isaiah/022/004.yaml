  naturalness: “转过脸去”“容我痛哭”可理解，语体也适合本段哀歌；但“我民之女遭了毁灭”略生硬。改为“因我民之女所遭的毁灭来安慰我”能更清楚、自然地表达哀伤的缘由。
  terminology: “我民之女”恰当地保留了בַּת עַמִּי的修辞意象，未擅自限定为锡安或耶路撒冷。“毁灭”可涵盖שֹׁד所指的暴力破坏。“不要急着……安慰我”较贴近תָּאִיצוּ所含催促、急切之意，也避免“硬要”的额外强制意味。
