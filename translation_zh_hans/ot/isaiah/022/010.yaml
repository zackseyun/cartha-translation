  text: וְ/אֶת בָּתֵּ֥י יְרוּשָׁלִַ֖ם סְפַרְתֶּ֑ם וַ/תִּתְֿצוּ֙ הַ/בָּ֣תִּ֔ים לְ/בַצֵּ֖ר הַ/חוֹמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/010.yaml
  text: And you counted the houses of Jerusalem[b][a], and you tore down the houses to fortify the wall.
translation:
  language: zh_hans
  text: 你们数点了耶路撒冷的房屋[a]，又拆毁房屋[b]，用来加固城墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “数点”也可译作“清点”。
    reason: lexical_alternative
  - marker: b
    text: “拆毁”也可译作“拆除”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: 你们……了
  rationale: אֵת在此标示前置宾语，וְ承接上文；汉语无需另译宾语标记，而以顺畅的并列语流表达。
- source_word: בָּתֵּי יְרוּשָׁלִַם
  choice: 耶路撒冷的房屋
  rationale: 按构造链直译，指城内已知的一批房屋；“房屋”庄重而自然。
- source_word: סְפַרְתֶּם
  choice: 数点了
  rationale: ספר的基本义是“数、点数”；“数点”既准确，也适合城防筹备的语境。
- source_word: וַ/תִּתְֿצוּ
  choice: 又拆毁
  rationale: נתץ指拆下、毁坏建筑物；“拆毁”兼顾有意拆除和破坏的含义。
- source_word: הַ/בָּתִּים
  choice: 房屋
  rationale: 保留原文对“房屋”的重复，表明所拆的正是前述城中房屋；汉语在此不必机械加入定指词。
- source_word: לְ/בַצֵּר
  choice: 用来加固
  rationale: בצר在此指使防御工事坚固；目的结构译作“用来加固”自然清楚。
- source_word: הַ/חוֹמָה
  choice: 城墙
  rationale: חוֹמָה本义为墙，此处明确指耶路撒冷的防御墙；“城墙”在汉语中准确呈现场景。
