base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/007.yaml
  text: For Egypt’s help is utterly empty and worthless[a]; therefore I call her[b], “Rahab Who Sits Still.”
translation:
  language: zh_hans
  text: 埃及的帮助毫无用处，完全徒然；因此，我称她为“坐着不动的拉哈伯”[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉哈伯”是埃及的诗性称号，也可使人联想到“狂傲”或“夸口”。
    reason: lexical_alternative
  - marker: b
    text: 原文十分凝缩，也可理解为“拉哈伯——他们坐着不动”，或“无所作为的夸口者”；这是在讥讽埃及骄傲自夸，却不采取行动。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִצְרַיִם
  choice: 埃及的
  rationale: 连词在此承接上文并引出理由；汉语以“埃及的帮助”自然表达埃及所提供的援助。
- source_word: הֶבֶל וָרִיק
  choice: 虚空徒然
  rationale: 两个近义词叠用，强调埃及的援助毫无实效；“虚空徒然”既保留强化结构，也符合庄重的现代汉语。
- source_word: יַעְזֹרוּ
  choice: 帮助
  rationale: 原文是复数动词“帮助”，可能以埃及为集合体；名词化为“埃及的帮助”能在汉语中自然传达该句的谓语关系。
- source_word: לָכֵן
  choice: 因此
  rationale: 明确保留由埃及援助无用而引出的结论。
- source_word: קָרָאתִי לָזֹאת
  choice: 我称她为
  rationale: 阴性指示词指向被拟人化的埃及；“她”保留这种拟人手法，“称……为”适合先知所起的讽刺性称号。
- source_word: רַהַב
  choice: 拉哈伯
  rationale: 这里像是埃及的诗性别称，同时带有狂傲、夸口的语义联想；正文音译以保留名称功能，脚注说明其含义。
- source_word: הֵם שָׁבֶת
  choice: 坐着不动的
  rationale: 这句高度凝缩且语法特殊，通常理解为讥讽埃及徒有声势却无所行动；译文保留“坐着不动”的具体意象，不把含义抽象化为单纯“无能”。
theological_decisions:
- issue: 如何处理讽刺性称号 רַהַב הֵם שָׁבֶת
  choice: 译作“坐着不动的拉哈伯”
  alternative: “拉哈伯——他们坐着不动”或“无所作为的夸口者”
  rationale: 本句以诗性讽刺揭露埃及的骄矜与无用。正文保留“拉哈伯”作为名称及“坐着不动”的形象，同时在脚注中呈现原文数与结构上的歧义，避免把一种解释定为唯一可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“虚空徒然”保留原文近义词叠加的力度；称号部分维持诗性和讽刺感，并以脚注交代难解希伯来语的其他可能读法。
