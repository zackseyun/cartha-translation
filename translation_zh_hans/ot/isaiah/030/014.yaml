language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ֠/שְׁבָרָ/הּ כְּ/שֵׁ֨בֶר נֵ֧בֶל יוֹצְרִ֛ים כָּת֖וּת לֹ֣א יַחְמֹ֑ל וְ/לֹֽא יִמָּצֵ֤א בִ/מְכִתָּת/וֹ֙ חֶ֔רֶשׂ לַ/חְתּ֥וֹת אֵשׁ֙ מִ/יָּק֔וּד וְ/לַ/חְשֹׂ֥ף מַ֖יִם מִ/גֶּֽבֶא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/014.yaml
  text: and its breaking is like the breaking of a potter’s jar[a], smashed without pity[b], so that among its shattered pieces not a shard is found with which to take fire from the hearth or to scoop water from a cistern.
translation:
  language: zh_hans
  text: 它必被打碎，如同陶匠的罐子被毫不留情地砸得粉碎；在它的碎片中，甚至找不到一片陶片，可以用来从火堆中取火[a]，或从水池里舀水[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从燃烧之处取火。”希伯来文直译如此；这里的“火”可指炭火或余烬。
    reason: 保留 לַחְתּוֹת אֵשׁ 与 מִיָּקוּד 的字面表达及其具体所指的开放性。
  - marker: b
    text: 或译：“从蓄水池里舀水。”希伯来词可泛指积水之处。
    reason: 保留 גֶּבֶא 可指水池、蓄水池或其他积水处的词义范围。
lexical_decisions:
- source_word: וּשְׁבָרָהּ
  choice: 它必被打碎
  rationale: 按上下文将阴性后缀所指之物作为主语，以被动表达其遭毁坏；既自然，也与后面的陶罐比喻衔接。
- source_word: כְּשֵׁבֶר נֵבֶל יוֹצְרִים
  choice: 如同窑匠的陶罐被砸得粉碎
  rationale: נֵבֶל 指容器或罐，יוֹצְרִים 指制陶者；“窑匠的陶罐”保留具体陶器意象，“被砸得粉碎”传达同根词重复所加强的彻底破裂。
- source_word: כָּתוּת
  choice: 被砸得粉碎
  rationale: 表达猛烈击碎、压碎的结果，并与下文完全没有可用瓦片相呼应。
- source_word: לֹא יַחְמֹל
  choice: 毫不留惜
  rationale: 直义为“不怜惜／不宽容”。“毫不留惜”在毁坏器物的语境中自然，同时保留不予宽待的意味，而不强行补出施事者。
- source_word: בִמְכִתָּתוֹ
  choice: 碎片中
  rationale: 按破碎后的结果理解，简洁表达“在它破碎之物中／碎片之中”。
- source_word: חֶרֶשׂ
  choice: 一块瓦片
  rationale: 指破陶器的残片；“瓦片”是现代汉语中易懂的具体称呼，在此可承载扒炭与舀水的用途。
- source_word: לַחְתּוֹת אֵשׁ
  choice: 扒取炭火
  rationale: 希伯来文直说“取火”，实际动作是用陶片从燃烧处扒取燃烧物；正文用“炭火”使图景自然，脚注保留较直译的可能。
- source_word: מִיָּקוּד
  choice: 从炉中
  rationale: 该词表示燃烧之处；“炉中”在中文里简明自然，并适合扒取炭火的场景。
- source_word: וְלַחְשֹׂף מַיִם
  choice: 舀水
  rationale: 在以陶片取水的具体场景中，“舀水”准确传达动作。
- source_word: מִגֶּבֶא
  choice: 从水池里
  rationale: גֶּבֶא 可指积水处、水池或蓄水坑；正文采用较宽泛的“水池”，避免把并不确定的人工蓄水设施具体化为水窖。
theological_decisions: []
