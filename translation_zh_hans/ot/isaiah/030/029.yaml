  to: 你们必唱歌，如同节期被分别为圣的那一夜[a]；你们心中必欢喜，如同人伴着笛声[b]前往雅威的山，到以色列的磐石那里[c]。
  rationale: 修订消除了节期短语在汉语中的句法歧义，保留原文两个平行的比较结构和节庆行进图景；将乐器改为“伴着笛声”以忠实反映伴随意义；并将四字神名统一为与英文 POB 审校轨迹相应的“雅威”。“到……那里”保留两个连续的趋向表达及“磐石”称号的目的地／敬拜指向，虽稍具庄重色彩，仍属自然可懂的现代书面语。
