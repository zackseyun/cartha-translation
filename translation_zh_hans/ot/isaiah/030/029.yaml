  naturalness: 原文总体庄重流畅，但“分别节期为圣的夜晚”较生硬，“来到……那里”也略显重复。修订后以“节期被分别为圣的那一夜”和“伴着笛声前往”使表达更自然，同时不增加原文未明说的细节。
  terminology: “磐石”适当地保留了 צוּר 的神圣称号和比喻。“雅威”对应原文四字神名及英文 POB 的 Yahweh；“节期”“分别为圣”保留礼仪语域。
