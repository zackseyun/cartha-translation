id: ISA.30.29
reference: Isaiah 30:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/שִּׁיר֙ יִֽהְיֶ֣ה לָ/כֶ֔ם כְּ/לֵ֖יל הִתְקַדֶּשׁ חָ֑ג וְ/שִׂמְחַ֣ת לֵבָ֗ב כַּֽ/הוֹלֵךְ֙ בֶּֽ/חָלִ֔יל לָ/ב֥וֹא בְ/הַר יְהוָ֖ה אֶל צ֥וּר יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/029.yaml
  text: The song will be for you as in the night when a feast is consecrated[a], and gladness of heart as when one goes with the flute to come to the mountain of Yahweh[d][c][b], to the Rock of Israel.
translation:
  language: zh_hans
  text: 你们必唱歌，如同节期被分别为圣的那一夜[a]；你们心中必欢喜，如同人伴着笛声[b]前往雅威的山，到以色列的磐石那里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同守圣节的那一夜。”原文可指节期被分别为圣的夜晚，也可能指守圣节的礼仪背景。
    reason: 保留 הִתְקַדֶּשׁ חָג 的句法与礼仪含义所存的语义空间。
  - marker: b
    text: “笛声”也可译作“笛子”或“管乐器的乐声”。原词指节庆行列中使用的一种吹奏乐器。
    reason: 说明 חָלִיל 的词义范围，并避免断定行进者本人吹奏该乐器。
  - marker: c
    text: “以色列的磐石”是对上帝的称呼，强调他的坚固、力量和庇护。
    reason: 帮助读者识别“磐石”的称号性质，同时不以解释取代正文意象。
lexical_decisions:
- source_word: הַשִּׁיר יִהְיֶה לָכֶם
  choice: 你们必唱歌
  rationale: 直译近于“歌必归你们所有”，这里表达百姓将有歌唱；汉语用“你们必唱歌”自然传达此意，并保留定然发生的语气。
- source_word: כְּלֵיל הִתְקַדֶּשׁ חָג
  choice: 像在分别节期为圣的夜晚
  rationale: כְּ 标示比较；הִתְקַדֶּשׁ 表达被分别为圣或守为圣，חָג 指宗教节期，整体保留礼仪和朝圣背景。
- source_word: וְשִׂמְחַת לֵבָב
  choice: 你们心里必欢喜
  rationale: 将希伯来语名词短语“心中的欢喜”转成自然汉语谓语，同时保持与前句平行。
- source_word: כַּהוֹלֵךְ בֶּחָלִיל
  choice: 像人吹着笛子前往
  rationale: הוֹלֵךְ 是泛指的行进者；חָלִיל 指笛、管一类吹奏乐器。译文呈现伴随乐声行进的节庆队伍景象。
- source_word: בְהַר יְהוָה
  choice: 前往耶和华的山
  rationale: 在运动语境中 בְ 可按目的地译作“前往”；הַר 译为“山”，指向敬拜之地。神名采用现代中文读者熟悉且明确为专名的“耶和华”。
- source_word: אֶל צוּר יִשְׂרָאֵל
  choice: 来到以色列的磐石那里
  rationale: צוּר 是用于上帝的称号和比喻，表达稳固、力量与庇护；补出“那里”使两个趋向表达在现代汉语中衔接自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留为专名而不以“主”替代；“耶和华”是现代中文圣经传统中最通行的形式，“雅威”则更接近常见学术拟音。
- issue: הִתְקַדֶּשׁ חָג 的礼仪含义
  choice: 分别节期为圣
  alternative: 守节期为圣／节期被定为圣
  rationale: 该结构可侧重节期被分别为圣，也可能指人预备并守此圣节。正文不过度限定施事者，脚注保留这一语义弹性。
- issue: צוּר יִשְׂרָאֵל 的神学称号
  choice: 以色列的磐石
  alternative: 以色列之磐石
  rationale: 保留“磐石”这一神圣称号的比喻张力，不解释性改写为“保护者”或“力量”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；用两个“像……”结构保留原文平行比喻。正文避免生硬的“歌必归你们”，但仍保持预言语气和朝圣礼仪图景。
