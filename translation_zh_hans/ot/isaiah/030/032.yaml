source:
  edition: WLC
  text: וְ/הָיָ֗ה כֹּ֤ל מַֽעֲבַר֙ מַטֵּ֣ה מֽוּסָדָ֔ה אֲשֶׁ֨ר יָנִ֤יחַ יְהוָה֙ עָלָ֔י/ו בְּ/תֻפִּ֖ים וּ/בְ/כִנֹּר֑וֹת וּ/בְ/מִלְחֲמ֥וֹת תְּנוּפָ֖ה נִלְחַם ב/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/032.yaml
  text: And every stroke of the appointed rod that Yahweh lays on him will be with tambourines and lyres[b][a]; and with battles of brandishing he will fight against them.
translation:
  language: zh_hans
  text: 耶和华使那命定之杖每次落在他身上时[a]，都伴有手鼓和琴；耶和华要以挥动的战事与他们交战[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “每次落在他身上”也可译作“命定之杖的每一次经过（或划过）”。这句希伯来语较难确定，可能描写杖每一下的击打或挥扫。
    reason: lexical_alternative
  - marker: b
    text: “与他们交战”直译近于“以挥动的战事与她（或它）交战”。原文末尾为阴性单数代词，具体所指不明确；正文按上下文将其理解为受审判的敌方。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כֹּל מַעֲבַר
  choice: 每一次落在……身上
  rationale: מַעֲבַר 本义与“经过、划过”有关；在杖的意象中，译作杖每一次落下，表达连续击打的动作，同时避免生硬直译。
- source_word: מַטֵּה מוּסָדָה
  choice: 命定之杖
  rationale: מַטֵּה 在审判语境中是施罚的“杖”；מוּסָדָה 表示被奠定、确立，语境上指神所定下的惩罚。
- source_word: אֲשֶׁר יָנִיחַ יְהוָה עָלָיו
  choice: 耶和华使……落在他身上
  rationale: יניח 是 נוח 的使役式，表示使杖落下或停在他身上；这里用自然中文呈现施行审判的动作。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中通行而庄重的神名译法。
- source_word: בְּתֻפִּים וּבְכִנֹּרוֹת
  choice: 伴着手鼓和琴声
  rationale: 介词 ב 表伴随；תפים 是手鼓一类打击乐器，כנרות 是弦乐器。加入“声”使中文自然，并显明审判行动与乐声相伴。
- source_word: וּבְמִלְחֲמוֹת תְּנוּפָה
  choice: 挥动兵器……交战
  rationale: תנופה 表示挥动、摆动；希伯来语组合较为晦涩。此译保留挥动的战斗图景，但“兵器”是据军事语境作出的补足，故以脚注说明直译可能。
- source_word: נִלְחַם בָהּ
  choice: 他要……与他们交战
  rationale: 动词主语按上下文理解为耶和华；词尾本为阴性单数，所指不明确，正文依30:31-33对亚述敌军的集体指称译为复数，并在脚注保留形式上的歧义。
theological_decisions:
- issue: 末句主语是谁
  choice: 理解为耶和华
  alternative: 理解为杖或未明说的力量
  rationale: 前半句明确以耶和华为行动者，且上下文描写耶和华攻击亚述；不过希伯来语末句未重述主语。
- issue: 末尾阴性单数代词的所指
  choice: 按上下文译为“他们”，指受审判的敌方
  alternative: 译为“她”或“它”，可能指亚述、战争或某个未明对象
  rationale: בָהּ 的形式确为阴性单数，但先行词不确定。正文以语境求通顺，脚注明确保留原文的单数与不确定性。
- issue: 乐器与审判并置的张力
  choice: 保留“伴着手鼓和琴声”
  alternative: 解释为庆祝胜利的音乐
  rationale: 原文只明说乐器伴随，并未明确说明是谁演奏或其确切礼仪意义，因此不在正文中加入解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“命定之杖”保留先知诗歌意象；“伴着手鼓和琴声”保持乐声与审判并置的张力。正文脚注标记依出现内容置于句末，避免英文底稿中标记次序混乱。
