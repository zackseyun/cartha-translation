id: ISA.30.1
reference: Isaiah 30:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ה֣וֹי בָּנִ֤ים סֽוֹרְרִים֙ נְאֻם יְהוָ֔ה לַ/עֲשׂ֤וֹת עֵצָה֙ וְ/לֹ֣א מִ/נִּ֔י וְ/לִ/נְסֹ֥ךְ מַסֵּכָ֖ה וְ/לֹ֣א רוּחִ֑/י לְמַ֛עַן סְפ֥וֹת חַטָּ֖את עַל חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/001.yaml
  text: Woe to the rebellious children[a], declares Yahweh, who carry out a plan, but not from me, and who pour out a libation, but not by my Spirit, so as to add sin to sin.
translation:
  language: zh_hans
  text: “祸哉，那些悖逆的儿女！”雅威宣告说：“他们推行计谋，却不是出于我；他们倾倒奠酒[a]，却不是出于我的灵，以致罪上加罪。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“编织遮盖物”；有些人根据上下文作较宽泛的理解，译为“缔结盟约”。按马所拉经文的元音标注，最自然的读法是“倾倒奠酒”。
    reason: 保留该希伯来短语的不同解释，并说明正文采用马所拉经文直接支持的读法。
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 这是先知宣告审判并含有哀叹意味的感叹词；“祸哉”保留其庄重而强烈的先知语气。
- source_word: בָּנִים סוֹרְרִים
  choice: 悖逆的儿女
  rationale: “儿女”保留雅威与百姓之间的关系意象，也适合指整体群体；“悖逆”表达持续抗拒、顽梗不顺服之意。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: נְאֻם是郑重的先知宣告公式；“雅威”按希伯来神名四字母的通行学术读法音译。
- source_word: לַעֲשׂוֹת עֵצָה
  choice: 推行计谋
  rationale: 该结构不仅可指拟定计划，也可指施行政策或谋略；上下文涉及犹大的政治谋划，“推行计谋”兼顾行动性与负面语境。
- source_word: וְלֹא מִנִּי
  choice: 却不是出于我
  rationale: 介词表示来源，重点是这些计谋并非源自雅威。
- source_word: וְלִנְסֹךְ מַסֵּכָה
  choice: 浇奠祭酒
  rationale: 按马所拉经文的元音标注，最自然的意思是浇奠祭酒。上下文可能使人联想到结盟，但正文保留有文本直接支持的读法，并以脚注说明其他理解。
- source_word: וְלֹא רוּחִי
  choice: 却不是出于我的灵
  rationale: “我的灵”保留רוּחִי可能具有的神学分量，同时不进一步限定为旨意、气息或某种具体运行方式；“出于”也与前句的来源观念相呼应。
- source_word: לְמַעַן סְפוֹת
  choice: 以致……加……
  rationale: 该结构可表达目的或结果；“以致”在中文中自然地呈现其行为造成罪不断累加的后果，又不把主观动机说得过死。
- source_word: חַטָּאת עַל חַטָּאת
  choice: 罪上加罪
  rationale: 保留希伯来语累加式表达，在现代中文中也简洁、清楚而有力度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较直接地反映神名四字母通常重构的读音，也与所提供项目原则中的“Yahweh”一致；不采用源自另一套传统读法的“耶和华”。
- issue: וְלִנְסֹךְ מַסֵּכָה 的解释
  choice: 正文译作“浇奠祭酒”
  alternative: 编织遮盖物；缔结盟约
  rationale: 马所拉经文按现有元音最自然地指浇奠祭酒；但本章上下文谈到与埃及结盟，因此其他解释具有语境依据。正文不以语境推断取代传承文本，歧义则在脚注中保留。
- issue: רוּחִי 的所指
  choice: 我的灵
  alternative: 我的心意；我的旨意
  rationale: 直译“我的灵”可以保留它指雅威之灵、气息或内在意旨的张力，避免在正文中把含义缩窄为单纯的政治许可或主观意愿。
- issue: לְמַעַן 所表达的目的或结果
  choice: 以致
  alternative: 为要
  rationale: 此处既可读作他们行动的目的，也可表示行动所导致的结果。“以致”较少暗示百姓主观上刻意追求犯罪，更自然地表达罪不断累积的后果。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话书面语。“祸哉”和“宣告”保留先知话语的力度；其余句式避免过度古雅。“罪上加罪”保留原文反复累加的修辞。脚注标记紧随实际存在歧义的“浇奠祭酒”，而不是置于“儿女”之后。
