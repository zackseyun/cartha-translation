revisions:
- from: 因为陀斐特[a]早已预备好[b]，也为那王备妥了。耶和华使它又深又宽；其中的柴堆有充足的火和木柴。耶和华的气息如硫磺的洪流，点燃其中的柴堆。
  to: 因为陀斐特[a]早已预备好[b]，也为那王备妥了；它被挖得又深又宽，其焚烧处有大量的火和木柴。耶和华的气息像一道硫磺的洪流，在其中燃烧。
  rationale: 修订避免明示原文未明说的施事者，并将末句恢复为“耶和华的气息”在陀斐特／焚烧处中燃烧的图景，而不把它限定为点燃柴堆。脚注标记及其所指保持完整。
  reviewer_model: gpt-5.6-terra
