id: ISA.30.33
reference: Isaiah 30:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי עָר֤וּךְ מֵֽ/אֶתְמוּל֙ תָּפְתֶּ֔ה גַּם הוא לַ/מֶּ֥לֶךְ הוּכָ֖ן הֶעְמִ֣יק הִרְחִ֑ב מְדֻרָתָ֗/הּ אֵ֤שׁ וְ/עֵצִים֙ הַרְבֵּ֔ה נִשְׁמַ֤ת יְהוָה֙ כְּ/נַ֣חַל גָּפְרִ֔ית בֹּעֲרָ֖ה בָּֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/033.yaml
  text: For Topheth has long been prepared[a]; indeed, it is made ready for the king. He has made it deep and wide, with a pyre of fire and wood in abundance. The breath of Yahweh, like a stream of sulfur[c][b], kindles it.
translation:
  language: zh_hans
  text: 因为陀斐特[a]早已预备好[b]，也为那王备妥了；它被挖得又深又宽，其焚烧处有大量的火和木柴。耶和华的气息像一道硫磺的洪流，在其中燃烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陀斐特”是地名，与焚烧和审判的意象有关。也可音译作“陀斐”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从昨日”，在这里指早先已经预备，或从很久以前就预备好了。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּפְתֶּה
  choice: 陀斐特
  rationale: 按专名音译；该地名在上下文中承载焚烧与审判的意象，不在正文中释义。
- source_word: עָרוּךְ מֵאֶתְמוּל
  choice: 早已预备好
  rationale: עָרוּךְ 表示已布置、预备妥当的状态；מֵאֶתְמוּל 字面为“从昨日”，在此表达早先、预先之意。
- source_word: גַּם הוא לַמֶּלֶךְ הוּכָן
  choice: 也为那王备妥了
  rationale: 保留 גַּם 的追加强调以及“那王”的明确形式，不把所指具体化为亚述王或摩洛。
- source_word: הֶעְמִיק הִרְחִב
  choice: 耶和华使它又深又宽
  rationale: 两个使役式动词表示使之加深、加宽；希伯来文未明说主语，依后句及语境以耶和华承接，但不增添进一步解释。
- source_word: מְדֻרָתָהּ
  choice: 其中的柴堆
  rationale: 该词可指焚烧用的柴堆或燃烧处；结合后面的火与大量木柴，译作“柴堆”具体自然。
- source_word: אֵשׁ וְעֵצִים הַרְבֵּה
  choice: 有充足的火和木柴
  rationale: 直接保留火、木柴及数量充足的意象。
- source_word: נִשְׁמַת יְהוָה
  choice: 耶和华的气息
  rationale: נִשְׁמַת 的基本义为气息，也可带强烈吹袭之意；“气息”保留原文拟人化图景。
- source_word: כְּנַחַל גָּפְרִית
  choice: 如硫磺的洪流
  rationale: נַחַל 在此审判意象中有奔涌水流之势，故译“洪流”；גָּפְרִית 用现代通行词“硫磺”。
- source_word: בֹּעֲרָה בָּהּ
  choice: 点燃其中的柴堆
  rationale: 阴性分词与“气息”相应；介词短语字面可理解为“在其中燃烧”，也可按语境表达使柴堆燃起。此处译为自然的“点燃”，并明确其作用对象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉且庄重的专名形式“耶和华”，同时把它作为神的专名而非普通称号处理。
- issue: “那王”的所指
  choice: 保留“那王”
  alternative: 亚述王／摩洛
  rationale: 原文只写 לַמֶּלֶךְ“为那王”；上下文可能指亚述王，也有与摩洛传统相联系的解释，但正文不替原文裁定。
- issue: 使陀斐特又深又宽者
  choice: 耶和华
  alternative: 不明说主语／有人
  rationale: 原文两个第三人称阳性单数动词未显明主语；按本节后半直接出现耶和华及整体语境，以耶和华为自然承接，但承认语法本身省略了主语。
- issue: בֹּעֲרָה בָּהּ 的句法语义
  choice: 点燃其中的柴堆
  alternative: 在其中燃烧
  rationale: 原文可较直译为“在其中燃烧”；结合耶和华的气息如硫磺洪流以及预备好的柴堆，正文采用点燃义，使中文关系清晰，同时不扩展为额外的教义陈述。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“那王”的指称含混性；以“柴堆、洪流、点燃”连贯呈现原文强烈的焚烧意象。所有脚注标记均已置于正文。
