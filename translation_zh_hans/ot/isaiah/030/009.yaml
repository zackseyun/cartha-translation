  text: כִּ֣י עַ֤ם מְרִי֙ ה֔וּא בָּנִ֖ים כֶּחָשִׁ֑ים בָּנִ֕ים לֹֽא אָב֥וּ שְׁמ֖וֹעַ תּוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/009.yaml
  text: For they are a rebellious people[a], lying children, children unwilling to hear the law of Yahweh[b],
translation:
  language: zh_hans
  text: 因为他们是悖逆的百姓，是说谎的儿女[a]，是不肯听雅威的训诲的儿女[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“虚假的儿女”或“欺骗人的儿女”。
    reason: lexical_alternative
  - marker: b
    text: “不肯听雅威的训诲”也可译作“不肯听从雅威的律法”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明先知作出前述判断的原因；“因为”自然保留了解释性的连接作用。
- source_word: עַם מְרִי
  choice: 悖逆的百姓
  rationale: מְרִי 表示反叛、抗拒；在此与“百姓”构成定性表达。“悖逆”保留其道德与盟约层面的分量。
- source_word: בָּנִים
  choice: 儿女
  rationale: 本词可指儿子或儿女，此处用作群体性的亲子比喻；“儿女”不把所指局限于男性，也符合现代汉语表达。
- source_word: כֶּחָשִׁים
  choice: 说谎的
  rationale: 该词描述以虚假、欺骗为特征的人；“说谎的儿女”直接保留先知严厉的指控，同时不把名词性含义强化为“骗子”。
- source_word: לֹא אָבוּ
  choice: 不肯
  rationale: 原文强调意愿上的拒绝，不只是没有听见；“不肯”简洁地表达其执意拒绝。
- source_word: שְׁמוֹעַ
  choice: 听
  rationale: 保留“听、聆听”的基本意义，使其中可能包含的顺从意味仍由语境体现，而不直接增译为“服从”。
- source_word: תּוֹרַת
  choice: 训诲
  rationale: תּוֹרָה 在此指雅威具有权威的教导。“训诲”既自然体现教导意味，也不排除其盟约与规范性质；“律法”作为较窄而传统的译法收入脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用神的专名四字神名 YHWH；“雅威”按现代学界通常的拟音呈现其为专名，而不以“主”这一称号代替。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 正文保留原文的专名性质。“雅威”反映现代通常采用的拟音；“耶和华”是汉语传统形式，“主”则是替代性称号。
- issue: תּוֹרָה 在先知性盟约语境中的译法
  choice: 训诲
  alternative: 律法；教导
  rationale: 此处既有神权威性指示的含义，也未必仅指成文法条。“训诲”保留较宽的语义范围，而脚注说明传统的“律法”译法。
- issue: שׁמע 是否明确译出顺服
  choice: 听
  alternative: 听从；服从
  rationale: 原词在盟约语境中可能隐含顺从，但句面首先表达拒绝聆听、接受；正文不把语境含义明说为“服从”，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。重复“儿女”以保留希伯来文的排比和指控力度；“不肯”突出故意拒绝，“雅威”保留神名的专名性质。
