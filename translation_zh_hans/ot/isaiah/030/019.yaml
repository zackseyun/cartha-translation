id: ISA.30.19
reference: Isaiah 30:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי עַ֛ם בְּ/צִיּ֥וֹן יֵשֵׁ֖ב בִּ/ירֽוּשָׁלִָ֑ם בָּכ֣וֹ לֹֽא תִבְכֶּ֗ה חָנ֤וֹן יָחְנְ/ךָ֙ לְ/ק֣וֹל זַעֲקֶ֔/ךָ כְּ/שָׁמְעָת֖/וֹ עָנָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/019.yaml
  text: For a people in Zion will dwell in Jerusalem[a]; you will surely weep no more. He will surely be gracious to you at the sound of your cry; when he hears it[b], he will answer you.
translation:
  language: zh_hans
  text: 因为锡安必有百姓住在那里，就是在耶路撒冷；你必不再哭泣。[a]他听见你呼求的声音时，必施恩给你；[b]他一听见，就必应允你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“哭，你必不哭”，以同根词的不定式绝对形与动词连用，加强否定语气；也可译作“你绝不会哭泣”。
    reason: 说明“哭泣”后的希伯来语强调结构及其语气。
  - marker: b
    text: 原文直译近于“施恩，他必向你施恩”，以同根词的不定式绝对形与动词连用，强调他必定施恩。
    reason: 说明“必施恩给你”后的希伯来语强调结构及应许的确定性。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明等候耶和华之人有福的依据；译作“因为”保留其因果和论述衔接功能。
- source_word: עַם בְּצִיּוֹן יֵשֵׁב בִּירוּשָׁלִָם
  choice: 必有百姓住在锡安，住在耶路撒冷
  rationale: 将未完成式 יֵשֵׁב 按复兴应许的语境译为将来意义；“百姓”保留 עַם 的集体含义，两个“住在”使锡安与耶路撒冷的平行关系在现代汉语中清楚自然。
- source_word: בָּכוֹ לֹא תִבְכֶּה
  choice: 你必不再哭泣
  rationale: 不定式绝对形与未完成式连用，加强否定语气；“必不再”既表达确定性，也符合哀哭终止的语境。
- source_word: חָנוֹן יָחְנְךָ
  choice: 他必向你施恩
  rationale: 同根不定式绝对形加强肯定语气；חנן 的核心意义是施恩、恩待，译文保留这一神学上透明而不过度解释的用语。
- source_word: לְקוֹל זַעֲקֶךָ
  choice: 因你呼求的声音
  rationale: 保留原文“对着／因着你呼求的声音”的听觉意象，又避免提前把下一分句的“听见”完全吸收进本句。
- source_word: כְּשָׁמְעָתוֹ
  choice: 他一听见
  rationale: כְּ 加动词不定式结构在此表达紧接发生的时间关系；“一……就……”自然传达迅速回应的意味。代词所指的呼求在汉语中可由上文自然承接。
- source_word: עָנָךְ
  choice: 就必应允你
  rationale: ענה 在此为回应呼求；依复兴应许的语境采用将来、确定性的表达。“应允”比单纯“回答”更符合祷告呼求的语境，但不增添回应方式。
theological_decisions:
- issue: 后半节动词的神圣主语在原文中未以名词重述
  choice: 以“他”明确主语，所指为上下文中的耶和华
  alternative: 重复译为“耶和华”，或尽量省略主语
  rationale: 希伯来语可由动词形态与上下文表明主语，现代汉语则需要显明主语以保持顺畅；用“他”避免无根据地重复神名，同时保留上帝亲自施恩和回应的行动。
- issue: יֵשֵׁב 的时态及句法理解
  choice: 理解为应许性的将来：“必有百姓住在”
  alternative: 理解为对现有居民的直接称呼：“住在锡安、耶路撒冷的百姓啊”
  rationale: 未完成式可支持将来意义，且与本段审判逆转和复兴应许相合；不过称呼式理解在句法上也有可能，因此不在正文中添加超出原文的限定成分。
- issue: 对集体“百姓”使用第二人称单数
  choice: 译为普通汉语的“你”
  alternative: 译为“你们”以显明集体对象
  rationale: 原文以阳性单数后缀把百姓／锡安作为一个整体来称呼；“你”较能保留这种集体单数表达，并维持原文由集体名词转向直接应许的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“锡安”“耶路撒冷”“施恩”“应允”保留经文的 covenant-geographic 与祷告语域，但句法尽量简明，普通读者可直接理解。脚注标记紧跟各自所解释的强调结构，纠正了咨询层中标记位置与脚注内容不相配的问题。
