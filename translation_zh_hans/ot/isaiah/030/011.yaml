source:
  edition: WLC
  text: ס֚וּרוּ מִנֵּי דֶ֔רֶךְ הַטּ֖וּ מִנֵּי אֹ֑רַח הַשְׁבִּ֥יתוּ מִ/פָּנֵ֖י/נוּ אֶת קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/011.yaml
  text: Turn aside from the way[a]; depart from the path; remove the Holy One of Israel from before us.
translation:
  language: zh_hans
  text: “你们要离开道路，偏离路径；让以色列的圣者不再在我们面前出现！[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使以色列的圣者从我们面前止息”。原文动词为使役式，表示使其停止或除去，不再在我们面前。
    reason: 保留希伯来语使役动词的较字面表达及其“从我们面前”的语义，避免加入原文未明说的具体解释。
lexical_decisions:
- source_word: סוּרוּ מִנֵּי דֶרֶךְ
  choice: 离开道路
  rationale: 复数祈使句要求对方离开既定的道路；译文保留“道路”的比喻意象，不额外加入原文没有明说的“正”字。
- source_word: הַטּוּ מִנֵּי אֹרַח
  choice: 偏离路径
  rationale: נטה在这里与סור平行，表达转向、偏离；“路径”与前句“道路”构成自然的同义平行。
- source_word: הַשְׁבִּיתוּ
  choice: 使……消失
  rationale: 这是שבת的使役式复数祈使，基本意思是“使停止、使不再存在于某处”。结合מִפָּנֵינוּ，“使……从我们面前消失”既保留使役力量，也符合现代汉语表达。
- source_word: מִפָּנֵינוּ
  choice: 从我们面前
  rationale: 保留原文“从我们面前／从我们所在之处”的空间及关系含义，避免直接限定为仅仅“不想看见”。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 这是《以赛亚书》中反复出现的上帝称号；直译可同时保留“圣”与他同以色列之关系的含义。
theological_decisions:
- issue: “以色列的圣者”所指为何
  choice: 保留为以色列上帝的神圣称号
  alternative: 将其意译为关于上帝的信息，或先知对上帝圣洁的宣讲
  rationale: 该短语在《以赛亚书》中稳定地用作上帝的称号。这里可能借要求先知停止传讲而表达对上帝临在和话语的拒绝，但正文不把称号改写为其信息，以免消除原文的神学张力。
- issue: “使……消失”的指向
  choice: 保留要求使圣者不再在他们面前的强烈说法
  alternative: 明确译成“不要再向我们提起以色列的圣者”
  rationale: 语境可能涉及拒绝先知所传的信息，但原文直接以“以色列的圣者”为宾语。正文保留这种大胆而带冲突性的表述，脚注说明其语境含义。
translation_notes:
  register: 采用现代、庄重而易懂的命令句。前两分句保留希伯来诗歌的同义平行；末句使用“使……消失”传达使役语气，同时以脚注交代较直译的“使……止息”及其可能语境含义。
