base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/012.yaml
  text: 'Therefore thus says the Holy One of Israel: Because you have rejected this word[a], and have trusted in oppression and perversity, and have relied on it[b],'
translation:
  language: zh_hans
  text: 因此，以色列的圣者如此说：“因为你们弃绝这话[a]，信靠欺压和诡诈，并以此为倚靠[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这话”也可译作“这信息”或“这事”。
    reason: lexical_alternative
  - marker: b
    text: “欺压”也可译作“勒索”；“诡诈”也可译作“乖谬”或“邪曲”。原文末尾为单数代词，可能主要指“诡诈”，也可能概括前面两项。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文责备并引出后果，符合现代汉语的先知宣告语气。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 准确呈现先知使者公式，在现代汉语中庄重而自然。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 保留以赛亚书这一称号的构造和神学分量。
- source_word: יַעַן
  choice: 因为
  rationale: 明确引出宣告审判的理由。
- source_word: מָאַס
  choice: 弃绝
  rationale: 表达主动拒斥，比单纯“拒绝”更能体现原文力度，又不必限定为情感上的藐视。
- source_word: בַּדָּבָר הַזֶּה
  choice: 这话
  rationale: דבר 在此很可能指刚刚传达的先知话语；“这话”简洁直接，同时不排除“信息”或“事情”的语义可能。
- source_word: בָּטַח
  choice: 信靠
  rationale: 表达把信心置于某对象，并与后面的“倚赖”形成近义平行。
- source_word: עֹשֶׁק
  choice: 欺压
  rationale: 涵盖凭不义权势压迫、勒索的语义范围，适合本节伦理谴责。
- source_word: נָלוֹז
  choice: 邪曲
  rationale: 保留“扭曲、乖谬”这一形象和道德色彩，不把词义过窄地限定为欺骗手段。
- source_word: שָׁעַן
  choice: 倚赖
  rationale: 自然表达原词“倚靠支撑”及其比喻性的依赖含义。
- source_word: עָלָיו
  choice: 它
  rationale: 保留希伯来文阳性单数代词，不强行判定它只指“邪曲”还是前述复合对象。
theological_decisions:
- issue: “这话”的所指
  choice: 译为“这话”，主要指刚才传达的先知警告
  alternative: “这信息”或“这事”
  rationale: 上下文支持其指神借先知所说的话，但原词 דבר 本身具有较宽语义，因此以脚注保留其他可能。
- issue: 百姓所信靠之物的道德性质
  choice: “欺压和邪曲”
  alternative: “勒索和乖谬”或“不义和欺诈”
  rationale: 译文保留原文对不义压迫和扭曲手段的概括性谴责，不将其限定为某一种具体政治或经济机制。
- issue: 末尾单数代词的所指
  choice: 保留为单数“它”
  alternative: 按意义译作“这些”
  rationale: 原文 עָלָיו 为单数，所指可能偏向最近的“邪曲”，也可能概括前面的复合对象；直译保留这种张力。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“以色列的圣者”保留以赛亚书特色称号；“弃绝、信靠、倚赖”维持先知宣告的力度与平行结构。经文在本节末仍未完句，因此保留结尾逗号。
