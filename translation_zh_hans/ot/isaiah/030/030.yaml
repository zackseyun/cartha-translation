id: ISA.30.30
reference: Isaiah 30:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִשְׁמִ֨יעַ יְהוָ֜ה אֶת ה֣וֹד קוֹל֗/וֹ וְ/נַ֤חַת זְרוֹע/וֹ֙ יַרְאֶ֔ה בְּ/זַ֣עַף אַ֔ף וְ/לַ֖הַב אֵ֣שׁ אוֹכֵלָ֑ה נֶ֥פֶץ וָ/זֶ֖רֶם וְ/אֶ֥בֶן בָּרָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/030.yaml
  text: And Yahweh will make the majesty of his voice heard[a], and will show the descending blow of his arm, in furious anger and a flame of consuming fire[b], with cloudburst and storm and hailstones.
translation:
  language: zh_hans
  text: 耶和华必使人听见他威严的声音；他必在震怒中，在吞噬之火的烈焰、暴雨[b]、风暴和冰雹中，显明他手臂向下的击打[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他手臂的下落”。这里的希伯来语较难确定，可能侧重耶和华的手臂在审判中向下挥落，也可能侧重这一击本身。
    reason: lexical_alternative
  - marker: b
    text: 或译“倾盆大雨”。原词在这里可能指猛烈迸发的暴雨。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确保留原文的神名。
- source_word: הִשְׁמִיעַ
  choice: 使人听见
  rationale: 保留使役形的意义，同时符合现代汉语表达。
- source_word: הוֹד קוֹלוֹ
  choice: 他威严的声音
  rationale: הוֹד 表示威严、荣美；在显现与审判的语境中，“威严”自然有力。
- source_word: נַחַת זְרוֹעוֹ
  choice: 他手臂向下的击打
  rationale: נַחַת 在此含义困难，可能强调手臂下落，也可能兼指落下的一击；正文保留动作方向及审判力度，并以脚注说明歧义。
- source_word: יַרְאֶה
  choice: 显明
  rationale: 表达使役形“使之被看见、展示”的含义，并与神显现的语境相称。
- source_word: בְּזַעַף אַף
  choice: 在震怒中
  rationale: 凝练传达原文叠加强化的愤怒语气，避免生硬重复。
- source_word: לַהַב אֵשׁ אֹכֵלָה
  choice: 吞噬之火的烈焰
  rationale: 保留火焰与主动吞噬的鲜明审判意象。
- source_word: נֶפֶץ
  choice: 暴雨
  rationale: 结合随后风暴、冰雹的气象序列，理解为猛烈迸发的降雨；脚注保留“倾盆大雨”的表达可能。
- source_word: זֶרֶם
  choice: 风暴
  rationale: 该词可指急流或暴风雨；在此气象审判序列中，“风暴”较自然，也不把意象局限为水流。
- source_word: אֶבֶן בָּרָד
  choice: 冰雹
  rationale: 原文直译为“雹石”，现代汉语以“冰雹”自然表达同一意象。
theological_decisions:
- issue: 耶和华手臂与震怒的拟人化审判意象
  choice: 保留“手臂”“击打”“震怒”等具体诗性语言
  alternative: 抽象改写为神能力或审判的彰显
  rationale: 原文有意采用具象的神显现和审判图景；保留这些张力，不将其解释性淡化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以分号呈现声音与手臂两幅平行的神显现图景；将各介词短语前置，使审判场景层次清楚。脚注标记均紧随其所说明的词组，避免来源材料中标记位置与注释内容错位。
