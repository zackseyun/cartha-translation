  text: אֶ֣לֶף אֶחָ֗ד מִ/פְּנֵי֙ גַּעֲרַ֣ת אֶחָ֔ד מִ/פְּנֵ֛י גַּעֲרַ֥ת חֲמִשָּׁ֖ה תָּנֻ֑סוּ עַ֣ד אִם נוֹתַרְתֶּ֗ם כַּ/תֹּ֨רֶן֙ עַל רֹ֣אשׁ הָ/הָ֔ר וְ/כַ/נֵּ֖ס עַל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/017.yaml
  text: A thousand will flee at the rebuke of one[a]; at the rebuke of five you will flee, until you are left like a signal pole on the top of a mountain[b], and like a banner on a hill.
translation:
  language: zh_hans
  text: 一千人要因一人的叱喝而逃跑；因五人的叱喝，你们要逃跑，直到你们所剩下的，像山顶上的高杆[a]，又像山冈上的旗号[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“桅杆”。希伯来语 תֹּרֶן 可指桅杆或高耸的杆。
    reason: lexical_alternative
  - marker: b
    text: 或译“信号旗”。希伯来语 נֵס 指竖起作为信号的旗帜或标志。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אֶחָד
  choice: 一千人
  rationale: 原文是“一千，一”，表示一千之数；结合与“一人”的对比，汉语补出“人”，使战败逃亡的场景清楚自然。
- source_word: מִפְּנֵי גַּעֲרַת
  choice: 因……的叱喝
  rationale: מִפְּנֵי在此表达原因；גְּעָרָה可指斥责、威吓性的喝令。“叱喝”既保留责斥意味，也符合使军队惊逃的语境。
- source_word: תָּנֻסוּ
  choice: 你们都要逃跑
  rationale: 这是第二人称阳性复数未完成式，直指听众。“都”体现复数群体整体逃亡，并使现代汉语顺畅。
- source_word: עַד אִם נוֹתַרְתֶּם
  choice: 直到你们剩下来
  rationale: 保留原文由逃亡达到仅存状态的结果界限，不在正文中进一步解释剩余者的数量或身份。
- source_word: כַּתֹּרֶן
  choice: 如同……高杆
  rationale: תֹּרֶן可指桅杆或高耸的杆；在山顶并与נֵס平行时，“高杆”能保留其孤立、醒目的形象，同时避免把有争议的具体所指定死。
- source_word: עַל רֹאשׁ הָהָר
  choice: 山顶上
  rationale: 自然、准确地表达“在山的顶部”，适合现代汉语。
- source_word: וְכַנֵּס
  choice: 又如……旗号
  rationale: נֵס指竖起用作信号的旗帜或标志。“旗号”兼具旗帜和信号标识的含义，也与前面的高杆形成平行。
- source_word: עַל הַגִּבְעָה
  choice: 冈上
  rationale: “冈”准确表达较低的山丘，并保持先知诗歌凝练、庄重的语体。
theological_decisions:
- issue: 结尾比喻的含义
  choice: 保留山顶高杆和冈上旗号的具体意象，让其自然呈现战败后孤立、暴露而醒目的余民状态。
  alternative: 明确解释为警戒信号，或只强调人数稀少、处境脆弱。
  rationale: 原文意象可同时包含孤立、显眼和作为信号标志等意味；正文不把这些层面缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“叱喝”保留军事语境中的威吓力量；结尾维持简洁的诗性平行。“高杆”与“旗号”的选择保留原词的词义空间，具体替代译法列于脚注。
