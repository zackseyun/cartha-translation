  text: וְ/רוּח֞/וֹ כְּ/נַ֤חַל שׁוֹטֵף֙ עַד צַוָּ֣אר יֶֽחֱצֶ֔ה לַ/הֲנָפָ֥ה גוֹיִ֖ם בְּ/נָ֣פַת שָׁ֑וְא וְ/רֶ֣סֶן מַתְעֶ֔ה עַ֖ל לְחָיֵ֥י עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/028.yaml
  text: and his breath is like an overflowing stream[a]; it reaches up to the neck, to sift nations with a sieve of emptiness[c][b], and a misleading bridle is on the jaws of the peoples.
translation:
  language: zh_hans
  text: 他的气息如同泛滥的溪流，直涨到颈项；为要用虚空的筛子筛列国；使万民迷失方向的辔头套在他们的腮颊上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רוּחוֹ
  choice: 他的气息
  rationale: רוּחַ可指气息、风或灵；此处承接上文从耶和华口中发出的审判意象，译作“气息”最贴合，同时以脚注保留其他可能。
- source_word: כְּנַחַל שׁוֹטֵף
  choice: 如同泛滥的河流
  rationale: נחל指河流、溪流或干河谷中的水道，שׁוֹטֵף表达奔涌、冲刷或泛滥；此译自然地保留洪水般的力量。
- source_word: עַד צַוָּאר יֶחֱצֶה
  choice: 直涨到颈项
  rationale: חצה字面可指分开、穿过；在洪流意象中，这一短语表示水势达到颈部，译作“直涨到颈项”符合现代汉语且不削弱危险感。
- source_word: לַהֲנָפָה
  choice: 筛动
  rationale: 该词源于נוף，含摇动、簸扬之意；与后面的“筛子”相连，译作“筛动”既保持词源动作，也符合审判图景。
- source_word: גוֹיִם
  choice: 列国
  rationale: 此处指作为政治和族群整体的各国；“列国”符合以赛亚书的庄重语体。
- source_word: בְּנָפַת שָׁוְא
  choice: 用虚空的筛子
  rationale: נפה是筛子；שָׁוְא可指虚空、虚妄、虚假或无用。“虚空”保留原语的多义和突兀意象，不把其作用过早解释为毁灭或徒劳。
- source_word: רֶסֶן מַתְעֶה
  choice: 使人走迷的嚼环
  rationale: רֶסֶן指控制牲畜的辔具或嚼环；מַתְעֶה表示使之迷失、领入歧途。“使人走迷的嚼环”保留主动使役意义及强制引导的比喻。
- source_word: עַל לְחָיֵי עַמִּים
  choice: 套在万民的腮颊上
  rationale: לְחָיַיִם可指双颊或颌部；辔具与腮颊相接，因此采用“腮颊”，并用“套在”使汉语中的驾驭意象清楚。
theological_decisions:
- issue: “他的气息”中代词的指向
  choice: 按上下文理解为耶和华的气息
  alternative: 将其视为非人格化的风暴力量
  rationale: 前后文明确描绘耶和华亲自临到并施行审判；保留“他的”可呈现神的主动作为，又不额外加入教义性解释。
- issue: “虚空的筛子”与“使人走迷的嚼环”的关系
  choice: 保留为两个并列而含义张力未尽消解的审判意象
  alternative: 把后半句解释为前半句的同位说明，即“筛子”就是使人走迷的嚼环
  rationale: 希伯来文可让两个意象彼此呼应，但句法并未要求将它们完全等同；分号并列可保存原文的诗性张力。
translation_notes:
  register: 采用现代、庄重且可朗读的标准普通话。“列国／万民”保存原文גוים与עמים的措辞变化；“直涨到颈项”清楚呈现洪流意象；“虚空的筛子”刻意保留原文难解而多义的表达，不以解释性措辞消除其张力。
