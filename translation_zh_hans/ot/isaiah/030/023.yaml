  text: וְ/נָתַן֩ מְטַ֨ר זַרְעֲ/ךָ֜ אֲשֶׁר תִּזְרַ֣ע אֶת הָ/אֲדָמָ֗ה וְ/לֶ֨חֶם֙ תְּבוּאַ֣ת הָֽ/אֲדָמָ֔ה וְ/הָיָ֥ה דָשֵׁ֖ן וְ/שָׁמֵ֑ן יִרְעֶ֥ה מִקְנֶ֛י/ךָ בַּ/יּ֥וֹם הַ/ה֖וּא כַּ֥ר נִרְחָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/023.yaml
  text: And he will give rain for your seed with which you sow the ground[a], and bread from the produce of the ground; and it will be rich and plentiful[b]. On that day your livestock will graze in a broad pasture.
translation:
  language: zh_hans
  text: 他必为你撒在田里的种子降雨；田地所出的粮食必丰盛肥沃。[a]到那日，你的牲畜必在宽阔的草场上吃草。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丰盛肥沃”直译为“肥美、丰腴（或富足）”，是形容农产丰富、优良的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן מְטַר
  choice: 他必降雨
  rationale: 开头的动词在预言语境中表达将来的应许；主语承接上文，指耶和华。中文以“降雨”自然表达上帝赐下雨水。
- source_word: זַרְעֲךָ אֲשֶׁר תִּזְרַע אֶת הָאֲדָמָה
  choice: 你撒在地里的种子
  rationale: 原文直译近似“你用来播种土地的种子”。中文采用自然语序，保留种子、撒种和土地三项农业意象。
- source_word: לֶחֶם תְּבוּאַת הָאֲדָמָה
  choice: 地里所出的粮食
  rationale: לֶחֶם可指饼、食物或粮食；在农产丰收的语境中，“粮食”比限定为烤制成品的“饼”更自然，也保留赖以为食之物的含义。
- source_word: וְהָיָה דָשֵׁן וְשָׁמֵן
  choice: 必肥美丰盛
  rationale: 两个形容词字面均含肥厚、丰腴之意，在此描写土地出产丰富优良；“肥美丰盛”保留农业丰饶的形象而不显生硬。
- source_word: יִרְעֶה מִקְנֶיךָ
  choice: 你的牲畜必……吃草
  rationale: מִקְנֶיךָ泛指所拥有的家畜，不限于牛；יִרְעֶה在此指牲畜取食、放牧，译作“吃草”符合现代中文习惯。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知书常见的时间公式，同时符合现代庄重中文。
- source_word: כַּר נִרְחָב
  choice: 宽阔的草场
  rationale: כַּר指草场或牧场，נִרְחָב指宽广开阔；该译法清楚呈现充足放牧空间的图景。
theological_decisions:
- issue: 开头动词省略的主语
  choice: 译作“他”，承接上文所指的耶和华
  alternative: 在本节明确补译“耶和华”
  rationale: 希伯来文本本节没有重述神名。用“他”既忠于篇章衔接，也避免把解释性补充直接写入正文。
- issue: “肥美丰盛”所指对象
  choice: 按最近的“粮食”理解
  alternative: 理解为地里的出产，或概括整句所述的收成
  rationale: 原文单数代词式动词结构可在语法上承接לֶחֶם“粮食”，但语义也涵盖土地出产的丰饶；中文不额外限定，以保留这种范围上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“降雨”“粮食”“草场”等常用词保留农业图景；句式适度整合，使经文朗读自然。正文中的脚注标记[a]对应所附脚注。
