  rationale: 修订仅处理末句的中文指代与搭配，并以“其崩塌”表达墙体／破口的崩毁，保留原文可能的指代范围，不作额外释义。“突然发生，转瞬即至”保留 פִּתְאֹם 与 לְפֶתַע 的叠加强调。
