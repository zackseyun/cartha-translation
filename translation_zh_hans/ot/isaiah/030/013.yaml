  text: לָ/כֵ֗ן יִֽהְיֶ֤ה לָ/כֶם֙ הֶ/עָוֺ֣ן הַ/זֶּ֔ה כְּ/פֶ֣רֶץ נֹפֵ֔ל נִבְעֶ֖ה בְּ/חוֹמָ֣ה נִשְׂגָּבָ֑ה אֲשֶׁר פִּתְאֹ֥ם לְ/פֶ֖תַע יָב֥וֹא שִׁבְרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/013.yaml
  text: Therefore this iniquity will be to you like a falling breach, bulging out in a high wall, whose breaking comes suddenly, in an instant.
translation:
  language: zh_hans
  text: 因此，这罪孽对你们必像高墙上一个向外鼓出、正在坍塌的破口；其崩塌必突然发生，转瞬即至。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעָוֹן הַזֶּה
  choice: 这罪孽
  rationale: 直译名词 עָוֹן，并保留其既可指罪责、也可指罪所带来后果的语义张力。
- source_word: כְּפֶרֶץ נֹפֵל
  choice: 像……正在坍塌的裂口
  rationale: פֶרֶץ 指墙体的破口或裂口；分词 נֹפֵל 描绘正在倒塌、行将崩落的状态，不添加原文没有的时间限定。
- source_word: נִבְעֶה
  choice: 向外鼓出
  rationale: 该词在此形容墙体裂处鼓胀凸出，是倒塌前的危险征兆。
- source_word: שִׁבְרָהּ
  choice: 它……破裂
  rationale: 阴性后缀回指高墙或所述墙体；用“破裂”表达 שֶׁבֶר 的崩毁意义，同时保持中文自然。
- source_word: פִּתְאֹם לְפֶתַע
  choice: 突然……顷刻之间
  rationale: 保留两个近义时间表达的叠加强调，传达灾变猝然而至。
theological_decisions:
- issue: עָוֹן 是指罪本身、罪责，还是罪的惩罚
  choice: 译作“罪孽”
  alternative: 罪责；罪的后果
  rationale: “罪孽”可自然涵盖作恶与罪责，不把比喻单向解释为刑罚，从而保留原文的语义张力。
- issue: 墙体崩塌意象的时间状态
  choice: “正在坍塌”
  alternative: 将要坍塌
  rationale: 希伯来语分词 נֹפֵל 本身描绘下落或坍塌状态；译文不把它明确改写成单纯的未来预告。
translation_notes:
  register: 采用现代、庄重而清晰的普通话；以分号维持原句由危险征兆转入突然崩毁的节奏。
