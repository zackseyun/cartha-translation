  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֤ה שֵׁם יְהוָה֙ בָּ֣א מִ/מֶּרְחָ֔ק בֹּעֵ֣ר אַפּ֔/וֹ וְ/כֹ֖בֶד מַשָּׂאָ֑ה שְׂפָתָי/ו֙ מָ֣לְאוּ זַ֔עַם וּ/לְשׁוֹנ֖/וֹ כְּ/אֵ֥שׁ אֹכָֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/027.yaml
  text: Look[a], the name of Yahweh comes from afar, burning with his anger, and with dense smoke; his lips are full of wrath, and his tongue is like a consuming fire.
translation:
  language: zh_hans
  text: 看哪，雅威的名从远方而来！他的怒气燃烧，浓烟升腾[a]；他的双唇充满愤怒，他的舌头像吞噬之火。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这处希伯来语较难确定；也可较直译为“沉重的升起”（或“举起”）。正文的“浓烟升腾”是根据本节燃烧与火焰的语境作出的理解。
    reason: 保留 וְכֹבֶד מַשָּׂאָה 的词汇与句法歧义，并说明正文的烟气理解具有语境依据而非确定的字面义。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意、开启异象场景的语气词。“看哪”既保留指示和强调作用，也符合庄重的现代汉语圣经文体。
- source_word: שֵׁם יְהוָה
  choice: 雅威的名
  rationale: 原文以“雅威的名”为行动主体，而非仅说“雅威”。保留“名”可维持其所包含的显现、声誉和权能等意蕴，不把张力简化掉。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见学术复原音译，区别于源自另一种读法的“耶和华”。
- source_word: בָּא מִמֶּרְחָק
  choice: 从远方而来
  rationale: 直接表达分词所描绘的正在临近之景，同时保持先知诗歌的庄重语调。
- source_word: בֹּעֵר אַפּוֹ
  choice: 他的怒气燃烧
  rationale: אַף 字面与鼻孔有关，在此是表示发怒的惯用语；译作“怒气”传达实际含义，并保留“燃烧”的火焰意象。
- source_word: וְכֹבֶד מַשָּׂאָה
  choice: 浓烟滚滚
  rationale: 该短语词义和句法均较困难。在烈怒与烈火的显现语境中，将其理解为厚重、升腾的烟气，形成自然鲜明的中文画面；脚注保留更贴近字面的另一种可能。
- source_word: שְׂפָתָיו מָלְאוּ זַעַם
  choice: 他的双唇充满愤怒
  rationale: 保留“双唇”这一身体意象，不提前解释为抽象的“言语”；完成式在鲜活的异象描写中用现在状态表达。
- source_word: וּלְשׁוֹנוֹ כְּאֵשׁ אֹכָלֶת
  choice: 他的舌头像吞噬之火
  rationale: 保留舌头与火的明喻，也保留 אֹכָלֶת 所表达的主动吞噬、毁灭力量。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较准确地对应通常复原的 Yahweh 读音，并避免把神名处理成称号。
- issue: 是否保留“名”作为来临的主体
  choice: 保留“雅威的名从远方而来”
  alternative: 简化为“雅威从远方而来”
  rationale: 希伯来文明确说来临的是“雅威的名”。保留这一表达，使神的超越性与他在审判中显现的临在之间的神学张力不被消解。
- issue: 难解短语 וְכֹבֶד מַשָּׂאָה 的具象化程度
  choice: 正文译作“浓烟滚滚”，脚注说明字面可能
  alternative: 译作“举起的重负”或“沉重的负担”
  rationale: 上下文集中使用燃烧、烈怒和吞噬之火的显现意象，因此烟气的理解在语境中较连贯；但原词组本身并不明确，故不把这一解释呈现为毫无争议。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”“从远方而来”保持先知异象的宣告感；正文使用分号组织并列意象。除“吞噬之火”略带诗性外，避免生僻或过度古雅的措辞。
