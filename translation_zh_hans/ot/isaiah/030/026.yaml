  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֤ה אֽוֹר הַ/לְּבָנָה֙ כְּ/א֣וֹר הַֽ/חַמָּ֔ה וְ/א֤וֹר הַֽ/חַמָּה֙ יִהְיֶ֣ה שִׁבְעָתַ֔יִם כְּ/א֖וֹר שִׁבְעַ֣ת הַ/יָּמִ֑ים בְּ/י֗וֹם חֲבֹ֤שׁ יְהוָה֙ אֶת שֶׁ֣בֶר עַמּ֔/וֹ וּ/מַ֥חַץ מַכָּת֖/וֹ יִרְפָּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/026.yaml
  text: And the light of the moon will be like the light of the sun[a], and the light of the sun will be sevenfold, like the light of seven days, on the day when Yahweh binds up the fracture of his people and heals the wound from his blow.
translation:
  language: zh_hans
  text: 月亮的光要像太阳的光；太阳的光要强七倍，如同七日的光。在耶和华包扎他百姓的创伤、医治他击打所造成的伤处的日子，必是如此。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他击打所造成的伤处”也可译作“他击打造成的压伤”或“他击打的创伤”。原文保留伤害意象；此处的“他”最自然是指耶和华，表明他医治自己击打百姓所造成的损伤。
    reason: 说明 מַחַץ מַכָּתוֹ 可有“压伤／创伤”等词汇层面的译法，并保留第三人称单数后缀最自然的指向。
lexical_decisions:
- source_word: וְהָיָה
  choice: 必像／必增强
  rationale: 希伯来语以未来状态引出异象；中文不宜生硬译作“将会是”，分别按两个分句自然表达其将来状态。
- source_word: אוֹר
  choice: 光
  rationale: 此处指月亮和太阳发出的光；“光”直接、自然，也保留原文反复。
- source_word: הַלְּבָנָה
  choice: 月亮
  rationale: 这是诗歌中指月亮的常用词；不按其与“白”相关的词源直译。
- source_word: כְּאוֹר הַחַמָּה
  choice: 像太阳的光
  rationale: 保留明确的比较结构及“光”一词的重复。
- source_word: הַחַמָּה
  choice: 太阳
  rationale: 语境明确指太阳，而非抽象的热力。
- source_word: שִׁבְעָתַיִם
  choice: 增强七倍
  rationale: 该形式表示七倍的程度；添加“增强”使现代汉语顺畅，同时不改变倍增之意。
- source_word: כְּאוֹר שִׁבְעַת הַיָּמִים
  choice: 像七日之光
  rationale: 保留诗意及原文可能具有的含混性，不擅自补成“七日光辉的总和”。
- source_word: בְּיוֹם
  choice: 到那日
  rationale: 自然表达先知话语所指向的特定复兴时刻。
- source_word: חֲבֹשׁ
  choice: 包扎
  rationale: 准确呈现医治创伤的具体动作，也符合现代汉语。
- source_word: שֶׁבֶר
  choice: 创伤
  rationale: 原词可指破裂、骨折或破败；“创伤”与包扎的医疗意象相合，并可涵盖群体所受的损害。
- source_word: עַמּוֹ
  choice: 他百姓
  rationale: 准确表达第三人称阳性单数所属关系和盟约群体含义。
- source_word: מַחַץ מַכָּתוֹ
  choice: 他击打所造成的伤口
  rationale: 将 מַחַץ 理解为击打造成的创伤，并把后缀所指的施打者明确为耶和华；脚注保留另一种句法理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的神名形式，同时与一般名词“主”相区别。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”在现代简体中文圣经传统中最通行，普通读者易于识别；译文仍明确这是专有神名。
- issue: מַכָּתוֹ 中后缀的指向
  choice: 他击打所造成的伤口
  alternative: 他的伤口
  rationale: 将后缀理解为指耶和华，即他医治自己施行击打所造成的损伤，保留审判与复兴并存的神学张力；脚注说明语法上也可将其理解为百姓所受的伤。
translation_notes:
  register: 采用现代、庄重而清晰的先知文学语体。前半节保留“光”的反复和“七日之光”的诗性含混；后半节使用“包扎、创伤、医治、伤口”形成连贯的医疗意象，并保留耶和华既击打又医治的张力。
