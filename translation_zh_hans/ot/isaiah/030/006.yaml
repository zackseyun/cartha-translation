source:
  edition: WLC
  text: מַשָּׂ֖א בַּהֲמ֣וֹת נֶ֑גֶב בְּ/אֶרֶץ֩ צָרָ֨ה וְ/צוּקָ֜ה לָבִ֧יא וָ/לַ֣יִשׁ מֵ/הֶ֗ם אֶפְעֶה֙ וְ/שָׂרָ֣ף מְעוֹפֵ֔ף יִשְׂאוּ֩ עַל כֶּ֨תֶף עֲיָרִ֜ים חֵֽילֵ/הֶ֗ם וְ/עַל דַּבֶּ֤שֶׁת גְּמַלִּים֙ אֽוֹצְרֹתָ֔/ם עַל עַ֖ם לֹ֥א יוֹעִֽילוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/006.yaml
  text: 'An oracle concerning the beasts of the Negev: through a land of distress and hardship[a], of lioness and lion, of viper and flying fiery serpent, they carry their wealth on the shoulders of donkeys and their treasures on the humps of camels[c][b], to a people who cannot profit them.'
translation:
  language: zh_hans
  text: '关于南地牲畜的宣告：[a]


    他们穿过困苦艰难之地，

    那里有母狮和狮子，[b]

    有毒蛇和飞翔的火蛇。

    他们把财物驮在驴的肩上，

    把珍宝驮在骆驼峰上，

    运往那不能使他们得益的民族。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣告”或译“重担”；“南地”也可译作“尼革夫”。
    reason: 原文标题词 מַשָּׂא 兼有“宣告／神谕”和“重担”的语义联想；נֶגֶב 可指具体的尼革夫地区，也可泛指南方。
  - marker: b
    text: 或译“狮子和狮子”。原文用了两个不同的狮子称谓，但这里是否要按性别加以区别，并不确定。
    reason: 保留两个希伯来语狮子词之间真实但难以精确界定的差异。
  - marker: c
    text: 或译“运往那不会帮助他们的民族”。
    reason: יוֹעִילוּ 可表示使人得益，也可表示给予帮助。
lexical_decisions:
- source_word: מַשָּׂא
  choice: 宣告
  rationale: 该词在先知书标题中常指带有权威的神谕或宣告；“宣告”自然、庄重，也避免把“重担”这一可能但较晦涩的词义直接带入正文。
- source_word: בַּהֲמוֹת נֶגֶב
  choice: 南地牲畜
  rationale: בַּהֲמוֹת 指牲畜或走兽，本节语境特别涉及驮运行李的动物；נֶגֶב 既可指具体的南地（尼革夫），也可泛指南方。正文采用传统而自然的地理称呼“南地”。
- source_word: בְּאֶרֶץ צָרָה וְצוּקָה
  choice: 经过困苦艰难之地
  rationale: 介词结合行程语境表示穿越；两个近义词共同描写受困、窘迫而险恶的地域，用“困苦艰难”保留叠加强调。
- source_word: לָבִיא וָלַיִשׁ
  choice: 母狮和雄狮
  rationale: 原文使用两个不同的狮子词，前者有时可指母狮，后者也指狮子；此译在正文中呈现词语差异，同时以脚注承认性别区分并不确定。
- source_word: אֶפְעֶה
  choice: 毒蛇
  rationale: 该词指有毒的蛇；“毒蛇”比具体但未必可确定的蛇类名称更清楚稳妥。
- source_word: שָׂרָף מְעוֹפֵף
  choice: 飞翔的火蛇
  rationale: 尽量保留“灼烧／火”和“飞翔”的鲜明形象，不把不确定的动物所指化约为普通蛇类。
- source_word: חֵילֵהֶם
  choice: 财物
  rationale: חַיִל 可指力量、资源或财富；在使团用驮兽运送礼物的语境中，“财物”最为贴切。
- source_word: עַל כֶּתֶף עֲיָרִים
  choice: 驮在驴肩上
  rationale: 保留 כֶּתֶף“肩”的身体意象，并用“驮”自然表达驮兽运输。
- source_word: עַל דַּבֶּשֶׁת גְּמַלִּים
  choice: 驮在骆驼峰上
  rationale: דַּבֶּשֶׁת 特指骆驼峰；直译保留原文鲜明而具体的平行画面。
- source_word: אֹצְרֹתָם
  choice: 珍宝
  rationale: 该词指储藏的贵重物或宝物；“珍宝”符合外交馈赠和财富运输的语境。
- source_word: עַל עַם לֹא יוֹעִילוּ
  choice: 送给那不能使他们得益的民族
  rationale: עַל 在移动语境中表示趋向；יעל 可指使人获益或提供帮助。“使他们得益”保留效益和帮助两方面的含义，并突出此行徒劳。
theological_decisions:
- issue: 南地危险动物名单的性质
  choice: 按危险荒野中的动物直接翻译，不作寓意化解释。
  alternative: 把某些动物解释为政治势力的象征，或笼统译作野兽和毒蛇。
  rationale: 经文本身着重描绘使团旅途的危险和求援行动的徒劳，并未明确赋予这些动物政治象征意义；具体翻译更能保留先知话语的张力与意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话，并以诗行呈现先知话语的节奏和平行结构。“南地牲畜”保持标题的凝练与一定陌生感；正文通过“驮在”明确牲畜与使团货物的关系。所有实质性词义歧义均在脚注中保留。
