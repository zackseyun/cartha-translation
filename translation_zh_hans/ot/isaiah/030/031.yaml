  text: כִּֽי מִ/קּ֥וֹל יְהוָ֖ה יֵחַ֣ת אַשּׁ֑וּר בַּ/שֵּׁ֖בֶט יַכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/031.yaml
  text: For at the voice of Yahweh Assyria will be shattered[b][a]; with a rod he will strike.
translation:
  language: zh_hans
  text: 因为亚述必因耶和华的声音而惊惶[a]；他必用杖击打亚述。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惊惶”也可译作“崩溃”或“被击碎”；希伯来语动词可表示恐惧、瓦解或破碎。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他必用杖击打”，没有再次明说主语，也未明说宾语；主语最自然地承接为耶和华，宾语则按上下文理解为亚述。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明前述审判宣告的理由；现代汉语中“因为”自然清楚。
- source_word: מִקּוֹל
  choice: 因……的声音
  rationale: 介词מִן在此表示原因或触发因素；既传达因果，也保留神发声所带来的强烈画面。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名的通行音译，以神名而非一般称号呈现。
- source_word: יֵחַת
  choice: 惊溃
  rationale: חתת的尼法勒形可涵盖惊恐、崩溃或破碎；“惊溃”兼顾心理上的恐惧与军事上的瓦解，同时用脚注保留其他可能。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 按上下文指亚述国家或帝国，采用标准中文专名。
- source_word: בַּשֵּׁבֶט
  choice: 用杖
  rationale: שֵׁבֶט可指杖、棍或权杖；此处作为击打和审判的工具，“杖”简洁且保留原文意象。
- source_word: יַכֶּה
  choice: 他必击打亚述
  rationale: נכה的使役式在此意为击打；主语按最近且最自然的先行者理解为耶和华。中文补出宾语“亚述”，使句意完整，但以脚注说明原文未明说主语与宾语。
theological_decisions:
- issue: יַכֶּה的省略主语及宾语所指
  choice: 将主语理解为耶和华，宾语按语境补作亚述：“他必用杖击打亚述。”
  alternative: 可较少补足地译作“他必用杖击打”，也有人可能对句法关系作其他理解。
  rationale: 希伯来文动词是阳性单数，未明说主语；前句的耶和华是最自然的承接对象，亚述则是审判的对象。正文作清楚自然的汉语表达，脚注保留原文省略所产生的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“惊溃”凝练地结合恐惧与瓦解两层含义；分号呈现两个紧密相连的审判动作。所有脚注标记均置于正文相应位置。
