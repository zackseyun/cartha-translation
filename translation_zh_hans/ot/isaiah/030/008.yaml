  rationale: 修订使中文更自然，并更直接对应希伯来文：以“书写板”和“书卷”清楚表达两种载体，以“记在”处理书卷上的正式记录；将末句译为“为将来的日子存留，直到永永远远”，保留其长久保存的目的。脚注b删除没有由词义直接支持的“见证”表述，改为说明原文的时间性强调。
