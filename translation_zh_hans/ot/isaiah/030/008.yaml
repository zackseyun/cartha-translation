reference: Isaiah 30:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַתָּ֗ה בּ֣וֹא כָתְבָ֥/הּ עַל ל֛וּחַ אִתָּ֖/ם וְ/עַל סֵ֣פֶר חֻקָּ֑/הּ וּ/תְהִי֙ לְ/י֣וֹם אַחֲר֔וֹן לָ/עַ֖ד עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/008.yaml
  text: Now come[a], write it before them on a tablet, and inscribe it in a scroll, that it may stand for a later day[b], as a witness forever and ever.
translation:
  language: zh_hans
  text: 现在，来吧！当着他们的面，把这事写在书写板上，又记在书卷上，使它为将来的日子[a]存留，直到永永远远。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “将来的日子”也可译作“末后的日子”或“最后的日子”。
    reason: 保留לְיוֹם אַחֲרוֹן可泛指较后的未来，也可能具有较强末后意味的语义张力。
  - marker: b
    text: 原文将两个表示持续的表达连用，强调这份记录长久存留。
    reason: 说明לָעַד עַד־עוֹלָם的强调性时间表达，不把“见证”作为原文此处的直接词义。
lexical_decisions:
- source_word: עַתָּה בּוֹא
  choice: 现在，来吧
  rationale: עַתָּה表示当前时刻；בּוֹא是阳性单数命令式，在先知话语中可作直接召唤。译作“现在，来吧”保留命令的即时性与语气。
- source_word: כָתְבָהּ
  choice: 把这事写
  rationale: 动词后的阴性单数宾语后缀指向要记录的信息或事件。中文用“这事”自然承接上下文，又不把所指过度限定为某一种文体。
- source_word: עַל־לוּחַ
  choice: 写在版上
  rationale: לוּחַ指供书写的版或板。“版”保留古代书写载体的含义，并避免现代电子“平板”的联想。
- source_word: אִתָּם
  choice: 当着他们的面
  rationale: 此处在公开留下文字凭据的语境中，אֵת的含义宜理解为“与他们同在／在他们面前”；“当着他们的面”在现代汉语中清楚自然。
- source_word: וְעַל־סֵפֶר חֻקָּהּ
  choice: 题在书卷上
  rationale: סֵפֶר在此是可书写的卷册；חקק带有刻写、题写、正式录下的意味。纸卷不宜直译为“雕刻”，故用庄重而自然的“题在书卷上”。
- source_word: וּתְהִי
  choice: 使它……长存
  rationale: 该形式在连续命令之后表达目的或结果。用“使它……长存”既传达存续之意，也符合后接长久时间语的语境。
- source_word: לְיוֹם אַחֲרוֹן
  choice: 留待后来的日子
  rationale: אַחֲרוֹן可指后来、末后的时期；正文采用不预先限定为末世术语的“后来的日子”，并以脚注保留“末后的日子”这一可能。
- source_word: לָעַד עַד־עוֹלָם
  choice: 永永远远
  rationale: 两个表示恒久时间的表达叠用，形成强烈的延续语气。“永永远远”简洁传达这种强调，不另行加入原文未明说的“见证”一词。
theological_decisions:
- issue: לְיוֹם אַחֲרוֹן是否必须具有明确的末世含义
  choice: 后来的日子
  alternative: 末后的日子／最后的日子
  rationale: 该短语既可泛指未来较后的时期，也可能带有末后意味。正文避免把此处固定为技术性的末世用语，脚注则保留较强的末后读法。
- issue: לָעַד是否应译成“作为见证”
  choice: 永永远远
  alternative: 作为长久的见证
  rationale: 在לָעַד עַד־עוֹלָם的连用结构中，לָעַד最自然地表示永久、恒久。上下文确有书面凭据的见证功能，但正文不把这一语境推论写成词义本身；脚注说明其可能的见证作用。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“版”和“书卷”保留古代媒介，以“题”表达正式写录而避免在书卷上“雕刻”的不自然说法。主句保留召唤、两项记录命令以及使记录长存的目的结构。所有脚注标记均已置入正文。
