  naturalness: “题在书卷上”虽可理解，但现代汉语中用于书写记录略显生硬；“记在书卷上”更自然、庄重，也不暗示在卷轴上实际雕刻。“书写板”比单独的“版”更清楚地指古代书写载体。
  terminology: “书卷”恰当地保留了סֵפֶר的古代文献载体含义。“将来的日子”保留לְיוֹם אַחֲרוֹן可指较后未来而未必是末世术语的开放性。末句应按持续时间处理，不应将לָעַד直接释为“见证”。
