base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/002.yaml
  text: who set out to go down to Egypt, but have not asked my mouth, to seek refuge in Pharaoh’s stronghold and to take shelter in the shadow of Egypt.
translation:
  language: zh_hans
  text: 他们下到埃及去，却没有求问我的指示，要在法老的堡垒中寻求庇护，在埃及的荫下避难。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִי לֹא שָׁאָלוּ
  choice: 却没有求问我的口意
  rationale: 保留原文直译色彩及第一人称“我的口”，表达他们没有求问耶和华亲口所出的指示；“口意”使现代汉语读者能理解其所指，同时不把原文改写成较泛化的“求问我”。
- source_word: לָעוֹז בְּמָעוֹז פַּרְעֹה
  choice: 投奔法老的保障
  rationale: 原文以同根词 עוז/מעוז 构成文字呼应，含寻求力量、庇护与堡垒之意；“投奔……的保障”自然传达其政治与安全依赖，虽无法完整复制同根修辞。
- source_word: וְלַחְסוֹת בְּצֵל מִצְרָיִם
  choice: 藏身在埃及的荫下
  rationale: 保留“荫下”的具体庇护意象；“藏身”对应 חסה，表达寻求保护而非普通停留。
- source_word: הַהֹלְכִים לָרֶדֶת מִצְרַיִם
  choice: 他们下到埃及去
  rationale: “下到”保留希伯来语中前往埃及的惯用地理表达；句首分词承接上一节所斥责的人，以“他们”自然呈现。
theological_decisions:
- issue: “我的口”所指为何
  choice: 我的口意
  alternative: 求问我／求问我的指示
  rationale: 原文明确使用“我的口”，语境中说话者是耶和华。译文保留这一具神学分量的拟人表达，又以“意”帮助理解，不进一步界定求问的具体媒介。
- issue: 法老与埃及的庇护是否带有军事同盟含义
  choice: 投奔法老的保障，藏身在埃及的荫下
  alternative: 倚靠法老的堡垒，在埃及的荫庇下寻求保护
  rationale: 译文呈现政治安全依赖，但不把原文未明说的条约、军事援助等细节加入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留“下到埃及”“我的口意”“埃及的荫下”等原文意象，并用平行短句再现诗体节奏。
