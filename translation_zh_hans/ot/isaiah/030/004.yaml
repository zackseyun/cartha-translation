  text: For his officials are in Zoan, and his envoys reach Hanes.
translation:
  language: zh_hans
  text: 因为他的官长已经在琐安，他的使者抵达哈内斯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרָיו
  choice: 他的官长
  rationale: 该词指掌权者、首领或官员；结合出使埃及的政治语境，译作“官长”既贴近原文，也保持庄重自然。
- source_word: מַלְאָכָיו
  choice: 他的使者
  rationale: 此处指受差派执行外交使命的人，而非天使，故译作“使者”。
- source_word: יַגִּיעוּ
  choice: 抵达了
  rationale: 动词表示到达、抵达；与前半句完成式并列时，可按语境表达已经发生的行动。
- source_word: צֹעַן / חָנֵס
  choice: 琐安 / 哈内斯
  rationale: 均为埃及地名，采用音译；“琐安”为中文圣经传统中较熟悉的译名，“哈内斯”按名称音译。
theological_decisions:
- issue: 第三人称单数所有格“他的”所指
  choice: 保留“他的”，不在正文中明说其先行词
  alternative: 释为“犹大王的”或“法老的”
  rationale: 希伯来文本仅使用第三人称单数所有格，具体所指须由上下文判断；为保存原文可能存在的指代张力，不作解释性增补。
- issue: 两分句的时态关系
  choice: 均译为已经到达当地
  alternative: 前句译“在琐安”，后句译“将抵达/抵达”
  rationale: 前句使用完成式，后句使用未完成式，但在诗体平行结构和叙事语境中可共同描绘外交人员已经深入埃及；中文以“已到了……也抵达了……”自然呈现其平行关系，同时不额外推演神学含义。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。保留原文两组人物与两处地名的平行结构；不添加脚注，因为本节没有必须借脚注说明的文本异读或不可保留于正文的歧义。
