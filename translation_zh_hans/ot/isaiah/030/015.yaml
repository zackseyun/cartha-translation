id: ISA.30.15
reference: Isaiah 30:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה קְד֣וֹשׁ יִשְׂרָאֵ֗ל בְּ/שׁוּבָ֤ה וָ/נַ֨חַת֙ תִּוָּ֣שֵׁע֔וּ/ן בְּ/הַשְׁקֵט֙ וּ/בְ/בִטְחָ֔ה תִּהְיֶ֖ה גְּבֽוּרַתְ/כֶ֑ם וְ/לֹ֖א אֲבִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/015.yaml
  text: 'For thus says the Lord GOD[a], the Holy One of Israel: “In returning and rest you will be saved[b]; in quietness and trust will be your strength.” But you were unwilling.'
translation:
  language: zh_hans
  text: '因为主耶和华——以色列的圣者如此说：


    “你们回转[a]、安歇，就必得救[b]；


    你们的力量将是安静和信靠。”


    但你们不肯。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“悔改”或“归回”。希伯来文直译为“回转”，可包括离开原有道路、归向神。
    reason: lexical_alternative
  - marker: b
    text: 或译“必蒙解救”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 按现代中文圣经传统表达这一复合神圣称号；“主”对应 אֲדֹנָי，“耶和华”对应四字神名 יהוה，并保留两者的区别。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 准确保留以赛亚书反复使用的称号，兼顾神的圣洁及其与以色列的关系。
- source_word: בְּשׁוּבָה
  choice: 回转
  rationale: 保留 שׁוב 的具体意象与语义广度，可指回头、归向神或悔改，不在正文中将含义限定为纯粹内在的悔罪。
- source_word: וָנַחַת
  choice: 安歇
  rationale: 表达安稳休息、停止躁动的状态，并与“回转”自然并列。
- source_word: תִּוָּשֵׁעוּן
  choice: 就必得救
  rationale: 反映 ישׁע 的被动义“被拯救”，同时保留其既可指现实中的解救，也可具有更广救恩含义的幅度。
- source_word: בְּהַשְׁקֵט
  choice: 安静
  rationale: 表达安静、平稳而不躁动的状态，符合本节与依靠政治军事手段相对照的语境。
- source_word: וּבְבִטְחָה
  choice: 信靠
  rationale: 比“安全”更能体现倚赖的关系性含义，也比单纯的“自信”更符合上下文所指向的对神的倚靠。
- source_word: תִּהְיֶה גְּבוּרַתְכֶם
  choice: 你们的力量在于
  rationale: 自然呈现系词结构，保留 גְּבוּרָה 的“力量、能力”之义，并突出真正力量的所在。
- source_word: וְלֹא אֲבִיתֶם
  choice: 但你们不肯
  rationale: אָבָה 表示愿意、同意；“不肯”简洁准确地表达主观上的不愿接受，并保留与前述应许的强烈转折。
theological_decisions:
- issue: בְּשׁוּבָה 是否应明确译作“悔改”
  choice: 正文译作“回转”
  alternative: 悔改；归回
  rationale: 该词根可包含悔改，但本段也涉及从倚赖政治军事计策转回、安歇并信靠神。“回转”保留行动、关系及悔改等多重可能，不把经文收窄为单一的内在道德行为。
- issue: תִּוָּשֵׁעוּן 的拯救范围
  choice: 译作“必得救”
  alternative: 必蒙解救；必获救
  rationale: ישׁע 在此可指犹大在危局中蒙解救，也带有圣约救恩的较广意涵。“得救”保留这层张力，脚注注明较具处境性的译法。
- issue: “安静和信靠”与力量的关系
  choice: 译作“你们的力量在于安静和信靠”
  alternative: 你们必因安静信靠而有力量
  rationale: 希伯来文直接说安静与信靠将成为他们的力量；所选译法避免额外明确因果机制，同时自然表达真正力量不在外援或军力，而在安静信靠。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。诗行保持两组平行结构；“回转、安歇”和“安静、信靠”简洁有力。末句用“但你们不肯”保留原文突然而鲜明的责备语气。所有脚注标记均置于对应词语之后。
