  text: וְ/הָיָ֣ה עַל כָּל הַ֣ר גָּבֹ֗הַ וְ/עַל֙ כָּל גִּבְעָ֣ה נִשָּׂאָ֔ה פְּלָגִ֖ים יִבְלֵי מָ֑יִם בְּ/יוֹם֙ הֶ֣רֶג רָ֔ב בִּ/נְפֹ֖ל מִגְדָּלִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/025.yaml
  text: And on every high mountain and on every lofty hill there will be streams[a], channels of water, on the day of great slaughter, when the towers fall.
translation:
  language: zh_hans
  text: 在每一座高山上，在每一座高耸的山冈上，都必有溪流和水道[a]；在大杀戮、塔楼倒塌的日子，也是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水道”也可译作“水流”“小河”或“细流”。这里所译的希伯来语用词较为罕见，确切含义不完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 都必有
  rationale: 按上下文作存在句处理，说明高山和山冈上将出现水流；“必”也保留先知性未来陈述的语气。
- source_word: הַר גָּבֹהַ
  choice: 高山
  rationale: 现代汉语中自然、准确的地貌表达。
- source_word: גִּבְעָה נִשָּׂאָה
  choice: 高耸的山冈
  rationale: 保留“被举起、高升”的空间意象，同时符合现代汉语地貌描写。
- source_word: פְּלָגִים
  choice: 溪流
  rationale: 此处指分流、流动的水体；“溪流”清楚自然，并与后面的“水道”有所区别。
- source_word: יִבְלֵי מָיִם
  choice: 水道
  rationale: 这个较罕见的词组确切含义不完全确定，可能指水道、小河或细流；正文采用简洁而能体现水流路径的“水道”，脚注保留其他可能。
- source_word: בְּיוֹם הֶרֶג רָב
  choice: 在大屠杀的日子
  rationale: 保留原文严峻的审判措辞及时间结构，不作弱化。
- source_word: בִּנְפֹל מִגְדָּלִים
  choice: 众塔倒塌的时候
  rationale: 将介词加不定式结构自然地译作时间从句；“众塔”表达原文无冠词复数的泛指意义。
theological_decisions:
- issue: 丰沛水流与审判景象之间的关系
  choice: 并置祝福性的水流景象与“大屠杀、众塔倒塌”的审判景象，不解释两者的具体时序或神学关系。
  alternative: 明确译成审判之后的末世复兴，或解释为审判期间的供应。
  rationale: 希伯来文只把丰沛水流和毁灭景象并列，没有明确说明这是审判之后、之中，还是以其他方式相关；译文应保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“溪流和水道”保留原文两个近义水流词的并列；分号呈现丰沛景象与审判时刻之间突然而有张力的连接。
