id: ISA.30.5
reference: Isaiah 30:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֣ל הבאיש עַל עַ֖ם לֹא יוֹעִ֣ילוּ לָ֑/מוֹ לֹ֤א לְ/עֵ֨זֶר֙ וְ/לֹ֣א לְ/הוֹעִ֔יל כִּ֥י לְ/בֹ֖שֶׁת וְ/גַם לְ/חֶרְפָּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/005.yaml
  text: Everyone is put to shame because of a people that cannot profit them[a]—who are not for help and not for profit, but for shame and also for reproach.
translation:
  language: zh_hans
  text: 众人都因一个不能使他们得益的民族而蒙羞[a]；那民族既不能帮助他们，也不能使他们得益，反倒使他们蒙羞受辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙羞”所译的希伯来词含义较难确定，也可表示“变得可憎”或“发臭”。鉴于本节后半句提到“蒙羞受辱”，这里采用“蒙羞”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: 众人都
  rationale: 按分配意义表达涉及此事者的全体，现代汉语自然且保留范围。
- source_word: הבאיש
  choice: 蒙羞
  rationale: 该词形式和语义较难；虽可涉及“变得可憎、发臭”，但本节与“羞耻、凌辱”的平行关系表明，此处以外在受辱、蒙羞为宜，而非内心羞愧。
- source_word: עַל
  choice: 因
  rationale: 此处表示原因或缘由，即他们因这个民族而蒙羞。
- source_word: עַם
  choice: 一个……民族
  rationale: 保留希伯来文单数集合名词和不定表达；上下文所指虽为埃及，本节不直接补明。
- source_word: לֹא יוֹעִילוּ לָמוֹ
  choice: 不能使他们得益
  rationale: יעל表示有用、有益；“使……得益”兼顾使役意味，并与后面的同根词重复呼应。
- source_word: לְעֵזֶר
  choice: 帮助他们
  rationale: 以自然汉语表达“作为帮助/带来帮助”，保持与下句“使他们得益”的并列。
- source_word: לְהוֹעִיל
  choice: 使他们得益
  rationale: 与前面的יוֹעִילוּ采用相同译词，保留原文同根复现。
- source_word: כִּי
  choice: 反倒
  rationale: 这里引出与“帮助、得益”相反的实际结果，译作“反倒”清楚传达转折。
- source_word: לְבֹשֶׁת
  choice: 蒙羞
  rationale: 表达羞耻、丢脸的结果，并与首句形成语义呼应。
- source_word: וְגַם
  choice: ……受辱
  rationale: 合并于“蒙羞受辱”的并列结构中；“也”的添加意味由两个递进并列结果自然体现。
- source_word: לְחֶרְפָּה
  choice: 受辱
  rationale: חרפה涉及公开的羞辱、耻辱或责骂；“受辱”在现代汉语中准确自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号保留原句两部分的解释关系；后半句适度调整为汉语动词结构，同时保留“得益”的词语复现和“帮助—得益—蒙羞—受辱”的对照。
