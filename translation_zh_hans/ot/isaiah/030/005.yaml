  source_fidelity: 译文准确呈现了全称主语、因果关系（因这个民族）、该民族无益的性质，以及“帮助／得益”与“蒙羞／受辱”的强烈对照。将 difficult 的 הבאיש 译为“蒙羞”，并以脚注保留“变得可憎”或“发臭”的词义可能，符合上下文而未掩盖文本困难。
