  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לָ/כֵ֞ן יְחַכֶּ֤ה יְהוָה֙ לַֽ/חֲנַנְ/כֶ֔ם וְ/לָ/כֵ֥ן יָר֖וּם לְ/רַֽחֶמְ/כֶ֑ם כִּֽי אֱלֹהֵ֤י מִשְׁפָּט֙ יְהוָ֔ה אַשְׁרֵ֖י כָּל ח֥וֹכֵי לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/018.yaml
  text: Therefore Yahweh waits to be gracious to you[a], and therefore he rises up to show you mercy; for Yahweh is a God of justice. Blessed are all who wait for him.
translation:
  language: zh_hans
  text: 因此，雅威等候着要施恩给你们；因此，他起来，要怜悯你们。[a] 因为雅威是公正的上帝。凡等候他的，都是有福的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因此，他被高举，为要怜悯你们”；或：“因此，他高举自己，为要怜悯你们。”
    reason: 原文 יָרוּם 可理解为“起来”，也可理解为“被高举”或“高举自己”；这些读法分别突出上帝采取行动或上帝受尊崇。
lexical_decisions:
- source_word: וְלָכֵן
  choice: 因此
  rationale: 表达推论或结果关系，并保留原文两次出现所形成的修辞呼应。
- source_word: יְחַכֶּה
  choice: 等候着
  rationale: חכה 的基本义是“等候”。此处保留雅威暂缓施恩所形成的张力，不进一步解释其动机；并与末句“等候他的”相呼应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: לַחֲנַנְכֶם
  choice: 要施恩给你们
  rationale: חנן 表示施恩、赐予恩惠；“施恩”自然庄重，并与下句 רחם 所表达的怜悯有所区分。
- source_word: יָרוּם
  choice: 起来
  rationale: רום 的 Qal 形式可指升高或起来；在与施行怜悯的不定式相连时，“起来”较自然地呈现采取行动的图像，同时在脚注保留“被高举／高举自己”的可能。
- source_word: לְרַחֶמְכֶם
  choice: 怜悯你们
  rationale: רחם 表示怜悯、同情；“怜悯你们”是自然而庄重的表达，也避免与前面的“施恩”完全合并。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述宣告的根据，现代汉语中用“因为”清楚自然。
- source_word: אֱלֹהֵי מִשְׁפָּט
  choice: 公正的上帝
  rationale: 构造短语描述上帝的品格；מִשְׁפָּט 在此侧重公正、公义的治理，“公正的上帝”符合现代汉语谓语表达。
- source_word: אַשְׁרֵי
  choice: 都是有福的
  rationale: 保留智慧文学中祝福宣告的惯用语气，比“快乐”更能承载原文的宗教与盟约意味。
- source_word: כָּל
  choice: 凡
  rationale: “凡……的”自然表达全称范围，与复数分词相称。
- source_word: חוֹכֵי
  choice: 等候
  rationale: 与本节前半同源动词 יְחַכֶּה 对应；重复译作“等候”，保留“雅威等候—人等候雅威”的文学呼应。
- source_word: לוֹ
  choice: 他
  rationale: 在“等候他”这一结构中自然表达关系指向，并清楚回指雅威。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；译作“雅威”保留专名性质，不用称号“主”替代。
- issue: יָרוּם 在本节中的含义
  choice: 他起来
  alternative: 他被高举／他高举自己
  rationale: 该词既可表达升起、起来，也可表达被高举或高举自己。上下文与“怜悯你们”的行动目的相连，正文采用“起来”较符合平行句的动态语势；但原文关于行动与尊崇之间的歧义真实存在，故以脚注保留。
- issue: 雅威“等候”与人的“等候”之间的张力
  choice: 两处均译作“等候”
  alternative: 首处译作“迟延”或“期待”，末处译作“盼望”
  rationale: 原文有意重复 חכה 词根。统一译法可保留神等候施恩与人等候神之间的神学和文学张力，不擅自把前者解释为渴望或迟延。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“施恩”与“怜悯”分别对应 חנן 和 רחם；两次“等候”保留原文词根呼应。脚注标记置于相关分句之后，正文中的 [a] 与脚注完全对应。
