base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/021.yaml
  text: And your ears shall hear a word behind you[a], saying, “This is the way; walk in it,” when you turn to the right and when you turn to the left.
translation:
  language: zh_hans
  text: 你必听见从你身后传来的话，说：“这是道路；你们要走在这条路上。”当你向右转或向左转时，你都会听见。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句的希伯来文较难确定，也可译作：“当你向右或向左走的时候。”大意是：无论将往哪一边走，都会得到指引。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָזְנֶיךָ תִּשְׁמַעְנָה
  choice: 你必听见
  rationale: 希伯来文直译为“你的双耳必听见”。中文以“你必听见”表达最自然，同时保留先知应许的将来语气；没有另行译出“双耳”，以免显得生硬。
- source_word: דָבָר
  choice: 有话
  rationale: דָבָר 在这里指听见的话语或信息。“有话”简洁自然，不进一步限定说话者或传达机制。
- source_word: מֵאַחֲרֶיךָ
  choice: 从你身后传来
  rationale: 保留声音来自听者身后的鲜明方位意象，并补出中文听觉语境中自然的“传来”。
- source_word: זֶה הַדֶּרֶךְ
  choice: 这是正路
  rationale: דֶּרֶךְ 可指道路或当行的方向。语境中的指引意味使“正路”在现代中文中自然，同时仍可兼具具体路线与人生行径的含义。
- source_word: לְכוּ בוֹ
  choice: 要行在其中
  rationale: לכוּ 字面为“你们要走”，בוֹ 为“在其中”。“行在其中”保留圣经语体及行为道路的双重意象；复数命令所指的群体由上下文体现。
- source_word: כִּי תַאֲמִינוּ וְכִי תַשְׂמְאִילוּ
  choice: 无论你向右还是向左，都会听见
  rationale: 末句两个动词形成向右、向左的平行结构，但 תַאֲמִינוּ 的词形和具体句法较难确定。此译按语境表达：不论将向哪一边行，指引都会临到，并用“都会听见”使中文句意完整。
theological_decisions:
- issue: 身后传来的话由谁、以何种方式发出
  choice: 只译作从身后传来的引导之言，不指明说话者或机制
  alternative: 明确译成教师的声音、先知的训诲或内心的感动
  rationale: 本节本身没有明确交代说话者及引导方式。保留这种开放性，可避免加入经文未明说的神学机制。
- issue: “道路”的具体性质
  choice: 保留可兼指实际方向与合宜行径的道路意象
  alternative: 仅解释为道德生活方式或具体行路路线
  rationale: 上下文同时使用听觉引导和左右方向的图像，不宜把道路只限定为一种含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这是正路，要行在其中”略带圣经语体，以保留原文道路与行为方式相互交叠的意象；其余句式力求自然清楚。
