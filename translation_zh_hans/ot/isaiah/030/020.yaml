base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/020.yaml
  text: And the Lord will give you bread of distress and water of oppression[a], yet your teacher will no longer hide himself[b], and your eyes will see your teacher.
translation:
  language: zh_hans
  text: 主必赐给你们患难的饼和困苦的水[a]；但你的教师不再隐藏[b]，你的眼睛必看见你的教师。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难的饼”和“困苦的水”，或译“艰难的饼”和“压迫的水”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文也可理解为“你的教师们不再被隐藏”；传统上另译“你的教师不再退到角落里”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是对上帝的尊称；译作“主”符合现代中文圣经语体，又不额外扩充原文。
- source_word: לֶחֶם צָר
  choice: 困苦的饼
  rationale: 保留“饼”的具体比喻，并以“困苦”表达צָר在此处所指的艰难、患难。
- source_word: מַיִם לָחַץ
  choice: 压迫的水
  rationale: 保留与“困苦的饼”平行的结构；“压迫”较具体地传达לָחַץ所含的压力、欺压或苦难之意。
- source_word: יִכָּנֵף
  choice: 隐藏
  rationale: 该词在此很可能表示被遮蔽或隐藏；中文“隐藏”可自然保留其语态和主语关系，而不采用较具解释性的“退到角落”。
- source_word: מוֹרֶיךָ
  choice: 你的教师
  rationale: 原词形态上容许复数理解，也可能指单数或集合性的教师；正文依直接语境采用单数，另在脚注保留复数读法。
- source_word: עֵינֶיךָ רֹאוֹת
  choice: 你必亲眼看见
  rationale: 自然表达希伯来语“你的眼睛看见”所强调的直接目睹，同时不增添解释。
theological_decisions:
- issue: מוֹרֶיךָ（“你的教师”）所指的身份
  choice: 正文采用未明确身份、未作神圣化标示的“你的教师”
  alternative: “你的教师们”（人间的教导者或先知），或指向上帝的单数教师
  rationale: 上下文及词形容许不止一种理解。正文不明确其身份，也不通过特殊称谓强行确定神学所指，以保留原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主虽然……却……”把希伯来语并列关系按上下文自然呈现为让步转折；保留饼与水的苦难意象。第二人称在本节由复数“你们”转为单数“你”，译文依原文保留这一变化。
