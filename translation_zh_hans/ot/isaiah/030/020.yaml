  rationale: 修订删除原文未明说的让步词“虽然”，以“主必……；但……”保留希伯来文陈述与后句的对比。用“患难的饼和困苦的水”维持原有意象、平行及苦难含义，并使现代普通话更自然。保留“教师”的单数主文与脚注中的复数和传统替代读法，不界定其身份。
