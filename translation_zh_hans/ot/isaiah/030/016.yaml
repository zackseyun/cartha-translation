language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תֹּ֨אמְר֥וּ לֹא כִ֛י עַל ס֥וּס נָנ֖וּס עַל כֵּ֣ן תְּנוּס֑וּ/ן וְ/עַל קַ֣ל נִרְכָּ֔ב עַל כֵּ֖ן יִקַּ֥לּוּ רֹדְפֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/016.yaml
  text: But you said[a], “No, for we will flee on horses”—therefore you will flee; and, “We will ride on swift horses”—therefore your pursuers will be swift.
translation:
  language: zh_hans
  text: 你们却说：“不！我们要骑马逃跑。”所以，你们必定逃跑；又说：“我们要骑快马。”所以，追赶你们的也必飞快。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמְרוּ
  choice: 你们却说
  rationale: 叙事连接词在上下文中带有转折意味，与前文上主的警告及百姓的回应形成对照；“却”自然表达这一语用功能。
- source_word: לֹא כִּי
  choice: 不！我们要……
  rationale: לֹא表达坚决拒绝；כִּי在此引出他们反而坚持采取的行动。汉语用独立的“不！”保留强烈否定，再直接陈述主张，比生硬译作“不，因为”更自然。
- source_word: עַל סוּס
  choice: 骑马
  rationale: 希伯来文虽用单数，但属类称用法；现代汉语“骑马”本身可表达泛指，无须改成复数。
- source_word: נָנוּס / תְּנוּסוּן
  choice: 逃跑 / 必定逃跑
  rationale: 重复使用“逃跑”保留同根词的反讽：他们想靠马逃脱，审判却宣告他们果真要逃跑。“必定”体现预言式结果的确定性。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 两次均译作“所以”，保留原文重复的因果结构和审判性的反转。
- source_word: עַל קַל
  choice: 骑快马
  rationale: קַל字面为“轻快的、迅速的”，名词由上文“马”补足。汉语补出“马”可避免“骑快的”这一不自然表达，同时保留上下文所暗示的坐骑。
- source_word: נִרְכָּב
  choice: 我们要骑
  rationale: 该动词在此指骑乘坐骑；与补出的“快马”搭配，构成自然、简洁的现代汉语。
- source_word: יִקַּלּוּ רֹדְפֵיכֶם
  choice: 追赶你们的也必飞快
  rationale: “飞快”对应速度之快，并与“快马”形成明显的词义呼应；“追赶你们的”准确呈现作名词使用的分词，也比抽象的“追赶者”更口语自然。
theological_decisions:
- issue: 人的军事自救与审判性反转
  choice: 保留两组“我们要……所以你们必……”的平行和反讽
  alternative: 将经文解释性扩写为他们因不信靠上主而必受惩罚
  rationale: 原文以精炼的言语反转表达审判，没有在本节明说全部神学因由；译文不额外加入解释，以保留上下文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不！”独立成句，表现百姓坚决拒绝；重复“逃跑”和“所以”保留希伯来文的修辞回响。“快马／飞快”尽量再现קַל与יִקַּלּוּ的词义呼应。
