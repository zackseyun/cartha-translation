base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/024.yaml
  text: And the oxen and the donkeys that work the ground will eat seasoned fodder[b][a], which has been winnowed with shovel and fork.
translation:
  language: zh_hans
  text: 耕地的牛和驴必吃调制的饲料[a]；这饲料是用铲子和扬谷叉扬簸过的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“加盐的饲料”。希伯来语形容词可能更具体地指经过加盐、调味或其他处理而改善的饲料。
    reason: lexical_alternative
  - marker: b
    text: 原文列出两种扬簸用的农具，传统上常译作“铲子和叉子”或“铲子和扬谷叉”。
    reason: cultural_note
lexical_decisions:
- source_word: הָאֲלָפִים
  choice: 牛
  rationale: 这里与驴并列，并由“耕种土地”限定，所指是用于农耕的牛；现代汉语用“牛”自然清楚，无须限定为泛指牲畜或幼公牛。
- source_word: הָעֲיָרִים
  choice: 驴
  rationale: 指用于耕作或驮运的驴，是现代汉语的常用表达。
- source_word: עֹבְדֵי הָאֲדָמָה
  choice: 耕种土地的
  rationale: 保留分词短语对这些牲畜农耕功能的描述，也保持具体的土地意象。
- source_word: בְּלִיל
  choice: 饲料
  rationale: 指为牲畜配制或混合的饲料；“饲料”比“草料”范围更合适，也比古雅说法更易懂。
- source_word: חָמִיץ
  choice: 调制的
  rationale: 该词可能表示饲料经过加盐、调味、发酵或其他改善处理；“调制的”既表达特别处理过，又不武断限定具体工艺。
- source_word: יֹאכֵלוּ
  choice: 必吃
  rationale: 在本段应许丰盛的语境中表达将来的确定情形；“必”保留预告语气。
- source_word: אֲשֶׁר זֹרֶה
  choice: 这饲料是……扬过的
  rationale: 希伯来语形式为主动表达，但饲料是加工对象；汉语采用被动关系句更自然。“扬过”保留扬簸、抛扬处理的农业图景，而不额外断定已完全除净。
- source_word: בָרַחַת
  choice: 铲子
  rationale: 指扬簸谷物或饲料时使用的一种铲状农具；“铲子”是普通读者易懂的近似对应。
- source_word: וּבַמִּזְרֶה
  choice: 扬谷叉
  rationale: 指用于扬簸的叉状农具；加上“扬谷”可明确其用途，并与普通叉子区分。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“耕种土地”保留农耕场景；“调制的”有意保留 חָמִיץ 所指具体处理方式的不确定性。两个脚注标记均置于其直接解释的词句之后。
