revisions:
- from: 他们对先见[a]说：“不要看见！”又对见异象的说：“不要为我们看见正直的事；要对我们说悦耳的话[b]，看见虚妄的异象！”
  to: 他们对先见[a]说：“不要看见！”又对见异象的人说：“不要为我们看见正直的信息；要对我们说悦耳的话[b]，看见虚妄的事！”
  rationale: 修订仅处理两处可安全改善之处：以“见异象的人”提升现代汉语自然度；以“虚妄的事”避免把原文的欺骗性、迷惑性内容过度限定为“异象”。“正直的信息”使汉语搭配更顺畅，并保留原词关于正直、正确的语义范围。脚注标记仍各自紧随所说明的正文词语。
