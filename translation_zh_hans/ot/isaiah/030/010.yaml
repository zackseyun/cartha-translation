base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/010.yaml
  text: who say to the seers[a], “Do not see,” and to the visionaries, “Do not envision for us what is right; speak to us smooth things[b]; envision illusions.”
translation:
  language: zh_hans
  text: 他们对先见[a]说：“不要看见！”又对见异象的人说：“不要为我们看见正直的信息；要对我们说悦耳的话[b]，看见虚妄的事！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先见”指有先知性看见的人；原文在“先见”和“看见”之间使用同一词根。
    reason: lexical_wordplay
  - marker: b
    text: “悦耳的话”原文直译为“平滑的话”，可指顺耳、讨好或奉承的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים / תִרְאוּ
  choice: 先见 / 看见
  rationale: רֹאִים是ראה的主动分词，在此指承担先知性职分的人；译作“先见”符合中文圣经语境，并以“看见”对应同根动词תִרְאוּ，保留原文的词根呼应。
- source_word: חֹזִים / תֶחֱזוּ
  choice: 见异象的 / 看见……异象
  rationale: 两者同出חזה，带有先知性看见的意味。中文难以在自然表达中用同一词根同时构成称谓和动词，故以“见异象的”与“看见……异象”维持语义呼应，并与前面的ראה词组略作区分。
- source_word: נְכֹחוֹת
  choice: 正直的事
  rationale: 该词指笔直、正直、正确之事；“正直的事”既保留道德上的正直，也不排除真实、正确的含义。
- source_word: דַּבְּרוּ
  choice: 说
  rationale: 直接表达复数祈使语气，符合现代汉语引语中的自然措辞。
- source_word: חֲלָקוֹת
  choice: 悦耳的话
  rationale: 字面为“平滑的事/话”，语境中指顺耳、讨好、不会令人不安的信息。“悦耳的话”在现代汉语中自然，并由脚注保留字面意象及奉承意味。
- source_word: מַהֲתַלּוֹת
  choice: 虚妄的异象
  rationale: 该名词表示欺骗、迷惑或虚妄之物；与חזה搭配时译作“虚妄的异象”，既符合视觉语境，也保留信息不真实、会误导人的含义。
- source_word: אֲשֶׁר אָמְרוּ
  choice: 他们……说
  rationale: 这是承接上文、刻画悖逆百姓的关系从句。单节呈现时用“他们……说”自然；时态不限定为一次性的过去言语。
theological_decisions:
- issue: 百姓所拒绝之启示的性质
  choice: 将נְכֹחוֹת译为“正直的事”
  alternative: “真实的话”“正确的事”“直率的话”
  rationale: 原词兼有笔直、正直和正确的范围。“正直的事”保留道德与事实两方面的张力，不把经文缩窄为单纯的命题真理或说话方式。
- issue: 两个先知性视觉称谓的区别
  choice: 分别译作“先见”和“见异象的”
  alternative: 两者都译作“先见”或“先知”
  rationale: 原文平行使用ראה与חזה两个相关但不同的词根；区别翻译可反映原文措辞，又不暗示两类人物必然具有不同的神学职分。
- issue: מַהֲתַלּוֹת所指的虚假性质
  choice: 译作“虚妄的异象”
  alternative: “欺骗”“幻象”“谬妄”
  rationale: “虚妄”保留内容不实、空幻并可能误导人的多重含义，避免断定这些信息必定是有意欺诈，或仅是无意错觉。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“先见”保留经文语体和先知性称谓；其余表达尽量自然。两个感叹式禁令和命令用标点强化原文直接、挑衅的语气。所有脚注标记均已置于正文对应位置。
