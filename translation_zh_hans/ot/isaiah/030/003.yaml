base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/003.yaml
  text: Then Pharaoh’s stronghold will become your shame[b][a], and refuge in Egypt’s shadow your humiliation.
translation:
  language: zh_hans
  text: 那么，法老的庇护必成为你们的羞耻[a]；在埃及的荫下寻求庇护，也必成为你们的耻辱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “庇护”也可译作“保障”或“堡垒”。希伯来语 מָעוֹז 可指提供力量或保护的人、事物，或防御之所。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在埃及的影子下”；这是以荫蔽比喻寻求埃及的保护。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: 那么……必成为
  rationale: 结合上文的先知警告，此处表示随之而来的未来后果；“必成为”比单纯的“是”更自然地传达结果意味。
- source_word: לָכֶם
  choice: 你们的
  rationale: 此处介词短语表示事情对听众造成的不利结果；用领属结构“你们的羞耻”符合现代汉语表达。
- source_word: מָעוֹז
  choice: 保障
  rationale: 该词可指力量、防御之所或庇护来源。“保障”既表达法老被倚仗为保护力量，也避免与下一分句的 חָסוּת 完全合并。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代汉语中通行的埃及君王称号译法。
- source_word: לְבֹשֶׁת
  choice: 羞耻
  rationale: 表达因错误倚靠而招致的羞愧，并与后半句相关但不同的 כְּלִמָּה 构成平行。
- source_word: וְהֶחָסוּת
  choice: 投靠
  rationale: 该名词表示寻求庇护或避难；汉语用动词性表达“投靠”更自然，并保留主动寻求埃及保护的含义。
- source_word: בְּצֵל
  choice: 在……的荫下
  rationale: 保留原文以遮荫喻保护的具体意象，同时符合较庄重的现代汉语。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 采用通行地名译法，并与“荫下”构成领属关系。
- source_word: לִכְלִמָּה
  choice: 耻辱
  rationale: 该词与 בֹּשֶׁת 意义相近，但并非同一个词；译作“耻辱”可保留平行中的细微变化。
theological_decisions:
- issue: 是否用不同汉语词语呈现两个平行的羞耻名词
  choice: 将 בֹּשֶׁת 译为“羞耻”，将 כְּלִמָּה 译为“耻辱”
  alternative: 两处都译为“羞耻”或“耻辱”
  rationale: 原文有意使用两个意义相近但不同的名词。保留词语变化能够反映希伯来语的平行修辞，又不额外引入神学解释。
- issue: 如何理解“埃及的荫下”
  choice: 保留为保护意象，不明说具体政治或军事机制
  alternative: 意译为“寻求埃及的保护”
  rationale: “荫”在语境中喻指保护，但原文仍保留具体意象；正文保存此张力，脚注说明其隐喻作用。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那么”承接上文的警告；“必成为”体现预告后果的语气。正文保留“荫下”的诗性隐喻，并以“羞耻／耻辱”呈现原文平行词语的细微差别。
