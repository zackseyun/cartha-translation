  text: וְ/טִמֵּאתֶ֗ם אֶת צִפּוּי֙ פְּסִילֵ֣י כַסְפֶּ֔/ךָ וְ/אֶת אֲפֻדַּ֖ת מַסֵּכַ֣ת זְהָבֶ֑/ךָ תִּזְרֵ/ם֙ כְּמ֣וֹ דָוָ֔ה צֵ֖א תֹּ֥אמַר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/022.yaml
  text: And you will defile the silver overlay of your carved idols and the gold plating of your cast images. You will scatter them like a menstrual cloth; you will say to them, “Go out!”
translation:
  language: zh_hans
  text: 你们要玷污雕刻偶像的银包层，以及铸像的金包层；你们要把它们像经期不洁之物一样抛开，并对它说：“出去！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְטִמֵּאתֶם
  choice: 你们要玷污
  rationale: 使役含义在语境中指把偶像视为污秽、加以亵弃；用“玷污”保留原文与礼仪不洁相关的语义。
- source_word: צִפּוּי פְּסִילֵי כַסְפֶּךָ
  choice: 雕刻偶像所包的银
  rationale: צִפּוּי 指覆盖层，פְּסִילִים 指雕刻的偶像；“所包的银”自然表达银质包层。
- source_word: אֲפֻדַּת מַסֵּכַת זְהָבֶךָ
  choice: 铸造神像所镀的金
  rationale: אֲפֻדָּה 在此指覆盖、包覆，מַסֵּכָה 指铸造的像；译为“所镀的金”符合偶像外覆金层的图景。
- source_word: תִּזְרֵם
  choice: 你们要把它们丢弃
  rationale: 动词 זרה 可指扬散、抛撒；此处表现彻底弃绝偶像，“丢弃”比字面“撒散”更符合现代汉语，同时保留处置、排除之意。
- source_word: כְּמוֹ דָוָה
  choice: 像丢弃经期用的污布一样
  rationale: דָוָה 与经期的不洁有关；结合丢弃动作，明示为经期用的污布，保留原文强烈的厌弃比喻。
- source_word: צֵא
  choice: 出去
  rationale: 保留命令语气，拟人化地驱逐偶像。
theological_decisions:
- issue: 末尾代词 לֹו 的单数形式与前文复数对象之间的张力
  choice: 对它们说
  alternative: 对它说
  rationale: 希伯来语形式为阳性单数，但语义上回指前述偶像及其覆层的整体；中文用复数使指代清楚，也不改变彻底弃绝偶像的重点。
- issue: 经期不洁比喻的表达强度
  choice: 经期用的污布
  alternative: 污秽之物
  rationale: 原文明确调用与月经相关的不洁意象；不将其泛化，以保留先知话语刻意强烈、令人厌弃的修辞。
translation_notes:
  register: 采用庄重而清晰的现代普通话。“玷污”“偶像”“铸造神像”保持经文语域；“经期用的污布”直接但不粗俗，传达原文强烈的弃绝意象。原文第二人称后缀为单数，而谓语为复数，中文统一译作“你们”，符合对群体的 خطاب。
