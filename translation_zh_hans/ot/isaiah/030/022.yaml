revisions:
- from: 你们要玷污雕刻偶像所包的银，以及铸造神像所镀的金；你们要把它们丢弃，像丢弃经期用的污布一样，并对它们说：“出去！”
  to: 你们要玷污雕刻偶像的银包层，以及铸像的金包层；你们要把它们像经期不洁之物一样抛开，并对它说：“出去！”
  rationale: 修订使“覆盖层”的修饰关系清楚，保留 זרה 所表达的抛开、驱散式弃绝，并避免把 דָוָה 限定为文本没有明说的“布”。末句改用单数“它”，对应原文 לֹו，同时不武断规定其究竟指单一偶像还是作为整体看待的偶像物件。
