review_pass:
  verdict: revise
  source_fidelity: 草稿整体准确传达了偶像包层被视为污秽并彻底弃绝的意象。但“经期用的污布”把原文 כְּמוֹ דָוָה 所指的经期不洁物明确限定为“用的布”，超出了希伯来文本本身较为简略且可有不同理解的措辞；末句 לֹו 为单数，宜在中文中保留这一形式。
  naturalness: “雕刻偶像所包的银”与“铸造神像所镀的金”略显绕且“所包／所镀”关系不够清晰。改为“雕刻偶像的银包层”和“铸像的金包层”更自然，同时准确表达覆盖层。“像……一样抛开”也比重复“丢弃”更紧凑。
  terminology: “玷污”“偶像”“铸像”及“经期不洁”均符合庄重的现代中文经文语域，并保留礼仪不洁的语义。以“经期不洁之物”表达 דָוָה，避免将有争议的具体物件强行定为布。
  issues:
  - severity: medium
    issue: 将 כְּמוֹ דָוָה 译为“经期用的污布”。
    rationale: 原文使用 דָוָה，涉及经期不洁意象，但并未明确写出“布”。“经期用的污布”是可理解的传统性解释，却将文本未明说的物件具体化；应保留其简略性。
  - severity: low
    issue: 末句“对它们说”未保留 לֹו 的单数形式。
    rationale: 尽管前面的被弃之物为复数，希伯来文此处命令所带代词为单数。中文可用“对它说”，让其指向偶像／偶像整体，而不必消解这一数的张力。
  - severity: low
    issue: “雕刻偶像所包的银”及“铸造神像所镀的金”表达略不自然。
    rationale: 原文指偶像的银质和金质覆盖层；“银包层”“金包层”在中文中关系更明确。
  revised_text: 你们要玷污雕刻偶像的银包层，以及铸像的金包层；你们要把它们像经期不洁之物一样抛开，并对它说：“出去！”
  revised_footnotes: []
