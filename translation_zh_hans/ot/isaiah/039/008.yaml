  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַׁעְיָ֔הוּ ט֥וֹב דְּבַר יְהוָ֖ה אֲשֶׁ֣ר דִּבַּ֑רְתָּ וַ/יֹּ֕אמֶר כִּ֥י יִהְיֶ֛ה שָׁל֥וֹם וֶ/אֱמֶ֖ת בְּ/יָמָֽ/י־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/008.yaml
  text: Then Hezekiah said to Isaiah, “The word of the LORD that you have spoken is good.” For he thought, “There will be peace and stability in my days.”
translation:
  language: zh_hans
  text: 希西家对以赛亚说：“你所传达的耶和华的话是好的。”他又说：“因为在我有生之年，必有平安和安定[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安定”或译“真实”“信实”。这里的希伯来词也含可靠、稳固之意。
    reason: אֱמֶת 的基本语义较宽；正文依上下文采用“安定”，脚注保留其真实、信实的字面关联。
lexical_decisions:
- source_word: טוֹב
  choice: 是好的
  rationale: 保留原文对耶和华之话的直接肯定，措辞简洁庄重。
- source_word: דְבַר יְהוָה
  choice: 耶和华的话
  rationale: דָּבָר 在此指先知所传达的信息；以“耶和华”对应神名 יהוה。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 涵盖安宁、福祉与免受灾祸之意，是该词在此语境中的自然对应。
- source_word: אֱמֶת
  choice: 安定
  rationale: 在“平安和……”这一并列结构中，指可靠、稳固的处境；脚注保留“真实／信实”等词义可能。
- source_word: בְּיָמָי
  choice: 在我有生之年
  rationale: 原义为“在我的日子里”，现代汉语以此表达“在我活着的年日中”。
theological_decisions:
- issue: וַיֹּאמֶר 的话语形式
  choice: 他又说
  alternative: 他心想
  rationale: 希伯来文明确使用“说”，并未使用“想”；保留直接引语，避免把希西家的陈述改成未明说的内心独白。
- issue: כִּי 的逻辑关系
  choice: 因为
  alternative: 只要／岂不是很好吗，因为
  rationale: 本节原文自然可读作对前一句的理由说明；不从平行经文补入本节没有明说的条件或反问语气。
- issue: “平安和安定”的时间范围
  choice: 仅陈述“在我有生之年”
  alternative: 解释为希西家自私地庆幸灾祸延后
  rationale: 原文保留了希西家反应的道德与神学张力，却没有直接评判其动机，因此译文不替经文作定论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文两次“说”的叙事形式和直接引语，不把第二句改写成心理活动；对 אֱמֶת 以正文加脚注呈现语义张力。
