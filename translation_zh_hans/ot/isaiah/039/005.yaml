base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/005.yaml
  text: Then Isaiah said to Hezekiah[b][a], “Hear the word of Yahweh of Hosts.”
translation:
  language: zh_hans
  text: 于是，以赛亚对希西家说：“你要听万军的雅威[a][b]的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“统领万军的雅威。”“万军”可包括天上和地上的众军。
    reason: lexical_alternative
  - marker: b
    text: “雅威”所译的希伯来文为神名 YHWH；传统汉译通常译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 叙事性连接形式推动情节向前；“于是”自然表达先后承接关系。
- source_word: יְשַׁעְיָהוּ
  choice: 以赛亚
  rationale: 采用现代中文通行的先知人名译法。
- source_word: אֶל חִזְקִיָּהוּ
  choice: 对希西家
  rationale: 介词 אֶל 在言说结构中自然译为“对”；“希西家”采用中文通行人名译法。
- source_word: שְׁמַע
  choice: 你要听
  rationale: 这是阳性单数祈使式；补出“你要”可在现代汉语中清楚保留直接命令的语气。
- source_word: דְּבַר
  choice: 话
  rationale: 在先知宣告公式中指神所说的信息；“话”既保留传统表达，也比“信息”更贴近原文的言说意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，而不以“主”这一称号替代；脚注交代传统汉译。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 在神圣称号中表示众军、众天军；“万军之雅威”简洁保留原文属格结构及其宽广含义。
theological_decisions:
- issue: 神圣称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之雅威
  alternative: 统领万军的雅威；万军之耶和华；万军之主
  rationale: 正文保留四字神名的专名性质，也保留 צְבָאוֹת 的“众军”意象；不把它限定为仅指地上军队。脚注列出较通顺的释义和传统神名译法，避免掩盖原文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接前文叙事；“你要听”明确呈现祈使语气。神名与称号通过正文和脚注兼顾原文形式、传统译法及普通读者的可理解性。
