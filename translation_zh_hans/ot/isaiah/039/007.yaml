- from: 你将生的、从你而出的儿子中，必有人被带走；他们要在巴比伦王的宫中作太监[a]。
  to: 出自你、由你所生的儿子中，必有人被带走；他们要在巴比伦王宫中成为太监[a]。
  rationale: 修订仅改善现代普通话的语序和结果性身份的表达。“出自你、由你所生”保留原文连续使用两个血缘／生育从句的强调，而未将“儿子”泛化为“后裔”。“必有人”保留 מִן 的部分意义；“被带走”保留原文不明施事者的被动结果。脚注继续保留 סָרִיסִים 的词义张力。
