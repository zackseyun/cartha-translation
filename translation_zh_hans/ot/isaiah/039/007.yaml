source:
  edition: WLC
  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יִקָּ֑חוּ וְ/הָיוּ֙ סָרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/007.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: zh_hans
  text: 出自你、由你所生的儿子中，必有人被带走；他们要在巴比伦王宫中成为太监[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王宫官员”。这个希伯来语词可指太监，在某些语境中也可泛指王室或王宫官员。
    reason: 保留 סָרִיסִים 可指太监或宫廷官员的词义歧义。
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: 你的儿子中，必有人
  rationale: 介词 מִן 在这里表示整体中的一部分，因此译出“儿子中，必有人”；保留“儿子”而不泛化为“后裔”。
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: 从你而出的
  rationale: 保留希伯来语表示血缘出自希西家的说法；现代汉语中自然且不失庄重。
- source_word: אֲשֶׁר תּוֹלִיד
  choice: 你将生的
  rationale: 使役式在男性作主语时表示生育、为父；此译法简洁地保留原文的未来指向。
- source_word: יִקָּחוּ
  choice: 被带走
  rationale: 原文虽为主动形式，但主语不定；汉语用被动表达更自然，并保留被掳离去的语境含义，而不额外强化为“强夺”。
- source_word: וְהָיוּ
  choice: 他们要……作
  rationale: 在谓语名词前可表示“成为”或“担任”；“作”在汉语中自然表达其进入新身份或职分。
- source_word: סָרִיסִים
  choice: 太监
  rationale: 该词首要可指被阉割而在宫廷服役的人，也可扩展指宫廷官员；正文采用较直接的“太监”，另以脚注保留“宫廷官员”的可能。
- source_word: בְּהֵיכַל
  choice: 在……宫中
  rationale: הֵיכָל 可指殿宇或圣殿，但与“巴比伦王”连用时明确指王宫。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 直接、自然地表达希伯来语的属格结构。
theological_decisions:
- issue: 王宫预言中 סָרִיסִים 的含义
  choice: 正文译为“太监”
  alternative: 宫廷官员
  rationale: 该希伯来语词既可能指实际被阉割的人，也可能泛指王宫官员。正文保留其较直接、传统的含义，脚注则明确另一种词义，以免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你将生的、从你而出的”有意保留原文两个相近的血缘表述；分号清楚呈现被带走及其随后身份之间的推进关系。
