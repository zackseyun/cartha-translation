  to: 希西家因他们而欢喜[a]，就把他的宝库[b]给他们看：金银、香料、上好的油、他的全部军械库[c]，以及他各个库房[d]里所有的东西。在自己宫中和在他所管辖的全境[e]，没有一样希西家不让他们看的。
