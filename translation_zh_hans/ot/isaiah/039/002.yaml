source:
  edition: WLC
  text: וַ/יִּשְׂמַ֣ח עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת בֵּ֣ית נכת/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת הַ/שֶּׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ כָּל בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֹֽצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/002.yaml
  text: And Hezekiah was glad because of them[a], and he showed them his treasure house—the silver, the gold, the spices, the fine oil, all his armory, and all that was found in his storehouses[e][d][c][b]. There was nothing in his house or in all his dominion that Hezekiah did not show them.
translation:
  language: zh_hans
  text: 希西家因他们而欢喜[a]，就把他的宝库[b]给他们看：金银、香料、上好的油、他的全部军械库[c]，以及他各个库房[d]里所有的东西。在自己宫中和在他所管辖的全境[e]，没有一样希西家不让他们看的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“为他们欢喜”或“对他们感到满意”。希伯来语可以指因这些使者或礼物而喜悦，也可以指向他们表示喜悦。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语可直译为“存放他珍贵物品的房屋”，传统上理解为宝库。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“他的全部器械库”。原文表达较宽泛；根据上下文和《列王纪下》20:13的平行记载，许多人理解为军械库。
    reason: alternative_reading
  - marker: d
    text: 也可译作“宝库”。
    reason: lexical_alternative
  - marker: e
    text: 也可译作“他的整个领地”或“他的整个国度”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח עֲלֵיהֶם
  choice: 因他们而欢喜
  rationale: 保留שׂמח与עַל组合可能表达的因他们来访或所带礼物而喜悦之意，同时不把感情过度限定为对使者本人满意。
- source_word: וַיַּרְאֵם
  choice: 把……给他们看
  rationale: 使役态直译为“使他们看见”，现代汉语自然表达为“给他们看”。
- source_word: בֵּית נכתה
  choice: 他的宝库
  rationale: 该词组指存放珍贵物品之处；“宝库”简洁自然，并以脚注保留较直译的可能。
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: 金银
  rationale: 语境是王室贵重物品清单，指金、银两种贵金属；汉语以“金银”更自然。
- source_word: הַבְּשָׂמִים
  choice: 香料
  rationale: 该词泛指芳香物质，“香料”既通俗，也不将其过窄限定为香膏或香水。
- source_word: הַשֶּׁמֶן הַטּוֹב
  choice: 上好的油
  rationale: 较贴近字面“好的油”，同时表达其优质、贵重的含义，而不额外断定为膏油或香油。
- source_word: כָּל בֵּית כֵּלָיו
  choice: 他的全部军械库
  rationale: 结合王室财物清单及《列王纪下》20:13的平行经文，“军械库”是较可能且自然的理解；脚注保留字面较宽泛的“器械库”解释。
- source_word: כָּל אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: 他各个库房里所有的东西
  rationale: אֹצָר可指库房或宝库；此处用“库房”避免与前文“宝库”混同，并保留各种储藏物的宽泛含义。
- source_word: בְּבֵיתוֹ
  choice: 在自己宫中
  rationale: 字面为“在他的家中/房屋中”，但主语是国王，语境指王宫；脚注不必增加，因为此处语用清楚。
- source_word: וּבְכָל מֶמְשַׁלְתּוֹ
  choice: 在他所管辖的全境
  rationale: 兼顾“统治权”与“统治领域”两方面，比单用“国”更少作政治范围上的限定。
