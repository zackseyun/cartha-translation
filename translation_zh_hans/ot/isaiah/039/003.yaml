  text: וַ/יָּבֹא֙ יְשַׁעְיָ֣הוּ הַ/נָּבִ֔יא אֶל הַ/מֶּ֖לֶךְ חִזְקִיָּ֑הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו מָ֥ה אָמְר֣וּ הָ/אֲנָשִׁ֣ים הָ/אֵ֗לֶּה וּ/מֵ/אַ֨יִן֙ יָבֹ֣אוּ אֵלֶ֔י/ךָ וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ מֵ/אֶ֧רֶץ רְחוֹקָ֛ה בָּ֥אוּ אֵלַ֖/י מִ/בָּבֶֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/003.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him, “What did these men say, and where did they come to you from?” And Hezekiah said, “They came to me from a distant land, from Babylon.”
translation:
  language: zh_hans
  text: 于是，先知以赛亚来到希西家王那里，问他：“这些人说了什么？他们从哪里来到你这里？”希西家回答：“他们从遥远的地方，从巴比伦来到我这里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 于是……来到
  rationale: 叙事中的连续式承接上文；用“于是”自然推进情节，不机械重复“然后”。
- source_word: מָה אָמְרוּ
  choice: 说了什么
  rationale: 直接对应疑问词 מָה 与完成式 אָמְרוּ，保留以赛亚对使者言谈内容的询问。
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: 他们从哪里来见你
  rationale: מֵאַיִן 表示来源，אֵלֶיךָ 表示朝向希西家；“来见你”在现代汉语中自然表达来访含义，同时不把问题缩减为单纯籍贯。
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: 从遥远的地方
  rationale: אֶרֶץ 可指土地、地区或国家；此处采用较宽泛的“地方”，避免在原文未明确时过度限定为政治意义上的“国家”。
- source_word: מִבָּבֶל
  choice: 从巴比伦
  rationale: 按专名通常译法处理，并保留它作为对“遥远的地方”的具体说明。
theological_decisions:
- issue: 以赛亚问题的语气与意图
  choice: 采用中性的直接问句
  alternative: 译成带责备意味的反问或审讯式问话
  rationale: 本节措辞本身是询问；责备和审判意味可由后文语境显明，不在本句中额外加入。
- issue: 希西家回答中“遥远”的修辞意味
  choice: 直译为“遥远的地方”
  alternative: 加译为炫耀性的“非常遥远的国家”
  rationale: 保留叙事张力，让读者从上下文判断希西家的态度，不把一种动机解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“先知以赛亚”“希西家王”符合普通中文圣经语域；两个“来见我/你”明确来访方向，也避免生硬的“来到你这里”。原文无需要正文标示的重大文本异读或不可兼容歧义，故不设脚注。
