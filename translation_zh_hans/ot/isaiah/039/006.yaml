id: ISA.39.6
reference: Isaiah 39:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑ל לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/006.yaml
  text: Look[a], days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon; not a thing will be left, says Yahweh.
translation:
  language: zh_hans
  text: 看哪，日子将到：你家里所有的一切，以及你列祖[a]积存到今日的，都要被运到巴比伦去；一件也不会留下。雅威说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或“你的祖先”。希伯来文直译“你的父亲们”。
    reason: 说明“列祖”的较自然替代译法及原文的阳性复数形式。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示语的郑重和唤起注意的功能，同时符合现代汉语经文语体。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 贴近希伯来文分词结构及先知宣告未来审判的惯用表达。
- source_word: וְנִשָּׂא
  choice: 都要被运到
  rationale: 该词为被动形式，语境指财物被搬走并运往巴比伦；此译保留被动和目的地指向。
- source_word: כָּל אֲשֶׁר בְּבֵיתֶךָ
  choice: 你家里所有的一切
  rationale: 保留“家／房屋”的原义，不擅自具体化为“王宫”或泛化为“财产”。
- source_word: וַאֲשֶׁר אָצְרוּ אֲבֹתֶיךָ
  choice: 以及你列祖积存的
  rationale: “积存”表达 אָצַר 储藏财宝或物资之义；“列祖”保留 אבות 的男性历史称谓，也自然指向前代先祖。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 到今日
  rationale: 表达历代积存一直延续至说话当下。
- source_word: בָּבֶל
  choice: 巴比伦
  rationale: 采用现代汉语通行地名。
- source_word: לֹא יִוָּתֵר דָּבָר
  choice: 一件也不会留下
  rationale: 保留绝对否定和损失殆尽的强调；“一件”在财物语境中自然。
- source_word: אָמַר יְהוָה
  choice: 雅威说
  rationale: 以现在时式的汉语宣告保留先知话语的直接性，并将神名 יְהוָה 音译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”使读者看见专名性质，而不以称号“主”替代。
- issue: אֲבֹתֶיךָ 的性别与历史范围
  choice: 你列祖
  alternative: 你的祖先；你的父辈
  rationale: “列祖”既保留原文阳性复数“父亲们”的历史家族色彩，也避免现代汉语把“父辈”仅理解为父亲一代。脚注列出较宽泛的自然译法。
- issue: בְּבֵיתֶךָ 所指范围
  choice: 你家里
  alternative: 你宫中；你的王室中
  rationale: 原文仅说“你的家／房屋”，虽语境可能涉及王宫及其府库，正文不替原文消除这一范围上的含混。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”“列祖”略带经文语体，但仍为普通读者可懂；其余句法力求自然。冒号引出审判内容，分号突出“毫无剩余”的结论。
