base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/004.yaml
  text: And he said[a], “What have they seen in your house?” And Hezekiah said, “They have seen everything that is in my house. There was nothing that I did not show them in my treasuries.”
translation:
  language: zh_hans
  text: 他问：“他们在你宫中[a]看见了什么？”希西家回答：“我宫里所有的，他们都看见了；我的宝库中，没有一样是我没有给他们看的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宫中”直译为“你家中”或“你房屋中”；在君王的语境里，这个词可以指宫殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: 什么
  rationale: 直接对应疑问代词，简洁自然地引出以赛亚的问题。
- source_word: רָאוּ
  choice: 看见了
  rationale: 希伯来语完成式表示已经发生的观看；现代汉语用“看见了”自然表达已完成动作。
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: 在你宫中 / 我宫里
  rationale: בַּיִת本义为“房屋、家”，但用于君王居所时可指宫殿；正文依王室语境译作“宫”，脚注保留字面选择。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: 我宫里所有的
  rationale: 保留כָּל אֲשֶׁר所表达的全体范围，同时符合现代汉语口语中的回答方式。
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא
  choice: 没有一样是我没有
  rationale: 用双重否定保留原文强调性的全面陈述，并使中文自然清楚。
- source_word: הִרְאִיתִים
  choice: 给他们看
  rationale: ראה的使役式意为“使……看见、展示”；“给他们看”准确且符合当代中文对话语体。
- source_word: בְּאוֹצְרֹתָי
  choice: 在我的宝库中
  rationale: אוֹצָר可指宝物或储藏宝物之处；复数形式及王室财富语境支持译为“宝库”。
