    rationale: 外交书信与礼物通常由使者递送，但原文只说他“送”了书信和礼物。删去“派人”可更直接地对应原文，同时中文仍自然。
  revised_text: 那时，巴拉但的儿子、巴比伦王米罗达·巴拉但，向希西家送去书信和礼物，因为他听说希西家患过病，已经康复[a]。
  revised_footnotes:
