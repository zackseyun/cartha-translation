revisions:
- from: 那时，巴比伦王巴拉但的儿子米罗达·巴拉但派人给希西家送来书信和礼物，因为他听说希西家病过，已经康复[a]。
  to: 那时，巴拉但的儿子、巴比伦王米罗达·巴拉但，向希西家送去书信和礼物，因为他听说希西家患过病，已经康复[a]。
  rationale: 调整王号的同位语位置，使其明确修饰米罗达·巴拉但，忠实反映原文句法；将“派人给……送来”改为“向……送去”，避免补入未明说的使者，同时保留外交送达的含义。
