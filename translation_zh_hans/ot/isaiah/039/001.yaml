  text: בָּ/עֵ֣ת הַ/הִ֡וא שָׁלַ֡ח מְרֹדַ֣ךְ בַּ֠לְאֲדָן בֶּֽן בַּלְאֲדָ֧ן מֶֽלֶךְ בָּבֶ֛ל סְפָרִ֥ים וּ/מִנְחָ֖ה אֶל חִזְקִיָּ֑הוּ וַ/יִּשְׁמַ֕ע כִּ֥י חָלָ֖ה וַֽ/יֶּחֱזָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/001.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, for he heard that he had been sick and had recovered.
translation:
  language: zh_hans
  text: 那时，巴拉但的儿子、巴比伦王米罗达·巴拉但，向希西家送去书信和礼物，因为他听说希西家患过病，已经康复[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “康复”直译为“变得强壮”。这里指病后恢复了健康。
    reason: 保留希伯来语 וַיֶּחֱזָק 的字面含义及其语境义。
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: 那时
  rationale: 自然、庄重的现代汉语叙事时间语，准确引出当时的背景。
- source_word: מְרֹדַךְ בַּלְאֲדָן
  choice: 米罗达·巴拉但
  rationale: 按希伯来语形式音译，并以间隔号清楚标示复合人名。
- source_word: בֶּן בַּלְאֲדָן מֶלֶךְ בָּבֶל
  choice: 巴比伦王巴拉但的儿子
  rationale: 保留父子关系与王号；调整为自然汉语定语次序，避免误把巴拉但理解为巴比伦王。
- source_word: שָׁלַח ... סְפָרִים וּמִנְחָה אֶל חִזְקִיָּהוּ
  choice: 派人给希西家送来书信和礼物
  rationale: 希伯来语“差遣/送”在此隐含使者；汉语用“派人……送来”自然呈现外交行动。סְפָרִים 在王室交往中指书信，מִנְחָה 在此指外交礼物而非祭物。
- source_word: וַיִּשְׁמַע כִּי
  choice: 因为他听说
  rationale: 上下文表明听闻希西家患病并康复是送信送礼的缘由；“听说”自然承载所闻内容。
- source_word: חָלָה וַיֶּחֱזָק
  choice: 病过，已经康复
  rationale: 前者表示此前患病，后者字面为“变得强壮”，在病后语境中自然指恢复健康；脚注保留字面意象。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“派人……送来”符合现代汉语表达；人名采用可辨识的圣经传统音译，同时以间隔号增强可读性。
