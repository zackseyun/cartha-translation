base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/028.yaml
  text: But I know your sitting down[a], your going out, your coming in, and your raging against me.
translation:
  language: zh_hans
  text: 但你坐下[a]、出去、进来，和你向我发怒，我都知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“居住”。“坐下、出去、进来”在希伯来文中是描述一个人安居及行动的惯用序列。
    reason: 说明ישׁב的词义选择及整组表达的惯用含义。
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: 你安坐
  rationale: 源自ישׁב，在本节与“外出、进来”构成惯用序列。“安坐”保留希伯来文的具体意象，也可涵盖安居、停留之意。
- source_word: וְצֵאתְךָ
  choice: 外出
  rationale: 源自יצא，与“进来”相对，直接保留行动意象，现代汉语也自然。
- source_word: וּבוֹאֲךָ
  choice: 进来
  rationale: 源自בוא，是“外出”的对应语，按希伯来文的惯用搭配直译。
- source_word: יָדָעְתִּי
  choice: 我都知道
  rationale: ידע的Qal完成式第一人称单数；上下文强调耶和华对对方一切行动和敌意的确知。汉语用现在时态的“知道”最自然，“都”统摄前列各项。
- source_word: הִתְרַגֶּזְךָ
  choice: 你向我发怒
  rationale: רגז的Hitpael形式表示激动、震怒或狂怒的表现；结合方向短语，译为“发怒”既表达敌对情绪和行为，也避免过度诠释。
- source_word: אֵלַי
  choice: 向我
  rationale: אֶל本义为“向、朝着”；与“发怒”连用时，现代汉语“向我发怒”自然表达针对性，同时保留其方向意味。
- source_word: וְאֵת
  choice: 以及
  rationale: אֵת本身是直接宾语标记，不单独翻译；前置的连接词以“以及”体现，使最后一项与前面的行动并列。
theological_decisions:
- issue: 完成式动词所表达的上帝之知
  choice: 译为现在性的“我都知道”
  alternative: “我早已知道”或“我曾知道”
  rationale: 此处宣告耶和华确知亚述王的行动及其敌意。现代汉语用“知道”自然表达持续有效的确知，不额外加入原文未明说的时间或系统神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“安坐、外出、进来”保留原文排比和具体行动意象；“以及”使末项敌对行为与前三项清楚并列。
