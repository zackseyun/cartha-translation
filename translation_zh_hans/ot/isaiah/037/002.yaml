revisions:
- from: 于是，他派王宫总管以利亚敬、书记舍伯那和祭司中的长老去见亚摩斯的儿子以赛亚先知；他们都披着麻布。[a][b]
  to: 于是，他派遣宫廷总管以利亚敬[a]、书记舍伯那和祭司中的长老，众人都身披粗麻布[b]，去见先知以赛亚，就是亚摩斯的儿子。
  rationale: 修订仅改善汉语句法清晰度、将脚注锚点置于其对应词语之后，并用“粗麻布”更具体地表达 שַׂקִּים。受差者群体后的“众人都”对应希伯来文复数分词，未改变其所描述的群体范围。
