base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/002.yaml
  text: Then he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah son of Amoz[b], the prophet.
translation:
  language: zh_hans
  text: 于是，他派遣宫廷总管以利亚敬[a]、书记舍伯那和祭司中的长老，众人都身披粗麻布[b]，去见先知以赛亚，就是亚摩斯的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宫廷总管”是官职，指主管王室家务或宫廷事务的人。
    reason: cultural_note
  - marker: b
    text: “身披粗麻布”也可译作“穿着麻衣”。粗麻布表示他们正处于哀恸或谦卑的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是，他派
  rationale: 未完成式叙事形态推进情节；“于是”自然表达承接关系，“派”符合差遣官员前往的语境。
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: 王宫总管
  rationale: 这是主管王室家务或宫廷事务的官职；译作“王宫总管”比逐字的“在这家之上”更符合现代汉语，同时保留其官职性质。
- source_word: הַסֹּפֵר
  choice: 书记
  rationale: סֹפֵר在宫廷语境中可指书记或文书官；“书记”直接而不过度限定其具体行政职责。
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: 祭司中的长老
  rationale: 保留该结构可能指祭司群体中的年长者或领袖，不径直解释为“高级祭司”。
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: 他们都披着麻布
  rationale: 该分词描述被差遣者身披麻布的状态；“披着”保留覆盖身体的形象，也符合哀恸、屈辱语境。
- source_word: יְשַׁעְיָהוּ בֶן־אָמֹוץ הַנָּבִיא
  choice: 亚摩斯的儿子以赛亚先知
  rationale: 按希伯来文顺序呈现父称和先知称号，采用中文圣经人名的通行音译。
