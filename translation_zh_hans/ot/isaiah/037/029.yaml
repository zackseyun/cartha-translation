base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/029.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips[b], and I will turn you back by the way that you came.
translation:
  language: zh_hans
  text: 因为你向我所发的怒，和你那安逸自恃，都传到我耳中[a]，所以我要把我的钩子放在你鼻中，把我的嚼子放在你唇间，使你从原路返回。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安逸自恃”也可译作“安逸”“安然”或“自信”；原文词语可指安稳无忧，在这里很可能含有傲慢自恃之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: 因为……所以
  rationale: 引出审判的原因；汉语用“因为……所以”清楚呈现因果关系，并自然承接后面的神谕。
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: 你向我发怒
  rationale: רגז在此表示激愤、暴怒；介词 אֵלַי 在敌对语境中译作“向我”，保留针对上帝的敌意。
- source_word: שַׁאֲנַנְךָ
  choice: 你那自以为安稳的狂傲
  rationale: 该词本义涉及安逸、安稳或无忧，此处带有傲慢自恃的负面色彩；这一译法兼顾词汇本义和语境含义。
- source_word: עָלָה בְאָזְנָי
  choice: 传入了我的耳中
  rationale: 保留“耳中”的具体拟人意象，同时以现代汉语自然表达“被听见”。
- source_word: חַחִי בְּאַפֶּךָ
  choice: 把我的钩子钩在你的鼻子上
  rationale: חח指用于控制牲畜或俘虏的钩子；结合“鼻子”译出强制驾驭的鲜明图像。
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: 把我的嚼环套在你的嘴唇上
  rationale: מתג指马衔、嚼环等控驭器具；“嚼环”与嘴唇的位置相合，并与前句的钩子意象并列。
- source_word: וַהֲשִׁיבֹתִיךָ
  choice: 使你……返回
  rationale: שוב的使役形式表示使对方回去，明确体现上帝迫使敌王退回。
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: 从原路返回
  rationale: 自然简洁地表达“沿着你来时的路回去”，保留逆转与遣返之意。
theological_decisions:
- issue: 上帝听见敌王并以钩子、嚼环控制他的拟人和控驭意象
  choice: 保留“我的耳中”“我的钩子”“我的嚼环”等具体图像
  alternative: 意译为“我听见了你的狂傲，因此要制伏你，叫你回去”
  rationale: 原文借强烈而具体的图像宣告上帝对亚述王的主权；保留这些意象可避免把经文的修辞力度抽象化。
- issue: שַׁאֲנַנְךָ 所表达的安稳与狂傲之间的张力
  choice: 译为“自以为安稳的狂傲”
  alternative: 仅译“安逸”“自信”或“狂傲”
  rationale: 该词既有安稳无忧的词汇核心，又在审判语境中指向傲慢自恃；组合表达不把这层含混单方面消解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留神谕中“耳中、钩子、嚼环”的具体意象；用“从原路返回”避免生硬复现希伯来语关系从句结构。
