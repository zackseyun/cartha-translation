  language: zh_hans
  text: 于是，希西家王的臣仆来到以赛亚那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 于是……来到
  rationale: 该叙事性连续式推动情节发展；“于是”自然承接上文，“来到”准确表达 בוא 的普通含义。
- source_word: עַבְדֵי
  choice: 臣仆
  rationale: עבד 的复数构造式在王室语境中可指王的仆从、侍臣或官员；“臣仆”既保留服事君王的关系，又不武断限定具体官职或奴隶身份。
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: 希西家王
  rationale: 希伯来文为“王”与专名的组合；现代汉语以“希西家王”表达自然，也保留其王室身份。
- source_word: אֶל
  choice: 到……那里
  rationale: 此方向介词与运动动词连用，表示前往某人所在之处；汉语译作“来到……那里”清楚自然。
- source_word: יְשַׁעְיָהוּ
  choice: 以赛亚
  rationale: 采用现代中文圣经传统中通行的人名音译。
