base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying[b], “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: zh_hans
  text: 你们要这样告诉犹大王希西家：‘不要让你所倚靠的神欺骗你[a]，说：“耶路撒冷必不被交在亚述王手中[b]。”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“误导你”。希伯来语动词可指“欺骗”或“使人误入歧途”。
    reason: lexical_alternative
  - marker: b
    text: “在……手中”是指落入某人的权势或控制之下。
    reason: idiom_explanation
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  choice: 你们要这样告诉
  rationale: כֹּה引出使者所传的话，תֹאמְרוּן是复数第二人称未完成式，在此有指令语气；“你们要这样告诉”在现代汉语中自然地保留了这两点。
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王希西家
  rationale: 采用现代中文圣经中通行的人名与王号表达，清楚自然。
- source_word: יַשִּׁאֲךָ
  choice: 欺骗你
  rationale: 该动词在此为使役形，可指欺骗或使人误入歧途；“欺骗”保留亚述使者亵渎性嘲讽的尖锐力度。
- source_word: אֱלֹהֶיךָ אֲשֶׁר אַתָּה בּוֹטֵחַ בּוֹ
  choice: 你所倚靠的神
  rationale: 准确表达第二人称单数所属关系及关系从句；“倚靠”贴合בטח在此处信赖、仰赖的含义。
- source_word: לֹא תִנָּתֵן
  choice: 必不被交
  rationale: 保留נתן被动式“被交出”的形式，并以“必不”自然表达引语中的将来断言。
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: 在亚述王手中
  rationale: 保留希伯来语“在……手中”的具体意象；在中文中也能自然表达落入某人权势或控制之下。
theological_decisions:
- issue: 如何呈现亚述使者对神的敌意指控
  choice: 不要让你所倚靠的神欺骗你
  alternative: 不要让你所倚靠的神误导你
  rationale: 本节是在直接引述亚述一方的亵渎性威吓，并非认可该指控。“欺骗”不削弱原话的冒犯力度，也不替叙事预先作神学辩解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。直接引语的层级用中文引号区分；保留“在……手中”的希伯来语意象，并通过脚注说明其习语含义。脚注标记按其实际解释对象分别置于“欺骗你”和“手中”之后。
