  - severity: medium
    issue: “没有力气生下来”的施事指向不清。
    rationale: 紧邻的主语是“孩子”，中文读者可能误解为孩子自己无力出生；原文则以孩子到达产道／出生关口与母体无力分娩构成完整难产图像。
