  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/003.yaml
  text: 'And they said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[b], and there is no strength to give birth.”'
translation:
  language: zh_hans
  text: 他们对他说：“希西家这样说：今天是患难、责备和凌辱的日子[a]；孩子已经到了出生的关口，产妇却无力生产[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “责备和凌辱”也可译作“斥责和藐视”；末一词在某些语境中可指侮慢，甚至亵渎。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“孩子已经来到产凳（或出生的关口），却没有力量生产”。这是分娩的比喻：产程已到最紧要处，产妇却无力完成分娩，用来形容危机已到紧要关头而人无力应对。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: 他们对他说
  rationale: 按叙事顺序译出复数主语和间接宾语，符合现代汉语表达。
- source_word: כֹּה אָמַר חִזְקִיָּהוּ
  choice: 希西家这样说
  rationale: 保留使者转述话语的固定引介格式，同时使用自然的现代汉语。
- source_word: יוֹם צָרָה
  choice: 患难的日子
  rationale: צָרָה表示困境、患难或危急；“患难”兼具庄重感和可读性。
- source_word: וְתוֹכֵחָה
  choice: 责罚
  rationale: תּוֹכֵחָה可指责备、申斥或惩治；语境是国家遭遇危机，“责罚”保留其可能带有惩治意味的张力。
- source_word: וּנְאָצָה
  choice: 羞辱
  rationale: נְאָצָה可涉及藐视、凌辱，甚至亵渎；正文采用不把对象和方式说死的“羞辱”，其他可能性列入脚注。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 以简洁、自然的现代汉语表达指示性时间短语，同时保留当前危机的迫切感。
- source_word: כִּי בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: 孩子已经到了临盆关头
  rationale: 保留分娩隐喻；בָנִים在此指将要出生的孩子，מַשְׁבֵּר指生产或临盆的关口，而非一般意义的“崩溃点”。
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: 却没有力气生下来
  rationale: 延续原文的分娩图像，表达产程已到关键时刻却无力完成生产；汉语中不明说产妇，保留原文省略施事者的特点。
theological_decisions:
- issue: 以难产比喻犹大危机
  choice: 明确保留孩子到了临盆关头、却无力生产的图像
  alternative: 意译为“危机已经到了关头，我们却无力应对”
  rationale: 原文用突兀而强烈的分娩隐喻表现局势绝望；若化约为一般性的无助陈述，会损失其修辞力度。
- issue: וּנְאָצָה所指的是受辱、被藐视还是对上帝的亵渎
  choice: 正文译作较宽泛的“羞辱”
  alternative: 译作“藐视”或“亵渎”
  rationale: 词本身容许多种关联意义，而本节没有明说承受者或施行方式；正文不预先锁定神学对象，脚注保存其他读法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“临盆关头”保留原文生育意象，又避免生硬照译为“产凳”或误解为一般的“崩溃点”；分号呈现原文由危机陈述转入比喻说明的结构。
