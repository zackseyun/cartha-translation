  naturalness: “孩子已经到了临盆关头”可理解，但“临盆”通常说产妇，不通常说孩子；“孩子已经到了出生的关口，产妇却无力生产”在现代标准汉语中更清楚自然，同时保持原文的突兀比喻。
  terminology: “希西家”“患难”均恰当。将“责罚和羞辱”调整为“责备和凌辱”，更贴近希伯来语三项名词的语义范围，也避免把神学或施事者预先限定。
