base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/038.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisroch his god, Adrammelech and Sharezer his sons struck him down with the sword, and they escaped to the land of Ararat[c][b]. And Esar-haddon his son reigned in his place.
translation:
  language: zh_hans
  text: 有一天，他在他神尼斯洛的庙里敬拜[a]时，他的儿子亚得米勒和沙利色用刀剑杀了他，随后逃到亚拉腊地。此后，他的儿子以撒哈顿接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬拜”也可译作“俯伏”或“下拜”；希伯来语可着重表示敬拜时俯身伏地的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 一天
  rationale: 这里的叙事公式引出后来发生的一件事；译作“一天”符合现代汉语叙事习惯，同时不赋予原文没有的精确日期。
- source_word: מִשְׁתַּחֲוֶה
  choice: 敬拜
  rationale: 该词可指俯伏的身体动作，也可在宗教语境中表示敬拜；此处提到“自己的神”和其庙宇，正文用“敬拜”最自然，并以脚注保留动作层面的含义。
- source_word: בֵּית נִסְרֹךְ אֱלֹהָיו
  choice: 自己的神尼斯洛庙里
  rationale: בֵּית 字面为“……的殿/房屋”，在神祇语境中指庙宇；现代汉语用“尼斯洛庙”清楚自然。“自己的神”保留 אֱלֹהָיו 与主语的所属关系。
- source_word: אַדְרַמֶּלֶךְ וְשַׂרְאֶצֶר בָּנָיו
  choice: 他的儿子亚得米勒和沙利色
  rationale: 保留两个人名及“他的儿子”这一明确亲属关系，采用现代中文圣经人名的通行音译形式。
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: 用刀杀了他
  rationale: נכה 本义为“击打”，与“用刀/剑”连用且下文记述王位继承，语境明确表示致死；汉语译为“用刀杀了他”简洁清楚。“刀”在此作为兵器的泛称，比“用剑击倒”更自然。
- source_word: נִמְלְטוּ אֶרֶץ אֲרָרָט
  choice: 逃到亚拉腊地
  rationale: נמלט 表示成功逃脱；目的地前省略方向介词是可理解的希伯来语结构，汉语补出“到”。אֶרֶץ אֲרָרָט 指亚拉腊地区。
- source_word: וַיִּמְלֹךְ אֵסַר חַדֹּן בְּנוֹ תַּחְתָּיו
  choice: 此后，他的儿子以撒哈顿接替他作王
  rationale: מלך 与 תחתיו 合起来表达王位继承；“接替他作王”准确而自然地传达“在他的位置上作王”。
