source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֔עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶלֶךְ אַשּׁ֖וּר אוֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/006.yaml
  text: 'And Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: zh_hans
  text: 以赛亚对他们说：“你们要这样告诉你们的主上：‘雅威如此说：不要因你所听见的那些话而害怕；亚述王的臣仆用那些话亵渎了我[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“辱骂了我”或“藐视了我”。希伯来语这个动词可指用侮辱、轻蔑的话攻击神。
    reason: 保留גדף兼具亵渎、辱骂和蔑视色彩的词义范围。
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְשַׁעְיָהוּ
  choice: 以赛亚对他们说
  rationale: 按希伯来叙事句式推进语境；现代汉语中无需机械译出句首连接词，也能准确表达说话者和受话者。
- source_word: כֹּה תֹאמְרוּן אֶל אֲדֹנֵיכֶם
  choice: 你们要这样告诉你们的主上
  rationale: 保留使者传话公式；“主上”在此指众使者所服事的希西家，既体现尊称，又避免与神的名混淆。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留正式的先知宣告公式，并将四字神名按其专名译作“雅威”。
- source_word: אַל תִּירָא מִפְּנֵי הַדְּבָרִים אֲשֶׁר שָׁמַעְתָּ
  choice: 不要因你所听见的那些话而害怕
  rationale: מִפְּנֵי在此表示引起惧怕的缘由；单数“你”对应希伯来语形式，所指为希西家。
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: 亚述王的臣仆
  rationale: נַעַר可指年轻人、侍从或仆役；此处指亚述王差来的属下，“臣仆”符合宫廷政治语境而不过度限定其具体职衔。
- source_word: אֲשֶׁר גִּדְּפוּ ... אוֹתִי
  choice: 用那些话亵渎了我
  rationale: 关系代词承接前面的“话”；גדף描述以侮辱、蔑视性的言语攻击神，“亵渎”在正文中体现其对象为神及行为的严重性。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”作为专名音译，避免用称号替代，并不增添宗派性解释。
- issue: גדף用于针对神的言语
  choice: 亵渎了我
  alternative: 辱骂了我／藐视了我
  rationale: “亵渎”自然传达针对神的侮辱性言语及其神学分量；脚注保留该动词也可表达辱骂或公然藐视的较宽语义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“你们”用于使者群体，“你”对应神对希西家的单数称呼；引号层次清楚呈现以赛亚、传话公式和雅威话语三层发言。
