  yaml_path: translation/ot/isaiah/037/015.yaml
  text: 'And Hezekiah prayed to Yahweh[a], saying:'
translation:
  language: zh_hans
  text: 希西家向耶和华祷告说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: 祷告
  rationale: 此处 פלל 的 Hitpael 形式表示祷告这一行动；“祷告”是现代汉语中自然、准确的表达。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֶל
  choice: 向
  rationale: 该介词标明祷告所指向的对象；汉语说“向……祷告”自然贴切。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的四字神名音译，不以称号“主”替代原文中的专名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出随后祷告的内容；汉语叙事中“祷告说”简洁自然，并保留原文的引语衔接。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留专名而不改作“主”；“耶和华”是普通话基督教语境中最通行且易识别的形式。“雅威”更接近学界常用的拟音，但原始发音并不能完全确定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留希伯来叙事句式的推进关系，但省去在汉语中显得累赘的句首“于是/并且”。本节没有必须设置的文本或词义脚注。
