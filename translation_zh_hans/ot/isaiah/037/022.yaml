  naturalness: “耶和华论到他所说的话是这样”在现代汉语中语序滞涩。“耶和华论到他所说的话是：”庄重、清楚，也自然地引出下文。将“耶路撒冷的女子”改为“少女耶路撒冷”，使其与“处女锡安”同为拟人化城市称号，避免被理解为城中某一位女子。
  terminology: 保留“耶和华”“锡安”“耶路撒冷”。“处女锡安”及“少女耶路撒冷”在中文中作为诗性拟人称号较为自然；不引入关于其所指对象的教义性说明。
