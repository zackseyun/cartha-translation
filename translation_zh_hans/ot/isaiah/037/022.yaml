base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/022.yaml
  text: 'This is the word that the LORD has spoken concerning him: ‘Virgin Daughter Zion despises you and mocks you; Daughter Jerusalem shakes her head behind you.’'
translation:
  language: zh_hans
  text: '耶和华论到他所说的话是：


    “处女锡安藐视你，嘲笑你；


    少女耶路撒冷在你背后摇头。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: 所说的话是这样
  rationale: 自然表达希伯来语引出下文言语内容的结构，同时保留“话”这一核心意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的专名译法，明确对应四字神名。
- source_word: בְּתוּלַת בַּת־צִיּוֹן
  choice: 锡安的处女
  rationale: 按希伯来语诗性拟人表达翻译；“处女”修饰拟人化的锡安，保留其未受侵犯、娇弱而尊贵的形象，不另行解释其神学含义。
- source_word: בָּזָה לְךָ
  choice: 藐视你
  rationale: בזה表示轻看、鄙视；中文“藐视”准确且符合庄重诗体。
- source_word: לָעֲגָה לְךָ
  choice: 嘲笑你
  rationale: לעג在此表示讥笑、嘲弄；“嘲笑”自然清楚。
- source_word: אַחֲרֶיךָ רֹאשׁ הֵנִיעָה
  choice: 在你背后摇头
  rationale: 保留原文动作及方位；这是对败退者表示讥诮或轻蔑的姿态，不在正文中解释。
- source_word: בַּת יְרוּשָׁלִָם
  choice: 耶路撒冷的女子
  rationale: 保留“女儿/女子”这一城市拟人称谓；现代中文用“女子”比直译“女儿耶路撒冷”更自然，并与上一行形成诗性对应。
theological_decisions:
- issue: “锡安的处女”所指为何
  choice: 保留城市拟人化称谓，不释义为居民、教会或其他群体
  alternative: 译为“锡安的居民”或赋予特定神学身份
  rationale: 原文以女性形象拟人化锡安；直保意象可避免导入原文未明说的宗派性解释。
- issue: 神名יהוה的呈现
  choice: 译作“耶和华”
  alternative: 译作“上主”或音译“雅威”
  rationale: “耶和华”在普通现代中文读者中辨识度高，并将专名性质与一般称号区分开来。
translation_notes:
  register: 采用现代、庄重、易懂的诗体中文。按原文分行，保留锡安与耶路撒冷的女性拟人意象及“摇头”的讥诮动作；避免将诗性称谓过度现代化或作教义性展开。
