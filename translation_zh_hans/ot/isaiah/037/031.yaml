  naturalness: “犹大家所逃脱、剩下的人”结构生硬，读者也可能一时将“犹大家所逃脱”理解为“从犹大家逃脱”。改为“犹大家中逃脱而存留的余民”更符合现代庄重书面语，同时保留两个连续限定。
