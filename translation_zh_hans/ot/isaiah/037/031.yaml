  text: וְ/יָ֨סְפָ֜ה פְּלֵיטַ֧ת בֵּית יְהוּדָ֛ה הַ/נִּשְׁאָרָ֖ה שֹׁ֣רֶשׁ לְ/מָ֑טָּה וְ/עָשָׂ֥ה פְרִ֖י לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/031.yaml
  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: zh_hans
  text: 犹大家中逃脱而存留的余民，必再次向下扎根，向上结果。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大家幸存的余民，必再次向下扎根，向上结果。”
    reason: 词汇替代：可将“逃脱而存留”凝练译为“幸存”，但正文较明确地保留了פְּלֵיטַת与הַנִּשְׁאָרָה两个相叠的限定。
lexical_decisions:
- source_word: וְיָסְפָה
  choice: 必再次
  rationale: יסף在此表示进一步或重新发生；“再次”自然表达劫后余民将重新扎根、结果，且“必”体现该未完成式在预言语境中的将来意义。
- source_word: פְּלֵיטַת
  choice: 所逃脱……的人
  rationale: פְּלֵיטָה指从灾祸中逃脱或幸存的群体；“所逃脱的人”保留其逃脱灾难的词义色彩。
- source_word: בֵּית יְהוּדָה
  choice: 犹大家
  rationale: 保留“家”这一民族—家族性的表达，同时采用现代汉语中自然的专名组合。
- source_word: הַנִּשְׁאָרָה
  choice: 剩下的
  rationale: שׁאר的分词明确限定这群人为灾难之后留下的人；与“所逃脱”并列，保留原文两个近义而不完全相同的限定。
- source_word: שֹׁרֶשׁ
  choice: 扎根
  rationale: 希伯来语以“根”构成动词性意象；汉语“扎根”自然保留植物向下生根的画面。
- source_word: לְמָטָּה
  choice: 向下
  rationale: 保留与下一分句“向上”的垂直对称。
- source_word: וְעָשָׂה
  choice: 结果
  rationale: עשה与“果子”搭配表示结出或产生果实；汉语“结果”简洁自然地保留农业意象。
- source_word: פְרִי
  choice: 果（体现在“结果”中）
  rationale: 将名词“果子”融入惯用动词“结果”，不削弱原文的植物意象。
- source_word: לְמָעְלָה
  choice: 向上
  rationale: 与“向下”形成原文刻意的诗性对照。
theological_decisions:
- issue: 复兴的农业隐喻
  choice: 保留“向下扎根，向上结果”的具体意象
  alternative: 意译为“根基稳固，并且兴旺”
  rationale: 原文用植物生长描绘犹大余民恢复稳定并重新繁盛；保留隐喻可避免把图像中过于丰富的含义收窄为抽象解释。
- issue: פְּלֵיטַת与הַנִּשְׁאָרָה的关系
  choice: 分别译为“所逃脱”和“剩下”，保留两个相叠的限定
  alternative: 合并译为“幸存的余民”
  rationale: 原文既称这群体为逃脱者，又说他们是留下的；直陈两层描述可保留强调及其细微张力，而不把二者静默合并。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“犹大家”保留民族共同体的传统表达；“向下扎根，向上结果”维持原文简洁、对称的诗性结构。
