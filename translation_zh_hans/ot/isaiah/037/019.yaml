  text: וְ/נָתֹ֥ן אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/019.yaml
  text: and have put their gods into the fire[a], for they were not gods but the work of human hands, wood and stone; so they destroyed them.
translation:
  language: zh_hans
  text: 又把他们的神明投入火中[a]；因为它们并不是神，不过是人手所做、用木头和石头制成的东西；所以他们毁坏了它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的偶像”。希伯来原文说“他们的神明”，随后立刻说明它们并不是真神，而是人手所造之物。
    reason: 提供符合语境的词义替代，同时解释正文保留“神明”的原因。
lexical_decisions:
- source_word: וְנָתֹן
  choice: 又把……投入
  rationale: נתן本义为“给、放置”；与“火中”连用时表示把对象投入火里。“投入”既贴近动作含义，也符合现代汉语。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的神明
  rationale: 直译所指各国所敬奉的诸神；下文随即否认其真实神性。用“神明”可自然表达复数泛指，同时不预先改译为“偶像”。
- source_word: בָּאֵשׁ
  choice: 火中
  rationale: 介词与动词共同表达投入火里的方向和处所，汉语译为“投入火中”自然准确。
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: 因为它们并不是神
  rationale: 保留原文直接否认这些所谓神明具有真实神性的论断。“它们”也呼应下文这些对象是人造物。
- source_word: כִּי אִם
  choice: 不过是
  rationale: 此处构成排除性的转折，意为“不是……而只是……”。“不过是”准确传达贬抑和对比语气。
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: 人手所造的
  rationale: 自然而简洁地保留“人的手所作之物”的含义，突出人造之物与真神之间的对比。
- source_word: עֵץ וָאֶבֶן
  choice: 是木头和石头
  rationale: 原文以同位成分说明这些人造物的材质；补出“是”使现代汉语关系清楚。
- source_word: וַיְאַבְּדוּם
  choice: 所以他们能把它们毁灭
  rationale: 希伯来语使役义表示“使之灭亡、毁掉”。“所以”呈现上下文逻辑；补入“能”说明这些物件之所以可被毁灭，是因其仅为木石人造物，并未改变事件已经发生的语境。
theological_decisions:
- issue: 列国所敬奉对象的身份
  choice: 先译作“他们的神明”，随后说“它们并不是神”
  alternative: 译作“他们的偶像”，随后说“它们并不是神”
  rationale: 原文先采用这些对象在列国崇拜语境中的称谓，继而明确否认其神性。保留这一张力，比一开始就译作“偶像”更能体现原文的论辩力度。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“神明”比“诸神”更自然地与所属语“他们的”搭配；用“它们”指这些木石人造物，体现下文对其非神性的揭示。
