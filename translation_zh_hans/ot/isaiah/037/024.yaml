base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/024.yaml
  text: By your servants you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest height[c][b], its fruitful forest.’
translation:
  language: zh_hans
  text: '你借着你的臣仆讥讽主[a]，说：


    “我凭众多战车，

    登上了群山的高处，

    到了黎巴嫩最偏远之处。

    我要砍倒那里的高大香柏树，

    以及最上等的柏树[b]；

    我要进入它最远的高处，

    进入它那繁茂如园的森林[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “讥讽”也可译作“辱骂”或“嘲弄”；希伯来语词含带着轻蔑侮辱、挑衅的意思。
    reason: lexical_alternative
  - marker: b
    text: 这里所说的树种（希伯来语 berosh）不能确定，也可能是冷杉、柏树或另一种针叶树。
    reason: lexical_alternative
  - marker: c
    text: “繁茂如园的森林”原文把“森林”与肥美的园地或果园意象结合起来；也可译作“它繁茂的森林”或“它如肥美园地般的森林”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד עֲבָדֶיךָ
  choice: 借着你的臣仆
  rationale: בְּיַד在此表示施事的媒介，即亚述王借臣仆传话；“借着”自然保留工具义。“臣仆”符合君王使者的语境。
- source_word: חֵרַפְתָּ
  choice: 讥讽
  rationale: 该动词含侮辱、嘲弄和公然蔑视之意；“讥讽”在现代汉语中简明自然，同时以脚注保留“辱骂、蔑视”的语义范围。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 此处是神的称号אֲדֹנָי，并非圣名יהוה；译作“主”可保持两者的区别。
- source_word: בְּרֹב רִכְבִּי
  choice: 凭众多战车
  rationale: רֹב表示众多，רֶכֶב在此指战车或战车部队；“凭”表现亚述王以军力为夸口和倚仗。
- source_word: אֲנִי עָלִיתִי
  choice: 我……登上了
  rationale: 保留显式第一人称“我”；中文主语本身已能在夸口语境中承载强调，无须生硬加入“亲自”。完成式按已取得成就的夸口译为“登上了”。
- source_word: מְרוֹם הָרִים
  choice: 群山的高处
  rationale: 较为贴近מְרוֹם的“高处、高地”之义，又符合现代汉语。
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: 黎巴嫩最深远之地
  rationale: יַרְכְּתֵי可指尽头、深处或边远部分；“最深远之地”保留侵入遥远腹地的空间意象。
- source_word: קוֹמַת אֲרָזָיו
  choice: 其中高大的香柏树
  rationale: קוֹמָה表示高度或身量，转为自然汉语形容语“高大的”；后缀所指为黎巴嫩。
- source_word: מִבְחַר בְּרֹשָׁיו
  choice: 最上等的柏树
  rationale: מִבְחַר指精选、上等；בְּרוֹשׁ所指树种不确定，正文采用传统且易懂的“柏树”，脚注说明其他可能。
- source_word: מְרוֹם קִצּוֹ
  choice: 它最远的高处
  rationale: מְרוֹם为高处，קֵץ及其后缀表达尽头或极处；直译式表达保留原文略显凝缩而可能兼有“最高处／最远处”的空间张力。
- source_word: יַעַר כַּרְמִלּוֹ
  choice: 它那繁茂如园的森林
  rationale: יַעַר是森林；כַּרְמֶל可指肥美园地、果园或茂盛之地。“繁茂如园的森林”同时保留森林与丰饶园地两重意象，避免只取其一。
theological_decisions:
- issue: 神的称号אֲדֹנָי如何翻译
  choice: 主
  alternative: 耶和华
  rationale: 马所拉文本此处读אֲדֹנָי，是神的主权称号，而不是四字圣名יהוה，因此不将其改译为“耶和华”。
- issue: 亚述王夸口中的完成式与未完成式
  choice: “登上了”与“我要砍倒／进入”
  alternative: 全部译成过去时，或全部译成将来时
  rationale: 原文先用完成式עָלִיתִי陈述所夸称的成就，继而用未完成式表达企图或决心；保留这种时态／情态转折，不替文本消解其修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话，并以诗行呈现夸口式言语。正文适度保留希伯来语的空间意象和“森林／丰饶园地”的复合表达；所有脚注标记均置于相关词语之后。
