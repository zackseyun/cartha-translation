  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר בָּ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָב֖וֹא נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/034.yaml
  text: By the way that he came, by it he will return, and he will not come into this city, declares Yahweh.
translation:
  language: zh_hans
  text: 他必从他来时所走的路返回，必不来到这城。这是雅威的宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָּהּ
  choice: 他从哪条路来，也必从那条路
  rationale: דֶּרֶךְ 指道路、路线；介词短语 בָּהּ 回指阴性名词 דֶּרֶךְ。中文用“哪条路……那条路”自然保留原文对同一路线的重复强调。
- source_word: יָשׁוּב
  choice: 返回
  rationale: שׁוּב 在此表示按原路回去；“返回”简洁庄重，并与前面的来路形成对应。
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבוֹא
  choice: 他必不能进入这城
  rationale: בוא 与 אֶל 表示朝向并来到城中；“进入这城”符合现代汉语表达，也清楚传达他不能抵达并进城。连接词 וְ 在中文分号后的句意承接中自然体现，无须机械译出“并且”。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם 是先知话语中标明神圣权威的固定宣告公式；采用名词性表达保留其庄重语气。יהוה 按其专名译作“雅威”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的发音重构，并保留其作为专名的性质，不以称号代替。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“哪条路……那条路”兼顾自然表达与原文重复；分号凸显按原路返回与不得进城这两个彼此关联的宣告。
