base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/017.yaml
  text: Incline your ear, O LORD, and hear; open your eyes, O LORD, and see; and hear all the words of Sennacherib, which he has sent to mock the living God.
translation:
  language: zh_hans
  text: 耶和华啊，求你侧耳倾听；耶和华啊，求你睁眼察看。求你听西拿基立所传来、用来辱骂永活的上帝的一切话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: 求你侧耳倾听
  rationale: 保留希伯来文“倾斜耳朵”的祈求意象，同时采用自然、庄重的现代汉语表达。
- source_word: פְּקַח ... עֵינֶךָ
  choice: 求你睁眼察看
  rationale: 直接表达“睁开你的眼睛并看”，与前句的“侧耳倾听”形成平行。
- source_word: סַנְחֵרִיב
  choice: 西拿基立
  rationale: 采用中文圣经传统中通行的亚述王名译法。
- source_word: לְחָרֵף
  choice: 辱骂
  rationale: 该词可指辱骂、毁谤、凌辱或藐视；此处指西拿基立的话对永活上帝构成侮辱。“辱骂”既保留言语行为，也不把含义弱化为一般嘲弄。
- source_word: אֱלֹהִים חָי
  choice: 永活的上帝
  rationale: “永活”自然传达“活着的”这一称号所强调的持续生命与真实权能，并与偶像形成隐含对照。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经中广为人知的传统译名，明确呈现以色列上帝的专名。
theological_decisions:
- issue: “辱骂永活的上帝”的主语所指
  choice: 译为“他派人来说这些话，是要辱骂永活的上帝”
  alternative: 译为“他差来辱骂永活上帝的话”
  rationale: 希伯来文关系从句的主语在语法上是西拿基立，目的不定式表达其差遣的目的。补出“人”使中文自然，但不具体断定使者身份。
- issue: 拟人化祈求语言
  choice: 保留“侧耳”“睁眼”的身体意象
  alternative: 意译为“求你留心垂听、关注察看”
  rationale: 原文以拟人化语言恳求上帝注意并介入；保留意象可维持经文的诗性、迫切感及神学张力，而不暗示上帝此前真的听不见或看不见。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。通过两个“耶和华啊，求你……”保留原文呼告和平行结构；末句略作显化，以避免中文误读关系从句，同时不增加使者身份等原文未明说的信息。
