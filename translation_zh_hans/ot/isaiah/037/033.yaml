source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבוֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עֳלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/033.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He will not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or heap up a siege ramp against it.'
translation:
  language: zh_hans
  text: 所以，雅威论到亚述王这样说：“他必不进入这城，也不在那里射一箭，不带着盾牌来到城前[a]，也不在城前堆起攻城土垒[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不持盾向城进逼。”这里描绘军队持盾逼近、准备攻城的情景。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“不堆筑攻城坡道来攻打它。”希伯来文直译近于“向它倾倒攻城土垒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文，表达由先前宣告引出的结论；现代汉语自然明晰。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接保留上帝的专名，而不以“主”这一称号替代。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 对应先知宣告中常见的使者公式，庄重而符合现代汉语表达。
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: 论到亚述王
  rationale: 介词 אֶל 在此引出神谕所针对的对象；宣告内容使用第三人称，因此“论到”比“对……说”更顺畅。
- source_word: לֹא יָבוֹא אֶל הָעִיר הַזֹּאת
  choice: 他必不能进这城
  rationale: 表达亚述王及其军队不能进入耶路撒冷；“必不能”体现否定预告的确定性。
- source_word: וְלֹא יוֹרֶה שָׁם חֵץ
  choice: 也不能在那里射箭
  rationale: 准确保留“在那里”和“射箭”的具体军事图景。
- source_word: וְלֹא יְקַדְּמֶנָּה מָגֵן
  choice: 不能持盾向城进逼
  rationale: קדם 的具体语感可指来到面前、迎向或进逼；结合围城语境，以“持盾向城进逼”清楚呈现攻城行动，同时不把动作过度具体化。
- source_word: וְלֹא יִשְׁפֹּךְ עֳלֶיהָ סֹלְלָה
  choice: 也不能堆筑攻城坡道来攻打它
  rationale: שׁפך 字面为“倾倒”，与 סֹלְלָה 连用时描绘堆土筑成攻城坡道；采用现代读者容易理解的军事用语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名，译作“雅威”可保留其专名性质，避免以称号“主”取代；“耶和华”是传统形式，但较不贴近该名通常推定的读音。
- issue: 否定预告的语气
  choice: 必不能
  alternative: 不会
  rationale: 这些未完成式受 לֹא 否定，在神谕中表达确定不会发生的事；“必不能”传达宣告的确定性，但不额外引入行为能力方面的神学解释。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“这城”保留现场指示感；连续使用“不能”再现原文反复否定的力度。军事术语力求通俗，脚注保留 קדם 与 שׁפך סֹלְלָה 的字面意象及译法空间。
