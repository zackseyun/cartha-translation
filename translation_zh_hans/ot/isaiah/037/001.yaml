  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/001.yaml
  text: And it happened[a], when King Hezekiah heard it, that he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: zh_hans
  text: 希西家王一听见这事[a]，就撕裂自己的衣服，披上麻衣，进了雅威的殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“希西家王听见”，没有明说听见什么；“这事”是根据上文补出的，所指可由上文得知。
    reason: 说明希伯来文省略了“听见”的宾语，并标明正文为使现代汉语通顺而作的指代性补足。
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: 听见……就
  rationale: וַיְהִי与כִּ加不定式共同构成叙事中的时间背景；现代汉语用“听见……就”自然表达事件承接，无须生硬译作“事情发生了”。
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: 希西家王
  rationale: 保留“王”的称号和希西家的名字，并采用自然的现代汉语称谓次序。
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: 撕裂衣服
  rationale: 直译其哀恸、惊惧时的实际动作，不把动作解释性改写为单纯的情绪描述。
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: 披上麻衣
  rationale: 动词为反身形式，指他以粗麻布遮身；“披上麻衣”既符合汉语表达，也保留哀悼服饰的文化意象。
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: 进了雅威的殿
  rationale: בוא在此表示进入，בֵּית־יְהוָה在语境中指圣殿；译作“进了……的殿”准确而自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，区别于“主”等称号；“雅威”是现代汉语中对YHWH的通行学术音译之一。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的四字神名，而不是“主”这一称号；采用“雅威”以保留专名性质，同时避免把后期传统读法当作原文发音。
- issue: 撕裂衣服、披上麻衣的含义
  choice: 保留具体动作，不明说其情绪或宗教意义
  alternative: 因悲痛而撕裂衣服，披麻哀悼
  rationale: 这些动作在语境中可表达悲痛、惊惧、谦卑或哀悼；原文未在本节明说其单一含义，因此不作限定性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“听见……就”体现希伯来叙事的时间与承接关系；“麻衣”“殿”保留经文文化背景，又便于普通读者理解。
