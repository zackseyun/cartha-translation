base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Telassar?
translation:
  language: zh_hans
  text: 我的祖先毁灭歌散、哈兰、利色和住在提拉撒的伊甸人[a]时，那些国家的神曾救得了他们吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“伊甸之子”，指伊甸的族人或居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: 救得了……吗
  rationale: 这是נצל的使役词干完成式，用于反问。用“救得了……吗”既表达历史事件，也保留亚述王讥诮、挑战的语气。
- source_word: אוֹתָם
  choice: 他们
  rationale: 直接宾语代词回指歌散、哈兰、利色及伊甸人所代表的居民或群体；中文用“他们”自然承接后列对象。
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: 这些列国的神
  rationale: 复数结构指各国所敬奉的神明；“列国的神”准确保留古代地缘政治及宗教语境，“这些”使中文回指更清楚。
- source_word: אֲשֶׁר הִשְׁחִיתוּ אֲבוֹתַי
  choice: 我祖先毁灭……时
  rationale: שׁחת使役词干在军事语境中意为毁灭、摧毁；אֲבוֹתַי在王朝话语中指先祖或前代君王，译作“我祖先”比现代汉语中的“我父辈”更准确。将关系从句调整为时间背景，使中文自然，同时不改变谁毁灭谁。
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: 歌散、哈兰、利色
  rationale: 按现代中文圣经地名惯例音译三个地名。
- source_word: וּבְנֵי עֶדֶן
  choice: 伊甸人[a]
  rationale: 字面为“伊甸之子”，此处是群体称谓，指伊甸的居民或族人；正文译为自然的“伊甸人”，脚注保留字面信息。
- source_word: אֲשֶׁר בִּתְלַשָּׂר
  choice: 住在提拉撒的
  rationale: 关系从句最自然地修饰紧邻的“伊甸人”；介词ב表示所在地点，以“住在”明确居民与地点的关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。为避免连续关系从句造成歧义，将希伯来语结构重组为“我祖先毁灭……时……神救得了他们吗”，保留原文的反问与讥诮力度；所有专名采用常见简体中文译名。
