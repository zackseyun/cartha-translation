  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָה קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/023.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel.
translation:
  language: zh_hans
  text: 你辱骂、亵渎的是谁？你向谁扬声，又高高地抬起眼睛？就是以色列的圣者！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: 辱骂
  rationale: 该词在此指以言语羞辱、毁谤；“辱骂”既保留敌对言辞的力度，也符合现代汉语表达。
- source_word: גִדַּפְתָּ
  choice: 亵渎
  rationale: 该词在对象为上帝时含有冒犯、毁谤神圣者之意；“亵渎”准确呈现其宗教语境和递进力度。
- source_word: הֲרִימוֹתָה קּוֹל
  choice: 扬声
  rationale: 保留希伯来语“抬高声音”的意象，表达放肆地高声说话。
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: 高傲地抬起眼睛
  rationale: מָרוֹם 字面关联“高处/高高地”，语境体现傲慢姿态；译文自然表达其含义，同时保留抬眼的身体意象。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 采用以赛亚书中这一神圣称号的直接、庄重译法。
theological_decisions:
- issue: 末句与前两问的关系
  choice: 你所攻击的，正是以色列的圣者！
  alternative: 向着以色列的圣者。
  rationale: 原文末句是介词短语“向着/攻击以色列的圣者”，承接前面的质问并揭示其对象。汉语补出“你所攻击的，正是”以清楚呈现修辞落点，不增加特定宗派解释。
- issue: “抬起眼睛”的道德色彩
  choice: 高傲地抬起眼睛
  alternative: 向高处抬起眼睛
  rationale: 原文结构可被较字面地理解为“向高处抬眼”，也可在本段语境中表达高傲挑衅。正文采用符合上下文的自然汉语，但不将其扩展为更具体的神学判断。
translation_notes:
  register: 采用现代、庄重而有力度的质问语气；前两句保持平行结构，末句以强调式收束，适合先知审判言辞的语境。
