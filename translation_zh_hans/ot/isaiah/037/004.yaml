id: ISA.37.4
reference: Isaiah 37:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/004.yaml
  text: Perhaps Yahweh your God will hear the words of the Rabshakeh[a], whom the king of Assyria his master has sent to reproach the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that is found.
translation:
  language: zh_hans
  text: 或许雅威你的神会听见拉伯沙基[a]的话；亚述王——他的主人——差他来辱骂永活的神，并会因雅威你的神所听见的这些话而责备。所以，你要为现今仍在的余民[c]献上祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉伯沙基”是亚述的官衔，在这里像名字一样用来称呼这名官员；也可译作“酒政总管”。
    reason: cultural_note
  - marker: c
    text: “现今仍在的余民”也可译作“剩下的幸存者”或“留下的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: 或许……会听见
  rationale: 保留“或许”所表达的盼望与不确定性；“听见”既忠于原动词，也可由语境体现留意并回应之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，而不以称号替代专名。
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 此处像专名一样指称亚述官员；采用音译，并以脚注说明它原是官衔。
- source_word: לְחָרֵף
  choice: 辱骂
  rationale: 表达带有蔑视、侮辱和亵渎意味的言语攻击，比单纯“嘲笑”更符合语境。
- source_word: אֱלֹהִים חַי
  choice: 永活的神
  rationale: 自然保留原文“活着的神”与无生命偶像之间的神学对照；“永活”是庄重而通行的现代汉语表达。
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: 会为此斥责他
  rationale: 原文可指责备、判明或追究这些话；汉语补出受斥责者“他”，使表达自然，但用脚注保留原文针对“这些话”施行责斥或追究的歧义。
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: 所以，你要……献上祷告
  rationale: 表达上下文中的劝请与结果关系；“献上祷告”在现代汉语中庄重自然。
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: 现今尚存的余民
  rationale: “余民”保留以赛亚书中可能具有的神学回响，“现今尚存”则自然表达定冠分词所指仍在、可见的幸存群体。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译保留其专名性质，不以“主”这一称号取代。
- issue: וְהוֹכִיחַ 的施事与对象
  choice: 雅威因所听见的话斥责那官员
  alternative: 雅威责断或追究他所听见的那些话
  rationale: 上下文最自然地以雅威为承接的主语，并以拉伯沙基为实际受责者；脚注保留希伯来语把“话”置于介词短语中所产生的语义张力。
- issue: שְׁאֵרִית 的含义
  choice: 余民
  alternative: 幸存者；剩下的人
  rationale: “余民”既能指实际幸存的人，也保留该词在以赛亚书中可能承载的神学意义，而不在正文中进一步解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“雅威你的神”保留原文第二人称领属关系；将较长的希伯来语句分为三句，以免关系从句和连续谓语造成汉语理解困难。正文保留“或许”的不确定语气、神名的专名性质以及“余民”的神学张力；对官衔和 וְהוֹכִיחַ 的词义歧义以脚注说明。
