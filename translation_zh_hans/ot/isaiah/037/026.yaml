  text: הֲ/לֽוֹא שָׁמַ֤עְתָּ לְ/מֵֽ/רָחוֹק֙ אוֹתָ֣/הּ עָשִׂ֔יתִי מִ֥/ימֵי קֶ֖דֶם וִ/יצַרְתִּ֑י/הָ עַתָּ֣ה הֲבֵאתִ֔י/הָ וּ/תְהִ֗י לְ/הַשְׁא֛וֹת גַּלִּ֥ים נִצִּ֖ים עָרִ֥ים בְּצֻרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/026.yaml
  text: Have you not heard? Long ago I made it; from days of old I formed it. Now I have brought it to pass[a], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: zh_hans
  text: 你没有听说吗？早在远古，我已作成这事；自古以来，我已使它成形。如今，我已使它实现，好叫你使坚固城成为荒凉的废墟。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句句法和“废墟堆”一词的搭配较难直译。此处通常理解为上帝使被责问者毁坏坚固城，使之成为荒凉的废墟；也可较宽泛地理解为坚固城沦为荒凉的废墟。
    reason: 说明末句难解的希伯来语结构，并保留对结果关系的较宽泛理解，同时不误称动词形式为阴性单数。
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעְתָּ
  choice: 你没有听说吗
  rationale: 保留期待肯定回答的反问语气，也传达对亚述王的责问意味。
- source_word: לְמֵרָחוֹק
  choice: 早在很久以前
  rationale: 介词短语字面与“遥远”有关，此处按时间义理解，指久远以前。
- source_word: אוֹתָהּ עָשִׂיתִי
  choice: 我就做成了这事
  rationale: 阴性宾语代词所指并未明说；用“这事”保留抽象指代，עָשִׂיתִי 则采用直接而具体的“做成”。
- source_word: מִימֵי קֶדֶם וִיצַרְתִּיהָ
  choice: 在古时的日子，我就使它成形
  rationale: “古时的日子”保留希伯来语的古远时间表达；יצר 的塑造意象译作“使它成形”，不直接改写为较抽象的“计划”。
- source_word: עַתָּה הֲבֵאתִיהָ
  choice: 如今，我使它实现
  rationale: 使役形态表示使先前形成之事进入现实；“实现”自然呈现从古时定下到当下发生的转折。
- source_word: לְהַשְׁאוֹת
  choice: 使……化为荒凉
  rationale: 该词表达摧毁、使荒废的结果；中文采用结果式结构，符合上下文。
- source_word: גַּלִּים נִצִּים עָרִים בְּצֻרוֹת
  choice: 使坚固城化为荒凉的乱石堆
  rationale: 句末希伯来语结构及 נִצִּים 的确切作用较难确定；译文表达清楚的总体图景，即坚固城被毁后成为瓦砾堆，同时以脚注提示原文难点。
theological_decisions:
- issue: 上帝对亚述征服行动的主权
  choice: 译文明确说上帝早已做成并塑造此事，如今又使它实现。
  alternative: 只表达上帝早已预知这些事件。
  rationale: “我做成了……我使它成形……如今我使它实现”所表达的不只是预知，而是有目的的安排和历史中的成就；译文保留这一神学张力，不另加哲学解释。
- issue: 末句是否明说亚述王为毁城者
  choice: 不在正文中补入“你”，而把末句译为所成就之事的结果：“使坚固城化为……”。
  alternative: 译作“使你把坚固城摧毁成乱石堆”。
  rationale: 马所拉文本的 וּתְהִי 是阴性单数形式，并非明确的第二人称阳性形式；上下文固然涉及亚述王的行动，但正文不宜把语法上未明说的第二人称主语强行补入。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“古时的日子”“使它成形”保留先知文本的高雅语感和塑造意象；“荒凉的乱石堆”则以普通读者容易理解的具体图景呈现城池被毁的结果。
