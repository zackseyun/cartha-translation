base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/008.yaml
  text: Then the Rabshakeh returned and found the king of Assyria fighting against Libnah[b][a], for he had heard that he had departed from Lachish.
translation:
  language: zh_hans
  text: 于是拉伯沙基[a]回去，发现亚述王正在攻打立拿[b]，因为拉伯沙基听说亚述王已经离开了拉吉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“酒政长”。“拉伯沙基”是亚述官衔；这里沿用音译，因为该官衔在叙事中也用来指称这名官员。
    reason: lexical_alternative
  - marker: b
    text: 或译“正在立拿交战”。原文表达也可偏重交战地点；按上下文，意思是亚述王正在攻打这座城。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回去
  rationale: שׁוב在连续叙事中表示返回；结合拉伯沙基先前奉命前往耶路撒冷的语境，“回去”自然简洁。
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 这是亚述宫廷官衔，在叙事中也用来指称这名官员。沿用音译可避免把其具体职掌解释得过死。
- source_word: וַיִּמְצָא אֶת
  choice: 发现
  rationale: מצא带直接宾语，基本义为“找到、发现”；此处表示他回去后发现亚述王所在及其行动。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 标准属格结构，现代汉语中译作“亚述王”简洁自然。
- source_word: נִלְחָם עַל
  choice: 正在攻打
  rationale: לחם的Niphal分词与עַל连用，表示正与某对象交战；以城市为对象时，“攻打”自然保留敌对含义。
- source_word: לִבְנָה
  choice: 立拿
  rationale: 地名，采用现代中文圣经语境中通行的音译。
- source_word: כִּי שָׁמַע
  choice: 因为他听说
  rationale: 首个כִּי说明拉伯沙基返回并发现亚述王在立拿的背景缘由；“因为”清楚表达因果关系。
- source_word: כִּי נָסַע
  choice: 已经离开了
  rationale: 第二个כִּי引出所听见的内容；נסע可指拔营、启程或离开。“已经离开了”自然表达该行动先于当前叙事场景。
- source_word: מִלָּכִישׁ
  choice: 拉吉
  rationale: 介词מִן表示“从”，地名采用现代中文圣经语境中通行的音译。
theological_decisions:
- issue: 末句两个男性单数主语可能造成指代含混
  choice: 将末句主语明确为“亚述王”
  alternative: 保留“他已经离开了拉吉”
  rationale: 希伯来语语法上两个“他”理论上可能引起表面含混，但语境显示消息内容是亚述王已离开拉吉，且拉伯沙基本人正是返回并寻找他。中文若连续使用“他”会产生不必要的歧义，因此明确指称，不改变叙事意义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。保留亚述官衔“拉伯沙基”的传统音译，并以脚注说明职衔译法；叙事动词简洁连贯。
