base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[b][a], and he went up to the house of Yahweh and spread them before Yahweh.
translation:
  language: zh_hans
  text: 希西家从使者手中接过那些书信，读了这些书信[a]，就上到雅威的殿，在雅威面前把书信展开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“读它”和后面的“展开它”都使用单数宾语后缀，可能把这些书信所传达的信息视为一个整体。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: 那些书信
  rationale: סֵפֶר泛指书写的文书；此处是亚述使者送来的书面信息，现代汉语用“书信”自然且符合叙事语境。
- source_word: מִיַּד הַמַּלְאָכִים
  choice: 从使者手中接过
  rationale: 保留“从……手中”的希伯来语意象，并用“接过”自然表达收取文书的动作；מַלְאָכִים在此指人的使者，而非天使。
- source_word: וַיִּקְרָאֵהוּ
  choice: 读了
  rationale: קרא以书面信息为宾语时意为“读”。原文宾语后缀为单数，可统指书信所载的信息；汉语省略宾语，既自然，也保留单复数之间的张力。
- source_word: וַיַּעַל בֵּית יְהוָה
  choice: 就上到雅威的殿
  rationale: “上到”保留עלה的方向含义，也符合前往圣殿所在高处的叙述；“殿”自然表达“雅威的家/殿宇”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，明确呈现原文使用的专名，而不以称号替代。
- source_word: וַיִּפְרְשֵׂהוּ
  choice: 把书信……展开
  rationale: פרשׂ意为“展开、铺开”。原文用单数后缀，可能把多封书信视为一个整体信息；正文按汉语自然表达用“书信”，脚注说明这一形式差异。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 直接传达“在雅威面前/临在中”的空间与敬拜语境，避免额外解释希西家的动机。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用现代汉语中较能反映其可能发音的“雅威”，保留专名性质，不以“主”这一称号取代。
- issue: 希西家展开书信这一行为的含义
  choice: 仅叙述他把书信在雅威面前展开
  alternative: 解释为祷告、申诉或象征性地交托给神
  rationale: 动作发生在圣殿中并面向雅威，具有明显宗教语境，但本节没有明说其完整神学含义，因此不在正文中替叙事作进一步定论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“从使者手中接过”保留原文意象；“殿”比“房屋”更准确地指向圣殿。正文只设一个脚注，并确保标记[a]出现在相关词句之后。
