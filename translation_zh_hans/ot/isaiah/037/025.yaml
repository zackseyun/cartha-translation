  text: אֲנִ֥י קַ֖רְתִּי וְ/שָׁתִ֣יתִי מָ֑יִם וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/025.yaml
  text: I dug and drank water[b][a], and with the sole of my feet I dried up all the streams of Egypt.
translation:
  language: zh_hans
  text: “我挖了井，喝了水；我用脚掌踏干了埃及[a]所有的河道[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “埃及”：希伯来文作“玛琐”，这里很可能是埃及的诗体或异名；这个词在其他语境中也可指“围困”或“堡垒”。
    reason: alternative_reading
  - marker: b
    text: “河道”也可译作“水渠”或“尼罗河的支流”。原词在埃及语境中常特指尼罗河水系的河道。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: 我
  rationale: 希伯来文独立人称代词在此带有强调色彩；汉语以句首“我”配合整句夸胜语气，自然表达说话者的自我炫耀。
- source_word: קַרְתִּי וְשָׁתִיתִי מָיִם
  choice: 挖井取水来喝
  rationale: 动词表示为取得水而挖掘；原文未明说“井”，但汉语若直译为“挖掘并喝水”不自然，因此以“挖井取水”明示语境中自然蕴含的动作。
- source_word: וְאַחְרִב
  choice: 踏干了
  rationale: חרב的使役式以水道为宾语，意为“使干涸”；与“脚掌”合译为“踏干”，保留原文夸张而鲜明的征服意象。
- source_word: בְּכַף פְּעָמַי
  choice: 用脚掌
  rationale: כַּף用于脚时指脚掌或脚底；“用脚掌”简洁自然，并保留身体意象。
- source_word: יְאֹרֵי
  choice: 河道
  rationale: יְאֹר在埃及语境中常指尼罗河及其支流或人工水渠；“河道”既通顺，也能涵盖天然支流和运河，具体含义交由脚注说明。
- source_word: מָצוֹר
  choice: 埃及
  rationale: 在“河道”这一搭配中，מָצוֹר很可能是埃及的诗体或异名；正文译出地理所指，词形及其他常见义保留在脚注中。
