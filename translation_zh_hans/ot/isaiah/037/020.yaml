  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֖/נוּ מִ/יָד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּֽי אַתָּ֥ה יְהוָ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/020.yaml
  text: And now[a], Yahweh our God, save us from his hand[b], so that all the kingdoms of the earth may know that you alone are Yahweh.
translation:
  language: zh_hans
  text: 如今，雅威——我们的上帝啊，求你救我们脱离他的手[a]，使地上万国都知道，唯有你是雅威[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救我们脱离他的手”也可译作“把我们从他的权势下解救出来”。
    reason: 说明希伯来文“手”在这里可指人的权势或控制，同时保留正文中的原文意象。
  - marker: b
    text: 希伯来文直译为“唯有你是雅威”；在本节列国的语境中，这强调雅威独一无二。
    reason: 说明末句的排他意义，避免将其扩写为原文未直接陈述的“掌管”行为。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语与时间标记，引出祷告的核心祈求；现代汉语用“现在”已能自然承接上文，无须生硬保留连接词。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 保留第一人称复数所属关系，以及祷告中群体性的称呼。
- source_word: הוֹשִׁיעֵנוּ
  choice: 求你救我们
  rationale: 这是ישׁע的使役词干祈使式，在祷告语境中表达恳求；“求你救我们”既直接又符合现代汉语。
- source_word: מִיָדוֹ
  choice: 脱离他的手
  rationale: 保留希伯来文“手”的意象，表示脱离亚述王的权势和控制；汉语中也可自然理解。
- source_word: וְיֵדְעוּ
  choice: 使……都知道
  rationale: 在祈使式之后，该未完成式在语境中表达目的或结果；“使……知道”自然呈现这一关系。
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: 地上万国
  rationale: 语境涉及列国，范围广于某一片土地；“地上万国”简洁保留普世范围。
- source_word: כִּי
  choice: （知道的内容，无独立译词）
  rationale: 此处引出“知道”的内容，现代汉语无需另加“即/那”，可直接接宾语从句。
- source_word: אַתָּה יְהוָה לְבַדֶּךָ
  choice: 唯有你是雅威
  rationale: 把לְבַדֶּךָ的排他强调落在“你”上，保留“只有你是雅威”的原文断言，不在正文中扩写为“唯有你是上帝”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，音译为“雅威”可区别于称号“主”，并直接保留以色列所呼求的神名。
- issue: 末句לְבַדֶּךָ的排他意义
  choice: 唯有你是雅威
  alternative: 你雅威是独一的；唯有你是上帝
  rationale: 希伯来文强调雅威的独一性。正文保持紧贴句法的排他断言；不把“上帝”补入正文，以免替原文进一步解释，但脚注说明其语境含义。
- issue: וְיֵדְעוּ表达目的还是结果
  choice: 目的：“使……都知道”
  alternative: 结果：“这样……就会知道”
  rationale: 紧接祈求“救我们”，上下文最自然地表达希西家祈求拯救的目的；中文措辞仍可涵盖由拯救产生的结果。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威——我们的上帝啊”以同位称呼呈现祷告语气；“地上万国”沿用清楚而凝练的经文表达。脚注标记均放在其所说明的正文短语之后。
