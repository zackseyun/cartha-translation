  text: אָמְנָ֖ם יְהוָ֑ה הֶחֱרִ֜יבוּ מַלְכֵ֥י אַשּׁ֛וּר אֶת כָּל הָ/אֲרָצ֖וֹת וְ/אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/018.yaml
  text: Truly[a], O Yahweh, the kings of Assyria have laid waste all the lands and their own land[b],
translation:
  language: zh_hans
  text: 耶和华啊，亚述诸王确实毁坏了各地[a]和他们的土地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“各国”。希伯来词可按语境指土地、地域或国家。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“他们的土地”；这里的代词所指并不完全明确，也有人依据平行经文将其理解为“他们的土地”（复数）。
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְנָם
  choice: 确实
  rationale: 该词在此确认随后所说的事实，并带有强调语气；“确实”自然、庄重，也适合希西家祷告中的让步性承认。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名“耶和华”表达四字神名，保留其作为名字而非称号的性质。
- source_word: הֶחֱרִיבוּ
  choice: 使……荒废
  rationale: 使役形表达使某地成为废墟、遭到毁坏；“使……荒废”准确体现军事蹂躏造成的荒凉。
- source_word: מַלְכֵי אַשּׁוּר
  choice: 亚述诸王
  rationale: 简洁保留希伯来语属格结构和复数含义，符合庄重的现代汉语。
- source_word: אֶת כָּל הָאֲרָצוֹת
  choice: 各地
  rationale: אֲרָצוֹת可指土地、地域或国家；“各地”保留其地域意义和一定的语义宽度，不把所指过早限定为现代意义的国家。
- source_word: וְאֶת אַרְצָם
  choice: 和他们的土地
  rationale: 按所给马所拉文本保留单数名词及第三人称阳性复数后缀，不用“自己的”锁定所指，也不擅自改成复数。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；译作中文读者熟悉的专名“耶和华”，既不以“主”替代，也保留其圣约名字的性质。
- issue: “他们的土地”所指
  choice: 保留代词指向的含混性
  alternative: 他们自己的土地／那些地方所属的土地
  rationale: 希伯来语只有复数代词后缀，没有明确说明先行词；直译“他们的土地”可避免替原文解决指代问题。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。调整英文咨询层中脚注[a]的位置，使词义脚注紧随“各地”；句末使用完整陈述句，不保留英文片段式逗号。
