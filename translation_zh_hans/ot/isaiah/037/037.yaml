  yaml_path: translation/ot/isaiah/037/037.yaml
  text: So Sennacherib king of Assyria departed and went and returned[a], and dwelt in Nineveh.
translation:
  language: zh_hans
  text: 于是，亚述王西拿基立起程离去，返回尼尼微，住在尼尼微[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“留在尼尼微”。原文动词可表示居住或停留。
    reason: 保留ישׁב在此处“居住”与“停留”之间的词义幅度，并使地点与原文的“在尼尼微”相对应。
lexical_decisions:
- source_word: וַיִּסַּע
  choice: 起程
  rationale: 该动词在行旅叙事中表示拔营、动身或起程；“起程”保留出发动身之意，又不额外限定为军营场景。
- source_word: וַיֵּלֶךְ
  choice: 离去
  rationale: 原文使用常见的“去、行走”动词，并与前一动词连用；译作“离去”既保留连续动作，也符合现代汉语表达。
- source_word: וַיָּשָׁב
  choice: 返回
  rationale: 该动词在此行旅语境中意为返回，指西拿基立从犹大撤离后回到尼尼微。
- source_word: סַנְחֵרִיב
  choice: 西拿基立
  rationale: 采用现代中文圣经传统中通行的亚述王名译法。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 简洁、自然地表达原文的属格结构“亚述的王”，并作为人名的同位称号。
- source_word: וַיֵּשֶׁב
  choice: 住在那里
  rationale: ישׁב可表示坐、停留或居住；在返回尼尼微之后的语境中，“住在那里”自然表达其居留状态，同时避免“定居”所可能带来的过度确定性。
- source_word: בְּנִינְוֵה
  choice: 尼尼微
  rationale: 采用该古城名称的通行中文译名；地点关系通过“返回尼尼微”及“住在那里”自然表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“起程离去，返回”适度保留希伯来文连续三个行旅动词的推进感；“住在那里”避免古雅的“居于”以及语义较强的“定居”。
