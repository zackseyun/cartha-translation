id: ISA.37.16
reference: Isaiah 37:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/016.yaml
  text: O Yahweh of hosts[a], God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.
translation:
  language: zh_hans
  text: 万军之雅威啊，以色列的上帝啊，你坐在基路伯之上[a]；唯有你是地上万国的上帝。诸天和大地都是你造的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“住在基路伯之间”，又或“坐在基路伯上登基掌权”。
    reason: 希伯来语 יֹשֵׁב הַכְּרֻבִים 可强调居住，也可表达以基路伯为宝座的登基掌权意象；原文未明说“之间”。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现上帝的专名，以现代普通话音译“雅威”，不以称号替代。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 保留传统且宽广的语义，可涵盖天上的众军与军旅力量；与神名合成“万军之雅威”。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 自然呈现希伯来文的属格结构；上下文明确为单数。
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: 坐在基路伯之上
  rationale: “坐”贴近分词 יֹשֵׁב，并在此敬拜语境中带有登基掌权的意象；“之上”自然表达与基路伯相关的宝座图景，同时将“居于……之间”等可能译法收入脚注。
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: 唯有你是……的上帝
  rationale: “唯有你”同时表达 אַתָּה הוּא 的强调和 לְבַדְּךָ 的排他性，形成自然而庄重的中文。
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: 地上万国的
  rationale: 将介词 לְ 与“上帝”之间的关系译成自然中文属格表达，意为雅威是统管地上所有王国的上帝，而不把经文扩写为更强的解释。
- source_word: עָשִׂיתָ
  choice: 造
  rationale: 准确表达常用动词 עשה“做、制造”的创造语境，不特意改用只对应 ברא 的术语。
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: 天与地
  rationale: 采用现代汉语中自然庄重的宇宙整体表达；希伯来文复数“诸天”在普通话里通常以集合性的“天”表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名，故以“雅威”音译，保留其作为立约之神专名的功能，不改成“主”。
- issue: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ 所表达的独一性
  choice: 唯有你是地上万国的上帝
  alternative: 你是唯一的上帝
  rationale: 所选译法保留原句对雅威独一神性的强烈强调，并使 לְכֹל מַמְלְכוֹת הָאָרֶץ 与“上帝”自然相连；避免将经文扩展成更抽象的哲学命题。
- issue: יֹשֵׁב הַכְּרֻבִים 的空间与王权意象
  choice: 坐在基路伯之上
  alternative: 住在基路伯之间
  rationale: “坐”保留原词的基本图像及登基意味；原文没有明确表示“之间”的介词，因此不把该传统理解直接写入正文，而在脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。以“主啊”明确呼语功能；“万国”“天与地”保留经文的宏阔节奏。脚注标记置于其实际说明的“基路伯之上”之后，而非误置于“万军”之后。
