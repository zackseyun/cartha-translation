revisions:
- from: 万军之雅威，以色列的上帝，坐在基路伯之上[a]的主啊！唯有你是地上万国的上帝。天与地都是你造的。
  to: 万军之雅威啊，以色列的上帝啊，你坐在基路伯之上[a]；唯有你是地上万国的上帝。诸天和大地都是你造的。
  rationale: 修正首句的中文句法，删去原文未出现的“主”，以“你坐在基路伯之上”直接表达分词短语，并保留脚注所列的传统替代理解。保留“唯有你是地上万国的上帝”，避免把介词关系扩展为显性的“统管”；以“诸天和大地”更贴近原文的数。
