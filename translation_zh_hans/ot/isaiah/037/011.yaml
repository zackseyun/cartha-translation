id: ISA.37.11
reference: Isaiah 37:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands[b], destroying them utterly—and will you be delivered?
translation:
  language: zh_hans
  text: 看哪，你已经听说亚述诸王怎样对待各国，把它们尽行毁灭[a]；难道你还能获救吗[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把它们彻底毁灭”，又可表达为“把它们置于当灭之列”。希伯来语动词含有使对象全然毁灭的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“你还能逃脱吗？”本句是带有嘲讽意味的反问。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意并加强语气的作用；“看哪”简洁、庄重，也符合现代中文经文语体。
- source_word: שָׁמַעְתָּ
  choice: 你已经听说
  rationale: 第二人称阳性单数完成式，指对方已经获知的事实；“已经听说”自然呈现其完成意义。
- source_word: אֲשֶׁר עָשׂוּ
  choice: 怎样对待
  rationale: 按中文习惯表达“你听说……所做的事”，并顺畅引出其具体行为“尽行毁灭”，不额外限定行为方式。
- source_word: מַלְכֵי אַשּׁוּר
  choice: 亚述诸王
  rationale: 准确表达复数构词关系，也符合庄重而自然的中文历史叙述。
- source_word: לְכָל הָאֲרָצוֹת
  choice: 各国
  rationale: 此处复数名词指亚述征服的众多地域或国家，并非整个大地；“各国”最符合上下文中的政治地理意义。
- source_word: לְהַחֲרִימָם
  choice: 把它们尽行毁灭
  rationale: חרם在此含将对象彻底毁灭之意；“尽行毁灭”既保留彻底性，又避免在正文中采用普通读者难懂的专门术语。
- source_word: וְאַתָּה תִּנָּצֵל
  choice: 难道你还能获救吗
  rationale: 独立代词“你”形成强烈对比，Nifal词形表达被解救；结合语境译作带嘲讽意味的反问句。“还能”体现“那些国家都未能幸免，而你又如何”的语用对比。
theological_decisions:
- issue: 军事审判语境中חרם的译法
  choice: 尽行毁灭
  alternative: 彻底毁灭；置于当灭之列
  rationale: 原词不只是一般破坏，而含有使之完全毁灭的分量。“尽行毁灭”保留这种彻底性，同时不在正文中引入可能需要较多解释的礼仪或神学术语。
- issue: 句末תִּנָּצֵל的语气
  choice: 难道你还能获救吗？
  alternative: 你会获救吗？；你还能逃脱吗？
  rationale: 希伯来文虽无现代问号，但上下文表明这是亚述王对希西家的嘲讽性反问。译成“难道……吗”呈现话语功能，同时保留“获救”所反映的被动语态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留原文强调语气；“亚述诸王”“尽行毁灭”略带经文庄重感，但仍便于普通读者理解。脚注标记均放在其实际说明的词句之后。
