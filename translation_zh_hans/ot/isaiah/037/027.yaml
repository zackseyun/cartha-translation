source:
  edition: WLC
  text: וְ/יֹֽשְׁבֵי/הֶן֙ קִצְרֵי יָ֔ד חַ֖תּוּ וָ/בֹ֑שׁוּ הָי֞וּ עֵ֤שֶׂב שָׂדֶה֙ וִ֣/ירַק דֶּ֔שֶׁא חֲצִ֣יר גַּגּ֔וֹת וּ/שְׁדֵמָ֖ה לִ/פְנֵ֥י קָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/027.yaml
  text: And their inhabitants were powerless[a]; they were shattered and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and like a field before the standing grain.
translation:
  language: zh_hans
  text: 其中的居民无能为力[a]，惊惶蒙羞[b]。他们如田野的草，如嫩绿的青草，如房顶上的草，又如禾稼尚未长成就已枯焦的田地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“手短”，是指没有力量或能力。
    reason: lexical_alternative
  - marker: b
    text: “惊惶”也可译作“被击垮”；原词既可强调内心丧胆，也可强调遭到摧折。
    reason: lexical_alternative
  - marker: c
    text: 末句原文含义较难确定；可能是指庄稼尚未长成便已枯焦。参《列王纪下》19:26的平行经文。
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: יֹשְׁבֵיהֶן
  choice: 其中的居民
  rationale: 该分词带第三人称阴性复数后缀，承接上文所说的城邑，指住在其中的人；“其中的居民”自然地保留了所指关系和集合意义。
- source_word: קִצְרֵי יָד
  choice: 无能为力
  rationale: 原文直译为“手短”，是表示缺乏力量或能力的惯用语；正文译出其实际含义，字面形象在脚注中说明。
- source_word: חַתּוּ
  choice: 惊惶
  rationale: חתת可表示被击垮、惊惶或丧胆。此处与“蒙羞”并列，“惊惶”既符合战败语境，也不把词义限死为身体上的粉碎。
- source_word: וָבֹשׁוּ
  choice: 蒙羞
  rationale: בוש表示羞愧、受辱；“蒙羞”简洁地表达因失败而遭受羞辱的结果。
- source_word: עֵשֶׂב שָׂדֶה
  choice: 田野的草
  rationale: 按构词关系直接翻译，保留脆弱、短暂的植物意象。
- source_word: וִירַק דֶּשֶׁא
  choice: 嫩绿的青草
  rationale: יֶרֶק指绿色植物，דֶּשֶׁא指新生草木；“嫩绿的青草”以自然汉语呈现鲜嫩却易凋残的形象。
- source_word: חֲצִיר גַּגּוֹת
  choice: 房顶上的草
  rationale: 准确保留古代屋顶浅土中草木迅速枯萎的圣经意象，不额外解释其寓意。
- source_word: וּשְׁדֵמָה לִפְנֵי קָמָה
  choice: 禾稼尚未长成就已枯焦的田地
  rationale: 末句文本和词义均较困难；结合农业意象及《列王纪下》19:26的平行经文，译为庄稼未成熟便遭枯焦，同时以脚注保留不确定性。
