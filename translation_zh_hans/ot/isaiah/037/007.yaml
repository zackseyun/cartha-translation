  to: 看哪，我要使一个灵[a]进入他里面；他必听见一个消息[b]，就返回本国。我要使他在本国倒在刀下。
  rationale: 仅作一处为现代汉语自然度而进行的安全调整：“使一个灵进入他里面”对应神使רוּחַ临到／在他里面起作用的意思，避免原译过于物理化的“放在”表达。其余措辞、事件次序、重复的“本国”及两个脚注锚点均予保留。
