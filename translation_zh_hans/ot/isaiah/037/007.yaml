  text: הִנְ/נִ֨י נוֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב אֶל אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/007.yaml
  text: Behold[a], I am putting a spirit in him, so that he will hear a report and return to his own land[b], and I will cause him to fall by the sword in his own land.
translation:
  language: zh_hans
  text: 看哪，我要使一个灵[a]进入他里面；他必听见一个消息[b]，就返回本国。我要使他在本国倒在刀下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可理解为一种内在的意念、倾向或冲动。
    reason: lexical_alternative
  - marker: b
    text: “消息”或译“传闻”或“风声”；原文并未说明这信息是否已经证实。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留先知话语中引人注意的指示作用；与后面的分词连用时，“我要”自然表达即将施行的行动。
- source_word: נוֹתֵן בּוֹ רוּחַ
  choice: 把一个灵放在他里面
  rationale: 贴近“赐予／放置在他里面”的结构，并以“灵”保留 רוּחַ 可指灵、内在倾向或冲动的语义宽度，不把其机制限定为纯心理状态。
- source_word: שְׁמוּעָה
  choice: 一个消息
  rationale: “消息”是宽泛、中性的表达，不预先断定所得信息是确报还是传闻。
- source_word: וְשָׁב אֶל אַרְצוֹ
  choice: 就返回本国
  rationale: “就”清楚表达前后事件的结果关系；“本国”自然体现“他的国土／土地”的归属含义。
- source_word: וְהִפַּלְתִּיו בַּחֶרֶב
  choice: 我要使他……倒在刀下
  rationale: “使他倒下”保留 נפל 的使役形式，“倒在刀下”则是现代中文中清楚而庄重的被杀表达。
- source_word: בְּאַרְצוֹ
  choice: 在本国
  rationale: 重复“本国”，照应希伯来文的重复，突出他将回到自己的土地并在那里灭亡。
theological_decisions:
- issue: 上帝放在亚述王里面的 רוּחַ 是什么
  choice: 译作“一个灵”，并以脚注说明也可能指内在的意念、倾向或冲动
  alternative: 直接译作“意念”“冲动”或“心态”
  rationale: 原文强调上帝主导王听见消息后的反应，却没有说明这种作用的具体机制；保留“灵”可避免把神学张力化约为单纯心理变化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的语气；“把一个灵放在他里面”刻意保留原文略显不寻常的表达及其歧义；两次使用“本国”重现原文的强调。
