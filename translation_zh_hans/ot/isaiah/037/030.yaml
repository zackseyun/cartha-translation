base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/030.yaml
  text: 'And this will be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; but in the third year sow and reap, and plant vineyards and eat their fruit.'
translation:
  language: zh_hans
  text: “这就是给你的记号：今年，你们要吃自生的庄稼；第二年，要吃由此再长出来的庄稼[a]；第三年，你们要撒种、收割，栽种葡萄园，吃园中的果子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第二年吃第二茬自生的庄稼”或“再生的庄稼”。这里的希伯来词十分罕见，指未经正常播种而长出的农作物。
    reason: 保留罕见农业词 שָׁחִיס 的词义不确定性及主要译法。
lexical_decisions:
- source_word: הָאוֹת
  choice: 凭证
  rationale: 该词带定冠词，指在具体处境中赐给希西家的确认性记号；“凭证”自然表达其印证作用。
- source_word: וְזֶה לְךָ
  choice: 这就是给你的
  rationale: 希伯来文为无系词句；结合下文所指将发生之事，中文以“就是”引出所赐的凭证，既自然又不过度增添时态信息。
- source_word: אָכוֹל
  choice: 你们要吃
  rationale: 不定式绝对式在此具有命令或预告色彩；中文“要吃”保留这两方面可能性，并与后续复数命令式协调。
- source_word: סָפִיחַ
  choice: 自生的庄稼
  rationale: 指未经正常播种而自行长出的农作物；该译法清楚、现代，并保留农业语境。
- source_word: שָׁחִיס
  choice: 由此再长出来的
  rationale: 这是罕见的农业词，可能指第二年从先前作物自然续生的产物；正文采用易懂表达，同时以脚注保留词义的不确定性。
- source_word: זִרְעוּ וְקִצְרוּ
  choice: 撒种收割
  rationale: 保留原文成对的农业动作和简洁节奏；动词为阳性复数，故补出“你们”。
- source_word: וְנִטְעוּ כְרָמִים
  choice: 栽种葡萄园
  rationale: 准确传达原文常见农业表达，现代中文自然庄重。
- source_word: וְאִכְלוּ פִרְיָם
  choice: 吃园中的果子
  rationale: 代词后缀指葡萄园；译为“园中的果子”可避免中文将“它们的果子”误解为生硬拟人，同时保留所指。
