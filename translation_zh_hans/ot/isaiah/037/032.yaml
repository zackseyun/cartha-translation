id: ISA.37.32
reference: Isaiah 37:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י מִ/ירֽוּשָׁלִַ֨ם֙ תֵּצֵ֣א שְׁאֵרִ֔ית וּ/פְלֵיטָ֖ה מֵ/הַ֣ר צִיּ֑וֹן קִנְאַ֛ת יְהוָ֥ה צְבָא֖וֹת תַּֽעֲשֶׂה זֹּֽאת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/032.yaml
  text: For from Jerusalem a remnant will go out[a], and survivors from Mount Zion. The zeal of Yahweh of hosts will do this.
translation:
  language: zh_hans
  text: 因为必有余民从耶路撒冷出来，必有逃脱的人从锡安山出来。万军之耶和华的热忱[a]必成就这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“嫉妒”。希伯来语此词既可指“热忱”，也可指“嫉妒”；这里指耶和华以强烈而坚定的心意实现他的应许。
    reason: 保留 קִנְאַת 的真实词义范围及其神学张力。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为此前的应许提供根据；“因为”自然保留解释或因由的语气。
- source_word: מִירוּשָׁלִַם תֵּצֵא שְׁאֵרִית
  choice: 必有余民从耶路撒冷出来
  rationale: 保留介词所表达的来源、未完成式在语境中的将来意义，以及“余民”这一先知文学中的重要用语；调整汉语词序以求自然。
- source_word: וּפְלֵיטָה מֵהַר צִיּוֹן
  choice: 必有逃脱的人从锡安山出来
  rationale: 原文是与“余民”平行的省略结构；补出“必有”和“出来”，使现代汉语清楚，同时把 פְלֵיטָה 理解为逃脱并存活的人，而非抽象的“拯救”。
- source_word: קִנְאַת
  choice: 热忱
  rationale: 该词可指“热忱”或“嫉妒”；此处强调耶和华积极实现应许的强烈投入。“热忱”较符合语境，同时以脚注保留另一词义。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”呈现神名，并以汉语中庄重且通行的“万军之”表达固定称号，避免将“军”局限为人间军队。
- source_word: תַּעֲשֶׂה זֹּאת
  choice: 必成就这事
  rationale: “成就”自然表达神使所应许之事成为现实；“必”与上下文的确定性相称。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 现代简体中文圣经语域中，“耶和华”是最广为普通读者识别的神名形式，也保留其作为专名而非称号的功能。
- issue: קִנְאַת 用于神时的含义
  choice: 热忱
  alternative: 嫉妒
  rationale: 在本节拯救和存留余民的语境中，重点是神坚定而强烈地促成其应许；但希伯来词确可表达“嫉妒”，故不在正文中并列，而以脚注保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“余民”“锡安山”“万军之耶和华”保留先知文学及圣经语境中的关键表达；平行句中适度补足省略成分，使中文朗读清楚自然。
