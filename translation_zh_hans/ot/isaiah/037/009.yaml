  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע עַל תִּרְהָ֤קָה מֶֽלֶךְ כּוּשׁ֙ לֵ/אמֹ֔ר יָצָ֖א לְ/הִלָּחֵ֣ם אִתָּ֑/ךְ וַ/יִּשְׁמַע֙ וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים אֶל חִזְקִיָּ֖הוּ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/009.yaml
  text: And he heard concerning Tirhakah king of Cush[a], saying, “He has come out to fight against you.” And when he heard, he sent messengers to Hezekiah, saying[b],
translation:
  language: zh_hans
  text: 他听见有关古实王特哈加[a]的消息，有人说：“他已经出兵，要与你交战。”他听见后，就派使者去见希西家，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实”是古代地域和族名，大致涉及埃及以南、与古努比亚相关的地区；有些译本译作“埃塞俄比亚”。
    reason: 说明古代地名的范围及常见替代译法，避免将其简单等同于现代国家。
lexical_decisions:
- source_word: וַיִּשְׁמַע עַל
  choice: 他听见有关……的消息
  rationale: שׁמע在叙事中可指听到消息；עַל引出消息的内容。此译既保留“听见”，又符合现代汉语表达。
- source_word: תִּרְהָקָה
  choice: 特哈加
  rationale: 按希伯来语音译人名，并采用现代中文圣经语境中易于辨认的形式。
- source_word: מֶלֶךְ כּוּשׁ
  choice: 古实王
  rationale: כּוּשׁ是古代地域及族名，译作“古实”比直接等同于现代“埃塞俄比亚”更贴近原文，也避免把古今疆域混为一谈。
- source_word: לֵאמֹר
  choice: 有人说
  rationale: 第一个לֵאמֹר引出听到的直接引语；汉语用“有人说”自然地标明消息内容，而不强行确定传话者。
- source_word: יָצָא לְהִלָּחֵם
  choice: 已经出兵，要……交战
  rationale: יָצָא本义为“出去、出发”，在军事语境中译作“出兵”简洁自然；לְהִלָּחֵם表明交战目的。
- source_word: אִתָּךְ
  choice: 与你交战
  rationale: 介词字面有“同、与”之意，但在“交战”语境中显然表示敌对关系；“与你交战”既自然，也不额外扩充对象。
- source_word: וַיִּשְׁמַע וַיִּשְׁלַח
  choice: 他听见后，就派
  rationale: 保留原文重复的“听见”，并用“后，就”表达连续叙事关系，使现代汉语流畅。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处是王室政治和军事叙事，指受差遣的人类使者，不是天使。
- source_word: אֶל חִזְקִיָּהוּ
  choice: 去见希西家
  rationale: אֶל表示趋向；在派遣使者的语境中，“去见”比机械译作“到”更符合汉语习惯。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 句末的לֵאמֹר引出下一节的信息，译文以冒号保留未完的引语结构。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文两次“听见”的叙事重复，并以“有人说”和句末冒号清楚呈现两处לֵאמֹר的不同话语功能。
