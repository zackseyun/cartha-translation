base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/021.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah[a], saying, “Thus says Yahweh[b], the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria,”'
translation:
  language: zh_hans
  text: 于是，亚摩斯的儿子以赛亚派人去见希西家，说：“耶和华——以色列的上帝——如此说：‘你既然为亚述王西拿基立的事向我祷告，’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人去见
  rationale: 原文只明说“差遣”，宾语省略；按上下文补出“人”，以自然汉语表达以赛亚向希西家传话，而不把所差遣者具体化。
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: 亚摩斯的儿子以赛亚
  rationale: 采用现代中文圣经人名的通行译法，并清楚表达父子关系。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然呈现希伯来语传话公式，并引出后面的直接引语。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中固定而庄重的传信公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以中文传统上直接表示四字神名的专名“耶和华”翻译，而不是用“主”这一称号替代；脚注说明其对应YHWH。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 自然、直接地表达原文的属格结构。
- source_word: אֲשֶׁר
  choice: 既然
  rationale: 原句结构简略，且意思延续至后文；“既然”表达这次祷告是随后神谕回应的缘由，同时保留句子尚未完结的感觉。
- source_word: הִתְפַּלַּלְתָּ אֵלַי
  choice: 向我祷告
  rationale: 准确表达פלל的反身词干在此处“祷告”的通常含义。
- source_word: אֶל סַנְחֵרִיב
  choice: 为……的事
  rationale: 介词在此表示祷告所涉及的对象或事项；此译法自然，且避免过度解释为“攻击”。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 简洁自然地表达“亚述的王”这一组合关系。
theological_decisions:
- issue: 神名יְהוָה的翻译
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用专有神名YHWH。正文采用现代中文读者最熟悉且作为专名使用的“耶和华”，而不以称号“主”替代；脚注交代原文形式，以避免隐藏神名。
- issue: “以色列的上帝”之后省略句的处理
  choice: 你既然为亚述王西拿基立的事向我祷告，
  alternative: 你为亚述王西拿基立的事向我所作的祷告——
  rationale: 希伯来语此处句法压缩，内容在下一节继续。主文用“既然”使现代汉语通顺，并表达祷告构成神回应的缘由；以逗号和脚注保留该句尚未完成的性质，不擅自补入平行经文中的“我已经听见”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“如此说”保留先知传信公式；“派人去见”明确原文省略的差遣对象但不具体指定使者。末尾保留逗号及脚注，提示神谕跨节延续。
