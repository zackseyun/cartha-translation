  yaml_path: translation/ot/isaiah/037/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, of Hena[b], and of Ivvah?
translation:
  language: zh_hans
  text: 哈马王、亚珥拔王，以及西法瓦音城、希拿和以瓦的王，都在哪里？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“西法瓦音城”前有“王”，随后连续列出“希拿和以瓦”；其与“王”的确切句法辖属关系较为压缩。
    reason: 句法歧义
lexical_decisions:
- source_word: אַיֵּה
  choice: 在哪里
  rationale: 这是询问所在之处的疑问词。希伯来文只出现一次，但问题涵盖随后列举的诸王；中文重复“在哪里”并在末尾用“又在哪里”，可自然呈现修辞性的连续质问。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 这是该词在古代近东君王语境中的常规译法。原文前三处明确重复“王”，译文予以保留；末尾为使希拿、以瓦与问题中的统治者关系清楚，按上下文补出一次“王”。
- source_word: חֲמָת
  choice: 哈马
  rationale: 采用现代中文圣经地名的通行音译。
- source_word: אַרְפָּד
  choice: 亚珥拔
  rationale: 采用现代中文圣经地名的通行音译。
- source_word: לָעִיר סְפַרְוָיִם
  choice: 西法瓦音城的
  rationale: 此处的介词 לְ 与“城”构成较难直译的地名关系；结合本节列举诸王的句式，译作“西法瓦音城的王”最符合中文表达，也保留“城”这一成分。
- source_word: סְפַרְוָיִם
  choice: 西法瓦音
  rationale: 采用现代中文圣经地名的通行音译。
- source_word: הֵנַע
  choice: 希拿
  rationale: 按马所拉文本所保存的专名音译，并采用中文圣经中的常见形式。
- source_word: עִוָּה
  choice: 以瓦
  rationale: 按马所拉文本所保存的专名音译，并采用中文圣经中的常见形式。
theological_decisions:
- issue: 希拿和以瓦与前文“王”的句法关系
  choice: 译为“希拿和以瓦的王”，把它们理解为继续列举其君王已被征服的地方。
  alternative: 译为“西法瓦音城、希拿和以瓦的王”，使一个“王”统辖三个地名；或仅音译为“希拿和以瓦”，不补出关系。
  rationale: 原文在“希拿、以瓦”前没有再次写“王”，句法较为压缩。上下文是以诸地君王的下落作为讥诮，因而中文补出“的王”最易理解；但脚注保留原文压缩结构所造成的歧义，避免把解释绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以三个并列问句呈现原文的讥诮和递进力度；专名使用简体中文圣经读者较熟悉的形式。
