  yaml_path: translation/ot/isaiah/037/035.yaml
  text: For I will defend this city to save it[b][a], for my own sake and for the sake of David my servant.
translation:
  language: zh_hans
  text: 我必保护这城，拯救它[a]，为我自己的缘故，也为我的仆人大卫的缘故。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“解救”或“搭救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי עַל
  choice: 我必保护
  rationale: גנן与עַל连用，表示遮护、保护某对象；“保护这城”在现代汉语中自然，也符合耶路撒冷受军事威胁的语境。句首וְ在此承接上文，中文不必机械译作“并且”。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 定冠词名词加指示词，直接译作“这城”，简洁自然，不额外强化语气。
- source_word: לְהוֹשִׁיעָהּ
  choice: 拯救它
  rationale: ישׁע在此指使城市脱离危难；“拯救”兼具解救含义与该词常有的救恩色彩。代词“它”指阴性单数的“城”。
- source_word: לְמַעֲנִי
  choice: 为我自己的缘故
  rationale: 表达行动的根据在上帝自身；“我自己”保留了第一人称附加形式的强调，而不进一步解释为名誉或圣名。
- source_word: וּלְמַעַן
  choice: 也为……的缘故
  rationale: 与前一לְמַעַן结构平行；“也”自然连接第二个并列缘由。
- source_word: דָּוִד עַבְדִּי
  choice: 我仆人大卫
  rationale: עבד在大卫与上帝的王权—盟约关系中宜译“仆人”；中文采用自然的所属结构“我仆人大卫”。
theological_decisions:
- issue: 上帝拯救这城的缘由
  choice: 为我自己的缘故，也为我仆人大卫的缘故
  alternative: 因我自己，也因我的仆人大卫
  rationale: 原文明确并列上帝自身与大卫两个缘由。译文保留这种并列及其中的盟约意味，但不把它扩展为后来的教义说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“保护”准确传达军事处境中的护卫行动；正文保留“拯救”的核心用词，并用脚注呈现其合理的词义选择。
