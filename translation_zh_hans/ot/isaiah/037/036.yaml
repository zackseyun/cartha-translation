    text: “天使”也可译作“使者”。希伯来语原词兼有这两种含义；此处语境较倾向于执行神圣审判的天上使者。
    reason: 保留מַלְאָךְ的词义歧义，并说明正文选择的语境依据。
  revision_rationale: 修订仅处理第二句的汉语指代与叙事衔接问题。“人们起来时”对应未明说主语的复数动词，不指定其为亚述人、以色列人或其他群体；“只见全都是死尸”保留突现标记和死亡现场的总体性，且不引入原文没有的地点或解释。
