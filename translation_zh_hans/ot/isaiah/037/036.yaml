revisions:
- from: 雅威的天使[a]出去，在亚述营中击杀了十八万五千人。清早，有人起来，只见他们全都成了尸体。
  to: 雅威的天使[a]出去，在亚述营中击杀了十八万五千人。清早，人们起来时，只见全都是死尸。
  rationale: 修订仅处理第二句的汉语指代与叙事衔接问题。“人们起来时”对应未明说主语的复数动词，不指定其为亚述人、以色列人或其他群体；“只见全都是死尸”保留突现标记和死亡现场的总体性，且不引入原文没有的地点或解释。
