source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּכֶּה֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה וּ/שְׁמֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/036.yaml
  text: Then the angel of Yahweh went out and struck down 185,000 in the camp of Assyria. When they arose early in the morning[a], behold, all of them were dead bodies.
translation:
  language: zh_hans
  text: 雅威的天使[a]出去，在亚述营中击杀了十八万五千人。清早，人们起来时，只见全都是死尸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使”也可译作“使者”。希伯来语原词兼有这两种含义；此处语境较倾向于执行神圣审判的天上使者。
    reason: 保留מַלְאָךְ的词义歧义，并说明正文选择的语境依据。
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的天使
  rationale: מַלְאָךְ既可指一般“使者”，也可指天上的“天使”；本节描述执行神圣审判的超自然行动，因此正文采用“天使”，并以脚注保留“使者”这一词义可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以“主”这一称号替代。
- source_word: וַיֵּצֵא
  choice: 出去
  rationale: 直接呈现יצא在叙事中的动作，语言自然简洁。
- source_word: וַיַּכֶּה
  choice: 击杀了
  rationale: נכה本义为击打、打击；上下文明确说明结果是死亡，“击杀”兼顾动作及致命结果。
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: 在亚述营中
  rationale: 贴近原文“在亚述的营中”，同时符合现代汉语习惯。
- source_word: מֵאָה וּשְׁמֹנִים וַחֲמִשָּׁה אָלֶף
  choice: 十八万五千人
  rationale: 准确保留原文数目；补出量词“人”使汉语自然，所指数目由被击杀者的语境确定。
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: 清早，有人起来
  rationale: 动词为第三人称复数，但原文没有明说主语；以不定指“有人”避免擅自确定是亚述人、以色列人或其他人，并体现清早起来之意。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: 以自然的现代汉语再现הִנֵּה引人注意、呈现惊人景象的叙事功能。
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: 他们全都成了尸体
  rationale: “全都”保留כֻלָּם的总体强调；“成了尸体”自然表达פְּגָרִים מֵתִים，不采用汉语中累赘的“死尸体”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；正文以音译“雅威”保留其专名性质，不以称号替代。
- issue: מַלְאַךְ יְהוָה所指的身份
  choice: 雅威的天使
  alternative: 雅威的使者
  rationale: 该词本身兼有“使者”和“天使”之义；本节执行大规模神圣审判的语境较支持天上代理者，但词汇层面的歧义以脚注保留，不进一步界定其本体身份。
- issue: 清早起来者的身份
  choice: 不明确指定，以“有人”表达
  alternative: 他们起来；亚述人起来
  rationale: 希伯来文动词虽为复数，却没有明示主语；不将其神学或叙事身份作超出原文的确定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“出去”“击杀”“只见”保持叙事简洁有力；避免古雅的“看哪”和不必要的解释性增补。脚注标记[a]已置于相关词语之后。
