  text: וּ/שְׁאָ֧ר מִסְפַּר קֶ֛שֶׁת גִּבּוֹרֵ֥י בְנֵֽי קֵדָ֖ר יִמְעָ֑טוּ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל דִּבֵּֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/017.yaml
  text: And the remainder of the number of the bowmen[a], the mighty men of the sons of Kedar, will be few, for Yahweh, the God of Israel[b], has spoken.
translation:
  language: zh_hans
  text: 基达子孙中英勇的弓箭手[a]，剩下的人将寥寥无几[b]；因为雅威——以色列的神——已经说了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“弓”；这里以弓代指弓箭手。
    reason: lexical_alternative
  - marker: b
    text: 也可译“基达子孙中英勇弓箭手的余数必减少”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁאָר מִסְפַּר
  choice: 所剩的
  rationale: 这一组合强调经过灾难后剩余的人数。译作“所剩的”既保留数量含义，也避免“余民”可能附带的神学色彩；“寥寥无几”承接后面的 יִמְעָטוּ。
- source_word: קֶשֶׁת
  choice: 弓箭手
  rationale: 原文直译为“弓”，这里以武器代指持弓作战的人；“弓箭手”在现代汉语中清楚自然。
- source_word: גִּבּוֹרֵי
  choice: 英勇的
  rationale: 该词在军事语境中指勇士或勇猛之人。与“弓箭手”组合译为“英勇的弓箭手”，避免重复使用“勇士”造成结构生硬。
- source_word: בְנֵי קֵדָר
  choice: 基达子孙
  rationale: 保留希伯来语的亲属—族群表达，指属于基达族群的人。
- source_word: יִמְעָטוּ
  choice: 必寥寥无几
  rationale: 该动词表示变少或成为少数；结合预言语气，“必寥寥无几”自然表达结果及确定性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留四字神名，而不以称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 按原文领属结构直译，说明雅威与以色列的关系，不增添解释。
- source_word: דִּבֵּר
  choice: 已经说了
  rationale: 完成式在此为预言的确定性提供根据；“已经说了”是自然、庄重的现代汉语表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文以“雅威”作较贴近常见学术重构 Yahweh 的现代汉语音译，保留其作为专名的性质，不以“主”等称号替代。
- issue: שְׁאָר 是否译作带有神学意味的“余民”
  choice: 所剩的
  alternative: 余民
  rationale: 本节直接关注基达战士剩余的数量；译作“所剩的”保留语境中的数量意义，不额外引入“余民”在其他经文中可能具有的神学内涵。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“寥寥无几”自然传达人数锐减后的结果；破折号将“以色列的神”标明为“雅威”的同位说明。
