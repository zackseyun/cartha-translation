base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/005.yaml
  text: They set the table[a], they spread the rugs, they eat, they drink. Rise up, princes[b]; oil the shield.
translation:
  language: zh_hans
  text: 摆设桌子，铺开地毯[a]，吃喝；首领们，起来，给盾牌上油[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“守望瞭望台”或“设立守望”。这句希伯来文含义不确定；正文按上下文所呈现的宴席预备场景翻译。
    reason: alternative_reading
  - marker: b
    text: 直译“膏抹盾牌”，即给盾牌涂油，预备作战。
    reason: cultural_note
lexical_decisions:
- source_word: עָרֹךְ הַשֻּׁלְחָן
  choice: 摆好桌子
  rationale: ערך有“排列、摆设”之意；与“桌子”连用时译作“摆好桌子”，具体、自然，也保留宴席场景。
- source_word: צָפֹה הַצָּפִית
  choice: 铺开坐垫
  rationale: 这组罕见而困难的词可指铺设宴席所用的铺盖、席垫；上下文连续描写摆席、吃喝，因此正文采用宴席预备的理解，同时以脚注保留“守望”的可能读法。
- source_word: אָכוֹל שָׁתֹה
  choice: 吃吧，喝吧
  rationale: 两个不定词绝对式形成简短鲜明的动作序列。汉语用带祈使色彩的“吃吧，喝吧”既贴近其形式，也表现宴饮正酣、危机突至的张力；主语在原文中并未明说。
- source_word: קוּמוּ הַשָּׂרִים
  choice: 首领们，起来
  rationale: קומו是复数命令式，构成突然转折；שרים可指统治者、贵族或官长，译作“首领”较宽泛，不把身份限定为世袭王子。
- source_word: מִשְׁחוּ מָגֵן
  choice: 给盾牌上油
  rationale: משח本义为涂抹、膏抹；在军事语境中指给皮盾涂油以保养或备战。译作“上油”比“膏抹”更符合现代汉语中的器具用语。
theological_decisions: []
translation_notes:
  register: 采用简洁而庄重的现代汉语，以连续短句再现原文快速推进的动作，并用感叹号表现从宴饮到紧急备战的突变。正文不补出原文未明说的“他们”，从而保留动作主体及句法功能上的一定含混。
