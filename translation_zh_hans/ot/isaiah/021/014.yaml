  text: לִ/קְרַ֥את צָמֵ֖א הֵתָ֣יוּ מָ֑יִם יֹשְׁבֵי֙ אֶ֣רֶץ תֵּימָ֔א בְּ/לַחְמ֖/וֹ קִדְּמ֥וּ נֹדֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/014.yaml
  text: Bring water to meet the thirsty[a]; O inhabitants of the land of Tema[b], meet the fugitive with bread.
translation:
  language: zh_hans
  text: 要拿水来迎接口渴的人；提玛地的居民啊[b]，要带着饼迎接逃难的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带着饼迎接逃难的人”也可理解为“带着他的饼迎接逃难的人”，或“拿饼给他，迎接逃难的人”。希伯来语中介词及其后的代词后缀之间的关系容许不同理解。
    reason: lexical_alternative
  - marker: b
    text: 提玛是阿拉伯地区的一处绿洲及其周边地域，与商旅路线有关。
    reason: cultural_note
lexical_decisions:
- source_word: לִקְרַאת צָמֵא
  choice: 迎接口渴的人
  rationale: לִקְרַאת 表示朝向某人、与之相遇；צָמֵא 是名词化的单数形容词，可代表一类人。译文用自然汉语保留其概括性。
- source_word: הֵתָיוּ מָיִם
  choice: 要拿水来
  rationale: 复数祈使形式在本语境中表示把水带来或送上；“拿水来”既符合宾语“水”，也适合直接劝告的语气。
- source_word: יֹשְׁבֵי אֶרֶץ תֵּימָא
  choice: 提玛地的居民啊
  rationale: 祈使句表明此语为呼语；תֵּימָא 按地名音译为“提玛”。
- source_word: בְּלַחְמוֹ
  choice: 拿食物
  rationale: לֶחֶם 可指面包，也可泛指食物；介词 ב 可表示伴随或凭借。此处译成“拿食物”符合汉语表达，同时把后缀及介词关系的歧义留在脚注说明。
- source_word: קִדְּמוּ נֹדֵד
  choice: 迎接逃难的人
  rationale: קִדְּמוּ 表示前去迎接；נֹדֵד 在战争与逃亡语境中指流离或逃亡者。“逃难的人”比“流浪者”更贴合上下文，又不把其法律身份定为“逃犯”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝告语气；两分句都用“迎接”呈现原文的平行结构。脚注标记按对应信息分别置于“提玛”和涉及歧义的第二分句之后。
