  text: תָּעָ֣ה לְבָבִ֔/י פַּלָּצ֖וּת בִּֽעֲתָ֑תְ/נִי אֵ֚ת נֶ֣שֶׁף חִשְׁקִ֔/י שָׂ֥ם לִ֖/י לַ/חֲרָדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/004.yaml
  text: My heart reels; shuddering terrifies me[a]. The twilight I longed for he has turned into terror for me.
translation:
  language: zh_hans
  text: 我的心摇荡不定；战栗使我惊恐。我所向往的暮色，他使之变成令我恐惧的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּעָה
  choice: 摇荡不定
  rationale: 本义为“游荡、偏离”，以心为主语时描写内在失去稳定、恍惚不安；“摇荡不定”既保留动态意象，也符合现代汉语诗性表达。
- source_word: לְבָבִי
  choice: 我的心
  rationale: 直译为“我的心”，保留希伯来语以“心”指内在自我的表达，不窄化为单纯的思想或理智。
- source_word: פַּלָּצוּת
  choice: 战栗
  rationale: 该名词表示因恐惧而剧烈颤抖；“战栗”兼具身体反应和强烈惧怕的意味。
- source_word: בִּעֲתַתְנִי
  choice: 使我惊恐
  rationale: בעת 表示使人受惊、陷入恐惧；此译自然表达完成式所呈现的强烈现实效果。
- source_word: נֶשֶׁף
  choice: 暮色
  rationale: 该词指昏暗的曙暮时分，此处按语境取夜晚将临的“暮色”，并保留诗歌氛围。
- source_word: חִשְׁקִי
  choice: 我所向往的
  rationale: 带第一人称后缀的名词意为“我的渴望/所爱慕之物”；转为关系分句，使中文自然，同时保留强烈期待之意。
- source_word: שָׂם לִי
  choice: 他却使之成为我的
  rationale: שׂים 在此表达“使……成为”，第三人称主语在本节中未明说；保留“他”而不擅自明确其身份。“却”呈现所向往之物反成恐惧的转折。
- source_word: לַחֲרָדָה
  choice: 恐惧
  rationale: חֲרָדָה 可指颤抖或恐惧；本句强调暮色带来的可怕逆转，译作“恐惧”自然且与前半句呼应。
theological_decisions:
- issue: שָׂם 的隐含主语身份
  choice: 保留为“他”，不指明是谁
  alternative: 译为被动句“竟成了我的恐惧”
  rationale: 希伯来文本使用第三人称单数动词，却未在本节明确主语；保留代词可反映原文语法，同时避免将其明确认定为上帝、敌军或异象中的其他行动者。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。前半句保留希伯来诗句中“心—战栗—惊恐”的身体与情感张力；后半句以“暮色—恐惧”的逆转保持凝练诗意。
