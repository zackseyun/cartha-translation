base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/012.yaml
  text: The watchman says[a], “Morning comes, and also night. If you would inquire, inquire; return[b], come.”
translation:
  language: zh_hans
  text: 守望者说：“早晨来到[a]，黑夜也来。你们若要问，就问吧；回转[b]，再来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“早晨已经来到，黑夜也来到。”希伯来语既可理解为一般性的来到，也可理解为较即时的宣告。
    reason: lexical_alternative
  - marker: b
    text: “回转，再来”也可理解为“回去，以后再来”，既可能含有转回、悔改之意，也可能只是叫人日后再来询问；希伯来语未明确限定。
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁמֵר
  choice: 守望者
  rationale: 这是动词שׁמר的实词化分词，指负责警戒、守望的人；结合上下文的城楼与问答场景，“守望者”最贴切。
- source_word: אָמַר
  choice: 说
  rationale: 虽为完成式，但在先知性话语中用来引出直接引语；现代汉语以“说”自然地表达，不必明确限定为过去时。
- source_word: אָתָה בֹקֶר
  choice: 早晨来到
  rationale: אָתָה意为“来、来到”，בֹקֶר为主语。“早晨来到”保留原文意象，也不把时间范围收窄为“黎明”。
- source_word: וְגַם לָיְלָה
  choice: 黑夜也来
  rationale: 补出汉语所需的谓语“来”，并以“也”保留原文的并列关系，不强行译成转折。
- source_word: אִם תִּבְעָיוּן בְּעָיוּ
  choice: 你们若要询问，就问吧
  rationale: 以同源的“询问／问”尽量体现原文条件句与命令句的重复，同时保持现代汉语自然。
- source_word: שֻׁבוּ
  choice: 回转
  rationale: שׁוב可指返回或转回；“回转”保留行动与属灵转向两种可能，不把经文限定为悔改命令。
- source_word: אֵתָיוּ
  choice: 再来
  rationale: 这是“来”的命令式；结合前面的“回转”，译作“再来”使汉语可懂，同时保留再次前来询问的可能。
theological_decisions:
- issue: “回转”是否明确指悔改
  choice: 正文保留“回转”，不明说“悔改”
  alternative: 译作“悔改”或仅译作“回来”
  rationale: 原文שׁוב既可表达实际返回，也可能含有转回的属灵意味；不应在译文中排除其中任何一种。
- issue: 早晨与黑夜的关系
  choice: 用并列的“黑夜也来”
  alternative: 译作转折性的“但黑夜也来”
  rationale: 原文以וְגַם连接，虽然语境可能暗示安慰与困境并存，但形式上是并列，宜保留其张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“早晨／黑夜”的诗性对照和末尾命令的简短节奏；以脚注说明动词时态与“回转，再来”的多义性。
