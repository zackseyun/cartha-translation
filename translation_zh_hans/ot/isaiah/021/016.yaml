base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/016.yaml
  text: 'For thus the Lord said to me: Within a year[a], like the years of a hired worker, all the glory of Kedar will come to an end.'
translation:
  language: zh_hans
  text: 因为主这样对我说：“一年之内，像雇工所计算的年数一样，基达的一切荣耀[a]都必消逝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”也可译作“华美”“尊荣”或“财富”；希伯来语词可指荣耀、地位、辉煌，也可指物质上的丰足。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明其根据，保留原文的因果连接作用。
- source_word: כֹה אָמַר
  choice: 这样说
  rationale: 自然保留先知宣告中常见的引语公式。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神圣称号“主”，并非四字神名；简洁直译为“主”。
- source_word: אֵלָי
  choice: 对我
  rationale: 明确指出神说话的对象是先知本人。
- source_word: בְּעוֹד שָׁנָה
  choice: 再过一年
  rationale: 表达从说话之时起尚有一年才应验，比“在一年之内”更贴近该短语的时间指向。
- source_word: כִּשְׁנֵי שָׂכִיר
  choice: 像雇工计算年期那样
  rationale: 保留雇工的比喻，并传达雇工按约仔细计算、期限确定的含义。
- source_word: וְכָלָה
  choice: 都必消逝
  rationale: 表达基达的荣耀将被耗尽、归于终结；“消逝”符合中文先知性宣告的庄重语体。
- source_word: כָּל
  choice: 一切
  rationale: 保留审判范围的全面性。
- source_word: כְּבוֹד
  choice: 荣耀
  rationale: 该词可指荣耀、尊荣、华美或财富；正文采用含义较宽的“荣耀”，并以脚注保存其他可能语义。
- source_word: קֵדָר
  choice: 基达
  rationale: 按现代中文圣经传统音译这一阿拉伯部族或地区的专名。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 主宰
  rationale: 原文使用称号 אֲדֹנָי，而不是四字神名；“主”直接、自然，也避免把称号误作专名处理。
- issue: כְּבוֹד 在审判语境中的范围
  choice: 荣耀
  alternative: 财富／华美
  rationale: 正文不将此词收窄为单纯的物质财富，以保留它可能兼指声望、威势、华美和丰足的张力；其他含义列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“像雇工计算年期那样”适度释明希伯来语习语所强调的精确、固定期限，同时保留原有比喻。脚注标记置于其实际说明的“荣耀”之后。
