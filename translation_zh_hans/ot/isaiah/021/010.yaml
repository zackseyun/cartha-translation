revisions:
- from: 我那被打的谷物[a]，我禾场上的谷粒[b]啊！我从万军之雅威——以色列的上帝那里所听见的，都已经向你们宣告了。
  to: 我那受过碾打的，我禾场之子啊！我从万军之雅威、以色列的上帝那里所听见的，已向你们宣告。
  rationale: 修订保留希伯来文两个相连的呼语及其打谷隐喻，不将“子”预先解释为“谷粒”，并以脚注呈现必要的词义选择和语义未定性。其余句法按现代汉语调整，保留庄重、可朗读的先知性语域。
