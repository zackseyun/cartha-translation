  text: מְדֻשָׁתִ֖/י וּ/בֶן גָּרְנִ֑/י אֲשֶׁ֣ר שָׁמַ֗עְתִּי מֵ/אֵ֨ת יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הִגַּ֥דְתִּי לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/010.yaml
  text: O my threshed one[a], and son of my threshing floor, what I have heard from Yahweh of hosts, the God of Israel[b], I have declared to you.
translation:
  language: zh_hans
  text: 我那受过碾打的，我禾场之子啊！我从万军之雅威、以色列的上帝那里所听见的，已向你们宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְדֻשָׁתִי
  choice: 我那被打的谷物
  rationale: 该词源于“打谷、碾打”，指被打过的对象。译文保留农业意象，也让现代汉语读者能够理解其所暗示的严酷苦难。
- source_word: וּבֶן גָּרְנִי
  choice: 我禾场上的谷粒
  rationale: 原文直译为“我禾场之子”；“子”在这里表示属于禾场、由禾场处理的对象。正文以“谷粒”传达所指，同时用脚注保留原文独特的表达。
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: 我……所听见的
  rationale: 关系结构引出先知所听到的信息内容；此译法准确而符合现代汉语习惯。
- source_word: מֵאֵת
  choice: 从……那里
  rationale: 标明信息来源；用“从……那里”自然表达先知的信息来自上帝。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译神名，避免以称号取代专名；“万军之”保留 צְבָאוֹת 的广义意象，不将其限缩为地上的军队。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现原文的属格结构及身份说明。
- source_word: הִגַּדְתִּי
  choice: 已经向……宣告了
  rationale: 使役词形表达使人知道、郑重传达；“宣告”符合先知传信的庄重语域。
- source_word: לָכֶם
  choice: 向你们
  rationale: 明确保留原文第二人称复数。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名，正文以“雅威”音译其专名，既不以“主”替代，也不采用较晚形成的混合读音。
- issue: 打谷意象的保留程度
  choice: 正文保留“被打的谷物”和“禾场上的谷粒”
  alternative: 译作“受苦的子民”或“被压迫的人”
  rationale: 原文借打谷描绘严重苦难，但并未明说“子民”或“压迫”。保留农业隐喻，可避免把其指向与神学含义解释得过死。
- issue: בֶן גָּרְנִי 中“子”的处理
  choice: 正文按其语境所指译为“谷粒”，脚注注明直译
  alternative: 我禾场之子；我禾场的孩子
  rationale: 直译成汉语的“孩子”容易被误解为真实亲属关系；“谷粒”呈现禾场语境中的所指，而脚注保存原文的修辞张力。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“啊”标明呼语，“都已经向你们宣告了”保持先知传达神谕的正式语气。破折号将“以色列的上帝”作为对“万军之雅威”的同位说明。
