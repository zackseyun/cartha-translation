source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אַרְיֵ֑ה עַל מִצְפֶּ֣ה אֲדֹנָ֗/י אָנֹכִ֞י עֹמֵ֤ד תָּמִיד֙ יוֹמָ֔ם וְ/עַל מִ֨שְׁמַרְתִּ֔/י אָנֹכִ֥י נִצָּ֖ב כָּל הַ/לֵּילֽוֹת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/008.yaml
  text: Then he cried[a], “A lion! On the watchtower, my lord, I stand continually by day[b], and at my post I am stationed all the nights.”
translation:
  language: zh_hans
  text: 他便喊道：“狮子！”[a]我主啊，我白天一直站在瞭望台上，夜夜[b]都驻守在我的岗位上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“狮子！”这句话的句法较难确定；也有人理解为“他像狮子一样喊道”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“所有的夜晚”，也可译作“每夜”或“整夜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 他便喊道
  rationale: קרא的Qal叙事形式在这里表示出声呼喊；“便”承接叙事进程，“喊道”体现报告的急迫语气。
- source_word: אַרְיֵה
  choice: “狮子！”
  rationale: 马所拉文本直译为“狮子”，既无比较词，也未明说它是呼喊者的称号。正文保留这一突兀而有争议的读法，不暗自补成确定的比喻。
- source_word: עַל מִצְפֶּה
  choice: 在瞭望台上
  rationale: מִצְפֶּה指供守望者观察的高处或瞭望设施；“瞭望台”清楚、自然，并符合哨兵场景。
- source_word: אֲדֹנָי
  choice: 我主啊
  rationale: 此处是带第一人称单数后缀的尊称，指受报告的上级，而非上帝的专名；“我主啊”保留称呼语气，又避免写作神名。
- source_word: עֹמֵד תָּמִיד יוֹמָם
  choice: 我白天一直站
  rationale: 分词表达持续状态，תָּמִיד强调不断或恒常，יוֹמָם表示白天；此译保留站立守望的画面。
- source_word: וְעַל מִשְׁמַרְתִּי
  choice: 都……在我的岗位上
  rationale: מִשְׁמֶרֶת在这里可指守望职责或哨位；“岗位”简洁地表达指定的守望位置。
- source_word: נִצָּב
  choice: 驻守
  rationale: Niphal分词带有被安置、站定在某处的结果状态；“驻守”在现代汉语中自然体现受命留守岗位的含义。
- source_word: כָּל הַלֵּילוֹת
  choice: 夜夜
  rationale: 希伯来文为复数“所有的夜晚”，表示一夜又一夜持续值守；“夜夜”既保留反复性，也比直译“所有夜晚”自然。
theological_decisions:
- issue: אַרְיֵה的句法和所指不明确
  choice: 正文直译为独立惊叹“狮子！”
  alternative: “他像狮子一样喊道”或“守望者喊道”
  rationale: 马所拉文本确实写作“狮子”，没有明示比较关系；直译可避免把有争议的比喻或文本校订写进正文。脚注说明较通顺的另一种理解。
- issue: אֲדֹנָי是否指上帝
  choice: 译作普通尊称“我主啊”
  alternative: “主啊”并理解为对上帝的称呼
  rationale: 带后缀的形式及报告场景适合解释为对上级的称呼；译文不将其神学化为神名。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文“狮子！”的突兀性，并用脚注交代可能的比喻理解；“瞭望台、岗位、驻守”维持守望者报告的场景。“白天一直……夜夜都……”在汉语中自然呈现昼夜持续警戒的对举。
