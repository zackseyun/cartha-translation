  to: 因为主对我这样说：“你去，派守望者站岗；他看见什么，就让他报告。”
  rationale: 修订仅将泛称“人”改为“守望者”，以对应原文明确的职分称谓，并将末句调整为更贴合命令后指令语气的表达。保留“因为”、神圣称号“主”及原文未说明守望者身份的含混性，无需脚注。
