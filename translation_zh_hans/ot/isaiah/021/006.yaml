source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר אֵלַ֖/י אֲדֹנָ֑/י לֵ֚ךְ הַעֲמֵ֣ד הַֽ/מְצַפֶּ֔ה אֲשֶׁ֥ר יִרְאֶ֖ה יַגִּֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/006.yaml
  text: 'For thus the Lord said to me: “Go[a], station the watchman; let him report what he sees.”'
translation:
  language: zh_hans
  text: 因为主对我这样说：“你去，派守望者站岗；他看见什么，就让他报告。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先知接下来的行动提供根据；现代汉语用“因为”自然清楚。
- source_word: כֹה אָמַר
  choice: 这样说
  rationale: 保留先知话语公式的表达，同时按叙事语境译为过去发生的言说。
- source_word: אֵלַי
  choice: 对我
  rationale: 自然表达说话的对象。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神圣称号 אֲדֹנָי，并非四字神名；“主”准确且符合现代中文圣经语体。
- source_word: לֵךְ
  choice: 你去
  rationale: 直接表达第二人称单数命令；补出“你”使中文更自然。
- source_word: הַעֲמֵד
  choice: 派人站岗
  rationale: 该使役式命令意为使某人站在指定位置；结合守望语境，“派人站岗”既体现使役义，也符合现代汉语。
- source_word: הַמְצַפֶּה
  choice: 站岗的人（隐含于“派人站岗”）
  rationale: 分词实词化，指负责瞭望、守望的人；中文将其与使役动词合译，更自然。
- source_word: אֲשֶׁר יִרְאֶה
  choice: 他看见什么
  rationale: 保留不定关系从句的开放范围，不将其限定为某一特定景象。
- source_word: יַגִּיד
  choice: 就要报告
  rationale: 未完成式在命令之后带指令性；“就要报告”自然表达受命把所见报告出来。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 我的主
  rationale: 此处使用神圣称号而非四字神名。“主”保留称号性质，也避免把形式上的第一人称成分机械地处理为汉语所有格。
- issue: 守望者是先知本人还是另一个人
  choice: 译作“派人站岗”，不指明其身份
  alternative: 译作“你去站岗”
  rationale: 原文 הַעֲמֵד 是使役式“使……站立／派驻”，并另有定冠词分词“守望者”；因此不宜把命令直接解释为先知本人去守望。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“因为”与上文的论述联系，并用直接引语呈现主的命令。原文语义清楚，无需脚注。
