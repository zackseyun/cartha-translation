revisions:
- from: 关于海之旷野的宣告：它如旋风横扫南地[a]，从旷野而来[b]，从可怕之地而来。
  to: 关于海之旷野的神谕：它像南地的旋风一样横扫而过，从旷野而来，从可怕之地而来。
  rationale: 修订仅澄清旋风与“南地”的句法关系，并以“神谕”准确标示 מַשָּׂא 的先知书标题用法。仍保留“海之旷野”的地理/诗意含混、动词主语的未明说状态，以及“可怕之地”的开放含义。
  reviewer_model: gpt-5.6-terra
