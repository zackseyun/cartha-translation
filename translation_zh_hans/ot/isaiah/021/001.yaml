base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/001.yaml
  text: 'An oracle concerning the wilderness of the sea: like whirlwinds in the Negev sweeping through[a], it comes from the wilderness[c][b], from a fearful land.'
translation:
  language: zh_hans
  text: 关于海之旷野的神谕：它像南地的旋风一样横扫而过，从旷野而来，从可怕之地而来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַשָּׂא
  choice: 宣告
  rationale: 在先知书标题中常指带有审判意味的神谕或宣告；“宣告”现代、庄重，也避免把该词误解为实体的“重担”。
- source_word: מִדְבַּר יָם
  choice: 海之旷野
  rationale: 保留希伯来语结构中突兀而富诗意的地理称谓，不在正文中径直解释为某一国家或“海边的旷野”。
- source_word: כְּסוּפוֹת
  choice: 如旋风
  rationale: סוּפוֹת表示猛烈的风暴；“旋风”既有力度，也能自然承接横扫而过的动态意象。
- source_word: בַּנֶּגֶב
  choice: 南地
  rationale: נֶגֶב既可指特定的南部干旱地区，也可泛指南方；“南地”保留地理色彩，并不完全排除普通方位义。
- source_word: לַחֲלֹף
  choice: 横扫
  rationale: 该不定式表达迅速经过；结合旋风比喻译作“横扫”，自然呈现强烈的运动感。
- source_word: מִמִּדְבָּר בָּא
  choice: 它……从旷野而来
  rationale: 原文动词为阳性单数，却没有明说主语；以中性的“它”承接前述旋风般的力量，同时用脚注保留主语不确定性。
- source_word: מֵאֶרֶץ נוֹרָאָה
  choice: 从可怕之地而来
  rationale: נוֹרָאָה在此描写令人惧怕、可畏的地方；“可怕”简明而有力度，不额外界定其可怕的具体性质。
theological_decisions:
- issue: 标题中诗意地理称谓的解释程度
  choice: 正文保留“海之旷野”这一含混表达
  alternative: 译作“海边的旷野”，或直接认定为巴比伦
  rationale: 本节本身没有明说该称谓所指的国家；保留原文意象与含混性，避免把常见历史解释写入正文。
- issue: “而来”的隐含主语
  choice: 用“它”承接旋风般的势力，并以脚注说明原文没有明说主语
  alternative: 译作“有人从旷野而来”或“他从旷野而来”
  rationale: 原文只给出单数动词，身份并不明确；中性代词较少预设这是某个人物，也不把不确定性完全隐藏。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“海之旷野”刻意保留原文诗意而异常的构词；句中重复“而来”，对应原文两次来源短语，并增强预言宣告的节奏。
