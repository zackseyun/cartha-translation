  - severity: low
    issue: 标题的“宣告”可更精确译为“神谕”。
    rationale: 在以赛亚书此类标题中，מַשָּׂא 指先知性的神谕/预言性宣告；“神谕”在中文圣经语域中更能标明文类，且仍属现代庄重用语。
  revised_text: 关于海之旷野的神谕：它像南地的旋风一样横扫而过，从旷野而来，从可怕之地而来。
