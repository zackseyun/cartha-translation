  yaml_path: translation/ot/isaiah/021/011.yaml
  text: 'An oracle concerning Dumah: One calls to me from Seir[a], “Watchman, what of the night? Watchman[b], what of the night?”'
translation:
  language: zh_hans
  text: 有关度玛的神谕：有人从西珥呼唤我[a]：“守望者，夜怎么样了？守望者，夜怎么样了？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “度玛”也可能使人联想到希伯来语“寂静”；由于下一句提到西珥，也有人认为这里与以东有关。
    reason: lexical_alternative
  - marker: b
    text: 或译：“黑夜过去多少了？”这句希伯来语习语是在询问夜的状况或进程。
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: 默示
  rationale: 在先知书标题中指宣告出来的神谕或预言信息。“默示”是现代中文圣经语体中较为凝练、庄重的标题用语，也避免把它仅按字面译成“重担”。
- source_word: דּוּמָה
  choice: 度玛
  rationale: 此处按专名音译，符合预言标题的结构；不在正文中直接译成“寂静”，以免过早判定其词义或所指。
- source_word: אֵלַי קֹרֵא
  choice: 有人……呼唤我
  rationale: 分词为阳性单数，但没有明说主语；用“有人”保留其不定性，不擅自确定说话者身份。
- source_word: מִשֵּׂעִיר
  choice: 从西珥
  rationale: 介词表示呼声的来源；西珥是专名，采用通行中文译名。
- source_word: שֹׁמֵר
  choice: 守望者
  rationale: 语境是夜间守望，且该词在此作呼语；“守望者”既准确又保留先知诗歌的意象和重复。
- source_word: מַה מִלַּיְלָה / מַה מִלֵּיל
  choice: 夜里如何？
  rationale: 希伯来语习语询问黑夜的状况或进程。“夜里如何”保留原文的简练和开放性；两处采用相同译法，以体现修辞性重复，尽管原文“夜”使用了长、短两种形式。
theological_decisions:
- issue: דּוּמָה的身份与含义
  choice: 正文按专名译作“度玛”
  alternative: 译作“寂静”，或理解为借指以东
  rationale: 预言标题的形式支持将其视为地方或族群名称，而下文“西珥”又使人联想到以东；音译可以保留这层历史联系而不把它定死。其与“寂静”一词的语音或词义关联留在脚注中。
- issue: מַה מִלַּיְלָה所问的内容
  choice: 译作“夜里如何？”
  alternative: 译作“黑夜过去多少了？”或“夜到什么时辰了？”
  rationale: 原文可以询问夜的状况，也可以询问夜已经进展到何种程度。正文保留较宽的表达，不把问题限定为钟点或时长。
translation_notes:
  register: 采用现代、庄重而简洁的中文先知诗歌语体。“关于……的默示”保留标题形式；两次“守望者，夜里如何？”严格重复，以呈现原文急切而含蓄的呼问。脚注标记均置于相关正文位置。
