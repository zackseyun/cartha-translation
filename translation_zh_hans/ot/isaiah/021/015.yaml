base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/015.yaml
  text: For they have fled from swords[a], from the drawn sword, and from the bent bow[c][b], and from the weight of battle.
translation:
  language: zh_hans
  text: 因为他们逃离刀剑，逃离拔出的剑[a]，逃离拉开的弓[b]，也逃离战争的重压[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“伸出的剑”或“备妥使用的剑”。原文所用的词可指剑被伸出、拔出或预备使用。
    reason: lexical_alternative
  - marker: b
    text: 也可译“张开的弓”或“上弦的弓”；原文描写弓已准备好射箭。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“战争的重量”；也可理解为战争的沉重压力或严酷程度。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，说明他们逃亡的原因；现代汉语用“因为”自然保留解释关系。
- source_word: מִפְּנֵי
  choice: 逃离
  rationale: 原文四次使用这一介词，兼有“从……面前离开”和“因……而躲避”的意味；结合נָדָדוּ译作“逃离”，表达军事威胁下的逃亡。中文为避免生硬，只重复“逃离”三次，同时保留排比。
- source_word: חֲרָבוֹת
  choice: 刀剑
  rationale: 复数泛指造成威胁的兵刃；“刀剑”比单用“剑”更符合现代汉语的概括表达。
- source_word: נָדָדוּ
  choice: 逃离
  rationale: 该动词本可指漂泊、迁移；在刀剑、弓和战事的语境中表示逃亡。
- source_word: חֶרֶב נְטוּשָׁה
  choice: 出鞘的剑
  rationale: נְטוּשָׁה描写剑被伸出或备妥使用；“出鞘的剑”自然地传达已经准备杀伤的状态，同时以脚注保留“挥舞的剑”的可能。
- source_word: קֶשֶׁת דְּרוּכָה
  choice: 拉开的弓
  rationale: 描写弓已被拉弯、准备射箭；“拉开的弓”是现代汉语中清楚自然的武器图像。
- source_word: כֹּבֶד מִלְחָמָה
  choice: 激烈的战事
  rationale: כֹּבֶד字面为“重量、沉重”，在此表达战事的沉重压力或猛烈程度；正文采用自然汉语，脚注保留原文比喻。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“逃离……逃离……”保留原文反复累加的紧迫感；正文避免不自然的“战争的重量”，但由脚注保存כֹּבֶד的重量隐喻。
