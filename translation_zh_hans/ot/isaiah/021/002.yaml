source:
  edition: WLC
  text: חָז֥וּת קָשָׁ֖ה הֻגַּד לִ֑/י הַ/בּוֹגֵ֤ד בּוֹגֵד֙ וְ/הַ/שּׁוֹדֵ֣ד שׁוֹדֵ֔ד עֲלִ֤י עֵילָם֙ צוּרִ֣י מָדַ֔י כָּל אַנְחָתָ֖/ה הִשְׁבַּֽתִּי־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/002.yaml
  text: 'A harsh vision has been declared to me: the betrayer betrays[a], and the destroyer destroys. Go up, Elam; lay siege, Media[b]. I have put an end to all her groaning.'
translation:
  language: zh_hans
  text: 严酷的异象已经传达给我：背信者背信，毁灭者毁灭。以拦，上去！玛代，围攻！她一切的哀叹，我都使之止息了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 原文作“她一切的哀叹”；本节没有明确说明“她”指谁。
    reason: 说明阴性单数后缀的指代含混，避免读者误以为正文已经确定其对象。
lexical_decisions:
- source_word: חָזוּת קָשָׁה
  choice: 严酷的异象
  rationale: חָזוּת指先知所见的启示性异象；קָשָׁה强调其严厉、沉重而令人难以承受的性质。“严酷的异象”自然且保留原文力度。
- source_word: הֻגַּד לִי
  choice: 向我显明
  rationale: נגד的被动式表示这信息被告知或揭示给先知；“向我显明”符合异象语境，也保留被动领受的含义。
- source_word: הַבּוֹגֵד בּוֹגֵד
  choice: 背信者仍在背信
  rationale: 保留同根词重复所形成的修辞力度；בגד可指背信、诡诈行事，“仍在”使现代汉语读者自然感受到持续或特征性的行动。
- source_word: וְהַשֹּׁדֵד שֹׁדֵד
  choice: 毁灭者仍在毁灭
  rationale: שדד兼有劫掠与蹂躏、毁坏之意；此处用“毁灭”体现军事灾祸，并与前句保持同根式平行。
- source_word: עֲלִי עֵילָם
  choice: 以拦哪，上去吧
  rationale: עלה的阴性单数命令式在军事语境中是进军、上攻的号召；“上去吧”保留原文意象。
- source_word: צוּרִי מָדַי
  choice: 玛代啊，围攻吧
  rationale: צור在此为围城意义的阴性单数命令式；“围攻”简洁清楚。עֵילָם和מָדַי分别采用现代中文圣经语境中通行的专名“以拦”和“玛代”。
- source_word: כָּל אַנְחָתָהּ
  choice: 她一切的哀叹
  rationale: אַנְחָה可指叹息、呻吟；“哀叹”兼顾痛苦与发声。阴性单数后缀直译为“她”，不替原文指定所指。
- source_word: הִשְׁבַּתִּי
  choice: 我都使之止息了
  rationale: שבת的使役式意为使停止、使止息；此译保留使役语义及先知完成式的确定语气。
theological_decisions:
- issue: “她一切的哀叹”中阴性单数后缀的所指
  choice: 正文保留“她”，不明确指定对象
  alternative: 解释为巴比伦的哀叹、那地的哀叹，或她所造成的哀叹
  rationale: 本节没有明说该阴性所指。直接保留代词可维持原文真实的指代含混，避免将上下文推断写入正文。
- issue: “我”在末句中的身份及行动时态
  choice: 保留第一人称和完成式语气，不在正文解释说话者
  alternative: 明确解释为耶和华已经止息，或先知以预言完成式宣告将要止息
  rationale: 希伯来文只给出第一人称使役完成式；本节内部未明说说话者，译文不应擅自补定，同时以“了”传达该行动被陈述为确定完成。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话。“哪／啊”呈现对以拦和玛代的直接呼告；两个“仍在”使希伯来文同根重复在汉语中自然显出持续性与修辞平行。末句略带庄重倒装，以突出“她一切的哀叹”，同时保留原文的指代含混。
