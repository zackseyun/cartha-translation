  terminology: “以拦”“玛代”符合通行中文圣经专名；“围攻”“哀叹”“使之止息”均恰当。将“背信者”改作“背叛者”可较直接对应בגד，但“背信者”亦属可接受范围；本次修订保留其原有选择。
