  text: עַל כֵּ֗ן מָלְא֤וּ מָתְנַ/י֙ חַלְחָלָ֔ה צִירִ֣ים אֲחָז֔וּ/נִי כְּ/צִירֵ֖י יֽוֹלֵדָ֑ה נַעֲוֵ֣יתִי מִ/שְּׁמֹ֔עַ נִבְהַ֖לְתִּי מֵ/רְאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/003.yaml
  text: Therefore my loins are filled with anguish[a]; pains have seized me like the pains of a woman giving birth. I am bent over from hearing[b]; I am dismayed from seeing.
translation:
  language: zh_hans
  text: 因此，我的腰间满是痛苦[a]；剧痛攫住了我，如同产妇临产时的阵痛。我因所听见的而弯下身[b]；因所看见的而惊惶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “痛苦”或译“战栗”；希伯来词可指身体剧烈颤抖、翻腾扭动般的痛苦。
    reason: lexical_alternative
  - marker: b
    text: “弯下身”或译“扭曲了身体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלְאוּ מָתְנַי
  choice: 我腰间充满
  rationale: מָתְנַיִם具体指腰部、腰间；保留身体意象，同时符合现代汉语表达。
- source_word: חַלְחָלָה
  choice: 剧痛
  rationale: 该词可指强烈战栗、翻腾扭动般的痛苦；结合下文产痛意象，译作“剧痛”自然且保持强度，并以脚注保留“战栗”的可能。
- source_word: צִירִים אֲחָזוּנִי
  choice: 阵痛抓住了我
  rationale: צִירִים在此指剧烈疼痛，尤其与产痛相关；אחז表达强力攫住，直译“抓住”保留拟人化和突发压倒之感。
- source_word: כְּצִירֵי יוֹלֵדָה
  choice: 如同产妇生产时的阵痛
  rationale: 明确保留希伯来文的分娩比喻，以现代中文清楚呈现。
- source_word: נַעֲוֵיתִי
  choice: 我……痛苦扭曲
  rationale: 该动词可指扭曲、弯下或因痛苦而蜷曲；“痛苦扭曲”保留身体受折磨的强烈画面，而脚注列出“弯下身”的可能。
- source_word: מִשְּׁמֹעַ
  choice: 因所听见的
  rationale: מן加不定式在此宜作原因理解；此译比机械的“因听见”更自然，也与后句形成平行。
- source_word: נִבְהַלְתִּי
  choice: 惊惶
  rationale: 该词表示受惊、慌乱或惊骇；“惊惶”兼具震惊与不安，不把程度单一化为“恐惧”。
- source_word: מֵרְאוֹת
  choice: 因所看见的
  rationale: 按原因理解，并与“因所听见的”保持句法和修辞上的平行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可理解的书面汉语。保留“腰间”“抓住”等具体身体意象，以及“听见／看见”的平行结构；避免用过于医学化的术语。
