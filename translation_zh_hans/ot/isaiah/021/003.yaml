revisions:
- from: 因此，我腰间充满剧痛[a]；阵痛抓住了我，如同产妇生产时的阵痛。我因所听见的而痛苦扭曲[b]，因所看见的而惊惶。
  to: 因此，我的腰间满是痛苦[a]；剧痛攫住了我，如同产妇临产时的阵痛。我因所听见的而弯下身[b]；因所看见的而惊惶。
  rationale: 修订避免将第一处“疼痛”直接译成专指分娩的“阵痛”，从而保留原文先述身体剧痛、再以产妇疼痛作比的修辞层次；同时将较不自然的“痛苦扭曲”改为清楚的身体姿态，并以脚注保存原词“扭曲”的解释可能。其余关键意象、因果平行和庄重语域均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:20:43Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确呈现了腰间的强烈痛苦、疼痛如产妇分娩之痛般攫住先知，以及由听见和看见所引起的身体与心理震动。然“阵痛抓住了我”在现代汉语中会较明确地指分娩疼痛，提前弱化了原文先说一般强烈疼痛、后再以产痛作比的层次；“痛苦扭曲”也略显搭配生硬，并把原文可指弯曲、扭转的身体姿态处理得不够清楚。
  naturalness: “腰间充满剧痛”尚可理解，但“腰间满是痛苦”更自然且保留原词涵盖战栗与痛苦的空间。“剧痛攫住了我”保留原文的强力拟人化，且不把前一处疼痛预先限定为产痛。“因所听见的而弯下身”在现代庄重书面语中清楚自然，并保留脚注中的“扭曲”可能。
  terminology: “腰间”“产妇”“惊惶”均合乎现代标准汉语和经文庄重语域。“产妇临产时的阵痛”明确表达比较项；“临产”在此是为说明阵痛的性质，不改变原文分娩意象。
