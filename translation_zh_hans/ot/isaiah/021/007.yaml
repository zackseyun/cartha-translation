revisions:
- from: 他看见一队骑兵：马兵成双，另有骑驴的和骑骆驼的；他便凝神谛听，极其留心。[a]
  to: 他看见一队骑兵[a]：骑马的人成双，又有骑驴的和骑骆驼的；他凝神谛听，格外专注地听。[b]
  rationale: 修订以更自然的现代普通话表达“成双的骑马者”，并保留原文所列举的不同乘骑者。将听觉动词后的强调译为“格外专注地听”，避免“谛听，极其留心”的语义重叠不匀。由于 רכב 的具体含义在此有可保留的歧义，增加词义脚注；正文仍依上下文采用骑乘队伍的理解，未断言特定军事单位或历史情境。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:21:20Z'
review_pass:
  verdict: revise
  source_fidelity: “一队骑兵：马兵成双”对 רכב צמד פרשים 的集合性和“成双”有所传达，但“马兵”不属自然现代汉语，且以冒号将其处理为对“一队骑兵”的说明，略模糊了原文连续列举的结构。רכב 在本节可指乘骑队伍，也可能被理解为战车／车队；正文可采用合乎上下文的“骑兵队”，并以脚注保留该词的歧义。
  naturalness: “凝神谛听”庄重而通顺；“极其留心”也可理解，但与“谛听”搭配略显抽象。“格外专注地听”更直接自然。“骑马的人成双”比“马兵成双”更符合现代标准普通话。
  terminology: 不涉及专门神学术语。以“骑兵队”“骑驴的”“骑骆驼的”呈现军事／乘骑语境，避免将驴和骆驼误说成牵引战车；新增脚注说明 רכב 的词义争议，避免把一种解释绝对化。
