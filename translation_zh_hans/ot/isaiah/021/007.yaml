base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/007.yaml
  text: And he saw riders, pairs of horsemen[a], riders on donkeys, riders on camels; and he listened intently, with great attentiveness.
translation:
  language: zh_hans
  text: 他看见一队骑兵[a]：骑马的人成双，又有骑驴的和骑骆驼的；他凝神谛听，格外专注地听。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “骑兵”所译的原文词可指乘骑的队伍，也可指战车或车队。鉴于下文并列骑驴的和骑骆驼的，正文按乘骑队伍理解。
    reason: 保留 רכב 在此处的词义歧义，同时说明正文的语境性处理。
  - marker: b
    text: 原文近似直译为“留心，大大留心”或“他听着，多多地听”，以同根词的重复强调他听得十分专注。
    reason: 保留原文强调性重复及其可作较直译表达的可能。
lexical_decisions:
- source_word: וְרָאָה
  choice: 他看见
  rationale: Qal完成式第三人称阳性单数带连接词；在守望者的异象叙述中，以简洁的过去时表达最自然，不额外限定为“那时”或“当……时”
- source_word: רֶכֶב
  choice: 一队骑兵／骑……的
  rationale: רֶכֶב可指战车、车队或乘骑的队伍；其后并列马兵、驴和骆驼，语境更适合指乘骑者或乘骑队伍，而非都由这些动物牵引的战车。中文首处用“一队骑兵”呈现集合意义，后两处按坐骑自然表达
- source_word: צֶמֶד פָּרָשִׁים
  choice: 马兵成双
  rationale: צֶמֶד意为“一对、成双”，פָּרָשִׁים指马兵；“马兵成双”既保留配对的形象，也与前面的集合性“一队骑兵”顺畅衔接
- source_word: רֶכֶב חֲמוֹר
  choice: 骑驴的
  rationale: 按与马兵、骆驼并列的语境，理解为以驴为坐骑的人或队伍；避免译成容易令人误解的“驴拉的战车”
- source_word: רֶכֶב גָּמָל
  choice: 骑骆驼的
  rationale: 与רֶכֶב חֲמוֹר平行，表达以骆驼为坐骑的人或队伍
- source_word: וְהִקְשִׁיב
  choice: 他便凝神谛听
  rationale: קשׁב的Hiphil形强调主动专注地听；“凝神谛听”保留强烈的听觉关注，也符合庄重的先知叙事语体
- source_word: קֶשֶׁב רַב קָשֶׁב
  choice: 极其留心
  rationale: 原文以同根名词反复，并加רַב强化专注程度；正文用自然中文传达强调，脚注保留其近乎逐字的重复形式
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“马兵成双”保留希伯来文的配对意象；分号维持“所见”与“所听”两个动作层次。רֶכֶב本身可有“战车／车队”之义，但因本节并列驴与骆驼，正文选用乘骑队伍的语境义，同时不把这些人进一步界定为信使或特定兵种。
