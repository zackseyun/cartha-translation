  - severity: medium
    issue: 正文未交代 רכב 可指战车、车队或骑乘队伍的词义歧义。
    rationale: 该词在本节的具体指涉存在讨论；虽可按并列的驴和骆驼采用骑乘队伍的理解，仍宜以脚注保留另一种可行理解。
  - severity: low
    issue: “他便”略带未由原文明确要求的顺承色彩。
    rationale: 连接词可自然译为“又／并且”，不必强化为时间上的“便”。
