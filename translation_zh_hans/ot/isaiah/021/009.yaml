  text: וְ/הִנֵּה זֶ֥ה בָא֙ רֶ֣כֶב אִ֔ישׁ צֶ֖מֶד פָּֽרָשִׁ֑ים וַ/יַּ֣עַן וַ/יֹּ֗אמֶר נָפְלָ֤ה נָֽפְלָה֙ בָּבֶ֔ל וְ/כָל פְּסִילֵ֥י אֱלֹהֶ֖י/הָ שִׁבַּ֥ר לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/009.yaml
  text: And look[a], here comes a chariot, a man with a pair of horsemen. And he answered and said, “Fallen, fallen is Babylon[c][b], and all the carved images of her gods he has shattered to the ground.”
translation:
  language: zh_hans
  text: 看哪，有一队骑兵来了，成双成对[a]。他应声说：“巴比伦倾倒了！倾倒了！她众神的一切雕像[b]，他都砸碎在地上了[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文措辞十分压缩，字面可译作“一队人马，一对骑兵”；其成分之间的确切关系不明，也可理解为临近的战车、骑兵队伍。
    reason: lexical_alternative
  - marker: b
    text: 或译“她众神的一切偶像”。
    reason: lexical_alternative
  - marker: c
    text: 原文作“他砸碎了”，却没有明说“他”是谁；行动者须从上下文理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留指示现场、引人注意的鲜明语气；在现代中文中庄重而易懂。
- source_word: זֶה בָא
  choice: 来了
  rationale: 以自然中文传达说话者指着正在临近之物发出的即时宣告。
- source_word: רֶכֶב אִישׁ צֶמֶד פָּרָשִׁים
  choice: 一辆战车，一个人和一对骑兵
  rationale: 原文结构高度压缩，成分之间的确切关系并不清楚。译文保留其并列式表达，不擅自断定那个人、战车与骑兵之间的具体配置，并用脚注说明。
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: 他回应说
  rationale: 兼顾两个动词的应答与发言功能，同时避免现代中文中生硬的“回答并说”。
- source_word: נָפְלָה נָפְלָה
  choice: 倾倒了！倾倒了
  rationale: 保留完成式宣告的确定性、重复所产生的强调，以及城邑如人倾覆的形象。
- source_word: בָּבֶל
  choice: 巴比伦
  rationale: 采用现代中文通行地名。
- source_word: פְּסִילֵי אֱלֹהֶיהָ
  choice: 她众神的一切雕像
  rationale: “雕像”具体呈现由雕刻制成的神像；脚注保留“偶像”这一较具功能性的译法。
- source_word: שִׁבַּר
  choice: 他都砸碎
  rationale: 保留原文第三人称阳性单数主动动词及强烈的破坏含义，不补出其身份。
- source_word: לָאָרֶץ
  choice: 在地上
  rationale: 自然表达雕像被击落并砸碎于地的彻底毁坏。
theological_decisions:
- issue: 末句砸碎神像者的身份
  choice: 保留“他都砸碎”，不说明“他”是谁
  alternative: 译成“他们都砸碎了”或“都被砸碎在地上了”
  rationale: 希伯来文本使用第三人称阳性单数主动动词，却没有明说主语。保留单数主动形式，可避免擅自判定行动者是上帝、征服者或其他对象。
- issue: 巴比伦倾倒的完成性与修辞力度
  choice: 重复译作“倾倒了！倾倒了！”
  alternative: 译作“巴比伦已经彻底倾倒”
  rationale: 原文重复同一完成式动词，既宣告事件确定发生，又形成强烈的先知性节奏；直接保留重复，不用解释性副词替代。
translation_notes:
  register: 采用现代、庄重且可朗读的标准普通话。以短句和重复感保留守望者宣告的紧迫气氛；对战车队伍的压缩句法及末句未明说的行动者均不作过度解释。
