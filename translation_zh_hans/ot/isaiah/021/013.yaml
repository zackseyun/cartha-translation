  text: מַשָּׂ֖א בַּ/עְרָ֑ב בַּ/יַּ֤עַר בַּ/עְרַב֙ תָּלִ֔ינוּ אֹֽרְח֖וֹת דְּדָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/013.yaml
  text: 'An oracle concerning Arabia: In the forest in Arabia you will spend the night[c][b][a], O caravans of Dedanites.'
translation:
  language: zh_hans
  text: 论阿拉伯的默示[a]：底但人的商队[c]啊，你们要在阿拉伯的树林[b]中过夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“论阿拉伯的重担”或“论阿拉伯的宣告”。希伯来语 מַשָּׂא 在先知书标题中可有这些含义。
    reason: lexical_alternative
  - marker: b
    text: 或译“在阿拉伯的灌木丛中”。希伯来语 יַעַר 通常指“树林、林地”，但在这里的地理环境中也可能指灌木丛或矮树丛。
    reason: cultural_note
  - marker: c
    text: 希伯来语 אֹרְחוֹת 字面可指“道路、路径”，这里很可能转指沿路行进的队伍，即商队。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: 默示
  rationale: 该词在先知书标题中常指先知所传达的宣告；“默示”既符合现代中文圣经语体，也保留标题性质。其“重担”这一较为字面的含义列入脚注。
- source_word: בַּעְרָב
  choice: 论阿拉伯
  rationale: 与 מַשָּׂא 连用时，介词表示宣告所涉及的对象，译作“论阿拉伯”自然且不额外断定敌对含义。
- source_word: בַּיַּעַר
  choice: 在……树林中
  rationale: יַעַר 通常指树林或林地；正文保留其基本意象，不因阿拉伯的地理背景而直接改译为灌木丛。
- source_word: בַּעְרַב
  choice: 在阿拉伯
  rationale: 此处与标题中的地名相呼应，且下文提到底但人的商队，因此按地名理解最合适，而不取同形相关词可能具有的“傍晚”之意。
- source_word: תָּלִינוּ
  choice: 你们要……过夜
  rationale: 该动词意为住宿、过夜；“过夜”简洁自然，并保留第二人称复数的直接呼语。
- source_word: אֹרְחוֹת
  choice: 商队
  rationale: 该词本可指道路或路径，但这里与族名连用并作为呼语，转指沿路行进的队伍；在阿拉伯贸易旅行的语境中，“商队”最贴切。
- source_word: דְּדָנִים
  choice: 底但人的
  rationale: 该形式指与底但相关的族群；与“商队”组合为“底但人的商队”，准确表达所属关系和群体身份。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“论……的默示”保留先知宣告标题的功能；正文维持原文略显突出的“阿拉伯的树林”意象，并以脚注说明在当地环境中也可能指灌木丛。呼语“底但人的商队啊”与复数“你们”相配。
