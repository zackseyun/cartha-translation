  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וִ/ירֵשׁ֨וּ/הָ֙ קָאַ֣ת וְ/קִפּ֔וֹד וְ/יַנְשׁ֥וֹף וְ/עֹרֵ֖ב יִשְׁכְּנוּ בָ֑/הּ וְ/נָטָ֥ה עָלֶ֛י/הָ קַֽו תֹ֖הוּ וְ/אַבְנֵי בֹֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/011.yaml
  text: The desert owl and the hedgehog will possess her[a], and the owl and the raven will dwell in her[b]; he will stretch over her the measuring line of desolation and the plumb stones of emptiness.
translation:
  language: zh_hans
  text: 鹈鹕和刺猬必占据那里[a]；猫头鹰和乌鸦必栖居在那里。有人必在其上拉出荒凉的准绳和空虚的坠石[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里前两个动物名称的确切所指不能确定。“鹈鹕”也可译作“某种鸮类”或“鸬鹚”；“刺猬”也可译作“豪猪”或“麻鳽”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“混沌的准绳和空虚的石头”。“混沌、空虚”呼应创世记1:2，描绘这地因审判而仿佛退回未成形、无秩序的荒芜状态。“坠石”可能指测量垂直所用的石坠。
    reason: cross_reference
lexical_decisions:
- source_word: וִירֵשׁוּהָ
  choice: 必占据她
  rationale: ירשׁ可指承受、取得或占据；这里描写野兽占据沦为废墟之地，用“占据”最符合审判语境，并保留阴性代词所指的拟人化地域。
- source_word: קָאַת
  choice: 鹈鹕
  rationale: 所指鸟类不能确定；“鹈鹕”是有传统依据的常见译法。具体辨识的不确定性在脚注中说明。
- source_word: קִפּוֹד
  choice: 刺猬
  rationale: 动物种类有争议；“刺猬”是常见且易懂的对应词，也适合废墟动物的图景，其他可能译法见脚注。
- source_word: יַנְשׁוֹף
  choice: 猫头鹰
  rationale: 一般指某种鸮类，但难以确定具体品种；采用泛称以避免虚假的精确。
- source_word: עֹרֵב
  choice: 乌鸦
  rationale: עֹרֵב通常指鸦类；“乌鸦”是现代汉语自然、通行的对应词。
- source_word: יִשְׁכְּנוּ בָהּ
  choice: 要住在其中
  rationale: שׁכן表示居住、栖居；“住在其中”自然表达野物长久栖居于荒废之地的景象。
- source_word: וְנָטָה עָלֶיהָ
  choice: 他必在她上面拉起
  rationale: נטה在此表示拉开、展开测量用的线；希伯来文主语未明说，语境中可理解为施行审判者，译文保留“他”而不增补身份。
- source_word: קַו תֹהוּ
  choice: 荒凉的准绳
  rationale: קַו是测量用的线；תֹהוּ兼有荒芜、空无、混沌之意。“荒凉的准绳”兼顾测量意象与审判语境。
- source_word: וְאַבְנֵי בֹהוּ
  choice: 空虚的坠石
  rationale: אַבְנֵי直译为“石头”，与准绳平行时可能指悬于线下、用于测量垂直的石坠；בֹהוּ意为虚空、空无。译作“坠石”保留原文具体的石头意象，且不把其解释得过死。
theological_decisions:
- issue: תֹהוּ与בֹהוּ对创世记1:2的呼应
  choice: 正文译作“荒凉”与“空虚”，脚注明示“混沌空虚”的创世回声
  alternative: 正文直译作“混沌的准绳和空虚的石头”
  rationale: 这两个词共同唤起创世记1:2，描绘受审判之地仿佛退回未受造秩序整理的荒芜状态。正文须保持现代汉语可读性，又不应抹去互文，因此将关键回声置于脚注说明。
- issue: 测量器具用于审判与毁灭的张力
  choice: 保留“准绳”和“坠石”的建造测量意象，不解释成单纯的拆毁工具
  alternative: 意译为“毁灭的尺度”
  rationale: 原文刻意借测量、建造器具描写被精确量定的荒废；保留这一反常张力比直接解释更忠实。
- issue: וְנָטָה的隐含主语
  choice: 译为“他”，不在正文明确增补“耶和华”
  alternative: 译为“耶和华必”或采用无主句
  rationale: 上下文可使读者理解施行审判者是上帝，但本节希伯来文本身没有明说主语。保留代词可避免把语境推断写进正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“必……要……”体现预言语气；保留“她”以对应指向地域的阴性单数代词。动物名称避免过度精确，并用脚注交代文本真实存在的辨识困难。测量意象采用“准绳、坠石”，使普通读者可理解，同时尽量保留希伯来文的具体性与创世互文。
