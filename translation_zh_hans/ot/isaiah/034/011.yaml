revisions:
- from: 鹈鹕和刺猬必占据她[a]，猫头鹰和乌鸦要住在其中；他必在她上面拉起荒凉的准绳，垂下空虚的坠石[b]。
  to: 鹈鹕和刺猬必占据那里[a]；猫头鹰和乌鸦必栖居在那里。有人必在其上拉出荒凉的准绳和空虚的坠石[b]。
  rationale: 修订使代词和动物栖居的表达符合现代标准汉语，并以“有人”保留原文未明说的施事者，避免将语境推断的神名写入正文。将测量动作统一为“拉出”，更贴近原文单一动词支配两项测量器具的句法。脚注保留动物辨识的不确定性及创世记互文。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:21:21Z'
