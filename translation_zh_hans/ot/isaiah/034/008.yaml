  text: כִּ֛י י֥וֹם נָקָ֖ם לַֽ/יהוָ֑ה שְׁנַ֥ת שִׁלּוּמִ֖ים לְ/רִ֥יב צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/008.yaml
  text: For Yahweh has a day of vengeance[a], a year of recompense for Zion’s cause.
translation:
  language: zh_hans
  text: 因为耶和华有报应之日，有为锡安案件施行报偿之年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为报应之日归于耶和华；有为锡安的争讼施行报偿之年。”
    reason: 保留 לַיהוָה 可作所属或关系性表达的理解，并提示 רִיב 可指“争讼”或“案件”的法庭语义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明审判临到的缘由；保留希伯来语的解释性连接作用。
- source_word: יוֹם נָקָם
  choice: 施行报应的日子
  rationale: נָקָם指针对恶行的惩罚性回报；“报应”比私人色彩较强的“报仇”更能体现此处的司法审判意味。
- source_word: לַיהוָה
  choice: 耶和华有
  rationale: לְ在此可表达所属或关系；采用自然的汉语领有句，同时脚注保留“归于耶和华”的关系性理解。
- source_word: שְׁנַת שִׁלּוּמִים
  choice: 施行偿报的年日
  rationale: שִׁלּוּמִים表示偿还、报偿或报应；“偿报”保留按所行偿还的司法色彩，“年日”与前句“日子”形成诗体平行。
- source_word: לְרִיב צִיּוֹן
  choice: 为锡安的争讼
  rationale: רִיב可指争端、诉讼或案件；“争讼”保留法庭语境，也不预先断定该短语仅指锡安的主张或案件。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的专名译法。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用简体中文读者最熟悉、最通行的圣经专名“耶和华”，并明确保留原文中的专有神名，而非以“主”代替。
- issue: לַיהוָה 的句法关系
  choice: 领有式：“耶和华有”
  alternative: 关系式：“归于耶和华”或“为耶和华而设”
  rationale: 希伯来介词לְ可表达领有或关系；正文采用自然汉语领有句，脚注提示另一种较贴近形式的理解。
- issue: לְרִיב צִיּוֹן 的法庭含义
  choice: 为锡安的争讼
  alternative: 为锡安的案件／为锡安伸冤
  rationale: “争讼”保存רִיב的诉讼性和一定歧义，避免用“伸冤”直接加入原文未明说的裁决结果。
translation_notes:
  register: 采用庄重而现代的标准普通话。“报应／偿报／争讼”形成司法语义场，保留希伯来诗句中“日子—年日”的平行结构。
