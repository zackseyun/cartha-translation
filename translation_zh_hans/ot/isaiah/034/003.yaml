base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/003.yaml
  text: Their slain will be thrown out[a], and the stench of their corpses will rise[c][b]; the mountains will melt from their blood.
translation:
  language: zh_hans
  text: 他们被杀的人必被抛出去[a]；他们尸体所发的臭气必上腾[b]；群山必因他们的血而融化[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必被弃置”。希伯来语动词可表示“投掷、丢出”。
    reason: lexical_alternative
  - marker: b
    text: 直译可作：“他们的恶臭必上升。”
    reason: lexical_alternative
  - marker: c
    text: 这是先知书中强烈的审判语言：流血被描绘得如此惨烈，仿佛连群山也因他们的血而融化。
    reason: cultural_note
lexical_decisions:
- source_word: חַלְלֵיהֶם
  choice: 他们被杀的人
  rationale: 该名词在战争与审判语境中通常指遭杀戮者；“被杀的人”比泛称“死人”更准确，也比“伤员”更符合此处尸体与流血的上下文。
- source_word: יֻשְׁלָכוּ
  choice: 必被抛弃
  rationale: 这是“投掷、丢出”的被动式；结合尸首无人安葬的语境，“被抛弃”既保留弃置的动作，也传达受辱、暴尸的意味。
- source_word: פִגְרֵיהֶם
  choice: 他们尸体
  rationale: פגר指死尸；“尸体”是现代汉语中自然、庄重而不弱化画面的表达。
- source_word: יַעֲלֶה
  choice: 必上腾
  rationale: עלה本义为“上去、升起”；用于臭气时，“上腾”自然地保留其向上升起的意象。
- source_word: בָאְשָׁם
  choice: 臭气
  rationale: 该词指恶臭，并带有第三人称复数所属后缀；译作“他们尸体的臭气”，明确臭气来自前述尸体。
- source_word: וְנָמַסּוּ
  choice: 必消融
  rationale: מסס可指融化、溶解；“消融”保留群山仿佛因血而融解的强烈先知性意象，且适合庄重文体。
- source_word: הָרִים
  choice: 群山
  rationale: 原词明确指山；“群山”符合复数形式，并保留宏大的画面尺度。
- source_word: מִדָּמָם
  choice: 因他们的血
  rationale: 介词מִן可表示来源或原因；此处“因”在汉语中较自然，同时仍让“血使群山消融”这一图像保持开放，不将其改写为“浸透”或“冲刷”。
theological_decisions:
- issue: 神圣审判意象的性质
  choice: 保留尸首、恶臭、流血以及群山消融的强烈先知性审判画面，不加以淡化。
  alternative: 意译为“群山被他们的血浸透”或“被血冲刷”。
  rationale: 希伯来文本刻意运用震撼、宏大的审判语言。直译“群山……消融”能保存其诗性张力与可能的夸张色彩，而不把意象预先解释成较平缓的具体场景。
- issue: 介词מִן在“血”前的关系
  choice: 译为“因他们的血”，表达原因。
  alternative: 译为“从他们的血”或“被他们的血”。
  rationale: מִן可表示来源或原因；现代汉语“因……而消融”较为通顺，但不进一步说明血以何种方式造成消融，从而保留原文的意象张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“被杀的人”“尸体”“臭气”保留原文的惨烈感；“上腾”“消融”则维持诗性与审判宣告的力度。所有脚注标记均置于相应正文词句之后。
