base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/010.yaml
  text: Night and day it shall not be quenched; its smoke shall go up forever[a]. From generation to generation it shall lie waste; forever and ever no one shall pass through it.
translation:
  language: zh_hans
  text: 昼夜不熄；它的烟永远上腾。世世代代，它必成荒凉[a]；永永远远，无人从那里经过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“变得荒凉。”希伯来语动词可指遭毁坏或变得荒凉。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה וְיוֹמָם
  choice: 昼夜
  rationale: 这一对词构成表示持续不断的统称；“昼夜”简洁自然，并保留原文次序所表达的连续性。
- source_word: לֹא תִכְבֶּה
  choice: 不熄
  rationale: כבה用于火时指熄灭或被扑灭；上下文隐含火，“不熄”在现代汉语中自然，也保留未明确施事者的表达。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: עוֹלָם在此表达绵延不绝的时长；“永远”直接保留审判宣告的强烈语气。
- source_word: יַעֲלֶה עֲשָׁנָהּ
  choice: 它的烟永远上腾
  rationale: עלה与“烟”连用表示烟向上升；“上腾”比单纯“升起”更符合持续冒烟的图景，阴性后缀按汉语习惯译作“它的”。
- source_word: מִדּוֹר לָדוֹר
  choice: 世世代代
  rationale: 固定表达，指一代接一代持续下去；“世世代代”是自然、庄重且易懂的对应说法。
- source_word: תֶּחֱרָב
  choice: 它必荒凉
  rationale: חרב在此表示遭到毁坏、成为荒凉之地；“荒凉”保留结果状态，并与后文无人经过相呼应。
- source_word: לְנֵצַח נְצָחִים
  choice: 永永远远
  rationale: 原文以重复、强化的形式表达永久性；“永永远远”在汉语中相应地保留这种强调。
- source_word: אֵין עֹבֵר בָּהּ
  choice: 无人从其中经过
  rationale: אֵין加分词表示没有任何经过者；结合预言语境译为“无人从其中经过”，清楚表达持续的无人通行状态。
theological_decisions:
- issue: 审判预言中的持续时间用语
  choice: 将לְעוֹלָם和לְנֵצַח נְצָחִים分别直译为“永远”和“永永远远”。
  alternative: 译为“长久”或“世世代代”等可能暗示有限时段的措辞。
  rationale: 希伯来文叠加强烈的持续时间表达。译文保留其永久性语气，不预先把它解释为修辞夸张或有限时期。
translation_notes:
  register: 采用现代、庄重而清晰的书面汉语。“昼夜不熄”“烟永远上腾”保留原文鲜明的审判图景；各分句结构紧凑，并用“世世代代”“永永远远”再现原文的排比与强调。脚注标记置于其实际所说明的“荒凉”之后。
