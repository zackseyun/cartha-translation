  naturalness: 原译庄重简洁，适合先知书文体。“无人从其中经过”稍显生硬；“无人从那里经过”更合现代书面汉语。“它必荒凉”可保留，但“必成荒凉”更明确表达该动词所指的成为荒废状态。
