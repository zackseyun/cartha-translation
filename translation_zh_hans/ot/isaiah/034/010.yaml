  to: 昼夜不熄；它的烟永远上腾。世世代代，它必成荒凉[a]；永永远远，无人从那里经过。
  rationale: 修订仅处理脚注的词义精确性及两处轻微的现代汉语表达问题。保留原文关于烟持续上升、土地持续荒凉、无人通行的并列结构，也保留“永远”与“永永远远”的强化关系，未对其作教义性限缩或解释。
