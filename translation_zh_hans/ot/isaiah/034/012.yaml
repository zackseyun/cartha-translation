  yaml_path: translation/ot/isaiah/034/012.yaml
  text: They will call its nobles[a], but there will be no kingdom there, and all its princes will be nothing.
translation:
  language: zh_hans
  text: 人们要召唤那里的贵族[a]，但那里已无王国；那里的所有首领都必归于无有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那里的贵族要呼喊，但那里已无王国。”希伯来语前半句的句法难以确定。
    reason: 保留原文中“贵族”究竟是“召唤”的宾语还是动词主语这一真实歧义。
lexical_decisions:
- source_word: חֹרֶיהָ
  choice: 那里的贵族
  rationale: חֹר在这里指有身份的自由民或贵族，与后半节的“首领”相呼应；阴性单数后缀指前文所说之地，译作“那里”在现代汉语中较自然。
- source_word: וְאֵין שָׁם
  choice: 但那里已无
  rationale: 保留存在句的否定和地点成分；结合审判语境用“但”表达转折，并以“已”自然呈现其政治秩序不复存在的状态。
- source_word: מְלוּכָה
  choice: 王国
  rationale: 该词可指王权、君王统治或王国；此处与贵族、首领及地域语境并列，“王国”最为明白，同时不把含义限缩为某种具体政体程序。
- source_word: יִקְרָאוּ
  choice: 人们要召唤
  rationale: קרא的基本义为呼叫、召唤；第三人称复数的主语未明说，汉语用泛指的“人们”避免虚构特定行动者。困难语序所容许的另一种主谓关系见脚注。
- source_word: וְכָל שָׂרֶיהָ
  choice: 所有首领
  rationale: שׂר可指首领、官长或权贵；“首领”既保留政治领导阶层的含义，也与“贵族”有所区分。所属关系可由上下文自然领会，不必重复“那里的”。
- source_word: יִהְיוּ אָפֶס
  choice: 都必归于无有
  rationale: אָפֶס表达不存在、消失或归于虚无；“归于无有”以庄重而可懂的汉语传达其统治阶层彻底消亡的审判意象。
theological_decisions:
- issue: 前半节压缩且困难的希伯来语句法
  choice: 把חֹרֶיהָ理解为יִקְרָאוּ的前置宾语：“人们要召唤那里的贵族”，并把“那里已无王国”作为转折分句。
  alternative: 把“贵族”理解为动词的主语：“那里的贵族要呼求，但那里已无王国。”
  rationale: 马所拉文本的词序可容许不同分析，且动词主语没有明说。正文采用与英语审校层一致、也能体现当地政治秩序瓦解的读法；脚注明示另一种语法可能，避免把真正的歧义当作已经解决。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“归于无有”略带先知性审判文体的力度；标点将三个紧密相关的政治崩解陈述清楚分开。
