source:
  edition: WLC
  text: דִּרְשׁ֨וּ מֵֽ/עַל סֵ֤פֶר יְהוָה֙ וּֽ/קְרָ֔אוּ אַחַ֤ת מֵ/הֵ֨נָּה֙ לֹ֣א נֶעְדָּ֔רָה אִשָּׁ֥ה רְעוּתָ֖/הּ לֹ֣א פָקָ֑דוּ כִּֽי פִ/י֙ ה֣וּא צִוָּ֔ה וְ/רוּח֖/וֹ ה֥וּא קִבְּצָֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/016.yaml
  text: 'Search in the book of Yahweh and read: not one of these will be missing[a]; none will lack her mate. For his mouth has commanded[b], and his Spirit has gathered them.'
translation:
  language: zh_hans
  text: 你们要查考耶和华的书，并诵读：其中一个也不会缺少；没有一个会缺少配偶。因为我的口已经吩咐了[a]；他的灵也把它们聚集起来了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于：“因为我的口，他已经吩咐了。”此处“我的口”与后文“他的灵”之间出现人称转换，句法关系也有解释上的困难；也可按上下文译作：“因为他的口已经吩咐了。”
    reason: 保留马所拉文本中第一人与第三人称的转换，并说明另一种协调上下文的译法。
  - marker: b
    text: “灵”也可译作“气息”或“风”。
    reason: 希伯来词רוּחַ具有“灵、气息、风”等词义。
lexical_decisions:
- source_word: דִּרְשׁוּ מֵעַל סֵפֶר יְהוָה
  choice: 你们要查考耶和华的书
  rationale: דרשׁ为复数命令式；在书卷语境中表示查阅、考察。“查考”既体现主动寻查，也自然适用于书面记载。מֵעַל在此按查阅书卷的惯用意义处理。
- source_word: וּקְרָאוּ
  choice: 并诵读
  rationale: קרא既可指呼喊，也可指朗读；以书卷内容为对象时，“诵读”比单纯“读”更能保留出声宣读的可能。
- source_word: אַחַת מֵהֵנָּה לֹא נֶעְדָּרָה
  choice: 这些之中，一个也不会缺少
  rationale: 保留阴性单数אַחַת的逐一分配意味；结合预言语境，用“不会”表达所宣告之事的确定实现。
- source_word: אִשָּׁה רְעוּתָהּ לֹא פָקָדוּ
  choice: 没有一个会缺少伴侣
  rationale: 希伯来文以阴性单数和“同伴”描述前文所列生物成双相伴；“伴侣”适合动物语境，同时避免在中文中生硬复制语法性别。
- source_word: כִּי פִי הוּא צִוָּה
  choice: 因为我亲口吩咐了
  rationale: פִי按马所拉文本直译为“我的口”；“我亲口”自然表达希伯来文以“口”强调命令来源的结构。保留随后转为第三人称的张力，不在正文中擅自统一人称。
- source_word: וְרוּחוֹ
  choice: 他的灵
  rationale: רוּחַ可指灵、气息或风；此处与发令和聚集的神圣行动并列，“灵”最能保留其主动施行的意味，其他词义收入脚注。
- source_word: קִבְּצָן
  choice: 把它们聚集起来了
  rationale: קבץ意为聚集，词尾指向复数对象；用完成体“了”反映希伯来文完成式，并可在预言语境中表达事情必成的确定性。
theological_decisions:
- issue: 末句中第一人称与第三人称的转换
  choice: 因为我亲口吩咐了，他的灵也把它们聚集起来了
  alternative: 因为他的口已经吩咐，他的灵也把它们聚集起来了
  rationale: 马所拉文本的פִי是第一人称“我的口”，而וְרוּחוֹ是第三人称“他的灵”。正文保留这一真实的人称转换，以免为求顺畅而消除原文张力；脚注说明可按上下文统一为第三人称的译法。
- issue: רוּחַ所指的神圣行动方式
  choice: 他的灵
  alternative: 他的气息／他的风
  rationale: 原词具有“灵、气息、风”的语义范围。正文采用最符合主动聚集之施事语境的“灵”，但不排除其他词义，故以脚注保留。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“查考”“诵读”适合公开宣告书卷的语境；保留“耶和华”作为神名。正文保留原文末句的人称转换，并以脚注交代替代译法和רוּחַ的词义范围。
