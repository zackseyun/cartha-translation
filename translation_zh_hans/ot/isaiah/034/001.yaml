revisions:
- from: 列国啊，要近前来听！万民啊，要留心听！愿大地和充满其中的一切都听见，愿世界和其中所产生的一切[a]都听见。
  to: 列国啊，近前来听吧！万民啊，留心听吧！愿大地和其中充满的一切都听见；愿世界和它所生的一切[a]都听见。
  rationale: 修订不改变经文含义、诗歌平行或原文的语义歧义。“它所生的一切”保留了 צֶאֱצָאֶיהָ 所指“后裔／生出之物／出产”的生成性和开放范围；脚注明确列出主要可行译法。
