  text: קִרְב֤וּ גוֹיִם֙ לִ/שְׁמֹ֔עַ וּ/לְאֻמִּ֖ים הַקְשִׁ֑יבוּ תִּשְׁמַ֤ע הָ/אָ֨רֶץ֙ וּ/מְלֹאָ֔/הּ תֵּבֵ֖ל וְ/כָל צֶאֱצָאֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/001.yaml
  text: Come near[a], nations, to hear; and listen, peoples. Let the earth hear, and all that fills it[b], the world and all its offspring.
translation:
  language: zh_hans
  text: 列国啊，近前来听吧！万民啊，留心听吧！愿大地和其中充满的一切都听见；愿世界和它所生的一切[a]都听见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它所生的一切”也可译作“它的一切后裔”或“它的一切出产”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבוּ
  choice: 要近前来
  rationale: 该词为复数命令式，表达先知向列国发出的临近、前来聆听的召唤；“近前来”自然且保留命令语气。
- source_word: גוֹיִם
  choice: 列国
  rationale: 此处指世上的各国，而非后期犹太—外邦对举意义上的“外邦人”；“列国”也符合先知文学语体。
- source_word: לִשְׁמֹעַ
  choice: 听
  rationale: 不定式说明近前来的目的，并与后文同源动词 תִּשְׁמַע 呼应。
- source_word: לְאֻמִּים
  choice: 万民
  rationale: 与“列国”构成近义平行；用“万民”既避免重复，也体现普世范围。
- source_word: הַקְשִׁיבוּ
  choice: 要留心听
  rationale: 使役词干命令式强调专注聆听；“留心听”比单纯“听”更能呈现其语义力度。
- source_word: תִּשְׁמַע
  choice: 愿……都听见
  rationale: 未完成式在此具有祈使／命令色彩。“愿”能自然表达诗歌中向大地和世界发出的拟人化召唤。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 上下文以“世界”和其中一切为平行，范围显然是普世性的，因此译作“大地”而非局部性的“土地”。
- source_word: מְלֹאָהּ
  choice: 充满其中的一切
  rationale: 该名词指大地所包含的全部内容；此译保留“充满”的意象，同时符合现代汉语。
- source_word: תֵּבֵל
  choice: 世界
  rationale: 该词通常指有秩序、有人居住的世界；“世界”在本处简洁自然。
- source_word: כָל צֶאֱצָאֶיהָ
  choice: 其中所产生的一切
  rationale: צֶאֱצָאִים 指所生出、所产生的后代或出产。此译保留宽泛性，不将所指限制为人类后裔或农作物。
theological_decisions: []
translation_notes:
  register: 采用庄重而清晰的现代标准普通话。以两个直接呼语和两个“愿……”分句再现希伯来诗歌的平行结构；通过“列国／万民”“大地／世界”保留近义变化。脚注保留 צֶאֱצָאֶיהָ 在后裔、所生之物与出产之间的真实语义幅度。
