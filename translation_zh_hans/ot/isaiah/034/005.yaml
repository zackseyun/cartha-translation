  source_fidelity: “我的刀在天上已经饱饮”能保留 רִוְּתָה 的拟人化“喝足”意象，且没有擅自补出“血”，基本忠实。惟“我定意毁灭的民”把 חֶרְמִי 表述为说话者的主观意图，较原文“我的ḥerem／归我禁绝之物”的既定、归属性含义略有偏移；改为“我所定归于毁灭的民”较准确。句末“施行审判”可理解，却将不定式短语的目的性较明确地转作刀所执行的动作；“接受审判”在汉语中更清楚呈现对象临到审判的结果。
