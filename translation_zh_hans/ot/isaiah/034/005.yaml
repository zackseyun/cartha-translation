source:
  edition: WLC
  text: כִּֽי רִוְּתָ֥ה בַ/שָּׁמַ֖יִם חַרְבִּ֑/י הִנֵּה֙ עַל אֱד֣וֹם תֵּרֵ֔ד וְ/עַל עַ֥ם חֶרְמִ֖/י לְ/מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/005.yaml
  text: For my sword is drenched in the heavens[a]; behold, it will descend on Edom, on the people of my ban[b], for judgment.
translation:
  language: zh_hans
  text: 因为我的刀在天上已经饱饮[a]；看哪，它必降在以东，降在我所定归于毁灭的民[b]身上，使他们接受审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“已经浸透”“已经喝足”。希伯来文把刀描写为已经饱饮或饱和，却没有明说它所饮的是什么。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为“我之ḥerem的民”；ḥerem指被禁绝、划归毁灭之物或人，在此指在神圣审判下被定归毁灭的民。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，为即将临到的审判说明缘由；同时不把语气过度限定为强调式。
- source_word: רִוְּתָה
  choice: 已经饱饮
  rationale: 该词源于 רוה，可表示喝足、饱饮或浸透。以“刀”为主语时，“饱饮”保留希伯来文鲜明而略带拟人的暴力意象；究竟饮了什么，原文并未明说。
- source_word: בַשָּׁמַיִם
  choice: 在天上
  rationale: 自然表达复数形式 שָׁמַיִם 所指的天界领域，并保留刀从天而降的宇宙性图景。
- source_word: חַרְבִּי
  choice: 我的刀
  rationale: 直接保留第一人称所属关系；在上下文中，这刀是耶和华施行审判的器具。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示读者注意随后行动的强烈指示作用，同时符合庄重的经文语体。
- source_word: עַל אֱדוֹם
  choice: 降在以东……身上
  rationale: עַל 与“降下”连用，呈现刀从上方临到目标的具体图景；“身上”使现代汉语表达自然。
- source_word: תֵּרֵד
  choice: 必降
  rationale: 准确表达 ירד 的下降动作，并与前句“在天上”形成空间上的呼应。
- source_word: עַם חֶרְמִי
  choice: 我定意毁灭的民
  rationale: חֵרֶם 在此指因神圣审判而被划定归于毁灭者。“定意毁灭”比音译或直译为“禁令之民”清楚，也避免仅译作“受咒诅”而削弱司法性毁灭的含义。
- source_word: לְמִשְׁפָּט
  choice: 施行审判
  rationale: 在汉语中明确表达目的及司法行动，比孤立的“为审判”更自然，同时保留 מִשְׁפָּט 的审判含义。
theological_decisions:
- issue: 神圣审判语境中 חֵרֶם 的含义
  choice: 译为“我定意毁灭的民”
  alternative: “归我毁灭的民”或“我所禁绝的民”
  rationale: 此词不只是口头咒诅，而指在神圣审判之下被划定归于毁灭。正文采用普通读者可理解的表达，脚注则说明其专门语义，不引入特定宗派解释。
- issue: רִוְּתָה 所表达的刀之状态
  choice: 译为“已经饱饮”
  alternative: “已经浸透”或“已经喝足”
  rationale: 原文可指饱饮或饱和。保留“饱饮”可呈现拟人化意象而不擅自补出“血”；脚注交代词义幅度，以保存原文张力。
translation_notes:
  register: 采用现代、庄重而可朗读的标准汉语。“看哪”保留先知性宣告的提示力度；“饱饮”保存原文诗性拟人，不补出原文未明说的“血”；两个“降在”形成平行结构，并清楚表明以东就是随后所称的受审判之民。
