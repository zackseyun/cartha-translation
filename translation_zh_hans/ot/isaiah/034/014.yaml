  to: 旷野的走兽必与鬣狗[a]相遇，山羊鬼必呼唤同伴；诚然，莉莉特[b]必在那里安歇，为自己找到栖息之处。
  rationale: 仅调整“也必”为“诚然，……必”，以译出אַךְ的强调语气；其余措辞及两条脚注均忠实、自然，并保留原文在动物鉴定与莉莉特所指上的歧义。
