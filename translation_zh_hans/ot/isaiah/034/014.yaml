base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/014.yaml
  text: And desert creatures will meet with hyenas[a], and the goat-demon will call to its fellow; indeed[b], there Lilith will settle down and find a resting place for herself.
translation:
  language: zh_hans
  text: 旷野的走兽必与鬣狗[a]相遇，山羊鬼必呼唤同伴；诚然，莉莉特[b]必在那里安歇，为自己找到栖息之处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鬣狗”或译“豺狼”；此希伯来动物名称的确切所指不确定。
    reason: lexical_alternative
  - marker: b
    text: “莉莉特”也可译作“夜间生物”或“夜怪”；有些较早的译本译作“鸣角鸮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיִּים
  choice: 旷野的走兽
  rationale: 该词泛指栖居荒野或废墟的生物，并非明确物种；此译保留宽泛而荒凉的意象。
- source_word: אִיִּים
  choice: 鬣狗
  rationale: 具体动物所指不确定；“鬣狗”符合食腐荒野动物的语境，同时以脚注保留“豺狼”等可能。
- source_word: שָׂעִיר
  choice: 山羊鬼
  rationale: 在荒废之地充满诡异生灵的语境中，该词很可能不只是公山羊，而带有鬼怪含义；此译也避免借用希腊罗马的“萨堤尔”形象。
- source_word: עַל רֵעֵהוּ יִקְרָא
  choice: 必呼唤同伴
  rationale: 表达一个生灵向同类或伙伴呼叫；“同伴”自然且不额外限定为配偶。
- source_word: אַךְ
  choice: 也必
  rationale: 该语气词在此加强并推进陈述；结合汉语句法译作“也必”，既承接前文，又保留肯定语气。
- source_word: הִרְגִּיעָה
  choice: 安歇
  rationale: 表示安定下来、得到休息；“安歇”庄重自然，并与下文“栖息之处”衔接。
- source_word: לִּילִית
  choice: 莉莉特
  rationale: 这是罕见且有争议的词。音译可保留其可能的神话或鬼怪色彩，避免武断地认定为某种鸟兽；其他解释列入脚注。
- source_word: מָנוֹחַ
  choice: 栖息之处
  rationale: 该名词可指休息或休息之所；此处描写荒墟成为生灵住处，具体译作“栖息之处”最贴合语境。
theological_decisions:
- issue: 是否将荒野生灵的超自然或神话色彩消解为普通动物
  choice: 保留“山羊鬼”及音译“莉莉特”，呈现原文可能具有的诡异、超自然色彩。
  alternative: 把两者都译成普通的荒野动物或鸟类。
  rationale: 本节以可怖生灵栖居荒墟来描绘审判后的彻底荒凉。保留这种张力更忠于希伯来文本，但不据此建立经文未明说的完整鬼魔论。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“旷野的走兽”保留泛称，“山羊鬼”和“莉莉特”维持原文诡异意象及词义张力；句式简洁，适合公开诵读。
