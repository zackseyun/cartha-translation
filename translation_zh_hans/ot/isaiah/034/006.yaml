id: ISA.34.6
reference: Isaiah 34:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חֶ֣רֶב לַ/יהוָ֞ה מָלְאָ֥ה דָם֙ הֻדַּ֣שְׁנָה מֵ/חֵ֔לֶב מִ/דַּ֤ם כָּרִים֙ וְ/עַתּוּדִ֔ים מֵ/חֵ֖לֶב כִּלְי֣וֹת אֵילִ֑ים כִּ֣י זֶ֤בַח לַֽ/יהוָה֙ בְּ/בָצְרָ֔ה וְ/טֶ֥בַח גָּד֖וֹל בְּ/אֶ֥רֶץ אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/006.yaml
  text: The sword of Yahweh is filled with blood[a]; it is made fat with fat, with the blood of lambs and goats, with the fat of the kidneys of rams. For Yahweh has a sacrifice in Bozrah[b], and a great slaughter in the land of Edom.
translation:
  language: zh_hans
  text: 耶和华的刀沾满了血，沾满了脂油；沾满羊羔和公山羊的血，也沾满公绵羊肾脏周围的脂油。因为耶和华在波斯拉有一场献祭[a]，在以东之地有一场大屠杀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为在波斯拉有献给耶和华的祭牲。”希伯来文此句没有明写动词，两种理解都有可能。
    reason: 保留无动词分句以及介词 ל־所造成的真实句法歧义。
lexical_decisions:
- source_word: חֶרֶב לַיהוָה
  choice: 耶和华的刀
  rationale: 将关系介词 ל־理解为所属关系，保留审判神谕中具体的刀剑意象；“耶和华”采用现代中文读者熟悉的神名形式。
- source_word: מָלְאָה דָם
  choice: 沾满鲜血
  rationale: 完成式表达刀已充满血的结果状态；“沾满鲜血”比直译“充满血”更符合中文对刀剑的自然描述，同时保留强烈意象。
- source_word: הֻדַּשְׁנָה מֵחֵלֶב
  choice: 浸透脂油
  rationale: 被动式表示刀因脂油而变得肥厚、饱足；中文用“浸透脂油”传达结果与祭牲脂油的物质感，避免不自然的“被养肥”。
- source_word: כָּרִים וְעַתּוּדִים
  choice: 羊羔和公山羊
  rationale: כָּרִים在此祭牲组合中可指羊羔或幼公羊；עַתּוּדִים特指公山羊。译文保留后一词的性别限定。
- source_word: מֵחֵלֶב כִּלְיוֹת אֵילִים
  choice: 公绵羊肾上的脂油
  rationale: 明确保留肾脏周围脂油这一祭祀细节；אֵילִים译作“公绵羊”，清楚区别于前面的公山羊。
- source_word: זֶבַח
  choice: 一场献祭
  rationale: 保留祭祀词汇以及它与战场杀戮之间刻意形成的张力，不将其泛化为战争。
- source_word: טֶבַח גָּדוֹל
  choice: 一场大屠杀
  rationale: 直接传达大规模宰杀的强烈含义，并与前面的“献祭”构成平行。
- source_word: בָּצְרָה
  choice: 波斯拉
  rationale: 按希伯来语地名音译，并采用现代中文圣经地名的常见形式。
theological_decisions:
- issue: 以献祭图景描绘对以东的审判
  choice: 保留“脂油、肾、献祭、屠杀”等明确而强烈的祭祀与杀戮用语
  alternative: 弱化为一般性的战争或击败语言
  rationale: 原文有意把耶和华对以东的审判描绘成献祭性的宰杀；译文应保留这种令人不安的神学张力。
- issue: כִּי זֶבַח לַיהוָה这一无动词分句的关系
  choice: 译作“耶和华在波斯拉有一场献祭”
  alternative: “在波斯拉有献给耶和华的祭牲”
  rationale: 希伯来文没有明写动词，לַיהוָה既可理解为耶和华拥有或安排这场献祭，也可理解为献祭是献给耶和华的；正文采用较符合上下文施行审判者角色的读法，并以脚注保留另一可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。排比结构保留诗歌节奏；“浸透脂油”避免生硬直译，同时不削弱祭祀和审判意象。
