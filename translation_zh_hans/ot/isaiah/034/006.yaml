revisions:
- from: 耶和华的刀沾满鲜血，浸透脂油，沾着羊羔和公山羊的血，沾着公绵羊肾上的脂油。因为耶和华在波斯拉有一场献祭[a]，在以东地有一场大屠杀。
  to: 耶和华的刀沾满了血，沾满了脂油；沾满羊羔和公山羊的血，也沾满公绵羊肾脏周围的脂油。因为耶和华在波斯拉有一场献祭[a]，在以东之地有一场大屠杀。
  rationale: 修订删除原文未明示的“鲜”，以“沾满了脂油”较自然地保留刀剑因脂油而肥润、沾染的意象；并借分号和“也”清楚呈现血与脂油的平行展开。将“肾上的脂油”调整为“肾脏周围的脂油”，更符合祭祀性解剖用语；“以东之地”则提升中文搭配的自然度。脚注保留原有且必要的句法歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:21:20Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体保留了刀剑、血、脂油、祭牲、肾脏脂油、波斯拉与以东的献祭性审判图景，也以脚注妥善保留了无动词分句的句法歧义。但“鲜血”中的“鲜”并非原文所明示；“浸透脂油”虽生动，却较弱地呈现了被动式“变得肥/肥润”的结果状态，并使后续血与脂油的并列来源关系不够清晰。
  naturalness: 原文中文基本庄重流畅，但“沾着……血，沾着……脂油”的重复略显口语且削弱诗歌式并列。“以东地”不如“以东之地”自然。
  terminology: “耶和华”“波斯拉”“以东”“献祭”“脂油”“公山羊”“公绵羊”均合适。“肾脏周围的脂油”比“肾上的脂油”更准确地表达献祭语境中的“肾脏的脂油”，同时避免误解为脂油附着于肾脏表面。
  issues:
