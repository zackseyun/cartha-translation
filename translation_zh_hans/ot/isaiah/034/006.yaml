    rationale: דָּם仅为“血”；本节的强烈画面无需以“鲜”强化，应避免无根据的限定。
  - severity: medium
    issue: “浸透脂油”未充分表达被动式“被弄肥／变得肥润”，且后面两个“沾着”使介词短语的并列结构不够明晰。
    rationale: הֻדַּשְׁנָה表示刀被脂油弄得肥润；随后“羊羔和公山羊的血”与“公绵羊肾脏的脂油”共同展开前面的血与脂油。改为“沾满了脂油……也沾满了……”可在自然中文中保留这一图景及并列关系。
  - severity: low
    issue: “以东地”搭配稍显生硬。
    rationale: “以东之地”是更自然且庄重的现代中文表达。
