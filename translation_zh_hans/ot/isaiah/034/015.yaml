base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/015.yaml
  text: There the arrow snake will nest and lay eggs[a], and hatch them, and gather them in her shadow; indeed, there the kites will gather[c][b], each with her mate.
translation:
  language: zh_hans
  text: 箭蛇[a]要在那里筑巢产卵，孵出幼雏，并在自己的荫下护育它们[b]；鸢也必聚集在那里[c]，各有伴侣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “箭蛇”所译的希伯来词含义不确定，也有人译作“猫头鹰”或另一种荒野动物。
    reason: alternative_reading
  - marker: b
    text: 或译：“并在自己的荫下伏窝孵育它们。”
    reason: lexical_alternative
  - marker: c
    text: “鸢”也可译作“秃鹫”，或泛指“猛禽”。
    reason: alternative_reading
lexical_decisions:
- source_word: קִפּוֹז
  choice: 箭蛇
  rationale: 此词仅见于此处，所指动物很不确定。上下文的筑巢、产卵和孵化容许爬行动物的理解；“箭蛇”保留其可能的迅疾意象，同时以脚注说明其他译法。
- source_word: קִנְּנָה
  choice: 要……筑巢
  rationale: 动词意为“筑巢”。在预告将临荒凉景象的语境中，用将来表达自然。
- source_word: וַתְּמַלֵּט
  choice: 产卵
  rationale: 该动词在此表示生出；结合筑巢及随后孵化的语境，译作“产卵”最符合图景。
- source_word: וּבָקְעָה
  choice: 孵出幼雏
  rationale: בקע本义为“裂开、破开”；用于卵时指孵化。译文补出自然隐含的结果“幼雏”，使现代汉语通顺。
- source_word: וְדָגְרָה
  choice: 护育它们
  rationale: 此词指伏窝、孵育或护雏。结合“在自己的荫下”，译作“护育”传达遮护幼雏的动作，同时在脚注保留“伏窝孵育”的可能。
- source_word: בְצִלָּהּ
  choice: 在自己的荫下
  rationale: 保留“荫、遮蔽”的具体意象，并用反身领属使现代汉语自然。
- source_word: אַךְ
  choice: 也必
  rationale: 此处为强调、确证语气；“必”表达景象确定会出现，“也”衔接同地聚集的另一类动物。
- source_word: דַיּוֹת
  choice: 鸢
  rationale: 通常理解为鸢类，也可能泛指猛禽或食腐鸟；正文采用较具体且常见的对应词，脚注保留不确定性。
- source_word: אִשָּׁה רְעוּתָהּ
  choice: 各有伴侣
  rationale: 字面为“一个雌性与它的同伴”，是成双相伴的表达。“各有伴侣”既自然，也不把“伴侣”过度限定为配偶。
