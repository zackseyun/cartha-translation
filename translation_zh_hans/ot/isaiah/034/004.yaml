source:
  edition: WLC
  text: וְ/נָמַ֨קּוּ֙ כָּל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נָגֹ֥לּוּ כַ/סֵּ֖פֶר הַ/שָּׁמָ֑יִם וְ/כָל צְבָאָ֣/ם יִבּ֔וֹל כִּ/נְבֹ֤ל עָלֶה֙ מִ/גֶּ֔פֶן וּ/כְ/נֹבֶ֖לֶת מִ/תְּאֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/004.yaml
  text: All the host of heaven will rot away[a], and the skies will be rolled up like a scroll; all their host will wither like a leaf withers from the vine[e][d][c][b], and like a withered fig from the fig tree.
translation:
  language: zh_hans
  text: 天上的万象都必朽坏[a]，诸天必像书卷一样卷起[b]；诸天的一切万象[c]都必凋残，像葡萄树上的叶子凋落[d]，又像无花果树上的果子凋落[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朽坏”也可译作“消融”或“衰败”。希伯来语动词可表示逐渐衰残、腐朽或消解。
    reason: lexical_alternative
  - marker: b
    text: “诸天”也可译作“天空”；原文的“书卷”指可卷起的古代卷轴。
    reason: cultural_note
  - marker: c
    text: 直译为“它们的一切军旅（或阵列）”，所指很可能是属于诸天的天体，尤其是众星。
    reason: lexical_alternative
  - marker: d
    text: 也可译作“像葡萄树上的叶子枯萎”，或“像叶子从葡萄树上落下”。原文意象可侧重枯萎，也可侧重凋落。
    reason: alternative_reading
  - marker: e
    text: 原文没有明说“果子”，可译作“又像从无花果树上凋落之物”；按上下文，所指很可能是枯萎或落下的无花果。
    reason: clarification
lexical_decisions:
- source_word: נָמַקּוּ
  choice: 必朽坏
  rationale: 该动词在此可表示衰败、腐朽或消融。“朽坏”保留先知诗歌中鲜明的败坏意象，同时不把宇宙审判的图景限定为单一物理过程。
- source_word: צְבָא הַשָּׁמַיִם
  choice: 天上的万象
  rationale: צָבָא本义可指军队或列阵的群体；在此指天上的整体阵列，尤其可能包括众星。“万象”在现代汉语中自然庄重，并保留其集合性而不过度具体化。
- source_word: וְנָגֹלּוּ כַסֵּפֶר הַשָּׁמָיִם
  choice: 诸天必像书卷一样卷起
  rationale: גלל表达卷起；סֵפֶר在古代语境中可指卷轴或文书。译作“像书卷一样卷起”，使动作与比喻清楚对应。
- source_word: וְכָל צְבָאָם
  choice: 诸天的一切万象
  rationale: 第三人称复数词尾最自然地回指“诸天”。重复“万象”既呈现原文与前句的呼应，也避免把所指明确限定为星辰。
- source_word: יִבּוֹל
  choice: 必凋残
  rationale: נבל常用于植物枯萎、衰残；“凋残”既适合后面的植物比喻，也能形容天上万象的衰败。
- source_word: כִּנְבֹל עָלֶה מִגֶּפֶן
  choice: 像葡萄树的叶子枯萎飘落
  rationale: 原文意象兼有枯萎及由此脱落的可能。“枯萎飘落”在汉语中自然地保留两层画面，不强行排除其中任何一层。
- source_word: וּכְנֹבֶלֶת מִתְּאֵנָה
  choice: 又像无花果树上凋落的果子
  rationale: 阴性形式与“无花果树”相配，语境所指很可能是枯萎或落下的无花果；汉语补出“果子”以使意象完整，并用“凋落”保留枯萎与掉落之间的张力。
theological_decisions:
- issue: 宇宙性审判图景的性质
  choice: 按其诗歌力度直译为天上万象朽坏、诸天卷起的宇宙性审判图景
  alternative: 将其纯粹解释为政权倾覆的隐喻，或限定为严格意义上的天体物理毁灭
  rationale: 原文以宏大的先知诗歌描写审判，但本节本身并未说明这些意象应当仅按政治隐喻理解，还是仅按物理事件理解。译文保留这种开放性与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万象”“诸天”“凋残”保留先知诗歌的宏阔感；句式依照原文三重推进：万象朽坏、诸天卷起、万象如叶与果凋落。
