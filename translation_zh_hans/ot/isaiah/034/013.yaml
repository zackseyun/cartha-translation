base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/013.yaml
  text: Thorns will grow over her palaces[a], nettles and brambles in her fortresses; and she will become a haunt of jackals[b], a pasture for ostriches.
translation:
  language: zh_hans
  text: 荆棘必长满她的宫殿；荨麻和刺草必长在她的堡垒中。她必成为豺狼[a]的住处，鸵鸟栖息的草地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “豺狼”是这里较可能的意思；较古老的译本有时译作“龙”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“鸵鸟的女儿们”，是指鸵鸟的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלְתָה
  choice: 必长满
  rationale: עלה在这里描写荒草从废墟中长起并覆盖建筑；“长满”自然地传达荒废后的蔓生景象。
- source_word: אַרְמְנֹתֶיהָ
  choice: 她的宫殿
  rationale: ארמון通常指宫殿或设防的高大居所；“宫殿”与下文“堡垒”形成合宜的平行。
- source_word: סִירִים
  choice: 荆棘
  rationale: 泛指带刺的野生植物；“荆棘”清楚、庄重，也符合荒凉意象。
- source_word: קִמּוֹשׂ
  choice: 蒺藜
  rationale: 指荒地中有害或扎人的野生植物，确切种类并不完全确定；“蒺藜”保留植物意象，并与其他刺草有所区别。
- source_word: וָחוֹחַ
  choice: 刺草
  rationale: 指有刺或扎人的植物；采用较宽泛的“刺草”，避免在物种不确定时过度具体化。
- source_word: בְּמִבְצָרֶיהָ
  choice: 遍布她的堡垒
  rationale: מבצר指堡垒、要塞或坚固之处；补出“遍布”承接前面的生长动词，使中文平行句自然。
- source_word: וְהָיְתָה
  choice: 她必成为
  rationale: 阴性单数承接被拟人化的以东之地；保留“她”可延续原文的拟人表达。
- source_word: נְוֵה
  choice: 住处
  rationale: 可指居所、栖息地或牧场；此处译作“住处”，适合野兽占据废墟的语境，又避免与后面的草地意象重复。
- source_word: תַנִּים
  choice: 豺狼
  rationale: 在先知书荒凉场景中通常指豺狼一类野兽；较旧的“龙”会给现代读者造成神话动物的误解。
- source_word: חָצִיר
  choice: 栖息的草地
  rationale: 该词通常指青草或草地；结合介词短语，译为“栖息的草地”呈现废墟变成野鸟活动之地的图景，同时不把它狭义化为放牧用的牧场。
- source_word: לִבְנוֹת יַעֲנָה
  choice: 鸵鸟
  rationale: 字面为“鸵鸟的女儿们”，是指鸵鸟的希伯来语表达；正文采用现代汉语的自然等值说法，字面形式收入脚注。
theological_decisions: []
