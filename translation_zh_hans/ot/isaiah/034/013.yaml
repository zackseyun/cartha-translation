  to: 荆棘必长满她的宫殿；荨麻和刺草必长在她的堡垒中。她必成为豺狼[a]的住处，鸵鸟栖息的草地[b]。
  rationale: 将“蒺藜”改为“荨麻”，以更贴近קִמּוֹשׂ的常见词义。调整前半节的标点和动词搭配，使两组建筑分别被植物侵占的平行关系在现代汉语中更清晰；其余措辞及两个脚注锚点均予以保留。
