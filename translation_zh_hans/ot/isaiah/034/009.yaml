  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נֶהֶפְכ֤וּ נְחָלֶ֨י/הָ֙ לְ/זֶ֔פֶת וַ/עֲפָרָ֖/הּ לְ/גָפְרִ֑ית וְ/הָיְתָ֣ה אַרְצָ֔/הּ לְ/זֶ֖פֶת בֹּעֵרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/009.yaml
  text: Her wadis will be turned into pitch[a], and her dust into sulfur[b]; her land will become burning pitch.
translation:
  language: zh_hans
  text: 她的溪谷[a]必变成沥青，她的尘土必变成硫磺[b]；她的土地必成为燃烧的沥青。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“溪流”或“河床”。希伯来词 נְחָלִים 可指溪谷、季节性水道、河床或急流。
    reason: lexical_alternative
  - marker: b
    text: “硫磺”也可译作“硫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶהֶפְכוּ
  choice: 必变成
  rationale: 该词为הפך的尼法勒完成式；在先知性宣告中表达将来必然发生的转变。“必变成”既保留被改变的结果，也传达宣告的确定性。
- source_word: נְחָלֶיהָ
  choice: 她的溪谷
  rationale: נחל可指季节性水道、溪谷、河床或急流。以东的干旱地理背景支持“溪谷”，且不使人误以为是常年有水的河流；其他可能译法收入脚注。
- source_word: זֶפֶת
  choice: 沥青
  rationale: זפת指沥青、天然地沥青一类可燃物。“沥青”是现代汉语中准确、通行且形象的对应词。
- source_word: עֲפָרָהּ
  choice: 她的尘土
  rationale: עפר可指尘土、干土或松散泥土。“尘土”保留荒凉、焦枯的意象，并与整片土地的变质相呼应。
- source_word: גָפְרִית
  choice: 硫磺
  rationale: גפרית指硫或硫磺。“硫磺”在现代汉语圣经语境中自然易懂，又能保留燃烧与审判的强烈意象。
- source_word: אַרְצָהּ
  choice: 她的土地
  rationale: ארץ在此指受审判之国的地域。“土地”比“国家”更贴合本节地貌和物质变化的描写。
- source_word: בֹּעֵרָה
  choice: 燃烧的
  rationale: 该词是阴性单数主动分词，修饰זפת。“燃烧的”直接保留持续呈现的描述性力量，不额外限定燃烧的时长或强度。
theological_decisions:
- issue: 受审判之地以阴性后缀拟人化
  choice: 全节用“她的”保留拟人表达
  alternative: 用“它的”或改写为“其中的”，把土地作无生命之物处理
  rationale: 希伯来文三次使用第三人称阴性单数后缀，把以东之地、民族或城邑拟人化。现代汉语中的“她”虽较显著，却能保存先知诗歌的文学张力，不把原文的拟人色彩抹平。
translation_notes:
  register: 采用现代、庄重而清楚的先知性语言。“必变成”传达预言宣告的确定性；分号保留前两项转变与末句总结性图景之间的结构。刻意保留“她的”以呈现希伯来文的阴性拟人化。
