  text: וְ/יָרְד֤וּ רְאֵמִים֙ עִמָּ֔/ם וּ/פָרִ֖ים עִם אַבִּירִ֑ים וְ/רִוְּתָ֤ה אַרְצָ/ם֙ מִ/דָּ֔ם וַ/עֲפָרָ֖/ם מֵ/חֵ֥לֶב יְדֻשָּֽׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/007.yaml
  text: Wild oxen will fall with them[a], and young bulls with the mighty ones; their land will be drenched with blood[b], and their dust made rich with fat.
translation:
  language: zh_hans
  text: 野牛必与他们一同倒下[a]，小公牛必与强者一同倒下[b]；他们的土地必被血浸透，他们的尘土必因脂油而肥沃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “野牛”所译的希伯来词所指物种不能确定，可能指某种强有力的野生牛科动物；也有译作“大羚羊”（oryx）。
    reason: lexical_alternative
  - marker: b
    text: “强者”既可指有力量的人，也可能指强壮的公牛；这里的诗歌意象可能兼有这两层含义。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: 必……倒下
  rationale: 该动词本义为“下去、降下”，在本节杀戮与审判的语境中可表达被击倒、倒毙；译作“倒下”既自然，又保留向下的意象。
- source_word: רְאֵמִים
  choice: 野牛
  rationale: 所指的确切动物种类不明，但应是强有力的野生牛科动物；“野牛”是现代汉语中稳妥而易懂的对应表达，并以脚注保留物种不确定性。
- source_word: עִמָּם
  choice: 与他们一同
  rationale: 保留希伯来文第三人称复数指代，不擅自明确其先行对象。
- source_word: וּפָרִים
  choice: 公牛犊
  rationale: פָּר常指公牛，往往带有年轻公牛的含义；“公牛犊”兼顾年龄色彩，并适合本段献祭与屠杀交织的意象。
- source_word: אַבִּירִים
  choice: 强壮者
  rationale: 该词可泛指有力量者，也可指强壮的牛，或借动物意象指权势人物；“强壮者”保留人和兽两方面的可能含义。
- source_word: וְרִוְּתָה
  choice: 必被……浸透
  rationale: 此词有“喝足、饱饮、浸透”之意；以土地为主语、血为介质时，“被血浸透”在现代汉语中自然且保留强烈画面。
- source_word: אַרְצָם
  choice: 他们的土地
  rationale: 指受审判者的地域；“土地”较“国家”更贴合随后血浸尘土的具体意象。
- source_word: מִדָּם
  choice: 被血
  rationale: 介词字面可作“从”，但与表示浸透的动词连用时，汉语自然表达为“被血浸透”。
- source_word: וַעֲפָרָם
  choice: 他们的尘土
  rationale: 直译“尘土”，保留希伯来诗歌的具体意象及其与死亡、审判相关的回响。
- source_word: מֵחֵלֶב
  choice: 因脂油
  rationale: 脂油来自被宰杀者；介词在这里表达使尘土肥沃的来源或原因，译作“因脂油”自然准确。
- source_word: יְדֻשָּׁן
  choice: 必……肥沃
  rationale: 该词意为变肥、丰厚；用于尘土时，“肥沃”既保留脂油使之变肥的双关式画面，也符合现代汉语。
theological_decisions:
- issue: 动物意象应按字面还是比喻理解
  choice: 正文保留野牛、公牛犊和强壮者等用语，使动物、献祭和强者倾覆的意象并存。
  alternative: 将所有动物词仅理解为实际献祭牲畜，或全部解释为统治者和勇士的隐喻。
  rationale: 以赛亚书34章把献祭和战场审判的图景交织在一起；希伯来文容许多层含义，翻译不应将这种张力压缩成单一解释。
- issue: אַבִּירִים的指称
  choice: 译作“强壮者”，不限定为人或牛。
  alternative: 译作“勇士”“权贵”或“壮牛”。
  rationale: 该词在诗句平行结构中可能兼具强壮牲畜与有权势之人的意味；采用较宽泛的表达以保存原文歧义。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。以“倒下、浸透、肥沃”呈现审判的强烈画面；通过重复“一同倒下”使首句结构清楚，并以脚注保存原文的词义和指称不确定性。
