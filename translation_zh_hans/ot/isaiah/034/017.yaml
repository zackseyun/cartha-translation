base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/017.yaml
  text: And he himself has cast the lot for them[a], and his hand has apportioned it to them by line; they will possess it forever[b]; from generation to generation they will dwell in it.
translation:
  language: zh_hans
  text: 他亲自为它们掣签；他的手用量绳[a]把那地分给它们。它们必永远占有[b]那地，世世代代住在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按测量线”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“承受那地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: 他亲自
  rationale: 独立人称代词带有强调意味；“亲自”自然地保留这一重音。
- source_word: הִפִּיל…גּוֹרָל
  choice: 抽签
  rationale: 这是表示以签分配的固定用语；现代汉语“抽签”清楚自然，同时保留分配土地的意象。
- source_word: לָהֶן
  choice: 为它们
  rationale: 代词回指上文所列的野兽和飞鸟；不在正文中补出原文没有明说的名词。
- source_word: וְיָדוֹ
  choice: 他的手
  rationale: 保留原文以“手”描写上帝亲自施行分配的拟人意象。
- source_word: חִלְּקַתָּה לָהֶם
  choice: 把那地分给它们
  rationale: חלק在此指划分、分配地域；阴性单数后缀依上下文指那片土地，译出“那地”可避免汉语指代含混。
- source_word: בַּקָּו
  choice: 按准绳
  rationale: קָו指丈量土地所用的线；“按准绳”简洁保留测量后划分的图景，具体器具义收入脚注。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 以自然现代汉语表达持续不止的占有。
- source_word: יִירָשׁוּהָ
  choice: 占有那地
  rationale: ירשׁ在土地分配语境中可指承受或取得并占有；正文选“占有”，另将“承受”列为脚注异译。
- source_word: לְדוֹר וָדוֹר
  choice: 世世代代
  rationale: 这是该分配性表达在现代汉语中自然且庄重的对应说法。
- source_word: יִשְׁכְּנוּ בָהּ
  choice: 住在那里
  rationale: שׁכן表示居住、栖居；“住在那里”清楚自然，并与前文“那地”衔接。
theological_decisions:
- issue: 分地意象中各代词的所指
  choice: 理解为上帝把荒废之地分给紧接上文提到的野兽和飞鸟。
  alternative: 也可较笼统地理解为把土地分给荒凉之地的居住者，而不明确所指为何。
  rationale: 以赛亚书34:11、13—15列出占据以东的荒野动物和飞鸟，最贴近本节的复数代词。译文仍保留“它们”，没有把解释性的动物名称加入正文。
- issue: 阴性复数与阳性复数代词的转换
  choice: 汉语统一译作“它们”，按集合性语境理解。
  alternative: 可在译文中分别补明不同类别的受分配者。
  rationale: 原文先用阴性复数、后用阳性复数，但上下文可将所列生物作为集合来指称；汉语代词不宜人为制造原文未明确说明的类别区别。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“抽签”“分给”“住在那里”保持自然，“他的手”“准绳”则保留原文的诗性和土地丈量意象。所有脚注标记均已置于正文相应词语之后。
