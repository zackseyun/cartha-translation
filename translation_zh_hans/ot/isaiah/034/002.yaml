revisions:
- from: 因为雅威向万国震怒，向他们所有的军旅[a]发烈怒；他已将他们列为当灭之物[b]，交给屠杀。
  to: 因为雅威向万国发怒，向他们所有的军队[a]发烈怒；他已定他们归于毁灭[b]，把他们交付杀戮。
  rationale: 修订仅处理中文搭配和术语表达。“发怒／发烈怒”保留קצף与חמה两个愤怒用词的并列和力度；“定他们归于毁灭”忠实表达חרם的审判性毁灭，不预设特定教派解释；脚注继续说明“禁毁”这一较技术性的替代译法。脚注标记均紧随所注词语。
