  text: כִּ֣י קֶ֤צֶף לַֽ/יהוָה֙ עַל כָּל הַ/גּוֹיִ֔ם וְ/חֵמָ֖ה עַל כָּל צְבָאָ֑/ם הֶחֱרִימָ֖/ם נְתָנָ֥/ם לַ/טָּֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/002.yaml
  text: For Yahweh has indignation against all the nations[a], and wrath against all their host; he has devoted them to destruction[b]; he has given them over to the slaughter.
translation:
  language: zh_hans
  text: 因为雅威向万国发怒，向他们所有的军队[a]发烈怒；他已定他们归于毁灭[b]，把他们交付杀戮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军队”也可译作“军旅”或“众军”。
    reason: lexical_alternative
  - marker: b
    text: 或译“把他们置于禁毁之下”；希伯来语动词表示在神的审判中将人或物定归毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明先知发出审判宣告的缘由；“因为”保留其解释性功能。
- source_word: קֶצֶף
  choice: 震怒
  rationale: 表达强烈而带审判意味的神圣愤怒，并与下文 חֵמָה 的“烈怒”有所区分。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现上帝的专名，不以称号替代。
- source_word: עַל כָּל הַגּוֹיִם
  choice: 向万国
  rationale: עַל 与愤怒用语连用，表示愤怒所针对的对象；“万国”自然概括所有列国。
- source_word: וְחֵמָה
  choice: 发烈怒
  rationale: חֵמָה 指炽烈的怒气；补出“发”使汉语谓语结构自然，同时不削弱原文力度。
- source_word: עַל כָּל צְבָאָם
  choice: 向他们所有的军旅
  rationale: צָבָא 可指军队、军旅或集合成阵的众军；“军旅”保留军事色彩，又不局限于现代建制军队。
- source_word: הֶחֱרִימָם
  choice: 他已将他们列为当灭之物
  rationale: חרם 的使役式不只是一般意义的毁灭，也有在神圣审判中划归毁灭的含义；此译法保留这一特殊的审判语义。
- source_word: נְתָנָם
  choice: 交给
  rationale: 在此表示把他们交付于某种结局；“交给”简洁地体现司法性的交付。
- source_word: לַטָּבַח
  choice: 屠杀
  rationale: טֶבַח 是屠宰、杀戮之意；与“交给”连用，保留原文鲜明而严厉的审判图像。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，译作“雅威”可直接保留其作为专名的性质，而不以称号取代。
- issue: הֶחֱרִימָם 所表达的毁灭性质
  choice: 将他们列为当灭之物
  alternative: 将他们彻底毁灭；使他们处于禁毁之下
  rationale: 该动词可表示把对象划归神圣审判下的毁灭。正文保留“当灭”的特殊含义，脚注则说明这一表达，避免将其简化为普通的杀灭，也不额外规定具体仪式或制度背景。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“震怒／烈怒”保留两个相邻怒气词的差异；“列为当灭之物”略带经文语体，但借助脚注可准确传达 חרם 的特殊审判含义。所有脚注标记均置于其所说明的词语之后。
