  text: כִּֽי אִם שִׂ֤ישׂוּ וְ/גִ֨ילוּ֙ עֲדֵי עַ֔ד אֲשֶׁ֖ר אֲנִ֣י בוֹרֵ֑א כִּי֩ הִנְ/נִ֨י בוֹרֵ֧א אֶת יְרוּשָׁלִַ֛ם גִּילָ֖ה וְ/עַמָּ֥/הּ מָשֽׂוֹשׂ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/018.yaml
  text: But be glad and rejoice forever in what I am creating; for behold[a], I am creating Jerusalem as rejoicing, and her people as joy.
translation:
  language: zh_hans
  text: 你们却要因我所创造的永远欢喜快乐；看哪[a]，我创造耶路撒冷，使她成为喜乐，使她的百姓成为欢欣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，我为使人欢喜而创造耶路撒冷，为使人快乐而创造她的百姓。”
    reason: 原文的两个喜乐名词既可理解为结果性表语，也可理解为目的或效果。
lexical_decisions:
- source_word: כִּי אִם
  choice: 倒要
  rationale: 承接17节“不再被记念”的否定并形成鲜明转折；“倒要”自然表达希伯来语的纠正性、对比性语气。
- source_word: שִׂישׂוּ וְגִילוּ
  choice: 欢喜快乐
  rationale: 用两个近义动词对应原文成对的喜乐动词，保留诗歌的加强效果，同时符合现代汉语习惯。
- source_word: עֲדֵי עַד
  choice: 永远
  rationale: 简洁、自然地表达持续无尽的时间。
- source_word: אֲשֶׁר אֲנִי בוֹרֵא
  choice: 因我所创造的
  rationale: 关系从句所指可理解为喜乐的对象或缘由；汉语“因……欢喜快乐”自然顺畅，又不把所创造的内容过度具体化。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留先知宣告中引人注意并加强语气的庄重表达。
- source_word: בוֹרֵא
  choice: 我创造
  rationale: 希伯来语分词在先知话语中可表达正在进行或即将实现的行动；汉语无须强加明确时态，“我创造”保持这种开放性。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经和通行用法中的标准地名译法。
- source_word: גִּילָה
  choice: 喜乐
  rationale: 名词表示欢欣、喜悦，并与本节前面的גילוּ形成词根呼应；“喜乐”适合用作结果性表语。
- source_word: וְעַמָּהּ
  choice: 使她的百姓
  rationale: 阴性单数后缀回指耶路撒冷；“她”保留城市的拟人化，补出第二个“使”则使汉语平行结构清楚。
- source_word: מָשׂוֹשׂ
  choice: 欢欣
  rationale: 以名词性表达对应原文的喜乐名词，并与“喜乐”形成近义平行而不完全重复。
theological_decisions:
- issue: ברא之后的גִּילָה和מָשׂוֹשׂ应作结果性表语还是目的性成分
  choice: 使耶路撒冷成为喜乐，使她的百姓成为欢欣
  alternative: 创造耶路撒冷，使人欢喜；创造她的百姓，使人快乐
  rationale: 原文可表示把耶路撒冷及其百姓造成喜乐、欢欣的化身或源头，也可表示创造他们是为了使人欢喜。正文保留较直接的结果性、表语性图景，脚注列出自然的目的性理解，不以译文消除原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的郑重语体；全句尽量维持希伯来诗歌中“创造—喜乐”以及“耶路撒冷—她的百姓”的平行结构。
