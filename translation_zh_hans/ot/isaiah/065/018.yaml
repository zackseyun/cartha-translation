  terminology: ‘耶路撒冷’、‘喜乐’、‘欢欣’均恰当；‘她的百姓’正确保留了指向耶路撒冷的阴性后缀及其拟人化。脚注应以更精确的中文反映目的性／效果性替代理解，而不把未明说的受益者泛化为‘人’。
