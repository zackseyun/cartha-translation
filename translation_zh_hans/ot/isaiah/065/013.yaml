id: ISA.65.13
reference: Isaiah 65:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה עֲבָדַ֤/י יֹאכֵ֨לוּ֙ וְ/אַתֶּ֣ם תִּרְעָ֔בוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׁתּ֖וּ וְ/אַתֶּ֣ם תִּצְמָ֑אוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׂמָ֖חוּ וְ/אַתֶּ֥ם תֵּבֹֽשׁוּ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/013.yaml
  text: 'Therefore this is what the Lord GOD says: Look[a], my servants will eat, but you will be hungry; look, my servants will drink, but you will be thirsty; look, my servants will rejoice[b], but you will be put to shame.'
translation:
  language: zh_hans
  text: 所以，主耶和华这样说：“看哪，我的仆人[a]必吃，你们却要挨饿；看哪，我的仆人必喝，你们却要口渴；看哪，我的仆人必欢喜，你们却要蒙羞[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”所译的希伯来词也可指“奴仆”或“奴隶”；这里着重指属于神、事奉神的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“羞愧”。希伯来语既可指感到羞愧，也可指受辱、蒙羞。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的指控，引出随之而来的审判与福分之对比；“所以”自然保留了推论关系。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 保留先知传信公式的庄重与固定表达，同时符合现代汉语习惯。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现表示主权的称号 אֲדֹנָי 和神的专名 יְהוִה，避免把二者合并或遗漏。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留三次重复的引人注意和强调作用，也维持先知宣告的庄重语体。
- source_word: עֲבָדַי
  choice: 我的仆人
  rationale: עֶבֶד 可指奴隶或仆人；本处着重指属于神并事奉他的人，“仆人”最符合语境，同时以脚注保留词义范围。
- source_word: יֹאכֵלוּ
  choice: 必吃
  rationale: 直接表达未完成式在预告中的将来含义，并与“挨饿”形成鲜明对照。
- source_word: תִּרְעָבוּ
  choice: 要挨饿
  rationale: 该动词表示饥饿或受饥饿之苦；“挨饿”自然体现审判处境。
- source_word: יִשְׁתּוּ
  choice: 必喝
  rationale: 与“必吃”保持简洁、整齐的平行结构。
- source_word: תִּצְמָאוּ
  choice: 要口渴
  rationale: 直接、自然地表达“干渴”，并与“必喝”构成具体对比。
- source_word: יִשְׂמָחוּ
  choice: 必欢喜
  rationale: 表达喜乐状态与表现，兼顾现代可懂性和先知文体的庄重。
- source_word: תֵּבֹשׁוּ
  choice: 要蒙羞
  rationale: בוש 既可指内心羞愧，也可指落入受辱、蒙羞的境地；审判语境支持“蒙羞”，脚注保留另一可能。
- source_word: וְאַתֶּם
  choice: 你们却
  rationale: 连接词字面可作“而你们”，但三组平行句明显表达反差；“却”准确而自然地呈现其转折功能。
theological_decisions:
- issue: 复合称谓 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时含有“主”的称号与四字神名。采用现代中文读者熟悉的“主耶和华”，既不省略神名，也保留称号与专名的组合；不借此处理经文本身未展开的神名读音争议。
- issue: תֵּבֹשׁוּ 所表达的是内心羞愧还是公开受辱
  choice: 蒙羞
  alternative: 羞愧
  rationale: 本节宣告神的仆人与受审判者结局相反，“蒙羞”较能体现审判所造成的羞辱处境；但希伯来词也容许内心“羞愧”的理解，因此用脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。保留三次“看哪”和三组“我的仆人……你们却……”的平行反差，以呈现原文的节奏和强调；“必”与“要”区分两方结局，同时避免加入原文没有明说的解释。
