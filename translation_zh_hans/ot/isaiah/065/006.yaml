  text: הִנֵּ֥ה כְתוּבָ֖ה לְ/פָנָ֑/י לֹ֤א אֶחֱשֶׂה֙ כִּ֣י אִם שִׁלַּ֔מְתִּי וְ/שִׁלַּמְתִּ֖י עַל חֵיקָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/006.yaml
  text: 'Look[a], it is written before me: I will not keep silent, but I will repay; indeed[b], I will repay into their lap.'
translation:
  language: zh_hans
  text: '看哪，这已写在我面前：[a]


    我必不静默，反要报应；


    我必报应在他们怀中。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这记录在我面前。”原文描写一项已经写下、摆在说话者面前的记录。
    reason: lexical_alternative
  - marker: b
    text: “怀中”也可译作“衣襟中”。原文的图像是把报偿直接归还到本人承接东西的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 用庄重而通行的提示语引出宣告，保留原文唤起注意的指示作用。
- source_word: כְתוּבָה לְפָנָי
  choice: 这事已写在我面前
  rationale: 保留被动分词所表达的既已写下、现仍摆在上帝面前的记录意象；补出“这事”使现代汉语句意完整，却不具体限定所记录的内容。
- source_word: לֹא אֶחֱשֶׂה
  choice: 我必不静默
  rationale: “静默”准确表达不出声、不采取公开回应的语义，也符合庄重的审判宣告语体。
- source_word: כִּי אִם
  choice: 必要
  rationale: 在否定句之后引出肯定的相反行动；“必不……，必要……”自然体现转折和坚定决意。
- source_word: שִׁלַּמְתִּי
  choice: 我必报应
  rationale: 该完成式在先知性宣告中可表达确定将发生的行动；“报应”保留按行为偿还的司法性含义，不额外限定具体刑罚。
- source_word: וְשִׁלַּמְתִּי
  choice: 我必把报应归到
  rationale: 保留动词的重复及其加强确定性的作用，同时与后面的身体意象组成自然汉语。
- source_word: עַל חֵיקָם
  choice: 他们怀中
  rationale: “怀中”保留 חֵיק 所指胸怀或衣襟形成的承接处，也传达报偿直接回到本人身上的图像。
theological_decisions:
- issue: שִׁלַּמְתִּי / וְשִׁלַּמְתִּי 两个完成式的时态和体貌
  choice: 按确定的将来行动译为“我必报应……我必把报应归到”
  alternative: 按过去或完成意义译为“我已经报应”
  rationale: 上下文是上帝宣告将施行的报偿；先知性言语可用完成式强调行动已经确定。译作“必”既表达将来，也保留其确定性。
- issue: 报偿的性质
  choice: 译作“报应”，不说明具体惩罚形式
  alternative: 译作“惩罚”或“报仇”
  rationale: שׁלם 在这里强调按所行偿还。“报应”能体现司法性的对应关系，又避免把原文收窄为某一种刑罚或私人复仇。
- issue: “归到他们怀中”的意象
  choice: 保留身体与衣襟承接报偿的比喻
  alternative: 意译为“直接报应在他们身上”
  rationale: 直译保留希伯来语鲜明的审判图像，同时脚注说明其含义，避免正文过度解释。
translation_notes:
  register: 采用现代、庄重、便于朗读的标准普通话。“看哪”“静默”保持先知宣告的肃穆感；两次“我必”再现原文重复所加强的确定性。诗行按宣告的三个意群排列。
