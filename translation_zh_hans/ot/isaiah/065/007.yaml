base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/007.yaml
  text: your iniquities and the iniquities of your fathers together[a], says Yahweh, because they burned incense on the mountains and reproached me on the hills[b]; so I will measure their former deed into their lap.
translation:
  language: zh_hans
  text: 耶和华说：“你们的罪孽和你们祖先的罪孽，我必一同量在他们怀中；因为他们在山上烧香，在冈陵上辱骂我；我必先把他们所行的[a]量在他们怀中[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所行的”也可译作“所得的报偿”；希伯来词既可指行为或工作，也可指相应的报酬。这里“量在他们怀中”的表达本身已含有报应之意。“先”也可理解为“先前的”，修饰“所行的”。
    reason: lexical_alternative
  - marker: b
    text: 直译“量在他们怀中”。“怀中”也可译作“胸怀”或“衣襟”。这是希伯来语的表达方式，表示报应直接而切身地归到他们本人。
    reason: cultural_note
lexical_decisions:
- source_word: עֲוֺנֹתֵיכֶם וַעֲוֺנֹת אֲבוֹתֵיכֶם יַחְדָּו
  choice: 你们的罪孽和你们祖先的罪孽，要一并追讨
  rationale: “罪孽”兼顾行为的邪恶与应负的罪责；“祖先”在现代汉语中比“父辈”更自然地涵盖历代先人。“一并”保留יַחְדָּו所强调的共同追究。因本节开头承接上一节“报应”的语意，补出“追讨”使独立经节在汉语中完整，同时不消除当代人与祖先罪孽并列所形成的张力。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，保留其专名性质，而不以“主”这一称号替代。
- source_word: קִטְּרוּ
  choice: 烧香
  rationale: 该动词在祭祀语境中指焚烧香料；“烧香”简明自然，并保留原文所述的具体行为。
- source_word: עַל הֶהָרִים וְעַל הַגְּבָעוֹת
  choice: 在山上……在冈陵上
  rationale: 分别译出“山”和“冈陵”，维持原文平行结构，不概括成带有额外解释色彩的“邱坛”。
- source_word: חֵרְפוּנִי
  choice: 羞辱我
  rationale: חרף可指辱骂、藐视或使人蒙羞；“羞辱”在此庄重自然，又不把具体方式说得过死。
- source_word: וּמַדֹּתִי
  choice: 所以，我要……量回
  rationale: 保留מדד“量、量出”的审判意象；“所以”表达前述行为与报应之间的结果关系，“回”体现按其所行归还给他们。
- source_word: פְעֻלָּתָם רִאשֹׁנָה
  choice: 他们先前所做的
  rationale: פְעֻלָּה既可指行为、工作，也可指报偿；正文采用“所做的”，让“量回”本身承担报应含义。“先前”把רִאשֹׁנָה理解为修饰他们以往的行为。
- source_word: עַל חֵיקָם
  choice: 到他们怀中
  rationale: 保留“怀中”这一身体意象；在希伯来习语中，它表示报应直接、切身地归到本人身上。
theological_decisions:
- issue: 当代人的罪与祖先罪孽一并受审
  choice: 正文并列“你们的罪孽”和“你们祖先的罪孽”，并以“一并追讨”表达共同受审。
  alternative: 把本节解释为后代无论是否参与祖先的罪，都单纯替祖先受罚。
  rationale: 原文明说受话者自己也有“罪孽”，并把他们与祖先的罪孽并列。译文保留跨世代审判的张力，但不在本节内加入系统性的化解。
- issue: פְעֻלָּתָם在审判语境中的含义
  choice: 译作“他们先前所做的”。
  alternative: 译作“他们的报偿”或“他们的工价”。
  rationale: 该词可表示行为，也可表示所得的报偿。由于“量回到怀中”已经清楚表达报应，正文采用“所做的”可避免把歧义过早限定；脚注列出另一可能。
- issue: רִאשֹׁנָה的句法归属
  choice: 理解为“先前所做的”，即修饰以往的行为。
  alternative: 理解为“我必先……”，即修饰“量回”的次序。
  rationale: 词序容许讨论，但结合所提供的校审层与上下文，正文采用“先前的行为”；不将另一句法可能写入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“冈陵”略带经文语体，但仍易于理解，并与“山”形成平行。“量回到他们怀中”刻意保留原文不寻常的计量与怀中意象，避免改写成纯解释性的“报应他们”。
