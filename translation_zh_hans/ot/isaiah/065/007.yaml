  source_fidelity: 草稿将承接上文的审判含义明确为“要一并追讨”，虽可由65:6补足，但这在本节正文中加入了原文未明说的动词。更重要的是，רִאשֹׁנָה较自然地作副词修饰“我要量”，即“我必先量/先行量定”，不宜直接定为“先前所做的”。应保留该词的句法歧义，以脚注说明另一种理解。
  naturalness: “他们曾在山上烧香，在冈陵上羞辱我”通顺且庄重。“量回到他们怀中”保留意象，但“量回”与原文的“先”及动词的直接宾语关系处理不够准确。改为“先把他们所行的量在他们怀中”较贴近原文，也保持经文语体。
  terminology: “罪孽”“耶和华”“烧香”“冈陵”“辱骂/羞辱”“怀中”均合适。为贴近חרף所含的辱骂、嘲弄意味，采用“辱骂我”。“祖先”是现代汉语自然的概括译法。
