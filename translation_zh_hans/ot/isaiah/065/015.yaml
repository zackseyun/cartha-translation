id: ISA.65.15
reference: Isaiah 65:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִנַּחְתֶּ֨ם שִׁמְ/כֶ֤ם לִ/שְׁבוּעָה֙ לִ/בְחִירַ֔/י וֶ/הֱמִיתְ/ךָ֖ אֲדֹנָ֣/י יְהוִ֑ה וְ/לַ/עֲבָדָ֥י/ו יִקְרָ֖א שֵׁ֥ם אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/015.yaml
  text: You will leave your name as a curse for my chosen ones[a], and the Lord Yahweh will put you to death[b]; but to his servants he will call another name.
translation:
  language: zh_hans
  text: 你们必留下自己的名，供我的选民用来赌咒[a]；主耶和华必杀死你们，却要给自己的仆人另起一个名字[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作为誓言”。这里可能指人起誓或赌咒时，用他们的名字构成咒诅的话。
    reason: 保留שְׁבוּעָה通常所含“誓言”之义，并说明本节审判语境中的咒诅公式含义。
  - marker: b
    text: 直译“他要称呼另一个名字”。
    reason: 说明יִקְרָא שֵׁם אַחֵר较字面的措辞；正文按自然汉语表达其命名意义。
lexical_decisions:
- source_word: וְהִנַּחְתֶּם שִׁמְכֶם
  choice: 你们必留下自己的名
  rationale: הניח的使役形在这里以“名”为宾语，表示把名字留下，成为后来使用的称谓或名声。中文“留下自己的名”自然，并保留原文意象。
- source_word: לִשְׁבוּעָה
  choice: 作咒语
  rationale: שְׁבוּעָה通常可指“誓言”，但在审判语境中可指起誓时采用的咒诅套语，即用受审判者的名字作为反面例证。正文译出语境中的实际功能，脚注保留较直译的可能。
- source_word: לִבְחִירַי
  choice: 给我的选民
  rationale: 保留第一人称所属关系和复数群体含义；“选民”是现代中文中自然、庄重的集合称呼。
- source_word: וֶהֱמִיתְךָ
  choice: 必使你们死亡
  rationale: מות的使役形表示使之死去。希伯来文此处由前面的复数称呼转为单数后缀，可将受话群体视作整体；中文沿用“你们”，避免造成无根据的对象转换，同时保留神施行审判的因果含义。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别呈现 אֲדֹנָי 的“主”和四字神名 יהוה 的传统中文形式“耶和华”，避免把两个称号压缩为一个。
- source_word: וְלַעֲבָדָיו
  choice: 却……他的仆人
  rationale: וְ在上下文中带出与受审判者命运相反的结果，故译为“却”；עֲבָדָיו在此强调归属和事奉，译“他的仆人”比“奴隶”更符合语境。
- source_word: יִקְרָא שֵׁם אַחֵר
  choice: 要以另一个名字称呼
  rationale: 保留קרא“称呼”和שֵׁם אַחֵר“另一个名字”的基本表达，同时调整为自然中文语序；脚注列出意译“另起一个名字”。
theological_decisions:
- issue: 神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时含有“主”和神的专名。正文将两者都明确译出，不把专名泛化为普通称号，也不在本节中加入原文没有的解释。
- issue: “另一个名字”的施予对象及含义
  choice: 主以另一个名字称呼他的仆人
  alternative: 主给他的仆人另起一个名字
  rationale: 原文语法以主为隐含主语，以“他的仆人”为接受称呼者。正文较形式对应地保留“称呼”，不进一步判定这个新名字的具体内容或神学身份；脚注提供自然意译。
- issue: 单复数称呼的转换
  choice: 中文统一用复数“你们”
  alternative: 主耶和华必使你死亡
  rationale: 原文前半以复数称呼该群体，וֶהֱמִיתְךָ则采用阳性单数后缀。这里可作集合性单数理解；中文统一复数能清楚保持同一受话对象，而不把单数解释为另一个人。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“咒语”在此不是指施行法术，而是指带咒诅内容的固定话语，脚注对此加以限定。分号区分受审判者留下恶名与神仆人得到新名的对照；“却”明确呈现原文语境中的转折。
