source:
  edition: WLC
  text: אֲשֶׁ֨ר הַ/מִּתְבָּרֵ֜ךְ בָּ/אָ֗רֶץ יִתְבָּרֵךְ֙ בֵּ/אלֹהֵ֣י אָמֵ֔ן וְ/הַ/נִּשְׁבָּ֣ע בָּ/אָ֔רֶץ יִשָּׁבַ֖ע בֵּ/אלֹהֵ֣י אָמֵ֑ן כִּ֣י נִשְׁכְּח֗וּ הַ/צָּרוֹת֙ הָ/רִ֣אשֹׁנ֔וֹת וְ/כִ֥י נִסְתְּר֖וּ מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/016.yaml
  text: whoever blesses himself in the land will bless himself by the God of truth[a], and whoever swears in the land will swear by the God of truth; because the former troubles are forgotten[c][b], and because they are hidden from my eyes.
translation:
  language: zh_hans
  text: 凡在这地为自己祝福的，必凭真实的上帝祝福自己[a]；凡在这地[b]起誓的，必凭真实的上帝起誓[c]。因为从前的患难已经被忘记，也已经从我眼前隐藏起来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为自己祝福”也可译作“为自己求福”或“宣称自己有福”。希伯来语动词是反身形式。
    reason: lexical_alternative
  - marker: b
    text: “这地”也可译作“地上”或“全地”。希伯来语 אֶרֶץ 可指一片土地，也可指大地、世界。
    reason: lexical_alternative
  - marker: c
    text: “真实的上帝”也可译作“信实的上帝”；较直译为“阿们的上帝”。希伯来语 אָמֵן 含有坚定、可靠、信实和真实之意。
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּתְבָּרֵךְ / יִתְבָּרֵךְ
  choice: 为自己求福／必……求福
  rationale: Hitpael词形具有反身意义。“为自己求福”在现代汉语中自然，也保留了主体为自己援引福分的含义；另一种可能“宣称自己有福”列入脚注。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: אֶרֶץ按语境可指特定之地，也可指全地、世界。“这地”保留定冠词和当前群体语境，同时用脚注说明较广的理解。
- source_word: בֵּאלֹהֵי אָמֵן
  choice: 凭真实的上帝
  rationale: אָמֵן在此作上帝的称号或描述，涵盖坚定、可信、信实和真实。“真实的上帝”清楚庄重，并在脚注保留“信实的上帝”及较直译的“阿们的上帝”。
- source_word: הַנִּשְׁבָּע / יִשָּׁבַע
  choice: 起誓／必……起誓
  rationale: שׁבע的Niphal在此表示起誓；“起誓”是现代汉语中准确而庄重的表达。
- source_word: הַצָּרוֹת הָרִאשֹׁנוֹת
  choice: 从前的患难
  rationale: צָרוֹת表示困苦、患难；“从前的患难”简明地表达先前的灾困。
- source_word: נִשְׁכְּחוּ / נִסְתְּרוּ
  choice: 已经被忘记／已经……隐藏
  rationale: 两个完成式表示已经形成的状态；以“已经”传达完成性，并保留原文的被动表达。
- source_word: מֵעֵינָי
  choice: 从我眼前
  rationale: 保留原文拟人化的“从我眼中／眼前”意象，不把它解释成抽象的赦免或消除。
theological_decisions:
- issue: בֵּאלֹהֵי אָמֵן的译法
  choice: 真实的上帝
  alternative: 信实的上帝；阿们的上帝
  rationale: אָמֵן作为罕见的神圣称号，同时带有真实、可靠和信实的意味。正文采用自然清楚的“真实的上帝”，脚注保留其他可能，避免把其神学内涵限定为单一属性。
- issue: בָּאָרֶץ的范围
  choice: 在这地
  alternative: 在地上／在全地
  rationale: 该词既可指特定土地，也可指更广阔的大地；上下文容许群体性的土地语境和更新创造的广义语境。正文采取较克制的译法，脚注保留广义理解。
- issue: נִסְתְּרוּ מֵעֵינָי的神学张力
  choice: 从我眼前隐藏了
  alternative: 不再被我看见
  rationale: 直译保留上帝说话时的拟人表达，不擅自将其具体解释为遗忘、赦免或彻底消灭。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。平行分句重复“凡……必……”，保留希伯来诗性结构；避免古奥的“指着”而用“凭”，同时维持起誓和求福所援引之对象的关系。
