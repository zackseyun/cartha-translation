revisions:
- from: 那里不再有只活几天的婴孩[a]，也不再有未享尽天年的老人；因为年轻人到一百岁才死[b]，犯罪的人即使活到一百岁，也必受咒诅[c]。
  to: 那里不再有只活几天的婴孩[a]，也不再有未享尽天年的老人；因为百岁的年轻人将死去[b]，百岁的罪人必受咒诅[c]。
  rationale: 修订删除原文未明示的“即使”让步关系，改用“百岁的罪人”直接对应年龄短语与泛指的“罪人”。同时将有关百岁死亡的正文调整为贴近希伯来文表层结构的表达，并保留原有脚注所列、较符合语境的解释性理解。脚注a区分字面构词与习语解释。
