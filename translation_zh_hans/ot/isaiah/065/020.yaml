source:
  edition: WLC
  text: לֹא יִֽהְיֶ֨ה מִ/שָּׁ֜ם ע֗וֹד ע֤וּל יָמִים֙ וְ/זָקֵ֔ן אֲשֶׁ֥ר לֹֽא יְמַלֵּ֖א אֶת יָמָ֑י/ו כִּ֣י הַ/נַּ֗עַר בֶּן מֵאָ֤ה שָׁנָה֙ יָמ֔וּת וְ/הַ֣/חוֹטֶ֔א בֶּן מֵאָ֥ה שָׁנָ֖ה יְקֻלָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/020.yaml
  text: No more shall there be from there an infant of days[a], or an old man who does not fill out his days; for the youth will die a hundred years old[c][b], and the sinner a hundred years old will be accursed.
translation:
  language: zh_hans
  text: 那里不再有只活几天的婴孩[a]，也不再有未享尽天年的老人；因为百岁的年轻人将死去[b]，百岁的罪人必受咒诅[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“日子的婴孩”，指年日极少的婴孩。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为：“死时一百岁的人仍算年轻。”
    reason: syntactic_alternative
  - marker: c
    text: “受咒诅”也可译作“被咒诅”；原文强调此人处在咒诅之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: 那里
  rationale: מִן虽带有“从”的形式，但在存在句中自然表示“在那里、其中”；译作“那里”既符合上下文所指之地，也避免生硬的“从那里有”。
- source_word: עוּל יָמִים
  choice: 只活几天的婴孩
  rationale: 该短语直译为“日子很少的婴孩”，是指生命短促的婴孩。正文采用现代汉语中清楚自然的表达，并在脚注保留希伯来语的字面形象。
- source_word: זָקֵן אֲשֶׁר לֹא יְמַלֵּא אֶת יָמָיו
  choice: 未享尽天年的老人
  rationale: מלא את ימיו字面为“满他的日子”，意指活满所当有的寿数。“享尽天年”在现代汉语中庄重、易懂，也保留寿数圆满的含义。
- source_word: הַנַּעַר
  choice: 年轻人
  rationale: נַעַר可指男孩、少年或青年；此处与百岁高龄形成反差。“年轻人”不过度限定具体年龄阶段，也符合现代汉语。
- source_word: בֶּן מֵאָה שָׁנָה יָמוּת
  choice: 到一百岁才死
  rationale: בֶּן־מֵאָה שָׁנָה是标准的年龄表达，יָמוּת明确指死亡。加入“到……才”自然传达本节所描述的异常长寿，同时不消除死亡仍然存在的张力。
- source_word: הַחוֹטֵא
  choice: 犯罪的人
  rationale: 该名词化分词指行罪或以犯罪为特征的人。“犯罪的人”比“罪人”稍具动作感，同时保持道德含义。
- source_word: יְקֻלָּל
  choice: 必受咒诅
  rationale: Pual形态表示成为咒诅的承受者。“受咒诅”保留其强烈的审判意味；“必”在预言语境中自然表达未完成式的确定将来含义。
theological_decisions:
- issue: 新创造预言中仍提到死亡和咒诅所形成的神学张力
  choice: 按希伯来文直译其核心陈述：年轻人到百岁才死，犯罪者到百岁仍受咒诅。
  alternative: 把“死”解释为非实际死亡，或改写措辞以消除与其他末世经文之间的表面张力。
  rationale: 原文明说“死”和“受咒诅”。译文不借助后来的神学体系替经文消解张力，只呈现超常长寿与罪仍受审判这两项陈述。
- issue: “年轻人到一百岁才死”的句法理解
  choice: 以“年轻人”为主语，按原文语序表达其到百岁才死。
  alternative: 理解为“死时一百岁的人仍算年轻”。
  rationale: 两种理解意义接近，但原文语法表面以הַנַּעַר“年轻人”为主语。正文保留这一结构，脚注列出常见的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“享尽天年”保留希伯来语“满他的日子”的寿数意象；分号呈现前后解释关系。正文没有用隐喻化措辞淡化“死”或“咒诅”，并用脚注保留关键的字面形式与句法异读。
