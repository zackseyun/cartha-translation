  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֧ה עֲבָדַ֛/י יָרֹ֖נּוּ מִ/טּ֣וּב לֵ֑ב וְ/אַתֶּ֤ם תִּצְעֲקוּ֙ מִ/כְּאֵ֣ב לֵ֔ב וּ/מִ/שֵּׁ֥בֶר ר֖וּחַ תְּיֵלִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/014.yaml
  text: Look[a], my servants will sing for gladness of heart, but you will cry out from pain of heart[d][c][b], and from a broken spirit you will wail.
translation:
  language: zh_hans
  text: 看哪，我的仆人必因心中欢喜而欢唱[a]；你们却必因心中痛苦而呼喊，又因心灵破碎而哀号[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢唱”也可译作“欢呼”。
    reason: lexical_alternative
  - marker: b
    text: “哀号”也可译作“号啕”。原词表示大声悲号。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意并加强语气的提示词。“看哪”既保留其指示和强调作用，也符合庄重的现代汉语表达。
- source_word: עֲבָדַי
  choice: 我的仆人
  rationale: עֶבֶד 可指奴仆或仆人；本节着重于他们属于并事奉上帝的身份，因此译作“仆人”，不额外突出受奴役的社会身份。
- source_word: יָרֹנּוּ
  choice: 欢唱
  rationale: רנן 在此表示因喜乐而发出的歌声或欢呼。“欢唱”简洁地表达庆贺之意，又与后文痛苦的呼喊形成鲜明对照。
- source_word: מִטּוּב לֵב
  choice: 因心中欢喜
  rationale: 字面结构为“出于心的美好/福乐”；这里的 טוּב לֵב 是内心安乐、喜悦的表达，并非强调道德上的良善。译文也体现介词 מִן 的原因含义。
- source_word: תִּצְעֲקוּ
  choice: 呼喊
  rationale: צעק 指大声呼叫，在本语境中是因痛苦而发出的喊声。“呼喊”保留了声音的强度。
- source_word: מִכְּאֵב לֵב
  choice: 因心中痛苦
  rationale: כאב 可表示疼痛、伤痛或忧苦；此译保留“心”的意象，并与前句“心中欢喜”构成平行对比。
- source_word: מִשֵּׁבֶר רוּחַ
  choice: 因心灵破碎
  rationale: שֵׁבֶר רוּחַ 描绘人的内在生命被击碎或压垮。“心灵破碎”保留原文隐喻，且是自然的现代汉语。
- source_word: תְּיֵלִילוּ
  choice: 哀号
  rationale: ילל 表示响亮而悲痛的号哭。“哀号”兼顾悲恸和声音强烈的特点。
theological_decisions:
- issue: “我的仆人”与“你们”的身份对比
  choice: 保留经文本身的群体对照：上帝的仆人欢喜，受话的“你们”却遭受痛苦；不在本节译文中进一步限定双方身份。
  alternative: 将“我的仆人”明确译解为忠信的余民，并将“你们”明确译解为背道的以色列人。
  rationale: 本节清楚表达两群人的命运对比，但没有在句内具体说明他们的全部身份。直译其称谓可让上下文承担进一步界定的作用，避免把解释写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因心中欢喜／因心中痛苦”保留原文工整的平行对照；分号突出两群人的反差。
