source:
  edition: WLC
  text: לֹ֤א יִבְנוּ֙ וְ/אַחֵ֣ר יֵשֵׁ֔ב לֹ֥א יִטְּע֖וּ וְ/אַחֵ֣ר יֹאכֵ֑ל כִּֽי כִ/ימֵ֤י הָ/עֵץ֙ יְמֵ֣י עַמִּ֔/י וּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם יְבַלּ֥וּ בְחִירָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/022.yaml
  text: They will not build and another inhabit; they will not plant and another eat. For the days of my people will be like the days of a tree[a], and my chosen ones will wear out the work of their hands.
translation:
  language: zh_hans
  text: 他们建造的房屋，不会由别人居住；他们栽种的，不会由别人吃。因为我百姓的年日必像树木的年日；我所拣选的人必长久享用自己双手劳作的成果。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长久享用”直译可作“用旧”或“用尽”，意思是他们能在漫长的年日里一直享用自己劳作的成果。
    reason: 说明יְבַלּוּ的字面意象及其在本节祝福语境中的含义。
lexical_decisions:
- source_word: יִבְנוּ
  choice: 建造房屋
  rationale: 该词是בנה的Qal未完成式第三人称阳性复数；在复兴应许的语境中表示将来的行动。原文宾语虽省略，但下句“居住”表明所建造的是房屋，汉语中补出“房屋”可使语意自然清楚。
- source_word: וְאַחֵר יֵשֵׁב
  choice: 由别人居住
  rationale: ישׁב可表示坐、居住；此处承接建造房屋，译为“居住”最切合上下文，并保留劳作成果不再被他人夺取的对比。
- source_word: יִטְּעוּ
  choice: 栽种
  rationale: 该词是נטע的Qal未完成式第三人称阳性复数，基本义为栽种；不具体补出葡萄园或作物，以免超出原文。
- source_word: וְאַחֵר יֹאכֵל
  choice: 由别人吃
  rationale: אכל是普通的“吃”；其宾语由前面的“栽种”含蓄提供，中文保留这种省略。
- source_word: כִּי כִימֵי הָעֵץ
  choice: 因为……年日必像树木的年日
  rationale: כִּי引出原因，比较介词כְּ表达“像”。带冠词的单数“树”在此可作类指，译为“树木”符合现代汉语并保留长寿的比喻。
- source_word: יְמֵי עַמִּי
  choice: 我百姓的年日
  rationale: 按原文领属结构直译，保持庄重而自然的圣经语体。
- source_word: וּמַעֲשֵׂה יְדֵיהֶם
  choice: 自己双手劳作的成果
  rationale: 原文直义是“他们双手的工作”，可兼指劳动及其产物；结合“享用”的宾语，译为“劳作的成果”在汉语中更清楚。
- source_word: יְבַלּוּ
  choice: 必长久享用
  rationale: בלה的Piel形式可指使某物磨损、用旧或用尽。此处在长寿与安享劳动成果的祝福语境中，表达他们能长久使用并充分享受自己的成果；正文传达语境意义，脚注保留具体意象。
- source_word: בְחִירָי
  choice: 我所拣选的人
  rationale: 该复数名词性形式意为“我所拣选的那些人”。“所拣选的人”自然且不额外引入系统神学术语。
theological_decisions:
- issue: 末句יְבַלּוּ在复兴祝福中的含义
  choice: 正文译作“必长久享用”，脚注说明字面意象
  alternative: 必用旧／用尽自己双手所做的
  rationale: 原文动词保留“用到磨损或耗尽”的鲜明意象，语境则强调百姓寿命长久，能一直享有自己的劳动成果。正文采用自然汉语表达祝福，脚注保留词义张力，不将其扩展为特定的末世论教义。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。前两句保持平行结构；补出“房屋”以满足汉语表达并明确“居住”的对象。末句避免生硬的“磨损工作”，以正文与脚注共同保存原文的长久使用意象。
