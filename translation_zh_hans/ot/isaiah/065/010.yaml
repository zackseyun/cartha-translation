base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/010.yaml
  text: Sharon will become a pasture for flocks[a], and the Valley of Achor a resting place for cattle[b], for my people who have sought me.
translation:
  language: zh_hans
  text: 沙仑必成为羊群的草场[a]，亚割谷必成为牛群安歇之处[b]，供寻求我的子民使用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“羊群的居所”或“羊群放牧之地”。
    reason: lexical_alternative
  - marker: b
    text: 亚割谷曾与审判有关（参约书亚记7:24—26）；这里却被描绘为复兴与安稳之地。
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: 必成为
  rationale: 在先知性语境中表达将来的结果与转变；“成为”比单纯的“是”更能体现复兴后的变化。
- source_word: הַשָּׁרוֹן
  choice: 沙仑
  rationale: 按通行的圣经地名译法音译；希伯来语冠词不必在现代汉语地名中另行表达。
- source_word: לִנְוֵה צֹאן
  choice: 羊群的草场
  rationale: נָוֶה可指居所、牧场或放牧之地；结合牧养意象和下句的平行结构，“羊群的草场”自然清楚，同时保留原文的语义范围，并以脚注提示其他可能译法。
- source_word: וְעֵמֶק עָכוֹר
  choice: 亚割谷
  rationale: עֵמֶק意为“谷”，עָכוֹר为专名；采用简体中文圣经中通行的地名形式。
- source_word: לְרֵבֶץ בָּקָר
  choice: 牛群安歇之处
  rationale: רֵבֶץ着重牲畜躺卧、安歇的地方，不仅是放牧之地；此译保留安全休憩的意象。
- source_word: לְעַמִּי
  choice: 供……我的子民使用
  rationale: 介词ל在此表示归属、用途或受益关系；补出“供……使用”使现代汉语关系明确，又不改变原意。
- source_word: אֲשֶׁר דְּרָשׁוּנִי
  choice: 那寻求过我的
  rationale: דָּרַשׁ用于人与神的关系时通常意为“寻求”；完成式表明已发生且具有当前识别作用的行动。“寻求过”既反映完成体，又避免把经文限定为持续行为。
theological_decisions:
- issue: “我的子民，那些寻求过我的人”的身份
  choice: 保留为神所称为自己子民、并以寻求他为特征的人，不进一步限定其群体范围。
  alternative: 可理解为以色列中的余民，或整体上蒙复兴的以色列。
  rationale: 原文强调复兴临到神的子民，并用“寻求我”加以说明，但本节没有明确界定更窄的教义群体，因此译文不替经文消除这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“羊群的草场”与“牛群安歇之处”形成清楚的平行结构；“必成为”传达先知话语中的未来转变。“子民”较“百姓”更自然地表达“我的人民”这一归属关系。所有脚注标记均已置入正文。
