base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/009.yaml
  text: And I will bring forth offspring from Jacob[a], and from Judah an heir of my mountains; my chosen ones will possess it[b], and my servants will dwell there.
translation:
  language: zh_hans
  text: 我要使后裔从雅各而出[a]，使承受我的群山的人从犹大而出；我的选民必承受它[b]，我的仆人必住在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“种子”。希伯来语 זֶרַע 是集合单数，可指“种子”“后裔”或“子孙”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“承受她（或它）”。这里的宾语后缀是阴性单数，与前面的“我的群山”（阳性复数）在性、数上不一致，可能指隐含的“地”；也有人按意义理解为承受这些山。前后两处“承受”出自同一个希伯来词根，兼有继承产业和取得占有之意。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: 我要……生出
  rationale: 该词是 יצא 的使役式，表达“使之出来”。结合后面的“后裔”，译作“生出”自然地传达后代从雅各而出的意思，同时保留上帝主动成就此事的语气。
- source_word: מִיַּעֲקֹב זֶרַע
  choice: 从雅各生出后裔
  rationale: מן 表示“从”；זֶרַע 是集合单数，可指“种子”或“后裔”。正文采用现代汉语中清楚自然的“后裔”，不把“雅各”解释性改为“以色列民”。
- source_word: וּמִיהוּדָה יוֹרֵשׁ הָרָי
  choice: 从犹大生出承受我众山的人
  rationale: 后半句省略而承接“生出”；יוֹרֵשׁ 是 ירש 的分词，指承受或占有产业的人。“承受……的人”既符合汉语表达，也保留产业继承与实际占有两方面的含义。הָרָי 按复数直译为“我众山”，不泛化为“土地”。
- source_word: וִירֵשׁוּהָ
  choice: 必承受那地
  rationale: 再次使用 ירש，故以“承受”呼应前句。宾语后缀是阴性单数，不能直接与阳性复数“众山”一致；正文用“那地”作自然表达，并以脚注说明原文形式上的张力。
- source_word: בְחִירַי
  choice: 我的选民
  rationale: 指上帝所拣选的人。“选民”在现代中文圣经语体中简洁清楚，并未进一步界定其神学范围。
- source_word: וַעֲבָדַי
  choice: 我的仆人
  rationale: עבד 在此上帝与其子民的关系语境中宜译为“仆人”，既保留归属与服事含义，又避免不必要地突出社会奴役身份。
- source_word: יִשְׁכְּנוּ שָׁמָּה
  choice: 必住在那里
  rationale: שכן 表示居住、安居；“住在那里”是庄重而易懂的现代汉语，也保留持续居住的地域意象。
theological_decisions:
- issue: “我众山”及承受应许的所指
  choice: 保留“我众山”的具体地理意象，并将后句阴性单数宾语自然表达为“那地”。
  alternative: 将“我众山”概括为“我的土地”，或直接解释为纯属末世性的属灵福分。
  rationale: 原文明确提到上帝的“众山”，带有地域和产业承受的含义；译文不把它化约为抽象福分，也不裁定其更广泛的神学应验。后句的阴性单数后缀与“众山”的数、性不一致，可能指隐含的“地”，应保留并说明这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“生出后裔”保留原文的生发意象；“承受”重复对应同一希伯来词根；“我众山”略带诗歌色彩，以保存先知文本的具体意象。
