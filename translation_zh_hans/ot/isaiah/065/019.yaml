  text: וְ/גַלְתִּ֥י בִ/ירוּשָׁלִַ֖ם וְ/שַׂשְׂתִּ֣י בְ/עַמִּ֑/י וְ/לֹֽא יִשָּׁמַ֥ע בָּ/הּ֙ ע֔וֹד ק֥וֹל בְּכִ֖י וְ/ק֥וֹל זְעָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/019.yaml
  text: I will rejoice in Jerusalem and delight in my people[a]; no longer will the sound of weeping be heard in her[c][b], or the sound of crying.
translation:
  language: zh_hans
  text: 我必在耶路撒冷欢喜，也必以我的子民为乐[a]；其中[b]必不再听见哭泣声和呼号声[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在耶路撒冷”和“以我的子民为乐”原文都使用介词ב，直译可作“在……中”；在表示喜悦的动词后，也可理解为“因／为耶路撒冷”和“因／为我的子民”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在她里面”；阴性代词指耶路撒冷，体现将城市人格化的表达。
    reason: literary_feature
  - marker: c
    text: “呼号”也可译作“哀号”或“呼救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַלְתִּי
  choice: 我必……欢喜
  rationale: גיל表示欢喜、欢腾。结合上下文中关于新创造的前瞻性应许，将完成式译为将来的“必”，既符合先知语境，也保持庄重自然。
- source_word: בִירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 介词ב最直接的空间意义是“在……中”。此处保留这一表达，同时以脚注说明也可按关系意义理解为“因／为耶路撒冷”。
- source_word: וְשַׂשְׂתִּי
  choice: 也必……为乐
  rationale: שׂושׂ与גיל意义相近，都表达喜悦；用“为乐”与前面的“欢喜”稍作区别，保留诗句中两个近义动词的层次。
- source_word: בְעַמִּי
  choice: 以我的子民为乐
  rationale: 逐字可作“在我的子民中”，但现代汉语这样表达容易被理解为单纯的地点。译作“以我的子民为乐”自然地传达上帝以其子民为喜悦对象，同时用脚注保留介词的字面可能。
- source_word: יִשָּׁמַע
  choice: 听见
  rationale: שׁמע的尼斐勒态在这里表示被动的“被听见”；汉语无标记被动句“听见……声”更自然。
- source_word: בָּהּ
  choice: 其中
  rationale: 阴性单数代词回指耶路撒冷。汉语用“其中”最自然，脚注说明原文的阴性形式及城市拟人色彩。
- source_word: קוֹל בְּכִי
  choice: 哭泣声
  rationale: קוֹל与בְּכִי组成“哭泣的声音”；“哭泣声”简洁自然，并保留听觉意象。
- source_word: וְקוֹל זְעָקָה
  choice: 和呼号声
  rationale: זְעָקָה可指痛苦中的呼喊、呼救或哀号。“呼号声”与“哭泣声”形成平行，也比笼统的“哭声”更能保留其强烈呼喊之意。
theological_decisions:
- issue: 耶路撒冷的阴性拟人表达
  choice: 正文译作“其中”，脚注说明原文直译为“她里面”
  alternative: 正文直接译作“在她里面”或“在城中”
  rationale: 现代汉语以“她”指城市较不自然，但原文阴性代词形成的拟人色彩不应完全隐去，因此在正文保持清晰，在脚注保存文学信息。
- issue: 两个近义喜乐动词的区别
  choice: 分别译作“欢喜”和“为乐”
  alternative: 两处都译作“欢喜”或“喜乐”
  rationale: 原文使用גיל和שׂושׂ两个相关但不同的动词。采用不同而自然的汉语表达，可保留诗歌的丰富性，又不赋予两词过度的神学区分。
- issue: 介词ב所表达的地点或喜悦对象
  choice: 第一处译“在耶路撒冷”，第二处译“以我的子民为乐”，并用脚注保留歧义
  alternative: 两处都译为“因／为……”或都按字面译为“在……中”
  rationale: 希伯来语两处均用ב，既可按基本空间意义理解，也可在喜悦动词后表达所喜悦的对象。中文无法在两处以同一形式自然保留全部含义，因此正文采用最通顺的对应，并在脚注中公开原文的结构与其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必”承接预言应许的确定性；分号保留原文由上帝的喜悦转向城中不再有悲声的两部分结构。
