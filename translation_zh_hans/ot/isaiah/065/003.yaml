  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָ/עָ֗ם הַ/מַּכְעִיסִ֥ים אוֹתִ֛/י עַל פָּנַ֖/י תָּמִ֑יד זֹֽבְחִים֙ בַּ/גַּנּ֔וֹת וּֽ/מְקַטְּרִ֖ים עַל הַ/לְּבֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/003.yaml
  text: the people who continually provoke me to my face[a], sacrificing in the gardens and burning incense on the bricks.
translation:
  language: zh_hans
  text: 这百姓不断当面惹我发怒；他们在园中献祭，在砖上烧香。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在砖上”。这里可能指用砖砌成、用于不合法敬拜的设施或祭坛。
    reason: 说明原文的字面措辞及其可能的祭祀语境，同时保留所指对象的不确定性。
lexical_decisions:
- source_word: הָעָם
  choice: 这百姓
  rationale: 定冠词表明所指的是上下文中已经提到的特定群体；“这百姓”保留集体含义，也自然承接上文。
- source_word: הַמַּכְעִיסִים
  choice: 惹我发怒
  rationale: כעס的使役分词表示主动使对方发怒；“惹我发怒”在现代汉语中清楚传达持续而挑衅的行为。
- source_word: עַל־פָּנַי
  choice: 当面
  rationale: 字面与“脸面”有关，在本句责备语境中强调公然在上帝面前冒犯；“当面”比中性的“在我面前”更能体现这种挑衅意味。
- source_word: תָּמִיד
  choice: 不断
  rationale: 表示持续或反复发生；“不断”简洁自然，并与分词所表达的延续性相配。
- source_word: זֹבְחִים
  choice: 献祭
  rationale: 该分词指持续进行的祭祀活动；“献祭”准确、简洁，不额外限定祭物或礼仪细节。
- source_word: בַּגַּנּוֹת
  choice: 在园中
  rationale: 按其地点含义直译，保留原文园林祭祀的具体图景，不擅自增添“神坛”等解释。
- source_word: וּמְקַטְּרִים
  choice: 烧香
  rationale: קטר的强化词干在祭祀语境中通常指焚烧香料或献烟祭；“烧香”是普通现代读者容易理解的自然表达。
- source_word: עַל־הַלְּבֵנִים
  choice: 在砖上
  rationale: 原文明确说“砖”，却没有明说“祭坛”；正文保留这一词汇事实及其含混性，可能的祭祀设施含义交由脚注说明。
theological_decisions:
- issue: עַל־הַלְּבֵנִים所指的祭祀场所或设施
  choice: 在砖上
  alternative: 在砖砌的祭坛上
  rationale: 上下文中的献祭与烧香使砖砌祭祀设施成为合理解释，但原文只明说“砖”，没有出现“祭坛”。因此正文不将推断写成明文，以免消除原有含混；脚注说明其可能所指。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“当面惹我发怒”保留责备中的公然挑衅意味；后半句用两个并列动词短语再现持续的非法祭祀活动。脚注标记置于其实际解释的“在砖上”之后。
