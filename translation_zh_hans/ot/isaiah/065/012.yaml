  text: וּ/מָנִ֨יתִי אֶתְ/כֶ֜ם לַ/חֶ֗רֶב וְ/כֻלְּ/כֶם֙ לַ/טֶּ֣בַח תִּכְרָ֔עוּ יַ֤עַן קָרָ֨אתִי֙ וְ/לֹ֣א עֲנִיתֶ֔ם דִּבַּ֖רְתִּי וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּעֲשׂ֤וּ הָ/רַע֙ בְּ/עֵינַ֔/י וּ/בַ/אֲשֶׁ֥ר לֹֽא חָפַ֖צְתִּי בְּחַרְתֶּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/012.yaml
  text: And I will destine you for the sword[a], and all of you will bow down for the slaughter, because I called and you did not answer; I spoke and you did not listen. And you did what was evil in my eyes[d][c][b], and chose what I did not delight in.
translation:
  language: zh_hans
  text: 我必派定你们归于刀剑[a]；你们全都要屈膝受宰杀[b]。因为我呼唤，你们却不回答；我说话，你们却不听[c]。你们又行我眼中看为恶的事，选择我所不喜悦的[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “派定……归于”也可译作“数点……归于”或“指定……归于”。原文动词可能与上一节的“命运之神”构成双关。
    reason: lexical_alternative
  - marker: b
    text: “屈膝”也可译作“跪下”或“俯身”。原文指弯曲膝盖；这里描绘人在审判中倒下受死。
    reason: lexical_alternative
  - marker: c
    text: “不听”也可译作“不听见”或“不听从”；在这里也含有不肯留心、顺从的意味。
    reason: lexical_alternative
  - marker: d
    text: “不喜悦的”也可译作“不愿要的”或“不以为乐的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָנִיתִי
  choice: 我必定你们归于
  rationale: מנה在此有指定、派定之意，并与上一节“命运之神”的名称形成双关。“定……归于”在中文中既保留派定受审判的含义，也略能传达命运性的反讽；未译作单纯的“数点”。
- source_word: לַחֶרֶב
  choice: 刀剑
  rationale: 这是交付刀剑、死于刀剑的审判惯用语；与“定你们归于”搭配，保持原文简练而不额外限定为战争或处决。
- source_word: לַטֶּבַח
  choice: 任人宰杀
  rationale: טבח指屠杀、宰杀。中文补出“任人”使“屈膝”与被杀的处境衔接自然，但不说明施行者身份。
- source_word: תִּכְרָעוּ
  choice: 要屈膝
  rationale: כרע具体指弯膝、屈膝；审判语境中暗示倒下受死，但正文保留身体动作的意象，不直接解释为“倒毙”。
- source_word: יַעַן
  choice: 因为
  rationale: 明确引出上述审判的原因。
- source_word: קָרָאתִי ... עֲנִיתֶם
  choice: 我呼唤，你们却不回答
  rationale: 保留呼唤与回答的对应关系，以及百姓拒绝回应的责任。
- source_word: דִּבַּרְתִּי ... שְׁמַעְתֶּם
  choice: 我说话，你们却不听从
  rationale: שמע兼有听见、听取和服从的语义。“听从”体现有意不接受所说之话，但脚注保留“听”的较字面译法。
- source_word: וַתַּעֲשׂוּ הָרַע בְּעֵינַי
  choice: 你们行我眼中看为恶的事
  rationale: 保留希伯来语“在我眼中”的评价意象，同时使用自然、庄重的现代中文表达。
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בְּחַרְתֶּם
  choice: 选择我所不喜悦的
  rationale: חפץ可指喜悦、愿望或乐意。“不喜悦”保留上帝个人意志与评价的维度，又不过度解释为某项具体禁令。
theological_decisions:
- issue: 如何表达上帝主动施行审判而不引入预定论含义
  choice: 我必定你们归于刀剑
  alternative: 我要数点你们归于刀剑／我要派定你们遭受刀剑
  rationale: 原文直接把审判行动归于上帝，但没有展开关于永恒预定的教义。“定……归于”保留司法性和主动性，同时限于本节所宣告的历史性审判。
- issue: שמע在“我说话，你们却不……”中的含义
  choice: 听从
  alternative: 听见／听
  rationale: 语境指有罪的拒绝，而非生理上没有听见。“听从”自然传达拒绝接受的意味；脚注仍说明原词可较直译为“听”，避免把服从含义绝对化。
- issue: “屈膝”是否应解释为敬拜或倒毙
  choice: 保留屈膝的身体意象，并以“任人宰杀”呈现审判语境
  alternative: 俯伏／倒下受死
  rationale: 这里的屈膝并非明确描述敬拜，而是在宰杀面前弯膝、倒下。正文不把隐喻完全化解，以保留原文的力度与含混性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留原文的平行结构：“我呼唤……不回答；我说话……不听从”，并以分号和短句呈现宣告的节奏。所有词汇性歧义均在正文中尽量保留，并通过脚注交代主要译法。
