id: ISA.65.17
reference: Isaiah 65:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי הִנְ/נִ֥י בוֹרֵ֛א שָׁמַ֥יִם חֲדָשִׁ֖ים וָ/אָ֣רֶץ חֲדָשָׁ֑ה וְ/לֹ֤א תִזָּכַ֨רְנָה֙ הָ/רִ֣אשֹׁנ֔וֹת וְ/לֹ֥א תַעֲלֶ֖ינָה עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/017.yaml
  text: For behold[a], I am creating new heavens and a new earth; and the former things will not be remembered[b], nor will they come to mind.
translation:
  language: zh_hans
  text: 因为，看哪！我正在创造新天新地；从前的事必不再被记念[a]，也必不再浮上心头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从前的事必不再被想起。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“也必不再上到心上”，是指不再进入心思、不再被想起。
    reason: idiom_explanation
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 保留该词承接上文、说明缘由的功能，不把它无声省略。
- source_word: הִנְנִי
  choice: 看哪！我
  rationale: 以现代汉语中仍具庄重感的提示语引起注意，并保留第一人称的强调。
- source_word: בוֹרֵא
  choice: 正在创造
  rationale: 希伯来语分词把行动呈现为正在展开或确定施行；此译法保留其进行性，而不直接改写成单纯将来时。
- source_word: שָׁמַיִם חֲדָשִׁים וָאָרֶץ חֲדָשָׁה
  choice: 新天新地
  rationale: 这是汉语中自然、凝练的宇宙性表达，保留“天与地”的创造语境，不缩窄为天空或地域。
- source_word: הָרִאשֹׁנוֹת
  choice: 从前的事
  rationale: 该阴性复数形容词在此作名词使用；译文保持所指宽泛，不擅自限定为某一类往事或旧秩序。
- source_word: תִזָּכַרְנָה
  choice: 必不再被记念
  rationale: 保留Nifal形态的被动意味；“记念”符合庄重经文语体，也可涵盖记起、追念。
- source_word: תַעֲלֶינָה עַל לֵב
  choice: 必不再浮上心头
  rationale: 贴近“上到心上”的希伯来语意象，同时在现代汉语中自然表达“不再进入意识或被想起”。
theological_decisions:
- issue: 应许更新的范围
  choice: 译作“新天新地”，保留其宇宙性广度
  alternative: 把它主要理解并译成政治或地域性的复兴
  rationale: “天与地”的并列表达呼应创造语汇。译文不把应许缩窄为一地的恢复，也不据此加入经文本身未说明的末世体系。
- issue: “从前的事”不再被记念的主体与方式
  choice: 保留被动表达，不指明是谁不再记念
  alternative: 明确改成“人不再想起”或“上帝不再记念”
  rationale: 原文没有明说行动主体；保留被动可避免消除这一真实含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的提示力度；“正在创造”对应分词的进行性；“浮上心头”既保留原文意象，又避免生硬直译。
