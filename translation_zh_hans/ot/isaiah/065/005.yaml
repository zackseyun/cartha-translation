  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָ/אֹֽמְרִים֙ קְרַ֣ב אֵלֶ֔י/ךָ אַל תִּגַּשׁ בִּ֖/י כִּ֣י קְדַשְׁתִּ֑י/ךָ אֵ֚לֶּה עָשָׁ֣ן בְּ/אַפִּ֔/י אֵ֥שׁ יֹקֶ֖דֶת כָּל הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/005.yaml
  text: who say[a], ‘Keep to yourself; do not come near me, for I am holier than you.’ These are smoke in my nostrils, a fire burning all day long.
translation:
  language: zh_hans
  text: 他们说：“你自己待着吧！不要靠近我，因为我比你圣洁。[a]”这些人是我鼻孔中的烟，是终日燃烧的火。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我对你而言太圣洁”，或“因为我使自己成圣、与你有别”。这句希伯来语较难理解，表达的是说话者自称在礼仪或道德上高人一等。
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: 他们说
  rationale: 分词在此作名词用，承接上文所描写的人；用“他们说”自然地延续句意。
- source_word: קְרַב אֵלֶיךָ
  choice: 你自己待着吧
  rationale: 字面近似“靠近你自己”，语境中是排斥性的命令，意为叫对方留在原处、与说话者保持距离。
- source_word: אַל תִּגַּשׁ בִּי
  choice: 不要靠近我
  rationale: נגשׁ 与介词 ב 连用表示接近某人；此译清楚保留拒人于外的语气。
- source_word: כִּי קְדַשְׁתִּיךָ
  choice: 因为我比你圣洁
  rationale: 希伯来语形式简约且解释困难；结合上下文，此句表达说话者自称在礼仪或道德上更圣洁。正文采用通顺而符合讽刺语境的译法，并以脚注保留其他可能。
- source_word: אֵלֶּה
  choice: 这些人
  rationale: 指回刚才所描写并发言的那群人；补出“人”符合现代汉语表达。
- source_word: עָשָׁן בְּאַפִּי
  choice: 我鼻孔中的烟
  rationale: אַף 可指鼻子、鼻孔，也可引申为怒气；这里保留刺激鼻孔的具体烟雾意象，不将其抽象化。
- source_word: אֵשׁ יֹקֶדֶת
  choice: 燃烧的火
  rationale: 保留分词所表达的持续燃烧状态和强化神愤怒的比喻。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁、自然地表达整日持续不断的意思，语体庄重。
theological_decisions:
- issue: כִּי קְדַשְׁתִּיךָ 的解释
  choice: 因为我比你圣洁
  alternative: 因为我对你而言太圣洁；因为我使自己成圣、与你有别
  rationale: 该短语在形态和句法上都较难，正文所选译法最能体现上下文所谴责的傲慢自我隔离，但脚注明确保留其他可能，不把发言者的自夸当作经文认可的事实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你自己待着吧”传达排斥口吻；“鼻孔中的烟”保留原文鲜明而带刺激感的意象。
