source:
  edition: WLC
  text: הַ/יֹּֽשְׁבִים֙ בַּ/קְּבָרִ֔ים וּ/בַ/נְּצוּרִ֖ים יָלִ֑ינוּ הָ/אֹֽכְלִים֙ בְּשַׂ֣ר הַ/חֲזִ֔יר ו/פרק פִּגֻּלִ֖ים כְּלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/004.yaml
  text: who sit among the graves and spend the night in hidden places[a], who eat pig's flesh, and broth of unclean things is in their vessels[b];
translation:
  language: zh_hans
  text: 他们坐在坟墓中，在隐秘之处过夜[a]；他们吃猪肉，器皿里盛着污秽之物的汤[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐秘之处”原文词义不确定，也可理解为“有人看守之处”；按字面还可能是“被围困之处”，但在本处语境中可能性较小。
    reason: lexical_alternative
  - marker: b
    text: “汤”也可译作“汤汁”或“羹”；“污秽之物”也可译作“可憎之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשְׁבִים
  choice: 他们坐在
  rationale: 该词是ישׁב的Qal主动分词，在这里作名词性描述。“坐在”保留具体动作和分词的持续意味；语境中也可含逗留之意。
- source_word: בַּקְּבָרִים
  choice: 坟墓中
  rationale: קְבָרִים指坟墓或墓穴；“坟墓中”直接保留介词ב的空间表达，也可自然理解为在坟墓之间或墓地之中。
- source_word: וּבַנְּצוּרִים
  choice: 在隐秘之处
  rationale: נְצוּרִים词义疑难。结合与坟墓并列及夜间活动的语境，“隐秘之处”较自然，但不把该解释视为确定，因此以脚注保留“有人看守之处”等可能。
- source_word: יָלִינוּ
  choice: 过夜
  rationale: לין表示住宿或整夜停留；“过夜”是现代汉语中准确、自然的对应。
- source_word: הָאֹכְלִים
  choice: 他们吃
  rationale: 名词性分词延续对这群人的刻画；在汉语中补出“他们”，使并列结构清楚。
- source_word: בְּשַׂר הַחֲזִיר
  choice: 猪肉
  rationale: 直指猪的肉。“猪肉”是现代汉语最自然明确的表达，仍保留原文具体的饮食与礼仪冲击力。
- source_word: ופרק
  choice: 汤
  rationale: 此处所指词形罕见，传统上理解为以器皿盛装的汤汁或羹汤；正文用简洁自然的“汤”，脚注保留其他可能表达。
- source_word: פִּגֻּלִים
  choice: 污秽之物
  rationale: פִּגּוּלִים在祭祀和食物语境中指礼仪上污秽、令人厌恶之物。“污秽之物”保留礼仪含义，同时避免擅自扩展为泛称的禁食。
- source_word: כְּלֵיהֶם
  choice: 器皿里
  rationale: כְּלִי泛指器皿、容器或用具。“器皿”保留词义的宽泛性；以“里盛着”自然呈现希伯来语的存在结构。
theological_decisions:
- issue: 礼仪上可憎食物的表述
  choice: 保留“猪肉”“污秽之物”“汤”“器皿”等具体意象
  alternative: 概括译为“禁戒的食物”或“可憎之物”
  rationale: 本节谴责与污秽及不当敬拜相关的具体行为。译文不把这些意象抽象化，也不引入本节未明说的后期教义分类。
- issue: נְצוּרִים所指地点的性质
  choice: 正文译为“隐秘之处”，并用脚注保留歧义
  alternative: “有人看守之处”或“被围困之处”
  rationale: 语境支持隐蔽的夜间活动，但该希伯来词本身并不明确。正文采用较符合上下文的读法，同时不把词义争议静默消除。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。两个分句重复“他们”，清楚呈现希伯来语两个名词性分词的并列关系；分号保留诗句中两组行为的节奏。所有词义疑难均以脚注明确呈现，正文不作过度解释。
