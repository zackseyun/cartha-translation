  text: לֹ֤א יִֽיגְעוּ֙ לָ/רִ֔יק וְ/לֹ֥א יֵלְד֖וּ לַ/בֶּהָלָ֑ה כִּ֣י זֶ֜רַע בְּרוּכֵ֤י יְהוָה֙ הֵ֔מָּה וְ/צֶאֱצָאֵי/הֶ֖ם אִתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/023.yaml
  text: They will not labor for emptiness[a], nor bear children for calamity, for they are the offspring of those blessed by Yahweh, and their descendants with them.
translation:
  language: zh_hans
  text: 他们必不徒然劳碌，也不生儿育女，以致儿女遭遇灾祸[a]；因为他们是蒙雅威赐福之人的后裔，他们的子孙也与他们同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”或译“惊恐”或“突如其来的灾难”。希伯来语这个词可指慌乱、恐惧，也可指骤然临到的灾难。
    reason: 保留 בֶּהָלָה 的多重词义；正文按上下文采用结果性的“灾祸”。
lexical_decisions:
- source_word: יִיגְעוּ
  choice: 劳碌
  rationale: 该词表示付出辛劳、辛苦做工；“劳碌”既保留费力劳作的含义，也符合现代汉语经文语体。
- source_word: לָרִיק
  choice: 徒然
  rationale: רִיק有空虚、落空之意；在此修饰劳作，“徒然”自然表达劳而无果，同时不限定具体损失。
- source_word: יֵלְדוּ
  choice: 生下儿女
  rationale: ילד在此指生育后代；“生下儿女”适合群体性应许的语境，也避免“生育”过于抽象。
- source_word: לַבֶּהָלָה
  choice: 让他们遭遇灾祸
  rationale: בֶּהָלָה可指惊恐、慌乱或突如其来的灾难。结合儿女出生后的命运，以“遭遇灾祸”表达结果较自然；其中恐慌或突发灾难的语义范围在脚注保留。
- source_word: זֶרַע
  choice: 后裔
  rationale: זֶרַע字面为“种子”，常转指后代；此处译作“后裔”清楚表达家族与世代关系。
- source_word: בְּרוּכֵי יְהוָה
  choice: 蒙雅威赐福之人
  rationale: 该结构指受到雅威赐福的人；译文保留被动领受赐福的含义，并直接音译神名。
- source_word: וְצֶאֱצָאֵיהֶם
  choice: 他们的子孙
  rationale: צֶאֱצָאִים指后代、子孙；用“子孙”与前面的“后裔”略作区分，并体现延续的世代。
- source_word: אִתָּם
  choice: 与他们同在
  rationale: 原文简洁地表示子孙“与他们”一起；“与他们同在”保留共同存留和家庭延续的图景，不额外说明同蒙何种福分。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的发音重构，也保留其作为专名的性质。
- issue: זֶרַע בְּרוּכֵי יְהוָה 的句法关系
  choice: 蒙雅威赐福之人的后裔
  alternative: 蒙雅威赐福的后裔
  rationale: 将 בְּרוּכֵי 理解为复数附属结构，即“雅威所赐福之人的后裔”，与原文形态及所给审校层一致；不把赐福直接改作只修饰“后裔”。
- issue: וְצֶאֱצָאֵיהֶם אִתָּם 的省略表达
  choice: 他们的子孙也与他们同在
  alternative: 他们的子孙也和他们一同蒙福
  rationale: 原文只明说“与他们”，没有重复“蒙福”；正文保留这种简洁和一定的含蓄，避免把暗含关系明确扩写为同蒙福。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“徒然劳碌”凝练地保留原文的劳而无果；后半句保留“子孙也与他们同在”的原文省略，不擅自补成“同蒙福”。脚注标记置于实际对应的“灾祸”之后。
