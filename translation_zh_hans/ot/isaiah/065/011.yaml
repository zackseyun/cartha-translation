source:
  edition: WLC
  text: וְ/אַתֶּם֙ עֹזְבֵ֣י יְהוָ֔ה הַ/שְּׁכֵחִ֖ים אֶת הַ֣ר קָדְשִׁ֑/י הַֽ/עֹרְכִ֤ים לַ/גַּד֙ שֻׁלְחָ֔ן וְ/הַֽ/מְמַלְאִ֖ים לַ/מְנִ֥י מִמְסָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/011.yaml
  text: But you are those who forsake Yahweh[a], who forget my holy mountain, who set a table for Gad[c][b], and who fill mixed wine for Meni.
translation:
  language: zh_hans
  text: 但你们，就是那些离弃雅威、忘记我的圣山、为迦得[a]摆设供桌，又为米尼[b]斟满一杯调和酒[c]的人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦得”很可能是与幸运有关的神祇之名；也可理解为“幸运”。
    reason: alternative_reading
  - marker: b
    text: “米尼”很可能是与命数或命运有关的神祇之名；也可理解为“命运”。
    reason: alternative_reading
  - marker: c
    text: “调和酒”也可译作“调和的饮料”，指调制好的饮品，可能用于奠祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: 但你们这些……的人
  rationale: 独立代词配合连接词，承接上文形成鲜明对比；汉语以“但你们这些……的人”自然统摄后续各分词短语。
- source_word: עֹזְבֵי יְהוָה
  choice: 离弃雅威
  rationale: 分词描述受话群体持续呈现的身份或行为；“离弃”保留其关系与信仰层面的郑重含义。神名按原文音译为“雅威”。
- source_word: הַשְּׁכֵחִים אֶת הַר קָדְשִׁי
  choice: 忘记我的圣山
  rationale: 直译且符合现代汉语；“我的圣山”保留所属关系及分别为圣的含义，语境中指锡安。
- source_word: הָעֹרְכִים לַגַּד שֻׁלְחָן
  choice: 为迦得摆设筵席
  rationale: ערך与“桌席”连用有摆设、陈设之意；此处是祭祀供奉语境，“摆设筵席”比单说“摆桌子”更准确自然。גד按神祇名称音译。
- source_word: וְהַמְמַלְאִים לַמְנִי מִמְסָךְ
  choice: 又为米尼斟满调和酒
  rationale: מלא本义为“装满、盛满”；在饮品和祭酒语境中译作“斟满”自然，同时保留“满”的语义。ממסך指调制或混合的饮品，此处用“调和酒”表达其可能用于奠祭的酒类饮料，但不把它直接解释成祭礼动作。
- source_word: לַגַּד
  choice: 为迦得
  rationale: גד最可能是与幸运相关的神祇专名；正文音译，脚注保留“幸运之神”这一语义信息。
- source_word: לַמְנִי
  choice: 为米尼
  rationale: מני最可能是与命数或命运相关的神祇专名；正文音译，以免把专名悄然改成人格化抽象概念。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；正文用现代汉语中常见的学术音译“雅威”，保留其专名性质，而不以称号代替。
- issue: גד 与 מני 是神祇专名还是抽象概念
  choice: 正文作专名“迦得”和“米尼”
  alternative: 幸运与命运／幸运之神与命运之神
  rationale: 两词在平行结构和供桌、调和酒的祭祀语境中，最可能指神祇或人格化力量。正文保留专名，脚注说明其语义关联，从而不消除原文所容许的理解张力。
- issue: ממסך 是否直接译作奠酒
  choice: 调和酒
  alternative: 调和的饮料／奠酒
  rationale: 该名词首先指混合或调制的饮品；上下文确有祭祀含义，但原词本身不必然等同于“奠祭”。因此正文保留饮品含义，脚注交代它可能是预备作奠祭的饮料。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“摆设筵席”体现祭祀供奉场景；“斟满调和酒”兼顾原文“盛满”的字面意义和汉语表达。句末保留逗号，因为本节在句法和论述上引向下一节的审判宣告。
