base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/021.yaml
  text: They will build houses and live in them[b][a]; they will plant vineyards and eat their fruit.
translation:
  language: zh_hans
  text: 他们要建造房屋，住在其中[a]；他们要栽种葡萄园，吃园中的果实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“居住其中”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“它们的果实”，其中“它们”指葡萄园。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: 他们要建造
  rationale: 在本段预言性的复兴应许中，带连接词的完成式表达将来的行动；用“要建造”自然传达其未来指向，并保留 בנה 的具体含义。
- source_word: בָתִּים
  choice: 房屋
  rationale: 准确保留 בית 的复数和具体建筑意象；“家园”会增添原文未明说的感情色彩。
- source_word: וְיָשָׁבוּ
  choice: 住在其中
  rationale: ישב 在这里指居住。“住在其中”是现代汉语中自然清楚的表达，也对应前面的“房屋”。
- source_word: וְנָטְעוּ
  choice: 他们要栽种
  rationale: נטע 的基本义为栽种；根据上下文将完成式译为未来应许。
- source_word: כְרָמִים
  choice: 葡萄园
  rationale: כרמים 指葡萄园，而非仅指一株株葡萄树；译文保留复数所代表的类别性意象。
- source_word: וְאָכְלוּ
  choice: 吃
  rationale: 保留 אכל“吃”的具体含义，不以“享用”等较具解释性的词替代。
- source_word: פִּרְיָם
  choice: 园中的果实
  rationale: 原文是“它们的果实”，阳性复数代词后缀回指“葡萄园”。汉语用“园中的果实”可自然明确其指代，同时由脚注保留原文形式。
theological_decisions:
- issue: 预言语境中的希伯来语完成式
  choice: 译作指向未来的应许：“要建造……要栽种……”
  alternative: 译作简单过去时或现在完成时
  rationale: 本节处在复兴与更新的应许语境中，所述是上帝子民将来要经历的生活，而非已完成的往事。汉语“要”能清楚传达这种预言性的未来指向，而不额外限定实现方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“房屋—住在其中”和“葡萄园—园中的果实”形成平衡句式，保留原文具体、安定而丰足的生活图景。
