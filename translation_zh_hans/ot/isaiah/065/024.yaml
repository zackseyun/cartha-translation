source:
  edition: WLC
  text: וְ/הָיָ֥ה טֶֽרֶם יִקְרָ֖אוּ וַ/אֲנִ֣י אֶעֱנֶ֑ה ע֛וֹד הֵ֥ם מְדַבְּרִ֖ים וַ/אֲנִ֥י אֶשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/024.yaml
  text: And it will happen that before they call[a], I will answer; while they are still speaking[b], I will hear.
translation:
  language: zh_hans
  text: 将来必是这样：他们尚未呼求[a]，我就回应；他们还在说话[b]，我就听见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们尚未呼喊，我就回应。”这里的动词可指呼叫、呼喊，也可指向神发出恳求。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们尚在说话。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 必有这样的事
  rationale: 这是先知话语中引出未来情形或结果的常用表达；译文既保留其预告语气，也避免使用生硬、古旧的措辞。
- source_word: טֶרֶם
  choice: 还没有
  rationale: 该词表示后一行动发生之前；与“我就应允”搭配时，“还没有”能自然地表达神的回应早于人的呼求。
- source_word: יִקְרָאוּ
  choice: 呼求
  rationale: קרא 可指呼叫、呼喊，也可用于向神发出恳求。此处“呼求”符合祷告语境，又没有直接将动词窄化为“祷告”。
- source_word: אֶעֱנֶה
  choice: 我就应允
  rationale: ענה 表示回答、回应；“应允”在向神呼求的语境中庄重自然，并与“呼求”形成清楚对应。
- source_word: עוֹד
  choice: 还在
  rationale: 该词在这里表明说话这一动作仍在持续，尚未结束。
- source_word: מְדַבְּרִים
  choice: 说话
  rationale: 分词形式表达持续进行的言说；“说话”简明自然，也符合本节庄重而清晰的语体。
- source_word: אֶשְׁמָע
  choice: 我就听见
  rationale: שמע 的基本义是“听见、听到”。这里虽暗含神留意人的呼求，但译作“听见”可保留原文较宽的措辞，不额外加入“垂听”或“悦纳”的解释。
theological_decisions:
- issue: 是否把祷告语境直接写入正文
  choice: 保留较宽泛的“呼求”和“听见”，不明说“祷告”或“蒙垂听”。
  alternative: 译作“他们还没有祷告，我就应允；他们还在说话，我就垂听”。
  rationale: 上下文很可能描写神迅速回应祷告，但希伯来文使用的是较宽泛的“呼叫/呼求”和“听见”。保留这种表达，既传达神主动、及时回应的应许，也不把语义范围缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必有这样的事”保留预言性的引入公式；两个“就”突出神的回应先于呼求、并在人尚未说完时已经临到。正文中的[a]、[b]与脚注一一对应。
