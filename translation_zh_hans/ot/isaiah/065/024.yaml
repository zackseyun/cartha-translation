revisions:
- from: 必有这样的事：他们还没有呼求[a]，我就应允；他们还在说话[b]，我就听见。
  to: 将来必是这样：他们尚未呼求[a]，我就回应；他们还在说话[b]，我就听见。
  rationale: 修订仅消除“应允”所增加的“允准”含义，并使预言性引言更符合现代标准汉语。保留“呼求”“回应”“听见”的宽泛措辞，维持原文未明说“祷告”或“垂听／悦纳”的语义开放性；脚注锚点及替代译法均已对应保留。
