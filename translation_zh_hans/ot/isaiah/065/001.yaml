  text: נִדְרַ֨שְׁתִּי֙ לְ/ל֣וֹא שָׁאָ֔לוּ נִמְצֵ֖אתִי לְ/לֹ֣א בִקְשֻׁ֑/נִי אָמַ֨רְתִּי֙ הִנֵּ֣/נִי הִנֵּ֔/נִי אֶל גּ֖וֹי לֹֽא קֹרָ֥א בִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/001.yaml
  text: I let myself be sought by those who did not ask[a]; I let myself be found by those who did not seek me. I said, ‘Here I am[b], here I am,’ to a nation that did not call on my name.
translation:
  language: zh_hans
  text: 我被那些没有求问的人寻求[a]；我被那些没有寻找我的人找到。我对一个不呼求我名的民族说：“我在这里！我在这里！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为：“我被没有求问的人寻求……我被没有寻找我的人找到。”希伯来语的尼法尔（Niphal）语态可理解为普通被动；不过，上下文也可暗示上帝向未寻求他的人主动显明自己。
    reason: lexical_alternative
  - marker: b
    text: 保罗在《罗马书》10:20引用本节，并将其应用于外邦人。因此，这里的“民族”在更广的正典语境中可作这种理解。
    reason: cross_reference
lexical_decisions:
- source_word: נִדְרַשְׁתִּי
  choice: 得以求问我
  rationale: 该词是דרש的尼法勒式，形式上可直译为“我被求问”。中文用“得以求问我”既表达上帝让自己可被求问，也避免把尼法勒式过度解释为明确的使役动作。
- source_word: לְלֹא שָׁאָלוּ
  choice: 没有求问我的人
  rationale: שאל在此表示向上帝求问、询问；补出语境隐含的宾语“我”，使现代中文清楚自然。
- source_word: נִמְצֵאתִי
  choice: 找到了我
  rationale: מצא的尼法勒式本义为“我被找到”。中文转换为“找到了我”，保留被发现的结果，也与前句形成自然平行。
- source_word: לְלֹא בִקְשֻׁנִי
  choice: 没有寻找我的人
  rationale: בקשׁ意为寻找、寻求，宾语后缀明确指“我”；“寻找”与下文“找到”构成清楚的词义呼应。
- source_word: הִנֵּנִי הִנֵּנִי
  choice: 我在这里！我在这里！
  rationale: 保留原文重复及强调语气；这一现代汉语表达自然地传达说话者主动显明自己的临在与可接近性。
- source_word: גּוֹי
  choice: 民族
  rationale: גוי基本指一个民族或国家群体。译作“民族”不在正文中预先限定为“外邦人”，从而保留希伯来文本的词义范围。
- source_word: לֹא קֹרָא בִשְׁמִי
  choice: 没有呼求我名
  rationale: 主动分词קֹרָא与בִשְׁמִי结合，宜理解为呼求或求告上帝的名，而不是“被称为我的名下”。“呼求我名”简洁且保留圣经惯用语。
theological_decisions:
- issue: 本节是否应在正文中明确指向外邦人
  choice: 正文将גּוֹי译为“民族”，脚注说明《罗马书》中的外邦人应用。
  alternative: 在正文中直接译作“外邦人”或“外邦民族”。
  rationale: 希伯来词本身只要求“民族”之义；保罗在《罗马书》10:20将本节用于外邦人，则属于重要的正典互文。正文不预先消除词义空间，脚注保留这一神学联系。
- issue: 尼法勒式是否应明确表达上帝主动使人寻见他
  choice: 用“得以求问我”和“找到了我”表达上帝向未寻求者显明自己，同时在脚注保留形式上的被动译法。
  alternative: 直译为“我被求问……我被找到”，或强化为“我使自己被他们找到”。
  rationale: 原文语法允许简单被动，而上下文又突出上帝主动显现。所选译法兼顾中文可读性与神学张力，不把语法明确化为强使役。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以两个“没有……却……”结构再现原文平行关系，以重复的“我在这里”保留强烈的修辞呼喊。正文避免使用过于古雅的“看哪，是我”，也不直接把“民族”神学化为“外邦人”。
