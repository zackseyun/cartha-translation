  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זְאֵ֨ב וְ/טָלֶ֜ה יִרְע֣וּ כְ/אֶחָ֗ד וְ/אַרְיֵה֙ כַּ/בָּקָ֣ר יֹֽאכַל תֶּ֔בֶן וְ/נָחָ֖שׁ עָפָ֣ר לַחְמ֑/וֹ לֹֽא יָרֵ֧עוּ וְ/לֹֽא יַשְׁחִ֛יתוּ בְּ/כָל הַ֥ר קָדְשִׁ֖/י אָמַ֥ר יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/025.yaml
  text: The wolf and the lamb will graze together[a], and the lion will eat straw like the cattle; and dust will be the serpent’s food[c][b]. They will do no evil or destruction on all my holy mountain," says Yahweh.
translation:
  language: zh_hans
  text: 豺狼和羔羊必一同吃草[a]，狮子必像牛一样吃秸秆，蛇必以尘土为食[b]。它们在我整个圣山上都不伤害，也不毁坏[c]。”耶和华说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羔羊”所译的希伯来词也可泛指小山羊等幼小牲畜。
    reason: lexical_alternative
  - marker: b
    text: 蛇以尘土为食，可能呼应创世记3:14。
    reason: cross_reference
  - marker: c
    text: “不伤害”也可译作“不作恶”；这里的希伯来动词既可指作恶，也可强调造成伤害。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְאֵב
  choice: 豺狼
  rationale: 现代汉语圣经语体中常用“豺狼”指该猛兽，也能自然呈现它与羔羊之间的捕食者—猎物对照。
- source_word: טָלֶה
  choice: 羔羊
  rationale: 该词可泛指绵羊或山羊的幼畜；此处译作“羔羊”，最自然地呈现弱小猎物的意象，同时以脚注保留词义范围。
- source_word: יִרְעוּ כְאֶחָד
  choice: 必一同吃草
  rationale: רעה在这里指牲畜取食、吃草；כְאֶחָד表示“一同、在一起”。此译自然并保留和平共处的画面。
- source_word: כַּבָּקָר
  choice: 像牛一样
  rationale: בקר是集合性用语，泛指牛类；汉语“像牛一样”无需强行限定为一头公牛。
- source_word: יֹאכַל תֶּבֶן
  choice: 必……吃秸秆
  rationale: תבן指脱粒后的干茎、秸秆，可作牲畜饲料；“秸秆”比宽泛的“草料”更贴近原词。
- source_word: נָחָשׁ
  choice: 蛇
  rationale: 准确、自然，并足以保留与创世记3:14可能存在的互文联系，无须在正文中解释。
- source_word: עָפָר לַחְמוֹ
  choice: 必以尘土为食
  rationale: לֶחֶם字面可指“饼、食物”，此处译“为食”符合汉语表达，也保留尘土成为蛇食物的陈述。
- source_word: לֹא יָרֵעוּ וְלֹא יַשְׁחִיתוּ
  choice: 都不伤害，也不毁坏
  rationale: 两个使役形动词在此语境中着重伤害与破坏；如此翻译既自然，也不把第一词仅限于抽象的道德作恶。
- source_word: בְּכָל הַר קָדְשִׁי
  choice: 在我整个圣山上
  rationale: “整个”表达כָּל的全范围，“在……山上”则符合现代汉语空间表达。
- source_word: אָמַר יְהוָה
  choice: 这是耶和华说的
  rationale: 保留神名יהוה，并用庄重而自然的先知宣告句式收束经文。
theological_decisions:
- issue: 蛇吃尘土与创世记3:14的可能呼应
  choice: 正文直译为“蛇必以尘土为食”，脚注提示可能的互文
  alternative: 在正文中明确说这是蛇所受的咒诅
  rationale: 原文只陈述蛇以尘土为食；可能的伊甸园背景应予保留，但不宜将解释扩写进正文。
- issue: לֹא יָרֵעוּ的道德与伤害语义
  choice: 译作“不伤害”
  alternative: 译作“不作恶”
  rationale: 该使役形可表达作恶或造成伤害；与“不毁坏”并列且置于动物和平图景中时，“不伤害”更切合直接语境，脚注保留“作恶”的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“必”承载未完成式在预言语境中的将来意味；保留“耶和华”这一专名。正文脚注标记依相关词句顺序排列。
