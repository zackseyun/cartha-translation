source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה כַּ/אֲשֶׁ֨ר יִמָּצֵ֤א הַ/תִּירוֹשׁ֙ בָּֽ/אֶשְׁכּ֔וֹל וְ/אָמַר֙ אַל תַּשְׁחִיתֵ֔/הוּ כִּ֥י בְרָכָ֖ה בּ֑/וֹ כֵּ֤ן אֶֽעֱשֶׂה֙ לְמַ֣עַן עֲבָדַ֔/י לְ/בִלְתִּ֖י הַֽשְׁחִ֥ית הַ/כֹּֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/008.yaml
  text: 'Thus says Yahweh: As when new wine is found in a cluster[a], and one says, ‘Do not destroy it, for there is a blessing in it,’ so I will act for the sake of my servants[b], so as not to destroy all of them.'
translation:
  language: zh_hans
  text: 耶和华如此说：“正如人在葡萄串中发现新酒[a]，便说：‘不要毁掉它，因为其中有福分。’我也必因我仆人的缘故如此行，不毁灭一切[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新酒”也可译作“酒”或“鲜酒”；希伯来语 תִּירוֹשׁ 特指新酒。
    reason: lexical_alternative
  - marker: b
    text: 直译为“不毁灭全部”；希伯来原文没有明说所毁灭的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式译出四字神名，而不以“主”这一称号代替。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告的固定公式和庄重语体。
- source_word: כַּאֲשֶׁר
  choice: ……时
  rationale: 本句引出一个典型情景，并由后文的“也……这样”承接其类比关系。
- source_word: תִּירוֹשׁ
  choice: 新酒
  rationale: 该词通常指新酿或鲜新的酒，比笼统的“酒”更能保留原文词义和葡萄收获意象。
- source_word: אֶשְׁכּוֹל
  choice: 葡萄串
  rationale: 原词意为一串果实；上下文明确是葡萄，用“葡萄串”可使普通读者立刻理解图景。
- source_word: וְאָמַר
  choice: 人就说
  rationale: 希伯来文动词为单数但主语不定，中文用泛指的“人”自然表达。
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: 不要毁掉它
  rationale: 准确传达 שׁחת 的毁坏义，并与末句同一词根的“毁灭”形成呼应。
- source_word: כִּי בְרָכָה בּוֹ
  choice: 因为其中有福
  rationale: 保留“福”这一具体神学用语及“在其中”的空间性表达，不改写为解释性的“仍有价值”。
- source_word: כֵּן אֶעֱשֶׂה
  choice: 我也要……这样做
  rationale: 自然承接前面的类比，同时保留 עשה 的行动含义。
- source_word: לְמַעַן עֲבָדַי
  choice: 因我仆人的缘故
  rationale: 表达 לְמַעַן 所含的顾念或缘由，并以“仆人”呈现 עבד 在本段的身份含义。
- source_word: לְבִלְתִּי הַשְׁחִית הַכֹּל
  choice: 不把一切都毁灭
  rationale: 原文只说“全部／整体”而未明示宾语；中文如此表达既通顺，又避免擅自限定为“所有人”或“所有东西”。
theological_decisions:
- issue: 末句“全部／整体”的所指
  choice: 不把一切都毁灭
  alternative: 不把他们全都毁灭
  rationale: 上下文很可能指受审判的群体，但希伯来文 הַכֹּל 没有明说宾语。译文保留这一含混性，不把所指限定为人。
- issue: 葡萄串中“有福”的意象
  choice: 因为其中有福
  alternative: 因为它还有可取之处
  rationale: 原文明确使用“福”而非一般价值判断；直译可保留神所赐福分与保存余民之间的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。引语保持先知宣告的力度；用“葡萄串”“毁掉”等普通读者易懂的词语，同时保留“新酒”“福”“仆人”等关键圣经用语。
