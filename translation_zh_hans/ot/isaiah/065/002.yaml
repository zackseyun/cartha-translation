source:
  edition: WLC
  text: פֵּרַ֧שְׂתִּי יָדַ֛/י כָּל הַ/יּ֖וֹם אֶל עַ֣ם סוֹרֵ֑ר הַ/הֹלְכִים֙ הַ/דֶּ֣רֶךְ לֹא ט֔וֹב אַחַ֖ר מַחְשְׁבֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/002.yaml
  text: I spread out my hands all day long to a rebellious people[a], who walk in a way that is not good[c][b], following their own thoughts.
translation:
  language: zh_hans
  text: 我整天向悖逆[b]的百姓伸开双手[a]；他们行在不善的道路上，随从自己的意念[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向……伸出双手”。
    reason: פֵּרַשְׂתִּי 可表达展开或伸展；此处动作也可用“伸出”来呈现。
  - marker: b
    text: “悖逆”也可译作“顽梗”或“背道”。
    reason: סוֹרֵר 的语义包括悖逆、固执以及偏离正道。
  - marker: c
    text: “意念”也可译作“谋划”或“计划”。
    reason: מַחְשָׁבוֹת 可指思想，也可指谋划、计划；上下文没有必要只限定其中一义。
lexical_decisions:
- source_word: פֵּרַשְׂתִּי יָדַי
  choice: 伸开双手
  rationale: פֵּרַשְׂתִּי 表示展开或伸展，יָדַי 是“我的双手”。译文保留具体的身体意象，不把其中所表达的呼唤、恳求或接纳限定为单一解释。
- source_word: כָּל הַיּוֹם
  choice: 整天
  rationale: 准确表达动作持续一整天；现代汉语简洁自然。
- source_word: עַם סוֹרֵר
  choice: 悖逆的百姓
  rationale: סוֹרֵר 可指悖逆、顽梗或偏离正道；“悖逆”保留其道德与关系层面的力度，“百姓”适合此处的群体语境。
- source_word: הַהֹלְכִים הַדֶּרֶךְ
  choice: 他们行在……道路上
  rationale: 保留“行走”与“道路”的生活方式隐喻，同时用现代汉语可理解的句式表达。
- source_word: לֹא טוֹב
  choice: 不善
  rationale: 原文直译为“不好／非善”，没有直接使用“邪恶”一词；“不善”既自然庄重，也避免无根据地加强原文。
- source_word: אַחַר מַחְשְׁבֹתֵיהֶם
  choice: 随从自己的意念
  rationale: אַחַר 在此表示跟随，מַחְשְׁבֹת 可指思想、意念、谋划或计划。“意念”保留其较宽的语义范围，“自己的”明确表达第三人称复数领属。
theological_decisions:
- issue: 上帝面对悖逆百姓的姿态
  choice: 保留“伸开双手”的拟人化形象
  alternative: 译作“不断向他们呼唤”或“不断向他们伸手”
  rationale: 原文以具体身体动作描写上帝持续面向百姓。保留这一形象，既呈现上帝持久的主动姿态，也不替读者把动作限定为呼唤、恳求或接纳中的某一种。
- issue: 对百姓道路的道德评价
  choice: 将 לֹא טוֹב 译为“不善”
  alternative: 译作“邪恶”或“不正”
  rationale: 希伯来文采用“善”的否定形式。译作“不善”保留原文措辞及其宽度，不擅自强化为更具体的道德定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“伸开双手”“行在……道路上”保留原文的核心意象；分号清楚呈现上帝持续伸手与百姓持续偏行之间的张力。所有脚注标记均紧随其所说明的词语或短语。
