  text: וְ/אַתֶּ֗ם כֹּהֲנֵ֤י יְהוָה֙ תִּקָּרֵ֔אוּ מְשָׁרְתֵ֣י אֱלֹהֵ֔י/נוּ יֵאָמֵ֖ר לָ/כֶ֑ם חֵ֤יל גּוֹיִם֙ תֹּאכֵ֔לוּ וּ/בִ/כְבוֹדָ֖/ם תִּתְיַמָּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/006.yaml
  text: But you will be called the priests of Yahweh; they will say of you, "Ministers of our God." You will eat the wealth of nations[a], and in their glory you will boast.
translation:
  language: zh_hans
  text: 但你们必被称为耶和华的祭司；人必称你们为“我们上帝的仆人”。你们必享用列国的财富，并以他们的荣耀自夸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并在他们的华美中欢欣。”末尾的动词十分罕见，其确切含义有争议；正文采用通常理解的“自夸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֵי יְהוָה
  choice: 耶和华的祭司
  rationale: 保留原文的祭司性称谓和所属关系；“耶和华”直接呈现圣名。
- source_word: מְשָׁרְתֵי אֱלֹהֵינוּ
  choice: 我们上帝的仆役
  rationale: משרת 指履行服侍职责的人，在此与“祭司”平行；“仆役”既保持庄重，也避免让现代读者误解为后世特定教会职衔。
- source_word: יֵאָמֵר לָכֶם
  choice: 人必称你们为
  rationale: 原文为第三人称单数的非特指表达，中文用“人必……”自然传达公众对他们的称谓，也与前句“必称为”形成平行。
- source_word: חֵיל גּוֹיִם
  choice: 列国的财富
  rationale: חיל 可指力量、资源或财富；与“享用”搭配时，财富或资源之义最合语境。
- source_word: תֹּאכֵלוּ
  choice: 必享用
  rationale: 原义为“吃”，此处比喻享受、取用列国的财富；中文若直译“吃财富”不自然，因此保留意象所表达的核心意义。
- source_word: וּבִכְבוֹדָם
  choice: 因他们的荣耀
  rationale: כבוד 可指荣耀、尊荣、华美或丰盛；“荣耀”保留其宽广语义，不把所指限定为物质繁荣。
- source_word: תִּתְיַמָּרוּ
  choice: 夸耀
  rationale: 该罕见动词的 Hitpael 形式含义有争议；“夸耀”符合常见理解，并与介词短语自然衔接，同时以脚注保留另一种可能。
theological_decisions:
- issue: 是否把以色列受称为祭司的预言改写为后来的教会职分
  choice: 保留直接称谓“耶和华的祭司”和“我们上帝的仆役”
  alternative: 将其泛化为属灵服侍者，或套用后世特定教会职衔
  rationale: 原文明确使用祭司和礼仪性服侍用语；译文应保存这一神学意象，而不预先将其等同于某一后世群体或制度。
- issue: 末句表达的是夸耀、欢欣，还是被抬举
  choice: 正文译作“因他们的荣耀而夸耀”
  alternative: “因他们的华美而欢欣”或“在他们的荣耀中被抬举”
  rationale: 末动词罕见，词义及其与 כבוד 的关系存在真实不确定性；正文采用常见解释，脚注说明另一种可行理解，避免消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“仆役”体现正式服侍身份而不引入现代教会职称；“享用”避免生硬的“吃财富”。脚注标记置于所注释的末句之后。
