id: ISA.61.8
reference: Isaiah 61:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אֲנִ֤י יְהוָה֙ אֹהֵ֣ב מִשְׁפָּ֔ט שֹׂנֵ֥א גָזֵ֖ל בְּ/עוֹלָ֑ה וְ/נָתַתִּ֤י פְעֻלָּתָ/ם֙ בֶּ/אֱמֶ֔ת וּ/בְרִ֥ית עוֹלָ֖ם אֶכְר֥וֹת לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/008.yaml
  text: For I[a], Yahweh, love justice; I hate robbery with burnt offering. And I will give them their recompense in faithfulness[c][b], and I will cut an everlasting covenant with them.
translation:
  language: zh_hans
  text: '因为我—耶和华—喜爱公正，

    恨恶以抢夺之物作燔祭[a]；

    我要凭信实把他们的报偿[b]赐给他们，

    并与他们立永远的约[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来语较难，也可理解为“抢夺与燔祭相伴”“为献燔祭而抢夺”，或指抢来的祭物；重点可能是把不义所得带入敬拜之中。
    reason: alternative_reading
  - marker: b
    text: “报偿”也可译作“工价”或“酬劳”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“切一个约”，意思是“立约”。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，保留其专名性质和圣约语境。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 本节将其与抢夺相对照，重点是社会与道德层面的正义；“公正”比单指司法裁决的“审判”更贴合语境。
- source_word: גָזֵל
  choice: 抢夺之物
  rationale: 此词可指抢夺的行为或所得之物；与燔祭连用时，“抢夺之物”能自然表达把不义所得用于献祭的可能含义，同时由脚注保留其他句法理解。
- source_word: בְּעוֹלָה
  choice: 献燔祭
  rationale: 按马所拉文本将 עוֹלָה 理解为“燔祭”，不改读为表示“不义”的另一词根；介词 בְּ 的确切关系含混，正文采用自然但不过度扩展的译法，并以脚注说明其他可能。
- source_word: פְעֻלָּתָם
  choice: 他们的报偿
  rationale: 在神施行公正并赐下圣约福分的语境中，指他们所得的回报；“报偿”兼顾“工价、酬劳、赏报”的语义范围。
- source_word: בֶּאֱמֶת
  choice: 凭信实
  rationale: 修饰耶和华赐予报偿的方式，既表达真实可靠，也呼应圣约中的忠信。
- source_word: בְרִית עוֹלָם
  choice: 永远的约
  rationale: 这是自然、庄重且通行的中文圣约用语，准确表达持续长久的约。
- source_word: אֶכְרֹת
  choice: 立
  rationale: 希伯来语直译为“切”，但“立约”是现代中文表达同一固定用语的自然方式；字面习语在脚注中保留。
theological_decisions:
- issue: גָזֵל בְּעוֹלָה 的解释
  choice: 用抢夺之物献燔祭
  alternative: 抢夺与燔祭相伴；为献燔祭而抢夺；抢夺燔祭物
  rationale: 马所拉文本的 עוֹלָה 通常指“燔祭”，不应无说明地改读成“不义”。正文呈现不义所得与敬拜相混的先知性批判，脚注则明确保留介词关系和句法上的真实歧义。
- issue: פְעֻלָּתָם 的语义
  choice: 他们的报偿
  alternative: 他们的工价；他们的酬劳；他们的作为
  rationale: 上下文讲耶和华以公正和信实施行恢复，并与他们立约，因此理解为神所赐的回报较合适；不过该名词本身也可指工作或工价，故在脚注中保留替代译法。
- issue: כרת ברית 的希伯来习语
  choice: 立约
  alternative: 切约
  rationale: “切约”虽贴近希伯来语字面，却不是自然现代汉语，也可能妨碍普通读者理解；“立约”准确传达该习语，同时脚注说明原文字面。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“因为我耶和华”保留原文第一人称自我宣告的强调；诗行分行呈现平行结构。正文不用生硬的“切约”，但以脚注保持原文习语的透明度。
