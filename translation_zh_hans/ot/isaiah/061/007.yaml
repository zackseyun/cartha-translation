  terminology: “羞耻／凌辱”“双份”“土地”“承受”等术语适切。为避免第一处的“补偿”和第二处的“产业”对同一希伯来词作不对称且过度具体的限定，正文两处均采用“双份”；“承受”表达ירשׁ的继承语义，脚注保留“得双份产业”的可能表述。
