revisions:
- from: 你们从前所受的羞耻，必有双份补偿；[a]他们不再受凌辱，反而要为所得的份欢呼。[b]因此，他们在自己的土地上必得双份产业；[c]他们必永远喜乐。
  to: 你们必得双份，代替你们的羞耻；[a]他们必为自己的份欢呼，以此代替凌辱。[b]因此，他们必在自己的土地上承受双份；[c]永远的喜乐必归给他们。
  rationale: 修订不协调原文的人称转换，并保留两次“双份”的对应。删除“补偿”以避免增添具体含义；以“以此代替凌辱”重现原文平行句的替换关系；将结尾恢复为“永远的喜乐必归给他们”，更贴近希伯来语的结构和语气。脚注锚点均保留并置于对应语句之后。
