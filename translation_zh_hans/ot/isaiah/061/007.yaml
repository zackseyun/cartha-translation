id: ISA.61.7
reference: Isaiah 61:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תַּ֤חַת בָּשְׁתְּ/כֶם֙ מִשְׁנֶ֔ה וּ/כְלִמָּ֖ה יָרֹ֣נּוּ חֶלְקָ֑/ם לָ/כֵ֤ן בְּ/אַרְצָ/ם֙ מִשְׁנֶ֣ה יִירָ֔שׁוּ שִׂמְחַ֥ת עוֹלָ֖ם תִּֽהְיֶ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/007.yaml
  text: Instead of your shame[a], there will be a double portion; and instead of disgrace, they will shout for joy over their portion. Therefore in their land they will possess a double portion[c][b]; everlasting joy will be theirs.
translation:
  language: zh_hans
  text: 你们必得双份，代替你们的羞耻；[a]他们必为自己的份欢呼，以此代替凌辱。[b]因此，他们必在自己的土地上承受双份；[c]永远的喜乐必归给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文由“你们的羞耻”转为“他们的份／他们的土地／他们必承受”。有些译本为使行文顺畅，全都译作“你们／你们的”。
    reason: alternative_reading
  - marker: b
    text: “欢呼”也可译作“欢唱”。
    reason: lexical_alternative
  - marker: c
    text: “承受双份”也可译作“得双份产业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: 从前所受的……必有……补偿／不再……反而
  rationale: 此处表示处境的替换与逆转，而非空间意义。中文分别按两个平行分句自然表达“取而代之”的关系。
- source_word: בָּשְׁתְּכֶם
  choice: 你们从前所受的羞耻
  rationale: 保留第二人称复数，并以“所受的”自然表达羞耻处境。
- source_word: מִשְׁנֶה
  choice: 双份
  rationale: 该词指加倍的份额，在土地、产业与复兴的语境中译作“双份”简明而准确。
- source_word: וּכְלִמָּה
  choice: 不再受凌辱
  rationale: 该词侧重公开蒙羞、受辱；与前面的“羞耻”略作区分，并按省略的替换结构译出。
- source_word: יָרֹנּוּ
  choice: 欢呼
  rationale: רנן表示发声表达强烈喜乐；“欢呼”兼顾声音与喜悦。
- source_word: חֶלְקָם
  choice: 所得的份
  rationale: חֵלֶק意为份额、所得之份；此译保留分配或产业的含义，同时符合现代汉语。
- source_word: לָכֵן
  choice: 因此
  rationale: 清楚表达前述逆转与后续结果之间的逻辑关系。
- source_word: בְּאַרְצָם
  choice: 在自己的土地上
  rationale: 保留归属于他们的土地这一领土与复兴意涵；“自己的”对应第三人称复数词尾。
- source_word: יִירָשׁוּ
  choice: 必得……产业
  rationale: ירשׁ兼有继承和取得、占有之意；与“双份”连用时，“得双份产业”自然保留继承背景。
- source_word: שִׂמְחַת עוֹלָם
  choice: 永远喜乐
  rationale: 表达持久不止的喜乐，语言自然、庄重。
- source_word: תִּהְיֶה לָהֶם
  choice: 他们必……
  rationale: 希伯来语直译为“必有喜乐归给他们”；中文以“他们必永远喜乐”自然表达其结果。
theological_decisions:
- issue: 经文由第二人称复数“你们的羞耻”转为第三人称复数“他们的份、他们的土地、他们必得”
  choice: 保留人称转换
  alternative: 全节统一译为第二人称“你们／你们的”
  rationale: 马所拉文本确实有人称变化。保留这一变化可忠实呈现原文的突转，不擅自判定它只是语法不一致。
- issue: מִשְׁנֶה在本节中的具体所指
  choice: 前半译作“双份补偿”，后半译作“双份产业”
  alternative: 两处都只译作“双份”或“双倍”
  rationale: 原文第一处省略了承受对象，后半则处在土地与承受产业的语境中。此译适度补足中文语义，同时不把“双份”限定为某一种具体物品。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留希伯来文本的人称突转，并用“羞耻／凌辱”维持两个近义词的区别。前半句原文高度省略，译文以“补偿”补足中文，但脚注与措辞避免过度限定双份的具体内容。
