source:
  edition: WLC
  text: לָ/שׂ֣וּם לַ/אֲבֵלֵ֣י צִיּ֗וֹן לָ/תֵת֩ לָ/הֶ֨ם פְּאֵ֜ר תַּ֣חַת אֵ֗פֶר שֶׁ֤מֶן שָׂשׂוֹן֙ תַּ֣חַת אֵ֔בֶל מַעֲטֵ֣ה תְהִלָּ֔ה תַּ֖חַת ר֣וּחַ כֵּהָ֑ה וְ/קֹרָ֤א לָ/הֶם֙ אֵילֵ֣י הַ/צֶּ֔דֶק מַטַּ֥ע יְהוָ֖ה לְ/הִתְפָּאֵֽר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/003.yaml
  text: to appoint for the mourners of Zion[a], to give them a headdress instead of ashes, oil of gladness instead of mourning, a garment of praise instead of a faint spirit; and they will be called oaks of righteousness, the planting of Yahweh[d][c][b], that he may display his glory.
translation:
  language: zh_hans
  text: 为锡安的哀悼者预备：赐给他们华美的头饰，代替灰烬；喜乐的油，代替哀悼；赞美的衣袍，代替衰颓的心灵。他们必被称为公义的橡树[b][c]，是雅威所栽种的，为要彰显他的荣美[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “橡树”也可译作“笃耨香树”。原文指高大坚固的树，具体树种可能是笃耨香树。
    reason: lexical_alternative
  - marker: c
    text: “公义”也可译作“正义”。原文词语同时涵盖公义和公正、正义的意义。
    reason: alternative_reading
  - marker: d
    text: “为要彰显他的荣美”也可译作“使他得荣耀”。原文末尾的动词可以理解为雅威借这栽种彰显自己，也可以强调他因此得荣耀。
    reason: alternative_reading
lexical_decisions:
- source_word: לָשׂוּם לַאֲבֵלֵי צִיּוֹן
  choice: 为锡安悲哀的人预备这一切
  rationale: לָשׂוּם在这里与后面的לָתֵת平行，表示为悲哀者安排、预备。补出“这一切”使承接性的希伯来语不定式在现代汉语中自然，同时不增加具体内容。
- source_word: פְּאֵר
  choice: 华冠
  rationale: 该词可泛指华美装饰，也可具体指节庆时佩戴的华美头饰。与放在头上的哀悼灰尘相对，“华冠”既保留具体意象，也简洁庄重。
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: 喜乐的油
  rationale: 保留原文属格结构和以膏油象征庆贺、欢欣的诗歌意象。
- source_word: מַעֲטֵה תְהִלָּה
  choice: 赞美的衣袍
  rationale: מַעֲטֶה指披在身上的外衣或覆盖物；“衣袍”保留穿戴意象，也与“华冠”和“油”形成连贯画面。
- source_word: רוּחַ כֵּהָה
  choice: 衰颓的心灵
  rationale: כֵּהָה有暗淡、微弱、衰竭之意。“衰颓”表达内在力量低落，却不把它过度限定为某一种现代心理状态。
- source_word: וְקֹרָא לָהֶם
  choice: 他们必称为
  rationale: 原文第三人称阳性单数在此可有不定主体的被动作用；汉语被动式避免擅自指定称呼者。
- source_word: אֵילֵי הַצֶּדֶק
  choice: 公义的橡树
  rationale: אֵילִים在“栽种”的语境中指高大坚固的树木，可能更具体地指笃耨香树；“橡树”在现代汉语中更容易传达坚固挺立的诗歌意象。צֶדֶק译作“公义”，并以脚注保留“正义”的语义可能。
- source_word: מַטַּע יְהוָה
  choice: 雅威所栽种的
  rationale: מַטַּע表示所栽种之物；译文保留雅威是栽种者的关系，并直接音译神名יהוה。
- source_word: לְהִתְפָּאֵר
  choice: 为要彰显他的荣美
  rationale: 该Hitpael形式在此表达雅威借着自己所栽种的子民显出荣耀或荣美的目的；“彰显他的荣美”保留神的主动性，另在脚注列出被动理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重建的读音，并保留其作为专名的功能。
- issue: לְהִתְפָּאֵר 的语态和目的含义
  choice: 为要彰显他的荣美
  alternative: 使他得荣耀
  rationale: 原文形式容许强调雅威借其栽种彰显自己的荣美，也可理解为他因此得荣耀。正文采用前者，同时用脚注保留后者，不消解语态上的张力。
- issue: הַצֶּדֶק 的语义范围
  choice: 公义
  alternative: 正义
  rationale: 该词兼有合宜、公义与正义、公正的含义；描述复兴后的群体时“公义”较自然，但“正义”仍是真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，以三个“代替”保存原文的排比结构；“华冠—油—衣袍”维持由哀悼转为欢庆的具体意象。正文保留“公义／正义”、树种以及末尾动词语态的真实歧义，并在脚注说明。
