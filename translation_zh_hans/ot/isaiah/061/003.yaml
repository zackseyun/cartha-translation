  naturalness: “他们必称为”在现代汉语中被动表达不完整，改为“他们必被称为”更自然。以“华美的头饰”替代“华冠”，既避免“冠”可能引起的王冠联想，也更直接呈现与头上灰烬相对的节庆头饰。
  terminology: “雅威”“公义”“赞美的衣袍”均可保留；“笃耨香树”作为 אֵילִים 的具体树种备选也合适。末句保留“彰显他的荣美”，并以脚注保留“使他得荣耀”的可行理解。
