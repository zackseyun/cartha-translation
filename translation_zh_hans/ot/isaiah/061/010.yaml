source:
  edition: WLC
  text: שׂ֧וֹשׂ אָשִׂ֣ישׂ בַּֽ/יהוָ֗ה תָּגֵ֤ל נַפְשִׁ/י֙ בֵּֽ/אלֹהַ֔/י כִּ֤י הִלְבִּישַׁ֨/נִי֙ בִּגְדֵי יֶ֔שַׁע מְעִ֥יל צְדָקָ֖ה יְעָטָ֑/נִי כֶּֽ/חָתָן֙ יְכַהֵ֣ן פְּאֵ֔ר וְ/כַ/כַּלָּ֖ה תַּעְדֶּ֥ה כֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/010.yaml
  text: I will greatly rejoice in Yahweh[a]; my soul will exult in my God, for he has clothed me with garments of salvation; he has wrapped me in a robe of righteousness, like a bridegroom who adorns himself with a priestly headdress[b], and like a bride who decks herself with her jewelry.
translation:
  language: zh_hans
  text: 我必因雅威[a]大大欢喜；我的心必因我的上帝欢欣。因为他给我穿上拯救的衣裳，用公义的袍子裹住我；好像新郎戴上祭司般的华美头饰[b]，又像新娘佩戴自己的首饰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是上帝的专名，传统上也译作“耶和华”；有些译本在正文中以“耶和华”或“主”表示。
    reason: divine_name
  - marker: b
    text: 原文的动词与“祭司”一词同根，可能是说新郎“像祭司一样戴上华美头饰”；也有人理解为“以华冠装扮自己”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׂוֹשׂ אָשִׂישׂ
  choice: 我必……大大欢喜
  rationale: 不定式绝对式与未完成式连用，加强“欢喜”的语气；用“大大”自然传达希伯来语的强调。
- source_word: בַּיהוָה
  choice: 因雅威
  rationale: 介词 ב 在这里表示欢喜所因或所指向的对象；“因”符合现代汉语习惯，并以“雅威”呈现神名。
- source_word: תָּגֵל נַפְשִׁי
  choice: 我的心必……欢欣
  rationale: נֶפֶשׁ 此处指人的内在生命或自我，译作“心”比“灵魂”更自然；גיל 带有雀跃、欢腾之意，译作“欢欣”以保持诗歌中的同义递进。
- source_word: בֵּאלֹהַי
  choice: 因我的上帝
  rationale: 与前句 בַּיהוָה 平行，表示欢欣的对象或缘由；保留“我的上帝”这一关系性表达。
- source_word: הִלְבִּישַׁנִי
  choice: 他给我穿上
  rationale: 使役词形表达“使我穿上”；汉语用“给我穿上”自然保留施动者和穿衣意象。
- source_word: בִּגְדֵי יֶשַׁע
  choice: 拯救的衣裳
  rationale: 保留复数衣物意象，并以“拯救”表达 יֶשַׁע 的解救和救恩含义。
- source_word: מְעִיל צְדָקָה
  choice: 公义的袍子
  rationale: מְעִיל 是外袍；צְדָקָה 可指公义、正义，正文用“公义”保留其较宽广的盟约与道德含义。
- source_word: יְעָטָנִי
  choice: 裹住我
  rationale: 该动词表示以衣物覆盖、包裹；“裹住”形象地延续穿衣比喻。
- source_word: יְכַהֵן פְּאֵר
  choice: 戴上祭司般的华美头饰
  rationale: יְכַהֵן 是罕见形式，可能唤起祭司穿戴或履职的意象；פְּאֵר 指华美头饰。译文保留祭司联想，同时避免将不确定的动作限定为正式供职。
- source_word: וְכַכַּלָּה תַּעְדֶּה כֵלֶיהָ
  choice: 又如新娘佩戴自己的首饰
  rationale: עדה 表示妆饰自己；כֵלִים 在新娘语境中指饰物，现代汉语以“首饰”表达最自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常的学术重构读音，也让读者看见这是专名而非普通称号。脚注说明传统译名，避免读者误解。
- issue: צְדָקָה 在衣袍比喻中的含义
  choice: 公义
  alternative: 正义
  rationale: 该词既含正直、公义，也可涉及公正；在上帝赐衣的诗性比喻中，“公义”较能保留其关系性、道德性和神学张力，而不把含义缩窄为司法或社会层面的正义。
- issue: יְכַהֵן 的祭司意象
  choice: 戴上祭司般的华美头饰
  alternative: 戴上华冠；像祭司戴上头饰；以头饰装扮自己
  rationale: 这一罕见动词与“祭司”一词同根，可能表示像祭司那样穿戴，也可能在语境中泛指装扮。正文保留祭司联想，脚注明确原文表达的特殊性与不确定性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“我的心”自然表达 נַפְשִׁי 的整体内在自我；保持“衣裳—袍子—头饰—首饰”的连续穿戴意象，并用脚注保留神名和罕见祭司用语的译法差异。
