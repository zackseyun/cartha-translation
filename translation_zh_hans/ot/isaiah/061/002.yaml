id: ISA.61.2
reference: Isaiah 61:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לִ/קְרֹ֤א שְׁנַת רָצוֹן֙ לַֽ/יהוָ֔ה וְ/י֥וֹם נָקָ֖ם לֵ/אלֹהֵ֑י/נוּ לְ/נַחֵ֖ם כָּל אֲבֵלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/002.yaml
  text: to proclaim the year of Yahweh’s favor and the day of vengeance of our God[a], to comfort all who mourn[b],
translation:
  language: zh_hans
  text: 宣告雅威施恩之年[a]，以及我们的上帝施行报应之日，安慰所有哀恸的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威悦纳之年”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“所有哀恸者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרֹא
  choice: 宣告
  rationale: 此处不定式承接受膏者的使命，指公开发布信息；“宣告”比一般性的“呼叫”更符合语境。
- source_word: שְׁנַת רָצוֹן
  choice: 施恩之年
  rationale: רָצוֹן 在此表达雅威的悦纳、恩惠或眷顾；“施恩之年”自然简洁，也清楚表明恩惠来自雅威。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 介词 ל 表示这一年与雅威的恩惠相关；按所给神学决策，将四字神名 יהוה 音译为“雅威”。
- source_word: וְיוֹם נָקָם
  choice: 以及……施行报应之日
  rationale: נָקָם 指对恶行作出应有的惩罚或追讨；“施行报应”保留神圣追讨与审判的力度，同时在现代汉语中较为自然。
- source_word: לֵאלֹהֵינוּ
  choice: 我们的上帝
  rationale: 保留第一人称复数所属关系，并以自然汉语表达此日与“我们的上帝”施行报应相关。
- source_word: לְנַחֵם
  choice: 安慰
  rationale: 此不定式继续列举使命内容；“安慰”准确传达 נחם 在悲哀处境中的慰藉和扶助。
- source_word: כָּל אֲבֵלִים
  choice: 所有悲哀的人
  rationale: 希伯来语复数形式泛指一切哀恸者；此译法自然且不限定性别。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”保留其专名性质，并符合所给项目决策。
- issue: 恩惠与报应之间的张力
  choice: 同时保留“施恩之年”与“施行报应之日”
  alternative: 将 נָקָם 弱化为一般性的“审判”，或突出恩惠而淡化报应
  rationale: 原文有意并列恩惠与报应；译文不应消解这种神学张力。
- issue: “年”与“日”的不对称表达
  choice: 照原文保留“年”与“日”
  alternative: 将两者统一为相同时间单位
  rationale: 原文以“年”对应恩惠、以“日”对应报应，可能具有修辞意义，故不作整齐化处理。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“雅威”作神名；“施恩”与“施行报应”形成清楚平行，并保留原文“年／日”的修辞对照。所有脚注标记均置于正文相应位置。
