source:
  edition: WLC
  text: כִּ֤י כָ/אָ֨רֶץ֙ תּוֹצִ֣יא צִמְחָ֔/הּ וּ/כְ/גַנָּ֖ה זֵרוּעֶ֣י/הָ תַצְמִ֑יחַ כֵּ֣ן אֲדֹנָ֣/י יְהוִ֗ה יַצְמִ֤יחַ צְדָקָה֙ וּ/תְהִלָּ֔ה נֶ֖גֶד כָּל הַ/גּוֹיִֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/011.yaml
  text: For as the earth brings forth its growth[a], and as a garden causes what is sown in it to spring up, so the Lord GOD will cause righteousness and praise to spring up before all the nations.
translation:
  language: zh_hans
  text: 因为地怎样生出嫩芽，园子怎样使所播种的发芽，主耶和华也必照样使公义[a]和赞美在万国面前生发。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”；希伯来语原词也可包含公开伸张正义或使人得以昭雪的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并引出说明性比喻，表达因果和解释关系。
- source_word: כָאָרֶץ
  choice: 大地
  rationale: 这里是普遍的农耕比喻，并非特指某一疆土；“大地”自然且保留受造界意象。
- source_word: תּוֹצִיא צִמְחָהּ
  choice: 长出嫩芽
  rationale: 既表达使植物萌出的动态，也以自然汉语呈现农业意象；“嫩芽”对应所萌生之物。
- source_word: וּכְגַנָּה
  choice: 园子怎样
  rationale: 与前一“怎样”构成平行比较，符合现代汉语表达。
- source_word: זֵרוּעֶיהָ
  choice: 其中所种的
  rationale: 该形式指被播种之物，不仅是抽象的种子；此译保留其宽泛性。
- source_word: תַצְמִיחַ
  choice: 使……发芽
  rationale: 保留צמח使役式的因果含义和萌发生长的图景。
- source_word: כֵּן
  choice: 也必照样
  rationale: 明确完成前后类比；“必”配合未完成式在预言语境中的将来确定性。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别呈现“主”和神的专名；“主耶和华”是庄重且为普通中文读者熟悉的复合称号。
- source_word: יַצְמִיחַ
  choice: 使……生发出来
  rationale: 与前文植物萌发的动词呼应，同时自然地用于“公义和赞美”这两个抽象名词，并保留使役含义。
- source_word: צְדָקָה
  choice: 公义
  rationale: 保留该词在道德、关系和公开伸张正义方面的语义宽度；具体的“正义”可能性置于脚注。
- source_word: וּתְהִלָּה
  choice: 和赞美
  rationale: 直译该名词的通常意义，指神拯救作为所引发的称颂。
- source_word: נֶגֶד כָּל הַגּוֹיִם
  choice: 在万国面前
  rationale: 准确表达公开显现在所有列国之前的意义。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时包含“主”和四字神名。正文采用现代中文圣经语境中庄重且广为理解的“主耶和华”，不省略神名，也避免译成不自然的“主主”。
- issue: צְדָקָה 在复兴预言中的含义
  choice: 公义
  alternative: 正义
  rationale: “公义”能保留道德正直、合宜关系与蒙伸冤等层面；原词也可侧重公开施行的正义，因此以脚注保留该译法，不将张力单一化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“长出—发芽—生发出来”维持全节的萌发生长意象；平行的“怎样……怎样……也必照样”清楚呈现希伯来诗句的比较结构。
