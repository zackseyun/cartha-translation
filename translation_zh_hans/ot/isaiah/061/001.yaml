  to: 主耶和华的灵在我身上，因为耶和华膏了我，叫我向困苦的人[a]传好消息。他差遣我去包扎心灵破碎的人，向被掳的人宣告自由，向被捆绑的人宣告开释[b]。
  rationale: 修订仅增强两个词语的原文对应度：“心灵破碎的人”保留“心被破碎”的强烈意象；“被捆绑的人”保留אָסוּרִים较宽的字面范围。末句罕见词组的歧义未在正文中武断解决，仍以“开释”概括其与前句“自由”的平行释放主题，并在脚注列出主要替代理解。
