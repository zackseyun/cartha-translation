id: ISA.61.1
reference: Isaiah 61:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ר֛וּחַ אֲדֹנָ֥/י יְהוִ֖ה עָלָ֑/י יַ֡עַן מָשַׁח֩ יְהוָ֨ה אֹתִ֜/י לְ/בַשֵּׂ֣ר עֲנָוִ֗ים שְׁלָחַ֨/נִי֙ לַ/חֲבֹ֣שׁ לְ/נִשְׁבְּרֵי לֵ֔ב לִ/קְרֹ֤א לִ/שְׁבוּיִם֙ דְּר֔וֹר וְ/לַ/אֲסוּרִ֖ים פְּקַח קֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/001.yaml
  text: The Spirit of the Lord GOD is upon me[a], because Yahweh has anointed me to bring good news to the humble; he has sent me to bind up the brokenhearted[b], to proclaim liberty to the captives and opening of the prison to the bound.
translation:
  language: zh_hans
  text: 主耶和华的灵在我身上，因为耶和华膏了我，叫我向困苦的人[a]传好消息。他差遣我去包扎心灵破碎的人，向被掳的人宣告自由，向被捆绑的人宣告开释[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦的人”或译“贫穷的人”“谦卑的人”。希伯来词 עֲנָוִים 可指贫穷、受苦、卑微或谦卑的人。
    reason: lexical_alternative
  - marker: b
    text: “开释”所对应的希伯来词组 פְּקַח־קוֹחַ 含义不确定；也可理解为“开启”，如“监牢开启”。该词组也常被理解为“眼睛开启（重见光明）”。“被捆绑的人”在此语境中可包括被囚者。
    reason: alternative_reading
lexical_decisions:
- source_word: ר֛וּחַ
  choice: 灵
  rationale: 在“主耶和华的灵”这一先知受差遣的语境中，所指是上帝的灵，而非风、气息或人的心志。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留 אֲדֹנָי 的“主”和神名 יְהוִה；“主耶和华”也是自然、庄重且为中文读者熟悉的复合称谓。
- source_word: עָלַי
  choice: 在我身上
  rationale: 直接保留介词表达，并符合中文中先知蒙灵赋能、受差遣的说法。
- source_word: יַעַן
  choice: 因为
  rationale: 清楚表达后文是圣灵临在于说话者身上的原因或根据。
- source_word: מָשַׁח
  choice: 膏了
  rationale: 保留以膏立、膏抹来授职和差遣的具体意象，不提前把其神学含义解释为其他措辞。
- source_word: לְבַשֵּׂר
  choice: 传好消息
  rationale: 准确表达宣告喜讯的意义，同时采用普通现代读者容易理解的措辞。
- source_word: עֲנָוִים
  choice: 困苦的人
  rationale: 该词可涵盖受苦、贫穷、卑微或谦卑的人；正文采用“困苦的人”以保留其社会处境与受压迫色彩，其他含义列入脚注。
- source_word: שְׁלָחַנִי
  choice: 他差遣我
  rationale: 自然表达已经发生并决定当前使命的差遣行动。
- source_word: לַחֲבֹשׁ
  choice: 包扎
  rationale: 保留包扎伤口的具体比喻，不将其直接抽象化为“医治”。
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: 伤心的人
  rationale: 自然表达“心被破碎的人”，既通俗又保留内心遭受重创的含义。
- source_word: לִקְרֹא
  choice: 宣告
  rationale: 体现公开、正式宣布自由与开释，而非一般性的呼喊。
- source_word: לִשְׁבוּיִם
  choice: 被掳的人
  rationale: 准确体现遭掳为俘的处境，并与下句“被囚的人”形成平行。
- source_word: דְּרוֹר
  choice: 自由
  rationale: 该词指释放、自由，可能带有禧年释放的回响；“自由”简洁地保留其广度。
- source_word: פְּקַח־קוֹחַ
  choice: 开释
  rationale: 此罕见组合含义不确定；“开释”在上下文中与自由平行，又能保留开启、释放的基本意象，避免正文武断限定为监门或眼睛的开启。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 正文同时体现“主”的称号与 יְהוִה 这一神名；采用中文圣经语境中庄重而通行的“主耶和华”，不将两部分合并为单一称号。
- issue: 受膏者身份的表达
  choice: 按原文译作“耶和华膏了我”
  alternative: 明确译成“使我成为弥赛亚”或直接指认某一人物
  rationale: 原文陈述说话者受膏并被差遣，却未在本节中直接说明其完整身份；直译保留先知性、王权性及后续弥赛亚诠释之间的张力。
- issue: “圣灵在我身上”的赋能含义
  choice: 主耶和华的灵在我身上
  alternative: 主耶和华的灵住在我里面；主耶和华赐我能力
  rationale: 保留原文空间性表达，不额外规定这是内住、暂时临到或某种特定教义模式。
- issue: 末句 פְּקַח־קוֹחַ 的解释
  choice: 向被囚的人宣告开释
  alternative: 向被囚的人宣告监牢开启；使被囚的人重见光明
  rationale: 原词组罕见且解释有争议；正文以与“自由”平行的概括译法保存释放主题，脚注交代“监牢开启”和“眼睛开启”等可能理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“传好消息、包扎、宣告自由、宣告开释”保留原文连续的不定式使命结构，同时避免生硬直译。“困苦的人”和“开释”的歧义均用紧邻正文词语的脚注标明。
