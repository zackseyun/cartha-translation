source:
  edition: WLC
  text: וְ/נוֹדַ֤ע בַּ/גּוֹיִם֙ זַרְעָ֔/ם וְ/צֶאֱצָאֵי/הֶ֖ם בְּ/ת֣וֹךְ הָ/עַמִּ֑ים כָּל רֹֽאֵי/הֶם֙ יַכִּיר֔וּ/ם כִּ֛י הֵ֥ם זֶ֖רַע בֵּרַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/009.yaml
  text: Their offspring will be known among the nations[a], and their descendants in the midst of the peoples[b]; all who see them will recognize that they are offspring blessed by Yahweh.
translation:
  language: zh_hans
  text: 他们的后裔必在列国中为人所知[a]，他们的子孙必在万民中间为人所知；凡看见他们的，都必认出他们是蒙耶和华赐福的后裔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国”也可译作“外邦各族”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹדַע
  choice: 必为人所知
  rationale: נודע是ידע的尼פעל式，表达“被知道、为人所知”。希伯来文单数谓语与集合名词“后裔”搭配；中文用“必为人所知”自然地保留其被动意义与将来指向。第二并列分句承接同一谓语，补出“必……为人所知”以免中文语意悬空。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גוים在这里指不同国家或民族构成的国际范围。“列国”庄重而仍易懂，也不把词义缩窄为特定的犹太人／外邦人对立。
- source_word: זַרְעָם
  choice: 他们的后裔
  rationale: זרע本义为“种子”，也常集合性地指后代。此处译作“后裔”，符合现代汉语，并保留群体性的世代含义。
- source_word: וְצֶאֱצָאֵיהֶם
  choice: 他们的子孙
  rationale: צאצאים与זרע近义，指后代。译作“子孙”既保留诗歌中的同义平行，又避免中文机械重复“后裔”。
- source_word: בְּתוֹךְ הָעַמִּים
  choice: 在万民中间
  rationale: בתוך直指“在……中间”，עמים指各族人民。“万民”在中文经文语体中自然表达众多族群，并与“列国”构成平行而不完全重复。
- source_word: כָּל רֹאֵיהֶם
  choice: 凡看见他们的
  rationale: 分词结构自然译为泛指关系结构“凡……的”，既简洁又完整保留“所有看见他们的人”之意。
- source_word: יַכִּירוּם
  choice: 都必认出他们
  rationale: נכר的使役式在此表示辨认、认出。词尾宾语明确指“他们”，因此正文保留“认出他们”；随后כי从句说明人们认出他们具有何种身份。
- source_word: כִּי
  choice: 是
  rationale: כי在此最自然地引出认知内容。中文以“认出他们是……”表达，不必另译“即／因为”，同时保留它也可能带说明色彩的句法张力。
- source_word: זֶרַע
  choice: 后裔
  rationale: 再次译作“后裔”，使读者看见它与前文זרעם是同一词根和同一核心概念。
- source_word: בֵּרַךְ
  choice: 蒙……赐福的
  rationale: ברך为主动完成式“赐福了”，其主语是耶和华，זֶרַע是受福对象。译作“蒙耶和华赐福的后裔”清楚表达关系，且比把它处理成单纯被动分词更贴近马所拉文本的形态。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的圣名音译“耶和华”，使其保持为专名而非以“主”这一称号代替。
theological_decisions:
- issue: 如何翻译圣名 יְהוָה
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字圣名。中文正文采用通行且易识别的专名“耶和华”，不以称号“上主”取代；“雅威”是另一种可能的音译。
- issue: “蒙耶和华赐福的后裔”的所指
  choice: 保留为未加限定的群体后裔
  alternative: 明确解释为以色列人、义人或某一特定末世群体
  rationale: 本节宣告列国将从这个群体身上认出耶和华的赐福，却未在本句中进一步界定其神学身份，因此不补入经文没有明说的宗派性或末世论解释。
- issue: יַכִּירוּם כִּי 的句法关系
  choice: “认出他们是……”
  alternative: “承认他们，因为……”
  rationale: 将כי理解为引出“认出”的内容最合上下文；但不增添“确知、公开承认”等强化词，以免消除原文“辨认／承认”之间可能存在的语义幅度。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。以“后裔／子孙”再现两个近义词的诗歌平行；第二分句补出原文省略而由上句支配的谓语，使中文顺畅。标点以分号区分“为人所知”的平行陈述与旁观者的辨认。
