id: ISA.61.4
reference: Isaiah 61:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָנוּ֙ חָרְב֣וֹת עוֹלָ֔ם שֹׁמְמ֥וֹת רִֽאשֹׁנִ֖ים יְקוֹמֵ֑מוּ וְ/חִדְּשׁוּ֙ עָ֣רֵי חֹ֔רֶב שֹׁמְמ֖וֹת דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/004.yaml
  text: They will rebuild the ancient ruins[a]; they will raise up the former desolations; they will renew the ruined cities[b], the desolations of generation after generation.
translation:
  language: zh_hans
  text: 他们要重建古时的废墟[a]，要使从前荒废之处重新屹立；他们要修复毁坏的城邑，就是世世代代荒废之地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古时的废墟”也可译作“久已荒废之处”；希伯来语 עוֹלָם 在这里可表示遥远的古时或长久的延续。
    reason: lexical_alternative
  - marker: b
    text: “世世代代荒废之地”直译为“一代又一代的荒废之地”，也可译作“荒废了许多代的地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: 他们要重建
  rationale: בנה本义为“建造”；因宾语是废墟，现代汉语用“重建”自然表达语境中隐含的恢复之意。
- source_word: חָרְבוֹת עוֹלָם
  choice: 古时的废墟
  rationale: חָרְבוֹת指废墟、荒场；עוֹלָם在此更可能表示久远的年代，而非形而上的“永远”。“古时的”保留其久远含义。
- source_word: שֹׁמְמוֹת רִאשֹׁנִים
  choice: 从前荒废之处
  rationale: שֹׁמְמוֹת可指荒废之地或荒凉状态；רִאשֹׁנִים在这里是时间意义上的“从前、先前”，而非严格的序数“第一”。
- source_word: יְקוֹמֵמוּ
  choice: 使……重新屹立
  rationale: 该词是קום的强化/使役性形式，表达使倒毁之物重新立起；此译保留原文具体的“立起”意象，也体现恢复之意。
- source_word: וְחִדְּשׁוּ
  choice: 他们要修复
  rationale: חדשׁ意为更新、使之复新。对毁坏的城邑而言，“修复”比直译“更新”更符合现代汉语，同时仍与前面的“重建”和“重新屹立”形成递进。
- source_word: עָרֵי חֹרֶב
  choice: 毁坏的城邑
  rationale: 这是表示特征的构造词组，即遭毁坏、成为废墟的城市；“城邑”语体庄重而易懂。
- source_word: שֹׁמְמוֹת דּוֹר וָדוֹר
  choice: 世世代代荒废之地
  rationale: דּוֹר וָדוֹר直指一代又一代，修饰长期荒废的城邑；“世世代代”保留其连续、跨代的分配意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。三个修复动词分别译为“重建”“使……重新屹立”“修复”，尽量保留原文的变化和具体意象；末句用解释性同位结构，使“世世代代荒废”与“城邑”的修饰关系在汉语中清晰。
