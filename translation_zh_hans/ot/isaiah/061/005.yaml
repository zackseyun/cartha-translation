  yaml_path: translation/ot/isaiah/061/005.yaml
  text: Foreigners will stand and shepherd your flocks[b][a], and foreigners' sons will be your farmers and your vinedressers.
translation:
  language: zh_hans
  text: 外邦人必站立，牧放你们的羊群[a]；来自异邦的人要作你们的农夫和葡萄园工人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牧放你们的羊群”也可译作“照管你们的群羊”。原文的集合名词可泛指绵羊、山羊等成群的小型牲畜。
    reason: 词义与译法说明
  - marker: b
    text: 原文直译“异邦之子”，是可用来指来自异邦之人的说法，不一定着重于他们是异邦人的亲生儿子或后代。
    reason: 文化与习语说明
lexical_decisions:
- source_word: זָרִים
  choice: 外族人
  rationale: 指本群体以外、属于其他民族的人。“外族人”在现代汉语中自然，也与下半句“异邦人的子孙”形成对应。
- source_word: וְעָמְדוּ
  choice: 必站着
  rationale: 保留动词“站立”的具体形象；在本语境中可含预备服事、就位之意，但正文不把这一含义明说出来。
- source_word: וְרָעוּ
  choice: 牧放
  rationale: רעה在此指放牧、照管牲畜。“牧放”能自然地与“羊群”搭配，并保留牧养活动的具体含义。
- source_word: צֹאנְכֶם
  choice: 你们的羊群
  rationale: צאן是指成群小型牲畜的集合名词，通常以羊群为主；“羊群”简洁自然。
- source_word: בְנֵי נֵכָר
  choice: 异邦人的子孙
  rationale: 较贴近地保留“外邦之子”的希伯来语结构及其与上半句的平行；该说法在语境中也可泛指来自异邦的人，故加注说明。
- source_word: אִכָּרֵיכֶם
  choice: 你们的农夫
  rationale: 指耕种土地的人。“农夫”是清楚、庄重且不过分限定具体农活的现代汉语表达。
- source_word: כֹרְמֵיכֶם
  choice: 你们的葡萄园工人
  rationale: 指专门料理葡萄园的人。“葡萄园工人”比宽泛的“农夫”更精确，也比生僻或古旧称谓更易懂。
theological_decisions:
- issue: 锡安复兴预言中的社会角色转换
  choice: 按经文直接描写异族人为蒙复兴的受话群体从事放牧和农耕工作。
  alternative: 将其泛化为各民族彼此合作，或仅视为富足的象征。
  rationale: 希伯来文本明确呈现异族人承担牧业与农业劳动的不对称图景。译文既不淡化这一张力，也不把它扩展为本节未明说的后期教会论结论。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“站着”的具体形象和“异邦人的子孙”的原文结构，同时用脚注说明可能的词义范围与习语含义；分号呈现两个平行分句。
