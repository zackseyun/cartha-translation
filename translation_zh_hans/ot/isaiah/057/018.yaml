  text: דְּרָכָ֥י/ו רָאִ֖יתִי וְ/אֶרְפָּאֵ֑/הוּ וְ/אַנְחֵ֕/הוּ וַ/אֲשַׁלֵּ֧ם נִֽחֻמִ֛ים ל֖/וֹ וְ/לַ/אֲבֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/018.yaml
  text: I have seen his ways[a], and I will heal him; I will lead him and restore comforts to him and to his mourners.
translation:
  language: zh_hans
  text: 我看见了他的所行，也要医治他；我要引导他，使他和为他哀伤的人重新得着安慰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּרָכָיו
  choice: 他的所行
  rationale: 复数“道路”在这里指一个人的行为和生活方式。“所行”是现代汉语中自然、庄重的表达，也保留了上下文中的道德意味。
- source_word: רָאִיתִי
  choice: 我看见了
  rationale: 完成式表示上帝已经察看并知道此人的行为；“看见了”保留其完成性及与后续应许的关联。
- source_word: וְאֶרְפָּאֵהוּ
  choice: 也要医治他
  rationale: רפא的基本义是“医治”。此处兼有身体与属灵复兴的可能，不宜缩窄为单一层面；连接词译作“也”，避免把原文简单连接明确解释成转折。
- source_word: וְאַנְחֵהוּ
  choice: 我要引导他
  rationale: נחה的使役式意为带领、引导；“引导”在现代汉语中自然，并传达上帝亲自指引此人的意思。
- source_word: וַאֲשַׁלֵּם נִחֻמִים
  choice: 使……重新得着安慰
  rationale: שׁלם的强意词干可表示偿还、补足或恢复，נִחֻמִים为复数“安慰、慰藉”。汉语通常把“安慰”作为集合性名词；这一表达自然地传达恢复或重新赐予安慰的含义。
- source_word: וְלַאֲבֵלָיו
  choice: 和为他哀伤的人
  rationale: אֲבֵלָיו指与他相关的哀悼者。“为他哀伤的人”比直译“他的哀悼者”更符合现代汉语习惯，并保留关系含义。
theological_decisions:
- issue: 上帝看见此人的所行之后仍应许医治
  choice: 用“也”连接“看见”与“医治”，保留并列形式及语境中的张力
  alternative: 译作“却仍要医治他”，明确表达让步或转折
  rationale: 希伯来文只使用普通连接词，并未明说“虽然”或“却”。上下文确有上帝明知其行为而施行医治的张力，但译文不把这种语境推论写成明确的转折关系。
- issue: 医治的范围
  choice: 保留“医治”，不限定为身体、心理或属灵层面
  alternative: 译作“使他复兴”或“使他痊愈”
  rationale: 原词可具有实际和比喻双重意味；“医治”能保留这种开放性，避免加入特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所行”保留经文语体但不生硬；后半句调整为“使……重新得着安慰”，以自然汉语表达希伯来文“恢复/补还安慰给……”的结构。
