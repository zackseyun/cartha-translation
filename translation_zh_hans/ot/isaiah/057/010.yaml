  rationale: 修正脚注a中与原文不符的替代译法，并将难解的“手的生命／活力”在正文中按其最可能的语境义自然表达为“手中重新有了力量”，同时以脚注保留原文意象及解释上的不确定性。其余措辞维持原文的中性叙述，不把上下文所暗示的负面评价增补进本节正文。
