  text: בְּ/רֹ֤ב דַּרְכֵּ/ךְ֙ יָגַ֔עַתְּ לֹ֥א אָמַ֖רְתְּ נוֹאָ֑שׁ חַיַּ֤ת יָדֵ/ךְ֙ מָצָ֔את עַל כֵּ֖ן לֹ֥א חָלִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/010.yaml
  text: In the multitude of your ways you grew weary[a], yet you did not say, ‘It is hopeless.’ You found renewed strength in your hand[c][b]; therefore you did not grow weak.
translation:
  language: zh_hans
  text: 你走了许多路，感到疲惫，却没有说：“没有希望了。”[a]你手中重新有了力量[b]，所以你没有衰弱。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“绝望了。”希伯来语词表达绝望，或认定再努力也无济于事。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近于“你手的生命（或活力）”。这是一句难解的话，也可能指你重新得了力量，或仍有能力继续下去。
    reason: lexical_alternative
  - marker: c
    text: 或译：“没有昏厥”或“没有变得软弱。”希伯来语动词可表示患病、衰弱或疲乏。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב דַּרְכֵּךְ
  choice: 你走了许多道路
  rationale: רֹב表示众多、丰盛；דֶּרֶךְ在此为复数，可指所走的道路，也可喻指追求和行事方式。译文保留“道路”的意象，同时用自然汉语表达其众多。
- source_word: יָגַעַתְּ
  choice: 已经疲惫
  rationale: יגע表示因劳苦而疲倦；此处阴性单数形式承接本段所称呼的对象。
- source_word: נוֹאָשׁ
  choice: 没有希望了
  rationale: 该词源于יאשׁ，表达绝望或认定继续努力已无用。“没有希望了”既自然，也保留原文作为直接引语的简短断语。
- source_word: חַיַּת יָדֵךְ
  choice: 手中的活力
  rationale: 这是一个含义浓缩且有争议的短语，字面涉及“手的生命／活力”；“手”也可象征能力。正文保留“手”和“活力”的意象，不直接限定为某一种具体力量。
- source_word: מָצָאת
  choice: 找到了
  rationale: מצא的基本义是“找到、发现”，这里说明受话者为何仍继续其追求。
- source_word: עַל־כֵּן
  choice: 因此
  rationale: 该短语明确表示结果或推论。
- source_word: לֹא חָלִית
  choice: 没有衰弱
  rationale: חלה可表示患病、衰弱或疲乏；“没有衰弱”适合上下文，同时没有把含义局限为身体疾病。
theological_decisions:
- issue: 本节末句所描述的坚持具有何种评价
  choice: 正文以中性措辞陈述其虽疲惫却仍继续，没有把这种坚持写成值得赞扬的美德。
  alternative: 可将其明确译为在罪恶追求中的顽固不改。
  rationale: 以赛亚书57章的上下文是在责备偶像崇拜和不忠，因此这份坚持带有负面语境；但原句本身没有加入“顽固”或“犯罪”等评价词，故不在正文中增补，让上下文保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“道路”保留原文兼具实际路径与行为追求的隐喻；“手中的活力”刻意保留难解短语的身体意象和语义张力。引号及标点按现代简体中文规范处理。
