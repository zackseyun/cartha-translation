  text: בְּ/חַלְּקֵי נַ֣חַל חֶלְקֵ֔/ךְ הֵ֥ם הֵ֖ם גּוֹרָלֵ֑/ךְ גַּם לָ/הֶ֞ם שָׁפַ֥כְתְּ נֶ֨סֶךְ֙ הֶעֱלִ֣ית מִנְחָ֔ה הַ֥/עַל אֵ֖לֶּה אֶנָּחֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/006.yaml
  text: Among the smooth stones of the valley is your portion[a]; they, they are your lot. Even to them you have poured out a drink offering; you have offered up a grain offering[b]. Shall I relent because of these things?
translation:
  language: zh_hans
  text: 溪谷中那些光滑的石头，就是你的份[a]；它们，它们就是你所得的阄。你还向它们倾倒奠酒，献上谷物祭。我岂会因这些事而改变心意吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“溪谷的各份中”。希伯来语很可能指溪谷河床中光滑的石头，与这里偶像崇拜的语境相符。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我岂会因这些事得到安慰吗？”这里的希伯来语动词也可表示“得到安慰”或“受到安抚”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַלְּקֵי נַחַל
  choice: 溪谷中那些光滑的石头
  rationale: חַלְּקֵי在此很可能指溪谷河床中光滑的石头；结合偶像崇拜的语境及后文复数代词“它们”，补出“石头”比译作“溪谷的份额”更通顺，也保留地点意象。
- source_word: חֶלְקֵךְ
  choice: 你的份
  rationale: חֵלֶק表示分得的份额；译作“份”简洁自然，并与下句的抽签分配意象相呼应。
- source_word: הֵם הֵם
  choice: 它们，它们
  rationale: 保留希伯来文重复所形成的强调和指斥语气，不将其弱化为普通代词。
- source_word: גּוֹרָלֵךְ
  choice: 你所得的阄
  rationale: גּוֹרָל本指用于分配的阄，也可指抽签所得的份；“你所得的阄”保留具体的抽签意象及与“你的份”的平行。
- source_word: נֶסֶךְ
  choice: 奠祭
  rationale: 这是倒出液体的祭礼用语；“浇奠祭”简明表达其祭祀动作。
- source_word: הֶעֱלִית מִנְחָה
  choice: 献上谷物祭
  rationale: עלה的使役式在献祭语境中指献上；מִנְחָה在此通常指谷物祭。“献上谷物祭”既明确又符合现代汉语表达。
- source_word: הַעַל אֵלֶּה אֶנָּחֵם
  choice: 我岂会因这些事而回心转意呢？
  rationale: נחם的尼法勒词形可表示回心转意、收回行动，也可表示得安慰或受安抚；本句处于审判性的责问中，正文采用反问式“回心转意”，同时以脚注保留另一语义可能。
theological_decisions:
- issue: 末尾反问中 אֶנָּחֵם 的含义
  choice: 理解为上帝是否会因这些事而回心转意、不再施行审判
  alternative: 理解为上帝是否会因这些事得到安慰或被安抚
  rationale: 上下文谴责偶像崇拜，因此正文采用带否定意味的反问，但该动词确有“得安慰、受安抚”的语义范围，故不把另一理解排除，而在脚注中明示。
translation_notes:
  register: 采用现代、庄重而可懂的普通话。“谷物祭”比传统术语“素祭”更直观；保留“它们，它们”的重复，以呈现原文强调。称呼对象在希伯来文中为阴性单数，汉语不另加性别标记。
