source:
  edition: WLC
  text: הַ/נֵּֽחָמִים֙ בָּֽ/אֵלִ֔ים תַּ֖חַת כָּל עֵ֣ץ רַעֲנָ֑ן שֹׁחֲטֵ֤י הַ/יְלָדִים֙ בַּ/נְּחָלִ֔ים תַּ֖חַת סְעִפֵ֥י הַ/סְּלָעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/005.yaml
  text: you who burn with lust among the terebinths[a], under every green tree, who slaughter the children in the wadis[b], under the clefts of the rocks.
translation:
  language: zh_hans
  text: '你们在橡树间欲火中烧[a]，

    在每一棵青翠的树下，

    在干河谷中[b]宰杀儿女，

    在岩石的裂隙下。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “橡树”也可指笃耨香树；这里的希伯来词可能泛指用于祭祀的大树。
    reason: 保留树种上的词义不确定性。
  - marker: b
    text: “干河谷”或译“谷地”。原文所指常为峡谷或季节性有水的河床。
    reason: 说明地貌词的范围，并保留传统译法。
lexical_decisions:
- source_word: הַנֵּחָמִים
  choice: 欲火中烧
  rationale: 按此处的词形和上下文，表达被欲望点燃、情欲亢奋之意；译文保留先知对淫乱与偶像崇拜交织的控诉，而不把它弱化为一般的“发热”。
- source_word: בָּאֵלִים
  choice: 在橡树间
  rationale: 平行句“在每一棵青翠的树下”表明这里最可能指用于祭祀的大树，而不是“众神”。אֵלִים 可指笃耨香树或橡树；正文采用现代中文较易理解的“橡树”，并以脚注保留词义范围。
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: 在每一棵青翠的树下
  rationale: 直译这一常见的希伯来语意象；它在先知书中常指非法敬拜的场所，但正文不额外加入解释。
- source_word: שֹׁחֲטֵי
  choice: 宰杀
  rationale: 该词常用于宰牲，具有祭祀色彩；“宰杀”既保留暴力感，也不抹去可能的献祭含义。
- source_word: הַיְלָדִים
  choice: 儿女
  rationale: יְלָדִים 泛指孩子或后代；“儿女”自然、庄重，且不限定性别。
- source_word: בַּנְּחָלִים
  choice: 在干河谷中
  rationale: נְחָלִים 指沟谷、峡谷或季节性河床。“干河谷”比音译词“瓦迪”更易为普通中文读者理解，同时保留其地貌特征。
- source_word: תַּחַת סְעִפֵי הַסְּלָעִים
  choice: 在岩石的裂隙下
  rationale: סְעִפִים 本指分叉、分支；与岩石连用时，可指裂隙、岩缝或突出的岩层。“岩石的裂隙”在中文中自然，并保留隐蔽岩地的图景。
theological_decisions:
- issue: 是否明确开头分词所含的情欲与祭祀意味
  choice: 译作“欲火中烧”
  alternative: “使自己发热”或“激动起来”
  rationale: 本节把树下的行为与杀儿献祭并列，语境支持情欲与偶像崇拜相交织的控诉。“欲火中烧”传达其强度，但不进一步断定具体仪式或引入宗派解释。
- issue: אֵלִים 是“大树”还是“众神”
  choice: 按树木理解，译作“橡树”
  alternative: “众神”
  rationale: 紧接的“在每一棵青翠的树下”构成明确的地点平行，因此树木义明显更合语境；脚注仍说明树种并不完全确定。
translation_notes:
  register: 采用现代、庄重而直接的中文。诗行保持原文四个短语的递进和平行；“欲火中烧”“宰杀儿女”保留先知控诉的强烈语气。
