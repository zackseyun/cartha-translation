  text: וְ/אֶת מִ֞י דָּאַ֤גְתְּ וַ/תִּֽירְאִי֙ כִּ֣י תְכַזֵּ֔בִי וְ/אוֹתִ/י֙ לֹ֣א זָכַ֔רְתְּ לֹא שַׂ֖מְתְּ עַל לִבֵּ֑/ךְ הֲ/לֹ֨א אֲנִ֤י מַחְשֶׁה֙ וּ/מֵ֣/עֹלָ֔ם וְ/אוֹתִ֖/י לֹ֥א תִירָֽאִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/011.yaml
  text: And whom did you dread and fear[a], so that you lied and did not remember me, did not lay it to your heart? Was it not because I have kept silent, and that from long ago[b], that you do not fear me?
translation:
  language: zh_hans
  text: 你究竟顾忌谁、惧怕谁，以致你说谎，不记念我，也没有把这事放在心上[a]？难道不是因为我从很久以前就一直沉默，你才不敬畏我吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放在心上”直译是“放在你的心上”，意思也可译作“认真看待”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּאַגְתְּ וַתִּירְאִי
  choice: 顾忌……、惧怕……
  rationale: 两个动词并列表达因忧惧而产生的畏缩。“顾忌”体现דאג所含的忧虑和畏惧，“惧怕”对应常用的ירא，并保留原文的成对表达。
- source_word: כִּי תְכַזֵּבִי
  choice: 以致你说谎
  rationale: 将כִּי理解为结果，表明对别人的畏惧导致虚假行为；“以致”在现代汉语中清楚保留这一关系。
- source_word: וְאוֹתִי לֹא זָכַרְתְּ
  choice: 不记念我
  rationale: “记念”既可表达认知上的想起，也能保留此处关系性、盟约性的分量，语体庄重而通顺。
- source_word: לֹא שַׂמְתְּ עַל לִבֵּךְ
  choice: 也不把这事放在心上
  rationale: 保留希伯来语“放在心上”的意象，同时补出汉语所需的泛指宾语“这事”；所指仍由上下文决定，不将其限定得过窄。
- source_word: מַחְשֶׁה
  choice: 我一直沉默
  rationale: חשה意为保持沉默；“一直沉默”自然表达持续状态，也为后面的时间短语留下空间。
- source_word: וּמֵעוֹלָם
  choice: 从很久以前就是这样
  rationale: עוֹלָם在这里指延伸至久远过去的时段，而非抽象意义上的永恒；这一译法自然表达长期以来的沉默。
- source_word: וְאוֹתִי לֹא תִירָאִי
  choice: 你才不敬畏我
  rationale: “才”承接反问中的因果或结果关系；对上帝使用“敬畏”，既包含惧怕，也符合本句所涉及的尊崇含义。
theological_decisions:
- issue: 上帝长期沉默的含义
  choice: 将上帝长久沉默呈现为百姓不敬畏他的缘由或契机
  alternative: 把沉默解释为上帝完全隐退、漠不关心，或认可百姓的行为
  rationale: 原文把百姓缺乏敬畏与上帝长久沉默联系起来，却没有进一步界定这种沉默的神学性质；译文保留这层张力，不作超出经文的推论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你”在原文中为阴性单数，但现代汉语正文不宜仅凭语法性别改用“她”；上下文中的人格化对象由段落整体显明。两个反问及其责问语气均予保留。
