    issue: 时间短语的指向略显松散
    rationale: “我一直沉默，从很久以前就是这样”中的“这样”需回指前句，且“一直”与“从很久以前”并列后略显重复。将时间短语直接纳入谓语可更清楚地表达“我从很久以前就一直沉默”。
