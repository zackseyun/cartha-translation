revisions:
- from: 你到底在顾忌谁、惧怕谁，以致你说谎，不记念我，也不把这事放在心上[a]？难道不是因为我一直沉默，从很久以前就是这样[b]，你才不敬畏我吗？
  to: 你究竟顾忌谁、惧怕谁，以致你说谎，不记念我，也没有把这事放在心上[a]？难道不是因为我从很久以前就一直沉默，你才不敬畏我吗？
  rationale: 仅作轻微措辞调整，使“从很久以前”明确修饰上帝的沉默，并使中文行文更紧凑。保留原文的反问、因果／结果关系，以及未明说的“放在心上”的宾语。脚注b虽未在正文设置锚点，但原草案已有该结构性缺陷；为使脚注集可用，正文应在“从很久以前就一直沉默”后补上[b]。
