id: ISA.57.16
reference: Isaiah 57:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י לֹ֤א לְ/עוֹלָם֙ אָרִ֔יב וְ/לֹ֥א לָ/נֶ֖צַח אֶקְּצ֑וֹף כִּי ר֨וּחַ֙ מִ/לְּ/פָנַ֣/י יַֽעֲט֔וֹף וּ/נְשָׁמ֖וֹת אֲנִ֥י עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/016.yaml
  text: For I will not contend forever[a], nor will I be angry without end, for the spirit would grow faint before me[b], and the breaths that I have made.
translation:
  language: zh_hans
  text: 因为我必不永远相争，也不长久发怒；因为灵[a]会在我面前衰微，我所造的气息[b]也会衰微。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译作“气息”。希伯来语 רוּחַ 在这里可指人的灵或生命气息。
    reason: lexical_alternative
  - marker: b
    text: “气息”也可译作“生命”或“灵魂”。希伯来语 נְשָׁמוֹת 字面指复数的“气息”，这里指上帝所造的生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 在否定结构中表示无止境的持续时间；“不永远”自然保留原文的时间含义。
- source_word: אָרִיב
  choice: 相争
  rationale: ריב 可指争讼、争辩或与人对抗；此处涉及上帝持续的责罚与对抗，“相争”既保留关系性和司法色彩，又适合现代汉语。
- source_word: לָנֶצַח
  choice: 长久
  rationale: 与 לְעוֹלָם 构成同义平行；译作“长久”避免汉语中机械重复，同时保留持续不止的含义。
- source_word: אֶקְּצֹף
  choice: 发怒
  rationale: קצף 表示愤怒；“发怒”清楚、庄重，也不额外强化原文没有明说的程度。
- source_word: רוּחַ
  choice: 灵
  rationale: 此处与 נְשָׁמוֹת 平行，指受造者维系生命的灵或气息，而非特指圣灵；正文采用“灵”以保留其人格生命层面的含义，并以脚注注明“气息”这一可能译法。
- source_word: מִלְּפָנַי
  choice: 在我面前
  rationale: 字面含义为“从我面前”，在此惯用地表达受造者在上帝面前、承受其怒气时衰微。
- source_word: יַעֲטוֹף
  choice: 会衰微
  rationale: עטף 可表示昏厥、衰弱或被压倒；“衰微”传达生命逐渐不支的状态，又不把语义限定为突然昏倒。
- source_word: נְשָׁמוֹת
  choice: 气息
  rationale: נשמה 的复数可指生命的气息，并与上帝造生命的意象相合；避免正文采用“灵魂”而带入原文未必要求的技术性人论含义。
- source_word: אֲנִי עָשִׂיתִי
  choice: 我所造的
  rationale: 保留明确主语“我”和 עשה 的“造、做成”之意；现代汉语中无需另加“亲自”便可自然体现主语。
theological_decisions:
- issue: רוּחַ 与 נְשָׁמוֹת 的人论含义
  choice: 将二者理解为受造者的灵与生命气息，不理解为圣灵。
  alternative: 可将 רוּחַ 译作“气息”，或将 נְשָׁמוֹת 译作“灵魂／生命”。
  rationale: 本节以上帝不持续发怒为主题，理由是他所造之人的生命在他面前会衰微。上下文因此指向人的受造生命；同时通过正文与脚注保留“灵／气息”和“气息／生命”等词义张力。
- issue: 末句与 יַעֲטוֹף 的句法关系
  choice: 在汉语中补出“也会衰微”，把“我所造的气息”视为与“灵”并列、共同受该谓语支配。
  alternative: 可把末句理解为对前面的“灵”作进一步说明，即“就是我所造的气息”。
  rationale: 原文以连接词 ו 引出复数名词短语而未重复谓语，允许并列或近似同位的理解；正文采用较通顺的并列读法，但不据此建立额外的人论区分。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“必不……也不……”保留诗歌平行结构；第二分句重复“会衰微”，使省略谓语的希伯来语末句在汉语中完整自然。脚注标记紧随各自解释的词语，避免歧义。
