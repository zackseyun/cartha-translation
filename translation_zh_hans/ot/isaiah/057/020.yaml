source:
  edition: WLC
  text: וְ/הָ/רְשָׁעִ֖ים כַּ/יָּ֣ם נִגְרָ֑שׁ כִּ֤י הַשְׁקֵט֙ לֹ֣א יוּכָ֔ל וַ/יִּגְרְשׁ֥וּ מֵימָ֖י/ו רֶ֥פֶשׁ וָ/טִֽיט׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/020.yaml
  text: But the wicked are like the tossing sea[a], for it cannot be quiet[b], and its waters toss up mire and mud.
translation:
  language: zh_hans
  text: 但恶人好像翻腾的海[a]，因为它无法平静，它的水翻涌出污物和淤泥[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被驱赶的海”或“动荡的海”。希伯来语原词本有“被驱赶、被赶动”的意思，这里描绘海受扰动而翻腾。
    reason: 词义与意象的可选译法
  - marker: b
    text: “翻涌出”也可译为“冲出”或“抛出”。这里所用的希伯来语动词与前面形容海的词来自同一词根。
    reason: 词义备选及原文用词呼应
lexical_decisions:
- source_word: וְהָרְשָׁעִים
  choice: 但恶人
  rationale: רְשָׁעִים指邪恶的人；结合上文义人所得的平安，句首连接词在此具有转折作用，译为“但”符合现代汉语篇章衔接。
- source_word: כַּיָּם נִגְרָשׁ
  choice: 好像翻腾的海
  rationale: כַּ标示比拟；נִגְרָשׁ源于“驱赶、赶出”，描绘海受外力搅动、翻腾不息。“翻腾的海”在汉语中自然鲜明，同时保留动态意象。
- source_word: כִּי הַשְׁקֵט לֹא יוּכָל
  choice: 无法平静
  rationale: שׁקט表示安静、平息，יוּכָל表示能够；合译为“无法平静”，简洁地表达海不能止息。
- source_word: וַיִּגְרְשׁוּ מֵימָיו
  choice: 海水不断翻涌出
  rationale: 主语是海水，גרשׁ在此表示将东西驱出、冲出。“翻涌出”贴合海浪运动；“不断”把前句不能平静所包含的持续状态自然带入汉语，但不改变动作内容。
- source_word: רֶפֶשׁ וָטִיט
  choice: 污泥和淤泥
  rationale: רֶפֶשׁ指肮脏的泥泞、泥污，טִיט指泥、黏土或淤泥。“污泥和淤泥”既区分近义词，也保留原文并列叠加的浑浊意象。
theological_decisions:
- issue: 句首连接词与上下文的对比关系
  choice: 但恶人
  alternative: 恶人却／而恶人
  rationale: 上文宣告平安，本节转向恶人；“但”明确呈现原文在语境中的对比，却不额外引入神学解释。
- issue: 海的状态是“被驱赶”还是“翻腾”
  choice: 翻腾的海
  alternative: 被驱动的海／动荡的海
  rationale: 希伯来词的基本意象是受驱赶，但汉语“被驱动的海”生硬。“翻腾”自然表达由此造成的海面状态，并以脚注保留较形式对应的译法。
- issue: 恶人与海的比喻关系
  choice: 保留直接比拟，不说明其象征意义
  alternative: 解释为恶人内心不安或行为造成污秽
  rationale: 经文只陈述恶人像无法平静、翻出泥污的海；不把比喻限定为心理状态或道德后果，可保留其意象张力与解释空间。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“翻腾的海”“无法平静”“污泥和淤泥”通俗易懂，并保留原文强烈、持续的动态画面；分号呈现解释与结果之间的紧密推进。
