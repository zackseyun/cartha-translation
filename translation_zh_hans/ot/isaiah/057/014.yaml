  text: וְ/אָמַ֥ר סֹֽלּוּ סֹ֖לּוּ פַּנּוּ דָ֑רֶךְ הָרִ֥ימוּ מִכְשׁ֖וֹל מִ/דֶּ֥רֶךְ עַמִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/014.yaml
  text: And it will be said[a], “Build up, build up; clear the way; remove the stumbling block from the way of my people.”
translation:
  language: zh_hans
  text: 必有人说[a]：“修筑，修筑！清理道路，把绊脚石从我子民的路上挪开。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必有人说。”希伯来文没有明确指出说话者。后面的命令采用修筑道路的意象。
    reason: 说明开头公式的语法歧义，并交代“修筑”的道路工程意象。
lexical_decisions:
- source_word: וְאָמַר
  choice: 有人要说
  rationale: 该形式未明说主语；用不定指表达保留宣告公式的简洁和说话者身份的开放性，也比汉语被动式更自然。
- source_word: סֹלּוּ סֹלּוּ
  choice: 修筑，修筑
  rationale: סלל在道路语境中指堆筑、修筑道路；保留重复，以传达命令的强调语气和筑路意象。
- source_word: פַּנּוּ דָרֶךְ
  choice: 清理道路
  rationale: פנה在此指清除、腾出，使道路可通行；“清理道路”简明自然，并与后句移除障碍的意象相连。
- source_word: הָרִימוּ
  choice: 挪开
  rationale: רום的使役式本义是举起；与“绊脚石”连用时表达将其抬走、移除。“挪开”在现代汉语中自然，同时保留具体动作感。
- source_word: מִכְשׁוֹל
  choice: 绊脚石
  rationale: 该词指使人跌倒之物，也可含比喻意义；“绊脚石”兼具具体形象与延伸含义。
- source_word: מִדֶּרֶךְ עַמִּי
  choice: 从我子民的路上
  rationale: מן表示从某处移走，דרך עמי指属于或供“我子民”行走的路；此译保留空间关系和第一人称所属关系。
theological_decisions:
- issue: 开头宣告公式的说话者身份
  choice: 译为不定指的“有人要说”，不明确指定说话者
  alternative: 译为“他（上帝）说”或被动式“必有话说”
  rationale: 希伯来文本没有明示主语。上下文容许将其理解为不定指或近似被动的宣告公式，因此不补出上帝或其他特定说话者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“修筑，修筑”刻意保留原文重复；用“绊脚石”保存具体意象及潜在比喻义。
