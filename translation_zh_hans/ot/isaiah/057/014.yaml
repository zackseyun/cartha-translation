  naturalness: 除开头外，措辞庄重、简洁且符合现代标准汉语。“必有人说”比“有人要说”更自然地表达未指明说话者的宣告，而不引入其意愿或意图。
  terminology: “修筑，修筑”“清理道路”“绊脚石”“我子民”均恰当，并保留道路工程和阻碍物的具体意象。无需改动这些核心术语。
