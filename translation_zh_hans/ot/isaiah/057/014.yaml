  - severity: low
    issue: 脚注中的“必有话说”不够精确
    rationale: “必有话说”在现代汉语中容易指“有话可讲”或“有意见”，不等同于“必有人说”。脚注宜以完整的替代译法表明开头公式的另一种处理。
