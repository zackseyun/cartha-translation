  text: עַ֤ל הַר גָּבֹ֨הַּ֙ וְ/נִשָּׂ֔א שַׂ֖מְתְּ מִשְׁכָּבֵ֑/ךְ גַּם שָׁ֥ם עָלִ֖ית לִ/זְבֹּ֥חַ זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/007.yaml
  text: On a high and lofty mountain you set your bed[b][a]; there too you went up to sacrifice a sacrifice.
translation:
  language: zh_hans
  text: 你在高耸的山上安置你的床[a]；你也上到那里[b]献祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的床”在本段语境中可能含有以不正当的性关系比喻偶像崇拜的意味。
    reason: cultural_note
  - marker: b
    text: “也上到那里”也可译作“甚至到那里去献祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַר גָּבֹהַּ וְנִשָּׂא
  choice: 在高耸的山上
  rationale: עַל 表示地点，הַר 是“山”；גָּבֹהַּ וְנִשָּׂא 是一对强调高度的形容词。译作“高耸”以自然、凝练的现代汉语传达叠加强调，避免生硬的“高而高举”。
- source_word: שַׂמְתְּ
  choice: 安置
  rationale: שׂים 的阴性单数第二人称完成式，意为“放置、安放”。“安置”与“床”搭配自然，也保留主动设置之意。
- source_word: מִשְׁכָּבֵךְ
  choice: 你的床
  rationale: 该词可指床或躺卧之处；本段语境中带有以性关系比喻偶像崇拜的意味。保留具体意象，不在正文中把隐喻解释出来。
- source_word: גַּם שָׁם
  choice: 也……那里
  rationale: גַּם 表示附加或强调，שָׁם 为“那里”。按汉语语序译成“也上到那里”，可理解为“也在那里／甚至到那里”，并以脚注保留强调性译法。
- source_word: עָלִית
  choice: 上到
  rationale: עלה 的阴性单数第二人称完成式，基本义为“上去、登上”；山地语境中“上到那里”自然且保留空间方向。
- source_word: לִזְבֹּחַ זָבַח
  choice: 献祭
  rationale: 动词与同根名词连用，直译近于“宰献祭物／献上祭牲”。现代汉语以“献祭”自然表达礼仪性行为；同根重复在汉语中若机械保留会显得累赘。
theological_decisions:
- issue: “床”在偶像崇拜语境中的隐喻力量
  choice: 正文保留“你的床”，脚注说明其可能含义
  alternative: 你的淫祀之床；你行邪淫的地方
  rationale: 希伯来文以具体的“床”构成控诉，让性意象与偶像崇拜之间的张力留给上下文。直接解释为“淫祀”会把诠释写入正文。
- issue: זבח 的祭祀含义
  choice: 献祭
  alternative: 宰杀祭牲；献上祭牲
  rationale: 这里指山上非法崇拜中的祭祀活动。“献祭”保留礼仪含义，又不把焦点过度移到宰杀动作上。
- issue: גַּם שָׁם 的强调程度
  choice: 正文译为“也上到那里”，脚注列出“甚至到那里”
  alternative: 甚至到那里
  rationale: גַּם 可作附加性的“也”，也可在语境中带强调意味。正文采用较中性的读法，脚注保留较强译法，避免消除原文可能的语气差异。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留第二人称阴性单数所针对的拟人化受责对象，但汉语不显性标注语法性别。分号呈现两个紧密相连的控诉动作。
