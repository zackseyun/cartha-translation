id: ISA.57.13
reference: Isaiah 57:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/זַֽעֲקֵ/ךְ֙ יַצִּילֻ֣/ךְ קִבּוּצַ֔יִ/ךְ וְ/אֶת כֻּלָּ֥/ם יִשָּׂא ר֖וּחַ יִקַּח הָ֑בֶל וְ/הַ/חוֹסֶ֥ה בִ/י֙ יִנְחַל אֶ֔רֶץ וְ/יִירַ֖שׁ הַר קָדְשִֽׁ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/013.yaml
  text: When you cry out[a], let your gathered idols rescue you! But the wind will carry all of them off; a breath will take them away[c][b]. But whoever takes refuge in me will inherit the land and possess my holy mountain.
translation:
  language: zh_hans
  text: 你呼求时，就让你聚集的那些偶像[a]来救你吧！风必把它们全都卷走，气息必把它们带走[b]。但投靠我的，必承受这地[c]，必得着我的圣山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你聚集的那些偶像”直译为“你所聚集的”；也可能指所聚集的盟友或其他虚假的倚靠对象。
    reason: lexical_alternative
  - marker: b
    text: 原文的“风”和“气息”（也可指蒸气或虚空）构成诗意对应，强调这些对象轻易就会消失。
    reason: cultural_note
  - marker: c
    text: “这地”也可译作“土地”或“大地”；这里因下文提到圣山，译作“这地”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזַעֲקֵךְ
  choice: 你呼求时
  rationale: 介词בְּ与该形式在此表达时间关系；“呼求时”自然地呈现先知讥诮中的求救场景。
- source_word: יַצִּילֻךְ
  choice: 就让……来救你吧
  rationale: 虽为未完成式，语境中带反讽挑战意味；这一表达比单纯的将来陈述更能传达原文语气。
- source_word: קִבּוּצַיִךְ
  choice: 你聚集的那些偶像
  rationale: 该词字面指所聚集之物；本章谴责偶像崇拜，故正文按最可能的语境所指译为偶像，同时以脚注保留盟友或其他倚靠对象的可能。
- source_word: וְאֶת כֻּלָּם
  choice: 它们全都
  rationale: 直接回指前面的所聚集之物，并保留“全部”的强调。
- source_word: יִשָּׂא רוּחַ
  choice: 风必把它们全都卷走
  rationale: רוּחַ在此与הָבֶל构成诗意对应，宜取“风”；“卷走”自然表达נשׂא所描绘的轻易带走。
- source_word: יִקַּח הָבֶל
  choice: 一口气就把它们吹去
  rationale: הָבֶל可指气息、雾气或虚空；与“风”平行时，具体的“气息”意象最贴切，“一口气”也突出这些对象不堪一击。
- source_word: וְהַחוֹסֶה בִי
  choice: 但投靠我的
  rationale: 分词表达持续以神为庇护和倚靠的姿态；中文以泛指结构保留代表性单数，而不限定性别。
- source_word: יִנְחַל אֶרֶץ
  choice: 必承受这地
  rationale: נחל表示承受产业；结合随后提到圣山，אֶרֶץ较可能指应许之地。“这地”使中文指向自然，同时脚注保留“全地”的可能。
- source_word: וְיִירַשׁ הַר קָדְשִׁי
  choice: 必得着我的圣山
  rationale: ירשׁ有占有、承受之意；“得着”避免与前句重复，又保留取得产业的含义。
theological_decisions:
- issue: קִבּוּצַיִךְ（你所聚集的）的所指
  choice: 正文理解为聚集的偶像
  alternative: 所聚集的盟友、群体或其他虚假倚靠对象
  rationale: 以赛亚书57章的直接语境集中谴责偶像崇拜，故“偶像”最符合上下文；但希伯来词本身没有明说偶像，因此用脚注保留歧义。
- issue: אֶרֶץ的范围
  choice: 这地，即与锡安语境相连的土地
  alternative: 全地或大地
  rationale: 与下一分句“我的圣山”并列时，土地和锡安的具体语境更强；脚注保留该词可能具有的较广范围，避免把争议静默化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就让……来救你吧”传达先知反讽式的挑战；“风……一口气……”保留希伯来诗句的平行意象。正文适度明确偶像语境，同时借脚注保存原词所指及אֶרֶץ范围的真实歧义。
