  yaml_path: translation/ot/isaiah/057/021.yaml
  text: There is no peace," says my God[b][a], "for the wicked.
translation:
  language: zh_hans
  text: 我的上帝[b]说：“恶人没有平安[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可译作“福祉”或“健全圆满”；希伯来语 שָׁלוֹם 的含义不只指没有冲突。
    reason: lexical_alternative
  - marker: b
    text: 以赛亚书48:22有十分相近的表述：“耶和华说：‘恶人没有平安。’”但本节希伯来文作“我的上帝”。
    reason: cross_reference
lexical_decisions:
- source_word: אֵין
  choice: 得不到
  rationale: 这里是否定某事对某类人存在或可得；与“平安”及介词短语连用时，“得不到”是自然的现代汉语，也保留绝对否定的力度。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: “平安”是 שָׁלוֹם 的常用对应词，在本语境中既可指安宁，也含福祉、健全圆满之意；脚注保留其较宽语义。
- source_word: אָמַר
  choice: 说
  rationale: 虽为完成式，该形式在先知宣告的引语框架中可自然译为当前有效的“说”，无需强化为“宣告”。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 忠实保留希伯来文第一人称单数所属后缀，不与以赛亚书48:22的平行措辞协调，也不省略“我的”。
- source_word: לָרְשָׁעִים
  choice: 恶人得不到
  rationale: 介词 ל 在此表示所涉及或可领受的一方；把信息结构调整为“恶人得不到平安”，符合现代汉语，同时保留“恶人”这一道德类别。
theological_decisions:
- issue: 神谕引述者的称谓
  choice: 保留“我的上帝”
  alternative: 按以赛亚书48:22协调为“耶和华”，或简化为“上帝”
  rationale: 马所拉文本明确为 אֱלֹהַי（“我的上帝”）；保留第一人称所属关系，可避免因平行经文而改写本文，也不额外界定说话者身份。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。将希伯来语存在否定结构转换为汉语主谓结构“恶人得不到平安”，避免生硬的“没有平安给恶人”；保留“我的上帝”所带来的第一人称张力。所有脚注标记均置于正文中。
