id: ISA.57.1
reference: Isaiah 57:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/צַּדִּ֣יק אָבָ֔ד וְ/אֵ֥ין אִ֖ישׁ שָׂ֣ם עַל לֵ֑ב וְ/אַנְשֵׁי חֶ֤סֶד נֶֽאֱסָפִים֙ בְּ/אֵ֣ין מֵבִ֔ין כִּֽי מִ/פְּנֵ֥י הָ/רָעָ֖ה נֶאֱסַ֥ף הַ/צַּדִּֽיק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/001.yaml
  text: The righteous man perishes[a], and no one takes it to heart; men of faithful love are gathered away, with no one understanding that the righteous man is gathered away because of evil.
translation:
  language: zh_hans
  text: 义人灭亡，却无人放在心上；忠信仁爱的人被收去，也无人明白：义人被收去，离开祸患。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸患”也可译作“邪恶”；或理解为义人被收去，免遭将临的灾难。
    reason: 原文 רָעָה 可指道德上的邪恶或灾祸；מִפְּנֵי 可表达离开、免受或在……面前被移去。脚注保留这些可能性，主文不将其限定为明确目的。
lexical_decisions:
- source_word: הַצַּדִּיק
  choice: 义人
  rationale: 带冠词的阳性单数形容词作名词用，指一个义人，也可具代表性；汉语“义人”自然、庄重，并保留道德及圣约语境中的含义。
- source_word: אָבָד
  choice: 灭亡
  rationale: אבד 的 Qal 完成式可表示死亡、消逝或失落；“灭亡”切合本节哀叹死亡的语境，又不额外说明死因。
- source_word: שָׂם עַל לֵב
  choice: 放在心上
  rationale: 直译性较强且是现代汉语常用表达，传达认真留意并从内心看重之意。
- source_word: אַנְשֵׁי חֶסֶד
  choice: 忠信仁爱的人
  rationale: חֶסֶד兼有忠诚、坚定的爱与仁慈之意；“忠信仁爱”保留其丰富内涵，而不把词义缩减为单纯的怜悯或敬虔。
- source_word: נֶאֱסָפִים / נֶאֱסַף
  choice: 被收去
  rationale: 保留 אסף 的“聚集、收取”意象及其在死亡语境中的委婉意味，同时维持前后两次重复。
- source_word: בְּאֵין מֵבִין
  choice: 也无人明白
  rationale: 以自然汉语表达伴随情形：这些人被收去时，没有人领会其意义。
- source_word: כִּי
  choice: （冒号引出所不明白的内容）
  rationale: 此处最自然地引出“无人明白”的具体内容；汉语用冒号即可清楚表达，无须机械译出连接词。
- source_word: מִפְּנֵי הָרָעָה
  choice: 避开祸患
  rationale: מִפְּנֵי 可表达从某事面前离开、免受其害；רָעָה 在此很可能指将临的灾祸。“避开祸患”清楚表达义人被收去而免遭灾祸的意义，同时脚注保留“邪恶”的可能。
theological_decisions:
- issue: הָרָעָה 指道德上的“邪恶”，还是处境中的“祸患／灾难”
  choice: 祸患
  alternative: 邪恶；将临的灾难
  rationale: 上下文与 מִפְּנֵי 的空间／躲避含义较支持义人被收去而免遭将临灾祸；但 רָעָה 本身也可指邪恶，因此在脚注中保留该语义张力。
- issue: 义人“被收去”是否暗示神使其免受将临灾祸
  choice: 译为“是要避开祸患”
  alternative: 因邪恶而被收去；从邪恶面前被收去
  rationale: 此译法符合希伯来语常见理解，并让因果或目的意味在现代汉语中清楚可懂；不进一步说明义人死后的状态，也不导入特定宗派教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“义人”“放在心上”“被收去”保留经文的凝练与重复；“忠信仁爱的人”兼顾 חֶסֶד 的忠诚和仁爱内涵。脚注标记置于相关歧义短语之后。
