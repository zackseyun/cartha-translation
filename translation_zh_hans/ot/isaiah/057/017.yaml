source:
  edition: WLC
  text: בַּ/עֲוֺ֥ן בִּצְע֛/וֹ קָצַ֥פְתִּי וְ/אַכֵּ֖/הוּ הַסְתֵּ֣ר וְ/אֶקְצֹ֑ף וַ/יֵּ֥לֶךְ שׁוֹבָ֖ב בְּ/דֶ֥רֶךְ לִבּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/017.yaml
  text: Because of the iniquity of his unjust gain I was angry[a], and I struck him; I hid myself and was angry[b], and he went on backsliding in the way of his heart.
translation:
  language: zh_hans
  text: 因他贪取不义之财的罪孽，我发怒[a]，击打他；我隐藏自己，又发怒[b]；他沿着自己心所定的路，继续背道而行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贪取不义之财”或译“贪婪”。希伯来词既可指贪婪的欲望，也可指因贪婪而得的不义利益。
    reason: lexical_alternative
  - marker: b
    text: “我隐藏自己”或译“我掩面”。“掩面”是圣经中常见的说法，但这里的希伯来原文没有明说“脸”。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲוֺן
  choice: 因……的罪
  rationale: 介词 בְּ 在此按上下文表原因；这一译法自然地说明上帝发怒的缘由，同时保留 עָוֹן 的罪责含义。
- source_word: בִּצְעוֹ
  choice: 他贪图不义之财
  rationale: בֶּצַע 可指贪婪的欲望，也可指以贪婪或不正当手段取得的利益。正文兼顾贪欲与不义所得两个层面，脚注保留较偏内在欲望的译法。
- source_word: קָצַפְתִּי
  choice: 我发怒
  rationale: קצף 表示发怒、震怒；“发怒”庄重自然，且不过度强化语气。
- source_word: וְאַכֵּהוּ
  choice: 击打他
  rationale: נכה 的使役式在此表示击打或惩击；“击打”保留原文具体的惩罚行动。
- source_word: הַסְתֵּר
  choice: 我隐藏自己
  rationale: 这是 סתר 的不定词绝对式，可作副词性或省略式表达。正文不补入原文未明说的“脸”，以保留措辞的简约和歧义。
- source_word: וְאֶקְצֹף
  choice: 仍然发怒
  rationale: 保留 קצף 的第二次出现；“仍然”使重复在现代汉语中顺畅，并表达持续状态，但不把它改成不同种类的愤怒。
- source_word: וַיֵּלֶךְ שׁוֹבָב
  choice: 他却继续背道
  rationale: הלך 与 שׁוֹבָב 连用描述持续的背离行为，而非单纯行走。“继续背道”保留其延续性和关系性背离的意味；“却”体现惩罚与其反应之间语境上明显的反差。
- source_word: בְּדֶרֶךְ לִבּוֹ
  choice: 走自己心所定的路
  rationale: 保留“道路”的比喻，并以自然现代汉语表达人的行为受其内心意愿支配；不将“心”窄化为情感。
theological_decisions:
- issue: הַסְתֵּר 所表达的上帝隐藏
  choice: 我隐藏自己
  alternative: 我掩面
  rationale: 希伯来文没有明说“脸”，尽管“掩面”是圣经中常见的完整惯用语。正文避免补入未出现的名词，脚注则保留传统而可能的理解。
- issue: בִּצְעוֹ 所指的审判对象
  choice: 他贪图不义之财
  alternative: 他的贪婪
  rationale: 该词既可指贪欲，也可指贪图或取得的不义利益。正文兼顾行为动机与经济所得，脚注明示较偏内在欲望的可能译法。
- issue: 惩罚之后人的持续背离
  choice: 他却继续背道
  alternative: 他继续任性偏离
  rationale: שׁוֹבָב 可表达转离、背道或顽梗。采用“背道”保留其严肃的关系性和道德性，同时不进一步限定为某一宗派意义上的“叛教”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“击打”“背道”“心所定的路”保留原文的具体动作与道路意象；避免使用过于古雅的“击杀”“掩藏己身”等表达。正文中的脚注标记 [a]、[b] 均与脚注对应。
