  to: 你带着膏油前往君王[a]那里，又加添许多香膏；你差遣使者到远方，甚至贬低自己，降到阴间[b]。
  rationale: 修订仅处理两处可安全确定的语义细节：以“香膏”表达调制的芳香制剂，并以“贬低自己”避免“自甘”所添加的主观意涵。其余译文、君王／摩洛的歧义及示奥勒的文化说明均予保留。
