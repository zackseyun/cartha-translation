  text: וַ/תָּשֻׁ֤רִי לַ/מֶּ֨לֶךְ֙ בַּ/שֶּׁ֔מֶן וַ/תַּרְבִּ֖י רִקֻּחָ֑יִ/ךְ וַ/תְּשַׁלְּחִ֤י צִרַ֨יִ/ךְ֙ עַד מֵ֣/רָחֹ֔ק וַ/תַּשְׁפִּ֖ילִי עַד שְׁאֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/009.yaml
  text: You journeyed to the king with oil[a], and multiplied your perfumes; you sent your envoys far away[b], and debased yourself even to Sheol.
translation:
  language: zh_hans
  text: 你带着膏油前往君王[a]那里，又加添许多香膏；你差遣使者到远方，甚至贬低自己，降到阴间[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “君王”也可能是对神祇“摩洛”的暗指。
    reason: alternative_reading
  - marker: b
    text: “阴间”对应希伯来语“示奥勒”，指死人的领域。
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּשֻׁרִי
  choice: 前往
  rationale: 此动词含义较难确定；结合“君王”“膏油”和差遣使者的语境，译作前往最为通顺，同时避免加入“朝见”等原文未明说的细节。
- source_word: לַמֶּלֶךְ
  choice: 君王
  rationale: 马所拉文本直译为“君王”；可能暗指摩洛的解释保留在脚注中，不在正文中定论。
- source_word: בַּשֶּׁמֶן
  choice: 带着膏油
  rationale: שֶׁמֶן 基本义为油，此处可能是带香气、用于献礼或取悦对方的膏油；“膏油”兼顾具体物质和语境。
- source_word: וַתַּרְבִּי רִקֻּחָיִךְ
  choice: 又增添许多香料
  rationale: רבה 表示增多，רִקֻּחִים 指调制的芳香混合物；此译自然表达其大量增加的含义。
- source_word: צִרַיִךְ
  choice: 使者
  rationale: 该词指受差遣传递信息或办理事务的人；“使者”既可用于外交，也不把语境限死为正式外交关系。
- source_word: עַד מֵרָחֹק
  choice: 到远方
  rationale: 准确表达使者被派往遥远之地。
- source_word: וַתַּשְׁפִּילִי
  choice: 自甘卑下
  rationale: 该动词本义为使自己降低；在责备语境中不仅是空间上的下降，也含自我贬抑、自取卑贱之意。
- source_word: עַד שְׁאוֹל
  choice: 直降到阴间
  rationale: “阴间”是现代中文圣经语境中对 Sheol 较清楚而庄重的表达；“直降到”保留原文降低至极处的鲜明意象。
theological_decisions:
- issue: “君王”是否暗指神祇摩洛
  choice: 正文保留“君王”
  alternative: 摩洛
  rationale: 希伯来文本按现有元音读作“君王”，政治结盟与偶像崇拜的意象在上下文中都可能存在。脚注提示传统上可能的摩洛暗指，避免正文过早消除歧义。
- issue: שְׁאוֹל 的含义
  choice: 译作“阴间”，并以脚注说明为死人所在之处
  alternative: 坟墓；地狱
  rationale: Sheol 并非仅指一座坟墓，也不宜直接等同于后来的“地狱”概念；“阴间”较能保留希伯来观念的范围。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。以“前往”保留疑难动词的谨慎表达；用“自甘卑下，直降到阴间”同时呈现道德上的自我贬抑和向下至死亡领域的空间意象。
