  terminology: “君王”保留了 הַמֶּלֶךְ 的表层歧义，摩洛的可能暗示置于脚注，处理恰当。“阴间”可用于 שְׁאוֹל，且脚注避免将其等同于后期“地狱”概念。将 רִקֻּחַיִךְ 译为“香膏”比“香料”更准确。
