  text: אֲנִ֥י אַגִּ֖יד צִדְקָתֵ֑/ךְ וְ/אֶֽת מַעֲשַׂ֖יִ/ךְ וְ/לֹ֥א יוֹעִילֽוּ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/012.yaml
  text: I myself will declare your righteousness and your works[b][a], but they will not profit you.
translation:
  language: zh_hans
  text: 我必宣告你的公义[a]和你的作为；但这些都不能使你受益[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”或“义行”；希伯来词在不同语境中可有这些含义。
    reason: lexical_alternative
  - marker: b
    text: “使你受益”也可译作“帮助你”或“对你有益”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: 我
  rationale: 希伯来文独立人称代词置于动词前，带有强调作用。普通话通常可借“我要”的主语明示和语境承载此强调；译作“我亲自”容易额外加入行动方式的意味。
- source_word: אַגִּיד
  choice: 要宣告
  rationale: נגד 的使役形常指“宣告、使人知道”。“宣告”既贴近词义，也保留本句可能具有的揭露或反讽语气，而不在正文中把这种语用含义说死。
- source_word: צִדְקָתֵךְ
  choice: 你的公义
  rationale: צדקה 可指公义、正义或合乎正道的行为。此处保留“公义”这一较基本的对应词，让上下文体现其可能的反讽意味；不译成“所谓的公义”，以免加入解释。
- source_word: וְאֶת מַעֲשַׂיִךְ
  choice: 和你的作为
  rationale: מַעֲשִׂים 指行为、所做之事。“作为”在现代汉语中自然而庄重，也不预先限定这些行为的道德性质。
- source_word: וְלֹא יוֹעִילוּךְ
  choice: 但这些都不能使你受益
  rationale: יעל 的使役形可表示使人得益、对人有帮助。连接词直译为“和”，但此处语义明显转折，故译“但”；动词用“使你受益”，保留“有益、帮助”的词义范围。
theological_decisions:
- issue: “你的公义”的语气
  choice: 正文保留“你的公义”，不加引号或“所谓的”等限定语
  alternative: 你的所谓公义；你的义行
  rationale: 上下文很可能带有讽刺和揭露意味，但希伯来文本身仍使用普通的“公义”一词。让语境传达责备，可避免把一种解释直接写入正文。
- issue: 末句主语所指
  choice: 以“这些”概括前述“你的公义和你的作为”
  alternative: 它们不能帮助你；你的作为不能使你受益
  rationale: 希伯来文动词为复数，最自然地回指前述并列内容。译为“这些”符合汉语表达，并避免只让“作为”充当主语。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“我要宣告”保留先知性话语的力度；分号呈现两部分之间的紧密联系与转折。所有脚注标记均置于正文相应词句之后。
