  yaml_path: translation/ot/isaiah/057/002.yaml
  text: He enters into peace[a]; they rest on their beds[c][b], each one who walks in his uprightness.
translation:
  language: zh_hans
  text: 他进入平安[a]；他们各自在床榻上安歇[b]；各人都行事正直[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他来到平安之中。”原文动词在此可表达“进入”或“来到”。
    reason: lexical_alternative
  - marker: b
    text: 原文在本节中有单复数转换：“他进入……他们安歇……行事正直的各人。”
    reason: alternative_reading
  - marker: c
    text: 或译：“各人径直行在他面前”，又或：“各人行正路。”原文表达较为紧缩；“他”的所指未明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבוֹא
  choice: 进入
  rationale: 这是בוא的Qal未完成式第三人称阳性单数。在本诗歌语境中，表示义人进入平安的境况；“进入”自然简洁，同时保留“来到”的可能含义。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 此词可指平安、安宁、福祉或完整；“平安”是现代汉语中最自然、凝练的对应，也保留了较丰富的语义空间。
- source_word: יָנוּחוּ
  choice: 他们……安歇
  rationale: 这是נוח的Qal未完成式第三人称阳性复数。“安歇”保留诗句中安息与死亡的含蓄意象，不将其解释得过于具体。
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: 在自己的床榻上
  rationale: 原文直指他们躺卧的床或卧处。“床榻”保留具体比喻和诗体庄重感；“自己的”自然表达第三人称复数后缀。
- source_word: הֹלֵךְ
  choice: 那……行事的人
  rationale: 这是הלך的Qal阳性单数分词，表示一个人持续或一贯的生活方式。“行事”在现代汉语中自然表达其伦理行为，也不强制改写为过去时。
- source_word: נְכֹחוֹ
  choice: 正直
  rationale: 该词组含有直、正、端正而行的意思，第三人称单数后缀使表达较为紧缩。“行事正直”传达上下文中的伦理意义，同时以脚注保留“径直行在他面前”等可能分析。
theological_decisions:
- issue: 本节由单数转为复数，又回到单数分词
  choice: 保留“他进入”与“他们……安歇”的数变化，并以“那……的人”对应末尾的阳性单数分词。
  alternative: 将全句统一译成单数或复数。
  rationale: 希伯来文本本身有意或诗性地在单复数之间转换；译文不应无声抹平这一张力。
- issue: 床榻与安歇所包含的死亡意象
  choice: 保留“床榻”和“安歇”的诗性比喻。
  alternative: 明确译为坟墓中的安息，或明确译为天上的安息。
  rationale: 上下文涉及义人死亡后的平安，但本节没有详述其形而上状态；保留意象可避免加入经文本身未明确说明的教义细节。
- issue: נְכֹחוֹ末尾代词后缀的理解
  choice: 正文采用伦理性的“行事正直”，脚注列出“径直行在他面前”等译法。
  alternative: 将后缀明确解释为指向上帝，译作“在他面前走正路”。
  rationale: 原文表达紧缩，既可着重人的正直，也可理解为在某位对象面前径直而行；正文不把所指对象教义化地确定下来。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“床榻”比“床”略具诗意，却仍属通行词；破折号使末尾单数分词短语自然回指前面的义人群体。所有脚注标记均置于正文相应位置。
