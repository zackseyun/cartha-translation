  text: עַל מִי֙ תִּתְעַנָּ֔גוּ עַל מִ֛י תַּרְחִ֥יבוּ פֶ֖ה תַּאֲרִ֣יכוּ לָשׁ֑וֹן הֲ/לֽוֹא אַתֶּ֥ם יִלְדֵי פֶ֖שַׁע זֶ֥רַע שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/004.yaml
  text: At whom do you sport yourselves? Against whom do you open your mouth wide and stick out your tongue? Are you not children of transgression[c][b][a], offspring of deceit?
translation:
  language: zh_hans
  text: 你们在嘲弄谁？向谁张大嘴巴、伸出舌头[a]？你们岂不是悖逆的儿女、虚谎的后代[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伸出舌头”直译为“使舌头变长”，这里指伸舌作出嘲弄、侮辱的姿态。
    reason: lexical_alternative
  - marker: b
    text: “悖逆的儿女、虚谎的后代”是用家族关系作比喻，指这些人的品格以悖逆和虚谎为特征，并非说明其生物血统。
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְעַנָּגוּ
  choice: 在嘲弄
  rationale: 该词字面可指“以……为乐”，但本节后续的张嘴、伸舌动作显示语境是讥诮和嘲弄；译为“在嘲弄”既自然，也保留其以别人为取乐对象的负面意味。
- source_word: תַּרְחִיבוּ פֶה
  choice: 张大嘴巴
  rationale: 直接保留希伯来语的鲜明身体意象；现代汉语自然，并能传达放肆讥诮的姿态。
- source_word: תַּאֲרִיכוּ לָשׁוֹן
  choice: 伸长舌头
  rationale: 较贴近原文“使舌头长”的表达，同时在汉语中可理解为带有侮辱性的嘲弄动作；脚注说明其含义。
- source_word: הֲלוֹא
  choice: 岂不是……吗
  rationale: 准确体现预期肯定回答的反问语气，也符合庄重而自然的现代汉语。
- source_word: יִלְדֵי פֶשַׁע
  choice: 悖逆的儿女
  rationale: “悖逆”在先知性责备中比抽象的“过犯”更贴近 פֶשַׁע 所含的反叛意味；“儿女”保留原文的亲属隐喻而不限定性别。
- source_word: זֶרַע שָׁקֶר
  choice: 虚谎的后代
  rationale: “后代”自然表达 זֶרַע 的谱系隐喻；“虚谎”兼含假冒与欺骗之意，并与前句形成凝练的平行结构。
theological_decisions:
- issue: 先知责备中的血统式道德语言
  choice: 保留“儿女、后代”的家族隐喻，将其理解为对受责者品格的描述。
  alternative: 完全意译为“满是悖逆、惯于虚谎的人”，或误解为对生物血统的断言。
  rationale: 希伯来语“某事物的儿女／后代”常表示受该性质支配或以之为特征的人。保留隐喻可保存原文力度，而脚注避免读者将其理解成族裔或生物遗传判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们在嘲弄谁”传达语境中的讥诮含义；“张大嘴巴、伸长舌头”保留原文平行而具体的身体意象；末句维持先知责问的强烈反问语气。
