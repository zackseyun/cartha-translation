  text: וְ/אַתֶּ֥ם קִרְבוּ הֵ֖נָּה בְּנֵ֣י עֹנְנָ֑ה זֶ֥רַע מְנָאֵ֖ף וַ/תִּזְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/003.yaml
  text: But you—come here[a], sons of a sorceress[b], offspring of an adulterer and a prostitute.
translation:
  language: zh_hans
  text: 但你们，近前来！你们这些行占卜的女人[a]的儿子、奸夫和淫妇的后代。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“观兆妇”或“占卜的女子”。原文指从事占卜、观兆之术的女子。
    reason: lexical_alternative
  - marker: b
    text: 这句话可能以先知性的比喻谴责属灵奸淫和偶像崇拜，并不一定是在陈述他们实际的血统。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: 但你们
  rationale: 连词与独立代词连用，在上下文中形成鲜明转折；“但你们”自然传达其对比语气。
- source_word: קִרְבוּ הֵנָּה
  choice: 都到这里来
  rationale: 复数命令式 קִרְבוּ 表示“近前来”，הֵנָּה 表示“这里”；合译既自然，也保留先知召来对质的语气。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 原文为阳性复数构造式，直指“儿子”；保留其性别形式及表示归属或品性的称谓作用。
- source_word: עֹנְנָה
  choice: 占卜妇
  rationale: 该阴性形式指从事被禁止的占卜、观兆之术的女子。“占卜妇”比泛称“女巫”更贴近其核心语义。
- source_word: זֶרַע
  choice: 后代
  rationale: 在这段带有家系色彩的斥责中，表示某人的子孙或属类；“后代”在现代汉语中清楚自然。
- source_word: מְנָאֵף
  choice: 奸夫
  rationale: 该阳性单数分词指犯奸淫的男子；“奸夫”简洁地保留其男性和婚姻不忠的含义。
- source_word: וַ/תִּזְנֶה
  choice: 和淫妇
  rationale: 原文为 זנה 的第三人称阴性单数形式，指行淫或卖淫的女子；在家系斥责的并列结构中名词化为“淫妇”，读来流畅，并保留女性单数所指。
theological_decisions:
- issue: 斥责性家系意象的性质
  choice: 正文保留“儿子”“后代”以及占卜、奸淫的家系意象，不断定这些称呼仅为字面血统描述。
  alternative: 将其明确解释为听众确实出身于行邪术和淫乱的父母。
  rationale: 上下文以强烈的家庭和性不忠意象谴责偶像崇拜及背约；这很可能具有属灵隐喻意义，但原句本身仍可被理解为对祖源的字面斥责，因此正文不消除这种张力。
translation_notes:
  register: 采用现代、庄重而直接的先知斥责语体。“都到这里来”体现复数召唤和对质意味；“占卜妇”准确而不古奥，“奸夫和淫妇”保留原文男女有别且尖锐的性不忠意象。
