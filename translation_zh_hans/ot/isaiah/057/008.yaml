  text: וְ/אַחַ֤ר הַ/דֶּ֨לֶת֙ וְ/הַ/מְּזוּזָ֔ה שַׂ֖מְתְּ זִכְרוֹנֵ֑/ךְ כִּ֣י מֵ/אִתִּ֞/י גִּלִּ֣ית וַֽ/תַּעֲלִ֗י הִרְחַ֤בְתְּ מִשְׁכָּבֵ/ךְ֙ וַ/תִּכְרָת לָ֣/ךְ מֵ/הֶ֔ם אָהַ֥בְתְּ מִשְׁכָּבָ֖/ם יָ֥ד חָזִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/008.yaml
  text: Behind the door and the doorpost you set up your memorial[a]; for away from me you uncovered yourself and went up; you made your bed wide, and you made a covenant for yourself with them; you loved their bed[c][b]; you looked on a hand.
translation:
  language: zh_hans
  text: 你把纪念物安放在门后和门框后[a]；因为你离开我，袒露自己，又上去；你把自己的床榻铺得宽大，为自己同他们立约[b]；你爱他们的床榻；你看着一只手[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你把象征物／纪念标记安放在那里”。“纪念物”可能指暗中设置的偶像崇拜标记。
    reason: lexical_alternative
  - marker: b
    text: 原文动词字面有“切下／砍下”之意；在此语境中是常见的立约用语，尽管本句没有明说“约”这个名词。
    reason: lexical_alternative
  - marker: c
    text: 原文作“你看着一只手”。这句话含义晦涩；“手”也可能指纪念碑或标记，或是性的委婉说法。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר הַדֶּלֶת וְהַמְּזוּזָה
  choice: 在门和门框后面
  rationale: אַחַר在此表示空间位置；מְזוּזָה是门框两侧的门柱，而非门槛。译文保留隐蔽安放物件的图景。
- source_word: שַׂמְתְּ זִכְרוֹנֵךְ
  choice: 你把纪念物安放
  rationale: זִכָּרוֹן可指用于纪念或提醒的具体物件；上下文可能暗指偶像崇拜的标记，但正文不直接释作“偶像”。
- source_word: כִּי מֵאִתִּי גִּלִּית
  choice: 因为你离开了我，露出自己
  rationale: מֵאִתִּי带有与说话者分离之意；גלה在此保留裸露及羞耻、性方面的含义，以呈现背道的隐喻。
- source_word: וַתַּעֲלִי
  choice: 又上去了
  rationale: עלה的基本义是“上去”；可能影射登上高处或床榻，但不在正文中限定。
- source_word: הִרְחַבְתְּ מִשְׁכָּבֵךְ
  choice: 你把床铺得宽阔
  rationale: 保留使床宽大的具体图像及其性隐喻，不抽象改写为不忠。
- source_word: וַתִּכְרָת לָךְ מֵהֶם
  choice: 与他们为自己立约
  rationale: כרת虽未明说בְּרִית，却常构成“立约”的固定表达；“为自己”反映לָךְ。
- source_word: אָהַבְתְּ מִשְׁכָּבָם
  choice: 你爱他们的床榻
  rationale: 直译并保留涉及淫乱、偶像崇拜和不当结盟的多重隐喻。
- source_word: יָד חָזִית
  choice: 你观看一只手
  rationale: יָד通常指“手”，חזה指观看或看见；原短语含义晦涩，正文保留字面表达，其他可能义置于脚注。
theological_decisions:
- issue: 以性关系和床榻描写犹大的背道
  choice: 正文保留露体、床榻和立约等相互交织的意象
  alternative: 明确改写为拜偶像，或仅解释为政治结盟
  rationale: 原文以性化语言表现对上主的不忠，同时也可能涉及偶像崇拜与外邦联盟；不应把这种张力化约为单一解释。
- issue: וַתִּכְרָת的盟约含义
  choice: 译作“立约”
  alternative: 译作较中性的“达成协议”
  rationale: כרת在此最自然地唤起立约用语；即使בְּרִית未出现，仍应保留其关系和神学上的力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以女性单数“你”在上下文中指拟人化的犹大，但汉语不显语法性别。保留原文短促、控诉性的分句结构和刻意含混的末句。
