  rationale: 修订仅处理安全且必要的汉语句法与一处词汇显化：以“名为圣者如此说”承接原文中对说话者的连续描述；以“至高、被高举”较完整地呈现原文双重称谓。其余译法和两条脚注均保留，以维持原有的词汇选择、重复、神学张力及可争议处的开放性。
