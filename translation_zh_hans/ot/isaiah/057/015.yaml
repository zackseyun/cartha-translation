  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר רָ֣ם וְ/נִשָּׂ֗א שֹׁכֵ֥ן עַד֙ וְ/קָד֣וֹשׁ שְׁמ֔/וֹ מָר֥וֹם וְ/קָד֖וֹשׁ אֶשְׁכּ֑וֹן וְ/אֶת דַּכָּא֙ וּ/שְׁפַל ר֔וּחַ לְ/הַחֲיוֹת֙ ר֣וּחַ שְׁפָלִ֔ים וּֽ/לְ/הַחֲי֖וֹת לֵ֥ב נִדְכָּאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/015.yaml
  text: 'For thus says the One who is high and lifted up[a], who inhabits eternity, whose name is Holy: “I dwell in the high and holy place, and also with the crushed and lowly in spirit[b], to revive the spirit of the lowly and to revive the heart of the crushed.”'
translation:
  language: zh_hans
  text: '因为那至高、被高举，住在永恒中[a]，名为圣者如此说：


    “我住在至高至圣之处，也与被压碎、灵里卑微的人同住[b]，要使卑微者的灵复苏，使被压碎者的心复苏。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永远居住的”。希伯来语表达既可强调永远持续，也可描绘以永恒为居所。
    reason: lexical_alternative
  - marker: b
    text: 传统译法作“与心灵痛悔、谦卑的人同住”……“使痛悔者的心复苏”。这里译作“被压碎”，以保留希伯来语受压、破碎的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָם וְנִשָּׂא
  choice: 至高至上
  rationale: 保留这对词所表达的崇高、超越及向上的意象；措辞简洁庄重，也符合以赛亚书中的称谓语气。
- source_word: שֹׁכֵן עַד
  choice: 居于永恒的
  rationale: 分词 שֹׁכֵן 表示居住，עַד 可指永恒的领域，也可强调永远持续；正文保留紧凑而崇高的空间性表达，并以脚注注明时间性译法。
- source_word: קָדוֹשׁ שְׁמוֹ
  choice: 他的名为圣
  rationale: 忠实表达无系词句的表语关系，让“圣”直接述说他的名。
- source_word: מָרוֹם וְקָדוֹשׁ אֶשְׁכּוֹן
  choice: 我住在至高至圣之处
  rationale: מָרוֹם 表示高处或崇高之境；补出“之处”使现代汉语自然，并保留 אֶשְׁכּוֹן 与前文 שֹׁכֵן 的“居住”呼应。
- source_word: דַּכָּא / נִדְכָּאִים
  choice: 被压碎／被压碎者
  rationale: 保留词语“受压、破碎”的核心形象，避免正文直接窄化为主要强调悔罪的“痛悔”。前后采用同一词根对应的译法。
- source_word: שְׁפַל רוּחַ
  choice: 灵里卑微
  rationale: 既保留 רוּחַ“灵”，也表达 שְׁפַל 的低微、谦卑之意；不把它仅限于社会地位。
- source_word: לְהַחֲיוֹת
  choice: 使……复苏
  rationale: חיה 的使役式表示使活过来、恢复生机；“复苏”适合此处恢复受压者内在生命的语境，又不擅自限定为身体复活。
- source_word: רוּחַ שְׁפָלִים
  choice: 卑微者的灵
  rationale: 保留“灵”这一人论用语，并使 שְׁפַל 与前文“卑微”保持词汇一致。
- source_word: לֵב נִדְכָּאִים
  choice: 被压碎者的心
  rationale: 保留“心”，不释义为较宽泛的“内在生命”；同时与前文 דַּכָּא 的压碎意象相呼应。
theological_decisions:
- issue: 同一节中上帝的超越与临在
  choice: 同时直陈上帝住在至高至圣之处，又与被压碎、灵里卑微的人同住。
  alternative: 淡化其中一面，或将“同住”仅解释为比喻性的关怀。
  rationale: 希伯来文有意并置两种居所，形成神学张力；译文不替原文消解这张力。
- issue: דַּכָּא / נִדְכָּאִים 的含义
  choice: 正文译为“被压碎／被压碎者”。
  alternative: 译为“痛悔的人”或“破碎的人”。
  rationale: “被压碎”更直接保留词汇本身的形象；“痛悔”虽是传统且可能合乎语境的理解，却更明确地加入悔罪含义，因此列入脚注而不取代正文。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“至高至上”“至高至圣”维持诗性平行；“居于永恒”有意保留原文凝练而超越日常的表达，并借脚注说明另一可行译法。
