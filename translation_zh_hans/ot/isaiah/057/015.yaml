  - severity: low
    issue: “至高至上”未清楚反映“被高举”的第二个词。
    rationale: 该成语虽表达至高地位，却弱化了 נִשָּׂא 的“被举起／高举”意象。译作“至高、被高举”既自然又更贴近原文的并列描写。
