base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/019.yaml
  text: 'Creating the fruit of the lips: Peace[a], peace to the one far off and to the one near, says Yahweh[c][b], and I will heal him.'
translation:
  language: zh_hans
  text: 耶和华说：“我创造嘴唇所出的果实[a]：愿远处的人和近处的人都得享平安，平安[b]；我必医治他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“嘴唇的果实”或“嘴唇所结的果子”；这个说法指嘴唇所产生的言语，可能是赞美或承认。
    reason: lexical_alternative
  - marker: b
    text: 原文重复“平安”一词，以加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹרֵא
  choice: 我造出
  rationale: 该词为阳性单数主动分词，在此承接耶和华的宣告。汉语用第一人称有限动词更自然，也与后面的“我要医治”形成连贯的神圣话语，同时保留“创造、造出”的主动含义。
- source_word: נוב שְׂפָתָיִם
  choice: 嘴唇的果实
  rationale: 保留希伯来语以嘴唇所结之“果实”指其所产生之言语的意象；不直接译作“赞美”，以免把可能较宽泛的言语回应限定为赞美。
- source_word: שָׁלוֹם שָׁלוֹם
  choice: 平安，平安
  rationale: 逐字保留重复所表达的强调；“平安”也能承载 שָׁלוֹם 所含安康、完整与复和等较宽广的意义。
- source_word: לָרָחוֹק וְלַקָּרוֹב
  choice: 归给远处的人，也归给近处的人
  rationale: ל 表明平安宣告的领受者；补出“人”符合现代汉语，同时保留原文单数实体化形容词及远近并列结构。
- source_word: אָמַר יְהוָה
  choice: 耶和华说
  rationale: אָמַר 采用常见叙述式“说”；יְהוָה 音译为“耶和华”，在简体中文圣经语域中庄重、通行，并保留这是神的专名。
- source_word: וּרְפָאתִיו
  choice: 我要医治他
  rationale: רפא 的基本义为“医治”，在本段中也容纳恢复之意；依上下文把 waw 加完成式理解为应许中的将来或结果意义。阳性单数宾语后缀译作“他”。
theological_decisions:
- issue: “远处的人”和“近处的人”的身份
  choice: 正文只保留远近的概括称呼，不明确限定其群体身份。
  alternative: 明确译作流散与留居当地的以色列人，或进一步解释为外邦人与犹太人。
  rationale: 以赛亚书当前语境支持神子民得恢复的理解，但本节本身没有明说两者的身份；保留开放性可避免把后来的经文运用或特定神学解释写入正文。
- issue: “嘴唇的果实”与随后“平安”之关系
  choice: 以冒号和引号表明“平安，平安”可理解为神所造出的口中宣告，同时保留原文凝练结构。
  alternative: 把“嘴唇的果实”明确解释成受医治之人的赞美或认罪。
  rationale: 原文没有明确说明这些嘴唇属于谁，也没有直接把“果实”限定为赞美或认罪；正文不替原文消除这一含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“嘴唇的果实”和“平安，平安”等希伯来语意象与修辞；以标点厘清句法，但不在正文中限定“远处／近处”或“嘴唇的果实”的具体神学所指。
