  text: וְ/הֶחֱזִיקוּ֩ שֶׁ֨בַע נָשִׁ֜ים בְּ/אִ֣ישׁ אֶחָ֗ד בַּ/יּ֤וֹם הַ/הוּא֙ לֵ/אמֹ֔ר לַחְמֵ֣/נוּ נֹאכֵ֔ל וְ/שִׂמְלָתֵ֖/נוּ נִלְבָּ֑שׁ רַ֗ק יִקָּרֵ֤א שִׁמְ/ךָ֙ עָלֵ֔י/נוּ אֱסֹ֖ף חֶרְפָּתֵֽ/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/001.yaml
  text: And seven women will take hold of one man in that day[a], saying, “We will eat our own bread and wear our own clothing; only let your name be called over us[b]. Take away our reproach.”
translation:
  language: zh_hans
  text: 到那日，七个女人必抓住一个男人，说：“我们吃自己的饼，穿自己的衣服；只要许我们归在你的名下[a]，求你除去我们的羞辱[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“让我们称为你名下的人”。这很可能暗示婚姻，或在法律和社会身份上归属这个男人。
    reason: lexical_alternative
  - marker: b
    text: “羞辱”指社会上的耻辱或羞耻；结合上下文，很可能是灾难过后没有丈夫的名分和地位所带来的羞耻。
    reason: cultural_note
lexical_decisions:
- source_word: וְהֶחֱזִיקוּ
  choice: 必抓住
  rationale: חזק 的使役式与介词 ב 连用，可指牢牢抓住；“抓住”保留动作的直接性和迫切感，又不必解释为暴力夺取。
- source_word: שֶׁבַע נָשִׁים
  choice: 七个女人
  rationale: 按原文直译为数词加名词；此处尚未明说婚姻关系，不译作“七个妻子”。
- source_word: בְּאִישׁ אֶחָד
  choice: 一个男人
  rationale: 介词 ב 在这里标示所抓住的对象；现代汉语以“抓住一个男人”自然表达。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 采用汉语先知文学中自然庄重的时间公式，保留与前文审判灾难的衔接。
- source_word: לַחְמֵנוּ נֹאכֵל
  choice: 我们吃自己的饼
  rationale: 物主后缀本义为“我们的饼”；“自己的”在汉语中凸显她们愿意自行供养、不要求男人供食的语境重点。
- source_word: וְשִׂמְלָתֵנוּ נִלְבָּשׁ
  choice: 穿自己的衣服
  rationale: שִׂמְלָה 可指衣服或外衣；此处用通顺的集合性表达“衣服”，并以“自己的”传达自行负担衣着的强调。
- source_word: רַק
  choice: 只求
  rationale: 原词表示限制，表明她们虽自行解决衣食，却只提出这一项请求；“只求”也自然引出后面的愿望。
- source_word: יִקָּרֵא שִׁמְךָ עָלֵינוּ
  choice: 让你的名归在我们身上
  rationale: 保留“名”与“在我们身上”的希伯来语意象，同时用“归在”使现代汉语较为自然；不在正文中直接释作“娶我们”。
- source_word: אֱסֹף
  choice: 除去
  rationale: אָסַף 基本义为聚集、收取，在以“羞辱”为宾语时构成除去之意；“除去”简洁自然。
- source_word: חֶרְפָּתֵנוּ
  choice: 我们的羞辱
  rationale: חֶרְפָּה 涵盖受到的耻辱、羞耻和社会非议；“羞辱”保留其外在社会性的含义，不把原因限定为未婚或无子。
theological_decisions:
- issue: “让你的名归在我们身上”所暗示的婚姻或社会归属
  choice: 正文保留“名归在我们身上”的意象，不直接译为“娶我们”。
  alternative: 让我们归在你的名下；让我们称为你名下的人；娶我们
  rationale: 该语句很可能表示借婚姻取得男子之名及相应的法律、家庭或社会身份，但原文没有使用通常表示结婚的动词。保留原有表达可避免把暗示变成明说。
- issue: “羞辱”的具体所指
  choice: 正文采用含义较广的“羞辱”。
  alternative: 未婚的耻辱；无子的羞耻；没有丈夫名分的耻辱
  rationale: 上下文表明，这与战争灾难后缺少男子以及没有丈夫的名分和社会地位有关，也可能连带涉及无子，但本节没有把所指限定为单一原因。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“到那日”保持先知文学语体；引语中的“自己的饼／衣服”清楚表现自行供养。“名归在我们身上”有意保留原文的陌生感和社会归属意象，并以脚注解释可能的婚姻含义。所有脚注标记均已置于正文。
