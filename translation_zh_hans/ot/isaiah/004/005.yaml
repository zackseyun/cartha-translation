  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָרָ֣א יְהוָ֡ה עַל֩ כָּל מְכ֨וֹן הַר צִיּ֜וֹן וְ/עַל מִקְרָאֶ֗/הָ עָנָ֤ן יוֹמָם֙ וְ/עָשָׁ֔ן וְ/נֹ֛גַהּ אֵ֥שׁ לֶהָבָ֖ה לָ֑יְלָה כִּ֥י עַל כָּל כָּב֖וֹד חֻפָּֽה־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/005.yaml
  text: Then Yahweh will create over the whole site of Mount Zion and over her assemblies a cloud by day[a], and smoke, and the brightness of a flaming fire by night[d][c][b]; for over all the glory there will be a canopy.
translation:
  language: zh_hans
  text: 那时，耶和华必在锡安山上的各处地方和锡安的一切集会[a]之上，造出白日的云彩、烟雾，以及夜间烈焰的光辉[b][c]；因为在一切荣耀之上，必有华盖[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“锡安的一切庄严集会”或“锡安的一切召集”。这个希伯来词可指按指定时间举行、召集起来的聚会。
    reason: lexical_alternative
  - marker: b
    text: 或译“夜间烈火的光亮”。
    reason: lexical_alternative
  - marker: c
    text: 这里的云与火令人联想到耶和华在旷野中以云和火引领以色列人（例如《出埃及记》13:21–22）。
    reason: cross_reference
  - marker: d
    text: 或译“遮盖”；这个希伯来词也可指婚礼所用的华盖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרָא
  choice: 那时……必……造出
  rationale: 在本段前瞻性的复兴应许中，带连接词的完成式自然表达将来的确定行动；“造出”保留 ברא 所强调的创造行动，“那时”体现上下文的推进。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，不以普通称号取代专名。
- source_word: מְכוֹן הַר צִיּוֹן
  choice: 锡安山全境
  rationale: מְכוֹן 指固定的所在或地点；“全境”在中文中自然地指锡安山整个范围，同时避免把它过度解释为神的“居所”。
- source_word: מִקְרָאֶיהָ
  choice: 其中一切集会
  rationale: מִקְרָא 可指被召集的聚会或庄严集会，阴性单数后缀回指锡安；“其中”自然表达这种所属关系。
- source_word: עָנָן יוֹמָם וְעָשָׁן
  choice: 白日的云彩和烟雾
  rationale: 逐项保留“云”和“烟”，不把两者合并，也保留与旷野云柱意象的呼应。
- source_word: וְנֹגַהּ אֵשׁ לֶהָבָה לָיְלָה
  choice: 以及夜间火焰的光辉
  rationale: נֹגַהּ 表示光辉、光亮，לֶהָבָה 表示火焰；此译兼顾两者，并保持简洁自然。
- source_word: כִּי
  choice: 因为
  rationale: 将后半句呈现为对前述景象的解释或根据，同时不排除其加强语气的可能。
- source_word: כָּבוֹד
  choice: 荣耀
  rationale: 保留 כָּבוֹד 的核心意义，不在正文中进一步限定为神的临在、锡安的尊荣或其他特定所指。
- source_word: חֻפָּה
  choice: 篷盖
  rationale: 该词指上方的遮盖物或华盖，也可能让人联想到婚礼篷盖；“篷盖”保留保护性空间意象而不强制采用婚礼解释。
theological_decisions:
- issue: וּבָרָא 的先知性时态与体貌
  choice: 译作将来的应许：“必……造出”
  alternative: 按过去叙事译为“造了”
  rationale: 以赛亚书4章的语境指向锡安将来的洁净与复兴，因此将完成式表达为确定的未来应许最符合篇章功能。
- issue: 旷野时期云与火的意象
  choice: 正文仅保留云、烟和火焰光辉的原有形象
  alternative: 明确增译为“云柱”和“火柱”，或直接说明其弥赛亚性、教会论性应验
  rationale: 本节明显令人联想到出埃及记中的云与火，但原文没有“柱”字，也未在此明确解释其预表意义；译文应让这种呼应自行发声。
- issue: “一切荣耀”的所指
  choice: 保留未限定的“一切荣耀”
  alternative: 明确译成“耶和华的荣耀”或“锡安所有荣耀之处”
  rationale: 原文没有明说荣耀的拥有者或具体范围；不在正文中补足，可保留其神学张力。
- issue: חֻפָּה 的保护与婚礼含义
  choice: 正文译“篷盖”，脚注说明也可指婚礼华盖
  alternative: 正文直接译“婚礼华盖”或抽象化为“遮蔽”
  rationale: 词语在此首先形成覆盖、保护的形象，同时可能带有婚礼联想；正文不宜把次要联想定为唯一解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“锡安山全境”比生硬的“锡安山的整个地点”更自然；“其中一切集会”避免用较技术性的“召集大会”。句子保留希伯来文逐层铺陈的云、烟、火与篷盖意象，同时用中文连接词使结构清晰。
