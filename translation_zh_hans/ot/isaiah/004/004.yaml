revisions:
- from: 当主洗净锡安众女子的污秽，又从耶路撒冷城中除净她流人血的罪[a]，以审判之灵和焚烧之灵施行洁净时[b]，
  to: 当主借着审判之灵和焚烧之灵，洗净锡安女子们的污秽，又从耶路撒冷中涤除她的血债[a]时，[b]
  rationale: 修订删除未由原文直接表达的“施行洁净”，使“借着审判之灵和焚烧之灵”自然统摄两项并列的洁净行动。将“她流人血的罪”改为“她的血债”，避免把属格关系和罪责主体解释得过于具体，并在脚注保留“流血／血迹”的可能。保留句末逗号，以反映本节在上下文中仍是从属时间分句。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:00:06Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确把 אִם 处理为承接上文的时间性从句，也正确译出主的两项洁净行动及“审判之灵／焚烧之灵”的工具性表达。不过“她流人血的罪”将原文可涵盖的流血、血债或血迹明确限定为耶路撒冷“流人血”的罪责，解释性过强；“施行洁净”则是原文未明说的补充，并使句法较为重复。
  naturalness: 整体庄重通顺，但“当……以……施行洁净时”在已有“当”和末尾“时”的框架中显得累赘。“从耶路撒冷城中除净她流人血的罪”中“她”同时指城和实施流血的主体，也稍显别扭。改为“借着……洗净……，又从……涤除……”更符合现代书面汉语，且保留原文语序和从句性质。
  terminology: “主”“锡安”“污秽”“审判之灵”“焚烧之灵”均合宜。“血债”是 דָּמִים 在此语境下可成立的简洁译法，但应以脚注明确保留“流血／血迹”等可能，避免把该词的含义完全收窄为法律罪责。
  issues:
  - severity: medium
    issue: “她流人血的罪”对“耶路撒冷的众血”作了过度具体化。
    rationale: 原文的属格结构可指流血、血债或血迹；正文断定耶路撒冷是“流人血”的行为主体并明确称为“罪”，虽与上下文相合，却超出字面所保留的歧义。
  - severity: low
    issue: “施行洁净”是额外补入的动作，且造成句式重复。
    rationale: 希伯来文的两个“以／借着……灵”短语直接说明洗净和涤除的方式；无需补出“施行洁净”。中文原句的“当……时”与“施行洁净时”也使结构不够紧凑。
  - severity: low
    issue: 脚注 b 的“本句也可能理解为‘借审判的灵和焚烧的灵’”与正文表达重复。
    rationale: 正文已经译作“以审判之灵和焚烧之灵”。脚注应集中说明 רוח 可作“风、气息”及不宜擅自特指圣灵。
