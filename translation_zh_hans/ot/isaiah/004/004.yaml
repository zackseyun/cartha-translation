  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִ֣ם רָחַ֣ץ אֲדֹנָ֗/י אֵ֚ת צֹאַ֣ת בְּנוֹת צִיּ֔וֹן וְ/אֶת דְּמֵ֥י יְרוּשָׁלִַ֖ם יָדִ֣יחַ מִ/קִּרְבָּ֑/הּ בְּ/ר֥וּחַ מִשְׁפָּ֖ט וּ/בְ/ר֥וּחַ בָּעֵֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/004.yaml
  text: when the Lord has washed away the filth of the daughters of Zion and cleansed the bloodshed of Jerusalem from her midst by a spirit of justice and by a spirit of burning[a][b].
translation:
  language: zh_hans
  text: 当主借着审判之灵和焚烧之灵，洗净锡安女子们的污秽，又从耶路撒冷中涤除她的血债[a]时，[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “血债”原文直译为“耶路撒冷的众血”；也可译作“耶路撒冷的流血”或“耶路撒冷的血迹”。
    reason: lexical_alternative
  - marker: b
    text: “灵”也可译作“风”或“气息”；原文没有明确特指“圣灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: 当……时
  rationale: 本节承接前文，表示前述应许实现的时间兼条件；译作“当……时”自然，并不暗示事情未必发生。
- source_word: רָחַץ
  choice: 洗净
  rationale: 保留“洗”的洁净意象，并用结果补语“净”表达污秽被除去。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神的称号 Adonai，并非四字神名；现代中文圣经语体自然译作“主”。
- source_word: צֹאַת
  choice: 污秽
  rationale: 该词语气强烈，可指粪秽般的脏污；“污秽”既保留冒犯性的洁净意象，也符合庄重中文。
- source_word: בְּנוֹת צִיּוֹן
  choice: 锡安众女子
  rationale: “锡安的女儿们”虽更形式对应，却可能被现代读者误解为城市的亲生女儿；“锡安众女子”保留群体指称而更清楚自然。
- source_word: דְּמֵי יְרוּשָׁלִַם
  choice: 她流人血的罪
  rationale: 复数“血”在此可表示流血及其造成的血债；结合洁净罪污的语境，“流人血的罪”清楚传达道德责任，同时以脚注保留“血迹／血债”的可能性。
- source_word: יָדִיחַ
  choice: 除净
  rationale: 该使役动词在此表达冲洗、涤除；“除净”与前面的“洗净”有区别，也明确表示从城中清除。
- source_word: מִקִּרְבָּהּ
  choice: 从耶路撒冷城中
  rationale: 阴性单数后缀回指人格化的耶路撒冷；中文以“城中”清楚表达内部，并由“她”略微保留人格化。
- source_word: בְּרוּחַ
  choice: 以……之灵
  rationale: רוּחַ 可指灵、风或气息；正文采用最符合先知性语境的“灵”，但不加“圣”字，也不专断地限定为圣灵，并在脚注保留其他词义。
- source_word: מִשְׁפָּט
  choice: 审判
  rationale: 此处是主清除罪污的司法行动，“审判”比抽象的“公义”更贴近其惩治和裁断意味。
- source_word: בָּעֵר
  choice: 焚烧
  rationale: 源自动词“烧、焚毁”，表达以烈火吞灭并炼净的力量；“焚烧”直接保留这一强烈意象。
theological_decisions:
- issue: 两个 בְּרוּחַ 短语中的 רוּחַ 是否特指圣灵
  choice: 译作“以审判之灵和焚烧之灵”，不增添“圣”字
  alternative: “借审判的圣灵和焚烧的圣灵”；或“以审判之风和焚烧之气”
  rationale: 希伯来文可指灵、风或气息，且没有明确写出“圣”；正文保留“灵”的神学可能性而不把所指进一步教义化，脚注说明其他词义。
- issue: דְּמֵי יְרוּשָׁלִַם 表示流血事件、血迹还是血债
  choice: 译作“她流人血的罪”
  alternative: “耶路撒冷的血迹”或“耶路撒冷的血债”
  rationale: 复数“血”常涵盖流血与血债；在污秽被洗除的语境中，译出罪责较易懂，但脚注保留较具象和法律性的替代读法。
- issue: 末尾工具短语修饰哪一个洁净动作
  choice: 以“施行洁净”统摄前面两个并列动作
  alternative: 仅让“以审判之灵和焚烧之灵”修饰第二个动作
  rationale: 希伯来文中两个 בְּ 短语位于两项动作之后，可自然理解为主完成整项洁净工作的方式；补出“施行洁净”使中文关系明确而不限定于后一动词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。经文是承接上下文的从属句，因此末尾保留逗号。用“锡安众女子”避免“锡安的女儿们”的现代歧义；用“她”轻度保留耶路撒冷的人格化。两个脚注标记均在正文相应位置出现。
