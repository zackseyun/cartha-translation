base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/006.yaml
  text: And there will be a shelter for shade by day from heat[c][b][a], and for a refuge and a hiding place from storm and from rain.
translation:
  language: zh_hans
  text: 必有棚子[a]，白日遮荫，避开炎热[b]；也作避难所和藏身处，躲避暴风[c]和雨水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “棚子”也可译作“棚屋”或“凉棚”；原词强调一种有遮盖的临时性建筑。
    reason: lexical_alternative
  - marker: b
    text: “炎热”也可译作“酷热”。
    reason: lexical_alternative
  - marker: c
    text: “暴风”也可译作“急流”或“暴雨”。
    reason: lexical_alternative
lexical_decisions:
- source_word: סֻכָּה
  choice: 棚子
  rationale: 该词指有遮盖的临时性棚舍。译作“棚子”既保留具体形象，也符合本节遮挡天气的语境；不采用可能带入特定宗教含义的“帐幕”。
- source_word: תִּהְיֶה
  choice: 必有
  rationale: 希伯来语为“将是／将有”。结合预言诗体，译作“必有”自然简洁，并表达将来出现这一遮蔽物。
- source_word: לְצֵל
  choice: 用来遮荫
  rationale: 在防护日间炎热的语境中，“遮荫”比直译“作影子”更符合现代汉语，同时准确表达功能。
- source_word: יוֹמָם
  choice: 白日
  rationale: 该副词表示白昼时分；“白日”简洁庄重，并保留诗歌语体。
- source_word: מֵחֹרֶב
  choice: 躲避炎热
  rationale: חֹרֶב可指炎热、酷热或干旱；本节列举天气带来的威胁，重点是遮荫防热，因此译作“炎热”，但在脚注保留较强的“酷热”义。
- source_word: מַחְסֶה
  choice: 避难所
  rationale: 该词表示提供保护的处所。“避难所”清楚传达庇护功能，并与前面的具体“棚子”及后面的“藏身处”有所区别。
- source_word: מִסְתּוֹר
  choice: 藏身处
  rationale: 该词带有隐蔽、受遮护之处的含义；“藏身处”保留了这一独特语义，不与מַחְסֶה合并。
- source_word: זֶרֶם
  choice: 暴风
  rationale: 该词可表示猛烈的风暴、急流或倾泻而下的暴雨。因后面另有“雨水”，正文采用“暴风”以避免重复，同时以脚注保留其他可能。
- source_word: מָטָר
  choice: 雨水
  rationale: 该词的通常意义是“雨”。“雨水”在“躲避……和雨水”的现代汉语表达中自然，也与前面的“暴风”构成两类天气威胁。
theological_decisions:
- issue: 保护性意象的所指
  choice: 按经文直接译为具体的遮蔽和避难设施，不在正文中指定其后来的神学所指。
  alternative: 把棚子直接解释为锡安、上帝的同在或弥赛亚的保护。
  rationale: 希伯来文本以遮挡炎热、暴风和雨水的具体诗歌意象描写保护。上下文可能引发神学或末世性的理解，但本节本身没有要求译文明确认定某一个预表对象，因此保留其开放性。
translation_notes:
  register: 采用现代、清楚而庄重的汉语。句式保留希伯来诗句由白日炎热转向暴风雨的并列结构，并分别译出“避难所”和“藏身处”，避免把两个保护性名词合并。
