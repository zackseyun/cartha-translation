base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/003.yaml
  text: And it shall be that whoever remains in Zion and whoever is left in Jerusalem will be called holy—everyone who is recorded for life in Jerusalem[a][b].
translation:
  language: zh_hans
  text: 到那时，留在锡安、剩在耶路撒冷的人，都必被称为圣洁——就是凡在耶路撒冷被登记、得以存活的人[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就是凡在耶路撒冷被记在活人中的人。”
    reason: lexical_alternative
  - marker: b
    text: “被登记、得以存活”可能指登记在名册中、获准存活的人；这句话也与圣经中名字写在生命册上的主题相呼应。
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: 到那时
  rationale: 以现代汉语自然表达先知话语中指向将来的承接结构，同时保留事件将要发生的意味。
- source_word: הַנִּשְׁאָר בְּצִיּוֹן
  choice: 留在锡安的人
  rationale: נשׁאר 的被动分词指留下或幸存者；用“留在……的人”既体现余民含义，也符合现代汉语。
- source_word: וְהַנּוֹתָר בִּירוּשָׁלִַם
  choice: 剩在耶路撒冷的人
  rationale: נותר 与前一分句构成近义平行；“剩在”保留劫后余存的意味，并适度再现原文用词变化。
- source_word: קָדוֹשׁ יֵאָמֶר לוֹ
  choice: 都必称为圣
  rationale: “称为圣”保留其被宣告、被认定为圣的含义；“都”自然承接前面两个单数集合性分词。
- source_word: כָּל הַכָּתוּב
  choice: 就是所有……被记名……的人
  rationale: 将该短语作为对前述圣洁余民的同位说明；“记名”既可指登记造册，也保留更广的书写意象。
- source_word: לַחַיִּים
  choice: 得生
  rationale: 保留介词 ל 指向“生命”的紧凑表达，不在正文中限定为仅仅肉身存活，也不直接解释成后期神学意义上的“生命册”。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 按原文保留地名及其地点功能。
theological_decisions:
- issue: 本节所说的是历史性的幸存者，还是被神标记、分别为圣的末世余民
  choice: 正文同时保留幸存、成圣和被记名得生三个层面。
  alternative: 只理解为审判后肉身存活者，或直接明确译作名字写在神生命册上的人。
  rationale: 原文把余存、圣洁和为生命而被记录连在一起；译文不应把张力缩减为纯历史事件，也不应预先套入发展较后的完整“生命册”教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“到那时”适合先知文体；破折号清楚标示后半句对前半句的解释。“得生”刻意保留原文既可关乎获救存活、又具有更深神学回响的开放性。
