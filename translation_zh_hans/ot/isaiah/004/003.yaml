- from: 到那时，留在锡安、剩在耶路撒冷的人，都必称为圣——就是所有在耶路撒冷被记名得生的人[a][b]。
  to: 到那时，留在锡安、剩在耶路撒冷的人，都必被称为圣洁——就是凡在耶路撒冷被登记、得以存活的人[a][b]。
