id: ISA.4.2
reference: Isaiah 4:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ צֶ֣מַח יְהוָ֔ה לִ/צְבִ֖י וּ/לְ/כָב֑וֹד וּ/פְרִ֤י הָ/אָ֨רֶץ֙ לְ/גָא֣וֹן וּ/לְ/תִפְאֶ֔רֶת לִ/פְלֵיטַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/002.yaml
  text: In that day the branch of Yahweh will be for beauty and for glory[a], and the fruit of the land for majesty and for splendor[b], for the survivors of Israel.
translation:
  language: zh_hans
  text: 到那日，耶和华的嫩芽必成为以色列幸存者[b]的华美和荣耀[a]；地里的出产必成为他们的尊荣和光彩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华的嫩芽”也可译作“耶和华的生长之物”或“耶和华所使生长之物”。希伯来语既可能描绘土地重新繁茂，也可能使人联想到后来先知书中耶和华的“苗裔”意象。
    reason: 保留צֶמַח的农业含义及其可能的弥赛亚共鸣，避免正文或异译过早将其定为人物性称号。
  - marker: b
    text: “以色列幸存者”也可译作“以色列的余民”。
    reason: 保留פְלֵיטָה的传统神学译语。
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 先知话语中常见的时间表达；现代汉语自然、庄重，也不限定所指时间。
- source_word: צֶמַח יְהוָה
  choice: 耶和华的嫩芽
  rationale: צֶמַח可指萌生之物、嫩芽或生长出来的植物。“嫩芽”保留具体植物意象，也不排除后来先知书中“苗裔”意象可能产生的弥赛亚共鸣。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中通行的神名译法，明确对应四字神名。
- source_word: לִצְבִי וּלְכָבוֹד
  choice: 华美和荣耀
  rationale: צְבִי在此表示美丽、华美；כָבוֹד表示荣耀、尊荣。译文保留两个彼此关联而不完全重合的褒义词。
- source_word: וּפְרִי הָאָרֶץ
  choice: 地里的出产
  rationale: פְרִי可指果实或农产；结合土地恢复的语境，“出产”比单指水果的“果子”更准确。הָאָרֶץ在此取“地、土地”义。
- source_word: לְגָאוֹן וּלְתִפְאֶרֶת
  choice: 尊荣和光彩
  rationale: גָאוֹן在此按正面语境译为尊荣，不取“骄傲”；תִפְאֶרֶת译为光彩，以维持诗句中近义而有变化的平行表达。
- source_word: לִפְלֵיטַת יִשְׂרָאֵל
  choice: 以色列幸存者
  rationale: פְלֵיטָה指从灾难或审判中逃脱、存留下来的人。“幸存者”是清楚自然的现代汉语，同时保留“余民”的传统对应作为脚注异译。
theological_decisions:
- issue: צֶמַח יְהוָה是否应明确译成弥赛亚称号
  choice: 耶和华的嫩芽
  alternative: 耶和华使之生长的；耶和华的苗裔
  rationale: 原文既可唤起土地恢复、生机重现的图景，也可能与后来“苗裔”的先知意象相呼应。正文采用不加专名化标记的植物隐喻，避免把潜在的弥赛亚含义定为唯一解释。
- issue: פְלֵיטַת יִשְׂרָאֵל是否采用传统神学用语“以色列的余民”
  choice: 以色列幸存者
  alternative: 以色列的余民
  rationale: 原词直接强调逃脱并存留下来的人；“幸存者”更透明，脚注则保留以赛亚书中具有神学意义的传统“余民”用语。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。为使两个平行分句的归属清楚，第二分句补出“他们的”；这在汉语中明确表达两个介词短语都以“以色列幸存者”为受益者。正文保留诗性四联词语“华美、荣耀、尊荣、光彩”，同时避免机械重复。
