  text: בַּ/יּ֣וֹם הַ/ה֔וּא יוּשַׁ֥ר הַ/שִּׁיר הַ/זֶּ֖ה בְּ/אֶ֣רֶץ יְהוּדָ֑ה עִ֣יר עָז לָ֔/נוּ יְשׁוּעָ֥ה יָשִׁ֖ית חוֹמ֥וֹת וָ/חֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/001.yaml
  text: 'In that day this song will be sung in the land of Judah: “We have a strong city[c][b][a]; he sets salvation as walls and rampart.”'
translation:
  language: zh_hans
  text: '那日，在犹大地必有人唱这首歌：


    “我们有一座坚固的城[a]；


    他把拯救设为城墙和外郭[b][c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坚固的城”也可译作“设防坚固的城”。
    reason: lexical_alternative
  - marker: b
    text: “把拯救设为”也可译作“设立拯救作城墙和外郭”。原文没有明说“他”是谁；按上下文通常理解为上帝。
    reason: alternative_reading
  - marker: c
    text: “外郭”指城墙外辅助防守的垒墙或防御工事，也可译作“外垒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知文学中常见的时间表达；“到那日”自然、庄重，并保留其预告性质。
- source_word: יוּשַׁר הַשִּׁיר הַזֶּה
  choice: 必有人唱这歌
  rationale: יוּשַׁר 是 שׁיר 的 Hophal 未完成式，表达被动意义。现代汉语较少自然地说“这歌必被唱”，故用泛指施事的主动句表达同一被动语义。
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: 犹大地
  rationale: 明确译出 אֶרֶץ，保留地域与国土意味。
- source_word: עִיר עָז לָנוּ
  choice: 我们有一座坚固的城
  rationale: לָנוּ 在无动词句中自然表达领有；עָז 在此指城的强固与防御能力，译作“坚固”符合现代汉语搭配。
- source_word: יְשׁוּעָה
  choice: 拯救
  rationale: 该词可指救助、解救或胜利；“拯救”保留其广泛的救援含义及《以赛亚书》中的神学分量。
- source_word: יָשִׁית
  choice: 以……为
  rationale: שׂים 在此有设置、安置或使之成为防御设施之意；“以拯救为城墙和外郭”简洁表达这一比喻。
- source_word: חוֹמוֹת וָחֵל
  choice: 城墙和外郭
  rationale: חוֹמוֹת 为复数，泛指城墙体系；חֵל 指城外辅助防御的垒墙或外郭，“外郭”能与“城墙”区分并体现防御层次。
theological_decisions:
- issue: יָשִׁית 的主语没有明说
  choice: 保留单数第三人称“他”
  alternative: 明确译作“上帝”，或改作无人称表达
  rationale: 上下文通常使人理解主语是上帝，但本节希伯来文没有直接点名。译作“他”既保留语法信息，也不把上下文推断写进正文。
- issue: יְשׁוּעָה 的语义范围
  choice: 拯救
  alternative: 解救；胜利
  rationale: “拯救”既可指实际脱险，也保留该词在先知书中的较宽神学含义；不限定为军事胜利。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必有人唱”以自然汉语传达希伯来文被动式；诗行保留宣告性的节奏。正文所有脚注标记均与脚注对应。
