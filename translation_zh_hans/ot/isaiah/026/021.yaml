revisions:
- from: 看哪，耶和华正从他的居所出来，要惩罚地上居民的罪孽；地必显露其中的血，不再掩盖其中被杀的人。
  to: 看哪，耶和华正从他的居所出来，要惩罚地上的居民，追讨其罪孽；地必显露所流的血，不再掩盖被杀的人。
  rationale: 修订将“惩罚”直接施于“地上的居民”，并以“追讨其罪孽”呈现原文中罪孽与受审者的关系；后半句调整为更自然的中文，同时保留大地人格化、显露流血证据并不再遮盖死者的平行意象。未添加脚注，因本节的必要歧义已由正文的集合性“地上的居民”与“其罪孽”充分保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:20:48Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了耶和华从居所出来施行审判，以及大地显露血迹、不再掩盖死者的意象。但“惩罚地上居民的罪孽”在中文中容易成为“惩罚罪孽本身”，未清楚表达原文把追讨／惩处落实在犯罪者身上的结构。
  naturalness: “地必显露其中的血”虽可理解，但“其中的血”指代不够顺畅；“地必显露所流的血”更自然，也保留诗歌性的土地见证意象。
  terminology: “耶和华”“居所”“罪孽”“被杀的人”均符合庄重的现代中文圣经语域。将审判对象明确为“地上的居民”，同时以“追讨其罪孽”对应 פקד עון，能避免把罪孽误作直接受罚对象。
  issues:
  - severity: medium
    issue: “惩罚地上居民的罪孽”可能误指罪孽本身为受惩罚者。
    rationale: לפקד עון...עליו 表达上主因其罪孽而追讨、惩处地上居民；中文宜将人作为“惩罚”的对象，罪孽作为追讨的内容。
  - severity: low
    issue: “显露其中的血”指代略显生硬。
    rationale: 原文以“地”的拟人化说法指其所承载、所掩盖的血；“显露所流的血”在中文中更清楚自然，且不作过度解释。
  revised_text: 看哪，耶和华正从他的居所出来，要惩罚地上的居民，追讨其罪孽；地必显露所流的血，不再掩盖被杀的人。
  revised_footnotes: []
