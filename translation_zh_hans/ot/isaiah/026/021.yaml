base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/021.yaml
  text: For look, the LORD is coming out from his place to punish the iniquity of the inhabitant of the earth upon him, and the earth will uncover her blood and will no longer cover her slain.
translation:
  language: zh_hans
  text: 看哪，耶和华正从他的居所出来，要惩罚地上的居民，追讨其罪孽；地必显露所流的血，不再掩盖被杀的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中唤起注意、强调眼前行动的语气，庄重而为现代读者所熟悉。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的专名形式表达四字神名。
- source_word: יֹצֵא מִמְּקוֹמוֹ
  choice: 正从他的居所出来
  rationale: 保留‘出来’的空间意象及未完成式所体现的正在发生或迫近之感；‘居所’比‘地方’更符合庄重语域。
- source_word: לִפְקֹד
  choice: 要惩罚
  rationale: 此处 פקד 与罪孽连用，语境指司法性的追讨和惩处；‘惩罚’自然明确。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: 兼顾行为之罪及其罪责的语义，不将其弱化为一般过错。
- source_word: יֹשֵׁב הָאָרֶץ
  choice: 地上居民
  rationale: 以集合意义表达单数 יֹשֵׁב；既自然，也保留普遍指向。
- source_word: דָּמֶיהָ
  choice: 其中的血
  rationale: 原文为复数‘她的血’，可指在地上所流的诸般血债；中文用‘其中的血’保留土地容纳、显露流血罪证的意象，避免误解为土地自身有血。
- source_word: הֲרוּגֶיהָ
  choice: 其中被杀的人
  rationale: 表达遭杀害者，并使大地不再掩盖他们的意象在现代中文中清楚自然。
theological_decisions:
- issue: עֲוֺן ... עָלָיו 中罪孽与地上居民的关系
  choice: 地上居民的罪孽
  alternative: 临到地上居民身上的罪责／因罪孽惩罚地上居民
  rationale: 按原文结构，将罪孽归属于居民；中文不机械翻出 עָלָיו 的‘在他身上’，因为其作用是强调追讨落到罪人本人身上，而‘惩罚……的罪孽’在中文已自然传达司法追讨，且不额外判定是罪行还是罪责。
- issue: 大地的人格化
  choice: 保留‘地必显露……不再掩盖’的主动意象
  alternative: 地上的流血事件必被揭露，死者也不再被隐藏
  rationale: 原文将地人格化为曾掩盖血与被杀者、如今予以显露的见证者；译文保留这一诗性和审判意象，不将其解释性改写。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。前半句保留神显与审判的迫近感，后半句保留大地人格化的诗歌意象。分号对应两个紧密相连的审判结果。
