  text: כְּמ֤וֹ הָרָה֙ תַּקְרִ֣יב לָ/לֶ֔דֶת תָּחִ֥יל תִּזְעַ֖ק בַּ/חֲבָלֶ֑י/הָ כֵּ֛ן הָיִ֥ינוּ מִ/פָּנֶ֖י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/017.yaml
  text: Like a pregnant woman who is about to give birth writhes and cries out in her labor pains[a], so were we before you, O Yahweh.
translation:
  language: zh_hans
  text: 正如孕妇临近分娩，在阵痛中辗转呼喊；雅威啊，我们在你面前[a]也曾如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你。”希伯来语这短语字面是“从你面前”，可理解为“在你面前”或“在你临在中”；有些人则理解为“因为你”。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  choice: ……也是如此
  rationale: 与后半句的כֵּן共同构成“怎样……也如此”的比喻结构，符合现代汉语表达。
- source_word: הָרָה
  choice: 孕妇
  rationale: 简洁、自然地表达怀孕的女性。
- source_word: תַּקְרִיב לָלֶדֶת
  choice: 临近分娩时
  rationale: 表达接近生产时刻，保留“临近”的语义，同时符合现代汉语习惯。
- source_word: תָּחִיל
  choice: 辗转
  rationale: 在分娩语境中表现因痛苦而身体扭动的鲜明形象，不将其弱化为笼统的“生产”。
- source_word: תִּזְעַק
  choice: 呼喊
  rationale: 表达痛苦中发出的高声呼叫，力度适中而不夸张。
- source_word: בַּחֲבָלֶיהָ
  choice: 因阵痛
  rationale: 此处חבלים指生产的疼痛；“阵痛”是现代汉语中清楚自然的对应表达。介词ב在语境中可表达处于阵痛之中或由阵痛引发。
- source_word: כֵּן
  choice: 也是如此
  rationale: 明确收束前面的比喻，并自然连接以色列群体的处境。
- source_word: הָיִינוּ
  choice: 我们……也是如此
  rationale: 表达第一人称复数完成式所描述的群体状态；汉语不强行标示英语式时态。
- source_word: מִפָּנֶיךָ
  choice: 在你面前
  rationale: 贴近“在你面容之前”的空间与关系意象，保留可理解为“在你面前／在你同在中”的含义，不直接断定为因果。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”保留专名性质，并与源文本所要求的Yahweh处理一致。
- issue: מִפָּנֶיךָ 在比喻中的含义
  choice: 在你面前
  alternative: 因为你；在你临在之中
  rationale: 该短语字面涉及“面前／面容”，也可能带有原因意味。“在你面前”保留神的临在与百姓痛苦之间未被明说的张力，不擅自确定因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。前半句以分号连接比喻与本体，保留孕妇阵痛、辗转和呼喊的强烈形象；呼格“雅威啊”置于后半句开头，使语气自然。脚注标记置于真正存在释义分歧的“在你面前”之后。
