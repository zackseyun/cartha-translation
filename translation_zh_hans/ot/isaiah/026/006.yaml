  text: תִּרְמְסֶ֖/נָּה רָ֑גֶל רַגְלֵ֥י עָנִ֖י פַּעֲמֵ֥י דַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/006.yaml
  text: The foot tramples it— the feet of the poor[b][a], the steps of the needy.
translation:
  language: zh_hans
  text: '脚必践踏它[a]——

    困苦人的脚，穷乏人的脚步[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必践踏它”也可译作“践踏它”；希伯来语动词在这里既可按上下文表达将来，也可作为生动的诗歌描写。
    reason: lexical_alternative
  - marker: b
    text: “穷乏人”也可译作“贫穷人”、“弱小者”或“卑微人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְמְסֶנָּה
  choice: 必践踏它
  rationale: רמס意为“践踏、踩踏”。这里是未完成式，结合上下文可表达将来或确定将发生的行动；阴性宾语后缀承接第5节被降卑的“高城”，故译为“它”。
- source_word: רָגֶל
  choice: 脚
  rationale: 阴性单数名词在诗句中作集合性、形象化用法，并由下文“困苦人的脚”加以展开；保留单数可再现原文的诗意结构。
- source_word: רַגְלֵי
  choice: ……人的脚
  rationale: רֶגֶל的复数附属形式，指出践踏者；汉语以“困苦人的脚”自然表达。
- source_word: עָנִי
  choice: 困苦人
  rationale: 该词兼有贫穷、受苦、受压迫或卑微之意。“困苦人”保留其经济处境与受压境遇的重叠含义，避免只限定为物质贫穷。
- source_word: פַּעֲמֵי
  choice: ……人的脚步
  rationale: 意为“脚步、足迹”，与前面的“脚”构成同义平行；“脚步”既自然又保留诗歌意象。
- source_word: דַלִּים
  choice: 贫弱人
  rationale: דַל可指贫穷、弱小、卑微或缺乏能力的人。“贫弱人”与“困苦人”相呼应，同时没有把两个近义词完全合并。
theological_decisions:
- issue: “践踏它”中阴性宾语后缀的所指
  choice: 理解为承接第5节那座被降卑的高城
  alternative: 将宾语视为未明确说明的阴性对象
  rationale: 紧接的上下文以高城被推倒在地为主题，本节继续描绘它被困苦卑微者践踏；译出“它”保留原文代词，又不在本节重复补入“城”。
- issue: 动词的时间和语气
  choice: 译作“必践踏”，表达上下文中的将来性与确定性
  alternative: 译作“践踏”，采用诗歌性的生动现在时
  rationale: 希伯来语未完成式在这一预言语境中自然可有将来意味；“必”也传达诗句所呈现之逆转的确定性，但不把它解释成额外的教义命题。
translation_notes:
  register: 采用现代、庄重而清楚的诗体汉语，以破折号呈现原文后半句对“脚”的同位展开。用“困苦人／贫弱人”保留עָנִי与דַלִּים之间重叠却不完全相同的语义，并保持“脚／脚步”的平行结构。
