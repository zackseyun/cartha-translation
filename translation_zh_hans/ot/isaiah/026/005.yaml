source:
  edition: WLC
  text: כִּ֤י הֵשַׁח֙ יֹשְׁבֵ֣י מָר֔וֹם קִרְיָ֖ה נִשְׂגָּבָ֑ה יַשְׁפִּילֶ֤/נָּה יַשְׁפִּילָ/הּ֙ עַד אֶ֔רֶץ יַגִּיעֶ֖/נָּה עַד עָפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/005.yaml
  text: For he has brought down those who dwell on high[a], the lofty city; he lays it low, he lays it low to the earth; he brings it down to the dust.
translation:
  language: zh_hans
  text: 因为他使住在高处的居民和那高耸的城都降卑；他使它降卑，使它降到地上，使它触及尘土[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那被高举的城”或“那建在高处的城”。希伯来文没有说明这城的名称。
    reason: 保留נִשְׂגָּבָה的词义范围，并避免在译文中指定某座城市。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明赞美和信靠的缘由；现代汉语中“因为”自然表达解释关系。
- source_word: הֵשַׁח
  choice: 使……降卑
  rationale: שׁחח的使役式表示使之低下或受辱；“降卑”兼顾空间下降与地位受挫的双重意象。
- source_word: יֹשְׁבֵי מָרוֹם
  choice: 那些住在高处的人
  rationale: 保留原文的空间表达及其可能暗含的尊贵、自高或安全感，不把隐喻意义写死。
- source_word: קִרְיָה נִשְׂגָּבָה
  choice: 那高耸的城
  rationale: קִרְיָה意为城，נִשְׂגָּבָה表示被置于高处或高耸；此译保留具体的高度意象，又不指定某座历史城市。
- source_word: יַשְׁפִּילֶנָּה יַשְׁפִּילָהּ
  choice: 他使它降下，使它降到地上
  rationale: 保留שׁפל使役式的连续重复，以呈现希伯来诗歌的强调；第二句结合עַד אֶרֶץ自然译出下降的终点。
- source_word: עַד אֶרֶץ
  choice: 到地上
  rationale: אֶרֶץ在此与“尘土”平行，指地面；“到地上”既贴近词义，也符合现代汉语。
- source_word: יַגִּיעֶנָּה
  choice: 使它落到
  rationale: נגע使役式字面为“使之触及/到达”；在城被降下的语境中，“使它落到”自然表达其抵达尘土的结果。
- source_word: עַד עָפָר
  choice: 到尘土中
  rationale: עָפָר为尘土，带有彻底降卑的诗性意象；“尘土中”在汉语中自然庄重。
theological_decisions:
- issue: 是否把“高耸的城”认定为某一座历史城市或某种特定势力
  choice: 保持泛指，不点明城市名称
  alternative: 巴比伦、人类的骄傲，或任何敌对而自高的城
  rationale: 希伯来文本没有给出城名。译文保留诗句的开放性，使具体认定留在解释层面。
- issue: יֹשְׁבֵי מָרוֹם与קִרְיָה נִשְׂגָּבָה之间的句法关系
  choice: 以“就是”表达同位说明
  alternative: 将二者理解为彼此独立的两个宾语
  rationale: 上下文和阴性单数代词更自然地指向“城”，而“住在高处的人”可由“高耸的城”进一步说明；但脚注同时保留该短语自身可能的理解范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文连续“使……降下”的强化结构，同时避免生硬逐词对应；以“高耸”维持全节从高处降到地上、尘土中的垂直意象。
