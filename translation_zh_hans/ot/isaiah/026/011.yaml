  text: יְהוָ֛ה רָ֥מָה יָדְ/ךָ֖ בַּל יֶחֱזָי֑וּ/ן יֶחֱז֤וּ וְ/יֵבֹ֨שׁוּ֙ קִנְאַת עָ֔ם אַף אֵ֖שׁ צָרֶ֥י/ךָ תֹאכְלֵֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/011.yaml
  text: O Yahweh[a], your hand is lifted up, but they do not see. They will see and be put to shame by the zeal for your people; indeed[b], the fire for your enemies will consume them.
translation:
  language: zh_hans
  text: 耶和华啊，你的手高高举起，他们却看不见。他们必看见你向百姓所发的热心[a]，就蒙羞；甚至，火必吞灭你的敌人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“百姓的热心”。希伯来语这一短语十分简练，可有不止一种理解。
    reason: alternative_reading
  - marker: b
    text: 或译：“你敌人的火必吞灭他们。”希伯来语的词序容许这种理解；正文则按火吞灭敌人来译。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 采用现代中文圣经语体中广为人知的专名“耶和华”，并以“啊”表达呼格。
- source_word: רָמָה יָדְךָ
  choice: 你的手高高举起
  rationale: 保留“手”与“高举”的具体意象，不进一步限定为审判、能力或预备行动。
- source_word: בַּל יֶחֱזָיוּן
  choice: 他们却看不见
  rationale: 直译“看见”，以“却”显明神的手已经举起而他们仍未察觉的反差。
- source_word: יֶחֱזוּ וְיֵבֹשׁוּ
  choice: 他们必看见，并……而蒙羞
  rationale: 将未完成式理解为将来结果，保留从“不看见”到“必看见”的修辞逆转；“蒙羞”自然表达其受辱结果。
- source_word: קִנְאַת עָם
  choice: 你为百姓所发的热心
  rationale: קִנְאָה在此取“热心”而非“嫉妒”；结合上下文，将紧缩的属格结构理解为耶和华为其百姓所发的热心，但以脚注保留“百姓的热心”这一可能读法。
- source_word: אַף
  choice: （以分号和递进语势表达）
  rationale: 此处可作强调或递进；中文不必机械加入“诚然”，分号后的末句自然承接并加强审判语气。
- source_word: אֵשׁ צָרֶיךָ תֹאכְלֵם
  choice: 你的怒火必吞灭你的敌人
  rationale: 将“火”按神施行审判的语境译为“怒火”，并把代词“他们”的所指明确为“你的敌人”；脚注保留“你敌人的火”这一句法可能。
theological_decisions:
- issue: קִנְאַת עָם的归属与对象
  choice: 神为百姓所发的热心
  alternative: 百姓的热心
  rationale: 上下文论及耶和华举手行动及其敌人受审判，因此神为百姓大发热心较切合语境；但希伯来语属格结构简约，本身仍容许“百姓的热心”，故不在正文外彻底排除。
- issue: אֵשׁ צָרֶיךָ的句法关系
  choice: 审判敌人的神之火，即“你的怒火”
  alternative: 你敌人的火
  rationale: 后接复数宾语“他们”，最自然指前面的敌人，故理解为火吞灭敌人；然而紧缩词序也可能使צָרֶיךָ修饰“火”，因此用脚注保存异读。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华啊”保留呼告语气；全句维持诗歌式的对照与递进。正文避免加入宗派性解释，并以脚注保存两处真实的希伯来语歧义。
