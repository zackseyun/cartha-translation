revisions:
- from: 耶和华啊，你的手高高举起，他们却看不见。他们必看见，并因你为百姓所发的热心[a]而蒙羞；你的怒火必吞灭你的敌人[b]。
  to: 耶和华啊，你的手高高举起，他们却看不见。他们必看见你向百姓所发的热心[a]，就蒙羞；甚至，火必吞灭你的敌人[b]。
  rationale: 恢复“火”的字面意象，删除原文未明说的“怒”。同时将第二句调整为“看见……，就蒙羞”，既保留从“不看见”到“必看见”的对照，也不把紧缩的希伯来语关系过度解释。“甚至”表达אַף的递进／强调作用；两则脚注均保留原文真实存在的句法歧义。
