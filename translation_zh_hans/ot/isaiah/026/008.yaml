source:
  edition: WLC
  text: אַ֣ף אֹ֧רַח מִשְׁפָּטֶ֛י/ךָ יְהוָ֖ה קִוִּינ֑וּ/ךָ לְ/שִׁמְ/ךָ֥ וּֽ/לְ/זִכְרְ/ךָ֖ תַּאֲוַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/008.yaml
  text: Indeed[a], in the path of your judgments, O Yahweh, we have waited for you[b]; for your name and your remembrance are the desire of the soul.
translation:
  language: zh_hans
  text: 耶和华啊，诚然，我们在你审判[a]的道路上等候你；心灵所渴慕的，是你的名和对你的记念[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判”也可译作“公正”或“法令”。
    reason: lexical_alternative
  - marker: b
    text: “对你的记念”也可译作“你的记念”或“你的名声”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: 也
  rationale: 此处可作附加兼强调语气。“也”自然承接上下文，同时保留“甚至、诚然”等可能语感，不作过度强化。
- source_word: אֹרַח
  choice: 路
  rationale: 保留希伯来文以道路比喻行事进程或处境的诗歌意象。
- source_word: מִשְׁפָּטֶיךָ
  choice: 你施行审判
  rationale: מִשְׁפָּט可指审判、公正或法令；结合以赛亚书26章上文神在世上施行审判的语境，用动宾结构使现代汉语自然，同时保留司法行动的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的传统音译呈现四字神名，而不以称号“主”替代。
- source_word: קִוִּינוּךָ
  choice: 我们等候你
  rationale: קוה含带着盼望等候之意；“等候你”保留直接宾语，也不把“盼望”的意味解释性地写入正文。
- source_word: לְשִׁמְךָ
  choice: 你的名
  rationale: 直译并保留“名”所涵盖的身份、声誉和启示等丰富含义。
- source_word: וּלְזִכְרְךָ
  choice: 对你的记念
  rationale: זֵכֶר可表示记念、名声或纪念；此译在汉语中较自然，并保留“人对神的记念”与“神使人记得他的名”之间的诗意空间。
- source_word: תַּאֲוַת נָפֶשׁ
  choice: 心灵所渴慕的
  rationale: 以自然而庄重的汉语表达“心灵的渴望”，保留单数 נֶפֶשׁ 的概括性诗歌表达，不擅自补成明确的复数领属。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最广为人知的专名“耶和华”，避免以“主”这一称号代替专名；“雅威”是较贴近学术重构发音的另一译法。
- issue: מִשְׁפָּטֶיךָ 在本节中的含义
  choice: 你施行审判
  alternative: 你的公正／你的法令
  rationale: 上下文强调神在历史中公正的审判行动；正文保留“审判”的具体性，同时用脚注承认该词也可侧重公正秩序或法令。
- issue: זִכְרְךָ 的指向
  choice: 对你的记念
  alternative: 你的记念／你的名声
  rationale: 该词可指神被人记念，也可指使其名存留的纪念或名声。正文不将其缩减为单纯的声誉，并以脚注保留其他理解。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。句式保留希伯来诗歌中“道路”和“渴慕”的意象；“耶和华啊”体现直接呼告，“是心灵所渴慕的”维持原文末尾的强调。
