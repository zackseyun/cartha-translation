base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/016.yaml
  text: O Yahweh[a], in distress they sought you[c][b]; they poured out a whispered prayer when your discipline was upon them.
translation:
  language: zh_hans
  text: 耶和华啊，他们在困苦中寻求你[a]；当你的管教[c]临到他们时，他们倾吐低声的祈求[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“转向你”“留意你”或“探访你”；希伯来语动词可表示留心、寻求或探访某人。
    reason: lexical_alternative
  - marker: b
    text: 或译“倾吐低语”或“发出喃喃之声”；希伯来原文十分凝练，可能描写人在患难中低声恳求。
    reason: lexical_alternative
  - marker: c
    text: “管教”也可译作“惩戒”“纠正”或“训诲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代中文通行的专名“耶和华”表达四字神名；加“啊”体现此处直接呼告的语气。
- source_word: בַּצַּר
  choice: 在困苦中
  rationale: צַר在此指受压、患难的处境，并非字面上的狭窄之地；“困苦”自然且符合上下文。
- source_word: פְּקָדוּךָ
  choice: 寻求你
  rationale: פקד语义范围较广，可指眷顾、访问、留意或转向；在困苦中向神低声祈求的语境里，“寻求你”最为顺畅，同时以脚注保留其他可能。
- source_word: צָקוּן
  choice: 倾吐
  rationale: 该动词表达倒出、倾出的动作；与祷告言语搭配时，“倾吐”既保留意象，也符合现代中文表达。
- source_word: לַחַשׁ
  choice: 低声的祷告
  rationale: לחש可指耳语、低语或喃喃之声；此处是向耶和华求告的语境，因此译为“低声的祷告”，但不排除较字面的“低语”。
- source_word: מוּסָרְךָ
  choice: 你的管教
  rationale: מוּסָר兼有管教、纠正和训诲之义；本节把困苦与转向神相连，“管教”保留惩戒与教导并存的意味。
- source_word: לָמוֹ
  choice: 临到他们
  rationale: 介词加第三人称复数词尾在紧凑的希伯来语句中表明管教与他们的关系；译作“临到他们”使中文关系清楚而不过度解释。
theological_decisions:
- issue: מוּסָר所表达的神之作为
  choice: 管教
  alternative: 训诲；惩戒
  rationale: “管教”能同时容纳纠正、教导与痛苦经历，不把本节单独限定为纯粹教育或严厉刑罚。
- issue: לַחַשׁ的性质
  choice: 低声的祷告
  alternative: 低语；喃喃之声；咒语
  rationale: 上下文是人在困苦中寻求耶和华，因此祈求性的理解较合适；“低声”保留原词所含的轻微、隐约语气，而不引入上下文未要求的巫术含义。
- issue: פקד在此处的关系含义
  choice: 寻求你
  alternative: 转向你；留意你；访问你
  rationale: 该动词本身有真实的语义宽度；正文依祷告语境采用“寻求”，脚注则明确保留“转向”等可能，避免把歧义完全消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华啊”保留呼告语气；分号呈现原句由困苦中寻求神转入管教下低声祈求的诗性推进。脚注标记按其实际所解释的词语重新对应，以避免英文咨询层中标记位置与脚注内容不一致的问题。
