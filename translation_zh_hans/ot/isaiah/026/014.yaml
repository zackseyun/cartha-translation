  text: מֵתִים֙ בַּל יִחְי֔וּ רְפָאִ֖ים בַּל יָקֻ֑מוּ לָ/כֵ֤ן פָּקַ֨דְתָּ֙ וַ/תַּשְׁמִידֵ֔/ם וַ/תְּאַבֵּ֥ד כָּל זֵ֖כֶר לָֽ/מוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/014.yaml
  text: The dead do not live[a]; the shades do not rise. Therefore you have punished them and destroyed them[c][b], and you have made all memory of them perish.
translation:
  language: zh_hans
  text: 死者不能活，阴间的亡魂[a]不能起来。因此，你追讨了他们[b]，将他们毁灭，并使所有关于他们的记念都灭绝了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间的亡魂”：希伯来语רְפָאִים在这里指阴间的死者，不是古代称为“利乏音人”的族群。
    reason: lexical_alternative
  - marker: b
    text: “追讨了”或译“察问了”或“惩罚了”。希伯来语动词可指眷顾或追究；本节下文的毁灭用语表明这里是审判性的追讨。
    reason: lexical_alternative
  - marker: c
    text: 直译：“使他们所有的记念灭亡。”
    reason: literal_rendering
lexical_decisions:
- source_word: מֵתִים
  choice: 死者
  rationale: 该词在此作名词使用，指已经死去的人；“死者”简洁、庄重，也保留了集合意义。
- source_word: בַּל יִחְיוּ
  choice: 不再活
  rationale: בַּל是诗歌中的否定词，与未完成式连用，可表达现状或将来的否定。“不再活”在现代汉语中自然，并避免把时态严格限定为现在或未来。
- source_word: רְפָאִים
  choice: 阴间的亡魂
  rationale: 本节与“死者”平行，所指是在阴间的死者，并非古代称为“利乏音人”的族群。“阴间的亡魂”能让普通读者明白其语境含义。
- source_word: בַּל יָקֻמוּ
  choice: 不再起来
  rationale: קום基本义为“起来、站起”；此处与“不再活”平行。“起来”保留了从死亡中兴起以及重新站立的诗性张力。
- source_word: לָכֵן
  choice: 因此
  rationale: 明确表达前后之间的结果或推论关系，并符合本节庄重的诗歌语体。
- source_word: פָּקַדְתָּ
  choice: 追讨了
  rationale: פקד可表示眷顾、察看、追究或施行惩罚；下文的“毁灭”使审判性的含义更合语境。“追讨”既传达问责与惩治，也不把词义收窄为单一施罚动作。
- source_word: וַתַּשְׁמִידֵם
  choice: 将他们毁灭
  rationale: שׁמד表示强烈的毁坏或除灭。“毁灭”保留力度，同时不额外引入关于绝对消亡的哲学判断。
- source_word: וַתְּאַבֵּד כָּל זֵכֶר לָמוֹ
  choice: 使关于他们的一切记念都消逝了
  rationale: 该短语直陈与他们有关的一切记念都被除去。“消逝”兼顾אבד的灭失含义和现代汉语的自然表达。
theological_decisions:
- issue: רְפָאִים在本节所指为何
  choice: 阴间的死者，即“阴间的亡魂”
  alternative: 古代族群“利乏音人”
  rationale: 该词与“死者”平行，并与“活”“起来”搭配，因此上下文指向死去的人，而不是某个古代族群。
- issue: “不再起来”是否否定一切复活
  choice: 按诗歌语境表达这些受审判者不能重新兴起
  alternative: 把本句理解为普遍否定任何死者复活
  rationale: 本节处于论述敌对统治者或势力受审判的诗歌语境中。译文保留“起来”的直接表达，不将其扩展成对所有复活的教义性否定，也不消除原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语，并保留希伯来诗句的平行结构：“死者／阴间的亡魂”与“不再活／不再起来”相互对应。用“追讨”保留פקד兼有察问、问责和施罚的语义幅度。
