source:
  edition: WLC
  text: יֻחַ֤ן רָשָׁע֙ בַּל לָמַ֣ד צֶ֔דֶק בְּ/אֶ֥רֶץ נְכֹח֖וֹת יְעַוֵּ֑ל וּ/בַל יִרְאֶ֖ה גֵּא֥וּת יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/010.yaml
  text: Though favor is shown to the wicked[a], he does not learn righteousness; in a land of uprightness he acts unjustly[e][d][c][b], and he does not see the majesty of Yahweh.
translation:
  language: zh_hans
  text: 恶人虽蒙恩待[a]，仍不学习公义[b]；在正直之地[c]，他仍行不义，也看不见[d]耶和华的威严[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人若蒙恩待”。希伯来文开头也可理解为条件关系。
    reason: alternative_reading
  - marker: b
    text: “公义”也可译为“正义”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“在正直的国土上”或“在公平之地”。
    reason: lexical_alternative
  - marker: d
    text: 这里的“看见”也有“察觉、认识”的意思。
    reason: lexical_alternative
  - marker: e
    text: “威严”也可译为“崇高”或“至高”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻחַן
  choice: 虽蒙恩待
  rationale: 该词是 חנן 的 Hophal 形，表示“被施恩、蒙恩待”。“虽”按上下文表达让步关系，同时保留被动含义。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 单数形容词作名词使用，泛指邪恶的人；“恶人”简洁自然，并保留代表性单数。
- source_word: בַּל לָמַד
  choice: 仍不学习
  rationale: בַּל 表否定，למד 的 Qal 通常意为“学习”。加入“仍”自然呈现让步结构下顽固不改的意味，而不改变命题内容。
- source_word: צֶדֶק
  choice: 公义
  rationale: צֶדֶק 可指公义、正义或正直；此处所学的是广泛的道德正当性，“公义”较能涵盖其范围。
- source_word: בְּאֶרֶץ נְכֹחוֹת
  choice: 在正直之地
  rationale: נְכֹחוֹת 表示正直、端正、公平；“正直之地”保留原文抽象复数所营造的道德环境，也避免把它仅理解为地势平坦。
- source_word: יְעַוֵּל
  choice: 他仍行不义
  rationale: עול 的 Piel 形表示行事不公、作恶。“行不义”与前句“公义”形成清楚的词义对照；“仍”突显即便身处正直之地也照样如此。
- source_word: וּבַל יִרְאֶה
  choice: 也看不见
  rationale: ראה 本义为“看见”，此处也可含察觉、认识之意。正文保留视觉意象，以脚注说明其认知含义。
- source_word: גֵּאוּת
  choice: 威严
  rationale: גֵּאוּת 可指高耸、崇高、尊威；用于耶和华时，“威严”自然庄重，又不与其他常译为“荣耀”的希伯来词混同。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语域中广为人知的专名“耶和华”表达四字神名，区别于称号“主”。
theological_decisions:
- issue: 开头分句是让步关系还是条件关系
  choice: 让步式：“恶人虽蒙恩待”
  alternative: 条件式：“恶人若蒙恩待”
  rationale: 上下文强调恶人即使得到恩待也不学习公义；让步式较贴合本节的对照和责难语气，但希伯来文未用明确的条件或让步连词，因此在脚注保留条件式理解。
- issue: “看不见”是视觉动作还是属灵认知
  choice: 正文保留“看不见”
  alternative: “不能领悟”或“不承认”
  rationale: 原文使用常见动词 ראה“看见”，既保有鲜明意象，也可在语境中表达察觉或承认；不宜在正文中把含义限死为某一种神学心理状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“恶人虽蒙恩待”保持原文被动和让步张力；“公义／行不义”形成清晰对应。所有词义及句法上真实存在的替代解释均置于脚注，不在正文中消除歧义。
