base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/004.yaml
  text: Trust in the LORD forever, for in Yah, the LORD, is an everlasting rock.
translation:
  language: zh_hans
  text: 你们要永远信靠耶和华，因为雅[a]——耶和华是永恒的磐石。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅”是“耶和华”的希伯来语短式。原文此处字面作“因为在雅，耶和华……”，其中“在”的句法关系有不同理解；本译文按上下文将其理解为对耶和华的强调性称谓。
    reason: 说明短式神名，并保留介词结构的译法争议，而不让不自然的中文句式改变“耶和华是磐石”的核心隐喻。
lexical_decisions:
- source_word: בִּטְחוּ
  choice: 你们要……信靠
  rationale: 希伯来语是阳性复数祈使式；补出“你们”以自然表达对群体的劝勉，并用“信靠”体现倚赖、投靠之意。
- source_word: עֲדֵי עַד
  choice: 永远
  rationale: 这是强调持续无尽的惯用语；“永远”简明、自然，也保留时间上的无限性。
- source_word: בְּיָהּ יְהוָה
  choice: 在雅——耶和华里面
  rationale: 保留介词“在……里面”，不把它静默改写为简单主语；破折号体现“雅”与“耶和华”紧密并列，同时保留原文不同寻常的表达。
- source_word: צוּר עוֹלָמִים
  choice: 永恒的磐石
  rationale: “磐石”保留力量、稳固和庇护的隐喻；“永恒的”自然表达复数形式“诸世代／永世”的持续含义。
theological_decisions:
- issue: בְּיָהּ יְהוָה 中介词 בְּ 的处理
  choice: 译作“在雅——耶和华里面”
  alternative: 译作“雅——耶和华是永恒的磐石”
  rationale: 原文明确有介词 בְּ；虽然省略介词的译法更流畅，也有句法上的解释空间，但正文保留“在……里面”，以避免消除原文的特殊结构和可能的神学张力。
- issue: 神名 יָהּ 与 יהוה 的关系
  choice: 分别译作“雅”和“耶和华”，以破折号相连
  alternative: 将两者合并，只译作“耶和华”
  rationale: 原文同时出现神名的短式和完整形式；分别呈现可保留其强调效果，而不额外断定二者确切的句法关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“永远信靠”“永恒的磐石”保持诗歌的凝练感；破折号帮助读者辨认原文中两个紧密相连的神名形式。
