base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/002.yaml
  text: Open the gates[a], that the righteous nation may enter, the one that keeps faithfulness.
translation:
  language: zh_hans
  text: 打开城门，让那公义、持守忠信[a]的民族进入。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信”也可译作“信实”“诚信”“真理”或“信靠”。希伯来语 אֱמֻנִים 可按语境表示忠诚可靠、真实或信靠。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ
  choice: 打开
  rationale: 这是复数命令式，直截了当地命令守门者把门打开；“打开”符合现代汉语表达。
- source_word: שְׁעָרִים
  choice: 城门
  rationale: 原文为复数“门”；上下文指城的门，汉语用集合性的“城门”自然且明确。
- source_word: וְיָבֹא
  choice: 让……进入
  rationale: 命令式之后的连词加未完成式可表达目的或结果；“让……进入”既保留语气，也契合城门意象。
- source_word: גוֹי צַדִּיק
  choice: 公义的国民
  rationale: גוי 指作为整体的民族或国民，צדיק 表示合乎正义、正直；“公义的国民”保留其集体及道德—盟约含义，又避免让现代读者误解为国家政权。
- source_word: שֹׁמֵר
  choice: 持守
  rationale: 分词描述这群国民持续守护、遵行的特征；“持守”可自然表达持续不变的坚守。
- source_word: אֱמֻנִים
  choice: 忠信
  rationale: 该词可涵盖忠诚、可信、真实或信实；“忠信”在此较完整地表达坚定可靠的忠诚，同时不缩减为单纯主观信念。
theological_decisions:
- issue: אֱמֻנִים 描述公义国民时的含义
  choice: 忠信
  alternative: 信实、诚信、真理或信仰
  rationale: 上下文以持续忠诚可靠的品格刻画这群国民。“忠信”保留道德与盟约层面的张力，不把它限定为后来教义化意义上的主观“信仰”；脚注同时保存原词可能包含的其他含义。
- issue: גוֹי צַדִּיק 的集体所指
  choice: 公义的国民
  alternative: 公义的国家／公义的民族
  rationale: 原文把整体群体拟作进入城门的主体。“国民”保留其集体性质，并使后面的单数分词在汉语中自然指向这群人，而不把行为归给抽象政体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“打开城门”保留命令的简洁有力；以“就是那……的民”呈现原文后置的分词描述。正文中的[a]对应词义脚注，并保留 אֱמֻנִים 的真实歧义。
