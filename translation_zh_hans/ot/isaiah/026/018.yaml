  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָרִ֣ינוּ חַ֔לְנוּ כְּמ֖וֹ יָלַ֣דְנוּ ר֑וּחַ יְשׁוּעֹת֙ בַּל נַ֣עֲשֶׂה אֶ֔רֶץ וּ/בַֽל יִפְּל֖וּ יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/018.yaml
  text: We were pregnant[a], we writhed in labor; as it were, we gave birth to wind. We accomplished no deliverance in the earth[c][b], and the inhabitants of the world were not born.
translation:
  language: zh_hans
  text: 我们怀了孕，忍受产痛；仿佛生下的是风[b]。我们未能在地上成就拯救；世上的居民也未曾倒下[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “风”也可译作“气息”或“灵”；希伯来语原词兼有这些含义。
    reason: lexical_alternative
  - marker: c
    text: “倒下”所对应的希伯来语动词通常意为“落下”或“倒下”。鉴于本节的怀孕和生产意象，也有人理解为“降生”或“出生”。
    reason: alternative_reading
lexical_decisions:
- source_word: הָרִינוּ
  choice: 我们怀了孕
  rationale: 该词是 הרה 的 Qal 完成式第一人称复数，表示怀孕或受孕；“怀了孕”自然承接下文的产痛和生产意象，“受了孕”作为词义差异列入脚注。
- source_word: חַ֔לְנוּ
  choice: 经历产痛
  rationale: 在生产语境中，חול/חיל 指产痛、临产时的痛苦或辗转；此译保留强烈的生产意象，同时符合现代汉语表达。
- source_word: כְּמוֹ
  choice: 却仿佛
  rationale: 该词引出比较或带有限定意味的描述；“仿佛”保留原文的比拟语气，加“却”则自然显明劳苦与结果之间的反差。
- source_word: יָלַדְנוּ
  choice: 生下了
  rationale: ילד 是常用的生产动词；“生下了”清楚、自然，并与前面的怀孕和产痛连贯。
- source_word: רוּחַ
  choice: 风
  rationale: רוּחַ 可指风、气息或灵；在徒劳生产的语境中，“风”最能表达结果的空虚，同时不引入原文没有明确要求的圣灵论含义。其他词义在脚注中保留。
- source_word: יְשׁוּעֹת
  choice: 拯救
  rationale: ישׁועה 的复数可指拯救的行动、救助或胜利；此处用集合意义的“拯救”最自然，并与群体哀叹的语境相称。
- source_word: בַּל נַעֲשֶׂה אֶרֶץ
  choice: 我们未能在地上成就拯救
  rationale: בַּל 是诗体否定词；עשה 与抽象宾语搭配可表示成就或带来。אֶרֶץ 可指地或大地，此处与下句 תבל“世界”相应，译作“地上”较为宽广。
- source_word: יִפְּלוּ
  choice: 未曾降生
  rationale: נפל 通常意为“落下、倒下”，但在本节连续的怀孕、产痛和生产意象中，可理解为“落地出生、降生”。主文采用符合语境的“降生”，同时在脚注保留普通词义“倒下”的可能。
- source_word: יֹשְׁבֵי תֵבֵל
  choice: 世上的居民
  rationale: 这是指世界居民的常见表达；“世上的居民”简洁庄重，并保留 תבל 与前句 אֶרֶץ 的诗体呼应。
theological_decisions:
- issue: 生产比喻中 רוּחַ 的含义
  choice: 风
  alternative: 气息；灵
  rationale: 全节描述怀孕、阵痛却没有带来拯救的徒劳；“风”最能保留空虚无果的意象。译作“灵”容易赋予积极或圣灵论意义，而上下文并无充分依据。
- issue: 末句 יִפְּלוּ 的解释
  choice: 未曾降生
  alternative: 未曾倒下
  rationale: 该动词的一般意义是“落下、倒下”，但本节的生产意象使“落地出生、降生”的解释十分 plausible，且与“世上的居民”作为未能产生的结果相连。为不掩盖词汇张力，主文采用语境解释，脚注注明通常词义。
- issue: יְשׁוּעֹת 的数与范围
  choice: 集合意义的“拯救”
  alternative: 种种拯救；胜利
  rationale: 希伯来文为复数，但现代汉语以不可数或集合性的“拯救”表达更自然；不将其具体化为军事“胜利”，以免缩窄语义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“怀了孕—产痛—生下”为连续意象，用“却仿佛只”传达劳苦最终归于虚空的反差。“成就拯救”略带诗体庄重感，但仍属现代汉语。所有词义歧义与末句的解释张力均通过脚注明确保留。
