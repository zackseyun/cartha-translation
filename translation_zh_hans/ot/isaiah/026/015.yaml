base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/015.yaml
  text: You have increased the nation[a], O Yahweh; you have increased the nation; you have gained glory[b]; you have extended all the borders of the land.
translation:
  language: zh_hans
  text: '耶和华啊，你使这国增多；

    你使这国增多，你得荣耀[a]；

    你把这地四周的边界都推远了[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你受了尊崇”、“你得了尊荣”，或“你使自己显为荣耀”。
    reason: lexical_alternative
  - marker: b
    text: 或译“你使全地的尽头都远远延伸”。希伯来语可指“尽头、边缘或边界”；按本节语境，较可能是指这地的疆界。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַפְתָּ
  choice: 你使……增多
  rationale: יסף与介词ל及集合名词连用，在这里表达使国民增多、使国家壮大的意思。译作“使……增多”既保留重复结构，也不把含义局限于领土扩张。
- source_word: לַגּוֹי
  choice: 这国
  rationale: גּוֹי通常指“国、民族”。定冠词所指的对象可由语境识别，现代汉语用“这国”比生硬的“那国”或抽象的“民族”更自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文中对神圣四字名最通行、最易识别的音译“耶和华”，保留其作为专名的性质。
- source_word: נִכְבָּדְתָּ
  choice: 得了荣耀
  rationale: כבד的Nifal完成式可表达被尊崇、显为荣耀或获得荣耀的结果。“得了荣耀”简洁自然，并保留施事与反身意味上的一定开放性；其他可能译法收入脚注。
- source_word: רִחַקְתָּ
  choice: 使……远远扩展
  rationale: רחק在使役性语境中表示使之变远。与地界搭配时，意为把边界推远、扩展疆域；“远远扩展”兼顾原有空间意象和现代汉语表达。
- source_word: כָּל קַצְוֵי אָרֶץ
  choice: 这地的四境
  rationale: קצה可指尽头、边缘或边界；在国家增多和疆界推远的上下文中，“这地的四境”最贴切，同时保留复数边缘的整体表达。较宏观的“全地尽头”另列脚注。
theological_decisions:
- issue: אָרֶץ的范围
  choice: 这地
  alternative: 全地／大地
  rationale: 本节把国家的增多与边界被推远并列，因此领土意义的“这地”更符合语境。这是上下文判断，并非排除该词在别处指全地或大地的可能。
- issue: נִכְבָּדְתָּ的语态与施事
  choice: 得了荣耀
  alternative: 你受了尊崇／你彰显了荣耀／你使自己显为荣耀
  rationale: Nifal形式容许被动、状态结果或近似反身的理解。正文不明确指定是谁使耶和华得荣耀，避免把语法上的张力化约为单一神学解释。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语；保留原文“你使这国增多”的重复以呈现诗歌强调。“四境远远扩展”避免僵硬直译“使所有边界变远”，同时保存疆界向外推移的意象。脚注标记均置于相关词句之后。
