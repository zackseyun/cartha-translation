    rationale: רִחַקְתָּ 是二人称完成式，意为“你使……远/推远”；以“边界都推远了”明确保留耶和华为行动者及空间意象。
  - severity: low
    issue: 脚注a“你彰显了荣耀”不是最贴切的语态替代。
    rationale: 该表达更偏主动彰显，不能直接对应Nifal可有的“得荣耀／受尊崇／显为荣耀”等结果或被动性；以“你得了尊荣”更稳妥。
