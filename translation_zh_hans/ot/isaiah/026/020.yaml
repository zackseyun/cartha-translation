base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/020.yaml
  text: Go[a], my people, enter your rooms, and shut your doors behind you[c][b]; hide yourselves for a little moment until the wrath has passed by.
translation:
  language: zh_hans
  text: 我的子民，去吧，进入你的内室[a]，关上你身后的门；藏身片刻，直到愤怒[c]过去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的房间”。希伯来语可指内部的房间或私密的内室。
    reason: lexical_alternative
  - marker: c
    text: 或译“震怒”或“愤慨”。原文没有明说这是谁的愤怒。
    reason: alternative_reading
lexical_decisions:
- source_word: לֵךְ
  choice: 去吧
  rationale: 这是הלך的第二人称阳性单数命令式，构成直接召唤；“去吧”保留命令语气，同时符合现代汉语表达。
- source_word: עַמִּי
  choice: 我的子民
  rationale: עם带第一人称单数后缀，是先知书常见的亲密、立约性称呼；“子民”比“国民”更贴合此处语境。
- source_word: בֹּא בַחֲדָרֶיךָ
  choice: 进入你的内室
  rationale: בוא表示进入，חדר指房屋内部的房间或隐蔽私密的内室；“内室”兼顾空间方位和庄重语体。
- source_word: וּסְגֹר דלתיך בַּעֲדֶךָ
  choice: 关上你的门，把自己关在里面
  rationale: סגר是“关闭”，בעדך在此表达门在当事人身后关闭、使其与外界隔绝；汉语用“把自己关在里面”自然传达这一意象。
- source_word: חֲבִי
  choice: 藏起来
  rationale: 命令式源自חבא“隐藏”。希伯来语形式为阴性单数，而前文以“我的子民”作为集合性对象；汉语不强行增添性别或复数信息。
- source_word: כִמְעַט רֶגַע
  choice: 片刻
  rationale: מעט与רגע合用，表示很短的一段时间；“片刻”简洁而保持庄重。
- source_word: עַד יעבור
  choice: 直到……过去
  rationale: עד加עבר未完成式标明躲藏的终点，即所说的愤怒经过之后。
- source_word: זָעַם
  choice: 愤怒
  rationale: זעם在先知语境中可指强烈的怒气，常与审判有关；“愤怒”保留其分量，又不擅自明说发怒者是谁。
theological_decisions:
- issue: זָעַם的所指及施动者
  choice: 译作“愤怒”，不补出发怒者
  alternative: 义愤；震怒；上主的愤怒
  rationale: 原文没有明说这是谁的愤怒。上下文可以使读者联想到神的审判，但正文不补入“上主的”，以保留原文的含蓄和神学张力。
- issue: “我的子民”的集合性与单数命令形式
  choice: 正文沿用单数“你的、自己”，将“子民”作为一个集合整体来称呼
  alternative: 改用复数“你们的、你们自己”
  rationale: 希伯来语前半节主要采用第二人称阳性单数形式，随后חֲבִי为阴性单数。单数措辞可体现子民被视为一个整体，又不在汉语中额外解释形式变化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“去吧！进入……”保留原文连续命令的节奏；“把自己关在里面”使בעדך的空间意象在汉语中清楚自然。正文以集合性单数称呼“子民”，并用脚注说明可采用复数表达。
