revisions:
- from: 我的子民，去吧！进入你的内室[a]，关上你的门，把自己关在里面；藏起来[b]片刻，直到愤怒[c]过去。
  to: 我的子民，去吧，进入你的内室[a]，关上你身后的门；藏身片刻，直到愤怒[c]过去。
  rationale: 将关门的措辞改为“关上你身后的门”，以直接保留原文所表达的门在受命者身后关闭的意象，避免加入“把自己关住”的额外动作。调整标点及“藏身片刻”，使连续命令在现代标准汉语中更连贯凝练。脚注c删去可能引入额外神学评价的“义愤”，同时继续保留愤怒施动者未明说的歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:21:28Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了连续命令、进入内室、关门、暂时隐藏及愤怒过去的基本意思，也没有擅自说明愤怒的施动者。不过，“把自己关在里面”将原文“在你身后／为你关上门”的表达改写为更强的自我囚闭动作；改为“关上你身后的门”更贴近原文空间意象。
  naturalness: 整体庄重易懂。“去吧！进入……”的断裂式标点略削弱连续命令的连贯性；“去吧，进入……”更自然。“藏身片刻”比“藏起来片刻”更凝练，且适合本节语体。
  terminology: “我的子民”“内室”“愤怒”均合宜。“义愤”容易在汉语中引入“正义的愤怒”这一未明说的评价，故不宜列作此处的主要替代译法；可保留较中性的“震怒”或“愤慨”。
  issues:
