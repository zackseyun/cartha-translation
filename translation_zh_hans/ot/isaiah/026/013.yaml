  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּעָל֥וּ/נוּ אֲדֹנִ֖ים זֽוּלָתֶ֑/ךָ לְ/בַד בְּ/ךָ֖ נַזְכִּ֥יר שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/013.yaml
  text: O Yahweh our God[a], other lords besides you have ruled over us, but through you alone we make mention of your name.
translation:
  language: zh_hans
  text: 耶和华我们的神啊，除你以外，别的主曾管辖我们；但我们唯独靠你[a]提起你的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但我们唯独在你里面提起你的名。”这里的希伯来语介词可理解为“靠着／凭着”，也可理解为“在……里面”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，并以“啊”体现直接呼告的语气。
- source_word: אֱלֹהֵינוּ
  choice: 我们的神
  rationale: 在神名之后作单数称号，第一人称复数词尾译为“我们的”。
- source_word: בְּעָלוּנוּ
  choice: 曾管辖我们
  rationale: 该动词在此表示行使主权或支配；“管辖”既自然，也保留可能带有压迫意味的统治色彩。
- source_word: אֲדֹנִים
  choice: 别的主
  rationale: 保留“主”的宽泛称谓，不在正文中限定为政治统治者、偶像或假神。
- source_word: זוּלָתֶךָ
  choice: 除你以外
  rationale: 清楚表达排除或例外关系，并与后文“唯独”形成自然呼应。
- source_word: לְבַד
  choice: 唯独
  rationale: 表达排他性的强调，并与בְךָ合译为“唯独借着你”。
- source_word: בְךָ
  choice: 借着你
  rationale: 将介词ב理解为工具或凭借关系；因其也可表示范围或领域，另在脚注保留“在你里面”的译法。
- source_word: נַזְכִּיר
  choice: 提说
  rationale: 使役词形在此可指提及、宣称或使人记念；“提说”贴近原词，同时不把含义缩窄为单纯内心记忆。
- source_word: שְׁמֶךָ
  choice: 你的名
  rationale: 直译“你的名”，保留其在敬拜和盟约语境中的丰富含义，不在正文中加以解释。
theological_decisions:
- issue: 耶和华与“别的主”的对比
  choice: 正文保留“别的主”这一概括称谓
  alternative: 明确译作外邦统治者、压迫者、偶像或假神
  rationale: 原文可让人想到曾辖制以色列的政治主人，也可能含有对偶像或假神的指涉；正文不把这种张力限定为单一解释。
- issue: בְךָ לְבַד的语义
  choice: 唯独借着你
  alternative: 唯独在你里面；唯独靠你
  rationale: 介词ב既可表达凭借，也可表达所在的范围或关系领域。正文采用通顺的工具性理解，脚注保留另一种合理读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华我们的神啊”保留祷告式呼告；“别的主”刻意维持所指的开放性；分号呈现前后统治与专一承认之间的转折。
