  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִֽחְי֣וּ מֵתֶ֔י/ךָ נְבֵלָתִ֖/י יְקוּמ֑וּ/ן הָקִ֨יצוּ וְ/רַנְּנ֜וּ שֹׁכְנֵ֣י עָפָ֗ר כִּ֣י טַ֤ל אוֹרֹת֙ טַלֶּ֔/ךָ וָ/אָ֖רֶץ רְפָאִ֥ים תַּפִּֽיל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/019.yaml
  text: Your dead will live[a]; my dead bodies will rise. Awake and shout for joy, you who dwell in the dust! For your dew is a dew of lights[c][b], and the earth will cast out the dead.
translation:
  language: zh_hans
  text: '你的死人必活过来；我的尸体必起来[a]。


    住在尘土中的人哪，要醒来，欢呼！


    因为你的甘露是光明的甘露[b]，


    大地必抛出亡者[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的众尸体必起来。”希伯来文名词按字面是单数“我的尸体”，但动词是复数，可能具有集合意义。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你的甘露是光的甘露”或“你的甘露闪耀光辉”。希伯来文表达艰深，可能描绘充满光明、赐人生命的甘露。
    reason: lexical_alternative
  - marker: c
    text: “亡者”也可译作“幽魂”，指被描绘为居于阴间的已逝者。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵתֶיךָ
  choice: 你的死人
  rationale: 保留复数名词和第二人称阳性单数所属后缀，不擅自判定受话者是上帝还是锡安；“死人”在现代汉语中直接清楚。
- source_word: נְבֵלָתִי
  choice: 我的尸首
  rationale: 按马所拉文本保留名词“尸首”及第一人称单数所属后缀；相邻动词为复数这一张力以脚注说明，不在正文中改写为“他们的”或“你的”。
- source_word: יְקוּמוּן
  choice: 必起来
  rationale: קום的Qal未完成式在本语境中表达死人起来；“起来”既保留原动词，也与前句“活过来”形成平行。
- source_word: הָקִיצוּ
  choice: 要醒来
  rationale: 复数命令式，把尘土中的死者描绘为从睡眠中醒来；译文保留这一意象。
- source_word: וְרַנְּנוּ
  choice: 欢呼
  rationale: רנן表示喜乐地高声呼喊；“欢呼”简洁自然，不把它限定为歌唱。
- source_word: שֹׁכְנֵי עָפָר
  choice: 住在尘土中的人
  rationale: 保留分词结构、直接称呼及“尘土”的坟墓意象，同时采用自然的现代汉语。
- source_word: טַל אוֹרֹת
  choice: 光明的甘露
  rationale: 该组合意义艰深；“光明的甘露”保留光与赐生命之露的诗歌意象，又不强行确定复数אוֹרֹת的具体所指。
- source_word: רְפָאִים
  choice: 亡者
  rationale: 此处指阴间中的已逝者，而非族群利乏音人；“亡者”清楚而仍带诗体色彩，脚注保留“幽魂”这一可能译法。
- source_word: תַּפִּיל
  choice: 必抛出
  rationale: נפל的Hiphil形式有“使落下、使出来”的力度；“抛出”保留大地将死者逐出的强烈图像，避免解释性较强的“生出”。
theological_decisions:
- issue: 诗歌—预言语境中的复活语言
  choice: 正文直接保留死人活过来、尸首起来和尘土中之人醒来的身体复活图像。
  alternative: 把全节完全处理为民族复兴的比喻。
  rationale: 本节连续使用死人活过来、尸首起来、尘土中的人醒来以及大地抛出亡者等表达，强烈构成真实复活的图像；它虽可同时承载群体复兴的盼望，译文却不应把张力削平为纯粹隐喻。
- issue: “我的尸首”的说话者及数的不协调
  choice: 保留马所拉文本的第一人称所属形式和表面单数“我的尸首”。
  alternative: 协调为“他们的尸首”“你的尸首”或直接在正文译作“我的众尸首”。
  rationale: 原文第一人称后缀明确，但说话者身份并不确定，且复数动词与表面单数名词之间存在真实的文本张力；正文不以释义或校改消除它。
- issue: רְפָאִים的身份
  choice: 译为泛指已逝者的“亡者”。
  alternative: 音译为“利乏音人”，或专门译为“幽魂”。
  rationale: 阴间语境表明这里不是在指一个古代族群；正文采用普通读者可理解的称谓，同时用脚注呈现其“幽魂”色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话诗体；以分行呈现平行结构。正文避免古奥的“苏醒”“居于”，但保留“尘土”“甘露”“抛出”等核心意象和原文中的神学张力。
