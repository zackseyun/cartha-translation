id: ISA.26.12
reference: Isaiah 26:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֕ה תִּשְׁפֹּ֥ת שָׁל֖וֹם לָ֑/נוּ כִּ֛י גַּ֥ם כָּֽל מַעֲשֵׂ֖י/נוּ פָּעַ֥לְתָּ לָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/012.yaml
  text: O Yahweh[a], you will establish peace for us[b], for indeed you have accomplished all our works for us.
translation:
  language: zh_hans
  text: 耶和华啊，你必为我们建立平安[a]，因为我们一切的作为，也都是你为我们成就的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可包含安康、健全或圆满的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你在我们里面成就了我们一切的作为。”不过，这里的介词更直接的意思是“为我们”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 采用通行的圣名音译“耶和华”；“啊”自然表达祷告中的直接呼告，虽希伯来文没有独立的呼格词。
- source_word: תִּשְׁפֹּת
  choice: 你必……建立
  rationale: 此处表示设立、奠定或使之确立；“建立”既保留其使成之意，也自然传达未然的确信。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: “平安”是 שָׁלוֹם 的标准译法；其语义还可涵盖安康、健全与圆满，另以脚注说明。
- source_word: לָנוּ
  choice: 为我们
  rationale: 与“建立平安”连用时，介词 ל 表示受益者，译作“为我们”最自然。
- source_word: כִּי גַּם
  choice: 因为……也都是
  rationale: כִּי 引出前句的根据，גַּם 带有强调或递进意味；此译在现代汉语中兼顾因果关系和强调。
- source_word: כָּל מַעֲשֵׂינוּ
  choice: 我们一切的作为
  rationale: “作为”可涵盖行为、工作和所成之事，保留 מַעֲשֶׂה 的宽泛含义，而不限定为道德行为或具体事业。
- source_word: פָּעַלְתָּ
  choice: 你……成就的
  rationale: פּעל 强调使事情发生、完成；“成就”清楚表达上帝使人的作为得以实现。
- source_word: לָּנוּ
  choice: 为我们
  rationale: 末尾的 לָנוּ 最直接表示为了我们、使我们受益；不在正文中收窄为“在我们里面”。
theological_decisions:
- issue: “我们一切的作为”与上帝行动之间的关系
  choice: 保留人的“作为”与上帝“为我们成就”这些作为之间的张力，表明最终的成就是上帝的行动，却不进一步规定其运作方式。
  alternative: 可理解为上帝使百姓的事业成功，或上帝在百姓里面成就他们一切的作为。
  rationale: 希伯来文同时提到“我们的作为”和“你为我们成就”，把成果归于上帝，却未系统说明人的行动与上帝行动如何相互关联；译文不以特定教义公式消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“耶和华啊”体现直接呼告；后半句略保留原文结构，以呈现人的作为与上帝成就之间有意保留的神学张力。
