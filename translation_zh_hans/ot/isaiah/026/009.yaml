id: ISA.26.9
reference: Isaiah 26:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נַפְשִׁ֤/י אִוִּיתִ֨י/ךָ֙ בַּ/לַּ֔יְלָה אַף רוּחִ֥/י בְ/קִרְבִּ֖/י אֲשַֽׁחֲרֶ֑/ךָּ כִּ֞י כַּ/אֲשֶׁ֤ר מִשְׁפָּטֶ֨י/ךָ֙ לָ/אָ֔רֶץ צֶ֥דֶק לָמְד֖וּ יֹשְׁבֵ֥י תֵבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/009.yaml
  text: My soul has desired you in the night[a]; indeed, my spirit within me seeks you early. For when your judgments are in the earth[c][b], the inhabitants of the world learn righteousness.
translation:
  language: zh_hans
  text: 我的心在夜间切慕你；我里面的灵更是清早寻求你。[a] 因为你的审判临到地上时，[b] 世上的居民就学习公义。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “清早寻求你”也可译作“殷切寻求你”或“在黎明寻求你”；原文动词既带有清晨寻求的意象，也可表达热切追求。
    reason: lexical_alternative
  - marker: b
    text: 直译：“你的审判在地上时。”
    reason: lexical_alternative
  - marker: c
    text: “公义”也可译作“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: 这里指说话者内在的自我与渴望；现代汉语诗体中“我的心”比“我的灵魂”更自然，同时保留与下句“我里面的灵”的平行而不完全重叠。
- source_word: אִוִּיתִיךָ
  choice: 切慕你
  rationale: 该动词表达强烈的愿望和渴求；“切慕”简洁、庄重，适合诗歌语体。
- source_word: בַּלַּיְלָה
  choice: 在夜间
  rationale: 直接保留夜间的时间意象。
- source_word: אַף
  choice: 更是
  rationale: 兼顾其递进和强调作用，使两行诗的关系在中文中自然显明。
- source_word: רוּחִי בְקִרְבִּי
  choice: 我里面的灵
  rationale: 保留רוּחַ所指的内在生命或精神，并直接呈现בְקִרְבִּי“在我里面”的含义。
- source_word: אֲשַׁחֲרֶךָּ
  choice: 清早寻求你
  rationale: 保留שׁחר与黎明、清早有关的字面意象；该词也可引申为殷切寻求，故以脚注说明。
- source_word: כִּי כַּאֲשֶׁר
  choice: 因为……时
  rationale: 同时表达前句的原因联系与本句的时间情境。
- source_word: מִשְׁפָּטֶיךָ
  choice: 你的审判
  rationale: 保留神作出司法裁断或施行审判的含义，不将其窄化为抽象的“正义”。
- source_word: לָאָרֶץ
  choice: 临到地上
  rationale: 希伯来语仅为“向／在地上”的简约表达；中文补出“临到”可使“审判”与地点短语搭配自然，但“在地上”这一更直译的理解保留于脚注。
- source_word: צֶדֶק
  choice: 公义
  rationale: 兼具合乎正直标准与公正秩序的伦理、神学内涵；“正义”亦属可能译法，见脚注。
- source_word: לָמְדוּ
  choice: 学习
  rationale: 完成式在这里可表达普遍性的结果；中文用“就学习”自然呈现这种规律。
- source_word: יֹשְׁבֵי תֵבֵל
  choice: 世上的居民
  rationale: 自然表达居住在有人世界中的众人，并保留其普世范围。
theological_decisions:
- issue: צֶדֶק在神施行审判的语境中如何翻译
  choice: 公义
  alternative: 正义
  rationale: “公义”保留人在神面前合乎正直标准的伦理与神学维度；“正义”则更突出社会和司法层面。原词可涵盖两者，因此正文采用“公义”，脚注保留“正义”。
- issue: 神的审判与地上的关系
  choice: 审判临到地上
  alternative: 审判在地上
  rationale: 原文介词结构简约，可能表示审判在地上出现、施行或临到地上。正文采用自然中文“临到”，脚注保留形式更贴近原文的译法，避免把具体实现方式解释得过细。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。以“我的心／我里面的灵”保留原文平行结构；正文避免古奥倒装。脚注标记按对应词语就近排列。
