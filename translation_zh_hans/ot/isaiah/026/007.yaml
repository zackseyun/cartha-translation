  text: אֹ֥רַח לַ/צַּדִּ֖יק מֵֽישָׁרִ֑ים יָשָׁ֕ר מַעְגַּ֥ל צַדִּ֖יק תְּפַלֵּֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/007.yaml
  text: The path of the righteous is level; O Upright One[a], you make the way of the righteous smooth.
translation:
  language: zh_hans
  text: 义人的道路平坦；正直者啊[a]，你修平义人的路径。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人的道路平坦；你所修平的义人路径是笔直的。”希伯来文“正直”可理解为形容“义人的路径”，也可理解为对上帝的呼语；后面的动词是第二人称单数，因此正文采用呼语。
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרַח
  choice: 道路
  rationale: 指实际的道路，也可喻指人生道路；与下半句的 מַעְגַּל 构成诗歌平行。
- source_word: לַצַּדִּיק
  choice: 义人的
  rationale: ל 可表示归属或关联；译作“义人的道路”符合现代汉语，也保留泛指、集合性的单数意义。
- source_word: מֵישָׁרִים
  choice: 平坦
  rationale: 该复数名词在这里作表语，描述道路平直、平整；“平坦”保留具体道路意象。
- source_word: יָשָׁר
  choice: 正直者啊
  rationale: 因后面的 תְּפַלֵּס 是第二人称阳性单数动词，较自然地将此词理解为对上帝的呼语；同时用脚注保留形容道路的另一种可能。
- source_word: מַעְגַּל
  choice: 路径
  rationale: 指车辙、轨道或行走的路线；“路径”既保持道路意象，又避免与 אֹרַח 完全重复。
- source_word: צַדִּיק
  choice: 义人
  rationale: 希伯来文阳性单数在此是泛指；“义人”简洁地表达按正义而行的人，不额外强化性别。
- source_word: תְּפַלֵּס
  choice: 使……平顺
  rationale: פלס 的 Piel 形式可指修平、铺平道路，也可能带有衡量之意；本节道路语境支持“使……平顺”。
theological_decisions:
- issue: יָשָׁר 是修饰道路的形容词，还是对上帝的呼语
  choice: 正文采用呼语：“正直者啊”
  alternative: 可将其作形容词理解：“义人的道路是笔直的；你修平义人的路径。”
  rationale: 紧接的第二人称阳性单数动词“你使……平顺”支持转向对上帝直接说话，但希伯来文也容许将 יָשָׁר 与道路相连；脚注保留这一真实的句法歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“道路／路径”和“平坦／平顺”保留原文的诗歌平行与道路意象；“正直者啊”略带诗体色彩，以明确表达呼语，同时不把“上帝”这一称谓直接补入正文。
