  yaml_path: translation/ot/isaiah/026/003.yaml
  text: You keep in perfect peace the mind that is stayed on you[c][b][a], because it trusts in you.
translation:
  language: zh_hans
  text: 心志坚定、信靠你的人，你必保守他享有完全的平安[a]，因为他信靠你。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“平安，平安”；重复“平安”是为了加强语气，表示充分、完整的平安。
    reason: lexical_alternative
  - marker: b
    text: 原文以“心志”（也可译“意念”或“内在倾向”）为语法焦点；按中文习惯，正文将其所指的人译明为“心志坚定、信靠你的人”。
    reason: alternative_reading
lexical_decisions:
- source_word: יֵצֶר
  choice: 心志
  rationale: 该词可指受造的形态、倾向、意念或内在取向；此处与“坚定”和“信靠”相连，所指是人的内在心态或意向。“心志”既保留意念与取向的含义，也比单用“思想”更贴合上下文。
- source_word: סָמוּךְ
  choice: 坚定的
  rationale: 这是 סמך 的被动分词，可表达被支撑、稳固或坚定。译作“坚定的”在现代汉语中自然，并保留其稳固不移的核心意义；依靠的对象由下半句“信靠你”明确表达。
- source_word: תִּצֹּר
  choice: 你必保守
  rationale: נצר 表示看守、守护或保存。“保守”能自然表达上帝持续护卫、使之安稳的行动。未完成式在此诗歌宣告中译作“必保守”。
- source_word: שָׁלוֹם שָׁלוֹם
  choice: 全然平安
  rationale: 原文将“平安”重复两次以加强语气，表达充分、完整的平安。“全然平安”在中文中传达这种强化效果，原文重复形式收入脚注。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前述保守与平安的原因，译作“因为”清楚呈现因果关系。
- source_word: בְךָ
  choice: 信靠你
  rationale: 介词 בְּ 标示信靠的对象；中文习惯直接说“信靠你”，无需另译介词。
- source_word: בָּטוּחַ
  choice: 它信靠
  rationale: 该词表示信靠或安然有把握，并以阳性单数与 יֵצֶר（心志）呼应。正文让“它”回指“心志”，尽量保留原文语法，而不在正文中增添原文没有明说的“人”。
theological_decisions:
- issue: 本节的语法主语及对人的表述
  choice: 正文以“心志”为语法焦点，并用“它”回指
  alternative: 你必使心志坚定、信靠你的人安享完全的平安
  rationale: 希伯来文明确出现的是 יֵצֶר（心志、意念或倾向），没有明说“那个人”或“他”。正文保留这一突出的内在取向，脚注说明较自然的拟人化译法，避免把解释静默地写入正文。
- issue: 重复的 שָׁלוֹם 所表达的力度
  choice: 全然平安
  alternative: 平安，平安
  rationale: 重复在此有强化作用。“全然平安”以自然现代汉语传达完整、丰盛的平安，同时在脚注保留原文的诗性重复。
- issue: סָמוּךְ 的稳固与依靠含义
  choice: 坚定的
  alternative: 被扶持的；倚靠的
  rationale: 该被动分词兼有被支撑和稳固的语义。正文选用通顺的“坚定”，而“信靠你”又显明这种坚定并非自足，而是以神为对象。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“坚定的心志”保留诗歌的凝练感；“使它……因为它……”略带原文式拟人，以保存希伯来文把“心志”置于焦点的表达。脚注补充更自然的个人化译法及“平安”重复的原貌。
