base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/006.yaml
  text: Those who lavish gold from the purse and weigh out silver on the scale hire a goldsmith[a], and he makes it into a god; they bow down, indeed they prostrate themselves.
translation:
  language: zh_hans
  text: 那些从钱袋里倒出金子、用秤杆[a]称出银子的人，雇用金匠；金匠把它制成一个神；他们便俯身下拜，甚至俯伏在地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “秤杆”所译的希伯来语字面意思是“芦苇、杆子”，这里可能指天平的横杆；也可译作“用天平”。
    reason: 说明原词的字面意义及其在称量语境中的可能所指。
lexical_decisions:
- source_word: הַזָּלִים
  choice: 倾倒
  rationale: 该分词描写人把财富大量倒出或慷慨耗费；“倾倒”保留具体动作，也在上下文中传达不惜花费的意味。
- source_word: זָהָב מִכִּיס
  choice: 从钱袋里倾倒金子
  rationale: כִּיס 指盛钱财的袋子；“钱袋”是自然、明确的现代汉语表达。
- source_word: וְכֶסֶף בַּקָּנֶה יִשְׁקֹלוּ
  choice: 用秤杆称银子
  rationale: קָנֶה 本义为芦苇或杆，在称量语境中很可能指天平的横杆；“秤杆”既保留原文意象，也能表达称量器具。
- source_word: יִשְׂכְּרוּ צוֹרֵף
  choice: 雇来金匠
  rationale: צוֹרֵף 可指熔炼、精炼或加工贵金属的工匠；此处材料是金银且用途是制作神像，“金匠”最切合语境。
- source_word: וְיַעֲשֵׂהוּ אֵל
  choice: 金匠把金银造成一个神
  rationale: 明确补出动作者“金匠”，并以“金银”承接前述材料，使中文指代清楚；“一个神”保留 אֵל 的字面称谓，不提前改译为“偶像”。
- source_word: יִסְגְּדוּ
  choice: 俯身下拜
  rationale: סגד 表示以俯身动作表达敬拜或臣服；此译兼顾身体姿态和宗教语境。
- source_word: אַף יִשְׁתַּחֲווּ
  choice: 甚至俯伏在地
  rationale: אַף 加强语气；שׁחה 表示屈身、俯伏。“甚至”与“俯伏在地”呈现原文在动作和语气上的递进。
theological_decisions:
- issue: 如何称呼人手所造的敬拜对象
  choice: 一个神
  alternative: 一个偶像
  rationale: 原文使用 אֵל（“神”），以讽刺性的语境描述人把材料造成神。直译为“一个神”保留原文的论战张力，而上下文已清楚表明这是人造之物；译作“偶像”虽合乎语境，却会把解释直接代入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“倾倒金子”的具体意象，并用分号清楚区分出资者与金匠的动作；末尾以“俯身下拜—俯伏在地”体现两个近义敬拜动词的递进。
