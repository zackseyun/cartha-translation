base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/003.yaml
  text: Listen to me[a], house of Jacob, and all the remnant of the house of Israel, who have been borne by me from birth, carried from the womb.
translation:
  language: zh_hans
  text: “雅各家，以色列家所有的余民哪，你们要听我说！你们从母腹起就由我背负，自母胎起就由我抱持。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用两个相近的说法：“自母腹起”和“自母胎起”，以诗歌式的平行表达神从生命之初就承载他的百姓。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: 你们要听我说
  rationale: 复数命令式要求专心听从；“听我说”是自然、庄重的现代汉语表达。
- source_word: בֵּית יַעֲקֹב
  choice: 雅各家
  rationale: 保留希伯来语以“家”指雅各后裔整体的固定表达。
- source_word: וְכָל שְׁאֵרִית בֵּית יִשְׂרָאֵל
  choice: 以色列家所有的余民
  rationale: “余民”保留 שְׁאֵרִית 在以赛亚书中的先知性关键词地位，“所有的”对应 כָל。
- source_word: הָעֲמֻסִים מִנִּי
  choice: 由我负载
  rationale: עמס 的被动分词延续上下文“负载”的意象，并与需要人抬负的偶像形成反差；מִנִּי 在此按施事理解为“由我”。
- source_word: בֶטֶן
  choice: 母腹
  rationale: 保留与 רָחַם 相近但不完全相同的身体意象；在现代汉语中自然地指向生命最初阶段。
- source_word: הַנְּשֻׂאִים מִנִּי
  choice: 由我怀抱
  rationale: נשׂא 基本意象是抬起、承载；“怀抱”既适合母胎语境，也用不同措辞再现与前一分词的诗意平行。
- source_word: רָחַם
  choice: 母胎
  rationale: 与“母腹”构成自然的近义平行，同时保留原文两个相关名词的区别。
theological_decisions:
- issue: 先知书中的“余民”术语
  choice: 余民
  alternative: 剩下的人
  rationale: 采用“余民”可保留 שְׁאֵרִית 在以赛亚书中的文学与神学连续性，却不额外限定这些人的身份。
- issue: 两个被动分词中施事者的表达
  choice: 由我负载……由我怀抱
  alternative: 从母腹起负重……从母胎起被抬着
  rationale: 上下文将需要人负载的偶像与亲自承载百姓的耶和华对照；把 מִנִּי 理解为施事最符合语篇，但原文介词形式本身较为特殊。
- issue: 神承载百姓的意象
  choice: 负载……怀抱
  alternative: 背负……抬举
  rationale: 保留两个相关而不同的承载动词，既呈现诗歌平行，也不把意象收窄为某种特定教义解释。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的汉语。“雅各家”“以色列家”“余民”保留先知书的重要用语；“负载／怀抱”和“母腹／母胎”分别再现两组近义平行，避免把原文压平为完全重复。
