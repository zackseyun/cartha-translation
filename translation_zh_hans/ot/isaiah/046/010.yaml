id: ISA.46.10
reference: Isaiah 46:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַגִּ֤יד מֵֽ/רֵאשִׁית֙ אַחֲרִ֔ית וּ/מִ/קֶּ֖דֶם אֲשֶׁ֣ר לֹא נַעֲשׂ֑וּ אֹמֵר֙ עֲצָתִ֣/י תָק֔וּם וְ/כָל חֶפְצִ֖/י אֶעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/010.yaml
  text: declaring the end from the beginning[a], and from ancient times things that have not been done, saying, ‘My purpose shall stand[c][b], and I will accomplish all my good pleasure.’
translation:
  language: zh_hans
  text: 我从起初就宣告末后的事，从古时就宣告尚未成就的事[a]；我说：“我的旨意必立定[b]，凡我所喜悦的，我都必成就[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“还没有发生的事”或“尚未做成的事”。希伯来文直译为“还没有被做成的事”。
    reason: lexical_alternative
  - marker: b
    text: “旨意”也可译为“谋略”或“计划”；“立定”也可译为“成立”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“我所愿的一切，我都必施行。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַגִּיד
  choice: 宣告
  rationale: 该词是 נגד 的使役分词，表示使人知道、宣布；“宣告”既保留先知文体的庄重，也能自然统摄后面的两个并列宾语。
- source_word: מֵרֵאשִׁית אַחֲרִית
  choice: 从起初……末后的事
  rationale: 保留“起初”与“末后”的时间对照；אַחֲרִית 也可指结局，但此处直译为“末后的事”更贴合平行结构。
- source_word: וּמִקֶּדֶם
  choice: 从古时
  rationale: קֶדֶם 在这里指久远的过去；“从古时”简洁庄重，并与“从起初”构成平行。
- source_word: אֲשֶׁר לֹא נַעֲשׂוּ
  choice: 尚未成就的事
  rationale: 希伯来文直译是“还没有被做成的事”。语境指尚未发生或实现的事；“尚未成就”兼顾原文被动形式与自然汉语。
- source_word: עֲצָתִי
  choice: 我的旨意
  rationale: עֵצָה 可表示谋略、计划或意旨。此处谈上帝所定并要实行之事，“旨意”能自然表达其意图，同时不把词义窄化为单纯的建议。
- source_word: תָקוּם
  choice: 必立定
  rationale: קום 在这里表示坚定成立、持续有效；“立定”保留原文站立稳固的意象，又符合现代庄重汉语。
- source_word: וְכָל חֶפְצִי
  choice: 凡我所喜悦的
  rationale: חֵפֶץ 可指喜悦、愿望或所愿之事。“所喜悦的”保留情愿与喜悦两层含义，不直接等同于较抽象的“意志”。
- source_word: אֶעֱשֶׂה
  choice: 我都必成就
  rationale: עשה 基本义为做、造成；与上文尚未成就之事及上帝的旨意相连时，“成就”准确表达使之实现的语境含义。
theological_decisions:
- issue: 如何表达 עֲצָתִי 与 חֶפְצִי 所体现的神圣意向
  choice: “我的旨意必立定，凡我所喜悦的，我都必成就”
  alternative: “我的谋略必成立，我所愿的一切，我都必施行”
  rationale: 译文保留上帝所定之意必然成立并付诸实现的力度，同时以“旨意”和“所喜悦的”区分两个希伯来词，不额外引入特定宗派对预定或意志的系统表述。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。以第一人称“我”承接本段上文中上帝的自述，使希伯来语分词结构在汉语中自然连贯；保留“起初／末后”和“宣告／成就”的对应关系。
