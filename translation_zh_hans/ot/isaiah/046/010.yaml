  source_fidelity: 译文准确呈现希伯来文的两个时间性平行语：“从起初……末后的事”与“从古时……尚未成就的事”。“尚未成就”虽较原文直译“尚未被做成”略具结果色彩，但在本节预告未来事件的语境中恰当，并由脚注保留直译及“发生”的替代可能。引语中的“我的旨意必立定，凡我所喜悦的，我都必成就”忠实表达עֲצָתִי、תָקוּם、וְכָל־חֶפְצִי与אֶעֱשֶׂה的意向、确立和实行。
  naturalness: 措辞为自然、庄重的现代普通话。“从起初／从古时”“末后的事／尚未成就的事”形成清晰平行；第一人称“我说”也自然承接上帝的自述。
  terminology: “旨意”对应עֲצָתִי，在此语境下合适，且脚注提供“谋略”“计划”。“所喜悦的”保留חֵפֶץ所含喜悦与所愿的范围，未把文本限定为某一神学体系的术语。脚注锚点均对应相关措辞，标记和内容完整。
