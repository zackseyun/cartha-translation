id: ISA.46.7
reference: Isaiah 46:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יִ֠שָּׂאֻ/הוּ עַל כָּתֵ֨ף יִסְבְּלֻ֜/הוּ וְ/יַנִּיחֻ֤/הוּ תַחְתָּי/ו֙ וְ/יַֽעֲמֹ֔ד מִ/מְּקוֹמ֖/וֹ לֹ֣א יָמִ֑ישׁ אַף יִצְעַ֤ק אֵלָי/ו֙ וְ/לֹ֣א יַעֲנֶ֔ה מִ/צָּרָת֖/וֹ לֹ֥א יוֹשִׁיעֶֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/007.yaml
  text: They lift it onto the shoulder[a], they carry it, and they set it in its place, and it stands there; it does not move from its place. Even if someone cries out to it, it does not answer; it does not save him from his distress.
translation:
  language: zh_hans
  text: 他们把它抬到肩上[a]，扛着它，把它安放在原处；它就立在那里，不从原处挪动。即使有人向它呼求，它也不回答，不能救那人脱离困境。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把它安放在原处”所对应的希伯来文直译为“把它放在它下面”，可能是指把偶像安放在底座或台座上。
    reason: 保留原文罕见表达及其可能所指；标记依照本段审校轨迹置于本句前段，脚注说明本句稍后的“安放在原处”。
lexical_decisions:
- source_word: יִשָּׂאֻהוּ
  choice: 人把它抬
  rationale: נשׂא在这里表示先将偶像抬起；译作“抬”可与随后表示负重搬运的סבל区分，保留动作次序。
- source_word: עַל כָּתֵף
  choice: 到肩上
  rationale: 希伯来文单数“肩”可惯用地指肩扛运输；结合前面的动态动词，译作“到肩上”自然准确。
- source_word: יִסְבְּלֻהוּ
  choice: 扛着它
  rationale: סבל表示承受、搬运重物；“扛”既符合肩负物件的画面，也凸显偶像反而需要人搬运。
- source_word: וְיַנִּיחֻהוּ תַחְתָּיו
  choice: 把它安放在原处
  rationale: 字面近于“把它放在它下面”，所指可能是把偶像放到底座上或固定位置。正文采用通顺的语境义，脚注保留字面结构及底座这一可能。
- source_word: וְיַעֲמֹד
  choice: 它就立在那里
  rationale: עמד表示站立；“在那里”明确它被安置后静立不动的情景，并与下句衔接。
- source_word: מִמְּקוֹמוֹ לֹא יָמִישׁ
  choice: 不能挪离原位
  rationale: מושׁ在此指移开或离开。“不能挪离”在现代汉语中自然，并在语境中表现偶像无力自行行动；虽可形式上译作“不挪离”，上下文的嘲讽含有能力缺失。
- source_word: אַף יִצְעַק אֵלָיו
  choice: 即使有人向它呼求
  rationale: אַף在此具有强调让步作用；三单阳性主语具有泛指功能，以“有人”表达，不把泛指误解为特定男性。
- source_word: וְלֹא יַעֲנֶה
  choice: 它也不回答
  rationale: ענה在祈求语境中通常指回应或回答；“也”承接“即使”的让步结构。
- source_word: מִצָּרָתוֹ לֹא יוֹשִׁיעֶנּוּ
  choice: 不能救那人脱离困境
  rationale: צרה指患难、困境，ישׁע使役形指拯救、解救。“救……脱离困境”保留其救援含义；“那人”维持希伯来文单数照应而不限定性别。
theological_decisions:
- issue: 末句阳性单数是否指特定男性
  choice: 以“有人……那人”作泛指单数表达
  alternative: 形式对应地译作“他向它呼求……它不能救他脱离他的困境”
  rationale: 希伯来文采用阳性单数，但在此是泛指祈求偶像的人；译文保留单数指代，同时不额外限定性别。
- issue: לֹא יָמִישׁ与לֹא יוֹשִׁיעֶנּוּ表达事实还是无能
  choice: 译作“不能挪离……不能救”
  alternative: 译作“不挪离……不救”
  rationale: 形式上לֹא是否定未完成式，但整段讽刺的重点是偶像既不能自行移动，也无力施救。“不能”自然呈现语境所显出的无能，而不引入额外教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“抬到肩上，扛着它”保留连续动作及偶像必须由人搬运的讽刺。“呼求”“救……脱离困境”保留祈求与拯救的神学语域，但不作宗派化解释。
