  text: זִכְר֥וּ רִאשֹׁנ֖וֹת מֵ/עוֹלָ֑ם כִּ֣י אָנֹכִ֥י אֵל֙ וְ/אֵ֣ין ע֔וֹד אֱלֹהִ֖ים וְ/אֶ֥פֶס כָּמֽוֹ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/009.yaml
  text: Remember the former things of old[a], for I am God, and there is no other; I am God, and there is none like me.
translation:
  language: zh_hans
  text: 你们要记住古时的事[a]，因为我是上帝，再没有别的；我是上帝，没有谁能与我相比。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“久远以前的事”。这里的希伯来语表达指遥远的过去，不一定指抽象意义上的永恒。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: 你们要记住
  rationale: 复数祈使式，要求听众主动回想；加“你们”自然体现希伯来语的复数对象。
- source_word: רִאשֹׁנוֹת
  choice: 古时的事
  rationale: 阴性复数形容词作名词使用，指从前的作为或事件；与 מֵעוֹלָם 合译为自然、庄重的现代汉语。
- source_word: מֵעוֹלָם
  choice: 古时
  rationale: 此处指久远的过去，不必解释为抽象意义上的永恒；“古时”保留时间上的久远感。
- source_word: כִּי
  choice: 因为
  rationale: 引出要求人记念往事的理由，现代汉语用“因为”清楚自然。
- source_word: אָנֹכִי אֵל
  choice: 我是上帝
  rationale: אֵל 在此是对独一真神的称谓，并非需要音译的专名；“上帝”简明保留自我宣告。
- source_word: וְאֵין עוֹד
  choice: 再没有别的
  rationale: 表达排他性；“别的”依上下文省略“上帝”，既自然又不削弱独一性的宣告。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该词虽为复数形态，此处按希伯来语惯用法指上帝；明译出来可保留原文平行句中的重复强调。
- source_word: וְאֶפֶס כָּמוֹנִי
  choice: 没有谁能与我相比
  rationale: 表达无人或无一位可与上帝相比；此译符合现代汉语，并保留不可比拟之意。
theological_decisions:
- issue: 上帝的自我宣告、独一性与无可比拟性
  choice: 两处神称均译为“上帝”，完整保留“再没有别的”和“没有谁能与我相比”两个平行宣告。
  alternative: 第二处“上帝”从略，或把 אֵל 扩译为“全能的上帝”。
  rationale: 原文借重复和平行结构强烈宣告上帝的独一与无可比拟。保留两次“我是上帝”忠实传达强调，同时不加入“全能”等原文此处未明说的属性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“古时的事”简洁承载 רִאשֹׁנוֹת מֵעוֹלָם 的整体意义；分号保留两组神圣自我宣告的平行和力度。
