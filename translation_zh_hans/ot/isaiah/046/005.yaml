base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/005.yaml
  text: To whom will you liken me and make me equal[a], and compare me, that we may be alike?
translation:
  language: zh_hans
  text: 你们要把我比作谁，使我与谁相等？又要拿谁与我相比，使我们相似呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译：“你们要把我与谁相比，使我与谁相等？又要把我比作谁，使我们相似呢？”希伯来文连续使用几个意义相近的比较动词，以加强这一反问。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִי
  choice: 谁
  rationale: 介词 לְ 与疑问代词构成“比作谁／与谁相比”的比较对象；汉语将“谁”放入各分句，能自然保留反问力量。
- source_word: תְדַמְיוּנִי
  choice: 把我比作
  rationale: דמה 的 Piel 形式在此意为“使之相似、比作”；“把我比作谁”既体现宾语后缀“我”，也符合现代汉语表达。
- source_word: וְתַשְׁווּ
  choice: 使我与谁相等
  rationale: שוה 的 Hiphil 形式表达使之相等或置于同一层次。原文宾语依平行结构省略，译文补出“我”和比较对象“谁”，使句意完整而不增添实质内容。
- source_word: וְתַמְשִׁלוּנִי
  choice: 拿谁与我相比
  rationale: משל 的 Hiphil 形式在本语境中意为“比较、比拟”。采用不同但相近的汉语措辞，保留原文近义动词层叠的修辞。
- source_word: וְנִדְמֶה
  choice: 使我们相似呢
  rationale: דמה 的第一人称复数形式明确包含说话者与被拿来比较者；“我们相似”保留这一包容双方的表达。前面的“使”自然呈现所设想的比较结果。
theological_decisions:
- issue: 反偶像语境中的层叠比较用语
  choice: 保留“比作—相等—相比—相似”的连续推进
  alternative: 压缩为一个或两个“比较”类动词
  rationale: 希伯来文刻意叠加数个意义相近的动词，以加强上帝不可与任何对象等同的反问；保留层叠结构能传达经文修辞，同时不额外加入教派性解释。
- issue: 末句第一人称复数的张力
  choice: 直译为“我们相似”
  alternative: 解释性改写为“我就会像他”或“他就会像我”
  rationale: 原文使用第一人称复数，故保留“我们”，不替经文决定比较方向，也不消除其反问中的修辞张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们”明示原文复数主语；两个问句和句末“呢”强化反问语气。脚注标记已置于正文。
