  text: קֵרַ֤בְתִּי צִדְקָתִ/י֙ לֹ֣א תִרְחָ֔ק וּ/תְשׁוּעָתִ֖/י לֹ֣א תְאַחֵ֑ר וְ/נָתַתִּ֤י בְ/צִיּוֹן֙ תְּשׁוּעָ֔ה לְ/יִשְׂרָאֵ֖ל תִּפְאַרְתִּֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/013.yaml
  text: I have brought near my righteousness[a]; it is not far away, and my salvation will not delay. I will place salvation in Zion[b], for Israel my splendor.
translation:
  language: zh_hans
  text: 我已使我的公义[a]临近；它并不遥远。我的救恩也必不迟延。我必在锡安安置救恩，赐给以色列我的荣光[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“公正”或“伸冤”。
    reason: lexical_alternative
  - marker: b
    text: “荣光”也可译作“荣耀”。原文末句十分紧凑，也可能理解为“以色列是我的荣美”。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: קֵרַבְתִּי
  choice: 我已使……临近
  rationale: 该词为קרב的Qal完成式第一人称单数；用“已使……临近”既保留完成动作及其当前效力，也表达此处使某物接近的语境意义。
- source_word: צִדְקָתִי
  choice: 我的公义
  rationale: “公义”保留צדקה在本节中涵盖正直、公正和施行拯救或伸冤的宽广意义，不把它缩窄为单一层面。
- source_word: לֹא תִרְחָק
  choice: 它必不遥远
  rationale: 动词阴性单数与“我的公义”呼应；“必不遥远”既表达尚未完全实现的指向，也突出其迫近。
- source_word: וּתְשׁוּעָתִי
  choice: 我的救恩
  rationale: תשועה可指拯救、解救或胜利；“救恩”适合以赛亚书语境，并保留其较宽的神学内涵。
- source_word: לֹא תְאַחֵר
  choice: 必不迟延
  rationale: 忠实表达אחר的Piel未完成式所含“不耽延、不迟到”的意思，语言庄重而现代。
- source_word: וְנָתַתִּי
  choice: 我必……安置；把……赐给
  rationale: נתן语义宽泛，可指给予、放置或设立。前半句结合地点介词译作“安置”，后半句按并列省略补出“赐给”，使中文自然清楚。
- source_word: בְצִיּוֹן
  choice: 在锡安
  rationale: ב在此最自然地表示地点。
- source_word: תְּשׁוּעָה
  choice: 救恩
  rationale: 保留原文对“救恩”的重复，以维持修辞强调。
- source_word: לְיִשְׂרָאֵל
  choice: 给以色列
  rationale: ל可表示“给、向、为”；此处译作接受者“给以色列”，符合后半句紧凑的并列结构。
- source_word: תִּפְאַרְתִּי
  choice: 我的荣美
  rationale: תפארת可指荣美、荣耀或华美；“荣美”兼具尊荣与美盛之意，又不把该词固定为较技术化的“荣耀”用语。
theological_decisions:
- issue: “我的公义”与“我的救恩”的关系
  choice: 保留“我的公义”，让它与“我的救恩”并列而不等同。
  alternative: 我的公正；我为人伸冤的行动
  rationale: 以赛亚书中的神之“公义”常包含他信实而施行拯救的作为；保留宽义可避免只理解为道德属性，或只理解为法庭式伸冤。
- issue: 末句“给以色列我的荣美”的句法关系
  choice: 按לְיִשְׂרָאֵל的受益者或接受者意义，译作“把我的荣美赐给以色列”，同时以脚注说明原文关系紧凑。
  alternative: 以色列是我的荣美；为以色列彰显我的荣美
  rationale: 希伯来文没有在末分句重复动词，关系较压缩。正文顺着介词ל的通常功能形成自然中文，但不据此断言“荣美”仅指一种神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我已使……临近”保留希伯来文完成式的力度；“安置救恩”略具诗性，以贴近原文“放置、设立”的意象。分号呈现前两组平行陈述，末句保留“救恩”的重复。
