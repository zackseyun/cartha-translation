  to: 我已使我的公义[a]临近；它并不遥远。我的救恩也必不迟延。我必在锡安安置救恩，赐给以色列我的荣光[b]。
  rationale: 修订仅处理末句。以“赐给以色列我的荣光”保留לְיִשְׂרָאֵל的受益者/接受者功能及原文的简练语序，不把句法歧义从正文完全消除；脚注明确提示另一种可能。以“荣光”替代“荣美”，提升现代普通话的自然度，同时保留原词的光辉与尊荣含义。前半节的“并不遥远”较直接反映原文“不是遥远”，而“必不迟延”保留救恩即将来到的未完成式力度。
