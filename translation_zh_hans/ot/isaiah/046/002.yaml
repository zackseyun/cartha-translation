id: ISA.46.2
reference: Isaiah 46:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: קָרְס֤וּ כָֽרְעוּ֙ יַחְדָּ֔ו לֹ֥א יָכְל֖וּ מַלֵּ֣ט מַשָּׂ֑א וְ/נַפְשָׁ֖/ם בַּ/שְּׁבִ֥י הָלָֽכָה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/002.yaml
  text: They stoop[a]; they bow down together. They are unable to save the burden[b], and they themselves go into captivity.
translation:
  language: zh_hans
  text: 它们屈身[a]，一同俯伏；不能救下所驮的重物，自己[b]反倒被掳而去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蜷伏”或“倒下”；希伯来语这个动词可表示下沉、屈下或崩倒。
    reason: lexical_alternative
  - marker: b
    text: 直译“它们的生命（或魂）被掳而去”。希伯来语 נֶפֶשׁ 可指“生命”“魂”或“自身”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְסוּ
  choice: 屈身
  rationale: 该动词表示下沉、屈下或倒塌；“屈身”与下句“俯伏”形成平行，又不把含义过度限定为完全倒塌。
- source_word: כָרְעוּ
  choice: 俯伏
  rationale: 该词常指屈膝、下拜或弯下；此处用“俯伏”保留偶像本身低伏的讽刺画面。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 准确表达共同发生的动作，符合庄重而自然的现代汉语。
- source_word: לֹא יָכְלוּ
  choice: 不能
  rationale: 直接表达无力、没有能力；中文无需另加时态标记。
- source_word: מַלֵּט
  choice: 救下
  rationale: 该使役式表示使之逃脱、搭救；“救下”既清楚又适合重物即将随运载者倾覆或被掳的具体语境。
- source_word: מַשָּׂא
  choice: 所驮的重物
  rationale: 指被搬运、负载的东西；结合上文驮畜负载偶像的场景，这一表达比抽象的“重担”更具体，同时不明说其所指。
- source_word: וְנַפְשָׁם
  choice: 自己
  rationale: נֶפֶשׁ 可指生命、魂或自身；在拟人化的神像语境中，“自己”自然传达反身含义，并以脚注保留字面歧义。
- source_word: בַּשְּׁבִי
  choice: 被掳
  rationale: 表示进入被俘、被掳的处境；“被掳”简洁准确，也与先知书的惯用语域相称。
- source_word: הָלָכָה
  choice: 而去
  rationale: 完成式阴性单数与 נֶפֶשׁ 配合，表示去往被掳之境；“被掳而去”在中文中自然呈现动作结果，且不强行标注明确时态。
theological_decisions:
- issue: 末句对偶像或神祇的拟人化，以及 נֶפֶשׁ 的含义
  choice: 正文译作“自己反倒被掳而去”
  alternative: “它们的生命（或魂）被掳而去”
  rationale: 上下文讥讽巴比伦诸神及其神像无力自救。נֶפֶשׁ 可表示“自身”，正文采用自然的反身表达，避免暗示偶像具有某种特定的人论意义；脚注则保留“生命／魂”的字面可能。
- issue: “重物”的具体所指
  choice: 保留为“所驮的重物”
  alternative: 明确译为“神像”或“它们的重担”
  rationale: 上下文强烈暗示所驮的是神像，但本节本身使用一般名词 מַשָּׂא；不在正文中把所指明说为“神像”，以保留原文措辞。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“屈身／俯伏”保留希伯来诗句的平行结构；“反倒”显明前后反差和讽刺意味，但不加入宗派性解释。代词用“它们”，与作为神像、负载物的直接语境协调。
