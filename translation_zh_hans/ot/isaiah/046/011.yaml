revisions:
- from: 我从东方召来猛禽，从遥远之地召来成就我旨意的人[a][b]。我确已说出，也必使这事实现；我确已筹定，也必亲自成就。
  to: 我从东方召来猛禽，从遥远之地召来成就我旨意的人[a][b]。我已说出，必使它实现；我已谋划，也必实行。
  rationale: 修订删除原文未明示的“亲自”，将不够准确的词汇替代脚注改为“奉行我谋略的人”，并以“谋划”表达“形成／塑造”计划的语境义。脚注保留该动词的具体词义，同时继续将居鲁士的身份认定限于语境性说明，不写入正文。
