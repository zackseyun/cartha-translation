source:
  edition: WLC
  text: קֹרֵ֤א מִ/מִּזְרָח֙ עַ֔יִט מֵ/אֶ֥רֶץ מֶרְחָ֖ק אִ֣ישׁ עצת/ו אַף דִּבַּ֨רְתִּי֙ אַף אֲבִיאֶ֔/נָּה יָצַ֖רְתִּי אַף אֶעֱשֶֽׂ/נָּה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/011.yaml
  text: calling from the east a bird of prey[a], from a distant land the man of my purpose. Indeed, I have spoken; indeed, I will bring it to pass. I have formed it; indeed[b], I will do it.
translation:
  language: zh_hans
  text: 我从东方召来猛禽，从遥远之地召来成就我旨意的人[a][b]。我已说出，必使它实现；我已谋划，也必实行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成就我旨意的人”也可译作“奉行我谋略的人”。
    reason: lexical_alternative
  - marker: b
    text: “我已谋划”所译的词字面有“塑造、形成”之意；按本段更大的语境，这位从东方被召来的人通常被理解为居鲁士，但本节没有提到他的名字。
    reason: cross_reference
lexical_decisions:
- source_word: קֹרֵא
  choice: 召来
  rationale: 这是阳性单数主动分词，按上下文以上帝为主语；中文用“召来”自然承接上文，也显明所召对象从远方而来。
- source_word: מִמִּזְרָח
  choice: 从东方
  rationale: מִזְרָח可指日出之处或东方；此处具有地理意义，“从东方”准确而自然。
- source_word: עַיִט
  choice: 猛禽
  rationale: 该词泛指捕食性、凶猛的鸟，并未限定为鹰或其他具体鸟种；“猛禽”保留比喻而避免过度具体化。
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: 从遥远之地
  rationale: 保留原文对地理距离的强调，同时符合现代汉语的庄重表达。
- source_word: אִישׁ עֲצָתוֹ
  choice: 成就我旨意的人
  rationale: עֵצָה在这里指上帝的谋划、旨意；译文以功能性表达说明此人是执行该旨意的工具，同时以脚注保留较形式对应的译法。
- source_word: אַף
  choice: 确……也必
  rationale: 反复出现的אַף在此具有确认和加强语气的作用，不只是简单的“也”；“确已……也必……”在中文中重现其坚定、必然的语势。
- source_word: דִּבַּרְתִּי
  choice: 我确已说出
  rationale: 完成式表示上帝已经宣告；“已说出”兼顾动作的完成及其当前效力。
- source_word: אֲבִיאֶנָּה
  choice: 也必使这事实现
  rationale: 阴性后缀最自然地回指上帝所说、所谋划的事，而非阳性的“人”；明说“这事”可避免现代汉语中指代含混。
- source_word: יָצַרְתִּי
  choice: 我确已筹定
  rationale: יָצַר本义为塑造、形成，此处用于上帝使计划成形；“筹定”在中文中传达有意塑成并确定计划的语境意义。
- source_word: אֶעֱשֶׂנָּה
  choice: 也必亲自成就
  rationale: עשה含义宽泛，可指实行、完成；“成就”符合此处使旨意成为事实的意思，“亲自”则自然呈现反复第一人称所强调的施行者。
theological_decisions:
- issue: “猛禽”和“成就我旨意的人”所指人物的身份
  choice: 正文保留原文的比喻和描述，不直接写出人物姓名。
  alternative: 按较大语境明确解释为居鲁士。
  rationale: 本节很可能指向居鲁士，但此节希伯来文本并未点名；正文不把合理的语境判断写成明说的人名，以保留原文表达。
- issue: אֲבִיאֶנָּה和אֶעֱשֶׂנָּה中阴性后缀的所指
  choice: 理解为上帝已经说出并筹定的事。
  alternative: 理解为从远方召来的那个人。
  rationale: 后缀为阴性，而“人”אִישׁ是阳性；因此更自然地指向隐含的旨意、计划或所宣布之事。
- issue: יָצַר在此处的具象含义与计划含义
  choice: 正文译作“筹定”，表达上帝使计划成形并确定。
  alternative: 较直译为“塑成”。
  rationale: 中文若说“把这事塑成”较不自然；“筹定”保留有意规划和使之定形的意义，但不把它弱化成临时意向。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“猛禽”保留先知性比喻；后半句用“确已……也必……”重现原文反复强调的确定性和节奏。
