base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/004.yaml
  text: Even to your old age[a], I am he, and to gray hairs I will carry you. I have made, and I will bear; I will carry[b], and I will rescue.
translation:
  language: zh_hans
  text: 直到你们年老，我就是那一位[a]；直到你们头发花白，我必背负你们。我造了你们，也必托住你们；我必背负你们[b]，也必搭救你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我是他”；也可译为“我仍是那一位”。
    reason: 说明אֲנִי הוּא这一简洁自我宣告在汉语中的可行表达，并避免将其限定为特定后期神学公式。
  - marker: b
    text: “背负”也可译作“承担”或“扶持”；原词含承载重担之意。
    reason: 说明סבל的语义范围及其在本段承载意象中的用法。
lexical_decisions:
- source_word: וְעַד זִקְנָה
  choice: 直到你们年老
  rationale: 表达持续到老年的时间范围；“你们”由上下文所指的以色列群体补出，使现代汉语自然。
- source_word: אֲנִי הוּא
  choice: 我仍是那一位
  rationale: 保留希伯来语简洁而庄严的自我宣告；“仍”承接“直到”的时间语境，但不把这一称谓扩展为特定的后期神学公式。
- source_word: וְעַד שֵיבָה
  choice: 直到你们白发
  rationale: 保留“白发”这一指向高龄的具体形象，避免与前句“年老”完全重复。
- source_word: אֶסְבֹּל
  choice: 我要背负你们／我必背负你们
  rationale: סבל在本段与负担、承载的意象相关；“背负”既保留具体图像，也可表达持续扶持。原文宾语依上下文补为“你们”。
- source_word: עָשִׂיתִי
  choice: 我造了你们
  rationale: עשה的基本义是“造、做”；本语境最自然地指上帝造了他的百姓。“你们”是根据上下文补明的宾语。
- source_word: אֶשָּׂא
  choice: 也必托住你们
  rationale: נשא可指举起、承载。译作“托住”与随后סבל的“背负”略作区分，同时表达支持性承载；宾语由上下文补出。
- source_word: וַאֲמַלֵּט
  choice: 也必搭救你们
  rationale: מלט的使役强化形式表示使人脱险、带到安全之地；“搭救”是清楚、自然且不过度神学化的现代汉语。
theological_decisions:
- issue: אֲנִי הוּא中的神圣自我宣告
  choice: 我仍是那一位
  alternative: 我就是他／我还是我
  rationale: 选择较庄严而自然的表达，保存原文自我确认的分量及一定开放性，不将其直接等同于其他经文中的特定神学称号。
- issue: 上帝作为创造者与承载者的关系
  choice: 我造了你们，也必托住你们
  alternative: 我既创造，也必承担
  rationale: 补明上下文所指的百姓，使创造与持续照顾之间的逻辑清楚；不把“搭救”扩大解释为某一完整的救恩体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。通过“年老／白发”和“托住／背负”保留原文的平行结构及近义变化；反复使用“我”以体现希伯来语中上帝行动主体的强调。
