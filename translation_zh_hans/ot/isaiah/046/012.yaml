  text: שִׁמְע֥וּ אֵלַ֖/י אַבִּ֣ירֵי לֵ֑ב הָ/רְחוֹקִ֖ים מִ/צְּדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/012.yaml
  text: Listen to me[a], you stubborn of heart[b], you who are far from righteousness.
translation:
  language: zh_hans
  text: 你们这些心里刚硬[a]、远离公义[b]的人，要听我说！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“心志刚强”或“内心强硬”。希伯来语字面是“心里强有力”，在这里的责备语境中很可能指内心顽固。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“正义”，或理解为“伸张正义、使人得蒙昭雪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: 要听我说
  rationale: 复数命令式 שִׁמְעוּ 加介词短语 אֵלַי，是要求听从、留意说话者，不只是听见声音。“要听我说”符合现代汉语的劝诫语气。
- source_word: אַבִּירֵי לֵב
  choice: 心里刚硬
  rationale: 字面可理解为“心里强硬/强壮”，但在本节责备性的语境中，所指更可能是内心顽固、不肯听从。“心里刚硬”既保留“心”的意象，也自然传达负面含义。
- source_word: הָרְחוֹקִים
  choice: 远离……的人
  rationale: 带冠词的分词作名词性用法，描述受呼告的一群人；译成“远离……的人”清楚自然。
- source_word: מִצְּדָקָה
  choice: 远离公义
  rationale: צְדָקָה 可指公义、正义，也可能涉及伸张正义或施行拯救。“公义”保留较宽的道德和神学含义，并与“远离”自然搭配。
theological_decisions:
- issue: צְדָקָה 的含义
  choice: 公义
  alternative: 正义；伸张正义；得蒙昭雪
  rationale: 该词在此既可能指人所远离的正直，也可能指上帝即将施行的正义或拯救性伸冤。正文采用涵盖面较广的“公义”，脚注保留其他可能，避免把经文限缩为单一的道德或法庭意义。
- issue: אַבִּירֵי לֵב 的语气
  choice: 心里刚硬
  alternative: 心志刚强；内心强硬
  rationale: 其字面构造本可表达“心里强有力”，但上下文是对不肯听从者的责备，因此正文采用负面的“刚硬”；脚注保留字面可能性，不把这一语义张力隐藏起来。
translation_notes:
  register: 采用现代、庄重而直接的先知性呼告。“你们这些……的人”明确受话对象，“要听我说”置于句末，符合自然汉语并加强命令语气。
