  text: כָּרַ֥ע בֵּל֙ קֹרֵ֣ס נְב֔וֹ הָיוּ֙ עֲצַבֵּי/הֶ֔ם לַ/חַיָּ֖ה וְ/לַ/בְּהֵמָ֑ה נְשֻׂאֹתֵי/כֶ֣ם עֲמוּס֔וֹת מַשָּׂ֖א לַ/עֲיֵפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/001.yaml
  text: Bel bows down[a]; Nebo stoops. Their idols are for the beasts and the cattle. Your loads are borne[c][b], loaded as a burden for the weary.
translation:
  language: zh_hans
  text: '彼勒屈膝，尼波俯身；


    他们的偶像被放在走兽和牲畜身上。


    你们所抬的神像[a]被装载起来，


    成了疲乏牲畜的重担。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们所抬的神像”原文含义较难确定，也可译作“你们所负的东西”。这里很可能指在仪式或迁运中被抬着的偶像。
    reason: lexical_alternative
  - marker: b
    text: “疲乏牲畜的重担”也可较直译为“疲乏者的重担”；阴性单数的“疲乏者”很可能特指负载偶像的牲畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַע
  choice: 屈膝
  rationale: 该词为完成式，在先知性宣告中生动描绘彼勒受辱倒下；“屈膝”保留身体下沉和降服的意象。
- source_word: בֵּל
  choice: 彼勒
  rationale: 巴比伦神祇专名，采用现代中文常见音译。
- source_word: קֹרֵס
  choice: 俯身
  rationale: 分词描写弯下、塌落的状态；“俯身”与“屈膝”形成自然平行，又不把动作过度具体化。
- source_word: נְבוֹ
  choice: 尼波
  rationale: 巴比伦神祇专名，采用现代中文常见音译。
- source_word: עֲצַבֵּיהֶם
  choice: 他们的偶像
  rationale: 该名词可指制作出来的神像；在本段先知性的讽刺语境中，“偶像”准确传达其贬义和宗教指向。
- source_word: לַחַיָּה וְלַבְּהֵמָה
  choice: 驮在走兽和牲畜身上
  rationale: 两个动物名词概括不同类别的兽类；结合上下文的运输图景，以“驮在……身上”自然表达它们成为牲口载物。
- source_word: נְשֻׂאֹתֵיכֶם
  choice: 你们所抬的神像
  rationale: 希伯来语形式和所指较难确定，字面涉及“你们所负载、抬着的东西”；上下文最可能指被人抬着游行、如今又被牲畜运输的神像，正文保留“抬”的反讽。
- source_word: עֲמוּסוֹת
  choice: 被装载起来
  rationale: 该被动分词表达被放上去作为货载的状态；“被装载起来”清楚呈现偶像自己不能行动、反要被运输的反讽。
- source_word: מַשָּׂא
  choice: 重担
  rationale: 该词指负载或重担；“重担”突出这些所谓神明反而拖累负重者。
- source_word: לַעֲיֵפָה
  choice: 疲乏牲畜的
  rationale: 阴性单数“疲乏的”很可能指前文某一隐含的驮兽，或集合性地指负重牲畜；译文以“牲畜”补明自然所指，同时用脚注保留语法上的宽泛可能。
theological_decisions:
- issue: 异教神像的称谓
  choice: 偶像
  alternative: 神像／雕像
  rationale: עֲצַבִּים虽可较中性地指制作的形像，但此处上下文明显以反讽揭露它们无力，译作“偶像”保留先知话语的批判力度，不额外引入宗派解释。
- issue: נְשֻׂאֹתֵיכֶם的所指
  choice: 你们所抬的神像
  alternative: 你们所负的东西／你们的负载
  rationale: 该形式困难，最可能承接前句偶像，指人所抬、如今被装运的神像；正文作语境化表达，脚注说明字面与歧义，避免把不确定性完全隐藏。
- issue: לַעֲיֵפָה所指的疲乏者
  choice: 疲乏的牲畜
  alternative: 疲乏者
  rationale: 阴性单数可能指隐含的驮兽，且前文已出现走兽和牲畜；正文据语境补明，但脚注保留较不具体的语法可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以短句和对应结构呈现希伯来诗句的平行感。“屈膝／俯身”刻画神祇倒下，“抬／装载／重担”贯穿负载意象，保留偶像不能自救、反需牲畜搬运的讽刺。所有脚注标记均置于正文相应位置。
