source:
  edition: WLC
  text: זִכְרוּ זֹ֖את וְ/הִתְאֹשָׁ֑שׁוּ הָשִׁ֥יבוּ פוֹשְׁעִ֖ים עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/008.yaml
  text: Remember this and be ashamed[a]; take it to heart[c][b], you transgressors.
translation:
  language: zh_hans
  text: 你们要记住这事，并要刚强[a]；悖逆的人[c]哪，要把这事放在心上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来语动词很少见，也可译作“振作起来”“鼓起勇气”或“站稳”。传统上另有“显出男子气概”的理解。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“使之回到心上”，意思是认真思想，把它牢记在心。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“犯罪的人”或“过犯者”；原词带有反叛、违抗的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ זֹאת
  choice: 要记住这事
  rationale: זִכְרוּ是复数命令式，直接要求听众记起；זֹאת是阴性单数指示词，译作“这事”既保留单数所指，也符合现代汉语。
- source_word: וְהִתְאֹשָׁשׁוּ
  choice: 并要刚强
  rationale: 这是一个罕见动词的复数命令式，基本语气涉及坚强、坚定或鼓起勇气。“刚强”保留其力量与坚定的含义，同时避免把词义限定为羞愧或男性身份。
- source_word: הָשִׁיבוּ עַל־לֵב
  choice: 要把这事放在心上
  rationale: 该短语直译近于“使之回到心上”，是要求人认真思想并内化所述之事的习语。“放在心上”自然保留了“心”的意象。
- source_word: פוֹשְׁעִים
  choice: 悖逆的人
  rationale: פשע指反叛、违抗或越过应守的界限；在此称呼听众为持续悖逆者。“悖逆的人”比单纯“犯罪的人”更清楚表达其反叛色彩。
theological_decisions:
- issue: 罕见动词הִתְאֹשָׁשׁוּ的解释
  choice: 译作“要刚强”，并用脚注保留“振作起来／鼓起勇气”等可能含义
  alternative: “要羞愧”或“显出男子气概”
  rationale: 该罕见词的词源和确切语气存在争议；加强、坚定的解释较能直接反映其常见词典分析。“要羞愧”缺乏同等明确的词汇依据，“显出男子气概”则可能把有争议的词源解释过度具体化。正文不替读者消除这一真实的词义不确定性。
- issue: פוֹשְׁעִים所表达的罪的性质
  choice: 悖逆的人
  alternative: 犯罪的人／过犯者
  rationale: 此词不只泛指做错事，也常含反抗权威、背叛盟约的意味；“悖逆”保留这一张力，但不额外加入特定宗派解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“这事”承接单数指示词，用“放在心上”表达希伯来语习语；称呼语“悖逆的人哪”保留先知性劝诫的力度。“并要刚强”略带经文语体，但普通读者仍易理解。
