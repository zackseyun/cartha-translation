  source_fidelity: 译文准确传达了原文的直接呼语、神在耶路撒冷城墙上委派守望者、日夜不断不静默，以及对“提醒耶和华者”的劝勉。将 הַמַּזְכִּרִים אֶת־יְהוָה 译为“提醒耶和华的人”保留了原文使役式鲜明而不完全等同于一般祷告用语的表达；脚注也适当保留了“呼求”和“使……记念”的替代理解。末尾逗号恰当地显示命令的语意延续至下一节。
