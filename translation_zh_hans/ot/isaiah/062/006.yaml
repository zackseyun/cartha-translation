  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל חוֹמֹתַ֣יִ/ךְ יְרוּשָׁלִַ֗ם הִפְקַ֨דְתִּי֙ שֹֽׁמְרִ֔ים כָּל הַ/יּ֧וֹם וְ/כָל הַ/לַּ֛יְלָה תָּמִ֖יד לֹ֣א יֶחֱשׁ֑וּ הַ/מַּזְכִּרִים֙ אֶת יְהוָ֔ה אַל דֳּמִ֖י לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/006.yaml
  text: On your walls[a], Jerusalem, I have appointed watchmen; all day and all night, continually, they will never be silent. You who remind Yahweh, take no rest for yourselves,
translation:
  language: zh_hans
  text: 耶路撒冷啊，我在你的城墙上设立了守望的人；他们终日终夜，时刻都不静默。你们这些提醒耶和华的人[a]，不要静默，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“呼求耶和华的人”或“使耶和华记念的人”。希伯来语的表达格外鲜明，描绘人不断向神恳求。
    reason: 保留הַמַּזְכִּרִים אֶת־יְהוָה的词义范围及其生动意象。
lexical_decisions:
- source_word: חוֹמֹתַיִךְ
  choice: 你的城墙
  rationale: חוֹמָה指城市的墙垣或防御工事；“城墙”既自然，也保留守望者所在之处的具体意象。
- source_word: הִפְקַדְתִּי
  choice: 我……设立了
  rationale: פקד的使役式在此表示委任、安置；“设立”兼顾任命与安排驻守的含义。
- source_word: שֹׁמְרִים
  choice: 守望的人
  rationale: 该词指负责看守、警戒的人；“守望的人”保留城墙上的守望意象，又符合现代汉语表达。
- source_word: כָּל־הַיּוֹם וְכָל־הַלַּיְלָה תָּמִיד
  choice: 终日终夜，时刻都
  rationale: 逐层表达全天、整夜和持续不断之意，保留原文对不间断守望的强调。
- source_word: לֹא יֶחֱשׁוּ
  choice: 都不静默
  rationale: חשה意为沉默、安静；否定未完成式在此表达持续不沉默。
- source_word: הַמַּזְכִּרִים אֶת־יְהוָה
  choice: 你们这些提醒耶和华的人
  rationale: זכר的使役分词可指使人记起、提醒或提说；直译“提醒”保留原文生动而略显大胆的呼求图像，不把它收窄为某一种祷告用语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，以专名而非称号呈现四字神名。
- source_word: אַל־דֳּמִי לָכֶם
  choice: 不要静默
  rationale: דֳּמִי可表示静默、安静或歇息；本句与前面的“不静默”呼应，而下一节另说不要让耶和华歇息，因此此处译作“不要静默”更清楚地保留上下文的递进。
theological_decisions:
- issue: “守望的人”以及“提醒耶和华的人”的身份
  choice: 保留原文称谓，不具体认定其为天使、先知、祭司或代祷者。
  alternative: 可解释为天上的守护者、先知性的守望者，或恒切祷告的人。
  rationale: 希伯来文本没有明确界定其身份；译文应保留意象和持续呼求的重点，避免加入特定神学解释。
- issue: “提醒耶和华”是否暗示神会遗忘
  choice: 保留原文拟人化而鲜明的说法。
  alternative: 意译为“呼求耶和华”或“提说耶和华”。
  rationale: 原文使用使役形式，描绘持续向神陈明、促请他记念应许的行动；翻译不应为消除神学张力而弱化这一表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“终日终夜，时刻都”保留原文重复造成的强调；末尾逗号表明本节句意延续到下一节。
