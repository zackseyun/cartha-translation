source:
  edition: WLC
  text: לְמַ֤עַן צִיּוֹן֙ לֹ֣א אֶחֱשֶׁ֔ה וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם לֹ֣א אֶשְׁק֑וֹט עַד יֵצֵ֤א כַ/נֹּ֨גַהּ֙ צִדְקָ֔/הּ וִ/ישׁוּעָתָ֖/הּ כְּ/לַפִּ֥יד יִבְעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/001.yaml
  text: For Zion’s sake I will not keep silent[a], and for Jerusalem’s sake I will not be quiet[c][b], until her righteousness goes out like brightness and her salvation burns like a torch.
translation:
  language: zh_hans
  text: 为了锡安，我[a]必不沉默；为了耶路撒冷，我必不歇息[b]，直到她的公义[c]如光辉发出，她的救恩如火炬燃烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节没有明确说明说话者是谁；可能是先知、耶和华，或某个代表性／守望者的声音。
    reason: alternative_reading
  - marker: b
    text: 或译“不安静”或“不静止”。希伯来语动词可表示安静、静止或歇息。
    reason: lexical_alternative
  - marker: c
    text: 或译“昭雪”。这里的希伯来语既可表示道德或盟约意义上的公义，也可表示公开获得昭雪。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 为了
  rationale: 表示行动所关切的对象和缘由；两次译作“为了”，保留原文以锡安和耶路撒冷构成的平行句式。
- source_word: אֶחֱשֶׁה
  choice: 必不沉默
  rationale: חשׁה意为沉默、不作声；“必不沉默”自然、庄重，也表达说话者持续坚持的意志。
- source_word: אֶשְׁקוֹט
  choice: 必不歇息
  rationale: שׁקט可表示安静、静止或歇息。这里译作“不歇息”，表达行动不会停止，同时以脚注保留“不安静”的可能。
- source_word: עַד
  choice: 直到
  rationale: 保留原文的时间界限，说明这种坚持将持续到后述结果出现。
- source_word: יֵצֵא
  choice: 发出
  rationale: יצא的基本意思是出去、出来；与“光辉”的比喻连用时，“发出”既贴近原文，又符合现代汉语表达。
- source_word: כַנֹּגַהּ
  choice: 如光辉
  rationale: נֹגַהּ表示光辉、亮光；不具体化为“黎明”，以免加入原文未明说的时间意象。
- source_word: צִדְקָהּ
  choice: 她的公义
  rationale: צדקה可指道德及盟约意义上的公义，也可在先知语境中指公开的昭雪；正文采用范围较广的“公义”，并以脚注保留另一义项。
- source_word: וִישׁוּעָתָהּ
  choice: 她的救恩
  rationale: ישועה涵盖拯救、解救及复兴；“救恩”保留其较宽广的神学含义。
- source_word: כְלַפִּיד
  choice: 如火炬
  rationale: לַפִּיד指火炬而非小油灯；“火炬”保留鲜明、公开可见的意象。
- source_word: יִבְעָר
  choice: 燃烧
  rationale: בער意为燃烧；直译为“燃烧”，不额外添加“熊熊”等强度。
theological_decisions:
- issue: 第一人称说话者的身份
  choice: 正文只保留“我”，不明确指认说话者
  alternative: 说话者可能是先知、耶和华，或某个代表性／守望者的声音
  rationale: 本节希伯来文本没有明说说话者是谁。保留第一人称而不补入身份，可避免消除原文真实存在的解释张力。
- issue: צִדְקָהּ的语义侧重
  choice: 公义
  alternative: 昭雪
  rationale: 该词既可指道德及盟约意义上的公义，也可指锡安获得公开昭雪。正文保留较基本且宽广的译法，并在脚注中提示语境中的另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必不沉默／必不歇息”保留原文的平行与递进；“如光辉发出／如火炬燃烧”保留两幅鲜明的光与火意象。
