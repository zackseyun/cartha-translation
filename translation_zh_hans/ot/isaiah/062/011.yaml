  text: הִנֵּ֣ה יְהוָ֗ה הִשְׁמִ֨יעַ֙ אֶל קְצֵ֣ה הָ/אָ֔רֶץ אִמְרוּ֙ לְ/בַת צִיּ֔וֹן הִנֵּ֥ה יִשְׁעֵ֖/ךְ בָּ֑א הִנֵּ֤ה שְׂכָר/וֹ֙ אִתּ֔/וֹ וּ/פְעֻלָּת֖/וֹ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/011.yaml
  text: 'Behold[a], Yahweh has proclaimed to the end of the earth: Say to Daughter Zion, “Behold, your salvation comes; behold, his reward is with him, and his recompense before him.”'
translation:
  language: zh_hans
  text: 看哪，耶和华已向地极宣告：你们要对锡安的女儿说：“看哪，你的救恩来到[a]；看哪，他的赏赐与他同在，他的报偿在他面前。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的救主来到。”希伯来文直译是“你的救恩”，但下文使用阳性代词“他的赏赐……他的报偿”，可能是把救恩人格化为那位将临的拯救者。
    reason: 保留“救恩”与“救主”之间由原文语法和上下文产生的真实歧义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，而不以“主”这一称号替代。
- source_word: הִשְׁמִיעַ
  choice: 已……宣告
  rationale: 使役式表达“使人听见、宣布”；“宣告”保留公开而庄重的发布意味。
- source_word: אֶל קְצֵה הָאָרֶץ
  choice: 向地极
  rationale: 保留希伯来文单数“地的尽头”的意象，并采用自然凝练的现代中文表达。
- source_word: לְבַת צִיּוֹן
  choice: 对锡安女子
  rationale: 保留将锡安人格化为女子的诗歌意象；“锡安女子”在中文中较“锡安的女儿”更自然，也不易被误解为实际亲属关系。
- source_word: יִשְׁעֵךְ
  choice: 你的救恩
  rationale: 按希伯来文本身译作名词“救恩”，不直接解释成“救主”；后续阳性代词所形成的人格化意味予以保留。
- source_word: בָּא
  choice: 来到
  rationale: 该完成式在先知宣告中具有生动的当前或将来指向；“来到”与人格化的“救恩”自然衔接。
- source_word: שְׂכָרוֹ
  choice: 他的赏赐
  rationale: 可指工价或奖赏；此处用“赏赐”符合先知诗歌的庄重语域。
- source_word: וּפְעֻלָּתוֹ
  choice: 他的报偿
  rationale: 此处指工作所得或应得的回报；“报偿”既区别于前面的“赏赐”，也保留应得回报的语义。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 保留空间性比喻以及与“在他那里”构成的平行结构。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 三次重复均译为“看哪”，保留强调、唤起注意和先知诗歌的节奏。
theological_decisions:
- issue: יִשְׁעֵךְ应译作非人格化的“你的救恩”，还是人格化的“你的救主”
  choice: 你的救恩
  alternative: 你的救主
  rationale: 希伯来文的词形是带第二人称阴性单数后缀的名词，直译为“你的救恩”。其后“他的赏赐……他的报偿”使用阳性代词，可能把救恩人格化为将临的拯救者。正文保留词汇本义，脚注说明另一种理解，避免消除原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。重复“看哪”以保存原文三重强调和诗歌节奏；“锡安女子”保留城市人格化意象。
