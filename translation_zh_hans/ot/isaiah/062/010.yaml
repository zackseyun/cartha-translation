  text: עִבְר֤וּ עִבְרוּ֙ בַּ/שְּׁעָרִ֔ים פַּנּ֖וּ דֶּ֣רֶךְ הָ/עָ֑ם סֹ֣לּוּ סֹ֤לּוּ הַֽ/מְסִלָּה֙ סַקְּל֣וּ מֵ/אֶ֔בֶן הָרִ֥ימוּ נֵ֖ס עַל הָ/עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/010.yaml
  text: Pass through[a], pass through the gates; clear the way for the people. Build up, build up the highway; clear it of stones[c][b]. Raise up a banner over the peoples.
translation:
  language: zh_hans
  text: 你们要经过，经过众门；为百姓清理道路。要修筑，要修筑大路；清除路上的石头。要在万民之上竖起旗帜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在万民之上”也可理解为“向万民”或“为万民”；“旗帜”也可译作“信号旗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ עִבְרוּ
  choice: 你们要穿过，要穿过
  rationale: 保留重复命令的修辞力度，并以现代汉语自然表达穿行之意。
- source_word: בַּשְּׁעָרִים
  choice: 城门
  rationale: 与前面的动词连读为“穿过城门”；“城”虽属语境所含，但中文单说“门”容易失去城门意象。
- source_word: פַּנּוּ דֶּרֶךְ
  choice: 清理道路
  rationale: 该动词的加强词干在此指清除障碍、使道路可通行；“清理”也与后文除石的筑路图像协调。
- source_word: הָעָם
  choice: 百姓
  rationale: 保留单数集合名词的含义，并自然指向锡安的民，与末句复数“万民”区分。
- source_word: סֹלּוּ סֹלּוּ
  choice: 要修筑，要修筑
  rationale: 在道路语境中指堆高、修建道路；“修筑”准确且符合现代汉语。
- source_word: הַמְסִלָּה
  choice: 大路
  rationale: 指经过修筑、可能垫高的道路；“大路”自然庄重，不额外限定为现代高速公路。
- source_word: סַקְּלוּ מֵאֶבֶן
  choice: 清除路上的石头
  rationale: 表达从道路上除去石块的动作；补出“路上的”使汉语指向清楚，不改变原意。
- source_word: הָרִימוּ נֵס
  choice: 竖起旗帜
  rationale: נֵס 可指公开可见、用于召集或示意的旗号；“旗帜”保留其具体意象和功能。
- source_word: עַל הָעַמִּים
  choice: 在万民之上
  rationale: 保留 עַל 的空间性“在……之上”，并以“万民”表达复数 עַמִּים 所涵盖的列邦众民。
theological_decisions:
- issue: 单数“百姓”与复数“万民”的所指
  choice: “百姓”自然指锡安／以色列的民，“万民”指列邦众民
  alternative: 两处均指以色列，或两处均泛指所有民族
  rationale: 希伯来文刻意从单数集合名词 הָעָם 转为复数 הָעַמִּים；译文保留这一区别，而不把先知话语的范围合并。
- issue: 旗帜与万民之间的关系
  choice: 在万民之上竖起旗帜
  alternative: 为万民竖起旗帜／向万民竖起旗帜
  rationale: 原文介词 עַל 首先具有“在……之上”的空间意义；正文保留这一图像，同时脚注提示可能的功能性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留三组命令中的重复修辞，并维持“百姓”与“万民”的数与范围差异。脚注标记置于相关末句之后。
