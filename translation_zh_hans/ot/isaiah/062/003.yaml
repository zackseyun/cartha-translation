source:
  edition: WLC
  text: וְ/הָיִ֛יתְ עֲטֶ֥רֶת תִּפְאֶ֖רֶת בְּ/יַד יְהוָ֑ה ו/צנוף מְלוּכָ֖ה בְּ/כַף אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/003.yaml
  text: You will be a crown of beauty in the hand of Yahweh[a], and a royal turban in the palm of your God.
translation:
  language: zh_hans
  text: 你必在雅威手中成为华美的冠冕，在你神的掌中成为王室的头巾[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王冠”、“王室的冠饰”。希伯来语所用的名词指缠裹式的头饰或头巾。
    reason: 说明צָנִיף的具体词义及其在王权语境中的可接受译法。
lexical_decisions:
- source_word: וְהָיִיתְ
  choice: 你必……成为
  rationale: 该形式在先知性话语中表达将来；保留对锡安／耶路撒冷的第二人称阴性单数直接称呼，并以“成为”自然呈现身份的转变。
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: 华美的冠冕
  rationale: 该结构直译为“华美／荣美之冠”；“华美的冠冕”既自然庄重，也保留冠冕意象。
- source_word: בְּיַד
  choice: 在……手中
  rationale: 保留具体的空间性比喻，呈现锡安如珍宝般被雅威持在手中，而不抽象化为“权能之下”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: וְצָנִיף מְלוּכָה
  choice: 王室的头巾
  rationale: צָנִיף指缠裹式头饰，מְלוּכָה赋予其君王／王室性质；此译保留与前句“冠冕”的词汇区别。
- source_word: בְּכַף
  choice: 在……掌中
  rationale: כַּף特指手掌或掌心；译作“掌中”既与前句“手中”形成诗体变化，也保留原文的具体意象。
- source_word: אֱלֹהָיִךְ
  choice: 你的神
  rationale: 该复数形态在此按上下文指以色列独一的神，第二人称阴性单数后缀则对应被称呼的锡安。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”旨在以音译保留其专名性质，而不以“主”等称号代替。
- issue: צָנִיף מְלוּכָה 的意象
  choice: 王室的头巾
  alternative: 王冠／王室的冠冕
  rationale: 上下文具有君王冠饰意象，但צָנִיף本义更接近缠裹式头饰；正文保留具体词义，并用脚注说明语境中的其他自然译法，避免与前句עֲטֶרֶת完全合并。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两分句保留“手中／掌中”的平行变化，以及“冠冕／头巾”的不同意象；语序稍作汉语化处理，但不消解原诗把锡安描绘为神手中珍贵王饰的张力。
