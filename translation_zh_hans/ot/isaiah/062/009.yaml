  text: כִּ֤י מְאַסְפָי/ו֙ יֹאכְלֻ֔/הוּ וְ/הִֽלְל֖וּ אֶת יְהוָ֑ה וּֽ/מְקַבְּצָ֥י/ו יִשְׁתֻּ֖/הוּ בְּ/חַצְר֥וֹת קָדְשִֽׁ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/009.yaml
  text: But those who gather it will eat it and praise Yahweh[b][a], and those who collect it will drink it in the courts of my sanctuary.
translation:
  language: zh_hans
  text: 但[a]收聚粮食的人必吃这粮食，并赞美耶和华；收集这酒的人必在我圣所[b]的院子里喝这酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “但”或译“因为”或“实在”。希伯来语 כִּי 可表达这些意思；本译文根据与上一节的对比关系译作“但”。
    reason: 保留连接词的词义与篇章关系上的歧义。
  - marker: b
    text: “我圣所的院子里”也可译作“我圣地的院子里”。
    reason: קָדְשִׁי 既可具体指神圣的处所，也保留“神圣／圣洁”这一基本语义。
lexical_decisions:
- source_word: כִּי
  choice: 但
  rationale: 结合上一节“不再让仇敌吃、外族人喝”的宣告，此处引出与之相反的结果；“但”最自然地表达这种语境中的转折关系，同时以脚注保留“因为／实在”的可能。
- source_word: מְאַסְפָיו
  choice: 收聚粮食的人
  rationale: אסף的分词表示把出产收聚起来的人；阳性单数后缀回指上一节的粮食。译文明确补出语境中的所指，避免现代汉语中含混生硬的“收聚它的人”。
- source_word: יֹאכְלֻהוּ
  choice: 必吃这粮食
  rationale: 保留动词“吃”的普通含义；未完成式在预言性宣告中译作“必”，其宾语后缀按上文明确为粮食。
- source_word: וְהִלְלוּ אֶת־יְהוָה
  choice: 并赞美耶和华
  rationale: הלל的Piel词干通常意为“赞美”；连接词译作“并”，神名按其专名形式译为“耶和华”。
- source_word: וּמְקַבְּצָיו
  choice: 采收葡萄的人
  rationale: קבץ与前半句的אסף构成平行，表示聚集、收集；其后缀在上一节的平行语境中回指新酒的来源葡萄。用“采收葡萄”既自然，也保留两组农作活动的区别。
- source_word: יִשְׁתֻּהוּ
  choice: 必……喝这酒
  rationale: שתה意为“喝”；未完成式译作“必”，宾语后缀依上一节的新酒语境明确为“这酒”。
- source_word: בְּחַצְרוֹת קָדְשִׁי
  choice: 在我圣所的院子里
  rationale: חצרות指院落；קָדְשִׁי在此与院子连用，宜具体理解为属于上帝的神圣处所，即“我的圣所”，而非抽象的“我的圣洁”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知且具有专名功能的“耶和华”，不以“主”替代，从而保留经文中的圣约神名。
- issue: קָדְשִׁי所指的敬拜场所
  choice: 我的圣所
  alternative: 我的圣地／我的圣洁
  rationale: 由于该词受“院子”限定，具体的场所意义最符合句法和圣殿意象；译作“圣所”并不进一步限定其建筑形态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“必”传达预言性应许的确定语气；两组“收聚粮食—吃”和“采收葡萄—喝酒”保持希伯来诗句的平行结构。脚注标记分别紧随相关词语。
