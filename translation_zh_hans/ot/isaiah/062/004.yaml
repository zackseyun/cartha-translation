  text: לֹֽא יֵאָמֵר֩ לָ֨/ךְ ע֜וֹד עֲזוּבָ֗ה וּ/לְ/אַרְצֵ/ךְ֙ לֹא יֵאָמֵ֥ר עוֹד֙ שְׁמָמָ֔ה כִּ֣י לָ֗/ךְ יִקָּרֵא֙ חֶפְצִי בָ֔הּ וּ/לְ/אַרְצֵ֖/ךְ בְּעוּלָ֑ה כִּֽי חָפֵ֤ץ יְהוָה֙ בָּ֔/ךְ וְ/אַרְצֵ֖/ךְ תִּבָּעֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/004.yaml
  text: No longer will you be called Forsaken[a], and your land will no longer be called Desolate; but you will be called My Delight Is in Her, and your land Married; for Yahweh delights in you[b], and your land will be married.
translation:
  language: zh_hans
  text: 人不再称你为“被撇弃的”，也不再称你的地为“荒凉的”；但人却要称你为“我喜悦她”[a]，称你的地为“出嫁的”[b]。因为耶和华喜悦你，你的地必被迎娶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“赫弗齐巴”，意思是“我喜悦她”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“贝乌拉”，意思是“出嫁的”或“有丈夫的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזוּבָה
  choice: 被撇弃的
  rationale: 保留被动含义，并按本节的改名修辞作为称号处理；比“被遗弃的”略显庄重而仍属现代汉语。
- source_word: שְׁמָמָה
  choice: 荒凉的
  rationale: 直接表达荒废、凋敝的状态，并与“被撇弃的”形成自然的平行。
- source_word: חֶפְצִי בָהּ
  choice: 我喜悦她
  rationale: 按希伯来语的透明含义翻译这个名字短语，保留第一人称“我”和第三人称阴性“她”，不把其解释性意义隐藏在音译中。
- source_word: בְּעוּלָה
  choice: 已婚的
  rationale: 该阴性被动形式表示已有丈夫、处于婚姻关系中；“已婚的”简洁地保留改名公式和婚姻意象。
- source_word: חָפֵץ
  choice: 喜悦
  rationale: 与前面的名字חֶפְצִי形成清楚的词义呼应，同时符合现代庄重汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式，明确呈现专名，而不以泛称“主”替代。
- source_word: תִּבָּעֵל
  choice: 必被迎娶
  rationale: 保留Niphal被动语态和明确的婚姻隐喻；“被迎娶”比笼统的“归属”更贴近原文，也比生硬的“被结婚”自然。
- source_word: לָךְ / אַרְצֵךְ
  choice: 你／你的地
  rationale: 区分被拟人化为女性的锡安与她的土地，维持原文平行结构。
theological_decisions:
- issue: 恢复之名应译出含义还是采用音译
  choice: 正文译作“被撇弃的”“荒凉的”“我喜悦她”“已婚的”
  alternative: 正文采用“赫弗齐巴”“贝乌拉”等音译
  rationale: 这些名称在希伯来语中语义透明，并以改名宣告的方式承载本节信息；正文译义更能再现修辞功能，音译则收入脚注。
- issue: 土地的婚姻隐喻
  choice: 保留“已婚的／必被迎娶”的婚姻语言
  alternative: 弱化为“蒙恢复”“有所归属”或“归给他”
  rationale: 原文以同一词根先作新名、后作动词，明确使用婚姻意象；保留这一张力，避免将其解释成抽象的恢复或所有权。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。引号突出四个改名式称号；后半句以“喜悦”复现名字的词义，以“被迎娶”复现“已婚的”的词根联系。标点将解释原因的כִּי另起一句，使中文节奏清楚，同时不改变逻辑关系。
