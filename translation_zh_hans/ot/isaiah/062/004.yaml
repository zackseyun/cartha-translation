    rationale: 原文为“将称你为”，与前文“将称你的地为”平行。中文若不用“被称为”，宜补出泛指施事“人”，即“人却要称你为”，以避免病句并完整呈现改名宣告。
  - severity: low
    issue: “已婚的”作为拟人化女性的名字略不自然。
    rationale: 该词虽然传达婚姻状态，但“出嫁的”更符合现代汉语对女性婚嫁状态的自然表达，且不改变原文的婚姻隐喻。
