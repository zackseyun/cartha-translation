review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了锡安（“你”）与“你的地”的区分、四个改名式称号、耶和华的喜悦，以及土地的婚姻隐喻。末句“必被迎娶”可表达被动婚姻意象，但“你却要称为”在现代汉语中缺少必要的被动或施事结构，妨碍准确、自然地呈现原文两组平行的“称为”公式。
  naturalness: “人不再称你为……，也不再称你的地为……”自然；但“你却要称为”不合现代书面汉语的常规句法。改为“人却要称你为……”可与前句平行，也避免无依据地把“却”理解为强烈转折；“但”足以承接原文的转折。
  terminology: “耶和华”“被撇弃的”“荒凉的”“我喜悦她”均可接受。作为女性拟人化之地的新名，“已婚的”虽可懂，但略显行政状态标签；“出嫁的”在现代汉语中更自然地指女子已进入婚姻，同时保留原文的婚姻图像。末句保留“被迎娶”，与土地被女性化的表达相协调。脚注音译及锚点对应正确。
