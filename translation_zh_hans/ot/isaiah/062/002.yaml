  text: וְ/רָא֤וּ גוֹיִם֙ צִדְקֵ֔/ךְ וְ/כָל מְלָכִ֖ים כְּבוֹדֵ֑/ךְ וְ/קֹ֤רָא לָ/ךְ֙ שֵׁ֣ם חָדָ֔שׁ אֲשֶׁ֛ר פִּ֥י יְהוָ֖ה יִקֳּבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/002.yaml
  text: Nations will see your righteousness[a], and all kings your glory[b]; and you will be called by a new name that the mouth of Yahweh will designate.
translation:
  language: zh_hans
  text: 列国必看见你的公义[a]，众王都必看见你的荣耀；人必以一个新名称呼你；这名必由耶和华亲口指定[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”或“昭雪”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“耶和华的口必指定它”；“它”指这个新名。
    reason: literal_rendering
lexical_decisions:
- source_word: וְרָאוּ
  choice: 必看见
  rationale: 在先知性语境中，这一完成式配合连接词表达将来必然发生之事；“必看见”自然保留预告和确定性。
- source_word: גוֹיִם
  choice: 列国
  rationale: 指广泛的各国，与下文“众王”平行；“列国”符合以赛亚书庄重而常见的中文措辞。
- source_word: צִדְקֵךְ
  choice: 你的公义
  rationale: צדק 可指公义、正义或所得的伸冤。此处虽有锡安公开获得昭雪的语境，“公义”仍能保留原词较宽广的伦理、关系及救赎含义。
- source_word: וְכָל־מְלָכִים
  choice: 众王都
  rationale: 以自然中文表达整体性的“所有君王”，并与“列国”形成平行。
- source_word: כְּבוֹדֵךְ
  choice: 你的荣耀
  rationale: כבוד 可表示荣耀、尊荣或光彩；“荣耀”兼顾以赛亚书的神学语域及锡安复兴后公开显明的尊荣。
- source_word: וְקֹרָא לָךְ
  choice: 人必用……来称呼你
  rationale: 原文动词形式为第三人称阳性单数，但主语未明说，可作不定人称理解；中文用“人必……”既保留主动结构，也避免擅自指定某一称名者。
- source_word: שֵׁם חָדָשׁ
  choice: 一个新名
  rationale: 表示新赐下的身份或地位；“一个新名”是自然、清楚的现代汉语。
- source_word: אֲשֶׁר פִּי יְהוָה יִקֳּבֶנּוּ
  choice: 这名是耶和华亲口指定的
  rationale: נקב 在此表示明确指定或命名；“亲口”自然传达原文“耶和华的口”，并强调新名出于他的宣告。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应希伯来文四字神名。
theological_decisions:
- issue: 锡安公开复兴之词 צִדְקֵךְ 的含义
  choice: 你的公义
  alternative: 你的昭雪；你的正义
  rationale: 上下文容许“昭雪”之意，但仅译为“昭雪”会缩窄原词的神学和伦理广度。“公义”保留多义张力，并以脚注提示其他可能。
- issue: 称新名的未明主语与神圣来源
  choice: 人必用一个新名来称呼你，这名是耶和华亲口指定的
  alternative: 他必给你起一个新名，就是耶和华的口所指定的
  rationale: 原文第一个动词形式上是第三人称单数，却未明说主语；译作不定人称“人”不武断认定其所指。后半句则清楚保留新名由耶和华亲自指定这一神学重点。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“列国—众王”和“公义—荣耀”的诗歌平行结构得到保留；“亲口指定”使希伯来语拟人表达在中文中自然呈现。
