source:
  edition: WLC
  text: וְ/אַֽל תִּתְּנ֥וּ דֳמִ֖י ל֑/וֹ עַד יְכוֹנֵ֞ן וְ/עַד יָשִׂ֧ים אֶת יְרֽוּשָׁלִַ֛ם תְּהִלָּ֖ה בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/007.yaml
  text: and give him no rest until he establishes and until he makes Jerusalem a praise in the earth[a][b].
translation:
  language: zh_hans
  text: 也不要让他歇息[a]，直到他坚立耶路撒冷，直到他使她在地上[b]受人赞美。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不要让他静默”；希伯来语名词可表示“静默”“安静”或“安歇”，这里的说法描绘人不断向耶和华呼求。
    reason: lexical_alternative
  - marker: b
    text: 或译“在这地”；希伯来语 אֶרֶץ 既可指“地上、全地”，也可指“土地、这地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּתְּנוּ
  choice: 也不要让
  rationale: 连接并延续上一节的劝勉；用“也不要让”自然表达希伯来语的连词、否定词和“给予”这一结构。
- source_word: דֳמִי לוֹ
  choice: 让他歇息
  rationale: דֳמִי可指安静、静默或安歇；在此搭配中，意思是不要停止向耶和华呼求，不让他得着安歇。正文采用自然的汉语表达，另以脚注保留“静默”的词义和原文意象。
- source_word: עַד יְכוֹנֵן
  choice: 直到他坚立
  rationale: כון在此表示使之稳固、确立。“坚立”既保留使其稳固的含义，也避免“建立”被误解为初次建城。
- source_word: וְעַד יָשִׂים
  choice: 直到他使
  rationale: 保留原文重复“直到”的平行结构，突出持续呼求的两个目标彼此相连。
- source_word: אֶת יְרוּשָׁלִַם
  choice: 耶路撒冷／她
  rationale: 第二个分句明确提到耶路撒冷；为使现代汉语顺畅，正文在第一分句明说“耶路撒冷”，第二分句以“她”回指这座城。
- source_word: תְּהִלָּה
  choice: 受人赞美
  rationale: 该名词可表示“赞美”或“美名”。“受人赞美”以自然汉语传达耶路撒冷成为赞美对象的谓语性比喻。
- source_word: בָּאָרֶץ
  choice: 在地上
  rationale: אֶרֶץ既可指全地、世界，也可指特定的土地。正文采用较广义的“地上”，同时以脚注保留“这地”的可能。
theological_decisions:
- issue: “他”的所指
  choice: 指耶和华
  alternative: 未明确指称的神圣或天上对象
  rationale: 上一节提到“提醒耶和华的人”，并吩咐他们不要静默；本节自然延续这一劝勉，要他们不断向耶和华呼求，直到他为耶路撒冷施行作为。
- issue: 耶路撒冷成为“赞美”的含义
  choice: 耶路撒冷成为受人赞美的对象
  alternative: 耶路撒冷本身成为向神发出的赞美
  rationale: 使某对象成为תְּהִלָּה的结构在此最自然地表达其获得美名、受人赞美；但译文不进一步限定赞美者或具体实现方式。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“坚立”保留先知文学中使耶路撒冷稳固的意味；重复“直到”以再现原文的平行推进。“受人赞美”比直译“成为赞美”更符合现代汉语，同时保留其作为赞美对象的意义。
