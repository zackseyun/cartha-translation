  text: וְ/קָרְא֥וּ לָ/הֶ֛ם עַם הַ/קֹּ֖דֶשׁ גְּאוּלֵ֣י יְהוָ֑ה וְ/לָ/ךְ֙ יִקָּרֵ֣א דְרוּשָׁ֔ה עִ֖יר לֹ֥א נֶעֱזָֽבָה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/012.yaml
  text: And they will call them[a], “The holy people, the redeemed of Yahweh”; and you will be called, “Sought Out[c][b], a city not forsaken.”
translation:
  language: zh_hans
  text: 人必称他们为：“圣洁的子民，雅威所救赎的人”[a]；你必被称为：“被寻求的”[b]，“未被撇弃的城”[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“雅威的蒙救赎者”或“蒙雅威救赎的人”。
    reason: 希伯来文属格结构可表示归属，也可理解为雅威是救赎者。
  - marker: b
    text: “被寻求的”也可译作“被寻访的”或“被探询的”。
    reason: 原词源于“寻求、探访、询问”，在这里用作城的新称号；被动形式未说明寻求者。
  - marker: c
    text: “撇弃”也可译作“遗弃”或“弃置”。
    reason: 原文被动分词表示未被弃置；“撇弃”也呼应以赛亚书中从被弃到复兴的主题。
lexical_decisions:
- source_word: וְקָרְאוּ לָהֶם
  choice: 人必称他们为
  rationale: קרא与介词ל构成命名表达；不定的复数主语用泛指“人”自然表达，预言语境中的完成式译为将来含义“必”。
- source_word: עַם הַקֹּדֶשׁ
  choice: 圣洁的子民
  rationale: עַם在此指一个群体或子民，而非强调政治意义的国家；定冠词结构表明这是一个称号。
- source_word: גְּאוּלֵי יְהוָה
  choice: 雅威救赎的人
  rationale: 复数被动分词表达已经蒙救赎的人；属格结构在上下文中自然表明雅威施行救赎，同时脚注保留其可译为所属关系的形式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，区别于将其替换为称号“主”。
- source_word: וְלָךְ יִקָּרֵא
  choice: 你必被称为
  rationale: 尼法勒未完成式在命名句中为被动；阴性单数“你”承接拟人化的锡安或耶路撒冷。
- source_word: דְרוּשָׁה
  choice: 人所寻求的
  rationale: 该阴性被动分词源于דרש，含“寻求、探访、询问”之意；译文保留其称号性质，不具体指定寻求者。
- source_word: עִיר לֹא נֶעֱזָבָה
  choice: 未被撇弃的城
  rationale: 这是与前一称号并列或同位的描述；“撇弃”保留以赛亚书中从被弃到复兴的主题呼应。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；“雅威”按现代学界通常重构的读音音译，既保留专名，也避免以称号代替。
- issue: דְרוּשָׁה中寻求者的身份
  choice: 用泛指“人所寻求的”，不指明具体寻求者
  alternative: 蒙雅威寻回的；受眷顾的
  rationale: 希伯来文是未明说施事者的被动形式；经文可能使人想到雅威的眷顾，也可能指这城重新为人所寻访，因此不在正文中限定施事者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必”体现预言宣告的确定语气；两个新称号均用引号标出。避免以过度解释性的“蒙宠之城”等说法消除原文在“寻求者”身份上的开放性。
