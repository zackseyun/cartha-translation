  text: כִּֽי יִבְעַ֤ל בָּחוּר֙ בְּתוּלָ֔ה יִבְעָל֖וּ/ךְ בָּנָ֑יִ/ךְ וּ/מְשׂ֤וֹשׂ חָתָן֙ עַל כַּלָּ֔ה יָשִׂ֥ישׂ עָלַ֖יִ/ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/005.yaml
  text: For as a young man marries a virgin[a], so your sons will marry you; and as a bridegroom rejoices over a bride, so your God will rejoice over you.
translation:
  language: zh_hans
  text: 因为正如青年娶处女[a]，你的众子也必娶你；又如新郎因新娘欢喜，你的上帝也必因你欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按一些古代译本所反映的另一读法译作：“建造你的那一位也必娶你”，或“建造你的人也必娶你”。希伯来语马所拉文本作“你的众子”。
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְעַל / יִבְעָלוּךְ
  choice: 娶 / 娶你
  rationale: בעל在这里用于婚姻语境，表示迎娶。前后采用同一婚姻用语，既自然，也保留锡安被拟人化为女子的比喻。
- source_word: בָּחוּר
  choice: 青年
  rationale: 此处指适婚的年轻男子，并无必要加入战士等含义；“青年”简洁而符合诗体。
- source_word: בְּתוּלָה
  choice: 处女
  rationale: 保留该词通常具有的贞洁、未婚女子这一词义特征，比宽泛的“少女”更贴近原文。
- source_word: בָּנָיִךְ
  choice: 你的众子
  rationale: 马所拉文本的元音标注明确作“你的众子”。虽然比喻不同寻常，正文仍依现存希伯来文本翻译，并在脚注说明古代译本所反映的另一读法。
- source_word: מְשׂוֹשׂ חָתָן עַל כַּלָּה
  choice: 如新郎因新娘而欢喜
  rationale: 原文以名词“欢喜”构成比较表达；汉语以动词句重现其意义更自然。“因……而欢喜”也准确表达介词עַל在此的关系。
- source_word: יָשִׂישׂ
  choice: 必……欢喜
  rationale: 该动词表示强烈喜悦；“欢喜”庄重自然，并与前一比较分句呼应。
- source_word: אֱלֹהָיִךְ
  choice: 你的上帝
  rationale: אֱלֹהִים在此以单数意义指以色列的上帝；“上帝”是现代标准汉语中清楚而庄重的对应语。
- source_word: כִּי
  choice: 因为，正如……也……
  rationale: כִּי引出解释性的比较；汉语用“因为，正如……也……”呈现本节对上文的说明关系及平行结构。
theological_decisions:
- issue: בָּנָיִךְ应译为“你的众子”，还是采用“建造你的那一位／建造你的人”这一异读
  choice: 你的众子
  alternative: 建造你的那一位（或：建造你的人）
  rationale: 马所拉文本读作“你的众子”，故正文优先保留这一传承文本及其刻意而紧张的拟人化意象，不因意象难解而静默改写。若按部分古代译本所反映的读法，则可理解为“建造你的那一位／建造你的人”；这一重要异读在脚注中交代。
- issue: 如何表达上帝与锡安之间的婚姻比喻
  choice: 保留“娶你”及新郎、新娘的婚姻意象
  alternative: 弱化为“拥有你”或“与你联合”
  rationale: 本节连续使用婚姻语言来描绘锡安的复兴和上帝的喜悦。直保婚姻意象可维持诗歌的神学张力，同时不额外发展任何特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，并保留希伯来诗歌的两重比较和平行结构。“众子娶你”的意象虽显突兀，仍照马所拉文本保留；脚注说明有古代见证支持的异读。
