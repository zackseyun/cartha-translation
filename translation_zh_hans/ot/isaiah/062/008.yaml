base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/008.yaml
  text: 'Yahweh has sworn by his right hand and by his strong arm: I will never again give your grain as food for your enemies[c][b][a], nor will foreigners drink your new wine for which you have labored.'
translation:
  language: zh_hans
  text: 耶和华凭自己的右手，凭自己大能的膀臂起誓说：“我绝不再把你的五谷给你的仇敌作食物[a]；外族人[b]也绝不再喝你劳作得来的新酒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“如果我再把你的五谷……如果外族之子喝你的新酒……”。这是起誓用语，其中“如果”表达强烈否定，即“我必不……”。
    reason: 说明希伯来语誓言公式中隐含的强烈否定。
  - marker: b
    text: 希伯来原文为“外族之子”，意思是外族人或外国人。
    reason: 保留原文习语的字面形式及其实际含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经语境中通行的专名“耶和华”译出四字神名，不以称号替代。
- source_word: נִשְׁבַּע
  choice: 起誓
  rationale: 准确表达尼法勒完成式所指已经作出的庄严誓言；配合“说”自然引出誓言内容。
- source_word: בִּימִינוֹ
  choice: 凭自己的右手
  rationale: 保留以右手作为誓言保证的表达；“自己的”明确反身所指。
- source_word: וּבִזְרֹעַ עֻזּוֹ
  choice: 凭自己大能的膀臂
  rationale: עֹז 表示力量、能力；“大能的膀臂”兼顾希伯来语结构和庄重中文表达。
- source_word: אִם אֶתֵּן ... עוֹד
  choice: 我绝不再把
  rationale: 誓言后的 אִם 是省略式起誓用语，实际表达强烈否定；“绝不再”同时体现 עוֹד。
- source_word: דְּגָנֵךְ
  choice: 你的五谷
  rationale: דָּגָן 泛指谷物收成；“五谷”在此为自然、庄重且易懂的集合性表达。
- source_word: מַאֲכָל לְאֹיְבַיִךְ
  choice: 给你的仇敌作食物
  rationale: 保留“交给仇敌供其食用”的关系，中文表达清楚自然。
- source_word: בְנֵי נֵכָר
  choice: 外族人
  rationale: 该习语直译为“异邦之子”，实际泛指外国或外族的人；“外族人”贴合此处群体与土地收成的语境。
- source_word: תִּירוֹשֵׁךְ
  choice: 你的新酒
  rationale: תִּירוֹשׁ 指葡萄新产的酒或新酒，保留它与一般“酒”的词义区别。
- source_word: אֲשֶׁר יָגַעַתְּ בּוֹ
  choice: 你劳作得来的
  rationale: 表达为获得这新酒而付出的辛劳，并使关系从句在现代中文中自然流畅。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知且具有专名功能的“耶和华”，不以“主”替换，也不据宗派立场增添解释。
- issue: 誓言公式中 אִם 的隐含否定
  choice: 明确译作“绝不再……也绝不再……”
  alternative: 形式直译为“如果我再……如果外族人喝……”
  rationale: 在 נִשְׁבַּע 之后，אִם 构成省略咒诅后果的誓言公式，语用上是强烈否定。若仅译“如果”会使普通中文读者误解句意；明确否定保留原文誓言力度。
- issue: 神凭右手和大能膀臂起誓的拟人性语言
  choice: 保留“凭自己的右手，凭自己大能的膀臂”
  alternative: 解释性改写为“凭自己的权能”
  rationale: 原文以身体意象表现神亲自以其能力保证誓言；保留意象，不将其系统化解释或弱化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“膀臂”保留先知诗歌的身体意象与经文语体；“绝不再”传达誓言的强烈否定。标点把两个平行否定分句清楚分开。
