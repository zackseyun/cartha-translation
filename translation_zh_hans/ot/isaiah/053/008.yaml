id: ISA.53.8
reference: Isaiah 53:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מֵ/עֹ֤צֶר וּ/מִ/מִּשְׁפָּט֙ לֻקָּ֔ח וְ/אֶת דּוֹר֖/וֹ מִ֣י יְשׂוֹחֵ֑חַ כִּ֤י נִגְזַר֙ מֵ/אֶ֣רֶץ חַיִּ֔ים מִ/פֶּ֥שַׁע עַמִּ֖/י נֶ֥גַע לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/008.yaml
  text: By oppression and judgment he was taken away[a]; and as for his generation, who considered that he was cut off from the land of the living[c][b], stricken for the transgression of my people?
translation:
  language: zh_hans
  text: 他因受欺压和审判而被带走。至于他的世代[b]，有谁曾思想[a]：他从活人之地被剪除，是因我百姓的过犯，击打临到了他[c]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “思想”也可译作“谈论”或“述说”；这里的希伯来语动词罕见，含义难以确定。
    reason: lexical_alternative
  - marker: b
    text: “他的世代”可能指与他同时代的人、他的后代，或更广义地指他一生的际遇。
    reason: alternative_reading
  - marker: c
    text: 或译：“击打临到了他们。”希伯来语לָמוֹ在形式上通常是复数，但在诗歌中这里也可能作单数，指“他”。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֹצֶר
  choice: 因受欺压
  rationale: עֹצֶר可指约束、拘禁或压迫；这里与“审判”并列，又接“被带走”，译作“因受欺压”较能表达带有压迫性质的处置，同时保留介词מִן可能具有的原因或手段意味。
- source_word: וּמִמִּשְׁפָּט
  choice: 和审判
  rationale: מִשְׁפָּט可指审判、司法裁决或公正；“审判”保留法律语境，不预先断定该程序本身是否公正。
- source_word: לֻקָּח
  choice: 被带走
  rationale: לקח的被动式表示被取走或除去；“被带走”自然贴近原文，并与下文从活人之地被剪除相呼应。
- source_word: וְאֶת־דּוֹרוֹ
  choice: 至于他的世代
  rationale: 原文将带אֶת的“他的世代”置于句首，结构较难；用主题结构“至于……”保留其突出位置，并不限定为同时代的人、后代或一生的际遇。
- source_word: מִי יְשׂוֹחֵחַ
  choice: 有谁曾思想
  rationale: 该动词罕见，语义有争议，可指思想、谈论或述说；主文采用“思想”，使后面的כִּי从句成为所思想的内容，同时在脚注保留其他可能。
- source_word: כִּי
  choice: （冒号引出所思想的内容）
  rationale: 这里将כִּי理解为引出“思想”的内容。汉语用冒号即可自然表达，无须机械译出“即”或“因为”。
- source_word: נִגְזַר
  choice: 被剪除
  rationale: נגזר的Niphal形态表达被割断、被剪除；在“活人之地”的语境中指生命被夺去，而“剪除”保留原有意象。
- source_word: מֵאֶרֶץ חַיִּים
  choice: 从活人之地
  rationale: 直译并保留希伯来语对现世生命领域的形象说法；现代汉语读者也可由上下文理解。
- source_word: מִפֶּשַׁע עַמִּי
  choice: 因我百姓的过犯
  rationale: פֶּשַׁע指悖逆性的过犯；介词מִן在这里取原因义，“因”简洁表达百姓的罪与仆人受害之间的关系。
- source_word: נֶגַע
  choice: 击打
  rationale: נֶגַע是名词，可指击打、灾害、创伤或病患；“击打临到”既保留名词性和受击意象，也避免把它过度具体化为某种疾病或刑罚。
- source_word: לָמוֹ
  choice: 临到了他
  rationale: לָמוֹ形式上通常为复数，但诗歌中可作单数；附近上下文持续以单数描述仆人，因此主文采用单数“他”，并在脚注保留“他们”的可能。
theological_decisions:
- issue: 末句לָמוֹ的数与所指
  choice: 按诗歌性单数理解，指向仆人：“击打临到了他”
  alternative: 按形式复数理解为“击打临到了他们”
  rationale: 上下文中的受苦者持续为单数，因此单数读法较连贯；然而לָמוֹ的形式确实可引出复数理解，故不在正文中掩盖这一张力，而以脚注说明。
- issue: דּוֹר的含义
  choice: 正文保留宽泛的“世代”
  alternative: 可特指他的同时代人、后代，或广义指他一生的际遇
  rationale: 原词容许多种理解；采用“世代”可避免把经文限定为某一种神学解释。
- issue: יְשׂוֹחֵחַ的语义
  choice: 译为“思想”
  alternative: 也可理解为“谈论”或“述说”
  rationale: “思想”与后面的内容从句衔接自然，但该罕见动词的确切语义不确定，因此将其他主要可能列入脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“剪除”“活人之地”保留原文诗歌意象；“过犯”维持先知文学的伦理与盟约语感。正文按希伯来语的压缩结构分为两句，并用冒号清楚标示思想内容，不增添特定宗派解释。
