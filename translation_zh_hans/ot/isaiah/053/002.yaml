source:
  edition: WLC
  text: וַ/יַּ֨עַל כַּ/יּוֹנֵ֜ק לְ/פָנָ֗י/ו וְ/כַ/שֹּׁ֨רֶשׁ֙ מֵ/אֶ֣רֶץ צִיָּ֔ה לֹא תֹ֥אַר ל֖/וֹ וְ/לֹ֣א הָדָ֑ר וְ/נִרְאֵ֥/הוּ וְ/לֹֽא מַרְאֶ֖ה וְ/נֶחְמְדֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/002.yaml
  text: For he grew up before him like a young plant[a], and like a root out of dry ground. He had no form or majesty that we should look at him[c][b], and no appearance that we should desire him.
translation:
  language: zh_hans
  text: 他在他面前长起来，如嫩芽[a]，又如根从干旱之地长出。他没有形貌和威仪，足以使我们注目于他[b]；我们看见他，也没有外貌足以使我们喜爱他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“幼嫩的枝条”或“嫩枝”。希伯来语יוֹנֵק在这里的植物比喻中可指幼嫩的芽或枝条。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“在他面前”；“他”的所指未在本句重述，常被理解为耶和华。
    reason: alternative_reading
  - marker: c
    text: 或较连贯地译：“他没有形貌和威仪，叫我们注目于他；也没有外貌，叫我们喜爱他。”希伯来语此处可直译为“我们看见他”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: 生长
  rationale: עלה本义为“上去、长出”；在植物意象中自然指生长或萌发，同时也能表达仆人的成长。
- source_word: כַּיּוֹנֵק
  choice: 如嫩芽
  rationale: יוֹנֵק可指幼嫩的芽或枝条；与下句“根”平行时，植物义最明确。“嫩芽”简洁自然，并保留柔弱初生的意象。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 按希伯来文保留第三人称阳性单数代词，不在正文中擅自将所指明确为耶和华。
- source_word: וְכַשֹּׁרֶשׁ
  choice: 又如根
  rationale: שֹׁרֶשׁ通常意为“根”；直译可延续具体的植物比喻。
- source_word: מֵאֶרֶץ צִיָּה
  choice: 出于干旱之地
  rationale: צִיָּה表示干旱、焦干；“干旱之地”既自然又保留贫瘠环境的意象。
- source_word: לֹא תֹאַר לוֹ
  choice: 他没有英俊的形态
  rationale: תֹאַר指形态、轮廓或相貌。结合后续观看与羡慕的语境，以“英俊的形态”表达其缺乏引人注目的外在形貌，同时不直接缩减为“美貌”。
- source_word: וְלֹא הָדָר
  choice: 也没有威仪
  rationale: הָדָר可指威荣、华美、尊严；此处“威仪”侧重外在可见的庄严气象。
- source_word: וְנִרְאֵהוּ
  choice: 使我们注目于他
  rationale: 辅音文本可形式化译为“我们看见他”；在本句语境中可与前面的否定描述相连，表达没有足以使人注目的形态。较直译读法置于脚注。
- source_word: וְלֹא מַרְאֶה
  choice: 他的外貌也没有什么
  rationale: מַרְאֶה指所见的外貌或形象；译为“外貌”保留视觉重点，不直接解释成“美貌”。
- source_word: וְנֶחְמְדֵהוּ
  choice: 使我们羡慕他
  rationale: חמד可表示渴望、喜爱或因其可取而向往。“羡慕”在此表达外貌并无令人向往之处；不采用可能带出现代情色色彩的“欲求”。
theological_decisions:
- issue: לְפָנָיו中“他”的所指
  choice: 正文保留“在他面前”，不明确所指。
  alternative: 在耶和华面前；在我们面前
  rationale: 原文是阳性单数后缀，本节没有重新明说先行词。上下文常使人理解为耶和华，但翻译不应替原文消除这一含混。
- issue: 本节所说是缺乏肉体美貌，还是更广泛地缺乏社会威望
  choice: 采用“形态、威仪、外貌”等视觉性词语，不扩写为身份或社会地位。
  alternative: 没有美貌；没有王者气派；没有社会声望
  rationale: 原文词汇集中于可见的形貌和外在气象；更广泛的社会或神学含义不应直接写入正文。
- issue: וְנִרְאֵהוּ的句法关系
  choice: 按语境译为“使我们注目于他”，与前句缺乏引人外貌相连。
  alternative: “我们看见他，却没有使我们羡慕他的外貌”
  rationale: 希伯来文可较形式化地读作“我们看见他”，但语境允许将其理解为否定外在吸引力的连续表达；脚注保存较直译读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“嫩芽—根—干旱之地”保持原文植物意象；“英俊的形态、威仪、外貌”形成视觉语义链。正文中的“他”按原文保留，不以敬称代词或专名预先确定其所指。
