id: ISA.53.10
reference: Isaiah 53:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יהוָ֞ה חָפֵ֤ץ דַּכְּא/וֹ֙ הֶֽחֱלִ֔י אִם תָּשִׂ֤ים אָשָׁם֙ נַפְשׁ֔/וֹ יִרְאֶ֥ה זֶ֖רַע יַאֲרִ֣יךְ יָמִ֑ים וְ/חֵ֥פֶץ יְהוָ֖ה בְּ/יָד֥/וֹ יִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/010.yaml
  text: Yet it pleased Yahweh to crush him[a]; he made him sick. If his life makes a guilt offering, he will see offspring, he will prolong his days[e][d][c][b], and the pleasure of Yahweh will prosper in his hand.
translation:
  language: zh_hans
  text: 然而[a]，耶和华乐意压碎他，使他患病[b]。如果他的生命献作赎愆祭[c][d]，他必看见后裔，延长自己的日子；耶和华所喜悦的事必在他手中亨通[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “然而”也可译作“而”或“但”；希伯来语连接词应如何翻译，取决于上下文的行文关系。
    reason: lexical_alternative
  - marker: b
    text: “使他患病”也可译作“使他受苦”或“使他忧伤”。
    reason: lexical_alternative
  - marker: c
    text: 本句也可译作：“当他的生命被献作赎愆祭时”，或“如果你使他的生命成为赎愆祭”。希伯来文在“献作”的主语方面尤其难以确定。
    reason: alternative_reading
  - marker: d
    text: “赎愆祭”是《妥拉》中为罪责和赔偿而献的祭。
    reason: cultural_note
  - marker: e
    text: “耶和华所喜悦的事必在他手中亨通”也可译作“耶和华的旨意必借着他的手实现”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: 然而，耶和华
  rationale: וַ־可表示简单连接，也可随语境带出转折。这里承接前文仆人所受的苦难，用“然而”表达强烈反差；יהוה译作“耶和华”。
- source_word: חָפֵץ
  choice: 乐意
  rationale: 该词可指喜悦、愿意或定意。“乐意”保留原文令人不安的直接力度，同时不额外解释为残酷的快感。
- source_word: דַּכְּאוֹ
  choice: 压碎他
  rationale: 该动词力度强于“压伤”；后缀明确以仆人为受事者。
- source_word: הֶחֱלִי
  choice: 使他患病
  rationale: 这是חלה的使役形式，可指使患病或使受苦。“使他患病”具体而贴近原词，宾语“他”由上下文补明。
- source_word: אִם
  choice: 如果
  rationale: 通常引出条件句；因本句也可能按时间意义理解，其他可能性收入脚注。
- source_word: תָּשִׂים אָשָׁם נַפְשׁוֹ
  choice: 他的生命献作赎愆祭
  rationale: 该短语句法困难；תשים既可按第三人称阴性单数理解，与נפשו呼应，也可按第二人称阳性单数理解。“献作”让中文自然，并保留生命成为祭物的意象，其他句法分析见脚注。
- source_word: אָשָׁם
  choice: 赎愆祭
  rationale: 这是《妥拉》中处理罪责与赔偿的专门祭祀用语。“赎愆祭”保留其礼仪背景。
- source_word: נַפְשׁוֹ
  choice: 他的生命
  rationale: נפש在此指仆人的生命或整个人，而非单指与身体相分离的“灵魂”。
- source_word: יִרְאֶה זֶרַע
  choice: 他必看见后裔
  rationale: זרע可指种子、后代或子孙。“后裔”保留家族延续的含义，又不额外限定其实现方式。
- source_word: יַאֲרִיךְ יָמִים
  choice: 延长自己的日子
  rationale: 保留希伯来语“延长日子”的惯用表达，同时用“自己的”明确主语关系。
- source_word: וְחֵפֶץ יְהוָה
  choice: 耶和华所喜悦的事
  rationale: חֵפֶץ可表示喜悦之事、旨意或目的。此译法保留它与前面的חָפֵץ之间的词根联系，也不把含义缩减为抽象的“计划”。
- source_word: בְּיָדוֹ יִצְלָח
  choice: 必在他手中亨通
  rationale: 直译保留“在他手中”的希伯来语意象；该表达同时含有借他施行、由他成就的意思。
theological_decisions:
- issue: 耶和华在仆人受苦中的主动作用
  choice: 正文直接译为“耶和华乐意压碎他，使他患病”。
  alternative: 耶和华容许他被压碎；耶和华任凭苦难临到他。
  rationale: 希伯来文直接把意愿与使役行动归于耶和华。若改成单纯的许可，会加入原文没有明说的神学缓和；同时，译文也不把“乐意”解释成恶意取乐。
- issue: 赎愆祭短语的主语与语气
  choice: 正文译为“如果他的生命献作赎愆祭”。
  alternative: 如果你使他的生命成为赎愆祭；当他的生命被献作赎愆祭时。
  rationale: תשים的形式既可作第三人称阴性单数，也可作第二人称阳性单数；全句的主语关系和条件语气均有争议。正文采用贴近马所拉读法且中文可读的表达，并在脚注保留其他合理分析。
- issue: 仆人受苦之后的生命与后裔
  choice: 按原文并列陈述“他必看见后裔，延长自己的日子”。
  alternative: 将“后裔”解释为特定群体，或把“延长日子”明确解释为复活、长寿或群体延续。
  rationale: 经文本身留下这些陈述如何实现的张力；译文不提前指定某一种神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“压碎”“患病”保留原文的具体与强烈；“赎愆祭”保留祭祀术语，并用脚注帮助普通读者理解。正文不消除条件句的句法难点，也不把“后裔”和“延长日子”预先限定为某一种教义解释。
