  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נִגַּ֨שׂ וְ/ה֣וּא נַעֲנֶה֮ וְ/לֹ֣א יִפְתַּח פִּי/ו֒ כַּ/שֶּׂה֙ לַ/טֶּ֣בַח יוּבָ֔ל וּ/כְ/רָחֵ֕ל לִ/פְנֵ֥י גֹזְזֶ֖י/הָ נֶאֱלָ֑מָה וְ/לֹ֥א יִפְתַּ֖ח פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/007.yaml
  text: He was oppressed[a], and he was afflicted, yet he did not open his mouth; like a lamb led to the slaughter, and like a ewe silent before her shearers, so he did not open his mouth.
translation:
  language: zh_hans
  text: 他受欺压[a]，遭受苦难，却不开口；他像羊羔被牵去宰杀，又像母羊在剪毛的人面前默不作声，他也不开口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他受欺压，却自己谦卑。”原文开头一句较难确定；第二个动词既可理解为被动地“遭受苦难”，也可理解为反身地“自己谦卑”。
    reason: alternative_reading
lexical_decisions:
- source_word: נִגַּשׂ
  choice: 受欺压
  rationale: 该词的尼法勒形式在这里表示受到苛刻对待或压迫。“受欺压”自然、庄重，也符合仆人无辜受苦的语境。
- source_word: נַעֲנֶה
  choice: 遭受苦难
  rationale: 此处可作被动或反身理解；正文按与前一动词平行的受苦含义翻译，同时以脚注保留“自己谦卑”的可能解释。
- source_word: וְלֹא יִפְתַּח פִּיו
  choice: 却不开口／他也不开口
  rationale: 保留原文首尾重复所形成的强调。首次用“却”表达受压迫而不抗辩的转折，末次用“也”收束两个比喻。
- source_word: כַּשֶּׂה
  choice: 像羊羔
  rationale: שֶׂה可泛指小型羊畜；在被牵去宰杀的意象中，“羊羔”既自然，也传达柔弱、无力反抗的形象。
- source_word: לַטֶּבַח יוּבָל
  choice: 被牵去宰杀
  rationale: יוּבָל是使役被动形式，表示在他人控制下被带走；“被牵去宰杀”准确而符合现代汉语搭配。
- source_word: וּכְרָחֵל
  choice: 又像母羊
  rationale: רָחֵל特指母羊，译出其性别也与后面的阴性代词呼应。
- source_word: לִפְנֵי גֹזְזֶיהָ נֶאֱלָמָה
  choice: 在剪毛的人面前默不作声
  rationale: 用“剪毛的人”比名词化的“剪毛者”更通俗自然；“默不作声”准确表达母羊安静无声的状态。
theological_decisions:
- issue: 译文是否明说弥赛亚或基督身份
  choice: 按希伯来文直接描述仆人的受苦与沉默，不在本节加入“基督”等身份称谓
  alternative: 采用受新约引用传统影响更明显的基督论措辞
  rationale: 本节本身以受苦、宰杀和剪毛的比喻描写仆人；其身份应由上下文及经文互证呈现，不宜在翻译中提前明说。
- issue: נַעֲנֶה的被动与反身歧义
  choice: 正文译作“遭受苦难”
  alternative: 译作“自己谦卑”或“自甘卑微”
  rationale: 与נִגַּשׂ形成平行时，被动受苦的理解较顺；但该形式也容许反身含义，因此用脚注保存真实歧义，不把仆人的主动顺服从解释层面完全排除。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的书面汉语。保留“不开口”的两次重复和羊羔、母羊两个相邻意象；避免过度古雅的“缄默”“受辱害”，也不在正文加入原文未明说的神学身份。
