  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נִבְזֶה֙ וַ/חֲדַ֣ל אִישִׁ֔ים אִ֥ישׁ מַכְאֹב֖וֹת וִ/יד֣וּעַ חֹ֑לִי וּ/כְ/מַסְתֵּ֤ר פָּנִים֙ מִמֶּ֔/נּוּ נִבְזֶ֖ה וְ/לֹ֥א חֲשַׁבְנֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/003.yaml
  text: He was despised and rejected by men[a], a man of pains and acquainted with sickness; and like one from whom people hide their faces, he was despised[d][c][b], and we did not esteem him.
translation:
  language: zh_hans
  text: 他被藐视，被人离弃[a]；他是饱受痛苦的人[b]，深知病痛[c]。他如同一个使人掩面避开的人[d]；他被藐视，我们也不看重他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被人弃绝”。希伯来语短语含义较难确定，也可较直译为“在人中被撇下”或“缺少人的陪伴”。
    reason: alternative_reading
  - marker: b
    text: 或译：“多受忧患的人”。“痛苦”可包括身体的疼痛和内心的苦楚。
    reason: lexical_alternative
  - marker: c
    text: 或译：“熟悉忧患”。原文较具体地说“疾病”或“病痛”。
    reason: lexical_alternative
  - marker: d
    text: 希伯来语在这里采用省略式表达，字面近于“如同从他面前掩面”；意思是人们转脸避开他。
    reason: textual_clarity
lexical_decisions:
- source_word: נִבְזֶה
  choice: 被藐视
  rationale: 该词是בזה的尼法勒分词，表示遭人轻蔑、被视为可鄙；“被藐视”简洁地保留了被动和持续状态。
- source_word: חֲדַל אִישִׁים
  choice: 被人离弃
  rationale: 这一希伯来语短语较难确定，חדל在这里可表达缺少、远离或被弃置的状态；“被人离弃”既贴近底层措辞，又自然表达社会性的疏离。
- source_word: אִישׁ מַכְאֹבוֹת
  choice: 饱受痛苦的人
  rationale: מַכְאֹבוֹת可指身体或内心的疼痛、苦楚；“饱受痛苦的人”在现代汉语中自然，并且不把含义限定为情绪上的忧愁。
- source_word: וִידוּעַ חֹלִי
  choice: 熟悉疾病
  rationale: יָדוּעַ与חֹלִי连用，表达与疾病相识、熟知疾病；“熟悉疾病”保留原文具体的疾病用语，同时容纳亲身经历的意味。
- source_word: וּכְמַסְתֵּר פָּנִים מִמֶּנּוּ
  choice: 他仿佛是人们掩面不看的人
  rationale: 原文是省略式结构，字面近于“如同向他掩面”；补出“人们”并加“不看”，使现代汉语明白自然，同时保留人们转脸避开他的核心意象。
- source_word: וְלֹא חֲשַׁבְנֻהוּ
  choice: 我们也不看重他
  rationale: חשב在此表示衡量、看待或重视；“不看重”准确传达说话群体没有赋予他价值或尊荣的意思。
theological_decisions:
- issue: 受苦仆人的弥赛亚诠释
  choice: 按本节自身的文学措辞描写这位人物，不在正文中增添明确的基督论身份说明。
  alternative: 在译文中直接加上基督论称谓或解释。
  rationale: 本段在基督教正典传统中具有弥赛亚意义，但希伯来文本本节没有明说身份；不作增补，既忠于原文，也为正典性的神学阅读保留空间。
- issue: 受苦词汇的具体性
  choice: 采用“痛苦”和“疾病”，保留身体与内心两方面的可能性。
  alternative: 采用传统的“忧患”和“悲伤”。
  rationale: 原文词汇具体指向疼痛和疾病，却不必限定为纯粹的肉体病症；这种译法保留仆人真实而具身的受苦及其语义张力。
- issue: 掩面的施受关系
  choice: 正文采用人们向他掩面的理解，并以脚注说明原文的省略性。
  alternative: 理解为他向人掩面，或完全照字面译作“如同从他那里把脸遮藏起来”。
  rationale: 介词מִן及上下文支持人们避开他的理解，但希伯来语结构简略，故不把语法上的不确定性隐藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“饱受痛苦的人”“熟悉疾病”避免过度古雅，也不把受苦窄化为单一情绪或病理状态；分号和重复的“他被藐视”保留希伯来诗句的平行与强调。
