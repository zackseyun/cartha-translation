revisions:
- from: 他被藐视，被人离弃[a]；他是饱受痛苦的人[b]，熟悉疾病[c]。他仿佛是人们掩面不看的人[d]；他被藐视，我们也不看重他。
  to: 他被藐视，被人离弃[a]；他是饱受痛苦的人[b]，深知病痛[c]。他如同一个使人掩面避开的人[d]；他被藐视，我们也不看重他。
  rationale: 仅作两处低风险的现代汉语润色，并相应校正脚注的措辞：以“深知病痛”表达与疾病相熟的亲历意味，避免“熟悉疾病”的知识性联想；以“使人掩面避开”使诗句通顺，同时脚注明确原文省略式和“从他面前”的关系。译文不加入对受苦者身份的神学解释，也不消除原文在难句中的必要含混。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:22:24Z'
