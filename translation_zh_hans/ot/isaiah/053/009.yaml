  text: וַ/יִּתֵּ֤ן אֶת רְשָׁעִים֙ קִבְר֔/וֹ וְ/אֶת עָשִׁ֖יר בְּ/מֹתָ֑י/ו עַ֚ל לֹא חָמָ֣ס עָשָׂ֔ה וְ/לֹ֥א מִרְמָ֖ה בְּ/פִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/009.yaml
  text: And they assigned his grave with the wicked[a], and with a rich man in his deaths, although he had done no violence[b], and no deceit was in his mouth.
translation:
  language: zh_hans
  text: 有人使他与恶人同埋[a]；在他死时，却与一个富人同葬[b]；尽管他未行强暴，口中也没有诡诈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的坟墓被定在恶人那里。”希伯来文动词本义为“给、放置、设定”，其主语没有明说。
    reason: alternative_reading
  - marker: b
    text: “他死时”：希伯来文形式上为复数，直译近于“在他的众死之中”；许多译本按语境译作单数“他死时”或“在他死的时候”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 人把……安排在
  rationale: נתן本义为“给、放置、设定”；本句未明说主语，现代汉语用泛指的“人”表达这种不定施事者，并以“安排”传达墓地被指定的语境。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 保留复数集合性道德称谓，简洁而符合现代汉语圣经语体。
- source_word: קִבְרוֹ
  choice: 他的坟墓
  rationale: קבר在此指坟墓或葬身之处；“坟墓”直接、自然。
- source_word: עָשִׁיר
  choice: 财主
  rationale: 原文为单数，指一个富有的人；“财主”既保留个人指称，也比“富人阶层”更贴近单数形式。
- source_word: בְּמֹתָיו
  choice: 他死时
  rationale: 该词形式上是复数，直译近于“在他的诸死之中”，但这种说法在现代汉语中难以成立；正文按语境表达为“他死时”，并以脚注保留原文异常复数。
- source_word: עַל
  choice: 尽管
  rationale: 在上下文中表达让步关系：他虽被如此安葬，却未曾行强暴或说诡诈的话。
- source_word: חָמָס
  choice: 强暴
  rationale: חמס常指暴力、强暴或暴虐的恶行；“强暴”保留其强烈的道德与暴力色彩。
- source_word: מִרְמָה
  choice: 诡诈
  rationale: 指欺骗、诡诈；与“口中”搭配自然，也保持庄重语体。
- source_word: בְּפִיו
  choice: 口中
  rationale: 直接保留希伯来语“在他口中”的表达，不增添原文没有的“被发现”。
theological_decisions:
- issue: 仆人之死的异常复数形式 בְּמֹתָיו
  choice: 正文采用自然的“他死时”，脚注注明希伯来文形式上为复数。
  alternative: 直译为“在他的诸死之中”或“在他的众死中”。
  rationale: 现代汉语无法自然地用复数“死”表达此处含义；正文保证可懂性，脚注则保存原文的异常形式，不用后来的神学解释替它定意。
- issue: וַיִּתֵּן 的主语未明
  choice: 用泛指主语“人”，不指明具体施事者。
  alternative: “他把……安排在……”或被动式“他的坟墓被安排在……”。
  rationale: 希伯来文动词为第三人称阳性单数，但上下文没有明确主语；泛指“人”避免把主语认定为上帝、仆人或某个特定群体。
- issue: 两种埋葬描述之间的张力
  choice: 保留“恶人中间”与“财主同葬”的并列，并用“却”表现语意反差。
  alternative: 将“恶人”与“财主”解释为同一类人，或把后一短语改作别的意义。
  rationale: 原文并列两个介词短语，却未解释二者关系；译文不作教义化调和，只呈现其反差。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“财主”“强暴”“诡诈”保留经文的凝练与道德力度；通过脚注交代未明主语和异常复数，避免正文生硬，也不消除原文张力。
