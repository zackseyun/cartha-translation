  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מֵ/עֲמַ֤ל נַפְשׁ/וֹ֙ יִרְאֶ֣ה יִשְׂבָּ֔ע בְּ/דַעְתּ֗/וֹ יַצְדִּ֥יק צַדִּ֛יק עַבְדִּ֖/י לָֽ/רַבִּ֑ים וַ/עֲוֺנֹתָ֖/ם ה֥וּא יִסְבֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/011.yaml
  text: From the anguish of his soul he will see and be satisfied[a]; by his knowledge my righteous servant will justify many[b], and he will bear their iniquities.
translation:
  language: zh_hans
  text: 他经历心灵的苦难之后，必看见，便心满意足[a]；我的义仆必凭自己的认识[b]使许多人得称为义；至于他们的罪孽，他必担当。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些古代文献见证作“必看见光，便心满意足”；马所拉文本只作“必看见，便心满意足”。
    reason: textual_variant
  - marker: b
    text: 或译：“因人认识他”。这种理解认为，此处所说的是别人认识这位仆人，而不是仆人自己的认识。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֲמַל נַפְשׁוֹ
  choice: 经历心灵的苦难之后
  rationale: עָמָל在此指痛苦、患难，而非普通劳作；נֶפֶשׁ指人的内在生命或整个自我。“心灵的苦难”保留希伯来语意象，“之后”自然表达介词מִן在上下文中的起点或结果关系。
- source_word: יִרְאֶה יִשְׂבָּע
  choice: 必看见，便心满意足
  rationale: 按马所拉文本保留“看见”而不补明宾语；יִשְׂבָּע表达饱足、满足，“心满意足”是自然且庄重的现代汉语。
- source_word: בְּדַעְתּוֹ
  choice: 凭自己的认识
  rationale: 主文本按较直接的主观、工具性理解，指仆人自己的认识；原文也可能理解为别人“认识他”，故以脚注保留歧义。
- source_word: יַצְדִּיק
  choice: 使……得称为义
  rationale: צדק的使役形在此可指使人被判定或承认为义；“得称为义”既保留司法色彩，也避免擅自界定其具体机制。
- source_word: צַדִּיק עַבְדִּי
  choice: 我的义仆
  rationale: 将צַדִּיק作修饰עַבְדִּי的形容词，简洁保留“属我”和“公义”两个要素。
- source_word: לָרַבִּים
  choice: 许多人
  rationale: 忠实保留רַבִּים的范围，不为神学协调而扩展为“所有人”；现代汉语用“许多人”自然清楚。
- source_word: וַעֲוֺנֹתָם הוּא יִסְבֹּל
  choice: 至于他们的罪孽，他必担当
  rationale: “罪孽”兼顾עָוֺן的罪恶与罪责意味；“担当”准确表达承受、背负。用“至于……，他……”体现独立代词הוּא带出的聚焦，而不过度增添“亲自”等解释。
theological_decisions:
- issue: בְּדַעְתּוֹ的所指
  choice: 凭自己的认识
  alternative: 因人认识他／借着对他的认识
  rationale: 词尾代词最直接可指仆人自己的认识，但该结构也可理解为他人对仆人的认识。主文本采用直接语法读法，脚注保留另一种重要理解。
- issue: יִרְאֶה之后是否有“光”
  choice: 按马所拉文本译作“必看见”，不补宾语
  alternative: “必看见光，便心满意足”
  rationale: 所给WLC文本没有“光”；部分古代见证含“光”，因此不纳入主文本，但在脚注说明文本异文。
- issue: לָרַבִּים的范围
  choice: 许多人
  alternative: 众人／许许多多的人
  rationale: 原文明确使用“许多”，译文不将其扩大为“所有人”，也不在本节中解决更广泛的教义范围问题。
- issue: יַצְדִּיק的含义
  choice: 使许多人得称为义
  alternative: 使许多人成为义人
  rationale: 采用可保留宣告、认定意味的表达，不强行把使役动词限定为纯粹法庭宣告或内在道德改变。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式尽量贴近希伯来语的推进次序，同时避免生硬直译；“至于他们的罪孽，他必担当”保留末句的聚焦和强调。脚注标记置于各自所说明的词句之后。
