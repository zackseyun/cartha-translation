reference: Isaiah 53:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן אֲחַלֶּק ל֣/וֹ בָ/רַבִּ֗ים וְ/אֶת עֲצוּמִים֮ יְחַלֵּ֣ק שָׁלָל֒ תַּ֗חַת אֲשֶׁ֨ר הֶעֱרָ֤ה לַ/מָּ֨וֶת֙ נַפְשׁ֔/וֹ וְ/אֶת פֹּשְׁעִ֖ים נִמְנָ֑ה וְ/הוּא֙ חֵטְא רַבִּ֣ים נָשָׂ֔א וְ/לַ/פֹּשְׁעִ֖ים יַפְגִּֽיעַ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/012.yaml
  text: Therefore I will allot him a portion among the many[a], and he will divide plunder with the strong, because he poured out his life to death and was numbered with transgressors[c][b]; yet he bore the sin of many and intercedes for transgressors.
translation:
  language: zh_hans
  text: 所以，我要使他在众人中得一份[a]；他要与强者分取战利品。因为他将自己的生命倾倒出来，以至于死；他被列在悖逆者之中[b]。然而，他担当了许多人的罪，又为悖逆者代求[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要让他与众人同得一份。”本句希伯来语十分简练，可有几种彼此相近的理解。
    reason: alternative_reading
  - marker: b
    text: 或译：“他被算作悖逆者之一。”
    reason: lexical_alternative
  - marker: c
    text: “代求”也可译作“为……求情”；这里的希伯来语动词可较正式或较通俗地表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 标明仆人受苦之后所得尊荣的结果，符合本节的推论关系，也自然承接上文。
- source_word: אֲחַלֶּק לוֹ בָרַבִּים
  choice: 我要使他在众人中得一份
  rationale: חלק 的使役加强词干表达分配、划给之意；希伯来语结构简练且有歧义，此译保留“所得份额”和“众人”的意象，不把“众人”直接解释为赐给他的产业。
- source_word: עֲצוּמִים
  choice: 强者
  rationale: 该词通常表示强壮或强大的人；与分取战利品的得胜图景相符。
- source_word: יְחַלֵּק שָׁלָל
  choice: 均分战利品
  rationale: 保留军事胜利后分配掠物的意象；“均分”在中文中自然表达与强者一同分取。
- source_word: תַּחַת אֲשֶׁר
  choice: 因为
  rationale: 自然表达后文作为仆人得尊荣之根据的因果关系。
- source_word: הֶעֱרָה לַמָּוֶת נַפְשׁוֹ
  choice: 他将自己的生命倾倒出来，以至于死
  rationale: 保留“倾倒”这一鲜明隐喻；נפשׁ 在此指生命或自身，“生命”最符合上下文。
- source_word: וְאֶת פֹּשְׁעִים נִמְנָה
  choice: 他被列在悖逆者之中
  rationale: נמנה 在此自然理解为被计算、被归列；被动表达忠实反映希伯来语形式。
- source_word: פֹּשְׁעִים
  choice: 悖逆者
  rationale: פשע 强调反叛、违逆，不只是泛指犯罪或有罪；“悖逆者”保留这一道德与关系层面的力度。
- source_word: וְהוּא
  choice: 然而，他
  rationale: 连接词本身可直译为“而他”，但上下文形成鲜明对比：他虽被列在悖逆者中，实际却担当别人的罪。“然而”自然呈现这一语境关系。
- source_word: חֵטְא רַבִּים נָשָׂא
  choice: 他担当了许多人的罪
  rationale: נשא 与“罪”连用有承担、背负之意；“担当”保留其代表性和祭祀性潜力，却不扩写成某一套教义公式。
- source_word: רַבִּים
  choice: 众人／许多人
  rationale: 首处因介词结构译作“众人”，后处按宾属关系译作“许多人”；两者都保留 רבים 的多数含义，不擅自扩大为“所有人”或限定其范围。
- source_word: וְלַפֹּשְׁעִים יַפְגִּיעַ
  choice: 又为悖逆者代求
  rationale: פגע 的使役加强词干在此结合介词 לְ，适合解作替人恳求、代求；希伯来语未完成式可表达概括性或持续性的行动，中文不必强行标明单一时态。
theological_decisions:
- issue: רַבִּים 所指范围
  choice: 译作“众人／许多人”，不判断其在修辞上是否等同于全体。
  alternative: 译作“所有人”或“万民”。
  rationale: 原文使用 רבים；保留其字面范围，让更广泛的救赎论推论留在解释层面。
- issue: נָשָׂא חֵטְא 的赎罪含义
  choice: 译作“担当了许多人的罪”。
  alternative: 译作“除去了许多人的罪”或“替许多人受了刑罚”。
  rationale: “担当罪”保留代表、承担和祭祀语境中的神学分量，同时不把它缩减为某一种后期教义表述。
- issue: יַפְגִּיעַ 的行动与时态
  choice: 译作“为悖逆者代求”，不在中文中限定为仅过去或仅现在的行动。
  alternative: 译作“曾为悖逆者代求”或“不断为悖逆者代求”。
  rationale: 未完成式容许概括性、持续性或语篇中的未来视角；不添加时间副词可保存其张力。
- issue: 仆人与悖逆者的关系
  choice: 用“然而”显出他被列在悖逆者中，却担当他人之罪的语境反差。
  alternative: 只用中性的“而”。
  rationale: 反差来自诗句本身，但译文不进一步说明代罚机制或仆人的身份，以免超出本节原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倾倒出来”“担当”“代求”保留诗歌意象和神学厚度；句式以分号划分尊荣、受死、担当与代求等层次。所有脚注标记均置于对应主文词句之后。
