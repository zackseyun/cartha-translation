  text: אָכֵ֤ן חֳלָיֵ֨/נוּ֙ ה֣וּא נָשָׂ֔א וּ/מַכְאֹבֵ֖י/נוּ סְבָלָ֑/ם וַ/אֲנַ֣חְנוּ חֲשַׁבְנֻ֔/הוּ נָג֛וּעַ מֻכֵּ֥ה אֱלֹהִ֖ים וּ/מְעֻנֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/004.yaml
  text: Surely he has borne our sicknesses and carried our pains[a]; yet we considered him stricken, struck by God[b], and afflicted.
translation:
  language: zh_hans
  text: 他确实担当了我们的疾病，背负了我们的疼痛[a]；我们却以为他遭击打、被上帝击打[b]、受苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们的忧患”和“我们的愁苦”。希伯来语更直接指疾病和疼痛。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被上帝责罚。”原文直译为“被上帝击打”；“责罚”表达众人可能作出的惩罚性理解。
    reason: interpretive_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: 确实
  rationale: 表达强调并纠正先前的误判，也自然引出后半句的转折。
- source_word: חֳלָיֵנוּ
  choice: 我们的疾病
  rationale: 该名词通常指疾病或病痛；主文保留具体的身体性含义，不以传统的广义“忧患”取代。
- source_word: נָשָׂא
  choice: 担当
  rationale: 既有拿起、承受重担之意，也符合本段庄重语体；与下一个表示负重的动词形成对应而不完全重复。
- source_word: וּמַכְאֹבֵינוּ
  choice: 我们的疼痛
  rationale: 该词直接指疼痛，常包含身体疼痛；比“愁苦”更贴近此处希伯来语。
- source_word: סְבָלָם
  choice: 背负
  rationale: 突出负重、搬运的意象，并与“担当”共同反映原文两个相近而有区别的动词。
- source_word: וַאֲנַחְנוּ
  choice: 我们却
  rationale: 这里不只是顺接，而是将仆人实际的担当与众人的错误判断形成鲜明对照。
- source_word: חֲשַׁבְנֻהוּ
  choice: 以为他
  rationale: 自然表达“认定、看作”的意思，并保留这是众人判断而非叙述者断言的关键区别。
- source_word: נָגוּעַ
  choice: 受了灾害
  rationale: 该被动分词可指遭击打、受灾病或灾害；此译法保留严重受创的含义，又不把具体灾患限定为某一种。
- source_word: מֻכֵּה אֱלֹהִים
  choice: 被上帝击打
  rationale: 直接保留原文明确的神圣施事者，同时不加入“击倒”等原文未明说的结果含义。
- source_word: וּמְעֻנֶּה
  choice: 遭受苦难
  rationale: 在此处表达受苦、受压或受折磨；译文避免与前面的“击打”机械重复。
theological_decisions:
- issue: 仆人所担当的是具体疾病疼痛，还是泛化的忧患愁苦
  choice: 主文采用“疾病／疼痛”
  alternative: “忧患／愁苦”
  rationale: חֳלִי与מַכְאוֹב在本节首先具有疾病和疼痛的具体含义。保留这一词义并不排除更广的受苦或救赎意涵，也不应在翻译中先行把它泛化。
- issue: מֻכֵּה אֱלֹהִים是否明确表达上帝的施事作用
  choice: “被上帝击打”
  alternative: 弱化为“仿佛遭天谴”或采用较古雅的“被上帝击杀”
  rationale: 原文明确把“击打”与אֱלֹהִים相连，译文应保存这种神学张力；同时，“我们却以为”清楚表明这是众人的判断，不应把误判内容改写成叙述者的直接断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“担当／背负”保留负重意象；分号及“我们却”突出事实与众人误判之间的对照。所有脚注标记均置于主文相应位置。
