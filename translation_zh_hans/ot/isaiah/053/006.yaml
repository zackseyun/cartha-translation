  text: כֻּלָּ֨/נוּ֙ כַּ/צֹּ֣אן תָּעִ֔ינוּ אִ֥ישׁ לְ/דַרְכּ֖/וֹ פָּנִ֑ינוּ וַֽ/יהוָה֙ הִפְגִּ֣יעַ בּ֔/וֹ אֵ֖ת עֲוֺ֥ן כֻּלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/006.yaml
  text: All of us[a], like sheep, have gone astray; each of us has turned to his own way[c][b]; and Yahweh has laid on him the iniquity of us all.
translation:
  language: zh_hans
  text: 我们都如羊走迷了路，各人转向自己的道路；耶和华使我们众人的罪孽都落在他身上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”也可理解为“罪责”，并可延伸指罪责所带来的刑罚；“使……落在他身上”也可译作“使……临到他”或“使……汇聚在他身上”。
    reason: 保留עָוֹן以及הִפְגִּיעַ בּוֹ的语义幅度，避免正文过度限定罪孽落在仆人身上的具体方式。
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: 我们都／我们众人
  rationale: 希伯来文在句首和句末重复此词，形成首尾呼应并强调无一例外；中文分别译作“我们都”和“我们众人”，自然地保留这一范围。
- source_word: כַּצֹּאן
  choice: 如羊
  rationale: 保留原文的明喻，也与“走迷了路”的意象自然衔接。
- source_word: תָּעִינוּ
  choice: 走迷了路
  rationale: 该动词可指迷路、游荡或偏离正道；此译既切合羊的图像，也保留道德层面的含义。
- source_word: אִישׁ לְדַרְכּוֹ פָּנִינוּ
  choice: 各人转向自己的道路
  rationale: אִישׁ在此具有逐一分配的作用；“各人”既体现单数分配意味，也在“我们都”的语境中明确包括所有人。“自己的道路”保留דֶּרֶךְ的道路意象和各自偏行之意。
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 以现代中文圣经语境中通行的专名形式呈现四字神名，区别于称号“主”。
- source_word: הִפְגִּיעַ בּוֹ
  choice: 使……都落在他身上
  rationale: 使役式在本句可表达使罪孽临到、汇聚或落在他身上；此译清楚自然，同时不过度规定其具体机制。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: עָוֹן可涵盖罪行、罪责及其后果。“罪孽”保留其道德分量而不把含义限缩为单纯的罪行、罪责或刑罚。
theological_decisions:
- issue: 仆人承担众人的עָוֹן所表达的代替性意义
  choice: 译为“耶和华却使我们众人的罪孽都落在他身上”
  alternative: “耶和华使我们众人的罪责／刑罚临到他”
  rationale: 原文有明显的代受意味，但没有在本节中系统说明罪行、罪责与刑罚之间的确切机制；正文保留原文的力度和张力，不作超出文本的教义性扩写。
- issue: 分配性单数אִישׁ的表达
  choice: 各人
  alternative: 每个人／各个男人
  rationale: 这里的阳性单数具有分配作用，并因前后“我们都／我们众人”而普遍适用于全体。“各人”在现代汉语中自然、庄重，也没有错误地把范围限制为男性。
- issue: 连接词וַ在末句中的语义关系
  choice: 却
  alternative: 并且／而
  rationale: 上下文从众人各自偏行转到耶和华使众人的罪孽落在“他”身上，含有显著转折；“却”自然呈现这种对照，而不添加因果说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“如羊走迷了路”保留诗性图像；分号呈现原文三个平衡分句。将脚注标在相关末句之后，以同时说明“罪孽”和“使……落在他身上”两处歧义。
