id: ISA.53.5
reference: Isaiah 53:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הוּא֙ מְחֹלָ֣ל מִ/פְּשָׁעֵ֔/נוּ מְדֻכָּ֖א מֵ/עֲוֺנֹתֵ֑י/נוּ מוּסַ֤ר שְׁלוֹמֵ֨/נוּ֙ עָלָ֔י/ו וּ/בַ/חֲבֻרָת֖/וֹ נִרְפָּא לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/005.yaml
  text: But he was pierced because of our transgressions[a]; he was crushed because of our iniquities; the chastisement for our peace was upon him[c][b], and by his wound we are healed.
translation:
  language: zh_hans
  text: 但他因我们的过犯被刺伤[a]，因我们的罪孽被压碎；使我们得平安的惩戒落在他身上[b]，因他所受的伤[c]，我们得医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被刺伤”也可译作“受伤”。这个希伯来词在此可指被刺穿或遭受创伤。
    reason: lexical_alternative
  - marker: b
    text: “平安”也可指“安康”或“完整健全”。
    reason: lexical_alternative
  - marker: c
    text: “他所受的伤”也可译作“他的鞭伤”或“他的伤痕”；希伯来文用的是单数。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: 但他
  rationale: 结合上一节，这是转折，纠正人们对仆人受苦原因的误判；“但”比单纯的“而”更清楚。
- source_word: מְחֹלָל
  choice: 被刺伤
  rationale: 此处与身体受苦及下句“被压碎”平行，最自然地指遭刺穿或受伤；“被刺伤”既保留具体暴力意象，也不把词义限定得过窄。
- source_word: מִפְּשָׁעֵינוּ
  choice: 因我们的过犯
  rationale: 介词 מִן 在这里表达原因；“过犯”保留 פשע 所含越界、悖逆的道德意味。
- source_word: מְדֻכָּא
  choice: 被压碎
  rationale: דכא 表达强烈的摧残；“被压碎”比“受损伤”更充分体现其力度，并与前句形成平行。
- source_word: מֵעֲוֺנֹתֵינוּ
  choice: 因我们的罪孽
  rationale: 介词仍按原因理解；“罪孽”与“过犯”有所区别，也保留 עון 的罪恶与罪责色彩。
- source_word: מוּסַר
  choice: 刑罚
  rationale: מוּסַר 可指管教、惩戒或责罚；在本节代人受苦的语境中，“刑罚”自然体现严厉的惩治，却不额外引入完整的赎罪理论。
- source_word: שְׁלוֹמֵנוּ
  choice: 使我们得平安
  rationale: שָׁלוֹם 可涵盖平安、安康和完整；正文采用常见而直接的“平安”，以注释保留其较宽含义。
- source_word: עָלָיו
  choice: 落在他身上
  rationale: 自然表达刑罚由他承受的图像，比直译“在他身上”更符合现代汉语。
- source_word: וּבַחֲבֻרָתוֹ
  choice: 因他所受的伤
  rationale: חַבּוּרָה 为单数，指击打造成的伤痕或创伤；“所受的伤”自然并保留单数形式。
- source_word: נִרְפָּא לָנוּ
  choice: 我们得了医治
  rationale: 原文形式在结构上不寻常，但结合 לָנוּ，惯用意义是医治临到我们；此译保留完成式所表达的已然结果。
theological_decisions:
- issue: 仆人受苦与众人罪恶的关系
  choice: 用“因我们的过犯……因我们的罪孽”明确表达仆人的受苦是由众人的罪所引起，并由他承受使人得平安的刑罚。
  alternative: 把经文仅理解为榜样性的受苦，或译入经文本身没有明说的完整刑罚代赎体系。
  rationale: 原文清楚地把他的受苦同“我们的”过犯、罪孽、平安和医治相连，具有代人承受的指向；译文保留这种关系，但不超出本节建立更细致的教义公式。
- issue: “平安”与“医治”的范围
  choice: 保留为宽广的恢复性用语，不限定为单纯身体康复或单纯罪得赦免。
  alternative: 只解释为肉体医治、只解释为属灵医治，或缩减为物质兴盛。
  rationale: שָׁלוֹם 与 רפא 在此具有宽广语义，正文应保存其涵盖平安、健全与恢复的张力。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。句式保留希伯来诗歌的平行结构，并用“过犯／罪孽”“平安／医治”等不同词语保存原文的语义层次。所有注脚标记均置于相关正文词组之后。
