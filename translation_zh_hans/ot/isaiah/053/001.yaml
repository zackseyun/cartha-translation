  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ֥י הֶאֱמִ֖ין לִ/שְׁמֻעָתֵ֑/נוּ וּ/זְר֥וֹעַ יְהוָ֖ה עַל מִ֥י נִגְלָֽתָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/001.yaml
  text: Who has believed our report[a], and to whom has the arm of Yahweh been revealed?
translation:
  language: zh_hans
  text: 谁信了我们所传的[a]？雅威的臂膀向谁显露了呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们所听见的”或“我们的消息”。希伯来语可指人所听见、传报或宣讲的内容。
    reason: 保留 שְׁמוּעָה 的词义范围，避免把原文限定为单一的传播方向或信息类别。
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 疑问代词引出反问；“谁”直接、自然，并保留原文的修辞力度。
- source_word: הֶאֱמִין
  choice: 信了
  rationale: אמן 的使役形在此表示“相信、信从”。“信了”简洁地表达原文完成式所指的实际相信。
- source_word: לִשְׁמֻעָתֵנוּ
  choice: 我们所传的
  rationale: שְׁמוּעָה 可指听见的事、传闻、消息或所传的内容。结合“相信”的宾语关系，“我们所传的”在现代汉语中自然，也保留其作为传报内容的语境；其他可能含义列入脚注。
- source_word: וּזְרוֹעַ
  choice: 臂膀
  rationale: זְרוֹעַ 本义为“手臂、臂膀”，在先知书中常象征能力，尤其是施行拯救或审判的能力。正文保留具体比喻，不直接释作“能力”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: עַל מִי
  choice: 向谁
  rationale: עַל 可表示“在……之上”，但与“显露”搭配时，“向谁”更符合现代汉语，清楚表达显现所面向的对象。
- source_word: נִגְלָתָה
  choice: 显露了
  rationale: גלה 的被动形表示“被揭示、显露”。汉语“显露了”既保留被显明的意义，也避免生硬的被动句式。
theological_decisions:
- issue: “雅威的臂膀”的比喻意义
  choice: 正文保留“臂膀”这一意象
  alternative: 雅威的能力
  rationale: 该意象在圣经中承载上帝彰显大能、施行拯救与审判的丰富关联。直接译成“能力”会消除原文意象并缩窄互文空间。
- issue: שְׁמוּעָה 的语义范围
  choice: 译作“我们所传的”，并以脚注保留其他可能含义
  alternative: 我们所听见的；我们的消息
  rationale: 该词既可侧重“所听见的”，也可指“传来的消息”或“所传的信息”。上下文并未完全排除这些语义，因此正文采用自然且合乎语境的表达，脚注保留原文的宽广含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“臂膀”比“膀臂”更符合当代语序，同时保留传统圣经意象；两个问句维持原文平行的反问结构。
