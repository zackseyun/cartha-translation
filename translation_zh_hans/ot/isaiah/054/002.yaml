  text: הַרְחִ֣יבִי מְק֣וֹם אָהֳלֵ֗/ךְ וִ/ירִיע֧וֹת מִשְׁכְּנוֹתַ֛יִ/ךְ יַטּ֖וּ אַל תַּחְשֹׂ֑כִי הַאֲרִ֨יכִי֙ מֵֽיתָרַ֔יִ/ךְ וִ/יתֵדֹתַ֖יִ/ךְ חַזֵּֽקִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/002.yaml
  text: Enlarge the place of your tent[a], and let the curtains of your dwellings be stretched out; do not hold back. Lengthen your cords[b], and strengthen your stakes.
translation:
  language: zh_hans
  text: 要扩张你帐棚的地方，张开你居所的幔子；不要吝惜[a]。要拉长你的绳索，使你的橛子坚固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不要吝惜”也可译为“不要保留”或“不要拦阻”。“幔子”指帐棚的布幔；“橛子”指固定帐棚的木桩或钉桩。
    reason: 说明אַל־תַּחְשֹׂכִי的词义幅度，并交代帐棚器物的文化背景。
lexical_decisions:
- source_word: הַרְחִיבִי
  choice: 要扩张
  rationale: 使役式第二人称阴性单数命令，意为“使之宽阔、扩张”；用“要扩张”保留对锡安的直接命令语气。
- source_word: מְקוֹם אָהֳלֵךְ
  choice: 你帐棚所在的地方
  rationale: 直译其“地方/空间”与单数“帐棚”的结构，并保留具体的帐棚意象。
- source_word: וִירִיעוֹת מִשְׁכְּנוֹתַיִךְ
  choice: 你居所的幔子
  rationale: יריעות指帐棚的布幔；משכנות为复数“居所”。“幔子”在帐棚语境中自然且具体。
- source_word: יַטּוּ
  choice: 张开
  rationale: 使役式未完成时第三人称复数在此有祈使意味；汉语承接前面的命令，以“把……张开”自然表达使帐幔伸展。
- source_word: אַל תַּחְשֹׂכִי
  choice: 不要限制
  rationale: חשׂך可指扣留、节省或抑制。此处不明确说明所限制的对象，故保留原文简短而开放的劝令，不补入解释。
- source_word: הַאֲרִיכִי מֵיתָרַיִךְ
  choice: 要放长你的绳索
  rationale: 使役式命令意为“使长”；מיתר在帐棚语境中指固定帐棚的绳索。
- source_word: וִיתֵדֹתַיִךְ חַזֵּקִי
  choice: 加固你的橛子
  rationale: יתד指帐棚橛；חזק的加强式命令意为使坚固。“加固”准确表达固定扩张后帐棚的动作。
theological_decisions:
- issue: 锡安的帐棚与居所意象
  choice: 在正文中保留帐棚、幔子、绳索和橛子的具体比喻
  alternative: 解释性译为扩大家园、为更多居民腾出地方
  rationale: 原文以扩建帐棚的一连串命令描绘锡安未来的扩展；不在本节中把比喻直接化约为人口增长或复兴，以保留先知诗歌的意象及其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用连续的“要……”保留希伯来文阴性单数命令的催促感；中文不标语法性别。正文维持帐棚扩张的诗性画面，脚注仅处理词义歧义和器物说明。
