  text: בְּ/שֶׁ֣צֶף קֶ֗צֶף הִסְתַּ֨רְתִּי פָנַ֥/י רֶ֨גַע֙ מִמֵּ֔/ךְ וּ/בְ/חֶ֥סֶד עוֹלָ֖ם רִֽחַמְתִּ֑י/ךְ אָמַ֥ר גֹּאֲלֵ֖/ךְ יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/008.yaml
  text: In a surge of wrath I hid my face from you for a moment[a], but with everlasting lovingkindness I have had compassion on you, says Yahweh[b], your Redeemer.
translation:
  language: zh_hans
  text: “我在一阵暴怒中，暂时向你掩面[a]；但我以永远的慈爱[b]怜悯你。”耶和华——你的救赎主——说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在一阵暴怒中”也可译作“在怒气涌出时”或“在怒气突然爆发时”。这里的希伯来语表达罕见，用来加强怒气突发而强烈的意味。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”所译的希伯来词也含有忠贞、怜悯和守约之爱的意味；也可译作“永远不变的爱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁצֶף קֶצֶף
  choice: 我怒气迸发
  rationale: שֶׁצֶף 是罕见词，与“怒气”连用，强调怒气如突发、涌出一般强烈。“怒气迸发”保留了原文紧凑有力的诗歌表达，同时不把罕见词的具体意象解释得过死。
- source_word: הִסְתַּרְתִּי פָנַי
  choice: 向你掩面
  rationale: 直译“隐藏我的脸”，是希伯来语中表示收回眷顾或临在的惯用说法。“向你掩面”既保留原文意象，也符合庄重自然的现代汉语。
- source_word: רֶגַע
  choice: 一时
  rationale: 表示极短的一段时间；“一时”简洁自然，并与下句“永远”形成鲜明对照。
- source_word: וּבְחֶסֶד עוֹלָם
  choice: 但我以永远的慈爱
  rationale: חֶסֶד 涵盖慈爱、怜悯、忠贞和守约的情义。“慈爱”是简洁而宽广的中文表达，不把其盟约内涵过度明说；“永远”准确呈现 עוֹלָם。
- source_word: רִחַמְתִּיךְ
  choice: 怜悯你
  rationale: רחם 表示深切的怜悯与慈悲。“怜悯你”准确、凝练，并保留神主动施予慈悲的宣告语气。
- source_word: גֹּאֲלֵךְ
  choice: 你的救赎主
  rationale: גֹּאֵל 可指履行亲属责任、赎回或解救的人。“救赎主”保留其称号性质与丰富内涵，而不在正文中过度限定为“至近亲属救赎者”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式呈现四字神名，避免用“主”这一称号取代原文中的名字。
theological_decisions:
- issue: 如何表达 חֶסֶד 的盟约内涵
  choice: 永远的慈爱
  alternative: 永远不变的爱；永远守约的慈爱
  rationale: 原词兼具爱、怜悯、忠贞和盟约信实等含义。“慈爱”让这些含义保持开放；若译作“守约的慈爱”，虽能凸显盟约背景，却会把原文未明说的关系层面直接加入正文。
- issue: 神暂时发怒与永远施慈爱的张力
  choice: 保留“一时”与“永远”的直接对照
  alternative: 将前半句解释为神仅仅看似离弃
  rationale: 原文明确陈述神在怒气中掩面，同时又宣告其慈爱永远长存。译文不削弱其中的神学张力，也不把“掩面”改写成主观感受。
- issue: 如何呈现神名 יְהוָה
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用专有神名而非普通称号。采用中文通行的“耶和华”保留其专名功能；“雅威”是另一种可能的音译。
translation_notes:
  register: 采用庄重、凝练而易懂的现代标准汉语，保留希伯来诗句中“一时”与“永远”的强烈对照。用“掩面”保存原文意象，用“耶和华”呈现神名；标点与引语结构按自然中文调整。
