id: ISA.54.6
reference: Isaiah 54:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי כְ/אִשָּׁ֧ה עֲזוּבָ֛ה וַ/עֲצ֥וּבַת ר֖וּחַ קְרָאָ֣/ךְ יְהוָ֑ה וְ/אֵ֧שֶׁת נְעוּרִ֛ים כִּ֥י תִמָּאֵ֖ס אָמַ֥ר אֱלֹהָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/006.yaml
  text: For Yahweh has called you like a wife forsaken and grieved in spirit[a], like a wife of youth when she is rejected[b], says your God.
translation:
  language: zh_hans
  text: 因为雅威召唤了你，如同被离弃、心灵忧伤的妻子[a]；又如同年轻时的妻子被厌弃[b]。你的上帝如此说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妻子”或译“女人”。希伯来语אִשָּׁה可指“女人”或“妻子”；这里的婚姻语境较支持“妻子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“如同年轻时的妻子在被厌弃时”。本句希伯来语十分凝练；“被厌弃”也可译为“被拒绝”。有些解释将这句话理解为带反问意味，但原文没有明确的疑问标记。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的安慰说明理由；“因为”符合本节在语篇中的解释作用。
- source_word: כְאִשָּׁה
  choice: 仿佛你是……妻子
  rationale: אִשָּׁה既可指“女人”，也可指“妻子”；本节以婚姻关系为喻，因此正文采用“妻子”，同时用脚注保留词义上的另一可能。
- source_word: עֲזוּבָה
  choice: 被离弃
  rationale: 保留关系破裂、被撇下的分量，也适合先知文学的庄重语体。
- source_word: וַעֲצוּבַת רוּחַ
  choice: 心灵忧伤
  rationale: 自然表达内在的痛苦，同时保留רוּחַ所指向的内在生命层面。
- source_word: קְרָאָךְ
  choice: 召唤了你
  rationale: 以完成体表达已经发生且对当下仍有效的行动；不擅自加入原文没有明说的“回来”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: וְאֵשֶׁת נְעוּרִים
  choice: 是年轻时所娶……的妻子
  rationale: 用现代汉语自然呈现“青春年日之妻”的结构，保留在年轻时缔结婚姻的意象。
- source_word: כִּי תִמָּאֵס
  choice: 却遭厌弃
  rationale: תִמָּאֵס为被动意义，可表示被拒绝或被轻视；正文选“遭厌弃”兼顾关系上的拒绝与情感上的鄙弃，并以脚注说明紧凑句法的其他理解。
- source_word: אָמַר אֱלֹהָיִךְ
  choice: 你的上帝如此说
  rationale: 采用汉语先知宣告的自然表达，并保留“你的上帝”所体现的关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，正文以“雅威”音译，保留圣约之神的专名，不用称号取代。
- issue: 锡安的婚姻隐喻
  choice: 直接保留“妻子”的婚姻意象
  alternative: 泛化为“女人”，或改写为“人民／城”
  rationale: 原文借婚姻关系描写锡安与上帝的关系；直接保留这一隐喻，既维持先知话语的力量，也不加入后来的教义解释。
- issue: כִּי תִמָּאֵס的句法与语气
  choice: 理解为描述年轻时所娶之妻“却遭厌弃”
  alternative: 理解为“当她被拒绝时”，或带反问意味的“年轻时所娶的妻子岂会被厌弃？”
  rationale: 希伯来语短句高度凝练，כִּי的功能存在解释空间。正文采用符合上下文婚姻隐喻的让步性表达，脚注保留时间性和反问性理解，避免把歧义悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“召唤”保留קרא的直接动作，不增译“回来”；“心灵忧伤”兼顾自然汉语与原文רוּחַ的内在意象。正文保持婚姻隐喻，并以脚注呈现词义和句法上的真实歧义。
