id: ISA.54.1
reference: Isaiah 54:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רָנִּ֥י עֲקָרָ֖ה לֹ֣א יָלָ֑דָה פִּצְחִ֨י רִנָּ֤ה וְ/צַהֲלִי֙ לֹא חָ֔לָה כִּֽי רַבִּ֧ים בְּֽנֵי שׁוֹמֵמָ֛ה מִ/בְּנֵ֥י בְעוּלָ֖ה אָמַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/001.yaml
  text: Sing[a], barren woman, you who have not given birth; break forth into singing and shout for joy, you who have not been in labor. For the children of the desolate woman are more than the children of the married woman, says Yahweh.
translation:
  language: zh_hans
  text: '“不能生育、未曾生产的女子啊，欢唱吧！


    未曾经历产痛的女子啊，放声歌唱，欢呼吧！


    因为荒凉的女子的儿女，


    比有丈夫的女子的儿女更多[a]。”


    雅威说。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“荒凉的女子的儿女众多，胜过有丈夫的女子的儿女。”希伯来文以简洁的形式表达数量比较。
    reason: 说明比较结构的译法，并保留“众多／更多”之间的表达差异。
lexical_decisions:
- source_word: רָנִּי
  choice: 要欢唱
  rationale: 这是阴性单数命令式，呼召受话者发出喜乐的歌声；“欢唱”兼顾歌唱与欢欣之意。
- source_word: עֲקָרָה
  choice: 不能生育的女子
  rationale: 明确表达女性不能生育的处境，较“石女”更符合现代普通话，也避免其可能带有的贬抑色彩。
- source_word: לֹא יָלָדָה
  choice: 未曾生产
  rationale: 虽在形式上是第三人称阴性单数，这里修饰被直接呼唤的女子；译文依汉语呼语结构自然呈现。
- source_word: פִּצְחִי רִנָּה
  choice: 要放声歌唱
  rationale: פצח表达突然迸发、放声而出的动作，רנה指响亮而喜乐的歌声或呼声；合译保留诗歌的强烈动感。
- source_word: וְצַהֲלִי
  choice: 欢呼吧
  rationale: 该动词表示高声呼喊，语境带有喜乐色彩；“欢呼”同时传达音量和欢庆意味。
- source_word: לֹא חָלָה
  choice: 未曾经历产痛
  rationale: 该表达在此指分娩时的痛苦或挣扎；“经历产痛”准确且为现代读者易懂。
- source_word: כִּי רַבִּים ... מִן
  choice: 因为……比……更多
  rationale: רבים与比较用的מן结合，在本句中构成数量比较；汉语明确补出“比……更多”，同时以脚注说明希伯来文的紧凑表达。
- source_word: בְּנֵי שׁוֹמֵמָה
  choice: 荒凉女子的儿女
  rationale: בנים在集合意义上可泛指儿女；שוממה描写荒废、凄凉或孤寂的女性形象。“荒凉女子”保留先知诗歌中人与城交叠的意象，不径自限定为被丈夫遗弃。
- source_word: מִבְּנֵי בְעוּלָה
  choice: 比有丈夫女子的儿女
  rationale: בעולה指已与丈夫结合、处于婚姻关系中的女子；“有丈夫的女子”贴近原文，并保留其与“荒凉女子”的对照。
- source_word: אָמַר יְהוָה
  choice: 这是雅威说的
  rationale: 按先知宣告公式译为自然的现代汉语，并以“雅威”呈现原文中的神圣名号。
theological_decisions:
- issue: יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以常见的现代汉语音译保留专名性质，不将其替换为头衔。
- issue: “荒凉女子”的所指
  choice: 保留女性化的荒凉意象
  alternative: 明确译作被遗弃的妻子或荒废的耶路撒冷
  rationale: 本节本身没有把שוממה明确限定为婚姻中的被弃者，也未在句内直接点名锡安；译文保留诗性张力，避免提前解释隐喻。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，以两个呼语和三个喜乐命令形成递进；按希伯来诗歌分行。避免使用较陈旧且可能带贬义的“石女”，并保留“荒凉女子”这一不完全解释的诗性称谓。
