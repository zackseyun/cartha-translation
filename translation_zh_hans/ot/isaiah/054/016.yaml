  text: הן אָֽנֹכִי֙ בָּרָ֣אתִי חָרָ֔שׁ נֹפֵ֨חַ֙ בְּ/אֵ֣שׁ פֶּחָ֔ם וּ/מוֹצִ֥יא כְלִ֖י לְ/מַעֲשֵׂ֑/הוּ וְ/אָנֹכִ֛י בָּרָ֥אתִי מַשְׁחִ֖ית לְ/חַבֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/016.yaml
  text: Look[a], I myself have created the craftsman who blows on the fire of coals and brings out a weapon for his work[c][b]; and I myself have created the destroyer to destroy.
translation:
  language: zh_hans
  text: 看哪，是我造了那吹旺炭火、造出供工作使用的器具的工匠[a][b][c]；也是我造了毁灭者，为要毁坏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “工匠”也可译作“铁匠”。原词可泛指工匠，但这里吹炭火、制造器具的情景表明是金属匠。
    reason: lexical_alternative
  - marker: b
    text: “器具”也可译作“兵器”或“物件”。原词含义较宽；这里的上下文可能特别指用于争战的器械。
    reason: lexical_alternative
  - marker: c
    text: “供工作使用”对应原文“为其工作（或用途）”。原文的阳性单数后缀可能指工匠，也可能指所造的器具；译文不在正文中判定。
    reason: alternative_reading
lexical_decisions:
- source_word: הן
  choice: 看哪
  rationale: 这是引起注意并加强语气的语气词；“看哪”庄重、明白，也保留了原文的指示力量。
- source_word: אָנֹכִי / וְאָנֹכִי
  choice: 是我／也是我
  rationale: 独立人称代词在两处都带有强调意味；用“是我……也是我……”自然地再现重复和强调。
- source_word: בָּרָאתִי
  choice: 造了
  rationale: 直接表达 ברא 的创造、造作之意，并保留已完成行动的语气。
- source_word: חָרָשׁ
  choice: 工匠
  rationale: 该词可泛指工匠；上下文显示他从事金属锻造，但正文保留词义宽度，脚注说明“铁匠”这一具体译法。
- source_word: נֹפֵחַ בְּאֵשׁ פֶּחָם
  choice: 吹旺炭火
  rationale: 以自然的现代汉语呈现工匠向炭火吹气、使火旺盛的具体动作。
- source_word: וּמוֹצִיא כְלִי
  choice: 造出……兵器
  rationale: מוֹצִיא 在此指制作并产出；כְלִי 词义较宽，可指器具、物件或兵器，但结合毁灭者的语境，“兵器”最为贴切。
- source_word: לְמַעֲשֵׂהוּ
  choice: 供其作工
  rationale: “其”尽量保留阳性单数后缀可能指工匠、也可能指所造兵器的歧义，不在正文中强行判定。
- source_word: מַשְׁחִית
  choice: 毁灭者
  rationale: 将使役分词的名词性用法直接译出，指实施毁灭的人。
- source_word: לְחַבֵּל
  choice: 为要毁坏
  rationale: “为要”明确表达介词 לְ 与不定式所表示的目的；“毁坏”直接保留其破坏、摧毁的含义。
theological_decisions:
- issue: 上帝创造工匠和毁灭者
  choice: 直译两次“是我造了”，明确把工匠和毁灭者都置于上帝的创造行动之下。
  alternative: 弱化第二句，使毁灭者不直接属于上帝的创造行动。
  rationale: 希伯来文对两者重复使用强调代词 אָנֹכִי 和动词 בָּרָאתִי；译文应保留这一神学张力，而不另加解释来缓和它。
- issue: 毁灭者被造的目的
  choice: 译作“为要毁坏”。
  alternative: 译作较弱的结果表达，如“以致造成破坏”。
  rationale: לְחַבֵּל 最自然地表达目的；正文保留原文直接的目的关系，不替文本作神义论上的化解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“是我……也是我……”保留原文的平行结构和神圣宣告的强调；“吹旺炭火”呈现具体画面，同时避免生硬直译。
