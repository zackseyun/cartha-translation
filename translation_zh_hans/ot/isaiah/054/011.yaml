    rationale: פּוּךְ通常指含锑的黑色粉末、眼妆颜料或相关矿物，而非普通意义的“石头”。在本节的建筑意象中其具体功能仍有争议；“锑粉”配合脚注更贴近词义，也避免把材料性质定死为“石”。
  - severity: low
    issue: “困苦的女子”可能使受话者显得过于泛指。
    rationale: 原文阴性单数确实容许女性化称呼，但上下文是人格化的锡安／耶路撒冷。改以形容词性呼语可保留语法性别和人格化效果，又不暗示这是一位未具名的普通女子。
