  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עֲנִיָּ֥ה סֹעֲרָ֖ה לֹ֣א נֻחָ֑מָה הִנֵּ֨ה אָנֹכִ֜י מַרְבִּ֤יץ בַּ/פּוּךְ֙ אֲבָנַ֔יִ/ךְ וִ/יסַדְתִּ֖י/ךְ בַּ/סַּפִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/011.yaml
  text: O afflicted one[a], storm-tossed and not comforted, behold[b], I am setting your stones in antimony and laying your foundations with sapphires.
translation:
  language: zh_hans
  text: 受困苦、遭风暴击打、未得安慰的啊，看哪，我要用锑粉[a]镶嵌你的石头，以蓝宝石[b]奠定你的根基。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “锑粉”指一种含锑的黑色粉末或颜料。此处大概指安放石头所用的深色灰泥或装饰性嵌料，但具体用途不能确定。
    reason: cultural_note
  - marker: b
    text: 或译“青金石”。这里的希伯来词传统上译作“蓝宝石”，但可能指一种与现代蓝宝石不同的蓝色宝石。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנִיָּה
  choice: 困苦的女子
  rationale: 阴性单数形式在语境中直接称呼被人格化的锡安／耶路撒冷；“困苦”涵盖受苦、受压的处境，“女子”使阴性拟人称呼在中文中清楚自然。
- source_word: סֹעֲרָה
  choice: 饱受风暴侵袭
  rationale: 该形式描绘持续遭风暴冲击的状态；此译保留风暴意象，也符合现代汉语表达。
- source_word: לֹא נֻחָמָה
  choice: 无人安慰
  rationale: 希伯来文直义为“未得安慰”；中文以“无人安慰”自然传达被动而未蒙安慰的处境，不指定安慰者。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意并加强语气的功能，庄重而为现代读者所熟悉。
- source_word: אָנֹכִי מַרְבִּיץ
  choice: 我要……铺设
  rationale: 分词结构在“看哪，我”之后表达生动、迫近的神圣行动；中文用“我要”自然呈现这种将来指向。“铺设”适合建筑语境。
- source_word: בַּפּוּךְ
  choice: 用锑石
  rationale: פּוּךְ通常指锑或黑色眼妆矿物；建筑比喻中的具体用途不确定，主文保留矿物名称，并以脚注说明可能是深色嵌料或灰泥。
- source_word: אֲבָנַיִךְ
  choice: 你的石头
  rationale: 保留普通的建筑用词“石头”，不把它过度解释为珠宝；华美之意由周围材料体现。
- source_word: וִיסַדְתִּיךְ
  choice: 奠立你的根基
  rationale: יסד意为奠基、建立；原文以第二人称受词表达“为你奠基”，中文明确说“你的根基”，兼顾语义与建筑意象。
- source_word: בַּסַּפִּירִים
  choice: 用蓝宝石
  rationale: סַפִּיר传统上译作蓝宝石，但古代所指可能是青金石；正文采用读者熟悉的传统名称，脚注保留矿物辨识的不确定性。
theological_decisions:
- issue: 受话者的身份
  choice: 将其译作阴性人格化的“困苦的女子”，指向锡安／耶路撒冷。
  alternative: 泛指一名受苦女子，或更抽象地指圣约群体。
  rationale: 本节的阴性单数形式及《以赛亚书》54章上下文支持人格化的锡安／耶路撒冷；译文保留这一形象，但不加入额外的教会论认定。
- issue: 重建材料的具体性质
  choice: 保留锑石和蓝宝石的具体矿物意象，同时用脚注说明辨识和建筑用途的不确定性。
  alternative: 解释性地译为“黑色灰泥”和“青金石”。
  rationale: 原文营造华美重建的应许，却没有充分说明פּוּךְ在建筑中的功能，סַפִּיר的现代矿物对应也不确定；不宜在正文中消除这些张力。
translation_notes:
  register: 采用现代、庄重、易懂的先知性语言。“看哪”保留宣告力度；前半句以短句呈现受苦处境，后半句以平行建筑意象表达神亲自重建的应许。所有脚注标记均已置于正文相应词语之后。
