  text: כִּ֤י הֶֽ/הָרִים֙ יָמ֔וּשׁוּ וְ/הַ/גְּבָע֖וֹת תְּמוּטֶ֑נָה וְ/חַסְדִּ֞/י מֵ/אִתֵּ֣/ךְ לֹֽא יָמ֗וּשׁ וּ/בְרִ֤ית שְׁלוֹמִ/י֙ לֹ֣א תָמ֔וּט אָמַ֥ר מְרַחֲמֵ֖/ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/010.yaml
  text: For the mountains may depart and the hills may be shaken[a], but my steadfast love will not depart from you, and my covenant of peace will not be shaken, says Yahweh[c][b], who has compassion on you.
translation:
  language: zh_hans
  text: 因为即使大山移走，丘陵动摇，我对你的忠贞之爱也不会离开你；我的平安之约也不会动摇。怜悯你的雅威说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出对前述应许的根据和保证，保留其解释、因果作用。
- source_word: הֶהָרִים יָמוּשׁוּ
  choice: 大山纵然移走
  rationale: מוּשׁ表示离开或被移去；用让步式“纵然”自然表达这里以天地失稳作出的假设，并与后文“不离开”形成对应。
- source_word: וְהַגְּבָעוֹת תְּמוּטֶנָה
  choice: 丘陵即使动摇
  rationale: מוֹט表示失去稳定、摇动；“动摇”既自然，又与后文盟约“不会动摇”保留原文的动词复现。
- source_word: וְחַסְדִּי
  choice: 我对你的忠贞之爱
  rationale: חֶסֶד兼有慈爱、忠诚和守约不变的内涵；“忠贞之爱”避免仅表达情感，也不把词义缩窄为抽象的盟约术语。
- source_word: מֵאִתֵּךְ לֹא יָמוּשׁ
  choice: 也不会离开你
  rationale: 清楚表达不会与阴性单数受话者锡安分离，也以自然汉语呼应前面的מוּשׁ。
- source_word: וּבְרִית שְׁלוֹמִי
  choice: 我的平安之约
  rationale: 保留בְּרִית的“约”和שָׁלוֹם的核心译法“平安”；脚注说明后者还包括完整、安康等较宽含义。
- source_word: לֹא תָמוּט
  choice: 不会动摇
  rationale: 与前半句的מוֹט采用同一译词，保留原文关于丘陵和盟约的鲜明对照。
- source_word: מְרַחֲמֵךְ
  choice: 怜悯你的
  rationale: 分词描述雅威是持续向锡安施怜悯的那一位；汉语定语结构简洁自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，保留其作为以色列之神专名的性质，而不以称号代替。
theological_decisions:
- issue: חֶסֶד的译法
  choice: 忠贞之爱
  alternative: 慈爱；守约之爱
  rationale: 该词在此同时包含爱、怜悯和持久忠诚。“忠贞之爱”保留这些张力，又不把它限定为某一宗派性的盟约公式。
- issue: בְּרִית שְׁלוֹמִי的范围
  choice: 我的平安之约
  alternative: 我的安康之约；赐你完好福祉的约
  rationale: “平安之约”保留传统且可识别的表达，同时通过脚注提示שָׁלוֹם不只指没有冲突，也包含完整、安康与福祉。
- issue: יְהוָה的呈现
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；音译“雅威”保留专名性质，避免以称号取代。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“纵然……即使……”呈现宇宙秩序即便失稳的让步图景；两个“动摇”保留מוֹט的原文复现。“这是……说的”自然呈现先知宣告公式。所有代词依上下文指向被拟人化为阴性单数的锡安，但汉语不额外显明语法性别。
