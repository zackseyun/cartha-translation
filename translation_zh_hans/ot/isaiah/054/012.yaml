base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/012.yaml
  text: And I will make your pinnacles of ruby[a], your gates of sparkling stone[d][c][b], and all your boundary walls of precious stones.
translation:
  language: zh_hans
  text: 我要用红宝石[a]砌你的城垛[b]，用闪耀的宝石[c]造你的城门，又使你所有的边界[d]都用珍贵的宝石砌成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “红宝石”所译的希伯来词可能指一种红色或光彩夺目的宝石，也可译作“石榴石”或“红碧玉”。
    reason: lexical_alternative
  - marker: b
    text: “城垛”所译的希伯来词十分罕见，也可能指“尖塔”或“窗户”。
    reason: lexical_alternative
  - marker: c
    text: “闪耀的宝石”指一种明亮或如火发光的宝石；确切种类无法确定。
    reason: lexical_alternative
  - marker: d
    text: “边界”也可译作“疆界”或“地域”；在这里的建城意象中，也可能特指四围的墙垣。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: 我要用……砌／造／筑
  rationale: שׂים可表示安放、设置或造成；结合城邑建造的意象，按各宾语自然译为“砌、造、筑”，并保留上帝亲自重建的语气。
- source_word: כַּדְכֹד
  choice: 红宝石
  rationale: 所指宝石无法确定，可能是石榴石或红碧玉；“红宝石”简洁地表达其可能具有的红色和光彩，并以脚注说明不确定性。
- source_word: שִׁמְשֹׁתַיִךְ
  choice: 你的城垛
  rationale: 这是罕见词，可能指城垛、尖塔或窗户。上下文连续描绘城门和边界等城邑构造，“城垛”较自然，但不排除其他解释。
- source_word: וּשְׁעָרַיִךְ
  choice: 你的城门
  rationale: שַׁעַר在城邑语境中通常指城门。
- source_word: לְאַבְנֵי אֶקְדָּח
  choice: 用闪耀的宝石
  rationale: אֶקְדָּח可能指明亮如火的某种宝石，确切矿物不明；“闪耀的宝石”保留其光亮意象而不作过度鉴定。
- source_word: וְכָל גְּבוּלֵךְ
  choice: 你四围的边界
  rationale: גְּבוּל可指边界、疆界或地域。此处采用较宽泛的“边界”，避免把原文明确限定为城墙；“四围”自然传达כָל所涵盖的整体范围。
- source_word: לְאַבְנֵי חֵפֶץ
  choice: 用珍贵的宝石
  rationale: חֵפֶץ含可喜爱、可珍视之意；在宝石语境中，“珍贵的宝石”准确而自然。
