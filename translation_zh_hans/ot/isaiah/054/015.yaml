base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/015.yaml
  text: Look[a], if anyone stirs up strife, it is not from me[c][b]; whoever stirs up strife with you will fall before you.
translation:
  language: zh_hans
  text: 看哪，必有人聚集来攻击你，却不出于我；谁聚集来攻击你，谁必倒在你面前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚集”所译的希伯来语动词也可表示“寄居”；本节在上下文中可指敌对者聚集。末句较直译可作“必倒向你”或“必倒在你身上”；也可理解为“因你而倒下”。上下文侧重敌对者的失败。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 用现代而庄重的提示语保留原文引人注意并加强断言的作用。
- source_word: גּוֹר יָגוּר / גָר
  choice: 聚集起来攻击
  rationale: גור本可表示寄居或聚集；本节及上下文谈到敌对势力，因此译出敌意。前半句的同源结构具有加强语气的作用，中文以“聚集起来”自然表达，并在后半句重复，以对应原文复现同一词根。
- source_word: אֶפֶס מֵאוֹתִי
  choice: 那绝不是出于我
  rationale: אֶפֶס在此加强否定，מֵאוֹתִי表示来源或授意；该译法否认敌对行动源于耶和华，同时不把含义缩窄为单纯的行动协助。
- source_word: מִי
  choice: 凡……的
  rationale: 此处具有不定关系代词的功能，中文用“凡……的”表达“无论是谁”的概括意味。
- source_word: אִתָּךְ
  choice: 攻击你
  rationale: 字面为“与你”，但结合גור的敌对语境，中文需明确其对抗关系；不另译“与你”可避免生硬重复。
- source_word: עָלַיִךְ יִפּוֹל
  choice: 必倒在你面前
  rationale: נפל与על的组合在此有多种可能理解。上下文强调锡安蒙保护和敌对者失败，主文用自然中文表达其败亡，却以脚注保留“倒向／倒在你身上”等较字面的可能性。
theological_decisions:
- issue: 敌对锡安的聚集是否出于上帝的差遣或授权
  choice: 明确译为“绝不是出于我”
  alternative: “不是由我帮助”或“在我以外”
  rationale: 原文否认其来源于说话者；上下文也强调保护与伸冤。译文不把否定缩减为上帝只是不提供协助。
- issue: 末句描述敌人的败亡、归附，还是成功扑向锡安
  choice: 主文译作“必倒在你面前”，表达敌对者的失败
  alternative: “必倒向你”“必倒在你身上”“必因你而倒下”，也有人据此理解为投向或归附于你
  rationale: עָלַיִךְ יִפּוֹל在句法上存有张力；上下文不支持敌人成功压倒锡安。主文按语境表达败亡，脚注保留介词结构带来的歧义。
translation_notes:
  register: 采用现代标准书面汉语，语气庄重但不古奥。“看哪”保留先知话语的强调感；“聚集起来攻击”兼顾原词的聚集义和语境中的敌意。各处以阴性单数“你”指锡安／耶路撒冷，中文不显性标注性别。
