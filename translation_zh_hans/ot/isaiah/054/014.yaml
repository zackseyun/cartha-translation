base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/014.yaml
  text: In righteousness you will be established[a]; you will be far from oppression, for you will not fear, and from terror[b], for it will not come near you.
translation:
  language: zh_hans
  text: 你必在公义中得以坚立[a]；要远离欺压，因为你必不惧怕；也要远离惊恐[b]，因为它必不临近你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必凭公义得以坚立。”希伯来语介词既可表示所处的范围，也可表示所凭借的方式。
    reason: lexical_alternative
  - marker: b
    text: “惊恐”也可译作“毁灭”或“倾覆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּצְדָקָה
  choice: 在公义中
  rationale: 介词 ב 可表示范围或凭借；“在公义中”保留这种紧凑表达及其可能的双重含义，也不把 צְדָקָה 限定为单纯的司法正义。
- source_word: תִּכּוֹנָנִי
  choice: 你必……得以坚立
  rationale: 保留 כון 在此被动、结果性的语义，表达锡安将被稳固建立。
- source_word: רַחֲקִי מֵעֹשֶׁק
  choice: 你必远离欺压
  rationale: רַחֲקִי 形态上可作阴性单数祈使式，但在此应许语境中也可呈现为结果性的劝告或宣告；“你必远离”顺应上下文，同时避免把语气过度定死。עֹשֶׁק 译作“欺压”，涵盖压迫、剥削和暴力侵害。
- source_word: כִּי לֹא תִירָאִי
  choice: 不再惧怕
  rationale: כִּי 可引出原因或说明；此处用“不再惧怕”自然表达将来的保证，并与前句紧密衔接。
- source_word: מְחִתָּה
  choice: 惊恐
  rationale: 该词可指恐怖、毁灭或崩溃；与“惧怕”及“临近你”并列时，“惊恐”较能保留威胁所造成的恐惧感，同时以脚注列出事件性译法。
- source_word: כִּי לֹא תִקְרַב אֵלָיִךְ
  choice: 它必不临近你
  rationale: 阴性单数动词可自然回指 מְחִתָּה；“它必不临近你”保留原文的拟人化意象。
theological_decisions:
- issue: 受话者及其语法性别
  choice: 以第二人称“你”保留对阴性单数受话者的直接称呼，由上下文指向锡安或耶路撒冷。
  alternative: 在正文补出“锡安”或“耶路撒冷”。
  rationale: 本节原文没有重述受话者名称，因此不在正文增补，以保存原有话语衔接。
- issue: בִּצְדָקָה 所表达的关系
  choice: 译为“在公义中”，正文保留范围义，脚注说明工具或凭借义。
  alternative: 译为“凭公义”。
  rationale: 原文介词可以表达范围，也可以表达凭借；不应在正文中排除其中一种可能。
- issue: רַחֲקִי 的语气
  choice: 按上下文译为将来保证“你必远离”。
  alternative: 按形态直译为命令“你要远离”。
  rationale: 该形式通常可识别为阴性单数祈使式，但本节整体是复兴与安全的应许；正文采用自然的应许语气，同时承认形态上的命令可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公义”“坚立”保留先知书语体及神学张力；分号和短分句呈现希伯来诗句的平行结构。
