source:
  edition: WLC
  text: אַל תִּֽירְאִי֙ כִּי לֹ֣א תֵב֔וֹשִׁי וְ/אַל תִּכָּלְמִ֖י כִּ֣י לֹ֣א תַחְפִּ֑ירִי כִּ֣י בֹ֤שֶׁת עֲלוּמַ֨יִ/ךְ֙ תִּשְׁכָּ֔חִי וְ/חֶרְפַּ֥ת אַלְמְנוּתַ֖יִ/ךְ לֹ֥א תִזְכְּרִי עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/004.yaml
  text: Do not fear[a], for you will not be put to shame; and do not be humiliated, for you will not be disgraced. For you will forget the shame of your youth[b], and you will remember the reproach of your widowhood no more.
translation:
  language: zh_hans
  text: '不要惧怕[a]，因为你必不蒙羞[b]；

    不要羞惭，因为你必不受辱。


    你必忘记年轻时的羞耻，

    也不再记得守寡时所受的凌辱。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要害怕。”
    reason: lexical_alternative
  - marker: b
    text: “你必不蒙羞”也可译作“你必不羞愧”。本节希伯来文接连使用几个意义重叠的羞耻用语，强调锡安公开蒙受的羞辱将要终结。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: 不要惧怕
  rationale: 否定命令式，采用简洁庄重的现代汉语；阴性单数所指由上下文中的锡安女性形象表达，汉语无需在代词形式上标明性别。
- source_word: תֵבוֹשִׁי
  choice: 你必不蒙羞
  rationale: בושׁ在此既可指内心羞愧，也可指公开受辱或期望落空；“蒙羞”较好保留其社会性和结果性。
- source_word: וְאַל תִּכָּלְמִי
  choice: 不要羞惭
  rationale: כלם的Nifal形式表示因受辱而羞惭；此译文与前句“蒙羞”形成近义平行，同时避免完全重复。
- source_word: כִּי לֹא תַחְפִּירִי
  choice: 因为你必不受辱
  rationale: חפר在此表示遭受羞辱、陷入羞惭；“不受辱”突出外在、公开的羞辱，并与“不要羞惭”构成因果关系。
- source_word: בֹשֶׁת עֲלוּמַיִךְ
  choice: 年轻时的羞耻
  rationale: עֲלוּמִים指年轻时期；“年轻时”自然易懂，并保留锡安被拟人为女子的时间性隐喻。
- source_word: תִּשְׁכָּחִי
  choice: 你必忘记
  rationale: 在应许语境中按简单将来意义翻译，表示从前的羞耻将不再支配她。
- source_word: חֶרְפַּת אַלְמְנוּתַיִךְ
  choice: 守寡时所受的凌辱
  rationale: 保留“守寡”的婚姻隐喻；将חֶרְפָּה译为“凌辱”，表达来自社会的责难、讥诮和羞辱。
- source_word: לֹא תִזְכְּרִי עוֹד
  choice: 也不再记得
  rationale: “不再”自然传达עוֹד在否定句中的“不再、再也不”之意。
theological_decisions:
- issue: 阴性单数受话者的身份
  choice: 按上下文理解为被拟人化的锡安／耶路撒冷，但正文仅保留第二人称称呼。
  alternative: 理解为泛指的一名女子。
  rationale: 以赛亚书54章连续使用妻子、寡妇等女性和婚姻意象描绘锡安；不在本节正文中补入“锡安”，以免把上下文所暗示的对象变成原文没有明说的名称。
- issue: “守寡”的婚姻隐喻
  choice: 直译保留“守寡”。
  alternative: 解释性译为“被遗弃”或“荒凉”。
  rationale: 婚姻与寡居意象承载本章关于关系破裂和恢复的神学张力，不宜在正文中解释掉。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“蒙羞—羞惭—受辱—羞耻—凌辱”呈现原文密集而彼此重叠的羞耻词汇，既保留平行层次，也不人为赋予各词过于严格的技术性区别。诗行分行展示原文的平行结构。
