review_pass:
  verdict: revise
  source_fidelity: 译文整体准确保留了军事与司法的平行、雅威之名、仆人的产业，以及末句“义／申雪”的开放性。惟“凡在审判中起来控告你的舌头，你都要定它有罪”把“舌头”直接当作可被定罪的对象，在现代汉语中不自然，也使原文以“舌头”指控告者的转喻显得生硬。
  naturalness: “定它有罪”以“它”回指“舌头”不符合自然现代汉语的法律表达。将其改为“凡在审判中起来、用舌头控告你的，你都要定他有罪”，既保留“舌头”的转喻，也清楚表达审判中的对手。末句改为“他们的义是从我而来”比“他们所得的义来自我”更贴近原文，且不额外暗示“所得”的方式。
  terminology: “雅威”“仆人”“产业”“义”均可保留。“定他有罪”对应希伯来语使役式的法律意义；脚注保留“证明有罪”的可能表达。
  issues:
  - severity: medium
    issue: “定它有罪”将“舌头”作为法律定罪对象，中文语义和搭配生硬。
    rationale: 原文的“舌头”是对控告性言语或控告者的转喻；中文宜明示隐含的人称对象，同时保留“用舌头”的源文意象。
  - severity: low
    issue: “他们所得的义”增加了原文未明示的“所得”表述。
    rationale: 该补充虽可通，却略微具体化“义从我而来”的关系；直译为“他们的义是从我而来”更简洁，并更好保留其可指义或申雪的语义张力。
