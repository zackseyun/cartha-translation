language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל כְּלִ֞י יוּצַ֤ר עָלַ֨יִ/ךְ֙ לֹ֣א יִצְלָ֔ח וְ/כָל לָשׁ֛וֹן תָּֽקוּם אִתָּ֥/ךְ לַ/מִּשְׁפָּ֖ט תַּרְשִׁ֑יעִי זֹ֡את נַחֲלַת֩ עַבְדֵ֨י יְהוָ֧ה וְ/צִדְקָתָ֛/ם מֵ/אִתִּ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/017.yaml
  text: No weapon formed against you will succeed[a], and every tongue that rises against you in judgment you will condemn. This is the heritage of the servants of Yahweh, and their righteousness is from me[b], declares Yahweh.
translation:
  language: zh_hans
  text: 凡为攻击你而造的武器，都不能得逞；凡在审判中起来、用舌头控告你的，你都要定他有罪[a]。这是雅威仆人的产业；他们的义是从我而来[b]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你都要证明他有罪。”这里的希伯来语动词用于法律语境，意为宣告或证明有罪。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们的申雪来自我。”在本节的法律语境中，“义”也可指获判为正、得到申雪。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלִי
  choice: 武器
  rationale: 该词本义可指器具、器皿或工具；在“为攻击你而造”且“不能得逞”的敌对语境中，指攻击性的器械，译作“武器”最贴切。
- source_word: יוּצַר
  choice: 造
  rationale: 这是 יצר 的被动形式，表示被塑造、制成。中文“造”自然简洁，又不把材质限定为金属，胜于过度具体的“铸造”。
- source_word: עָלַיִךְ
  choice: 为攻击你
  rationale: 介词短语在敌对语境中表示“针对你、攻击你”；结合被造的武器，译作“为攻击你”清楚自然。
- source_word: יִצְלָח
  choice: 不能得逞
  rationale: 该动词表示成功、顺利或奏效。用于敌对武器时，“不能得逞”既表达攻击不会成功，也符合庄重的现代汉语。
- source_word: לָשׁוֹן
  choice: 舌头
  rationale: 保留希伯来文以身体器官指言语的鲜明转喻；加上“控告你的”使其在司法语境中的含义清楚。
- source_word: תָּקוּם אִתָּךְ לַמִּשְׁפָּט
  choice: 在审判中起来控告你
  rationale: קום 描绘敌对者起来，למשפט 指向司法审理。译文明确其控告性质，同时保留“起来”的源文意象。
- source_word: תַּרְשִׁיעִי
  choice: 你都要定它有罪
  rationale: רשע 的使役形在法律语境中意为宣告有罪、定罪。代词“它”回指“舌头”，保留原文语法和意象；脚注说明也可理解为证明对方有罪。
- source_word: נַחֲלַת
  choice: 产业
  rationale: 该词指承受所得的份或产业。“产业”保留盟约和继承的色彩，也适合“这是……的产业”这一句式。
- source_word: עַבְדֵי
  choice: 仆人
  rationale: 在“雅威的仆人”这一盟约性称谓中，重点是归属和服事，并非强调受奴役的社会身份。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: צִדְקָתָם
  choice: 他们所得的义
  rationale: צדקה 可表示义、正义，也可在法律语境中表示获判为正或得到申雪。“义”保留该词广度；加入“所得的”使“来自我”的赐予或判决关系在现代中文中自然，并以脚注保留“申雪”的法庭含义。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 这是先知文献中标示神圣发言权威的固定表达；“宣告”比一般的“说”更能体现其庄严语体。
theological_decisions:
- issue: צִדְקָתָם 在末句中的含义
  choice: 他们所得的义来自我
  alternative: 他们得到的申雪来自我
  rationale: 该名词既可指“义”，也能在本节明显的司法背景下指有利判决或申雪。正文保留核心词“义”，不将其缩减为单一法庭义；脚注则呈现司法性的合理读法，以保留原文的神学张力。
- issue: “这是……的产业”所指的范围
  choice: 让“这”自然回指前述武器不能奏效、控告者被定罪以及从雅威而来的义这一整体应许
  alternative: 仅指紧邻的胜诉或申雪
  rationale: 希伯来文指示词 זֹאת 可概括前文，具体边界并未明说。译文不添加限定语，以保存这一真实的指代开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语，并保留希伯来诗句中军事与司法意象的并列。“雅威”用于四字神名。“舌头”保留原文转喻，由“控告”澄清含义；正文和脚注共同保存“义／申雪”的语义张力。
