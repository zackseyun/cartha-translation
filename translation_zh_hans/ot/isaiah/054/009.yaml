    rationale: 洪水是明确语境，但马所拉文本实际读作“挪亚的水”，而本节脚注特别需要保留这一措辞，以区别古代译本传统中的“挪亚的日子”。正文采用“挪亚的水”，并在注中说明其指洪水，能更直接保留文本差异。
