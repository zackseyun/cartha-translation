reference: Isaiah 54:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי מֵ֥י נֹ֨חַ֙ זֹ֣את לִ֔/י אֲשֶׁ֣ר נִשְׁבַּ֗עְתִּי מֵ/עֲבֹ֥ר מֵי נֹ֛חַ ע֖וֹד עַל הָ/אָ֑רֶץ כֵּ֥ן נִשְׁבַּ֛עְתִּי מִ/קְּצֹ֥ף עָלַ֖יִ/ךְ וּ/מִ/גְּעָר בָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/009.yaml
  text: 'For this is like the waters of Noah to me: just as I swore that the waters of Noah would never again pass over the earth[a], so I have sworn not to be angry with you and not to rebuke you.'
translation:
  language: zh_hans
  text: “因为这事对我如同挪亚的水：我怎样起誓，不再让挪亚的水漫过大地[a]，照样，我也起誓，不再向你发怒，也不斥责你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为这事对我如同挪亚的水。”这里的“挪亚的水”在语境中指挪亚洪水。有些译本受古代译本影响，作“挪亚的日子”；但希伯来文本作“挪亚的水”。
    reason: 说明原文略显省略的比较句法，并保留马所拉文本“挪亚的水”与古代译本传统“挪亚的日子”之间的差异。
lexical_decisions:
- source_word: כִּי
  choice: 这事
  rationale: 本词引出对前文应许的说明；汉语以整句陈述自然承接上下文，不机械译出连接词。
- source_word: מֵי נֹחַ
  choice: 挪亚的洪水
  rationale: 原文直译为“挪亚的水”；在挪亚叙事的语境中译作“洪水”，既保留所指，也符合现代汉语。脚注说明其字面形式及异文传统。
- source_word: זֹאת לִי
  choice: 这事对我就像……一样
  rationale: 希伯来文表达略有省略，结合后文“照样”可见这里构成比较；补出“像……一样”以使汉语清楚，同时不扩大解释。
- source_word: אֲשֶׁר ... כֵּן
  choice: 怎样……照样
  rationale: 用汉语对应结构呈现前后两项比较及誓言之间的类比关系。
- source_word: נִשְׁבַּעְתִּי
  choice: 我怎样起誓／我也起誓
  rationale: 保留神圣誓言的郑重语气，并用重复句式对应原文两次出现的动词。
- source_word: מֵעֲבֹר
  choice: 不再让……漫过
  rationale: עבר表示经过、越过；洪水作语境时，“漫过”自然表达水覆盖大地的动态。补出“让”以构成流畅的汉语使动表达。
- source_word: עוֹד
  choice: 不再
  rationale: 与誓言语境中的否定含义结合，清楚表达不会重复发生。
- source_word: עַל הָאָרֶץ
  choice: 漫过大地
  rationale: 挪亚洪水语境支持“地／大地”而非局部性的“土地”；“漫过”与洪水搭配自然。
- source_word: מִקְּצֹף עָלַיִךְ
  choice: 不再向你发怒
  rationale: קצף表示发怒、震怒；“向你发怒”准确且适合庄重的现代汉语。
- source_word: וּמִגְּעָר בָּךְ
  choice: 也不再斥责你
  rationale: גער意为斥责、责备；“斥责”保留原文较强的语气，并与前句平行。
theological_decisions:
- issue: זֹאת לִי中的省略式比较
  choice: 这事对我就像挪亚的洪水一样
  alternative: 这事对我如同挪亚的水；这事对我如同挪亚的日子
  rationale: 马所拉文本明确作“挪亚的水”，不是部分古代译本传统中的“挪亚的日子”。正文保留洪水所指，并补出原文语境隐含的比较关系。
- issue: 誓言之后מִן加不定式结构的否定效力
  choice: 我也起誓不再向你发怒，也不再斥责你
  alternative: 我也起誓，我不会向你发怒，也不会斥责你
  rationale: 原文在誓言结构中表达禁止再次发生的内容；汉语需明确译出“不再”，这是语法上的显明化，并未加入额外教义判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“怎样……照样……”清楚呈现希伯来文的比较结构；“发怒”“斥责”保留原文的力度。称呼对象为阴性单数，语境中指锡安，但正文依原文译作“你”，不另行释义。
