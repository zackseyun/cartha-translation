base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/007.yaml
  text: For a brief moment I abandoned you[a], but with great compassion I will gather you.
translation:
  language: zh_hans
  text: 我离弃你不过片刻[a]，却要以极大的怜悯将你招聚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我撇下你只是一小会儿。”
    reason: 词汇与表达方式的替代译法；“撇下”可表达עזב，“一小会儿”则较贴近בְּרֶגַע קָטֹן的字面组合。
lexical_decisions:
- source_word: בְּרֶגַע קָטֹן
  choice: 不过片刻
  rationale: רֶגַע表示极短的时段，קָטֹן进一步限定其短暂；“不过片刻”符合现代汉语表达，也保留审判持续时间有限的含义。
- source_word: עֲזַבְתִּיךְ
  choice: 我离弃你
  rationale: עזב可指离开、撇下或离弃。“离弃”保留原文直接而强烈的关系性与盟约性语气，没有将其弱化为一般性的“离开”。
- source_word: וּבְרַחֲמִים גְּדֹלִים
  choice: 却要以极大的怜悯
  rationale: ו在上下句之间构成明显转折，译作“却”；רַחֲמִים虽为复数形式，在此表达怜悯之情，גְּדֹלִים强调其广大，故译为“极大的怜悯”。
- source_word: אֲקַבְּצֵךְ
  choice: 将你招聚
  rationale: קבץ的加强词干在先知语境中常指聚集分散者并带有复兴意味。“招聚”比“收集”更适用于人，也保留原文的聚集意象而不展开为解释性意译。
theological_decisions:
- issue: 神的审判与复兴之间的张力
  choice: 直译为神曾“离弃”锡安，但这离弃只是“不过片刻”，随后是出于极大怜悯的招聚。
  alternative: 将离弃解释为仅仅表面上的离弃，或用较弱的“暂时离开”来缓和语气。
  rationale: 希伯来文עֲזַבְתִּיךְ直接陈述“我离弃了你”，不可因神学顾虑而削弱；同时，原文以短暂的时限和极大的怜悯限定、对照这一离弃，应保留审判与怜悯并存的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“离弃”保持原文力度；“招聚”保留先知书中聚集分散者的意象。句中以“不过……却……”清楚呈现短暂离弃与宏大怜悯之间的对比。
