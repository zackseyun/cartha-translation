source:
  edition: WLC
  text: כִּ֤י בֹעֲלַ֨יִ/ךְ֙ עֹשַׂ֔יִ/ךְ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ וְ/גֹֽאֲלֵ/ךְ֙ קְד֣וֹשׁ יִשְׂרָאֵ֔ל אֱלֹהֵ֥י כָל הָ/אָ֖רֶץ יִקָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/005.yaml
  text: For your husband is your Maker[a]; Yahweh of Armies is his name. And your Redeemer is the Holy One of Israel[b]; he is called the God of all the earth.
translation:
  language: zh_hans
  text: 因为造你的那位是你的丈夫；他的名是“万军之雅威”[a]。救赎你的是以色列的圣者；他被称为“全地的上帝”[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之雅威”传统上常译作“万军之耶和华”或“万军之主”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他将被称为全地的上帝。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的安慰说明理由；“因为”自然保留了解释性的逻辑关系。
- source_word: בֹעֲלַיִךְ
  choice: 你的丈夫
  rationale: 本节把锡安人格化为女子，בעל在此主要表达婚姻关系；译作“丈夫”可保留鲜明的婚约隐喻，不弱化为较宽泛的“主人”。
- source_word: עֹשַׂיִךְ
  choice: 造你的那位
  rationale: עשה的分词带阴性单数第二人称后缀，指创造锡安的上帝；此译法在现代汉语中自然，也保留称号性的表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 以“雅威”音译上帝的专名，以“万军”表达צְבָאוֹת所指的众军、军旅；既保留传统庄重感，也避免把专名改成普通称号。
- source_word: וְגֹאֲלֵךְ
  choice: 救赎你的
  rationale: גאל含有救赎以及亲属履行赎回责任的背景；正文采用通顺而不过度限定的“救赎”，不擅自扩写为“至近亲属救赎者”。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 保留以赛亚书中反复出现的固定神圣称号，并以庄重、易懂的现代汉语表达。
- source_word: אֱלֹהֵי כָל הָאָרֶץ
  choice: 全地的上帝
  rationale: 准确表达构造短语所强调的普世范围与主权；“全地”简洁而庄重。
- source_word: יִקָּרֵא
  choice: 他被称为
  rationale: קרא的尼法勒未完成式在称号语境中可表达现时、公认的身份；正文采用一般现在意义，同时用脚注保留未来理解。
theological_decisions:
- issue: 上帝与锡安之间的婚姻隐喻
  choice: 明确译作“造你的那位是你的丈夫”
  alternative: 译作“你的主人是造你的那位”
  rationale: 上下文将锡安描写为女子，婚姻义最切合语境；保留这一隐喻可呈现经文本身的关系与盟约张力，而不附加后来的宗派解释。
- issue: 神圣名称与称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之雅威
  alternative: 万军之耶和华；万军之主
  rationale: 正文区分专名יְהוָה与称号性成分צְבָאוֹת；“雅威”较直接地转写专名，“万军”则保留其军事及众军意象。
- issue: יִקָּרֵא 的时态体意义
  choice: 他被称为
  alternative: 他将被称为
  rationale: 未完成式可在此作一般性或未来性陈述。正文按称号公式译作现时公认的身份，但以脚注保留未来读法，避免消除原文的时态张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“造你的那位”比名词化的“你的创造主”更贴近希伯来语分词结构；分号保留原文两组神圣身份与称号之间的平衡。所有代词均按现代汉语通常写法使用“他”，不另行引入原文没有的敬称形式。
