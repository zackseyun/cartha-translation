  text: כִּי יָמִ֥ין וּ/שְׂמֹ֖אול תִּפְרֹ֑צִי וְ/זַרְעֵ/ךְ֙ גּוֹיִ֣ם יִירָ֔שׁ וְ/עָרִ֥ים נְשַׁמּ֖וֹת יוֹשִֽׁיבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/003.yaml
  text: For you will spread out to the right and to the left[b][a], and your offspring will possess nations and will settle desolate cities.
translation:
  language: zh_hans
  text: 因为你必向右向左扩展；你的后裔必得列国为业[a]，使荒凉的城有人居住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得……为业”也可译作“占有”；在某些语境中，这个词还可指使原有居民失去产业而取得占有。
    reason: lexical_alternative
  - marker: b
    text: 直译：“使荒凉的城有人居住。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明扩张帐幕的理由，保留原文的因果关系。
- source_word: יָמִין וּשְׂמֹאול
  choice: 向右向左
  rationale: 保留具体的空间意象，并自然表达向两边扩展，并不限定为南北方位。
- source_word: תִּפְרֹצִי
  choice: 扩展
  rationale: פרץ本有冲破、突破之意；此处描写锡安扩张，用“扩展”既自然，也符合上下文。
- source_word: וְזַרְעֵךְ
  choice: 你的后裔
  rationale: זֶרַע在此为集合意义；“后裔”在现代汉语中清楚自然。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 保留先知文学的庄重语体，并避免加入后期“外邦人”的宗教对立含义。
- source_word: יִירָשׁ
  choice: 得……为业
  rationale: ירשׁ可表示承受、占有或夺取产业。“得列国为业”保留产业语义及领有的力度，同时不把语境中并未完全确定的方式明确化为驱逐。
- source_word: עָרִים נְשַׁמּוֹת
  choice: 荒凉的城
  rationale: 准确表达城市荒废、无人居住的状态，并保持先知书的庄重措辞。
- source_word: יוֹשִׁיבוּ
  choice: 使……重新有人居住
  rationale: 保留ישׁב使役式“使之有人居住”的语法意义；“重新”由荒凉城市的语境自然引出。
theological_decisions:
- issue: יִירָשׁ以“列国”为宾语时的含义
  choice: 得列国为业
  alternative: 占有列国；赶走列国而占有其地
  rationale: 该动词可指承受产业、取得占有权，也可在某些语境中含夺取或使原居民失去产业之意。正文不把歧义收窄为明确的军事驱逐，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“得列国为业”保留先知书及产业语言的色彩；后半句明确呈现希伯来语使役形式。脚注标记均置于相应正文之后。
