base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/013.yaml
  text: And all your children will be taught by Yahweh[b][a], and great will be the peace of your children.
translation:
  language: zh_hans
  text: 你所有的儿女[a]都必受耶和华教导；你的儿女必享大平安[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 两处“儿女”也可译作“儿子”；希伯来语 בנים 既可特指儿子，也可泛指儿女。
    reason: lexical_alternative
  - marker: b
    text: “平安”（shalom）也包含完整、福祉、安康或兴盛之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: 所有的
  rationale: כָל涵盖整体；本节承接上文，中文不必机械译出句首连接词，仍保留诗句自然的延续感。
- source_word: בָּנַיִ/ךְ
  choice: 你的儿女
  rationale: בנים既可特指“儿子”，也可泛指“儿女”。此处是对拟人化的锡安所说的群体性应许，译作“儿女”可避免无根据地限于男性，同时保留亲子意象。
- source_word: לִמּוּדֵי
  choice: 必受……教导
  rationale: 该词表示“受教导的人”。用“必受耶和华教导”自然表达其表语意义，也清楚保留耶和华作为教导者。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名译法“耶和华”，明确保留专名而不以称号替代。
- source_word: וְ/רַב
  choice: 必大享
  rationale: רַב在此突出平安的丰盛程度；“必大享”既体现诗句的强调，又符合现代庄重中文。
- source_word: שְׁלֹום
  choice: 平安
  rationale: שׁלום的基本语义包括和平、完整、福祉与兴盛。“平安”是中文中最贴切且语义较宽的对应词，更广内涵由脚注说明。
- source_word: בָּנָיִ/ךְ
  choice: 你的儿女
  rationale: 第二次出现与第一次保持一致，保存原文的重复和对锡安后裔的群体性指称。
theological_decisions:
- issue: 对锡安所说“你的儿女”的指称范围
  choice: 译作“你的儿女”，不具体限定为某一族群、教会群体或男性后裔。
  alternative: 你的儿子；你的居民
  rationale: 原文把锡安／耶路撒冷人格化为女性，并以她的后裔表达群体性应许。译文保留此意象及其开放性，不引入后来的神学身份界定。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“必受……教导”保留被动关系和神圣施事者；分号呈现两个平行分句。“必大享平安”传达原文前置形容词所强调的丰盛程度。
