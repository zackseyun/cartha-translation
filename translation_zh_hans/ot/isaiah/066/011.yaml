- from: 好让你们从她安慰的乳房吃奶，得以饱足；好让你们尽情吸饮，从她丰盛的荣耀中得到喜乐。[a]
  to: 好让你们从她那带来安慰的乳房吃奶，得以饱足；好让你们尽情吸饮，享受她荣耀的丰盛。[a]
  rationale: 修订仅改善现代汉语的修饰关系，并更准确传达“尽享／自我享受”的动词语气。脚注继续标明מִזִּיז的争议性，且将替代读法明确限于末句，避免“整句”范围不清。
