base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/011.yaml
  text: so that you may nurse and be satisfied from her comforting breast[c][b][a], so that you may drink deeply and delight yourselves from the abundance of her glory.
translation:
  language: zh_hans
  text: 好让你们从她那带来安慰的乳房吃奶，得以饱足；好让你们尽情吸饮，享受她荣耀的丰盛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丰盛”所译的希伯来词含义不确定，也可理解为“丰满”或“满溢”；此词也可能与“乳房”有关，因此末句可理解为“从她荣耀的乳房吸饮”。
    reason: 保留 מִזִּיז 的词汇与意象歧义。
lexical_decisions:
- source_word: לְמַעַן
  choice: 好让
  rationale: 两次重复，表达目的或结果；“好让”自然地保留这一语气。
- source_word: תִּינְקוּ
  choice: 吃奶
  rationale: 动词 ינק 指吸奶；结合耶路撒冷作为母亲的上下文，“吃奶”清楚保留哺乳意象。
- source_word: וּשְׂבַעְתֶּם
  choice: 得以饱足
  rationale: 表达因乳养而吃饱、满足，符合 שבע 的基本含义和上下文。
- source_word: מִשֹּׁד תַּנְחֻמֶיהָ
  choice: 从她安慰的乳房
  rationale: 保留希伯来文“乳房”及“她的安慰”之间较为凝缩的关系，同时使用现代汉语可理解的表达。
- source_word: תָּמֹצּוּ
  choice: 尽情吸饮
  rationale: 该动词延续吸乳、汲取的生动意象；“吸饮”保留动作，“尽情”传达充分汲取之意。
- source_word: וְהִתְעַנַּגְתֶּם
  choice: 得到喜乐
  rationale: 表达 ענג Hitpael 所指的享受、欣喜；在汉语句中自然顺畅。
- source_word: מִזִּיז
  choice: 从……丰盛……中
  rationale: זִיז 在此词义较难确定，可指丰盛、丰满或满溢；正文采用较稳妥的“丰盛”，脚注保留其他可能。
- source_word: כְּבוֹדָהּ
  choice: 她……的荣耀
  rationale: 保留 כָּבוֹד 的核心含义“荣耀”，以及指向耶路撒冷的阴性单数代词。
theological_decisions:
- issue: 耶路撒冷／锡安的母亲意象
  choice: 直接保留耶路撒冷作为母亲乳养并安慰儿女的意象
  alternative: 将其概括为不带身体意象的安慰和供应
  rationale: 上下文明确把耶路撒冷人格化为母亲；译文不进一步寓意化，也不将具体意象抽象化。
- issue: מִזִּיז כְּבוֹדָהּ 的语义关系
  choice: 译为“从她丰盛的荣耀中”
  alternative: “从她荣耀的丰满／满溢中”或将 זִיז 理解为“乳房”
  rationale: 该短语存在真实的词汇歧义；正文采用常见且与平行结构协调的理解，脚注提示其他可能，不把争议解释为确定含义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话；保留“乳房、吃奶、吸饮”的母性哺乳意象，避免以抽象措辞削弱原文的具体性。分号对应两个平行的目的分句。
