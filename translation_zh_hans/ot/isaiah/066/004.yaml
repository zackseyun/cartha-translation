source:
  edition: WLC
  text: גַּם אֲנִ֞י אֶבְחַ֣ר בְּ/תַעֲלֻלֵי/הֶ֗ם וּ/מְגֽוּרֹתָ/ם֙ אָבִ֣יא לָ/הֶ֔ם יַ֤עַן קָרָ֨אתִי֙ וְ/אֵ֣ין עוֹנֶ֔ה דִּבַּ֖רְתִּי וְ/לֹ֣א שָׁמֵ֑עוּ וַ/יַּעֲשׂ֤וּ הָ/רַע֙ בְּ/עֵינַ֔/י וּ/בַ/אֲשֶׁ֥ר לֹֽא חָפַ֖צְתִּי בָּחָֽרוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/004.yaml
  text: So I also will choose harsh treatment for them[a], and I will bring their fears upon them, because I called and no one answered, I spoke and they did not listen; they did what was evil in my eyes[b], and chose what I did not delight in.
translation:
  language: zh_hans
  text: 我也必选择严厉地处置他们[a]，把他们所惧怕的事降在他们身上[b]；因为我呼唤，却无人回答；我说话，他们却不听。他们行我眼中看为恶的事，选择我所不喜悦的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “严厉地处置他们”所译的希伯来语含义较难确定，也可理解为“戏弄”“迷惑”或“苛待”。在这里可能指作为审判的严厉处置，或带有戏弄意味的处置。
    reason: lexical_alternative
  - marker: b
    text: “他们所惧怕的事”也可译作“他们的恐惧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: 所以，我也
  rationale: “也”与句末“他们……选择”形成回应关系；结合上下文，以“所以”表达报应性的承接。
- source_word: אֶבְחַר
  choice: 要……选择
  rationale: 保留“选择”的基本义，并与句末 בָּחָרוּ 的“选择”相呼应，呈现原文刻意的反讽。
- source_word: בְּתַעֲלֻלֵיהֶם
  choice: 为他们选择严厉的处置
  rationale: 该词语义困难，可指任性的作为、戏弄、苛待或严厉处置。上下文是审判，正文采用通顺而不过度限定的“严厉的处置”，并用脚注保留其他可能。
- source_word: וּמְגוּרֹתָם
  choice: 他们所惧怕的事
  rationale: 该名词既可指恐惧，也可指令人恐惧之事；与“降在他们身上”搭配时，译作具体的“所惧怕的事”更自然。
- source_word: אָבִיא לָהֶם
  choice: 降在他们身上
  rationale: 在审判语境中自然表达“使之临到他们”的不利含义。
- source_word: יַעַן
  choice: 因为
  rationale: 清楚表达下文是施行审判的原因。
- source_word: קָרָאתִי וְאֵין עוֹנֶה
  choice: 我呼唤，却无人回答
  rationale: 准确表达无人回应；“却”自然呈现呼唤与无人回答之间的落差。
- source_word: דִּבַּרְתִּי וְלֹא שָׁמֵעוּ
  choice: 我说话，他们却不听
  rationale: שׁמע 在责备语境中指听从而不只是听见，因此译作“不听”。
- source_word: וַיַּעֲשׂוּ הָרַע בְּעֵינַי
  choice: 他们行我眼中看为恶的事
  rationale: 保留希伯来语“在我眼中”的评价意象，同时符合现代汉语表达。
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בָּחָרוּ
  choice: 选择我所不喜悦的事
  rationale: חפץ兼有意愿与喜悦的色彩；“不喜悦”保留其情感和意志内涵，并与前面的“选择”构成对应。
theological_decisions:
- issue: 上帝在审判中所“选择”的对象
  choice: 正文理解为上帝为百姓选择严厉的处置
  alternative: 上帝选择他们的妄行或迷惑，使他们承受自己所选之事的后果
  rationale: 紧接着的“把他们所惧怕的事降在他们身上”支持审判性处置的理解；同时脚注说明关键词的困难，避免把另一种可能完全排除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号划分审判宣告与原因，以短句保留先知话语的节奏；重复“选择”以呈现原文首尾呼应的审判反讽。
