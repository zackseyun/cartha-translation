source:
  edition: WLC
  text: שִׁמְעוּ֙ דְּבַר יְהוָ֔ה הַ/חֲרֵדִ֖ים אֶל דְּבָר֑/וֹ אָמְרוּ֩ אֲחֵי/כֶ֨ם שֹׂנְאֵי/כֶ֜ם מְנַדֵּי/כֶ֗ם לְמַ֤עַן שְׁמִ/י֙ יִכְבַּ֣ד יְהוָ֔ה וְ/נִרְאֶ֥ה בְ/שִׂמְחַתְ/כֶ֖ם וְ/הֵ֥ם יֵבֹֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/005.yaml
  text: 'Hear the word of Yahweh[a], you who tremble at his word: Your brothers who hate you, who cast you out for my name’s sake, have said, “Let Yahweh be glorified, that we may see your joy”[b]; but they will be put to shame.'
translation:
  language: zh_hans
  text: '你们这些因他的话而战兢的人，

    要听雅威的话：

    你们的弟兄恨恶你们，

    因我的名赶逐你们[a]；

    他们说：

    “愿雅威得荣耀，

    让我们看看你们的喜乐！”[b]

    然而，他们必蒙羞。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赶逐”也可译作“排斥”或“放逐”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为：“愿雅威得荣耀，让我们看看你们的喜乐。”这些话很可能是恨恶忠信者之人的嘲弄；也可理解为：“愿雅威得尊崇，也让我们看见你们的喜乐。”另有人将后半句理解为神在他们的喜乐中显现。
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ דְּבַר יְהוָה
  choice: 要听雅威的话
  rationale: 保留复数命令式的先知性呼召；“话”承载 דָּבָר 在此处神圣宣告的含义，“雅威”直接译出神名 יהוה。
- source_word: הַחֲרֵדִים אֶל דְּבָרוֹ
  choice: 你们这些因他的话而战兢的人
  rationale: חָרֵד 表示因敬畏而战栗；“因他的话而战兢”既保留身体反应的形象，也不将其弱化为单纯的“尊重”。
- source_word: אֲחֵיכֶם
  choice: 你们的弟兄
  rationale: 保留原文亲属称谓及其反差；语境中可能泛指同族同胞，而不必限定为亲生兄弟。
- source_word: שֹׂנְאֵיכֶם
  choice: 恨恶你们
  rationale: 以关系从句表达分词的持续特征，措辞直接而庄重。
- source_word: מְנַדֵּיכֶם
  choice: 赶逐你们
  rationale: 该词可指驱离、排斥或放逐；“赶逐”保留较强的驱逐意味，同时容许社会或宗教性排斥的语境。
- source_word: לְמַעַן שְׁמִי
  choice: 因我的名
  rationale: 表达排斥行为以神的名为理由或借口；不额外判定他们的动机是否真诚。
- source_word: יִכְבַּד יְהוָה
  choice: 愿雅威得荣耀
  rationale: 将未完成式的祈愿语气译为“愿”；“得荣耀”保留 כבד 的神学和修辞分量，也适合带有讥讽可能性的引语。
- source_word: וְנִרְאֶה בְשִׂמְחַתְכֶם
  choice: 让我们看看你们的喜乐
  rationale: 按马所拉文本将 נִרְאֶה 理解为第一人称复数“我们看看”；用自然汉语表达 בְשִׂמְחַתְכֶם，同时在脚注中保存句法与语气上的其他可能。
- source_word: וְהֵם יֵבֹשׁוּ
  choice: 然而，他们必蒙羞
  rationale: “然而”显明末句的逆转；“必蒙羞”保留 בוש 所指的羞耻与败落，并表达预告的确定性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的希伯来语发音，并区别于作为称号的“主”。
- issue: 敌对弟兄所说之话的语气
  choice: 正文采用可作讥讽、也可表面理解为敬虔的中性措辞，并由脚注说明语境很可能带有嘲弄
  alternative: 在正文中直接加上“讥笑说”或采用完全真诚的祈愿语气
  rationale: 上下文中的“恨恶”“赶逐”以及末尾“他们必蒙羞”支持讥讽理解，但希伯来文本没有显式标明讥讽，因此不在正文中把解释绝对化。
- issue: וְנִרְאֶה 的主语与含义
  choice: 让我们看看
  alternative: 愿他在你们的喜乐中显现
  rationale: 马所拉文本的形态最自然地支持第一人称复数“我们看”；另一种涉及神显现的理解争议较大，正文不采用，但脚注保存相关可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，以诗行呈现原文的平行结构。保留“战兢”“弟兄”“蒙羞”等圣经语域中仍自然可懂的词；避免在正文中明确加入“讥笑”等解释性动词，从而保存原文语气的张力。所有脚注标记均置于所注释的相应正文位置。
