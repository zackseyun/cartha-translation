  to: “难道我使人临产，却不使她分娩吗？”耶和华[a]说。“难道我这使人分娩的，反倒要把子宫封闭起来吗？”你的上帝说。[b]
  rationale: 修订消除未由原文支持的“胎儿／他”指代，采用“临产—分娩”的自然对应来保留原文的使役生产比喻；第二问以“我这使人分娩的”表达希伯来语带冠词的分词，并把语境隐含的对象以自然汉语表述出来。两句反问、神名、以及对锡安的阴性单数称呼均予保留。
  reviewer_model: gpt-5.6-terra
