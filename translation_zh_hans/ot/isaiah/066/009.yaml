  naturalness: “使胎儿到了临产的时候”较为拗口，“使子宫闭塞”带有医学病理意味。改为“使人临产”“使人分娩”及“把子宫封闭起来”，在庄重的现代普通话中更清楚自然。
  terminology: “耶和华”作为神名译法可接受；“上帝”及“你的上帝”一致且准确。脚注应保留阴性单数受词与“封闭／阻止”的词义说明。
