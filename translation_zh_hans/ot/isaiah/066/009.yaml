  text: הַ/אֲנִ֥י אַשְׁבִּ֛יר וְ/לֹ֥א אוֹלִ֖יד יֹאמַ֣ר יְהוָ֑ה אִם אֲנִ֧י הַ/מּוֹלִ֛יד וְ/עָצַ֖רְתִּי אָמַ֥ר אֱלֹהָֽיִ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/009.yaml
  text: Shall I bring to the point of birth and not cause to give birth? says Yahweh[a]. Shall I, who cause to give birth[c][b], shut the womb? says your God.
translation:
  language: zh_hans
  text: “难道我使人临产，却不使她分娩吗？”耶和华[a]说。“难道我这使人分娩的，反倒要把子宫封闭起来吗？”你的上帝说。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”译自希伯来语中上帝的名字 יהוה（YHWH）。
    reason: divine_name
  - marker: b
    text: “你的”在希伯来语中是阴性单数形式；这里所称呼的是上下文中被描写为妇人的锡安（耶路撒冷）。“把子宫封闭起来”所译的词直译为“封闭”或“阻止”；宾语由分娩的语境补明。
    reason: grammar_and_lexical_alternative
lexical_decisions:
- source_word: אַשְׁבִּיר
  choice: 使胎儿到了临产的时候
  rationale: 该词在使役形中结合上下文表示把妊娠带到分娩关头，而不是字面上的“打破”。这一译法保留生产意象，同时符合现代汉语。
- source_word: אוֹלִיד / הַמּוֹלִיד
  choice: 使他出生 / 使人生产
  rationale: 两个形式都来自 ילד 的使役形，分别表达“使出生”和“那位使生产者”；中文按各自句法自然表达，并保留使役含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中通行的专名“耶和华”翻译四字神名，不以称号替代。
- source_word: אִם
  choice: 难道
  rationale: 这里引出与前句平行的反问；“难道”自然传达反问语气，同时不强加“或者”等原文未必明确的逻辑关系。
- source_word: וְעָצַרְתִּי
  choice: 反倒又使子宫闭塞
  rationale: עצר 的基本意思是拦阻、封闭。生产语境暗含子宫这一对象；正文将其补明，并用“反倒”显出反问中的强烈反差。
- source_word: אֱלֹהָיִךְ
  choice: 你的上帝
  rationale: 保留第二人称单数的直接称呼；希伯来语词尾所标明的阴性由脚注说明，因为现代汉语的“你”无法体现这一点。
theological_decisions:
- issue: 如何呈现上帝借生产意象作出的保证
  choice: 保留两个反问以及从临产到出生的连贯意象，表达上帝不会使锡安来到新生关头却阻止其实现。
  alternative: 意译为“我既开始这事，难道不会完成吗？”
  rationale: 意译虽可传达大意，却会抹去原文鲜明的生产比喻；正文不进一步把该比喻限定为某一宗派性的教义解释。
- issue: 是否为 וְעָצַרְתִּי 补出宾语
  choice: 在正文补出“子宫”。
  alternative: 仅译作“我却阻止吗”或“我却封闭吗”。
  rationale: 希伯来诗歌容许宾语省略，但汉语若不补明容易晦涩；“子宫”由本节生产语境直接限定，脚注同时交代原文的简略表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“难道……吗”重现两句平行反问；生产用语力求清楚但不过度医学化。所有脚注标记均置于正文相应位置。
