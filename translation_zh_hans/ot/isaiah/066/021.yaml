  text: וְ/גַם מֵ/הֶ֥ם אֶקַּ֛ח לַ/כֹּהֲנִ֥ים לַ/לְוִיִּ֖ם אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/021.yaml
  text: And even from them I will take some for priests and for Levites[b][a], says Yahweh.
translation:
  language: zh_hans
  text: “我也要从他们[a]中选取一些人，作祭司、作利未人[b]。”耶和华说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”承接上文；希伯来文在本节没有明说具体所指。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“作为祭司和利未人”或“成为祭司和利未人”；这里的希伯来语介词表示任命或指定身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 我也要
  rationale: וְ 表示与上文的衔接，גַם 表示增添并带有强调意味；“也”在现代汉语中自然地保留这两层作用。
- source_word: מֵהֶם
  choice: 从他们中
  rationale: 介词 מִן 与第三人称复数代词连用，表示从某一群体中选取；“他们”的具体所指仍由上文决定，不在正文中加以限定。
- source_word: אֶקַּח
  choice: 选取一些人
  rationale: לקח 的基本义是“取、拿”，在本语境中指从一个群体里取人担任某种职分。“选取”符合现代汉语表达，“一些人”则自然呈现 מֵהֶם 的部分含义，而不限定人数。
- source_word: לַכֹּהֲנִים
  choice: 作祭司
  rationale: 前缀 לְ 在这里表示任命或指定身份；“作祭司”比直译为“给祭司”更清楚，同时不超出原文。
- source_word: לַלְוִיִּם
  choice: 作利未人
  rationale: 与前一短语平行，לְ 表示指定身份；“利未人”采用现代中文圣经语境中的通行名称。
- source_word: אָמַר יְהוָה
  choice: 耶和华说
  rationale: 这是先知话语中常见的宣告公式。完成式 אָמַר 在此具有即时宣告作用，汉语用“说”自然合宜；神名 יְהוָה 译为“耶和华”。
theological_decisions:
- issue: “他们”的身份以及祭司、利未人职分的范围
  choice: 正文保留“他们”这一未明说先行词的代词，让上下文决定其所指；同时按字面保留“作祭司、作利未人”。
  alternative: 将“他们”明确解释为列国之民，或较狭义地解释为散居列国后归回的以色列人；也可把祭司和利未人的称谓理解为非字面的事奉角色。
  rationale: 希伯来文本节没有重述“他们”所指的群体，也没有解释这些职分应按何种方式实现。译文不应预先消解这一显著的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。将直接引语置于前面，并以“耶和华说”收束，贴近希伯来语次序。正文保留简洁的平行结构“作祭司、作利未人”，避免加入宗派性解释。
