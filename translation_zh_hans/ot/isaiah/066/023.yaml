base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/023.yaml
  text: And it shall be[a], from new moon to its new moon and from Sabbath to its Sabbath, all flesh shall come to bow down before me[b], says Yahweh.
translation:
  language: zh_hans
  text: “到那时，从一个月朔到下一个月朔，从一个安息日到下一个安息日[a]，凡有血肉的[b]都必来到我面前俯伏敬拜。”耶和华说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“每逢月朔、每逢安息日”。
    reason: lexical_alternative
  - marker: b
    text: “凡有血肉的”是希伯来语表达，在这里可指全人类，同时保留了有身体之受造生命的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 到那时
  rationale: 这是常见的先知性引介语，指向将来的情形；“到那时”在现代汉语中自然、庄重，也不额外界定事情发生的具体时间。
- source_word: מִדֵּי חֹדֶשׁ בְּחָדְשׁוֹ
  choice: 从一个月朔到下一个月朔
  rationale: חֹדֶשׁ在这里与安息日并列，较可能指月朔这一敬拜时点，而不只是一般的月份。“从一个……到下一个……”自然表达希伯来语所指的定期重复。
- source_word: וּמִדֵּי שַׁבָּת בְּשַׁבַּתּוֹ
  choice: 从一个安息日到下一个安息日
  rationale: 保留“安息日”这一礼仪和神学用语，并与前句平行，表达周而复始的敬拜。
- source_word: יָבוֹא
  choice: 都必来到
  rationale: 忠实表达בוא的来临、趋近之意；“必”符合先知预告的语气。
- source_word: כָל בָּשָׂר
  choice: 凡有血肉的
  rationale: 保留希伯来语的具体意象及其范围上的张力；在本语境中主要指全人类，同时仍带有受造、具身体之生命的意味。
- source_word: לְהִשְׁתַּחֲוֺת
  choice: 俯伏
  rationale: 该动词具体描写在敬拜中屈身或伏地的动作；“俯伏”既保留身体动作，也由语境自然传达敬拜含义。
- source_word: לְפָנַי
  choice: 来到我面前
  rationale: 自然表达来到说话者面前、进入其临在的意思。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中最通行、最易识别的上帝专名译法。
theological_decisions:
- issue: חֹדֶשׁ在末世敬拜语境中应译为“月份”还是“月朔”
  choice: 月朔
  alternative: 月份
  rationale: 该词与安息日并列，并用于周期性敬拜的表达，因此“月朔”更能保留经文的礼仪色彩；译文并不借此裁定关于未来历法礼仪延续方式的争论。
- issue: כָל בָּשָׂר的范围应限定为全人类，还是保留可能更广的受造生命意涵
  choice: 凡有血肉的
  alternative: 所有人／全人类
  rationale: 直译保留原文表达及其神学张力。语境最自然地指普世人类前来敬拜，但不把原文的具身受造意象压缩为单纯的抽象人类称谓。
- issue: לְהִשְׁתַּחֲוֺת应译出具体动作还是直接解释为敬拜
  choice: 俯伏
  alternative: 敬拜
  rationale: 原词突出屈身或伏地的具体动作；本句语境已经清楚表明这是敬拜，因此无需用解释性译法取代原有意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“月朔”虽略具礼仪色彩，却比“新月”更准确地指月初的宗教时点；以“从一个……到下一个……”清楚传达周期性重复。引语与“耶和华说”分置，保持先知宣告的节奏。
