  source_fidelity: 译文总体准确保留了反身的礼仪性动作、园子、禁忌食物、共同毁灭及神谕公式。原文困难短语אַחַר אחד בַּתָּוֶךְ不宜译成“跟随在中间的那一位”，因为该表达在汉语中较强地断定“那一位”本身位于中间；希伯来语中“在中间”与“跟随一位”的具体句法关系仍有争议。
  naturalness: 原译末段以两个“那些……的人”分列，虽可理解，略显重复且使连续分词的同一群体不够紧凑。改为一个并列修饰语链，更符合现代标准汉语，也保留原文的连续描写。
  terminology: “使自己分别为圣”“使自己洁净”“猪肉”“可憎之物”“老鼠”“耶和华”均恰当。“宣告”比“这是……说的”更贴近נְאֻם的庄重先知性公式。
  issues:
