revisions:
- from: 那些使自己分别为圣、使自己洁净，为要进入园子，跟随在中间的那一位的人[a]，那些吃猪肉、可憎之物和老鼠的人，必一同灭亡。这是耶和华说的。
  to: 那些使自己分别为圣、使自己洁净、前往园子、跟随中间一人的，又吃猪肉、可憎之物和老鼠的，必一同灭亡；这是耶和华的宣告。[a]
  rationale: 修订避免把困难礼仪短语的句法关系定死，并以脚注保留主要可能解释；同时将连续的修饰语合并为同一群体的描述，将“为要进入园子”收敛为较贴近原文的“前往园子”，并以“这是耶和华的宣告”表达先知神谕公式。
  reviewer_model: gpt-5.6-terra
