  text: הַ/מִּתְקַדְּשִׁ֨ים וְ/הַ/מִּֽטַּהֲרִ֜ים אֶל הַ/גַּנּ֗וֹת אַחַ֤ר אחד בַּ/תָּ֔וֶךְ אֹֽכְלֵי֙ בְּשַׂ֣ר הַ/חֲזִ֔יר וְ/הַ/שֶּׁ֖קֶץ וְ/הָ/עַכְבָּ֑ר יַחְדָּ֥ו יָסֻ֖פוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/017.yaml
  text: Those who sanctify themselves and purify themselves to go into the gardens[a], following one in the midst, eating the flesh of pigs and detestable things and mice, shall come to an end together, declares Yahweh.
translation:
  language: zh_hans
  text: 那些使自己分别为圣、使自己洁净、前往园子、跟随中间一人的，又吃猪肉、可憎之物和老鼠的，必一同灭亡；这是耶和华的宣告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译：“跟随中间一人。”此短语含义不明，可能指跟随一位仪式领袖、跟随某人进入中央，或在宗教仪式中一个接一个地前行。
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּתְקַדְּשִׁים
  choice: 使自己分别为圣
  rationale: 保留Hitpael分词的反身意义，并体现这些人自行进行宗教性分别的意味。
- source_word: וְהַמִּטַּהֲרִים
  choice: 使自己洁净
  rationale: 保留反身和礼仪语境，与“使自己分别为圣”形成自然对应。
- source_word: אֶל הַגַּנּוֹת
  choice: 为要进入园子
  rationale: אֶל表示朝向；结合上下文，将隐含的移动表达出来，但不额外说明园中仪式的性质。
- source_word: אַחַר אחד בַּתָּוֶךְ
  choice: 跟随在中间的那一位
  rationale: 尽量贴近困难的希伯来语结构，不擅自把“一位”认定为祭司、领袖或偶像；其他可能理解收入脚注。
- source_word: אֹכְלֵי
  choice: 那些吃……的人
  rationale: 将分词作为对同一群人的继续描述，以现代汉语明确表达。
- source_word: בְּשַׂר הַחֲזִיר
  choice: 猪肉
  rationale: 自然、准确地表达“猪的肉”，避免不必要的古雅措辞。
- source_word: הַשֶּׁקֶץ
  choice: 可憎之物
  rationale: 保留该词在礼仪语境中“令人憎恶之物”的含义，不将其过度限定为某一类食物。
- source_word: הָעַכְבָּר
  choice: 老鼠
  rationale: 这是该希伯来词通常且稳妥的现代汉语对应。
- source_word: יַחְדָּו יָסֻפוּ
  choice: 必一同灭亡
  rationale: “一同”保留共同结局；“灭亡”自然表达 סוף 在此处被彻底终结的审判含义。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华说的
  rationale: 以庄重而易懂的现代汉语表达先知宣告公式，并音译神名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文直接出现四字神名；采用现代中文圣经读者广泛熟悉的专名“耶和华”，而不以“主”替代神名。
- issue: 困难礼仪短语 אַחַר אחד בַּתָּוֶךְ 的处理
  choice: 跟随在中间的那一位
  alternative: 跟随一人进入中央；在仪式中一个接一个地前行
  rationale: 原文句法和所指均不明确。正文采用相对直译，保留“一位/一人”的不确定所指，并以脚注呈现其他合理理解，避免确定某种仪式细节。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。保留原文连续分词所描写的同一群体，并用重复的“那些……的人”减少长句歧义。困难短语不在正文中强行解释，借脚注保存其真实含混性。
