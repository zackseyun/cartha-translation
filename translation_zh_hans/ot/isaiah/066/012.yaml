  - severity: medium
    issue: “也必在膝上被逗乐”弱化了亲昵逗弄的动作。
    rationale: תְּשָׁעֳשָׁעוּ表达被疼爱、逗弄、在膝上戏耍，而不只是结果性的“被逗乐”。应在正文保留该动作。
