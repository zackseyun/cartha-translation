  to: '因为耶和华如此说：


    “看哪，我要使平安像河流一样流向她，


    使列国的荣耀[a]像奔涌的溪流一样流向她。


    你们必吃奶，必被抱在身侧，


    也必在膝上被亲昵地逗弄[b]。”'
  rationale: 修订仅澄清母婴照料的空间关系，并以“被亲昵地逗弄”保留原文所表达的亲昵动作；其余措辞、代词的未明说所指，以及“荣耀”的语义宽度均予保留。
