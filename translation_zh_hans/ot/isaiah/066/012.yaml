  naturalness: 正文庄重自然，诗行清楚。将“腰间”改为“身侧”，并将末句改为“在膝上被亲昵地逗弄”，可消除歧义并更贴合现代汉语的育儿画面。
  terminology: “耶和华”“平安”“列国的荣耀”均恰当。“荣耀”保留其可涵盖华美、尊荣及财富的语义空间，脚注的替代译法合宜。
