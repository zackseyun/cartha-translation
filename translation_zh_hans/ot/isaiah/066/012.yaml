language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י נֹטֶֽה אֵ֠לֶי/הָ כְּ/נָהָ֨ר שָׁל֜וֹם וּ/כְ/נַ֧חַל שׁוֹטֵ֛ף כְּב֥וֹד גּוֹיִ֖ם וִֽ/ינַקְתֶּ֑ם עַל צַד֙ תִּנָּשֵׂ֔אוּ וְ/עַל בִּרְכַּ֖יִם תְּשָׁעֳשָֽׁעוּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/012.yaml
  text: 'For thus says Yahweh: Behold[a], I am extending peace to her like a river, and the glory of the nations like an overflowing stream; and you will nurse, you will be carried on the hip[b], and bounced on the knees.'
translation:
  language: zh_hans
  text: '因为耶和华如此说：


    “看哪，我要使平安像河流一样流向她，


    使列国的荣耀[a]像奔涌的溪流一样流向她。


    你们必吃奶，必被抱在身侧，


    也必在膝上被亲昵地逗弄[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国的财富（或丰盛）”。希伯来语“荣耀”也可包括列国的华美与财富。
    reason: lexical_alternative
  - marker: b
    text: 或译“在膝上被疼爱地戏耍”。原文描绘照料幼儿时充满疼爱的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中最通行的专名译法，使四字神名在正文中保持为名称，而非以“主”替代。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留指示兼强调的先知性语气；结合后面的分词，以“我要”自然表达上帝正在宣告的行动。
- source_word: נֹטֶה אֵלֶיהָ
  choice: 使……流向她／涌向她
  rationale: 希伯来语描写将某物向她伸展；因宾语分别以河流和洪流为喻，汉语用“流向／涌向”保留方向和流动意象，同时避免生硬的“向她伸展平安”。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: “平安”是准确且通行的对应词，并可在语境中涵盖安宁、健全与福祉。
- source_word: כְּנָהָר
  choice: 像河流一样
  rationale: 直接保留稳定而丰沛的河流比喻。
- source_word: וּכְנַחַל שׁוֹטֵף
  choice: 像泛滥的溪流一样
  rationale: נחל可指溪流或季节性河道，שׁוֹטֵף表示冲涌、漫溢；“泛滥的溪流”保留其充沛而有力的动态。
- source_word: כְּבוֹד גּוֹיִם
  choice: 列国的荣耀
  rationale: 直译保留כבוד在荣耀、尊荣、华美和财富之间的语义宽度；物质丰盛的可能含义收入脚注。
- source_word: וִינַקְתֶּם
  choice: 你们必吃奶
  rationale: 保留主动复数形式及母亲哺育婴孩的具体意象，不将其改写成原文没有的抽象“得滋养”。
- source_word: עַל צַד תִּנָּשֵׂאוּ
  choice: 必被抱在腰间
  rationale: 被动式译为“被抱”；在母婴语境中，צד指母亲身侧或髋腰处，“腰间”是自然的现代汉语表达。
- source_word: וְעַל בִּרְכַּיִם תְּשָׁעֳשָׁעוּ
  choice: 也必在膝上被逗乐
  rationale: 该动词含亲昵逗弄、使孩子欢喜之意；此译法保留被动形式和慈爱的育儿画面。
theological_decisions:
- issue: אֵלֶיהָ（“向她”）所指为何
  choice: 保留为“她”
  alternative: 明确译作“耶路撒冷”或“锡安”
  rationale: 阴性单数代词承接上下文中作为母亲的锡安／耶路撒冷。保留代词既忠于本节形式，也维持上下文的连贯意象，不在本节中额外限定。
- issue: כְּבוֹד גּוֹיִם的含义范围
  choice: 正文译“列国的荣耀”
  alternative: “列国的财富／丰盛”
  rationale: כבוד可兼指尊荣、华美和丰厚资产；正文采用较宽的直译，脚注说明物质层面的可能含义，避免把多义词单向收窄。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。诗行保留河流与母婴照料两组鲜明意象；不把“她”擅自明说为锡安或耶路撒冷，也不把“荣耀”仅解释为财富。脚注标记均放在其实际说明的词语之后。
