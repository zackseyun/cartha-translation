  text: וּ/רְאִיתֶם֙ וְ/שָׂ֣שׂ לִבְּ/כֶ֔ם וְ/עַצְמוֹתֵי/כֶ֖ם כַּ/דֶּ֣שֶׁא תִפְרַ֑חְנָה וְ/נוֹדְעָ֤ה יַד יְהוָה֙ אֶת עֲבָדָ֔י/ו וְ/זָעַ֖ם אֶת אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/014.yaml
  text: You will see[a], and your heart will rejoice; your bones will flourish like the grass. The hand of Yahweh will be made known to his servants, and he will be indignant against his enemies.
translation:
  language: zh_hans
  text: 你们必看见，心必欢喜；你们的骨头必如青草茂盛。雅威的手必向他的仆人显明，他也必向他的仇敌发怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: 你们看见了
  rationale: 连词加Qal完成式在先知性语境中可表达将来实现的事件；中文用“看见了”自然承接前文，并与随后“就欢喜”构成结果关系，而不把连词过度解释为明确的时间从句。
- source_word: וְשָׂשׂ לִבְּכֶם
  choice: 心里就欢喜
  rationale: 希伯来文直译为“你们的心欢喜”。现代汉语以“心里欢喜”更自然；“就”表达看见之后的结果，但不增强喜乐的程度。
- source_word: וְעַצְמוֹתֵיכֶם
  choice: 你们的骨头
  rationale: 保留“骨头”这一具身性的诗歌意象，传达深入全人的复苏，不泛化为“身体”或“力量”。
- source_word: כַּדֶּשֶׁא תִפְרַחְנָה
  choice: 必如青草茂盛
  rationale: דֶּשֶׁא指青草或青绿植物，פָּרַח表示萌发、繁茂。此处译为“如青草茂盛”，兼顾比喻和蓬勃生长之意。
- source_word: וְנוֹדְעָה יַד יְהוָה
  choice: 雅威的手必……显明
  rationale: ידע的Niphal形式表达被显明或变得可识别；保留“手”作为神主动施展能力与作为的意象。יְהוָה按其专名译作“雅威”。
- source_word: אֶת עֲבָדָיו
  choice: 向他的仆人
  rationale: אֶת在此与“显明”所指向的对象相连，译为“向……显明”符合现代汉语；“仆人”适合本段的事奉与归属语境。
- source_word: וְזָעַם
  choice: 他也必……发怒
  rationale: זעם表达愤怒、震怒或忿恨；“发怒”自然、庄重，且不加入原文未明说的惩罚方式。
- source_word: אֶת אֹיְבָיו
  choice: 向他的仇敌
  rationale: 宾语标记指出神发怒所针对的对象；中文“向……发怒”准确而自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近学界通行重构读音的“雅威”，保留专名性质，不以称号替代。
- issue: 末句连词 וְ 的语义力度
  choice: 他也必向他的仇敌发怒
  alternative: 但他必向他的仇敌发怒
  rationale: 原文只有普通连接词וְ，虽上下两句在仆人与仇敌之间形成意义对照，却未明确使用转折连词，因此用“也”保持并列推进，不额外强化为“但”。
- issue: “雅威的手”向仆人显明的含义
  choice: 保留“手”的意象，不解释为恩惠或能力
  alternative: 雅威的大能必为他的仆人彰显
  rationale: “手”可涵盖能力、作为和介入；原文未把它限定为某一种神学含义，直保留意象可避免消除其丰富性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“心里就欢喜”较直译“你们的心欢喜”自然；“骨头”“手”“青草”等原文诗歌意象均予保留。全节不需脚注，因主要歧义已可在正文中以不过度解释的方式呈现。
