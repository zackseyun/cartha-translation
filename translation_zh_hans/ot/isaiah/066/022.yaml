  text: כִּ֣י כַ/אֲשֶׁ֣ר הַ/שָּׁמַ֣יִם הַ֠/חֳדָשִׁים וְ/הָ/אָ֨רֶץ הַ/חֲדָשָׁ֜ה אֲשֶׁ֨ר אֲנִ֥י עֹשֶׂ֛ה עֹמְדִ֥ים לְ/פָנַ֖/י נְאֻם יְהוָ֑ה כֵּ֛ן יַעֲמֹ֥ד זַרְעֲ/כֶ֖ם וְ/שִׁמְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/022.yaml
  text: For just as the new heavens and the new earth that I am making shall remain before me[a], declares Yahweh, so your offspring and your name shall remain.
translation:
  language: zh_hans
  text: “因为，正如我正在造的新天新地在我面前长存[a]——这是雅威的宣告——你们的后裔和你们的名也必照样长存。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长存”也可译作“站立”或“坚立”；本节两处的“长存”都译自同一希伯来语动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明其根据；现代汉语用“因为”能自然表达这一解释关系。
- source_word: כַאֲשֶׁר ... כֵּן
  choice: 正如……也必照样
  rationale: 保留希伯来语前后呼应的比较结构，并使汉语表达自然清楚。
- source_word: הַשָּׁמַיִם הַחֳדָשִׁים וְהָאָרֶץ הַחֲדָשָׁה
  choice: 新天新地
  rationale: 这是现代汉语圣经语境中自然、庄重且广为理解的表达；不额外限定其为纯字面或纯比喻。
- source_word: עֹשֶׂה
  choice: 正在造
  rationale: 用进行体体现希伯来语分词所表达的正在进行或迫近的行动，而不单纯改写为将来时。
- source_word: עֹמְדִים / יַעֲמֹד
  choice: 长存
  rationale: 两处使用同一译词，保留比较的对应关系；对天地、后裔和名字而言，“长存”比字面的“站立”更符合现代汉语，同时保留持续、坚立的含义。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 保留原文的空间及关系意象，不将其扩展解释为其他神学概念。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 自然呈现先知宣告公式，并以“雅威”音译神的专名。
- source_word: זַרְעֲכֶם
  choice: 你们的后裔
  rationale: “后裔”自然表达 זֶרַע 的集合意义，避免“种子”在此处可能造成的误解。
- source_word: וְשִׁמְכֶם
  choice: 和你们的名
  rationale: 直译“名”，保留其可能涵盖身份、声名和延续性的语义空间，不缩窄为“名望”。
theological_decisions:
- issue: “新天新地”的末世含义
  choice: 保留宇宙更新的原文表述，不进一步界定其实现方式
  alternative: 将其明确解释为完全字面的未来创造，或仅仅解释为盟约秩序的比喻性复兴
  rationale: 原文自身保有宏大的末世张力；译文不应替读者排除其中任何未被文本明确否定的层面。
- issue: “你们的后裔和你们的名”所指群体的范围
  choice: 按原文保留为对听众后裔及其名长存的应许
  alternative: 明确限定为民族以色列、忠信余民，或更广泛的末世上帝子民
  rationale: 本节没有完整界定这一应许的神学范围，因此不在译文中加入宗派性的限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正如……也必照样……”保留原文比较结构；引号和插入的“雅威宣告”清楚呈现神谕话语，同时不改变句意。
