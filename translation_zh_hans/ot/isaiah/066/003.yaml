source:
  edition: WLC
  text: שׁוֹחֵ֨ט הַ/שּׁ֜וֹר מַכֵּה אִ֗ישׁ זוֹבֵ֤חַ הַ/שֶּׂה֙ עֹ֣רֵֽף כֶּ֔לֶב מַעֲלֵ֤ה מִנְחָה֙ דַּם חֲזִ֔יר מַזְכִּ֥יר לְבֹנָ֖ה מְבָ֣רֵֽךְ אָ֑וֶן גַּם הֵ֗מָּה בָּֽחֲרוּ֙ בְּ/דַרְכֵי/הֶ֔ם וּ/בְ/שִׁקּוּצֵי/הֶ֖ם נַפְשָׁ֥/ם חָפֵֽצָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/003.yaml
  text: The one who slaughters an ox is like one who strikes down a man[a]; the one who sacrifices a lamb, like one who breaks a dog’s neck; the one who offers a grain offering, like one who offers pig’s blood; the one who makes a memorial offering of frankincense, like one who blesses wickedness. They too have chosen their own ways[b], and their soul delights in their abominations.
translation:
  language: zh_hans
  text: 宰牛的，仿佛击打人；献羊的，仿佛折断狗的颈项；献素祭的，仿佛献上猪血；献乳香作记念的，仿佛称颂邪恶[a]。他们也选择了自己的道路；他们的心喜爱自己的可憎之物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邪恶”或译“偶像”。希伯来语这个词可指邪恶、罪孽，或与偶像崇拜有关的恶。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“他们的魂喜爱”；“魂”和动词均为单数，用集合性的方式指这一群人。
    reason: source_form
lexical_decisions:
- source_word: שׁוֹחֵט הַשּׁוֹר
  choice: 宰牛的
  rationale: 保留希伯来语分词所表达的泛指、刻画性语气；“宰”也切合献祭语境，不额外限定牛的性别。
- source_word: מַכֵּה אִישׁ
  choice: 仿佛击杀人
  rationale: מכה可指击打，也可在语境中指击杀；“击杀”保留暴力及致命意味，同时以“仿佛”显明希伯来语省略比较词的震撼性对照。
- source_word: זוֹבֵחַ הַשֶּׂה
  choice: 献羊羔的
  rationale: שה可泛指羊群中的绵羊或山羊；献祭语境中译作“羊羔”自然，但不进一步规定祭牲种类。
- source_word: עֹרֵף כֶּלֶב
  choice: 仿佛打断狗的颈项
  rationale: ערף在此指折断颈项，尤可用于仪式性的断颈动作，并非通常意义的斩首。
- source_word: מַעֲלֵה מִנְחָה
  choice: 献素祭的
  rationale: מנחה在祭祀语境中特指以谷物为主的祭物；采用现代中文圣经语体中清楚而简洁的“素祭”。
- source_word: דַּם חֲזִיר
  choice: 仿佛献上猪血
  rationale: 原文是简短的名词结构；按上下文补出“献上”，使中文关系清楚，并保留猪血所带来的不洁与冒犯意象。
- source_word: מַזְכִּיר לְבֹנָה
  choice: 献乳香作纪念祭的
  rationale: זכר的使役式在献祭用语中可指使人记念，即献上纪念部分；此译法保留祭仪含义，又避免把动作过度具体化为焚烧。
- source_word: מְבָרֵךְ אָוֶן
  choice: 仿佛称颂邪恶
  rationale: און可指邪恶、罪孽、虚妄，某些语境也涉及偶像崇拜；“邪恶”保留宽泛的道德与宗教谴责，“称颂”则自然表达ברך在此的正面认可意味。
- source_word: גַּם הֵמָּה בָּחֲרוּ בְדַרְכֵיהֶם
  choice: 他们也选择了自己的道路
  rationale: “也”体现גם המה的强调，“自己的道路”传达他们按己意而行的语境含义。
- source_word: וּבְשִׁקּוּצֵיהֶם נַפְשָׁם חָפֵצָה
  choice: 他们的心喜爱自己可憎之物
  rationale: נפש在此指人的内在生命、意愿；译作“心”比直译“灵魂”更符合现代汉语。שקוצים保留为“可憎之物”，不把所指限定为偶像或某一种行为。
theological_decisions:
- issue: 合宜祭物与暴行、污秽行为之间的关系
  choice: 各分句补出“仿佛”，表达震撼性的类比和等同评价
  alternative: 不加比较词，直接译成并列等式
  rationale: 希伯来语没有明写比较词，却以并列结构把外在合规的献祭与杀人、断狗颈、献猪血等行为相提并论。“仿佛”使现代中文读者准确把握修辞关系，同时不进一步断言这些礼仪在何种机制下被算为罪行。
- issue: און的所指
  choice: 邪恶
  alternative: 偶像；罪孽；虚妄
  rationale: 该词可能带有偶像崇拜色彩，但本节并未明确指定某一偶像；译作“邪恶”保留其道德和宗教层面的开放性。
- issue: נפשם的集体单数表达
  choice: 他们的心
  alternative: 他们的灵魂；他们内心
  rationale: 原文以单数名词和单数阴性动词集合性地描述众人。“他们的心”在中文中自然，并保留共同内在倾向的意味。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话，以四组平行分句保留先知言辞的节奏和冲击力；祭祀术语使用“素祭”“乳香”“纪念祭”，并避免用解释性措辞消解原文对外在敬拜与可憎行为之间的神学张力。
