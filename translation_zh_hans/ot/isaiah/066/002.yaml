source:
  edition: WLC
  text: וְ/אֶת כָּל אֵ֨לֶּה֙ יָדִ֣/י עָשָׂ֔תָה וַ/יִּהְי֥וּ כָל אֵ֖לֶּה נְאֻם יְהוָ֑ה וְ/אֶל זֶ֣ה אַבִּ֔יט אֶל עָנִי֙ וּ/נְכֵה ר֔וּחַ וְ/חָרֵ֖ד עַל דְּבָרִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/002.yaml
  text: 'My hand made all these things[a], and so all these things came to be, declares Yahweh. But to this one I will look: to the poor and contrite in spirit, and the one who trembles at my word.'
translation:
  language: zh_hans
  text: “我手造了这一切，这一切便成了。”这是雅威的宣告。“但我要看顾这样的人：困苦、心灵破碎的人[a]，因我的话而战兢的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦、心灵破碎的人”或译“卑微、心灵受创的人”。
    reason: עָנִי可指困苦、贫穷或卑微；נְכֵה רוּחַ可指受击、受伤或破碎的心灵。脚注保留该词组的语义幅度。
lexical_decisions:
- source_word: יָדִי עָשָׂתָה
  choice: 我亲手造的
  rationale: 保留“我的手造了”的拟人表达，并用现代汉语自然的“亲手”表达上帝亲自创造；完成体译为已经成就的创造行动。
- source_word: כָּל אֵלֶּה
  choice: 这一切
  rationale: 承接上一节的天与地；汉语无需补出“事物”，仍可清楚表达复数所指。
- source_word: וַיִּהְיוּ כָל אֵלֶּה
  choice: 这一切也就都有了
  rationale: 表达 היה 所指的结果性存在：万物因上帝创造而存在；“也就”自然呈现前后因果联系，又不过度扩写。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: 保留庄严的先知宣告公式，并将四字神名按 Yahweh 音译为“雅威”。
- source_word: וְאֶל זֶה אַבִּיט
  choice: 但我所看顾的是这样的人
  rationale: “但”体现与上文的转折；אַבִּיט 字面为“观看”，此处含关注、眷顾之意，译为“看顾”既保留视觉意象，也符合自然汉语。
- source_word: עָנִי
  choice: 困苦
  rationale: 该词可指贫穷、受苦或卑微的人；“困苦”保留物质与受压迫处境的开放性，不将其单纯灵意化为“谦卑”。
- source_word: נְכֵה רוּחַ
  choice: 心灵受创
  rationale: נכה 表示受击打、受伤或破碎；“心灵受创”较贴近词面，并保留其可能指受苦或内在破碎的含混性。
- source_word: חָרֵד עַל דְּבָרִי
  choice: 因我的话而战兢
  rationale: עַל 在此可表达面对或由于上帝话语而生的战兢；“因……而战兢”保留敬畏与惧怕的张力，且“话”依原文用单数。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”对应 Yahweh 的常见现代音译，避免以称号替代专名。
- issue: וְאֶל זֶה אַבִּיט 所表达的神圣关注
  choice: 我所看顾的是这样的人
  alternative: 我要看这样的人
  rationale: 语境很可能表达带恩宠的关注，但原文仍采用“看”的意象；“看顾”传达正面的眷注而不扩展为特定救恩教义。
- issue: עָנִי וּנְכֵה רוּחַ 的理解
  choice: 困苦、心灵受创
  alternative: 卑微、心灵破碎
  rationale: 原词组同时容许社会处境与内在状态的理解；正文避免把 עָנִי 只解释为属灵谦卑，并以脚注保留常见替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以直接引语呈现神谕；“亲手”“也就都有了”“看顾”“战兢”兼顾自然表达与希伯来文意象。脚注标记 [a] 已置于其所说明的词组之后。
