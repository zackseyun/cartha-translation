revisions:
- from: “这一切都是我亲手造的；这一切也就都有了。”雅威宣告说，“但我所看顾的是这样的人：困苦、心灵受创的人[a]，因我的话而战兢的人。”
  to: “我手造了这一切，这一切便成了。”这是雅威的宣告。“但我要看顾这样的人：困苦、心灵破碎的人[a]，因我的话而战兢的人。”
  rationale: 修订主要恢复“我要看顾”的原文语气，改善创造结果和先知宣告公式的汉语表达，并以“心灵破碎”贴近נְכֵה רוּחַ；脚注保留“受创”及“卑微”等可行替代义。
