source:
  edition: WLC
  text: כִּ֤י בָ/אֵשׁ֙ יְהוָ֣ה נִשְׁפָּ֔ט וּ/בְ/חַרְבּ֖/וֹ אֶת כָּל בָּשָׂ֑ר וְ/רַבּ֖וּ חַֽלְלֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/016.yaml
  text: For by fire Yahweh will execute judgment[a], and by his sword, against all flesh[b]; and many will be those slain by Yahweh.
translation:
  language: zh_hans
  text: 因为耶和华必用火和他的刀审判[a]一切有血肉的[b]；被耶和华杀死的人必多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华必用火和他的刀与一切有血肉的进入审判。”该希伯来语动词也可简译为“审判”，并可带有“与……争辩、对质”的司法意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“所有肉体”。这是先知书中常用的表达，在此泛指全人类，同时突显人作为有血肉之身、必死的受造者。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明前述行动的原因；现代汉语中“因为”自然保留其解释性连接作用。
- source_word: בָאֵשׁ
  choice: 用火
  rationale: 此处介词 בְּ 表示施行审判的手段；“用火”自然、简洁，并保留原文意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，而不以“主”这一称号代替；“耶和华”是现代中文圣经语境中广为人知的音译。
- source_word: נִשְׁפָּט
  choice: 施行审判
  rationale: 此处 Niphal 形式表达进入或实施司法审判的行动；“施行审判”比单说“审判”更明确，也符合自然汉语。
- source_word: וּבְחַרְבּוֹ
  choice: 用他的刀
  rationale: 介词表示手段；保留“刀”的战争与审判意象，不将其限定为字面或比喻意义。
- source_word: אֶת כָּל בָּשָׂר
  choice: 审判凡有血肉的
  rationale: אֶת 在这一司法结构中指向审判所针对的对象。补出“审判”使汉语句法清楚；“凡有血肉的”保留原文的身体性和普遍范围。
- source_word: וְרַבּוּ
  choice: 必多
  rationale: 简洁表达数量众多，并与后置主语“被耶和华杀死的”构成庄重自然的汉语句式。
- source_word: חַלְלֵי יְהוָה
  choice: 被耶和华杀死的
  rationale: 构造短语在语境中指遭耶和华击杀的人；用被动表达明确施事关系，而不额外解释审判方式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 保留专名而不以“主”替代；采用现代简体中文圣经读者最熟悉、最易辨认的传统音译，同时不把音译形式本身提升为教义判断。
- issue: כָּל בָּשָׂר 的范围
  choice: 凡有血肉的
  alternative: 全人类
  rationale: 保留希伯来语先知性用语的身体性、受造性与普遍范围，避免把原文直接抽象化为解释性较强的“全人类”。
- issue: נִשְׁפָּט 的司法含义
  choice: 施行审判
  alternative: 进入审判／审判
  rationale: 上下文强调神以火与刀执行司法行动；“施行审判”自然地传达这一含义，脚注同时保留更贴近该动词形式的另一种表达可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“施行审判”保持司法语气；“用火……用他的刀”保留平行结构和审判意象；末句使用“被耶和华杀死的必多”，维持原文沉重、警告性的语调。
