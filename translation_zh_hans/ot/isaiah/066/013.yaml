  text: כְּ/אִ֕ישׁ אֲשֶׁ֥ר אִמּ֖/וֹ תְּנַחֲמֶ֑/נּוּ כֵּ֤ן אָֽנֹכִי֙ אֲנַ֣חֶמְ/כֶ֔ם וּ/בִ/ירֽוּשָׁלִַ֖ם תְּנֻחָֽמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/013.yaml
  text: As one whom his mother comforts[a], so I will comfort you; and in Jerusalem you will be comforted.
translation:
  language: zh_hans
  text: 正如一个男子[a]受到他母亲的安慰，我也必照样安慰你们；你们必在耶路撒冷得安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“正如一个男子，他的母亲安慰他。”希伯来语在这里使用阳性单数“男子”（אִישׁ）；此词也可作代表性表达。
    reason: 说明原文阳性单数的措辞及其代表性用法，同时不以“孩子”替换正文中的“男子”。
lexical_decisions:
- source_word: כְּאִישׁ
  choice: 自己的孩子
  rationale: אִישׁ 是阳性单数，直译可作“一个男子”；但在这个母子关系的比喻中，现代汉语用“自己的孩子”更自然，也清楚表达其代表性所指。原文的阳性形式在脚注中保留。
- source_word: אִמּוֹ
  choice: 母亲
  rationale: 名词带第三人称阳性单数后缀，意为“他的母亲”。译作“母亲怎样安慰自己的孩子”，以自然汉语保留明确的亲属关系。
- source_word: תְּנַחֲמֶנּוּ
  choice: 安慰
  rationale: נחם 的 Piel 形式表示主动安慰；采用“安慰”，并在本节三次出现该词根之处保持词语呼应。
- source_word: כֵּן
  choice: 也必照样
  rationale: 标明比喻的对应部分；“照样”自然地承接前面的“怎样”，“必”与后续未完成式在应许语境中的将来意味相称。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词带有强调；汉语借助“我也必照样”的句式自然体现，不另加过强的“我亲自”。
- source_word: אֲנַחֶמְכֶם
  choice: 安慰你们
  rationale: 对象为第二人称阳性复数；“你们”准确保留复数，并继续使用“安慰”以呈现原文重复。
- source_word: וּבִירוּשָׁלַם
  choice: 你们必在耶路撒冷
  rationale: בְּ 表示地点，译为“在耶路撒冷”；连接词 וּ 在汉语分号后的连贯结构中无需机械译作“并且”。
- source_word: תְּנֻחָמוּ
  choice: 得安慰
  rationale: Pual 形式表达被动意义。“得安慰”是自然、庄重的汉语，也保留与前两处“安慰”的词根呼应。
theological_decisions:
- issue: 比喻中的阳性代表性语言
  choice: 正文采用自然的亲属表达“自己的孩子”，脚注注明原文阳性单数
  alternative: 一个男子怎样受他母亲安慰
  rationale: 希伯来文 אִישׁ 明确为阳性单数，但在此作代表性比喻。若正文译成“一个男子”，现代汉语容易特别强调成年男性，反而可能缩窄经文的修辞作用；正文以自然汉语传意，同时脚注透明保留原文形式，不据此引入额外教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“母亲怎样……我也必照样……”保留原文比喻的平行结构；三处均以“安慰”对应 נחם，突出经文的关键词重复。
