  text: וְ/אָנֹכִ֗י מַעֲשֵׂי/הֶם֙ וּ/מַחְשְׁבֹ֣תֵי/הֶ֔ם בָּאָ֕ה לְ/קַבֵּ֥ץ אֶת כָּל הַ/גּוֹיִ֖ם וְ/הַ/לְּשֹׁנ֑וֹת וּ/בָ֖אוּ וְ/רָא֥וּ אֶת כְּבוֹדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/018.yaml
  text: For I know their works and their thoughts[a]. The time is coming to gather all the nations and tongues[b], and they will come and see my glory.
translation:
  language: zh_hans
  text: 至于我——他们的行为和意念——那将要来临，为要召集万国和说各种语言的民众；他们必来，看见我的荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文在“至于我——他们的行为和意念——将要来临”处突兀且难解，直译近似：“至于我，他们的行为和意念，来临，为要召集万国和各种舌头。”也可理解为：“因为我知道他们的行为和意念；时候将到，要召集万国和各种语言。”这里“各种舌头”字面指语言，也可转指说各种语言的群体。
    reason: 说明原文残缺、难解的句法，保留主要通顺化读法，并交代“舌头”作为语言／语言群体的词义。
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: 至于我
  rationale: 保留独立代词אָנֹכִי的强调作用，并以“至于”体现希伯来文突兀转折，不擅自补入“知道”。
- source_word: מַעֲשֵׂיהֶם
  choice: 他们的行为
  rationale: מעשה在这里指人的所作所为；“行为”自然、庄重，也适合审判语境。
- source_word: וּמַחְשְׁבֹתֵיהֶם
  choice: 他们的意念
  rationale: מחשבות可指思想、谋算或意图；“意念”保留较宽的语义，并与“行为”相配。
- source_word: בָּאָה לְקַבֵּץ
  choice: 我要来召集
  rationale: 原文阴性单数完成式在句法上困难；按上下文取将来指向，并使其与“召集”的目的结构相连，同时在脚注交代不确定性。
- source_word: כָּל־הַגּוֹיִם וְהַלְּשֹׁנוֹת
  choice: 万国万族
  rationale: גוים是列国；לשנות字面为“舌头”，转指不同语言的群体。汉语“万国万族”自然表达普世范围，但脚注保留“各种语言”的字面可能。
- source_word: וּבָאוּ וְרָאוּ
  choice: 他们必来瞻仰
  rationale: 在预言序列中作将来理解；“瞻仰”兼具“看见”与面对神显现之荣耀的庄重语感。
- source_word: כְּבוֹדִי
  choice: 我的荣耀
  rationale: “荣耀”准确承载כבוד在以赛亚书中神圣显现的意义和经文互文分量。
theological_decisions:
- issue: 如何处理本节开头残缺而突兀的希伯来句法
  choice: 在正文中保留“至于我——他们的行为和他们的意念——我要来……”这一突兀结构
  alternative: 补作“因为我知道他们的行为和意念；时候将到，我要召集……”
  rationale: 马所拉文本没有“知道”或“时候”这些明示词语。正文不宜把一种解释定为原文，而应保留其真实歧义，并由脚注说明主要通顺化方案。
- issue: לשנות所指为何
  choice: 万族
  alternative: 各种语言／各方言
  rationale: 该词字面是“舌头”，可转指语言，也可借语言指群体；正文采用自然的群体表达，脚注保留字面词义。
translation_notes:
  register: 采用现代、庄重而可懂的书面普通话。“至于我——……——”有意保留原文的不完整感；“瞻仰我的荣耀”保持神圣显现语境的庄重性。
