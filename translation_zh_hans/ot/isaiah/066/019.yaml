  text: וְ/שַׂמְתִּ֨י בָ/הֶ֜ם א֗וֹת וְ/שִׁלַּחְתִּ֣י מֵ/הֶ֣ם פְּ֠לֵיטִים אֶֽל הַ/גּוֹיִ֞ם תַּרְשִׁ֨ישׁ פּ֥וּל וְ/ל֛וּד מֹ֥שְׁכֵי קֶ֖שֶׁת תֻּבַ֣ל וְ/יָוָ֑ן הָ/אִיִּ֣ים הָ/רְחֹקִ֗ים אֲשֶׁ֨ר לֹא שָׁמְע֤וּ אֶת שִׁמְעִ/י֙ וְ/לֹא רָא֣וּ אֶת כְּבוֹדִ֔/י וְ/הִגִּ֥ידוּ אֶת כְּבוֹדִ֖/י בַּ/גּוֹיִֽם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/019.yaml
  text: And I will set a sign among them[a], and from them I will send survivors to the nations—to Tarshish, Pul, and Lud, who draw the bow; to Tubal and Javan[d][c][b]; to the distant coastlands that have not heard my report and have not seen my glory—and they will declare my glory among the nations.
translation:
  language: zh_hans
  text: 我要在他们中间设立一个记号[a]，并从他们中间差遣逃脱的人到列国去：到他施、普勒和拉弓的路德[b]，到土巴和雅完，也到那些遥远的海岛[c]；那些海岛没有听过关于我的消息[d]，也没有见过我的荣耀。那些逃脱的人要在列国中宣扬我的荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他们中间”也可译作“在他们里面”或“在他们身上”；希伯来语介词容许这些不同侧重。
    reason: lexical_alternative
  - marker: b
    text: “拉弓的”最自然地描述“路德”；也可较概括地译作“弓箭手”。
    reason: lexical_alternative
  - marker: c
    text: “海岛”也可译作“沿海地区”，这里泛指遥远的海上或沿海地域。
    reason: lexical_alternative
  - marker: d
    text: “关于我的消息”也可译作“我的名声”或“关于我的传闻”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: 我要……设立
  rationale: שׂים意为“放置、设立”；与“记号”搭配时，“设立”自然庄重，也体现上帝主动施行的行动。
- source_word: בָהֶם
  choice: 在他们中间
  rationale: 介词ב可表达“在……里面、在……上、在……中间”；此处按群体理解为“在他们中间”，同时以脚注保留其他可能。
- source_word: אוֹת
  choice: 一个记号
  rationale: אוֹת可指记号、标记或征兆；“记号”范围较宽，不预先判定其具体性质。
- source_word: מֵהֶם פְּלֵיטִים
  choice: 从他们中间……逃脱的人
  rationale: מֵהֶם表示“从他们中间”，פְּלֵיטִים指从灾难中逃脱或存留下来的人；“逃脱的人”贴近词义，并适合其受差遣的语境。
- source_word: אֶל הַגּוֹיִם
  choice: 到列国去
  rationale: גּוֹיִם在这里泛指众多外邦国家或民族；“列国”符合先知书语体，且不额外引入神学分类。
- source_word: תַּרְשִׁישׁ פּוּל וְלוּד ... תֻּבַל וְיָוָן
  choice: 他施、普勒、路德……土巴、雅完
  rationale: 按现代中文圣经地名的常见音译处理这些专名。
- source_word: מֹשְׁכֵי קֶשֶׁת
  choice: 善于拉弓的
  rationale: 字面为“拉弓者”；在句法上最自然地修饰紧邻的“路德”。“善于拉弓的”保留原有形象，并以脚注说明也可概括译为“弓箭手”。
- source_word: הָאִיִּים הָרְחֹקִים
  choice: 遥远的海岛
  rationale: אִיִּים可指岛屿或沿海地区；“海岛”自然并符合先知文学用语，脚注保留“沿海地区”的可能。
- source_word: אֲשֶׁר לֹא שָׁמְעוּ אֶת שִׁמְעִי
  choice: 没有听过关于我的传闻
  rationale: שִׁמְעִי可指关于上帝的消息、传闻或名声；“关于我的传闻”既保持宾语结构，也避免只译作抽象的“名声”。
- source_word: וְלֹא רָאוּ אֶת כְּבוֹדִי
  choice: 也没有见过我的荣耀
  rationale: כָּבוֹד在神圣语境中译为“荣耀”；保留“看见荣耀”这一具体而具有神学张力的表达。
- source_word: וְהִגִּידוּ אֶת כְּבוֹדִי בַּגּוֹיִם
  choice: 要在列国中宣扬我的荣耀
  rationale: נגד的使役形表示宣告、传扬；“宣扬”清楚表达公开述说，并保留“我的荣耀”为直接内容。
theological_decisions:
- issue: 上帝所设“记号”的性质
  choice: 保留宽泛的“一个记号”，不解释其具体形式。
  alternative: 译作“一个标记”或理解为神迹、旗号。
  rationale: 希伯来文本没有说明记号究竟是加在人身上的标志、公开的征兆，还是其他形式；不应由译文替文本作出神学判定。
- issue: “他们”以及“从他们中间”的所指
  choice: 继续使用代词，不在译文中明确其群体身份。
  alternative: 明确译为以色列余民、敬拜者或审判后的幸存者。
  rationale: 本节本身没有重述先行词；保留代词可以避免把上下文中的一种解释固定为唯一所指。
- issue: 宣扬荣耀者的身份
  choice: 第二句明示为“那些逃脱的人”。
  alternative: 仅用“他们”。
  rationale: 希伯来语动词主语承接前文的פְּלֵיטִים；中文若只用“他们”可能误指遥远海岛的人，因此适度复现名词以保证指代清楚，而不增加新的身份界定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”“荣耀”等保留先知书的圣经语域；拆分末尾长句，并复现“那些逃脱的人”，以消除中文代词歧义。所有不确定之处均以正文中的脚注标记对应说明。
