revisions:
- from: 我要在他们中间设立一个记号[a]，并从他们中间差遣逃脱的人到列国去，就是到他施、普勒和善于拉弓的路德[b]，到土巴和雅完，也到遥远的海岛[c]；这些地方的人没有听过关于我的传闻[d]，也没有见过我的荣耀。那些逃脱的人要在列国中宣扬我的荣耀。
  to: 我要在他们中间设立一个记号[a]，并从他们中间差遣逃脱的人到列国去：到他施、普勒和拉弓的路德[b]，到土巴和雅完，也到那些遥远的海岛[c]；那些海岛没有听过关于我的消息[d]，也没有见过我的荣耀。那些逃脱的人要在列国中宣扬我的荣耀。
  rationale: 修订仅处理两项安全且必要的文本问题：第一，恢复关系从句对“遥远的海岛”的紧邻指向，避免译文将其扩大为所有已列地点的居民；第二，删去“善于”所带出的额外程度含义。其余措辞、专名、神学开放性及脚注体系均予保留。
  reviewer_model: gpt-5.6-terra
