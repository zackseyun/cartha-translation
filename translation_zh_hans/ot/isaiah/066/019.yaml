  naturalness: 整体庄重通顺，符合现代标准汉语的先知书语域。将末句主语复现为“那些逃脱的人”有助于消除中文代词歧义。修订后将“没有听过……也没有见过……”直接归于“遥远的海岛”，句法更清晰自然。
  terminology: “记号”“列国”“荣耀”、专名音译及“海岛”均合适。“拉弓的路德”比“善于拉弓的路德”更贴近原文的“拉弓者”，不额外加入技艺娴熟的含义。“关于我的消息”可保留שמע所含的报告／消息与名声之间的开放性。
