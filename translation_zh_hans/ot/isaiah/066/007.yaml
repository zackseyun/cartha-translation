  text: בְּ/טֶ֥רֶם תָּחִ֖יל יָלָ֑דָה בְּ/טֶ֨רֶם יָב֥וֹא חֵ֛בֶל לָ֖/הּ וְ/הִמְלִ֥יטָה זָכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/007.yaml
  text: Before she was in labor[a], she gave birth; before pain came upon her[b], she delivered a son.
translation:
  language: zh_hans
  text: 她[a]还没有临产，就生下了孩子；产痛还没有临到她，她就生下一个男孩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“她”在上下文中指锡安（耶路撒冷）。
    reason: cross_reference
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: 还没有……就
  rationale: 希伯来语时间连接语在两句中重复，表示“尚未发生某事，另一事已经发生”。中文采用“还没有……就”既自然，也保留出人意料的先后关系。
- source_word: תָּחִיל
  choice: 临产
  rationale: 该动词在分娩语境中指经历生产的痛苦、进入产程；“临产”是现代汉语中简洁自然的表达。
- source_word: יָלָדָה
  choice: 生下了孩子
  rationale: 该动词通常表示生育。原文此处未明说孩子性别；补出“孩子”使中文句意完整，同时让末句的“男孩”保留信息递进。
- source_word: יָבֹא
  choice: 临到
  rationale: 与表示产痛的名词及指向她的介词短语连用，意为产痛来到她身上；“临到她”自然且保留原文意象。
- source_word: חֵבֶל
  choice: 产痛
  rationale: 此词在上下文中特指分娩时的疼痛。“产痛”比泛称“疼痛”更准确，也避免读者误解。
- source_word: וְהִמְלִיטָה
  choice: 她就生下
  rationale: 使役形在这里表示产出、娩出孩子；现代中文用“生下”最清楚自然。
- source_word: זָכָר
  choice: 一个男孩
  rationale: 字面为“男性”。在出生语境中译作“一个男孩”自然，并保留原文明确的男性性别信息。
theological_decisions:
- issue: 女性主体所指
  choice: 正文保留“她”，不直接替换为锡安或耶路撒冷
  alternative: 将“她”明译为“锡安”或“耶路撒冷”
  rationale: 上下文表明这一女性形象指向锡安／耶路撒冷，但本节自身以阴性动词和代词维持拟人意象。正文保留“她”，脚注交代上下文所指，以免把解释直接写入经文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“临产—产痛—生下”构成清晰的分娩语义场；重复“还没有……就”以体现原文两次 בְּטֶרֶם 的平行和强调。
