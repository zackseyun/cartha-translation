id: ISA.66.24
reference: Isaiah 66:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יָצְא֣וּ וְ/רָא֔וּ בְּ/פִגְרֵי֙ הָ/אֲנָשִׁ֔ים הַ/פֹּשְׁעִ֖ים בִּ֑/י כִּ֣י תוֹלַעְתָּ֞/ם לֹ֣א תָמ֗וּת וְ/אִשָּׁ/ם֙ לֹ֣א תִכְבֶּ֔ה וְ/הָי֥וּ דֵרָא֖וֹן לְ/כָל בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/024.yaml
  text: And they will go out and look on the corpses of the men who rebelled against me[a]. For their worm will not die, and their fire will not be quenched[c][b], and they will be an abhorrence to all flesh.
translation:
  language: zh_hans
  text: 他们要出去，观看那些背叛我的人的尸首。他们的虫[a]不会死，他们的火不会熄灭；他们必成为凡有血肉的人[c]所憎恶之物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蛆”；希伯来语这个词可指虫、幼虫或蛆。
    reason: lexical_alternative
  - marker: b
    text: 或译“可憎之物”或“令人惊骇之物”。
    reason: lexical_alternative
  - marker: c
    text: “凡有血肉的人”是希伯来语表达，意为所有人或全人类。
    reason: cultural_note
lexical_decisions:
- source_word: וְיָצְאוּ וְרָאוּ
  choice: 他们要出去，观看
  rationale: 两个动词延续本段面向将来的叙述；ראה与介词ב连用，在此不只是偶然“看见”，而有注目观看之意。
- source_word: בְּפִגְרֵי הָאֲנָשִׁים
  choice: 那些人的尸首
  rationale: פגר明确指尸体；“尸首”自然、庄重，也保留原文鲜明而严峻的画面。אֲנָשִׁים在此指具体的一群人，现代汉语无需另行标示语法性别。
- source_word: הַפֹּשְׁעִים בִּי
  choice: 背叛我的
  rationale: פשׁע表达越界、反叛，בִּי指出反叛所针对的是说话者；“背叛”比泛称“犯罪”更能体现主动抗拒。
- source_word: תוֹלַעְתָּם
  choice: 他们的虫
  rationale: תולעת可指虫、蛆或幼虫；正文用较宽泛且具有经文互文辨识度的“虫”，脚注说明更具体的可能译法。
- source_word: לֹא תָמוּת וְאִשָּׁם לֹא תִכְבֶּה
  choice: 不会死，他们的火不会熄灭
  rationale: 保留两个否定分句的平行结构；כבה用于火时自然译作“熄灭”，不额外解释火的性质。
- source_word: דֵרָאוֹן
  choice: 所憎恶之物
  rationale: 这一罕见名词表示令人厌恶、可憎之物；名词化表达保留原文的结果状态和强烈排斥意味。
- source_word: לְכָל־בָּשָׂר
  choice: 凡有血肉的人
  rationale: 按希伯来语意象译出“有血肉”，同时以“人”明确此处指全人类，而不是一切动物。
theological_decisions:
- issue: 审判景象的性质
  choice: 具体保留尸首、不死的虫和不灭的火等审判图景，不在译文中进一步界定其形而上性质或惩罚机制。
  alternative: 将整幅图景直接抽象化为羞辱与失败，或将其扩写成一套完整的永刑教义。
  rationale: 本节本身陈述可见的审判后果，却没有系统解释这些意象；译文应保留其具体性、张力和开放边界。
- issue: 复数代词“他们”的所指
  choice: 保留“他们的虫”“他们的火”“他们必成为”的复数关联，不强行改写为虫火直接作用于仍有意识的人。
  alternative: 明确补入“吞吃他们”或“使他们永远受苦”等原文没有的说明。
  rationale: 希伯来文以代词把虫、火和可憎状态与这些反叛者相连，但本节聚焦其尸首；直译关联而不增补，可避免超出文本解决神学问题。
- issue: הָאֲנָשִׁים的性别表达
  choice: 译作“人”，不特指“男人”。
  alternative: 译作“男人”。
  rationale: 希伯来语אֲנָשִׁים虽为阳性复数形式，却常是“人们”的普通复数；上下文没有证据表明审判对象仅限男性。现代汉语“人”准确涵盖这群具体的反叛者。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“尸首”“熄灭”“所憎恶之物”维持先知书结语的肃穆与震撼；句式保留原文连续推进及虫、火两项的平行结构。
