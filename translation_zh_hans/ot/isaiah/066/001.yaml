base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/001.yaml
  text: 'Thus says Yahweh: Heaven is my throne[a], and the earth is my footstool. What kind of house would you build for me[c][b], and what place would be my resting place?'
translation:
  language: zh_hans
  text: '耶和华如此说：


    “天是我的宝座，

    地是我的脚凳。

    你们要为我建造怎样的房屋呢？[a]

    什么地方可作我安息之所呢？[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”原文可指房屋；在此语境中可能暗指圣殿。此问为反问。
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 也可译作“我安息的地方”或“我的安息之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，而不是以称号替代专名。
- source_word: הַשָּׁמַיִם
  choice: 天
  rationale: 这里指与地相对的宇宙领域；单数“天”在中文中自然凝练。
- source_word: כִּסְאִי
  choice: 我的宝座
  rationale: 直接保留原文的君王意象。
- source_word: וְהָאָרֶץ
  choice: 地
  rationale: 与“天”形成简洁、对称的宇宙性对照。
- source_word: הֲדֹם רַגְלָי
  choice: 我的脚凳
  rationale: 准确保留原文意象，也是自然通行的中文说法。
- source_word: אֵי זֶה
  choice: 怎样的／哪里能作
  rationale: 该短语在两个平行问句中带有反问意味，强调人所造之物不足以容纳上帝；依各自宾语用自然中文表达。
- source_word: בַיִת
  choice: 殿宇
  rationale: 原词本义为“房屋”，语境明显指敬拜建筑；“殿宇”既保留“房屋”概念，又不如直接译作“圣殿”那样过度限定。
- source_word: אֲשֶׁר תִּבְנוּ לִי
  choice: 你们能为我建造
  rationale: 用“能”传达原文反问所强调的能力与相称性问题，而非询问实际计划。
- source_word: מָקוֹם מְנוּחָתִי
  choice: 我安息的地方
  rationale: 自然表达“我的安息之处”，并保留“地方”与前句建筑空间的平行关系。
theological_decisions:
- issue: 是否将 בַיִת 明确译为“圣殿”
  choice: 殿宇
  alternative: 房屋／圣殿
  rationale: 经文语境暗指圣殿，但原文只说“房屋”。“殿宇”能提示敬拜建筑，又不把隐含意义完全写死。
- issue: 反问是否表达上帝绝对不需要任何圣所
  choice: 保留反问，不增添解释
  alternative: 直陈“你们不能为我建殿”
  rationale: 原文质疑人所建居所是否足以与上帝相称，却未在本句直接否定圣殿的一切功能；保留张力可避免导入额外神学结论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，并按希伯来诗歌的平行结构分行。“能……怎样”与“哪里能……”体现反问力度，但不把隐含结论改写成直陈句。
