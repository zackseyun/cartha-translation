  text: ק֤וֹל שָׁאוֹן֙ מֵ/עִ֔יר ק֖וֹל מֵֽ/הֵיכָ֑ל ק֣וֹל יְהוָ֔ה מְשַׁלֵּ֥ם גְּמ֖וּל לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/006.yaml
  text: A sound of uproar from the city[a], a sound from the temple[c][b], the sound of Yahweh repaying recompense to his enemies.
translation:
  language: zh_hans
  text: 城中传来喧嚷的声音[a][b]，圣殿中传来声音[c]；这是雅威向他的仇敌施行报应的声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文三次使用同一个词，可译为“声音”“嗓音”或“响声”，形成反复的修辞效果。
    reason: lexical_alternative
  - marker: b
    text: “喧嚷”也可译为“骚动”“喧嚣”或“轰响”。
    reason: lexical_alternative
  - marker: c
    text: “圣殿”所译的希伯来词在其他语境中也可指“宫殿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: 声音
  rationale: 该词可指声音、嗓音或响声。这里没有明确的言语内容，而是营造听觉场景；译作“声音”既自然，也尽量保留原文三次重复所形成的修辞效果。
- source_word: שָׁאוֹן
  choice: 喧嚷
  rationale: 该词表示嘈杂的骚动、喧嚣或轰响。“喧嚷”能表现审判场景中的剧烈动静，又不把声音过度限定为某一种具体声响。
- source_word: מֵעִיר
  choice: 从城中传来
  rationale: 介词 מִן 表示来源；中文以“从城中传来”自然表达声音发自城内。
- source_word: מֵהֵיכָל
  choice: 从圣殿中传来
  rationale: הֵיכָל 可指宫殿或圣殿；结合以赛亚书有关锡安和审判的语境，此处较可能指圣殿。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，而不以称号替代；“雅威”对应学界通常重构的读音 Yahweh。
- source_word: מְשַׁלֵּם
  choice: 施行
  rationale: 该分词在这里表示偿还、报还。与“报应”搭配译作“施行”，符合现代中文表达，并保留正在实施报还的动态意味。
- source_word: גְּמוּל
  choice: 报应
  rationale: 该词指按行为回报所得；用于“仇敌”时显然带惩罚意义。“报应”保留司法性的回报观念，且避免生硬重复。
- source_word: לְאֹיְבָיו
  choice: 向他的仇敌
  rationale: לְ 标示报还所指向的对象；代词后缀明确表示“他的”，其先行者为雅威。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名。译作“雅威”旨在按 Yahweh 的通常重构读音音译，并避免用“主”等称号替代；“耶和华”则是中文传统上依据 Jehovah 形成的通行译名。
- issue: גְּמוּל 在审判语境中的性质
  choice: 报应
  alternative: 报偿
  rationale: 该名词本身可泛指按行为所得的回报，但受词是雅威的仇敌，因此本节语境明确偏向惩罚性的报还；“报应”自然传达这一点，又没有增添具体刑罚内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“传来”补足中文声音来源句所需的自然表达；保留三次“声音”，呈现原文的听觉递进。分号划分前两项声响与最后对声响来源和意义的说明。
