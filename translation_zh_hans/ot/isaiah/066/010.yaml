  register: 采用现代、庄重而易懂的普通话。用“欢喜、快乐、欢欣、喜乐”表现原文密集而有层次的喜乐词汇；保留“她”对耶路撒冷的拟人化。呼语“所有……的人哪”突出先知直接召唤的语气。
