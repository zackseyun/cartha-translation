base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/010.yaml
  text: Rejoice with Jerusalem and be glad in her[a], all you who love her; rejoice with her in joy[b], all you who mourn over her.
translation:
  language: zh_hans
  text: 你们要与耶路撒冷一同欢喜[a]，也要因她欢腾；所有爱她的人哪！所有为她哀恸的人哪，都要与她一同欢欣，大大喜乐[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要为耶路撒冷欢喜。”希伯来语在“欢喜”后使用 אֶת；此结构可理解为以耶路撒冷为喜乐的对象。下文“因她”和“与她一同”的平行表达，则支持正文“与耶路撒冷一同欢喜”的理解。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语在“欢欣”的动词后使用同源的“喜乐”一词来加强语气；也可较直译为：“与她一同欢欣，满有欢欣。”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ אֶת־יְרוּשָׁלִַם
  choice: 要与耶路撒冷一同欢喜
  rationale: שׂמח是复数命令式；אֶת在此可能标示欢喜的对象，也可能表达共同欢喜。结合后文בָהּ与אִתָּהּ的平行关系，正文采用共同欢喜之意，同时以脚注保留另一种理解。
- source_word: וְגִילוּ בָהּ
  choice: 也要因她快乐
  rationale: גיל表示欢腾、快乐；בָהּ在此自然理解为以耶路撒冷为喜乐的缘由或对象。“因她快乐”既符合现代汉语，也与前句有所区分。
- source_word: כָּל־אֹהֲבֶיהָ
  choice: 所有爱她的人哪
  rationale: 分词表达以爱耶路撒冷为特征的人；加“哪”显明呼语语气，并保留城市女性化的人格描写。
- source_word: שִׂישׂוּ אִתָּהּ מָשׂוֹשׂ
  choice: 都要与她一同欢欣，大大喜乐
  rationale: אִתָּהּ明确表示“与她一同”；动词שׂישׂ与同源名词מָשׂוֹשׂ连用以加强语气。汉语用“欢欣，大大喜乐”再现强调，避免生硬的同词重复。
- source_word: כָּל־הַמִּתְאַבְּלִים עָלֶיהָ
  choice: 所有为她哀恸的人哪
  rationale: התאבל表示哀悼、哀恸；עַל指出哀恸所关涉的对象或缘由。“为她哀恸”符合现代汉语，并保留对耶路撒冷的深切哀伤。
