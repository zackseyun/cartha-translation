language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִֽי שָׁמַ֣ע כָּ/זֹ֗את מִ֤י רָאָה֙ כָּ/אֵ֔לֶּה הֲ/י֤וּחַל אֶ֨רֶץ֙ בְּ/י֣וֹם אֶחָ֔ד אִם יִוָּ֥לֵֽד גּ֖וֹי פַּ֣עַם אֶחָ֑ת כִּֽי חָ֛לָה גַּם יָלְדָ֥ה צִיּ֖וֹן אֶת בָּנֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/008.yaml
  text: Who has heard such a thing? Who has seen things like these? Can a land be brought forth in one day? Can a nation be born all at once? For Zion was in labor and also gave birth to her children[a].
translation:
  language: zh_hans
  text: 谁听见过这样的事？谁看见过这样的事？一片土地岂能在一天之内生出来？一个民族岂能一下子诞生？因为锡安经历了产痛，也生下了她的儿女[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“她的儿子们”。
    reason: 说明בָּנֶיהָ的字面阳性复数形式，同时正文按其群体性所指译作“儿女”。
lexical_decisions:
- source_word: כָּזֹאת / כָּאֵלֶּה
  choice: 这样的事
  rationale: 前者为单数、后者为复数，但现代汉语“这样的事”本身不强制标明单复数；在两个平行问句中自然地保留指示与惊异语气。
- source_word: הֲיוּחַל אֶרֶץ
  choice: 一片土地岂能……产生出来
  rationale: 该动词在此属于分娩意象的被动表达。“产生出来”保留被带入存在的含义，又避免把土地说成由母体直接“生下”所造成的生硬；“一片土地”与下句“一个民族”相呼应。
- source_word: בְּיוֹם אֶחָד
  choice: 在一天之内
  rationale: 准确表达极短的时间范围，现代汉语自然清楚。
- source_word: אִם יִוָּלֵד גּוֹי פַּעַם אֶחָת
  choice: 一个民族岂能一下子诞生
  rationale: 用“岂能”呈现连续反问，以“诞生”保留被动出生意象；“一下子”自然表达一次、同时发生的突发性。
- source_word: כִּי
  choice: （不另译连接词）
  rationale: 此处可表解释、强调或承接；汉语直接转入锡安分娩的事实，更自然地保留其对前面反问的说明作用，而不把关系限定为单一的因果连接。
- source_word: חָלָה גַּם יָלְדָה
  choice: 刚经历产痛，就生下了
  rationale: 两个完成式并列并由גַּם连接，语境突出产痛与生产紧密相随。“刚……就……”自然传达惊人的迅速性，同时未添加具体时间长度。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的专名译法，并保留其母亲形象的人格化表达。
- source_word: בָּנֶיהָ
  choice: 她的儿女
  rationale: 形式上是阳性复数“儿子们”，在这里指锡安所生的群体后裔；“儿女”在中文中可作集合性称呼，同时脚注保留较字面的译法。
theological_decisions:
- issue: 锡安的母亲人格化意象
  choice: 保留锡安经历产痛并生下儿女的母亲形象
  alternative: 抽象译作锡安或民族突然复兴
  rationale: 希伯来文明确以女性分娩描写锡安；直保留该意象可避免把先知性的张力预先解释成某一种抽象神学概念。
- issue: בָּנֶיהָ的性别与群体指向
  choice: 正文译作“她的儿女”
  alternative: 她的儿子们
  rationale: 源词在语法上为阳性复数，但语境所指是锡安整体的后裔或居民，不必限定为男性；脚注说明更字面的形式。
- issue: 土地与民族诞生的双重修辞
  choice: 分别保留“土地产生出来”与“民族诞生”
  alternative: 把两者统一解释为国家复兴
  rationale: 原文以אֶרֶץ和גּוֹי构成相关但不完全相同的平行项；译文不将两者合并，以保存地域与群体之间的诗性张力。
translation_notes:
  register: 采用庄重而现代的标准普通话；连续使用“谁……？谁……？……岂能……？……岂能……？”保存希伯来诗歌的平行反问与惊异语气。避免文言化的“产难”“劬劳”，也不将锡安的分娩意象抽象化。
