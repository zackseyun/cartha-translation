  naturalness: 原稿用语庄重自然，但“这是耶和华说的。他们要这样做，正如……”在现代汉语中略显生硬且有解释性。将宣告公式置为引语引介，并直接保留“正如……一样”的比较，行文更自然清楚。
  terminology: “耶和华”“供物”“洁净的器皿”“圣山耶路撒冷”均恰当。“弟兄”宜保留，并将其文化说明的脚注紧邻该词。“战车”比宽泛的“车辆”更贴近רכב在此运输清单中的通常含义；两个罕见运输词仍以正文的暂定译法配合脚注保留不确定性。
