revisions:
- from: 他们要把你们所有的弟兄从列国带来，用马、车辆、篷车[a]、骡子和骆驼[b]运到我的圣山耶路撒冷，作为献给耶和华的供物。这是耶和华说的。他们要这样做，正如以色列人用洁净的器皿把供物带到耶和华的殿中一样。[c]
  to: 耶和华说：“他们要把你们所有的弟兄[c]从万国带来，作为献给耶和华的供物，用马、战车、篷车[a]、骡子和骆驼[b]把他们送到我的圣山耶路撒冷；正如以色列人用洁净的器皿把供物带到耶和华的殿中一样。”
  rationale: 修订删除无原文依据的“他们要这样做”，恢复“正如……一样”的直接比较关系，并以自然的中文引语结构安置“耶和华说”。同时将c脚注移至“弟兄”后，并把“车辆”收窄为更贴近原文常用义的“战车”。a、b所涉罕见词的正文译法和脚注保留其词义不确定性，未以译文裁定争议。
