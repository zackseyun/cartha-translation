  text: וְ/הֵבִ֣יאוּ אֶת כָּל אֲחֵי/כֶ֣ם מִ/כָּל הַ/גּוֹיִ֣ם מִנְחָ֣ה לַֽ/יהוָ֡ה בַּ/סּוּסִ֡ים וּ֠/בָ/רֶכֶב וּ/בַ/צַּבִּ֨ים וּ/בַ/פְּרָדִ֜ים וּ/בַ/כִּרְכָּר֗וֹת עַ֣ל הַ֥ר קָדְשִׁ֛/י יְרוּשָׁלִַ֖ם אָמַ֣ר יְהוָ֑ה כַּ/אֲשֶׁ֣ר יָבִיאוּ֩ בְנֵ֨י יִשְׂרָאֵ֧ל אֶת הַ/מִּנְחָ֛ה בִּ/כְלִ֥י טָה֖וֹר בֵּ֥ית יְהוָֽה־־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/020.yaml
  text: And they will bring all your brothers from all the nations as an offering to Yahweh[a], on horses and in chariots and in litters and on mules and on camels, to my holy mountain Jerusalem, says Yahweh[c][b], just as the sons of Israel bring the offering in a clean vessel to the house of Yahweh.
translation:
  language: zh_hans
  text: 耶和华说：“他们要把你们所有的弟兄[c]从万国带来，作为献给耶和华的供物，用马、战车、篷车[a]、骡子和骆驼[b]把他们送到我的圣山耶路撒冷；正如以色列人用洁净的器皿把供物带到耶和华的殿中一样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “篷车”所译的希伯来词十分罕见，也可理解为“轿子”或某种有篷的运载工具。
    reason: lexical_alternative
  - marker: b
    text: “骆驼”所译的希伯来词含义不确定，可能指“快骆驼”，也有人理解为“车辆”。
    reason: lexical_alternative
  - marker: c
    text: “弟兄”在这里主要指同族同胞，不一定只指男性亲兄弟。
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיאוּ
  choice: 他们要……带来
  rationale: 在先知性语境中表达将来的行动；“带来”保留使某人到达此处的含义。
- source_word: כָּל אֲחֵיכֶם
  choice: 你们所有的弟兄
  rationale: 保留אָח的亲属称谓及阳性复数形式；此处主要指散居列国的以色列同胞，但该词可有较广的亲族含义。
- source_word: מִכָּל הַגּוֹיִם
  choice: 从列国
  rationale: 简洁自然地表达从各民族、各国之中被带回。
- source_word: מִנְחָה לַיהוָה
  choice: 作为献给耶和华的供物
  rationale: מִנְחָה可指礼物、贡物或祭祀供物；下半节明确提到带到耶和华殿中的供物，因此采用宽泛而带敬拜色彩的“供物”，不限定为素祭。
- source_word: וּבָרֶכֶב
  choice: 车辆
  rationale: רֶכֶב可指战车或车辆；在多种运输方式的清单中，“车辆”较自然，也避免把用途过度限定为战车。
- source_word: וּבַצַּבִּים
  choice: 篷车
  rationale: 罕见词，所指运输工具不确定；“篷车”是古译传统和词典所支持的可能解释之一，另以脚注注明“轿子”这一选择。
- source_word: וּבַפְּרָדִים
  choice: 骡子
  rationale: 直接对应פֶּרֶד。
- source_word: וּבַכִּרְכָּרוֹת
  choice: 骆驼
  rationale: 该罕见词可能指快速奔行的骆驼，也可能指车辆；正文采用易懂的“骆驼”，脚注保留不确定性。
- source_word: עַל הַר קָדְשִׁי יְרוּשָׁלִַם
  choice: 到我的圣山耶路撒冷
  rationale: 将“耶路撒冷”保留为“我的圣山”的同位说明，并按汉语自然语序表达目的地。
- source_word: בִּכְלִי טָהוֹר
  choice: 用洁净的器皿
  rationale: 忠实呈现礼仪语境中的“洁净”，不释义为一般的干净。
theological_decisions:
- issue: “你们所有的弟兄”的所指
  choice: 保留“弟兄”，主要呈现散居列国的以色列同胞被带回的图景
  alternative: 将其解释为归信的外族人，或概括译作所有敬拜者
  rationale: 本节字面用亲属称谓，且随后以“以色列人”献供物作比；译文不排除末世聚集可能具有的更广回响，但不把该神学解释写进正文。
- issue: 被带来的人与“供物”的关系
  choice: 明确表达这些弟兄整体上“作为献给耶和华的供物”被带来
  alternative: 把“供物”理解为他们另外携带的礼物
  rationale: 希伯来语句法把“你们所有的弟兄”与מִנְחָה紧密相连，下半节的类比也支持把被聚集的人描绘为供物。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 上主
  rationale: 采用现代中文圣经读者熟悉的专名译法，并在全节保持一致。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。为避免超长句造成关系含混，将耶和华的宣告公式独立成句，并用“他们要这样做”衔接比较句。交通工具清单尽量保持原文次序；对两个罕见词不作无提示的过度确定，而在脚注中保留词义歧义。
