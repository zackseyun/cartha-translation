source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה יְהוָה֙ בָּ/אֵ֣שׁ יָב֔וֹא וְ/כַ/סּוּפָ֖ה מַרְכְּבֹתָ֑י/ו לְ/הָשִׁ֤יב בְּ/חֵמָה֙ אַפּ֔/וֹ וְ/גַעֲרָת֖/וֹ בְּ/לַהֲבֵי אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/015.yaml
  text: For look[a], Yahweh will come in fire, and his chariots like the whirlwind[c][b], to repay his anger in fury and his rebuke with flames of fire.
translation:
  language: zh_hans
  text: 因为，看哪，雅威必在火中[a]来临；他的战车如旋风[b]。他要以烈怒施展他的怒气[c]，并以火焰发出他的斥责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“带着火”；希伯来语介词既可表示处于火中，也可表示火伴随而来。
    reason: lexical_alternative
  - marker: b
    text: “旋风”也可译作“暴风”或“风暴”。
    reason: lexical_alternative
  - marker: c
    text: 这里译作“施展／发出”的希伯来语动词基本义为“使返回”；在这里也可理解为“回报”或“施行报应”。该动词同时统摄“他的怒气”和“他的斥责”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: 因为，看哪
  rationale: כִּי承接上文，说明缘由；הִנֵּה是唤起注意的现场性用语。“因为，看哪”既保留篇章联系，也保留先知宣告的鲜明语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其专名性质，不以称号代替。
- source_word: בָּאֵשׁ יָבוֹא
  choice: 必在火中来临
  rationale: בְּ首先按处境或范围理解为“在……中”；未将其限定为工具意义。未完成式在预告审判的语境中译作将来且确定的“必……来临”。
- source_word: וְכַסּוּפָה מַרְכְּבֹתָיו
  choice: 他的战车如旋风
  rationale: סוּפָה指猛烈的风暴或旋风；“旋风”保留迅猛、席卷而来的意象。מַרְכָּבוֹת为复数，译作“战车”。
- source_word: לְהָשִׁיב בְּחֵמָה אַפּוֹ
  choice: 他要以烈怒施行他的怒气
  rationale: הֵשִׁיב在这里有使之返回、回报或施行报应的司法意味。直译“使他的怒气返回”在现代汉语中含混生硬，因此用“施行”表达将怒气转向受审判者，同时保留“他的怒气”这一宾语。חֵמָה译为强烈的“烈怒”。
- source_word: וְגַעֲרָתוֹ בְּלַהֲבֵי־אֵשׁ
  choice: 以火焰施行他的斥责
  rationale: גְּעָרָה是带权威和审判意味的斥责；לַהֲבֵי־אֵשׁ直译为“火的焰”，自然译作“火焰”。承接前一分句补出“施行”，显明平行关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，而非一般称号。采用现代汉语常见的音译“雅威”，既呈现专名，也避免以“主”消除原文的词汇区别。
- issue: 神的怒气与审判行动之间的表达
  choice: 以烈怒施行他的怒气
  alternative: 以烈怒报偿；使他的怒气在烈怒中返回
  rationale: 不把怒气弱化为抽象后果，也不把使役动词过度解释为某一种系统神学意义；正文用自然汉语表达审判行动，脚注保留“回转／回报”的词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留先知宣告中唤起注意的语气；全句维持火、旋风、战车、烈怒与火焰的强烈审判意象。以分号呈现希伯来诗句的推进和平行关系，不擅自说明受审判对象。
