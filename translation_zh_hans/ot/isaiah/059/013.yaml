source:
  edition: WLC
  text: פָּשֹׁ֤עַ וְ/כַחֵשׁ֙ בַּֽ/יהוָ֔ה וְ/נָס֖וֹג מֵ/אַחַ֣ר אֱלֹהֵ֑י/נוּ דַּבֶּר עֹ֣שֶׁק וְ/סָרָ֔ה הֹר֧וֹ וְ/הֹג֛וֹ מִ/לֵּ֖ב דִּבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/013.yaml
  text: transgressing and denying Yahweh[a], and turning back from following our God, speaking oppression and revolt[b], conceiving and uttering from the heart words of falsehood.
translation:
  language: zh_hans
  text: 悖逆并否认雅威，转身不再跟随我们的上帝；说欺压和背叛的话[a]，从心里酝酿并说出虚假的言语[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背叛”所译的希伯来语也可译作“反叛”“偏离”或“背道”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从心里”；意思是虚假的话出于内在的意念，并非仅是外在的言语。
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׁעַ
  choice: 悖逆
  rationale: 保留该词主动违抗、越界的动词意味；“悖逆”既表达道德过犯，也不把含义局限为政治叛乱。
- source_word: וְכַחֵשׁ בַּיהוָה
  choice: 并否认雅威
  rationale: כחש 可指否认、说谎或以虚假相待；与介词 בְּ 和神名连用时，“否认雅威”自然表达对上帝的不忠，同时保留原文可能涉及虚假相待的语义背景。
- source_word: בַּיהוָה
  choice: 雅威
  rationale: 按专名处理四字神名 יהוה，避免以称号代替原文中的名字。
- source_word: וְנָסוֹג מֵאַחַר אֱלֹהֵינוּ
  choice: 转身不再跟随我们的上帝
  rationale: נסוג 表示后退、转离，מֵאַחַר 在此指不再跟随；译文保留“转身”的动作意象，并以现代汉语清楚表达其含义。
- source_word: דַּבֶּר עֹשֶׁק וְסָרָה
  choice: 说欺压和背叛的话
  rationale: עֹשֶׁק 指欺压或剥削性的不义；סָרָה 指偏离、反叛或背道。把二者译为所说之话的内容，符合句法，也保持其广泛的社会与属灵含义。
- source_word: הֹרוֹ וְהֹגוֹ
  choice: 酝酿并说出
  rationale: 两个词呈现由内而外的过程：先在里面形成，继而表达出来。“酝酿并说出”在现代汉语中自然，并保留这一先后关系。
- source_word: מִלֵּב דִּבְרֵי שָׁקֶר
  choice: 从心里……虚假的言语
  rationale: מִלֵּב 明示虚假言语发自内心；דִּבְרֵי שָׁקֶר 指以虚假为特征的话语。译文保留内在来源和言语性质。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”将其作为上帝的专名呈现，不用称号取代，也不把有争议的元音重构说成绝对确定。
- issue: סָרָה 是否译成专门的宗教术语
  choice: 背叛
  alternative: 背道；反叛；偏离
  rationale: 上下文涉及对上帝的不忠，但该词本身也可泛指反叛或偏离。“背叛”保留其神学分量，又不将范围收窄为专门的宗教术语。
- issue: כחש ביהוה 所表达的不忠性质
  choice: 否认雅威
  alternative: 欺骗雅威；以虚假待雅威
  rationale: 该结构可表达否认，也可表达对雅威虚假不忠。正文采用自然简洁的“否认”，但不据此排除词语所含的欺骗、背信意味。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。全句维持原文连续列举罪行的结构，以分号区分对上帝的不忠和由此流出的恶言；“酝酿并说出”再现从内心形成到口中表达的推进。
