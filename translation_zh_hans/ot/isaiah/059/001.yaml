  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵ֛ן לֹֽא קָצְרָ֥ה יַד יְהוָ֖ה מֵֽ/הוֹשִׁ֑יעַ וְ/לֹא כָבְדָ֥ה אָזְנ֖/וֹ מִ/שְּׁמֽוֹעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/001.yaml
  text: Look[a], Yahweh’s hand is not too short to save[b], nor is his ear too dull to hear.
translation:
  language: zh_hans
  text: 看哪[a]，雅威的手并非短得不能拯救，他的耳朵也并非沉重得不能听见[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“的确”或“注意”。
    reason: 说明 הֵן 既可引人注意，也可加强断言。
  - marker: b
    text: 直译：“雅威的手没有短到不能拯救，他的耳朵也没有重到不能听见。”这里“手短”和“耳朵沉重”分别表示无力拯救和不能听见。
    reason: 交代原文的身体隐喻及希伯来语结构，使正文既自然又可追溯至原文。
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 该语气词引人注意并加强断言；“看哪”在现代中文中庄重而清楚，也保留先知话语的提示力量。
- source_word: קָצְרָה יַד
  choice: 手并非短得不能
  rationale: 保留希伯来文“手短”的具体比喻，同时用“短得不能”自然表达能力不足之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名音译四字神名，避免用称号替代原文中的专名。
- source_word: מֵהוֹשִׁיעַ
  choice: 不能拯救
  rationale: 此处介词与不定式在否定结构中表示受限或无能力；“拯救”直接对应使役词形的救援含义。
- source_word: כָבְדָה אָזְנוֹ
  choice: 他的耳朵也并非沉重得不能
  rationale: 保留“耳朵沉重”的原文隐喻及其与“手短”的平行结构，不直接释为“迟钝”而消除意象。
- source_word: מִשְּׁמוֹעַ
  choice: 听见
  rationale: 直接表达 שׁמע 的基本听觉含义；这里没有必要增译为带主动态度色彩的“听从”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用神的专名而非称号；音译为“雅威”保留这一点，同时不把经文中的能力陈述解释成额外的教义命题。
- issue: “手短”与“耳朵沉重”的拟人意象
  choice: 保留身体意象
  alternative: 译作“并非无力拯救，也并非听不见”
  rationale: 原文以平行的身体意象否定雅威缺乏拯救能力或听觉回应；保留意象可避免把诗性张力压平。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。正文保留希伯来诗句中“手短／耳朵沉重”的平行拟人意象；“看哪”略带经文语体，但仍为普通读者所理解。
