  yaml_path: translation/ot/isaiah/059/005.yaml
  text: They hatch viper's eggs and weave spider's webs[a]; whoever eats from their eggs dies[b], and what is crushed breaks open into a viper.
translation:
  language: zh_hans
  text: 他们孵化毒蛇的蛋[a]，编织蜘蛛网；吃这些蛋的，必死；其中一个被压破，就有一条毒蛇出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毒蛇”所对应的希伯来语指一种有毒的蛇，具体种类不能确定，也可译作“蝮蛇”。
    reason: lexical_alternative
  - marker: b
    text: 原文后半句的词义和句法有争议，直译近于“被压破的裂开，〔一条〕毒蛇”。本译按上下文理解为：前文所说的蛋若被压破，反而有毒蛇出来。
    reason: textual_ambiguity
lexical_decisions:
- source_word: בֵּיצֵי צִפְעוֹנִי
  choice: 毒蛇的蛋
  rationale: 该短语指某种有毒蛇类的蛋；具体蛇种难以确定。“毒蛇”自然清楚，也避免作出超过原文证据的物种判断。
- source_word: בִּקֵּעוּ
  choice: 孵化
  rationale: 该动词本义为“劈开、破开”，用于蛋时，汉语以“孵化”最自然，并保留蛋破而蛇出的意象。
- source_word: קוּרֵי עַכָּבִישׁ יֶאֱרֹגוּ
  choice: 编织蜘蛛网
  rationale: קוּרֵי指蜘蛛的丝线或网，אָרַג通常指编织；“编织蜘蛛网”既贴近原文，也保持诗句中人为营造恶事的形象。
- source_word: הָאֹכֵל מִבֵּיצֵיהֶם יָמוּת
  choice: 吃那些蛋的，必死
  rationale: 带冠词的分词表示泛指的人；“必死”表达未完成式在此处的必然、格言性结果。介词מִן在汉语中无需生硬译成“从……中吃”。
- source_word: וְהַזּוּרֶה
  choice: 蛋若被压破
  rationale: 此词形和确切含义有困难，语境支持“被压碎、压破的”；补出“蛋”使所指在汉语中清楚，同时以脚注说明原文的简略和歧义。
- source_word: תִּבָּקַע אֶפְעֶה
  choice: 就裂开，出来一条蝮蛇
  rationale: תִּבָּקַע表示裂开；אֶפְעֶה指一种毒蛇，具体种类不确定。“出来一条蝮蛇”自然传达蛋裂后毒蛇出现的图景，但未把“裂开”与“孵出”完全合并。
