  text: וַ/אֲנִ֗י זֹ֣את בְּרִיתִ֤/י אוֹתָ/ם֙ אָמַ֣ר יְהוָ֔ה רוּחִ/י֙ אֲשֶׁ֣ר עָלֶ֔י/ךָ וּ/דְבָרַ֖/י אֲשֶׁר שַׂ֣מְתִּי בְּ/פִ֑י/ךָ לֹֽא יָמ֡וּשׁוּ מִ/פִּי/ךָ֩ וּ/מִ/פִּ֨י זַרְעֲ/ךָ֜ וּ/מִ/פִּ֨י זֶ֤רַע זַרְעֲ/ךָ֙ אָמַ֣ר יְהוָ֔ה מֵ/עַתָּ֖ה וְ/עַד עוֹלָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/021.yaml
  text: 'And as for me[a], this is my covenant with them, says Yahweh: my Spirit that is upon you, and my words that I have put in your mouth, shall not depart from your mouth, or from the mouth of your offspring, or from the mouth of your offspring’s offspring, says Yahweh[b], from now and forever.'
translation:
  language: zh_hans
  text: 耶和华说：“至于我，这是我与他们所立的约：我的灵在你身上；我放在你口中的话，必不离开你的口，也不离开你后裔的口和你后裔的后裔的口[a]。这是耶和华所说的：从今直到永远[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文作“种子”，在这里是集合名词，指子孙后代；“后裔的后裔”直译为“你种子的种子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“从现在起，直到永远。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 独立代词前置带有强调或对比意味；“至于我”能自然保留这一话语转折。
- source_word: זֹאת בְּרִיתִי אוֹתָם
  choice: 我与他们所立的约是这样
  rationale: 按汉语习惯将关系表达为“与他们所立的约”，并以“是这样”引出约的内容。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的专名音译，明确呈现神名。
- source_word: רוּחִי אֲשֶׁר עָלֶיךָ
  choice: 我的灵在你身上
  rationale: 上下文涉及神所赐的先知性、立约性赋能，רוּחַ 在此译作“灵”最贴切；“在你身上”保留 עַל 的空间性表达。
- source_word: וּדְבָרַי אֲשֶׁר שַׂמְתִּי בְּפִיךָ
  choice: 我放在你口中的话
  rationale: דְבָרַי 虽为复数，但现代汉语的集合性“话”自然且不损失语义；“放在你口中”保留原文意象。
- source_word: לֹא יָמוּשׁוּ מִפִּיךָ
  choice: 必不离开你的口
  rationale: מוּשׁ 与介词 מן 构成离开某处的表达；“必不离开”兼顾庄重的应许语气和自然汉语。
- source_word: זַרְעֲךָ
  choice: 你的后裔
  rationale: זֶרַע 在此为集合名词，指子孙或后代；“后裔”在现代庄重汉语中自然，并可保持群体含义。
- source_word: זֶרַע זַרְעֲךָ
  choice: 你后裔的后裔
  rationale: 直接保留原文构造和世代递进，不将其限定为某个具体代数。
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: 从今直到永远
  rationale: 准确表达从当前时刻起持续至永远的时间范围，并具有自然、庄重的汉语节奏。
theological_decisions:
- issue: 第二人称单数“你”的所指
  choice: 保留单数“你”，不补明对象
  alternative: 解释为先知、人格化的锡安／以色列，或由一位代表者体现的蒙救赎群体
  rationale: 希伯来文在本节没有明说其所指；保留“你”可避免替读者消解上下文中的真实歧义。
- issue: רוּחִי 的含义
  choice: 我的灵
  alternative: 我的气息／我的风
  rationale: 该词本可指灵、风或气息，但本节把它与神放入口中的话及持久的约相连，“我的灵”最符合语境；同时不进一步添加位格性解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“口”与“离开”保留希伯来文反复出现的具体意象；引语结构清楚区分耶和华的宣告公式与约的内容。
