base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/010.yaml
  text: We grope for the wall like the blind; like those without eyes we grope[a]. We stumble at noon as in the twilight; among the vigorous we are like the dead.
translation:
  language: zh_hans
  text: 我们像盲人摸索墙壁，像没有眼睛的人一样摸索。我们在正午跌跌撞撞，如同在暮色中；在强壮者中[a]，我们如同死人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在强壮者中”所译的希伯来语词十分罕见，含义不确定；也可能译作“在肥沃之地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְגַשְׁשָׁה / נְגַשֵּׁשָׁה
  choice: 摸索／四处摸索
  rationale: 该动词的加强词干表示用手触摸探寻，尤其符合盲人摸索前行的画面。中文用“摸索”自然准确；第二处加“四处”使语气顺畅，同时保留原文重复。
- source_word: כַעִוְרִים
  choice: 像盲人一样
  rationale: 准确表达复数集合意义和明喻，语言自然，不增添原文没有的性别限定。
- source_word: קִיר
  choice: 墙壁
  rationale: 原文无冠词，中文无需强行区分定指或不定指；“摸索墙壁”清楚呈现借墙辨路的动作。
- source_word: וּכְאֵין עֵינַיִם
  choice: 像没有眼睛的人一样
  rationale: 保留原文强化失明意象的比较结构，不将其弱化为一般性的“看不见”。
- source_word: כָּשַׁלְנוּ
  choice: 我们……绊跌
  rationale: כשל表示绊倒、失足或踉跄；“绊跌”与摸索行走的意象衔接，并保持庄重。
- source_word: בַצָּהֳרַיִם
  choice: 在正午
  rationale: 点明日光最明亮的时刻，突出下文如处暮色的强烈反差。
- source_word: כַּנֶּשֶׁף
  choice: 如同在暮色中
  rationale: נשף可指晨昏的微暗时分；此处与正午对照，“暮色”自然传达昏暗，却不将其解释为完全黑夜。
- source_word: בָּאַשְׁמַנִּים
  choice: 在健壮的人中
  rationale: 罕见词אַשְׁמַנִּים的含义不确定；按“健壮、强健者”理解，能形成活力之人与死人之间的对照，同时以脚注保留其他可能。
- source_word: כַּמֵּתִים
  choice: 如同死人
  rationale: 保留原文简短而强烈的集合性比较；“死人”在现代中文中直接清楚。
