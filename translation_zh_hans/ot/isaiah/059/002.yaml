  text: כִּ֤י אִם עֲוֺנֹֽתֵי/כֶם֙ הָי֣וּ מַבְדִּלִ֔ים בֵּינֵ/כֶ֕ם לְ/בֵ֖ין אֱלֹֽהֵי/כֶ֑ם וְ/חַטֹּֽאותֵי/כֶ֗ם הִסְתִּ֧ירוּ פָנִ֛ים מִ/כֶּ֖ם מִ/שְּׁמֽוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/002.yaml
  text: But your iniquities have become those dividing between you and your God[a], and your sins have hidden his face from you, from hearing.
translation:
  language: zh_hans
  text: 但你们的罪孽使你们与上帝隔绝；你们的罪恶使他掩面不顾你们，以致不听。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: 但
  rationale: 承接第1节形成转折：问题不在于上帝无力拯救或不能听见，而在于百姓的罪；“但”在现代汉语中自然清楚。
- source_word: עֲוֺנֹתֵיכֶם
  choice: 你们的罪孽
  rationale: עָוֹן可指悖逆、邪恶及其罪责；译作“罪孽”既保留其道德分量，也与后面的“罪恶”有所区别。
- source_word: הָיוּ מַבְדִּלִים
  choice: 使……隔绝
  rationale: היה加分词表达持续或已经形成的隔离状态。汉语若机械译作“成了隔开者”会生硬；“使……隔绝”自然传达该结构及其结果。
- source_word: בֵּינֵיכֶם לְבֵין אֱלֹהֵיכֶם
  choice: 使你们与自己的上帝隔绝
  rationale: 原文是“两者之间”的惯用结构；汉语以“使甲与乙隔绝”准确而自然。“自己的上帝”保留第二人称复数所属关系及其关系性意味。
- source_word: וְחַטֹּאותֵיכֶם
  choice: 你们的罪恶
  rationale: חַטָּאוֹת指具体的罪或过犯。译作“罪恶”与前面的“罪孽”形成近义平行，同时不把两个希伯来词完全合并。
- source_word: הִסְתִּירוּ פָנִים מִכֶּם
  choice: 使他掩面不顾你们
  rationale: 原文直译为“从你们隐藏脸面”，是撤回眷顾与回应的拟人性表达。“掩面”保留原有意象，“不顾你们”使现代读者明白其指向，而没有将意象抽象化为“收回恩宠”。
- source_word: מִשְּׁמוֹעַ
  choice: 以致不听
  rationale: 介词מִן加不定式在此表达结果或阻隔；“以致不听”比“免于听见”或“从听见”更符合现代汉语，同时保留“不听”究竟侧重不垂听还是不回应的语境张力。
theological_decisions:
- issue: 上帝掩面的拟人表达
  choice: 保留“掩面”意象，并以“不顾你们”说明其关系性含义
  alternative: 译作“从你们收回他的眷顾”或“转离你们”
  rationale: 希伯来文本明确使用“脸面”意象。保留这一表达可维持盟约关系破裂的文学和神学力度，避免将其完全化约为抽象概念。
- issue: 人与上帝隔绝的道德因由
  choice: 明确以百姓的罪孽和罪恶为造成隔绝与不听的原因
  alternative: 弱化为“你们与上帝之间有了距离”
  rationale: 本节与第1节形成对照，直接指出问题不是上帝缺乏能力，而是人的罪造成关系隔绝；译文不额外推演上帝本性或救恩论体系。
- issue: “不听”的语义范围
  choice: 译作“以致不听”，不补成“拒绝垂听你们的祷告”
  alternative: “以致他不垂听你们的祷告”
  rationale: 上下文确与上帝听见呼求有关，但本节本身只说“不听”。保持简洁可避免把隐含宾语和意志色彩说得超过原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“罪孽／罪恶”保留平行词汇的差异；“掩面不顾”既保存希伯来意象，又避免仅有古雅措辞造成理解困难。全节不需脚注，因为正文已能兼顾形式和自然表达。
