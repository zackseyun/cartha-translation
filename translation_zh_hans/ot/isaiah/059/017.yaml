  to: 他把公义当作铠甲穿上[a]，把救恩[b]的头盔戴在头上；他穿上报仇的衣服，作他的衣裳，又如同披上外袍一样，以热忱[c]裹住自己。
  rationale: 修订仅改善现代汉语表达，并使脚注 c 保持词义开放，避免将原文的 קִנְאָה 预先限定为解释性较强的“忌邪之心”。“作他的衣裳”保留 תִּלְבֹּשֶׁת 对前述“衣服”的强调，“如同披上外袍一样”明确表达 כַּמְּעִיל 的比喻。
