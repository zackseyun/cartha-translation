  text: וַ/יִּלְבַּ֤שׁ צְדָקָה֙ כַּ/שִּׁרְיָ֔ן וְ/כ֥וֹבַע יְשׁוּעָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּלְבַּ֞שׁ בִּגְדֵ֤י נָקָם֙ תִּלְבֹּ֔שֶׁת וַ/יַּ֥עַט כַּ/מְעִ֖יל קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/017.yaml
  text: He put on righteousness like a breastplate[a], and a helmet of salvation on his head; he put on garments of vengeance for clothing[c][b], and wrapped himself in zeal as in a cloak.
translation:
  language: zh_hans
  text: 他把公义当作铠甲穿上[a]，把救恩[b]的头盔戴在头上；他穿上报仇的衣服，作他的衣裳，又如同披上外袍一样，以热忱[c]裹住自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“护胸甲”。希伯来语所指的是保护躯干的甲胄。
    reason: lexical_alternative
  - marker: b
    text: “救恩”也可译为“拯救”或“胜利”。
    reason: lexical_alternative
  - marker: c
    text: “热忱”也可译为“嫉妒”；此处指强烈而炽热的热心。
    reason: lexical_alternative
lexical_decisions:
- source_word: צְדָקָה
  choice: 公义
  rationale: 该词可指公义或正义；此处描写上帝以合乎公义的方式采取行动，“公义”既保留其核心含义，也适合披戴军装的比喻。
- source_word: שִׁרְיָן
  choice: 铠甲
  rationale: 该词指保护躯干的甲胄；“铠甲”在现代汉语中清楚、庄重，又不过度限定其具体样式。
- source_word: כּוֹבַע
  choice: 头盔
  rationale: 这是战斗语境中保护头部装备的自然对应词。
- source_word: יְשׁוּעָה
  choice: 救恩
  rationale: 该词可表达拯救、解救或胜利；“救恩”保留以赛亚书中上帝施行拯救的主题，而脚注保留本节军事语境下的其他可能。
- source_word: בִּגְדֵי נָקָם
  choice: 报仇的衣服
  rationale: 直译保留上帝施行报应的强烈意象，不将其淡化为抽象品质。
- source_word: תִּלְבֹּשֶׁת
  choice: 作为装束
  rationale: 该名词重申前述衣服是他所穿戴的装束；此译法保留希伯来文略带强调的复叠表达。
- source_word: וַיַּעַט
  choice: 裹住自己
  rationale: 该动词描写以衣物包裹自身，与外袍意象自然衔接。
- source_word: מְעִיל
  choice: 外袍
  rationale: 该词指穿在外面的衣袍；“外袍”准确而庄重，也适合“裹住自己”的动作。
- source_word: קִנְאָה
  choice: 热忱
  rationale: 该词可指热切、嫉妒或忌邪；在此指上帝采取行动的强烈投入，“热忱”保留正面的炽烈力量，同时由脚注提示其语义张力。
theological_decisions:
- issue: 上帝作为战士施行干预的意象
  choice: 按原文保留穿戴铠甲、头盔、报仇之衣和外袍的具体军事及衣着意象。
  alternative: 将这些意象解释性地改写为上帝具有公义、拯救能力、审判意志和热心等抽象品质。
  rationale: 希伯来文有意把上帝描绘为预备出战的神圣战士；保留具体意象，才能呈现他以公义施行拯救与报应的神学张力，而不加以弱化或寓意化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文连续“穿上”的修辞和具体军装意象；“作为装束”略显正式，旨在反映 תִּלְבֹּשֶׁת 对穿戴行为的强调。脚注标记按其实际对应词分别置于“铠甲”“救恩”“热忱”之后。
