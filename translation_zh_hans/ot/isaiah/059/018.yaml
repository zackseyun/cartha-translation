source:
  edition: WLC
  text: כְּ/עַ֤ל גְּמֻלוֹת֙ כְּ/עַ֣ל יְשַׁלֵּ֔ם חֵמָ֣ה לְ/צָרָ֔י/ו גְּמ֖וּל לְ/אֹֽיְבָ֑י/ו לָ/אִיִּ֖ים גְּמ֥וּל יְשַׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/018.yaml
  text: 'According to their deeds[a], so he will repay: wrath to his adversaries, repayment to his enemies; to the coastlands he will repay what is due.'
translation:
  language: zh_hans
  text: 他必照他们所行的，照样施行报应：以烈怒报应他的敌对者，向他的仇敌施行报应；向沿海各地[a]，他必施行报应。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众海岛”。希伯来语这个词可指海岛，也可指遥远的沿海地区；在《以赛亚书》中常泛指远方临海的各地或各国。
    reason: 词义有多种可能
lexical_decisions:
- source_word: כְּעַל גְּמֻלוֹת כְּעַל
  choice: 照人所行的，照样
  rationale: 两个相呼应的比较结构表达相称、按量的报偿。גְּמֻלוֹת在此指招致报应的行为；译作“人所行的”比直译“报偿”自然，也保留审判依据行为而定的意思。
- source_word: יְשַׁלֵּם
  choice: 施报
  rationale: שלם的Piel形式在此表示偿还、报还；“施报”简洁庄重，并适合本节司法性审判的语境。
- source_word: חֵמָה
  choice: 烈怒
  rationale: 表达强烈而带审判性质的愤怒；“烈怒”既有力度，也符合现代中文圣经文体。
- source_word: לְצָרָיו
  choice: 向敌对他的人
  rationale: צַר指与他敌对者；此译不额外限定为军事敌人或压迫者。
- source_word: גְּמוּל
  choice: 报应
  rationale: 该词表示按行为给予的回报，在此语境中是惩罚性的报偿。“报应”自然地保留了相称回报的司法意味。
- source_word: לְאֹיְבָיו
  choice: 向他的仇敌
  rationale: 准确表达אֹיֵב所指的敌人，并与“敌对他的人”形成平行而不完全重复的中文措辞。
- source_word: לָאִיִּים
  choice: 向沿海各地
  rationale: אִיִּים可指海岛，也可泛指沿海、隔海的遥远地区；以赛亚书中常有后者的广义用法。“沿海各地”在正文中较自然，另一译法收入脚注。
- source_word: גְּמוּל יְשַׁלֵּם
  choice: 必施报
  rationale: 希伯来文以同源意义的名词和动词加强语气。中文避免生硬的“报还报应”，以“必施报”表达确定而强调的报偿。
theological_decisions:
- issue: 第三人称单数动词的主语
  choice: 仅译作“他”，不在本节补出“耶和华”
  alternative: 为求明确而译作“耶和华”
  rationale: 上下文已表明主语是施行审判的上帝，但本节希伯来文本身没有重述神名。保留“他”既承接上下文，也避免添加原文没有的称号。
- issue: 开头גמל词族的含义
  choice: 理解为审判所依据的行为，译作“照人所行的”
  alternative: 较字面地译作“照报偿”或“照报应”
  rationale: 本节强调报偿与所行相称。此译使现代读者清楚理解审判的依据，同时由后文“报应、施报”继续呈现贯穿全节的报偿主题。
- issue: 报偿对象是否仅限邻近仇敌
  choice: 保留“沿海各地”为独立对象
  alternative: 将其泛化为所有远方列国
  rationale: 原文明确使用אִיִּים，但该词所涵盖的具体地理范围有弹性；正文保留其海洋地理意象，不进一步作神学或民族范围上的限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面中文。通过“照人所行的，照样”保留相称报偿的结构，并以“施报／报应”的重复再现原文的词汇呼应。脚注标记置于实际存在词义分歧的“沿海各地”之后。
