  text: וְ/הֻסַּ֤ג אָחוֹר֙ מִשְׁפָּ֔ט וּ/צְדָקָ֖ה מֵ/רָח֣וֹק תַּעֲמֹ֑ד כִּֽי כָשְׁלָ֤ה בָֽ/רְחוֹב֙ אֱמֶ֔ת וּ/נְכֹחָ֖ה לֹא תוּכַ֥ל לָ/בֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/014.yaml
  text: Justice is turned back[a], and righteousness stands far off; for truth has stumbled in the street[b], and uprightness cannot enter.
translation:
  language: zh_hans
  text: 公平被逼退，公义远远站着；因为真理在街上跌倒，正直无法进入。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֻסַּג אָחוֹר
  choice: 被逼退
  rationale: הֻסַּג是סוג的Hophal形式，表达被动地后退或遭驱退；“被逼退”既保留被动含义，也传达公共领域中的公平受到排挤。אָחוֹר所含“向后”之意已自然融入“退”。
- source_word: מִשְׁפָּט
  choice: 公平
  rationale: 本节聚焦公共和社会秩序，并将其拟人化；“公平”在现代汉语中自然地指公正的社会与司法原则。
- source_word: צְדָקָה
  choice: 公义
  rationale: 与מִשְׁפָּט相互呼应而不完全等同；“公义”保留其道德正当性及先知语境中的庄重色彩。
- source_word: מֵרָחוֹק תַּעֲמֹד
  choice: 远远站着
  rationale: 直观保留“站在远处”的拟人图景，表明公义未能进入公共生活。
- source_word: כָשְׁלָה
  choice: 跌倒
  rationale: כשׁל可指绊跌或倒下；“跌倒”保留生动拟人意象，同时不额外解释为彻底灭亡。
- source_word: בָרְחוֹב
  choice: 在街市上
  rationale: רְחוֹב指街道、宽阔处或公共广场；“街市”在现代汉语中兼具街道和公共活动场所的意味，符合此处社会公共语境。
- source_word: אֱמֶת
  choice: 真理
  rationale: אֱמֶת可指真实、诚信或可靠；在本节抽象德性拟人化的排列中，“真理”简洁庄重，也保留较宽的语义范围。
- source_word: נְכֹחָה
  choice: 正直
  rationale: 该词表达正、直、正当；“正直”与真理、公平、公义同属拟人化的道德品质，汉语自然。
- source_word: לֹא תוּכַל לָבוֹא
  choice: 无法进入
  rationale: 保留字面的能力否定和进入意象，不明确补出它被谁阻挡或进入何处。
theological_decisions:
- issue: מִשְׁפָּט与צְדָקָה这一对词的译法
  choice: 公平……公义
  alternative: 审判……公义；公平……正义
  rationale: 两词语义相近但并不相同。“公平”突出公共和司法秩序，“公义”突出道德上的正当，既保留平行关系，也避免把二者合并为同一概念。
- issue: אֱמֶת的语义范围
  choice: 真理
  alternative: 真实；诚信
  rationale: 上下文既涉及虚假言语，也涉及公共秩序失效。“真理”保留抽象德性被拟人化的表达，不把该词局限为个人诚信或单纯事实准确性。
- issue: נְכֹחָה无法进入的隐含场域
  choice: 不补明进入何处
  alternative: 无法进入街市；无法进入公共生活
  rationale: 希伯来文本只说“无法进入”，场域可由前句推知。正文保留省略，避免将解释写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。四个抽象名词均按希伯来文的拟人化方式处理；分号和“因为”清楚呈现前后因果。无脚注，因此正文不设脚注标记。
