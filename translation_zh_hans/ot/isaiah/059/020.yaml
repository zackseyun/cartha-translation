  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָ֤א לְ/צִיּוֹן֙ גּוֹאֵ֔ל וּ/לְ/שָׁבֵ֥י פֶ֖שַׁע בְּ/יַֽעֲקֹ֑ב נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/020.yaml
  text: And a Redeemer will come to Zion[a], and to those in Jacob who turn from transgression[d][c][b], declares Yahweh.
translation:
  language: zh_hans
  text: 救赎者[b]必来到锡安[a]，也来到雅各中那些离弃过犯的人[c][d]那里。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为了锡安”；希伯来语介词有时可表达这个意思，不过在这里与“来”连用，译作“来到锡安”最自然。
    reason: lexical_alternative
  - marker: b
    text: “救赎者”所译的希伯来语 go'el，指施行赎回或收复的人，常带有立约或亲属责任的意味。
    reason: cultural_note
  - marker: c
    text: 或译“雅各中悔改的人”，或“雅各中从悖逆转回的人”。
    reason: alternative_reading
  - marker: d
    text: 保罗在《罗马书》11:26引用本节；那里的措辞有部分不同，并受到希腊语经文传统的影响。
    reason: cross_reference
lexical_decisions:
- source_word: וּבָא
  choice: 必来到
  rationale: 这是带连接词的Qal完成式；在先知性语境中指向将来的行动。用“必来到”既表达未来，也传达宣告的确定性。
- source_word: לְצִיּוֹן
  choice: 来到锡安
  rationale: 介词 לְ 与“来”连用时，最自然地表示方向或目的地；“来到锡安”符合希伯来文句法和现代汉语表达。
- source_word: גּוֹאֵל
  choice: 救赎者
  rationale: גּוֹאֵל 指施行赎回、解救或收复的人，常含亲属责任和立约背景。“救赎者”保留其厚重含义，又不在正文中过度限定为“至近亲属”。
- source_word: וּלְשָׁבֵי פֶשַׁע
  choice: 也来到……那些离弃过犯的人那里
  rationale: שָׁבֵי 是 שוב 的分词，表达持续或具有特征性的转离；与 פֶשַׁע 连用时，指在道德上离开悖逆或过犯。译成“离弃过犯的人”保留动作含义，并避免加入过度体系化的神学术语。
- source_word: פֶשַׁע
  choice: 过犯
  rationale: 该词可指违背正当权威的悖逆或过犯。“过犯”在现代汉语中清楚、庄重，也保留其道德分量。
- source_word: בְּיַעֲקֹב
  choice: 雅各中
  rationale: 介词 בְּ 在这里表示范围，即在以“雅各”称呼的立约群体之中。直译为“雅各中”保留原文对群体身份的表达。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 这是先知书常见的权威宣告公式。该译法自然庄重，并直接呈现神名 יהוה。
theological_decisions:
- issue: 救赎者的身份与范围
  choice: 正文只称其为“救赎者”，不进一步指明身份。
  alternative: 明确译为弥赛亚，或明确说是耶和华亲自作救赎者。
  rationale: 本节具有重要的弥赛亚意义，后来的经文也作相关引用，但希伯来文本在此只称这位来者为 גּוֹאֵל。译文保留其指称上的开放性，不替正文解决这一神学张力。
- issue: שָׁבֵי פֶשַׁע 的含义
  choice: 那些离弃过犯的人
  alternative: 雅各中悔改的人；雅各中从悖逆转回的人。
  rationale: 这个短语描写从过犯中转离。采用动词性表达，可保留希伯来文分词的动态意味，又不把普通的回转用语预先限定为某一套神学术语。
- issue: 救赎者所到之处与所临到的人
  choice: 保留两个由 לְ 引出的对象：“来到锡安”，并“来到……人那里”。
  alternative: 译作“为锡安而来，并为……人而来”。
  rationale: 介词 לְ 可以有受益含义，但与 בוא“来”搭配时，方向义最自然。正文采用方向义，同时以脚注保留“为了锡安”的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保持先知宣告的确定语气，以“救赎者”保留核心神学词汇；“那些离弃过犯的人”则用自然的动词性结构呈现原文分词。所有脚注标记均置于对应词句之后。
