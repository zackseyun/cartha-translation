source:
  edition: WLC
  text: קֽוּרֵי/הֶם֙ לֹא יִהְי֣וּ לְ/בֶ֔גֶד וְ/לֹ֥א יִתְכַּסּ֖וּ בְּ/מַֽעֲשֵׂי/הֶ֑ם מַֽעֲשֵׂי/הֶם֙ מַֽעֲשֵׂי אָ֔וֶן וּ/פֹ֥עַל חָמָ֖ס בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/006.yaml
  text: Their webs will not become clothing[a], nor will they cover themselves with their deeds; their deeds are deeds of wickedness[b], and the work of violence is in their hands.
translation:
  language: zh_hans
  text: 他们的网不能成为衣服[a]；他们也不能用自己的行为遮盖自己。他们的行为都是罪恶之举[b]；他们手中尽是强暴之事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的蜘蛛网”。希伯来语指纺成或织成的东西；“网”保留了比喻，却没有在本节中过度具体化。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们的行为都是不义之举。”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּרֵיהֶם
  choice: 他们结的网
  rationale: 该词指纺成或织成之物；结合上一节蜘蛛结网的语境，译作“结的网”既承接比喻，又不在本节中过度明说“蜘蛛网”。
- source_word: לְבֶגֶד
  choice: 做成衣服
  rationale: בגד泛指衣服、衣物；与“不能”连用时，“不能做成衣服”自然表达这些网无法成为可穿用之物。
- source_word: יִתְכַּסּוּ
  choice: 遮盖自己
  rationale: 该动词为反身形态；“遮盖自己”保留原文动作及其与衣服意象的联系。
- source_word: בְּמַעֲשֵׂיהֶם
  choice: 用自己的行为
  rationale: 介词在此表工具或手段；“用”明确表达他们不能借自己的所作所为遮盖自己。
- source_word: מַעֲשֵׂיהֶם
  choice: 他们的行为
  rationale: 与前一分句保留同一名词的重复，维持原文的强调和修辞衔接。
- source_word: מַעֲשֵׂי אָוֶן
  choice: 罪恶之举
  rationale: אָוֶן可指罪孽、邪恶或祸患；在道德控诉语境中，“罪恶”准确而通俗，“之举”避免中文中“行为都是罪恶行为”的生硬重复。
- source_word: וּפֹעַל חָמָס
  choice: 所做的是强暴之事
  rationale: פֹעַל为工作、作为或所行之事，חָמָס指暴力、强暴及恶意侵害；此译保留单数集合性的表达，不改成复数。
- source_word: בְּכַפֵּיהֶם
  choice: 他们手中
  rationale: כף本指手掌；“手中”在现代汉语中自然，同时传达施行、掌控与责任归属。
- source_word: לֹא יִהְיוּ
  choice: 不能做成
  rationale: 与לְבֶגֶד结合时表达不能成为或充作衣服；中文“不能做成”也自然连接网与衣服的具体意象。
theological_decisions:
- issue: 无法遮盖自己的比喻含义
  choice: 保留网、衣服和遮盖的具体意象，不在正文中解释为无法掩饰罪恶或无法自救。
  alternative: 意译为“他们不能靠自己的恶行掩饰自己”。
  rationale: 原文让道德含义由上下文和意象共同显出；直接解释会消除原文的张力，并加入未明说的神学推论。
- issue: פֹעַל חָמָס的数与结构
  choice: 以集合性单数“所做的是强暴之事”表达。
  alternative: 译作复数“他们手中尽是强暴的行为”。
  rationale: 希伯来文采用单数构造关系；保留其集合性表达，既忠实于形式，也不限制为某一次单独行动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他们结的网”与上一节结网意象衔接；重复“行为”以保留原文强调，同时用“罪恶之举”使汉语节奏自然。“强暴”保留חָמָס兼具暴力与侵害的道德力度。
