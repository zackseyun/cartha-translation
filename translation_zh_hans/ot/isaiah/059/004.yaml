  text: אֵין קֹרֵ֣א בְ/צֶ֔דֶק וְ/אֵ֥ין נִשְׁפָּ֖ט בֶּ/אֱמוּנָ֑ה בָּט֤וֹחַ עַל תֹּ֨הוּ֙ וְ/דַבֶּר שָׁ֔וְא הָר֥וֹ עָמָ֖ל וְ/הוֹלֵ֥יד אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/004.yaml
  text: No one calls for righteousness[a], and no one pleads with faithfulness; trusting in emptiness and speaking falsehood[d][c][b], they conceive trouble and give birth to wickedness.
translation:
  language: zh_hans
  text: 没有人按公义申诉[a]，也没有人凭诚信争讼[b]；他们倚靠虚空[c]，口说虚假；他们所怀的是祸患，所生出的是罪孽[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按公义申诉”或译“为公正呼求”。
    reason: lexical_alternative
  - marker: b
    text: “凭诚信争讼”或译“以诚实申辩”；也可理解为“凭真实接受审判”。
    reason: lexical_alternative
  - marker: c
    text: “虚空”也可译作“徒然”或“虚妄”。
    reason: lexical_alternative
  - marker: d
    text: “罪孽”也可译作“邪恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא בְצֶדֶק
  choice: 按公义申诉
  rationale: “申诉”体现 קרא 在司法语境中的呼求、诉求之意；“按公义”保留 בְ 的方式或准则含义，也不把 צֶדֶק 限缩为单纯的司法公正。
- source_word: נִשְׁפָּט בֶּאֱמוּנָה
  choice: 凭诚信进行诉讼
  rationale: נשפט 在上下文中具有法庭、争讼意味；“进行诉讼”避免误解为被动受审。אֱמוּנָה 在此指可靠、忠实、诚实的品格，译作“诚信”自然且保留其道德广度。
- source_word: בָּטוֹחַ עַל תֹּהוּ
  choice: 倚靠虚空
  rationale: “倚靠”准确表达 בטח 的依赖意味；“虚空”保留 תֹהוּ 所含的空无、不实和徒然，不把含义过早限定为某一种。
- source_word: וְדַבֶּר שָׁוְא
  choice: 口说虚假
  rationale: “虚假”涵盖 שָׁוְא 的不实、欺骗和无价值意味；“口说”使现代汉语表达流畅，并与前一分句形成平行。
- source_word: הָרוֹ עָמָל
  choice: 怀的是祸患
  rationale: 保留 הרה 的怀孕隐喻；עָמָל 在此不是普通劳苦，而是会伤害人的祸害、恶谋，故译“祸患”。
- source_word: וְהוֹלֵיד אָוֶן
  choice: 生出的是罪孽
  rationale: “生出”延续受孕和生产的意象；“罪孽”表达 אָוֶן 在本段中的道德邪恶，同时脚注保留“邪恶”等可能译法。
theological_decisions:
- issue: 社会司法语境中 צֶדֶק 与 אֱמוּנָה 的表达
  choice: 译作“公义”和“诚信”，并用“申诉”“进行诉讼”显明司法语境
  alternative: 译作“公正”和“诚实”，更集中突出法庭含义
  rationale: 本节确实谴责诉讼和社会秩序中的腐败，但两个希伯来词的意义不限于法律程序；现译文兼顾司法场景与更广的道德内涵。
- issue: 结尾出生隐喻中的道德恶
  choice: 译作“怀的是祸患，生出的是罪孽”
  alternative: 译作“怀恶谋，生邪恶”
  rationale: 保留原文从怀孕到生产的连续意象，同时不将 עָמָל 与 אָוֶן 合并为同一个笼统概念。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“申诉”“进行诉讼”交代法庭背景；“倚靠虚空”保留先知诗歌的凝练感；结尾以“怀的是……生出的是……”保存希伯来文鲜明的孕育隐喻。所有词义歧义均以脚注呈现，正文不作宗派性解释。
