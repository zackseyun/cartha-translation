base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/003.yaml
  text: For your hands are defiled with blood[a], and your fingers with iniquity; your lips have spoken falsehood[c][b], your tongue mutters injustice.
translation:
  language: zh_hans
  text: 因为你们的手掌[a]被血玷污[b]，你们的指头也被罪孽玷污；你们的嘴唇说谎，舌头低声说出不义之言[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “手掌”也可译作“双手”；希伯来语在这里更具体地指手掌或手的内面。
    reason: lexical_alternative
  - marker: b
    text: “玷污”也可译作“染污”。原文所用动词含有污染、不洁的意思，不只是沾上可见的颜色。
    reason: lexical_alternative
  - marker: c
    text: “低声说出不义之言”也可译作“喃喃说着不义的话”或“吐出不义之言”。原文动词可指低声念、喃喃说，也可泛指发出话语。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明先前指控或处境的原因，保留因果关系。
- source_word: כַפֵּיכֶם
  choice: 你们的手掌
  rationale: כַּף具体指手掌或手的内面；正文保留具体意象，脚注说明可按汉语习惯理解为“双手”。
- source_word: נְגֹאֲלוּ
  choice: 被……玷污
  rationale: 此处גאל表示受污染、被玷污，不只是表面染色；“玷污”兼顾具体血迹与道德污秽。
- source_word: בַדָּם
  choice: 被血
  rationale: 介词标示造成玷污的物质或媒介；与“玷污”合译为“被血玷污”，自然且保留流血罪责的意象。
- source_word: וְאֶצְבְּעוֹתֵיכֶם
  choice: 你们的指头
  rationale: 保留与“手掌”平行的身体部位意象。
- source_word: בֶּעָוֹן
  choice: 被罪孽玷污
  rationale: עָוֹן可指罪孽、罪责或罪的后果；本句描述行为带来的道德污秽，“罪孽”保留其伦理和司法分量。
- source_word: שִׂפְתוֹתֵיכֶם דִּבְּרוּ שֶׁקֶר
  choice: 你们的嘴唇说谎
  rationale: 保留“嘴唇”的诗歌拟人，同时用现代汉语自然表达虚假言语。
- source_word: לְשׁוֹנְכֶם
  choice: 舌头
  rationale: 直译身体部位，以维持嘴唇与舌头之间的诗体平行。
- source_word: עַוְלָה
  choice: 不义之言
  rationale: עַוְלָה表示不公、不义或邪恶；补出“之言”使汉语完整，但不把它缩窄为单纯谎言。
- source_word: תֶהְגֶּה
  choice: 低声说出
  rationale: הגה可指低声念、喃喃说或发出话语；此译保留低声出言的具体色彩，又避免“默想”在汉语中可能带有的正面宗教意味。
theological_decisions:
- issue: 先知指控中的道德与司法词汇
  choice: 分别译作“血”“罪孽”“谎”“不义”，并以“玷污”表达污染状态
  alternative: 将相关词统一泛化为“恶行”或“罪恶”
  rationale: 原文叠加数个彼此相关而不相同的词，既涉及流血和虚假，也涉及罪责及不公。分别翻译可保留其伦理、社会和司法张力，不引入后来的教派性分类。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“手掌—指头—嘴唇—舌头”的诗歌平行结构；后半句不强行统一动词时态，以符合汉语先知性控诉的自然表达。
