base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/007.yaml
  text: Their feet run to evil[a], and they hurry to shed innocent blood; their thoughts are thoughts of iniquity[b]; devastation and destruction are in their highways.
translation:
  language: zh_hans
  text: 他们的脚奔向邪恶，他们急忙流无辜人的血；他们的意念都是罪孽的意念[a]；在他们的大道[b]上，有毁灭和破坏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “意念”也可译作“计划”或“计谋”；希伯来语原词可指思想、计划或谋算。
    reason: lexical_alternative
  - marker: b
    text: “大道”也可译作“路径”；这里既保留道路的具体意象，也可暗指他们行事为人的道路。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם
  choice: 他们的脚
  rationale: 保留原文具体的身体意象；这里也以脚的行动指向人的行为。
- source_word: לָרַע יָרֻצוּ
  choice: 奔向邪恶
  rationale: 保留介词所表达的趋向和“奔跑”的鲜明速度感，不增添原文没有明说的“作”字。
- source_word: וִימַהֲרוּ לִשְׁפֹּךְ דָּם נָקִי
  choice: 急忙要流无辜人的血
  rationale: “急忙”传达迅速、迫切之意；“流无辜人的血”是自然且庄重的汉语表达。
- source_word: מַחְשְׁבוֹתֵיהֶם מַחְשְׁבוֹת אָוֶן
  choice: 他们的意念都是罪孽的意念
  rationale: 保留 מַחְשָׁבָה 的重复所形成的修辞力量，并按道德控诉的语境将 אָוֶן 译为“罪孽”。
- source_word: שֹׁד וָשֶׁבֶר
  choice: 毁灭和破坏
  rationale: 以两个相近而不完全相同的词重现原文并列堆叠的破坏性图景。
- source_word: בִּמְסִלּוֹתָם
  choice: 他们的大道上
  rationale: מְסִלָּה 可指修筑或隆起的大路；“大道”保留具体道路意象，同时容纳人生行径的隐喻。
theological_decisions:
- issue: אָוֶן 的道德含义
  choice: 罪孽
  alternative: 邪恶；祸患
  rationale: 本节谴责人的行为和内心意图，故突出其道德罪责；同时不把该词扩展为某一宗派性的罪论表述。
- issue: 道路意象是否明说为生活行为
  choice: 保留“大道”的意象
  alternative: 他们的行径中
  rationale: 原文既是具体道路语言，也可暗示行为道路；正文保留这种双重可能，不将隐喻单一化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“脚”“意念”的重复和“大道”等诗歌意象；用“尽是”自然表达破坏充斥其道路的含义。脚注标记放在实际存在词义选择之处。
