base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/015.yaml
  text: So truth was missing[a], and whoever turned away from evil was plundered. Yahweh saw[b], and it was evil in his eyes that there was no justice.
translation:
  language: zh_hans
  text: 真理不见了；离弃恶事的人，反倒成了猎物[a]。雅威看见了；因没有公正，这事在他眼中为恶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个罕见的希伯来词也可译作“遭人抢掠”或“被当作猎物”，意思是离弃恶事的人反而成了受害者。
    reason: lexical_alternative
  - marker: b
    text: 直译：“这事在他眼中为恶。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֱמֶת
  choice: 真理
  rationale: 这里描写社会与司法秩序的崩坏，“真理”最能表达公开的道德和法律真实；“信实”仍是该词可能包含的意味。
- source_word: נֶעְדֶּרֶת
  choice: 不见了
  rationale: 该词表示缺席、不存在；“不见了”是自然的现代汉语，并未过度断言其永久消失。
- source_word: וְסָר מֵרָע
  choice: 离弃恶事的人
  rationale: 阳性单数分词在这里具有泛指作用，指任何转离邪恶的人；“离弃恶事”保留主动拒绝邪恶的含义。
- source_word: מִשְׁתּוֹלֵל
  choice: 成了掠物
  rationale: 这是罕见形式，可能表示“使自己成为猎物”或“遭抢掠”。正文用“成了掠物”保留猎物、受害者的意象与原文歧义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，区别于称号“主”，保留原文所用的上帝专名。
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: 这事在他眼中为恶
  rationale: 保留希伯来语“在他眼中为恶”的强烈道德判断，不弱化为仅仅“令他不悦”。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 在本段社会和司法语境中，该词指应有的公平与正义秩序；“公正”在现代汉语中清楚自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译为“雅威”可保留其专名性质，而不以称号替代。
- issue: וְסָר 的泛指阳性形式
  choice: 离弃恶事的人
  alternative: 那离弃恶事的男子
  rationale: 这里的阳性单数分词具有代表性、泛指作用，并不专指某一名男性；中文用“……的人”准确而自然。
- issue: מִשְׁתּוֹלֵל 的罕见形式
  choice: 成了掠物
  alternative: 遭人抢掠；使自己成为猎物
  rationale: 该词的具体语态和意味存在词汇歧义。正文保留“猎物/掠物”意象，脚注说明可能是遭抢掠或被当作猎物，避免把歧义完全消解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“反倒”凸显善者受害的反常处境；分号呈现原文两个连续观察。正文中的每个脚注标记均已对应列出。
