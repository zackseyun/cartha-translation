source:
  edition: WLC
  text: דֶּ֤רֶךְ שָׁלוֹם֙ לֹ֣א יָדָ֔עוּ וְ/אֵ֥ין מִשְׁפָּ֖ט בְּ/מַעְגְּלוֹתָ֑/ם נְתִיבֽוֹתֵי/הֶם֙ עִקְּשׁ֣וּ לָ/הֶ֔ם כֹּ֚ל דֹּרֵ֣ךְ בָּ֔/הּ לֹ֥א יָדַ֖ע שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/008.yaml
  text: They do not know the way of peace[a], and there is no justice in their paths; they have made their roads crooked for themselves[b]; everyone who walks in them does not know peace.
translation:
  language: zh_hans
  text: 他们不知道平安之路；他们的路径上没有公正[a]。他们为自己把道路弄弯了；凡走在这路上的，都不知道平安[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“审判”。
    reason: מִשְׁפָּט可指公正、审判或判决；正文依伦理语境译为“公正”。
  - marker: b
    text: 原文作单数“其上”；这单数用法可能集合性地指前述的道路或路途。
    reason: 保留בָּהּ的单数及其与前文复数道路词之间可能存在的集合性指代，而不在正文中强行消除歧义。
lexical_decisions:
- source_word: דֶּרֶךְ שָׁלוֹם
  choice: 平安的道路
  rationale: 保留希伯来文以“道路”比喻生活方式的表达；“平安”也涵盖和睦、安宁与福祉，不将其窄化。
- source_word: יָדָעוּ / יָדַע
  choice: 知道
  rationale: 原词在此不只指认知，也可含亲身经历与道德上的认识；中文“知道”保留这一宽度，并维持首尾重复。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 此处指行径中缺少公平正直的秩序；“公正”比“审判”更符合伦理语境，同时不局限于司法程序。
- source_word: מַעְגְּלוֹתָם
  choice: 他们所走的路
  rationale: 该词可指路径、轨迹或行程；译成“所走的路”自然呈现行为路线的比喻。
- source_word: נְתִיבוֹתֵיהֶם
  choice: 路径
  rationale: 与前面的“道路”和“所走的路”形成诗歌性的近义变化，又保持道路意象。
- source_word: עִקְּשׁוּ
  choice: 弄弯了
  rationale: 直接表达使路径弯曲、扭曲之意，并保留其形象及道德含义。
- source_word: לָהֶם
  choice: 为自己
  rationale: 保留反身或利益格的可能含义，表明这些弯曲路径是他们自己造成并为自己铺设的。
- source_word: כֹּל דֹּרֵךְ בָּהּ
  choice: 凡走在其上的
  rationale: 保留希伯来文阴性单数代词“其上”，其所指可能是集合意义上的路径，也可能回指整体路途；避免擅自改为复数而消除歧义。
theological_decisions:
- issue: מִשְׁפָּט 的伦理与司法含义
  choice: 公正
  alternative: 审判／正义
  rationale: 先知语境谴责人的道路缺乏公平正直；“公正”既可涵盖社会伦理，也不把含义限定为法庭裁决。
- issue: בָּהּ 的单数所指
  choice: 其上
  alternative: 这些路上
  rationale: 希伯来文使用单数代词，而前文有复数“路径”；采用“其上”保存可能的集合性回指及数的不协调，不强行消解文本张力。
- issue: שָׁלוֹם 的范围
  choice: 平安
  alternative: 安康／福祉
  rationale: “平安”是自然且有尊严的对应词，可同时容纳无冲突、安宁和整体福祉，并保留本节首尾呼应。
translation_notes:
  register: 采用现代标准普通话，语气庄重而易懂。以分号呈现希伯来诗句的并列推进，并通过“道路—所走的路—路径”保留原文三个近义道路词的变化。
