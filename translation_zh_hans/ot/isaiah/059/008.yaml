  to: 他们不知道平安之路；他们的路径上没有公正[a]。他们为自己把道路弄弯了；凡走在这路上的，都不知道平安[b]。
  rationale: 修订使“他们的路径”直接对应原文所属表达，避免无必要地补入“所走”的动作；以“路径／道路”保留相邻道路词的变化。末句改为自然的现代汉语“这路上”，并用脚注明确保留原文单数代词所带来的集合性指代可能。
