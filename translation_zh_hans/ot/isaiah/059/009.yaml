reference: Isaiah 59:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל כֵּ֗ן רָחַ֤ק מִשְׁפָּט֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תַשִּׂיגֵ֖/נוּ צְדָקָ֑ה נְקַוֶּ֤ה לָ/אוֹר֙ וְ/הִנֵּה חֹ֔שֶׁךְ לִ/נְגֹה֖וֹת בָּ/אֲפֵל֥וֹת נְהַלֵּֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/009.yaml
  text: Therefore justice is far from us[a], and righteousness does not overtake us; we hope for light, but look—darkness; for brightness[c][b], but we walk in deep gloom.
translation:
  language: zh_hans
  text: 因此，公正远离我们[a]，公义也追不上我们[b]；我们盼望光明，看哪，却是黑暗；盼望亮光，却行在幽暗之中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公正”或译“审判”。
    reason: lexical_alternative
  - marker: b
    text: “追不上我们”或译“临不到我们”。
    reason: lexical_alternative
  - marker: c
    text: “幽暗”或译“浓密的黑暗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 此处指群体中缺失的公平秩序和公正裁断；“公正”自然地保留其社会与司法含义，并与下文“公义”有别。
- source_word: רָחַק
  choice: 远离
  rationale: 完成式描述已经形成并持续存在的状态；“远离我们”简洁地表达这种现实。
- source_word: צְדָקָה
  choice: 公义
  rationale: 与 מִשְׁפָּט 并列时译作“公义”，既保留二词的联系，也不抹去道德正直与公正秩序之间的差别。
- source_word: תַשִּׂיגֵנוּ
  choice: 追不上我们
  rationale: נשׂג 的使役词形具有赶上、追及之意；“追不上我们”保留原文鲜明的动态意象。
- source_word: נְקַוֶּה
  choice: 盼望
  rationale: קוה 兼有等候与期待之意；哀歌语境中的“盼望”自然涵盖二者。
- source_word: אוֹר
  choice: 光明
  rationale: 保留光的直接意象，同时自然承载解救、福祉等隐喻意义。
- source_word: וְהִנֵּה
  choice: 看哪，却是
  rationale: “看哪”保留 הִנֵּה 引人注意的指示力量，“却是”明确呈现所盼与所得的强烈反差。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 直译既适合视觉意象，也保留困境与蒙昧的隐喻空间。
- source_word: נְגֹהוֹת
  choice: 亮光
  rationale: 复数形式在此表达明亮、光辉；“亮光”在现代汉语中自然，并与“幽暗”形成清晰对照。
- source_word: אֲפֵלוֹת
  choice: 幽暗
  rationale: 该词指浓重、阴沉的黑暗；“幽暗”较“黑暗”更深沉，又不额外限定为情绪性的愁苦。
- source_word: נְהַלֵּךְ
  choice: 行在
  rationale: 保留希伯来文“行走”的意象，也符合现代中文圣经体裁中描述生活处境的自然表达。
theological_decisions:
- issue: מִשְׁפָּט 与 צְדָקָה 的关系
  choice: 分别译为“公正”和“公义”
  alternative: 可译为“审判”和“正义”，或两者都以“公义／正义”表达
  rationale: 分别译出可保留诗句中社会司法秩序与道德正直彼此重叠却不完全相同的张力，避免将两个希伯来词合并为单一概念。
- issue: 公义“追及”百姓的意象
  choice: 译为“公义也追不上我们”
  alternative: 译为“公义也临不到我们”
  rationale: 原动词通常表示追上、赶上；保留动态隐喻，不将其静态化，同时脚注提供更自然但较弱的可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号维持希伯来诗歌两组期待与现实的平行结构；“看哪”保留突转和现场感。所有脚注标记均紧随相关译词出现。
