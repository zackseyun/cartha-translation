base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/012.yaml
  text: For our transgressions are many before you[a], and our sins testify against us; for our transgressions are with us, and we know our iniquities.
translation:
  language: zh_hans
  text: 因为我们的悖逆在你面前多而又多，我们的罪指证我们[a]；因为我们的悖逆与我们同在，我们知道自己的罪孽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “指证我们”原文也可较直译为“回答反对我们”；或译为“作证反对我们”。
    reason: 保留ענה在“回答／作证”之间的词义空间，同时明确本节司法语境中对百姓不利的方向。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明百姓陷入困境的原因；“因为”自然保留了解释性的连接作用。
- source_word: רַבּוּ
  choice: 增多
  rationale: רבה表示变多、增多；此处既可表达数量众多，也保留罪过不断累积的动态意味。
- source_word: פְשָׁעֵינוּ
  choice: 我们的悖逆
  rationale: פשע常指对权威的反叛或背约；“悖逆”比笼统的“罪”更能体现其语义，同时适合庄重的认罪语境。
- source_word: נֶגְדֶּךָ
  choice: 在你面前
  rationale: 保留“在……面前、在……眼前”的空间与审判意味，避免直接译成“得罪你”而与下一分句过度合并。
- source_word: וְחַטֹּאותֵינוּ
  choice: 我们的罪
  rationale: חטאת是常用的罪恶用语；译作“罪”准确自然，并与“悖逆”和“罪孽”有所区别。
- source_word: עָנְתָה בָּנוּ
  choice: 作证控告我们
  rationale: ענה在此可有“回答、作证”之意，בנו在法庭语境中可表达对我们不利；“作证控告我们”清楚传达司法意象，同时以脚注保留原文措辞和另一种理解。
- source_word: פְשָׁעֵינוּ אִתָּנוּ
  choice: 我们的悖逆与我们同在
  rationale: 贴近原文，表达悖逆仍然伴随着百姓、无法否认或摆脱；不擅自解释为单纯的记忆或内疚。
- source_word: וַעֲוֺנֹתֵינוּ
  choice: 我们的罪孽
  rationale: עון可涉及邪曲、罪责或罪孽；“罪孽”保留其道德分量，并与本节另外两个罪恶用语区分。
- source_word: יְדַעֲנוּם
  choice: 我们也知道自己的罪孽
  rationale: ידע直译为“知道”；“自己的”自然承接希伯来文的宾语后缀，又不将其解释性地改成“承认”。
theological_decisions:
- issue: 同一节中三个罪恶用语的处理
  choice: 分别译作“悖逆”“罪”“罪孽”
  alternative: 全部统一译作“罪”
  rationale: פשע、חטאת、עון彼此相关但并不相同；保留不同译词可以反映认罪话语中层层累加的修辞和词义层次。
- issue: 罪“作证”的司法意象
  choice: 译作“作证控告我们”
  alternative: 译作“在我们里面回应”或仅译作“证明我们有罪”
  rationale: 上下文支持对百姓不利的作证含义，但原文ענה ב的措辞仍有一定歧义，因此正文呈现最合语境的司法含义，脚注保留较直译及另一可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的认罪语体。保留“在你面前”和“与我们同在”的原文意象，并用分号呈现两个解释性分句之间的平行关系。
