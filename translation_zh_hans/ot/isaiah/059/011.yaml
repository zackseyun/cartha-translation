id: ISA.59.11
reference: Isaiah 59:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נֶהֱמֶ֤ה כַ/דֻּבִּים֙ כֻּלָּ֔/נוּ וְ/כַ/יּוֹנִ֖ים הָגֹ֣ה נֶהְגֶּ֑ה נְקַוֶּ֤ה לַ/מִּשְׁפָּט֙ וָ/אַ֔יִן לִֽ/ישׁוּעָ֖ה רָחֲקָ֥ה מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/011.yaml
  text: We all growl like bears[a], and like doves we moan continually; we hope for justice, but there is none; for salvation[b], but it is far from us.
translation:
  language: zh_hans
  text: 我们都像熊一样低吼，像鸽子一般哀鸣不止；我们盼望[a]公正，却没有公正；盼望拯救[b]，拯救却远离我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“等候公正”或“期待公正”；希伯来语动词既可表示等候，也可表示盼望。
    reason: lexical_alternative
  - marker: b
    text: “拯救”或译“解救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶהֱמֶה
  choice: 低吼
  rationale: המה表示发出响亮、低沉而嘈杂的声音；与“像熊一样”搭配时，“低吼”既保留动物意象，也比“咆哮”更贴近哀叹语境。
- source_word: כַדֻּבִּים כֻּלָּנוּ
  choice: 我们都像熊一样
  rationale: 保留复数熊的集体比喻，并以自然的现代汉语语序突出“我们所有人”的共同哀叹。
- source_word: וְכַיּוֹנִים
  choice: 像鸽子一般
  rationale: 直译第二个比喻，与熊的低吼形成声音上的对照。
- source_word: הָגֹה נֶהְגֶּה
  choice: 哀鸣不止
  rationale: 不定式绝对形与限定动词连用，加强动作；“不止”传达持续和强调，“哀鸣”符合鸽声在本段哀叹中的情感色彩。
- source_word: נְקַוֶּה
  choice: 盼望
  rationale: קוה兼有等候与怀着期待盼望之意；“盼望”自然表达对尚未出现之结果的期待，同时以脚注保留“等候”的可能。
- source_word: לַמִּשְׁפָּט
  choice: 公正
  rationale: מִשְׁפָּט在此指所期待的正义秩序或公正伸张，而不只是一次司法判决；“公正”在现代汉语中清楚自然。
- source_word: וָאַיִן
  choice: 却没有公正
  rationale: 上下文呈现期待落空，故用转折词“却”；重复“公正”可避免汉语中“没有”所指含混。
- source_word: לִישׁוּעָה
  choice: 拯救
  rationale: יְשׁוּעָה可指救助、解救、救恩；“拯救”既保留较宽广的神学意涵，也符合眼前盼望获救的语境。
- source_word: רָחֲקָה מִמֶּנּוּ
  choice: 拯救却远离我们
  rationale: 明确补出省略的主语“拯救”，自然表达该拯救离说话者甚远的状态。
theological_decisions:
- issue: 先知性哀歌中יְשׁוּעָה的译法
  choice: 拯救
  alternative: 解救
  rationale: 原词既可指现实处境中的搭救，也有更宽广的救恩意味；“拯救”保留这种幅度，却不把后来的特定教义含义强加给本节。
- issue: מִשְׁפָּט在本节的含义
  choice: 公正
  alternative: 审判
  rationale: 语境强调百姓期待公义得以伸张，而非单指法庭判决；译作“公正”保留社会与神学层面的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“低吼”与“哀鸣不止”保留两种动物声音的对照；后半节适度重复“公正”和“拯救”，以维持希伯来诗句的平行结构并避免代词指向含混。
