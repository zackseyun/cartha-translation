source:
  edition: WLC
  text: וְ/יִֽירְא֤וּ מִֽ/מַּעֲרָב֙ אֶת שֵׁ֣ם יְהוָ֔ה וּ/מִ/מִּזְרַח שֶׁ֖מֶשׁ אֶת כְּבוֹד֑/וֹ כִּֽי יָב֤וֹא כַ/נָּהָר֙ צָ֔ר ר֥וּחַ יְהוָ֖ה נֹ֥סְסָה בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/019.yaml
  text: So they will fear the name of Yahweh from the west[a], and his glory from the rising of the sun; for he will come like a rushing river[c][b], driven by the breath of Yahweh.
translation:
  language: zh_hans
  text: 这样，从西方，人必敬畏耶和华的名；从日出之地[a]，人必敬畏他的荣耀。因为他必如奔腾的河流而来，由耶和华的气息推动[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “日出之地”即东方；原文直译为“从太阳升起之处”。
    reason: lexical_alternative
  - marker: b
    text: 本节末句的希伯来文含义和句法都很困难。也可译作：“因为它必如奔腾的河流而来，由耶和华的灵推动。”原文此词也可译作“风”。
    reason: alternative_reading
  - marker: c
    text: 传统上也译作：“仇敌如洪水涌来时，耶和华的灵必竖起旗帜抵挡他。”这种译法采用了对希伯来文词义和句法的另一种分析；原文并没有明确写出“仇敌”一词。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: 这样……人必敬畏
  rationale: 该词为ירא的Qal未完成式第三人称复数，可指惧怕或敬畏；“敬畏”在中文中兼顾畏惧、尊崇与盟约语境，“这样”自然承接上文结果。
- source_word: מִמַּעֲרָב
  choice: 从西方
  rationale: מַעֲרָב指西方或日落之处；“从西方”自然明确，并与下句的日出之地形成诗意对举。
- source_word: אֶת שֵׁם יְהוָה
  choice: 耶和华的名
  rationale: “名”表示耶和华所启示的身份和声誉；中文以通行的专名“耶和华”表达四字神名。
- source_word: וּמִמִּזְרַח שֶׁמֶשׁ
  choice: 从日出之地
  rationale: 原文直译为“从太阳升起之处”；此译保留诗歌意象，也自然表示东方。
- source_word: אֶת כְּבוֹדוֹ
  choice: 他的荣耀
  rationale: כָּבוֹד可指分量、尊荣或荣耀；在神显现及敬拜语境中，“荣耀”最合适。
- source_word: כִּי יָבוֹא
  choice: 因为他必……而来
  rationale: כִּי在此可引出理由；动词为阳性单数，主语并未明说。结合上下文，正文以“他”指向耶和华的临到，同时以脚注说明句法歧义。
- source_word: כַנָּהָר צָר
  choice: 如奔腾的河流
  rationale: נָהָר是河流；צָר在这里意义困难，正文按急迫、冲涌之势理解为“奔腾”，既通顺又不过度采用传统译法所增添的“仇敌”。
- source_word: רוּחַ יְהוָה
  choice: 耶和华的气息
  rationale: רוּחַ可指气息、风或灵；河流受推动的具体意象中，“气息”较贴切，同时保留“灵”的神学回响，另在脚注列出其他可能。
- source_word: נֹסְסָה בוֹ
  choice: 由……驱动
  rationale: 此形式及短语十分困难；正文采用耶和华的气息推动河流般来势的理解，以形成连贯中文，并在脚注保留重要异读。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 现代中文圣经语境中“耶和华”是普通读者最熟悉且庄重的专名表达；不以“主”这一称号代替原文神名。
- issue: רוּחַ יְהוָה的含义
  choice: 耶和华的气息
  alternative: 耶和华的灵／耶和华的风
  rationale: 正文保留推动河流这一具体诗歌图像，不将רוּחַ的多义性完全神学化；脚注说明“灵”和“风”也可能。
- issue: 末句困难句法的解释
  choice: 耶和华如奔腾的河流而来，由他的气息驱动
  alternative: 仇敌如洪水涌来，耶和华的灵必竖起旗帜抵挡他
  rationale: 希伯来文没有明确写出“仇敌”，传统译法取决于对צָר、נֹסְסָה及代词关系的另一种分析。正文采用较少增补的神圣临到解释，同时用脚注完整保留传统理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。以“从西方／从日出之地”保留诗意对举；重复“人必敬畏”使两个并列宾语在中文中关系清楚。末句不掩盖原文的重大歧义，正文选择较少增补且意象连贯的译法，并在脚注列出代词理解及传统译法。
