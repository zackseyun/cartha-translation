source:
  edition: WLC
  text: וַ/יַּרְא֙ כִּֽי אֵ֣ין אִ֔ישׁ וַ/יִּשְׁתּוֹמֵ֖ם כִּ֣י אֵ֣ין מַפְגִּ֑יעַ וַ/תּ֤וֹשַֽׁע ל/וֹ֙ זְרֹע֔/וֹ וְ/צִדְקָת֖/וֹ הִ֥יא סְמָכָֽתְ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/016.yaml
  text: He saw that there was no man[a], and he was appalled that there was no one to intercede; so his own arm brought him salvation[c][b], and his righteousness upheld him.
translation:
  language: zh_hans
  text: 他见没有一个人[a]，又因没有人出面介入[b]而惊愕；于是，他的膀臂为他带来拯救，他的公义[c]扶持他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一个人”所译的希伯来词为阳性单数；这里指没有任何人可担当此事。
    reason: cultural_note
  - marker: b
    text: “出面介入”也可译作“代求”或“替人陈情”。
    reason: lexical_alternative
  - marker: c
    text: “公义”也可译作“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: 一个人
  rationale: 该词虽为阳性单数，但本句着重指出没有任何人可承担行动；现代汉语用“一个人”既保留单数形式，也不会像“一个男人”那样不恰当地把范围限于成年男性。
- source_word: וַיִּשְׁתּוֹמֵם
  choice: 震惊
  rationale: 此动词表达惊愕、骇异；“震惊”自然凝练，并能体现面对社会道德失序时的强烈反应。
- source_word: מַפְגִּיעַ
  choice: 出面干预
  rationale: 该使役分词可指介入、代求或替人陈情者。结合本章无人秉行公义的语境，“出面干预”较宽，能保留实际介入与为人陈情两方面的可能。
- source_word: וַתּוֹשַׁע
  choice: 施行拯救
  rationale: 阴性动词与“膀臂”一致，表示膀臂成就救援；“施行拯救”保留了行动及其救赎结果。
- source_word: זְרֹעוֹ
  choice: 他自己的膀臂
  rationale: “膀臂”保留希伯来文以肢体象征力量和行动的意象；“自己的”凸显在无人介入时，他亲自采取行动。
- source_word: צִדְקָתוֹ
  choice: 他的公义
  rationale: צדקה兼有公义、正直和公正施行审判的含义。“公义”保留其较广的道德与神学内涵，另以脚注注明“公正”的可能。
- source_word: סְמָכָתְהוּ
  choice: 扶持了他
  rationale: 该动词指支撑、托住或维持；“扶持”既保留支撑意象，也符合庄重而通顺的现代汉语。
theological_decisions:
- issue: 本节“他／他的”所指
  choice: 各代词均延续上下文，指向耶和华；译文仍按原文使用第三人称代词。
  alternative: 在正文中直接把“他”明说为“耶和华”，或把末两句意译为神的能力与公义自行发挥作用。
  rationale: 上下文表明行动者是耶和华，而本节希伯来文本身使用代词。保留“他”既忠于句法，也呈现神在没有任何人介入时亲自施行拯救的重点，不引入后来的教义范畴。
- issue: צדקה的语义范围
  choice: 正文译作“公义”。
  alternative: 译作“公正”或“正义”。
  rationale: 该词在此既可描述行动者自身的正直，也可指其伸张公正的行动。“公义”较能容纳这种广度，同时用脚注保留“公正”这一可能。
- issue: מַפְגִּיעַ所指的行动
  choice: 译作“出面干预”，不限定为祷告意义上的代求。
  alternative: 译作“代求”或“替人陈情”。
  rationale: 词形可表示介入或为他人求情；本章论及公平、审判和无人挺身而出，故采用范围较宽的表达，并在脚注中保留其他可能，避免过早把意义限定为宗教性代祷。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“膀臂”保留先知文学中力量与行动的传统意象；“施行拯救”“公义”“扶持”保持经文语体，但句法避免文言化。脚注标记按正文出现顺序重新对应，以避免咨询文本中标记与注释内容错位。
