id: ISA.7.5
reference: Isaiah 7:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַ֗עַן כִּֽי יָעַ֥ץ עָלֶ֛י/ךָ אֲרָ֖ם רָעָ֑ה אֶפְרַ֥יִם וּ/בֶן רְמַלְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/005.yaml
  text: Because Aram has planned evil against you, along with Ephraim and the son of Remaliah, saying,
translation:
  language: zh_hans
  text: 因为亚兰图谋害你，以法莲和利玛利的儿子也一同参与，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן כִּי
  choice: 因为
  rationale: 此复合连接语引出耶和华宣告的缘由；现代汉语用“因为”自然承接上文。
- source_word: יָעַץ עָלֶיךָ ... רָעָה
  choice: 图谋害你
  rationale: יָעַץ 表示谋划，רָעָה 是其所谋之恶；“图谋害你”既传达敌对计划，也避免生硬的“谋划恶事攻击你”。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 采用该古代国家的通行圣经汉语名称。
- source_word: אֶפְרַיִם וּבֶן רְמַלְיָהוּ
  choice: 以法莲和利玛利的儿子
  rationale: 保留原文对北国及其君王的称呼；不把“利玛利的儿子”直接替换为“比加”，以保存原文语气。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引出下一节直接引语的常规公式，译为“说”。
theological_decisions:
- issue: 谋划行为的语法主体
  choice: 以亚兰为主要语法主体，并说明以法莲和利玛利的儿子一同参与
  alternative: 把亚兰、以法莲和利玛利的儿子并列为三个同等主语
  rationale: 希伯来文动词 יָעַץ 为阳性单数，直接对应“亚兰”；随后“以法莲和利玛利的儿子”是无显式连接说明的追加成分。译文保留这一不对称结构，同时以“一同参与”清楚表达其共同谋划。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“图谋害你”简洁有力；“也一同参与”保留原文以亚兰为单数主语、另加同谋者的句法特点。末尾用冒号承接第6节引语。
