  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יִשְׁרֹ֤ק יְהוָה֙ לַ/זְּב֔וּב אֲשֶׁ֥ר בִּ/קְצֵ֖ה יְאֹרֵ֣י מִצְרָ֑יִם וְ/לַ֨/דְּבוֹרָ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ אַשּֽׁוּר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/018.yaml
  text: And in that day Yahweh will whistle for the fly that is at the far end of the streams of Egypt[b][a], and for the bee that is in the land of Assyria.
translation:
  language: zh_hans
  text: 到那日，雅威必吹哨召来埃及河道尽头的苍蝇[a][b]，以及亚述地的蜜蜂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吹哨召来”或译“发出嘘声召来”。希伯来语动词指发出尖锐声音来召唤或示意。
    reason: lexical_alternative
  - marker: b
    text: “埃及河道”可能特指尼罗河的支流或埃及的水渠。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 采用自然、庄重的先知性时间公式；未来意味由后面的“必”承载，无须直译为“事情将会发生”。
- source_word: יִשְׁרֹק
  choice: 吹哨召来
  rationale: 该动词指发出尖锐声音以召唤或示意。“吹哨召来”既保留具体声音意象，也清楚表达召集作用。
- source_word: יְהוָה
  choice: 雅威
  rationale: 音译上帝的专名，避免以称号替代原文专名。
- source_word: לַזְּבוּב
  choice: 苍蝇
  rationale: 保留希伯来文单数的集合性、象征性意象，并与后面的单数“蜜蜂”平行。
- source_word: אֲשֶׁר בִּקְצֵה יְאֹרֵי מִצְרָיִם
  choice: 埃及河道尽头的
  rationale: קָצֶה 表示边缘、尽头或最远处；在埃及语境中，יְאֹרִים 可指尼罗河支流、水渠或各类水道，因此用“河道”保留适当宽度。
- source_word: וְלַדְּבוֹרָה
  choice: 以及……蜜蜂
  rationale: 保留单数象征意象及其与“苍蝇”的平行结构。
- source_word: אֲשֶׁר בְּאֶרֶץ אַשּׁוּר
  choice: 亚述地的
  rationale: 简洁保留 אֶרֶץ 的地域含义，符合现代汉语表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用的是神的专名，故以现代汉语常见形式音译，不用称号取代。
- issue: 苍蝇与蜜蜂意象的所指
  choice: 正文保留原文意象，不直接解释为埃及和亚述的军队或势力
  alternative: 在正文中明确译成埃及和亚述的军队
  rationale: 上下文暗示政治军事力量，但本节本身以苍蝇和蜜蜂构成形象化召唤；直译意象可保留其修辞张力，避免加入解释性结论。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。以“到那日……必……”再现先知性宣告；保留苍蝇、蜜蜂的单数象征意象。脚注标记按其在正文所解释内容的顺序排列。
