    rationale: 希伯来文两个单数动词均为阳性单数，语境中指同一概括性的“人”；译文的“它／他”转换造成指代不连贯。
  - severity: medium
    issue: “奶酪”过于具体。
    rationale: חֶמְאָה可指凝结或浓稠的乳制品；现代汉语“奶酪”多指成熟干酪，语义范围偏窄。
  - severity: low
