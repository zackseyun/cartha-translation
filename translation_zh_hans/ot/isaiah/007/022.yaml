base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/022.yaml
  text: And it will happen that because of the abundance of milk he gives[a], he will eat curds; for everyone left in the midst of the land will eat curds and honey.
translation:
  language: zh_hans
  text: 由于他所产的奶极多，他必吃凝乳；因为所有留在这地的人都必吃凝乳和蜂蜜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: 就有
  rationale: 结合后面的因果结构，以自然汉语表达将来会出现的情形；不另加生硬的“事情将是”。
- source_word: מֵרֹב
  choice: 由于……丰富
  rationale: 表达介词与“多、丰富”所构成的原因或来源关系。
- source_word: עֲשׂוֹת חָלָב
  choice: 它产奶
  rationale: עשה与“奶”连用在此指牲畜产出奶；希伯来语未明说牲畜种类，故以“它”保留所指的概括性。
- source_word: יֹאכַל חֶמְאָה
  choice: 他就有奶酪吃
  rationale: חֶמְאָה指凝结或浓稠的乳制品，译作“奶酪”比现代意义的“黄油”更符合语境；“有……吃”自然传达因产奶丰富而获得食物。
- source_word: כִּי
  choice: 因为
  rationale: 保留该词引出解释或理由的功能。
- source_word: חֶמְאָה וּדְבַשׁ
  choice: 奶酪和蜂蜜
  rationale: 保持固定搭配，并使חֶמְאָה的译法前后一致。
- source_word: כָּל הַנּוֹתָר
  choice: 留在这地所有的人
  rationale: 将实体化分词理解为灾后留下、仍存留的人，并用现代汉语自然表达全称范围。
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: 在这地
  rationale: 在汉语中简洁表达“在地境之中”；“这地”承接上下文所指的土地。
