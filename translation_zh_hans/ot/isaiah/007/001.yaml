id: ISA.7.1
reference: Isaiah 7:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֡י בִּ/ימֵ֣י אָ֠חָז בֶּן יוֹתָ֨ם בֶּן עֻזִּיָּ֜הוּ מֶ֣לֶךְ יְהוּדָ֗ה עָלָ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֤הוּ מֶֽלֶךְ יִשְׂרָאֵל֙ יְר֣וּשָׁלִַ֔ם לַ/מִּלְחָמָ֖ה עָלֶ֑י/הָ וְ/לֹ֥א יָכֹ֖ל לְ/הִלָּחֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/001.yaml
  text: And it happened in the days of Ahaz son of Jotham[a], son of Uzziah, king of Judah, that Rezin king of Aram and Pekah son of Remaliah, king of Israel, went up to Jerusalem to wage war against it[b], but they were not able to fight against it.
translation:
  language: zh_hans
  text: 犹大王亚哈斯——约坦的儿子、乌西雅的孙子——在位的时候，亚兰王利汛[a]和以色列王、利玛利的儿子比加上到耶路撒冷，要攻打这城；他却不能攻打这城[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰”传统上也译作“叙利亚”。
    reason: 说明古代地域名称的传统译法。
  - marker: b
    text: 希伯来原文的动词是单数，即“他不能”；但前文的主语包括利汛和比加二人。有些译本据语意译作“他们不能”。
    reason: 保留并解释原文在复合主语之后使用单数动词的语法张力。
lexical_decisions:
- source_word: וַיְהִי בִּימֵי
  choice: 在位的时候
  rationale: וַיְהִי引入历史叙事，בִּימֵי意为“在……的日子”。结合君王语境译作“在位的时候”，符合现代汉语叙事习惯。
- source_word: אָחָז בֶּן יוֹתָם בֶּן עֻזִּיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王亚哈斯——约坦的儿子、乌西雅的孙子
  rationale: 保留父系谱链，同时用“孙子”明确汉语中“约坦的儿子、乌西雅的后代”这一关系，避免误解为亚哈斯同时是两人的儿子。
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: 亚兰王利汛
  rationale: אֲרָם是古代民族和地域名称，译作“亚兰”比沿用后世地理名称“叙利亚”更贴近希伯来原文。
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: 和以色列王、利玛利的儿子比加
  rationale: 保留人名、父名与王号；以顿号处理同位成分，使现代汉语清楚自然。
- source_word: עָלָה ... יְרוּשָׁלִַם
  choice: 上到耶路撒冷
  rationale: 保留עָלָה“上去、上到”的方向性表达；在耶路撒冷语境中，这也是自然且具有传统地理色彩的说法。
- source_word: לַמִּלְחָמָה עָלֶיהָ
  choice: 要攻打这城
  rationale: 目的短语直指对耶路撒冷发动战争；“要攻打这城”既自然，又避免在同一句中机械重复“战争、交战”。
- source_word: וְלֹא יָכֹל לְהִלָּחֵם עָלֶיהָ
  choice: 他却不能攻打这城
  rationale: יָכֹל是阳性单数，故保留“他”，不按前面的并列主语改成“他们”；לְהִלָּחֵם עָלֶיהָ译为“攻打这城”，不擅自强化为“攻下”或“战胜”。
theological_decisions:
- issue: 并列主语之后的单数动词יָכֹל
  choice: 他却不能攻打这城
  alternative: 他们却不能攻打这城
  rationale: 马所拉文本明确使用单数动词。虽然上下文提到利汛和比加两位君王，译文仍保留单数代词所形成的语法张力，并以脚注说明，而不替原文消除这一不一致。
- issue: אֲרָם的地域名称
  choice: 亚兰
  alternative: 叙利亚
  rationale: “亚兰”直接对应希伯来文本中的古代名称，也避免读者将其不加区别地等同于后世或现代的叙利亚。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。破折号标明亚哈斯的父系身份，分号呈现出兵与未能交战之间的转折。译文避免古奥套语，也不将“攻打”解释性强化为“攻克”。
