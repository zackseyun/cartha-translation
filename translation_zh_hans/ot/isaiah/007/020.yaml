base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/020.yaml
  text: In that day the Lord will shave with a hired razor from beyond the River—with the king of Assyria—the head and the hair of the feet[a], and it will also sweep away the beard.
translation:
  language: zh_hans
  text: 到那日，主必用从大河那边雇来的剃刀——亚述王——剃头和脚上的毛[a]，连胡须也要刮尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“腿上的毛”；“脚”也可能是下体的委婉说法，意指下体的毛，突出彻底的羞辱。
    reason: 原文 רַגְלַיִם 字面为“脚／双脚”，但在此可泛指腿，也可能委婉指下体；正文保留较字面的表达，脚注说明可能含义。
lexical_decisions:
- source_word: יְגַלַּח
  choice: 剃去
  rationale: 该词为 גלח 的 Piel 形，表示剃除毛发；“剃去”自然明确，并与后面的头发等宾语相配。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神的称号 אֲדֹנָי，而非四字神名；译作“主”符合现代中文圣经语体。
- source_word: בְּתַעַר הַשְּׂכִירָה
  choice: 用……雇来的剃刀
  rationale: תַּעַר 是“剃刀”，שְׂכִירָה 表示“雇来的”；保留亚述作为神所使用之工具的鲜明比喻。
- source_word: בְּעֶבְרֵי נָהָר
  choice: 大河那边
  rationale: 字面指“河的彼岸地区”，此处的“河”通常是幼发拉底河。正文保留原文地理称谓，不把河名直接写入。
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: 就是亚述王
  rationale: 介词短语说明或同位辨明“雇来的剃刀”所指的工具，即亚述王；“就是”使中文关系清楚，又保留比喻。
- source_word: שַׂעַר הָרַגְלָיִם
  choice: 脚上的毛
  rationale: 按字面译出“脚／足的毛”，不在正文中武断确定它是腿毛还是对下体之毛的委婉说法；歧义交由脚注说明。
- source_word: וְגַם אֶת הַזָּקָן תִּסְפֶּה
  choice: 连胡须也要刮净
  rationale: גם 有递进强调意味；ספה 表示除尽、扫除。中文以“连……也……刮净”保留彻底剥夺与羞辱的力度，并让阴性动词所指的“剃刀”在中文中自然隐含。
theological_decisions:
- issue: 剃除毛发这一比喻的含义
  choice: 保留主以亚述王为工具施行彻底而羞辱性的审判这一图像
  alternative: 仅把它理解为不特别强调羞辱的军事毁灭描写
  rationale: 剃去头发、下身相关毛发和胡须的整体图像指向彻底剥夺和公开受辱；原文语法又将亚述王标明为主所使用的“剃刀”。译文呈现图像本身，不额外加入教派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“大河那边”保留古代近东地理称谓；“就是亚述王”清楚呈现剃刀与亚述王的同位关系。正文脚注标记与脚注相对应。
