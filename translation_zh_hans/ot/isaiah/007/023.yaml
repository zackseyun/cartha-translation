base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/023.yaml
  text: And in that day[b][a], every place where there were a thousand vines worth a thousand pieces of silver will become briars and thorns.
translation:
  language: zh_hans
  text: 到那日，凡有一千株葡萄藤、价值一千银子[b]的地方[a]，都必长满荆棘和蒺藜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡将有一千株葡萄藤、价值一千银子的地方”。希伯来语动词形式可这样直译；上下文则可能是在对比原先贵重的葡萄园与将来的荒芜。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“一千株葡萄藤，值一千银子”；本节没有明确说明银子的货币单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 都必长满
  rationale: 希伯来语以“事情将会如此”引出预言中的情形；中文将其未来、结果意味自然地落实在句末谓语中，避免生硬重复“将会是”。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的时间公式；“到那日”自然庄重，也清楚指向将来的审判时刻。
- source_word: כָל מָקוֹם
  choice: 凡……的地方
  rationale: 表达原文的周遍、分配意义，比逐字译作“每一个地方”更符合现代汉语。
- source_word: אֲשֶׁר יִהְיֶה שָׁם
  choice: 有
  rationale: 原文未完成式可按形式理解为“将有”，也可在上下文中理解为相对于荒废之前已有的状态。正文采用时间中性的“有”，尽量保留其歧义，并以脚注说明。
- source_word: אֶלֶף גֶּפֶן
  choice: 一千棵葡萄树
  rationale: גֶּפֶן指葡萄藤或葡萄树；量词“棵”配合“葡萄树”最便于普通读者理解。
- source_word: בְּאֶלֶף כָּסֶף
  choice: 价值一千银子
  rationale: 介词短语表示价格或估值。原文没有明说货币单位，因此不用“舍客勒”，以“一千银子”保留原文省略。
- source_word: לַשָּׁמִיר וְלַשַּׁיִת
  choice: 长满荆棘和蒺藜
  rationale: 这是以赛亚书中表示荒芜带刺植物的固定搭配；具体植物种类难以确定，采用传统而易懂的概括性译法。
- source_word: יִהְיֶה
  choice: 必长满
  rationale: 字面为“将成为／将归给”；结合贵重葡萄园沦为荒地的语境，“必长满”自然表达其未来状态及变化，同时保留审判语气。
theological_decisions: []
