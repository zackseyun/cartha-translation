  text: וַ/יֹּ֕אמֶר שִׁמְעוּ נָ֖א בֵּ֣ית דָּוִ֑ד הַ/מְעַ֤ט מִ/כֶּם֙ הַלְא֣וֹת אֲנָשִׁ֔ים כִּ֥י תַלְא֖וּ גַּ֥ם אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/013.yaml
  text: And he said[a], “Listen, please, house of David! Is it too little for you to weary men[b], that you also weary my God?”
translation:
  language: zh_hans
  text: 他说：“大卫家啊，请听！你们使人[a]厌烦，难道还算小事，以致你们也使我的上帝厌烦吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”的希伯来语形式是阳性复数，也可译作“男人”；此处主要与后面的“上帝”形成对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 以自然的汉语叙事表达承接式动词，保留由先知发言的语篇推进，不额外强化时间先后。
- source_word: שִׁמְעוּ נָא
  choice: 请听
  rationale: 复数命令式要求整个“大卫家”听，נָא在这里带有恳请或催促语气；“请听”简洁自然。
- source_word: בֵּית דָּוִד
  choice: 大卫家
  rationale: 指大卫王朝及其代表群体，并非仅指一户家庭；沿用汉语中清楚而凝练的王朝性称呼。
- source_word: הַמְעַט מִכֶּם
  choice: 还算是小事吗
  rationale: 这是反问惯用语，意为对方难道以为某事不足为重；译文既保留“小”的意象，也符合现代汉语表达。
- source_word: הַלְאוֹת / תַלְאוּ
  choice: 使……厌烦 / 使……厌烦
  rationale: 两处同源于לאה，表示使人疲乏、厌倦或不胜其扰；重复“厌烦”保留原文刻意的词语复现。
- source_word: אֲנָשִׁים
  choice: 人
  rationale: 此处复数名词与后面的上帝形成“人—上帝”的对照；汉语“人”最自然地表达泛指的人类对象，同时脚注说明其语法形式。
- source_word: כִּי ... גַּם
  choice: 竟然也
  rationale: 在反问之后表达递进和责备：不仅使人厌烦，甚至还使上帝厌烦；“竟然也”传达这种升级语气，同时不把כִּי僵硬地译作因果连词。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 保留第一人称单数所属后缀，呈现以赛亚个人而具告白意味的措辞，不泛化为“上帝”。
theological_decisions:
- issue: אֲנָשִׁים所指范围及其与上帝的对照
  choice: 人
  alternative: 男人；世人
  rationale: 该词在形态上是阳性复数，但可泛指人；本节的核心对照是人类与上帝，而非男性与女性。“人”既不凭空限定性别，也保留这层神学和修辞对照。
- issue: אֱלֹהָי中的第一人称所属关系
  choice: 我的上帝
  alternative: 上帝
  rationale: 原文明确说“我的上帝”，可能凸显先知与大卫家的立场张力；译文保留这一关系，不替作者消解其含义。
- issue: 全句反问与责备的关系
  choice: 分作前后相连的两个反问式感叹句
  alternative: 合为一个反问句：“……还算小事，竟也使我的上帝厌烦吗？”
  rationale: 原文可作为一个延展的反问来理解。汉语分句能清楚呈现由“使人厌烦”到“使我的上帝厌烦”的递进，却不改变其责备性质。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“大卫家啊”保留直接呼语和王朝含义；以“还算是小事吗？竟然也……”传达原文强烈的反问与递进责备。
