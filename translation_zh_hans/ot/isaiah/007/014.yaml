language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ֠/כֵן יִתֵּ֨ן אֲדֹנָ֥/י ה֛וּא לָ/כֶ֖ם א֑וֹת הִנֵּ֣ה הָ/עַלְמָ֗ה הָרָה֙ וְ/יֹלֶ֣דֶת בֵּ֔ן וְ/קָרָ֥את שְׁמ֖/וֹ עִמָּ֥נוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/014.yaml
  text: 'Therefore the Lord himself will give you a sign: behold[a], the young woman is pregnant and is bearing a son[d][c][b], and she will call his name Immanuel.'
translation:
  language: zh_hans
  text: 所以，主必亲自给你们一个兆头：看哪，那位年轻女子[a]已经怀孕，将要生一个儿子[b]；她要给他起名为“以马内利”[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那童女”。这里的希伯来词 עַלְמָה 意为“年轻女子”；希腊文《七十士译本》所用的词常被理解为“童女”，《马太福音》1:23 引用本节时也采用这一形式。
    reason: alternative_reading
  - marker: b
    text: 传统译法作“必怀孕生子”。希伯来文更直接地把女子描述为已经怀孕，并处于将要生产的情形。
    reason: lexical_alternative
  - marker: c
    text: 或译“你要给他起名”；一些古代译本传统反映这种读法。《马太福音》1:23 作“人要称他的名为”。
    reason: textual_variant
  - marker: d
    text: “以马内利”意思是“上帝与我们同在”。
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接亚哈斯拒绝求兆头一事，引出其结果；“所以”符合现代汉语的自然衔接。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是 אֲדֹנָי，并非四字神名；译作“主”准确而庄重。
- source_word: הוּא
  choice: 亲自
  rationale: 独立代词带强调作用；“亲自”清楚表达是主自己赐下兆头。
- source_word: לָכֶם
  choice: 给你们
  rationale: 原文为第二人称复数，所指不只亚哈斯一人；“你们”保留其复数形式。
- source_word: אוֹת
  choice: 兆头
  rationale: 表示由上帝赐下、具有指示或印证作用的记号；“兆头”在本段预言语境中自然明确。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意的指示语气，也符合庄重的先知性文体。
- source_word: הָעַלְמָה
  choice: 那年轻女子
  rationale: עַלְמָה 指适婚年龄的年轻女子，词义本身并不明说她是处女；定冠词译为“那”，相关传统译法在脚注交代。
- source_word: הָרָה
  choice: 已经怀孕
  rationale: 这是描述怀孕状态的谓语性形式；“已经怀孕”自然表达经文所呈现的当前状态。
- source_word: וְיֹלֶדֶת
  choice: 将要生
  rationale: 阴性单数分词与“已经怀孕”连用，描绘正在展开或临近的生产事件；汉语若直译为“正在生”容易限定为分娩当刻，因此以“将要生”作合乎语境的最优对应，同时在脚注说明传统译法和希伯来文形式。
- source_word: בֵּן
  choice: 一个儿子
  rationale: 符合现代汉语在“生”之后表达不定宾语的习惯。
- source_word: וְקָרָאת שְׁמוֹ
  choice: 她要给他起名叫
  rationale: 按所给马所拉文本，动词最直接理解为阴性单数；汉语用“给他起名叫”自然表达希伯来语“称他的名为”的结构。
- source_word: עִמָּנוּ אֵל
  choice: 以马内利
  rationale: 采用通行音译，并在脚注说明该名字的含义。
theological_decisions:
- issue: 在具有基督论意义的预言中如何翻译 הָעַלְמָה
  choice: 那年轻女子
  alternative: 那童女／那处女
  rationale: 希伯来词 עַלְמָה 本身最直接指年轻女子，并不单凭词义明确宣称童贞。正文优先呈现希伯来文本，脚注同时交代《七十士译本》和《马太福音》1:23 所反映的“童女”传统，以保留正典关联而不把后来的译法直接代入希伯来正文。
- issue: הָרָה וְיֹלֶדֶת 的时态和体貌
  choice: 已经怀孕，将要生
  alternative: 必怀孕生子／怀着孕，正在生
  rationale: 原文使用表示怀孕状态的形式和一个分词，而不是两个简单将来时动词。中文正文既呈现当前怀孕状态，也自然表达临近的生产，同时以脚注保留传统译法。
- issue: וְקָרָאת 中给孩子起名的人是谁
  choice: 她要给他起名
  alternative: 你要给他起名／人要称他的名为
  rationale: 所给马所拉文本最直接支持阴性单数主语“她”。部分古代译本传统以及《马太福音》1:23 反映不同的人称或不定主语表达，故在脚注中透明说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“看哪”的先知性语气；用“兆头”表达 אוֹת，用“那年轻女子”保持定指和原文词义范围。人称复数“你们”明确保留。专名采用简体中文圣经传统通行译名“以马内利”。
