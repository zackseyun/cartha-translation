  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/רֹ֤אשׁ אֶפְרַ֨יִם֙ שֹׁמְר֔וֹן וְ/רֹ֥אשׁ שֹׁמְר֖וֹן בֶּן רְמַלְיָ֑הוּ אִ֚ם לֹ֣א תַאֲמִ֔ינוּ כִּ֖י לֹ֥א תֵאָמֵֽנוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/009.yaml
  text: And the head of Ephraim is Samaria[a], and the head of Samaria is the son of Remaliah. If you do not believe[b], surely you will not be established.
translation:
  language: zh_hans
  text: 以法莲的首府是撒马利亚，撒马利亚的首领是利玛利的儿子。你们若不信，就必站立不住。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“信”和“站立得住”来自同一个希伯来词根（אמן），把信靠与稳固地站立联系起来。也可译作：“你们若不信靠，就不能站稳。”
    reason: 说明原文双关及可行的替代译法。
lexical_decisions:
- source_word: רֹאשׁ
  choice: 首府／首领
  rationale: רֹאשׁ 在两个平行短语中都是“头、首”的比喻用法，但所指分别为一座城和一个人。译作“首府／首领”既符合现代汉语，又借共同的“首”保留原文的平行关系。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 保留原文的专名；在本语境中指北国，但正文不直接改译为“以色列”或“以法莲国”。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用现代中文圣经语境中通行的地名译法；此处指以法莲的政治中心。
- source_word: בֶּן רְמַלְיָהוּ
  choice: 利玛利的儿子
  rationale: 按原文保留父名式称呼，不补出其人名“比加”，以保存先知刻意不用王名的修辞效果。
- source_word: אִם לֹא תַאֲמִינוּ
  choice: 你们若不信
  rationale: 将 אִם לֹא 视为条件从句；תַאֲמִינוּ 是复数，故明确译出“你们”。“信”简洁地涵盖相信、信靠之意。
- source_word: כִּי לֹא תֵאָמֵנוּ
  choice: 就必站立不住
  rationale: כִּי 在此表达条件句后半句的强调结果；תֵאָמֵנוּ 指得以稳固、站稳。此译自然地表达无法稳立的警告，并与前面的“信”保持概念联系。
theological_decisions:
- issue: 句末两个 אמן 词形之间的双关
  choice: 你们若不信，就必站立不住
  alternative: 你们若不信靠，就不能站稳
  rationale: 原文先用使役形表达“相信／信靠”，再用被动形表达“得以稳固／站立得住”。正文保留两者的语义区别，不把“信”扩写成特定教义概念；脚注说明两词同根，以保存原文的神学张力和修辞力量。
- issue: רֹאשׁ 在平行句中的处理
  choice: 首府／首领
  alternative: 头／头
  rationale: 逐字译作“头”在现代汉语中生硬且可能含混。分别译出城市和人物的政治功能，同时以“首”字维系平行，不额外解释北国的政体。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“首府／首领”使两个 רֹאשׁ 的不同所指清楚可懂，同时保留形式上的呼应；末句简短有力，符合先知警告的语气。
