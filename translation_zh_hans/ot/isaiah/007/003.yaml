base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/003.yaml
  text: Then Yahweh said to Isaiah[a], “Go out now to meet Ahaz, you and Shear-jashub your son, at the end of the conduit of the upper pool[b], on the road to the launderer’s field.”
translation:
  language: zh_hans
  text: 耶和华对以赛亚说：“你和你儿子施亚雅述[a]现在出去迎接亚哈斯，到上池水渠的尽头，在洗衣人田地的路上[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施亚雅述”意为“余民将归回”。
    reason: lexical_alternative
  - marker: b
    text: “洗衣人田地”也可译作“漂布者田地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中广为人知的专名“耶和华”对应四字神名，保留其作为以色列之神名字的性质，而不以“主”这一称号替代。
- source_word: צֵא נָא
  choice: 现在出去
  rationale: צֵא是直接命令“出去”，נָא在此增添催促或请求语气；“现在出去”自然地传达即时性。
- source_word: לִקְרַאת
  choice: 迎接
  rationale: 该词组表示出去与某人会面；“迎接”既简洁，又符合人物从所在之处出去见亚哈斯的场景。
- source_word: שְׁאָר יָשׁוּב
  choice: 施亚雅述
  rationale: 这是以赛亚儿子的名字，正文采用音译；其具有主题意义的字面含义在脚注说明。
- source_word: קְצֵה תְּעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: 上池水渠的尽头
  rationale: תְּעָלָה指人工输水渠道，בְּרֵכָה指池或蓄水池；此译简明保留地点关系。
- source_word: מְסִלַּת שְׂדֵה כוֹבֵס
  choice: 通往洗衣人田地的路上
  rationale: מְסִלָּה在此指道路，כּוֹבֵס指洗涤或整理布匹的人；采用普通读者易懂的“洗衣人”，不使用较生僻的传统术语“漂布者”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名。中文正文保留专名性质；“耶和华”在现代中文圣经传统中辨识度最高，同时避免以称号“主”取代名字。
- issue: 施亚雅述这一名字的意义
  choice: 正文音译，脚注注明“余民将归回”
  alternative: 正文直译为“余民将归回”
  rationale: 句法明确把它作为以赛亚儿子的专名；音译维持人物称谓，脚注则保留该名字在以赛亚书中的神学与文学张力。“归回”既可能指返回，也可能带有回转之意，不在正文中预先限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。地点描写按中文习惯稍作重组；保留专名及其脚注意义。所有脚注标记均已置于正文相应位置。
