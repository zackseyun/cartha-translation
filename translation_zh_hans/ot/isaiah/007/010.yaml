  text: וַ/יּ֣וֹסֶף יְהוָ֔ה דַּבֵּ֥ר אֶל אָחָ֖ז לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/010.yaml
  text: And Yahweh continued to speak to Ahaz[a], saying,
translation:
  language: zh_hans
  text: 耶和华又对亚哈斯说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似“耶和华又加以对亚哈斯说”，是惯用表达，可意为“耶和华继续对亚哈斯说”或“耶和华再次对亚哈斯说”。
    reason: 说明希伯来语惯用结构及其可保留的两种语义侧重。
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: 又
  rationale: יָסַף与不定式连用可表示再次或继续做某事。这里引出耶和华再次发言；现代汉语用“又”简洁自然，也保留其迭代意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，而不以“主”这一称号替代。
- source_word: דַּבֵּר
  choice: 说
  rationale: 该不定式与וַיּוֹסֶף构成惯用表达；合译为“又……说”，符合现代汉语叙事表达。
- source_word: אֶל
  choice: 对
  rationale: 在言说语境中，אֶל标明话语所指向的对象，汉语自然译作“对”。
- source_word: אָחָז
  choice: 亚哈斯
  rationale: 采用该希伯来人名在现代中文圣经中的通行音译。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该形式引出随后话语的内容。汉语通常不重复译成“说着说”，而由句末“说”自然承担引语引介功能。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主；主
  rationale: 原文使用神的专名。正文保留专名而非改成称号；选用现代中文读者最熟悉且通行的“耶和华”。
- issue: וַיּוֹסֶף所表达的是继续说还是再次说
  choice: 又……说
  alternative: 继续对……说
  rationale: 该结构本身容许“继续”或“再次”的理解，上下文也可视为新的发言段落。选“又”保留这两者之间一定的开放性，不强行判定发言是否无间断延续。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“又对……说”适合叙事经文，并避免生硬照搬希伯来语的“加以说”。
