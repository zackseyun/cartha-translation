  yaml_path: translation/ot/isaiah/007/007.yaml
  text: 'Thus says the Lord GOD: It shall not stand[a], and it shall not come to pass.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“这事必不成立[a]，也不得实现。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“它必不站立，也必不成为。”这里是说，上文所述的计谋不会成立，也不会成为事实。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知宣告中常见的使者公式；“如此说”简洁庄重，并保留 כֹּה 的指示意味。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达 אֲדֹנָי（主）与四字神名 יהוה（耶和华），避免把复合称号缩减为单一头衔。
- source_word: לֹא תָקוּם
  choice: 这事必站立不住
  rationale: קום 的基本意象是“站立”；在上文所述敌对计谋的语境中，指该计谋不能确立、不能成功。“这事”承接上文，在中文中补足隐含主语。
- source_word: וְלֹא תִהְיֶה
  choice: 也必不能成就
  rationale: היה 的字面义是“成为、存在”；用于计谋时表示成为事实。译作“成就”符合现代中文，同时以脚注保留较直译的表达。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时含“主”这一称号和四字神名；“主耶和华”在简体中文圣经语域中清楚、庄重，也不省略其中任何一项。
- issue: 两个否定分句所指对象
  choice: 按上下文理解为敌人的计谋不能确立、不能实现
  alternative: 严格逐字译为“它必不站立，也必不存在”
  rationale: 希伯来文的阴性单数动词承接上文的“计谋”；正文作自然中文表达，但脚注保留第二分句的字面张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“这事”是依据上文补出的中文主语；“必……不”体现原文断然否定的语气。
