  text: יָבִ֨יא יְהוָ֜ה עָלֶ֗י/ךָ וְ/עַֽל עַמְּ/ךָ֮ וְ/עַל בֵּ֣ית אָבִי/ךָ֒ יָמִים֙ אֲשֶׁ֣ר לֹא בָ֔אוּ לְ/מִ/יּ֥וֹם סוּר אֶפְרַ֖יִם מֵ/עַ֣ל יְהוּדָ֑ה אֵ֖ת מֶ֥לֶךְ אַשּֽׁוּר־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/017.yaml
  text: Yahweh will bring upon you[a], upon your people[b], and upon your father's house days unlike any that have not come since the day Ephraim turned away from Judah—namely, the king of Assyria.
translation:
  language: zh_hans
  text: 耶和华必使自从以法莲离开犹大以来从未有过的日子临到你、你的百姓和你的父家[a]——亚述王。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父家”可指父系家族；在这里也可特指亚哈斯所属的王室家族。
    reason: cultural_note
  - marker: b
    text: 原文句末仅为“亚述王”。这可作对前述空前之日的后置说明，也可理解为与“日子”同受“必使……临到”支配。
    reason: textual_ambiguity
lexical_decisions:
- source_word: יָבִיא
  choice: 必使……临到
  rationale: 这是 בוא 的使役形，表示“使……来到”或“带来”。“必使……临到”既保留使役意义，也符合庄重而自然的现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名音译呈现四字神名，不以“主”这一称号替代。
- source_word: עָלֶיךָ ... וְעַל עַמְּךָ ... וְעַל בֵּית אָבִיךָ
  choice: 临到你、你的百姓和你的父家
  rationale: 重复的 עַל 表示这些日子将临到的对象。汉语不逐次重复“临到”，以免生硬，同时保留三个受影响的层面。
- source_word: יָמִים
  choice: 一些日子
  rationale: 保留“日子”的时间意象；加“一些”使“使日子临到”在现代汉语中较为顺畅，并指向一段将临的时期。
- source_word: אֲשֶׁר לֹא בָאוּ
  choice: 这样の日子从未有过
  rationale: 希伯来文否定句说明这些日子前所未有。译文避免英文咨询层中“unlike any that have not come”可能造成的双重否定歧义。
- source_word: לְמִיּוֹם סוּר אֶפְרַיִם מֵעַל יְהוּדָה
  choice: 自从以法莲离开犹大以来
  rationale: סוּר 可指离开、转离。主文采用较少解释性的“离开”，不直接把历史事件释为“分裂”或“背叛”。
- source_word: אֵת מֶלֶךְ אַשּׁוּר
  choice: 也就是亚述王来临的日子
  rationale: 句末短语说明前述空前日子的具体内容或施行者。汉语补出“来临的日子”，使关系清楚，但以脚注保留希伯来文简短突兀的表达及其句法张力。
- source_word: בֵּית אָבִיךָ
  choice: 你的父家
  rationale: 保留希伯来社会用语，既可指父系家族，也可在亚哈斯的语境中涵盖王室宗族，而不在主文中过早限定为“王朝”。
theological_decisions:
- issue: 亚述王与将临之日的句法关系
  choice: 将亚述王理解为那些空前之日的具体体现或带来者，并译作“亚述王来临的日子”
  alternative: 把“亚述王”视为与“日子”并列或后置的独立宾语，译作“耶和华必使……日子……临到……，又使亚述王临到”
  rationale: 句末 אֵת מֶלֶךְ אַשּׁוּר 极为凝缩，可视为后置说明。主文采用汉语可懂的表达，同时脚注提示原文形式，不把亚述在更广神学框架中的角色作额外发挥。
- issue: 审判所波及的范围
  choice: 保留“你、你的百姓和你的父家”三个对象
  alternative: 把“父家”直接解释为“大卫王朝”
  rationale: 原文同时指向亚哈斯本人、百姓及其父系家室；保留原有层次，避免把语境所暗示的王室含义写成唯一明说的意思。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“父家”保留经文的家族社会意象，并以脚注解释；破折号表现原文句末突然点出“亚述王”的强调。主文不直接使用“灾祸”“入侵”或“王朝”等解释性词语，以保存预言本身的凝缩与张力。
