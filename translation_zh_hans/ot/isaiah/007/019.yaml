  rationale: 修订保留前文虫群语境所支持的“飞来”，并以一次“落在”对应原文的安歇／落下。对两个词义困难的地貌（或场所）词，正文采用与英文审计轨迹相符且在现代汉语中自然的译法，脚注则保留主要可行替代义，避免将有争议的解释当作确定含义。
