base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/019.yaml
  text: And they will all come and settle in the steep ravines[a], in the clefts of the rocks, in all the thornbushes[c][b], and in all the watering places.
translation:
  language: zh_hans
  text: 它们都必飞来，落在陡峭的峡谷[a]、岩石的缝隙、所有的荆棘丛中，以及所有的饮水处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陡峭的峡谷”：原文这一短语含义不确定；也可理解为“荒芜的溪谷”或“悬崖下的谷地”。
    reason: lexical_alternative
  - marker: b
    text: “饮水处”：原文末一词罕见，含义不确定；也可译作“牧场”或“草地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: 必飞来
  rationale: בוא的基本义是“来”；本节承接7:18所说的苍蝇和蜜蜂，中文用“飞来”自然显明其移动方式。“必”表达先知话语中连词完了式的将来指向。
- source_word: וְנָחוּ
  choice: 停落
  rationale: נוח可指歇息、安顿或飞行物落下；这里的主语是前文召来的苍蝇和蜜蜂，“停落”既贴合语境，也保留“落下歇息”的意象。
- source_word: כֻלָּם
  choice: 它们都
  rationale: 明确保留原文“全都”的整体性，并以代词承接前文的虫群。
- source_word: בְּנַחֲלֵי הַבַּתּוֹת
  choice: 在荒芜的溪谷
  rationale: נחלים指谷地、溪谷或季节性河谷；הבתות语义困难，可能与荒废之地有关。“荒芜的溪谷”自然且保留地貌与荒凉感，其他可能译法收入脚注。
- source_word: וּבִנְקִיקֵי הַסְּלָעִים
  choice: 岩石缝里
  rationale: נקיקים是裂缝、罅隙，סלעים是岩石或峭壁；此译具体、简洁，并符合现代汉语。
- source_word: וּבְכֹל הַנַּעֲצוּצִים
  choice: 所有荆棘丛中
  rationale: נעצוצים指带刺的灌木或荆棘；“荆棘丛”准确呈现可供虫群停落的密生植物。
- source_word: וּבְכֹל הַנַּהֲלֹלִים
  choice: 所有水草地
  rationale: נהללים是罕见且词义不确定的词，可能指饮水处、牧草地或草场。“水草地”在中文中可兼顾水源与草地两种主要理解，同时以脚注保留不确定性。
