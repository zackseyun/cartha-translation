  text: חֶמְאָ֥ה וּ/דְבַ֖שׁ יֹאכֵ֑ל לְ/דַעְתּ֛/וֹ מָא֥וֹס בָּ/רָ֖ע וּ/בָח֥וֹר בַּ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/015.yaml
  text: He will eat curds and honey by the time he knows to refuse the evil and choose the good[a][b].
translation:
  language: zh_hans
  text: 到他懂得弃绝恶、选择善的时候，他必吃凝乳和蜂蜜。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当他懂得弃绝恶、选择善时。”原文的表达也可能着重指明这种饮食情形延续到何时。
    reason: alternative_reading
  - marker: b
    text: “凝乳”也可译作“黄油”或“奶油”；原词泛指一种乳制品。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: 奶酪
  rationale: 该词泛指乳制品，在此很可能是凝乳一类；“奶酪”是现代汉语中自然且易懂的对应词，但其确切形态并不确定。
- source_word: וּדְבַשׁ
  choice: 和蜂蜜
  rationale: 直接保留并列关系；“蜂蜜”是 דְבַשׁ 在此处的常规译法。
- source_word: יֹאכֵל
  choice: 他必吃
  rationale: 未完成式在预告孩子将来情形的语境中具有将来意义；“必”符合庄重的预言语体。
- source_word: לְדַעְתּוֹ
  choice: 到他懂得……的时候
  rationale: לְ 加不定式附属形及代词后缀在此可表达时间，并可能含有达到某一时间点的意味；译文保留这种时间关系。
- source_word: מָאוֹס
  choice: 弃绝
  rationale: 在与“选择”相对的伦理语境中，表示拒斥而非单纯厌恶；“弃绝”自然、庄重，也保留较强的拒绝意味。
- source_word: בָּרָע
  choice: 恶
  rationale: 汉语以“恶”与“善”构成自然对举，无须机械表达希伯来语冠词。
- source_word: וּבָחוֹר
  choice: 选择
  rationale: 准确表达主动拣选，并与“弃绝”形成平行对照。
- source_word: בַּטּוֹב
  choice: 善
  rationale: “善”与“恶”在现代汉语中构成简洁、庄重的伦理对举。
theological_decisions:
- issue: לְדַעְתּוֹ 与孩子饮食及分辨善恶之间的时间关系
  choice: 译作“到他懂得……的时候”，将其理解为时间标记。
  alternative: 可译作“当他懂得……”；也可能按目的关系理解为“为使他懂得……”。
  rationale: 上下文较自然地把孩子达到伦理分辨能力的阶段作为时间参照；此译法不暗示奶酪和蜂蜜导致其道德辨别力，同时不把希伯来语可能表达的时间界限规定得过死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弃绝恶、选择善”保留原文的平行结构；两个脚注分别说明时间表达的歧义和乳制品名称的不确定性。
