base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/006.yaml
  text: Let us go up against Judah[a], and terrify her, and break her open for ourselves[b], and make the son of Tabeel king in her midst.
translation:
  language: zh_hans
  text: “我们上去攻打犹大，使她恐惧[a]，为我们自己攻破她[b]，在她中间立他比勒的儿子为王。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使她惊慌”、“使她烦扰”或“骚扰她”。这里的希伯来语动词含义较难确定；正文按使人恐惧、惊慌的意思翻译。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为我们自己打开她的缺口”或“为我们自己把她撕裂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲלֶה בִיהוּדָה
  choice: 我们上去攻打犹大
  rationale: עלה在军事语境中表示上去进攻，介词ב在此表达敌对指向；“上去攻打”既保留原文意象，也符合现代汉语。
- source_word: וּנְקִיצֶנָּה
  choice: 使她惊慌
  rationale: קוץ的使役形式在本节含义较难确定，语境支持使犹大恐惧、惊慌；此译保留使役意义，又避免把不确定词义说得过强。
- source_word: וְנַבְקִעֶנָּה אֵלֵינוּ
  choice: 为自己攻破她
  rationale: בקע表示劈开、冲破或打开缺口；在围攻语境中“攻破”自然准确。אֵלֵינוּ表达攻击者要将犹大夺取归己或供自己利用，故译“为自己”。
- source_word: וְנַמְלִיךְ מֶלֶךְ
  choice: 立……为王
  rationale: מלך的使役形式表示使某人作王、拥立为王；汉语“立……为王”简洁而准确。
- source_word: בְּתוֹכָהּ
  choice: 在她中间
  rationale: 阴性后缀指向犹大；用“她”保留原文对犹大的拟人化表达。
- source_word: בֶּן טָבְאַל
  choice: 他比勒的儿子
  rationale: בֶּן是普通名词“儿子”，טָבְאַל按人名音译为“他比勒”，不将二者合并成一个名字。
theological_decisions:
- issue: 犹大的阴性拟人化
  choice: 以“她”指代犹大
  alternative: 以“它”指代犹大
  rationale: 原文连续使用阴性单数后缀指向犹大。保留“她”体现其语法和拟人效果，不额外引入神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上去攻打”“立……为王”保留军事行动和拥立傀儡君王的语境；正文及脚注标记完整对应。
