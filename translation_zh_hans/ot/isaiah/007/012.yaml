base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/012.yaml
  text: But Ahaz said[a], “I will not ask[b], and I will not test Yahweh.”
translation:
  language: zh_hans
  text: 亚哈斯却说：“我不求，也不试探雅威。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却说
  rationale: 连词在叙事中承接上文；鉴于亚哈斯拒绝上一节所给的邀请，用“却”自然表达语境中的转折。
- source_word: אָחָז
  choice: 亚哈斯
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: לֹא אֶשְׁאַל
  choice: 我不求
  rationale: שׁאל意为“求、请求、询问”；这里特指求一个兆头，简洁的“求”既自然又保留其语境含义。
- source_word: וְלֹא אֲנַסֶּה
  choice: 也不试探
  rationale: נסה的Piel形式表示试验、考验或置于试验之下。中文“试探”在“试探耶和华”这一搭配中自然，也不必理解为引诱犯罪。
- source_word: אֶת יְהוָה
  choice: 耶和华
  rationale: אֶת为直接宾语标记，不另译；יהוה是神的专名，采用现代中文读者熟悉的传统音译“耶和华”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文圣经传统且广为人知的“耶和华”，同时将其作为专名而非普通称号处理；“雅威”是更接近学界常见重构发音的可行译法。
- issue: אֲנַסֶּה用于对神的行为
  choice: 试探
  alternative: 试验／考验
  rationale: “试探耶和华”是自然且庄重的中文表达，能传达把神置于验证之下的意思；这里并非指引诱神作恶，因此不作这种狭义解释。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。以“却”呈现上下文中的拒绝和转折；两个否定分句保持原文的并列结构。
