source:
  edition: WLC
  text: כִּ֣י רֹ֤אשׁ אֲרָם֙ דַּמֶּ֔שֶׂק וְ/רֹ֥אשׁ דַּמֶּ֖שֶׂק רְצִ֑ין וּ/בְ/ע֗וֹד שִׁשִּׁ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה יֵחַ֥ת אֶפְרַ֖יִם מֵ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/008.yaml
  text: For the head of Aram is Damascus[a], and the head of Damascus is Rezin; and within sixty-five years Ephraim will be shattered from being a people.
translation:
  language: zh_hans
  text: 因为亚兰的首城是大马士革，大马士革的首领是利汛；六十五年之内，以法莲必被粉碎，不再成为一个民族[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以致不再成为一个民族。”
    reason: 原文 מֵעָם 可表达脱离作为一个民／民族共同体的状态，也可按结果意义理解。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先知的警告提供理由；现代汉语以“因为”自然表达这一逻辑关系。
- source_word: רֹאשׁ
  choice: 首府／首领
  rationale: 希伯来语同一词两次出现，字面为“头”。用于地域时指居首位的城市，译作“首府”；用于大马士革与利汛的关系时指统治者，译作“首领”。这样保留语义对应，同时避免汉语“头”造成误解。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 保留希伯来地名，避免以较晚的“叙利亚”替代而产生时代错置。
- source_word: דַּמֶּשֶׂק
  choice: 大马士革
  rationale: 采用现代中文通行译名。
- source_word: רְצִין
  choice: 利汛
  rationale: 采用中文圣经传统中通行、易识别的人名译法。
- source_word: וּבְעוֹד
  choice: 再过
  rationale: 表达从说话时算起尚有一段时间，符合现代汉语时间表达。
- source_word: שִׁשִּׁים וְחָמֵשׁ שָׁנָה
  choice: 六十五年
  rationale: 按现代汉语规范表达数目。
- source_word: יֵחַת
  choice: 必被粉碎
  rationale: 该动词的被动形态在此表示遭到击碎、瓦解；“被粉碎”传达作为政治民族实体的决定性崩解。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 保留原文所用支派兼国名，不以“北国”或“以色列”代替。
- source_word: מֵעָם
  choice: 不再成为一族
  rationale: מִן 表示脱离原有状态，语境所指是以法莲失去独立民族共同体的地位；“一族”比“一国”更贴近 עַם，同时在现代汉语中较自然。脚注保留可理解为结果表达的另一种译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。首个 רֹאשׁ 依地域关系译为“首府”，第二个依人物统治关系译为“首领”，以清楚传达同一希伯来语隐喻在两处的不同指向。主句保留预言语气“必”，并以脚注呈现末语的真实句法歧义。
