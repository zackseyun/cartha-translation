translation:
  language: zh_hans
  text: 到那日，必有人养活一头小母牛[a]和两只羊[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一头母牛犊”。希伯来语短语指牛群中的一头幼年雌牛。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“羊”的希伯来语词是小型家畜的集合称呼，通常可包括绵羊和山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日……将
  rationale: 这是先知话语中常见的将来时间表达。“到那日”自然保留其预告语气，并以“将”体现 וְהָיָה 的将来指向，避免生硬直译为“事情将是”。
- source_word: יְחַיֶּה
  choice: 养活
  rationale: 此处是 חיה 的 Piel 形式，表示使动物存活、维持其生存。“养活”既保留具体含义，也符合现代汉语谈论牲畜的自然表达；不译作“饲养”，以免弱化“使之存活”的语义。
- source_word: אִישׁ
  choice: 一个人
  rationale: 希伯来语为阳性单数，描绘一个有代表性的个体。汉语“一个人”自然准确，无须额外突出性别。
- source_word: עֶגְלַת בָּקָר
  choice: 一头小母牛
  rationale: 该短语指牛群中的一头幼年雌牛。“小母牛”通俗易懂，并保留其雌性和幼年的特征。
- source_word: וּשְׁתֵּי צֹאן
  choice: 和两只羊
  rationale: צֹאן 是指小型家畜的集合名词，通常涵盖绵羊和山羊。正文采用自然简洁的“羊”，并用脚注说明其较宽泛的范围。
