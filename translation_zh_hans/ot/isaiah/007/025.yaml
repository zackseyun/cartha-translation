  rationale: 修订删除不受马所拉文本动词性别支持、并会改变荒凉意象的脚注b替代解释；同时将“放牛之处”调整为“任牛出入”，以更清楚保留“放出牛”的原文图像。其余译文及脚注的词义取向可保留。
