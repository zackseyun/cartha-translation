source:
  edition: WLC
  text: וְ/כֹ֣ל הֶ/הָרִ֗ים אֲשֶׁ֤ר בַּ/מַּעְדֵּר֙ יֵעָ֣דֵר֔וּ/ן לֹֽא תָב֣וֹא שָׁ֔מָּ/ה יִרְאַ֖ת שָׁמִ֣יר וָ/שָׁ֑יִת וְ/הָיָה֙ לְ/מִשְׁלַ֣ח שׁ֔וֹר וּ/לְ/מִרְמַ֖ס שֶֽׂה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/025.yaml
  text: And as for all the hills that used to be hoed with a hoe[a], you will not go there for fear of briers and thorns[d][c][b]; they will become a place for the sending out of oxen and for the trampling of sheep.
translation:
  language: zh_hans
  text: 至于所有曾用锄头锄过的山冈[a]，你因害怕荆棘和蒺藜，不会到那里去[b]；那里必成为任牛出入、羊群践踏之地[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有用锄头翻挖（耕种）的山冈。”希伯来语在这里使用同根的名词和动词。
    reason: lexical_alternative
  - marker: b
    text: “你不会到那里去”也可泛指：“人不会到那里去。”
    reason: lexical_alternative
  - marker: c
    text: “任牛出入”也可译作“任牛游荡”；或较意译作“牛的牧场”。
    reason: lexical_alternative
  - marker: d
    text: “羊群”所译的希伯来语也可广指绵羊、山羊等小型牲畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הֶהָרִים
  choice: 至于所有……山冈
  rationale: וְכֹל在此引出荒凉景象中的另一类地貌；“至于所有”体现话题转换。הַר在耕作和放牧语境中译作“山冈”比“高山”更贴切。
- source_word: אֲשֶׁר בַּמַּעְדֵּר יֵעָדֵרוּן
  choice: 曾用锄头锄过的
  rationale: מַעְדֵּר指锄头或鹤嘴锄，相关动词指用锄翻挖、耕作。“用锄头锄过”尽量保留希伯来语同根名词与动词的重复；“曾”体现这些山冈先前受过耕作，并与即将荒废形成对照。
- source_word: לֹא תָבוֹא שָׁמָּה
  choice: 你……不会到那里去
  rationale: 动词为第二人称阳性单数，可直译为“你不会到那里去”，也可能泛指任何人；正文保留人称形式，脚注说明泛指可能。
- source_word: יִרְאַת שָׁמִיר וָשַׁיִת
  choice: 因害怕荆棘和蒺藜
  rationale: שָׁמִיר וָשַׁיִת是以赛亚书中反复出现的成对词语，泛指侵占荒地的带刺植物。“荆棘和蒺藜”自然、庄重，也与上下文的荒凉意象一致。יִרְאַת按原因理解为人因惧怕这些植物而避开该地，同时以脚注保留另一种句法分析。
- source_word: וְהָיָה
  choice: 那里必成为
  rationale: 希伯来语用阳性单数回指整体地域；汉语用“那里”顺畅承接众山冈所构成的地区。
- source_word: לְמִשְׁלַח שׁוֹר
  choice: 放牛之处
  rationale: מִשְׁלַח含放出、任其活动之意。“放牛之处”保留将牛放出去的具体图景，同时符合现代汉语表达。
- source_word: וּלְמִרְמַס שֶׂה
  choice: 羊群践踏之地
  rationale: מִרְמַס指践踏、踩踏；שֶׂה可指单只绵羊或山羊，也可集合性地指小型牲畜。正文采用易懂的“羊群”，脚注说明其范围。
theological_decisions:
- issue: יִרְאַת שָׁמִיר וָשַׁיִת的句法归属
  choice: 理解为人“因害怕荆棘和蒺藜”而不到那里去
  alternative: 理解为“对荆棘和蒺藜的恐惧不会临到那里”，即那里不再有荆棘蒺藜之患
  rationale: 正文所取理解在本节荒废、转为放牧之地的语境中较连贯，也符合第二人称动词的直接读法；但希伯来语没有明示“因”，יִרְאַת也可能作为后一句的主语，因此不应掩盖另一种古老且语法上可能的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“山冈”“锄头”“荆棘和蒺藜”保留农业与荒凉的具体意象；分号呈现从无人耕作、避而不往到牲畜出没的结果关系。所有脚注标记均按正文出现次序安置。
