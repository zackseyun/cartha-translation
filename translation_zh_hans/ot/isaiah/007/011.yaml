    rationale: 原文允许所求的兆头取极深或极高的尺度；以“或”保留其句法选择关系更稳妥，同时不妨碍读者理解其上下两极的修辞效果。
  - severity: low
    issue: 现有脚注称原文“并未明确写出”阴间，造成不必要的文本不确定性。
    rationale: 虽然该词的拼写和分析曾有讨论，但在本节传统文本、古代译本传统及平行的上下文中，译作“阴间”有充分依据。真正需注明的是לְמָעְלָה字面为“向上／在高处”，而“天上”属于语境性表达。
