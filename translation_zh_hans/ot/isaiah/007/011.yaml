revisions:
- from: 你为自己向耶和华你的上帝求一个兆头吧；无论求在深处，还是求在高处[a]。
  to: 你要向耶和华你的上帝为自己求一个兆头：使它深到阴间，或高到天上[a]。
  rationale: 修订按原文的三重命令结构表达：先“求一个兆头”，再说明可使该兆头“深到阴间”或“高到天上”。“阴间”恢复שְׁאָלָה在此最可靠的语境义；“天上”保留为自然的对极译法，并在脚注中透明说明其并非末词的逐字名词翻译。
