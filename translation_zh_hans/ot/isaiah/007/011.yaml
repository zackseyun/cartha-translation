    issue: 将שְׁאָלָה释为重复的“求吧”，并译作“求在深处”。
    rationale: 本节的常规语法和上下文将其理解为“到阴间／深到阴间”（Sheol的方向式；该拼写可属缺陷拼写），与“高……向上”构成上下两极。正文的重复“求”既失去“阴间”所指，也没有对应前后的使役表达。
  - severity: medium
