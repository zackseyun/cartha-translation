  text: שְׁאַל לְ/ךָ֣ א֔וֹת מֵ/עִ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ הַעְמֵ֣ק שְׁאָ֔לָה א֖וֹ הַגְבֵּ֥הַּ לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/011.yaml
  text: 'Ask for yourself a sign from Yahweh your God: make it as deep as Sheol or as high as heaven[a].'
translation:
  language: zh_hans
  text: 你要向耶和华你的上帝为自己求一个兆头：使它深到阴间，或高到天上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末语字面为“向上”或“在高处”；“天上”是为与“阴间”相对而作的语境性表达。
    reason: 说明“天上”对לְמָעְלָה的解释性明确化，同时保留原文的空间措辞。
lexical_decisions:
- source_word: שְׁאַל לְךָ
  choice: 你为自己……求……吧
  rationale: שְׁאַל是对亚哈斯的第二人称阳性单数命令；לְךָ带有与本人相关的强调意味，因此译作“为自己”。句末“吧”使现代汉语中的命令语气自然，却不削弱其直接性。
- source_word: אוֹת
  choice: 兆头
  rationale: 此处指上帝所赐、用来证实其话语的可辨认记号。“兆头”在现代汉语中自然、庄重，也适合先知语境；它本身不限定兆头的具体形式。
- source_word: מֵעִם יְהוָה אֱלֹהֶיךָ
  choice: 向耶和华你的上帝
  rationale: מֵעִם表示兆头的来源；汉语搭配“求”时，用“向……求”即可自然表达从耶和华而来的意思。יְהוָה按其专名译作“耶和华”，אֱלֹהֶיךָ直译为“你的上帝”。
- source_word: הַעְמֵק שְׁאָלָה
  choice: 求在深处
  rationale: 按WLC元音，שְׁאָלָה可理解为带强调词尾的“求”，与前面的使役命令“使之深”结合，表达所求兆头可在极深之处。中文以“求在深处”保存空间范围，又避免把正文中未明确写出的“阴间”直接补入。
- source_word: אוֹ הַגְבֵּהַּ לְמָעְלָה
  choice: 还是求在高处
  rationale: הַגְבֵּהַּ是“使之高”的使役命令，לְמָעְלָה意为“向上、在上方”。与前半句构成从深处到高处的两极表达；中文补出“求在”以形成自然平行。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文圣经传统中“耶和华”是最广为普通读者识别的专名形式，并非用称号“主”替代；同时避免因采用较学术化的音译而妨碍公众理解。
- issue: 深处与高处是否明说“阴间”和“天上”
  choice: 正文译作“深处……高处”，脚注交代传统具象化译法
  alternative: 深到阴间……高到天上
  rationale: WLC的元音文本在此字面上是“使之深，求吧……使之高，向上”，没有明确出现通常拼作שְׁאוֹל的“阴间”，末词也只是“向上”。因此正文不把两端静默具体化；脚注保留“阴间……天上”这一传统且合乎上下文的理解。
- issue: 两个极端所表达的范围
  choice: 以“无论……还是……”表达不受高度或深度限制
  alternative: 把两句理解成要求亚哈斯在两者中任选其一
  rationale: אוֹ形式上连接两个选择，但深与高在此共同构成两极表达，重点是允许亚哈斯在整个范围内求兆头。中文“无论……还是……”既保留两项，也传达范围不限。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“你为自己……求……吧”保留对亚哈斯的直接命令；“无论……还是……”清楚呈现深与高的两极范围。脚注处理马所拉元音文本的字面形式与传统具象化译法之间的张力。
