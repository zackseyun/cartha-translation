base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/024.yaml
  text: One will come there with arrows and with a bow[b][a], because all the land will become briers and thorns.
translation:
  language: zh_hans
  text: 人必带着弓箭到那里去[a]，因为遍地都将长满荆棘和蒺藜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必带着箭和弓到那里去。”希伯来语动词是阳性单数，也可作泛指。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为遍地都将成为荆棘和蒺藜。”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחִצִּים וּבַקֶּשֶׁת
  choice: 带着弓箭
  rationale: 两个带冠词的介词短语在此表示随身装备的武器。现代汉语以固定搭配“弓箭”自然表达，虽调整了希伯来语“箭和弓”的次序，却完整保留其狩猎或防身的图景。
- source_word: יָבוֹא
  choice: 人到……去
  rationale: 该动词为第三人称阳性单数，但可作泛指。用“人”保留不定、泛指的意味，不把主语限定为某个特定男子。
- source_word: שָׁמָּה
  choice: 到那里去
  rationale: 方向副词表示前往该处；“到那里去”比单用“那里”更清楚地传达移动方向。
- source_word: כִּי
  choice: 因为
  rationale: 引出携带弓箭前往的原因；“因为”符合现代汉语因果表达。
- source_word: שָׁמִיר וָשַׁיִת
  choice: 荆棘和蒺藜
  rationale: 这一固定词组在以赛亚书中描绘荒废土地上的带刺植物。“荆棘和蒺藜”保留两项并列及荒凉意象，也符合庄重而通俗的经文语体。
- source_word: תִּהְיֶה
  choice: 将长满
  rationale: 字面为“将成为／将是”。结合土地与带刺植物的关系，“长满”自然传达土地转为荒芜、遍生刺草的结果状态；另以脚注保留较形式对应的译法。
- source_word: כָל הָאָרֶץ
  choice: 遍地
  rationale: 指上下文中整片受审判的土地，并非整个世界。“遍地”简洁传达范围的全面性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人……必……”表达预告中的泛指单数；“带着弓箭”符合汉语习惯。“长满”使土地荒芜、刺草丛生的画面清晰，同时脚注保留系词结构的直译可能。
