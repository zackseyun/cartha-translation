  text: וַ/יֻּגַּ֗ד לְ/בֵ֤ית דָּוִד֙ לֵ/אמֹ֔ר נָ֥חָֽה אֲרָ֖ם עַל אֶפְרָ֑יִם וַ/יָּ֤נַע לְבָב/וֹ֙ וּ/לְבַ֣ב עַמּ֔/וֹ כְּ/נ֥וֹעַ עֲצֵי יַ֖עַר מִ/פְּנֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/002.yaml
  text: And it was reported to the house of David, saying, “Aram has settled on Ephraim.” And his heart and the heart of his people shook, as the trees of the forest shake before the wind.
translation:
  language: zh_hans
  text: 有人报告大卫家说：“亚兰已经驻扎在以法莲那里。”于是，王的心和他百姓的心都颤动起来，像林中的树在风前摇动一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבֵית דָּוִד
  choice: 大卫家
  rationale: 保留王朝性称谓；上下文中消息是传给亚哈斯王及其宫廷。
- source_word: נָחָה
  choice: 已经驻扎
  rationale: 该动词基本义为停驻、安顿、落在；在军事语境中译作“驻扎”自然，同时避免将原文直接解释为“结盟”。
- source_word: אֲרָם עַל אֶפְרָיִם
  choice: 亚兰已经驻扎在以法莲境内
  rationale: 保留介词 עַל 的空间关系，并用“境内”表达此处军队驻于以法莲领地的语境；不把它明确化为联盟关系。
- source_word: וַיָּנַע
  choice: 颤动起来
  rationale: 传达因惧怕而摇动的形象，并与下半句树木被风吹动相呼应。
- source_word: לְבָבוֹ
  choice: 王的心
  rationale: 希伯来文直译为“他的心”，所指是上下文中的亚哈斯；中文若仅作“他的”容易指代不清，故以“王”明示所指。
- source_word: מִפְּנֵי רוּחַ
  choice: 被风吹动
  rationale: 用自然现代汉语表达树木在风前摇动的比喻，不改变其意象。
theological_decisions:
- issue: 亚兰与以法莲的关系
  choice: 译为“亚兰已经驻扎在以法莲境内”
  alternative: 亚兰与以法莲结盟了
  rationale: 原文 נָחָה עַל 的表层措辞是停驻于、落在……之上；虽然上下文暗示双方联合进攻犹大，但本节不宜把这一推论直接写成“结盟”，以保留原文措辞及其张力。
- issue: “大卫家”的指涉
  choice: 保留“大卫家”
  alternative: 亚哈斯王室
  rationale: “大卫家”具有王朝与盟约层面的含义，直接改写为“亚哈斯王室”会削弱原文的神学和文学回响。
translation_notes:
  register: 采用庄重而清晰的现代标准普通话。“有人报告……说”保留希伯来叙事公式；“王的心”消除中文代词歧义，而“大卫家”则保留原文王朝称谓。全节维持风吹林木的具体比喻。
