  to: 有人报告大卫家说：“亚兰已经驻扎在以法莲那里。”于是，王的心和他百姓的心都颤动起来，像林中的树在风前摇动一样。
  rationale: 修订仅删除“境内”这一原文未明说的地理限定，并使末句更贴近希伯来文的风前摇树意象。保留“驻扎”，以呈现军事背景下נָחָה的停驻含义，同时不把潜在的联盟关系直接释义为“结盟”。
