review_pass:
  verdict: revise
  source_fidelity: “亚兰已经驻扎在以法莲境内”将原文的“亚兰停驻/落在以法莲之上（那里）”具体限定为进入以法莲领土，超出了希伯来文的表层表述。原句在当前军事语境下可暗示联合行动，但不应以“境内”锁定其地理关系。
  naturalness: 整体庄重清楚。“好像林中的树被风吹动一样”自然，但可改为“像林中的树在风前摇动”，更贴近原文主动的比较结构和“在风前”的意象。
  terminology: “大卫家”“亚兰”“以法莲”及“王的心”均合适；以“驻扎在以法莲那里”替代“驻扎在以法莲境内”，避免不必要的领土断言，同时不将其释义为“结盟”。
  issues:
  - severity: medium
    issue: “以法莲境内”过度限定介词关系。
    rationale: עַל 可表达“在……上/处、落在……之上”的关系；本节语境容许理解为亚兰与以法莲联合，但原文并未明确说“进入以法莲境内”。删去“境内”可保留原文的措辞张力。
  - severity: low
    issue: 末句以被动式“被风吹动”重述了原文的比较。
    rationale: 原文说树木“在风前摇动”。改为“在风前摇动”更直接保留意象与句法，不改变意义。
  revised_text: 有人报告大卫家说：“亚兰已经驻扎在以法莲那里。”于是，王的心和他百姓的心都颤动起来，像林中的树在风前摇动一样。
