id: ISA.7.4
reference: Isaiah 7:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵ֠לָי/ו הִשָּׁמֵ֨ר וְ/הַשְׁקֵ֜ט אַל תִּירָ֗א וּ/לְבָבְ/ךָ֙ אַל יֵרַ֔ךְ מִ/שְּׁנֵ֨י זַנְב֧וֹת הָ/אוּדִ֛ים הָ/עֲשֵׁנִ֖ים הָ/אֵ֑לֶּה בָּ/חֳרִי אַ֛ף רְצִ֥ין וַ/אֲרָ֖ם וּ/בֶן רְמַלְיָֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/004.yaml
  text: and say to him[a], ‘Be careful and stay calm. Do not fear, and do not let your heart be faint because of these two smoldering stubs of firebrands—because of the burning anger of Rezin and Aram, and the son of Remaliah.’
translation:
  language: zh_hans
  text: 你要对他说：“务要谨慎，保持镇定。不要害怕，也不要因这两根冒烟火把的残端[a]——因利汛、亚兰和利玛利的儿子炽烈的怒气——而心里胆怯。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “两根冒烟火把的残端”直译为“这两个冒烟火把的尾端”。这个比喻把利汛与利玛利的儿子描绘成尚在冒烟、却已接近熄灭的烧残木头。
    reason: 说明原文“尾端”的字面意象及其在火把比喻中的含义。
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: 务要谨慎
  rationale: 该词是שׁמר的尼法勒命令式，在此劝人警醒谨慎，并非要求看守某个具体对象；“务要谨慎”既保留命令语气，也符合现代汉语的庄重表达。
- source_word: וְהַשְׁקֵט
  choice: 保持镇定
  rationale: שׁקט可指安静、安稳或不受搅扰；在战争威胁和恐惧的语境中，“保持镇定”比单纯的“安静”更准确自然。
- source_word: אַל תִּירָא
  choice: 不要害怕
  rationale: 直接表达ירא否定命令式的意义，清楚而自然。
- source_word: וּלְבָבְךָ אַל יֵרַךְ
  choice: 不要……心里胆怯
  rationale: 希伯来语以“心”与“柔弱”表达丧失勇气；“心里胆怯”保留内在意象，并以现代汉语传达怯懦、失去勇气之意。
- source_word: מִשְּׁנֵי זַנְבוֹת הָאוּדִים הָעֲשֵׁנִים
  choice: 因这两截冒烟的火把残梗
  rationale: זנבות直译为“尾端”，与火把搭配时指烧剩的末端；“两截……残梗”保留敌人已近燃尽、只余烟气的贬抑性比喻，同时避免汉语“火把尾巴”的生硬。
- source_word: בָּחֳרִי אַף
  choice: 所发的烈怒
  rationale: חֳרִי אַף是表示炽烈愤怒的惯用语。“烈怒”简洁传达其强度；“所发的”使它与前面的威胁来源自然衔接。
- source_word: רְצִין וַאֲרָם וּבֶן רְמַלְיָהוּ
  choice: 利汛和亚兰，以及利玛利的儿子
  rationale: 保留原文将利汛与亚兰并列、又故意称比加为“利玛利的儿子”的表达，不补入其姓名，也不消除原文略带贬抑的称呼方式。
theological_decisions:
- issue: 是否保留敌人如将熄火把残端的比喻
  choice: 在正文中保留“两截冒烟的火把残梗”
  alternative: 意译为“两个行将消逝的威胁”
  rationale: 先知话语的神学与修辞张力在于：亚哈斯所惧怕的势力看似仍有怒气，在上帝的评断中却只是即将熄灭的残端。保留比喻可呈现这一反差，而不把它解释成抽象结论。
- issue: 如何处理“利汛和亚兰，以及利玛利的儿子”与“两截”的对应关系
  choice: 保留原文的名称排列，不明确重组为两个严格对称的政治单位
  alternative: 解释性译作“亚兰王利汛和以色列王比加”
  rationale: 原文以利汛、亚兰和“利玛利的儿子”表述联盟，句法上带有修辞性，并未采用两个对称的王号。译文不补充“王”或“比加”，以免消除原有措辞和语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“务要谨慎”保持先知话语的命令力度，“保持镇定”避免把שׁקט误解为单纯不出声。破折号保留原文后置说明“烈怒”来源的结构，同时使长句在汉语中清楚可读。
