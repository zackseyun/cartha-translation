base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/016.yaml
  text: For before the boy knows to refuse the evil and choose the good[b][a], the land before whose two kings you dread will be forsaken.
translation:
  language: zh_hans
  text: 因为在这男孩还不懂得拒绝恶、选择善以前，你因其两个王而畏惧的那地必被撇弃[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “畏惧”也可译作“厌恶”或“因害怕而深感反感”。希伯来语动词可表达厌恶、畏惧，或由恐惧引起的排斥感。“被撇弃”也可译作“被遗弃”或“被弃置”；希伯来语的被动形式可指土地遭人离弃或无人居住。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: 在……以前
  rationale: 明确表达时间先后关系，并自然引出男孩尚未具备分辨能力之时。
- source_word: הַנַּעַר
  choice: 这男孩
  rationale: נַעַר可指儿童或青年；上下文强调尚未懂得拒恶择善，故用“男孩”，既保留阳性单数，也不过度确定其年龄或身份。定冠词结合近距离语境译作“这”。
- source_word: יֵדַע ... מָאֹס ... וּבָחֹר
  choice: 还不懂得拒绝……、选择……
  rationale: 该结构表达尚未获得辨别或行动的能力；“懂得”符合现代汉语，也保留“知道—拒绝—选择”的语义次序。
- source_word: מָאֹס
  choice: 拒绝
  rationale: 此处与“选择”形成道德判断上的对举；“拒绝”比“憎恶”更适合这种辨别语境，同时不把情感色彩强调过度。
- source_word: בָּרָע ... בַּטּוֹב
  choice: 恶……善
  rationale: 用简洁、对称的“恶／善”表达带冠词的概括性道德范畴，符合庄重而自然的汉语。
- source_word: תֵּעָזֵב
  choice: 必被撇弃
  rationale: 保留Nifal未完成式的被动意义和预告性质；“撇弃”可涵盖土地被弃置、荒废或无人居住，而不擅自补明施事者。
- source_word: הָאֲדָמָה
  choice: 那片土地
  rationale: 上下文涉及两个王及其领土，故译为“土地”而非“地面”；量词“片”使现代汉语自然。
- source_word: אֲשֶׁר אַתָּה קָץ מִפְּנֵי שְׁנֵי מְלָכֶיהָ
  choice: 你因那地的两个王而恐惧的
  rationale: מִפְּנֵי在此表达导致恐惧或厌恶的缘由；קוץ可含厌恶、畏惧或因恐惧而反感之意。结合叙利亚—以法莲危机的威胁语境，正文采用“恐惧”，同时以脚注保留另一词义可能。
theological_decisions:
- issue: “这男孩”的身份及其预兆功能
  choice: 仅译作“这男孩”，不在正文中指明具体身份
  alternative: 明确认定为近期历史中的兆头之子，或明确认定为以马内利并突出弥赛亚意义
  rationale: 本节只使用普通名词הַנַּעַר，并未在本句中进一步指认。保持中性可避免把有争议的历史、预表或弥赛亚解释写入译文。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“拒绝恶、选择善”保留原文对举；“必被撇弃”维持先知性宣告的力度。正文不解释男孩身份，并用脚注呈现קוץ与עזב的真实词义幅度。
