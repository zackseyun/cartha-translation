  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹהַ/י֙ אַתָּ֔ה אֲרֽוֹמִמְ/ךָ֙ אוֹדֶ֣ה שִׁמְ/ךָ֔ כִּ֥י עָשִׂ֖יתָ פֶּ֑לֶא עֵצ֥וֹת מֵֽ/רָח֖וֹק אֱמ֥וּנָה אֹֽמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/001.yaml
  text: O Yahweh[a], you are my God; I will exalt you; I will praise your name, for you have done wonderful things, plans formed long ago, faithful and sure.
translation:
  language: zh_hans
  text: 雅威啊，你是我的上帝；我要尊崇你，赞美你的名，因为你行了奇妙的事；你从古时定下的计划，信实可靠。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里十分凝练，也可理解为：“因为你行了一件奇事；从古时所定的计划，信实而坚定。”末尾两个词也可理解为强调这些古时计划的可靠与确定。
    reason: 保留עֵצוֹת מֵרָחוֹק אֱמוּנָה אֹמֶן的压缩句法，以及末尾近义词并置所带来的语义强调；避免补入原文未明说的动作。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝的圣约之名，既对应四字神名，也避免用称号代替原文专名。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 保留第一人称单数所属后缀，译文自然明确。
- source_word: אֲרוֹמִמְךָ
  choice: 我要尊崇你
  rationale: רום在此表达在赞美中高举、尊崇；“尊崇”符合现代汉语敬拜语体。
- source_word: אוֹדֶה שִׁמְךָ
  choice: 赞美你的名
  rationale: ידה的使役式在此指称颂、赞美；保留原文明确出现的“你的名”。
- source_word: כִּי עָשִׂיתָ פֶּלֶא
  choice: 因为你行了奇妙的事
  rationale: 单数פֶּלֶא可作集合或性质性表达；“奇妙的事”在汉语中自然，并保留神奇作为的含义。
- source_word: עֵצוֹת מֵרָחוֹק
  choice: 你从古时所定的计划
  rationale: עֵצוֹת在此指上帝的计划或谋略；מֵרָחוֹק按语境取时间上的久远，并用“所定”自然表达这些计划早已确立。
- source_word: אֱמוּנָה אֹמֶן
  choice: 信实可靠
  rationale: 两个相近的名词并置，强调忠实、稳固和可信；以两个协调的现代汉语形容词保留其诗意加强作用。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用专有的四字神名；“雅威”直接音译，不以称号取代，也不把后期传统读法当作原始发音。
- issue: מֵרָחוֹק表示空间还是时间
  choice: 从古时
  alternative: 从远方
  rationale: 本节论及上帝已经施行的奇事及其计划，时间意义最切合上下文；但原词本义含“远处”，故属于语境判定。
- issue: 末尾אֱמוּנָה אֹמֶן与前文的句法关系
  choice: 将其理解为说明古时所定的计划信实可靠
  alternative: 理解为上帝以完全的信实成就古时所定的计划
  rationale: 希伯来文是高度凝练的名词并置，未明示句法连接。正文采用与计划相连的读法，同时用脚注保留其修饰上帝成就行动的可能性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威啊”保留呼告语气；两个“我要”中的第二个省略主语，以避免汉语累赘，同时保持平行节奏。末句正文力求简洁，脚注交代希伯来诗句的压缩结构和替代读法。
