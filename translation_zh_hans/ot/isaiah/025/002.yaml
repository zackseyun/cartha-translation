base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/002.yaml
  text: For you have made the city a heap[a], the fortified town a ruin; the palace of foreigners is no city[b], it will never be rebuilt.
translation:
  language: zh_hans
  text: 因为你使城变成乱石堆，使坚固城沦为废墟；外族人的宫堡不再是一座城[a]，永远不会重建[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文措辞十分凝练，直译近于“外族人的宫堡不再是城”。此处宫堡与“城”的关系在句法上不完全明确。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“永远不会被建造”；在城已被毁的语境中，意思是“永远不会重建”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתָּ
  choice: 使……变成／使……沦为
  rationale: שׂוּם本义为“放置、设立”，在这里带结果补语，表示“使成为”。按两个平行分句分别译作“使……变成”和“使……沦为”，符合现代汉语表达。
- source_word: מֵעִיר לַגָּל
  choice: 使城变成乱石堆
  rationale: 介词מִן与לְ共同表达从原状到结果的转变；גַּל指石头或废墟形成的堆。译作“乱石堆”既保留具体意象，也点明毁坏后的景象。
- source_word: קִרְיָה בְצוּרָה
  choice: 坚固城
  rationale: קִרְיָה指城邑，בְצוּרָה指设防、坚固。简洁译作“坚固城”，并保留与前一分句的平行关系。
- source_word: לְמַפֵּלָה
  choice: 沦为废墟
  rationale: מַפֵּלָה可指倒塌、败落或废墟；结合城市被毁的语境，“沦为废墟”自然地表达其结果。
- source_word: אַרְמוֹן זָרִים
  choice: 外族人的宫堡
  rationale: אַרְמוֹן可指宫殿，也可指具有防御性质的堡垒或宫堡；“宫堡”保留宫殿与堡垒之间的词义幅度。זָרִים译作“外族人”，比“陌生人”更切合群体与城市对立的语境。
- source_word: מֵעִיר
  choice: 不再成城
  rationale: 原文表达高度压缩，可能表示这座外族人的宫堡已失去城市的形态或地位。“不再成城”保留这种压缩感，不把具体所指解释得过死。
- source_word: לְעוֹלָם לֹא יִבָּנֶה
  choice: 永远不会重建
  rationale: לְעוֹלָם与否定词连用表达“永不”；בנה的未完成式被动形在已遭毁坏的语境中自然指“被重建”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“乱石堆／废墟”保留希伯来诗歌的平行结构；“不再成城”有意保留原文的凝练与一定歧义，并用脚注说明。
