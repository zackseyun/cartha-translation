base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/007.yaml
  text: And on this mountain he will swallow up the covering that covers all peoples[b][a], and the veil that is spread over all nations.
translation:
  language: zh_hans
  text: 他必在这山上吞灭那遮盖万民的遮盖物[a]，以及那铺在列国之上的幔子。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那裹住万民的裹尸布。”希伯来文连续使用同根词，描绘包裹、笼罩全人类之物。
    reason: lexical_alternative
  - marker: b
    text: 这里的“遮盖物”或“幔子”很可能为下一节吞灭死亡作铺垫，但这图像也可能更广泛地指除去笼罩列国之物。
    reason: cross_reference
lexical_decisions:
- source_word: וּבִלַּע
  choice: 他必吞灭
  rationale: 保留 בלע“吞下、吞灭”的鲜明意象，并与下一节“吞灭死亡”所用的同一动词呼应；“吞灭”比单纯的“除去”更贴近原文。
- source_word: בָּהָר הַזֶּה
  choice: 在这山上
  rationale: ב 在此表示地点；“在这山上”自然地承接上下文中的锡安山。
- source_word: פְּנֵי הַלּוֹט הַלּוֹט
  choice: 那遮盖万民的遮盖物
  rationale: 该短语较为困难；פְּנֵי 在这里与 הַלּוֹט 一同构成覆盖物的图像。以“遮盖物／遮盖”尽量呈现原文同根词的重复，同时避免生硬直译为“……的表面”。
- source_word: עַל כָּל הָעַמִּים
  choice: 遮盖万民
  rationale: עַל 被自然纳入关系结构；עַמִּים 译为“万民”，与后半句 גּוֹיִם“列国”保持诗体对应和词义区别。
- source_word: וְהַמַּסֵּכָה
  choice: 以及……幔子
  rationale: מַסֵּכָה 在此与覆盖物平行，不宜按其他语境译作“铸像”；“幔子”能表达铺盖在人群之上的织物意象。
- source_word: הַנְּסוּכָה
  choice: 那铺在……之上的
  rationale: 被动分词在此最可能描写幔子被铺开或铺设；“铺在”符合中文习惯，也保留覆盖的空间图像。
- source_word: עַל כָּל הַגּוֹיִם
  choice: 在列国之上
  rationale: גּוֹיִם 译为“列国”，与前句“万民”形成诗意平行而不将两词完全合并。
theological_decisions:
- issue: 被吞灭之物的性质
  choice: 正文保留笼罩万民和列国的遮盖物、幔子这一宽泛隐喻
  alternative: 明确译成裹尸布，或解释为死亡、属灵蒙蔽或羞辱
  rationale: 下一节明确提到死亡，因此丧葬裹尸布的联想很强；但本节自身仍使用较宽泛的覆盖图像。正文不把隐喻限缩为单一神学解释，脚注说明其与下一节的可能联系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吞灭”保留先知诗歌的强烈意象；“遮盖万民的遮盖物”刻意保留希伯来文同根重复，虽略带诗性陌生感，却能传达原文修辞。所有脚注标记均已置于正文。
