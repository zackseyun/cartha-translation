language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בִּלַּ֤ע הַ/מָּ֨וֶת֙ לָ/נֶ֔צַח וּ/מָחָ֨ה אֲדֹנָ֧/י יְהוִ֛ה דִּמְעָ֖ה מֵ/עַ֣ל כָּל פָּנִ֑ים וְ/חֶרְפַּ֣ת עַמּ֗/וֹ יָסִיר֙ מֵ/עַ֣ל כָּל הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/008.yaml
  text: He will swallow up death forever[a], and the Lord GOD will wipe away tears from every face, and he will remove the reproach of his people from all the earth[c][b], for Yahweh has spoken.
translation:
  language: zh_hans
  text: 他必把死亡永远吞灭[a]。主耶和华必擦去各人脸上的泪水，从全地除掉他子民所受的羞辱[b]，因为耶和华已经说了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他已经永远吞灭了死亡。”希伯来文使用完成式，也可理解为“预言性完成式”，把将来必成的事说成已经成就。
    reason: 保留בִּלַּע在形态上的完成意义及其预言语境中的时间歧义。
  - marker: b
    text: “羞辱”也可译作“耻辱”或“所受的讥诮”。
    reason: 说明חֶרְפָּה兼有公开受辱、被讥诮和蒙羞的语义范围。
lexical_decisions:
- source_word: בִּלַּע
  choice: 他必吞灭
  rationale: 该动词为完成式第三人称阳性单数；在这一预言性应许中按将来确定之事表达。译作“吞灭”既保留“吞下”的具体意象，也自然表达死亡被彻底消除。
- source_word: הַמָּוֶת לָנֶצַח
  choice: 永远吞灭死亡
  rationale: “死亡”直接对应带冠词的名词；לָנֶצַח表示永久、永远，修饰吞灭行动，表明死亡被决定性地终结。
- source_word: וּמָחָה ... דִּמְעָה מֵעַל כָּל פָּנִים
  choice: 必擦去各人脸上的泪水
  rationale: מחה与“泪”连用宜译为“擦去”。希伯来文“所有脸面”具有逐一分配的意义，现代汉语用“各人脸上”更自然；单数“泪”按汉语习惯译作集合性的“泪水”。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神名中“主”与四字神名两个成分；简体中文圣经语域中“主耶和华”庄重、清楚，并避免把两个成分合并。
- source_word: וְחֶרְפַּת עַמּוֹ
  choice: 他子民所受的羞辱
  rationale: חֶרְפָּה兼有羞辱、耻辱和被人讥诮的公开蒙羞之意。“所受的羞辱”凸显外来的凌辱，同时不排除由此产生的耻辱。
- source_word: יָסִיר מֵעַל כָּל הָאָרֶץ
  choice: 从全地除掉
  rationale: סור的使役式在此意为除去；הָאָרֶץ可指“地”或“全地/大地”。本节范围广阔，译作“全地”保留其广泛性，也不强行判定为“全世界”或特定地域。
- source_word: כִּי יְהוָה דִּבֵּר
  choice: 因为耶和华已经说了
  rationale: כִּי说明前述应许确定无疑的根据；完成式דִּבֵּר译作“已经说了”，保留先知宣告的完成语气。
theological_decisions:
- issue: 预言性完成式בִּלַּע的时间指向
  choice: 他必……吞灭
  alternative: 他已经吞灭了
  rationale: 形态上是完成式，因此过去或完成意义真实存在；但上下文由后续未完成式应许推动，指向将来必成之事。正文采用将来式，脚注保留完成式的另一译法。
- issue: חֶרְפַּת עַמּוֹ所表达的蒙羞性质
  choice: 他子民所受的羞辱
  alternative: 他子民的耻辱／他子民所受的讥诮
  rationale: 原词可涵盖公开羞辱、责骂与耻辱感；正文不把它缩减为纯内在羞耻，也不限定为言语讥诮。
- issue: הָאָרֶץ的范围
  choice: 全地
  alternative: 整个大地／全国
  rationale: 该词既可指土地、地域，也可指大地。正文用“全地”保留原文可能的普世范围与一定的词义开放性，避免过度限定。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文读者广泛识别的专名“耶和华”，并在אֲדֹנָי יְהוִה中译为“主耶和华”，区分尊称与神名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“吞灭死亡”保留鲜明诗性隐喻；“各人脸上的泪水”体现分配意义；句式紧凑，保持先知应许的郑重与确定感。
