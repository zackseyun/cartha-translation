  yaml_path: translation/ot/isaiah/025/003.yaml
  text: Therefore a strong people will honor you[c][b][a]; a city of ruthless nations will fear you.
translation:
  language: zh_hans
  text: 因此，强大的民族必尊崇你[a]；残暴列国的城必敬畏你[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强大的民族”也可译作“强悍的民族”；原文形容词可表示强大、强盛或凶猛。
    reason: lexical_alternative
  - marker: b
    text: “残暴列国的城”也可译作“残暴诸民的城”。原文结构紧凑，可指属于、由残暴列国构成的，或与残暴列国相关的城。
    reason: lexical_alternative
  - marker: c
    text: “敬畏你”也可译作“惧怕你”或“对你肃然起敬”；原文动词可随语境表示惧怕、敬畏或畏惧中的肃然起敬。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 表达承接上文、由上帝作为所得出的结果，简洁保留原文的推论关系。
- source_word: יְכַבְּדוּךָ
  choice: 必尊崇你
  rationale: כבד 的 Piel 词形表示给予尊荣或荣耀；“尊崇”自然庄重，并与后句“敬畏你”形成对应，又不限定为礼仪性敬拜。
- source_word: עַם עָז
  choice: 强大的民族
  rationale: עָז 可指强壮、强盛或凶猛；“强大”较宽泛，不会无根据地突出暴烈含义。
- source_word: קִרְיַת גּוֹיִם עָרִיצִים
  choice: 残暴列国的城
  rationale: 保留原文紧凑的属格结构及“城”的意象；“残暴”体现 עָרִיצִים 所含的强横、压迫意味，而不强行判定该城与列国关系的具体性质。
- source_word: יִירָאוּךָ
  choice: 必敬畏你
  rationale: ירא 可表示惧怕、敬畏或肃然起敬；“敬畏”保留面对上帝威严时恐惧与尊敬并存的语义空间。
theological_decisions:
- issue: 敌对强权对上帝回应的性质
  choice: 译为“尊崇”与“敬畏”，不说明这是甘心敬拜、受迫降服，还是两者兼有。
  alternative: 明确译成列国归信并敬拜，或仅因审判而恐惧屈服。
  rationale: 希伯来文动词容许尊敬、畏惧及承认上帝权能等层面，却没有明说其内在动机，因此保留这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“必……必……”体现未完成式在预言语境中的将来或确定结果；保留两分句的平行结构与原文压缩的城市意象。
