  text: וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הִנֵּ֨ה אֱלֹהֵ֥י/נוּ זֶ֛ה קִוִּ֥ינוּ ל֖/וֹ וְ/יֽוֹשִׁיעֵ֑/נוּ זֶ֤ה יְהוָה֙ קִוִּ֣ינוּ ל֔/וֹ נָגִ֥ילָה וְ/נִשְׂמְחָ֖ה בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/009.yaml
  text: And it will be said on that day[a], “Behold, this is our God; we have waited for him, that he might save us. This is Yahweh; we have waited for him. Let us rejoice and be glad in his salvation.”
translation:
  language: zh_hans
  text: 到那日，人必说：“看哪，这就是我们的上帝！我们一直等候他，他必拯救我们。这就是雅威！我们一直等候他。让我们因他的救恩欢喜快乐。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַר
  choice: 人必说
  rationale: 该动词形式在先知性语境中可作非人称表达；译作“人必说”既不强加具体说话者，也比被动句更符合现代汉语。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知文学中指向未来之日的固定表达，同时采用自然、庄重的现代汉语。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示、唤起注意和加强语气的修辞作用。
- source_word: אֱלֹהֵינוּ זֶה
  choice: 这就是我们的上帝
  rationale: 体现 זֶה 的指认和确认意味；“就是”传达其强调语气。
- source_word: קִוִּינוּ לוֹ
  choice: 我们一直等候他
  rationale: קוה 包含怀着盼望等候的意味；“一直”体现此前持续等候、如今结果临到的语境。
- source_word: וְיוֹשִׁיעֵנוּ
  choice: 他必拯救我们
  rationale: 该形式最自然地表达随后发生的拯救；不把连接词强行解释为目的关系，保留期待与实现之间的推进。
- source_word: זֶה יְהוָה
  choice: 这就是雅威
  rationale: 保留再次指认的强调结构，并以“雅威”直接音译神圣四字名。
- source_word: נָגִילָה וְנִשְׂמְחָה
  choice: 让我们……欢喜快乐
  rationale: 两个鼓励式动词表达共同的意愿和劝勉；该译法自然体现其祈愿、号召语气。
- source_word: בִּישׁוּעָתוֹ
  choice: 因他的救恩
  rationale: 介词 ב 在此可表示喜乐的缘由或所基于的处境；汉语“因”比直译“在……里”更自然，同时保留救恩来自他的含义。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名；音译“雅威”使读者看见此处是盟约之名，又不以普通称号取代。
- issue: וְיוֹשִׁיעֵנוּ 与前句的逻辑关系
  choice: 他必拯救我们
  alternative: 为要使他拯救我们；他已经拯救我们
  rationale: 原文连接方式容许一定语义张力，但动词形式自然指向拯救的实现。正文采用并列推进，不将其过度解释为目的句或完成式。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“看哪”保留先知性宣告的高昂语气；重复“这就是……我们一直等候他”忠实保存原文的平行与强调。
