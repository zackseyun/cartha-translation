revisions:
- from: 你城墙上坚固的高垒，他已拆毁，使它降卑，倾倒在地，直落尘土。[a]
  to: 你城墙的高堡，他已击倒，夷低，使它落到地上，直到尘土。[a]
  rationale: 修订避免把原文紧凑而略有歧义的连属结构固定为“城墙上”的单一空间关系；以“高堡”简洁保留防御与高处的意象。动词链译为“击倒，夷低，使它落到地上，直到尘土”，对应原文由降下、降低至落地入尘的递进，同时使现代汉语自然通顺。
