  yaml_path: translation/ot/isaiah/025/012.yaml
  text: And the fortified height of your walls he has brought down[a], laid low, and cast to the ground, to the dust.
translation:
  language: zh_hans
  text: 你城墙的高堡，他已击倒，夷低，使它落到地上，直到尘土。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你城墙之高处的堡垒，他已击倒。”希伯来文的连属结构十分紧凑，也可作较贴近形式的翻译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְצַר מִשְׂגַּב חוֹמֹתֶיךָ
  choice: 你城墙上坚固的高垒
  rationale: 这一压缩的连属结构把“堡垒/防御工事”“高处/高垒”和“你的城墙”结合起来。译作“你城墙上坚固的高垒”，既保留防御性和高耸感，也符合现代汉语表达；“你”在上下文中指向被宣告审判的一方。
- source_word: הֵשַׁח
  choice: 他已拆毁
  rationale: 该使役动词表达使高耸之物降下。结合城墙和高垒被毁的语境，“拆毁”自然地传达使之倒下的结果，同时由后续动词保留“降卑”的意象。
- source_word: הִשְׁפִּיל
  choice: 使它降卑
  rationale: 直译其“使降低、使降卑”之义，并保留物理倒塌与受辱之间的诗性张力。
- source_word: הִגִּיעַ לָאָרֶץ
  choice: 倾倒在地
  rationale: 原文较直为“使之达到地面”。在建筑物毁坏的语境中，“倾倒在地”自然清楚，又不超出原文所描写的结果。
- source_word: עַד עָפָר
  choice: 直落尘土
  rationale: 保留“直到尘土”的强化作用，突出从高处彻底坠落、夷毁的图景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高垒—降卑—在地—尘土”保留原文连续向下的诗性运动；正文中的[a]与脚注相对应。
