source:
  edition: WLC
  text: כִּֽי הָיִ֨יתָ מָע֥וֹז לַ/דָּ֛ל מָע֥וֹז לָ/אֶבְי֖וֹן בַּ/צַּר ל֑/וֹ מַחְסֶ֤ה מִ/זֶּ֨רֶם֙ צֵ֣ל מֵ/חֹ֔רֶב כִּ֛י ר֥וּחַ עָרִיצִ֖ים כְּ/זֶ֥רֶם קִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/004.yaml
  text: For you have been a stronghold to the poor[a], a stronghold to the needy in his distress, a refuge from the storm, a shade from the heat[b]; for the breath of the ruthless is like a storm against a wall.
translation:
  language: zh_hans
  text: 因为你作过贫困者的保障，作过穷乏者在困苦中的保障，是暴雨中的避难所，是炎热中的荫凉；因为残暴者的气息[a]，如同暴雨冲击墙壁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”也可译作“风”或“猛烈的吹袭”。希伯来词 רוּחַ 在这里可表示气息、风，或强力的冲击。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“如同倾盆大雨打在墙上”或“如同风暴袭击墙壁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  choice: 堡垒
  rationale: 强调坚固、防卫性的保护，并保留原文两次重复所形成的平行与强调。
- source_word: דָּל
  choice: 贫寒人
  rationale: 在与 אֶבְיוֹן 配对的社会处境语境中，指贫穷、弱势者；“贫寒人”自然且保留其脆弱处境。
- source_word: אֶבְיוֹן
  choice: 穷乏人
  rationale: 与“贫寒人”语义相近而有所区别，突出有所缺乏、需要帮助的人。
- source_word: בַּצַּר לוֹ
  choice: 在困苦中
  rationale: 表达穷乏人身处困境；中文无需机械重复第三人称代词，所属关系由句法自然呈现。
- source_word: מַחְסֶה
  choice: 避难所
  rationale: 保留具体的保护意象，同时与前面的“堡垒”区分。
- source_word: זֶרֶם
  choice: 暴雨
  rationale: 该词可指倾泻而下的暴雨或风暴；此处天气意象中“暴雨”具体自然，也适用于末句对墙壁的冲击。
- source_word: צֵל
  choice: 荫凉
  rationale: 表达炎热中具有保护作用的阴影，比单说“影子”更符合现代汉语语境。
- source_word: חֹרֶב
  choice: 炎热
  rationale: 与“荫凉”形成明确对照；此处重点是灼热，而非抽象的干旱。
- source_word: רוּחַ
  choice: 气息
  rationale: 保留该词“气息、风、吹袭”的多义性；在比喻中可指残暴者逼人的凶猛攻势，另义见脚注。
- source_word: עָרִיצִים
  choice: 残暴之人
  rationale: 涵盖强横、压迫、暴力的施害者，而不局限为具有特定政治身份的暴君。
- source_word: קִיר
  choice: 墙壁
  rationale: 按马所拉文本采用该词通常的具体含义，保留暴雨冲击墙壁的图景。
theological_decisions:
- issue: 上帝保护弱势者的比喻描写
  choice: 保留“堡垒、避难所、荫凉”等具体保护意象，不作寓意化扩展。
  alternative: 释义为属灵安慰、救恩或其他特定教义内容。
  rationale: 原文以物质世界中的防护图景赞颂上帝对弱势者的看顾；进一步教义化会加入经文本身没有明说的内容。
- issue: 残暴者攻势的意象
  choice: 将 רוּחַ 译为“气息”，并以脚注保留“狂风、吹袭”等可能。
  alternative: 在正文直接确定为“狂风”或释义为“攻击”。
  rationale: 希伯来词有真实的词义张力；正文保留较贴近字面的表达，脚注说明语境中的其他自然理解，避免过早消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留希伯来诗歌中的重复和平行结构，以“贫寒人／穷乏人”呈现近义配对，以“堡垒／避难所／荫凉”维持层层展开的保护意象。脚注标记均置于其实际所说明的词句之后。
