base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/011.yaml
  text: And he will spread out his hands in its midst as a swimmer spreads them out to swim[a], and he will bring down his pride along with the skill of his hands.
translation:
  language: zh_hans
  text: 他要在其中伸开双手，好像游泳者游泳时伸开双手；他必压低他的骄傲，连同他双手的技巧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “技巧”原文含义不确定，也可译为“巧计”“诡计”或“手段”；较字面的理解可为“他双手的埋伏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֵרַשׂ יָדָיו
  choice: 他要伸开双手
  rationale: פרשׂ表示“展开、伸开”，与游泳的比喻相合；יָדָיו直译为“双手”，中文在此也可自然指游泳时伸展的上肢。
- source_word: בְּקִרְבּוֹ
  choice: 在其中
  rationale: 保留阳性单数后缀的含蓄指代；按上文最自然地指摩押，但本节不将所指明说出来。
- source_word: כַּאֲשֶׁר יְפָרֵשׂ הַשֹּׂחֶה לִשְׂחוֹת
  choice: 好像游泳的人伸手游泳
  rationale: הַשֹּׂחֶה指“游泳的人”，לִשְׂחוֹת表达游泳这一动作或目的。译文保留重复而鲜明的原文比喻，同时符合现代汉语。
- source_word: וְהִשְׁפִּיל
  choice: 他必使……降卑
  rationale: שׁפל的使役式表示“使低下、使降卑”。“降卑”兼顾具体的压低意象和审判语境。
- source_word: גַּאֲוָתוֹ
  choice: 他的骄傲
  rationale: 在本段审判语境中指高傲、自大；“骄傲”清楚自然，并保留名词表达。
- source_word: עִם
  choice: 连同……一并
  rationale: 明确表达两者共同被降卑的并列关系，在中文里结构自然。
- source_word: אָרְבוֹת יָדָיו
  choice: 他手中的计谋
  rationale: 该短语含义困难，可能指双手施展的诡计、谋略或手段。“手中的计谋”适合负面的审判语境，同时不采用难懂的字面“埋伏”。脚注保留其他可能理解。
theological_decisions:
- issue: 本节单数代词的所指
  choice: 以单数“他／他的”表达，按上下文将摩押拟人化
  alternative: 理解为摩押的百姓这一集体
  rationale: 希伯来文使用阳性单数形式，先知诗歌也常把国家拟人化为单数人物。保留单数可避免解释性扩写。
- issue: אָרְבוֹת יָדָיו的语义
  choice: 正文译为“他手中的计谋”，并以脚注说明词义不确定
  alternative: “他双手的技巧”、“他手中的诡计／手段”或较字面的“他双手的埋伏”
  rationale: 该词在此处词义有争议。审判骄傲的语境支持“计谋”这一负面理解，但不宜掩盖其不确定性，因此在脚注列明其他可能。
translation_notes:
  register: 采用庄重而现代的标准普通话。“伸开双手”保留游泳的身体意象；“在其中”保留原文代词所指的含蓄性；末句用“连同……一并降卑”清楚呈现并列关系。
