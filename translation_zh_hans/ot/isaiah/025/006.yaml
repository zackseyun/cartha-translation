  text: וְ/עָשָׂה֩ יְהוָ֨ה צְבָא֜וֹת לְ/כָל הָֽ/עַמִּים֙ בָּ/הָ֣ר הַ/זֶּ֔ה מִשְׁתֵּ֥ה שְׁמָנִ֖ים מִשְׁתֵּ֣ה שְׁמָרִ֑ים שְׁמָנִים֙ מְמֻ֣חָיִ֔ם שְׁמָרִ֖ים מְזֻקָּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/006.yaml
  text: And Yahweh of Armies will make on this mountain for all the peoples a feast of rich food[a], a feast of aged wine—rich food full of marrow, aged wine well refined.
translation:
  language: zh_hans
  text: 万军之耶和华必在这山上，为万族摆设筵席：肥美的食物的筵席[a]，陈年佳酿的筵席——满是骨髓的肥美食物，澄清的陈年佳酿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肥美的食物”直译为“肥脂之物”；下文“陈年佳酿”直译为“酒渣上的酒”。这些意象强调筵席的丰盛与珍贵。
    reason: 说明希伯来文的字面宴席意象及正文所采用的语境化表达。
lexical_decisions:
- source_word: וְעָשָׂה
  choice: 必……摆设
  rationale: עָשָׂה本义为“做、制作”；用于筵席语境时，现代汉语自然表达为“摆设筵席”。“必”体现未完成式在此预言语境中的将来指向。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神的专名及צְבָאוֹת所表达的“军队、众军”称号；采用现代中文读者熟悉且庄重的组合形式。
- source_word: לְכָל הָעַמִּים
  choice: 为万族
  rationale: עַמִּים是“民、族群”的复数；“万族”既自然简洁，也保留所有不同族群均在范围之内的含义，而不将其抽象化为全人类。
- source_word: בָּהָר הַזֶּה
  choice: 在这山上
  rationale: 保留指示词“这”，并以自然汉语表达地点。
- source_word: מִשְׁתֵּה
  choice: 筵席
  rationale: 该词指宴饮、盛宴；“筵席”兼顾食物与酒，并符合经文庄重的语域。
- source_word: שְׁמָנִים
  choice: 肥美食物
  rationale: 字面涉及“肥脂之物”，在古代宴席意象中表示丰盛、上好的食物；“肥美食物”保留原有具体意象，同时便于现代读者理解。
- source_word: שְׁמָרִים
  choice: 陈年佳酿
  rationale: 字面为酒的沉淀、酒渣，此处指酒留在酒渣上陈酿而变得醇厚；正文传达其正面的宴席含义，脚注说明字面意象。
- source_word: מְמֻחָיִם
  choice: 满是骨髓的
  rationale: 保留骨髓这一奢华、肥美的具体食物意象，不笼统改写为“上好的”。
- source_word: מְזֻקָּקִים
  choice: 澄清过滤的
  rationale: 该词表示经过提炼、澄清；用于酒时，“澄清过滤”具体表达去除沉淀、使酒清澈的过程。
theological_decisions:
- issue: 筵席所涵盖的普世范围
  choice: 为万族
  alternative: 为列国；为所有民族
  rationale: 保留עַמִּים的复数族群含义，呈现耶和华为不同族群设宴的异象，但不据此进一步规定筵席与各族的具体神学关系。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“摆设筵席”“肥美食物”“陈年佳酿”保持诗歌的对称与丰盛感；破折号呈现后半句对前两项的展开说明。
