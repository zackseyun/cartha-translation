- from: 万军之耶和华必在这山上，为万族摆设筵席：肥美食物的筵席[a]，陈年佳酿的筵席——满是骨髓的肥美食物，澄清过滤的陈年佳酿。
  to: 万军之耶和华必在这山上，为万族摆设筵席：肥美的食物的筵席[a]，陈年佳酿的筵席——满是骨髓的肥美食物，澄清的陈年佳酿。
  rationale: 仅作低风险的文体润饰：“肥美的食物”更自然；“澄清的陈年佳酿”以自然中文表达经精炼、滤清的酒，保留原文的优质酒意象及两组平行结构。其余译文无须改动。
