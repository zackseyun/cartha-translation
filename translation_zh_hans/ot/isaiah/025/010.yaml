id: ISA.25.10
reference: Isaiah 25:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי תָנ֥וּחַ יַד יְהוָ֖ה בָּ/הָ֣ר הַ/זֶּ֑ה וְ/נָ֤דוֹשׁ מוֹאָב֙ תַּחְתָּ֔י/ו כְּ/הִדּ֥וּשׁ מַתְבֵּ֖ן ב/מי מַדְמֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/010.yaml
  text: For the hand of Yahweh will rest on this mountain[a], and Moab will be trampled down in its place[b], as straw is trampled down in the water of a dung pit.
translation:
  language: zh_hans
  text: 因为耶和华的手必安歇在这山上；摩押必在其下被踩踏[a]，如同禾秸在粪池的水中被踩踏一样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其”所指不明确。原文也可理解为“摩押必在他下面被踩踏”“摩押必在它下面被踩踏”，或按其含义译作“摩押必在原处被踩踏”。
    reason: 保留 תַּחְתָּיו 的代词先行词歧义。
  - marker: b
    text: “粪池”也可译作“粪堆”或“积肥处”；原词很可能指与粪肥有关的污秽场所。
    reason: 说明罕见词 מַדְמֵנָה 的词义范围。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的应许与审判说明缘由；现代汉语用“因为”自然保留解释作用。
- source_word: תָנוּחַ
  choice: 必安歇
  rationale: 保留 נוח 所表达的“停驻、安歇”意象，既不把耶和华之手的比喻抽象化，也不额外限定其作用。
- source_word: יַד יְהוָה
  choice: 耶和华的手
  rationale: 保留希伯来语以“手”表示能力与行动的具体比喻。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名在现代汉语圣经传统中的通行形式。
- source_word: בָּהָר הַזֶּה
  choice: 在这山上
  rationale: 准确表达处所；上下文所指为锡安之山，但正文不补入原文未明说的名称。
- source_word: וְנָדוֹשׁ / כְּהִדּוּשׁ
  choice: 被踩踏 / 被踩踏
  rationale: 两处均来自 דוש，统一译法以保留原文重复和比喻呼应；“踩踏”也兼具践踏、打谷的身体动作感。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用该民族和地域名称的现代汉语通行译名。
- source_word: תַּחְתָּיו
  choice: 在其下
  rationale: 近距离保留“在他／它下面”的形式，同时让汉语“其”的所指保持开放，不武断判定代词先行词。
- source_word: מַתְבֵּן
  choice: 禾秸
  rationale: 指供作饲料或打谷后的秸秆；“禾秸”比单说“草”更贴近农事图景。
- source_word: בְּמֵי מַדְמֵנָה
  choice: 在粪池的水中
  rationale: 保留“水”与污秽粪肥场所的组合及其羞辱性画面；该罕见词的具体场所含义仍有不确定性，另以脚注说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用现代汉语读者最熟悉、可识别度最高的专名形式，而不以“主”替代。
- issue: תַּחְתָּיו 中代词所指
  choice: 摩押必在其下被踩踏
  alternative: 摩押必在原处被踩踏；摩押必在他下面被踩踏；摩押必在它下面被踩踏
  rationale: 希伯来语第三人称单数阳性后缀的先行词并不确定。“其下”保留原文空间关系和指代张力，脚注列出主要理解，避免确定为耶和华、这山或摩押所在之处。
- issue: 耶和华之手“安歇”的含义
  choice: 保留具象说法“耶和华的手必安歇”
  alternative: 耶和华的能力必临到；耶和华必保护
  rationale: 原文意象可包含临在、能力、眷顾或掌权，正文不将它缩减为单一神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留“耶和华的手”“安歇”和两次“被踩踏”的具体意象及原文呼应。正文避免补明代词先行词，并以脚注呈现真实的词汇与句法不确定性。
