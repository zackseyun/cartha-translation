source:
  edition: WLC
  text: כְּ/חֹ֣רֶב בְּ/צָי֔וֹן שְׁא֥וֹן זָרִ֖ים תַּכְנִ֑יעַ חֹ֚רֶב בְּ/צֵ֣ל עָ֔ב זְמִ֥יר עָֽרִיצִ֖ים יַעֲנֶֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/005.yaml
  text: Like heat in a dry land[a], you subdue the uproar of strangers; like heat by the shadow of a cloud[b], the song of the ruthless is brought low.
translation:
  language: zh_hans
  text: 如同干旱之地的热气，你平息外邦人[a]的喧嚣；如同浓云的阴影使热气消退，残暴者的歌声也被压低[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”也可译作“陌生人”或“外来人”。
    reason: lexical_alternative
  - marker: b
    text: “被压低”也可译作“被压制”或“被降卑”。这里的希伯来语动词也可能表示“回应”或“作答”，但上下文和平行结构较支持歌声受到压制的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחֹרֶב
  choice: 如同……热气
  rationale: חֹרֶב可指炎热或干旱；与下半句的“云影”相对时，“热气”最能保留诗中的自然景象。
- source_word: בְּצָיוֹן
  choice: 干旱之地
  rationale: צָיוֹן表示干燥、荒旱之处；译为“干旱之地”既准确又符合现代汉语表达。
- source_word: שְׁאוֹן
  choice: 喧嚣
  rationale: 该词指响亮的嘈杂、骚动或喧腾；“喧嚣”兼顾声音与敌对骚动的意味。
- source_word: זָרִים
  choice: 外族人
  rationale: זָרִים可指陌生人或外来者；本节语境涉及敌对的外来群体，“外族人”较自然，同时以脚注保留另一可能。
- source_word: תַּכְנִיעַ
  choice: 你压下
  rationale: כנע的使役式表示使降卑、制服或压制；“压下”既承接“喧嚣”，也保留上帝制伏敌对势力的含义。
- source_word: חֹרֶב בְּצֵל עָב
  choice: 如同云影下的热气
  rationale: 直译保留“热气—云影”的诗意对照，不在正文中额外补出云影如何使热气减弱。עָב指浓云，现代汉语用“云影”凝练自然。
- source_word: זְמִיר
  choice: 歌声
  rationale: זְמִיר指歌或吟唱；“歌声”在汉语中能自然表达残暴者夸胜的声音，同时不把“凯歌”等语境推断写入正文。
- source_word: עָרִיצִים
  choice: 残暴者
  rationale: עָרִיץ指强暴、凶狠、专横的人；“残暴者”准确且不限定其具体政治身份。
- source_word: יַעֲנֶה
  choice: 低沉下去
  rationale: 该形式在此处含义困难，按上下文和平行结构通常理解为歌声受到压制或降卑。“低沉下去”适合“歌声”这一主语，又避免明确补出施事者；脚注保留“回应”的词义可能。
theological_decisions:
- issue: 对上帝的直接称呼与末句施事者是否明说
  choice: 上半句保留第二人称“你压下”，末句不另加明确施事者，译作“歌声也低沉下去”
  alternative: 两句都明确以上帝为主语，译作“你压下……你使……低沉”；或把末句译作“回应”
  rationale: תַּכְנִיעַ明确是第二人称单数，承接上下文对上帝的称呼；末句的יַעֲנֶה较难确定，不补出主语可保留原诗的含蓄和平行张力。
- issue: יַעֲנֶה的语义
  choice: 按语境译为歌声被压低、低沉下去
  alternative: 译为“回应”或“作答”
  rationale: “低沉下去”与前句“你压下”形成语义平行，也符合云影削弱热气的比喻；但该动词通常也可表示“回答”，故在脚注中明示此可能，不把歧义完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两组“如同……”保留希伯来诗歌的平行结构；“热气—云影”“喧嚣—歌声”的声音与自然意象均予保留。正文不添加“凯歌”“暴君”等解释性较强的词，以免缩窄原文含义。
