revisions:
- from: 如同干旱之地的热气，你压下外族人[a]的喧嚣；如同云影下的热气，残暴者的歌声也低沉下去[b]。
  to: 如同干旱之地的热气，你平息外邦人[a]的喧嚣；如同浓云的阴影使热气消退，残暴者的歌声也被压低[b]。
  rationale: 修订使第二个自然意象在汉语中完整可懂：浓云的阴影使热气消退，正如上帝平息外邦人的喧嚣、残暴者的歌声受压低。末句仍不补出明确施事者，以保留原文形式及困难动词的解释空间；脚注明确保留另一词义可能。
