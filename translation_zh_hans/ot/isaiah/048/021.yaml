base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/021.yaml
  text: They did not thirst when he led them through the deserts[a]; he made water flow for them from the rock; he split the rock[b], and water gushed out.
translation:
  language: zh_hans
  text: 当他领他们经过干旱之地[a]时，他们并不口渴；他使水从磐石中流出，供给他们；他劈开磐石[b]，水就涌流出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在荒漠中”或“经过干旱之处”。
    reason: lexical_alternative
  - marker: b
    text: 本节呼应耶和华在旷野使磐石出水、供应百姓的事（例如出埃及记17:6；民数记20:11）。
    reason: cross_reference
lexical_decisions:
- source_word: צָמְאוּ
  choice: 口渴
  rationale: 该动词表示经历干渴；译作“并不口渴”自然、准确，并保留动词性表达。
- source_word: בָּחֳרָבוֹת
  choice: 经过干旱之地
  rationale: 复数名词指干燥、荒芜的地域；结合“领他们”的移动语境，“经过干旱之地”既自然，又不把具体地貌限定为沙漠。
- source_word: הוֹלִיכָם
  choice: 他领他们
  rationale: הלך的使役式在此意为带领、使之行走；“领他们”简洁地保留使役含义。
- source_word: הִזִּיל
  choice: 使水……流出
  rationale: נזל的使役式表示使水流动；“使水……流出”明确保留其使役语义。
- source_word: מִצּוּר
  choice: 从磐石中
  rationale: 介词מִן标明水的来源；“磐石”符合庄重的经文语体，也呼应旷野供水叙事。
- source_word: וַיִּבְקַע צוּר
  choice: 他劈开磐石
  rationale: בקע意为劈开、裂开；“劈开磐石”保留具体而有力的意象。
- source_word: וַיָּזֻבוּ מָיִם
  choice: 水就涌流出来
  rationale: זוב表示流出；“涌流出来”在现代汉语中自然，并传达水充沛流出的鲜明画面。
theological_decisions:
- issue: 本节连续出现的第三人称单数主语所指
  choice: 保留“他”，按上下文指耶和华
  alternative: 直接补明为“耶和华”，或理解为泛指主语
  rationale: 希伯来文本本节没有再次明说主语名称，而上下文清楚表明施行带领和供水的是耶和华；保留“他”既忠于句法，也不必过度明说。
- issue: 本节与旷野磐石出水事件的互文关系
  choice: 在正文中保留历史诗歌性的呼应，并以脚注列出相关经文
  alternative: 在正文中明确加入预表性或圣礼性的解释
  rationale: 经文显然呼应旷野中磐石出水的叙事，但正文不应加入后来的神学阐释；脚注仅说明互文背景。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“干旱之地”避免将原词过度限定为特定沙漠地貌；“磐石”保留经文语体和互文色彩。分号呈现希伯来诗句中连续而递进的行动。
