source:
  edition: WLC
  text: לְמַ֤עַן שְׁמִ/י֙ אַאֲרִ֣יךְ אַפִּ֔/י וּ/תְהִלָּתִ֖/י אֶחֱטָם לָ֑/ךְ לְ/בִלְתִּ֖י הַכְרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/009.yaml
  text: For the sake of my name I delay my anger[a], and for my praise I restrain it for you[c][b], so as not to cut you off.
translation:
  language: zh_hans
  text: 为了我的名，我延缓发怒[a]；为了我的颂赞，我为你抑制怒气[b]，免得把你剪除[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“我使我的鼻子延长”，是“延缓发怒”或“不轻易发怒”的惯用说法。
    reason: cultural_note
  - marker: b
    text: 或译“为你勒住怒气”；希伯来文动词可让人联想到给动物套上口笼或将其勒住。
    reason: lexical_alternative
  - marker: c
    text: 或译“毁灭你”“除灭你”；“剪除”较贴近希伯来文，也保留其司法性措辞。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שְׁמִי
  choice: 为了我名的缘故
  rationale: 保留“名”的希伯来表达，指向上帝的名誉、尊荣和彰显出来的品格；“为了……的缘故”清楚表达行动的动机。
- source_word: אַאֲרִיךְ אַפִּי
  choice: 我延缓发怒
  rationale: 原文直译近于“使我的鼻子延长”，是延后怒气发作的惯用语。“延缓发怒”既传达时间意味，也保留这里第一人称具体行动的语气。
- source_word: וּתְהִלָּתִי
  choice: 为使我受颂赞
  rationale: 保留“颂赞”这一名词的核心意义，并以自然汉语表达上帝使自己的名当受称颂这一动机；不直接改写为较抽象的“荣耀”或“声誉”。
- source_word: אֶחֱטָם
  choice: 抑制怒气
  rationale: 该动词可呈现给动物套口笼、勒住的意象，引申为抑制或拦住。汉语补出承接上句的“怒气”，使所指清楚而不过度解释。
- source_word: לָךְ
  choice: 为你
  rationale: 简洁保留介词对受话者的关系或有利指向；上下文中的受话者是以色列。
- source_word: לְבִלְתִּי
  choice: 不
  rationale: 在连续句式中自然表达目的或结果，即抑制怒气，以免采取彻底剪除的行动。
- source_word: הַכְרִיתֶךָ
  choice: 把你剪除
  rationale: 保留 כרת 使役形“剪除、断绝”的具体司法性措辞，不在正文中泛化为“毁灭”或强化为“彻底消灭”。
theological_decisions:
- issue: 上帝克制审判的动机
  choice: 正文把上帝的名和他当受的颂赞列为克制怒气的动机，把受话者未被剪除写为结果。
  alternative: 将重点改写为上帝主要为了以色列的益处而行动，或把“颂赞”直接释为“荣耀、声誉”。
  rationale: 原文明确以“我的名”和“我的颂赞”为行动根据，并以“不剪除你”说明对受话者产生的结果；译文保留这一张力，不引入人的功劳或特定教义体系。
- issue: אֶחֱטָם 的隐含宾语
  choice: 根据前一分句补作“怒气”。
  alternative: 不补宾语，或明确补作“烈怒”。
  rationale: 现代汉语在此补出宾语更清楚；“怒气”直接承接 אַפִּי，而“烈怒”会加入原文没有明说的强度。
- issue: לְבִלְתִּי 所表达的逻辑关系
  choice: 用“不把你剪除”自然呈现克制怒气所指向的目的或结果。
  alternative: 明确译作“免得把你剪除”或“为的是不把你剪除”。
  rationale: 原文可在目的与结果之间保留一定弹性；简洁的并列结构避免把二者过度区分。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我名”保留圣经语体但不古奥；“延缓发怒”比“延长鼻子”自然，也比一般性表述“不轻易发怒”更能体现本句中的具体行动。“颂赞”稍具庄重色彩，用来保存 תְּהִלָּה 的名词形式及其开放含义。
