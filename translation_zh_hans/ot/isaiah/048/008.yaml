source:
  edition: WLC
  text: גַּ֣ם לֹֽא שָׁמַ֗עְתָּ גַּ֚ם לֹ֣א יָדַ֔עְתָּ גַּ֕ם מֵ/אָ֖ז לֹא פִתְּחָ֣ה אָזְנֶ֑/ךָ כִּ֤י יָדַ֨עְתִּי֙ בָּג֣וֹד תִּבְגּ֔וֹד וּ/פֹשֵׁ֥עַ מִ/בֶּ֖טֶן קֹ֥רָא לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/008.yaml
  text: Indeed[a], you had not heard; indeed, you had not known; indeed, from of old your ear had not been opened. For I knew that you would surely deal treacherously[b], and that from the womb you would be called a transgressor.
translation:
  language: zh_hans
  text: 你也未曾听见，也未曾知道；从古时起，你的耳朵也从未开通。因为我知道你必背信弃义[a]；你从母腹起就被称为悖逆者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必背信弃义”：希伯来文以同根词连用加强语气，也可译作“必定行事诡诈”。
    reason: 说明原文的强调结构及词义选择。
  - marker: b
    text: “从母腹起”直译希伯来文，指生命最早的阶段；“悖逆者”也可译作“过犯者”。
    reason: 保留原文意象，并交代 פֹשֵׁעַ 的词义范围。
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 原文连续三次使用该词，形成层层加强的语势；中文重复“也”，既保留累积结构，也衔接上文。
- source_word: מֵאָז
  choice: 从古时起
  rationale: 表达从久远的先前一直延续至今的时间意味，比单纯的“从那时”更符合本节语境。
- source_word: פִתְּחָה אָזְנֶךָ
  choice: 你的耳朵未曾开启
  rationale: 保留“开启耳朵”的希伯来语意象，不把它单一解释为未受启示或不肯听从。
- source_word: בָּגוֹד תִּבְגּוֹד
  choice: 你必背信弃义
  rationale: 同根不定式绝对形与未完成式连用以加强语气；“必”体现强调，“背信弃义”传达 בגד 所含的背叛、失信之意。
- source_word: פֹשֵׁעַ
  choice: 悖逆者
  rationale: 该分词名词化，指反叛或越界的人；“悖逆者”在庄重而通俗的现代中文中保留其主动反抗意味。
- source_word: מִבֶּטֶן
  choice: 从母腹起
  rationale: 直译原文的鲜明意象，同时中文可自然理解为从生命最早阶段起。
- source_word: קֹרָא לָךְ
  choice: 你……被称为
  rationale: 按语境作称谓、定性理解，并以中文被动式自然表达。
theological_decisions:
- issue: “从母腹起”是否断言字面意义上的胎中个人罪责
  choice: 保留“从母腹起”的原文意象，将其作为对以色列自最早阶段便悖逆的先知性描述
  alternative: 明确解释为人在母腹中已有个人罪责
  rationale: 本节以第二人称单数对以色列作群体性 خطاب，原文可带有“从最初便如此”的惯用修辞力量；译文不将其扩展为超出本节的教义断言。
- issue: “耳朵未曾开启”指未获启示还是拒绝听从
  choice: 保留原文意象，不在正文中限定其因由
  alternative: 译成“你不肯听从”或“你未曾得到启示”
  rationale: 原句容许未领受、未理解与不受教等语义关联；直保意象可避免消除这种张力。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。重复“也”以保存原文的修辞累积；“耳朵开启”和“从母腹起”保留希伯来文意象，同时用脚注提示惯用含义和可译范围。
