  terminology: “背信弃义”恰当传达 בגד 的背叛、失信意味，并以“必”表达不定式绝对形加强。“悖逆者”适切对应 פֹשֵׁעַ，保留主动反叛的意味；脚注所列“过犯者”可作为较宽的替代译法。“从母腹起”保留原文修辞意象，未加入关于个人胎中罪责的教义推断。
