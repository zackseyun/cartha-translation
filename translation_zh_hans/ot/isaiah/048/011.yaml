base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/011.yaml
  text: For my own sake[a], for my own sake, I will act; for how can it be profaned? And my glory I will not give to another.
translation:
  language: zh_hans
  text: 为我自己的缘故，为我自己的缘故，我必行事；因为怎能被亵渎呢？[a] 我的荣耀，我必不给别人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我的名怎能被亵渎呢？”希伯来文没有明说被亵渎的是什么。
    reason: 原文省略所指对象；脚注提供常见而合理的明确读法，同时不在正文中消除歧义。
lexical_decisions:
- source_word: לְמַעֲנִי
  choice: 为了我自己
  rationale: לְ加מַעַן表示目的或缘由；重叠使用加强语气。“为了我自己”既保留反身意味，也能自然承载原文的强调。
- source_word: אֶעֱשֶׂה
  choice: 我必行事
  rationale: עשה含义宽泛，可指“做、施行”。原文没有明说宾语；“行事”保留这种开放性，同时表达上帝将采取行动。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前句的理由；“因为”清楚保留其解释性关系。
- source_word: אֵיךְ
  choice: 怎能
  rationale: 该疑问词引出反问；“怎能”自然表达原文不可接受、不可设想的语气。
- source_word: יֵחָל
  choice: 被亵渎
  rationale: חלל的尼פעל形通常表示“被亵渎”。希伯来文没有明说所指对象，中文也省略主语，以保留原文的简约和歧义。
- source_word: וּכְבוֹדִי
  choice: 我的荣耀
  rationale: כָּבוֹד可指荣耀或尊荣；在上帝自我宣告的语境中，“荣耀”贴切且为现代中文读者熟悉。
- source_word: לְאַחֵר
  choice: 给别人
  rationale: אַחֵר指与耶和华有别的另一方。“别人”简洁自然，也不把所指过度限定为偶像或某一特定对象。
- source_word: אֶתֵּן
  choice: 我绝不给
  rationale: נתן的基本义为“给”。“绝不”传达否定宣告的坚定语气，而“给”保持词义直接。
theological_decisions:
- issue: “怎能被亵渎”中被亵渎者未明
  choice: 正文不补出主语或对象，译作“因为怎能被亵渎呢？”
  alternative: “因为我的名怎能被亵渎呢？”
  rationale: 希伯来文 יֵחָל 为阳性单数被动式，但此处没有明说其所指；“我的名”是常见且合理的理解，却属于解释性补充。正文保留省略，脚注说明可能的明确读法，以保存原文的神学张力和修辞简约。
- issue: 上帝行动的动机
  choice: 保留“为了我自己”的重复
  alternative: 意译为“我这样做全是为了自己”
  rationale: 重复是本节显著的强调手段，表明行动关乎上帝自身的名誉与荣耀；逐次保留比合并意译更忠实，也不额外导入教义说明。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。保留“为了我自己”的重复和“我的荣耀”的前置结构，以呈现原文的强调与平行；“怎能被亵渎呢”刻意省略主语，使中文与希伯来文一样保持简洁和开放。
