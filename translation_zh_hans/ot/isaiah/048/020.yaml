reference: Isaiah 48:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: צְא֣וּ מִ/בָּבֶל֮ בִּרְח֣וּ מִ/כַּשְׂדִּים֒ בְּ/ק֣וֹל רִנָּ֗ה הַגִּ֤ידוּ הַשְׁמִ֨יעוּ֙ זֹ֔את הוֹצִיא֖וּ/הָ עַד קְצֵ֣ה הָ/אָ֑רֶץ אִמְר֕וּ גָּאַ֥ל יְהוָ֖ה עַבְדּ֥/וֹ יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/020.yaml
  text: Go out from Babylon[a]; flee from the Chaldeans! Declare this with a shout of joy; make it heard; send it out to the end of the earth. Say[b], “Yahweh has redeemed his servant Jacob.”
translation:
  language: zh_hans
  text: '你们要从巴比伦出来，

    要逃离迦勒底人[a]！

    要以欢呼声宣告这事，使人听见；

    要把这消息传到地极[b]。

    你们要说：“雅威已经救赎了他的仆人雅各。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要从迦勒底逃离”；希伯来文直译为“要逃离迦勒底人”。
    reason: 说明原文采用族群复数名称，而上下文也容许按其地域含义理解。
  - marker: b
    text: 直译：“地的尽头”。
    reason: 原文 קְצֵה הָאָרֶץ 使用单数“尽头／边缘”；正文采用现代汉语惯用的“地极”。
lexical_decisions:
- source_word: צְאוּ מִבָּבֶל
  choice: 你们要从巴比伦出来
  rationale: 保留复数命令语气和从巴比伦离开的方向含义；“出来”自然清楚。
- source_word: בִּרְחוּ מִכַּשְׂדִּים
  choice: 要逃离迦勒底人
  rationale: בִּרְחוּ 表达紧迫的逃离；כַּשְׂדִּים 在形式上指“迦勒底人”，因此正文保留族群名称。
- source_word: בְּקוֹל רִנָּה
  choice: 要以欢呼声
  rationale: 兼顾 קוֹל 的声音含义和 רִנָּה 的喜乐、欢呼色彩，符合公开报信的语境。
- source_word: הַגִּידוּ הַשְׁמִיעוּ זֹאת
  choice: 宣告，使人听见这事
  rationale: 分别体现“宣告”和使役形式“使人听见”，避免将两个并列命令合并。
- source_word: הוֹצִיאוּהָ עַד קְצֵה הָאָרֶץ
  choice: 要把它传到地极
  rationale: “传”自然表达使消息广泛发出的使役含义；“地极”简洁保留 קְצֵה הָאָרֶץ 的地之边缘、尽头意象。
- source_word: גָּאַל
  choice: 已经救赎了
  rationale: 完成式在宣告中表明救赎已经成就；“救赎”保留 גאל 的赎回与亲属救赎语义，不把它弱化为一般的帮助或释放。
- source_word: עַבְדּוֹ יַעֲקֹב
  choice: 他的仆人雅各
  rationale: 依照原文保留单数所有关系和“仆人”称谓，不将雅各解释性改写为以色列民。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；“雅威”以常见现代汉语音译保留专名性质，不以称号“主”替代。
- issue: 救赎动词 גָּאַל 的力度
  choice: 已经救赎了
  alternative: 已经赎回了／已经解救了
  rationale: “救赎”保留该词在盟约拯救语境中的分量，同时不进一步规定救赎的具体方式。
- issue: “雅各”的所指
  choice: 保留“他的仆人雅各”
  alternative: 解释为“他的仆人以色列”
  rationale: 原文使用“雅各”；虽可在上下文中集体指以色列民，正文不消除人名与群体身份之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。以重复的“要”保存一连串复数命令的节奏；分行呈现离开、宣告和救赎信息。脚注标记均置于所说明的正文词语之后。
