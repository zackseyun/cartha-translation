  text: מִ/דַּעְתִּ֕/י כִּ֥י קָשֶׁ֖ה אָ֑תָּה וְ/גִ֤יד בַּרְזֶל֙ עָרְפֶּ֔/ךָ וּ/מִצְחֲ/ךָ֖ נְחוּשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/004.yaml
  text: Because I knew that you are stubborn[a], and your neck is an iron sinew, and your forehead is bronze[c][b],
translation:
  language: zh_hans
  text: 因为我知道你顽梗[a]，你的颈项是铁制的筋腱[b]，你的额头是铜[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “顽梗”原文也可译作“刚硬”或“固执”。
    reason: lexical_alternative
  - marker: b
    text: 直译“你的颈项是铁制的筋腱”；这个形象表示刚硬抗拒、不肯低头。
    reason: cultural_note
  - marker: c
    text: 原文可指铜或青铜；“额头是铜”这个比喻表达厚颜而刚硬。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּעְתִּי כִּי
  choice: 因为我知道
  rationale: 介词 מִן 与“知道”的不定式结构在这里说明前文行动的缘由，כִּי 引出所知道的内容；汉语以“因为我知道……”自然承接，并保留因果关系。
- source_word: קָשֶׁה
  choice: 顽梗
  rationale: 本义为“硬”，用于责备人的语境时指刚硬、不肯顺服；“顽梗”既保留硬顽之意，也符合庄重而通俗的先知性语体。
- source_word: וְגִיד בַּרְזֶל עָרְפֶּךָ
  choice: 你的颈项是铁筋
  rationale: גִיד 指筋或腱，בַּרְזֶל 指铁；直译为“铁筋”保留身体与金属结合的鲜明比喻。עֹרֶף 可特指后颈，这里用自然且符合相关惯用意象的“颈项”。
- source_word: וּמִצְחֲךָ נְחוּשָׁה
  choice: 你的额头是铜
  rationale: מֵצַח 指额头；נְחוּשָׁה 表示铜或青铜质地。“铜”不强行限定具体合金，同时保留坚硬、无惭的金属意象。
theological_decisions:
- issue: 以身体和金属意象描述以色列的悖逆
  choice: 保留“颈项是铁筋、额头是铜”的具体比喻
  alternative: 译成“你不肯屈服，毫无羞耻”或加入“像”字改为明喻
  rationale: 原文直接使用无“像”字的隐喻，兼具顽固抵抗与厚颜刚硬的张力。直保留意象可避免把它收窄为单一抽象解释，也不引入额外教义判断。
translation_notes:
  register: 采用现代标准汉语的庄重先知性语体。“顽梗”较“固执”更能承载圣经语境中的道德责备；两个金属身体隐喻均按原文保留，不增添“像”，句式简洁有力。
