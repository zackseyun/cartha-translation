  text: עַתָּ֤ה נִבְרְאוּ֙ וְ/לֹ֣א מֵ/אָ֔ז וְ/לִ/פְנֵי י֖וֹם וְ/לֹ֣א שְׁמַעְתָּ֑/ם פֶּן תֹּאמַ֖ר הִנֵּ֥ה יְדַעְתִּֽי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/007.yaml
  text: Now they are created[a], and not from long ago; before today you had not heard them, lest you should say, ‘Look, I knew them.’
translation:
  language: zh_hans
  text: 这些事如今才被创造[a]，并非自古就有；在今天以前，你未曾听说过这些事，免得你说：“看哪，我知道这些事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些事现今被造，并不是从古时就有的；在今日以前，你未曾听说过这些事。”
    reason: 原文动词为被动式；时间短语可译为“如今／现今”和“自古／从古时”。“听见”在此按获知消息的语境可译为“听说”。
lexical_decisions:
- source_word: עַתָּה
  choice: 现在才
  rationale: 既表达“现在”，又借“才”凸显与“早已”和“今天以前”的时间对比。
- source_word: נִבְרְאוּ
  choice: 创造的
  rationale: 保留 ברא 明确的“创造”用语；这里可指上帝使新近启示的事成为现实，不弱化为“宣布”或“预言”。
- source_word: מֵאָז
  choice: 早已存在
  rationale: מֵאָז 指从以往、从古时；结合“创造”译为“并非早已存在”，在现代汉语中自然地表达其久远时间含义。
- source_word: וְלִפְנֵי יוֹם
  choice: 今天以前
  rationale: 按上下文将字面“在日子以前”理解为“在今天以前”，与句首“现在”对应。
- source_word: שְׁמַעְתָּם
  choice: 你未曾听见这些事
  rationale: 保留 שמע 的“听见”义，并把复数宾语明确为“这些事”，避免汉语中单用代词造成指代不清。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达防止某种结果发生的目的或顾虑。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意的语气，同时维持经文庄重而可懂的语体。
- source_word: יְדַעְתִּין
  choice: 我早就知道了
  rationale: 完成体与语境共同表达声称事先知晓；“早就”使这层夸口意味在汉语中自然显明，宾语可由上下文省略。
theological_decisions:
- issue: “创造”用于新近启示之事的含义
  choice: 保留“创造”，让经文表达上帝使这些事成为现实的主权作为。
  alternative: 译作“成就”或“宣布”。
  rationale: 原文使用 ברא，而非单纯表示宣告或预言的动词；直保“创造”可维持以赛亚书中的神学力度，同时不限定这些事究竟以何种方式被创造。
- issue: 复数宾语的所指
  choice: 用“这些事”指向上下文中新启示的事或事件。
  alternative: 用“它们”或省略宾语。
  rationale: 原文以复数后缀回指相关事项；“这些事”符合现代汉语，也不越过上下文进一步具体化。
- issue: “我知道了”的时间意味
  choice: 译作“我早就知道了”。
  alternative: 译作“我知道了”。
  rationale: “免得”所引出的夸口是声称在此次启示以前已经知道；“早就”把这一语用含义自然传达出来，但不添加知识来源。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“看哪”略带经文语体，用以保留 הִנֵּה 的提示功能；其余措辞避免古奥。“这些事是现在才创造的”保留被动意义与创造用语，同时使中文语序自然。
