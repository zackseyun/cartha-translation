base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/012.yaml
  text: 'Listen to me[a], Jacob, and Israel, whom I called: I am he; I am the first[b], and I am the last.'
translation:
  language: zh_hans
  text: “雅各啊，我所召的以色列啊，要听我！我是他[a]；我是首先的，我也是末后的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我就是那一位。”希伯来语此一简洁的自我认同公式在《以赛亚书》中反复出现。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע אֵלַי
  choice: 要听我
  rationale: שְׁמַע是阳性单数祈使式，要求专心听从；אֵלַי意为“向我／听我”。译作“要听我”简洁自然，并保留命令语气。中文为使并列呼语清楚，在第二个呼语后补出“要听”，不增加新的实质内容。
- source_word: יַעֲקֹב וְיִשְׂרָאֵל
  choice: 雅各……以色列
  rationale: 保留两个并列呼语，指向同一约民，并采用现代中文圣经人名的通行译法。
- source_word: מְקֹרָאִי
  choice: 我所召的
  rationale: 该词是与קרא相关的被动／结果性形式，带第一人称单数所属后缀，修饰“以色列”。“我所召的”既表达以色列是上帝所召者，也比生硬的“我的被召者”更符合现代汉语。
- source_word: אֲנִי הוּא
  choice: 我就是那一位
  rationale: 这是《以赛亚书》中反复出现的凝练神圣自我宣告。“我就是那一位”保留הוּא所带的指称意味，又避免中文“我就是他”在无明确先行词时的突兀和性别联想。
- source_word: רִאשׁוֹן
  choice: 首先的
  rationale: 此处形容词作名词性表语，与“末后的”构成绝对而庄严的对称表达。
- source_word: אַף
  choice: 也
  rationale: אַף在这里带追加、加强意味；“也”自然连接“首先的”和“末后的”，保留平衡结构。
- source_word: אַחֲרוֹן
  choice: 末后的
  rationale: 以名词化形容词译出，并与“首先的”形式对应，保留上帝至高、终极的宣告。
theological_decisions:
- issue: 神圣自我认同公式אֲנִי הוּא的译法
  choice: 我就是那一位
  alternative: 我就是他；我就是
  rationale: “我就是那一位”保留原文简短而有分量的自我指认，不把后来的神学结论直接写入经文。“我就是”会略去הוּא，“我就是他”虽较直译，却在现代汉语中容易显得指代不明。
- issue: רִאשׁוֹן……אַחֲרוֹן所表达的首尾独一性
  choice: 我是首先的，也是末后的
  alternative: 我是第一，也是最后；我是起初，也是终局
  rationale: 选择名词化的“首先的／末后的”，贴近原文的平行结构和称号式力度；不扩写为关于时间、创造或本体的解释，从而保留原文的神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。两个呼语分别呈现，以免“雅各和以色列”被误读为两个不同群体；第二个“要听”属于汉语结构上的补足。整体保留原文短促、平行、宣告性的节奏。
