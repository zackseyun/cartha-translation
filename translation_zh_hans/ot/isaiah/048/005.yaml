- from: 我从早先就告诉了你；事情还未发生，我就让你听见，免得你说：‘是我的偶像做成了这些事，是我的雕像和铸像吩咐这些事发生的。’
  to: 我早已向你宣告；事情还未发生，我就使你听见，免得你说：‘是我的偶像成就了这些事；我的雕像和铸像吩咐这些事发生。’
  rationale: 仅作安全的措辞和语域修订：以“早已”替换不自然的“从早先”，以“向你宣告”增强原文宣告语气；保留事件指称的概括性、使役的“使你听见”、三种偶像术语的区别，以及“吩咐”所体现的虚假支配事件之意。无需脚注：原文的事件指称虽由上下文补足，但正文“事情／这些事”已适当地保持概括。
