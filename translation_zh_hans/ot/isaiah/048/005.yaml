base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/005.yaml
  text: I declared it to you long ago[a]; before it came to pass I made you hear it, lest you say, ‘My idol did them[b], and my carved image and my cast image commanded them.’
translation:
  language: zh_hans
  text: 我早已向你宣告；事情还未发生，我就使你听见，免得你说：‘是我的偶像成就了这些事；我的雕像和铸像吩咐这些事发生。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַגִּיד
  choice: 告诉
  rationale: 使役词干在此有“宣告、使人知道”之意；“告诉”在现代汉语中自然清楚，并保留向“你”传达的语气。
- source_word: מֵאָז
  choice: 从早先
  rationale: 表示在事情实现以前的一段先前时间；“从早先”既保留介词结构，也避免把时间跨度过度具体化。
- source_word: בְּטֶרֶם תָּבוֹא
  choice: 事情还未发生
  rationale: 原文直译为“在它来到以前”，阴性单数所指在上下文中并未明说；汉语以“事情”补足其事件性，但不具体指定某一事件。
- source_word: הִשְׁמַעְתִּיךָ
  choice: 我就让你听见
  rationale: 保留 שמע 使役词干“使你听见”的因果意味，又符合现代汉语表达。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达防止某种说法出现的目的或顾虑。
- source_word: עָצְבִּי
  choice: 我的偶像
  rationale: עצב 在此指受造并受敬拜的偶像；“偶像”清楚而不古奥。
- source_word: עָשָׂם
  choice: 做成了这些事
  rationale: 复数后缀指前述所预告、后来成就的诸事；“做成”兼有实施与成就之意，避免误解为制作物件。
- source_word: פִסְלִי
  choice: 我的雕像
  rationale: פסל 指雕刻而成的像；“雕像”保留制作方式，并与一般的“偶像”和下文“铸像”区分。
- source_word: נִסְכִּי
  choice: 我的铸像
  rationale: 指浇铸而成的像；“铸像”是简洁、准确的现代汉语。
- source_word: צִוָּם
  choice: 吩咐这些事发生
  rationale: צוה 通常表示“吩咐、命令”；补出“发生”使复数宾语在汉语中自然，并保留偶像被错误归为支配事件者的讽刺意味。
theological_decisions:
- issue: 三个偶像用语是否加以区分
  choice: 分别译作“偶像”“雕像”“铸像”
  alternative: 三者都译作“偶像”，或采用较古雅的“雕刻的像”“熔铸的像”
  rationale: 希伯来文连续使用三个相关却不同的名词；区分表达可保存其修辞层次和对偶像的讽刺，而不加入额外教义解释。
- issue: 预告之事的指称
  choice: 以“事情”及“这些事”表达，不具体指定历史事件
  alternative: 明确译成某一预言、拯救或审判事件
  rationale: 本节语法只以阴性单数动词及复数代词回指上下文中的所预告之事；保持概括可避免消解原文的指称张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“从早先”保留原文时间表达的开放性；后半句维持三个偶像名称的区别。无需脚注，因为可译差异已能在正文中以自然方式表达，且没有必须向读者标示的文本异文。
