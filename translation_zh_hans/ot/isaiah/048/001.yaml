id: ISA.48.1
reference: Isaiah 48:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְעוּ זֹ֣את בֵּֽית יַעֲקֹ֗ב הַ/נִּקְרָאִים֙ בְּ/שֵׁ֣ם יִשְׂרָאֵ֔ל וּ/מִ/מֵּ֥י יְהוּדָ֖ה יָצָ֑אוּ הַֽ/נִּשְׁבָּעִ֣ים בְּ/שֵׁ֣ם יְהוָ֗ה וּ/בֵ/אלֹהֵ֤י יִשְׂרָאֵל֙ יַזְכִּ֔ירוּ לֹ֥א בֶ/אֱמֶ֖ת וְ/לֹ֥א בִ/צְדָקָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/001.yaml
  text: Hear this[a], house of Jacob, you who are called by the name of Israel and who came out from the waters of Judah, who swear by the name of Yahweh and invoke the God of Israel, but not in truth or in righteousness.
translation:
  language: zh_hans
  text: 雅各家啊，要听这话！你们这些以以色列之名被称呼、从犹大的水而出[a]的人，指着雅威的名起誓，呼求以色列的上帝，却并非本着真实和公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大的水”可能是含蓄的诗性说法，指犹大的后裔，或指从犹大的腰间而出。
    reason: 说明原文“水”的可能习语含义，同时保留正文的诗性意象与解释空间。
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: 要听这话
  rationale: 保留复数命令式的直接呼召；加“要”符合现代汉语先知宣告的庄重语气。
- source_word: בֵּית יַעֲקֹב
  choice: 雅各家
  rationale: 保留先知书中称呼圣约群体的固定意象及经文互文联系。
- source_word: הַנִּקְרָאִים בְּשֵׁם יִשְׂרָאֵל
  choice: 称为以色列名下
  rationale: 既表达按此名被称呼、归于此名的意思，也保留原文“以……之名”的结构和身份含义。
- source_word: וּמִמֵּי יְהוּדָה יָצָאוּ
  choice: 从犹大的水而出
  rationale: 正文保留原文“水”的诗性而含蓄的意象，不直接将其解释为后裔；脚注说明其可能所指。
- source_word: הַנִּשְׁבָּעִים בְּשֵׁם יְהוָה
  choice: 指着雅威的名起誓
  rationale: 准确表达以神的名作为誓言凭据的宗教行为。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为专名而非称号的性质。
- source_word: וּבֵאלֹהֵי יִשְׂרָאֵל יַזְכִּירוּ
  choice: 呼求以色列的上帝
  rationale: 此处使役形态的 זכר 在起誓和敬拜语境中不只是思想上的记念，而有提名求告、援引神名之意；“呼求”自然地表达其施行性的宗教含义。
- source_word: לֹא בֶאֱמֶת
  choice: 不凭真实
  rationale: 保留 אֱמֶת 在“真实、忠信”之间的语义张力，并与后面的“不凭公义”形成平行。
- source_word: וְלֹא בִצְדָקָה
  choice: 也不凭公义
  rationale: “公义”兼顾道德正直与合乎正义的含义，适合此处对虚假圣约言语的谴责。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文用“雅威”音译，以保存其作为以色列之神专名的性质。
- issue: מִמֵּי יְהוּדָה 是否在正文中按习语解释
  choice: 正文保留“从犹大的水而出”，脚注说明血统或后裔之意
  alternative: 从犹大的后裔而出／出自犹大的腰间
  rationale: 原文的“水”很可能含蓄地指生殖、血统或后代，但具体意象仍有解释空间；保留正文意象可避免过早消除其诗性和含混性。
- issue: אֱמֶת 的语义范围
  choice: 真实
  alternative: 忠信／诚实
  rationale: “真实”既可指言语并非真诚，也可隐含行为不可靠；不将本句限缩为单纯的主观诚实或圣约忠信。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“雅各家啊”保留正式称呼；分号呈现身份陈述与宗教行为之间的推进，“却”清楚带出末句的谴责。脚注标记紧随其所解释的“水而出”。
