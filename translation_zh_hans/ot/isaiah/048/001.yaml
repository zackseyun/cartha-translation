  rationale: 修订仅改善中文句法和现代语感：以“以以色列之名被称呼”准确呈现原文被动分词加“以……之名”的结构；以“并非本着真实和公义”自然表达末句。保留“犹大的水”、脚注锚点、神名“雅威”及原有的含蓄性。
