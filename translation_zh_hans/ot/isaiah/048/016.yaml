  to: '你们到我这里来，听这话：


    我从起初就没有在暗中说过话；

    从那时起[a]，我就在那里。


    如今，主耶和华差遣了我[b]，还有他的灵[c]。'
  rationale: 修订以“从那时起”避免把未明的阴性指代词释作“这事”，并由脚注保留“存在／成为／发生”等可能表达。将“隐秘处”调整为更自然的“暗中”，但不改变“公开而非秘密说话”的意思。末句继续采用不补足谓语的表达，以保存希伯来文的省略与歧义；脚注则以审慎措辞说明其可能的句法理解，不把任何一种解释当作正文所明说的事实。
