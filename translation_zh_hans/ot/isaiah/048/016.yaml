id: ISA.48.16
reference: Isaiah 48:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: קִרְב֧וּ אֵלַ֣/י שִׁמְעוּ זֹ֗את לֹ֤א מֵ/רֹאשׁ֙ בַּ/סֵּ֣תֶר דִּבַּ֔רְתִּי מֵ/עֵ֥ת הֱיוֹתָ֖/הּ שָׁ֣ם אָ֑נִי וְ/עַתָּ֗ה אֲדֹנָ֧/י יְהוִ֛ה שְׁלָחַ֖/נִי וְ/רוּחֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/016.yaml
  text: 'Come near to me[a]; hear this: From the beginning I have not spoken in secret; from the time it came to be, I was there. And now the Lord GOD has sent me[c][b], and his Spirit.'
translation:
  language: zh_hans
  text: '你们到我这里来，听这话：


    我从起初就没有在暗中说过话；

    从那时起[a]，我就在那里。


    如今，主耶和华差遣了我[b]，还有他的灵[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从它存在的时候起”。也可译“从它成为之时起”或“从事情发生之时起”；原文没有说明“它”所指为何。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明确说明这里的“我”是谁。基督徒常把说话者理解为仆人或弥赛亚，但本节本身没有明说其身份。
    reason: alternative_reading
  - marker: c
    text: 原文末尾没有重复动词，句法关系简略。可理解为“主耶和华和他的灵差遣了我”；也可较宽泛地理解为“主耶和华差遣了我，并涉及他的灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: קִרְבוּ אֵלַי
  choice: 你们到我这里来
  rationale: 保留复数命令语气和“向我靠近”的方向，现代汉语自然明白。
- source_word: שִׁמְעוּ זֹאת
  choice: 听这话
  rationale: 简洁保留复数命令及指示语的先知宣告语气。
- source_word: לֹא מֵרֹאשׁ בַּסֵּתֶר דִּבַּרְתִּי
  choice: 从起初，我就没有在隐秘处说话
  rationale: מֵרֹאשׁ表示“从起初”；בַּסֵּתֶר表示隐蔽、秘密。译文保留原句的时间起点和否定范围。
- source_word: מֵעֵת הֱיוֹתָהּ
  choice: 从这事发生的时候起
  rationale: 原文直译为“从它存在之时起”；阴性后缀所指未明。“这事发生”在汉语中自然，同时不具体限定所指事件。
- source_word: שָׁם אָנִי
  choice: 我就在那里
  rationale: 无明示系词；按回顾性的上下文采用过去时含义，并以“就”连接前面的时间从句。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: אֲדֹנָי译为“主”，יהוה按现代中文圣经传统音译为“耶和华”，并避免不自然的“主主”。
- source_word: שְׁלָחַנִי
  choice: 差遣了我
  rationale: 准确表达完成式动词及第一人称宾语后缀，并适合当前使命的语境。
- source_word: וְרוּחוֹ
  choice: 还有他的灵
  rationale: רוּחַ可指灵、气息或风；差遣语境中“灵”最合适。“还有”保留原文并列成分的简略和句法张力，不在正文中断定“他的灵”是共同施事者还是被差遣者。
theological_decisions:
- issue: 说话者的身份
  choice: 正文保留第一人称“我”，不明确指认其身份
  alternative: 将说话者明确译为仆人或弥赛亚
  rationale: 希伯来文本没有在本节明说说话者是谁；基督教传统常将其理解为仆人或弥赛亚，但译文不应把这一解释写入正文。
- issue: וְרוּחוֹ在差遣句中的句法角色
  choice: 译为略带省略性的“还有他的灵”
  alternative: 可理解为“主耶和华和他的灵差遣了我”，或“主耶和华差遣了我，也差遣了他的灵”
  rationale: 原文末尾的并列短语十分简略，可把“他的灵”理解为另一施事者，也可理解为另一受差遣者。正文保留张力，脚注说明主要读法。
- issue: 神名אֲדֹנָי יְהוִה的处理
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在现代普通话中庄重、清楚，也区分了称号אֲדֹנָי与神名יהוה。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，按诗行呈现三个陈述层次。“隐秘处”保留先知文学色彩；末句刻意不补足省略的谓语，以保存希伯来文真实的句法歧义。
