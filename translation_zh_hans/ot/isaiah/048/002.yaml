  text: כִּֽי מֵ/עִ֤יר הַ/קֹּ֨דֶשׁ֙ נִקְרָ֔אוּ וְ/עַל אֱלֹהֵ֥י יִשְׂרָאֵ֖ל נִסְמָ֑כוּ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/002.yaml
  text: For they are called from the holy city[a], and they lean on the God of Israel; Yahweh of hosts is his name.
translation:
  language: zh_hans
  text: 因为他们因圣城而得名[a]，倚靠以色列的上帝；万军之耶和华是他的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们被称为来自圣城的人。”原文既可强调他们因圣城而有此称号或身份，也可强调他们出自圣城。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的指责说明理由；“因为”自然保留解释性的逻辑关系。
- source_word: מֵעִיר הַקֹּדֶשׁ נִקְרָאוּ
  choice: 他们因圣城而得名
  rationale: 保留קרא的被动含义，并表达他们的称号或身份来自圣城。介词מִן也可能强调出身来源，因此另列脚注。
- source_word: וְעַל אֱלֹהֵי יִשְׂרָאֵל נִסְמָכוּ
  choice: 倚靠以色列的上帝
  rationale: “倚靠”保留סמך所含的身体隐喻及依赖之意，也与上下文中他们自称依靠上帝、实际却并非凭诚实和公义的张力相称。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 采用现代中文圣经语体中通行的神名“耶和华”；“万军”保留צְבָאוֹת的广泛含义，不把它限定为地上的军队。
- source_word: שְׁמוֹ
  choice: 是他的名
  rationale: 直接保留希伯来文宣告名字的惯用句式，庄重而清楚。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文正文采用最广为普通读者识别的专名“耶和华”，而不是以“主”这一称号替代原文的神名。
- issue: 百姓与圣城之间的关系
  choice: 因圣城而得名
  alternative: 被称为来自圣城
  rationale: 原文结构既可着重身份或称号源自圣城，也可着重他们来自圣城。正文选择较符合上下文所强调之身份宣称的译法，同时以脚注保留来源义。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“因圣城而得名”避免把被动式过度译成“自称”，并以脚注保留介词所容许的来源含义；分号维持末句神名宣告的独立分量。
