  text: אַף יָדִ/י֙ יָ֣סְדָה אֶ֔רֶץ וִֽ/ימִינִ֖/י טִפְּחָ֣ה שָׁמָ֑יִם קֹרֵ֥א אֲנִ֛י אֲלֵי/הֶ֖ם יַעַמְד֥וּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/013.yaml
  text: Indeed[a], my hand founded the earth, and my right hand spread out the heavens; when I call to them, they stand together.
translation:
  language: zh_hans
  text: 的确，我的手奠定了大地，我的右手铺展了诸天[a]；我一召唤它们，它们就一同站立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铺展”或译“跨量”或“量过”。原词可含以手掌宽度量度的意象，具体动作并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: 的确
  rationale: 此处作强调语气词，引出庄严的断言；“的确”在现代汉语中自然传达其强调作用，而不增添原文没有的内容。
- source_word: יָדִי
  choice: 我的手
  rationale: 直译以保留上帝施行创造的拟人化意象，并与下句“我的右手”形成平行。
- source_word: יָסְדָה
  choice: 奠定了
  rationale: יסד的基本意象是立下根基；“奠定”既保留根基意象，又能自然地以“大地”为宾语。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 上下文谈论宇宙创造，因此所指是全地，而非某一地域；“大地”也与“诸天”构成自然对举。
- source_word: וִימִינִי
  choice: 我的右手
  rationale: 保留原文具体的身体意象及其与“我的手”的平行结构，不将其抽象改写为能力或权能。
- source_word: טִפְּחָה
  choice: 铺展了
  rationale: 该词在此描述上帝以右手展开诸天；“铺展”清楚自然，并保留创造叙事中的空间意象。该词语义罕见，可能带有以手掌量度或撑开的意味，故列脚注说明。
- source_word: שָׁמָיִם
  choice: 诸天
  rationale: “诸天”保留希伯来语复数形式，并适合庄重而易懂的创造语境。
- source_word: קֹרֵא אֲנִי אֲלֵיהֶם
  choice: 我一召唤它们
  rationale: 分词加独立代词使动作鲜明；“一……就……”自然表达召唤与随后站立之间紧密而即时的关系。
- source_word: יַעַמְדוּ
  choice: 站立
  rationale: 直接保留עמד的基本含义，描绘天地响应上帝召唤而站立；不进一步解释为“侍立”或“前来报到”。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 保留该副词“共同、一起”的基本意义，呈现天地共同回应召唤的图景。
theological_decisions:
- issue: 上帝创造行动中的拟人化表达
  choice: 保留“我的手”和“我的右手”的具体意象。
  alternative: 译为“我的能力奠定大地，我的权能铺展诸天”。
  rationale: 希伯来文明确使用身体意象，强调上帝亲自且有主权地施行创造；将其抽象化会削弱原文的鲜明表达。
- issue: 天地响应上帝召唤的图景
  choice: 译为“它们就一同站立”，保留原文直陈而略具拟人色彩的说法。
  alternative: 译为“它们就一同侍立”或“它们就一同出现”。
  rationale: “侍立”会明确加入臣仆侍候的含义，“出现”则弱化עמד的站立意象；正文保留原文的开放性。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“奠定大地—铺展诸天”保留希伯来诗句的平行结构；“一……就……”使后半句的即时响应关系在汉语中清晰自然。
