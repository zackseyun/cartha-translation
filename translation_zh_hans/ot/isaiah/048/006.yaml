base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/006.yaml
  text: You have heard; now see all this. And will you not declare it? From now on I make you hear new things, hidden things that you have not known.
translation:
  language: zh_hans
  text: 你已经听见了；察看这一切吧。你们岂不宣告吗？从今以后，我要使你听见新事，就是你们所不知道的隐秘之事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲזֵה
  choice: 现在看看
  rationale: 该词是命令式“看、察看”；结合前面的“已经听见”，译为“现在看看”自然呈现由听到看的转折。原文没有独立对应“现在”的词，但汉语加“现在”可清楚表达此处话语推进，且与经审校的英语咨询层一致。
- source_word: תַגִּידוּ
  choice: 宣告
  rationale: 该动词可指讲述、说明或宣告；这里要求听者公开述说所见证的一切，“宣告”既保留公开表达之意，也符合先知文本的庄重语域。
- source_word: הִשְׁמַעְתִּיךָ
  choice: 我要使你听见
  rationale: 采用使役结构，保留希伯来语Hifil“使你听见、让你得知”的形式和主语的主动启示作用。
- source_word: חֲדָשׁוֹת
  choice: 新事
  rationale: 阴性复数形容词名词化，指新的事情；译作“新事”简洁并符合现代庄重汉语。
- source_word: נְצֻרוֹת
  choice: 隐秘之事
  rationale: 该词指被保守、封存而未显露的事；“隐秘之事”保留其此前不为人知、如今才被揭示的含义，而不具体化其性质。
theological_decisions:
- issue: 单数与复数第二人称的交替
  choice: 分别译为“你……你们……你”
  alternative: 全都统一译为“你们”或“你”
  rationale: 原文在“你已经听见”“使你听见”中用阳性单数，在“你们不宣告吗”中用复数。保留这一交替，避免擅自把受话对象完全统一，并保存文本可能由代表性个体转向群体的张力。
- issue: “隐秘之事”是否解释为特定救赎事件或预言内容
  choice: 保持概括，不作具体认定
  alternative: 明确解释为某一历史事件、弥赛亚预言或特定教义内容
  rationale: 本节本身只称其为“新事”和此前未知的“隐秘之事”，没有在句内明确界定其内容；译文不应先行解决后文语境才可能澄清的问题。
- issue: 反问句的语气
  choice: “难道你们不宣告吗？”
  alternative: “你们岂不说明吗？”或直陈式“你们要宣告”
  rationale: 保留 הֲלוֹא 引出的反问形式，使责问兼催促的语气不被改写为单纯命令。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“看看”比“观看”更自然，同时“这一切”“宣告”“隐秘之事”维持先知话语的肃穆感。标点体现“听见—察看—宣告—新启示”的层次。
