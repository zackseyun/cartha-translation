source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה גֹּאַלְ/ךָ֖ קְד֣וֹשׁ יִשְׂרָאֵ֑ל אֲנִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מְלַמֶּדְ/ךָ֣ לְ/הוֹעִ֔יל מַדְרִֽיכֲ/ךָ֖ בְּ/דֶ֥רֶךְ תֵּלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/017.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: I am Yahweh your God, who teaches you to profit[b], who leads you in the way you should go.'
translation:
  language: zh_hans
  text: '雅威[a]——你的救赎主、以色列的圣者——如此说：


    “我，雅威，是你的上帝；


    我教导你，使你得益处，


    引导你走当走的路。[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是上帝名字 יְהוָה 的音译；传统上也译作“耶和华”。
    reason: divine_name
  - marker: b
    text: 或译：“引导你走你所走的路。”希伯来语既可按描述性的“你所走的路”理解，也可在本节教导的语境中按劝导性的“当走的路”理解。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现上帝的专名，保留原文两次重复的自我启示。
- source_word: גֹּאַלְךָ
  choice: 你的救赎主
  rationale: 该分词在此作为雅威的称号；“救赎主”简洁保留拯救与赎回的含义，又不在正文中过度凸显亲属代赎的词源背景。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 保留以赛亚书中这一固定称号的形式和庄重语气。
- source_word: מְלַמֶּדְךָ לְהוֹעִיל
  choice: 我教导你，使你得益处
  rationale: 分词表达上帝持续而具有特征性的作为；לְהוֹעִיל表示教导所带来的益处，用目的或结果分句表达，比生硬的“教你获利”更符合现代汉语，也避免将意义局限于经济收益。
- source_word: מַדְרִיכֲךָ
  choice: 引导你
  rationale: 保留使人行走、带领前进的使役含义，并与下文道路意象自然衔接。
- source_word: בְּדֶרֶךְ תֵּלֵךְ
  choice: 走当走的路
  rationale: 在上下文中采用劝导性的理解，同时以脚注保留未完成式也可作描述性理解的语法空间。
theological_decisions:
- issue: 神圣专名 יְהוָה 的译法及重复
  choice: 雅威……我是雅威你的上帝
  alternative: 耶和华……我耶和华是你的上帝
  rationale: 音译“雅威”直接呈现专名，并保留原文重复，避免把第二处改写为普通称谓或削弱自我认同的强调。
- issue: תֵּלֵךְ 在道路短语中的语气
  choice: 当走的路
  alternative: 你所走的路
  rationale: 上下文中的教导和引导支持规范、劝导性的理解；但希伯来语形式本身也容许较为描述性的译法，因此不把另一可能性从注释中删去。
- issue: לְהוֹעִיל 所指的益处
  choice: 使你得益处
  alternative: 教导你有益的事；教导你获利
  rationale: 译文保留上帝教导为人带来益处的重点，却不把“益处”缩窄为物质利润，也不额外规定这种益处的具体神学范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以破折号标明同位称号，以分行保留先知诗体的节奏；避免文言化表达和把“益处”误解为单纯经济利益。
