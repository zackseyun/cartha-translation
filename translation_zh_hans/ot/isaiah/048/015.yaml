base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/015.yaml
  text: I[a], I have spoken; indeed[b], I have called him; I have brought him, and I will make his way prosper.
translation:
  language: zh_hans
  text: “我，我已经说过；我也召了他[a]，带领他来到；他必使自己的道路亨通[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”和“自己的”指上帝所召并带领来到的人；按上下文，通常理解为居鲁士（参48:14）。
    reason: cross_reference
  - marker: b
    text: 或译：“他所行的必亨通。”原文动词为使役式，直译为“他必使自己的道路亨通”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי אֲנִי
  choice: 我，是我
  rationale: 保留代词重复所产生的强调语气，同时用现代汉语中自然、庄重的句式表达。
- source_word: דִּבַּרְתִּי
  choice: 说了
  rationale: 完成式表示上帝已经作出宣告；“说了”简洁地保留其完成性。
- source_word: אַף
  choice: 也
  rationale: 此处承接并加强前句，同时引出上帝进一步的行动；“也”比单纯重复强调词更符合现代汉语语流。
- source_word: קְרָאתִיו
  choice: 召了他
  rationale: קרא 在这里表示呼召或召来；“召”保留上帝委任其器皿的语感，又不在正文中过度说明。
- source_word: הֲבִיאֹתִיו
  choice: 带他来到
  rationale: בוא 的使役式意为使其来、将其带来；“带他来到”既体现使役含义，也符合现代汉语。
- source_word: וְהִצְלִיחַ
  choice: 他必使……亨通
  rationale: 马所拉文本的动词是使役式第三人称阳性单数，而非第一人称；因此保留“他”为主语，并以“使……亨通”呈现使役意义。
- source_word: דַּרְכּוֹ
  choice: 自己的道路
  rationale: “道路”直接对应原文，也可涵盖其行程、事业或行动路线；用“自己的”清楚表明反身领属关系。
theological_decisions:
- issue: 阳性单数代词“他”所指何人
  choice: 正文保留代词“他”，不直接补出姓名
  alternative: 在正文中明确译为“居鲁士”或“上帝所拣选的器皿”
  rationale: 本节希伯来文本只用代词；上文使人通常将其理解为居鲁士，但正文不应加入本节没有明说的姓名。
- issue: 末句动词的主语
  choice: 按马所拉文本译作“他必使自己的道路亨通”
  alternative: 译作“我必使他的道路亨通”
  rationale: וְהִצְלִיחַ 是使役式完成时第三人称阳性单数，语法主语自然承接“他”；若以上帝为第一人称主语，通常应出现第一人称形式。保留这一读法，避免受咨询译文后期修订影响而改写原文人称。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我，是我”有意保留希伯来文的重复强调；全句以短分句呈现原文有力、连续的宣告。末句严格依照WLC所见第三人称动词形式翻译，并在脚注提供较自然的汉语表达。
