  text: וַ/יְהִ֤י כַ/חוֹל֙ זַרְעֶ֔/ךָ וְ/צֶאֱצָאֵ֥י מֵעֶ֖י/ךָ כִּ/מְעֹתָ֑י/ו לֹֽא יִכָּרֵ֧ת וְֽ/לֹא יִשָּׁמֵ֛ד שְׁמ֖/וֹ מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/019.yaml
  text: Your offspring would have been like the sand[a], and the descendants from your body like its grains[b]; their name would not have been cut off or destroyed from before me.
translation:
  language: zh_hans
  text: 你的后裔本会如沙一般多，从你而出的后代也会如沙粒一般多；他的名本不会从我面前被剪除，也不会被毁灭。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沙粒”所译的希伯来词罕见，也可理解为沙的微粒或小石粒。
    reason: lexical_alternative
  - marker: b
    text: 原文作“他的名”，为阳性单数；这可能把“后裔”作为一个整体的家系来人格化。也可按集合意义译作“他们的名”或“其名”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: 本会……
  rationale: 本节承接第18节未能实现的条件与惋惜语气；用“本会”在现代汉语中清楚表达反事实结果，而不误作已经发生的事实。
- source_word: כַחוֹל
  choice: 多如海沙
  rationale: חוֹל意为“沙”；汉语惯用“多如海沙”表达这一数量极多的比喻。“多”虽为语境所隐含，却是该比喻在本句中的自然含义。
- source_word: זַרְעֶךָ
  choice: 你的后裔
  rationale: זֶרַע在这里是集合单数，指人的后代。“后裔”自然、庄重，并保留家系延续的含义。
- source_word: וְצֶאֱצָאֵי מֵעֶיךָ
  choice: 你所生的子孙
  rationale: 原文直指从身体内部而出的后代，强调血缘所出；“你所生的子孙”比“从你腹中所出的”更符合现代汉语，同时未将其限定为母体或引入古雅的“腰间”。
- source_word: כִּמְעֹתָיו
  choice: 如沙粒
  rationale: 罕见名词在此指沙的细小单位，后缀回指“沙”；“沙粒”最自然地延续前半句意象。因该词可理解为沙的微粒或小石粒，另加脚注说明。
- source_word: לֹא יִכָּרֵת
  choice: 本不会……被剪除
  rationale: Nifal形表示“被剪除、被断绝”；“剪除”保留原文家系或名号被断绝的形象，并以“本不会”延续反事实语气。
- source_word: וְלֹא יִשָּׁמֵד
  choice: 也不会被灭绝
  rationale: 该动词表示被毁灭、除灭；“灭绝”与后裔和名号的语境相合，也保留它对“剪除”的加强作用。
- source_word: שְׁמוֹ
  choice: 他的名
  rationale: 原文是阳性单数“他的名”，很可能把前面的集合性后裔人格化为一条家系。正文保留单数，不直接改成复数“他们的名”。
- source_word: מִלְּפָנָי
  choice: 从我面前
  rationale: 贴近原文“从我面前／临在中”的表达，保持上帝亲自鉴察并使名存留的庄重语气。
theological_decisions:
- issue: 本节与第18节的反事实关系
  choice: 用“本会……本不会……”表达未实现的结果
  alternative: 按普通过去时或将来时译为“就会……不会……”
  rationale: 本节延续第18节“但愿你听从……”的惋惜和条件关系。明确反事实语气可避免让读者以为这些福分已照所述实现。
- issue: שְׁמוֹ的指代与数
  choice: 正文保留阳性单数“他的名”
  alternative: 按集合意义译为“他们的名”或“其名”
  rationale: 马所拉文本明确使用阳性单数后缀，但它可能将“后裔”作为集合性的家系来人格化。保留单数可呈现原文的语法张力，脚注则说明自然的集合性理解。
- issue: “名”被剪除、灭绝的含义
  choice: 保留原文关于“名”的说法，不展开为某一特定教义解释
  alternative: 释义为“家系不会断绝”或“不会从上帝面前消失”
  rationale: “名”可涉及身份、记念和家系延续；直译能保留这些彼此相关而未被原文明说限定的含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“本会／本不会”清楚承接上文的反事实惋惜；“海沙—沙粒”维持平行意象；“他的名”虽在汉语中略显突兀，但有意保留希伯来文单数与集合性后裔之间的张力，并以脚注辅助理解。
