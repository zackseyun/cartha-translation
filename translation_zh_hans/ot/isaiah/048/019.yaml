revisions:
- from: 你的后裔本会多如海沙，你所生的子孙也会多如沙粒[a]；他的名本不会从我面前被剪除，也不会被灭绝。[b]
  to: 你的后裔本会如沙一般多，从你而出的后代也会如沙粒一般多；他的名本不会从我面前被剪除，也不会被毁灭。[a][b]
  rationale: 修订仅作两项安全的源语导向调整：以“如沙一般多”替代含有额外“海”意象的惯用语；以“从你而出的后代”替代可能带来分娩性别限定的“你所生的子孙”。反事实语气、原文的单数“他的名”、被动的剪除与毁灭，以及脚注所标示的词义和数的歧义均予保留。脚注锚点置于句末，分别对应“沙粒”和“他的名”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:22:38Z'
