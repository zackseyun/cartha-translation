  text: There is no peace," says Yahweh[a], "for the wicked.
translation:
  language: zh_hans
  text: 耶和华说：“恶人没有平安[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可译作“安康”“福祉”或“完整”。希伯来语 שָׁלוֹם 的含义可包括和平、安好与完整的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: 没有
  rationale: 以现代汉语自然的存在否定表达，准确反映希伯来语表示不存在的否定词。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: “平安”是简洁、庄重且约定俗成的译法；原词也可涵盖安康、福祉与完整，故以脚注保留其较宽语义。
- source_word: אָמַר
  choice: 说
  rationale: 该完成式用于引出先知话语中的神圣宣告；汉语用“说”既自然，也不必强行限定为过去或现在时。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，并采用现代简体中文读者最熟悉的传统形式。
- source_word: לָרְשָׁעִים
  choice: 恶人
  rationale: 复数形容词名词化，指行恶的人；介词所表达的适用对象关系，在“恶人没有平安”的汉语结构中已自然体现。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且庄重的“耶和华”，同时不以“主”替代专名。
- issue: לָרְשָׁעִים 的关系
  choice: 恶人没有平安
  alternative: 对恶人没有平安
  rationale: 介词 ל 可表示宣告所针对或适用的对象。前者更符合自然汉语，同时保留“平安不属于恶人”的断言，未额外说明其原因或范围。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留原文警句式的短促力度。将引语置于“耶和华说”之后，使语序自然；脚注保留 שָׁלוֹם 的宽广语义。
