  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ל֥וּא הִקְשַׁ֖בְתָּ לְ/מִצְוֺתָ֑/י וַ/יְהִ֤י כַ/נָּהָר֙ שְׁלוֹמֶ֔/ךָ וְ/צִדְקָתְ/ךָ֖ כְּ/גַלֵּ֥י הַ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/018.yaml
  text: If only you had paid attention to my commandments! Then your peace would have been like a river[b][a], and your righteousness like the waves of the sea.
translation:
  language: zh_hans
  text: 但愿你曾留心听从我的诫命[a]！你的平安本会如江河，你的公义[b]本会如海浪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留心听从”也可译作“留心听”或“听从”。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּא
  choice: 但愿
  rationale: 引出未能实现的愿望和惋惜；“但愿”在现代汉语中自然、庄重，也保留了原文的感情色彩。
- source_word: הִקְשַׁ֖בְתָּ
  choice: 留心听从
  rationale: 该动词不只是听见，还包含专心聆听并作出回应；“留心听从”兼顾注意与顺从两层含义。
- source_word: לְמִצְוֺתָי
  choice: 我的诫命
  rationale: 保留复数及第一人称所属关系；“诫命”能传达其约与伦理层面的分量。
- source_word: וַיְהִ֤י
  choice: 那样……就会
  rationale: 在לוּא引出的未实现愿望之后，这一形式表达本来可能出现的结果；汉语用“那样……就会”自然呈现反事实关系。
- source_word: כַנָּהָר
  choice: 如江河
  rationale: 保留河流持续而丰沛的诗歌意象；“江河”在现代汉语中庄重自然。
- source_word: שְׁלוֹמֶךָ
  choice: 你的平安
  rationale: שָׁלוֹם可涵盖平安、福祉与完整；“平安”简洁地保留核心意义，并适合江河的比喻。
- source_word: וְצִדְקָתְךָ
  choice: 你的公义
  rationale: צְדָקָה可指公义、正义或得以昭雪；此处与听从诫命相连，“公义”较能保留道德与立约语境，同时不排除司法性含义。
- source_word: כְּגַלֵּ֥י הַיָּֽם
  choice: 如海浪
  rationale: 直接保留原文海浪连绵、丰盛的诗歌图像，表达简洁自然。
theological_decisions:
- issue: צִדְקָה在本节中的含义
  choice: 公义
  alternative: 正义；昭雪
  rationale: 上下文把留心听从上帝的诫命与随之而来的合宜状态相连。“公义”能涵盖道德和立约层面；“正义”也是可能的词义，因此收入脚注，不把原文的语义张力消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但愿”保留惋惜语气；“那样……就会”呈现反事实结果。句式保持原文两组平行比喻的诗歌节奏。
