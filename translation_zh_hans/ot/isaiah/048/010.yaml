  text: הִנֵּ֥ה צְרַפְתִּ֖י/ךָ וְ/לֹ֣א בְ/כָ֑סֶף בְּחַרְתִּ֖י/ךָ בְּ/כ֥וּר עֹֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/010.yaml
  text: Behold[a], I have refined you, but not as silver[b]; I have chosen you in the furnace of affliction.
translation:
  language: zh_hans
  text: 看哪，我熬炼了你，却不像炼银子那样[a]；我在苦难的炉中拣选了你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“却不以银子”；其中介词的关系较难确定。这里按上下文译为“不像炼银子那样”。
    reason: lexical_alternative
  - marker: b
    text: “拣选”是这个希伯来语动词通常的意思；在这里的冶炼语境中，也有解释性译法作“试验”。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是先知话语中引人注意并加强语气的用语。“看哪”既保留庄重语体，也为现代普通读者所熟悉。
- source_word: צְרַפְתִּיךָ
  choice: 我熬炼了你
  rationale: צרף常指熔炼、精炼金属；下文提到银子和炉，明确延续冶炼意象。“熬炼”在中文中自然承载借苦难炼净、考验的比喻。
- source_word: וְלֹא בְכָסֶף
  choice: 却不像熬炼银子
  rationale: בְכָסֶף的介词关系较难确定。结合冶炼语境，正文采用比较性理解，表示这次熬炼并非像炼银那样；同时以脚注保留希伯来文较直译的形式。
- source_word: בְּחַרְתִּיךָ
  choice: 我拣选了你
  rationale: בחר最通常、最直接的意义是“选择、拣选”。尽管冶炼语境使一些解释者提出“试验、炼净”的理解，正文优先按马所拉文本中该动词的正常词义翻译，并在脚注保留语境性替代读法。
- source_word: בְּכוּר
  choice: 在……炉中
  rationale: כּוּר指熔炼金属的炉。“炉”简洁自然，而前文“熬炼”和“银子”已充分表明冶炼背景。
- source_word: עֹנִי
  choice: 苦难
  rationale: עֹנִי可指困苦、患难、贫困或受压迫的处境。这里“苦难”范围适当，也与炉的比喻自然结合。
theological_decisions:
- issue: בְּחַרְתִּיךָ在熬炼语境中的含义
  choice: 正文译为“我拣选了你”
  alternative: “我试验了你”或“我炼净了你”
  rationale: 马所拉文本的动词בחר通常意为“选择”，不应仅因上下文的冶炼意象而在正文中改为另一个动词的意义。不过，语境确实促成了“试验／炼净”的传统解释，因此以脚注保留，不把经文中的神学张力单方面化解。
- issue: וְלֹא בְכָסֶף中介词ב的关系
  choice: 按比较义译作“却不像熬炼银子”
  alternative: 较直译为“却不是用／在银子中”
  rationale: 希伯来语短语本身简略而困难。比较义最符合连续的冶炼意象，但脚注说明字面形式，以免掩盖原文的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”保留先知宣告的强调语气；“熬炼—银子—炉”维持全句一致的冶炼意象。第二人称单数“你”照原文保留，可在上下文中指向以色列这一集体对象。
