  text: הִקָּבְצ֤וּ כֻלְּ/כֶם֙ וּֽ/שֲׁמָ֔עוּ מִ֥י בָ/הֶ֖ם הִגִּ֣יד אֶת אֵ֑לֶּה יְהוָ֣ה אֲהֵב֔/וֹ יַעֲשֶׂ֤ה חֶפְצ/וֹ֙ בְּ/בָבֶ֔ל וּ/זְרֹע֖/וֹ כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/014.yaml
  text: 'Gather yourselves[a], all of you, and listen: who among them has declared these things? Yahweh loves him; he will carry out his purpose in Babylon, and his arm will be against the Chaldeans.'
translation:
  language: zh_hans
  text: 你们都聚集起来，听吧：他们中间有谁宣告了这些事？耶和华爱他；他必在巴比伦成就他的旨意；他的膀臂必临到迦勒底人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华爱他；耶和华必在巴比伦成就自己的旨意；他的膀臂必临到迦勒底人。”这种译法把后文的“他”及“他的”理解为耶和华，而非他所拣选的执行者。
    reason: alternative_reading
lexical_decisions:
- source_word: הִקָּבְצוּ כֻלְּכֶם
  choice: 你们都要聚集
  rationale: 尼法勒复数命令式在这里是召集全体听众的劝令；“你们都要聚集”自然、明确，也保留“全体”的强调。
- source_word: וּשֲׁמָעוּ
  choice: 听我说
  rationale: שׁמע 的复数命令式要求专心听；汉语“听我说”比单说“听”更自然，其中“我”由发言情境补出，并不改变话语内容。
- source_word: מִי בָהֶם הִגִּיד אֶת־אֵלֶּה
  choice: 他们中间有谁预告了这些事
  rationale: הגיד 表示宣告、使人知道；此处关乎先前对事件的宣告，译作“预告”准确传达上下文中的预言意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而不以称号替代专名。
- source_word: אֲהֵבוֹ
  choice: 爱他
  rationale: 保留阳性单数宾语；完成体可表达已经确立的眷爱状态，现代汉语用“爱他”最自然。
- source_word: יַעֲשֶׂה חֶפְצוֹ בְּבָבֶל
  choice: 他必在巴比伦成就耶和华的旨意
  rationale: עשה חפץ 表示实现意愿或旨意；בְּבָבֶל 按其通常处所义译为“在巴比伦”。将原文代词所指显明为“耶和华的旨意”，避免汉语误读为执行者自己的旨意，同时不点名经文未明说的人物。
- source_word: וּזְרֹעוֹ כַּשְׂדִּים
  choice: 他的膀臂必攻击迦勒底人
  rationale: 保留“膀臂”这一力量与行动的具体比喻；名词短语依前句补出将来语气和敌对关系，使现代汉语清楚通顺。
theological_decisions:
- issue: “爱他”“他必……”“他的膀臂”中单数代词的指向
  choice: 正文按上下文将后两处代词理解为耶和华所眷爱的执行者；他在巴比伦成就耶和华的旨意，并攻击迦勒底人。
  alternative: 后两处代词可指耶和华自己：耶和华亲自成就自己的旨意，他的膀臂临到迦勒底人。
  rationale: 48:14-15的语流较自然地区分耶和华与他所爱、所召的执行者，但希伯来语连续的阳性单数代词容许另一种句法理解。因此正文采用较可能的读法，并用脚注保存真实歧义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“聚集”“预告”“成就……旨意”便于普通读者理解；保留“膀臂”这一圣经意象，并以脚注呈现原文代词所指的歧义。
