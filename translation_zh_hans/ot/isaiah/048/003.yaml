base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/003.yaml
  text: I declared the former things long ago[a]; they went out from my mouth, and I made them heard. Suddenly I acted[b], and they came to pass.
translation:
  language: zh_hans
  text: 从前的事，我早已宣告；它们从我口中发出，我也使人听见。忽然，我采取行动[a]；它们便成就了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “采取行动”或译“做了这事”。原文用的是常见的“做、行”一词；在这里指上帝使先前所宣告的事成为现实。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִאשֹׁנוֹת
  choice: 从前的事
  rationale: 该阴性复数形容词在此作名词用，指先前的事件或预告；“从前的事”自然，并保留《以赛亚书》中与后来之事、新事相对的表达。
- source_word: מֵאָז
  choice: 早已
  rationale: 表示宣告发生在久远的先前时间；“早已”在现代汉语中简洁自然，也传达时间距离。
- source_word: הִגַּדְתִּי
  choice: 宣告
  rationale: נגד 的使役式在此指郑重地使人知道，尤其适合先知性宣告的语境；“宣告”保留庄重语气。
- source_word: וּמִפִּי יָצְאוּ
  choice: 它们从我口中发出
  rationale: 保留话语从上帝口中发出的具体意象，并使复数代词承接“从前的事”，反映原文语法。
- source_word: וְאַשְׁמִיעֵם
  choice: 我也使人听见
  rationale: שׁמע 的使役式直指“使……被听见”。汉语以“使人听见”自然表达其使役意义，而不把它仅仅释为“传扬”。
- source_word: פִּתְאֹם
  choice: 忽然
  rationale: 直接表达动作的突然性，是自然、庄重的现代汉语对应词。
- source_word: עָשִׂיתִי
  choice: 我就行动
  rationale: 原词是常见的“做、行”；在预告与应验的语境中，“行动”既表明上帝采取了行动，又不额外加入比原文更强的因果措辞。
- source_word: וַתָּבֹאנָה
  choice: 那些事便成就了
  rationale: 阴性复数动词回指“从前的事”。就预告的事件成为现实而言，“成就了”比字面的“来了”更符合现代汉语，同时表达应验。
theological_decisions:
- issue: 上帝的预告与事情成就之间的关系
  choice: 译文呈现上帝先宣告、继而行动，所宣告的事随即成就。
  alternative: 可更最低限度地译作“我忽然做了，那些事就发生了”，较少凸显行动与成就的关联。
  rationale: 原文依次说“我宣告”“从我口中发出”“使人听见”“我做了”“它们来到”，同时包含预告和上帝的行动。“行动”保留这一神学关联，却不加入原文没有明说的决定论表述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“从我口中发出”保留原文意象；“使人听见”保留使役语态；“成就了”表达所宣告之事成为现实。
