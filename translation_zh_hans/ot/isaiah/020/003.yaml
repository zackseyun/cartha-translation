  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כַּ/אֲשֶׁ֥ר הָלַ֛ךְ עַבְדִּ֥/י יְשַׁעְיָ֖הוּ עָר֣וֹם וְ/יָחֵ֑ף שָׁלֹ֤שׁ שָׁנִים֙ א֣וֹת וּ/מוֹפֵ֔ת עַל מִצְרַ֖יִם וְ/עַל כּֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/003.yaml
  text: Then Yahweh said[b][a], “Just as my servant Isaiah has walked naked and barefoot for three years as a sign and a portent against Egypt and Cush,”
translation:
  language: zh_hans
  text: 于是耶和华说：“正如我的仆人以赛亚赤身[a]赤脚行走了三年，作为针对埃及和古实[b]的记号和预兆，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赤身”也可能指脱去外衣，只穿腰布或贴身衣物，并不一定表示完全裸露。
    reason: lexical_alternative
  - marker: b
    text: “古实”指埃及以南、通常与努比亚相关的地区；有些译本译作“埃塞俄比亚”。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行的上帝专名译法，明确对应希伯来文四字神名。
- source_word: כַּאֲשֶׁר
  choice: 怎样
  rationale: 与后续语境中预告的对应事件构成比较，中文“怎样”自然保留“正如／照着”的比较作用。
- source_word: הָלַךְ
  choice: 行走了
  rationale: 保留动词“行走、往来”的基本意义，并与“三年”结合表达持续的先知性行动。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 此处指以赛亚受上帝差遣、服事上帝的身份；“仆人”比“奴隶”更符合先知职分语境。
- source_word: יְשַׁעְיָהוּ
  choice: 以赛亚
  rationale: 采用现代中文通行的先知姓名译法。
- source_word: עָרוֹם
  choice: 赤身
  rationale: 保留该词“裸露、赤身”的直接含义；是否全裸仍有语境上的不确定性，另以脚注说明。
- source_word: וְיָחֵף
  choice: 赤脚
  rationale: 准确、简洁地表达未穿鞋的状态，并与“赤身”形成原文中的并列。
- source_word: שָׁלֹשׁ שָׁנִים
  choice: 三年
  rationale: 在“行走了三年”中自然表达行动持续的时段。
- source_word: אוֹת
  choice: 记号
  rationale: 表示先知的象征性行动指向其本身之外的信息。
- source_word: וּמוֹפֵת
  choice: 和预兆
  rationale: 在此审判预告的语境中，“预兆”既与“记号”有别，也体现预示未来事件的作用。
- source_word: עַל
  choice: 针对
  rationale: 既表达该象征行动指向埃及和古实，也保留审判语境中的不利意味，避免把介词的语义过度强化为直接攻击。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 采用现代中文通行国名。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 采用中文圣经传统中对该古代地区的通行音译，避免直接等同于范围并不完全相同的现代埃塞俄比亚。
theological_decisions:
- issue: 以赛亚赤身的程度
  choice: 正文译作“赤身”，脚注保留仅脱去外衣的可能。
  alternative: 译作“脱去外衣”或“只穿贴身衣物”。
  rationale: עָרוֹם的直接词义支持“赤身”，不宜在正文中先行弱化；但古代衣着习惯及先知象征行动的语境容许并非全裸的理解，因此用脚注保存真实歧义。
- issue: 记号所指向埃及和古实的关系
  choice: 将עַל译作“针对”。
  alternative: 译作“关于”或“攻击”。
  rationale: 上下文具有审判意味，但介词本身可以表示所涉及或所指向的对象；“针对”兼顾指向性与负面语境，不把敌对程度解释得过满。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“赤身赤脚”保留原文鲜明的象征行动；“记号和预兆”区分两个并列名词。句末保留逗号，以反映本节话语在下一节继续。
