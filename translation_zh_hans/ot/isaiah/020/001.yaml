base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/001.yaml
  text: In the year that the Tartan came to Ashdod[a], when Sargon king of Assyria sent him, and he fought against Ashdod and captured it,
translation:
  language: zh_hans
  text: 亚述王撒珥根派他珥探[a]到亚实突；他与亚实突交战，并攻占该城的那一年，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他珥探”（Tartan）可能是亚述的官衔，而非人名；或可指军队的高级统帅。
    reason: cultural_note
lexical_decisions:
- source_word: בִּ/שְׁנַת
  choice: 那一年
  rationale: 介词 בְּ 与 שְׁנַת 引出时间背景；译作“那一年”自然简洁，并保留本节延续至下一节的时间从句结构。
- source_word: תַרְתָּן
  choice: 统帅
  rationale: 该词很可能是亚述官衔而非人名，指高级军事长官；正文意译为“统帅”，使现代读者能直接理解其职分。
- source_word: אַשְׁדּוֹדָ/ה
  choice: 到亚实突
  rationale: 词尾方向性 ה 表示朝向或进入该城；“到亚实突”符合现代汉语表达。
- source_word: בִּ/שְׁלֹח אֹת/וֹ
  choice: 亚述王撒珥根派统帅
  rationale: בְּ 加不定式结构表示同时发生的背景情形；按汉语语序明确以撒珥根为差遣者，并以“统帅”回指宾语。
- source_word: סַרְגוֹן
  choice: 撒珥根
  rationale: 采用该亚述王名在现代中文圣经语境中的常见音译。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 构词链表明撒珥根的身份；“亚述王”简练自然。
- source_word: וַ/יִּלָּחֶם בְּ/אַשְׁדּוֹד
  choice: 统帅与亚实突交战
  rationale: לחם 与介词 בְּ 连用表示同……交战；重复“统帅”以避免汉语代词在撒珥根与统帅之间产生歧义。
- source_word: וַ/יִּלְכְּדָ/הּ
  choice: 并攻占了城
  rationale: לכד 在军事语境中指攻取、占领城邑；阴性宾语后缀回指亚实突，译作“城”使所指清楚。
