base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/006.yaml
  text: And the inhabitant of this coastland will say in that day[a], ‘Look, this is our hope, where we fled for help to be delivered from the king of Assyria[b]. And how shall we escape?’
translation:
  language: zh_hans
  text: 到那日，这沿海地区的居民[a]必说：“看哪，这就是我们所仰望的；我们曾逃往那里求援，为要脱离亚述王。我们又怎能逃脱呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沿海地区”也可译作“海岛”。这里的希伯来词在《以赛亚书》中常泛指沿海或海洋地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב הָאִי הַזֶּה
  choice: 这沿海地区的居民
  rationale: יֹשֵׁב虽为单数形式，在此可作集合用法，指当地居民；אִי在《以赛亚书》中常泛指沿海或海洋地区，不必限定为岛屿。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知话语常见的时间表达，同时符合现代汉语叙述习惯。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和带有感叹的语气，庄重而不晦涩。
- source_word: כֹּה מַבָּטֵנוּ
  choice: 这就是我们所仰望的
  rationale: מַבָּט本义与“注目、所望之处”有关，在语境中指他们寄托指望的对象；译文保留“仰望”与“指望”之间的意象和含义，避免增译为“我们的希望落到如此下场”。
- source_word: אֲשֶׁר נַסְנוּ שָׁם
  choice: 我们曾逃到那里
  rationale: 保留נוּס“逃往”的动作以及שָׁם“那里”的地点指向；汉语表达自然清楚。
- source_word: לְעֶזְרָה
  choice: 求援
  rationale: 简洁表达“为得到帮助”的目的。
- source_word: לְהִנָּצֵל
  choice: 希望脱离
  rationale: נצל的尼法勒不定式表达获救、被解救；“希望脱离”在目的结构中自然，并保留从威胁下得救的含义。
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: 脱离亚述王
  rationale: מִפְּנֵי在此指逃离亚述王所构成的威胁，不宜直译为“从……面前”。
- source_word: וְאֵיךְ נִמָּלֵט אֲנָחְנוּ
  choice: 如今我们怎能逃脱呢？
  rationale: 译作反问，传达绝望和无路可逃的语气；“如今”显明前述依靠既已失败后的逻辑关系，但不改变命题内容。
theological_decisions:
- issue: “所仰望的”是盼望本身还是受信赖的对象
  choice: 保留为“我们所仰望的”
  alternative: “我们的指望”或“我们的希望竟是这样”
  rationale: 原文מַבָּט可指人所注目、期待或倚靠的对象。当前译法保留意象及语义张力，不额外断定其仅为抽象希望，也不加入“落到如此下场”的解释。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“看哪”保留先知话语的强调色彩；整体句式保持直接，末尾反问突出倚靠外援破灭后的惊惶。
