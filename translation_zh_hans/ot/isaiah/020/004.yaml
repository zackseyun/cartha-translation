  text: כֵּ֣ן יִנְהַ֣ג מֶֽלֶךְ אַ֠שּׁוּר אֶת שְׁבִ֨י מִצְרַ֜יִם וְ/אֶת גָּל֥וּת כּ֛וּשׁ נְעָרִ֥ים וּ/זְקֵנִ֖ים עָר֣וֹם וְ/יָחֵ֑ף וַ/חֲשׂוּפַ֥י שֵׁ֖ת עֶרְוַ֥ת מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/004.yaml
  text: so the king of Assyria will lead away the captives of Egypt and the exiles of Cush[a], young and old, naked and barefoot[b], with buttocks uncovered—the nakedness of Egypt.
translation:
  language: zh_hans
  text: 亚述王必这样带走埃及的俘虏和古实的流亡者；无论老少，他们都赤身赤脚，露着臀部[a]，显出埃及的赤身露体[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“臀部裸露。”原文措辞刻意直白，描绘埃及人和古实人被掳流亡时所受的羞辱。
    reason: lexical_alternative
  - marker: b
    text: 或译：“埃及的羞耻。”原文直译为“埃及的赤身露体”，保留公开暴露、蒙受羞辱的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: 也必这样
  rationale: 承接上一节的象征行动，表明亚述王将照样对待埃及和古实；“也必这样”在现代汉语中自然，并保留预告语气。
- source_word: יִנְהַג
  choice: 掳走
  rationale: נהג可指带领或驱赶；在战俘被迫迁移的语境中，“掳走”简洁表达强制带离，同时避免把动作弱化为一般的“带走”。
- source_word: שְׁבִי מִצְרַיִם
  choice: 埃及的俘虏
  rationale: שְׁבִי在此由宾格标记引出，并与后面的流亡群体平行，所指是被俘的人，而非抽象的“被掳”。
- source_word: גָּלוּת כּוּשׁ
  choice: 古实的流亡者
  rationale: גָּלוּת既可指流亡状态，也可指被放逐的人群；此处与“俘虏”平行，故译为人群性的“流亡者”。“古实”沿用历史地名，避免等同于现代国家。
- source_word: נְעָרִים וּזְקֵנִים
  choice: 无论老少
  rationale: 这一对举涵盖不同年龄的人。“无论老少”是自然凝练的汉语，不额外限定性别。
- source_word: עָרוֹם וְיָחֵף
  choice: 赤身赤脚
  rationale: 直接保留原文身体暴露与没有鞋穿的形象，也呼应上下文中先知的象征行动。
- source_word: חֲשׂוּפַי שֵׁת
  choice: 臀部裸露
  rationale: 该短语刻意直白，描绘被掳者公开受辱的状态。“臀部裸露”准确而庄重，不淡化原文的强烈画面。
- source_word: עֶרְוַת מִצְרָיִם
  choice: 埃及的赤裸
  rationale: עֶרְוָה本义为赤裸、裸露，并含羞辱意味。译作“赤裸”保留与前文身体暴露的意象联系，而脚注说明其“羞耻”含义。
theological_decisions:
- issue: 结尾“埃及的赤裸”是身体暴露还是羞耻的转喻
  choice: 正文保留具体意象“埃及的赤裸”
  alternative: 埃及的羞耻
  rationale: 原文有意让实际裸露与国家所受的公开羞辱彼此重叠；正文不应只取抽象含义而消除这种张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“赤身赤脚”“臀部裸露”保留原文直白的受辱画面；“流亡者”与“俘虏”构成自然平行。正文中的[a]、[b]分别对应两个词义说明。
