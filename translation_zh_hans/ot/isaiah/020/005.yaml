base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/005.yaml
  text: And they will be dismayed and ashamed because of Cush[a], their hope, and because of Egypt[c][b], their boast.
translation:
  language: zh_hans
  text: 他们必因古实[a]——他们所仰望的——和埃及——他们所夸耀的[b]——而惊惶羞愧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实”是古代埃及以南的地区，通常与努比亚相联系；不宜简单等同于今天的埃塞俄比亚。
    reason: cultural_note
  - marker: b
    text: “所夸耀的”也可译作“所引以为荣的”或“他们的荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַתּוּ
  choice: 必……惊惶
  rationale: חתת在此表达因所倚靠者败落而产生的惊恐与意气崩溃；结合先知语境，用“必”表达其将来结果。
- source_word: וָבֹשׁוּ
  choice: 羞愧
  rationale: בושׁ表示蒙羞、失望所带来的羞耻；“羞愧”与“惊惶”并列自然，也不额外强化被动意味。
- source_word: מִכּוּשׁ
  choice: 因古实
  rationale: מן在两个平行短语中宜理解为原因，即他们因古实和埃及而惊惶羞愧；כּוּשׁ采用现代中文圣经地名“古实”，避免误等同于现代埃塞俄比亚。
- source_word: מַבָּטָם
  choice: 他们所仰望的
  rationale: מַבָּט本义涉及观看、所注目之物；此处指他们寄予期待、倚赖的对象。“所仰望的”保留原词的观看意象，也涵盖期待和信赖。
- source_word: וּמִן מִצְרַיִם
  choice: 也必因埃及
  rationale: 与“因古实”平行，מן取原因义；补出“必……惊惶羞愧”是为使中文中的共同谓语关系清楚。
- source_word: תִּפְאַרְתָּם
  choice: 他们所夸耀的
  rationale: תִּפְאֶרֶת可指荣耀、华美或夸耀的对象；此处埃及是他们引以为荣并倚仗的对象，“所夸耀的”最贴合语境，同时保留关系性含义。
theological_decisions:
- issue: 古实与埃及在句中的角色
  choice: 译作令人惊惶羞愧的倚望和夸耀对象
  alternative: 将介词译为“离开/来自”，或把古实、埃及仅视为地理来源
  rationale: 平行的两个מן短语及上下文表明，他们因所倚靠的古实和埃及受辱而羞愧；本译法不进一步断定经文未明说的政治或神学细节。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以破折号标明两个同位说明，使“古实—所仰望的”和“埃及—所夸耀的”的平行结构清楚。为避免中文把共同谓语误只归于前一项，在第二项中复述“必因……而惊惶羞愧”。
