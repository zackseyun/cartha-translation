  text: בָּ/עֵ֣ת הַ/הִ֗יא דִּבֶּ֣ר יְהוָה֮ בְּ/יַ֣ד יְשַׁעְיָ֣הוּ בֶן אָמוֹץ֮ לֵ/אמֹר֒ לֵ֗ךְ וּ/פִתַּחְתָּ֤ הַ/שַּׂק֙ מֵ/עַ֣ל מָתְנֶ֔י/ךָ וְ/נַעַלְ/ךָ֥ תַחֲלֹ֖ץ מֵ/עַ֣ל רַגְלֶ֑י/ךָ וַ/יַּ֣עַשׂ כֵּ֔ן הָלֹ֖ךְ עָר֥וֹם וְ/יָחֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/002.yaml
  text: At that time Yahweh spoke by the hand of Isaiah son of Amoz[a], saying, “Go, loosen the sackcloth from your waist, and remove your sandals from your feet.” And he did so, walking naked and barefoot.
translation:
  language: zh_hans
  text: 那时，雅威借着亚摩斯的儿子以赛亚说：“去，解下你腰间的麻衣，脱掉你脚上的鞋。”以赛亚就照着做了，赤身[a]赤脚地行走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赤身”也可理解为“衣着不全”“袒露”或“脱去外衣”；这个希伯来词在某些语境中不一定指完全裸体。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中对四字神名的常见音译保留上帝的专名，不以称号替代。
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 简洁自然地表达希伯来语的时间短语及其指示意义。
- source_word: דִּבֶּר ... בְּיַד
  choice: 借……传话
  rationale: ביד直译为“借……的手”，在先知传讯语境中表示以某人为媒介；“借……传话”既保留中介含义，又符合现代汉语表达。
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: 亚摩斯的儿子以赛亚
  rationale: 依照现代中文圣经人名惯例音译，并清楚呈现父子关系。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引出直接引语的惯用表达，中文无需机械保留不定式结构。
- source_word: לֵךְ
  choice: 去
  rationale: 准确表达命令式，并自然引出随后受命采取的行动。
- source_word: וּפִתַּחְתָּ הַשַּׂק מֵעַל מָתְנֶיךָ
  choice: 解下你腰间的麻布
  rationale: פתח在此指解开所穿之物；“解下”同时体现解开与取下。שׂק译为“麻布”，保留其粗布服饰的性质。
- source_word: וְנַעַלְךָ תַחֲלֹץ מֵעַל רַגְלֶיךָ
  choice: 脱掉你脚上的鞋
  rationale: חלץ表示脱除；נעל虽为单数形式，在此可作集合意义，中文自然译作“鞋”。
- source_word: וַיַּעַשׂ כֵּן
  choice: 以赛亚就照着做了
  rationale: 中文补明主语以避免指代含混，同时忠实表达执行命令的叙事公式。
- source_word: הָלֹךְ עָרוֹם וְיָחֵף
  choice: 赤身赤脚地行走
  rationale: הָלֹךְ描述持续或反复的行走状态；“赤身赤脚”自然、凝练地对应两个形容词。
theological_decisions:
- issue: 以赛亚象征行动中 עָרוֹם 所表示的裸露程度
  choice: 正文译作“赤身”
  alternative: 衣着不全；袒露；脱去外衣
  rationale: עָרוֹם通常表示赤裸，不宜在正文中弱化；但本节提到解下腰间麻布，语境也可能指脱去外层衣物或衣着不足，因此以脚注保留这一真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威”保留神名；“借……传话”传达先知作为传讯媒介的含义，避免生硬直译“借……的手说”。脚注标记紧随“赤身”，对应实际存在词义歧义的位置。
