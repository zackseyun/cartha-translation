  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה קְצִינֵ֣י סְדֹ֑ם הַאֲזִ֛ינוּ תּוֹרַ֥ת אֱלֹהֵ֖י/נוּ עַ֥ם עֲמֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/010.yaml
  text: Hear the word of Yahweh[a], rulers of Sodom; give ear to the instruction of our God[b], people of Gomorrah.
translation:
  language: zh_hans
  text: 所多玛的官长啊，你们要听耶和华的话[a]；蛾摩拉的百姓啊，你们要侧耳听我们上帝的教导[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 以赛亚用“所多玛”和“蛾摩拉”来称呼犹大的领袖和百姓，是先知性的比拟，并非说他们实际属于这两座城。
    reason: cultural_note
  - marker: b
    text: “教导”也可译作“律法”或“训诲”；希伯来文是תּוֹרָה（妥拉）。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 这是复数命令式，既是听取的呼召，也含有听从、重视之意；“要听”简洁自然，并保留先知宣告的力度。
- source_word: דְבַר יְהוָה
  choice: 耶和华的话
  rationale: דָּבָר在此构成先知宣告的惯用表达；译作“话”比“信息”更贴近原文，也保留其公式化和权威性的语感。神名יהוה按现代中文圣经的通行形式音译为“耶和华”。
- source_word: קְצִינֵי
  choice: 官长
  rationale: 该词指掌权者、领袖或官员；“官长”庄重而易懂，也适合对犹大领导者的先知性斥责。
- source_word: סְדֹם
  choice: 所多玛
  rationale: 采用现代中文圣经中广为人知的标准地名译法。
- source_word: הַאֲזִינוּ
  choice: 要侧耳听
  rationale: 该复数命令式比一般的“听”更强调专心留意；“侧耳听”既体现与前句不同的动词，也保留希伯来诗歌的平行结构。
- source_word: תּוֹרַת
  choice: 教导
  rationale: תּוֹרָה可指律法、训诲或教导；此处“教导”保留较宽泛的神圣训诲含义，避免无根据地缩窄为法典。
- source_word: אֱלֹהֵינוּ
  choice: 我们上帝的
  rationale: 保留原文第一人称复数所属后缀，体现先知虽责备百姓，仍称上帝为“我们的上帝”。
- source_word: עַם עֲמֹרָה
  choice: 蛾摩拉的百姓
  rationale: 该短语在句中作呼语；此译自然保留原文直接称听众为蛾摩拉百姓的震撼效果。
theological_decisions:
- issue: 把犹大和耶路撒冷的领袖与百姓称为所多玛和蛾摩拉
  choice: 正文保留直接呼语“所多玛的官长”和“蛾摩拉的百姓”
  alternative: 译成“像所多玛一样的官长”和“像蛾摩拉一样的百姓”
  rationale: 希伯来文直接以这两个城名呼唤听众，并未明说“像”；保留直接称呼可保存先知话语的震撼、隐喻和审判意味，而由脚注说明其比较性质。
- issue: תּוֹרָה在本节中的范围
  choice: 教导
  alternative: 律法；训诲
  rationale: 此词可包含律法，却不限于成文法条。“教导”保留语义宽度，也不预先限定这里所指的启示形式。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。两个呼语均加“啊”，清楚呈现直接呼喊；以“要听／要侧耳听”保存希伯来文近义平行和动词差异。神名采用中文传统且普遍可识别的“耶和华”，不用仅以称号“主”替代。
