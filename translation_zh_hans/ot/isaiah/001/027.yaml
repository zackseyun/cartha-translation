  text: צִיּ֖וֹן בְּ/מִשְׁפָּ֣ט תִּפָּדֶ֑ה וְ/שָׁבֶ֖י/הָ בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/027.yaml
  text: Zion will be redeemed by justice[a], and her returnees by righteousness.
translation:
  language: zh_hans
  text: 锡安必因公正蒙救赎；归回锡安的人[a]必因公义蒙救赎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归回锡安的人”也可理解为“她的归回者”或“回转、悔改的人”。希伯来语这个分词可指空间上的归返，也可指回转、悔改。
    reason: 保留希伯来分词שָׁבֶיהָ在归返与悔改之间的语义歧义，并说明其与“锡安”的关系。
lexical_decisions:
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的专名音译，清楚指向耶路撒冷及其群体象征。
- source_word: בְּמִשְׁפָּט
  choice: 因公平
  rationale: מִשְׁפָּט兼有审判、公正、公平之义；此处与צְדָקָה平行，并由介词בְּ表示凭借或途径，因此译作“因公平”，保留法律与伦理色彩。
- source_word: תִּפָּדֶה
  choice: 必……蒙救赎
  rationale: פדה的Niphal未完成式表示被赎回、获释放；“蒙救赎”保留被动意义和救赎内涵，“必”体现此处的预告语气。
- source_word: וְשָׁבֶיהָ
  choice: 其中归回的人
  rationale: שוב的分词可指归回者，也可指回转、悔改者。正文采用较少解释性的“归回的人”，并以“其中”自然表达阴性单数后缀与锡安的关系；具体归回方向及悔改含义留在脚注说明。
- source_word: בִּצְדָקָה
  choice: 因公义
  rationale: צְדָקָה表示合乎正义的行为或状态。译作“公义”，既与“公平”构成平行，也避免把两个相关但不同的希伯来词完全合并。
theological_decisions:
- issue: וְשָׁבֶיהָ所指的是悔改者还是归返者
  choice: 正文译作“其中归回的人”，不明确限定为悔改或空间上的归返
  alternative: “其中悔改的人”或“归回锡安的人”
  rationale: 希伯来语שוב本身兼有“返回”和“回转、悔改”的语义；上下文支持道德属灵的回转，但该形式也容许归返锡安的理解，因此正文保留张力，脚注列明两种可能。
- issue: 第二分句省略谓语的处理
  choice: 补出“必因公义蒙救赎”
  alternative: “其中归回的人必因公义”
  rationale: 希伯来诗歌第二行承接前行的תִּפָּדֶה而省略谓语；中文若不补出会语义残缺，因此重复“蒙救赎”，不增加新的神学判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“公平—公义”保留原文平行词组的区别；分号呈现两行诗意结构。正文避免用“悔改的人”单独锁定属灵解释，同时借脚注保存两种合理读法。
