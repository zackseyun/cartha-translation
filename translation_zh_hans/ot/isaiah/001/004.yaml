id: ISA.1.4
reference: Isaiah 1:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ה֣וֹי גּ֣וֹי חֹטֵ֗א עַ֚ם כֶּ֣בֶד עָוֺ֔ן זֶ֣רַע מְרֵעִ֔ים בָּנִ֖ים מַשְׁחִיתִ֑ים עָזְב֣וּ אֶת יְהוָ֗ה נִֽאֲצ֛וּ אֶת קְד֥וֹשׁ יִשְׂרָאֵ֖ל נָזֹ֥רוּ אָחֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/004.yaml
  text: Ah[a], sinful nation, a people heavy with iniquity, offspring of evildoers[b], children who act corruptly! They have forsaken Yahweh; they have despised the Holy One of Israel[e][d][c]; they have turned backward.
translation:
  language: zh_hans
  text: 唉[a]，犯罪的国民，罪孽深重的百姓，作恶者的后代，行事败坏的儿女！他们离弃了雅威[b]，藐视以色列的圣者；他们转身退后了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“祸哉”或“可悲啊”。希伯来语感叹词既可表达哀叹，也可表达谴责。
    reason: lexical_alternative
  - marker: b
    text: “雅威”音译希伯来语神名יהוה（YHWH）；传统上也译作“耶和华”或以“主”代称。
    reason: alternative_reading
  - marker: c
    text: 或译：“他们与他疏远，退到后面。”原文动词可含疏远、离开或退避之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 唉
  rationale: 这个感叹词兼有哀叹与谴责的语气。“唉”保留感叹和悲痛色彩，又不把它完全限定为灾祸宣告；其他可能译法列于脚注。
- source_word: גּוֹי חֹטֵא
  choice: 犯罪的国民
  rationale: חֹטֵא在这里作形容性分词，刻画整个国民持续处于犯罪之中；“犯罪的国民”保留集体指控，也符合现代汉语。
- source_word: עַם כֶּבֶד עָוֺן
  choice: 罪孽深重的百姓
  rationale: כֶּבֶד本义为“沉重”，与עָוֺן构成被罪孽压重的意象；“罪孽深重”以自然汉语传达其分量和道德责任。
- source_word: עָוֺן
  choice: 罪孽
  rationale: 该词可兼指恶行及其所带来的罪责；“罪孽”比单纯的“罪疚感”更能保留这种道德与神学分量。
- source_word: זֶרַע מְרֵעִים
  choice: 作恶者的后代
  rationale: זֶרַע是集合性的“后裔、后代”；此译保留家族性、群体性的控诉，又避免“种子”的生硬直译。
- source_word: בָּנִים מַשְׁחִיתִים
  choice: 行事败坏的儿女
  rationale: 使役式分词מַשְׁחִיתִים在此可描述败坏、腐化的行为，也可能带有造成毁坏的意味；正文采用较符合伦理语境的“行事败坏”，不把他们说成只是被败坏的人。
- source_word: עָזְבוּ אֶת־יְהוָה
  choice: 他们离弃了雅威
  rationale: עָזַב表达离弃、抛弃；“离弃”适合先知书中的盟约控诉。יְהוָה按其专名音译为“雅威”。
- source_word: נִאֲצוּ
  choice: 藐视
  rationale: 该动词表达带着轻蔑的拒绝；“藐视”简洁而有力度。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 这是《以赛亚书》中具有代表性的神圣称号；直译可保留其独特性及神学意义。
- source_word: נָזֹרוּ אָחוֹר
  choice: 他们转身退后了
  rationale: נָזֹרוּ可表达疏远、离开或退避，אָחוֹר增添“向后”的方向；“转身退后”以自然汉语保留背离和后退的图像，并在脚注注明另一种理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”，把它作为以色列之神的专名呈现，而非以称号替代；脚注说明其原文形式。
- issue: 群体与家族性控诉的层叠
  choice: 同时保留“国民、百姓”和“后代、儿女”
  alternative: 统一改写为单一的政治群体称谓或血缘称谓
  rationale: 原文刻意叠加国家、百姓、后代和儿女等意象，以强化以色列身份与背叛之间的张力；保留各层次可避免削弱控诉。
- issue: נָזֹרוּ אָחוֹר中背离与后退的张力
  choice: 正文译作“转身退后了”，脚注保留“疏远、退到后面”的可能
  alternative: 他们与他疏远，退到后面
  rationale: 该短语既可能着重方向性的后退，也可能着重关系上的疏远。正文保留鲜明动作图像，脚注避免排除关系性含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前半节保留希伯来诗句连续叠加称谓的节奏，后半节用短句呈现三重控诉。正文避免生硬直译“沉重于罪孽”，改用自然的“罪孽深重”，同时通过脚注保存结尾短语的词义张力。
