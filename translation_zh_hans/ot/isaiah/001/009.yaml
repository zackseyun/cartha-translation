source:
  edition: WLC
  text: לוּלֵי֙ יְהוָ֣ה צְבָא֔וֹת הוֹתִ֥יר לָ֛/נוּ שָׂרִ֖יד כִּ/מְעָ֑ט כִּ/סְדֹ֣ם הָיִ֔ינוּ לַ/עֲמֹרָ֖ה דָּמִֽינוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/009.yaml
  text: If Yahweh of hosts had not left us a very small remnant[a], we would have become like Sodom; we would have resembled Gomorrah.
translation:
  language: zh_hans
  text: 若不是万军之耶和华为我们留下少数余民，我们早已像所多玛，也如蛾摩拉一般。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לוּלֵי
  choice: 若不是……早已
  rationale: 该词引出与过去事实相反的条件；“若不是……早已”自然表达反事实关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名最通行且庄重的音译，以区别于作为称号的“主”。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: “万军之耶和华”是中文中成熟、可懂的称号，也保留了希伯来语所指众军或天军的宽广含义。
- source_word: הוֹתִיר
  choice: 留给我们
  rationale: 使役词形在此表示使某些人存留下来；“留给我们”简洁呈现保留之意。
- source_word: שָׂרִיד
  choice: 余民
  rationale: 该单数名词在此具有集合意义；“余民”既表达灾后剩下的人，也保留先知书中的关键词联系。
- source_word: כִּמְעָט
  choice: 一点
  rationale: 该表达可表示极少的数量；与“余民”搭配时，“一点余民”自然体现人数很少。
- source_word: כִּסְדֹם
  choice: 像所多玛
  rationale: 前缀 כ 表示比较，以“像”自然传达。
- source_word: הָיִינוּ
  choice: 早已像
  rationale: 在反事实结果句中译作“早已像”，自然表达本会落到与所多玛相同的境地；中文无需机械补出系词。
- source_word: לַעֲמֹרָה
  choice: 蛾摩拉
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: דָּמִינוּ
  choice: 仿佛
  rationale: 原动词意为相像、相似；“仿佛”与前句“像”形成同义而不完全重复的平行表达。
theological_decisions:
- issue: 神名与称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 雅威——万军之主；万军的耶和华
  rationale: “耶和华”保留专名性质，“万军之”保留称号的广度；这一固定表达庄重而为普通中文读者熟悉。
- issue: שָׂרִיד 的余民意象
  choice: 余民
  alternative: 少数幸存者；剩下的人
  rationale: “余民”直接表达存留下来的群体，并保留以赛亚书中的文学和神学意象，但不进一步说明其身份或得救性质。
- issue: 所多玛与蛾摩拉的反事实比较
  choice: 我们早已像所多玛，仿佛蛾摩拉
  alternative: 我们就成了所多玛，如同蛾摩拉
  rationale: 原文说的是以色列群体若无保留便会与二城相像；译文保留比较关系，不擅自限定相似之处究竟是毁灭、罪恶还是二者兼有。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“若不是……早已”清楚呈现反事实条件；两分句以“像／仿佛”保留希伯来诗句的同义平行。神名采用中文通行形式“耶和华”，称号译为“万军之耶和华”。
