    reason: שָׂרִיד虽为单数形式，却用作集合名词；可译为“幸存者”。“留下”也可按其使役意义译为“保留”。
  revision_rationale: 修订仅改善汉语搭配和句法明确度：“少数余民”对应“极少的余民”，“为我们留下”避免“留给我们”的歧义；末句以“也如……一般”使比较平行自然。保留反事实结构、神名、称号、余民术语及原文未明确的比较范围。
