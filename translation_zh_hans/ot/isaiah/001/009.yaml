revisions:
- from: 若不是万军之耶和华给我们留下一点余民[a]，我们早已像所多玛，仿佛蛾摩拉。
  to: 若不是万军之耶和华为我们留下少数余民，我们早已像所多玛，也如蛾摩拉一般。
  rationale: 修订仅改善汉语搭配和句法明确度：“少数余民”对应“极少的余民”，“为我们留下”避免“留给我们”的歧义；末句以“也如……一般”使比较平行自然。保留反事实结构、神名、称号、余民术语及原文未明确的比较范围。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:59:51Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确呈现了לוּלֵי引出的反事实条件、神名与“万军”称号、余民的存留，以及所多玛和蛾摩拉的双重比较。原稿“给我们留下”可被理解为把余民留给我们，而希伯来文此处主要指为我们／使我们得以存留；调整后更明确。
  naturalness: “一点余民”在现代标准普通话中稍显生硬，且“我们早已像所多玛，仿佛蛾摩拉”第二个比较分句缺少明确的谓语支撑。改为“少数余民”及“也如……一般”，语义清晰、庄重自然，并保留诗歌平行。
  terminology: “万军之耶和华”“余民”“所多玛”“蛾摩拉”均适切且与中文圣经常用术语一致。“少数余民”保留שָׂרִיד的集合性和先知书的余民措辞，不把其神学含义扩展为特定教义。
  issues:
  - severity: low
    issue: “一点余民”搭配不够自然。
    rationale: כִּמְעָט修饰集合性的“余民”，用“少数余民”更符合现代汉语对人的数量表达，同时保留“极少”的含义。
  - severity: low
    issue: “仿佛蛾摩拉”在句中谓语关系较弱。
    rationale: 补作“也如蛾摩拉一般”使第二个比较分句完整自然，仍保持与前半句同义平行，而不擅自具体化相似之处。
  - severity: low
    issue: “给我们留下”可能误解为受益人领受余民。
    rationale: “为我们留下”更贴近此处“使我们仍有存留者”的语境，且不改变原文的简洁性。
  revised_text: 若不是万军之耶和华为我们留下少数余民，我们早已像所多玛，也如蛾摩拉一般。
  revised_footnotes:
