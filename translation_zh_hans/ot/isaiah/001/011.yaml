id: ISA.1.11
reference: Isaiah 1:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/מָּה לִּ֤/י רֹב זִבְחֵי/כֶם֙ יֹאמַ֣ר יְהוָ֔ה שָׂבַ֛עְתִּי עֹל֥וֹת אֵילִ֖ים וְ/חֵ֣לֶב מְרִיאִ֑ים וְ/דַ֨ם פָּרִ֧ים וּ/כְבָשִׂ֛ים וְ/עַתּוּדִ֖ים לֹ֥א חָפָֽצְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/011.yaml
  text: Why are your many sacrifices to me? says Yahweh[a]. I have had enough of burnt offerings of rams and the fat of fattened animals[b]; and in the blood of bulls and lambs and goats I do not delight.
translation:
  language: zh_hans
  text: 雅威说：“你们献这么多祭给我，有什么用呢？[a]我已经厌烦了公羊的燔祭和肥畜的脂油；至于公牛、羊羔和公山羊的血，我并不喜悦。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于：“你们众多的祭物，对我为什么？”这是一个简略的反问，意为“你们献这么多祭给我，有什么用呢？”
    reason: 说明 לָמָּה לִּי 的字面结构及其在上下文中的反问作用，不把“对我”限定为“给我”。
  - marker: b
    text: “公山羊”所译的希伯来词特指雄性的山羊。
    reason: 说明 עַתּוּדִים 的性别含义。
lexical_decisions:
- source_word: לָמָּה לִּי
  choice: 给我，有什么用呢？
  rationale: 该短语直译近于“为什么给我”，在语境中是反问这些祭物对耶和华有何价值；此译自然地保留反问语气，并以脚注说明较直译的可能。
- source_word: רֹב זִבְחֵיכֶם
  choice: 你们献这么多祭
  rationale: רֹב 强调数量众多，זִבְחֵיכֶם 指你们的祭牲或祭物；此译符合现代汉语，同时保留数量重点。
- source_word: יֹאמַר יְהוָה
  choice: 耶和华说
  rationale: 采用自然的先行引语公式；将神名 יְהוָה 译作中文通行专名“耶和华”。
- source_word: שָׂבַעְתִּי
  choice: 我已经厌足
  rationale: 原词表示饱足、饱到过量；“厌足”兼顾饱足与厌倦排斥的语气，比单纯“够了”更贴近祭物意象。
- source_word: עֹלוֹת אֵילִים
  choice: 公羊的燔祭
  rationale: עֹלוֹת 是全牲焚烧献上的燔祭，אֵילִים 是公羊；采用通行而准确的祭祀术语。
- source_word: חֵלֶב מְרִיאִים
  choice: 肥畜的脂油
  rationale: חֵלֶב 指祭牲脂油，מְרִיאִים 指养肥的牲畜；“肥畜的脂油”简洁且保留原文具体意象。
- source_word: דַם פָּרִים וּכְבָשִׂים וְעַתּוּדִים
  choice: 公牛、羊羔和公山羊的血
  rationale: 准确呈现三类祭牲；עַתּוּדִים 特指公山羊，כְבָשִׂים 在此祭祀语境中可自然译作羊羔。
- source_word: לֹא חָפָצְתִּי
  choice: 我并不喜悦
  rationale: חפץ 可表达喜爱、乐意或渴望；“并不喜悦”保留神对这些祭礼不悦的评价，而不扩大为绝对禁止献祭。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经语境中最易识别的专名形式；不以“主”替代神名，也以脚注意识之外不加入特定宗派解释。
- issue: 神不喜悦祭牲之血的范围
  choice: 按本节语境译为对这些献祭者所献祭物的拒绝
  alternative: 理解为神在任何情况下都否定祭祀制度
  rationale: 上下文谴责的是与悖逆生活并存的宗教礼仪；正文保留原句张力，不擅自加入“虚假”“无诚意”等解释，也不将其普遍化为废除一切祭祀。
- issue: שָׂבַעְתִּי 的情感强度
  choice: 厌足
  alternative: 饱足／受够了
  rationale: 原文兼具饱足和过量意味；“厌足”能传达强烈拒斥，又不把情绪进一步口语化为“受够了”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“燔祭”“脂油”保留必要的圣经祭祀术语；“有什么用呢”使希伯来语反问在现代汉语中清楚有力。引语范围涵盖整节神谕，标点依中文规范处理。
