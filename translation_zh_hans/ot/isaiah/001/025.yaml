  text: וְ/אָשִׁ֤יבָה יָדִ/י֙ עָלַ֔יִ/ךְ וְ/אֶצְרֹ֥ף כַּ/בֹּ֖ר סִיגָ֑יִ/ךְ וְ/אָסִ֖ירָה כָּל בְּדִילָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/025.yaml
  text: I will turn my hand against you[a], and I will smelt away your dross as with lye[c][b], and remove all your alloy.
translation:
  language: zh_hans
  text: 我要伸手攻击你，像用碱液那样炼净你的渣滓，除去你一切掺杂的金属。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָשִׁיבָה יָדִי עָלַיִךְ
  choice: 我要把手转向你
  rationale: 保留“把手转向某人”这一拟人化的希伯来语表达，不将其完全改写为“惩罚”或“拯救”；介词 עַל 在此既可带有敌对意味，也可表示施行干预。
- source_word: וְאֶצְרֹף
  choice: 炼除
  rationale: צרף 属于金属熔炼、精炼的语域；“炼除”既保留冶炼意象，也自然表达杂质在过程中被除去。
- source_word: כַּבֹּר
  choice: 像用碱一样
  rationale: בֹּר 指用于清洗或处理材料的碱性物质；比较前缀 כְּ 译作“像……一样”，不抹去原文略显交叠的清洗与冶炼意象。
- source_word: סִיגָיִךְ
  choice: 你的渣滓
  rationale: סִיגִים 指金属冶炼产生或分离出的渣滓；“渣滓”保留先知话语中的冶炼比喻。
- source_word: וְאָסִירָה
  choice: 除掉
  rationale: סור 的使役式在此表示移除；“除掉”与前句的净炼行动衔接自然。
- source_word: כָּל בְּדִילָיִךְ
  choice: 你一切的杂质金属
  rationale: בְּדִיל 可特指锡，也可在冶炼语境中指掺入贵金属的低质金属；正文采用较宽泛的“杂质金属”，并以脚注保留具体词义的可能性。
theological_decisions:
- issue: 上帝行动的性质
  choice: 保留审判与洁净并存的张力
  alternative: 只译成毁灭性的惩罚，或只译成温和的恢复
  rationale: “把手转向你”可含敌对或介入之意，而炼除渣滓的意象同时表明严厉的审判具有洁净作用；译文不把其中任何一面消解掉。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“把手转向你”刻意保留原文拟人化习语及其方向上的含混；“炼除、渣滓、杂质金属”构成连贯的冶炼语域，同时以脚注说明“碱”带来的清洗意象和“锡”的具体词义可能。
