revisions:
- from: 我要把手转向你[a]，像用碱[b]一样炼除你的渣滓，除掉你一切的杂质金属[c]。
  to: 我要伸手攻击你，像用碱液那样炼净你的渣滓，除去你一切掺杂的金属。
  rationale: 修改仅处理两处影响可读性和语义方向的措辞：以“伸手攻击”自然表达审判性手势，以“掺杂的金属”替代生硬的“杂质金属”。正文仍保留“手”、碱性处理、炼净、渣滓及除去掺杂金属等原文意象；脚注保留“加在你身上”、碱液的词义范围以及“锡”的可能释义。
