  text: אֵיכָה֙ הָיְתָ֣ה לְ/זוֹנָ֔ה קִרְיָ֖ה נֶאֱמָנָ֑ה מְלֵאֲתִ֣י מִשְׁפָּ֗ט צֶ֛דֶק יָלִ֥ין בָּ֖/הּ וְ/עַתָּ֥ה מְרַצְּחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/021.yaml
  text: How the faithful city has become a prostitute! She was full of justice[a]; righteousness lodged in her[c][b], but now murderers.
translation:
  language: zh_hans
  text: 唉，忠信之城怎么竟成了妓女！她从前充满公正，正义曾在其中留宿[a]；如今却有凶手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留宿”原文可指住宿或过夜；这里把正义描写成曾住在城中。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: 唉，……竟
  rationale: 这是对惊人逆转的哀叹，而非询问信息；“唉”配合“竟”自然传达希伯来语的感叹与悲痛。
- source_word: הָיְתָה לְזוֹנָה
  choice: 竟成了妓女
  rationale: 保留状态转变及原文尖锐的性隐喻；“妓女”是现代汉语清楚、不过度古雅的对应词。
- source_word: קִרְיָה נֶאֱמָנָה
  choice: 忠信之城
  rationale: נֶאֱמָנָה兼有忠诚、可靠之意；“忠信”既简洁庄重，也保留道德与关系层面的含义。
- source_word: מְלֵאֲתִי מִשְׁפָּט
  choice: 她从前充满公正
  rationale: מִשְׁפָּט在此指社会和司法秩序中的公平正直；补出“她从前”延续城市的女性人格化，并明确今昔对照。
- source_word: צֶדֶק
  choice: 正义
  rationale: 此词可含公义、正直、公正等义；译作“正义”既与前面的“公正”有所区分，也保留两词语义上的重叠。
- source_word: יָלִין בָּהּ
  choice: 曾寄居其中
  rationale: 动词本义涉及留宿、过夜；“寄居”保留拟人化的鲜明意象，避免将其平化为单纯“存在”。
- source_word: וְעַתָּה מְרַצְּחִים
  choice: 如今却尽是凶手
  rationale: “却”表现强烈反差；原文省略谓语，汉语用“尽是”自然补足，同时保持末句短促有力。
theological_decisions:
- issue: 以性隐喻描写耶路撒冷的背信与腐败
  choice: 明确保留“竟成了妓女”
  alternative: 成了不忠之城／变得像妓女一样
  rationale: 原文直接使用“妓女”这一强烈隐喻；抽象化为“不忠”或加入“像”都会减弱先知责难的力度。译文不进一步限定为某一特定教义解释。
- issue: מִשְׁפָּט与צֶדֶק的关系
  choice: 分别译为“公正”与“正义”
  alternative: 分别译为“公平”与“公义”，或两者都按“公正”理解
  rationale: 两个词在此平行且语义重叠，但并非完全同义；采用相近而不同的中文词，既保留诗性平行，也不人为制造严格的神学区分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“唉……竟”呈现哀歌式惊叹；“妓女”保留原文冲击力而不使用古雅或粗俗称谓。末句以“如今却尽是凶手”形成简洁有力的今昔反转。
