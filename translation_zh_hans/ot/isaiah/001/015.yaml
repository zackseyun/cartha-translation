source:
  edition: WLC
  text: וּ/בְ/פָרִשְׂ/כֶ֣ם כַּפֵּי/כֶ֗ם אַעְלִ֤ים עֵינַ/י֙ מִ/כֶּ֔ם גַּ֛ם כִּֽי תַרְבּ֥וּ תְפִלָּ֖ה אֵינֶ֣/נִּי שֹׁמֵ֑עַ יְדֵי/כֶ֖ם דָּמִ֥ים מָלֵֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/015.yaml
  text: And when you spread out your palms[a], I hide my eyes from you; even though you multiply prayers, I am not listening[c][b]. Your hands are full of blood.
translation:
  language: zh_hans
  text: 你们伸开双掌[a]的时候，我就遮掩我的眼目，不看你们；即使你们多多祷告，我也不听[b]。你们的手沾满了血[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们的手”。希伯来文特指“手掌”，让人想到祷告时伸手或举手的姿势。
    reason: lexical_alternative
  - marker: b
    text: 也可译“我不垂听”或“我不会听”。原文可表达持续或确定的拒绝。
    reason: lexical_alternative
  - marker: c
    text: “血”也可理解为“流血之罪”或“血债”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְפָרִשְׂכֶם
  choice: 你们伸开……的时候
  rationale: 介词 בְּ 加不定词构造在此表示时间；“伸开”自然传达祷告时张开或举起双手的动作。
- source_word: כַּפֵּיכֶם
  choice: 你们的双掌
  rationale: כַּף 特指手掌，与后文普通的“手”（יָד）有意区分，也保留祷告姿势的具体画面。
- source_word: אַעְלִים עֵינַי מִכֶּם
  choice: 我必向你们掩眼
  rationale: 保留希伯来文拟人化意象，表达上帝刻意不看、不悦纳；未将其抽象化为“忽视”。
- source_word: גַּם כִּי
  choice: 即使
  rationale: 该组合在此引出让步关系：纵然祷告增多，上帝仍拒绝垂听。
- source_word: תַרְבּוּ תְפִלָּה
  choice: 你们多多祷告
  rationale: רבה 的使役形与单数集合名词 תְּפִלָּה 表示使祷告增多，即大量、反复祷告；现代汉语以“多多祷告”简洁传达。
- source_word: אֵינֶנִּי שֹׁמֵעַ
  choice: 我也不听
  rationale: 否定词配分词表达持续或确定的拒绝；“不听”既保留“听”的原始意象，也可自然表达不垂听、不接受。
- source_word: יְדֵיכֶם
  choice: 你们的手
  rationale: 此处使用普通的“手”一词，保留它与前文“手掌”的词汇转换，并把祷告姿态转向行为责任。
- source_word: דָּמִים מָלֵאוּ
  choice: 沾满了血
  rationale: דָּמִים 可指血、流血或血债；“沾满了血”在汉语中有力且自然，同时不把具体含义限定为某一种解释。
theological_decisions:
- issue: 上帝拒绝虚假敬拜的拟人化表达
  choice: 保留“向你们掩眼”和“我也不听”的具体身体意象
  alternative: 译为“我不理会你们”或“我拒绝关注你们”
  rationale: 原文以眼和听觉的意象表达上帝对沾染流血罪行之敬拜的拒绝；保留这些意象可维持先知谴责的力度，而不额外加入教义解释。
- issue: דָּמִים 的道德与法律含义
  choice: 正文译作“血”，脚注列出“流血之罪／血债”的可能含义
  alternative: 正文直接译作“流血的罪”或“血债”
  rationale: 原文复数形式的语义范围包括实际的血、流血行为及由此产生的罪责；正文保留具体意象，避免过早消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“双掌”保留祷告姿势的具体画面，“掩眼”保持先知诗歌的凝练与拟人化力度；“沾满了血”符合自然汉语，并保留 דָּמִים 的多义性。所有脚注标记均已置于正文对应位置。
