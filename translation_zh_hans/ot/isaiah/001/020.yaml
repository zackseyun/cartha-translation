  text: וְ/אִם תְּמָאֲנ֖וּ וּ/מְרִיתֶ֑ם חֶ֣רֶב תְּאֻכְּל֔וּ כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/020.yaml
  text: But if you refuse and rebel[a], you will be devoured by the sword; for the mouth of Yahweh has spoken.
translation:
  language: zh_hans
  text: 但如果你们不肯，又悖逆，就必被刀剑吞吃[a]；因为雅威亲口说了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“被刀剑吃掉”。这与上一节顺从的人“吃地上的美物”形成刻意的对照。
    reason: 说明原文意象及跨节文字呼应。
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上一节顺服所得福分，并引出相反条件；“但如果”自然表达转折和条件。
- source_word: תְּמָאֲנוּ
  choice: 你们不肯
  rationale: 表达 מאן 的不愿、拒绝之意；“不肯”简洁有力，也能与下一动词顺畅衔接。
- source_word: וּמְרִיתֶם
  choice: 反而悖逆
  rationale: מרה 表示抗命、背叛；“悖逆”保留其严肃的盟约语境，“反而”凸显与顺服相对。
- source_word: חֶרֶב תְּאֻכְּלוּ
  choice: 就必被刀剑吞吃
  rationale: 按希伯来语保留“刀剑吃人”的拟人意象，并维持与上一节“吃地上的美物”之间刻意形成的反转。
- source_word: כִּי
  choice: 因为
  rationale: 引出警告必然实现的根据，即雅威亲自宣告。
- source_word: פִּי יְהוָה דִּבֵּר
  choice: 这是雅威亲口说的
  rationale: 以自然现代汉语保留“雅威的口说了”的强调作用，突出话语来自雅威本人及其确定权威。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，区别于称号“主”，保留原文的专名性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质，不以称号代替。
- issue: 刀剑“吞吃”的表达
  choice: 保留拟人化的“被刀剑吞吃”
  alternative: 死在刀剑之下；被刀剑消灭
  rationale: 直译保留原文与上一节“吃地上的美物”的词语反转，同时不把审判的具体方式过度解释为战争或处决。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“不肯，反而悖逆”有警告语气；“被刀剑吞吃”有意保留先知诗语的强烈意象；“亲口说的”使希伯来语表达在现代汉语中自然可懂。
