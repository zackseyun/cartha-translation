source:
  edition: WLC
  text: לְכוּ נָ֛א וְ/נִוָּֽכְחָ֖ה יֹאמַ֣ר יְהוָ֑ה אִם יִֽהְי֨וּ חֲטָאֵי/כֶ֤ם כַּ/שָּׁנִים֙ כַּ/שֶּׁ֣לֶג יַלְבִּ֔ינוּ אִם יַאְדִּ֥ימוּ כַ/תּוֹלָ֖ע כַּ/צֶּ֥מֶר יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/018.yaml
  text: 'Come now[a], and let us reason together, says Yahweh: though your sins are like scarlet, they will become white like snow; though they are red like crimson[b], they will become like wool.'
translation:
  language: zh_hans
  text: 雅威说：“来吧，让我们来辩论[a]：你们的罪虽像朱红，必变白如雪；虽红如绯红[b]，必变得像羊毛。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “让我们来辩论”也可译作“让我们来理论”“让我们把事情辩个明白”或“让我们一同争辩”。希伯来语动词兼有对话、争讼和裁断案件的意味。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译可作“如虫”或“如虫红”；该词与用昆虫制成的绯红色染料有关，因此也可译作“如朱红染料”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ נָא
  choice: 来吧
  rationale: לְכוּ在这里是带有召唤意味的命令式，נָא使语气带有敦促或邀请色彩；“来吧”在现代汉语中简洁自然。
- source_word: וְנִוָּכְחָה
  choice: 让我们彼此辩明
  rationale: יכח的这个形式兼有对话、争辩与司法裁断的意味；“彼此辩明”既保留共同面对案件的色彩，也不把含义缩窄为纯理性讨论。
- source_word: יֹאמַר יְהוָה
  choice: 雅威说
  rationale: 按希伯来文直接保留四字神名，以“雅威”音译；预言宣告公式在汉语中自然表达为“雅威说”。
- source_word: אִם יִהְיוּ חֲטָאֵיכֶם
  choice: 你们的罪虽像
  rationale: 两个אִם分句在诗歌平行结构中具有让步意味，译作“虽”比单纯的“如果”更符合此处的修辞力量。
- source_word: כַּשָּׁנִים
  choice: 像朱红
  rationale: שָׁנִים指鲜明的朱红色或朱红染料；“朱红”简洁，并与“雪”形成鲜明的颜色对照。
- source_word: כַּשֶּׁלֶג יַלְבִּינוּ
  choice: 必变白如雪
  rationale: לבן的使役形式在此表达变白的结果；“必变白如雪”保留转变与将来结果的语气。
- source_word: אִם יַאְדִּימוּ
  choice: 虽红
  rationale: 该形式在此描写呈红色的状态，与上一让步分句平行；简洁译为“虽红”。
- source_word: כַּתּוֹלָע
  choice: 如胭脂虫染料
  rationale: תּוֹלָע本指与绯红染料相关的虫，继而借指这种染料或颜色；正文采用具体但可懂的表达，并用脚注保留语义说明。
- source_word: כַּצֶּמֶר יִהְיוּ
  choice: 必变得像羊毛
  rationale: 保留原文只说“像羊毛”而未再次明说“白”的形式；洁白之意由与上一分句的平行关系自然传达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文以“雅威”音译，明确保留其作为立约之神专名的性质，而不以称号替代。
- issue: 罪变白的语气
  choice: 必变白／必变得
  alternative: 可以变白／可以变得
  rationale: 原文未明说行动主体，且动词形式表达结果；译文保留确定的转变陈述，不额外规定是神使其洁白还是罪本身在修辞上被描述为变白。
- issue: אִם的条件或让步含义
  choice: 虽
  alternative: 如果／即使
  rationale: 上下平行句在此可理解为让步陈述；采用“虽”传达诗句的修辞对照，同时不添加关于悔改条件的宗派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“来吧”传达先知性召唤，以“彼此辩明”保留法庭与对话双重色彩；两个“虽……必……”形成清晰的诗歌平行。正文避免古奥的“尔等”等词，也不补入原文未明说的悔改条件或赦罪机制。
