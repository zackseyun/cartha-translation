  text: חָדְשֵׁי/כֶ֤ם וּ/מוֹעֲדֵי/כֶם֙ שָׂנְאָ֣ה נַפְשִׁ֔/י הָי֥וּ עָלַ֖/י לָ/טֹ֑רַח נִלְאֵ֖יתִי נְשֹֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/014.yaml
  text: Your new moons and your appointed feasts my soul hates[a]; they have become a burden to me; I am weary of bearing them.
translation:
  language: zh_hans
  text: 你们的月朔和节期，我心里厌恶；它们成了我的重担，我已经厌倦承受它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָדְשֵׁיכֶם
  choice: 你们的初一
  rationale: חֹדֶשׁ本指新月，并可指每月新月时的宗教礼仪。现代汉语圣经语境中“初一”自然地表达月朔及其节期含义，同时保留原文“你们的”所带出的疏离感。
- source_word: וּמוֹעֲדֵיכֶם
  choice: 和节期
  rationale: מוֹעֵד可指指定的时间、聚会或节庆；此处与“初一”并列，指固定的宗教节期。“节期”简洁自然，也不额外限定具体类别。
- source_word: שָׂנְאָה נַפְשִׁי
  choice: 我心里厌恶
  rationale: 原文直译为“我的נֶפֶשׁ厌恶”。“我心里厌恶”既保留强烈而切身的憎恶语气，又比“我的灵魂厌恶”更符合现代汉语表达。
- source_word: הָיוּ עָלַי לָטֹרַח
  choice: 它们成了我的重担
  rationale: הָיוּ表达形成或进入某种状态；טֹרַח是负担、劳苦或麻烦。“成了我的重担”保留结果状态，也与下句“担当”的承载意象衔接。
- source_word: נִלְאֵיתִי נְשֹׂא
  choice: 我已厌倦担当
  rationale: נִלְאֵיתִי表示已经疲乏、厌倦；נְשֹׂא源于“承担、背负”。“我已厌倦担当”保留完成状态和负重隐喻；所担当的对象由上文自然补足。
theological_decisions:
- issue: 上帝对以色列宗教礼仪的厌恶
  choice: 保留“你们的”这一归属表达，将责备指向这些礼仪在当前处境中的实际样态，同时不在译文中添加“虚伪”等解释性词语。
  alternative: 把本节明确译成上帝厌恶“虚伪的”节期，或反过来理解为上帝否定这些节期本身。
  rationale: 原文本身强烈宣告厌恶，却没有在本句中明说“虚伪”；上下文说明问题在于礼仪与罪恶并存。译文应保留张力，既不削弱斥责，也不把上下文解释直接写进正文。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“初一”用于月朔礼仪，“节期”用于固定宗教节庆；后半句以“重担—担当”再现希伯来文连续的负重意象。
