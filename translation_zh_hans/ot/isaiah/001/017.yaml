  text: לִמְד֥וּ הֵיטֵ֛ב דִּרְשׁ֥וּ מִשְׁפָּ֖ט אַשְּׁר֣וּ חָמ֑וֹץ שִׁפְט֣וּ יָת֔וֹם רִ֖יבוּ אַלְמָנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/017.yaml
  text: Learn to do good; seek justice[a], correct the oppressor; judge for the fatherless, plead for the widow.
translation:
  language: zh_hans
  text: 要学习行善，寻求公正；纠正欺压者[a]，为孤儿主持公道，为寡妇申辩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“帮助受欺压的人”或“使受欺压的人得到公正”。这句希伯来语含义难以确定，其中“חָמוֹץ”一词可有不同理解。
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְדוּ
  choice: 要学习
  rationale: 这是复数命令式，要求听众学习并养成相应的实践；“要学习”保留了直接劝诫的语气。
- source_word: הֵיטֵב
  choice: 行善
  rationale: 该词本义为“好好地”或“做得好”；在本节伦理劝诫的语境中，“行善”自然地表达了原文隐含的道德对象。
- source_word: דִּרְשׁוּ
  choice: 寻求
  rationale: 该动词可表示寻找、探求或追求；“寻求”既保留原文的广度，也体现主动追求的含义。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 在先知书的社会和司法语境中，该词指公平正直的秩序与裁断；“公正”适合现代汉语，也与下文为弱势者主持公道相呼应。
- source_word: אַשְּׁרוּ
  choice: 纠正
  rationale: 该词在此可能有“使正直、使归正、纠正”之意；“纠正”简洁地保留了使错误状况归正的命令。
- source_word: חָמוֹץ
  choice: 欺压者
  rationale: 此词含义有争议，既可能按主动意义指“欺压者”，也可能按被动意义指“受欺压的人”。正文采用主动理解，另一种可能在脚注中保留。
- source_word: שִׁפְטוּ יָתוֹם
  choice: 为孤儿主持公道
  rationale: 原文具有司法裁断的意味，并以孤儿为受益者；“主持公道”比直译“审判孤儿”更准确地传达在法律上维护其权益的含义。
- source_word: רִיבוּ אַלְמָנָה
  choice: 为寡妇申辩
  rationale: ריב在这里带有诉讼、争辩和代为出头的法律色彩；“为……申辩”自然保留了司法倡护的含义。
theological_decisions:
- issue: 短语 אַשְּׁרוּ חָמוֹץ 的理解
  choice: 纠正欺压者
  alternative: 帮助受欺压的人；使受欺压的人得到公正
  rationale: 希伯来语短语在词形和语义上均有争议。正文依主动意义理解 חָמוֹץ，并将 אַשְּׁרוּ 理解为“使归正、纠正”；同时用脚注保留常见且合理的被动理解，以免消除原文真实存在的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公正”“主持公道”“申辩”共同保留本节的社会伦理与司法语域；句式简洁有力，体现一连串命令的修辞节奏。
