base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/016.yaml
  text: Wash yourselves[a]; make yourselves clean. Remove the evil of your deeds from before my eyes[b]. Stop doing evil.
translation:
  language: zh_hans
  text: 你们要洗涤自己[a]，使自己洁净；要从我眼前除掉你们行为中的恶[b]，停止作恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“洁净自己。”这里“洗涤自己”用于道德洁净的劝诫。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“从我眼睛面前。”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחֲצוּ
  choice: 洗净自己
  rationale: 该词是复数命令式，字面为“洗”，在本段中带有针对自身的道德洁净意味。“洗净自己”既保留洗涤意象，也符合现代汉语表达。
- source_word: הִזַּכּוּ
  choice: 使自己洁净
  rationale: 该反身词形表达使自己成为洁净或显为洁净；此译保留反身语气，并与前句形成递进而不将其限定为礼仪术语。
- source_word: הָסִירוּ
  choice: 除掉
  rationale: 使役命令式，意为移走、除去；“除掉”简洁有力，适合连续的劝诫命令。
- source_word: רֹעַ מַעַלְלֵיכֶם
  choice: 你们行为中的恶
  rationale: רֹעַ 指恶、邪恶，מַעַלְלֵיכֶם 指你们的行为或所作所为；此译自然地表达恶存在于他们的行为之中，同时不缩减为某一种具体罪行。
- source_word: מִנֶּגֶד עֵינָי
  choice: 从我眼前
  rationale: 紧贴希伯来语“从我眼睛面前”的空间意象，保留上帝以第一人称发出的直接谴责。
- source_word: חִדְלוּ הָרֵעַ
  choice: 停止作恶
  rationale: חִדְלוּ 是“停止”的复数命令式，הָרֵעַ 在此表示行恶；“停止作恶”是准确、自然且有力度的现代汉语。
theological_decisions:
- issue: 洗涤与洁净的性质
  choice: 保留“洗净自己、使自己洁净”的道德洁净意象
  alternative: 译作较具礼仪色彩的“洁除自己”或把它明确解释为某种仪式
  rationale: 上下文针对犹大的恶行并呼吁悔改和行为更新；原文使用洁净隐喻，却没有在本节明确指定圣礼或特定洁净仪式，因此不作宗派性或礼仪性限定。
- issue: “从我眼前”是否意指能够向上帝隐藏罪恶
  choice: 保留原文拟人化空间表达，不加解释
  alternative: 意译为“不要再让我看见”或解释为“使罪不被上帝察看”
  rationale: 原文命令他们除掉恶行，并以“从我眼前”强化上帝对这些行为的厌恶；直译保留张力，避免引入罪恶可向上帝隐藏的推论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以连续命令句呈现先知劝诫的力度。“洗净自己”与“使自己洁净”保留原文近义并列；“作恶”使用常见书面表达。所有脚注标记均已置于正文对应位置。
