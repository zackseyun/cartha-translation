id: ISA.1.5
reference: Isaiah 1:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַ֣ל מֶ֥ה תֻכּ֛וּ ע֖וֹד תּוֹסִ֣יפוּ סָרָ֑ה כָּל רֹ֣אשׁ לָ/חֳלִ֔י וְ/כָל לֵבָ֖ב דַּוָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/005.yaml
  text: Why should you be struck again? You continue in rebellion. The whole head is sick[a], and the whole heart is faint.
translation:
  language: zh_hans
  text: 你们为什么还要受击打[a]？你们仍在悖逆。整个头都病了，整个心都衰弱了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“还要打在你们什么部位呢？”希伯来语也可理解为：既然整个身体都已患病，进一步的击打还能落在哪里？
    reason: alternative_reading
lexical_decisions:
- source_word: עַל מֶה
  choice: 为什么
  rationale: 此处通常构成表示原因的反问，译作“为什么”最符合现代汉语；同时在脚注保留与后文身体意象相呼应的部位性理解。
- source_word: תֻכּוּ
  choice: 受击打
  rationale: נכה 的 Hophal 形态表示被动的“被打、受击”；“受击打”既保留惩罚意象，也保持庄重自然。
- source_word: עוֹד
  choice: 还要
  rationale: 表达在先前受罚之后仍进一步遭受击打的意思，兼具“再次”和“继续”的语气。
- source_word: תּוֹסִיפוּ סָרָה
  choice: 仍在悖逆
  rationale: יסף 与 סרה 连用，表示继续或执意处于背离、反叛之中；“仍在悖逆”自然地传达持续性，而不把本句误作第二个问句。
- source_word: כָּל רֹאשׁ
  choice: 整个头
  rationale: 保留把百姓整体描绘为一个身体的集合性单数意象，不改译为分指个体的“每个头”。
- source_word: לָחֳלִי
  choice: 都病了
  rationale: 介词 לְ 加“疾病”在此表达患病状态；“都病了”是自然、清楚的现代汉语。
- source_word: וְכָל לֵבָב
  choice: 整个心
  rationale: 与“整个头”平行，保留同一身体意象及集合性单数。
- source_word: דַּוָּי
  choice: 都衰弱了
  rationale: 该词可指患病、虚弱、衰残；“衰弱”既保留内在崩颓的意象，又避免与上一分句重复使用“病”。
theological_decisions:
- issue: 开头反问的性质
  choice: 理解为追问继续受罚有何意义，因为百姓仍在悖逆
  alternative: 理解为询问身体还有什么部位可以再受击打
  rationale: עַל מֶה 在此更自然地表示“为什么”，而下一句陈述持续悖逆；但鉴于随后出现全身患病的意象，部位性的理解确有可能，故列入脚注。
- issue: תּוֹסִיפוּ סָרָה 是否延续问句
  choice: 译为独立陈述句“你们仍在悖逆”
  alternative: 译为“为什么还继续悖逆？”
  rationale: 希伯来文没有第二个疑问词；将其作为陈述句能保留原文的语法张力，也避免擅自增加第二重提问。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。保留“头—心”的整体身体隐喻和两个短句之间突出的断言关系；不把悖逆的性质具体化为某一宗派性的神学术语。
