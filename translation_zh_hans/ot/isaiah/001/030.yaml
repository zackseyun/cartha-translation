  text: כִּ֣י תִֽהְי֔וּ כְּ/אֵלָ֖ה נֹבֶ֣לֶת עָלֶ֑/הָ וּֽ/כְ/גַנָּ֔ה אֲשֶׁר מַ֖יִם אֵ֥ין לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/030.yaml
  text: For you will be like an oak whose leaf withers[a], and like a garden that has no water.
translation:
  language: zh_hans
  text: 因为你们必像叶子枯萎的橡树[a]，又像无水的园子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“笃耨香树”。希伯来语 אֵלָה 可指笃耨香树或橡树，确切树种不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的审判宣告，说明其结果或缘由；现代汉语用“因为”自然明确。
- source_word: תִהְיוּ
  choice: 你们必像
  rationale: היה 的未完成式第二人称阳性复数在此表达将来的审判结果；“必”兼顾未来性和宣告语气。
- source_word: כְאֵלָה
  choice: 像……橡树
  rationale: אֵלָה 可指橡树或笃耨香树（terebinth），具体树种不能确定；正文采用读者较熟悉的“橡树”，并以脚注保留另一可能。
- source_word: נֹבֶלֶת עָלֶהָ
  choice: 叶子枯萎的
  rationale: 原文为分词加单数名词及阴性单数后缀，直译为“它的叶子正在枯萎”；定语结构在汉语中自然，并保留单数集合意象。
- source_word: וּכְגַנָּה
  choice: 又像……园子
  rationale: גַּנָּה 指园子或围起来的栽培地；“园子”简洁自然，也与缺水的农艺意象相符。
- source_word: אֲשֶׁר מַיִם אֵין לָהּ
  choice: 无水的
  rationale: 原意是“它没有水”；凝练为“无水的”，完整保留匮乏的意象，并适合与前一比喻形成平行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两个“像”保留原文的平行比喻；“叶子枯萎”避免将原文单数泛化为复数。
