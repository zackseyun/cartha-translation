base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/003.yaml
  text: An ox knows its owner[a], and a donkey its master's feeding trough; Israel does not know[b]; my people do not understand.
translation:
  language: zh_hans
  text: 牛认识它的主人，驴也认得主人所用的食槽[a]；以色列却不认识[b]，我的子民并不明白。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“马槽”。
    reason: lexical_alternative
  - marker: b
    text: 这里隐含的意思是：以色列不认识耶和华；但希伯来文没有明说宾语。
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַע
  choice: 认识
  rationale: “认识”既可表达辨认，也保留关系性的“知道、认识”之意；前后两处采用同一译词，以维持原文的重复和鲜明对比。
- source_word: שׁוֹר
  choice: 牛
  rationale: 现代汉语中“牛”自然、易懂，适合这里家畜的概括形象；“公牛”会加入原文在此处不必强调的性别信息，“耕牛”则会增添用途。
- source_word: קֹנֵהוּ
  choice: 它的主人
  rationale: 该词在家畜语境中指拥有者；“主人”比“所有者”更自然，并能体现动物与饲主的关系。
- source_word: חֲמוֹר
  choice: 驴
  rationale: 直接、准确的现代汉语动物名称。
- source_word: אֵבוּס
  choice: 喂食的槽
  rationale: 指牲畜取食的槽。“喂食的槽”清楚易懂，也避免“马槽”把适用动物限定为马；脚注列出简洁的传统表达“食槽”。
- source_word: בְּעָלָיו
  choice: 主人
  rationale: בעליו 表示驴的拥有者或主人；汉语由语境自然领会其所属关系，无须再次添加代词。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留民族及立约群体的专名。
- source_word: לֹא יָדַע
  choice: 却不认识
  rationale: 与开头“认识”形成词语复现；加入“却”自然显明原文平行结构中的强烈反差，而不补出原文省略的宾语。
- source_word: עַמִּי
  choice: 我的子民
  rationale: “我的子民”是自然且庄重的立约群体称谓，保留第一人称所有关系及话语中的悲痛。
- source_word: הִתְבּוֹנָן
  choice: 并不明白
  rationale: 该形式含审慎思考、辨明和领悟之意；“明白”符合现代汉语，并与“认识”构成平行而不完全同义的表达。
theological_decisions:
- issue: 以色列“不认识”的隐含宾语
  choice: 正文不补出宾语
  alternative: 译作“以色列却不认识我／上主”
  rationale: 希伯来文在“以色列不认识”之后没有明说宾语。上下文强烈暗示所不认识的是耶和华，但正文保留原文的简练、省略和修辞张力，并在脚注说明其隐含意义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“认识／不认识”的词语重复，以呈现动物与以色列之间的讽刺性对比；分号维持两组平行分句。正文中的[a]、[b]均与脚注对应。
