  - severity: low
    issue: “求这事”在此语境略弱且搭配不顺
    rationale: בִקֵּשׁ在此为责问上帝是否曾索求／要求这种举动；“要求过这事”较清楚地表达此义，并与“从你们手中”保留的原文意象相协调。
