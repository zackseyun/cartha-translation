- from: 你们来朝见我[a]的时候，谁曾从你们手中求这事，要你们践踏我的院宇呢？
  to: 你们来朝见我[a]的时候，谁曾从你们手中要求过这事——践踏我的院宇呢？
  rationale: 修订仅调整后半句的汉语句法：“这事——践踏我的院宇”对应原文 demonstrative 后接不定词的同位式关系，避免“要求……要你们……”的重复，同时保留“从你们手中”的具体原文表达、反问语气、圣所语境与责斥力度。
