  text: כִּ֣י תָבֹ֔אוּ לֵ/רָא֖וֹת פָּנָ֑/י מִי בִקֵּ֥שׁ זֹ֛את מִ/יֶּדְ/כֶ֖ם רְמֹ֥ס חֲצֵרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/012.yaml
  text: 'When you come to appear before me[a], who has required this from your hand: trampling my courts?'
translation:
  language: zh_hans
  text: 你们来朝见我[a]的时候，谁曾从你们手中要求过这事——践踏我的院宇呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“见我的面”，是指来到上帝面前朝见他的敬拜用语。
    reason: 说明希伯来语敬拜用语，并保留“面”的原文意象与语态上的表达张力。
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: 你们……的时候
  rationale: כִּי在这里引出责问所针对的情境，译作“……的时候”比因果性的“因为”更符合上下文；תָבֹאוּ译为“来”。
- source_word: לֵרָאוֹת פָּנָי
  choice: 来朝见我
  rationale: 这是圣所敬拜语境中的表达，指来到上帝面前；“朝见”既传达正式进到尊者面前的含义，也保留庄重语气。原文中“面”的具体意象通过脚注说明。
- source_word: מִי בִקֵּשׁ זֹאת
  choice: 谁曾……求这事
  rationale: 保留反问形式；בִקֵּשׁ在此不是单指寻找，而是指索求、要求。加入“曾”使汉语反问自然，并未改变其否定含意。
- source_word: מִיֶּדְכֶם
  choice: 从你们手中
  rationale: 保留希伯来语“从……手中”的具体表达及交付、责任意味；现代汉语仍可理解。
- source_word: רְמֹס חֲצֵרָי
  choice: 要你们践踏我的院宇
  rationale: רְמֹס说明“这事”的内容或结果；“要”显明其与“求”的关联。“践踏”保留先知责斥的强烈色彩，“院宇”指圣殿范围内的院落。
theological_decisions:
- issue: לֵרָאוֹת פָּנָי所表达的敬拜含义
  choice: 来朝见我
  alternative: 来见我的面／来显在我面前
  rationale: 经文责备的是敬拜者进入圣所，并非断言他们以肉眼看见上帝。“朝见我”自然传达来到上帝面前的礼仪语境，同时脚注保留原文“面”的意象及可能的直译。
- issue: רְמֹס与前句的句法关系
  choice: 要你们践踏我的院宇
  alternative: 这践踏我院宇的事／践踏我的院宇？
  rationale: 希伯来文用不定词紧接“这事”，关系简练而有张力。汉语以“要”连接，使反问清楚，但不把责备缩减为单纯的走路动作；重点仍是他们不蒙悦纳地进入圣殿院宇。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“朝见”适合上帝作为说话者的圣所语境；“院宇”比日常的“院子”更能指明圣殿院落，又不显过分古奥。
