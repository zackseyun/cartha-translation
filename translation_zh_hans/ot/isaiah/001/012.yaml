  naturalness: “来朝见我”庄重自然；“院宇”在圣所语境可用。原句后半“谁曾从你们手中求这事，要你们践踏……”在现代汉语中搭配稍滞。改用破折号引出对“这事”的说明，可保留原文简练、带责问的同位关系。
  terminology: “朝见”恰当表达לֵרָאוֹת פָּנָי在礼仪语境中来到上帝面前的含义；脚注适当地保留“见我的面”的字面意象。“践踏”“院宇”也符合先知性责斥和圣殿院落语境。
