  naturalness: “二者必一同燃烧”比“二者要一同焚烧”更自然；“焚烧”在现代汉语中常带及物用法，而原文此处是二者自身燃烧。“麻絮”可清楚表达松散、易燃的麻纤维，且与脚注说明一致。
  terminology: “强者”恰当保留单数人物指向，不将其限定为富人或权贵；“作为”可涵盖行为及所作成之物；“火星”“燃烧”“扑灭”连贯保留原文的火焰意象和审判语体。
