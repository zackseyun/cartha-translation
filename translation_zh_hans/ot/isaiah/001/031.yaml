base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/031.yaml
  text: The strong man will become tinder[a], and his work a spark; both of them will burn together, with no one to quench them.
translation:
  language: zh_hans
  text: 强者必变为易燃的麻絮[a]，他的作为必成为火星；二者必一同燃烧，无人扑灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“麻屑”，即抖落下来的松散亚麻纤维，很容易燃烧。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָסֹן
  choice: 强者
  rationale: 该词指强壮或有权势的人。译作“强者”保留名词化的单数人物指向，也避免将语境可能涉及的财富含义写死。
- source_word: לִנְעֹרֶת
  choice: 易燃的麻屑
  rationale: 该名词指抖落的纤维，尤指亚麻碎屑或粗麻纤维，极易着火。“麻屑”保留具体意象，补入“易燃的”帮助现代读者把握比喻。
- source_word: וּפֹעֲלוֹ
  choice: 他的作为
  rationale: פֹּעַל可指工作、行为或制成之物。“作为”既可涵盖所行之事，也不完全排除其成果；单数所有格自然回指“强者”。
- source_word: לְנִיצוֹץ
  choice: 如火星
  rationale: 该词指火花或灼热微粒。“火星”在现代汉语中能直接表达引燃麻屑的具体形象。
- source_word: וּבָעֲרוּ
  choice: 要……焚烧
  rationale: 动词表示燃烧。“焚烧”符合审判语境和庄重文体，同时不额外加入“烧尽”等结果含义。
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: 二者要一同
  rationale: 明确指前述强者与他的作为，并保留原文“两者”和“一同”的强调。
- source_word: וְאֵין מְכַבֶּה
  choice: 无人扑灭
  rationale: אין加分词表示没有任何灭火者。“无人扑灭”简洁自然，并保留审判无法阻止的终局性。
theological_decisions:
- issue: “他的作为”中单数所有格的所指
  choice: 理解为回指单数的“强者”，因此受审判的是此人及其作为。
  alternative: 也可能按群体意义理解，泛指强势者这一类人的作为。
  rationale: 希伯来语单数后缀最自然地回指前面的单数名词הֶחָסֹן；如此也维持诗句中人物与其作为一同燃烧的紧密对应。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“强者”保留人物指向；“麻屑—火星—焚烧—扑灭”维持原文连续的燃烧意象。正文脚注标记[a]与脚注对应。
