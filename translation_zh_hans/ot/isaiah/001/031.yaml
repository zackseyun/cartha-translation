  to: 强者必变为易燃的麻絮[a]，他的作为必成为火星；二者必一同燃烧，无人扑灭。
  rationale: 修订使两个名词性谓语在汉语中保持平行，避免把“成为火星”仅译成相似关系；并以“燃烧”准确、自然地表达二者共同着火。脚注保留该词可译为“麻屑”的词汇替代，同时说明其所指的易燃松散亚麻纤维。
