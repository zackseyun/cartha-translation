source:
  edition: WLC
  text: כִּ֣י יֵבֹ֔שׁוּ מֵ/אֵילִ֖ים אֲשֶׁ֣ר חֲמַדְתֶּ֑ם וְ/תַ֨חְפְּר֔וּ מֵ/הַ/גַּנּ֖וֹת אֲשֶׁ֥ר בְּחַרְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/029.yaml
  text: For you will be ashamed of the oaks that you desired[a], and you will be disgraced because of the gardens that you chose.
translation:
  language: zh_hans
  text: 因为，他们[b]必因你们所恋慕的橡树[a]而羞愧；你们也必因自己所选择的园子而蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“笃耨香树”。希伯来词所指的具体树种不能确定；这里可能是与不正当敬拜有关的大树。
    reason: 说明树种的词义不确定性及可能的礼仪背景，而不把这一背景写入正文。
  - marker: b
    text: 希伯来原文此处作“他们”，下半句则作“你们”；有些译本把两处都理解为同一群人，均译作“你们”。
    reason: 保留并说明原文突出的语法人称转换。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前宣告的审判说明缘由或后果；“因为”自然保留其解释作用。
- source_word: יֵבֹשׁוּ
  choice: 他们必……羞愧
  rationale: 动词意为羞愧、失望，且马所拉文本的形式为第三人称阳性复数。正文保留这一人称，不把它无声改成第二人称。
- source_word: מֵאֵילִים
  choice: 因……橡树
  rationale: 介词在羞愧类动词后表示羞愧的缘由；אֵילִים在园子这一平行语境中最可能指与不正当敬拜有关的大树。“橡树”通俗可懂，具体树种的不确定性在脚注说明。
- source_word: אֲשֶׁר חֲמַדְתֶּם
  choice: 你们所恋慕的
  rationale: חמד表示强烈的喜爱、渴望或贪恋；“恋慕”保留其情感强度，又不把含义限定为财物方面的贪图。
- source_word: וְתַחְפְּרוּ
  choice: 你们也必……蒙羞
  rationale: חפר在此表示受辱、惭愧或蒙羞；“蒙羞”与前句“羞愧”相呼应，同时不把两个不同的希伯来动词完全合并。
- source_word: מֵהַגַּנּוֹת
  choice: 因……园子
  rationale: מִן在此标明蒙羞的缘由。“园子”保持原文朴素意象，不在正文直接增添“祭祀”或“圣所”等解释。
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: 自己所选择的
  rationale: בחר即选择；加入“自己”使现代汉语自然，并凸显听众主动选择这些园子的责任，没有增加新的命题内容。
theological_decisions:
- issue: 橡树与园子的性质
  choice: 正文按字面译作“橡树”和“园子”，不直接加上“偶像崇拜”字样；脚注仅说明橡树可能具有礼仪背景。
  alternative: 在正文明确译作“供偶像崇拜的圣树”和“祭祀园子”。
  rationale: 上下文很可能指向不正当敬拜场所，但原句本身使用普通的树木和园子词汇。保留这些意象可避免把高度可能的背景解释提升为明说内容。
- issue: 首句第三人称与次句第二人称的转换
  choice: 保留“他们……你们……”的人称转换，并以脚注提示。
  alternative: 把首句也译成“你们”，视两句为同一受众。
  rationale: 马所拉文本首个动词明确为第三人称复数，随后动词及两个关系从句中的动词为第二人称复数。保留转换最忠实于现存原文，也避免替读者消除可能属于修辞、指涉或传抄层面的张力。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“恋慕—羞愧—选择—蒙羞”保持诗句的平行结构和审判语气；正文不使用生僻的树木术语，也不把可能的祭祀背景过度明说。
