  yaml_path: translation/ot/isaiah/001/019.yaml
  text: If you are willing and obedient[a], you will eat the good of the land.
translation:
  language: zh_hans
  text: 你们若愿意听从，就必吃这地的美物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你们若愿意并且听。”这里的“听”含有听了便顺服、照着行的意思。
    reason: 词义有“听”和“顺服”之间的语义幅度；保留原文“愿意”与“听”的并列形式，并说明此处的回应含义。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 标准条件连词，引出条件句；“若”简洁庄重，也符合现代书面汉语。
- source_word: תֹּאבוּ
  choice: 愿意
  rationale: אבה表示甘愿、同意；“愿意”保留意志与主动回应的含义。
- source_word: וּשְׁמַעְתֶּם
  choice: 听从
  rationale: שׁמע可指听、听从或顺服；本节与下一节的拒绝相对照，因此“听从”既保留“听”的词义形象，也表达顺服回应。
- source_word: טוּב
  choice: 美物
  rationale: טוּב在此指地所出产的好东西或丰美物产；“美物”保留希伯来语较宽泛的表达，同时在汉语中自然可懂。
- source_word: הָאָרֶץ
  choice: 地上
  rationale: 此处指这片土地及其出产，并非整个世界；与“美物”组合为“地上的美物”，自然表达土地所供应的丰美。
- source_word: תֹּאכֵלוּ
  choice: 就必吃
  rationale: 保留אכל具体的“吃”这一意象；在条件结构中用“就必”表达条件得到满足后的确定结果。
theological_decisions:
- issue: 盟约劝诫中שׁמע的含义
  choice: 听从
  alternative: 听；顺服
  rationale: 上下文把愿意听从与拒绝悖逆相对照，所指不只是听见，而是以行动回应。“听从”兼顾原词的听觉含义和顺服意味，避免将含义过度抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“愿意听从”紧凑对应两个并列动词；“吃地上的美物”保留原文具体意象及土地出产的含义。脚注标记置于正文句末。
