  text: וְ/אָשִׁ֤יבָה שֹׁפְטַ֨יִ/ךְ֙ כְּ/בָ/רִ֣אשֹׁנָ֔ה וְ/יֹעֲצַ֖יִ/ךְ כְּ/בַ/תְּחִלָּ֑ה אַחֲרֵי כֵ֗ן יִקָּ֤רֵא לָ/ךְ֙ עִ֣יר הַ/צֶּ֔דֶק קִרְיָ֖ה נֶאֱמָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/026.yaml
  text: And I will restore your judges as at the first[a], and your counselors as at the beginning. Afterward you will be called the city of righteousness, a faithful city.
translation:
  language: zh_hans
  text: 我必恢复你的审判官，如起初一样；也恢复你的谋士，如当初一样。此后，你必被称为“公义之城”[a]、“忠信之城”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义之城”或译“公正之城”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: 我要恢复
  rationale: שוב的使役形在此表示使之复归、恢复；结合整治并重建城中领袖的语境，“恢复”比直译“使回来”更自然。
- source_word: שֹׁפְטַיִךְ
  choice: 你的审判官
  rationale: שֹׁפֵט通常指负责判断、治理的人。“审判官”保留司法含义，也容许其在古代城邦中兼具治理职能。
- source_word: כְּבָרִאשֹׁנָה
  choice: 像起初一样
  rationale: 保留对从前理想状态的时间比较，但不具体指定某一历史时期。
- source_word: וְיֹעֲצַיִךְ
  choice: 你的谋士
  rationale: 指提供谋议、辅政的人；“谋士”与“审判官”并列，简洁而有庄重感。
- source_word: כְּבַתְּחִלָּה
  choice: 像开端一样
  rationale: 与“像起初一样”形成近义平行，同时保留原文不同词语的细微变化。
- source_word: אַחֲרֵי כֵן
  choice: 此后
  rationale: 简洁表达恢复之后的时间推进及结果。
- source_word: יִקָּרֵא לָךְ
  choice: 你必被称为
  rationale: קרא的被动形表示被称呼、被命名；保留原文对拟人化之城的第二人称直接称说。
- source_word: עִיר הַצֶּדֶק
  choice: 公义之城
  rationale: צֶדֶק兼含正直、公正及合乎正道之意；“公义”保留其宽广的道德与社会内涵，而不局限于司法公正。
- source_word: קִרְיָה נֶאֱמָנָה
  choice: 忠信之邑
  rationale: קִרְיָה是诗体中的“城邑”，נֶאֱמָנָה表示忠实、可靠；“忠信之邑”保留诗性同位结构，并呼应1:21的反差。
theological_decisions:
- issue: צֶדֶק在城市治理与复兴语境中的译法
  choice: 公义
  alternative: 公正
  rationale: “公义”能同时涵盖正直、正当秩序和公平治理，较少把语义限缩为司法层面的公正；脚注保留“公正”这一合理译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号保存两组平行句，并用“城／邑”体现עִיר与קִרְיָה的诗体变化。第二个“恢复”在汉语中补出，以明确其同时支配“审判官”和“谋士”，不改变原意。
