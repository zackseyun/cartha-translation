id: ISA.1.24
reference: Isaiah 1:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻ֤ם הָֽ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת אֲבִ֖יר יִשְׂרָאֵ֑ל ה֚וֹי אֶנָּחֵ֣ם מִ/צָּרַ֔/י וְ/אִנָּקְמָ֖ה מֵ/אוֹיְבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/024.yaml
  text: 'Therefore the declaration of the Lord[a], Yahweh of Armies, the Mighty One of Israel: “Ah[c][b], I will get relief from my foes and avenge myself on my enemies.”'
translation:
  language: zh_hans
  text: '因此，主——万军之雅威[b]、以色列的大能者——宣告说[a]：


    “啊！我要在敌手身上得到舒解[c]，


    向仇敌报仇。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣告说”或译“这是主的神谕”。
    reason: lexical_alternative
  - marker: b
    text: “万军之雅威”直译为“众军的雅威”；“万军”可包括天上的军队与受他统辖的众军。
    reason: lexical_alternative
  - marker: c
    text: “得到舒解”也可译“得到宽慰”或“得到安慰”；这里指他对敌手采取行动后所得的舒解或满足。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的控诉并引出其后果，保留明确的推论关系。
- source_word: נְאֻם
  choice: 宣告说
  rationale: 这是先知话语中引出庄严神谕的固定用语；“宣告说”庄重而易懂。
- source_word: הָאָדוֹן
  choice: 主
  rationale: 保留定冠词所强调的主权称号，又符合现代中文的圣经语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文将四字神名作为专名音译，不以“主”这一称号替代，并与前面的 הָאָדוֹן 区分。
- source_word: צְבָאוֹת
  choice: 万军
  rationale: 在中文里以简洁、庄重且通行的表达传达“众军、军队”的复数集合意义。
- source_word: אֲבִיר יִשְׂרָאֵל
  choice: 以色列的大能者
  rationale: 准确保留这一强调力量与权能的神圣称号。
- source_word: הוֹי
  choice: 啊
  rationale: 保留感叹词的情绪力度，但不把它限定为哀叹、嘲讽或得意。
- source_word: אֶנָּחֵם
  choice: 得到宽慰
  rationale: 此处 Niphal 形式表达借着处置敌手而得到舒解或满足；“得到宽慰”不将其与下一句的报仇完全合并。
- source_word: מִצָּרַי
  choice: 从敌手身上
  rationale: 保留介词 מן 的来源或缘由色彩，并以自然中文指向敌对者。
- source_word: וְאִנָּקְמָה
  choice: 向……报仇
  rationale: 表达第一人称坚定施行报应的意向，并保留其反身关联。
- source_word: מֵאוֹיְבָי
  choice: 向仇敌
  rationale: 配合中文“报仇”的惯常介词搭配，直接清楚。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。音译“雅威”保留其专名性质，并避免与同句的称号“主”混同。
- issue: 神得宽慰与施行报仇之间的关系
  choice: 分别译作“得到宽慰”和“报仇”
  alternative: 将两者合并为“向敌手泄愤”；或译作“因敌手而得安慰”
  rationale: 原文使用两个相关而不同的动词；译文保留神借审判得到舒解以及亲自报仇这两层张力，不弱化司法意味，也不把两者压成一个动作。
- issue: 感叹词 הוֹי 的情绪指向
  choice: 啊
  alternative: 唉；哼；哈
  rationale: 上下文显示强烈的神圣决意，但该词本身可承载不同情绪。“啊”保留力度而不擅自限定为悲叹、轻蔑或欢喜。
translation_notes:
  register: 采用现代、庄重且普通读者可理解的中文。以破折号括出两个并列神圣称号，使长串称谓层次清楚；诗行分行保留后半句的平行结构。所有脚注标记均已置于正文相应词语之后。
