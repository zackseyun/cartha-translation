source:
  edition: WLC
  text: מִ/כַּף רֶ֤גֶל וְ/עַד רֹאשׁ֙ אֵֽין בּ֣/וֹ מְתֹ֔ם פֶּ֥צַע וְ/חַבּוּרָ֖ה וּ/מַכָּ֣ה טְרִיָּ֑ה לֹא זֹ֨רוּ֙ וְ/לֹ֣א חֻבָּ֔שׁוּ וְ/לֹ֥א רֻכְּכָ֖ה בַּ/שָּֽׁמֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/006.yaml
  text: From the sole of the foot even to the head[a], there is no soundness in it—only wounds and bruises and fresh blows; they have not been pressed out, or bandaged[d][c][b], or softened with oil.
translation:
  language: zh_hans
  text: 从脚掌到头顶，全身没有一处完好[a]，尽是创伤、淤伤和新鲜的伤口[b]；这些伤口没有挤压处理[c]，没有包扎[d]，也没有用油软化。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语也可直译为“他里面没有一处完好”。这里把整个国家人格化为一个受伤的身体。
    reason: alternative_reading
  - marker: b
    text: 也可译作“新近的伤口”。原文形容伤口新鲜、裸露，尚未经处理。
    reason: lexical_alternative
  - marker: c
    text: 这个动词在此可能指挤压伤口，排出其中的液体或污物，再作处理。
    reason: cultural_note
  - marker: d
    text: 或译“缠裹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכַּף רֶגֶל וְעַד רֹאשׁ
  choice: 从脚掌到头顶
  rationale: 直译身体由下至上的两端，保留表示全身范围的首尾兼举；“脚掌”准确表达כַּף רֶגֶל。
- source_word: אֵין בּוֹ מְתֹם
  choice: 全身没有一处完好
  rationale: מְתֹם指完整、健全、未受损的状态；中文以“没有一处完好”自然呈现遍体受伤的身体隐喻，“全身”承接前面的范围表达。
- source_word: פֶּצַע
  choice: 创伤
  rationale: 该词泛指伤口或损伤；“创伤”既清楚，又适合与后续伤势并列。
- source_word: חַבּוּרָה
  choice: 淤伤
  rationale: 该词可指受击形成的青肿、伤痕或鞭痕；“淤伤”在现代中文中自然，并保留受击所致伤势的含义。
- source_word: מַכָּה טְרִיָּה
  choice: 新伤
  rationale: מַכָּה可指击打或造成的伤口，טְרִיָּה表示新近、鲜嫩或未愈；“新伤”简洁保留其新近而未经处理的意味。
- source_word: לֹא זֹרוּ
  choice: 没有挤净
  rationale: 在古代伤口护理语境中，该动词很可能指挤压伤口、排出其中物质；“挤净”保留具体动作而不在正文中明确加入“脓液”。
- source_word: וְלֹא חֻבָּשׁוּ
  choice: 没有包扎
  rationale: חבשׁ在护理伤口时指缠裹、包扎；此译为现代汉语常用表达。
- source_word: וְלֹא רֻכְּכָה בַּשָּׁמֶן
  choice: 也没有用油软化
  rationale: רכך意为使柔软；保留以油处理伤口的古代医疗图景，不改写成较宽泛的“医治”或“舒缓”。
theological_decisions:
- issue: 受伤身体所指的对象
  choice: 正文以“全身”延续国家如同受伤身体的隐喻，不加男性单数代词
  alternative: 按希伯来语形式译作“他里面没有一处完好”，将犹大或以色列人格化为男性个体
  rationale: 上下文把国家描绘成遍体受伤的身体。现代中文若直接使用“他”，容易让读者误以为是某个男性；“全身”既自然，又不消除国家人格化的背景，形式差异在脚注说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。伤势清单使用“创伤、淤伤和新伤”，简洁且有递进感；后三个否定短语保持平行结构，呈现伤口完全无人护理的状态。所有脚注标记均已置于正文相应位置。
