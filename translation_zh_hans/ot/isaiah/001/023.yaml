source:
  edition: WLC
  text: שָׂרַ֣יִ/ךְ סוֹרְרִ֗ים וְ/חַבְרֵי֙ גַּנָּבִ֔ים כֻּלּ/וֹ֙ אֹהֵ֣ב שֹׁ֔חַד וְ/רֹדֵ֖ף שַׁלְמֹנִ֑ים יָתוֹם֙ לֹ֣א יִשְׁפֹּ֔טוּ וְ/רִ֥יב אַלְמָנָ֖ה לֹֽא יָב֥וֹא אֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/023.yaml
  text: Your rulers are rebels and companions of thieves[a]; every one of them loves a bribe and runs after payments. They do not defend the orphan[c][b], and the widow’s case does not come before them.
translation:
  language: zh_hans
  text: 你的官长悖逆，与盗贼为伍[a]；他们个个喜爱贿赂，追逐酬金[b]。他们不为孤儿主持公道[c]，寡妇的案件也到不了他们面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官长”也可译为“首领”或“统治者”；“悖逆”也可译为“叛逆”；“与盗贼为伍”也可译为“是盗贼的同伙”。
    reason: 保留שַׂר、סוֹרְרִים和חָבֵר在身份称谓、悖逆性质及结交关系上的可行译法。
  - marker: b
    text: “酬金”也可译作“报酬”或“馈赠”；希伯来语所指可能是款项或回报，在本节语境中很可能是不正当利益。
    reason: שַׁלְמֹנִים的具体所指并不完全确定，需保留词义幅度及腐败语境。
  - marker: c
    text: “不为孤儿主持公道”也可译作“不审理孤儿的案件”或“不维护孤儿的权益”。
    reason: שׁפט在此可侧重审理、施行公正或维护权益。
lexical_decisions:
- source_word: שָׂרַיִךְ
  choice: 你的官长
  rationale: שַׂר指掌权者、首领或官员；“官长”既保留治理身份，也符合先知书庄重而清楚的语体。
- source_word: סוֹרְרִים
  choice: 悖逆
  rationale: 源自动词סרר，表达顽梗、反叛；“悖逆”简洁地保留其道德与政治谴责。
- source_word: וְחַבְרֵי גַּנָּבִים
  choice: 跟盗贼同伙
  rationale: חָבֵר表示同伴、同伙；此处指官长与盗贼结党，译文保留强烈的指控意味。
- source_word: כֻּלּוֹ
  choice: 他们个个
  rationale: 形式上为带后缀的单数，语境中具有逐一概括整个群体的分配意义；“他们个个”在现代汉语中自然明确。
- source_word: אֹהֵב שֹׁחַד
  choice: 喜爱贿赂
  rationale: שֹׁחַד明确指贿赂；中文以集合或泛指方式表达，无须机械保留单数。
- source_word: וְרֹדֵף שַׁלְמֹנִים
  choice: 追逐酬金
  rationale: רדף意为追赶、追逐；שַׁלְמֹנִים可指酬报、款项或馈赠，在腐败语境中含不当利益之意。“酬金”保留词义范围，脚注说明其他可能。
- source_word: יָתוֹם לֹא יִשְׁפֹּטוּ
  choice: 他们不为孤儿主持公道
  rationale: שׁפט在司法语境中不仅是审判，也可指施行或维护公正；“为孤儿主持公道”清楚表达弱者未获司法保护。
- source_word: וְרִיב אַלְמָנָה
  choice: 寡妇的案件
  rationale: רִיב可指争讼、申诉或案件；这里处于司法腐败语境，“案件”自然且不缩窄为私人纠纷。
- source_word: לֹא יָבוֹא אֲלֵיהֶם
  choice: 也到不了他们面前
  rationale: 原文直指案件“不来到他们那里”；“到不了他们面前”保留司法情境，并暗示案件未获受理，而不额外说明具体原因。
