  text: וְ/נוֹתְרָ֥ה בַת צִיּ֖וֹן כְּ/סֻכָּ֣ה בְ/כָ֑רֶם כִּ/מְלוּנָ֥ה בְ/מִקְשָׁ֖ה כְּ/עִ֥יר נְצוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/008.yaml
  text: And daughter Zion is left like a shelter in a vineyard[a], like a hut in a cucumber field[c][b], like a besieged city.
translation:
  language: zh_hans
  text: 锡安的女儿存留下来，像葡萄园里的棚屋，像瓜田里的小屋，又像一座被围困的城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנוֹתְרָה
  choice: 被留下
  rationale: 该词是表示“余下、留下”的被动形式；译作“被留下”既保留语态，也承接上文灾祸过后孤零零存留的景象。
- source_word: בַת צִיּוֹן
  choice: 锡安女子
  rationale: 这是先知文学中对锡安或耶路撒冷的女性人格化称呼。“锡安女子”在现代汉语中简洁庄重，并保留原文的诗性表达。
- source_word: כְּסֻכָּה בְכָרֶם
  choice: 像葡萄园里的棚子
  rationale: סֻכָּה指临时搭建的棚子或遮蔽处；“棚子”自然地传达其简陋、孤立和临时的特点。
- source_word: כִּמְלוּנָה בְמִקְשָׁה
  choice: 像瓜田里的茅屋
  rationale: מְלוּנָה是供人在田间暂住或看守作物的小屋；מִקְשָׁה指种植黄瓜、甜瓜或类似蔓生瓜类的田地。“瓜田里的茅屋”既符合农业场景，也避免把作物范围限定得过窄。
- source_word: כְּעִיר נְצוּרָה
  choice: 像一座被围困的城
  rationale: נְצוּרָה在本段审判与毁坏的语境中最自然地表示“被围困的”；这一译法也突出锡安孤立受压的处境。
theological_decisions:
- issue: 锡安的人格化
  choice: 保留“锡安女子”的人格化称呼
  alternative: 耶路撒冷；锡安的居民
  rationale: 原文没有直接改称城市或居民，而是把锡安描绘成女子。保留这一形象可避免用解释性说法取代先知诗歌的神学与文学张力。
- issue: נְצוּרָה所描绘的城市状态
  choice: 被围困的城
  alternative: 被守卫的城；被看守的城
  rationale: 词形容许与看守、防守有关的理解，但上下文描写国家遭受毁坏、锡安孤立存留，因此“被围困”最契合语境；其他可能性用脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个“像”构成递进的诗行意象；“棚子”“茅屋”保留田间临时建筑的脆弱感，“被围困的城”则把孤立与受压的景象推向高潮。
