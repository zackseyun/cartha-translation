language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְע֤וּ שָׁמַ֨יִם֙ וְ/הַאֲזִ֣ינִי אֶ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּ֑ר בָּנִים֙ גִּדַּ֣לְתִּי וְ/רוֹמַ֔מְתִּי וְ/הֵ֖ם פָּ֥שְׁעוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/002.yaml
  text: 'Hear[a], O heavens, and give ear, O earth, for Yahweh has spoken: “I have reared children and brought them up[b], but they have rebelled against me.”'
translation:
  language: zh_hans
  text: '诸天哪，要听！大地啊，要侧耳倾听！因为雅威说：


    “我养育了儿女[a]，又抬举了他们[b]；


    他们却背叛我。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“儿子们”；这里集体指雅威的百姓。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“使他们长大”或“使他们尊贵”。这个动词本义有抬高、提升之意；在本句中也可能延续养育儿女的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 复数命令式，作为庄严的先知性召唤；与下句“要侧耳倾听”构成平行。
- source_word: שָׁמַיִם
  choice: 天哪
  rationale: 与“地啊”相对，构成天地作证的宇宙性呼告；中文用呼语助词自然表达直接称呼。
- source_word: הַאֲזִינִי
  choice: 要侧耳倾听
  rationale: 该动词比一般的“听”更强调专注聆听，也保留诗歌平行中的递进意味。
- source_word: אֶרֶץ
  choice: 地啊
  rationale: 在“天”与“地”的平行结构中指大地，而非特定疆土。
- source_word: כִּי
  choice: 因为
  rationale: 引出天地必须聆听的理由：雅威已经发言。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接保留上帝的专名，不以称号代替。
- source_word: דִּבֵּר
  choice: 说
  rationale: 完成式在此郑重引出随后的直接话语；现代汉语用“说”最自然，权威性由上下文体现。
- source_word: בָּנִים
  choice: 儿女
  rationale: 词形为阳性复数，字面可译“儿子们”，但此处整体指作为雅威后代的百姓；“儿女”保留亲子意象并准确涵盖群体。
- source_word: גִּדַּלְתִּי
  choice: 我养育了他们
  rationale: 在亲子语境中表示抚养、使之长大；“养育”自然且保留父母照料的意象。
- source_word: רוֹמַמְתִּי
  choice: 又使他们尊贵
  rationale: 该动词有抬高、使崇高或使尊大的含义；此译不把它与前面的“养育”合并，同时表达雅威给予百姓地位和尊荣。
- source_word: פָּשְׁעוּ
  choice: 背叛了
  rationale: 该词表示对合法权威的反叛，也带有盟约关系破裂的意味；“背叛”兼顾关系性与悖逆性。
- source_word: בִי
  choice: 我
  rationale: 与“背叛”连用时，介词标明反叛所针对的对象；汉语直接说“背叛了我”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名。音译“雅威”保留其作为以色列之神专名的性质，避免用称号取代专名。
- issue: בָּנִים 所指群体的性别范围
  choice: 儿女
  alternative: 儿子们
  rationale: 希伯来文形式虽为阳性复数，但此处集体指全体百姓。“儿女”既保留亲子关系，也不造成只指男性的误解。
- issue: רוֹמַמְתִּי 的含义
  choice: 使他们尊贵
  alternative: 使他们长大；把他们抬高
  rationale: 该动词可能承接养育意象，也可能强调抬举、尊荣。正文保留后一层语义，以免与 גִּדַּלְתִּי 重复；脚注说明其他可能译法，不把语义张力静默消除。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。开头以“天哪……地啊……”保留先知诗歌的直接呼告和天地作证的法庭氛围；后半句保持希伯来诗歌的对比张力，并用分行与分号显出平行结构。
