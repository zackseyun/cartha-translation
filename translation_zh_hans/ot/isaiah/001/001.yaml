  text: חֲזוֹן֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֲשֶׁ֣ר חָזָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בִּ/ימֵ֨י עֻזִּיָּ֧הוּ יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖הוּ מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/001.yaml
  text: The vision of Isaiah son of Amoz[a], which he saw concerning Judah and Jerusalem in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah.
translation:
  language: zh_hans
  text: 亚摩斯的儿子以赛亚在犹大诸王乌西雅、约坦、亚哈斯和希西家在位的日子所见、有关[a]犹大和耶路撒冷的异象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有关”或译“针对”。希伯来文介词既可引出异象的主题，在某些语境中也可表示针对的对象。
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזוֹן
  choice: 异象
  rationale: 该词常指先知所见的启示性景象；译作“异象”既直接，也与后面的动词“看见”形成呼应。
- source_word: יְשַׁעְיָהוּ בֶן־אָמֹוץ
  choice: 亚摩斯的儿子以赛亚
  rationale: 按现代中文圣经通行专名译法处理人名，并自然表达父子关系。
- source_word: אֲשֶׁר חָזָה
  choice: 就是他……看见……的异象
  rationale: חָזָה直译为“看见”，保留它与“异象”的词义呼应；补出“异象”使较长的中文关系结构清楚自然。
- source_word: עַל
  choice: 有关
  rationale: 此介词在先知书标题中可引出信息的对象或主题；“有关”保留其宽泛范围，不预先把整卷信息限定为谴责。
- source_word: בִּימֵי
  choice: 在位的日子
  rationale: 保留希伯来文“在……的日子”的表达，同时以“在位”说明这里列举的是犹大诸王的时代。
- source_word: עֻזִּיָּהוּ יוֹתָם אָחָז יְחִזְקִיָּהוּ
  choice: 乌西雅、约坦、亚哈斯和希西家
  rationale: 采用现代中文圣经中通行的犹大王名译法。
- source_word: מַלְכֵי יְהוּדָה
  choice: 犹大王
  rationale: 置于王名之前统摄四人，符合自然中文语序，也准确表达这些人都是犹大诸王。
theological_decisions:
- issue: 标题中 עַל 的含义范围
  choice: 有关犹大和耶路撒冷
  alternative: 针对犹大和耶路撒冷
  rationale: 该介词既可表示主题，也可能在特定语境中带有针对意味。本书同时包含审判与盼望，因此正文采用较中性的“有关”，并用脚注保存“针对”的可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“所得的异象”自然表达先知领受启示；后文保留“看见”，以呈现原文 חֲזוֹן 与 חָזָה 的词义呼应。
