revisions:
- from: 亚摩斯的儿子以赛亚所得的异象，就是他在犹大王乌西雅、约坦、亚哈斯和希西家在位的日子，看见有关犹大和耶路撒冷的异象。[a]
  to: 亚摩斯的儿子以赛亚在犹大诸王乌西雅、约坦、亚哈斯和希西家在位的日子所见、有关[a]犹大和耶路撒冷的异象。
  rationale: 修订删除重复的“异象”，以“所见的异象”直接对应“以赛亚的异象，就是他所见的”，并保留原文“异象／看见”的词汇呼应。时间短语仍明确限定以赛亚所见异象的时期；“有关”及其脚注继续保留 עַל 的语义歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:59:47Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了标题的基本信息、四位犹大王及介词 עַל 的宽泛含义。但“所得的异象……看见有关……的异象”将原文仅出现一次的“异象”重复为两次，且“所得”额外强调领受，削弱了 חָזוֹן／חָזָה（异象／看见）的直接对应。
  naturalness: “亚摩斯的儿子以赛亚所见的异象”简洁、庄重且符合现代中文书面语；将时间短语置于“所见”之前可避免原稿的重复和句法拖沓。
  terminology: “异象”“犹大”“耶路撒冷”及王名均可保留。“亚摩斯”是中文圣经传统中对 אָמוֹץ（Amoz）的通行译名；虽与另一先知阿摩司的名称在中文中相近，不构成此处可安全改动的问题。“有关”恰当保留 עַל 可表主题、也可能带有针对意味的开放性。
  issues:
  - severity: medium
    issue: “异象”在正文中重复，造成原文并无的双重异象结构。
    rationale: חֲזוֹן 是主语，אֲשֶׁר חָזָה 是修饰该主语的关系从句；原文不是“所得的异象”再加“看见……的异象”。修订为“所见的异象”同时保留名词与动词的呼应。
  - severity: low
    issue: 脚注锚点置于全句末，未紧邻其所说明的“有关”。
    rationale: 该脚注专门说明 עַל 的译法，锚点应紧随“有关”，使读者清楚其指向。
  revised_text: 亚摩斯的儿子以赛亚在犹大诸王乌西雅、约坦、亚哈斯和希西家在位的日子所见、有关[a]犹大和耶路撒冷的异象。
  revised_footnotes:
