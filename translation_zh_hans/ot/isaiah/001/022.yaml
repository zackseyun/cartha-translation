  yaml_path: translation/ot/isaiah/001/022.yaml
  text: Your silver has become dross[a]; your wine is diluted with water.
translation:
  language: zh_hans
  text: 你的银子变成了渣滓；你的酒掺了水。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּסְפֵּךְ
  choice: 你的银子
  rationale: כֶּסֶף在此指银，且与“渣滓”构成冶炼意象；阴性单数第二人称后缀译为“你的”，承接对锡安／耶路撒冷的拟人称呼。
- source_word: הָיָה
  choice: 变成了
  rationale: 完成式表达已经形成并持续可见的败坏状态；现代汉语用“变成了”自然明确。
- source_word: לְסִיגִים
  choice: 渣滓
  rationale: סִיגִים指金属冶炼中分离出的杂质或废渣；“渣滓”既保留冶炼比喻，也符合庄重而通俗的中文表达。
- source_word: סָבְאֵךְ
  choice: 你的酒
  rationale: סֹבֶא指使人醉的饮料，可具体指酒或烈性饮品；本句以“酒”自然呈现其核心所指，同时不必过度限定酒类。
- source_word: מָהוּל בַּמָּיִם
  choice: 掺了水
  rationale: מָהוּל表示被混合、被稀释；בַּמָּיִם表示与水混合。“掺了水”简洁地传达饮品被兑水、品质败坏的负面语气。
theological_decisions: []
