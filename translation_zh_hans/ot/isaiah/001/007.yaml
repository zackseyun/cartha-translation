  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַרְצְ/כֶ֣ם שְׁמָמָ֔ה עָרֵי/כֶ֖ם שְׂרֻפ֣וֹת אֵ֑שׁ אַדְמַתְ/כֶ֗ם לְ/נֶגְדְּ/כֶם֙ זָרִים֙ אֹכְלִ֣ים אֹתָ֔/הּ וּ/שְׁמָמָ֖ה כְּ/מַהְפֵּכַ֥ת זָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/007.yaml
  text: Your land is a desolation[a]; your cities are burned with fire. Your soil—before your very eyes—strangers are devouring it, and it is a desolation[b], like an overthrow by strangers.
translation:
  language: zh_hans
  text: 你们的国土一片荒凉，你们的城邑被火焚烧；你们的田地，就在你们眼前被外族人[a]吞吃。国土一片荒凉，如同被外族人倾覆一般。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外族人”也可译作“外人”或“异乡人”；原文同一个词在本节出现两次。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“像外族人的倾覆”，结构含义不完全确定；也可理解为“如同外族人遭倾覆一般”。“倾覆”一词也可能令人联想到所多玛的毁灭，但原文没有明说所多玛。
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְצְכֶם
  choice: 你们的国土
  rationale: אֶרֶץ在此指百姓所居的疆土；“国土”既自然，也与后文较具体的“田地”形成区别。
- source_word: שְׁמָמָה
  choice: 一片荒凉
  rationale: 该名词表示遭破坏后的荒废状态；“一片荒凉”保留其名词性强调，又符合现代汉语表达。
- source_word: עָרֵיכֶם
  choice: 你们的城邑
  rationale: 准确表达复数“你们的城市”；“城邑”庄重而清楚，适合先知书语体。
- source_word: שְׂרֻפוֹת אֵשׁ
  choice: 被火焚烧
  rationale: 保留被动意义和“火”的鲜明意象，较“烧毁”更贴近原文形式。
- source_word: אַדְמַתְכֶם
  choice: 你们的田地
  rationale: אֲדָמָה比本节前面的אֶרֶץ更具体，指可耕作、出产粮食的土地；“田地”也使“吞吃”自然地指向其出产。
- source_word: לְנֶגְדְּכֶם
  choice: 就在你们眼前
  rationale: 表达灾难公开发生、百姓亲眼目睹却无力阻止的修辞力度。
- source_word: זָרִים
  choice: 外族人
  rationale: 该词指本群体以外的陌生者或外国入侵者；语境中“外族人”最自然，并在本节两处保持一致。
- source_word: אֹכְלִים אֹתָהּ
  choice: 吞吃
  rationale: 保留“吃”的原文隐喻，同时传达敌人吞噬田地出产、耗尽资源的强烈意味。
- source_word: וּשְׁמָמָה
  choice: 国土一片荒凉
  rationale: 原文再次使用“荒凉”以复述并加强开头的判断；补出“国土”使中文指向清楚。
- source_word: כְּמַהְפֵּכַת זָרִים
  choice: 如同被外族人倾覆一般
  rationale: מַהְפֵּכָה表示倾覆、毁灭；此译按语境将זָרִים理解为实施倾覆者，同时以脚注保留压缩结构中的其他可能解释。
theological_decisions:
- issue: כְּמַהְפֵּכַת זָרִים的理解
  choice: 如同被外族人倾覆一般
  alternative: 如同外族人遭倾覆一般；或把“倾覆”理解为暗示所多玛式的毁灭
  rationale: 希伯来语结构简略，可把זָרִים理解为倾覆的施行者，也可理解为遭倾覆者。מַהְפֵּכָה常用于灾难性的倾覆，但本节没有明说所多玛，因此正文不补入该专名，只在脚注说明可能的联想。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。以“国土—城邑—田地”呈现由整体到具体的层次；重复“一片荒凉”以保留原文首尾呼应。标点划分灾情陈述与末尾比喻，但不消除末句原有的语义张力。
