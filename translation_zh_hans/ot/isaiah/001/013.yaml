  text: לֹ֣א תוֹסִ֗יפוּ הָבִיא֙ מִנְחַת שָׁ֔וְא קְטֹ֧רֶת תּוֹעֵבָ֛ה הִ֖יא לִ֑/י חֹ֤דֶשׁ וְ/שַׁבָּת֙ קְרֹ֣א מִקְרָ֔א לֹא אוּכַ֥ל אָ֖וֶן וַ/עֲצָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/013.yaml
  text: Do not continue bringing worthless grain offerings[a]; incense is an abomination to me. New moon and Sabbath[b], the calling of an assembly—I cannot endure iniquity and solemn assembly.
translation:
  language: zh_hans
  text: 不要再献虚妄的素祭[a]；香在我看来是可憎之物。朔日和安息日，召集会众——我不能容忍罪孽和庄严聚会[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚妄的素祭”也可译作“毫无价值的素祭”或“虚空的供物”。
    reason: lexical_alternative
  - marker: b
    text: 本句也可理解为：“我不能容忍罪孽与庄严聚会并存。”希伯来原文十分简练，可能强调邪恶与敬拜聚会彼此不相容。
    reason: alternative_reading
lexical_decisions:
- source_word: תוֹסִיפוּ הָבִיא
  choice: 再献
  rationale: יסף的使役式与不定词连用，表示继续或再次做某事；“不要再献”简洁自然，并保留反复献祭的意味。
- source_word: מִנְחַת שָׁוְא
  choice: 虚妄的素祭
  rationale: מִנְחָה在祭祀语境中特指素祭；שָׁוְא含虚空、虚妄、毫无价值之意。“虚妄的素祭”兼顾祭物类别和先知的谴责。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 该词直接指祭祀中所用的香；上下文已清楚表明敬拜场景，无须增译为“香祭”。
- source_word: תּוֹעֵבָה הִיא לִי
  choice: 在我看来是可憎的
  rationale: תּוֹעֵבָה表达强烈的厌恶和排斥；此译保留其力度，也符合现代汉语表达。
- source_word: חֹדֶשׁ
  choice: 朔日
  rationale: 在礼仪历法语境中指新月之日及其相关宗教礼仪；“朔日”准确而简洁。
- source_word: שַׁבָּת
  choice: 安息日
  rationale: 这是该盟约性休息与敬拜日的标准汉语译名。
- source_word: קְרֹא מִקְרָא
  choice: 召集聚会
  rationale: 原文为动词与同源名词相连，强调召聚之举；“召集聚会”保留这种重复感，同时仍可理解。
- source_word: לֹא אוּכַל
  choice: 我不能容忍
  rationale: 字面为“我不能”，在此语境中表达无法忍受；“不能容忍”传达其惯用含义。
- source_word: אָוֶן
  choice: 罪孽
  rationale: 该词可指邪恶、罪孽或祸患；在本段对虚假敬拜的道德谴责中，“罪孽”最贴切。
- source_word: וַעֲצָרָה
  choice: 和庄严聚会
  rationale: עֲצָרָה指礼仪性的节期聚集；“庄严聚会”既说明宗教性质，也使用现代读者易懂的措辞。
theological_decisions:
- issue: 末句中罪孽与敬拜聚会的关系
  choice: 我不能容忍罪孽和庄严聚会
  alternative: 我不能容忍罪孽与庄严聚会并存
  rationale: 希伯来文将“罪孽”和“庄严聚会”直接并列，没有明示介词。正文保留这种简短而尖锐的并置，不把两者关系解释得过满；脚注说明可能隐含“不义与聚会并存”的意思。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“朔日”保留礼仪历法的准确性；破折号呈现希伯来原文后半句突然而紧凑的转折与并置。所有脚注标记均置于其所解释的正文位置。
