base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/028.yaml
  text: But rebels and sinners will be broken together[b][a], and those who forsake Yahweh will come to an end.
translation:
  language: zh_hans
  text: 但悖逆者和罪人必一同破灭[a]；离弃雅威的，必归于终结[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“悖逆者和罪人必一同遭毁灭”；原文用的是可指“破碎、崩毁、毁灭”的名词。
    reason: lexical_alternative
  - marker: b
    text: 或译：“必灭亡”或“必被耗尽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבֶר
  choice: 破灭
  rationale: 该名词有“破碎、崩毁、毁灭”之意；此处置于“悖逆者和罪人”之前，表达他们共同遭受的毁灭。译为“必……破灭”既保留破碎、败亡的具体力度，也符合现代汉语表达。
- source_word: פֹּשְׁעִים
  choice: 悖逆者
  rationale: 源自动词 פשע，指蓄意反叛、背逆的人。“悖逆者”兼顾其道德与盟约关系中的反叛意味。
- source_word: חַטָּאִים
  choice: 罪人
  rationale: 指以犯罪为特征的人。译作“罪人”自然明确，并与强调反叛的“悖逆者”有所区别。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 表示共同或同时承受同一结局；“一同”简洁而庄重。
- source_word: עֹזְבֵי יְהוָה
  choice: 离弃雅威的
  rationale: עזב 的分词表示离开、抛弃；“离弃”保留主动背弃盟约之主的严肃意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，以专名“雅威”呈现，而不以称号替代。
- source_word: יִכְלוּ
  choice: 必被灭尽
  rationale: כלה 在此可指终结、耗尽或灭亡。结合审判语境，“被灭尽”自然有力，同时保留“彻底归于终结”的语义；其他可能译法见脚注。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用现代汉语中较贴近 Yahweh 的音译“雅威”，保留其作为以色列之神盟约名字的性质，不用“主”这一称号替代。
- issue: 首句 שֶׁבֶר 的名词结构
  choice: 译为谓语性的“必一同破灭”
  alternative: “悖逆者和罪人的毁灭”
  rationale: 希伯来文表面以名词“破碎／毁灭”起句，语法简练，可理解为宣告这些人的共同毁灭。汉语采用谓语式更自然，但以脚注保留名词式理解。
- issue: יִכְלוּ 所表达的审判结局
  choice: 必被灭尽
  alternative: 必归于终结／必灭亡
  rationale: 该动词容许“耗尽、完结、灭亡”等含义；正文依上下文选用“被灭尽”，但不把具体灭亡方式进一步限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“悖逆者／罪人”保留原文并列概念的差异；分号呈现两组受审判者之间紧密而平行的关系。所有脚注标记均置于正文相应词句之后。
