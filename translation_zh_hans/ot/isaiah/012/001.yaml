  text: וְ/אָֽמַרְתָּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא אוֹדְ/ךָ֣ יְהוָ֔ה כִּ֥י אָנַ֖פְתָּ בִּ֑/י יָשֹׁ֥ב אַפְּ/ךָ֖ וּֽ/תְנַחֲמֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/001.yaml
  text: And you will say in that day[a], “I will praise you, O Yahweh, for though you were angry with me, your anger has turned away[b], and you comfort me.”
translation:
  language: zh_hans
  text: 到那日，你要说：“雅威啊，我要称颂你[a]！你虽曾向我发怒，你的怒气却转消[b]，你安慰我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称颂”也可译作“感谢”或“称谢”；希伯来语动词可兼指献上感谢和在敬拜中赞美。
    reason: lexical_alternative
  - marker: b
    text: 直译为“你的怒气转回”。“怒气”所译的希伯来语词字面为“鼻子”，可用作表示愤怒的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 你要说
  rationale: 连词加第二人称阳性单数完成式置于先知性语境中，表达将来的行动；现代汉语用“你要说”自然，并保留单数称呼。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的时间表达。“到那日”既自然，也保留指向将来特定日子的庄重语气。
- source_word: אוֹדְךָ
  choice: 我要称颂你
  rationale: ידה的使役式可指感谢、称谢或在敬拜中赞美；此处是得蒙拯救后的颂赞，“称颂”较能兼顾敬拜语境与庄重文体，另义见脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现上帝的专名，而不以“主”这一称号替代；“雅威”是现代汉语中通行且易懂的音译。
- source_word: כִּי אָנַפְתָּ בִּי
  choice: 你虽曾向我发怒
  rationale: כִּי本可表示“因为/原来”，但与后文怒气转消、施以安慰相连时具有让步意味；用“虽曾”自然呈现整句关系，同时“曾”对应此前发怒的情形。
- source_word: יָשֹׁב אַפְּךָ
  choice: 你的怒气却已转消
  rationale: אַף字面与“鼻”有关，在此是表示怒气的惯用语；שׁוב本义为转回、退回。译作“怒气转消”符合现代汉语，并保留怒气撤回的意象。
- source_word: וּתְנַחֲמֵנִי
  choice: 你又安慰了我
  rationale: נחם的加强词干在此意为安慰、抚慰；“又”承接怒气转消后的恩待，“安慰了我”在颂赞话语中表达已经经历的结果。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。译作“雅威”保留其作为专名的性质，避免用称号替代；“耶和华”是传统形式，但较不贴近通常重构的读音。
- issue: כִּי所引分句的逻辑关系
  choice: 你虽曾向我发怒
  alternative: 因为你曾向我发怒；原来你曾向我发怒
  rationale: 希伯来文没有另加明确的让步虚词，因此形式上也可直译为“因为/原来”；但后续“怒气转消—安慰”使整句在语境中形成明显的让步关系。正文用“虽……却……”清楚表达这一关系，不把先前的发怒本身说成称颂的唯一原因。
- issue: יָשֹׁב与וּתְנַחֲמֵנִי的时态或语气
  choice: 作为已经经历的转变与安慰来表达
  alternative: 愿你的怒气转消，愿你安慰我；你的怒气将转消，你将安慰我
  rationale: 希伯来语未完成式在此可按上下文理解为结果、将来或带愿望色彩；传统语境多将其视为怒气已经退去并继而得安慰。正文依颂赞场景采用完成性表达，脚注提示动词字面意象，避免过度扩展语气问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留第二人称单数“你”和先知性短语“到那日”；以“雅威啊”的呼语和感叹号呈现颂赞语气。脚注标记均紧随其所说明的词句。
