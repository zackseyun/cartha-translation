id: ISA.12.2
reference: Isaiah 12:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֨ה אֵ֧ל יְשׁוּעָתִ֛/י אֶבְטַ֖ח וְ/לֹ֣א אֶפְחָ֑ד כִּֽי עָזִּ֤/י וְ/זִמְרָת֙ יָ֣הּ יְהוָ֔ה וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/002.yaml
  text: Behold[a], God is my salvation; I will trust and not be afraid, for Yah, Yahweh, is my strength and song[b], and he has become my salvation.
translation:
  language: zh_hans
  text: 看哪，神是我的拯救！我必信靠，必不惧怕；因为雅，雅威[a]是我的力量，是我的诗歌[b]；他已成了我的拯救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在此并列神名的短式יַהּ（雅）和完整形式יהוה（雅威），形成诗歌性的强调；二者都指同一位神。
    reason: 说明原文神名的特殊并列形式，避免误解为两个对象或单纯的同位改述。
  - marker: b
    text: “我的力量，是我的诗歌……我的拯救”几乎逐字呼应《出埃及记》15:2。
    reason: 指出这句对出埃及之歌的明确文学呼应。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意并加强语气的感叹词。“看哪”保留了先知诗歌庄重而鲜明的语气，在现代中文中也容易理解。
- source_word: אֵל
  choice: 神
  rationale: 此处是诗体中对神的常用称呼；译作“神”直接自然，不额外加入原文未明说的“全能”等含义。
- source_word: יְשׁוּעָתִי / לִישׁוּעָה
  choice: 我的拯救
  rationale: 同一词根在本节开头和结尾重复，形成首尾呼应；两处均译为“我的拯救”，保留这一文学结构及救援、拯救的核心意义。
- source_word: אֶבְטַח
  choice: 我要信靠他
  rationale: 第一人称未完成式在此表达决意和确信。“我要信靠”自然传达这种意志；“他”是中文为明确宾语而补出，所指由上下文清楚限定为神。
- source_word: וְלֹא אֶפְחָד
  choice: 并不惧怕
  rationale: 直接表达否定的恐惧，与前面的信靠构成平行；用“惧怕”保持庄重而不陈旧。
- source_word: עָזִּי
  choice: 我的力量
  rationale: 这是该词的直接含义，也保留了与《出埃及记》15:2的呼应。
- source_word: וְזִמְרָת
  choice: 我的诗歌
  rationale: 依照这一固定诗句及其在《出埃及记》15:2中的对应表达，取“诗歌”义，不将它解释性地改成“赞美”。
- source_word: יָהּ יְהוָה
  choice: 雅——雅威
  rationale: 原文把神名的短式“雅”与完整形式“雅威”并列，具有强烈的诗歌性强调。正文以破折号表现紧密并列，同时保留两个形式，不把其中一个化约成普通称号。
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: 他已成了我的拯救
  rationale: 这里回顾已经实现并持续具有意义的拯救经历；“已成了”既自然，也保留原文“成为”的表达和与句首的重复。
theological_decisions:
- issue: 神名 יָהּ יְהוָה 的译法
  choice: 雅——雅威
  alternative: 耶和华；主；雅，耶和华
  rationale: 原文并非普通称号的重复，而是神名短式与完整形式的并列。音译能较直接地呈现原文现象；脚注说明其结构，避免读者误以为这是两位不同的对象。
- issue: “拯救”的两次重复
  choice: 两处都译作“我的拯救”
  alternative: 分别译作“我的救恩”和“救了我”
  rationale: 原文刻意重复同一名词，既是信仰宣告，也构成诗歌首尾呼应；统一译法避免在译文中提前限定“拯救”的神学范围。
- issue: 与《出埃及记》15:2的关系
  choice: 保留“力量”“诗歌”“拯救”的对应词汇
  alternative: 解释为“保障”“赞美”“得胜”
  rationale: 这些词使本节明显回响出埃及之歌。保留词汇联系可呈现经文间的共鸣，而不额外规定这段新拯救的具体实现方式。
translation_notes:
  register: 采用庄重、清晰的现代标准普通话。“看哪”“惧怕”“诗歌”保留先知诗歌的崇高语体，但句法尽量简明。“雅——雅威”较不寻常，因此用脚注即时解释；正文不以教派传统称谓取代原文两个神名形式。
