  text: צַהֲלִ֥י וָ/רֹ֖נִּי יוֹשֶׁ֣בֶת צִיּ֑וֹן כִּֽי גָד֥וֹל בְּ/קִרְבֵּ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/006.yaml
  text: Cry aloud and shout for joy[a], inhabitant of Zion[b], for great in your midst is the Holy One of Israel.
translation:
  language: zh_hans
  text: 锡安的居民啊，要高声欢呼，欢唱[a]！因为以色列的圣者在你中间，何其伟大！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要高声呼喊，喜乐欢呼！”第二个命令既可表示欢唱，也可表示喜乐的呼喊。
    reason: lexical_alternative
  - marker: b
    text: “住在锡安的居民”和“你”在希伯来文中均为阴性单数；诗歌在此把锡安人格化为一位女子，直接向她说话。
    reason: cultural_note
lexical_decisions:
- source_word: צַהֲלִי
  choice: 高声欢呼
  rationale: 该阴性单数祈使式表示响亮、振奋的呼喊；“高声欢呼”既保留声音的力度，也体现喜乐语境。
- source_word: וָרֹנִּי
  choice: 欢然歌唱
  rationale: 该词可指喜乐的呼喊，也可指欢唱；与前面的“高声欢呼”并列时，以“欢然歌唱”保留其可能的歌唱意味，并避免两个短语完全重复。
- source_word: יוֹשֶׁבֶת צִיּוֹן
  choice: 锡安的居民啊
  rationale: 原文为阴性单数分词，直指一位“居住在锡安者”，同时将锡安人格化；中文用单数式称呼，避免改成复数“居民们”或另译为原文没有的“锡安的女子”。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出发出欢呼与歌唱命令的原因，符合现代汉语。
- source_word: גָדוֹל
  choice: 何其伟大
  rationale: 保留谓语形容词“伟大”的基本意义；“何其”自然传达诗歌中的赞叹语气，但不把含义缩窄为能力上的“大能”。
- source_word: בְּקִרְבֵּךְ
  choice: 在你中间
  rationale: 保留地点意义和第二人称阴性单数的直接称呼，与人格化的锡安相呼应。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 准确保留以赛亚书中具有辨识度的神圣称号，也不添加原文之外的解释。
theological_decisions:
- issue: 锡安作为阴性单数受话者的人格化
  choice: 采用单数称呼“锡安的居民啊”，并以“你中间”继续直接称呼
  alternative: 采用群体性复数“锡安的居民们／锡安的百姓”
  rationale: 原文的祈使式、分词和代词后缀均为阴性单数。保留单数可维持诗歌中锡安被人格化为女子的意象，不把它化约为普通群体称呼。
- issue: 以赛亚书中的神圣称号 קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  alternative: 以色列的至圣者
  rationale: “圣者”直接对应原文，保留这一固定称号的神学分量；“至圣者”会加入原文未明说的最高级色彩。
- issue: גָדוֹל 所表达的神之伟大
  choice: 何其伟大
  alternative: 何等大能
  rationale: 原文只说“伟大”，可能涵盖尊荣、能力和崇高等层面；不专门译成“大能”，以免把语义限定为能力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“啊”标示直接呼语；两个并列命令分别译为“高声欢呼”和“欢然歌唱”，兼顾原文的平行结构与词义差别。正文中的[a]、[b]均与脚注对应。
