  yaml_path: translation/ot/isaiah/012/003.yaml
  text: With joy you will draw water from the springs of salvation[a][b].
translation:
  language: zh_hans
  text: 你们必欢喜地从救恩的泉源取水[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泉源”也可译作“水井”或“泉”。
    reason: lexical_alternative
  - marker: b
    text: “救恩”在本处也可译作“拯救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁאַבְתֶּם
  choice: 你们必……取
  rationale: Qal完成式第二人称阳性复数在先知性语境中自然表达将来；用“必”保留确定的未来意味。句首连接词不单独译出，以符合现代汉语表达。
- source_word: מַיִם
  choice: 水
  rationale: 该复数形式在希伯来语中作物质名词使用，汉语自然译为“水”。
- source_word: בְּ/שָׂשׂוֹן
  choice: 欢喜地
  rationale: 介词ב加名词表示伴随的情状；“欢喜地”在现代汉语中自然，并保留喜乐取水的意味。
- source_word: מִ/מַּעַיְנֵי
  choice: 从……泉源
  rationale: מַעְיָן通常指泉、泉水或水源；“泉源”既贴近天然涌流之水的意象，也适合此处复数形式的集合性表达。
- source_word: הַ/יְשׁוּעָה
  choice: 救恩
  rationale: יְשׁוּעָה可指拯救、解救或得胜；“救恩”保留以赛亚书语境中上帝施行拯救的历史性与较广的神学共鸣。
theological_decisions:
- issue: יְשׁוּעָה应译为偏重现实处境的“拯救”，还是具有更广神学意味的“救恩”
  choice: 救恩
  alternative: 拯救
  rationale: 本章颂扬上帝的拯救作为，既涉及具体的解救，也具有更广的神学深度；“救恩”能保留这种张力，而不额外限定其后来的教义含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“欢喜地……取水”清楚易懂；“泉源”保留诗歌意象，并以脚注呈现词义上的其他可能。
