  text: זַמְּר֣וּ יְהוָ֔ה כִּ֥י גֵא֖וּת עָשָׂ֑ה מידעת זֹ֖את בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/005.yaml
  text: Sing praise to Yahweh[a], for he has done gloriously; let this be made known in all the earth.
translation:
  language: zh_hans
  text: 你们要歌颂雅威，因为他行事威严[a]；愿这事传遍全地。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他威严地行事”，或“因为他行了卓越之事”。
    reason: 保留גֵאוּת在“威严、卓越”之间的词义幅度，以及该短语可作方式或作为内容理解的差异。
  - marker: b
    text: 或译：“这事传遍了全地”或“要使全地都知道这事”。
    reason: 原文形式及上下文容许直陈、愿望或使役式的不同理解。
lexical_decisions:
- source_word: זַמְּרוּ
  choice: 你们要歌颂
  rationale: 该词是复数命令式，指以歌唱或音乐赞美；“你们要歌颂”既体现复数呼召，也符合现代汉语敬拜语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 引出歌颂的理由，汉语用“因为”清楚自然。
- source_word: גֵאוּת עָשָׂה
  choice: 他行事威荣
  rationale: גֵאוּת可指威严、崇高或卓越，与“行”连用时表达其作为彰显威荣；此译避免把抽象单数擅自扩展为多个“荣耀的事”。
- source_word: מידעת זֹאת
  choice: 愿这事传遍
  rationale: 结合上下文的命令和宣告语气，采用愿望式表达；“传遍”在汉语中自然体现使之为人所知的含义，同时以脚注保留直陈式理解。
- source_word: בְּכָל הָאָרֶץ
  choice: 全地
  rationale: 此处颂歌指向普世性的传扬，“全地”简洁地保留原文范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”旨在保留神的专名，而非用“主”等称号替代。
- issue: גֵאוּת עָשָׂה所表达的神之作为
  choice: 他行事威荣
  alternative: 他行了威荣之事
  rationale: 原文使用抽象名词，既可侧重神行事的威严卓越，也可理解为他所行的荣耀之事；正文保留抽象表达，脚注列出自然的另一译法。
- issue: מידעת的语气
  choice: 愿这事传遍全地
  alternative: 这事传遍了全地
  rationale: 上下文连续发出赞美与宣告的呼召，愿望或命令语气较合语境；但词形也容许状态性或直陈式理解，因此不将另一可能完全排除。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“歌颂”“威荣”“全地”保持诗歌体的凝练；补出复数主语“你们”以呈现希伯来语复数命令式。
