id: ISA.12.4
reference: Isaiah 12:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֞ם בַּ/יּ֣וֹם הַ/ה֗וּא הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָֽ/עַמִּ֖ים עֲלִֽילֹתָ֑י/ו הַזְכִּ֕ירוּ כִּ֥י נִשְׂגָּ֖ב שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/004.yaml
  text: 'And you will say on that day: “Give thanks to Yahweh[a]; call on his name. Make his deeds known among the peoples[b]; proclaim that his name is exalted.”'
translation:
  language: zh_hans
  text: '到那日，你们要说：

    “要称谢雅威[a]，求告他的名；

    要在万民中传扬他的作为，

    宣告他的名崇高。[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文神名יהוה（YHWH）；也常译作“耶和华”或“上主”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“要宣告，因为他的名崇高。”希伯来文כִּי既可引出宣告的内容，也可表示原因。
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: 你们要说
  rationale: 该形式为第二人称阳性复数；在先知性语境中自然表达将来的行动。“你们要说”既保留复数对象，也符合现代汉语。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知文学常见的时间标记。“到那日”比直译“在那日”更符合现代汉语，同时保留其指向未来的语感。
- source_word: הוֹדוּ לַיהוָה
  choice: 要称谢雅威
  rationale: ידה的使役命令式在此表示向上帝献上感谢和赞美；“称谢”兼具感恩与颂赞的敬拜语义。יהוה按其专名音译为“雅威”。
- source_word: קִרְאוּ בִשְׁמוֹ
  choice: 求告他的名
  rationale: קרא与בְּשֵׁם连用时常指奉某人的名呼求或向其求告；“求告他的名”保留敬拜和倚靠的含义，避免缩减为单纯公布名字。
- source_word: הוֹדִיעוּ
  choice: 传扬
  rationale: ידע的使役命令式本义为“使人知道”。结合公开向万民述说上帝作为的语境，“传扬”自然表达使其广为人知的行动。
- source_word: בָעַמִּים
  choice: 在万民中
  rationale: 介词ב表示范围，עַמִּים为复数，指众多族群或人民；“在万民中”既保留复数范围，也适合诗歌语体。
- source_word: עֲלִילֹתָיו
  choice: 他的作为
  rationale: 该名词指所行之事，尤其可用于上帝显著的行动。“作为”庄重而宽泛，不额外加入原文未明说的“伟大”或“大能”。
- source_word: הַזְכִּירוּ
  choice: 宣告
  rationale: זכר的使役形式可指使人记得、提说或宣扬；在与“传扬”平行的公开颂赞语境中，“宣告”最自然地传达其言说行动。
- source_word: כִּי נִשְׂגָּב שְׁמוֹ
  choice: 他的名崇高
  rationale: נשגב表示高升、崇高或尊荣。“崇高”准确传达其威严；כִּי可引出宣告的内容，也可表示原因，正文采用内容解读，另一可能保留在脚注。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。正文用“雅威”音译，以显明这是上帝的专名；脚注说明原文形式及常见替代译法，不把传统称谓混同为原文本身的普通名词。
- issue: הַזְכִּירוּ之后כִּי的句法作用
  choice: 将כִּי理解为引出宣告内容：宣告他的名崇高
  alternative: 将כִּי理解为原因：要宣告，因为他的名崇高
  rationale: 两种分析在语法上都成立。正文的内容从句读法与“宣告”衔接自然，也维持一连串命令的诗歌结构；脚注保留原因读法，以免消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话。四个命令句以“要”贯串，呈现公共敬拜和向万民宣扬的语气；分行保留希伯来诗歌的平行结构。
