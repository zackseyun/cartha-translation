  text: שְׁבִ֥י דוּמָ֛ם וּ/בֹ֥אִי בַ/חֹ֖שֶׁךְ בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ גְּבֶ֖רֶת מַמְלָכֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/005.yaml
  text: Sit in silence[a], and go into darkness, daughter of the Chaldeans; for no longer will they call you the mistress of kingdoms.
translation:
  language: zh_hans
  text: 默然坐下，进入黑暗之中，迦勒底的女儿！因为人们不再称你为“列国的女主人”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国的主母”。
    reason: גְּבֶרֶת可指女主人、主母或有尊位的女子；“主母”是词汇上的可能译法，但在现代汉语中可能被理解为母亲身份，故正文采用“女主人”。
lexical_decisions:
- source_word: שְׁבִי דוּמָם
  choice: 静静坐着
  rationale: שְׁבִי是对拟人化女性对象发出的单数阴性命令“坐下”；דוּמָם表示无声、静默。合译为“静静坐着”，自然地保留受辱后沉寂不语的画面。
- source_word: וּבֹאִי בַחֹשֶׁךְ
  choice: 进入黑暗吧
  rationale: בוא的阴性单数命令式与介词ב共同表达进入某种境地；直译“进入黑暗”保留先知文本具体而含蓄的审判意象。
- source_word: בַּת כַּשְׂדִּים
  choice: 迦勒底的女儿
  rationale: 保留希伯来先知文学中将城邦或民族人格化为女子的称呼，不增添本节没有的“童女”或“巴比伦”等词。
- source_word: לֹא תוֹסִיפִי יִקְרְאוּ לָךְ
  choice: 人们不再称你为
  rationale: 否定词与יסף构成“不再”的惯用表达；第三人称复数יִקְרְאוּ在此为不定施事者，用现代汉语“人们”表达清楚自然。
- source_word: גְּבֶרֶת מַמְלָכוֹת
  choice: 列国的女主人
  rationale: גְּבֶרֶת可指女主人、主母或有权势的女子，מַמְלָכוֹת为复数“诸国、列国”。“列国的女主人”既保留女性人格化，也传达她从前凌驾诸国的地位，而不将其具体化为王后。
theological_decisions:
- issue: 黑暗所表达的审判与失势
  choice: 正文直译为“黑暗”
  alternative: 隐没、幽暗、默默无闻
  rationale: 原文采用具体的黑暗意象，可同时暗示羞辱、失势与被人遗忘；直译避免只选定其中一种解释。
- issue: 将迦勒底人格化为女性
  choice: 保留“迦勒底的女儿”和女性称号“女主人”
  alternative: 直接改称巴比伦或迦勒底国
  rationale: 女性人格化是本节讽刺与审判修辞的重要组成部分，应在中文中保留。
- issue: גְּבֶרֶת的社会与政治含义
  choice: 译为“女主人”
  alternative: 主母、贵妇、女王
  rationale: 原词表达女性的尊位和支配地位，但没有明确限定为王室头衔；“女主人”保留这一张力，避免过度解释为“女王”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前半句依原文保留两个连续命令，并以“吧”体现直接呼告；后半句用“人们”自然表达希伯来语不定的第三人称复数主语。引号标明被称呼的尊号。
