  text: וַ/תִּבְטְחִ֣י בְ/רָעָתֵ֗/ךְ אָמַרְתְּ֙ אֵ֣ין רֹאָ֔/נִי חָכְמָתֵ֥/ךְ וְ/דַעְתֵּ֖/ךְ הִ֣יא שׁוֹבְבָ֑תֶ/ךְ וַ/תֹּאמְרִ֣י בְ/לִבֵּ֔/ךְ אֲנִ֖י וְ/אַפְסִ֥/י עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/010.yaml
  text: You trusted in your wickedness; you said[a], ‘No one sees me.’ Your wisdom and your knowledge led you astray, and you said in your heart, ‘I am, and there is no one besides me.’
translation:
  language: zh_hans
  text: 你倚仗自己的邪恶，说：“没有人看见我。”你的智慧和知识使你误入歧途；你心里说：“唯有我，除我以外再没有谁[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“唯有我，此外再没有什么。”希伯来语这一表达也可作较抽象的理解；在这里，它很可能是在宣称巴比伦无可匹敌。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּבְטְחִי
  choice: 你倚仗
  rationale: בּטח在此表示信赖、依靠；“倚仗”既自然，也带出巴比伦以邪恶为凭恃的责备意味。
- source_word: בְרָעָתֵךְ
  choice: 自己的邪恶
  rationale: רָעָה可指邪恶或灾祸；本节所述是隐秘作恶和骄傲自恃，因此取道德意义“邪恶”。
- source_word: אֵין רֹאָנִי
  choice: 没有人看见我
  rationale: 直接表达存在否定词与“看见我”的分词结构，保留自以为无人察觉的语气。
- source_word: חָכְמָתֵךְ וְדַעְתֵּךְ
  choice: 你的智慧和知识
  rationale: 分别保留“智慧”与“知识”，维持希伯来文的并列结构和反讽意味。
- source_word: הִיא שׁוֹבְבָתֶךְ
  choice: 使你走迷了路
  rationale: 该表达指使人偏离或误入歧途；“走迷了路”在现代汉语中清楚自然，并保留道德与属灵方向上的迷失。
- source_word: בְלִבֵּךְ
  choice: 你心里说
  rationale: 保留希伯来语“在心里”的意象，同时采用自然的汉语表达内在自语。
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: 唯有我，除我以外再没有谁
  rationale: 保留原文强烈、排他的自我宣称。“谁”符合拟人化巴比伦的语境，也使这句话与《以赛亚书》中排他性宣告的反响仍可听见，而不把两者等同。
theological_decisions:
- issue: 如何翻译אֲנִי וְאַפְסִי עוֹד，既保留它与《以赛亚书》中上帝排他性宣告的修辞呼应，又不夸大两者的同一性
  choice: 唯有我，除我以外再没有谁
  alternative: 唯有我，此外再没有什么
  rationale: 正文采用人格性的“谁”，更符合巴比伦作为拟人化城市自夸为无可匹敌者的上下文；脚注保留较抽象的译法，以呈现希伯来语表达本身的范围和歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倚仗自己的邪恶”保留先知责备的力度；末句刻意保持简短、绝对的自夸口吻。脚注标记置于其实际所解释的末句之后。
