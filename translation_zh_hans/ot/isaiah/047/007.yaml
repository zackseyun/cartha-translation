base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/007.yaml
  text: You said[a], ‘I will be mistress forever,’ so that you did not take these things to heart[c][b]; you did not remember her end.
translation:
  language: zh_hans
  text: 你说：“我必永远作女主人[a]。”以致[b]你没有把这些事放在心上，也没有想到她的结局[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女主人”也可译作“居主位的妇人”。原文指有地位或支配权的女性，并不一定是“女王”。
    reason: lexical_alternative
  - marker: b
    text: “以致”所译的希伯来语表达也可较直译为“直到……也没有”。在这里可理解为前一句自夸所导致的结果。
    reason: alternative_reading
  - marker: c
    text: 原文直译为“她的结局”（也可按语法译作“它的结局”），使用阴性单数后缀；这里最自然地指本段拟人化为女性的巴比伦。
    reason: ambiguity
lexical_decisions:
- source_word: וַתֹּאמְרִי
  choice: 你说
  rationale: 动词为阴性单数第二人称，直接对拟人化为女性的巴比伦说话；叙事连接词 וַ 在现代汉语中不必机械译作“于是”。
- source_word: לְעוֹלָם אֶהְיֶה
  choice: 我必永远作
  rationale: לְעוֹלָם 表达持续到永远的自夸，אֶהְיֶה 在这里是将来意义；“必”自然传达其笃定口吻。
- source_word: גְבָרֶת
  choice: 女主人
  rationale: 该词指有地位、权势或支配权的女性；“女主人”保留女性身份和居于主位的意味，同时不擅自具体化为“女王”。
- source_word: עַד לֹא
  choice: 以致
  rationale: 此处连接前面的狂妄宣称与后面的不加思量，可自然理解为结果；脚注保留较贴近字面的时间性读法。
- source_word: שַׂמְתְּ אֵלֶּה עַל לִבֵּךְ
  choice: 你没有把这些事放在心上
  rationale: 保留希伯来语“把……放在心上”的心灵隐喻，在现代汉语中也自然表达认真思量、重视。
- source_word: לֹא זָכַרְתְּ אַחֲרִיתָהּ
  choice: 也没有想到结局会怎样
  rationale: זכר 在语境中有记在心里、顾念之意；此译自然表达未曾思量最终结果，并避免在正文中武断确定阴性单数后缀的指向。
theological_decisions:
- issue: 巴比伦的女性拟人化
  choice: 以“女主人”保留女性拟人和居于支配地位的自夸
  alternative: 译作“掌权者”或“女王”
  rationale: “掌权者”会淡化原文明确的女性形式；“女王”则加入原文未明说的王室头衔。
- issue: אַחֲרִיתָהּ 的阴性单数后缀所指
  choice: 正文译为“结局会怎样”，脚注说明可能所指
  alternative: 明确译作“她的结局”或“这些事的结局”
  rationale: 原文后缀为阴性单数，但其所指存在解释空间，可能关联女性拟人化的巴比伦，也可能概括前述这一切的最终结果；正文保留开放性，避免消解歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把这些事放在心上”既符合现代汉语习惯，也保留原文的心灵隐喻；引语后的短句体现先知话语的警告力度。
