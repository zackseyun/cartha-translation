  text: וְ/עַתָּ֞ה שִׁמְעִי זֹ֤את עֲדִינָה֙ הַ/יּוֹשֶׁ֣בֶת לָ/בֶ֔טַח הָ/אֹֽמְרָה֙ בִּ/לְבָ֔בָ/הּ אֲנִ֖י וְ/אַפְסִ֣/י ע֑וֹד לֹ֤א אֵשֵׁב֙ אַלְמָנָ֔ה וְ/לֹ֥א אֵדַ֖ע שְׁכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/008.yaml
  text: Then[a], hear this, you lover of luxury, who sit securely, who say in your heart, ‘I am, and there is no one besides me. I will not sit as a widow[c][b], nor will I know the loss of children.’
translation:
  language: zh_hans
  text: '现在，你这娇养奢华、安然居住的女子啊，要听这话！你心里说：


    “惟有我，除我以外再没有别的。[a]


    我绝不会寡居，


    也绝不会经历丧子之痛。[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“惟有我，除我以外再没有谁。”这句话是自称无可匹敌的狂妄宣告。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“知道丧子”，意思是亲身经历失去儿女。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 该表达明确标示话语转折并引入直接斥责；现代汉语用“现在”自然有力。
- source_word: עֲדִינָה
  choice: 贪享奢华的女子
  rationale: 该阴性形容词含娇养、柔弱及奢华享受之意；结合巴比伦安逸自纵的语境，“贪享奢华”传达其讽刺和道德色彩，“女子”则显明拟人化称呼。
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  choice: 安然居住
  rationale: 分词与לָבֶטַח表达安稳无忧的定居状态；“安然居住”贴近原意，又不额外断定这种安全只是疏忽大意。
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: 唯有我，除我以外再没有谁
  rationale: 保留其排他性的自我宣称，并以自然汉语呈现指向人格对象的理解；“谁”符合拟人化巴比伦的语境。
- source_word: לֹא אֵשֵׁב אַלְמָנָה
  choice: 我绝不会寡居
  rationale: “寡居”自然表达作为寡妇生活的状态；否定语境中的未完成式带有自信断言，“绝不会”体现其狂妄笃定的口气。
- source_word: שְׁכוֹל
  choice: 丧子之痛
  rationale: 该词指因失去儿女而遭受的丧亲，不是单指不育；此译明确其具体含义。
- source_word: אֵדַע
  choice: 经历
  rationale: 原文“知道”在这里具有亲身体验之意；汉语说“经历丧子之痛”比“知道丧子”自然，同时保存经验性语义。
theological_decisions:
- issue: 巴比伦的排他性自我宣称 אֲנִי וְאַפְסִי עוֹד
  choice: 唯有我，除我以外再没有谁
  alternative: 只有我，再没有别的
  rationale: 所选译文保留与本书中上帝独一宣告相呼应的措辞，使巴比伦僭越自大的意味自行显出，而不在正文中替读者解释或消解这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知性斥责语体。以“女子”维持巴比伦的阴性拟人形象；诗行分排突出她两重自信的宣告。所有脚注标记均置于相关正文之后。
