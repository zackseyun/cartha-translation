base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/004.yaml
  text: Our Redeemer—Yahweh of Armies is his name—is the Holy One of Israel[a][b].
translation:
  language: zh_hans
  text: 我们的救赎主[b]——万军之耶和华是他的名[a]——是以色列的圣者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”也可按这个希伯来神名通常重建的读音译作“雅威”；“万军之耶和华”传统上也译作“万军之主”。
    reason: lexical_alternative
  - marker: b
    text: “救赎主”所译的希伯来词也可指履行赎回责任的“至亲救赎者”，带有亲属、法律和盟约方面的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֲלֵנוּ
  choice: 我们的救赎主
  rationale: 该分词作名词使用，意为“救赎我们的那一位”。“救赎主”既自然，又保留 גאל 所含的法律、盟约和亲属代赎背景；经文本身并未在此明说亲属关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”对应四字神名，避免将其仅译为称号“主”。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 在固定称号 יְהוָה צְבָאוֹת 中采用中文圣经传统且仍可理解的“万军之耶和华”；这里的“军”涵盖受神统领的众军。
- source_word: שְׁמוֹ
  choice: 他的名是
  rationale: 希伯来语为名词句；中文补出“是”，清楚保留“他的名”为插入说明的结构。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 保留以赛亚书中反复出现的固定神圣称号，并以自然、庄重的现代汉语表达。
theological_decisions:
- issue: 神名与称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 雅威——万军之主；万军之主
  rationale: 原文直接使用神的专名，并与 צְבָאוֹת 构成固定称号。“万军之耶和华”兼顾专名、传统辨识度和庄重语体；脚注列出更贴近可能发音的“雅威”。
- issue: גֹּאֵל 的神学与法律内涵
  choice: 救赎主
  alternative: 至亲救赎者；救赎者
  rationale: “救赎主”保留此处作为神之称号的分量，但不把词根在某些法律语境中的“近亲”含义强行明说；该层含义在脚注中提示。
- issue: 句法关系
  choice: 将“他的名是万军之耶和华”作为插入说明，并以“是以色列的圣者”续接
  alternative: 我们的救赎主名叫万军之耶和华，以色列的圣者
  rationale: 原文的简短名词结构可有标题并列或述谓式理解。破折号保留诗句中各神圣称号之间紧密而略带压缩的关系，避免过度解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“我们的救赎主”前置以贴合原文；两个破折号呈现 שְׁמוֹ 的插入性说明。脚注标记均置于正文中：神名称号后的[a]对应神名及称号译法，句末[b]补充“救赎主”的词义背景。
