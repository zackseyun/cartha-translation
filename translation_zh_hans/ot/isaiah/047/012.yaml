  text: עִמְדִי נָ֤א בַ/חֲבָרַ֨יִ/ךְ֙ וּ/בְ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בַּ/אֲשֶׁ֥ר יָגַ֖עַתְּ מִ/נְּעוּרָ֑יִ/ךְ אוּלַ֛י תּוּכְלִ֥י הוֹעִ֖יל אוּלַ֥י תַּעֲרֽוֹצִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/012.yaml
  text: Stand now with your enchantments and with your many sorceries[a], in which you have labored from your youth; perhaps you may be able to profit[b], perhaps you may inspire terror.
translation:
  language: zh_hans
  text: 现在，你只管坚持倚仗你的符咒[a]和众多邪术吧！你从幼年起就在这些事上劳苦。也许你能从中得益，也许你能使人恐惧。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “符咒”或译“咒语”。原词可指用于施法或束缚的咒语。
    reason: lexical_alternative
  - marker: b
    text: “使人恐惧”或译“制伏敌手”。原文动词可表示使对方恐惧或受到震慑。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמְדִי נָא
  choice: 现在，你只管坚持
  rationale: עמד的阴性单数祈使式配合נא，在本段审判语境中带有催促而讥讽的语气。“坚持”比单说“站立”更自然地表达继续倚仗这些做法，同时不在正文中明说讥讽。
- source_word: בַחֲבָרַיִךְ
  choice: 使用你的符咒
  rationale: חֲבָרִים在此指具有束缚、施法性质的咒语或法术。“符咒”是现代汉语中清楚而庄重的对应词，并与下文“邪术”形成近义平行。
- source_word: וּבְרֹב כְּשָׁפַיִךְ
  choice: 和众多邪术
  rationale: רֹב表示数量众多，כְּשָׁפִים指反复施行的巫术行为。“众多邪术”保留数量和复数实践的意味。
- source_word: בַּאֲשֶׁר יָגַעַתְּ מִנְּעוּרָיִךְ
  choice: 你从年轻时就为这些劳苦
  rationale: יגע含辛劳、疲乏之意；此译保留长期付出劳力的意味，并让关系从句在汉语中自然成句。
- source_word: אוּלַי תּוּכְלִי הוֹעִיל
  choice: 也许你能从中得益
  rationale: יכל与הועיל连用，表示有能力取得益处或优势。“从中得益”明确所期待的益处来自前述法术，也保留讥讽性的“也许”。
- source_word: אוּלַי תַּעֲרוֹצִי
  choice: 也许你能使人惧怕
  rationale: ערץ可表示使对手恐惧、震慑对方。“使人惧怕”保留其使役或结果意味；“制伏敌手”作为语境性替代译法列入脚注。
theological_decisions:
- issue: 对巴比伦说话的语气
  choice: 保留命令句和两个“也许”，让讥讽从上下文自然显出
  alternative: 在正文中直说“尽管试试”或“看能不能”，强化嘲弄意味
  rationale: 上下文表明这是对巴比伦倚仗邪术的讥讽，但原文没有另加解释性词语；译文因此不把隐含语气改写成明说的评论。
- issue: 邪术可能带来的结果
  choice: 分别译作“得益”和“使人惧怕”
  alternative: 将末句译作“也许你能取胜”或“制伏敌手”
  rationale: 原文保留了获益与震慑之间的张力；正文采用较直接的词义，不把它收窄为军事胜利。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“只管坚持……吧”传达审判语境中的讥讽，却不额外加入解释；句式分为三句，以保持先述长期倚仗、再述两个不确定结果的推进。
