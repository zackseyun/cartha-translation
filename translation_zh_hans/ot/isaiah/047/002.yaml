base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/002.yaml
  text: Take the millstones and grind flour[a]; uncover your veil, strip off your skirt, uncover the leg[c][b], cross over the rivers.
translation:
  language: zh_hans
  text: 拿起磨石，磨面；揭去你的面纱[a]，撩起你的裙摆[b]，露出腿来[c]，蹚过河流。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “面纱”或译“发绺”或“头发”。
    reason: lexical_alternative
  - marker: b
    text: “裙摆”或译“拖曳的衣襟”。
    reason: lexical_alternative
  - marker: c
    text: “腿”也可能特指“小腿”或“大腿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחִי רֵחַיִם
  choice: 拿起磨石
  rationale: קְחִי是对阴性单数对象的命令，意为“拿起”；רֵחַיִם指磨或磨石。译作“拿起磨石”保留具体劳作图景，并符合现代汉语表达。
- source_word: וְטַחֲנִי קָמַח
  choice: 来磨面
  rationale: טחן意为“磨”，קמח指面粉；汉语“磨面”自然地表达把谷物磨成面粉的劳作，也保留屈尊从事苦役的意象。
- source_word: גַּלִּי צַמָּתֵךְ
  choice: 揭去你的面纱
  rationale: גַּלִּי意为揭开、显露；צַמָּה可指面纱，也可能涉及发绺或头发。正文采用符合连续除去遮蔽物语境的“面纱”，并以脚注保留歧义。
- source_word: חֶשְׂפִּי שֹׁבֶל
  choice: 撩起你的裙摆
  rationale: חשׂף表示使裸露、揭开；שֹׁבֶל指衣服下垂或拖曳的部分。为与随后蹚河的场景相合，译作自然的“撩起你的裙摆”，不把该词限定为礼服式的拖尾。
- source_word: גַּלִּי שׁוֹק
  choice: 露出腿来
  rationale: שׁוֹק可泛指腿，也可较具体地指小腿或大腿。正文用不作过度限定的“腿”，脚注列出可能的具体理解。
- source_word: עִבְרִי נְהָרוֹת
  choice: 蹚过河流
  rationale: עבר表示经过、越过；结合前面露腿的动作，“蹚过”自然呈现涉水过河的场景。נהרות通常指河流，复数意义予以保留。
theological_decisions:
- issue: 羞辱与暴露意象的性质
  choice: 将本节译为一连串命令，表现巴比伦被迫失去尊荣、从事劳役并涉水而行的公开羞辱。
  alternative: 把这些动作处理成更明确的性化暴露。
  rationale: 原文确有逐步揭露身体和失去王室尊严的羞耻意象，但没有必要把它强化为比词义本身更露骨的性描写。译文保留其张力而不加码解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。分号区分劳役命令与连续显露、涉水的动作；三个脚注标记均置于对应词语之后。
