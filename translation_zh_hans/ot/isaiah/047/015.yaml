base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/015.yaml
  text: So have those with whom you labored become to you—your merchants from your youth[a]. Each one wanders to his own quarter; there is no one to save you.
translation:
  language: zh_hans
  text: 这就是你所劳碌经营的那些人——自你幼年以来的商人——对你的结果：他们各人朝自己的方向游荡而去[a]；没有人能救你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朝自己的方向”也可译作“各自走向一边”、“各往自己的方向”或“各自越过自己的路”。希伯来语表达简练，重点可能在于他们四散而去，而非某个明确目的地。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן הָיוּ לָךְ
  choice: 对你竟是这样
  rationale: 表达“结果竟成了这样”的总结意味，并保留这些人最终对巴比伦毫无助益的语气。
- source_word: אֲשֶׁר יָגָעַתְּ
  choice: 你与之劳碌的那些人
  rationale: יגע表示劳碌、辛劳；此处关系结构简略，译作“与之劳碌”既贴近上下文中的长期交往，也避免过度限定为“为他们”或“经营他们”。
- source_word: סֹחֲרַיִךְ מִנְּעוּרַיִךְ
  choice: 从你幼年就有的商人
  rationale: סחר指商人或贸易者；“从你幼年”延续将巴比伦人格化的表达，强调这种关系由来已久。
- source_word: אִישׁ לְעֶבְרוֹ
  choice: 各奔一方
  rationale: איש在此作分配用法，意为“各人”；עבר可指一边、方向或区域。“各奔一方”自然地传达四散而去，同时不把目的地说得过于具体。
- source_word: תָּעוּ
  choice: 各自流离
  rationale: תעה表示迷行、漂泊或走散；“流离”保留无定向、失散的意味，并与“各奔一方”共同呈现分散情景。
- source_word: אֵין מוֹשִׁיעֵךְ
  choice: 没有人能救你
  rationale: מוֹשִׁיעַ指施救、解救者；“救”简洁直接，既符合眼前脱离灾祸的语境，也保留原词较广的神学分量。
theological_decisions:
- issue: מוֹשִׁיעֵךְ的译法
  choice: 没有人能救你
  alternative: 没有人能解救你／无人搭救你
  rationale: “救”是直接而有分量的对应词，既可指从当前灾难中获救，又不把本节狭义化为某一特定教义命题。
- issue: 商人与“劳碌的那些人”的关系
  choice: 以同位插入语处理
  alternative: 将“商人”另起为独立主语
  rationale: 希伯来语句法简练，可把“你的商人”视为对前述对象的进一步说明；破折号保留这种紧密联系，同时不额外解释他们具体是商业伙伴、术士或其他群体。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用破折号呈现希伯来语中的同位补充关系；“竟”传达总结性审判语气。“各自流离，各奔一方”兼顾תעו的漂泊含义与איש לעברו的分散方向感。
