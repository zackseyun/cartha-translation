id: ISA.47.1
reference: Isaiah 47:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רְדִ֣י וּ/שְׁבִ֣י עַל עָפָ֗ר בְּתוּלַת֙ בַּת בָּבֶ֔ל שְׁבִי לָ/אָ֥רֶץ אֵין כִּסֵּ֖א בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ רַכָּ֖ה וַ/עֲנֻגָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/001.yaml
  text: Come down and sit in the dust[a], virgin daughter Babylon; sit on the ground without a throne, daughter of the Chaldeans[d][c][b]. For they will no longer call you tender and delicate.
translation:
  language: zh_hans
  text: 下来，坐在尘土中吧[a]，巴比伦的处女[b]！迦勒底人之女啊，坐在地上吧，没有宝座[c]！因为人不再称你为娇嫩、娇贵[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“下去，坐在尘土中吧。”
    reason: lexical_alternative
  - marker: b
    text: “巴比伦的处女”是诗性拟人，把巴比伦城及其帝国描绘成一位年轻、尊贵的女子。
    reason: cultural_note
  - marker: c
    text: 或译：“无宝座可坐”。
    reason: lexical_alternative
  - marker: d
    text: 也可译作“柔软、养尊处优”或“娇嫩、安逸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְדִי
  choice: 下来
  rationale: 阴性单数命令式，指从尊贵高位降下；“下来”在现代汉语中自然，并保留审判和降卑的意味。“下去”也有可能，故列入脚注。
- source_word: וּשְׁבִי / שְׁבִי
  choice: 坐在／坐在
  rationale: 两次均译作“坐在”，保留原文的重复和命令语气；上下文所指是降卑地坐下，并非居住。
- source_word: עַל עָפָר
  choice: 在尘土中
  rationale: 希伯来语字面为“在尘土之上”；汉语“坐在尘土中”更自然，也清楚传达受辱、降卑的意象。
- source_word: בְּתוּלַת בַּת בָּבֶל
  choice: 处女巴比伦之女
  rationale: 保留原文紧密的诗性称谓及其女性拟人形象，不将其简化为“巴比伦”。脚注说明这是对城邦或帝国的拟人化称呼。
- source_word: לָאָרֶץ
  choice: 在地上
  rationale: 与“坐”连用时表示就坐之处；“坐在地上”是自然的现代汉语，并与前句“尘土中”平行。
- source_word: אֵין כִּסֵּא
  choice: 不再有宝座
  rationale: 无动词句可理解为“没有宝座”或“无宝座可坐”。正文用“不再有宝座”结合上下文表达王权被夺，但以脚注保留较字面的其他理解。
- source_word: בַּת כַּשְׂדִּים
  choice: 迦勒底人之女
  rationale: 忠实反映复数族称“迦勒底人”，同时保留与“巴比伦之女”对应的拟人化称号。
- source_word: כִּי לֹא תוֹסִיפִי
  choice: 因为……不再
  rationale: יסף与后续动词连用表示某事不再继续；汉语以“不再”简洁表达。
- source_word: יִקְרְאוּ לָךְ
  choice: 人……称你为
  rationale: 第三人称复数在此为泛指。译作“人……称你为”比指定某一群体更合适，也自然传达类似被动的意义。
- source_word: רַכָּה
  choice: 娇嫩
  rationale: 可指柔软、柔弱或娇嫩；与下一词连用时，“娇嫩”能体现养尊处优的形象而不过度解释。
- source_word: וַעֲנֻגָּה
  choice: 柔弱
  rationale: 该词可含娇贵、安逸、养尊处优之意。正文“柔弱”与“娇嫩”构成自然搭配；脚注提示“娇贵、养尊处优”这一较强语义可能。
theological_decisions:
- issue: 巴比伦的女性王室拟人形象
  choice: 保留“处女巴比伦之女”和“迦勒底人之女”两个诗性称谓
  alternative: 简化为“巴比伦”或改写为“处女般的巴比伦”
  rationale: 本节把巴比伦描绘成从王位跌落、蒙受羞辱的年轻尊贵女子。保留双重称谓，才能维持审判诗歌的文学张力和神学力度。
- issue: “处女”所表达的含义
  choice: 按原文直译为“处女”，不在正文中界定其象征含义
  alternative: 解释性译为“未被征服的”或“年轻的”
  rationale: 此称谓可能唤起未受侵犯、年轻尊贵等多重联想。正文不把这些可能性缩减为单一解释，脚注只说明其拟人功能。
- issue: 宝座丧失与降卑的关系
  choice: 译作“不再有宝座”，呈现昔日王权被剥夺的语境含义
  alternative: 较字面译作“没有宝座”或“无宝座可坐”
  rationale: 上下文显然表现巴比伦从尊位降到尘土，但原句结构简短，故脚注保留其句法和翻译上的可能范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以感叹号呈现连续命令和先知嘲讽的力度；保留“巴比伦之女／迦勒底人之女”的诗性平行与女性拟人。避免古奥的“降下”“席地”等措辞，也不把“处女”或“柔弱”解释成特定教义。
