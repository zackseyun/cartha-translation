  rationale: 修订使“不再”明确修饰“称你为”，恢复原文无动词句“没有宝座”的简洁性；同时以更自然的现代汉语处理巴比伦的诗性拟人，并以“娇贵”补足末词所指的奢逸、娇养意味。脚注锚点均保留并与相应正文相连。
