  text: וּ/בָ֧א עָלַ֣יִ/ךְ רָעָ֗ה לֹ֤א תֵדְעִי֙ שַׁחְרָ֔/הּ וְ/תִפֹּ֤ל עָלַ֨יִ/ךְ֙ הֹוָ֔ה לֹ֥א תוּכְלִ֖י כַּפְּרָ֑/הּ וְ/תָבֹ֨א עָלַ֧יִ/ךְ פִּתְאֹ֛ם שׁוֹאָ֖ה לֹ֥א תֵדָֽעִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/011.yaml
  text: But evil will come upon you[a]; you will not know how to charm it away. And disaster will fall upon you; you will not be able to atone for it. And ruin will come upon you suddenly[b], which you do not foresee.
translation:
  language: zh_hans
  text: 然而，灾祸必临到你；你不知道怎样用法术将它驱散。[a] 灾难必落在你身上；你无法消除它。[b] 你意想不到的毁灭必突然临到你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文含义不易确定。也可按字面理解为“你不知道它的曙光”，或译作“你不知道怎样避开它”。这里结合上下文所说的邪术和符咒，译作“用法术将它驱散”。
    reason: lexical_alternative
  - marker: b
    text: “消除它”所译的希伯来语动词通常有“遮盖、洁除、赎罪”的意思；本句也可较直译为“你无法赎除它”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: 灾祸
  rationale: 该词既可指道德上的恶，也可指临到人的祸患；本节与“灾难”“毁灭”平行，语境明确指审判所带来的灾祸。
- source_word: שַׁחְרָהּ
  choice: 怎样用法术将它驱散
  rationale: 此词形含义有争议。结合上文对巴比伦邪术和符咒的讥讽（47:9、12），主文采用“以法术驱散”的语境义，同时在脚注保留“它何时出现”等可能解释。
- source_word: הֹוָה
  choice: 灾难
  rationale: 表示破坏性的祸患或灾难；与前面的“灾祸”和后面的“毁灭”共同形成递进的平行表达。
- source_word: כַּפְּרָהּ
  choice: 消除它
  rationale: כפר的基本语义涉及遮盖、洁除或赎除；在这里以灾难为宾语，重点是巴比伦无法将它除去。主文用自然汉语表达语境义，脚注保留其“赎除”的词汇色彩。
- source_word: פִּתְאֹם
  choice: 突然
  rationale: 准确表达事情毫无预警、骤然发生。
- source_word: שׁוֹאָה
  choice: 毁灭
  rationale: 指严重的荒废、毁坏或毁灭；“毁灭”简明而有力度，适合审判宣告的语体。
- source_word: לֹא תֵדָעִי
  choice: 你意想不到的
  rationale: 直译为“你不知道”；末句所不知道的内容在希伯来文中未明说。汉语以“意想不到”自然表达毁灭突然而且未被预见的意思。
theological_decisions:
- issue: 审判语境中כפר的译法
  choice: 主文译为“消除它”，脚注注明“赎除它”
  alternative: 你无法为它赎罪／你无法赎除它
  rationale: 这里不是在正面阐述祭祀赎罪，而是在宣告巴比伦无力除掉临到她的灾难。“消除”符合直接语境；脚注保留该词与遮盖、洁除、赎罪相关的词汇张力，避免把其意义完全压平。
- issue: 末句לֹא תֵדָעִי的隐含宾语
  choice: 译为“你意想不到的”
  alternative: 你不知道的
  rationale: 希伯来文只说“你不知道”，没有明确说明是不知道其来临、时间还是性质。“意想不到”在汉语中承接“突然”，但不把未知内容限定得过细。
translation_notes:
  register: 采用现代、庄重而清楚的审判宣告语体。三个近义灾祸词分别译为“灾祸—灾难—毁灭”，保留希伯来诗句的平行与递进；第二人称阴性单数在汉语中统一作“你”，所指为拟人化的巴比伦。
