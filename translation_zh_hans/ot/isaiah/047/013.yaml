  text: נִלְאֵ֖ית בְּ/רֹ֣ב עֲצָתָ֑יִ/ךְ יַעַמְדוּ נָ֨א וְ/יוֹשִׁיעֻ֜/ךְ הברו שָׁמַ֗יִם הַֽ/חֹזִים֙ בַּ/כּ֣וֹכָבִ֔ים מֽוֹדִיעִם֙ לֶ/חֳדָשִׁ֔ים מֵ/אֲשֶׁ֥ר יָבֹ֖אוּ עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/013.yaml
  text: You are wearied by your many counsels[a]. Let them stand now and save you—those who divide the heavens, who gaze at the stars[b], who make known month by month what will come upon you.
translation:
  language: zh_hans
  text: 你因诸多谋划而疲惫不堪。就让那些划分天宇的人[a]、观望星辰的人，以及按月预告将要临到你之事的人[b]，现在站出来救你吧！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “划分天宇”原文含义不确定；也可译作“把天空分区的人”，很可能指为占星推断而划分天区的人。
    reason: lexical_alternative
  - marker: b
    text: “按月预告”也可理解为“在每逢新月时预告”。原文可能特指按月份或新月周期作出的预测。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִלְאֵית
  choice: 你……疲惫不堪
  rationale: 该词是 לאה 的尼法勒完成式阴性单数第二人称，表示已经变得疲惫、精疲力竭；译文保留其结果意味，也与拟人化为女性的巴比伦相称。
- source_word: בְּרֹב עֲצָתָיִךְ
  choice: 因诸多谋划
  rationale: עֵצָה 可指谋略、计策或意见；介词 ב 在此表达致使或伴随关系。“诸多谋划”既保留数量繁多之意，也符合上下文中巴比伦倚仗各种智谋与秘术的语境。
- source_word: יַעַמְדוּ נָא וְיוֹשִׁיעֻךְ
  choice: 就让……现在站出来救你吧
  rationale: 未完成式配合 נָא 构成带讽刺意味的挑战。“站出来”自然表达挺身应对，“救你”保留 ישע 的直接含义。
- source_word: הברו שָׁמַיִם
  choice: 划分天宇的人
  rationale: 希伯来语形式疑难；在占星语境中很可能指把天空划分为区域以作推断的人。译文保留这一具体图像，并以脚注说明不确定性。
- source_word: הַחֹזִים בַּכּוֹכָבִים
  choice: 观望星辰的人
  rationale: חזה 有观看、察看或见异象之意；与“星辰”连用时指观星者或占星者。“观望星辰”不额外加入解释，同时保留其占星语境。
- source_word: מוֹדִיעִם לֶחֳדָשִׁים
  choice: 按月预告
  rationale: לֶחֳדָשִׁים 可表示逐月、为各月，也可能具体关联每月的新月。“按月预告”在正文中自然清楚，另一可能由脚注保留。
- source_word: מֵאֲשֶׁר יָבֹאוּ עָלָיִךְ
  choice: 将要临到你之事
  rationale: 该短语指未来会临到巴比伦的事情，语境中尤其含有灾祸与审判的威胁；译文不把“灾祸”明说，以免超出原文。
theological_decisions:
- issue: 巴比伦术士的身份与本节的语气
  choice: 将本节译为对观星、占星之人的讽刺性挑战：他们应当站出来拯救巴比伦。
  alternative: 将这些人泛化为普通谋士或智者，淡化占星含义。
  rationale: 以赛亚书47章的上下文明确涉及巴比伦的法术和邪术，而本节又提到天宇、星辰和月份，因此占星背景清楚。不过正文仍沿用原文的具体称谓，没有加入宗派性或系统神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“就让……吧”传达原文讽刺性的挑战；“疲惫不堪”体现完成式的结果状态。两个脚注标记均紧随其所说明的正文短语。
