  text: קָצַ֣פְתִּי עַל עַמִּ֗/י חִלַּ֨לְתִּי֙ נַחֲלָתִ֔/י וָ/אֶתְּנֵ֖/ם בְּ/יָדֵ֑/ךְ לֹא שַׂ֤מְתְּ לָ/הֶם֙ רַחֲמִ֔ים עַל זָקֵ֕ן הִכְבַּ֥דְתְּ עֻלֵּ֖/ךְ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/006.yaml
  text: I was angry with my people[a]; I profaned my inheritance and gave them into your hand. You showed them no mercy[c][b]; on the aged you made your yoke very heavy.
translation:
  language: zh_hans
  text: 我向我的子民发怒；我亵渎了我的产业[a]，把他们交在你手中。你毫不怜悯他们[b]；你把你的轭重重地压在老年人身上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亵渎”也可译作“使……成为俗物”或“玷污”。这里保留原文强烈的主动表达。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“你没有为他们置下怜悯”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“你使老年人负的轭极其沉重。”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַפְתִּי
  choice: 我……发怒
  rationale: קצף表示发怒、震怒；“发怒”是自然、庄重的现代汉语，也不额外强化原文语气。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 保留上帝与其约民之间的归属关系；“子民”在先知性语境中自然庄重。
- source_word: חִלַּלְתִּי
  choice: 我亵渎了
  rationale: חלל的Piel形表示亵渎、使之失去神圣地位或当作俗物；保留主动第一人称及其强烈的神学张力，不弱化为“任凭受辱”。
- source_word: נַחֲלָתִי
  choice: 我的产业
  rationale: נחלה指产业、基业或所得之份；“我的产业”保留约与归属的意象，并在现代汉语中较易理解。
- source_word: וָאֶתְּנֵם בְּיָדֵךְ
  choice: 把他们交在你手中
  rationale: 保留“交在手中”这一希伯来语权柄与控制的意象，同时符合汉语圣经文体。
- source_word: לֹא שַׂמְתְּ לָהֶם רַחֲמִים
  choice: 你对他们毫不怜悯
  rationale: 原文直译近于“你没有为他们置下怜悯”；译作“毫不怜悯”准确传达该习语，并体现否定语气。
- source_word: זָקֵן
  choice: 老年人
  rationale: 单数形式在此作集合或类别用；“老年人”自然清楚，不误导为某一个特定老人。
- source_word: הִכְבַּדְתְּ עֻלֵּךְ מְאֹד
  choice: 你把你的轭重重地压在……身上
  rationale: 保留“轭”和“重”的隐喻；用“压在……身上”使现代汉语通顺，并表达极重的压迫。
theological_decisions:
- issue: 上帝“亵渎我的产业”的主动表述
  choice: 保留“我亵渎了我的产业”这一主动第一人称陈述。
  alternative: 译作“我任凭我的产业受亵渎”或“我撇弃了我的产业”。
  rationale: 希伯来文是主动第一人称，描写上帝施行审判，将自己的子民交出去；不应为缓和神学张力而改成单纯许可。同时，后半节仍明确指出巴比伦因毫无怜悯、过度压迫而负有责任。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。“子民”“产业”“轭”保留先知文学的约语与压迫意象；句法适度汉语化，但不消解原文关于上帝审判与巴比伦责任并存的张力。
