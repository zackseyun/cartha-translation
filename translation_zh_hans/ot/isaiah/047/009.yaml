source:
  edition: WLC
  text: וְ/תָבֹאנָה֩ לָּ֨/ךְ שְׁתֵּי אֵ֥לֶּה רֶ֛גַע בְּ/י֥וֹם אֶחָ֖ד שְׁכ֣וֹל וְ/אַלְמֹ֑ן כְּ/תֻמָּ/ם֙ בָּ֣אוּ עָלַ֔יִ/ךְ בְּ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בְּ/עָצְמַ֥ת חֲבָרַ֖יִ/ךְ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/009.yaml
  text: 'But these two things will come to you in a moment[a], in one day: bereavement and widowhood. In full measure they will come upon you[b], in spite of your many sorceries and the great power of your spells.'
translation:
  language: zh_hans
  text: 然而，这两件事必在顷刻之间、在同一日临到你：丧子和守寡。它们必全然临到你，尽管你有许多邪术，咒语大有威力[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 末尾两句也可理解为：“因为你有许多邪术，咒语大有威力”，或“凭着你许多的邪术和威力极大的咒语”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְתָבֹאנָה
  choice: 必……临到
  rationale: 这是בוא的Qal未完成式第三人称阴性复数，以“这两件事”为主语；在预告审判的语境中表达将来，并以“必”传达其确定性。
- source_word: שְׁתֵּי אֵלֶּה
  choice: 这两件事
  rationale: 阴性数词与指示词指下文两种灾祸；补出“件事”符合现代汉语表达，不增加解释。
- source_word: רֶגַע
  choice: 顷刻
  rationale: 该词通常表示极短的时间；“顷刻”既凝练庄重，也突出灾祸突然而至。另有把它理解为“完全地”的读法，列入脚注。
- source_word: בְּיוֹם אֶחָד
  choice: 在一日之内
  rationale: 直译其时间含义，强调两种灾祸集中在同一天来到。
- source_word: שְׁכוֹל
  choice: 丧子
  rationale: 该名词指因儿女死亡而遭受丧亲之痛；在巴比伦被拟人为女子的语境中，“丧子”比宽泛的“丧亲”更准确。
- source_word: וְאַלְמֹן
  choice: 守寡
  rationale: 该名词表示寡居状态，与女性化的受话对象相符；“守寡”是自然简洁的现代汉语。
- source_word: כְּתֻמָּם
  choice: 完完全全
  rationale: 源于תמם，表达完整、充分；此处说明两种灾祸毫无减损地临到。
- source_word: בָּאוּ עָלַיִךְ
  choice: 它们必……临到你
  rationale: 动词虽为完成式，但承接前面的将来预告，可视为预言性完成式，以已经确定的方式描述未来审判；汉语用将来意义表达较清楚。
- source_word: בְּרֹב כְּשָׁפַיִךְ
  choice: 任凭你有许多邪术
  rationale: 将介词ב理解为让步用法，指出灾祸不因巴比伦拥有众多巫术手段而被阻止。“邪术”自然传达כְּשָׁפִים在此处的法术含义。
- source_word: בְּעָצְמַת חֲבָרַיִךְ מְאֹד
  choice: 你的咒语威力极大
  rationale: עָצְמָה表示力量，חֲבָרִים在此指咒语或符咒；译文保留名词“威力”并以“极大”传达מְאֹד的加强语气。
theological_decisions:
- issue: 末尾两个ב短语的语义功能
  choice: 让步：“任凭你有许多邪术，你的咒语威力极大”
  alternative: 因果：“因为你有许多邪术，并且咒语威力极大”；伴随：“带着你许多的邪术和威力极大的咒语”
  rationale: 上下文讥讽巴比伦倚仗邪术，重点在于这些手段仍不能阻止审判，因此让步义最贴合修辞走向；但介词本身允许其他理解，故在脚注中保留。
- issue: בָּאוּ在预言语境中的时态体意义
  choice: 按确定的未来事件译为“必……临到”
  alternative: 按完成意义译为“已经临到”
  rationale: 前句的未完成式明确预告将来；这里的完成式把未来审判表述为确定无疑。现代汉语若直译为过去，容易造成时间误解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“顷刻”“临到”保留先知宣告的凝练感；“丧子和守寡”延续原文对巴比伦的女性拟人。“完完全全”虽较口语化，却能清楚有力地表达灾祸毫无减损地来到。
