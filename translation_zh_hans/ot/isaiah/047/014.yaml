  terminology: “烧尽”“火焰”“炭火”均恰当。将“火焰的威势”调整为“火焰的威力”，能更准确、自然地表达原文“从……手中”的惯用义，而不把拟人化的“手”生硬直译。脚注保留疑难词组及其“取暖”理解，锚点置于“炭火”后恰当。
