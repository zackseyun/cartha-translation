  to: 看哪，他们已变得像秸秆，火把他们烧尽；他们不能救自己脱离火焰的威力。这里没有可供取暖的炭火[a]，也没有可坐在其前的火。
  rationale: 修订仅处理现代汉语的自然度与两处措辞的精确性：“秸秆”替代较少用的“禾秸”；“威力”明确表达“从火焰手中”所含的力量/掌控；“没有……也没有可坐在其前的火”直接对应原文的否定存在句，并避免添加“炉”的具体设施。保留原文及英文审计轨迹所承认的疑难短语脚注，不改变其暂定的“取暖”理解。
