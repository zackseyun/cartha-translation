  text: הִנֵּ֨ה הָי֤וּ כְ/קַשׁ֙ אֵ֣שׁ שְׂרָפָ֔תַ/ם לֹֽא יַצִּ֥ילוּ אֶת נַפְשָׁ֖/ם מִ/יַּ֣ד לֶֽהָבָ֑ה אֵין גַּחֶ֣לֶת לַ/חְמָ֔ם א֖וּר לָ/שֶׁ֥בֶת נֶגְדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/014.yaml
  text: Look[a], they have become like stubble; fire burns them up. They cannot rescue themselves from the power of the flame. This is no coal for warming oneself, no fire to sit before.
translation:
  language: zh_hans
  text: 看哪，他们已变得像秸秆，火把他们烧尽；他们不能救自己脱离火焰的威力。这里没有可供取暖的炭火[a]，也没有可坐在其前的火。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有可供取暖的炭火。”这一短语的希伯来文较难理解；大意是，这并非可供人取暖的小炭火，而是吞噬一切的烈焰。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 用现代汉语中庄重而简洁的提示语，保留原文强调并引人注意的作用。
- source_word: הָיוּ כְקַשׁ
  choice: 已如禾秸
  rationale: 完成式表达已经形成的状态；“禾秸”保留干燥、容易被火吞噬的农作物残梗意象。
- source_word: אֵשׁ שְׂרָפָתַם
  choice: 火把他们烧尽
  rationale: 原文短促有力；“烧尽”体现 שׂרף 在此处焚烧、吞噬的破坏性。
- source_word: לֹא יַצִּילוּ אֶת נַפְשָׁם
  choice: 他们不能救自己
  rationale: נֶפֶשׁ 在此指他们自身或性命；译为“救自己”自然清楚，也不额外引入教义色彩。
- source_word: מִיַּד לֶהָבָה
  choice: 脱离火焰的威势
  rationale: מִיַּד 字面为“从……手中”，在此表示掌控或威力；“威势”既传达惯用义，也保留拟人化色彩。
- source_word: אֵין גַּחֶלֶת לַחְמָם
  choice: 这不是可供取暖的炭火
  rationale: לַחְמָם 语义和形态较难，按 חָמַם“温暖”理解；本句把吞噬人的烈火与有益的家用炭火形成对照。
- source_word: אוּר לָשֶׁבֶת נֶגְדּוֹ
  choice: 也不是可以坐在前面的炉火
  rationale: אוּר 在此指火而非单纯的光；“炉火”自然呈现人坐在火前取暖的生活场景。
theological_decisions:
- issue: 审判意象的性质
  choice: 按上下文译作临到巴比伦谋士和行法术者的毁灭性审判
  alternative: 将火焰直接解释为普遍性的终末刑罚
  rationale: 本节处于针对巴比伦的先知性讽刺与审判宣告中；译文保留火焰意象的严厉程度，但不把其范围扩展为原文未明确说明的后世教义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“看哪”保留先知话语的强调语气；全句节奏短促，以呈现审判图像的力度。脚注标记紧随其所解释的困难短语。
