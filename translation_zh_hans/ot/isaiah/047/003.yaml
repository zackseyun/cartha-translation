  text: תִּגָּל֙ עֶרְוָתֵ֔/ךְ גַּ֥ם תֵּרָאֶ֖ה חֶרְפָּתֵ֑/ךְ נָקָ֣ם אֶקָּ֔ח וְ/לֹ֥א אֶפְגַּ֖ע אָדָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/003.yaml
  text: Your nakedness will be uncovered[a]; indeed, your disgrace will be seen. I will take vengeance[b], and I will spare no man.
translation:
  language: zh_hans
  text: 你的赤身必被揭露；你的耻辱也必被看见。我要施行报复，决不饶恕任何人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来语的句法和“相遇／介入”（פגע）一词的含义不易确定；也可译作“我不与任何人相遇”、“我不让任何人介入”，或“我不因任何人而罢手”。“人”（אָדָם）在这里很可能泛指任何人。
    reason: 保留 וְלֹא אֶפְגַּע אָדָם 的真实歧义，并说明 אָדָם 的泛指用法。
lexical_decisions:
- source_word: תִּגָּל
  choice: 必被露出
  rationale: 该词是 גלה 的尼法勒未完成式，表达被动的揭露；“必被露出”保留公开暴露与受辱的意象。
- source_word: עֶרְוָתֵךְ
  choice: 你的下体
  rationale: עֶרְוָה 可指赤身或身体隐私部位，并带有羞辱意味；“下体”在现代汉语中具体、庄重，也避免把原文意象抽象化为单纯的“羞耻”。
- source_word: גַּם
  choice: 也
  rationale: גַּם 连接并加强平行分句；汉语“也”自然地呈现递进关系，而不作过度解释。
- source_word: תֵּרָאֶה
  choice: 必被看见
  rationale: ראה 的尼法勒未完成式在此为被动意义，强调羞耻将公开可见。
- source_word: חֶרְפָּתֵךְ
  choice: 你的羞耻
  rationale: חֶרְפָּה 表示羞辱、耻辱或受人责难；“羞耻”与前句身体暴露的意象自然呼应。
- source_word: נָקָם אֶקָּח
  choice: 我要报仇
  rationale: 直译为“我要取报复”；“报仇”是现代汉语中简洁而有力度的固定表达，保留神施行报应的严肃语气。
- source_word: וְלֹא אֶפְגַּע אָדָם
  choice: 决不宽容任何人
  rationale: פגע 语义范围较广，末句也高度压缩；按审判语境，“不宽容任何人”表达不因人而收回或减轻报应。אָדָם 在此按泛指理解为“任何人”，而非特指男性。歧义另见脚注。
theological_decisions:
- issue: וְלֹא אֶפְגַּע אָדָם 的解释
  choice: 决不宽容任何人
  alternative: 不与任何人相遇；不让任何人介入；不因任何人而罢手
  rationale: 该短语在句法和词义上均有真实困难。正文采用与巴比伦受审判的语境最相合、且在汉语中自然的“不宽容任何人”，但不把这一解释当作唯一可能，脚注保留其他主要理解。
- issue: אָדָם 的指称范围
  choice: 任何人
  alternative: 人；男人
  rationale: 这里的单数 אָדָם 很可能具有泛指人的作用；译作“任何人”准确表达无人能逃避或阻止审判，并不额外限定性别。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“下体”保留原文具体而令人不安的受辱意象；“报仇”保持神谕的力度。句式简洁，对应希伯来诗句的两个平行部分。
