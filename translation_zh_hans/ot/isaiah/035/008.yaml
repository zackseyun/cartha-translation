id: ISA.35.8
reference: Isaiah 35:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָה שָׁ֞ם מַסְל֣וּל וָ/דֶ֗רֶךְ וְ/דֶ֤רֶךְ הַ/קֹּ֨דֶשׁ֙ יִקָּ֣רֵא לָ֔/הּ לֹֽא יַעַבְרֶ֥/נּוּ טָמֵ֖א וְ/הוּא לָ֑/מוֹ הֹלֵ֥ךְ דֶּ֛רֶךְ וֶ/אֱוִילִ֖ים לֹ֥א יִתְעֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/008.yaml
  text: And there shall be a highway there[a], and a road, and it shall be called the Holy Way. The unclean shall not pass over it, but it shall be for them[b]; whoever walks on the way—even fools—shall not go astray.
translation:
  language: zh_hans
  text: 那里必有一条大道，一条路；人要称它为“圣洁之路”。不洁净的人不得从上面经过；但这路是给他们的[a]。走这路的人，即使是愚昧人，也不会走入迷途[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来文较难确定；“但这路是给他们的”也可理解为“他必与他们同在”或“这路必属于他们”。
    reason: alternative_reading
  - marker: b
    text: “走入迷途”也可译作“迷路”或“犯错”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַסְלוּל
  choice: 大道
  rationale: 指修筑或垫高的道路；“大道”在现代汉语中自然，也保留预备好之通路的意象。
- source_word: דֶּרֶךְ
  choice: 路／圣洁之路
  rationale: 本节重复使用该词。“路”与“大道”并列时简洁自然；在命名公式中译作“圣洁之路”，保留其作为神圣通路的主题意义。
- source_word: הַקֹּדֶשׁ
  choice: 圣洁
  rationale: 该词与“路”构成属格关系，表示这路分别为圣、归于上帝；“圣洁之路”既庄重又易懂。
- source_word: יִקָּרֵא לָהּ
  choice: 人要称它为
  rationale: קרא 的尼法勒式在此表达被动命名。汉语用不定主语“人”来表达，且阴性后缀所指为“路”。
- source_word: טָמֵא
  choice: 不洁净的人
  rationale: 形容词在此作名词用；此译法同时容纳礼仪和伦理层面的不洁，不把含义限制在其中一面。
- source_word: יַעַבְרֶנּוּ
  choice: 不得从上面经过
  rationale: עבר 表示经过、穿行，宾语后缀指前述道路；此译保留行路的空间意象。
- source_word: וְהוּא לָמוֹ
  choice: 但这路是给他们的
  rationale: 句法高度压缩。按上下文把 הוּא 理解为“这路”，把 לָמוֹ 理解为“给他们／属于他们”；其他可能读法置于脚注。
- source_word: הֹלֵךְ דֶּרֶךְ
  choice: 走这路的人
  rationale: 分词结构泛指行在这条路上的人；译文简洁自然。
- source_word: אֱוִילִים
  choice: 愚昧人
  rationale: 该词指在判断和行为上愚昧的人，不只是智力有限者；“愚昧人”能保留其伦理意味。
- source_word: לֹא יִתְעוּ
  choice: 不会走入迷途
  rationale: תעה 可指游荡、迷路或犯错；“走入迷途”兼顾实际行路与比喻意义。
theological_decisions:
- issue: “不洁净的人”所指的不洁性质
  choice: 保留宽泛的“不洁净的人”，不限定为礼仪或道德上的不洁。
  alternative: “礼仪上不洁净的人”或“道德污秽的人”
  rationale: 先知书语境中的 טָמֵא 可以兼有礼仪和伦理意味；原文没有在此明确限定，译文不应消除这种张力。
- issue: 难解短语 וְהוּא לָמוֹ 的解释
  choice: 把代词理解为指道路：“但这路是给他们的”。
  alternative: “他必与他们同在”或“这路必属于他们”
  rationale: 此句极为简缩。让代词回指道路，最符合“不洁净的人”被排除、而这路为某群人所用的上下文，也自然衔接下句走这路的人；其他真实可能性在脚注保留。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“圣洁之路”保留命名的庄严感；“不洁净的人”避免把原文窄化为单一类别；“走入迷途”兼顾旅途图景和潜在的比喻意味。
