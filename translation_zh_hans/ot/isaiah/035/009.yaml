  source_fidelity: 草稿整体准确传达了本节的三重否定、道路的隐含所指以及结尾的“被救赎者”。不过“只有”带入原文未明说的排他性，而“行走其上”将末句的“那里”收窄为“在路上”；原文在此重复地点副词，宜保留其开放而强调的表达。
  naturalness: “凶猛的野兽”自然，但“凶暴的野兽”更能表达 פְרִיץ 所含的暴烈、强横意味。“在那里必找不到它”中的“它”在中文中指代不够清晰；改为“那里也找不到这种野兽”更自然明确。
  terminology: “蒙救赎的人”恰当保留 גאל 的被动救赎含义，并可与下一节 פדה 的“赎回／赎”词根区别。脚注 c 原称该词“意为‘救赎、赎回’”略不精确，因为此处为被动分词；应说明本节使用的词根或词语与下一节不同。
